  \n## 扩展阅读\n\nAlur, Deepak, John Crupi, and Dan Malks. 2003. *Core J2EE Patterns:\
  \ Best Practices and Design Strategies, 2nd ed.* New York: Prentice Hall.\n\nFowler,\
  \ Martin. 2002. *Patterns of Enterprise Application Architecture. Reading,* MA:\
  \ Addison-Wesley.\n\nGamma, Erich, Richard Helm, Ralph Johnson, and John Vlissides.\
  \ 1995. *Design Patterns.* Reading, MA: Addison-Wesley.\n\n![stock-photo-17860137-binary-code-bw-horiz-slice.tif](img/00003.jpeg)\n\
  \n# 第 12 章：构建部署层和表现层\n\nJava EE 应用程序的部署层和表现层供用户直接使用。\n\n表现层的对象产生用户物理可见并使用的页面或屏幕。表现层涉及几个方面：静态内容、动态内容和导航。对于\
  \ Java EE 应用程序，HTML 页面通常提供静态内容； JSP 和 servlet 的组合通常提供动态内容。对于需要特殊效果（例如鼠标悬停）的应用程序，可以使用\
  \ Javascript 结合静态或动态生成的 HTML。用户使用页面上的控制控件（例如按钮）进行页面导航。\n\n部署层的对象（我称之为部署包装器）将业务逻辑层的内容“发布”到其他应用程序。部署层构造的示例包括\
  \ Web 服务和企业豆（Enterprise Beans）。我曾想将这一层称为“服务”层，但这会导致人们对为什么这一层包含企业豆产生困惑。部署层为其他应用程序提供远程调用能力。例如，通过发布\
  \ Restful Web 服务来支持移动应用程序并不罕见；这些服务将是部署层的一部分。\n\n如 Web 服务和企业豆等部署包装器刻意保持相对简单和精薄，因为它们比普通的\
  \ Java 类开发和维护更困难、更耗时。简单精的部署包装器不容易出现 bug。\n\n图 12.1 展示了表现层和部署层的角色。\n\n### 图 12.1：Java\
  \ EE 应用程序中的表现层和部署层\n![Chap13-Presentation-Deployment-SoftwareLayers.eps](img/00052.jpeg)\n\
  \n## Web 应用框架考虑\n\n大多数架构师利用第三方框架来辅助 Web 服务和用户界面的开发。如果没有这些框架，这些层中代码的数量和复杂性将极高。因此，对于应用程序架构师而言，关于这些软件层最大的交付就是决定将使用哪些框架。\n\
  \n某些组织在企业层面为这些层做出框架选择。这样做有充分的理由。大多数框架都有显著的学习曲线。在整个组织范围内利用同一套框架集可以优化学习这些框架花费的时间。它也让开发者在应用程序之间的流转变得更容易、成本更低。此外，通过整合正在使用的框架，更容易在应用程序之间共享通用代码并获得更高的复用率。\n\
  \n某些组织将框架选择留给各个应用程序团队。在这些类型的组织中，应用程序架构师要么决定使用哪些框架，要么促进决策的做出。常用的表现层框架包括 `Spring MVC`、`Apache\
  \ Struts`（或 `Struts 2`）、`Java Server Faces`、`Google Web Toolkit`、`Freemarker`、`Apache\
  \ Velocity` 等许多。常用的 Web 服务框架包括 `Apache Axis (2)`、`Apache CXF`、`Glassfish Metro`\
  \ 等。\n\n一旦确定了框架，应用程序架构师通常会提供使用指南。这些指南应该涵盖交叉关注点，如错误处理、事务日志、配置和构建/部署方法。此外，我通常会提供几个工作示例。\n\
  \n部署层和表现层有几个共同的考虑因素。最重要的考虑因素之一是代码的有效复用。每个网站都有在整个站点反复使用的图形。具有复用视觉“组件”的能力可以大大优化开发时间。应用程序的框架选择在很大程度上决定了表现层创建视觉组件和有效复用代码的策略。某些框架对创建和复用视觉组件的支持比其他框架更好。框架的选择是说明技术产品选择过程的极佳示例，以至于我在“技术产品选择”章节中使用了它作为示例。关于如何使用特定\
  \ Web 框架（如 `Spring MVC`、`Java Server Faces` 或 `Struts`）进行编码的内容超出了本书的范围。\n\n## 安全性考虑\n\
  \n另一个重要的考虑因素是安全性。大多数组织会为企业提供安全架构，并提供定义用户以及授权用户特定 Web 应用程序并分配安全角色和安全组的过程。大多数开发者可以假设用户已经通过身份验证并被授权使用所调用的应用程序。开发者可以假设\
  \ Java EE 容器会向他们提供身份验证的用户身份及其被分配的安全角色。\n\n\n\n\nJava EE 容器将强制执行应用程序中 `web.xml` 配置文件中定义的安全约束。安全约束将指定受保护的\
  \ URL，并指示哪些角色允许访问这些 URL。例如，如果你的应用程序中的所有 URL 都需要分配 `Manager` 角色，你可以在应用程序的 `web.xml`\
  \ 文件中添加如下所示的安全约束：\n\n```xml\n<security-constraint>\n  <display-name>Restrict to\
  \ those with Manager authority.</display-name>\n  <web-resource-collection>\n  \
  \  <web-resource-name>Protected Area</web-resource-name>\n    <url-pattern>*.jsp</url-pattern>\n\
  \    <url-pattern>*.html</url-pattern>\n  </web-resource-collection>\n  <auth-constraint>\n\
  \    <role-name>Manager</role-name>\n  </auth-constraint>\n</security-constraint>\n\
  ```\n\n如果你的应用程序中有公开的 URL，通常的做法是让所有受保护的 URL 具有共同共同模式，以便在安全约束中指定它们（例如 `/secure/*`）。然而，许多应用程序除了保护特定的\
  \ URL 模式之外，还有额外的安全需求。\n\n虽然 Java EE 容器会从 `HttpServletRequest` 提供登录用户凭据或用户 ID，但应用程序通常需要关于用户的额外信息（例如全名、电子邮箱地址等）。例如，某些应用程序会显示登录用户的名称。某些应用程序需要发送电子邮件，并在其中使用用户的全名和邮箱地址。此外，表示层之外的其他层也可能需要这些信息。例如，需要对用户操作保留审计轨迹的业务逻辑也需要登录用户的用户\
  \ ID。\n\n由于大多数应用程序都需要获取当前登录用户的知识，我通常会在应用程序架构中引入一个 `User context`（用户上下文），并使用 Servlet\
  \ 过滤器（servlet filter）来填充它的内容。这一构想与第 10 章中引入的事务管理过滤器相似，该过滤器维护了一个 `TransactionContext`。表示层中需要登录用户相关信息的类将利用该用户上下文。例如：\n\
  \n```java\nString userId = UserContext.getCurrent().getUser().getUserId();\n```\n\
  \n一个用于维护应用程序用户上下文的过滤器示例可以在列表 12.1 中找到。请注意，所需的用户信息包含在一个为此目的而创建的值对象中。\n\n### 列表 12.1：用户上下文管理过滤器示例逻辑\n\
  \n![listing12.1.tif](img/00053.jpeg)\n\n源：`/src/j2ee/architect/handbook/chap12/UserContextManagementFilter.java`\n\
  \n如果你的应用程序逻辑会为不同安全角色的用户显示不同的选项，那么在实践中，你能够为了测试目的模拟不同的用户。例如，管理员可能会看到额外的菜单选项，而员工则没有。我们可以扩展用户上下文范式来处理对其他用户的模拟。列表\
  \ 12.2 了一个了一个如何扩展用户上下文概念以允许用户仿真的示例。为了测试目的，只需将模拟的用户值对象设置为你想要测试的值即可。\n\n### 列表 12.2：用户模拟示例逻辑\n\
  \n```java\npublic class UserContext {\n  public UserVO getUser() {\n    if (this.emulatedUser\
  \ != null) {\n      return this.emulatedUser;\n    }\n    return this.currentUser;\n\
  \  }\n  public void setEmulatedUser(UserVO emulatedUser) {\n    this.emulatedUser\
  \ = emulatedUser;\n  }\n}\n```\n\n源：`/src/j2ee/architect/handbook/common/user/UserContext.java`\n\
  \n### 错误处理考量\n\n表示层编码中经常出现的一个话题是针对用户可以纠正的异常进行错误处理。例如，许多网站允许你注册用户。这些网站大多数对你选择的用户名有要求。例如，许多站点要求至少八个字符。如果用户输入的用户名太短，用户可以很容易地修正输入并重新提交注册。在这些可纠正的错误中，我们不希望抛出运行时异常（runtime\
  \ exception）。相反，我们希望显示一条消息，告诉用户哪个字段错误以及正确答案的要求是什么。\n\n大多数 Web 框架都有处理可纠正错误和用户消息的策略。然而，处理用户消息的通用策略往往并不美观。此外，业务逻辑层可能会识别出可纠正的错误。让业务逻辑层感知到所使用的特定\
  \ Web 框架以便使用框架策略是不理想的，因为这违反了关注点分离原则。业务逻辑层不应该感知其执行上下文。一种策略是创建一个自定义的受检异常（例如 `CorrectionsRequiredException`），它包含有关错误的信息和适当的消息。表示层将被迫捕获该异常并为用户正确地格式化错误消息。这需要多做一些工作，但它为处理可纠正错误提供了灵活性。\n\
  \n### 支持移动设备\n\n由于支持移动设备是如今大型 Java EE 应用程序的要求，它值得关注。移动设备主要可以通过两种方式获得支持：通过专门为较小屏幕设计的网站访问移动浏览器；以及作为支持原生移动设备应用程序的服务集。提供一个适应较小屏幕的\
  \ Java EE 站点通常是最简单的，因为它只影响表示层。对于简单的站点，可以通过为不同显示类型使用不同的 CSS 样式表，使得大、显示尺寸可以使用相同的标记。对于那些不熟悉的人，这可以使用\
  \ `media` 属性来实现。以下是几个简单的示例：\n\n```html\n<link rel=”stylesheet” type=”text/css” href=”stylesheet.css”\
  \ media=”screen” />\n<link rel=”stylesheet” type=”text/css” href=”stylesheet-small.css”\
  \ media=”handheld” />\n```\n\n`media` 属性还支持根据显示高度和宽度分配样式表，以及各种比 screen 和 handheld\
  \ 更具体的特定特征。\n\n在实践中，这种技术仅在简单站点上有效。对于具有大量控件的复杂站点，通常的做法是针对较小屏幕设备精简站点（提供更少的内容和更少的功能）。对于这些站点，会有两组或更多标记。设备将被重定向到最适合其屏幕尺寸显示的标记。实现这种重定向有多种方法。我见过最简单是通过\
  \ Javascript。\n\n```javascript\n<script type=”text/javascript”>\n<!--\nif (screen.width\
  \ <= 700) {\n  window.location = “http://mobile.mysite.com”;\n}\n//-->\n</script>\n\
  ```\n\n另一种方案是提供 Web 服务，允许原生移动设备应用程序获取数据并提交事务。这种选项可以提供更健壮的终端体验，但需要更多的工作且成本更高。提供支持原生移动应用程序的\
  \ Java EE 站点将很大程度上影响部署层。大多数移动开发者认为 Restful Web 服务比 SOAP 更容易使用。此外，大多数移动开发者认为 JSON\
  \ 格式数据比 XML 更容易使用。\n\n\n\n\n\n有多个产品支持读取和格式化 JSON 数据。这种产品选择应该像对待任何其他产品选择一样对待；我将在下一章提供关于如何做出技术产品决策的指导。该领域两个热门的开源产品是\
  \ Jackson ([`jackson.codehaus.org`](http://jackson.codehaus.org)/) 和 GSON ([`code.google.com/p/google-gson/`](https://code.google.com/p/google-gson/))。同样，还有多个产品提供\
  \ Restful Web 服务支持。该领域的两个热门的开源产品是 Apache CXF ([`cxf.apache.org/`](http://cxf.apache.org/))\
  \ 和 Restlet ([`restlet.org/`](http://restlet.org/))。\n\n原生应用要求用户进行身份验证并不罕见。移动应用程序如何管理用户验证取决于所选择的安全产品。移动应用程序维护带有安全令牌的\
  \ Cookie 以供服务器进行查询，或者提供凭据，这并不寻常。无论如何，与移动设备的所有通信至少应该经过加密（`https`）。\n\n## 编码规范\n\n\
  保持每个 Web 服务、EJB 或表示层类的轻量化。这些类的测试需要容器。虽然测试这些类的环境通常是可用的，并且可以针对这些类编写单元测试，但对这些类部署更改通常更耗时。如果你想优化开发时间，建议将此层级的工作委托给本地可调试且不需要容器服务的类。\n\
  \n保持 HTML 标记（例如 JSP 页面）中嵌入逻辑的轻量化。虽然标签库、EL 表达式和其他功能使得在 HTML 标记中嵌入复杂逻辑成为可能，但要为这些页面编写单元测试以确保它们对用户而言运行正常是困难且耗时的。标记中任何增加测试用例数量的因素，其对持续维护成本的增加，远大于在易于编写和维护全面单元测试的类中添加这些测试用例。当然，对于许多应用程序来说，其中某些内容是不可避免的。在你有选择将复杂逻辑委托给更易于测试的类的地方，请尽管这样做。\n\
  \n## 常见错误\n\n将业务逻辑放在表示层或部署层类中。业务逻辑往往会使 JSP 和 servlet 变得复杂且难以维护。此外，这种逻辑在其他语境下不易于复用。因此，整合在这一层中的业务逻辑更有可能被复制并违反“不要重复”（DRY）原则。\n\
  \n没有利用模板技术。大多数表示层产品具有模板功能，这使得更易于复用 HTML 标记并遵循 DRY 原则。这将使表示层不那么冗长，且通常更容易维护。例如，我无法想象在不使用\
  \ Facelets 模板功能的情况下实现一个 JSF 应用（该功能在 2.0 版本中被正式纳入 JSF 规范）。Struts 作为另一个热门的表示层产品，也提供了模板功能。不利用模板技术往往会导致大量重复的\
  \ HTML 标记。\n\n![stock-photo-17860137-binary-code-bw-horiz-slice.tif](img/00003.jpeg)\n\
  \n# 第 13 章：做出技术产品选择\n\n架构师引导技术产品的选择过程是常见现象。有时，选择的产品被终端用户直接使用。有时，选择的产品是集成到应用程序中的库，以节省开发时间和支持资源。我的经验是，大多数组织在技术选择上并没有非常结构化或组织化。在本章中，我将介绍做出技术产品决策的策略。由于在许多\
  \ Web 框架中选择哪一个是一个常见的技术产品选择，我将以此作为示例。\n\n选择 Web 框架是 Java EE 应用所做的最重要的产品选择之一。框架的选择并不是一个容易的决策，这些选择对开发和维护成本的潜在影响是巨大的。鉴于这些决策以及整体产品选择的重要性，让我们花些时间详细说明做出这类决策的策略。\n\
  \n## 产品决策标准\n\n对于 Web 服务或 Web 表示框架，有很多产品可选。我们需要一种方法来对这些产品进行评分，并希望将它们区分开到产生逻辑选择的程度。我们评估这些框架的“属性”本质上就变成了决策标准。\n\
  \n通常以某种方式列入名单的常见决策标准如下：\n\n*   目标契合度 (Fitness for Objective)\n*   易用性 (Ease of Use)\n\
  *   市场份额 (Market Share)\n*   切换成本 (Switching Costs)\n*   预期成本节省（与自定义解决方案相比）（Expected\
  \ Cost Savings）\n*   社区活动水平 (Level of Community Activity)\n*   性能 (Performance)\n\
  *   依赖需求 (Dependency Requirements)\n*   许可 (Licensing)\n\n并非所有这些标准的权重相等；某些可能比其他更重要。我通常会对这些标准中的每一个赋予高、中、低权重。此外，我通常根据这些标准对每个产品选择进行\
  \ 1 到 10 的排序，10 分为最高评分。\n\n**目标契合度。** 所选的产品是为了你的预期用途而设计的吗？其他人是否以类似的用途使用它？这一标准支持“顺流而为”（Swim\
  \ with the stream）原则。通过按照设计方式使用产品，你可以增加应用程序从未来产品改进中受益的可能性。例如，关系型数据库产品针对第三范式进行了优化。在关系数据库早期，连接性能是一个频繁的问题。然而，随着时间的推移，由于关系数据库理论激励规范化设计，数据库产品解决了这些性能问题。使用规范设计的用户从这些改进中受益最多。\n\
  \n这类标准通常被表述为特定功能的列表。例如，在选择内容管理系统时，衡量“目标契合度”的功能列表可能包括拼写检查、审计/更改历史、所见即所得（WYSIWYG）编辑能力等。此功能列表旨在帮助判断所选产品是否符合你的使用预期。\n\
  \n使用 Web 表示框架举例说明，假设业务目标是将表示设计委托给精通 HTML 的专家（通常这类人才成本更低且更充足）。基于这一目标，任何利用 HTML 技能的表示产品将具有优势。选择\
  \ Apache 的 Wicket ([`wicket.apache.org/`](http://wicket.apache.org/))，因为它高度依赖 Java\
  \ 编码技能，不如基于 HTML 的框架那样符合业务目标。\n\n你也有最好的机会利用他人的经验。经常，问题（以及希望的解决方案）出现在互联网博客中。如果你的使用方式与产品的设计方式一致，你遇到的问题被先报告并解决的概率就会增加。\n\
  \n**易用性。** 选择易用的产品可以优化培训成本，缩短开发和支持时间，并可能缩短从报告缺陷到修复的平均时间。易用性还让各种开发者可以使用产品，并为管理层提供了更大的灵活性。\n\
  \n让我们考虑两端的例子。对于为构建的应用程序接收详细 HTML 页面设计的开发团队来说，依赖 HTML 模板的 Web 表示框架（如 `JSP`、`Freemarker`、`Velocity`\
  \ 和 `Java Server Faces`）将比纯 Java 代码的 `Wicket` 更易用。\n\n\n\n\n\n### 市场份额\n\n选择使用更广泛的产品可以更容易招募具有该产品以往经验的开发者。这也增加了在开发过程中遇到问题时，在互联网上找到解决方案的概率。此外，市场份额低的产品极有被遗弃的风险，因此将不再得到增强。是的，如果该产品是开源的，你可以在内部对其进行增强，但很少有组织会资这样的项目。在这种情况下，通常切换产品会更好。\n\
  \n市场份额数据通常很难获得。我发现了两个衡量市场份额的指标：搜索引擎关键词搜索数据和职位招聘数据。搜索引擎关键词搜索数据可以从 Google Trends ([`www.google.com/trends/explore`](http://www.google.com/trends/explore))\
  \ 获取。职位招聘数据的良好来源可以在 [www.indeed.com](http://www.indeed.com) 的趋势页面 ([`www.indeed.com/jobtrends`](http://www.indeed.com/jobtrends))。例如，让我们看看图\
  \ 13.1 所示的几个 Web 展示框架的流行程度。\n\n正如你所预期的，Apache Struts 是市场领导者，其次是 Java Server Faces\
  \ (JSF) 和 Spring MVC。注意，由于许可限制，我无法展示职位招聘数据，该数据显示 Spring MVC 居第二，JSF 居第三。职位招聘数据记录的趋势与关键词搜索数据之间有时存在差异；你必须判断哪种结果更真实地代表市场份额。在我搜索中包含的所有其他\
  \ Web 展示框架与这三个相比，市场份额都很小。\n\n图 13.1：Web 展示框架的搜索引擎关键词趋势数据\n\n![Chap-13-Web-Presentation-Frameworks-Figure-13.1-bw.tif](img/00054.jpeg)\n\
  \n来源：Google Trends，取自 2013 年 11 月 17 日。\n\n我的目的不是为 Struts、Spring MVC 或 JSF 做广告。我的目的是说明你可以多容易地获得特定框架或产品的市场份额估值；而且这些信息应该是决策中的一个考虑因素。如果你使用了此处未列出的\
  \ Web 展示框架，我邀请你进行自己的比较，包括该框架在内。\n\n作为另一个例子，我为几个常用用于 Java EE 应用的 Web 服务框架运行了类似的比较。我在图\
  \ 13.2 中展示了它。\n\n图 13.2：Web 服务框架的搜索引擎关键词趋势数据\n\n![Chap-13-Web-Service-Frameworks-Figure-13.2-bw.tif](img/00055.jpeg)\n\
  \n令人惊讶的是，尽管该产品已重写并发布为 `Axis2`，Apache Axis 仍然是市场领导者。Axis 产品最后发布是在 2006 年，所有的开发工作都已转向\
  \ `Axis2`。另一个 Apache 产品 `CXF` 目前位居第二，但实际上它很快就会成为市场领导者。这一信息应该是做 Web 服务框架决策时的一个考虑因素。\n\
  \n### 切换成本\n\n无论你今天选择什么产品，你的需求都可能发生变化，或者你选择的产品在未来可能会贬值或过时。在这种情况下，任何使用该产品的应用程序都将需要改为使用竞争产品。因此，那些更容易切换到使用竞争对手的产品，应该比那些不能切换的产品获得更高的评分。\n\
  \n切换成本没有客观的衡量标准。我通常根据对产品文档示例的简要调查，给出高、中、低评分。在 Web 服务框架和 Web 展示框架的情况下，所有产品的切换成本都很高，导致产品获得低评分。由于这个因素无法区分任何产品，因此在讨论\
  \ Web 展示或 Web 服务框架时它并不重要。我提到它是因为它可以区分其他类型的产品，并且应该被考虑。\n\n### 预期成本节约（相对于自定义解决方案）\n\
  \n自定义解决方案始终是一个选项，但并不总是具有吸引力。为了估算选择一个产品或另一个产品的预期节省，你需要一个比较基准。也就是说，选择产品 `1` 而不是产品\
  \ `2` 将为我们节省 200 小时的工作。但是，为了提供这样的估值，你需要一个可以比较的产品。我通常选择自定义/自有的解决方案作为比较产品。\n\n尽管如此，自定义解决方案——例如用于发布\
  \ Web 服务——并不意味着要在 `Apache Axis2` 产品中复制所有功能。它的意思是产生一种足够好的发布方法，仅用于发布你项目所需的内容。\n\n\
  如果你为所有考虑的产品都选择相同的比较基准产品（例如自定义解决方案），那么预期的节省就具有可比性了。节省最多的产品将评分最高，节省最少的产品评分最低。\n\n\
  例如，在最近的一个客户处，我们需要实实现一个单点登录 (SSO) 产品。在评估过程中，我们估算自定义构建 SSO 解决方案大约需要 1200 小时的开发。我们对每个开源候选产品都进行了类似的实现成本估算。我们最终选择了\
  \ `JOSSO` (www.josso.org)，通过我们可以对其进行轻微定制并在整个企业范围内实施，总成本约为 200 小时。\n\n### 社区活跃度\n\
  \n如果你选择的一些产品是开源项目，那么选择那些活跃维护的项目比选择那些未维护的项目风险更小。对于未维护的项目，产品过时的概率要大得多。此外，你很难希望在使用产品时遇到的\
  \ Bug 能被修复，或者产品功能能得到增强。\n\n衡量社区活跃度的简单方法之一是统计过去三年每年的发布次数。这些信息在大多数开源项目中都是可获得的。另一种方法是衡量过去三年内发布之间的平均时间。我对三年的选择是随意的。重要的是你要以相同的方式衡量每个产品。\n\
  \n如果你担心某个项目可能通过发布更多但更少的功能来扭曲统计数据，你可以始终衡量同一时期发布的缺陷和改进数量。然而，获取这些信息虽然可行，但需要更多精力。此外，这偏离了重点。\n\
  \n重要的是检测出活动很少或没有的项目并给予它们较低的评分。例如，`Apache Axis2` Web 服务产品在过去三年中发布了 9 次。`Apache CXF`\
  \ Web 服务产品在过去三年中发布了 13 次。从这些统计数据可以看出，这两个项目都非常活跃。在社区活跃度方面，我会给它们相同的评分，尽管发布次数有细微差异。\n\
  \n### 性能\n\n是的，性能是一个考虑因素。但是，你可能不需要花费精力自己去构建和运行这些产品的性能比较。对于主流框架和产品，通常可以找到发布的性能比较。即使这些比较是基于产品的旧版本，如果已有发布的报告，自己构建和运行性能基准测试的时间和精力通常是不值得的。\n\
  \n\n\n\n\n例如，在互联网上搜索 Web 服务 `Axis2` 和 `CXF` 的性能基准时，我发现了四个独立的账户对这两个产品的性能都给出了正面评价，并指出不同的数据绑定策略之间存在细微差异。我没有列出这些来源，因为当你读到这段文字时，它们已经过时了；你可以进行自己的研究。我的观点是，不需要自己花费精力构建一套严密的测试，就可以收集到产品间性能对比的信息。\n\
  \n### 依赖要求\n依赖要求越少，库版本冲突的机会就越小。库版本冲突是指一个产品需要库的 `x` 版本，而另一个产品需要 `y` 版本。例如，假设一个产品需要\
  \ `Apache Commons Logging V1.0`，而另一个需要 `V1.1`。由于两者之间存在 API 差异，使用其中某款产品的产品可能会在运行时遇到“未找到方法”的错误。\n\
  \n一个名为 `JarAnalyzer` 的开源产品（[`www.kirkk.com/main/Main/JarAnalyzer`](http://www.kirkk.com/main/Main/JarAnalyzer)）可以让你了解\
  \ jar 文件的依赖关系。然而，它的分析还不够深入，无法告诉你可能导致我上面描述的那种运行时链接问题的方法签名问题。\n\n在 Web 服务和 Web 表现框架方面，大多数选择都包含大量的依赖项。我知的唯一例外是\
  \ `Freemarker`（[`freemarker.sourceforge.net/`](http://freemarker.sourceforge.net/)）模板引擎，它被一些人用来生成动态\
  \ HTML 而不是 `JSPs`。尽管如此，`Freemarker` 作为一种 Web 表现框架还有其他局限性，在考虑其他一些决策标准时，它可能不是你的最佳选择。\n\
  \n### 许可\n许多组织对接受的开源许可类型有指南。这对于将作为产品销售的软件来说尤为如此，因为某些开源许可带有限制条件。大多数组织都会有一份他们接受的开源许可标准列表，以及一个根据需要评估新许可的流程。\n\
  \n### 做出产品决策\n\n在对特定产品进行研究时，通常涉及多个人。通常，是由应用架构师来促进此类决策的。在第一次会议上，我通常会建议一组功能/决策标准（参考上述描述的概念），并对这些产品将根据哪些标准进行判断达成大致共识。在这次会议之后，可能会提出并讨论额外的标准，这是可以接受的。\n\
  \n此外，我建议了一份应该考虑的产品列表，并对该列表达成大致共识。在这一阶段，如果一个产品看起来有潜力满足你项目的业务需求，它就应该被添加到列表中。随着不同功能的识别和衡量，糟糕的建议将在后续阶段被排除。你也不希望自己看起来像是在通过单方面预先排除某人的产品建议来操纵选拔过程。\n\
  \n下一个讨论的话题是每个标准应给予的权重。正如我在上一个节中提到的，某些标准没有其他标准那么重要。例如，对于大多数产品决策来说，用途的适用性比依赖要求重要得多。\n\
  \n许多开发者在做出框架决策时，会高估性能的重要性。性能的细微差异对大多数组织来说并不是实质性的。仅仅因为一个 Web 服务框架在特定测试中比另一个略有优势，并不意味着你一定应该选择性能最高的产品；还需要考虑其他标准。\n\
  \n例如，我曾参与过一个评估内容管理系统（CMS）产品的过程，用于我的一位客户的公共网站。这次选择是在 2010 年夏天进行的。读者应该注意，该客户已经在使用一个\
  \ CMS 产品，但该产品具有很大的局限性。在进行这项研究的人的第一次会议上，我们确定了一个待评估的产品初始列表、一个将检查和评估的功能和特征列表，以及分配给每个功能和特征的权重。该列表中包含了当前使用的\
  \ CMS 产品，因为现状始终是一个选项。\n\n项目范围被管理层限制为开源产品，因为没有资金用于购买专有软件。此外，管理层确定了评估的任务组人员和时间限制。在考虑这些指导方的情况下，通过小组共识确定纳入评估的产品列表如表\
  \ 13.1 所示：\n\n#### 表 13.1：CMS 产品决策中包含的产品\n\n| 产品 | 版本 |\n| :--- | :--- |\n| OpenCms\
  \ | 7.5 |\n| Drupal | 6.17 |\n| Joomla | 1.5.318 |\n| WordPress | 2.9.2 |\n| Alfresco\
  \ | 3.3 |\n| DotNetNuke | 5.4.2 |\n| Typo3 | 4.3 |\n\n所评估的产品版本是评估*开始*时这些产品的当前稳定版本。本可以更多可以考虑的产品，但考虑到任务组的人数和实施的时间限制，包含\
  \ CMS 领域的每一个产品将过于耗费。因此，这个精简列表是由该任务组成员的共识决定的。\n\n此外，还确定了产品功能和特征列表，以及分配给这些功能的初始权重。这些功能和权重的列表位于表\
  \ 13.2 中。此外，我还列出了每个单独功能列表所支持的决策标准类型。\n\n#### 表 13.2：CMS 产品决策中评估的功能\n\n| 决策标准类型 |\
  \ 功能 (1–10) | 优先级 (高/中/低) |\n| :--- | :--- | :--- |\n| 依赖要求 | 单点登录兼容性 | 高 |\n| 依赖要求\
  \ | 支持的数据库 | 中 |\n| 依赖要求 | 支持的平台 | 中 |\n| 易用性 | 内容组织 | 高 |\n| 易用性 | 友好 URL 支持 |\
  \ 低 |\n| 易用性 | 图像缩放支持 | 低 |\n| 易用性 | 宏语言 | 中 |\n| 易用性 | 菜单支持 | 高 |\n| 易用性 | 站点地图支持\
  \ | 中 |\n| 易用性 | 拼写/语法检查 | 中 |\n| 易用性 | 模板支持 | 高 |\n| 易用性 | 所见即所得编辑 | 高 |\n| 用途适用性\
  \ | 广告管理 | 低 |\n| 用途适用性 | 内容审批 | 高 |\n| 用途适用性 | 内容调度 | 低 |\n| 用途适用性 | 死链检测 | 低 |\n\
  | 用途适用性 | 导入/导出支持 | 高 |\n| 用途适用性 | 国际字符支持 | 中 |\n| 用途适用性 | 在线管理 | 高 |\n| 用途适用性 |\
  \ RSS 支持 | 高 |\n| 用途适用性 | 搜索支持 | 高 |\n| 用途适用性 | 版本控制 | 高 |\n| 社区活跃度 | 自 2008 年 1\
  \ 月以来的发布次数 | 中 |\n| 市场份额 | 市场份额（以招聘占比作为指标） | 中 |\n| 所有权影响 | 商业培训选项 | 中 |\n| 所有权影响\
  \ | 自定义扩展/插件支持 | 高 |\n| 所有权影响 | 文档 | 中 |\n| 所有权影响 | 使用许可 | 中 |\n| 所有权影响 | 供应商支持可用性\
  \ | 高 |\n| 所有权影响 | Windows 支持 | 高 |\n| 性能 | 多用户并发编辑 | 高 |\n| 性能 | 支持当前页面数的 3 倍 |\
  \ 高 |\n| 性能 | 支持当前的公共网站事务量（页/秒） | 高 |\n| 安全性 | 审计追踪 | 中 |\n\n\n\n\n\n| 切换成本 | 动态内容\
  \ | 高 |\n| :--- | :--- | :--- |\n| 切换成本 | 静态内容 | 中 |\n\n首次会议的下一个讨论主题是根据已选标准分配产品评估工作。通常，我建议使用\
  \ 10 到 1 分的评分制，对每个产品的每项标准进行打分，其中 10 分最高，1 分最低。至于工作分配，有几种策略，每种策略都有其优缺点。\n\n第一种策略是分配每人负责根据每项标准对一个或多个产品进行完整排名。以\
  \ Web 服务为例，让一个人根据所有确定的决策准则对 `Apache Axis2` 产品进行评分。这种做法的优点是最大限度地缩短团队成员的学习曲线，并高度化地利用他们所积累的知识。它的缺点是产品之间会产生评分标准的差异。也就是说，为\
  \ `Axis2` 评分切换成本的人与为 `CXF` 评分的人不是同一个人。这些产品的评分可能不同是因为评估者不同，而不是因为产品本身的差异。\n\n另一种策略是将所有决策标准分配给团队（所有成员）。他们的职责是根据每项标准评估所有产品。这增加了以一致方式对不同产品进行评分的可能性。它还保证了任何一个评审者都不会因为私人的考虑而在小组中对某个特定产品产生实质性的偏见。这里的缺点是每个团队成员都必须了解每个产品，这在时间成本上会更高。然而，我个人更倾向于这种方法。通常，这类决策足够重要，值得投入额外的时间。此外，如果存在争议，它还提供了质疑其他团队成员评分的机会。\n\
  \n一旦做出了用于演示和部署封装（如 Web 服务）的产品决策，就需要将这些产品集成到你的项目中，并为它们的使用建立使用和编码准则。\n\n![stock-photo-17860137-binary-code-bw-horiz-slice.tif](img/00003.jpeg)\n\
  \n# 第 14 章：构建架构组件\n\n架构组件是足够通用、适用于许多应用程序的类和静态工具类。当你确定了对架构组件的需求后，第一步通常应该是去市场上寻找满足该需求的组件。我建议从检查开源替代方案开始你的市场搜索。如果你有足够的预算，也应该考虑商业替代方案。开源替代方案可能与商业软件一样好，但通常更容易获取，且对预算更友好。在本章的最后，我将重点介绍我最喜欢的一些开源网站。\n\
  \n在我的项目中经常出现的开源项目如下：\n\n* `Apache Commons` ([`commons.apache.org`](http://commons.apache.org/))\n\
  * `Lang`—通用 Java 语言工具类\n* `IO`—`java.io` 中类的常用工具类\n* `BeanUtils`—用于操作 Java Bean\
  \ 和 POJO 类的工具\n* `Collections`—用于操作 `Collection` 类（如 `Maps` 和 `Sets`）的工具\n* `DbUtils`—用于简化\
  \ `JDBC` 代码的工具\n* `Apache Log4J` ([`logging.apache.org/log4j/`](http://logging.apache.org/log44/))\n\
  \n组件软件（无论是开源还是商业）的一个问题是质量的极端差异。某些组件易于理解和使用；另一些则晦涩且不切实际。在本章中，我列出了开发者通常认为高质量组件具备的能力。你可以使用这个列表来评估开源或商业组件软件。我还提供了一系列技巧和技术，帮助你创建具有这些能力的自有架构组件。\n\
  \n架构组件的作用如图 14.1 所示。\n\n图 14.1：在分层架构中使用架构组件\n\n![Chap-14-SoftwareLayers-Architecture-Highlighted.eps](img/00056.jpeg)\n\
  \n## 组件质量\n\n高质量的架构组件具备以下能力：\n\n* 缩短开发时间和精力\n* 缩短预期的维护时间和精力\n* 因为它们是通用的，所以可以适用于许多应用程序\n\
  * 符合广告描述的功能\n\n这些特性对于任何组件软件都是理想的，无论组件是商业的、开源的还是由你编写的。\n\n人们在判断软件时常用的一个常用准则是：如果他们必须查阅手册才能完成基本任务，他们就会判定该软件“太难用”。在评估组件软件时，你可以使用相似的标准。如果满足以下任一情况，我就认为组件软件难以使用：\n\
  \n* 你必须阅读超过两页的材料才能安装和配置该组件。\n* 从安装到使用该组件完成基本任务需要一个小时以上。\n\n人们在设计架构组件时的一个常见错误是选择了过大的范围。大范围通常会导致组件变得复杂，需要很长时间才能可用，并且具有很长的学习曲线。我在选择架构组件中要实现的功能时遵循\
  \ 80/20 原则。组件设计者不应该陷于人们很少使用的功能中。\n\n## 如何让组件易于使用\n\n如果你正在评估组件软件，易用性应该是决策准则之一。如果你正在创建一个架构组件，你可以做很多事情（许多组件开发者并没有这么做）来让你的组件易于使用。\n\
  \n**将基础任务的说明限制在一页纸快速上手表（cheat sheet）内。** 对于复杂的、异常的任务，你可以准备更详细的文档。开发者为了上手需要阅读的材料越长，在此过程中放弃并寻找替代品的开发者比例就越高。\n\
  \n**尽可能减少执行基础任务所需的所需的语句数量。** 使用组件的主要益处之一是消除应用程序中的代码。单行调用是理想的，因为它消除了输入并减少了你需要学习的类和方法数量。\n\
  \n实现单行调用的一种方法是依赖静态方法。这消除了实例化任何对象的需求。将调用改为静态不仅是一个战术选择。作为示例，考虑任何 `Utils` 类（例如 Apache\
  \ Commons Lang 中的 `StringUtils`、`NumberUtils`、`ExceptionUtils`）。这些类充斥着方便的静态方法，只需一行代码即可完成大量工作。\n\
  \n减少执行基础任务所需的参数数量。你可以通过提供多个重载方法来实现。其中一些重载的参数较少，并对其余参数提供了合理的默认值。\n\n作为一个例子，让我们考虑\
  \ Apache Commons Lang 中 `EqualsBuilder` 的 `reflectionEquals` 方法。该类使得任何类都能轻松实现 `equals()`。`ReflectionEquals`\
  \ 至少需要两个参数；即要比较的值。然而，更复杂的重载可以允许你控制哪些字段被考虑，以及考虑多少继承层次。由于大多数人不需要额外的控制，因此这些额外参数是可选的。\n\
  \n**将供公开使用的类与 API 内部需要的类分开。** 组件包含的类越多，找到具有所需功能的类的时间就越长。将所有类放在一起只会增加学习 API 所需的时间。\n\
  \n\n\n\n\n解决此问题的方法之一是将并非供公开使用的类移动到另一个独立的包中，并将该包标记为“仅供内部使用”。用户就不需要为了寻找他们想要的功能而翻阅他们尚不需要的低级类。\n\
  \n作为这方面的例子，Apache Commons Logging 将内部类分到独立的包中（`org.apache.commons.logging.impl`）。Quartz\
  \ 调度包 ([`quartz-scheduler.org`](http://quartz-scheduler.org/)) 使用了相同的技术，将内部使用的类置于\
  \ `org.quartz.impl` 包中。这种技术简洁地告知用户，他们不需要费心研究这些类的文档，因为他们可能并不需要。\n\n提供易于复制的示例并包含索引。让用户能够轻松找到接近其需求的示例。我们大多数人都是通过示例来学习的，而且打字速度并不快；有可以复制的内容可以节省用户时间。短示例的理想位置是\
  \ JavaDoc 中。\n\n例如，Apache Commons Lang 中的 `EqualsBuilder` 和 `HashcodeBuilder` 都在它们的\
  \ JavaDoc 中提供了用法示例，这些示例可以轻松复制到你的代码中，并快速修改以适应你的需求。另一个例子是 Primefaces 项目（一个 Java Server\
  \ Faces (JSF) 组件库），它提供了一个演示网站（[`www.primefaces.org/showcase-labs/ui/home.jsf`](http://www.primefaces.org/showcase-labs/ui/home.jsf)\
  \ ），其中包含了易于访问的源代码，方便复制到你自己的项目中。\n\n限制对其他 API 的依赖。我曾被迫为一个客户实现一个编写得糟糕的调度组件（我没有选择）。该组件使用了两个难以使用且配置复杂的内部组件。从那以后，我学会了如何避免给我的开源组件用户带来同样的痛苦：使用接口进行解耦。\n\
  \n对所有供公开使用的方法中的所有参数进行检查，并对无效输入产生清晰的错误消息。与其让错误退化为派生异常（例如空指针异常），不如在异常中提供如何纠正问题的信息。例如，错误消息“无效格式类型参数”不如像“无效的格式类型‘foo’。此类中的有效常量常量：PDF、HTML、XLS\
  \ 和 DOC。”这样的错误消息有用。在错误消息中简单显示传递给方法的错误值，可能会缩短调试和纠正问题的时间。\n\n避免抛出“受检”异常。最好抛出扩展 `RuntimeException`\
  \ 的“未检”异常，因为这不会强迫用户编写过多的 `try/catch` 逻辑。使用组件时不需要这么多代码绝对使其变得更容易使用。唯一的例外（这里不是双关语）是调用者可以合理地针对异常提供替代的业务逻辑；然而，这种情况很罕见。关于这一极具争议的概念的更详细讨论，请参阅第\
  \ 9 章。\n\n# 使组件易于配置和控制\n\n减少用户必须配置的属性数量。某些组件使用属性文件（一种键值对组成的文件）来管理配置设置。这些文件通常与 `java.util.Properties`\
  \ 对象结合使用。\n\n用户为了运行你的组件选择值而需要的属性越多，你的组件配置起来就越长、越困难。你可以通过尽可能为许多配置属性选择合理的默认值来缓解这个问题。此外，针对错误配置提供清晰的错误消息可以使你的组件易于使用。\n\
  \n尽量减少任何所需的 XML 文档的复杂性。文档结构越复杂，组件配置和控制就越困难。Jakarta 的 Ant 项目是有效使用 XML 文件的极佳示例。Ant\
  \ 是一种常用于应用程序构建的 XML 脚本工具。它的脚本语言基于 XML，结构简单直观。尽管 Ant 拥有大量的选项，但它也有合理的默认值和良好的文档。这个开源项目可以在\
  \ [`ant.apache.org/`](http://ant.apache.org/) 找到。\n\n对无效配置产生清晰的错误消息。组件必须具有清晰的错误消息。没有什么比试图弄清楚为什么你没写的代码退化为\
  \ `NullPointerException` 更让人恼火了。清晰的错误消息可以改变开发者对你组件的认知。\n\n提供许多易于复制的配置文件示例。如果组件能够处理复杂的配置，这一点尤为重要。我建议既提供基础示例，也提供复杂的示例。\n\
  \n将安装和配置说明限制在一页快速备查表（cheat sheet）。如果说明太长太复杂，就会降低使用该组件的初衷。拥有包含完整功能的扩展文档是可以接受的，但执行基础任务的用户不应该阅读超过一两页的内容。\n\
  \n# 开源替代方案\n\n开源替代方案蓬勃发展，以至于针对特定需求搜索开源替代方案已成为一项复杂的任务。\n\n大多数组织在有指导方的情况下接受开源使用。许多公司会定义允许使用的开源许可证（例如\
  \ Apache License, Version 2.x 等其他）。如果所需的产品没有逐字采用标准许可证，大多数公司会提供一条审批路径，以便其法律部门对许可证进行评估。\n\
  \n某些组织对使用开源产品持谨慎态度。这种观点认为这些产品本质上是没有支持的。虽然开源技术的价格符合任何公司的预算，但许多组织仍然喜欢在出现问题时有一个可以拨打的技术支持电话的安全性。这里实际上有两个问题。第一个是关于通过开源产品解决技术问题以让你的应用程序运行并保持运行的实际问题。第二个是如果你的产品选择决策证明是一个糟糕的决定，有一个人可以推卸责任（或可能被起诉）。通常，有反开源政策的公司更担心责任的归属。幸运的是，对开源使用的抵制似乎正在减少。\n\
  \n# 解决技术问题\n\n以下是我解决开源组件问题时采取的一些步骤。步骤 1 是最简单的解决方案。如果无效，在尝试其他步骤之前，你需要执行步骤 2，其余步骤按简易程度排序。\n\
  \n*   **步骤 1：** 搜索产品的 bug 列表。诚然，许多开源产品没有正式的支持组织。但许多产品提供了访问 bug 列表的方法并提供了报告已发现 bug\
  \ 的方式。通常，你遇到的问题已经被其他人发现并报告了。也许已经发布了解决方案或临时方案。\n\n*   **步骤 2：** 搜索互联网。通常，通互联网搜索会发现他人遇到相同问题的帖子。解决方案通常发布在相同的新闻组或博客中。\n\
  \n*   **步骤 3：** 升级到最新版本。如果可用产品的新版本，在尝试解决技术问题时尝试是一个很好的时机。也许问题是由人发现并修复的 bug 导致的。通常，升级涉及的工作只是在类路径中包含更新的\
  \ `jar(s)`。\n\n*   **步骤 4：** 评估竞争产品。我会寻找相同功能的竞争开源产品。如果我可以轻松切换产品，我会尝试这样做。我曾遇到过一个开源\
  \ Java FTP 客户端 API 的内存泄漏问题。当新闻组搜索没有找到我问题的答案时，我切换到了另一个开源 FTP 客户端 API。\n\n\n\n\n\n\
  - **步骤 5：** 调试你的测试场景。虽然这不是一项令人愉快的任务，但它总能让你确定根本问题。一旦你知道了问题所在，就可以开始寻找替代方案。\n- **步骤\
  \ 6：** 修改组件代码以修复问题。这应该被视为最后的最后手段。如果你使用了开源产品的修改版本，那么在随后的问题调查中，你将自力更生。你永远无法知道你所经历的问题是产品\
  \ bug 导致的，还是由于你的更改导致的。如果你必须修改代码，请务必向生产该组件的开发者报告该 bug 和解决方案。大多数开源产品的开发者都会发布一个包含 bug\
  \ 修复的新版本。一旦你能够获得适用于你应用程序的、未经过修改的组件版本，就应该使用它。\n\n## 缓解政治风险\n\n使用开源组件软件的第二个问题是，当选择的开源产品效果不如预期时，公司需要有一个人来承担责任（替罪羊）。我想不出可以完全解决这个问题的方法，但我可以想到许多减轻风险的方法。\n\
  \n建议一个商业软件组件，并提供开源替代方案，同时保留有关该决策的文档。这种策略有效地将组件决策变成了一项集体活动。如果开源决策以后受到质疑，你可以将问题定性为集体决策，并指出预算方面的优势。\n\
  \n跟踪你使用了哪些开源产品，并保留源码以及二进制分发包。你不希望在遇到问题时才发现你正在使用的版本的源码已不可用。作为最后手段，你可以尝试自己修复问题。\n\n\
  识别该开源产品的竞争对手。这可以缩短在需要切换组件时所花费的时间。它也有助于记录在产品搜索过程中的尽职调查情况。\n\n## 组件使用指南\n\n无论第三方组件是否开源，你的目标之一都应该是将业务风险降至最低。这很大程度上是为了保持较小的切换成本，这样如果出错，将更容易被纠正。\n\
  \n### 减少直接使用具有直接竞争对手的第三方组件的类\n\n具有直接竞争对手的产品是指由多个产品提供的集中功能集的产品。例如，日志产品就属于这一类。开发者对于应该采用哪个日志包存在矛盾意见。虽然主要参与者有\
  \ `Apache Log4J`、`Slf4J` 以及 `JDK` 内部的日志框架，但对于应该使用哪个包并没有共识。鉴于此，我通常让应用程序代码使用一个日志代理，该代理利用底层这些日志框架之一。如果需要更改日志包，第三方特定的代码就不会渗透到应用程序中。\n\
  \n你可以通过创建一个代理类来隔离对特定产品的依赖。继续以日志产品为例，我经常创建一个应用程序 `Logger` 类，它作为由其中一个日志产品提供的底层日志记录器的代理。由于应用程序代码仅依赖于代理类，因此如果有需要，更改日志产品是非常容易的，因为只需要更改代理类即可。\n\
  \n该概念的另一个例子是调度包。`Quartz` ([`quartz-scheduler.org`](http://quartz-scheduler.org/))\
  \ 是我通常利用的产，但也有几个竞争产品可供选择。如果企业级的调度考虑，调度产品可能会发生变化。通常，我会提供一个基类，它实现调度包所需的任何任何接口。因此，该基类是唯一直接与调度包建立接口的类，并且可以轻松地更改为使用不同的包。\n\
  \n某些第三方产品的范围太广，以至于代理技术无法发挥作用。例如，`Apache Commons Lang`、`Collections` 和 `BeanUtils`\
  \ 包提供了工具库。为所有这些工具创建代理类所涉及的工作将是巨大的，因为这些库的范围非常广泛，而且由于这些产品没有直接竞争对手，这样做带来的收益将微乎其微。\n\
  \n你可以在几乎任何软件组件中使用这种技术。记住，你还要限制对任何第三方组件异常类的依赖，以便你的应用程序依赖内部类而不是外部类。为了实现这一点，请让代理使用\
  \ `try/catch` 块包围底层产品的使用。生成的任何基于组件的异常都可以转换为应用程序异常，从而防止对第三方异常类的非预期依赖。\n\n![stock-photo-17860137-binary-code-bw-horiz-slice.tif](img/00003.jpeg)\n\
  \n# 第 15 章：应用程序架构策略\n\n为了确保你的应用程序具有内部一致性，你从从初就要建立日志记录、异常处理、多线程和配置管理的策略。大多数开发者对这些每个领域都有自己的偏好。如果你的团队有很多开发者，而你让他们使用自己的偏好，你将创建一个内部不一致且更难维护的应用程序。本章为应用程序架构的每个方面提供了策略。在本节中，我阐述了过去使用过的策略示例。一旦确定了策略，不要害怕通过额外的细节来完善它，以适应开发者的需求和舒适度。\n\
  \n## 日志策略\n\n应用程序类不应该依赖于特定的日志记录器。通用组件应该能够使用应用程序采用的任何日志包。这可以通过让应用程序中的一个类作为日志代理，将日志写入委托给\
  \ `Log4J`、`JDK Logging` 或其他日志包之一来实现。列表 15.1 是应用程序日志器代理实现的一个示例。\n\n列表 15.1：使用 SLF4J\
  \ 的日志代理示例\n\n![listing15-1.tif](img/00057.jpeg)\n\nApache 开源组件 `Commons` 有一个名为 `Commons\
  \ Logging` 的包，旨在满足这一需求。不幸的是，它相当重（尽管被标记为“轻量级”），并且并不易于使用。它需要 XML 解析器并具有更复杂的配置方案。我认为\
  \ `Commons Logging` 的麻烦大于它的价值。\n\n开源产品 Java 日志门面 (`SL4J`) 是一个满足这一需求的优秀产品。该产品是 `Log4J`、`JDK\
  \ Logging`、`Commons Logging` 以及其他日志产品的通用代理。它安装和使用都很简单。我已经在自己的开源项目中开始使用 `SL4J`。然而，对于业务应用程序，我仍然使用日志器代理类（如列表\
  \ 15.1 所示），因为这个领域仍在变化和演进。许多流行的开源产品（如 `Hibernate`、`ActiveMQ` 等）都采用了它。\n\n### 将日志方法的编码限制在一行\n\
  \n日志记录的操作非常频繁，因此通过减少日志所需的代码，你可以节省大量时间。`Slf4J` 引入了一个很好的功能，通过提供基础的消息格式化功能帮助开发者减少日志代码。例如，考虑以下日志示例：\n\
  \n列表 15.2：演示格式化功能的日志示例\n\n```\nlogger.debug(\"Application id set to {}\", applicationId);\n\
  ```\n\n该功能通过为开发者格式化消息实现了代码缩减。它还减少了风险，因为开发者代码包含更少的操作符，并且在格式化消息时不需要检查空值。\n\n此外，为了性能考虑，在发布调试日志消息之前检查日志是否设置为调试\
  \ 模式并不常见，这可以提高性能。`Slf4J` 自动提供这种检查，而无需开发者编写额外的条件判断。\n\n\n\n\n\n请注意，列表 15.1 中的日志器代理支持\
  \ `Slf4J` 消息格式化功能。如果我从 `Slf4J` 切换到其他日志包，日志器代理必须提供类似的消息格式化能力，以避免影响使用它的应用程序代码。消息格式化能力通过消除格式化日志消息的自定义逻辑来降低风险。消息格式化通过只对符合当前日志级别设置的消息进行格式化来提高性能。例如，如果你的日志器配置为输出信息级别，`debug`\
  \ 消息将被格式化，因为它们不需要。消息格式支持的优点非常大，因此我假设如果出现切换日志包的需求，略高切换成本的风险也是可以接受的。\n\n### 将所需信息与你抛出的异常打包。\n\
  记录日志的主要原因之一是提供解决由异常引起的 bug 所需的信息。这些额外的日志代码增加了风险，因为异常代码通常没有经过充分的测试。因此，在进行异常消息格式化时，发生异常（例如来自\
  \ `NullPointerException`）的概率通常比非异常代码中要大。\n\nApache Commons Lang 从 `V3.0` 开始提供了上下文异常（contexted\
  \ exception）能力，通过使在异常本身中包含额外信息变得简单且风险较低，降低了这种风险（参见 Commons Lang 中的 `ContextedException`\
  \ 和 `ContexedRuntimeException` 类）。当记录此异常时，这些额外信息将会存在。请考虑列表 15.3 中的示例。\n\n#### 列表\
  \ 15.3：上下文异常示例\n\n```java\nthrow new ContextedRuntimeException(“Error creating application”\n\
  \n, exception)\n.addContextValue(“application id”, applicationId)\n.addContextValue(“customer\
  \ id”, customerId);\n```\n\n当记录列表 15.3 中的异常时，上下文标签和值将自动出现在日志中，连同错误消息和堆栈跟踪。请注意，应用程序代码通过添加条件日志逻辑或格式化逻辑不会增加派生异常的风险。请注意，如果没有上下文异常能力，开发者将不得不添加日志代码来提供解决\
  \ bug 所需的信息。\n\n### 只记录一次事务异常。\n多次记录异常将极大膨胀你的日志，并使与报告缺陷相关的特定异常更难找到。你可以通过仅在入口点记录异常来避免重复日志消息的问题。例如，很容易实现一个\
  \ servlet 过滤器，它可以记录任何 Web 事务的异常。这确保了异常只被记录一次。此建议假设你已经像本章前面描述的那样，将解决错误所需的任何额外信息与异常本身打包。列表\
  \ 15.4 展示了这种 servlet 过滤器。\n\n#### 列表 15.4：Servlet 过滤器示例\n\n```java\npublic void\
  \ doFilter(ServletRequest request, ServletResponse response,\n\nFilterChain chain)\
  \ throws IOException, ServletException {\n\ntry {chain.doFilter(request, response);}\n\
  \ncatch (Throwable t) {\n\nlogger.error“Web Transaction Error”, t);\n\nServletUtils.reThrowServletFilterException(t);\n\
  \n}\n\n}\n```\n\n来源：来自 Admin4J 的类 `net.admin4j.ui.filters.ErrorLoggingFilter` (http://www.admin4J.net)\n\
  \n这种技术减少了应用程序代码，并增加了生成的异常被记录的概率。此外，如果你利用了具有错误处理过滤器的 `Admin4J` 产品，你将获得异常发生时的请求 `URI`\
  \ 以及任何请求和会话属性的转储。换句话说，你可以利用开源产品完成此操作，而不是为此目的创建自己的 servlet 过滤器。\n\n顺便提一下，你还需要为批处理作业类、`EJB`\
  \ 类和消息驱动生成器提供类似的架构支持。将异常记录留给应用程序代码会增加异常无法被正确记录的概率。\n\n### 不要将事务日志与普通应用程序日志混合。\n\
  事务日志（例如，用户 Fred 更改了客户 Acme 的地址）有不同的目的。通常，普通业务流程需要事务日志，它们并不是针对产品支持的。大多数日志产品允许你为此将事务日志重定向到单独输出。\n\
  \n请注意，日志保留和存储是一个完全不同的主题。大多数日志产品支持以各种格式存储日志，包括文件或数据库格式。应用程序代码应该只关注日志消息，而不是关心如何存储的具体细节或保留多久。\n\
  \n应用程序架构师需要为开发者清晰地阐日志策略。以下是此类策略的简单示例：\n\n#### 日志策略示例\n\n*   所有日志均使用 `myapp.util.Logger`。不要使用\
  \ `System.out.println()`。\n*   不要在应用程序代码中直接记录错误消息。依赖应用程序架构（例如错误处理 servlet 过滤器）来为你记录。\n\
  *   警告、信息和调试消息（即严重程度未足以触发抛出异常，但对修复 bug 的开发者很有用的错误）可以从任何层的任何地方记录。\n*   当使用日志输出信息时，使用\
  \ `logger` 消息格式化功能，而不是采用自定义格式逻辑，以减少应用程序代码和产生派生异常的风险。\n*   不要将通用日志功能作为事务日志。\n\n###\
  \ 异常处理策略\n\n#### 在所有公共类的公共方法和构造函数中显式地验证所有参数。\n对公开消费的方法验证所有参数可以防止派生异常。派生异常是在错误发生很久后才报告的异常。一个非常常见的错误是无意中向方法传递\
  \ `null` 参数，结果发现在被（直接或间接）调用的类尝试使用该参数且没有预料到空值时，生成了 `NullPointerException`。\n\n虽然可以获取\
  \ `NullPointerException` 发生的类、方法和行号，但实际错误发生在在此之前，即空值产生的地方。这通常位于堆栈跟踪中完全不同的方法和类中，追踪可能花费大量时间，特别是当代码复杂且多个变量可能生成异常时。通常，这种派生异常需要更多的时间和精力，因为错误消息和信息没有说明问题。如果方法生成了类似“name\
  \ argument may not be null.”的异常消息，错误将更容易找到和修复。\n\n参数验证允许你报告比其他情况下更清晰的错误。`null` 参数经常被验证。如果一个参数必须符合特定的值集（例如，允许“pdf”、“xls”和“txt”值的\
  \ `docType` 参数），则该值也应该被验证。我通常利用 Apache Commons Lang 中的 `Validate` 类来实现此目的，如列表 15.5\
  \ 所示。\n\n#### 列表 15.5：参数验证示例\n\n```java\npublic BasicTaskTimer(String label, Collection<DataMeasure>\
  \ dataMeasures) {\n\nValidate.notNull(dataMeasures,\n\n“Null data measure collection\
  \ not allowed.”);\n\nValidate.notEmpty(label, “Null or blank label not allowed.”);\n\
  \nthis.dataMeasures = dataMeasures;\n\nthis.label = label;\n\n}\n```\n\n来源：来自 Admin4J\
  \ 的类 `net.admin4j.timer.BasicTaskTimer` (http://www.admin4J.net)\n\n\n\n\n\n# 转向非检查异常的趋势。这通过消除检查异常所需的\
  \ `try-catch` 逻辑减少了应用程序代码。许多常用的开源项目，如 `Hibernate` 和 `Spring` 已经采用了这种方法。在本书第一版发布时，这是一个极具争议的想法，双方都有激进的支持者。而今天，这个想法得到了更广泛的接受和应用。\n\
  \n在所有入口点对抛出的异常包含通用的 catch 处理。这样做是为了确保这些异常被记录日志。这条建议与本章之前提到的日志建议有关；我在这里不再重复那部分内容。\n\
  \n# 在创建自定义异常之前，优先使用原生的 JDK 异常。没有必要重造轮子。许多开发者甚至不会检查是否有适当的 JDK 定义异常可以替代他们创建的特定应用程序异常。作为一个真实世界的例子，我曾见过一个开发者创建一个名为\
  \ `NullValueException` 的异常，当方法接收到 `null` 参数而不是有效值时抛出该异常。实际上，使用 `IllegalArgumentException`（来自\
  \ `java.lang`）会是更好的选择。\n\n# 将 try/catch 块的嵌套深度限制在两层。（我知道你们中的许多人会为此抗议。）如果你需要更深层级，请移除内部代码块并分离私有方法以提高可读性。此外，在嵌套的\
  \ try/catch 场景中修复 bug 非常困难。顺便提一下，深度嵌套 try/catch 逻辑的需求通常表明需要对部分代码进行重构。\n\n# 不要捕获异常但不进行任何处理。为了编程上的方便，某些开发者捕获了异常但未能\
  \ catch 块中编写代码。这种做法消除了编译错误，但让代码变得难以维护。很多时候，“吞掉”异常会导致后续出现难以发现和修复的派生异常。如果你捕获了异常，请对其进行处理（例如，将其转换为带有上下文的运行时异常，并包含修复底层\
  \ bug 所的信息）。\n\n# 永远不要在 finally 块放置 return 语句。如果 `try` 块中抛出了异常，`finally` 块会在异常抛出之前执行。如果你在\
  \ `finally` 中发布 `return` 语句或在 `finally` 中抛出异常，原始异常将永远不会被抛出，也不可见。这将增加调试问题所需的时间和精力。\n\
  \n# 架构师和项目经理应该在开始编码之前建立异常处理和日志策略。开发者通常对异常处理和日志记录有个人偏好。如果不定义异常处理和日志记录策略，开发者将选择自己的方案，导致整个应用程序之间缺乏一致性。最终，当应用程序的不同部分集成时，将会产生冲突。此外，外部人员维护该应用程序将变得更加困难。\n\
  \n例如，假设一个开发者采取了在异常实例化时记录日志的哲学，而另一个开发者则期望在部署层进行日志记录。当所有代码集成时，某些错误将无法报告，这将极地增加测试和维护时间。\n\
  \n异常产生最有价值的信息之一是根异常的堆栈跟踪。堆栈跟踪明确指示了异常发生的位置。在某些情况下，你甚至会获得精确的行号。理想情况下，你应该看到根异常的堆栈跟踪结合具描述性的上下文信息。利用\
  \ `Apache Commons Lang` `V3.0` 及以上版本的上下文异常功能对此非常有帮助。\n\n你还需要强制执行异常处理策略。我使用小组代码审查作为执行和教育的机制。代码审查如果执行得当，非常有建设性。开发者通过审查其他开发者的代码可以学习很多。审查还让绕过既定策略（如异常处理策略）变得更加困难。此外，代码审查允许你识别异常处理策略中的任何缺陷，并在必要时进行调整。\n\
  \n## 异常处理策略示例\n\n*   使用 `Apache Commons Lang` 中的 `Validate` 来检查公共方法和构造函数的所有方法参数。\n\
  *   在异常消息中始终包含足够的信息，以便在测试环境中复制条件。\n*   所有应用程序异常都应该扩展 `Apache Commons Lang` 中的 `ContextedRuntimeException`。新的应用程序异常建议应由架构师审查。\n\
  *   业务逻辑层或数据访问层中的所有 `try/catch` 块都不应干扰非检查异常的抛出。将异常抛给调用者，并依赖应用程序架构来捕并适当处理异常。\n\n\
  ### 异步任务策略\n\n大多数应用程序都有异步运行的任务（例如，不强制用户等待）。这些任务可以包括调度的“批”工作和长时间运行。Java EE 也不例外。幸运的是，有几个开源产品为\
  \ Java 应用程序提供了批处理能力。我通常利用 `Quartz Job` 调度器（`http://quartz-scheduler.org/`）来实现此目的。\n\
  \n利用产品管理异步运行的任务比自己编写线程代码要好。这个 Java 编程领域通常需要最资深的开发者处理，而且非常难以做对。多线程代码产生的 bug 可能是最难发现和修复的。这也是一个你不希望初级开发者参与的编程领域，因为潜在风险很高。\n\
  \n与其他第三方组件一样，我通常提供一个可以被调度包使用的代理批作业。这样如果需要更改所使用的调度产品，就能减少切换成本。列表 15.6 是一个 `Quartz`\
  \ 批处理基类的示例。其核心思想是应用程序扩展此类，并填充 `execute()` 方法，该方法包含了要执行的批处理逻辑。请注意，基类为应用程序提供了调度批处理作业立即执行的方法。如果需要切换调度器，只需要更改批处理基类即可。\n\
  \n### 列表 15.6：用于使用 Quartz 调度器的示例基类\n\n![listing15-6.tif](img/0058.jpeg)\n\n来源：`/src/j2ee/architect/handbook/chap14.AbstractBatchJob.java`\n\
  \n## 异步策略示例\n\n与日志和异常处理策略一样，应用程序架构师需要为异步任务提供指导。一个类似于我在业务应用程序中使用的策略如下：\n\n*   对所有异步任务扩展\
  \ `myapp.util.AbstractBatchJob`。不要单独创建异步线程。\n*   不要记录你自己的异常；架构将确保你抛出的任何异常被正确记录，并带有有关作业和所用任何执行参数的细节。\n\
  *   不要管理你自己的事务；成功完成后将执行提交，如果产生异常，则将发出回滚。\n\n## 配置策略\n\n大多数 Java EE 应用程序都有一些可配置属性，例如连接池名称、群组电子邮件地址等。关于配置，大多数\
  \ Java EE 应用程序有几个主题需要处理：\n\n*   从环境或某些数据源（例如属性文件）确定配置项的值。\n*   让应用程序类能够获取到配置项的值。\n\
  *   为开发人员记录可配置项。\n\n\n\n\n将配置值提供给应用程序类可以简单地声明一个配置类，并使用静态访问器（accessors）和修改器（mutators）来表示各个应用程序属性。此类配置类的示例可以在\
  \ `Admin4J` 产品及其列表 15.7 中摘录的 `Admin4JConfiguration` 类中看到。\n\n### Listing 15.7：Admin4J\
  \ 中的示例配置类\n\n![listing15-7.tif](img/00059.jpeg)\n\n来源：Admin4J 产品类 `net.admin4j.config.admin4JConfiguration`\n\
  \n应用程序类使用配置访问器获取配置值。负责查询环境并从某些外部源读取配置的类将在启动时使用修改器来设置配置值。注意列表 15.7 中的静态块，它依赖于 `PropertyConfigurator`\
  \ 类来查询环境并设置配置值。由于这是一个静态块，它将在应用程序首次引用该类时执行。\n\n配置类中的 Javadoc 可以为开发者描述配置项列表以及每个配置项的用途。某些开发者更倾向于直接从环境中获取配置值。这样做最大的缺点是它没有留出一个离散的地方来记录应用程序所有可能的配置项。\n\
  \n配置应用程序的行为相互分离，这一事实使得在未来某点支持多种形式的配置成为可能，而不会增加复杂度。一个例子是 Apache Log4J 产品，它允许通过属性文件或\
  \ XML 配置文档进行配置。某些开发者喜欢将应用程序配置项放在应用程序数据库中，因为在大多数组织中，这样在运行时更容易更改。虽然我理解这种吸引，但考虑到大多数组织的官僚性质，我通常避免将配置项存储在应用程序数据库中，因为这会增加回负载（为了开发或测试目的复制生产数据库）。定期从生产环境向测试环境回载应用程序数据是常见的，这样开发者就可以使用最新数据。如果配置项存储在应用程序数据库中，可能会误用生产环境的值。如果这些配置项标识了生产文件或资源，可能会在生产环境中引发问题。\n\
  \n有一些配置产品可以提供收集配置信息的支持。其中一个产品是 Apache Commons Configuration ([`commons.apache.org/configuration`](http://commons.apache.org/configuration))。对于大多数\
  \ Java EE ，配置属性列表很小；涉及独立的产品来读取配置信息通常是多此一举。\n\n### 示例配置指南\n\n*   在类 `com.myorg.myapp.Configuration`\
  \ 中将所有配置值定义为属性。\n*   确保设置配置值的逻辑存在于类 `com.myorg.myapp.Configurator` 中。\n*   如果可能，确保配置器在特定运行时环境中未指定属性时为该属性分配一个默认值。\n\
  *   如果配置值未被设置为允许的值，应在配置器中抛出异常。请在错误消息中包含无效值以及关于有效值的简要说明。\n\n另一个源自开源社区的异常处理、日志记录和编码规范策略建立的示例可以在\
  \ [`commons.apache.org/lang/developerguide.html`](http://commons.apache.org/lang/developerguide.html)\
  \ 找到。\n\n此示例是开源产品 Apache Commons Lang 建立的编码规范。上述 URL 是正式建立本章讨论的架构策略并对其进行沟通的极佳示例。虽然这些建议可能与我提供的不同，但我仍然将其作为一个示例，因为为开发者建立他们可以遵循的清晰指南，比我与某些条目之间的细微分歧更为重要。\n\
  \n### 缓存策略\n\n缓存（将频繁使用的数据保留在内存中）是获得性能收益的常用策略。基本上，缓存是用内存换取 CPU 和磁盘利用率以及速度。与所有策略一样，缓存既有风险也有收益，因此它只应该在获得实质性性能改进的情况下使用。低流量应用程序可能不需要实现缓存，但它足够常见，值得关注。\n\
  \n对于应用程序代码中的缓存，算法通常很简单。我将使用一个原始的 `ExpiringCache` 类作为使用示例；`ExpiringCache` 源码包含在源码包中。以免你认为是我自定义代码了一个缓存，`ExpiringCache`\
  \ 在 Guava 中封装了缓存功能 ([`code.google.com/p/guava-libraries/`](https://code.google.com/p/guava-libraries/))。考虑列表\
  \ 15.8 中的使用示例。\n\n### Listing 15.8：缓存使用示例\n\n```java\nprivate static ExpiringCache<Long,\
  \ String> cache = new ExpiringCache<Long, String>();\n\n.....\n\nString value =\
  \ cache.get(key);\n\nif (value == null) {\n    // 查找值的代码\n    cache.put(key, value);\n\
  }\n```\n\n注意，某些 JPA 实现提供了缓存功能。例如，Hibernate 提供了缓存功能，你可以使用它，而不是像我上面那样自定义代码使用缓存。\n\n\
  由于缓存通过避免 I/O 来工作，它带有数据过期的风险。也就是说，缓存中的数据可能在源端已被更改，而这些过期数据正被应用程序用于处理。例如，如果你缓存了来自远程\
  \ Web 服务调用的数据，数据可能自上次读取以来已经发生了变化。在这种情况下，你的应用程序将使用过期数据。如果你缓存了数据库读取的结果，也是可能的。\n\n\
  由于缓存是用内存换取速度，需要考虑你配置的缓存的额外内存需求。Guava 和另一个流行的缓存包 Ehcache ([`ehcache.org/`](http://ehcache.org/))\
  \ 提供了限制缓存条目数量的方法，以缓解缓存导致内存不足的风险。\n\n既然我提到了使用 JPA 实现的缓存功能（例如 Hibernate），我应该指出，为数据库读取实现缓存通常是多的。关系型数据库内置缓存功能，如果配置得当将会缓存频繁使用的数据。\n\
  \n## 扩展阅读\n\nJohnson, Rod. 2002\\. *Expert One-on-One: J2EE Design and Development.*\
  \ Indianapolis, IN: Wrox Press.\n\nLea, Doug. 2000\\. *Concurrent Programming in\
  \ Java Second Edition: Design Principles and Patterns.* Boston, MA: Addison-Wesley.\n\
  \n# 第四部分：测试和维护 Java EE 应用程序\n\n构建应用程序的工作完成后，技术架构师经常会被要求领导测试活动并确保应用程序准备就绪。在此阶段，架构师的主要目标是提高应用程序的性能、稳定性和运行就。为了实现这一目标，架构师需要进行性能测试并进行性能改进，建议以便于监控和支持，并识别代码重构的候选对象。\n\
  \n本节将引导你完成这些活动。在这里，你将学习：\n\n*   为功能测试用例建立编码指南。\n*   进行有效的性能测试。\n*   有效地对应用程序进行性能分析以改进其对内存和\
  \ CPU 的使用。\n\n\n\n\n* 提高应用程序的可维护性。\n* 识别代码何时需要重构。\n* 将软件架构原则适配于新技术。\n\n![stock-photo-17860137-binary-code-bw-horiz-slice.tif](img/00003.jpeg)\n\
  \n# 第 16 章：测试指南与策略\n\n测试有几个不同的层级：\n\n* 单元测试（Unit testing）：验证特定类的公共或受保护方法或构造函数的正确性的测试。\n\
  * 集成测试（Integration testing）：验证单个软件特性或功能是否按预期工作。\n* 系统集成测试（System integration testing）：验证软件产品整体是否按预期工作，并与外部应用程序或软件组件正确接口的测试。\n\
  * 用户验收测试（User acceptance testing）：由终端用户或终端用户代表进行的测试，以确保交付的软件运行正常并实现了预期的业务目的。\n*\
  \ 性能测试（Performance testing）：测试软件产品在全负载运行（例如预期的用户数）时的扩展性以及性能是否可以接受的测试。\n\n作为应用程序架构师，你需要确保项目在这些每个层级都有测试指南。通常情况下会征求架构师对这些事项的建议。虽然管理层可能会否决部分建议（考虑到实施这些建议需要资源），通常架构师的建议会得到完全采纳。在本章中，我将详细阐述我对每种形式测试的观点。\n\
  \n## 单元测试指南\n\n单元测试运行的原理是：在项目早期发现缺陷通常更廉价，因为在缺陷被识别和修复之前，受影响的人较少。一旦建立起来，它通过允许开发者以合理的信心进行更改（相信这些更改不会破坏任何内容），来帮助防止未来的缺陷。\n\
  \n漏洞带来的损害以多种形式存在。在测试过程后期发现的漏洞会影响项目进度。在部署后发现的漏洞会损害用户对系统和开发团队的信任。而在流程后期修复漏洞需要更多的人力。到那时，修复可能不仅涉及开发者，还涉及整个测试团队（如果你的项目有测试团队的话，很多项目都有）。\n\
  \n相比之下，项目早期发现的漏洞消息不会传出开发团队范围。测试团队和终端用户不会直接参与验证一个他们从未经历过的漏洞的修复。\n\n单元测试指南需要回答以下问题：\n\
  \n* 什么种级别的代码单元测试覆盖率被认为是适当的？哪些类和方法需要单元测试？\n* 我应该将单元测试放在哪里，以便其他开发者可以轻松找到并使用它们？\n*\
  \ 我的单元测试预计多久运行一次？当它们报错时由谁来修复？\n* 如果我的单元测试需要外部资源（例如关系型数据库或外部应用程序），它们预计在什么环境中运行？\n\
  * 技术栈中有哪些单元测试工具是可供使用的？\n\n这就是绝大多数专家推销“测试驱动开发”（TDD）的卖点所在；即在编写代码本身之前先编写单元测试。通过这种方式，开发者可以确保高水平的单元测试覆盖率，并确保他们理解了即将编写代码的需求。这种做法还引导开发者以特定的方式编写代码使其可以进行单元测试。大多数专家声称，任何低于\
  \ 100 百分的单元测试覆盖率（即所有行代码都至少被单元测试覆盖一次）都是不可接受的。\n\n在争论的另一方，如果你在编写底层功能后编写单元测试，那么你的测试更有可能涵盖代码中的高风险区域，因为你在编写测试时对正试图解决的问题有了最深入的理解。\n\
  \n我认为，指定需要什么*级别*的代码覆盖率，比微观管理开发者在开发过程的具体何时编写代码更重要。\n\n### 什么种级别的单元测试代码覆盖率是适当的？\n\n\
  大多数组织不会资助 100% 的单元测试覆盖率。无论如何，它并不能完全消除漏洞，因为它只测试了单元测试中编写的输入。虽然单元测试允许开发者更安全地重构代码，但也意味着每次更改都涉及更多代码（你需要在更改应用程序行为的同时，更改单元测试中的预期值），从而导致该更改的开发时间变长。专家会辩称，维护单元测试用例所花费的额外时间将会补偿回来，因为由于漏洞减少，修复漏洞所需的时间少了。\n\
  \n如果你对其他应用程序的代码覆盖率百分比感兴趣，可以查看 Nemo (`http://nemo.sonarsource.org/`)。Nemo 由 Sonar\
  \ 赞助，并提供几个热门开源项目的 Sonar 统计数据，包括代码覆盖率。你会很快发现代码覆盖率百分比在不同项目之间差异巨大。如果你怀疑低于 100% 的代码覆盖率可能是接受的，请访问\
  \ Nemo；你会发现大多数项目（包括一些非常成功的项目）在远低于 100% 的单元测试覆盖率下运行。\n\n有一些产品可以为你衡量单元测试覆盖率。其中一个产品\
  \ Sonar (`http://www.sonarsource.org/`) 是开源且免费提供的。Sonar 还提供了多种软件指标，帮助你衡量应用程序的质量。另一个衡量单元测试覆盖率的产品是\
  \ Crap4J (`http://www.crap4j.org/`)。\n\n我通常建议对每个公共方法和受保护方法至少要求一个正向和一个负向单元测试用例——针对数据访问层和业务逻辑层类，以及所有工具类。正向测试用例是指方法正常完成用例。负向测试用例是指方法抛出异常的情况（例如针对无效输入）。\n\
  \n这离 100% 的覆盖还很远，但很容易遵循。容易遵循意味着它更有可能被执行。虽然可以用代码覆盖率百分比来表达这一要求并安排自动化测试来衡量此百分比，但这会消耗更多时间并将管理工作转移给开发者。坦诚地说，工具类可能应该更高的测试覆盖率，因为它们通常比业务逻辑或数据访问类更广泛。\n\
  \n在管理层面，我尝试确保常用代码和最复杂的代码存在单元测试。`Sonar` 和 `Crap4J` 除了代码覆盖率指标外，还会提供代码复杂度指标。此外，如果某代码持续出现在缺陷报告中，确保该代码具有适当的测试支架是降低其缺陷率的方法。\n\
  \n### 我应该将单元测试放在哪里？\n\n这应该由应用程序架构师参考所有开发者的意见后建立。我通常为每个应用程序定义一个 `test` 源代码文件夹，用于存放单元测试。大多数集成开发环境（IDE）对\
  \ `Junit` 都有丰富的单元测试支持。例如，在 Eclipse 中，你可以右键点击源文件夹并运行其中包含的所有 `Junit` 测试。测试文件夹的包结构应该模仿主源代码文件夹的包结构。我通常规定测试类包含被测试类的类名（例如\
  \ `CustomerDAOTest`），并与被测试类位于相同的包（这样也可以测试受保护的方法）。\n\n\n\n\n\n## 单元测试预期运行多频繁？报错时由谁来修复？\n\
  \n理想情况下，这些单元测试应该以自动化的方式每天至少运行一次。问题通常发生在单元测试报错时。传统的观点是，提交导致故障代码的开发者应该修复它。然而，在一个活跃的项目中，并不总是能一眼看出是谁提交了导致单元测试失败的错误。例如，故障可能并非源某个特定的违规提交；开发者可能只是更改了该测试用例所依赖的输入数据。此外，在截止日期迫在眉睫的活跃项目中，修复测试用例的优先级通常较低。\n\
  \n通常，应用程序架构师会就此向项目经理提供建议，但不会单方面决定答案，因为管理哪些任务分配给哪些人实际上是项目经理的责任。\n\n一种方案是轮流负责单元测试故障的修复。这通常更容易管理，因为项目经理在某人负责单元测试巡检时，对他们的期望值可以低一些。这还能通过让提交破坏单元测试代码的开发者感到尴尬来惩罚他们（例如，通过引起别人的注意来指出他们的错误）。因此，这激励了开发者`不要`提交破坏单元测试的代码。遗憾的是，这也会激励开发者“注释掉”单元测试，以免自己尴尬。\n\
  \n## 我的单元测试预期在什么环境中运行？\n\n大多数应用程序都需要外部资源，例如数据库。通常，我会维护一个为开发任务和单元测试服务的开发用数据库，并另外维护一个用于自动化集成测试的独立数据库。有些组织让开发者维护自己的开发数据库，但这样对时间的利用非常低效。根据定义，开发者并不是数据库管理员，无法足够快地解决数据库环境问题。让一个具备这些技能的人为所有人维护该环境会更有效。\n\
  \n# 技术栈中有哪些单元测试工具？哪些工具是可用？\n\n支持单元测试需要额外的工具。`Junit` 测试框架（[`www.junit.org/`](http://www.junit.org/))）似乎是最流行的，也是我的项目使用的框架。除了测试框架，通常还需要一个\
  \ Mock 框架（模拟框架）来为接口类依赖提供实现，而这些依赖并不是特定单元测试的主体。我通常使用 `EasyMock` ([`easymock.org/`](http://easymock.org/))，但也有其他可用工具。\n\
  \n重要的一点是，单元测试所需的库和工具不能被生产代码使用。为此，我通常在项目中定义一个 `dev-lib` 文件夹；`dev-lib` 包含了开发和单元测试所需的\
  \ jar 包，但不会包含在生产部署中。构建过程通常会强制要求开发者不在生产代码中意外编写出对 `EasyMock` 或其他测试产品的依赖。\n\n在选择并为项目提供单元测试工具之外，通常有必要提供一个基础测试框架，使创建单元测试变得简单。例如，我经常会编写一个执行所有\
  \ Hibernate 配置任务和测试 JNDI 工厂的基单元测试。这样，开发者要创建一个新的 `Junit` 测试，只需扩展基测试类即可。通常，这个基类还会提供常用的\
  \ Mock 对象，例如，`HttpServletRequest` 和 `HttpServletResponse`。\n\n## 自动化测试\n\n随着应用程序的成熟和复杂性的增加，自动化测试变成了预防性医学。随着复杂代码的出现，开发者修复一个问题并在无意中引起另一个问题的可能性之增加。有些人会认为这是一个表明需要代码重构的信号，这一点将在稍后的章节中进行讨论。自动化测试降低了修复一个问题导致另一个问题、并在生产环境上线后才被察觉的可能性。\n\
  \n自动化测试更好，因为它具有一致性且更容易运行。它不会在劳累的一天结束时偷懒，而且易于重复。因此，对应用程序的微小更改进行自动化回归测试更具成本效益。我见过有些项目甚至将测试套件整合到构建脚本中。如果任何一个回归测试失败，构建就会失败，开发者被迫修复\
  \ bug。\n\n自动化测试的完整程度取决于你的需求。如果你认同“测试用例应该随着应用程序的开发而创建”的观点，那么你也觉得开发者应该在最初创建测试用例。但这些测试用例通常是不完整的。如果你采纳了修复\
  \ bug 第一步是编写一个重现它的测试用例的建议，那么随着你发现更多 bug，你的回归测试就会不断增强。随着时间的推移，你将获得一组健壮的回归测试集，增加了在部署前发现\
  \ bug 的概率。\n\n自动化测试并非免费。创建和维护测试会消耗人力，因此使用 80/20 原则非常重要。首先，为占应用程序 80% 最复杂且最容易出错的代码编写测试用例。你可以随着时间推完成剩下的\
  \ 20%。如果你停下来创建 100% 全面的自动化测试，最终将为时间线增加许多小时，以至于成本将超过收益。\n\n## 单元测试最佳实践\n\n## 将测试用例和支持类放在单独的文件夹中，但保持相同的包结构。\n\
  \n尽管测试用例与应用程序结合开发的，但它们并非真的是应用程序的一部分。通常，你不需要将它们部署到测试环境之外的任何地方。\n\n我通常按照应用程序的包结构来组织测试用例和支持类的包结构。保持一致的包结构将节省开发者的时间。\n\
  \n## 为测试类采用命名规范，使其易于查找。\n\n这是另一个可以节省开发者时间的建议。例如，我将所有的测试类命名为 `TestXxx`，其中 `Xxx` 是被测试类的名称。例如，`TestValueObject`\
  \ 是 `ValueObject` 的测试类。我倾向于将同一个类别的所有单元测试合并到一个测试类中，但这并不是技术要求。\n\n## 使每个测试用例自给自足且独立。\n\
  \n测试用例不应依赖于其他测试用例必须先执行。如果你编写测试用例使得在运行 `test case #1` 之前 `test case #2` 才能工作，那么当其他开发者想要使用该用例进行单元测试和调试时，他们并不清楚前提条件是什么。然而，在某些孤立的情况下，实施这一建议是不切行的。\n\
  \n## 集成测试\n\n集成测试（有时被称为验收测试）验证单个软件功能或特性是否按预期工作。通常，我会合并集成测试和系统集成测试的环境，因为它们的需求相似。集成测试的一个组件无疑可以是\
  \ Junit 测试，用于执行支持应用程序主要功能的表示层支持类方法。然而，完全自动化 GUI 功能的集成测试是很的。虽然测试框架可以验证功能无异常，但它无法验证\
  \ GUI 的美学是否正确。由于这个原因，我通常为我的项目维护一份手动的回归测试计划。在此阶段，开发者应该对回归测试计划进行任何必要的修改，以适应新添加的功能。\n\
  \n## 系统集成测试\n\n\n\n\n\n# 系统集成测试是一个确保软件产品整体按预期工作的过程。该过程通常在为用户验收测试（User Acceptance\
  \ Testing）阶段做准备时执行。在此阶段，开发者（或测试团队的子集）执行手动回归测试。开发者负责修复发现的任何缺陷。\n\n应用架构师在此过程中的职责通常是确保环境支持此类测试活动。开发者通常需要一种简便的方法来启动到该环境的构建和部署。我发现，跨环境和项目标准化构建与部署程序是非常有帮助的。这不仅简化了构建和部署脚本的维护，还让开发者的生活变得轻松，因为在许多组织中，他们经常在项目之间进行调转。这种一致性允许开发者专注于测试活动本身和所需的缺陷修复，而不是在特定项目的独特构建和部署程序上花费不的时间。\n\
  \n## 用户验收测试\n\n用户验收测试通常需要一个独立的环境。这可以为测试团队（或某些组织中的用户代表）提供一定的稳定性。通常，由应用架构师或高级开发管理对该环境所需的更改，以便在项目最终部署到生产环境时能够在生产环境中进行这些更改。\n\
  \n再次，应用架构师在此过程中的角色是确保存在一个环境来支持此活动。通常，我管理该环境的更改，以便我确保在时间到达时所需的更改也会在生产环境中进行。如果该环境的变更管理是去中心化的（即更改由多人管理），当项目部署到生产环境时漏掉所需更改的概率将大大增加。\n\
  \n对于我的项目，我通常会在 UAT 测试期间审查缺陷单和代码提交（check-ins）。这提供了关于我在项目早期设计任务表现的反馈。项目此阶段的缺陷不应该要求重大的架构更改。如果是这样，则需要进行分析，以便在未来的项目中不再犯此类错误。\n\
  \n## 性能测试\n\n性能测试是一个验证项目在支持的用户数和事务数方面是否扩展性要求的过程。此过程需要应用架构师或非常高级的开发者直接参与。诚实，我自己负责参与这项练习。开发者在单元测试失败或测试中出现缺陷时知道自己哪里错了。架构师也需要类似的反馈。性能测试是发现应用架构是否符合（或可以通过调整来满足）性能规范的好方法。\n\
  \n在制定性能测试计划时，需要回答以下问题：\n\n* 将衡量哪些指标？\n* “通过”性能测试需要什么样的测量值？\n* 将使用哪些产品和工具来执行测试？\n\
  * 性能测试中将包含哪些功能？\n\n应用架构师负责确保这些问题得到回答，并通常会促进与其他团队成员和最终用户代表进行必要的讨论以回答这些问题。\n\n虽然应用架构师通常不执行性能测试，但在发现问题时，他们经常被要求贡献。性能测试可能由高级开发者而非应用架构师管理。然而，对于我的项目，我会密切监控这一过程，即使它是由开发者执行的，因为这是初始设计质量的宝贵反馈。调整应用程序的难易程度直接反映了底层应用架构的质量。如果根据要求调整我的某一个应用程序确实存在困难，我想理解这些困难，以便我能在其他应用程序中避免它们。\n\
  \n### 将衡量哪些指标？\n测量必须是完全客观的。我通常衡量吞吐量（例如，每秒 20 次请求）和平均客户端响应时间（例如，每次请求三秒）。大多数支持性能测试的工具都会提供这些指标。\n\
  \n你可能会奇怪为什么我不关注“虚拟用户数量”，而是以应用程序能够支持的最大虚拟用户数来描述目标。毕竟，大多数最终用户对支持的用户数量的感触比吞吐量更强。原因是，通过控制请求之间的延迟时间（大多数负载测试工具都允许配置这一点），我可以让任何软件产品达到任何数量的并发用户。通过增加延迟时间，我可以实现更高数量的并发用户（事实上是业务所需的任何数量）。虽然这最初安抚了用户，但测量支持的虚拟用户数量允许我操纵测试。吞吐量无法这样操纵，这就是我使用它的原因。\n\
  \n### “通过”性能测试需要什么样的测量值？\n这是一个主观的决定，通常与最终用户代表讨论。我通常建议目标是支持生产环境中应用程序所需吞吐量的两倍。例如，如果生产应用程序通常支持每秒\
  \ 5 次请求，我通常确保应用程序在性能测试中支持每秒 10 次请求。这为生产环境中可能遇到的意外流量激增提供了余量。\n\n尽管性能改进的机会一直，但性能调优的收益随时间递减。当你开始调优时，你所做的更改将带来更大的性能提升。但随着时间的推移，大多数应用程序的改进会越来越小。因为从调优中获得的大部分收益发生在前\
  \ 20%的工作中，80/20 法则再次适用。\n\n### 将使用哪些产品和工具来执行测试？\n我通常依靠 `Admin4J` (`http://admin4j.net/`)\
  \ 获取服务器端性能指标，并使用 `Jmeter` (`http://jmeter.apache.org/`) 编写和运行性能测试本身。`Jmeter` 可提供客户端响应时间统计和吞吐量统计。\n\
  \n虽然 `Admin4J` 似乎是多余的，但并不是。`Admin4J` 报告的统计是服务器端的。这意味着它们不包括 Web 服务器、防火墙和网络延迟。`Jmeter`\
  \ 统计是客户端的，包含了 Web 服务器、防火墙和网络消耗的时间。如果出现性能或扩展性问题，能够区分应用程序的问题与其运行环境的问题是非常重要的，因为你用来解决这些问题的策略是不同的。\n\
  \n### 性能测试中将包含哪些功能？\n在性能测试中包含每个产品功能往往是不可能的或必要的。性能测试的内容通常是与最终用户代表讨论的结果。我通常建议对常用功能编写脚本。通常，你可以通过检查生产访问日志来确定这些功能是什么。\n\
  \n我尽可能在不同版本之间保持功能集和性能测试脚本的一致。这使得版本之间的性能比较更有意义。例如，如果一个常用功能在上一个版本中测试结果为每秒 5 次请求，但在当前版本中仅支持每秒\
  \ 3 次请求，那么应用程序或环境发生了变化，对性能产生了负面影响。\n\n\n\n\n性能测试并不是功能测试。许多经理都犯了这个错误。通常，性能测试脚本并不详尽，无法替代功能测试。然而，验证性能测试中的每个请求都能无错误地运行至关重要；测量错误页面的速度并没有多大用，尽管它可能会产生一些令人印象深刻的性能数据。\n\
  \n我通常会亲自监控性能测试的运行，以确保在性能测试失败时，我捕捉了分析所需的指标。通常，如果性能不符合要求，我会在性能测试期间采集以下信息：\n\n* 线程转储\
  \ (Thread dump)\n* 操作系统磁盘使用率测量\n* 操作系统 CPU 使用率测量\n* 操作系统网络使用率测量\n* 数据库磁盘、内存和锁竞争测量\n\
  \n线程转储会告诉我是否存在任何需要解决的 Java 级同步问题。操作系统测量将告诉我资源限制是否是一个问题。数据库测量通常会告诉是否需要进行数据库调优。\n\n\
  # 性能测试技巧与指南\n\n**在应用程序进入用户验收测试（UAT）之前不要开始调优。** 许多开发者都想要调优他们写的每一行代码。我佩服他们对完备性的追求，但这会损害项目进度。很有可能，在这一阶段调优的代码中很大一部分并对应用程序的整体性能产生良好的提升。虽然我遇到过许多不理解这一概念的开发者，但经验告诉我，在应用程序的某些地方，调优的成本无法带来足够的收益，以至于无人会关心。\n\
  \n**大多数性能问题源于应用程序代码。** 开发者倾向于通过检查容器配置、JVM 选项、操作系统性能、网络性能等来搜寻性能问题，而不是查看代码。这通常是开发者的一的一种痴人说梦。\n\
  \n**在调优之前测量性能以建立基准。** 下一节将讨论如何测量性能。性能测量得出的数字将是判断性能改进有效性的依据。我还会记录在性能测试之间对应用程序所做的更改。这样我就知道调优工作是有帮助还是损害，以及影响到何种程度。\n\
  \n**始终在相同的条件下多次运行负载测试。** 你需要确保没有你未察觉的因素干扰测试。我见过负载测试无意中与批处理运行或服务器备份发生竞争。如果你每个测试至少运行两次，并且每次得到的结果相似，那么你对\
  \ JMeter 给出的信息会有更高程度的信任。\n\n**记录并限制每次测试之间的更改。** 如果你在负载测试之间进行了多处更改，你将不知道哪些更改帮助了或损害了性能。例如，假设你更改了四个地方。可能其中一个更改帮助了性能，另一个更改损害了性能，而另外两个没有产生任何实质性的差异。由于你将这些更改结合在一起，你永远无法真正知道是什么帮助了性能，什么损害了性能。\n\
  \n**在测试期间监控并记录 CPU 和内存使用情况。** 这一点最简单的方法是在操作系统层面进行。大多数 UNIX 操作系统都提供 `top` 工具，它可以提供每个进程的\
  \ CPU 和内存使用率，以及整个服务器的使用率。你显然对负载测试期间容器进程发生了什么感兴趣。列表 16.1 是 `top` 工具输出的摘。如果你的应用程序运行在\
  \ Windows 平台上，你需要使用 `perfmon` 工具。\n\n### 列表 16.1：示例 Top 工具输出\n\n![listing16.1.tif](img/00060.jpeg)\n\
  \n将 `top` 工具的输出限制为运行容器的进程会更方便。遗憾的是，`top` 工具的选项在每个平台上都不同。例如，在 Solaris 上，使用 `-U` 选项将输出限制为特定用户。\n\
  \n```bash\ntop –U username\n```\n\n在 Linux 上，你通过 `-p` 选项指定进程 ID 来限制输出。\n\n```bash\n\
  top –p pid\n```\n\n如果你使用的是 Linux 以外的 UNIX，你必须咨询你特定 UNIX 平台的 `top` 工具的帮助页。顺便说一下，Loukides\
  \ (2002) 是解释 UNIX 工具提供的 CPU 和内存利用率统计数据的极佳参考。\n\n你预计在测试期间看到 CPU 和内存使用率增加，并在测试后减少。如果你在测试后没有看到内存分配减少（例如，在十五到三十分钟内），那么很可能存在内存泄漏。你应该对负载测试进行\
  \ CPU 使用和内存使用的剖面分析（profile）。\n\n如前所述，我通常通过 `VisualVM` 或 `Jconsole` 等 JMX 控制台监控堆内存。操作系统层面的内存包含了不直接由应用程序代码控制的内存。\n\
  \n**除了性能外，还使用负载测试检测内存泄漏。** 是的，尽管 Java 有内存垃圾回收器，但仍然可能泄漏。确定是否存在内存泄漏相当容易，但要找到它在哪里要困难得多。下一章将介绍更多关于识别内存泄漏的内容。\n\
  \n# 负载下的性能测量\n\n大多数负载生成器（如 `Jmeter`）通过并发运行多次测试脚本（或一组脚本）来工作，模拟可配置数量的虚拟用户。通过测量每个虚拟用户获得的性能，负载生成器能够让你检查所有虚拟用户的平均性能。有时这些信息会以图形化的形式呈现。\n\
  \n例如，我为 Admin4J 产品编写了一个 Jmeter 负载测试。负载测试的结果如图 16.1 所示。输出中两个最重要的数字是每秒 10.5 次 (hps)\
  \ 的吞吐率和平均 29 毫秒的客户端响应时间。正如你预期的，吞吐量要求相当低（例如 2 hps 响应时间小于 2 秒是合理的），因为这些是调查问题的开发人员频繁访问的页面；10.5\
  \ hps 应该足够。通用规则是用户不喜欢等待超过 2 秒的响应；29 ms 的平均响应时间满足要求。\n\n### 图 16.1：示例 JMeter \n\n\
  负载测试通常以 URL 序列的形式编写。除非应用程序有需要在负载下测试的重大后端处理，否则我不喜欢为其他类设置测试。例如，如果你的应用程序处理来自其他应用程序的\
  \ JMS 消息就会发生。\n\n虽然负载生成器可以告诉你你正在满足性能目标，但它不能告诉你为什么性能是那样。如果你满足了性能目标，你应该停止调优工作。如果你没有达到目标，你需要应用额外的技术来诊断性能问题的原因。\n\
  \n如果你识别了性能问题并需要调优应用程序，下一章会有关于改进性能的内容。\n\n内存泄漏定义\n\n\n\n\n\n在 Java 中，内存泄漏发生在代码保留了对不再需要的对象的引用时。引用是一个变量的声明和赋值。Java\
  \ 的垃圾回收器会定期释放与不可引用变量相关的内存。如果一个变量是可引用的，则它的内存就不会被释放。\n\n例如，在代码中的变量 `account` 是对一个值对象的引用：\n\
  \n```\nAccountVO account = new AccountVO();\n```\n\n如果这行代码作为方法内部的局部变量声明，则该引用在方法完成时结束。方法完成后，垃圾回收器会释放与\
  \ `account` 声明相关的内存。\n\n如果该声明是一个实例级字段，则引用在包含它的对象不再被引用时结束。例如，如果变量 `account` 被声明为\
  \ `CustomerVO` 的实例级字段，那么当对已实例化的 `CustomerVO` 对象的引用结束时，对 `account` 的引用也会结束，如下所示：\n\
  \n```java\npublic class CustomerVO\n{\n    private AccountVO account = new AccountVO();\n\
  }\n```\n\n定义为 `static` 的变量很容易导致内存泄漏，因为引用只有在 `JVM` 停止或引用被显式置为空时才会结束。\n\n### Java\
  \ EE 应用中的内存泄漏\n\nJava EE 应用中的内存泄漏通常由静态定义的 `Collection` 对象引起。例如，常见的做法是静态地定义一个应用程序\
  \ `Properties` 对象来存储配置细节，如下所示：\n\n```java\npublic class Environment\n{\n    private\
  \ static Properties _configurationProps = new Properties();\n}\n```\n\n存储在此静态定义的\
  \ `Properties` 对象中的任何值都可以被引用。`Collection` 对象（如 `Properties` 或 `HashMaps`）经常产生内存泄漏，因为很容易向它们放入值而稍后又忘记删除它们。\n\
  \n### 识别内存泄漏\n\n要识别内存泄漏，请注意容器在测试之前、期间和之后使用了多少内存。你应该看到内存初始时处于低水平，然后在测试期间期间上升，并在测试后几分钟到一小时内缓慢下降。例如，容器初始可能从\
  \ 128MB 内存开始并在性能测试期间增长到 180MB。测试后，内存分配应该趋于回到 128MB。我通常运行此测试二十四小时（时间足够长以揭示缓慢的内存泄漏）。\n\
  \n**负载测试无法发现所有的内存泄漏。** 请注意，即使你的负载测试套件没有识别出内存泄漏，应用程序中仍可能存在内存泄漏。大多数负载测试脚本都不是全面的；也就是说，它们没有执行应用程序的所有功能。你的应用程序中可能存在不属于你负载测试套件的内存泄漏。在大多数情况下，创建和维护全面的负载测试套件所需的资源远多于大多数组织愿意资助的资金。因此，对应用程序进行插桩并配置你的\
  \ Java EE 容器非常重要，这样在生产环境发生内存短缺时就能获得足够的信息。关于如何实现此点的更多信息将在第 16 章介绍。\n\n**内存泄漏最可能在生产环境中发现。**\
  \ 虽然我鼓励你通过运行二十四小时或更长的负载测试来检查内存泄漏，但负载测试只会执行脚本的内容。如果负载测试脚本没有为内存泄漏的发生创造条件，那么长时间运行负载测试也不会发现泄漏。\n\
  \n我使用 `VisualVM` ([`visualvm.java.net/`](http://visualvm.java.net/)) 在性能测试期间监控内存。`VisualVM`\
  \ 是一个 JMX 控制台，要求你为被测试的容器打开 JMX 端口。你也可以使用 `JDK` 附带的 `jconsole` 工具。我更倾向于使用 `VisualVM`，因为它具有更广泛的插件选择，除了测量内存外还有许多用途。虽然你可以在操作系统级别测量内存，但你可以将堆内存（内存泄漏通常发生的地方）与\
  \ `JVM` 中通常分配的各种其他内存池隔离开。\n\n内存返回到测试前的水平是不现实的，但测试期间分配的大部分内存应该被释放。为了调查内存泄漏，一旦确认了泄漏，我就会开始获取内存转储。虽然你可以使用\
  \ `jhat` 工具读取内存转储的内容，但这非常费力且耗时。我通常使用商业性能分析器 `YourKit` ([`www.yourkit.com/`](http://www.yourkit.com/))\
  \ 来调查内存泄漏。结果应该是你识别出哪些事务生成了泄漏，并且你可以构造一个产生该内存泄漏的负载测试脚本或单元测试。有了可复现的泄漏，你可以在修复泄漏后使用分析器来验证修复结果。\n\
  \n**配置 Java EE 容器在抛出第一个 OutOfMemoryError 时产生内存转储。** 如果你使用的是 Oracle `JVM`，可以通过对容器指定\
  \ `XX:+HeapDumpOnOutOfMemoryError` 选项来实现。然后，你可以使用 `JVM` 带的 `jhat` 工具或商业分析器来调查内存是在哪里分配的。我在所有环境的所有\
  \ Java EE 容器都会使用此配置选项；这不仅是为了负载测试。如果生产环境中发生内存泄漏，转储中的信息将非常有价值。\n\n此外，我使用 `Admin4J`\
  \ ([`admin4j.net/`](http://admin4j.net/)) 为异常高内存占用生成警报。这些警报带有可配置的内存分配历史和线程转储。该工具不会自动生成内存转储，因为那样非常消耗资源。线程转储可能有助于识别作为潜在内存调优目标的事务类型。\n\
  \n### 调查性能问题\n\n在某些时刻，负载测试会识别性能问题和需要解决的问题。性能调优遵循 80/20 原则；你从 20% 的工作中获得 80% 的收益。在识别问题后，你需要的信息是在代码的哪些部分花费了大部分时间。分析器可以很好地做到这一点。但在进行性能分析之前，在负载测试期间获取线程转储。\n\
  \n\n\n\n\n当你在负载测试期间执行线程转储且所有线程都处于测试脚本的随机位置时，你实际上是在同时获取许多性能分析类型的观测结果。如果 `CustomerDAO.findCustomerByState()`\
  \ 出现在大多数活跃线程中，那么它就是一个热点，通过调优可能会带来性能提升。\n\n有一些诸如 Thread Dump Analyzer ([`java.net/projects/tda/`](http://java.net/projects/tda/))\
  \ 这样的工具，可以让解释线程转储变得简单一些。我会检查线程转储中的锁竞争（被标记为 `BLOCKED` 并在等待资源的线程）。分析单个线程将无法告诉你任何关于锁竞争的内。\n\
  \n调优非热点的方法并不是明智的时间利用方式。例如，假设你可以调优一段代码并获得 10% 的性能提升。调优占用你 50% 时间的热点将使你的整体吞吐量提升 5%（50%\
  \ 乘以 10%）。调优另一个仅占用你 5% 时间的方法，将只会产生 0.5% 的整体吞吐量提升（5% 乘以 10%）。\n\n### 使用特定的单元测试脚本通过性能分析工具调优热点。\n\
  \n性能分析器按照配置的间隔（通常为每五毫秒一次）报告 `JVM` 的活动，并报告每个线程正在使用的调用栈。耗时最多的方法最可能出现在更多的观测中，并为你应该在哪里进行调优提供线索。我的首选是构建一个执行低性能代码的\
  \ Junit 测试。\n\n如果你的容器使用一个 `JVM`，你可以对整个容器进行性能分析，并对其运行你的 JMeter 测试脚本。作为最后的手段，我会对整个\
  \ Java EE 容器进行分析，因为分析单个单元测试通常所需的时间更短。\n\n某些 Java EE 容器使用多个 `JVMs`，这使得对整个容器进行分析变得困难。相反，你需要直接对使用底层业务对象的测试例进行分析。你将跳过整个部署层和表示层的分析，但性能调优可能发生在业务逻辑层或更底层。在分层架构中，部署层和表示层并没有进行大量的处理。\n\
  \n### 不要尝试在集群环境中进行性能分析。\n\n对于那些在集群架构中的同事，我建议只在一个实例上进行性能分析，而不要在集群模式下进行。你的目标是调优你的应用程序，而不是费力处理容器为了实现集群所做的工作。\n\
  \n性能分析器会告诉你 CPU 时间消耗在哪里（哪个类或方法中），以及内是在哪里（哪些类中）分配的。`JVM` 自带的默认性能分析器 (`HPROF`) 产生的输出并不直观且难以阅读，但该输出包含了与商业性能分析器相似的信息。商业性能分析器的优势在于它们让性能信息更易阅读和解释。如果你的组织拥有商业性能分析器的许可证，请使用它代替\
  \ `HPROF`。\n\n如果你无法使用商业性能分析器，你可能需要比那些拥有商业性能分析器的同事多花几分钟来解释输出结果。默认性能分析器同时测量 CPU 时间和内存分配，但我建议分别测量这两者，以避免污染测试。调试内存泄漏的方法也包含在下一章。\n\
  \n![stock-photo-17860137-binary-code-bw-horiz-slice.tif](img/00003.jpeg)\n\n# 第\
  \ 17 章\n\n## 使 Java EE 应用程序具有可维护性\n\n与其它类型的应用程序一样，Java EE 应用程序需要不同程度的支持。在之前的章节中，我们详细讨论了错误处理策略、日志策略、单元测试策略，以及提高\
  \ Java EE 应用程序质量并使其更容易维护的其他技术。这些技术是使 Java EE 应用程序具有可维护性的开始，但它们并不是全面的。首先，异常日志和通知虽然很重要，但在诊断许多类型的停机（如内存不足或锁定问题）时，它们并不是完整的信息源。此外，管理员还需要协助容量规划工作，并帮助管理层有效指导资源，以提高质量并影响\
  \ Bug 的修复。本章将详细介绍 Java EE 应用程序中常见的支持问题，并建议如何对应用程序进行插桩以解决这些问题。\n\n虽然许多组织的应用程序架构师并不直接参与提供应用程序支持，但他们应该关注支持他们设计的应用程序所需的资源。让架构师对其设计的应用程序提供支持是极具建设性的，因为它提供了他们可以用于未来设计的宝贵反馈。\n\
  \n### 应用程序支持目标\n\n大多数组织寻求在最大化终端用户应用程序体验的同时，尽可能地减少与提供该体验相关的成本。Java EE 应用程序与构建在其他技术栈上的应用程序并无区别。\n\
  \n这两个目标是同一连续体上的极端。也就是说，提供更好的终端用户体验通常在人工成本方面代价更高。相反，减少人工成本通常会降低终端用户体验，因为解决问题和缺陷需要更长时间。大多数组织在这两个极端之间取得主观的平衡。\n\
  \n最大化应用程序的终端用户体验意味着减少非计划停机、减少缺陷、提供可接受的性能，并快速高效地解决应用程序中的用户问题等。\n\n减少与提供预期终端用户体验相关的成本，意味着减少与处理停机和缺陷相关的成本和时间。是的，这些成本的一部分是支持应用程序的各种测试程序和框架，因为它们从源上防止了缺陷。然而，无论你的测试程序和框架有多健壮，缺陷总会在生产环境中出现。此时，减少缺陷成本意味着尽可能地减少调查时间，以及诊断、修复和测试该问题修复所需的时间。\n\
  \n### 简化应用程序缺陷的调查\n\n缺陷由用户报告，在许多情况下也由应用程序本身通过生成异常报告。如果建立了日志记录和通知，应用程序支持人员可能在用户报告之前就发现系统生成的异常。此外，并非所有缺陷都由用户报告。这有许多原因：这需要他们可能没有的时间，他们可能错误地认为已经有人报告了缺陷，或者可能是对缺陷的响应时间不如预期，导致他们不愿报告。关键点在于，某些缺陷只会通过系统异常报告。\n\
  \n用户报告的缺陷可能伴随着系统生成的异常。虽然系统生成的异常更详细并能为开发人员提供更可靠的信息，但并不总是能从异常推断出用户受到了什么样的影响。需要注意的是，并不是所有的缺陷都会产生异常。在运行时增加日志级别（例如为了调试）是有价值的。\n\
  \n**根据每个缺陷产生的系统异常数量来优先处理缺陷。** 异常数量通常是用户体验缺陷频率的良好指标。通过优先处理产生较多系统异常的缺陷，你可以最快地帮助尽可能的人。[Admin4J](http://admin4j.net/)\
  \ 可以帮助你汇总日志异常并让你知道哪种异常类型/缺陷发生得最频繁。\n\n\n\n\n\n优先处理指示缺少所需资源的缺陷。数据库不可用就是此类示例。资源中断（如数据库不可用）通常会影响应用程序内大量的事务类型和用户活动。\n\
  \n系统生成的异常通常在用户报告相应的缺陷之前出现。因此，如果系统生成的异常被修复得足够快，用户可能永远不会察觉或报告它。通常，在新版本发布后，我会密切监控系统生成的异常。这能让我尽早察觉我们是否在无意中发布了新\
  \ Bug，并让我有机会在用户报告之前就开始处理该问题。\n\n遵循生成异常的最佳实践。理想情况下，异常报告中应该包含足够的信息来诊断 Bug 并制定修复策略。请使用\
  \ `ContextedException` 和 `ContextedRuntimeException` 在你的异常中安全地包含有用信息。此举是为了节省开发人员调查缺陷的时间。如果异常报告没有提供足够的信息来诊断\
  \ Bug，那么你必须做两处更改：修复该 Bug，并增强错误报告，以节省开发人员调查未来缺陷报告的时间。\n\n# 简化非计划停机的调查\n\nJava EE\
  \ 应用中非计划停机的常见原因包括内存不足、`java locking` 或竞态条件问题，或者意外的高负载用户。对于这些类型的停机，调查所需的时间通常大于实际修复它们所需。本节将向你展示对\
  \ Java EE 应用进行插仪表的方法，以减少与这些事件相关的调查时间。\n\n此外，Java 虚拟机 (`JVM`) 的低级 Bug 可能导致 Java EE\
  \ 容器崩溃；幸运的是，由于 JVM Bug 导致的崩溃现在已经罕见。\n\n# 调查内存不足\n\n堆内存不足分为两类：泄漏和使用峰值。泄漏通常源于意外引用超过所需的内存。被引用的内存无法被垃圾回收，并占据了本可以用于正常应用程序活动的内存。当泄漏足够大时，就没有足够的内存来处理用户请求，容器将失效。使用峰值是满足用户活动所需的内存。使用峰值可能由意外的高用户量或意外的大信息请求引起。请注意，Java\
  \ 会为堆之外的目的分配内存，但非堆不足非常罕见，且会有非常特定的异常指出；此外它们很容易解决。因此，本节重点关注堆内存问题，这是目前最常见且最难解决的问题。\n\
  \n任何内存不足调查中，第一个也是最重要的问题是：是内存泄漏还是使用峰值？这个问题的答案非常重要，因为它决定了后续调查的活动以及你修复问题的选项。内存泄漏一旦被识别，如果你控制导致泄漏的代码，通常可以通过代码修复来解决。使用峰值通常可以通过调整内存消耗并寻找使用更少内存满足用户需求的方法来减少。使用峰值有时可以通过限制应用程序内的用户能力来解决。例如，限制可以检索显示的信息量通常可以减小使用峰值的大小。这的一个示例是编写应用程序，使得如果用户发起的返回大量结果集的搜索，则只提供前五百行（或选定的任何大小），并附带一条用户消息告知他们如果需要，还有更多结果。在这些选项都耗尽后，你可以为\
  \ JVM 分配额外的内存以适应负载。\n\n通常，内存不足问题很难调查，因为可能关于崩溃时分配了哪些内存的信息很少。也就是说，如果调查人员恰好在内存不足发生前在场，并以某种方式知道即将发生的崩溃，他们就可以启动容器的内存转储（memory\
  \ dump）和线程转储（thread dump），识别出异常巨大的内存分配，并识别出崩溃时正在处理的用户活动列表。遗憾的是，支持人员几乎无法提前预知即将发生的内存不足。对于使用\
  \ Oracle（原 Sun）JVM 的用户，可以使用 [jmap](http://docs.oracle.com/javase/6/docs/technotes/tools/share/jmap.html)\
  \ 工具获取内存转储。线程转储可以使用 [jstack](http://docs.oracle.com/javase/6/docs/technotes/tools/share/jstack.html)\
  \ 工具或在容器通过编程方式获取。\n\n有大量的监控工具可以提醒管理员内存不足。此类工具的开源示例包括 [Zabbix](http://www.zabbix.com/)\
  \ 和 [Nagios](http://www.nagios.org/)。此外，还有许多商业替代方案。这些工具通常在企业级进行实施和配置，大多数可以配置为在告警管理员的同时启动线程转储和内存转储。注意，获取内存转储是资源密集型的，因此请谨慎触发自动内存转储。这些工具大多数依赖于\
  \ Java 管理扩展 ([JMX](http://www.oracle.com/technetwork/java/javase/tech/docs-jsp-135989.html))\
  \ 并从容器外部进行监控。对于那些支持尚未实施企业监控工具的组织应用程序的开发者，[Admin4J](http://admin4j.net/) 从容器内部提供内存监控服务，并可以随你的应用程序一起部署。\n\
  \n内存只能在容器级进行测量。对于每个 Java EE 容器部署多个应用程序的组织，在容器内识别故障应用程序要困难得多，因为你无法可靠地测量分配给容器内单个应用程序的内存。由于这个及其他原因，我建议每个容器部署一个应用程序。是的，这种做法会消耗额外的内存，因为每个容器都有一定的开销。然而，在大多数平台上，内存现在很便宜。\n\
  \n内存泄漏可以通过内存转储检测，但这对容器内运行的应用程序代码有详细了解。如果没有对被监控应用程序的了解，调查内存事件的人将无法区分正常预期的分配与意外引用的内存。如果事件期间获取的线程转储也可用，且显示没有活跃的用户请求，那么分配的内存要么来自泄漏，要么尚未被垃圾回收。内存转储将区分已引用的未引用的（可回收的）内存。\n\
  \n内存泄漏还可以通过分析随内存分配模式来检测。内存泄漏应用程序的最小内存分配（垃圾回收后立即消耗的内存）总是增长且永不缩小。例如，如果一个泄漏应用程序一天的最小内存分配为\
  \ 100MB，且该最小值持续增长且永不缩小，那么该容器内的应用程序存在内存泄漏。\n\n\n\n\n\n# Java 锁或竞态条件问题会导致内存短缺。这是因为锁问题会导致用户活动持续持续时间比正常情况下更长。在这些活动进行期间，分配给其提供服务的内存无法被垃圾回收和重用。在这种情况下，内存短缺是派生的。也就是说，它不是根问题，因为如果没有导致它的\
  \ Java 锁问题，该问题就不会存在。在这些情况下，应先解决 Java 锁问题；一旦锁问题解决，内存短缺问题通常也会消失。例如，JDBC 驱动同步了创建数据库连接的能力。这意味着容器一次时间只能创建一个数据库连接。通常情况下，如果连接池配置得当，这并不是一个问题。然而，如果出现意外之外的巨大用户需求，容器可能会有异常大量的线程等待数据库连接以工作。由于这些活动线程每个都会消耗内存，这可能导致内存短缺。\n\
  \n# Java EE 容器在抛出 `OutOfMemoryException` 后可能会变得不稳定。另一方面，容器也可能正常运行并完全恢复。这完全取决于究竟是哪些线程受到了内存短缺的影响。有可能是某个正在处理内存跟踪会话、数据库连接或其他所需资源的线程遭受了影响，导致该跟踪内存处于损坏状态。其他尝试使用该内存的线程可能会遇到意外之外的情况并报错。出于这个原因，我通常会安排在下一次正常维护窗口回收容器。\n\
  \n# 资源限制可能导致内存短缺。此类事件的一个常见例子是数据库连接池的连接限制过小。许多容器会持有传入的数据库连接用户请求，直到有可用连接来处理该请求为止。如果你有大量未计划的请求，每个由于缺乏可用数据库连接而被“挂起”的请求都会消耗内存。我多次看到此问题表现为内存短缺问题。在这些情况下，在事件发生期间或稍早之前拍摄的线程转储（thread\
  \ dump）可以很快地揭示此问题。\n\n我侧重于调查内存问题而不是修复它们，因为调查通常耗费最多的时间和资源。一旦找到了内存问题的根源（无论是泄漏源还是由于特定用户活动导致的激值），修复问题通常是比较容易。内存泄漏通常需要更改代码。它们通常涉及静态定义的集合，这些集合被不断添加到集合中但从不进行清理。内存激值可以成为内存调优工作的重点。一旦产生激值的活动得到调优，剩下的唯一备选方案就是为容器分配额外的内存。修复内存问题的工作通常由高级开发人员而非架构师负责，但我发现内存调查及其解决方案对架构师非常有信息价值。如果内存问题的由于设计问题，那么对该缺陷的知识可以避免在未来的应用程序中出现类似的缺陷。\n\
  \n## 调查 Java 竞争问题\n\n# 使用 `synchronized` 关键字的代码可能是竞争问题的产生者。这是因为使用 `synchronized`\
  \ 关键字强制该部分代码一次只能由唯一一个线程执行。在某些情况下，同步是必要的；但应谨慎使用。`synchronized` 关键字可以声明在单个方法上，也可以用于保护对特定对象中所有同步方法的访问。关于多线程编程主题已经写了许多整本书。这个主题确实超出了本书的范围。\n\
  \n# 竞争问题对用户来说通常表现为性能问题。由于竞争问题引起的瓶颈会增加所有相关线程消耗的时钟时间。因此，竞争限制了吞吐量。揭示竞争问题的负载测试通常会将吞吐量限制作为一种症状显示。例如，我的一个\
  \ Java EE 应用程序中的竞争问题曾将负载测试的吞吐量限制在每秒不足 5 次（hps）。无论我们如何更改负载测试的设置，都无法超过 5 hps。测试期间的线程转储揭示了竞争问题，我们得以进行调优并提高了最终吞吐量。\n\
  \n# 竞争不消耗 CPU 资源。这意味着 CPU 利用率通常会显示出大量的 CPU 空闲百分比。在上一段的负载测试示例中，当以 5 hps 的吞吐量测试我的应用程序时，有大量的\
  \ CPU 资源可用。当移除竞争问题后，这些 CPU 资源减少了。\n\n# 必须通过线程转储捕捉竞争问题才能进行诊断和解决。线程转储指示哪些线程处于 `BLOCKED`\
  \ 状态（等待独占对象或方法）以及该线程正在等待什么资源。关于 `BLOCKED` 等线程状态的更多细节，请参见 Java 文档[此处](http://docs.oracle.com/javase/1.5.0/docs/api/java/lang/Thread.State.html)。像内存问题一样，在事件现场让管理员拍摄线程转储通常是不可能的。安装一个监控工具来检测此类情况并自动拍摄线程转储好得多。\n\
  \n# 监控 Java 竞争并在响应竞争事件时自动拍摄线程转储。这为管理员在遇到竞争事件时提供了实时信息。我没有看到 Nagios 或 Zabbix 中原生具备此功能，但这两个产品都足够扩展，我确定这是可能的。[Admin4J](http://admin4j.net/)\
  \ 将监控线程竞争并在通知中包含线程转储。\n\n# 数据库连接池是 Java EE 应用程序竞争问题的常见原因。这主要是由于创建数据库连接时发生的同步。对于\
  \ JDK 1.6 及更高版本，涉及数据库连接池的竞争问题较少，但仍然可能导致问题。通常，调优连接池（例如最大连接数和允许的空闲连接数）可以缓解由于连接池引起的竞争问题。\n\
  \n## 调查性能问题\n\n# 在环境中衡量所有 HTTP 流量、批作业和 JMS 消息处理的性能。了解当前的运行时间是不够的；你需要一些历史数据来判断性能是否缓慢。测量服务器端性能很重要。我意识到用户体验的是客户端性能，这对他们来说更重要。然而，客户端性能可能是网络性能差而不是应用程序性能差的结果。测量服务器端性能是区分这两者的唯一方法。改进网络性能的方法与改进应用程序性能的方法完全不同。\n\
  \n我成功使用过 [JAMon API](http://jamonapi.sourceforge.net/) 和 [Admin4J](http://admin4j.net/)\
  \ 来衡量服务器端性能。这两个产品都从容器内部运行，并且速度都快到可以在生产环境中使用。通常，HTTP 流量监控通过 Servlet 过滤器实现，而这两个产品都开箱提供了这种过滤器。\n\
  \n# 为常见的应用程序功能建立性能目标。性能调优是一项不会结束的活动。此外，所有的调优工作随着时间的推移都会产生收益递减。仅对未达到性能目标的活动进行调优，是使投入调优的资源具有成本效益的好方法。\n\
  \n\n\n\n\n**性能调优遵循 80/20 原则。** 也就是说，前 20% 的性能调优工作提供了 80% 的收益。随着性能调优工作的进行，增量性能提升会变得越来越小。例如，在调优工作的初期，识别出能使吞吐量提高\
  \ 5% 或以上的调优机会是很常见的；而在此类工作的后期，识别出吞吐量超过 1% 的机会可能是一项挑战。\n\n**性能调优活动应该为项目的 UAT（用户验收测试）阶段进行计划。**\
  \ 开发者犯的一个常见错误是在开发过程中进行性能调优。在开发期间进行调优往往会导致针对无关紧的代码，或者目标不够大，无法为性能调优工作提供成本效益的收益。\n\n\
  **在高负载下获取线程转储（Thread dumps）可用于识别应用程序中的热点。** 热点是执行最频繁的代码段。因此，调优热点通常比比调优执行频率较低的代码更有收益。\n\
  \n对于那些可能无法立即看出线程转储如何帮助识别热点的人，可以考虑性能分析器（Profiler）的工作原理。性能分析器通过定期（例如每 5 毫秒）获取线程转储，并记录该转储中当前正在调用哪些类/方法。如果\
  \ `Foo.doWork()` 在其中一个间隔的活动线程中执行，则分配给 `Foo.doWork()` 的时间就会增加，并根据该分配时间计算出 `Foo.doWork()`\
  \ 占时间的百分比。`Foo.doWork()` 出现的间隔越多，性能分析器分配给它的百分比就越高，它看起来越像性能分析器识别出的调优机会热点。同样的概念也适用于生产环境高负载下获取线程转储。`Foo.doWork()`\
  \ 出现的线程越多，在该方法上花费的时间百分比越高，调优它带来的收益也越大。在高负载下获取的线程转储不能取代你的性能分析器，但它们通常可以识别出值得追求的性能调优活动。\n\
  \n**测量生产环境中所有应用程序、数据库和 Web 服务器的资源利用率。** 测量 CPU 和内存利用率以及 I/O 吞吐率。性能问题通常会表现为资源短缺。保留某些历史是非常重要的，因为开发者通常在性能问题发生后收到通知。\n\
  \n**每个 Java EE 容器部署一个应用程序。** 调查计划外的停机要容易得多，因为可能导致故障的应用程序代码量较小。\n\n**在回收无法运行的 Java\
  \ EE 容器之前，将线程转储和内存转储作为标准程序。** 这可能提供导致容器无法运行的线索。\n\n## 评估应用程序质量\n\n我将讨论一些衡量应用程序代码质量的指标。由于这些指标每种都有局限性，在对质量进行整体评估时，建议评估多个指标。\n\
  \n进入生产环境的应用程序缺陷数量通常被视为应用程序质量的指标。缺陷越少，感知质量越高。这种衡量方法的问题在于，使用频繁的应用程序往往比较少使用的应用程序报告了更多的缺陷。这个问题可以通过将缺陷数量与应用程序单位时间内的事务数或页面加载数进行缩放来缓解。\n\
  \n解决应用程序中的用户问题和投诉所需的资源数量可以被视为应用程序质量的指标。通常，这通过支持该应用程序所需的全职开发人员人数来衡量。这通常被称为全职当量（`FTEs`）。应用程序的规模或复杂度并不相同；一个应用程序消耗的支持\
  \ FTE 可能是另一个应用程序的两倍，这一事实可能是由于该应用程序提供的功能规模和广度造成的。因此，为了有效比较一个应用程序与另一个应用程序的支持 FTE 数量，你必须根据某些独立指标（例如代码行数、代码长度、圈复杂度）对\
  \ FTE 进行加权。\n\n自动化测试覆盖率可以作为质量指标之一。覆盖率越高，更改应用程序时产生意外后果的风险就越低。我们已经讨论过，很少有应用程序具有 100%\
  \ 的覆盖率，而且较高水平的自动化测试覆盖收益收益递减。我通常寻找至少 60% 的测试覆盖率。\n\n更简单的代码被认为具有更高的质量，并且有许多工具可以衡量代码复杂性（例如\
  \ `JavaNCSS`）。非常复杂的代码往往难以在不产生意外后果的情况下进行修改。\n\n### 识别重构机会\n\n`Refactoring`（重构）是重写选定的代码使其更容易理解和维护。Fowler\
  \ (2000) 提供了一份广泛的表明需要重构的条件列表——他将这些条件称为“代码异味（Bad Smells in Code）”。尽管他的列表非常详尽，我不认为还需要添加，但它是非常以代码为中心的。对于可能不具备应用\
  \ Fowler 建议所需的深入代码理解的读者，我描述了一些可以观察到的症状，这些症状可能表明需要重构，但不需要对应用程序源码进行完全审核。\n\n**你无法在无意中创建其他\
  \ bug 的修改类可能需要重构。** 这种症状让人想起电影《活死人怕》（*Night of the Living Dead*）。某些编程 bug 不死；它们只是以不同的形式回来。各种情况会导致\
  \ bug 发生这种蜕变。\n\n有时，当类内的代码根据上下文表现得不同时就会发生这种情况。例如，我有一个客户使用中心 API 为多个应用程序提供报告。出于政治原因，API\
  \ 根据是哪个应用程序调用它，对某些参数值采取了不同的解释（我知道这不是个好主意）。最终，该服务需要重构，因为我们无法在更改它的同时不会无意中导致调用它的某些应用程序中产生\
  \ bug。\n\n有时，当单个类内的代码执行过多且应该分离到多个类中时，bug 会发生蜕变。例如，我工作过的一个应用程序必须接受来自多个数据源的数据。某些数据源是关系型数据库，另一些不是。起初，我们只有两个数据源。程序员走了捷径，在管理输入的类中放置了条件逻辑以处理任何数据源。当我们必须添加数据源时，该类必须进行重构。\n\
  \n**需要对多个类进行相同更改的增强或 bug 修复可能意味着重构。** 某些开发者几乎太喜欢复制粘贴技术了。在大多数情况下，多个类中的相同代码应该成为被多个类“调用”的通用代码。在紧的时间范围内，发现复制代码案例的开发者可能没有时间将代码通用化。架构师或经理可以通过提供跟踪这些案例的机制来帮助，以便在时间允许时进行修复。\n\
  \n**开发者害怕更改的异常复杂的方法或类可能需要重构。** 有时这种症状会与之前描述的 bug 蜕变症状共同出现。它是代码太复杂且需要重构的另一个迹。当然，这种症状的有效性取决于开发者是理性的且他们的“恐惧”是合理的假设，这并不总是如此。\n\
  \n\n\n\n\n在 Java EE 领域担任应用架构师面临的挑战之一，是要跟上海量的第三方框架、工具和库，以及它们变化的速度。正如此，关于计算机技术主题的出版物在发布后很快就会过时。本书以及任何其他出版物中提出的许多最佳实践和建议，都依赖于今天\
  \ Java EE 领域可用的功能和工具 set。随着技术的进步，计算机技术领域任何出版物中的实践和建议在某一个时刻都需要进行修订和更新。\n\n现在是时候将对话提升一个层次，看看那些建议和最佳实践列表是如何推导出来的；最佳实践和良好的建议并非随意创建的。\n\
  \n应用架构（包括书中提出的最佳实践和建议）受到一组底层基础性原则的指导。这些原则可以帮助你不仅在现在，而且在未来的道路上——当随着新框架、工具和库的出现以及现有技术的进步时——做出架构和设计决策。我绝不是第一个尝试记录应用架构原则的人。我并不声称我的原则列表是完备的；我特意缩小了原则范围，只保留最重要和最常用的部分。\n\
  \n原则是一个首要法则或真理，可以用来推导出其他原则。在物理和数学领域可以找到许多原则的例子。每个数学学生都学过数学中的加法交换律；即 `2 + 3` 等于 `3\
  \ + 2`。该属性在数学中被广泛用于证明更复杂的理论。应用架构的操作方式也类似，它受一组基础原则的指导，这些原则被用于推导出今天许多通认的最佳实践。一个经常被引用的软件开发原则示例是\
  \ `DRY` 或“不要重复自己”（Don’t Repeat Yourself）。\n\n我将架构原则与最佳实践区分开来，因为两者经常被混淆。最佳实践是应用于特定技术、产品或开发环境的原则。例如，使用第三范式设计关系型数据库的最佳实践应用了\
  \ `DRY` 原则，避免了在多处记录相同的数据。与生产代码一起编写单元测试的最佳实践应用了“及早发现错误比后期发现错误更好”的原则。对所有公共和受保护方法检查参数的最佳实践应用了“及早发现错误比后期发现错误更好”的原则。本质上，“最佳实践”是一种可以用直接应用于一组特定情况和技术的术语编写而成的准则。相比之下，“原则”是使最佳实践变得有用且值得遵循的底层真理。\n\
  \n值得讨论的架构原则具有几个品质或属性。架构原则是产品通用的；即也就是说，它们不引用特定的产品、框架或技术。如上所示，原则通常与特定的框架和产品结合形成最佳实践。架构原则是简单的；复杂的原则将永远不会被记住或应用。架构原则是适用的；即也就是说，它们的表述方式可以很容易应用到新情况中。架构原则是独立的；即也就是说，它们与其他原则无关。架构原则在逻辑上是一致的；它们不会与其他原则矛盾。\n\
  \n话话长说，我遵循的架构原则是：\n\n*   越简单越好（Simpler is better）。\n*   复用，不要重新发明（Reuse, don’t reinvent）。\n\
  *   强制执行关注点分离（Enforce separation of concerns）。\n*   顺势而为（Swim with the stream）。\n\
  *   及早发现错误而非后期（Catch errors earlier rather than later）。\n*   功能需求是最高优先级（Functional\
  \ requirements are the highest priority）。\n\n注意，这些原则适用于所有应用程序，而不仅仅是 Java EE 应用程序。\n\
  \n# 简单更好\n\n简单的解决方案总是比复杂的解决方案好。这适用于应用代码，适用于应用程序服务的业务流程，也适用于保持应用程序正常运行所需的 IT 支持程序。应用代码中更简单的解决方案更容易理解和维护。它们的缺陷更少。它们更容易教给团队的新成员，且新成员学习得也更快。更简单的应用程序支持程序大大增加了它们被理解和遵循的概率，而且让新的支持人员加入团队也更容易。此外，应用程序对用户来说越简单，用户关于如何完成工作的问题就越少。\n\
  \n只容忍足以满足已知业务需求的所需的复杂性。有些问题天生就是复杂的。例如，空中交通控制（例如为了避免碰撞而跟踪所有飞机的位置）就是一个天生复杂的业务问题。因此，所有应用程序中的某些复杂性是不可避免的。但我们把业务问题要求的复杂度与不必要的复杂度区分开来。不必要的复杂性的例子是由开发者失误或设计决策糟糕而引入的组件。业务问题要求的复杂度是无法避免的。\n\
  \n有时，很难区分这两种复杂度。有时，增加一点复杂性会使未来的计划变更变得更容易。问题在于，如果这些计划改变了，那么之前添加的复杂度就会变得多余，并且在不提供任何收益的情况下更难维护。例如，我们经常需要选择是硬编码一个值、将所需的值设为常量，还是使该值可配置的（即作为参数传递或从环境中获取值）。将硬编码值变为具有描述性命名的常量所需的额外复杂度很低，由于不涉及条件逻辑，它不会增加所需测试用例的数量。它向未来的开发者传达了该值描述什么，并极可能在未来做出更改时节省开发者的时间。大多数开发者对于支持常量而非硬编码值所需的所需的少量额外复杂度是可以接受的。\n\
  \n人们往往倾向于将该值设为可配置，并使该部分代码在其他用例中更具活性、可能更易于使用。然而，做出这一决策会增加条件逻辑（即：你需要测试配置的值，并在值无效时产生描述性的错误消息）。使用“简单更好”的原则，在需要之前*不应*将该值设为可配置，因为这增加了条件逻辑。将“简单更好”的原则应用于决定是硬编码还是设为常量，则更为困难。从严格来说，将值设为常量并不是产生软件所必需的。然而，让代码易于阅读（因此更容易修改）是我们在大多数时候都遵循的一项隐含业务需求。我们大多数人都会因为代码可读性的原因直接声明常量。\n\
  \n\n\n\n# 一致性是一种简单的形式。\n\n这既适用于编码规范，也适用于产品选择。编码规范的一致性可以优化开发人员的时间并减少所需的文档量。例如，如果你的包结构在所有应用程序中都是一致的（例如，`.dao.`\
  \ 包中是数据访问对象，`.ui.` 包中是与用户界面相关的类等），那么新开发者就能更容易找到他们寻找的代码，即使他们对某个特定应用程序的经验有限。另一种包结构可能会带来微小的增量式改进，但这些差异会在开发者之间造成某种程度的困惑。这种困惑会减慢他们的速度。诚然，不同的包结构可能在很长时间内不会太拖慢开发者，但其他差异更具侵入性。\n\
  \n以产品选择的一致性为例，考虑用户界面（UI）框架。大多数 UI 框架都是复杂的，需要很长的学习曲线。考虑 `Struts`、`Struts II`、`Java\
  \ Server Faces` 或任何其他用户界面框架。整个企业范围内统一使用一种 UI 框架（即在产品选择上保持一致），可以让开发者更容易地在应用程序之间切换。同样的概念也可以应用于持久化框架和其他包含的产品。\n\
  \n## 在整个企业范围内标准化常见问题的解决方案。\n\n例如，如果某些应用程序需要通过程序将数据从一个主机传输到另一个主机，那么采用具有 FTP 能力的通用库是一个更简单的解决方案。一旦开发者理解了如何使用该库，他们就能更容易在企业内的任何应用程序中增强或修复\
  \ FTP 逻辑。另一个例子是，某些应用程序需要批处理；即不是由用户启动的处理，而是按照定义的计划发生处理。如果你选择一个调度器并在整个企业范围内将其标准化，开发者只需要学习一种调度器产品，而且这种知识很容易迁移的。\n\
  \n# 重用——不要重复发明\n\n## 趋势是重用已有的组件，而不是发明现有组件的新版本。\n\n这一原则适用于应用程序和单元测试代码。它也适用于存储的数据（例如，关系型数据库设计应遵循第三范式，以避免同一信息的多个份副本）。这一原则有时被称为缩写“不要重复自己”（Don’t\
  \ Repeat Yourself, DRY）。\n\n根据定义，代码重用通过代码行数衡量减少了代码库的大小。代码重用优化了开发时间；重用通常比重新发明更快。代码重用还巩固了维护工作；使用常用代码进行的\
  \ bug 修复可能会修复广泛的 bug，因为相同的代码被用于多个地方。例如，考虑一个在企业范围内使用的工具函数，它根据一个人的名、中间名和姓组成全名（即：将值“Derek”、“Clark”和“Ashmore”转换为字符串“Ashmore,\
  \ Derek Clark”）。假设此工具函数对于没有记录中间名的人会产生空指针异常。这个 bug 可能会出现在多个应用程序中，但可以在代码的一个中心化部分进行修复。\n\
  \n## 重用原则的一个推论是“不要重复他人的”。\n\n不要重建/重写 `JDK` 中已有的或在销售或开源产品中可用的内容。为了这一目标，`Apache Commons\
  \ Lang`、`Commons IO`、`Commons Collections` 和 `Commons BeanUtils` 是我的应用程序经常添加的内容。这种做法不仅节省了开发时间，还节省了测试时间并减少了\
  \ bug 的概率。为了说明这一点，考虑上述提到的任何产品。它们都拥有多年开发的详尽单元测试套件。此外，这些产品已经在全球成千上万的产品和应用程序中经过了现场测试。这种级别的测试覆盖范围远超过你重新发明的代码所能提供的。\n\
  \n## 在整个企业范围内集中领域特定或架构特定的工具代码。\n\n拥有多个开发团队的组织通常有相似甚至完全相同的需求。当我检查我目前的一个客户时，我看到了一组常用的\
  \ `Hibernate` 实体类在该组织的各个应用程序中共享/包含。我还看到对于他们采用的特定技术产品栈的通用类：例如，数据访问对象 (`DAO`) 类的基类、实体类、Web\
  \ 服务服务器类、用户界面转换类等。我还看到用于连接他们使用的销售产品的接口类。所有这些内容都单独存储在版本控制中，并很容易被包含在多个应用程序中。\n\n中心化的代码需要更严格的代码管理。有效管理通用代码的模型是任命一小组高级开发人员作为中心化代码的管理员。这确保了添加到中心化库中的代码符合代码质量和设计标准，并具有单元测试。你可以将该小组视为内部产品的“提交者”（committer）组。虽然在这一层级中心化代码确实需要额外的工作，但在节省整个企业开发时间方面的收益可能是巨大的。如果你的组织为多个应用程序采用相同的技术产品\
  \ set，你就可以从架构层面解决跨端关注点。错误处理和日志不应该是特定应用程序的开发人员担心的问题；架构应该为你处理这些。同样，事务管理和安全问题也可以在架构层面解决。\n\
  \n重用原则也可以应用于数据库设计。数据库设计应严格遵守第三范式，以避免多次记录同一事实。通常，开发者很容易在“反范式化”的标签下试图打破这种范式；我在前一章节中讨论过，这在关系型数据库技术尚新的时代并没有那么需要了。本质上，多次记录相同的数据意味着需要维护这些额外的副本。维护这些额外数据副本所需的额外代码，仅仅是因为维护了多个副本。通过将事实中心化并只记录一次，你减少了整体所需的维护代码。\n\
  \n# 强制执行关注点分离\n\n软件组件应该具有狭窄的焦点，只关注它们实现目标所需的内容；仅此而已。软件“组件”的定义是松散的。它们可以是单个类，也可以是一个独立的库。\n\
  \n“关注点分离”原则促进了简单性，因为不存在处理不需要的信息依赖的代码。关注窄的组件促进了重用；它们的目的对开发者来说更清晰，并且在更广泛的范围内更具通用性和用处。这一原则使得软件组件更容易测试，因为它们减少了测试代码必须管理的依赖。这一原则有效地将复杂问题分解为一系列简单的问题；它鼓励编写具有清晰且简洁任务的代码。这一原则有几个实际影响，如下：\n\
  \n\n\n\n\n# 应用关注点分离原则\n\n这将产生大量的软件组件或类。然而，这些类将变得简单得多且更加通用。软件分层（Software layering）是将应用程序拆分为不同层次的实践，它是应用关注点分离原则的一个示例。正如你在之前的章节中看到的，软件分层会产生更多的类，但每个类都有更明确的角色和目的。例如，数据访问类或\
  \ `DAO` 负责特定实体或数据库表的所有读写操作。它的目的非常明确，并且可以很容易在各种场景下被使用和重用，有时甚至可以在不同的应用程序中使用。\n\n###\
  \ 软件组件应该有明确的任务\n任何其他情况都会导致开发者的困惑和不必要的代码复杂度。具有多个任务或用途的组件通常比那些单一目的类更复杂，包含更多的条件逻辑。这种对任务的关注使得组件更容易使用且更通用。它还由于组件的责任较少，减少了更改软件组件的需求。例如，在\
  \ `DAO` 类中嵌入业务逻辑（我经常看到的一种错误）会让 `DAO` 变得更复杂，通用性也降低，因为它现在必须假设某种调用上下文。如果将这些业务逻辑分离出来，将更易在应用程序的其他功能中重用该\
  \ `DAO` 类。\n\n### 只给软件组件完成任务所“需要”的信息\n提供不必要的信息会使软件组件更难使用，因为很难区分重要的内容和需要的内容。例如，如果你为一个类方法提供了完整的客户实体类，而它实际上只需要客户的姓、中间名和名，那么开发者就不清楚该组件到底需要客户实体的哪部分。当客户实体发生变化时，就必须检查该组件可能产生的影响。另一方面，如果这三个字符串是该组件方法的参数，那么对客户实体类的更改就不可能影响该组件的行为。避免在方法中使用不必要的参数。避免在类级别使用不必要的字段。换句话说，组件就像间谍；它们应该基于“按需知”的原则进行工作。\n\
  \n### 单个类和方法不应对执行上下文做出假设\n换句话说，类和方法应该是独立的，不应假设自己是更大调用序列的一部分。例如，我曾见过开发者在 `DAO` 类中硬编码提交（commits），假设该特定的\
  \ `DAO` 只会在特定的用例中使用。这限制了该 `DAO` 类的使用，因为它实际上无法被用于其他需要在同一工作单元内执行额外数据库写入的用例。单独处理提交或回滚（rollback）会更好；由于这是一个交叉关注点（cross-cutting\
  \ concern），我通常使用 servlet 过滤器来处理提交和回滚。通常，开发者很难理解这个概念。他们很难可视化除当前关注的用例之外的特定代码段的用途。\n\
  \n### 不要暴露比必要的更多的字段和方法\n也就是说，受保护的方法（protected methods）应该被至少两个扩展类引用。公共方法（public methods）应该被至少一个外部类引用。这是对“按需知”概念的延续。暴露的字段和方法增加了类以非预期或未经测试的方式使用的可能性。换句话说，如果你暴露了字段或方法，你需要额外的单元测试来覆盖这些额外的功能。一个常见的例外是对于通常应为私有的复杂方法将其设置为受保护，以便可以编写特定的单元测试来对其进行测试。这种情况很少发生，但确实存在，而且为了测试目的将复杂方法提升为受保护状态是有益的。\n\
  \n### 不要引入不需要依赖\n这是“按需知”概念的延续。不必要的依赖使组件更难使用和测试，因为这些依赖需要被提供，并且需要满足它们运行所需的任何要求。例如，只有\
  \ `DAO` 类应该依赖于 `Hibernate` 或 `JPA` 类。业务逻辑层的代码具有 `Hibernate` 依赖意味着 `Hibernate` 至少存在，并且可能需要配置才能运行逻辑。这为这些业务逻辑类的单元测试用例增加了额外负担。此外，如果升级\
  \ `Hibernate` 或切换到其他 `JPA` 实现，会增加影响的可能性。通过观察向应用程序中引入不同第三方产品所花费的工作，你可以更清楚地看到这个概念。引入像\
  \ `Spring` 或 `Hibernate` 这样依赖型的产品涉及更多工作，因为你通常需要检查这些依赖的潜在版本冲突。相反，引入没有依赖的产品（例如 `Apache\
  \ Commons Lang`）非常容易，因为版本冲突的可能性小得多。\n\n### 使用代理（proxies）隔离所有应用程序接口\n也就是说，为你的应用程序使用的所有外部应用程序创建一个代理类。例如，如果你的采购应用程序通过\
  \ Web 服务使用客户管理应用程序的功能，请为该活动创建一个或代理类。这限制了外部应用程序内部变化的影响；对外部应用程序的变化只会影响代理类。此外，这使得单元测试变得更容易，因为你可以对外部应用程序进行存桩（stub）。利用代理还便于记录与外部应用程序的所有请求/响应，使问题诊断更加容易。\n\
  \n## 顺势而为 (Swim with the Stream)\n\n### 按预期使用产品和技术\n按照预期方式使用产品增加了你对产品的使用经过测试的概率。如果你需要帮助，相比于非标准或未经许可的使用，针对产品的主流用途的帮助和代码示例会更容易获得。无论是售卖产品还是开源产品，都是如此。只是对于开源产品，你的“支持”不是由供应商提供的，通常由互联网搜索或搜索产品的\
  \ Bug 列表组成。\n\n按照预期方式使用产品增加了你从产品进步中受益的概率。例如，使用第三范式设计（关系型数据库的预期使用方式）的关系型数据库用户需要频繁的连接（joins）。早期，这引起了对性能的担忧。现在，由于产品的进步，使用主键和外键的连接通常完全没有性能问题。对数据库设计进行归一化的用户从他们所使用的关系型数据库产品的技术进步中受益。\n\
  \n\n\n\n不要使用并非设计用于产品外部的内部产品类。\n\n这是一个不当用用的示例。API 产品通常会有一些内部使用的、且从未打算发布给消费者使用的类。例如，Web\
  \ 服务产品 `Apache Axis` 具有在产品内部使用的字符串处理类。从技术上讲，你可以利用这些字符串处理类和方法。然而，它们从未真正打算暴露给产品用户。这些类之所以是公开的，仅仅是为了供产品内的多个包使用，而没有其他原因。你对这些内部类的使用可能适用于你正在使用的产品当前版本，但当你升级产品时，这些内部类可能会发生变化。由于它们从未设计供用户消费，因此不会投入很少或完全不投入精力确保它们仍以相同的方式工作。换句话说，如果你一直使用从未设计供用户使用的类和方法，那么在升级过程中引入\
  \ bug 的风险就会增加。虽然产品的发布接口可能会更改（例如，`Hibernate` 似乎经常更改其公开使用的 API），但通常会提供有关更改的文档，并就如何在升级时修改你的应用程序提供建议。这种协助对于从未打算公开的内部类来说通常是不存在的。\n\
  \n## 尽早发现错误，而不是事后才\n\n在开发过程中尽可能尽早发现编码错误总是好的。我们所说的“更好”是指越早发现的错误通常修复成本越低，且造成的损害通常越小。如果\
  \ bug 被终端用户发现，那么该 bug 至少会负面影响终端用户的生产力，并产生劳动力成本。根据 bug 的性质，企业可能会产生与其他 bug 相关的成本，例如给客户带来不便并可能导致客户。跟踪、记录和最终修复\
  \ bug 的成本也是存在的。另一方面，如果该 bug 在部署到生产环境之前被检测到，该 bug 将花费开发时间来修复，但可能不会给企业带来其他成本。测试驱动开发（`TDD`）和持续集成（`CI`）的实践基于这一原则。如果在修复错误之前没有人注意到它，那么这个错误真的发生过吗？\n\
  \n检查所有公共或受保护方法的参数的推荐实践遵循这一原则。通过捕获并显式地标记错误，我们节省了修复 bug 的开发时间。如你所知，派生错误往往更难诊断且修复起来更耗时。倾向于运行时异常的推荐实践也遵循这一原则，它使其更容易、更安全地抛出并描述性地标记错误，而无需承担冗长\
  \ `try/catch` 逻辑的成本。为支持开发者提供错误通知方法的推荐实践也遵循这一原则，因为它在用户发现之前报告了错误。\n\n这一原则的推论是采用从根源防止\
  \ bug 的实践。结对编程（所有代码由两个程序员组成的团队编写）是应用这一原则的示例。其核心思想是，观察程序员会捕捉到打字程序员遗漏的错误，从而防止 bug。诸如\
  \ `PMD` for Bugs 等工具可以扫描你的代码，并突出显示代码中容易导致已知类型缺陷（如空指针异常）的地方。\n\n自动化错误报告和支持人员的通知至关重要。用户不会报告所有错误。填写帮助台工单或向技术人员详细解释问题以便重现是需要费工夫的。通常，如果用户可以找到通通方法，他们会采取懒办法而不报告。然而，尽管他们没有报告错误，他们对软件应用程序的感知也会降低。因此，自动化错误报告是你获取某些错误通知的途径。此外，自动化错误报告可以让你更清晰地看到用户遇到该错误的频率。此外，自动化报告会到达得更快，让你有机会更早地解决问题。\n\
  \n首先对项目中技术风险最高的部分进行编码。具有最大技术风险的任务通常是涉及新或不熟悉的技术，或包含复杂逻辑的任务。这些方面产生错误的概率比项目的任何方面都要大。因此，首先编码这些部分倾向于增加这些部分接受的测试时间，并增加在发布前捕获错误的机会。\n\
  \n## 功能性需求优先级最高\n\n功能性需求是业务需求；它是你的应用程序必须为终端用户提供的某些东西。“需求”是对于业务运行至关重要的功能。构建不满足业务需求的应用程序是没有意义的。如果没有成功的业务端，就没有理由维持和资助业务应用程序以及支持它们的架构。识别功能性需求的重要性怎么强调都不过。这就是为什么我花费了整个章节来指导你如何识别和记录这些需求。记录业务需求的一种方法是使用用例（use\
  \ case），当然也有其他方法。我将其列为一种架构原则，因为我看到开发者为了维护技术设计理想而牺牲对业务需求的满足。如果应用程序架构或技术设计不支持新的业务需求，那么是时候增强或替换该设计了。我们不能仅仅因为它们编程起来不便或引入了额外的复杂性就选择性地忽略业务需求。新业务需求引入的复杂性经常增加支持该需求的应用程序的开发和维护成本。一旦用户理解了他们所表达的需求成本，他们可能会以不同的方式表达这些需求。\n\
  \n诚然，有时终端用户代表并不清楚那些需求是什么，或者无法有效地表达它们。换句话说，有时客户最初并没有*说出*他们的真实含义。有时，用户会将“需求”与“想要”混淆。“需求”是对于业务运行至关重要的功能。“想要”是能够优化该业务某部分的东西（例如，减少某人的体力劳动），但它对业务运行并非至关重要。例如，用户可能“想要”一份详细说明做出决策所需信息的新报告。如果用户有其他方法获取这些信息，那么这份新报告就是一个“想要”（例如，它让收集信息变得更方便），但不是“需求”。发现并记录真实的业务需求，使其达到足够让软件开发者实施的细节，是一项独立且重要的技能。\n\
  \n非功能性需求是指定应用程序运行条件的需求，但它们不像功能性需求那样定义特定的行为。作为非功能性需求的示例，应用程序可能要求存在微软 Windows 操作系统、至少\
  \ 100MB 磁盘空间和 2GB 内存。另一个非功能性需求的示例是通过互联网供用户访问。这些需求没有说明应用程序是做什么的，甚至没有说明满足了哪些业务需求。理想情况下，非功能性需求不应该干扰满足业务需求。\n\
  \n\n\n\n\nDerek Ashmore 是一位高级技术专家，在多种技术和行业领域拥有二十五多年的经验。他曾担任过的职位包括应用架构师、企业架构师、项目经理、应用程序开发人员和数据库管理员。他在自定义应用程序开发以及将应用程序与\
  \ Great Plains、Sales Force、Microsoft Dynamics 等商业产品集成方面拥有丰富的经验。自 1999 年以来，Derek\
  \ 一直在设计并领导 Java 相关的项目。\n\n如果您需要对 Java 相关的项目进行评估，可以通过联系 sales@dvtconsulting.com 聘请\
  \ Derek。\n\n您可以通过以下方式联系 Derek：\n\n- 电子邮箱：derek.ashmore@dvtconsulting.com\n- LinkedIn：[`www.linkedin.com/in/derekashmore`](http://www.linkedin.com/in/derekashmore)\n\
