  \ Easy: A Practitioner’s Guide.* Boston: Addison-Wesley.\n\nLarman, Craig. 2004\\\
  . *Agile and Iterative Development: A Manager’s Guide.* Boston: Addison-Wesley.\n\
  \nJohnson, Hilary and Chris Sims. 2012\\. *Scrum: a Breathtakingly Brief and Agile\
  \ Introduction.* Dymaxicon.\n\nStephens, Matt and Doug Rosenberg. *Extreme Programming\
  \ Refactored: The Case Against XP.* Berkeley, CA: Apress.\n\n# 第二 2 章 定义项目\n\n开发任何应用程序的第一步都是进行分析以定义其目的、范围和目标。Java\
  \ EE 应用也不例外。在开发过程中包含分析是基本的常识，但我不断惊讶地发现有多少项目在没有先定义目标的情况下仓忙乱撞。\n\n应用程序架构师并不直接参与定义项目；那是项目经理、业务分析师和最终用户的工作。然而，架构师负责确保项目的定义具有足够的一致性和细节，以便进行物理设计和实现。由于\
  \ Java EE 开发团队的大多数成员不知道设计和实现应用程序所需的信息，因此应用程序架构师经常主持项目定义的讨论。\n\n\n\n\n应用架构师必须具备分析能力。如果没有分析能力，架构师将在项目初期识别出项目定义中的弱点和差距，而这正是解决这些弱点成本最低的时候。另一方面，具有分析能力的架构师更有可能预见到未来的功能需求，因为他们能够理解涉及的业务流程。虽然在请求这些预期功能之前，不会投入精力去构建它们，但可以做出某些设计选择，为日后添加这些功能提供可能。例如，如果我预计在未来的某个点客户可能拥有多个账户（尽管他们现在还不能这样做），我会做出允许这种可能性的设计选择。\n\
  \n在写这些话时，我都能听到开发者们的哀嚎声。技术人员更想听听关于编码技巧，而不是项目定义和需求收集策略。我完全理解。没有什么比产出有作用的良好代码更让我喜欢的了。然而，要获得良好的代码，你需要良好的分析和良好的项目定义。根据我的经验，如果不先进行适当的分析，获得有用代码的概率微乎其微。\n\
  \n## 用例（Use-cases）是分析中的重要工具。\n\n统一建模语言（`UML`）规范的创建是为了描述和记录使用如 `Java` 等面向对象语言的系统的分析与设计。`UML`\
  \ 用于描述应用程序将实现什么的主要结构是`用例`（use case）。本章定义了`用例`术语，引导你为项目编写用例，列出了创建用例时常见的常见错误及其避免方法，并展示且讨论了一个为项目编写的用例示例。\n\
  \n本章并不包含关于 `UML` 规范用例的全面概述。我给出的是规范中常用且实用的子集。关于对 `UML` 规范的深入探讨，请参阅 Booch, Rumbaugh\
  \ 和 Jacobson (1999)。\n\n尽管某些开发者区分用例和需求，但我认为它们没有区别。需求是指用业务术语编写的、应用程序必须提供的特定功能。因此，需求通常是以摘要形式编写的用例。\n\
  \n如果你正在使用敏捷开发方法（如 `Scrum`），你创建的是`用户故事`（user stories）而不是用例。这两种结构实现了相同的目的：传达用户需求。用户故事是对用户在应用程序上做什么或需要做什么的简短陈述。例如，“应用程序需要记住我上次的产品搜索结果，并预填我上次指定的过滤器；我大多数时候都进行同样的搜索。”用户故事不包含足够的细节以允许实现；需要与用户代表进行口头沟通以理出细节。相比之下，用例包含了足够的细节以允许实现。用户是编写用例，还是通过用户故事和口头沟通获得需求，仅仅是形式和策略上的区别。\n\
  \n## 此外，我喜欢对用户界面进行原型设计。\n\n原型是一个极佳的，可以让业务方和开发者理解开发项目的目标。我通常没有困难让业务方对原型设计过程感兴趣，因为它具体地代表了他们将得到的东西。原型设计有助于完善用例。\n\
  \n一旦你定义了项目的用例（或故事），你就可以用业务术语编写一个相当详细的项目定义，使开发者和业务人员都能理解。这使得业务方和任何管理利益相关者能够尽早反馈。获得特定项目用例的正式确认，使项目经理能够控制项目范围。\n\
  \n## 确定项目范围\n\n在进行用例分析和原型设计练习之前，需要一个高层项目定义和关于范围的初步想法。大多数开发者都是注重细节的，会认为这种高层定义太模糊而没有用处。请记住，这种高层项目定义的目的仅是确定用例分析的范围（而不是为了编码）。\n\
  \n以下是一个高层项目定义语句的示例：\n\n*   构建一个系统，帮助项目经理规划任务、跟踪每个团队成员的活动并估计完成日期。该项目跟踪应用程序允许用户执行以下操作：\n\
  *   定义项目及其任务。\n*   记录分配到项目任务的人员，并估计完成每个任务所需的时间。\n*   记录任务完成的顺序。\n*   记录项目进度并将任务标记为已完成。\n\
  *   自动调度项目。\n*   创建项目进度报告。\n\n尽管该语句很模糊且简单，但它为识别参与者（actors）和构建用例提供了起点。\n\n## 识别参与者（The\
  \ Actors）\n\n用例分析的第一步是识别参与者。`actor`（参与者）是受用例服务或影响的用户类型或外部系统。虽然 `actor` 一词具有真实人的内涵，但\
  \ `UML` 参与者可以是外部系统、组织类型或角色。\n\n以下是我架构的一个报告生成应用程序的参与者列表：\n\n*   信任客户用户\n*   信任客户组织\n\
  *   银行支持用户\n*   报告模板开发者\n*   文档交付应用程序接口\n*   报告模板定义接口\n*   数据仓库应用程序接口\n*   报告请求应用程序接口\n\
  *   应用程序管理员\n\n这里是我架构的一个现金跟踪应用程序的参与者列表：\n\n*   现金经理用户\n*   交易审批用户\n*   高级交易审批用户\n\
  *   银行支持用户\n*   资金会计应用程序接口\n*   应用程序管理员\n\n你可能注意到，在每个示例中，我将单个用户组作为单独的项目列出。我这样做主要是因为每个用户组都有不同的能力。虽然某些用例适用于所有的终端用户，但另一些是特定于用户组的。在每个示例中，当我们开始用例分析时，不同终端用户的类型远比结束时少得多。在编写用例的过程中，我们开始意识到不同的用户角色需要不同的能力。\n\
  \n## 一个用户可以代表多个参与者。\n\n例如，一个提供银行支持的用户可能也担任现金经理或交易审批的角色。\n\n## 对于任何大型应用程序，将应用程序管理员考虑为参与者。\n\
  \n这迫使关注支持工作——这提高了可用性，从而让其他参与者（恰好是人）开心。\n\n## 确保所有参与者都是直接的。\n\n有时人们会被外部系统接口所困扰，并想要为外部接口服务的终端用户列为参与者。例如，如果安全交易系统是外部接口之一，你可能会把交易者列为参与者，因为他们间接地接受你的应用程序的服务。然而，安全交易系统才是参与者，而交易者是间接终端用户。\n\
  \n## 通过小组开始来促进识别参与者。\n\n应用程序架构师和业务分析师可以通过对参与者是谁做出假设并与团队其他成员及业务方进行评审来促进讨论。根据我的经验，人们批评某个现有的东西比在白纸上增加内容要快且好得多。随着用例分析的进行，你可能会发现额外的参与者。\n\
  \n\n\n\n# 编写用户故事 (User Stories)\n\n`user story` 是一个简短描述，包含一个参与者、该参与者的愿望或需求，以及当需求满足时参与者将获得的预期收益。通常，用户故事只有句话。用户故事包含的信息不足以让开发者实现该功能。其意图是实现功能所需的细节应通过与业务代表的对话来获取。\n\
  \n用户故事的常用格式如下：\n\n*   作为一名`<参与者>`，我想`<愿望或需求>` [以便`<预期收益>`]。\n\n一些人认为用户故事中的`预期收益`部分是可选的，而参与者以及对愿望或需求的简短描述是必须的。我最近的一些项目的用户故事示例如下：\n\
  \n*   作为一名注册员，我希望生成可以电子化分发的成绩单，因为这是学生需要的。\n*   作为一名安全管理员，我希望有一份报告告诉我哪些用户拥有哪些角色。\n\
  *   作为一名高管人员，我希望能够在预算项目上添加注释，以便与其他高管人员和会计部门进行沟通。\n*   作为一名学术管理员，我希望能够将存储在我们课程应用程序中的教学大纲发布给潜在学生。\n\
  *   作为一名应用程序管理员，当达到内存溢出状态时，我希望收到短信通知。\n\n**在对话中获得的额外需求应当被记录下来。** 除非项目非常小且你的组织没有任何公司政治斗争，否则你需要一份关于实现细节的书面记录。文档不需要非常详尽或冗长。确保你与为了获取信息而交流过的业务代表分享这些内容；如果对需求存在误解，最好尽早消除它。\n\
  \n# 编写用例 (Use Cases)\n\n`use case` 是对系统在响应其某个参与者行为的请求或对该行为做出时所执行操作的描述。你应该用业务术语而非技术术语来编写用例。业务侧的任何人都应该能够在不依赖翻译人员或技术术语表的情况下读懂这些文本。包含技术术语的用例通常表明在该阶段正在做出技术设计假设，而本不应该这样做。用例还可以作为组织业务方与开发方之间的一份非正式“合同”，规定在哪些增量中交付什么内容。\n\
  \n`use case` 没有特定的格式。然而，用例通常包含标题、描述、参与者列表、前提条件列表、触发器、主流程和备用流程。\n\n用例描述文本应以：“系统（或应用程序）将\
  \ . . .”开头。如果你发现无法用这种形式编写的`use case`，那么它可能不是一个有效的用例，而是另一个用例的一部分。注意，用例通常为多个参与者服务。我建议在用例中显式列出所有受影响的参与者。\n\
  \n以下是我实现的一个报告系统的用例描述示例：\n\n*   系统将提供一个接口，允许用户根据现有的 `MVS/CICS` 应用程序定义的数据运行报告。\n*\
  \   系统将允许应用程序管理员控制受信任客户组织的成员可以运行的报告。\n*   系统将允许应用程序管理员定义新报告并将其发布给用户。\n\n参与者列表描述了直接参与用例的用户（参见本章的“识别参与者”章节）。某些人还会列出参与者参与此用例的简短原因。例如：\n\
  \n*   受信任客户用户，他/她想要获取有关其投资的信息。\n*   应用程序管理员，他想要定义额外的报告并将其发布给客户。\n\n前提条件列表是发生此用例之前必须满足的业务条件列表。示例包括：\n\
  \n*   已获取受信任客户且其已登录。\n*   已请求一份新报告。\n\n触发器是启动用例处理的事件。示例包括：\n\n*   受信任客户想要运行报告。\n\
  *   应用程序管理员开始工作定义新报告。\n\n用例的主流程是对用例处理过程在无错误情况下的分步描述。客户运行报告的示例可能是：\n\n1.  用户显示可用报告列表。\n\
  2.  用户选择要运行的报告。\n3.  用户输入运行报告所需的任何参数。\n4.  用户输入报告格式（例如，HTML、PDF、Excel 等）。\n5.  用户查看报告。\n\
  \n备用流程描述了在执行用例期间可能发生的异常事件。\n\n*   如果用户没有输入所有必需参数，系统将显示错误消息，列出仍仍所需的参数。\n*   如果报告执行出错，系统将显示通用的错误页面，并向应用程序管理员通知错误详细信息。\n\
  \n用例可以用更正式的组织结构和内容来编写。更多细节请参见 Cockburn (2001)。\n\n**用例的长度应在一到三页之间。** 该长度建议由 Cockburn\
  \ (2007) 提供。超过三页的用例往往包含不适合用例的材料；例如，线框图通常不适合作为用例的材料。冗长的用例倾向于包含术语表或线框图。对于每个用例，我发现从开始并包含一个不超过两个句的总结是很有帮助的。随着列表的增长，这简化了用例的组织工作。随着分析的进行，你将为大多数用例添加额外的细节。\n\
  \n**避免使用用例图。** UML 规范确实为用例定义了一种图形化表示方案。然而，图形化方案很少被使用，我刻意没有在本书书中讨论它们。我的经验表明，用例图会困扰业务方和开发人员，而且创建、解释和维护这些图形化构的的成本远大于它们提供的任何收益。\n\
  \n**编写用例需要业务侧的深度参与。** 从技术侧来说，某些业务分析师可能有助于构建草稿，但过程不应在没有业务侧直接参与和评审的情况下结束。尽管邀请业务用户参与有时并不容易，但他们的意见是有价值的。根据我的经验，对分析工作（如用例评审）的业务支持不足会导致项目失败。\n\
  \n**通过从小小组开始来引导用例分析。** 应用程序架构师可以通过与业务侧用户或业务分析师合作起草一组用例，从而加速这一过程。这些草稿用例可能是不完整的，有些是错误的，但比从空白页开始，你能够更快、更容易地获得反馈。你可以利用对假设的反对意见来完善和改进草稿用例。\n\
  \n**找专人担任用例讨论的“记录员”。** 当你主持讨论时，你没有时间做好良好的笔记。让协调员以外的人记录讨论笔记，有助于确保笔记是完整且易于理解的。\n\n\
  **编写用例以便在更多信息可用时进行修订。** 用例始终在演变。如果你在建模阶段或项目的后期阶段发现了额外信息，请将这些材料添加到用例中。\n\n\n\n\n\
  当团队成员认为他们可以估算实现每个用例的时间时，用例分析即告完成。估算可能以周为单位，而不是小时。有些开发者在实质上完成应用程序编码之前，并不习惯于提供估算。你可能需要委地提醒这些开发者，估算时间与任务实际所需时间之间存在差异是预期的。请注意，开发者在估算中只包含乐观的开发时间是常见现象；我习惯性将与我合作的许多开发者提供的估算翻倍。\n\
  \n如果小组在阐述需求方面遇到困难，不要放慢速度。做出假设并继续。如果你的用例不对，反对者有责任告诉你哪里错了，以便你纠正问题。你可以利用这些信息来完善和改进用例。\n\
  \n## 常见错误\n\n本节包含了具有各种缺陷的用例示例。\n\n### 借需求之名强加技术设计假设。\n这是我最常见的错误。考虑以下根据本章较早提到的报告系统示例改编写的用例：\n\
  \n- 系统将允许应用程序管理员通过设置规则来限制系统负载，禁止某些用户组执行报告，或将他们的执行重定向到批处理流。\n\n这个用例做了几个无根据的假设，导致我们一直在解决错误的问题。它假设应用程序使用的硬件/软件架构无法扩展以处理负载，并且需要某些替代的处理路径。它假设应用程序无法变得像提到的“批处理流”那样高效。它还假设批处理流环境实际上有冗余容量来处理应用程序本应处理的负载。\n\
  \n即使这个用例中做出的某些假设被证明是正确的，我们也应该从规划一个能够充分支持我们负载的架构开始。事实上，大多数假设都被证明是错误的：架构完全可以高效地处理负载；批处理流是频繁的性能瓶颈，而且实际上并没有冗余容量；应用程序的效率也完全满足了用户的需求。\n\
  \n编写此用例的更好方式应该是：\n\n- 系统将支持多达 200 份并发报告，每日最高量为 500,000 份。\n\n### 在用例中包含物理设计假设。\n\
  例如，其中一个开发者为报告系统提交了以下用例：\n\n- 在请求完成后，系统将在报告请求表中插入一行。\n\n这个用例做出了物理设计假设，即我们正在一个表中记录请求运行情况。但在那时，我们还没有决定是否这样做，也不应该这样做。经过讨论，我了解到应用程序管理员需要一种方法知道用户运行了哪些报告，以便他们重现信任客户向帮助热台报告的问题。考虑到这些需求，用例的更好的表达方式应该是：\n\
  \n- 系统将记录至少三十六小时的报告请求历史，以便应用程序管理员和报告模板开发人员调查所报告的问题。\n\n### 未能保持分析会议的高效。\n分析工作可能由于许多原因而停滞，包括引导或领导力不当、讨论中的细节水平极低以及缺乏信息。从分析会议中获得的需求也可能不完整或无效。应用程序架构师可以引导开发团队避开所有这些问题。与其看到会议停滞，我会为稍后要处理的事项或问题创建一个“停车场”（parking\
  \ lot），等在获得额外信息后再处理。停车场的条目会被记录和跟踪，然后在稍后进行讨论。\n\n### 未能记录用例，即使项目很小。\n大多数开发者认为，当项目只有一个开发者时，记录用例是不必要的。但无论如何，都应该记录用例。然而，对于小型项目，用例集可以是非正式的，使用一个简单的项目列表即可。\n\
  \n记录的用例针对开发工作，并减少偏离主题的可能性。此外，记录的用例向管理层和业务部门传达了开发目标，并在额外开发者加入团队或项目分配给其他开发者时协助项目交接。\n\
  \n### 在每个用例中重复定义术语。\n即使对于复杂的应用程序，也没有必要在出现这些术语的每个用例中重复定义。相反，你可以定义一次，然后在单独的业务术语列表中维护它们。例如，`cash\
  \ transaction`（之前用例示例中使用的术语）指的是从一个账户转移到另一个账户的资金。交易的特征是：它有一个标识符、一个日期、一个现金金额、最多一个扣款账户，以及最多一个转入账户。\n\
  \n如果你觉得写用例看起来很容易，你是对的。此此的推论是，如果你认为自己漏掉了什么，并且认为写用例应该比本章表现的要困难，那么你正在让任务变得比实际需要的更困难。如果写用例需要的超过了常识，那么这种实践将无法成功，因为你永远无法让满屋的人对结果达成一致。\n\
  \n## 原型制作\n\n在这个阶段，开发团队通常有足够的信息来选择用户界面技术（通常涉及 HTML，因为现在大多数应用程序都是 Web 兼容的）。用户界面使原型成为真实应用程序的一部分，并防止意外承诺交付技术上无法实现的内容。\n\
  \n### 考虑让布局设计师参与原型的制作。\n事实上，应该由布局设计师引导这项特定练习，而不是应用程序架构师。我发现技术人员通常做不出美学上最愉悦的用户界面。我知道我做不到。\n\
  \n### 记住原型在定义上不是功能性的。\n任何原型屏幕都不应该有动态数据。。如果你负责开发原型并正在使用 HTML，我强烈推荐参考 Castro (2006)。\n\
  \n## 泳道图 (Swim-lane Diagrams)\n\n这不是我所知的任何正式方法论的一部分，但我通过描述主要业务流程的泳道图来补充用例和原型，取得了巨大的成功。对于不熟悉泳道图的人来说，它们描述了所设计软件支持的业务流程。图中的每个单独泳道包含一个执行者或应用程序。业务过程中由该执行者或应用程序做出的不同组件和决策，由泳道内的流程正方形或决策三角形表示。标记为执行者的泳道是手动过程。标记为应用程序的泳道是自动执行的流程。泳道从左到右按时间顺序读取。图\
  \ 2.1 是一个示例。\n\n图 2.1: 泳道图示例\n\n![fig 2-1.ai](img/00005.jpeg)\n\n\n\n\n我发现终端用户可以毫不轻松地理解泳道图（swim-lane\
  \ diagrams）。它们可以有效地用于描述业务流程中哪些部分是手动操作的，哪些部分是由软件应用支持的。终端用户非常习惯这种方法，因为它让他们能够轻松查看是否遗漏了可能与你的项目相关的流程。程序员也能从这种方法中受益，因为他们可以轻松地看到他们的软件产品被使用的上下文。\n\
  \n## 非功能性需求\n\n到目前讨论的所有项目需求都是功能性需求。`Functional requirements`（功能性需求）定义了应用程序预期完成“什么”。`Nonfunctional\
  \ requirements`（非功能性需求）规定了应用程序“如何”实现功能性需求的约束。例如，一个功能性需求可能是允许用户运行一份预定义的报告；而非功能性需求可能是所有预定义的报告都应该在六十秒内运行。另一个例子：功能性需求可能是允许用户保存客户账户的更改；而非功能性需求可能是需要对应用程序进行备份，并且在硬件故障时，任何已保存的事务都是可恢复的。\n\
  \n通常情况下，非功能性需求没有用例（use cases）或用户故事（user stories）。然而，非功能性需求偶尔会影响功能性需求。例如，我曾收到一个功能性需求增强请求，允许客户代表查看用户的密码，以便在用户忘记密码时告知用户密码。我告诉他们，有一项管理指令，要求密码绝不能以未加密的形式存储。此外，使用所用的加密方法无法解密密码。这种以无法解密的方式对密码进行加密的指令就是非功能性需求的一个例子。在这种情况下，非功能性需求确实影响了功能性需求。\n\
  \n## 提高你的分析能力\n\n有时，开发者和初级架构师在获取编写良好的用户故事和用例所需的业务分析技能方面会遇到困难。业务分析需要良好的沟通能力（包括书面和口头），而并非所有开发者都具备了这些能力。它要求你能够用业务术语来表达问题，忽略所有的技术术语（例如\
  \ `file`、`field` 等）。这个领域远没有编码那样客观和精确。尽管如此，编写有效的用例和用户故事的能力是所有架构师都需要培养的技能。如果你认为有必要，这里这里有一些你可以做的事情，可以提高你的分析能力。\n\
  \n**找一个导师。** 选择一个人（最好在同一组织内工作），你尊重其业务分析技能。让你的导师私下审查你的用例、用户故事，或你组织中用于通信功能性需求的任何文档格式。通常，没有直接参与的人会更客观，并能为你提供宝贵的反馈。\n\
  \n**对你的项目或任务进行项目后回顾。** 除非你的经理要求，否则这不需要正式进行或公开。你可以通过与参与的开发者和终端用户代表讨论项目来非正式地收集这些信息。遗漏了哪些用户需求？你本可以可以询问哪些问题可能会更早地发现这些缺失的需求？这些是你可以在未来的任务中利用并尝试进行纠正的反馈。\n\
  \n**想象一下你必须执行用例或用户故事中描述的用户任务。** 如果你处在他们的立场，你需要做什么来完成用户的目标？进行这项练习可以让你看到可能遗漏的需求方面。此外，它还让你获得关于用户做了什么的信息，这可能有助于你完成未来的任务。\n\
  \n## 延伸阅读\n\nBooch, Grady, James Rumbaugh, and Ivar Jacobson. 2005\\. *The Unified\
  \ Modeling Language User Guide,* 2nd ed. Reading, MA: Addison-Wesley.\n\nCastro,\
  \ Elizabeth. 2006\\. *HTML for the World Wide Web with XHTML and CSS: Visual QuickStart\
  \ Guide,* 6th ed.* Berkeley, CA: Peachpit Press.\n\nCockburn, Alistair. 2001\\.\
  \ *Writing Effective Use Cases.* Boston: Addison-Wesley.\n\nCockburn, Alistair.\
  \ 2007\\. *Agile Software Development,* 2nd ed. Boston: Addison-Wesley.\n\nFowler,\
  \ Martin, and Kendall Scott. 2003\\. *UML Distilled: Applying the Standard Object\
  \ Modeling Language,* 3rd ed. Reading, MA: Addison-Wesley.\n\n![stock-photo-17860137-binary-code-bw-horiz-slice.tif](img/00003.jpeg)\n\
  \n# 第 3 章：范围定义与估算\n\n在大多数组织中，项目经理与业务部门和管理层合作，建立项目范围并估算时间和资源需求。而且项目经理经常依赖应用架构师协助完成这些任务。Java\
  \ EE 应用的情况也不无异。本章为负责帮助管理层定义和估算交付的架构师编写。不参与这些任务的读者可以安全地跳过本章。\n\n## 定义范围\n\n**用用户故事或用例客观地定义项目范围，并获得业务部门的同意。**\
  \ 在项目执行期间更改范围会破坏项目进度并降低开发团队的士气。当业务部门在开发进行过程中提出额外请求时，承认这些请求，将它们记录在用例中，并将其安排在未来的发布中。通常，对每个用例进行粗略估算可以为业务部门在决定范围时提供有用信息。\n\
  \n**获得项目赞助人对用例的认可。** 由于用例是用业务术语编写的，它们可以作为与业务部门和管理层之间的“合同”，规定在何时交付什么内容。与业务部门合作，选择哪些用例将在当前项目中实现。其他任何内容都将推迟。即使范围是口头达成一致的，也要将其写成书面并通过电子邮件发送给所有远程连接到项目的人。确保保留一份副本。\n\
  \n**在确定范围后，尽力执行项目范围。** 一旦项目范围确定，项目经理可以做的最重要的事情就是执行它。应用架构师负责提醒项目经理范围的变化。针对一个移动的目标要困难得多。尽管我通常倾向于将所有增强安排在未来的发布中，但架构师通常不决定调度问题。我以用例的形式对请求进行估算并提供初步估算。通常，项目经理可以使用这些信息引导业务部门将请求安排在未来的发布中。\n\
  \n**记录确定项目范围时所做的任何假设。** 在此阶段，项目需求通常存在未知。通常无法在调查未知因素时暂停项目。在这些情况下，我对需求做出最佳猜测，并将这些猜测记录为假设。向管理层和产品经理或其他业务代表提供这些假设的副本是关重要的。如果假设错误，你会收到通知，并对范围和相应的估算进行调整。\n\
  \n\n\n\n\n# 估算基础\n\n许多技术人员认为估算是一件困难的事；事实上，在现阶段，它既是艺术也是科学。本章介绍了一种根据用例分析和原型中应获得的信息来确定粗估算的方法。我并不声称我的估算方法是`only`（唯一的）。如果你有自己熟悉的方法，请坚持使用。需要说明的是，对同一个项目进行多种方法的估算可以验证你对估算的信心，特别是当不同方法得出的答案相似时。\n\
  \n在项目开始时形成的估算应该定期重新审，并在完成更详细的计划和设计后进行完善。在定义了外部接口并完成对象和数据建模后，你将能够更有地做出更准确的估算。你现在做的估算应该足够详细，以便你将其用于估算任何用例组合。理想情况下，业务部门在决定范围时会考虑成本/效益比较。\n\
  \n**根据团队中最慢的资源进行估算。** 我们都知道，某些人在开发任务上花费的时间比其他人少。我宁愿早日交付项目，也不愿解释为什么它会迟交。\n\n**估算应该按比例平衡。**\
  \ 我发现一个典型的开发团队大约将其资源预算的三之一用于规划和设计，三分之一用于编码和单元测试，另外三分之一用于支持系统和用户测试活动。请记住，规划和设计预算的一部分已用于执行上一节描述的用例分析（我通常假设到此为止规划和设计已完成了\
  \ 50%）。这些比例适用于项目的整个生命周期。\n\n**估算应以工作小时数表示。** 也就是说，根据完成任务所需的工作小时数进行估算。大多数项目管理软件将根据你的项目计划计算日期。如果资源被转移到其他项目，你将能够更准确地建议层该决策对项目产生的影响。\n\
  \n**考虑设置开发、测试和生产环境所需的时间。** 大多数公司在企业级提供成熟的环境。例如，许多公司有一个中央管理团队，为新应用的开发、测试和生产建立环境。如果你的公司有这样一个团队，分配给环境设置的时间将很短，通常对初步估算没有实质影响。如果你的公司不是如此，你应该增加一个设置环境的估算。\n\
  \n**开发者在估算编码和单元测试任务方面比其他任何任务都更成功。** 如果你能获得一个合理的编码和单元测试估算，就可以可以使用之前提到的比例推导出其他部分，并得到大致估算。注意，要根据这些比例推导出总估算，你只需将编码和单元测试估算乘以\
  \ `2.5`，假设在你估算时规划和设计已完成了 50%。\n\n**通过与历史数据对比来验证你的估算。** 我跟踪实际完成所估算任务所需的小时。这使我能够识别估算错误并在未来的项目中纠正它们。因此，我拥有一个以前项目的任务库，包含了它们实际完成所需的时间。我从这个库中寻找可比的任务（工作量相似、难度相似）。我为当前项目评估的估算应该与这些可比任务的经验大致一致。房地产估值的方法相同。房地产专业人士通过查看附近类似物业的销售价格来估算物业的价值。这种方法也适用于大多数任务的软件估算。\n\
  \n## 估算算法\n\n需要注意的是，应用架构师只负责估算小时。项目经理应该考虑到由于负责其他项目的职责和假期而导致的缺勤。\n\n**第一步：量化应用；确定网页、批处理作业、报告、数据库表和外部应用程序接口的大致数量。**\
  \ 根据之前的历史，你应该拥有可比项目的时间表数据。从这些历史数据中推导出完成一个网页的平均小时数（假设需要开发数据访问逻辑和业务逻辑来支持它）。例如，对于我目前的一个客户，我的每个动态网页的平均工作时间是\
  \ 40 到 80 小时，取决于复杂度。我对批处理作业、报告、数据库表和外部应用程序接口也有类似的估算范围。数据库表出现在列表中是因为还需要执行数据建模和数据库设计步骤，以及物理创建表本身。为了推导出编码和单元测试估算，请为项目考虑的用例组收集以下内容的估算：\n\
  \n*   用户界面中的屏幕/页面（每个 40–80 小时）\n*   外部应用程序接口（每个 80–120 小时）\n*   数据库表（每个 4–8 小时）\n\
  *   转换批处理作业（每个 24–40 小时）\n\n如果这是你第一次估算项目，可能没有可比项目历史数据可以参考；在这种情况下，请询问可能有的同事。向你的经理或你的同事索要以前项目的示例项目计划和估算。\n\
  \n并不是每个用例都存在这些项目。如果上述列表中括号中注的基础估算在开发团队尚未形成时适用。如果存在现有团队，则可能对每项内容做出更准确的估算。此时的的估算将是不精确的。基于对象数量进行估算更准确，但在对象建模完成之前无法获得该数字。\n\
  \n**第二步：为每个用例估算编码和单元测试时间。** 根据第一步中收集的信息，获取用例组合的基估算是一道简单的数学计算题。`base estimate`（基础估算）是一个开发者完成编码和单元测试任务所需的时间。在设计完成之前估算编码和单元测试时间可能看起来有点奇怪，但很少有开发者对这种不确定性感到困扰。\n\
  \n许多开发者混淆了单元测试和系统测试。单元测试严格在 `Java` 类级别。当一个类从应用程序内的其他类调用时其运行良好程度是集成测试，而不是单元测试。\n\n\
  例如，对于一组涉及四个屏幕、两个外部接口、五个数据库表、无数据转换和两个环境设置的用例，基础估算为：\n\n```\n(4 × 80 hrs) + (2 × 120\
  \ hrs) + (5 × 8 hrs) + (0 × 40 hrs) + (2 × 8) = 616 hours\n```\n\n**第三步：将第二步的基础估算乘以\
  \ 2.5，以考虑到每个用户故事或用例的分析和测试活动。** 如果编码和单元测试大约占每个用例总成本的三之一，那么总成本应该是基础估算的三倍。由于在此阶段分析已完成了\
  \ 50%，因此估算总成本约为基础估算的 2.5 倍。继续之前的示例，项目剩余的总小时数将为 `600 × 2.5 = 1,500`。\n\n\n\n\n\n\
  ## 步骤 4：对于项目中每增加一名开发人员，将估算增加 20%。\n\n基础估算假设项目只有一名开发人员。项目每增加一名开发人员，都会增加通信和协调时间（Brooks,\
  \ 1995）。虽然这些时间是必要的，但用于沟通和协调的时间并不是用于开发的时间。因此，每增加一名开发人员，就将基础估算增加 20%（即乘以 `1.20`）。例如，如果基础估算为\
  \ `2,600` 小时且预计有五名开发者，则估计花费 `600 × (1.20)4 = 1,244` 小时进行编码和单元测试。顺便一下，将该数字取整为 `3,500`\
  \ 是一个好主意，以避免产生认为这是一个精确估算的误导印象。\n\n假设项目的五名开发者都是全职工作的（每周三十二小时，预留了行政干扰等因素），开发团队每周总共可以工作\
  \ 160 小时。这意味着项目交付大约在二到三个月后。在此阶段，请明确以月份或季度为单位说明估算值，以避免产生这是一个精确估算的印象。\n\n## 步骤 5：与开发团队评审你的估算。\n\
  \n如果开发人员没有参与，他们就不会认为受这些估算的约束。提醒开发人员，这些估将在设计完成后将重新评估，这是重要的。\n\n### 增加人力很少能缩短延期项目的时间线。\n\
  \n如前所述，通信/协调惩罚是导致向延期项目增加人员只会使其更晚期的主要原因。架构师经常在所有分析完成之前被要求提供粗略的估算（ballpark estimates）。即使结果在字面上并不准确，你也可以通过填充假设并在估算中记录这些假设来给出一个大概估值。\n\
  \n### 你花在估算上的时间具有收益递减效应。\n\n无论如何，你完成项目所需的实际工作小时都会与你的估算不同。在大多数情况下，在估算过程中投入更多时间并不会让你的估算更准确。对于许多新接触估算的开发人员来说，这是一个令人不安的想法，但这是他们必须学会接受的真理之一。\n\
  \n遵循具有较短开发迭代的敏捷方法的人将获得较低的估算。然而，相同的概念同样适用。如果任务是为现有应用程序添加功能，请使用你拥有历史数据的过去故事（stories）的估算。\n\
  \n## 跟踪估算\n\n如果你在担任应用程序架构师角色的同时还兼任项目经理的角色，你应该定期根据估算跟踪你的进度。跟踪进度意味着收集开发人员在分配的任务上实际花费的小时数，并将这些小时数与估算进行比较。\n\
  \n### 估算跟踪记录了项目按时和按预算执行的程度。\n\n大多数项目不会在一天内延期两个月——这是一个随时间推移而出现的症状。如果高管能尽早发现问题，他们可以接受时间线问题。\n\
  \n### 估算跟踪记录了将资源重新分配到其他项目的影响。\n\n通过仅跟踪投入你项目的小时，如果没有给你的项目足够的时间满足时间线，你可以提醒管理层。我经常能够通过指出这些项目从执行的工作量来看完全没有延期，从而为那些比计划晚交付的项目辩护。项目延期是因为资源被分配到了其他项目——而不是因为团队管理不当。\n\
  \n### 跟踪估算使你能够在未来的项目中改进它们。\n\n例如，如果我持续低估了在现有应用程序中添加新屏幕/页面的工作量，我可能会在未来的项目中增加对类似任务的估算。\n\
  \n我倾向于每周跟踪进度，并在状态报告中包含进度摘要（无论我的团队是领先还是落后）。每周跟踪进度通常对管理层很有用，但又不会至于会消耗大量时间。在状态报告中发布你的进度可以确保管理层不会对延迟交付感到“意外”。它还记录了当你的部分资源被转移到其他项目时产生。\n\
  \n## 非功能性需求考量\n\n正如上一章过的，非功能性需求对满足应用程序需求的方式产生了限制。因此，非功能性需求往往影响项目估算。例如，如果应用程序需要在硬件故障发生时支持无缝故障转移，则测试估算将更高。如果有非功能需求要求应用程序能够支持每秒\
  \ 50 次命中，那么性能测试估算就需要反映这一点。如果企业指令要求应用程序的单元测试必须至少有 90% 的代码覆盖率，那么开发估算就需要反映这一点。\n\n\
  ## 扩展阅读\n\n- Brooks, Frederick P., Jr. 1995. *The Mythical Man-Month: Essays on\
  \ Software Engineering, Anniversary Edition,* 2nd ed. Reading, MA: Addison-Wesley.\n\
  - DeMarco, Tom, and Timothy Lister. 1999. *Peopleware: Productive Projects and Teams*,\
  \ 2nd ed. New York: Dorset House.\n\n![stock-photo-17860137-binary-code-bw-horiz-slice.tif](img/00003.jpeg)\n\
  \n# 第 4 章：设计外部应用程序接口\n\nJava EE 应用程序与我们无法控制的外部应用程序进行接口交互是很常见的。例如，采购应用程序可能会通知会计应用程序所有的购买情况，或者库存管理应用程序可能会通知会计应用程序所有的入库和客户发货。应用程序架构师负责应用程序接口的设计，也负责应用程序本身。应用程序架构师在设计与外部应用程序的接口方面起着核心作用，特别是当外部应用程序也是自定义开发时（例如，不是具有现有接口功能的销售产品）。本章描述了如何定义外部应用程序接口需求，以便两个应用程序团队都能获得执行设计和实现任务所需的信息。\n\
  \n有时外部应用程序是销售的，支持的接口方法已经建立且易于消费。有时外部应用程序由另一个团队或业务部门支持且尚不存在。创建外部接口的常见原因如下：\n\n* 为了引用或处理读取外部应用程序数据\n\
  * 为了利用外部应用程序执行某些工作\n* 为了向外部应用程序发布功能\n\n报告应用程序是读取外部应用程序数据的常见示例。报告应用程序很少维护报告内容所需的信息。更常见的情况是用户在使用你构建的应用程序的功能时，引用来自外部应用程序的数据。\n\
  \n利用外部应用程序功能或其他其他应用程序发布功能是“不要重复”（DRY）原则的示例。事实上，它们仅在视角不同；每个“外部”应用程序都是某人支持的应用程序，他们也将你的应用程序视为“外部”。通常，为了你的程序的特定用途而在外部应用程序中复制功能是不经济或不理想的。例如，假设你的应用程序需要启动记录客户费用。现在没有人编写自定义会计应用程序了。更有可能是你的应用程序需要利用销售的会计应用程序来启动该笔费用。\n\
  \n\n\n\n\n# 外部接口带来了稳定性风险。外部应用程序的故障会导致你所支持的应用程序部分故障。此外，外部应用程序的更改（例如产品升级或功能增强）也可能迫使你支持的应用程序发生变更。因此，以一种能够缓解或包含稳定性风险的方式实现接口通常是一项要求。有很多方法可以缓解这些风险，本章将进行讨论。\n\
  \n# 外部接口增加了开发和支持活动的复杂性。由于问题需要团队之外的人员解决，开发和支持会受到影响。此外，并不总是易于确定哪个应用程序拥有特定的缺陷。你可能在调查一个报告的缺陷后，发现它实际上是外部应用程序的缺陷，你所能做的向支持该应用程序的团队或供应商报告该问题。有很多方法可以减少外部接口带来的复杂性，本章将进行讨论。\n\
  \n应用程序架构师通常负责确保外部接口有正式定义和文档，以便两个应用程序的开发人员为对象建模活动（在第 6 章描述）提供基础。两个应用程序的应用程序架构师都需要他们的建模和实现活动有一个基础。此外，项目经理需要在你的开发组与外部系统开发人员之间建立一份合同，描述每个人的职责。\n\
  \n外部接口的以下方面应与外部团队讨论并在团队之间达成共识：\n\n*   接口方法选择（例如：Web 服务、消息传递）\n*   发布的服务或函数\n*  \
  \ 数据内容结构\n*   内容交换的触发事件\n*   错误处理程序和职责\n\n# 应用程序架构师应促进接口设计讨论。协调者的角色部分是将讨论限制在上述主题上。任何一个应用程序的内部设计与此讨论很大程度上无关。外部应用程序使用的平台是相关的，因为它可能会影响\
  \ Java EE 应用程序使用某些接口方法的能力。例如，如果外部应用程序不是用 Java 编写的，Java EE 应用程序无法无法任何使用 `RMI` 的通信形式，例如\
  \ `EJBs`。\n\n本章将描述常用的接口方法及其优缺点，以帮助你做出关于外部接口的设计决策。\n\n## 消费外部应用程序数据的策略\n\n最常见的外部接口类型是读取由另一个应用程序维护的数据。常用的策略包括直接利用外部应用程序数据库，或利用企业级\
  \ Java Bean (`EJB`)、消息传递技术、REST 服务或 Web 服务来获取所需信息。每种策略都有优缺点。\n\n### 直接读取外部应用程序数据库\n\
  \n直接读取外部应用程序数据策略的优势如下：\n\n*   实现最简单、最廉价\n*   很少或不需要外部应用程序供应商或应用程序团队的参与\n*   提供的数据始终是最新的\n\
  \n这种策略被广泛使用，是因为初始开发通常简单且廉价。它通常不需要与外部应用程序人员进行大量交互。此外，数据库访问是大多数开发者熟悉且易于理解的。\n\n该策略的缺点如下：\n\
  \n*   增加了外部应用程序更改产生不利影响的风险\n*   增加了对外部应用程序用户产生意外后果的风险（例如性能）\n\n直接读取外部应用程序数据库在许多情况下利用了从未打算发布的应用程序内部结构。如果外部应用程序是外售的产品，产品升级通常包含数据库模式的更改。如果外部应用程序属于不同的团队或部门，更改可能会在不通知的情况下在外部应用程序数据库中发生。因此，减少对此类更改的暴露通常是理想的。\n\
  \n除 `Oracle` 之外，大多数数据库默认对读取操作加锁。这意味着读取数据并不总是无的。这种策略可能会（由于读取锁定）影响这些外部应用程序用户的性能。\n\
  \n# 直接读取外部应用程序数据库的风险可以通过使用操作数据存储（ODS）来缓解。基本上，你的应用程序读取的是外部应用程序数据的副本，而不是直接读取外部应用程序数据库。通过将该风险纯粹地限制在数据提取中，缓解了应用程序更改带来的不利影响风险；你的大部分应用程序代码将不受影响。如果操作数据存储是厂商中立的格式（即不仅是外部应用程序数据库的复制副本），那么该数据源甚至可以改为其他产品而影响极其微。例如，假设外部应用程序是一个会计软件包。使用这种策略，如果你当前的会计软件包被来自另一个供应商的竞争产品取代，那么该更改的影响仅限于提取过程，而不会影响你应用程序代码的大部分。\n\
  \n图 4.1 所示的这种策略也缓解了对外部应用程序用户产生意外负面影响的风险，因为这种访问是计划和控制的。这种策略意味着外部应用程序数据的实时性仅取决于最后的提取。\n\
  \n需要注意的是，市场上上有几种提取、转换和加载（`ETL`）产品可以为这类提取提供支持。其中一些产品是开源且免费提供的。许多 `ETL` 产品套件具有高度依赖性，并且需要很长的学习曲线。我的经验是，在利用这类工具集之前，你的提取和转换需求必须非常详尽，这种做法才具有成本效益。\n\
  \n图 4.1：操作数据存储策略\n\n![Fig 4-1-Chap-4-OperationalDatastoreInterfaceStrategy.eps](img/00006.jpeg)\n\
  \n# 直接写入外部应用程序数据库具有巨大的风险。只有在绝对没有其他选择的情况下才应该这样做。这极大地增加了对外部应用程序用户产生意外影响的风险；如果你的代码有\
  \ Bug，外部应用程序可能无法正常工作。此外，如果外部应用程序是外售产品，这样做可能会使你的支持合同失效。\n\n# 利用 Web 服务\n\n许多支持自定义接口的外售产品会为此目的提供\
  \ Web 服务库。与任何接口选择一样，Web 服务有许多优点和缺点。\n\n利用 Web 服务进行应用程序接口的优势如下：\n\n*   Web 服务定义使用\
  \ `WSDL` 自文档。\n*   Web 服务有广泛的产品支持。\n*   Web 服务提供了一个隔离层。\n*   Web 服务是平台中立的。\n*  \
  \ Web 服务可以通过互联网安全地发布。\n\nWeb 服务接口之所以流行，正是因为它们是平台中立的。在有选择的情况下，大多数组织希望保留在必要时选择备选平台的灵活性。此外，用于发布和消费\
  \ Web 服务的工具已大幅进步。例如，Java EE 规范（`JAX-WS` 部分）添加了 Web 服务注解，使得发布 Web 服务变得更加容易。此外，还有适用于\
  \ Java/Java EE 以及其他开发平台的多种 Web 服务框架可用。\n\n\n\n\n想要获取关于使用 `JAX-WS` 规范编写 Web 服务代码级信息的读者，可以参考以下教程：`http://docs.oracle.com/cd/E17802_01/webservices/webservices/docs/2.0/tutorial/doc/JAXWS.html`。从架构角度来看，通常建议将消费或发布\
  \ Web 服务的代码与应用程序的其他部分分离开。这是对“单一责任原则”的应用，并提供了一个隔绝层，限制了更改对双方产生的负面影响。它还让单元测试的构建变得更容易。例如，假设你的应用程序需要消费由文档管理系统（`DMS`）产品提供的\
  \ Web 服务。我通常会将消费该接口的代码与应用程序的其他部分分离，如图 4.2a 所示。\n\n### 图 4.2a：Web 服务客户端设计示例\n\n![fig\
  \ 4-2a-Chap-4-Web-Service-Consumer-Example.eps](img/00007.jpeg)\n\n这种设计具有几个益处。`DMS`\
  \ 产品的更改（如产品升级，甚至是完全的产品或供应商更换）只会影响 Web 服务客户端的实现；应用程序的其他部分不受影响。`DocumentManagement`\
  \ 接口可以被模拟（mocked）；应用程序的单元测试不需要访问 `DMS` 即可运行。\n\n我们也可以将此概念应用于我们发布的 Web 服务。假设我们支持一个报告应用程序，并需要向外部应用程序暴露运行报告的能力。我通常会将发布的\
  \ Web 服务与应用程序的其他部分分离，如图 4.2b 所示。\n\n### 图 4.2b：Web 服务设计示例\n\n![fig 4-2b-Chap-4-Web-Service-Publishing-Example.eps](img/00008.jpeg)\n\
  \n这种设计具有几个优点。你可以根据需要对报告应用程序进行重构和重新设计。只要 `ReportService` 以及相关的参数和 WSDL 规范保持不变，使用你\
  \ Web 服务的应用程序就不会受到影响。\n\n此外，提供 Web 服务层为外部应用程序的变化提供了一个天然的隔绝层。如果你选择发布 Web 服务以向外部应用程序暴露功能；只要该\
  \ Web 服务接口保持一致，你的应用程序就可以更改，而负面影响消费你 Web 服务应用程序的风险就会降低。\n\n利用 Web 服务的缺点如下：\n\n- 与其他接口方法相比，Web\
  \ 服务的开发和维护通常更贵。\n- Web 服务未针对检索大量数据进行优化。\n- Web 服务在需要时可能不可；消费者需要停机策略。\n\n尽管工具支持不断增加，但与直接利用外部应用程序数据库相比，发布和消费\
  \ Web 服务并不便宜。此外，Web 服务在用于检索大量数据时性能通常良好。由于由于原因，我见过许多接口使用上述数据库策略或 REST 服务 `read` 数据，但使用\
  \ Web 服务接口 `write` 数据。\n\n如果你的 `Java EE` 应用程序以编程方式启动外部应用程序中的处理，你应该在用例分析中将这些应用程序识别为参与者（正如第\
  \ 2 章讨论）。`Java EE` 应用程序与外部应用程序之间传输的所有细节都应该是一个或多个用例的主题。例如，采购系统通知会计系统所有下达订单的事实应该是一个用例的主题。\n\
  \n## 利用 RESTful Web 服务\n\nRESTful Web 服务通过使用结构化的 URL 来通信信息请求的细节。例如，一个 RESTful Web\
  \ 服务 URL 如 `/customer/account/55555` 可能是对特定客户账户 `55555` 信息的请求。REST 服务调用的返回结果（即 `HTTP`）将是结构化的\
  \ XML（或 `JSON`）格式数据。\n\n为了进一步说明，考虑以下采购应用程序使用 `HTTP` 从库存管理系统请求信息的示例：\n\n1. 采购应用程序向库存应用程序发布一个\
  \ `HTTP` 请求（使用 `java.net.URL`），请求某件物品（例如洗衣液精）的当前库存水平。使用 REST，URL 描述了请求的内容。例如，REST\
  \ 风格请求的格式可能是 `<server>/sku/<item sku number>`（例如 `/inventory/sku/14678`）。\n2. 库存管理系统中的\
  \ `servlet` 接收请求，从 `URL` 解释请求的特定细节，并启动处理。\n3. 库存管理系统检查其数据库，并确定所有仓库中所请求物品的可用数量。\n\
  4. 库存管理系统构建一个包含该物品信息的 XML 文档。\n5. 库存管理系统中的 `servlet` 以其向浏览器返回 `HTML` 的相同方式将 XML\
  \ 文档返回给调用者。\n\n采购应用程序接收 XML 文档，对其进行解析，并使用收到的库存信息继续处理。\n\n在应用程序接口中利用 RESTful Web\
  \ 服务的优点如下：\n\n- RESTful Web 服务提供了一个更改隔绝层。\n- RESTful Web 服务是平台无关的。\n- RESTful Web\
  \ 服务通常比 Web 服务更容易被消费。\n\n利用 RESTful Web 服务的缺点如下：\n\n- 在需要时可能不可用；消费者需要停机策略。\n- 没有内置的文档策略。\n\
  \n## 利用消息服务\n\n消息服务是一种异步通信方法。也就是说，发送了请求，但响应可能不会立即返回。`Java EE` 通过名为“消息驱动束”（`Message\
  \ Driven Beans`）的结构对消息提供了正式支持。本质上，容器将充当 `JMS` 消息接收器，并将所有消息路由到给定目标地的一个实现 `MessageListener`（[`docs.oracle.com/javaee/1.3/api/javax/jms/MessageListener.html`](http://docs.oracle.com/javaee/1.3/api/javax/jms/MessageListener.html)）接口的类。\n\
  \n消息的主要优势是由于 `JMS` 消息是异步的，它们可以提供保证递送。也就是说，当消息发送时，接收应用程序可能处于关闭状态，但当该应用程序可用时，消息将被接收并处理。因此，消费消息接口的应用程序不需要停机策略。请注意，那些从未被拾取和处理的消息最终会被终端用户注意到。\n\
  \n消息可以是平台无关的，但这取决于消息供应商。`Java EE` 消息使用的 `JMS` 规范根据定义是 Java 特有的。然而，某些为 Java 实现 `JMS`\
  \ 接口的供应商也为使用其他开发平台的客户端提供了支持。\n\n在一个应用程序需要通知另一个应用程序特定事件的情况下，消息非常有用。使用其他接口方法之一，外部应用程序可以按计划“拉取”关于该事件的信息，但这通常没有那么及时。在应用程序接口中利用消息服务的优点如下：\n\
  \n- 消息服务提供保证递送。\n- 消息服务是平台无关的。\n- 消息服务具有 Java EE 容器支持。\n\n利用消息服务的缺点如下：\n\n- 消息服务没有内置的文档策略。\n\
  \n## 利用企业 Java Bean\n\nEnterprise Java Beans (`EJBs`) 是一种纯 Java 方法，可从一个应用程序调用另一个应用程序。在应用程序接口中利用\
  \ EJB 的优点如下：\n\n- EJB 定义使用发布的 Java 接口自文档。\n- EJB 有广泛的产品支持。\n\n\n\n\n* EJBs 提供了一层变更隔离层。\n\
  \n将 EJBs 用于应用程序接口的缺点如下：\n\n* EJBs 仅限于基于 Java 的客户端。\n* EJBs 不易于进行安全保护。\n* EJBs 在需要时可能不可用；消费者需要停机策略。\n\
  \n虽然 Java EE 规范迟后让企业级 Java Bean（EJBs）变得容易发布，并且有现成的工具支持这些它们，但 Web 服务更受欢迎。Web 服务提供了与\
  \ EJBs 相同的功能，且不会将消费者限制在基于 Java 的应用程序。\n\n## 常见错误\n\n**将数据库和文件系统作为“消息中间件”。** 这种容易出错的策略包括向数据库表（或文件系统中的文件）写入包含消息内容的行。该策略的第二部分是编写一个代理来“轮询”数据库（或文件系统）以检查新消息到达，读取并处理消息内容，然后删除该行或文件。\n\
  \n从本质上说，这种策略类似于自己写一套消息系统。它通常是 Bug 的频繁来源。为什么要重复造轮子呢？选择现有的通信形式之一，专注于业务逻辑，而不是低层的通信编程。\n\
  \n**在需要响应时使用异步通信方法（如消息传递）。** 这种策略下，你的应用程序向另一个应用程序发送异步消息，并等待该应用程序的返回消息。\n\n在需要响应时使用异步通信会让你处于编写一个算法来等待响应的境地。你需要等多久？如果你等得太久，可能会阻塞用户。如果你等得不够长，可能会误报错误。这类似于两个人在极其嘈杂的房间里试图寻找彼此。如果需要响应，请使用同步通信方法。\n\
  \n如果发起消息的应用程序不需要响应，使用异步通信方法对意外停机的影响较小，因为如果接收应用程序当前不可用，发送方也不会遇到错误。接收应用程序只会在上线后消费该消息。由于异步消息传递需要消息软件，使用异步通信为应用程序增加了组件和复杂性。我不想给你留下使用异步消息传递是危险的印象，消息传递技术是成熟、健壮且稳定的。\n\
  \n**未考虑生产环境需求。** 对于那些没有标准化负载均衡选项、通信协议和安全方法的组织，你需要调查外部应用程序计划使用什么，并在接口设计中适应这些计划。对于在整个企业范围内标准化安全考量和硬件平台的组织，这些信息可能已经已知。减轻这种风险的一种方法是预先对计划的通信方法进行小型测试实现。这样如果你需要修改设计，就有更多时间反应。\n\
  \n## 确定数据结构\n\n**记录所有传递给外部应用程序的数据。** 通信结构或格式，以及决定传输的条件，是你与外部系统开发者之间合约的一部分。数据结构应当通过书面记录。\n\
  \n**使用简单的结构化格式（如 XML 或 CSV）作为旧平台的接口。** 如果你的公司不购买 XML 解析器，对于使用旧平台的开发者来说，XML 可能会是一个头疼的问题。在本书编写，`COBOL`\
  \ 或 `PL/I` 没有开源解析器或其他工具。这将是一个非常有价值的开源项目。当外部应用程序是遗留系统且客户端不购买 `XML` 工具进行辅助时，出于实际需要，自定义格式很常见。自定义格式可以具有关键字类型的组织（类似于\
  \ `XML`）或某种类型的位置组织。`COBOL` 适合使用位置格式的固定长度字符串。\n\n你需要开发 `DTD` 或 schema，或者其他记录 `XML`\
  \ 文档格式和标签以及允许的值。将这种通信留在口头会导致失望和数尽的项目延误。第 7 章包含了帮助你设计 `XML` 文档的材料。\n\nCSV 格式似乎被许多购买的软件产品广泛支持。然而，尽管已尝试编写\
  \ CSV 格式规范，但对于允许哪些分隔符以及字符串支持哪些转义字符还没有正式共识。出于这些原因，如果有选项，我倾向于使用 XML。\n\n**外部接口没有必要对\
  \ XML 文档验证。** 开发一个 `DTD` 来描述文档格式并不意味着你必须“验证”文档。验证对于人们直接编写的文档有效，这些文档更有可能包含错误。应用程序接口是机械的。除了初始开发，接收到从另一个应用程序程序生成的错误\
  \ `XML` 文档的概率非常低。鉴于此，验证的收益通常不大于其性能成本。\n\n**避免将序列化的 Java 对象作为消息内容发送。** 这由于使两个应用程序依赖于相同的类，实际上抵消了松耦合的优势。如果序列化类引用的对象之一发生了更改，则该更改必须同时部署到两个应用程序。此外，如果一个应用程序升级了其\
  \ Java 虚拟机 (`JVM`)，可能会发生序列化问题。序列化对象无法通过视觉检查来确定内容；它们必须通过程序处理。它们还将通信限制在了 Java 应用程序中。\n\
  \n## 错误处理需求\n\n**错误处理需求需要像数据格式一样彻底地讨论、记录并达成一致。** 糟糕的错误处理会导致高维护成本。\n\n### 错误通知程序\n\
  \n**所有外部应用程序接口都应该有错误通知程序。** 一些组织提供集中运营人员负责通知应用程序支持人员错误。这通常通过某种控制台消息实现。控制台 24x7 监控并不罕见。具有这种能力的组织提供某种程序化生成供人采取的控制台消息是正常的。\n\
  \n**使用机械错误通知。** 在尚未建立企业级错误通知程序的公司，我通常会为严重系统错误包含某种电子邮件通知。仅仅将错误写入日志是假定有人会查看它们。写入日志的消息往往会被忽略。由于大多数字母数字寻呼机通过电子邮件接收消息，因此为严重错误包含寻呼通知非常容易。由于显而易见的原因，这应该谨慎使用。\n\
  \n**在记录错误时不要害怕冗长。** 我的哲学是错误日志应该包含尽可能多的信息。虽然其中某些信息对特定问题可能没用，但在信息方面，多总比少好。如果日志记录成功，很大比例的错误应该仅通过错误消息就能进行诊断，而无需进一步重现问题。\n\
  \n在某些公司，可以使用商业工具支持来帮助记录。`BMC Patrol`、`EcoTools` 和 `Tivoli` 是经常用于监控企业的商业网络管理工具 set。`OpenNMS`\
  \ ([`www.opennms.org`](http://www.opennms.org)) 和 `Nagios` ([`www.nagios.org/`](http://www.nagios.org/))\
  \ 是网络管理的开源替代方案。\n\n### 重试程序\n\n\n\n\n\n一旦完成初始开发，大多数接口错误都是由环境原因引起的。例如，有人重启了数据库或消息软件，有人绊倒了网线，或者服务器文件系统已满。在大多数情况下，错误最终会被修复，应用程序接口也将恢复正常功能。\n\
  \n然而，对于大多数应用程序，对于失败的传输，必须执行某种形式的恢复或重传程序。例如，来自订单应用程序的记录客户购买情况的消息必须重新发送，以保持会计记录的准确性。\n\
  \n**将重试程序机械化。** 对于用户并非在物理上等待的传输，我通常会制定一套自动重试逻辑方案。在大多数公司中，环境问题的发生频率足以让你包含选择性重试逻辑，以便更快、更省力地从故障中恢复。重试机制的目标是从临时故障中自动恢复，无需无需管理员的人工干预。\n\
  \n复杂性的风险在于如何区分临时故障和那些不会随时间推移而消失的错误。你可以采取“地毯式”的方法，假设所有错误都是由临时故障导致的，因此始终启动重试逻辑。危险在于，重试逻辑会导致除临时故障以外的任何情况陷入无限循环。因此，你应该谨慎地使用这种方法。\n\
  \n**所有机械化的重试逻辑都应该有限制。** 不要永远重试，这本质上是创建了一个无限循环。选择一个合理的重试间隔和重试次数。将这些限制设置为可配置也是明智的，以便于进行调整。重试尝试应该被记录，或者可能遵循你的机械通知程序。在收到重试通知后，应用程序管理员可能会意识到采取纠正措施。\n\
  \n## 外部接口指南\n\n许多 Java EE 应用程序与外部系统通信，其中某些可能不是 Java 应用程序。作为应用程序架构师，你可能会有机会促进外部接口的设计和实现。多年来，我采用了几种创建成功外部接口的技巧。\n\
  \n**记录来自或发送到外部应用程序的每一个请求或传输。** 这应该是任何外部接口的首要任务。务必记录这些信息，以便你知道时间（如果你处于集群环境中，还有节点）。如果你在外部应用程序中启动的工作出现问题，你将能够准确地告诉那些开发者他们执行了哪些调用以及何时。如果在处理来自外部应用程序的调用时出现问题，你需要足够的信息来重现并快速修复任何问题。\n\
  \n这种文档记录习惯有助于防止你或开发团队的任何成员因他人的错误而受到指备。没有事实，任何人都可以做出指控，在太多的公司里，你被视为默认直到被证明无罪。拥有传输日志将更容易确定哪个应用程序出了问题。\n\
  \n**为应用程序管理员提供一种从外部应用程序重新提交工作请求的方法。** 当你的应用程序遇到环境问题并能够修复它时，应用程序管理员应该能够重新提交失败的工作。这限制了对终端用户的影响，并限制了修复问题所需的人员（以及时间）。有时，重新提交是不可行或不适用的。但它可以为你节省时间，去从事比维护更有趣的活动。\n\
  \n例如，我支持的一个应用程序提供了计划报告功能。应用程序管理员可以通过管理级 Web 工具重新提交任何未送达到浏览器的报告。\n\n**收集发送者的身份。**\
  \ 每次传输的一部分都应该包含指示调用者身份的信息。其目的是为了减少你的维护时间，而不是作为一种安全机制。在出现不当调用的情况下，你能够快速通知发出该调用的应用程序。如果你不知道它来自哪里，寻找并修复它将花费更长时间。\n\
  \n**开发一种机械化的将错误“推”给发送者的方法。** 如果在处理外部应用程序提出的请求时出现问题，需要通知该应用程序的管理员。如果接口具有强耦合（例如，`session\
  \ bean`、`rmi service`），你只需要抛出一个异常。外部应用程序用于错误处理的任何机制都将处理该错误。\n\n如果接口具有松耦合（例如，使用消息技术），你需要构建一种方式来机械地通知外部应用程序的管理员错误。通常，我看到电子邮件被用作这些情况的有效错误通知通道。由于大多数字母数字页面接受电子邮件，使用传真机是一种可能。然而，在将错误处理连接到传真机之前，我会彻底测试你的错误处理程序。\n\
  \n**确保你充分测试了错误处理逻辑。** 开发者往往会忽略错误处理的测试。错误处理逻辑中的错误很容易掩盖底层问题，使生产支持变得困难得多。\n\n# 第二部分\n\
  \n## 设计 Java EE 应用程序\n\n架构师师负责并促进所有的应用程序设计活动。在本节中，你将学习如何：\n\n*   使用对象模型记录应用程序设计，以便其他开发人员能够轻松理解该设计。\n\
  *   理解软件分层概念以及如何使用它们将 `J2EE` 应用程序组织成更小、更易管理的部分。\n*   在每个软件层上应用常用的设计模式。\n*   使用数据建模技术记录应用程序存储需求。\n\
  *   设计 XML 文档格式。\n*   在设计阶段后精炼项目估算。\n\n![stock-photo-17860137-binary-code-bw-horiz-slice.tif](img/00003.jpeg)\n\
  \n# 第 5 章\n\n## Java EE 设计的分层方法\n\n根据定义，架构师必须为应用程序开发人员提供整体设计。开发者理解整体设计是非常重要的，这样他们就可以做出低级别的编码决策；架构师不能指望开发者遵循他们不理解的设计。此外，如果开发者与预定的设计有分歧，最好在编写大量代码之前解决这些分歧。\n\
  \n尽管由于许多人趋于敏捷方法，详尽的文档现在受到反对，但仍然需要一定数量的设计文档。项目越大（开发人员越多），需要的文档就越详尽。拥有一定数量的文档可以让你更快速、更容易在需要时引入额外的开发人员。\n\
  \n本章介绍并解释了设计 Java EE 应用程序的通用方法。这些讨论是下一章的背景，下一章提供了将之前章节中的用例分析转换为具体设计的技巧和技术。这是一个适用于所有业务应用程序的通用方法。\n\
  \n由于我对所有 Java EE 业务应用程序的方法是一致的，这使我能够减少构建每个应用程序所需的设计文档。由于与我之前的项目合作过的开发人员已经熟悉该概念，因此在让开发者熟悉我的设计或在开发工作之间转移开发者方面花费的时间更少。这也减少了每个应用程序所需的支持开发人员人数。\n\
  \n\n\n\n\n对象模型是记录 Java EE 应用设计最常用的机制。架构师通常负责为待开发应用中最复杂的部分创建对象模型。对于那些使用极短迭代的敏捷方法（例如，每次迭代两周）的人来说，这是在迭代开始时的一项简短练习。\n\
  \n除了开发工作中最复杂部分的对象模型外，我经常还会描述主要业务流程的插图。为此，我通常使用泳道图（swim-lane diagrams）。本章将对这些内容提供更深入的描述和一个示例。\n\
  \nJava EE 应用设计是一个庞大的话题。关于设计技术、设计模式以及使用 `UML` 进行对象建模的著作不胜数。和大多数大型且复杂的方法一样，`UML` 在业务应用中仅得到了部分应用。因此，尽管我不想打击大家的学习积极，在本章中我对该主题采取了精简的方法。例如，在已识别并分类的数百种设计模式中，本章重点关注当今业务应用中最常用的少数模式。\n\
  \n## 分层概念概述\n\nJava EE 应用的一个常见框架是软件分层（`software layering`），其中每一层为系统的某个部分提供功能。层之间的组织方式是为了为其他层提供支持和基础功能。例如，数据访问层提供了一组用于读写应用数据的服务。库存管理应用需要能够读取特定项目和仓库信息的服务。\n\
  \n分层并不是一个新概念；操作系统和网络协议已经使用了多年。例如，任何接触过网络的人对 `telnet`、`FTP` 和浏览器浏览器都很熟悉。所有这些服务都依赖于\
  \ `TCP/IP` 网络层。只要 `TCP/IP` 服务的接口保持不变，你就可以 `TCP` 框架内进行网络软件改进，而不会影响 `telnet`、`FTP`\
  \ 或你的网页浏览功能。通常，`TCP/IP` 层需要设备层的服务，该层理解如何与以太网卡通信。\n\n业务应用可以战略性地利用这一相同概念。例如，将数据访问作为应用的一个独立部分是常见的做法，以便更容易整合在应用多个部分使用的数据访问逻辑。例如，通过\
  \ `id` 查找客户可能在应用的多个部分中使用。通过将数据访问分离并整合整合一个层中，现有代码变得易于识别和重用。此外，如果你的数据访问方法发生某种变化（例如，你将底层数据库从\
  \ `MySql` 切换到 `Oracle`），应用物理读写数据的方式可能会发生变化，而不会影响应用处理或业务逻辑。\n\n继续库存管理的示例，假设数据访问层有一个方法可以根据\
  \ `UPC` 码查找库存项目的信息。假设应用的其他部分在需要项目信息时会使用此方法（例如，客户在网页上查看该项目，或库存分析师为该项目订购库存）。只要访问项目信息的方法保持不变，你就应该能够重新组织存储项目和仓库信息的方式，而不影响应用的其他部分。\n\
  \n从本质上说，分层方法降低了技术演变的风险。如果你使用这一概念来分离你的部署机制（例如，`Java Server Faces` 或 `Struts`），你可以在不更改业务逻辑或数据访问层的情况下添加新的部署——例如，当你决定通过\
  \ Web 服务暴露应用功能时。如果你的应用能够有效地将业务逻辑和数据访问逻辑与应用的其余部分分离来，你就可以自由地添加 Web 服务部署，而无需更改整个应用。表\
  \ 5.1 列出了 Java EE 应用中常用的软件分层。\n\n### 表 5.1：Java EE 应用中的典型软件分层\n\n| 层 | 角色 |\n| :---\
  \ | :--- |\n| 数据访问对象层 (Data access object layer) | 管理存储数据的读、写、更新和删除。通常包含 `JDBC`\
  \ 代码，也可以用于 `XML` 文档和文件存储操作。 |\n| 业务逻辑层 (Business logic layer) | 管理业务处理规则和逻辑。 |\n\
  | 实体对象层 (Entity objects layer) | 直接映射到关系数据库表的轻量级结构。 |\n| 值对象层 (Value objects layer)\
  \ | 显示汇总业务信息的轻量级结构。 |\n| 部署层 (Deployment layer) | 发布业务对象能力。 |\n| 表示层 (Presentation\
  \ layer) | 控制面向终端用户的显示。 |\n| 架构组件层 (Architectural component layer) | 通用应用工具。通常，这些对象是企业范围内使用的良好候选。\
  \ |\n\n软件分层实现了一种被称为关注点分离（separation of concerns）的架构概念。关注点分离原则规定，软件组件应该只有一个焦点，并且只关注需要完成的内容。此外，一个软件组件的焦点不应与另一个组件的重叠。该原则的基本思想是将大型复杂的问题分解为多个更小且更简单的问题来简化软件开发。该原则还激励了重用。关于关注点分离原则的更多信息可以在此处找到：`http://aspiringcraftsman.com/2008/01/03/art-of-separation-of-concerns/`。违反该原则的情况通常被称为“关注点泄漏”（`leakage\
  \ of concerns`）。\n\n通常情况下，软件层之间的调用模式受到严格控制。软件层中的任何类都可以调用同一层中的任何其他类。例如，数据访问层中的类可以利用任何其他数据访问类。然而，数据访问层的类不会调用业务逻辑层或表示层的类，因为这些类没有直接参与读写存储数据。业务逻辑层类在它们需要启动对存储数据的读写时，也可以调用其他业务逻辑层类以及数据访问类。业务逻辑层类本身不发发\
  \ `SQL` 或启动任何对存储数据的读写；该活动被委托给数据访问层。图 5.1 展示了 Java EE 应用的典型软件分层调用模式。\n\n图 5.1：Java\
  \ EE 应用的软件分层调用\n\n![Chap-5-SoftwareLayers.eps](img/00009.jpeg)\n\n注意，实体和值对象类被所有层使用，因为它们被用于在其他软件层之间传递信息。\n\
  \n当落实到代码时，我通常将层实现为单独的包。这里包结构的示例：\n\n| 包名 | 层 |\n| :--- | :--- |\n| `com.jmu.app.dao`\
  \ | 数据访问对象层 |\n| `com.jmu.app` | 业务逻辑层 |\n| `com.jmu.app.entity` | 实体对象 |\n| `com.jmu.app.vo`\
  \ | 值对象 |\n| `com.jmu.app.ui` | 表示层 |\n| `com.jmu.app.util` | 架构组件层 |\n| `com.jmu.app.services`\
  \ | 部署层/Web 服务 |\n\n我使用缩写 `jmu` 表示“刚刚造出来的”。此外，你希望将 `app` 缩写替换为有意义的应用名称。\n\n\n\n\n\
  \n需要注意的是，直接利用数据访问层的层是业务对象层。我经常听到的一个问题是，为什么不直接从表示层调用数据访问对象（DAO）层呢？虽然直接调用数据访问对象层可以通过消除几个层来节省一些代码，但这意味着会将任何业务逻辑放在数据访问对象层或表示层中，这会让这些层变得更加复杂。软件分层的工作前提是：解决多个小问题比解决少数几个大问题更容易。经验教会了我两点教训：\n\
  \n- 如果需要修改数据层，受影响的触点会更少，因为它们都被整合在业务逻辑层中。\n- 一致性具有巨大的价值。\n\n从维护的角度来看，一致性具有价值。例如，如果某些\
  \ `SPs` 直接调用数据访问对象，而另一些通过业务对象工作，而另一些又使用部署包装器，那么当你修改你不熟悉的代码时，你必须对整个操作序列进行审计。这完全违背了关注点分离和软件分层的初衷。\n\
  \n我有幸为我的一个客户在整个企业范围内采用一致的架构。在那个客户现场，我们通常能够用 2.5 个支持开发人员资源支持十多个应用程序。在我所知的所有其他客户现场，支持大多数应用程序需要多个开发人员。架构的一致性是我客户获得如此高开发效率的主要原因之一。\n\
  \n## 数据访问对象层\n\n数据访问对象（`DAOs`）管理对某种类型持久化存储的访问。通常使用的存储是关系型数据库，但 `DAOs` 也可以管理对 NoSQL\
  \ 数据库、文件、XML 文档和其他类型持久化存储访问。\n\nNoSQL（Not Only SQL 的缩写）数据库越来越流行。`NoSQL` 是描述不使用 `SQL`\
  \ 作为与其交互的主要语法的数据库术语。在“NoSQL”伞下有很多产品。事实上，NoSQL 数据库有几类，例如文档存储、键值存储、图数据库等。NoSQL 数据库的差异巨大，且优缺点也截然不同。因此，要描述各种带有“NoSQL”标记的各种产品的优缺点，本身就需要写一本书的量。\n\
  \n然而，已经有人尝试对更流行的 NoSQL 数据库产品进行泛化处理，并提供关于它们优缺点的通用概述。我找到的最佳摘要可以在此处查看：[`kkovacs.eu/cassandra-vs-mongodb-vs-couchdb-vs-redis`](http://kkovacs.eu/cassandra-vs-mongodb-vs-couchdb-vs-redis)。作为一个非常广泛的泛指，NoSQL\
  \ 数据库可以是任何不易符合关系型数据库模型、且你计划对数据存储执行的查询是已知且定义良好的数据存储候选者。日志似乎是 NoSQL 数据库的一个流行用途。NoSQL\
  \ 似乎也常用于内容管理系统（`CMS`）应用程序。然而，在此时，关系型数据库访问仍然占据主导地位。因此，关系型数据库访问在书中会有更多的关注。\n\n将数据访问与应用程序的其他部分分离的主要原因是：切换数据源更容易，并且在应用程序之间共享\
  \ `DAOs` 也更容易。此外，在多个应用程序使用同一个数据库的情况下，可能合并数据访问层代码，并在多个 Java EE 应用程序中利用相同的访问代码。\n\n\
  数据访问对象有两种最常见的模式。最简单的模式是将每个持久化对象表示为一个 `DAO`。我将其称为`简易数据访问模式`。更复杂但更灵活的常用模式是基于工厂的模式。事实上，它被称为`数据访问对象模式`。我将在本节后面定义每种模式。\n\
  \n为了方便，我在包层次结构中分离了 `DAO` 对象（例如 `com.acme.appname.data` 或 `com.acme.appname.dao`）。我之所以提到这一点是因为某些建模工具（例如\
  \ `Rational Rose`）鼓励你在建模时决定包结构。一些开发者还会在数据访问对象的名称添加 `DAO` 后缀；例如，客户可能被命名为 `CustomerDAO`。\n\
  \n## 选择数据库持久化方法\n\n关于哪种持久化方法最好是一个引起相当分歧和争议的话题。尽管 Java EE 规范提供了实体豆（entity beans），但存在其他流行的数据库持久化形式。开发者在争论中站队的程度类似于讨论宗教或政治；这种争论并非完全理性的。我将带你了解我对不同选项的想法、我在市场上看到的，以及我倾向于使用的。然而，本章中的建模概念适用于所有的持久化方法。\n\
  \n在开始对象建模活动时，你可以在不选择实现时使用的持久化方法的情况下识别 `DAO`。例如，`DAO` 可以是一个自定义的 `JDBC` 类、使用 Java\
  \ 持久化 API（`JPA`）的类（例如 `Hibernate`），或者利用对象关系映射（O/R）映射工具（如 `Ibatis`）的对象。Java EE 兼容所有这些持久化方法。\n\
  \n在做出决定时，我首先考虑数据访问对象层需要发生什么。然后我根据每个持久化方法实现目标的良好程度对其进行评分，使用以下评分系统：\n\n- 高（最高评分）：在实现既定目标方面得分很高。\n\
  - 中（中等评分）：中等实现既定目标。\n- 低（最低评分）：不能很好地实现既定目标。\n\n表 5.2 列出了几种数据持久化方法的目标和评分。表格之后是我确定评分的推理说明。我认为表格列出的前四个目标对我的客户最重要的。\n\
  \n### 表 5.2：数据持久化方法的评分\n\n| 目标 | JDBC | JPA | O/R 工具 |\n| :--- | :--- | :--- | :---\
  \ |\n| 最小化学习曲线 | 高 | 中 | 中 |\n| 最小化代码和配置 | 低 | 中 | 中 |\n| 最大化调优能力 | 高 | 低 | 低 |\n\
  | 最小化部署工作 | 高 | 中 | 中 |\n| 最大化代码可移植性 | 中 | 高 | 高 |\n| 最小化厂商依赖 | 高 | 高 | 低 |\n\n\
  **最小化学习曲线**。因为 `JDBC` 是第一个数据库持久化 API，它是大多数（不是所有）Java 开发者熟悉的，因此学习曲线最低。要使用 `JPA` 或\
  \ ORM 工具集，开发者除了直接使用的技术外，还需要理解 `JDBC`。原因之所以是：当错误出现时，必须了解你的 `JPA` 或 ORM 实现正在做什么以诊断错误。\n\
  \n**最小化代码和配置文件的编写与维护**。人们在评估开发易用性时倾向于只考虑代码行数。我将任何配置文件（例如注解或 XML 配置文件）视为具有不同语法的代码。我所熟悉的\
  \ `JPA` 实现和大多数 ORM 工具集在大多数情况下都能节省某些比例的代码。\n\n\n\n\n\n## 最小化部署工作。部署的麻烦会对开发和维护时间产生负面影响。在这种情况下，所有产品选择在重新部署更改所需的精力方面似乎是大等等的。\n\
  \n## 最大化代码移植性。能够将数据访问代码从一个数据库迁移到另一个是某些应用程序的考虑因素。从这个意义上说，`JPA` 实现为编写真正可移植的代码提供了最佳机会，这些代码可以运行任何流行的关系型数据库上。对于许多业务应用程序来说，切换底层数据库供应商是一个稀有事件。在这种情况下，这一准则的权重应该较小。\n\
  \n## 最小化对供应商的依赖。你需要减少对提供 Java EE 容器服务、`JDBC` 驱动程序、`JPA` 实现和 O/R 工具集的供应商的依赖。从业务角度来看，如果供应商失败或更改其成本结构，这种减少是有理想的。你可以轻松地更换\
  \ `JDBC` 驱动程序；我已经针对多个数据库供应商这样做很多次。切换 `JDBC` 供应商通常只需要更改一个 `jar` 文件并进行容器配置更改。大多数应用程序都不使用\
  \ `JDBC` 供应商特定的类，因此当你切换供应商时不需要任何更改。\n\n更换容器供应商相对容易。你确实可能会遇到性能调优问题，特别是 `JPA` 供应商方面。对于\
  \ O/R 工具集，应用程序代码直接使用供应商（或供应商生成的）类。在大多数情况下，切换 O/R 工具集需要大量的开发工作。\n\n我思考软件工具集的使用就像经济学家思考市场效率一样。金融分析师和经济学家有一个理论，认为金融市场是有效的。也就是说，当新信息公开时，所有与信息相关的公司股价随时间发生相应变化。例如，当安然（Enron）和美国航空破产的消息为人知时，这些新闻对它们的股价产生了深远影响。\n\
  \n当引入新的软件范式时，如果它们提供的收益超过了成本，随着时间的推移，开发者将会转向它们。编程范式发生这种情况的时间比金融市场慢得多，但总体概念是非常相似。当我写这本书的第一版时，关于数据库持久化的“市场”共识似乎倾向于原生\
  \ `JDBC`。然而，搜索引擎关键词对 `Hibernate`（一个 `JPA` 实现者）的关注度高于对 `JDBC` 的关注。推断出开发者正倾向于像 `Hibernate`\
  \ 这样的 `JPA` 实现。使用招聘数据作为市场共识的代理也是可能的；招聘数据显示雇主对 `Hibernate` 的兴趣已经超过了 `JDBC`。我引用的搜索引擎关键词数据来自\
  \ `Google Trends`，并如图 5.2 所示。我引用的招聘数据由于许可限制无法包含。\n\n图 5.2：持久化技术术语的搜索引擎关键词统计\n\n\
  ![Chap-5-Persistence-Keyword-Stats-2013-11-17-bw.eps](img/00010.jpeg)\n\n来源：2013\
  \ 年 11 月 17 日的 Google Trends。\n\n## 简化的数据访问模式\n\n在最常见的两种数据访问对象（DAO）模式中，这是最简单的。在这种模式中，物理存储结构（例如关系型数据库表、XML\
  \ 文档或文件）与管理它的 `DAO` 之间是一一对应的关系。例如，你可能有一个 `CUSTOMER_DAO` 来管理关系型数据库中 `CUSTOMER` 表的访问。虽然你还没有确定方法，但你可以想象该类将拥有使用搜索标准作为参数来搜索并返回一个或多个客户的方法。它可能还有插入、更新和删除客户的方法。\n\
  \n这种模式的优点是它很简单。它的主要缺点是它通常针对特定的某种数据源类型。操作 XML 文档的代码与使用数据库表所需的 `JDBC` 和 `SQL` 完全不同。切换数据源类型将对该类中的大多数方法进行重大重构。\n\
  \n无论你选择什么数据库持久化机制，这种模式都是可用的。你数据持久化方法的选择仅决定了 `DAO` 类内部是如何构造的。图 5.3 展示了这种模式的面向模型。\n\
  \n图 5.3：简化的数据访问模式\n\n![Chap-5-Simplified-DAO-Pattern.eps](img/00011.jpeg)\n\n##\
  \ 支持多个数据库\n\n对于支持多种类型数据库的应用程序，基于工厂的数据访问对象模式非常常见。这种模式将 `DAO` 实现为接口。需要一个工厂来产生实现此接口的对象。此外，你为每种数据源类型都有一个该接口的实现。工厂足够智能，知道如何实例化所有的实现。图\
  \ 5.3 展示了这种模式的对象模型。\n\n图 5.4：数据访问对象模式\n\n![Chap-5-Full-DAO-Pattern.eps](img/00012.jpeg)\n\
  \n例如，考虑一个客户 `DAO` 实现。它将有一个 `CustomerDAO` 接口，规定了各种搜索方法以及更新、删除和插入方法。它还有一个客户 `DAO`\
  \ 工厂（`CustomerDAOFactory`），负责为应用程序提供 `DAO`。它可能还为它所支持的所有关系型数据库提供实现（例如 `CustomerDAOOracleImpl`、`CustomerDAOSybaseImpl`、`CustomerDAOMySQLImpl`\
  \ 等）。业务对象代码将专门使用 `CustomerDAO` 接口，以便其可以使用这些实现中的任何一个。\n\n你可能需要在数据访问层进行这种配置的另一个原因是为了单元测试。在对业务逻辑层（数据访问层的主要消费者）进行单元测试时，为业务层单元测试模拟（stub）数据访问层通常很有用。这消除了对特定数据库的依赖。\n\
  \n## 考虑使用反转控制（IOC）产品代替手动编写对象工厂。目前流行的 `IOC` 实现有 `Spring`、`Google Guice` 和 `Pico`。这些产品消除了编写工厂类的需要，但引入了某种程度的配置和复杂性。\n\
  \n如果你预见不需要支持多个数据库供应商，并且计划为业务层维护单元测试，那么数据访问对象模式就是多此一了。很少有业务应用程序需要支持多个数据库。虽然大多数开发者采用某种程度的单元测试，但许多人并没有严格执行测试驱动开发。如果你的组织致力于编写和运行自动化单元测试，那么你可能需要使用数据访问对象模式。如果你的组织不支持这种程度的测试，那么你无法从额外的复杂性中受益。\n\
  \n## 实体对象层\n\n大多数应用程序使用关系型数据库进行存储。实体类与应用程序的关系型数据库表之间有一一映射。例如，如果你有一个 `Customer` 表，那么也会有一个表示该表的\
  \ Java 类 `CustomerEntity`。该类将具有与该表列对应的字段。在实际操作中，`CustomerEntity` 的实例代表 `Customer`\
  \ 表中的行。在实际操作中，实体对象层代表了应用程序关系型数据库的“Java”版本。\n\n\n\n\n\n从某种意义上说，数据访问类是实体类的工厂。它们将关系型数据库数据作为“输入”，并产生一个或多个实体类实例作为输出。它们还翻译实体类中的数据，并将其持久化到应用程序数据库中。\n\
  \n通常，实体类被分在不同的包结构中（例如 `com.acme.appname.entity`）。此外，为实体类使用命名规范通常是有帮助的，这样就可以很容易识别某个类是否为实体类。通常，我会在实体类后面使用“Entity”后缀（例如\
  \ `AccountEntity`）。如果数据库设计遵循第三范式（将在单独的章节中描述），那么从该设计派生的实体类将与从对象建模角度识别出的内容密切贴合。例如，之前讨论的“客户（customer）”和“账户（account）”表是对象建模练习中\
  \ Java 类的逻辑候选者。每个应用程序都有逻辑上属于且通常一起使用的数据项。\n\n通常，实体类具有访问器方法（accessor）和变变器方法（mutator），但通常没有其他其他内容。它们通常在所有其他应用程序层中被引用。\n\
  \n# 值对象层\n\n除了代表将保存并稍后检索的数据实体类外，每个应用程序都有逻辑上属于且通常一起使用的瞬态数据项。瞬态数据是为了便于特定工作而存在的数据，但不会被直接保存。值对象（Value\
  \ Object, VO）类代表这类数据。例如，值对象可能用于表示用户显示的聚合销售信息（例如 `SalesDisplayVO`）。聚合销售信息通常不直接存储，而是在需要显示或报告时从详细的销售数据中总结出来的。\n\
  \n关于值对象的话题存在一些标签上的混淆。我对比“值对象”的定义非常接近数据传输对象（DTO）。DTO 的定义可以在[此处](http://martinfowler.com/eaaCatalog/dataTransferObject.html)查找到：[`martinfowler.com/eaaCatalog/dataTransferObject.html`](http://martinfowler.com/eaaCatalog/dataTransferObject.html)。多年来，Java\
  \ EE 社区推广将 DTO 作为在会话豆（EJBs）及其客户端之间传输数据的首选方式（因此标题中使用了 transfer 传输一词）。由于使用 DTO 术语意味着使用企业级会话豆，许多人开始使用“值对象”一词来避免这种暗示。应该说，值对象术语在\
  \ C++ 圈中具有不同的含义。在这些圈子里，值对象以有意义的方式描述一个值（例如，货币、日期等）。\n\n在 Java EE 早期，企业豆（EJB）的使用比现在要广泛得多。在使用企业豆时，值对象用于优化豆本身与其调用者之间的网络传输。随着\
  \ EJB 使用的减少，大多数应用程序不需要那种程度的分布，因此为此目的使用值对象类已不再那么相关。\n\n在程序上，将这组逻辑数据项视为一个单独的对象是方便的。这种类型的对象通常被称为值对象（VO），尽管某些文本将其称为数据传输对象。如果\
  \ Java 有像 C/C++ 和许多其他语言那样的“结构（structure）”构造，那么 VO 将是一个结构体。\n\n例如，你可以将用于报告模板的各种信息组合成一个\
  \ VO。需要报告模板参数的方法就可以接收 `ReportTemplateVO`，而不是为结构中的所有组件接收单独的参数。\n\n通常，VO 具有访问器和变变器方法，但几乎没有其他内容。而且通常\
  \ VO 会实现 `java.io.Serializable`，以便它可以被传输到远程应用程序客户端或在会话中序列化。Java EE 容器和 RMI 服务在将\
  \ Java 类传输到远程机器之前对其内容进行序列化。一种约定是给值对象命名加上 VO 后缀，如 `CustomerVO`。\n\n## 常见模式\n\n值对象来源于一个正式定义的模式。在某些书中，这种模式被称为值对象模式（Alur,\
  \ Crupi, and Malks, 2001）。VO 模式增强了 EJB 性能，但在应用程序所有层之间的通信中也有用。\n\n你可以将 VO 模式与组合模式（composite\
  \ pattern）结合，后者用于某物包含其他物的情况。例如，报告模板通常包含多个参数。使用组合模式，`ReportTemplateVO` 包含一个 `ReportTemplateParameterVO`\
  \ 对象数组，如图 5.5 所示。\n\n图 5.5：带有值对象上下文的组合模式\n\n![Figure5.5.CompositePattern.eps](img/00013.jpeg)\n\
  \n# 业务逻辑层\n\n业务逻辑层的对象将数据与业务规则、约束和活动相结合。业务对象应该与 DAO、实体对象、VO 以及服务层（如 Web 服务）分离，以最大化地提高重用可能性。业务对象经常使用并协调多个数据访问对象的活动。\n\
  \n**业务对象应该是部署无关的且自包含的。** 业务对象应该易于在批处理作业以及 Web 应用程序或厚客户端应用程序中使用。业务逻辑对象利用数据访问类并引用实体对象和值对象，但不引用表示层的任何内容。我们将发现，表示层使用业务逻辑层，而不是相反。\n\
  \n**业务逻辑包含了对应用程序执行的任何工作的的事务脚本（transaction scripts）。** 例如，如果对新客户自动启动信誉检查，管理保存新客户信息的业务逻辑类可能也会同时为该客户启动信誉检查。此操作可能由业务用户通过\
  \ Web 应用程序启动，也由处理已购买客户的批处理作业启动。业务逻辑类对其执行的上下文不做任何假设。\n\n## 常见模式\n\n业务逻辑层中最频繁使用的模式之一是事务脚本（`Transaction\
  \ Script`）模式。这种模式基本上将应用程序视为一系列离散的事务。例如，在银行行业，常见的事务是定义新客户并为该客户开设新账户。你可以将查询账户余额的事务想象为财务交易的一部分，如图\
  \ 5.6 所示。更详细的定义可以在[此处](http://martinfowler.com/eaaCatalog/transactionScript.html)找到：[`martinfowler.com/eaaCatalog/transactionScript.html`](http://martinfowler.com/eaaCatalog/transactionScript.html)。\n\
  \n事务脚本模式经常被批评为不是面向对象的。事实确实如此。它流行是因为遵循了保持软件尽可能简单的做法。\n\n图 5.6：事务脚本示例\n\n![Chap-5-Transaction-Script-Example.eps](img/00014.jpeg)\n\
  \n分层初始化（`layered initialization`）当你拥有同一种对象的不同变体时常用的一种模式。例如，大多数应用程序都有不同类型的用户。如图 5.7\
  \ 所示，你可能有信任客户用户、企业客户用户、银行支持用户、应用程序管理员用户等。所有这些用户都有共同点，但也有独特的方面。\n\n图 5.7：分层初始化模式示例\n\
  \n![Figure5.7.LayerdInitializationExample.eps](img/00015.jpeg)\n\n\n\n\n\n当同一个业务对象可能需要产生不同的输出或使用不同的输入时，你可能会使用\
  \ `adapter pattern`（适配器模式）。考虑图 5.8 所示的示例，报告业务对象具有几种不同的交付机制——电子邮件、ftp——但所有其他处理都是相同的。此外，已经存在可以执行电子邮件和\
  \ ftp 交付的工具，但它们没有实现应用程序当前所需的 `interface`（接口）。适配器的责任是实现该 `interface` 并利用任何为了实际完成报告交付所需的第三方产品。\n\
  \n图 5.8：适配器模式示例\n\n![Chap-5-Adapter-Pattern.eps](img/00016.jpeg)\n\n与 `strategy\
  \ pattern`（策略模式）类似，当业务对象的活动可能根据上下文发生变化时，就会使用策略模式。然而，适配器模式在动态改变其输入和输出的同时保持类的活动不变，而策略模式则在使用固定输入和输出的情况下使类的活动变为动态。这在很大程度上是对于“谁是客户端”的感知差异。图\
  \ 5.9 展示了策略模式。\n\n图 5.9：策略模式示例\n\n![Figure5.9.StrategyExample.eps](img/00017.jpeg)\n\
  \n## 部署层\n\n部署包装器（Deployment wrappers）将业务对象的功能发布到 Java 类中，这些类可能位于不同的机器上（包括表示层中的任何内容）。部署包装器的示例包括企业豆（例如\
  \ `session beans`、`message-driven beans`）和 Web 服务。\n\n促进重用是部署业务功能的动机，使其可以被其他应用程序调用。也就是说，重用现有功能比重新发明更好。有时，要重用的功能频繁变化，或者具有沉重的资源需求，使得很难将该功能作为通用代码包含在应用程序中。\n\
  \n**部署层类发布业务逻辑。** 服务层类利用业务逻辑类并引用实体类和值对象。它们不直接引用数据访问类。\n\n**不要在部署层类中直接实现业务逻辑。** 一些开发者认为企业豆代表了业务逻辑。虽然在技术上可以将我所说的业务对象和企业豆合并到同一个类中，但我建议这样做。保持业务逻辑分离可以让你获得完全的部署灵活性。你可以在不更改底层业务对象的情况下，将同一个业务对象部署为企业豆、消息驱动豆、Web\
  \ 服务，甚至是客户端应用程序。将业务逻辑分离到与部署无关的类中会产生额外的类，但这些类的复杂性更低。\n\n**发布作为独立工作单元的趋势。** 如果远程调用成功，远程调用所做的任何更改都将提交且不会参与回滚。如果你需要回滚远程调用执行的工作的能力，最好将业务逻辑代码包含在应用程序中，在其中你可以控制事务策略。\n\
  \n**趋于避免发布预期高事务量的远程功能的趋势。** 远程调用具有本地调用没有的网络开销。无论选择哪种部署包装器，这一点都是成立的。\n\n## 选择部署包装器\n\
  \n你可以为同一个业务对象拥有多个部署包装器。例如，为客户对象创建一个消息驱动豆和一个 Web 服务部署并不罕见。\n\n每种类型的部署包装器都有其优缺点。如果你还没有实质性地完成用例分析和原型设计（第\
  \ 3 章）或定义应用程序接口（第 4 章），选择使用哪种类型的部署包装器是困难的。表 5.3 总结了部署包装器类型之间的差异。\n\n表 5.3：部署包装器类型的特征\n\
  \n| 特性 | EJB | Web Services | RMI | HTTP |\n| :--- | :--- | :--- | :--- | :--- |\
  \ :--- |\n| 调用者平台要求 | 仅限 Java | 任意 | 任意 | Java | 任意 |\n| 支持的通信方法 | 仅同步 | 两者 | 两者\
  \ | 仅同步 | 仅同步 |\n| 耦合性 | 紧 | 松松 | 松松 | 紧 | 松松 |\n| 支持用于可扩展性和可用性的集群？ | 是 | 是 | 是\
  \ | 否 | 是 |\n\n在决定使用哪些部署包装器以及发布哪些业务对象时，请问自己以下问题；你的答案将帮助你引导决策过程。\n\n*你的业务对象是否是从非\
  \ Java 应用程序调用的？*\n\n此功能通常发布为 Web 服务。Web 服务通过使用 SOAP 格式用 XML 编码所有通信，完全消除了任何语言之间的限制。由于\
  \ Web 服务不表示程序耦合，它们需要的部署协调非常少。Web 服务被广泛使用，通常是首选的部署封装技术。\n\n如果你的消息供应商支持 `JMS` 并且针对外国应用程序平台拥有原生\
  \ API，你应该能够将此功能部署为消息驱动企业豆。\n\n*你的业务对象是否通过 JMS 接收并处理消息？*\n\n支持 `JMS` 消息接收和处理的功能通过消息驱动企业豆实现。该豆利用业务逻辑类来执行处理消息所需的任何工作。尽管\
  \ `JMS` 标准在过去几年中创建并完善，但消息技术已经存在了十多年。大多数消息技术供应商都实现了 `JMS` 接口。消息适用于传输信息。这种技术的设计更多是为了保证交付，而不是提供秒级的响应时间。\n\
  \n*你的业务对象是否需要两阶段提交功能？*\n\n如果是，将业务对象部署为会话豆。两阶段提交功能需要 `JTA` 并由 Java EE 容器提供。从 Java\
  \ EE 容器内部运行 Web 服务或 servlet 将访问 `JTA`，但这些部署可能用于不支持 `JTA` 的环境。\n\n## 常用模式\n\n用于部署包装器的常用模式是\
  \ `session façade pattern`（会话外观模式）和 `proxy pattern`（代理模式）的组合。这种组合（或其变体）适用于我能想到的所有部署包装器。会话外观模式在\
  \ EJB 部署中特别流行，但该概念对于大多数类型的分布式对象都是有效的。\n\n企业豆或 Web 服务等部署包装器的两个常见设计目标是尽量减少网络流量和尽量减少更改。外观模式通过允许发布的功能是粗粒度的来减少网络流量。也就是说，使用外观模式，对远程服务的远程调用可以启动对大量数据的业务逻辑处理，或将低级业务逻辑功能合并到一个调用中。减少调用远程服务的次数通常更重要，即使这会导致这些调用或返回结果中的某些数据更大。\n\
  \n外观模式允许你减少发布到远程调用者的功能更改。也就是说，它保留了重构和更改业务逻辑层或应用程序其他层的能力，同时保持发布该功能到远程应用程序的外观不变。这对于客户是友好的，因为服务的远程应用程序调用频率降低了。它还保留了你重构和更改发布服务的应用程序而不意外影响客户的能力。\n\
  \n\n\n\n一些开发者喜欢直接将业务逻辑层对象作为 Web 服务或企业豆（Enterprise Beans）发布。这通常是为了尝试简化并降低复杂性。但这种方法的问题在于，业务逻辑层的变化可能会影响这些服务的被调用和使用方式。这意味着业务逻辑层中一次无意的重构可能会对调用这些服务的应用程序产生意想不到的后果。图\
  \ 5.10 形象地展示了你如何有效地结合会话外面（session façade）和代理（proxy）模式。\n\n### 图 5.10：代理模式的会话外面模式\n\
  \n![Chap-5-Session-Facade-Pattern.eps](img/00018.jpeg)\n\n## 扩展阅读\n\nGamma, Erich,\
  \ Richard Helm, Ralph Johnson, and John Vlissides. 1995. *Design Patterns.* Reading,\
  \ MA: Addison-Wesley.\n\n![stock-photo-17860137-binary-code-bw-horiz-slice.tif](img/00003.jpeg)\n\
  \n# 第 6 章：创建对象模型\n\n应用架构师负责领导应用设计过程。在这个角色中，架构师既是应用设计者，也是促进者。本章将向你展示如何利用用例分析结合上一章描述的分层方法，为\
  \ Java EE 应用程序构建有效的设计，并将它们记录在对象模型中。在此过程中，我将分享一些领导小组设计过程的技术。\n\n完成的用例对于有效的应用设计至关重要。没有了用例，对象建模会议产生的问题将多于答案。如果你确实在用例文档中发现了模糊的点或未解决的问题，请应用“做出假设”的技术来填补空白。记录下你所做的假设，以便日后与业务部门进行确认。当你在处理大型项目时，你的用例分析更有可能是不完全的。\n\
  \n对象建模练习适用于 Java EE 应用程序中自定义的 Java 部分（例如，不是由软件供应商提供的）。对第三方软件组件的建模应仅限于由你的应用程序直接调用的类。\n\
  \n**没有必要对应用程序的 100% 进行建模。** 这在利用分层架构时尤为如此。对象模型最可能用于值对象层业务逻辑层。例如，一旦你完成了设计中的数据建模部分（将在下一章介绍），整个实体层的对象模型将变得显而易见，因为每个类都与一个表有一一一的关系。此外，许多\
  \ JPA 实现会生成映射到数据库的类。同样，数据访问层类通常与实体类有一一一的关系（例如，一个客户实体类可能会有一个处理 I/O 的客户数据访问层类）。请将建模活动集中在应用程序最复杂的部分（通常在业务逻辑层）。\n\
  \n**应用架构师负责促进设计讨论，设计过程应该让业务逻辑层和表现层的开发者参与其中。** 由于其主观性，对象建模过程可能成为产生挫败感的大源头和项目瓶颈。我见过一些项目中，架构师私下生成对象模型，然后试图强迫其他开发者遵循。虽然单人建模者可能比团队更快地生成对象模型，但该模型更有可能包含错误和遗漏，而且只有架构师理解并效忠于它。\n\
  \n当模型是私下生成时，它就得不到开发者的实质性支持。毕竟，如果开发者无法理解或同意某项计划，他们当然不想遵循它。许多开发者对架构师生成的模型的反应是，从那个时候起不再为项目贡献任何实质性的内容。架构师可能想要“草拟”一个模型以推动设计过程，但开发者应该清楚地理解，这个草案提出的仅是为了引发讨论，并且完全可以更改。\n\
  \n从实际角度来说，当我需要从多个开发者那里获得有意义的支持时，我会通过一个更漫长的过程来共同制定计划。对模型投入过意见并有多次机会建议改进的开发者，在实施该模型时会更有热情。\n\
  \n**为所有建模会议指定一名记录员。** 很难在主持设计会议的同时，准确且完整地记录所讨论的各项。由于架构师通常负责主持会议，因此应该由其中一名开发者充当记录员，也许可以轮流上。在设计会议之后，记录员负责更新对象模型以反映会议中讨论的变更。\n\
  \n本章的剩余部分提供了一个你可以使用的框架，引导开发人员通过对象建模过程。该过程的第一步是使用用例作为指南识别应用程序中的主要对象。接下来，你把这些对象细化为类，确定它们如何交互，并识别属性和方法。在整个章节中，我将向你展示如何简化流程并避免那些烦人的瓶颈。\n\
  \n## 识别对象\n\n**识别最重要的构要素。** 用例中的名词通常是类的良好候选者。因此，识别对象的一种良好方法是阅读用例并提取所有名词列表。（你可以忽略初始短语“系统将……”中的“系统”一词，因为它仅仅是用例格式的一部分。）\n\
  \n此时，你应该宽泛地理解我对 `object`（对象）一词的使用。在开发的早期，不可能对这些对象有足够的了解来确切知道你将从它们推导出哪些类。注意，我对 `object`\
  \ 一词的使用与某些使用该术语指代类实例的文本不同。\n\n**在此阶段不要纠结属性分配或关系。** 属性分配和关系很重要，但过早识别它们会让你陷入过多的细节中，并导致团队频繁偏离主题。现在，尝试不要担心流程；而要关注数据组织。\n\
  \n**在识别对象时，记录持久化需求。** 某些类代表了应用程序需要存储的数据（通常在数据库中），这些类被称为持久化对象。事实上，持久化对象经常作为数据模型中的实体出现。当在对象模型中识别时，我经常会将具有持久数据的对象记录为数据模型中的实体。我将在第\
  \ 7 章详细讨论数据建模。\n\n**在此阶段识别的对象是高层级的。** 你将在过程的后期对它们进行进一步的细化和扩展，利用对象来确定具体的类。\n\n###\
  \ 对象识别示例\n\n让我们使用一个我最近实现的报告系统的示例改写示例。该团队定义了以下用例：\n\n* 系统将提供一个接口，从现有的 MVS/CICS 应用程序接受报告模板定义。报告模板由一个\
  \ ID、一个名称、运行模板所需的参数列表以及模板产生的数据项列表组成。\n* 系统将允许应用程序管理员控制属于某个信任客户组织的用户可以运行的报告模板。\n\
  * 系统运行报告的速度平均至少不慢于其前系统。\n* 系统将把所有信任客户用户的报告数据限制在其所属的信任客户组织范围内。\n* 系统将允许银行支持用户使用任何信任客户组织的数据执行所有报告模板。\n\
  \n\n\n\n按顺序查看用用例中的名词（忽略前面提到的 `system`），我们得到了在表 6.1 第一列中列出的列表。\n\n### 表 6.1：对象识别示例\n\
  \n| 名词（来自用例例） | 对象 |\n| :--- | :--- |\n| 接口 | `ReportTemplateInterface` |\n| 报告模板\
  \ | `ReportTemplate` |\n| 参数列表 | `ReportTemplateParameter` |\n| 数据项 | `ReportDataItem`\
  \ |\n| 应用管理员 | `ApplicationAdministrator` |\n| 信任客户组织 | `TrustCustomerOrganization`\
  \ |\n| 信任客户用户 | `TrustCustomerMember` |\n| 报告数据 | `Report` |\n| 银行业支持用户 | `BankingSupportUser`\
  \ |\n\n接下来，我们对这些名词进行了重命名，使其成为自包含的对象名称，如表 6.1 所示。我所说的“自包含”是指对象名称不应依赖上下文来提供含义。例如，第一个用例中的\
  \ `interface` 变成了 `ReportTemplateInterface`，而 `list of parameters` 变成了 `ReportTemplateParameter`。我们的用例提到参数的“列表”这一事实被记录为一种关系。对象名称越具描述性越好。除了\
  \ `ReportTemplateInterface` 之外，所有对象都是持久化的。（注意，此用例中的 `interface` 一词指的是应用接口，可能并不意味着要使用\
  \ Java 接口结构。）\n\n列表中出现了三种用户：应用管理员、信任客户成员和银行业支持用户。当我们进行属性归类时，我们意识到还有另一个对象 `User`，它具有不同的子类型。这种继承关系在进行属性归类时更容易被识别，因此让我们暂时保持对象列表不变。\n\
  \n除了仅仅识别名词外，另一种替代方案是先进行数据建模练习。所有识别出的实体都是良好的对象候选者。我们在示例中识别出的许多对象也是很好的实体候选者。详情请参见第\
  \ 7 章。\n\n这些对象中的一些被实现为应用程序多个软件层中的类。这一过程是下一节的重点。定义和说明这些层已经在第 5 章中描述。\n\n# 将对象转换为类\n\
  \n一旦你确定了应用程序中的主要对象，就需要将这些对象细化为类并在框架中组织它们。\n\n**在识别对象后，你需要确定它们属于哪些层。** 对象具有多个角色是常见现象。任何你识别为扮演多个角色的对象（例如管理数据访问、实现业务规则等）都必须在多个层中拥有对应项。例如，表\
  \ 6.1 中的 `ReportTemplate`、`ReportTemplateParameter` 和 `ReportDataItem` 既有持久化需求，也有作为业务对象的需求。因此，它们至少出现在数据访问层、业务对象层和实体层的类中。\n\
  \n**在每一层中为每个对象定义单独类。** 如果你为这些角色中的每一个角色定义相同的类，类将变得太大而无法有效维护，并且你会失去软件分层的所有优势。\n\n\
  从对象识别示例来看，考虑对象 `ReportTemplate`。位于数据访问层的类 `ReportTemplateDAO` 负责使用关系型数据库读写模板信息。实体层中的\
  \ `ReportTemplateEntity` 描述了报告模板的所有特征（例如其名称、数据类型、显示长度等）。业务逻辑层中的 `ReportTemplateManager`\
  \ 协调并执行创建新报告模板的所有规则。`ReportTemplateManager` 协调报告模板信息、模板参数信息以及运行或编辑报告所需的任何其他信息。\n\
  \n# 确定关系\n\n`relationship`（关系）描述了不同类之间如何交互。你可以在识别出单个类后确定关系。UML 文档记录了对象关系的几大类。大多数应用程序只需要后续段落描述的四种类型。\n\
  \n**依赖（使用，uses）关系**描述一个类使用了另一个类。在代码级别，`using` 另一个类意味着以某种方式引用该类（例如声明、实例化等）。由于这种关系类型与关联关系类型非常相似，我通常忽略这两种类型之间的区别，认为其是不必要的复杂性。图\
  \ 6.1 中的关系读作“客户使用账户”。\n\n### 图 6.1：依赖关系图\n\n![Chap-6-Dependency-relationship-ClassDiagram.eps](img/00019.jpeg)\n\
  \n**泛化（扩展，extends）关系** 描述一个类扩展了或继承了另一个类的特征。大多数中大型应用程序都有若干这种类型的关系。\n\n扩展（extends）关系由一条带有空心箭头的实线表示。图\
  \ 6.2 中从 `TrustCustomer` 发出的关系读作“TrustCustomer 扩展自 Customer”。`Customer` 的属性将在所有子类中可用且可使用。\n\
  \n### 图 6.2：扩展关系图\n\n![Chap-6-Extends-relationship-ClassDiagram.eps](img/00020.jpeg)\n\
  \n**实现（implements）关系** 描述一个类实现了一个接口。实现（implements）关系由一条带有空心箭头的虚线表示。图 6.3 中的关系读作“E-mailDeliveryType\
  \ 实现了 ReportDeliveryType”。\n\n### 图 6.3：实现关系图\n\n![Chap-6-Implements-relationship-ClassDiagram.eps](img/00021.jpeg)\n\
  \n**聚合（收集，collects）关系** 描述一个类收集了某个类的多个实例。聚合（collects）关系由执行收集的类旁边的带有菱形的实线表示。图 6.4\
  \ 中的关系读作“客户收集账户”。\n\n### 图 6.4：收集关系图\n\n![Chap-6-Collects-relationship-ClassDiagram.eps](img/00022.jpeg)\n\
  \n**不要对值对象或实体对象记录正式关系。** 值对象和实体的关系非常多，如果记录下来，模型将变得不可读且不可用。毕竟，创建类图的目的是让团队更容易理解和实现。无论如何，VO\
  \ 的关系很容易从方法签名中推出来。\n\n# 识别属性\n\n属性是类包含的字段。在代码级别，属性是实例级变量声明。大多数属性出现在 VO 中，其他对象类型的属性较少。\n\
  \n理想情况下，属性应该是基础的，而不是派生的。`基础属性`是原子的——即其值不是来自其他元素的值或计算的结果。相反，`派生属性`是由其他元素组成的。例如，考虑一个\
  \ `CustomerVO` 类，它有 `firstName`、`lastName` 和 `fullName` 属性。`fullName` 属性是派生的，因为它由姓和名组成。\n\
  \n**避免声明派生属性。** 派生属性（如上文提到的 `fullName`）只会增加维护工作。如果客户更改姓，两个属性的值都需要更改。与其将 `fullName`\
  \ 设为属性，不如创建一个方便的方法（如 `getFullName()`）来完成拼接。\n\n\n\n\n\n从用户操作开始，我使用原型中的界面来驱动方法的识别。以应用程序登录为例。大多数应用程序都会根据用户的身份和偏好来定制主界面。目前，假设授权和身份验证是由企业级架构提供的，而不是在在应用层提供。进一步假设你需要调用某些方法来从安全包中获取用户特定信息，调用某些方法来检索该用户的选项设置，并显示应用程序的主页面。\n\
  \n如果你使用 `Struts`，你需要某种动作类（action class），它能够从安全包中获取用户特定信息，并使用该包查找客户偏好（这些偏好将用于生成主页面）。如果你还没有确定执行此操作的动作类，请将其添加到模型（model）中。忽略安全包本身（因为它不在范围范围内），你仍然需要在某处编写一个允许查找用户偏好的方法。\n\
  \n回想我们在第 5 章中讨论的软件分层，表示层中的类使用业务逻辑层类，而不是直接使用 `DAOs`。大多数应用程序会识别一个用户对象（或类似对象），该对象体现为一个\
  \ `DAO` 类、实体类（entity class）和一个业务对象。在我们的用户业务逻辑层类中添加一个 `findById(String userId)` 方法是符合逻辑的。该方法结果返回一个包含偏好信息的\
  \ `UserEntity` 也是符合逻辑的。\n\n传递和返回 `VOs` 或实体，而不是单个数据项。这样做可以减少方法调用之间传递的参数数量，并使代码更具读性。\n\
  \n用户偏好的物理查找通常委托给至少一个 `DAO`。拥有一个具有 `findById()` 方法的 `UserDAO` 来执行查找是符合逻辑的。\n\n到这里，你可能在想为什么不直接让\
  \ `Action` 类调用 `DAO`。这看起来更简单，因为可以去掉了几层类，而在本例中，这些类似乎对产品功能的贡献很小。从技术上讲，你可以让 `Action`\
  \ 类直接调用 `DAO`，但这样做会大大增加 `Action` 类的复杂度，使其难以调试，并且会消除上一章中讨论过的软件分层带来的隔离益处。\n\n图 6.5\
  \ 展示了上述示例的类模型。\n\n图 6.5：对象模型示例\n\n![Chap-6-Object-Model-ClassDiagram.eps](img/00023.jpeg)\n\
  \n### 捷径\n\n多年来，我采用了一些捷径，以减少对象建模阶段所需的时间和精力。\n\n- **假设所有记录的属性都具有访问器（get 方法）和变异器（set\
  \ 方法）。** 这简化了模型并消除了许多无聊的重复工作。它也让模型更易读，因此更有用。例如，如果你记录了 `CustomerVO` 类有一个 `lastName`\
  \ 属性，你应该能够假设存在 `getFirstName()` 和 `setFirstName()` 方法，而无需在模型中显式地记录它们。\n\n- **省略与\
  \ JDK 内部对象的关系。** 包含这些关系增加的价值很小，但会增加大量复杂度，使模型难以阅读。例如，JDK 中的许多属性都是字符串。从技术上讲，任何包含字符串属性的类都应该与\
  \ `java.lang.String` 类有关系。在典型的应用程序中，记录这些类型的关系会为你的模型增加成百上千条条关系，且没有任何益处。\n\n- **忘记从\
  \ UML 生成代码这回事。** 根据我的经验，这通常是时间上的净损失。你在模型中必须输入的分钟级细节，通常超过了使用任何集成开发环境（IDE）编写代码所需的时间。相比之下，如果你的\
  \ IDE 支持，从现有代码生成 UML 可以极具价值且易于实现。\n\n- **在确定方法时不要尝试微管理代码实现。** 给开发者留一些工作空间。如果开发团队开始记录私有方法，那就做得过头了。\n\
  \n### 示例：Admin4J\n\nAdmin4J ([www.admin4j.net](http://www.admin4j.net)) 是一个开源产品，为支持人员提供基本的\
  \ Java EE 应用程序管理和支持功能。它的功能之一是跟踪和总结应用程序生成的异常，以便轻松识别和优先处理正在发生的应用程序问题。为了公开透明，我是 Admin4J\
  \ 项目的提交者。\n\n取自 Admin4J 项目网站的该功能的详细描述如下：Admin4J 跟踪所有记录的异常，并合并和总结所有“相似”的异常。目前跟踪了使用\
  \ `Log4J` 和 `JDK Logging` 记录的异常。根据用户需求添加额外的日志器。\n\n### 显示功能\n- 异常按发生频率从高到低排序。\n\
  - 异常被持久化，并在容器回收后依然存在。\n- 管理员可以删除他们认为过时且不再发生的异常。\n- 异常统计涵盖的时间范围可以配置（默认为三十天）。\n\n\
  除了这些显性要求外，还有几个隐性要求需要注意。此功能需要易于安装。如果安装过程难以理解或步骤过多，可能不会被使用；大多数开发者都是非常忙碌的人。其次，此功能对性能的影响必须尽至最低。理想情况下应用程序很少抛出异常，但事实并非如此。如果此功能意外对端用户造成了实质性的性能影响，将被立即卸载。\n\
  \n尽管这些功能集并不是以用例（use cases）的形式编写的，但它们传达了用例中的大部分信息，并可以用类似的方式使用。在上一章讨论的软件分层框架范围内检查此功能集，我们可以开始将这些功能与相应的软件层关联。\n\
  \n我通常从识别在数据访问层、业务逻辑层和表示层之间传递的实体类开始。由于实体类是存储的且通常是名词，与此功能集最容易识别的实体是 `Exception`。由于\
  \ JDK 名称已被占用，且需要存储的信息实际上是该异常的信息和统计，因此实体被命名为 `ExceptionInfo`。如果我们看图 6.6 中的截图，关于异常保留的特定信息如下：\n\
  \n- 类名\n- 最后一次发生的消息\n- 跟踪的异常总数\n- 首次和最后一次发生的日期\n- 关联的栈跟踪\n\n这预示了下一章的内容，但在此时进行数据建模练习是合适的。正如下一章所解释的，数据模型将使识别实体类变得非常简单。\n\
  \n\n\n\n实体层的对象模型可以在图 6.6 中找到。注意，我 `assumed` 了访问器（accessors）和变异器（mutators）的存在，而没有对它们进行直接建模。此外，我通常不会直接对\
  \ `JDK` 中的类以及它们的关系进行建模，但这种特定的关系很重要，是开发者理解该设计所需要的。此外，`StackTraceElement` 实际上是一个值对象，并不像\
  \ `java.lang` 包中大多数其他类那样无害。\n\n### 图 6.6：Admin4J 异常功能实体层类图\n\n![Chap-6-Admin4J-Exception-Entity-Admin4JClassDiagram.eps](img/00024.jpeg)\n\
  \n确定了相关的实体类后，我们可以开始为数据访问层建模。持久化的功能需求并没有具体指定存储机制。事实上，唯一的要求是产品在容器回收之间要记住异常统计信息。虽然我们以后可能想提供额外的报告功能，但显示需求并没有表明有任何类型针对异常统计的灵活搜索需求。看起来我们真正需要做的仅仅是对异常统计信息进行批量读写。\n\
  \n取决于异常统计信息有多大，频繁地进行批量读写 `might` 对某些用户来说是一个负担。鉴于此，我们决定将读取和写入活动与异常的捕获日志活动分离。也就是说，我们决定在与运行用户工作的线程独立的线程中执行读写活动。我们不希望通过存储用于后续分析的异常统计信息来减慢用户活动。\n\
  \n此外，我们希望将 `Admin4J` 的资源消耗降至最低。在每次更新后重写异常统计可以确保统计数据是最新的，但在抛出大量异常的情况下，资源消耗将很大。作为一种折中，我们决定在可配置的间隔持久化异常统计信息。这将允许用户有效地平衡资源消耗与持久化当前统计信息的需求。由于这一决定，数据访问层只需要批量读写异常统计信息；不需要单个读写操作。\n\
  \n对于像这样的软件包，最小化依赖列表始终是一个考虑因素。考虑到这一点，我们决定在第一个发布版本中使用 `XML` 作为存储机制，并为未来的其他存储机制留空间。虽然这种选择没有提供某种关系数据库的灵活性，但它减少了对第三方数据库软件的依赖，同时也减少了安装工作。鉴于已经决定支持多种存储机制，采用完整的数据访问对象（DAO）模式是合适的。\n\
  \n通常，数据访问类是实体类的工厂，并且通常实体类与数据访问对象接口之间存在一一对应的关系。该功能的数据访问层对象模型可以在图 6.7 中找到。\n\n###\
  \ 图 6.7：Admin4J 异常功能数据访问层类图\n\n![Chap-6-Admin4J-Data-Access-Admin4JClassDiagram.eps](img/00025.jpeg)\n\
  \n在实体类模型的这一阶段，我们已经有了一个组织异常统计信息的计划，以及一个正在跟踪的特定统计属性列表。通过数据访问层的模型，我们理解了应用程序这部分的输入/输出将如何工作。我们还没有对\
  \ `Admin4J` 中实际检查已记录异常、分析它们以查看哪些异常与之前记录的异常相同并更新相关统计信息的部分进行建模。我们还提到了在可配置的间隔存储异常信息的决定，以保持低资源利用率。这一活动发生在业务逻辑层。对于这样的产品，逻辑层的性质比你在大多数\
  \ `Java EE` 中发现的逻辑更具技术性。`Admin4J` 业务逻辑层的类图可以在图 6.8 中找到。\n\n让我们先从逻辑层所需的初步类列表开始。需要某些东西来分析生成的异常，确定此类异常是否之前被观察到过，并更新与该异常相关的统计信息。在没有更好术语的情况下，我们将执行此操作的类称为\
  \ `ExceptionTracker`。\n\n根据计划的功能集，`ExceptionTracker` 需要方法来启动对异常的“跟踪”并检索异常统计信息。此外，为了支持“管理员可以删除他们认为过时且不再发生的异常”的功能，还需要一个删除现有异常引用的方法。由于异常统计信息是持久化的，因此\
  \ `ExceptionTracker` 将依赖数据访问层。\n\n在这一层级，我们还需要制定一个观察已记录异常的计划。如何实现这一点更多地取决于日志产品而非其他因素。对于\
  \ `Log4J`，观察已记录异常的最简单方法是实现一个 `Log4J Appender`。这通过扩展名为 `AppenderSkeleton` 的 `Log4J`\
  \ 类来实现。图 6.8 中的 `Log4JExceptionAppender` 类就实现了此功能。理，该类将依赖 `ExceptionTracker` 来分析异常并更新异常统计信息。\n\
  \n关于集成在 `JDK` 中的日志框架，可以通过扩展 `Handler` 类（`java.util.logging`）来观察异常。图 6.8 中的 `JdkLoggingExceptionHandler`\
  \ 类实现了此功能。理，该类将依赖 `ExceptionTracker` 来分析异常并更新异常统计信息。\n\n我们还需要一个计划来支持在单独线程中发生的工作（例如，按可配置间隔定期存储异常统计信息并清理过期的异常统计）；我们需要一个守护线程来进行此类工作。在类图中，我们将该类命名为\
  \ `ExceptionTrackerCleanupTask`。该类利用了 `Admin4J` 其他部分的通用守护类。这些信息超出了我们建模部分的范围，未包含。重要的是我们已经确定了执行此工作的类，以及它在守护线程中运行。\n\
  \n按可配置的时间间隔持久化统计信息的决定意味着可能会丢失从上一次持久化到 `JVM` 关闭期间生成的异常。为了尽可能地减少信息丢失，我们实现了一个在正常关闭时执行的关闭钩子。该钩子将持久化统计信息并终止。如果\
  \ `JVM` 进程被杀死或发生其他非正常关闭，我们仍然会丢失信息。\n\n### 图 6.8：Admin4J 异常功能业务逻辑层类图\n\n![Chap-6-Admin4J-Business-Logic-Admin4JClassDiagram.eps](img/00026.jpeg)\n\
  \n此时，从建模的角度来看，剩下的只有表示层了。由于 `Admin4J` 是一个通用工具，我们无法假设任何表示框架的存在，如 `Struts`、`Java Server\
  \ Faces`、`Wicket` 或其他任何。我们也不希望给用户带来巨大的配置工作。与此同时，在 servlet 代码中编写和维护用户显示逻辑是枯燥且耗时的。\n\
  \n\n\n\n为了最小化我们的依赖项和配置开销，同时提供一些基本的展示能力，我们采用了 Freemarker（[`freemarker.sourceforge.net/`](http://freemarker.sourceforge.net/)）作为显示机制。我们对它的使用进行了配置，使得我们使用的所有模板都源自\
  \ `Admin4J` jar 包。我们不希望用户将模板或单个 JSP 文件复制到应用程序的 web 根目录下。\n\n这种展示方法要求用户在应用程序的 `web.xml`\
  \ 文件中注册 servlet。由于 `Admin4J` 的所有显示页面都遵循相似的架构，我们担心注册 servlet 的要求会变成一种负担。为了解决这个问题，我们创建了一个主页\
  \ servlet，其中包含了指向所有 `Admin4J` 页面的链接，包括我们在本示例中讨论的异常统计显示页面。用户只需要注册一次主页 servlet，所有其他页面都将自动处理。当然，如果用户不想安装所有的\
  \ `Admin4J` 功能，仍然可以单独安装页面，但那是用户的决定。\n\n`ExceptionDisplayServlet` 负责异常统计显示页的显示。`ExceptionDisplayServlet`\
  \ 继承自 `AdminDisplayServlet`，后者提供了基础的管道代码，用于从 `Freemarker` 模板生成输出并将生成的内容写入用户的浏览器。这两个\
  \ servlet 都依赖于 `Admin4JServlet` 类中包含的功能，该类处理所有 `Admin4J` 功能的基础配置任务。\n\n`Admin4J`\
  \ 此部分展示层的类图可以见图 6.9。\n\n图 6.9：Admin4J 异常功能展示层类图\n\n![Chap-6-Admin4J-Exception-Presentation-Admin4JClassDiagram.eps](img/00027.jpeg)\n\
  \n在读者查看完这个示例后，我预计会有几个后续问题。\n\n**我需要对所有应用程序的每个部分进行如此详细的建模吗？很有可能这类模型通常不会随着时间的推移而更新。**\
  \ 因此，它们对于初始开发工作具有最大的价值。建模的量应该足以支持初始开发工作即可。\n\n此外，让我们把“建模”与在建模工具或图形设计软件包中记录该模型的行为区分来。对于具有丰富建模经验的人来说，后者通常比前者花费更多时间。在大多数项目中，我会在脑中构建模型，无论我是否将这些模型写下来作为与其他团队成员通信的机制。这能带来更简洁的代码和更易维护的应用程序。此外，它帮助我以更有组织的方式工作。\n\
  \n所需的模型文档的数量和质量取决于项目的复杂度、规模，以及项目中有多少开发者没有以前与你合作的经验。对于一个只有一或两个开发者的项目，需要的文档比拥有二十人开发团队的项目要少得多。事实上，对于只有一个开发者的项目，可能不需要正式的文档化对象模型。\n\
  \n此外，如果你与不熟悉你方法的开发者合作，他们将比以前与你合作过的人需要更多指导。对于我合作过几个项目的某个团队，我可以对实体层和业务逻辑层中最复杂的部分进行建模，而不正式记录该模型的其他部分。\n\
  \n实体层在很大程度上决定了数据访问层的组织结构。因此，一旦生成实体层模型文档，你可能不需要完全地记录数据访问层。一旦沟通了要使用的数据访问模式，它就可以应用于任何实体。例如，用于持久化\
  \ `Admin4J` 性能统计数据的数据访问层，在概念上与关于异常统计介绍的内容非常相似。\n\n如果你在开发项目中遇到一个难以建模的部分，这表明该应用程序部分的模型应该被记录并与开发团队进行讨论。如果对你来说很难，那么对其他人来说可能也很难，项目的所有开发者都应该达成共识，并理解正在构建的设计。此外，他人的观点和意见可能帮助你澄清问题和疑虑。\n\
  \n**你使用什么建模工具？我使用客户使用的工具。** 对于没有建模工具的人，我推荐 `ArgoUML`（[`argouml.tigris.org/`](http://argouml.tigris.org/)）。它是一个非常活跃的开源项目，我觉得它中等容易使用。事实上，本示例中\
  \ `Admin4J` 的对象模型是使用 `ArgoUML` 生成的。\n\n**你如何验证你的对象模型是正确的？** 很好的问题。我们没有编译器或其他可以验证对象模型的工具。测试方法之一是由开发者进行同行评审。与熟悉需求的人一起举行评审会议，并向他们提供对你模型的评审和解释。通常，其他人会有洞察力，并可能在之前指出缺陷或问题。此外，模型中的缺陷在构建过程中会变得明显。\n\
  \n**将你的模型与实际开发的代码进行比较。** 设计总会有细微的调整（例如添加属性、添加方法）。但如果所构建的基础类和软件类之间的关系与你的模型有显著差异，则可能表明模型存在缺陷。出于此原因，我通常参与构建阶段，以便我从错误中学习。\n\
  \n## 延伸阅读\n\nGamma, Erich, Richard Helm, Ralph Johnson, and John Vlissides. 1995.\
  \ *Design Patterns.* Reading, MA: Addison-Wesley.\n\n![stock-photo-17860137-binary-code-bw-horiz-slice.tif](img/00003.jpeg)\n\
  \n# 第 7 章\n\n## 创建数据模型\n\n大多数关于 Java EE 的书籍都跳过了开发中的数据建模和关系数据库设计阶段。但我发现这两个步骤对于 Java\
  \ EE 应用程序的成功至关重要。作为开发团队的一员，应用程序架构师应该具备建模的基础知识。此外，在某些公司，架构师负责设计应用程序数据库。（然而，我必须承认，作为数据库设计师和管理员的多年可能影响了我对数据建模重要性的看法。）\n\
  \n\n\n\n由于数据模型（以及由此数据库设计）对应用程序实体层的设计有巨大影响，糟糕的数据库设计将带来编码问题和困难。我曾见过糟糕的数据库设计导致应用程序代码生成量和复杂性的增加。随着复杂性的增加，通常会伴随着\
  \ bug 报告频率的提高，以及诊断和修复这些 bug 所需资源的需求。确保开发者正在使用高质量的数据模型（以及由此产生的数据库设计）应该是应用程序架构师的重中之重。\n\
  \n此外，我发现数据建模概念在设计 XML 文档格式（如 DTD 和 schema）时非常有用。将数据建模概念应用于 XML 文档设计有一点不符合常理。决定一个数据项是元素还是属性的思维过程，与在数据建模中在实体和属性之间做出决定非常相似。此外，数据建模中的一对多关系直接对应于\
  \ XML 文档中的子元素概念。我将在本节中提供一些细节和示例，展示你如何将数据模型实现为 XML 文档格式。\n\n尽管 NoSQL 数据库的普及近年来日益增长，但我没有看到任何关系型数据库技术很快会被取代的迹象。NoSQL\
  \ 数据库针对的是极大型数据存储，这些存储不具备关系型数据库所拥有的事务保证。换句话说，NoSQL 数据库适用于接受近似答案的场景。此外，由于 NoSQL 产品差异巨大且优劣悬殊，任何关于设计\
  \ NoSQL 数据库的建议往往倾向于特定产品。我见过的关于记录 NoSQL 数据库通用数据建模技术的最佳尝试是这篇文章：`http://highlyscalable.wordpress.com/2012/03/01/nosql-data-modeling-techniques/`。目前，由于关系型数据库是大多数\
  \ Java EE 应用的一部分，大多数应用程序架构师至少需要对关系型数据建模概念有一定的了解。本章的其余部分将重点关注关系型数据库。\n\n如果你对数据建模比对象建模更熟悉，可以放心地在对象建模之前进行数据建模活动，从而选择更简单的路径。数据模型中的所有\
  \ `entities`（在下一节中定义）都是实体层中类的潜在标识。尽管这两个建模学科使用了不同的术语，但它们在概念上是非常相似的。\n\n## 核心术语与概念\n\
  \n`entity`（实体）是你想要保留其信息的对象，因此它代表了持久化的信息（即写入介质的信息）。通常，实体是一个名词。虽然大多数实体都实现为数据库表，但 `entity`\
  \ 和 `table` 并不是同义词。实体是一个纯粹的逻辑构造，它在对象建模中最接近的对应物是类。实体的良好示例有客户、账户、用户、客户订单和产品。\n\n在关系型数据库中，实体被实现为表。当你将数据模型实现为\
  \ XML DTD 或 schema 时，每个实体都变成一个元素。\n\n`entity occurrence`（实体实例，有时缩短为 occurrence）是实体的一个实例。如果你对对象建模更熟悉，可以认为实体实例类比实例化一个类。如果你无法抑制将实体和表等同的冲动，可以把实体实例视为表中的行。而对于\
  \ XML 用户来说，实体实例就像 XML 文档中的单个元素。\n\n`attribute`（属性）是实体的的一个特征。虽然属性可以是名词，但它们在离开实体的语境后通常没有意义。例如，`CUSTOMER`\
  \ 实体的属性可以是 `CUSTOMER_ID`、`FIRST_NAME`、`LAST_NAME`、`STREET_ADDRESS`、`CITY`、`STATE`\
  \ 和 `ZIP_CODE`。属性应该是原子的——也就是说，它们应该是自包含的，并且不是从其他属性的值派导出。\n\n`primary key`（主键）是实体中的一个属性或属性组合，用于唯一标识一个实体实例。例如，`CUSTOMER_ID`\
  \ 是 `CUSTOMER` 实体的良好主键，而 `ACCOUNT_NUMBER` 和 `ORDER_NUMBER` 结合在一起就是名为 `CUSTOMER_ORDER`\
  \ 的实体的良好主键。\n\n每个条目都必须有一个主键。如果碰巧没有一种属性组合能唯一标识一个实体实例，就创建一个属性作为键。例如，大多数制造商都会为其产品分配唯一的标识符（UPC\
  \ 码）；但当他们没有这样做时，你可能需要伪造产品标识符作为主键。\n\n`relationship`（关系）是两个实体之间的关联。在许多类型的关系中，有三种是常用的：一对多、多对多以及超类型/子类型。在\
  \ `one-to-many`（一对多）关系中，一个实体的实例与另一个实体的多个实例相关联。例如，一个客户可以拥有多个账户或下多个订单。通常，具有单个实例的实体被称为\
  \ `parent`（父实体），具有多个实例的实体被称为 `child`（子实体）。图 7.1 展示了一对多关系。\n\n### 图 7.1：一对多关系 ER\
  \ 图\n\n![Chap-7-One-to-Many-Relationship-Example.eps](img/00028.jpeg)\n\n注意图中，`ACCOUNT`\
  \ 实体包含了 `ACCOUNT_TYPE` 和 `CUSTOMER` 实体的主键 (PK) 列。`ACCOUNT` 中的每个额外列都是外键 (FK)。外键是相关实体的主键，实体利用它们进行查找。。外键的存在是创建一对多关系的隐含结果。例如，给定一个\
  \ `ACCOUNT` 实例，很容易确定相关的 `CUSTOMER` 和 `ACCOUNT_TYPE` 信息。\n\n一些数据建模工具提供了实体之间的多对多关系。在\
  \ `many-to-many`（多对多）关系中，每个实体与另一个实体都存在一对多关系。例如，客户订单可以包含多个产品，而每个产品可以被多个客户购买。通常将多对多关系重写为两个独立的一对多关系，并定义一个新实体作为交叉引用。图\
  \ 7.2 是多对多关系的示例。\n\n### 图 7.2：多对多关系\n\n![Chap-7-2-ManytoMany.eps](img/00029.jpeg)\n\
  \n在 `super-type/sub-type`（超类型/子类型）关系中，实体对另一个实体的定义完善与 Java 世界中的继承非常相似。例如，在银行业中，客户实体对于一家拥有信托客户、私人银行客户、企业客户、经纪客户等的银行来说可能太通用了。在\
  \ Java 世界中，这完全可以被建模为 `inheritance`（继承）关系，银行客户由扩展 `Customer` 的类表示（如 7.3a 所示）。\n\n\
  ### 图 7.3a：继承关系\n\n![Chap-7-3-Inheritance-Diagram.eps](img/00030.jpeg)\n\n使用数据建模术语，我们会识别一个超类型\
  \ `Customer` 实体。我们还会识别 `Banking Customer`（银行客户）、`Mortgage Customer`（抵押贷款客户）和 `Brokerage\
  \ Customer`（经纪客户）为子类型。`Customer` 实体包含了三个子类型共有的属性。每个 `Customer` 实例在其中一个子类型实体中仅有一个对应的实例。术语不同，但其概念与\
  \ Java 端的继承关系非常相似。\n\n\n\n超类/子类关系可以通过两种方式进行物理实现。它们可以表示为独立的实体，也可以合并为一个实体。图 7.3b 展示了这种类型的关系。请注意，示例中的关系都是一对一的，且都是可选的。请注意，所有实体共有的属性被分配给\
  \ `Customer` 实体，而子类实体则包含特定于其类型的属性。\n\n### 图 7.3b：以独立实体表示的继承\n\n![Chap-7-3b-Inheritance-SeparateEntities.eps](img/00031.jpeg)\n\
  \n实现超类/子类关系的第二种方案是将所有实体合并为一个。通过这种方法，`Customer` 实体包含了所有四个实体的所有属性，并带有一个“类型”字段（例如 `Customer\
  \ type`），用以指示该行代表的是哪种类型的实体。例如，如果 `Customer type` 为 `Banking`，则该实例是一个银行客户，只有与银行客户相关的属性（`ONLINE_ACCESS_ALLOWED`、`CUSTOMER_ID`、`FIRST_NAME`\
  \ 和 `LAST_NAME`）具有值。这种实现的插图可以在图 7.3c 中找到。\n\n### 图 7.3c：以合并实体表示的继承\n\n![Chap-7-3c-InteritanceExpressed.eps](img/00032.jpeg)\n\
  \n许多开发者倾向于以此方式合并超类和子类，因为这减少了实体和关系的数量。然而，使用这种模式会导致哪些属性适用于哪些子类在模型中并没有记录，可能会在实现过程中导致困惑。\n\
  \n实体可以与其自身建立关联。这被称为*递归*关系。例如，考虑一个以 `EMPLOYEE_ID` 为主键的 `EMPLOYEE` 实体。可以使用递归的一多关系来指示每位员工的经理。由于这种关系，将使用一个外键（例如\
  \ `MANAGER_ID`）来将员工与其经理进行交叉引用。\n\n## 设计实践与范式\n\n范式（Normal form）是一组引导你识别实体和关系的规则。事实上，范式有许多不同的程度；但在实践中，第三范式（3NF）是最经常使用的。因此，我将这里的讨论限制在第三范式。如果你对其他范式感兴趣，我推荐参考\
  \ Date (2003)。\n\n要符合第三范式，实体必须满足三个条件：\n\n*   所有重复的属性组都应该删除并放在单独的实体中。\n*   所有非键属性应该只依赖于主键。\n\
  *   所有非键属性都应该依赖主键中的每一个属性。\n\n假设 `CUSTOMER` 实体拥有属性 `ADDRESS_LINE_1`、`ADDRESS_LINE_2`、`ADDRESS_LINE_3`\
  \ 和 `ADDRESS_LINE_4`。从技术上讲，这样的实体不符合第三范式，因为它重复组并违反了条件 1。图 7.4a 展示了这种错误做法的示例，图 7.4b\
  \ 展示了可能的修正。\n\n### 图 7.4a：违反第三范式的第一个条件\n\n![Chap-7-4a-Violation.eps](img/00033.jpeg)\n\
  \n### 图 7.4b：修正后的违反\n\n![Chap-7-4b-ViolationCorrected.eps](img/00034.jpeg)\n\n假设\
  \ `ACCOUNT` 实体包含属性 `ACCOUNT_BALANCE`。这不符合第三范式，因为它违反了条件 2。`ACCOUNT_BALANCE` 完全依赖于未完成的订单、订单上的行项目以及已支付的款项——这些都是其他实体项。`ACCOUNT_BALANCE`\
  \ 的另一个问题是它不是原子的。`ACCOUNT_BALANCE` 是根据之前的订单和客户付款计算的。由于 `ACCOUNT_BALANCE` 是完全派生的，它不应该物理地存储在数据模型中。\n\
  \n假设 `CUSTOMER_ORDER` 实体（其主键由 `ACCOUNT_NUMBER` 和 `ORDER_NUMBER` 组合）拥有属性 `ACCOUNT_NAME`\
  \ 和 `ADDRESS_INFORMATION`。从技术上讲，这不符合第三范式，因为这些属性与账户有关而非特定订单有关，这违反了条件 3。图 7.5a 展示了违反第三范式的订单，图\
  \ 7.5b 展示了修正后的版本。\n\n### 图 7.5a：违反第三范式的第三个条件\n\n![Chap-7-5a-Violation-ThirdCondition.eps](img/00035.jpeg)\n\
  \n### 图 7.5b：修正后的违反\n\n![Chap-7-5b-Violation-Corrected.eps](img/00036.jpeg)\n\n\
  在关系数据库早期，第三范式被认为是低效的，为了性能而进行“反范式化”（denormalization）是非常常见的。尽管经历了数十年的技术进步，仍有相当比例的开发者认同这种观点。通常给出的理由是连接（joins，在规范化数据库中发生更频繁）是低效的。\n\
  \n反范式化的主要副作用是在更新时需要额外的代码和处理，以保持所有复制和派生数据的同步。在上面的示例中，如果你在客户订单中包含账户信息以“反范式化”并消除两个表之间进行连接查询的需求，那么你实际上为每个订单复制了一次账户信息。当账户信息发生变化时，订单上的信息也必须跟着更改。\n\
  \n如今，连接是高效的，反范式化应该是稀有事件。如果你想为编写临时查询以调查缺陷报告的支持开发人员简化查询，可以为此创建一系列视图（views）。\n\n###\
  \ 创建数据库模式定义\n\n通常，数据库管理员使用数据模型为团队其他成员创建关系数据库模式。大多数数据库管理员使用建模工具来完成这项工作。遗憾的是，用于创建模式的开源工具很少。虽然这个过程比我在这里说明的要复杂一些；但在合格数据库管理员的帮助下，你可以使用以下核心算法创建模式：\n\
  \n1.  将每个实体直接转换为表。实体的所有属性变成表的列。显式地定义每个表的主键。\n2.  在每个一对多关系的子实体中分配外键。记住，外键是另一个实体的主键，以便匹配不同实体之间的数据。例如，`CUSTOMER_ID`\
  \ 将作为外键出现在 `ACCOUNT` 表中，以便能够通过 SQL 连接将账户与特定客户关联。对所有外键建立索引是促进查询连接的好主。\n3.  通过添加关联表和两个一对多关系来重写每个多对多关系。关联表的主键由两个外键组成。例如，回看图\
  \ 7.2 查看 `CUSTOMER` 和 `PRODUCT` 之间的多对多关系。这通过创建一个新表（例如 `CUSTOMER_LINE_ITEM`）来关联客户和产品来实现。\n\
  \n## 常见的数据库设计错误\n\n**出于习惯进行数据库反范式化。** 反范式化意味着复制信息以避免查找并提高性能。因此，如果副本不同步，反范式化可能会引入维护问题。\n\
  \n\n\n\n# 为了编程方便而放弃数据库完整性约束。有些开发者喜欢关闭表与表之间的外键关系。最初不使用数据库完整性约束可以节省时间，因为它允许无效的插入、更新和删除。但我发现，你花费的时间比节省的时间多得多，因为你最终不得不处理由缺陷的插入、更新和删除引起的漏洞。越早发现漏洞，修复起来越廉价、越容易。\n\
  \n# 尝试使用关系型数据建模概念来设计 NoSQL 数据库。本章描述的数据建模概念仅适用于关系型数据库。大多数 NoSQL 数据库的设计并未支持关系型数据库旨在处理的各种查询和关系。\n\
  \n## 提高你的数据建模技能\n\n### **找一个导师。** 选择一个你尊重其数据建模技能的人来审查你当前任务的模型。通常，项目之外的人员可以提供更客观的观点。除非经理另有要求，否则可以私下进行。\n\
  \n### **对你支持的应用程序进行关系型数据库审计。** 你看到了哪些错误？是否存在违反第三范式的情况？是否存在反规范化或数据重复的情况？如果有机会，你会对这里的哪些内容进行不同的建模？请记录下这些项目。你可能没有机会修复你发现的错误，但你可能可以在未来的任务中避免犯同样的错误。\n\
  \n### 创建 XML 文档格式\n\n除了用于数据库设计外，数据建模技术也可以很容易应用于设计 XML 文档。数据库管理员用于创建物理数据库设计的相同数据模型也可以轻松转换为\
  \ XML 文档格式，例如 DTD 或 schema。XML 通常用作应用程序之间通信的手段。\n\n创建任何 XML 文档的第一步是识别文档根节点。XML 文档通常包含数据模型中识别的项列表。例如，`<customer-update>`\
  \ 文档可能包含一组包含已信息的客户相关元素。`<purchase-order>` 文档可能包含一组描述一个或多个购买订单内容的订单相关元素。\n\n### **数据模型中的实体翻译为\
  \ XML 文档中的元素。** 仅为你正在创建的文档实现所需的元素。很可能不需要将所有实体都翻译为元素。表示小型查找值值域的实体（例如 `CUSTOMER_TYPE`、`ACCOUNT_TYPE`\
  \ 等）通常实现为 XML 文档中的属性，而不是元素。\n\n### **实体的属性变成对应元素的属性。** 例如，图 7.1 中的 `<customer>`\
  \ 将具有属性 `customer-id`、`last-name`、`first-name` 和 `telephone`。\n\n### **一对多关系意味着\
  \ XML 文档中的一个元素是另一个元素的元素。** 与关系型数据库不同，不需要指向父元素的外键，因为它通过分段祖缘关系指示。祖缘关系在 XML 语法中自然地指示。例如，图\
  \ 7.1 中的 `<customer>` 元素将有一个可选的 `<account>` 子元素。\n\n为了作为一个更完整的说明，列表 7.1 是图 7.1 数据模型的示例\
  \ XML 文档。\n\n#### 列表 7.1：XML 文档示例\n\n```xml\n<?xml version=”1.0” encoding=”UTF-8”?>\n\
  <customer-update>\n  <customer customer-id=”C123”\n    first-name=”Derek”\n    last-name=”Ashmore”\n\
  \    telephone=”999-990-9999”>\n    <account account-id=”A1”\n      account-name=”Personal\
  \ Checking”\n      account-type=”checking” />\n  </customer>\n</customer-update>\n\
  ```\n\n由于我们现在通常使用 schema 来描述 XML 格式，列表 7.2 包含了我们一直在讨论的文档的 XML schema。\n\n#### 列表\
  \ 7.2：XML Schema 示例\n\n```xml\n<?xml version=”1.0” encoding=”UTF-8”?>\n<schema xmlns=”http://www.w3.org/2001/XMLSchema”\n\
  \  xmlns:tns=”http://www.example.org/foo/”\n  targetNamespace=”http://www.example.org/foo/”>\n\
  \  <complexType name=”CustomerType”>\n    <sequence>\n      <element name=”account”\
  \ type=”tns:AccountType”></element>\n    </sequence>\n    <attribute name=\"\"customer-id”\
  \ type=\"\"string”></attribute>\n    <attribute name=\"\"first-name” type=\"\"string”></attribute>\n\
  \    <attribute name=\"\"last-name” type=\"\"string”></attribute>\n    <attribute\
  \ name=\"\"telephone” type=\"\"string”></attribute>\n  </complexType>\n  <complexType\
  \ name=”AccountType”>\n    <attribute name=\"\"accout-id” type=\"\"string”></attribute>\n\
  \    <attribute name=\"\"account-name” type=\"\"string”></attribute>\n    <attribute\
  \ name=\"\"account-type” type=\"\"string”></attribute>\n  </complexType>\n  <complexType\
  \ name=\"\"CustomerListType”>\n    <sequence>\n      <element name=\"\"customer”\
  \ type=\"\"tns:CustomerType”></element>\n    </sequence>\n  </complexType>\n  <element\
  \ name=\"\"customer-update” type=\"\"tns:CustomerListType”></element>\n</schema>\n\
  ```\n\n通过选择每个关系中的一个实体作为子元素来重写所有多对多关系。例如，考虑客户订单和产品之间的多对多关系。这种关系将重写为两个一对多关系，使用实体 `ORDER_LINE_ITEM`\
  \ 此交叉引用。`<order-line-item>` 元素可以是 `<order>` 或 `<product>` 元素的子元素，或者两者都是。很可能两者都不需要实现，且\
  \ `<order-line-item>` 被视为 `<order>` 的子元素。\n\n### 常见的 XML 设计错误\n\n### **将属性声明为元素。**\
  \ 我看到的最常见的 XML 设计错误之一是将本应为属性的数据元素变成元素。例如，在列表 7.1 中，某些开发者会将“account-name”作为一个一个独立的元素，而不是\
  \ `<account>` 的属性。这样误用元素可能会导致解析性能降低和更慢的 XSLT 转换。\n\n## 扩展阅读\n\nDate, C. J. 2003\\\
  . *An Introduction to Database Systems,* 8th ed. Boston: Pearson/Addison-Wesley.\n\
  \nFleming, Candace C., and Barbara von Halle. 1989\\. *Handbook of Relational Database\
  \ Design.* Reading, MA: Addison-Wesley.\n\n![stock-photo-17860137-binary-code-bw-horiz-slice.tif](img/00003.jpeg)\n\
  \n# 第 8 章\n\n## 构建规划\n\n好了，你读了章节标题，并在想：“应用程序架构师手册中关于项目规划的章节是干什么的？”但请记住：架构师的角色之一是为项目经理提供构建任务信息、完成顺序以及存在哪些依赖关系。而且现在，架构师经常被要求协助甚至履行项目经理的角色。\n\
  \n本章包含那些使用非敏捷方法论的人，这些方法论对项目规划更为相关。大多数敏捷方法论依赖于团队自管理；因此，通常不会发生本章描述的项目规划。\n\n本章开发并详细说明了第\
  \ 3 章中描述的高级需求。在完成用例分析以及对象和数据建模后，你应该有足够的信息制定更详细的计划。我的计划通常包含以下类型的活动：\n\n*   业务需求收集\n\
  *   技术设计\n*   数据库设计\n*   环境搭建\n*   项目设置\n*   数据迁移/转换活动\n*   编码和单元测试\n*   系统测试\n\
  *   性能/负载测试\n*   用户验收测试\n*   部署活动\n\n许多这些类别可以细分为更低级的任务。例如，你可以将“业务需求收集”分解为原型设计和用例分析活动。\n\
  \n\n\n\n\n这些类别中的某些仅适用于新应用程序的开发，而不是现有应用程序的增强。例如，新应用程序可能需要“环境设置”和“项目设置”任务，而在大多数情况下，现有应用程序已经具备了这些，因此对于增强现有应用程序的项目来说，这些这些任务。\n\
  \n图 8.1 显示了我用于 Java EE Web 应用程序的模板项目计划。任务大致按照完成顺序列出。我使用开源产品 `OpenProj`（[`http://sourceforge.net/projects/openproj/]`）。\n\
  \n图 8.1：Java EE Web 应用程序项目计划模板\n\n| 任务名称 | 工作量 |\n| :--- | :--- |\n| J2EE 应用程序开发\
