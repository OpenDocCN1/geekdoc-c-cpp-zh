  \ 1 | 16 小时 |\n| DAO 2 | 16 小时 |\n| 业务逻辑层类 | |\n| 逻辑 1 | 16 小时 |\n| 逻辑 2 | 16 小时\
  \ |\n| 表现层 GUI | |\n| 章节 1 | 16 小时 |\n| 章节 2 | 16 小时 |\n| 批作业 | |\n| 任务 1 | 8 小时\
  \ |\n| 任务 2 | 8 小时 |\n| 任务 3 | 8 小时 |\n| 任务 4 | 8 小时 |\n| 任务 5 | 8 小时 |\n| 任务 6\
  \ | 8 小时 |\n| 任务 7 | 8 小时 |\n| 任务 8 | 8 小时 |\n| 任务 9 | 8 小时 |\n| 任务 10 | 8 小时 |\n\
