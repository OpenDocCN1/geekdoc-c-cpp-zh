  \n\n\n# 引言\n\n*Java EE Architect’s Handbook* 专为负责设计和领导 Java EE 应用开发的应用架构师及高级开发人员编写。本书的目标是帮助你在\
  \ Java EE 项目中胜任应用架构师的角色。如果你是一名需要首次担任应用架构师角色的高级开发人员，这本书将帮助你取得成功。如果你已经是一名应用架构师，本书将赋予你额外的技能，以提升你履行该角色的能力。本书提供了大量的策略、指南、提示、技巧、窍门和最佳实践，以帮助初级架构师应对从分析到应用部署及支持的整个开发过程。为了帮助你成为一名成功的\
  \ Java EE 应用架构师，书中介绍了以下内容：\n\n* 每一个在项目生命周期的每个阶段履行应用架构师角色的基础框架\n* 开发每个阶段的架构师级提示、窍门和最佳实践\n\
  * 建立编码标准以保持代码一致且更具维护性的提示、窍门和最佳实践\n* 创建和交流设计的提示、窍门和最佳实践\n* 估算和项目规划材料\n\n本手册的这一版本侧重于开发每个阶段的应用架构师交付物。也就是说，书中描述了应用架构师通常执行的离散任务，并提供了执行这些任务的提示和技术。由于许多人通过示例学习得最好，本书将提供你的交付物示例。\n\
  \n## 标题与术语\n\n第一版的读者可能会对第二版标题的更改感到困惑。本书的第一版标题为 *The J2EE Architect’s Handbook.*。“J2EE”一词在\
  \ 2006 年被废弃，并被 Java Enterprise Edition（Java 企业版）或简称“Java EE”所取代。本质上，这两个术语指的是同一个平台。\n\
  \n## 本书范围\n\n本书不会教你如何编写 Java EE 应用。虽然大多数应用架构师会编写他们所支持的应用的部分代码，但他们是以开发人员的身份这样做，而不是以应用架构师的身份。市场上充斥着提供如何编写\
  \ Java EE 应用指令的技术书籍。本书将补充这些材料，但不会尝试重复它们。虽然书中包含示例代码，但其目的是说明应用架构概念，而不是作为如何编写代码的详细指导指南。\n\
  \n本书不是 Oracle 公司（Oracle Corporation）提供的任何 Java 和 Java EE 技术认证考试的备考指南。这些考试纯关注技术技能。虽然技能对于成为一名有效的应用架构师是必要的，但它们是不够的。应用架构师的角色超越了单纯的技术能力。架构师必须是有效的沟通者，必须与其他团队成员良好合作，并且能够理解其应用支持的终端用户领域的业务方面和需求。作为有效应用架构师的这些方面无法通过任何认证考试来衡量。\n\
  \n## 前提条件\n\n此外，本书并非为初学者准备。读者应该了解 Java 语法和基础 Java EE 概念，并具备至少中级的编程技能组合，以及以下方面的基础经验：\n\
  \n* 关系型数据库、`SQL`、`JDBC` 以及如 `Hibernate` 的 `JPA` 实现\n* `JSPs`、`servlets` 以及至少一个 Web\
  \ 框架的经验（例如 `Spring-MVC`、`Struts`、`Java Server Faces`）\n* 与开源项目（如 `Apache Commons`、`Spring`、`Hibernate`\
  \ 等）工作的经验\n* 与开发团队工作的经验\n* 支持非自己编写的应用的经验\n\n常见的观念是 Java EE 应用极其复杂。技术书籍和文章的作者在无意中通过对\
  \ Java EE 不常用方面提供极人的技术深度，从而支持了这种观念。例如，许多文本在讨论企业豆时（enterprise beans），会详细地描述 Java\
  \ EE 事务能力；然而，大多数 Java EE 应用对 Java EE 事务管理能力的使用非常有限。在本书中，我剥离了一些复杂性（大多数开发者很少使用的方面），以揭示相对直接的\
  \ Java EE 应用可以有多简单。你的时间非常宝贵，不应浪费在阅读那些你在现实市场中极少用到的功能和概念上。\n\n# 本书的结构\n\n本书的第一章描述了应用架构师在大多数组织中扮演的角色，并解释了书中插图的项目生命周期如何与极限编程\
  \ (`XP`)、理性统一过程 (`RUP`) 以及以及其他可能的方法论相结合。\n\n**第一节** 详细介绍了如何使用用例分析定义项目目标。它还讨论了如何定义范围和创建初步项目计划。本节提供的指南将帮助你成功完成这些任务，这些任务对于项目按时按预算完成至关重要。项目失败或成本超支的最常见原因是目标和范围定义及管理糟糕，而不是技术问题。\n\
  \n**第二节** 关注对象建模和数据建模活动，描述了它们需要详细到什么程度并说明了常见错误。此外，你还将学习如何为外部系统构建接口，以及如何完善项目计划和相关的估算。本节介绍建模技能对于向开发者有效交流设计至关重要。\n\
  \n**第三节** 针对 Java EE 应用的所有方面提供了实现提示和指南。你将学习如何对应用进行分层，以尽地减少增强和更改的影响。你还将熟悉几个常用的用于简化应用代码和开发过程开源库。\n\
  \n此外，第三节详细介绍了你需要在测试、异常处理、日志记录和多线程方面做出的应用架构决策，你还将学习实现设计主要部分的提示和技术。应用架构师如果未能定义实现策略和方法，可能会显著降低项目进度并增加\
  \ Bug 的数量。\n\n**第四节**为开发测试程序和流程改进提供了提示和指南。这些建议旨在让你的应用更稳定、更具维护性。此外，你还将学习预警重构活动是必要的信号。阅读这一节将使你未来的项目取得更大的成功。\n\
  \n# 常用资源\n\n本书经常引用以下开源项目，它们通常用于许多 Java EE 应用：\n\n* Apache Commons Lang (`http://commons.apache.org/lang/`)\n\
