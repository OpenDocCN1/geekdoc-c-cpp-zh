  \n我对书中可能存在的任何错误负责。\n\n# 第一部分：规划 Java EE 应用\n\n应用程序架构师通常通过参与分析活动、定义范围和估算资源等活动协助规划\
  \ Java EE 应用。架构师在规划阶段的角色在不同公司之间差异很大。虽然我认为架构师应该引导并促进规划活动，但在你所在的特定公司，你的角色可能是协助而非促进。\n\
  \n在本节中，你将学习如何：\n\n* 促进并记录业务分析。\n* 协助项目经理定义项目范围。\n* 估算所需的时间和资源。\n* 定义并设计与外部应用程序的接口。\n\
  \n你在这里学习的技能将让你能够应用于第 2 节中讨论的设计技术。\n\n![二进制代码黑白横向切片图](img/stock-photo-17860137-binary-code-bw-horiz-slice.tif)(images/00003.jpeg)\n\
  \n## 第一章：项目开发团队与项目生命周期\n\n本章为从启动到发布构建成功的第一个项目奠定了基础。它首先定义了什么是应用程序架构师以及做什么，并总结了架构师如何与其他团队成员合作。章节接着回顾了开发过程的几种替代方法。由于构建成功项目的确定流程仍然是一个存在相当争议的话题，许多公司采用了混合计划。\n\
  \n### 项目开发团队：角色与职责\n\n所有的 Java EE 开发团队都需要具备各种技能的人员来担任团队中的众多角色。为了使 Java EE 项目成功，所需的许多技能组合包括：\n\
  \n* 应用程序架构师\n* 产品经理\n* 项目经理\n* 业务分析师\n* 图形设计师\n* 表示层开发人员\n* 业务逻辑开发人员\n* 数据建模师\n\
  * 数据库管理员\n* 数据迁移专家\n* 基础设施专家\n* 测试专家\n* 自动化测试专家\n\n尽管本书侧重于应用程序架构师的角色，但本节定义了 Java\
  \ EE 开发团队中其他主要成员的角色和职责，并描述了应用程序架构师相对于这些角色的职责。\n\n某些组织对角色使用不同的标签。例如，基础设施专家可能被称为系统管理员；测试专家可能是一个测试员；某些组织可能会区分测试团队经理和个人测试员。无论你给这些技能组合冠以什么术语，将它们中的全部成为开发团队的一部分将大大增加团队创建成功的\
  \ Java EE 项目的机会。\n\n此外，如果项目足够大，团队中的一个人可以承担多个角色，或者一个角色可以由多人共同拥有。某些组织将应用程序架构师和项目经理的角色合并。某些组织让高级开发人员兼任数据库管理员或基础设施专家。还有的组织让同一批开发者既负责表示层也负责业务层。在这里我并不是想推荐特定的团队组织，而只是传达哪些技能组合是必要的，无论它们是如何组织的。\n\
  \n### 应用程序架构师\n\n**应用程序架构师确定了将用于项目的技术。** 在许多组织中，某些技术选择是在企业层面做出的。例如，许多组织在企业层面做出硬件和操作系统选择，以及某些软件选择（例如\
  \ Java EE 容器供应商）。通常，选择一种语言（如 `Java`）是一项企业级决策。\n\n然而，大多数应用程序都有技术需求，而这些需求并未在企业级指令中明确提供。我将企业层面的技术选择与针对单个应用程序的类型进行了区分。例如，在所有服务器端编程中使用\
  \ `Java` 语言的决定可能是在企业层面做的，但关于使用哪种 XML 解析器的决定可能留给应用程序架构师。在许多组织中，做出企业级技术选择的人员组成一个独立于\
  \ Java EE 开发团队的群体。\n\n应用程序架构师通常负责项目所需的第三方包或工具。例如，架构师可能会识别出需要一个基于模板的生成引擎，并选择 Apache\
  \ 的 Velocity。\n\n越来越多的组织正在区分企业架构师和应用程序架构师。企业架构师协助决定购买哪些软件产品以及构建哪些软件产品。有效的企业架构师将确保所使用的软件产品与企业的业务目标保持。企业架构不在本书的涵盖范围内；关于企业架构师角色的额外材料可以在\
  \ URL 找到：[`en.wikipedia.org/wiki/Enterprise_architect`](http://en.wikipedia.org/wiki/Enterprise_architect)。\n\
  \n\n\n\n应用架构师建议项目的开发方法论和框架。通常，架构师会向项目经理提出这些建议。例如，常见的建议是使用用例格式记录所有分析，并辅以原型设计。另一种常见的建议是以对象模型的形式记录设计。某些组织会在企业层面定义使用的方法论。\n\
  \n应用架构师提供应用程序的整体设计和结构。每位开发人员在参与项目时都会带来独特的预设观点、习惯和偏好。通过综合这个有时意见分巨大的群体的投入，应用架构师确保了各个开发人员完成的工作是互补的。\n\
  \n我将应用架构师的角色比作交响乐指挥家。所有的音乐家对如何解释某部作品都有不同的意见。指挥家提供将使用的诠释，并与音乐家合作来实现它。根据开发方法论的不同，每个功能的设计可能不会提前完成。在这种情况下，架构师的工作是在功能开发进行期间与开发人员合作，协助设计并确保实现符合整体架构。\n\
  \n应用架构师确保项目得到了充分的定义。项目分析必须足够详细且一致，才能形成构建应用程序的基础。通常，应用架构师会与项目经理和业务分析师合作定义项目。\n\n\
  应用架构师确保应用程序设计得到了充分的记录。记录应用程序设计是与开发人员以及开发人员之间建立良好沟通的关键步骤。创建文档的过程迫使架构师彻底思考问题。最终文档使管理层能够向项目中添加或更换开发人员，而不会不利地占用架构师的时间。对于开发人员来说，文档允许他们在应用架构师短期离开项目时继续工作，并使他们能够自行解决设计中的不一致之处，而不会消耗开发团队其他成员的时间。文档还助于助于项目免受人员变动的影响。\n\
  \n通常，项目的规模和范围决定了设计文档的详尽程度。例如，一个由两名开发人员完成、工作量少于 1,000 小时的项目所需的文档远少于一个需要 50 人团队、工作量达\
  \ 100,000 小时的项目。目前没有客观规则来规定特定项目的最佳数量。\n\n我见过许多没有编写文档的项目，这意味着增加一名开发人员是一项艰巨的任务，因为架构师必须向新来者口头传达设计。必须通过口头交流设计抵消了引入额外开发人员的某些收益。\n\
  \n需要注意的是，有一些工具对管理功能请求和完成这些请求分配的任务提供有限的支持。此类产品的示例有 JIRA ([`www.atlassian.com/software/jira`](https://www.atlassian.com/software/jira))\
  \ 和 Mingle ([`www.thoughtworks.com/products/mingle-agile-project-management`](http://www.thoughtworks.com/products/mingle-agile-project-management))。这些工具对于需要某些更改详细历史的大型公司非常有价值。\n\
  \n### 应用架构师的关键角色与职责\n\n#### 1. 制定编码规范\n应用架构师制定编码规范。由于个人开发人员有自己的编码偏好，需要阐明编码标准，以便各个部分更容易地整合在一起。应用架构师负责为以下主题建立项目程序和指南（这些内容在书中稍后会有深入介绍）：\n\
  \n* 异常处理\n* 日志记录\n* 测试\n* 线程\n* 缓存\n* 配置\n\n#### 2. 任务识别与项目规划\n应用架构师为项目经理识别实现任务。这一角色对于\
  \ Java EE 项目尤为重要，因为它们涵盖的技术范围比其他类型的系统项目要广泛得多。出于实际需要，应用架构师还会帮助项目经理进行项目规划和估算。\n\n应用架构师在某个阶段获得管理小型项目的经验是一个好主意。这有助于他们理解项目经理角色所面临的典型项目管理挑战，这种理解将使他们能够为所属的项目经理提供更好的支持。\n\
  \n#### 3. 指导开发人员\n应用架构师指导开发人员完成困难任务。通常，架构师比开发人员更有经验。事实上，应用架构师在他们工作的项目中同时也兼任高级开发人员的情况并不罕见。当开发人员遇到阻碍进度的技术问题时，架构师往往是帮助他们创建解决方案的人。对于许多项目来说，架构师更多的是作为导师而非执行者。\n\
  \n#### 4. 强制合规性\n应用架构师强制执行编码规范的合规性。作为规范的制定者，应用架构师最有可能识别出何时没有遵守规范，因此是强制执行这些规范的逻辑选择。项目经理通常负责执行任务，但往往不具备识别合规性的技术经验。\n\
  \n代码审查是一项极佳的强制执行机制。如果其他团队成员检查代码，个人开发人员想要私下规避团队标准标准要困难得多。我还会利用版本控制来定期简化对代码更改的审查。也就是说，大多数版本控制产品都提供通过电子邮件通知你提交的功能。从实践角度来看，我对单个提交的关注取决于执行提交的开发人员的技能。随着时间的推移，某些开发人员将证明比其他人更可靠，需要的监督也更少。\n\
  \n代码审查也是开发团队所有成员的极佳学习工具。应用架构师发现设计中的漏洞，所有参与者都能从团队其他成员学习技巧和窍门。应用架构师通常是团队中最丰富的成员，他们经常会主持代码审查。为了发挥最大的作用，代码审查应该在友好、无威胁的氛围中进行。\n\
  \n需要注意的是，还有一些源码分析工具，如 Checkstyle ([`checkstyle.sourceforge.net/`](http://checkstyle.sourceforge.net/)),\
  \ PMD ([`pmd.sourceforge.net/`](http://pmd.sourceforge.net/)) 和 FindBugs ([`findbugs.sourceforge.net/`](http://findbugs.sourceforge.net/))提供了自动化审查支持。它们会检查源码并指出可能的代码问题。通常，在正式将其纳入构建之前，我需要花时间配置这些工具（例如确定要执行哪些规则）。\n\
  \n#### 5. 成本与收益估算\n应用架构师协助项目经理为管理层估算项目成本和收益。虽然通常是项目经理的责任，但大多数项目经理对 Java EE 技术的经验较少，可能没有意识到需要完成的一切。应用架构师负责审查项目计划并确保项目经理没有遗漏任何任务。我经常让整个团队审查项目计划并征求反馈。如果团队成员有机会审查和批评项目计划，他们就很难对不完善或不准确的项目计划表示抱怨。\n\
  \n\n\n\n应用架构师协助管理层做出开发人员的人事决策。虽然人事决策通常被视为管理职，但应用架构师处于评估技术胜任能力的良好位置。人事决策错误可能会对项目进度造成巨大损害。\n\
  \n## 产品经理\n产品经理负责产品及其需求。对于大多数组织而言，这一职位由应用程序旨在服务的业务领域人员担任。对于构建面向市场软件或向其他组织销售软件的组织，产品经理负责确保产品基于市场需求。\n\
  \n应用架构师负责为产品经理提供技术建议和指导。应用架构师与业务分析师和产品经理合作，帮助确定哪些功能在应用程序内可行，或对于特定版本的发布可行。\n\n##\
  \ 项目经理\n项目经理负责协调和安排项目开发团队所有成员的所有任务。项目经理还必须向管理层和最终用户代表汇报当前的项目活动和状态。此外，项目经理获取项目或团队成员所需的任何资源或材料。\n\
  \n应用架构师负责为项目经理提供技术建议和指导。应用架构师协助项目经理识别项目任务及其完成顺序。架构师还帮助项目经理识别所需的材料和资源，包括指导其他团队成员的选择，并从技术角度验证他们的技能组合。\n\
  \n## 业务分析师\n业务分析师负责与最终用户合作，定义应用程序需求以及设计和构建应用程序所需的细节。由于最终用户和开发人员通常使用不同的术语，业务分析师负责翻译最终用户与开发人员之间的通信。通常，业务分析师在企业的用户侧和信息技术侧都拥有经验。\n\
  \n随着项目的进行，业务分析师的角色会减少，但不会消失。开发人员通常在编码和测试活动期间会有额外的业务问题，业务分析师会与业务方合作获取这些问题的答案。\n\n\
  应用架构师负责确保业务分析师确定的应用程序需求是充分的。期望分析能够 100% 完成且正确是不现实的。毕竟，分析在某种程度上是主观性。然而，分析需要足够完整，以支持进行设计。\n\
  \n## 解决方案架构师\n解决方案架构师确保应用程序遵守整个企业执行的任何技术标准。例如，许多组织对所使用的数据库和应用程序服务器软件进行标准化。如果应用程序团队遇到企业其他地方已解决的技术问题，解决方案架构师将引导应用架构师重用企业内已经开发的内容。有时解决方案架构师按业务领域组织，能够协助业务代表决定资助哪些应用程序开发工作。应用架构师担任这一角色很常见，特别是对于较小的组织。\n\
  \n## 图形设计师\n许多应用程序（特别是公开的应用程序）需要专业的图形或布局设计师。大多数开发人员如果听之任之可以产生功能性的网页，但这些页面通常很丑且难以使用。图形设计与其说是科学不如说是艺术。图形设计师将关注用户界面设计、图形和应用程序的整体可用性。通常，图形设计师主要与业务分析师和其他业务方代表合作制定设计。但图形设计师也可能与表示层开发人员合作创建原型。\n\
  \n一些较大的组织会区分“图形”设计师和“事务”设计师。事务设计师将设计页面流和控制以适应业务流程，而不是关注美学。大多数组织不区分这两个角色，并将它们合并为一个角色。\n\
  \n应用架构师负责确保布局在技术上是可行的。我见过许多网页设计使用了文字处理程序可用但 `HTML` 不支持的文本效果，例如，使用旋转 90 度的文本设计。架构师能够在开发过程早期发现并纠正这类问题。\n\
  \n## 表示层开发人员\n表示层开发人员负责为应用程序编写所有的 `HTML`、`Javascript`、模板标记、`JSPs` 和/或 servlet。通常，任何直接涉及生成用户界面的内容都是表示层开发人员的职责范围。通常与布局设计师合作，表示层开发人员构建原型并开发工作版本。通过与架构师合作，表示层开发人员和图形设计师确定前端导航的结构和设计。\n\
  \n应用架构师负责确保设计模式可以被维护和扩展。导航问题通常很复杂，很容易退化为难以维护的代码。应用架构师处于识别和纠正维护问题以及其他出现问题的良好位置。\n\
  \n## 业务逻辑开发人员\n业务逻辑开发人员负责编写应用程序的所有不可见部分，包括企业 Bean、Web 服务、批作业、业务对象和数据访问对象。有些人将这些不可见部分称为应用程序的服务器端组件。业务逻辑开发人员通常是\
  \ `Java` 专家，与架构师密切合作并在需要时协助性能调优。\n\n应用架构师为业务逻辑开发人员提供指导。业务逻辑对于表示层开发人员能够可用是非常重要的。服务器端组件出现技术问题和故障是常见的，而这些通常是应用程序中最复杂的部分。因此，应用架构师经常担任业务逻辑开发人员的导师。\n\
  \n## 数据建模师\n数据建模师利用来自业务分析师的信息来识别、定义和编制应用程序存储在数据库中的所有数据。数据建模通常涉及在实体关系（`ER`）图中编写应用程序数据文档。数据库管理员随后使用\
  \ `ER` 图生成物理数据库设计。因此，数据建模师和数据库管理员的角色合并是常见的。\n\n应用架构师负责确保数据模型是充分的。与业务分析一样，期望数据模型\
  \ 100% 完成是不现实的。如果数据模型在很大程度上已完成并处于第三范式，那么模型（以及由此数据库）未来的更改很可能是微道的。\n\n## 数据库管理员\n\n\
  \n\n\n\n数据库管理员负责根据应用程序业务需求制定数据库设计，并创建和维护应用程序的数据库环境。通常，数据库管理员协助性能调优，并帮助业务逻辑开发者诊断有关数据访问的应用开发问题。有时，数据库管理员也兼任业务逻辑开发者或数据迁移专家。\n\
  \n应用程序架构师与数据库管理员协作解决任何涉及数据库存储的问题或故障。然而，数据库管理员主要与数据建模师和业务逻辑开发者交互。\n\n## 数据迁移专家\n\n\
  某些应用程序（例如数据仓库）高度依赖从其他源或其他遗留数据库迁移的数据。数据迁移专家编写并管理持续填充应用程序数据库的所有脚本和程序。当应用程序的迁移需求很少时，这一角色可能不是必要的，或者可能与数据库管理员的角色合并。\n\
  \n应用程序架构师确保为迁移专家提供迁移需求。与数据迁移专家协作解决可能出现的任何技术问题或故障是应用程序架构师工作的另一个方面。\n\n## 基础设施专家\n\
  \n基础设施专家负责提供所有的开发、测试和生产环境以及部署方法。正式的开发和部署基础设施可以节省大量的时间精力。管理容器、编写部署脚本以及协助其他开发者诊断其测试环境问题所涉及的特殊性构成了一组独特且具有挑战性的问题集。\n\
  \n通常，基础设施专家与组织的系统管理员和数据库管理员协作提供这些环境。大多数组织通过中心化管理组提供资源置备服务。例如，在大多数组织中，基础设施专家不会物理地安装或定义构建服务器；他或她会为该构建服务器指定需求，而由系统管理员实际进行定义。数据库的物理创建也是如此。重点在于，基础设施专家负责确保环境被创建并经过适当配置。\n\
  \n当你工作于或设计持续集成环境、提供构建自动化，或处理涉及集群和其他非琐碎环境设置的复杂硬件基础设施时，基础设施专家通常是至关重要的。\n\n应用程序架构师为基础设施专家定义基础设施需求。架构师与专家协作，以确定所需环境的数量和性质，以及每个环境需要什么程度的支持。许多项目至少需要一个开发、测试和生产环境。某些组织将基础设施专家的角色与应用程序架构师的角色相结合。\n\
  \n## 测试专家\n\n测试专家通常是一个注重细节的人，确保生成的应用程序符合规范且尽可能没有错误。通常，测试专家至少对相关业务领域有基础知识。\n\n应用程序架构师与测试人员协作，以识别任何所需的基础需求和支持。项目经理和业务分析师通常与测试专家协作，建立测试计划的内容和测试方法。因此，架构师在测试中的角色通常是支持。对于较大的开发工作，测试专家角色可以由整个测试团队和一名测试经理担任。\n\
  \n## 测试自动化专家\n\n对于预计将交付多次应用程序迭代和版本的大型项目，通常需要测试自动化专家。测试自动化专家可以编写集成测试脚本，这些脚本可以作为应用程序回归的一部分执行，并可以在每次发布时执行，或者在持续集成环境中执行（在每次成功构建时都会执行测试）。\n\
  \n## 项目生命周期方法\n\n关于 Java EE 项目生命周期应该是怎样的，存在不同的流派。本节描述了这些流派，并提出了对该主题的个人观点。书中提出的指南旨在兼容任何方法论。\n\
  \n### 瀑布方法\n\n瀑布方法意味着在编码和测试之前，对项目执行所有的分析和设计。这种方法在大多数开发仍基于大型机时被常用，并且仍然是大多数公司青睐的方法。\n\
  \n在瀑布方法下开发的项目往往规模较大，交付周期较长。因此，它们包含了更多风险。这些项目通常不需要业务参与者学习大量的技术术语，而且业务端接口受到严格控制。\n\
  \n与其他方法相比，瀑布式项目开发没有在过程的早期提供反馈，但它交付了更完整的解决方案。瀑布式项目往往能很好地融入预算计划周期，这可能是该方法流行的一个原因之一。\n\
  \n由于瀑布式项目通常需要很长时间，业务需求往往在项目过程中发生变化。项目经理因此面临着困境：如果项目不随业务变化，结果所提供的收益就较少；如果项目改变方向以遵循业务需求的变化，项目所需的时间资源将受到负面影响。\n\
  \n### 敏捷方法\n\n敏捷方法努力将项目拆分成通常只需要少量资源的小组件。因此，敏捷方法是瀑布方法的对立面。敏捷方法可以被视为具有许多不同实现方法的“家族”。在本书期间，敏捷方法最流行的实现方式似乎是\
  \ Scrum。敏捷实现的其他示例还有极端编程（XP）、精益（Lean）和水晶（Crystal）。在本文讨论的范围内，我使用 Scrum 作为敏捷方法的主要示例，因为它似乎是最广为人知的。\n\
  \n敏捷方法的核心目标是减少困扰瀑布方法的技术风险和项目成本。敏捷方法基于以下假设：\n\n*   从远来看，更早发现错误成本更低。\n*   降低复杂性也能降低技术风险，且从远来看成本更低。\n\
  *   短迭代可以带来更高的投资回报率（ROI）以及更快速适应不断变化的业务需求的能力。\n*   关注测试自动化结果可以更高效地利用开发资源。\n\n敏捷方法要求你将问题拆分为许多小问题（称为“故事”），这些故事只需三周或更短的时间。每个故事由两名程序员使用一台机器共同开发。在故事开发时，用于确定新故事功能是否正常工作的程序化测试会被开发出来并添加到回归测试套件中。这些程序员会忽略他们正在处理的故事之外的应用程序的所有方面。一名业务参与者专注于该项目，并能随时回答任何出现的业务问题。\n\
  \n\n\n\n从理论上讲，使用结对编程（pair programming）编写所有代码可以减少错误进入部署阶段的概率。结对编程还倾向于使代码更简单，因为向另一个人解释概念需要时间。算法越复杂，就越难解释。对降低复杂性的强调降低了错误发生的可能性。\n\
  \n对测试、创建和频繁运行回归测试套件的强调可以及早发现错误，并减少任何更改无意中引入新漏洞或产生其他非预期后果的概率。\n\n`Scrum` 和其他敏捷方法通过提供早期反馈来降低风险。开发团队如果走错了路线，会早早被警告并纠正，而此时更改的成本要低得多。\n\
  \n## 统一建模过程 (Rational Unified Process)\n\n统一建模过程（`RUP`）是一种形式化的开发方法。大多数 `RUP` 文献将其描述为一种迭代方法，但这只是事实的一半。`RUP`\
  \ 强调在进入构建阶段之前，对整个项目进行需求收集、分析和设计活动——包括对象和数据建模。从这个意义上说，`RUP` 在分析和设计上采用瀑布方法但在构建和交付上采用迭代方法。通过鼓励早期的需求收集和分析，`RUP`\
  \ 试图保持项目与用户预期一致。\n\n`RUP` 通过鼓励团队首先开发项目中风险最高的部分来降低风险，从而留出更多时间识别和应对问题与困难。它还减少了设计需要更改时的重复工作。\n\
  \n## 哪种方法最流行？\n\n我不准备宣布这些方法中的任何一种是“最佳的”。它们各有优缺点。瀑布方法在预算至关重要的企业环境中似乎是最常用的方法。许多公司使用（并对……感到更从容）瀑布方法进行初始开发和重大增强。虽然增强在瀑布方法下更具迭代性，但其迭代规模通常远大于敏捷方法。\n\
  \n敏捷方法很少以纯形式使用。这并不是一种一种判断，而仅仅是一种观察。鉴于此，衡量敏捷方法的采用率是存在问题的。最近两次衡量采用率的尝试是：[`visual.ly/agile-2012-state-union`](http://visual.ly/agile-2012-state-union)\
  \ 和 [`www.klocwork.com/blog/agile-development/agile-adoption-an-update/`](http://www.klocwork.com/blog/agile-development/agile-adoption-an-update/)。从这些调查中可以得出一些观察。\n\
  \n`Scrum` 似乎是敏捷方法中最流行的。这得到了 Google Trends 关键词统计（图 1.1）的证实。然而，似乎使用敏捷方法的组织仅将敏捷用于开发的部分而非全部。这可能是因为大型组织内部不同的经理有不同的偏好。也可能是某些项目比其他项目更适合敏捷方法。\n\
  \n图 1.1：不同敏捷方法的搜索引擎关键词趋势统计图\n\n![Chap-1-Agile-Methodology-Keyword-Statistics-bw.tif](img/00004.jpeg)\n\
  \n来源：Google Trends，取自 2013 年 11 月 25 日。\n\n## 我的个人想法\n\n这本书在很大程度上兼容这两种方法之一。`Scrum`\
  \ 用户和其他敏捷爱好者只会选择比我插图中的示例小得多的迭代规模。因为一种方法很少对常识拥有垄断，也很少没有缺点，因此我倾向于采用混合方法。\n\n**敏捷对测试的强调具有巨大的价值。**\
  \ 我已经养成了对我写的所有内容编写测试序列的习惯，并将它们合并为完整的回归测试。我甚至见过有的团队将完整的回归测试放入构建中，如果所有测试都未通过，就强制部署失败。我发现，通过这种做法避免的错误远大于开发和维护测试用例所需的额外时间和精力的。尽管如此，我也见过某些组织投入了单元测试，却在维护它们变得过于耗费资源时将其抛弃。\n\
  \n**敏捷缩小项目规模的倾向具有巨大的价值。** 项目风险似乎与工作单元的大小成正比。因此，减小工作单元的大小可以降低承担项目的业务风险。我没有经验性证据来证明这一说法，但我已经在现场中观察到了好几次。\n\
  \n**敏捷对复杂性的战争具有价值。** 越简单越好。忽略除你正在处理的故事之外的所有故事，在短期内确实产生了更简单的代码。但它增加了重复工作（或用更现代的话说，是重构）的概率，而许多项目没有这方面的预算。如果重构执行得不当，或者开发者面临时间压力，代码最终仍然很容易变得不必要的复杂。此外，许多开发者使用“复杂性”作为借口来忽略业务需求。\n\
  \n**RUP 对集中分析和设计的强调具有巨大的价值。** 某些敏捷方法假设开发者可以对他们正在处理的故事采取局部的视角并忽略其他任何内容。这会导致某种程度的重复工作。所有开发者实际上应该有更广泛关注。由于\
  \ `RUP` 将分析和设计集中在项目初期，它代表了纯迭代方法与瀑布方法之间的合理折中。\n\n**控制与最终用户的沟通是必要的。** 某些敏捷方法假设开发团队的任何成员都应该与最终用户代表交流。开发者和最终用户的视角通常不同，使用的术语也不同。在实践中，许多开发者在适应非技术术语方面困难；他们无法将业务术语翻译成技术术语，反之亦然。从现实角度，对业务端进行某些通信集中是必要的。\n\
