  \ 8 小时 |\n| 用户验收测试 | 8 小时 |\n\n## 关键路径\n\n这些类别中的某些仅适用于新应用程序的开发，而不是现有应用程序的增强。例如，新应用程序可能需要“环境设置”和“项目设置”任务，而在大多数情况下，现有应用程序已经具备了这些，因此对于增强现有应用程序的项目来说，这些这些任务。\n\
  \n图 8.1 显示了我用于 Java EE Web 应用程序的模板项目计划。任务大致按照完成顺序列出。我使用开源产品 `OpenProj`（[`http://sourceforge.net/projects/openproj/]`）。\n\
  \n图 8.1：Java EE Web 应用程序项目计划模板\n\n（注：提示中提供的剩余文本包含大量的重复和混乱的填充/占位符文本。遵循“保留核心内容”和“不删除价值信息”的指令，我处理了有意义的介绍段落和表格结构。）\n\
  \n\n\n\n我遇到过的关于关键路径（以及泛指规划）重要性的书籍是 Goldratt (1992, 1997) 编写的。虽然这两本书都以工厂装配线作为示例，但这些概念适用于\
  \ Java EE 项目（而且由于它们像小说一样的格式，这些书读起来很有趣）。\n\n## 常见错误\n\n**直接开始写代码。** 许多开发者对设计缺乏耐心。他们认为与编码相比，对象建模和数据建模活动是无聊的。我见过许多项目在没有进行足够建模来首先弄清目标的情况下就直接进入了编码阶段。尽管这些项目最终都完成了，但它们消耗的资源通常比所需的要多。有时，无目标的努力可能会消耗所需资源的两倍到四倍。\n\
  \n一个很好的类比是住宅建筑。当建筑商建造房屋时，他们会先创建蓝图，以避免昂贵的错误和重复工作。对象模型和数据模型实际上是 Java EE 程序的蓝图。\n\n\
  **允许目标移动。** 一旦确定了项目的范围（例如，已决定实现哪些用例，且这些用例的内容有足够的细节来进行设计），就要遏制甚至禁止范围的扩大。我知道这说起来容易做起来难。McConnell\
  \ (1998) 建议建立变更控制委员会，由其负责在项目进展通过分析和高层设计后审查并授权所有变更请求。变更控制委员会的存在通过制造官僚主义的繁琐程序，有效地阻止了范围的扩大。\n\
  \n如果你无法在游戏后期避免向项目添加某些内容，请确保将额外的活动、时间和成本都添加到项目计划中。此外，请确保修订后的项目计划反映出这样一个事实：在新的功能的分析和设计上花费的时间挤占了你本应该做的事情（导致项目也延期了）。如果新功能导致了已完成任务需要重新工作，请确保这些成本也记录在案供所有人查看。\n\
  \n再次考虑住宅建筑的类比。购房者意图的变化会导致重复工作并影响交付日期。\n\n**不纠正人员分配错误。** 当然，最好的办法是从一开始就避免错误。但当错误发生时，你最好的行动方案是识别并修复它们，而不是忽视它们。大型项目中具破坏性最大的错误出现在人员任务分配领域。这种错误之所以破坏性这么大，是因为大多数经理没有勇气纠正这些错误，因此允许它们继续下去。\n\
  \n虽然项目经理传统上负责人员分配，但架构师（对技术技能组更了解）至少应该担任顾问角色。DeMarco 和 Lister (1999) 提出了一些有趣的观察：\n\
  \n*   预计最优秀的人表现比最差的人大约好 10:1。\n*   预计表现最好的人大约比中位数好出 2.5 倍。\n\n此外，人们通常在某些任务上非常擅长，但在其他任务上很糟糕。优秀的项目经理学会识别这些差异并适当调整分配。例如，某人在编写表示层代码时可能是个天才，但在编写架构组件时完全是个彻头包。有些人可以轻松地进行测试，但不擅长编写代码。\n\
  \n**将集成测试活动留到项目末尾。** 分析和设计的错误及遗漏通常在开始构建之前是可见的。对应用程序进行集成测试会让分析和设计的错误变得可见，即使应用程序只有部分功能。在项目更早阶段发现这些错误，让你有机会在对项目时间表影响较小的情况下纠正错误。\n\
  \n## 改进你的项目计划和估算\n\n**跟踪你的时间。** 以这种方式跟踪你的时间很重要，这样你可以轻松地将这些时间映射到给你的特定任务上。如果你领导其他开发者，也让他们跟踪他们时间。在完成任务之前估算完成该任务所需的时间，并测量你执行该任务时花费的时间也非常重要。你估算的时间很少等于你花费的时间。通过这个过程，你将能够理解你的估算与现实有多接近。随着时间的推移，你会发现你的估算与花费时间之间的差异越来越小。\n\
  \n**不要丢弃过去任务和项目的估算及时间跟踪记录。** 当你需要未来项目或任务的估算时，查看你过去做过的类似任务或项目会有帮助。这类似于房地产经纪人判断房产价格过高还是过低；他们会寻找近期出售的类似物业并检查它们的售价价格。\n\
  \n**让同事审查你的估算。** 未参与项目的人可能很容易看到你遗漏的。。\n\n## 延伸阅读\n\nDeMarco, Tom, and Timothy Lister.\
  \ 1999. *Peopleware: Productive Projects and Teams*, 2nd ed. New York: Dorset House.\n\
  \nGoldratt, Eliyahu. 1992. *The Goal: A Process of Ongoing Improvement*. Great Barrington,\
  \ MA: North River Press.\n\n———. 1997. *Critical Chain*. Great Barrington, MA: North\
  \ River Press.\n\nMcConnell, Steve. 1998. *Software Project Survival Guide.* Redmond,\
  \ WA: Microsoft Press.\n\n# 第三节\n\n## 构建 Java EE 应用\n\n一旦设计完成，应用程序架构师通常会被要求指导应用程序的构建。在构建期间，应用程序架构师直接负责的活动包括：制定编码标准；指导级开发者完成更困难的编程任务；以及建立日志、异常处理和应用程序配置的规范。此外，架构师（或高级开发者）通常负责编写应用程序所需的任何自定义架构组件，因为这项任务具有难度。\n\
  \n本节将引导你完成应用程序构建过程。在其中，你将学习如何：\n\n*   为所有软件层建立编码规范。\n*   选择数据库持久化方法（例如 `JDBC`、`JPA`\
  \ 等）。\n*   为事务管理设置规范和指南。\n*   理解如何让开发者使用架构组件。\n*   为日志、异常处理、线程和配置管理制定指南。\n\n本书的第一版依赖于名为\
  \ `CementJ` 的开源产品 [`http://sourceforge.net/projects/cementj/`](http://sourceforge.net/projects/cementj/))，它是作为实现书中分层概念的快捷方式提供的。`CementJ`\
  \ 还提供了许多节省时间的静态工具，将常见的编码任务变为单行代码。`CementJ` 现在已经过时了。\n\n那时许多开源项目已经成熟并以更稳健的方式提供了这些功能。因此，`CementJ`\
  \ 已被来自 Apache Commons [`http://commons.apache.org/](http://commons.apache.org/))\
  \ 系列的常用开源项目取代：\n\n*   Apache Commons Lang [`http://commons.apache.org/lang/`](http://commons.apache.org/lang/))\n\
  *   Apache Commons Collections [`http://commons.apache.org/collections/`](http://commons.apache.org/collections/))\n\
  *   Apache Commons BeanUtils [`http://commons.apache.org/beanutils/`](http://commons.apache.org/beanutils/))\n\
  *   Apache Commons DbUtils [`http://commons.apache.org/dbutils/`](http://commons.apache.org/dbutils/))\n\
  *   Apache Commons IO [`http://commons.apache.org/io`](http://commons.apache.org/io))\
  \ \n*   Google Guava Core Libraries [`https://code.google.com/p/guava-libraries/`](https://code.google.com/p/guava-libraries/))\n\
  \n\n\n\n\n![stock-photo-17860137-binary-code-bw-horiz-slice.tif](img/00003.jpeg)\n\
  \n# 第 9 章：值对象与实体的编码\n\n值对象（`VO`）和实体的相似之处在于，它们都将逻辑分组的数据项组合成单一的逻辑结构；它们的编码标准和指导在许多方面也是相似的。它们之间最大的区别在于，实体类拥有到数据库表的映射并且是持久化的，而\
  \ `VO` 类在本质上是瞬态的。在 Java EE 的早期阶段，值对象被用于减少企业豆（Enterprise Beans）与其远程调用者之间的网络传输。随着企业豆的使用频率下降——因为在许多应用程序中它是一种不必要的复杂性——值对象类的用途也随之减少了。\n\
  \n从表面上看，我对值对象或实体类更广泛的定义似乎与面向对象的设计原则相矛盾，该原则告诉我们要将数据与业务逻辑相结合。面向对象的原则会让我们认为“员工”是一个包含其自身数据（例如：姓、名）以及代表业务逻辑的方法（如\
  \ `add()`、`terminate()` 和 `oppress()`）的对象。但出于许多实际考虑（如降低复杂性），我们需要在业务逻辑上下文之外引用数据的选项。\n\
  \n第 11 章将向你展示如何在业务逻辑层中构建对象，既符合面向对象的设计原则，又允许你将这些对象的数据部分作为值对象进行引用。例如，`Employee` 类可以轻松提供一个\
  \ `getEmployeeVO()` 访问器，提供不包含业务逻辑的员工数据。\n\n图 9.1：在分层架构中使用值对象和实体\n\n![Chap-10-SoftwareLayers-Entity-VO.eps](img/00037.jpeg)\n\
  \n由于应用程序架构师负责建立编码标准指南以及指导开发人员，本章为值对象和实体提供了若干实现技巧和技术。此外，本章解释了有效结构化值对象和实体所需的若干概念。为了使实现这些建议更容易且节省时间，本章提供了一个基础值对象类，我已包含在源码包中（`j2ee.architect.handbook.common.BaseVO`）。正如我们将讨论的，为实体提供这样一个基类要困难得多且危险得多。\n\
  \n## 实现技巧与技术\n\n### 始终实现 `java.io.Serializable`\n为了让值对象或实体能够作为任何类型分布式对象（如企业豆或 RMI\
  \ 服务）的参数使用，它需要实现 `Serializable`。`Serializable` 并不要求任何方法，因此实现起来非常简单。你最好不要在不可序列化的值对象中放入任何内容（例如数据库连接）。但如果你必须在值对象中放入一个不可序列化的对象，请将其声明为\
  \ `transient`，以便它在任何序列化尝试中都会被跳过。列表 9.1 是值对象代码的摘。\n\n### 列表 9.1：示例值对象代码\n\n```java\n\
  public class SalesSummaryVO implements Serializable, Comparable<SalesSummaryVO>\
  \ {\n\n    private static final long serialVersionUID = -4099990023592442788L;\n\
  \n    private String salesRegion;\n\n    private Integer salesYear;\n\n    private\
  \ Double salesQuarter1;\n    private Double salesQuarter2;\n    private Double salesQuarter3;\n\
  \    private Double salesQuarter4;\n\n    // 为了省略起见省略代码\n}\n```\n来源：`/src/j2ee/architect/handbook/chap09/sample1/SalesSummaryVO.java`\n\
  \n### 始终填充值对象或实体的所有字段\n某些程序员为了方便，如果他们只需要值对象或实体中的某部分字段，就不会去费力填充所有字段。这种情况在实体上不太可能发生，因为它们通常是由\
  \ JPA 实现来填充的。根据我的经验，这种做法在构造期间节省了时间，但不可避免地会导致 bug，当某些程序尝试使用未填充的字段时，会表现为 `NullPointerException`\
  \ 异常。此外，值对象或实体的部分填充会创建出开发者会感到困惑的不一致性。我建议要么填充值对象的所有字段，要么创建一个设置了新字段的新值对象。\n\n### 始终准确地类型化字段\n\
  我经常看到程序员将日期和数字实现为字符串，通常是为了在初始编码值对象或实体时节省时间。这种动机是为了便于显示或特定过程的编码。但随着应用程序的变大，这种做法可能会引起混惑，并不可避免地在字段字段的地方产生额外的转换代码。它还会导致维护困难并引发\
  \ bug，因为有人会以不当的方式格式化字符串。\n\n### 检查值对象对第三方类的依赖\n值对象被用作分布式对象（如企业豆和 RMI 服务）的参数。如果你的值对象依赖于第三方类，你的调用者必须在类路径中包含它们才能调用你。这对你的调用者来说是一种不便，并使你的分布式对象更难使用。\n\
  \n### 始终重写方法 `toString()`\n如果不重写 `toString()`，生成的文本将毫无意义。`toString()` 默认实现的示例是 `com.myapp.Test@3179c3`。由于\
  \ JDK 中有足够的类接受 `Object` 参数并期望能够执行方法 `toString()`，因此你应该提供一个实现。继承自 `Object` 的 `toString()`\
  \ 实现并没有什么用。\n\n### 考虑重写方法 `equals()` 和 `hashcode()`\n如果值对象曾被用作 `HashMap`、`Hashtable`\
  \ 或 `HashSet` 的键，`equals()` 和 `hashcode()` 将用于键的标识。这些继承自 `Object` 的方法定义规定，要使两个值对象相等，它们必须字面上是同一个类实例。例如，考虑一个具有\
  \ `firstName` 和 `lastName` 字段的 `CustomerVO`。你可以有两个“John Doe”的实例，使用继承自 `Object` 的\
  \ `equals()` 它们看起来是不相等的。如果你希望值对象可以在任何 `Map` 实现中使用（如 `Hashtable`、`HashMap` 或 `TreeMap`），你必须同时重写\
  \ `equals()` 和 `hashcode()`。\n\n有意义的 `equals()` 实现与继承自 `Object` 的实现之间的行为差异让许多开发者感到困惑。9.2a\
  \ 中的示例应该有助于缓解任何困惑。\n\n### 列表 9.2a：示例 Object.equals() 实现\n\n```java\npublic void\
  \ showObjectEqualImplementation() {\n    ObjectWithoutEqualsImpl fiveAsObject =\
  \ new ObjectWithoutEqualsImpl(\"5\");\n    ObjectWithoutEqualsImpl anotherFiveAsObject\
  \ = new ObjectWithoutEqualsImpl(\"5\");\n    ObjectWithoutEqualsImpl sevenAsObject\
  \ = new ObjectWithoutEqualsImpl(\"7\");\n\n    System.out.println(\"Object equals()\
  \ demo:\");\n    System.out.println(\"\\tfiveAsObject.equals(anotherFiveAsObject):\
  \ \" + fiveAsObject.equals(anotherFiveAsObject));\n    System.out.println(\"\\tfiveAsObject.equals(sevenAsObject):\
  \ \" + fiveAsObject.equals(sevenAsObject));\n}\n```\n来源：`/src/j2ee/architect/handbook/chap09/sample1/EqualsDemonstration.java`\n\
  \n列表 9.2a 使用了一个没有重写 `equals()` 方法的简单类，并使用了继承自 `Object` 的实现。第 3 行声明的值 5 的变量应该与第 5\
  \ 行声明的对象“相等”。但是，如果你运行该示例，你会发现这些变量实际上并不被认为是相等。示例的输出在列表 9.2b 中。\n\n### 列表 9.2b：列表\
  \ 9.2a 的输出\n\n```text\nObject equals() demo:\nfiveAsObject.equals(anotherFiveAsObject):\
  \ false\nfiveAsObject.equals(sevenAsObject): false\n```\n\n如果你使用 `String` 类代替 `ObjectWithoutEqualsImpl`\
  \ 运行另一个示例，输出将更符合你的预期，因为 `String` 重写了 `equals()` 方法。\n\n\n\n\n\n`hashCode()` 方法返回一个整数，保证对于两个相等的\
  \ `Object` 实例，其哈希值一定相等。构建实现此算法的逻辑可能会非常复杂。幸运的是，Apache Commons Lang 产品 ([http://commons.apache.org/lang/])\
  \ 中的 `HashCodeBuilder` 类中已经实现了良好的 `hashcode` 逻辑实现。列表 9.3 展示了 `hashCode()` 的有效实现。\n\
  \n### 列表 9.3：示例 `hashCode()` 实现\n\n```java\n@Override\npublic int hashCode() {\n\
  \    return new HashCodeBuilder(17, 37)\n    append(this.salesRegion)\n    append(this.salesYear)\n\
  \    append(this.salesQuarter1)\n    append(this.salesQuarter2)\n    append(this.salesQuarter3)\n\
  \    append(this.salesQuarter4)\n    toHashCode();\n}\n```\nSource：`/src/j2ee/architect/handbook/chap09/sample1/SalesSummaryVO.java`\n\
  \n实现 `equals()` 的相似之处在于，我们再次利用了 Apache Commons Lang 产品。如列表 9.4 所示。\n\n### 列表 9.4：示例\
  \ `equals()` 实现\n\n```java\n@Override\npublic boolean equals(Object obj) {\n   \
  \ if (obj == null) { return false; }\n    if (obj == this) { return true; }\n  \
  \  if (obj.getClass() != getClass()) {\n        return false;\n    }\n    SalesSummaryVO\
  \ rhs = (SalesSummaryVO) obj;\n    return new EqualsBuilder()\n    .append(this.salesRegion,\
  \ rhs.salesRegion)\n    .append(this.salesYear, rhs.salesYear)\n    .append(this.salesQuarter1,\
  \ rhs.salesQuarter1)\n    .append(this.salesQuarter2, rhs.salesQuarter2)\n    .append(this.salesQuarter3,\
  \ rhs.salesQuarter3)\n    .append(this.salesQuarter4, rhs.salesQuarter4)\n    .isEquals();\n\
  }\n```\nSource：`/src/j2ee/architect/handbook/chap09/sample1/SalesSummaryVO.java`\n\
  \n考虑实现 `java.lang.Comparable`。如果你在排序集合（例如 `TreeSet` 或 `TreeMap`）中使用值对象，则你必须实现 `Comparable`\
  \ 以获得合理的排序结果。实现 `Comparable` 需要实现 `compareTo()` 方法，该方法在两个对象相等时返回 0，如果对象小于于传入的参数则返回负数，如果对象大于传入的参数则返回正数。幸运的是，Apache\
  \ Commons Lang 通过 `CompareToBuilder` 类为我们提供了帮助。列表 9.5 展示了这一点。\n\n### 列表 9.5：示例 `compareTo()`\
  \ 实现\n\n```java\npublic int compareTo(SalesSummaryVO o) {\n    return new CompareToBuilder()\n\
  \    .append(this.salesYear, o.salesYear)\n    .append(this.salesRegion, o.salesRegion)\n\
  \    .append(this.salesQuarter1, o.salesQuarter1)\n    .append(this.salesQuarter2,\
  \ o.salesQuarter2)\n    .append(this.salesQuarter3, o.salesQuarter3)\n    .append(this.salesQuarter4,\
  \ o.salesQuarter4)\n    .toComparison();\n}\n```\nSource：`/src/j2ee/architect/handbook/chap09/sample1/SalesSummaryVO.java`\n\
  \n### 让值对象变得简单\n\n我的这一建议清单让实现值对象变得极其无聊、枯燥且耗时。作为应用架构师，你可以选择在开发者遵循这些建议时指导他们，并希望他们能够一致地执行。另一个选项是提供架构工具，使编写值对象的代码变得更容易、更快速，并为值对象的行为带来某些一致性。\n\
  \n这些目标通过源码包中的 `BaseVO` 实现，这是我创建的一个为值对象提供架构支持的工具。如果值对象扩展了 `BaseVO`，它们将获得意义的 `equals()`、`hashCode()`\
  \ 和 `toString()` 以及自动的 `clone()` 实现。\n\n`BaseVO` 确实使用反射来实现其魔法，因此它比自定义代码的值对象慢。表 9.1\
  \ 展示了我们的示例 `SalesSummaryVO` 的性能比较。\n\n#### 表 9.1：BaseVO 执行 100,000 次操作的性能比较 (JDK\
  \ 1.7)\n\n| 版本 | 每 10 万次操作的毫秒数 | | | | |\n| :--- | :--- | :--- | :--- | :--- | :---\n\
  | | `clone()` | `toString()` | `hashCode()` | `equals()` |\n| VO 扩展 | 2214 ms |\
  \ 3511 ms | 829 ms | 940 ms |\n| 自定义 | 27 ms | 774 ms | 52 ms | 9 ms |\n\n对于该表，我随机选择了\
  \ 100,000 次迭代以使时间差异更加明显。大多数应用程序在每个事务中执行这些方法的次数会较少。\n\n通过使用 `BaseVO`，你用某些性能换取了开发和维护时间。应用程序中的大多数值对象使用这些操作的量足够，以至于\
  \ `BaseVO` 的速度成为问题。我建议你仅根据性能调优工作的结果，对你认为需要更快执行时间的极少数值对象编写自定义代码。\n\n此外，由于扩展 `BaseVO`\
  \ 的值对象只包含少量的逻辑（如果有的话），因此不需要测试用例。如果你选择提供自己的 `equals()`、`hashCode()` 和 `toString()`\
  \ 实现，则需要为这些方法编写测试用例。\n\n**警告：让实体扩展 BaseVO 是危险的。** 这样做有几个原因。实体通常与其他实体相关。当你引用它们时，会发出查询以查找相关实体。例如，一个客户可能有许多账户。当\
  \ `BaseVO` 使用反射制定 `toString()` 值时，它会访问所有账户。这会使 `BaseVO` 中的通用实现对实体变得昂。\n\n## 常见错误\n\
  \n**不一致地填充 VO。** 我见过某些应用程序中的值对象字段根据使用上下文填充不同的值集。例如，考虑一个包含姓名、地址、联系方式等几个字段的 `CustomerVO`。我见过开发者使用这种结构，但在特定的代码段中只填充姓名和地址，因为那是该代码段所需要的。这会导致开发者的困惑和\
  \ Bug，因为其他字段存在但在该代码段中无法依赖。为了消除困惑，最好创建一个仅包含该代码段字段的独立值对象。通常，这种做法是一个红旗，表明设计是面向过程而非面向对象的。\n\
  \n**使用空字符串来避免 NullPointerException。** 一些开发者会将所有字段初始化为空字符串或表示“空”但实际并非空的值，如下\n\n```java\n\
  private String _customerName = \"\";\n```\n\n虽然这种声明消除了 `NullPointerException` 异常，但它并不能防止后续出现其他类型的派生异常。这种做法类似于“把垃圾扫到地子底下”，最好避免。此外，如果你采用在所有保护和公共方法中验证所有参数的习惯，这种扫除是不必要的，因为收到的错误信息将是明确的。\n\
  \n**在实体或 VO 中嵌入格式假设。** 例如，某些开发者会返回表示日期或数字的字符串，因为那是展示层中显示的内容。不幸的是，这限制了实体或 VO 的重用性，因为不同应用程序甚至应用程序的不同部分所要求的显示格式可能会不同。这实际上违背了关注点分离原则，因为实体被赋予了显示职责，同时也承担了数据保留职责。将格式关注点留在展示层。\n\
  \n需要注意的是，将日期和时间表示为 `java.util.Date`以外的任何形式也是嵌入格式假设的例子。例如，某些开发者在 VO 或实体中使用 `java.sql.Date`\
  \ 或 `java.sql.Timestamp`；这些类为了与 JDBC 和数据库存储密切相关的目的封装了 `java.util.Date`。将这些格式关注点留在数据访问层，该层按定义需要关注存储问题。\n\
  \n\n\n\n\n双向地维护 VO（值对象）或实体的父子关系。例如，`CustomerEntity` 将包含一个 `AccountEntity` 类的集合，而每个\
  \ `AccountEntity` 实例将包含一个指向父对象的引用。通过这种做法你会遇到的问题与在关系型数据库中复制数据时相同。结果是在数据更改时，维护工作增加了一倍。此外，这种做法容易出错，并且往往是\
  \ Bug 的根源，包括内存泄漏。\n\n## 示例：Admin4J\n\nAdmin4J ([www.admin4j.net](http://www.admin4j.net))\
  \ 是一个开源产品，为开发人员提供基本的 Java EE 应用程序管理和支持功能。Admin4J 拥有多个用于辅助显示信息的值对象。\n\n正如本章建议的，所有值对象都继承自\
  \ `BaseVO`，并具有意义的 `toString()`、`equals()`、`hashCode()` 和 `clone()` 实现。继承 `BaseVO`\
  \ 的值对象示例可以在列表 9.5 中找到。\n\n### 列表 9.6：来自 Admin4J 的 PerformanceSummaryVO 值对象\n\n![](img/00038.jpeg)\n\
  \n来源：Admin4J 源代码发行 (www.admin4j.net)\n\n如所述，该值对象依赖于基础值对象类，该类提供了 `toString()`、`equals()`、`hashCode()`\
  \ 和 `clone()` 的意义实现。该类的源码可以在列表 9.6 中找到。\n\n### 列表 9.7：来自 Admin4J 的 BaseVO 值对象\n\n\
  ![](img/00039.jpeg)\n\n来源：Admin4J 源代码发行 (www.admin4j.net)\n\n注意，`BaseVO` 类利用了 Apache\
  \ Commons Lang 中的各种构建器类。\n\nAdmin4J 的某些值对象为了性能考虑对 `equals()` 和 `hashCode()` 进行了自定义重写。例如，值对象类\
  \ `FileWrapperVO` 对 `equals()` 和 `hashCode()` 都有自定义重写。列表 9.7 包含了这两个重写方法的源码。\n\n\
  ### 列表 9.8：FileWrapperVO 对象的 equals() 和 hashCode() 重写\n\n![](img/00040.jpeg)\n\n\
  来源：Admin4J 源代码发行 (www.admin4j.net)\n\n## 与第一版的区别\n\n本书的第一版引入了一种技术，让值对象为了错误日志记录提供自身的文本描述。这是通过让值对象实现\
  \ `Describable` 接口实现的。其目标是标准化包含在异常中的描述，以减少在格式化异常文本时出现格式错误的概率。\n\n今天，有一种好得多且侵入性更小的方法来实现相同的目标。随着\
  \ Apache Commons Lang 3.0 版本引入了两种异常：`ContextedException` 和 `ContextedRuntimeException`，这些都是我贡献的。这些异常使得能够轻松且安全地在抛出的异常中包含额外信息，而无需担心在格式化错误消息时意外发生异常。正如你可能猜到的，`ContextedException`\
  \ 是受检异常（checked），而 `ContextedRuntimeException` 则不是。\n\n使用这些异常的示例可以在列表 9.8 中找到。\n\
  \n### 列表 9.9：ContextedRuntimeException 使用示例\n\n```\ntry {\n  ...\n} catch (Exception\
  \ e) {\n  throw new ContextedRuntimeException(\"Error posting account transaction\"\
  , e)\n    .addContextValue(\"Account Number\", accountNumber)\n    .addContextValue(\"\
  Amount Posted\", amountPosted)\n    .addContextValue(\"Previous Balance\", previousBalance)\n\
  }\n```\n\n此示例将产生与列表 9.9 类似的消息。\n\n### 列表 9.10：ContextedRuntimeException 输出示例\n\n\
  ```\norg.apache.commons.lang3.exception.ContextedRuntimeException: java.lang.Exception:\
  \ Error posting account transaction\nException Context:\n[1:Account Number=null]\n\
  [2:Amount Posted=100.00]\n[3:Previous Balance=-2.17]\n---------------------------------\n\
  at org.apache.commons.lang3.exception.ContextedRuntimeExceptionTest.testAddValue(ContextedExceptionTest.java:88)\n\
  ..... (其余堆栈信息)\n```\n\n上下文化异常是空安全的，甚至可以捕获由于 `toString()` 实现发生异常的故障值所产生的错误。\n\n![stock-photo-17860137-binary-code-bw-horiz-slice.tif](img/00003.jpeg)\n\
  \n# 第 10 章\n\n## 构建数据访问对象\n\n数据访问对象（DAO）负责读取和写入保存的数据，并将该格式转换为应用程序其他层可使用的实体。你可以将它们视为实体的“工厂”类。例如，采购应用程序中的\
  \ DAO `CustomerDAO` 负责从数据库或其他形式的保存存储中读取客户信息，并将这些信息转换为应用程序其他部分可以使用实体（例如 `CustomerEntity`）。`CustomerDAO`\
  \ 还使用 `CustomerEntity` 中的信息来更新或插入数据库或文件中的数据。以下是 `CustomerDAO` 可能具有的方法：\n\n```\n\
  public CustomerEntity findById(Long customerId);\npublic void saveOrUpdate(CustomerEntity\
  \ customer);\npublic void delete(Long customerId);\npublic List<CustomerEntity>\
  \ findByPartialName(String name);\n```\n\n所有解释和处理这些数据的逻辑都在业务逻辑层，而不是在数据访问对象层。DAO\
  \ 仅处理 I/O。需要注意的是，虽然 DAO 中的大多数类目标是关系型数据库，但任何形式的持久存储都应该在数据访问层进行管理。换句话说，对 NoSQL 数据库的访问也位于数据访问层。分离数据访问有几个原因。\n\
  \n首先，它促进了重用。例如，应用程序中可能有多个用例需要读取和处理采购订单信息。分离数据访问使得示例 DAO 能够被所有这些过程使用。\n\n其次，结合你的包结构（将\
  \ DAO 类分离到单独的包中），允许开发者快速找到可能需要更改的数据访问。\n\n第三，它便于在不影响应用程序其他部分的情况下更改你的存储方法。例如，我的一个客户从使用\
  \ Sybase 迁移到 Oracle。在分离了数据访问的应用程序中，迁移相对容易。此外，从维护的角度来看，很容易定位、修改和增强数据访问层以处理细微变化，例如添加列。\n\
  \n图 10.1 展示了 DAO 在软件层层级结构中的作用\n\n![Chap-11-SoftwareLayers-DAO.eps](img/00041.jpeg)\n\
  \n大多数应用程序中的大多数 DAO 类都是关系型数据库 DAO；也就是说，它们使用 Oracle 或 Microsoft SQL Server 等关系型数据库读取和写入数据。如果你的应用程序使用如\
  \ Hibernate 的 JPA 实现，DAO 类将是你会发现依赖 Hibernate 代码的地方。理想情况下，应用程序的其他层（例如业务逻辑层）永远不会引用\
  \ Hibernate 类。如果你的应用程序使用 JDBC，DAO 类将是你会找到所有对 JDBC 类引用的地方。\n\n## 事务管理策略\n\n所有 Java\
  \ EE 应用程序都需要事务管理策略。即定义何时发布提交和回滚的策略。有三种通用的策略可用：Servlet Filter 策略、面向切面编程（AOP）策略和自动提交策略。\n\
  \nServlet Filter 策略使用 Servlet 过滤器，它在所有 Web 事务上执行，对成功的事务执行提交，对所有异常的事务执行回滚。列表 10.1\
  \ 包含了该策略的短示例。注意，在此示例中，`TransactionContext` 类保留了当前的 Hibernate 会话并供数据访问类使用。如果使用 JDBC\
  \ 持久策略，可以很容易使用类似的模式保留原生 JDBC 连接。\n\n### 列表 10.1：事务管理过滤器逻辑示例\n\n![listing10.1.tif](img/00042.jpeg)\n\
  \n来源：`/src/j2ee/architect/handbook/chap10/TransactionManagementFilter.java`\n\n\n\
  \n\n\nAOP 策略使用了面向切面的技术，例如 `AspectJ`（[`www.eclipse.org/aspectj/`](http://www.eclipse.org/aspectj/)），用于用\
  \ `commit` 和 `rollback` 逻辑封装数据访问类中的方法。通常情况下，这种方法的粒度太细，没有实用价值。虽然可以解决粒度问题，并花时间规划哪些类需要事务管理，但这可能会给开发者带来困惑。并不清楚哪些类方法包含事务管理逻辑，哪些不包含。由此产生的困惑所花费的时间和精力往往比使用\
  \ AOP 策略节省的开发时间更多。\n\n自动提交（Autocommit）策略在初始开发阶段最为方便。通常在 JDBC 驱动程序配置级别，可以将所有连接默认设置为“自动提交”。使用这种策略，JDBC\
  \ 驱动程序会在 SQL 语句执行成功后自动发布“commit”，事务失败后发布“rollback”。这种策略与 AOP 策略存在相同的问题，即对于大多数 Java\
  \ EE 应用来说，它的粒度太细，没有实用价值。\n\n正如你可能猜到的那样，我倾向于使用 Servlet Filter 策略进行事务管理。它非常简单。它减轻了开发者对事务管理问题的关注。如果某个特定的\
  \ Web 事务需要多个工作单元，该策略可以在需要时实现这一点。它可以在多个应用程序中轻松地复用。\n\n你可能会注意到，事务状态实际上保留在 `TransactionContext`\
  \ 类中。这允许其他类在需要时管理事务状态。例如，批处理作业和 JMS 队列监控器需要 Servlet Filter 无法解决的事务管理。\n\n注意，Servlet\
  \ Filter 和 AOP 事务策略可以很容易与其他事务管理产品结合，例如 Bitronix（[`docs.codehaus.org/display/BTM/Home`](http://docs.codehaus.org/display/BTM/Home)）、Atomikos（[`www.atomikos.com/`](http://www.atomikos.com/)）或\
  \ JOTM (jotm.objectweb.org)。事务管理产品为使用多个数据源的应用提供了 `commit` 和 `rollback` 策略；某些应用具有此类需求。\n\
  \n## 数据访问对象编码规范\n\n由于如今大多数人使用 `Hibernate` 等 JPA 实现来实现数据库持久化，让我们从如列表 10.2 这样的 `Hibernate`\
  \ 示例开始。\n\n### 列表 10.2：Hibernate DAO 示例\n\n![listing10.2.tif](img/00043.jpeg)\n\n\
  源：`/src/j2ee/architect/handbook/chap10/hibernate/CustomerHibernateDAO.java`\n\n\
  注意，此 DAO 继承了 `BaseHibernateDAO` 类，该类暴露了当前的 `Hibernate` 会话。该类在源码发行版可用。\n\n`DAO` 类不发布\
  \ `commits`、`rollbacks` 或保存点。这种一致性使得 `DAO` 类更容易在多个用例中复用。我可以想象几个需要通过 `id` 查找客户的用例，并且这种查找可能在一个较大工作单元的中间发生。如果\
  \ DAO 发布了 `commit` 或 `rollback`，它将有效地干扰这个较大的工作单元。此外，哪些 `DAOs` 发布了 `commit` 或 `rollback`\
  \ 并没有良好的文档说明。这种不一致性会浪费开发者的时间，因为并不清楚特定的事务是在何时开始和结束的。\n\n`DAO` 类仅引用实体、架构组件/工具类和其他\
  \ `DAO` 类。`DAO` 类不引用业务逻辑层、表示层或部署层中的类。这强制了关注点分离，并符合分层架构。\n\n**对公共和受保护的方法进行参数验证。**\
  \ 另一种方案是允许方法产生某种类型的派生异常（如 `NullPointerException`），这通常需要更多时间来诊断和修复。此外，验证是快速的，很少会显著影响性能。注意，Apache\
  \ Commons Lang 项目中的 `Validate` 工具类对于此目的非常有效。\n\n## 一个 JDBC 示例\n\n在早期，我们都学习了原生 `JDBC`。事实上，对原生\
  \ `JDBC` 的知识有助于开发者诊断通常来自 `DAO` 类的错误。尽管如此，如今编写原生 `JDBC` 代码的情况非常少见。更常见的是利用 JDBC 辅助工具类，例如\
  \ Apache Commons `DBUtils`（[`commons.apache.org/dbutils/`](http://commons.apache.org/dbutils/)）项目以为了方便。例如，列表\
  \ 10.3 展示了一个利用 `DBUtils` 方便的 `JDBC` 示例。\n\n### 列表 10.3：JDBC DAO 示例\n\n![listing10.3.tif](img/00044.jpeg)\n\
  \n源：`/src/j2ee/architect/handbook/chap10/jdbc/CustomerJdbcDAO.java`\n\n注意，此 DAO\
  \ 继承了 `BaseJDBCDAO` 类，该类暴露了当前的 `JDBC Connection`，并方便了使用 `DBUtils` 执行 SQL 语句。此外，此示例依赖于\
  \ `CustomerResultSetHandler` 类，它是用于查询结果的 `ResultSetHandler` 接口的实现。这些类在源码发行版可用。\n\
  \n**在方法内部创建的 JDBC 对象应该在同一个方法内关闭。** 这类对象包括 `PreparedStatement`、`Statement`、`ResultSet`、`CallableStatement`\
  \ 对象。对于许多数据库平台，为了避免资源泄漏，在使用完毕后必须关闭 `ResultSet`、`PreparedStatement`、`CallableStatement`\
  \ 和 `Statement` 对象。某些 JDBC 驱动程序在 `Connection` 关闭时会自动关闭这些对象，而某些则不会。如果你采用在*此层级*关闭你所创建的所有对象的习惯，稍后发现资源泄漏相关的\
  \ bug 会变得更容易。注意 `DBUtils` 库提供了执行此操作的工具类。\n\n**在 SQL 语句中使用主机变量而不是硬编码字面量。** `DBUtils`\
  \ 采用了这种做法。为了方便，许多开发者在 SQL 语句中嵌入字面量。列表 10.4 是嵌入字面量的错误示例。注意此示例将客户 ID 直接放置在 SQL 语句中。同样注意此示例使用了\
  \ `+` 运算符进行字符串拼接。虽然使用 `+` 很方便，但你可以使用 `StringBuffer` 和 `append()` 方法更快地拼接字符串。\n\n\
  ### 列表 10.4：编写错误的更新语句\n\n```java\nsqlText = “update Customer “ +\n“set Last_Name\
  \ = ‘” + customer.getLastName() +\n“’, First_Name = ‘” + customer.getFirstName()\
  \ +\n“’, Middle_Initial = ‘” + customer.getMiddleInitial() +\n“’ where Customer_Id\
  \ = “ + customer.getCustomerId();\n\nthis.update(sqlText);\n```\n\n列表 10.4 代码的问题在于它绕过了\
  \ Oracle 等许多数据库提供的优化支持。为了获得数据库优化的优势，对于多次执行的 SQL，你需要使用 `PreparedStatement` 对象 own\
  \ `Statement` 对象。此外，对于执行之间变化的字面量，你需要使用主机变量代替字面量。在列表 10.4 中，ID 为 1 的客户 SQL 语句与 ID\
  \ 为 2 的客户不同（“where Customer_Id = 1”不同于“where Customer_Id = 2”）。列表 10.3 中更新语句的原始版本好得多。\n\
  \n注意，由于列表 10.3 使用主机变量而不是字面量，无论标识用户 ID 是多少，SQL 语句都是相同的。此外，它使用 `PreparedStatement`\
  \ 代替 `Statement`。\n\n为了更好地理解使用 `PreparedStatement` 对象可能的数据库优化，请考虑 Oracle 处理 SQL\
  \ 语句的方式：\n\n1.  在共享池中查找语句，查看其是否已经过解析或解释。如果是，直接跳转到第 4 步。\n2.  解析（或解释）语句。\n3.  计算如何获取数据并将信息记录在称为共享池的内存中。\n\
  4.  获取数据。\n\n\n\n\n当 Oracle 查找 SQL 语句以检查其是否已经执行（步骤 1）时，它会尝试对 SQL 语句进行逐字符匹配。如果程序找到匹配项，它可以使用共享池（shared\
  \ pool）中已有的解析信息，而无需执行步骤 2 和 3，因为这些工作已经完成了。如果你在 SQL 语句中硬编码字面量，找到匹配项的概率非常低（“where\
  \ Customer_Id = 1”与“where Customer_Id = 2”是不相同的）。这意味着 Oracle 将不得不为每个选择的投资组合重新解析列表\
  \ 10.4 中的语句。如果列表 10.4 使用了主机变量和 `PreparedStatement`，那么 SQL 语句（在共享池中看起来类似于“where Customer_Id\
  \ = :1”）将只被解析一次。\n\n`DB2/UDB` 对动态 SQL 语句使用了不同的术语，但算法相似。对于 DB2/UDB，同样建议使用 `PreparedStatement`\
  \ 代替 `Statement`。\n\n### 整合 SQL 语句字符串的构建。\n作为一名以前的数据库管理员，我花费大量时间阅读他人编写的代码，并建议改进性能的方法。正如你所预料的，我对\
  \ SQL 语句特别感兴趣。我发现，追踪分散在多个方法中的字符串操作所构建的 SQL 语句非常困难。如果将构建 SQL 语句的逻辑整合，将极大提高可读性。\n\n\
  列表 10.5a 是这一点的良好说明。请注意，构建 SQL 语句的字符串操作位于一处。SQL 字符串也是静态定义的，以减少字符串拼接的次数。\n\n列表 10.5a：为日期字段使用字符串主机变量：\n\
  \n```sql\nSelect sum(sale_price)\nFrom purchase_order\nWhere to_char(sale_dt,’YYYY-MM-DD’)\
  \ >= ?\n```\n\n### 限制列函数的使用。\n尽量将对列函数的使用限制在 `select` 语句的选择列表（select lists）中。此外，对于使用“group\
  \ by”子句的 `select` 语句，仅使用所需的聚合函数（例如 `count`、`sum` 和 `average`）。此此建议有两个原因：性能和可移植性。\n\
  \n当你将函数的使用限制在选择列表中（并将其排除在“where”子句之外）时，可以使用该函数而不会阻塞索引的使用。正如列表 10.5a 中的 `to_char`\
  \ 函数阻止数据库使用索引一样，“where”子句中的列函数极可能也会阻止数据库使用索引。这将导致查询性能变慢。如列表 10.5b 所示，重写 SQL 语句允许大多数数据库使用索引。\n\
  \n列表 10.5b：使用 java.sql.Timestamp 作为主机变量的查询：\n\n```sql\nSelect sum(sale_price)\n\
  From purchase_order\nWhere sale_dt >= ?\n```\n\n此外，开发者使用 SQL 列函数进行的许多操作（数据类型转换、值格式化等）在\
  \ Java 中执行比在数据库中执行更快快。在许多应用程序中，通过避免某些列函数并在 Java 中实现这些逻辑，我曾获得 5% 到 20% 的性能提升。从另一个角度来看，你无法对列函数进行调，因为你无法控制源代码。通过在\
  \ Java 中实现该逻辑，你创建了在需要时可以调优的代码。\n\n此外，使用非 ANSI 标准的列函数还会导致可移植性问题。并不是所有的数据库供应商都实现相同的列函数。例如，我最喜欢的\
  \ Oracle 列函数之一 `decode`（它允许你将一组值翻译成另一组值）在许多其他主流数据库平台中并没有实现。通常，使用像 `decode` 这样的列函数具有成为可移植性问题的可能。\n\
  \n### 始终在插入语句中指定列列表。\n许多开发者使用省略 `insert` 语句中列列表的快捷方法，以避免输入列列表。默认情况下，列的顺序与表中物理定义的顺序相同。列表\
  \ 10.6a 说明了这种快捷方法，而列表 10.6b 说明了显式列出所需列的替代方案。\n\n列表 10.6a：没有列列表的插入 语句：\n\n```sql\n\
  Insert into customer\nValues (‘Ashmore’,’Derek’,’3023 N.Clark’,’Chicago’,’IL’, 555555)\n\
  ```\n\n列表 10.6b：带有列列表的完整插入 语句：\n\n```sql\nInsert into customer\n(last_nm, first_nm,\
  \ address, city, state, customer_nbr)\nValues (?,?,?,?,?,?)\n```\n\n如列表 10.6b 所示，在\
  \ `insert` 语句中显式列出列的原因与在 `select` 语句中显式列出列的原因相同。如果有人重新排列了 `insert` 中任何表的列或添加了新列，`insert`\
  \ 可能会产生异常，你必须修改 `insert` 语句。例如，假设数据库管理员再次更改列的顺序，将 `CUSTOMER_NBR` 放在第一，并添加了一个名为 `COUNTRY`\
  \ 的列。使用快捷方法的开发者将不得不更改代码。而显式列出所有列的开发者对这种变化感知，因为代码仍然可以工作。此外，注意列表 10.6b 使用了主机变量，因此如果有多次插入，可以使用同一个\
  \ `PreparedStatement`。\n\n与 `select` 语句一样，在 `insert` 语句中显式列出列是一种最佳实践，因为可以消除维护需求。此外，允许重用\
  \ `PreparedStatement` 可以提高性能，特别是对于大量行的插入。\n\n### 为所有 DAO 方法编写代码测试用例，并将它们放入测试套件中。\n\
  你应该能够随时对数据访问层中的所有对象运行回归测试。这通过自动化合理的测试过程提高了产品质量。\n\n为 定义一个管理 DAO 测试用例所需数据的标准方法。\n\
  DAO 测试用例依赖于开发测试时使用的数据。如果数据发生变化，测试可能会失败，但不是因为代码缺陷。测试数据和 DAO 测试用例需要保持同步。我成功使用的一个辅助解决此问题的工具集是开源产品\
  \ DbUnit（[www.dbunit.org](http://www.dbunit.org)）。还有其他工具集可以解决此问题。\n\n#### XML 访问对象编码指南\n\
  数据访问对象（DAO）是读取和写入持久化数据的类。XML 操作由于它实际上是一种数据访问操作，因此是 DAO 层的一部分。XML 访问对象（XAO）以 XML\
  \ 格式读取和写入数据，并将该格式转换为应用程序其他层可以使用的值对象。例如，在 Admin4J 产品中找到的 XML 访问对象可以在列表 10.7 中看到。\n\
  \n列表 10.7：来自 Admin4J 的 XML 访问对象接口：\n\n```java\npublic interface TaskTimerDAO {\n\
  \    public Set<TaskTimer> findAll();\n    public void saveAll(Set<TaskTimer> exceptionList);\n\
  }\n```\n\n业务对象使用 XAO 来解释和产生 XML 数据。通常，XAOs 与处理数据相关的业务规则的实现关系较少。分离 XML 相关代码是为了限制\
  \ XML 结构变化对应用程序的影响。如果这些逻辑分散在业务逻辑层的各个地方（例如），查找和更改将困难得多。\n\n作为应用程序架构师，你负责制定编码标准和指南。本章提供了构建\
  \ XAO 的实现指导和示例。此外，我将向你展示一种生成 XAO 可以轻松使用的代码的方法，从而节省你的开发和维护时间。\n\n\n\n\n目前有很多 XML\
  \ 产品可以方便读取和创建 XML。然而，它们通常属于以下几类之一：基于 DOM 的、基于反射的基于代码生成的。基于 DOM 的技术直接基于文档对象模型（包 `org.w3c.dom`），该包现在已包含在\
  \ JDK 中。由于原生的 `Dom` 代码既冗长又难用，因此使用互补技术（如 `JDom`（[`www.jdom.org/`](http://www.jdom.org/)））通常比直接使用\
  \ DOM 解析器更好。\n\n基于反射的 XML 产品利用反射从 Java 对象生成 XML，并将 XML 转换为 Java 对象以便读取。JDK 中包含了一个基于反射的\
  \ XML 产品示例，位于 `java.beans.XMLEncoder` 和 `java.beans.XMLDecoder` 类中。\n\n另一个基于反射的\
  \ XML 产品示例是 `Castor XML`（[www.castor.org](http://www.castor.org)）。\n\n基于代码生成的 XML\
  \ 产品使用 schema 或 DTD 并生成代表这些 XML 构造 Java 类，同时将这些 Java 类转换为 XML，或将 XML 转换为这些生成类的实例。`Apache\
  \ XML Beans`（[`xmlbeans.apache.org/`](http://xmlbeans.apache.org/)) 产品是此类技术的良好示例。\n\
  \n**避免直接使用 DOM 来解释 XML 数据。** 使用 `XML Beans` 或 `JDOM` 等互补技术来开发应用程序，比直接使用 DOM 解析器更快且更容易维护。\n\
  \n**我倾向于使用 XML Beans，它能生成 Java 源代码，可以读取、解释和序列化符合给定 schema 的 XML 文档。** `XML Beans`\
  \ 的优势在于它可以将 XML 文档映射为开发者易用的 Java 类，而且 `XML Beans` 的学习曲线非常短。\n\n**在整个应用程序中始终使用 XML\
  \ 技术。**无论你选择什么技术，一致性都有巨大的好处。例如，如果你的应用程序开发者倾向于 `JDOM` 并对该选择感到满意，那么你没有理由使用 `XML Beans`。一致性使应用程序更容易维护，因为减少了维护人员所需的技能组合。一致性还能减少调查故障的时间，因为维护人员可以从基础结构理解开始。\n\
  \n**将 XML 相关的代码放在单独的类中。** 将 XML 相关类与实现业务规则的类分离的原因之一是保护你的应用程序不受 XML 文档结构变化的影响。另一个原因是分离\
  \ XML 文档解释和业务逻辑可以产生更简洁的代码。此外，如果多个应用程序必须读取和解释相同的 XML 文档格式，保持 XML 相关的代码分离将更容易在应用程序之间共享这些代码。\n\
  \n## 一个 XAO 示例\n\n`Admin4J` 使用了 JDK 自带的基于反射的 `XMLEncoder` 和 `XMLDecoder`。列表 10.7\
  \ 中接口实现在名为 `TaskTimerDAOXml` 的类中，该类太大，无法在此完整打印。源代码包含在 `Admin4J` 的下载包中，可以在 [www.admin4j.net](http://www.admin4j.net)\
  \ 获取。\n\n列表 10.8 是 `TaskTimerDAOXml` 的节录，说明了如何使用 `XMLDecoder` 读取 XML 并将其转换为 Java\
  \ 类。\n\n列表 10.8：XMLDecoder 示例\n\n```\ndecoder = new XMLDecoder(\n\nnew BufferedInputStream(\n\
  \nnew FileInputStream(xmlFileName)));\ndecoder.setExceptionListener(\n\nnew DefaultExceptionListener(xmlFileName));\n\
  result = (Set<TaskTimer>)decoder.readObject();\n```\n\n列表 10.9：XMLEncoder 示例\n\n\
  ```\nencoder = new XMLEncoder(\n\nnew BufferedOutputStream(\n\nnew FileOutputStream(tempFileName)));\n\
  encoder.setExceptionListener(\n\nnew DefaultExceptionListener(xmlFileName));\nencoder.setPersistenceDelegate(BasicTaskTimer.class,\n\
  \nnew DefaultPersistenceDelegate(\n\nnew String[]{“label”,”dataMeasures”}));\nencoder.setPersistenceDelegate(SummaryDataMeasure.class,\n\
  \nnew DefaultPersistenceDelegate(\n\nnew String[]{“firstObservationTime”}));\nencoder.writeObject(exceptionList);\n\
  encoder.close();\n```\n\n## 扩展阅读\n\nAlur, Deepak, John Crupi, and Dan Malks. 2001\\\
  . *Core J2EE Patterns: Best Practices and Design Strategies.* New York: Prentice\
  \ Hall.\n\nHorstmann, Cay S., and Gary Cornell. 2008\\. *Core Java 2, Volume II:\
  \ Advanced Features, 8th ed.* Essex, UK: Pearson Higher Education.\n\nJohnson, Rod.\
  \ 2002\\. *Expert One-on-One: J2EE Design and Development.* Indianapolis, IN: Wrox\
  \ Press.\n\n![stock-photo-17860137-binary-code-bw-horiz-slice.tif](img/00003.jpeg)\n\
  \n# 第 11 章\n\n## 构建业务对象\n\nJava EE 应用程序的业务逻辑层将数据与应用逻辑、业务规则、约束和活动结合。我通常单独封装业务对象以最大化重用可能性。业务对象使用并协调多个数据访问对象的活动是常见的。图\
  \ 11.1 展示了业务对象在分层架构中是如何工作的。\n\n图 11.1：分层架构中的业务对象\n\n![Chap-12-SoftwareLayers - Business\
  \ Logic.eps](img/00045.jpeg)\n\n业务对象被展示层或部署层的其他业务对象或类使用，例如企业 Bean 或 Web 服务。它们经常实例化并使用数据访问层的类，如前两章讨论的类。\n\
  \n## 业务对象编码模式\n\n常用的第一个且最简单的编码模式是 `[Fowler]` 描述的事务脚本模式模式。该模式将应用程序代码组织成一系列离散的事务。例如，考虑你在\
  \ ATM 机上进行的正常银行交易。在我输入密码之后，可能有一个事务脚本来验证我输入的密码是否属于我出示的卡。在我取款之后，可能有一个事务脚本来验证我的账户余额、记录取款交易并告诉\
  \ ATM 机吐出现金。事实上，我在 ATM 机上可以执行的每一个操作都可以分为一系列离散的事务。\n\n事务脚本模式被许多人认为过于简单。由于我见过比我想要的任意复杂的代码（例如，面条代码），我将简单视为一种优点而非缺点。对于简单到中等复杂的任务，事务脚本模式是完全合适的。所有业务应用程序无论大小如何，都有属于简单到中等复杂类的任务。事实上，大多数应用程序的大多数功能都属于这一类。\n\
  \n\n\n\n使用事务脚本（Transaction Script）模式可以重用代码。在大型业务应用程序中，某些事务将是复合事务。也就是说，它们将利用其他现有的事务。回到\
  \ ATM 示例，一个“记录交易”的脚本完全可以被用于“存款”事务脚本以及“取款”事务脚本。\n\n虽然复杂任务可以被写成一系列大型且复杂的事务脚本，但这些脚本会变得很脆弱且更难以维护。是的，你可以通过单元测试支持在某种程度上缓解这一点。但那些对事务脚本模式持否定态度的专家指出它具有局限性，这种观点是正确的。在大型业务应用程序中，某些功能对于事务脚本模式来说确实太复杂，需要更面向对象的方法，这很常见。分层架构的优妙之处在于，事务脚本代码和面向对象的代码可以共存。也就是说，对于真正需要的功能，可以使用更高级的模式，而对于简单的功能则使用事务脚本。目前没有客观的算法来决定哪些功能对于事务脚本来说太复杂，哪些需要更高级的编码模式。\n\
  \n# 业务对象编码指南\n\n绝不要在业务逻辑层的对象中放置任何特定于部署的内容。业务对象应该能够在任何上下文中（例如 Web 事务、Web 服务或批处理作业）无需更改地重用。这使得业务逻辑免受部署或表示层变化和开发的影响，而这些层的变化比任何其他层都快。\n\
  \n为了保持业务对象的独立性，业务对象不引用表示层类，也不对它们调用的上下文（事务管理除外）做任何假设。它们可以假设自己是在事务的上下文中执行的，因为事务管理通常发生在部署点。\n\
  \n许多 Java EE 书籍都指引你将业务逻辑直接整合到 Enterprise Bean 中。我不赞同这种观点，因为在过去的几年里，部署方法的变化非常快。其次，Enterprise\
  \ Bean 的使用在过去几年中已经减少，并且在许多情况下被认为是不必要的复杂性。\n\n所有公共方法都应该显式地验证参数。如果不这样做，你将面临产生派生异常（例如\
  \ `NullPointerException`）的巨大风险，这可能花费更长时间来调试和修复。如果你生成一个带有清晰消息的 `IllegalArgumentException`，那么部署层或调用你的业务对象中的编程错误将更有可能在单元测试中被捕获。\n\
  \n**为业务层和数据访问层类的实例化始终保持一致的策略。** 常见的策略包括借助反转控制（IOC）软件进行自动装配，或使用工厂模式。\n\n工厂模式由使用工厂类来实例化类组成，如图\
  \ 11.2 所示。\n\n图 11.2：在分层架构中使用业务对象\n\n![Chap-12-Factory-Pattern-ClassDiagram.eps](img/00046.jpeg)\n\
  \n工厂模式整合了实例化和配置的责任，并减轻了应用程序其他部分的这方面的负担。在最简单的情况下，工厂模式仅仅实例化类，例如通过 `new` 关键字。对于更复杂的应用程序，它可能需要查询应用程序的配置以决定产生哪种具体类。\n\
  \nIOC 软件产品，如 Guice ([`code.google.com/p/google-guice/`](http://code.google.com/p/google-guice/))\
  \ 或 Spring ([`www.springsource.org/`](http://www.springsource.org/))，为你提供了配置应用程序的方法，通过控制在应用程序特定安装中使用哪些具体类实现。IOC\
  \ 软件产品减少了管理应用程序配置所需的自定义代码量。IOC 软件产品还简化了一些单元测试代码，因为它们允许你轻松地存根（stub）当前未测试的类。可以将 IOC\
  \ 软件产品的使用与工厂模式相结合。\n\nIOC 产品的使用强制要求使用接口来解耦类依赖。这有有利也有弊。解耦往往会使类更具重用性；然而，它也降低开发环境提供调用层次信息的能力（即关于哪些类调用了具体类的给定方法的信息）。这种信息对开发者来说极其有用，不应轻率牺牲。\n\
  \n许多人认为使用 IOC 软件产品是必不可少的，并在他们的每个项目中一致地使用它们。我不赞同这种观点。IOC 软件产品引入的复杂性需要相应的收益来抵消这种成本。具有需要使用不同实现类的配置选项的应用程序可能会从使用\
  \ IOC 软件中受益。例如：支持多个数据库平台的应用程序可能需要不同的 DAO 实现类。同样，如果你为了单元测试目的对数据访问层类或业务层类进行存根，可能会从使用\
  \ IOC 产品受益。另一个需要考虑的因素是，IOC 配置错误并不总是容易找到和修复。\n\n无论你使用哪种策略，在整个应用程序中一致使用它都是关重要的。为业务或数据访问层类提供多种方法会导致开发者之间的困惑，并引入不必要的复杂性。\n\
  \n**业务层向无状态类的趋势。** 也就是说，趋向于使用事务脚本模式。Web 应用程序的状态（例如，除了当前执行代码所需的局部变量之外，用户正在进行的工作知识）更适合以实体或值对象类的形式保留在会\
  \ 中。在业务层或其他层保留额外的状态副本会增加不必要的复杂性，因为保持这些额外副本更新需要额外的代码并违反了 DRY 原则（不要重复）。相反，根据需要将信息传递给业务层以执行特定任务。\n\
  \n### 业务层类示例\n\n列表 11.1 包含示例业务层类的代码片段。它管理客户的删除。在这个示例中：\n\n列表 11.1：业务层类片段\n\n![listing11.1.tif](img/00047.jpeg)\n\
  \n来源：`src/j2ee/architect/handbook/chap11/Customer.java`\n\n注意，此示例遵循了本章描述的所有指南。它对执行上下文没有做任何假设。此方法是无状态的，可以从\
  \ Web 事务、Web 服务、批处理作业或任何上下文执行。\n\n此方法验证其参数，如果由于某种编程错误导致方法参数无效，则抛出未捕获异常。然后，此方法进一步从业务角度验证该客户是否可以被删除。在这个示例中，业务处理异常是一个检查异常，调用者必须处理它。在此层级，无论执行上下文如何，验证都放在这里。如果这在\
  \ Web 事务中使用，应用程序可能会将错误显示给用户以便其解决。如果这在 Web 服务中使用，这些错误可能会在响应中传递给调用者。\n\n\n\n此类将所有数据访问类的实例化委托给一个工厂类（`DAOFactory`）。该工厂类可以使用\
  \ IOC 技术或其他其他方法来实例化请求的数据访问类。用于配置数据访问层的内容不会影响此业务层方法，也不会以任何方式影响其运行方式。\n\n# 一个 Admin4J\
  \ 业务层级示例\n\n在上一个章节中，我们展示了 Admin4J 异常摘要功能的类图。该图重现在图 11.3 中。`ExceptionTracker` 类是提供这些功能的中心业务层类。我们将关注此类作为业务层代码的另一个示例。\n\
  \n### 图 11.3：在分层架构中使用业务对象\n![Chap-12-Admin4J-Business-Logic-Admin4JClassDiagram.eps](img/00048.jpeg)\n\
  \nAdmin4J 的第一个示例是跟踪应用程序生成的异常的业务层方法。该方法位于列表 11.2 中。\n\n### 列表 11.2：Admin4J 业务层类摘\n\
