  - 第四章：设计外部接口
- - '##'
  - 外部接口带来了稳定性。
- - '##'
  - 外部接口会导致应用程序故障。
- - '##'
  - 外部接口更改（例如产品升级或增强）可能使应用程序发生变更。
- - '##'
  - 外部接口增加了开发和复杂性。
- - '##'
  - 由于需要团队之外的人员，开发和支持会影响。
- - '##'
  - 外部接口易于确定哪个应用程序拥有特定的。
- - '##'
  - 许多方法可以减少外部接口带来的复杂性。
- - '#'
  - 架构师应促进接口设计。
- - '##'
  - 接口设计与平台很大无关。
- - '##'
  - 外部接口使用的平台是相关的，例如 `RMI` 的通信，或 `EJBs`。
- - '##'
  - 消费外部数据的策略
- - '###'
  - 直接读取外部数据库
- - '##'
  - 直接读取外部数据库风险可以通过操作数据存储（ODS）来缓解。
- - '##'
  - 直接读取外部数据库是外部数据的副本。
- - '##'
  - 通过操作数据存储限制了应用程序更改带来的不利影响。
- - '##'
  - 使用这种策略，如果当前的软件包被另一个供应商取代，那么大部分应用程序代码不受影响。
- - '#'
  - 直接写入外部数据库具有巨大的风险。
- - '##'
  - 只有在绝对没有选择的情况下才这样做。
- - '##'
  - 极大地增加了对应用程序产生意外影响。
- - '##'
  - 如果你的代码有 Bug，应用程序可能无法正常工作。
- - '##'
  - 外部接口是外售产品，可能会使合同失效。
