- - '#'
  - 在创建自定义异常之前，优先使用原生的 JDK 异常。
- - '#'
  - try/catch 块的嵌套限制在两层。
- - '##'
  - 如果需要更深层级，请移除内部代码块并分离私有方法以提高读性。
- - '##'
  - 嵌套 try/catch 场景中修复 bug 非常困难。
- - '##'
  - 深度嵌套 try/catch 逻辑的需求通常需要对部分代码进行重构。
- - '#'
  - 不要捕获异常但不进行处理。
- - '##'
  - “吞掉”异常会导致后续难以发现和修复的派生异常。
- - '##'
  - 如果捕获了异常，请对其进行处理（将其转换为带有上下文的运行时异常）。
- - '#'
  - 永远不要在 finally 块放置 return 语句。
- - '#'
  - 架构师和项目经理应该在开始编码之前建立异常处理和日志策略。
