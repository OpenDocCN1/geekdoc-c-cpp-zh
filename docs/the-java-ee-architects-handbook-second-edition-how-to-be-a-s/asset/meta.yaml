  - 最小化部署工作
- - '##'
  - 部署的麻烦会对开发和维护产生负面影响。
- - '##'
  - 所有选择在重新部署所需的精力似乎很大。
- - '##'
  - 最大化代码移植性。
- - '##'
  - 将数据访问代码从一个数据库迁移到另一个是某些考虑。
- - '##'
  - '`JPA` 实现为可移植的代码提供了最佳机会。'
- - '##'
  - 对于许多业务应用程序，切换底层供应商是一个稀有事件。
- - '##'
  - 最小化对供应商的依赖。
- - '##'
  - 减少对 Java EE 容器服务、`JDBC` 驱动程序、`JPA` 实现和 O/R 工具集的依赖。
- - '##'
  - 如果供应商失败或更改成本结构，这种减少是有理想的。
- - '##'
  - 你可以轻松地更换 `JDBC` 驱动程序。
- - '##'
  - 切换 `JDBC` 驱动只需要更改一个 `jar` 文件并进行配置更改。
- - '##'
  - 大多数应用程序都不使用 `JDBC` 特定的类。
