  md: '![](img/13bdcf341e1727795eb17926ba89a16f_299_0.png)


    # # C# and the .NET Framework


    In a Nutshell


    +   * Outlines the basic process of compiling in the classical sense.

    * Describes a virtual machine is and why the .NET Framework has one (the CLR).

    * Explains how the CLR and IL work.

    * Points out the advantages and disadvantages of using a virtual machine like
    the CLR.

    * Describes the Base Class and Framework Libraries, which have lots of reusable
    code.


    # ## Binary, Assembly, Languages, and Compiling


    I''ve mentioned several times throughout this book that computers only understand
    binary—1s and 0s. All of the data that computers store and use is ultimately represented
    with a pile of bits, and so the instructions that they execute. For instance,
    check out the following binary code:


    ```

    00100100 00001000 00000000 00000010

    00100100 00010101 00000000 00000010

    00000001 00010101 01010000 00100000

    ```


    Can you tell what that does? Turns out, it adds 2 and 2, and stores the result.
    It is easy for a computer to understand this, humans can''t easily make sense
    of it. So we go up a step or two.


    Instead of working with raw 1s and 0s, there''s a low-level language called assembly
    language, or assembler, which is a human-readable form of binary. The binary code
    might look like this in assembly:'
