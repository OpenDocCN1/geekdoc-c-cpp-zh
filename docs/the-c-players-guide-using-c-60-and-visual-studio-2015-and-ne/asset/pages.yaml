    \ we can use index variable, and like properties, we can use\n\nIn this example,\
    \ I'm making it so that people can refer to the x and y components of the vector\
    \ using the 0 and 1 respectively. Admittedly, it's not too useful. In this place,\
    \ we will be able to do this:\n\n```\nVector v = new Vector(5, 2);\ndouble xComponent\
    \ = v[0]; // Use indexing to set the x variable.\ndouble yComponent = v[1]; //\
    \ Use indexing to set the y variable.\n```\n\nThis is much clearer if we had been\
    \ forced to do it with methods. (xComponent = v.GetIndex(0));\n\n# Using Other\
    \ Types as an Index\n\nWe're not stuck with just int as an index. We can use any\
    \ type we want. For example, strings:\n\n```\npublic double this[string component]\n\
    {\n    get\n    {\n        if (component == \"x\") return X;\n        if (component\
    \ == \"y\") return Y;\n        throw new IndexOutOfRangeException();\n    }\n\
