  md: '# What is Asynchronous Programming?


    Asynchronous programming means taking a piece of code and running it on a separate
    thread, freeing up the original thread to continue and do other things while the
    tasks complete.


    The typical use case is when you start something that you know is going to take
    a while to happen. "A while" is measured in computer time, so we may be talking
    a few milliseconds (or not). Some common scenarios include making a request to
    a server or a website, making requests to the file system, running a particularly
    large or long algorithm that you''re using, or any other time where you know a
    particular piece of code is going to take some work to get done.


    Modern computers have a lot of computational power, and users are expecting responsive
    user interfaces. These two combined mean asynchronous programming is becoming
    more and more necessary and important to know.


    The opposite of asynchronous (sometimes called "synchrony") is synchronous programming,
    and it''s what we''ve been doing up until now.


    # Approaches from the Early Days


    There have been lots of approaches to doing asynchronous programming in C# past.
    While no longer required or preferred, these older approaches are worth mention
    because they illustrate the complexity of the problem, the beauty of the final
    solution, and the decade journey to get there.


    Throughout this section of this chapter, we''ll stick with a recurring example
    of getting a list of high scores from a web server. This will help us see the
    trade-offs of the various approaches that we''ll see.


    # A Synchronous Approach


    Let''s start by looking how we might do this task (looking up high scores) using
    a traditional synchronous approach. That means blocking and waiting for the results
    to come before moving on. Obviously, this defeats the purpose of what this chapter
    is about, but it is a worthwhile exercise anyway. This biggest we''ll gain from
    this is an example of what "ideal" code looks like here. Because a synchronous
    request is so straightforward, the methods we use are clean and simple.


    To do our high score in a synchronous fashion, we might use code like this:


    ```

    Score[] highScores = highScore.LookupScores();

    ```


    That''s relatively straightforward. We just call the method directly, which returns
    the results upon completion, and store them in an array.


    I''m skipping the actual implementation of the Lookup method. I know that going
    is a disappointment to some people, but it''s irrelevant to the current discussion.
    The point is, it doesn''t matter what the work is, that it''s some sort of long
    running task that we really don''t want to sit around for. (But if you''re dying
    of curiosity, one possible way to do this might be to do an HTTP request using
    C#''s WebClient class, which will return the results in a text stream of some
    sort, which could then be parsed and turned into a list of scores.)


    While that is short and easy to understand, it''s not asynchronous.'
