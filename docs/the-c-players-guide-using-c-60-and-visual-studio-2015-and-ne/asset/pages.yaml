  md: "# Calling a Method 93\n\nWe can see that in the body of our method, we have\
    \ a simple for loop. Any of the code that we've written before can go inside of\
    \ a method, including loops, if statements, math, and variable declarations.\n\
    \nIt is also worth mentioning that the methods arranged within a class doesn't\
    \ matter. In the example above, we could put CountToBefore Main and it wouldn't\
    \ have made a difference. The C# compiler is smart enough to scan through your\
    \ file and find all the methods that exist in it. (For those of you with a C or\
    \ C++ background, this is a major change. You no longer need to make function\
    \ prototypes or anything like.)\n\n# Calling a Method\n\nNow we've got our method\
    \ created, we want to be able to use it. Doing this is really easy. Inside of\
    \ your Main method, you do the following:\n\n```\nCountToTen();\n```\n\nSo your\
    \ complete code would look like this:\n\n```\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\nusing System.Text;\n\nnamespace Methods\n{\n    public class\
    \ Program\n    {\n        static void Main(string[] args)\n        {\n       \
    \     CountToTen();\n        }\n        static void CountToTen()\n        {\n\
    \            for (int index = 1; index <= index++; index++)\n                Console.WriteLine(index);\n\
    \        }\n    }\n}\n```\n\nNow you can run your program (which automatically\
    \ starts in the Main method) and see that it jumps over to the CountToTen method\
    \ and does everything inside of it. When it reaches the end of a method, it goes\
    \ back to where it came from. So looking at this code:\n\n```\nusing System;\n\
    using System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\n```\n\
    \n```\nnamespace Methods\n{\n    public class Program\n    {\n        static void\
    \ Main(string[] args)\n        {\n            Console.WriteLine(\"I'm about to\
    \ go into a method.\");\n        }\n    }\n```"
