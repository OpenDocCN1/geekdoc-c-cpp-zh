  md: '# # Namespaces and Using Directives


    # ## In a Nutshell


    +   - Namespaces are simply collections of types that are assigned a name collectively.
    They are typically collections of related code.

    - A type''s fully qualified name is the combination of the namespace name and
    the type name. You can always use a type''s fully qualified name.

    - using directives directives tell the compiler that it should look in a particular
    namespace if it finds a name that is not fully qualified.

    - Name collisions occur when the compiler is aware of two different types with
    the same name. They can be resolved by either using fully qualified names or by
    using an alias.

    - A static directive can be added for any static class, allowing you to use the
    method without needing the class name: **using static System.Console**; and later:
    **WriteLine(x)**;


    Back in Chapter 3, when we made our Hello World program, we first saw **using
    directives** and the **namespace** keyword. At the time, I mentioned that there''s
    more to understanding these closely related concepts, but that was a discussion
    for another day.


    In this chapter, we''ll take a look at what a namespace is, and look in-depth
    at the use of type names, throughout your program. We will then look at what **using**
    directives actually do. All of this will give you a much better idea of what is
    going on with these two parts of your code.


    # ## Namespaces


    In a program, it is possible to have two types with the exact same name. Consider
