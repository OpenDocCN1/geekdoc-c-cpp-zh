    \ we could construct an asynchronous call is allows the programmer to supply a\
    \ method that will be called on completion. The method you pass in (in the form\
    \ of a delegate) is called a callback method.\n\n```\npublic void LookupScores(Action<Score[]>\
    \ callbackMethod)\n```\n\nThis can be called like this, using a lambda statement:\n\
    \n```\nhighScoreManager.LookupScores(scores => { HighScores = scores; });\n```\n\
    \nWe used a lambda here, but it could have been a normal method as well. \n\n\
