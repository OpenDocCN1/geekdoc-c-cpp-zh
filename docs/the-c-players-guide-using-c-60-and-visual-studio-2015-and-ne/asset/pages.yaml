  md: '# Creating a New Project


    Let''s get started with our first C# program! Open Visual Studio, which we installed
    in Chapter 2.


    When the program first opens, you will see the Start Page come up. To create a
    new project, you can choose either the New Project... on the Start Page, or you
    can go to the menu and choose File > New > Project... from the menu bar.


    Once you have done this, a dialog will appear asking you to specify a project
    type and a name for the project. This dialog is shown below:


    ![](img/13bdcf341e1727795eb17926ba89a16f_33_0.png)


    On the left side, you will see a few categories of templates to choose from. Depending
    on what version of Visual Studio you have installed and what plugins and extensions
    you have, you may see different categories here, but the one you''ll want to select
    is the C# category, which will list all C#-related templates that are installed.


    Once that is selected, in the list in the top-center, find and select the Console
    Application template. The Console Application template is the simplest template
    and it is exactly where we want to start. For all of the stuff we are doing in
    this book, this is the template to use.


    As you finish this book, you will want to start making programs with a graphical
    user interface (GUI), game development, smart phone app development, or web-based
    development, you will be able to put these other projects to use.


    At the bottom of the dialog, type in a name for your project. I''ve called mine
    "HelloWorld." Your project doesn''t really matter what you call a project, but
    what you want to name something intelligent, so you can find it when you are looking
    at a list of all your projects. By default, Visual Studio tries to call your programs
    "ConsoleApplication1" or "ConsoleApplication2." If you haven''t chosen a good
    name, you won''t know what each of these does.'
