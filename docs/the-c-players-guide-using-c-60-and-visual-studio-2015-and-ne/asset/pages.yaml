  md: '# Making Generic Types


    # In a Nutshell


    +   - You can create your own class that uses generics by placing the generic
    type in angle brackets after the class definition: `public class PracticeList<T>
    { /* ... */ };`


    +   - Using single capital letters for generic types is common, so T is a common
    in generic classes.


    +   - You can have multiple generic types: `public class Dictionary<K, V> { /*
    ... */ };`


    +   - With a generic type defined, you can use that anywhere including the type
    of instance variables, the return types of methods, or the types of parameters
    for methods. For example: `public T Get(int index) { /* ... */ };`


    +   - Placing constraints on a generic type variable restricts the kind of types
    that can be used, but you know more about the generic type and can do more with
    it. For example, `public class List<T> where T : IInterface { /* ... */` forces
    T to be an IInterface, but you can now use methods that are defined in IInterface.


    In the last chapter, we took a look at how generics work. We''ll now turn our
    attention to how to actually make them in your own type. Structs and classes can
    use generics.


    In this chapter, we''ll outline how to make our own generic List class. While
    this class already exists in the .NET Framework, this is still a good example
    that will help us understand how generics work. Obviously, the "official" List
    is going to be better (more features and better tested) than the one we make here.
    When making a real program, you should use the pre-existing one, instead of making
    your own.'
