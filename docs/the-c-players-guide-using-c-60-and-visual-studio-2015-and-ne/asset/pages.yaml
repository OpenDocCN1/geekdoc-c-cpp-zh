  md: '# Glossary


    # .NET Framework


    The framework that C# is built for and utilizes, consisting of a virtual machine
    called the Common Language Runtime and a massive library of reusable code called
    the Framework Class Library. (Chapters 1 and 40.)


    # Abstract Class


    A class that you cannot create instances of; instead, you can only create instances
    of derived classes. The abstract class is allowed to define any number of members,
    both concrete (implemented) and abstract (unimplemented). Derived classes must
    provide an implementation for any abstract members defined by the abstract base
    class before you can create instances of the type. (Chapter 22.)


    # Abstract Method


    A method that does not provide an implementation or body. Abstract methods can
    only be defined in abstract classes. Derived classes that are not abstract must
    provide an implementation of the method. (Chapter 22.)


    # Accessibility Level


    Types and members have different levels that they can be accessed, ranging from
    being available to anyone who has access to the code, down to only accessible
    within the type they are defined. In more restrictive accessibility levels making
    something less vulnerable to tampering, while less restrictive allow more to utilize
    the code to get things done. It is important to point out that this is a mechanism
    provided by the C# language and the .NET Framework to make programmer''s


    lives easier, but it is not a way to prevent hacking, as there are still ways
    to get access to the code. Types and type members can be given an access modifier,
    which specifies accessibility level it has. The private accessibility level is
    the most restrictive, and means the code can only be used within the type defining
    it and derived types. Internal can be used anywhere within the assembly that defines
    it, and public can be used by anyone who has access to the code. Additionally,
    the combination of protected internal can be used to indicate that it can be used
    within the defining type, a derived type, or within the same assembly. (Chapters
    18 and 21.)


    # Accessibility Modifier


    See Accessibility Level.


    # Anonymous Method


    A special type of method where no name is supplied for it; instead a delegate
    is defined, and the method is supplied inline. Because of its nature, anonymous
    methods cannot be reused in multiple locations. Lambda expressions supersede anonymous
    methods and should usually be used instead. (Chapter 35.)


    # Argument


    See parameter.


    # Array


    A collection of multiple values of the same type, placed together in a list-like
    structure. (Chapter 13.)'
