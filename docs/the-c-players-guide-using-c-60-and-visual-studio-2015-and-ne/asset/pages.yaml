    \n# Using ParameterizedThreadStart\n\nIn the code we were using, we used the ThreadStart\
    \ delegate. This meant the method we needed to have no parameters, which meant\
    \ we couldn't pass any information to the method we were calling, which was somewhat\
    \ limited.\n\nThere is an alternative that allows us to use methods that take\
    \ a single parameter instead. To do this, we simply use the ParameterizedThreadStart\
    \ delegate instead. This delegate has a return type of void and a single parameter\
