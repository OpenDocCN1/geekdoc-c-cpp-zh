  md: "# Chapter 33 Indexers\n\n```\nif (index == 0) { X = value; }\nelse if (index\
    \ == 1) { Y = value; }\nelse { throw new IndexOutOfRangeException(); }\n\n```\n\
    \nWe first specify the level of the index—public in our case—along with the type\
    \ that it returns. (Note that we don't have to use public and square brackets\
    \ ([ and ]), which indicate indexing. Inside of the brackets we use the type and\
    \ name of the indexing that we use for this indexer.\n\nThen, like a property,\
