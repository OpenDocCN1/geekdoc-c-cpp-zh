  md: '# Delegates


    # In a Nutshell


    +   * A delegate is essentially a way to treat a method like an object, allowing
    you to store it in a variable, pass it as a parameter to a method, or return it
    from another method.

    * To create a delegate, you use the **delegate** keyword, let like this: `public
    delegate float MathDelegate(float a, float b);`; This delegate can now be used
    to keep track of any method with the same return type and the same parameter list.

    * You can then use a delegate in a way that is very similar to a variable: `MathDelegate
    mathOperation = Add;`

    * You can also call the method that is stored in the delegate variable: `float
    result = mathOperation(5, 7);`


    # Delegates: Treating Methods like Objects


    We''ve done just about everything you can think of variables. We''ve put numbers
    in them, words in them, and true/false values in them. We''ve created enumerations
    to define all possible values a variable can take, and we''ve created structs
    and classes to store complicated variables with multiple parts, including methods
    to operate on that data.


    Now''re going to take it a step further. What if we had a type of variable that
    we could put a method in? What if we could assign a method to a variable and pass
    it around, just like we''ve done with all of our other types of data? C# has this
    feature, and it is called a **delegate**. Treating methods like data may seem
    kind strange at first, but there are many good uses for it.


    # Creating a Delegate


    Having laid out the background, it is time to take a look at how you''d actually
    create a delegate. Not all methods are interchangeable with others. With regular
    data, and when we have this problem, we simply use different data types. That''s
    why we have all of the built-in types and can create our own'
