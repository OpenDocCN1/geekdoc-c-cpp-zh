  md: '# Asynchronous

    Programming


    +   In a Nutshell

    * Asynchronous programming is where you take a particular task or chunk of code
    and run it on a separate thread, outside of the main flow of execution.

    * C# has used many ways of achieving asynchronous programming in the past.

    * The Task-based Asynchronous Pattern (TAP) uses the Task and Task<TResult> class
    to represent a chunk of work that is running asynchronously.

    * Tasks can be awaited with the await keyword (if the method is marked with async),
    allowing you simple syntax for scheduling additional work that happens once the
    task has been completed: HighScores = await highScore.LookupScores();


    In this chapter, we''re going to continue what we started in the previous chapter,
    and introduce the best way to do most asynchronous things in C#. This uses the
    async and await keywords that were introduced into the C# language in C 5.0.


    Asynchronous programming is hard. There''s not enough space in this chapter to
    cover every detail and strange corner case. Rather, the goal of this chapter is
    to introduce you to the syntax surrounding calling code asynchronously, and get
    you to a point where it''s not a deep, dark mystery, but something you feel comfortable
    with doing, while leaving some of the finer points of asynchronous programming
    for a later point in time.


    In this chapter, we''ll start by defining what asynchronous programming is and
