  md: '# Events


    In a Nutshell


    +   - Events are a simple and easy way for one section of code to notify other
    sections that something has happened.

    - Events rely on delegates to do their work.

    - To create an event inside of a class, you would use code similar to this: **public
    event EventHandlerChanged;**; In this case, **EventHandler** is the name of the
    delegate event handlers use, and **Changed** is the name of the event.

    - You raise events by first checking to make sure there are event handlers attached
    before raising the event: `If (PointChanged != null) { PointChanged(this, EventArgs.Empty);`

    - Attach methods to an event with the += operator: `PointChanged += HandlerMethod;`

    - Detach methods from an event with the -- operator: `PointChanged -= HandlerMethod;`


    One of the coolest things about C# is a feature called. Events allow to notify
    others when something specific happens. This is extremely common in GUI-applications,
    where there are things like buttons and checkboxes. These things when something
    of interest happens, when the button was pressed, or the user checked the checkbox,
    and other classes will be notified of the change and can handle the event in whatever
    they need to.


    User interfaces are not the only use for events. Any time you have one class that
    has interesting things happening, other classes will want to know about it. Events
    are very useful in these situations. It keeps the two classes separated and allows
    the "client" or listener classes to attach themselves to specific events generated
    by other classes when they''re interested, and detach themselves when they don''t
    care anymore.


    This quite a bit like how we use Twitter, or an RSS reader to subscribe to blogs.
    There is something out there that has interesting updates that we are interested
    in, we subscribe to it. While we''re subscribed, we see any new updates they have.
    When we discover that what we were'
