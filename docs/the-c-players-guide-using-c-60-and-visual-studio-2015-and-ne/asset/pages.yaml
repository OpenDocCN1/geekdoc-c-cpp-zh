  md: "# The 'foreach' Loop\n\nTo wrap up our discussion of arrays\n\nTo use a **foreach**\
    \ loop, you use the **foreach** keyword with an array, specifying the name of\
    \ the variable to use inside of the loop:\n\n```\nint[] scores = new int[10];\n\
    foreach (int score in scores)\n    Console.WriteLine(\"\" + score + \"\");\n```\n\
    \nInside of the loop, you can use the **score** variable. One thing to note is\
    \ that inside of the loop, you have no way of knowing which index you are currently\
    \ at. (If you don't know or **scores[2] or scores[4]**). In many cases, there's\
    \ no big deal. You dont care what index you're at, you just want to do something\
    \ with each item in the array.\n\nIf you need to know what index you're at, your\
    \ best bet is to use a **for** loop instead:\n\n```\nfor (int index = 0; index\
    \ < scores.Length; index++)\n{\n    int score = scores[index];\n    Console.WriteLine(\"\
    Score \" + index + \": \" + score + \"\");n}\n```\n\nCompared to a **for** loop,\
    \ a **foreach** loop has a tendency to be more readable. There is not as much\
    \ overhead inside of the parentheses. Also, in many cases the first thing you\
    \ do in many **for** loops is use the index to get the correct item out of the\
    \ array. This is bypassed with a **foreach** loop.\n\nBut **foreach** loops are\
    \ somewhat slower, simply as a result of their internal mechanics. If you're discovering\
    \ that a particular **foreach** loop is taking more time than you'd like, converting\
    \ it to a for-loop is an easy way to get a little speed out of it.\n\nThis leaves\
    \ us with a final question: when can **foreach** be used? The short answer (which\
    \ won't make sense just yet) is that it can be used on anything that implements\
    \ the **IEnumerable interface**. We haven't talked about interfaces at all yet,\
    \ but virtually every container or collection across the .NET framework uses it.\
    \ That means that **foreach** can be used on just about everything that has multiple\
    \ items in it.\n\n> **Try Out It!**n**Total and Averaging Revisited.** Earlier\
    \ in this chapter, I presented code to go through an array and find the total\
    \ or sum of all values in that array. I also presented to average the values in\
    \ an array. Using that code as a starting point, rewrite it to use **foreach**\
    \ loops instead.\n\nAlso, answer this question: why can't you use a **foreach**\
    \ loop to copy one array to another, like we did in the last **Try Out It!** section?\
    \ If you're struggling to find an answer, give it a try coding it.\n\n![](img/13bdcf341e1727795eb17926ba89a16f_107_0.png)"
