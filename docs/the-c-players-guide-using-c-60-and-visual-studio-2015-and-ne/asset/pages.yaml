  md: '# Installing Visual Studio


    In a Nutshell


    +   * To program in C#, we will need a program that allows us to write C# code
    and run it. That program is Microsoft Visual Studio.

    * A variety of versions of Visual Studio exists, including the free Community
    Edition, as well as higher tiers that offer additional features at a cost.

    * You do not need to spend money to make C# programs.

    * This chapter walks through the various versions of Visual Studio to help you
    decide which one to use, but as you are getting started, you should consider the
    free Visual Studio 2015 Community Edition.


    To make your own programs, people usually use a program called an Integrated Development
    Environment (IDE). An IDE combines all of the tools you will commonly need to
    make software, including a special text editor designed for editing source code
    files, a compiler, and other tools to help you manage the files in your project.


    With C#, nearly everyone chooses to use some variation of Visual Studio, made
    by Microsoft. There are a few different levels of Visual Studio, ranging from
    the free edition, to the high-end Enterprise edition. In this chapter, I''ll guide
    you through the process of determining which one to choose.


    As of the time of publication of this book, the latest version is the 2015 family.
    There will inevitably be future releases, but the bulk of what''s described in
    this book should largely apply in future versions. While new features have been
    added over time, the fundamentals of Visual Studio have remained the same for
    a very long time now.'
