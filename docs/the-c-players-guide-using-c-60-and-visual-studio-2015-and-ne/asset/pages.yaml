  md: "# Chapter 31 Events\n\n// Do something in response to the point changing.\n\
    }\n\nUsing different versions of Action, we can pass any number of parameters\
    \ to the event handlers.\nAnother common option is a delegate that works along\
    \ the lines of this:\n\n```\npublic void EventHandler(object sender, EventArgs\
    \ e);\n```\n\nIn this example, we use a reference to the sender, who initiated\
    \ the event, as well as an EventArgs\nobject, which stores any information about\
    \ the event inside it. In other cases, you may\ninterested in using a more specialized\
    \ type, derived from EventArgs, with even more information.\n\nIn this case, instead\
    \ of using your own delegate, you can use the EventHandler<TEventArgs>\nevent\
    \ handler. (To use this, you must use EventArgs or any other type that is derived\
    \ from it).\n\nSo let's say you have an event that is keeping track of a change\
    \ in a number, and in the notification\nprocess, we want to see the original number\
    \ and what it changed to. We can make a class\nderived from the EventArgs class\
    \ like this:\n\n```\npublic class NumberChangedEventArgs : EventArgs\n{\n    public\
    \ int Original { get; }\n    public int New { get; }\n    public NumberChangedEventArgs(int\
    \ originalValue, int newValue)\n    {\n        Original = originalValue;\n   \
    \     New = newValue;\n    }\n}\n```\n\nThen we define our event like this:\n\n\
    ```\npublic event EventHandler<NumberChangedEventArgs> NumberChanged;\n```\n\n\
    This event would be raised like we saw earlier, usually in a method called OnChanged:\n\
    \n```\npublic void OnChanged(int oldValue, int newValue)\n{\n    if (oldValue\
    \ != newValue)\n        ChangedEventArgs(this, new NumberChangedEventArgs(oldValue,\
    \ newValue));\n}\n```\n\nMethods that want to handle this event would look like\
    \ this:\n\n```\npublic void HandleNumberChanged(object sender, NumberChangedEventArgs\
    \ args)\n{\n    Console.WriteLine(\"The original value of {args.Original} is now\
    \ {args.New}.\");\n}\n```\n\nYou're not restricted to using any of these delegates\
    \ (events can use any delegate you want) but it is\nbenevolent and common, and\
    \ worth considering.\n\n# The Relationship between Delegates and Events\n\nIt's\
    \ a common misconception among C# programmers that events are just delegates that\
    \ can be\nattached to multiple methods, or that an event is just an array of delegates.\
    \ Both of these ideas are be\nwrong, though it's an easy mistake to make."
