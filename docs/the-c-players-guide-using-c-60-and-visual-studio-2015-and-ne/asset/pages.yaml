  md: '# # Reading and Writing Files


    # ## In a Nutshell


    +   - **The File** class is a key part to any file I/O.

    - You can write out data to a file all in once, using **File.WriteAllText** or
    **File.WriteAllLines**.

    - You can read the entire contents of a file all at once using **File.ReadAll**
    or **File.ReadAllLines**.

    - You can also read from and write to files a little at a time, in either text
    format or binary format, by wrapping the **FileStream** that is returned by **File.OpenRead**
    or **File.OpenWrite** in a **TextReader/TextWriter** or **BinaryReader/BinaryWriter**.

    - When writing a little at a time, you need to clean up when you do, to ensure
    that unmanaged resources are cleaned up.


    Working with files is a very common task in programming. Reading from writing
    to files is often called `file input` and `file output` respectively, or simply
    `file I/O`.


    There is a collection of types that will make it very easy to work with files.
    In this chapter, we''ll look at how to write to a file or read from a file all
    in one step. We''ll then look how to work with files a little reading or writing
    at a time, in both text and binary formats.


    # ## All At Once


    # ## Writing the File


    There are two simple ways to write a bunch of stuff all at once. These ways are
    defined in the **File** class, which is going to be the starting point for all
    of our file I/O.


    To write a bunch of text to a file, we can use the **File** class''s static **WriteAllText**
    method:'
  merge: -1
  pgno: 208
- img_proc: true
  md: "string informationToWrite = \"Hello persistent file storage world!\\\nFile.WriteAllText(\"\
    C:/Place/Full/Path/Here.txt\", informationToWrite);\n\nNote that the File class\
    \ in the System.IO namespace isn't included by default, so you'll have to use\
    \ a **using (System.IO)** as we described in Chapter 26.\n\nAlternatively, we\
    \ can take an array of strings and write them out to a file, with each item in\
    \ the array placed on its line in the file, using the **WriteAllLines** method:\n\
    \n```\nstring[] arrayOfInformation = new string[2];\narrayOfInformation[0] = \"\
    This is line 1\";\narrayOfInformation[1] = \"This is line 2\";\nFile.WriteAllLines(\"\
    C:/Place/Full/Path/Here2.txt\", arrayOfInformation);\n```\n\nYou can see that\
    \ both of these require the path to the file to write, along with the text to\
    \ write out.\n\n#  Reading the File\n\nReading a file in just as easy as:\n\n\
    ```\nstring fileContents = File.ReadAllText(\"C:/Place/Full/Path/Here.txt\");\n\
    string[] fileContentsByLine = File.ReadAllLines(\"C:/Place/Full/Path/Here2.txt\"\
    );\n```\n\nThis does the same thing, but in reverse. In the first part, the entire\
    \ contents of the file are \"slurped\" into the **fileContents** variable. On\
    \ the second line, the whole thing is pulled in an array of *strings*, where each\
    \ line in the file is a different item in the **string** array.\n\n#  Assembling\
    \ and Parsing File Contents\n\nUsing **File.ReadAll** or **File.ReadAllLines**\
    \ is simple to work with, but your work doesn't end there. A **string** or an\
