  md: '# Creating Arrays 81


    ```

    int score3 = 92;

    // Keep going to 10..

    ```


    That''s one way to do it. But what if you had 10,000 scores? All of a sudden,
    creating that many variables to store scores becomes overwhelming.


    This brings us to arrays. Arrays are for keeping track of things like this, since
    they could store 10 scores or 10,000 scores in a way that is both easy to create
    and easy to work with.


    # Creating Arrays


    Declaring an array is very similar to declaring any other variable. You give it
    a type and a name, and you can initialize it at the same time you want. You declare
    an array using square brackets ([ ]).


    ```

    int[] scores;

    ```


    The square brackets indicate that this is an array, not just a single int. (Note
    for C++ programmers: unlike C++, you cannot put the square brackets after the
    variable name (int scores[]); You must put it after the type as shown in the example.)


    This would an array variable which can contain multiple ints. With all other types
    that we''ve discussed so far this is basically a named location in memory to stick.
    To actually create a new array and place it in the variable, you will use the
    new keyword to specify the number of elements that you''ll have in the array:


    ```

    int[] scores = new int[10];

    ```


    In the first example, we had not assigned a value to the array variable. We had
    just declared it, reserving a spot for it. In this second example our array now
    exists and has room for 10 items in it.


    Once we have set a size for an array, you can''t change it. You can, however,
    change the values in the array (we''re still coming to that) create a new array
    with a different size, copy the values over part of the new, larger array, and
    then assign that back in your variable. The variable itself doesn''t care how
    large the array is specifically.


    By the way this is the first time we''re using the new keyword, but it is the
    last. We use this keyword to create things we see this back in a big way later
    when we start looking at classes in Chapter 17.


    Arrays are limited to int. You can make arrays of anything. For example, here''s
    an array of strings:


    ```

    string[] names = new string[10];

    ```


    (For those from a C++ background, you might be wondering if there is a delete
    keyword, and when and how to clean up things. C++ requires you to clean up memory
    that you are longer using with Delete, C doesn''t require or even this. C uses
    managed memory, and uses garbage collection to clean up things that are no longer
    in use. We will look at this more detail in Chapter 16.)


