  md: '# 32

    Operator Overloading


    # In a Nutshell


    +   * Operator overloading allows us to define how some operators work for types
    that we create.

    * Operator overloading works for these operators: +, *, /, %, ++, --, !=, !, >=,
    <=, >, =

    * Operator overloading does not work for operators: ''&'' and ''|'', the assignment
    operator ''='', the dot operator ''.'', or the new operator (keyword).

    * An example of overloading works for the ''return'' operator looks like this:
    `public static Vector (+Vector v1, Vector v2) return new Vector(v1.X, v2.X, v1.Y
    + v2.Y);`

    * All operators must be pairs and static.

    * The relational operators must be done in pairs: (== and =) and (<, <= and >=).

    * Only overload works when there is a single, unambiguous way to use the operator.


    Throughout the course of this book, we have seen a lot of operators. They have
    built-in functionality that does certain things. Mostly, these are defined by
    math, going thousands of years. In a few cases, we''ve seen some non-normal uses
    for these operators, like using the ''+'' for concatenating (sticking together)
    strings (as in `string type = "Hello" + "World"`). In math, there is no way to
    add such words, but in C# we can do.


    When you create other types, you can also define how some of these operators work
    for them. For example, if you define a class named Cheese, you also define the
    ''+'' operator should, allowing you to add two Cheese objects together (Though
    if you do not, Pepper Jack and Colby better result in Colby-Jack!) this is called
    operator overloading, and it is a powerful feature of C#.


    In a minute, we''ll look at how to actually overload these operators, but let''s
    start by discussing what operators you''re allowed to overload. Many not all operators
    can be'
