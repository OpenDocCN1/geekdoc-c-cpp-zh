  md: '# Chapter 5 Variables


    For types of data, we interpret the underlying bits and bytes in a different way.
    The int type that we were using earlier works like this. The int type uses four
    bytes. For brevity, in this discussion, I''m leaving off the first three bytes,
    which contain all zeros. The value 0 is represented with the bit 00000000. The
    value 1 is represented with the bit 00000001. 2 is represented with 00000010.
    3 is 00000011. This is basically counting in a base two numbering system. (If
    you don''t already know counting in base two, often called binary, it is worth
    taking a detour to the Internet to check it out.)


    Other types use their bits and bytes in other ways. We won''t get into the specifics
    about how they all work, as that''s really beyond the scope of this book. I''ll
    just point out that the way C# interprets bits and bytes fits in the standard
    methods of storing information that nearly every programming language and computer
    use.


    # Good Variable Names


    Before we wrap up here, I want to take a minute and explain some things about
    naming variables. There''s a lot of debate in the programming world about the
    specifics of what makes a variable name not good. I''m going to give you the rules
    I try to follow, which you''ll discover is pretty typical, and not too far from
    what experienced programmers do.


    The purpose of a variable name is to give a human-readable label for the box that
    you intend to put stuff in. It should make it obvious so that anyone who stumbles
    upon it can instantly know what information it''s supposed to contain.


    It''s easy to write code that you can actually go back and understand. Like comments,
    good variable names are an absolutely critical part of writing variable code,
    and it''s not something that can be ignored.


    **Rule #1: Meet C#''s Requirements for variable names.** All variable names have
    to start with a letter (a-z or A-Z) or the underscore (''_''), and can then contain
    any number of letters, numbers, or the underscore. You cannot name a variable
    the same as one of the reserved keywords that C# defines. These keywords are highlighted
    in blue in Visual Studio, but includes **namespace, int, and **public**. If your
    program won''t compile, this rule is mandatory.


    **Rule #2: variable names should describe the stuff you are putting in it.** If
    you are putting a player''s score in, call it `score`, or `playerScore`, or even
    `plrscr` if you have to, but don''t call it `jambalaya`, or `monkey`. Speaking
    of `plrscr`...


    **Rule #3: Don''t abbreviate or remove letters.** Looking at the example `plrscr`,
    you can tell that it resembles "player score." But if you didn''t already know,
    you''d have to sit and try to fill in the missing letters. It''s "plural score,"
    or "plastic scrable." Nope, it''s "player score." You just have to write it and
    study it. The one exception to this rule, is with common abbreviations and acronyms.
    HTML is fine.


    **Rule #4: A good name will usually be kind of long.** In math, we usually use
    single letters for variable names. In programming, you usually need more than
    that to accurately describe what you''re trying to do. In most cases, you''ll
    probably have at least three letters. It is 8 to 16. If it gets longer than that,
    it is better to be descriptive than to "save letters."'
