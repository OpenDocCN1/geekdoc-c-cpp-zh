    # Multiple Interfaces and inheritance\n\nAs mentioned at the end of Chapter 23,\
    \ C# doesn't allow you to inherit from more than one base class. However, you\
    \ are allowed to implement more than one interface. Having your type implement\
    \ multiple interfaces just means your type will need to include all of the methods\
    \ for all of the interfaces that you are trying to implement.\n\nIn addition to\
    \ implementing multiple interfaces, you can also derive from a base class (and\
    \ only one). While some languages allow you to have multiple base classes, #C\
    \ and many other languages don't. This is because allowing you to choose two or\
    \ more base classes tends to make the language, the overall structure of your\
    \ code, and the intuitiveness of your code much more complicated.\n\nWhile there\
    \ are definitely a few cases where multiple inheritance would be ideal, these\
    \ cases are fairly rare, and can usually be taken of with either implementing\
    \ multiple interfaces, or by using a technique called composition, where one class\
    \ or object simply has another object of it (as an instance variable).\n\nIndicating\
    \ that a class should implement more than one interface is pretty simple. You\
    \ just list the interfaces you want to implement after the class name, separating\
    \ them by commas, in any order you want. If there is a base class, it must come\
    \ first in the list.\n\n```\npublic class AnyOldClass : RandomBaseClass, IInterface1,\
    \ IInterface2\n{\n  *\n```"
