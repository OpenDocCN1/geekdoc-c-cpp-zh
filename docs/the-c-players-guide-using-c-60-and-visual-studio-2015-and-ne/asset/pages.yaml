  md: '# Retrieving the Contents of a Variable


    As we just saw, we can put values in a variable by assigning the value to the
    contents of a variable using the assignment operator (=). In a similar way, you
    can see and use the contents of a variable, simply by using the variable''s name.
    When the computer is running your code and it sees a place that a variable''s
    name is, it will go to the variable, look up the contents, and use that value
    in its place.


    Remember when we printed out the "Hello World!" a couple of chapters ago? Could
    you be the same kind of thing using a variable:


    ```

    int number = 3;

    Console.WriteLine(number); // Console.WriteLine prints lots of things, not just
    text.

    ```


    When you access a variable, here''s what the computer does:


    +   1. Locates the variable that you asked for memory.

    2. Looks in the contents of the variable to see what value contains.

    3. Makes a copy of that value to use where it is needed.


    The fact that it grabs a copy of the variable is important. For one, it means
    the variable keeps the value it had. Reading from a variable doesn''t change the
    value of the variable. Two, whatever you do with the copy won''t affect the original.
    (We''ll learn more about how this works in Chapter 16, when we learn about value
    and reference types.)


    As another example, let''s look at some code that creates two different variables,
    and assigns the value of one to the other:


    ```

    int a = 5;\int b = 2;

    ```


    ```

    b = a;

    a = -3;

    ```


    With what you''ve learned so far about variables, what will value a and b have
    the computer get done running it?


    > **Try It Out!

    **Playing with Variables.** Take the little piece of code above and make a program
    out of it. Follow the steps you did in Chapter 3 when we made the Hello World!
    program, but instead of adding code to print out "Hello World!", add the lines
    above. Use **Console.WriteLine**, like we did before and print out the contents
    of the two variables. Before you run the code, think about what you expect to
    be printed out for the **a** and **b** variables. Go ahead and run the program.
    Is it what you expected?'
