  md: "# Chapter 11 Switch Statements\n\nBecause there's no **break** in the case\
    \ 1 block, the code would be executed, and then continue down into the case 2\
    \ block, until you hit a **break** statement. This isn't allowed in C#. Every\
    \ case needs a **break** statement.\n\nThe reason for requiring this is that people\
    \ accidentally ended up doing this more often than they intentionally do it. They\
    \ leave off the break statement by accident, resulting in a bug that is somewhat\
    \ tricky to resolve. To prevent this, C# won't ever allow you to leave off the\
    \ break statement and fall through.\n\nHowever, there is one situation where you\
    \ **can** do this: multiple case blocks with no code in between it:\n\n```\n//\
    \ This works in C#\nswitch (menuChoice)\n{\n    case 1:\n    case 2:\n       \
    \ Console.WriteLine(\"You chose option 1 or 2.\");\n        break;\n}\n```\n\n\
    This allows you to do the same thing, regardless of whether the value is 1 or\
    \ 2. And in this case, case 1 doesn't have a break statement, it also doesn't\
    \ need it, because we're simply saying, \"case 1 and 2 are the same thing.\" You\
    \ can write the same thing with an **if** statement as well, using the **&&**\
    \ operator.\n\n> ### Try It Out! \n**Making a Calculator.** We're going to try\
    \ making a program that is a calculator. This simple program is going to bring\
    \ in much of everything we've learned so far, so be ready for a challenge!\n\n\
    The program that we'll make is going to be a simple calculator. We're going to\
    \ ask the user to type in two numbers and then type in a math operation to perform\
    \ on the two numbers.\n\nUse a switch statement to handle the different operations\
    \ in different ways.\n\nAllow the user to type in '/' for addition, '-' for subtraction,\
    \ '*' for multiplication, '/' for division, and '%' for remainder.\n\nFor bonuses,\
    \ allow the user to type in '^' for a power. (You can compute this using **Math.Pow.**)\
    \ For example, you can compute x² by using the code below:\n\n```\ndouble result\
    \ = Math.Pow(x, 2);\n```\n\nPrint out the results for the user to see."
