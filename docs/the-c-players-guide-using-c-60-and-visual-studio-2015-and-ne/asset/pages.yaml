  md: "# Returning Stuff from a Method\n\n```\nstatic int GetNumberFromUser()\n{\n\
    \    int usersNumber = 0;\n\n    while(usersNumber < 1 || usersNumber > 10)\n\
    \    {\n        Console.Write(\"Enter a number between 1 and 10: \");\n      \
    \  string usersResponse = Console.ReadLine();\n        usersNumber = Convert.ToInt32(usersResponse);\n\
    \    }\n\n    return usersNumber;\n}\n```\n\nIf your method returns nothing (void),\
    \ you don't need a return statement. But if it does return something, we're required\
    \ to have a return statement.\n\nIf a method returns something, we can grab the\
    \ value that a method returns and do something with it, like put it in a variable\
    \ or do math with it. For instance, the code below will take the value returned\
    \ by the GetNumberFromUser() and store it in a variable:\n\n```\nint usersNumber\
    \ = GetNumberFromUser();\n```\n\nDoes that look a little familiar? It should.\
    \ We've been doing stuff like that all along! Now we finally understand what's\
    \ going on. For instance, when we write string usersResponse = Console.ReadLine();\
    \ we're simply calling a method (ReadLine) that belongs to the Console and getting\
    \ the value that was returned by it!\n\nWhile the return statement is often the\
    \ last line in a method, it doesn't have to be. For instance, we can have an if\
    \ statement in the middle of a method that returns a value from a method only\
    \ when a condition is met:\n\n```\nstatic int CalculatePlayerScore()\n{\n    int\
    \ livesLeft = 3;\n    int underlingsDestroyed = 17;\n    int minionsDestroyed\
    \ = 4;\n    int bossesDestroyed = 1;\n\n    // If the player is out of lives,\
    \ they lose all of their points.\n    if(livesLeft == 0)\n        return 0;\n\n\
    \    // Otherwise, the player gets 10 points for every underlying destroyed,\n\
    \    // for every minion destroyed, and 1000 points for every boss destroyed.\n\
    \    return underlingsDestroyed * 10 +\n           minionsDestroyed * 100 +\n\
    \           bossesDestroyed * 1000;\n}\n```\n\nIf your method's return type is\
    \ void, you don't need the return keyword anywhere, you are allowed to put it\
    \ wherever you want all by itself (since you aren't returning anything) like this:\n\
    \n```\nstatic void DoSomething()\n{\n    int aNumber = 1;\n```"
