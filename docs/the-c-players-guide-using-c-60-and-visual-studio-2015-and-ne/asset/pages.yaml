    more digits, which it can handle. But do you see what''s happening out there at
    the end of the number we''ve used for the float? There''s a ''f''.


    In code, whenever we write a value directly it is a *literal*. When we say `a
    = 3;` the 3 is an integer literal. When we use a floating point literal like this,
    the compiler assumes it is the **double** type. Knowing that the double type is
    a much bigger "box" that uses 8 bytes, it wouldn''t just fit that we are using
    the **float** type. It''s too big. Sticking the ''f'' on the end of a floating
    point literal tells the compiler to treat it as a literal of the **float** type,
    instead of the **double** type. Note that we could use lower ''f'' or capital
    ''F'' as a literal of the float type, and we would get the same result.


    While we''re on the subject, I want to point out that if we''re working with an
