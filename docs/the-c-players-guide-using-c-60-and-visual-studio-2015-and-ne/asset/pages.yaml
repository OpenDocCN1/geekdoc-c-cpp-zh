  md: "# Catching Exceptions 193\n\nproblem occurred, so that you can know what changes\
    \ you need to fix the problem. On the other hand, in a best case scenario, you\
    \ can actually make those changes immediately, while your program is still running,\
    \ and continue on. The details of how to do all can be found in Chapter 44.\n\n\
    Through the rest of this chapter, we'll take at C# code you need to catch exceptions,\
    \ handle different types of exceptions in different ways, and how to throw your\
    \ exceptions if you discover a problem yourself. Lastly, we will discuss the final\
    \ keyword, and how it ties in exception handling.\n\n# Catching Exceptions\n\n\
    Before we catch exceptions, we have to be aware that they could occur. In other\
    \ words, we need to know that we're doing may cause problems that we could handle\
    \ and recover from.\n\nTo catch exceptions, we will wrap this potentially dangerous\
    \ code and place it in a try block. After the try block, we place a catch block\
    \ that identifies the exceptions we can handle, and how to resolve them.\n\nGoing\
    \ back to the example that we started with at the beginning of this chapter (asking\
    \ the user for a number between 1 and 10) we know there are potentially two problems\
    \ that could arise. First, as we already discussed, the user could code in text\
    \ instead. Secondly, you could type in a number that is so large that it can't\
    \ be converted into something that fits into an int.\n\nTo catch errors, we can\
    \ add in code that looks like this:\n\n```\nstatic int GetNumberFromUser()\n \
    \   int usersNumber = 0;\n    while(usersNumber < 1 || usersNumber > 10)\n   \
    \ {\n        try\n        {\n            Console.Write(\"Enter a number between\
    \ 1 and 10: \");\n            string usersResponse = Console.ReadLine();\n   \
    \         usersNumber = Convert.ToInt32(usersResponse);\n        }\n        catch(Exception\
    \ e)\n        {\n            Console.WriteLine(\"That is not a valid number. Try\
    \ again.\");\n        }\n    }\n    return usersNumber;\n```\n\nIn the try block,\
    \ we put the potentially dangerous code. After the try block, we add a catch block\
    \ to handle the situation if it goes wrong. You can see here that this will catch\
    \ any and all exceptions that occur, placing it in the variable named e. Any code\
    \ that we've discussed throughout this book can go inside of the try or catch\
    \ block.\n\nIn this particular case, we handle it by simply telling the user that\
    \ they entered didn't make any sense. Because the usersNumber variable wasn't\
    \ ever updated, it will still be 0, and the loop will cause the flow of execution\
    \ to loop back around and ask for another number."
