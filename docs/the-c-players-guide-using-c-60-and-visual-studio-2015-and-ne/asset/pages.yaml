  md: "```\nscore = value;\n}\n```\n\n# Auto-Implemented Properties\n\nYou will probably\
    \ find yourself making a lot of things that look something like this:\n\n```\n\
    private int score;\n\npublic int Score\n{\n    get\n    {\n        return score;\n\
    \    }\n    set\n    {\n        score = value;\n    }\n}\n```\n\nFor simple cases\
    \ like this, C# also has the ability to create auto-implemented properties that\
    \ do the exact same thing. Instead of the code above (including the private instance\
    \ variable **score**), you could simply say:\n\n```\npublic int Score { get; set;\
    \ }\n```\n\nThis creates a backing field behind the scenes, and simple **get**\
    \ and **set** code. You won't have access to the backing field in this case. This\
    \ is a nice shorthand to create very simple properties.\n\n# Read-Only Auto-Implemented\
    \ Properties\n\nYou can create read-only auto-implemented properties. These can\
    \ only be written to in a constructor (or with a default value, which we'll look\
    \ at next). After that, their value cannot be changed:\n\n```\npublic class Vector\n\
    {\n    public double X { get; }\n    public double Y { get; }\n}\n\npublic Vector2(double\
    \ x, double y)\n{\n    X = x;\n    Y = y;\n}\n```\n\nIt may seem a little odd\
    \ to restrict a property from being written to. But making all data of a type\
    \ read-only after creation (making the type \"immutable\") has certain advantages.\
    \ For instance, you know that you've got a shared copy of the object that nobody\
    \ is going to change its values without knowing because they simply can't be changed.\
    \ Immutability is a broader topic than just read-only properties, and we will\
    \ discuss it again later through this book."
