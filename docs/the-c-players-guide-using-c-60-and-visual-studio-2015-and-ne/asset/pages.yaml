    # The byte, short, and long Types


    Speaking of limitations in the size of the int type, there are three other types
    that also store integers, but use a different number of bytes. As a result, they
    have a different range that they can represent. These are the byte, short, and
    long types. The byte is the smallest. It uses only one byte and can store values
    in the range 0 to 255. The short type is larger, but smaller than int. It uses
    two bytes, and can store values in the range of about -32,000 to +32,000. The
    long type is the largest of them, and eight bytes. It can store roughly in the
    range of -9 quintillion to +9 quintillion. That is an absolutely massive range,
    and it is only in very rare circumstances that wouldn''t be enough.


    | Type | Bytes | Range |

    |---|---|---|n| byte | 1 | 0 to 255 |

    | short | 2 | -32,768 to 32,767 |

    | int | 4 | -2,147,483,648 to 2,147,483,647 |

    | long | 8 | -9,223,372,036,854,775 to 9,223,372,036,854,777 |


    So that''s four types we''ve learned (byte, short, int, and long) which take up
    different numbers of bytes (1, 2, 4, and 8, respectively). The larger they are,
    the bigger number they can store. You can think any of these different types as
    different sizes of boxes to store different sizes of numbers.


    It is worth a bit of an example to show how you create variables with these types.
    It is done exactly like earlier, when we created our first variable with the int
