    In a Nutshell


    +   - Enumerations are a way of defining your own type of variable so that it
    has specific values.

    - Enumerations are defined like this: **public enum DaysOfWeek { Sunday, Tuesday,
    Wednesday, Thursday, Friday, Saturday };**

    - Enumerations are usually defined directly in a namespace, outside of any classes
    or other type definitions.

    - The fact that an enumeration can only take the values which explicitly listed,
    means that you won''t end up with bad or meaningless data (unless you force it
    by casting).

    - You can assign your own numeric values to the items in an enumeration: **public
    enum DaysOfWeek { Sunday = 5, Monday = 6, Tuesday = 7, Wednesday = 8, Thursday
    = 9, Friday = 10, Saturday = 11 };**


    We''ve been going at a pretty fast pace. We have had to learn in every chapter.
    This will be a bit of a break, though, as enumerations are pretty simple and.


    **Enumerations (or enumeration types, or enums for short)** are a cool way to
    define your own type of variable. This is the first of many ways we''ll see to
    create your own.


    The word *enumeration* comes from the word *enumerate*, which means "to count
    out, one after the other," which is basically what we''re going to do. We''ll
    start by looking at the kinds of situations where enumerations might be useful.
    We''ll then look at how to create your enumeration and use it. We''ll take a look
    at a few additional features of enumerations before wrapping up the chapter.


    # The Basics of Enumerations


    Let me start with an example of when enumerations may be used. Let''s say you
    are keeping track of something that has a known, small, specific set of possible
    values that you can use—for instance,'
