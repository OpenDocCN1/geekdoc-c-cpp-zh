  md: '# # Basic Math


    In a Nutshell


    +   - Arithmetic in C# is very similar to virtually every other programming language
    out there.

    - Addition: a = 3 + 4;

    - Subtraction: b = 7 - 2;

    - Multiplication: c = 4 * 3;

    - Division: d = 21 / 7;

    - The remainder operator (%) gets the desired remainder of a division operation
    like this: e = 22 % 7; In this case, the variable e will contain the value 1.

    - You can combine multiple operations into one, and use other variables too: f
    = 3 * b - 4;

    - Order of operations matters and follows standard math rules, with multiplication
    and division happening before addition and subtraction, in a left to right order.
    Parentheses come before multiplication and division, so you can use parentheses
    to make something happening before something else: m = (y2 - y1) / (x2 - x1);

    - Compound assignment operators (+=, -=, *= %) do the desired operation and assign
    it to the value of the left. So for a += 3; it is the same as a = a + 3; in effect,
    adding 3 to the value of a.

    - Chapter 9 covers additional math stuff.


    With a basic understanding of variables behind us, we''re ready to get in to some
    deeper material: math. this is all pretty easy. The kind of stuff you learned
    in elementary school. Basic arithmetic. Computers love math. In fact, it is basically
    all they can do. (Well, and that bytes around.) But they do incredibly fast.


    In this chapter, we''ll cover how to basic arithmetic in C#. We''ll start with
    addition and subtraction, move up through multiplication and division, a lesser
    known operator called the remainder'
