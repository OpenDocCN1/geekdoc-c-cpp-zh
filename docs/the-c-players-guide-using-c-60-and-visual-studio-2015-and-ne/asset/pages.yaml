    \ You'd continue to other things, and you could use the AsyncResult that comes\
    \ back to track the asynchronous task's progress.\n\nThe best part about this\
    \ delegate approach is that you can use it on any method. There are no limitations\
    \ on it. It's a pattern that's infinitely reusable.\n\nUnlike the event-based\
    \ version, you don't have to worry about subscribing and unsubscribing correctly.\
    \ There's no way to make this mistake with this approach.\n\nAt this point, you\
