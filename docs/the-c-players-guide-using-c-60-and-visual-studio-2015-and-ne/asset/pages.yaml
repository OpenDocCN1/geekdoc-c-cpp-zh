  md: "# Chapter 37 Threads\n\nthread is like its own, in that the computer will run\
    \ multiple threads at all the same time on different processors. (For the record,\
    \ a thread is not its own program. It still shares memory with the program/process\
    \ that created it.)\n\nWhen many threads are running, the computer will limit\
    \ one thread on each processor for a little while, and then it will suddenly switch\
    \ it for a different one. The computer decides when it is time to make the switch\
    \ and which thread to switch, but it does a pretty good job, so that's one less\
    \ we need to worry about. This switching is called context switch.\n\nAll threads\
    \ will be treated fairly equally, but they will get switched around from time\
    \ to time. It is something you need to be aware of, and even write your code in\
    \ a way that can handle it. If you fail to do it, you can end up with intermittent\
    \ errors that only appear to happen on Tuesdays when you ate for lunch and the\
    \ moon is waxing. We'll talk more dealing with this in the section Thread Safety.\n\
    \nThere's a lot going into threading, and we don't have enough time to discuss\
    \ all the ins and outs of here. So we won't. Instead, we'll take a look at the\
    \ basics of threading, and I'll allow you to dig further into threading as you\
    \ need to.\n\n# Threading Code Basics\n\nWe'll start out a very simple example\
    \ of how to start a thread. To get started, let's say we have some work we need\
    \ to do on a separate thread. This can really be anything, but let's say it is\
    \ this:\n\n```\npublic static void CountTo100()\n{\n    for (int index = 0; index\
    \ < 100; index++)\n        Console.WriteLine(index + 1);\n}\n```\n\nTo run this\
    \ in a separate thread, you will need to create a new thread, tell it what method\
    \ to run, and then start it. The following code does this:\n\n```\nThread thread\
    \ = new Thread(CountTo100);\nthread.Start();\n```\n\nYou'll also need to use a\
    \ new Thread directive to get access to the Thread class (using System.Threading);\
    \ like we discussed back in Chapter 26.\n\nThe first line creates a new Thread\
    \ object, but take a look at that constructor. We have passed the method that\
    \ we want it to run as a parameter. This is using a delegate. (Another good use\
    \ of delegates!) happens to be the ThreadStart delegate, which has a void return\
    \ type and no parameters, the method we use to match that.\n\nAfter we call the\
    \ Start method, a new thread will be created and start executing the method, and\
    \ the new one that is off running in CountTo100. At that point, we have two threads:\
    \ the original thread, and the new\n\nTo have the original thread wait at some\
    \ point for this new thread to terminate, we use the Join method:\n\n```\nthread.Join();\n\
    ```"
