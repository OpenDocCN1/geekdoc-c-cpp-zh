  md: '#  Switch Statements


    | In a Nutshell |

    | **switch** statements are an alternative to **if** statements, especially if
    they involve a lot of "**else if X... else if Y... else if Z...**" kind of stuff.

    | You can use the following types in a switch statement: **bool, string**, and
    all integral types.

    | You can also use enumerations. (See Chapter 13.)

    | Unlike C++ and Java, there''s no implicit fall-through, meaning you can''t leave
    out the **break** statements and allow code to go from one case to the next, with
    the exception of putting multiple case labels together (with no code at all between
    them). |


    In the previous chapter, we looked at basic **if** statements and decision making.
    Before moving on to the next topic, we want to take a moment and discuss a statement
    in C# that is very similar to if statements. These statements are called **switch**
    statements. In this case, think of switch like a railroad switch, which determines
    which track a train will end up travelling down.


    We''ll take a look at when we''d want to use **switch** statements, and then wrap
    up with a couple of extra details about **switch statements**.


    Anything you can do with a **switch** statement can also be done with an **if**
    statement. (Theoretically, you could skip this entire chapter if you want, but
    you will eventually run into **switch** statements in the "real world," and it
    will be nice to know what they are.)


    I should point out that there may be some performance tradeoffs with using **switch**
    vs. **if-else** (**switch** is usually considered as fast or faster, depending
    on the situation) but it is usually not enough to overtake readability concerns.
    It is usually in your best interest to pick whichever version makes for the most
    readable code.'
