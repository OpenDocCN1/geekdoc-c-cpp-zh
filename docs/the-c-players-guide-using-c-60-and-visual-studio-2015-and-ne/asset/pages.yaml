    3. **True/False.** Two types are allowed to have the same name.\n4. **True/False.**\
    \ A name collision is when two types have the same name.\n5. Name two ways to\
    \ resolve a name collision \\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_.\n6. What using\
    \ directive would you need to be added so that you can use System.Math's Abs (absolute\
    \ value) method as Abs(x)?\n\n**Answers:** (1) False. (2) True. (3) True. (4)\
    \ True. (5) Use fully qualified names or aliases. (6) using static System.Math;"
