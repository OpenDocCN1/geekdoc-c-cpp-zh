    # How to Make Good Comments


    Commenting your code is easy; good comments is a little trickier. I want to take
    some time and describe some basic principles to help you make comments that will
    be more effective.


    My first rule for making good comments is to write the comments for a particular
    chunk of code as you''ve got the piece more or less complete. A few days or a
    weekend away from the code and you may no longer remember what you were doing
    with it. (Trust me, it happens!)


    Second, add comments to all the code. Here''s an example of a bad comment:


    ```

    // Console.WriteLine("Hello World!")

    Console.WriteLine("Hello World!");

    ```


    The code itself says all of that. You might as well not add it here. Here''s a
    better version:


    ```

    // Printing "Hello World" is a very common first program to make.

    Console.WriteLine("Hello World!");

    ```


    This explains why we did this instead of something else.


    Third, you don''t need a comment for every single line of code, but it is helpful
    to have one for every section of related code. It''s possible to have too many
    comments, but the dangers of over-commenting code are a lot less than the dangers
    of under-commented (or completely uncommented code).


    When you write comments, take the time in putting anything that you or another
    programmer may want to know if they come back and look at the code. This may include
    a human-readable description of what is happening, it may include describing the
    general method (or algorithm) you''re using to accomplish a particular task, and
    it may explain why you''re doing something. You may also find times where it would
    be useful to explain why you aren''t using a different approach, or to warn that
    a particular chunk of code is tricky, and you shouldn''t mess with it unless you
    really know what you''re doing.


    Having said all of this, don''t take it to an extreme. Good comments don''t make
    for sloppy, ugly, or hard to read code. Meanwhile, clean, understandable code
    reduces the time that you need comments at all. (The code is the authority on
    what''s happening, not the comments, after all.) Make the code readable as possible
    first, then add just comments to fill in the gaps and paint the bigger picture.


    When used appropriately, comments can be a programmer''s best friend.


    > **Try It Out!**n**Comment ALL the things!** While it''s overkill, the name of
    putting together everything you''ve learned so far, go back to your Hello World
    from the last chapter and add comments for each part of the code, describing what
    each piece is for. This will be a good review of the pieces of that simple program,
    as well as give you a chance to play around with some comments. Try out both ways
    of making comments (// and /* *) to see what you like.'
