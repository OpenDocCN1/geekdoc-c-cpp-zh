    }\n```\n\nNote that we can declare and initialize a right variable in the for\
    \ loop is so popular because it separates the looping logic from what you're actually\
    \ doing with the number. Rather than having the x++ statement inside of the loop\
    \ and declaring the variable before the loop, all of that stuff gets packed into\
    \ the loop control mechanism, making the stuff you're actually trying to accomplish\
    \ clearer.\n\nOne other thing to point out is that you can use one type of loop\
    \ you can do with the other as well. One loop is clearer and easier to understand\
    \ than the others, but they can all do the same stuff. If suddenly the C# ran\
    \ out of while keywords, and all you left was for, you would be fine. because\
    \ of this, you should pick the looping mechanism that creates code\n\n# Breaking\
    \ Out Of Loops\n\nAnother thing you can do with a loop is break out of it time\
    \ you want. Sometimes, as you're working through a loop, you get to a point where\
    \ you know there's no point in continuing with the loop. you jump out of a loop\
    \ whenever you use the break keyword like this:\n\nint numberThatCausesProblems\
    \ = 54;\n\n```\nfor(int x = 1; x <= 100; x++) {\n  Console.WriteLine(x);\n  if(x\
    \ == numberThatCausesProblems)\n    break;\n}\n```\n\nThis code will only go until\
    \ it hits 54, at which point the if statement catches it and sends it out of the\
    \ loop. This is kind of a trivial example, but it is a good illustration of how\
    \ you might use the break command. When we start the loop, we're fully expecting\
    \ to get to 100, but then we realize at point that there's a critical problem\
    \ (or alternatively, we found the result we were looking for) and we can ignore\
    \ the rest of the loop.\n\nBy the way, this is the kind of thing that makes for\
