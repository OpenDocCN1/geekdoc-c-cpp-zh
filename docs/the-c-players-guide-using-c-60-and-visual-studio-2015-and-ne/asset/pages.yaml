  md: '# Chapter 8 User Input


    String interpolation requires two steps. First, before the string, place a "$".
    This tells the C# compiler that this isn''t just a normal string. It''s one that
    has code embedded within it it needs to be evaluated. Within the string, when
    you want to put some code, you simply surround it with curly braces.


    This translates to the same code as our first pass, but this is usually more readable,
    so it''s usually preferred. The curly braces can contain any valid C# expression.
