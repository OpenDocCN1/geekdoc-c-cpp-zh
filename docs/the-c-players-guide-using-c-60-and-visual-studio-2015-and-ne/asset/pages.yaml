  md: '# Chapter 44 Debugging Your Code


    You can set as many breakpoints as you want in your program. You can also add
    and remove breakpoints whenever you want, even if the program is already running.
    To remove a breakpoint, simply click on the red circle and it will go away.


    Whenever your program is stopped at a breakpoint, you can press the Continue button
    (located on the Standard toolbar, taking the place of the Start button while your
    program is running) which will leave the breakpoint and continue on until another
    breakpoint is hit, or until the program ends and closes.


    Continue


    # Stepping Through Your Program


    While stopping your program in the middle of execution allows you to do everything
    you could before (looking at local variables, the stack trace, etc.) it can do
    a whole lot more. After all, unlike before, the program hasn''t run into a problem.
    You''ve stopped it before that happened.


    To use these options, while your program is running, find the Debug toolbar among
    the toolbars at the top of Visual Studio. The Debug toolbar looks like this:


    ![](img/13bdcf341e1727795eb17926ba89a16f_330_0.png)


    If you don''t see it, go to **View > Toolbars > Debug** to open it. This toolbar
    contains a collection of useful tools for stepping through your code.


    The debug toolbar may look a little different, depending on your settings and
    the specific version of Visual Studio that you have, but the items on the toolbar
    that we''ll discuss should be available in all of them. If you feel you''re missing
    something, the Break button (and all other tools) can be customized by clicking
    on the little arrow at the end of the toolbar and choosing the items you want
    to displayed on.


    # Items on the Debug Toolbar


    +   - The first button on the Debug toolbar is the Break All button, represented
    by a pause icon. While your program is executing, you can press the Break All,
    which will halt execution of your program immediately and you can see where it
    is. The computer runs your program so that this isn''t useful for fine-grained
    control. (We''ll see a better tool for that in a second.) Instead, this feature
    is anyway useful to figure out why your program is taking so long to do something.
    Usually, it is stuck in some infinite loop, and by hitting the pause button, you
    can track where the problem is.'
