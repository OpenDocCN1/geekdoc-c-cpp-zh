  md: "# Conditional Operators: && & || (And and Or)\n\n```\n```{\\{\\}\n```\n```\n\
    \nThere are a lot of ways your conditions could become more complicated. imagine\
    \ you are making a game where the player controls a spaceship that has both shields\
    \ and armor, and the player dies only when both shields and armor are gone. You\
    \ will need to check against both things, rather than just one.\n\nHere's where\
    \ conditional operators come to play. C# has an and operator, which looks like\
    \ this: &&, and an or operator that looks like this: ||. (The '|') key is above\
    \ the <Enter> key on keyboards and requires pushing <Shift>.) You can use these\
    \ to check multiple things at once:\n\n```\n```\\int shields = 50;\nint armor\
    \ = 20;\nif(shields <= 0 && armor <= 0)\n    Console.WriteLine(\"You're dead.\"\
    );\n```\n```\n\nThis could be read as, if shields is less than or equal to zero,\
    \ and armor is less than or equal to zero. With the && operator, both parts of\
    \ the condition must be true in the whole expression to be true.\n\nThe || operator\
    \ works in a similar way, though if either one is true, the whole thing becomes\
    \ true.\n\n```\n```\\int shields = 50;\nint armor = 20;\nif(shields > 0 || armor\
    \ > 0)\n    Console.WriteLine(\"You're still alive!\");\n```\n```\n\nOne thing\
    \ worth mentioning is that with either of these, the computer will do lazy evaluation.\
    \ This means it won't check the second part unless it needs to. So in the example\
    \ above, the computer will always check if shields is greater than 0, but it only\
    \ bothers checking if armor is greater than 0 if shields is less than or equal\
    \ to 0.\n\nYou can combine lots of these together, and along with parentheses,\
    \ make some pretty crazy conditions. Anything you want is possible, though readability\
    \ quickly become an issue. Which leads us to the next section, which might provide\
    \ an alternative approach that may be readable.\n\n# Nesting If Statements\n\n\
    You can also put if statements (and if-else statements) inside of other if statements.\
    \ This is called nesting them. For example:\n\n```\n```\\if(shields <= 0)\n{\n\
    \    if(armor <= 0)\n        Console.WriteLine(\"Your shields and armor are both\
    \ zero! You're dead!\");\n    else\n        Console.WriteLine(\"Shields are gone,\
    \ but armor is keeping you alive!\");\n}\n```\n```"
