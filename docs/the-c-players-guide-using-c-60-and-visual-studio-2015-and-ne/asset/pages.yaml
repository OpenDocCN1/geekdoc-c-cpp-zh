  md: '# 338 Chapter 48 Glossary


    # Value Type


    One of the main categories of types in C#. Value types are stored on the stack
    when possible (when not part of a reference type). Value types follow value semantics,
    and when they are passed to a method or returned from a method, they are copied.
    Structs are value types, as well as all of the built-in types except object and
    string. See reference type and pointer type. (Chapter 16.)


    development as long as you have no more than 5 developers, you don''t have more
    than 250 computers, and your company doesn''t have more than $1,000,000 in revenue.
    There are exceptions that allow you to use this free, for educational use and
    other use. This is the version that most new C# developers will start.


    # Variable


    A place to store data. Variables are given a name, which can be used to access
    the value, a type, which determines what kind of data can be in it, and a value,
    which is the actual contents of the variable at any point in time. Once a variable
    is created, its name and type cannot change, though its value can vary in a number
    of different values, including local variables, parameters, and static class variables.
    (Chapter 5.)


    A member of the Visual Studio family that has features to 2015 Community, but
    if you have more than 5 Visual Studio users in your company, or you have more
    than 250 computers, or the company has gross revenue in excess of $1,000,000,
    you will have to find the money to pay for this.


    # Visual Studio 2015 Edition


    In earlier versions of Visual Studio, there was no Community edition. Edition
    focused on a single functional area (such as web, phone, or desktop) and did not
    allow you to add-ons or extensions. Express editions have been superseded by the
    Community edition, which combines all the functional areas into one, and allows
    add-ons and extensions.


    # Virtual Machine


    A special piece of code that can execute code. The CLR is the virtual machine
    that executes .NET code. Virtual machines usually provide controlled hardware
    access to the software that they are running and perform a number of features
    for the code that they run, including a security model and memory management.
    Virtual machines are also responsible for the task of JIT compiling code at run-time.
    (Chapter 4.)


    # Windows Forms


    A large collection of controls for making Windows applications with the .NET Framework.
    Windows Forms is largely replaced by Presentation Foundation (WPF) but Windows
    Forms is simpler and is frequently used. This book does not cover Windows Forms
    in depth. (Chapter 47.)


    # Virtual Method


    If a method is virtual, any classes derived from the class may provide an alternate
    implementation of the method by overriding it. To mark a method as virtual, the
    virtual keyword should be used to it. See abstract and overriding method. (Chapter
    22.)


    # Windows Presentation Foundation


    A large collection of tools that are designed to create Windows-based GUI applications.
    Presentation Foundation is often abbreviated WPF. WPF is a replacement for Windows
    Forms, and is the recommended framework for starting with new applications. This
    book does not cover WPF. (Chapter 47.)


    # Basic Net.


    A programming language that is very different from C# in syntax, but has a 1-to-1
    relationship in keywords and features, because both were designed for the .NET
    Framework. (Chapter 40.)


    # XML Documentation Comment


    A special type of comment, placed immediately above a type or member to define
    what it does and how it is used. These comments are started using three slashes
    (///). The format can contain XML tags. XML documentation comments are used by
    tooling to generate documentation that can be displayed on websites for anyone
    who uses your code. It is also used by Visual Studio to create IntelliSense for
    your code. (Chapter 15.)


    # C++


    See C++.


    # Visual Studio


    Microsoft''s IDE, designed for programming in C# and other programming languages.
    (Chapters 2 and 41.) The latest version of Visual Studio is Visual Studio is free


