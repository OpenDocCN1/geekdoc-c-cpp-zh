  md: '# What are Generics? 163


    Now we can put any type of object in it. We only need to execute one class (the
    List class) for any type of object we want.


    This might seem to work at first glance, but it''s got a few problems as well.
    For instance, any time you want to do anything with it, you''ll need to cast stuff
    to the type you''re working with. If we have a list that has only strings, when
    we want to call the GetObject method, we''ll need to cast it like this:


    ```

    string text3 = (string)list.GetObject(3);

    ```


    Casting takes time to execute, so it slows down a bit. Worse than that, this is
    less readable.


    There''s a bigger problem here though. Let''s assume we''re sticking strings in
    our list. We can cast all we want, but since it''s a list of objects, we could
    theoretically put anything in the list, not just strings.


    There''s nothing preventing us from accidentally putting something else in. After
    all, the compiler won''t tell you there''s anything wrong with saying Add(new
    Random()) even though we intended it to be a list for only strings. We could to
    be extremely careful and make sure we don''t make that mistake, but there are
    no guarantees. And even if we are careful ourselves, other people be using the
    code that might make that mistake.


    We can never know for sure what type of object we''re pulling. You''ll have to
    check and make sure it is the type you think it is, because it might possibly
    be something else. Programmers have a name for this type of object you are working
    with. They say it isn''t type safe. Type safety is why you always know what type
    of object you are working with.


    Type safety isn''t a problem in our first approach because weren''t using object.
    We were using a specific type, like string. We knew exactly what we were working
    with, so could ensure that we were using the right type all the time. There was
    no need for casting, and no possibility of mistakes.


    So we''ve got two choices here. Either we make lists of type safe classes of lists,
    for each kind of thing we want to put in, or we make a single class of plain old
    objects that isn''t type safe, but doesn''t require making of different versions.


    Here is where generics comes to save the day, fixing this dilemma for us.


    # What are Generics?


    In short, generics provide a way to create type safe classes, without having to
    commit to any particular type when you create the class.


    In the next chapter, I''ll show you how to actually create your generic right,
    but we''ll start by taking a look at a few generic types that already exist as
    a part of the .NET Framework, and I''m sure you''ll find them very valuable. We''ll
    start with the List class, which is the "official" version of what we been describing
    until now in this chapter. Then we''ll look at a generic interface (IEnumerable)
    which is an interface that allows you to look at all items in a collection, one
    at a time, and is used by nearly all collection classes. Finally, we''ll look
    at the Dictionary class, which is a bit more advanced and shows off few of the
    features that generics has to offer.'
