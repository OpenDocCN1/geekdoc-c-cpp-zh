  md: "# 92 Chapter 15 Methods\n\n```\nstatic void CountToTen()\\{\n    for(int index\
    \ = 1; index <= 10; index++)\n        Console.WriteLine(index);\n}\n```\n\nSo\
    \ for the moment, your full code should look like this:\n\n```\nusing System;\n\
    using System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\nusing\
    \ System.Threading.Tasks;\n```\n\n```\nnamespace Methods\n{\n    public class\
    \ Program\n    {\n        static void Main(string[] args)\n        {\n       \
    \     static void CountToTen()\n            {\n                for(int index =\
    \ 1; index <= 10; index++)\n                    Console.WriteLine(index);\n  \
    \          }\n        }\n    }\n}\n```\n\nThis code won't do anything yet. Our\
    \ program will run everything in the Main method by default, and we still have\
    \ nothing in the Main method for the time being. Before we're done, we'll need\
    \ to have our Main method \"call\" for our newly created CountToTen() method,\
    \ but we'll do in a second. First, let's discuss the piece of code that we've\
    \ just added.\n\nThere are just a few simple pieces to what we just added. The\
    \ first piece is the static keyword. We'll talk about this a little more when\
    \ we start creating our classes (see Chapter 18). For now, we'll assume it's what\
    \ we're doing for.\n\nThe second thing we added is the void keyword. We'll talk\
    \ more about this in a second, when we discuss returning stuff from a method,\
    \ but basically, the void keyword tells us our method isn't going to give us anything\
    \ back. It's just going to do some task and be done.\n\nThe next part is the method's\
    \ name: CountToTen. Like with variables, you can name your method all sorts of\
    \ things. Using descriptive names makes it easier to explain what it does. While\
    \ it is not required, the standard convention is to have method names start with\
    \ an upper case letter, while variables usually start with a lower case letter.\n\
    \nNext we have a set of curly braces Right now, there's nothing inside of our\
    \ programs, but we'll soon see what we can put there, allowing us to handle stuff\
    \ off to a method.\n\nLastly, we have a set of curly braces where we put the body\
    \ or implementation of the method. This is where we put we've been putting all\
    \ of our code in the body of the Main method. As this chapter, we'll start putting\
    \ our code in the body of different methods to organize our code into separate,\
    \ reusable tasks."
