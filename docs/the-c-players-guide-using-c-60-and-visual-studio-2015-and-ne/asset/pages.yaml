  md: "# The Task-based Asynchronous Pattern\n\nAs you can see, asynchronous programming\
    \ has been a mess in C# in the past. And it's not just C#. Every language and\
    \ every programmer has struggled with this. Obviously we need a better solution\
    \ than what we've seen so far.\n\nC# 4.0 introduced another pattern for solving\
    \ this problem: the Task-based Asynchronous Pattern (TAP). TAP doesn't magically\
    \ solve our code clarity problems, but it lays the foundation for what comes in\
    \ C# 5.0, which does (for the most part).\n\nTAP introduced two new classes: Task\
    \ and Task<Result>. Task represents a long running asynchronous chunk of work,\
    \ while Task<Result> is a generic variant that additionally serves as a promise\
    \ of a returning value when the task is completed. Task is used when the asynchronous\
    \ doesn't return a value or when you don't care to do anything with the returned\
    \ value. When you care about the result, you use the generic version, which has\
    \ the option of grabbing the result from the task completion and doing more with\
    \ it.\n\nLet's look at how we'd implement our high score lookup using the TAP\
    \ approach:\n\n```\npublic Task<Score[]> LookupScores() {\n    return Task.Run(()\
    \ => {\n        // Do the real work here, in a synchronous fashion.\n        return\
    \ new Score[10);\n    });\n}\n```\n\nInstead of directly returning the score array,\
    \ we return a Task that contains it. More accurately, we return a Task that promises\
    \ to give us an array of scores when it completes. In this case, because we want\
    \ to do something with the result, we will use the generic version of Task, which\
    \ promises a resulting value upon completion.\n\nOutside of this class, we can\
    \ handle a Task return value in a few different ways. The first way would be to\
    \ just ignore it. If it were an asynchronous task that is \"fire and forget\"\
    , we could just ignore the return value.\n\nThe second option is to wait the call\
    \ and Wait() on it:\n\n```\nTask<Score[]> scores = highScoreManager.LookupScores();\n\
    scores.Wait();\nHighScores = scores.Result;\n```\n\nWait causes the current thread\
    \ to block, doing nothing until the task finishes. This isn't the desired effect\
    \ because it forces the main thread to suspend. It's not happening asynchronously\
    \ anymore.\n\nWhich leads to the third option: ContinueWith.\n\n```\nTask<Score[]>\
    \ scores = highScoreManager.LookupScores();\nscores.ContinueWith(task => HighScores\
    \ = task.Result);\n```\n\nContinueWith specifies a method (another lambda expression\
    \ in this case) that should execute when the task finishes. That code doesn't\
    \ happen when the flow of execution reaches that"
