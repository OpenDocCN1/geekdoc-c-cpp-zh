  md: '# Chapter 6 The C# Type System


    For each of the types we have looked at, we could have an alternate version where
    we shift the valid range to include only positive numbers. This would allow us
    to go twice as high, at the expense of not being negative values at all. The **short**,
    **uint**, and **ulong** types just do this. The **short** type uses two bytes,
    like the **short** type, but instead of going from -32,000 to +32,000, it goes
    from 0 to 64,000. The same thing applies to the **uint** and **ulong** types.
    The exact ranges of these types will be shown a bit later.


    Likewise, we can make the **byte** type, which is unsigned, and shift it so that
    includes negative numbers as well. Instead of going from 0 to 255, we would go
    from -128 to +127. This gives us the signed byte type, **byte**.


    Not surprisingly, we can create variables of these types just like we could with
    the **int** type:


    ```

    ushort unsignedShortVariable = 59485; // This could not be stored in a normal
    short.

    ```


    We now know of eight types, all of which are designed to store only integers.
    These types, as a collection, are known as **integral** types (sometimes "integer
    types"). We can organize these types in the hierarchy diagram to the right. As
    we continue our discussion of types throughout this chapter and we''ll continue
    to expand this chart. You may notice that we are still missing one integral type,
    which we''ll discuss shortly.


    | Integral Types |

    | byte | short | int | long |

    | sbyte | ushort | uint | ulong |


    Each of the types we''ve discussed use a different number of bytes and store different
    ranges of values. That each of them is best suited for storing different types
    of information. So how do you know what type to use? Here are three things to
    consider as you''re choosing a type for a particular variable:


    +   - Do you need signed values? (Can things be negative? If so, can you eliminate
    all of the unsigned types).

    - How large might your values be? For example, if you are using a variable to
    store the population of a country, you''ll need to use something bigger than a
    **byte** or a **short**.

    - When doubt, many programmers tend to favor the **int** type. This might be sort
    of a Goldlocks thing (not too big, not too small, but just about right). As a
    result, sometimes **int** is overused, but it might be a good starting point,
    at any rate.


    # The char Type


    We have one more integral type to discuss before we move on. This last type is
    called the **char** type, and is used for storing single characters or letters,
    as opposed to numbers.


    It is strange to think of characters as an integral type, which are all designed
    to store a single number, which is why they get lumped in among the integral types.
    However, when we use the **char** type, the computer will know to treat it as
    a letter instead, so we''ll see it out the letters instead of numbers.'
