  md: "# Some Examples with Arrays\n\nNow that we know the basics of how arrays work,\
    \ let's look at a couple of examples using arrays.\n\n# Minimum Value in an Array\n\
    \nIn our first example, we'll calculate the minimum value in an array, using a\
    \ **for loop**.\n\nThe basic process will require looking each item in the array.\
    \ We'll create a variable to store the value that we know is the minimum we've\
    \ seen so far. As we go down the array, if we find one that is less than our current\
    \ minimum, we update the minimum to the new one.\n\n```\nint[] array = new int[]\
    \ { 4, 51, -7, 13, -99, 15, -8, 45, 90 };\n\nint currentMinimum = Int32.MaxValue;\
    \ // We start really high, so that any element\n// in the array will be lower\
    \ than this.\n\nfor(int index = 0; index < array.Length; index++) {\n    if(array[index]\
    \ < currentMinimum)\n        currentMinimum = array[index];\n}\n// At this point,\
    \ currentMinimum contains the minimum value in the array.\n```\n\n# Average Value\
    \ in an Array\n\nLet's try a different task: finding the average value in an array.\
    \ We'll follow the same pattern as the last example, but this time we're going\
    \ to total up the numbers in the array. When we're done that, we will divide the\
    \ total of numbers in the array to get the average.\n\n```\nint[] total = new\
    \ int[] { 4, 51, -7, 13, -99, 15, -8, 45, 90 };\n\nfor (int index = 0; index <\
    \ array.Length; index++) {\n    total += array[index];\n}\n```\n\n```\nfloat average\
    \ = (float)total / array.Length;\n```\n\n> Try It Out!\n**Copying an Array.**\
