  md: "# 274 Chapter 39 Other Features in C#\n\nWe then specify whether it is implicit\
    \ or explicit. In this case, we've chosen implicit. We then put down the type\
    \ that is converted to (MagicNumber, in this case), and then in parentheses, what\
    \ is being converted from. Inside the side of the body of the constructor, we\
    \ write code to actually convert from one to the other.\n\nNow, with this added\
    \ to our MagicNumber class, we can simply convert from ints to MagicNumber:\n\n\
    ```\nint aNumber = 3;\nMagicNumber magicNumber = aNumber;\n```\n\nWe can also\
    \ create an explicit cast in this way. Here, we'll define a conversion going in\
    \ the opposite way, from MagicNumber to int. It is typically a good idea to make\
    \ cast/conversion explicit whenever you're losing information in the conversion\
    \ process. (A \"narrowing\" conversion.)\n\nTo make an explicit cast, we would\
    \ add something like the following to your class:\n\n```\nstatic public operator\
    \ int(MagicNumber magicNumber)\n{\n    return magicNumber.Number;\n}\n```\n\n\
    Now, elsewhere in our code, we can use this conversion. But this time, we'll have\
    \ to explicitly state that we want to convert from one type to another (which\
    \ is why it's called explicit):\n\n```\nMagicNumber magicNumber = new MagicNumber()\
    \ { Number = 3, IsMag = true };\naNumber = (int)magicNumber;\n```\n\nThere are\
    \ some strange problems that can come up with user-defined conversions. Because\
    \ of this, you should think long and hard adding one in a user-defined conversion.\n\
    \nOf greatest importance is the fact that when you create a user defined conversion,\
    \ you're going to be creating an entirely new object. This should raise a flag\
    \ in your mind. Imagine the scenario where you have two classes, and each can\
    \ be converted to another using user-defined classes:\n\n```\nTypeA a = new TypeA();\n\
    TypeB b = a; // Converted with an implicit user-defined conversion\nb.DoSomething();\n\
    ```\n\nWhen we use this user-defined conversion, our b variable is holding a completely\
    \ different object than a. When we call the DoSomething method, which may change\
    \ the data in b, a is completely unaffected, which kind of counterintuitive effect.\
    \ If we had used the following code instead, it would have been much clearer that\
    \ a and b were separate objects:\n\n```\nTypeA a = new TypeA();\nTypeB b = a.TypeB();\n\
    b.DoSomething();\n```\n\nSo just you can create a user-defined conversion, doesn't\
    \ mean it is always a good idea.\n\nInstead of adding user-defined conversions,\
