  md: "# More Complicated with Clauses\n\nLet's look at this in a little detail. The\
    \ formatting of this, with from, where, and select each starting on a new line,\
    \ is the most common way of writing this. It helps to keep the different parts\
    \ separated, and I'd recommend following it.\n\nThe from part sets up where we're\
    \ getting data from. In this case, the allPeople list. We also give a name to\
    \ any particular item in the list (person), in which case we'll be able to use\
    \ throughout the rest of the query.\n\nThe where part does our filtering. We're\
    \ grabbing anyone with an age of 18 or higher.\n\nThe last part, with the select\
    \ keyword, indicates what to choose as part of the results. In this case, the\
    \ whole Person object.\n\nThis could have been done procedurally, with a loop\
    \ and an if. It would look like this:\n\n```\nList<Person> adults = new List<Person>();\n\
    foreach (Person person in allPeople)\n  if (person.Age >= 18)\n    adults.Add(person)\n\
    ```\n\nBut even this simple example is probably easier to understand with the\
    \ query expression, and as we get complicated, the procedural loop and if statements\
    \ get harder to read faster than the query expression does. So while it might\
    \ take a little getting used to, queries are a very nice feature of C#.\n\nOne\
    \ other thing to keep in mind is that you are not allowed to modify the original\
    \ list during a query statement. Doing so will cause the program to crash.\n\n\
    # More Complicated Where Clauses\n\nAs we move along to more sophisticated queries,\
    \ one of the first things we'll want to be able to make the where clause (the\
    \ part after the where keyword, which does the filtering) more complicated.\n\n\
    You are allowed to combine multiple things into one, using the standard && ||\
    \ operators:\n\n```\n// In the state of California, kids need a child restraint\n\
    // in a car, if age is 5 or under 60\nIEnumerable<Person> kidsNeedingChildRestraints\
    \ =\n  from person in allPeople\n  where person.Age <= 5 || person.Weight < 60\n\
    \  select person;\n```\n\nYou are also allowed to use multiple where clauses,\
    \ which all have to be true for it to count (essentially an implicit &&):\n\n\
    ```\n// In the state of Utah, you need a booster seat if they are 8 or younger\
    \ and also\n// less than 57 inches tall. We'll assume the height variable is in\
    \ inches for now.)\nIEnumerable<Person> kidsNeedingChildRestraints =\n  from person\
    \ in allPeople\n  where person.Age <= 8\n  where person.Height < 57\n  select\
    \ person;\n```"
