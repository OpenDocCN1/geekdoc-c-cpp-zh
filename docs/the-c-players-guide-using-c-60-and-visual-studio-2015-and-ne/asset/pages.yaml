  md: "# 242 Chapter 37 Threads\n\nto do something. To make the current sleep, you\
    \ can call the static Sleep method in the Thread class:\n\n```\nThread.Sleep(1000);\n\
    \n```\n\nThe parameter that you pass in is the amount of time to sleep for, measured\
    \ in milliseconds. So 1000 is 1. The code above will cause the current thread\
