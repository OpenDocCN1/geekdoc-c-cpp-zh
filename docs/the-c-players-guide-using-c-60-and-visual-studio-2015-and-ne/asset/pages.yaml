    \ defined by a BMI higher than 25.\n2. Write another query expression to find\
    \ all people who are in their ideal weight, defined by a BMI > 20 and < 25.\n\n\
    # Multiple from Clauses\n\nOne interesting thing that you can do with a query\
    \ expression is combine multiple from clauses into one query. Multiple from clauses\
    \ means you can pull stuff from multiple places.\nYou can also use a second from\
    \ clause to dig further into what you're looking at in the first from clause.\
    \ For instance, let's say the items in the first from clause have a member that\
    \ is another list. A second from clause would allow you to look at each of the\
    \ items in that list.\n\nFor instance, take the Person class and add another property\
    \ to it, containing a List<Person> which lists other people who are a child of\
    \ the person:\n\n```\npublic class Person\n{\n    public string FirstName { get;\
    \ set; }\n    public string LastName { get; set; }\n    public int Age { get;\
    \ set; }\n    public int Height { get; set; }\n    public int Weight { get; set;\
    \ }\n    public List<Person> Children { get; set; }\n}\n```\n\nYou could create\
    \ a query expression with two from clauses like this, which creates a list of\
    \ all people who are parents of teenagers:\n\n```\n// Finds all of teenagers.\n\
    IEnumerable<Person> parentsOfTeenagers =\n    from person in allPeople\n    from\
    \ child in person.Children\n    where child.Age >= 13 && child.Age < 20\n    select\
    \ person;\n```\n\nThe second from clause does not need to be pulled from a member\
    \ of the object retrieved from the first from clause. It can be entirely different.\
    \ This might look something like the code below, though this particular case doesn't\
    \ doing anything amazing:\n\n```\nIEnumerable<Person[]> allPairings =\n    from\
    \ employee in allEmployees\n```"
