  md: "# 19\n\n# Properties\n\n# In a Nutshell\n\n+   - Properties provide a quick\
    \ and effective approach to creating getters and setters instance variables.\n\
    - You can create a property with code like the following:\n\n```\npublic int Score\n\
    {\n  get {\n    return score;\n  }\n  set {\n    score = value;\n    if (score\
    \ < 0)\n      score = 0;\n  }\n}\n```\n\n+   - Not all properties need both a\
    \ setter and a getter.\n- Getters and setters can have different accessibility\
    \ levels.\n- Auto-implemented properties can be created that allow you to quickly\
    \ define a property with default behavior `public int Score { get; set; }`.\n\
    - Auto-implemented properties can have a default value: `public int Score { get;\
    \ set; } = 10;`\n\nIn the last chapter, I talked about how it is very common to\
    \ have an instance variable, and then to provide methods to get and set its value.\
    \ This leads to GetSomething and SetSomething methods. C# provides a very powerful\
    \ feature that makes it easy to access the value of an instance variable called\
    \ properties. This chapter will discuss how properties are so helpful, and several\
