    \ bool IsEven(int number)\n{\n    return (number % 2 == 0);\n}\n```\n\nThis method\
    \ matches the requirements of the delegate Where method uses in this case (returns\
    \ bool), with exactly one parameter of type int.\n\n```\nIEnumerable<int> evenNumbers\
    \ = numbers.Where(IsEven);\n```\n\nThat's pretty readable and easy to understand,\
    \ as long as you know how delegates work. But let's take another look at this.\n\
    \n# Anonymous Methods\n\nWhile we've done the delegate approach is a big improvement\
    \ over crafting our own method to do all of the work, it has two small problems.\
    \ First, a lot of times we would something"
