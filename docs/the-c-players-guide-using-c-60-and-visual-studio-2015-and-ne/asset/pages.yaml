  md: "```\nstatic void Main(string[]) args\n{\n    for(int index = 0; index < 10;\
    \ index++)\n    {\n        // missing curly brace here...\n    }\n} // error shows\
    \ up here...\n```\n\n# Common Compiler Errors 299\n\nWe're missing our closing\
    \ brace for the for loop, which is pretty obvious we've formatted the code this\
    \ way. But the compiler doesn't care about whitespace, so it tries to match the\
    \ next curly brace it sees with the end of the for loop, the one after that with\
    \ the end of the Main method, and it then reaches the end of the file, and it\
    \ knows it should have come across one more curly brace. Adding the right missing\
    \ curly brace, bracket, parenthesis, or semicolon will fix this problem, sometimes\
    \ you need to study your code to find out where you went wrong.\n\nIt is also\
    \ worth pointing out that sometimes, a single parenthesis, or curly brace will\
    \ cause a whole pile of errors to show up in the Errors List, because the compiler\
    \ can't figure out where begins and ends. Simply fixing the one problem will fix\
    \ lots of errors.\n\n# Cannot convert type 'x' to 'y'\n\nThere's a category of\
    \ type conversion errors that you're bound to see at some point or another. This\
    \ can come in one of several flavors, like these:\n\n+   - Cannot implicitly convert\
    \ type 'x' to 'y'.\n- Cannot convert type 'X' to 'y'.\n- Cannot implicitly convert\
    \ type 'x' to 'Y'. An explicit conversion exists (are you missing a cast?)\n\n\
    What this error means is you are trying to take one type of data and turn it into\
    \ another, and the compiler doesn't know what to do with it. If you fit in the\
    \ category of that third error, and you are sure you want to change from one type\
    \ to another, it is an easy solution. Just put in a cast to the correct type:\n\
    \n```\nint a = 4;\nshort b = (short)a; // The cast tells the compiler you know\
    \ what's happening here.\n```\n\nWhenever you're required to use an explicit cast,\
    \ it means there's potential to lose data, so you should really be sure of the\
    \ cast before doing it.\n\nOn the other hand, if you're running into one of the\
    \ other errors, it means the C# compiler doesn't know of any way to get from type\
    \ to the type you have. If your intention was truly to convert between types,\
    \ there are easily ways around that. In most cases, you can simply write a method\
    \ that will convert one type to another, passing in one type as a parameter, and\
    \ returning the converted result from it.\n\nOther times this made you an entirely\
    \ different mistake in your code. If you weren't intending to convert from one\
    \ type to another, then this error means there was something wrong. For example,\
    \ it may just mean you didn't finish all of the code you needed. For instance,\
    \ if you have a Point class, with X and Y properties, casting is probably not\
    \ what you wanted in this case:\n\n```\nPoint p = new Point(4, 3);\nint x = p;\
    \ // Fails because the compiler has no clue how to convert Point to int.\n```"
