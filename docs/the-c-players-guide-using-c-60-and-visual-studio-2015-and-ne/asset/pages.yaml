  md: "# Common Delegate Types Used with Events 211\n\nThe key line there is the one\
    \ that attaches the handler to the event: .PointChanged += HandlePointChanged;\
    \ The += operator can be used to add the HandlePointChanged method to our event.\
    \ If you try to attach a method that doesn't match the needs of the event's delegate\
    \ type, you'll get an error when you go to compile your program.\n\nYou can attach\
    \ any event handlers to an event as you want. In theory, all event handlers attached\
    \ to an event will be executed. However, if one of the event handlers throws and\
    \ exception that isn't handled, the remaining handlers won't get called. For this\
    \ reason, event handlers shouldn't throw exceptions.\n\nNote that you rarely use\
    \ the same event handler attached to an event more than once, but this is allowed.\
    \ The method will be called twice, because it is attached twice.\n\nTo detach\
    \ an event, you use the -= operator in a manner similar to attaching events:\n\
    \n```\npoint.PointChanged -= HandlePointChanged;\n```\n\nAfter this executes,\
    \ HandlePointChanged will not be called when the PointChanged event occurs.\n\n\
    # Common Delegate Types Used with Events\n\nUsing events, the event can use any\
    \ delegate type imaginable. Having said, there are a few delegate types that seem\
    \ to be most common, and those are worth a bit of attention.\n\nThe first common\
    \ delegate is one of Action delegates, which we talked about in the last chapter.\
    \ For instance, if you use an event that calls a parameterless void method when\
    \ the event occurs (a simple notification that something happened, without relaying\
    \ any sort of data or information to the listener) you could use old Action:\n\
    \n```\npublic event Action += PointChanged;\n```\n\nYou subscribe to the method\
    \ below to that event:\n\n```\nprivate void HandlePointChanged()\n{\n    // Do\
    \ something in response to the point changing.\n}\n```\n\nIf you need to get some\
    \ sort of information to the subscriber, you could use one of the other variants\
    \ of Action that has generic type parameters. For example, we might want to pass\
    \ in the point that changed to the subscribers. So we could change the event declaration\
    \ to use the generic Action that has an extra type parameter to include the point:\n\
    \n```\npublic event Action<Point> PointChanged;\n```\n\nThen we subscribe to the\
    \ event with a method like this:\n\n```\nprivate void HandlePointChanged(Point\
    \ pointThatChanged)\n{\n```"
