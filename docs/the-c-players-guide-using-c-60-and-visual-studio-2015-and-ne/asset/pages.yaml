    Basically, without defining a specific type for it, we''ve created a new type
    that has two properties: one for Name and one for Age. On the second line, we
    can see that we can use that type and access the properties that it has. When
    using anonymous types like this, we can''t use an explicit type, because we never
    created a class for it.


    Situations where this comes up are rare, but do occur. For example, some LINQ
    queries put this feature to good use.


    # Nullable Types


    Value types are not allowed to be assigned a value of null. This is a fundamental
    feature of value types, but there are times where you wish to bend the rules a
    little. For example, bool is a value type and can only store true or false. But
    sometimes, we''re in a situation where something might be true, false, or unknown.


    The concept of nullable addresses this. A nullable type is simply one that uses
    the Nullable<T> generic type:


    ```

    Nullable<bool> nullableBool = true; // We can assign true or false...

    nullableBool = null; // but also null.

    ```


    Even better, C# provides a shorthand for doing this:


    ```

    bool? nullableBool = true;

    ```


    You can use the HasValue property to figure out whether the nullable type is null
    or contains a real value, and you can use the Value property to grab the value,
    assuming that HasValue is true:'
