  md: '# Query Expressions


    In a Nutshell


    +   - Query expressions are a special type of statement in C# that allows you
    to make queries on a collection of data to get a particular chunk of that data,
    along with ordering it.

    - A basic query expression has three parts: the from clause determines what you''re
    looking through, the where clause determines what is filtered out and what is
    kept, and the select clause picks the actual thing that will be given back from
    the query. This mimics what you might see in a language like SQL.


    C# includes a feature that allows you to use query language constructs in C#.
    This feature is called query expressions. If you are familiar with SQL (Structured
    Query Language) for accessing databases, you''ll love it. If you haven''t done
    anything with databases, don''t worry. Your task for this chapter is simply to
    get a basic understanding of what a query expression is and how they work.


    # What is a Query Expression?


    Imagine you have a set of data out there somewhere. Perhaps it is in a database,
    or perhaps it is in a C# collection, like a List or Dictionary. One of the most
    common tasks you''ll do in programming is to go through that data and get certain
    parts of it. Maybe your task is to find all the people who made more than a certain
    amount of money, or maybe it is to find the employee who is assigned to each task
    in a list of tasks.


    A query is simply a way of choosing a specific chunk of the complete set of data,
    including how the results should be organized.


    Query expressions are declarative. Most things we''ve done until now have been
    procedural, meaning we said step-by-step how to do it. With declarative code,
    we don''t care how it is done. We simply state ("declare") what we want, and let
    the computer figure out how to get it on its own. And of course, that means we
    don''t (and can''t) know for sure how it does, just that it does correctly.'
  merge: -1
  pgno: 255
- img_proc: true
  md: "Anything that we want to do with query expressions could also have been done\
    \ with procedural stuff like loops and if statements. There are lots of things\
    \ that are just flat out more readable with query expressions, and it is so important\
    \ to know about it as you C#.\n\nIf you're new to C# or programming in general,\
    \ I'd really expect you to get out of this chapter is that this feature exists,\
    \ so you aren't surprised when you see it pop up, and also to get you some practice\
    \ using really simple query expressions.\n\nIf you're familiar with SQL, much\
    \ of what we're going to see here will be very familiar to you. In fact, you'll\
    \ probably breeze through this chapter and, Awesome! I can totally use my SQL\
    \ knowledge in C#! This chapter focuses on using query expressions on C# collections,\
    \ not SQL databases. But everything you see here could be used against SQL databases,\
    \ if you get things set up correctly. While I can't cover everything in this chapter,\
    \ what you'll want to look into is LINQ to SQL.\n\n# LINQ and Query Expressions\n\
    \nQuery expressions are done using Language Integrated Query (abbreviated LINQ,\
    \ pronounced 'link'). In Visual Studio, you've probably seen many of the classes\
    \ you've create showing using directive using System.Linq; Perhaps you've wondered\
    \ what that's for. For directives in the world of LINQ to do query expressions\n\
    \n# Creating a Simple Query Expression\n\nThe purpose of a query expression is\
    \ to take a set of data and retrieve a subset of data in a new collection, with\
    \ the possibility of retrieving the results in a specific order or grouping.\n\
    \nWe'll start and discuss how to make more sophisticated query statements a little\
    \ at a time.\n\nLet's start with something basic. For these examples, let's say\
