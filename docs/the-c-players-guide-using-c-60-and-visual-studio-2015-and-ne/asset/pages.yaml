  md: '# Chapter 28 Reading and Writing Files


    Binary files have a couple of advantages. First, binary files usually take up
    less space than text-based files. Second, the data is "encrypted" to some extent.
    (I''m using that term very loosely, since this isn''t true encryption.) Since
    it isn''t text, people can''t just open it and read it. It protects of your data.


    # Writing the File


    You''ll see that this is very similar to the text-based version in the previous
    section. The code to write a binary file is similar, with the exception of using
    a BinaryWriter instead of a StreamWriter:


    ```

    FileStream fileStream = File.Open("C:/Place/Full/Path/Here4.txt");

    BinaryWriter writer = new BinaryWriter(fileStream);


    writer.Write(3);

    writer.Write("Hello");


    writer.Close();

    ```


    Like before, we open a FileStream that''s connected to the file we want with OpenWrite.
    This time though, we wrap it in a BinaryWriter instead of a TextWriter.


    We can then call as many Write methods as we want. When we''re done, we call Close
    to release our connection to the file.


    # Reading the File


    Reading a binary file is actually quite a bit simpler to work with than the text-based
    version.


    ```

    FileStream fileStream = File.OpenRead("C:/Place/Full/Path/Here4.txt");

    BinaryReader reader = new BinaryReader(fileStream);


    int number = reader.ReadInt32();

    string text = reader.ReadString();


    reader.Close();

    ```


    We open the file and wrap the FileStream object with a BinaryReader. Now we can
    simply call the BinaryReader''s various versions of Read***—ReadInt32 for ints,
    ReadString for strings, ReadInt16 for shorts, and so on.


    When we''re done, we call Close to close our connection to the file.'
