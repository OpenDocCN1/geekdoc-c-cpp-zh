    # # Adding a DLL


    It is really common to get executable code, packaged in a DLL. They are versatile
    and widespread, and so the chances of eventually bringing in a DLL to your project
    is fairly high.


    Adding a reference to an existing DLL is pretty easy to do. It follows steps that
    are similar to what we''ve seen in adding a reference to an existing project or
    a component of the .NET Framework.


    **Step 1.** We start by going to the Solution Explorer, and under your project
    node, right-click on the References node and choose **Add Reference...**


