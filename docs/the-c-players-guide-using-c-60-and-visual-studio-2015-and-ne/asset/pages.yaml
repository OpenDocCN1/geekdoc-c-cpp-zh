  md: "# 232 Chapter 35 Lambda Expressions => value value;\n\npublic int ComputeSquare(int\
    \ value) => value * value;\n\nThis only works if the method can be turned into\
    \ a single expression. In other words, we can use the expression lambda syntax,\
    \ not the statement lambda syntax. If we need a statement lambda, we would just\
    \ write a normal method.\n\nThis syntax is not limited to methods. Any method-like\
    \ member of a type can use the same syntax. That includes indexers, operator overloads,\
    \ and properties (though this applies to read-only properties where your expression\
    \ defines the getter and the property has no setter). The following simple class\
    \ shows all of these in operation:\n\n```\npublic class SomeTypeOfClass {\n  \
    \  // Two private instance variables are used by the methods.\n    private int\
    \ x;\n    private int[] internalNumbers = new int[] { 1, 2, 3 };\n\n    // Property\
    \ (read-only, no setter allowed)\n    public int X => x;\n\n    // Operator overload\n\
    \    public static int operator +(SomeTypeOfClass a, SomeTypeOfClass b) => a.X\
    \ + b.X;\n\n    // Indexer\n    public int this[int index] => internalNumbers[index];\n\
    \n    // Normal method\n    public int ComputeSquare(int value) => value * value;\n\
    }\n```\n\nAnd of course I will reiterate that just because this doesn't necessarily\
