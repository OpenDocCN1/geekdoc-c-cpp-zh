  md: '# Deciding Between a Struct and a Class 141


    the struct starts at 0, all bool start at false, references start at null, while
    you can create other constructors in your struct, you cannot create a parameterless
    to replace this default one.


    # Deciding Between a Struct and a Class


    Despite the similarities in appearance, structs and classes are designed for entirely
    different purposes. When it comes time to create a new type, which one do you
    choose?


    Here are a few things to think about as you decide between the two. For starters,
    do you have a particular need for reference or value semantics? Since this is
    the primary difference between the two, if you''ve got a reason to want the other,
    your decision is basically made.


    If your type is not more than a compound collection of a small handful of primitives,
    a struct might be the way to go. For instance, if you want something to keep track
    of a person''s blood pressure, which consists of two numbers (systolic and diastolic
    pressures) a struct might be a good choice. On the other hand, if you''re going
    to have a lot of methods (or events or delegates, which we''ll talk about in Chapters
    30 and 31) then you would just want a class.


    Also, structs don''t support inheritance which is something we''ll talk about
    in Chapter 21, so if that is something you need, then go with classes.


    In practice, classes are far more common and probably rightly so, but it is important
    to remember if you choose one way or the other, and then decide to change it,
    it will have a huge ripple effect throughout any code that you use. Methods will
    depend on reference or value semantics, and to change from one to the other means
    a lot of other potential changes. It''s a decision you want to make consciously,
    rather than just defaulting to one or the other.


    # Prefer Immutable Value Types


    In programming, we often talk about types that are immutable, which means that
    once you''ve set them, you can not modify them. (As opposed to mutable types,
    which you can modify on of the fly.) Instead, you would create a new copy that
    is similar, but with the changes you want to make. All of the built-in types (including
    the string, which is a reference type) are immutable.


    For value types like the struct you create, there is a danger of allowing them
    to be mutable. Because they have value semantics, any time you pass a value from
    one variable to another, or to a different method as a parameter, you end up with
    a copy of the original. It is far too easy and common to think that the value
    you got, which is actually a copy, could be used to modify the original. If your
    type doesn''t allow you to modify the individual variables that make up your type,
    the only way to make a change is by creating a new one with the changes you need
    applied to it.


    Making a type immutable will cause a great deal of trouble in the long run.


    # The Built-In Types as Aliases


    Back in Chapter 6, we took a look at all of the primitive or built-in types that
    C# has. This includes things like int, float, bool, and string. In Chapter 16,
    we looked at value types vs. reference types, and we discovered that these primitive
    types are value types, with the exception of string, which is actually a reference
    type.'
