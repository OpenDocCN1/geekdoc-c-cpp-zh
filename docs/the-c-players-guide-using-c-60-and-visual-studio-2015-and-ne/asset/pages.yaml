  md: "# Threading Basics 24\n\nWhen a thread runs into this statement, it freezes\
    \ and waits until the other thread finishes, effectively joining the execution\
    \ of the two threads.\n\nYou can create as many threads as you want. As I mentioned\
    \ earlier, they'll all get their fair share of the total processor time.(Though\
    \ you don't want to have too many threads, because it takes time to create them,\
    \ and more threads mean more context switches, which can take time).\n\nFor example,\
    \ here is some code that runs two threads and waits for them to finish:\n\n```\n\
    using System;\nusing System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\n\
    using System.Threading;\nusing System.Tasks;\n\nnamespace Threading\n{\n    class\
    \ Program\n    {\n        static void Main(string[] args)\n        {\n       \
    \     Thread thread1 = new Thread(CountTo100);\n            thread1.Start();\n\
    \n            Thread thread2 = new Thread(CountTo100);\n            thread2.Start();\n\
    \n            thread1.Join();\n            thread2.Join();\n\n            Console.ReadKey();\n\
    \        }\n\n        public static void CountTo100(int index)\n        {\n  \
    \          for (int index = 0; index < 100; index++)\n            {\n        \
    \        Console.WriteLine(index + 1);\n            }\n        }\n    }\n}\n```\n\
    \nTry this code. There are two threads that are both going to print out the numbers\
    \ 1 through 100. Typically, you'll see one thread active for a little while, and\
    \ then the other active. You might see the numbers 1-24 printed out, and then\
    \ that thread will yield and the other will print out, say, 1-52, and the first\
    \ one will print out 25-87, and so on, until they finish up.\n\nYou'll never get\
    \ the exact same output the second time you run. Because the operating system\
    \ is doing context switches as it sees fit. That's an important point to remember\
    \ although the timing and ordering is unpredictable. This can be a big pain when\
    \ you're trying to debug a problem in a multi-threaded program, and it is worth\
    \ considering before you decide to run things on separate threads.\n\nOne thing\
    \ that I should point out is that you can make the current thread \"sleep\" for\
    \ a certain amount of time. This is useful when you know one thread needs to wait\
    \ a while for another thread"
