  md: "# 158 Chapter 23 Interfaces\n\nTo model, we define an interface in C# for file\
    \ writers. It is worth pointing out that Visual Studio has a template for creating\
    \ new interfaces. This can be accessed by going to the Solution Explorer and right-clicking\
    \ on the project or folder that you want to add the new interface to, and choosing\
    \ Add > New Item, bringing up the Add New Item dialog. In the list of categories\
    \ on the left side, choose C#, which will show the list of all C# templates in\
    \ the middle of the page. Near the top, you'll see a template called Interface.\
    \ This will get you set up with a new interface in a manner similar to how the\
    \ Class template set us up with a new class.\n\nInterfaces are structured in a\
    \ way that looks much like a class or struct, but instead of the class or struct\
    \ keyword, you will use the interface keyword:\n\n```\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\n```\n\n\
    ```\nnamespace AwesomeProgram\n{\n    public interface IFileWriter\n{\n      \
    \  string Extension { get; }\n        void Write(string filename);\n    }\n}\n\
    ```\n\nYou can also see that all of the members of our interface have no actual\
    \ implementation. They look like the abstract methods that we talked about in\
    \ the last chapter. But also notice that we didn't use the virtual keyword here.\
    \ We do not say that it is public (or private or protected for that matter). All\
    \ members of an interface are public and virtual by default, and cannot be altered\
    \ into anything else. You cannot add a method, nor can you use a different accessibility\
    \ level.\n\nI also want to point out that I started the name of my interface with\
    \ the capital letter I. It is incredibly popular in the C# world to start names\
    \ of interfaces with the letter I. People do this because it makes it easy to\
    \ pick out what interfaces are, and what classes are. Not everyone does this,\
    \ and you don't need to either if you don't want, but it is fairly widespread\
    \ to expect to see it.\n\n# Using Interfaces\n\nNow we can go and create classes\
    \ that use this interface. For example, we might create a TextFileWriter class,\
    \ which knows how to write a text file. Because we want to do the things that\
    \ any IFileWriter can do, we'll want to signify that this class implements the\
    \ IFileWriter interface that we defined. This can be done like this:\n\n```\n\
    using System;\nusing System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\n\
    ```\n\n```\nnamespace AwesomeProgram\n{\n    public class TextFileWriter : IFileWriter\n\
    {\n        public string Extension\n}\n```"
