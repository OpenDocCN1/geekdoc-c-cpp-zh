    This only gets printed if the 'return' statement wasn't executed.\");\n\n```\n\
    \nNote that as a return statement is hit, the flow of execution immediately goes\
    \ back to where the method was called—nothing more gets executed in the method.\n\
    \n# Sending Stuff to a Method\n\nSometimes, we want a method to do stuff with\
    \ certain pieces of information. We can hand off stuff to a method by putting\
    \ what we want to work inside of the parentheses. Earlier, we had a method that\
    \ was called CountToTen, which simply printed out the numbers 1 through 10. We\
    \ can create an alternate method that requires you to supply a number to count\
    \ to. The method could then be used to count 10, 25, 1000, or anything else.\n\
    \nTo do this, we need a way to hand off information for the method to use. This\
    \ is done by putting a list of variables inside of the parentheses when we're\
    \ defining the method. Our modified version of the CountToTen method, which works\
    \ for any number, might look like this:\n\n```\nstatic void Count(int numberToCount)\
    \ {\n    for(int current = 1; current <= numberToCount; current++) {\n       \
    \ Console.WriteLine(current);\n    }\n\n```\n\nWhere you define the method, you\
    \ will put the type of the variable, and give it a name to use throughout the\
    \ method. This particular kind of variable is called a parameter. So variable\
    \ numberToCount is a parameter.\n\nWhen you call a method that has a parameter,\
    \ you can \"pass in\" or hand off a value to the method by putting it in the parentheses\
    \ as well:\n\n```\nCount(5);\nCount(15);\n```\n\nThis code, in conjunction with\
    \ the example before, will first print out the numbers 1 through 5, and then it\
    \ will print out the numbers 1 through 15.\n\n# Passing in Multiple Parameters\n\
    \nYou can also create a method that passes multiple parameters. All of the parameters\
    \ listed—everything inside the parentheses—is the parameter list. The code below\
    \ is a simple example of passing two numbers into a Multiply method that multiplies\
    \ them, and returns the result:\n\n```\nstatic int Multiply(int a, int b) {\n\
    \    return a * b;\n}\n```\n\nHaving multiple parameters like this is extremely\
    \ common. There's a technical limit to how many parameters you can have (just\
    \ over 65,500), but the practical limit is far lower. Most programmers will start\
    \ complaining about the number of parameters a method has well before you even\
    \ reach 10.\n\n![](img/13bdcf341e1727795eb17926ba89a16f_118_0.png)"
