  md: '# Chapter 20 Structs


    It turns out that not only are they value types, but they are also struct types.
    This means that everything that applies to structs that we''ve been learning about
    also applies to these primitive types.


    Even more, all of the primitive types are aliases for other structs (or class,
    in the case of the string type).


    While we''ve been working with say, the int type, behind the scenes the C# compiler
    is simply changing this over a struct that is defined in the same kind of way
    that we''ve seen here. In this case, it is the Int32 struct (System.Int32).


    So while we''ve been writing code that looks like this:


    ```

    int x = 0;

    ```


    We could also use this:


    ```

    Int32 x = new Int32();

    Int32 y = 0;

    int z = new Int32(); // Or combined.

    int w = new Int32(); // Or combined another way. It''s all the same thing.

    // Yet another way...

    ```


    The int type and Int32 struct are identical. There is no difference at the two.
    Which brings us to a slightly updated definition of a primitive type, or built-in
    type: that the compiler has special knowledge about, and allows for special, simplified
    syntax to use it.


    All of the primitive types have aliases, shown in the table below:


    | Primitive Type | Alias For: |

    |---|---|

    | bool | System.Boolean |

    | byte | System.Byte |

    | sbyte | System.SByte |

    | char | System.Char |

    | decimal | System.Decimal |

    | double | System.Double |

    | float | System.Single |

    | int | System.Int32 |

    | uint | System.UInt32 |

    | long | System.Int64 |

    | ulong | System.UInt64 |

    | object | System.Object |

    | short | System.Int16 |

    | ushort | System.UInt16 |

    | string | System.String |


    I want to point out a couple of things about the naming here. Nearly all of these
    types have the same name, except with a capital letter. Keywords in C# are all
    lowercase by convention, but nearly everybody will capitalize type names, which
    explains that difference.'
