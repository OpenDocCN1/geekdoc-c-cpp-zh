    # Connect Four


    The game of Connect Four is a simple and interesting game played on a grid with
    six rows and seven columns. Two players take turning tokens and dropping them
    into one of the seven columns, where it falls down to either the bottom if the
    column is currently empty or to the top of the pile it is.


    ![](img/13bdcf341e1727795eb17926ba89a16f_342_0.png)


    The goal of the game is to get your tokens in a row, up and down, side to side,
    and diagonally, before the other player does. Your task is to make a game where
    two alternating players select a row (numbers 1 through 7) to place their token
    on and play the game of Connect Four.


    There are a few pieces to this game that might be challenging. One will be writing
    the code to take and add a token to the top of it. On a related note, it may be
    tricky to ensure that if a row is full, the game doesn''t crash, but notifies
    the player that the move they wanted to make was an illegal move, and give them
    another chance. Also, after each move, you''ll need to check if that caused the
    player to win.


    By the way, while many games like this tend to look great with a GUI the game
    can still be made good by printing out the right things to the console window,
    as shown below:


    ```

    . . . . . . .

    . . . . . . .

    . . . . . . .

    . . O . . . . .

    . . . X . . . .

    . X O 0 . . . .

    . . . .

    ```


    # Conway''s Game of Life


    In 1970, British mathematician John Conway invented a “zero player” game called
    the Game of Life. This is not the Milton Bradley board game called LIFE, but rather
    a mathematical game that simulates life.


    The game is “played” on a grid, where the game advances in generations, with cells
    becoming alive or dying, based on certain conditions.


    If a cell in the grid is empty (dead) then it can come to life if the following
    conditions are met:


    +   - Exactly three neighbors that are alive.

    - If a cell in the grid is alive, then it dies in the following generation if
    any of the following are true:

    - It has more than three neighbors. (Overcrowding.)

    - It has 0 or 1 neighbors (Loneliness, I guess...)


    For example, look at the little grid below:'
