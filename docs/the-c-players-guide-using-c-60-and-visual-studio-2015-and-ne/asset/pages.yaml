    \ For example, consider the method below:\n\n```\npublic int ComputeSquare(int\
    \ value)\n{\n  return value * value;\n}\n```\n\nNow that we know about lambda\
    \ expressions and the syntax that goes with them, it makes sense to point out\
    \ that this method could also be implemented with the same expression syntax:"
