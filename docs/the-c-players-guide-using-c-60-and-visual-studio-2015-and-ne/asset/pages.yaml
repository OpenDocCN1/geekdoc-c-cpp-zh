  md: '# Working with Different Types and Casting 55


    Here, the a / b becomes 3 (like before), the c / d part becomes floating point
    division (the normal division) and gives us 1.33333. Adding the two gives us 4.33333.


    It is important to keep in mind that integer types will always try to do integer
    division. It can easily mess you up, but there are also plenty of times you can
    use it to your advantage. You just need to remember that it is happening.


    If you don''t want integer division, you''ll need to convert the values to floating
    point values, as we''ll discuss in the next section.


    # Working with Different Types and Casting


    Typically, when you do math with two things that have the same type (adding two
    ints for example) the result is the same as the types you started with. But what
    if you do math with two different types? For example, what if you add an int with
    a long? The computer basically only knows how to do math with two things on the
    same type. So to get around this, you can change different types on the fly to
    allow the operation to be done. This conversion is called typecasting or simply
    casting.


    There are two types of casting in C#. One is implicit casting, meaning it happens
    for you, without having to say so, the other is explicit casting, meaning you
    have to indicate that you want to do it, or it won''t.


    Generally speaking, implicit casting happens whenever you go from a narrower type
    to a wider type. This is called a widening conversion, and it is the kind of conversion
    that doesn''t result in any loss of information. To explain, remember that an
    int uses 32 bits, while a long uses 64 bits. Because of this, the long type can
    hold all values that the int type can handle a whole lot more. Because of this,
    we say that the int is narrower, and the long type is wider. C# will happily cast
    the narrower int to the wider long when it sees a need, without having to be told.
    (It will implicitly cast from int to long).


    So instance, you can do the following:


    ```

    int a = 4049;

    long b = 284404039;

    long sum = a + b;

    ```


    When you do the addition, it will take the value in a and turn it into a long
    and add it to b. There''s no risk of losing information because the wider type
    (like a long) can always contain any value of the narrower type (like the int).
    There''s no risk of losing data, the conversion is safe to do, and will typically
    happen for you.


    Floating types are considered wider than integer types, so there''s a need, C#
    will convert integer types to floating point. For example:


    ```

    int a = 7;

    float b = 2; // this converts the integer value 2 to the floating point value
    2.0

    ```


    ```

    // The value inside of ''a'' will get converted to the float type before it is
    used in

    // the division here. Interestingly, since the division is done with two float
    types,

    // we will use floating point division instead of integer division.

    float result = a / b;

    ```'
