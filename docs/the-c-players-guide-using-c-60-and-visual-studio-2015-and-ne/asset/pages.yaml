  md: "```\n{\n  // Handle the exception here\n}\nfinally {\n  // This code will always\
    \ execute, regardless of what\n  // happens in the try-catch block.\n}\n```\n\n\
    This is important, so let me repeat the stuff in the finally block gets executed\
    \ no matter how you leave the try-catch block. Error, return statement, reaching\
    \ the end. It doesn't matter.\n\nRelated to this, you're not allowed to put return\
    \ statements inside finally blocks. We may already be returning when we hit the\
    \ finally block, or we may be in the process of handling an exception. Returning\
    \ statements here just doesn't make sense since it's banned.\n\nThis brings up\
    \ an interesting thing, though, finally blocks get attached to exception handling\
    \ many people's minds. (Perhaps it's because it's always discussed in chapters\
    \ about exception handling, like this one.) People start to think of it as a way\
    \ to ensure that a chunk of code gets executed, regardless of whether there was\
    \ an error or not.\n\nThat is much, but interestingly, you can use a try-finally\
    \ block all by itself, with no connections to exceptions or catching them:\n\n\
    ```\nprivate static int numberOfTimesMethodHasBeenCalled = 0;\npublic static int\
    \ RandomMethod(int input) {\n  try {\n    if(input == 0) return 17;\n    if(input\
    \ == 1) return -2;\n    if(input == 2) return -11;\n\n    return 5;\n  } finally\
    \ {\n    numberOfTimesMethodHasBeenCalled++;\n  }\n}\n```\n\nIn case, no matter\
    \ how we return from the method, the code in the finally block will always get\
    \ executed. (There's a lot of better ways to write this particular code, but it\
    \ illustrates the point.)\n\n# Exception Filters\n\nSometimes, you only want to\
    \ catch an exception in specific cases. For instance, some libraries utilize a\
    \ set of error codes, a specific value in a property on a custom-made Exception\
    \ type, or just use different text in the Message property of exception to determine\
    \ what went wrong.\n\nIn this case, there's a high likelihood that you don't want\
    \ to handle every single error state in the exact same way. You may not want to\
    \ handle at all, or leave for something higher up in the call stack to worry about.\
    \ The reality is, you don't always want to handle all exceptions of the same type\
    \ in the exact same way or at the exact same time."
