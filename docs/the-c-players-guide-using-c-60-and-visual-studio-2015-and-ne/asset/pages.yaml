    # # The List Class


    Lists are commonly used that, as you can probably guess, a List class has been
    made for you. Let''s take a look at that, and explore how lists work with a bit
    further.


    This class is called List, so you might think you can create a list like this:


    ```

    ListOfStrings = new List(); // This doesn''t quite work...

    ```


    But that doesn''t quite work. The reason why this doesn''t work is because this
    class uses generics, which above code ignores. To create an instance of the List
    class, you need to specify the type of stuff you''re putting into the list. To
    do this, you must put the type you use inside of angle brackets (''<'' and ''>'').
    If you want a list of strings, you would do this:


    ```

    List<string> = new List<string>();

    ```


    You have a list containing strings!

    For the most part, all you''ll need to know about generics. It''s fairly simple
    to use. However, it''s worth taking some time to learn more about this List class,
    because it is incredibly versatile. So let''s take some time and do that.


    There''s an Add method that you can use to add items to the end of the list:


    ```

    listOfStrings.Add("Hello world!");

    ```


    If you look closely, you''ll notice that the type we are using List<string>, this
    method requires that we put only strings in. Trying anything else and the compiler
    will catch you. So it is type safe. But we''ve only had to define a single generic
    list class. It''s the best of both worlds.


    If adding items to the end isn''t what you need, you can use the Insert method,
    which allows you to put the item at the index at, pushing everything else back:


    ```

    listOfStrings.Insert(0, "text3");

    ```


    Remember that index typically start at 0, so the above code inserts at the front
    of the list.

    You can also get an item out of the list using the ElementAt method.


    ```

    string firstItem = listOfStrings.Element(0);

    ```


    There''s another way to get and set items in the list. You can also use the square
    brackets ([ and ]) with the List class, just like an array. (This is done through
    an indexer, we''ll see in Chapter 33.3).

    So you can say:


    ```

    string secondItem = listOfStrings[1];

    ```


    And you can also say:

    Also, the RemoveAt method allows you to remove items from the list:


    ```

    listOfStrings[0] = "This message replaces whatever was already at index 0";

    ```


    ```

    listOfStrings.RemoveAt(2);

    ```


    While we''re talking about deleting stuff, you can remove everything from the
    list with the Clear method:'
