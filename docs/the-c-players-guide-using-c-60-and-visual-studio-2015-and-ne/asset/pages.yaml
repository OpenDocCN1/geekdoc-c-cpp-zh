  md: "# Throwing Exceptions 195\n\nDoing this makes it so you can handle different\
    \ types of exceptions in yours. You just need to be sure to catch the derived\
    \ type—before the more general, base type. If your first block was the catch(Exception\
    \ e) block, you catch everything, and nothing would ever get into the Format or\
    \ Overflow blocks. So ordering is important.\n\nIt's also worth pointing out that\
    \ you don't need to catch all exceptions that might come up. You can build your\
    \ catch blocks in a way that some are handled while others are allowed to propagate\
    \ further up the call stack, possibly to a catch block in another method, or possibly\
    \ to the point where it kills the program. You're not required to catch all exceptions\
    \ if you don't want.\n\n# Throwing Exceptions\n\nIt's time to look at the other\
    \ side of this equation: creating and throwing exceptions yourself! Don't get\
    \ carried away with throwing exceptions. If the method that discovers a problem\
    \ knows the solution to the problem, don't bother exceptions. Just handle the\
    \ problem and continue on. To generalize that, the closer you handle an error\
    \ to the place it was detected the better.\n\nTo throw an exception, simply use\
    \ the throw keyword:\n\n```\npublic void catchTrou() // Always up to no...\n \
    \   throw new Exception(\"Just doing my job!\");\n\n```\n\nIt feels like the return\
    \ statement, but it throws exceptions instead of returning a value. You create\
    \ the Exception object, just like any other object, with the new keyword, and\
    \ away it goes.\n\nYou're not limited to using the Exception class. (It's preferable\
    \ not to.) There are other options already defined. For instance, there's a list\
    \ of common exceptions and what they're for:\n\n+   - NotImplementedException:\
    \ If a method has been defined but not implemented, you can use this. When Visual\
    \ Studio automatically generates something, it puts this in the body.\n- IndexOutOfRangeException:\
    \ You tried to access an array or at an index that is beyond how the array is.\n\
    - InvalidCastException: You tried to cast something to another type, but the type\
    \ you tried to cast wasn't the right kind of object.\n- FormatException: The text\
    \ you had is not in the right format for converting to something (like letters\
    \ in a string that is supposed to be turned into a number).\n- UnsupportedException:\
    \ You tried to do an operation that wasn't supported. For instance, make a method\
    \ call at a time that didn't allow it.\n- NullReferenceException: A reference\
    \ type contains null of an actual object.\n- StackOverflowException: You see this\
    \ the time when you run out of space on the stack from calling too many methods.\
    \ This is usually a result of recursion that went bad.\n- DivideByZeroException:\
    \ You tried to divide by zero and got.\n- ArgumentNullException: One of the arguments\
    \ or parameters you gave to a method was null, but the method requires something\
    \ null.\n- ArgumentOutOfRangeException: An argument contained a value that the\
    \ method couldn't intelligently with (e.g., it required a number between 1 and\
    \ 10, but you got it 13).\n\nAnd of course, if you can't find an existing exception\
    \ that fits, you can create your own. All you need to do is create a class that\
    \ is derived from the Exception class or another exception class."
