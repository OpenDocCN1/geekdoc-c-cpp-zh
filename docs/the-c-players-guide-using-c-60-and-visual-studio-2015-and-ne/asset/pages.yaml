- img_proc: true
  md: "# 4 Chapter 1 The C Programming Language\n\nBut humans are notoriously bad\
    \ at doing anything with a random file billions of 1s and 0s. So rather than doing\
    \ that, we created programming languages, which are based on human languages (usually\
    \ English) and structured in a way that allows you to give instructions to the\
    \ computer. These instructions are called source code, and are made up of simple\
    \ text files.\n\nWhen the time comes, your source code will be handed off to a\
    \ special program compiler, which is able to take it and turn it into the binary\
    \ 1s and 0s that the computer understands, typically in the form of an exe file.\
    \ In this sense, you can think of the compiler as a translator from your source\
    \ code to the binary instructions that the computer understands.\n\nC is one of\
    \ the most popular of all the programming languages available. There are literally\
    \ thousands, maybe tens of these languages, and each one is designed for their\
    \ own purposes. C is a simple general-purpose programming language, meaning you\
    \ can use it to create pretty anything, including desktop applications, server-side\
    \ code for websites, and even video games.\n\nC provides an excellent balance\
    \ between ease of use and power. There are other languages that provide less power\
    \ and are easier to use (like Java) and others that provide more power, giving\
    \ up some of its simplicity (like C++). Because of the balance it strikes, it\
    \ is the perfect language for nearly everything that you want to do, so it's a\
    \ great language to learn, whether it's your first or your tenth.\n\n# What is\
    \ the .NET Framework?\n\nC# relies on something called the .NET Framework. The\
    \ .NET Framework is a large and powerful platform, which we will discuss in detail\
    \ in Chapter 40. (You go read it as soon as you're done with this, if you want).\n\
    \nThe .NET Framework primarily consists of two parts. The first part is the Common\
    \ Language Runtime, often abbreviated as the CLR. The CLR is a virtual machine—a\
    \ special type of software program that functions as though it is an actual computer.\
    \ C code is actually executed by the CLR, instead of being run by the actual physical\
    \ computer. There are, of course, benefits and drawbacks to this kind of setup,\
    \ which we will discuss in Chapter 40, but it turns out to be a good idea for\
    \ everything except low level stuff, like an operating system or a device driver.\
    \ C# is a bad choice for things like this (Try C or C++ instead).\n\nI should\
    \ also point out that running your code through a virtual machine may make it\
    \ a bit slower, in some cases this doesn't matter. In some situations, it could\
    \ actually end up faster. In those cases, you can call code that is not running\
    \ on a virtual machine. The bottom line is, don't stress too much if the CLR will\
    \ be fast enough.\n\nBecause C code runs on the .NET Framework, the process your\
    \ code goes through before execution is a little more complex than what I described\
    \ earlier. Rather than just single step to compile your source to executable code,\
    \ it goes through two steps. Here's what happens:\n\n+   - The C compiler turns\
    \ your source code into Common Intermediate Language (IL or IL for short).\n This\
    \ IL code is packed into an .exe file or .dll file, which can be shared with others.\n\
    \ When it is time to run your program, the IL in your .exe or .dll will be handed\
    \ off to the CLR to run it."
  merge: -1
  pgno: 26
- img_proc: true
  md: '+   • As your program is running, the CLR will look at the IL code and compile
    it into executable code that the computer is running on understands. For each
    block of code you have, this will only happen once each time you run your program—the
    first time it needs it. This is called Just-in-Time compiling, or JIT compiling.


    The other half of .NET Framework is the Base Class Library, or BCL. The BCL is
    a massive library of code that you can reuse within your programs, to accelerate
    the development of whatever you are working on. This library is much bigger than
    what you typically find with a programming language (though Java also has a library
    of comparable size). It is impossible to cover all of this code in any one or
    book, though we''ll cover the most important stuff. Before trying to build your
    own code for what seems like a common task, search the Internet to see if it already
    exists as a part of the BCL.


    # # C# and .NET Versions


    C# has gone through quite a bit of evolution over its history. The first release
    was in 2002, and established the bulk of the language features C# still has today.


    A little over year later, in 2003, C# 2.0 was released, adding in a lot of other
    big and powerful features, most of which will get a bit of attention in this book
    (generics, nullable types, delegates, static classes, etc.).


    The next release, C# 3.0, expanded the language in a couple of specific directions:
    LINQ and lambdas, both of which get their chapters in this book.


    The next two releases were smaller. C# 4.0 added the dynamic keyword, as well
    as named and optional method arguments. C# 5 added the async keyword, and better
    support for multi-threaded development.


    In the C# 5 era, a new compiler was introduced: Roslyn. This compiler has a number
    of notable features: it''s open source, it''s written in C# (in the language it''s
    in), and it is available while your program is running (you can compile additional
    code dynamically). Something about its construction also allows people to easily
    tweak and experiment with new features, which led to the features added in C#
    6.0.


    C# 6.0 adds a few small additions and tweaks across the language. While previous
    updates to the language could usually be summed up in a single bullet point or
    two, are are given their own chapters in this book, the new features in C# 6.0
    are small and numerous. I try to point out what these features are throughout
    this book, so that you are aware of them.


    Alongside the C# language itself, Visual Studio and the Base Class Library have
    both been evolving and growing. This book has been updated to work with Visual
    Studio 2015, .NET 4, and C# 6.0 at the time of publishing.


    Future versions will, of course, arrive before long. Based on past experience,
    it''s a safe bet to say that everything you learn in this book will still apply
    in future versions as well.'
