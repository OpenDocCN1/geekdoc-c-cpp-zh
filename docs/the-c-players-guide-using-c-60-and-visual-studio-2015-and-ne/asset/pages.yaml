  md: "# Overloading Operators 217\n\n```\npublic static bool operator ==(Vector v1,\
    \ Vector v2)\n{\n    return (v1.X == v2.X) && (v1.Y == v2.Y);\n}\n```\n\n```\n\
    public static bool operator !=(Vector v1, Vector v2)\n{\n    return !(v1 == v2);\
    \ // Just the opposite of the == operator.\n}\n```\n\nRemember that the relational\
    \ operators must be overloaded in pairs, so if you overload ==, you must also\
    \ overload !=, as shown here.\n\nIf you look closely at these operators, you can\
    \ probably tell that they are basically just a method. (The only real difference\
    \ is the operator keyword.) The C# compiler is actually going to turn this into\
    \ a method as it compiles.\n\nOverloading operators is dense primarily to make\
    \ your code cleaner. It's called syntactic sugar. Anything you can do with an\
    \ operator, you could do with a method. Overloading an operator is sometimes more\
    \ readable though.\n\nJust because you can overload operators, doesn't mean you\
    \ should overload an operator to do something unexpected. If it's not clear what\
    \ your overloaded operator does, you'll cause yourself and others lots of problems.\
    \ For this reason Java and other languages, on the side of being overly cautious,\
    \ have chosen not to even allow operator overloading. The rule is to only overload\
    \ operators that have a single, clear, intuitive, and widely accepted usage.\n\
    \nOur completed class might look something like this:\n\n```\nusing System;\n\
    using System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\nusing\
    \ System.Threading.Tasks;\n```\n\n```\nnamespace OperatorOverloading\n{\n    public\
    \ class Vector\n{\n        public double X { get; set; }\n        public double\
    \ Y { get; set; }\n\n        public Vector(double x, double y)\n        {\n  \
    \          X = x;\n            Y = y;\n        }\n\n        public static Vector\
    \ operator +(Vector v1, Vector v2)\n        {\n            return new Vector(v1.X\
    \ + v2.X, v1.Y + v2.Y);\n        }\n\n        public static Vector operator +(Vector\
    \ v, double scalar)\n        {\n            return new Vector(v.X + scalar, v.Y\
    \ + scalar);\n        }\n    }\n```"
