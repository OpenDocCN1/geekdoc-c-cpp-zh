  md: "# Compiler Warnings\n\nInstead of an error, you'll get a more minor problem\
    \ called a warning. But warnings can sometimes be more dangerous than an error.\n\
    \nErrors mean that the compiler was completely unable to make sense of what you\
    \ wrote, so it didn't finish compiling. When you get a warning, it means that\
    \ the compiler noticed something odd, but it still found a way to compile your\
    \ source code. Sometimes, warnings are harmless. A lot of times they come up because\
    \ you're only halfway down a piece of code, and so things are naturally a little\
    \ out of place.\n\nBut occasionally, a warning that you've done something wrong\
    \ in your code, you forgot to assign a value to a variable. The compiler doesn't\
    \ feel sure enough of the problem that it's willing to stop compiling. It doesn't\
    \ like what you've done and it points out, but you still end up executable code.\n\
    \nThese warnings usually mean that something is wrong in your program, you'll\
    \ be able to run it anyway. Because of this, it is best to always try to treat\
    \ warnings as errors, and eliminate them as soon as you can. Don't let dozens\
    \ (or hundreds) of warnings pile up. Fixing warnings up front will save you a\
    \ great deal of trouble down the road.\n\n# Common Compiler Errors\n\nWe'll take\
    \ some time to look through some of the most common compiler errors, see what\
    \ they mean, and look how to fix them. Of course, we won't be able to cover all\
    \ errors, so we'll go through, I'll give you some basic principles for fixing\
    \ other errors that haven't been able to discuss.\n\n# “The name 'x' doesn't exist\
    \ in the current context”\n\nSometimes, you'll get an error that says that variable\
    \ name doesn't exist in a particular context, meaning it can't find the name anywhere,\
    \ or if it can find it, it's in a different place, making it unusable in the spot\
    \ it is. One common time that this comes up is if you accidentally miss a variable\
    \ name. If so, that's an easy fix.\n\nIf it's not a spelling problem, then this\
    \ usually means that you forgot to declare your variable.\n\n```\nstatic void\
    \ Main(string[] args)\n{\n    int b = x + 7;\n}\n```\n\nYou've declared the variable\
    \ x without ever declaring it. This can be fixed by simply declaring it first:\n\
    \n```\nstatic void Main(string[] args)\n{\n    int x = 3;\n    int b = x + 7;\n\
    }\n```\n\nThere are times when you might think you've already declared a variable.\
    \ In fact, you can even see the declaration! This is where that “in the current\
    \ context” part comes into play. You may have declared it, but not in the context\
    \ that you're using it."
