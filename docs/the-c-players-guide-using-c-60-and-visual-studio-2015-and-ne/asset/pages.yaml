  md: "```\nclass Time {\n    private int seconds;\n    public int Seconds {\n   \
    \     get {\n            return seconds; // Seconds is the backing field...\n\
    \        }\n        set {\n            seconds = value;\n        }\n    }\n  \
    \  public int Minutes {\n        get {\n            return seconds / 60; // But\
    \ there's no 'minutes' backing field.\n        }\n    }\n}\n```\n\nYou can see\
    \ here that we have a seconds instance variable, along with a Seconds property\
    \ that uses it as a backing field. (By the way, using lower case names for instance\
    \ variables, and upper case names for the matching property is very common).\n\
    \nIn addition, we also have a Minutes property that doesn't have a backing field\
    \ at all. Instead, we just do some other work—in this case, return the number\
    \ of seconds divided by 60.\n\nAnother thing this example shows is we don't necessarily\
    \ need both set and get blocks for a property. You can have one or the other.\
    \ If you have only a get block, then the property is read-only because you can't\
    \ set it. This is the case with the Minutes property we just saw. If you have\
    \ only a set block, the property would be write-only. (Though write-only properties\
    \ are rarely useful).\n\n# Different Accessibility Levels\n\nSo, our properties\
    \ have all been public. This means that the getter and the setter are accessible\
    \ to everyone. However, it is possible to make the two have different accessibility\
    \ levels from each other. For example, we might want the getter to be public,\
    \ so that everyone can read it, while making the setter private, so it can only\
    \ be changed from the class.\n\nTo make this, you can specify an access modifier\
    \ before the get or set keywords, like this:\n\n```\npublic int Score {\n    //\
    \ This is public by default, because the property is marked 'public'.\n    get\
    \ return score;\n    private set // This, however, is now private.\n}\n```"
