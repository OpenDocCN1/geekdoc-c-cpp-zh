    \ isEven };\n```\n\nThe form we were using earlier is called an *expression lambda*,\
    \ because it had only one expression in it. This new form is called a *statement\
    \ lambda*. As a statement lambda gets longer, you should consider pulling it out\
    \ into its own method.\n\n# Scope in Lambda Expressions\n\nFrom what we've seen\
    \ so far, lambda expressions have basically behaved like a normal method, only\
    \ embedded in the code you throw with a different, cleaner syntax. Now I'm going\
