  md: '```

    double side1 = 5.5;

    double side2 = 3.25;

    double height = 4.6;

    ```


    # Why the ‘’ Sign Doesn''t Mean Equals


    ```

    double areaTrapezoid = (side1 + side2) / 2 * height;

    ```


    In math, if you want an especially complicated formula with lot of parentheses,
    you’ll often use square brackets ([ and ] ) and curly braces ({ and } ) as “more
    powerful” parentheses. In C#, like most programming languages, that’s not how
    it works. Instead, you put in multiple sets of nested parentheses below. Be careful
    with multiple sets of parentheses to ensure everything lines up correctly.


    ```

    // This isn''t a real formula for anything. I''m just making it up for an example.

    double a = 3.2;

    double b = -4.3;

    double c = 42;

    double d = -91;

    double e = 4.343;

    ```


    ```

    double result = ((a + b) * (c - 4)) + d) * e;

    ```


    # Why the ‘’ Sign Doesn''t Mean Equals


    I mentioned in Chapter 5 that the ‘’ sign doesn’t mean the two things equals each
    other. Not directly. Instead, it is an assignment operator, meaning that the stuff
    on the right gets calculated and put into the variable on the left side of the
    ‘’ sign.


    Watch how this works:


    ```

    int a = 5;

    a = a + 1; // the variable will have a value of 6 after running this line.

    ```


    If you’ve a lot of math, you may notice how strange that looks. From a math standpoint,
    it is impossible for a variable itself plus 1. It’s nonsense.


    But from a programming standpoint, it makes complete sense, because what we are
    are really saying, “take the value currently in a (5), add one to it (to 6), and
    assign that value back into the variable a.” So after running that line, we’ve
    taken a and added one to it, replacing the old value of 5.


    It’s important to remember that the ‘’ sign indicates assignment, rather than
    equality.


    # Compound Assignment Operators


    It turns out what I just described (taking the current value of a variable, making
    a change to it, and updating with the new value) is very common. So much that
    there is a whole set of other operators that make it easy to do this. These operators
    are called compound assignment operators, because they perform a math function
    and assign a value at all.


    For instance, here’s the compound assignment operator that does addition:


    ```

    int a = 5;

    a += 3; // This is the same as a = a + 3;

    ```


    There are also equivalent ones for subtraction, multiplication, division, and
    the remainder operator:


    ```

    int b = 7;

    ```'
