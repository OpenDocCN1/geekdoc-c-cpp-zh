    # The bool Type


    We''ll now move away from numbers and discuss a completely different kind of type.
    The bool type is used to store Boolean or "truth" values. They can either be true
    or false. Boolean values are named after Boolean logic, which in turn was named
    after its inventor, George Bool. At first glance, this type may not seem very
    useful, but in a few chapters we will begin to talk about decision making (Chapter
    10) and will become very important.


    You can create or assign a variable to the bool type like this:


    ```

    bool itworked = true;

    itworked = false;

    ```


    Note that both true and false are considered Boolean literals.


    In many other languages, the bool type is treated like a special case of an integral
    type, where 0 represents false and 1 represents true. In fact, in many of those
    languages, it is like 0 represents false and anything else represents true. While
    the C type uses 0 and 1 to store true and false, the two are treated differently
    from each other. For example, you cannot assign 1 to a variable with the bool
    type, or true to an integer.


    While a bool type only keeps track of two states, and could theoretically be stored
    by a single bit, the bool type uses up a whole byte, simply because single bytes
    are the smallest unit of memory that you can access or reference at a time.'
