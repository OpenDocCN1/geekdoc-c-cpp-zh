  md: "# Chapter 26 Namespaces and Using Directives\n\nAs mentioned earlier in this\
    \ chapter, when you put a using directive at the top of your file, you allow your\
    \ code to just use the class name to access all of the types contained within\
    \ a namespace.\n\nWhen working with static classes, which we talked about in Chapter\
    \ 18, you can also use a special type of using directive called using static.\
    \ Remember a static class is one that is marked as static. This forces all of\
    \ its members to be static. Static classes are primarily used for utility classes,\
    \ or ones where you want to group a bunch of related methods under a shared name.\
    \ Two common examples of this are the Console and Math classes we have spent a\
    \ lot of time talking about.\n\nFor these static classes, you can add a using\
    \ directive with the static keyword for these classes, and you'll have access\
    \ to its methods without even naming the class it belongs to:\n\n```\nusing System.Math;\n\
    using static System.Console;\n\nnamespace staticUsingDirectives\n{\n    public\
    \ static class Program\n    {\n        public static void Main(string[] args)\n\
    \        {\n            double x = PI;\n            WriteLine(Sin(x));\n     \
    \       ReadKey();\n        }\n    }\n}\n```\n\nThe above code illustrates how\
    \ using the directives for a static class have been added, you can simply reference\
    \ its members. Instead of Math.PI and Math.Sin, we can simply use PI and Sin.\
    \ Instead of Console.WriteLine and Console.ReadKey, you can use WriteLine and\
    \ ReadKey.\n\nLike many features, this can be a bit of a double-edged sword. It's\
    \ nice to have your code that much more concise. But at the same time, you lose\
    \ meaningful information about what type static method, property, or variable\
    \ came from. It's possible to get carried away with this. Use it when this simplicity\
    \ makes things clearer, and avoid it when it makes it more ambiguous.\n\n> Try\
    \ It Out!\nNamespaces Quiz. Answer the following questions to check your understanding.\
    \ When you are done, check your answers against the ones below. If you missed\
