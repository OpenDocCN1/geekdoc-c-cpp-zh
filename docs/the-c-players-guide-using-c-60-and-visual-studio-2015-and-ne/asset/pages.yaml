  md: '# Viewing Exceptions 305


    larger, but it makes finding problems in your code much easier. Of course, when
    you''re done constructing your program and you know it is free, you can build
    it in release mode and sell it! Your program has to be compiled in debug mode
    or you won''t be able to easily debug.


    When we first made a program in Chapter 3, we discussed how you could start your
    program by pushing F5 or Ctrl + F5. If you want to be able to debug your program,
    it will be important to use F5, or choose Debug > Start Debugging... from the
    menu. If you start in release mode (Ctrl + F5) you won''t be able to debug.


    # Viewing Exceptions


    When your program is running in debug mode, if an unhandled exception is thrown,
    rather than dying, your program will pause and the computer will switch back to
    Visual Studio to take a look at it. You''ve probably seen this before, but here
    is a screenshot of what this looks like:


    ![](img/13bdcf341e1727795eb17926ba89a16f_327_0.png)


    Visual Studio will show you that the exception occurred in yellow, and it will
    bring up the Exception popup. On this popup, you''ll see the specific name of
    the exception that occurred (DivideZeroException, in the screenshot above) with
    the text description of the problem. Ideally, this would have a lot of useful
    details, but unfortunately, it''s kind of vague.


    The dialog also brings up some troubleshooting tips, including "Get general help
    for this exception" and "Search for more Help Online.". Both of these are so generic
    that you''re usually not'
