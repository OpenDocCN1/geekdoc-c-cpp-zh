  md: '# Adding a Reference to .NET Framework Assemblies


    ![](img/13bdcf341e1727795eb17926ba89a16f_315_0.png)


    Select the **Projects > Solution** tab on the left, and check the box for the
    project you want to reference—HelperCode, in this case. Your project will now
    include a reference to the HelperCode project that you added, visible under the
    project''s **References** node in the Solution Explorer.


    It is important to keep in mind that the newly imported project in the Solution
    Explorer is still pointing to the original location for the **HelperCode** project.
    This is a double-edged sword. Making changes here affect the original as well.
    Any other solution or project that uses it will get those changes as well. That
    can be good, because improvements will automatically be added to anything that
    uses it, but if you make any changes that are not compatible, you may break your
    other projects. If this is problematic, you might consider making a copy of the
    project to work with.


    It is also worth noting that when doing this, if you share your code with others,
    things might not work perfectly. Since you''re picking out a project that is elsewhere
    on your *computer*, Visual Studio will use a relative path to the other project.
    If you are the person sharing your code with doesn''t have that project in the
    same place relative to the original project, there''s a really good chance that
    Visual Studio will not be able to load the added project.


    **Step 3.** At this point, once you''ve got your second project added and referenced,
    you will still need to add **using** directives if you want to use the simpler,
    unqualified name for classes or other types. For more information about using
