  md: '# How to Make Comments in C#


    Writing comments—wait, let me clarify—writing comments is a key part of good code.
    Comments can be used to explain tricky sections of code, or explain what things
    are supposed to do. They are a primary way for a programmer to communicate with
    another programmer who is looking at their code. The other programmer may even
    be on the other side of the world and working for a different company five years
    later!


    Comments can explain what you are doing, as well as why you are doing it. This
    helps programmers, including yourself, know what was going on your mind at the
    time.


    In fact, if you''re the only person who will ever see your code, you should still
    put comments in it. Do you remember what you ate lunch for a week ago today? Neither
    do I. Do you really think you''ll remember what your code was supposed to do after
    a week you write it?


    Writing comments makes it so that you can quickly understand and remember what
    the code does, how it does it, why it does it, and you can even document why you
    did it one way and not another.


    # How to Make Comments in C#


    There are three basic ways to make comments in C#. For now, we''ll only really
    consider two of them, because the third applies only to things that we haven''t
    looked at. We''ll look at the third form of making comments in Chapter 15.


    The first way to create a comment is to start with two slashes: // Anything on
    the line following the two slashes will be ignored by the computer. In Visual
    Studio the comments color—green, by default—to indicate that the rest of the line
    is a comment.


    Below is an example of a comment:


    ```

    // This is a comment, where I can describe what happens next...

    Console.WriteLine("Hello World!");

    ```


    Using this same thing, you can also start a comment at the end of a line of code,
    which will make so the text after the slashes are ignored:


    ```

    Console.WriteLine("Hello World!"); // This is also a comment.

    ```


    A second method for creating comments is to use the slash and asterisk combined,
    surrounding the code,


    ```

    Console.WriteLine("Hi!"); /* This is a comment that ends here... */

    ```


    This can be used to make multi-line comments like this:


    ```

    /* This is a multi-line comment.

    It spans multiple lines.

    Isn''t it neat? */

    ```


    Of course, you can do multi-line comments with the two slashes as well, it just
    has to be done like this:


    ```

    // This is a multi-line comment.

    // It spans multiple lines.

    Isn''t it neat //

    ```


    In fact, most C# programmers will probably encourage you to use the single line
    comment version instead of the /* */ version, though it is up to you.'
