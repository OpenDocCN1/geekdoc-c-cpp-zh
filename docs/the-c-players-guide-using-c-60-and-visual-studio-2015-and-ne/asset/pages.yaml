  md: '# Simple Null Checks: Null Propagation Operators


    ```

    if(highScoreManager.Scores[0] == null) { return; } // Could still fail if empty.

    if(highScoreManager.Scores[0].Player.Name) { return; }


    ```


    Ouch. A ton of code to make things safe for use. That''s four lines of null checking!

    C#6.0 introduced a new operator the null propagation operator (or simply, the
    null propagator) that makes it easy to do these null checks without causing your
    code to get ugly. It comes in two forms, depending on what comes after it: ? and
    ?.


    Let''s look at a sample example that uses this for the first null check:


    ```

    return highScoreManager?.Scores[0].Player.Name;

    ```


    What does this operator check the thing before it was null. If it was, it simply
    evaluates to a null result. If not, it continues and evaluates whatever is beyond
    the operator. You could say that this line of code turns into the following:


    ```

    HighManager manager = highScoreManager;

    if(manager == null) { return null; }

    return manager.Scores[0].Player.Name;

    ```


    So that''s one null check. Four to more. We can string these together in a line
    to get what we want very quickly:


    ```

    return highScoreManager?.Scores[?].Player.Name;

    ```


    This us the alternative form (with the question mark, followed by the square brackets)
    in the entry to series of null checks.


    With all these null propagators, if any of the objects (immediately before a null
    propagator) turn out to be null, the expression will short circuit and evaluate
    to null. Otherwise, it will keep going the chain and evaluate the next part.


    First, it''s important to point out that when a null is evaluated, the result
    is stored for us later. The previous code illustrates that by copying highScoreManager
    to a local variable (manager) which is then used throughout the evaluation. That
    means if something causes the highScoreManager variable to change (perhaps to
    a null value, or perhaps to a different non-null value) your evaluation doesn''t
    change.


    Basically, we''ve protected ourselves against things that are become null while
    we perform this statement by creating a local/cached copy of the object. That''s
    good defensive programming, so it''s good that null propagators work like that.


    Second, it''s important to understand that this evaluates to a value. This will
    cause a small problem for us if the final value we wanted was a value type of
    a reference type. Our earlier code worked because the final return value was of
    the type string, which can deal with a value of null. It''s a reference.


    What happens if we were trying to get the high score (perhaps an int instead of
    a string)?


    ```

    int? score = highScoreManager?.Scores[?].Score;

    ```'
