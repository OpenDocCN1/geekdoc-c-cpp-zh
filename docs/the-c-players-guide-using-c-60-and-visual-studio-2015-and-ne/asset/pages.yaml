    # Implicitly Typed Variables and Anonymous Types


    Up until now, every time we''ve created a variable, we indicated the type of the
    variable. C# provides a way to infer the type of a variable at compile time. In
    the past, we''ve always done this:


    ```

    int a = 3;

    ```


    You can also implicitly typed local variables. This is done by using the var keyword,
    instead of any specific type:


    ```

    var a = 3;

    ```


    It is important to understand that the type used in a variable is determined at
    compile time, based on what is assigned to it. This is not the same as having
    any, or any type. There are some languages that are called weakly typed languages,
    where a variable can contain any kind of information you put in it. The var keyword
    does not do this. When the compiler looks at this, it will turn it into the int
    type you type inference.


    Type inference only applies for local variables. Instance variables or static
    class variables must always have an explicit type.


    Even though this is an option, in most cases I opt to use an explicit type like
    we have done along. I do this for the sake of clarity, because the compiler can
    deduce the type doesn''t mean you should force humans to do so as well.


    Different programmers have different feelings about the var keyword. Some people
    use it extensively. Other people never use it. I''ll let you judge for yourself
    when you want to use it, but believe it is useful to illustrate a few cases to
    help you understand the tradeoffs. At the simple end:


    ```

    var number = 0;

    ```


    Because of the variable''s name and the integer literal, it is easy for a human
    to deduce the type of that number variable (int).


    Here''s another one:


    ```

    var names = new List<string>();

    ```


    The type is perfectly intuitive here. It''s a generic List class, where the type
    parameter is string (a list of strings). This is another case where its easy to
    figure out the type; you even save a few keystrokes.


