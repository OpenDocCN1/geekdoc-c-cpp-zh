  md: "# Methods Revisited\n\n+   In a Nutshell\n* Parameters can be made optional\
    \ by providing a default value for the parameter: `public void DoSomething(int\
    \ x = 6) { ... }`\n* When calling a method, you can name your parameters: `DoSomethingElse(x:\
    \ 4, z: 2, y:1);` can put the parameters in any order.\n* By using the **params**\
    \ keyword, methods can have a variable number of parameters.\n* The **ref** and\
    \ **out** keyword can be used on a method parameter to pass the actual variable,\
    \ rather than just the contents of the variable, allowing the called method to\
    \ modify the contents of variables in the calling method.\n\nWe first looked at\
    \ methods in Chapter 15. We'll now take a second look at methods and discuss a\
    \ few more advanced features, because we're ready for it now.\n\n# Optional Parameters\n\
    \nLet's say you are making a method that simulates a die roll by picking a random\
    \ number between 1 and the number of sides on the die. Something like this:\n\n\
    ```\nprivate Random random = new Random();\n\npublic int RollDie(int sides)\n\
    {\n    return random.Next(sides) + 1;\n}\n```\n\nIt's entirely possible that 99%\
    \ of the time, you're going to be passing in 6 for the **sides** parameter. It\
    \ will be kind of annoying to always need to say **RollDie(6)**. C# provides a\
    \ way to specify a default value for a parameter, making it optional as long as\
    \ you're OK with the default. Doing this is pretty easy:"
  merge: -1
