  md: "# The Relationship between Delegates and Events\n\nIn the vast majority of\
    \ cases, delegates are not used to call more than one method at a time, and events\
    \ quite often. So C# programmers do not see delegates that reference more than\
    \ one method at a time, and make the incorrect assumption that they can't handle\
    \ it at all.\n\nA more accurate way to think of it is along the lines of an event\
    \ being a property-wrapper delegate. Specifically, what we've seen until now is\
    \ an auto-implemented property. Let's look back at our earlier example with our\
    \ NumberChanged event:\n\n```\npublic event EventHandler<NumberChangedArgs> NumberChanged;\n\
    ```\n\nThe compiler expands this into code that looks more like this:\n\n```\n\
    private EventHandler<NumberChangedArgs> numberChanged; // The wrapped delegate\n\
    \npublic event EventHandler<NumberChangedArgs> NumberChanged\n\n    add { numberChanged\
    \ += value; } // Defines behavior when a method subscribes.\n    remove { numberChanged\
    \ -= value; } // Defines behavior when unsubscribing.\n```\n\nWrapping the delegate\
    \ this prevents people from outside of the class from invoking the delegate (other\
    \ words, you can no longer raise an event out of the class that it exists in)\
    \ as well as mucking with the methods that are contained in the delegate chain.\n\
    \nInterestingly, the code above is actually completely legal code. If you don't\
    \ like the default implementation of an event, you can write code that looks like\
    \ the previous sample and do something different or additional with it. In practice,\
    \ it's rare to have a real need to deviate from the standard pattern, but it is\
    \ allowed.\n\nOne complication with explicitly implementing the add and remove\
    \ parts for an event is this: instead, you have to invoke the delegate that it\
    \ wraps (numberChanged instead of NumberChanged, in this specific case). That\
    \ you've created custom behavior for what it needs to add or remove a method to\
    \ an event and the normal rules aren't guaranteed to apply. For instance, it's\
    \ possible that the event doesn't raise a delegate at all, or that it subscrib\
    \ or unsubscribes from multiple delegates, depending on certain conditions. Since\
    \ the compiler cannot guarantee what it means to raise the event anyone, the programmer\
    \ must determine what it means.\n\n# Try It Out!\nDelegates and Events Quiz. Answer\
    \ the following questions to check your understanding. When you're done, check\
    \ your answers against the ones below. If you missed something, go back and review\
    \ the section that talks about it.\n\n+   1. True/False. Delegates allow you to\
    \ assign methods to variables.\n2. True/False. You can call and run the method\
    \ currently assigned to a delegate variable.\n3. True/False. Events allow one\
    \ object to notify another object when something occurs.\n4. True/False. Any method\
    \ can be attached to a specific event.\n5. True/False. Once attached to an event,\
    \ a method cannot be detached from an ever.\n\nAnswers: (1) True. (2) True. (3)\
    \ True. (4) False. (5) False."
  merge: -1
