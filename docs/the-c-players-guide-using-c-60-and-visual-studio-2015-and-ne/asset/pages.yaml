    To create a delegate-typed object, we simply create a variable with a delegate
    type, like the MathDelegate we just created. Like with a normal variable, we can
    assign it a value, but in this case, value will be the name of a method that matches
    the delegate:


    ```

    MathDelegate mathOperation = Add;


    int a = 5;

    int b = 7;


    int result = mathOperation(a, b);

    ```


    On the last line, you see we can also use the variable, calling whatever method
    happens to be storing at that particular point in time. Doing this looks like
    a normal call, except that "delegates to" or hands off execution to whatever method
    happens to be stored in the delegate at the time.


    If you''ve never seen anything like this before, it may look kind of strange.
    I hope you can start to imagine how delegates could be helpful, allowing you to
    dynamically change which method is used at runtime. As we move through the next
    few chapters, we''ll see how they can be used as a part of events (Chapter 31),
    lambda expressions (Chapter 35), and query expressions (Chapter 36). They will
    be the foundation for a lot of really powerful features in C#.


    # The Delegate and MulticastDelegate Classes


    When we''ve got a basic understanding of C#''s syntax when dealing with delegates,
    it''s time to look under the hood and see how the C# compiler does with a delegate
    that you define. This will help explain some of the nuances of delegates, and
    should help you see delegates from another perspective.


    A delegate is syntactic sugar around a class. The .NET Framework defines a Delegate
    class. When you create a delegate, the C# compiler will turn it into a class that
    is derived from Delegate. Specifically, it will be derived from MulticastDelegate,
    which is derived from Delegate.


    You are not allowed to create a class that derives from either of these manually
    (class MyClass : MulticastDelegate is not legal code). Only the compiler is allowed
    to derive from these special classes.


    The Delegate and MulticastDelegate classes define the core functionality of delegates.
    On top of that, the C# language itself heaps a stack of magic and a pile of syntactic
    sugar on to provide programmers with cleaner syntax for working with delegates.


    The key to learn from this is that it''s just a class, like the many other classes
    that we''ve dealt with. This has several implications that are worth of mention:


    +   - You can declare a new delegate type where you declare a new class.

    - A variable that stores a delegate can contain null.

    - Before invoking the delegate, you should check for null first if there is any
    possibility that the variable actually contains a null reference.'
