  md: '# # Error Handling and Exceptions


    +   ### In a Nutshell

    * Exceptions are C#''s built-in error handling mechanism.

    * Exceptions package up information about a problem in an object, and are "thrown"
    by the method that discovered the problem back up the call stack until it finds
    a place that can catch/handle the error, or until it reaches the top of the call
    stack and kills your program.

    * If you know are running code that could potentially cause a problem, wrap it
    in a **try-catch** block, putting the type of exception in the parentheses: `try
    /* exception thrown here */ catch(Exception e) (/* handle problem here */)`

    * You can catch **Exception** or any type derived from **Exception** (e.g., FormatException).
    Catching a more specific type will only catch that type of error, leaving other
    types to other blocks.

    * You can string together multiple catch blocks, from most specific to least specific
    types of exceptions: `try {} catch(FormatException e) {/* handle errors here */}
    catch(Exception e)`n* You can create your own types of exceptions deriving from
    the **Exception** class.

    * If your code discovers a problem, you can start an exception with the **throw**
    keyword: `new Exception("An error has occurred.");

    * Exception filters allow you to catch an exception only if certain conditions
    are met, letting others go to another catch clause: `catch(Exception e) if(e.Message
    == "Message")`


    We spent the entirety of this book so far pretending that everything in our program
    went according to plan. But the reality is, that''s not just what happens. Sometimes
    a method is running, trying to do its job, when it discovers that something has
    gone terribly wrong.'
