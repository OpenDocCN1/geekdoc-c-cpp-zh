  md: "# Creating a Method\n\nThe idea of the method is to take a piece of your code\
    \ and place it inside of a specific block with a specific name, allowing you to\
    \ run it from anywhere in your program. We can more easily locate a bug or problem\
    \ in a program because we can pinpoint it to a very specific method. In addition,\
    \ we can reuse a method as many times as we want, which means we don't have to\
    \ rewrite it, saving ourselves.\n\nIn this chapter, we'll look at how to create\
    \ a method and how to use it (called \"calling\" a method), as well as how to\
    \ get data back and send data to a method. We'll then look at creating multiple\
    \ methods with the same name—a process called overloading.\n\nWe'll then another\
    \ look at the Console and Convert classes, which we've used in previous chapters,\
    \ armed with the new knowledge we have about methods. We'll wrap up our discussion\
    \ about methods with a quick look at a powerful (but sometimes confusing) trick\
    \ that you can use with methods called recursion.\n\n# Creating a Method\n\nLet's\
    \ get started by creating our first method. If you start with a brand new project,\
    \ you'll see yourself staring down at what code looks like:\n\n```\nusing System;\n\
    using System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\nusing\
    \ System.Threading.Tasks;\n\nnamespace Methods\n{\n    public class Program\n\
    \    {\n        static void Main(string[] args)\n    }\n}\n```\n\nIf you remember\
    \ from the Hello world made back in Chapter 3, this template code already defines\
    \ a method (the Main method) for us. At the time, we only had a basic idea of\
    \ what a method was, but we know more now. You can see from the template code\
    \ that the Main method is contained inside of a class called Program. (We're still\
    \ getting to classes.) We've already using a method, without even really thinking\
    \ about it!)\n\nBasically, all methods belong to a type. A class is one example\
    \ of a type. Most of the types we will create be, but methods can also handle\
    \ the handling of other types that we will look over the course of this book.\
    \ Because the method belongs to the class, it is a member of that class.\n\nWhenever\
    \ we create new methods, we will need to add them to a specific type. They can't\
    \ be floating around on their own. For now, we've already got the Program class\
    \ where our Main method is, which is a perfect spot for our new methods.\n\nSo\
    \ let's go ahead and make our first method. Let's make a method that simply prints\
    \ out the numbers 1 through 10. This new method looks like the following:"
