  md: '# String Interpolation


    To handle this, we can take advantage of escape characters. In C#, you start an
    escape sequence with the backslash (\). Inside of a string literal, you can use
    a backslash, followed by a quotation mark, to recognize it as a quotation mark
    that belongs inside the string, as opposed to one that ends the string:


    ```

    Console.WriteLine("\\");"

    ```


    It is worth pointing out that even though \" is visually two characters, it is
    treated as only one. C# has lots of different escape characters you''ll find useful.
    \t is the tab character, and \n is the newline character. You can see how this
    works in the following example:


    ```

    Console.WriteLine("Text\non\nmore\nthan\nline.");

    ```


    This will print out:


    ```

    Text

    on

    more

    than

    line.

    ```


    So what if you want to print out an actual backslash character? By default, the
    computer will try to take \ and combine it with the next letter to represent an
    escape character, since it marks the beginning of an escape sequence. To print
    out the backslash character, you will need to use two backslashes:


    ```

    Console.WriteLine("C:\\Users\\RB\\Desktop\\MyFile.txt");

    ```


    This will print out:


    ```

    C:\Users\RB\Desktop\MyFile.txt

    ```


    If you find that all of these escapes are kind of annoying, you can use the ''@''
    symbol before the text (called a *verbatim literal*) which tells the compiler
    to ignore escape characters in the string. The following line is equivalent to
    the previous one:


    ```

    Console.WriteLine(@"C:\Users\RB\\Desktop\\MyFile.txt");

    ```


    # String Interpolation


    While we''re the subject of user input and output, there''s a new feature of C#
    6.0 that is worth talking about. That is string formatting and the new string
    interpolation feature.


    ```

    Console.WriteLine("The cylinder''s volume is: " + volume + " + cubic units.");

    ```


    C# 6.0 introduces a new feature called string interpolation. This feature allows
    you to write this thing in a much more concise and readable way:


    ```

    Console.WriteLine($"The cylinder''s volume is: {volume} cubic units.");

    ```'
