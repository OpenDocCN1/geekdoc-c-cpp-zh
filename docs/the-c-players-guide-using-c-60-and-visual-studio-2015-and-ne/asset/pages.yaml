    # Arrays


    # In a Nutshell


    +   * Arrays store collections of related objects of the same type.

    * To declare an array, you use the square brackets: `int[] numbers`;

    * To create an array, you use the `new` keyword: `int[] scores = new int[10];

    * You can also create arrays using collection initializer syntax: `int[] scores
    = new int[] { 1, 2, 3, 4, 5 };

    * You can access and modify values in an array with square brackets as follows:
    `int firstScore = scores[0]; scores[0] = 44;`

    * Indexing of arrays is 0-based, 0 refers to the first element in the array.

    * You can create arrays of anything, including arrays of: `int[][] grid;

    * You can also create multi-dimensional arrays: `int[,] grid = new int[5,4];

    * You can use the `foreach` loop to easily loop through an array and do something
    with each item in the array: `foreach(int score : scores) { /* ... */ }`


    In this chapter, we''ll take a look at arrays. Arrays are powerful features of
    any programming language. They allow us to store collections or groups of related
    objects together. We''ll talk about how to create and use them, through a few
    examples of how to work with them, how to make multi-dimensional arrays (what
    they call a `matrix` in the math world) and wrap up with a discussion of the last
    type of loop that we didn''t discuss in the previous chapter.


    # What is an Array?


    An array is a way of keeping track of a group of many related things all together.
    Imagine that you have a high score in a game, with 10 high scores on it. Using
    the tools we know so far, you could create one variable for every score that you
    want to keep track of. Something like this:


    ```

    int score1 = 100;

    int score2 = 95;

    ```'
