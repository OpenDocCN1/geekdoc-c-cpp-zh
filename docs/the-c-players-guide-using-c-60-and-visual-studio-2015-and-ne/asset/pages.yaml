  md: "# Unsafe Code 257\n\n```\npublic const double PI = 3.141592;\n```\n\nAdding\
    \ **const** tells the compiler we're assigning a value and it will never change.\
    \ In fact, if we try to assign a value to it at some point in our program, we'll\
    \ get a compiler error.\n\nIf you have a value that you will never change, it's\
    \ a good idea to make it into a constant by adding the **const** keyword to it.\
    \ That way, no one will miss it on accident.\n\nIt is worth noting that anything\
    \ marked with **const** is automatically treated as though it were **static**.\
    \ This is assumed (and required) you don't need to (and can't) make it **static**\
    \ yourself.\n\nThe **readonly** keyword is similar to this, but it has an important\
    \ difference. Anything that marked **const** must be assigned a value right up\
    \ front, when the program is compiled. As such, they are often called compile-time\
    \ constants. Things that are marked with **readonly** can be assigned to in a\
    \ constructor or at the same place it is declared, and not after. These are *readonly*\
    \ constants.\n\nYou can assign to a **readonly** field either when you declare\
    \ the variable (like runtime constants) or also, in a constructor of the class.\
    \ This brings you to the key distinction: run-time constants can be different\
    \ in every instance of a class.\n\nFor example, we could create a **Point** class\
    \ that has an x and y-coordinate in such a way that once it has been created,\
    \ it is impossible to change the values.\n\n```\npublic class Point {\n    private\
    \ readonly double x;\n    private readonly double y;\n\n    public double X()\
    \ { return x; } // We could have also used a readonly property\n    public double\
    \ Y() { return y; } // for these, but this illustrates the point well.\n\n   \
    \ public Point(double x, double y) {\n        this.x = x;\n        this.y = y;\n\
