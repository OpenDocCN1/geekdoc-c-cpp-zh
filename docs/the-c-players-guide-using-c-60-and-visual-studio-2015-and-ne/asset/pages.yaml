  md: '# 312 Chapter 45 How Your Project Files are Organized


    flaming swords and singing a rock ballad about doing the Fandango. And the fact
    that people can get away without knowing how it works means it''s doing its job.


    Still, I think it is worth digging into a project and seeing how things are organized
    and what everything is for. In this chapter, we''ll take a look at the directory
    structure that Visual Studio creates and at what is contained in each of the files
    we discover.


    # Try It Out!

    Demystifying Project Files. Follow along with this chapter by opening up any project
    of yours and digging around until you understand what every file you discover
    means.


    In Depth

    Version Control. Throughout this chapter, I''ll be pointing out parts of your
    project''s directory structure that should be placed in version control and parts
    that should not. While a full explanation of version control software is well
    beyond the scope of this book, it is worth a brief introduction. Version control
    is a category of software that serves many purposes: the ability to share code
    among team members, the ability to track changes to code over time, keeping a
    history of your software''s development. SVN, Git, and Mercurial are all popular
    and free version control systems that you can use.


    The general rule for what goes into version control is user-specific projects
    don''t belong in version control (everyone should have their own copy) and anything
    that can be rebuilt from other things (like compiled executable files) should
    be skipped as well. Everything can go in your version control system.


    # Visual Studio''s Projects Directory


    Visual Studio will place each solution or project you create in your own directory.
    These projects are all in the same place by default, though you can pick a different
    location when you create a project.


    By default, these projects are all stored in [Documents Directory]/Visual Studio
    2015/Projects, where [Documents Directory] is your ''My Documents'' or ''Documents''
    directory.


    If you''ve putting all of your projects in the default location, you should be
    able to open that directory and see a folder for each of the projects you''ve
    created. All projects have the same overall directory structure, so once you''ve
    figured one out, the others should make sense as.


    # The Solution Directory


    Solutions vs. Projects

    The top level folder corresponds to a solution. Remember that a solution can be
    thought of as a collection of projects that are all related, and used together
    to accomplish a specific task.


    You may remember that in the past, when you''ve been ready to start on something
    new, that you''ve chosen File > New Project from the menu. What you get is actually
    a new project, created inside of a new solution. In the past, when you''ve created
    a project, you''ve also creating a new solution to contain it.'
