    In the world, there are objects. There are houses, cars, balls... you name it.
    Actually, let me be a little more specific. What we just listed are types of objects.
    Entire categories or "classes" of objects. I mean we referred to balls, but there
    are also lot of specific balls. This and that ball, the red ball and the blue
    ball, and the basketball that was signed by LeBron James.


    We know that all things that belong to a particular category or class will have
    certain attributes. We know balls have a size, and that they will have a color.
    Each ball may have a different size and a different color, we know they''ll all
    have a size and color. A ball''s size and color defines its state.


    We also know that all things of a particular category or class will have certain
    behaviors. Different things that they can do, or that they can be done with. For
    instance, balls can be thrown, or they can be popped. You can do this (or attempt
    to do this) with any and every ball.


    In C#, as well as nearly other object-oriented programming language, we can build
    new, special types, modeled on these ideas. In C#, we will create code, packaged
    in what is called a class. You can think of a class as a blueprint for objects
    or instances of that type. While the class outlines how the entire category works,
    an object or instance is a single, specific one.


    A class will outline three things about our new type:


    +   1. The state or attributes of the new type can have, using variables (Chapter
    5). These variables can be any of the built-in types, or they can even be other
    types that you create.

    2. The behaviors that the new type can do, or that they can be done with, using
    methods (Chapter 15).

    3. The ways in which you can build or construct a new object or instance of the
    given type or class. This is done by using a special type of method called a constructor,
    which we''ll learn more about in the next chapter.


    Continuing with our example, we might create a Ball class that includes two variables,
    one for the ball''s size, and one for the ball''s color. The Ball class might
    also include a Throw and a Pop method. In the next chapter, we''ll look at how
    to actually create a class like this.


    Because a class combines a collection of variables and methods, you can also think
    of a class as a simple way of packing related data and methods together into one
    new cohesive piece.


    It is important to keep the concepts of classes and objects separated in your
    head. They refer to two different things, so they''re easily confused. A class
    defines how about the entire category of objects, while an object or instance
    is a specific one. You define a Ball class, but then using that class, you can
    create or build specific balls, each with their own size and color.


    You can create a class for just anything. We could make a Ball class, a House
    class, a Car class, or even our own PurpleMonsterDish if we really wanted to.
    Now we''re no longer going to be limited to just the built-in types like int,
    string, or float.


