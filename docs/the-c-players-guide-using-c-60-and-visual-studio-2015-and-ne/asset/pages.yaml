  md: '# Lambda Expressions 229


    like this, the method is only ever once. It seems overkill to go to all the trouble
    of creating a whole method to do this, especially since it starts to clutter the
    namespace. We can no longer use the name ISeven for anything else within the class.
    That may not be a problem, but it might.


    Second, and perhaps more important, that method located somewhere else in the
    source code. It may be elsewhere in the file, or even in a completely different
    file. This separation makes it bit harder to truly understand what''s going on
    when you look at the source code. Our current case, this is mostly solved by calling
    the method intelligent (ISEven) but you don''t always get lucky.


    This issue is common enough back in C# 2.0, which added a feature called anonymous
    methods to deal with it. Anonymous methods allow you to define a method "line,"
    without a name.


    I''m not going to go into a lot of detail about anonymous methods here, because
    lambda expressions mostly replaced them.


    To accomplish what we were trying to do with an anonymous method, instead of creating
    a whole method named ISEven, we could do the following:


    ```

    numbers.Where(delegate(int number) { return (number % 2 == 0); });

    ```


    If you take a look at that, you can see that we''re basically taking the old ISEven
    method and sticking it in, "line."


    This solves two problems. We no longer have a named method floating filling up
    our namespace, and the code that does the work is now at the same place as the
    code that needs the work.


    I know, I. You''re probably saying, "But that code is not very readable! Everything''s
    just smashed together!" And you''re right. Anonymous methods solved some problems,
    while introducing others. You would have to decide which set of problems works
    best for you, depending on your specific case.


    But this finally brings us to lambda expressions.


    # Lambda Expressions


    Basically, a lambda expression is simply a method. More specifically, it is an
    anonymous method that is written in a different format that (theoretically) makes
    it a lot more readable. Lambda expressions were new in C# 3.0.


    > In Depth

    The Name "Lambda." The name "lambda" comes from calculus, which is the mathematical
    basis for programming languages people used before there were computers at all.
    (Which kind of strange to think about.)

    Lambda" would really be spelled with the Greek letter lambda (λ) but the keyboard
    doesn''t it, so we just use "lambda."'
