    One of several operators that operate on the individual bits of a value, as opposed
    to treating the bits as a single value with semantic meaning. Bitwise operators
    perform operations like and, or, not xor (exclusive) on two bits in the same location
    of different values. It also includes bit shift, which shifts the bits of a value
    to the left or right. In C#, the extra bits are filled with the value 0. (Chapter
    39.)


