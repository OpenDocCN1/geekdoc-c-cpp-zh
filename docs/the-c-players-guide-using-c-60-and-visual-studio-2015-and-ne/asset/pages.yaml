    # # Reverse It!


    In this task, we''re going to make a simple array-based game. We''ll start by
    making an array that can hold 9 integer values, and we''ll put the numbers 1 through
    9 in the array. Make sure you don''t have any duplicates. Each number should appear
    exactly once.


    The array will be printed out to the user like:


    ```

    5 3 8 6 4 1 2 9 7

    ```


    Allow the user to type in a 1 through 9. Whatever the user types in, we''re going
    to reverse that numbers, starting at the front. From the randomized starting position
    shown above, if the user typed in the number 4, we end up reversing the first
    four numbers, the resulting array would be:


    ```

    6 8 3 5 4 1 2 9 7

    ```


    The player can keep typing in numbers, and will keep reversing the indicated part
    of the array until the array is in ascending order:


    ```

    1 2 3 4 5 6 7 8 9

    ```


    When this happens, the player has won the game, and the game ends. Before closing,
    show the number of moves it took the player to win.


    Can you figure out an optimal strategy for this game? It is possible to win this
    game in no more than 16 moves, regardless of the starting arrangement.


    # # Pig Dice


    In the game of Pig Dice, players take rolling two six-sided dice. A player''s
    turn, they roll the dice repeatedly until they choose to hold (stop) or roll a
    1. As long as the player keeps rolling without getting a 1 on either die, the
    numbers on the dice are added to the player''s score. At any point, a player can
    hold, which takes their turn score and permanently adds it to their overall score.
    If they roll a 1 on either die, they lose all the points they collected in their
    turn score, nothing extra is added to their overall score, and it becomes the
    next player''s turn. When a player''s overall score reaches 100, the game ends,
    and they have won.


    To illustrate, let''s say Alice (player #1) rolls a 3 and 4. That gives her 8
    points, for a turn score of 15. Alice chooses to roll, getting a 2 and 5. This
    gives her another 8 points, for a turn score of 15. Alice then chooses to hold,
    and her current turn score is added to her overall score. Alice now has 15 points,
