    \ to use the nameof operator, we can make it much more resilient to changes in\
    \ the code:\n\n```\npublic override string ToString() {\n    return $\"{nameof(book)}\\\
    {nameof(Title)}=\\{Title} {nameof(Author)}=\\{Author} \" + $\\{nameof(Pages)}=\\\
    {Pages} {nameof(WordCount)}=\\{WordCount}}\";\n}\n```\n\nNow any changes to a\
    \ variable, property, or class will be reflected in this code.\n\n# Bit Fields\n\
    \nWe usually work with objects at a relatively high level, thinking of them as\
    \ containers for numbers, strings, or complicated classes. Behind the scenes,\
    \ though, they are essentially little containers to store a pile of bits. Every\
    \ type of data that we've talked about is represented as bits.\n\nTo illustrate,\
    \ briefly how a byte stores values, a byte can hold values 0 to 255 in a single\
    \ byte, with 8 bits. These values are stored using binary counting. So the number\
    \ 0 is stored with the bits 00000000, the number 1 is stored with the bits 00000001,\
    \ the number 2 is stored with the bits 00000010, and so on.\n\nThere's a lot to\
    \ know about in binary, and if you've had any experience to to before, it's worth\
    \ taking some time to learn how it works.\n\nThere are a few cases where we wanted\
    \ to sort fall back down to a level of a, and with individual bits and bytes.\
    \ In fact, you may use this extensively in certain types of projects.\n\nOne of\
    \ the popular ways of using raw data of bits is a bit field. Let's start our discussion\
    \ with a brief explanation of why people are interested in bit fields. Let's say\
    \ you're creating an online discussion board or forum. You'll have lots of users,\
    \ with different permissions and abilities. Some people may be able to delete\
    \ posts, edit posts, etc., which others not.\n\nKnowing what we've discussed,\
    \ we can easily imagine storing each of these values as a bool. And that gets\
    \ the job done. But each bool takes up 1 full byte, and if you have dozens of\
    \ users, and millions of users, that adds up quickly."
