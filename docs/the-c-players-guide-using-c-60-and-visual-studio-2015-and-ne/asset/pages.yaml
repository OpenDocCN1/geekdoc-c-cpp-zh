    While it is possible to use with the *byte*, int, this kind of stuff is typically
    done with an enumeration in C#, to make the whole thing more readable. (Enumerations
    were introduced in Chapter 14). Before we use an enumeration for this, we must
    use the *Flags* attribute and assign the right values to each member of the enumeration:


    [Flags] // Don''t forget to add the Flags attribute

    public enum ForumPrivileges'
