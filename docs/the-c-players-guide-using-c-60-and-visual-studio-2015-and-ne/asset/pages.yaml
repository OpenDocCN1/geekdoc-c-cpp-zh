    The second part of declaring a variable is giving it a name. It is important to
    remember that a variable''s name is free for humans only. The computer does not
    care what it is called. (In fact, if you hand it off to the computer, it changes
    the name to a memory location anywhere.) So you want to choose a name that makes
    sense to humans, and accurately describes what you''re putting in it. with we
    can call variables by a single letter (like x), but in programming we can be more
    precise and call it something like **score** instead.


    As always, C# statements end with a '','', which tells the computer that it has
    reached the end of the statement. After this line, we created a new variable with
    the name **score** and with a type of **int** we''re now able to use!


    # Assigning Values to Variables


    The next thing we want to do is to put a value in your variable. This is called
    *assigning* a value to the variable, and it is done using the assignment operator
    "=". The line of code below assigns the value 0 to the score variable we just
    created:


    ```

    score = 0;

    ```


