  md: "# The Do-While Loop\n\nOne thing to remember with a while loop is that it always\
    \ checks the condition before going into the loop. If the condition is not met\
    \ from the get-do, it never goes into the loop. In this little example, it is\
    \ important that we initialize playersNumber to -1, because if we started it at\
    \ 0, the flow of execution would have jumped over the while loop, and the player\
    \ would never have been able to choose a number.\n\nLike if statements, if you\
    \ only have one statement inside of a while loop (or any of the other loops we'll\
    \ discuss here) the curly braces are optional.\n\n# The Do-While Loop\n\nThe next\
    \ type of loop we will look at is a slight variation on the while loop. It is\
    \ the do-while loop. Remember that, a while loop will first check the condition\
    \ to see if it is, and not, and it could potentially skip the loop entirely?(Might\
    \ I add that this isn't a bad thing; it's just something to remember. Most of\
    \ the time, that is exactly how you want it.\n\nIn contrast, the do-while loop\
    \ will always be executed at least once. This is useful if you are trying to set\
    \ up the first time through the loop, and you know it needs to be executed at\
    \ least once.\n\nLet's revisit that example, because it is a prime candidate for\
    \ a do-while loop. Remember, we needed to set the player's number to -1, to force\
    \ it to go through the loop at least once? Doing this as a do-while loop solves\
    \ the need for:\n\n```\nint playerNumber;\n{\n    Console.Write(\"Enter a number\
    \ between 0 and 10: \");\n    string playerResponse = Console.ReadLine();\n  \
    \  playerNumber = Convert.ToInt32(playerResponse);\n}\nwhile (playerNumber < 0\
    \ || playerNumber > 10);\n```\n\nTo form a do-while loop, we put the do code at\
    \ the start of the loop, and at the end, we put the while keyword. Also notice\
    \ that you need a semicolon at the end of the while line. Everything else is the\
    \ same, but you don't need to initialize the playersNumber variable because we\
    \ know that the loop will be executed at least once before the condition is checked.\n\
    \n# The For Loop\n\nNow's take a look at a slightly different kind of loop: the\
    \ for loop. For loops are very common in programming. They are another way of\
    \ counting loop types, and we'll see how useful they are again in the next chapter\
    \ with arrays. For loops are a bit more complicated to set up, because they require\
    \ three components inside of the parentheses, whereas while and do-while loops\
    \ have only required one. It is structured like this:\n\n```\nfor(initial condition;\
    \ condition to check; action at end of loop)\n{\n    // ...\n}\n```\n\nThere are\
    \ three parts separated by semicolons. The first part sets up the initial state,\
    \ the second is the condition (the same thing that was in the while and do-while\
    \ loops), and the third part is an"
