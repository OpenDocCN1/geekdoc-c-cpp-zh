  md: '# # Breakpoints 307


    is. This is like able to change the tires of a car as you drive it down the road
    without even stopping.


    But this doesn''t work in all cases. For starters, if the problem occurred outside
    of the current method (on the top of the stack trace) you won''t be able to edit
    that method and continue. You can only continue from changes made to the top method
    on the call stack.


    Also, if you''re doing a LINQ query when the exception occurs, you won''t be able
    to edit.


    In many cases, you''ll be able to edit code while it''s stopped. To edit your
    code, once the program has stopped and switched back to Visual Studio, just start
    editing your code you normally would. If in the process of editing, you introduce
    an error that prevents it from compiling, you won''t be able to resume until you
    fix the compiler errors.


    There are some types of edits that you won''t be able to do. You won''t be able
    to add a new using directive. And that the normal steps you may do to by a using
    directive just won''t show up in the menu. You won''t be able to structurally
    modify a point, so no adding, renaming names, properties, instance variables,
    or class variables. The way the debugger swaps code just doesn''t allow you to
    swap out structural changes that like, just to functionality. If you make a structural
    change, the change you made will be underlined in blue, and Visual Studio will
    tell you it needs to remember and restart the changes to take effect.


    # # Breakpoints


    Up now you''re only about debugging code after your program runs into a problem.
    You''ll of course be able to occasionally analyze run code before there''s a crash.


    Whenever you want, you can set a breakpoint on a particular line of code in Visual
    Studio. A breakpoint is a mark of code so when the program reaches that line during
    execution, the program will halt, allowing you to take a look at the program''s
    current state.


    To set a breakpoint, simply locate the line you want to set the breakpoint at,
    and on the left side, click in the area, marked in the image on the left below:


    ![](img/13bdcf341e1727795eb17926ba89a16f_329_0.png)


    When you do this, a red circle will appear in the left margin of the line you
    have selected, and the text on that line will also be marked in red. This looks
    like the image on the right side.'
