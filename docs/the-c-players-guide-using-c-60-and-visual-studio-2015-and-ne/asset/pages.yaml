  md: "```\nConsole.WriteLine(\"You can do better than 4....\");\nbreak;\ncase5:\n\
    Console.WriteLine(\"S? Really? That's what you went with?\");\nbreak;\ndefault:\n\
    Console.WriteLine(\"Hey! That wasn't even an option!\");\nbreak;\n```\n\nAs you\
    \ can, start out with the switch statement, and in parentheses, we put the variable\
    \ we are going to base our \"switch\" on.\n\nThen, we have a sequence of case\
    \ statements (sometimes called case labels), which indicate if the variable matches\
    \ the value of the case statement, the contained block of code is where the flow\
    \ of execution will go.\n\nIt is important to note that the flow of execution\
    \ will be exactly one of the case labels, so you will never end up in a situation\
    \ where one case block gets executed.\n\nAt the end of each case block, you must\
    \ put the break keyword, which sends the flow of execution back out of the switch\
    \ statement, and to the next part of the code.\n\nNotice, that we can have a default\
    \ label, which indicates that the flow of execution should go if none of the other\
    \ case labels are a match. The default label does need to be the last one, but\
    \ typically that's what people put it, and it is good practice to do so. The default\
    \ block works as a sort of catch-all for anything other than the specific situations\
    \ of the other case labels. Note that this is the final else in our original,\
    \ giant if statement.\n\n# Types Allowed with Switch Statements\n\nIn our example,\
    \ we see that you can use the int type in a switch statement. Not all types will\
    \ be used in a switch, but many can. Here's the list of types that you can use:\
    \ bool, string, and any of the integral types (including char).\n\nWe can also\
    \ use enumerations in a switch statement, though we haven't discussed those yet.\
    \ We will later on in Chapter 14.\n\n# No Implicit Fall-Through\n\nIf you are\
    \ coming from the C++ or Java world into the C# world, you may be aware of a little\
    \ trick that you can do where one case block \"falls through\" to the next block\
    \ if you leave off the break statement.\n\nSo for instance, you can do this in\
    \ C++ and Java:\n\n```\n// This doesn't work in C#\nswitch (menuChoice)\n{\n \
    \ case 1:\n    Console.WriteLine(\"You choose 1.\");\n  case 2:\n    Console.WriteLine(\"\
    You choose 2. Or maybe you choose 1.\");\n    break;\n}\n```"
