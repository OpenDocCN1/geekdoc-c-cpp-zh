  md: "# 74 Chapter 12 Looping\n\n```\nConsole.WriteLine(x);\n++;\n```\n\nLet's take\
    \ a minute and look at what the computer does when it runs into this checks the\
    \ condition in the while loop. This starts with the variable x being 1. The program\
    \ then checks the condition in the while loop and asks, \"x is less than equal\
    \ to 10?\" This is true, so the inside of the while loop gets. It writes out the\
    \ value of x, which is 1, then increments x. (Remember that it adds one to it.)\
    \ When it hits the end curly, it finishes the loop and goes back up to the beginning\
    \ of the loop, checking the condition again. This time, however, x has changed.\
    \ It is now 2. The condition is still 2 (is less than or equal to 10) and the\
    \ loop repeats again, printing \"2\" and incrementing x to 3. This happens 10\
    \ times total, until x increments to 11. When the program checks to see if 11\
    \ is less than or equal to 10, the condition is no longer true, and the flow of\
    \ execution goes down the end of the loop.\n\nOne thing to think it is easy to\
    \ end up with a bug in your code makes the condition of a loop never met. Imagine\
    \ (or better yet, try out) that the x++; wasn't there. The program would repeat\
    \ the loop, and each x would still be 1. The program would never end! This problem\
    \ is actually common enough to be given its own name: an infinite loop. I promise\
    \ you, by the time you're done your real program, you will be proud of at least\
    \ one infinite loop. It happens.\n\nTo fix the problem, you may need to pause\
    \ your program's execution, see where it is getting stuck, close your program,\
    \ fix the problem in your code, and restart. The process of debugging your program\
    \ like this was discussed in Chapter 44.\n\nWhile we're on the subject of infinite\
    \ loops, I'm going to notice that some people make them on purpose. It sounds\
    \ strange, I know. It is easy to do:\n\n```\nwhile(true)\n{\n  // Depending on\
    \ what goes here, you'll never end...\n}\n```\n\nDepending on what you put inside\
    \ the loop (like a break statement, we'll discuss in detail later in this chapter)\
    \ you can actually get out of the loop.\n\nI've occasionally heard an infinite\
    \ loop that was intentionally called a \"forever loop\" instead. It's not a term\
    \ all programmers will be familiar with, but there is some value in distinguishing\
    \ intentional infinite loops from the accidental ones.\n\nMoving on, here's a\
    \ more complicated (and more useful) example which repeats over and until until\
    \ the user enters between 0 and 10:\n\n```\nint playersNumber = -1;\n\nwhile(playersNumber\
    \ < 0 || playersNumber > 10)\n{\n  // This code will get repeated until the player\
    \ types in a number between 0 and 10.\n\n  Console.Write(\"Enter a number between\
    \ 0 and 10: \");\n  string playerResponse = Console.ReadLine();\n  playersNumber\
    \ = Convert.ToInt32(playerResponse);\n}\n\n}  \n```"
