    \ when somebody types in \"asdf\" instead of an actual number?\n\nWhen we get\
    \ to the point where we call Convert.ToInt32, things are going to fail apart.\
    \ We're asking it to do something to the normal circumstances: turn text that\
    \ has nothing to do with numbers into a number. Not surprisingly, Convert.ToInt32\
    \ is going to fail at this task. If we don't find a way to successfully handle\
    \ this error, it will ultimately bring us down our whole application.\n\nC# provides\
    \ a powerful way to trap or \"catch\" these exceptions and recover from them gracefully.\
    \ C# uses an approach called exception handling. It is similar to many other languages,\
    \ like C++, Java, and VB.NET.\n\n# How Exception Handling Works\n\nWhen an error\
    \ occurs, the code discovered that the problem will package up all the information\
    \ it knows about the problem into a special object called an exception. These\
    \ exceptions are either an instance of the Exception class or a class derived\
    \ from the Exception class.\n\nSince the method that error does not know how to\
    \ recover from it (otherwise it would handle itself, without creating an exception),\
    \ it knows how to throw this Exception and throws it to the method that called.\
    \ When this happens, it is important to know that once an exception is caught,\
    \ the rest of the method will not get executed.\n\nHopefully, the calling method\
    \ will know what to do in the event that this potential problem occurs. If it\
    \ does, it will catch the exception, and whatever needs to be recover from the\
    \ problem. If this method isnt able to provide a solution, the exception will\
    \ continue to the method that called, making its way higher and higher up the\
    \ stack call.\n\nIf the exception makes it all to the top of the stack, the Main\
    \ method, and it is unable to handle the exception, your program will have a fatal\
    \ error. If you're running in release mode, this means your program will crash\
    \ and die. This is called an unhandled exception. Clearly, you want to avoid unwanted\
    \ exceptions whenever possible, but from a practical standpoint inevitably missed.\n\
    \nOn the other hand, if you're running in debug mode, Visual Studio will intercept\
    \ these exceptions at the last minute. This is actually really convenient. Worst\
    \ case scenario, this works a little like an autopsy. You'll be able to dig around\
    \ and see what the actual conditions were when the"
