  md: '# Chapter 6 The C# Type System


    about $3.4 \times 10^{38}$. This is much higher than any of the integral types.
    But even these floating point types are limited in their own way. Because it has
    seven digits of precision, the computer can''t tell 1,000,000,000 and 1,001,000,001
    apart. (Though it can tell 100 and 1001 apart.) Of course, maybe you don''t notice
    that kind of difference, because it''s so small. It may be close enough for all
    practical purposes. Note that the integral values do not have this problem. Within
    the range that they store, integral types are always exact.


    There is also a limit to how small (as in "close to zero") the float type can
    store, and that is about $\pm1.5 \times 10^{-45}$—a tiny number.


    The **double** type uses 8 bytes—as many as the float (hence the name "double").
    This has 15 or 16 digits of precision, and can store values as small as $5 \times
    10^{-324}$ or as large as $1.7 \times 10^{308}$. If you thought the **float**
    type had a huge range, imagine that. This dwarfs the float type can hold, albeit
    at the expense of taking up so much space.


