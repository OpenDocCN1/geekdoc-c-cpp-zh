  md: '# Referencing Other Projects


    # In a Nutshell


    +   - A project can reference other projects that you have made, DLLs, or other
    parts of the .NET Framework. This gives you access to large piles of previously
    created code.

    - To add a reference for one project to another, right-click on the References
    node in the Solution Explorer and choose Add Reference, then click on the Projects
    tab and select the project to add a reference to.

    - To add a component that is on the .NET Framework, right-click and choose Add
    Reference, and click on the Assemblies tab and find the assembly that you are
    interested in.

    - To add a reference to a project that has already been compiled into a DLL, use
    Add Reference, click on the Browse tab, and hit the Browse button to find the
    DLL.


    Many of the projects we''ve done have been small. But with the skills you''ve
    learned in this book, it won''t be long before you''re off making a new program
    to save the world. Or take over. Whichever.


    But you not be able to do that all by yourself. At least, not very quickly. You
    can''t and shouldn''t write code to do anything and everything. There are some
    piles of code out there that have been written by smart people, are well tested,
    and do really great things. You can take advantage of these other libraries and
    DLLs to get a quicker start on your project. You can even reuse code that you
    have made in another project.


    In this chapter, I''ll show you how. We''ll look at three different ways to access
    previously code, including how to reference another project, how to reference
    another assembly on the .NET Framework, and how to access code that others have
    put in a special library called a DLL.


    Adding a reference to pre-existing code will typically follow the following three
