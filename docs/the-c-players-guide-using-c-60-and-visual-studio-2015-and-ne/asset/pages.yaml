  md: "# Chapter 40 C# and the .NET Framework\nWith a Virtual Machine\n\n![](img/13bdcf341e1727795eb17926ba89a16f_302_0.png)\n\
    \nIf you want to add another language to the .NET Framework, all you need to add\
    \ another compiler. If you want to add another operating system or architecture,\
    \ all you need to do is add another CLR, custom for the system you want to run\
    \ on.\n\n# The Common Language Runtime\n\nThe Common Language Runtime (CLR) is\
    \ the virtual machine that is used within the .NET Framework. The CLR is a complicated\
    \ piece of software, and we simply can't cover all here, but we can outline the\
    \ basics.\n\nThe process that the CLR follows is pretty simple. When it is time\
    \ to load an assembly, like an EXE or DLL, it figures out what types it contains\
    \ and methods each one has, and builds a table for it. When it comes time to run\
    \ a method, if it has not been run before, the CLR will load the IL code for that\
    \ method and compile it to binary. This is called *Just-in-Time* compiling, or\
    \ JIT compiling. The next time this method runs, it sees that it was already compiled\
    \ and just re-runs it. JIT compiling only needs to happen for any given method.\n\
    \n# Common Intermediate Language\n\nBecause C# is targeting the CLR, rather than\
    \ compiling to binary, the C# compiler will turn your C# code into a special language\
    \ that is designed for the CLR. This language is *Common Intermediate Language\
    \ (often abbreviated IL or JIL).* IL is very much like the assembly language I\
    \ showed you. However, IL is actually higher level than most assembly languages.\
    \ You can think of IL as an object-oriented version of assembly. IL is aware of\
    \ things like exceptions (Chapter 29), working with data types, and creating and\
    \ initializing objects.\n\nI think it's worth showing what IL code looks like,\
