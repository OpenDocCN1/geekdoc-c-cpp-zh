    doesn''t take the place of client side code like JavaScript, nor does it eliminate
    the need for HTML. An ASP.NET program will generate a custom-made HTML page for
    the user of a website to look.


    # Universal Windows Apps


    Universal Windows Apps (usually shortened to Universal Apps, often called Windows
    Store Apps, and previously called Metro-Style Apps, by another name) is a framework
    that lets you make applications that run on all of the Microsoft platforms with
    only minor deviations for the different devices. These works on Windows desktop
    or laptop (often sold through the Windows Store), as well as Surface tablets,
    Windows Phones, and even the Xbox One.


    Unfortunately, "universal" is probably a bit of a misnomer. When creating universal
    apps, you''ll have to take care of shared code, which you''ll inevitably end up
    with custom code for each of the different target platforms. This is far better
    than developing completely independent codebases for the different platforms,
    but there''s still room for improvement. Microsoft is heading in the right direction
    with this, and the platforms are growing, rather than diverging.


    The universal app platform relies heavily on XAML, one of the technologies of
    WPF, so there''s a lot of overlap when using these different frameworks.


    Making apps requires Windows 8 or newer.


