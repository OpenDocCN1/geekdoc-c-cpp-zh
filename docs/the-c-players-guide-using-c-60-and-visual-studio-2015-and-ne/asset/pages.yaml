    \ classes in Chapter 18.\n\nInside of your Main method, you can create variables\
    \ that have your new DaysOfWeek type, instead of just the built-in types that\
    \ we've been working with. We've defined a brand new type! Creating a variable\
    \ with your new type works just like any other variable:\n\n```\nDaysOfWeek today;\
    \ // Indicate the type, and give it a name.\n```\n\nTo assign a value, you will\
    \ use the '. ' operator (usually \"dot operator\"). We'll discuss the '. ' operator\
    \ more later, but for now what you need to know is that it is used for member\
    \ access. This means that you use the '. ' operator to use something that is a\
    \ part of something else. The values are a part of the enumeration, so we use\
    \ this operator.\n\n```\ntoday = DaysOfWeek.Tuesday;\n```\n\nThis works like any\
    \ other variable, even for things like comparison in an if statement:\n\n```\n\
    DaysOfWeek today = DaysOfWeek.Sunday;\nif(today == DaysOfWeek.Sunday)\n{\n   \
    \ // ...\n}\n```\n\n# Why Enumerations are Useful\n\nThere's a very good reason\
    \ to go back to where we started this chapter—doing days of the week with the\
    \ int type. Remember how we defined dayOfWeek = 3; which meant Tuesday? What if\
    \ someone puts dayOfWeek = 17? As far the computer knows, this should be valid.\
    \ After all, dayOfWeek is just an int variable. Why not allow it to be 17? But\
    \ for what we're doing, 17 doesn't make any sense. We are using 1 through 7.\n\
    \nEnumerations force the computer (and programmers) to use specific values, which\
    \ you have defined. It prevents tons of errors, and makes your code more readable.\
    \ For example, DaysOfWeek.Sunday is immediately clear what it means, while dayOfWeek\
    \ = 1 is not.\n\nIn addition, enumerations allow us to use the IntelliSense Visual\
    \ Studio provides, which is another little bonus.\n\n# Underlying Types\n\nBefore\
    \ moving on, it is worth looking at a couple of additional details about enumerations.\
    \ Under the surface, C# is simply wrapping our enumeration around an underlying\
    \ type. By default, the underlying type is the int type, though it is possible\
    \ to choose a different integer type. Our enumerations are at core just numbers.\
    \ (As I mentioned earlier, it also makes sure that only the right numbers.) When\
    \ you create an enumeration, it starts off giving values, starting with 0, and\
    \ going up by one for each number. In the enumeration that we created, Sunday\
    \ has a value of 0, Monday is 1, and so on."
