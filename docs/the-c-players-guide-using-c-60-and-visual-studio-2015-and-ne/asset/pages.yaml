  md: '# Chapter 24 Using Generics


    Nearly every class in the .NET Framework that contains multiple items implements
    this interface. In that sense, it serves as the base or lowest level of defining
    a collection. Both the List class and Dictionary class that we will see next implement
    `IEnumerable<T>`.


    IEnumerable<T> provides the foundation for all sorts of interesting and important
    features in C#. Chapter 13 when we were talking about arrays and the foreach loop,
    we saw that if something implements IEnumerable<T>, it can be used in a foreach
    loop. And IEnumerable is used as the foundation for LINQ queries, which we''ll
    talk about in Chapter 36.


    All sorts of things implement IEnumerable<T>. If you care about the ability to
    do something with each item in a collection, you can get away with treating it
    simply as an IEnumerable<T>.


    ```

    IEnumerable<int> numbers = new int[] { 1, 2, 3 };

    ```


    You''ll see methods using IEnumerable<T> if they don''t want you to know the actual
    generic type used (it could be an array or a List or something else) and if they
    want you to have the ability to loop through the items (not add or remove items).


    # The Dictionary Class


    To wrap up our introduction using generics, let''s look at another generic class
    that is slightly more complex than the List class: the Dictionary class. This
    class isn''t as versatile as the List class, but you''ll find it useful for it,
    if it is a good choice to look at.


    Let''s start by describing what the Dictionary class actually is. To practically
    no''s surprise, the name of the class is a pretty good description of what this
    is. This class works like a dictionary. In a dictionary, you have a large list
    of words and a definition that belongs to each word. You use one of them (the
    word) to look up another piece of them (the definition).


    The Dictionary class does a very similar thing. We use one piece of information
    (the key) to look up another piece of information (the value). So it is mapping
    of key/value pairs. Because the class is generic, we''re not limited to strings.
    We''ll use strings for people''s names, and ints for phone numbers. (Perhaps ints
    aren''t the best choice, but we''ll write a simple example that uses two types.
    A better choice might be to use a Person or Contact class that stores names and
    other personal information, and a PhoneBook class that deals all of the details
    of phone numbers, like country and area codes. But let''s keep it simple.)


    The Dictionary class is generic, like the List class, but it has two types that
    are generic: the key, which we use to do the lookup, and the value that belongs
    to it. Instead of putting just one type in the angle brackets the Dictionary requires
    that we put two in, for each of the types that are generic:


    ```

    Dictionary<string, int> phoneBook = new Dictionary<string, int>();

    ```


    The Dictionary allows us to use the indexer (''['' and '''']'') to get or set
    values in:


    ```

    phoneBook["Gates, Bill"] = 5550100;

    phoneBook["Zuckerberg, Mark"] = 5551438;

    ```


    We''ve covered every Dictionary we can. Feel free to explore and see what else
    is there.'
