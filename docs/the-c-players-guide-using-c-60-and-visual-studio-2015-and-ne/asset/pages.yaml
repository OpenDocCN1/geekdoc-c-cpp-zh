  md: '# Thread Safety


    We''ve covered the basics of threading, but it is worth looking at another, more
    advanced threading topic. Not all situations need to be worried about this, but
    some do, so it is worth knowing a little about.


    In the examples that we''ve done so far, each thread has been working with its
    own data. But what if there was something that they had to share? Remember that
    threads get swapped out whenever the operating system decides, and a thread may
    actually be in the middle of something important when its context switches.


    To explain the concept of thread safety, I''m going to draw on a real-world example.
    Imagine you''re in your car, driving down a road that has three lanes. You''re
    on the outside lane (the black car), and another car is on the inside lane (the
    white car):


    ![](img/13bdcf341e1727795eb17926ba89a16f_266_0.png)


    You want to change lanes to the middle. The normal process is that you look over
    into that other lane, make sure it is clear, and if you move out. But what if
    the car was doing the same thing, without you knowing it? The other driver looked
    as well, saw that the lane was clear, and moved over. Unless one of you realizes
    the problem, you headed for a crash.


    Like the cars, when you have multiple threads that are using any of the same resources,
    if you''re not careful, two threads can run into each other and cause problems.


    Imagine even the simplest problem of adding one to a variable. To do this, the
    computer will do the following steps:


    +   - Read the current value from the variable.

    - Do the math to figure out the result of adding 1 to the value.

    - Store the new value back in the variable.


    Now imagine that two separate threads are given the task of adding 1 to the variable.
    In a normal "happy" scenario, this variable should get incremented twice.


    But let''s see how things could go with multiple threads. Let''s say our variable
    starts with a value of 1. In theory, both threads should increment the variable,
    and it should end up with a value of 3. But the following could happen as well:


    +   - Thread #1 reads the current value from the variable (1).

    - Thread #1 does the math to figure out the result of adding 1 to the value (2).

    - Thread #2 reads the current value from the variable (which is still set to 1).

    - Thread #2 does the math to figure out the result of adding 1 to the value (getting
    2 also).

    - Thread #1 stores the new value back into the variable (2 gets assigned).

    - Thread #1 stores the new value back into the variable (once again, 2 is assigned
    back).'
  merge: -1
  pgno: 266
- img_proc: true
  md: "# Thread Safety 245\n\nBoth threads did the work they were supposed to do,\
    \ but because the two are running at the same time (or because of a context switch)\
    \ things didn't turn out the way they should, and the variable is left with a\
    \ value of 2, instead of 3 it should be.\n\nThis example is not a toy problem,\
    \ but the reality is any time you have more than one thread modifying some specific\
    \ data, you're likely to run into problems like this.\n\nWe want to be able to\
    \ address this problem and make certain sections of code that we might know problematic\
    \ thread safe, meaning that the code can prevent bad things like this when multiple\
    \ threads want to use it.\n\nIf we have a block of code that modifies that could\
    \ be accessed by other threads, we call that section a critical section. We will\
    \ want to make it that only one thread can get it at a time. This principle of\
    \ allowing only one thread at a time is mutual exclusion and the mechanism that\
    \ is used to enforce this is often called a mutex.\n\nTo enter a critical section,\
    \ we require that the thread is entering the mutual exclusion lock for a specific\
    \ object. When the thread has this lock, it can enter the critical section and\
    \ execute the code. When it does, it releases it up for the next thread. If a\
    \ thread shows up and tries to grab the lock that is already taken, the thread\
    \ will be suspended until the lock is released.\n\nDoing this is pretty simple.\
    \ The first step is to create some sort of object that is accessible to anything\
    \ that needs access to the critical section, which can act as the lock. Often,\
    \ it is best done with a private instance variable in the same object or class\
    \ as the data that is being modified:\n\n```\nprivate object threadLock = new\
    \ object(); // Nothing special needed. Any object will do.\n```\n\nYou could alternatively\
    \ use a static variable instead of an instance variable if you need thread safety\
    \ across all instances of the class.\n\nTo actually make a block of code thread\
    \ safe, you simply add a block surrounding the critical section\n\n```\nlock(threadLock)\n\
    {\n    // Code in here is now thread safe. Only one thread at a time can be in\
    \ here.\n    // Everyone else will have to wait at the \"lock\" statement.\n}\n\
    ```\n\nThat's the basics of threading in C#. There is a lot that goes on in multi-threaded\
    \ applications, and there are entire books dedicated to the subject. We can only\
    \ cover the basics here, but it should give you an idea of the fundamentals."
