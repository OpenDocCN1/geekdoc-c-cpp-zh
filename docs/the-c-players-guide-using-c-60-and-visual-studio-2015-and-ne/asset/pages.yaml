  md: '# 306 Chapter 44 Debugging Your Code


    helpful. Also on this popup is the View Detail... link, which brings up all of
    this same information, and more (that we''ll well talk about in a minute) in a
    dialog.


    When the Exception comes, Visual Studio is giving you a chance to take a detailed
    look at the problem so that you can figure out what went wrong and why. All of
    the tools that are available in debug mode are there to assist you in doing that.
    Timesomet, you''ll be able to edit your code while the program is still running,
    fix the problem, and continue. In other cases, once you reach this point, computer
    won''t be able to continue on and you''ll need to restart to check your fixes.


    # Looking at Local Variables


    When the program is stopped, you''ll have the chance to see what your program
    is currently in. One of the most useful features available is that you can hover
    over any variable and see its current value.


    If the variable is an object, you''ll be able to hover over it, and in the little
    popup, you''ll be able to dig down and see all the details and current state of
    the object, including its private variables. If a particular class is a derived
    class, you''ll also have the ability to dig down to the base class, so everything
    you want to know about an object''s state will be visible.


    Note that this information is also available in the Locals Window. In many cases,
    this window will already be open for you, down towards the bottom, where the Error
    List is. If you don''t see it anywhere in Visual Studio, you can also find it
    by going to Debug > Windows > Locals.


    # The Call Stack


    The call stack is one of the most useful tools that you''ll have to figure out
    what happened. The call stack tells you what method called the current method.
    And yes, this is directly related to the stack that we created in Chapter 16.


    The problem is sometimes caused, not by the method that you are inside of, but
    by the calling method instead you. You can use the Call Stack to see what methods
    have been called to get to you.


    Like the Locals Window, the Call Stack is usually already visible when you''re
    debugging, but if it is not, it can be opened by choosing Debug > Windows > Call
    Stack from the menu. The Call Stack Window looks like this:


    ![](img/13bdcf341e1727795eb17926ba89a16f_328_0.png)


    The method you''re currently in is at the top. (SomethingElse, in this case.)
