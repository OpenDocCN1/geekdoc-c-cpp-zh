    \ what we had before. Using the thread pool is preferable to not using it, but\
    \ it's also not our final solution. Let's keep looking.\n\n# Event-Based Asynchrony\n\
    \nThe idea with the event-based asynchronous approach is to call a method that\
    \ is known to take a long time and it returns immediately. When the method completes\
    \ asynchronously, an event is raised.\n\nUsing Event-based asynchrony like this,\
    \ we have to subscribe to the right event, and in most cases, the asynchronous\
    \ method will end with the Async:\n\n```\nHighScoreManager highScoreManager =\
    \ new HighScoreManager();\nHighScoreManager.HighScores += OnHighScoresLoaded;\n\
    Manager.LookupScoresAsync();\n```\n\nAnd elsewhere we define our event handler:\n\
    \n```\nprivate void OnHighScoresLoaded(Score[] HighScores)\n{\n    // Do something\
    \ with the results.\n    HighScores = HighScores;\n}\n```\n\nIn the past, there\
    \ has been a common approach to long running tasks. As you explore the Base Class\
    \ Library C#, you'll inevitably see methods that end with Async like this, which\
    \ expect you to subscribe to a related event, and put your code for dealing with\
    \ the results in the event handler.\n\nWhile it works, it's a little annoying\
    \ that you've separated your code into two pieces. You have the part that sets\
    \ up and calls the method, and then in a different location, you have the method\
    \ for dealing with the results. You'll see this same problem in the next few iterations\
    \ as well.\n\nA second problem we encounter with this is the event subscription.\
    \ The second time we make this request, it's easy to forget that we may already\
    \ subscribed to the event (with the +=) and we might accidentally subscribe again.\
    \ We can work around that but it creates more things you to remember as a developer.\n\
    \n# The AsyncResult Pattern\n\nMoving along our tour our next option is the AsyncResult\
    \ pattern. This approach is similar to various fast restaurants and other places\
    \ where you make your order or request, and when you're given a ticket for it\
    \ done, you can return the ticket to get your order (results). Or you can take\
    \ your ticket and stand at the counter waiting patiently.\n\nUsing this pattern,\
    \ you typically start with a synchronous method (let's call it X). You then add\
    \ a BeginX and EndX method to it. The Begin method starts the synchronous method\
    \ in an asynchronous way and returns your 'ticket' in the form of an object that\
    \ implements the IAsync interface. You can use this object to periodically check\
    \ if the asynchronous task is completed or not, or you can call the End method,\
    \ passing in the AsyncResult that you got from calling the Begin method, which\
    \ will block, and cause the thread to do nothing until the results come back.\n\
    \nThis sometimes shows up in the form of three distinct named methods (X, BeginX,\
    \ and EndX) the easiest way to implement this is by using some functionality on\
    \ the Delegate class:"
