  md: "# The ‘nameof’ Operator\n\nIt's common to do something with the name of a property,\
    \ method, type, or other bit of code. Among other things, this is useful in debugging\
    \ and when you're doing data binding in a UI framework like WPF or Windows Forms,\
    \ where property names are frequently used.\n\nLet's consider a really simple\
    \ example related to debugging, where we want to print out an object's properties\
    \ and their values.\n\nLet's say we've got a Book class similar to what we created\
    \ in Chapter 18, modified slightly to include the properties we introduced in\
    \ Chapter 19:\n\n```\nusing System;\nusing System.Collections.Generic;\nusing\
    \ System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\n\nnamespace\
    \ CreatingClasses\n{\n    class Book\n    {\n        public string Title { get;\
    \ set; }\n        private string Author { get; set; }\n        private int Pages\
    \ { get; set; }\n        private int WordCount { get; set; }\n\n        public\
    \ Book(string title)\n        {\n            this.Title = title;\n        }\n\
    \    }\n}\n```\n\nLet's say we want to override the ToString method to display\
    \ the values of each of these properties:\n\n```\npublic override string ToString()\n\
    {\n    return $\"Book {Title} Author={Author} Pages={Pages} WordCount={WordCount}$\"\
    ;\n```\n\nThis lets us see the details of a book by writing it to the console\
    \ window or in Visual Studio’s debugger, revealing the values of all of the properties.\
    \ It will appear like this:\n\n[Book Title=There and Back Again Author=Bilbo Baggins\
    \ Pages=118 WordCount=54386]\n\nThat's all fine, but what happens when we decide\
    \ to change the name of something? For example, let's say we rename WordCount\
    \ to Words to mirror the Pages property. It's easy to refactor a property name\
    \ like this (Ctrl + R, Ctrl + R), but in this case, our text remains unchanged.\
    \ We'll still print the same text, which is now misnamed.\n\nThis is where the\
    \ nameof operator comes in. The nameof operator allows you to refer to a variable,\
    \ type or member (like a method or property) and have the compiler change it into\
    \ a string that matches the name.\n\nFor example, consider the following uses\
    \ of the nameof operator:"
