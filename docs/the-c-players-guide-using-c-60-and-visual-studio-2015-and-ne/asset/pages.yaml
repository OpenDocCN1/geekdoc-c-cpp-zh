    A special program that runs source code into executable machine code (Chapters
    1 and 40).


    # CIL


    See Common Intermediate Language.


    # Compound Assignment Operator


    An operator that combines a normal math operation with assignment, as x += 3 (Chapter
    7).


    # Class


    One of several categories of types that exist in the C# language that can be custom.
    A class defines a set of related data that belongs to a single type or category
    of objects in the real world, or representation of a concept along with the methods
    that are used to interact with or modify data. A class is a blueprint for instances
    of the class, defining what it is and what it can do. All classes are reference
    types. See also struct, type, and object (Chapter 17).


    # Conditional Operators


    The && (and operator) and || (or operator), which are used to perform checks for
    multiple conditions (Chapter 10).


    # Constant


    A special type of variable that cannot, set modified. Constants are created when
    the program is compiled, using the const keyword. These are treated as constants
    and cannot be changed by recognizing your program. The readonly variables, constants
    that cannot be modified once assigned, they can be assigned when the program is
    running. For instance, a type may have many instance variables, instances of the
    type to be created with constant values, forcing the variables to be immutable.
    Runtime constants are preferred to compile-time constants, unless it is guaranteed
    that the value will never need to change (Chapter 39).


    # CLR


    See Common Intermediate Language.


    # Code Window


    The main window, usually in the center of the code, which allows you to edit multiple
    code files tagged together. Any hidden window can be opened through the View menu,
    or the View > Other menus (Chapter 41).


    # Command Line Arguments


    When a program is started, arguments may be passed on the command line of the
    program''s main method where it can use them. These are parameter arguments (Chapter
    39).


    # Constructor


    A special type of method that initializes an instance of a type. The role of a
    constructor is to ensure the new instance will be initialized to a valid state.
    A constructor''s definition may include any number of parameters. A constructor
    must have the same name as the type. A type may define multiple constructors.
    When creating a new instance of a type, if no constructor is explicitly specified,
    the C# compiler will automatically generate a default constructor (Chapters 17
    and 18).


    # Comment


    Additional text placed within source code that is designed to be read by humans
    who are working with the code. The C# compiler ignores entries (Chapter. 4).


    # Critical Section


    # Common Intermediate Language


    A special high-level, object-oriented form of assembly code that the CLR is able
    to execute. It includes instructions for things like type conversion, exceptions,
    and method calls (Chapter 40).


    A block of code that should not be accessed by more than one thread at once. Critical
    sections are usually blocked off with a mutex to prevent simultaneous threatened
    access (Chapter 37).


