    \ the rule, prints out whether the result should be positive or negative.\n\n\
    # The Conditional Operator?\n\nNow that we know a bit about logic, I want to bring\
    \ up another operator in C#. Remember when we first talked about operators in\
    \ Chapter 7, we discussed unary and binary operators? Unary operators only work\
    \ on one thing (for example, the negative sign) while binary operators work on\
    \ two things (addition or subtraction). I'm going to introduce a new operator,\
    \ which is a ternary operator. This it operates on three parts. This might seem\
    \ strange to you. It probably ought to. It's not a normal thing to see in math\
    \ or programming (though this specific operator is in many languages).\n\nThis\
    \ operator is called the conditional operator, and it works quite a bit like an\
    \ if-else statement. It uses the ? and : characters like this:\n\n```\n(boolean\
    \ condition) ? value if true : value if false\n```\n\nIn a practical example,\
    \ it might look like this:\n\n```\nConsole.WriteLine(score > 70) ? \"You passed!\"\
    \ : \"You failed.\");\n```\n\nEverything that you do with the conditional operator\
    \ could have been done without it. But it is a nice shorthand to do things that\
    \ can make things very readable. On the other hand, it can also reduce readability,\
    \ so it isn't always a better choice. Just an alternative that you may find helpful."
