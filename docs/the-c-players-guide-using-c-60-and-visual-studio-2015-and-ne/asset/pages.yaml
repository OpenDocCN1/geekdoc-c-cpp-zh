  md: '# More Math


    In a Nutshell


    +   * Division with integer types uses integer division. This means you won''t
    get fractional results, just the integer part of the result.

    * Casting can convert one type to another type. Many types are implicitly cast
    from narrow types to wider types. Wider types can be explicitly cast to narrower
    types using the type you want in parentheses: **float a = (float)3.4445;**

    * Division by zero causes an error (Chapter 29) to be defined in truncation (and
    wrapping) for integer types, and results in infinity for floating point types.

    * **NaN, PositiveInfinity, and NegativeInfinity** are defined for the **float**
    and **double** types (**float.NaN**, **PositiveInfinity**, for example).

    * **MaxValue** and **MinValue** are defined in essentially for all of the numeric
    types, which indicate the minimum and maximum values that a particular type can
    contain.

    * $\pi$ and e are defined in the **Math** class, and can be accessed like this:
    **float area = Math.PI * radius;**

    * Mathematical operations can result in numbers that go beyond the range of the
    type value is being stored. For integer types, this results in truncation (and
    wrapping around) for floating point types, it results in **PositiveInfinity**
    or **NegativeInfinity**.

    * You can use the increment and decrement operators (++ and --) to add or subtract
    from one variable. For example, the following, will contain a value of 4: **int
    a = 3;**


    Here we are, back at more math. There is so much math that computers can do—in
    fact, it is all computers can do. This will be our last chapter that focuses purely
    on math. We''ll soon move on to much cooler things.


    But there are still a few things we need to discuss. The things we''re going to
    talk about in this chapter are not very related to each other. Each section is
    its own thing. This means that you already know and understand one topic, you
