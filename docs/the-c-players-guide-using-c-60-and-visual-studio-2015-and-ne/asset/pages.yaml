  md: "# Revisiting the 'base' Keyword 153\n\nTo change the implementation for the\
    \ derived class, we simply create a new copy of the method, along with our custom-made\
    \ implementation, and add in the **override** keyword.\n\nIf the base class didn't\
    \ use the **virtual** keyword for a method you want to override, you're not going\
    \ to be able to override it. The **virtual** keyword is the base class's way of\
    \ saying \"I give you permission to do something different with this method,\"\
    \ while the **override** keyword is the derived class's way of saying \"You gave\
    \ me permission, I'm going to take it and do things in a different direction\"\
    \n\nYou don't need to override virtual methods, you're just **allowed** to. And\
    \ if a class has more than one virtual method, you can override some and not others.\n\
    \nNaturally, you can make any number of derived classes that do their own way:\n\
    \n```\nclass RBSearchEngine : SearchEngine {\n    public string[] Search(string\
    \ findThis) {\n        return new string[] {\n            \"I found something.\"\
    , // Thanks EDI\n            \"I found this for you.\" // Thanks SIRI\n      \
    \  }\n    }\n}\n```\n\nHere's where it gets interesting. Because our derived classes\
    \ **RBSearchEngine** and **GoogleSearch** are inherited from the **SearchEngine**\
    \ class, we can use them anywhere a **SearchEngine** object is required:\n\n```\n\
    searchEngine1 = new SearchEngine(); // The plain old original.\nsearchEngine2\
    \ = new GoogleSearch();\nsearchEngine3 = new RBSearchEngine();\n```\n\nBut now\
    \ we can use **Search** method, and depending on the actual type, the various\
    \ implementations will be called:\n\n```\nstring[] defaultResults = searchEngine1.Search(\"\
    hello\");\nstring[] googleResults = searchEngine2.Search(\"hello\");\nstring[]\
    \ rbsResults = searchEngine3.Search(\"hello\");\n```\n\nWe'll get different results\
    \ for each of these, because each of these three types defines the method differently.\
    \ The default **SearchEngine** class provides a default implementation of the\
    \ method but the **GoogleSearch** and **RBSearchEngine** \"alter the deal\" and\
    \ override the original implementation, spitting it out for them. The CLR is smart\
    \ enough to know which method to use at the right time.\n\nThis type of setup,\
    \ calling the same method signature in different methods actually being executed,\
    \ is the crux of polymorphism. Polymorphism means \"many forms,\" and in this\
    \ situation, we can see that the same method performs in different behaviors or\
    \ forms.\n\n# Revisiting the 'base' Keyword\n\nLast chapter, when we brought up\
    \ constructors in a derived class, we brought up to access the constructors from\
    \ the base class. We can also use the **base** keyword elsewhere to access non-private\
    \ things from the base class, including its methods and properties."
