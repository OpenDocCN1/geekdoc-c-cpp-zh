  md: '# Debugging Your Code


    +   In a Nutshell

    - Debugging your code allows you to take a detailed look at how your program is
    executing. This gives you an easy way to see how things are going wrong.

    - Describes the difference between running in debug mode and running in release
    mode.

    - Describes how to analyze exceptions that occur while your code is running.

    - Shows how to modify your code while the program is running.

    - Describes how to set breakpoints in your code, which suspend the program when
    reached.

    - Outlines how to step through your code to see how things change.


    Once you get through any compiler errors like we have discussed in the previous
    chapter, you can run your program. Even though we''ve gotten rid of all the compiler
    errors, sometimes things go horribly while your program is running. This could
    be a crash, or just that your program isn''t doing what you thought it would.
    These are runtime errors, and we''ll talk about how to deal with them.


    Visual gives us the ability to debug our program while it is running to see what''s
    going on, so that we can fix it. This feature is called debugging.


    Debugging is incredibly powerful and useful when things are going wrong. Your
    program is unique, so no one else can tell you what''s going wrong specifically,
    but I can show you how to use the debugging tools so that you can find the problems
    yourself.


    # Launching Your Program in Debug Mode


    The first step is to make sure you start your program in debug mode. When the
    program is compiled and ran in debug mode (as opposed to "release" mode) it includes
    a lot of extra information in the EXE file. This extra information allows Visual
    Studio keep track of what is currently being executed. This extra information
    slows down your program and makes the EXE file significantly'
