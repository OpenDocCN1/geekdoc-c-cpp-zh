  md: '# # Variables


    #  In a Nutshell


    +   - You can think of variables as boxes that store information.

    - A variable has a name, a type, and a value that is contained in it.

    - You declare (create) a variable by stating the type and name: **int number;**

    - You can assign values to a variable with the assignment operator (''=''): **number
    = 14;**

    - When you declare a variable, you can initialize it as well: **int number = 14;**

    - You can retrieve the value of a variable simply by using the variable''s name
    in your code: `Console.WriteLine(number);`

    - This chapter also gives guidelines for good variable names.


    In this chapter, we''re going to dig into the heart of one of the most important
    parts of programming in C#. We''re going to discuss variables, which are how we
    keep track of information in our programs. We''ll look at how you can create them,
    place different values in them, and use the value that is currently in a variable.


    # ## What is a Variable?


    A core part of programming language and any program you make is the ability to
    store information while the program is running. For example, you might want to
    be able to store a player''s score, or a person''s name, so that you can refer
    back to it later or modify it.


    You may remember discussing variables in math classes, but these are a little
    different. In math, we talk about variables being an “unknown quantity” that you
    are supposed to solve for. Variables in math are a specific value that you just
    need to figure out.


    In programming, a variable is a place in memory where you can store information.
    It''s like a little box or bucket to put stuff in. At any point in time, you can
    look up


