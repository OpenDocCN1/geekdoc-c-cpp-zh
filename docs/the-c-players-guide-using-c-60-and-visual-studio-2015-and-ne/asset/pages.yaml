  md: '# Chapter 41 Getting the Most from Visual Studio


    I also want to point out that IntelliSense shows the comments that have been provided
    for any type or its members. This includes your own comments, so it is very helpful
    to write XML comments for your code as we discussed in Chapter 15.


    # Basic Refactoring


    Refactoring is the process of changing the way code is organized without changing
    how it functions. The idea with refactoring is to make so that your code is better
    organized and cleaner, making it easier to add features to the future. There are
    books written on the best way to refactor code, but it is worth noting that Visual
    Studio provides a small set of refactoring tools.


    If you really want refactoring power, you should consider a Visual Studio add-on
    ReSharper (http://www.jetbrains.com/reshaper/). It''s not cheap, but provides
    a massive amount of refactoring support among many other useful features.


    Visual Studio has a basic refactoring tools that are worth out, though. For starters,
    if you have something that you want to rename, rather than manually typing the
    new name everywhere, simply select it in the Code Window, right-click, and choose
    **Rename** (F2). Also, if you have a block of code that you want to pull out into
    its own method, you can select the code, right-click, and choose **Quick Actions**,
    then **Extract Method**.


    # Keyboard Shortcuts


    Before finishing up, there are several keyboard shortcuts that are worth pointing
    out.


    +   * **F5**: Compile and run your program in debug mode.

    * **Ctrl + F5**: Compile and run your program in release mode.

    * **Ctrl + Shift + B**: Compile your program without attempting to run it.

    * **Ctrl + Space**: Bring up IntelliSense.

    * **Ctrl + .**: Show Quick Actions.

    * **Ctrl + G**: Go to a specific line number.

    * **Ctrl + J**: Go to the matching curly brace ({ or }).

    * **F12**: Go to the declaration of a variable, method or class.

    * **Shift + F12**: Locates all places where something is referenced, throughout
    the project.

    * **Ctrl + R then Ctrl + R**: Rename an element of code.

    * **Ctrl + R then M**: Extract selected code into its own method.

    * **Ctrl + -**: Move back to the last place you were at.

    * **Ctrl + Shift -**: Move forward to the place you were before moving back.

    * **Ctrl + F**: Find in the current document.

    * **Ctrl + Shift + F**: Find in the entire solution.

    * **Ctrl + H**: Find and replace in the current document.

    * **Ctrl + Shift + H**: Find and replace in the entire solution.'
