    \ program. (In fact, that's essentially software engineering is! Creating and\
    \ calling methods in a way that minimizes the craziness!)\n\n# Returning Stuff\
    \ from a Method\n\nMethods are created to do some specific task. Often that tasks\
    \ involve figuring out, and we want be able to know the results. A method has\
    \ the option of giving back. (How generic of them!) This is called returning anything.\
    \ (Even if it doesn't return anything, like the first we wrote a second ago, people\
    \ still talk about \"returning from a method.\")\n\nSo far, all of the methods\
    \ we've looked at haven't returned anything. If you look back, you'll see that\
    \ we've been putting the void before our method name when we create it. This means\
    \ that the method doesn't return anything. By changing that, we can return anything.\
    \ To do this, instead of the void keyword, we simply place a different type, like\
    \ int, float, or string. It makes it so our method can (and must) return a value\
    \ of that particular type.\n\nInside of a method, we use the return keyword to\
    \ return a specific value. This is followed by the value we want to return. A\
    \ simple example of returning a value is this:\n\n```\nstatic float GetRandomNumber()\n\
    {\n    return 4.385f; // Obviously random.\n} \n```\n\nYou can see that by stating\
    \ the return type (float in this case, meaning we're going to return something\
    \ of the type (float), and inside of the method, we simply use the return keyword,\
    \ along with the actual value we want to return. Obviously, this is not a very\
    \ useful example, but it illustrates the point.\n\nLet's go on a more sophisticated\
    \ example. So far in this book, there have been many times that we've done things\
    \ like ask the user to type a number. The code below creates a method that allows\
    \ the user for a number between 1 and 10, and keeps asking until they finally\
    \ give us something that works. At that point, we'll return the number the user\
    \ gave us."
