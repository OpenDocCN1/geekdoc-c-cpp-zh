    # Message from Julius Caesar


    Encryption is the process of taking data and turning it into a format that is
    no longer readable. This keeps the information protected, so that people who are
    not supposed to read it. Of course, the person who is supposed to be able to decrypt
    it and recover the message.


    When encryption is done, the algorithm used to encrypt usually uses a special
    value called a key to perform the encryption. If a person has the key, they can
    usually decrypt the message as well.


    The Caesar cipher is one of the simplest schemes, and it is something you used
    to send coded messages to friends when you were younger. It is an encryption method
    that supposedly Julius Caesar occasionally when he wrote letters.


    The basic idea is that for every letter in your message, you shift the alphabet
    by a certain number of letters. The amount you shift is the key for the algorithm.
    If you are using a key of 3, A would become D, B would become E, etc. Once you
    get to the end of the alphabet, it wraps around, so Z would be C.


    For example, with a key of 4, the message below is encrypted to look like this:


    ```

    Plain text: EXPERIENCE IS THE TEACHER OF ALL THINGS

    Encrypted: IBTVVIRGI MW MX XLGIV SJ EPP XLMRKW

    ```


    Write a program that will read a message from a file (or from the console window)
    and encrypt it, writing out the encrypted message to another file (or back to
    the console). Don''t overwrite the original file. Ideally, your program will ask
    for the name of a file to read, and a key (number) to use in the encryption.


    Anything besides a letter (punctuation, numbers, etc.) can either be skipped or
    passed along to the output without encrypting it.


    If you want an extra challenge, try this. The Caesar cipher is easy to crack.
    In fact, it is so basic that it provides little real protection in usage. More
    sophisticated algorithms are used now to encrypt data. To prove the point that
    the Caesar cipher can be cracked, we''re going to try a "brute force" approach
    to crack the following code:


    ```

    UX LINX MW WKBD RMNK HOTEMBX

    ```


    With the Caesar cipher, there are only 26 keys. Try each one, one at a time, until
    the decrypted message makes sense. This simple approach is to have a human (you)
    inspect the decrypted message to see if it makes sense. While it is more work,
    it is possible to have the computer figure out if the message has been decrypted
    by using a dictionary file (containing all)'
