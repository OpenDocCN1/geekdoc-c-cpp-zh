  md: '# 204 Chapter 30 Delegates


    OK, on to the good stuff. Multicast delegates.


    Before, when we wanted the delegate to use just a single method, we assigned it
    the method like this:


    ```

    EventHandler logHandlers = LogConsole;

    ```


    So how do we get a second method in there as well?


    The easiest way is with the += operator:


    ```

    EventHandler logHandlers = LogConsole;

    logHandlers += LogFile;

    ```


    Now when we invoke the delegate, both methods in the delegate will be called:


    ```

    logHandlers(new Event("Message"));

    ```


    Since both the LogConsole and LogFile method have been added to the delegate,

    things will happen, and we''ll get the message pumped to the console and to the
    file.


    Taking a particular method out of a delegate is simply a matter of using the -
    operator:


    ```

    logHandlers -= LogFile;

    ```


    It''s useful to keep in mind that what we are doing here with the += and -= operator
    is syntactic sugar,

    built around some static methods that belong to the Delegate class. These methods
    are the

    Combine and Remove methods respectively. The two lines of code are functionally

    eequivalent:


    ```

    logHandlers += LogFile;

    ```


    ```

    logHandlers = (EventHandler)Delegate.Combine(logHandlers, new EventHandler(LogFile));

    ```


    Likewise, the two lines of code are also functionally equivalent for removing
    a specific

    method from a delegate''s chain:


    ```

    logHandlers -= LogFile;

    ```


    ```

    logHandlers = (EventHandler)Delegate.Remove(logHandlers, new EventHandler(LogFile));

    ```


    Generally speaking, the simplified version using += or -= is clearer and simpler,
    so it is preferred.


    # Side Effects of Delegate Chaining


    Adding multiple methods to a delegate creates a chain of objects, linked together
    by

    references. (If you''re familiar with the concept of a linked list, then essentially
    how it''s

    implemented) has a couple of side effects that are worth noting.


    The first thing is the return value of calling a multicast delegate. Earlier,
    we sidestepped that

    question by just using a delegate with a void return type, but it should be stated
    that the return

    value of a multicast delegate is the result of the final method. All of the others
    are completely

    ignored. This makes multicast delegates somewhat useful for non-void return values,
    but in

    practice, multicast delegates are generally only used for signatures with a void
    return type. So there

    little functionality here. (You can technically digging into the invocation list
    of a delegate

    and gather return values, but there is no simple syntactical sugar to do that,
    and it''s rarely done.)'
