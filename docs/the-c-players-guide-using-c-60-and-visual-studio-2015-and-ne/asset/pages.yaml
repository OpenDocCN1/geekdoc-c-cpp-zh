  md: '# Inheritance


    In a Nutshell


    +   - Inheritance is a way to reuse classes by expanding them into more specific
    types of classes. For instance, a Square class can be derived from (or inherit)
    a Polygon class, giving it all of the features that the Polygon has.

    - Any class can be used as a base class, except for sealed classes.

    - To indicate a class is derived from another, use the colon followed by the base
    class.

    - The protected access modifier modifies that anything within the class can use
    it, as well as anything in any derived class.


    Imagine that you are trying to keep track of geometric polygons, like triangles,
    rectangles, squares, pentagons, and so on. You can imagine creating a Polygon
    class that stores the number of sides the polygon has, and maybe also a way to
    keep track of the actual positions of the vertices (corners) of the polygon.


    Your Polygon class could be used to represent any of these polygons, but let''s
    imagine that for a Square, you want to be able to do some things with it. For
    example, you might want to create only one size (since the width and height are
    the same in a square), or you might want to be able to create a method that returns
    the area of the square.


    One approach would be to create a Square class with instance variables to keep
    track of the number of sides and the locations of the vertices, like the Polygon
    class has, plus the extra stuff you want. The problem with this is that you now
    have two different classes, and if you want to make a change in the way you work
    with squares, while that you could create an array of polygons (Polygon[]) you
    wouldn''t be able to put squares in that list, even though they are polygons,
    and should be able to be treated as polygons.


    After all, a square is just a special type of a polygon.'
