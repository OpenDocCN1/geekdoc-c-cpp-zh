  md: '# Chapter 9 More Math


    Here are the basics we are going to discuss in this chapter. We''ll start by talking
    about doing division with integers ("integer division") and an interesting problem
    that comes up when we do that. We''ll then talk about converting one type to another
    (casting or simply casting). Next we''ll talk about dividing by zero, and what
    happens in C# when you attempt this. We''ll tell about a few cool numbers in C#,
    like infinity, NaN, the e, and pi. We''ll take a look at overflow and underflow,
    and finish with a cool and frequently used: incrementing and decrementing.


    It''s probably not worth read all of this if you''re in a rush, but don''t skip
    the section on casting or the section on incrementing and decrementing. You''ll
    regret it if you do it, I promise!


    There''s a lot to learn here. Don''t worry if you don''t catch it all first time.
    You can come back later on, and in fact, having some experience behind you will
    probably make it make that much more sense, tense too.


    # Integer Division


    Let''s start this section off with an experiment to illustrate what''s going on.
    In your head, figure out what 7/2 is. Got it? No Really, don''t skip this. Get
    an answer in your head. Got it for real this time? Your answer was probably 3.5,
    or maybe 3 remainder 1. All are correct.


    Now go into C#, and write the following, and see what ends up in result:


    ```

    int a = 7;

    int b = 2;

    int result = a / b;

    Console.WriteLine(result);

    ```


    The computer thinks it''s 3! 3.5, or 3 remainder 1. What we''re doing isn''t the
    normal division you learned in elementary school, but rather, a thing called integer
    division. In integer division, there''s no such thing as fractional numbers.


    Integer division works by taking only the integer part of the result, leaving
    out any fractional or decimal part. This is true matter how close it is to the
    next number. For example, 99 / 100 is 0, even from a math standpoint, it is 0.99,
    which is really close to 1.


    Integer division is at work when you divide with any of the integral data types,
    but it does not apply with floating point types.


    For comparison purposes, check out the following piece of code:


    ```

    int a = 7;

    int b = 2;

    int c = a / b; // results in 3. Integer division.

    ```


    ```

    float d = 7.0F;

    float e = 2.0F;

    float f = d / e; // results in 3.5. Uses "regular" floating point division.

    ```


    This gets es tricky when you mix different data types like this:


    ```

    int a = 7;

    int b = 2;

    float c = 4;

    float d = 3;

    float result = a / b + c / d;

    ```'
