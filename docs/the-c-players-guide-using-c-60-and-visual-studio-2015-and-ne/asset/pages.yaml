    ```

    using System.Text;

    using System.Threading.Tasks;

    ```


    The few lines of your program start with the keyword using. A keyword is simply
    a reserved word, or a magic word that is built part of the C# programming language.
    It has special meaning to the C# compiler, which it uses to do something. The
    using keyword tells the compiler that there is a whole other pile of code that
    someone made that we want to be able to access. This is actually a bit of a simplification,
    and we''ll sort out the details in Chapter 26.


    When you see a statement like System; you know that there is a whole pile of code
    named System that our code uses. Without this line, the C# compiler won''t know
    where to find it and won''t be able to run your program. You can see that there
    are four directives in your little program that are enabled by default. We can
    see exactly what they are for the future.


    # Namespaces, Classes, and Methods


    Below the using directives, you''ll see a collection of curly braces ('' and ''}'')
    and you''ll see the keywords namespace, class, and in the middle, the Main. Namespaces,
    classes, and methods (which Main is an example of) are ways of grouping related
    code at various levels. Namespaces are the largest grouping, classes are smaller,
    and methods are the smallest. We will discuss each of these in great depth as
    we go through this book, but it is worth a brief introduction we''ll start at
    the smallest and work our way up.


    Methods are a way of consolidating a single task in a reusable block of code.
    In other programming languages, methods are sometimes called functions, procedures,
    or subroutines. We get into a lot of detail about how to make and use methods
    as we go, but the bulk of our discussion about methods will be in Chapter 15,
    with extra details in Chapter 27.


    Right in the middle of the generated code, you''ll see the following:


    ```

    static void Main(string[] args)

    {

    }

    ```


    This is a method, which happens to have on one line that does, Main. But I want
    to point out that this particular setup for a method starts everything on it so
    that C# knows it can be used as the starting point for your program. Since this
    is where our program starts, the compiler will run any code we put in here. For
    the next few chapters, everything we do will be in here.


    You''ll also notice that there are a few braces in our code. Curly braces mark
    the start and end of code blocks. Every starting curly brace ({) has a matching
    curly brace (}) later on. In this particular part, the curly braces mark the start
    and end of Main method. As we discuss classes and namespaces, you''ll see that
    they also use curly braces to mark the points where they begin and end. From looking
    at the code, you can already see that these code blocks contain other code blocks
    to form a sort of hierarchy.


    When one thing is contained in another, it is said to be a member of it. So the
    Program class is a member of the namespace, and the Main method is a member of
    the Program class.'
