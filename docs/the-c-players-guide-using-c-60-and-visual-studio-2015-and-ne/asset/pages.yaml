  md: '# 28 Chapter 40 C# and the .NET Framework


    machine, a program can''t gain access to the memory of other programs. This prevents
    code from doing while a slew of dangerous, virus-like behaviors.


    # Multiple Languages


    The .NET Framework supports a wide variety of different languages, including C#,
    Visual Basic .NET, C++ (Visual C++), F#, Python (IronPython), Ruby (IronRuby),
    and many more. Each of these use their own compiler to generate IL, which is then
    executed by the CLR.


    Interestingly, the side benefit of this is that code written in one language can
    be used by code written in any of the other languages. This also applies to the
    BCL and FCL, the massive class library that C# has for use. Any of these languages
    can take advantage of this, with any other code you use. This also means that
    you can choose the language that is best suited for the task at hand, which is
    a very powerful proposition.


    # The Drawbacks of Virtual Machines


    Virtual machines are great inventions, but they don''t come without a few strings
    attached. In many cases, the advantages outweigh the problems, but it is still
    important to understand these tradeoffs, when it comes to pick a language to use.


    # Performance


    The primary drawback of a virtual machine like the CLR is performance. Code running
    on a virtual machine is generally considered to be slower than code running without


    But this isn''t as bad as it seems.


    For starters, in applications, speed isn''t an issue. Think about a GUI application,
    like a word processor or web browser. Computers are fast enough despite everything
    that these programs do, the vast majority of time, the computer is sitting waiting
    for the user to press the next key, or click the button. The holdup is the user,
    not the computer. If you''re in this kind of a situation, running on a virtual
    machine is not going to hurt anything.


    Additionally, it is entirely possible that code running on a virtual machine is
    quite fast. This may seem kind of strange at first, knowing the overhead that
    the virtual machine needs, but it is possible.


    Without a virtual machine, the compiler makes the final decision about what machine
    instructions are actually being used. That happens on the developer''s machine.


    With a virtual machine, the final compilation step happens within the virtual
    machine. It knows a lot more about the computer it is running on than the program
    begins. It can choose the instructions that make the most sense at the time begins,
    rather than long in advance on a completely different computer. These optimizations
    by the JIT compiler and the CLR can make up enough to mostly offset the cost of
    running on a virtual machine in the first place.


    Finally, when performance is a critical issue, C# has the ability to inter-operate
    with unmanaged code as needed. There''s some overhead to this course, and coding
    this in-depth is beyond what we can cover here, but it can be done. So if you
    have a section of code where performance is a critical issue, you can write that
    code with C++ or something else.


    # Bad for Low-Level Coding


    Since virtual machines need to run on top of an existing physical machine and
    operating system (the "host" operating system) there are some things that just
    don''t work inside of a virtual machine. You'
