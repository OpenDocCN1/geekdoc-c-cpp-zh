  md: "![](img/13bdcf341e1727795eb17926ba89a16f_95_0.png)\n\n# Looping\n\n# In a Nutshell\n\
    \n+   - while loops, do-while loops, and for loops all allow you to repeat repeat\
    \ things in various ways.\n\nwhile(condition) { /* ... */ }\n\ndo { /* ... */\
    \ } while(condition);\n\nfor(initialization; condition; update) { /* ... */ }\n\
    \n+   - You can break out of a loop at any time with the break keyword and advance\
    \ to the next iteration of the loop with the continue keyword.\n- The foreach\
    \ loop is not discussed here, but will be in the next chapter.\n\nIn this chapter\
    \ we'll discuss yet another powerful feature in the C# language: loops. Loops\
    \ allow you to repeat sections multiple times. We will discuss three types of\
    \ loops in this chapter, and cover a fourth type in the next chapter when we discuss\
    \ arrays (it will make a lot more sense there).\n\n# The While Loop\n\nThe first\
    \ kind of loop we're going to talk about is the while loop. A while loop will\
    \ repeat certain code over and over, as long as a condition is true. While loops\
    \ are constructed in a way that looks a lot like an if statement:\n\n```\nwhile(condition\
    \ {\n // this code is repeated until the condition is true...\n}\n```\n\nLet's\
    \ start with a really simple example that counts to ten:\n\n```\nint x = 1;\n\
    while(x <= 10)\n{\n```"
