    \ = lookupDelegate.EndInvoke(asyncResult);\n\nIn that line, we store the LookupScores\
    \ in a delegate type. Remember from the chapter on delegates (Chapter 30) that\
    \ we can usually get away with some variation of Action or Func, and that we've\
    \ done in this case (Func<Score[]>) is a delegate for any method that has no parameters\
    \ and returns an array of Score.\n\nOnce stored in the delegate, we can start\
    \ the process by calling BeginInvoke. The two null values are for a callback method\
    \ that should be called when the asynchronous task is completed, and a parameter\
    \ that can be passed into the callback method.\n\nIf we were trying to make asynchronous\
    \ with any parameters, we'd be able to list them in BeginInvoke before those two\
    \ parameters.\n\nIn the last line of code, we stop and wait for the task to complete\
    \ with EndInvoke. That obviously the purpose of making it asynchronous in the\
