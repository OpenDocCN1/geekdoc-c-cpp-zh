    # Reflection


    C# has the ability to inspect elements of executable code, and explore what types
    are in an

    assembly. We can see the methods, properties, and variables it, even when your
    program

    is running. The ability to code analyze the structure of other code is reflection.


    The biggest use for reflection is when you want to look at an unknown object or
    assembly. Not every

    program has a use for this. Most wont. Doing this is always slower than directly
    accessing the code.


    Having said, there are still times when it is useful. To name a few examples,
    a unit testing

    framework might want to dig through any method that ends with the word

    "Test" or a Test attribute assigned to find all classes in a

    DLL that implements a specific interface. Reflection can also be used to bind
    the rules, calling a

    private method from outside the type it belongs to (a great way to shoot yourself
    in the foot).


    The core class used in reflection is the Type class. The Type class represents
    a compiled type on the

    .NET Framework, including classes, structs, or enumerations.


    For any type, you can use the typeof keyword to get the Type object that represents
    it:'
