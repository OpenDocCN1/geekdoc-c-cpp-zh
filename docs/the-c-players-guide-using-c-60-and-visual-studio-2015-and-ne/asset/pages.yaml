  md: "# Chapter 10 Decision Making\n\nUsually as you're careful when you modify if\
    \ statements, and add the curly braces back\nin when you need multiple lines,\
    \ the shorter syntax with no curly braces is shorter and easier to\nread. But\
    \ if you find yourself making mistakes because you forgot to add curly braces\
    \ in,\nit might be worth having a personal habit of, always adding curly braces\
    \ no what matter.\n\n# Relational Operators: ==, !=, <, >, <=, >=\n\nLet's take\
    \ a look at some better and more powerful ways to specify conditions. So far,\
    \ we've only\nused the == operator to check if things are exactly equal, but there\
    \ are many others.\n\nThe != that you just wrote is one of many relational operators,\
    \ which is a fancy way of saying\n\"operator that compares two things.\" There\
    \ are several others.\n\nFor instance, the != operator checks to see if two things\
    \ are not equal to each other. You use this in\nthe same way that we use ==, but\
    \ it does the opposite:\n\n```\nscore = 100\n{\n  // This code will be executed,\
    \ as long as the score is not 100.\n}\n```\n\nThen there's the > and < operators,\
    \ which determine if something is greater than or less\nelse. These work just\
    \ like they do in math:\n\n```\nscore > 90\n{\n  // This will only be executed\
    \ if the score is more than 90.\n  Console.WriteLine(\"You got an 'A'\");\n}\n\
    ```\n\n```\nscore < 60\n{\n  // This will only be executed if the score is less\
    \ than 60.\n  Console.WriteLine(\"You got an 'F'. Sorry.\");\n}\n```\n\nOf course,\
    \ you may have noticed that the code above isn't exactly what we want to do in\
    \ the\noriginal problem statement. We wanted to give an A if they scored at least\
    \ 90. In the code above, 90\nds't result in an A, because 90 is not greater than\
    \ 90.\n\nWhich brings us to the last two relational operators >= and <=. These\
    \ mean \"greater than\nequal to\" and \"less than equal to\" respectively.\n\n\
    ```\nscore >= 90\n{\n  // This will only be executed if the score is 90 or higher...\n\
    \  // Subtle different than the above example, because it also picks up 90.\n\
    \  Console.WriteLine(\"You got an 'A'\");\n}\n```\n\nIn math, we would use the\
    \ symbols <= and >=, but since those aren't on the keyboard, C# and most\nother\
    \ programming languages use <= and >= instead.\n\nThis gives us we need to write\
    \ the full program we set out to do:\n\n```\nusing System;\nusing System.Collections.Generic;\n\
    ```"
