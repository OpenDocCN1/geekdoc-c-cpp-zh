  md: '# 17 Chapter 26 Namespaces and Using Directives


    OpenGL (a very common 3D graphics library) will have one, every UI framework (like
    Windows Forms and WPF) has one. The list goes on and on.


    You might be thinking, why can''t they all use the same class? Reuse code, and
    all of that good software engineering-mumbo-jumbo.


    That''s a good idea. In theory, each of these libraries needs different things
    from their Point class. Some want it in 2D, others want it in 3D. Some want to
    use floats while others want doubles. And they each want their Point class to
    be able to do different things. They''re fundamentally different types, which
    just happen to have the same name.


    And here''s where namespaces come into play.


    A namespace is a grouping of names.


    Usually, people will put related code in the same namespace, so you can also think
    of a namespace as a module or package for related code. Namespaces are a little
    like last names. They separate one type with a certain name from other types with
    the same name.


    # Fully Qualified Names


    Looking back at Point class, the Windows Forms Point class is in the System.Drawing
    namespace. The WPF version is in the System.Windows namespace. Namespaces allows
    you to distinguish which of the two you have.


    When combined, the namespace name and the class name is called a fully qualified
    name. System.Drawing.Point is a fully qualified name, as is System.Windows.Point.
    There''s no mistaking


    Up until now, we haven''t used fully qualified names. But we could. For example,
    every place that we''ve used the Math class, we could have used the fully qualified
    name System.Math. We could have System.Math.PI and System.Math.Sin(1.2).


    # Using Directives


    You can always use a fully qualified name, but in most cases, that''s just too
    much typing, and it tends to make your code less readable.


    In any particular file, we have the ability to put out a namespace and name, "I''m
    using the stuff in that namespace, if I don''t use a fully qualified name, you''ll
    find it." This is done by putting a using directive, which we''ve been doing since
    the beginning.


    At the top of a file, we can list all of the names of the namespaces that we will
    be frequently using. With a using directive for System (using System); we can
    use anything in the System namespace without needing to use the fully qualified
    name. (This particular using directive, along with a few others, is added to our
    file when we create a new file in Visual Studio.)


    This is the reason that we''ve been able to get away with just saying Math.PI
    all along, instead of System.Math.PI. Our program already had a using System;
    statement at the top of the file.'
