    # How Data is Stored



    A single 1 or 0 is called a bit, and a grouping of eight of them is called a byte.
    If we do the math, means that a single byte can store up to a total of 256 different
    states.


    To get more matters than this, we need to put multiple bytes together. For instance,
    two bytes can store 65,536 possible states. Four bytes can store 4 billion states,
    and eight bytes can easily store over 18 quintillion possible states.


    But we need a way to take all of these and make sense out of them. This is what
    the type system is. It defines how many bytes we need to store different things,
    and how those bytes will be interpreted by the computer, and ultimately the user.


    For example, let''s say we want to store letters. Modern systems use two bytes
    to store letters. Programmers have assigned each letter a specific pattern of
    bits. For instance, we assign the capital letter ''A'' to the bit pattern 0000000001000001.
    ''B'' is one out from 0000000001000010. Because we''re using two bytes, we have
    65,536 different possibilities. That''s enough to store every symbol in every
    language that is currently spoken on Earth, including many ancient languages,
    and still have room for a plethora of random extra characters.'
