    \ to have something outside of the class be get and set the value of the player's\
    \ score.\n\nThe \"classic\" (which we just learned last chapter) is to create\
    \ a method that returns the value of score and another one that sets the value\
    \ of score, possibly with some extra logic to make sure that the score is valid\
    \ (like non-negative). This would be done like this:\n\n```\npublic int GetScore()\n\
    {\n    return score;\n}\n\npublic void SetScore(int score)\n{\n    this.score\
    \ = score;\n    if(this.score < 0)\n    {\n        score = 0;\n    }\n}\n```\n\
    \nThe need for getter and setter methods is extremely common. However, working\
    \ with this is a little cumbersome. You always need to set player.SetScore(10)\
    \ and it is kind of cluttered and less readable.\n\nIt is tempting to make our\
    \ score instance public instead of private. Then you could simply say player.score\
    \ = 10. That would be very convenient, except for one problem: now the instance\
    \ is public, and anyone can mess it up by putting bad data. That is one of the\
    \ things that the Setscore method take care of.\n\nC# has a feature that solves\
    \ all of these issues, creating a clean way to get or set the value of an instance\
    \ without publicly exposing it. This feature is called a property.\n\n# Creating\
    \ Properties\n\nA property is simply an easy way to get and set methods, while\
    \ still maintaining a high level of readability. Instead of the two methods we\
    \ showed in that last example, we could do this instead:"
