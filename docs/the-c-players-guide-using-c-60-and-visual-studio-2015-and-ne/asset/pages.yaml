  md: 'can''t really write an operating system with C#, nor can you make device drivers
    with it. The CLR couldn''t have been written in C# either. These things are just
    too low. If you''re trying to do, you''ll need to pick something that doesn''t
    use a virtual machine. C++ is by the far most popular choice for things like this.
    (Though I''ll be honest with you, after writing in C# for so long, it makes a
    little queer to work with C++. It''s just not nearly as pretty, or fun.)


    On the other hand, if you''re doing anything else—web development, application
    development, etc.—using C# and the CLR is an excellent choice.


    # Your Code is More Visible


    Sometimes, people are concerned that with C# and the .NET Framework, your code
    will be accessible by others. This is clear, to some extent. No one will have
    access to your C# source code, but they will have your EXE file, containing IL
    code. IL is essentially a high-level version of assembly, so this is more information
    than raw bits and bytes of binary instructions, but by no means it is easy to
    sight and figure out what''s going on


    If you''re concerned about this, you can always apply a code obfuscator to your
    IL before making it available to the world. A code obfuscator will guard and rename
    variables, methods, classes and the like, making it even tougher for someone to
    reverse engineer your software.


    On the other hand, (a) most people won''t care, (b) most people won''t even know
    where to begin, and (c) the ones who care and know the-how, won''t be stopped
    by using a strictly compiled language like C or C++.


    If you''re writing code to launch missiles or something else where it is absolutely
    critical that no one discovers how your code works, don''t use C# or any .NET
    language. (Note that in those cases, there''s far more to consider than just using
    a .NET language.)


    # The B and FCL Class Libraries


    In addition to the CLR, the .NET Framework also includes a large collection of
    previously built code and types. This collection is absolutely massive, and contains
    more than the "standard library" of most languages, C++. The standard libraries
    in Java are similar in size. This large collection is called the Base Class Library,
    or BCL.


    The BCL contains all of the built-in types, arrays, exceptions, libraries, basic
    File I/O, collections, reflection, threading, string manipulation, and more. While
    not a perfect guide, a general rule is that any name that starts with System is
    part of the BCL.


    Beyond theBCL, there are many more classes that Microsoft ships with the .NET
    Framework. In general, these thing classes provide broad functional areas, such
    as database access or graphical user interfaces (Windows Forms or WPF). This entire
    collection, including the BCL, is called the Framework Class Library, or FCL.
    In casual discussion, sometimes people use FCL and BCL interchangeably, which
    isn''t strictly correct, but it is perhaps good enough for most things.


    In this book, we looked at some of the most common parts of the BCL, but no book
    can cover all of it. If you are about to do something that you think others have
    done before, it''s a quick web to see if something in the BCL or FCL already does
    it, because there is probably.'
