  md: '# Building Blocks: Projects, Solutions, and Assemblies 13


    If, by chance, you are missing a window that you feel you want, you can always
    open it by finding it on either the Menu view or View > Other Windows. For now,
    if you have the main editor window open with your Program.cs file in and the Solution
    Explorer, you should be good to go.


    # Building Blocks: Projects, Solutions, and Assemblies


    As we started, it is worth defining a few important terms that you''ll be seen
    throughout this book. In the world of C#, you''ll commonly see the words solution,
    project, and assembly, and it is worth taking the time upfront to explain what
    they are, so that you aren''t lost.


    These three words describe the code that you''re building in different ways. We
    will start with a project. A project is simply a collection of source code and
    resource files that will eventually get built into the same executable program.
    A project has additional information telling the compiler how to build it.


    When compiled, a project becomes an assembly. In nearly all cases, a single project
    will become a single assembly. An assembly shows up in the form of an EXE file
    or a DLL file. These two different extensions represent two different types of
    assemblies, and are built from two different types of projects (chosen in the
    project''s settings).


    A process appears as an EXE file. It is a complete program, and has a starting
    point defined, which the computer knows to run when you start it up. A DLL file
    does not have a specific starting point. Instead, it contains code that other
    programs can access on the fly.


    Through this book, we will be primarily creating and working with projects that
    are set up to process assemblies that compile to EXE files, but you can configure
    any project to be built as a library assembly (DLL) installed.


    A solution will combine multiple projects together to accomplish a complete task
    or form a complete program. Solutions will also contain information about how
    the different projects should be connected to each other. While solutions can
    contain many projects, simple projects (including nearly everything we do in this
    book) will need one. Even many large projects get away with only a single project.


    Looking back at what we learned in the last lesson about the Solution Explorer,
    you''ll see that the Solution Explorer is showing our solution as the very top
    item, which is labeling "HelloWorld (1 project)\''. Immediately underneath that,
    we see the one project that our solution contains: "HelloWorld". Inside of the
    project are all of the settings and files that our project has, including the
    Program.cs file that contains source code we will start editing.


    It''s important to keep the solution and project separated in your head. Both
    have the same name and it can be a little confusing. Remember the top node is
    the solution, and the one inside it the project.


    # Modifying Your Project


    We''re ready now to make our program actually do something. In the center of your
    Visual Studio window, you should see the main text editor, containing text that
    should look identical to this:


    ```

    using System;

    using System.Collections.Generic;

    ```'
