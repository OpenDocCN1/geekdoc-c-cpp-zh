  md: '# 262 Chapter 39 Other Features in C#


    One popular solution is to have multiple Boolean values be packed into a single
    byte, or a single int. In one byte, you can store eight Boolean values, one in
    each bit. For each bit, a 1 represents a true value, and a 0 represents a false
    value. Something like this:


    | 0 | 1 | | 0 | 0 | 1 | 1 |

    |---|---|---|---|---|---|---||

    | (Not used) | Account Suspended | Create threads | Delete others'' posts | Edit
    others'' posts | Vote on posts | Edit own posts | Create posts |


    Doing this trick is actually very widespread, especially if you''re talking about
    things like large data sets, operating systems, and syncing across the network.


    Even though we are treating this as a pile of Boolean values, it is worth pointing
    out that you''re working with this byte, C# is going to present it to you as the
    byte, or the int with a specific type. The field bit above will be shown to you
    the number 35. Of course, we don''t care about a complete number, but as a collection
    of Boolean values or Boolean flags, we''ll need some tools to help us work with
    the raw bits in a bit field. Fortunately, C# has these tools built in for us,
    which we will now discuss briefly.


    # Shift Operators


    There are two operators that will take the bits in a byte or other integral type,
    and move them over a certain number of slots. These two operators are called bit
    shift operators. The left shift operator is less than two signs (<<) while the
    right shift operator is greater than signs together (>>). These operators look
    like little arrows that tell you which bits will be shifted.


    To use the bit shift operators, you would do like this:


    ```

    int result = 5 >> 2; // You''d use the contents of a variable, instead of ''S''

    ```


    This takes the number five, when written in binary, looks like 00000101, and shifts
    all of the bits to the right by two. This results in 00000001, or 1. Notice that
    as they shifted, bits drop off one end, which just go away, and 0''s are added
    to fill empty slots on the other end.


    The left shift operators work the same way:


    ```

    int result = 5 << 2; // 00000101 turns into 00100100, or 20.

    ```


    # Bitwise Logical Operators


    Think back to when we first discussed the logical && || operators. Remember that
    && evaluates to true if both sides are true, and || evaluates to true if either
    side is true. There are a couple of related operators that work on bits themselves,
    and do a similar thing. As we look at this, think of 1 as being true, and 0 as
    false.


    The bitwise and operator is a single ampersand (&) and the bitwise or operator
    is a single vertical bar (|). They go down the bits, one at a time, and do an
    and or operation on each bit. This will probably make more sense with an example.
    Imagine the two binary numbers:


    ```

    01010101

    11111111

    ```


    If you use the and or operator, the program will look at the first bit in each
    number. The top number has a 0, while the bottom has a 1. That''s like having
    a false and a true, which if they are combined together and result in false, or
    a 0.'
