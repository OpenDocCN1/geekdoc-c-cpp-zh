    ## 4.4 CREATING OBJECTS


    An object is an instance of a class and it can be created of its class type. The
    syntax for defining an object is given below:


    ```

    <class_name>      <object_name>;

    ```


    where `<class_name>` is the name of the class and `<object_name>` is the name
    of the object being defined.


    For example, we can create an object `studObj` of class `student` by the following
    declaration:


    ```cpp

    student      studObj;

    ```


    The above declaration says that `studObj` is an object of class `student`.


    In some situations, especially while sorting of objects, it is required that one
