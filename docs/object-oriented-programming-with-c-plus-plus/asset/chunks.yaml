    由于构造函数是对象构造之前第一个被调用的函数，程序员可以像接下来的节所讨论的那样，将构造函数用于各种目的。


    ## 6.2 构造函数的类型


    在 C++ 中，有四种类型的构造函数：


    1. 默认构造函数。

    2. 用户定义的构造函数。

    3. 参数化构造函数。

    4. 拷贝构造函数。


    ### 6.2.1 默认构造函数和用户定义的构造函数


    考虑图 6.1。还可以进一步注意到，编译器已经在类定义中自动包含了以下语句：


    ```cpp

    myClass() { }

    ```


    这被称为`默认构造函数`。它可以被精确地定义为`由编译器定义并调用的构造函数。它不进行任何处理，但为对象预留内存。它不接受任何参数。`


    因此，一个体为空的默认构造函数并没有做任何有意义的事情，但它是合法的。在创建对象时，它会被执行并为对象分配内存。


    然而，在类似下面的情况下，程序员也可以显式地定义一个`用户定义的构造函数`以达到自己的目的。


    许多编程场景要求在程序中使用对象之前对其数据成员进行初始化。例如，在栈（stack）对象中，栈顶（top）必须初始化为 –1，以表示栈最初是空的。让我们在下面的名为
    `stack` 的类中将栈顶初始化为 –1，看看会发生什么。


    ![page178-1.png](img/page178-1.png)


    当类被编译时，编译器会对以下语句给出错误，因为我们非常清楚，该类是一个编译时实体，不会获得内存，因此无法在类内部初始化任何变量。


    ```cpp

    int top = -1;

    ```


    事实上，在几乎每个有用的程序中，某些数据元素在使用之前都需要进行初始化。在这些情况下，我们可以通过将初始化语句放在构造函数体内部来使用默认构造函数，如下：


    ```cpp

    stack () {int top = -1;}

    ```


    现在，上述安排是有效的，并且在创建对象时，它的工作原理如下：


    1. 将调用构造函数 `stack()`。

    2. 构造函数将为类的各种元素提供内存，即名为 `stak[]` 的数组和 `top`。

    3. 在为变量 `top` 提供空间时，它将所需的值 –1 加载到其中。


    修改后的类 `stack` 如下：


    ![page179-1.png](img/page179-1.png)


    **示例 1**。*编写一个程序，使用名为 `stack` 的类演示构造函数的工作，模拟其对整数值的操作：推送（push）和弹出（pop）。修改 push
    和 pop 函数，以便在调用函数 `main()` 中显示以下消息。*


    “栈满”，“栈空”


    *解法*：我们将修改 `push()` 和 `pop()` 函数，根据它们旁边的注释返回以下值，相应的消息将在函数 `main()` 中显示。


    ![page180-1.png](img/page180-1.png)


    完整的菜单驱动程序如下：


    ![page180-2.png](img/page180-2.png)


    可以注意到，栈类在栈的大小上是不灵活的，也就是说，它总是会创建一个包含 20 个位置的栈。这个问题可以通过参数化构造函数来解决。


    ### 6.2.2 参数化构造函数


    我们还可以在构造函数定义中包含参数。*带有参数的构造函数称为参数化构造函数*。这在程序员想在创建对象时提供显式初始值的情况下是有帮助的。


    考虑在上节中定义的 `stack` 类。如上所述，它总是会创建一个包含 20 个位置的栈。如果用户希望创建一个特定大小的栈，他可以在创建对象时通过将大小（例如
    `Sz`）作为参数传递过去来实现。参数化栈构造函数如下所示：


    ![page182-1.png](img/page182-1.png)


    修改后的类如下：


    ![page182-2.png](img/page182-2.png)


    程序员现在可以通过以下语句创建栈对象：


    ```cpp

    stack sOb ( Sz);

    ```


    其中 `Sz` 是用户指定的栈的大小。


    **示例 2**。*设计一个名为 `Queue` 的类，模拟 N 个位置的队列数据结构，其中 N 是用户定义的。该类必须通过构造函数将 `Front` 和
    `Rear` 位置指示器初始化为适当的值。元素分别从 `Rear` 和 `Front` 指向的位置添加和移除。*


    *解法*：我们将使用参数化构造函数，为拟议的 `Queue` 类接受用户指定的位置数量（例如 `N`），并把 `Front` 和 `Rear` 初始化为位置
    0，以标记队列为空。


    所需的类如下所示：


    ![page183-1.png](img/page183-1.png)


    **示例 3**。*编写一个程序测试给定队列大小的 `Queue` 类。*


    *解法*：所需的程序如下：


    ![page184-1.png](img/page184-1.png)


    在上述程序中可以注意到，在创建对象时通过以下语句为构造函数提供了参数：


    ```cpp

    Queue qOb (Sz);

    ```


    构造函数的传递格式为 `<类名> <对象名> (参数列表);`


    这种传递给构造函数的方法被称为`隐式调用`。然而，还有另一种提供构造函数参数的方法如下所示：


    ```cpp

    Queue qOb = Queue (Sz);

    ```


    这种方法被称为`显式调用`。由于隐式调用提供参数的方法更短，大多数程序员经常使用这种方法。


    ### 6.2.3 拷贝构造函数


    对象可以通过赋值语句拷贝到另一个对象。考虑下面的名为 `test` 的简单类：


    ![page185-1.png](img/page185-1.png)


    请注意 `test` 类有两个构造函数：默认构造函数和参数化构造函数，即构造函数被重载了。让我们这样构造 `test` 类的两个对象 `Ob1` 和 `Ob2`：`Ob1`
    由默认构造函数构造，`Ob2` 由参数化构造函数构造并初始化为 50。下面的 `main()` 函数执行此任务并打印两个对象的 `val` 内容。随后，它通过赋值语句将
    `Ob2` 的内容拷贝到 `Ob1`。


    ```cpp

    // (main 函数未提供但被引用)

    ```


    ![page186-1.png](img/page186-1.png)


    正如预期的，未初始对象 `Ob1` 的 `val` 内容是随机垃圾值，而对象 `Ob2` 的 `val` 已被正确初始化为 50。值得注意的一点是，将 `Ob2`
    赋值给 `Ob1` 之后，两个对象的 `val` 内容相同。


    事实上，以下语句逐位将对象 `Ob2` 拷贝到 `Ob1`。


    ```cpp

    Ob1 = Ob2;

    ```


    上述将同类类对象拷贝到另一个对象的方法是完全可以。然而，这种方法在某些情况下会失败。例如，考虑一个对象（例如 `Obptr2`）有一个指针（`p`），指向包含某些信息（例如“我的数据”）的位置。当通过赋值运算符将此对象拷贝到另一个对象（例如
    `Obptr1`）时，两个对象的指针将指向同一个位置，如图 6.2 所示。原因是赋值运算符逐位将一个对象的内容拷贝到另一个对象，因此两个指针都获得了相同的地址。


    ![Figure 6.2](img/ch06fig02.png)


