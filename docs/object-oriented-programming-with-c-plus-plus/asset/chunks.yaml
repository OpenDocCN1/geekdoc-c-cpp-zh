    \ a Super Bazaar billing window scenario wherein the customers get the bill for\
    \ the items purchased by them and making the payment in cash.\n\n8.  Draw the\
    \ use case diagram of an examination room scenario?\n\n9.  Give the equivalent\
    \ sequence diagram of the use case developed for examination room scenario.\n\n\
    10.  Draw the use case for an ATM machine wherein a customer withdraws cash by\
    \ presenting the ATM card to the machine.\n\n11.  Give the state chart diagram\
    \ for the use case diagram developed for ATM machine.\n\n12.  Differentiate between\
