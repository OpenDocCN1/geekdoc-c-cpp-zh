    ![Figure 4.5](Images/ch04fig05.png)


    **Figure 4.5** *Pictorial representation of a class*


    The class that models a pitcher is given in [Fig. 4.6](#chapter_04.xhtml_ch4fig6).


    ![Figure 4.6](Images/ch04fig06.png)


    **Figure 4.6** *Pitcher class*


    In fact in OOP, we develop a program using the concept similar to building a system
    from its basic components. For a given problem, the following steps are followed:


    1.  Identify the objects that comprise the problem.


    2.  Categorize the objects into classes.


    3.  Establish the relationship between the classes.


    4.  Create instances of objects as per the requirement.


    5.  Manage the objects to solve the problem.


    ##### 4.3 DECLARATION OF CLASSES IN C++


    From the above discussion it is evident that the classes are central to OOP and
    a class can be used to create objects of its type. In C++, a class can be defined
    by the keyword “class”. The format of class declaration is given below:


    ![pg110-1.png](Images/pg110-1.png)


    where *class* is a keyword; *<name>* is the user defined name of the class. It
    is a C++ identifier. *Private* is a keyword; *public* is a keyword.


    It may be observed that a class declaration is similar to a structure declaration.
    Therefore, everything related to structure applies to classes. However, there
    is a difference in the sense that a structure is open and accessible to all whereas
    the access to members of the class is rather restricted. The class has clearly
    two sections: *private* and *public*. There is also a third special section available
    in a class. This section called *protected* and is discussed later in this book.


    *Private members*: the members declared in private section are not accessible
    outside the class. Therefore, the most important members that need to be secured
    are placed in private section. The states (i.e. variables) are always made private.
    The reason being that the *internal state of an object should only be changed
    by an internal behaviour or function and not by outside stimuli*. For example,
    the temperature of human body remains constant irrespective of climatic conditions
    being summer or winter. However, an infection in the body may give rise to high
    body temperature. This feature of hiding states and data structures is called
    *data or information hiding*.


    Similarly, the behaviours (i.e. the functions) which implement the business logic
    are also hidden from outside by making them private members. The *set* functions
    which can modify a state of the object are also made private. This feature of
    hiding implementation or set functions is also called as *implementation hiding*.


    *Public members*: the functions that need to interact with outside world are made
    public. These functions interact with the outside world for the following purposes:


    1.  *Taking input from users or other objects*. For example, the function that
    reads data from a user (say read_data()) needs to be made public.


    2.  *Providing information about states of the object to users*. These functions
    are also called as *get* functions. For example, the function that informs about
    the grade of a student (say get_grade()) has to made public.


    3.  *Providing services offered by the object to users or other objects*. For
    instance the push() and pop() functions of a stack object are made public.


    It may be noted that the public functions act as interface to the outside world.
    In other words we can say that the important data, information, and implementation
    are hidden in private section behind a public interface as shown in [Fig. 4.7](#chapter_04.xhtml_ch4fig7).


    ![Figure 4.7](Images/ch04fig07.png)


    **Figure. 4.7** *Data and implementation hiding behind public interface*


    #### 4.3.1 Abstraction and Encapsulation


    From [Figure 4.7](#chapter_04.xhtml_ch04fig07), the following points are observed:


    1.  Only public interface is visible.


    2.  The data, information, and implementation are hidden.


    The visible part which provides only the bare minimum details about the object
    is called *abstraction*. The data, information and implementation are hidden.
    In other words, we can say that data, information and implementation have been
    placed in a capsule and the activity is called as *encapsulation*. An example
    of abstraction and encapsulation is given in [Fig. 4.8](#chapter_04.xhtml_ch4fig8).


    ![Figure 4.8](Images/ch04fig08.png)


    **Figure 4.8** *Abstraction and encapsulation*


    In a human head, there are many components like arteries, veins, muscles, eyes,
    ears, nose, mouth, cheek bones, retina, iris, brain, etc. But most of these have
    been encapsulated. Only the necessary components that are needed to interact with
    others have been abstracted as interface (see [Fig. 4.8](#chapter_04.xhtml_ch4fig8)).


    By default, a class contains private members, i.e. all states and behaviours are
    private and not accessible to outsiders. Thus, the class encapsulates the data,
    information, and the implementation. When a user, by design, declares some members
    as public then those members become the interface or abstraction. Thus, the unnecessary
    details are ignored. The terms abstraction and encapsulation can be precisely
    defined as:


    *Abstraction*: the activity of separating essential members of a class in the
    form of public interface is known as abstraction. It provides a simple view of
    the object so that the user can easily use the object.


    *Encapsulation*: the activity of hiding data and implementation within a class
    as a unit is called as encapsulation. It creates a separation between the interface
    and the implementation thereby reducing the dependency between the components
    of the system.


    In fact the abstraction has to be good so that the object can be used with ease
    without going into the details of the implementation. In fact it separates the
    behaviour of the object from its implementation. For example, in a camera there
    are 2–3 buttons and an eye-piece to interact with. Similarly, a house encapsulates
    many things but offers doors and windows as abstraction.


