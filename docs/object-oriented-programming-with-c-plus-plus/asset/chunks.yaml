  trans: "\n\n现在最重要的问题是，析构函数对程序员来说有什么用？由于析构函数是最后一个执行的函数，程序员无法利用该函数产生任何有成效的用途。然而，如果我们非要找到它的用途，那么它最好的用途就是用于调试。事实上，可以在析构函数中包含一些适当的消息，以通知相关对象正在被销毁。如果对象没有显示该消息，程序员可能推断出该对象正运行异常，且程序控制在对象内部的某处阻塞了。\n\
    \n### 示例 6. 写一个名为 `testDest` 的类，用来说析构函数的工作。当对象被销毁时，它会显示以下消息。\n\n“我正在被销毁”\n\n编写一个尽可能小的\
    \ `main()` 函数来测试析构函数的工作。\n\n*解决方案*：下面给出了带有析构函数的类以及最小的 `main()` 函数：\n\n![page194-2.png](img/page194-2.png)\n\
    \n上述程序的输出下所示：\n\n![page195-1.png](img/page195-1.png)\n\n需要注意的是，构造函数和析构函数会在对象创建或销毁时由系统自动调用。\n\
    \n### 6.4 总结\n\n构造函数是一个创建对象的函数。它是一个特殊的函数，不返回任何值，甚至不返回 `void`。它帮助程序员在对象创建时自动初始化对象的某些数据成员。构造函数的名称与类名相同。拷贝构造函数通过另一个同类型对象的值来初始化一个对象。析构函数销毁对象。它释放对象所持有的内存。它是最后一个被调用的成员函数。它的名称与类名相同，但前面加有一个波浪号\
    \ (`~`)。析构函数可以用于调试目的。\n\n### 单选题\n\n1. 构造函数返回：\n    1. 一个整数\n    2. 一个浮点数\n  \
    \  3. 无值\n    4. void \n2. 构造函数在对象何时自动初始化其数据成员：\n    1. 声明\n    2. 创建\n    3.\
    \ 销毁\n    4. 编译\n3. 构造函数的名称是：\n    1. 与类名相同\n    2. 与程序名相同\n    3. 用户定义的名称\n \
    \   4. 以上都不是\n4. 构造函数是该类的友元吗？\n    1. 是\n    2. 否\n5. 如果对象按值传递给拷贝构造函数会发生什么？\n\
    \    1. 对象的大小增大\n    2. 对象的大小减小\n    3. 系统可能内存不足\n    4. 编译器内存耗尽\n6. 无参数的构造函数被称为：\n\
    \    1. 拷贝构造函数\n    2. 默认构造函数\n    3. 参数构造函数\n    4. 以上都不是\n7. 当对象由指针变量组成时，它必须通过拷贝：\n\
    \    1. 赋值运算符\n    2. 用户定义的函数\n    3. 拷贝构造函数\n8. 构造函数的常用缩写是：\n    1. conc\n  \
    \  2. tor\n    3. cons\n    4. cctor\n9. 析构函数的常用缩写是：\n    1. dtor\n    2. tor\n\
    \    3. dest\n    4. ~des\n10. 如果类没有定义构造函数会发生什么？\n    1. 对象不被创建\n    2. 程序终止\n\
    \    3. 对象被创建\n    4. 以上都不是\n\n### 答案\n\n1. c\n2. b\n3. a\n4. b\n5. c\n6. b\n\
    7. c\n8. d\n9. a\n10. c\n\n### 练习题\n\n1. 什么是构造函数？解释它的用途。\n2. 定义术语：默认构造函数和参数构造函数。\n\
    3. 修改 第 4 章 中的 示例 1，使得该类包含一个构造函数。\n4. 为 第 4 章 中的 示例 4 设计一个带有默认值的构造函数。\n5. 为 第\
    \ 4 章 中的 示例 9 设计一个合适的构造函数。\n6. 详细解释拷贝构造函数。\n7. 定义术语析构函数。\n8. 描述析构函数的重要性。\n9. 写一个说明析构函数工作的程序。\n\
    10. 给给定的 C++ 代码，回答问题 (a) 和 (b)。\n    ![page196-1.png](img/page196-1.png)\n   \
    \ 1. 在面向对象编程中，`Function1` 被称为什么？它何时被触发/调用？\n    2. 在面向对象编程中，`Function2` 被称为什么？它何时参与/调用？\n\
    11. 写一个 C++ 程序，创建一个名为 ‘time’ 的类，数据成员为：`hour`、`minutes`。\n\n"
- fmt: "\nwhere `template` is a keyword; “<” is the standard left angled bracket or\
    \ sign for less than operator; `class` is a keyword; `ugType`, user defined generic\
    \ type; “>” is the standard right angled bracket or sign for greater than operator.\n\
    \nThe user-defined type (`ugType`) becomes the generic type. Let us now rewrite\
    \ the function `exchange()` of [Section 8.1](#chapter_08.xhtml_ch1) as a generic\
    \ function.\n\n![image](Images/pg236-2.png)\n\nIt may be noted that we have used\
    \ a generic type called `myType` to declare the variables in the generic function\
    \ `exchange`. This generic type (`myType`) would get substituted at run time by\
    \ whichever type of data is sent by the programmer. Thus, templates use run time\
    \ polymorphism to bind the data with their types.\n\n### Example 1\nWrite a program\
    \ that uses the generic function `exchange()` and tests it for variety of types\
    \ of data.\n\n*Solution*: The required program is given below:\n\n![image](Images/pg237-1.png)\n\
    \nThe output of the program is given below:\n\n![image](Images/pg237-2.png)\n\n\
    It may be noted that the generic function `exchange()` has been able to work with\
    \ various types of data.\n\n### Example 2\nWrite a function template called `search()`\
    \ that searches an element (generic type) from a given list of *N* elements. It\
    \ returns 1 when the element is found 0 otherwise. Also write a generic function\
    \ called `readList()` that reads a list of *N* elements.\n\n*Solution*: We will\
    \ use an array of *N* locations of generic type. However, the size of array *N*\
    \ and the index *i* will be declared as integers because these variables are type\
    \ dependent.\n\nThe required functions are given below:\n\n![image](Images/pg238-1.png)\n\
    \n### Example 3\nWrite a menu driven function `main()` that tests the working\
    \ of the generic functions developed in [Example 2](#chapter_08.xhtml_ch8ex2)\
    \ for integer and float values.\n\n*Solution*: The required function `main()`\
    \ is given below:\n\n![image](Images/pg238-2.png)\n\nA sample output is given\
    \ below:\n\n![image](Images/pg239-1.png)\n![image](Images/pg239-2.png)\n![image](Images/pg240-1.png)\n\
    \n## 8.3 GENERIC CLASSES\n\nSimilar to functions, we can also create generic classes\
    \ in the form of class templates. The format of a *class template* is given below:\n\
    \n![image](Images/pg240-2.png)\n\nwhere `template` is a keyword; “<” is the standard\
    \ left angled bracket or sign for less than operator; `class` is a keyword; `ugType`,\
    \ user defined generic type; “>” is the standard right angled bracket or sign\
    \ for greater than operator.\n\n![Note](Images/note.png) **Note** : The template\
    \ declaration followed by class declaration is jointly called as a *class template*.\n\
    \n### Example 4\nWrite a class template called `stack` that offers the following\
    \ services for generic type of data.\n\n1. Push an element on a stack.\n2. Pop\
    \ an element from a stack.\n\n*Solution*: The required class is given below:\n\
    \n![image](Images/pg240-3.png)\n\nIt may be noted that when a member function\
    \ of a generic class is declared outside the class then it has to be separately\
    \ defined as a template. The format of defining a member function is given below:\n\
    \n![image](Images/pg241-1.png)\n\n![Note](Images/note.png) **Note** : `<ugType>`\
    \ has to be written within a pair of angled brackets (< and >).\n\nFor example,\
    \ the `push()` function of generic class called `stack` has been declared as given\
    \ below:\n\n![image](Images/pg241-2.png)\n\n![Note](Images/note.png) **Note**\
    \ : An object of generic type class can be created by qualifying (or type casting)\
    \ the statement by the type for which the object is desired. The format of object\
    \ creation for a generic class is given below:\n\n![image](Images/pg242-1.png)\n\
    \nwhere `class name` is the name of the class; “<” is the standard left angled\
    \ bracket or sign for less than operator; `typeOb` is the type of data for which\
    \ the object is required; “>” is the standard right angled bracket or sign for\
    \ greater than operator; `object name`, name of the object to be created.\n\n\
    For example, an object named `chOb` of type `stack` that works on char type of\
    \ data can be created by the following statement:\n\n![image](Images/pg242-2.png)\n\
    \nKindly note that angled brackets are necessary for type casting the required\
    \ object. The name of the class juxt aposed with the type in angled brackets (i.e.\
    \ `stack <char>`) is called a *template class*.\n\n### Example 5\nWrite the function\
    \ `main` to test both the stacks for values 70 and 23.54 to be pushed and popped\
    \ from the integer and float stacks, respectively.\n\n*Solution*: The required\
    \ function `main()` is given below:\n\n![image](Images/pg242-3.png)\n\nThe output\
    \ of the above program is given below:\n\n![image](Images/pg243-1.png)\n\nIt may\
    \ be noted that same class has been used to instantiate two different objects\
    \ capable of working on integer and float type data, respectively. Therefore,\
    \ a generic class is also known as a **parameterized class**.\n\nThere is only\
    \ one piece of generic code which is shared with different objects.\n\n## 8.4\
    \ TEMPLATES WITH MORE THAN GENERIC PARAMETER\n\nA template can have more than\
    \ one parameter as shown by the following declaration:\n\n`template <class Type1,\
    \ class Type2>`\n\nIt may be noted that it is using two types: `T` and `U`. Consider\
    \ the following function template:\n\n```cpp\ntemplate <class T, class U>\nT max(T\
    \ a, U b) {\n    return (a > b) ? a : b;\n}\n```\n\n### Example 6\nWrite a complete\
    \ program that uses the generic function `test()`, developed above and tests it\
    \ for various combinations of types.\n\n*Solution*: The complete program is given\
    \ below:\n\n![image](Images/pg244-1.png)\n\nThe output of this program is given\
    \ below:\n\n![image](Images/pg244-2.png)\n\nIt may be noted that the generic function\
    \ is able to work with various types of data.\n\n## 8.5 SUMMARY\n\nA generic function\
    \ and class can accept parameters of different types. It allows code sharing with\
    \ a view to reduce effort, increase productivity and reduce the size of the program.\
    \ The code of a program can be comfortably divided into two parts: type dependent\
    \ and type independent. The ‘generic type’ gets substituted at runtime by the\
    \ type of data supplied to the generic function or class. A template declaration\
    \ followed by class declaration is jointly called as a **class template**. The\
    \ name of class juxt aposed with the type in angled brackets is called a **template\
    \ class**.\n\n![Question](Images/question.png) MULTIPLE CHOICE QUESTIONS\n\n1.\
    \ A generic function increases:\n   a. productivity\n   b. program length\n  \
    \ c. typing effort\n\n2. A template in C++ is used to create _______ functions\n\
    \   a. virtual\n   b. generic\n   c. recursive\n   d. friend\n\n3. The templates\
    \ use_____ polymorphism to bind the data with their types\n   a. compile time\n\
    \   b. runtime\n\n4. A generic class is called as:\n   a. base class\n   b. derived\
    \ class\n   c. parameterized class\n   d. friend class\n\n5. Templates help us\
    \ in sharing the code among structurally ______ family of objects or functions\n\
    \   a. dissimilar\n   b. superior\n   c. conflicting\n   d. similar\n\n## ANSWERS\n\
    \n1. a\n2. b\n3. b\n4. c\n5. d\n\n![Exercise](Images/exe.png) EXERCISES\n\n1.\
    \ What is a generic function?\n2. How ‘code sharing’ is implemented in C++?\n"
