  raw: "Now the most important question is as to of what use is the destructor function\
    \ to a programmer? Since the destructor function is the last function to be executed,\
    \ no fruitful use of this function can be made by the programmer. *However, if\
    \ we have to find its use then it can be best used for debugging purpose.* In\
    \ fact, some appropriate message can be included in the destructor function to\
    \ inform that the object in question is being destroyed. If the message is not\
    \ displayed by an object then the programmer may infer that the object in question\
    \ is misbehaving and the program control is struck somewhere within the object\
    \ itself.\n\n##### **Example 6**. *Write a class called testDest that illustrates\
    \ the working of a destructor. It displays the following message as soon as its\
    \ object is destroyed.*\n\n“I am being destroyed”\n\n*Write a smallest possible\
    \ main() function for testing the working of the destructor.*\n\n*Solution*: The\
    \ required class with destructor and the minimal main() function is given below:\n\
    \n![page194-2.png](Images/page194-2.png)\n\nThe output of above program is given\
    \ below:\n\n![page195-1.png](Images/page195-1.png)\n\nIt may be noted that the\
    \ constructor and the destructor are called automatically by the system as and\
    \ when the object is created or destroyed – as the case may be.\n\n##### 6.4 SUMMARY\n\
    \nConstructor is a function that creates an object. It is a special function that\
    \ returns no value not even the void. It helps the programmer to automatically\
    \ initialize certain data members of an object at the time of its creation. The\
    \ name of the constructor is same as the class. A copy constructor initializes\
    \ one object with values from another object of the same class type. The destructor\
    \ function destroys the object. It removes the memory held by an object. It is\
    \ the last member function to be called. It also carries the same name of the\
    \ class with a tilde (~) as prefix. The destructor function can be used for debugging\
    \ purposes.\n\n##### ![Question](Images/question.png)MULTIPLE CHOICE QUESTIONS\n\
    \n1.  A constructor function returns:\n\n    1.  an integer\n\n    2.  a float\n\
    \n    3.  no value\n\n    4.  void\n\n2.  A constructor function automatically\
    \ initializes the data members of an object at the time of its:\n\n    1.  declaration\n\
    \n    2.  creation\n\n    3.  destruction\n\n    4.  compilation\n\n3.  The name\
    \ of the constructor function is:\n\n    1.  same as class name\n\n    2.  same\
    \ as program name\n\n    3.  user defined name\n\n    4.  none of these\n\n4.\
    \  Is constructor function a friend of the class?\n\n    1.  yes\n\n    2.  no\n\
    \n5.  What happens if an object is passed by value to a copy constructor?\n\n\
    \    1.  the size of the object increases\n\n    2.  the size of the object decreases\n\
    \n    3.  system may run out of memory\n\n    4.  compiler runs out of memory\n\
    \n6.  A constructor with no arguments is called:\n\n    1.  copy constructor\n\
    \n    2.  default constructor\n\n    3.  parameterized constructor\n\n    4. \
    \ none of these\n\n7.  When an object consists of pointer variables, it must be\
    \ copied through:\n\n    1.  assignment operator\n\n    2.  a user defined function\n\
    \n    3.  copy constructor\n\n8.  What is the popular abbreviation for constructor?\n\
    \n    1.  conc\n\n    2.  tor\n\n    3.  cons\n\n    4.  ctor\n\n9.  What is the\
    \ popular abbreviation for destructor?\n\n    1.  dtor\n\n    2.  tor\n\n    3.\
    \  dest\n\n    4.  ~des\n\n10.  What happens if there is no constructor defined\
    \ in a class?\n\n    1.  the object is not created\n\n    2.  the program terminates\n\
    \n    3.  the objects gets created\n\n    4.  none of these\n\n##### ANSWERS\n\
    \n1.  c\n\n2.  b\n\n3.  a\n\n4.  b\n\n5.  c\n\n6.  b\n\n7.  c\n\n8.  d\n\n9. \
    \ a\n\n10.  c\n\n##### ![Exercise](Images/exe.png)EXERCISES\n\n1.  What is a constructor?\
    \ Explain its utility.\n\n2.  Define the terms: default constructor and parameterized\
    \ constructor.\n\n3.  Modify [Example 1](#chapter_04.xhtml_ch4ex1) of [Chapter\
    \ 4](#chapter_04.xhtml) such that the class contains a constructor function.\n\
    \n4.  Design a constructor with default values for [Example 4](#chapter_04.xhtml_ch4ex4)\
    \ of [Chapter 4](#chapter_04.xhtml).\n\n5.  Design a suitable constructor function\
    \ for [Example 9](#chapter_04.xhtml_ch4ex9) of [Chapter 4](#chapter_04.xhtml).\n\
    \n6.  Explain copy constructor in detail.\n\n7.  Define the term destructor.\n\
    \n8.  Describe the importance of destructor function.\n\n9.  Write a program that\
    \ illustrates the working of a destructor function.\n\n10.  Given the following\
    \ C++ code, answer the questions (a) and (b).\n\n    ![page196-1.png](Images/page196-1.png)\n\
    \n    1.  In object-oriented programming, what is Function1 referred to as and\
    \ when does it get invoked/called?\n\n    2.  In object-oriented programming,\
    \ what is Function2 referred to as and when does it get involved/called?\n\n11.\
    \  Write a program in C++ that creates a class called ‘time’ with data members:\
    \ hour, minutes, and seconds of type integer, integer, and float, respectively.\
    \ The class uses two constructors. One constructor is used to initialize the time\
    \ data elements to zero. The second constructor is used to set the time components\
    \ to a predetermined time, passed by the user as arguments. The class also has\
    \ two member functions: dispTime() and addTime(). The dispTime() displays the\
    \ time in: hh:mm::ss.ss format. The other function addTime() adds two objects\
    \ T1 and T2 of time type such that T3 = T1 & T2, where T3 is also of type ‘time’.\n\
    \n## 7\n\n## INHERITANCE: EXTENDING CLASSES\n\n##### 7.1 INTRODUCTION TO CODE\
    \ REUSE\n\nAlmost all programming languages support functions that allow a piece\
    \ of code to be reused again and again in a calling program. However, functions\
    \ provide rather limited support for code reuse. In object-oriented programming\
    \ (OOP), code reuse is a central feature. In fact, we can reuse the code written\
    \ in a class in another class by either of the two mechanisms given below:\n\n\
    1.  Containership\n\n2.  Inheritance\n\n##### 7.2 CONTAINERSHIP\n\nIn day-to-day\
    \ life, we come across objects which are composed of other objects. For instance,\
    \ a computer is composed of objects like motherboard, hard disk, CD-ROM drive,\
    \ monitor, etc. The motherboard contains a CPU and other components. The CPU contains\
    \ ALU, CU and ...\n\n## 8\n\n## TEMPLATES: CODE SHARING (GENERICITY)\n\n#####\
    \ 8.1 INTRODUCTION TO CODE SHARING\n\nThere are many programming situations where\
    \ same set of operations is applied on different data types. For example, the\
    \ following function exchanges the contents of two variables of type int.\n\n\
    ![image](Images/pg235-1.png)\n\nNow, consider a situation where we also need to\
    \ exchange the contents of variable of type: float and char. Accordingly, we will\
    \ have to define the following two functions:\n\nFunction for float type variables:\n\
    \n![image](Images/pg235-2.png)\n\nFunction for char type variables:\n\n![image](Images/pg235-3.png)\n\
    \nIt may be noted that 99% of the code in the above three functions is same except\
    \ the type declaration: int, float and char. Now the pertinent question arises\
    \ that “Can’t we write a *generic* function that can accept all types of parameters?”.\
    \ If yes, then a tremendous amount of typing effort can be saved. This will not\
    \ only increase the productivity of the programmer but also reduce the size of\
    \ the program. However, the programmer must demarcate the program code into two\
    \ categories: type dependent and type independent codes.\n\nIn fact, there are\
    \ plenty of applications of such generalized (generic) codes. For instance, a\
    \ compiler needs to maintain variety of tables: symbol table, literal table, opcode\
    \ table, compiler directive table, function name table, etc. All tables are operated\
    \ in search–insert fashion and the code for these operations is almost same. Similarly\
    \ the compiler maintains as many stacks as types of data it works upon.\n\nCode\
    \ sharing is implemented in C++ through **templates**. A detailed discussion on\
    \ this feature is given in the following sections.\n\n##### 8.2 TEMPLATES\n\n\
    A template in C++ is used to create generic functions and classes. The format\
    \ of template declaration is given below:\n\n![image](Images/pg236-1.png)"
