    ### 10.4 OPENING THE FILES BY USING FUNCTION `OPEN()`


    A file can also be opened in a program by a function called `open()`. However,
    we must specify the stream to be associated with the file. For example a file
    called “test.dat” can be opened for output by the following set of statements:


    ![image](Images/pg273-3.png)


    The statement (i) declares the stream `newfile` to be of type `ofstream`, i.e.
    output stream. The statement (ii) assigns the file stream to the file called “test.dat”.
    Thus, in the program the file “test.dat” would be known as `newfile`. The major
    advantage of this method is that more than one files can be opened at a time in
    a program.


