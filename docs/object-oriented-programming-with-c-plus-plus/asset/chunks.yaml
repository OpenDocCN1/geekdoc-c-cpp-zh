    \ is an implementation function, it would be placed in private section from implementation\
    \ hiding point of view.\n\nThe required class with a complete program is given\
    \ below:\n\n![page118-1.png](Images/page118-1.png)\n\n##### 4.5 ARRAY OF OBJECTS\n\
    \nC++ allows declaration of arrays of objects like arrays of any other type. An\
    \ individual object within the array can be accessed by a subscript. The following\
    \ example illustrates the usage of an array of objects of class student type.\n\
    \n##### **Example 4**. *Use the student class of [Example 1](#chapter_04.xhtml_ch4ex1).\
    \ Write a program which reads records of *N* number of students in an array of\
    \ objects and prints the list of students in the following format:*\n\n![page119-1.png](Images/page119-1.png)\n\
    \n*Solution*: The required program, that uses an array of objects of class student\
    \ type to read and print a list of students, is given below:\n\n![page120-1.png](Images/page120-1.png)\n\
    \n##### 4.6 OBJECTS AS FUNCTION ARGUMENTS\n\nC++ considers objects as built-in\
    \ data type and therefore, an object can be passed to a function as an argument.\
    \ An object can be passed in either of the two ways given below. However, each\
    \ method has its own merits and demerits.\n\n1.  Pass by value\n\n2.  Pass by\
    \ reference\n\n1.  *Pass by value*: in *pass by value* method of argument passing,\
    \ the objects are passed to functions by value. A copy of the object is received\
    \ by the called function, not the actual object. The called function can only\
    \ use the services of the object because only public members of the object are\
    \ accessible to the function. For instance, consider the following function (test())\
    \ that receives an object of student type through ‘*pass by value*’ and reads\
    \ its data and displays its grade.\n\n    ![page121-1.png](Images/page121-1.png)\n\
    \n    The output of the program is given below:\n\n    ![page121-2.png](Images/page121-2.png)\n\
    \n    It may be noted that the function main is also trying to display the grade\
    \ but only garbage is being shown. The reason being that the object studOb, created\
    \ in main() is different from the object sOb created in test() as shown in [Fig.\
    \ 4.9](#chapter_04.xhtml_ch4fig9). Therefore, the grade computed by sOb is shown\
    \ by sOb only and not by studOb of main().\n\n    ![Figure 4.9](Images/ch04fig09.png)\n\
    \n    **Figure 4.9** *The object being passed by ‘pass by value’ method*\n\n2.\
    \  *Pass by reference*: in some situations, it is desired that the changes done\
    \ to an object in the called function should be reflected back into the calling\
    \ function. This can be resolved with the help of pass by reference method of\
    \ argument passing of C++. In this method, the address of an object is passed\
    \ to the function as an argument. The address of the object is represented by\
    \ preceding the object name with the character ‘&’.\n\n    For instance, consider\
    \ the following modified function (test()) that receives an object of student\
    \ type by *‘pass by reference’* and reads its data and displays its grade.\n\n\
    \    ![page122-1.png](Images/page122-1.png)\n\nThe output of the program is given\
    \ below:\n\n![page123-1.png](Images/page123-1.png)"
