    ```


    输出将是 50，因为 `*` 和 `&` 操作符是互补的；因此，值 50 存储在名为 `a` 的变量中。


    ### 2.2 指针变量


    变量的地址可以存储在一个名为**指针**变量的特殊变量中。指针变量包含另一个变量的地址。让我们假设 `y` 就是这样一个变量。现在，可以通过语句 `y =
    &x` 将变量 `x` 的地址赋值给 `y`。该语句的效果如图图 2.3 所示。


    ```

    ![Figure 2.3](img/ch02fig03.png)

    ```


