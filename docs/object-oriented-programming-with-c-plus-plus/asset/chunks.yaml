    3. Which of the following is not a characteristic of a general object?\n    1.\
    \ identity\n    2. structure\n    3. states\n    4. behaviours\n4. A class defines\
    \ common ____ and ____ of a group of objects.\n    1. identity, states\n    2.\
    \ identity, behaviours\n    3. states, behaviours\n    4. data, data structure\n\
    5. Implementation hiding is carried out by:\n    1. encapsulation\n    2. abstraction\n\
    \    3. static functions\n    4. scope resolution operator\n6. An interface is\
    \ composed of:\n    1. private members\n    2. public members\n    3. stand alone\
    \ functions\n    4. none of these\n7. A private member can be accessed by:\n \
    \   1. a stand alone function\n    2. the interface of the object\n    3. only\
    \ the private members of the class\n    4. by all the members of the class\n8.\
    \ A global variable can be accessed within a class by:\n    1. prefixing it by\
    \ a scope resolution operator\n    2. by declaring it as static\n    3. by a dot\
    \ operator\n    4. none of these\n9. A member of a class is by default:\n    1.\
    \ public\n    2. static\n    3. private\n    4. global\n10. An object is ____\
    \ of a class.\n    1. copy\n    2. part\n    3. property\n    4. instance\n\n\
    #### ANSWERS\n\n1. d\n2. b\n3. b\n4. c\n5. a\n6. b\n7. d\n8. a\n9. c\n10. d\n\n\
    #### ![Exercise](Images/exe.png)EXERCISES\n\n1. Describe the basic concepts of\
    \ object-oriented programming.\n2. What do you understand by a class in `C++`?\n\
    3. Write the differences between a structure and a class.\n4. Define the terms\
    \ class and object. What is the relation between the two?\n5. How does a class\
    \ accomplish data hiding?\n6. Define the terms: abstraction and encapsulation.\n\
    7. Explain how classes are declared in a `C++` program.\n8. Explain the purpose\
    \ of access specifiers in a class.\n9. Why it is considered a good practice for\
    \ declaring data members as private?\n10. Explain in brief the rules for definition\
    \ and declaration of function in a class.\n11. Write a class called `boxVolume`\
    \ with `length`, `width` and `height` as data members and `readData()`, `dispData()`\
    \ and `computeVol()` as functions. Also write a `main()` function to test the\
    \ `boxVolume` class.\n12. Write a class called `bankACNT` that models a bank account\
    \ having following members:\n    **States**\n    Name of the client\n    Account\
    \ number\n    Type of account\n    Balance amount\n    **Behaviours:**\n    `initVal()`\
    \ – to initialize the values\n    `depAmount()` – to to deposit amount\n    `withdrawAmount()`\
    \ – to withdraw some amount\n    `checkBalance()` – to check the balance amount\n\
    \    `dispInfo()` – to display the A/C No. and balance\n    Write a `main()` function\
    \ to test the class `bankACNT`.\n13. Create a class to represent a book. With\
    \ following members:\n    **States**\n    Book\n    Title\n    Author\n    Acc_No\n\
    \    Code\n    date_issued\n    date_received\n    **Behaviours**\n    `read_data(\
    \ )`\n    `compute_fine( )`\n    `dispFine()`\n14. Write a program that uses the\
    \ class `book` of exercise 13 and manipulates the data of a book through various\
    \ member functions. Assume rules for the computation of fine for the late reture\
    \ of a book.\n15. Write a program that creates a list of `N` number of employee\
    \ objects having following members.\n    **States**\n    Name\n    Age\n    empID\n\
    \    sex\n    address\n    H.No.\n    Street\n    Dist.\n    State\n    **Behaviours:**\n\
    \    `readData()`\n    `dispData()`\n    The program prints the list of employees\
    \ in the format given below:\n    ![page135-1.png](Images/page135-1.png)\n16.\
    \ Write a `C++` program that inputs today’s date and prints tomorrow’s date.\n\
    17. Differentiate between instance and class.\n18. Write a `C++` program that\
    \ counts the number of objects.\n19. What are the general properties of classes?\n\
    \n#### 5 MORE ON FUNCTIONS: ADVANCED CONCEPTS\n\n##### 5.1 POLYMORPHISM\n\n“The\
    \ meeting ends with thanks,” announced the secretary. This message was taken differently\
    \ by different persons. This behaviour is called as polymorphic in the sense that\
    \ the same message was processed in different forms.\n\n#### 6\n\n#### CONSTRUCTORS\
    \ AND DESTRUCTORS\n\n##### 6.1 CONSTRUCTORS\n\nWe know that a class is more important\
    \ than the objects it represents. The reason being that once a class is defined,\
    \ any number of objects of the class type can be churned out at run time. We also\
    \ know that the class is a set of specifications that are used by the compiler\
    \ for the purpose of construction of objects.\n\nIn fact for the creation of an\
    \ object, the compiler creates a function having the same name as the class as\
    \ shown in 6.1. It may be noted that the name of the class is `myClass` and the\
    \ name of the function created by the compiler is also `myClass`. This function\
    \ is called as a **constructor** function. As the name suggests, the constructor\
    \ function creates an object of its corresponding class on demand in a program.\n\
    \n![Figure 6.1](Images/ch06fig01.png)\n\n**Figure 6.1** *The constructor function\
    \ and its operation*\n\nThus, the constructor function `myClass()` would create\
    \ an object `myOb` of `myClass` type as and when the following object creation\
    \ statement is executed:\n\n```\nmyClass myOb;\n```\n\nIt may be further noted\
    \ that the class is a compile time entity whereas the object is a run time entity.\
    \ Therefore, the object will get the memory and the resources and not the class.\n\
    \nFor that reason, the constructor function allocates the memory space for the\
    \ data items or state variables of each object. However, the member functions\
    \ are allocated space only once for all instances of objects. But the inline functions\
    \ are duplicated for every created object.\n\nNow the most important question\
    \ is that, who calls the constructor function especially when it is a run time\
    \ entity? The answer is that the compiler inserts the following line in the class\
    \ (say `myClass`) at compile time and binds it with its constructor function:\n\
    \n```cpp\nmyClass ( ) { };\n```\n"
