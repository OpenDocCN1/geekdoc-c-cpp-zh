    ### 10.5 READING AND WRITING BLOCKS AND OBJECTS (BINARY FILES)


    In the previous sections, we have used text files. Let us now write binary files
    which are more versatile and popular among programmers. The major advantage of
    such files is that they require less memory space for storage of data. Moreover,
    these files can be used to read or write structured data such as structures, class
    objects, etc.


    For binary files, the functions `read()` and `write()` are used to read and write
    objects, respectively. Blocks of data can also be read or written by these functions.
    The general form of `read()` function is given below:


    ```cpp

    <name>.read((char *) &<block>, size);

    ```


    where `<name>` is the name of the input stream; `<block>` is the name of the block
    to be read from the stream; `size` is the size of the block which can be obtained
    by a function called `sizeof()`.


    The general form of `write()` function is given below:


    ```cpp

    <name>.write((char *) &<block>, size);

    ```


    where `<name>` is the name of the output stream; `<block>` is the name of the
    block to be written into the stream; `size` is the size of the block.


    ![Note](Images/note.png) **Note**: The type cast (i.e. `(char *)`) is necessary
    in the `read()` and `write()` functions.


