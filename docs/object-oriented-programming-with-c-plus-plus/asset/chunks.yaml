    ### 4.3 C++ 中类的声明


    从上面的讨论中显而易见，类是 OOP 的核心，并且类可以被用于创建其类型的对象。在 C++ 中，可以使用关键字 `class` 来定义类。类声明的格式如下：


    ![pg110-1.png](img/pg110-1.png)


    其中 `class` 是关键字；`<name>` 是用户定义的类名。它是一个 C++ 标识符。`private` 是关键字；`public` 也是关键字。


    可以观察到类的声明与结构体（structure）声明相似。因此，所有与结构体相关的内容都适用于类。然而，区别在于，结构体是开放且对所有人可见的，而对类成员的访问是受到相当限制的。类明显有两个部分：`private`
    和 `public`。类中还有一个第三个特殊区域，该区域被称为 `protected`，将在本书后后部分讨论。


    **私有成员（Private members）**：在 `private` 区域声明的成员在类外部无法访问。因此，需要保护的最重要的成员被放置在 `private`
    区域。状态（即变量）总是设为私有的。这是因为*对象的内部状态应该只通过内部行为或函数更改，而不应通过外部刺激更改*。例如，人体的体温无论气候条件是夏季还是冬季都保持恒定。然而，体内的感染可能会导致体温升高。这种隐藏状态和数据结构的特征被称为*数据或信息隐藏*。


    同样地，实现业务逻辑的行为（即函数）也通过将它们设为私有成员来对外部隐藏。可以修改对象状态的 `set` 函数也被设为私有。这种隐藏实现或设置函数的特征也称为*实现隐藏（implementation
    hiding）*。


    **公共成员（Public members）**：需要与外部世界交互的函数被设为公共。这些函数为了以下目的与外部世界交互：


    1. **从用户或其他对象获取输入**。例如，从用户处读取数据的函数（如 `read_data()`）需要被设为公共。

    2. **向用户提供有关对象状态的信息**。这些函数也称为 `get` 函数。例如，告知学生成绩的函数（如 `get_grade()`）必须设为公共。

    3. **向用户或其他对象提供对象提供的的服务**。例如，栈对象的 `push()` 和 `pop()` 函数被设为公共。


    可以注意到，公共函数充当外部世界的接口（interface）。换句话说，我们可以说重要数据、信息和实现隐藏在 `private` 区域，而在公共接口之后，如图图
    4.7 所示。


    ![Figure 4.7](img/ch04fig07.png)


    **图 4.7** *公共接口后的数据和实现隐藏*


