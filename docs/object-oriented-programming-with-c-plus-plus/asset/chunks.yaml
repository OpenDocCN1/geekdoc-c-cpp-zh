  trans: "\n\n1. `对象是有活的`，因为对象的产生产生。它获取了像内存这样的资源。它有自己的生命周期。\n2. `对象是活跃的`，因为对象通过其接口提供服务。\n\
    3. `对象是智能的`，因为每个对象都拥有编码的逻辑，用于提供服务或解决眼下的问题。\n\n#### 4.10 总结\n\n任何可感知的实体都是对象。每个对象都可以被识别为属于某个类（class）。将数据和函数结合成一个单一单元的活动被称为封装（encapsulation）。数据和函数在基础层面上通过封装的形式相关联。它实现了数据、信息和实现的隐藏。抽象（abstraction）将本质部分与实现细节分离开来。定义在成员函数中的\
    \ `static variable` 是该类所有实例的共有变量。\n\n#### ![问题](img/question.png)单选题\n\n1. 我们周围的世界由以下什么组成：\n\
    \    1. 函数\n    2. 模块\n    3. 数据\n    4. 对象\n2. 我们可以通过什么感知对象：\n    1. 想象\n   \
    \ 2. 感官\n    3. 直觉\n    4. 情感\n3. 下列哪项不是通用对象的特征？\n    1. 身份\n    2. 结构\n    3.\
    \ 状态\n    4. 行为\n4. 类定义了一组对象的共同 ____ 和 ____。\n    1. 身份、状态\n    2. 身份、行为\n   \
    \ 3. 状态、行为\n    4. 数据、数据结构\n5. 实现隐藏是通过：的\n    1. 封装\n    2. 抽象\n    3. 静态函数\n\
    \    4. 作用域解析运算符\n6. 接口由以下内容组成：\n    1. 私有成员\n    2. 公有成员\n    3. 独立函数\n    4.\
    \ 以上都不是\n7. 私有成员可以通过以下方式访问：\n    1. 独立函数\n    2. 对象的接口\n    3. 仅通过类的私有成员\n   \
    \ 4. 通过类的所有成员\n8. 全局变量可以在类内通过以下方式访问：\n    1. 加上作用域解析运算符前缀\n    2. 将其声明为静态\n9.\
    \ 全局变量可以在类内通过以下方式访问：\n    1. 加上作用域解析运算符前缀\n    2. 将其声明为静态\n9. 对象的 ____ 默认是：\n\
    \    1. 公有\n    2. 静态\n    3. 私有\n    4. 全局\n10. 类的 ____ 是：\n    1. 拷贝\n    2.\
    \ 属性\n    3. 属性\n    4. 实例\n\n#### 答案\n\n1. d\n2. b\n3. b\n4. c\n5. a\n6. b\n\
    7. d\n8. a\n9. c\n10. d\n\n#### ![练习](img/exe.png)练习题\n\n1. 描述面向对象编程的基本概念。\n2.\
    \ 在 C++ 中 中什么是类？\n3. 说明结构和类之间的区别。\n4. 什么是对象的关系？\n5. 类是如何实现数据隐藏的？\n6. 定义抽象和封装术语。\n\
    7. 说明 C++ 中类的声明规则。\n8. 解释访问修饰符的作用。\n9. 为什么将成员变量声明为私有？\n10. 简述类的定义。\n11. 编写一个名为\
    \ `length`、`width` 和 `height` 为成员的 `box` 类，并带有 `read()`、`disp()` 和 `compute()`\
    \ 函数。\n12. 编写一个名为 `bankACNT` 的类，它具有以下成员：\n    **状态**\n    姓名\n    日期\n    账号\n\
    \    类型\n    **行为：**\n    `init()` – 初始化\n    `deposit()` – 存款\n    `withdraw()`\
    \ – 提款\n    `check()` – 检查\n    `disp()` – 显示\n13. 编写一个代表 `book` 的类，它具有以下成员：\n\
    \    **状态**\n    标题\n    作者\n    账号\n    代码\n    发布\n    **行为：**\n    `read()`\n\
    \    `compute()`\n    `disp()`\n14. 编写一个关于 `fine` 程序。\n15. 编写一个具有以下成员的 `employee`\
    \ 类：\n    **状态**\n    姓名\n    年龄\n    ID\n    性别\n    地址\n    街道\n    状态\n   \
    \ **行为：**\n    `readData()`\n    `dispData()`\n16. 编写一个 C++ 程序，输入今天的日期并明天的日期。\n\
    17. 区分实例和类。\n18. 编写一个 C++ 程序，统计对象的数量。\n19. 类的通用属性有哪些？\n\n#### 5 关于函数的更多：高级概念\n\
    \n##### 5.1 多态\n\n“会议结束，”秘书宣布道。这个信息被不同的人以不同的方式理解。这种行为在意义上被称为多态。\n\n#### 6\n\n\
    #### 构造函数与析构函数\n\n##### 6.1 构造函数\n\n我们知道类比它代表的对象更重要，因为一旦定义了类，就可以在运行时产生任意的对象。我们也知道类是编译器用于构造对象的一组规范。\n\
    \n事实上，为了创建对象，编译器会创建一个与类同名的函数，如 6.1 所示。可以注意到类的名称是 `myClass`，编译器创建的函数名称也是 `myClass`。这个函数被称为构造函数。正如名称所示，构造函数会在需要时创建相应的对象。\n\
    \n![图 6.1](img/ch06fig01.png)\n\n**图 6.1** *构造函数及其操作*\n\n因此，当执行以下对象创建语句时，构造函数\
    \ `myClass()` 将创建一个 `myClass` 类型的对象 `myOb`：\n\n```\nmyClass myOb;\n```\n\n可以进一步注意到，类是编译时实体，而对象是运行时实体。因此，由对象获取内存和资源，而不是类。\n\
