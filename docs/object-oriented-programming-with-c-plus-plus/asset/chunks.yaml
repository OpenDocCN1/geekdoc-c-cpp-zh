    the default argument “Sz = 20” for the initialization purpose whenever the argument
    state is missing. However, care must be taken that the default arguments must
    be the trailing arguments.


    #### 6.2.5 Rules for Constructor Definition and Usage


    The rules for constructor definition in C++ and its usages are:


    1.  The name of the constructor must be same as that of the class.


    2.  A constructor can have a parameter list.


    3.  The constructor functions can be overloaded.


    4.  A constructor with no arguments is the default constructor.


    5.  If there is no constructor in a class, a default constructor is generated
    by the compiler.


    6.  The constructor is executed automatically.


    7.  The popular abbreviation for constructor is **ctor**.


    It may be noted here that an object can be defined at a local level inside a function
    (say myFun()) or at a global level. When the object is local then it is created
    as many times as the myFun() is called. Therefore, its constructor is also called
    every time myFun() is called. When the object is global in nature then its constructor
    is called at the start of the program.


    ##### 6.3 DESTRUCTORS


    A destructor is an inverse of a constructor in the sense that it removes the memory
    of an object which was allocated by the constructor during the creation of the
