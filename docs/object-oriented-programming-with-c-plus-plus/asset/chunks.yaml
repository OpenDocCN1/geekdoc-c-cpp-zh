    It may be noted that the program has now prompted the user to enter the name of
    the file to be read. The advantage is that the program has become flexible, i.e.
    the user can give name of any of the existing files at run time.


    Though opening of a file through a constructor is an easy method but the following
    points should be kept in mind while opening the files:


    1. Only one file can be connected to a stream.

    2. A file opened in any mode (input or output) must be closed by the function
    `close()`.

    3. If a file is opened for output then a new file would be created if no file
    with the same name already exists otherwise the contents of the existing file
    will be deleted.


    ### 10.3.3 Function `put()`


    This function writes a single character at a time to the output stream. For example,
    the following statement will write the character content of character variable
    `ch` into the stream called `testfile`.


    ```cpp

    testfile.put(ch);

    ```


