    \ a member function is given below:\n\n![image](Images/pg241-1.png)\n\n![Note](Images/note.png)**Note**\
    \ : <ugType> has to be written within a pair of angled brackets (< and >).\n\n\
    For example, the push() function of generic class called ‘stack’ has been declared\
    \ as given below:\n\n![image](Images/pg241-2.png)\n\n![Note](Images/note.png)**Note**\
    \ : An object of generic type class can be created by qualifying (or type casting)\
    \ the statement by the type for which the object is desired. The format of object\
    \ creation for a generic class is given below:\n\n![image](Images/pg242-1.png)\n\
    \nwhere class name is the name of the class; “<” is the standard left angled bracket\
    \ or sign for less than operator; typeOb is the type of data for which the object\
    \ is required; “>” is the standard right angled bracket or sign for greater than\
    \ operator; object name, name of the object to be created.\n\nFor example, an\
    \ object named ‘chOb’ of type stack that works on char type of data can be created\
    \ by the following statement:\n\n![image](Images/pg242-2.png)\n\nKindly note that\
    \ angled brackets are necessary for type casting the required object. The name\
    \ of the class juxt aposed with the type in angled brackets (i.e. stack <char>)\
    \ is called a *template class*.\n\n##### **Example 5**. *Write the function main\
    \ to test both the stacks for values 70 and 23.54 to be pushed and popped from\
    \ the integer and float stacks, respectively.*\n\n*Solution*: The required function\
    \ main() is given below:\n\n![image](Images/pg242-3.png)\n\nThe output of the\
    \ above program is given below:\n\n![image](Images/pg243-1.png)\n\nIt may be noted\
    \ that same class has been used to instantiate two different objects capable of\
    \ working on integer and float type data, respectively. Therefore, a generic class\
    \ is also known as a **parameterized class**.\n\nThere is only one piece of generic\
    \ code which is being shared by different objects working on different types of\
    \ data. Thus, we can say that *templates help us in* **sharing the code** *among\
    \ structurally similar family of objects or functions*.\n\n##### 8.4 TEMPLATES\
    \ WITH MORE THAN ONE GENERIC PARAMETER\n\nA template can have more than one generic\
    \ parameter as shown by the following declaration:\n\ntemplate <class genType1,\
    \ class genType2>\n\nThe above template declaration is using two generic types:\
    \ genType1 and genType2\\. The advantage of this feature of C++ is that a function\
    \ template or class template can be called for more number of generic parameters.\n\
    \nConsider the following function template:\n\n![image](Images/pg243-2.png)\n\n\
    It may be noted that it is using two generic types: *T* and *U*. It adds two formal\
    \ parameters *x* and *y* of type *T* and *U*, respectively. The sum is stored\
    \ in a variable called ‘result’ of type U. Thereafter the contents of ‘results’\
    \ are printed.\n\n##### **Example 6**. *Write a complete program that uses the\
    \ generic function test(), developed above and tests it for various combination\
    \ of parameters of different types.*\n\n*Solution*: We would test the generic\
    \ function for various combinations of values of types int, float and char. The\
    \ complete program is given below:\n\n![image](Images/pg244-1.png)\n\nThe output\
    \ of this program is given below:\n\n![image](Images/pg244-2.png)\n\nIt may be\
    \ noted that the generic function is able to work with two generic parameters.\
    \ It is giving correct results for various combinations of different types of\
    \ data.\n\n##### 8.5 SUMMARY\n\nA generic function and class can accept parameters\
    \ of different types. It allows code sharing with a view to reduce typing effort,\
    \ increase productivity and reduce the size of the program. The code of a program\
    \ can be comfortably divided into two parts: type dependent and type independent.\
    \ The ‘generic type’ gets substituted at runtime by the type of data supplied\
    \ to the generic function or class. A template declaration followed by a class\
    \ declaration is jointly called a ‘**class template**’. The name of class juxt\
    \ aposed with a type in angled brackets is called a ‘**template class**’. A template\
    \ can have more than one generic parameter.\n\n##### ![Question](Images/question.png)MULTIPLE\
    \ CHOICE QUESTIONS\n\n1.  A generic function increases:\n\n    1.  productivity\n\
    \n    2.  program length\n\n    3.  typing effort\n\n2.  A template in C++ is\
    \ used to create _______ functions\n\n    1.  virtual\n\n    2.  generic\n\n \
    \   3.  recursive\n\n    4.  friend\n\n3.  The templates use_____ polymorphism\
    \ to bind the data with their types\n\n    1.  compile time\n\n    2.  runtime\n\
    \n4.  A generic class is called as:\n\n    1.  base class\n\n    2.  derived class\n\
    \n    3.  parameterized class\n\n    4.  friend class\n\n5.  Templates help us\
    \ in sharing the code among structurally ______ family of objects or functions\n\
    \n    1.  dissimilar\n\n    2.  superior\n\n    3.  conflicting\n\n    4.  similar\n\
    \n##### ANSWERS\n\n1.  a\n\n2.  b\n\n3.  b\n\n4.  c\n\n5.  d\n\n##### ![Exercise](Images/exe.png)EXERCISES\n\
    \n1.  What is a generic function?\n\n2.  How ‘code sharing’ is implemented in\
    \ C++?"
