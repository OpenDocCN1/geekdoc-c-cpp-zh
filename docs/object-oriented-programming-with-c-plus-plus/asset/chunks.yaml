    \ component diagrams with the help of examples.\n\n15.  Explain deployment diagrams\
    \ with the help of examples.\n\n## 13\n\n## POLYMORPHISM: A REVIEW\n\n##### 13.1\
    \ POLYMORPHISM\n\nWe have already introduced ourselves with ‘polymorphism’ in\
    \ [Section 5.1](#chapter_05.xhtml_ch1) wherein it was defined as an entity or\
    \ object having two or more forms. In object-oriented programming (OOP), functions\
    \ and operators can be overloaded to achieve polymorphic behaviour.\n\nPolymorphic\
    \ functions have one name with different implementations. If the functions belong\
    \ to different classes then a message (say ‘close’) can be interpreted differently\
    \ by different objects resulting in different responses as shown in [Fig. 13.1](#chapter_13.xhtml_ch13fig1).\n\
    \n![Figure 13.1](Images/ch13-fig01.png)\n\n**Figure 13.1** *Polymorphic behaviour\
