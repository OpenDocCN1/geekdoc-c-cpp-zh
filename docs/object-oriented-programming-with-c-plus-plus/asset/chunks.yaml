    ## 前言


    我对面向对象编程（OOP）的追求始于 1989 年 11 月，当时导师 Gupta 教授问我：“什么是面向对象编程？”当时我并没有一个令人信服的答案。然而，查阅现有文献发现，OOP
    更多是一种哲学而非编程范式。事实上，我们通过感知观察到的一切都是对象。


    ## 关于作者


    ![image](img/author.png)


    A. K. Sharma 目前是 Anangpuria 技术管理学院的教授兼研究生院长。他曾担任 Faridabad YMCA 科学大学工程学院院长。作为多家大学教学委员会和学术委员会成员，Sharma
    博士指导了二十多名学生获得博士学位。他在国内外学术期刊上发表了 250 多篇研究论文，并主持了一个活跃研究网络爬虫的小组。


    # 1


    ## 到 C++


    ‘C’语言创建是为了作为编写大型复杂系统程序的结构化编程工具。难怪 1973 年的 Unix 操作系统是用‘C’语言开发的。软件开发者喜欢‘C’是因为它具有快速、紧凑以及通过底层功能利用硬件能力等特点。


    Niklaus Wirth 定义程序由两个部分组成，如下：


    ```算法 + 数据结构 = 程序```


    因此，软件开发有两种方法，即围绕*函数*开发，或者侧重于*数据*。


    # 2


    ## 指针


    ### 2.1 简介


    指针是 C++ 最重要的特性之一。C 和 C++ 的初学者发现指针很难理解和操作，尽管 C++ 对指针的处理比 C 相对简单。为了揭开这一方面背后的奥秘，接下来的章节将讨论指针的基础知识。


