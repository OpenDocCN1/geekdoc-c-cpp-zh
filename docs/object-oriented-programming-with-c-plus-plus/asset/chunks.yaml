    4.8）。


    默认情况下，类包含私有成员，即所有状态和行为都是私有的，外部无法访问。因此，类封装了数据、信息和实现。当用户根据设计将某些成员声明为公共时，这些成员就变成了接口或抽象。因此，不必要的细节被忽略了。抽象和封装可以可以精确定义为：


    *抽象*：以公共接口的形式分离类的本质成员的活动被称为抽象。它提供了对象的简单视图，使用户可以容易地使用该对象。


    *封装*：将数据和实现作为一个单元隐藏在类内部的活动被称为封装。它在接口和实现之间创建了分离，从而减少了系统组件之间的依赖。


