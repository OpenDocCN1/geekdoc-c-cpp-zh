    Let us extend the activity diagram of 21 so that the course is only assigned after
    the fee is deposited. The modified activity diagram is shown in [Fig. 12.22](#chapter_12.xhtml_ch12fig22).


    ![Figure 12.22](Images/ch12-fig22.png)


    **Figure 12.22** *Modified activity diagram*


    Let us carry on further to extend the activity diagram by including the activity
    calling candidates from the list till the number of admitted students is equal
    to 30. The modified state chart is given in [Fig. 12.23](#chapter_12.xhtml_ch12fig23).


    ![Figure 12.23](Images/ch12-fig23.png)


    **Figure 12.23** *Activity diagram of admitting 30*


    Concurrent activities can also be depicted by using fork-join construct of UML
    as shown in [Fig. 12.24](#chapter_12.xhtml_ch12fig24). At `Fork` the workflow
    splits into more than one workflow and at `Join` all the workflows join to form
    a single workflow.


    ![Figure 12.24](Images/ch12-fig24.png)


    **Figure 12.24** *Fork- and join-construct for concurrent activities*


    For example, after a student has been admitted, the course and hostel can be assigned
    concurrently as shown in [Fig. 12.25](#chapter_12.xhtml_ch12fig25).


    ![Figure 12.25](Images/ch12-fig25.png)


    **Figure 12.25** *Activity diagram depicting concurrent activities*


    The usage of activity diagrams can be summarized as given below:


    1. Represent the workflow of the system.

    2. Represent the sequence of the workflow from one activity to another.

    3. Show the type of workflow: sequential, branched and concurrent.


    ##### 12.5 IMPLEMENTATION DIAGRAMS


    From the name itself, it is obvious that the implementation diagrams represent
    the implementation aspects of a system. These are of two types: component diagrams
    and deployment diagrams.


    #### 12.5.1 Component Diagram


    We know that a system is composed of reusable sub-systems called components. Each
    component implements a particular service offered by an interface. In the component
    diagram, the components are connected with each other either by the dependency
    relationship or the composition relationship.


    For instance, a student gets registered with a university through an interface.
    The interface communicates with the registration module. The registration module
    stores the registration information in a student database as shown in [Fig. 12.26](#chapter_12.xhtml_ch12fig26).


    ![Figure 12.26](Images/ch12-fig26.png)


    **Figure 12.26** *Component diagram*


    Thus, it can be said that “a component diagram represents the components of a
    system and the relationship among them at an instance of time”. In fact the main
    purposes of drawing a component diagram are:


    1. Plan and name the components that are going to be the executable parts of the
    system.

    2. Represent the organization of components in the system visually.


    #### 12.5.2 Deployment Diagram

