    ## Generalization


    In this OOP strategy, common elements are identified among the different classes.
    It follows two approaches: ‘top down’ and ‘bottom up’. In top down approach, we
    create specialized classes from existing classes. On the other hand, in bottom
    up approach, from different classes, a super class is created. In both the cases
    a hierarchy of classes is created with the help of inheritance leading to ‘a kind
    of’ (ako) relationship. Inheritance is represented by a solid line starting from
    the derived class with an arrow like triangle pointing to the base class, i.e.
    the apex of the triangle point to the base class a shown in [Fig. 12.8](#chapter_12.xhtml_ch12fig8).


    ![Figure 12.8](Images/ch12-fig08.png)


    **Figure 12.8** Inheritance (generalization)


    Consider the hierarchy given in [Fig. 12.9](#chapter_12.xhtml_ch12fig9). From
    top to down, it can be said that an ‘infrared mouse’ is a kind of ‘wireless mouse’
    which itself is a kind of ‘mouse’. In bottom up approach, we can say that wireless
    mouse is a generalization of ‘infrared mouse’ and ‘radio frequency mouse’.


    ![Figure 12.9](Images/ch12-fig09.png)


    **Figure 12.9** Hierarchy of classes


    ## Dependency


    It is a special relationship between two classes where one class depends upon
    other class. This relationship is shown as a dashed directed line from dependent
    class to the class on which it depends. Consider the relationship shown in [Fig.
    12.10](#chapter_12.xhtml_ch12fig10).


    ![Figure 12.10](Images/ch12-fig10.png)


    **Figure 12.10** Dependency relationship


    In fact dependency is a relationship of usage of one class by another. For instance,
    the `Tax` class is using the `taxRules` class. Therefore, it is dependent upon
    `taxRules` class. On the other hand, two classes are called `orthogonal` if they
    do not depend on each other. If a class is modified then it has no effect on the
    functioning of the other class.


    ## 12.3 USE CASE DIAGRAMS (STATIC)


    A system has a boundary surrounded by an environment. The system has some objectives
    which are achieved through functions or classes called `use cases`. Some entities
    of the environment called as ‘actors’ interact with the system as shown in [Fig.
    12.11](#chapter_12.xhtml_ch12fig11).


    ![Figure 12.11](Images/ch12-fig11.png)


    **Figure 12.11** A use case diagram


    A use case diagram is a graph that represents interactions between actors and
    use cases. where:


    1. An `actor` is an entity or a class that can initiate an action. It is generally
    not a part of the system or sub-system under consideration. An actor must be appropriately
    named. For example, in a classroom, the teacher and student are actors. Similarly
    in a library, the library member, clerk, librarian, etc. are all actors.

    2. A `use case` is a class or a function that provides a service to the system.
    It describes the interaction between an actor and the system. Each use case realizes
    the aim of an actor. The name of the use case should be so chosen that it properly
    represents the functionality of the system.

    3. An edge is a path of communication from an actor to a use case or vice-versa.


    Therefore, the following need to be identified before a use case is drawn:


    1. Actors.

    2. Use cases defining what is to be done, i.e. functionality.

    3. Relationships between actors and use cases.


    For example, consider the use case diagram of the book issue scenario of a library
    given in [Fig. 12.12](#chapter_12.xhtml_ch12fig12). It consists of two actors:
    member and library clerk. The use cases are ‘request a book’, ‘search book’, and
    ‘issue book’.


    It may be noted that the name of a use case indicates about the service it provides
    and collectively all the use cases realize the objectives of the system.


    ![Figure 12.12](Images/ch12-fig12.png)


    **Figure 12.12** Use case diagram of book issue scenario


    Similarly, a classroom scenario consists of two actors: ‘teacher’ and ‘student’
    and the possible use cases are: ‘write on black board’, ‘deliver lecture’, ‘ask
    question’, ‘answer question’ and ‘jot down’. The use case diagram for this scenario
    is given in [Fig. 12.13](#chapter_12.xhtml_ch12fig13).


    ![Figure 12.13](Images/ch12-fig13.png)


    **Figure 12.13** Use case diagram of a classroom scenario


    In fact, we can say that a use case diagram represents the context of a system.
    It helps us in understanding the overall behaviour of the system in context of
    the goals of the actors associated with the system. The usage of a use case diagram
    can be summarized as given below:


    1. Gather system requirements.

    2. Identify factors that influence the system. The factors can be either internal
    or external.

    3. Draft a broader view of the system.

    4. Represent the interaction among the actors and the use cases.


    ## 12.4 BEHAVIORAL DIAGRAMS (DYNAMIC)


    The world around us is dynamic in the sense that it is continuously evolving.
    After nightlong sleep, whether we wake up or not, the sun rises, the birds chirp,
    people go to their offices and so on. While driving, the vehicles around us move
    with different speeds. In a classroom, lots of interactions take place between
    the teacher and the students. All these examples show that the world is characterized
    by action and interaction between the world actors. This behavior of the world
    or a part of the world can be represented by behavioral diagrams.


    Interactions between various actors of a system are represented using interaction
    diagrams. The following steps are carried out before drawing the interaction diagrams:


    1. Identify participating objects.

    2. Find out the object organization.

    3. Identify messages that take place between the objects.

    4. Determine the sequence of messages.


    A brief discussion on interaction diagrams is given in the following section.


    ### 12.4.1 Interaction Diagrams


    An interaction diagram helps us in capturing the behavior of a ‘use case’ scenario.
    There are two types of interaction diagrams: sequence diagrams and collaborations
    diagram.


    `Sequence diagram`: this diagram shows the interaction between various objects
    in terms of a time sequence. Each object has a lifeline and the messages it exchanges
    with other objects are arranged in the order of their occurrence.


    In a sequence diagram, objects are placed in horizontal dimension. The lifeline
    of each object is depicted by a vertical line. Messages or interactions are represented
    as horizontal arrows as shown in [Fig. 12.14](#chapter_12.xhtml_ch12fig14).


    ![Figure 12.14](Images/ch12-fig14.png)


    **Figure 12.14** A sequence diagram


    Consider the classroom scenario wherein we have four major objects: teacher, black
    board, student and notebook. The possible interactions among these objects are
    shown in the sequence diagram given in [Fig. 12.15](#chapter_12.xhtml_ch12fig15).


    ![Figure 12.15](Images/ch12-fig15.png)


    **Figure 12.15** Sequence diagram of a classroom scenario


    It may be noted that the vertical line is called the object lifeline. It represents
    the object’s existence during the interaction. However, this diagram does not
    represent associations among the participating objects.


    `Collaboration diagram`: this diagram shows as to how various objects work together
    in a particular context to achieve desired outcome. It is a collection of vertices
    and arcs representing objects and messages respectively. The objects are laid
    out in an organized manner and the arcs are labeled with the messages they send
    to each other.


    The collaboration diagram for classroom scenario is shown in [Fig. 12.16](#chapter_12.xhtml_ch12fig16).


    ![Figure 12.16](Images/ch12-fig16.png)


    **Figure 12.16** A classroom scenario

