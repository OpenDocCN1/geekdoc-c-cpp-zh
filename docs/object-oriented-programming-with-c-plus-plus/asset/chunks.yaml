- fmt: "\n1. `Objects are alive` because an object comes into existence. It gets the\
    \ resources like memory. It has a lifetime.\n2. `Objects are active` because an\
    \ object provides services through its interface.\n3. `Objects are intelligent`\
    \ because every object has the coded logic to provide a service or to solve the\
    \ problem at hand.\n\n#### 4.10 SUMMARY\n\nAny perceivable entity is an object.\
    \ Every object can be identified as belonging to a class. The activity that combines\
    \ data and functions into one unit is known as encapsulation. Data and functions\
    \ are linked on a fundamental level in the form of encapsulation. It enables data,\
    \ information, and implementation hiding. An abstraction separates the essential\
    \ part from the implementation details. A `static variable`, defined in a member\
    \ function, is common to all instances of the class.\n\n#### ![Question](Images/question.png)MULTIPLE\
    \ CHOICE QUESTIONS\n\n1. The world around us is composed of:\n    1. functions\n\
