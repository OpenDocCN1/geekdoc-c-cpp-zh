    值得注意的是，程序现在会提示用户输入要读取的文件名。这样做的好处是程序变得更加灵活，即用户可以在运行时提供任何已存在文件的名称。


    虽然通过构造函数打开文件是一种简单的方法，但在打开文件时应记住以下几点：


    1.  一个流（stream）只能连接到一个文件。

    2.  以任何模式（输入或输出）打开的文件必须通过`close()`函数关闭。

    3.  如果以输出模式打开文件，且不存在同名文件，则会创建一个新文件；否则现有文件的内容将被删除。


    ### 10.3.3 函数 `put()`


    该函数每次向输出流写入一个字符。例如，以下语句将字符型变量 `ch` 的字符内容写入名为 `testfile` 的流中。


    ```cpp

    testfile.put(ch);

    ```


    #### 示例 3. 编写一个程序，在用户定义的文件（假设为“thought.dat”）中写入以下文本。通过以输出模式打开该文件并在屏幕上打印其内容来验证文件的创建。


    “真正的教育是破除狭隘的见”


    **Solution**: 我们将使用`put()` 函数将上述指定的 47 个字符的文本写入用户指定的文件。所需的程序所示：


    ![image](img/pg272-1.png)


    上述程序将“真正的教育是破除狭隘的见”这段文本逐个字符地写入由用户在运行时提供的命名的文件中。程序从文件中读取该行并将其显示在屏幕上。程序的输出所示：


    ![image](img/pg273-1.png)


    ### 10.4 使用函数 `OPEN()` 打开文件


    程序也可以通过一个名为`open()`的函数来打开文件。然而，我们必须指定与文件关联的流。例如，可以通过以下语句 set 以输出模式打开名为“test.dat”的文件：


    ![image](img/pg273-3.png)


    语句 (i) 声明流 `newfile` 的类型为 `ofstream`，即输出流。语句 (ii) 将文件流赋值给名为“test.dat”的文件。因此，在程序中，文件“test.dat”将被识别为
    `newfile`。这种方法的主要优势是程序中可以同时打开多个文件。


    #### 示例 4. 编写一个程序，创建一个名为‘copy.dat’的文本文件，它是给定文本文件‘thought.dat’的完全副本。


    **Solution**: 我们将分别在输入和输出流中打开两个流 `orgFile` 和 `copyFile`。物理文件‘thought.dat’和‘copy.dat’将分别赋值给
    `orgFile` 和 `copyFile`。使用`get()`和`put()`函数将`orgFile`的内容复制到`copyFile`。所需的程序所示：


    ![image](img/pg273-2.png)


    为了验证上述程序的有效性，让我们用记事本打开‘copy.dat’。记事本的快照所示：


    ![image](img/pg274-1.png)


    可以注意的是，上述程序已在一个名为‘copy.dat’的新文件中创建了‘thought.dat’的完全副本。


    ### 10.5 读取和写入块和对象（二进制文件）


    在之前的章节中，我们使用了文本文件。现在让我们来写二进制文件，二进制文件在程序员中更具通用性也更受欢迎。此类文件的主要优势是它们存储数据所需的内存空间较少。此外，这些文件可以用于读取或写入结构化数据，如结构体、类对象等。


    对于二进制文件，分别使用`read()`和`write()`函数读取和写入对象。这些函数也可以读取或写入数据块。`read()`函数的通用形式所示：


    ```cpp

    <name>.read((char *) &<block>, size);

    ```


    其中`<name>`是输入流的名称；`<block>`是想要从流中读取的块的名称；`size`是块的大小，可以通过`sizeof()`函数获取。


    `write()`函数的通用形式所示：


    ```cpp

    <name>.write((char *) &<block>, size);

    ```


    其中`<name>`是输出流的名称；`<block>`是要写入流的块的名称；`size`是块的大小。


    ![Note](img/note.png) **Note**: 在`read()`和`write()`函数中，类型转换（即 `(char *)`）是必要的。


