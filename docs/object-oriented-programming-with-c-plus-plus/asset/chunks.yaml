  raw: "As the name suggests, a deployment diagram *represents the topology of components\
    \ in terms of their deployment on different nodes.* The nodes in general are computational\
    \ hardware components like client and server machines, modems, monitors, etc.\
    \ Therefore, in addition to software components, we need to identify nodes and\
    \ their relationships. A software component runs on a particular node. Therefore,\
    \ a node necessarily contains the instance of that component as shown in [Fig.\
    \ 12.27](#chapter_12.xhtml_ch12fig27).\n\nIt may be noted that the node is named\
    \ as a ‘client m/c’, i.e. client machine. An instance of ‘interface’ component\
    \ is deployed on this node for execution.\n\n![Figure 12.27](Images/ch12-fig27.png)\n\
    \n**Figure 12.27** *A node containing the instance of ‘interface’ component*\n\
    \nLet us now deploy the various components of [Fig. 12.26](#chapter_12.xhtml_ch12fig26)\
    \ as per the following choice:\n\n| Component | Node |\n\n| Interface | client\
    \ m/c |\n\n| Registration | web server |\n\n| Database | Database server |\n\n\
    The corresponding deployment diagram is given in [Fig. 12.28](#chapter_12.xhtml_ch12fig28).\n\
    \n![Figure 12.28](Images/ch12-fig28.png)\n\n**Figure 12.28** *A deployment diagram*\n\
    \nThe usage of deployment diagrams can be summarized as given below:\n\n1.  To\
    \ illustrate the distribution of hardware components called nodes.\n\n2.  To specify\
    \ the topology of the nodes.\n\n3.  To identify the software components that will\
    \ reside on the these nodes.\n\n##### 12.6 SUMMARY\n\nA model is a simplified\
    \ representation of a system, created for the purpose of understanding the system.\
    \ For software modeling, UML (unified modeling language) is used. A model can\
    \ be static or dynamic. A class represents a specific feature of a system. An\
    \ object is also represented by a rectangle but its name is qualified by its class\
    \ name. A composition represents a ‘has-a’ relationship. Association is modeled\
    \ as a pointer from one class to another. Aggregation is modeled as containership.\
    \ Top down approach identifies specialization in classes. Bottom up approach creates\
    \ super classes. Inheritance models ‘ako’ relationship. Dependency is the relationship\
    \ of usage of one class by another. An actor is a class that initiates some action.\
    \ A use case diagram represents the context of a system. An object moves from\
    \ one state to another after the occurrence of an event. A state chart represents\
    \ a reactive system. An activity can have more than one outgoing transition. Implementation\
    \ diagrams are of two types: component and deployment.\n\n##### ![question](Images/question.png)MULTIPLE\
    \ CHOICE QUESTIONS\n\n1.  A static model represents a system at:\n\n    1.  motion\n\
