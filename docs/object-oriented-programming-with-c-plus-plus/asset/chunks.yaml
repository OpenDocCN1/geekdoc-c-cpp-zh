    ##### 4.8 STATIC DATA MEMBERS


    When different instances of a class are created then each instantiated object
    gets its own set of states, i.e. variables. For example, every student object
    ([Examples 1](#chapter_04.xhtml_ch4ex1) & [2](#chapter_04.xhtml_ch4ex2)) gets
    its own set of variables to store name, roll no., marks, etc.


    However, a data member can be declared as **static** within a function of a class
    so that it becomes common to all instances of the class. In simple words we can
    say that a static variable is shared among all instantiated objects of the class.


    A static variable, declared within a function of a class has following characteristics:


    1.  The static variable is initialized to zero at the time of creation of first
    object of the class.


    2.  It is shared by all instances of the class.


    3.  The scope of the static variable is within the function of the class.


    4.  Its lifetime starts with the creation of first object and ends with the destruction
    of last object of the class.


    ##### **Example 9**. *Write a class called ***testStatic*** that declares a normal
    integer variable called individual as its private member. It uses public function
    called disp() which declares a static variable called *common* and displays the
    contents of both individual and common variables for various instances of objects.*


    *Solution*: The required program is given below. It may be noted that in function
    main(), we are passing the number of the object as an argument to the function
    disp():


    ![page130-1.png](Images/page130-1.png)


    The output of the program is given below:


    ![page130-2.png](Images/page130-2.png)


    Kindly note that the static variable is common to all the three objects and its
    contents are getting accumulated (1–3–6) with each invocation of the disp(). However,
    the normal variable of each object has independent location and stores only the
    number of the object. Therefore, the variable (normal) that contains data of an
    individual object is also called an ***instance variable***. Similarly, the static
    variable that holds data that is common and relevant to all objects is also called
    as a ***class variable****.* In fact, there is always only one copy of the class
    variable irrespective of the number of objects instantiated from the class.


    In the light of above we can say that the variables individual and common of class
    testStatic are instance and class variables, respectively.


