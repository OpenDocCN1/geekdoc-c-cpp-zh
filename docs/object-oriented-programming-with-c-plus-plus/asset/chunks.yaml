  trans: '

    然而，指针 `ptr` 对字符串表所做的更改将会干扰指针 `item` [1] 所指向的字符串的内容，反之亦然。因此，程序员在操作指向相同内存地址的指针时，必须格外小心。


    ## 2.5 指针与结构


    与其它类型的指针类似，我们可以有一个指向结构体的指针，也就是说，我们也可以让一个指针指向一个结构。通过在变量名前加上 `*` 可以声明一个指向结构体的指针。考虑以下声明：


    ![image](img/pg74-1.png)


    一旦完成了上述声明，我们可以通过以下语句将结构变量 `abc` 的地址赋值给结构指针 `ptr`：


    ```

    ptr = &abc;

    ```


    由于 `ptr` 是指向结构变量 `abc` 的指针，可以通过一种称为箭头运算符（arrow operator）的特殊运算符来访问结构的成员，即 `→`（减号后跟大于号）。例如，通过以下语句可以将
    `ptr` 指向的结构变量 `abc` 的成员 `a` 和 `y` 分别赋值为 30 和 50.9：


    ![image](img/pg74-3.png)


    箭头运算符 `→` 也被称为**指向成员的**（pointer-to-member）运算符。


    ### 示例 4. *编写一个程序，为下方的记录结构定义一个名为 `item` 的结构。通过点运算符（dot operator）读取记录数据，并通过箭头运算符打印记录。为结构
    `Item` 的成员选择合适的数据类型。*


    ![image](img/pg74-4.png)


    *解答：* 我们将使用一个指针 `ptr` 指向名为 `Item` 的结构。所需的程序所示：


    ![image](img/pg74-5.png)


    从上述程序中，我们可以看到静态结构体的成员可以通过点运算符和箭头运算符进行访问。然而，点运算符用于简单变量，而箭头运算符用于指针变量。


    ### 示例 5. *以下程序的输出是什么？*


    ![image](img/pg75-1.png)


    *解答：* 从上述程序可以观察到，`ptr` 是指向名为 `polygon` 的结构数组的指针。语句 `ptr ++` 将指针从第 0 个位置（即 {1,
    2}）移动到第一个位置（即 {1, 4}）。现在，语句 `x ++` 将结构中的字段 `x` 增加了 1（即从 1 增加到 2）。


    输出将是 2。


    ## 2.6 动态分配


    我们知道在程序中当声明变量 `x` 时，程序会获得一个存储位置，如下所示。


    ![Figure 2.18](img/ch02fig18.png)


    **图 2.18** *变量 x 的内存分配*


    只要程序在执行，即使程序不需要，该内存位置对程序仍然可用（参见图 2.18）。因此，变量 `x` 是静态变量。另一方面，动态变量可以根据运行程序的需要从系统分配或返回给系统。然而，动态变量没有名称，只能通过指针引用。


    考虑下给声明。


    ![Figure 2.19](img/ch02fig19.png)


    **图 2.19** *悬空指针 p*


    上述声明给了我们一个悬空指针 `p`，它指向任何地方（参见图 2.19）。现在，我们可以将这个悬空指针连接到静态变量或动态变量。在我们之前关于指针的讨论中，我们总是将指针与静态变量一起。让我们看看指针如何连接到动态变量。


    在 C++ 中，可以通过名为 `new` 的运算符分配动态内存。动态分配的格式如下：


    ```

    <pointer> = new <varType>

    ```


    其中 `<pointer>` 是指向类型为 `varType` 变量的指针


    ![image](img/pg76-1.png)


    考虑以下声明


    ![image](img/pg76-2.png)


    上述语句集按照以下方式执行：


    1. 创建指针 `p`。它是悬空的，即没有连接到任何地方（参见图 2.20(a)）。

    2. 通过 `new` 运算符获取 `integer` 类型的动态变量，并将悬空指针 `p` 连接到该变量（参见图 2.20(b)）。


    ![Figure 2.20](img/ch02fig20.png)


    **图 2.20** *new 运算符的效果*


    从图 2.20(b) 中可以注意到，动态变量是匿名的，因为它没有名称，因此它只能通过指针 `p` 进行引用。例如，可以通过以下语句将一个值（例如 50）赋值给动态变量：


    ```

    p* = 50;

    ```


    上述语句意味着想要在指针 `p` 指向的内存位置中存储值 50。该语句的效果如图 2.20 所示。

