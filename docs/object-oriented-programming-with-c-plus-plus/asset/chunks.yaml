    **Figure 6.2** Object copy operation through assignment operator*


    Now, this abnormal situation would cause many types of problems such as both the
    objects work on the same location, the changes done by one object to the common
    location may not be acceptable to another object, etc.


    Thus, for copying objects with pointers, we need a mechanism that allows member-wise
    copy of the objects so that separate space may be allocated to the pointer of
    the target object.


    C++ provides a special constructor called `copy constructor` that allows the programmer
    to member-wise copy of one object to another. However, the programmer must write
    the code for member-wise copy of various members of the source object to the corresponding
    members of the target object. The copy constructor is, however, defined in the
    class as a parameterized constructor receiving an object of its own type as argument
    passed by reference. Consider the class given below:


    ![page187-1.png](Images/page187-1.png)


    It may be noted that the above class `myClass` has a special parameterized constructor
    that receives an object by reference of its own class type. Now, if we have an
    `obj1` of `myClass` type and we desire to create a new object `obj2` of `myClass`
    type, initialized with the contents of `obj1` then the following declaration can
    be used:


    ![page187-2.png](Images/page187-2.png)


    The declaration (i) declares an object `obj1` of class `myClass` type whereas
    (ii) it declares another object `obj2` of class `myClass` as well as passes the
    object `Obj1` to the copy constructor for member-wise copy as per the programmer’s
