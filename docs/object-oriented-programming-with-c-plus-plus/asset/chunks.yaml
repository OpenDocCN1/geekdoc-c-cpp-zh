  trans: "\n3. 什么是模板？它是如何定义的？\n\n4. 编写一个名为 `areaSq()` 的模板，用于计算并返回正方形的面积。它接受一个名为 `side`\
    \ 的泛型参数。针对类型为 `int`、`float`、`double` 的给定边长进行函数测试。\n\n5. 编写一个名为 `sort()` 的泛型函数，将给定的\
    \ *N* 个泛型类型数据项按升序排列。\n\n6. 编写一个 `main()` 函数，通过菜单驱动的界面测试上述 `sort()` 函数。\n\n7. 区分\
    \ `class template` 和 `template class` 之间的区别。\n\n8. 编写一个名为 `queue` 的 `class template`，为泛型类型数据提供以下服务：\n\
    \    1. 在队列上添加一个元素\n    2. 从队列中删除一个元素\n\n9. 编写一个名为 `searchTab()` 的模板函数。它维护一个格式如下的符号表：\n\
    \n    | 符号 (Symbol) | 值 (Value) |\n    | | |\n\n符号是字符类型的数组，而值可以是特定表中任何一种可用类型，例如\
    \ `int`、`float`、`char` 等。\n\n## 10. 编写一个 `main()` 函数，针对类型为 `int` 的符号测试上述 `searchTab()`\
    \ 函数。\n\n11. 编写一个 `main()` 函数，针对类型为 `float` 的符号测试上述 `searchTab()` 函数。\n\n## 9\
    \ 运算符重载\n\n### 9.1 引言\n\n让我们考虑这种情况：我们有一个名为 `length` 的类，表示物品（例如布料）以英尺和英寸为单位的长度。其类图如图图\
    \ 9.1 所示。\n\n![Figure9.1](img/ch09-fig01.png)\n\n**图 9.1** *名为“length”的类*\n\n\
    现在，如果我们想要两个该类型类型的对象，选项之一是使用友元函数（例如 `add()`），如下所示：\n\n![image](img/pg247-1.png)\n\
    \n以下 `main()` 函数测试了上述给定的类。\n\n![image](img/pg248-1.png)\n\n示例 ...\n\n## 10 C++\
    \ 中的文件处理\n\n### 10.1 文件概念\n\n我们知道每个程序或子程序由两个主要部分组成：算法和数据结构。算法负责解决问题的规则和步骤，而数据结构包含数据。如图\
    \ 10.1 所示。\n\n![Figure10.1](img/ch10-fig01.png)\n\n**图 10.1** *程序或子程序的结构*\n\n\
    在面向对象编程 (OOP) 中，对象是核心。对象有两个组件：状态（states）和行为（behaviours）。状态和行为分别模拟数据和过程。如图 10.1\
    \ 所示。数据结构本质上是易变的，因为一旦程序结束，其内容就会丢失。同样，对象在程序结束后也会丢失状态。如果我们想永久存储数据或创建持久化对象，就需要将其存储在名为文件的特殊数据结构中。文件可以存储在硬盘等存储媒介上。事实上，大量数据始终存储在文件中。\n\
    \n现在，存储在硬盘等永久存储上的任何内容都称为文件。例如，MBR（主引导记录）、FAT（文件分配表）、分区表、程序等都是文件的示例。\n\n让我们考虑图\
    \ 10.2 中记录的信息。\n\n![Figure10.2](img/ch10-fig02.png)\n\n**图 10.2** *关于学生的信息*\n\n\
    图 10.2 所示表格中的每个条目都是三个数据项：学号（Roll number）、姓名和分数（Marks）。名为 Ajay 的学生学号和总分分别为 001\
    \ 和 50。同样，名为 Ram 的学生学号为 002，总分为 70。该表格中的每个条目也称为学生的记录（record）。记录（*record*可以定义为特定实体（如人、机器、地点或操作）的数据项集合。记录中的单个数据项称为字段（field）。当字段假设唯一值时，它被称为键字段（key-field）。如图\
    \ 10.3 所示，学生记录中的“Roll”就是键字段。\n\n![Figure10.3](img/ch10-fig03.png)\n\n**图 10.3**\
    \ *记录的结构*\n\n因此，学生的记录由以下三个字段组成：\n1. 学号\n2. 姓名\n3. 分数\n\n假设某个类有 30 个学生。现在，由 30\
    \ 条记录组成的整个类信息被称为文件。记录的排列如图 10.4 所示。\n\n![Figure10.4](img/ch10-fig04.png)\n\n**图\
    \ 10.4** *文件：记录的集合*\n\n文件（*file*）可以精确地定义为*记录的逻辑集合，每个记录由项目组成*。文件中的记录可以以下方式排列：\n\
    1. **升序/降序**：文件中的记录可以按照键字段的升序或降序排列。\n2. **字母顺序**：如果键字段是字母类型，则按字母顺序排列。\n3. **时间顺序**：在这种情况下，记录根据日期或事件存储。\n\
    \n当文件数据以可读可打印字符的形式存储时，该文件被称为文本文件。这是一种特殊的文件类型，它不包含记录，只包含字符。另一方面，如果文件包含二进制代码中的不可读字符，则该文件被称为二进制文件。例如，编辑器创建的文件以文本文件存储，而编译器生成的可执行文件以二进制文件存储。\n\
    \n在接下来的章节中将介绍 C++ 支持的文件。\n\n### 10.2 文件与流\n\n在 C++ 中，流是指从源（source）到汇（sink）的数据流。源和汇可以是任何一个输入/输出（I/O）设备或文件。对于输入和输出，有两种不同的流，分别称为输入流和输出流，如图\
    \ 1.2 所示。我们在之前的程序已经使用了以下非格式 I/O 流：\n\n| 流 | 描述 |\n| | |\n| cin | 标准输入流 |\n| cout\
    \ | 标准输出流 |\n| cerr | 标准错误流 |\n\n标准源和汇分别是键盘和显示器屏幕。每当程序中包含`<iostream.h>`头文件时，这些非格式流就会初始化。然而，我们需要使用运算符\
    \ `<<` 和 `>>` 来实现这些流。\n\n文件 I/O 需要的重要流类是 `ifstream`、`ofstream` 和 `fstream`。以下是对这些流的简要讨论：\n\
    \n*ifstream*: 是输入文件流类。其成员函数 `open()` 将流与指定文件的输入模式关联。例如，如果想要输入模式打开名为“xyz.dat”的文件，可以使用以下语句。\n\
    \n![image](img/pg265-1.png)\n\n上面的声明意味着创建一个名为 `myfile` 的输入流，并将其与名为“xyz.dat”的文件关联。除了\
    \ `open()` 之外，`ifstream` 类从 `istream` 类继承了以下函数：\n\n```\n(i) `get()`\n(ii) `getline()`\n\
    (iii) `read()`\n(iv) `seekg()`\n(v) `tellg()`\n```\n"
