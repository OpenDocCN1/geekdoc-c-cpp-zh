    在本类中，定义了两个公共函数 `readvar()` 和 `dispvar()`。需要注意的是，函数的实际代码是写在类定义内部的。相反，如果一个成员函数很大，则应该在类声明之外进行定义。然而，这些函数的原型必须在类定义中提供。例如，上述定义的类可以重写如下所示：


    ![pg113-1.png](img/pg113-1.png)


    运算符 `::` 被称为*作用域解析*运算符。它用于将成员函数与其对应的类关联起来。例如，在上面的函数声明中，它告诉编译器函数 `readvar()` 和
    `dispvar()` 属于名为 `test` 的类。成员函数声明的格式如下：


    ![pg113-2.png](img/pg113-2.png)


    其中 `type:` 是要返回的值的数据类型；


    `class_name:` 是函数所属的类名；


    `function_name:` 是正在声明的函数名；


    `parameter list:` 形式参数列表。


    从上述讨论可以清楚看出，类将数据和函数组合成单一的编程单元。


    ### 示例 1. 定义一个名为 student 的类，模拟学生的以下状态和行为：


    ***状态***


    *姓名 (Name)*


    *学号 (Roll)*


    *分数 (Marks)*


    *等级 (Grade)*


    ***行为***


    `Read_data()`


    `Display_grade()`


    `Compute_grade()`


    *按照以下规则计算等级：*


    ![pg114-1.png](img/pg114-1.png)


    **解决方案**：我们将状态建模为变量并放置在私有部分以实现数据隐藏。行为 `read_data()` 和 `display_grade()` 将建模为函数并放置在公共部分，因为用户需要这些函数来与学生对象进行交互。由于
    `compute_grade()` 是一个**实现函数**，从实现隐藏的角度来看，它将被放置在私有部分。所需的类所示：


    ![pg114-2.png](img/pg114-2.png)


    ## 4.4 创建对象


    对象是类的实例，可以根据其类类型创建。定义对象的语法如下：


    ```cpp

    <class_name>      <object_name>;

    ```


    其中 `<class_name>` 是类名，`<object_name>` 是正在定义的对象名。


    例如，我们可以通过以下声明创建类 `student` 的对象 `studObj`：


    ```cpp

    student      studObj;

    ```


    上述声明表示 `studObj` 是类 `student` 的对象。


    在某些情况下，特别是在对象排序时，需要将一个对象复制到另一个对象。C++ 允许同类型对象进行赋值。它按位将源对象复制到目标对象中。该概念通过下面的语句说明：


    ![pg115-3.png](img/pg115-3.png)


    ### 4.4.1 调用成员函数


    一旦创建了对象，就可以通过点运算符在程序中调用其成员函数（公共），即用点将对象名与函数名连接起来。例如，如果我们想要调用对象 `studOb` 的 `read_data()`
    函数，可以使用以下语句：


    ```cpp

    studOb.read_data();

    ```


    上述语句表示正在调用/执行对象 `studOb` 的函数 `read_data()`。


    ### 示例 2. 使用示例 1 中定义的 student 类。编写一个菜单驱动的程序，测试 student 类的以下功能：


    1. 读取学生数据。

    2. 显示学生的等级。


    **解决方案**：我们将使用 do–while 循环来显示菜单以向用户请求选择。所需的程序所示：


    ![page116-2.png](img/page116-2.png)


    ![page117-1.png](img/page117-1.png)


    ### 示例 3. 定义一个名为 employee 的类，具有以下规范：


    ***状态***


    *姓名 (name)*


    *BP: 基本工资 (basic pay)*，


    *DA: 津贴 (dearness allowance)*


    *HRA: 房租补贴 (house rent allowance)*


    *工资 (salary)*


    ***行为***


    `computeSal(): 计算工资`


    `readData(): 接受数据值`


    `dispSal(): 在屏幕上打印数据。`


    *工资按以下公式计算：*


    *Salary = BP + DA + HRA*


    *其中 DA 和 HRA 分别是 BP 的 65% 和 20%。*


    *编写一个程序读取员工姓名和 BP 并打印工资。*


    **解决方案**：我们将状态建模为变量并放置在私有部分以实现数据隐藏。行为 `readData()` 和 `dispSal()` 将建模为函数并放置在公共部分，因为用户需要这些函数与员工对象进行交互。由于
    `computeSal()` 是一个实现函数，从实现隐藏的角度来看，它将被放置在私有部分。


    带有完整程序的类所示：


    ![page118-1.png](img/page118-1.png)


    ## 4.5 对象数组


    C++ 允许像声明其他类型一样声明对象数组。可以通过下标访问数组中的单个对象。


    ### 示例 4. 使用示例 1 中的 student 类。编写一个程序读取数组中的 *N* 个学生并打印：


    ![page119-1.png](img/page119-1.png)


    **解决方案**：使用 student 类型数组进行读取和打印所需的程序所示：


    ![page120-1.png](img/page120-1.png)


    ## 4.6 作为函数参数的对象


    C++ 将对象视为内置数据类型，因此对象可以作为参数传递给函数。对象可以通过两种方式之一传递。然而，每种方法都有优缺点：


    1. 值传递


    ### 1. 值传递


    在参数传递的值传递方法中，对象按值传递给函数。调用函数接收的是对象的副本，而不是对象本身。调用函数只能使用对象的服务，因为只有对象的公共成员是可以访问的。例如，考虑以下函数
    `test()`，它通过*值传递*接收学生类型的对象并读取其数据并显示等级。


    ![page121-1.png](img/page121-1.png)


    程序的输出所示：


    ![page121-2.png](img/page121-2.png)


    可以注意到 `main` 函数也尝试显示等级，但显示的的是垃圾值。原因是 `main()` 中创建的对象 `studOb` 与 `test()` 中创建的对象
    `sOb` 不同，如图图 4.9` 中的 `studOb` 显示。


    ![Figure 4.9](img/ch04fig9.png)


    **图 4.9** *通过“值传递”方法传递的对象*


    ### 2. 引用传递


    在某些情况下，希望调用函数中对对象进行的更改能反映回调用函数中。这可以通过 C++ 参数传递的引用传递方法来解决。在这种方法中，对象的地址作为参数传递给函数。通过在对象名称前加上字符
    `&` 来表示对象的地址。


    例如，考虑以下修改后的函数 `test()`，它通过*引用传递*接收学生类型的对象并读取其数据并显示等级。


    ![page122-1.png](img/page122-1.png)


