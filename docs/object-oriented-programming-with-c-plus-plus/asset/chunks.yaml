    \ of BOSON, the God particle, can only be perceived through their description\
    \ by experts. Thus, the world around us is composed of nothing but objects of\
    \ varying descriptions as shown in [Fig. 4.1](#chapter_04.xhtml_ch4fig1).\n\n\
    ![Figure 4.1](Images/ch04fig01.png)\n\n**Figure 4.1** *Some of the objects present\
    \ around us*\n\nAn object can be precisely defined as: *an entity around us, perceivable\
    \ through our senses.* If we look around, we find that we are surrounded by several\
    \ objects (Fig. 4.1). For example in a University, students, professors, desks,\
    \ fans, pens, writing pads, computers, etc. are all examples of objects.\n\nNow,\
    \ a closer look at various objects around us reveals that there are many types\
    \ of objects as described below:\n\n1.  *Objects that operate independently*.\
    \ Examples: toys, photocopying machines, cameras, etc.\n\n2.  *Objects that work\
    \ in associations with each other*. Examples: computer–mouse, company–employee,\
    \ car–driver, etc.\n\n3.  *Objects that frequently interact with each other*.\
    \ Example: telephones, fax machines, nodes of computer networks, etc.\n\n4.  *Objects\
    \ that are contained in other objects*. Example: ALU contained in a CPU, engine\
    \ contained in a car, speaker contained in a phone, etc.\n\n**An object has following\
    \ three characteristics:**\n\n1.  *Identity*: it is the name associated with an\
    \ object. It helps in identifying the object, i.e. what we call the object as?\
    \ For example, cup is the name of the object that is used to store, serve and\
    \ drink hot beverages such as tea or coffee.\n\n2.  *States*: an object can be\
    \ in many states, for example, a cup, can be in the following states:\n\n    1.\
    \  Full\n\n    2.  Empty\n\n    3.  Cold/hot\n\n    4.  Broken\n\n3.  *Behaviours*:\
    \ what the object does or what is it capable of doing? For example, a cup can\
    \ be filled, drunk from, washed, broken, etc. Similarly, a person can sit, stand,\
    \ sleep, walk, talk, etc.\n\nConsider the clay pitcher given in [Fig. 4.2](#chapter_04.xhtml_ch4fig2).\n\
    \n![Figure 4.2](Images/ch04fig02.png)\n\n**Figure 4.2** *A clay pitcher*\n\nIt\
    \ has the following characteristics:\n\n1.  Identity: pitcher\n\n2.  States:\n\
    \n    1.  Upright/upside down\n\n    2.  Full/empty\n\n    3.  Broken\n\n    4.\
    \  Material – clay\n\n    5.  Colour – brown\n\n3.  Behaviours:\n\n    1.  Can\
    \ be filled\n\n    2.  Can be emptied\n\n    3.  Can be transported\n\n    4.\
    \  Can be broken\n\nIn normal programming, when we write a program about (say)\
    \ pitcher. The states are represented by variables and the behaviours as functions.\
    \ The main() function sends the variables to various functions to model the overall\
    \ functionality or behaviour of the pitcher. Thus, by nature, we first break the\
    \ pitcher into variables and functions (i.e. pieces) then we try to glue the pieces\
    \ through function calls to model its behaviour as shown in [Fig. 4.3](#chapter_04.xhtml_ch4fig3).\n\
    \n![Figure 4.3](Images/ch04fig03.png)\n\n**Figure 4.3** *Normal programming*\n\
    \nNow the problem is that in a very large program, when we have large number of\
    \ broken objects at hand then it becomes difficult for a programmer to keep track\
    \ of the history of all the variables which are time and again passed to hundreds\
    \ of functions and the results received from them. As the size and complexity\
    \ of a program increases, the function and module management becomes equally difficult\
    \ for the programmer. Therefore, the programming becomes cumbersome and difficult\
    \ and only few hardcore programmers succeed.\n\nHowever, *in real life we don’t\
    \ break the pitcher or for that matter we don’t break any object at all*. The\
    \ objects interact with each other without losing their characteristics (see [Fig.\
    \ 3.7](#chapter_03.xhtml_ch3fig7)). Therefore, their management is quite easy\
    \ and comfortable in real life.\n\nNow the question is – can we create a software\
    \ object that doesn’t lose its characteristics while being maneuvered in a program.\
    \ Yes the answer is Object Oriented Programming (OOP) wherein we can define and\
    \ create software object which behave like real life objects. Before we delve\
    \ more into OOP, let us first understand another concept called ‘class’ as discussed\
    \ in following section.\n\n##### 4.2 CLASSES\n\nHuman has a very strong ability\
    \ to categorize objects. When we see an object we immediately identify it to be\
    \ belonging to a particular group or category. Consider the objects given in [Fig.\
    \ 4.4](#chapter_04.xhtml_ch4fig4)."
