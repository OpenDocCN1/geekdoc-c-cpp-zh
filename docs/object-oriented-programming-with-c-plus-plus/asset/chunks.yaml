- fmt: "\nA dangling pointer is that pointer which has been created but does not point\
    \ to any entity. Such an un-initialized pointer is dangerous in the sense that\
    \ a dereference operation on it will result in an unpredictable operation or may\
    \ result in a runtime error.\n\nConsider the following code:\n\n![image](Images/pg66-2.png)\n\
    \n![Figure 2.11](Images/ch02fig11.png)\n\n**Figure 2.11** The dangling pointer\n\
    \nThe first statement declares the pointer called `ptr`. At runtime it will be\
    \ created as shown in [Fig. 2.11](#chapter_02.xhtml_ch2fig11). It may be noted\
    \ that currently `ptr` is a dangling pointer. The second statement is trying to\
    \ load a value (i.e. 50) to a location that is pointed by `ptr`. Obviously, this\
    \ is a dangerous situation because the results will be unpredictable. The C++\
    \ compiler does not consider it as an error though some compilers may give a warning.\n\
    \nTherefore, if pointers are being used, the following steps must be followed:\n\
    \n*   *Step 1*. Declare the pointer.\n*   *Step 2*. Allocate the variable or entity\
    \ to which the pointer is to be pointed.\n*   *Step 3*. Point the pointer to the\
    \ entity.\n\nLet us assume that it is desired that the pointer `ptr` should point\
    \ to a variable `val` of type `int`. The correct code in that case would be as\
    \ given below:\n\n![image](Images/pg67-1.png)\n\n![Figure 2.12](Images/ch02fig12.png)\n\
    \n**Figure 2.12** The correct assignment\n\nThe result of above program segment\
    \ is shown in [Fig. 2.12](#chapter_02.xhtml_ch2fig12).\n\n## 2.3 POINTERS AND\
    \ ARRAYS\n\nPointers and arrays are very closely related to each other. In C++,\
    \ the name of an array is a pointer that contains the base address of the array.\
    \ In fact, it is a pointer to the first element of the array. Consider the array\
    \ declaration given below:\n\n```cpp\nint list[] = {20, 30, 35, 36, 39};\n```\n\
    \nThis array will be stored in the contiguous locations of the main memory with\
    \ starting address equal to 1001(assumed value), as shown in [Fig. 2.13](#chapter_02.xhtml_ch2fig13).\
    \ Since the array `list` is of integer type, each element of this array occupies\
    \ two bytes. The name of the array contains the starting address of the array,\
    \ i.e. 1001\n\n![Figure 2.13](Images/ch02fig13.png)\n\n**Figure 2.13** The contiguous\
    \ storage allocation with starting address = 1001\n\nConsider the following program\
    \ segment:\n\n![image](Images/pg68-1.png)\n\nOnce the above program segment is\
    \ executed, the output would be as shown below:\n\n![image](Images/pg68-2.png)\n\
    \nWe could have achieved the same output also by the following program segment\
    \ also:\n\n![image](Images/pg68-3.png)\n\nBoth the above given approaches are\
    \ equivalent because of the following equivalence relations:\n\n![image](Images/pg68-4.png)\n\
    \nThe left-side approach is known as pointer method and right side as array indexing\
    \ method. Let us now write a program that prints out a list by array indexing\
    \ method.\n\n![image](Images/pg68-5.png)\n\nThe output of this program is given\
    \ below:\n\n![image](Images/pg68-6.png)\n\nThe above program can also be written\
    \ by pointer method as shown below:\n\n![image](Images/pg69-1.png)\n\nIt may be\
    \ noted in the above program that we have used the term `*(list + i)` to print\
    \ an `i` th element of the array. Let us analyze this term. Since the `list` designates\
    \ the address of zeroth element of the array, we can access its value through\
    \ value at address operator, i.e. `*`. The following terms are equivalent:\n\n\
    ![image](Images/pg69-2.png)\n\nThus, we can refer to the `i` th element of array\
