  trans: "\n其中 `template` 是一个关键字；“<”是标准的左尖括号或小于运算符的符号；`class` 是一个关键字；`ugType` 是用户定义的泛型类型；“>是标准的右尖括号或大于运算符的符号。\n\
    \n用户定义的类型 (`ugType`) 变为泛型类型。现在让我们将第 8.1 节 中的 `exchange()` 函数重写为泛型函数。\n\n![image](img/pg236-2.png)\n\
    \n需要注意的是，我们使用名为 `myType` 的泛型类型来声明泛型函数 `exchange` 中的变量。这个泛型类型将在运行时由程序员发送的任何数据类型替换。因此，模板使用运行时多态性将数据与其类型绑定。\n\
    \n### 示例 1\n编写一个使用泛型函数 `exchange()` 并对各种类型的数据进行测试的程序。\n\n*Solution*：所需的程序所示：\n\
    \n![image](img/pg237-1.png)\n\n程序的输出所示：\n\n![image](img/pg237-2.png)\n\n需要注意的是，泛型函数\
    \ `exchange()` 已经能够与各种类型的数据工作。\n\n### 示例 2\n编写一个名为 `search()` 的函数模板，用于从给定的 *N*\
    \ 个元素的列表中搜索一个元素（泛型类型）。当找到元素时返回 1，否则返回 0。还要编写一个名为 `readList()` 的泛型函数，用于读取包含 *N*\
    \ 个元素的列表。\n\n*Solution*：我们将使用一个泛型类型 *N* 个位置的数组。然而，数组的大小 *N* 和索引 *i* 将声明为整数，因为这些变量是依赖于类型的。\n\
    \n所需的函数所示：\n\n![image](img/pg238-1.png)\n\n### 示例 3\n编写一个菜单驱动的函数 `main()`，用于测试在示例\
    \ 2 中开发的泛型函数处理整数和浮点数值时的工作情况。\n\n*Solution*：所需的函数 `main()` 所示：\n\n![image](img/pg238-2.png)\n\
    \n示例输出所示：\n\n![image](img/pg239-1.png)\n![image](img/pg239-2.png)\n![image](img/pg240-1.png)\n\
    \n## 8.3 泛型类\n\n与函数类似，我们还可以以类模板的形式创建泛型类*类模板*的格式所示：\n\n![image](img/pg240-2.png)\n\
    \n其中 `template` 是一个关键字；“<”是标准的左尖括号或小于运算符的符号；`class` 是一个关键字；`ugType` 是用户定义的泛型类型；“>是标准的右尖括号或大于运算符的符号。\n\
    \n![Note](img/note.png) **Note**：模板声明后紧跟类声明统称为*类模板*。\n\n### 示例 4\n编写一个名为 `stack`\
    \ 的类模板，为泛型类型的数据提供以下服务。\n\n1. 向栈中推入一个元素。\n2. 从栈中弹出一个元素。\n\n*Solution*：所需的类所示：\n\
    \n![image](img/pg240-3.png)\n\n需要注意的是，当泛型类的成员函数在类外声明时，它必须单独作为模板进行定义。定义成员函数的格式所示：\n\
    \n![image](img/pg241-1.png)\n\n![Note](img/note.png) **Note**：`<ugType>` 必须写在一对尖括号\
    \ (< 和 >) 内。\n\n例如，泛型类 `stack` 的 `push()` 函数声明如下所示：\n\n![image](img/pg241-2.png)\n\
    \n![Note](img/note.png) **Note**：通过对所需的对象类型对语句进行限定（或类型转换），可以创建泛型类的对象。泛型类创建对象的格式所示：\n\
    \n![image](img/pg242-1.png)\n\n其中 `class name` 是类的名称；“<”是标准的左尖括号或小于运算符的符号；`typeOb`\
    \ 是所需对象的数据类型；“>是标准的右尖括号或大于运算符的符号；`object name` 是要创建对象的名称。\n\n例如，可以通过以下语句创建一个名为\
    \ `chOb` 的类型为 `stack` 且可处理 char 类型数据的对象：\n\n![image](img/pg242-2.png)\n\n请注意，对所需的对象进行类型转换时尖括号是必要的。类名与尖括号中的类型相结合（即\
    \ `stack <char>`）被称为*模板类*。\n\n### 示例 5\n编写函数 `main`，以测试将值 70 和 23.54 分别推入和从整数栈和浮点栈弹出。\n\
    \n*Solution*：所需的函数 `main()` 所示：\n\n![image](img/pg242-3.png)\n\n上述程序的输出所示：\n\n\
    ![image](img/pg243-1.png)\n\n需要注意的是，同一个类被用于实例化两个不同的对象，分别处理整数和浮点型类型的数据。因此，泛型类也称为**参数化类**。相同的泛型代码在不同对象之间共享。\n\
    \n## 8.4 多个参数的模板\n\n模板可以有多个参数，如下所示：\n\n`template <class Type1, class Type2>`\n\
    \n注意的是使用了两个类型 `T` 和 `U`。考虑以下函数模板：\n\n```cpp\ntemplate <class T, class U>\nT max(T\
    \ a, U b) {\n    return (a > b) ? a : b;\n}\n```\n\n### 示例 6\n编写一个完整的程序，使用上面开发的泛型函数\
    \ `test()` 并对各种类型组合进行测试。\n\n*Solution*：完整的程序所示：\n\n![image](img/pg244-1.png)\n\
    \n程序的输出所示：\n\n![image](img/pg244-2.png)\n\n需要注意的是，泛型函数能够与各种类型的数据工作。\n\n## 8.5\
    \ 总结\n\n泛型函数和类可以接受不同类型的参数。它允许共享代码，以减少工作、提高生产力并减小程序体积。程序的代码很容易地分为两部分：类型相关和类型无关。泛型类型在运行时由提供给泛型函数或类的类型替换。模板声明后紧跟类声明统称为类模板。类名与尖括号中的类型相结合被称为模板类。\n\
    \n![Question](img/question.png) 单项选择题\n\n1. 泛型函数增加了：\n   a. 生产力\n   b. 程序长度\n\
    \   c. 打字工作\n\n2. C++ 中的模板用于创建 _______ 函数\n   a. 虚\n   b. 泛型\n   c. 递归\n   d.\
    \ 友\n\n3. 模板使用 _____ 多态性将数据与其类型绑定\n.a. 编译时\n   b. 运行时\n\n4. 泛型类被称为：\n   a. 基类\n\
    \   b. 派生类\n   c. 参数化类\n   d. 友类\n\n5. 模板帮助我们在结构相似的族或函数族之间共享代码\n   a. 不同\n   b.\
    \ 优秀\n   c. 冲突\n   d. 相似\n\n## 答案\n\n1. a\n2. b\n3. b\n4. c\n5. d\n\n![Exercise](img/exe.png)\
    \ 练习\n\n1. 什么是泛型函数？\n2. C++ 中如何实现“代码共享”？\n"
- fmt: "\n3. What is a template and how it is defined?\n\n4. Write a template called\
    \ `areaSq()` that computes and returns the area of a square. It takes an argument\
    \ called `side` of generic type. Test this function for a given side of type:\
    \ `int`, `float`, `double`.\n\n5. Write a generic function called `sort()` that\
    \ sorts a list of given *N* data items of generic type into ascending order.\n\
    \n6. Write a function `main()` that tests the above function `sort()` through\
    \ a menu driven interface.\n\n7. Differentiate between `class template` and `template\
    \ class`.\n\n8. Write a `class template` called `queue` that offers the following\
    \ services for generic type of data.\n    1. add an element on a queue\n    2.\
    \ remove an element from a queue\n\n9. Write a template function called `searchTab()`.\
    \ It maintains a symbol table having following format:\n\n    | Symbol | Value\
    \ |\n    | | |\n\nThe symbol is an array of character types whereas the value\
    \ can be of any one of the available type for a particular table, i.e. `int`,\
    \ `float`, `char`, etc.\n\n## 10. Write a function `main()` that tests the above\
    \ function `searchTab()` for a symbol of type `int`.\n\n11. Write a function `main()`\
    \ that tests the above function `searchTab()` for a symbol of type `float`.\n\n\
    ## 9 OPERATOR OVERLOADING\n\n### 9.1 INTRODUCTION\n\nLet us consider a situation\
    \ where we have a class called `length` which represents the length of an item\
    \ (say cloth) in feet and inches. Its class diagram is shown in [Fig. 9.1](#chapter_09.xhtml_ch9fig1).\n\
    \n![Figure 9.1](Images/ch09-fig01.png)\n\n**Figure 9.1** *A class called ‘length’*\n\
    \nNow if we desire to add two objects of this class type, one of the options is\
    \ to use a friend function (say `add()`) as shown below:\n\n![image](Images/pg247-1.png)\n\
    \nThe following `main()` function tests the above given class.\n\n![image](Images/pg248-1.png)\n\
    \nA sample ...\n\n## 10 FILE HANDLING IN C++\n\n### 10.1 FILE CONCEPTS\n\nWe know\
    \ that every program or sub-program consists of two major components: algorithm\
    \ and data structures. The algorithm takes care of the rules and procedures required\
    \ for solving the problem and the data structures contain the data. The data is\
    \ manipulated by the procedures for achieving the goals of the program as shown\
    \ in [Fig. 10.1](#chapter_10.xhtml_ch10fig1).\n\n![Figure 10.1](Images/ch10-fig01.png)\n\
    \n**Figure 10.1** *The structure of a program or sub-program***\n\nIn object-oriented\
    \ programming (OOP), an object is central to the ideology. The object has two\
    \ components: states and behaviours. The states and behaviours model the data\
    \ and procedures, respectively. Each behaviour is implemented as a subprogram\
    \ having arrangement similar to that in [Fig. 10.1](#chapter_10.xhtml_ch10fig1).\n\
    \nA data structure is volatile by nature in the sense that its contents are lost\
    \ as soon as the execution of the program is over. Similarly, an object also loses\
    \ its states after the program is over. If we want to permanently store our data\
    \ or want to create persistent objects then it becomes necessary to store the\
    \ same in a special data structure called file. The file can be stored on a second\
    \ storage media such as hard disk. In fact, vary large data is always stored in\
    \ a file.\n\nNow, any thing stored on a permanent storage such as hard disk is\
    \ called a file. For example, MBR (master boot record), FAT (file allocation table),\
    \ partition table, programs, data files, etc. are examples of files.\n\nLet us\
    \ consider the information recorded in [Fig. 10.2](#chapter_10.xhtml_ch10fig2).\n\
    \n![Figure 10.2](Images/ch10-fig02.png)\n\n**Figure 10.2** *Information about\
    \ students*\n\nEach entry into the table shown in [Fig. 10.2](#chapter_10.xhtml_ch10fig2)\
    \ is a set of three data items: Roll number, Name and Marks. The first entry states\
    \ that the Roll number and total marks of a student named as Ajay are 001 and\
    \ 50, respectively. Similarly the second entry relates to a student named as Ram\
    \ whose Roll number is 002 and total marks equal to 70. Each entry of the table\
    \ is also known as a record of a student. The term *record* can be defined as\
    \ *a set of related data items of a particular entity such as a person, machine,\
    \ place, or operation. An individual data item within a record is known as a *field*.\
    \ When a field assumes unique values then it is called a *key-field*. For example,\
    \ ‘Roll’ is the key-field in the record of the student as shown in [Fig. 10.3](#chapter_10.xhtml_ch10fig3).\n\
    \n![Figure 10.3](Images/ch10-fig03.png)\n\n**Figure 10.3** *Structure of a record*\n\
    \nThus, the record of a student is made up of following three fields:\n1. Roll\
    \ number\n2. Name\n3. Marks\n\nLet us assume that a particular class has 30 students.\
    \ Now, the entire information of the class consisting of 30 records is referred\
    \ to as a file. The arrangement of records is shown in [Fig. 10.4](#chapter_10.xhtml_ch10fig4).\n\
    \n![Figure 10.4](Images/ch10-fig04.png)\n\n**Figure 10.4** *File: collection of\
    \ records*\n\nA *file* can be precisely defined as *a logical collection of records\
    \ where each record consists of items*. The records in a file can be arranged\
    \ in the following ways:\n1. **Ascending/descending order**: the records in the\
    \ file can be arranged according to ascending or descending order of key field.\n\
    2. **Alphabetical order**: if the key field is of alphabetic type then the records\
    \ are arranged in alphabetical order.\n3. **Chronological order**: in this type\
    \ of order, the records are stored according to dates or events.\n\nWhen the data\
    \ of a file is stored in the form of readable and printable characters then the\
    \ file is known as a text file. It is a special type of file that does not contain\
    \ records but only characters. On the other hand, if a file contains non-readable\
    \ characters in binary code then the file is called as a binary file. For instance,\
    \ the program files created by an editor are stored as text files whereas the\
    \ executable files generated by a compiler are stored as binary files.\n\nIn the\
    \ following sections, an introduction to files supported by C++ is given.\n\n\
    ### 10.2 FILES AND STREAMS\n\nIn C++, a stream is a data flow from a source to\
    \ a sink. The sources and sinks can be any of the input/output (I/O) devices or\
    \ files. For input and output, there are two different streams called input stream\
    \ and output stream as shown in [Fig. 1.2](#chapter_01.xhtml_ch1fig2). We have\
    \ already used the following unformatted I/O streams in our previous programs:\n\
    \n| Stream | Description |\n| | |\n| cin | Standard input stream |\n| cout | Standard\
    \ output stream |\n| cerr | Standard error stream |\n\nThe standard source and\
    \ sink are keyboard and monitor screen, respectively. These unformatted streams\
    \ are initialized whenever the header file `<iostream.h>` is included in a program.\
    \ However, we need to use the operators `<<` and `>>` to implement these streams.\n\
    \nThe important stream classes required for file I/O are `ifstream`, `ofstream`\
    \ and `fstream`. A brief discussion on these streams is given below:\n\n*ifstream*:\
    \ It is the input file stream class. Its member function `open()` associates the\
    \ stream with a specified file in an input mode. For example, if it is desired\
    \ to open a file called “xyz.dat” for input then the following statements can\
    \ be used.\n\n![image](Images/pg265-1.png)\n\nThe above declaration means creating\
    \ an input stream called `myfile` and associating it with the file called `xyz.dat`.\
    \ In addition to `open()`, `ifstream` class inherits the following functions from\
    \ `istream` class.\n\n```\n(i) `get()`\n(ii) `getline()`\n(iii) `read()`\n(iv)\
    \ `seekg()`\n(v) `tellg()`\n```\n"
