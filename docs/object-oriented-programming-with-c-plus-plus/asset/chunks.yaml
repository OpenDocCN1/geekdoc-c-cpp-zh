    ### 10.5.1 在文件中存储对象


    通常情况下，对象的内容一旦超出范围或程序结束就会丢失。如果对象包含的信息非常重要，我们必须尝试将其保存到辅助存储（如硬盘）中，以便需要时使用。事实上，类似于记录，对象也可以写入文件并从文件实例化。记住数据的对象被称为持久性对象。


    因此，持久对象以两种形式存在：主内存（即 RAM）和辅助内存（如硬盘）。对象的内存副本代表对象在该时刻的状态，磁盘副本代表对象的旧状态。


    程序可以在主内存中对对象进行修改，并在超出作用范围之前将对象写入磁盘文件。以下示例使用学生对象来说明上述概念。


