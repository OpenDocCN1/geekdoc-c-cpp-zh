    #### 6.2.4 Constructors with Default Arguments


    Similar to a normal function, a constructor can also have default values. For
    example, we can rewrite the class as shown below:


    ![page193-1.png](Images/page193-1.png)


    **Note**: A default argument `Sz = 20` has been specified in the constructor above.
    Now, an object of class address can be created without specifying the argument.
    The default arguments must be trailing.


    #### 6.2.5 Rules for Constructor Definition


    The rules for constructor definition and its usages are:


    1.  The name of the constructor must be same as that of the class.

    2.  A constructor can have a parameter list.

    3.  The constructor functions can be overloaded.

    4.  A constructor with no arguments is the default constructor.

    5.  If there is no constructor in a class, a default constructor is generated
    by the compiler.

    6.  The constructor is executed automatically.

    7.  The popular abbreviation for constructor is `ctor`.


    #### 6.3 DESTRUCTORS


    A destructor is an inverse of a constructor in the sense that it removes the memory
    of an object which was allocated by the constructor during the creation of the
    object. It carries the same name as the class, but with a tilde (~) as prefix
    as shown below:


    ![page194-1.png](Images/page194-1.png)


    The rules for destructor definition and usage are


    1.  The destructor has the same name as that of the class prefixed by the tilde
    character `~`.

    2.  The destructor cannot have arguments.

    3.  It has no return type, not even void type.

    4.  Destructors cannot be overloaded, i.e. there can be only one destructor in
    a class.

    5.  If there is no destructor in a class, a default destructor is generated by
    the compiler.

    6.  The destructor is executed automatically when the control reaches at the end
    of class scope.

    7.  The popular abbreviation for destructor is `dtor*.

