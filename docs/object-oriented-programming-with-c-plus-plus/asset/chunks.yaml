    \ a file.\n\nNow, any thing stored on a permanent storage such as hard disk is\
    \ called a file. For example, MBR (master boot record), FAT (file allocation table),\
    \ partition table, programs, data files, etc. are examples of files.\n\nLet us\
    \ consider the information recorded in [Fig. 10.2](#chapter_10.xhtml_ch10fig2).\n\
    \n![Figure 10.2](Images/ch10-fig02.png)\n\n**Figure 10.2** *Information about\
    \ students*\n\nEach entry into the table shown in [Fig. 10.2](#chapter_10.xhtml_ch10fig2)\
    \ is a set of three data items: Roll number, Name and Marks. The first entry states\
    \ that the Roll number and total marks of a student named as Ajay are 001 and\
    \ 50, respectively. Similarly the second entry relates to a student named as Ram\
    \ whose Roll number is 002 and total marks equal to 70\\. Each entry of the table\
    \ is also known as a record of a student. The term *record* can be defined as\
    \ *a set of related data items of a particular entity such as a person, machine,\
    \ place, or operation. An individual data item within a record is known as a*\
    \ field*.* When a field assumes unique values then it is called a *key-field*.\
    \ For example, ‘Roll’ is the key-field in the record of the student as shown in\
    \ [Fig. 10.3](#chapter_10.xhtml_ch10fig3).\n\n![Figure 10.3](Images/ch10-fig03.png)\n\
    \n**Figure 10.3** *Structure of a record*\n\nThus, the record of a student is\
    \ made up of following three fields:\n\n1.  Roll number\n\n2.  Name\n\n3.  Marks\n\
    \nLet us assume that a particular class has 30 students. Now, the entire information\
    \ of the class consisting of 30 records is referred to as a file. The arrangement\
    \ of records in the file is shown in [Fig. 10.4](#chapter_10.xhtml_ch10fig4).\n\
    \n![Figure 10.4](Images/ch10-fig04.png)\n\n**Figure 10.4** *File: collection of\
    \ records*\n\nA *file* can be precisely defined as *a logical collection of records\
    \ where each record consists of a number of items known as fields*. The records\
    \ in a file can be arranged in the following three ways:\n\n1.  *Ascending/descending\
    \ order*: the records in the file can be arranged according to ascending or descending\
    \ order of a key field. For example, the records in the file of [Fig. 10.4](#chapter_10.xhtml_ch10fig4)\
    \ are in ascending order of its Roll field.\n\n2.  *Alphabetical order*: if the\
    \ key field is of alphabetic type then the records are arranged in alphabetical\
    \ order.\n\n3.  *Chronological order*: in this type of order, the records are\
    \ stored in the order of their occurrence, i.e. arranged according to dates or\
    \ events. If the key-field is a date, i.e. date of birth, date of joining, etc.\
    \ then this type of arrangement is used.\n\nWhen the data of a file is stored\
    \ in the form of readable and printable characters then the file is known as a\
    \ **text file**. It is a special type of file that does not contain records but\
    \ only characters. On the other hand, if a file contains non-readable characters\
    \ in binary code then the file is called as a **binary file**. For instance, the\
    \ program files created by an editor are stored as text files whereas the executable\
    \ files generated by a compiler are stored as binary files.\n\nIn the following\
    \ sections, an introduction to files supported by C++ is given.\n\n##### 10.2\
    \ FILES AND STREAMS\n\nIn C++, a stream is a data flow from a source to a sink.\
    \ The sources and sinks can be any of the input/output (I/O) devices or files.\
    \ For input and output, there are two different streams called input stream and\
    \ output stream as shown in [Fig. 1.2](#chapter_01.xhtml_ch1fig2). We have already\
    \ used the following unformatted I/O streams in our previous programs:\n\n| Stream\
    \ | Description |\n\n| cin | Standard input stream |\n\n| cout | Standard output\
    \ stream |\n\n| cerr | Standard error stream |\n\nThe standard source and sink\
    \ are keyboard and monitor screen, respectively. These unformatted streams are\
    \ initialized whenever the header file <iostream.h> is included in a program.\
    \ However, we need to use the operators ‘<<’ and ‘>>’ to implement these streams.\n\
    \nThe important stream classes required for file I/O are ifstream, ofstream and\
    \ fstream. A brief discussion on these streams is given below:\n\n*ifstream*:\
    \ It is the input file stream class. Its member function open( ) associates the\
    \ stream with a specified file in an input mode. For example, if it is desired\
    \ to open a file called “xyz. dat” for input then the following statements can\
    \ be used.\n\n![image](Images/pg265-1.png)\n\nThe above declaration means creating\
    \ an input stream called myfile and associating it with the file called “xyz.dat”.\
    \ In addition to open(), ifstream class inherits the following functions from\
    \ istream class.\n\n(i) get( ); (ii) getline( ); (iii) read( ); (iv) seekg( );\
    \ (iv) tellg( )"
