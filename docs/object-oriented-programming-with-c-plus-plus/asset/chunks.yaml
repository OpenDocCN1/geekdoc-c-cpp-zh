    The usage of interaction diagrams can be summarized as given below:


    1. Model the dynamic behaviour of the system.

    2. Represent the message flow of the system.

    3. Represent the interactions among the objects.

    4. Show the object organization of the system.

    5. Show the control flow by structural organization (collaboration diagram).

    6. Show the control flow by time sequence (sequence diagram).


    ### 12.4.2 State Chart Diagrams


    In a dynamic environment, an object moves from one state to another after the
    occurrence of an event. The event could be a message, timeout or a signal sent
    by another object. For example, when the object on the front of a queue gets served
    and leaves the serving window, the server gives a signal to the object next in
    the queue to come to the front. This type of dynamic behavior of objects is represented
    by a state chart diagram. It depicts the sequence of states that an object passes
    through during its lifetime in response to messages it receives from other objects.
    A state chart diagram is a directed graph of nodes and edges. The nodes represent
    states of the objects and the arrows depict transitions among states as shown
    in [Fig. 12.18](#chapter_12.xhtml_ch12fig18).


    ![Figure 12.18](Images/ch12-fig18.png)


    **Figure 12.18** *State chart diagram*


    Therefore, the following needs to be identified before drawing the state chart
    diagram:


    1. Identify the objects.

    2. Identify the states.

    3. Identify the transitions and the related events.


    Consider the state chart diagram shown in [Fig. 12.19](#chapter_12.xhtml_ch12fig19).
    It illustrates that initially the teacher object is in ‘wait’ state. It polls
    the status of the students. If the students are present then the teacher goes
    to ‘teach’ state else the teacher goes back to the ‘wait’ state. The teacher goes
    to ‘stop’ state from ‘teach’ state as soon as the bell rings.


    ![Figure 12.19](Images/ch12-fig19.png)


    **Figure 12.19** *State chart showing states and transitions*


    It may be noted that the conditions that govern the transitions have been placed
    between the square brackets. The start state is represented by a solid ball whereas
    the stop state is shown by a solid ball within a circle. It may further be noted
    that a state chart represents a reactive system wherein the participating objects
    react to external or internal events. Therefore the objects are also called as
    *reactive objects*.


    If it is needed to branch to many states depending upon different values of conditions
    then we can use a *choice point* (a circle) as a junction from where the bifurcation
    begins. A condition is also called a *guard*.


    Let us now modify the state chart of [Fig. 12.19](#chapter_12.xhtml_ch12fig19)
    to include the guard that the teacher goes to the stop state after waiting for
    10 minutes for the students. The modified state chart is given in [Fig. 12.20](#chapter_12.xhtml_ch12fig20).


    ![Figure 12.20](Images/ch12-fig20.png)


    **Figure 12.20** *Modified state chart diagram*


    The usage of state chart diagrams can be summarized as given below:


    1. To represent the states of objects.

    2. To represent a reactive system.

    3. To represent the events responsible for transitions of objects from one state
    to another.


    ### 12.4.3 Activity Diagrams


    An internal action of an object at a particular state is called an activity. Therefore,
    the activity diagram represents a flow of work inside a use case, an algorithm,
    a protocol or between objects. The workflow itself is represented as a series
    of actions. The workflow can be sequential, branched or parallel.


    The following needs are to be identified before drawing the activity diagram:


    1. Activities

    2. Association

    3. Conditions

    4. Constraints


    An activity diagram is an extension of a flow chart. It is a graph consisting
    of activities and transitions. An activity is represented as rectangle with round
    corners and is labeled with the action it performs. As soon as the action is complete,
    the work flows to the next activity along the transition as shown in [Fig. 12.21](#chapter_12.xhtml_ch12fig21).
    For instance, as soon as a student is admitted, he/she is assigned a course.


    ![Figure 12.21](Images/ch12-fig21.png)


    **Figure 12.21** *An activity diagram*


