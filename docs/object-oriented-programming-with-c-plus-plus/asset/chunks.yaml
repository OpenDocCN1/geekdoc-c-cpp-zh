  raw: 'From [Fig. 2.1](#chapter_02.xhtml_ch2fig1), it may be observed that *x* is
    the name associated by the compiler to a location in the memory of the computer.
    Let us assume that, at the time of execution, the physical address of this memory
    location (called *x* ) is 2712\. Now, a point worth noting is that this memory
    location is viewed by the programmer as variable *x* and by the operating system
    as an address 2712. The address of the variable *x* can be obtained by ‘&’, an
    address of the operator. This operator when applied to a variable, gives the physical
    memory address of the variable. Thus, &*x* will provide the address 2712. Consider
    the following program segment:


    ![image](Images/pg60-1.png)


    The output of the above program segment would be as shown below:


    ![image](Images/pg60-2.png)


    The contents of variable *x* (memory location 2712) are shown in [Fig. 2.2](#chapter_02.xhtml_ch2fig2).


    ![Figure 2.2](Images/ch02fig02.png)


    **Figure 2.2** *The contents of variable x*


    It may be noted here that the value of address of *x* (i.e. 2712) is assumed,
    and the actual value is ‘*machine and execution*’ time dependent.


    #### 2.1.2 The * Operator


    The * is an indirection operator or value at address operator. In simple words,
    we can say that if the address of a variable is known, then the * operator provides
    the contents of the variable. Consider the following program segment:


    ![image](Images/pg60-3.png)


    The output of the above program segment would be as shown below:


    ![image](Images/pg61-1.png)


    Consider the following program:


    ![image](Images/pg61-2.png)


    The output would be 50 because * and & operators complement each other; therefore
    the 50 is stored in the variable called *a*.


    ##### 2.2 POINTER VARIABLES


    An address of a variable can be stored in a special variable called **pointer**
    variable. A pointer variable contains the address of another variable. Let us
    assume that *y* is such a variable. Now, the address of variable *x* can be assigned
    to *y* by the statement: *y* = &*x*. The effect of this statement is shown in
    [Fig. 2.3](#chapter_02.xhtml_ch2fig3).


    ![Figure 2.3](Images/ch02fig03.png)


    **Figure 2.3** *The address of x is being stored in pointer variable* y


    From [Fig. 2.3](#chapter_02.xhtml_ch2fig3), it is clear that *y* is the variable
    that contains the address (i.e. 2712) of another variable *x*, whereas, the address
    of *y* itself is 1232 (assumed value). In other words, we can say that *y* is
    a pointer to variable *x*. See [Fig. 2.4](#chapter_02.xhtml_ch2fig4).


    ![Figure 2.4](Images/ch02fig04.png)


    **Figure 2.4** y *is a pointer to* x


    A pointer variable *y* can be declared in C++ as shown below:


    int **y;*


    The above declaration means that *y* is a pointer to a variable of type int. Similarly,
    consider the following declaration:


    ![image](Images/pg62-1.png)


    The above declaration means that *p* is a pointer to a variable of type char.


    Consider the following program segment:


    ![image](Images/pg62-2.png)


    The output of the above program segment would be as shown below. We have shown
    only the assumed addresses as per [Fig. 2.3](#chapter_02.xhtml_ch2fig3).


    ![image](Images/pg62-3.png)


    Let us now, consider the following statements:


    ![image](Images/pg62-4.png)


    The first statement declares val to be a variable of type float and initializes
    it by value 35.67\. The second statement declares pt to be pointer to a variable
    of type float. Please notice that pt can point to a variable of type float, but
    it is currently not pointing to any variable as shown in [Fig. 2.5](#chapter_02.xhtml_ch2fig5).


    ![Figure 2.5](Images/ch02fig05.png)


    **Figure 2.5** *The pointer pt is not pointing to any variable*


    The pointer pt can point to the variable val by assigning the address of val to
    pt as shown below.


    pt = &val;


    Once the above statement is executed, the pointer pt gets the address of val,
    and we can say that logically pt points to the variable val as shown in [Fig.
    2.6](#chapter_02.xhtml_ch2fig6).


    ![Figure 2.6](Images/ch02fig06.png)


    **Figure 2.6** *The pointer pt pointing to variable val*


    However, one must keep in mind that the arrow is for illustration sake. Actually,
    the pointer pt contains the address of val. The address is an integer that is
    not a simple value but a reference to a location in the memory.


    Examples of some valid pointer declarations are:


    1.  int **p* ;


    2.  char **i*, **k* ;


    3.  float *pt;


    4.  int **ptr;


    The example (iv) means the ptr is a pointer to a location which itself is a pointer
    to a variable of type integer.


    It may be noted here that a pointer can also be incremented to point to an immediately
    next location of its type. For example, if the contents of a pointer *p* of type
    integer are 5224, then the content of *p* ++ will be 5226 instead of 5225 (see
    [Fig. 2.7](#chapter_02.xhtml_ch2fig7)). The reason being an int is always of 2
    bytes size and therefore stored in two memory locations as shown in [Fig. 2.7](#chapter_02.xhtml_ch2fig7).
    The amount of storage taken by the various types of data is tabulated in [Table
    2.1](#chapter_02.xhtml_ch2tab1)


    ![Figure 2.7](Images/ch02fig07.png)


    **Figure 2.7** *The variable of type int occupies two bytes*


    **Table 2.1 Amount of Storage Taken by Data Types**


    | Data Type | Amount of Storage |


    | character | 1 byte |


    | integer | 2 byte |


    | Float | 4 byte |


    | Long | 4 byte |


    | Double | 8 byte |


    Thus, a pointer of float type will point to an address of 4 bytes of locations,
    and therefore increment to this pointer will increment its contents by 4 locations.
    It may be further noted more than one pointer can point to the same location.
    Consider the following program segment:


    ![image](Images/pg64-1.png)


    The following statement


    *p*1=&  *x*;


    makes the pointer *p*1 to point to variable *x* as shown in [Fig. 2.8](#chapter_02.xhtml_ch2fig8).


    ![Figure 2.8](Images/ch02fig08.png)


    **Figure 2.8** *Pointer p1 points to variable x*


    The following statement


    *p*2 = *p*1


    makes *p*2 to point to the same location, which is being pointed by *p*1 as shown
    in [Fig. 2.9](#chapter_02.xhtml_ch2fig9).


    ![Figure 2.9](Images/ch02fig09.png)


    **Figure 2.9** *Pointer p1 and p2 pointing to x*


    The contents of variable *x* are now reachable by both the pointers *p*1 and *p*2\.
    Thus, two or more entities can cooperatively share a single memory structure with
    the help of pointers. In fact, this technique can be used to provide efficient
    communication between different parts of a program.


    The pointers can be used for a variety of purposes in a program. Some of them
    are given below.


    1.  To pass address of variables from one function to another


    2.  To return more than one value from a function to the calling function


    3.  For the creation of linked structures such as linked lists and trees.


    Consider the following program:


    ![image](Images/pg65-1.png)


    The output would be 51 because the contents pointed by pointer *j* are being incremented
    before the display.


    ##### **Example 1**. *Write a program that reads from keyboard two variables*
    x *and* y *of type integer. It prints the exchanged contents of these variables
    with the help of pointers without altering the variables.*


    *Solution:* We will use two pointers *p*1 and *p*2 for variables *x* and *y*.
    A third pointer *p*3 will be used as a temporary pointer for the exchange of pointers
    *p*1 and *p*2\. The scheme is shown in [Fig. 2.10](#chapter_02.xhtml_ch2fig10).


    The program is given below:


    ![image](Images/pg65-2.png)


    A sample output is given below:


    ![image](Images/pg66-1.png)


    ![Note](Images/note.png)**Note**: The output shows the exchanged values because
    of exchange of pointers (see [Fig. 2.10](#chapter_02.xhtml_ch2fig10)), whereas
    the contents of *x* and *y* have remained unaltered.


    ![Figure 2.10](Images/ch02fig10.png)


    **Figure 2.10** *Exchange of contents of variables by exchanging pointers*


    #### 2.2.1 Dangling Pointers'
