    从图 2.3 可以清楚看出，`y` 是包含另一个变量 `x` 地址（即 2712）的变量，而 `y` 本身的地址是 1232（假设值）。换句话说，我们可以说
    `y` 是指向变量 `x` 的指针。另见图 2.4。


    ```

    ![Figure 2.4](img/ch02fig04.png)

    ```


    **图 2.4** y *是指向 x 的指针*


