  trans: "\n\n需要注意的是，对象 `sOb1` 提供了学生数据。它的成绩经过了计算并存储在一个名为 `student.dat` 的文件中。随后，从文件中将存储的对象读取到另一个对象\
    \ `sOb2` 中。从输出可以验证内容已保持完好。\n\n通过以上内容可以发现，这种安排可以将对象存储在文件中，以便后续阶段使用。\n\n### 示例 8\
    \ 编写一个程序，打开一个由用户提供（例如 `studFile.dat`）的文件。该程序向文件中写入 `N`（假设为 5）个学生类型的对象。\n\n*Solution*：所需的程序所示：\n\
    \n![image](img/pg282-2.png)\n\n![Note](img/note.png) **Note**：在本节中，仅对持久化对象进行了介绍。要使那些派生类对象且包含指针的对象实现持久化，还需要付出额外的努力。\n\
    \n### 10.6 检测文件末尾\n\n对于文件而言，到为止我们一直在读取或写入特定数量的字符或对象。在读取文件时，可能会出现这种情况：我们不知道要从文件中读取多少对象，即我们不知道文件将在何时结束？检测`文件末尾`（`eof`）的一种简单方法是在\
    \ `while` 循环中测试流，如下所示：\n\n![image](img/pg284-1.png)\n\n只要没有到达文件末尾，条件 `<stream>`\
    \ 就会为 1，一旦检测到文件末尾，它将立即返回 0。简单来说，我们可以说一旦到达 `<stream>` 的 `eof`，`while` 循环就会终止。考虑以下程序段\n\
    \n![image](img/pg284-2.png)\n\n该程序中的 `while` 循环将执行到达到 `xfile` 的 `eof`。下面的示例说明了检测\
    \ `eof` 的用法。\n\n### 示例 9 编写一个程序，打开一个在 示例 8 中创建的文件（`studFile.dat`）。该程序从文件中读取对象直到文件末尾。\n\
    \n*Solution*：所需的程序所示：\n\n![image](img/pg285-1.png)\n\n输出如下：\n\n![image](img/pg286-1.png)\n\
    \n也可以通过名为 `eof()` 的函数检测文件末尾。该函数在检测到文件末尾时返回非零值，否则返回零。其用法示例在以下程序段中：\n\n![image](img/pg287-1.png)\n\
    \n### 示例 10 修改 示例 9 中的 `main()` 函数，使其使用 `eof()` 函数检测文件末尾。\n\n*Solution*：所需的修改后的\
    \ `main()` 函数所示：\n\n![image](img/pg287-2.png)\n\n### 示例 11 编写一个交互式菜单驱动的程序，创建一个文本文件（例如\
    \ `input.dat`）然后显示其内容。该程序还会创建另一个文本文件（例如 `output.dat`）作为前者的拷贝。然而，在复制时，它会将所有字符转换为等效的大写字符。\n\
    \n*Solution*：我们将使用 `toupper()` 函数来转换从原始文件中读取的字符。所需的程序所示：\n\n![image](img/pg287-3.png)\n\
    \n输出如下：\n\n![image](img/pg289-1.png)\n\n### 10.7 总结\n\n存储在永久存储设备上的任何内容都称为 `file`（文件）。一组相关的数据项称为\
    \ `record`（记录）。记录的最小单元称为 `field`（字段）。键字段用于唯一标识记录。文件是记录的逻辑集合。在顺序文件中，记录按照它们到达的顺序存储，而不考虑键字段。相反，在顺序文件中，记录按照键字段的特定顺序写入。键字段也称为\
    \ `primary key`（主键）。`ifstream` 和 `ofstream` 分别是输入流和输出流。能够记住其数据和信息的对象被称为 `persistent`（持久化，注：此处应为\
    \ persistent）对象。`eof()` 函数在检测到文件末尾时返回 0。打开的文件在使用后必须关闭。\n\n### ![Question](img/question.png)单选题\n\
    \n1. 一个程序由两个主要部分组成：算法和\n    1. 逻辑\n    2. 代码\n    3. 数据结构\n    4. 输出\n2. 一个对象有两个部分：状态和\n\
    \    1. 抽象\n    2. 行为\n    3. 封装\n    4. 变量\n3. 存储在永久存储设备上的任何内容称为：\n    1. 文件\n\
    \    2. 数据\n    3. 信息\n    4. 对象\n4. 特定实体的一组相关数据项称为：\n    1. 记录\n    2. 文件\n \
    \   3. 数据\n    4. 字段\n5. 具有唯一值的字段称为：\n    1. 主字段\n    2. 局部字段\n    3. 全局字段\n \
    \   4. 键字段\n6. 记录的逻辑集合称为：\n    1. 堆\n    2. 组\n    3. 文件\n    4. 类\n7. 支持输入的流称为：\n\
    \    1. ifstream\n    2. fstream\n    3. ofstream\n    4. iostream\n8. 文件可以通过\
    \ ______ 构造函数打开\n    1. 拷贝\n    2. 默认\n    3. 文件\n    4. 对象\n9. `read()` 和 `write()`\
    \ 函数用于读取和写入\n    1. 数据\n    2. 文件\n    3. 对象\n    4. 信息\n10. 对象代表其：\n    1. 当前状态\n\
    \    2. 旧状态\n\n### 答案\n1. c\n2. b\n3. a\n4. a\n5. d\n6. c\n7. b\n8. b\n9. c\n\
    10. a\n\n### ![Exercise](img/exe.png)练习题\n\n1. 定义：`field`（字段）、`record`（记录）和 `file`（文件）。\n\
    2. 记录可以在哪些方式上排列？\n3. 关于文件和流之间的关系写一段说明。\n4. 打开文件的不同方法有哪些？\n5. 区分 `ifstream` 的 `get()`\
    \ 和 `getline()` 函数。\n6. 如何检测文件末尾？\n7. 编写一个程序统计文件中记录的数量。\n8. 为包含以下文件的给出适当声明：\n\
    \    name: 20 个字符\n    empId: 整数\n    netSal: 浮点数\n9. 为此问题选择合适的类型。\n10. 编写一个程序统计某个字母在文本文件中出现的次数。\n\
    11. 编写一个程序在给定文件中搜索与输入 `empId` 等的记录。文件的结构如第 8 题所示。\n12. 编写一个程序读取名为 document 的文本文件并生成文本中字母出现的频率表。输出应显示如下：![image](img/pg291-1.png)\n\
    13. 产品记录如下：\n    ![image](img/pg291-2.png)\n    为字段选择适当的数据类型。编写一个程序读取此类记录的文件并按以下格式打印：\n\
    \    ![image](img/pg291-3.png)\n14. 假设名为 `book` 的文本文件已经写入了一些文本，写一个名为 `noVowel()`\
    \ 的函数，该函数读取 `book` 文件并创建一个名为 `newBook` 的新文件，该文件仅包含 `book` 文件中不以大写元音开头的单词（即不以'A','E','I','O','U'\
    \ 开头）。例如，如果 `book` 文件包含：“One and Only One”。那么 `newBook` 文件应包含：“and”。\n15. `eof`\
    \ 是什么？解释其效用。\n\n"
- fmt: "\n# EXCEPTION HANDLING\n\n## 11.1 INTRODUCTION\n\nWhen a teacher is in a class,\
    \ his/her lecture can be disrupted by either of the following two events:\n\n\
    1. Somebody from outside the class `interrupts` the lecture by knocking on the\
    \ door. This event is an `asynchronous` event because the teacher has nothing\
    \ to do with this disruption. At his/her convenience, the teacher suspends his/her\
    \ lecture and listens to what the visitor has to say.\n\n   This is a situation\
    \ similar to a device interrupting the CPU for seeking a particular service. The\
    \ CPU suspends the execution of the current program, saves its context, and jumps\
    \ to an interrupt service routine.\n\n   There is no specific time for the interrupt\
    \ to occur. The CPU need not handle the interrupt immediately but only when ...\n\
    \n# 12 INTRODUCTION TO UML\n\n## 12.1 INTRODUCTION TO UML\n\nIn order to understand\
    \ a complex problem or system, we need to represent it in a simple way called\
    \ ‘model’. For example, when a large apartment building in a housing society is\
    \ built, first its plan is drawn by the architect on a paper and then a small\
    \ prototype is prepared. When all the stake holders (builder, clients, etc.) agree\
    \ on the plan and the looks of the prototype, the project gets approved for construction.\
    \ The prototype is nothing but the model of the proposed building. Similarly,\
    \ when software is to be constructed, its model needs to be prepared.\n\nA model\
    \ can be precisely defined as `a hypothetical description of a complex entity\
    \ or process, constructed to understand a problem or system`.\n\nOnce the model\
    \ is in place, it can be modified for improvement or approved for final construction.\
    \ However, we need to have necessary tools for the construction of a model. For\
    \ software modeling, a language is required that can express the various components\
    \ and the relationship among them. For instance, in object oriented software construction,\
    \ we need to specify and depict pictorially the components like classes, objects,\
    \ relationships, hierarchies, etc.\n\nA number of object oriented languages have\
    \ been proposed by proponents like Rumbaugh, Booch, Jacobson, Coad-Yourdon, etc.\
    \ Each had its own symbols and specifications for expressing object-oriented programming\
    \ (OOP) components. In 1994, an effort was started to unify all the methodologies\
    \ to form a Unified Modeling Language (UML). In 1997, UML 1.0 was offered to the\
    \ user as a standard OOP modeling language.\n\nUML can be precisely defined as\
    \ `a language that models the structural, architectural, and behavioral features\
    \ of a system`.\n\nSome important UML diagrams are given below:\n\n1. Class diagram\n\
    2. Use-case diagram\n3. Behavioral diagrams\n   1. Interaction diagrams\n    \
    \  1. Sequence diagram\n      2. Collaboration diagram\n   2. State chart diagram\n\
    \   3. Activity diagram\n4. Implementation diagrams\n   1. Component diagram\n\
    \   2. Deplayment diagram\n\nA model can be of following two types:\n\n`Static\
    \ model`: A representation of a system at a specific time at rest. It shows the\
    \ states and parameters of a system at that particular instance in time, e.g.\
    \ class diagrams.\n\n`Dynamic model`: This model depicts the dynamism of the system\
    \ in terms of its behaviors over a period of time. In fact it is the collection\
    \ of procedures that govern the overall behaviour of the system, e.g. UML interaction\
    \ diagrams.\n\n## 12.2 CLASS DIAGRAMS (STATIC)\n\nA class symbolizes a specific\
    \ feature of the system. It can be represented by a rectangle having three sections:\
    \ name, states (attributes) and behaviours (operations) as shown in [Fig. 12.1](#chapter_12.xhtml_ch12fig1).\
    \ Where an attribute defines the range of values a state can take, an operation\
    \ represents the implementation of a service or behaviour of the object that the\
    \ class represents. The access specifiers can be assigned to various members of\
    \ the class by prefixing the symbols:– (private), `+` (public), and `#` (protected).\n\
    \n![Figure 12.1](Images/ch12-fig01.png)\n\n**Figure 12.1** A class diagram\n\n\
    Depending upon requirement, the class diagram can be as short as shown in [Fig.\
    \ 12.2](#chapter_12.xhtml_ch12fig2)(a) or as detailed as shown in [Fig. 12.2](#chapter_12.xhtml_ch12fig2)(b).\n\
    \n![Figure 12.2](Images/ch12-fig02.png)\n\n**Figure 12.2** (a, b) Class diagrams\n\
    \nAn object is represented by a similar diagram but its name is qualified by its\
    \ corresponding class name. An object called `studOb` of type `student` class\
    \ is shown in [Fig. 12.3](#chapter_12.xhtml_ch12fig3).\n\n![Figure 12.3](Images/ch12-fig03.png)\n\
    \n**Figure 12.3** An object\n\nIt may noted that the object contains the actual\
    \ data in contrast to a class which has only attributes names. The reason is simple\
    \ that class is a compile time entity and the objects are instances of the class\
    \ created at run time. Therefore, the objects get the memory for storing the data\
    \ for its states. An `object diagram` is an instance of the class diagram.\n\n\
    ### 12.2.1 Relationships Among Classes\n\nThe various relationships that exist\
    \ between classes are composition, generalizations and dependencies. A brief discussion\
    \ on each of them is given below:\n\n`Composition`: An object can be composed\
    \ of components bound by two types of relationships: association and aggregation.\
    \ Both represent a ‘has-a’ relationship.\n\n`Association`: A loose relationship\
    \ between two objects. This type of relationship is flexible in the sense that\
    \ different teachers can be associated with different students or vice-versa.\
    \ As discussed earlier in the book, an association is implemented in C++ as a\
    \ pointer of one class. For example, a computer has a mouse. Similarly, a teacher\
    \ has to teach. This type of association is shown by a simple line between the\
    \ participating classes as shown in [Fig. 12.4](#chapter_12.xhtml_ch12fig4).\n\
    \n![Figure 12.4](Images/ch12-fig04.png)\n\n**Figure 12.4** An association\n\n\
    `Aggregation`: A tight relationship between two objects wherein only one object\
    \ is visible. In fact one object acts as a container of other object and therefore\
    \ the container remains visible. For example, a car has an engine. Now we see\
    \ only the car object and not the engine object. Similarly, CPU is an aggregation\
    \ of three objects: ALU, CU and registers.\n\nThe aggregation is represented by\
    \ a link with an open diamond at the container class end. Consider the aggregation\
    \ shown in [Fig. 12.5](#chapter_12.xhtml_ch12fig5) wherein it is shown that a\
    \ University has department.\n\n![Figure 12.5](Images/ch12-fig05.png)\n\n**Figure\
    \ 12.5** The aggregation\n\nThe aggregation is modeled as containership in C++.\
    \ For the aggregation shown in [Fig. 12.5](#chapter_12.xhtml_ch12fig5), the University\
    \ class would contain an object of department type.\n\nMultiplicity of association\
    \ can be shown by appropriately annotating the association links as shown in [Fig.\
    \ 12.6](#chapter_12.xhtml_ch12fig6).\n\n![Figure 12.6](Images/ch12-fig06.png)\n\
    \n**Figure 12.6** Multiplicity of associations\n\nThus the relationship that the\
    \ University has many departments can be represented by the diagram shown in [Fig.\
    \ 12.7](#chapter_12.xhtml_ch12fig7).\n\n![Figure 12.7](Images/ch12-fig07.png)\n\
    \n**Figure 12.7** One to many relationship\n"
