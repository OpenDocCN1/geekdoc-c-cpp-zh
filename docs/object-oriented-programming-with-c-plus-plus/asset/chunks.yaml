    悬空指针是指已经创建但没有指向任何实体的指针。这种未初始化的指针是危险的，因为对它进行解引用操作将导致不可预测的操作，或者导致运行时错误。


    考虑以下代码：


    ![image](img/pg66-2.png)


    ![Figure 2.11](img/ch02fig11.png)


    **图 2.11** 悬空指针


