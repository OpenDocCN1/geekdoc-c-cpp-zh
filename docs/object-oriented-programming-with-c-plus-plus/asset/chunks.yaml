  trans: "\n如名所示，部署图表示了组件在不同节点上部署的拓扑结构。节点通常是指计算硬件组件，如客户端和服务器机器、调制解调器、显示器等。因此，除了软件组件外，我们还需要识别节点及其关系。软件组件运行在特定的节点上。因此，节点必然包含该组件的实例，如图\
    \ 12.27 所示。\n\n需要注意的是，该节点被命名为“client m/c”，即客户端机器。一个 `interface` 组件的实例被部署在该节点上执行。\n\
    \n![图 12.27](img/ch12-fig27.png)\n\n**图 12.27** 一个包含 `interface` 组件实例的节点\n\n让我们按照以下选择，部署图\
    \ 12.26 中的各种组件：\n\n| 组件 | 节点 |\n| :--- | :--- |\n| Interface | client m/c |\n\
    | Registration | web server |\n| Database | Database server |\n\n相应的部署图如图图 12.28\
    \ 所示。\n\n![图 12.28](img/ch12-fig28.png)\n\n**图 12.28** 部署图\n\n部署图的用法总结如下：\n\n\
    1. 阐述被称为节点的硬件组件的分布情况。\n2. 指定节点的拓扑结构。\n3. 识别将驻在这些节点上的软件组件。\n\n### 12.6 总结\n\n模型是系统的简化表示，其目的是为了理解系统。对于软件建模，使用了\
    \ UML（统一建模语言）。模型可以是静态的或动态的。类（Class）代表系统的特定特性。对象（Object）也用矩形表示，但其名称由其类名限定。组合（Composition）表示“拥有”关系。关联（Association）被建模从一个类到另一个类的指针。聚合（Aggregation）被建模为包含关系。自顶而下的方法识别类中的特化。自底向上的方法创建超类。继承（Inheritance）建模了“是一个”（ako）的关系。依赖（Dependency）是一个类对另一个类的使用关系。执行者（Actor）是启动某些动作的类。用例图（Use\
    \ case diagram）表示系统的上下文。对象在事件发生后从一个状态移动到另一个状态。状态图（State chart）表示响应式系统。活动（Activity）可以有输出转换。实现图有两种类型：组件图和部署图。\n\
    \n### ![question](img/question.png) 多选题\n\n1. 静态模型表示处于 ________ 的系统：\n    1. 运动\n\
    \    2. 静止\n2. 在 UML 中，类表示为 ________。\n    1. 圆形\n    2. 椭圆\n    3. 矩形\n    4.\
    \ 三角形\n3. 属性（Attribute）为什么定义值范围：\n    1. 状态\n    2. 对象\n    3. 类\n    4. 函数\n\
    4. 对象图是类图的 ______。\n    1. 副本\n    2. 反对\n    3. 实例\n5. 关联是 ________ 的关系。\n  \
    \  1. 松散的\n    2. 紧密的\n    3. 安全\n6. 在包含关系中，只有 _______ 是可见的。\n    1. 关系\n    2.\
    \ 链接\n    3. 被包含的对象\n    4. 容器\n7. 聚合由在容器类末端有一个开放 ______ 的链接表示。\n    1. 圆形\n \
    \   2. 椭圆\n    3. 箭头\n    4. 菱形\n8. 正交类不 ________ 彼此。\n    1. 依赖\n    2. 接触\n\
    \    3. 继承\n    4. 关联\n9. 用例是一个为系统提供 ______ 的类或函数。\n    1. 链接\n    2. 状态\n   \
    \ 3. 服务\n    4. 名称\n10. 序列图中的消息按照它们的 ________ 顺序排列：\n    1. 放置\n    2. 发生顺序\n\
    11. 交互图建模系统的 ______ 行为。\n    1. 主要的\n    2. 静态\n    3. 动态\n    4. 优的\n12. 在状态图中，箭头表示：\n\
    \    1. 转换\n    2. 状态\n    3. 事件\n    4. 对象\n13. 对象在特定状态下的内部动作称为：\n    1. 脉冲\n\
    \    2. 挑衅\n    3. 活动\n    4. 反应\n14. 活动图是 ________ 的扩展：\n    1. 类图\n    2. 对象图\n\
    \    3. 序列图\n    4. 流程图\n15. 部署图表示组件的 __________。\n    1. 交互\n    2. 顺序\n    3.\
    \ 拓扑\n    4. \n\n### 答案\n\n1. b\n2. c\n3. a\n4. c\n5. a\n6. d\n7. d\n8. a\n9.\
    \ c\n10. b\n11. c\n12. a\n13. c\n14. d\n15. d\n\n### ![question](img/question.png)\
    \ 练习\n\n1. 静态模型表示处于 ________ 的系统：\n2. 在 UML 中，类表示为 ________。\n3. 属性为什么定义值范围：\n\
    4. 对象图是类图的 ______。\n5. 关联是 ________ 的关系。\n6. 在包含关系中，只有 _______ 是可见的。\n7. 聚合由在容器类末端有一个开放\
    \ ______ 的链接表示。\n8. 正交类不 ________ 彼此。\n9. 用例是一个为系统提供 ______ 的类或函数。\n10. 序列图中的消息按照它们的\
    \ ________ 顺序排列：\n11. 交互图建模系统的 ______ 行为。\n12. 在状态图中，箭头表示：\n13. 对象在特定状态下的内部动作称为：\n\
    14. 活动图是 ________ 的扩展：\n15. 部署图表示组件的 __________。\n\n"
