    important to learn the difference between the pointer and its associated dynamic
    variable. Let us consider the following program segment.


    ![image](Images/pg77-2.png)


    The outcome of the above program segment would be as shown in [Fig. 2.22](#chapter_02.xhtml_ch2fig22).


    ![Figure 2.22](Images/ch02fig22.png)


    **Figure 2.22** *Value assignment through pointers*


    Let us now see the effect of the following assignment statement on the memory
    allocated to the pointers Aptr and Bptr.


    Aptr = Bptr;


    The above assignment makes Aptr to point to the same location or variable, which
    is already being pointed by Bptr as shown in [Fig. 2.23](#chapter_02.xhtml_ch2fig23).
    Thus, both Aptr and Bptr are now pointing to the same memory location.


    ![Figure 2.23](Images/ch02fig23.png)


    **Figure 2.23** *Both pointers pointing to the same location*


    A close observation would reveal that the dynamic variable containing value 15
    is now lost in the sense that it is neither available to Aptr anymore and nor
    it is available to the system. The reason being that the system gave it to the
    pointer Aptr and now Aptr is pointing to some other location. This dynamic variable
    being anonymous (i.e. without name) is no more accessible. Even if we want to
    reverse the process, we cannot simply do it. This phenomenon of losing dynamic
    variables is known as **memory bleeding**. Thus, utmost care should be taken while
    manipulating the dynamic variables. It is better to return a dynamic variable
    whenever it is not required in the program.


    A dynamic variable can be returned to the system by function called delete. The
    general form of usage of this operator is given below.


    delete <pointer>;


    where **delete**: is a reserved word


    <**pointer**>: is the pointer to the dynamic variable to be returned to the system


    Let us consider pointers shown in [Fig. 2.23](#chapter_02.xhtml_ch2fig23). If
    it is desired to return the dynamic variable pointed by pointer Bptr, we can do
    so by the following statement:


    delete Bptr;


    Once the above statement is executed, the dynamic variable is returned back to
    the system, and we are left with two dangling pointers Bptr and Aptr as shown
    in [Fig. 2.24](#chapter_02.xhtml_ch2fig24). The reason for this is obvious because
    both were pointing to the same location. However, the dynamic variable containing
    value 15 is anonymous and not available anymore and hence a total waste of memory.


