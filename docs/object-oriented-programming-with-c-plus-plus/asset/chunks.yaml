    Since the constructor is the first function to be called before the construction
    of an object, the programmer can use constructors for variety of purposes as discussed
    in the following sections.


    ## 6.2 TYPES OF CONSTRUCTORS


    In C++, there are four types of constructors:


    1. The default constructor.

    2. User defined constructor.

    3. Parameterized constructors.

    4. The copy constructor.


    ### 6.2.1 Default Constructor and User Defined Constructor


    Consider [Fig. 6.1](#chapter_06.xhtml_ch6fig1). It may be further noted that the
    compiler has on its own included the following statement in the class definition:


    ```cpp

    myClass() { }

    ```


    This is called as a `default constructor`. It can be precisely defined as `the
    constructor which is defined and called by the compiler. It does no processing
    but reserves memory for the object. It takes no parameters.`


    Thus, a default constructor with empty body does not do anything worthwhile but
    it is legal. At the time of creation of an object, it is executed and memory is
    allocated for the object.


    However, the programmer can also explicitly define `a user defined constructor`
    for his/her own advantage in situations similar to as given below.


    Many programming situations demand initialization of data members of an object
    before it is used in a program. For example, in a stack object, the top of the
    stack must be initialized to –1 to indicate that the stack is initially empty.
    Let us initialize the top to –1 in the class called `stack`, given below, and
    see what happens.


    ![page178-1.png](Images/page178-1.png)


    When the class is compiled, the compiler gives an error on the following statement
    because we know very well that the class is a compile time entity and will not
    get the memory and therefore no variables can be initialized within the class.


    ```cpp

    int top = -1;

    ```


    In fact, in almost every useful program, some data elements are needed to be initialized
    before they are used. We can use a default constructor in these situations by
    putting the initialization statements inside the body of the constructor as shown
    below:


    ```cpp

    stack () {int top = -1;}

    ```


    Now the above arrangement is valid and at the time of creation of object it will
    work as follows:


    1. The constructor function called `stack()` would be called.

    2. The constructor will provide the memory to the various elements of the class,
    i.e. the array called `stak[]` and the `top`.

    3. At the time of providing space to the variable `top`, it will load the desired
    value –1 into it.


    The modified class called `stack` is given below:


    ![page179-1.png](Images/page179-1.png)


    **Example 1**. *Write a program that demonstrates the working of a constructor
    by using the class called `stack` to simulate its operations: push and pop, for
    integer values. Modify the push and pop functions so that the following messages
    are displayed in the calling function `main()`.*


    “Stack is full”, “Stack is empty”


    *Solution*: We would modify the `push()` and `pop()` functions to return following
    values as per the remarks given against them and accordingly the messages would
    be displayed in function `main()`.


    ![page180-1.png](Images/page180-1.png)


    The complete menu driven program is given below:


    ![page180-2.png](Images/page180-2.png)


    It may be noted that the stack class is inflexible in terms of size of the stack,
    i.e. it will always create a stack of 20 locations. This problem can be solved
    by parameterized constructors.


    ### 6.2.2 Parameterized Constructors


    We can also include arguments in the constructor function definition. *The constructors
    with arguments are also known as parameterized constructors*. This is helpful
    in a situation where the programmer wants to provide explicit initial values at
    the time of creation of an object.


    Consider the `stack` class defined in above sections. As explained above that
    it will always create a stack of 20 locations. If the user desires to create a
    stack of a particular size then he can do so by sending the size (say `Sz`) as
    an argument at the time of creation of the object. The parameterized stack constructor
    is given below:


    ![page182-1.png](Images/page182-1.png)


    The modified class is given below:


    ![page182-2.png](Images/page182-2.png)


    The programmer would now create the stack object by the following statements:


    ```cpp

    stack sOb ( Sz);

    ```


    where `Sz` is the size of the stack as specified by the user.


    **Example 2**. *Design a class called `Queue` that simulates the queue data structure
    for N locations, where N is user defined. The class must initialize the `Front`
    and `Rear` location indicators to suitable values through a constructor function.
    The elements are added and removed from the locations pointed by `Rear` and `Front`
    respectively*.


    *Solution:* We would use a parameterized constructor that takes the user specified
    number of locations (say `N`) for the proposed `Queue` class and will also initialize
    `Front` and `Rear` to location 0 to mark that the queue is empty.


    The required class is given below:


    ![page183-1.png](Images/page183-1.png)


    **Example 3**. *Write a program that tests the `Queue` class for a given size
    of a queue.*


    *Solution*: The required program is given below:


    ![page184-1.png](Images/page184-1.png)


    It may be noted in the above program that the argument for the constructor has
    been provided during the creation of the object by the following statement:


    ```cpp

    Queue qOb (Sz);

    ```


    The format of passing arguments to constructor is:


    `<class name> <object name> (argument-list);`


    This method of passing arguments to constructor is called as `implicit call`.
    It is a widely used way of providing arguments for the constructor. However, there
    is also another way of providing arguments to constructors as shown below:


    ```cpp

    Queue qOb = Queue (Sz);

    ```


    This method is called as `explicit call`. Since implicit call method of providing
    arguments is shorter, most of the programmers prefer this method often.


    ### 6.2.3 Copy Constructor


    An object can be copied to another with the help of an assignment statement. Consider
    a simple class called `test` given below:


    ![page185-1.png](Images/page185-1.png)


    Kindly note that the class `test` has two constructors: default constructor and
    a parameterized constructor, i.e. the constructors have been overloaded. Let us
    construct two objects `Ob1` and `Ob2` of class `test` in such a way that `Ob1`
    is constructed by the default constructor and `Ob2` by the parameterized constructor
    initializing variable `val` to 50. The `main()` function, given below, does this
    task and prints the contents of `val` of both the objects. Thereafter, it copies
    the contents of `Ob2` to `Ob1` by an assignment statement and again prints the
    contents of `val` of both the objects.


    ```cpp

    // (main function code not provided in source text but referenced)

    ```


    ![page186-1.png](Images/page186-1.png)


    As predicted, the contents of un-initialized `val` of object `Ob1` are random
    and garbage whereas the `val` of object `Ob2` has been properly initialized to
    50. The point worth noting is that after the assignment of `Ob2` to `Ob1`, the
    `val` of both the objects have the same contents.


    In fact the following statement has copied the object `Ob2` to `Ob1` bit by bit.


    ```cpp

    Ob1 = Ob2;

    ```


    The above method of copying one object to another of same class type is perfectly
    alright. However, this method fails in certain situations. For instance, consider
    an object (say `Obptr2`) having a pointer (`p`), pointing to a location containing
    some information (say ‘My Data’). When this object is copied to another object
    (say `Obptr1`) by assignment operator then the pointers of both the objects would
    point to the same location as shown in [Fig. 6.2](#chapter_06.xhtml_ch6fig2).
    The reason being that the assignment operator copies the contents of one object
    to another bit by bit and therefore both the pointers get the same address.


    ![Figure 6.2](Images/ch06fig02.png)

