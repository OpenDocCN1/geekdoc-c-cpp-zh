    从图 4.7 可以观察到以下几点：


    1. 只有公共接口是可见的。

    2. 数据、信息和实现是被隐藏的。


    提供对象简要信息的可见部分被称为*抽象（abstraction）*。实现是被隐藏的。换句话说，数据和实现被放置在一个胶囊中，这种活动被称为*封装（encapsulation）*。抽象和封装的示例如图图
    4.8 所示。


    ![Figure 4.8](img/ch04fig08.png)


