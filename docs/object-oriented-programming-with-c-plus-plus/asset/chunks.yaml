    ### 10.5.1 Storing Objects in Files


    Normally the contents of an object are lost as soon as the object goes out of
    scope or the program execution is over. If the information contained in the object
    is very important then we must try to save it on auxiliary storage such as hard
    disk so that it can be reused as when required. In fact, similar to records, objects
    can also be written into and instantiated from a file. The objects which remember
    their data and information are called as persistent objects.


    Thus, a persistent object exists in two forms: in the primary memory, i.e. RAM
    and the secondary memory such as hard-disk. The RAM-copy of the object represents
    the current state of the object for that moment, the disk copy of the object represents
    the old state of the object.


    The program can make changes to the object in the primary memory and before going
    out of scope, the object is written onto the disk in a file. The following example
    is using the student object for the purpose of illustrating the above discussed
    concept.


