    ### `ofstream`: It is the output file stream class. Its member function `open()`
    associates the stream with a specified file in an output mode. For example, if
    it is desired to open a file called “abc.bat” for output then the following statement
    can be used:


    ![image](Images/pg265-2.png)


    The above declaration means creating an output stream called `yourfile` and associating
    it with the file called “abc.dat”. In addition to `open()`, `ofstream` inherits
    the following functions from `ostream` class:


    (i) `put()`; (ii) `write()`; (iii) `seekp()`; (iv) `tellp()`


    ### `fstream`: It supports files for simultaneous input and output. It is derived
    from `ifstream`, `ofstream` and `iostream` classes. The functions associated with
    this stream are:


    1. `open`: This associates the stream with a specified file.

    2. `close`: It closes the stream.

    3. `close all`: It closes all the opened streams.

    4. `seekg`: Sets current ‘get’ position in a stream.

    5. `seekp`: Sets current ‘put’ position in a stream.

    6. `tellg`: Returns the current ‘get’ position in a stream.

    7. `tellp`: Returns the current ‘put’ position in a stream.


    The header file `fstream.h` contains all the class declarations required for file
    I/O. Even `iostream.h` is included in `fstream.h` and therefore, `fstream.h` should
    be included in a program that manipulates files.


    #### 10.3 OPENING AND CLOSING A FILE (TEXT FILES)


    A file can be opened in C++ by two methods:


    1. By using the constructor of the stream class to be used.

    2. By using the `open()` function of the stream class to be used.


    The first method is simple to start with. Let us consider a situation wherein
    we desire to open a file called “message.dat” containing the following text:


    > *“When you feel angry, keep your mouth shut.*


    > *Don’t talk and your anger will be fifty percent gone.*


    > *Drink some cold water and it will be seventy five*


    > *percent gone. Get out of the house and take a walk,*


    > *and it will be one hundred percent gone.”*


    We will open this file by using the default constructor of the `ofstream` class
    by the following statement:


    ```

    ofstream myfile ("message.dat");

    ```


    The above declaration means open an output stream called `myfile` and initialize
    it with the name “message.dat”. The “message.dat” is the name of the file lying
    on the hard disk. However, in the program it will be known as `myfile`. Thus,
    whatever is written in `myfile` stream in the program, will actually be written
    into the file “message.dat”. Since a simple text is to be written into the file,
    we can use the operator `<<` to write the data. The following program creates
    the required file:


    ![image](Images/pg266-1.png)


    It may be noted from the above program that the stream `myfile` has been used
    inside the program instead of `cout` stream to write the text in the file with
    the help of the operator `<<`. Moreover, a function `close()` has been used to
    close the file at the end of the program.


    The desired file called “message.dat” has been created by the above program in
    the current directory. Let us open the file in a text editor (say notepad) to
    verify the contents. The snapshot of notepad is given in [Fig. 10.5](#chapter_10.xhtml_ch10fig5):


    ![Figure 10.5](Images/ch10-fig05.png)


    **Figure 10.5** The contents of ‘message.dat’


    It may be observed that not only the above program has created the desired file:
    ‘message.dat’ but also it contains the correct contents.


    We can open the created file for input by using the default constructor of the
    `ifstream` class by the following statement:


    ```

    ifstream yourfile ("message");

    ```


    The above declaration means: open an input stream called `yourfile` and initialize
    it with the name “message.dat”. Thus, the file “message.dat” will be known as
    `yourfile` in the program. Since it is a simple text file, we can use the operator
    `>>` to read the data from the file. However, there is a limitation of the operator
    `>>` in reading a string containing blanks or white space characters. The operator
    `>>` stops the input at the occurrence of first white space in the input string.
    Thus, we can read a word at time from the text file by the `>>` operator.


    However, for reading entire lines of text, C++ provides `get()` and `getline()`
    functions as input member functions of the `ifstream` class. It also provides
    a `put()` function as output member function of the `ofstream` class. These functions
    are discussed in the following sections.


    ##### 10.3.1 Function `get()`


    This function is similar to operator `>>` except that it includes white space
    in the input string. It stops at the occurrence of `\n`, the line character. The
    following variations:


    1. `get(ch)`

    2. `get(ch, n)`


    The third argument `c` is known as the terminating character. The default terminating
    character is `\n`, i.e. the line character. Let us now write a program that reads
    the file `n` as times as there are lines in the file. The following program is
    given below:


    ![image](Images/pg268-1.png)


    **Note**: while the above program reads the file `message.dat`, the function `get()`
    stops at the character `\n`. The output of the above program is given below:


    ![image](Images/pg268-2.png)


    Kindly note that the stream `yourfile` has read the characters from beginning
    of the line till it encountered the character `\n`.


    ##### 10.3.2 Function `getline()`


    The format of `getline()` is shown below:


    ```

    getline(ch, n)

    ```


    This function reads a line of characters until it encounters `\n`, the line character.
    The following variations allow for a custom delimiter:


    1. `getline(ch, n)`

    2. `getline(ch, n, c)`


    The third argument `c` is the specified terminating character. The default terminating
    character is `\n`, i.e. the line character. A modified program that uses `getline()`
    to read the file “message.dat” is given below:


    ![image](Images/pg269-1.png)


    **Example 1. Modify the above program to read a line from the file “message.dat”,
    terminated by the alphabet ‘k’.*


    *Solution*: The required program is given below:


    ![image](Images/pg270-1.png)


    The output of this modified program is given below:


    ![image](Images/pg270-2.png)


    Kindly note that the stream `yourfile` has read the characters from beginning
    of the line till it encountered the character `k`.


    However, it is worth noting that the above programs work only with a particular
    file “message.dat”. It is quite an inflexible arrangement whereas in a real life
    situation we would like these programs to work with any user specified text file.


    The desired flexibility can be brought by the following two simple steps:


    1. Read the name of file to be opened at run time in a variable of type char.

    2. Open the stream in a desired mode and associate the stream with the variable
    that contains the name of the file to be opened.


    The following example opens a file for which the user supplies the name at time.


    **Example 2. Write a program that prompts the user to enter the name of the file
    to be opened (say “message.dat”). It associates the file name with the output
    stream (say yourfile) and displays its contents.**


    *Solution*: The required program that reads the name of the file, to be opened,
    at run time is given below:


    ![image](Images/pg271-1.png)


    The output of the program is given below:


    ![image](Images/pg271-2.png)

