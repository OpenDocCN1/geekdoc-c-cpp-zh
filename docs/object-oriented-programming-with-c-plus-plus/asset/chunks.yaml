    **图 6.2** 通过赋值运算符进行的对象拷贝操作*


    现在，这种异常情况会导致许多类型的问题，例如两个对象作用于同一个位置，一个对象对公共位置的更改可能无法被另一个对象所接受等等。


    因此，对于带有指针的对象的拷贝，我们需要一种机制允许对对象进行成员逐级拷贝，以便为目标对象的指针分配独立的空间。


    C++ 提供了一种名为`copy constructor`（拷贝构造函数）的特殊构造，允许程序员将一个对象逐级拷贝到另一个对象。然而，程序员必须编写代码，将源对象的各种成员逐级拷贝到目标对象的相应成员中。但是，拷贝构造函数在类中定义为一个带参数的构造函数，接收一个同类型的对象作为通过引用传递的参数。考虑下面的类：


    ![page187-1.png](img/page187-1.png)


    可以注意到，上述类 `myClass` 有一个特殊的参数化构造函数，它通过引用接收一个同类类型的对象。现在，如果我们有一个 `myClass` 类型的 `obj1`，并且想要创建一个
    `myClass` 类型的新对象 `obj2`，并用 `obj1` 的内容进行初始化，那么可以使用以下声明：


    ![page187-2.png](img/page187-2.png)


    声明 (i) 声明了一个 `myClass` 类型的对象 `obj1`，而 (ii) 则声明了另一个 `myClass` 类型的对象 `obj2` 并根据程序员的意愿将对象
    `Obj1` 传递给拷贝构造函数进行成员级拷贝。


    ### 示例 4. 修改上面定义的类 `test`，使其有一个拷贝构造函数，可以将一个 `test` 类型的对象拷贝到另一个 `test` 类型的对象，但在拷贝源对象的成员
    `val` 时，将其乘以一个数字（假设 5），然后存储到目标对象的成员 `val` 中。


    *Solution*：所需的修改后的 `test` 类所示：


    ![page187-3.png](img/page187-3.png)


    ### 示例 5. 编写一个函数 `main()`，创建一个带有初始值（假设 15）的 `test` 类型对象 `Ob1`，然后通过拷贝构造函数将其拷贝到
    `test` 类型对象 `Ob2` 中。随后，打印两个对象的内容。


    *Solution*：所需的函数 `main()` 所示：


    ![page188-1.png](img/page188-1.png)


    上述内容的输出所示：


    ![page188-2.png](img/page188-2.png)


    可以注意到，拷贝构造函数不仅拷贝了对象，而且按照要求，在将源对象成员 `val` 的内容（即 15）拷贝到目标代码的相应成员之前，还将其乘以了 5。进一步可以注意到，这通过使用默认拷贝构造函数的普通赋值操作是不可能实现的。


    现在让我们来看一个名为 `studData` 的类示例，它使用指针来存储在大学学习的学生的个人数据。


    ![page188-3.png](img/page188-3.png)


    可以注意到，上述类了两类信息：所有学生共有的数据（如大学名称和系别名称），对于每个学生，都有一个可以通过指针访问的个人数据。


    现在让我们写一个完整的程序，创建一个 `studData` 类型的对象 `ob1`，读取其数据，将对象拷贝到另一个对象 `Ob2` 并打印两个对象的数据。随后，修改
    `Ob2` 的个人数据并打印两个对象的数据。


    ![page189-1.png](img/page189-1.png)


    示例输出所示：


    ![page190-1.png](img/page190-1.png)


    可以注意到，正如预期的，在执行以下拷贝操作后，两个对象包含相同的数据。


    `Ob2 = Ob1; //拷贝对象`


    然而，奇怪的地方在于，即使在给对象 `Ob2` 提供新的个人数据后，两个对象仍然显示相同的数据。唯一的区别是现在个人数据属于名为“Sham”的学生，而在更改之前，两个对象都是名为“Ram”的个人数据。然而，意图是将
    `Ob1` 分配给 Ram，将 `Ob2` 分配给 Sham。异常发生是因为两个对象的指针（`ptr`）都指向同一个位置，正如之前所示的图 6.2。


    上述问题的解决方案是使用拷贝构造函数根据我们的要求对对象进行成员级拷贝。修改后的 `studData` 类所示：


    ![page191-1.png](img/page191-1.png)


    可以注意到，我们不仅包含了拷贝构造函数，还删除了 `setPass()` 函数，因为它已经变得不再。现在让我们写一个 `main()` 函数来测试它。我们不会重复
    `readData()` 和 `showData()` 的代码，因为它们保持不变。所需的 `main()` 函数所示：


    ![page191-2.png](img/page191-2.png)


    示例输出所示：


    ![page192-1.png](img/page192-1.png)


    请注意，拷贝构造函数完成了所需的任务，即两个对象的指针（`ptr`）指向不同的位置（参见图 6.2）。


    **图 6.3** 通过赋值运算符进行的拷贝


    ![Images/06fig3.png)#### 6.2.4 带默认参数的构造函数类似于普通函数，构造函数也可以有默认值。例如，我们可以如下重写该类：![page193-1.png](img/page193-1.png)


    **注意**：在上述构造中指定了默认参数 `Sz = 20`。现在，可以在不指定参数的情况下创建类对象。默认参数必须放在最后。


    #### 6.2.5 构造函数的定义规则


    构造函数的定义及其规则如下：


    1. 构造函数的名称与类相同。

    2. 构造函数可以有参数列表。

    3. 构造函数可以重载。

    4. 无参数的构造函数是默认构造函数。

    5. 如果类中没有构造函数，编译器将生成一个默认构造函数。

    6. 构造函数会自动执行。

    7. 构造函数的常用缩写是 `ctor`。


    #### 6.3 析构函数


    析构函数是构造函数的反面，因为它移除在创建对象期间分配的对象内存。它与类名相同，但以波浪号(~)为前缀所示：


    ![page194-1.png](img/page194-1.png)


    析构函数的定义和用法规则为：


    1. 析构函数与类名相同，但带有波浪号字符 `~`。

    2. 析构函数不能有参数。

    3. 它没有返回类型，甚至没有 `void` 类型。

    4. 析构函数不能重载，即一个类中只能有一个析构函数。

    5. 如果类中没有析构函数，编译器将生成一个默认析构函数。

    6. 析构函数在控制到达类作用域结束时自动执行。

    7. 析构函数的常用缩写是 `dtor*。


