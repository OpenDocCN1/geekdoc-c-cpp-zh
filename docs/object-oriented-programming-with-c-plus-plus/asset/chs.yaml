  \n示例 ...\n\n## 10 C++ 中的文件处理\n\n### 10.1 文件概念\n\n我们知道每个程序或子程序由两个主要部分组成：算法和数据结构。算法负责解决问题的规则和步骤，而数据结构包含数据。如图\
  \ 10.1 所示。\n\n![Figure10.1](img/ch10-fig01.png)\n\n**图 10.1** *程序或子程序的结构*\n\n在面向对象编程\
  \ (OOP) 中，对象是核心。对象有两个组件：状态（states）和行为（behaviours）。状态和行为分别模拟数据和过程。如图 10.1 所示。数据结构本质上是易变的，因为一旦程序结束，其内容就会丢失。同样，对象在程序结束后也会丢失状态。如果我们想永久存储数据或创建持久化对象，就需要将其存储在名为文件的特殊数据结构中。文件可以存储在硬盘等存储媒介上。事实上，大量数据始终存储在文件中。\n\
  \n现在，存储在硬盘等永久存储上的任何内容都称为文件。例如，MBR（主引导记录）、FAT（文件分配表）、分区表、程序等都是文件的示例。\n\n让我们考虑图 10.2\
  \ 中记录的信息。\n\n![Figure10.2](img/ch10-fig02.png)\n\n**图 10.2** *关于学生的信息*\n\n图 10.2\
  \ 所示表格中的每个条目都是三个数据项：学号（Roll number）、姓名和分数（Marks）。名为 Ajay 的学生学号和总分分别为 001 和 50。同样，名为\
  \ Ram 的学生学号为 002，总分为 70。该表格中的每个条目也称为学生的记录（record）。记录（*record*可以定义为特定实体（如人、机器、地点或操作）的数据项集合。记录中的单个数据项称为字段（field）。当字段假设唯一值时，它被称为键字段（key-field）。如图\
  \ 10.3 所示，学生记录中的“Roll”就是键字段。\n\n![Figure10.3](img/ch10-fig03.png)\n\n**图 10.3**\
  \ *记录的结构*\n\n因此，学生的记录由以下三个字段组成：\n1. 学号\n2. 姓名\n3. 分数\n\n假设某个类有 30 个学生。现在，由 30 条记录组成的整个类信息被称为文件。记录的排列如图\
  \ 10.4 所示。\n\n![Figure10.4](img/ch10-fig04.png)\n\n**图 10.4** *文件：记录的集合*\n\n文件（*file*）可以精确地定义为*记录的逻辑集合，每个记录由项目组成*。文件中的记录可以以下方式排列：\n\
  1. **升序/降序**：文件中的记录可以按照键字段的升序或降序排列。\n2. **字母顺序**：如果键字段是字母类型，则按字母顺序排列。\n3. **时间顺序**：在这种情况下，记录根据日期或事件存储。\n\
  \n当文件数据以可读可打印字符的形式存储时，该文件被称为文本文件。这是一种特殊的文件类型，它不包含记录，只包含字符。另一方面，如果文件包含二进制代码中的不可读字符，则该文件被称为二进制文件。例如，编辑器创建的文件以文本文件存储，而编译器生成的可执行文件以二进制文件存储。\n\
  \n在接下来的章节中将介绍 C++ 支持的文件。\n\n### 10.2 文件与流\n\n在 C++ 中，流是指从源（source）到汇（sink）的数据流。源和汇可以是任何一个输入/输出（I/O）设备或文件。对于输入和输出，有两种不同的流，分别称为输入流和输出流，如图\
  \ 1.2 所示。我们在之前的程序已经使用了以下非格式 I/O 流：\n\n| 流 | 描述 |\n| | |\n| cin | 标准输入流 |\n| cout\
  \ | 标准输出流 |\n| cerr | 标准错误流 |\n\n标准源和汇分别是键盘和显示器屏幕。每当程序中包含`<iostream.h>`头文件时，这些非格式流就会初始化。然而，我们需要使用运算符\
  \ `<<` 和 `>>` 来实现这些流。\n\n文件 I/O 需要的重要流类是 `ifstream`、`ofstream` 和 `fstream`。以下是对这些流的简要讨论：\n\
  \n*ifstream*: 是输入文件流类。其成员函数 `open()` 将流与指定文件的输入模式关联。例如，如果想要输入模式打开名为“xyz.dat”的文件，可以使用以下语句。\n\
  \n![image](img/pg265-1.png)\n\n上面的声明意味着创建一个名为 `myfile` 的输入流，并将其与名为“xyz.dat”的文件关联。除了\
  \ `open()` 之外，`ifstream` 类从 `istream` 类继承了以下函数：\n\n```\n(i) `get()`\n(ii) `getline()`\n\
  (iii) `read()`\n(iv) `seekg()`\n(v) `tellg()`\n```\n\n\n\n\n### `ofstream`: 它是输出文件流类。其成员函数\
  \ `open()` 将流与输出模式下的指定文件关联。例如，如果想要打开一个名为“abc.bat”的文件进行输出，可以使用以下语句：\n\n![image](img/pg265-2.png)\n\
  \n上面的声明意味着创建一个名为 `yourfile` 的输出流，并将其与名为“abc.dat”的文件关联。除了 `open()` 之外，`ofstream`\
  \ 还继承了 `ostream` 类的以下函数：\n\n(i) `put()`； (ii) `write()`； (iii) `seekp()`； (iv) `tellp()`\n\
  \n### `fstream`: 它支持文件的同时输入输出。它派自 `ifstream`、`ofstream` 和 `iostream` 类。与该流相关的函数有：\n\
  \n1. `open`: 将流与指定文件关联。\n2. `close`: 关闭流。\n3. `close all`: 关闭所有已打开的流。\n4. `seekg`:\
  \ 设置流中当前的“获取”（get）位置。\n5. `seekp`: 设置流中当前的“写入”（put）位置。\n6. `tellg`: 返回流中当前的“获取”（get）位置。\n\
  7. `tellp`: 返回流中当前的“写入”（put）位置。\n\n头文件 `fstream.h` 包含了文件 I/O 需要的所有类声明。即使 `iostream.h`\
  \ 也包含在 `fstream.h` 中，因此，在处理文件的程序应该包含 `fstream.h`。\n\n#### 10.3 打开和关闭文件（文本文件）\n\n\
  在 C++ 中可以通过两种方法打开文件：\n\n1. 使用所用流类的构造函数。\n2. 使用所用流类的 `open()` 函数。\n\n第一种方法易于开始。让我们考虑一种情况，我们想要打开一个名为“message.dat”的文件，其中包含以下文本：\n\
  \n> *“当你感到愤怒时，请闭嘴。*\n\n> *不要说话，你的愤怒就会消失百分之五十。*\n\n> *喝一些冷水，它就会消失百分之七十*\n\n> *五。。出门散散步，*\n\
  \n> *然后它就会百分之百地消失。”*\n\n我们将通过以下语句使用 `ofstream` 类的默认构造函数来打开这个文件：\n\n```\nofstream\
  \ myfile (\"message.dat\");\n```\n\n上面的声明意味着打开一个名为 `myfile` 的输出流，并用名称“message.dat”对其进行初始化。“message.dat”是磁盘上文件的名称。然而，在程序中它将被识别为\
  \ `myfile`。因此，程序中写入 `myfile` 流的任何内容实际上都将写入文件“message.dat”中。由于是要向文件中写入简单的文本，我们可以使用运算符\
  \ `<<` 来写入数据。以下程序创建了所需的文件：\n\n![image](img/pg266-1.png)\n\n从上述程序可以注意到，程序内部使用了 `myfile`\
  \ 流而不是 `cout` 流来通过 `<<` 运算符向文件中写入文本。此外，使用了 `close()` 函数在程序结束时关闭文件。\n\n上述程序在当前目录下创建了名为“message.dat”的所需文件。让我们用文本编辑器（例如记事本）打开文件以验证内容。记事本的快照如图图\
  \ 10.5 所示：\n\n![Figure 10.5](img/ch10-fig05.png)\n\n**图 10.5** ‘message.dat’ 的内容\n\
  \n可以观察到，不仅上述程序创建了所需文件‘message.dat’，而且它包含正确的内容。\n\n我们可以通过以下语句使用 `ifstream` 类的默认构造函数打开创建的文件进行输入：\n\
  \n```\nifstream yourfile (\"message\");\n```\n\n上面的声明意味着：打开一个名为 `yourfile` 的输入流，并用名称“message.dat”对其进行初始化。因此，文件“message.dat”在程序中将被称为\
  \ `yourfile`。由于这是一个简单的文本文件，我们可以使用运算符 `>>` 从文件中读取数据。然而，`>>` 运算符在读取包含空格或空白字符的字符串时存在局限性。`>>`\
  \ 运算符会在输入字符串第一个空格处停止输入。因此，我们可以通过 `>>` 运算符每次从文本文件中读取一个单词。\n\n然而，为了读取整行文本，C++ 提供了\
  \ `get()` 和 `getline()` 函数作为 `ifstream` 类的输入成员函数。它还提供了 `put()` 函数作为 `ofstream` 类的输出成员函数。这些函数将在后续章节中讨论。\n\
  \n##### 10.3.1 函数 `get()`\n\n该函数与运算符 `>>`  own 之处在于它在输入字符串中包含了空格。它在遇到 `\\n`（换行符）时停止。以下是变体：\n\
  \n1. `get(ch)`\n2. `get(ch, n)`\n\n第三个参数 `c` 被终止字符。默认终止字符是 `\\n`，即换行符。现在让我们写一个程序，按照文件中行数的次数读取文件\
  \ `n` 次。所示程序所示：\n\n![image](img/pg268-1.png)\n\n**注意**：当上述程序读取文件 `message.dat` 时，`get()`\
  \ 函数在遇到 `\\n` 时停止。上述程序的输出所示：\n\n![image](img/pg268-2.png)\n\n请注意，`yourfile` 流读取了从行首到遇到字符的内容。\n\
  \n##### 10.3.2 函数 `getline()`\n\n`getline()` 的格式所示：\n\n```\ngetline(ch, n)\n```\n\
  \n该函数读取一行字符直到遇到 `\\n`（换行符）。以下变体允许自定义分隔符：\n\n1. `getline(ch, n)`\n2. `getline(ch,\
  \ n, c)`\n\n第三个参数 `c` 是指定的终止字符。默认终止字符是 `\\n`，即换行符。使用 `getline()` 读取“message.dat”文件的修改程序所示：\n\
  \n![image](img/pg269-1.png)\n\n**示例 1. 修改上述程序，从文件“message.dat”中读取以字母‘k’终止的行。**\n\
  \n*解*：所需的程序所示：\n\n![image](img/pg270-1.png)\n\n该修改程序的输出所示：\n\n![image](img/pg270-2.png)\n\
  \n请注意，`yourfile` 流读取了从行首到遇到字符 `k` 的内容。\n\n\n\n\n\n值得注意的是，程序现在会提示用户输入要读取的文件名。这样做的好处是程序变得更加灵活，即用户可以在运行时提供任何已存在文件的名称。\n\
  \n虽然通过构造函数打开文件是一种简单的方法，但在打开文件时应记住以下几点：\n\n1.  一个流（stream）只能连接到一个文件。\n2.  以任何模式（输入或输出）打开的文件必须通过`close()`函数关闭。\n\
  3.  如果以输出模式打开文件，且不存在同名文件，则会创建一个新文件；否则现有文件的内容将被删除。\n\n### 10.3.3 函数 `put()`\n\n该函数每次向输出流写入一个字符。例如，以下语句将字符型变量\
  \ `ch` 的字符内容写入名为 `testfile` 的流中。\n\n```cpp\ntestfile.put(ch);\n```\n\n### 示例 3.\
