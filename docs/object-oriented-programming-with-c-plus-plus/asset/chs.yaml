  \ 6.2）。\n\n**图 6.3** 通过赋值运算符进行的拷贝\n\n![Images/06fig3.png)#### 6.2.4 带默认参数的构造函数类似于普通函数，构造函数也可以有默认值。例如，我们可以如下重写该类：![page193-1.png](img/page193-1.png)\n\
  \n**注意**：在上述构造中指定了默认参数 `Sz = 20`。现在，可以在不指定参数的情况下创建类对象。默认参数必须放在最后。\n\n#### 6.2.5\
  \ 构造函数的定义规则\n\n构造函数的定义及其规则如下：\n\n1. 构造函数的名称与类相同。\n2. 构造函数可以有参数列表。\n3. 构造函数可以重载。\n\
  4. 无参数的构造函数是默认构造函数。\n5. 如果类中没有构造函数，编译器将生成一个默认构造函数。\n6. 构造函数会自动执行。\n7. 构造函数的常用缩写是\
  \ `ctor`。\n\n## 6.3 析构函数\n\n析构函数是构造函数的反面，因为它移除在创建对象期间分配的对象内存。它与类名相同，但以波浪号(~)为前缀所示：\n\
  \n![page194-1.png](img/page194-1.png)\n\n析构函数的定义和用法规则为：\n\n1. 析构函数与类名相同，但带有波浪号字符\
  \ `~`。\n2. 析构函数不能有参数。\n3. 它没有返回类型，甚至没有 `void` 类型。\n4. 析构函数不能重载，即一个类中只能有一个析构函数。\n\
  5. 如果类中没有析构函数，编译器将生成一个默认析构函数。\n6. 析构函数在控制到达类作用域结束时自动执行。\n7. 析构函数的常用缩写是 `dtor*。\n\
  \n\n\n\n\n现在最重要的问题是，析构函数对程序员来说有什么用？由于析构函数是最后一个执行的函数，程序员无法利用该函数产生任何有成效的用途。然而，如果我们非要找到它的用途，那么它最好的用途就是用于调试。事实上，可以在析构函数中包含一些适当的消息，以通知相关对象正在被销毁。如果对象没有显示该消息，程序员可能推断出该对象正运行异常，且程序控制在对象内部的某处阻塞了。\n\
  \n### 示例 6. 写一个名为 `testDest` 的类，用来说析构函数的工作。当对象被销毁时，它会显示以下消息。\n\n“我正在被销毁”\n\n编写一个尽可能小的\
  \ `main()` 函数来测试析构函数的工作。\n\n*解决方案*：下面给出了带有析构函数的类以及最小的 `main()` 函数：\n\n![page194-2.png](img/page194-2.png)\n\
  \n上述程序的输出下所示：\n\n![page195-1.png](img/page195-1.png)\n\n需要注意的是，构造函数和析构函数会在对象创建或销毁时由系统自动调用。\n\
  \n## 6.4 总结\n\n构造函数是一个创建对象的函数。它是一个特殊的函数，不返回任何值，甚至不返回 `void`。它帮助程序员在对象创建时自动初始化对象的某些数据成员。构造函数的名称与类名相同。拷贝构造函数通过另一个同类型对象的值来初始化一个对象。析构函数销毁对象。它释放对象所持有的内存。它是最后一个被调用的成员函数。它的名称与类名相同，但前面加有一个波浪号\
  \ (`~`)。析构函数可以用于调试目的。\n\n### 单选题\n\n1. 构造函数返回：\n    1. 一个整数\n    2. 一个浮点数\n    3.\
  \ 无值\n    4. void \n2. 构造函数在对象何时自动初始化其数据成员：\n    1. 声明\n    2. 创建\n    3. 销毁\n \
  \   4. 编译\n3. 构造函数的名称是：\n    1. 与类名相同\n    2. 与程序名相同\n    3. 用户定义的名称\n    4. 以上都不是\n\
  4. 构造函数是该类的友元吗？\n    1. 是\n    2. 否\n5. 如果对象按值传递给拷贝构造函数会发生什么？\n    1. 对象的大小增大\n\
  \    2. 对象的大小减小\n    3. 系统可能内存不足\n    4. 编译器内存耗尽\n6. 无参数的构造函数被称为：\n    1. 拷贝构造函数\n\
  \    2. 默认构造函数\n    3. 参数构造函数\n    4. 以上都不是\n7. 当对象由指针变量组成时，它必须通过拷贝：\n    1. 赋值运算符\n\
  \    2. 用户定义的函数\n    3. 拷贝构造函数\n8. 构造函数的常用缩写是：\n    1. conc\n    2. tor\n    3.\
  \ cons\n    4. cctor\n9. 析构函数的常用缩写是：\n    1. dtor\n    2. tor\n    3. dest\n   \
  \ 4. ~des\n10. 如果类没有定义构造函数会发生什么？\n    1. 对象不被创建\n    2. 程序终止\n    3. 对象被创建\n   \
  \ 4. 以上都不是\n\n### 答案\n\n1. c\n2. b\n3. a\n4. b\n5. c\n6. b\n7. c\n8. d\n9. a\n10.\
