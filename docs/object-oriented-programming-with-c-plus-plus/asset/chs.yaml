  18. 编写一个 C++ 程序，统计对象的数量。\n19. 类的通用属性有哪些？\n\n## 5 关于函数的更多：高级概念\n\n### 5.1 多态\n\n\
  “会议结束，”秘书宣布道。这个信息被不同的人以不同的方式理解。这种行为在意义上被称为多态。\n\n#### 6\n\n#### 构造函数与析构函数\n\n###\
  \ 6.1 构造函数\n\n我们知道类比它代表的对象更重要，因为一旦定义了类，就可以在运行时产生任意的对象。我们也知道类是编译器用于构造对象的一组规范。\n\n\
  事实上，为了创建对象，编译器会创建一个与类同名的函数，如 6.1 所示。可以注意到类的名称是 `myClass`，编译器创建的函数名称也是 `myClass`。这个函数被称为构造函数。正如名称所示，构造函数会在需要时创建相应的对象。\n\
  \n![图 6.1](img/ch06fig01.png)\n\n**图 6.1** *构造函数及其操作*\n\n因此，当执行以下对象创建语句时，构造函数 `myClass()`\
  \ 将创建一个 `myClass` 类型的对象 `myOb`：\n\n```\nmyClass myOb;\n```\n\n可以进一步注意到，类是编译时实体，而对象是运行时实体。因此，由对象获取内存和资源，而不是类。\n\
  \n\n\n\n\n由于构造函数是对象构造之前第一个被调用的函数，程序员可以像接下来的节所讨论的那样，将构造函数用于各种目的。\n\n## 6.2 构造函数的类型\n\
  \n在 C++ 中，有四种类型的构造函数：\n\n1. 默认构造函数。\n2. 用户定义的构造函数。\n3. 参数化构造函数。\n4. 拷贝构造函数。\n\n\
  ### 6.2.1 默认构造函数和用户定义的构造函数\n\n考虑图 6.1。还可以进一步注意到，编译器已经在类定义中自动包含了以下语句：\n\n```cpp\n\
  myClass() { }\n```\n\n这被称为`默认构造函数`。它可以被精确地定义为`由编译器定义并调用的构造函数。它不进行任何处理，但为对象预留内存。它不接受任何参数。`\n\
  \n因此，一个体为空的默认构造函数并没有做任何有意义的事情，但它是合法的。在创建对象时，它会被执行并为对象分配内存。\n\n然而，在类似下面的情况下，程序员也可以显式地定义一个`用户定义的构造函数`以达到自己的目的。\n\
  \n许多编程场景要求在程序中使用对象之前对其数据成员进行初始化。例如，在栈（stack）对象中，栈顶（top）必须初始化为 –1，以表示栈最初是空的。让我们在下面的名为\
  \ `stack` 的类中将栈顶初始化为 –1，看看会发生什么。\n\n![page178-1.png](img/page178-1.png)\n\n当类被编译时，编译器会对以下语句给出错误，因为我们非常清楚，该类是一个编译时实体，不会获得内存，因此无法在类内部初始化任何变量。\n\
  \n```cpp\nint top = -1;\n```\n\n事实上，在几乎每个有用的程序中，某些数据元素在使用之前都需要进行初始化。在这些情况下，我们可以通过将初始化语句放在构造函数体内部来使用默认构造函数，如下：\n\
  \n```cpp\nstack () {int top = -1;}\n```\n\n现在，上述安排是有效的，并且在创建对象时，它的工作原理如下：\n\n1.\
  \ 将调用构造函数 `stack()`。\n2. 构造函数将为类的各种元素提供内存，即名为 `stak[]` 的数组和 `top`。\n3. 在为变量 `top`\
  \ 提供空间时，它将所需的值 –1 加载到其中。\n\n修改后的类 `stack` 如下：\n\n![page179-1.png](img/page179-1.png)\n\
