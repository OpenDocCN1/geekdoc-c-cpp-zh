  1. 教室外的人通过敲门 `interrupts`（中断）讲座。这种事件是一个 `asynchronous`（异步）事件，因为老师与这种干扰无关。老师可以在自己方便时暂停讲座，听取访客要说什么。\n\
  \n   这种情况类似于设备中断 CPU 以寻求特定的服务。CPU 挂起当前程序的执行，保存其上下文，并跳转到中断服务例程。\n\n   中断的发生没有特定时间。CPU\
  \ 不需要立即处理中断，只有当……时。\n\n# 12 UML 导论\n\n## 12.1 UML 引言\n\n为了理解一个复杂的问题或系统，我们需要用一种称为“模型”的简单方式来表示它。例如，当住宅区内要建造一栋大型公寓楼时，首先由建筑师在纸上画出平面图，然后准备一个微比例的原型。当所有利益相关者（建筑商、客户等）对图纸和原型外观达成一致后，项目就会获得施工批准。原型无非所提议建筑的模型。同样，当要构建软件时，也需要准备它的模型。\n\
  \n模型可以被精确定义为`对复杂实体或过程的假设性描述，用于理解问题或系统`。\n\n一旦模型建立，就可以对其进行修改以改进，或者批准进行最终构建。然而，我们需要构建模型所需的工具。对于软件建模，需要一种能够表达各种组件及其之间关系的语言。例如，在面向对象的软件构建中，我们需要以图形方式指定并描绘类、对象、关系、层次结构等组件。\n\
  \nRumbaugh、Booch、Jacobson、Coad-Yourdon 等支持者提出了多种面向对象的语言。每种语言都有其表示面向对象编程（OOP）组件的符号和规范。1994\
  \ 年，人们开始努力统一所有方法论，以形成统一建模语言（UML）。1997 年，UML 1.0 作为标准的 OOP 建模语言提供用户。\n\nUML 可以被精确定义为`对系统的结构、架构和行为特征进行建模的语言`。\n\
  \n下面是一些重要的 UML 图：\n\n1. 类图\n2. 用例图\n3. 行为图\n   1. 交互图\n      1. 序图\n      2. 协作图\n\
  \   2. 状态图\n   3. 活动图\n4. 实现图\n   1. 组件图\n   2. 部署图\n\n模型可以是以下两种类型：\n\n`静态模型`：系统在特定时间静止状态的表示。它显示了系统在某一特定时刻的状态和参数，例如类图。\n\
  \n`动态模型`：该模型通过系统在一段时间内的行为来描绘系统的动态性。事实上，它是控制系统整体行为的例程集合，例如 UML 交互图。\n\n## 12.2 类图（静态）\n\
  \n类象征着系统的特定特征。它由一个具有三个部分的矩形表示：名称、状态（属性）和行为（操作），如 图. 12.1 所示。其中，属性定义了状态可以取值的范围，而操作代表了该类所代表的对象的服务或行为的实现。可以通过前缀符号为类的各种成员分配访问修饰符：–（私有）、`+`（公共）和\
  \ `#`（保护）。\n\n![Figure 12.1](img/ch12-fig01.png)\n\n**图 12.1** 类图\n\n根据需求，类图可以像\
  \ 图. 12.2(a) 所示那样简单，也可以像 图. 12.2(b) 所示那样详细。\n\n![Figure 12.2](img/ch12-fig02.png)\n\
  \n**图 12.2** (a, b) 类图\n\n对象由类似的图表示，但其名称通过其对应的类名进行限定。图. 12.3 所示了一个类型为 `student`\
  \ 类、名为 `studOb` 的对象。\n\n![Figure 12.3](img/ch12-fig03.png)\n\n**图 12.3** 对象\n\n\
  需要注意的是，对象包含实际数据，与类形成对比，类只具有属性名称。原因很简单，类是编译时实体，而对象是运行时创建的类实例。因此，对象获得了内存来存储其状态的数据。`对象图`\
  \ 是类图的实例。\n\n### 12.2.1 类与类的关系\n\n类之间存在的各种关系有组合、泛化和依赖。下面是对每种关系的简要讨论：\n\n`组合`：一个对象可以由两种类型关系绑定的组件组成：关联和聚合。两者都代表一种“拥有”（has-a）关系。\n\
  \n`关联`：两个对象之间的松散关系。这种关系是灵活的，因为不同的老师可以与不同的学生关联，反之亦然。正如书中前面讨论的，关联在 C++ 中通过一个类的指针来实现。例如，计算机有一只鼠标。同样，老师负责教学。这种类型的关联通过\
  \ 图. 12.4 所示的参与类之间的简单直线表示。\n\n![Figure 12.4](img/ch12-fig04.png)\n\n**图 12.4** 关联\n\
  \n`聚合`：两个对象之间的紧密关系，其中只有一个对象是的。事实上，一个对象作为另一个对象的容器，因此容器保持可见。例如，汽车有一个发动机。现在我们只看到汽车对象而看不到发动机对象。同样，CPU\
  \ 是三个对象：ALU、CU 和寄存器）聚合。\n\n聚合由在容器类端带有空心菱形的链路表示。考虑 图. 12.5 所示的聚合，其中显示大学有部门。\n\n![Figure\
  \ 12.5](img/ch12-fig05.png)\n\n**图 12.5** 聚合\n\n聚合在 C++ 中被建模为包含关系。对于 图. 12.5 所示的聚合，大学类将包含一个部门类型的对象。\n\
  \n关联的许多重性可以通过适当标注关联链接来显示，如 图. 12.6 所示。\n\n![Figure 12.6](img/ch12-fig06.png)\n\n\
  **图 12.6** 关联的多重性\n\n因此，大学拥有多个部门的关系可以通过 图. 12.7 所示的图来表示。\n\n![Figure 12.7](img/ch12-fig07.png)\n\
  \n**图 12.7** 一对多关系\n\n\n\n\n\n### 泛化 (Generalization)\n\n在这种 OOP 策略中，会识别不同类之间的共同元素。它遵循两种方法：“自顶而下”和“自底而上”。在自顶而下的方法中，我们从现有类创建专门的类。相反，在自底而上的方法中，从不同的类创建一个超类。在这两种情况下，通过继承创建了类的层次结构，从而导致了“是一种”\
  \ (ako)的关系。继承用一条从派生类开始的实线表示，线末端有一个类似三角形的箭头指向基类，即三角形的顶点指向基类，如图. 12.8 所示。\n\n![Figure\
  \ 12.8](img/ch12-fig08.png)\n\n**图 12.8** 继承（泛化）\n\n考虑图. 12.9 所示的层次结构。从上到下，可以说“红外鼠标”是“无线鼠标”的一种，而无线鼠标本身又是“鼠标”的一种。在自底而上的方法中，我们可以说无线鼠标是“红外鼠标”和“射频鼠标”的泛化。\n\
  \n![Figure 12.9](img/ch12-fig09.png)\n\n**图 12.9** 类层次结构\n\n### 依赖 (Dependency)\n\
  \n这是两个类之间的特殊关系，其中一个类依赖于另一个类。这种关系显示为从依赖类到其所依赖的类的虚线箭头。考虑图. 12.10 所示的关系。\n\n![Figure\
  \ 12.10](img/ch12-fig10.png)\n\n**图 12.10** 依赖关系\n\n事实上，依赖是一个类对另一个类的使用使用关系。例如，`Tax`\
  \ 类正在使用 `taxRules` 类。因此，它依赖于 `taxRules` 类。另一方面，如果两个类互不依赖，则它们被称为“正交的” (orthogonal)。如果一个类被修改了，它对另一个类的功能将没有影响。\n\
  \n## 12.3 用例图（静态）\n\n系统有一个被环境包围的边界。系统具有一些通过称为 `use cases` (用例) 的函数或类来实现的目标。环境中称为“参与者”\
  \ (actors) 的实体与系统进行交互，如图. 12.11 所示。\n\n![Figure 12.11](img/ch12-fig11.png)\n\n**图\
  \ 12.11** 用例图\n\n用例图表示参与者与用例之间交互的图，其中：\n\n1. `actor`（参与者）是一个可以启动动作的实体或类。它通常不是所考虑的系统或子系统的一部分。参与者必须进行适当命名。例如，在教室里，老师和学生是参与者。同样在图书馆里，图书馆会员、办事员、管理员等都是参与者。\n\
  2. `use case`（用例）是一个为系统提供服务的类或函数。它描述了参与者与系统之间的交互。每个用例实现参与者的目标。用例的名称应能够恰当地代表系统的功能。\n\
  3. 边（edge）是从参与者到用例或反之的通信路径。\n\n因此，在绘制用例图之前，需要识别以下内容：\n\n1. 参与者。\n2. 定义要做什么的用例，即功能性。\n\
  3. 参与者与用例之间的关系。\n\n例如，考虑图. 12.12 所示的图书馆借书场景用例图。它包含两个参与者：会员和图书馆办事员。用例有“请求书籍”、“搜索书籍”和“借出书籍”。\n\
  \n需要注意的是，用例的名称指示了它提供的服务，并且所有用例共同实现了系统的目标。\n\n![Figure 12.12](img/ch12-fig12.png)\n\
  \n**图 12.12** 借书场景的用例图\n\n同样，教室场景由两个参与者组成：“老师”和“学生”，可能的用例有：“在黑板上写字字”、“进行讲座”、“提问”、“回答问题”和“记录”。该场景的用例图如图.\
  \ 12.13 所示。\n\n![Figure 12.13](img/ch12-fig13.png)\n\n**图 12.13** 教室场景的用例图\n\n事实上，我们可以说用例图代表了系统的语境。它帮助我们在与系统相关的参与者的目标背景下理解系统的整体行为。用例图的使用可以总结如下：\n\
  \n1. 收集系统需求。\n2. 识别影响系统的因素。这些因素可以是内部的，也可以是外部的。\n3. 起草更广泛的视图。\n4. 表示参与者与用例之间的交互。\n\
  \n## 12.4 行为图（动态）\n\n我们周围的世界是动态的，因为它在不断演变。在经过一夜的睡眠后，无论我们是否醒来，太阳都会升起，鸟儿会鸣叫，人们去上班。行驶时，车辆以不同的速度移动。在教室里，老师和学生之间发生了大量的交互。这些示例表明世界充满了参与者之间的交互。世界的这种行为可以用行为图表示。\n\
  \n系统的各种参与者之间的交互使用交互图表示。在绘制交互图之前，执行以下步骤：\n\n1. 识别参与的对象。\n2. 找出对象组织。\n3. 识别对象之间发生的消息。\n\
  4. 确定消息的顺序。\n\n下节将简要讨论交互图。\n\n### 12.4.1 交互图\n\n交互图帮助我们捕捉用例场景的行为。交互图有两种类型：时序图和协作图。\n\
  \n`Sequence diagram`（时序图）按时间顺序显示不同对象之间的交互。每个对象都有一条生命线，它与其他交换的消息按发生的顺序排列。\n\n在时序图中，对象位于水平维度。每个对象的生命线由垂直线表示。消息或交互以水平箭头的形式表示，如图.\
  \ 12.14 所示。\n\n![Figure 12.14](img/ch12-fig14.png)\n\n**图 12.14** 时序图\n\n考虑教室场景，我们有四个主要对象：老师、黑板、学生和笔记本。这些对象之间可能的交互如图.\
  \ 12.15 所示的时序图所示。\n\n![Figure 12.15](img/ch12-fig15.png)\n\n**图 12.15** 教室场景的时序图\n\
  \n需要注意的是垂直线被称为对象生命线。它代表了对象在交互期间的存在。然而，此图并不表示参与对象之间的关联。\n\n`Collaboration diagram`（协作图）显示了不同对象在特定语境下如何协作以实现所需的结果。它是顶点和弧的集合，分别表示对象和消息。对象以组织的方式布局，弧上标记了它们向对方发送的消息。\n\
  \n教室场景的协作图如图. 12.16 所示。\n\n![Figure 12.16](img/ch12-fig16.png)\n\n**图 12.16** 教室场景的协作图\n\
  \n\n\n\n\n请注意，箭头表示在给定用例内发送的消息。此图并不首要用于指示消息或事件的顺序。然而，可以通过对消息进行适当编号来描述顺序，如 图 12.16\
  \ 所示。例如，“提问”是学生向老师发出的按顺序排列的第三条消息。\n\n同样，图 12.17 中给出了考试系统子部分的协作图。\n\n![Figure 12.17](img/ch12-fig17.png)\n\
  \n**图 12.17** *考试系统子部分的协作图*\n\n交互图的使用可以可以总结如下：\n\n1. 对系统的动态行为建模。\n2. 表示系统的消息流。\n\
  3. 表示对象之间的交互。\n4. 显示系统的对象组织。\n5. 通过结构化组织（协作图）显示控制流。\n6. 通过时间序列（时序图）显示控制流。\n\n###\
  \ 12.4.2 状态图\n\n在动态环境中，对象在事件发生后从一个状态移动到另一个状态。事件可以是消息、超时或由另一个对象发送的信号。例如，当队列前面的对象获得服务并离开服务窗口时，服务器向队列中的下一个对象发送信号，使其移动到最前面。这种对象的动态行为由状态图表示。它描绘了对象在其生命周期内响应从其他对象接收的消息时所经过的状态序列。状态图是节点和边组成的有向图。节点表示对象的状态，箭头表示状态之间的转换，如\
  \ 图 12.18 所示。\n\n![Figure 12.18](img/ch12-fig18.png)\n\n**图 12.18** *状态图*\n\n因此，在绘制状态图之前，需要识别出以下内容：\n\
  \n1. 识别对象。\n2. 识别状态。\n3. 识别转换及相关事件。\n\n考虑 图 12.19 所示的状态图。它阐明了老师对象最初处于“等待”状态。它轮询学生的状态。如果学生在场，则老师进入“教学”状态，否则老师回到“等待”状态。一旦铃声响，老师就会从“教学”状态进入“停止”状态。\n\
  \n![Figure 12.19](img/ch12-fig19.png)\n\n**图 12.19** *显示状态和转换的状态图*\n\n请注意，控制转换的条件被放置在方括号中。起始状态由实心圆表示，而停止状态由圆圈内的实心圆表示。进一步注意的是，状态图表示了一种响应式系统，其中参与的对象对外部或内部事件做出反应。因此，这些对象也被称为*响应式对象*（reactive\
  \ objects）。\n\n如果需要根据条件的不同值分支到许多状态，我们可以使用一个*选择点*（一个圆圈）作为分叉开始的接线点。条件也被称为*守卫*（guard）。\n\
  \n现在让我们修改 图 12.19 中的状态图，以包含一个守卫：老师在等待学生 10 分钟后进入停止状态。修改后的状态图如 图 12.20 所示。\n\n![Figure\
  \ 12.20](img/ch12-fig20.png)\n\n**图 12.20** *修改后的状态图*\n\n状态图的使用可以总结如下：\n\n1. 表示对象的状态。\n\
  2. 表示响应式系统。\n3. 表示负责对象从一个状态转换到另一个状态的事件。\n\n### 12.4.3 活动图\n\n对象在特定状态下的内部操作称为活动。因此，活动图表示用例内部、算法、协议之间或对象之间的工作流。工作流本身被表示为一系列动作。工作流可以是顺序的、分支的或并行的。\n\
  \n在绘制活动图之前，需要识别出以下需求：\n\n1. 活动\n2. 关联\n3. 条件\n4. 约束\n\n活动图是流程图的扩展。它是一个由活动和转换组成的图。活动被表示为带有圆角的矩形，并用其所执行的操作进行标记。一旦动作完成，工作流就会沿着转换流向下一个活动，如\
  \ 图 12.21 所示。例如，一旦学生被录取，他/她就会被分配一个课程。\n\n![Figure 12.21](img/ch12-fig21.png)\n\n\
  **图 12.21** *一个活动图*\n\n一个活动可以有多个引出的转换。当工作流遵循转换时，活动的内部操作将停止。引出的转换通过适当的条件解决。（注：原文此处重复多次，已按要求去重）。\n\
  \n\n\n\n如名所示，部署图表示了组件在不同节点上部署的拓扑结构。节点通常是指计算硬件组件，如客户端和服务器机器、调制解调器、显示器等。因此，除了软件组件外，我们还需要识别节点及其关系。软件组件运行在特定的节点上。因此，节点必然包含该组件的实例，如图\
  \ 12.27 所示。\n\n需要注意的是，该节点被命名为“client m/c”，即客户端机器。一个 `interface` 组件的实例被部署在该节点上执行。\n\
  \n![图 12.27](img/ch12-fig27.png)\n\n**图 12.27** 一个包含 `interface` 组件实例的节点\n\n让我们按照以下选择，部署图\
  \ 12.26 中的各种组件：\n\n| 组件 | 节点 |\n| :--- | :--- |\n| Interface | client m/c |\n| Registration\
  \ | web server |\n| Database | Database server |\n\n相应的部署图如图图 12.28 所示。\n\n![图 12.28](img/ch12-fig28.png)\n\
  \n**图 12.28** 部署图\n\n部署图的用法总结如下：\n\n1. 阐述被称为节点的硬件组件的分布情况。\n2. 指定节点的拓扑结构。\n3. 识别将驻在这些节点上的软件组件。\n\
  \n## 12.6 总结\n\n模型是系统的简化表示，其目的是为了理解系统。对于软件建模，使用了 UML（统一建模语言）。模型可以是静态的或动态的。类（Class）代表系统的特定特性。对象（Object）也用矩形表示，但其名称由其类名限定。组合（Composition）表示“拥有”关系。关联（Association）被建模从一个类到另一个类的指针。聚合（Aggregation）被建模为包含关系。自顶而下的方法识别类中的特化。自底向上的方法创建超类。继承（Inheritance）建模了“是一个”（ako）的关系。依赖（Dependency）是一个类对另一个类的使用关系。执行者（Actor）是启动某些动作的类。用例图（Use\
  \ case diagram）表示系统的上下文。对象在事件发生后从一个状态移动到另一个状态。状态图（State chart）表示响应式系统。活动（Activity）可以有输出转换。实现图有两种类型：组件图和部署图。\n\
