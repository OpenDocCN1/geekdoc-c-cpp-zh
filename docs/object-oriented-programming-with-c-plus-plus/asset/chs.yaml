  \n## 4.6 作为函数参数的对象\n\nC++ 将对象视为内置数据类型，因此对象可以作为参数传递给函数。对象可以通过两种方式之一传递。然而，每种方法都有优缺点：\n\
  \n1. 值传递\n\n### 1. 值传递\n\n在参数传递的值传递方法中，对象按值传递给函数。调用函数接收的是对象的副本，而不是对象本身。调用函数只能使用对象的服务，因为只有对象的公共成员是可以访问的。例如，考虑以下函数\
  \ `test()`，它通过*值传递*接收学生类型的对象并读取其数据并显示等级。\n\n![page121-1.png](img/page121-1.png)\n\
  \n程序的输出所示：\n\n![page121-2.png](img/page121-2.png)\n\n可以注意到 `main` 函数也尝试显示等级，但显示的的是垃圾值。原因是\
  \ `main()` 中创建的对象 `studOb` 与 `test()` 中创建的对象 `sOb` 不同，如图图 4.9` 中的 `studOb` 显示。\n\
  \n![Figure 4.9](img/ch04fig9.png)\n\n**图 4.9** *通过“值传递”方法传递的对象*\n\n### 2. 引用传递\n\
  \n在某些情况下，希望调用函数中对对象进行的更改能反映回调用函数中。这可以通过 C++ 参数传递的引用传递方法来解决。在这种方法中，对象的地址作为参数传递给函数。通过在对象名称前加上字符\
  \ `&` 来表示对象的地址。\n\n例如，考虑以下修改后的函数 `test()`，它通过*引用传递*接收学生类型的对象并读取其数据并显示等级。\n\n![page122-1.png](img/page122-1.png)\n\
  \n\n\n\n需要注意的是，`main` 函数也可以显示成绩。这是因为在引用传递中，只传递了对象的地址，导致 `test()` 和 `main()` 分别通过\
  \ `sOb` 和 `studOb` 指向同一个对象，如图图 4.10 所示。\n\n![Figure 4.10](img/ch04fig10.png)\n\n\
  **图 4.10** 引用传递 – `sOb` & `studOb` 指向同一个对象\n\n如果函数被声明为返回相应的类对象，那么它就可以返回一个对象。例如，一个返回（假设为）`student`\
  \ 类型对象的函数 `some()` 可以如下所示定义：\n\n![page123-2.png](img/page123-2.png)\n\n## 4.7 作用域解析运算符\n\
  \n通过本章早前的讨论，我们知道，当类的成员函数很大时，会在类内部进行声明，并在作用域解析运算符的帮助下在类外部定义。作用域解析运算符是双冒号（::`），用于将函数的定义与其类连接起来。该运算符的通用用法如下：\n\
  \n```cpp\n<return type>   < class_name >   :: < function _name > (parameter list)\n\
  ```\n\n除了上述，我们还可以使用作用域解析运算符访问类定义内部隐藏的全局变量。考虑下面提供的程序段：\n\n![page124-1.png](img/page124-1.png)\n\
  \n我们可以观察到，在类外部定义的变量 `val` 是全局变量，而在类内部单独声明的变量 `val` 是局部变量。现在，在通常情况下我们无法在类内部访问此类全局变量，因为编译器会将对变量\
  \ `val` 的任何引用视为局部变量。因此，由于存在同名的局部变量，全局变量 `val` 在类内部被隐藏了。\n\n我们可以对隐藏的全局变量使用作用域解析运算符（::`），使其在类内部可访问，如下所示：\n\
  \n![page124-2.png](img/page124-2.png)\n\n![Note](img/note.png)\n**注意**：在类和对象的范围内，作用域解析运算符与点运算符之间的主要区别在于：“点运算符用于指定对象的成员，而作用域解析运算符用于在定义类的成员函数时指定类名”。作用域解析运算符还用于使隐藏的全局变量在类或块内部可见。\n\
