  \n正如预期的，未初始对象 `Ob1` 的 `val` 内容是随机垃圾值，而对象 `Ob2` 的 `val` 已被正确初始化为 50。值得注意的一点是，将 `Ob2`\
  \ 赋值给 `Ob1` 之后，两个对象的 `val` 内容相同。\n\n事实上，以下语句逐位将对象 `Ob2` 拷贝到 `Ob1`。\n\n```cpp\nOb1\
  \ = Ob2;\n```\n\n上述将同类类对象拷贝到另一个对象的方法是完全可以。然而，这种方法在某些情况下会失败。例如，考虑一个对象（例如 `Obptr2`）有一个指针（`p`），指向包含某些信息（例如“我的数据”）的位置。当通过赋值运算符将此对象拷贝到另一个对象（例如\
  \ `Obptr1`）时，两个对象的指针将指向同一个位置，如图 6.2 所示。原因是赋值运算符逐位将一个对象的内容拷贝到另一个对象，因此两个指针都获得了相同的地址。\n\
  \n![Figure 6.2](img/ch06fig02.png)\n\n\n\n\n\n**图 6.2** 通过赋值运算符进行的对象拷贝操作*\n\n现在，这种异常情况会导致许多类型的问题，例如两个对象作用于同一个位置，一个对象对公共位置的更改可能无法被另一个对象所接受等等。\n\
  \n因此，对于带有指针的对象的拷贝，我们需要一种机制允许对对象进行成员逐级拷贝，以便为目标对象的指针分配独立的空间。\n\nC++ 提供了一种名为`copy constructor`（拷贝构造函数）的特殊构造，允许程序员将一个对象逐级拷贝到另一个对象。然而，程序员必须编写代码，将源对象的各种成员逐级拷贝到目标对象的相应成员中。但是，拷贝构造函数在类中定义为一个带参数的构造函数，接收一个同类型的对象作为通过引用传递的参数。考虑下面的类：\n\
