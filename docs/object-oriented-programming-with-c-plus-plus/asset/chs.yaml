  \n输出如下：\n\n![image](img/pg289-1.png)\n\n## 10.7 总结\n\n存储在永久存储设备上的任何内容都称为 `file`（文件）。一组相关的数据项称为\
  \ `record`（记录）。记录的最小单元称为 `field`（字段）。键字段用于唯一标识记录。文件是记录的逻辑集合。在顺序文件中，记录按照它们到达的顺序存储，而不考虑键字段。相反，在顺序文件中，记录按照键字段的特定顺序写入。键字段也称为\
  \ `primary key`（主键）。`ifstream` 和 `ofstream` 分别是输入流和输出流。能够记住其数据和信息的对象被称为 `persistent`（持久化，注：此处应为\
  \ persistent）对象。`eof()` 函数在检测到文件末尾时返回 0。打开的文件在使用后必须关闭。\n\n### ![Question](img/question.png)单选题\n\
