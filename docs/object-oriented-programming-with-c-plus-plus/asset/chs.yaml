  \n## 4.4 创建对象\n\n对象是类的实例，可以根据其类类型创建。定义对象的语法如下：\n\n```cpp\n<class_name>      <object_name>;\n\
  ```\n\n其中 `<class_name>` 是类名，`<object_name>` 是正在定义的对象名。\n\n例如，我们可以通过以下声明创建类 `student`\
  \ 的对象 `studObj`：\n\n```cpp\nstudent      studObj;\n```\n\n上述声明表示 `studObj` 是类 `student`\
