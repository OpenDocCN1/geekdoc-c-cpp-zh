    Here,  3 is subtracted from  5, giving the result  2.


    • Multiplication (*): Multiplication in C is performed using the asterisk symbol.
    It multiplies two numbers and produces their product.


    Example:


    int product = 5 * 3;  // product is 15


    This code snippet multiplies  5 by  3, resulting in  15.


    • Division (/): The division operator divides the left operand by the right operand.
    A crucial aspect of division in C is that if both operands are integers, the operation
