  trans: "\n\n```c\nprintf(\"Department: %s\\n\", dept.departmentName);\n```\n\n创建了一个\
    \ `Department` 结构体并用学生详情和部门名称进行初始化。然后访问并打印这些详情。\n\n# 第 12 章：动态内存分配\n\n## 练习 1\
    \ 答案\n\n```c\nint* array = (int*)malloc(5 * sizeof(int));\n\nif (array == NULL)\
    \ {\n    // 处理分配失败\n}\n\nfor (int i = 0; i < 5; i++) {\n    array[i] = i;\n  \
    \  printf(\"%d \", array[i]);\n}\n\nfree(array);\n```\n\n此程序演示了如何使用 `malloc` 为整数数组分配内存。它初始化并打印了数组，然后释放了内存以避免内存泄漏。\n\
    \n## 练习 2 答案\n\n```c\nfloat* array = (float*)calloc(5, sizeof(float));\n\nif (array\
    \ == NULL) {\n    // 处理分配失败\n}\n\nfor (int i = 0; i < 5; i++) {\n    printf(\"\
    %f \", array[i]);  // 每个元素应打印 0.0\n}\n\nfree(array);\n```\n\n此示例使用 `calloc` 分配并自动将浮点数数组初始化为零。它演示了\
    \ `calloc` 如何初始化内存。\n\n## 练习 3 答案\n\n```c\nint* array = (int*)malloc(10 * sizeof(int));\n\
    \nif (array == NULL) {\n    // 处理分配失败\n}\n\narray = (int*)realloc(array, 20 *\
    \ sizeof(int));\n\nif (array == NULL) {\n    // 处理重新分配失败\n}\n\nfor (int i = 10;\
    \ i < 20; i++) {\n    array[i] = i;\n}\n\nfor (int i = 0; i < 20; i++) {\n   \
    \ printf(\"%d \", array[i]);\n}\n\nfree(array);\n```\n\n此程序最初为 10 个整数分配了一个数组，然后使用\
    \ `realloc` 将其大小扩展以容纳 20 个整数。它填充并打印了整个数组。\n\n## 练习 4 答案\n\n```c\nchar* array =\
    \ (char*)malloc(10 * sizeof(char));\n\nif (array == NULL) {\n    // 处理分配失败\n}\n\
    \narray = (char*)realloc(array, 20 * sizeof(char));\n\nif (array == NULL) {\n\
    \    // 处理重新分配失败\n}\n\nfree(array);\n```\n\n在这里，使用 `malloc` 来分配一个字符数组。\n\n此处，`malloc`\
    \ 用于分配一个字符数组，然后通过 `realloc` 调整大小。最后释放内存。\n\n## 练习 5 答案\n\n```c\nint* array = (int*)malloc(5\
    \ * sizeof(int));\nint* callArray = (int*)calloc(5, sizeof(int));\n\nif (array\
    \ == NULL) {\n    // 处理分配失败\n}\n\nif (callArray == NULL) {\n    // 处理分配失败\n}\n\
    \nfor (int i = 0; i < 5; i++) {\n    array[i] = i;\n    printf(\"%d \", array[i]);\n\
    }\n\nfor (int i = 0; i < 5; i++) {\n    printf(\"%f \", callArray[i]);  // 每个元素应打印\
    \ 0.0\n}\n\nfree(array);\nfree(callArray);\n```\n\n此程序演示了 `malloc` 和 `calloc`\
    \ 的区别：`malloc` 不初始化内存，而 `calloc` 会初始化。\n\n## 练习 6 答案\n\n```c\nstruct MyStruct\
    \ {\n    int a;\n    float b;\n};\n\nstruct MyStruct* myStruct = (struct MyStruct*)malloc(sizeof(struct\
    \ MyStruct));\n\nif (myStruct == NULL) {\n    // 处理分配失败\n}\n\nmyStruct->a = 10;\n\
    myStruct->b = 20.5;\n\nfree(myStruct);\n```\n\n为结构体分配了内存块，使用后释放。\n\n## 练习 7 答案\n\
    \n```c\nint* intArray = (int*)malloc(10 * sizeof(int));\nchar* charArray = (char*)calloc(10,\
    \ sizeof(char));\n\nif (intArray == NULL) {\n    // 处理分配失败\n}\n\nif (charArray\
    \ == NULL) {\n    // 处理分配失败\n}\n\nfor (int i = 0; i < 10; i++) {\n    intArray[i]\
    \ = i;\n    printf(\"%d \", intArray[i]);\n}\n\nfor (int i = 0; i < 10; i++) {\n\
    \    printf(\"%c \", charArray[i]);  // 每个元素应打印 \\0\n}\n\nfree(intArray);\nfree(charArray);\n\
    ```\n\n此示例展示了动态内存管理的最佳实践，包括错误检查、正确用法和释放。\n\n当你继续掌握 C 语言的之旅时，记住学习之路既充满挑战又充满回报。C\
    \ 语言以其深度和复杂性，提供了从底层理解计算机编程基础的独特机会。至关重要的是保持你的好奇心和对学习的热情。深入研究内存管理、数据结构、算法和系统级编程等高级课题以拓宽你的知识面。不要害怕尝试新项目、参与开源并与编程社区交流。技术领域不断演变，关注最新趋势和进展是关键。记住，学习是一个持续的过程，你克服的每一个挑战都将通向卓越。\n\
    \n"
