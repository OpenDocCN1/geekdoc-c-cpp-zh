  trans: "\n\n# 结构：基础\n\nC 语言中的结构（structure）是一种用户定义的数据类型，允许你将不同类型的变量组合在一个名称下。结构非常多能，可以用于建模各种数据。结构中的每个成员都有其自己的存储位置，结构的大小是所有成员大小的总和，可能还会为了对齐而包含一些填充（padding）。\n\
    \n例如：\n\n```c\nstruct Person {\n  char name[50];\n  int age;\n  float height;\n\
    };\n```\n\n在这里，`struct Person` 包含三个成员：`name`、`age` 和 `height`。每个成员在内存中都占据自己的空间，`struct\
    \ Person` 的总大小是 `char` 数组、`int` 和 `float` 大小之和。\n\n## 联合体：共享内存\n\n共体（union）与结构类似，也是用户定义的数据类型，可以包含不同类型的成员。然而，在共体中，所有成员共享同一个内存位置。共体的大小由其最大成员的大小决定。一次只能使用一个成员，由于内存共享，改变其中一个成员的值会影响其他成员的值。\n\
    \n例如：\n\n```c\nunion Data {\n  int i;\n  float f;\n  char str[20];\n};\n```\n\n\
    在 `union Data` 中，`i`、`f` 和 `str` 共享相同的内存空间。如果给 `i` 赋值然后给 `f` 赋值，`i` 的值会被覆盖，因为它们占据同一个位置。\n\
    \n## 主要区别\n\n- **内存分配**：在结构中，每个成员都有自己的内存空间，而在共体中，所有成员共享相同的内存空间。\n- **大小**：结构的大小是所有成员的总大小，而共体的大小是其最大成员的大小。\n\
    - **用法**：当你想要一起存储多条数据但需要独立访问它们时，使用结构。当你想要在同一个内存空间中存储不同类型的数据，但每次只需要使用一个时，使用共体。\n\
    \n## 实际意义\n\n- 结构更常用于数据分组，例如表示学生记录或图形应用程序中的点。\n- 共体用于诸如以多种方式解释相同字节的情况，例如在硬件编程中，寄存器可能需要被当作整数、浮点数或字符数组来访问。\n\
    \n在 C 编程中，选择使用结构还是共体取决于具体场景的需求。结构在分组各种数据方面既灵活又直观，而共体提供了一种内存高效的方法来处理不同的数据解释。理解这些差异是为给定的编程场景选择合适数据类型的关键，确保高效且符合逻辑的数据管理。\n\
    \n## 练习\n\n1. 定义一个结构 `Car`，成员为 `make`、`model`、`year` 和 `color`。\n2. 声明一个结构 `Student`，成员为\
    \ `name`、`age`、`grade` 和 `id`。\n3. 创建一个 `Student` 结构的实例并设置其成员的值。\n4. 编写一个程序修改\
    \ `Car` 结构的 `year` 成员并打印其新值。\n5. 创建一个指向 `Car` 结构的指针并使用箭头运算符更改其 `color` 成员。\n6.\
    \ 定义一个嵌套结构 `Department`，包含一个 `Student` 结构和一个额外的成员 `departmentName`。\n7. 创建一个共体\
    \ `Data`，可以存储一个 `int`、一个 `float` 和一个 `char` 数组。\n8. 声明一个共体 `Metrics`，包含一个 `int`、一个\
    \ `double` 和一个 `char`。\n9. 定义一个结构 `Rectangle`，以 `topLeft` 和 `bottomRight` 为成员（每个点都是一个\
    \ x 和 y 坐标结构）。设置并打印这些点的坐标。\n10. 创建一个 `Department` 结构实例并设置 `Student` 详情和 `departmentName`。然后访问并打印\
    \ `Student` 的姓名和部门名称。\n\n这些练习旨在让你通过在 C 语言中使用结构和共体的各个方面获得实操经验，从基础定义和成员访问到涉及嵌套结构和共体的更复杂场景。\n\
    \n# 第 12 章：C 语言中的动态内存分配\n\n动态内存分配是 C 编程中的一项强大功能，它允许在运行时分配内存，而不是在编译时或函数执行开始时发生的静态或自动内存分配。本章将探索\
    \ C 提供的用于动态内存管理的机制和函数，这些对于创建灵活、高效且可扩展的程序至关重要。\n\n## 理解动态内存分配\n\n- **概念**：与静态内存分配（数组等数据结构的大小在编译时固定）不同，动态内存分配允许程序员在程序执行期间根据实际需求请求内存。\n\
    - **重要性**：该功能对于处理无法预先大小的数据至关重要，例如从文件中读取的数据、用户输入或大小变化的大型数据集。\n\n## 12.1 C 中的 malloc,\
    \ calloc, realloc 和 free\n\nC 语言中的动态内存分配是一个基础概念，使程序能够高效且灵活地利用内存。`malloc()`、`calloc()`、`realloc()`\
    \ 和 `free()` 函数是 C 动态内存管理的支柱，它们在内存使用的生命周期中各自有一个特定用途。\n\n### malloc() - 内存分配\n\n\
    **目的**：`malloc()` 是 memory allocation 的缩写，用于在运行时分配特定字节数的内存。该函数返回一个指向分配内存的指针。\n\
    **用法**：`void* malloc(size_t size);`\n**特点**：由 `malloc()` 分配的内存是未初始化的，这意味着它包含任意数据。\n\
    \n**示例**：\n```c\nint* ptr = (int*)malloc(10 * sizeof(int));\nif (ptr != NULL)\
    \ {\n  // 内存分配成功，现在可以使用 ptr。\n}\n```\n这里 `malloc()` 为 10 个整数分配了内存。返回的指针 `ptr`\
    \ 被检查是否为 `NULL` 以确保分配成功。\n\n### calloc() - 连续分配\n\n**目的**：`calloc()` 或连续分配与 `malloc()`\
    \ 类似，但有两个区别：它接受两个参数并将分配的内存初始化为零。\n**用法**：`void* calloc(size_t num, size_t size);`\n\
    **特点**：函数将分配的内存初始化为零，这对于避免未初始化内存引起很有用。\n\n**示例**：\n```c\nint* arr = (int*)calloc(10,\
    \ sizeof(int));\nif (arr != NULL) {\n  // 内存分配和初始化成功。\n}\n```\n\n### realloc()\
    \ - 调整内存大小\n\n**目的**：`realloc()` 或重新分配用于调整之前分配的内存块的大小。\n**用法**：`void* realloc(void*\
    \ ptr, size_t newSize);`\n**功能**：它将 `ptr` 指向的内存块的大小更改为 `newSize`。如果 `ptr` 为 `NULL`则类似于\
    \ `malloc()`。\n\n**示例**：\n```c\nint* data = (int*)malloc(10 * sizeof(int));\n\
    data = (int*)realloc(data, 20 * sizeof(int));\nif (data != NULL) {\n  // 内存重新分配成功。\n\
    }\n```\n\n### free() - 释放内存\n\n**目的**：`free()` 用于释放由 `malloc()`、`calloc()` 或 `realloc()`\
    \ 分配的内存。\n**用法**：`void free(void* ptr);`\n**重要性**：正确使用 `free()` 对于防止内存泄漏至关重要，内存泄漏会导致分配的内存无法返回系统供以后分配使用。\n\
    \n**示例**：\n```c\nfree(ptr);\nptr = NULL; // 释放后将指针设置为 NULL 是好习惯。\n```\n\n## 最佳实践与注意事项\n\
    \n- 始终检查这些函数的返回值，以确保内存分配成功。\n- 通过确保每个分配的块最终都会被释放，来避免内存泄漏。\n- 使用 `realloc()` 时要小心，因为它可能会将内存块移动到不同的位置，这需要仔细处理指针。\n\
    - 在释放内存后将指针设置为 `NULL` 有助于防止悬空指针错误。\n\n"
- fmt: "\nIn C programming, managing memory dynamically is a critical skill that enables\
    \ developers to handle data efficiently, especially when the size of the data\
    \ is not known beforehand. This involves allocating memory when needed and freeing\
    \ it once it's no longer in use.\n\n## Allocating Memory\nThe process of memory\
    \ allocation in C is performed at runtime, and it's primarily done using the `malloc()`\
    \ and `calloc()` functions. These functions allocate a block of memory and return\
    \ a pointer to the beginning of this block.\n\n### Using malloc()\nThe `malloc()`\
    \ function stands for memory allocation. It takes a single argument, which is\
    \ the size in bytes of the memory that needs to be allocated. The memory allocated\
    \ by `malloc()` is not initialized, meaning it contains garbage values. This function\
    \ is useful when you need a block of memory but don’t need it initialized to zero.\n\
    \nFor example:\n```c\nint* array = (int*)malloc(5 * sizeof(int));\n\nif (array\
    \ == NULL) {\n    // Handle the error; malloc failed.\n}\n```\n\nHere, `malloc()`\
    \ is used to allocate memory for an array of 5 integers. It's essential to check\
    \ if `malloc()` returns `NULL`, indicating that the memory allocation failed.\n\
    \n### Using calloc()\nThe `calloc()` function, standing for contiguous allocation,\
    \ also allocates memory dynamically. Unlike `malloc()`, it takes two arguments:\
    \ the number of elements and the size of each element. Additionally, `calloc()`\
    \ initializes the allocated memory to zero.\n\nFor instance:\n```c\nint* array\
    \ = (int*)calloc(5, sizeof(int));\n\nif (array == NULL) {\n    // Handle the error;\
    \ calloc failed.\n}\n```\n\nThis allocates and initializes an array of 5 integers.\
    \ Each integer is initialized to 0.\n\n## Freeing Memory\nOnce the dynamically\
    \ allocated memory is no longer needed, it's important to free it. This is where\
    \ the `free()` function comes in. `free()` deallocates the memory, making it available\
    \ for future allocations. Not freeing memory when it's no longer needed leads\
    \ to memory leaks, which can cause the program to run out of memory.\n\n### Using\
    \ free()\nThe `free()` function takes a pointer as an argument and deallocates\
    \ the memory block that the pointer points to. After freeing memory, it's a good\
    \ practice to set the pointer to `NULL` to avoid dangling pointers.\n\nExample:\n\
    ```c\nfree(array);\narray = NULL;  // Prevent dangling pointer\n```\n\nIn this\
    \ example, the memory allocated to `array` is released, and then `array` is set\
    \ to `NULL`.\n\n## 12.1.2 Differences Between malloc and calloc in C\nIn C programming,\
    \ `malloc()` and `calloc()` are two standard library functions used for dynamic\
    \ memory allocation, but they differ in their behavior and usage. Understanding\
    \ these differences is crucial for choosing the appropriate function for a given\
    \ situation.\n\n### malloc() - Memory Allocation\n- **Functionality**: `malloc()`,\
    \ which stands for \"memory allocation\", is used to allocate a single block of\
    \ memory in the heap of a specified size. The size is given as an argument in\
    \ bytes.\n- **Initialization**: The memory block allocated by `malloc()` is not\
    \ initialized. This means the allocated memory contains whatever data was previously\
    \ held in that part of the heap, often referred to as garbage values.\n- **Usage\
    \ Example**:\n```c\nint* array = (int*)malloc(10 * sizeof(int));  // Allocates\
    \ memory for 10 integers\n\nif (array == NULL) {\n    // Allocation failed\n}\n\
    ```\nHere, `malloc()` allocates memory for an array of 10 integers without initializing\
    \ the memory.\n\n### calloc() - Contiguous Allocation\n- **Functionality**: `calloc()`,\
    \ standing for \"contiguous allocation\", is used to allocate a specified number\
    \ of blocks, each of a specified size. It effectively allocates memory for an\
    \ array of elements, initializing them to zero.\n- **Initialization**: A key difference\
    \ is that `calloc()` initializes the allocated memory to zero. This is useful\
    \ when you want to ensure that the memory block is initialized to a known state.\n\
    - **Usage Example**:\n```c\nint* array = (int*)calloc(10, sizeof(int));  // Allocates\
    \ and initializes memory for 10 integers\n\nif (array == NULL) {\n    // Allocation\
    \ failed\n}\n```\nIn this example, `calloc()` allocates memory for 10 integers\
    \ and initializes all of them to 0.\n\n### Key Differences Summarized\n1. **Initialization**:\
    \ `malloc()` allocates uninitialized memory, meaning the memory block contains\
    \ garbage values. `calloc()` allocates memory that is initialized to zero.\n2.\
    \ **Parameters**: `malloc()` takes a single parameter specifying the total size\
    \ in bytes, whereas `calloc()` takes two parameters: the number of elements and\
    \ the size of each element.\n3. **Use Cases**: Choose `malloc()` when you need\
    \ a block of memory without initialization, for instance, when you are going to\
    \ overwrite the memory immediately. Choose `calloc()` when you need zero-initialized\
    \ memory, such as when creating an array to hold values that will be computed\
    \ later.\n\nBoth `malloc()` and `calloc()` serve the purpose of allocating memory\
    \ dynamically, but their differences in initialization and parameter specification\
    \ make them suitable for different scenarios. Understanding these differences\
    \ allows for more efficient and error-free memory management in C programming,\
    \ especially in complex applications where the state of memory can significantly\
    \ impact the behavior of the program.\n\n## 12.2 Managing Memory Effectively in\
    \ C\nEffective memory management is a critical aspect of programming in C, particularly\
    \ due to the language's direct memory manipulation capabilities. Proper management\
    \ ensures efficient use of memory, enhances performance, and prevents issues like\
    \ memory leaks and corruption, which are common pitfalls in C programming.\n\n\
    ### Principles of Effective Memory Management\n1. **Allocate Only What You Need**:\
    \ Allocate memory dynamically and as close as possible to the point of use. This\
    \ practice reduces the memory footprint and helps in managing the memory effectively.\n\
    2. **Initialize Allocated Memory**: Always initialize memory after allocation\
    \ to prevent undefined behaviors. Uninitialized memory may contain garbage values.\n\
    3. **Check for Allocation Failures**: Always check the return value of memory\
    \ allocation functions (`malloc`, `calloc`, `realloc`). If the allocation fails,\
    \ they return `NULL`, and your program should handle this.\n4. **Avoid Memory\
    \ Leaks**: Memory leaks occur when allocated memory is not freed after use, leading\
    \ to wastage of memory resources. To avoid this, ensure that every call to `malloc`\
    \ or `calloc` is paired with a corresponding call to `free` at the appropriate\
    \ time.\n5. **Prevent Dangling Pointers**: After freeing memory, set the pointer\
    \ to `NULL`. This practice helps in preventing dangling pointers, which occur\
    \ when a pointer still references a memory location that has been freed.\n6. **Use\
    \ realloc Wisely**: When resizing memory, `realloc` is useful. However, be cautious\
    \ as `realloc` may move the memory block to a new location if there's not enough\
    \ contiguous space. Always assign the result of `realloc` to a temporary pointer\
    \ before assigning it back to the original pointer to avoid losing the reference\
    \ in case `realloc` fails.\n\n### Memory Management Techniques\n**RAII (Resource\
    \ Acquisition Is Initialization)**: Although a concept from C++, RAII can be emulated\
    \ in C. It involves acquiring resources (like memory) at the time of initialization\
    \ and releasing them when they are no longer needed (typically at the end of a\
    \ function or block).\n\n**Use of Memory Pools**: For applications that frequently\
    \ allocate and deallocate small blocks of memory, using a memory pool can significantly\
    \ improve performance. A memory pool allocates a large block of memory upfront\
    \ and manages allocations and deallocations within this block.\n\n**Debugging\
    \ Memory Usage**: Tools like Valgrind or address sanitizers can help in identifying\
    \ memory leaks and invalid memory usage, which are common in complex C programs.\n"
  raw: 'In C programming, managing memory dynamically is a critical skill that enables
    developers to handle data efficiently, especially when the size of the data is
    not known beforehand. This involves allocating memory when needed and freeing
    it once it''s no longer in use.


    Allocating Memory: The process of memory allocation in C is performed at runtime,
    and it''s primarily done using the  malloc() and  calloc() functions. These functions
    allocate a block of memory and return a pointer to the beginning of this block.


    Using malloc(): The  malloc() function stands for memory allocation. It takes
    a single argument, which is the size in bytes of the memory that needs to be allocated.
    The memory allocated by  malloc() is not initialized, meaning it contains garbage
    values. This function is useful when you need a block of memory but don’t need
    it initialized to zero.


    For example:


    int*  array  =  (int*)malloc(5 *  sizeof(int));


    if  (array  == NULL)  {


    // Handle the error; malloc failed.


    }


    Here,  malloc() is used to allocate memory for an array of 5 integers. It''s essential
    to check if  malloc() returns  NULL, indicating that the memory allocation failed.


    • Using calloc(): The  calloc() function, standing for contiguous allocation,
    also allocates memory dynamically. Unlike  malloc(), it takes two arguments: the
    number of elements and the size of each element. Additionally,  calloc() initializes
    the allocated memory to zero.


    For instance:


    int*  array  =  (int*)calloc(5,  sizeof(int));


    if  (array  == NULL)  {


    // Handle the error; calloc failed.


    }


    This allocates and initializes an array of 5 integers. Each integer is initialized
    to 0.


    Freeing Memory: Once the dynamically allocated memory is no longer needed, it''s
    important to free it. This is where the  free() function comes in.  free() deallocates
    the memory, making it available for future allocations. Not freeing memory when
    it''s no longer needed leads to memory leaks, which can cause the program to run
    out of memory.


    Using free(): The  free() function takes a pointer as an argument and deallocates
    the memory block that the pointer points to. After freeing memory, it''s a good
    practice to set the pointer to  NULL to avoid dangling pointers.


    Example:


    free(array);


    array  = NULL;  // Prevent dangling pointer


    In this example, the memory allocated to  array is released, and then  array is
    set to  NULL.


    12.1.2 Differences Between malloc and calloc in C


    In C programming,  malloc() and  calloc() are two standard library functions used
    for dynamic memory allocation, but they differ in their behavior and usage. Understanding
    these differences is crucial for choosing the appropriate function for a given
    situation.


    malloc() - Memory Allocation:


    *   Functionality:  malloc(), which stands for "memory allocation", is used to
    allocate a single block of memory in the heap of a specified size. The size is
    given as an argument in bytes.


    *   Initialization: The memory block allocated by  malloc() is not initialized.
    This means the allocated memory contains whatever data was previously held in
    that part of the heap, often referred to as garbage values.


    *   Usage Example:


    int*  array  =  (int*)malloc(10 *  sizeof(int));  // Allocates memory for 10 integers


    if  (array  == NULL)  {


    // Allocation failed


    }


    Here,  malloc() allocates memory for an array of 10 integers without initializing
    the memory.


    calloc() - Contiguous Allocation:


    *   Functionality:  calloc(), standing for "contiguous allocation", is used to
    allocate a specified number of blocks, each of a specified size. It effectively
    allocates memory for an array of elements, initializing them to zero.


    *   Initialization: A key difference is that  calloc() initializes the allocated
    memory to zero. This is useful when you want to ensure that the memory block is
    initialized to a known state.


    *   Usage Example:


    int*  array  =  (int*)calloc(10,  sizeof(int));  // Allocates and initializes
    memory for 10 integers


    if  (array  == NULL)  {


    // Allocation failed


    }


    In this example,  calloc() allocates memory for 10 integers and initializes all
    of them to 0.


    Key Differences Summarized:


    1.  Initialization:  malloc() allocates uninitialized memory, meaning the memory
    block contains garbage values.  calloc() allocates memory that is initialized
    to zero.


    2.  Parameters:  malloc() takes a single parameter specifying the total size in
    bytes, whereas  calloc() takes two parameters: the number of elements and the
    size of each element.


    3.  Use Cases: Choose  malloc() when you need a block of memory without initialization,
    for instance, when you are going to overwrite the memory immediately. Choose  calloc()
    when you need zero-initialized memory, such as when creating an array to hold
    values that will be computed later.


    Both  malloc() and  calloc() serve the purpose of allocating memory dynamically,
    but their differences in initialization and parameter specification make them
    suitable for different scenarios. Understanding these differences allows for more
    efficient and error-free memory management in C programming, especially in complex
    applications where the state of memory can significantly impact the behavior of
    the program.


    12.2 Managing Memory Effectively in C


    Effective memory management is a critical aspect of programming in C, particularly
    due to the language''s direct memory manipulation capabilities. Proper management
    ensures efficient use of memory, enhances performance, and prevents issues like
    memory leaks and corruption, which are common pitfalls in C programming.


    Principles of Effective Memory Management:


    1.  Allocate Only What You Need: Allocate memory dynamically and as close as possible
    to the point of use. This practice reduces the memory footprint and helps in managing
    the memory lifecycle effectively.


    2.  Initialize Allocated Memory: Always initialize memory after allocation to
    prevent undefined behaviors. Uninitialized memory may contain garbage values that
    can lead to unpredictable results.


    3.  Check for Allocation Failures: Always check the return value of memory allocation
    functions (malloc,  calloc,  realloc). If the allocation fails, they return  NULL,
    and your program should handle this gracefully.


    4.  Avoid Memory Leaks: Memory leaks occur when allocated memory is not freed
    after use, leading to wastage of memory resources. To avoid this, ensure that
    every call to  malloc or  calloc is paired with a corresponding call to  free
    at the appropriate time.


    5.  Prevent Dangling Pointers: After freeing memory, set the pointer to  NULL.
    This practice helps in preventing dangling pointers, which occur when a pointer
    still references a memory location that has been freed.


    6.  Use  realloc Wisely: When resizing memory,  realloc is useful. However, be
    cautious as  realloc may move the memory block to a new location if there''s not
    enough contiguous space. Always assign the result of  realloc to a temporary pointer
    before assigning it back to the original pointer to avoid losing the reference
    in case  realloc fails.


    Memory Management Techniques:


    RAII (Resource Acquisition Is Initialization): Although a concept from C++, RAII
    can be emulated in C. It involves acquiring resources (like memory) at the time
    of initialization and releasing them when they are no longer needed (typically
    at the end of a function or block).


    Use of Memory Pools: For applications that frequently allocate and deallocate
    small blocks of memory, using a memory pool can significantly improve performance.
    A memory pool allocates a large block of memory upfront and manages allocations
    and deallocations within this block.


    Debugging Memory Usage: Tools like Valgrind or address sanitizers can help in
    identifying memory leaks and invalid memory usage, which are common in complex
    C programs.'
