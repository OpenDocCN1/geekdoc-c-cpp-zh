    * The precedence of operators in C is a set of rules that define the sequence
    in which different types of operations are performed in an expression. Operators
    with higher precedence are evaluated before operators with lower precedence.


    * For instance, in arithmetic operations, multiplication (`*`), division (`/`),
    and modulus (`%`) operators have higher precedence than addition (`+`) and subtraction
    (`-`). Therefore, they are evaluated first.


    ### Example of Operator Precedence


    ```c

    int result = 3 + 4 * 5;  // result is 23, not 35

    ```


    Here, `4 * 5` is evaluated first to give `20`, and then `3` is added, resulting
    in `23`.


    ### Associativity in Operation Order


    * Associativity determines the order of evaluation for operators with the same
    precedence level. In C, most binary operators are left-associative, meaning they
    are evaluated from left to right.


    * Exceptions include the assignment operator (`=`) and its compound forms (`+=`,
    `-=`, etc.), which are right-associative (evaluated from right to left).


    ### Example of Associativity


    ```c

    int value = 100 / 10 / 2;  // value is 5, not 20

    ```


    In this expression, `100 / 10` is evaluated first to give `10`, and then `10 /
    2` is evaluated, resulting in `5`.


    ### The Role of Parentheses


    * Parentheses `()` can be used to override the default precedence and associativity
    rules. Expressions within parentheses are evaluated first, and they can be nested
    to further control the order of operations.


    * Using parentheses is not only a way to ensure the correct evaluation order but
    also to enhance the readability and maintainability of the code.


    ### Parentheses Example


    ```c

    int result =  (3 + 4) * 5;  // result is 35

    ```


    Here, the expression `3 + 4` is evaluated first due to the parentheses, giving
    `7`, and then it is multiplied by `5` to give `35`.


    ## 6.4.2 Associativity Rules in C


    Associativity rules in C programming determine the order in which operators of
    the same precedence are evaluated. While operator precedence dictates which operations
    are performed first, associativity defines how operations are grouped in the absence
    of parentheses, especially when two or more operators of the same precedence appear
    in an expression.


    ### Types of Associativity


    * Left-to-Right Associativity: Most operators in C, including arithmetic (`+`,
    `-`, `*`, `/`), relational (`<`, `<=`, `>`, `>=`), and equality (`==`, `!=`) operators,
    follow left-to-right associativity. This means that when two operators of the
    same precedence are present in an expression, the one on the left is evaluated
    first.


    #### Example:


    ```c

    int result = 100 / 10 * 5;  // Equivalent to (100 / 10) * *

    ```


    In this case, `100 / 10` is evaluated first, resulting in `10`, and then `10 *
    5` is evaluated, giving the final result `50`.


    * Right-to-Left Associativity: Certain operators, like the assignment (`=`, `+=`,
    `-=`, etc.) and unary operators (`++`, `--`, `!`, etc.), follow right-to-left
    associativity. This means that evaluation starts from the rightmost operator and
    proceeds leftward.


    #### Example:


    ```c

    int a, b, c;

    a = b = c = 5;

    ```


    ### Importance of Associativity Rules


    Associativity rules in C programming determine the order in which operators of
    the same precedence are evaluated. While operator precedence dictates which operations
    are performed first, associativity defines how operations are grouped in the absence
    of parentheses, especially when two or more operators of the same precedence appear
    in an expression.


    ### Practical Implications


    Associativity rules in C programming determine the order in which operators of
    the same precedence are evaluated. While operator precedence dictates which operations
    are performed first, associativity defines how operations are grouped in the absence
    of parentheses, especially when two or more operators of the same precedence appear
    in an expression.


    ### Exercises


    1. **Arithmetic Operators**: Write a program to calculate the area of a rectangle
    using `*`.

    2. **Assignment Operators**: Create a program that swaps two numbers.

    3. **Basic Arithmetic**: Use a program to find the average of three numbers.

    4. **Increment and Decrement Operators**: Write a program where a variable is
    decremented.

    5. **Relational and Logical Operators**: Write a program to check if a number
    is.

    6. **Comparing Values**: Develop a program to compare two integers.point

    7. **Logical AND, OR, and NOT**: Write a program to determine if a year is a leap
    year.

    8. **Bitwise Operators**: Create a program that sets a particular bit.

    9. **Operator Precedence and Associativity**: Write a program that demonstrates
    the use of operator precedence and associativity rules.

