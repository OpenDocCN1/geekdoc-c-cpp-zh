    # 9.3 Introduction to Strings and String Functions


    In C programming, strings are a fundamental concept used to handle and manipulate
    text. A string in C is essentially an array of characters, terminated by a null
    character `''\0''`. This chapter provides an introduction to strings, their representation
    in C, and the common string functions available in the standard library.


    ## 9.3.1 Character Arrays and Null-terminated Strings in C


    In the realm of C programming, strings hold a special place, being represented
    as character arrays terminated by a null character. This representation is both
    simple and powerful, forming the backbone of text manipulation in C.


    **Character Arrays as Strings**: A string in C is essentially an array of characters.
    Each character in the array occupies one array element, and the string is terminated
    by a special character, the null character (`''\0''`), which has an ASCII value
    of zero. This null character is critical as it signals the end of the string to
    any function that processes it.


    When defining a string, you typically declare a character array and initialize
    it with a string literal. For example:


    ```c

    char greeting[6] = "Hello";

    ```


    In this case, `greeting` is a character array with six elements. The characters
    `''H''`, `''e''`, `''l''`, `''l''`, `''o''` occupy the first five elements, and
    the sixth element is implicitly set to the null character `''\0''`. It''s crucial
    to ensure the array is large enough to include the null character; otherwise,
    it might lead to undefined behavior when the string is used.


    **Initializing Strings**: Strings can also be initialized without specifying the
    size of the array. The compiler then automatically allocates enough space for
    the string literal, including the null character. For instance:


    ```c

    char message[] = "Good morning";

    ```


    Here, `message` is an array with 13 elements (12 characters plus the null terminator).
    The compiler counts the number of characters in the literal and adds the null
    character at the end.


    **Accessing String Elements**: Each character of the string can be accessed just
    like any array element. For example, `greeting[0]` will give you `''H''`, and
    `greeting[4]` will give you `''o''`. Remember, arrays in C are zero-indexed.


    **Null-terminated Strings**: The concept of null-termination is what differentiates
    a character array from a string. While a character array is just a sequence of
    characters, a string is a character array terminated by `''\0''`. This null termination
    is critical for string-handling functions in the standard library, as it tells
    these functions where the string ends.


    **Importance in String Handling**: Most standard library functions that deal with
    strings expect them to be null-terminated. Functions like `strlen()`, `strcpy()`,
    `strcat()`, and many others rely on the null character to determine the end of
    the string. Failure to null-terminate a character array intended to be used as
    a string can lead to errors and undefined behavior, such as reading beyond the
    allocated memory.


    ## 9.3.2 Common String Manipulation Functions in C


    In C programming, working with strings often involves using a set of standard
    library functions designed for string manipulation. These functions provide essential
    tools for performing common operations such as copying, concatenation, length
    measurement, comparison, and more. Here is an overview of some of the most commonly
    used string functions in C:


    1. `strcpy()` - String Copy:


    - **Purpose**: Copies one string to another.

    - **Usage**: `strcpy(destination, source);`

    - **Example**:

    ```c

    char source[] = "Hello";

    char destination[20];

    strcpy(destination, source);

    ```

    This function copies the contents of `source` to `destination`.


    2. `strcat()` - String Concatenation:


    - **Purpose**: Appends one string to the end of another.

    - **Usage**: `strcat(destination, source);`

    - **Example**:

    ```c

    char str1[20] = "Hello, ";

    char str2[] = "World!";

    strcat(str1, str2);

    ```

    This concatenates `str2` to the end of `str1`.


    3. `strlen()` - String Length:


    - **Purpose**: Calculates the length of a string.

    - **Usage**: `strlen(str);`

    - **Example**:

    ```c

    char str[] = "Hello";

    int len = strlen(str);

    ```

    This returns the length of `str`, not including the null terminator.


    4. `strcmp()` - String Compare:


    - **Purpose**: Compares two strings.

    - **Usage**: `strcmp(str1, str2);`

    - **Example**:

    ```c

    char str1[] = "Hello";

    char str2[] = "World";

    int result = strcmp(str1, str2);

    ```

    This compares `str1` and `str2` and returns an integer based on their lexicographical
    comparison.


    5. `strncpy()` - String Copy with Limit:


    - **Purpose**: Similar to `strcpy()`, but it also specifies the number of characters
    to copy.

    - **Usage**: `strncpy(destination, source, num);`

    - **Example**:

    ```c

    char source[] = "Hello";

    char destination[20];

    strncpy(destination, source, 3);

    ```

    This copies the first 3 characters of `source` to `destination`.


    6. `strncat()` - String Concatenation with Limit:


    - **Purpose**: Appends a specified number of characters from one string to another.

    - **Usage**: `strncat(destination, source, num);`

    - **Example**:

    ```c

    char str1[20] = "Hello, ";

    char str2[] = "World!";

    strncat(str1, str2, 3);

    ```

    This concatenates the first 3 characters of `str2` to the end of `str1`.


    **Best Practices**:


    Be cautious with buffer sizes. Ensure the destination array in functions like
    `strcpy` and `strcat` has enough space to accommodate the string, including the
    null terminator, to avoid overflow.


    Consider using their safer variants like `strncpy` and `strncat` to limit the
    number of characters copied or appended.


