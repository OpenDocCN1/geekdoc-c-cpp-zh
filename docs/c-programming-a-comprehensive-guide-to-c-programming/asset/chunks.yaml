    \ i++) {\n  sum += arr[i];\n}\nprintf(\"Sum: %d\\n\", sum);\n```\n此程序计算整数数组中所有元素的和。数组的大小通过\
    \ `sizeof(arr)/sizeof(arr[0])` 确定，并使用循环遍历数组以累加元素。\n\n### 练习 4 解决方案\n\n```c\nint\
