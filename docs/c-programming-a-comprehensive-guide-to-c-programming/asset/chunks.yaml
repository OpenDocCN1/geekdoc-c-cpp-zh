    addition occurred before the division, which could be achieved using parentheses:


    float average =  (num1 + num2 + num3)  / 3;


    This example illustrates how a misunderstanding of arithmetic operators and their
    precedence can lead to subtle bugs in programs. It also highlights the importance
    of carefully considering the order of operations in an expression, especially
    when multiple operators are involved.


    6.1.1 Basic Arithmetic Operations in C


