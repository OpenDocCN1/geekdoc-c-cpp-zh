    numerical values and are at the heart of most computational logic in C programs.
    Understanding arithmetic operators is crucial not just for performing calculations
    but also for understanding the underlying principles of computer arithmetic.


    Arithmetic operators in C include addition (+), subtraction (-), multiplication
    (*), division (/), and modulus (%). Each of these operators serves a distinct
    purpose:


    *   Addition (+): Adds two operands. For instance,  a + b.


    *   Subtraction (-): Subtracts the second operand from the first. For example,  a
    - b.


    *   Multiplication (*): Multiplies two operands. For example,  a * b.


    *   Division (/): Divides the first operand by the second. It’s important to remember
    that division between two integers will discard any fractional part. For instance,  7
    / 2 yields  3.


    *   Modulus (%): Provides the remainder of a division of two operands. For example,  7
    % 2 results in  1.


    The importance of these operators goes beyond simple arithmetic. They are involved
    in a wide range of programming tasks, from basic data processing to complex algorithms.
    One notable aspect is the precedence and associativity of these operators, which
    dictate the order in which operations are carried out in an expression. For instance,
    multiplication and division have higher precedence than addition and subtraction.


