    # 9.3 字符串与字符串函数简介


    在 C 编程中，字符串是处理和操作文本的基础概念。C 语言字符串本质上是一个字符数组，以空字符 `''\0''` 结尾。本章将介绍字符串、它们在 C 中的表示方式，以及标准库中常用的字符串函数。


    ## 9.3.1 C 语言中的字符数组和空终止字符串


    在 C 语言编程领域，字符串占据着特殊地位，它们被表示为以空字符结尾的字符数组。这种表示既简单又强大，构成了 C 语言文本操作的核心。


    **作为字符串的字符数组**：C 中的字符串本质上是一个字符数组。数组中的每个字符占用一个数组元素，字符串由一个特殊字符——空字符（`''\0''`）终止，该字符的
    ASCII 值为零。这个空字符至关重要，因为它向任何处理它的函数指示了字符串的结束。


    在定义字符串时，你通常会声明一个字符数组并用字符串字面量对其初始化。例如：


    ```c

    char greeting[6] = "Hello";

    ```


    在这种情况下，`greeting` 是一个具有六个元素的字符数组。字符 `''H''`,`''e''`, `''l''`, `''l''`, `''o''`
    占用前五个元素，第六个元素被隐式地设置为空字符 `''\0''`。确保数组足够大以包含空字符至关重要；否则在使用字符串时可能会导致未定义行为。


    **初始化字符串**：字符串也可以在不指定数组大小的情况下初始化。编译器会自动为字符串字面量分配足够的空间，包括空字符。例如：


    ```c

    char message[] = "Good morning";

    ```


    在这里，`message` 是一个拥有 13 个元素的数组（12 个字符加上一个空终止符）。编译器计算字面量中的字符数量并在末尾添加空字符。


    **访问字符串元素**：可以像访问任何数组元素一样访问字符串的每个字符。例如，`greeting[0]` 将给你 `''H''`，而 `greeting[4]`
    将给你 `''o''`。记住，C 语言中的数组是从零开始索引的。


    **空终止字符串**：空终止的概念是字符数组与字符串的区别。虽然字符数组只是字符的序列，但字符串是以 `''\0''` 终止的字符数组。这种空终止终止对于标准库中的字符串处理函数至关重要，因为它告诉这些函数字符串何时结束。


    **在字符串处理中的重要性**：大多数处理字符串的标准库函数都期望它们是空终止的。像 `strlen()`、`strcpy()`、`strcat()` 以及许多其他函数都依赖空字符来确定字符串的末尾。未能对预期用于字符串的字符数组进行空终止，可能会导致错误和未定义行为，例如读取超出分配的内存。


    ## 9.3.2 C 语言中常用的字符串操作函数


    在 C 编程中，处理字符串通常涉及使用一组为字符串操作设计的标准库函数。这些函数为执行常见操作（如复制、拼接、长度测量、比较等）提供了必要的工具。以下是 C
    语言中一些最常用字符串函数的概述：


    1. `strcpy()` - 字符串复制：


    - **目的**：将一个字符串复制到另一个字符串。

    - **用法**：`strcpy(destination, source);`

    - **示例**：

    ```c

    char source[] = "Hello";

    char destination[20];

    strcpy(destination, source);

    ```

    此函数将 `source` 的内容复制到 `destination`。


    2. `strcat()` - 字符串拼接：


    - **目的**：将一个字符串附加另一个字符串的末尾。

    - **用法**：`strcat(destination, source);`

    - **示例**：

    ```c

    char str1[20] = "Hello, ";

    char str2[] = "World!";

    strcat(str1, str2);

    ```

    这会将 `str2` 拼接到 `str1` 的末尾。


    3. `strlen()` - 字符串长度：


    - **目的**：计算字符串的长度。

    - **用法**：`strlen(str);`

    - **示例**：

    ```c

    char str[] = "Hello";

    int len = strlen(str);

    ```

    这返回 `str` 的长度，不包括空终止符。


    4. `strcmp()` - 字符串比较：


    - **目的**：比较两个字符串。

    - **用法**：`strcmp(str1, str2);`

    - **示例**：

    ```c

    char str1[] = "Hello";

    char str2[] = "World";

    int result = strcmp(str1, str2);

    ```

    这比较 `str1` 和 `str2` 并根据结果返回一个整数。


    5. `strncpy()` - 带限制字符串复制：


    - **目的**：类似于 `strcpy()`，但它还可以指定要复制的字符数量。

    - **用法**：`strncpy(destination, source, num);`

    - **示例**：

    ```c

    char source[] = "Hello";

    char destination[20];

    strncpy(destination, source, 3);

    ```

    这会将 `source` 的前三个字符复制到 `destination`。


    6. `strncat()` - 带限制字符串拼接：


    - **目的**：从一个字符串将指定数量的字符附加到另一个字符串。

    - **用法**：`strncat(destination, source, num);`

    - **示例**：

    ```c

    char str1[20] = "Hello, ";

    char str2[] = "World!";

    strncat(str1, str2, 3);

    ```

    这会将 `str2` 的前三个字符拼接到 `str1` 的末尾。


    **最佳实践**：


    在使用缓冲区大小时要小心。确保 `strcpy` 和 `strcat` 等函数的目标数组有足够的空间容纳字符串（包括空终止符），以防止溢出。


    考虑使用更安全的变体 `strncpy` 和 `strncat` 来限制复制或附加的字符数量。


    ## 练习


    1. 创建一个大小为 10 的整数数组，并从 2 开始用偶数初始化。

    2. 声明一个大小为 5 的浮点数数组并用小数初始化。

    3. 编写程序使用索引计算整数数组所有元素的和。

    4. 定义一个 3x3 的整数矩阵并用一组数字初始化。

    5. 创建一个 5x5 的二维字符数组，并初始化以表示一个简单的交叉 (''X''）图案。

    6. 初始化一个 4x4 多维数组并编写循环进行矩阵转置。

    7. 编写程序使用 `strlen` 函数查找字符串长度，但不直接使用 `strlen()` 库函数。

    8. 创建一个字符数组并将其初始化为空终止字符串。然后替换其中的一个字符并打印修改后的字符串。

    9. 编写程序使用 `strcat()` 拼接两个给定的字符串并显示结果。

    10. 创建一个使用 `strcmp()` 比较两个字符串，并打印它们是否相同。

