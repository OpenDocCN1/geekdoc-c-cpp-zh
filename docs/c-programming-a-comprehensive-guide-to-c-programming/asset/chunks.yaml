    *   C 语言中的运算符优先级是一组规则，定义了表达式中不同类型操作的执行顺序。高优先级的运算符会在低优先级的运算符之前求值。


    *   例如，在算术运算中，乘法（`*`）、除法（`/`）和取模（`%`）运算符的优先级高于加法（`+`）和减法（`-`）。因此，它们会被优先计算。


    ### 优先级示例


    ```c

    int result = 3 + 4 * 5;  // result is 23, not 35

    ```


    在这里，先计算 `4 * 5` 得到 `20`，然后加上 `3`，结果为 `23`。


    ### 结合结合性


    *   结合性决定了优先级运算符运算符计算顺序。在 C 中，大多数二元运算符是左结合的，这意味着它们从左到右进行计算。


    *   例外包括赋值运算符（`=`）及其复合形式（`+=`、`-=` 等），它们是右结合的（从右到左计算）。


    ### 结合性示例


    ```c

    int value = 100 / 10 / 2;  // value is 5, not 20

    ```


    在这个表达式中，先计算 `100 / 10` 得到 `10`，然后计算 `10 / 2`，结果为 `5`。


    ### 括号的作用


    *   括号 `()` 可用于覆盖默认的优先级和结合性规则。括号内的表达式优先计算，并且可以嵌套以进一步控制操作顺序。


    *   使用括号不仅是确保正确计算顺序的方法，还能增强代码的可读性和可维护性。


    ### 括号示例


    ```c

    int result =  (3 + 4) * 5;  // result is 35

    ```


    在这里，由于括号的存在，表达式 `3 + 4` 先被计算得到 `7`，然后乘以 `5` 得到 `35`。


    ## 6.4.2 C 中的结合性规则


    C 语言中的结合性规则决定了相同优先级运算符的计算顺序。虽然运算符优先级决定了哪些操作先执行，但结合性定义了在没有括号的情况下操作如何分组，特别是当一个表达式中出现两个或多个相同优先级的运算符时。


    ### 结合性的类型


    *   左结合性：C 中的大多数运算符，包括算术（`+`、`-`、`*`、`/`）、关系（`<`、`<=`、`>`、`>=`）和相等（`==`、`!=`）运算符。这意味着当表达式中存在两个相同优先级的运算符时，先计算左侧的运算符。


    #### 示例：


    ```c

    int result = 100 / 10 * 5;  // Equivalent to (100 / 10) * *

    ```


    在这种情况下，先计算 `100 / 10` 得到 `10`，然后计算 `10 * 5`，得到最终结果 `50`。


    *   右结合性：某些运算符，如赋值（`=`、`+=`、`-=` 等）和一元运算符（`++`、`--`、`!` 等），遵循右结合性。这意味着计算从最右侧的运算符向左进行。


    #### 示例：


    ```c

    int a, b, c;

    a = b = c = 5;

    ```


    ### 结合性规则的重要性


    C 语言中的结合性规则决定了相同优先级运算符的计算顺序。虽然运算符优先级决定了哪些操作先执行，但结合性定义了在没有括号的情况下操作如何分组，特别是当一个表达式中出现两个或多个相同优先级的运算符时。


    ### 实际影响


    C 语言中的结合性规则决定了相同优先级运算符的计算顺序。虽然运算符优先级决定了哪些操作先执行，但结合性定义了在没有括号的情况下操作如何分组，特别是当一个表达式中出现两个或多个相同优先级的运算符时。


    ### 练习题


    1.  **算术运算符**：编写一个程序使用 `*` 计算矩形的面积。

    2.  **赋值运算符**：创建一个交换两个数字的程序。

    3.  **基础算术**：使用程序找到三个数的平均值。

    4.  **递增和递减运算符**：编写一个让变量递减的程序。

    5.  **关系和逻辑运算符**：编写一个程序检查一个数字是否。

    6.  **比较值**：开发一个比较两个整数的程序。

    7.  **逻辑与、或、非**：编写一个程序判断一个年份是否为闰年。

    8.  **位运算符**：创建一个设置特定位位的程序。

    9.  **运算符优先级和结合性**：编写一个演示运算符优先级和结合性规则使用的程序。


