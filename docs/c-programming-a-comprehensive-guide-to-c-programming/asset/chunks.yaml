    \  printArray(arr, size);\n return 0;\n}\n```\nExplanation: `printArray` is a\
    \ `void` function that prints elements of an integer array.\n\n### Exercise 7:\
    \ nth Fibonacci Number Using Recursion\n\n```c\nint fibonacci(int n) {\n  if (n\
    \ <= 1) return n;\n  return fibonacci(n - 1) + fibonacci(n - 2);\n}\n\nint main()\
    \ {\n  int n = 5;\n  printf(\"Fibonacci number at position %d is %d\\n\", n, fibonacci(n));\n\
    \ return 0;\n}\n```\nExplanation: A recursive function to calculate the Fibonacci\
    \ number at the `nth` position.\n\n### Exercise 8: Sum of Digits Using Recursion\n\
    \n```c\nint sumOfDigits(int num) {\n  if (num == 0) return 0;\n  return num %\
    \ 10 + sumOfDigits(num / 10);\n}\n\nint main() {\n  int num = 12345;\n  printf(\"\
    Sum of digits in %d is %d\\n\", num, sumOfDigits(num));\n return 0;\n}\n```\n\
    Explanation: This recursive function calculates the sum of digits of a number.\n\
    \n### Exercise 9: Sum of Array Elements Using Recursion\n\n```c\nint sumArray(int\
    \ arr[], int n) {\n  if (n <= 0) return 0;\n  return arr[n - 1] + sumArray(arr,\
    \ n - 1);\n}\n\nint main() {\n  int arr[] = { 1, 2, 3, 4, 5 };\n  int n = sizeof(arr)\
    \ / sizeof(arr[0]);\n  printf(\"Sum of array elements is %d\\n\", sumArray(arr,\
    \ n));\n return 0;\n}\n```\nExplanation: This function recursively computes the\
    \ sum of all elements in an integer array.\n\n### Exercise 10: Incrementing Global\
    \ and Static Variables\n\n```c\nint globalVar = 0;\n\nvoid incrementGlobal() {\n\
    \  globalVar++;\n}\n\nvoid incrementStatic() {\n  static int staticVar = 0;\n\
    \  staticVar++;\n  printf(\"Static Var: %d\\n\", staticVar);\n}\n\nint main()\
    \ {\n  incrementGlobal();\n  incrementGlobal();\n  printf(\"Global Var after two\
    \ increments: %d\\n\", globalVar);\n  incrementStatic();\n  incrementStatic();\n\
    \ return 0;\n}\n```\nExplanation: Demonstrates the difference in behavior between\
    \ incrementing a global variable and a static local variable. The `globalVar`\
    \ is accessible and modifiable from any function, while the `staticVar` retains\
    \ its value between function calls but is only accessible within its function.\n\
