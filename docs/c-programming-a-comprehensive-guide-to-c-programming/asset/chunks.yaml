    \  int data type is perhaps the most commonly used type in C. It is employed to\
    \ store integer values, which are whole numbers without a fractional component.\
    \ The size of  int can vary depending on the system but is commonly 4 bytes, allowing\
    \ it to store values from about -2 billion to 2 billion for signed integers. For\
