    `float` and `double`: These two data types are used for representing floating-point
    numbers, or numbers with a fractional part. While `float` provides a sufficient
    level of precision for many applications and is typically 4 bytes in size, `double`
    offers a higher precision and is usually 8 bytes. The choice between `float` and
    `double` depends on the precision requirements and the computational resources
    available. For example, `float temperature = 98.6;` and `double pi = 3.14159265359;`
    declare a floating-point and a double-precision floating-point variable, respectively.


    Each of these data types serves a specific purpose. `char` is essential for handling
    textual data, `int` for general integer arithmetic, and `float` and `double` for
    calculations requiring fractional numbers. The choice of data type affects memory
    usage and computational efficiency. For instance, using `int` where `char` would
    suffice can lead to unnecessary memory consumption, while using `float` instead
    of `double` might result in a loss of precision for calculations requiring high
    accuracy.


    The understanding of these primitive data types is critical as they are the building
    blocks upon which complex data structures and operations are constructed. They
    are used in defining variables, function arguments, and return types, making them
    ubiquitous in any C program. Mastery of how and when to use these data types will
    significantly enhance the efficiency, clarity, and functionality of a programmer’s
    code.


    ### 5.1.1 Characteristics and Usage of Primitive Data Types


    The characteristics and usage of primitive data types in C programming are pivotal
    in understanding how data is handled and manipulated within a program. Each primitive
    data type in C - namely `char`, `int`, `float`, and `double` - has unique characteristics
    that define its usage, size, range, and the kind of operations that can be performed
    with it.


    **char**: The `char` type, short for character, is typically used to store individual
    characters like letters and symbols. It is generally 1 byte in size, allowing
    it to represent 256 different values, which cover the ASCII character set. This
    makes `char` suitable for storing characters, but it can also be used to store
    small integers. In C, `char` variables can be either signed or unsigned, affecting
    their value range (signed `char` ranges from -128 to 127, while `unsigned char`
    ranges from 0 to 255). The `char` type is often used in arrays to create strings
    (arrays of characters), making it fundamental for handling text.


    **int**: The `int` type is used for integer arithmetic. It''s the most commonly
    used type for representing whole numbers. The size of an `int` is usually 4 bytes
    (32 bits), but this can vary depending on the architecture, thus affecting its
    range (typically from -2,147,483,648 to 2,147,483,647 for a signed `int`). There
    are variations like `short int` and `long int` that offer different sizes and
    ranges. The `int` type is incredibly versatile and is used in various programming
    scenarios, from iterating over loops to performing arithmetic operations and managing
    data within structures.


    **float and double**: These types are used for floating-point numbers, or numbers
    with decimal points. The `float` type typically offers up to 7 digits of precision
    and is usually 4 bytes, making it suitable for many applications where floating-point
    arithmetic is needed but extensive precision is not critical. The `double` type,
    on the other hand, offers up to 15 digits of precision and is usually 8 bytes.


    ### 5.1.2 Data Type Modifiers in C


    Data type modifiers in C are used to alter the properties of types. The primary
    data type modifiers in C are `signed`, `unsigned`, `short`, `long`, and `long
    long`.


    - **signed and unsigned**: These modifiers are used with integer types (`int`)
    to specify whether a variable can hold negative values or only non-negative values.
    By default, `int` typically holds -2,147,483,648 to 2,147,483,647, while `unsigned
    int` can store 0 to 4,294,967,295. This is particularly useful in situations where
    negative values are not required.

    - **short and long**: These are used with `int` to create `short int` and `long
    int` (often referred to simply as `short` and `long`). A `short` is used for smaller
    integers and is typically 2 bytes, while a `long` is used for larger integers
    and is typically 4 or 8 bytes (depending on the platform). The use of `short`
    and `long` can optimize memory usage and performance, especially in large arrays
    or structures.

    - **long long**: This is an extension of the `long` modifier, creating a `long
    long int` type, which is even larger (typically 8 bytes). It is used when even
    larger integers are needed, beyond the range of a standard `long`.


    ### 5.2 Variables: Declaration, Initialization, and Scope


    In C programming, variables are fundamental entities that store data. Understanding
    variables involves grasping three key concepts: declaration, initialization, and
    scope. Each aspect plays a critical role in how data is managed and manipulated
    within a program.

