    \ integer and returns `1` if the number is even and `0` if it's odd.\n3. Create\
    \ a function `convertToMinutes` that converts hours to minutes. Call this function\
    \ with different values in `main`.\n4. Develop a function `findMax` that takes\
    \ three floating-point numbers as arguments and returns the largest of the three.\n\
    5. Write a function `swap` that exchanges the values of two integer variables\
    \ using pointers, and demonstrate it in `main`.\n6. Create a void function `printArray`\
    \ that takes an array of integers and its size, and prints all elements of the\
    \ array.\n7. Write a recursive function to calculate the `nth` Fibonacci number.\n\
    8. Implement a recursive function `sumOfDigits` that returns the sum of the digits\
    \ of a positive integer.\n9. Develop a recursive function that computes the sum\
    \ of all elements in an array.\n10. Create two functions, `incrementGlobal` and\
    \ `incrementStatic`, where each function attempts to increment a global and a\
    \ static variable, respectively. Demonstrate the difference in their behavior\
    \ when called multiple times from `main`.\n\nThese exercises cover a range of\
    \ topics related to functions in C, challenging you to apply the concepts of function\
    \ definition, recursion, variable scope, and more. They aim to enhance your understanding\
    \ and proficiency in using functions effectively in C programming.\n\n# Advanced\
    \ Topics\n\n# Chapter 9: Arrays and Strings in C\n\nIn C programming, arrays and\
    \ strings are fundamental concepts essential for storing and manipulating collections\
    \ of data. This chapter covers the intricacies of working with arrays and strings,\
    \ providing a deeper understanding of these crucial data structures.\n\n### 9.1\
    \ Defining and Accessing Arrays in C\n\nIn C programming, arrays are a powerful\
    \ and fundamental concept for storing and managing sequences of data of the same\
    \ type.\n\n#### Defining Arrays\n- An array in C is defined by specifying the\
    \ type of its elements and the number of elements it will hold.\n- Syntax: `type\
    \ arrayName[arraySize];`\n- Example: `int numbers[5];` - This declares an array\
    \ named `numbers` capable of holding five integers.\n\n#### 9.1.1 Array Declaration\
    \ and Initialization\nIn C programming, the declaration and initialization of\
    \ arrays are fundamental steps in managing collections of data. Understanding\
    \ these processes is crucial for effectively utilizing arrays in various applications.\n\
    \n**Array Declaration**: Declaring an array in C involves specifying the type\
    \ of its elements and the number of elements it can hold. This sets aside a block\
    \ of memory to store the array elements.\n- Basic Syntax: The syntax for declaring\
    \ an array is `type arrayName[size];`. Here, `type` is the data type of elements\
    \ (like `int`, `float`, `char`), `arrayName` is the identifier for the array,\
    \ and `size` is the number of elements it can store.\n- `int numbers[10];` - This\
    \ declares an array named `numbers` that can hold ten integers.\n- Memory Allocation:\
    \ When an array is declared, C allocates contiguous memory locations to hold its\
    \ elements. The size of the memory block is determined by the number of elements\
    \ and the size of each element (dependent on its type).\n\n**Array Initialization**:\
    \ Initialization of an array refers to assigning initial values to its elements\
    \ at the time of declaration. There are several ways to initialize arrays in C.\n\
    - **Explicit Initialization**: You can initialize an array by providing a list\
    \ of values. If fewer values are provided than the size of the array, the remaining\
    \ elements are automatically initialized to zero (for basic types).\n- Syntax:\
    \ `type arrayName[size] = {value1, value2, ...};`\n- Example: `int numbers[5]\
    \ = {1, 2, 3, 4, 5};`\n- **Partial Initialization**: If you initialize an array\
    \ with fewer values than its size, the rest of the elements are set to zero.\n\
    - Example: `int numbers[5] = {1, 2};` - Here, `numbers[2]`, `numbers[3]`, and\
    \ `numbers[4]` will be automatically set to 0.\n- **Omitting Size During Initialization**:\
    \ You can declare an array without specifying its size if you immediately initialize\
    \ it. The size is then inferred from the number of values in the initializer.\n\
    - Example: `int numbers[] = {1, 2, 3, 4, 5};` - The size of `numbers` is inferred\
    \ to be 5.\n\n**Character Arrays and Strings**:\n- A special case of array initialization\
    \ is the initialization of character arrays, often used to store strings.\n- Example:\
    \ `char name[6] = \"Alice\";` - This initializes a character array with a string.\
    \ Note that the size of the array includes space for the null terminator `\\0`\
    \ that marks the end of the string.\n\n**Best Practices**:\n- Ensure the array\
    \ size is sufficient to hold all the required elements.\n"
