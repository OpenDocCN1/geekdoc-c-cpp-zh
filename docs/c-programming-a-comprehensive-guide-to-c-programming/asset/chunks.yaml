- fmt: "\n# Syntax and Best Practices\n\nUsing `break` statements to prevent fall-through\
    \ between cases, and having a `default` case as a catch-all, are considered good\
    \ practices.\n\nI recall an incident with one of my students, who was working\
    \ on a project involving a menu-driven program. The student initially used multiple\
    \ nested `if-else` statements to handle the menu options. While this approach\
    \ worked, it resulted in a convoluted and hard-to-maintain block of code. After\
    \ a discussion, we refactored the code using a `switch-case` statement. This not\
    \ only made the code more organized and readable but also significantly simplified\
    \ the addition of new menu options in the future.\n\nconditional statements are\
    \ indispensable in C programming, allowing for dynamic and responsive code. Whether\
    \ it's an `if` statement for simple decisions, an `if-else` for binary choices,\
    \ or a `switch-case` for multiple distinct options, these structures form the\
    \ backbone of logic in C programs. Understanding when and how to use these constructs\
    \ effectively is key to writing clean, efficient, and maintainable code.\n\n##\
    \ 7.1.1 Making Decisions in Code\n\nMaking decisions in code is a fundamental\
    \ aspect of programming, allowing your programs to respond differently under various\
    \ conditions. This decision-making process in C is primarily handled through conditional\
    \ statements like `if`, `if-else`, and `switch-case`. Understanding how to effectively\
    \ use these constructs is crucial for creating dynamic and responsive programs.\n\
    \n### if Statement\n\n* The `if` statement is the simplest form of decision-making\
    \ in C. It evaluates a condition and executes a block of code if the condition\
    \ is true.\n\nExample:\n\n```c\nif (temperature > 100) {\n    printf(\"Water is\
    \ boiling.\\n\");\n}\n```\n\n### if-else Statement\n\n* The `if-else` statement\
    \ extends the `if` statement by providing an alternative path of execution if\
    \ the condition is false.\n\n![](images/00008.jpeg)\n\nExample:\n\n```c\nif (score\
    \ >= 50) {\n    printf(\"You passed.\\n\");\n}\nelse {\n    printf(\"You failed.\\\
    n\");\n}\n```\n\n### switch-case Statement\n\nThe `switch-case` statement is used\
    \ for making decisions based on the value of a variable. It's a cleaner alternative\
    \ to multiple `if-else` blocks when the same variable is being tested against\
    \ various values.\n\n![](images/00009.jpeg)\n\nExample:\n\n```c\nswitch (day)\
    \ {\ncase 1: printf(\"Monday\\n\"); break;\ncase 2: printf(\"Tuesday\\n\"); break;\n\
    \ // More cases\ndefault: printf(\"Invalid day\\n\");\n}\n```\n\n### Best Practices\
    \ in Decision-Making\n\n* Use clear and concise conditions. Complex conditions\
    \ can be broken down into multiple simpler `if` statements for clarity.\n* Always\
    \ use braces `{}` for the code blocks in `if` and `else` statements, even if there\
    \ is only one statement to execute. This enhances readability and reduces errors\
    \ during code modifications.\n* In `switch-case`, always include a `default` case\
    \ to handle unexpected values.\n\nDecision-making in code is about choosing the\
    \ right structure for your logic. Whether it's a simple `if` for single-condition\
    \ checks, an `if-else` for binary decisions, or a `switch-case` for multiple distinct\
    \ choices, these constructs allow you to control the flow of your program effectively.\
    \ The key to mastering decision-making in programming lies in understanding the\
    \ scenario and choosing the structure that offers clarity, efficiency, and maintainability.\n\
    \n## 7.1.2 Switch-case for Multi-way Branching\n\nThe `switch-case` statement\
    \ in C programming is a powerful control structure used for multi-way branching.\
    \ It allows a variable to be tested for equality against a list of values, each\
    \ defined in a `case` statement, making it a more efficient and readable alternative\
    \ to multiple `if-else` statements when dealing with numerous conditions.\n\n\
    ### Understanding Switch-case\n\n* **Structure**: The `switch` statement evaluates\
    \ an expression and compares its value against various `case` labels. If a match\
    \ is found, the program executes the corresponding block of code associated with\
    \ that `case`.\n* **Break Statement**: Typically, a `break` statement follows\
    \ each `case` block to prevent the execution from falling through to the subsequent\
    \ `case` statements. Without `break`, the program continues executing the following\
    \ `case` blocks until it encounters a `break` or the end of the `switch`.\n* **Default\
    \ Case**: The `default` case in a `switch` statement is executed if none of the\
    \ `case` labels match the value of the expression. It's optional but recommended\
    \ for handling unexpected or default cases.\n\n### Example of Switch-case\n\n\
    ```c\nswitch (dayOfWeek) {\ncase 1:\n    printf(\"Monday\");\n    break;\ncase\
    \ 2:\n    printf(\"Tuesday\");\n    break;\n // Additional cases for other days\n\
    default:\n    printf(\"Invalid day\");\n}\n```\n\n### Advantages of Switch-case\n\
    \n* **Clarity**: It provides clear and organized code, especially when there are\
    \ multiple conditions to check against a single variable.\n* **Efficiency**: In\
    \ many cases, `switch-case` can be more efficient than multiple `if-else` statements,\
    \ as the compiler may optimize the switch to a jump table, reducing the number\
    \ of comparisons needed.\n* **Readability**: It enhances readability and maintainability,\
    \ particularly in scenarios where a variable needs to be compared with several\
    \ constants.\n\n### Best Practices\n\n* Always include a `break` statement in\
    \ each `case` unless intentional fall-through is required.\n* Use the `default`\
    \ case to handle unexpected values or as a catch-all case.\n* Keep each `case`\
    \ statement simple and focused. If the code for a case becomes too complex, consider\
    \ calling a function.\n\nThe `switch-case` statement is a critical tool for implementing\
    \ multi-way branching in C programs. It simplifies the decision-making process\
    \ when one needs to perform different actions based on the value of a single variable.\n\
    \n## 7.2 Loops: for, while, do-while\n\nIn C programming, loops are fundamental\
    \ constructs that allow you to execute a block of code repeatedly under certain\
    \ conditions. This repetition is essential for tasks that require iterative processing,\
    \ such as traversing arrays, performing calculations multiple times, or handling\
    \ repetitive input. The three primary types of loops in C are for, `while`, and\
    \ `do-while`.\n\n### 7.2.1 Looping Constructs\n\nLooping constructs in C programming\
    \ are essential for executing a block of code repeatedly under a specified condition.\
    \ They are fundamental building blocks in creating efficient, concise, and manageable\
    \ programs. C provides several looping constructs, each designed for specific\
    \ scenarios: the `for` loop, the `while` loop, and the `do-while` loop.\n\n###\
    \ for Loop\n\n* **Usage**: Ideal when the number of iterations is known. It consists\
    \ of an initialization statement, a loop condition, and an increment/decrement\
    \ expression.\n* **Structure**: `for (initialization; condition; increment/decrement)\
    \ { // code }`\n* **Characteristic**: All control aspects (initialization, condition\
    \ checking, and incrementing) are compactly written in a single line, making `for`\
    \ loops succinct and easy to read.\n\nExample:\n\n```c\nfor (int i = 0; i < 5;\
    \ i++) {\n    printf(\"%d \", i);\n}\n```\nThis loop prints numbers from 0 to\
    \ 4.\n\n### while Loop\n\n* **Usage**: Suitable for situations where the number\
    \ of iterations isn't known in advance. The loop continues as long as the condition\
    \ is true.\n* **Structure**: `while (condition) { // code }`\n* **Characteristic**:\
    \ The condition is evaluated before executing the loop's body, making it possible\
    \ that the loop body may not execute at all if the condition is initially false.\n\
    \nExample:\n\n```c\nint i = 0;\nwhile (i < 5) {\n    printf(\"%d \", i);\n   \
    \ i++;\n}\n```\nThis loop, like the `for` loop example, prints numbers from 0\
    \ to 4.\n\n### do-while Loop\n\n* **Usage**: Used when the loop body needs to\
    \ be executed at least once, regardless of the condition. The condition is checked\
    \ after executing the loop's body.\n"
