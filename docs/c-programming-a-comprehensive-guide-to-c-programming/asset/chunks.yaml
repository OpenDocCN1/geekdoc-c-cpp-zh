- fmt: "\nContinuing with the previous example, suppose `ptr` now points to `array[3]`.\
    \ If you apply the decrement operation (`ptr--`), the pointer shifts to `array[2]`.\
    \ Here, the pointer moves backward in memory by the size of an integer (4 bytes\
    \ on many systems).\n\n```c\nptr = &array[3]; // Pointing to the fourth element\n\
    ptr--; // Now pointing to the third element\n```\n\n### Practical Implications\n\
    This ability to increment and decrement pointers is particularly useful in scenarios\
    \ such as iterating over an array. For example, you could use a loop to traverse\
    \ an array without using array indexing:\n\n```c\nfor (int i = 0; i < 5; i++)\
    \ {\n    printf(\"%d \", *ptr);\n    ptr++;\n}\n```\n\nIn this loop, `ptr` starts\
    \ at the beginning of `array` and moves through each element, accessing its value\
    \ using dereferencing (`*ptr`), until it reaches the end of the array.\n\n## 10.2.2\
    \ Pointers and Arrays in C\n\nIn C programming, the relationship between pointers\
    \ and arrays is a fundamental concept that reveals the efficiency and flexibility\
    \ of the language in handling data sequences. This interplay is crucial for understanding\
    \ how arrays are accessed and manipulated under the hood.\n\n### Fundamental Link\
    \ Between Pointers and Arrays\nAt its core, an array in C is a contiguous block\
    \ of memory. The array name, when used without an index, acts as a pointer to\
    \ the first element of the array. This means that the array name itself can be\
    \ thought of as a constant pointer.\n\nFor example, if you declare an array `int\
    \ arr[5];`, `arr` can be used as a pointer to the first element of the array,\
    \ `arr[0]`.\n\n### Pointer Arithmetic with Arrays\nBecause arrays and pointers\
    \ are so closely linked, you can perform pointer arithmetic on arrays. Incrementing\
    \ an array name (as a pointer) moves to the next element, and decrementing moves\
    \ to the previous element.\n\nConsider the following:\n\n```c\nint arr[5] = {\
    \ 10, 20, 30, 40, 50 };\nint* ptr = arr; // Equivalent to int *ptr = &arr[0];\n\
    ```\n\nIn this case, `ptr` points to `arr[0]`. Using `ptr++` would then point\
    \ to `arr[1]`, and so on.\n\n### Accessing Array Elements Using Pointers\nYou\
    \ can access array elements using pointers, either by pointer arithmetic or by\
    \ using array indexing with pointers. This is possible because the array elements\
    \ are stored in contiguous memory locations.\n\nFor example:\n\n```c\nprintf(\"\
    %d\\n\", *(arr + 2)); // Accessing the third element, equivalent to arr[2]\nprintf(\"\
    %d\\n\", ptr[2]); // Also accessing the third element\n```\n\n### Iterating Over\
    \ an Array Using Pointers\nPointer arithmetic allows for iteration over an array\
    \ without using traditional array indexing. This can lead to more compact and\
    \ efficient code, especially in functions that operate on arrays.\n\nExample of\
    \ iterating over an array using a pointer:\n\n```c\nfor (int i = 0; i < 5; i++)\
    \ {\n    printf(\"%d \", *(ptr + i)); // Accessing array elements\n}\n```\n\n\
    ### Passing Arrays to Functions\nWhen you pass an array to a function, you are\
    \ essentially passing a pointer to the first element of the array. Inside the\
    \ function, this pointer can be used to access the array elements.\n\nExample\
    \ of a function taking an array:\n\n```c\nvoid printArray(int* array, int size)\
    \ {\n    for (int i = 0; i < size; i++) {\n        printf(\"%d \", array[i]);\
    \ // Using array indexing on the pointer\n    }\n}\n```\n\nUnderstanding the relationship\
    \ between pointers and arrays in C is key to writing efficient and powerful code.\
    \ This relationship allows for flexible manipulation of arrays, efficient passing\
    \ of arrays between functions, and a deeper understanding of how C handles data\
    \ sequences. Mastery of pointers and arrays unlocks a greater potential in C programming,\
    \ from simple data processing to complex memory manipulation.\n\n## 10.3 Pointers\
    \ to Functions in C\n\nIn C programming, pointers to functions are a sophisticated\
    \ feature that greatly enhances the language's flexibility and power. They allow\
    \ functions to be passed around and used in the same way as variables, opening\
    \ up possibilities for more dynamic and versatile program designs.\n\n### The\
    \ Concept of Function Pointers\nA function pointer, as the name suggests, is a\
    \ pointer that points to a function. Unlike regular pointers that point to data,\
    \ function pointers hold the address of a block of executable code. This ability\
    \ to reference and invoke functions dynamically is essential in scenarios where\
    \ you need to select and execute functions at runtime based on certain conditions\
    \ or inputs.\n\n### Declaring a Function Pointer\nThe declaration of a function\
    \ pointer might initially appear complex, but it follows a logical structure.\
    \ The declaration includes the return type of the function, followed by an asterisk\
    \ `*`, the name of the pointer, and the parameter list of the function. It’s important\
    \ that the parameter list and return type of the function pointer match those\
    \ of the function it intends to point to.\n\nFor example, consider a function\
    \ `add` that takes two integers and returns their sum:\n\n```c\nint add(int a,\
    \ int b) {\n    return a + b;\n}\n```\n\nA function pointer to `add` can be declared\
    \ as:\n\n```c\nint (*funcPtr)(int, int);\nfuncPtr = add; // Assigning the address\
    \ of 'add' to funcPtr\n```\n\nHere, `funcPtr` is a pointer to any function that\
    \ takes two integers as arguments and returns an integer.\n\n### Using Function\
    \ Pointers\nOnce you have a function pointer, you can use it to call the function\
    \ it points to. This is done by using the function pointer just like a regular\
    \ function call, but with the pointer name instead of the function name.\n\nIn\
    \ the above example, you can call `add` using `funcPtr`:\n\n```c\nint result =\
    \ funcPtr(3, 4);\n```\n\nThis feature is particularly useful for callback functions,\
    \ where a function pointer is passed to another function and called back within\
    \ that function. It enables a form of polymorphism in C, allowing for more dynamic\
    \ and flexible code.\n\n### Advantages of Using Functionointers\nFunction pointers\
    \ are instrumental in creating more adaptable and modular code. They can be used\
    \ to:\n\n- Implement callback functions, greatly enhancing the flexibility of\
    \ code by allowing functions to be passed as arguments.\n- Create arrays or tables\
    \ of function pointers, useful in implementing function-up tables, thereby avoiding\
    \ complex switch or if-else chains.\n- Facilitate event-driven programming, where\
    \ different functions can be dynamically associated with different events.\n\n\
    ### Exercises\n\n1. Write a program that declares an integer and a pointer to\
    \ an integer. Assign the address of the integer to the pointer and use the pointer\
    \ to modify the value of the integer.\n2. Create a function that swaps the values\
    \ of two integers using pointers and the address-of and indirection operators.\n\
    3. Write a program where an integer array and a pointer to its first element are\
    \ declared. Use pointer arithmetic to iterate over the array and print its elements.\n\
    4. Create a character array and a pointer to its first element. Use pointer increment\
    \ and decrement operations to traverse the array.\n5. Define a function that takes\
    \ an integer array and its size as arguments and prints the array in reverse order\
    \ using pointers.\n6. Write a program that includes functions for adding, subtracting,\
    \ multiplying, and dividing two numbers. Create a function pointer and assign\
    \ it to each of these functions in turn, demonstrating the concept of a pointer\
    \ to a function.\n7. Declare a pointer to a double and allocate memory for it\
    \ dynamically using `malloc`. Assign a value to it and then free the allocated\
    \ memory.\n8. Implement a function that calculates the square of a number and\
    \ returns it through a pointer argument.\n9. Create a string (character array)\
    \ and a pointer to it. Use pointer arithmetic to count the number of characters\
    \ in the string, excluding the null terminator.\n10. Define an array of pointers\
    \ to functions where each function takes two integers as arguments and returns\
    \ an integer. Populate the array with pointers to the functions created in exercise\
    \ 6 and demonstrate the invocation of these functions through the array.\n"
