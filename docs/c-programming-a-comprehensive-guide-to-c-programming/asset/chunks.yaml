    `float` 和 `double`: 这两种数据类型用于表示浮点数，即带有小数部分的数字。虽然 `float` 为许多应用提供了足够的精度，且大小通常为
    4 字节，但 `double` 提供了更高的精度且通常为 8 字节。在 `float` 和 `double` 之间的选择取决于精度需求和可用的计算资源。例如，`float
    temperature = 98.6;` 和 `double pi = 3.14159265359;` 分别声明了一个浮点数和一个双精度浮点数变量。


    每种数据类型都有特定的用途。`char` 对于处理文本数据至关重要，`int` 用于通用整数运算，而 `float` 和 `double` 则用于需要小数的计算。数据类型的选择会影响内存占用和计算效率。例如，在
    `char` 足够的情况下使用 `int` 会导致不必要的内存消耗，而使用 `float` 代替 `double` 可能会导致需要高精度计算的精度损失。


    理解这些基本数据类型至关重要，因为它们是构建复杂数据结构和操作的基石。它们被用于定义变量、函数参数和返回类型，使得它们在任何 C 程序中无处不在。掌握如何以及何时使用这些数据类型将显著提高程序员代码的效率、清晰度和功能性。


    ### 5.1.1 基本数据类型的特征和用法


    C 语言中基本数据类型的特征和用法对于理解程序内部如何处理和操作数据至关重要。C 语言中的每个基本数据类型——即 `char`、`int`、`float`
    和 `double`——具有独特的特征，定义了它们的用途、大小、范围以及可以对其执行的操作。


    **char**: `char` 类型是字符的缩写，通常用于存储单个字符，如字母和符号。它通常为 1 字节，能够表示 256 个不同的值，涵盖了 ASCII
    字符集。这使得 `char` 适用于存储字符，也可以用于存储小整数。在 C 中，`char` 变量是有符号或无符号的，这会影响它们的取值范围（有符号 `char`
    范围从 -128 到 127，而无符号 `unsigned char` 范围从 0 到 255）。`char` 类型经常用于数组以创建字符串（字符数组），使其成为处理文本的基础。


    **int**: `int` 类型用于整数算术。它是表示整数最常用的类型。`int` 的大小通常为 4 字节（32 位），但这取决于架构，从而影响其范围（对于有符号
    `int`，通常范围从 -2,147,483,648 到 2,147,483,647）。存在像 `short int` 和 `long int` 等变体，它们提供了不同的大小和范围。`int`
    类型非常多能，用于各种编程场景，从循环迭代到执行算术运算以及管理结构体内部的数据。


    **float and double**: 这些类型用于浮点数或带有小数点的数字。`float` 类型通常提供多达 7 位精度，且通常为 4 字节，适用于许多需要浮点运算但对极大精度不是至关重要的应用。另一方面，`double`
    类型提供多达 15 位精度，通常为 8 字节。


    ### 5.1.2 C 中的数据类型修饰符


    C 语言中的数据类型修饰符用于更改类型的属性。C 语言中的主要数据类型修饰符有 `signed`、`unsigned`、`short`、`long` 和 `long
    long`。


    - **signed and unsigned**: 这些修饰符用于整数类型（`int`），用于指定变量可以包含负值还是仅包含非负值。默认情况下，`int`
    通常持有 -2,147,483,648 到 2,147,483,647，而 `unsigned int` 可以存储 0 到 4,294,967,295。这在不需要负值的情况下特别有用。

    - **short and long**: 这些用于 `int` 用于创建 `short int` 和 `long int`（通常简称为 `short` 和
    `long`）。`short` 用于较小的整数，通常为 2 字节；而 `long` 用于较大的整数，通常为 4 或 8 字节（取决于平台）。使用 `short`
    和 `long` 可以优化内存使用和性能，特别是在大型数组或结构体中。

    - **long long**: 这是 `long` 修饰符的扩展，创建了 `long long int` 类型，它的范围更大（通常为 8 字节）。当需要超出标准
    `long` 范围更大的整数时使用它。


    ### 5.2 变量：声明、初始化和作用域


    在 C 语言编程中，变量是存储数据的基本实体。理解变量涉及掌握三个关键概念：声明、初始化和作用域。每个方面对于程序内管理和操作数据都起着关键作用。


