    \nfor  (int i = 0; i < 3; i++)  {\n\n for  (int j = 0; j < 3; j++)  {\n\n if \
    \ (i == j)  {\n\n // Nested logic\n\n if  (another_condition)  {\n\n // More nested\
    \ logic\n\n }\n\n }\n\n }\n\n}\n\nWorkaround: Refactor deeply nested structures\
    \ into separate functions or use early returns/exits to simplify the logic.\n\n\
    Control structures are indispensable in C programming, but they require careful\
    \ usage to avoid common pitfalls. The key is to maintain clarity and simplicity\
    \ in your code. Always consider readability and maintainability when designing\
    \ your program's logic, and refactor complex sections into smaller, more manageable\
    \ pieces. This approach leads to more robust, error-free, and maintainable code.\n\
    \nexercises\n\n1) Write a C program using  if-else to check if a number is positive,\
    \ negative, or zero.\n\n2) Create a program using  if-else statements to categorize\
    \ the age group of a person (child, teenager, adult, senior).\n\n3) Develop a\
    \ C program using a  switch-case to simulate a simple calculator (add, subtract,\
    \ multiply, divide).\n\n4) Write a program using  switch-case where based on a\
    \ weekday number input (1-7), it prints the name of the day.\n\n5) Develop a program\
    \ to determine if a character entered is an uppercase letter, lowercase letter,\
    \ digit, or a special character.\n\n6) Write a C program that uses multiple  if-else\
    \ statements to find the largest of three numbers.\n\n7) Create a C program using\
    \  switch-case to print the month name given the month number.\n\n8) Develop a\
    \ program that uses a  switch-case to convert a given numeral from 1-5 into its\
    \ word form.\n\n9) Write a C program using a  for loop to print the first 10 natural\
    \ numbers.\n\n10) Create a  while loop in C that sums up numbers from 1 to 100.\n\
    \n11) Write a C program using nested  for loops to print a 5x5 star pattern.\n\
    \n12) Develop a program to find the factorial of a number using a  for loop.\n\
    \n13) Create a program using a  for loop that prints numbers from 1 to 10 but\
    \ skips the number 5 using the  continue statement.\n\n14) Write a  while loop\
    \ that normally counts from 1 to 10 but stops prematurely with a  break statement\
    \ when a certain condition is met.\n\n15) Develop a C program that uses nested\
    \ loops to calculate the sum of all the elements in a 3x3 matrix."
