  raw: '*   Prefix Increment: When used as a prefix (e.g.,  ++var), the variable is
    incremented first, and then its new value is used or returned in the expression.


    *   Postfix Increment: When used as a postfix (e.g.,  var++), the current value
    of the variable is used or returned in the expression first, and then it is incremented.


    Example:


    int counter = 5;


    int a =  ++counter;  // Prefix: counter is now 6, a is 6


    int b = counter++;  // Postfix: counter is now 7, b is 6


    In this example,  a is assigned the value  6 because  counter is incremented before
    the assignment. In contrast,  b is assigned  6, which was the value of  counter
    before it was incremented to  7.


    Decrement Operator (--):


    *   Usage: The decrement operator subtracts one from the current value of a variable.
    Similar to the increment operator, it also has prefix (--var) and postfix (var--)
    forms.


    *   Prefix Decrement: In the prefix form (e.g.,  --var), the variable is decremented
    first, and then its new value is used or returned.


    *   Postfix Decrement: In the postfix form (e.g.,  var--), the current value of
    the variable is used or returned first, and then it is decremented.


    Example:


    int number = 5;


    int x =  --number;  // Prefix: number is now 4, x is 4


    int y = number--;  // Postfix: number is now 3, y is 4


    Here,  x is assigned the value  4 because  number is decremented before the assignment.
    Conversely,  y is assigned  4, which was the value of  number before it was decremented
    to  3.


    Importance in Loops and Arrays: Increment and decrement operators are extensively
    used in loop constructs like  for and  while loops, especially when traversing
    arrays or performing repetitive tasks. Their concise syntax makes the code cleaner
    and often more readable, especially in loop headers.


    Example in a Loop:


    for  (int i = 0; i < 10; i++)  {


        printf("%d ", i);


    }


    In this  for loop,  i++ succinctly expresses the logic to increment  i in each
    iteration until it reaches  10.


    The increment and decrement operators are powerful tools in C programming, enabling
    concise and efficient manipulation of numerical values. They are especially useful
    in scenarios involving iteration and sequential operations. Their correct usage,
    particularly understanding the distinction between their prefix and postfix forms,
    is essential for writing clear and effective C code.


    6.2 Relational and Logical Operators in C


    In C programming, relational and logical operators play a crucial role in decision-making
    and controlling the flow of the program. These operators allow the program to
    perform comparisons and logical operations, forming the basis of conditional statements
    like  if,  while, and  for.


    Relational Operators: Relational operators are used to compare values, returning
    a boolean result (1 for true,  0 for false). They are fundamental in expressions
    that involve decision-making.


    *   Greater Than (>): Checks if the left operand is greater than the right operand.


    *   Less Than (<): Checks if the left operand is less than the right operand.


    *   Greater Than or Equal to (>=): Checks if the left operand is greater than
    or equal to the right operand.


    *   Less Than or Equal to (<=): Checks if the left operand is less than or equal
    to the right operand.


    *   Equal to (==): Checks if the two operands are equal.


    *   Not Equal to (!=): Checks if the two operands are not equal.


    Example:


    int a = 5, b = 10;


    int result1 =  (a < b);  // result1 is 1 (true)


    int result2 =  (a == b);  // result2 is 0 (false)


    In this example,  result1 gets the value  1 because  5 is indeed less than  10.  result2
    gets  0 because  5 is not equal to  10.


    Logical Operators: Logical operators are used to combine or modify boolean conditions.
    They operate on boolean values and return boolean results.


    *   Logical AND (&&): Returns true if both operands are true.


    *   Logical OR (||): Returns true if at least one of the operands is true.


    *   Logical NOT (!): Inverts the truth value of the operand.


    Example:


    int x = 5, y = 10;


    int condition1 =  (x < y)  &&  (y > 0);  // condition1 is 1 (true)


    int condition2 =  (x > y)  ||  (y == 10);  // condition2 is 1 (true)


    int condition3 =  !(x == y);  // condition3 is 1 (true)


    Here,  condition1 evaluates to true because both  (x < y) and  (y > 0) are true.  condition2
    is true because one of its operands,  (y == 10), is true.  condition3 is true
    because  (x == y) is false, and the  ! operator inverts it.


    Importance in Control Flow: Relational and logical operators are key in constructing
    conditions for control flow statements. They enable a program to make decisions,
    repeat actions, and alter its behavior based on different inputs or states.


    Example in Conditional Statement:


    if  ((a < b)  &&  (b > 0))  {


        printf("Both conditions are true.\n");


    }


    In this  if statement, the message will be printed only if both conditions  (a
    < b) and  (b > 0) are true.


    6.2.1 Comparing Values in C


    In C programming, comparing values is a fundamental operation that lies at the
    heart of decision-making and control flow. The ability to compare values allows
    a program to branch in different directions based on certain conditions, execute
    loops a certain number of times, or evaluate complex expressions. This comparison
    is primarily achieved through relational operators.


    Relational Operators for Comparison:


    *   Equal to (==): This operator checks if two values are equal. If they are,
    it returns 1 (true); otherwise, it returns 0 (false).


    *   Not Equal to (!=): This operator checks if two values are not equal. It returns
    1 if they are not equal, and 0 if they are equal.


    *   Greater Than (>): Returns 1 if the value on the left is greater than the value
    on the right; otherwise, it returns 0.


    *   Less Than (<): Returns 1 if the value on the left is less than the value on
    the right; otherwise, it returns 0.


    *   Greater Than or Equal to (>=): Returns 1 if the left operand is greater than
    or equal to the right operand; otherwise, it returns 0.


    *   Less Than or Equal to (<=): Returns 1 if the left operand is less than or
    equal to the right operand; otherwise, it returns 0.


    Example:


    int a = 5, b = 10;


    int isEqual =  (a == b);  // isEqual will be 0 (false)


    int isNotEqual =  (a != b);  // isNotEqual will be 1 (true)


    int isGreaterThan =  (a > b);  // isGreaterThan will be 0 (false)


    int isLessThan =  (a < b);  // isLessThan will be 1 (true)


    In these examples,  isEqual is  0 because  5 is not equal to  10.  isNotEqual
    is  1 because  5 is indeed not equal to  10. Similarly,  isGreaterThan is  0 (as  5
    is not greater than  10), and  isLessThan is  1 (as  5 is less than  10).


    Importance in Programming Logic: Comparing values is essential in many programming
    constructs, such as  if statements,  while loops, and  for loops. These comparisons
    form the conditions that dictate the flow of execution in the program.


    Example in an  if Statement:


    if  (a < b)  {


        printf("a is less than b.\n");


    }


    else  {


        printf("a is not less than b.\n");


    }


    In this code, the message "a is less than b." is printed because the condition  (a
    < b) evaluates to true.


    The ability to compare values accurately and effectively is a cornerstone of logical
    decision-making in C programming. Whether it''s controlling the flow of a program,
    validating input, or performing calculations based on conditions, understanding
    and using relational operators for comparison is fundamental. This understanding
    not only helps in writing effective code but also in debugging and optimizing
    existing code.


    6.2.2 Logical AND, OR, and NOT in C


    In C programming, logical operators such as AND (&&), OR (||), and NOT (!) are
    crucial for constructing complex logical expressions. These operators allow for
    combining multiple boolean conditions to control the flow of a program, making
    decisions, and executing specific code blocks based on varying criteria.


