    1. Create an integer array of size 10 and initialize it with even numbers starting
    from 2.

    2. Declare a float array of size 5 and initialize it with decimal values.

    3. Write a program to calculate the sum of all elements in an integer array using
    indexing.

    4. Define a 3x3 matrix of integers and initialize it with any set of numbers.

    5. Create a two-dimensional char array (5x5) and initialize it to represent a
    simple cross (''X'') pattern.

    6. Initialize a 4x4 multi-dimensional array and write a loop to transpose the
    matrix.

    7. Write a program to find the length of a string using the `strlen` function
    without directly using the `strlen()` library function.

    8. Create a character array and initialize it as a null-terminated string. Then,
    replace a character in it and print the modified string.

    9. Write a program to concatenate two given strings using `strcat()` and display
    the result.

    10. Create a program that compares two strings using `strcmp()` and prints whether
    they are identical or not.

