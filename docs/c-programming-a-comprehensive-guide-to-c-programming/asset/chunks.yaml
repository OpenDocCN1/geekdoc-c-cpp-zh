    If the operand is true, the result is false, and vice versa. It’s often used to
    reverse a condition''s logic.


    Example:


    int isRaining = 0;


    if  (!isRaining)  {


        printf("It''s a clear day!\n");


    }


    In this case,  !isRaining turns  0 (false) into  1 (true), so the message is printed.
    It effectively checks if it''s not raining.


    Importance in Control Structures: Logical operators are particularly powerful
    in control structures like  if,  while, and  for statements. They enable programmers
    to implement complex logical conditions that depend on multiple variables or states.


    Complex Condition Example:


    if  ((age >= 18 && hasLicense)  ||  (isWeekend &&  !isRaining))  {


        printf("Go for a drive!\n");


    }


    In this more complex condition, the message will be printed if the person is eligible
    to drive (either by being 18 or older with a license) or if it''s a clear weekend
    day (weekend and not raining).


    6.3 Assignment and Bitwise Operators in C


    In C programming, assignment and bitwise operators serve distinct but critical
    roles in handling and manipulating data at both the high-level (variable assignment)
    and low-level (bit manipulation) aspects of a program.


    Assignment Operators:


    Assignment operators are used to assign values to variables. The most basic assignment
    operator is  =, but C also provides a set of compound assignment operators that
    combine arithmetic operations with assignment.


    Basic Assignment (=): Assigns the value on the right to the variable on the left.


    Example:


    int a = 5;  // Assigns 5 to a


    Compound Assignment Operators: These include  +=,  -=,  *=,  /=, and  %=. Each
    of these operators performs an arithmetic operation on the variable and then assigns
    the result back to that variable.


    Examples:


    int b = 10;


    b += 5;  // Equivalent to b = b + 5; b is now 15


    b -= 2;  // Equivalent to b = b - 2; b is now 13


    Compound assignment operators make the code more concise and often more readable,
    particularly in scenarios involving iterative calculations or accumulations.


    Bitwise Operators:


    Bitwise operators, on the other hand, operate at the bit level, which is the most
    granular level of data in a computer. These operators are used for manipulating
    data at the bit level, which is useful in low-level programming, like device drivers,
    system software, and certain optimized algorithms.


    *   Bitwise AND (&): Performs a logical AND operation on each pair of corresponding
    bits of its two operands. The result is  1 only if both bits are  1.


    *   Bitwise OR (|): Performs a logical OR operation on each pair of corresponding
    bits. The result is  1 if either bit is  1.


    *   Bitwise XOR (^): Performs a logical exclusive OR operation on each pair of
    bits. The result is  1 if the bits are different,  0 if they are the same.


    *   Bitwise NOT (~): Inverts all the bits of its operand.


    *   Shift Operators (<< and  >>): These operators shift the bits of the operand
    left or right by a specified number of positions.


    Example:


    unsigned  int x = 12;  // Binary: 1100


    unsigned  int y = x >> 2;  // Binary shift right by 2: y is now 0011, or 3 in
    decimal


    In this example, shifting the bits of  x (which is  1100 in binary) right by 2
    positions results in  0011, which is  3 in decimal.


    Importance in Programming: Assignment operators are fundamental in almost all
    aspects of C programming. They are used for setting and updating the values of
    variables, which is a basic operation in any program. Bitwise operators are essential
    for tasks that require direct manipulation of bits, which is common in system
    programming, encryption algorithms, and situations where performance is critical.


    Understanding both assignment and bitwise operators is crucial for C programmers.
    While assignment operators are part of the day-to-day toolkit for most programming
    tasks, bitwise operators are indispensable for specific scenarios that require
    low-level data manipulation. Both sets of operators contribute to the powerful
    and versatile nature of C, allowing programmers to write both high-level abstracted
    code and low-level direct memory manipulation code.


    6.4 Operator Precedence and Associativity in C


    Operator precedence and associativity are fundamental concepts in C programming,
    crucial for understanding how complex expressions are evaluated. These concepts
    determine the order in which operators are processed in an expression, which can
    significantly affect the outcome of the expression.


    Operator Precedence:


    *   Operator precedence refers to the rules that dictate the order in which different
    operators in an expression are evaluated. In C, different types of operators have
    different levels of precedence.


    *   For example, multiplication (*) and division (/) operators have a higher precedence
    than addition (+) and subtraction (-). This means that in an expression like  a
    + b * c, the multiplication is performed first, followed by the addition.


    Example:


    int result = 2 + 3 * 4;  // result is 14, not 20


    In this example,  3 * 4 is evaluated first due to higher precedence, resulting
    in  12, and then  2 is added to it.


    Associativity:


    Associativity determines the order in which operators of the same precedence are
    processed. In C, most operators are left-associative, meaning operators with the
    same precedence are evaluated from left to right.


    An exception is the assignment operator (=) and its compound forms (+=,  -=, etc.),
    which are right-associative.


    Example:


    int a = 5, b = 10, c = 15;


    int result = a + b - c;  // Evaluated as (a + b) - c


    int assigned = a = b = c;  // Right-associative, evaluated as a = (b = c)


    In the first example,  a + b is evaluated first, followed by  - c, due to left-to-right
    associativity. In the second example,  b = c is evaluated first because of right-to-left
    associativity, and then  a = b.


    Importance of Understanding Precedence and Associativity:


    *   Misunderstanding operator precedence and associativity is a common source
    of errors in C programming. It can lead to unexpected results, especially in complex
    expressions.


    *   Knowing these rules helps in reading and writing more accurate and reliable
    code. It''s often a good practice to use parentheses to explicitly specify the
    intended order of operations, which improves readability and reduces the likelihood
    of errors.


    Parentheses Example:


    int result =  (2 + 3)  * 4;  // Using parentheses to change the order


    Here, the addition is performed first due to the parentheses, and then the result
    is multiplied by  4.


    6.4.1 Order of Operations in C


    Understanding the order of operations, dictated by operator precedence and associativity,
    is crucial in C programming. It determines how complex expressions are evaluated
    and ensures the correct interpretation of the code''s logic. Misinterpretation
    of this order can lead to subtle bugs and unintended results.


