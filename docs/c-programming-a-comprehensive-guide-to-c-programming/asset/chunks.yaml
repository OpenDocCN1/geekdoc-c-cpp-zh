    \ `findMax` takes three floating-point numbers and returns the largest. The function\
    \ is tested in `main`.\n\n### Exercise 5: Swap Two Integers Using Pointers\n\n\
    ```c\nvoid swap(int* a, int* b) {\n  int temp = *a;\n  *a = *b;\n  *b = temp;\n\
    }\n\nint main() {\n  int x = 10, y = 20;\n  swap(&x, &y);\n  printf(\"After swap:\
    \ x = %d, y = %d\\n\", x, y);\n return 0;\n}\n```\nExplanation: The `swap` function\
    \ uses pointers to swap the values of two integers.\n\n### Exercise 6: Print an\
    \ Array\n\n```c\nvoid printArray(int arr[], int size) {\n  for (int i = 0; i <\
