    Sustainability is a large, broad-ranging problem, and apportioning limited research
    dollars to effective ends is a difficult challenge. One consequence of this low
    level of support and the resulting small number of technical researchers at utility
    companies is that opportunities for partnership between academic researchers and
    utility companies are rare.


    Government funding is also limited. In 2010, the U.S. Department of Energy provided
