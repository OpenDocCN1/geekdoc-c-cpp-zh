  md: '# **BOX 3.2**


    **Universality and Computer Science''s Greatest Achievements**


    The list below offers one view of some of computer science''s most significant
    achievements over the years. "Computer science" is construed broadly here, to
    encompass information and communications technologies.¹ Most of the achievements
    listed below were accomplished by focusing on developing domain-specific solutions
    with an eye toward eventual abstraction and universality.


    +   - Universality—the Turing machine

    +   - Computability and hardness—P, NP, and complexity classes

    +   - Stored program computer—execute anything

    +   - Operating system (versus operator)

    +   - The Internet and Internet Protocol—move anything anywhere

    +   - File storage—move anything forward in time

    +   - Coding, decoding, and cryptography

    +   - Programming language and its translation

    +   - Layered design (versus vertical integration)—abstraction as a foundation

    +   - Microprocessor, the personal computer

    +   - Audio/video representation

    +   - Distributed systems

    +   - Self-describing schemas, documents

    +   - Computer-aided design, computer-aided manufacturing, computer-aided optimization,
    computer-aided engineering (design, simulate, build, test, measure, use)

    +   - Database query languages and management systems

    +   - Continuous user input (pointers, clickers)

    +   - Graphics: user interfaces in various forms

    +   - Parallel execution

    +   - Numerical simulation of physical phenomena

    +   - The web, hypertext, and distributed markup in a global namespace

    +   - Massive keyword search

    +   - Spreadsheets

    +   - Scheduling, planning, optimization

    +   - Very-large-scale integration, design rules, synthesis, verification, massive
    systems production

    +   - Search techniques, heuristics

    +   - Machine learning

    +   - Structure of graphs


    ¹There are, of course, other takes on this question. The Computer Science and
    Telecommunications Board (CSTB)''s well-known "lure track" diagram (as seen in
    National Research Council, Innovation in Information Technology, Washington, D.C.:
    The National Academies Press (2003)) explores innovations in computer science
    and information technology from the perspective of spawning billion-dollar industries.
    That list includes time-sharing, client/server computing, entertainment, Internet,
    local area networks, workstations, graphical user interfaces, very-large-scale
    integration and design, and reduced instruction set computing processors. A CSTB
    report published in 2004 articulated the essential character of computer science,
    and focused on seven key themes: computer science (1) involves symbols and their
    manipulation, (2) involves the creation and manipulation of abstractions, (3)
    creates and studies algorithms, (4) creates artificial constructs, (5) exploits
    and addresses exponential growth, (6) seeks the fundamental limits on what can
    be computed, and (7) focuses on the complex, analytic, rational inquiry that underlies
    technical achievements (National Research Council, Computer Science: Reflections
    on the Field, Reflections from the Field, Washington, D.C.: The National Academies
    Press (2004)). The differences in these lists are less important than noting the
    power of focused problem solving in a field whose core strengths include abstraction
