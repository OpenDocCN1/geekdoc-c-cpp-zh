    **Public Health Impacts** In addition to the environmental impacts of modern agriculture,
    there are public health impacts from current agricultural practices. Air and water
    pollution from farms damages not just the environment but also the health of the
    individuals living and working in or near the damaged environment. Factory farming
    of food animals has also increased the risk of foodborne pathogens, in part due
    to the close quarters of animals kept in confined animal feeding operations (CAFOs).
    The interplay between supply and demand of highly processed foods has health implications
    as well, even as debate continues about the specific mechanisms and contributors
    to diseases such as diabetes and heart disease.


    # Approaches to Developing Sustainable Food Systems


    Creating a more sustainable global food system will not be easy. This section
    outlines several approaches, none of which is sufficient alone, although each
    contributes to increased sustainability and could benefit from the contributions
    of computer science and IT. The approaches include taking a systems view; developing
    methods for measuring the costs, benefits, and impacts of different agricultural
    systems; the use of precision agriculture; information for informed consumption;
    and the development of social networks for local food sourcing.


    **Taking a Systems View** Overall, there is a need to take a systems view of agriculture
    (much like taking a systems view in other areas of sustainability, such as the
    smart grid, described previously) in order to understand and analyze the total
    impact of agriculture on the environment, economy, and society. A systems perspective
    is relevant at all points in the sys-'
