  md: 'automobiles, which display approximate instantaneous mileage while the car
    is running, as well as relative use of engine and battery. Given more information
    about their own driving habits in accessible and understandable fashion, consumers
    can (and do) alter their behavior and conserve gas, participants observed.


    Participants described how research that validates the functionality of the devices
    described earlier has started with in-home trials. In order to evaluate the installation
    process, researchers have observed consumers self-installing devices. Once the
    devices are in place, researchers can evaluate the effectiveness of the energy-management
    systems provided to users. Some of the questions being asked by researchers are:
    Can you elicit behavior change, up to 15 to 20 percent reduction in usage, with
    disaggregated feedback, and does the behavior change really hold over time? As
    more data have been collected on how users react to various interfaces, researchers
    have begun to iteratively refine individual interfaces. Some of the deployed devices
    were also being integrated with Microsoft Hohm and Google’s PowerMeter projects.


    Before devices and systems such as those exemplified here can be deployed commercially,
    large-scale studies are needed. Utilities are open to participating in large-scale
    studies, but when deploying research technology it can be a challenge to create
    enough devices to do even small-scale deployments in 20 or 30 homes; research
    laboratories are not often equipped for production. One solution has been to commercialize
    the technologies being used in research settings so that devices are available
    from retail stores as well as directly from the utilities. For example, Belkin
    International, which sells a wide array of computer peripherals and other consumer
    electronics, recently purchased a demand-side monitoring solution developed at
    a university research laboratory.


    The timescales and complexity of general sustainability issues are difficult to
    understand. Feedback mechanisms are being developed, and there is some evidence
    that information changes behavior. Additional knowledge is still needed on how
    much this feedback will influence behaviors and what the best feedback over what
    timescale produces the most change.'
