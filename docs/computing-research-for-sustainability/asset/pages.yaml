    for modeling systems that are increasingly complex presents an important challenge.
    One natural approach is parallelizing the algorithms. In a number of cases this
    is quite feasible: for example, when modeling residential location choice (where
    will people decide to live, given characteristics both of the household and the
    possible dwellings), one can use massive parallelism, with each household making
    its decisions independently. One must then undo some assignments if two households
    attempt to move into the same place simultaneously (perhaps mirroring what happens
    in real life with several people all trying to rent or buy the same dwelling).
    However, new or improved algorithms are likely a richer source of performance
    gain, which will be important because many of the applications envisioned require
    huge performance increases (for example, using a simulation in real time in a
    meeting, or running a simulation many, many times to compute information about
    uncertainty). The precomputing of key scenarios and interpolating among the results
    (when the changes are smooth rather than abrupt), rather than computing the results
    from each scenario from scratch, should also be investigated. In terms of algorithms,
    one class of new algorithms that should be investigated is multiscale models,
    in which the simulation is first run at a relatively coarse grain (e.g., a zonal
    level), and the results from this are fed to further simulation runs within each
    zone, and so forth. (See Chapter 2 for more on modeling.) In this case the reason
    for using a multiscale model is performance. Heterogeneous models are also relevant
    for urban simulation—for example, coupling UrbanSim (a regional-scale model) with
    statewide freight mobility models. This could be further optimized by simulating
    only within zones that have changed significantly from the prior simulation period
    or that are of particular policy interest, and otherwise remaining at the coarser
    level.


    # Managing Uncertainties


    Urban modeling is rich with uncertainties on many levels, including future population,
    global economic conditions, the price of energy, the impact of climate change,
    and many others. There have been some successes in propagating uncertainty through
    the modeling process and capturing it in the indicators that the system produced,⁴⁹
    but much more needs to be done in terms of both statistical techniques and effective
    presentation of the results.'
