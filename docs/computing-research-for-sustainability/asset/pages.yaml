  md: 'of air flow and heat transport can provide a good first approximation of how
    a building will behave under different HVAC configurations. However, in actual
    operation, the outdoor environmental conditions, status of doors and windows (open
    or closed), position of furnishings, installation of other equipment (e.g., space
    heaters, digital projectors, vending machines), and number and behavior of occupants
    can produce very different operational behaviors. Introducing all of these secondary
    and tertiary factors into a mechanistic model may be very demanding; these factors
    are typically in flux. Alternatively, as more sensors are incorporated into building
    environments there may be enough data to fit a statistical model of building behavior—that
    is, to develop an empirical model. However, such statistical models must in effect
    rediscover aspects of the physics in the mechanistic models, and this can require
    an immense amount of data. An attractive alternative is to integrate one or more
    data-driven modeling components with the mechanistic model. A mechanistic model
    would be modified by inserting statistically trained components with the goal
    of these components being to transform the inputs (initial state and forcings),
    dynamics, and outputs so that the model produces more accurate predictions.


    Virtually all existing work on the integrating of statistical models into mechanistic
    models has taken place outside of computer science. A key challenge is to bring
    these methods into computer science and generalize and analyze them. Among the
    research questions are the following: What general-purpose algorithms work well
    for fitting the statistical components of an integrated model? How can overfitting
    be detected and prevented (i.e., what are appropriate regularization penalties
    for such integrated models)? What are good methodologies for evaluating the predictive
    accuracy of such models? Many algorithms for evaluating mechanistic models employ
    adaptive meshes; how can statistical methods be integrated with mesh adaptation?
    The fitting of statistical models typically requires evaluating the mechanistic
    model hundreds or thousands of times. Running global climate models even once
    at full resolution can require many days of time on the world''s largest supercomputers.
    Can experimental designs that make efficient use of and minimize expensive model
    runs be implemented? Can the statistical models be fitted on upscaled versions
    of the mechanistic models and then downscaled for full-resolution runs? Under
    what conditions would this work?


    # ## Decision Making Under Uncertainty


    Actually addressing sustainability problems requires that one move beyond observation
    and analysis to action. But there is inherent uncertainty every step of the way—in
    the decision making informed by mod-'
