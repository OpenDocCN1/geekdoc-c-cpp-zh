    However, in such complex systems and domains there are likely to be emergent behaviors
    and properties as well—both toward and away from desired outcomes. IT practitioners
    have proven remarkably adept at innovating flexibly when previously unanticipated
    systems behaviors have demanded responses. The complexity and unpredictability
    of the results of unsustainable human activities require an innovative and flexible
    approach to solving or mitigating sustainability problems and their impacts, and
    IT researchers and practitioners are skilled at innovating and developing flexible
    solutions in dynamic environments. The committee believes that computing researchers
    and research approaches will be essential to grappling with current and future
    systems challenges in sustainability.


    This report has three chapters. Chapter 1 elaborates on domains of potential impact
    in order to illustrate the role and the available opportunities of IT on the broader
    path toward sustainability. It addresses the question, In what ways and where
    can computing research have measurable, significant impact? Chapter 2 describes
    methods and approaches in discussing the questions, How do fundamental research
    questions and approaches in computing intersect with sustainability challenges,
    and how can problem solving and research methodologies in computing research and
    IT innovation be brought to bear on sustainability? In particular, the committee
    views one important goal of computer science in sustainability as informing, supporting,
    facilitating, and sometimes automating decision making—decision making that leads
    to actions that will have significant impacts on achieving sustainability objectives.
    Aimed primarily at computer science researchers, Chapter 3 articulates why the
    interplay between addressing sustainability challenges and computer science research
    merits attention, and how that interplay offers deep and compelling opportunities
    for progress in multiple dimensions. Appendix A summarizes presentations and discussions
    at the Workshop on Innovation in Computing and Information Technology for Sustainability,
    organized by the committee. Biographies of the committee members are presented
    in Appendix B.


