    # ### Sociotechnical Systems


    Large and long-lived impacts on sustainability will require enabling, encouraging,
    and sustaining desired human behavior—that of individuals, organizations, municipalities,
    and nation-states—over the long term. Sociotechnical systems designed to aid in
    behavioral assistance and reinforcement and to provide information about progress
    are a critical element for global sustainability efforts. Such systems and associated
    tools are needed at every scale and can be applied to a range of problems, from
    enabling effective response in times of acute crisis management, to urban planning,
    to promoting the understanding of behavioral impacts (sometimes referred to as
    footprint analysis) on carbon, water, and biodiversity.


    Institutional behaviors will need to shift in order to realize continuous, long-term
    environmental changes. Marketing and public education initiatives are important
    and can contribute to individual and institutional knowledge on best practices.
    However, real-time information and tools can better equip individuals and organization
    to make daily, ongoing, and significant changes in response to a constantly evolving
    set of circumstances. Information dashboards accessible to key decision makers
    are an example of how IT can be used to collect, analyze, curate, and informatively
    present critical information quickly to those who need it most. For example, if
    the financial incentives for energy utilities shift from an emphasis on delivering
    more power more cheaply to an emphasis on improving the GHG emissions efficiency
    of a given level of service, new information will be needed. Gathering such information
    will require greater visibility and understanding of the dynamics of customer
    demand, grid capacity, and supply availability. In addition, each of the stakeholders
    will need more effective means of communicating needs and trade-offs. Similarly,
    in order for urban planning to promote, say, the reduction of liquid fuel consumption
    for personal transportation, the processes of street design, zoning, planting,
    business development, water and waste management, and public transportation need
    to be coordinated across multiple governing bodies and constituencies.


    Personal devices, most notably sensor-rich smartphones, not only provide information
    and services to their users, but can also provide scientists and researchers with
    information that may have been missed by traditional operational networks. Furthermore,
    citizen scientists are increasingly engaged in scientific problem solving, for
