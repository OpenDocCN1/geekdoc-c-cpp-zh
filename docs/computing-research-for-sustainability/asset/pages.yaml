    # ## Assessing Uncertainty in Climate Models


    Assessment and understanding of climate change and its impacts are critical to
    meeting many sustainability challenges. Scientists use a variety of techniques,
    including a variety of climate models, to assess and understand climate change.
    The potentially high impact of climate change means that policy makers are faced
    with hard choices, including but not limited to the reduction of emissions, adaptation
    to climate change, and/or geoengineering that might help mitigate the effects
    of climate change.⁶


    Participants discussed the role of uncertainty in the development and understanding
    of climate models. Scientists working on the problem of climate prediction must
    also address uncertainty. This could be done using a workflow plan that captures
    uncertainty information at each stage of the climate-prediction process. Within
    each stage, there are data, a model, predictions, assessment of likely impacts,
    and decision making. At each point there are sources of uncertainty that have
    to propagate


