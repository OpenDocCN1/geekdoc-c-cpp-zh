  md: 'els that provide no measures of uncertainty. Recently, there has been substantial
    interest in assessing the uncertainty in these models. The primary method is to
    perform Monte Carlo runs in which the model parameters and inputs are varied in
    order to reflect uncertainty in their values, and the propagation characteristic
    of the uncertainty is reflected in the degree of variation in the outputs. Although
    valuable, this does not assess uncertainty due to model-formulation decisions
    and computational approximations. Research questions include the following: How
    can one minimize the cost of Monte Carlo uncertainty assessment? For example,
    can program-analysis methods determine that uncertainty in some sets of parameters
    interact in well-behaved ways (independently, additively, multiplicatively)? Can
    convenient and efficient tools be provided for authoring, debugging, and testing
    alternative modeling choices so that the uncertainty engendered by these choices
    can be assessed? Can existing tools for automated software diversity—which were
    developed for software testing and security¹⁷—be extended to generate model diversity?


    Models are often part of a sensor-to-decision-making pipeline in which sensor
    measurements are cleaned and rationalized, then fed to a set of models that simulate
    the effects of different policy choices and assess their outcomes. However, it
    is often the case that uncertainty in one stage (e.g., data cleaning) is not retained
    and propagated to subsequent stages. Existing scientific work on tools (e.g.,
    Kepler¹⁸) does not provide explicit representations of uncertainty or standard
    ways of propagating uncertainty along such pipelines. Additional work is needed
    to develop such representations and to provide support for automating the end-to-end
    assessment of uncertainty. For example, it should be possible to automate end-to-end
    Monte Carlo uncertainty assessment. One can also imagine extending methods of
    belief propagation from probabilistic graphical modeling in order to propagate
    uncertainty along data-analysis pipelines automatically. Coupled with modules
    for representing policy alternatives and modules for computing objective functions,
    such work-flow tools could provide important support for decision making under
    uncertainty.


    # ### Robust-Optimization Methods


    The assessment of explicit uncertainty aims to address the “known unknowns.” Classical
    models of decision making typically involve selecting the actions that maximize
    the expected utility of the outcomes accord-'
  merge: -1
