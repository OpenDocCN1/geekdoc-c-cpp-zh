    # INFORMATION-INTENSIVE SYSTEMS


    Sustainability problems raise many research questions for information-intensive
    systems because of the nature of the data sources and the sheer amount of data
    that will be generated.7 Computer science has applied itself broadly to problems
    related to discrete forms of human-generated information, including transaction
    processing, communications, design simulation, scheduling, logistics tracking
    and optimization, document analysis, financial modeling, and social network structure.
    Many of these processes result in vast bodies of information, not just from explicit
    data entry but through implicit information collection as goods and services move
    through various aspects of the supply chain or as a result of analyses performed
    on such underlying data. The proliferation of mobile computing devices adds not
    just new quantities of data, but new kinds of data as well. Some data-intensive
    processes are extremely high bandwidth event streams, such as clickstreams from
    millions of web users. In addition, computer science is widely applied to discretized
    forms of continuous processes, including computational science simulation and
    modeling, multimedia, and human-computer interfaces. In both regimes, substantial
    data mining, inference, and machine learning are employed to extract specific
    insights from a vast body of often low-grade, partially related information.


    All of the techniques described above can and must be applied to problems associated
    with sustainability. Nonetheless, several aspects of sustainability, even in addition
    to the vast quantities of data that will'
