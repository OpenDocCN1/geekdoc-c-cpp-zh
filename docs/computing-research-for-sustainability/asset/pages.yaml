  md: '# ## Scientific Workflows


    Participants discussed the typical nature of scientific workflows and the importance
    of uncertainty analysis to their effectiveness. Uncertainty information about
    data collected and generated for analysis is often unavailable. When it is available,
    there are no standardized data structures for sharing and managing this information.
    Due to the complexity of uncertainty modeling, there are very few software tools
    that can incorporate, compute, and propagate uncertainty information. If information
    regarding uncertainty can be propagated somehow, there are still challenges in
    visualizing and disseminating the uncertainty information.


    One example of the difficulty of tracking uncertainty is in the use of multiple
    sensing and data-collection instruments. Often more than one type of instrument,
    such as a camera and a point sensor, is used in the same area or space to measure
    the same phenomenon. A question then arises: Which measurement is more accurate,
    where, and at what time? Using multiple instruments introduces several types of
    uncertainty, including that related to the transformation that researchers apply
    in order to display measurements, that related to spatial registration, and that
    related to the temporal synchronization. In order to grapple with these uncertainties,
    a theory of uncertainty is developed on the basis of a formalized framework that
    describes how to compute uncertainty. Researchers select a measurement based on
    the uncertainty level of each type of uncertainty. As the uncertainty framework
    is built and used, the error propagation rules and methodology allow one to build
    workflows that can be applied to future models and calculation.


    A second example of the difficulty of tracking uncertainty is in managing and
    tracking data. Data often come from a variety of sources and are then processed
    by various computing techniques. As data move from analog instrumentation to a
    visual representation of research findings, uncertainty generally increases. For
    example, visualization features may be derived or elevation and/or slope may be
    computed. Moreover, there may be many users of the collected data, and each one
    may be using a different suite of software tools to process and analyze the data.


    These examples provide some sense of the complexity involved in tracking and accounting
    for uncertainty. Some lessons become apparent. First, uncertainty information
    is vaguely defined; typically it is either a range or a distribution set. Second,
    the complexity of uncertainty modeling using error propagation is greater than
    that of the underlying phenomenon itself. Third, and most importantly, scientific
    workflows are suitable for managing uncertainty modeling; software modules could
    be reused and could track how collected data are being manipulated.'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# *Defining Workflows*


    The traditional objective of scientific workflows is to automate a science process
    leading to a science product, usually a data set or a visualization. Workflows
    make it easier for scientists to manipulate, communicate, and reuse or repurpose
    data sets. Workflows also allow the computation to be done locally, or, when managing
    especially large or complicated data sets, scientists can take advantage of remote
    computational resources. As noted earlier, workflows can be used to track and
    manage uncertainty propagation and need to become part of the general scientific
    infrastructure. Capturing the workflow and managing the computation are particularly
    useful if all of the calculated information, including uncertainty information,
    can be delivered to third parties and end users.


    Workflows can become a communication mechanism for the management of uncertainty.
    Using dynamic visualization and the sharing of workflows, scientists can more
    readily engage policy makers. Workflows can be designed with sharing in mind.
    For example, social media concepts such as tagging and networking can be incorporated
    into the designs of workflows, making them more accessible.


    # *Research Questions and Challenges*


    Several open questions regarding the tracking and managing of uncertainty will
    have to be addressed before these uncertainties can be effectively calculated
    and, importantly, communicated using scientific workflow mechanisms. These include
    the following:


    +   - How can uncertainty and information loss due to data translations best be
    captured?

    +   - How can provenance information about uncertainty methods and parameters
    best be gathered automatically during computations?

    +   - How can uncertainty best be propagated in computation workflows, or perhaps,
    how can uncertainty propagation rules best be offered for software tools without
    such rules?

    +   - How can uncertainty best be delivered and presented to decision makers,
    who may require a customizable view so as to increase its effectiveness, as well
    as a universal viewer for other interested parties, who may require more widely
    accessible information?

    +   - Can workflow services managing the uncertainty be integrated with other
    web services, such as mapping or sharing tools, to deliver uncertainty to scientists
    and policy makers?


    Participants argued that a CS research agenda for sustainability needs to support
    research on the representations and propagation of uncertainty. In the past there
    has been little information on uncertainty. Con-'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'tent managers should be encouraged to include uncertainty with data, use workflows
    to manage and track uncertainty, and incorporate other information-sharing services,
    ultimately leading to better information on which decisions can be made.


    # ## Robust Optimization Under Uncertainty


    Optimization has progressed rapidly in recent decades due in part to the rapid
    improvement of computer systems generally and to the development of increasingly
    sophisticated algorithms. The solving of large-scale, linear problems, with millions
    of variables, is computationally feasible. However, the inclusion of calculations
    regarding the uncertainty in these optimization problems is still a challenge.
    For policy decisions, for instance, models and calculations are run many times,
    and changes are made during each iteration. Because uncertainty has to be calculated
    at each iteration, running models that include uncertainty is extremely inefficient.
    The goal is to make accounting for uncertainty computationally tractable so that
    each model can be run faster and more efficiently.


    Robust optimization is one method for coping with uncertainty in optimization
    problems. Robust optimization provides computational tractability and supports
    parsimonious modeling demands—one does not have to worry about the specifics of
    probability distribution. Robustness is an inherent and essential feature of many
    important methods across many disciplines, including machine learning and decision
    theory.


    Robust optimization is different from sensitivity analysis. Although robust optimization
    and sensitivity analysis are motivated by similar factors, sensitivity analysis
    is a post-optimization tool; if robustness is ensured beforehand, solutions will
    not be overly sensitive. Robust optimization is also sometimes considered too
    conservative. The conservativeness relates to the uncertainty set that is used
    and on how large it is. An improved data-driven theory of optimization is needed.
    There are many approaches to building uncertainty sets, but there is the open
    theoretical question regarding the right way to use data in optimization problems.
    In some problems, when there are not enough data, the questions become these:
    How does one properly incorporate subjective opinion about the data? What is the
    right way to describe uncertainty? An additional challenge is that idealized problems
    tend to be studied without enough application to real-world problems. There is
    also the challenge of ensuring that uncertainty is acknowledged and taken into
    account in any decision-making process.


    # ## Theory and Methodology of Robust-Yet-Fragile Systems Analysis


    Participants noted that fundamental research is needed to improve the understanding
    of the various trade-offs in computational methodologies,'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'such as efficiency versus robustness. Complexities of real systems—not the
    complexity of the mechanisms used to study the systems—embody these trade-offs.
    Some theories already exist for examining the trade-offs among robustness, fragility,
    and efficiency. For example, researchers know that efficiency has hard limits
    and is bounded. Robustness and fragility have conservation laws as well, and the
    trade-offs between the two are tangible. Theories from other disciplines, including
    systems engineering, control theory, information theory, and computational complexity
    theory, provide complementary approaches and can be integrated into theories on
    robustness, fragility, and efficiency.


    Efficiency and robustness exist in many dimensions, and although each in itself
    is reasonably well understood, a theoretical framework is needed for conveying
    the interactions and examining the inherent trade-offs. Firm trade-offs exist
    among the following:


    +   * Efficient use of resources (sustainability)

    +       * Small amounts of resources consumed, small amounts of waste produced.

    +       * Inexpensive components, small capital investment.

    +       * Efficient processes: design, manufacture, maintenance, management.

    +   * Robustness to perturbations

    +       * Rejection of external disturbance and suppression of internal noise.

    +       * Tolerance for component failures and uncertainty.

    +       * Security against malicious attack and hijacking.

    +       * Scalability to large system size.

    +       * Evolvability on long timescales to large changes.

    +       * Human actors with aligned incentives.

    +   * Predictable, verifiable, understandable

    +       * Limits on unintended consequences.

    +       * Easily reproducible experiments and data.

    +       * Models (simple and analyzable), short theorems, proofs.

    +       * Experience that is a reliable guide to the future.⁹


    One can start building toward a theory with comparisons across disciplines. Although
    efficiency limits are understood, it is very difficult, if not impossible, to
    reach 100 percent efficiency rates. By contrast, robust fragility is much less
    understood. Robustness in one part of a system may induce fragility in another.
    Fortunately, evolvability and robustness seem


    ⁹ John Doyle, “Theory and Methodology of Robust-Yet-Fragile Systems Analysis,”
    presentation at the Workshop on Innovation in Computing and Information Technology
    for Sustainability, Washington, D.C., May 26, 2010.'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'to be compatible. Architectures and platforms that enable innovation well can
    also enable robustness well.


    Examples were discussed of how new theories can be developed to encompass needed
    robustness requirements. Network theory might be able to help sort out what is
    an accident of similarity and what is deeply structural. However, the fact that
    reasonably well understood networks exist in one domain does not mean that these
    understandings translate well to another domain. There may be useful knowledge
    to be gained by comparing network structures and properties in different domains
    (for example, contrasting and comparing climate history, cell systems, and Internet
    architectures), but this knowledge needs to be validated first. Additionally,
    participants noted that a better understanding of what is meant by complexity,
    non-linearity, modularity, architecture, and evolvability in different domains
    is needed so that scientists can communicate more effectively with policy makers
    and with one another.


    Furthermore, big data and big models mean that many things can be demonstrated
    by means of data or models. As computational capacity has increased, in many ways
    research efforts have moved from coping with impoverished data and elegant models
    that are not well understood to coping with massive data sets and sophisticated
    simulations that are not well understood. In this new environment, larger gaps
    between the demonstration and the reality can be unintentionally created, and
    unanticipated fragilities may become overwhelming.


    # SESSION 3: CREATING INSTITUTIONAL AND PERSONAL CHANGE WITH HUMANS IN THE LOOP


    Behavioral changes at both the institutional and the individual level are needed
    in order to achieve sustainability objectives. Important questions in designing
    and developing smarter systems involve the level of information and the interface
    design that will induce behavior change. Human-system interaction (HSI) issues
    arise both for individuals in homes and offices and for administrators of larger
    systems and facilities. These interactions can occur at different timescales,
    encompassing both day-to-day decisions made by users and operators and planning
    decisions involving longer periods of time. Moreover, although there have been
    many advances in HSI, the literature is replete with failed cognitive models,
    serving as cautionary tales for HSI in sustainability applications.


    Panelists were asked to examine the following questions in relation to sustainability
    challenges during their talks:'
