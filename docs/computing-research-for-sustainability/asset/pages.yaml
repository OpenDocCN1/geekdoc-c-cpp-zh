- pgno: 91
  md: 'ing to some underlying statistical model. Unfortunately, experience with ecological
    modeling and environmental policy suggests that there are many “unknown unknowns”—phenomena
    that are unknown to the modelers and decision makers and therefore not accounted
    for in the models.¹⁹ One possible safeguard is robust optimization.²⁰ Rather than
    treating model parameters as known, this approach assumes instead that the parameters
    lie within some uncertainty set and optimizes against the worst-case realization
    within these sets. The size of these uncertainty sets can be varied to measure
    the loss in the objective function that must be sustained in order to achieve
    a given degree of robustness. Robust-optimization approaches can greatly improve
    the ability to sustain significant departures from conditions in the nominal model.
    Existing robust-optimization methods generally assume that the decision model
    can be expressed as an optimization problem with a convex structure (e.g., linear
    or quadratic programs). Robust optimization is sometimes considered overly conservative.
    Convex constraints over multiple uncertainty sets can be introduced to rule out
    simultaneous extreme events and reduce the over-conservatism of first-generation
    robust-optimization methods.²¹ An open theoretical question is that of determining
    the best ways to use data in optimization problems. In some problems in which
    there are insufficient data, the question becomes one of how to properly incorporate
    subjective opinion about the data and what the best way is to characterize uncertainty.
    Another research challenge is to develop robust-optimization methods that are
    applicable to the kinds of complex nonlinear models that arise in sustainability
    applications.


    # ### Optimal Sequential Decision Making


    Most sustainability challenges will not be addressed by a decision made at a single
    point in time. Instead, decisions must be made iteratively over a long time horizon
    since a system is not sustainable unless it can be operated indefinitely into
    the future. For example, in problems involving natural resource management, every
    year provides a decision-making opportunity. In fisheries, the annual allowable
    catch for each species must be determined. In forests, the location and method
