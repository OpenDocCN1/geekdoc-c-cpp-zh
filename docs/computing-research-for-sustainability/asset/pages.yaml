  md: 'The introduction of storage aims to decouple generation and consumption, enabling
    either to take place at times that are most effective. (But even with hypothetical
    vast storage capacities, inefficiencies in storing and generating electricity
    mean that complete decoupling will not be possible.) Equally important is the
    ability to coordinate loads, often through the utilization of non-electrical forms
    of energy storage such as thermal, but also often exploiting flexibility in the
    actual task. In short, opportunities to improve the sustainability of the electric
    grid can be clustered as follows: (1) sculpt demand to match the supply of renewable
    power more closely; when abundant renewable power is available, use it for shiftable
    power needs (such as ice makers, hot water, dishwashers, electric car charging);
    (2) sculpt demand to smooth out spikes so that less high-speed dispatchable supply
    is needed; (3) reduce total demand by improved efficiency in transmission and
    use; and (4) apply instrumentation and modeling to measure carbon emissions as
    part of carbon pricing and capping policies.


    Electricity is currently the most invisible of utility-supplied resources. To
    make progress on the opportunities available will require new forms of visibility,
    including visibility with respect to price and GHG emissions, consumption, and
    performance. IT can contribute in key ways: for example, pervasive instrumentation,
    monitoring, and analysis enable visibility into electric power consumption and
    resulting load performance.


    Increased visibility is an important component of developing integrated home or
    building energy-management systems that can make wise decisions about how to shift
    energy use. These systems need flexible user interfaces and sensing systems so
    that they can receive information about when it is appropriate to, say, delay
    electric car charging, heating up a building, and so on. For example, such systems
    could be integrated with users’ calendars as well as connected to pricing and
    other generation-side signals (e.g., sun and wind forecasts). Research is needed
    on user interfaces, predictive models of user and appliance behavior, and perhaps
    auction and pricing mechanisms.


    Integrated energy-management systems could also address spiking, by heating and
    cooling buildings more gradually or by making offsetting power-consumption choices.
    Making the effects of such choices visible to the user (e.g., by clarifying when
    the building will achieve the desired temperature, when it will be possible to
    turn on a particular machine, etc.) will be critical for user acceptance. Price
    mechanisms (e.g., charging more for sudden changes) could be explored as well.


    IT research is needed for developing methods for sensing, modeling, and intelligent
    control of buildings. Most office buildings, for instance, exhibit chronic poor
    performance (some parts of the building are too hot, others too cold; some parts
    are poorly ventilated, others too breezy).'
