    Open mHealth. Professor Estrin received her Ph.D. (1985) in computer science from
    the Massachusetts Institute of Technology and her B.S. (1980) from the University
    of California, Berkeley. Her early research (conducted while she was on the Computer
    Science Department faculty at the University of Southern California [USC] and
    the USC Information Sciences Institute) focused on the design of network and routing
    protocols for very large, global networks, including multicast routing protocols,
    self-configuring protocol mechanisms for scalability and robustness, and tools
    and methods for designing and studying large-scale networks. From 2002 to 2012
    she founded and directed the multidisciplinary, National Science Foundation (NSF)-funded
    Science and Technology Center for Embedded Networked Sensing (CENS), which developed
    environmental monitoring technologies and applications (http://cens.ucla.edu).
    Currently Professor Estrin explores participatory sensing and mHealth systems,
    leveraging the programmability, proximity, and pervasiveness of mobile devices;
    deployment contexts include health (http://openmhealth.org), community data gathering,
    and education (http://mobilizingcs.org). Professor Estrin has been a co-principal
    investigator on numerous NSF and Defense Advanced Research Projects Agency (DARPA)-funded
    projects and has been an active participant in several government-sponsored studies.
    She'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'chaired a 1997-1998 DARPA Information Science and Technology Study Group study
    on sensor networks, and the 2001 National Research Council (NRC) study on networked
    embedded computing, which produced the report *Embedded, Everywhere: A Research
    Agenda for Networked Systems of Embedded Computers*. She later chaired the Sensors
    and Sensor Networks subcommittee of the NEON (National Ecological Observatory
    Network) Design Committee (www.neoninc.org). Professor Estrin also served on the
    Advisory Committees for the NSF Computer and Information Science and Engineering
    (CISE) and Environmental Research and Education (ERE) Directorates, and is a former
    member of the NRC''s Computer Science and Telecommunications Board. She was an
    editor of the *IEEE/ACM Transactions on Networking*, and a program committee member
    for many networking-related conferences, including Sigcomm (Special Interest Group
    on Data Communication), Infocom (International Conference on Computer Communications),
    MobiCom, and MobiSys. She was the steering group chair and general co-chair for
    the first Association for Computing Machinery (ACM) Conference on Embedded Networked
    Sensor Systems, Sensys 2003, and served as one of the first associate editors
    for the *ACM Transactions on Sensor Networks*. Professor Estrin is a fellow of
    the ACM, the American Association for the Advancement of Science, and the Institute
    of Electrical and Electronics Engineers. She was selected as the first ACM-W Athena
    Lecturer in 2006, was awarded the Anita Borg Institute''s Women of Vision Award
    for Innovation in 2007, was inducted into the Women in Technology International
    Hall of Fame in 2008, and awarded Doctor Honoris Causa from Ecole Polytechnique
    Fédérale de Lausanne in 2008. Professor Estrin was elected to the American Academy
    of Arts and Sciences in 2007 and into the National Academy of Engineering in 2009.


    **Alan Borning** is a professor in the Department of Computer Science and Engineering
    at the University of Washington, an adjunct faculty member in the Information
    School, and a fellow of the Association for Computing Machinery. He received a
    B.A. in mathematics from Reed College (1971) and an M.S. (1974) and a Ph.D. (1979)
    from Stanford University. His principal research interests are in human-computer
    interaction and designing for human values. His current research projects include
    online tools to support civic engagement and participation, mobile tools to aid
    transit riders, and designing systems to support more effective public participation
    in land use and transportation deliberations, supported by sophisticated simulation
    data. Earlier he worked on programming languages and UI (user interface) toolkits,
    including constraint-based languages and systems and on object-oriented languages.'
