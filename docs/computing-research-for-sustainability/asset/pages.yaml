  md: '# A


    # Summary of a Workshop

    on Innovation in Computing

    and Information Technology

    for Sustainability


    # INTRODUCTION


    On May 26, 2010, the Committee on Computing Research for Environmental and Societal
    Sustainability held the Workshop on Innovation in Computing and Information Technology
    for Sustainability in Washington, D.C. The goal of the workshop was to survey
    sustainability challenges, current research initiatives, and results from previously
    held topical workshops and related industry and government development efforts
    in these areas. The workshop featured invited presentations and discussions that
    explored research themes and specific research opportunities that could advance
    sustainability objectives and also could result in advances in computer science
    (CS). Participants were also asked to consider research modalities, with a focus
    on applicable computational techniques and long-term research that might be supported
    by the National Science Foundation (NSF), with an emphasis on problem- or user-driven
    research.


    This appendix summarizes the discussion of the workshop panelists and the attendees.
    The summaries of the four workshop sessions provided in this appendix are a digest
    both of the presentations and of the subsequent discussion, which included remarks
    offered by others in attendance. Although this summary was prepared by the committee
    on the basis of workshop presentations and discussions, it does not, in keeping
    with the guidelines of the National Research Council on the development of workshop
    summaries, necessarily reflect a consensus view of the committee.'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'The sessions at the workshop were entitled:


    +   - Session 1: Expanding Science and Engineering with Novel CS/IT Methods: “The
    Need to Turn Numbers into Knowledge”;

    +   - Session 2: Understanding, Tracking, and Managing Uncertainty Throughout
    the Science-to-Policy Pipeline;

    +   - Session 3: Creating Institutional and Personal Change with Humans in the
    Loop;

    +   - Session 4: Overcoming Obstacles to Scientific Discovery and Translating
    Science to Practice.


    The workshop agenda is provided at the end of Appendix A.


    # ## SESSION 1: EXPANDING SCIENCE AND

    ENGINEERING WITH NOVEL CS/IT METHODS:

    “THE NEED TO TURN NUMBERS INTO KNOWLEDGE”


    Discussions during the first session of the workshop focused on the role of computer
    science in helping solve sustainability challenges. A broad definition of sustainability
    was employed. Vijay Modi, Columbia University, provided examples of sustainability
    areas where computer science could help address some challenges; Robert Pfahl,
    International Electronics Manufacturing Initiative, discussed changes in electronic
    systems and products to improve sustainability; Neo Martinez, Pacific Ecoinformatics
    and Computational Ecology Lab, explored the role of computer science in improving
    ecological sustainability; Adjo Amekudzi, Georgia Institute of Technology, examined
    planning and management issues around infrastructure; and Thomas Harmon, University
    of California, Merced, discussed water challenges.


    Following are examples given of the ways in which computer science can play a
    role in addressing sustainability challenges:


    +   - *Urban electricity consumption.* Gathering fine-grained accurate measurements
    and statistics on energy usage of individual buildings can be difficult, due in
    part to the variety and diversity of building types. With better measurements,
    one could develop a useful model of energy usage over the course of a day and
    find opportunities, for instance, to store extra energy throughout the day for
    use at peak times.

    +   - *Infrastructure planning.* The planning and development of effective infrastructure
    are very difficult to do at scale for the time span required. Compounding these
    challenges is a dearth of data on how and where people actually live and what
    their movements are throughout the day.'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'This limited knowledge of the movement of people and the limited understanding
    of where infrastructure needs exist make it difficult to plan infrastructure accordingly.
    Advances in remote sensing, to improve understanding of the use of current infrastructure,
    can help cities and utilities to formulate better infrastructure planning.


    +   * Clean water. Access to clean water is an ongoing and increasingly challenging
    problem worldwide. One of the more difficult components of this challenge is detecting
    water below the surface of Earth. Although detection of water at and just below
    the surface is well understood, technology for finding water at deeper levels
    is limited. Better sensing technologies are needed to help differentiate between
    sand, wet sand, water that is flooding the sand, and so on.


    The examples above are just a few of the areas in which computer science has contributions
    to make to sustainability. Workshop participants examined a wide array of sustainability
    challenges in which specific CS/information technology (IT) advances could contribute
    to resolving these challenges. In many cases, it is a matter of developing new
    approaches for turning raw data (numbers) into knowledge and, ultimately, prompting
    action that results in more sustainable outcomes. Research opportunities cited
    by workshop participants in the areas of ecological sustainability (that is, relating
    to diverse and productive biological systems), transportation, and water resources
    are described below, along with associated computer science challenges. The first
    session concluded with a brief examination of the policy challenges of interdisciplinary
    work and of turning knowledge into actionable items.


    # ## Electronic Systems and Products and Sustainability


    The International Electronics Manufacturing Initiative (iNEMI) is a consortium
    of electronics manufacturers and affiliates focused on environmental issues in
    electronics.^1 Every 2 years, iNEMI creates a roadmap that charts future opportunities
    for and challenges to electronics manufacturing for reaching sustainability objectives.^2
    The iNEMI efforts began by focusing on hazardous materials. The early goals of
    the consortium were aimed at eliminating chlorofluorocarbons from the cleaning
    of electronics, removing lead from electronics, and reducing the use of halogenated
    flame retardants and polyvinyl chloride (PVC) materials. More recently, the focus
    has been on the complete energy use of products, as discussed'
  merge: -1
