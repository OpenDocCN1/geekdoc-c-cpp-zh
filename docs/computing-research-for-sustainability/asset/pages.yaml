    # **Sustainable Food Systems**


    Agriculture in the United States and other parts of the world over the past century
    has been characterized by a dramatic increase in productivity, resulting in relatively
    affordable and available food. Some of the driving factors for this increase include
    the relatively inexpensive availability of fossil fuels and abundant fertilizer
    and water; concentration and specialization in farm production, including the
    increased use of automation and robotics in meat processing; the increased mechanization
    of farming and the availability of new technologies; advances in plant breeding;
    government programs and subsidies; and the expansion and commercialization of
    markets. These developments have allowed for food to be produced at unprecedented
    volumes and have supported significant population growth.²⁹ The increase in output
    from agriculture, unlike that in many other industries, has not been associated
    with a similar increase in inputs. For example, the acreage of cropland used in
