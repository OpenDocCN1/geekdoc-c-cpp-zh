- pgno: 25
  md: '# ## STRATEGY AND PRAGMATIC APPROACHES


    For computer science to play an effective part in meeting global sustainability
    challenges, priority should be given to research that addresses one or more important
    sustainability challenges and that offers the prospect of tangible impact, either
    directly or through game-changing contributions that offer leveraging opportunities
    for other domains. The research areas listed in the section above are the committee’s
    recommended starting place.


    An ongoing challenge is for IT experts and CS researchers to ensure that technologies
    and approaches represent usable and appropriate solutions, that they are highly
    effective, and that they take advantage of the deepest and most powerful insights
    that can be brought to bear.


    # ### Emphasize Bottom-Up Approaches and Concreteness


    The committee believes that CS research on sustainability is generally best approached
    not by striving for universality from the start, but instead by beginning from
    the bottom up: that is, by developing well-structured solutions to particular,
    critical problems in sustainability, and later seeking to generalize these solutions.
    Indeed, this has been a fruitful approach in many other application areas. Progress
    in many needed advances will require CS research (as described earlier), but those
    advances may not be immediately evident as universal approaches. Rather, to be
    judged as a significant contribution at the intersection of CS research and sustainability,
    the contribution must first have the potential to make a real difference in moving
    toward a more sustainable future. Embracing the concrete will help researchers
    hone and filter their approaches, and multiple and adapted applications will emerge.
    Many potential new applications are developed and find their ultimate universality
    through bottom-up cycles of change and through the iterative process of design
    that promotes those cycles of change. Past successful examples of this approach
    include Internet protocols, machine learning, object-oriented languages, and databases.


    # ### Use Appropriate Evaluation Criteria for Proposals and Results


    A premature focus on universality would be damaging to high-impact sustainability
    solutions. However, to be considered successful, CS research on sustainability
    must ultimately contribute to generalizable knowledge about sustainability, and
    the contribution or proposed solution should, at the same time, require new computational
    techniques or thinking beyond the current state of the art in computing. Establishing
    metrics for multidisciplinary work that are both actionable and meaning-'
