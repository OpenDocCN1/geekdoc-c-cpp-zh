  md: '# # Preface


    Computer science and information technologies offer a wide range of tools for
    examining sustainability challenges. Advances in computer science have already
    provided environmental and sustainability researchers with a valuable tool set—computational
    modeling, data management, sensor technology, machine learning, and other tools—and
    additional research in computer science may provide advanced approaches, tools,
    techniques, and strategies toward understanding, addressing, and communicating
    sustainability challenges.


    The present study emerged from an informal request to the National Research Council''s
    Computer Science and Telecommunications Board (CSTB) from the Directorate for
    Computer and Information Science and Engineering, National Science Foundation
    (NSF). The project was funded by the National Science Foundation. The statement
    of task for the Committee on Computing Research for Environmental and Societal
    Sustainability, established by the National Research Council to carry out this
    study, is as follows:


    > > Computing has many potential “green” applications including improving energy
    conservation, enhancing energy management, reducing carbon emissions in many sectors,
    improving environmental protection (including mitigation and adaptation to climate
    change), and increasing awareness of environmental challenges and responses. An
    ad hoc committee would plan and conduct a public workshop to survey sustainability
    challenges, current research initiatives, results from previously-held topical
    workshops, and related industry and government development'
  merge: -1
  img_proc: true
- pgno: 8
  md: 'efforts in these areas. The workshop would feature invited presentations and
    discussions that explore research themes and specific research opportunities that
    could advance sustainability objectives and also result in advances in computer
    science and consider research modalities, with a focus on applicable computational
    techniques and long-term research that might be supported by the National Science
    Foundation, and with an emphasis on problem- or user-driven research.


    The committee would obtain additional inputs through briefings to the committee
    and solicitations of comments and white papers from the research community. It
    would use additional deliberative meetings of the committee to develop a consensus
    report identifying promising research opportunities, cataloging applicable computational
    techniques, laying out an overall framework for “green” computing research, and
    recommending long-term research objectives and directions. The committee''s consensus
    report will include a summary of the workshop as an appendix.


    The committee reviewed current efforts underway in industry (and other opportunities
    for the immediate application of existing information technology) and explored
    research themes and specific research opportunities that could advance sustainability
    (energy and environmental) objectives and also result in advances in computer
    science. The committee considered research modalities, with a focus on applicable
    computational techniques and long-term research.


    The report, which includes as Appendix A the summary of the Workshop on Innovation
    in Computing and Information Technology for Sustainability, identifies promising
    research opportunities, catalogs applicable computational techniques, lays out
    an overall framework for computing research for sustainability, and recommends
    long-term research objectives and directions. Chapter 1 provides examples of domains
    of potential impact. Chapter 2 describes methods and approaches, and Chapter 3,
    which is aimed primarily at computer science researchers, articulates why the
    interplay between addressing sustainability challenges and computer science research
    merits attention.


    Meeting these challenges will involve advances in a number of computing research
    areas, including the following: scalability; robustness; reliability; real-time
    observation and processing; low-power computing; and sensing and actuation; and
    human interaction with the environment, observations, and feedback systems. A
    number of specific areas of computer science and topics addressed in current research
    programs of NSF''s Directorate for Computer and Information Science and Engineering
    are relevant.


    This report represents the cooperative effort of many people. The members of the
    study committee, after substantial discussions, drafted'
