  md: 'the acreage used in 1910. Thus, there has been a tremendous increase in productivity
    in U.S. agriculture, with more food being produced with significantly less capital,
    land, labor, and materials.^30


    However, current agricultural practices pose challenges to the sustainability
    of the food system, as well as to the broader social, economic, and environmental
    systems within which they are embedded. Much of the focus of agriculture has been
    on maximizing production to satisfy human food, feed, and fiber needs while secondarily
    considering environmental and societal impacts. There is a growing concern regarding
    the negative consequences of current trends in agricultural productivity and a
    concern that these trends cannot continue indefinitely. Increases in agricultural
    productivity have spawned hypoxia in coastal and inland waters around the world
    because of increased concentrations of nitrogen and phosphorus, altering the planet’s
    biogeochemistry. A sustainable food system will be key to ensuring that the world’s
    population receives necessary nutrition without contributing additional damage
    to the environment and society. As with the electric grid, the opportunities for
    IT seem most salient in the systems issues in sustainable agriculture.


    The recent report of the National Research Council on sustainable agriculture
    defines a “sustainable agriculture system” as one that (1) satisfies human food,
    feed, and fiber needs and contributes to biofuel; (2) enhances environmental quality
    and the resource base; (3) sustains the economic viability of agriculture; and
    (4) enhances the quality of life of farmers, farmworkers, and society as a whole.^31
    The first point naturally requires both sufficient food production and a population
    sized appropriately for the food that can be produced. The American Public Health
    Association, in its policy statement on sustainable food systems, builds on these
    ideas, defining a sustainable food system as one that “provides healthy food to
    meet current food needs while maintaining healthy ecosystems that can also provide
    food for generations to come with minimal negative impact to the environment.”^32


    A sustainable food system will need to address simultaneously all four of the
    objectives listed above rather than optimizing over any individual dimension.
