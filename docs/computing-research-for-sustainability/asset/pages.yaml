  md: '# ## BOX 2.1


    # ### Understanding the Gap Between Observation and Truth


    The reality of noisy, multigeneration, multisource data streams requires new machine
    learning and data-mining algorithms that explicitly model the measurement process,
    including its biases, noise, and resolution, and so on, in order to capture the
    true phenomenon of interest, which is not directly observed.¹ Such methods should
    treat the data in their original, raw form so that they can capture and take account
    of different properties of each generation of instrumentation. In general, this
    is a gap between observation and understanding truth. In a basic sense, this gap
    exists whenever a transducer is used to measure a phenomenon—in addition to the
    mapping from input stimulus to output reading, there is a question of how the
    transducer is coupled to the underlying phenomenon generating the stimulus. How
    is the accelerometer bonded to the vibrating beam? How does the soil-moisture
    sensor disturb the hydrological behavior of the surrounding soil? A phenomenological
    gap may exist regardless of the precision of the sensor.


    For example, consider the case of an observer conducting a biodiversity survey.
    The observer visits a site and fills out a checklist of all the species observed.
    The resulting data provide a record of detections rather than a record of the
    true presence or absence of the species. The latter can be captured by an occupancy/detection
    model,² as shown in Figure 2.1.1.


    ![](img/c6a60667ee0f315137df705da9549366_84_0.png)


    **FIGURE 2.1.1** Probabilistic graphical model representation of the occupancy/detection
    model. Observed variables are shaded; S is the number of sites; J is the number
    of visits to each site. An observer visits site s at time j and reports Y_sj =
    1 if the species is detected and 0 if not. The hidden variable Z_s = 1 if the
    species is present at site s and 0 otherwise. X_s is a vector of attributes of
    the site, and the X→Z relationship predicts whether, based on these attributes,
    the species will be present. This is the occupancy model that is of primary interest.
    W_s is a vector of attributes that influence detectability (e.g., the level of
    expertise of the observer, the density of the foliage, the weather, how much time
    the observer spent, etc.). The Z→Y→W relationship represents the detection model,
    which predicts the probability that the species will be detected given that it
    is actually present (and the probability that it will be falsely reported, given
    that it is actually absent).


    ¹S.K. Thompson and G.A.F. Seber, *Adaptive Sampling*, Washington, D.C.: Wiley
    Interscience (1996) offers researchers in fields ranging from biology to ecology
    to public health an introduction to adaptive sampling.


    ²D.I. MacKenzie, J.D. Nichols, J.A. Royle, K.H. Pollock, J.E. Hines, and L.L.
    Bailey, *Occupancy Estimation and Modeling: Inferring Patterns and Dynamics of
    Species Occurrence*, San Diego, Calif.: Elsevier (2005).'
