  img_proc: true
- pgno: 110
  md: 'and new features are then added over time. This approach allows products to
    get to market sooner and helps to avoid or reduce the development of features
    that are not really needed, as well as revealing what actually works in practice.
    In short, after initial deployment, reality (instead of anticipated or modeled
    reality) guides the evolution of the feature set. The understanding of the human
    systems into which all computing systems are deployed is highly limited (not least
    because the understanding and modeling of humans and organizations are highly
    incomplete and flawed at best). Thus one cannot generally anticipate and simulate
    all uses. The world of computer systems has grown to evolve features that are
    adapted to what the users of those systems demand. A virtuous cycle has resulted—users
    have come to expect flexibility and malleability, thus ensuring that feedback
    loops occur. Systems have versions that are rolled out as available and as features
    are demanded. Change management is a basic fabric of these systems, which are
    designed for ongoing change. These systems have innovation and expectations of
    innovation literally encoded within them.


    Another way to think about the inherent adaptability of computer science is to
    consider an “end to end” argument for the inclusion of authentic applications
    in systems research. The original end-to-end argument put forward by Saltzer,
    Reed, and Clark was as follows:


    > > [F]unctions placed at low levels of a system may be redundant or of little
    value when compared with the cost of providing them at that low level. . . . The
    argument appeals to application requirements, and provides a rationale for moving
    function upward in a layered system, closer to the application that uses the function.5


    This same logic has implications for systems research and innovation. Authentic
    applications should be included as part of systems research exploration at as
    high a level as possible in order to keep functional and performance requirements
    on a purposeful track. For the purposes of this report, notions of authenticity
    must encompass high-impact applicability to sustainability challenges.


    These fundamentals in computer science are relevant to the way that CS research
    is done and the way in which research and development investment is approached.
    This “built for change” characteristic also facilitates the transition from one
    application to another. Algorithms and their instantiations can be adaptive, iteratively
