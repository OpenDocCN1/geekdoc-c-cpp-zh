    +   - Coordination between academic research in computer science and non-traditional
    industrial partners—that is, beyond the large IT companies—to scope problems,
    help train students, and cross-fertilize ideas; and

    +   - Regular, high-level summits involving computer science and sustainability
    experts—practitioners and researchers—to inform shared research design, assess
    progress, and identify gaps and opportunities.


    The conceptualization of the bottom-up emergence of universality is relevant to
    researchers, university systems, and funding agencies in the following respects:


    +   - Researchers—emphasizing a bottom-up approach affects how researchers select
    and approach their problems and how they approach the training of their students.
    Cross-training, learning other languages and vocabularies, immersion, and intensive
    and sustained collaboration are all important aspects of how research will need
    to be done. Although it may be essential to making real progress with respect
    to sustainability challenges, long-term commitment to a specific domain area is
    typically inherently risky for a CS researcher, because specific problems in sustainability
    may be addressed successfully but universal ideas or techniques may not necessarily
    materialize.

    +   - University systems—a focus on bottom-up approaches affects how universities
    incentivize and create the infrastructure for faculty to pursue sustained multidisciplinary
    efforts. The computer science community has made progress in tenure and in the
    promotion of individuals who straddle disciplinary boundaries. Is such boundary
    crossing sufficiently encouraged and explicitly incentivized? Publication rates
    and pressures are higher than ever. Publication is essential to a successful R&D
    ecosystem, but does an emphasis on frequent publication have a negative effect
    on the pursuit of R&D which tackles difficult application domains that have not
    previously been processed and translated into computer science problems?'
