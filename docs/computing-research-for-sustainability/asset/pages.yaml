    Technologies used here include the Global Positioning System, real-time kinematics,
    and geographic information systems, especially satellites. IT already plays a
    substantial role in this area and will continue to play a critical role in the
    future. There is also a connection with methodologies for measuring costs and
    benefits: if the cost of water for agricultural use reflects its true cost, there
    may be much more incentive to use precision agriculture to reduce the consumption
    of water.


    **Information for Informed Consumption** Increasing the information available
