- pgno: 102
  md: '# # 3


    # # Programmatic and Institutional Opportunities to Enhance Computer Science Research
    for Sustainability


    The challenges of achieving a sustainable society are truly global, with complex
    interdependencies that affect risk assessments, technical and social opportunities
    for solutions, and economic and political feasibility. No one field or discipline
    on its own could possibly be expected to “solve” even one aspect of this problem.
    However, information is central to making progress on many fronts. Thus computer
    science (CS)—which couples information and innovation—is vital to sustainability.
    For computer science to play its part in meeting global sustainability challenges,
    priority should be given to research that addresses one or more important sustainability
    challenges (examples were described in Chapter 1) and that offers significant
    impact. This impact may be direct, or it may be through game-changing contributions
    that offer significant leveraging opportunities for other domains. In either case,
    priority should be placed on opportunities to address the sustainability challenge
    to a tangible degree.


    This chapter explores some of the potential impediments within the field of computer
    science to making significant progress on issues pertinent to sustainability.
    It considers how to bridge the gap between the traditional research quest for
    universality¹ and the imperative to have a specific impact on sustainability challenges.
    The chapter is aimed pri-


    ¹The committee uses the term “universality” to encompass the related notions of
    generality (solutions that are amenable to relatively straightforward abstractions
    in order to address more general versions of a given problem) and breadth (solutions
    that can be revised to be applicable to broad problem domains and spaces). The
    quest for universality captures the traditional CS research goals of abstractability
    and broad applicability.'
