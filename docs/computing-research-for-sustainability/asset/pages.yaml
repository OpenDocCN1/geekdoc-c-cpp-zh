    These challenges are further complicated by the changing nature of the load and
    the broader introduction of distributed generation. Unlike purely resistive loads,
    such as heating elements and incandescent bulbs, complex loads effectively cause
    a portion of the delivered power (called reactive power) to be returned through
    the grid to the generator. Historically, such “non-unit power factor” loads were
    predominantly induction motors, which introduce a fairly simple phase shift in
    the alternating current (AC) waveform. But switching power supplies, such as those
    used in computers, fluorescent bulbs, battery chargers, and electronics direct
    current (DC) adapters, introduce complex distortions on the AC waveforms. Residential
    grid-tie solar installations reverse the flow of electricity within portions of
    the local distribution tree. And the introduction of electric vehicles potentially
    introduces high point loads during recharging. Many of these new complex loads
    already possess communications and computations capabilities, and so they could
    potentially be a vanguard of using IT to condition demand in order to be “good
    citizens” of the grid.


    Compounding all of these issues still further are the economic structures that
    impinge on all aspects of generation, delivery, and demand at a range of timescales.
    On an operational basis, collections of suppliers, consumers, and brokers typically
    participate in highly volatile wholesale energy markets at various granularities
    and timescales—a day ahead, an hour ahead, a minute ahead. Meanwhile, consumers
    typically experience relatively stable retail pricing. Compounding all of these
    issues further, utilities and the utility supply industry are still largely incentivized
    to produce and deliver more energy, not less. Economic or other incentives to
    curb growth are lacking in most parts of the world. A notable exception to this
    is net-metering—mechanisms that allow electricity consumers to offset their usage
    of electricity provided by the grid, and thus to lower their cost, by generating
    their own electricity on-site, typically through rooftop solar photovoltaic installation.
    Basically, this can be thought of as the meter spinning backward when local generation
    exceeds local demand. Although net-metering is comparatively common, its penetration
    is modest enough that it can be incorporated as offsetting demand in the neighborhood
    distribution tree, without appreciable impact on transmission needs. Broader,
    less-tangible incentives include the personal satisfaction of obtaining a zero-net
    lifestyle, potentially opening paths toward the decoupling of quality of life
    from energy usage. IT has an important role in doing the complex accounting and
    providing visibility into the consumption and production of otherwise invisible
    resources.'
