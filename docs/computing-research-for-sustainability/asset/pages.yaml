  md: '# # Summary


    A broad and growing literature describes the deep and multidisci-

    plinary nature of the sustainability challenges faced by the United States

    and the world. Despite the profound technical challenges involved,

    sustainability is not, at its root, a technical problem, nor will merely

    technical solutions be sufficient. Instead, deep economic, political, and

    cultural adjustments will ultimately be required, along with a major, long-

    term commitment in each sphere to deploy the requisite technical solu-

    tions at scale. Nevertheless, technological advances and enablers have a

    clear role in supporting such change, and information technology (IT)[^1] is

    a natural bridge between technical and social solutions because it can offer

    improved communication and transparency for fostering the necessary

    economic, political, and cultural adjustments. Moreover, IT is at the heart

    of nearly every large-scale socioeconomic system—including systems for

    finance, manufacturing, and the generation and distribution of energy—

    and so sustainability-focused changes in those systems are inextricably

    linked with advances in IT. In short, innovation in IT will play a vital role

    if the nation and the world are to achieve a more sustainable future.


    Although the greening of IT—for example, the reduction of electronic

    waste or of the energy consumed by computers—is an important goal of

    the computing community and the IT industry, the focus of this report is


    [^1]: “Information technology” is defined broadly here to include both computing
    and com-

    munications capabilities.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '“greening through IT,” that is, the application of computing to promote sustainability
    broadly.


    The aim of this report is twofold: to shine a spotlight on areas where IT innovation
    and computer science (CS)^2 research can help, and to urge the computing research
    community to bring its approaches and methodologies to bear on these pressing
    global challenges. The focus is on addressing medium- and long-term challenges
    in a way that would have significant, measurable impact.


    The findings and recommended principles of the Committee on Computing Research
    for Environmental and Societal Sustainability concern four areas: (1) the relevance
    of IT and CS to sustainability; (2) the value of the CS approach to problem solving,
    particularly as it pertains to sustainability challenges; (3) key CS research
    areas; and (4) strategy and pragmatic approaches for CS research on sustainability.


    # **RELEVANCE OF INFORMATION TECHNOLOGY AND COMPUTER SCIENCE TO SUSTAINABILITY**


    An often-cited definition of “sustainability” comes from *Our Common Future*,
    the report of the Brundtland Commission of the United Nations (UN): “[S]ustainable
    development is development that meets the needs of the present without compromising
    the ability of future generations to meet their own needs.”^3 The UN expanded
    this definition at the 2005 World Summit to incorporate three pillars of sustainability:
    its social, environmental, and economic aspects.^4 This report takes a similarly
    broad view of the term. Although much of the focus in sustainability has been
    on mitigating climate change, with efforts aimed at managing the carbon dioxide
    cycle and increasing sustainable energy sources, there are other important sustainability
    challenges (such as water management, improved urban planning, supporting biodiversity,
    and food production) that can also be transformed by advances in computing research
    and are thus considered in this report.


    It is natural when viewing sustainability through the lens of computer science
    to take a systems view. An elaboration on the broad definition of


    2 “Computer science” is defined broadly here to include computer and information
    science and engineering.


    3 United Nations General Assembly, March 20, 1987, *Report of the World Commission
    on Environment and Development: Our Common Future*, transmitted to the General
    Assembly as an Annex to document A/42/427—Development and International Co-operation:
    Environment; *Our Common Future, Chapter 2: Towards Sustainable Development*,
    Paragraph 1, United Nations General Assembly. Available at http://www.un-documents.net/ocf-02.htm.


    4 United Nations General Assembly, 2005 World Summit Outcome, Resolution A/60/1,
    adopted by the General Assembly on September 15, 2005.'
