    # ## The Energy Challenge


    Participants suggested considering broad sustainability challenges in the context
    of the energy challenge. The interconnected nature of people''s basic resource
    needs, such as water, energy, and transportation, and the economic arrangements
    among these resources create a very complex problem. However, these interactions
    also mean that the energy challenge can serve as a useful proxy for sustainability
    challenges related to other limited resources.


    The primary function of the electric grid is to deliver high-quality, low-cost
    power to millions of customers who are geographically distributed over thousands
    of miles. The fact that consumers have been able to make use of the grid without
    needing much knowledge about their own consumption patterns, or about where the
    power is coming from, has contributed to rapid economic and industrial growth.
    People have been able to use a comparatively inexpensive resource—energy created
    mostly through the burning of fossil fuels—essentially indiscriminately to expand
    the production of products that spur the economy. Additionally, enabling a usage
    model in which consumers could remain ignorant of their own consumption patterns
    meant that the grid has been tasked with delivering a high-quality commodity at
    extremely low cost. Moreover, the expectation has been that power would be delivered
    immediately as needed. The power grid is expected to meet these goals with minimal
    forecasting or anticipation of that need, except at very coarse granularity, and
    without inventory storage along the energy supply chain.


    The current energy model is increasingly complex, with numerous sources of energy,
    a variety of stakeholders and consumers, and a not insignificant fraction lost
    during transport. A pressing sustainability challenge revolves around these questions:
    How can energy use be reduced, and can it be done without significant economic
    hardship? The following question was discussed: Where and how can computer science
    fit into this picture?


