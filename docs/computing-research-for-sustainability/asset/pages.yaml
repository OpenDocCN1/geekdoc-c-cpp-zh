    In order to handle big data, new approaches or improvements will be required in
    data mining, including clustering, neural networks, anomaly detection, and so
    on. For example, the smart grid will grow in terms of complexity and uncertainty,
    especially as renewables are made a more significant element of the energy mix.
    This increasing complexity will create an increasingly complex system of equations
    that will need to be solved on a shrinking timescale in order to create secure
    and dispatchable energy over larger geographies. This challenge implies a need
    for improvements in computational capabilities to cope with problems ranging from
    relatively simple N  1 contingency analysis, to N  x, to an ability to parallelize
    the solution to very large systems of sparsely populated matrices and equations
    that run on high-performance computing systems. In addition, appropriate semantic
    layers will be needed to bridge the various data sources with a common vocabulary
    and language, in such a way as to make them more universally applicable.


    # ## Heterogeneity of Data


    Because sustainability problems involve complex systems, the data relevant to
    those systems are typically very heterogeneous. Challenges lie not just with huge
    quantities of data, but stem also from the heterogeneity of their structure and
    the number of data sets often needed to study a topic. In the management of ecosystems
    (fisheries, forests, freshwater systems), relevant data sources range from detailed
    ground-based measurements (catch-and-release surveys, tree core data), to transactional
    data (fish harvest, timber sales), to hyperspectral and lidar data collected by
    aircraft and satellites. As discussed above, data for smart buildings include
    not only energy-consumption and outdoor-weather data, but also data on room occupancy,
    the state of doors and windows (open or closed), thermostat settings, air flows,
    HVAC operational parameters, building structure and materials, and so on. Dealing
    with such diverse forms of information arises, to a lesser degree, in multimodal
    multiphysics simulations, which typically stitch together multiple major simulation
    capabilities using specialized adapters and a deep understanding of the algorithms
    employed in each subsystem. Similar situations arise in data fusion problems and
    large-scale logistics, such as air-traffic control. But such management of vastly
    heterogeneous information and processing is typically done on a domain-specific
