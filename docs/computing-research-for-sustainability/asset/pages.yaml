    and there are safety concerns about customer-installation of gas fixtures. However,
    a sensor could be installed by clipping it to the nationally mandated regulator
    on appliances. The acoustic vibrations of the diaphragm are linearly proportionate
    to flow. By measuring these vibrations, real-time consumption information can
    be determined. In addition, transient events that occur from the opening and closing
    of gas valves manifest themselves through the valve itself. This information can
    be used to determine exactly what appliance is being used.


    # Interfaces for Actionable Feedback


    Participants noted that interfaces for providing the disaggregated sorts of data
    and feedback discussed above are critical to the successful and effective deployment
    of sensors. The typical “interface” is the simple electric bill and meter in homes.
    The meter was not designed for consumers to read, and the bill, which is for the
    consumer, usually provides only an end-of-cycle reading. Even the units used in
    the typical electric bill are not very user-friendly: do most consumers understand,
    for example, what a kilowatt-hour means? Water bills are typically even more aggregated,
    most include up to 3 months of water use. If a spike occurred in water usage due
    to, for instance, a leaky valve, the consumer would not have any knowledge of
    it until the end of the billing cycle. Clearly there are opportunities for interface
    design to play a role in communicating better and more actionable information.
    Unfortunately, there are currently only limited examples of interfaces that provide
    disaggregated feedback in approximately real time. One obvious example is gas-electric
    hybrid'
