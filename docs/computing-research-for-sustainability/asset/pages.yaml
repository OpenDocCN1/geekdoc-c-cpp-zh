    through the provision of information to individuals and organizations to assist
    in decision making. Participants noted that this type of assistance can be provided
    at many levels. They discussed various types of tools ranging from those that
    can help inform comparatively simple sorts of personal decision making; to tools
    that can help people understand large, complex challenges and how their individual
    actions and behaviors might help; to tools that can assist in understanding and
    resolving complex challenges that require complex and/or coordinated responses.


