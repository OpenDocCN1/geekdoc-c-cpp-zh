    These Reports have shown how research partnerships between the federal government
    and industry ultimately led to the creation of many well-known multibillion-dollar
    industries. These results suggest the potential sustainability payoffs from the
    right investments in IT.


    Many of the advances presented in the CSTB reports, such as those in processors
