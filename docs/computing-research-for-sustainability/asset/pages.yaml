  md: 'state of the plant. The controller then determines the appropriate control
    decisions, which are transmitted to the actuators. However, as the “plant” becomes
    a large, spatially distributed system (e.g., a city, a power grid, an ecosystem)
    and the volume of data becomes overwhelming, it is no longer feasible to integrate
    centrally the state estimation and decision making. A recent International Data
    Corporation study⁶ suggests that there will be more than 35 zettabytes of data
    stored in 2020. Distributed algorithms are needed that can push as much computation
