- pgno: 69
  md: 'For each area, examples of research problems focused on sustainability opportunities
    are given. The discussions do not provide a comprehensive list of problems to
    be solved, but do provide exemplars of the type of work that both advances computer
    science and has the potential to advance sustainability objectives significantly.
    In examining opportunities for research in CS and sustainability, questions that
    one should attempt to answer include these: What is the potential impact for sustainability?
    What is the level of CS innovation needed to make meaningful progress?


    As discussed in Chapter 1, complete solutions to global sustainability challenges
    will require deep economic, political, and cultural changes. With regard to those
    changes, the potential role for CS and IT research discussed in this chapter is
    of indirect, but it is still important. For example, CS research could focus on
    innovative ways for citizens to deliberate over and to engage with government
    and with one another about these issues, with the deliberations closely grounded
    in data and scientific theory. For some critical sustainability challenges, such
    as the anticipated effects of global population growth, the potential CS research
    contribution is almost entirely of this indirect character. For instance, there
    is potential for using the results of modeling and visualization research toward
    the aim of improved education and better understanding of population and related
    issues. In addition, advances in IT in the areas of remote sensing, network connectivity
    services, adaptive architectures, and approaches for enhanced health diagnosis
    and care delivery—especially in rural areas—also have a bearing on population
    concerns. Other contributions from CS and IT research toward meeting such challenges
    could be aimed at developing tools to support thoughtful deliberation, with particular
    emphasis on encompassing widely differing views and perspectives.


    The research areas described in this chapter correspond well with the broader
    topics of measurement, data mining, modeling, control, and human-computer interaction,
    which are, of course, well-established research areas in computer science. This
    overlap with established research areas has positive implications—in particular,
    the fact that research communities are already established making it unnecessary
    to develop entirely new areas of investigation. At the same time, the committee
    believes that there is real opportunity in these areas for significant impacts
    on global sustainability challenges. Finding a way to achieve such impacts effectively
    may require new approaches to these problems and almost certainly new ways of
    conducting research.


    In terms of a broad research program, an important question is how to structure
    a portfolio that spans a range of fundamental questions, pilot efforts, and deployed
    technologies while maintaining focus on sustainability objectives. For any given
    research area in the sustainability space,'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'efforts can have an impact in a spectrum of ways. First, one can explore the
    immediate applicability of known techniques: What things do we know how to do
    already with computational techniques and tools, and how can we immediately apply
    them to a given sustainability challenge? Second, one can seek opportunities to
    apply known techniques in innovative ways: Where are the opportunities in which
    the straightforward application of a known technique will not work but where it
    seems promising to transform or translate a known technique into the domain of
    a particular sustainability challenge? This process tends to transform the techniques
    themselves into new forms. Finally, one can search for the areas in which innovation
    and the development of fundamentally new computer science techniques, tools, and
    methodologies are needed to meet sustainability challenges. While endorsing approaches
    across this spectrum, the committee urges emphasis on solutions that have the
    potential for significant impacts and urges the avoidance of simply developing
    or improving technology for its own sake.


    The advancing of sustainability objectives is central to the research agenda outlined
    in this report. As in any solution-oriented research space, there is a tension
    between solving a substantive domain problem, perhaps creating tools, techniques,
    and methods that are particularly germane to the domain, and tackling generalized
    problems, perhaps motivated by the domain, for which solutions advance the broader
    field. (Chapter 3 discusses this challenge in more detail and provides the committee’s
    recommendations on structuring research programs and developing research communities
    in ways that constructively address these issues.) When focusing on the challenges
    presented in a particular domain, it is often essential that the details are right
    in order for the work to have meaningful impact. For the work to have broader
    impact, it must be possible to transcend the details of a particular problem and
    setting. Much of the power in computer science derives from the development of
    appropriate abstractions that capture essential characteristics, hide unnecessary
    detail, and permit solutions to subproblems to be composed into solutions to larger
    problems. A focus on getting the abstraction right for large impact, appropriateness,
    and generalizability is important. Simultaneously, it is important to characterize
    aspects of the solution that are not generalizable.


    **FINDING:** Although current technologies can and should be put to immediate
    use, CS research and IT innovation will be critical to meeting sustainability
    challenges. Effectively realizing the potential of CS to address sustainability
    challenges will require sustained and appropriately structured and tailored investments
    in CS research.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '**PRINCIPLE:** A CS research agenda to address sustainability should incorporate
    sustained effort in measurement and instrumentation; information-intensive systems;
    analysis, modeling, simulation, and optimization; and human-centered systems.


    # MEASUREMENT AND INSTRUMENTATION


    Historically, sensors, meters, gauges, and instruments have been deployed and
    used within the vertically integrated context of a single task or system. For
    example, a zone thermostat triggers the inflow of cold or hot air into specific
    rooms when the measured air temperature deviates from the target set point by
    an amount in excess of the guard band; the manifold pressure sensor in a car dictates
    the engine ignition timing adjustment; the household electric meter is the basis
    for the monthly utility bill; water temperature, salinity, and turbidity sensors
    are placed at particular junctures in a river to determine the effects of mixing
    and runoff; and so on. Examples of specific scenarios are innumerable and incredibly
    diverse, but they have in common the following: the selection of the measurement
    device, its placement and role in the encompassing system or process, and the
    interpretation of the readings it produces are all determined a priori, at design
    time, and the resulting system is essentially closed—sensor readings are not used
    outside the system.


    This situation has changed dramatically over the past couple of decades owing
    to the following key factors:


    +   - **Embedded computing.** Until the 1990s, the electronics associated with
    the analog-to-digital conversion, the rescaling to engineering units, and the
    associated storage and the data processing dwarfed the size and cost of the transducer
    used to convert the physical phenomenon to an electrical signal. Consequently,
    these electronics were shared resources wired to remote sensors. Over the past
    20 years, digital electronics have shrunk to a small fraction of their former
    size and cost, have been integrated directly into the sensor or actuator, and
    have expanded in function to include quite general processing, storage, and communication
    capabilities. The'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'configurable, self-contained nature of modern instrumentation reduces the costs
    of deployment and enables broader use.


    +   - *Information-rich operation.* The primary control loop of operational processes
    (typically represented in manufacturing as plant-sensor-controller-actuator-plant)
    is usually augmented with substantial secondary instrumentation to permit optimization.
    For example, in refinery process control, such additional instrumentation streams
    help to tune controllers to increase yield or reduce harmful by-products. In semiconductor
    manufacturing, they are employed in conjunction with small-scale process perturbation
    and large-scale statistical analysis in order to shorten the learning curve and
    reach a final configuration more quickly. In environmental conditioning for buildings,
    multiple sensing points are aggregated into zone controllers. Automotive instruments
    are fused to present real-time mileage information to the driver.

    +   - *Cross-system integration.* Measurements designed for one system are increasingly
    being exploited to improve the quality or performance of others. For example,
    light and motion sensors are installed to modulate the amount of artificially
    supplied lighting in many “green buildings.” But those motion detectors are then
    also available to serve as occupancy indicators in sophisticated heating, ventilation,
    and air conditioning (HVAC) controls. Rather than simply isolating indoor climate
    from external factors, modern design practice may seek to exploit passive ventilation,
    heating, and cooling; to do so requires the instrumentation of building configuration
    (such as open and closed window and door states) and of external and internal
    environmental properties (temperature, humidity, wind speed, etc.). All of these
    sources of information may also be exploited for longitudinal analysis, to drive
    recommissioning, retrofitting, and refining operations. Interval utility meter
    readings are used not just for time-of-use pricing but also to guide energy-efficiency
    measures. Traffic measurements and content-condition instrumentation are applied
    to optimize logistics operations.


    The factors described above have changed the role of instrumentation and measurement
    from a subsidiary element of the system design process to an integrative, largely
    independent process of design and provisioning of physical information services.
    For many sustainability challenges, methodologies are needed that can start with
    an initial model that is based on modest amounts of data collected during the
    design process; those methodologies would then include the development of an incremental
    plan for deploying sensors that progressively improves the model and exploits
    the improvements to achieve the goals of the system. In many sustainability applications,
    such as climate modeling and building modeling, the most effective approach may
    involve combining mechanistic'
