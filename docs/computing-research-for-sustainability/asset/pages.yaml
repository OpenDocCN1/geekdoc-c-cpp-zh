    # Wrap-Up Discussion


    This session resulted in a wide-ranging discussion from the participants at the
    workshop. Several key points raised are outlined below:


    +   - Within the information technology industry, significant innovation has been
    accomplished at small businesses or start-ups, which then are often acquired by
    large corporations. This suggests that small amounts of money could fund highly
    innovative projects in sustainability, given the proper organizational structure
    and incentive.

    +   - Although sustainability can be viewed in many ways as a technical problem,
    it will not be solved through technological solutions alone. Some people conjecture
    that in addition to major scientific and technical breakthroughs to meet sustainability
    challenges, large-scale social change will be needed, perhaps even on the scale
    of the U.S. civil rights movement. Computer scientists can contribute tools that
    encourage individual participation in addressing sustainability challenges.

    +   - Small businesses often require specialized information that can be hard
    to acquire. Computational techniques and technologies can help by providing ways
    to collect, aggregate, distribute, and analyze data, as well as techniques for
    communication and coordination as appropriate.30

    +   - There are trade-offs in discussing solutions. For example, raising temperatures
    in server rooms may reduce cooling loads but lead to higher failure rates. These
    trade-offs and failure rates have to be fully understood so that the best trade-offs
    can be made.

    +   - Domain scientists (such as ecologists, transportation specialists, civil
    and power engineers) need to share information and knowledge with people doing
    innovation, including computer scientists. The first step for computer science
    might simply be finding a better way to present these data, which would help policy
    makers. Decision makers need to understand the data more clearly before they can
    form policy.


    30 An example was given of a case in which a number of local coffee shops were
    interested in purchasing biodegradable products. Today, biodegradable cups are
    more expensive and are only affordable if purchased in very large quantities.
    It can link companies willing to purchase and share large shipments. Also, not
    all biodegradable cups are biodegradable to the same extent, an information gap
    that could be solved with more usable data. However, computer scientists typically
    have little knowledge about the chemical makeup of products, and so there is also
    a need for coordination across multiple disciplines and industries.'
