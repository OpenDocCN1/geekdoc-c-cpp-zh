- pgno: 167
  md: '**David Culler (NAE)**, a professor and chair of computer science, associate
    chair of electrical engineering and computer sciences, and faculty director of
    i4energy at the University of California, Berkeley, received his B.A. from the
    University of California, Berkeley (1980) and an M.S. and a Ph.D. from the Massachusetts
    Institute of Technology (1985 and 1989, respectively). He joined the Department
    of Electrical Engineering and Computer Science faculty in 1989, where he holds
    the Howard Friesen Chair. He is a member of the National Academy of Engineering,
    a fellow of the Association for Computing Machinery (ACM), and an Institute of
    Electrical and Electronics Engineers fellow; he was selected for ACM''s Sigmod
    Outstanding Achievement Award, and was named in the *Scientific American* Top
    50 Researchers and the Technology Review: 10 Technologies That Will Change the
    World. He was awarded the National Science Foundation (NSF) Presidential Young
    Investigator Award in 1990 and the NSF Presidential Faculty Fellowship in 1992.
    He was the principal investigator (PI) of the Defense Advanced Research Projects
    Agency network embedded systems technology project that created the open platform
    for wireless sensor networks based on TinyOS, a co-founder and the chief technology
    officer of Arch Rock Corporation, and the founding director of Intel Research,
    Berkeley. He has done seminal work on networks of small, embedded wireless devices,
    planetary-scale internet services, parallel computer architecture, parallel programming
    languages, and high-performance communication, including TinyOS, PlanetLab, Networks
    of Workstations (NOW), and Active Messages. He has served on technical advisory
    boards for several companies, including People Power, Inktomi, ExpertCity (now
    Citrix Online), and DoCoMo USA. He is currently focused on utilizing information
    technology to address the energy problem and is co-PI on the NSF Cyber-Physical
    Systems projects LoCal and ActionWebs.


    **Thomas Dietterich**, professor at Oregon State University (OSU), focuses on
    interdisciplinary research at the boundary of computer science, ecology, and sustainability
    policy. He is the principal investigator (with Carla Gomes of Cornell University)
    of a 5-year National Science Foundation (NSF) Expedition in Computational Sustainability.
    He is part of the leadership team for OSU''s Ecosystem Informatics programs, including
    an NSF Summer Institute in Ecoinformatics. Dr. Dietterich received his A.B from
    Oberlin College (1977), M.S. from the University of Illinois (1979), and Ph.D.
    from Stanford University (1984). He is professor and director of Intelligent Systems
    in the School of Electrical Engineering and Computer Science at OSU, having joined
    the faculty there in 1985. In 1987, he was named a Presidential Young Investigator
    for the NSF. In 1990, he published, with Dr. Jude Shavlik, the book entitled *Readings
    in Machine*'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'Learning, and he also served as the technical program co-chair of the National
    Conference on Artificial Intelligence (AAAI-90). From 1992 to 1998 he held the
    position of executive editor of the journal *Machine Learning*. He is a fellow
    of the Association for the Advancement of Artificial Intelligence (1994), the
    Association for Computing Machinery (2003), and the American Association for the
    Advancement of Science (2007). In 2000, he co-founded the free *Journal of Machine
    Learning Research* and he is currently a member of its editorial board. He served
    as technical program chair of the Neural Information Processing Systems (NIPS)
    conference in 2000 and as general chair in 2001. He is past president of the International
    Machine Learning Society (IMLS) and a member of the IMLS board, and he also serves
    on the advisory board of the NIPS Foundation.


    **Daniel Kammen** is the Class of 1935 Distinguished Professor of Energy at the
    University of California, Berkeley, with parallel appointments in the Energy and
    Resources Group, the Goldman School of Public Policy, and the Department of Nuclear
    Engineering. He serves as an Environment and Climate Partnership for the Americas
    (ECPA) Fellow for Secretary of State Hillary Clinton. Dr. Kammen is the founding
    director of the Renewable and Appropriate Energy Laboratory (RAEL), co-director
    of the Berkeley Institute of the Environment, and director of the Transportation
    Sustainability Research Center. He has founded or is on the board of more than
    10 companies and has served the State of California and the U.S. government in
    expert and advisory capacities. Dr. Kammen was educated in physics at Cornell
    University and Harvard University, and held postdoctoral positions at the California
    Institute of Technology and Harvard. He was assistant professor and chair of the
    Science, Technology and Environmental Policy Program at the Woodrow Wilson School
    at Princeton University before moving to the University of California, Berkeley.
    Dr. Kammen has served as a contributing or coordinating lead author on various
    reports of the Intergovernmental Panel on Climate Change (IPCC) since 1999. The
    IPCC shared the 2007 Nobel Peace Prize. During 2010-2011, Dr. Kammen served as
    the World Bank Group''s chief technical specialist for renewable energy and energy
    efficiency. In this newly created position to which he was appointed in October
    2010, he provided strategic leadership on policy, technical, and operational fronts.
    The aim is to enhance the operational impact of the World Bank''s renewable energy
    and energy-efficiency activities while expanding the institution''s role as an
    enabler of global dialogue on moving energy development to a cleaner and more
    sustainable pathway. He has authored or co-authored 12 books, written more than
    250 peer-reviewed journal publications, testified more than 40 times at U.S. state
    and federal congressional briefings, and has provided various governments with
    more than 50 technical reports. Dr. Kammen also served'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'for many years on the Technical Review Board of the Global Environment Facility.
    He is a frequent contributor to or commentator in international news media, including
    *Newsweek*, *Time*, *The New York Times*, *The Guardian*, and *The Financial Times*.
    Dr. Kammen has appeared on *60 Minutes* (twice), *Nova*, and *Frontline*, and
    he hosted the six-part Discovery Channel series *Ecopolis*. He is a permanent
    fellow of the African Academy of Sciences and a fellow of the American Physical
    Society. In the United States he serves on a board and a panel of the National
    Academy of Sciences.


    **Jennifer Mankoff** is an associate professor in the Human-Computer Interaction
    Institute at Carnegie Mellon University. She earned her B.A. at Oberlin College
    and her Ph.D. in computer science at the Georgia Institute of Technology. Her
    research embodies a human-centered perspective on data-driven applications. Her
    goal is to combine empirical methods with technological innovation to construct
    middleware (tools and processes) that can enable the creation of impactful data-driven
    applications. Examples of such application areas include sensing and influencing
    energy-saving behavior, web interfaces for individuals with chronic illness, and
    assistive technologies for people with disabilities. Dr. Mankoff helped found
    the sustainable-chi group (www.sustainable-chi@googlegroups.com). Her research
    has been supported by Google, Inc., the Intel Corporation, IBM, Hewlett-Packard,
    Microsoft Corporation, and the National Science Foundation. She was awarded the
    Sloan Fellowship and the IBM Faculty Fellowship.


    **Roger D. Peng** is an associate professor of biostatistics at the Johns Hopkins
    Bloomberg School of Public Health. He received his Ph.D. in statistics from the
    University of California, Los Angeles. He is a prominent researcher in the areas
    of air pollution and health risk assessment and statistical methods for spatial
    and temporal data. Dr. Peng is a national leader in the area of methods and standards
    for reproducible research; he is the Reproducible Research editor for the journal
    *Biostatistics*. He has developed novel approaches to integrating complex national
    databases for assessing population health effects of environmental exposures and
    has developed software for efficiently distributing data over the web for disseminating
    reproducible research. Dr. Peng''s research is highly interdisciplinary; his work
    has been published in major substantive and statistical journals, including the
    *Journal of the American Medical Association*, *Journal of the American Statistical
    Association*, *Journal of the Royal Statistical Society*, and *American Journal
    of Epidemiology*. Dr. Peng is the author of more than a dozen software packages
    implementing statistical methods for environmental studies, methods for reproducible
    research,'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'and data distribution tools. He has also given workshops, tutorials, and short
    courses in statistical computing and data analysis.


    **Andreas Vogel** is vice president in the global business incubator at SAP Labs
    in Palo Alto, California, where he currently works on virtual economies and recommender
    systems for online games. Previously he incubated a product for analyzing smart
    meter data and developed the next generation of sustainability-related software
    solutions, including those involving carbon accounting, energy management, and
    electrified vehicles. He also helped to create and implement SAP''s sustainability
    strategy. Before joining SAP, Dr. Andreas held various research, technology, and
    business positions around the world—among them, chief scientist at Borland and
    chief technology officer and co-founder of Mspce, where he developed monitoring
    solutions for mobile data networks. Dr. Andreas holds a M.Sc. and a Ph.D. in computer
    science from Humboldt University, Berlin, Germany. He co-authored four books on
    Common Object Request Broker Architecture (CORBA), Enterprise Java Beans, and
    enterprise resource planning (ERP) published by J. Wiley and Sons.


    # Staff


    **Lynette I. Millett** is a senior program officer and study director at the Computer
    Science and Telecommunications Board (CSTB), National Research Council of the
    National Academies. She currently directs several CSTB projects, including an
    exploration of foundational science in cyber-security. She recently completed
    the project that produced *Strategies and Priorities for Information Technology
    at the Centers for Medicare and Medicaid Services*. Ms. Millett''s portfolio includes
    substantial portions of CSTB''s recent work on software, identity systems, and
    privacy. She directed, among other projects, those that produced *The Future of
    Computing Performance: Game Over or Next Level?*, an examination of the causes
    and implications of the slowdown in the historically dramatic exponential growth
    in computing performance; *Software for Dependable Systems: Sufficient Evidence?*,
    an exploration of fundamental approaches to developing dependable mission-critical
    systems; *Biometric Recognition: Challenges and Opportunities*, a comprehensive
    assessment of biometric technology; *Who Goes There? Authentication Through the
    Lens of Privacy*, a discussion of authentication technologies and their privacy
    implications; and *IDs—Not That Easy: Questions About Nationwide Identity Systems*,
    a post-9/11 analysis of the challenges presented by large-scale identity systems.
    She has an M.Sc. in computer science from Cornell University, where her work was
    supported by graduate fellowships from the National Science Foundation'
