    # # ANALYSIS, MODELING, SIMULATION, AND OPTIMIZATION


    One key role of computer science in sustainability is to provide technology for
    model development. Models permit the extraction of meaningful information from
    context-dependent, potentially noisy measurements and observations of complex,
    at best partially engineered, systems in the physical world. Models allow the
    many interrelated aspects to be decomposed into facets so that progress can be
    made in a somewhat incremental fashion. Models provide a frame of reference for
    the many distinct but interrelated streams of information. Computational resources
    and CS techniques can be brought to bear in several ways: to refine the grid size
    and time step, to improve the model’s representation of processes (making it more
    complex), and to run the model over multiple scenarios (varying the time period,
    input values, and so on). This section discusses three interrelated topics: multiscale
    models, the combining of mechanistic and statistical models, and optimization
    under uncertainty.


    # ## Developing and Using Multiscale Models


    Multiscale models, the first of the three interrelated topics, represent processes
    at multiple temporal and spatial scales. For example, a biological population
    model might include the agent-level modeling of each organism within a landscape,
    coupled with the block-level modeling of group behavior at a regional scale, and
    population-level modeling at a continental scale. Forest fire models could include
    models of individual tree growth and burning, coupled with the stand-level and
    landscape-level modeling of fuel load, coupled with regional models of fire ignition
    and weather. Global multiscale weather models can operate at low resolution over
    the entire planet but with higher resolution over regions of interest (e.g., for
    forecasting hurricanes). In a sense, most sustainability problems arise because
    behavior at one scale (e.g., energy use in automobiles, land use along migration
    flyways) affects phenomena at very different scales (e.g., global climate change,
    species extinctions), and those larger-scale phenomena then enter a feedback cycle
    affecting activities at lesser scales. Multiscale models are important for understanding
    these sorts of problems.'
