    Innovation in Information Technology, Washington, D.C.: The National Academies
    Press (2003)）从催生数十亿美元产业的角度探讨了计算机科学和信息技术的创新。该列表包括分时、客户端/服务器计算、娱乐、互联网、局域网、工作站、图形用户界面、超大规模集成与设计以及精简指令集计算处理器。2004年发布的一份CSTB报告阐述了计算机科学的基本特征，并聚焦于七个关键主题：计算机科学（1）涉及符号及其操作，（2）涉及抽象的创建和操作，（3）创造并研究算法，（4）创造人工构造，（5）利用并应对指数增长，（6）寻求可计算内容的基本极限，（7）关注支撑技术成就的复杂、分析性、理性探究（National
    Research Council, Computer Science: Reflections on the Field, Reflections from
    the Field, Washington, D.C.: The National Academies Press (2004)）。这些列表之间的差异不如注意到以下这一点重要：在一个核心优势包括抽象和适应性的领域，聚焦问题解决的力量有多么强大。


