    间隔。为了提供实时消耗数据，开发了一种磁阻传感器，它安装在断路器面板外侧，但可在屋内读取。公用事业公司已对该工具进行了现场测试，并取得一定成功，以确定消费者是否有能力自行安装。


    - 测量和跟踪用水量也面临类似的挑战。显然，任何安装时需要切割管道的传感器都不适合消费者使用。一种单点水感应解决方案，安装在洗衣机软管接头上，可以观察阀门开启和关闭时发生的水锤现象，从而推断屋内正在使用哪个用水设备。由于冷水和热水系统是相互连通的，甚至可以用单个传感器开始分辨冷水和热水的使用情况。在公寓楼中，个别单元可能没有软管接头。在这种情况下，热水器是安装传感器的另一个位置。

    - 收集燃气数据要困难得多。通常没有一个好位置可以放置单个传感器来确定电器何时启动，而且消费者自行安装燃气设备也存在安全隐患。不过，可以将传感器夹在电器上国家规定安装的调节器上。膜片的声学振动与流量成线性比例。通过测量这些振动，可以确定实时消耗信息。此外，燃气阀门开启和关闭时发生的瞬态事件会通过阀门本身表现出来。这些信息可用于准确确定正在使用哪种电器。


    ### 面向可操作反馈的界面


    与会者指出，为提供上述各类分解数据和反馈而设计的界面，对于传感器成功有效的部署至关重要。典型的“界面”就是家中的简单电费和电表。电表并非为消费者读取而设计，而面向消费者的账单通常只提供周期结束时的读数。即使是典型电费账单中使用的单位也不是很友好：例如，大多数消费者是否理解千瓦时是什么意思？水费账单通常更加汇总，大多数包含长达3个月的用水量。如果由于漏水阀门等原因导致用水量出现峰值，消费者要到计费周期结束时才会知道。显然，界面设计有机会在传达更好、更可操作的信息方面发挥作用。不幸的是，目前能够提供接近实时的分解反馈的界面示例很有限。一个明显的例子是油电混合动力汽车，它在行驶时显示近似瞬时油耗，以及发动机和电池的相对使用情况。与会者观察到，如果以易于获取和理解的方式向消费者提供更多关于自身驾驶习惯的信息，消费者能够（而且确实会）改变行为并节约汽油。


    与会者描述了验证前述设备功能的研究是如何从家庭内试验开始的。为了评估安装过程，研究人员观察了消费者自行安装设备的情况。设备安装到位后，研究人员可以评估提供给用户的能源管理系统的有效性。研究人员正在提出的一些问题是：借助分解反馈，能否引发行为改变，使能耗降低15%到20%？这种改变是否能真正长期保持？随着关于用户对各种界面反应的数据不断积累，研究人员已开始对个别界面进行迭代改进。一些已部署的设备也已与
    Microsoft Hohm 和 Google PowerMeter 项目集成。


    在诸如这里所举的设备与系统能够商业化部署之前，需要进行大规模研究。公用事业公司愿意参与大规模研究，但在部署研究技术时，即使是在20或30户家庭中进行小规模部署，要制造出足够的设备也是一项挑战；研究实验室通常不具备生产能力。一种解决方案是将研究环境中使用的技术商业化，使设备不仅可以从公用事业公司直接获得，也可以在零售店买到。例如，销售各种计算机外设和其他消费电子产品的
    Belkin International 最近收购了一种在大学研究实验室开发的需求侧监测解决方案。


    一般可持续性问题的时间尺度和复杂性难以理解。反馈机制正在开发中，并且有证据表明信息会改变行为。关于这种反馈将在多大程度上影响行为，以及在什么时间尺度上提供什么样的最佳反馈能产生最大的改变，仍需要更多知识。


    ### 可持续交互设计


    与会者还讨论了关于可持续交互设计的一些总体高层原则——即系统设计应纳入可持续性考虑的理念。他们讨论了若干可持续交互设计原则，包括以下内容：


    - *发明与废弃的衔接。* 任何新设计还应包括关于其所替代的材料或产品将如何处理的信息。

    - *鼓励更新与再利用。* 人机交互（HCI）研究可以通过突出物品的未来价值发挥重要作用。

    - *鼓励质量与平等。* 任何产品的第二和第三位用户都应获得与原所有者相同的满意度。<sup>21</sup>


    许多项目至少融入了可持续交互设计的某些方面，其中几个已在前面章节中描述。其他例子包括 SAP 公司开展的企业研究和卡内基梅隆大学（CMU）人机交互研究人员完成的学术工作。SAP
    开发了 Sourcemap<sup>22</sup>，它提供了一种跟踪和改进供应链的方法。利用开放数据平台，用户可以追踪他们每种食品的来源。例如，餐饮公司可以提供一个地图，显示其所有产品的运输路线；个人也可以确定其早餐中的每种食品经过了多远的运输。由
    CMU 人机交互研究人员创建的 StepGreen<sup>23</sup> 是另一个例子，它允许用户追踪做出可持续选择带来的收益。用户可以识别自己已经在采取的可持续行动，例如关闭不用的灯或步行前往一英里以内的地点，也可以承诺未来做出可持续选择。StepGreen
    追踪每个行动节省的金额（以美元计）和二氧化碳排放量。


    交互设计还可以用于鼓励科学家、决策者和公民之间的对话。交互设计人员可以帮助弥合科学知识与公众认知之间的鸿沟，建立支持，并推动形成解决方案的对话。与会者指出，弥合这一鸿沟在气候科学领域尤其具有挑战性，而交互设计有机会发挥作用。例如，虽然前面提到的一些工具可以帮助人们做出更明智的选择以减少对气候的负面影响，但还需要一些工具来告知人们如何为气候变化这一长期可持续性挑战做好准备并作出应对。还需要交互系统来应对气候变化可能导致的自然灾害和危机严重程度上升。<sup>24</sup>
    与会者讨论了“地球仪表盘”（Dashboard Earth）的概念，它可用来提供正在发生什么以及发生在何处的信息。交互设计还可用于开发交互系统，帮助在自然灾害中有序疏散，例如向地方、区域、国家和政府间政策制定者提供信息，说明谁可以去哪里，以及每个地点可以容纳多少人。交互设计可以用来劝导并向人们展示如何用更少的资源生活，这些问题关乎可持续性、准备和适应。需要像社交媒体这类工具的交互设计，来帮助劝导人们和各层级的组织在面对气候变化及其影响时关心他人。交互设计还可以帮助开展关于某些类型解决方案的公共讨论并争取支持，同时促进公众理解。与会者主张，所有上述工具乃至更多工具，都需要在地方、区域、国家和全球层面提供信息，并帮助人们在危机期间高效应对。


    ## 第四场：克服科学发现的障碍，将科学转化为实践


    委员会成员 David Culler（加州大学伯克利分校）和 David Douglas（国立生态观测网络）主持了最后一场讨论，重点讨论了在为可持续性挑战开发和部署创新信息技术方面存在的一些障碍。本场会议的引导性问题如下：


    - 将创新信息技术应用于可持续性挑战的动机和障碍是什么？它们在不同领域有何不同？


    24 国家研究委员会，《适应气候变化的影响》，华盛顿特区：国家科学院出版社，2010年。

