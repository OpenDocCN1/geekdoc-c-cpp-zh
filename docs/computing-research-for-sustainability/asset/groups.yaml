    合理的成本。此外，如果有食品系统的综合模型可用，食品运往各市场的运输就可以依据可持续性成本函数进行优化。有了食品系统模型，人们还可以评估各种农业和耕作策略、食品供应圈的设计以及配送系统的成本与效益。


    ## 可持续且有韧性的基础设施


    国家社会基础设施和实体基础设施的韧性带来了深刻且相互交织的可持续性挑战，尤其是当人们从涵盖经济和社会问题的广义可持续性视角来看时。例如，尽管交通运输是温室气体排放的主要来源，城市蔓延消耗了开放空间和农田，但社会可持续性领域存在相互竞争的激励因素，包括劳动者需要通勤上班、人们需要获得全食物，以及需要有可用空间让企业随时间变化和调整。自然和人为灾害风险不断增加，进一步加剧了社会和实体基础设施韧性方面的挑战。与气候变化、资源消耗和土地利用相关的可持续性关切与自然和人为灾害密切相关。^42
    灾害必将增多，增强社会韧性及其应对灾害的能力将有助于可持续性。即使不考虑气候和资源消耗，世界人口的庞大规模也意味着危机一旦发生，其规模将更大。本节考察围绕基础设施的规划与建模、对日益增多的灾害进行预见和响应等方面的可持续性挑战，以及信息技术能够如何帮助发展可持续且有韧性的基础设施。本节重点关注作为大量人口集聚中心的城市，但所讨论的许多问题具有普遍适用性。


    ^42 国家研究委员会，*《适应气候变化的影响》*，华盛顿特区：美国国家科学院出版社（2010）。


    ### *发展更具可持续性和韧性的基础设施所面临的挑战*


    城市是高度复杂且不断演化的系统，涉及众多人员和过程的相互作用，以及自然基础设施和建成基础设施、法律和监管框架等众多方面。系统内用途的多样性又增加了一层复杂性。每栋建筑在特定城市中的用途和设计都是独特的；每座城市的基础设施都有鲜明特征。任何特定城市内部结构的异质性都会带来挑战——而且由于城市之间往往差异很大，对经验教训进行外推也具有挑战性。


    正如城市日益复杂一样，其异质性也使应对灾害的挑战更加复杂。既有突发性自然灾害（如飓风、地震和洪水），也有突发性工程及其他人为灾害（如2010年深水地平线墨西哥湾漏油事件），还有“缓慢”或慢性灾害（如干旱、难民危机和海平面上升）。此外，无论是突发性还是慢性灾害，都存在持续的清理和恢复过程。许多情况最好被描述为自然和人为灾害的组合，兼具突发性和慢性的时间框架。43


    与社会和实体基础设施韧性相关的问题具有复杂的时间线。例如，城市、郊区和农村地区是在很长时期内发展起来的，并且几乎不断被转作新用途。这些漫长的时间线造就了遗留系统，它们可能无法与更新的系统兼容，或者更新成本高昂。由于新基础设施往往实施成本高昂且耗时，且必须预见特定地区的未来需求，规划变得日益复杂。


    同样，为一个地区应对潜在紧急情况做准备所需的时间以及能力也各不相同，不仅取决于该地区的特点，还取决于预期的灾害和危机类型。有些灾害（如飓风）至少会带来一定的提前预警，而另一些灾害（如地震）则在不可预测的时间发生。有些事件只在有限地区造成严重破坏，而另一些则影响广阔的地理区域。另一项挑战在于灾害事件的发生频率很高，以至于在一次事件（这本身就是一个重大可持续性挑战）之后的恢复工作，很可能在下一场重大灾害来袭之前尚未完成——无论是在同一地区，如飓风卡特里娜和深水地平线漏油事件所发生的情况，还是在不同地区争夺资源和关注，如2010年海地地震之后巴基斯坦发生严重洪灾。


    ## 信息技术在发展可持续且有韧性的基础设施中的作用


    信息与通信技术提供了一系列方法、途径、应用和工具，这些将成为……


    除了对当前灾害的影响进行建模外，信息技术还提供了机会，可对潜在灾害进行深入模拟，并让个人演练和管理特定组织对危机的响应，以磨练和完善其技能和方法。


    **通信** 信息技术在危机发生前、发生时和发生后提供通信能力，用于协调活动并向受影响人群发布警报和警告。信息技术还为危机响应的其他阶段提供关键能力，例如通过建模与仿真预测可能后果，或帮助理解特定缓解措施的有效性。正如2007年NRC报告所讨论的，信息技术提供的能力可以帮助人们更好地理解信息、更清晰地把握灾害的动态现实，并帮助他们更快地制定更好的决策。信息技术提供了获取知识并与灾害管理专业人员和公众分享的工具。信息技术可以帮助更好地跟踪灾害管理各个阶段涉及的无数细节。^48


    ### *信息技术与计算机科学研究在建设可持续基础设施和培育韧性方面的作用*


    需要在信息技术和计算机科学研究以及方法论方法上取得进展，以实现更好的模拟，并更好地理解与实现更可持续发展相关的不确定性，而这种发展在面对灾害时也更具韧性。在鼓励公民参与、制定韧性和未来结果指标以及改善信息技术基础设施本身等领域也需要取得进展。


