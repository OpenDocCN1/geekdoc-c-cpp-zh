    within the term “smart grid,” the fundamental change in the future will likely
    be to treat the key components together, as an interrelated system. Whereas other
    disciplines will contribute primarily to the advance of the physical components
    comprising the elements of the energy supply chain, IT is expected to govern how
    these elements behave and how the complex system as a whole functions—that is,
    what properties it exhibits. The section below first describes several challenges
    presented by smart grids and then outlines approaches to addressing these challenges,
    especially from an IT perspective. Finally, a discussion of the specific role
    of computer science research and innovation in IT is offered.


    ## Challenges for the Modern Electric Grid


    Four main challenges for the modern electric grid are discussed below:


    - Increased electricity consumption and corresponding growth of the grid;

    - The current model of load-following supply, in which capacity is dispatched
    on the basis of real-time power demand, with coarse predictive analytics deployed
    to ensure that enough will be available;

    - The difficulty in implementing a supply-following model, in which demand is
    managed to better match the available supply; and

    - Appropriate accounting for currently externalized costs.


    **Increased Consumption** Increased productivity and improved standards of living
    correlate closely with increased energy consumption. Even in the United States,
    where the energy-to-gross domestic product (GDP) ratio has been steadily improving
    through technological improvements and efficiency measures, especially since the
    oil crisis in 1973, overall energy consumption continues to increase. This is
    an especially serious problem in recently industrialized nations, such as China.
    Continuing increases in consumption pose multiple challenges.


    In terms of generation, rapid increase in electricity production tends to skew
    the supply blend toward carbon- and particulate-heavy sources such as coal, because
    such supplies are currently easier to bring online quickly when needed. This trend
    further compounds the GHG emission problem. Lower-carbon options, such as nuclear
    power, present other hazards, and renewable sources cannot typically be dispatched
    on demand, impose other environmental impacts, or are remote from areas of dense
    consumption. Wasteful production and manufacturing practices, especially in newly
    industrialized or rapidly growing economies, further compound the climate impact.
    IT cannot provide generation, but it can enable more effective use of generation
    facilities to meet increased demand, facilitate the shift toward more desirable
    supplies, and help manage the increasing demand.


    In addition to providing adequate supply to meet growing demand—which clearly
    cannot continue indefinitely—it must be possible to deliver the generated energy
    through the transmission grid and distribution tree reliably and safely. Each
    power line and each piece of electrical equipment has limited capacity and lifetime.¹⁸
    Steering actions or switches do not determine the amount of power transferred
    along each line explicitly, as is done in networks involving transportation, communications,
    or even water distribution. Instead, the amount of power is determined implicitly,
    by the underlying physics associated with a distributed collection of loads, connected
    to a differently distributed collection of generators, through a particular interconnection
    of wires and transformers. Individual consumers decide independently how much
    to draw at each load point, and a centralized system operator orchestrates the
    production at each of the generators in order to match the supply to the demand
    in real time within the capacity limits of each line and transformer, and within
    emissions limits set for each generator. This constrained optimization problem
    is relatively tractable if the transmission and distribution infrastructure is
    sufficiently overprovisioned. But, as more of its capacity is demanded, the problem
    becomes substantially more difficult. A network of communicating sensors is overlaid
    onto the grid to monitor its distributed state, and sophisticated algorithms are
    used to predict demand, model the flows, schedule generation, and adjust the limited
    set of control points that are present. Thus, the ability to meet increased demand
    through the physical


    > ¹⁸For example, as more power is transferred along a line, more heat is generated,
    causing the line to stretch, become thinner, and sag. This increases the resistance
    of the line, causing it to heat further, and increases parasitic losses due to
    capacitance to the ground, which increases demand. All of these factors contribute
    to failures, which eliminate portions of the transmission or distribution infrastructure
    and thereby place potentially excessive demand on remaining portions.

