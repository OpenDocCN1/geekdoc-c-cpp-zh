    tem. At the farm itself, individual farms can combine crop and livestock production
    so as to reduce the need for synthetic fertilizers. Traditional agriculture has
    focused on controlling the farm ecosystem by simplifying it (e.g., through monoculture)
    and applying external inputs (e.g., water, fertilizer, pesticides, and herbicides).
    The systems view seeks to reduce or eliminate those external inputs (and their
    associated carbon and pollution emissions) by, for instance, designing and managing
    a more complex ecosystem involving a larger variety of species.^36 A systems view
    can provide guidance on how to develop ways to make the system as a whole more
    sustainable. For instance, rather than viewing a farm (or farms) in isolation
    and having inputs and outputs, one could view the entire cycle of food production
    and consumption as providing natural resources for growing food that is consumed
    by people. This cycle includes land, water, and other farm inputs, crops, transportation,
    processing, retailing, consumption, and recycling or waste. At each stage, there
    are effects on the environment and society; thus it is important to consider the
    connections between farms, the ecosystem, and communities (local, regional, and
    global). An important role for IT is to enable farmers to manage these more complex
    systems through mechanisms such as sensing, predictive modeling, and precision
    machinery.


    # **Methodology for Measuring Costs, Benefits, and Impacts**


    There is a substantial need for the development of methods and tools to measure
    the total costs, benefits, and impacts of different agricultural systems. For
    example, comparative studies of GHG emissions from different field-management
    practices for animal wastes would allow for better quantification of the environmental
    impacts of agricultural systems and, just as with the smart grid scenario, allow
    for prices to reflect costs and value better. In general, evaluating different
    farming systems will require assessing how each system balances productivity and
    efficiency with environmental and societal impacts and will require analyzing
    the behavior of complex high-dimensional and highly interactive systems. In addition
    to the technical challenges of developing such measures, there are also significant
    challenges in helping them to be seen as accurate and legitimate by both producers
    and consumers. Novel visualization techniques, explanation facilities, interactive
    simulations, and other techniques may help here.


    36 The control of pests provides an example of moving from a traditional view
    to a systems view. The traditional way of controlling pests is to apply pesticides,
    which requires little knowledge of the pests. A more sustainable approach may
    be to use benign control measures, which require an understanding of the pest''s
    life cycle and its interaction with other parts of the farm ecosystem.'
