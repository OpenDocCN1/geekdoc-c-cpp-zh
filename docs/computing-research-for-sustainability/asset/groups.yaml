    Learning，他还曾担任美国人工智能全国会议（AAAI-90）的技术程序联合主席。1992年至1998年，他担任期刊*机器学习*的执行编辑。他是人工智能促进协会（1994）、美国计算机协会（2003）和美国科学促进会（2007）的会士。2000年，他共同创办了免费*机器学习研究杂志*，目前是该刊编辑委员会成员。他于2000年担任神经信息处理系统（NIPS）会议技术程序主席，2001年担任大会主席。他曾任国际机器学习学会（IMLS）主席，并且是IMLS董事会成员，还在NIPS基金会顾问委员会任职。


    **丹尼尔·卡门**是加州大学伯克利分校1935届杰出能源教授，同时在能源与资源组、戈德曼公共政策学院和核工程系兼任。他担任美国国务卿希拉里·克林顿的“美洲环境与气候伙伴关系（ECPA）”研究员。卡门博士是可再生与适用能源实验室（RAEL）创始主任、伯克利环境研究所联合主任以及交通可持续性研究中心主任。他已创立或担任董事的公司超过10家，并以专家和顾问身份为加利福尼亚州和美国政府服务。卡门博士在康奈尔大学和哈佛大学接受物理学教育，并在加州理工学院和哈佛大学担任博士后。在转到加州大学伯克利分校之前，他在普林斯顿大学伍德罗·威尔逊学院担任科学、技术与环境政策项目助理教授兼主任。自1999年以来，卡门博士担任政府间气候变化专门委员会（IPCC）多份报告的参与作者或协调主要作者。IPCC共同获得2007年诺贝尔和平奖。2010至2011年，卡门博士担任世界银行集团可再生能源与能源效率首席技术专家。他于2010年10月获任这一新设职位，在政策、技术和运营方面提供战略领导。目标是增强世界银行可再生能源和能源效率活动的实际影响，同时扩大该机构作为全球对话推动者的作用，推动能源发展转向更清洁、更可持续的路径。他已著或合著12本书，撰写250多篇同行评审期刊论文，在美国州和联邦国会简报中作证40多次，并向多国政府提供50多份技术报告。卡门博士还多年在全球环境基金技术审查委员会任职。他经常为国际新闻媒体撰稿或担任评论员，包括*新闻周刊*、*时代*、*纽约时报*、*卫报*和*金融时报*。卡门博士曾亮相*60分钟*（两次）、*新星*和*前线*，并主持探索频道六集系列节目*生态都市*。他是非洲科学院终身研究员和美国物理学会会士。在美国，他在美国国家科学院的一个委员会和一个专家组任职。


    **詹妮弗·曼科夫**是卡内基梅隆大学人机交互研究所副教授。她在奥伯林学院获得文学学士学位，在佐治亚理工学院获得计算机科学博士学位。她的研究体现了一种以人为中心的数据驱动应用视角。她的目标是将实证方法与技术创新相结合，构建中间件（工具和流程），以支持创建有影响力的数据驱动应用。此类应用领域包括感知和影响节能行为、为慢性病患者提供网络界面，以及为残障人士提供辅助技术。曼科夫博士帮助创立了可持续人机交互（sustainable-chi）小组（sustainable-chi@googlegroups.com）。她的研究得到谷歌公司、英特尔公司、IBM、惠普、微软公司和美国国家科学基金会的支持。她曾获斯隆奖学金和IBM教师奖学金。


    **罗杰·D·彭**是约翰斯·霍普金斯大学布隆伯格公共卫生学院生物统计学副教授。他在加州大学洛杉矶分校获得统计学博士学位。他是空气污染与健康风险评估以及时空数据统计方法领域的知名研究者。彭博士在可重复研究方法与标准领域是全国领军人物；他是期刊*生物统计学*的可重复研究编辑。他开发了新方法，整合复杂的国家数据库，以评估环境暴露对人群健康的影响，并开发了通过Web高效分发数据以传播可重复研究的软件。彭博士的研究具有高度跨学科性；其成果发表在主要实质性期刊和统计学期刊上，包括*美国医学会杂志*、*美国统计协会杂志*、*皇家统计学会杂志*和*美国流行病学杂志*。彭博士著有一打以上软件包，实现环境研究统计方法、可重复研究方法及数据分发工具。他还在统计计算和数据分析方面举办研讨会、教程和短期课程。


    **安德烈亚斯·沃格尔**是加州帕洛阿尔托SAP实验室全球业务孵化器副总裁，目前从事在线游戏虚拟经济和推荐系统工作。此前，他孵化了智能电表数据分析产品，并开发了下一代可持续发展相关软件解决方案，包括涉及碳核算、能源管理和电动车辆的解决方案。他还帮助制定和实施SAP的可持续发展战略。加入SAP之前，沃格尔博士在全球担任多个研究、技术和业务职位——其中包括Borland首席科学家，以及Mspect首席技术官和联合创始人，在那里他开发移动数据网络监控解决方案。沃格尔博士拥有德国柏林洪堡大学计算机科学硕士和博士学位。他合著了四本关于公共对象请求代理体系结构（CORBA）、Enterprise
    JavaBeans和企业资源规划（ERP）的书，由J. Wiley and Sons出版。


    ## 工作人员


    **莱内特·I·米利特**是美国国家科学院国家研究委员会计算机科学与电信委员会（CSTB）高级项目官员和研究主任。她目前指导多个CSTB项目，包括一项网络安全基础科学探索。她最近完成了项目，成果为*医疗保险和医疗补助服务中心信息技术战略与优先事项*。米利特女士的工作范围包括CSTB近期在软件、身份系统和隐私方面的大量工作。除其他项目外，她还指导了以下项目：*计算性能的未来：游戏结束还是下一关？*——考察计算性能历史上惊人的指数级增长放缓的原因与影响；*可信赖系统软件：证据充分吗？*——探索开发可信赖任务关键型系统的基本方法；*生物特征识别：挑战与机遇*——对生物特征识别技术的全面评估；*谁在那里？从隐私视角看身份验证*——讨论身份验证技术及其隐私影响；以及*身份证——没那么简单：关于全国身份系统的问题*——9/11后对大规模身份系统所带来挑战的分析。她拥有康奈尔大学计算机科学硕士学位，其工作获得美国国家科学基金会研究生奖学金支持。

    '
