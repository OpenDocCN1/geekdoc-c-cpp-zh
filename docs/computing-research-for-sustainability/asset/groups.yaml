    根据某个潜在的统计模型。不幸的是，生态建模和环境政策的经验表明，存在许多“未知的未知”——即建模者和决策者所不了解、因而未被纳入模型的现象。<sup>19</sup>
    一种可能的保护措施是鲁棒优化。<sup>20</sup> 这种方法不把模型参数视为已知，而是假定参数位于某个不确定性集合内，并针对这些集合中最坏情况下的实现进行优化。这些不确定性集合的大小可以改变，以衡量为了实现给定鲁棒性而必须承受的目标函数损失。鲁棒优化方法能够显著提高在偏离名义模型条件时维持性能的能力。现有的鲁棒优化方法通常假定决策模型可以表示为具有凸结构的优化问题（例如线性规划或二次规划）。鲁棒优化有时被认为过于保守。可以引入多个不确定性集合上的凸约束，以排除同时发生的极端事件，并降低第一代鲁棒优化方法的过度保守性。<sup>21</sup>
    一个开放的理论问题是如何确定在优化问题中利用数据的最佳方式。在某些数据不足的问题中，问题变成了如何恰当地纳入关于数据的主观意见，以及描述不确定性的最佳方式是什么。另一个研究挑战是开发适用于可持续性应用中出现的复杂非线性模型的鲁棒优化方法。


    ### 最优序贯决策


    大多数可持续性挑战无法通过单一时间点的决策来解决。相反，由于一个系统只有能够无限期地持续运行下去才算可持续，因此必须在很长的时期范围内反复做出决策。例如，在涉及自然资源管理的问题中，每年都有决策机会。在渔业中，必须确定每个物种的年度允许捕捞量。在森林中，必须规定树木采伐的地点和方式，以及诸如机械间伐以降低火灾风险等其他行动。在能源发电和输电中，必须选择新建发电设施和输电线路的位置。在管理全球气候变化方面，必须确定每年温室气体的减排量。解决序贯决策问题的最先进方法是将它们形式化为马尔可夫决策问题，并通过随机动态规划求解。然而，通过这类方法获得精确解，仅对状态空间相对较小（数万个状态）的过程可行。近年来，机器学习和运筹学领域已经开发出近似动态规划方法。<sup>22</sup>
    这些方法通常采用线性函数逼近方法，以紧凑地表示随机动态规划所需的量。


    可持续性问题的一个重要方面是，它们通常涉及时间和空间上的优化。例如，考虑设计生物保护区以保护受威胁和濒危物种及生态系统的问题。这个问题中存在许多相互矛盾的因素。大型连片保护区往往能保护许多物种并维护生物多样性。然而，这类保护区也更容易受到空间自相关威胁的影响，例如火灾、疾病、入侵物种和气候变化。因此，最优设计可能涉及一组沿着环境梯度（海拔、降水量等）分布的小型保护区。购买或保留保护区土地需要资金，因此一个好的设计还应将成本降至最低。另一个因素是，保护区通常无法在一年内完成设计和购买。相反，资金（通过政府预算和私人捐赠）在多年内逐步到位，地块也在多年内陆续出售。最后，每年都可以重新评估科学认知以及先前土地购买决策的有效性，在做出决策时应考虑这一点。


    解决上述这类大规模时空序贯决策问题，已远远超出当前最先进方法的能力范围。在复杂网络系统的背景下，平衡复杂性与准确性尤其关键。需要开展新的研究，以开发能够捕捉每年状态的空间结构以及发生的空间转变（例如火灾、疾病）的方法。有些可持续性问题综合了上述三个因素——不确定性、鲁棒性和序贯决策。例如，在反馈技术中，它利用说服式界面技术<sup>25</sup>，并且主要关注住宅环境。个体使用量的减少可以使人们关注当前面临的问题，并在规模上对整体能源使用产生有限的直接影响。<sup>26</sup>
    然而，仅人口增长就可能超过这些方法所实现的收益。对此，委员会指出，除了个体改变问题外，显著加强对社会、制度、政府和政策问题的关注也很重要。例如，一个具有挑战性的公共政策问题是：如何核实温室气体排放要求的合规性。例如，经过可靠验证的碳减排量不仅对全球进展很重要，对于在宏观层面指导可持续性努力也极具价值。<sup>27</sup>


    本报告强调，除了前面提到的数据和隐私挑战之外，在个人层面及更高层面（组织和社会层面）的以人为中心的系统方面也存在研究机会。这类研究领域的示例包括：面向可理解性、透明性、合法化、商议和参与的可视化和用户交互设计；面向个人和机构的设备和仪表盘；拓展对人类行为的理解，使人们能够衡量、倡导并改变正在发生的事情；以及教育。以下将逐项进行简要讨论。


    ### 支持商议、公民参与、教育和社区行动


    如第1章所述，迈向更加可持续的社会将需要大规模的文化、社会、政治和经济变革——而当今技术与其中许多变革深深交织在一起。技术有助于支持信息灵通且积极参与的公民群体。目前，公民参与充其量也只能算是不均衡的，而就重大问题进行深思熟虑的公共商议往往难以实现。然而，信息获取的便捷性、基于社区的知识的存在……


