    within these sets. The size of these uncertainty sets can be varied to measure
    the loss in the objective function that must be sustained in order to achieve
    a given degree of robustness. Robust-optimization approaches can greatly improve
    the ability to sustain significant departures from conditions in the nominal model.
    Existing robust-optimization methods generally assume that the decision model
    can be expressed as an optimization problem with a convex structure (e.g., linear
    or quadratic programs). Robust optimization is sometimes considered overly conservative.
