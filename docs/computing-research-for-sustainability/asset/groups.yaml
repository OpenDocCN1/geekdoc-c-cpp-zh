    # ## Robust Optimization Under Uncertainty


    Optimization has progressed rapidly in recent decades due in part to the rapid
    improvement of computer systems generally and to the development of increasingly
    sophisticated algorithms. The solving of large-scale, linear problems, with millions
    of variables, is computationally feasible. However, the inclusion of calculations
    regarding the uncertainty in these optimization problems is still a challenge.
    For policy decisions, for instance, models and calculations are run many times,
    and changes are made during each iteration. Because uncertainty has to be calculated
    at each iteration, running models that include uncertainty is extremely inefficient.
    The goal is to make accounting for uncertainty computationally tractable so that
    each model can be run faster and more efficiently.


    Robust optimization is one method for coping with uncertainty in optimization
    problems. Robust optimization provides computational tractability and supports
    parsimonious modeling demands—one does not have to worry about the specifics of
    probability distribution. Robustness is an inherent and essential feature of many
    important methods across many disciplines, including machine learning and decision
    theory.


    Robust optimization is different from sensitivity analysis. Although robust optimization
    and sensitivity analysis are motivated by similar factors, sensitivity analysis
    is a post-optimization tool; if robustness is ensured beforehand, solutions will
    not be overly sensitive. Robust optimization is also sometimes considered too
    conservative. The conservativeness relates to the uncertainty set that is used
    and on how large it is. An improved data-driven theory of optimization is needed.
    There are many approaches to building uncertainty sets, but there is the open
    theoretical question regarding the right way to use data in optimization problems.
    In some problems, when there are not enough data, the questions become these:
    How does one properly incorporate subjective opinion about the data? What is the
    right way to describe uncertainty? An additional challenge is that idealized problems
    tend to be studied without enough application to real-world problems. There is
    also the challenge of ensuring that uncertainty is acknowledged and taken into
    account in any decision-making process.


    # ## Theory and Methodology of Robust-Yet-Fragile Systems Analysis


