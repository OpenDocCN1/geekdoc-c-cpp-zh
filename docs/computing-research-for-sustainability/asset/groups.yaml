    ### The Design and Capacity Planning of Physical Information Services


    Once the physical deployment of the instrumentation capability is decoupled from
    the design and implementation of the enclosing system, many new research questions
    arise. Each consumer of physical information may require that information at different
    timescales and levels of resolution. Furthermore, the necessary level of resolution
    can change dynamically depending on the purpose of the measurements. In principle,
    one could measure everything at the finest possible resolution, but this is rarely
    practical because of limitations in power consumption, local memory, processing
    capacity, and network bandwidth. What is needed for many sustainability-related
    challenges is a distributed system by which information needs can be routed to
    relevant sensors—for the purposes of this discussion, comparatively high bandwidth
    sensors are meant—and those sensors can then modulate their sampling rates and
    resolution as necessary.[^5]


    Recent advances in compressed sensing (to help conserve bandwidth and power) and
    network coding (to take advantage of network topologies for increasing throughput)
    add to the complexity of such a distributed system. One can imagine tools that
    take as input a collection of information consumers, a set of available sensors,
    and an understood network topology and produce as output a set of sensing and
    routing procedures that incorporate compressed sensing and network coding. However,
    this perspective assumes that the locations of the sensors and the network topology
    are already known. In virtually all practical situations, determining the number,
    location, and capabilities of individual sensors is an important design step.
    To support these design decisions, algorithms are needed for sensor placement
    and sizing. These algorithms require models of the phenomena being measured and
    of the information needs of each consumer. How will such models be provided and
    in what representation?


    As mentioned above, system architecture has traditionally been organized as a
    cycle: plant-sensor-controller-actuator-plant. In this model, sensor readings
    are centralized and aggregated to produce an estimate of the state of the plant.
    The controller then determines the appropriate control decisions, which are transmitted
    to the actuators. However, as the “plant” becomes a large, spatially distributed
    system (e.g., a city, a power grid, an ecosystem) and the volume of data becomes
    overwhelming, it is no longer feasible to integrate centrally the state estimation
    and decision making. A recent International Data Corporation study[^6] suggests
    that there will be more than 35 zettabytes of data stored in 2020. Distributed
    algorithms are needed that can push as much computation and decision making as
    possible out to the sensors and actuators so that a smaller amount of data needs
    to be moved and stored. At the same time, these algorithms will need to avoid
    losing the advantages of data integration (reduction of uncertainty and improved
    forecasting and decision making).


    Finally, tools are needed to support the planning and design process. These tools
    need to provide the designer with feedback on such things as the marginal benefit
    of additional sensing and additional network links, the robustness of the design
    to future information needs, and so forth. In summary, all aspects of capacity
    planning present in highly engineered systems, such as data centers and massive
    Internet services, arise in the context of the physical information service infrastructure.


    ### Software Stacks for Physical Infrastructures


    Potential solutions to the problems delineated above suggest that sophisticated
    model-driven predictive control and integrated cross-system optimization will
    become commonplace rather than rare. As discussed in Chapter 1, on the electric
    grid today, the independent system operator attempts to predict future demand
    and to schedule supply and transmission resources to meet it, with possibly coarse-grained
    time-of-use rates or, in rare cases, critical peak notification to influence the
    demand shape. In the future, environmental control systems for buildings may be
    able to adapt to the availability of non-dispatchable renewable supplies on the
    grid, using the thermal storage inherent in a building to “green” the electricity
    blend and ease the demand profile. Distributed generation and storage may become
    more common in such a cooperative grid. Various analysis, forecasting, and planning
    algorithms may operate over the physical information and human-generated information
    associated with the grid, the building, the retail facility, the manufacturing
    plant. It becomes important to ask what the execution environment is for such
    control algorithms and analytical applications. What are the convenient abstractions
    of physical resources that ease the development of such algorithms, and how is
    access to shared-resource protected and managed? In effect, what is the operating
    system of the building, of the grid, of the plant, of the fleet, of the watershed?
    Today these operating systems are rudimentary and consist of ad hoc ensembles
    of mostly proprietary enterprise resource planning systems, building management
    systems, databases, communication structures, operations manuals, and manual procedures.
    An important challenge for computer science research is to develop the systems
    and design tools that can support effective and flexible management of these complex
    systems.


