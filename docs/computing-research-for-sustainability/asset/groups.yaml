    ## 迈向更智能的电网


    能否以可持续的方式满足地球的能源需求，从根本上与全球电网在设计、部署和运营方面的基础性变革交织在一起。这一问题规模庞大且复杂，委员会在本讨论中的框架仅用于描述目的，并非旨在做到全面、具有规定性，或与其他描述该问题的方法直接冲突。¹⁶
    就电网而言，大多数关于稳定温室气体浓度潜在路径的分析都涉及三项相互关联的进展：深度效率提升、需求电气化和供应脱碳。¹⁷ 以美国为例，其目前每年消耗约 100
    千万亿英制热量单位（Btu）（约 100 艾焦）的能源，从供应到需求的流动如图 1.2 所示。大约一半的能源供应用于发电。其中，煤炭所占份额最大，其温室气体强度在所有供应源中最高，但却是发展中经济体增加供应最便宜、最快的方式。相比之下，几乎所有可再生和零排放供应源也都用于发电，但这些在能源结构中只占很小比例。为了降低所输送电力的温室气体强度，这些供应源的份额必须大幅增加。然而，这样做将极大地改变供应的性质，因为这些资源的可用性随自然因素（如风和阳光）而变化，而非根据需要调度以满足需求。此外，这些供应源的地理位置受自然因素支配，因此它们接入电网的位置，以及由此产生的从供应到需求的流动模式，乃至用于输送这些电力流动的输电线路、变电站和设备，都可能与传统发电厂相关的流动模式大相径庭。这对
    IT 具有重要影响，因为分布式能源生产的信息管理问题与更集中式生产的信息管理问题有着根本性的不同。管理由 50 万台风力发电机生产的电力需要先进的 IT——数据管理、算法和分析——而从
    IT 的角度来看，管理几百座燃煤发电厂则要简单得多。


    > ¹⁶例如，IBM Research 撰写的一篇关于不断发展的智能电网计算挑战的综述文章，围绕数据、电网仿真和经济调度方面的挑战展开：J. Xiong、E.
    Acar、B. Agarwal、A. Conn、G. Ditlow、P. Feldmann、B. Gaucher、A. Gupta、F.-L. Heng、J.
    Kalagnanam、A. Koc、D. Kung、D. Phan、A. Singhee 和 B. Smith，《用于下一代电网规划、监测和安全运行的大规模电力系统建模与仿真框架》。响应信息征询的特别报告：《下一代电网的计算需求》。DOE/LBNL
    主合同编号 DE-AC02-05CH11231，分包合同编号 6940385（2011 年）。M. Ilic，《实现可持续能源服务的动态监测与决策系统》，《IEEE
    学报》99:58-79（2011 年），指出人造输电网及其 IT 在实现可持续社会经济能源系统中的基础性作用。J. Kassakian、R. Schmalensee、K.
    Afridi、A. Farid、J. Grochow、W. Hogan、H. Jacoby、J. Kirtley、H. Michaels、I. Perez-Arriaga、D.
    Perreault、N. Rose 和 G. Wilson，《电网的未来：麻省理工学院跨学科研究》，可在 http://web.mit.edu/mitei/research/studies/the-electric-grid-2011.shtml#top
    获取，旨在客观描述当今电网，并为指导电网演进提出政策、研究和数据方面的建议。


    > ¹⁷加州科学技术委员会，《加州能源未来：展望 2050》，萨克拉门托（2011 年）。可在 http://www.cst.us/publications/2011/2011energy.pdf
    获取。


    ![](img/c6a60667ee0f315137df705da9549366_40_0.png)


    图 1.2 当前美国国家能源流动。100 quads（10^15 Btu）中大约一半被损耗，大部分煤炭用于发电，电力几乎平均地流向住宅建筑、商业建筑和工业过程。资料来源：劳伦斯利弗莫尔国家实验室（2010
    年）。数据基于 DOE/EIA-0384（2009 年）。可在 https://flowcharts.llnl.gov/ 获取。


    在美国国家能源流动中，已有相当大比例的供应在发电、输电和转换过程中被浪费，而输送到住宅和商业建筑以及工业过程中的电力，也有很大一部分因低效或无效的使用而浪费。此外，减少目前以液态化石燃料为主的交通和工业过程相关的温室气体排放，将涉及电气化（例如插电式混合动力或电动汽车），因此将进一步增加需求。重大效率提升、对可变供应源的容纳以及电气化，都可能涉及代表需求方的机构和个人的模式与实践的变化，而这些在很大程度上依赖于获取可操作的信息。如下所述，IT
    创新及其应用是这种转型各个方面的基础。


    电网可以通过其关键组成部分来表征：发电、输电、配电和负荷。通常，这些组成部分都是孤立处理的。尽管多种电网转型方法都属于“智能电网”的范畴，但未来的根本性变化很可能是将关键组成部分作为一个相互关联的系统来整体对待。其他学科主要致力于推动构成能源供应链要素的物理组件的进步，而
    IT 则有望主导这些要素如何运作以及整个复杂系统如何运行——即系统展现出哪些特性。以下章节首先描述智能电网带来的若干挑战，然后概述应对这些挑战的方法，尤其是从
    IT 视角。最后，讨论计算机科学研究与 IT 创新的具体作用。


    ## 现代电网面临的挑战


    下文讨论了现代电网面临的四大主要挑战：


    - 电力消费增加及电网相应扩张；

    - 当前的负荷跟踪供应模式，即根据实时电力需求调度容量，并部署粗略的预测分析以确保有足够的可用容量；

    - 实施供应跟踪模式的困难，即对需求进行管理以更好地匹配可用供应；以及

    - 对当前外部化成本进行适当的核算。


    **消费增长** 生产力提高和生活水平改善与能源消费增长密切相关。即使在美国，尽管通过技术进步和效率措施，能源与国内生产总值（GDP）之比一直在稳步改善（尤其是自
    1973 年石油危机以来），但总体能源消费仍在持续增长。在中国等近期工业化国家，这一问题尤为严重。消费的持续增长带来了多重挑战。


    在发电方面，电力生产的快速增长往往使供应结构偏向煤炭等高碳、高颗粒物排放的能源，因为这类供应源目前更容易在需要时快速上线。这一趋势进一步加剧了温室气体排放问题。核电等低碳选项存在其他危害，而可再生来源通常无法按需调度、会产生其他环境影响，或者远离高密度消费区域。浪费性的生产和制造方式，尤其是在新兴工业化或快速增长的经济体中，进一步加剧了对气候的影响。IT
    无法提供发电能力，但可以推动发电设施更有效地利用以满足增长的需求，促进向更理想的供应源转变，并帮助管理日益增长的需求。


    除了提供充足的供应以满足不断增长的需求——这显然无法无限期持续——还必须能够通过输电网和配电网络可靠、安全地输送所生产的能源。每条输电线路和每件电气设备都有有限的容量和使用寿命。¹⁸
    与交通、通信甚至供水网络不同，调度操作或开关并不能明确决定每条线路上传输的电量。相反，电量是由底层物理规律隐式决定的，这些物理规律与一个分布式负荷集合相关，该负荷集合通过特定的导线和变压器互联方式连接到分布不同的发电机集合。个体消费者独立决定在每个负荷点取用多少电量，而集中式系统运营商则协调每台发电机的发电量，以在每条线路和变压器的容量限制以及每台发电机的排放限值内实时匹配供需。如果输配电基础设施有足够的冗余容量，这个约束优化问题相对容易处理。但随着对其容量的需求增加，问题就变得困难得多。一个通信传感器网络被叠加在电网上以监测其分布式状态，并使用精密的算法来预测需求、模拟流动、调度发电以及调整现有有限的控制点。因此，通过物理基础设施满足增长需求的能力


    > ¹⁸例如，当一条线路上传输更多电力时，会产生更多热量，导致线路拉伸、变细和下垂。这会增加线路的电阻，使其进一步发热，并增加由于对地电容引起的寄生损耗，从而增加需求。所有这些因素都会导致故障，使部分输电或配电基础设施失效，从而对剩余部分造成可能过度的需求。

