    Just as cities are increasingly complicated, the challenges of coping with disasters
    are compounded by their heterogeneity. There are acute natural disasters (such
    as hurricanes, earthquakes, and floods), acute engineering and other human-made
    disasters (such as the 2010 Deepwater Horizon Gulf oil spill), as well as “slow”
    or chronic disasters (such as droughts, refugee crises, and rising sea levels).
    In addition, whether acute or chronic, there are the ongoing processes of cleanup
    and recovery from disasters. Many situations are best described as combinations
    of natural and human-made disasters with both acute and chronic time frames.43


    The problems associated with the resilience of societal and physical infrastructures
    have complicated time lines. For instance, urban, suburban, and rural areas are
    developed over long periods of time and are almost constantly being shifted into
    new uses. These long time lines create legacy systems that may not be compatible
    with newer systems or that could be costly to update. Planning becomes increasingly
    complicated as new infrastructure, often costly and time-consuming to implement,
    must anticipate the future needs of a particular area.


    Similarly, the time needed and the ability to prepare an area for potential emergencies
    vary and depend not just on characteristics of the area, but also on the anticipated
    types of disasters and crises. Some disasters, like hurricanes, come with at least
    some advance warning, and others, like earthquakes, strike at unpredictable times.
    Some events cause intense damage only in limited areas, while others affect enormous
    geographical regions. An additional challenge is that the frequency of disastrous
    events is such that recovery after one event (itself a major sustainability challenge)
    may well not be complete before the next major disaster strikes—either in the
    same region, as happened with Hurricane Katrina and the Deepwater Horizon oil
    spill, or different regions competing for resources and attention, as in the earthquake
    in Haiti in 2010 that was followed by severe flooding in Pakistan.


