    environmental problems are not at scales that people can readily understand. Examples
    of the complex scales involved in sustainability include the following:


    +   - *The timescale of a rise in sea level.* Consider the prospect of the sea
    level rising, perhaps 40 centimeters, over the course of 120 years. How can the
    general population understand the risks and consequences?

    +   - *The geographical scale of the supply chain.* Another example of a scale
    that is difficult to comprehend is global supply chains. Products purchased in
    the United States arrive through a supply chain that may begin as far away as
    a palm oil plantation in Sumatra. How does one communicate to the consumer the
    potential environmental repercussions of the manufacture, transport, and life
    cycle of products that they purchase?

    +   - *Climate change.* The complexity of climate change stems from the large
    number of factors—such as cloud cover, carbon dioxide emissions, rainforest depletion—and
    the interaction of these factors that make up the global climate system. How can
    IT—and the way that sustainability information is communicated using IT—assist
    in developing an understanding of the increasing scales of time, space, and complexity
    that characterize climate change?^27


    There may be lessons to learn from general IT and CS approaches when it comes
    to these complex problems. Good architecture design can remove extraneous decision-making
    requirements and afford consumers the ability to select sustainable options quickly
    and easily. When the Internet works well, for example, users do not typically
    know or need to know where the information they are receiving is coming from:
    e-mails move through various wires, routers, and servers around the globe; web
    pages are populated by widgets whose data could be sourced from anywhere. One
    attendee suggested that analogous architectural approaches may be applicable to
    certain sustainability challenges.


