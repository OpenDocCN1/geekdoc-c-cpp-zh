    引入存储的目的是解耦发电与消费，使二者能够在最有效的时段进行。（但即使假设拥有巨大的存储容量，存储和发电过程中的低效也意味着完全解耦是不可能的。）同样重要的是协调负荷的能力，这通常通过利用热能等非电形式的储能来实现，但也常常利用实际任务中的灵活性。简而言之，提高电网可持续性的机会可归纳如下：（1）塑造需求，使其更紧密地匹配可再生能源发电的供应；当可再生能源发电充裕时，将其用于可转移的电力需求（如制冰机、热水、洗碗机、电动汽车充电）；（2）塑造需求，以平滑尖峰，从而减少对快速可调度电源的需求；（3）通过提高输电和使用效率降低总需求；以及（4）应用仪表化和建模来测量碳排放，作为碳定价和碳上限政策的一部分。


    电力目前是公用事业供应资源中最不可见的一种。要在这些机会上取得进展，需要新的可见性形式，包括在价格、温室气体排放、消费和绩效方面的可见性。IT可以在关键方面做出贡献：例如，普遍的仪表化、监控和分析能够实现电力消耗及其负荷绩效的可见性。


    提高可见性是开发集成式家庭或建筑能源管理系统的重要组成部分，这类系统可以就如何转移能源使用做出明智决策。这些系统需要灵活的用户界面和传感系统，以便能够接收关于何时适合（例如）延迟电动汽车充电、建筑供暖等信息。例如，此类系统可以与用户的日历集成，并连接到定价和其他发电侧信号（如太阳和风预测）。需要对用户界面、用户和电器行为的预测模型，以及可能的拍卖和定价机制进行研究。


    集成能源管理系统还可以通过更渐进地加热和冷却建筑，或做出补偿性的电力消费选择，来应对尖峰问题。让用户看到这些选择的效果（例如，通过明确建筑何时达到所需温度、何时可以打开特定机器等）对于用户接受至关重要。还可以探索价格机制（例如，对突然变化收取更高费用）。


    需要开展IT研究，以开发建筑传感、建模和智能控制的方法。例如，大多数办公楼表现出长期性能不佳（建筑某些部分过热，其他部分过冷；某些部分通风不良，其他部分风太大）。在设计阶段和运行期间改进建模有望减少此类问题并节省能源。<sup>24</sup>
    IT在使减少浪费的机会显现出来，以及在建筑中并贯穿整个电网实现减少浪费的自动化方面，可以发挥重要作用。


    ## 信息技术和计算机科学在实现智能电网中的作用


    如上所述，信息和数据管理对于迈向更智能、更可持续的电网至关重要。需要在所有层面开展计算机科学研究和采用方法论，以应对智能电网带来的广泛系统挑战。该领域研究与应用的初步“胜利”包括：能源效率和智能微电网与分布式能源管理，<sup>25</sup>
    能效规划与建筑管理，<sup>26</sup> 以及智能电网与智能电动汽车规划及运营的集成。<sup>27</sup> 在这些领域中的许多领域，可能实现总体能耗节约三分之一到二分之一，同时改善服务并带来显著环境收益。在这些领域中的许多领域，关键步骤是设想：如果更大的信息和实时数据分析能够作为系统的嵌入组件，能源系统将如何运作。这将要求更加关注传感器技术与能源、交通和建筑系统的集成，传感器数据管理，以及分布式计算在处理远比当今典型情况更大的信息流（以及预测绩效和结果）中的作用。


    需要有这样的用户界面，使人们能够直接表达对价格、舒适度、时间安排以及其电力组合“绿色度”等方面的偏好。这些偏好可能非常复杂且难以捕捉，需要可视化技术、加深对能源相关人类行为的理解、普及界面等。信息技术可能有助于鼓励能源消费者将消费模式转移到非高峰时段，此时消费通常更稳定，且来自更可持续的发电来源。为了识别具有可转移消费模式的特定客户，并向其推出分时电价，公用事业可以运用统计手段进行更复杂的预测分析。信息传播、社交网络和互联网营销是公用事业正在研究的其他途径，计算机科学也可能在这方面提供帮助。此外，采用分时电价后，每个客户的消费数据大幅增加，多层级电价的复杂性和计算成为一个问题，更好的分析软件可能对此有所帮助。<sup>28</sup>
    改进的统计模型和数据库管理将对全国公用事业的能力产生宝贵的补充作用。


    改进的建模和分析工具将有助于考虑需求自适应特性的需求预测（例如，回答诸如下述问题：周四人们愿意将需求时间转移多远？）。借助预测分析和天气数据，公用事业可以使用估计容量来改进其消费预测，这将显著改善其成本结构。


    更一般地说，将需要用于在受控系统内设计定价的经济机制设计工具。复杂的统计模型可以通过假设检验来帮助验证这些模型。一个目标可能是将有发电能力的工厂纳入供应链，以补充高峰时段的供应，前提是温室气体排放没有恶化。这一目标还需要创造一种公用事业和热电联产工厂所有者都能接受的经济状况。从公用事业和热电联产双方的角度计算成本和收益，优化鼓励回售的最佳费率方案，并计入输电损耗和效率，构成了一个复杂而有趣的优化问题，而借助复杂的决策分析工具和统计模型可以大大简化。


    展望更远的未来，如果开展适当的计算机科学研究，通过计算方法缓解可再生能源间歇性的能力将大大增强。这些资源可以变得更加可调度，而无需可再生能源与


    - <sup>24</sup> 国家研究委员会，*实现高性能联邦设施：转型变革的战略与方法*，华盛顿特区：国家学术出版社（2011年）。

    - <sup>25</sup> C. Casillas和D.M. Kammen，*能源-贫困-气候关系*，*科学* 330：1181-1182（2010年）。

    - <sup>26</sup> G. Crabtree、L. Glicksman、D. Goldstein、D. Goldston、D. Greene、D.M.
    Kammen、M. Levine、M. Lubell、B. Richter、M. Savitz和D. Sperling，*能源未来：思考效率——美国如何在内部实现能源安全和减少全球变暖*，美国物理学会关于低碳社会中能源效率潜力的报告，美国物理学会（2008年）。

    - <sup>27</sup> S. Schewel和D.M. Kammen，*智能交通：协同电动车辆与移动信息系统*，*环境：科学与可持续发展政策* 52(5)：24-35（2010年）。

