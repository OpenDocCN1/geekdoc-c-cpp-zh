    unique stations.<sup>12</sup> Significant algorithmic work must take place in
    order to allow the development of a meaningful temperature reconstruction from
    this complex, noisy, incomplete data set.


    Most existing machine learning and data-mining tools make assumptions that are
    not valid for these kinds of data. They assume that the data are collected at
    a single temporal and spatial resolution; methods are needed that can work with
    heterogeneous data. Existing machine learning and predictive data-mining tools
    typically were designed under the assumption that the data directly measure the
    desired input-output relationship rather than measuring surrogates. Finally, existing
    methods assume that the data can be cleaned and rationalized so as to remove noise,
    impute missing values, and convert multigeneration and multisource data into a
    common format. However, this process tends to be manual and carried out relative
    to a particular study of interest by individuals highly trained in the area of
    study. Even so, it tends to result in a least-common-denominator data set in which
    numerical, spatial, and temporal resolution are all set to the coarsest level
    observed in the data. This process may fail to address the different sampling
    biases and error properties of different data sources, and hence it has the potential
    to introduce errors into the data.


    A fundamental computer science challenge is to automate this cleaning and rationalization
    process as much as possible and to make it systematic, able to scale to vast streams
    of continuous data, and able to retain the full information content. A related
    challenge is to provide tools that support the visual detection of data anomalies
    and, once an anomaly is found, fast methods for finding and repairing all similar
    anomalies. An analyst would like to ask, “Are there other data that look like
    this plot?” and obtain useful answers despite variations in underlying sampling
    rate, fidelity, and format.


