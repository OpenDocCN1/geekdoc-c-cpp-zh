    # *The Role of Information Technology and Computer Science in Achieving the Smart
    Electric Grid*


    Information and data management are essential to making progress toward a smarter,
    more sustainable electric grid, as discussed above. Computer science research
    and methodological approaches will be needed at all levels to address the broad
    systems challenges presented by the smart grid. Initial forays into both research
    and applications “wins” in this area include energy efficiency and smart mini-grid
    and distributed energy management,<sup>25</sup> energy-efficiency planning and
    building management,<sup>26</sup> and the integration of smart grids and smart
    electric vehicle planning and operation.<sup>27</sup> In many of these areas,
    savings of one-third to one-half in terms of overall energy consumption, with
    improved service and significant environmental gains, are possible. In many of
    these areas, a critical step is to envisioning how the energy system could function
    if greater information and real-time data analysis were possible as embedded components
    of the system. This would require greater attention to integration of sensor technology
    with energy, transport, and building systems, to sensor data management; and to
    the role of distributed computing in processing far greater flows of information
    (and of forecasted performance and outcomes) than is typically the case today.


    User interfaces are needed that make it straightforward for people to express
    preferences regarding aspects such as prices, comfort, timing, and “greenness”
    of their power mix. These preferences could be very complex and difficult to capture,
    requiring visualization techniques,


