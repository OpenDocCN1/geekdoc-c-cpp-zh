    of a solution or system relates to scale. As sensors become more powerful (being
    able to measure many parameters at high frequency) and cheaper, a massive increase
    in the amount of data is expected. Each step or component of a proposed solution
    should be designed to work at scale. However, scale has new connotations with
    respect to sustainability that must be considered. In particular, many of the
    most problematic phenomena involved in sustainability challenges play out over
    timescales that are difficult for humans to comprehend, and many of the solutions
    make sense only when applied at scale. Here are some of the scalability questions
    that should be considered when evaluating a project:


    +   - Spatial scaling requires articulating the minimal scale that can have impact
    (for example, touch points or density, geographic coverage, and so on).

    +   - Temporal scaling incorporates real-time, human-time, and planning-time considerations;
    duration; timescale of relevance (onset, persistence, resilience); and the very
    challenging issue of addressing multiple-human lifespan timescales.<sup>14</sup>

    +   - Location scaling addresses the applicability of the approach across a range
    of location-related contexts.

    +   - Computational scaling refers to the tractability of the problem in terms
    of data generated and in terms of the anticipated footprint of the approach with
    respect to energy and dollars expended.


