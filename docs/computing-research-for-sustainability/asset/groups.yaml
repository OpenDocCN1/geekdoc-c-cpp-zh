    \n## 面向可持续性的计算研究\n\nLynette I. Millett 和 Deborah L. Estrin，*编辑*\n\n环境与社会可持续性计算研究委员会\n\
    \n计算机科学与电信委员会\n\n工程与物理科学部\n\n美国国家科学院下属国家研究委员会\n\n注意：本报告所涉项目已由国家研究委员会管理委员会批准，该委员会成员来自美国国家科学院、美国国家工程院和医学研究所的理事会。负责本报告的委员会成员因其特殊专长并兼顾适当的平衡性而遴选。\n\
    \n本项目由美国国家科学基金会根据资助号 115-0950451 提供支持。本出版物中表达的任何意见、发现、结论或建议均为作者的观点，不一定反映为本项目提供支持的组织的观点。\n\
    \n国际标准书号-13：978-0-309-25758-9\n\n国际标准书号-10：0-309-25758-1\n\n本报告副本可从以下地址获取：\n\n\
    The National Academies Press  \n500 Fifth Street, NW, Keck 360  \nWashington,\
    \ DC 20001  \n(800) 624-6242 or (202) 334-3313  \nhttp://www.nap.edu\n\n版权所有 ©\
    \ 2012，美国国家科学院。保留所有权利。\n\n在美国印刷\n\n自然环境\n\n## 可持续性\n\n经济活力\n\n健康社区\n\n## 环境与社会可持续性计算研究委员会\n\
    \n- DEBORAH L. ESTRIN，加利福尼亚大学洛杉矶分校，*主席*\n- ALAN BORNING，华盛顿大学\n- DAVID CULLER，加利福尼亚大学伯克利分校\n\
    - THOMAS DIETTERICH，俄勒冈州立大学\n- DANIEL KAMMEN，加利福尼亚大学伯克利分校\n- JENNIFER MANKOFF，卡内基梅隆大学\n\
    - ROGER D. PENG，约翰斯·霍普金斯大学布隆伯格公共卫生学院\n- ANDREAS VOGEL，SAP 实验室\n\n### 工作人员\n\n\
    - LYNETTE I. MILLETT，高级项目官员\n- VIRGINIA BACON TALATI，副项目官员\n- SHENAE BRADLEY，高级项目助理\n\
    \n## 前言\n\n计算机科学与信息技术为审视可持续性挑战提供了广泛的工具。计算机科学的进步已经为环境与可持续性研究人员提供了一套有价值的工具——计算建模、数据管理、传感器技术、机器学习及其他工具——而计算机科学的进一步研究还可能提供先进的方法、工具、技术和策略，以理解、应对和沟通可持续性挑战。\n\
    \n本研究源于美国国家科学基金会（NSF）计算机与信息科学与工程学部向国家研究委员会计算机科学与电信委员会（CSTB）提出的一项非正式请求。该项目由美国国家科学基金会资助。国家研究委员会为开展本研究而设立的环境与社会可持续性计算研究委员会，其任务说明如下：\n\
    \n> 计算具有许多潜在的“绿色”应用，包括改善节能、加强能源管理、减少许多部门的碳排放、改善环境保护（包括减缓和适应气候变化），以及提高对环境挑战和应对措施的认识。一个特设委员会将筹划并举办一次公开研讨会，以调查可持续性挑战、当前研究计划、以往举办的专题研讨会成果，以及这些领域中相关的产业和政府开发工作。研讨会将安排受邀报告和讨论，探讨能够推进可持续性目标并同时促进计算机科学进步的研究主题和具体研究机会，并考虑研究模式，重点关注可能由美国国家科学基金会支持的适用计算技术和长期研究，并强调问题驱动或用户驱动的研究。\n\
    \n委员会将通过向委员会作简报以及向研究界征集评论和白皮书来获取更多输入。委员会还将利用额外的审议会议形成一份共识报告，识别有前景的研究机会，编目适用的计算技术，提出“绿色”计算研究的总体框架，并建议长期研究目标与方向。委员会的共识报告将把研讨会摘要作为附录纳入。\n\
    \n委员会审视了业界当前正在开展的工作（以及现有信息技术立即应用的其他机会），并探讨了能够推进可持续性（能源与环境）目标、同时促进计算机科学进步的研究主题和具体研究机会。委员会考虑了研究模式，重点关注适用的计算技术和长期研究。\n\
    \n本报告将“计算与信息技术促进可持续性创新研讨会”的摘要作为附录 A 纳入，识别有前景的研究机会，编目适用的计算技术，提出面向可持续性的计算研究总体框架，并建议长期研究目标与方向。第\
    \ 1 章给出了可能产生影响的领域示例。第 2 章描述了方法与途径；第 3 章主要面向计算机科学研究人员，阐述了为何应对可持续性挑战与计算机科学研究之间的相互作用值得关注。\n\
    \n应对这些挑战将涉及若干计算研究领域的进展，包括：可扩展性；鲁棒性；可靠性；实时观测与处理；低功耗计算；传感与驱动；以及人类与环境、观测和反馈系统之间的交互。计算机科学的若干具体领域以及\
    \ NSF 计算机与信息科学与工程学部当前研究计划所涉及的主题均具有相关性。\n\n本报告凝聚了许多人的合作努力。研究委员会成员经过充分讨论后起草了\n\n\
    ## 审稿人致谢\n\n本报告草稿已由依据国家研究委员会报告审查委员会批准的程序选出的个人审阅，他们具有多元视角和技术专长。此次独立审查旨在提供坦诚而批判性的意见，帮助本机构使其出版的报告尽可能严谨，并确保报告在客观性、证据以及对研究任务的响应性方面达到机构标准。审查意见和报告草稿仍予保密，以维护审议过程的完整性。我们感谢以下个人对本报告的审阅：\n\
    \n- Alice Agogino，加利福尼亚大学伯克利分校\n- Ruzena Bajcsy，加利福尼亚大学伯克利分校\n- Jeff Dozier，加利福尼亚大学圣巴巴拉分校\n\
    - Brian Gaucher，IBM T.J. Watson 研究中心\n- Roger Ghanem，南加利福尼亚大学\n- Marija Ilić，卡内基梅隆大学\n\
    - David Shmoys，康奈尔大学，以及\n- Bill Tomlinson，加利福尼亚大学欧文分校。\n\n尽管上述审稿人提供了许多建设性意见和建议，但并未要求他们认可结论或建议，他们在报告发布前也未看到报告最终稿。本报告的审查由\
    \ Katharine 监督\n\n"
