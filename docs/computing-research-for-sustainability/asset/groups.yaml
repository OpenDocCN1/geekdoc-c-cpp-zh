    方法（“面对变化性和不确定性，如何才能实现最佳结果？”）。


    为了处理大数据，数据挖掘将需要新的方法或改进，包括聚类、神经网络、异常检测等。例如，智能电网的复杂性和不确定性将不断增加，尤其是当可再生能源在能源结构中占据更重要的地位时。这种日益增加的复杂性将产生越来越复杂的方程组，而为了在更大地理范围内提供安全且可调度的能源，这些方程组需要在不断缩短的时间尺度内求解。这一挑战意味着需要提升计算能力，以应对从相对简单的
    N−1 故障分析到 N−x 故障分析，再到具备对运行于高性能计算系统上的、由稀疏矩阵和方程构成的超大型系统进行并行求解的能力。此外，还需要适当的语义层，以共同词汇和语言连接各种数据源，从而使其更具普遍适用性。


    ## 数据的异构性


    由于可持续性问题涉及复杂系统，与这些系统相关的数据通常非常异构。挑战不仅在于数据量巨大，还源于其结构的异构性以及研究一个主题通常需要的数据集数量。在生态系统（渔业、森林、淡水系统）管理中，相关数据源从详细的地面测量（捕获放流调查、树木年轮芯数据），到交易数据（鱼类捕捞量、木材销售），再到由飞机和卫星收集的高光谱和激光雷达数据。如上所述，智能建筑的数据不仅包括能耗和室外天气数据，还包括房间占用情况、门窗状态（开或关）、恒温器设置、气流、HVAC
    运行参数、建筑结构和材料等数据。处理如此多样的信息形式在较低程度上也出现在多模态多物理场模拟中，这类模拟通常使用专用适配器以及对各子系统所采用算法的深入理解，将多个主要仿真能力拼接在一起。类似情况也出现在数据融合问题和空中交通管制等大规模物流问题中。但是，对极其异构的信息及其处理进行此类管理通常是在特定领域基础上完成的。将需要新技术来系统性地做到这一点——例如，用转换与协调语言来编排该过程，或对可用替代模型进行自动转换——但要在可持续性问题上取得实质性进展所需的规模与保真度，要求对这些技术进行重大变革。此外，由于这些量将进入一个广泛的建模和自动化决策过程，而不是提供一次性的建议行动，因此有必要将不确定性量化与这些派生指标一起传递（见下文“不确定性下的决策”一节）。


    ## 应对有偏、含噪数据


    许多数据源（在统计意义上）有偏且含噪。例如，天气和雷达数据是在特殊地点（如机场）收集的，这些地点很可能是为反映数据的主要用途而选择的，对于评估气候影响等其他感兴趣的主题而言可能远非理想。碳通量塔通常部署在指导仪器解释的模型已得到充分理解的地区，但这些地区不一定能代表重要的地形。许多公民科学家在其居住地附近进行观测，而不是遵循精心设计的时空采样计划。


    传感器数据可能非常嘈杂。事实上，传感器网络革命旨在从部署少量昂贵、高精度的传感器，转向部署数量多得多的廉价（且可靠性较低）的传感器。此外，可持续性问题往往涉及对纵向数据（如历史天气记录、历史电力消耗、历史二氧化碳浓度）的分析，而这些数据由多代传感器和数据采集协议产生。因此，数据质量并不统一。每一代新传感器以及协议的每一次变化，都可能影响数据的偏差和噪声特性。


    作为一个重要例子，气候变化的许多方面都集中在全球地表温度的上升上。尽管现在科学界广泛共识认为人类活动是全球气候变化的重要贡献因素，但关于该现象的确切性质以及（更重要的是）对未来的预测，仍有大量持续争论。特别是就全球地表温度而言，地球温度是一个非常复杂的现象，在任何时间点上都随地表位置大幅变化，并随时间以复杂方式变化。过去一百年间，已汇集了一个数据集，包含超过
    16 亿次温度读数，这些读数来自陆地和海洋上的各个点位，使用各种仪器、按照各种方法、在超过 39,000 个独特站点采集。<sup>12</sup> 必须开展大量算法工作，才能从这一复杂、含噪、不完整的数据集中开发出有意义的温度重建。


    大多数现有机器学习和数据挖掘工具所做的假设对这些类型的数据并不成立。它们假设数据是在单一时间和空间分辨率下收集的；因此需要能够处理异构数据的方法。现有的机器学习和预测性数据挖掘工具通常是在这样的假设下设计的：数据直接测量所需的输入-输出关系，而不是测量替代指标。最后，现有方法假设数据可以被清洗和合理化，以去除噪声、填补缺失值，并将多代和多源数据转换为一种通用格式。然而，这一过程往往是手工完成的，并由该研究领域训练有素的人员针对特定感兴趣的研究来执行。即便如此，它往往会产生一个“最小公分母”数据集，其中数值、空间和时间分辨率都被设置为数据中观察到的最粗水平。这一过程可能无法处理不同数据源的不同采样偏差和误差特性，因此有可能将误差引入数据。


    一个根本性的计算机科学挑战是尽可能自动化这一清洗和合理化过程，使其系统化、能够扩展到海量连续数据流，并能够保留完整的信息内容。一个相关挑战是提供支持数据异常可视化检测的工具，并且一旦发现异常，就提供快速找到并修复所有类似异常的方法。分析人员会想问：“是否还有其他数据看起来像这张图？”并且在底层采样率、保真度和格式存在差异的情况下仍能获得有用的答案。


    ## 应对多源数据流


    大多数早期机器学习和预测性数据挖掘工具是为分析单一数据集而设计的，其假设是数据直接测量所需的输入-输出关系；目标是学习从输入到输出的映射。这些技术日益……


    12. 戈达德空间研究所（GISS）维护全球地表温度记录，以及有关其分析和 GISS 出版物的信息，可访问 http://data.giss.nasa.gov/gistemp/。另见美国国家研究委员会，*过去2000年的地表温度重建*，华盛顿特区：美国国家科学院出版社（2006），根据该文献，历史温度测量可追溯至约1880年，代用温度测量可追溯至数百万年前，但在过去两千年中最为普遍。

