    and in adapting the service to optimize the user experience, the profit derived,
    and so on. One path for CS research in dealing with the reality of noisy, multigeneration,
    multisource data streams is to develop machine learning and data-mining algorithms
    that explicitly model the measurement process, including its biases, noise, resolution,
    and so on, in order to capture the true phenomenon of interest, which is not directly
    observed. Such methods should treat the data in their original, raw form so that
    they can capture and take account of different properties of each generation of
    instrumentation. In some cases, it is possible to focus on empirical model development
    by applying unsupervised learning methods to extract relationships between inputs
    and outputs without establishing a specific physical interpretation of the input
    values. This way of proceeding can sometimes provide insight without the need
    to isolate the bias, eliminate noise, and calibrate readings.


    The field of statistics has studied latent variable models, such as that described
    in Box 2.1, in which the phenomenon of interest is modeled by one or more latent
    (hidden) variables (e.g., Z_s). However, existing statistical methods rely on
    making strong parametric assumptions about the probability distributions governing
    the latent variables. An important research challenge is to transform these statistical
    methods into the kinds of flexible, non-parametric methods that have been developed
    in computer science (support vector machines, ensembles of tree models, and so
    on).17) Such a transformation also result in methodologies that are easy to apply
    by non-statisticians and non-computer-scientists.


    The use of these techniques may in some circumstances sharpen the tension between
    information quality and privacy. If the raw data have been obfuscated to enhance
    privacy, the latent variable model will seek to undo this and infer the un-obfuscated
    form. When is it appropriate to do this? Are there effective and broadly applicable
    ways to preserve privacy and proprietary rights while still applying these methods?


