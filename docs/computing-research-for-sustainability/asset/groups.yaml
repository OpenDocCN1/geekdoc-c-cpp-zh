  - '[PAGE 142]


    such as efficiency versus robustness. Complexities of real systems—not the complexity
    of the mechanisms used to study the systems—embody these trade-offs. Some theories
    already exist for examining the trade-offs among robustness, fragility, and efficiency.
    For example, researchers know that efficiency has hard limits and is bounded.
    Robustness and fragility have conservation laws as well, and the trade-offs between
    the two are tangible. Theories from other disciplines, including systems engineering,
    control theory, information theory, and computational complexity theory, provide
    complementary approaches and can be integrated into theories on robustness, fragility,
    and efficiency.


    Efficiency and robustness exist in many dimensions, and although each in itself
    is reasonably well understood, a theoretical framework is needed for conveying
    the interactions and examining the inherent trade-offs. Firm trade-offs exist
    among the following:


    +   * Efficient use of resources (sustainability)

    +       * Small amounts of resources consumed, small amounts of waste produced.

    +       * Inexpensive components, small capital investment.

    +       * Efficient processes: design, manufacture, maintenance, management.

    +   * Robustness to perturbations

    +       * Rejection of external disturbance and suppression of internal noise.

    +       * Tolerance for component failures and uncertainty.

    +       * Security against malicious attack and hijacking.

    +       * Scalability to large system size.

    +       * Evolvability on long timescales to large changes.

    +       * Human actors with aligned incentives.

    +   * Predictable, verifiable, understandable

    +       * Limits on unintended consequences.

    +       * Easily reproducible experiments and data.

    +       * Models (simple and analyzable), short theorems, proofs.

    +       * Experience that is a reliable guide to the future.⁹


    One can start building toward a theory with comparisons across disciplines. Although
    efficiency limits are understood, it is very difficult, if not impossible, to
    reach 100 percent efficiency rates. By contrast, robust fragility is much less
    understood. Robustness in one part of a system may induce fragility in another.
    Fortunately, evolvability and robustness seem


    ⁹ John Doyle, “Theory and Methodology of Robust-Yet-Fragile Systems Analysis,”
    presentation at the Workshop on Innovation in Computing and Information Technology
    for Sustainability, Washington, D.C., May 26, 2010.'
  - '[PAGE 143]


    to be compatible. Architectures and platforms that enable innovation well can
    also enable robustness well.


    Examples were discussed of how new theories can be developed to encompass needed
    robustness requirements. Network theory might be able to help sort out what is
    an accident of similarity and what is deeply structural. However, the fact that
    reasonably well understood networks exist in one domain does not mean that these
    understandings translate well to another domain. There may be useful knowledge
    to be gained by comparing network structures and properties in different domains
    (for example, contrasting and comparing climate history, cell systems, and Internet
    architectures), but this knowledge needs to be validated first. Additionally,
    participants noted that a better understanding of what is meant by complexity,
    non-linearity, modularity, architecture, and evolvability in different domains
    is needed so that scientists can communicate more effectively with policy makers
    and with one another.


    Furthermore, big data and big models mean that many things can be demonstrated
    by means of data or models. As computational capacity has increased, in many ways
    research efforts have moved from coping with impoverished data and elegant models
    that are not well understood to coping with massive data sets and sophisticated
    simulations that are not well understood. In this new environment, larger gaps
    between the demonstration and the reality can be unintentionally created, and
    unanticipated fragilities may become overwhelming.


    # SESSION 3: CREATING INSTITUTIONAL AND PERSONAL CHANGE WITH HUMANS IN THE LOOP


    Behavioral changes at both the institutional and the individual level are needed
    in order to achieve sustainability objectives. Important questions in designing
    and developing smarter systems involve the level of information and the interface
    design that will induce behavior change. Human-system interaction (HSI) issues
    arise both for individuals in homes and offices and for administrators of larger
    systems and facilities. These interactions can occur at different timescales,
    encompassing both day-to-day decisions made by users and operators and planning
    decisions involving longer periods of time. Moreover, although there have been
    many advances in HSI, the literature is replete with failed cognitive models,
    serving as cautionary tales for HSI in sustainability applications.


    Panelists were asked to examine the following questions in relation to sustainability
    challenges during their talks:'
  - '[PAGE 144]


    +   - How can data and information be presented at the appropriate granularity
    and time frame to be most effective? What system, application, and user factors
    bear on the human-system interaction design choices?

    +   - Describe the potential impacts of the various contexts and trade-off decisions
    that might need to be made, including the following: the impact of context (e.g.,
    stakeholders, and so on), the impact of large versus small groups versus individuals,
    the impact of income, the impact of use by or for cities versus businesses versus
    individuals, the role of middleware, the supply chain, and so on.

    +   - How do human factors affecting sustainability challenges drive the use and
    design of technology? How can this interaction be accounted for? When are power,
    networking, products, and other information and communication technologies (ICTs)
    really needed? Discuss human choice and its impact on consumption, disposal, and
    reuse.


    Bill Tomlinson, University of California, Irvine, examined current use and research
    on computing initiatives that provide information for more sustainable decision
    making; Shwetak Patel, University of Washington, explored the challenges of providing
    utility-use data to consumers; and Eli Blevis, Indiana University, examined the
    possibility of incorporating sustainability ideas into the design process.


    # **Better Information for More Sustainable Decision Making**


    One way to use information technology to lead to more sustainable outcomes is
    through the provision of information to individuals and organizations to assist
    in decision making. Participants noted that this type of assistance can be provided
    at many levels. They discussed various types of tools ranging from those that
    can help inform comparatively simple sorts of personal decision making; to tools
    that can help people understand large, complex challenges and how their individual
    actions and behaviors might help; to tools that can assist in understanding and
    resolving complex challenges that require complex and/or coordinated responses.


    Several examples of how IT can be used to perform small-scale sustainability-related
    tasks more effectively were described. They include the following:


    +   - *Cellular telephone use for coordinating the sale of fish catches.* During
    the early 1990s, fishermen in Kerala, India, would typically have 6 to 8 percent
    waste from their catch. The waste was primarily due to lack of'
  - '[PAGE 145]


    buyers for these fish. Cell phone availability in the late 1990s quickly changed
    this mismatch. As they were coming ashore, fishermen could more easily locate
    buyers, and waste was quickly eliminated. Cell phones were not developed to tackle
    environmental issues, but did enable this unintended positive outcome.


    +   - The use of various communication tools by non-profit and non-governmental
    organizations in coordinating activities. The Surfrider Foundation^10 organizes
    beach cleanups using various IT infrastructures, including text messages, e-mail
    campaigns, and social media tools.

    +   - Consumer tools for a smart grid. Researchers are examining ways to apply
    Internet-inspired architectural principles to the energy grid. For consumers,
    questions are being explored regarding smart appliances that automatically run
    when electricity is in less demand or when renewable sources are available.


    Another class of tools is designed to help educate the public on their choices
    regarding sustainability. Examples discussed by participants range from tools
    for educating school-age children about ecological interdependency, to those for
    helping consumers make more sustainable purchases at the market. The Social Code
    Group, which Bill Tomlinson leads, has developed several of these tools. A selection
    of these tools and projects was discussed:


    +   - EcoRaft.^11 This application was designed, with contributions from ecologists,
    to help 8- to 12-year-old children learn about ecology in the museum environment.
    A large monitor and several tablets represent various ecosystems. The tablets
    allow interaction and can be used to simulate the transplanting of species from
    one ecosystem to another, encouraging children to explore the interdependencies
    among species and the interconnections between restoration and conservation. A
    key aspect of EcoRaft is a button at the bottom of the main screen that would
    remove all species from the simulation. In science museums, the first thing that
    children tend to do with interactive displays is to push whatever buttons are
    available. In this case, the button was not labeled, which meant that current
    users had to guard the button or educate newcomers to the game, simulating the
    value of education and activism.


    ^10 Information about this organization is available at http://www.surfrider.org/.


    ^11 Bill Tomlinson et al., The EcoRaft Project: A multi-device interactive graphical
    exhibit for learning about restoration ecology, in CHI''06, Extended Abstract
    on Human Factors in Computing Systems, New York, N.Y.: Association for Computing
    Machinery (2006). DOI: 10.1145/1125451.1125717.'
