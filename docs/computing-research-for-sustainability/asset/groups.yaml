    # ## Sustainable Sources of Water


    Computer science research can help with the complicated problems of finding, tracking,
    and monitoring the sources of, need for, and sustainable use of water. Better
    sensors for measuring, better models for analyses, and better algorithms for optimization
    are all areas in which CS research can contribute. For example, more hydrological
    data and better models could help scientists to create a virtual watershed that
    would allow for quick studies of impacts and could potentially enable forecasts
    of the amount and quality of water available, much like weather forecasts.


    In addition to creating virtual watersheds for analysis, areas in which improvements
    in CS and IT are needed in order to add to the understanding of water resources
    include the following:


