    # ## Big Data


    Notions regarding the coming wave of “big data”—the vast amounts of structured
    and unstructured data created every day, growing larger than traditional tools
    can cope with—and how science in general must cope with it were articulated in
    *The Fourth Paradigm: Data-Intensive Scientific Discovery*,^8 which posits an
    emerging scientific approach, driven by data-intensive problems, as the evolutionary
    step beyond empiricism, analyses, and simulation. Useful data sets of large size
    or complicated structure exceed today’s capacity to search, validate, analyze,
    visualize, synthesize, store, and curate the information. The complexity of the
    transformations that must be applied to render some kinds of observations useful
    to the scientist or decision maker makes better infrastructure imperative. It
    is necessary so that one can build on the work of others and so that the population
    of those with useful insight can expand as data products of successively higher
    levels of integration and synthesis are constructed.


    Unfortunately, there is a growing disparity between available software tools and
    the ability to leverage those on the scale referred to above. Solutions to many
    complex systems do not parallelize well, and new tools, algorithms, and likely
    hybrid systems will be needed. Computer science research is needed to go beyond
    the embarrassingly parallel problems and to find new approaches, methods, and
    algorithms for solving these problems. More parallel programming tools, methods,
    and algorithms are needed to leverage these large-scale systems.^9 Progress in
    CS is needed in order to move from descriptive views of data (reporting on “What
    happened, where, how many?”) to more predictive views (“What could happen, what
