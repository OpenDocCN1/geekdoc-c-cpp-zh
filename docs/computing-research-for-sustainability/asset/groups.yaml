    Session 3: Creating Institutional and Personal Change with Humans in the Loop


    *Committee respondent: Alan Borning, University of Washington*


    Achieving sustainability objectives demands behavioral changes at the institutional
    and individual levels. In designing and developing smarter systems, an important
    question is how to embed interfaces that work. The human-system interaction literature
    is replete with counterexamples and numerous failed cognitive models, serving
    as cautionary tales. Complicating matters, human-system interaction issues arise
    both with regard to individuals in homes and offices and for administrators of
    larger systems or facilities. Further, interactions occur at different scales—on
    the one hand in a day-to-day time frame for users and on the other in ways that
    allow incorporation of feedback from the system either to the system itself or
    to decision makers thinking about larger-scale resource management considerations,
    for example.


    +   * How can data and information be presented at the appropriate granularity
    and timescale to be most effective? What system, application, and user factors
    bear on the human-system interaction design choices?

    +   * Describe the potential impacts of the various contexts and trade-off decisions
    that might need to be made, including the impact of context (e.g., stakeholders,
    and so on); the impact of large versus small groups versus individuals; the impact
    of income; the impact of use by or for cities versus businesses versus individuals;
    the role of middleware, the supply chain, and so on.

    +   * How do human factors affecting energy use drive the use and design of technology?
    How can this be accounted for? When are power, networking, products, and so on
    really needed? Discuss human choice and its impact on consumption, disposal, reuse,
    and so on.


    *Bill Tomlinson, University of California, Irvine: “Greening Through IT”*

    *Shwetak Patel, University of Washington: “Residential Energy Measurement and
    Disaggregated Data”*

    *Eli Blevis, Indiana University: “Sustainable Interaction Design”*'
