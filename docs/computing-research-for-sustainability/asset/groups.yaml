    # # B


    # ## Biographies of Committee Members and Staff


    Deborah L. Estrin (NAE), Chair, is a professor of computer science with a joint
    appointment in electrical engineering at the University of California, Los Angeles;
    holds the Jon Postel Chair in Computer Networks; and is a co-founder of the non-profit,
    Open mHealth. Professor Estrin received her Ph.D. (1985) in computer science from
    the Massachusetts Institute of Technology and her B.S. (1980) from the University
    of California, Berkeley. Her early research (conducted while she was on the Computer
    Science Department faculty at the University of Southern California [USC] and
    the USC Information Sciences Institute) focused on the design of network and routing
    protocols for very large, global networks, including multicast routing protocols,
    self-configuring protocol mechanisms for scalability and robustness, and tools
    and methods for designing and studying large-scale networks. From 2002 to 2012
    she founded and directed the multidisciplinary, National Science Foundation (NSF)-funded
    Science and Technology Center for Embedded Networked Sensing (CENS), which developed
    environmental monitoring technologies and applications (http://cens.ucla.edu).
    Currently Professor Estrin explores participatory sensing and mHealth systems,
    leveraging the programmability, proximity, and pervasiveness of mobile devices;
    deployment contexts include health (http://openmhealth.org), community data gathering,
    and education (http://mobilizingcs.org). Professor Estrin has been a co-principal
    investigator on numerous NSF and Defense Advanced Research Projects Agency (DARPA)-funded
    projects and has been an active participant in several government-sponsored studies.
    She'
