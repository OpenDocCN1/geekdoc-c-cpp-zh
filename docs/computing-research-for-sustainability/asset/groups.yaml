    # Coping with Biased, Noisy Data


    Many data sources are biased (in a statistical sense) and noisy. For example,
    weather and radar data are collected at special locations (e.g., airports) that
    were likely chosen to reflect the primary purpose of the data, which may be far
    from ideal for assessing other topics of interesting, such as climate effects.
    Carbon-ux towers are usually deployed in areas where the models that guide instrument
    interpretation are well understood, but not necessarily representative of important
    topography. Many citizen scientists make their observations near their place of
    residence, rather than by following a carefully designed spatiotemporal sampling
    plan.


    Data from sensors can be very noisy. Indeed, the sensor network revolution aims
    to transition from deploying a small number of expensive, highly accurate sensors
    to much larger numbers of inexpensive (and less reliable) ones. Moreover, sustainability
    problems often involve the analysis of longitudinal data (e.g., historical weather
    records, historical power consumption, historical carbon dioxide concentrations)
    that have been produced by multiple technical generations of sensors and data-collection
    protocols. Hence, the data are not of uniform quality. Each new generation of
    sensor and each change in the protocol may affect the biases and noise properties
    of the data.


