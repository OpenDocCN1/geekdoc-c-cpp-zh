    # # 2


    # Elements of a Computer Science Research Agenda for Sustainability


    The discussion of sustainability challenges in Chapter 1 shows that there are
    numerous opportunities for information technology (IT) to have an impact on these
    global challenges. A chief goal of computer science (CS) in sustainability can
    be viewed as that of informing, supporting, facilitating, and sometimes automating
    decision making—decision making which leads to actions that will have significant
    impacts on achieving sustainability objectives. The committee uses the term “decision
    making” in a broad sense—encompassing individual behaviors, organizational activities,
    and policy making. Informed decisions and their associated actions are at the
    root of all of these activities.


    A key to enabling information-driven decision making is to establish models and
    feed them with measurement data. Various algorithmic approaches, such as optimization
    or triggers, can be used to support and automate decisions and to drive action.
    Sensing—that is, taking and collecting measurements—is a core component of this
    approach. In many cases, models are established on the basis of previous work
    in the various natural sciences. However, in many cases such models have yet to
    be developed, or existing models are insufficient to support decision making and
    need to be refined. To discover models, multiple dimensions of data need to be
    analyzed, either for the testing of a hypothesis or the establishing of a hypothesis
    through the identification of relationships among various dimensions of measured
    data. Data-analysis and data-mining tools—some existing and some to be developed—can
    assist with this task.'
