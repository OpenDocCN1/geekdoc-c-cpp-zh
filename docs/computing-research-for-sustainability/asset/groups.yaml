    ## 评估不确定性


    气候模型中存在两类不确定性：结构性和参数性。（每个模型内部的不确定性水平构成了气候模型的层级体系，如框A.1所述。框A.2随后展示了摘自政府间气候变化专门委员会（IPCC）所使用的高度复杂模型的数据汇总。）结构性不确定性源于模型的层级结构，并试图在模型速度与单个模型的复杂度和组成部分之间取得平衡。模型的构建需要大量时间；随着组件的增加，其复杂性也随之上升。软件系统中的现代工具和方法（如模块化）对于构建当前模型至关重要。然而，有些模型是在20世纪60年代和70年代构建的，早于这些工具的出现。例如，与会者指出，若干较老的模型之间无法进行比较——例如英国气象局哈德莱中心模型与美国国家大气研究中心的社区气候模型，或地球物理流体动力学实验室的气候模型——因为无法互换各模型的组件；这些软件的灵活性太差。


    ### 框A.1：气候模型的层级体系


    最初的气候变化评估使用的是全球能量平衡模型。在过去50年中，又开发了若干其他类型的气候模型，形成了气候模型的层级体系。每个模型通常有五大主要组成部分——大气、海洋、冰、陆地、生态系统和人类活动——每个组成部分都可以在不同层级上纳入模型，使模型变得相当复杂。


    最基本的模型是能量平衡模型，其运行速度非常快，但缺乏大量细节。就复杂性而言，下一个层级包括中等复杂程度的地球系统模型（EMICs），它们运行速度相当快，能够探索反馈和不确定性。15年前，麻省理工学院创建了最早的EMIC之一，其中包含了上述所有主要组成部分。该模型运行速度非常快，能够探索各系统之间的反馈，灵活性足以进行不确定性分析，并能将不确定性传播到不同阶段。


    在下一个复杂性层级的是大气-海洋环流模型和地球系统模型，它们被政府间气候变化专门委员会（IPCC）所使用（框A.2的数据即引自这些模型）。


    ### 框A.2：气候变化观测与气候模型后报


    ![图A.2.1](img/c6a60667ee0f315137df705da9549366_135_0.png)


    图A.2.1


    ![图A.2.2](img/c6a60667ee0f315137df705da9549366_135_1.png)


    图A.2.2


    图A.2.1显示了为IPCC第四次评估报告而运行的IPCC级大气-海洋环流模型的输出汇总。最宽的条代表对20世纪气候变化的预测，其数值范围代表20个不同的气候模型。最下面的条代表同一批模型在不含人为气候强迫情况下的预测。黑线是观测温度。对这两条线的比较提供了评估模型预测历史的能力。


    图A.2.2将模型移至区域或大陆层面。代表预测不确定性的最宽条带变宽了。这些条带仍然与观测记录吻合，但这组相对粗略的图形典型地体现了不确定性信息通常被呈现给政策制定者的程度。


    资料来源：政府间气候变化专门委员会（IPCC），《决策者摘要》，载于《气候变化2007：自然科学基础。第一工作组对政府间气候变化专门委员会第四次评估报告的贡献》（S.
    Solomon, D. Qin, M. Manning, Z. Chen, M. Marquis, K.B. Averyt, M. Tignor, and
    H.L. Miller [编]，英国剑桥：剑桥大学出版社，2007年）。


    参数性不确定性涵盖特定模型中的可调参数。模型复杂度和模型成本限制了对参数不确定性空间进行全面采样的能力。每个模型中都存在众多不确定性——观测中的不确定性、气候系统自然变率产生的不确定性，以及模型组成部分本身的不确定性。随着这些参数逐一添加到模型中，模型的灵活性逐渐降低。人们尝试了各种技术来纳入每一种不确定性。然而，这些技术用途有限，因为构建辅助模型与构建气候模型本身一样复杂。


    ## 示例：综合全球系统模型


    麻省理工学院（MIT）的综合全球系统模型（IGSM）（图A.2）是人类系统模型与地球系统模型的耦合体，它展示了不确定性分析如何应用于气候模型。^7 该模型使用多个组成部分：人类活动；大气、海洋、土地和生态系统的相互作用；以及生物地球化学交换。该模型的运行速度也相对较快。IGSM中包含以下不确定性：来自MIT经济、排放与政策成本模型的排放不确定性；气候系统响应（气候敏感性、^8
    深海热吸收速率和辐射强迫）；碳循环不确定性；以及降水频率趋势。气候敏感性和海洋热吸收是气候响应的一部分，是不确定性的重要来源。观测数据可用于计算气候敏感性和海洋热吸收速率的概率分布。该计算可纳入MIT
