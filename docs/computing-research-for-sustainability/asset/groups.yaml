    或拥堵收费）可能需要交通、土地利用建模及其他领域的专家耗费数月时间。为日益复杂的系统建模创建高效得多的算法是一项重要挑战。一种自然的做法是对算法进行并行化。在许多情况下，这是相当可行的：例如，在对住宅区位选择进行建模时（在给定家庭和可能住房的特征的情况下，人们将决定住在哪里），可以使用大规模并行，让每个家庭独立做出决策。如果两个家庭试图同时搬入同一地点（这可能反映了现实生活中几个人同时试图租用或购买同一住房的情况），则必须撤销某些分配。然而，新的或改进的算法可能是性能提升的更丰富来源，这一点很重要，因为所设想的许多应用都需要巨大的性能提升（例如，在会议中实时使用模拟，或多次运行模拟以计算关于不确定性的信息）。此外，还应研究关键场景的预计算和结果之间的插值（当变化是平滑而非突变时），而不是从头计算每个场景的结果。就算法而言，应研究的一类新算法是多尺度模型，其中先以相对较粗的粒度（例如区域层面）运行模拟，然后将结果输入到每个区域内的进一步模拟运行中，以此类推。（更多建模内容请参见第2章。）在这种情况下，使用多尺度模型的原因在于性能。异构模型也与城市模拟相关——例如，将UrbanSim（区域尺度模型）与全州范围的货运流动性模型耦合。这可以通过仅在相对于先前模拟周期有显著变化或具有特定政策意义的区域内进行模拟来进一步优化，否则保持在较粗的层面。


    ### 不确定性管理


    城市建模在多个层面充满不确定性，包括未来人口、全球经济状况、能源价格、气候变化影响等。在通过建模过程传播不确定性并将其纳入系统生成的指标方面已取得一些成功⁴⁹，但在统计技术和结果的有效呈现方面还有更多工作要做。


    ### 公民参与


    迄今为止，公民科学（或公民信息收集）已被用于开放地图绘制等项目，但此类活动大多尚未与建模工作整合。利用公民科学家的精力和兴趣具有巨大潜力，既可以作为额外数据的来源，也可以作为公众参与和建模活动合法化的途径。利用现有技术（如移动应用、云服务、地图和定位服务、微通信平台、社交媒体等）为改进应急和灾害管理方法提供了众多机会。<sup>50</sup>


    一些组织正在试验从公民那里收集态势感知，特别是公民对社交媒体的使用。<sup>51</sup> 与此同时，在数据质量、覆盖面和机构接受度等方面存在重大挑战。这里的技术方法可能包括声誉系统，使机构工作人员能够建立对特定观察者的信心，以及关联多个观察者数据并检测离群值的方法。


    在灾害期间，应更加关注公众掌握的信息和资源，因为公众集体对灾害情况有更全面的认知，可能拥有日益复杂的技术来捕获和传播信息，并且是志愿者、物资和设备的重要来源。同样，公众提供的信息并不总是正确的；此外，充分利用这些信息可能需要大幅改变现有做法。很可能需要开发新的、自动化的和混合主动技术来管理和处理潜在的信息洪流。另一个重要因素是如何让全体人口参与进来，因为存在具有文化和语言差异以及其他特殊需求的群体。


    ### 未来结果的指标


    模拟已经能够产生诸如温室气体排放、开放空间消耗以及紧凑型与低密度开发的比较度量等结果指标，涵盖多个年份和不同情景。然而，如上所述，还需要预测中断甚至潜在的灾难，这些中断和灾难可能源于气候变化、难民大规模迁移以及其他


