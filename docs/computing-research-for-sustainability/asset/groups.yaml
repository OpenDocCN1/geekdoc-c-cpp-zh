    The committee believes that some of the most profound fundamentals within the
    field itself are suggestive of the unique contributions that computer science
    (CS) and ICTs can make to sustainability. For instance, the very notion of automated
    “query-able” structured data is at the heart of much of computer science. The
    scope and scale of the sustainability challenge are coupled with vast amounts
    of relevant data, which makes deep insights into the challenges of collecting,
    structuring, and understanding those data essential. Computational thinking is
    critical to solving almost any large problem. The committee''s focus is on problems
    that are intellectually challenging, grounded in IT and CS, and important for
    sustainability—that is, a kind of “Pasteur''s octant.” See Figure 1.1.


    Despite the profound technical challenges presented by sustainability and the
    huge potential role for IT and CS, the committee recognizes that sustainability
    is not, at its root, a technical problem, nor will merely technical solutions
    be sufficient. Instead, solutions ultimately will require deep economic, political,
    and cultural adjustments, as well as major, long-term commitment in each sphere
    in order to put technical advancements and enablers in operation at scale. Nevertheless,
    technological advances and enablers can be developed and shaped to support such
    change, while continuing to support enduring human values in the process. Information
    technology can serve as a bridge between technical and social solutions


