    ## CONCLUSION


    Meeting the challenges of sustainability, as noted in Chapter 1, will require
    more than information technology, applications of clever technology, and computer
    science research. Indeed, at the heart of many global sustainability challenges
    are questions of resource consumption and standards of living. (See Box 3.3.)


