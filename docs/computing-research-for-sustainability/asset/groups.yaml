    *Chris Forest，宾夕法尼亚州立大学：“评估气候模型中的不确定性”*


    *David Brown，杜克大学：“不确定性下的稳健优化”*


    *John Doyle，加州理工学院：“稳健却脆弱系统分析的理论与方法”*


    下午1:30–3:00


    ### 第3场会议：借助人在回路创造机构与个人层面的变革


    *委员会回应人：Alan Borning，华盛顿大学*


    实现可持续发展目标要求在机构和个人层面发生行为改变。在设计和开发更智能的系统时，一个重要问题是如何嵌入有效的接口。人机系统交互文献中充满了反例和众多失败的认知模型，可作为前车之鉴。更复杂的是，人机系统交互问题既会出现在家庭和办公室中的个人身上，也会出现在更大系统或设施的管理者身上。此外，交互发生在不同尺度上——一方面是在用户的日常时间框架内，另一方面则以这样的方式发生：使来自系统的反馈能够被纳入系统本身，或被纳入考虑更大规模资源管理问题的决策者。


    - 如何以适当的粒度和时间尺度呈现数据和信息，才能最有效？哪些系统、应用和用户因素会影响人机系统交互设计选择？

    - 描述各种情境和可能需要做出的权衡决策的潜在影响，包括情境（如利益相关者等）的影响；大群体与小群体及个人的影响；收入的影响；由城市、企业或个人使用，或为其使用所产生的影响；中间件、供应链等的作用。

    - 影响能源使用的人为因素如何驱动技术的使用和设计？如何对此加以考虑？电力、网络、产品等何时真正需要？讨论人的选择及其对消费、处置、再利用等的影响。


    *Bill Tomlinson，加州大学欧文分校：“通过信息技术实现绿色化”*


    *Shwetak Patel，华盛顿大学：“住宅能源测量与分解数据”*


    *Eli Blevis，印第安纳大学：“可持续交互设计”*


    ## B


    ### 委员会成员和工作人员传记


    **Deborah L. Estrin（NAE）**，主席，是加州大学洛杉矶分校计算机科学教授，并同时在电气工程系任职；持有Jon Postel计算机网络讲席教授职位；是非营利组织Open
    mHealth的联合创始人。Estrin教授于1985年获得麻省理工学院计算机科学博士学位，于1980年获得加州大学伯克利分校学士学位。她的早期研究（当时她在南加州大学[USC]计算机科学系和USC信息科学研究所任教）专注于超大型全球网络的网络和路由协议设计，包括组播路由协议、面向可扩展性和稳健性的自配置协议机制，以及用于设计和研究大规模网络的工具与方法。2002年至2012年，她创立并领导了由美国国家科学基金会（NSF）资助的多学科嵌入式网络传感科学与技术中心（CENS），该中心开发了环境监测技术和应用（http://cens.ucla.edu）。目前，Estrin教授探索参与式感知和移动健康（mHealth）系统，利用移动设备的可编程性、邻近性和普及性；部署场景包括健康（http://openmhealth.org）、社区数据收集和教育（http://mobilizingcs.org）。Estrin教授曾担任众多NSF和美国国防高级研究计划局（DARPA）资助项目的联合首席研究员，并积极参与多项政府资助的研究。她主持了1997—1998年DARPA信息科学与技术研究组的传感器网络研究，以及2001年美国国家研究委员会（NRC）关于网络化嵌入式计算的研究，该研究产生了报告*《嵌入式，无处不在：网络化嵌入式计算机系统的研究议程》*。她后来主持了NEON（国家生态观测网络）设计委员会的传感器与传感器网络分委员会（www.neoninc.org）。Estrin教授还曾在NSF计算机与信息科学与工程（CISE）以及环境研究与教育（ERE）学部咨询委员会任职，并且是NRC计算机科学与电信委员会的前成员。她曾任*IEEE/ACM
    Transactions on Networking*编辑，并担任许多网络相关会议的程序委员会成员，包括SIGCOMM（数据通信专业组）、INFOCOM（国际计算机通信会议）、MobiCom和MobiSys。她曾担任第一届美国计算机协会（ACM）嵌入式网络化传感器系统会议SenSys
    2003的指导委员会主席和大会联合主席，并担任*ACM Transactions on Sensor Networks*的首批副编辑之一。Estrin教授是ACM、美国科学促进会和电气与电子工程师协会的会士。她于2006年当选为首位ACM-W
    Athena讲师，2007年获得Anita Borg研究所“远见女性创新奖”，2008年入选国际女性技术名人堂，并于2008年获得洛桑联邦理工学院荣誉博士学位。Estrin教授于2007年当选美国艺术与科学院院士，于2009年当选美国国家工程院院士。


    **Alan Borning**是华盛顿大学计算机科学与工程系教授、信息学院兼职教师，以及美国计算机协会会士。他于1971年获得里德学院数学学士学位，于1974年和1979年分别获得斯坦福大学硕士和博士学位。他的主要研究兴趣是人机交互和面向人类价值的设计。他当前的研究项目包括支持公民参与和公众参与的在线工具、帮助公交乘客的移动工具，以及设计系统以支持公众更有效地参与土地利用和交通审议，并以精细的模拟数据为支撑。早期他研究编程语言和UI（用户界面）工具包，包括基于约束的语言和系统，以及面向对象语言。


    **David Culler（NAE）**是加州大学伯克利分校计算机科学教授兼系主任、电气工程与计算机科学系副主任，以及i4energy的教师主任；他于1980年获得加州大学伯克利分校学士学位，于1985年和1989年分别获得麻省理工学院硕士和博士学位。他于1989年加入电气工程与计算机科学系任教，并持有Howard
    Friesen讲席教授职位。他是美国国家工程院院士、美国计算机协会（ACM）会士和电气与电子工程师协会会士；曾入选ACM SIGMOD杰出成就奖，并入选《科学美国人》前50名研究人员和《技术评论》“将改变世界的10项技术”。他于1990年获得美国国家科学基金会（NSF）总统青年研究员奖，于1992年获得NSF总统教职员奖学金。他曾是美国国防高级研究计划局网络嵌入式系统技术项目的首席研究员（PI），该项目创建了基于TinyOS的无线传感器网络开放平台；他还是Arch
    Rock公司的联合创始人兼首席技术官，以及英特尔研究院伯克利分院的创始院长。他在小型嵌入式无线设备网络、行星规模互联网服务、并行计算机体系结构、并行编程语言和高性能通信方面开展了开创性工作，包括TinyOS、PlanetLab、工作站网络（NOW）和Active
    Messages。他曾为多家公司担任技术顾问委员会成员，包括People Power、Inktomi、ExpertCity（现为Citrix Online）和DoCoMo
    USA。他目前专注于利用信息技术解决能源问题，并担任NSF信息物理系统项目LoCal和ActionWebs的联合PI。


    **Thomas Dietterich**是俄勒冈州立大学（OSU）教授，专注于计算机科学、生态学和可持续性政策交叉边界的跨学科研究。他与康奈尔大学的Carla
    Gomes共同担任为期5年的美国国家科学基金会（NSF）计算可持续性探索项目的首席研究员。他是OSU生态系统信息学项目领导团队成员，包括NSF生态信息学暑期研究所。Dietterich博士于1977年获得欧柏林学院学士学位，于1979年获得伊利诺伊大学硕士学位，于1984年获得斯坦福大学博士学位。他是OSU电气工程与计算机科学学院教授兼智能系统主任，于1985年加入该校任教。1987年，他被提名为NSF总统青年研究员。1990年，他与Jude
    Shavlik博士合著了题为*《机器学习读本》*的书


