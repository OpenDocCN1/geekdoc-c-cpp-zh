    to be faced and the role that computer science and information technology can
    play.


    ## The Value of the Computer Science Approach to Problem Solving


    As the sections below discuss, several key underlying philosophical and methodological
    approaches of computer science are well matched to key characteristics of sustainability
    problems.


    ### Systems—Scale, Heterogeneity, Interconnection, Optimization, and Human Interaction


    Sustainability problems often share challenges of scale—sometimes due to the size
    of the problem space (e.g., geographic or planetary scale), sometimes due to the
    potential range of impact (e.g., widespread potential health or economic impacts),
    and often due to both. Sustainability problems are also typically heterogeneous
    in nature—there is almost never just one variable contributing to the challenge,
    or one avenue to a solution. Inputs, solutions, and technologies that can be brought
    to bear on any given problem vary a great deal. Most sustainability challenges
    emerge in part due to interconnection—multiple interlocking pieces of a system
    all having effects (some expected, some not) on other pieces of the system. Solutions
    to sustainability challenges typically involve finding near- while the adaptive
    redesign of the deployed system continues to be supported as advances in scientific
    understanding, changes in technology, and evolution in political and economic
    systems are incorporated. Thus iteration—adjusting, refining, and learning from
    ongoing efforts—will be essential, and it will often have to be done at a societal
    and planetary scale.


    Iteration is another core strength of computer science, and learning from iterative
    approaches to large-scale software systems and applications, and large-scale software
    engineering and system deployment generally, can help with large-scale sustainability
    challenges. The approach has been demonstrated in such specific applications as
    the engineering of the global Internet and the deployment of web search and has
    been used effectively in a wide array of successful software engineering projects.


    Because sustainability challenges involve complex, interacting systems of systems
    undergoing constant change, a data-driven, iterative approach will be essential
    to making progress and to making needed adjustments as situations change. One
    approach is to deploy technology in the field, using reasonably well-understood
    techniques, at first to explore the space and map gaps that need work. Data and
    models developed on the basis of this initial foray can then help provide context
    for developing qualitatively new techniques and technologies for contributing
    to even better solutions.


    **FINDING: Fast-moving iterative, incrementally evolving approaches to problem
    solving in computer science, which were critical to building the Internet and
    web search engines, will be useful in solving sustainability challenges.**


    ## Computer Science Research Areas


    **FINDING: Although current technologies can and should be put to immediate use,
    CS research and IT innovation will be critical to meeting sustainability challenges.
    Effectively realizing the potential of CS to address sustainability challenges
    will require sustained and appropriately structured and tailored investments in
    CS research.**


    ## Strategy and Pragmatic Approaches


    For computer science to play an effective part in meeting global sustainability
    challenges, priority should be given to research that addresses one or more important
    sustainability challenges and that offers the prospect of tangible impact, either
    directly or through game-changing contributions that offer leveraging opportunities
    for other domains. The research areas listed in the section above are the committee’s
    recommended starting place.


    An ongoing challenge is for IT experts and CS researchers to ensure that technologies
    and approaches represent usable and appropriate solutions, that they are highly
    effective, and that they take advantage of the deepest and most powerful insights
