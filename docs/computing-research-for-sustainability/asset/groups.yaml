    # **Session 2: Understanding, Tracking, and Managing Uncertainty Throughout the
    Science-to-Policy Pipeline**


    *Committee respondent: Thomas Dietterich, Oregon State University*


    Explicit representation of uncertainty is rare in the science-to-policy pipeline.
    Data products resulting from fusing information from multiple instruments are
    often treated as exact when input to models. Outputs from predictive and simulation
    models are often treated as exact when input to policy making. Policy optimization
    for management (e.g., reserve design, fishing quotas, habitat conservation plans)
    often is not robust to uncertainty in the problem formulation or the objectives.
    Uncertainty about future decision making and imperfect implementation of policies
    injects additional uncertainty into planning for the future.


    +   - What are the sources of uncertainty that should be explicitly captured?

    +   - What methods are suitable for explicitly representing uncertainty?

    +   - Is the technological state of the art sufficient to model the many different
    flavors of uncertainty present in large-scale sustainability problems? If not,
    what characterizes the types of uncertainty that are insufficiently modeled?

    +   - What methods are suitable for assessing uncertainty in each stage of the
    pipeline? What shortcomings need to be addressed?

    +   - Is the state of the art in human factors, interfaces, and CSCW (computer-supported
    cooperative work) sufficient to support the large-scale systems, models, and data
    sets that are necessary to tackle large-scale sustainability problems? If not,
    what needs are unmet?

    +   - What are the appropriate techniques for working with uncertain data in data
    fusion, data assimilation, predictive modeling, simulation modeling, and policy
    optimization?

    +   - Is a pipeline architecture sufficient, or do we need a fully coupled architecture
    in which policy questions can reach all the way back to guide data collection
    and data fusion?

    +   - How can explicit uncertainty representations be integrated into scientific
    workflow tools?

    +   - Are there alternatives to explicit uncertainty representations that can
    improve the robustness of management policies to all of these sources of uncertainty?


    > > *Peter Bajcsy, National Institute of Standards and Technology: “Instruments
    and Scientific Workflows”*'
