    costs.

    - **Prediction accuracy and market volatility.** A mismatch of predicted and actual
    demand leads to large and rapid fluctuations in wholesale energy prices. Each
    new broad-based usage change (for example, the increased uptake of plasma television
    sets, compact fluorescent lamps, electric vehicles, and so on) raises concerns
    of prediction accuracy. Paradoxically, by eliminating waste, energy-efficiency
    measures can lead to larger peak-to-average ratios and potentially lower prediction
    accuracy, making the grid harder to manage.

    - **Storage limitations.** Grid-level storage exists in the form of pumped-storage
    hydroelectricity, compressed air, thermal energy storage, batteries, and a few
    other possibilities, but storage capacities remain limited. Storage is typically
    expensive, and turnaround efficiencies (the energy extracted from storage relative
    to the amount stored) tend to be low. Small-scale battery storage is prevalent
    but expensive, and the number of recharge cycles, and hence battery lifetime,
    is limited. When the effects of manufacturing and the disposal of batteries are
    taken into account, such storage may have a net negative environmental impact.
    Midscale storage (say, 1 to 100 kilowatt-hours) is almost non-existent, although
    flow batteries and electrolysis/fuel cell options remain in development.¹⁹

    - **Non-dispatchable supplies.** Most renewable sources of energy, such as wind,
    solar, and wave, are non-dispatchable. That is, they are available only at certain
    times and in magnitudes determined by various environmental factors; they cannot
    be summoned on demand. Gross features, such as the incident solar radiation over
    the course of the day or the seasonal patterns in wind, are much more predictable
    than fine features, such as occlusion due to passing clouds or gusts and lulls,
    and the latter can cause very rapid changes in supply.


    Much of the growth of power generation in highly industrialized nations in recent
    years is in renewable supplies. But the penetration of those sources is fundamentally
    limited in a load-following regime (i.e., one in which power output is adjusted
    to demand).


    Many smart grid proposals focus on increasing the capacity and sophistication
    of the transmission system to reduce constraints imposed by transmission in matching
    supply to demand. These include long-distance lines, in many cases using high-voltage
    DC, in order to access remote renewable supplies both for increased availability
    and to obtain geographic decorrelation. Within a grid, especially with distributed
    renewable resources, there may be sufficient supply to serve the load but inadequate
    capacity to route the power from points of generation to points of use. Better
    prediction, monitoring, and scheduling seek to prevent such bottlenecks. “Smart
    meters,” which are currently being rolled out in many regions, provide 15-minute-interval
    readings, rather than monthly accounting. Their use enables more accurate prediction
    and more effective scheduling as well as introducing incentives, such as time-of-use
    pricing or critical peak pricing, to nudge the demand toward a more grid-friendly
    form. These efforts introduce a degree of observability into this complex system
    and thus open the way to decision making and action. As the IT in the grid evolves
    to embody monitoring, communication, embedded processing, and intelligence at
    various levels of the grid, it can provide a foundation for an interactive relationship
    between supply and demand that increases the penetration limit for renewable sources.


    ¹⁹ For instance, Sandia National Laboratories just announced the development of
    a new family of liquid salt electrolytes that could lead to devices that could
    better incorporate renewable sources of energy on the grid. See, for instance,
    http://www.sciencedirect.com/sandia_national_laboratories_researchers_find_energy_storage_solutions_in_metils-86320.

