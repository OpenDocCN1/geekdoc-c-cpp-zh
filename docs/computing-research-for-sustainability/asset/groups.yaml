    # ## Sustainable Interaction Design


    Participants also discussed some general high-level principles regarding sustainable
    interaction design—the notion that the design of systems should incorporate sustainability
    considerations. A few design principles for sustainable interaction design, including
    the following, were discussed:


    +   - *The connecting of invention and disposal.* Any new design should also include
    information on what will happen to the materials or products that it replaces.

    +   - *Encouragement of renewal and reuse.* Human-computer interaction (HCI) research
    can play a large role by highlighting the future value of objects.

    +   - *Encouragement of quality and equality.* The second and third user of any
    product should receive the same satisfaction as the original owner.<sup>21</sup>


    A number of projects incorporate at least some aspects of sustainable interaction
    design, and several are described in the previous sections. Additional examples
    include corporate research done by SAP, Inc., and academic work done by HCI researchers
    at Carnegie Mellon University (CMU). SAP has developed Sourcemap,<sup>22</sup>
    which provides a way to track and improve supply chains. Using an open-data platform,
    users can track where each of their foodstuffs comes from. For example, a catering
    company can provide a map showing the route by which all of its products were
    shipped, or individuals can determine how far each of their breakfast items traveled.
    StepGreen,<sup>23</sup> created by CMU''s HCI researchers, is another example
    that allows users to track the benefits of making sustainable choices. Users can
    identify sustainable actions that they are already taking, such as turning off
    lights not being used or walking to locations less than a mile away, or they can
    commit to future sustainable choices. StepGreen tracks the amount of savings in
    dollars and carbon dioxide emissions for each action.


    Interaction design can also be used to encourage dialogues among scientists, decision
    makers, and citizens. Interaction designers can help bridge the gap between scientific
    knowledge and public perception, can build support, and can promote discourse
    leading toward solutions. Par-'
  - '[PAGE 153]


    ticipants noted that bridging this gap has been a particular challenge in climate
    science and that there is an opportunity for interaction design to play a role.
    For instance, whereas some of the previously mentioned tools can help people make
    more informed choices about reducing their negative impact on the climate, tools
    are also needed that inform people’s preparation and responses to climate change
    as a chronic sustainability challenge. Interaction systems are also needed to
    deal with the likely increase in the severity of natural disasters and crises
    due to climate change.^24 Participants discussed the concept of a “Dashboard Earth”
    that could be used to provide information about what is happening and where. Interaction
    design can also be used to develop interactive systems that could help with orderly
    evacuation in a natural disaster, for example, providing the information to local,
    regional, national, and intergovernmental policy makers about who can go where
    and how many people each location can absorb. Interaction design can be used to
    persuade and show people how to live with fewer resources, as matters of sustainability
    and preparation and adaptation. The interaction design of tools like social media
    is needed to help persuade people and various levels of organizations to care
    for others in the face of climate change and its effects. Interaction design can
    also assist in the public discourse about and support for certain sorts of solutions
    and in fostering public understanding. Participants argued that all of these tools
    and more need to provide information at the local, regional, national, and global
    level and to help people respond efficiently during crises.


