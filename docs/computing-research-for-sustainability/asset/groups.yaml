    +   - *Culture of innovation.* Computer scientists are used to developing and
    deploying new tools almost constantly and to doing these things quickly. Participants
    argued that this flexible, catch-all approach allows for broader ideas and more
    creativity.

    +   - *Large-scale systems approach.* Computer scientists have experience building
    big things, such as massive integrated circuits, which have tens of millions of
    design points that need to be correct when built, and software artifacts that
    today measure in the millions of lines of code. Computer scientists also understand
    system approaches.

    +   - *Understanding of open-information systems.* Computer scientists tend to
    understand the value of open systems and are often forced to engage with demands
    for system-level considerations such as compatibility and interoperability. Distributed
    grid management, ecosystems understanding, crisis and disaster response, and resource
    tracking and optimization can all benefit from open, interoperable information
    systems. With large amounts of data being collected, privacy and security become
    an issue, which, again, computer scientists have experience managing.^28

    +   - *Business transformation, often with efficiency as a goal.* As new technologies
    have become available, the computer science industry has transformed itself several
    times. For example, participants noted that data centers are drastically different
    now than they were just 2 years ago. This change has been driven partly by efficiency
    concerns. Furthermore, computer science has been fundamental in transforming other
    industries, for example, car ownership, media consumption, and banking, in interesting
    ways. Advances in smartphones, the Global Positioning System, and human-computer
    interaction have contributed to the success of short-term car-use services, such
    as Zipcar; advances in telecommunications networks and file compression have made
    Internet video streaming a viable alternative to the video store; and computer
    and information security have encouraged confidence in online banking.

    +   - *Educating in a dynamic environment.* Because sustainability efforts are
    complex, multidisciplinary problems, universities will need new ways to teach
    scientists and engineers to resolve these problems. Computer science has historically
    adapted to changes in curriculum and changes in the overall technological environment
    by shifting teaching techniques very


