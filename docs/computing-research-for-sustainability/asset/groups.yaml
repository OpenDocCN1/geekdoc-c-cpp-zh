    # Residential Energy Measurement and Disaggregated Data


    Participants discussed how better information can assist consumers in making effective
    changes in their use of home resources such as power, water, and gas. Current
    literature suggests that high-granularity or high-resolution data—for example,
    information about the usage patterns of individual appliances—are the most useful.
    Participants observed that literature from the past several decades suggests that
    if this information were provided to consumers, a 15 to 20 percent reduction in
    consumption would be possible.


    In the past, the technologies that collected and provided this information were
    typically tedious to install and required installation by trained technicians.
    Such difficulties make them impractical for large-scale deployment. Tools were
    not successful in the past because too much burden was placed on the individuals
    who were installing them in their homes. New technologies, such as embedded systems
    and sensors, can make information gathering and feedback tools much more practical.
    An ongoing research challenge is to determine what information and interfaces
    work best. One cannot start answering more in-depth questions about the effectiveness
    of novel, engaging, and persuasive feedback applications, however, until there
    are more information and data from end users. Sensing and feedback work hand in
    hand in creating the most effective tools for consumers.


    # *Challenges of Collecting Usage Data*


    Consumers, appliance manufacturers, and utility companies can all benefit from
    any data collected from in-home deployment of sensors. Consumers could use disaggregated
    data to understand their utility use and to make changes in it. By contrast, what
    is typically available to consumers is only simple end-of-month billing, which
    provides very little actionable information. If consumers knew the consumption
    of resources by individual devices, they might start to tailor their behavior
    for more efficient consumption. Use data could also help manufacturers gain a
    better understanding of the use of their appliances. Manufacturers do not have
    a lot of information on how often their appliances are used. Better'
