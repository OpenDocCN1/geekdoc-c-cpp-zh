    建筑基础设施与系统包括建筑物（住宅和商业）、交通系统（个人、公共和商业）以及消费品（商品、公用事业和食品）。气候组织的《SMART 2020》报告考察了信息和通信技术在建筑基础设施中几个关键领域的应用，包括智能建筑、智能物流和智能电网。根据该报告，仅这三个领域就可在2020年使全球“一切照旧”情景下的温室气体（GHG）排放量减少15%。<sup>6</sup>


    在工业化国家，建筑物占能源使用量的比例高达40%，占温室气体排放量的40%；在美国，建筑物消耗了所生产电力的70%以上。<sup>7</sup> 智能建筑利用IT系统在保持室内健康与舒适的同时更好地利用能源。嵌入式IT监测并控制环境-


