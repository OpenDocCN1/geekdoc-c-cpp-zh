  mdcn: "\n例如效率与鲁棒性之间的权衡。真实系统的复杂性——而不是用于研究这些系统的机制的复杂性——体现了这些权衡。已有一些理论可用于考察鲁棒性、脆弱性和效率之间的权衡。例如，研究人员知道效率存在硬性限制并且是有界的。鲁棒性和脆弱性也有守恒定律，而且两者之间的权衡是切实可感的。来自其他学科的理论，包括系统工程、控制论、信息论和计算复杂性理论，提供了互补的方法，并且可以整合到关于鲁棒性、脆弱性和效率的理论中。\n\
    \n效率与鲁棒性存在于许多维度中，尽管各自本身已得到相当好的理解，但仍需要一个理论框架来传达其相互作用并考察固有的权衡。以下方面之间存在明确的权衡：\n\n\
    - 资源的有效利用（可持续性）\n  - 消耗少量资源，产生少量废物。\n  - 廉价组件，小规模资本投资。\n  - 高效流程：设计、制造、维护、管理。\n\
    - 对扰动的鲁棒性\n  - 拒绝外部干扰并抑制内部噪声。\n  - 容忍组件故障和不确定性。\n  - 抵御恶意攻击和劫持的安全性。\n  - 可扩展至大系统规模。\n\
    \  - 在长时间尺度上对巨大变化的演化能力。\n  - 具有一致激励的人类参与者。\n- 可预测、可验证、可理解\n  - 对意外后果的限制。\n  -\
    \ 易于复现的实验和数据。\n  - 模型（简单且可分析），简短定理、证明。\n  - 可作为未来可靠指南的经验。⁹\n\n人们可以通过跨学科比较来开始构建理论。尽管效率限制已被理解，但达到100%的效率即使并非不可能，也非常困难。相比之下，鲁棒性和脆弱性则远未被充分理解。系统某一部分的鲁棒性可能导致另一部分的脆弱性。幸运的是，演化能力和鲁棒性似乎是兼容的。能够很好地支持创新的架构和平台也能很好地支持鲁棒性。\n\
    \n文中讨论了如何发展新理论以涵盖所需鲁棒性要求的例子。网络理论或许能够帮助区分什么是相似性的偶然，什么是深层的结构性。然而，一个领域中存在相当好理解的网络，并不意味着这些理解能很好地迁移到另一个领域。通过比较不同领域中的网络结构和特性（例如，对比和比较气候历史、细胞系统和互联网架构），或许可以获得有用的知识，但这些知识需要首先得到验证。此外，参与者指出，需要更好地理解不同领域中复杂性、非线性、模块化、架构和演化能力的含义，以便科学家能够更有效地与政策制定者以及彼此沟通。\n\
    \n此外，大数据和大模型意味着许多事情可以通过数据或模型来演示。随着计算能力的提高，在许多方面，研究工作已从应对贫乏的数据和尚未被很好理解的优雅模型，转向应对海量数据集和尚未被很好理解的复杂模拟。在这种新环境中，演示与现实之间可能无意中产生更大的差距，而意料之外的脆弱性可能变得难以承受。\n\
    \n## 第3场会议：在人类参与循环中创造制度与个人变革\n\n为了实现可持续性目标，制度层面和个人层面都需要行为改变。设计和开发更智能系统的重要问题涉及信息水平和将诱导行为改变的界面设计。人-系统交互（HSI）问题既出现在家庭和办公室中的个人身上，也出现在较大系统和设施的管理者身上。这些交互可能发生在不同的时间尺度上，既包括用户和操作员做出的日常决策，也包括涉及较长时间段的规划决策。此外，尽管HSI已取得许多进展，但文献中充斥着失败的认知模型，成为可持续性应用中HSI的警示故事。\n\
    \n专题讨论小组成员被要求在发言中结合可持续性挑战考察以下问题：\n\n- 数据和信息如何以适当的粒度和时间框架呈现才能最为有效？哪些系统、应用和用户因素会影响人-系统交互设计选择？\n\
    - 描述各种情境和可能需要做出的权衡决策的潜在影响，包括以下方面：情境（如利益相关者等）的影响、大群体与小群体与个人的影响、收入的影响、城市与企业与个人使用的影响、中间件的作用、供应链等。\n\
    - 影响可持续性挑战的人为因素如何驱动技术的使用和设计？这种交互如何被考虑？何时真正需要电力、网络、产品及其他信息通信技术（ICT）？讨论人类选择及其对消费、处置和再利用的影响。\n\
    \n加州大学欧文分校的比尔·汤姆林森考察了为更可持续决策提供信息的计算倡议的当前使用和研究；华盛顿大学的什韦塔克·帕特尔探讨了向消费者提供公用设施使用数据的挑战；印第安纳大学的伊莱·布莱维斯考察了将可持续性理念纳入设计过程的可能性。\n\
    \n### 为更可持续的决策提供更好的信息\n\n利用信息技术带来更可持续结果的一种方式，是向个人和组织提供信息以协助决策。参与者指出，这种协助可以在许多层面上提供。他们讨论了各种类型的工具，从可以帮助为相对简单的个人决策提供信息的工具；到可以帮助人们理解大型复杂挑战以及个人行动和行为可能如何起作用的工具；再到可以帮助理解和解决需要复杂和/或协调响应的复杂挑战的工具。\n\
    \n文中描述了若干例子，说明IT如何被用于更有效地执行小规模可持续性相关任务。它们包括以下内容：\n\n- *使用移动电话协调鱼获销售。* 在20世纪90年代初，印度喀拉拉邦的渔民通常会有6%到8%的鱼获浪费。浪费主要是由于这些鱼缺乏买家。20世纪90年代末手机的普及迅速改变了这种错配。渔民在上岸时能够更容易地找到买家，浪费很快被消除。手机并非为解决环境问题而开发，但确实促成了这一意外积极结果。\n\
    - 非营利和非政府组织使用各种通信工具协调活动。Surfrider Foundation^10 利用各种IT基础设施组织海滩清理活动，包括短信、电子邮件活动和社交媒体工具。\n\
    - 智能电网的消费者工具。研究人员正在研究将受互联网启发的架构原则应用于能源电网的方法。对于消费者，正在探索有关智能电器的问题，这些电器在电力需求较低或可再生能源可用时自动运行。\n\
    \n另一类工具旨在帮助教育公众做出有关可持续性的选择。参与者讨论的例子范围从教育学龄儿童了解生态相互依赖性的工具，到帮助消费者在市场上进行更可持续购买的工具。比尔·汤姆林森领导的社会代码小组已开发了其中若干工具。文中讨论了其中一些工具和项目：\n\
    \n- EcoRaft。^11 该应用由生态学家贡献设计，旨在帮助8至12岁儿童在博物馆环境中学习生态学。一台大型显示器和几台平板电脑代表不同的生态系统。平板电脑允许交互，并可用于模拟物种从一个生态系统移植到另一个生态系统，鼓励儿童探索物种之间的相互依赖性以及恢复与保护之间的相互联系。EcoRaft的一个关键方面是主屏幕底部的一个按钮，该按钮会从模拟中移除所有物种。在科学博物馆中，儿童对互动展示倾向于做的第一件事就是按下任何可用的按钮。在这种情况下，该按钮没有标签，这意味着当前用户必须守护按钮或教育游戏新参与者，模拟了教育和行动主义的价值。\n\
    \n⁹ John Doyle，“Theory and Methodology of Robust-Yet-Fragile Systems Analysis，”在可持续性计算与信息技术创新研讨会上的报告，华盛顿特区，2010年5月26日。\n\
    \n^10 关于该组织的信息可在 http://www.surfrider.org/ 获取。\n\n^11 Bill Tomlinson et al., The\
    \ EcoRaft Project: A multi-device interactive graphical exhibit for learning about\
    \ restoration ecology, in CHI'06, Extended Abstract on Human Factors in Computing\
    \ Systems, New York, N.Y.: Association for Computing Machinery (2006). DOI: 10.1145/1125451.1125717.\n\
    \n"
