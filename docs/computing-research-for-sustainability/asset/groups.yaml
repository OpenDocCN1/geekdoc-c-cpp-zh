    系统。在农场本身，各个农场可以结合作物和牲畜生产，以减少对合成肥料的需求。传统农业侧重于通过简化农场生态系统（例如，通过单一种植）并施用外部投入（例如，水、肥料、农药和除草剂）来控制它。系统视角旨在减少或消除这些外部投入（及其相关的碳排放和污染排放），例如，通过设计和管理一个涉及更多物种的更为复杂的生态系统。^36
    系统视角可以为如何开发使整个系统更具可持续性的方法提供指导。例如，与其孤立地看待一个（或多个）农场及其投入和产出，不如将粮食生产和消费的整个循环视为为种植供人消费的粮食提供自然资源。该循环包括土地、水和其他农场投入、作物、运输、加工、零售、消费以及回收或废弃物。在每个阶段，都会对环境和社会产生影响；因此，考虑农场、生态系统和社区（地方、区域和全球）之间的联系非常重要。信息技术的一个重要角色是使农民能够通过传感、预测建模和精密机械等机制来管理这些更复杂的系统。


    ## 衡量成本、效益和影响的方法论


    非常需要开发方法和工具，以衡量不同农业系统的总成本、效益和影响。例如，针对动物粪肥的不同田间管理做法所产生的温室气体（GHG）排放进行比较研究，将有助于更好地量化农业系统的环境影响，并且正如智能电网情景一样，使价格更好地反映成本和价值。总体而言，评估不同耕作系统需要评估每个系统如何在生产力与效率同环境和社会影响之间取得平衡，并且需要分析复杂的高维且高度交互系统的行为。除了开发此类衡量方法的技术挑战外，在帮助生产者和消费者将这些方法视为准确且正当方面也存在重大挑战。新颖的可视化技术、解释功能、交互式模拟和其他技术可能在这方面有所帮助。


    36. 害虫控制提供了一个从传统视角转向系统视角的例子。传统的害虫控制方式是施用农药，这几乎不需要了解害虫。更具可持续性的方法可能是使用温和的控制措施，这需要了解害虫的生命周期及其与农场生态系统其他部分的相互作用。


    ### 精准农业


    过去50年来，信息和计算技术在农业中的使用大幅增加。它使农民能够评估田块内的变异，并在减少投入（特别是水、养分和农药施用）的同时总体上保持或提高产量。这里使用的技术包括全球定位系统、实时动态定位和地理信息系统，尤其是卫星。信息技术已经在该领域发挥重要作用，并将在未来继续发挥关键作用。这与衡量成本和效益的方法也存在联系：如果农业用水成本反映其真实成本，那么使用精准农业来减少水消耗的激励可能会大得多。


    ### 面向知情消费的信息


    增加个人可获得的关于其所购买食品的性质及其生产方式的信息，可以帮助他们做出可持续的食品选择。已经出现了一个以可持续方式生产的食品的新兴市场。^37 目前传达此类信息的一种重要方法是通过制定标准、认证或其他生态标签计划。这些计划中的每一项都为食品生产者和分销商列出了一套标准，以努力实现各种环境、可持续性或健康目标。^38
    在美国，或许最完善的食品标准是有机农业认证，它主要关注健康和环境目标，并未涉及可持续农业的更广泛目标。美国的食品标签要求提供一些信息，例如肉类和水果的原产国，但关于可持续性和食品运输（这对化石燃料使用有影响）的一般信息并不可获得。当前的标准和认证通常通过食品包装上的标识或其他印刷标签来传达。然而，在提供更丰富的可持续性信息以及帮助消费者梳理市场上不断增多的生态标签方面，仍存在潜力。智能手机的更广泛采用可能使这些信息更容易传播，因为用户可以在购买点搜索可持续性信息。一个用信息赋能个人的例子是蒙特雷湾水族馆的《海产观察指南》^39，它帮助人们就粮食的生产和消费做出可持续选择。向消费者提供有关食品生产可持续性的信息，以及可持续食品系统的其他方面（如健康和环境影​​响）的信息，将需要跨生产者和消费者平台共享和整合信息。开发和优化此类信息整合的基础设施和架构，将是信息技术的一项重要贡献。更一般地说，信息技术能够提供重大帮助的领域包括创建信息数据库、维护这些信息的时效性，以及通过社交网络和互联网连接农民与消费者。为消费者和大型采购者（如超市）优化可持续食品购买选择的分析软件的开发，是信息技术贡献的另一个丰富领域。


