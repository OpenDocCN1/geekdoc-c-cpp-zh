    mance will scale, what behaviors are within bounds, and how subsystems (or external
    actors) should interact with the system as a whole. This type of challenge can
    be seen perhaps most clearly in the smart grid example discussed in Chapter 1.
    However, the other illustrative examples in Chapter 1—food systems and the development
    of sustainable and resilient infrastructure—also make clear that early architectural
    choices (such as the expected role and behavior of individual farms in the global
    food system, or the anticipated communications capabilities of first responders
    in a crisis) can have long-lasting repercussions.


    A system''s architecture instantiates early design decisions and has a significant
    effect on the uses, behaviors, and effects of the system long past the time when
    those decisions were made. Moreover, requirements inevitably change over time,
    necessitating flexible or evolvable designs. Because of this large effect of a
    system''s architecture on almost all aspects of the system over its life cycle,
    the architecture of larger-scale systems of necessity merits significant attention
    and resources. As systems have become global in scale, the disciplines of computer
    science and software engineering have grappled with the challenges of architecture
    as they pertain to large-scale systems working over large geographic areas, with
    countless inputs and millions of users. Lessons from architecting hardware, software,
    network, and information systems thus have broader applicability to the processes
    of structuring, designing, maintaining, updating, and evolving of infrastructure
    in pursuit of sustainability.³


    One question not yet addressed in this report is how well the CS research community
    is poised to play its part in meeting global sustain-


    ³ For an in-depth examination of the importance of architecture in software-intensive
    systems, see Chapter 3 of the following report: National Research Council, Critical
    Code: Software Producibility for Defense, Washington, D.C.: The National Academies
    Press (2010). It describes the importance of architecture as follows (pp. 68-69):
    “Architecture represents the earliest and often most important design decisions—those
    that are the hardest to change and the most critical to get right. Architecture
    makes it possible to structure requirements based on an understanding of what
    is actually possible from an engineering standpoint—and what is infeasible in
    the present state of technology. It provides a mechanism for communications among
    the stakeholders, including the infrastructure providers, and managers of other
    systems with requirements for interoperability. It is also the first design artifact
    that addresses the so-called non-functional attributes, such as performance, modifiability,
    reliability, and security that in turn drive the ultimate quality and capability
    of the system. Architecture is an important enabler of reuse and the key to system
    evolution, enabling management of future uncertainty. In this regard, architecture
    is the primary determinant of modularity and thus the nature and degree to which
    multiple design decisions can be decoupled from each other. Thus, when there are
    areas of likely or potential change, whether it be in system functionality, performance,
    infrastructure, or other areas, architecture decisions can be made to encapsulate
    them and so increase the extent to which the overall engineering activity is insulated
    from the uncertainties associated with these localized changes.”'
