    Institute of Technology created one of the first EMICs, which included all of
    the major components listed above. The model is very fast and can explore feedbacks
    between systems, is flexible enough to do uncertainty analysis, and can propagate
    uncertainty through the different stages.


    At the next complexity level are the atmosphere-ocean general circulation models
    and Earth-system models, which are used by the Intergovernmental Panel on Climate
    Change (IPCC) (and from which the data for Box A.2 were drawn).'
