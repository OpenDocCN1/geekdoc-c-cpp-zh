    # **Research Impediments**


    The critical nature of the sustainability problem and energy crisis combined with
    their scale and complexity often means that researchers are dedicating entire
    careers working to address pieces of the problem. This scale and complexity mean
    that choosing avenues of investigation is a high-risk proposition. If a path that
    a researcher follows turns out to be incorrect or a dead end, the mistake can
    be career ending. Furthermore, these sustainability and energy problems are inherently
    multidisciplinary, which adds another barrier to academic work often confined
    to single disciplines.


    In many subfields of computer science, the ultimate goals can be defined reasonably
    clearly, even if the description of the goal is as simple as: Make computers faster.
    Well-defined goals also imply a clear definition of success. While there are some
    goals to work toward in addressing the sustainability problem, such as decreasing
    the levels of greenhouse gases in the atmosphere, they tend to be less well defined
    (should the focus be on lowering energy use or on the use of more sustainable
    energy sources?) and have less clear benchmarks for success.


    # **Potential Computer Science Contributions**


    In the fourth session of the workshop, participants brainstormed about potential
    further contributions of computer science to sustainability. Computer science
    is well positioned to provide technical options that could help address some sustainability
    challenges. Additionally, the distinctive culture, methodologies, and approaches
    of computer science may shed new light on methodologies, processes, and concepts
    that could be useful in sustainability. Speakers discussed several such cultural
    attributes, including the following:'
