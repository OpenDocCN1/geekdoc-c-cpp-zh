    configurable, self-contained nature of modern instrumentation reduces the costs
    of deployment and enables broader use.


    +   - *Information-rich operation.* The primary control loop of operational processes
    (typically represented in manufacturing as plant-sensor-controller-actuator-plant)
    is usually augmented with substantial secondary instrumentation to permit optimization.
    For example, in refinery process control, such additional instrumentation streams
    help to tune controllers to increase yield or reduce harmful by-products. In semiconductor
    manufacturing, they are employed in conjunction with small-scale process perturbation
    and large-scale statistical analysis in order to shorten the learning curve and
    reach a final configuration more quickly. In environmental conditioning for buildings,
    multiple sensing points are aggregated into zone controllers. Automotive instruments
    are fused to present real-time mileage information to the driver.

    +   - *Cross-system integration.* Measurements designed for one system are increasingly
    being exploited to improve the quality or performance of others. For example,
    light and motion sensors are installed to modulate the amount of artificially
    supplied lighting in many “green buildings.” But those motion detectors are then
    also available to serve as occupancy indicators in sophisticated heating, ventilation,
    and air conditioning (HVAC) controls. Rather than simply isolating indoor climate
    from external factors, modern design practice may seek to exploit passive ventilation,
    heating, and cooling; to do so requires the instrumentation of building configuration
    (such as open and closed window and door states) and of external and internal
    environmental properties (temperature, humidity, wind speed, etc.). All of these
    sources of information may also be exploited for longitudinal analysis, to drive
    recommissioning, retrofitting, and refining operations. Interval utility meter
    readings are used not just for time-of-use pricing but also to guide energy-efficiency
    measures. Traffic measurements and content-condition instrumentation are applied
    to optimize logistics operations.


    The factors described above have changed the role of instrumentation and measurement
    from a subsidiary element of the system design process to an integrative, largely
    independent process of design and provisioning of physical information services.
    For many sustainability challenges, methodologies are needed that can start with
    an initial model that is based on modest amounts of data collected during the
    design process; those methodologies would then include the development of an incremental
    plan for deploying sensors that progressively improves the model and exploits
    the improvements to achieve the goals of the system. In many sustainability applications,
    such as climate modeling and building modeling, the most effective approach may
    involve combining mechanistic'
