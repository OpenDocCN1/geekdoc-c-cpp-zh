    传统电源或存储备份以及优化的基础设施投资。智能电网的成功，部分将取决于行业能否从当前静态的运行、管理和规划模式转向日益动态的模式——这一场景正是计算机科学研究和IT能够很好应对的。需要全新的态势感知工具来观察、监测和控制智能电网。这样做的计算负担非常巨大，而该行业几乎完全依赖供应商提供解决方案——这些供应商通常不会在研究开发方面投入大量资金。从静态平衡最优潮流切换到可实时、规模化求解的动态暂态分析，在今天尚无法实现，但这种能力将是管理未来双向、快速变化的智能电网所必需的。


    IT和计算机科学方法将在协调资源与用户在时间和空间上的特征，以及减少对供需紧密匹配的需求方面发挥根本性作用。对于发展中国家的小型可持续能源系统、发达国家的微电网以及大陆尺度的能源系统，将需要不同的方法和技术。要应对这些及相关挑战，需要进行重大的计算机科学研究。


    ## 可持续食物系统


    在过去一个世纪里，美国及世界其他地区的农业以生产力的急剧提升为特征，带来了相对廉价且充足的食物。推动这一增长的一些因素包括：化石燃料相对廉价，化肥和水资源丰富；农场生产的集中化和专业化，包括肉类加工中自动化和机器人使用的增加；农业机械化程度提高和新技术的出现；植物育种方面的进展；政府计划和补贴；以及市场的扩张和商业化。这些发展使得食物得以以前所未有的规模生产，并支撑了显著的人口增长。29
    与其他许多行业不同，农业产出的增加并未伴随着投入的类似增加。例如，2005年的农田面积与1910年的农田面积相当。因此，美国农业的生产力有了巨大提升，用显著更少的资本、土地、劳动力和材料生产出了更多的食物。30


    29 事实上，近期一期*《经济学人》*开展了一场关于计算是否属于20世纪最具意义的技术进步的“辩论”，而由瓦茨拉夫·斯米尔阐述的“反方”观点认为，通过哈伯-博斯固氮工艺生产足够的氮肥所推动的农业变革要重要得多。参见
    http://www.economist.com/debate/days/view/598。


    30 国家研究委员会，*《迈向21世纪的可持续农业系统》*，华盛顿特区：国家学术出版社，2010年。


    然而，当前的农业实践对食物系统的可持续性，以及其所嵌入的更广泛的社会、经济和环境系统，都构成了挑战。农业的许多关注点一直集中在最大化生产以满足人类食物、饲料和纤维需求，而将环境和社会影响作为次要考虑。人们越来越担忧当前农业生产率趋势的负面后果，并担心这些趋势无法无限持续下去。农业生产率的提高导致了世界各地沿海和内陆水域出现低氧区，这是因为氮和磷浓度增加，改变了地球的生物地球化学循环。可持续的食物系统将是确保世界人口获得必要营养、同时不对环境和社会造成额外损害的关键。与电网一样，IT的机会在可持续农业的系统性问题中似乎最为突出。


    国家研究委员会最近关于可持续农业的报告将“可持续农业系统”定义为：

    - （1）满足人类食物、饲料和纤维需求，并有助于生物燃料生产；

    - （2）提高环境质量和资源基础；

    - （3）维持农业的经济活力；以及

    - （4）提高农民、农场工人和整个社会的生活质量。31


    31 国家研究委员会，*《迈向21世纪的可持续农业系统》*，华盛顿特区：国家学术出版社，2010年。


    美国公共卫生协会在其关于可持续食物系统的政策声明中扩展了这些观点，将可持续食物系统定义为“提供健康食物以满足当前食物需求，同时维持健康的生态系统，使其能够以对环境的负面影响最小化为后代提供食物”。32


    32 美国公共卫生协会，“迈向健康、可持续的食物系统”（2007年）。参见 http://www.apha.org/advocacy/policy/policysearch/default.htm?id=1361。


    可持续食物系统需要同时实现上述四个目标，而不是仅针对任何单一维度进行优化。2012年国家研究委员会的一份关于两次研讨会的报告，对粮食安全、农业以及相关的可持续性挑战进行了广泛探讨。


    大量的氮基肥料用于补充土壤养分，大量的除草剂和杀虫剂用于控制植物和昆虫害虫。此类肥料和杀虫剂使用量的增加，在洪水或暴雨期间会导致径流，从而污染河流、溪流和海湾。耕作土壤会导致土地退化，而在干旱地区耕作会消耗水资源用于灌溉。据估计，在美国，80%的可用饮用水被用于农业灌溉，而对地下含水层的过度抽取（即抽取速率超过自然补给速率）正威胁着美国中西部大片地区的农业活动。35


    ### 公共卫生影响


    除了现代农业对环境的影响外，当前农业实践还对公共卫生产生影响。农场造成的空气和水污染不仅损害环境，也损害在受损环境中或附近生活和工作的人们的健康。工厂化养殖食用动物也增加了食源性病原体的风险，部分原因是动物被集中在封闭式动物饲养经营（CAFO）中，空间狭窄。高度加工食品的供需相互作用也对健康产生影响，尽管关于糖尿病和心脏病等疾病的具体机制和诱因的争论仍在继续。


    ## 发展可持续食物系统的方法


    建立一个更可持续的全球食物系统并非易事。本部分概述了若干方法，其中任何一种都不足以单独奏效，但每种方法都有助于提高可持续性，并可从计算机科学和IT的贡献中受益。这些方法包括：

    - 采用系统视角；

    - 开发测量不同农业系统成本、收益和影响的方法；

    - 使用精准农业；

    - 为知情消费提供信息；以及

    - 为本地食物采购建立社交网络。


    ### 采用系统视角


    总体而言，需要对农业采取系统视角（正如前文所述的智能电网等可持续性其他领域所采取的系统视角一样），以理解并分析农业对环境、经济和社会的总体影响。系统视角适用于系统的所有节点。


