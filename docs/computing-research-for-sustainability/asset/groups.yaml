    # ## Sustainable and Resilient Infrastructures


    The resilience of the nation''s societal and physical infrastructures poses deep
    and crisscrossing sustainability challenges, especially when one takes a broad
    view of sustainability that encompasses economic and social issues. For example,
    although transportation is a major source of GHG emissions and urban sprawl consumes
    open space and farmland, competing incentives in the realm of societal sustainability
    include the need for workers to commute to jobs, for people to have access to
    whole foods, and for available space that allow businesses to change and adapt
    over time. Contributing to the challenges of resilience of societal and physical
    infrastructures is the increasing risk of natural and human-made disasters. Sustainability
    concerns related to climate change, resource consumption, and land use are closely
    linked to natural and human-made disasters.^42 There will inevitably be more disasters,
    and enhancing society''s resilience and ability to cope with them will contribute
    to sustainability. Even apart from climate and resource consumption, the sheer
    magnitude of the world''s population means that crises, when they happen, will
    be at larger scale. This section examines the sustainability challenges around
    planning and modeling infrastructure and anticipating and responding to increasing
    disasters and the ways in which information technology can assist with developing
    sustainable and resilient infrastructures. The section focuses on cities as centers
    of large human populations, but many of the issues discussed apply generally.


    # ### *Challenges to Developing More Sustainable and Resilient Infrastructures*


    Cities are highly complex, evolving systems, involving the interaction of numerous
    people and processes, as well as natural and built infrastructure, legal and regulatory
    frameworks, and much else. The diversity of use within the systems adds another
    level of complexity. Each building''s use and design are unique within a particular
    city; each city''s infrastructure has distinctive characteristics. The heterogeneity
    of structures within any


