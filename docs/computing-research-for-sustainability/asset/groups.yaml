  - '[PAGE 108]


    solutions to particular, critical problems in sustainability and later seeking
    to generalize these solutions, as opposed to striving for universality from the
    start. Many advances will require CS research for progress, as described earlier,
    but those advances may not be immediately evident as universal approaches. The
    committee believes that demanding evidence of clear universality from the start
    is likely to inhibit close interdisciplinary collaboration and, ultimately, major
    advances. Moreover, many sustainability challenges need to be addressed sooner
    rather than later, even if imperfectly. At the same time, the fact that the problems
    associated with sustainability are complex, multifaceted, and in some cases poorly
    defined means that close attention to experimental robustness and underlying mathematical
    rigor will be essential.


    Previous chapters illustrate this overall approach. For example, the hypothesized
    research on the smart grid takes an approach to the problem that is fundamentally
    a computer networks perspective (inspired by the success of the Internet), but
    it is not initially intended to make universal contributions to the theory of
    networks. Rather, by focusing on the problem at hand—that of integrated control
    of power generation, distribution, and use—there is the potential for breakthrough
    advances on this critical issue at the same time that new computational techniques
    are being developed. There are clearly general lessons to be learned about these
    issues. The committee suggests that the best way to learn them is to start with
    the particular sustainability challenge at hand, make progress on that, and later
    seek to generalize.


    This approach does not mean, however, that any application of computation or IT
    problems in sustainability should automatically be seen as computer science research
    for sustainability. Rather, to be judged as a significant contribution within
    the intersection of CS research and sustainability, the contribution first must
    have the potential to make a real difference in moving toward a more sustainable
    future. Second, the contribution must have the potential, if it is successful,
    to add to generalizable knowledge about sustainability, and the contribution or
    proposed solution should, at the same time, require new computational techniques
    or thinking beyond the current state of the art in computing.


    The specific criteria for judging research success should of course evolve over
    time, with members of the community themselves proposing and debating what constitutes
    the most worthy research. The committee emphasizes, however, the criterion of
    having the potential to make a real difference. An open research question in its
    own right is how best to assess and evaluate impacts and how to isolate the effects
    of any particular sets of interventions, given the scales and time frames of many
    sustainability challenges.'
  - '[PAGE 109]


    **PRINCIPLE:** Encourage research at and across disciplinary boundaries, well
    informed by specifics and well structured to handle scale, data, integration,
    architecture, simulation, optimization, iteration, and human and systems aspects.
    CS research in sustainability should be an interdisciplinary effort, with experts
    in the various fields of sustainability being equal partners in the research.


    # TOWARD UNIVERSALITY


    Although the committee emphasizes that a premature focus on universality would
    be detrimental to the kind of high-impact sustainability solutions so desperately
    needed, universality should not be ignored. Indeed, domain-specific research can
    lead toward universality. A challenge, though, is how to pursue the universality
    that contributes so much to the power of computer science. In this section, it
    is argued that the purposes of domain specificity and contextualization are not
    at odds with ultimately producing universality in results, and that universality
    is not achieved directly in most cases in any event. Consider the development
    of important advances in CS and IT. Achieving universality typically involves
    developing well-structured innovative solutions, applying them to the problem
    at hand, evaluating their efficacy, and using this evaluation to guide further
    improvement, enhancement, and new directions. Successful approaches are then refined
    and applied in other areas, perhaps similar to the original problem domain, perhaps
    more remote. As the iterations of application proceed, the universality of the
    approach is discovered and refined.


    Why has this approach worked so well in computer science? Despite the fact that
