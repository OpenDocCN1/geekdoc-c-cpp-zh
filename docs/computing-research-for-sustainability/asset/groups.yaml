    # ## Scientific Workflows


    Participants discussed the typical nature of scientific workflows and the importance
    of uncertainty analysis to their effectiveness. Uncertainty information about
    data collected and generated for analysis is often unavailable. When it is available,
    there are no standardized data structures for sharing and managing this information.
    Due to the complexity of uncertainty modeling, there are very few software tools
    that can incorporate, compute, and propagate uncertainty information. If information
    regarding uncertainty can be propagated somehow, there are still challenges in
    visualizing and disseminating the uncertainty information.


    One example of the difficulty of tracking uncertainty is in the use of multiple
    sensing and data-collection instruments. Often more than one type of instrument,
    such as a camera and a point sensor, is used in the same area or space to measure
    the same phenomenon. A question then arises: Which measurement is more accurate,
    where, and at what time? Using multiple instruments introduces several types of
    uncertainty, including that related to the transformation that researchers apply
    in order to display measurements, that related to spatial registration, and that
    related to the temporal synchronization. In order to grapple with these uncertainties,
    a theory of uncertainty is developed on the basis of a formalized framework that
    describes how to compute uncertainty. Researchers select a measurement based on
    the uncertainty level of each type of uncertainty. As the uncertainty framework
    is built and used, the error propagation rules and methodology allow one to build
    workflows that can be applied to future models and calculation.


    A second example of the difficulty of tracking uncertainty is in managing and
    tracking data. Data often come from a variety of sources and are then processed
    by various computing techniques. As data move from analog instrumentation to a
    visual representation of research findings, uncertainty generally increases. For
    example, visualization features may be derived or elevation and/or slope may be
    computed. Moreover, there may be many users of the collected data, and each one
    may be using a different suite of software tools to process and analyze the data.


    These examples provide some sense of the complexity involved in tracking and accounting
    for uncertainty. Some lessons become apparent. First, uncertainty information
    is vaguely defined; typically it is either a range or a distribution set. Second,
    the complexity of uncertainty modeling using error propagation is greater than
    that of the underlying phenomenon itself. Third, and most importantly, scientific
    workflows are suitable for managing uncertainty modeling; software modules could
    be reused and could track how collected data are being manipulated.'
