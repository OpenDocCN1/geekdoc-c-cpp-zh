    These challenges are further complicated by the changing nature of the load and
    the broader introduction of distributed generation. Unlike purely resistive loads,
    such as heating elements and incandescent bulbs, complex loads effectively cause
    a portion of the delivered power (called reactive power) to be returned through
    the grid to the generator. Historically, such “non-unit power factor” loads were
    predominantly induction motors, which introduce a fairly simple phase shift in
    the alternating current (AC) waveform. But switching power supplies, such as those
    used in computers, fluorescent bulbs, battery chargers, and electronics direct
    current (DC) adapters, introduce complex distortions on the AC waveforms. Residential
    grid-tie solar installations reverse the flow of electricity within portions of
    the local distribution tree. And the introduction of electric vehicles potentially
    introduces high point loads during recharging. Many of these new complex loads
    already possess communications and computations capabilities, and so they could
    potentially be a vanguard of using IT to condition demand in order to be “good
    citizens” of the grid.


    Compounding all of these issues still further are the economic structures that
    impinge on all aspects of generation, delivery, and demand at a range of timescales.
    On an operational basis, collections of suppliers, consumers, and brokers typically
    participate in highly volatile wholesale energy markets at various granularities
    and timescales—a day ahead, an hour ahead, a minute ahead. Meanwhile, consumers
    typically experience relatively stable retail pricing. Compounding all of these
    issues further, utilities and the utility supply industry are still largely incentivized
    to produce and deliver more energy, not less. Economic or other incentives to
    curb growth are lacking in most parts of the world. A notable exception to this
    is net-metering—mechanisms that allow electricity consumers to offset their usage
    of electricity provided by the grid, and thus to lower their cost, by generating
    their own electricity on-site, typically through rooftop solar photovoltaic installation.
    Basically, this can be thought of as the meter spinning backward when local generation
    exceeds local demand. Although net-metering is comparatively common, its penetration
    is modest enough that it can be incorporated as offsetting demand in the neighborhood
    distribution tree, without appreciable impact on transmission needs. Broader,
    less-tangible incentives include the personal satisfaction of obtaining a zero-net
    lifestyle, potentially opening paths toward the decoupling of quality of life
    from energy usage. IT has an important role in doing the complex accounting and
    providing visibility into the consumption and production of otherwise invisible
    resources.'
  - '[PAGE 44]


    **Current Model of Load-Following Supply** Grid operation predominately involves
    orchestrating a portfolio of dispatchable supplies, including baseline (nuclear,
    coal, and hydroelectric power), intermittent (combined-cycle gas turbine), and
    peaker (simple-cycle natural gas) power plants to supply precisely the real-time
    power demand across normal variations, spikes, and infrequent peaks in the load.
    Of course, the demand is not specified explicitly, but implicitly in the use of
    electricity. Typically, independent service operators perform day-ahead demand
    prediction for their entire grid, with hour-ahead and even minutes-ahead adjustments,
    to drive scheduling and market mechanisms while providing adequate generation
    capacity at all specific points in the transmission grid over time. A certain
    fraction of online capacity is retained as "spinning reserve" and is used to match
    short-term changes in demand. An imperfect matching of supply to demand manifests
    in degraded power quality (such as voltage sags or surges, and frequency variation).
    Challenges include the following:


    +   *   ***High cost of peak demand*** Since generation and transmission capabilities
    must be built out to meet the peak demand, this peak drives overall investment.
    However, because there is significant variation in demand, a substantial portion
    of this investment experiences very low utilization. Fundamentally, load following
    relies on statistical multiplexing of independent loads; even though the individual
    loads are very bursty, the aggregate of many such loads is relatively smooth and
    predictable. However, correlations in the loads, such as air conditioning on hot
    summer afternoons or refrigerator compressor cycles at breaks in Superbowl action,
    generate very large aggregate peak demand. Means of power generation with short
    ramp-up times tend to have low efficiency and high GHG emissions and operating
    costs.

    +   *   ***Prediction accuracy and market volatility.*** A mismatch of predicted
    and actual demand leads to large and rapid fluctuations in wholesale energy prices.
    Each new broad-based usage change (for example, the increased uptake of plasma
    television sets, compact fluorescent lamps, electric vehicles, and so on) raises
    concerns of prediction accuracy. Paradoxically, by eliminating waste, energy-efficiency
    measures can lead to larger peak-to-average ratios and potentially lower prediction
    accuracy, making the grid harder to manage.

    +   *   ***Storage limitations.*** Grid-level storage exists in the form of pumped-storage
    hydroelectricity, compressed air, thermal energy storage, batteries, and a few
    other possibilities, but storage capacities remain limited. Storage is typically
    expensive, and turnaround efficiencies (the energy extracted from storage relative
    to the amount stored) tend to be low. Small-scale battery storage is prevalent
    but expensive, and the number of'
  - '[PAGE 45]


    recharge cycles, and hence battery lifetime, is limited. When the effects of manufacturing
    and the disposal of batteries are taken into account, such storage may have a
    net negative environmental impact. Midscale storage (say, 1 to 100 kilowatt-hours)
    is almost non-existent, although ow batteries and electrolysis/fuel cell options
    remain in development.¹⁹


    +   - *Non-dispatchable supplies.* Most renewable sources of energy, such as wind,
    solar, and wave, are non-dispatchable. That is, they are available only at certain
    times and in magnitudes determined by various environmental factors; they cannot
    be summoned on demand. Gross features, such as the incident solar radiation over
    the course of the day or the seasonal patterns in wind, are much more predictable
    than fine features, such as occlusion due to passing clouds or gusts and lulls,
    and the latter can cause very rapid changes in supply.


    Much of the growth of power generation in highly industrialized nations in recent
    years is in renewable supplies. But the penetration of those sources is fundamentally
    limited in a load-following regime (i.e., one in which power output is adjusted
    to demand).


    Many smart grid proposals focus on increasing the capacity and sophistication
    of the transmission system to reduce constraints imposed by transmission in matching
    supply to demand. These include long-distance lines, in many cases using high-voltage
    DC, in order to access remote renewable supplies both for increased availability
    and to obtain geographic decorrelation. Within a grid, especially with distributed
    renewable resources, there may be sufficient supply to serve the load but inadequate
    capacity to route the power from points of generation to points of use. Better
    prediction, monitoring, and scheduling seek to prevent such bottlenecks. “Smart
    meters,” which are currently being rolled out in many regions, provide 15-minute-interval
    readings, rather than monthly accounting. Their use enables more accurate prediction
    and more effective scheduling as well as introducing incentives, such as time-of-use
    pricing or critical peak pricing, to nudge the demand toward a more grid-friendly
    form. These efforts introduce a degree of observability into this complex system
    and thus open the way to decision making and action. As the IT in the grid evolves
    to embody monitoring, communication, embedded processing, and intelligence at
    various levels of the grid, it can provide a foundation for an interactive relationship
    between supply and demand that increases the penetration limit for renewable sources.


    ¹⁹For instance, Sandia National Laboratories just announced the development of
    a new family of liquid salt electrolytes that could lead to devices that could
    better incorporate renewable sources of energy on the grid. See, for instance,
    http://www.sciencedirect.com/sandia_national_laboratories_researchers_find_energy_storage_solutions_in_metils-86320.'
