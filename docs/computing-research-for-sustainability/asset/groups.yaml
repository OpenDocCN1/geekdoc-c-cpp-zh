  mdcn: "\n- *创新文化。* 计算机科学家习惯于几乎不断开发和部署新工具，并快速完成这些工作。与会者认为，这种灵活、包罗万象的方法能够容纳更广泛的想法和更多的创造力。\n\
    - *大规模系统方法。* 计算机科学家拥有构建大型事物的经验，例如大规模集成电路，其包含数千万个在构建时必须正确的设计点，以及如今以数百万行代码计的软件制品。计算机科学家也理解系统方法。\n\
    - *对开放信息系统的理解。* 计算机科学家往往理解开放系统的价值，并且经常被迫应对系统级考虑的需求，例如兼容性和互操作性。分布式电网管理、生态系统理解、危机与灾害响应以及资源跟踪与优化都可以受益于开放、可互操作的信息系统。随着大量数据被收集，隐私和安全成为问题，而这同样是计算机科学家有经验管理的领域。^28\n\
    - *业务转型，通常以效率为目标。* 随着新技术出现，计算机科学行业已经多次转型。例如，与会者指出，数据中心现在与仅仅两年前截然不同。这种变化部分是由效率考虑驱动的。此外，计算机科学在以有趣的方式改造其他行业方面发挥了基础性作用，例如汽车所有权、媒体消费和银行业。智能手机、全球定位系统和人机交互的进步促成了短期用车服务（如Zipcar）的成功；电信网络和文件压缩的进步使互联网视频流成为录像店的可行替代方案；计算机和信息安全增强了对网上银行的信心。\n\
    - *在动态环境中开展教育。* 由于可持续发展努力是复杂的多学科问题，大学将需要新的方法来教导科学家和工程师解决这些问题。计算机科学在历史上通过非常迅速地转变教学技术，适应了课程变化和整体技术环境的变化。这些在计算机科学学科内开发的教育工具，可以帮助培养下一波科学家和工程师。\n\
    \n^27 互联网就是一个例子，其中计算机科学融入了开放信息系统、共享标准以及对知识产权的复杂理解。尽管关于适当的基础设施、标准和知识产权存在问题和争论，尤其是随着互联网越来越多地商业化，但仍然可以从计算机科学界汲取大量关于构建跨学科复杂系统的知识。\n\
    \n## 总结讨论\n\n本次会议引发了研讨会参与者的广泛讨论。提出的几个关键要点概述如下：\n\n- 在信息技术行业，重大创新是在小企业或初创公司中完成的，然后它们往往被大公司收购。这表明，在适当的组织结构和激励下，少量资金可以为可持续发展领域的高度创新项目提供资金。\n\
    - 尽管可持续发展在许多方面可以被视为一个技术问题，但仅靠技术解决方案无法解决。一些人推测，除了应对可持续发展挑战的重大科学和技术突破之外，还需要大规模的社会变革，甚至可能需要达到美国民权运动的规模。计算机科学家可以贡献工具，鼓励个人参与应对可持续发展挑战。\n\
    - 小企业通常需要难以获取的专门信息。计算技巧和技术可以通过提供收集、汇总、分发和分析数据的方式，以及适当的沟通和协调技术来提供帮助。^30\n- 讨论解决方案时存在权衡。例如，提高服务器机房的温度可能会降低冷却负荷，但会导致更高的故障率。必须充分理解这些权衡和故障率，以便做出最佳权衡。\n\
    - 领域科学家（如生态学家、交通专家、土木和电力工程师）需要与从事创新的人（包括计算机科学家）分享信息和知识。计算机科学的第一步可能只是找到更好的方式来呈现这些数据，这将有助于政策制定者。决策者需要更清楚地理解数据，然后才能制定政策。\n\
    \n^30 举了一个例子，当地多家咖啡店有兴趣购买可生物降解产品。如今，可生物降解杯子更贵，只有大量购买才负担得起。它可以连接愿意购买和共享大批量货物的公司。此外，并非所有可生物降解杯子的生物降解程度都相同，这一信息缺口可以通过更可用的数据来解决。然而，计算机科学家通常对产品的化学组成了解甚少，因此也需要跨多个学科和行业进行协调。\n\
    \n## 研讨会日程\n\n2010年5月26日\n华盛顿特区\n\n- **上午8:30-8:35** **欢迎**\n    - *Deborah L.\
    \ Estrin，加利福尼亚大学洛杉矶分校*\n    - *环境与社会可持续性计算研究委员会主席*\n- **上午8:35-10:45** **第一场：用新颖的计算机科学/信息技术方法拓展科学与工程：“将数字转化为知识的需求”**\n\
    \    - *委员会回应人：Daniel Kammen，加利福尼亚大学伯克利分校*\n\n在可持续发展及相关研究中，有哪些示例领域，其中学科研究和跨学科研究与计算机和信息科学新方法的结合能够产生新的创新和知识？一个例子是智能电网，它提供了一种物理和信息技术媒介，在其中可以实现更高水平的高效清洁能源和信息管理，并且需要更高水平的数据安全。讨论主题从电网管理到为低碳电动汽车引入智能管理和充电系统。另一个例子是生态韧性和生态系统功能，即对生态变化以及与生态稳健性相关的相互作用进行监测和建模，这需要新的时空分辨率工具、探索生态系统连通性动态的新方法，以及梳理人为影响的范围。\n\
    \n- *Vijay Modi，哥伦比亚大学：“计算机科学和信息技术对可持续发展的关键作用”*\n- *Robert Pfahl，国际电子制造倡议公司：“通过电子系统和信息技术迈向可持续世界”*\n\
    - *Neo Martinez，太平洋生态信息学与计算生态学实验室：“数字：它们从何而来，以及如何利用它们在地球上更可持续地生活”*\n- *Adjo Amekudzi，佐治亚理工学院：“将社会可持续性度量作为规划和设计的输入”*\n\
    - *Thomas Harmon，加利福尼亚大学默塞德分校：“环境网络基础设施与数据采集”*\n\n上午11:00-下午1:00\n\n## 第二场：理解、跟踪和管理科学到政策全流程中的不确定性\n\
    \n*委员会回应人：Thomas Dietterich，俄勒冈州立大学*\n\n在科学到政策的流程中，不确定性的显式表示很少见。来自多个仪器信息融合的数据产品在输入模型时通常被当作精确值。预测和模拟模型的输出在输入政策制定时通常被当作精确值。管理中的政策优化（例如保护区设计、捕鱼配额、栖息地保护计划）通常对问题表述或目标中的不确定性不稳健。关于未来决策的不确定性和政策执行不完善，会给未来规划注入额外的不确定性。\n\
    \n- 应该显式捕获的不确定性来源有哪些？\n- 哪些方法适合显式表示不确定性？\n- 当前技术水平是否足以建模大规模可持续发展问题中存在的多种不同不确定性？如果不足，那些建模不充分的不确定性类型有什么特征？\n\
    - 哪些方法适合评估流程每个阶段的不确定性？需要解决哪些缺点？\n- 人因、界面和CSCW（计算机支持的协同工作）的最新技术是否足以支持解决大规模可持续发展问题所需的大规模系统、模型和数据集？如果不足，哪些需求尚未满足？\n\
    - 在数据融合、数据同化、预测建模、模拟建模和政策优化中，处理不确定数据的适当技术有哪些？\n- 流水线架构是否足够，还是我们需要一种完全耦合的架构，使政策问题能够一路回溯以指导数据收集和数据融合？\n\
    - 如何将显式不确定性表示集成到科学工作流工具中？\n- 是否存在替代显式不确定性表示的方法，可以提高管理政策对所有这些不确定性来源的稳健性？\n\n> *Peter\
    \ Bajcsy，美国国家标准与技术研究院：“仪器与科学工作流”*\n"
