    \ 强调自下而上的方法与具体性，9\n    - 为提案和结果使用适当的评价标准，9\n    - 应用CS哲学与方法，10\n    - 通过资助计划促进可持续性研究，10\n\
    \    - 促进所需的多学科方法，11\n    - 将可持续性与教育相结合，12\n- 3 增强计算机科学可持续性研究的计划性与制度性机会 86\n \
    \   - 应对可持续性的计算机科学方法，87\n    - 迈向普适性，93\n    - 教育与计划性工作，96\n    - 评估、可行性与影响分析，100\n\
    \    - 结论，103\n\n## 附录\n\n- A 计算与信息技术促进可持续性创新研讨会摘要 107\n- B 委员会成员与工作人员传记 149\n\
    \n## 摘要\n\n大量且不断增多的文献描述了美国与世界面临的可持续性挑战的深刻性和多学科性质。尽管其中涉及深刻的技术挑战，可持续性从根源上说并不是一个技术问题，仅靠技术解决方案也不够。相反，最终需要经济、政治和文化的深度调整，并且每个领域都要作出重大、长期承诺，以大规模部署必要的技术解决方案。尽管如此，技术进步与使能因素在支持这种变革中具有明确作用，而信息技术（IT）[^1]是技术解决方案与社会解决方案之间的天然桥梁，因为它能改善沟通与透明度，以促进必要的经济、政治和文化调整。此外，IT几乎处于每一个大规模社会经济系统的核心——包括金融、制造以及能源生产与分配系统——因此这些系统中以可持续性为重点的变革与IT进步密不可分。简言之，如果国家与世界要实现更可持续的未来，IT创新将发挥至关重要的作用。\n\
    \n尽管IT绿色化——例如减少电子废弃物或计算机能耗——是计算界和IT产业的重要目标，但本报告的重点是“通过IT实现绿色化”，即应用计算来广泛促进可持续性。\n\
    \n本报告有双重目的：聚焦IT创新和计算机科学（CS）[^2]研究能够发挥作用的领域，并敦促计算研究界将其方法和方法论用于应对这些紧迫的全球挑战。重点是以能够产生显著、可衡量影响的方式应对中长期挑战。\n\
    \n计算研究促进环境与社会可持续性委员会的发现和建议原则涉及四个方面：(1) IT与CS同可持续性的相关性；(2) CS方法在问题解决中的价值，尤其是涉及可持续性挑战时；(3)\
    \ 关键CS研究领域；(4) 面向可持续性的CS研究的战略与务实方法。\n\n### 信息技术与计算机科学同可持续性的相关性\n\n“可持续性”一个常被引用的定义来自联合国（UN）布伦特兰委员会的报告*我们共同的未来*：“可持续发展是既满足当代人的需要，又不损害后代人满足其自身需要的能力的发展。”[^3]\
    \ 联合国在2005年世界首脑会议上扩展了这一定义，纳入可持续性的三大支柱：社会、环境和经济方面。[^4] 本报告对该术语采取同样宽泛的看法。尽管可持续性方面的许多关注一直集中在减缓气候变化上，相关努力旨在管理二氧化碳循环和增加可持续能源来源，但还有其他重要的可持续性挑战（如水资源管理、改进城市规划、支持生物多样性和粮食生产），这些挑战也能因计算研究的进步而转变，因此本报告也予以考虑。\n\
    \n从计算机科学的视角看待可持续性时，采取系统观是很自然的。对上述可持续性宽泛定义的一种展开是：一个系统除非能够无限期地运行到未来，否则就不是可持续的。系统要做到这一点，必然需要在时间和空间上进行优化——这些目标正是计算机科学许多内容的核心。\n\
    \n报告《SMART 2020：在信息时代实现低碳经济》[^5]有益地将把IT应用于可持续性的机会分为三大领域：(1) 建成基础设施与系统，(2) 生态系统服务与环境，(3)\
    \ 社会技术系统。下文描述这些领域，并概述IT应用和计算机科学研究机会：\n\n- *建成基础设施与系统。* 这一领域包括建筑、交通系统（个人、公共和商业）以及消费商品（大宗商品、公用事业产品和食品）。IT以多种方式为建成基础设施中的可持续解决方案作出贡献：从改进的传感器技术（例如智能建筑中的嵌入式传感器）和改进的系统模型，到改进的控制与优化（例如物流和智能电网），再到改进的通信与人机界面（使人们能够作出更有效的决策）。\n\
    - *生态系统与环境。* 这一领域涵盖评估、理解并积极影响（或不影响）环境和特定生态系统——这些努力代表了许多可持续性工作的交叉性挑战。该领域工作的规模和范围从考察物种栖息地的局部和区域努力，到流域管理，再到理解全球气候变化的影响。挑战的范围本身提出了一个问题：如何最好地评估各种可持续性活动的相对重要性，以着眼于显著影响。此外，计算技术对于发展科学知识和工程技术将很有价值，包括改进数据驱动科学、建模和仿真的方法，以提高生态学中的科学理解程度。\n\
    - *社会技术系统。* 社会技术系统涵盖社会、组织和个人，及其行为以及他们使用的技术基础设施。要对可持续性产生重大而持久的影响，就需要使个人、组织和民族国家长期的行为变化成为可能、得到鼓励并持续下去。IT，尤其是实时信息和工具，可以更好地使个人和组织能够作出日常、持续的\n\
    \n[^1]: 此处“信息技术”作广义定义，包括计算与通信能力。\n\n[^2]: 此处“计算机科学”作广义定义，包括计算机与信息科学与工程。\n\n[^3]:\
    \ 联合国大会，1987年3月20日，《世界环境与发展委员会报告：我们共同的未来》，作为文件A/42/427《发展与国际合作：环境》的附件提交大会；《我们共同的未来，第2章：迈向可持续发展》，第1段，联合国大会。可访问\
    \ http://www.un-documents.net/ocf-02.htm。\n\n[^4]: 联合国大会，2005年世界首脑会议成果，决议A/60/1，由大会于2005年9月15日通过。\n\
    \n[^5]: 气候组织，《SMART 2020：在信息时代实现低碳经济》（2008）。可访问 http://www.smart2020.org/publications/。\n\
    \n"
