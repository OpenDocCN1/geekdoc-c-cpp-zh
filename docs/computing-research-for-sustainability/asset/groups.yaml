    Y_sj = 1，否则报告 0。若该物种存在于地点 s，则隐变量 Z_s = 1，否则为 0。X_s 是该地点属性的向量，X→Z 关系预测基于这些属性该物种是否会出现。这是主要关注的占据模型。W_s
