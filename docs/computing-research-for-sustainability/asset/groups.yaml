    +   - **8:30-8:35 a.m.** **Welcome**

    +     *Deborah L. Estrin, University of California, Los Angeles*

    +     *Chair, Committee on Computing Research for Environmental and Societal Sustainability*

    +   - **8:35-10:45 a.m.** **Session 1: Expanding Science and Engineering with
    Novel CS/IT Methods: “The Need to Turn Numbers into Knowledge”**

    +     *Committee respondent: Daniel Kammen, University of California, Berkeley*


    What are some example areas of efforts in sustainability and related research
    where the interface of disciplinary and interdisciplinary research with new methods
    in computer and information science can generate new innovations and knowledge?
    One example is the smart grid, which provides a physical and information technology
    medium where new levels of efficient and clean energy and information management
    are possible, and where new levels of data security are needed. Discussion topics
    range from grid management to the introduction of smart management and charging
    systems for low-carbon electric vehicles. Another example is ecological resilience
    and ecosystem function, which is the monitoring and modeling of ecological change
    and of the interactions related to ecological robustness and requires new tools
    for temporal and spatial resolution, new methods to explore the dynamics of connectivity
    in ecological systems, and teasing out the ranges of anthropogenic impacts.


    +   - *Vijay Modi, Columbia University: “Criticality of CS and IT to Sustainability”*

    +   - *Robert Pfahl, International Electronics Manufacturing Initiative, Inc.:
    “Towards a Sustainable World Through Electronic Systems and IT”*

    +   - *Neo Martinez, Pacific Ecoinformatics and Computational Ecology Lab: “Numbers:
    Where They Come From and What to Do with Them to Live More Sustainably on Earth”*

    +   - *Adjo Amekudzi, Georgia Institute of Technology: “Using Social Sustainability
    Measures as Inputs in Planning and Design”*

    +   - *Thomas Harmon, University of California, Merced: “Environmental Cyberinfrastructure
    and Data Acquisition”*'
