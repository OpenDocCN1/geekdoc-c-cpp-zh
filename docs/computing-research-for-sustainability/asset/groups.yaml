    # ## STRATEGY AND PRAGMATIC APPROACHES


    For computer science to play an effective part in meeting global sustainability
    challenges, priority should be given to research that addresses one or more important
    sustainability challenges and that offers the prospect of tangible impact, either
    directly or through game-changing contributions that offer leveraging opportunities
    for other domains. The research areas listed in the section above are the committee’s
    recommended starting place.


    An ongoing challenge is for IT experts and CS researchers to ensure that technologies
    and approaches represent usable and appropriate solutions, that they are highly
    effective, and that they take advantage of the deepest and most powerful insights
    that can be brought to bear.


    # ### Emphasize Bottom-Up Approaches and Concreteness


    The committee believes that CS research on sustainability is generally best approached
    not by striving for universality from the start, but instead by beginning from
    the bottom up: that is, by developing well-structured solutions to particular,
    critical problems in sustainability, and later seeking to generalize these solutions.
