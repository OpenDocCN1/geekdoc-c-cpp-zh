    ## Decision Making Under Uncertainty


    Actually addressing sustainability problems requires that one move beyond observation
    and analysis to action. But there is inherent uncertainty every step of the way—in
    the decision making informed by modeling and simulation, in the measurements,
    in the modeling and simulation itself, and possibly in the basic characterizations
    of the factors that comprise the system. In terms of science-based decision making,
    a central challenge is then the making of (optimal or at least good) decisions
    under uncertainty. There are many sources of uncertainty that must be taken into
    account. First, the scientific understanding of many systems is far from complete,
    and so many aspects of these systems are unknown. Second, even for those aspects
    for which good mechanistic models exist, the data needed to specify the boundary
    conditions with sufficient accuracy are often lacking, especially when human decisions
    and activity need to be included. Third, the lack of data and the computational
    cost of running the models often require a coarsening of the scale and the introduction
    of other approximations. Finally, today’s sustainability risks are time-critical,
    and so just waiting for additional scientific and engineering research in order
    to address these uncertainties is not an option. Action must be taken even as
    research continues. Therefore, the choice of actions should also take into account
    the fact that scientific understanding (and computing power) is expected to improve
    over time, and future decisions can be made with a better scientific basis.


    In effect, uncertainty must be treated as a quantity that persists and is accounted
    for at every stage. It is a product of measurement, data collection, and modeling,
    along with the data themselves. It is both an input and an output of the analysis,
    modeling, and simulation efforts. And finally, decisions must be made based not
    just on expected outcomes, but also on the uncertainty associated with the various
    alternatives.16


    There are three areas that pose interesting research challenges for computer science
    with respect to uncertainty: assessment, representation, and propagation of uncertainty;
    robust-optimization methods; and models of sequential decision making.


