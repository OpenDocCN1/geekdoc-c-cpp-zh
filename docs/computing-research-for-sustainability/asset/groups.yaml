    性能将如何扩展、哪些行为在允许范围内，以及子系统（或外部参与者）应如何与整个系统交互。这类挑战或许在第一章讨论的智能电网示例中体现得最为明显。然而，第一章中的其他示例——粮食系统以及可持续和韧性基础设施的发展——也清楚地表明，早期的架构选择（例如全球粮食系统中各个农场的预期角色和行为，或危机中第一响应者的预期通信能力）可能产生长期的影响。


    系统的架构体现了早期的设计决策，并且在这些决策做出很久之后，仍对系统的用途、行为和效果产生重大影响。此外，需求不可避免地会随时间变化，因此需要灵活或可演化的设计。由于系统的架构在其生命周期中对系统几乎所有方面都有巨大影响，因此更大规模系统的架构必然值得投入大量的关注和资源。随着系统在规模上趋于全球化，计算机科学和软件工程学科一直在应对与架构相关的挑战，这些挑战涉及在大地理区域内运行、拥有无数输入和数百万用户的大型系统。因此，从硬件、软件、网络和信息系统的架构设计中获得的经验，更广泛地适用于为实现可持续性而进行的基础设施结构化、设计、维护、更新和演化过程。^3^


    > 3 关于架构在软件密集型系统中的重要性的深入探讨，请参见以下报告的第3章：National Research Council, Critical Code:
    Software Producibility for Defense, Washington, D.C.: The National Academies Press
    (2010)。该报告对架构的重要性作了如下描述（第68-69页）：“架构代表了最早且往往最重要的设计决策——这些决策最难改变、也最关键要正确。架构使得在理解工程角度上什么是可行的、以及在当前技术状态下什么是不可行的基础上，来构建需求成为可能。它为利益相关者之间的沟通提供了一种机制，这些利益相关者包括基础设施提供者以及其他有互操作性需求的系统的管理者。它也是第一个处理所谓非功能属性的设计工件，这些属性包括性能、可修改性、可靠性和安全性，它们反过来决定了系统的最终质量和能力。架构是实现重用的重要推动因素，也是系统演化的关键，使得能够管理未来的不确定性。在这方面，架构是模块化的主要决定因素，因而也决定了多个设计决策彼此解耦的性质和程度。因此，当存在可能或潜在变化的领域时，无论是系统功能、性能、基础设施还是其他方面，都可以通过架构决策来封装这些变化，从而增加整体工程活动免受与这些局部变化相关的不确定性影响的程度。”


    本报告尚未解决的一个问题是，计算机科学研究界在应对全球可持续性挑战方面准备得如何。在委员会看来，一个感知到的障碍是，将研究导向可持续性挑战可能与科学最终追求普遍性的目标相冲突。^4^
    下面将更详细地探讨这个问题。


    > 4 计算机科学与领域科学的整合是1992年美国国家研究委员会报告的核心宗旨：National Research Council, Computing the
    Future: A Broader Agenda for Computer Science and Engineering, Juris Hartmanis
    and Herbert Lin (eds.), Washington, D.C.: National Academy Press (1992)。


    迄今为止，最强大和最重要的计算机科学创新都具有普遍性这一特征。事实上，正是它们跨越广泛领域的实用性，使得它们的总体影响如此巨大。参见框3.2，其中列出了计算机科学一些最重要成就的简要清单。大学、研究实验室、院系和资助机构越来越认识到多学科研究的价值。然而，随着该领域的成熟，对领域驱动创新方法的重视相对减少，而更倾向于尝试直接通往普遍性的研究——即抽象性和广度。尽管如此，计算机科学的一个优势是，该领域能够并且确实将其进步建立在现实世界的问题上。正如第一章和第二章所述，计算机科学能够对可持续性做出重大而关键的贡献。本节认为，要对当今世界面临的紧迫挑战产生最大影响，计算机科学研究必须借鉴领域专家的深层知识、输入和背景。


    在计算机科学的某些领域，普遍性被内置于问题定义中。当然，理论计算机科学的大部分内容都始于用抽象的符号语言表示目标问题。其他从一开始就以普遍性为焦点的研究例子包括冯·诺依曼计算机模型本身、诸如Fortran和ALGOL之类的编程语言，以及早期的人因研究（如道格·恩格尔巴特和艾伦·凯的工作）创造了人机交互的新模式。然而，在其他同样重要的领域，广泛的适用性在数年甚至数十年后才出现，因为研究人员从特定领域的问题出发，开发解决方案，然后才从这一系列具体贡献中概括并理解更深刻的真理。从高度具体项目开始的重要贡献例子包括万维网（最初构想为共享研究论文和科学信息的手段）和面向对象编程（早期的面向对象语言是为了解决离散事件模拟或图形交互等特定问题而开发的）。


    本章认为，计算机科学对可持续性的研究最好采用自下而上的方法：即通过开发结构良好的


    ## 框3.2


    ### 普遍性与计算机科学最伟大的成就


    下面的列表提供了对多年来计算机科学一些最重要成就的一种看法。这里的“计算机科学”被广泛地解释为包含信息和通信技术。^1^ 下面列出的大多数成就都是通过专注于开发特定领域的解决方案，并着眼于最终的抽象和普遍性来实现的。


    - 普遍性——图灵机

    - 可计算性和难解性——P、NP和复杂性类

    - 存储程序计算机——执行任何事物

    - 操作系统（相对于操作员）

    - 互联网和互联网协议——将任何事物移动到任何地方

    - 文件存储——将任何事物向前推进

    - 编码、解码和密码学

    - 编程语言及其翻译

    - 分层设计（相对于垂直整合）——抽象作为基础

    - 微处理器、个人计算机

    - 音频/视频表示

    - 分布式系统

    - 自描述模式、文档

    - 计算机辅助设计、计算机辅助制造、计算机辅助优化、计算机辅助工程（设计、模拟、构建、测试、测量、使用）

    - 数据库查询语言和管理系统

    - 连续用户输入（指针、点击器）

    - 图形学：各种形式的用户界面

    - 并行执行

    - 物理现象的数值模拟

    - Web、超文本和全局命名空间中的分布式标记

    - 大规模关键字搜索

    - 电子表格

    - 调度、规划、优化

    - 超大规模集成、设计规则、综合、验证、大规模系统生产

    - 搜索技术、启发式方法

    - 机器学习

    - 图的结构


