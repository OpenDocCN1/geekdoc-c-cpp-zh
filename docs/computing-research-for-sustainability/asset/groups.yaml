    ## EVALUATION, VIABILITY, AND IMPACT ANALYSIS


    One of the greatest challenges in multidisciplinary research is to establish evaluation
    metrics that are both actionable and meaningful across the constituent disciplines.
    This chapter concludes by identifying methodological opportunities for optimizing
