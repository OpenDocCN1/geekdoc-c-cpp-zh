    # ## Human Understanding of Sensing, Modeling, and Simulation


    As the availability of sophisticated sensors, information collection, modeling,
    and dissemination increase, techniques need to be developed to provide in meaningful
    forms rich, highly disaggregate information to households, small groups, and organizations
    regarding resource usage (e.g., for electricity or water consumption). In addition
    to supporting improved decision making about energy use at the organizational
    and individual levels, this information could provide civil and environmental
    engineers with a picture at a new level of detail about how and why these resources
    are being consumed, allowing their science and practice to advance. At the same
    time, this possibility raises challenging research questions regarding appropriate
    amounts of information, how to deal with the inherent uncertainties in the data,
    techniques for evaluating such systems, coupling with other systems on the supply
    side (e.g., the smart grid), and important value questions regarding fairness,
    representativeness, security, and privacy. Better data can also drive modeling
    and simulation, which can help with such activities as predicting important trends,
    assessing how well proposed policies would meet objectives, and optimizing resource
    use. Modeling climate change is an obvious example, but there are many others,
    including a simulation of the evolution of urban areas, freight transport, and
    natural environments such as forests or rivers. However, to be effective and relevant
    to policy making and decision making, such modeling work must include careful
    consideration of how it integrates with deliberation and the political process.
    This raises issues of design for transparency, legitimation, appropriateness,
    and participation.


