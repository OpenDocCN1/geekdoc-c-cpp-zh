    takes into account the adaptive nature of the demands (e.g., to answer questions
    such as: How far will people be willing to time-shift demand this Thursday?).
    With the help of predictive analysis and weather data, utilities could use estimated
    capacity to improve their consumption forecasts, which would significantly improve
    their cost structure.


    More generally, economic mechanism design tools for designing pricing within a
    controlled system will be needed. Sophisticated statistical models could help
