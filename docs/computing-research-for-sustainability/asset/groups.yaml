    facilities and transmission lines must be chosen. In managing global climate change,
    the amount of required reduction in greenhouse gas emissions each year must be
    determined. The state of the art for solving sequential decision problems is to
    formalize them as Markov decision problems and solve them by means of stochastic
    dynamic programming. However, an exact solution through these methods is only
    feasible for processes whose state space is relatively small (tens of thousands
    of states). Recently, approximate dynamic programming methods have been developed
    in the fields of machine learning and operations research.22 These methods typically
    employ linear function approximation methods to provide a compact representation
    of the quantities required for stochastic dynamic programming.


    An important aspect of sustainability problems is that they often involve optimization
    over time and space. For example, consider the problem of designing biological
    reserves to protect threatened and endangered species and ecosystems. Many conflicting
    factors operate in this problem. Large, contiguous reserves tend to protect many
    species and preserve biodiversity. However, such reserves are also more vulnerable
    to spatially autocorrelated threats such as fire, disease, invasive species, and
    climate change. The optimal design may thus involve a collection of smaller reserves
    that lie along environmental gradients (elevation, precipitation, etc.). The purchase
    or preservation of land for reserves costs money, and so a good design should
    also minimize cost. Another factor is that reserves typically cannot be designed
    and purchased in a single year. Instead, money becomes available (through government
    budgets and private donations) and parcels are offered for sale over a period
    of many years. Finally, the scientific understanding and the effectiveness of
    previous land purchase decisions can be reassessed each year, and that should
    be taken into account when making decisions.


    The solution of large spatiotemporal sequential decision problems such as those
    described above is far beyond the state of the art. Striking the right balance
    between complexity and accuracy, especially in the context of complex networked
    systems, is critical. New research is needed to develop methods that can capture
    the spatial structure of the state each year and the spatial transitions (e.g.,
    fire, disease) that occur. There are sustainability problems in which all three
    of these factors—uncertainty, robustness, and sequential decision making—combine.
