  md: '# # How NLP is used in this book


    When I first-discovered NLP in 1997, I experienced it as the most results-focused
    technology I had ever come across (and I’d come across a few having been a consultant
    for many years!). NLP is all about consistent long-term results that can be achieved
    fast. In this book you will learn how to use NLP to:


    +   - Develop a ‘winning state of mind’

    - Dare to be different!

    - Improve your leadership skills to inspire and motivate others

    - Build a high performing team

    - Motivate and engage with staff

    - Create innovative solutions to challenges

    - Have courageous conversations

    - Manage benefits-driven change programmes

    - Understand the ‘rules of the game’ to change culture

    - Utilise world-class communication skills

    - Quickly build strong rapport and solid business relationships

    - Learn how to differentiate yourself with your clients

    - Become a relaxed and excellent presenter

    - Consistently exceed your client’s expectations


    What does NLP mean for your business? Positive results will be immediately recognised
    through increased motivation, confidence and skills. Longer-term benefits include
    elevated performance and productivity, higher morale and motivation, reduced turnover,
    lower absenteeism and a higher return on investment.'
