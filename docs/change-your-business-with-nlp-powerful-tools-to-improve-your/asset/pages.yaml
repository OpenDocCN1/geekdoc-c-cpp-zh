    # Effective communication


    One of the key discoveries I made as a new manager was that my staff didn''t share
    the same model of the world as me, and they certainly didn''t always understand
    what I was attempting to communicate to them. Typical communication issues in
    remote teams include allocating meanings to communications which are skewed, leading
    to misunderstandings, making the wrong assumptions when there is little information
    to go on, mind-reading what other people are thinking about a situation and getting
    it wrong, and filling in the communication gaps with the wrong Data. And that''s
    before you add in cultural differences! It can become a minefield of problems.
