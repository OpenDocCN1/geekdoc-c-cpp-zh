  md: '# # 12

    EXCEEDING CUSTOMER EXPECTATIONS


    Is it actually possible to keep up with customer expectations?


    Some people argue that, whilst it''s not hard to exceed customer expectations
    one, two or even three times, it''s very hard to keep on exceeding customer expectations.
    This is because customer expectations are constantly going up and up. With every
    good experience your customer has at one of your competitors, their benchmark
    of good service increases. So your competitor''s actions have just as much of
    an inflationary effect on customer expectations as your own. In fact, your customers
    are also going to look at their satisfaction with you versus other companies that
    they interact with. And don''t think this just happens with private businesses.
    There is also a similar effect in the public sector. For example, I was consulting
    with a team of planners from a seaside Borough Council. Their planning processes
    were outdated compared to other planning authorities. In particular, their website
    was unable to process planning applications on-line, unlike most of the surrounding
    local authorities who had made the necessary investment in new systems. This caused
    major irritations for customers moving into the area from neighbouring boroughs
    because'
