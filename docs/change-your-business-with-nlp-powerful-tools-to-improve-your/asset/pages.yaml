  md: 'Managing Change Effectively 169


    Jeffrey M. Hiatt and Timothy J. Creasy, authors of Change Management, The People
    Side of Change, said that the natural and normal reaction to change is resistance.
    Each individual member of staff has a threshold for how much change they can absorb
    based on:


    +   - Their personal history

    - Current events in their life

    - Current changes at work

    - How much other change is going on


    This will impact on how far they go into denial at the start of a change process
    and the level of resistance they will demonstrate. As a change leader, you therefore
    need to expect resistance and plan for it. The way you use your language in your
    communications planning and delivery is a critical success factor.


    # The Meta Model


    Have you ever chatting to someone about some aspect of your change programme and
    find yourself wondering what on earth they are talking about? There seems to be
    some important information missing from their language or they are making massive
    assumptions. For example, they might say to you, ‘It’s a bad idea to implement
    this change in the business.’ You might be left wondering, ‘who says’. Or they
    might say to you, ‘Every time we implement a change we make a mess of it.’ You
    might well be left questioning ‘every time’. People distort, generalise and delete
    their use of language all the time. This can be a particular challenge when implementing
    change as staff constantly mind-read what’s going on, attach meanings to things
    that are not true and delete information that they do not want to hear.'
