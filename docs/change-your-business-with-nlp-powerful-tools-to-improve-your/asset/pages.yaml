    +   1. **Shared vision.** A shared vision binds the business together around a
    common theme. Involve the team members in the planning process as evidence shows
    that team members are less likely to destroy that which they''ve helped to create.
    Teams like this understand their purpose, their individual roles, feel a sense
    of ownership, and can see how they personally, and as a team, make a difference.
    Wherever the team is placed in the organisation knows how it connects to the strategic
