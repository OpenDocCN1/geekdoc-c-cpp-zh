    # NLP - manipulation or influence?


    One question I get asked more than any other is whether or not NLP is manipulative.
    I often challenge those who pose the question by asking if they know of any sales
    people who have been taught ‘manipulative’ techniques. Of course they have, so
    NLP is not the only toolkit that has the potential to manipulate – there are many
    sales people out there with huge sales targets who are taught to sell at all costs,
    whether the customer needs the goods or not. I would, therefore, agree that the
    potential is there in NLP. Indeed, you have already learned some very powerful
    techniques and you will learn some more in this chapter. What makes the difference
    is how you use the tools you have been taught. That’s why this chapter is entitled
    ‘Influencing with Integrity’. The difference between manipulation and influence
