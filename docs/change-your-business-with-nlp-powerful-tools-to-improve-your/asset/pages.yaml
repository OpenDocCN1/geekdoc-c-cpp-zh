    # Building sponsorship and managing stakeholders


    In this section you will learn how to manage challenging situations using an NLP
    tool called ‘perceptual positions’. When I use this tool with business teams I
    call it ‘Stepping into Another’s Shoes’ as it’s easier for the groups to understand.
    One of the core principles of NLP, covered in Chapter 2, is that ‘the person with
    the most flexibility will achieve the most’. How do you become more flexible?
    Well, those people who are able to experience a situation from many different
    perspectives are likely to have the mental agility to get the best outcome. This
    flexibility and agility is invaluable in a change management scenario in order
    to influence key stakeholders. Imagine how useful it would be if you could use
    this model to create awareness and engagement amongst staff and build sponsorship
    from the change leadership.


    Essentially, the purpose of the model is to examine an existing scenario from
    a number of different perspectives. It is very useful for exploring change scenarios
    where resistance and blockages are preventing a project from moving ahead at the
    required pace.


    How it works is you take a situation with another individual or a group and explore
    that situation from three different perspectives as follows:


    +   1. First position. This is your own Perceptual Position as you experience
    the situation. In NLP, we call this a fully associated position. That is, you
    are fully in it and living as if it is happening right now. In this position you
    are fully able to appreciate what is important to you personally about the scenario.'
  merge: -1
  pgno: 206
- img_proc: true
  md: '# 180 Change Your Business with NLP


    2. Second position. This is the Perceptual Position of an ‘other’. By putting
    yourself in second position you are able to understand more about where the other
    person or group is coming from, and what their model of world would need to be
    in order for them to behave in the way that they are. You experience the situation
    as if you were them. You do this by imagining what it is like to experience the
    world as they do. Of course, you can never exactly do this but it''s amazing to
    give it a go. This is the one time when reads are especially useful!


    3. Third or observer position. This is the ‘helicopter view’ – the objective position.
    This is the ability to stand back from the emotion of the scenario as if you are
    the detached observer. You ask yourself what can be learned from the behaviour
    of both parties.


    In positions 1 and 2, ask yourself the following set of questions:


    +   * What’s going on? (i.e. as the other person when in position 2)

    * How are you behaving?

    * How are you feeling?

    * What do you believe about the situation?

    * What’s important to you?

    * What do you want to happen?

    * What is there for you to learn from this position?


    In position 3, ask yourself the following set of questions:


    +   * What’s going on?

    * How are they each behaving?

    * How are they each feeling?'
