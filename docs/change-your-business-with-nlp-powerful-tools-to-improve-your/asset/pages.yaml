  md: '# What''s different about this book?


    When I was researching NLP books for business, I made an interesting discovery.
    There seemed to be very few – if any – ‘how to’ books that showed the reader specifically
    to utilise NLP tools and techniques in a pragmatic way in business. Many of the
    books seemed to over-complicate the subject, making it inaccessible to most business
    people coming to NLP for the first time. Also, many started from the perspective
    of the NLP techniques, for example ‘anchoring or rapport techniques’, without
    clearly showing how these could be used in different business situations.


    This book is different because it turns the traditional NLP business book on its
    head and asks how NLP can solve business challenges in today''s environment. For
    example, it shows how to use NLP tools and techniques to build a high-performing
    team and develop long-term customer relationships. It also offers a range of case
    studies that demonstrate how NLP has been used and the measurable benefits of
    doing so. Finally, there are close to 50 pragmatic exercises running as a common
    theme throughout the book. They provide you with the opportunity to practise your
    new skills as you learn about the subject matter. It''s been proven that knowledge
    alone does not easily embed in the nervous system to change behaviour. By practising
    these techniques you integrate the learning for yourself and prove to yourself
    that you can do it, thereby creating new beliefs about your own competency levels.


    The exercises are an essential component of this book. I encourage you to complete
    them as fully as possible as they will literally take your performance to the
    next level. You can complete them in this book, or if you prefer, copy them into
    a personal journal.


    I find that there are three ways that people learn. Firstly, you may find yourself
    enjoying the learning and using the'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'exercises to make new discoveries about yourself. You rel- ish every opportunity
    to improve yourself and your business. That’s the best way to experience this
    process. Secondly, you may feel some resistance to what you are learning as it
    chal- lenges the way you have always gone about things. When you feel resistance
    you know that you are on the verge of learning something important. It’s even
    more important in these moments to stick with the process and the exercises and
    not skip on to the next section. It will be in one of these specific moments that
    you discover the most important mes- sage for yourself. Thirdly, you may even
