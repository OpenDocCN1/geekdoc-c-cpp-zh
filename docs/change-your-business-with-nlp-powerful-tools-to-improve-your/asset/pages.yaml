  md: 'Let’s look at each element of NLP in turn and I’ll explain what it’s all about.


    # Neuro


    Neuro is all about what we **think** – or our thoughts.


    Neuro means ‘what goes on inside our heads’. We have over 60,000 thoughts a day.
    These form our internal world of pictures, sounds and feelings. It is these conversations,
    dialogues or arguments we have with ourselves in our thinking process that drive
    how we feel, our mood and ultimately how we respond to events. In NLP terms these
    are called **internal representations**. For example, if you have an important
    meeting with your boss coming up and you think about it going badly, in this turn
    is likely to make you feel bad. Guess what? With those circumstances, you’re likely
    to create exactly what you are thinking inside your head. On the other hand, you
    can focus on the meeting going well and feeling very excited about it. Guess what?
    You’re much more likely to create it going for yourself. To be clear about the
    importance of this, your thoughts and the way you will feel **impact directly**
    on the success of the meeting.


    The critical point to realise is that we can control our thoughts and I will show
    you how.


    # Linguistic


    Linguistic is all about what we **say**, both verbally and non-verbally.


    Language determines how we communicate with other people and ourselves. It is
    how we label our experiences and much more. Empowering language generates empowered
    behaviour. Likewise, negative language limits our choices.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Introduction xix


    It is estimated that 93% of communication is non-verbal. This means how you say
    what you say (intonation, volume, speed, etc.) carries five times more information
    than the words spoken. And how you use your body (gestures, facial expressions,
    posture) is even more influential. As our thoughts and feelings literally ''leak''
    out of our bodies, consider what you say about you? For example, when you are
    getting ready for an important meeting, you are focused on getting the result
    you want or do you let your anxieties get the better of you? Does your physiology
    in that situation portray nervousness and concern or someone who has confidence
    and knows what they want?


    # Programming


    Programming is all about what we do.


    We are all running programmes in our minds, all of the time. These programmes
    drive the way we behave, our performance and, ultimately, our results. For example,
    in your career, maybe you notice the same challenges keeping up? Perhaps you always
    encounter a difficult boss or maybe you experience conflict in every team that
    you manage? In these situations, the only common denominator is you! These programmes
    run at an unconscious level in the nervous system which is why they are difficult
    to change. NLP helps to identify these negative programmes and to change them
    so these experiences no longer show up in your life. As you think about it now,
    do you have any scenarios like this?


    To bring it altogether, NLP symbolises the relationship between the brain, language
    and the body. It describes how what we say, think and do interplay and affect
    our body and our behaviour and our results. As Sue Knight explains in her book,
    NLP at Work, ‘It’s the difference that makes the difference in business’'
  merge: -1
