    # The TOTE


    The TOTE is the fundamental model used in NLP strategies. I notice that a lot
    of my NLP students find the concept of the TOTE pretty mind-boggling so I''m going
    to explain it here as simply as possible.


    The TOTE model was developed in 1960 (published in Plans and the Structure of
    Behaviour) by psychologists Eugene Galanter, Karl Pribham and George Armitage
    Miller to describe and explain human behaviour. The acronym TOTE stands for:


    +   * **Test** – Here we set or access the criteria for the desired state.


    +   * **Operate** – Here we access or gather the data


    +   * **2nd Test** – We compare or evaluate the data in respect to the criteria


    +   * **Exit** – We select or prioritise the data and exit if we have a match'
