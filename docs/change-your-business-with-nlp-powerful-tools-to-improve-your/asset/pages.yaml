    practical applications in a range of different settings. My outcome in this chapter
    is for you to be able to confidently apply these techniques with your own team
    or teams. These principles apply to all teams in the business from the leadership
    and executive team through middle management to front-line teams.


    Let’s begin by exploring what factors make a high-performing team and examine
    how to use NLP to develop these factors in your teams.


    # What makes a successful team?


    Of course you can list the knowledge and skills that make for successful team
    working. However, this doesn’t quite answer the question. What’s really important
    is to focus on the way'
