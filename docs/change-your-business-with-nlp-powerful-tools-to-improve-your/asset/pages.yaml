  md: '# 198 Change Your Business with NLP


    Everything anyone does involves a TOTE. Sue Knight said that:


    > The principle is our behaviour is driven by an outcome (desired state) and we
    recognise when we have achieved that outcome by a set of evidence criteria...
    We are constantly comparing our present state to our desired state to find out
    if they match. When they match we have reached the exit point or our outcome.
    If the present state does not match our desired state we have to do another operation
    to discover if that makes a difference.


    We are all running TOTES constantly and comparing where we are to where we want
    to be and taking action to get ourselves closer to the exit point. The TOTE is
    a feedback loop. Key skills to get through the TOTE are: sensitivity to what is
    happening around you, a willingness to learn from feedback, and the flexibility
    to do something different when what you are doing is not working.


    Here is an example. Recently, I wanted to buy a new telephone that I could use
    to receive my emails on the move.


    +   1st Test: I worked out a list of my criteria for what gadgets I wanted on
    my new phone


    +   Operate: I then visited a number of stores and played with their model phones
    and I did some research on the internet to discover what other phones matched
    my criteria


    +   2nd Test: I compared the facilities of all the phones with my original list
    of criteria


    +   Exit: I then made my choice and exited the strategy with my purchase


    What often happens at the Operate stage is that new criteria are added to our
    list of requirements. For example, if I discovered some phones with different
    features than those on my'
  merge: -1
  pgno: 225
- img_proc: true
  md: 'list, I would have to re-cycle back to the 1st test, reset my criteria and
    start again. This, then, a model to move from your current state to a desired
    state.


    Take our culture change example. We are aiming to make our current state change
    to equal to our desired state. The TOTE would look like this:


    +   - 1st Test: You specify the features of the desired culture and ask yourself
    if your organisation is there yet? Answer would be ‘no we are not''

    - Operate: Next you take action and apply different ‘operations’ that move you
    closer to your desired state

    - 2nd Test: As you journey along you apply another T (test) and ask the question
    ‘are we there yet?’

    - You continue looping around Steps 2 and 3, the Operation and Test, until you
    reach your desired state

    - Exit: Then you exit


    If you are not getting the results that you want, it’s a useful technique for
    identifying why you have not yet reached your desired state’. Eliciting the step-by-step
    detail of your strategy will enable you to discover the exact moment the strategy
    needs to be amended or changed to get you the result that you require.


