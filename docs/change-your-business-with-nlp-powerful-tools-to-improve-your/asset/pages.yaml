    # Formatting for success


    I am about to share with you one of the most useful things I have ever learned.
    It’s called the ‘4Mat system’.


    Why would you want to learn this system? Well, what if you could learn a simple
    structure that would enable you to put a presentation together in minutes, regardless
    of the subject? Imagine you meet your CEO in the corridor early one morning. They
    say to you, ‘Can you come and present to the Board on progress with that project
    of yours?’ You say ‘yes’, thinking it will be at the next meeting in a month’s
    time. Your CEO then says, ‘OK, we’ll see you in 30 minutes then.’ Rather than
    having a heart attack at this point, the 4Mat system gives you a method for constructing
    a presentation almost off the cuff. And, if that’s not enough, the 4Mat system
    is also structured to appeal to all learning styles.


    # What is the 4Mat system all about?


    The 4Mat system comes from a study of different learning styles by Bernice McCarthy.
    She noticed that children in school learned in four different ways. Some children
    wanted reasons. They were always asking the question ‘why’. Some children wanted
    the facts. They were always asking the question ‘what’. Some children wanted to
    experiment and try things out. They asked the question ‘how’. Finally, some children
    wanted to explore the future consequences of doing something. They asked the question
    ‘what if’. Bernice noticed that most teaching was done only in the ‘what’ category.
    Many presentations today also follow this same pattern. The percentages of people
    in the US falling into each category are shown in the table.'
  merge: -1
  pgno: 292
- img_proc: true
  md: '# 266 Change Your Business with NLP


    | 4Mat | Learning style | Percentage |

    |---|---|--|

    | Why? | Discussion | 35 |

    | What? | Teaching | 22 |

    | How? | Coaching | 18 |

    | What if? | Self-discovery | 25 |


    In any audience, there will be a mix of preferences. By bringing it down to these
    four simple, basic questions, answered in the order shown in the table, McCarthy
    found that motivation to listen and get engaged and learning was maximised. She
    found that it was by far the best to start with the ‘whys’ because, until you
    give people reasons why they should listen to you, they won’t engage or listen
    to the rest of the information. This is a major reason why so many people switch
    off in presentations today – they are all about the ‘what’ and nothing else. This
    because people need the information before going off and doing an exercise or
    thinking how they might apply something. Then do the ‘how’. During a training
    session this would be the exercises. In a business presentation, it might be about
    how your audience can implement what you have taught them back in the workplace.
    Finally, introduce the ‘what if’. This explores the consequences of doing or not
    doing what you have been discussing. Right at the very start you also need to
    introduce a ‘little what’ which just sets the frame for the presentation. For
    example, today we are going to learn about the 4Mat System.


    # Exercise 45: How to use the 4Mat system


    Think about a forthcoming presentation you have diarised or similar. Plan it out
    using the 4Mat system. Make sure you really hook in your audience with the ‘whys’
    first. This is what really makes the difference.'
