  md: '# Constructing High-performing Teams 97


    # Internal people


    Internal people evaluate things on the basis of what they think is appropriate.
    They provide their own motivation and make their own decisions. They decide what
    they want to do and how they will go about it. They will buy an article of clothing
    they think looks good on, not what the fashion magazines say. They have difficulty
    accepting other people''s direction and feedback. They may gather information
    from others, but they decide what to do about it. It''s useful to emphasise how
    your goals are aligned with theirs.


    It''s best to emphasise that the person will ''know inside'' what is best. Stress
    that they have to decide. It is best to avoid telling them what other people think;
    rather, talk about what they think. Help them to clarify their thinking. Ask how
    you can assist them in deciding.


    Key influencing words and phrases include: only you can decide, you decide, it''s
    up to you.


    # External people


    External people tell you that they know because other people or external sources
    tell them. Other sources provide the information which they then accept. They
    may describe incoming information as if that information is a decision. They need
    external standards and feedback.


    These people need to be managed. They need to know what to do and how to do it.
    They need development feedback and praise. Those with extreme scores (i.e. 5s)
    will stress if they do not get that feedback.


