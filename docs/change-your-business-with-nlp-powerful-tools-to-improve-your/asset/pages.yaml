  md: '170 Change Your Business with NLP


    Hiatt and Creasy said that: ‘Change leaders must be conscious of both sender’s
    message and a receiver’s interpretation.’


    Change leaders often make the common mistake that their staff attach the expected
    meaning to their communication. They believe that because something has been communicated
    it has been understood. This very often is simply not the case. The Meta Model
    enables us to check and challenge what staff say by using a series of powerful
    Meta questioning techniques. We are going to practise that the Meta Model questions
    in the context of a change process – though it is a model that can be used in
    any communication interaction.


    The Meta Model was NLP’s first language model. It was modelled and then further
    developed by Fritz Perls and Virginia Satir. The Meta Model’s patterns were designed
    for the express purpose of challenging the limitations in the mental maps of others.
    Grinder said that the Meta Model pattern consisted of two components – the identification
    of the pattern and the challenge question/s designed to help that individual expand
    his or her map of possibilities. Put simply, the Meta Model is designed to recover
    information and new choices that the receiver has not yet noticed because of the
    way that they experience the world. For example, a staff member who believes their
    job to be at risk is likely to filter any communication through a mental map which
    is anxious, suspicious and fearful. We can use the Meta Model questions to help
    them notice other positive possibilities.


    # The patterns


    Here are the major patterns put into the context of a change programme. The table
    below shows the pattern and its ‘formal’ name, the impact it has, the challenge
    question to expand awareness of the receiver and the impact that we intend to
    have on them.'
