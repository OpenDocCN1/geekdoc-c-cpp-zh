  md: '# 216 Change Your Business with NLP


    meaning (as the listener). Style, expression, tonality, facial expression and
    body language accounted for 93% of the meaning inferred by the people in his studies.
    In fact, he discovered that words account for 7%, voice tonality 38% and body
    language 55%. Voice tonality and body language taken together 93%. So, if I tell
    you I''m really excited about something but I''m talking in a slow monotone voice,
    and if I''m slumped in a chair looking bored as I talk, you are likely to put
    far far more faith in the tone of my voice and my body language than you are in
    my words.


    This is really important for virtual teams where most of the communication is
    by email. Remember that up to 93% of the impact can be lost because your team
    members do not have the added advantage of checking what is being said against
    body language and tonality, etc.


    Let''s explore the different channels of communication available to a virtual
    team:


    +   **Email.** This is the most popular channel for virtual teams as it gets over
    the time zone issue. Yet the risks are whether the receiver has actually understood
    what you meant. Much mis-communication comes from emails. They are full of ambiguities
    and mind-reads that lead to chaos. So, what to do? It''s important to check understanding
    and interpretation of your instructions, preferably via a telephone call. Ask
    questions such as ''what did they understand by your email?'' ''What specific
    actions are they going to take as a result?'' ''What is the deliverable they will
    send to you?'' and so on. Checking understanding will save lots of errors and
    frustration in the long run. You cannot assume just because you have sent an email
    that you will get back what you want. Remember, it''s your responsibility to check
    interpretation.'
