  md: '130 Change Your Business with NLP


    In NLP, the ‘Hierarchy of Ideas’ is a linguistic tool that allows the user to
    move through and between different levels of abstraction from the vague and ambiguous
    to the concrete and specific. Albert Einstein said that: ‘Problems cannot be solved
    at the same level of awareness that created them’.


    The ‘Hierarchy of Ideas’ assists you to move into different levels of awareness
    for problem-solving purposes. The basic principle is that, as you get more and
    more abstract with your language and concepts, you deal with larger and larger
    chunks of data. As you get more concrete, you deal with smaller and smaller chunks
    of data. Imagine an hierarchy of ideas or concepts with the most abstract at the
    bottom and all-embracing at the top and the most concrete at the bottom. When
    you ‘chunk up’, you move up the hierarchy of ideas. When you ‘chunk down’, you
    get more and more concrete.


    # The Hierarchy of Ideas


    Let’s take the car as an example. The word ‘car’ is at a particular level of abstraction.
    If you want more information about the type of car, price, reliability, etc. you
    need to begin to ‘chunk down’ on the word ‘car’ as you move to a lower level of
    abstraction – something more concrete and specific. You can do this by asking
    questions such as:


    +   * What are examples of this?


    +   * What specifically?


    So if the subject of the communication was ‘car’ you might ask ‘What type of car
    specifically?’ and chunk down to Ford. If you require further detail you could
    chunk down one more level by asking something like ‘What model of Ford specifically?’
    and you might get a response of ‘Capri’ as in the example overleaf (that’s showing
    my age!).'
