  md: '# The presenter state


    The aim of the ''presenter state'' is to be totally present in the moment and
    to feel calm and balanced on the inside, ready for anything. I was taught the
    ''presenter state'' when I trained as an NLP trainer and I have it ever since
    to prepare for every training and presentation that I have done. A few months
    ago, I was facilitating a day-long conference with 350 people at the famous Butlins
    holiday camp at Bogor Regis. I loved every moment and was surprised at the number
    of senior managers terrified at the point they were about to go on stage. I taught
    a few of them this technique literally moments before they were due to start.
    I learned it up more fully in his book (written with Tad James) called Presenting
    Magically.


    # Exercise 42: How to get into the presenter state


    Spend a few moments before your next presentation practising these steps. It only
    takes a few moments.


    +   Step 1: Put any other thoughts or issues out of your mind. For example, if
    you''re worried about the row you had with your partner before you left for work,
    put it to one side so that you are totally present in this moment and are aware
    of what is happening around you.


    +   Step 2: Now get physiologically comfortable. You should be standing upright
    with your energy centred. To do this, bring your attention to the area below your
    belly button. Relax your hands down by your sides and have your feet shoulder
    width apart. Make sure you are balanced in your weight distribution and your physiology
    is symmetrical, i.e. as if you were standing on a pair of scales and each half
    of you weighs the same and is a mirror image of the other half.'
  merge: -1
  pgno: 288
- img_proc: true
  md: '# 262 Change Your Business with NLP


    **Step 3:** Get your breathing under control. Take a deep breath in through your
    nose and out through your mouth then breathe normally.


    **Step 4:** Now put your awareness inside of yourself for a few moments. Notice
    what you notice, Focus on the presentation going perfectly.


    **Step 5:** Bring your awareness back outside into the room and find a spot on
    the wall to focus on. Put all your attention on that spot and while you do expand
    your awareness to fill the room. Notice that in your peripheral vision you can
    see everyone and everything in the room though you are still focused on that spot.
    Take your awareness to all four corners of the room, even behind you.


    **Step 6:** Notice that you can see every small movement that your audience makes
    whilst in this state. Now as you feel at one with the group, bring your eyes down
    and look at the group.


    **Step 7:** Notice that you can make eye contact with individuals whilst remaining
    in peripheral vision. That keeps your awareness in the whole room. Notice how
    everything begins to flow as you feel at one with the room.


    **Step 8:** Now begin....


    The presenter state works because going into and staying in peripheral vision
    keeps the body in a state of *parasympathetic arousal*. This is the ''rest and
    digest'' state and keeps the body calm. This is the opposite of the state of *sympathetic
    arousal* or the ''fight or flight'' response. This might feel strange at first
    but keep practising it because it works.


