    # What is NLP?


    For those of you who are wondering what NLP is all about, now''s your chance to
    find out more and to understand why I’ve chosen it as the technology of change
    used in this book.


    NLP, or Neuro-Linguistic Programming, has proved a challenge to define neatly.
    Tosey and Mathison describe it as ‘a kind of reverse engineering, applied to human
    capabilities’.


    That’s because in the early 1970s, a linguist, John Grinder, and a mathematician,
    Richard Bandler, studied individuals who were excellent communicators and technicians
    of change. They started by asking a question: ‘What makes the difference between
    world-class and mediocre performance?’ They observed many world-class performers,
    including famous therapists, and discovered the beliefs, mindset and strategies
    which delivered their success. They explored both personal and professional example
    of change to discover the tools and techniques that delivered fast and sustainable'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'results. As a result, they formalised their change techniques under the name
    ‘Neuro-Linguistic Programming’, known as NLP, to symbolise the relationship between
    the brain, language and the body and the results that can be achieved. Tosey and
    Mathison made the point that:


    > NLP does not invent these patterns; it identifies them, strips them down to
    their essentials, sometimes refining and re-packaging them and makes them available
    for others to learn...it is a way of coding and reproducing excellence that enables
    you to consistently achieve the results that you want.


    NLP is very eclectic in that it draws from many diverse fields of practice. In
    his book, Whispering in the Wind, Grinder described NLP as having:


    > ...spread like wild-fire throughout the world...It [NLP] works across cultures,
    generations, age groups and fields of application. There are now hundreds of thousands
    of people in the world whose lives have been profoundly and positively impacted
    by the application of this pattern-called NLP.


    Why has it been so successful? Unlike other approaches that tell you what you
    need to do, NLP is a how to technology. It tells and shows you how to be the leader
    you want to be, have the business success you want to and spend your time doing
    the things you really want to do. For most people things happen and they react
    unconsciously out of their awareness. NLP offers a better way. It gives you the
    tools to react differently by choice, to be more aware of your thoughts, feelings
    and behaviour. And you then ready to take responsibility for your results in all
    areas of your life, not only your business life.'
  merge: -1
