  md: 'Because of their background in cybernetics the pre-suppositions give NLP a
    stronger theoretical foundation than is found in many other approaches to people
    development, including many forms of coaching. Though they are not claimed to
    be accurate statements about how the world ‘really’ is they encourage learning,
    responsibility, flexibility, focus, empowerment and choice. If you want to stand
    out from the crowd as a leader these will help you to achieve just that.


    # Thinking differently


    Here are some core structures or frames of NLP that are generally believed to
    develop empowering ways of thinking and behaving even further. You will not find
    these in any book written by Bandler and Grinder, but they are taught by a wide
    range of NLP Institutes. These frames are:


    +   - Cause vs Effect


    +   - Responsibility for Results


    +   - Perception is Projection


    # Which side are you on?


    Consider for a moment. How do you behave as a leader? Do you generally look on
    the positive side of whatever happens at work or do you focus on the negatives
