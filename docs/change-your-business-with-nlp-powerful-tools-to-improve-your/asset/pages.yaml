    # Define your stakeholder groups


    In any change process, and in particular a culture change, you have to decide
    whether you will achieve your changes through compliance or commitment. Both routes
    require investment. investment in processes to administer, monitor and, if necessary,
    enforce compliance. Commitment, on the other hand, needs investment in winning
    hearts and minds, in leaders'' time and in communicating with the workforce. Both
    routes have their place, and you must pick the right route for the change process
    to work. The route you choose depends on (a) the kind of change and (b) the level
    of commitment you need for the change to be successful. In culture, winning the
    hearts and minds of stakeholders is vital. Both incur cost, but at different stages.
    With compliance, heavy costs can occur later on, if old habits return. With commitment,
    costs occur early on through involving people, communications and stakeholder
    management.


    As a management consultant I was taught an effective way of defining stakeholder
    groups which you can work through now.


