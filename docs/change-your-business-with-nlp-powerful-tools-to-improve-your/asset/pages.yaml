  md: '# Change Your Business with NLP


    # External behaviour


    It’s often easier to start with the conscious part of their strategy. That means
    their external behaviour or what they do on the outside that you can observe.


    Ask them ‘what are you saying and doing’. Then compare this to what you actually
    observed. Check out any elements observed that they didn’t mention. These could
    be unconscious and/or idiosyncratic steps. Ask them to take you through how they
    use their posture and breathing. An excellent question to check out idiosyncratic
    steps is ‘would it still work if you didn’t “x”’


    # Internal process


    Then take them step by step through what they do. This will draw out the sequence
    of events or the strategy that makes up the activity.


    Ask them ‘what’s the very first thing that has to happen’, then ‘what’s the next
    thing’ and so on. Run through the strategy many times until you have the core
    components. Again, strip out the idiosyncratic steps.


    # Internal emotional state


    Finally, explore their internal emotional state which is likely to be the most
    unconscious part of their activity.


    Ask them questions like ‘what’s important to you at this time or about this activity?’
    to elicit their values. Then ask, ‘what do you believe about yourself/about others/about
    the situation in relation to this activity?’ Make sure you understand their model
    of the world by trying it on yourself to see if it makes sense.


    # Step 3 – Conduct a sensitivity analysis


    This will determine what’s critical in order to get the same result as the model.
    Start changing things to find out if they make any difference. This will also
    help to strip out the idiosyncratic steps. Find out if stripping any steps makes
    a difference in results. If it makes a positive difference, keep the step in.
    If it makes no difference, strip it out. The real art of modelling is to simplify
    the model to its minimum components whilst still maintaining the results.'
