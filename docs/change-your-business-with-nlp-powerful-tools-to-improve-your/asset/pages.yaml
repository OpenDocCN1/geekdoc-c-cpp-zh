  md: '# Visualising your success


    Imagine yourself in a year''s time having made all the changes you have committed
    to making. Notice what thoughts that image conjures up in your mind. What are
    you seeing yourself doing, hearing yourself saying and how are you feeling? Close
    your eyes if it helps to get a clearer image. Make sure that you are looking through
    your own eyes in the image that you have as opposed to seeing yourself in the
    picture. That makes the effect much more powerful. Notice how you can turn up
    the brightness of everything around. Pretend that your mind works like a television
    set and you can adjust the brightness and colour controls. What sounds are associated
    with your image? Again, turn up the volume control on your TV set and hear what
    others are saying about you and what you are saying to yourself. Notice the feelings
    that your thoughts create inside you and turn up those feelings to double or triple
    intensity. You can do this by just turning your attention onto those feelings
    are located in your body. Notice well, if those feelings are moving around. If
