  md: '# About the author


    ![](img/3708dd19448683bbfe24463ff23bf82c_338_0.png)


    Lindsey Agness is the best-selling author of Change Your Life NLP and Still 25
    Inside and an experienced NLP trainer. She began her career in local government
    before becoming a change consultant for one of the top global firms in 1994. She
    learned about the art of people change both from an organisational and individual
    level. She started her NLP journey in 1997 when she wanted to improve her own
    performance in meetings with large numbers of grey-suited men. In 2005, she founded
    The Change Corporation. She now spends her time on change projects, coaching senior
    executives, running open NLP programmes and public speaking. She is well-respected
    for getting results and improving performance. She also loves to write and enjoys
    the opportunity to share her insights and experiences with larger audiences. Her
    personal vision is to become a leader in the development field and to assist organisations
    and individuals to perform at their highest level.


    Originally from the East End of London, she now lives in Sandwich with her two
    children, Sophie and Oliver.


    www.thechangecorporation.com'
