  md: 'The ROTG represent the whole area beneath the water level or – as I call it
    – your business ‘immune’ system. Unless you are able to overwhelm its offences
    it will launch a counter-offensive which often wins. That’s why attempts at incremental
    change rarely work in culture change. If you go too slow the existing bureaucracy
    and resistance to change will cancel out all your efforts. You cannot change culture
    ac-cording to the old rules.


    # Moving an oil tanker


    I worked on a project some years ago now where attempts at changing engrained
    behaviours kept stalling. The consultancy team carried out research to uncover
    the real ‘ROTG’. It made interesting reading. The key rules were as follows:


    +   - We say we want simplicity and clarity, but the way we act (and what we really
    want) creates complexity


    +   - We are uncomfortable with conflict, and prefer comfort-able failure to uncomfortable
    success


    +   - At point of tension, we would rather focus on changing process than dealing
    with the people issues


    +   - A spirit of wanting to please, leading to ‘blind’ compli-ance with process


    The ROTG were undermining many of the change-atives that were being delivered
    at surface level. Leaders were giving up too easily at the first point of resistance
    because they were not comfortable dealing with people issues and conflict and
    they were used to quietly sweeping failures under the organisational carpet.'
