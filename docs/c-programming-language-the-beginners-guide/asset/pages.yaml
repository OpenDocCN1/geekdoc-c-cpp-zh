  md: '# The For keyword


    The for keyword is used for creating loops in your C code. Unlike the while loop,
    the for loop is setup on a single line, which makes it more cryptic. But it remains
    a more popular, or perhaps more traditional type of loop.


    ```

    1 #include 2

    3 int main()

    4 {

    5 int x;

    6

    7 for(x=0;x<10;x++)

    8 printf("%d\n",x);

    9

    10 return(0);

    11 }

    12

    13

    ```


    In this section, we discuss the for loop. We will see how to setup the loop, and
    understand its parts. A for loop is presented at line 7. The loop''s statement
    contains three parts, each separated by a semi-colon.


    First is the initialization. The statement is which is an assignment that is made
    at the start of the loop. Second is the looping condition. The loop repeats as
    long as this condition is true: Finally, is the iteration statement. Each time
    the loop repeats, this statement is executed. Here, the value of x is incremented.'
