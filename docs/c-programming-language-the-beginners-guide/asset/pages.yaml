  md: '# Chapter 14: C Language Variables


    A variable is a container for some type of data. In the C language, that container
    holds an integer, floating point character or other value. But philosophically
    speaking, what actually is a variable? In this chapter, we help you explore the
    concept of the variable. You''ll see various ways a variable is described, how
    to determine its size, and its storage location.


    In the typical C language variable declaration, you learned two tidbits about
    the variable: its type and its name. Below, you see an integer variable declared:


    ```

    ```

    1 #include 2

    3 int main()

    4 {

    5 int a;

    6

    7 printf("The value of a is %d\n",a); 8

    9 return(o);

    10 }

    11

    12

    ```

    ```


    It is an integer variable and its name is The variable is uninitialized, or never
    assigned a value. Even so, you can use it in the code, as is shown in line 7.
    Build and run this program. On your end, you might see any random value. Unlike
    other programming languages, C does not initialize variables as they are declared.
    Internally, the program allocates a chunk of memory to store the variable''s information.'
