  md: '# **Anatomy of an Array**


    An array is simply a collection of multiple variables—all of the same type. It
    has a declaration similar to any other variable, but with square brackets after
    the variable name. The brackets hold the number of elements in the array. They
    can be blank if the elements are specified when the array is declared. Below,
    the integer array DELIVERIES has room for fifteen elements.


    ```

    ```c

    int deliveries[15];

    ```

    ```


    Integer array TOTALS has three elements, which are assigned in curly brackets.


    ```

    ```c

    int totals[] = { 5, 13, 6

    ```

    ```


    The final element does not have a comma. If you put a comma there, the compiler
    believes that you have forgotten something. You can also list array elements on
    a line by themselves. Except for the final element, don''t forget to put the commas.
    Remember to close the curly bracket and add a semi-colon.


    Each element in the array is its own variable. You specify the element between
    the square brackets. The first element is element You can also use an integer
    variable to specify array elements. Below, variable n represents a specific element
    in the totals array:


    ```

    ```c

    printf("%d\n",totals[n]);

    ```

    ```


    The element is used like any other variable. It can find itself inside a printf
    function, or it can be used with an assignment operator as shown below:


    ```

    ```c

    totals[n] = 14;

    ```

    ```'
