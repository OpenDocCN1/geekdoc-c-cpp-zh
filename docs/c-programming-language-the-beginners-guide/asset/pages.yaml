  md: '# Chapter 10: C Language Constants


    Occasionally, when learning something new, you need to pause and reflect. That''s
    the topic of this section: pausing and reflecting specifically, with regards to
    variables and values. We''ll also introduce a few new concepts—things we feel
    it''s about time you knew, especially if you''re new to learning the C programming
    language. In this section we cover creating and using constants. Plus, we''ll
    also discuss some of the printf function''s placeholders.


    A constant in the C language is different from an immediate value and a variable.
    It is more like a universal value that doesn''t change throughout the code. Constants
    are values used consistently throughout your source code.


    There are things that do not change. They are created by the preprocessor #define
    directive. Normally the constant is written in all caps, one word, or with underlines
    only. Now when the compiler encounters a constant, it expands it out to its assigned
    value.


    In the example below, the constant version is created and it is assigned to the
    value The compiler converts the word version into the immediate value 3 throughout
    the code.


    ```

    #define VERSION 3

    ```


    +   - Constant is named VERSION

    +   - Has a value of 3

    +   - Does not end with a semi-colon'
