- pgno: 8
  md: '# Introduction


    Thank you for buying this book: The C Programming Language – The Beginner''s Guide.
    In this book, we are going to give you an overview of the concepts that you have
    to understand before you actually start programming in the C language. We will
    explain to you the different elements that you ought to know about before you
    go and delve into developing more complex programs for different operating systems.


    The C programming language has many benefits. However, it also has numerous little
    aspects that can leave you perplexed. Not being able to understand these aspects
    can definitely cause you problems in the future.


    In this book, we''re going to talk about what those elements are. We are also
    going to talk about what C is, where it came from, and all of the fundamental
    concepts that you have to understand before you actually start programming. In
    addition, we''ll also teach you how to setup and use the Code Blocks IDE, which
    will help you greatly when programming in the C language.


    We hope you enjoy this book.'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# Chapter 1: Introduction to C Programming Language


    Like anything new when you set out to do programming, you find yourself surrounded
    with strange and potentially weird terms, and fancied jargon. In this book, we’ll
    review those terms as well as present an overview of the entire programming process.
    It is very likely that you’re eager to get started with writing codes, and you
    may have already viewed a later chapter in this book. It is important to know
    a few key terms and programming concepts.'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# History of C Programming Language


    Back in 1972, a computer scientist at AT&T''s Bell Laboratories started to develop
    some programs he needed for his own use. What Dennis Ritchie started developing
    then has evolved into the C programming language, which by now is widely used
    around the world.


    He was trying to make computing as simple as possible. Dennis Ritchie realized
    that the then-current assembly language were much too complex. They attempted
    to reverse this trend by building a small, simple programming language on a minicomputer.


    What Dennis Ritchie wanted to maintain was not only an efficient computer programming
    language in which to create programs, but also a computer programming language
    around which programming community could form—fellowship. They knew based from
    previous experiences that the real nature of joint computing as provided by time-shared,
    remote accessed systems is not just to enter computer code into a terminal, but
    to motivate post programming communication.


    The C programming language is a general purpose and structured programming language.
    It is also called a procedural oriented programming language.


    C is not specifically designed for specific application areas. However, it was
    well suited for business and scientific applications. It has various features
    like control structures, looping statements, and micros required for applications.
    The C language has the following features:


    +   - Portability'
  merge: -1
  img_proc: true
- pgno: 11
  md: '+   - Flexibility

    +   - Effectiveness and Efficiency

    +   - Reliability

    +   - Interactivity'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# What is Programming?


    Programming is where you create software. Software controls hardware, which is
    the physical part of an electronic device such as a computer, phone, tablet, gaming
    console, micro-controller or some other gizmo. Those instructions take the form
    of a programming language. For this book, that language is the C programming language,
    which was developed back in the early 1970s.


    It is very old. In fact, over time the C programming language has been considered
    the Latin of programming languages. Unlike Latin, C is not dead. Lots of C programming
    still goes on despite of newer and fancier programming languages coming along.
    But like Latin, C is the foundation upon which many other programming languages
    are built. If you know C, you can more easily learn those other languages.


    In a later chapter, we will talk about the programming language''s syntax and
    other rules. But for now, know that the code you write is called a source code.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# What is a Source code?


    A source code is a plain text file that contains the programming language, all
    formatted and pretty and written properly. In C, the file is saved with a .c filename
    extension. To create a source code, you use a text editor. Any text editor can
    do, although some editors offer helpful features like color coding, line numbers,
    syntax checking and other tools.


    The source code is then compiled into object code. The program that creates the
    object code is called a compiler. The traditional name of the C language compiler
    is CC, which stands for C compiler. The compiler reads the source code file and
    generates an object code file.


    Object code files have a .o filename extension, and they use the same filename
    as the original source code file. The next step is called Linking. It is often
    forgotten because modern compilers both compile and link, but linking is really
    a separate step.


    The linker takes the object code file and combines it with C language libraries.
    The libraries are the workhorse of the language. They contain routines and functions
    that control whatever device you are programming. If all goes well, the end result
    is a program file. You can then test run the program to make sure that it works
    the way you want it to. And if not, you start the cycle all over again: edit,
    compile and link, or “build,” and test run.


    All of these tools—the editor, compiler, linker—all originated at the command
    prompt or terminal. You can still find them there too. Programmers do a lot of
    coding at the command prompt'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'because it is quick. More common, however, is to use an IDE, or

    Integrated Development Environment.'
