- pgno: 35
  md: '# **Chapter 3: The Old I/O**


    The best way to get started on your programming journey is to write some simple
    programs that are easy to understand and change. To handle that task, it helps
    to know the basics of input and output, or I/O.


    In this chapter, we introduce you to the concept of I/O, and how that plays into
    programming. You will get to explore some basic I/O functions, and use one of
    those functions to create tiny programs that output interesting text.


    A program has to do something. That something involves taking input and generating
    output. This is how a typical C program works: it''s a machine that does something
    to input, and then generates output.


    ![](img/7d7500a0ed1507e3351945dfe5a0440d_35_0.png)'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'If the program does not do anything, then it is basically plumbing; what comes
    in, goes out. The C library offers a host of output functions. Of the lot, these
    three are the most popular. They are:


    +   - `printf()`

    +   - `putchar()`

    +   - `puts()`'
