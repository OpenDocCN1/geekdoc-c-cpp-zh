  md: "The terms \"Interoperability\" and \"Coexistence\" are sometimes used in place\
    \ of \nmigration but are different concepts:\n\nInteroperability is the ability\
    \ of two systems to understand each other and, therefore, be \nable to exchange\
    \ information. For example, two different e-mail servers may be able to \nexchange\
    \ mail messages thanks to Simple Mail Transfer Protocol (SMTP).\n\nCoexistence\
    \ is the ability of two systems to operate on the same resource. For example,\
    \ \ntwo different file systems can both be installed on the same computer, but\
    \ they cannot read \neach other's files. A system that can read from or write\
    \ to both file systems provides a \nmigration path.\n\nA migration strategy should\
    \ consider:\n\n+   - Data Migration\n+   - Application Migration\n+   - User Migration\n\
    \n![](img/7d7500a0ed1507e3351945dfe5a0440d_60_0.png)\n\nMigration should not be\
    \ confused with new development. And other concepts and \nprinciples should also\
    \ be considered in a migration roadmap:\n\n+   - Keep it simple\n+   - Methodology\n\
    +   - Simplicity, Openness, Scalability (SOS)\n\nNote: The figure shows a flow\
    \ from Legacy Infrastructure to Target Infrastructure via a \nMigration Factory."
