    the first dimension, which is done on line 14. Build and run the code. The C language
    also offers three-dimensional arrays, and even more dimensions than that. When
    you create such an array, you need one set of brackets for each dimension. Things
    can get pretty complex in a hurry. For now, concentrate on playing with two- dimensional
    arrays.


