  md: '# # The `scanf()` Function


    To fetch a string from standard input, use the *scanf()* function. As an input
    function, *scanf()* is declared in the *stdio.h* header file, which you must include
    in your code, lest the compiler becomes confused.


    *Scanf()* uses placeholder to read a specific value into a variable, and that
    variable is often prefixed with the ampersand symbol. Here’s the format for the
    *scanf()* function:


    ```

    scanf("forat", &variable);

    ```


    It includes two arguments: a formatted string and a variable. The formatted string
    directs *scanf()* to look for a specific type of value. To accomplish this, you
    specify the same placeholder used with the *printf* function inside the formatting
    string. %d for an integer, %c for a character, and so on. The formatting string
    is almost always composed of these placeholders and nothing else.


    To assign a value, specify the variable that’s already been declared in the code.
    The variable type must match the placeholder. You need to prefix an ampersand
    symbol to the variable name, which is something you must remember to do. You do
    not need to prefix the ampersand to a string or array, which is something you’ll
    forget to do. The ampersand used here is the memory location operator, which is
    covered in a later chapter.


    The code below demonstrates how to read an integer value from standard input:


    ```

    ```c

    #include


    int main()

    ```

    ```'
