- pgno: 29
  md: '# Functions


    The real workhorses of the C language are functions. What the keywords do is really
    basic. To do more in C, you rely upon a function. The functions are held in libraries.
    The linker''s job is to combine the library with your program''s object code;
    knitting the two together to make a program.


    To use a function in a program, you must incorporate a header file, which defines
    the function. You will see how that''s done in the later chapters.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# Operators


    Operators are symbols used to manipulate data in the program.

    These include the traditional math operators, as well as a host of other special
    symbols.


    +   - Mathematical: +-/*%++—

    +   - Comparison: == != > <

    +   - Assignment: = += + *= /=

    +   - Logical: && || !

    +   - Bitwise: & | ^ << >>

    +   - Unary + - ~ ! *


    # Values and Variables


    Values and variables are similar. Values include characters and numeric values.
    The numeric values are divided between integers or whole numbers, and floating-point
    values which contain a decimal part or fraction. All of them can be very, very
    large values, or very, very small values.


    A variable, on the other hand, is a container for a value. Its contents can change
    or vary, which is why they are called variables. The values that go into the variables
    are the same types of values you use directly in a program.'
  merge: -1
  img_proc: true
