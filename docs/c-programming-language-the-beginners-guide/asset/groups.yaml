    # Chapter 6: Math Operators


    The important thing to remember when it comes to math and programming is that
    the computer does the work. You just have to copy the equation down properly.
    To do so, you need to know a few math operators, plus some other C language rules
    and procedures. In this chapter, we will review the basic Math operators and how
    they are used. Also explored are the increment and decrement operators, plus a
    few notes on the order of precedence, which determines which part of an equation
    is evaluated first.


