    \ 2.0 提升到 8 次幂。结果保存到浮点变量 p 中，然后在第 10 行打印出来。构建并运行这段代码。\n\n2 的 8 次幂是 256。一般来说，所有\
    \ C 语言数学函数都需要包含 math.h 头文件。它们都处理实数。我们在前面的示例中使用了浮点数，但正式来说它们应该是 double 类型变量。double\
    \ 的精度是 float 的两倍。这意味着它更准确。但只有在需要更高精度时，才真正应该使用它。\n\n另一个常用函数是 *rand*，尽管它并不是真正的数学函数。它生成伪随机数。之所以称为“伪”，是因为这些数可以被预测。不过，从一般意义上说，它们仍然足够随机。*rand*\
    \ 函数需要 stdlib.h（即标准库头文件）来提供其定义。这是仅次于 stdio.h 的最常见头文件。看看下面的代码：\n\n```c\n#include\
    \ <stdio.h>\n#include <stdlib.h>\n\nint main()\n{\n    int r;\n\n    r = rand();\n\
    \n    printf(\"%d is a random number.\\n\", r);\n    return(0);\n}\n```\n\n该函数本身不需要参数。它只是生成一个随机整数值。这个值保存在上面代码第\
    \ 8 行的变量 r 中。第 10 行的 printf 函数显示结果。构建并运行这段代码。\n\n为了让 rand 函数发挥最佳效果，你必须为随机数生成器“播种”。那是一个生成随机数的软件机制。随机播种函数称为\
    \ *srand*，它也定义在 stdlib.h 头文件中。在代码中，把 srand 函数插入到 rand 上一行，如下所示：\n\n```c\n#include\
    \ <stdio.h>\n#include <stdlib.h>\n\nint main()\n{\n    int r;\n\n    srand(66);\n\
    \    r = rand();\n\n    printf(\"%d is a random number.\\n\", r);\n    return(0);\n\
    }\n```\n\n*srand* 函数需要一个正整数参数来为随机数生成器播种。在我们的示例中，我们使用数字 66。保存更改，然后构建并运行代码。这一次会出现一个新的随机数。但是，当你第二次运行代码时，会出现相同的值吗？继续试试看。\n\
    \n最可能的情况是，你会看到相同的数字。别慌，你的代码没有问题。你有几种工具可以重新为随机数生成器播种。一种方法是在程序启动时要求用户输入一个正整数值。大多数程序员的做法是借用计算机内部时钟当前的滴答值。我们将在后面的章节中介绍时间函数。现在，我们需要修改代码第\
    \ 8 行，把值 66 替换为一个时间函数。\n\n我们需要在括号中输入单词“unsigned”，然后是 time 函数，接着在其括号中放入全大写的单词“NULL”，如下所示：\n\
    \n```c\n#include <stdio.h>\n#include <stdlib.h>\n#include <time.h>\n\nint main()\n\
    {\n    int r;\n\n    srand((unsigned)time(NULL));\n    r = rand();\n\n    printf(\"\
    %d is a random number.\\n\", r);\n    return(0);\n}\n```\n\n确保所有括号都配对。是的，这看起来很奇怪。但括号配对很重要：一对括号括住“unsigned”，一对括号括住“NULL”，然后再用一对括号括住整个内容，也就是\
    \ *srand* 函数。\n\n这个函数的作用是从计算机时钟获取当前的滴答值。它是一个不断变化的数字。保存代码并运行。现在你会看到一个不同的值。再次运行代码。这一次你会看到另一个新值。如果结果值彼此接近，不要感到惊讶。请记住，它基于计算机时钟的“秒”值，而这个值全天都在递增。\n\
    \n为什么随机数如此重要？因为随机数是让所有计算机游戏变得有趣的关键。\n\n## 第7章：C语言比较\n\n通常，程序会按照语句在源代码中出现的顺序逐行执行。改变这个顺序就是改变程序的流程。C\
    \ 语言中最常见的流程控制词之一是 *if*，它类似于人类语言中同样称为 *if* 的对应词。在本章中，我们将向你介绍 if 关键字。你还会了解 C 语言中如何进行\
    \ 比较，以及如何处理多个决策。\n\n### if 语句\n\n在使用 *if* 关键字之前，你必须了解 C 语言中的比较是如何进行的。程序会对两个值或表达式进行求值。要进行这种求值，你需要使用\
    \ C 语言的一种比较运算符。以下是最常见的比较运算符：\n\n- `==` “等于”\n- `>` “大于”\n- `<` “小于”\n- `<=` “小于或等于”\n\
    - `>=` “大于或等于”\n- `!=` “不等于”\n\n看看下面的代码：\n\n```c\n#include <stdio.h>\n\nint main()\n\
    {\n    int a;\n\n    printf(\"Type an integer: \");\n    scanf(\"%d\", &a);\n\
    \    printf(\"You typed %d.\\n\", a);\n    if (a > 10)\n        printf(\"%d is\
    \ greater than 10.\\n\", a);\n\n    return(0);\n}\n```\n\n程序会提示用户输入一个整数值。该值在第\
    \ 9 行显示。在第 10 行，if 语句会对该值进行求值。如果该值大于 10，则执行第 11 行。否则，跳过第 11 行。现在构建并运行这段代码。\n\n\
    输入任意整数值。为了这个示例，我们输入数字 12。如你所见，它奏效了。输出显示了第 11 行所指示的 printf 语句。现在尝试输入一个小于 10 的值。如你所见，程序会终止，并且第\
    \ 11 行被忽略。\n\n传统上，if 语句的格式与其他语句不同。它会拆分到两行或多行中。第一行在括号中设置 if 条件。如果该条件求值为真，则执行下一行。实际上，它只是一条语句拆分到了两行中。请注意，分号位于第\
    \ 11 行末尾，而不是第 10 行末尾。\n\n你也可以把它写成一行，但这并不常见。更常见的做法是把属于 if 的语句用花括号括起来，如下所示：\n\n\
    ```c\n#include <stdio.h>\n\nint main()\n{\n    int a;\n\n    printf(\"Type an\
    \ integer: \");\n    scanf(\"%d\", &a);\n    printf(\"You typed %d.\\n\", a);\n\
    \    if (a > 10)\n    {\n        printf(\"%d is greater than 10.\\n\", a);\n \
    \   }\n\n    return(0);\n}\n```\n\n"
