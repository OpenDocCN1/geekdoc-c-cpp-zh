    8     blorf();\n9     blorf();\n10    puts(\"Thanks, blorf()\");\n11\n12    return(0);\n\
    13 }\n14\n```\n\n保存、构建并运行代码。如你所见，输出出现了两次。原型的作用类似于函数的定义，在函数出现在代码中之前描述如何使用它。你可以省略指定原型，但前提是在使用函数之前先编写该函数。要看一个例子，看看下面的代码：\n\
