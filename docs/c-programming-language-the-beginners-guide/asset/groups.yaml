  mdcn: "\n## 第11章：C语言数组\n\n数组就是多个相同类型变量的集合。例如，一份高分列表就是一种数组；你每天跑多少英里也可以构成数组，即使这个列表里有很多零。当然，C语言中的字符串就是由单个字符变量组成的数组。\n\
    \n在本节中，我们将介绍数组的概念。你将了解如何创建数组、如何用数据填充它、如何访问其中的数据，我们还会揭示一些关于字符数组（也就是字符串）的秘密。下面展示了在代码中处理多个值的错误方式——创建了四个独立的\
