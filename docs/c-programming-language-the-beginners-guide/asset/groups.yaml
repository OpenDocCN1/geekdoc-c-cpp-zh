    ## Chapter 15: C Language Pointers


    Pointers are scary. Yet, we hope this section clears the air for you. We''ll discuss
    what a pointer is and how it is used. We promise to move nice and slow because
    this topic is a very important part of learning the C language.


    The worst thing about pointers is their name. Pointers. It is descriptive, but
    a poor choice because you end up explaining a pointer by saying, “A pointer, points.”
    That’s pointless. But we can’t change the name, so allow us to explain a pointer
    by giving you this definition: A pointer is a variable that holds a memory location—an
    address.


    It is not just any address. You can’t say, for example, “Let’s see what’s at memory
    location 96.” Pointers do not work that way. The address must be the location
    of another variable. Pointer variables are declared similarly to other variables,
    although the variable name is prefixed by the pointer operator asterisk ‘ * ’.


    The pointer variable type matches the type of variable it references. For example,
    an *int* variable requires an *int* pointer. Pointer variables must be initialized
    before they are used. This is true of all the variables in the C language, but
    especially so for pointers. Lots of weird errors happen when a pointer isn''t
    initialized.


    We can’t repeat it enough: Pointers must be initialized before they are used.
