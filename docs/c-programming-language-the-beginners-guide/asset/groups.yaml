    \n第 8 行调用该函数。它没有参数，因此括号为空。函数本身位于第 14 行。这实际上是对原型的重复，只是去掉了分号。属于该函数的语句包含在花括号中。现在构建并运行代码。\n\
    \n要再次调用该函数，只需再次指定它。将第 8 行复制到第 9 行。\n\n```c\n1 #include <stdio.h>\n2\n3 void blorf(void);\n\
