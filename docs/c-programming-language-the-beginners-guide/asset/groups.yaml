    ## Chapter 5: Character I/O Functions in C


    Programs are both known for input and output. Output goes to the standard output
    device, which is usually the screen or terminal window. Input comes from the standard
    input device, which is normally the keyboard. In this chapter, we''ll explore
    input and output concepts in C. These involve character I/O, which is the reading
    of single characters, as well as the output of a single character. We''ll also
    touch upon the concept of stream input and output.


    The two most common C language character I/O functions are *getchar()* and *putchar()*.
    *getchar()* fetches the standard input. *putchar()* sends a character to standard
    output. Both of these functions require the inclusion of the stdio.h header file
    for their prototypes and such.


    Although they are character functions, they work with integer values. Yes, that''s
    weird, but so are many things in the C language. In fact, you may find yourself
    frequently using *char* variables with these functions. When you do, the compiler
    may gently warn you about the mistake. Finally, these functions are stream oriented,
    which is something we''ll discuss in the later chapters.


    Take a look at the code below:


    ```c

    1 #include <stdio.h>

    2

    3 int main()

    4 {

    5 int c;

    6

    7 printf("Type a letter: ");

    8 c = getchar();

    9 printf("You typed ''%c'':\n", c);

    10

    11 return(0);

    12 }

    13

    ```


    Integer variable `c` is declared at line 5. It is used with the *getchar()* function
    at line eight, storing a single character from the input stream. In this example,
    that would be a character typed at the keyboard. The character is displayed at
    line nine. The int variable `c` is used, but the character placeholder %c is specified.
    This ensures that the character is displayed, not its code value. Build and run
    the code.


    Note that the prompt in the output keeps the cursor at the same line, and we''ve
    added a space to make it more readable. Type a letter, such as a big letter ''Z'',
    and press the Enter key. As you can see in the output, it will immediately specify
    the letter that you typed.


