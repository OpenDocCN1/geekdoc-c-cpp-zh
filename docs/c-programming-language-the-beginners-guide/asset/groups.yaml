    ## 第 5 章：C 语言中的字符 I/O 函数


    程序以输入和输出著称。输出发送到标准输出设备，通常是屏幕或终端窗口。输入来自标准输入设备，通常是键盘。在本章中，我们将探讨 C 语言中的输入和输出概念。这些涉及字符
    I/O，即读取单个字符以及输出单个字符。我们还会涉及流输入和输出的概念。


    C 语言中最常见的两个字符 I/O 函数是 *getchar()* 和 *putchar()*。*getchar()* 获取标准输入。*putchar()*
    将一个字符发送到标准输出。这两个函数都需要包含 stdio.h 头文件以获取它们的原型等。


    尽管它们是字符函数，但它们处理的是整数值。是的，这很奇怪，但 C 语言中的许多东西也是如此。事实上，你可能会发现自己经常将这些函数与 *char* 变量一起使用。这样做时，编译器可能会温和地警告你这个错误。最后，这些函数是面向流的，这一点我们将在后面的章节中讨论。


