    \ it is also possible to set pointers inside arrays—a thought that's very frightening\
    \ to some. This section's main topic is how and why to put pointers inside an\
    \ array. Here, we'll discuss how to set up a pointer array in the C language.\n\
    \nFor the sake of simplicity, we'll utilize strings for our example. You'll learn\
    \ how to retrieve strings, transform them from one notation to another, and how\
    \ to evaluate strings. Pointer arrays are basically a stockpile of memory locations.\
    \ When and why would you require an array—a stockpile—of memory locations? Well,\
    \ one exemplary example is to make use of a string array.\n\nTake a look at the\
    \ code below:\n\n```c\n#include <stdio.h>\n\nint main()\n{\n    char *gang[5]\
    \ = {\n        \"Spanky\",\n        \"Buckwheat\",\n        \"Alfalfa\",\n   \
    \     \"Darla\",\n        \"Pete the Pup\"\n    };\n    int x;\n\n    for(x=0;x<5;x++)\n\
    \        printf(\"%p\\n\",gang[x]);\n\n    return(0);\n}\n```\n\nSave the change,\
    \ and then build and run the code. Now you see a series of memory locations. Because\
    \ the compiler allocated space for the strings and stuck null characters at the\
    \ end, each memory location does reference a string. By the way, this method of\
    \ storing multiple strings is far more efficient than declaring a two-dimensional\
    \ array.\n\nIn that case, you must declare the array so that each string occupies\
    \ as many characters of storage as the longest string. At our code's pointer array\
    \ declaration, that's not an issue. Take a look at the code below:\n\n```c\n#include\
    \ <stdio.h>\n\nint main()\n{\n    char *gang[5] = {\n        \"Spanky\",\n   \
    \     \"Buckwheat\",\n        \"Alfalfa\",\n        \"Darla\",\n        \"Pete\
    \ the Pup\"\n    };\n    int x;\n    char *cptr;\n\n    for(x=0;x<5;x++)\n   \
    \ {\n        cptr = gang[x];\n        while(*cptr)\n        {\n            putchar(*cptr);\n\
    \            cptr++;\n        }\n        putchar('\\n');\n    }\n\n    return(0);\n\
    }\n```\n\nThis code is another version of the previous example. Here, the for\
    \ loop moves through each pointer in the array. For each iteration, the pointer\
    \ variable cptr is assigned to the base address of each string. A while loop then\
    \ churns through the strings one character at a time. Build and run this code.\n\
    \nThe output is the same, although the method of printing each string was different.\
    \ Pointer variable cptr is used to display each character by walking through the\
    \ memory locations where the characters are stored. Now something might bother\
    \ you about this code. That's line 17, if you haven't picked it up already. It\
    \ uses array notation.\n\nA better solution would be to convert this heinous notation\
    \ into pointer notation. To do so, make this change to the code:\n\n```c\n#include\
    \ <stdio.h>\n\nint main()\n{\n    char *gang[5] = {\n        \"Spanky\",\n   \
    \     \"Buckwheat\",\n        \"Alfalfa\",\n        \"Darla\",\n        \"Pete\
    \ the Pup\"\n    };\n    int x;\n    char *cptr;\n\n    for(x=0;x<5;x++)\n   \
    \ {\n        cptr = *(gang+x);\n        while(*cptr)\n        {\n            putchar(*cptr);\n\
    \            cptr++;\n        }\n        putchar('\\n');\n    }\n\n    return(0);\n\
    }\n```\n\nThis notation uses the memory addresses stored in the gang variable.\
    \ The memory locations are used, not the string. Then the value x is added to\
    \ each, and each time the loop references the next array element, which is the\
    \ base address of a string. It has to be enclosed in parenthesis because the memory\
    \ location is manipulated first. Then the contents of that location—the asterisk\
    \ fetches the string—is referenced later. Save the changes, and then build and\
    \ run the code.\n\nAs you can see, the output is the same. More can be done with\
    \ pointers here, and we could broach upon the topic of pointers to pointers and\
    \ all double asterisk notation. But that's more of a topic for an advanced level.\
    \ In fact, here's a tip: When you see the dreaded double asterisk pointer notation,\
    \ it is almost always a sign that you're dealing with an array of strings, or\
    \ specifically, an array of memory locations for each of those strings.\n\n##\
    \ Conclusion\n\nThere you have it. That is all there is to the basics of C programming.\
    \ The only reason all of this is scary, and the only reason anybody is nervous\
    \ about programming in C, is because they do not have a firm foundation of the\
    \ basics of the C programming language. Once you understand the basic syntax and\
    \ various elements of C, it all gets exceptionally easy.\n\nThe topics covered\
    \ in this book, though they might seem complicated to you at this point, are just\
    \ pretty basic. We are confident that everything that we’ve covered in this book\
    \ will help you get a firm grasp of the basics of C. In addition, this book will\
    \ help you fully understand the more advanced levels of C language, such as object-oriented\
    \ C programming.\n\nWe would like to thank you for buying this book. We hope that\
    \ you learned a lot about the C programming language. Feel free to make this book\
    \ your beginner's quick guide as you explore the intricacies of this fantastic\
    \ programming language.\n\nAt this point, we would like to encourage you to tinker\
    \ and play around with the C programming language. Try making programs of your\
    \ own and see where it leads you.\n\nThe C language is truly an amazing programming\
    \ language. We hope that this book becomes your stepping stone into being a well-rounded\
    \ programmer.\n"
