    # Escape Characters


    There are some characters you just can’t put into a string. To sneak around this
    limitation, you use Escape characters. In the C language, a string is a bunch
    of characters held between two double quotes. Everything between the double quotes
    counts. But sometimes you can’t type a character such as the Enter key.


    For example, if you wanted to put the Enter key press between two words in a string
    and create a new line of text, the result would be two lines in the editor, not
    on the output. The solution is to use the ''\n'' character in the string. It is
    an Escape character, which means it starts with a backslash, and then followed
    by the letter ''n'' for newline. Take a look at the example below:


    “Behold! \n I am a string of text.”


    Together, the ''\n'' is interpreted as one character—a new line—and it is generated
    when the string is output. The C language uses about a dozen of Escape characters
    also known as escape sequences. The most common are:


    +   - \n – new line, to start a new line of text

    +   - \t – tab, to hop over so many spaces

    +   - \'' - escaped single quote

    +   - \" - escaped double quote

    +   - \\ - display backspace characters


