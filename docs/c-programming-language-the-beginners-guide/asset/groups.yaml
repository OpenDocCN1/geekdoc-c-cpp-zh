    ## Chapter 4: The C Language Variables

    ## 第 4 章：C 语言变量


    Programs work fine with immediate values. But oftentimes, you don’t know what
    the value is. Say the value comes from input, the user types it. It is read from
    a file or the Internet. To store such values, you need a specific cubby-hole or
    container. In programming, that container is known as a variable. In this chapter,
    we introduce you to the concept of the variable. It is a container into which
    you can store values—values that are unknown or values that can change.

    程序使用立即值工作得很好。但通常情况下，你不知道值是什么。假设值来自输入，用户输入它。它是从文件或互联网读取的。为了存储此类值，你需要一个特定的小隔间或容器。在编程中，该容器被称为变量。在本章中，我们向你介绍变量的概念。它是一个容器，你可以存储值——未知的值或可以改变的值。


    You’ll see how to declare a variable in the C language, and how a variable is
    used in the code. A variable is a container for a value. Because C deals with
    different types of values, a variable must be declared as a specific type. It
    is given a name—a name that’s used in the code.

    你将看到如何在 C 语言中声明变量，以及变量在代码中的使用方式。变量是值的容器。因为 C 处理不同类型的值，所以变量必须声明为特定类型。它有一个名称——在代码中使用的名称。


    In C, the variable type matches the variable’s content—the type of value being
    stored. Integer variables can hold only integer values or whole numbers. Float
    variables hold floating-point values, which are very large numbers, very small
    numbers, or numbers with a fractional part.

    在 C 中，变量类型与变量的内容相匹配——即存储的值的类型。整数变量只能保存整数值或整数。浮点变量保存浮点值，即非常大的数字、非常小的数字或带小数部分的数字。


    Character variables hold single values such as the letter ‘x.’ The C language
    lacks a string variable type. Instead, a character array is used. We’ll discuss
    how that works in a later chapter.

    字符变量保存单个值，例如字母 ‘x’。C 语言缺少字符串变量类型。相反，使用字符数组。我们将在后面的章节中讨论其工作原理。


