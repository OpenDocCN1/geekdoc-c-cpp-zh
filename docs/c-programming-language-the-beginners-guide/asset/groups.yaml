    \n## 第8章：函数剖析\n\nC 库中充满了函数。这些函数能做很多事情，但也许并不能满足你程序所需的一切。因此，在必要时，你可以自己编写 C 语言函数。事实上，大多数程序员都有几十个甚至几百个自己的函数。\n\
    \n在本章中，我们向你介绍函数。你将了解如何设置函数并为其声明原型，如何调用或访问函数，以及如何提前退出函数。就像 C 语言中的一切一样，函数有特定的风格，并且必须遵循各种约定才能将函数添加到代码中。\n\
