    使用时带有星号，所以它会查看该内存位置的内容。构建并运行这段代码。


    如你所见，指针变量 *p* 忠实地报告了正确的值：地址和内容。此时一个合乎逻辑的问题是：“为什么要费这个劲？”在这个层面上，使用指针相当“没有意义”。在C语言中，你可以做很多事情而不必理会指针，但它们确实有其用途。许多函数期望你理解并知道指针如何工作。


