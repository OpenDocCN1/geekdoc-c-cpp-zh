    ### 指针的双重性质


    虽然指针变量是通过使用星号来声明的，但并非总是那样使用。没有星号时，指针变量表示一个内存位置。有星号时，指针表示该位置处的值。这就是指针变量的双重性质。这一点可能会让人无休止地困惑。下面的代码类似于前面的示例，但我们将变量
    pokey 初始化为值 987：


