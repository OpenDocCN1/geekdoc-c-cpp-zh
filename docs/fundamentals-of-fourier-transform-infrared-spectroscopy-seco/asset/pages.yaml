  md: '182


    Glossary


    **Total Internal Reflectance:** Happens when a light beam in a material of high
    refractive index (medium 1) encounters a boundary with a medium of low refractive
    index (medium 2), and the angle of incidence is greater than the *critical angle*;
    all the light reflects off the internal surface of the medium 1.


    **Transmission Sampling:** A sampling method where the infrared beam is passed
    through a thin film of sample before impinging on the detector. Samples frequently
    need to be diluted or flattened to render them into thin form.


    **Transmittance, % Transmittance or Percent Transmittance:** Units used to measure
    the amount of infrared radiation transmitted by a sample. It is often used as
    the y-axis unit in *infrared spectra*.


    **Wavelength:** The distance forward traveled by a wave during a *cycle*.

    **Wavenumber:** Is defined as $1/wavelength$. The number of *cycles* a wave undergoes
    per unit length, commonly measured in units of $cm^{-1}$. The most commonly used
    as the x-axis unit in an *interferogram* in *infrared spectra*.


    **Wings:** The portion of the centerburst away from the centerburst where there
    is low infrared intensity.


    **Zero Path Difference (ZPD):** The condition when the *optical path difference*
    between the two beams in an interferometer is zero.'
