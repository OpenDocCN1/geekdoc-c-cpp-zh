    device called a beamsplitter. A beamsplitter is designed to transmit some of the
    light incident upon it and reflect some of the light incident upon it. In Figure
    2.2 the light transmitted by the beamsplitter travels towards the fixed mirror,
    and where the light reflected by the beamsplitter travels towards the moving mirror.
    Once the light beams from these mirrors travel back to the beamsplitter, where
    they are recombined into a single light beam that leaves the interferometer, interacts
    with the sample, and strikes the detector.


    How do the two light beams become into one at the beamsplitter? It is a property
    of waves that when superposed they will interfere with each other, which means
    their amplitudes add together to form a single wave. In a Michelson interferometer
    the light beams reflected from the fixed and moving mirrors interfere as follows:


    > $A_f = A_1 + A_2$


    Where


    +   - $A_f$ = Final amplitude

    - $A_1$ = The amplitude of the fixed mirror beam

    - $A_2$ = The amplitude of the moving mirror beam


    ![](img/d25eff8aaf4b0b214cf4015e62b7c990_34_1.png)


    **FIGURE 2.2** The optical diagram of a Michelson interferometer.'
