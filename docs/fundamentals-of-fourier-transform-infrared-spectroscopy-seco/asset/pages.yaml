  md: '# Proper Use of Spectral Processing


    if your search software HQI has a power of 10 as a perfect match (1, 100, 1000)
    it is possible to ascertain the overall quality of a match from the HQI. A hit
    greater than 0.8, 8, 80, 800, (depending on indexing system) is good and the two
    spectra being compared are very similar. It is possible to get a complete identification
    with a match of this quality. For medium quality hits (0.5 to 0.8, 5 to 50, or
    80 to 800, depending on indexing system) this means the spectra are somewhat similar.
    A complete identification is probably not possible for poor hits (0.5, 5, 50,
    or 500, depending on indexing system) the two spectra are quite different, and
    there is normally very little useful information available from such a low-quality
    match.


    Another thing to look at in a search report is the change in HQI for consecutive
    hits. Any change of greater than 10% from one hit to another is considered significant.
    For example, if two-consecutive hits had values of 95 and 92 (assuming 100= perfect
    match) they are ~3% different and for most purposes should be considered equally
    likely to be the best. On the other hand, if two consecutive hits had values of
    95 and 80, this is ~16% change. When there is a greater than 10% change in HQI
    between consecutive hits, it should be considered significant. An imaginary line
    drawn at the chart of HQI of >10% in a search report can be used to divide hits
    into different quality classes. The hits above this line are more likely to provide
    a good match than the hits below this.


    What would you do about search results? You could panic, but that is not an appropriate
    response for a scientist. The answer is to experiment with the search parameters.
    Changing search algorithms, adjusting the spectral regions included in the search,
    or searching different libraries. The probability of finding a library spectrum
    similar to your unknown increases with the number of spectra you search against.
    Ultimately, though you need to realize that if there are no spectra similar to
    your unknown you will get poor HQIs regardless of what you do. The best way around
    this problem is to have access to a large number of library spectra.


    # VIII. ANALYSIS OF MIXTURES: SUBTRACT AND SEARCH AGAIN


    A powerful way of using a library search to analyze mixtures is to combine it
    with spectral subtraction in a technique called subtract and search again, which
    works as follows. First, a library search allows you to identify one of the components
    in the mixture. Ideally, this can be done if, for example, all the peaks in the
    library spectrum are also present in the mixture spectrum. If your FTIR search
    software allows, use the library spectrum of the identified component as the reference
    in spectral subtraction. Once the subtraction is obtained, search it against your
    libraries ("search again”). This will hopefully identify a component in the mixture.
    The subtract and search again process is implemented in Figures 3.31 and 3.32.'
