    # B. THE DISADVANTAGE OF FTIR


    Despite the virtues of FTIRs, they are not perfect instruments. FTIRs suffer from
    the disadvantage of *artifacts*. These are features present in the spectrum of
    a sample that are not from the sample. Common examples of artifacts in FTIR spectroscopy
    include the water vapor and carbon dioxide peaks in Figure 1.7. Recall from Equations
    1.5 and 1.7 that both Absorbance and Transmittance spectra are calculated by ratioing
    the background spectrum and the sample spectrum. If the contribution of water
    vapor and $CO_2$ are the same when the background and sample spectra are measured,
    these contributions will ratio out, giving an artifact-free sample spectrum like
    the one in Figure 1.9. However, when using an FTIR the background and sample spectra
    must be measured at different times. If anything changes inside the instrument
    when the two are measured, such as a change in $H_2O$ or carbon dioxide concentration,
    peaks from the $CO_2$ peak appear in Figure 1.10. When using an FTIR one must
    be careful not to interpret atmospheric gases as being from the sample. Thus,
    you should familiarize yourself with the spectrum of the atmosphere as seen in
    Figure 1.7.


    Although the artifact problem is annoying, the many advantages of FTIR make the
    spectrometer capable of analyzing many samples. Table 1.2 summarizes the advantages
    and disadvantages of Fourier Transform Infrared spectrometers.


    # VII. FTIR: THE REST OF THE STORY


    Infrared spectroscopy is an excellent chemical analysis technique. However, both
    infrared spectroscopy and FTIR spectrometers have disadvantages and limitations
    as discussed above. This means infrared spectroscopy will solve many but not all
    chemical analysis problems. When dealing with an unknown may be tempted to identify
    a sample using just infrared spectrum. This can be dangerous because spectra can
    contain incomplete information or be misleading. It is always practical to gather
    as much information as possible about unknown samples. Note the sample''s color,
    texture, and physical state (solid? liquid? gas?). Interrogate the person handing
    you the sample about where the sample came from, what chemical species might be
    present, and what they are trying to learn from the sample. Perform physical tests
    on the sample such as determining its melting'
