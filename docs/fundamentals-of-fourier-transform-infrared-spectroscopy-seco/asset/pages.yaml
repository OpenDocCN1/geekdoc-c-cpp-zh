    1600 cm⁻¹ is one of its physical constants. However, the absorptivity of water
    is different at different wavenumbers, as follows:


    $E_{water}^{1600} \neq E_{water}^{1700}$


    which states that the absorptivities of water at 1700 and 1600 cm⁻¹ are different.
    Also, in general, different molecules will have different absorptivities at the
    same wavenumber, thus


    $E_{water}^{1700} \neq E_{acetone}^{1700}$


    which states that the absorptivity of water and acetone are different at 1700
    cm⁻¹. The absorptivity can be thought of as an "inherent absorbance"; it measures
    the amount of light a pure substance will absorb under controlled conditions as
    pathlength, wavenumber, and temperature. So, strongly absorbing molecules have
    high absorptivities, and weakly absorbing molecules have low absorptivities.


    The absorbance is a unitless quantity, so the units on the right-hand side of
