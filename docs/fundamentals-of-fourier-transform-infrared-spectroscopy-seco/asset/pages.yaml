  md: '# Introduction to Infrared Spectroscopy


    TABLE 1.1


    # The Advantages and Disadvantages of Infrared Spectroscopy


    | Advantages | Disadvantages |

    | --- | --- |

    | Almost universal | Can''t detect some molecules |

    | Spectra are information rich | Mixtures |

    | Relatively fast and easy | Water |

    | Relatively inexpensive | |

    | Sensitivity | |


    The first advantage of infrared spectroscopy is that it is almost universal. Many
    molecules have strong absorbances in the mid-infrared, which is part of why we
    measure spectra in this region. Many types of samples including solids, liquids,
    gases, semi-solids, polymers, organics, inorganics, biological materials, pure
    substances, and mixtures can have their infrared spectra measured. The second
    advantage of infrared spectroscopy is that spectra are information rich. The peak
    positions give the structures of the molecules in a sample, the peak intensities
    give the concentrations of molecules in a sample, and the peak widths are sensitive
    to the chemical matrix of the sample including pH and hydrogen bonding [1].


    The third advantage of infrared spectroscopy is that measuring infrared spectra
    is relatively fast and easy. Of course, the nature of the sample and the sampling
    technique will affect the speed and ease of analysis, and some samples will be
    more difficult than others. However, many samples can have their infrared spectra
    measured in five minutes or less. For certain samples and sampling techniques
    (such as ATR, see Chapter 4) quality spectra can be obtained in a matter of seconds.
    This compares favorably to gas and liquid chromatography where it can take 15
    to 45 minutes to analyze one sample. The fourth advantage of infrared spectroscopy
    is that it is relatively inexpensive. This might sound like a lot of money, but
    in the world of lab instruments it such as Nuclear Magnetic Resonance spectrometers
    (NMR), gas chromatography-mass spectrometers (GC-MS), and liquid chromatography-mass
    spectrometers (LC-MS) routinely cost more than $100K, several times more expensive-ve
    than FTIRs.


    The fifth advantage of infrared spectroscopy is its sensitivity, which is a measure
    of the minimum amount of material that gives a usable spectrum. For the FTIR,
    milligram ($10^{-3}$ gram) samples are ideal, and picogram ($10^{-6}$ gram) of
    material can be detected. If a gas chromatograph is hooked up to an FTIR, nanograms
    ($10^{-9}$ gram) of material can be routinely detected. Finally, if money is no
    object, picograms ($10^{-12}$ gram) of material may be detected by freezing the
    eluant from a gas chromatograph to an infrared transparent window and then taking
    its spectrum [3]. The ability to detect picograms of material infrared spectroscopy
    in the same sensitivity ballpark as mass spectrometry, which is an underappreciated
    fact among analytical chemists.'
