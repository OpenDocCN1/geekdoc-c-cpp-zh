    # III. SAMPLE PREPARATION


    The principles behind preparing microscopic samples for infrared analysis are
    similar to those for preparing macroscopic samples, as discussed in Chapter 4.
    Since an infrared microscope can be used in transmittance and reflectance, both
    types of sample preparation come into play. Unfortunately, the preparation of
    microscopic samples for infrared analysis may the hardest part of using an infrared
    microscope. Frequently, samples are too small to be seen by the naked eye, so
    the preparation of samples for infrared microscopy requires the use of a low-power
    stereo microscope, as shown in Figure 6.5.


    The user looks at a magnified image of the sample through the binocular eyepiece.
    Preparative microscopes typically have a magnification of 5x to 25x. The sample
    is placed on the working surface of the microscope and may be illuminated by a
    lamp for better viewing. The focusing knob is adjusted to bring the sample into
    view. Special tools such as probes, scalpels, and tweezers are used to cut the
    sample, move it around, and mount it. It takes skill, patience, and practice


