  md: '# Fundamentals of Fourier Transform Infrared Spectroscopy


    spectrum in Figure 1.5 was intentionally measured with a sample that was too thick.
    You can see that around 3000 cm⁻¹ the peak has a “chopped-off” or box-like appearance.
    This is because the sample is literally absorbing all the light in this wavenumber
    region. Since the sample spectrum intensity (I) in Equation 1.5 appears in the
    denominator, as this quantity approaches zero, the value of A approaches infinity.
    Rather than trying to measure infinitely large absorbances, the instrument truncates
    the intensity measurement at value, giving the chopped-off appearance seen in
    Figure 1.5. These peaks are a problem because their shapes are distorted; one
    could easily conclude that the two spectra in Figure 1.5 are of different materials
    when in fact they are both of mineral oil. In general, when you measure your spectra
    peaks should be less than 2 absorbance units or greater than 10%T to avoid the
    truncated peaks seen in Figure 1.5. Any time you measure a spectrum, check the
    peak sizes and shapes to make sure they are on scale and of correct shape. With
    proper sample preparation you can reduce the pathlength or concentration of a
    sample to its peaks on scale.


    # IV. WHAT ARE INFRARED SPECTROSCOPY USED FOR?


    We measure infrared spectroscopy to answer questions about “What molecules are
    present in this sample?”, otherwise commonly called unknown analysis. The peak
    positions in an infrared spectrum correlate with molecular structure, which is
    part of why infrared spectroscopy is useful. Over the last 100+ years a great
    number of infrared spectra have been measured, and the peak positions of known
    molecules derived from these spectra can be used to identify the molecules in
    an unknown sample [1].


    When performing a spectral comparison, or what is sometimes called identity testing,
    we are asking the question of the spectrum, “Are these two samples the same?”
    This is answered by comparing the unknown spectrum to a reference spectrum and
    noting how well the peak positions, heights, and widths in the two spectra match.
    Comparing spectra is much easier than interpreting an unknown spectrum, but it
    still needs to be done properly [1].


    A third question an infrared spectrum answer is, “What are the concentrations
    of molecules in this sample?” To do this one must measure the spectra of known
    concentration, and then use Beer’s Law (Equation 1.6) to prepare a calibration
    line relating absorbance to concentration. Once the calibration has been generated
    and validated it can be used to determine the concentration of molecules in unknown
    samples. For more on quantitative analysis see Chapter 5 of this volumes or my
    book on quantitative spectroscopy [2].


    # V. THE ADVANTAGES AND DISADVANTAGES OF INFRARED SPECTROSCOPY


    The advantages and disadvantages of infrared spectroscopy as a chemical analysis
    technique are listed in Table 1.1. These attributes are for the technique generally,
    regardless of the type or brand of infrared spectrometer being used to measure
    a spectrum.


    © 2011 by Taylor & Francis Group, LLC'
