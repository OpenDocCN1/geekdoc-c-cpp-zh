  md: '# # Preface


    Why write a second edition of *Fundamentals of FTIR*? Two reasons. First, much
    has changed since the first edition was published in 1996, particularly the development
    of diamond ATRs. Second, I have taught FTIR to thousands of people since 1992,
    and I now do a better job of explaining the important concepts of FTIR I did then,
    which is reflected in this book. Those familiar with the first edition of *Fundamentals
    of FTIR* will recognize very little here; the book has been entirely rewritten
    and there are dozens of new figures. Topics have been added, expanded, and dropped
    as appropriate.


    So, who do I think you are? This book is aimed at those who need to FTIR, particularly
    nonchemists who need to use FTIR equipment and who seem to be the majority of
    new users today. journeyman and expert spectroscopists will find this volume a
    useful reference for its concise and comprehensible explanation of FTIR topics.
    A nodding familiarity with freshman chemistry and physics will help while reading
    this volume, but is by no means a necessity. Chemists and nonchemists have told
    me they benefited reading the first edition, and I expect the same will be true
    of this.


    This book contains six chapters. Chapter 1 is an introduction to the field of
    infrared spectroscopy, including the strengths and weaknesses of FTIR as a chemical
    analysis tool. The second chapter, “How an FTIR Works,” is about the instrument.
    Topics include how an interferometer generates a spectrum, optimizing spectral
    quality, and tests to monitor instrument health. Chapter 3 is a discussion of
    how to properly use spectral processing to increase the information content of
    a spectrum without damaging the data. My approach to this topic is as unique as
    it was in the first edition. Chapter 4 will teach you to win in that battle. Chapter
    4 is dedicated to sample preparation. Preparing samples is half the battle in
    getting a good spectrum—The chapter is significantly expanded compared to the
    first edition, including a lengthening of the ATR section. Chapter 5 is dedicated
    to single analyte quantitative analyses. Entire books have been written on this
    topic (including one by me), but the goal here is to introduce you to the theory
    and practice of this field to allow you to generate your quality calibrations.
    Chapter 6 is an overview of infrared spectroscopy. I estimate that one third of
    the FTIRS in use have infrared microscope attachments, hence the need to cover
    this topic in an introductory book.


    I hope you find this book a readable and enjoyable introduction to an important
    field of chemical analysis. I take full responsibility for the contents of the
    book including all errors, and greatly appreciate your comments whether positive
    or negative. You can find me by doing an Internet search on “Spectros Associates.”


    Happy reading.


    Brian C. Smith, Ph.D.'
