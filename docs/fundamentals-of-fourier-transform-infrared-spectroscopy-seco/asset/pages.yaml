    in Figure 4.33 are relatively narrow. The peak width in infrared spectrum is determined,
    among other things, by the strength of the intermolecular interactions between
    neighboring molecules [6]. In the gas phase these interactions are weak because
    the molecules are far apart, leading to narrow bands. If you take C=O, condense
    it into the liquid phase, and measure its infrared spectrum, the series of sharp
