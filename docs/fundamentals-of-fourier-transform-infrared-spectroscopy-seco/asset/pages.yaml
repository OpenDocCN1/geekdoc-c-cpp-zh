    used to measure sample properties in difficult environments such as the middle
    of a chemical reactor or of liquid flowing through a pipe. Some FTIRs work in
    the near infrared. Higher in energy than the near infrared are visible and ultraviolet
    (UV) radiation. These higher energy light waves fall above 14,000 cm⁻¹. When a
    molecule absorbs ultraviolet or visible light in the molecule transition from
    a lower electronic energy level to a higher one. Many molecules have measurable
    UV and visible spectra, and these spectra can be used to identify and quantify
    molecules in samples. FTIRs are equipped to work in the visible and UV. Figure
    1.3 shows that as you move from left to right across the electromagnetic spectrum
    there is an increase in energy, wavenumber, and frequency, but a decrease in wavelength.
    Similarly, moving from left to right across Figure 1.3 there a decrease in energy,
    frequency, and wavenumber and an increase in wavelength.


    # III. WHAT IS AN INFRARED SPECTRUM?


    A plot of measured infrared light intensity versus a property of light is called
    an infrared spectrum. An example of an infrared spectrum is plotted with wavenumber
    to the left and low wavenumber to the right. By convention the x-axis of an infrared
    spectrum should always follow this convention. Note in Figure 1.2 that 4000 cm⁻¹
    is to the left and 500 cm⁻¹ is to the right, and that the spectrum is plotted
    in Absorbance units, which measure the amount of light absorbed by a sample. As
    you can see in the figure the peaks point up and their denote wavenumbers at which
    significant amounts of light were absorbed by the sample. The absorbance of a
    sample is calculated from the following equation:


    ```

    A = log(I_0/I)

    ```


    © 2011 by Taylor & Francis Group, LLC'
