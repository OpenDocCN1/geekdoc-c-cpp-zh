    sample. This technique is sensitive; it takes less than one drop of liquid or
    a spatula''s tip of soft solid to obtain a good spectrum. If your sample is too
    thick you can reduce its pathlength by taking the windows, wiping one of them
    on a paper towel, and putting them again. The windows used with this technique
