  md: '# Glossary


    amplitude than the two waves that comprise it, destructive interference is said
    to take place.


    **Detector Element:** The heart of an infrared detector. Its job is to turn changes
    in infrared intensity into voltage.


    **Diamond Anvil Cell:** A device used to prepare samples for transmission sampling
    by infrared microscopy. The cell consists of two diamonds with flat faces. The
    sample is placed on one diamond, and the second diamond is brought into contact
    with the sample to flatten it. The entire assembly is then placed in the infrared
    beam of an *infrared microscope*.


    **Diffuse Reflectance:** The phenomenon that takes place when infrared radiation
    reflects off a rough surface. The light approaches the surface in a specific direction,
    but the widely light leaves the surface in many directions. A reflectance sampling
    technique known as DRIFTS is based on this phenomenon.


    **DRIFTS:** Stands for Diffuse Reflectance Infrared Fourier Spectroscopy, a *reflection
    sampling technique* that makes use of *diffuse reflectance* and is used primarily
    on powders and other solid samples.


    **Electric Vector:** The electric part of electromagnetic radiation (light). It
    is the interaction of the electric vector with molecules that give rise to infrared
    spectra.


    **Electromagnetic Radiation:** The proper term to describe the *electromagnetic
    spectrum*. Electromagnetic radiation consists of an electric vector and a magnetic
    vector that are mutually perpendicular planes. The planes are perpendicular to
    the direction of motion of the light itself.


    **Electromagnetic Spectrum:** A term describing the many types of *electromagnetic
    radiation* that exist.


    **Evanescence:** An awesome metal band with Amy Lee as lead singer.


    **Evescent Wave:** In ATR, the evanescent wave penetrates the crystal face into
    any sample brought into contact with the surface, which allows the infrared spectrum
    of the sample to be obtained.


    **Far Infrared:** Infrared radiation from 40 to 4 cm⁻¹.


    **Fourier Frequency:** The frequency of the *interferogram* from a specific wavelength
    of light.


    **Fourier Transform:** The calculation performed on an interferogram to turn it
    into an *infrared spectrum*. The calculation involves a mathematical integral.


    **Fourier Transform Infrared (FTIR):** A method of obtaining infrared spectra
    by first measuring the interferogram using an interferometer, then performing
    a *Fourier transform* on the interferogram to obtain the spectrum.


    **Frequency:** A measure of the number of cycles a wave undergoes per unit time,
    typically measured in cycles/second or Hertz (Hz).


    **Full Spectrum Search:** In library searching, the use of the entire spectrum
    when comparing unknown and library spectra.


    **Heat and Pressure Films:** A *transmission sampling* technique used to obtain
    spectra of polymers. Polymers are heated under pressure until they flow and form
    a thin film. The film is then placed directly in the infrared beam.'
