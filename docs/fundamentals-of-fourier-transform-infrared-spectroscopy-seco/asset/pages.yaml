    One advantage of the cast film method is that it is inexpensive. All you need
    a little polymer, a liquid solvent, a test tube, an eyedropper, and an IR transparent
    window. Also, like other transmission techniques, there are a number of problems
    with this technique (which does make me a film critic?). The first is the solvent
    itself. If the solvent does not evaporate completely it will contaminate the spectrum.
    Not all polymers, such as thermoplastics, will dissolve in volatile solvents,
    limiting applications. Another disadvantage of the cast film method is that it
    is time-consuming; it can take several minutes to make the polymer solvent and
    evaporate onto an infrared transparent window. The only way to know if a film
    is of the right thickness is to measure its spectrum. If the film is too thin,
    more drops of polymer solution can be applied and allowed to evaporate to build
    up a thicker film. If the film is too thick, it must be dissolved off the window
    and a new film must be made. Trial and error attempts to make a film of the right
    thickness can take minutes or hours of your time. That said, waiting for the solvent
    to evaporate you multitask because the sample does not need babysitting. Another
    disadvantage of the cast film method is that it alters polymer morphology, which
    describes how polymer chains pack together. This information is lost when the
    polymer is dissolved in a solvent. Finally, quantitative analysis is difficult
    with cast films because there is poor control over sample thickness. Table 4.5
    lists the advantages and disadvantages of cast films for analyzing polymers.


    # B. The Heat and Pressure Method


    A second way to acquire the spectra of samples in transmission is the heat and
    pressure method. This method works by compressing a polymer and heating it to
    above its glass transition temperature, where it will soften and form to a thin
    film. A diagram of how the technique is shown in Figure 4.15.


    The sample is placed between the platens of a hydraulic press. The sample can
    be a polymer pellet, chunk, piece, or film. In theory, long as the sample fits
    into the press it can be turned into a thin film. Using the press, pressures of
