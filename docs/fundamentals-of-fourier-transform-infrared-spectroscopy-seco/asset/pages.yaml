  md: '# How an FTIR Works


    An intense beam leaves interferometer


    ![](img/d25eff8aaf4b0b214cf4015e62b7c990_35_0.png)


    FIGURE 2.3 An example of two beams undergoing constructive interference.


    If A₁ is greater than A₁ or A₂ the beams are said to undergo constructive interference.
    If A₁ is less than A₁ or A₂ destructive interference is said to take place. The
    square of the amplitude of a light beam is proportional to its intensity. For
    example, a candle is dim because it gives off visible light of low amplitude,
    and the sun is intense because it gives off visible light of high amplitude. When
