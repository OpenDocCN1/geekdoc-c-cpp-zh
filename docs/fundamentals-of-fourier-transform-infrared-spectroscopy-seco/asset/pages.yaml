    There are libraries containing spectra of paint chips from automobiles. Performing
    a library search of a paint chip spectrum can help identify the make and model
    of a car, and even the year it was made and the factory it originated. This type
    of evidence is useful in tracking down the perpetrator of a crime. Evidence of
    this type has been used in courts of law to convict people of felonies.


    # V. INFRARED MAPPING AND IMAGING


    Traditional infrared microscopes have only one detector, and as such can only
    take the infrared spectrum at one spot on a sample. It might be by nice for some
    samples to take spectra at many different locations. This would allow one to learn
    how the composition of a sample changes with location, giving what is called a
    molecular map. Early infrared microscopes constructed molecular maps by using
    sample stages whose positioning was under computer control. Software could be
    programmed to move the stage to various parts of the sample so spectra could be
    obtained automatically at various locations. Frequently, the spectra were obtained
    in a grid pattern.


