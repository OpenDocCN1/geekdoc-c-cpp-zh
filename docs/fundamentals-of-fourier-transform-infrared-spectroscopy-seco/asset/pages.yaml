    windows that are water insoluble such as zinc selenide (ZnSe) or silver chloride
    (AgCl), but they are expensive. Additionally, when using the capillary thin film
    method liquid water features will be very broad and strong and will be difficult
    to remove by spectral subtraction (the spectrum of liquid water is seen in Figure
    1.6). For these reasons the capillary film method is in general not compatible
    with aqueous samples.'
