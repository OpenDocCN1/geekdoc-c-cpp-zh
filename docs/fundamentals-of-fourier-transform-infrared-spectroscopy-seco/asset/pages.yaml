  md: '# Glossary


    This glossary contains definitions of many important FTIR terms. The terms listed
    here appear in *italics* in the body of the book. Words that appear in italics
    the glossary are defined elsewhere in this section.


    **100% Line:** Is calculated by ratioing two background spectra to each other.
    Ideally, the result is a flat line at 100% transmittance. The slope and noise
    of 100% lines are measured to determine the health of an FTIR.


    **Abrasive Sampling:** A *diffuse reflectance* sampling technique where abrasive
    paper is used to collect particles from a solid sample. The paper and particles
    are placed at the focal point of a diffuse reflectance accessory to obtain the
    sample.


    **Absorbance:** Absorbance units are used to measure the amount of infrared radiation
    absorbed by a sample. Absorbance is commonly used as the y-axis unit in *infrared
    spectra*. Absorbance is defined by *Beer''s Law* and is linearly proportional
    to concentration.


    **Air-Cooled Source:** A type of infrared source used in infrared spectrometers,
    so because called air currents in the instrument regulate its temperature.


    **Analyte:** The chemical species of interest when performing an analysis. The
    thing being analyzed for.


    **Angle of Incidence:** The angle an incoming infrared beam makes with the *surface
    of a sample.*


    **Angle of Reflection:** The angle a reflected infrared beam makes with the *surface
    normal of a sample.*


    **Angle of Refraction:** The angle a refracted beam makes with the *surface normal
    of a sample.*


    **Artifacts:** Features in a sample spectrum that are not from the sample, classic
    examples of which include water vapor and carbon dioxide peaks.


    **ATR:** Attenuated Total Reflection, a *reflectance sampling technique.*


    **Background Spectrum:** A single beam spectrum acquired with no sample in the
    infrared beam. The power of a background spectrum is to measure the spectrum of
    the instrument and the environment.


    **Baseline Correction:** A spectral processing technique used to correct spectra
    with offset, slope, or curving baselines. To correct slope and curvature the user
    must draw a function parallel to the baseline, and then this is subtracted from
    the spectrum to remove the unwanted slope or curvature.


    **Beamsplitter:** An optical device designed so that it reflects and transmits
    light incident upon it.


    **Beer''s Law:** The equation that relates the *absorbance* of a sample to its
    concentration. Beer''s Law is used in FTIR quantitative analysis to perform *calibrations*
    and to predict unknown concentrations.'
