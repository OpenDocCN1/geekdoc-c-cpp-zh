    # V. AVOIDING EXPERIMENTAL ERRORS


    Following is a list of common experimental problems that can ruin quantitative
    analyses. Avoiding these problems is key to ensuring the accuracy of your calibrations.


    +   1. Use standards with concentrations that bracket the expected concentration
    range of components in your unknowns. For example, if the concentration of the
    analyte in your standards runs from 10% to 70%, only unknowns whose concentrations
    fall in this range can be analyzed. Your mathematical model cannot be applied
    to concentrations greater than 70% or less than 10% because you have no information
    on the behavior of the model in these concentration ranges. It is always tempting
    to extrapolate a model into a concentration range where there is no data; it is
    always wrong.


    +   2. Use the actual components to be measured when preparing standards. For
    example, you may need to develop a calibration to measure the amount of acetone
    dissolved in water. The unknown samples will come from a factory floor and are
    made using 95% pure technical-grade acetone. You may have 99% pure reagent-grade
    acetone, and since we are taught that "purer is better" you may be tempted to
    make up the standards using the reagent-grade acetone. You may even get a perfectly
    good calibration with the reagent-grade material. The problem is that it will
    be the wrong calibration! The reagent-grade calibration would systematically overpredict
    the concentration of acetone in unknowns made with technical-grade material by
    4%. The technical-grade material has 4% more impurities than the reagent-grade
    material, so the acetone in it is 4%


