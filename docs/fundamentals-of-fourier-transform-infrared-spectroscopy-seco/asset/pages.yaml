  md: '# Fundamentals of Fourier Transform Infrared Spectroscopy


    # II. THE PROPERTIES OF LIGHT


    The proper term used to describe light is electromagnetic radiation. Light is
    composed of electric and magnetic waves called the electric vector and the magnetic
    vector. These waves fluctuate mutually perpendicular to each other, and move through
    space in a third direction perpendicular to the planes of undulation. It is the
    interaction of the electric vector with matter that leads to the absorbance of
    light. The amplitude of the electric vector changes over time and has the form
    of a sine wave as shown in Figure 1.1. The + and – signs in the figure indicate
    the polarity of the electric vector alternates over time.


    Since the motion of waves is repetitive, they go through cycles. For a wave a
    cycle begins at zero amplitude and ends when the wave has crossed zero amplitude
    a third time as illustrated in Figure 1.1 The distance traveled by a wave during
    a cycle is called its wavelength. The units of the wavelength are distance per
    cycle, although typically just the distance units are noted. Different types of
    light have different wavelengths. For example, the infrared radiation typically
    used to measure infrared spectra has wavelengths of around 10 microns, which is
    a little smaller than the diameter of a human hair. Scientists use the Greek letter
    lambda to denote wavelength. The arrows in Figure 1.1 show the wavelength of the
    light wave. In the older scientific literature you will sometimes see infrared
    spectra plotted with wavelength on the x-axis.


    Another important property of light is its wavenumber, which is denoted by the
    letter W. The wavenumber measures the number of cycles a wave undergoes per unit
    length. Wavenumbers are measured in units of cycles per centimeter, which are
    frequently abbreviated as cm⁻¹ and can be pronounced as “inverse centimeters,”
    “reciprocal centimeters,” or “wavenumber.” If a spectrum has a peak at 3000 cm⁻¹
    it means the sample absorbed infrared light from 4000 to 400 cm⁻¹ on the x-axis.
    Most infrared spectra are plotted around 400 cm⁻¹ as seen in Figure 1.2.


    ![](img/d25eff8aaf4b0b214cf4015e62b7c990_16_0.png)


    FIGURE 1.1 An example of the electric vector of a light wave. The + and – signs
    indicate the alternating polarity of the electric vector. The arrows show the
    wavelength (λ) of the wave. Note where the wave''s cycle begins and ends.


    © 2011 by Taylor & Francis Group, LLC'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Introduction to Infrared Spectroscopy


    ![](img/d25eff8aaf4b0b214cf4015e62b7c990_17_0.png)


    **Figure 1.2** The infrared spectrum of polystyrene. Note that the x-axis is plotted
    in wave-number and that the y-axis is in absorbance.


    Since the wavelength has units of distance/cycle and wavenumbers have units of
    cycles/distance, the two quantities are reciprocals of each other as:


    $W = 1/\lambda$.


    Where


    +   $W = Wavenumber$

    $\lambda = Wavelength$"


    If $\lambda$ is measured in centimeters, then W is calculated in cm$^{-1}$. One
    of the interesting properties of W is that it is proportional to the energy of
    a light wave as follows:


    $E = hcW$.


    Where


    +   $E = Light energy in Joules$

    $c = The Velocity of light ($-3 \times 10^{10}$ cm/second)$$

    $h = Planck$''s constant ($6.63 \times 10^{-34}$ Joule-second)$$

    $W = Wavenumber$


    Since energy is proportional to W, high wavenumber light has more energy than
    low wavelength light. Thus, the x-axis of Figure 1.2 is an energy axis with higher
    energy to the left and lower energy to the right.


    Another property of light waves is their frequency, which is a measure of the
    number of cycles a wave undergoes per unit time. Frequency is typically measured
    in cycles/second or Hertz (Hz) and the units are frequently written as sec$^{-1}$.
    Mid-infrared frequencies are on the order of $10^{14}$ Hz or -10 terahertz. Scientists
    represent frequency with the Greek letter $\nu$.'
