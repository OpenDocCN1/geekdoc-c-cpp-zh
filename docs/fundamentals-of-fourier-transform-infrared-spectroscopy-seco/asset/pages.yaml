  md: '# # 3 Proper Use of Spectral Processing


    Modern FTIR software programs contain powerful algorithms for processing spectra.
    If used properly, these algorithms can enhance the information content of a spectrum,
    blend mixture analysis, and make spectral interpretation easier. However, if used
    improperly these algorithms can alter and destroy spectroscopic data and can lead
    to erroneous conclusions. Hence the need for this chapter. The goal here is to
    explain how these processing algorithms work and how to use them properly to maximize
    the information obtained without sacrificing spectral quality.


    This chapter begins with a discussion of *spectral subtraction*, which is a way
    of simplifying mixture spectra to make them easier to interpret. Next, *baseline
    correction* is discussed, which is a method of removing baseline slope and curvature
    from a spectrum. Third, the use of spectral smoothing to reduce the noise level
    in a spectrum is covered. Fourth, spectral *derivatives* and their use in determining
    positions and analyzing overlapped peaks is presented. Fifth, a method of mathematically
    enhancing the resolution of a spectrum called deconvolution is examined. Last,
    *library searching*, which makes spectral interpretation easier and aids in mixture
    analysis.


    # ## I. THE RULES OF SPECTRAL PROCESSING


    To avoid potential problems in the use of spectral processing algorithms, the
    author recommends you follow these rules.


    +   1. Always closely examine the original spectrum before deciding on whether
    to process it or not. If you proceed, always have a good reason for doing so.
    Never process spectra automatically.

    2. Have a clear idea of how the processing algorithm you propose to use works,
    the problems it can cause, and how to avoid them.

    3. Always retain the original data so if something goes wrong, you have the original
    to fall back on.

    4. Always record when, why, and by whom the processing was performed.


    Rule 1 insists that you look at a spectrum before deciding whether to process
    it; each spectrum is unique, and this decision needs to be made on a case-by-case
    basis. You should never automatically process all the spectra you measure. Spectral
