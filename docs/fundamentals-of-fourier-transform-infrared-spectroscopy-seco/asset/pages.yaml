  md: '# Preparing Samples Properly


    Another disadvantage of transmission techniques is that they can be destructive.
    Transmission techniques involve grinding, compressing, or dissolving the sample,
    all of which make it impossible to recover the sample intact. If there is not
    much sample, the sample is valuable, or if it needs to be preserved for some other
    purpose, this is a problem.


    # A. WINDOWS, CELLS, AND MATERIALS FOR TRANSMISSION ANALYSIS


    For transmission analyses the sample is frequently put into an infrared transparent
    cell, placed between infrared transparent windows, or mixed with infrared transparent
    powder. It is up to the FTIR user to choose the right infrared transparent material
    for a given sample. The ideal infrared transparent material would be usable over
    a large wavenumber range, not react with or dissolve in the sample, and be rugged,
    tough, and inexpensive. No one material meets all criteria perfectly. For example,
    some materials absorb strongly above 400 cm⁻¹, some materials are soluble, others
    are quite expensive. This is why many of different infrared materials are used
    in transmission analysis. Listing of the most common materials and their relevant
    properties is provided in Table 4.2.


    The “Low cm⁻¹ Cutoff” in Table 4.2 indicates the low wavelength to which a material
    is infrared enough to allow usable sample to be measured. For example, KBr begins
    to absorb strongly near 400 cm⁻¹, so spectra should not be measured beyond point
    when working with it. The cost data in Table 4.2 is inexact because the prices
    of things vary over time. The number of dollars is meant to indicate the relative
    cost of these different infrared materials.


    Potassium bromide (KBr) is the most commonly used infrared transparent material.
    It is transparent over a broad spectral range, from 400 cm⁻¹ up the the KBr windows
    are commonly used in the beamsplitters for FTIRs, and their low wavenumber cutoff
    normally determines the low wavenumber cutoff of the FTIR as well. KBr is relatively
    cheap and easy to machine into windows and cells. A major drawback is that it
    is polar, hygroscopic, which means it absorbs water from the atmosphere. Over
    time a thick layer of water can build up on the surface of KBr, masking sample
    absorbances. Therefore, KBr in all forms—windows, cells, and powder—should


