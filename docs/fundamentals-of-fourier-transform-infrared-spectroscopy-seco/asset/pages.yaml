    For subtraction to work properly the two spectra must be plotted with y-axis units
    that are linearly proportional to concentration, as absorbance. Single beam spectrum
    or spectra plotted in percent absorbance peak sizes that are not linear with concentration
    and should not be used in spectral subtraction. The mathematical algorithm behind
    spectral subtraction is relatively simple and is given by Equation 3:1:


    (Sample Absorbance) – (Reference Absorbance) = Result Absorbance (3.1)


    This equation states that the absorbance at a given wavenumber in the result is
    equal to the difference in absorbance between the sample and reference spectrum
    at wavenumber. For example, if the absorbance spectrum at 3000 cm⁻¹ is 0.5, and
    the absorbance of the reference spectrum at 3000 cm⁻¹ is 0.2, the result will
    be 0.3. A subtraction result is then a plot of the difference in absorbance between
    the sample and reference spectrum plotted versus wavenumber.


    Ideally, a subtraction result will contain no features from the reference material,
    i.e., be part of the spectrum''s baseline. For this to happen, the reference features
    present in the spectrum being subtracted must be perfect overlays, i.e., have
