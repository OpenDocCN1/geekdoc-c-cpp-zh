    # C. POLYMERS


    The transmission techniques for polymers discussed earlier in this chapter involved
    either dissolving the polymer in a solvent and casting a film, or heating and
    pressing the polymer into thin film form. Both of these methods are time-consuming
    and involve trial and error to get a film of the right thickness. Additionally,
    both of these methods involve altering the morphology of the polymer, and important
    information such as crystallinity is lost. ATR suffers from none of these problems;
    it provides a fast and easy method of obtaining polymer spectra. Since polymers
    are solids they will generally need to be clamped to the ATR crystal to promote
    good sample/hot spot contact. Taking a spectrum of a polymer, then, is simply
    a matter of running a background spectrum on a dry, ATR crystal, clamping the
    sample to the crystal, taking the spectrum, and then cleaning the crystal. In
    theory, the spectrum of any polymer sample can be obtained if it can be clamped
    to the ATR crystal, including polymer films, pieces, pellets, and parts. The ATR
