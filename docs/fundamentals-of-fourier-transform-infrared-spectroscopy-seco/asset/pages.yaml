    to collect all the light that is reflected from the surface of a microscopic sample,
    particularly samples with rough surfaces. That in reflectance less light makes
    it to the infrared detector than transmittance, so some reflectance spectra are
    noisy. Increasing the number of scans can improve the SNR of such spectrum. Reflectance
    spectra are also surface sensitive, and for samples where this information is
    important this mode should be used. For example, surface layers coated on a piece
    of metal can be analyzed when the sample in situ because it cannot be removed
    from its matrix for some reason. So, defects in polymer films or contaminants
    on circuit boards can be analyzed in this fashion. In many labs transmission is
    the sample preparation method of choice for most microscopic samples because of
    the better SNR obtained.


    # IV. APPLICATIONS


    Infrared microscopes are widespread in industry and are so useful that some labs
    buy an FTIR for the sole purpose of attaching an infrared microscope to it. The
    point of using an infrared microscope is to take spectra of samples too small
    to be analyzed any other way. The spectra of samples as small as 8 microns in
    diameter have been successfully measured [8]. Contaminant analysis is a classic
    application of infrared microscopy. For example, “foreign matter” (things that
    aren''t supposed to be there) in food and pharmaceuticals are analyzed by infrared
    microscopy. In any manufactured item that is two dimensional, such as fabric,
    fiber, or a plastic film, a bump or a pit defects can be excited and examined
    in transmittance by an infrared microscope, or they can be analyzed in reflectance.
    In the circuit board and semiconductor industries such as fibers and particles
    cause problems can be analyzed by infrared microscopy to determine their origin
    with an eye to their elimination. The author''s experience is that many contaminants
    fall into two categories, the first being cellulose in various forms including
    paper, clothing, and towels. The second is protein from hair, skin flakes, bug
    parts, etc.


    When I wrote the first edition of this book in 1994 the use of infrared microscopy
    in forensic science was new. Since the proliferation of “CSI”-type TVs has placed
    forensic science, and to a point infrared microscopy, squarely in the public eye
    this is appropriate since there are many real-world applications of infrared microscopy
    in forensic science. One application is the analysis of hair and clothing fibers
    collected at crime scenes, which may lead to someone’s arrest. The spectrum of
    one of the author’s hairs (NOT from a crime scene) measured with a micro-ATR accessory
    is shown in Figure 6.10.'
