  md: '# Glossary


    # 179


    **Library Searching:** An automated process where an unknown spectrum is compared
    to a collection of known spectra kept in a *spectral library*. The comparison
    gives a number called *hit quality index*, which represents how closely related
    two spectra are to each other. If a match is of high quality, it may be possible
    to identify an unknown.


    **Mechanical Bearing:** An interferometer where some mechanical means, such as
    a lubricating material or ball bearings, are used to minimize the friction between
    the moving mirror shaft and its housing.


    **Microscope Mapping:** Using an *infrared microscope* to obtain spectra at different
    points in a sample. The result of microscope mapping is a *molecular map*.


    **Microwave Radiation:** A type of electromagnetic radiation that falls below
    4 $cm^{-1}$. Microwave radiation of gas phase samples can be measured to identify
    molecules. Microwave radiation is also used to heat food.


    **Mid-Infrared:** Infrared radiation between 4000 and 400 cm-1.


    **Mirror Displacement:** The distance that the mirror in a Michelson interferometer
    has moved from *path difference*.


    **Molecular Maps:** Plots of absorbance at a specific wavenumber location on a
    sample. Usually obtained using *microscope mapping*.


    **Mull:** A *transmission sampling* technique where the sample is ground then
    sandwiched between two infrared transparent windows and placed in the infrared
    beam.


    **Mull Agent/Mulling Oil:** Oil that is added to a ground sample for the preparation
    of a mull.


    **Near Infrared:** A type of *electromagnetic radiation* that is higher than *mid-infrared
    radiation* and falls from 14,000 to 4,000 $cm^{-1}$.


    **Normalized:** The process of dividing all the absorbances in a spectrum by the
    largest absorbance value. This resets the y-axis scale from 0 to 1. Normalization
    is performed on spectra before library searching.


    **Objective:** The optic in a microscope that collects light after it has interacted
    with the sample.


    **Opacity Problem:** An issue with *transmission sampling* where the sample has
    to have the right product of thickness concentration to obtain a usable spectrum.


    **Optical Path Difference:** The difference in distance travelled by the two light
    beams in an *interferometer*.


    **Peak-to-Peak Noise (PPN):** A noise measurement made on a 100% line. PPN is
    measured as the difference between the lowest and highest noise values in a specific
    wavelength range. When obtained under controlled conditions, peak-to-peak noise
    is an excellent measure of spectrum quality and instrument health.


    **Polymer Morphology:** How the chains in a polymer are packed together. For example,
    polymers can be crystalline, amorphous, or a combination of the two.


    **Quantitative Spectroscopy:** The use of spectra to determine the concentrations
    of chemical samples in samples.'
