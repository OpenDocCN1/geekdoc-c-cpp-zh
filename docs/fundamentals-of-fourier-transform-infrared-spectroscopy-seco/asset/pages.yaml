  md: '# Fundamentals of Fourier Transform Infrared Spectroscopy


    Where


    +   - A = Absorbance

    - I₀ = Intensity in the background spectrum

    - I = Intensity in the sample spectrum


    Absorbance is also related to the concentration of molecules in a sample via an
    equation called Beer’s Law:


    ```

    A = εc (1.6)

    ```


    Where


    +   - A = Absorbance

    - ε = Absorptivity

    - l = Pathlength

    - c = Concentration


    The height or area of a peak in an absorbance spectrum is proportional to concentration,
    which is why Beer’s Law can be used to determine the concentrations of molecules
    in samples. This topic will be covered in Chapter 5.


    The y-axis of an infrared spectrum can also be plotted in units called percent
    transmittance (%T), which measures the percentage of light transmitted by a sample.
    %T spectra are calculated as follows:


    ```

    %T = 100 × (I/I₀) (1.7)

    ```


    Where


    +   - %T = Percent Transmittance

    - I₀ = Intensity in the background spectrum

    - I = Intensity in the sample spectrum


    Note that in the %T spectrum seen in Figure 1.4 the peaks point down. The peaks
    represent wavenumbers where the sample measurably transmitted less than 100% of
    the incident infrared light.


    Absorbance and %T are mathematically related to each other, and it is easy using
    FTIR software to convert from one to the other. When this conversion is made only
    the y-axis changes; the positions are not affected. In the scientific literature
    you will see spectra both in absorbance and %T. The spectra in this book will
    be plotted both ways to give you looking at both types of spectra.


    Since there are two different y-axis units used in infrared spectroscopy, you
    may be wondering which one you should use. Since absorbance is linearly proportional
    to concentration (Equation 1.6), absorbance units must be used for quantitative
    analysis. Your spectrum must be absorbance if you are going to perform a spectral
    subtraction or library search [referred outlined in Chapter 3]. Absorbance spectra
    are perfectly suited to qualitative analysis as well. The size of the peaks in
    %T spectra are not linearly proportional to concentration, so these spectra should
    not be used for quantitative analysis, spectral subtraction, or library searching.


    © 2011 by Taylor & Francis Group, LLC'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Introduction to Infrared Spectroscopy


    ![](img/d25eff8aaf4b0b214cf4015e62b7c990_21_0.png)


    FIGURE 1.4 The infrared spectrum of polystyrene plotted in percent transmittance
    (%T).


    However, %T spectra are perfectly fine for qualitative analysis. Thus, if you
    are identifying unknowns or performing spectral comparisons, either absorbance
    or %T spectra can be used, and the choice is often a matter of personal preference,
    your supervisor''s preference, or as stated in the standard procedure are following.


    When preparing samples for infrared analysis it may be tempting to cram as much
