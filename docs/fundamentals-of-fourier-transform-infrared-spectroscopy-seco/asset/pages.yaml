    into a thin film means there is less trial and error than preparing solids for
    analysis. This technique is also versatile via the smear technique it can be used
    to obtain spectra of soft solids and viscous liquids. The quality of the spectra
    included in this section shows that this technique is capable of delivering spectra
    with flat baselines and good SNRs.


