  md: '# Fundamentals of Fourier Transform Infrared Spectroscopy


    The different properties of light waves are related to each other by the following
    equation:


    $c = v\lambda$ (1.3)


    Where


    +   $c =$ The Velocity of light ($\sim 3 \times 10^{10}$ cm/second)\n$\nu =$ Frequency
    in Hertz ($sec^{-1}$)\n$\lambda =$ Wavelength in cm


    A close look at Equation 1.3 shows that the units we make sense. When wavelength
    is measured in centimeters and is multiplied by frequency measured in $sec^{-1}$,
    we obtain units of cm/sec, which are the units of velocity. Equation 1.3 shows
    that the product of frequency times wavelength for a light wave equals a constant,
    the speed of light. Thus for any light wave you can calculate the frequency if
    you know the wavelength, and you can calculate the wavelength if you know the
    frequency. From Equation 1.1 we know that $W = 1/\lambda$, which can be substituted
    into Equation 1.3 and rearranged to obtain the following:


    $c = v/W$ (1.4)


    Where


    +   $c =$ The Velocity of light ($\sim 3 \times 10^{10}$ cm/second)\n$\nu =$ Frequency
    in Hertz ($sec^{-1}$)\n$W =$ Wavenumber in cm$^{-1}$


    Equation 1.4 allows the calculation of the wavenumber of a light wave if frequency
    is known, or if wavenumber is known.


    There are many types of electromagnetic radiation in the universe besides the
    mid-infrared, the collection of which is called the *electromagnetic spectrum*.
    A diagram of the electromagnetic spectrum is seen in Figure 1.3.


    The mid-infrared has been placed at the center of Figure 1.3. To the right of
    the mid-infrared between 400 and 4 $cm^{-1}$ is the *far infrared*. When molecules
    absorb far infrared they vibrate. Molecules with heavy atoms in them, including
    many organics, absorb this region. FTIRs in the far infrared Lower energy than
    the far infrared are *microwaves*. When molecules absorb microwaves they rotate
    fast. Microwave spectra of gas molecules have been measured, and this type of
    spectroscopy can be used to identify and quantify gases in samples. The liquid
    water molecules in food absorb this energy and rotate rapidly. Collisions with
    neighboring food molecules transfer energy to them raising their temperature and
    making your dinner warm.


    Higher in energy than the mid-infrared, from 14,000 to 4000 $cm^{-1}$, is the
    *near infrared*. Molecules vibrate when they absorb near infrared, but the spectral
    features are fewer, broader, and more difficult to interpret than in the mid-infrared.
    Because of instrumental advantages, near infrared radiation is frequently


    © 2011 by Taylor & Francis Group, LLC'
