  md: '180


    Glossary


    Reference Spectrum: In spectral subtraction, the spectrum of a substance that
    is subtracted from the spectrum of the sample. Often, the reference spectrum is
    of a pure material. In spectral comparisons and library searching, the spectrum
    of a known sample compared to a sample spectrum.


    Reflectance Sampling: A method of obtaining infrared reflectance by bouncing the
    infrared beam off the sample and then collecting and analyzing it.


    Reflectance-Absorbance: A reflection sampling technique used on thin films coated
    on metal surfaces. The infrared beam passes through the film, reflects from the
    metal, then passes through the film a second time before reaching the detector.
    This technique is also known as "double-transmission".


    Residual: What is left after subtracting two spectra from each other.


    Resolution: A measure of how well an infrared spectrometer can distinguish features
    that are close together. The instrumental resolution of an FTIR spectrum is determined
    by the maximum optical path difference used to measure a spectrum.


    Rovibrational: Referring to the fact that gases and vapors are free to vibrate
    and rotate, and that these materials absorb-mid infrared light the amount of vibrational
    and rotational energy in the molecule increases.


    Single Beam Spectrum: A single beam obtained with a sample in the infrared beam.
    This spectrum contains contributions from the instrument, the sample, and the
    environment. Single beam spectra are typically ratioed to background spectrum
    to obtain absorbance or transmittance spectra.


    Sample Spectrum: In spectral subtraction, the spectrum of a mixture which the
    reference spectrum is subtracted. Generally, the spectrum of the thing of interest.


    Scan: The process of measuring an interferogram with a FTIR. Typically, this involves
    moving the mirror in a Michelson interferometer back and forth.


    Sealed Liquid Cells: A transmission sampling technique used to obtain the spectra
    of liquids. The cell consists of two transparent windows hold a fixed distance
    by a gasket. The cell is filled with liquid then placed in the infrared beam.


    Search Algorithm: In library searching, the mathematical calculation used to compare
    two spectra to produce a quality index.


    Search Report: The end product of a library search. A search report ranks the
    quality of library matches using the hit index and then presents these results
    in a table.


    Signal Averaging: The process of averaging interferograms to achieve an improvement
    in signal-to-noise ratio.


    Signal-to-Noise Ratio (SNR): The ratio of signal in a spectrum, usually measured
    as the intensity of an absorbance band, to noise measured at a nearby point in
    the baseline. SNR is a measure of the quality of a peak and can also be used to
    ascertain the quality of an infrared spectrometer.


    Single Beam Spectrum: The spectrum that is obtained after Fourier transforming
    an interferogram. A single beam spectrum is a plot of infrared intensity versus
    wavenumber.


    © 2011 by Taylor & Francis Group, LLC'
