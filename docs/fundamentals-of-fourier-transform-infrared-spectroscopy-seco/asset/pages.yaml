    # VIII. DIFFUSE REFLECTANCE (DRIFTS)


    When an FTIR is used to collect diffuse reflectance spectra of samples the technique
    is called Diffuse Reflectance Infrared Fourier Spectroscopy, or DRIFTS for short
    [7]. DRIFTS is used to analyze powders and things that can be ground into a powder,
    so it competes directly with the KBr method discussed previously. In both the
    DRIFTS and KBr pellet methods, the sample and KBr powder are ground to reduce
    particle size and avoid light scattering. These materials should be ground separately
    to avoid possible chemical reaction. Grinding can be accomplished using a mechanical
    grinder, as shown in Figure 4.5, or the agate mortar and pestle shown in Figure
    4.40.


    The measured intensity of the reflected light in a DRIFTS experiment depends upon
    the size and shape of the particles and how they are packed together. Mechanical
    grinding gives more reproducible sizes and shapes than manual grinding. Once ground,
    the sample and KBr are mixed together to dilute the sample, which prevents too
    much light from being absorbed. DRIFTS is not as sensitive as the KBr pellet method
    and needs 5% to 15% sample should be used. At this point in making a pellet, the
    KBr/sample mixture would have to be compressed. With DRIFTS, compressing the sample
    is not necessary. Instead, the sample/KBr powder is placed in a small metal cup
    like the one in Figure 4.40.


    ![](img/d25eff8aaf4b0b214cf4015e62b7c990_138_0.png)


    FIGURE 4.40 Left: An agate mortar and pestle used to grind powders for infrared
    analysis. Right: A filled DRIFTS sample cup.


    © 2011 by Taylor & Francis Group, LLC'
