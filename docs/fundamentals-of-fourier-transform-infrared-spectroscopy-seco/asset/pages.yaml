  md: '# How an FTIR Works


    The FT in FTIR stands for Fourier Transform, which is named in honor of the French
    mathematician Joseph Fourier (1768–1830). Fourier''s theorem states that many
    mathematical functions (which are simply x, y plots) can be expressed as a superposition
    of sine and cosine waves. The mathematical calculation known as the Fourier transform
    can be used to calculate the superposition of sine and cosine waves for a given
    function and the function that corresponds to a superposition of sine and cosine
    waves. Recall from above that an interferogram is a superposition of sine and
    cosine waves. When we transform an interferogram a mathematical function is obtained
    that corresponds to the interferogram. This function is the spectrum of the infrared
    beam that hits the detector. By passing the light through the interferometer the
    spectrum of the infrared beam is optically transformed into an interference pattern,
    and the Fourier transform turns it back into a spectrum. The net effect of placing
    a sample into the infrared beam is to simply alter the interference pattern.


    To understand the relationship between the spectrum of a light beam and its interferogram
    it is best to start by examining the spectrum of a simple light source such as
    a laser. An idealized laser has high intensity at a specific wavelength and little
    or none at other wavenumbers so its spectrum is a line as illustrated in the right-hand
    side of Figure 2.13.


    From we know that the interferogram of a specific wavelength of light is a cosine
    wave. A laser line does come to this ideal and its interferogram is a cosine wave,
    as illustrated in the left-hand side of Figure 2.13. Thus, the Fourier transform
    of a line is a cosine wave, and the Fourier transform of a cosine wave is a line.
    There really is a relationship between the wiggles in an interferogram and the
    peaks in an infrared spectrum.


