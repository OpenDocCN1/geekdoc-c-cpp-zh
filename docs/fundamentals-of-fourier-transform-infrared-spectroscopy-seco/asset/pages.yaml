    # XII. FTIR SAMPLE PREPARATION: OVERVIEW AND RECOMMENDATIONS


    As you can see from this chapter, there are many different types of infrared sampling
    techniques. The goal of this chapter has been to cut through the potential confusion
    that surrounds sample preparation by emphasizing the advantages and disadvantages
    of each technique, and to clearly state what techniques best on what samples.
    It is now time to summarize what we have learned, and for me to share with my
    basic strategy of FTIR sample preparation.


    Many of the transmission techniques discussed earlier in this chapter were developed
    over 50-plus years ago and involve a certain amount of skill and sometimes significant
    amounts of manual sample preparation. After then labor was cheaper, and it was
    no as okay for it to take minutes or hours for one sample to be analyzed. However,
    in the 21st century, labor costs are significantly higher, and all labs are under
    pressure to do with less to increase profitability. Therefore, the main criterion
    others use to evaluate sample preparation techniques is speed and ease of use.
    For many samples, reflection techniques are faster and transmission techniques.
    My approach, then, is that for a given sample I will try reflection techniques
    first. If the reflection technique works, it will do so quickly and I can move
    on to the next sample. If the reflection technique does not work well, I will
    find out quickly so much time is wasted. Then, I will try one of the transmission
    techniques appropriate for the particular sample.


    The introduction in the mid-1990s of diamond accessories has revolutionized FTIR
    sample preparation. The toughness and durability of diamond now means that materials
    that would have scratched or pressures that have broken ATR crystals are now tolerated,
    and all manner of liquids, semi-solids, solids, and powders can be analyzed quickly
    and easily using this device. For these reasons diamond ATR is the premier type
    of sample preparation in use today. It does work work on all


