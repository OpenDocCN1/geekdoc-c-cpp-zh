  md: '# # Introduction to Infrared Spectroscopy


    The purpose of this book is to introduce the reader to the fundamental concepts
    of Fourier Transform Infrared (FTIR) spectroscopy. The discussion assumes no previous
    background in FTIR, but a familiarity with the basic concepts of chemistry and
    physics will be helpful in understanding this text. This book teaches the basics
    of FTIR to those new to the field, and will serve as an excellent reference guide
    for experienced users. All terms shown in *italics* will be defined in the glossary
    at end of the book.


    # ## I. TERMS AND DEFINITIONS


    Half the battle in learning any new field is understanding the jargon. To aid
    you in learning about FTIR, a number of the terms used in the field of infrared
    spectroscopy are defined below.


    +   *Spectroscopy* – the study of the interaction of light with matter.

    *Infrared Spectroscopy* – the study of the interaction of infrared light with
    matter.

    *Mid-Infrared* – light from 4000 to 400 wavenumbers (cm⁻¹).

    *Spectrum* – a plot of measured light intensity versus some property of light
    such as *wavelength* or *number*.

    *Spectometer* – an instrument that measures a spectrum.

    *Infrared Spectrometer* – an instrument that measures an infrared spectrum.

    FTIR – Fourier Transform Infrared, a specific type of infrared spectrometer.


    Analysis of infrared spectra can tell you what molecules are present in a sample
    and at what concentrations; why infrared spectroscopy is useful. There are several
    types of infrared spectrometers in the world, but the most widely used ones are
    FTIRs, which is the focus of this book will teach you how FTIR works, how to use
    FTIR software to assist in data analysis, how to properly prepare samples for
    FTIR analysis, how to quantify concentrations in samples using FTIR spectra, and
    infrared microscopy. In essence, we will be everything involved in obtaining a
    good infrared spectrum. For information on how to interpret an infrared spectrum
    to determine the structures of molecules present in a sample please consult my
    book on infrared interpretation [1].'
  merge: -1
