  md: '# # How an FTIR Works


    The purpose of this chapter is to familiarize you with the inner workings of a
    FTIR and how to use this knowledge to optimize the quality of the spectra you
    measure. The chapter concludes with a discussion of tests you can run to insure
    your FTIR is working properly.


    # I. INTERFEROMETERS AND INTERFEROGRAMS


    At the heart of every FTIR is an optical device called an interferometer. A diagram
    of an interferometer is shown in Figure 2.1.


    Can interferometer or “interference meter,” measures the interference pattern
    between two light beams. The light from an infrared source is shown entering the
    interferometer from the left in Figure 2.1. The interferometer splits the single
    light beam into two light beams. The interferometer then causes the two beams
    to travel different paths, which are denoted D and Dj in Figure 2.1. After the
    two light beams have travelled their different paths they are combined into one
    beam, and then the light leaves the interferometer in Figure 2.1.


    Note in Figure 2.1 that the two light beams in this interferometer travel different
    paths;path is 4 cm long andpath is 10 cm long. The optical path difference of
    an interferometer, denoted by the Greek letter delta (δ), is the difference in
    distance traveled by the two light beams. For the interferometer in Figure 2.1
    the optical path difference is (10 – 4 cm) = 6 cm. If the two light beams travel
    in the interferometer happen to be identical, then δ = 0 and the condition is
    zero path difference, or ZPD for short.


    There are number of interferometer designs by FTIR manufacturers. The oldest and
    most common type of interferometer used today is the Michelson interferometer.
    It is named after Abraham Michelson (1852–1931) who built his interferometer in
    the 1880s and went on to win a Nobel Prize in Physics for the discoveries he made
    with it. The optical design of a Michelson interferometer is shown in Figure 2.2.
    Even if your FTIR does not have a Michelson interferometer in it, the following
    discussion will reveal the basics of interferometer operation are similar for
    all interferometer types.


    The Michelson interferometer consists of four arms. The top arm in Figure 2.2
    contains the infrared source and a colliding mirror to collect the light from
    the source and make rays parallel. The bottom arm of the Michelson interferometer
    contains a fixed mirror, i.e., a mirror that is in a fixed position and does not
    move. This is in contrast to the rest of the interferometer, which contains a
    moving mirror which is capable of moving left and right. The left arm of the interferometer
    contains the sample and detector.'
