    # IV. TRANSMISSION ANALYSIS OF LIQUIDS


    In general, transmission sampling of liquids is faster and easier than that of
    solids because it is easier to turn liquids into a thin film. There are two widely
    used methods for obtaining the transmission spectra of liquids: the capillary
    thin film method and sealed cells.


    # A. CAPILLARY THIN FILMS


    The beauty of the capillary thin film method is that it takes longer to say its
    name to prepare the sample. To make a capillary thin film, place a drop of sample
    between two infrared transparent windows. Any of the window materials listed in
    Table 4.1 can be used, with KBr being the most common. The capillary action of
    the liquid holds the windows together and thins out the sample, hence the name
    of the technique. It relates to hold one window against the other to thin and
    spread out the liquid film. The film is then placed in the infrared beam. Window
    holders shown in Figure 4.7 may be used for the capillary thin film method. Alternatively,
    a simple sample holder like the one shown in Figure 4.19 can also be used.


    Note how the holder slides into the mount in the FTIR sample compartment, and
    how the rest rests on the two posts protruding from the metal plate. This type
    of device can also be used to support KBr pellet holders, mills, and cast films.
    The background spectrum is on the same two windows that will be used to prepare
    the sample.


    A quality spectrum obtained using the capillary thin film method and the holder
    shown in Figure 4.19 is shown in Figure 4.20. Note how the spectrum in Figure
    4.20 has a flat baseline, noise, well-resolved peaks that are on scale, and negligible
    offset. Cleanup with the capillary thin method involves rinsing the windows with
    a solvent that will dissolve the sample but not the windows. For example, acetone,
    ethanol, methylene chloride, and tetrahydrofuran have been used.


    In to being useful with liquids, the capillary thin film technique can be used
    with soft oils or viscous liquids using the elegantly named “smear” technique.


    © 2011 by Taylor & Francis Group, LLC'
