  md: '# Fundamentals of Fourier Transform Infrared Spectroscopy


    The disadvantages of infrared spectroscopy are also listed in Table 1.1. Again,
    they are independent of the type or brand of infrared spectroscopy being used.
    The first issue with infrared spectroscopy is that there are several materials
    that do not have measurable mid-infrared spectra. Since the absorbance of infrared
    light by molecules excites vibrations, a chemical without vibrations will not
    have an infrared spectrum. Individual atoms, such as the noble gases helium and
    argon, are not chemically bonded to having vibrations, and do not have an infrared
    spectrum. Similarly, monatomic ions, a single atom with a charge, do not have
    an infrared spectrum because they are not chemically bonded to anything and do
    not possess vibrations. Now, monatomic ions may affect the spectrum of solvent
    molecules around them, for example, the presence of enough Pb2+ may change the
    spectrum of liquid water, but infrared spectroscopy has trouble detecting atoms
    and monatomic ions, atomic spectroscopy techniques should be used for these analyses
    instead.


    Another group of materials that do not possess a mid-infrared spectrum is homonuclear
    diatomic molecules. These are molecules that contain only two atoms and the two
    atoms are identical. Example includes oxygen gas (O2) and nitrogen (N2). These
    molecules possess one vibration, a symmetric stretch. The symmetric stretch of
    a molecule has a peak intensity of zero (for an explanation see [1]), so oxygen
    and nitrogen molecules have no peaks in the mid-infrared. This is probably a good
    thing. These two gases make up greater than 99% of the earth''s atmosphere, and
    if they absorbed in the mid-infrared it would strongly interfere with the spectra
    of samples.


    The second disadvantage of infrared spectroscopy is mixtures. The problem is that
    the more complex the composition of a sample, the more complex its spectrum, and
    the more difficult it is to determine what peaks are from what molecules. This
    difficulty is the biggest practical disadvantage infrared spectroscopy faces.
    Frankly, there are ways around the mixture problem. First, anything you do to
    purify a mixture will make its composition and hence its spectrum simpler. Any
    of the purification techniques that chemists routinely can be applied to infrared
    samples. For example, liquid mixtures can be distilled, solid mixtures can be
    recrystallized, and solid/liquid mixtures can be filtered. Physically separating
    the parts of a sample can be a way of purifying it. For example, if a powdered
    mixture has black and white crystals a pair of forceps can be used to separate
    the crystals into black and white piles. The spectra of these newly purified crystals
    can be measured separately. Extractions, which utilize solubility differences
    between materials to purify them, can be used Lastly, chromatographs are excellent
    at separating mixtures into their components. A low-tech way of “interfacing”
    FTIR to a liquid chromatograph (LC) is to collect LC peaks in different containers,
    evaporate off the solvent, and analyze each peak residue by FTIR.


    Another way of dealing with mixtures is to use the power of computation. Spectral
    subtraction software routines allow the spectra of pure substances to be subtracted
    from the spectra of mixtures to simplify their spectra. The spectrum of liquid
    water has broad, intense peaks as seen in Figure 1.6 that can mask the spectrum
    of any solute present, such as soap.'
