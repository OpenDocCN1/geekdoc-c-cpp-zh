    see in the smoothed spectrum than the unsmoothed spectrum. When interpreting peaks
    in a noisy spectrum, remember, that in general, noise features are narrow and
    sample peaks, particularly for solids and liquids, are wide.


    Many FTIR software packages contain smoothing functions, and there are typically
    several smoothing algorithms from which to choose. The simplest is called boxsmoothing,
    which is not often used but is the easiest to explain. For boxsmoothing, imagine
    taking several data points in a spectrum and drawing a box around them. This box
    is the smoothing window. Assume for a moment the smoothing window contains 9 data
    points. Now, take the y-axis values of these 9 data points, add them together,
    and divide by 9 to calculate their average. Then, assign the average-axis value
    to the middle x-axis point in the smoothing window. Next, move the box over one
    data point, calculate the average for this set of 9 data points, assign a new
    average to the middle x-axis point, and so on. The smoothing window is dragged
    across the entire spectrum to obtain a running average of the y-axis values. The
    smoothing result is then in the smoothed spectrum averages out, by Equation 2.11
    where N is the number of points in the smoothing window. The amount of smoothing
    is proportional to the number of points included in the smoothing window. Smoothing
    windows must always have an odd number of data points or there is not a middle
    data point in the smoothing window. Smoothed spectra are truncated at their ends
    because these data points are never the center in a smoothing window.


    Smoothing algorithms differ in how the average in the smoothing window is calculated.
    For instance, averages that give more or less weight to midpoints and endpoints
    in the smoothing window can be used. Some of the more common smoothing algorithms
    are boxcar, triangle, Fourier transform, and Savitzky–Golay. Describing how a
    smooth was performed, at a minimum you must report the algorithm used and the
    number of data points in the smoothing window. Thus, terms such as “7-point boxcar”
    and “9-point Savitzky–Golay” are proper ways of denoting how a spectrum was smoothed.


    The Savitzky–Golay method is the best-known and most widely used smoothing algorithm.
    It works by least-squares fitting a polynomial function to the set of points in
    the smoothing window. The y-axis value assigned to the center x-axis point is
    the value of the polynomial function in the center of the smoothing window [8].
    When using the Savitzky–Golay algorithm, in addition to setting the number of
    points in the smoothing window, the order of the equation used in the least-squares
    fit must be specified as well. For example, the highest order term in a polynomial
    of order 2 is x². The higher the degree of the polynomial that is fit to the points
    in the smoothing window, the less smoothing is achieved, as shown in Figure 3.15.


    The bottom spectrum in Figure 3.15 is an unsmoothed and noisy spectrum of benzonitrile
    (also shown in the bottom of Figure 3.14). Each of the other spectra in Figure
    3.15 were smoothed using the Savitzky–Golay algorithm with polynomial orders of
    10, 6, and 2, respectively. Note that as the polynomial order goes down, the amount
    of smoothing goes up.'
