    # A. DEPTH OF PENETRATION


    An important thing to know about any ATR experiment is how far the infrared beam
    penetrates into the sample. The intensity of the evanescent wave decreases exponentially
    with distance about the surface of the ATR crystal. The *depth of penetration*
    (DP) is the depth at which the evanescent wave intensity decreases to 36.8%=(1/e
    where e is the base of natural logarithms) of its initial value. The depth of
    penetration for any ATR experiment is given by Equation 4.2:


    > DP = 1/[2\piW_n(\sin^2\theta - n_c^2)^{1/2}] (4.2)


    Where


    +   - DP = Depth of penetration

    - W = Wavenumber

    - n_c = Refractive index of ATR crystal

    - \theta = Angle of incidence

    - n_sc = n_sample/n_crystal


    Note that all the parameters in Equation 4.2 are in the denominator, so if any
    of them go up, DP goes down. Since wavenumber units of cm⁻¹ are used in Equation
    4.2, the DP can be calculated in centimeters; multiply this number by 10^4 to
    obtain DP in microns. At 1000 cm⁻¹ a diamond ATR crystal with n_c = 2.42, angle
    of incidence of 45°, and refractive index of 1.4 (typical of many organic materials)
    gives a DP of 1.6 microns. Each of the parameters in Equation 4.2 has important
    things to teach us about the ATR technique and applications.


