    # VII. SPECULAR REFLECTANCE


    Specular reflectance is used in infrared spectroscopy to take spectra of samples.
    Since specular reflectance takes place on smooth surfaces, this technique works
    well on shiny, smooth surfaces. If there is a coating on a metal surface, a technique
    called *reflectance-absorbance* can be used to obtain the spectrum of the coating,
    as illustrated in Figure 4.37.


    In reflectance-absorbance, the infrared beam passes through the coating, reflects
    from the metal substrate, passes through the coating a second time, then is captured
    and focused onto the FTIR''s detector. A specular reflectance accessory that can
    measure reflectance-absorbance spectrum is shown in Figure 4.38.


    This particular specular reflectance accessory slides into the sample slide mount
    in the FTIR''s sample compartment. The sample is placed on top of the device,
    covering the hole. The infrared beam reflects from a flat mirror, from the sample,
    off a second flat mirror, and is then focused onto the FTIR''s detector. The reflectance-absorbance
    spectrum of the paint on the outside of a full soda can be taken with this device
    is shown in Figure 4.39.


