  md: '# Quantitative Infrared Spectroscopy 159


    12. Do as little spectral processing as possible. Techniques such as baseline
    correction, subtraction, and smoothing alter the absorbances in a spectrum and
    are difficult to reproduce from one spectrum to another. If you must process your
    data before quantification, all standard and unknown spectra should be processed
    in exactly same fashion.


    13. Be consistent in the use of cells, windows, crystals, and sampling accessories
    for your standards and unknowns. For example, KBr and NaCl are commonly used window
    materials in infrared spectroscopy, but have different optical properties. If
    a calibration is developed with a sample cell containing KBr windows, and unknown
    spectra are obtained with a cell with NaCl windows, the unmodeled spectral difference
    may be enough to introduce error into the predicted concentrations.


    14. Once a calibration is obtained and is working properly, occasionally check
    it by running a new standard and comparing its known and calculated concentrations.
    If the concentrations are similar, the calibration is still good. If the concentrations
    do not agree, then changes in the sample, sampling accessory, and instrument over
    time may have contributed to drift in quantitative results. You must track the
    source of variability, eliminate it, and run a new set of standards and new calibration
    line. Daily or weekly calibration can ensure accurate results and contribute to
    the peace of mind of the analyst.


    15. Different sampling techniques present their own quantitative analysis challenges.
    These are discussed in Chapter 4.


    Despite the problems listed here, quantitative FTIR are commonplace. The point
    to remember is that if you develop the method properly using the information contained
    here, you will have fewer problems later when the method is actually being used.


