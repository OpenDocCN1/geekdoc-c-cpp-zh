    # A. What Determines Resolution in an FTIR Scan?


    During an FTIR scan, as the moving mirror is translated the intensity of the interferogram
    is measured by the infrared detector at discrete optical path difference intervals.
    In many instruments this is approximately 0.6 microns. This gives an interferogram
    that consists of discrete data points, and the spectra calculated from them consist
    of discrete data points, as shown in Figure 2.21.


    The top of Figure 2.21 shows part of the spectrum of water vapor measured at 0.5
    cm⁻¹ resolution. Each x represents an individual data point, and there are over
