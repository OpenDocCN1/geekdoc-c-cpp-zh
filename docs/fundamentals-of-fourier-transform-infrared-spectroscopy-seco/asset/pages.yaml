    close enough to capture the width of the peaks. The bottom of Figure 2.21 shows
    part of the spectrum of water vapor measured at 32 cm⁻¹ resolution. The three
    data points are labeled for clarity, and there are no peaks seen because they
    fall between the measured data points.


    Since interferogram data points are obtained at evenly spaced intervals, high-resolution
    scans require more data points and greater optical path differences than low-resolution
    scans. Then there is a relationship between resolution and optical path difference
    as follows:


    > Resolution \propto 1/\delta


