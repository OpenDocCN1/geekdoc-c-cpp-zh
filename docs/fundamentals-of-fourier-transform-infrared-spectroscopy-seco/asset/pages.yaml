  md: 'more dilute in the reagent-grade material. Also, remember that the fundamental
    assumption of quantitative spectroscopy is that the calibration describes the
    samples and unknowns equally well. The reagent-grade and technical-grade acetone
    are chemically distinct, so a calibration for one should not be used for the other.


    +   3. Run standards in random order to ensure that sample order has no effect
    on the results.


    +   4. Obtain two spectra of each standard, and subtract them using a subtraction
    factor of 1.0 to see if a flat residual is obtained. If not, it means that a variable
    in the sample or the experiment has caused spectra of the same sample to be different.
    The source of variability must be found and eliminated before continuing.


    +   5. Obtain standards with accurate concentrations. The accuracy of a predicted
    concentration is no better than the accuracy to which we know the concentration
    in the standards.


    +   6. The minimum number of standards to run is 2n+2, where n is the number of
    analytes. Thus, the minimum number of standards to run is ([2+1]) or 4. However,
    running more standards typically will give a better calibration.


    +   7. Cleanliness is crucial! Thoroughly clean everything that comes in contact
    with before performing an analysis. Occasionally obtain the spectra of "clean"
    sample cells and accessories to check for contamination.


    +   8. Try to use absorbance bands that are less than 0.8 absorbance units in
    calibrations. Beer''s Law is frequently not obeyed by bands whose abundances are
    greater than this, which will manifest itself as a curvature in the calibration
    line.


    +   9. Make sure your sample components do not react with each other. This can
    be checked by obtaining spectra of the sample over time and looking for changes.
    Also, be aware of the materials the sample cell is made of and how they might
    react with any components in the sample. For example, KBr is a commonly used cell
    and window in infrared spectroscopy, but it is water soluble. Prior knowledge
    of the properties of cell and window materials can prevent this type of mistake.


    +   10. The physical condition of the standards and the unknowns, such as temperature
    and pressure, must be held constant when their spectra are acquired. Daily fluctuations
    in temperature and pressure are difficult to control because the weather. However,
    for example, do not intentionally run your standards at room temperature and measure
    an unknown spectrum at 150°C.


    +   11. Use all same instrumental parameters for the standards and unknowns including
    the number of scans, resolution, and spectral range. You don''t want the changing
    standards to change your results. Many instrument software packages allow you
    to save a set of instrumental parameters to the computer''s hard disk. By using
    the same parameter set for standards and unknowns, you ensure their spectra are
    measured under identical conditions.'
