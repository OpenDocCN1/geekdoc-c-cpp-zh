  md: '# Preparing Samples Properly


    # B. ADVANTAGES AND DISADVANTAGES OF REFLECTANCE SAMPLING


    In reflectance sampling takes extra mirrors to focus the light onto the sample
    and to collect the reflected light. These extra mirrors are contained in reflectance
    accessories that either mount on the base plate in the FTIR sample compartment
    or slide into the sample slide mount. These accessories must be custom built for
    the make and model of FTIR which they are going to be used. A problem with reflectance
    accessories is that they are thousands of dollars more expensive than transmission
    accessories. There are several companies that made customized FTIR reflectance
    accessories, and they can be found via an Internet search.


    Another problem with reflectance techniques is that it is not always possible
    to collect all the light it has reflected from the surface of a sample, which
    is particularly true for diffuse reflectance. As a result, reflectance spectrum
    can be noisy. Another problem with reflectance techniques is unknown pathlength.
    In transmission, the pathlength is the thickness of sample traversed by the beam.
    In reflectance the depth beam penetrates into the surface depends upon the angle
    of incidence, surface roughness, sample geometry, and the sample''s absorptivity,
    among others. Thus, we do not always have a precise idea of the pathlength in
    a reflectance sampling experiment. This difference pathlength is one of the variables
    in Beer''s Law (see Equation 1.6) that needs to be controlled to achieve accurate
    quantitative results.


    In transmission, the spectrum is of the bulk with little surface contribution.
    In reflectance, the light bounces off the surface of the sample so the surface
    contributes strongly to the overall spectrum. This sensitivity of reflectance
    techniques is good if you are interested in knowing the composition of the surface
    of a sample. However, if you are interested in the spectrum of a sample, and the
    surface and the bulk have different chemical compositions, the reflectance spectrum
    of the sample will not give a complete picture of the composition of the sample.


    After reading the litany of disadvantages for reflectance sampling techniques,
    you may wonder, why bother using them? Recall that transmission techniques suffer
    from an opacity problem, and getting around this can entail tedious, time-consuming,
    manual sample preparation. Reflectance techniques do not suffer from an opacity
    problem. There is no need to present the sample in beam film form, so the pressing,
    grinding, dissolving, and diluting that are typical of transmission analyses avoided.
    In general, samples for reflectance analysis are faster and easier to prepare
    than samples for transmission. Given the great pressure that labs are under today
    to run more efficiently, the opportunity to save time and money by using reflectance
    techniques makes sense. One of the noted noted above reflectance accessories is
    that they cost thousands of dollars. However, it is the author''s experience that
    in many cases, the time and money saved in preparation quickly pays for the cost
    of reflectance accessories. A final advantage of reflectance techniques is that
    they are nondestructive. Certain transmission techniques, such as KBr pellets,
    make it difficult to recover the sample. Some reflectance techniques allow the
    sample to be analyzed as is, preserving it. This can be useful if the sample is'
