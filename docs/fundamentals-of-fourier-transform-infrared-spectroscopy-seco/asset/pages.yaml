    and at other wavenumbers the unknown is more intense than the library spectrum.
    The sizes of the features in a residual are a measure of spectral similarity.
    The bigger the difference between two spectra, the greater the size of the features
    in their residual; the smaller the difference, the smaller the features in their
    residual. To quantify the features in a residual, the absolute values of the absorbances
    in the residual are calculated, giving all positive values (hence the name of
    the algorithm). They are then added together to give a single number, which is
    divided by the total number of data points used in the comparison. The formula
    for this calculation is as follows [13]


    ```

    HQI = (\sum |text{Lib}_i - \text{Unk}_i|)/n

    ```


    Where


    +   - HQI = Hit Quality Index

    - Lib$_i$ = Absorbances in library spectrum

    - Unk$_i$ = Absorbances in unknown spectrum

    - n = Number of data points in the spectrum

    - i = Index of data points


