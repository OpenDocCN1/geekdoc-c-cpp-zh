  md: '# 4 Preparing Samples Properly


    Properly samples for FTIR analysis is half the battle in obtaining a good spectrum—this
    chapter will help you win that battle by emphasizing what techniques work best
    on samples. You will learn to not waste time trying techniques that won''t work.
    There are two broad families of infrared sampling techniques—transmission and
    reflectance—so the sections of this chapter are organized by sampling method and
    sample type. For example, there will be sections on the transmission sampling
    of liquids and reflectance sampling of solids. The chapter also contains convenient
    tables summarizing the advantages and disadvantages of each sample preparation
    technique.


    # I. TRANSMISSION SAMPLING OVERVIEW


    In transmission sampling the infrared beam passes through a thin film of sample
    and impingines on the detector as shown in Figure 4.1.

    The Letter L in the figure denotes the pathlength of the sample, which is the
    thickness of sample encountered by the infrared beam. Since the beam passes through
    the entire sample, bulk contributions are emphasized and surface contributions
    are minimized, as shown in Figure 4.1. Sample thicknesses of 1 to 20 microns are
    typical. Transmission sampling should not be confused with transmittance, which
    is a y-axis used to plot spectrum, which was discussed in Chapter 1.


    An advantage of transmission sampling techniques is that they are practically
    universal; there are few sample types that will not yield usable spectra. An advantage
    of transmission sampling is that the tools needed to prepare the samples are relatively
    inexpensive—in general, transmission sampling tools cost less than reflectance
    sampling tools. A third advantage of transmission sampling techniques is that
    they often give spectra with a good signal-to-noise ratio, flat baseline, and
    clearly resolved sample features. Finally, many of these techniques have been
    used for over 50 years, and there is a history and tradition before them; people
    trust the results they obtain with transmission sampling. The advantages of transmission
    sampling are summarized in Table 4.1.


    Given the latency of transmission sampling advantages, why would you bother preparing
    samples any other way? Because transmission techniques suffer from what is called
    an opacity problem. Recall from Equation 1.6 that absorbance is proportional to
    the pathlength of pathlength times concentration. If the pathlength times concentration
    is too small, the sample will not absorb enough light, and no spectrum will be
    detected. If the product of pathlength times is too large, the sample will absorb
    all the light and the spectrum will contain'
