    ```

    P = F/A

    ```


    Where


    +   - P = Pressure

    - F = Force

    - A = Area


    As a particle''s size goes down its area increases, and grinding reduces particle
    size. For a constant force the amount of pressure on a small particle is greater
    than a large particle. Thus, smaller particles are easier to flatten, and will
    make better contact with an ATR crystal, and will give better spectra, as shown
    in Figure 4.62.


