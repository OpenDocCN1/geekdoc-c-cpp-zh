    The next optic the light beam encounters is the condenser, which focuses the light
    beam onto the sample. In some infrared microscopes the condenser consists of an
    arrangement of mirrors called a Cassegrain, which has a small convex mirror suspended
    above a concave mirror, as illustrated in Figure 6.2. Note that in this Cassegrain
    the concave mirror faces up. A hole in the concave mirror allows the infrared
    light through, it reflects off the convex mirror, and then the concave mirror
    focuses the light onto the sample. The sample is on a translation stage so it
    can be moved and down, left and right, and back and forth for focusing and viewing.
    Figure 6.2 shows the sample being examined in transmission mode, where light passes
    through the sample before being focused on the detector.


    The optic in a microscope that collects the light after it has interacted with
    the sample is called the objective. In many infrared microscopes it is another
    Cassegrain identical to the condenser, except that it has been flipped over and
    faces down. The concave mirror in the objective gathers the light that has interacted
