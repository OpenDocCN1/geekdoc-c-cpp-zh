  md: '# Fundamentals of Fourier Transform Infrared Spectroscopy


    absorbances together. For the band shown in Figure 5.6, the peak area was calculated
    by adding 40 different absorbances together. If one of these absorbances is inaccurate,
    it is averaged over the other 39 data points that are accurate. By using more
    data points, the calibration is less sensitive to error in any one specific data
    point. Additionally, by adding the absorbances together the signal-to-noise ratio
    for a peak area is greater than for a peak height. Thus, peak areas should produce
    more accurate calibrations because they are not dependent on a single data point,
    and the raw data has a better signal-to-noise ratio. However, there are examples
    of chemical systems where peak height calibrations work better than peak calibrations.
    The author recommends when establishing a calibration on a new chemical system
    peak areas be tried first. If you have difficulty getting a good calibration with
    peak areas, then try peak heights. There is no guarantee this will fix your calibration,
    but it might.


    # B. DEALING WITH OVERLAPPED PEAKS


    In an ideal world we would measure the absorbance of an analyte band that is baseline
    resolved and free from interference, an example of which is shown in Figure 5.6.
    However, in the real world there are samples analyte bands are overlapped with
    other molecules, such as the IPA peak in Figure 5.7, which is a shoulder superimposed
    upon much broader and stronger water band. How would we accurately measure the
    peak height or area?


    In general, you draw the baseline for shoulder peaks between minima to the left
    and right of the peak, and as much of the peak and exclude as much of the interfer
    as possible. This can be seen from the baseline drawn in Figure 5.7. The 2973
    cm⁻¹ peak in the figure was used to generate the calibration shown in Figure 5.3.
    This calibration is of high quality, indicating that the baseline end points were
    chosen.


    Another time when it can be difficult to measure absorbances is when a group of
    peaks overlap and are not baseline resolved, as illustrated in Figure 5.8.


