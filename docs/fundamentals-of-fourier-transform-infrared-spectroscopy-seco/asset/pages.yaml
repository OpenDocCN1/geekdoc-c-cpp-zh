  md: '# Fundamentals of Fourier Transform Infrared Spectroscopy


    processing can involve data compromise, and you should only process spectrum if
    there is a real need. Processing spectra just to make them look better is scientifically
    illegitimate. It''s not worth the risk of trashing your spectrum just to make
    a prettier picture. If your spectrum is of poor quality, study Chapters 2 and
    4 for ideas on how to change conditions or sample preparation to optimize spectral
    quality. If you still have problems, spectral processing can be legitimately applied.


    Rule 2 refers to having a clear understanding of how spectral processing algorithms
    work, how to use them, and the problems that can be encountered in their use.
    This understanding can be gained by reading this chapter, reading the documentation
    that came with your FTIR software package, and practice. For example, to properly
    interpret a spectral subtraction result you need to learn to recognize and ignore
    the artifacts that the process can introduce into a spectrum.


    Rule 3 says to always retain the original spectrum, which can be saved as a hard
    copy, stored on your computer''s hard disk, or archived at another location. Since
    spectral processing may involve data compromise, you need to save the original
    spectrum in case something goes wrong. You should process electronic copies of
    the original data, and you should never overwrite original data with processed.


    Rule 4 tells you to show your work. The information to record includes when it
    was performed, what software brand and version number were used, what algorithm
    and parameters were used, and what the manipulation was performed. This data can
    be written on a copy of the spectrum, recorded in a lab notebook, or saved in
    electronic form. Some software packages record or all of this information for
    you automatically. What matters is that this information recorded because processing
    a spectrum can alter its appearance, and anyone who looks at a spectrum needs
    to know what was done so they can take it into account when interpreting the spectrum.
    Also, publishing a processed spectrum without stating how and why it was processed
    is a form of scientific fraud—a behavior avoided if you value your career.


    The purpose of these rules is not to scare you away from using spectral processing,
    but to encourage you to use these algorithms properly so you can enjoy their benefits.


    # II. SPECTRAL SUBTRACTION


    Spectral subtraction is a spectral processing technique used to simplify spectra
    by removing unwanted contributions to a spectrum such as water vapor, CO2, solvents,
    impurities, interferents, and known components. Ideally, by removing these unwanted
    contributions, peaks of interest will be more easily observed. A good example
    of the power of spectral subtraction is shown in Figure 3.1.


    The sample spectrum in the bottom of Figure 3.1 is of solution of the amino acid
    glutamine dissolved in water. Sample spectra used in subtraction are typically
    mixtures containing some contamination that we wish to remove. Note that the broad,
    intense peaks of water in the sample spectrum make the glutamine peaks difficult
    to see. The reference spectrum in the middle of Figure 3.1 is of pure liquid water.
    Reference spectrum are typically of a pure substance that is also present in the
    sample.'
