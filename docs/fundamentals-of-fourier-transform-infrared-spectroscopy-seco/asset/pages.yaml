    $A_{unk} = \varepsilon l_{unk}$ (5.4)


    Where


    $A_{unk}$ = Absorbance of the unknown sample

    $\varepsilon l$ = The product of the absorptivity and pathlength

    $C_{unk}$ = The analyte concentration in the unknown sample


    Ultimately, it is the concentration of analyte in the unknown sample, $C_{unk}$,
    in which we are interested. Rearranging Equation 5.4 gives


    $C_{unk} = A_{unk}/\varepsilon l$


    From Equation 5.3 we know m = $\varepsilon l$, so


    $C_{unk} = A_{unk}/m$ (5.5)


    According to Equation 5.5, predicting the concentration of an analyte in the unknown
    sample is a matter of dividing the measured absorbance of the unknown sample by
    the slope of the calibration line. Note that to use Equation 5.5 you do not need
    to know the absorptivity and pathlength explicitly, just their product.


    In deriving Equation 5.5 we have assumed that $\varepsilon l$ is the same for
    the standards and the unknowns. This is another way of stating the fundamental
    assumption of quantitative spectroscopy, that the calibration applies equally
    well to standards and unknowns. This assumption is unavoidable since by $\varepsilon
    l$ is not known for the unknown samples. Making this assumption means you must
    control as many experimental variables as when performing quantitative spectroscopic
    analysis to ensure $\varepsilon l$ really constant for both the samples and unknowns.
    If for any reason you suspect this is not the case, the calibration should not
    be applied to unknown samples.


    # C. An EXPERIMENTAL PROTOCOL FOR SINGLE COMPONENT ANALYSES


    The following is an experimental protocol that, if followed, will help in the
    attainment of accurate analyte calibrations.


    +   1. Analyzing for a Single Analyte


    +   1. Prepare the standards. Be as accurate as possible since any concentration
    error in the standards is carried through as error in the predicted concentrations
    of the unknown samples.


