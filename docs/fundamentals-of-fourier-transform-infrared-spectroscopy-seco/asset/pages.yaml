  md: '# III. TRANSMISSION ANALYSIS OF POLYMERS


    Polymers, like powders, are solids at room temperature and in theory can be analyzed
    using KBr pellets or mulls. For hard polymers that can be ground into a powder,
    this works. However, polymers that are soft, rubbery, or too tough cannot be ground
    into powders and are not easy to analyze. Fortunately, there exist techniques
    for turning polymers into thin films, which allows them to be analyzed in transmission
    as described below.


    # A. THE CAST FILM METHOD


    Casting a film can refer to picking people to be in a movie, but here it refers
    to a method of preparing polymers for infrared transmission analysis. In this
    technique, the polymer is dissolved in a volatile solvent, which is required because
    the solvent is evaporated later. Examples of solvents that work well include acetone,
    methyl ethyl ketone, chloroform, methylene chloride, tetrahydro, and toluene.
    The polymer can be in any form, be it a sheet, formed part, chunk, or pellet.
    As long as the polymer will dissolve in a volatile solvent, in theory its spectrum
    can be measured. Thermos polymers, which consist of three-dimensional cross-linked
    polymer networks, hence cannot be analyzed using this technique. The amount of
    polymer and solvent used can be “eyeballed”, but more consistent results are obtained
    if the amount of polymer and solvent are measured.


    Once the polymer is dissolved, drops of the solution are placed onto the surface
    of an infrared window, and the solvent is allowed to evaporate. KBr windows are
    frequently used for this purpose, but other infrared transparent windows as described
    in Table 4.1 can be used as well. As the solvent it will leave behind a thin film
    of polymer. This is called “casting a film,” hence the name of the technique.
    To build up a sufficient film thickness, it may be necessary to apply several
    drops of solution to the window, allow it to evaporate, and then apply more drops
    in a step-wise fashion. This is illustrated in Figure 4.13.


    ![](img/d25eff8aaf4b0b214cf4015e62b7c990_114_0.png)


    FIGURE 4.13 The process of building up a cast polymer film by placing drops of
    solution on an IR transparent window. The hot plate is used to speed the evaporation
    of the solvent.'
