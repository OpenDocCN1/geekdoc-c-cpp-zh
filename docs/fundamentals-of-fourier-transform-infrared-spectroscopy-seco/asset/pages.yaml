    # A. THE SEARCH PROCESS


    Most commercial FTIR software packages are equipped with a library searching capability,
    or it can be purchased for an additional fee. When a spectral library search is
    performed, the unknown spectrum is compared to each spectrum in the libraries
    selected. If, there are 1000 spectra in a library, 1000 comparisons are performed.
    As a result of each comparison a name called the hit quality index (HQI) is calculated,
    which is a numerical measure of the similarity between two spectra. In an ideal
    world the library search will turn up a spectrum similar to the unknown spectrum.
    It is then assumed the unknown sample is chemically similar to the library sample.
    This way spectra can be used to identify unknown spectra. Library searching is
    so useful in identifying and interpreting mixture spectra that I encourage all
    FTIR users to have access to library searching capabilities.


    There are different types of library searches possible that are, in part, function
    of the software you are using. A text search uses keywords to find spectra in
    a library and is useful if you know the name of the spectrum you are seeking.
    For example, if you look up a reference spectrum of acetone, you could simply
    write this text into a dialog box and the software will show you any spectrum
    of acetone that may be contained in a library. Some libraries also contain physical
    property information such as melting points. So, if you have a sample with the
    melting point of 140°C you could look up the spectra of all materials with that
    melting point and compare your unknown spectrum to them.


    Another type of library searching is called peak searching. In this case the positions
    in your unknown spectrum are determined by an algorithm and are compared to the
    peaks in the library spectra determined by the same algorithm. This type of search
    was very popular in the past because it was fast and used very little computer
    memory. However, by only looking at the peaks in a spectrum, thousands of data
    points are ignored, reducing the accuracy of search results. With the advent of
    fast and powerful computers with large memories, it is no longer a need to perform
    peak searches to save computer time. However, peak searching can be useful if
    a spectrum is of very low quality. In this case by just including the peak positions
    in a search and leaving out all the bad data points, search quality may be enhanced.
    The type of library search most typically performed by FTIR search packages is
    a full spectrum search. In this type of search all the data points in a spectrum
    are used. Since more data are normally better, this type of search typically provides
    a more accurate comparison than peak searching.


    Before library search can be performed, a number of pieces of information must
    be entered into the software. Your unknown spectrum should be in absorbance since
    it will be compared to library spectra also measured in absorbance. Some software
    packages may be smart enough to convert a transmittance spectrum to absorbance
    before spectral comparisons are performed, but it cannot be guaranteed.'
