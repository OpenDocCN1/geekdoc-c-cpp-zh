  md: "# Fundamentals of Fourier Transform Infrared Spectroscopy\n\n# XI. ATR: ADVANTAGES\
    \ AND DISADVANTAGES\n\nATR enjoys a number of advantages compared to the other\
    \ Sampling techniques discussed in this chapter. It is a reflectance technique\
    \ and does not suffer from the opacity problem that plagues transmission methods.\
    \ As a result there is little grinding, squishing, pressing, and diluting to prepare\
    \ a sample for ATR analysis. For many samples there is little sample preparation—the\
    \ ATR crystal is cleaned, the sample is placed on the crystal, it is cleaned if\
    \ needed, the spectrum is measured, and the crystal is cleaned. This means ATR\
    \ is a fast and easy technique. Another advantage of ATR is the enormous variety\
    \ of samples—it works on liquids, semi-solids, polymers, powders, and solids.\
    \ The only sample type ATR cannot analyze is gases; it is hard to clamp a gas\
    \ to an ATR crystal. Also ATR can be nondestructive. Under most circumstances\
    \ the sample is not altered, damaged, or chemically changed by the analysis. This\
    \ is important if the sample is valuable, if you do not have much of it, or if\
    \ you need to preserve it for further analysis. Another advantage of ATR is that\
    \ it is useful for quantitation. Recall from Equation 1.6 that absorbance depends\
    \ upon pathlength. In an experiment the depth of penetration (DP) is a measure\
    \ of pathlength, and is given by Equation 4.2. The only sample-related variable\
    \ in the experiment is the refractive index of the sample, $n$. As long as $n$,\
    \ for the standards and samples fall within a range, DP will be effectively controlled,\
    \ making quantitation easier.\n\nFor all its advantages ATR has important disadvantages.\
    \ The crystal must be kept clean and scratch-free. Scratches are a problem because\
    \ they interfere with sample/hot spot. Be careful of towels—some of them contain\
    \ wool fibers that scratch ATR crystals such as ZnSe also be scratched by some\
    \ samples, which is generally not a problem with diamond crystals. Since the evanescent\
    \ wave passes above the crystal, any dirt or dust on the surface of the crystal\
    \ will contaminate the spectrum of the sample. Lastly, don't drop an ATR crystal\
    \ on the floor—it may break, and are not cheap to replace.\n\nAnother issue with\
    \ ATR is its wavelength range. Many ATR crystals absorb in the mid-infrared, which\
    \ is why there is a “wavenumber range” in Table 4.12. Specifically, diamond absorbs\
    \ between 2200 and 2000 $\text{cm}^{-1}$ and ZnSe absorbs below 700 $\text{cm}^{-1}$,\
    \ making sample features in the regions. Some ATR ZnSe lenses focus to the infrared\
    \ beam; for those accessories sample peaks between 2200 to 2000 $\text{cm}^{-1}$\
    \ and below 700 $\text{cm}^{-1}$ will be hidden. It is a good idea to have two\
    \ crystals with complementary wavenumber ranges to cover the entire mid-infrared.\
    \ For example, diamond and Ge are transparent from 4000 $\text{cm}^{-1}$ down\
    \ to 600 $\text{cm}^{-1}$. Before measuring any samples you should know what type\
    \ of ATR crystal you have and what wavenumber regions it masks so you can take\
    \ that into account when interpreting your sample spectrum.\n\nThe most significant\
    \ disadvantage of ATR is its lack of sensitivity, and the cause of the issue is\
    \ pathlength. The DP in ATR given by Equation 4.2 is rarely greater than 10 microns\
    \ and is less than 1 micron. At these shallow DPs the size of the absorbances\
    \ measured are relatively small, leading to a loss of sensitivity. In general,\
    \ ATR can only detect molecules present in concentrations greater than 0.1%."
