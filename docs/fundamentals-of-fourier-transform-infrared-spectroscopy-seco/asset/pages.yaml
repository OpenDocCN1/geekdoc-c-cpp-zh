  md: '# # Infrared Microscopy


    # ## I. HYPHENATED INFRARED TECHNIQUES


    Hyphenated techniques are obtained when two different types of instruments are
    mated together. The names of these techniques are constructed from the names of
    the instruments interfaced and then adding a hyphen. For example, the technique
    that interfaced a gas chromatograph to a mass spectrometer is called chromatography-mass
    spectrometry, or GC-MS for short. The purpose of hyphenated techniques is to allow
    multiple pieces of information to be obtained on the same sample by having two
    or more instruments working together. In GC-MS the gas chromatograph purifies
    the sample into its components and can quantify those components, and mass identifies
    each component. This provides a powerful technique for purifying, identifying,
    and quantifying measures. Hyphenated techniques make the use of FTIR to provide
    chemical information. Frequently, FTIRs are interfaced to instruments to provide
    physical information to give hyphenated techniques that provide physical and chemical
    information on the same sample.


    Although its name does not contain a hyphen, an infrared microscope is considered
    a hyphenated technique because it interfaces a microscope to an FTIR. The microscope
    provides physical information on samples including size, shape, color, and morphology.
    The sample can be illuminated with infrared light and its chemical composition
    decomposed [1,2]. Other examples of instruments that have been interfaced to FTIRs
    to give hyphenated infrared techniques include thermal analyzers, gas chromatographs,
    and liquid chromatographs [3–7].


    Many hyphenated infrared techniques have structural elements in common. In general,
    the infrared beam must be removed from the FTIR to interface with another instrument.
    This is accompanied by a “pickoff mirror” in the infrared beam after it leaves
    the interferometer, as shown in Figure 6.1.


    On some FTIRs the pickoff mirror is moved into and out of position via a motor
    under software control. On other instruments the mirror may need to be placed
    and moved by hand. Once the IR has reflected off the pickoff mirror it leaves
    the FTIR via a hole in the side of the instrument''s cover which is frequently
    covered with an infrared transparent window. Once the beam leaves the FTIR it
    enters an interface box that contains transfer optics and other devices, allowing
    the FTIR and the second instrument to work together.


    # ## II. INFRARED MICROSCOPY INSTRUMENTATION


    Infrared microscopes are used to take infrared spectra of small samples and are
    typically quality visible-light microscopes that have been re-engineered to work
    with mid-infrared radiation. In many cases the infrared microscope mounts on the
    side of'
