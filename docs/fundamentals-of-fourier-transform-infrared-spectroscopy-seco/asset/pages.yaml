    say the instrumental resolution used to measure the spectrum was 1 cm⁻¹. This
    is considered "high resolution." On the other hand, if the instrumental resolution
    changed so only 32 cm⁻¹ could be distinguished we would say the resolution used
    to measure the spectrum was 32 cm⁻¹. This is considered "low resolution." The
    confusing part is that this high resolution is denoted by small numbers and resolution
    by large numbers.


