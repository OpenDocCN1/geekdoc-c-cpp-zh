    analyzed because they will not escape and cause harm. A schematic diagram of how
    a sealed liquid cell is shown in Figure 4.22.


    A sealed liquid cell consists of two transparent windows, which are typically
    made from KBr or one of the other infrared transparent materials listed in Table
    4.1. Two small holes are drilled in one of the windows, as can be seen in Figure
