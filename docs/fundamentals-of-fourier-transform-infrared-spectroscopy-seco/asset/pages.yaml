    # II. TRANSMISSION ANALYSIS OF SOLIDS AND POWERS


    # A. KBr Pellets


    Potassium bromide (KBr) pellets are ground to obtain the infrared spectra of powders
    and anything that can be ground into a powder. KBr is used because it is inert
    and transparent over 400 cm⁻¹. In this technique, KBr and sample particles are
    mixed together. The KBr acts as an infrared transparent diluent, helping to reduce
    the product of pathlength concentration to keep the peaks on scale. Pressure is
    applied to the KBr/sample mixture, which flows into a glass, embedding sample
    particles in it. The resulting pellet holds sample particles in the infrared beam,
    allowing them to be analyzed in transmission.


    Here are the steps for preparing successful KBr pellets. First, the sample and
    the KBr must be reduced to the particle size less than 2 microns in diameter.
    Particles bigger than this scatter the infrared beam, whose intensity increases
    with wavenumbers and a sloping baseline, as seen in Figure 4.2.


    Manual grinding is performed with a mortar and pestle, but mechanical grinding
    can also be done (see below). For manual grinding, a gram or so of KBr should
    be placed in the mortar for at least 1 minute. While grinding you will notice
    the size of the crystals will decrease and the KBr will become pasty, stick to
    the sides of the mortar and a dull appearance. This is due to a reduction in scattered
    light intensity, indicating you have reached the correct particle size. The KBr
    and the sample should be ground in separate mortars. When ground together the
    heat and pressure of grinding may cause the KBr and sample to react with each
    other, altering the chemical composition of the sample.


    Once the grinding is accomplished the sample is diluted with the KBr; 1% to 10%
    sample should be sufficient. Weighing out the amounts gives more reproducible
    pellets. It is important that the sample be dispersed in the KBr; the sample needs
    to be homogeneous to ensure a typical spectrum is measured. An easy way to mix
    the sample and KBr together is to place them in a mortar and stir them with a
    spatula for one minute. Next, the sample/KBr mixture is placed in a press and
    put under 5 to 10 thousand PSI of pressure to create the pellet. There are a number
    of different presses on the market used to make KBr pellets. A “bolt press” consists'
