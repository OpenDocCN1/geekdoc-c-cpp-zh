  md: '# Glossary


    **Smoothing:** A spectral processing technique used to reduce the amount of noise
    in a spectrum.


    **Spectral Library; Spectral Libraries:** A collection of known infrared spectra
    stored to make it easier to compare them to unknown spectra.


    Spectral libraries can come in paper or digital form.


    **Spectral Library Searching:** See library searching.


    **Spectral Processing:** Refers to the practice of using a software program running
    on a computer to mathematically process and analyze the electronic version of
    a spectrum.


    **Spectral Subtraction:** A *spectral processing* technique where the absorbances
    of a reference spectrum are subtracted from the absorbances of a sample spectrum.
    The idea is to remove the bands due to the *reference* material from the sample
    spectrum.


    **Spectrometer:** An instrument that measures a *spectrum*.


    **Spectroscopy:** The study of the interaction of light with matter.


    A plot of measured light intensity versus some property of light such as *wavelength*
    or *wavenumber*.


    **Specular Reflectance:** Occurs when the *angle of incidence* of a light beam
    hits the surface and the *angle of reflectance* is reflected.


    **Split Mills:** The technique of using two different milling oils, namely Nujol
    and Fluorolube, to obtain two mills of the same sample. These two oils are transparent
    in different wavenumber ranges. By splicing the spectra of the two młs, a spectrum
    free of *milling* oil absorbances can be obtained.


    **Standards:** In quantitative analysis, samples that contain concentrations of
    the *analyte*. The absorbance of these samples is measured to obtain a *calibration*.


    **Subtract and Search Again:** A technique that combines a library search, a *spectral
    subtraction*, and a subsequent library search to identify the components in a
    mixture.


    **Subtraction Factor:** Also known as a “scale factor.” In *spectral subtraction*,
    a number that is multiplied the absorbances in the *reference spectrum* before
    it is subtracted from the *sample spectrum*. The purpose of the subtraction factor
    is to match the absorbance of the two spectra so the reference bands subtract
    out cleanly.


    **Surface Normal:** In reflection spectroscopy, a line drawn perpendicular to
    the reflecting surface.


    **Text Search:** In library searching, using one or more key words to search through
    a database to find spectrum with a given name or property.


    **Throughput:** A measure of the amount of light from the source that makes it
    to the detector.


    **Throughout Advantage:** A performance advantage enjoyed by FTIRs that enables
    them to measure spectra with good SNRs. It is a result of the fact that there
    are no slits, gratings, or prisms in an FTIR to reduce the amount of light impinging
    on the detector.'
