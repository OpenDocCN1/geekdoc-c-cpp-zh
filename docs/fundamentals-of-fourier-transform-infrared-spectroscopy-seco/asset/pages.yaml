    # VI. DECONVOLUTION


    In infrared spectra, two or more peaks can by chance fall on top of each other.
    A spectral processing technique called *deconvolution* (sometimes called Fourier
    self-deconvolution or FSD) can be used to mathematically enhance the resolution
    of a spectrum, allowing us to pull apart overlapped peaks to more clearly see
    what is going on in a crowded spectrum [2,4,11]. A group of overlapped peaks potentially
    in deconvolution is shown in the bottom of Figure 3.22.


    The top spectrum in Figure 3.22 is a successful deconvolution of the spectrum
    found in the bottom of Figure. Deconvolution has sharpened the spectrum, making
    features previously hidden by overlap easier to see. There are now six peaks in
    this region, but there were only four in the original spectrum. The deconvolved
    spectrum contains more peaks and more information than the original spectrum.
    So, when used properly, deconvolution enhances the information content of a spectrum.
    The deconvolution process is illustrated in Figure 3.23.


