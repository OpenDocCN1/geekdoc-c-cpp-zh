  md: '# 5 Quantitative Infrared Spectroscopy


    An important application of FTIR is quantitative spectroscopy, where infrared
    spectra are used to determine the concentrations of chemical species in samples.
    Entire books have been written on this subject [1], and a lengthy description
    of quantitative spectroscopy is beyond the scope of this volume. My goal is to
    introduce you to the fundamentals of quantitative spectroscopy by focusing on
    the determination of one chemical species at a time. Quantulating multiple chemical
    species at a time via infrared spectroscopy is doable proper technique, equipment,
    software, and skill and is discussed elsewhere [1].


    This chapter begins with an introduction to terms and definitions of quantitative
    analysis. Then Beer''s Law, the equation that relates peak size to concentration,
    is introduced. An illustration of how to calibrate and predict concentrations
    using Beer''s Law is presented. The chapter wraps up with practical advice on
    measuring absorbances and how to avoid experimental problems.


    # I. TERMS AND DEFINITIONS


    Like many fields, quantitative spectroscopy has its own jargon that must be learned
    before you can understand the topic. The following terms will be used throughout
    this chapter, and you should familiarize yourself with them.


    +   * Analyte – The chemical species whose concentration is being quantitated.

    * Analyst – The person performing the analysis.

    * Standards – Samples containing a known concentration of the analyte.

    * Calibration – A mathematical model that relates two or more sets of data to
    each other. Our interest will be in relating the size of the absorbance bands
    in infrared spectroscopy to concentration.

    * Unknown – The sample whose analyte concentration is sought.

    * Prediction – The process of applying a calibration to an unknown spectrum to
    obtain the analyte concentration of an unknown sample.


    Although it seems like a semantic nicely, it is imperative that you use the term
    prediction in quantitative spectroscopy to describe the process of finding the
    concentration in an unknown sample. The fundamental assumption of quantitative
    spectroscopy is that the calibration applies equally well to the standards and
    the unknowns. Despite careful experimental technique and the skills of the analyst,
    this assumption is not always true, and you may not necessarily know it. As a
    result the numbers obtained from quantitative spectroscopy inherently contain
    errors. Use of'
  merge: -1
  pgno: 161
- img_proc: true
  md: '# Fundamentals of Fourier Transform Infrared Spectroscopy


    the terms “calculate” and “determine” give the numbers an aura of certainty they
    do not possess. The terms “predict” and prediction are a better description of
    the truth behind these numbers.


    # II. BEER''S LAW


    Beer''s Law relates concentration, a sample property, to absorbance, a spectral
    property, and forms the basis for many quantitative spectroscopic analyses. It
    assumes that the spectrum is being measured using a transmission sampling method
    as illustrated in Figure 5.1.


    In Figure 5.1 the infrared beam impinges on a thin film of sample of pathlength
    L. The sample absorbs some of the infrared, and the light that passes through
    the sample is focused onto a detector to obtain the sample''s spectrum. Technically,
    reflectance spectra should not be used in Beer''s Law since it is assumed the
    experiment is in transmission. For DRIFTS experiments (Chapter 4) Kubelka-Munk
    units and the Kubelka-Munk equation should be used for quantitative analysis [2].
    In ATR (Chapter 4) the spectra are measured in absorbance and Beer''s Law is used
    for quantification, though technically this is incorrect since ATR is a reflectance
    technique. The fact that many quality calibrations have been obtained using ATR
    spectroscopy in absorption [1] indicates that this violation of Beer''s Law is
    generally not a problem.


    Beer''s Law applies to the absorbance process, whose energetics are illustrated
    in Figure 5.2. When interacting with a light beam the molecule is in low energy
    E₀ When molecules absorb energy from a light beam they are promoted to an upper
    energy level E₁. The amount of energy lost by the light beam equals the amount
    of energy gained by the molecule since the law of conservation of energy must
    be followed. FTIR detects the decrease in light intensity, giving a peak in the
    sample''s absorbance


    ![](img/d25eff8aaf4b0b214cf4015e62b7c990_162_0.png)


    **FIGURE 5.1** An illustration of transmission sampling where the infrared beam
    passes through the sample before impinging on the detector. The letter L denotes
    the pathlength, the thickness of the sample through which the IR beam passes.
    Beer''s Law is derived assuming this experimental setup.'
