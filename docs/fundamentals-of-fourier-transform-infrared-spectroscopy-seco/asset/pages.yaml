    broad feature. The top spectrum was measured with sufficient resolution to distinguish
    the peaks present in the spectrum of water vapor. These two spectra are of the
    same material but have radically different appearances because of the difference
    in instrumental resolution used. Also, note that the number of peaks in the high-resolution
    spectrum is greater than in the low-resolution spectrum. Since the peaks in a
    sample''s spectrum are more information in it than a spectrum with fewer peaks.
    Thus, in general, the higher the resolution the higher the information content
