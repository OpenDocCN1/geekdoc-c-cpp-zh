  md: '# Glossary


    **Hit Quality Index (HQI):** In library searching, the number that shows how closely
    matched a library spectrum is to a sample spectrum.


    **Hygroscopic:** The tendency of a material to absorb atmospheric water vapor.


    **Hyphenated Techniques:** When an FTIR is interfaced to an instrument that performs
    another type of analysis. The name is widely abbreviated with a hyphen and the
    letters *FTIR*, as in *GC-FTIR*. By interlacing *FTIRs* to other instruments,
    more information about a sample can be obtained more quickly and easily than by
    using two instruments to analyzeze the sample separately.


    **Infrared Imaging:** Images of samples using infrared light, which is accomplished
    using infrared microscopes with many detectors.


    **Infrared Microscope:** A microscope specially designed to handle infrared radiation.
    The microscope is interfaced to an FTIR and is used to take the spectra of small
    samples.


    **Infrared Microscopy:** Also known as infrared microspectroscopy. The technique
    of using an infrared microscope to obtain the *infrared spectrum* of microscopic
    samples.


    **Infrared Radiation:** The portion of the *electromagnetic spectrum* from 14,000
    to 4 cm⁻¹. This type of light is higher in wavelength than radio and microwaves,
    which is lower in wavelength than visible light. Infrared radiation is the same
    thing as heat. It is divided into the near, mid and far infrared.


    **Infrared Spectrometer:** An instrument that is used to obtain the *infrared
    spectrum* of a sample.


    **Infrared Spectroscopy:** The study of the interaction of *infrared radiation*
    with matter.


    **Infrared Spectrum:** A plot of measured infrared intensity versus wavenumber.


    **In Phase:** The condition when two waves overlap.


    **Instrument Response Function:** The portion of a *background spectrum* due to
    the instrument. The instrument''s components, such as mirrors, detector, and the
    beamsplitter, all contribute to this function.


    **Interference,** When two waves occupy the same volume their amplitudes add to
    form a single wave. The two waves are said to interfere with each other to produce
    a resultant wave.


    **Interferogram:** A plot of infrared detector response *optical path difference*.
    The fundamental measurement obtained by an FTIR is an interferogram. Interferograms
    are *transformed to generate infrared spectra*.


    **Interferometer:** An optical device that takes beam of light and splits it into
    two beams of light. The two beams travel different paths, are recombined, and
    then leave the interferometer. There is an interferometer at the head of every
    FTIR. Interferometers measure interferograms.


    **KBr Pellet:** A *transmission sampling* technique most commonly used on powders
    and solids. The technique involves grinding the sample and KBr, diluting the sample
    in the KBr, pressing the mixture to produce a transparent pellet. The pellet is
    placed directly in the infrared beam.


    **Kubelka-Munk Units:** Y-axis units used to diffuse reflectance spectra when
    they are used for quantitative analysis.'
