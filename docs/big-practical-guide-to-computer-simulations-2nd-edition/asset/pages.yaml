- pgno: 24
  md: 'options, which are all described in the manual pages. Under UNIX/Linux, you
    can access the manual via the man command, i.e. by entering “man cc”.


    Now we come back to the structure of the program first.c. The first line includes
    a file. This means that the file stdio.h contains some definitions which the compiler
    should read before proceeding with the compilation process. In this case, stdio.h
    contains declarations of some built in standard functions for input/output i/o.
    The compiler needs these declarations, because it has to know, for example, how
    many parameters are passed to the function. The files containing declarations
    are usually called header files, hence the suffix is .h. In this example, the
    compiler needs the definition of the subroutine printf(), which means print formatted
    (see below). Note that the actual definitions of the subroutines, i.e. the code
    for the subroutine, is not contained in the header files, but in libraries (see
    page 17) and Sec. 7.1.


    The main program of every C program is called main(), which comprises the remaining
    file of first.c. In fact, all codes which do something in C programs are functions,
    i.e. they take some arguments and return something. Hence, main() is also a function.
    Here, it takes zero arguments, indicated by the fact that nothing is written in
    the brackets () after the name (main) of the function in line three. Below, you
    will learn how to pass to main() some arguments via the command line. By default,
    the function main() returns an integer value, which is indicated by the int in
    front of the function name.


    The definition of a function, i.e. the program code which is executed when the
    function is called, is contained inside the pair {...} of brackets (lines 4-7).
    Note that the opening and closing brackets are written below each other for readability,
    but this is not required by the compiler. You could have written everything in
    one line, or insert many empty lines, etc. Also, the position inside a line does
    not matter at all, e.g. your program could look like


    ```

    ```c

    #include <stdio.h>

    int

    main

    (){

    printf(

    "My first program\n");      return(0);

    }

    ```

    ```'
