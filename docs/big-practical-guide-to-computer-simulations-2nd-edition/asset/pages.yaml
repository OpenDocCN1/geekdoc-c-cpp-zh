    0.14 28.56 0.04 1 0.04 28.55 all1


    The running time spent in calc_prod() has basically not changed. Note that small
    fluctuations are always observed, even between different runs of identical programs.
    The reason is that the running time of a process depends on the environment. Of
    particular importance is how often a memory location can be found in the fast
    but small on-chip cache memory and how often the comparable slower main memory
    has to be accessed.


    The running time of calc_sum_rec() is much larger than that of calc_sum() due
