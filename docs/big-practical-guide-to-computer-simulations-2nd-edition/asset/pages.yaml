  md: "For a fair coin, both sides would appear with the same probability, hence one\
    \ has $P(\\emptyset)=0$, $P(\\{head\\})=0.5$, $P(\\{tail\\})=0.5$, $P(\\{head,\
    \ tail\\})=1$.\n\nFor the hot gas inside the container, the forces act on the\
    \ atoms. Then the atoms are distributed uniformly. Thus, when measuring the $x$\
    \ position of an atom, the probability to find it inside the region $A=[x, x+\\\
    Delta x]\\subset\\Omega^{(x)}$ is $P(A)=\\Delta x/L_x$.\n\nThe usual set operations\
    \ applies to events. The intersection $A\\cap B$ of two events is the event which\
    \ contains elements that are both in $A$ and $B$. Hence $P(A\\cap B)$ is the probability\
    \ that the outcome of an experiment is contained in both events $A$ and $B$. The\
    \ complement $A^c$ of a set is the set of all elements of $\\Omega$ which are\
    \ not in $A$. Since $A^c$, $A$ are disjoint and $A\\cup A^c=\\Omega$, we get from\
    \ Eq. (8.2):\n\n$P(A^c)=1-P(A).$ (8.3)\n\nFurthermore, one can show for two events\
    \ $A,B\\subset\\Omega$:\n\n$P(A\\cup B)=P(A)+P(B)-P(A\\cap B)$ (8.4)\n\n**Proof.**\
    \ $P(A)=P(A\\cap\\Omega)=P(A\\cap(A\\cup B)^c)=(P((A\\cap B)\\cup(A\\cap B^c))$\
    \ $^{(8.2)}$ $P(A\\cap B)+P(A\\cap B^c)$. If we apply this for $A\\cup B$ instead\
    \ of $A$, we get $P(A\\cup B)=P((A\\cup B)\\cap B)+P((A\\cup B)\\cap B^c)=P(B)+P(A\\\
    cap B^c)$. Eliminating $P(A\\cap B^c)$ from these two equations gives the desired\
    \ result.\n\nNote that Eqs. (8.2) and (8.3) are special cases of this equation.\n\
    \nIf a random experiment is repeated several times, the possible outcomes of the\
    \ repeated experiment are tuples of outcomes of single experiments. Thus, if you\
    \ throw the coin twice, the possible outcomes are (head,head), (head,tail), (tail,head),\
    \ and (tail,tail). This means the sample space is a power of the single-experiment\
    \ sample spaces. In general, it is also possible to combine different random experiments\
    \ into one. Hence, for the general case, if k experiments with sample spaces $\\\
    Omega^{(1)},\\Omega^{(2)},...,\\Omega^{(k)}$ are considered, the sample space\
    \ of the combined experiment is $\\Omega=\\Omega^{(1)}\\times\\Omega^{(2)}\\times...\\\
    times\\Omega^{(k)}$. For example, one can describe the measurement of the position\
    \ of the atom in the hot gas as a combination of the three independent random\
    \ experiments of measuring the $x$, $y$, and $z$ coordinates, respectively.\n\n\
    If we assume that the different experiments are performed independently, then\
    \ the total probability of an event for a combined random experiment is the product\
    \ of the single-experiment probabilities: $P(A^{(1)},A^{(2)},...,A^{(k)})=P(A^{(1)})P(A^{(2)})...P(A^{(k)})$.\
    \ \n\nFor tossing the fair coin twice, the probability of the outcome (head,tail)"
