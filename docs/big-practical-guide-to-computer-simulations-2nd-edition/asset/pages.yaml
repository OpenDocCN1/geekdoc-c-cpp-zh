  md: "# 7.3 GNU scientific library\n\nThe GNU Scientific library (GSL) [Galassi et\
    \ al. (2006)] contains a huge number of subroutines that can be used to solve\
    \ standard numerical problems. Amongst other things, the library features:\n\n\
    +   - complex numbers and functions\n+   - polynomials\n+   - evaluation, differentiation\
    \ and integration of functions\n+   - performing interpolations\n+   - Fourier,\
    \ wavelet and Hankel transforms\n+   - minimizing functions\n+   - diagonalization\
    \ of matrices\n+   - solving linear equations (through matrix inversion)\n+  \
    \ - random numbers\n+   - statistics/histograms\n+   - fitting data\n+   - solving\
    \ nonlinear equations\n+   - solving ordinary and partial differential equations\n\
    +   - Monte Carlo simulation and simulated annealing\n\nSome of the functionality\
    \ comes through a C interface to the BLAS (basic linear algebra subroutines) package,\
    \ which is originally implemented using Fortran. The library is under continuous\
    \ development. Note that it comes under the GNU General Public License (GPL).\
    \ This means the library is free, including the source code. You are allowed to\
    \ extend and to modify the library. You can include it into other software, provided\
    \ it is also free (GPL) if it is distributed as well.\n\nWe start to explain the\
    \ usage via a simple example: We want to print a table of the probability mass\
    \ function of the Binomial distribution, defined in Sec. 8.1.1. For this and related\
    \ purposes, the GSL offers functions for different distributions. When using any\
    \ of these, one has to include the header file gsl/gsl_randist.h. Similar header\
    \ files exist for the other sections of the GSL. The function to calculate the\
    \ probability mass function of the Binomial distribution has the following prototype:\n\
    \n```\ndouble gsl_ran_binomial_pdf(const unsigned int x, const double p,\n   \
    \ const unsigned int n);\n```"
