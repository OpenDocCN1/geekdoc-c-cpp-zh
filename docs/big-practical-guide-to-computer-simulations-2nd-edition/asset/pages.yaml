    So far, all examples were for the case of one author or, if the access rights
    for the repository are set accordingly, also for several authors. In any case,
    the repository is accessed only locally.


    Often, people from different places cooperate in a project. In this case, one
    must have access to the repository across the web. For the web access, your local
    system administrator has to install a server. There are currently two possibilities.
    The first one is to use *svnserve*, which is very fast. Practically, when setting
    up a repository, you have usually to use a special directory as parent directory;
    please ask your system administrator. After creating your repository, you should
    create or change the `passwd` file in the conf subdirectory of your repository,
    e.g.


    ```

    [users]

    alex = project1

    bernd = project2

    stefan = project3

    ```


    This creates three “users” (not to be confused with the normal user accounts on
    your system) for the repository, which have the passwords `project1`, `project2`
    and `project3`, respectively. Note that the passwords are not encrypted; hence,
    you should not use very secret passwords for this purpose.


    Furthermore, in the svnserve.conf file in the same conf subdirectory, you have
    to uncomment the following lines (i.e. remove the # symbol in front of them):'
