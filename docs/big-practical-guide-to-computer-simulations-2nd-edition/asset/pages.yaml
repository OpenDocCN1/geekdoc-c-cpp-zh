  md: "function rand() for a uniform distribution. Each time rand() is called, a new\
    \ (pseudo) random number is returned. (Now the \"pseudo\" is omitted for convenience)\
    \ These random numbers should \"look like\" true random numbers and should have\
    \ many of the properties of them. One says they should \"be good.\" What \"look\
    \ like\" and \"good\" means, has to be specified: One would like to have a random\
    \ number generator such that each possible number has indeed the same probability\
    \ of occurrence. Additionally, if two generated numbers r_i, r_k differ only slightly,\
    \ the random numbers r_{i+1}, r_{k+1} returned by the respective subsequent calls\
    \ should differ substantially, hence consecutive numbers should have a low correlation.\
    \ There are many ways to specify a correlation, hence there is no unique criterion.\
    \ Below, the simplest one will be discussed.\n\nThe simplest methods to generate\
    \ pseudo random numbers are linear congruential generators. They generate a sequence\
    \ x_1, x_2, ... of integer numbers between 0 and m - 1 by a recursive rule:\n\n\
    x_{n+1} = (a x_n + c) mod m .        (8.47)\n\nThe initial value x_0 is called\
    \ seed. Here we show a simple C implementation lin_con(). It stores the current\
