    \ define an array which contains all persons of the simulation:\n\n```\nint num_persons\
    \ = 100;\nstruct person pers[num_persons];\n```\n\nThe access to the different\
    \ members of the elements of the pers array is obtained by combining the access\
    \ methods for arrays with the access method for structures. For example, to initialize\
    \ the marital status of all persons to 0 one could use:\n\n```\nfor(p=0; p<num_persons;\
    \ p++)\n  pers[p].status = 0;\n```\n\nPlease note that pers.status=0 is not correct\
    \ in this case. It would be correct, if pers contained as member an array status.\n\
    \nSometimes, it is useful to declare new names for data types, in particular if\
    \ they are of complicated form like pointers to functions (see Sec. 1.4). The\
    \ typedef construct serves this purpose. The format is the same as that of a single\
    \ variable definition, but preceded by the keyword typedef, i.e.:\n\n```\ntypedef\
    \ {type} {type name};\n```\n\nConsequently, the name given is now for a \"new\"\
    \ type, not for a variable. For example, to define the new type name person_t\
    \ for the person structure, one could write\n\n```\ntypedef struct person person_t;\n\
    \nperson_t p1, p2;\n```"
