    # 9.3.1.9 Self-defined commands and lengths


    Finally, we note that you can create your own commands or lengths or your own
    environments. Here, we show one example for a self-defined command, which can
    be used in math mode:


    ```

    \newcommand{\pd}[2]{\frac{\partial #1}{\partial #2}}

    ```


    The new command is called \pd, as shown by the first argument of \newcommand.
    The new command itself has two arguments, indicated by the option [2]. The arguments
    can be addressed using #1 and #2 in the command definition, which comes last.
    Here, the \pd command is used to construct a formula for a partial derivative,
    using the two arguments. For example, Eq. (8.95) on page 365 was generated using:


    ```

    \begin{equation}

    \pd{(\myvec{\theta})}{\theta_k} \stackrel{!}{=} 0 \quad

    (k=1,\ldots,n_{\rm p})

    \end{equation}

    ```


    A new length can be introduced anywhere in the source file via using the \newlength
    command with the name of the new length, including a leading backslash, as argument,
    e.g.


    ```

    \newlength{\fieldwidth}

    ```


    The length, a self-defined or a LaTeX-predefined one, can be set using \setlength
    with the name of the length (with backslash) and the actual length as arguments.
    The latter one can be given in real units or in multiples of an existing length:


    ```

    \setlength{\fieldwidth}{0.3\columnwidth}

    ```'
