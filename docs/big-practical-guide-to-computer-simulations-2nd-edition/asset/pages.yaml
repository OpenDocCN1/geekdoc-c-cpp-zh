  md: 'continuous random variable, the choice of the bin width is important. Basically,
    you have to adjust the width manually, such that the sample data is represented
    “best”. Thus, the bin width should not be too small nor too large. Sometimes a
    non-uniform bin width is the best choice. In this case no general advice can be
    given, except that the bin width should be large where few data points have been
    sampled. This means that each bin should contain roughly the same number of sample
    points. Several different rules of thumb exist for uniform bin widths. For example
    $b=3.49 S n^{-1/3}$ [Scott (1979)], which comes from minimizing the mean integrated
    squared difference between a Gaussian pdf and a sample drawn from this Gaussian
    distribution. Hence, the larger the variance $S$ of the sample, the larger the
    bin width, while increasing the number of sample points enables the bin width
    to be reduced.


    In any case, you should be aware that the histogram pdf can be only an approximation
    of the real pdf, due to the finite number of data points and due to the underlying
    discrete nature resulting from the bins. The latter problem has been addressed
    in recent years by so-called *kernel estimators* [Dekking et al (2005)]. Here,
    each sample point $x_i$ is represented by a so-called *kernel function*. A kernel
    function $k(x)$ is a peaked function, formally exhibiting the following properties:


    +   - It has a maximum at 0.

    +   - It falls off to zero over some distance $h$.

    +   - Its integral $\int k(x)\,dx$ is normalized to one.


    Often used kernel functions are, for example, a triangle, a cut upside-down parabola
    or a Gaussian function. Each sample point $x_i$ is represented such that a kernel
    function is shifted having the maximum at $x_i$. The estimator $\hat p(x)$ for
    the pdf is the suitably normalized sum (factor $1/n$) of all these kernel functions,
    one for each sample point:


    $$\hat p(x)=\frac{1}{n}\sum_i k(x-x_i) \qquad (8.68)$$


    The advantages of these kernel estimators are that they result usually in a smooth
    function $\hat p$ and that for a value $\hat p(x)$ also sample points more distant
    from $x$ may contribute, with decreasing weight for increasing distance. The most
    important parameter is the width $h$. A too small value of $h$ will result in
    many distinguishable peaks, one for each sample point. A too large value of $h$
    leads to a loss of important details. This is of similar importance as the choice
    of the bin width for histograms. The choice of the kernel function'
