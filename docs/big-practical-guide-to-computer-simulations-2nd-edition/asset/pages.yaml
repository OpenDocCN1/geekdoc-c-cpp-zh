    # Citation data bases


    In every scientific paper, some other articles are cited. Sometimes it is interesting
    to get the reverse information, i.e. to obtain all papers which are citing a given
    article A. This can be useful, if one wants to learn about the most recent developments
    which are triggered by article A. In that case you have to access a citation index.
    For science, probably the most important is the *Science Citation Index* (SCI)
    which can be accessed via the *Web of Science* [Web of Science]. There is also
    a version for social sciences. You have to ask your system administrator or your
    librarian, whether and how you can access it from your site. The *American Physical
    Society* (APS) [APS] also includes links to citing articles with the online versions
    of recent papers. If the citing article is available via the APS as well, you
    can immediately access the article from the Internet. This works not only for
    citing papers, but also for cited articles.


    # Papercore summary database


    *Papercore* [*Papercore*] is an online data base for summaries of scientific journals,
    see screenshot in Fig. 9.1. The data base also contains review-type documents
    which introduce a scientific field and collect links to corresponding summaries.
    The summaries go much beyond abstracts, since they are about 1/10 of the length
    of the corresponding papers. They should contain all necessary information one
    would remember long-time after thoroughly reading a paper. In particular the summaries
    may contain formulas, figures and links to other summaries, as well as the full
    bibliographic information of the papers. Thus, when reading summaries, a scientist
    can save a lot of time, e.g. when getting an overview over a field. Also writing
    summaries is very beneficial, because it forces the summary author to understand
    a paper much deeper compared to just reading it. This is particular useful for
    PhD students, who in this way learn their field as well as scientific writing
    much better. The author of this book himself has summarized more than 100 papers
    and also the students of his group have been benefiting much from contributing
    to *Papercore*.

    *Papercore* can be accessed online from everywhere and is free of charge. Everybody
    can immediately read summaries. After free registration, everybody can submit
    summaries and alter already existing summaries, similar to the Wikipedia encyclopedia.
    An important difference is that the summaries can be submitted conveniently as
    LaTeX files. One can'
