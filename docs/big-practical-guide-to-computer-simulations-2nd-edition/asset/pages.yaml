- pgno: 454
  md: '![](img/0dfb82b7d27bdfebb8b65cb33de3626a_454_0.png)


    Fig. 9.9 The second slide of the test presentation using LaTeX together with the
    beamer class. Note that this slide changes dynamically. The current situation
    is the first stage of this slide. The next one (see text) will show a different
    figure in the lower right corner, after you hit the space bar on your computer
    when viewing the file.


    dynamically. Here, we mention in particular the overprint environment.


    In our example, this looks like


    ```

    ```latex

    \begin{overprint}

    \onslide<1>\centerline{

    \includegraphics[width=0.8\textwidth,height=0.6\textwidth]

    {slide_group/opt_problem}}


    \onslide<2>

    \centerline{\includegraphics[width=0.9\textwidth,height=0.5\textwidth]

    {slide_group/function2dB}}

    \end{overprint}

    ```

    ```


    Note that some of the arguments to beamer-class commands are given in angular
    brackets < >, like in this example: As indicated by the \onslide<1> command, initially
    the figure file opt_problem.pdf will be shown on the slide.⁶ When you hit the
    space bar on your laptop during the presentation, next, the figure file function2dB.pdf
    will be shown at the same place. Technically, the testtalk.pdf file just contains
    two different slides, which are identical except the areas tagged by the \onslide
    commands. You'
  merge: -1
  img_proc: true
- pgno: 455
  md: 'will notice this immediately if you look at testtalk.pdf in non-full-screen
    mode, but when using full-screen mode, it looks like the slides change dynamically.
    Note that the numbers given along the \onslide commands are always only for the
    current frame. Thus, for the next frame, it starts with 1 again. Furthermore,
    you can give also ranges such as \onslide<1-3> or \onslide<2>. Thus presentations
    can be created, which change dynamically in a quite complex way. You can, for
    example, explain how your simulation algorithm works, by showing how it performs
    on a small sample. For this purpose, you prepare different figures showing the
    sample at different stages of the algorithm and use the overprint environment
    as shown above. To avoid that the figures ''wiggle'' during the presentation,
    you should make sure that all figure files which are shown on the same position
    have exactly the same size.⁷


    You should know that you can give these ranges also along with standard \item
    commands in an itemize environment, such as \item<1> ... \item<2> ... \item<3>.
    This allows a slide to be unfolded stepwise, one or several items at a time.⁸
    Finally, please do not forget to close each frame environment by \end{frame}.


    These examples should be enough to enable you to create nice-looking standard
    presentations rather quickly. To learn more about other features of the beamer
    class and to become an expert, please consult the beamer manual.'
  merge: -1
  img_proc: true
- pgno: 456
  md: '# Appendix A


    # Supplementary Materials


    From the website: http://www.worldscientific.com/r/9019-supp, you will find all
    example programs and scripts used throughout this book, as well as the solutions
    to exercises.


    We assume that you have a standard C compiler available. In any case, all programs
    run under a Linux environment, which is available free of charge. For some applications,
    you need further tools. All tools used in this book can be obtained free of charge.


    The content of the supplementary materials is as follows:


    The directory programs contains the source codes of the C/C++ programs and some
    scripts, as well as the solutions to exercises. For each chapter, there is a corresponding
    subdirectory, in the order of appearance in the book:


    +   c-programming

    +   scripts

    +   se

    +   debugging

    +   oop

    +   algorithms

    +   libraries

    +   randomness

    +   literature


    Each directory contains a README file, which shortly describes the contend of
    the programs and how to compile and run them.'
