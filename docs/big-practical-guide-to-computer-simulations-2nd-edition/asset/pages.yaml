  md: '# Chapter 9


    # Information Retrieval, Publishing and Presentations


    When you need the information given in this chapter, you have advanced very far,
    congratulations! You have almost completed a full cycle of a scientific computer
    simulation project. The results of your simulations are analyzed and now you want
    to prepare a publication or give a talk.


    In this chapter, some basic information about preparing your own presentations
    and publications is given. Since it fits best here, it is also explained how to
    search for literature and other science-related information, although you need
    to do this at all stages of a project.


    The tools described in this section, should allow you to solve all technical problems
    occurring in the process of preparing a publication (a "paper"). Once you have
    prepared the paper, usually together with some coauthors, you should give it to
    at least one other person, who should read it carefully. Probably, he/she will
    find some errors or indicate passages which might be difficult to understand or
    misleading. You should always take such comments very seriously, because the average
    reader knows much less about your problem than you do.


    When all necessary changes have been performed, and you and other readers are
    satisfied with the publication, you can submit it to a scientific journal. You
    should choose a journal which suits the content of your paper. Where actually
    to submit, you should discuss with experienced researchers, often your coauthors.
    It is not possible to give general advice on this issue. Nevertheless, technically
    the submission can be performed electronically over the Internet for almost all
    journals. Submitting one paper to several journals in parallel is not allowed.
    However, you should consider submitting also to a preprint server [arXiv] to make
    your results quickly available to the science community. Most journals allow that
    you make a preliminary version available in advance. Read the submission conditions
    carefully! You'
