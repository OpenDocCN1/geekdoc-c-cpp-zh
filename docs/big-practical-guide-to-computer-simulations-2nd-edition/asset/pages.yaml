  md: 'closest clusters $c_{i_{\min}}$ and $c_{j_{\min}}$, i.e., where

    $$i_{\min},j_{\min} = \operatorname{argmin}_{i,j} d_c(i,j),$$

    are merged into one new single cluster $k = c_{i_{\min}} \cup c_{j_{\min}}$. Thus,
    within the first step, two clusters containing a single data point each will be
    merged. During the next steps, single-data point clusters or multiple-data point
    clusters will be merged. This is illustrated in Fig. 8.45. During each iteration
    the number of clusters will be decreased by one, hence, this process stops after
    $n - 1$ iterations when all data points are collected in one single cluster. The
    merging process can be represented by a tree, called dendrogram: The leaves of
    the tree are given by the initial data points, i.e., the clusters $c_1, \dots,
    c_n$. Whenever two cluster are merged, a new (non-leaf) node is created, which
    has the two clusters as descendants. Therefore, the root of the tree is the node
    which has those two clusters as descendants, which were joined during the last
    iteration. Note when drawing the tree, it is convenient to order the leaves on
    the $x$-axis according to their appearance during a tree traversal, e.g. an inorder
    traversal (see page 190 in Sec. 6.7).


    The most important point is that when creating a cluster $c_k$ through a merger
    of $c_{i_{\min}}$ and $c_{j_{\min}}$, one has to provide new distances $d_c(k,l)$
    of the new cluster $c_k$ to all other clusters $c_l$ with $l \neq i_{\min}$ and
    $l \neq j_{\min}$. Different approaches are possible. Here, we use the average-linking
    clustering, where the distance between two cluster $c_k, c_l$ is the average distance
    of the data points in the two clusters:

    $$d_c(k,l) = \frac{1}{|c_k||c_l|} \sum_{i \in c_k, j \in c_l} d(i,j),$$

    where $|c_k|$ and $|c_l|$ represent the number of data points in the clusters
    $c_k$ and $c_l$, respectively. Thus, when cluster $c_k$ is created by merging
    $c_{i_{\min}}$ and $c_{j_{\min}}$, the distance of new cluster $c_k$ to all other
    clusters $c_l$ can be conveniently calculated via

    $$d_c(k,l) = \frac{1}{|c_k|} \left\{ |c_{i_{\min}}| d(i_{\min},l) + |c_{j_{\min}}|
    d(j_{\min},l) \right\}.$$


    Many other choices for calculating cluster distances exists, basically they only
    have to have the property that the distances between clusters are monotonically
    increasing when merging. Common examples are taking the minimum or the maximum
    of the point-wise distances between the nodes of the cluster, specifying single-linkage
    and complete-linkage clustering. Another widely used method is Ward’s approach,
    where the geometric centers'
