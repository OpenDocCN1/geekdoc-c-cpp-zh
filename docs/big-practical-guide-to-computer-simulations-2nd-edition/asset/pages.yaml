    \ as well. To count the number of events which are outside the range of the table,\
    \ the entries low and high are introduced. Furthermore, statistical quantities\
    \ like mean and variance should be available quickly and with high accuracy. Thus,\
    \ several accumulated moments sum[] of the distribution are stored separately\
    \ as well. Here, the number of moments _HISTO_NOM_ is defined as a macro, converting\
    \ this macro to variable would be straightforward. Altogether, this leads to the\
    \ following C data structure:\n\n| GET SOURCE CODE |\n|---| \n| DIR: oop |\n|\
    \ FILE(S): histo.h |\n\n```\n#define _HISTO_NOM_ 9  /* No. of (statistical) moments\
