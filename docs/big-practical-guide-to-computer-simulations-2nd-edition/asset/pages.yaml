    # 8.5.1 Chi-squared test


    The chi-squared test is a method to compare histograms and discrete probability
    distributions. The test works also for discretized (also called binned) continuous
    probability distributions, where the probabilities are obtained by integrating
    the pdf over the different bins. The test comes in two variants:


    +   - Either you want to compare the histogram {h_k} for bins B_k (see Sec. 8.3.3)
    describing the sample {x_0, x_1, ..., x_{n-1}} to a given discrete or discretized
    probability mass function with probabilities {p_k} = P(x ∈ B_k). The null hypothesis
    H_0 is: "the sample follows a distribution given by {p_k}". Note that the probabilities
    are fixed and independent of the data sample. If the probabilities are parametrized
    and the parameter is determined by the sample (e.g. by the mean of the data) such
    that the probabilities fit the data best, related methods as described in Sec.
    8.6.2 have to be applied.

    +   - Alternatively, you want to compare two histograms {h_k}, {ĥ_k} obtained
    from two different samples {x_0, x_1, ..., x_{n-1}} and {x̂_0, x̂_1, ..., x̂_{n-1}}
    defined for the same bins B_k. The null hypothesis H_0 is: "the two samples follow
    the same distribution". 15


