  md: 'As a very simple example of useful and general-purpose data structures, we
    consider binary search trees, where we want to store a set S of elements e, which
    can be ordered according to some value of a key k(e), like in Sec. 6.3, where
    the mergesort algorithm was presented. For simplicity, we assume that for each
    possible value of the key at most one element is present. Here, it is desirable
    to be able to test very quickly whether an element with a certain value of the
    key is present in the data structure. Also, we assume that constantly elements
    may be added or removed while the elements should preserved sorted. It would be
    too slow to sort the data again after each change. Thus, we cannot use the mergesort
    algorithm, since it results only in a fixed linear order of the sorted elements.
    The basic idea for overcoming this restriction is that one can introduce an artificial
    hierarchy by picking any value k0 of the key and subdividing the set of elements
    into elements which exhibit a smaller key k(e) < k0 (denoted as subset S(−∞, k0)),
    another subset containing elements exhibiting k(e) > k0 S(k0, ∞)) and possibly
    one remaining element with k(e) = k0. The subsets S(−∞, k0) and S(k0, ∞) can be
    subdivided in the same way. For example, using a key value k1,0 < k0, S(−∞, k0)
    can be subdivided into a subset S(−∞, k1,0) containing elements smaller than k1,0,
    into a subset S(k1,0, k0) containing elements between k1,0 and k0, and finally
    possibly the element with exactly the key value k1,0. In the same way, the other
    subset S(k0, ∞) can be subdivided using a key k2,0 > k0. By this hierarchical
    splitting of the set of elements a tree structure is generated. A binary tree
    can be used to store the elements via representing this hierarchy. In this case,
    for convenience, only the key values of existing elements are used for the hierarchical
    subdivision of the set. Hence, at each node an element e is stored. For this node,
    one subtree (usually denoted as left subtree) contains all elements e′ with key
    values k(e′) < k(e) the other (right) subtree the elements exhibiting k(e′) >
    k(e). A possible binary search tree containing elements with key values 13, 15,
