  md: '+   - In the first edition, the Sec. 9.3.1 on LaTeX, a standard typesetting
    tool to generate high-quality documents as large as complete books (like this
    one), was a rather short introduction giving few examples. For the second editions
    this section has been expanded substantially, such that it now serves as a complete
    introduction to LaTeX, presenting the most-frequently used LaTeX elements in scientific
    publications, such all necessary knowledge to generate standard to advanced manuscripts
    (from the typesetting point of view) is covered.


    These new sections include and discuss, following the hands-on approach of the
    first edition, all necessary source codes that the reader can apply the new knowledge
    to her or his ease as quickly as possible. Thus, I hope that this new edition
    will allow you to learn all technical aspects of scientific computer simulations
    as fast as possible, ranging from the initial idea over the implementation, performing
    the simulations, doing the data analysis, up to the publication of your results.
    Thus, using this book will save you a lot of time which you can use to concentrate
    on the actual scientific problem you want to solve. Finally, since the new edition
    comprises almost all non-problem specific knowledge you need in computational
    science, I decided to rename the book to “Big Practical Guide to Computer Simulations”.


    This new edition would not have been possible without the help of many people.
    I am grateful to the following persons for communicating mistakes, making useful
    suggestions and providing extensions of the book: Pia Backmann, Jan Christoph
