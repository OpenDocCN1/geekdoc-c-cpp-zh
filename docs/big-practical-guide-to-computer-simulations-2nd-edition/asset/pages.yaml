  md: "dencies between your source code files. Furthermore, it contains commands (e.g.\
    \ the compiler command) which generate the resulting files called targets, i.e.\
    \ the final program and/or object (.o) files. Each pair of dependencies and commands\
    \ is called *rule*. The file containing all rules of a project is called *makefile*,\
    \ usually it is named **Makefile** and should be placed in the directory where\
    \ the source files are stored.\n\nA rule can be coded by two lines of the form\n\
    \n```\n    (target) : (sources)\n    <tab> (command(s))\n```\n\nThe first line\
    \ contains the dependencies and the second one the commands. The command line\
    \ must begin with a tabulator symbol `<tab>`, which appears as a space in most\
    \ editors. It is allowed to have several targets depending on the same sources.\
    \ You can extend the lines with the backslash “\\\\” at the end of each line.\
    \ The command line is allowed to be left empty. An example of a dependency/command\
    \ pair is\n\n```\n    simulation.o: simulation.c simulation.h\n    <tab>   cc\
    \ -c simulation.c\n```\n\nThis means that the file `simulation.o` has to be compiled\
    \ if either `simulation.c` or `simulation.h` have been changed. The `make` program\
    \ is called by typing `make` on the command line of a UNIX shell. It uses the\
    \ date and time of the last changes performed on each file, which is stored along\
    \ with each file, to determine whether a rebuild of some targets is necessary.\
    \ Each time at least one of the source files is newer than the corresponding target\
    \ files, the commands given after the `<tab>` are executed. Specifically, the\
    \ command is executed if the target file does not exist at all. In this special\
    \ case, no source files have to be given after the colon in the first line of\
    \ the rule.\n\nIt is also possible to generate meta rules which, e.g. tell how\
    \ to treat all files which have a specific suffix. Standard rules, which tell\
    \ how to treat files ending for example with `.c`, exist already, but can be changed\
    \ for each file by stating a different rule. This subject is covered in the man\
    \ page of `make`.\n\nThe `make` tool always tries to build only the first object\
    \ of your *makefile*, unless enforced by the dependencies. Consequently, if you\
    \ have to build several independent object files `object1`, `object2`, `object3`,\
    \ the whole compiling must be toggled by the first rule, thus your *makefile*\
    \ should read"
