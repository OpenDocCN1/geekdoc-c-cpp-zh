    # 6.7 Trees


    Now, we present trees, which are probably the most important advanced data structure
    for computer programming, in particular for many types of simulations. They help
    in many cases to replace operations which take time O(N) for a simulation of "size"
    N by operations which only take time O(log N). Hence, trees and other data structures
    which are derived from trees help a great deal in speeding up simulations, thereby
    allowing for larger systems to be treated.


    For the data structures presented in the previous section, arrays and lists, always
    a linear order was used or assumed. Very often, additionally a hierarchical order
    is present or can be imposed. A very simple example of a system exhibiting a hierarchy
    is a company or a governmental organization. To consider a toy example, let us
    assume that a railway company consists of a planning division, an accounting division
    and a division operating the transportations. The planning division may be subdivided
    into a department for planning the network, another one for planning the schedules,
    a third for developing new pricing schemes, and a fourth responsible for buying
    new locomotives and wagons. The account division may be subdivided into four departments
    responsible for personal, maintenance, purchasing, and revenue, respectively.
    The operation division might be subdivided into departments for the freight trains,
    for passenger trains, for night trains, for busses, and one for actually performing
    the maintenance. The natural way to represent the structure of the railway company
    in the computer is a tree, as shown in Fig. 6.11.


    Now we introduce some definitions. The elements of the tree are denoted as nodes
    or as vertices, the latter one is more generally used for graphs, see Sec. 6.8.
    For the railway company, e.g. "railway company", "accounting" and "night trains"
    are nodes. When two nodes A,B are connected by an arrow A→B, usually called a
    link or an edge, node A is called predecessor or parent of B, while B is called
    successor or child of A. In Fig. 6.11, "personal" is a child of "accounting".
    The children of a node A are also defined as descendents of A. Furthermore, all
    children of descendents of A are also defined as descendents of A. The single
    node without parent is called the root of the tree. Hence, all nodes, where A
    is located on a path from the root'
