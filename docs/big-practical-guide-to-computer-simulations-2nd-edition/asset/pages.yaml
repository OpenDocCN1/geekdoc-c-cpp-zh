  md: '# N-queens problem


    N queens are to be placed on an $N \times N$ chess board in such a way that no
    queen checks against any other queen. This means that, in each row, in each column
    and in each diagonal at most one queen is placed, see Fig. 6.4.


    ![](img/0dfb82b7d27bdfebb8b65cb33de3626a_186_0.png)


    Fig. 6.4  A standard 8 × 8 chess board with a queen placed near the center. The
    crosses indicate the squares, where no other queen can be placed for the 8-queens
    problem.


    A naive solution of the problem works by enumerating all possible configurations
    of $N$ queens and checking, for each configuration, whether any queen checks against
    another queen. By restricting the algorithm to place at most one queen per column,
    there are $N^N$ possible configurations. This is a very strongly increasing running
    time, which can be decreased by backtracking.


    The idea of backtracking is to place one queen after the other. One stops placing
    further queens if a non-valid configuration is already obtained at an intermediate
    stage. Then one goes one step back, removes the queen which was placed at the
    step before, places it elsewhere, if possible, and continues again. Note that
    it also will occur that several queens are removed again, i.e., several steps
    are taken back, see the example below.


    The algorithm starts in the last column and places a queen. Next a queen is placed
    in the second last column as a recursive call and so forth. If all columns are
    filled, a valid configuration has been found. If at any stage it is not possible
    to place any further queen in a given column, then the backtracking step is performed:
    the recursive call finishes, the queen which was set in the recursion step before
    is removed. Then it is placed elsewhere and the algorithm proceeds again. The
    argument n denotes the column where the next queen is to be placed. To match the
    C standard'
