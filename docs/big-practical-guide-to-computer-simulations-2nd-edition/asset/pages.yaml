  md: 'In this way, realizing that E[X] is a number, one obtains:


    σ² = Var(X) = E[(X − E[X])²] = E[X² − 2 E[X] E[X] + E[E[X]²]] = E[X²] − E[X]²
    = E[X²] − μ²  (8.21)

    ⇔ E[X²] = σ² + μ²  (8.22)


    The variance is not linear, which can be seen when looking at a linear combination
    of two independent random variables X₁, X₂ (implying E[X₁X₂] = E[X₁]E[X₂] (*))


    σ²_{α₁X₁+α₂X₂} = Var[α₁X₁ + α₂X₂]

    = E[(α₁X₁ + α₂X₂)²] − E[α₁X₁ + α₂X₂]²

    = E[α₁²X₁² + 2α₁α₂X₁X₂ + α₂²X₂²] − (α₁E[X₁] + α₂E[X₂])²

    = α₁²E[X₁²] + α₂²E[X₂²] − α₁²E[X₁]² + α₂²E[X₂]²

    = α₁²Var[X₁] + α₂²Var[X₂]  (8.23)


    The expectation values E[Xⁿ] are called the n’th moments of the distribution.
    This means that the expectation value is the first moment and the variance can
    be calculated from the first and second moments.


    Next, we describe two more important distributions of discrete random variables.
    First, if one repeats a Bernoulli experiment n times, one can measure how often
    the result "1" was obtained. Formally, this can be written as a sum of n random
    variables X⁽ⁱ⁾ which are Bernoulli distributed: X = Σᵢ₌₁ⁿ X⁽ⁱ⁾ with parameter
    p. This is a very simple example of a transformation of a random variable, see
    page 249. In particular, the transformation is linear. The probability to obtain
    x times the result "1" is calculated as follows: The probability to obtain exactly
    x times a "1" is pˣ, the other n − x experiments yield "0" which happens with
    probability (1−p)ⁿ⁻ˣ. Furthermore, there are C(n,x)=n!/(x!(n−x)!) different sequences
    with x times "1" and n − x times "0". Hence, one obtains:


    # Definition 8.9


    The binomial distribution with parameters n ∈ ℕ and p (0 < p ≤ 1) describes a
    random variable X which has the pmf


    p_X(x) = (n choose x) pˣ (1−p)ⁿ⁻ˣ   (0 ≤ x ≤ n)  (8.24)


    A common notation is X ~ B(n,p).'
