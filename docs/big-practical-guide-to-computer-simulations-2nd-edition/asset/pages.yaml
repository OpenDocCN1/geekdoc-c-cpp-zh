    If one applies the maximum-likelihood principle to a Gaussian distribution with
    parameters μ and σ², one obtains (not shown here, see for example [Dekking et
    al (2005)]) as maximum-likelihood estimators the sample mean x̄ (for μ) and the
    sample variance s² (for σ²), respectively. This means (see Eq. (8.58)) that the
    maximum-likelihood estimator for σ² is biased. Fortunately, we know that the bias
    disappears asymptotically for n → ∞. Indeed, it can be shown, under rather mild
    conditions on the underlying distributions, that all maximum-likelihood estimators
    ML_{θ_k,n}(X₀,...,X_{n−1}) for a parameter θ_k are asymptotically unbiased, i.e.


    $$\lim_{n\to\infty} E[ML_{θ_k,n}] = θ_k \tag{8.96}$$


    In contrast to the exponential and Gaussian cases, for many applications the maximum-likelihood
    parameter is not directly related to a standard sample estimator. Furthermore,
    ML_{θ_k,n} can often even not be determined analytically. In this case, one has
    to optimize the log-likelihood function numerically, for example, using the corresponding
    methods from the GNU scientific library (GSL) (see Sec. 7.3).


