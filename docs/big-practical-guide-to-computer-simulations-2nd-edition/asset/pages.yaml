  md: 'the (empirical) covariance matrix of the sample of data points. For this purpose
    we project each normalized data point on the direction x, i.e., calculate the
    scalar products q^(i) ≡ x · x^(i). Thus, for the sample variance in direction
    x we obtain using Eq. (8.55):


    Var_x{(x^(i))} = 1/n Σ_i (q^(i) - q̄)^2  q̄=0 = 1/n Σ_i (q^(i))^2 = 1/n Σ_i (x
    · x^(i))^2 ,


    where the average q̄ = 1/n Σ_i q^(i) vanishes because the data points have been
    normalized by their mean. Using the transpose ...^T a scalar product can be written
    as a · b = a^T b. When additionally using the symmetry of the scalar product a
    · b = b · a we can rewrite the above expression as


    Var_x{(x^(i))} = 1/n Σ_i x^T x^(i) (x^(i))^T x . (8.85)


    The expression 1/n Σ_i x^(i) (x^(i))^T denotes a d × d matrix which is called
    the (sample) covariance matrix C, which has the entries


    C_kl ≡ 1/n Σ_i x_k^(i) x_l^(i) = 1/n Σ_i (x_k^(i) - x̄_k)(x_l^(i) - x̄_l) = 1/n
    Σ_i x_k^(i) x_l^(i) - x̄_k x̄_l . (8.86)


    The covariance matrix is real, symmetric and positive semi-definite.17 i.e., it
    exhibits only non-negative eigenvalues λ_z (z = 1, …, d) and corresponding normalized
    eigenvectors e_z, i.e.,


    C e_z = λ_z e_z  (λ_z ≥ 0) . (8.87)


    Without loss of generality, we can assume that the eigenvalues are ordered in
    descending order λ1 > λ2 > … > λd and that the eigenvectors form an orthonormal
    (e_z · e_z'' = δ_z,z'') basis of the d-dimensional vector space.18 This means,
    any vector can be represented as linear combination of the eigenvectors. Thus,
    we can write x = Σ_z r_z e_z, where here and in the following sums Σ_z run from
    1 to d, and r_z ≡ x · e_z. This we can insert into Eq. (8.85), resulting in


    17 Any matrix of the form A A^T is semi-definite. 18 In case of degeneracy, i.e.,
    if some eigenvalues appear multiple times, one can turn the set of eigenvectors
