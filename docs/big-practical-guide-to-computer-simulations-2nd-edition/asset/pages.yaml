    The last basic programming principle which is presented here is backtracking.\
    \ This method is applied when there is no direct way of computing a solution.\
    \ This is typical of many combinatorial problems, like optimization of functions\
    \ over discrete variables. The basic idea is that one has to try some (sub-)solutions,\
    \ discard them if they turn out not to be good enough and try some other (sub-)solutions.\
    \ Hence, all the time variables are assigned and later reassigned. This is done\
    \ in a controlled way, such that all interesting possible assignments are tried,\
    \ until a solution is found. This is the basic principle of backtracking.\n\n\
    As an example, in the following we will present a backtracking algorithm for the\
