    to the node, are descendents of A. In the example tree, “railway company” is the
    root of the tree. On the other hand, each node A together with all its descendants
    also forms a tree, called a *subtree*, with A being the root of the subtree. Nodes
    without children are called *leaves*, e.g. “network” and “busses”. In principle,
    the number of children per node, also for the non-leaves, may vary within the
    tree. In case each node has at most two children, the tree is called a *binary
    tree*. To reach a node A, one can always start at the root of a tree and follow
    some links in the direction of the arrow, until the node A is reached. The sequence
    of visited nodes is called a *path*.<sup>5</sup> For example, “schedule” can be
    reached via the path “railway company” → “planning” → “schedule”. Note that for
    each node, the path to reach it from the root is unique. The number of traversed
    links between the root and node A is called the *height* or *level* of node A.
    Hence, the root has always height zero. In the example tree Fig. 6.11, node “planning”
    has height one, while node “prices” has height two. For this example, all leaves
    have the same height. In general, the leaves of a tree can have different heights,
    for example, if the railway company has a division “public relations” which is
    not subdivided into departments. Finally, the *height of the tree* itself is the
    largest height of any leaf.


    <sup>5</sup> Equivalently, one can also call the sequence of traversed links a
    path.'
