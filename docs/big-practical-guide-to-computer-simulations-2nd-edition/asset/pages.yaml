    \ variable `gsl_rng_default` of type `gsl_rng_type *` will contain the current\
    \ generator and can be used as argument when calling `gsl_rng_alloc()`. If the\
    \ environment variable is not assigned, `gsl_rng_default` will contain `gsl_rng_mt19937`.\n\
    \nIn addition to the functions discussed so far, the GSL enables us to investigate\
    \ the properties of random number generators, copy generators, store the state\
    \ of generators in files, and read them back in.\n\nNow, to actually generate\
    \ data which is distributed according to a Binomial distribution $Bin(n,p)$, the\
    \ following function is provided:\n\n```\n```c\nunsigned int gsl_ran_binomial(const\
