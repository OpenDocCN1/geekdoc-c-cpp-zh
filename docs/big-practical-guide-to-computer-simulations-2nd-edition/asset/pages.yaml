    # 8.5.6 Clustering Data


    Often one wants to find similarities in a set of n objects, characterized by “feature
    vectors”. As in the case of principal component analysis (Sec. 8.5.5), we assume
    that the data is given by n d-dimensional real-valued data points {x^(i)} (i =
    0, …, n−1), with each data point x^(i) = (x1^(i), …, xd^(i))^T. Furthermore, let
    the data exhibit some substructure, i.e., one can organize the data into groups,
    called clusters, such that the objects within the groups are more similar to each
    other compared to objects belonging to different groups. Note that this is not
    a precise definition. In fact, a good definition does not exist. Thus, what is
    a good clustering always depends on the application and on the data. This is already
    illustrated by the two sample data sets A and B, which are shown in Fig. 8.42.
    For a detailed discussion of clustering, see Ref. [Jain and Dubes (1988)]. Here,
    we discuss three approaches, the k-means algorithm, neighbor-based clustering,
    and an agglomerative clustering method.


    ![](img/0dfb82b7d27bdfebb8b65cb33de3626a_361_0.png)


    Fig. 8.42 Two sample sets A (n = 200, left) and B (n = 200, right) for sets of
    two-dimensional data points, which will subsequently be used to test clustering
    algorithms, aiming at identifying subsets of similar data points.


    Following the k-means approach, one wants to partition the data set into k clusters,
    k being a somehow given parameter. Below we discuss shortly'
