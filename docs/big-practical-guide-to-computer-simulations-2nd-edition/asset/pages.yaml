    \ are coded as integers 1,... */\n} person_t;\n```\n```\n\nThe author recommends\
    \ to use the suffix _t (or similar rules) for the names of self-defined types\
    \ to make it obvious everywhere that a new type name is used.\n\nIt is even possible\
    \ just to define via typedef new names for existing data types like double. This\
    \ could be useful e.g. in a situation where one knows in advance that one needs\
    \ a sophisticated data structure later on for some variables, like special types\
    \ for extremely high-precision numbers. In this case, one might want to start\
    \ the implementation for development purposes with standard double and only switch\
    \ to the high-precision data type later on. Hence, one could use typedef double\
    \ precision_t so that one would only have to change this typedef and not all occurrences\
    \ of definitions of variables of the high-precision type later on.\n\nC offers\
    \ other data types, e.g. enumerations (where each variable can have only specific\
    \ values), bit fields (for storing data bit wise) and unions (for allowing variables\
    \ to be at different types), which are not covered here. These data types are\
    \ useful for some applications but not absolutely necessary. Please refer to the\
    \ literature for details.\n\nBased on these complex data types, even more advanced\
    \ data structures can be developed. They are often very useful for organizing\
    \ simulation programs in a much better way, speeding up simulations considerably.\
    \ Advanced data structures like lists, trees and graphs are discussed in Secs.\
    \ 6.6 to 6.8."
