  md: "```\ndef bootstrap(array,estimFunc,nBootSamp=128):\n    # estimate mean value\
    \ from original array\n    origEstim=estimFunc(array)\n\n    ## resample data\
    \ from original array\n    nMax=len(array)\n    h = [0.0]*nBootSamp\n    bootSamp\
    \ = [0.0]*nMax\n    for sample in range(nBootSamp):\n        for val in range(nMax):\n\
    \            bootSamp[val]=array[randint(0,nMax-1)]\n        h[sample]=estimFunc(bootSamp)\n\
    \n    ## estimate error as std deviation of resampled values\n    resError = basicStatistics(h)[1]\n\
    \    return origEstim,resError\n```\n\nThe function receives three arguments,\
    \ the sample of data points stored in a list array, a function calculating the\
    \ estimator which is applied to the data points, and the number nBootSamp of times\
    \ a bootstrap sample is taken. As usual, one cannot infer from the arguments which\
    \ “type” their are, this is only clarified by the way they are used in the body\
    \ of the function, highlighting the “duck-typing” feature of dynamical programming\
    \ languages such as Python. For example, in line 3 it is clear that estimFunc\
    \ is a function. For the third argument, a default value of 128 is stated, i.e.\
    \ if one calls bootstrap with only two arguments, the default value is used. In\
    \ line 7, a list (used as an array) h of nBootSamp entries is initialized with\
    \ zeros. In the same way, a list bootSample of nMax entries is initialized in\
    \ line 8. The main resampling is performed in lines 9-12: nBootSamp times a bootstrap\
    \ sample is taken, i.e., the list bootSample is filled with numbers drawn randomly\
    \ and independently from the original data array. Here, the function randint(0,nMax-1)\
    \ is used, which returns a uniform random integer in the range from 0 to nMax-1.\
    \ Note that in the bootstrap sample, every data point may appear more than once.\
    \ In line 12, the estimator is calculated for the current bootstrap sample and\
    \ stored in the current entry of h. Finally, the variance of the bootstrap estimators\
    \ (line 15) is the error bar for the actual estimator, which both are returned\
    \ in line 16.\n\nNote that in the sample program resampling.py, also the main\
