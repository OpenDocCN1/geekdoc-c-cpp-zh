    # 3.3 Version management with subversion


    All simulation projects will evolve over time. This is reflected by changes of
    documents like design descriptions, program source codes or papers where the simulation
    algorithms and results are going to be published. If you are just one person performing
    the project, i.e. one author, and if the project is not very complicated, you
    can just keep always the "current" files; hence, you do not perform explicit version
    management.


    Nevertheless, you often need older versions, for example, to compare an improved
    algorithm to a previous version. This can happen as well if the latest version
    of your program behaves strangely, because you have entered a little bug in your
    code. Or, when writing your paper, you can restore a chapter which has accidentally
    been deleted.


    To handle these cases, you could run your hand-made version management, for example,
    by naming your paper files config1v1.jpg, config1v2.jpg, config1v3.jpg and so
    on. In many cases, this works fine, but it is a bit waste of disk space, because
    each version is stored completely even if two successive versions differ only
    slightly.


    In case several authors work on a project, hand-made version management becomes
    a bit more complicated. One standard way is to agree that only one author is allowed
    to edit each file at a time. One says, the file is locked by the current author.
    In practice, this means that you have mutually to agree who works next on which
    file. This is not bad, because you have to communicate anyway a lot to organize
    a project efficiently. This means, if an author wants to change a locked file,
    he has to wait with the changes until the file is unlocked again. Also, the lock
    is only virtual, i.e. it may happen accidentally that two person edit the same
    file. In this case, the two authors have to create a new latest version by merging
    the two'
