    of the clustering as a group (similar to the k means clustering) but in terms
    of distances to other points or groups of points (unlike k-means clustering where
    only absolute positions are relevant). This is the fundamental notion underlying
    hierarchical clustering methods. These methods are also often able to detect substructures,
    like clusters inside clusters etc. Here, we will focus on an agglomerative clustering
    approach, namely the average-linkage approach.


