    # 8.5.4 Statistical (in-)dependence


    Here, we consider samples, which consist of pairs (x_i, y_i) (i = 0,1,...,n−1)
    of data points. Generalizations to higher-dimensional data is straightforward.
    The question is, whether the y_i values depend on the x_i values (or vice versa).
    In this case, one also says that they are statistically related. If yes, this
    means that if we know one of the two values, we can predict the other one with
    higher accuracy. The formal definition of statistical (in-)dependence was given
    in Sec. 8.1. An example of statistical dependence occurs in weather simulations:
    The amount of snowfall is statistically related to the temperature: If it is too
    warm or too cold, it will not snow. This also shows, that the dependence of two
    variables it not necessarily monotonous. In case one is interested in monotonous
    and even linear dependence, one usually says that the variables are correlated,
    see below.'
