- pgno: 23
  md: '```

    cc -o first -Wall first.c

    ```


    The main command is cc, which is an abbreviation of C compiler. In the above example,
    two options are used for the command cc:


    +   -o (for ouput) gives the name the executable program will get, here first.

    +   -Wall The W stands for warning and all means the compiler will report (almost)
    all strange things it observes, even if it is not an error in a strict sense.
    Since C is very sloppy about many rules, it lets you get away with a lot, which
    most of the times is not what you want to do.


    The classical example is the comparison operator ==, i.e. you have to write a==b,
    if you want to test whether the values stored in the variables a and b are equal.
    This is different from a=b, which assigns a the value of b (see below). Nevertheless,
    for conditional statements like if (a=b), sometimes the programmer mistakenly
    writes if (a=b), which is nevertheless a meaningful statement under some circumstances.
    Therefore, the compiler does not report this as an error, but with -Wall, the
    compiler warns you that you have used an assignment where a conditional statement
    is expected. Hence, you should use the highest warning level -Wall always, and
    ignore the warnings only, if you know exactly what you are doing. Note that there
    are several other warning options in C which are not turned on even when using
    -Wall, despite its name. For example, the option -Wextra (previously called just
    -W) turns on additional warnings. A complete list of all warning options can be
    found in the compiler documentation.


    The last argument of the cc command is the file you actually want to compile.
    Note that, in principle, a program may consist of several files, which can all
    be passed via arguments to the compiler. By default, the C compiler will generate
    an executable. Consequently, the compiling process will consist of the actual
    compiling of the input source files, which generates a (hidden) assembler code
    for each input file. The assembler codes are translated to executable codes. Finally
    the different executable codes are linked into one program. If the option -c is
    given, the linking stage will be omitted. In this case several executable .o files
    are created. The C compiler, when called from the command line, offers a huge
    number of'
  merge: -1
