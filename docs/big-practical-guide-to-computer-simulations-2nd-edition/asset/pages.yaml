    for the first time after exactly x times, then the first x − 1 times the outcome
    "0" was observed. This happens with probability (1 − p)^{x−1}. At the x''th experiment,
    the outcome "1" is observed which has the probability p. Therefore one obtains


    # Definition 8.11 The geometric distribution with parameter p (0 < p ≤ 1) describes
    a random variable X which has the pmf


    p_X(x) = (1 - p)^{x-1} p   (x ∈ ℕ)   (8.28)


    A sample plot of the pmf (up to x = 10) is shown in the right of Fig. 8.2. The
    geometric distribution has (without proof here) the expectation value E[X] = 1/p,
    the variance Var[X] = (1−p)/p² and the following distribution function:


    F_X(x) = { 0          x < 1 ; 1 - (1 - p)^m   m ≤ x < m + 1   (m ∈ ℕ) }


    # 8.1.2 Continuous random variables


    As stated above, random variables are called continuous if they describe random
    experiments where outcomes from a subset of the real numbers can be obtained.
    One may describe such random variables also using the distribution function, see
    Def. 8.5. For continuous random variables, an alternative description is possible,
    equivalent to the pmf for discrete random variables: The probability density function
    states the probability to obtain a certain number per unit:


    # Definition 8.12 For a continuous random variable X with a continuous distribution
    function F_X, the probability density function (pdf) p_X : ℝ → [0,1] is given
    by


    p_X(x) = dF_X(x)/dx   (8.29)'
