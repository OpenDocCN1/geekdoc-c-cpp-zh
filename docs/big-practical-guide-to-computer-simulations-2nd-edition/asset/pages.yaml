    # (3) Number Partitioning


    SOLUTION SOURCE CODE

    DIR: algorithms

    FILE(S): partition.c


    The number-partitioning problem (NPP) is defined as follows: Given a set of n
    non-negative integers A = {a[0]...a[n-1]}, we want to partition it into two subsets
    A1 ⊂ A and A2 ⊂ A such that the difference d = |∑_{a∈A1} a - ∑_{a∈A2} a| is minimized.
    For example, {2,3,4,10} can be partitioned into two subsets A1 = {2,3,4} and A
    = {10} with d = 1. Solve this problem, i.e. find the minimum difference, using
    a dynamic programming approach. Design, implement and test the resulting program.


    Hint: Introduce the two-dimensional array part[][], where part[i][s]=1 if some
    subset of {a[0]...a[i]} has sum s (with i=0,...,n-1 and s=0,...,∑_{a∈A} a). The
    array part can be calculated (with some suitable initialization for part[0][s])
    using part[i][s]=1 if part[i-1][s]==1 or part[i-1][s-a[i]]==1. Then, using |∑_{a∈A1}
    a - ∑_{a∈A2} a| = |2∑_{a∈A1} a - ∑_{a∈A} a|, the minimal difference can be obtained
    from part[n-1][s] (s=0,...,∑_{a∈A} a). Note that this approach does not directly
    yield the two subsets, just the minimum difference.


