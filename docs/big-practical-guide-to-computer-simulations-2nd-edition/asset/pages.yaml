  md: 'to printf(...). Also, there exists stderr, which is the standard output for
    error messages. This is also usually directed to the screen in interactive mode,
    but in case your programs runs in a special environment, like when using a queuing
    system, stderr is usually different from stdout.


    Note that there are several other C functions for writing to files. Examples are
    putc(), which writes single characters, and puts(), which writes strings. Since
    they provide no functionality beyond fprintf(), they are not discussed here.


    Finally, a file has to be closed when the access is terminated. For this purpose,
    the function fclose() has to be used, which expects as argument a file pointer
    of the file to be closed, e.g.


    ```

    fclose(file_p);

    ```


    Once a file is closed, it can be accessed by other means, e.g. inspected via an
    editor. Note that while a simulation is running, data which is written via fprintf()
    will not be immediately forwarded to the file. Usually internal buffers are used,
    and the data is output to the file blockwise, each time the buffer is full. Nevertheless,
    emptying the buffer can be triggered within a program via the function fflush(),
    which also takes a file pointer as argument.


    So far, we have discussed ways to output data from a program. On the other hand,
    your simulation programs usually need some input as well. The most direct way
    is to use interactive input, e.g. to type in some parameters values on request.
    This can be accomplished in C using the getchar() function, which just reads one
    character from the keyboard. Longer inputs can be read in using multiple calls
    to getchar(). Nevertheless, simulation programs are very often processed by batch
    queues on large-scale computing facilities. These batch jobs start at some time
    which is unknown in advance, hence you cannot sit in front of the screen, wait
    till your programs have started, and then supply the necessary input. Nevertheless,
    some programs, in particular for small systems and/or pedagogical purpose, may
    run interactively, quite often using a graphical user interface (GUI). Such interfaces
    are beyond the scope of this book; also the way the user interface is programmed
    under C depends quite often on the programming environment. Thus, the readers
    who are interested in simulations having a comfortable GUI should consider for
    example the JAVA programming language [JAVA]. Anyway, in the context of (large-scale)
    computer simulations, input to programs is either done via command-line arguments,
    which are treated below,'
