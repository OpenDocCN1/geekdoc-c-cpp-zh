- pgno: 418
  md: 'The creation of the picture is started by calling (here on a Linux system via
    command line) povray +Itest1.pov +P. The program can have a different name on
    your system, e.g. x-povray. Note that there is no space between the +I (input)
    option and the name of the file describing the scene. An image will appear on
    your screen. The pause option +P makes Povray to wait for a mouse klick in the
    image to quit. In addition to showing the image on the screen, a file in the portable
    network graphic format test1.png will be created, when using Povray 3.7 (.bmp
    for version 3.6.2). The resulting picture is shown in Fig. 9.6. Please note the
    shadows on the plane.


    Also other names for the output file can be given with the +O option, e.g. +Oimage
    will let Povray generate image.png. A summary of these and other important options,
    often followed by a value or another argument without a space, is as follows


    +   - `+I<File>` input file `<File>`

    +   - `+O<File>` output file `<File>` (without appendix .png)

    +   - `+P` pause: wait for click before finishing

    +   - `+Q<Quality>` quality of output, the higher the better

    +   - `+W` width of image

    +   - `+H` height of image

    +   - `+f<format>` use other output file format, e.g. jpg (`<format>`=j), ppm
    (`<format>`=p), bmp (`<format>`=b).


    Povray is really powerful. You can create almost arbitrarily shaped objects, combine
    them into complex objects and impose many transformations. Also special effects
    like blurring or fog are available. All features of Povray are described in a
    400-page manual. The use of Povray is widespread in the artists'' community. For
    scientists, it is very convenient as well, because you can easily convert configuration
    files of molecules or three-dimensional domains of magnetic systems into nice-looking
    perspective pictures. This can be accomplished by writing a small program which
    reads, for example, your configuration file containing a list of positions of
    atoms and a list of links, and puts for every atom a sphere and for every link
    a cylinder into a Povray scene file. Finally the program must add suitably chosen
    light sources and a camera. Then, a three-dimensional pictures is created by calling
    Povray. This is quite similar to the automatic creation of dot files, as explained
    in Sec. 9.2.3.'
  merge: -1
  img_proc: true
