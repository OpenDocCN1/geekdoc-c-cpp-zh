    The output is in diff format. The lines of the old revision are marked by ''-''
    symbols, the lines of the working copy by ''+'' symbols. Line numbers (where each
    block of empty lines is counted as one line) are given after the @@ symbols. For
    convenience, also some lines are shown which have not been changed.


    If other authors performed changes to project files in the meantime, you can get
    the latest revision by entering svn update (having the working directory as current
    directory). This will update all files in your current working directory to the
    latest revision. It is possible that some files in the repository were changed
    which you have changed as well. In this case, subversion will automatically merge
    the file from the latest revision with the working copy, if no conflicts from
    contradicting changes to the same text positions arise. You must perform an update,
    before you can commit a file which has been changed in the repository in the meantime:


    ```

    Gene:list>svn commit -m "element 8"

    Sending       list_main.c

    svn: Commit failed (details follow):

    svn: Out of date: ''/list/list_main.c'' in transaction ''3-1''

    ```


    This shows that you are forced to perform an update. If no conflict arises, everything
    will be fine. If a conflict arises, in some versions of subversion you have the
    opportunity to resolve the conflicts interactively. We consider the most general
    case, where you resolve the conflicts "by hand" (which is the default in our example):


    ```

    Gene:list>svn update

    C       list_main.c

    Gene:list>ls list_main.c*

    list_main.c  list_main.c.mine  list_main.c.r2  list_main.c.r3

    ```'
