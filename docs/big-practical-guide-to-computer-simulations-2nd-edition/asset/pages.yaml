    \ is as follows:\n\n```\nif( {condition} )\n    {statement 1}\nelse\n    {statement\
    \ 2}\n```\n\nDuring the execution, first the {condition} is checked. If the condition\
    \ is true, then {statement 1} is executed. If the condition is false, then {statement\
    \ 2} is executed. These statements can be arbitrary, e.g. assignments as in the\
    \ above example, calls to functions, another nested if statement, etc. Also, the\
    \ type of the statements can be different, e.g. {statement 1} may be a call to\
    \ a function and {statement 2} may be an assignment. Note that the else part can\
    \ be absent. In this case, if the condition is false, the execution continues\
