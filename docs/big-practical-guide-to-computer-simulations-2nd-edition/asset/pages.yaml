  md: 'A measure of quality of the fit is the probability Q that the value of the
    mean-squared difference is equal or larger compared to the value from the current
    fit, given the assumption that the data points are distributed as in Eq. (8.97)
    [Press et al. (1995)]. The larger the value of Q, the better is the quality of
    the fit. As mentioned above, Q can be evaluated from a chi-squared distribution
    with n − n_p degrees of freedom. Since the cumulative chi-squared distribution
    is related to the normalized incomplete gamma function, which is available in
    gnuplot, one can evaluate Q directly in gnuplot:


    ```

    gnuplot> Q = 1 - igamma(0.5 * FIT_NDF, 0.5 * FIT_NDF*FIT_STDFIT**2)

    ```


