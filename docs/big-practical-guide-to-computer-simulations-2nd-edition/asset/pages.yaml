    \ code for `main()`. There are four ways of achieving this:\n\n+   (1) The full\
    \ function definition of `step_function()` appears before `main()` in the source\
    \ file. Then, when the compiler reaches the source code of `main()`, it will have\
    \ processed already the part where `step_function()` is defined, hence the function\
    \ is known to the compiler. In this way, `step_function()` is a global object,\
    \ hence it can also be called from other functions, not only `main()`.\n+   \n\
    +   (2) The full function definition comes after `main()` in the source file.\
    \ To make the compiler aware of the existence of `step_function()` when it processes\
    \ `main()`, one has to perform a declaration in advance, which is called *function\
    \ prototype*. This means that in the source code before the definition of `main()`,\
    \ the following line has to appear:\n+   \n+   ```\n+   double step_function(double);\n\
    +   ```\n+   \n+   Note the closing semicolon at the end of the line. The function\
    \ prototype carries all the information which has to be known outside the function:\
    \ the function name, the types and order of the arguments, and the type of the\
    \ return argument.\n+   \n+   All other functions which appear in the source code\
    \ behind the function prototype of `step_function()` can use calls to `step_function()`\
    \ in their code. Hence, if all function prototypes are listed at the beginning,\
    \ each function is allowed to call each other function.\n+   \n+   (3) Very often,\
    \ the source code is distributed over many source files. This usually happens\
