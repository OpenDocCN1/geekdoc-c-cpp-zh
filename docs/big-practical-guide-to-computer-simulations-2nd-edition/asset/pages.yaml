    # 8.5 Hypothesis testing and (in-)dependence of data


    In the previous section, you have learned how to visualize data, mainly data resulting
    from the basic analysis methods presented in Sec. 8.3. In this section, we proceed
    with more elaborate analysis methods. One important way to analyze data of simulations
    is to test hypotheses concerning the results. The hypothesis to be tested is usually
    called null hypothesis H₀. Examples for null hypotheses are:


    +   (A) In a traffic system, opening a new track will decrease the mean value
    of the travel time t̄_A→B for a connection A→B below a target threshold t_target.

    +   (B) Within an acquaintance network, a change of the rules describing how people
    meet will change the distribution of the number of people each person knows.

    +   (C) The distribution of ground-states energies in disordered magnets follows
    a Fisher-Tippett distribution.

    +   (D) Within a model of an ecological system, the population size of foxes is
    dependent on the population size of beetles.

    +   (E) For a protein dissolved in water at room temperature, adding a certain
    salt to the water changes the structure of the protein.


    One now can model these situations and use simulations to address the above questions.
    The aim is to find methods which tell us whether or not, depending on the results
    of the simulations, we should accept a null hypothesis. There is no general approach.
    The way we can test H₀ depends'
