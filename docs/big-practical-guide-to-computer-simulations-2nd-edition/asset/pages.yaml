    # 7.2 Standard Template Library


    The Standard (Template) Library (STL) [STL; Josuttis (1999)] is part of the "standard"
    C++ library. The STL provides three main ingredients: containers to store objects,
    iterators, which allow the programmer to access the containers in different ways,
    and algorithms which perform more complicated tasks such as sorting. Example containers
    are vectors, lists and sets. You can store objects of nearly arbitrary type in
    these containers, one type of objects per individual container. Thus, you can
    have vectors of "something", lists of "something", or sets of "something". This
    means that the types of member data or of arguments in member functions for the
    containers cannot be determined in advance but have to be defined in each case
    by the actual data type you want to use. This is achieved via templates. In this
    section, it will be explained how to use templates by discussing below two data
    structures from the STL, priority queues and maps. If you want to learn how to
    implement your own templates, please refer to specialized literature [Stroustrup
    (2000)].


    In Sec. 6.7.1 priority queues were introduced. They allow objects to be stored
    such that always the "smallest" object can be retrieved. This is possible, because
    the objects are kept partially sorted in the priority queue. In Sec. 6.7.1, a
    C implementation of events being stored in a priority queue is presented, which
    is based on heaps. Unfortunately, that implementation is for a specific data structure
    heap_elem_t. If you want to store other objects of type (say) your_elem_t on a
    heap, you have to copy the code and exchange all occurrences of heap_elem_t by
    your_elem_t. Furthermore, you have to provide some basic operations, such as a
    function to compare two objects of type your_elem_t to find out which is the smaller
    one. This work is facilitated for you by using templates.'
