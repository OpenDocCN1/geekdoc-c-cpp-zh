  md: '# 1.5 Important C compiler options


    Throughout this book, many C compiler options are explained which are useful or
    even necessary for some tasks. Here, they are summarized:


    `-o` sets the name of the output file, e.g. like in `cc -o first first.c`


    `-c` Just the compile process is performed, no final executable is linked. Each
    .c file will result in a corresponding .o file. This is useful in case the source
    code contains some functions which are used in several different programs. This
    process can be made automatic using *make* files, see Sec. 2.1.


    `-l` states the name of a library where some precompiled functions can be found,
    e.g. for mathematical functions (m) in `cc -o mathtest mathtest.c -lm`


    `-Wall` Switches on (almost) all compiler warnings, e.g. indicates if one uses
    `='' inside a condition instead of `==''.


    `-Wextra` Switches on additional compiler warnings, e.g. indicates if one compares
    variables of different types.


    `-Wshadow` When using this option, the compiler will warn if a local definition
    shadows a global definition, e.g. in case there are two variables of the same
    name (see page 44).


    `-g` Switches on support for debuggers, see Sec. 4.1.


    `-pg` Switches on support for profiling, i.e. for measuring where the program
    spends how much running time, see Sec. 4.4.


    `-O` Switches on optimization of the code. This means it will run faster. For
    example, the compiler may "unroll" loops where the number of iterations is fixed.
    Also, it writes the code of a function inline instead of calling the function
    (can be forced via the `inline` directive at the beginning of a function definition).
    It can get rid of intermediate expressions/find common subexpression. Furthermore,
