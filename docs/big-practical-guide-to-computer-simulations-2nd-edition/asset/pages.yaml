- pgno: 78
  md: 'First, if var is a variable of type ⟨type⟩, one can write


    ```

    p = &var;

    ```


    Now, as you know already from page 10, p contains the address where var is stored.
    Assigning a value to var will not change p. Nevertheless, one can access or change
    the content of var via *p.


    The second possibility is that one acquires some available memory, and let p point
    to it. This works via the malloc() (“memory allocation”) function, which requires
    as argument the number of bytes to be allocated. It returns a pointer to “something”
    (i.e. of type void *), pointing to the reserved memory area:


    ```

    void *malloc({size});

    ```


    If the operating system cannot provide the requested memory, the special pointer
    value NULL is returned. Since the size of a type is determined using sizeof(),
    one can reserve a so far unused memory location where p can point to via:


    ```

    p = ((type *) malloc(sizeof((type))));

    ```


    Note the cast in front of the malloc() statement. This memory allocation does
    not take place during compile time or right when the program is started. It just
    happens, when the malloc() function is executed in the program. For this reason,
    the processes connected to malloc() are called dynamic memory management.


    More interesting usages of pointers are possible. You could for instance have
    some init() function in your simulation (taking, say, an integer as argument)
    which also reserves some memory (where integers are stored) and returns the pointer
    to this memory. The function prototype might look like:


    ```

    int *init(int);

    ```


    On the other hand, functions can be referenced through pointers as well. To define
    a pointer fct_p, which points to a function taking an integer as argument and
    returning an integer, one writes


    ```

    int (* fct_p)(int);

    ```'
