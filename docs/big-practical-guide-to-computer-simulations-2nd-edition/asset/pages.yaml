  md: 'a sample of triplets $\{(x_0, y_0, \sigma_0), (x_1, y_1, \sigma_1), \dots,
    (x_{n-1}, y_{n-1}, \sigma_{n-1})\}$ is given. Typically, the $y_i$ are measured
    values obtained from a simulation with some control parameter (e.g. the temperature)
    fixed at different values $x_i$; $\sigma_i$ is the corresponding error bar of
    $y_i$. Here, one wants to determine parameters $\underline{\theta} = (\theta_1,
    \dots, \theta_{n_p})$ such that the given parametrized function $y_{\underline{\theta}}(x)$
    fits the data ''best'', one says one wants to fit the function to the data. Similar
    to the case of fitting a pmf or a pdf, there is no general principle of what ''best''
    means.


    Let us assume that the $y_i$ are random variables, i.e. comparing different simulations.
    Thus, the measured values are scattered around their ''true'' values $y_{\underline{\theta}}(x_i)$.
    This scattering can be described approximately by a Gaussian distribution with
    mean $y_{\underline{\theta}}(x_i)$ and variance $\sigma_i^2$:


    $$q_{\underline{\theta}}(y_i) \sim \exp\left(-\frac{(y_i - y_{\underline{\theta}}(x_i))^2}{2\sigma_i^2}\right).
    \tag{8.97}$$


    This assumption is often valid, e.g. when each sample point $y_i$ is itself a
    sample mean obtained from a simulation performed at control parameter value $x_i$,
    and $\sigma_i$ is the corresponding error bar. The log-likelihood function for
    the full data sample is


    $$l(\underline{\theta}) = \log \prod_{i=0}^{n-1} q_{\underline{\theta}}(y_i)$$

    $$

    \sim -\sum_{i=0}^{n-1} \frac{1}{2}\left(\frac{y_i - y_{\underline{\theta}}(x_i)}{\sigma_i}\right)^2$$


    Maximizing $l(\underline{\theta})$ is equivalent to minimizing $-2l(\underline{\theta})$,
    hence one minimizes the mean-squared difference


    $$\chi^2_{\underline{\theta}} = \sum_{i=0}^{n-1} \left(\frac{y_i - y_{\underline{\theta}}(x_i)}{\sigma_i}\right)^2
    \tag{8.98}$$


    This means that the parameters $\underline{\theta}$ are determined such that function
    $y_{\underline{\theta}}(x)$ follows the data points $\{(x_0, y_0), \dots, (x_{n-1},
    y_{n-1})\}$ as close as possible, where the deviations are measured in terms of
    the error bars $\sigma_i$. Hence, data points with smaller error bar enter with
    more weight. The full procedure is called least-squares fitting.


    The minimized mean-squared difference is a random variable. Note that the different
    terms are not statistically independent, since they are related by the $n_p$ parameters
    $\underline{\theta}$ which are determined via minimizing $\chi^2_{\underline{\theta}}$.
    As a'
