    # 1.1.4 Complex data types


    So far, only single variables have been introduced to store information. Here,
    complex data structures will be explained which enable the programmer to implement
    vectors, matrices, higher order tensors, strings, and data structures where elements
    of possibly different data types are grouped together to form one joint data type.


    To define e.g. a vector intensity, which may contain the results of 100 measurements
    during a simulation, one can write


    ```

    double intensity[100];

    ```


    In C, such a vector is called an array. By this definition, the variable intensity
    is defined, i.e., also enough memory will be allocated during execution of the
    program to hold the 100 elements of the array. These 100 elements are stored consecutively
    in the memory, hence a chunk of 100*sizeof(double) bytes will be used to store
    the array. Note that the memory, which is allocated, may contain any content,
    i.e. it must be regarded as undefined. Although some compilers initialize all
    allocated memory with 0s, your program should perform always an explicit initialization.
    The allocated memory is available until the execution of the block, where the
    array is defined, is finished. This holds for all variables defined inside a block,
    including variables holding just a single element. More details on this so-called
    scope of variables can be found in Sec. 1.2.


    One can access the i''th element of the array by writing intensity[i], i.e. the
    index (also called subscript) is written in [] brackets after the name of the
    vector. In C, array indices start with 0, hence here the array elements intensity[0],
    intensity[1], ..., intensity[99] are available. In the following example the average
