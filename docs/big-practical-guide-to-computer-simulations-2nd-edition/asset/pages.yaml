  md: 'The distribution function simply rises linearly from zero, starting at x =
    a, till it reaches 1 at x = b, see for example Eq. 8.10 for the case a = 0 and
    b = L_x. The uniform distribution exhibits the expectation value E[X] = (a + b)/2
    and variance Var[X] = (b − a)^2/12. Note that via the linear transformation g(X)
    = (b − a) * X + a one obtains g(X) ~ U(a, b) if X ~ U(0,1). The uniform distribution
    serves as a basis for the generation of (pseudo) random numbers on a computer,
    see Sec. 8.2.1. All distributions can be in some way obtained via transformations
    from one or several uniform distributions, see Secs. 8.2.2-8.2.5.


    Probably the most important continuous distribution in the context of simulations
    is the Gaussian distribution:


    # Definition 8.16 The Gaussian distribution, also called normal distribution,
    with real-valued parameters μ and σ > 0, describes a random variable X which has
    the pdf


    $p_X(x) = \frac{1}{\sqrt{2\pi\sigma^2}} \exp\left(-\frac{(x - \mu)^2}{2\sigma^2}\right)$
    (8.36)


    One writes X ~ N(μ, σ²).


    The Gaussian distribution has expectation value E[X] = μ and variance Var[X] =
    σ². A sample plot of the distribution for parameters μ = 5 and σ = 3 is shown
    in the left of Fig. 8.3. The Gaussian distribution for μ = 0 and σ = 1 is called
    standard normal distribution N(0,1). One can obtain any Gaussian distribution
    from X0 ~ N(0,1) by applying the transformation g(X0) = σ X0 + μ. Note that the
    distribution function for the Gaussian distribution cannot be calculated analytically.
    Thus, one uses usually numerical integration or tabulated values of N(0,1).


    The central limit theorem describes how the Gaussian distribution arises from
    a sum of random variables:


    # Theorem 8.1 Let X^(1), X^(2), ..., X^(n) be independent random variables, which
    follow all the same distribution exhibiting expectation value μ and variance σ².
    Then


    $X = \sum_{i=1}^{n} X^{(i)}$ (8.37)


    is in the limit of large n approximately Gaussian distributed with mean nμ and
    variance nσ², i.e. X ~ N(nμ, nσ²).'
