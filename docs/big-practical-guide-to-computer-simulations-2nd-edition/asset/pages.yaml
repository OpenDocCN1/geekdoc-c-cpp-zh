  md: "charged atoms as well. A similar form of hierarchical organization of objects\
    \ works the other way round: Higher level objects can be defined in terms of lower\
    \ level objects. This is called a composition [Meyers (2005)]. For example, a\
    \ book is composed of many objects belonging to the class \"page\". Each page\
    \ can be regarded as a collection of many \"letter\" objects. For the physical\
    \ example above, when modeling chemical systems, you can have \"atoms\" as basic\
    \ objects and use them to define \"molecules\". Another level up would be the\
    \ \"system\" object, which is a collection of molecules.\n\n+   - **Function/operator\
    \ overloading**\n+   \n+   The inheritance of methods (i.e. functions in C++)\
    \ to lower level classes is an example of operator overloading. It just means\
    \ that you can have methods for different classes having the same name, sometimes\
    \ the same code applies to several classes. This can happen also for classes,\
    \ which are not connected by inheritance. For example, you can define how to add\
    \ integers, real numbers, complex numbers or larger objects like lists, graphs\
    \ or documents. In languages like C or Pascal, you can define subroutines to add\
    \ numbers and subroutines to add graphs as well, but they must have different\
    \ names. In C++, you can define the operator \"+\" for many different classes\
    \ (see one example in Sec. 5.3). Hence, the operator-overloading mechanism of\
    \ object-oriented languages is just a tool to make the code more readable and\
    \ clearly structured.\n\n+   - **Software reuse**\n+   \n+   Once you have an\
    \ idea of how to build a chair, you can do it several times. Because you have\
    \ a blueprint, the tools and the experience, building another chair is an easy\
    \ task.\n+   \n+   This is true for building programs as well: Both data capsuling\
    \ and inheritance facilitate the reuse of software. For instance, once you have\
    \ written your class for treating lists, you can include the lists in other programs\
    \ as well. This is easy, because later on you do not have to care about the implementation.\
    \ With a class designed in a flexible way, much time can be saved when realizing\
