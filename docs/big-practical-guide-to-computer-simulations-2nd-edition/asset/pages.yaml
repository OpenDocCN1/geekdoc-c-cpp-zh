    2 have been tried. Therefore, the call for queens(2,...) finishes as well and
    we are back at queens(3,...). Now, the queen in the last column is placed in the
    row 2 (third line in Fig. 6.6). From here it is straightforward to place queens
    in all columns and the algorithm succeeds.


