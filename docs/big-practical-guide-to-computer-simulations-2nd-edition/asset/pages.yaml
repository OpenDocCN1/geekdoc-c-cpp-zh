  md: 'the influence of the choice of k on the resulting clustering. The k-means approach
    is based on a geometric point of view. Each cluster c = 0,...,k-1 shall be represented
    by a center vector ξ^(c). Let us assume that each data point with index i ∈ {0,...,n-1}
    is assigned to some (initially possibly randomly chosen) cluster c(i) ∈ {0,...,k-1}.


    We calculate the mean-squared difference (or "spread") χ² of all data points to
    the center of its cluster:


    χ² = (1/n) Σ_{i=0}^{n-1} ( ξ^(c(i)) - x^(i) )² .


    We assume that the best choice of the center vectors and of the assignment to
    the clusters is the one which minimizes the spread. Thus, for a fixed assignment
    of data points to clusters and any cluster c ∈ {0,...,k-1} we have for each direction
    a ∈ {1,...,d} the condition that the partial derivative of the spread with respect
    to the a''th component of the center vector ξ^(c) vanishes:


    0 = ∂χ² / ∂ξ_a^(c) = (2/n) Σ_{i=0}^{n-1} δ_{c,c(i)} ( ξ_a^(c(i)) - x_a^(i) ) =
    (2 n_c / n) ξ_a^(c) - (2/n) Σ_{i=0}^{n-1} δ_{c,c(i)} x_a^(i) ,


    where n_c = Σ_{i=0}^{n-1} δ_{c,c(i)} is the size of cluster c. Thus, each center
    vector ξ^(c) is, as the name suggest, the geometric center of the data points
    assigned to cluster c:


    ξ^(c) = (1 / n_c) Σ_{i=0}^{n-1} δ_{c,c(i)} x^(i) . (8.89)


