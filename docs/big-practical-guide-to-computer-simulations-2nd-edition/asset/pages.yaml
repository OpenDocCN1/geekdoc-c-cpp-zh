  md: "be \"w\" for writing, which means that a file will be created from scratch.\
    \ Hence, if the file has existed previously, it will be deleted. Other important\
    \ access modes are \"a\" for appending at the end of a file and \"r\" for reading\
    \ a file. When the file is opened successfully, the function will return a file\
    \ pointer, which points to an internal structure where all information is stored,\
    \ which is needed by the operating system to access the file. Technically, the\
    \ file is treated as a so-called stream, which means an output to different media\
    \ possible in a unified way. To open a file, e.g. \"funcs.dat\", for writing one\
    \ can use\n\n```\nFILE *file_p;\n```\n\n```\nfile_p = fopen(\"funcs.dat\", \"\
    w\");\n```\n\nTo actually write to the file, one can conveniently use the fprintf()\
    \ function, which works exactly like the printf() function, except that the output\
    \ is directed to a file. The format is similar to printf() except that the (additional)\
    \ first argument must be a file pointer. Therefore, the general format is:\n\n\
    ```\nfprintf( ⟨file pointer⟩, ⟨format strings⟩, ⟨argument 1⟩, … )\n```\n\nAssume\
    \ that we want to write a four-column table containing some values of the functions\
    \ sin(x), cos(x), exp(x) in the interval [0, 2π]. We write in the first line of\
    \ the file a description of the following columns via\n\n```\nfprintf(file_p,\
    \ \"#    x    cos(x)    sin(x)    exp(x)\\n\");\n```\n\nNote that the first character\
