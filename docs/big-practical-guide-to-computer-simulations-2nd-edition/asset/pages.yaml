  md: 'the values of the parameters a0, a1, a2, and μ, to three sets of data generated
    from exponential distributions with three different values of a lower cutoff,
    but all exhibiting the parameter μ = 1. To make this multi-branch fitting work
    within gnuplot, all three data sets have to be contained in one single file, exp1.dat
    here, separated by blank lines. First, we define the three functions:


    ```

    gnuplot> f0(x)=a0*exp(-x/mu)

    gnuplot> f1(x)=a1*exp(-x/mu)

    gnuplot> f2(x)=a2*exp(-x/mu)

    ```


    Next, we have to combine these three functions into a single function, f(x,s)
    where the first argument is the same argument as to the functions f1(x), f2(x),
    f3(3). The second argument s is used to select among the three functions. For
    this purpose, we first define an auxiliary function delta(a,b), which returns
    1 if a=b and 0 else. The definition of the function uses the conditional operator
    (see page 20) as known from the programming language C. This delta(a,b) is used
    for the actual definition of f(x,s):


    ```

    gnuplot> delta(a,b) = (a==b) ? 1 : 0

    gnuplot> f(x,s) = delta(s,0)*f0(x)+delta(s,1)*f1(x)+delta(s,2)*f2(x)

    ```


    From gnuplot 4.4 onwards, you can use as an alternative the value command, which
    takes any string as the name of a variable and returns the value assigned currently
    to the variable. For our example the command can be used in the following way:


    ```

    gnuplot> f(x,s) = value(sprintf("a%d",s))*exp(-x/mu)

    ```


    Note that all given gnuplot commands are collected in multifit.gp and can be executed
    using gnuplot multifit.gp. The fit is performed such that the first column is
    used as x argument. The argument s is the index of the current data file expol.dat.
    This can be taken automatically from the data file via stating the "column number"
    -2 in the second column of the using part of the fit command, stating the function
    value at the third column, and the error bars as fourth column


    ```

    gnuplot> fit f(x,y) "expol.dat" using 1:-2:2:3 via a0,a1,a2,mu

    ```'
