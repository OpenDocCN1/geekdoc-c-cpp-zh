- pgno: 153
  md: '# Chapter 5


    # Object-oriented Software Development


    In recent years, *object-oriented* programming languages like C++, Smalltalk or
    Eiffel became very popular. These programming languages are usually used to implement
    programs which are designed in an object-oriented way. But, *using an object-oriented
    language and designing a* simulation program in an object-oriented style are not
    necessarily the same. For example, you can set up your whole project by applying
    object-oriented methods even when using a traditional *procedural* programming
    language like C, Pascal or Fortran. In general, taking an object-oriented viewpoint
    facilitates the analysis of problems and the development of suitable programs.


    An introduction to object-oriented software development can be found for example
    in Refs. [Rumbaugh et al. (1991); Johnsonbaugh and Kalin (1994); Skansholm (1997)].
    The first section of this chapter, an introduction to object-oriented concepts
    is given.


    As already mentioned, the implementation of an object-oriented design is still
    possible with a procedural language. This is shown in Sec. 5.2, where *histograms*
    (see Sec. 8.3.3) are implemented in C.


    In the final section of this chapter, the histograms are implemented again, but
    now using C++. This section also serves as an introduction to C++, which is basically
    an object-oriented extension of C. Furthermore, C++ offers *templates*, which
    allow to implement algorithms for unspecified, i.e. arbitrary, data types. This
    will be covered in another chapter (see Sec. 7.2). In general, the advantage of
    C++ is that it helps you to organize your programs in terms of objects, but still
    you have the flexibility to do it in a non-object-oriented way as well.'
  merge: -1
  img_proc: true
