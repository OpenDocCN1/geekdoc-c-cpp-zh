  md: 'the interaction constants of an disordered Ising system. This facilitates the
    types of tests, which are described in the following.


    After the raw operation of the subroutines has been verified, more complex tests
    can be performed. When, for example, testing an optimization routine, you should
    compare the outcome of the calculation for a small system with the result which
    can be obtained by hand. This allows you to follow the execution of the program
    step by step. If the outcome differs from the expected result, the small size
    of the test system enables you to find the reason for the discrepancy. For each
    operation you should think about the expected outcome and compare it with the
    result originating from the running program.


    Furthermore, it is very useful to compare the outcome of different methods applied
    to the same problem. For example, you know that there must be something wrong,
    in case an approximation method finds a better value than your “exact” algorithm.
    Sometimes analytical solutions are available, at least for special cases. Another
    approach is to use invariants. For example, when performing a Molecular Dynamics
    simulation of an atomic/molecular system (or a galaxy), energy and momentum must
    be conserved; only numerical rounding errors should appear. These quantities can
    be recorded very easily. If they change in time, there must be a bug in your code.
    In this case, usually the formulas for the energy and the force are not compatible
    or the integration subroutine has a bug.


    You should test each procedure directly after writing it. Many developers have
    experienced that if the interval between implementation and tests is large, then
    the motivation for performing tests becomes very low, resulting in more undetected
    bugs.


    The final stage of the testing process begins when several modules are integrated
    into one large running program. In the case where you are writing the code alone,
    not many surprises should appear, if you have performed many tests on the single-module
    level. If several people are involved in the project, many errors occur at this
    stage. But in any case, you should remember: There is probably no complex program
    which is free of bugs. Always remember the following important result from theoretical
    computer science [Lewis and Papadimitriou (1981)]: It is impossible to invent
    a general method, which can prove automatically that a given program obeys a given
    specification. Thus, all tests must be designed to match the current code.


    In case a program is changed or extended several times, always keep the old versions.
    Quite commonly, new bugs are introduced by changing the'
