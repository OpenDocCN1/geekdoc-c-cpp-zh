  md: 'The bootstrap samples {x_i*} are stored in the array xb, while the sampled
    estimator values {h*_i} are stored in the array h. These arrays are allocated
    in lines 10-11. In the main loop (lines 12-20) the bootstrap samples are calculated,
    each time the estimator is obtained and the result is stored in h. Finally, the
    variance of the sample {h*_i} is calculated (line 22). Here, the function variance()
    is used, which works similarly to the function mean(), see exercise (5). Your
    are asked to implement a bootstrap function for general confidence interval in
    exercise (6).


    The most obvious way is to call bootstrap_variance() with the estimator mean as
    forth argument. For a distribution which is "well behaved" (i.e., where a sum
    of few random variables resembles the Gaussian distribution), you will get a variance
    that is, at least if n_resample is reasonably large, very close to the standard
    Gaussian (α = 0.32) error bar.


    For calculating properties of the sample mean, the bootstrap approach works fine,
    but in this case one could also be satisfied with the standard Gaussian confidence
    interval. The bootstrap approach is more interesting for non-standard estimators.
    One prominent example from the field of statistical physics is the so-called Binder
    cumulant [Binder (1981)], which is given by:


    b(x0, x1, ..., x_{n-1}) = 0.5 \left( 3 - \frac{\overline{x^4}}{[\overline{x^2}]^2}
    \right) \quad (8.71)


    where ... is again the sample mean, for example \overline{x^2} = \frac{1}{n} \sum_{i=0}^{n-1}
    x_i^2. The Binder cumulant is often used to determine phase transitions via simulations,
    where only systems consisting of a finite number of particles can be studied.
    For example, consider a ferromagnetic system held at some temperature T. At low
    temperature, below the Curie temperature Tc, the system will exhibit a macroscopic
    magnetization m. On the other hand, for temperatures above Tc, m will on average
    converge to zero when increasing the system size. This transition is fuzzy, if
    the system sizes are small. Nevertheless, when evaluating the Binder cumulant
    for different sets of sample points {m(T,L)_i} which are obtained at several temperatures
    T and for different system sizes L, the b_L(T) curves for different L will all
    cross [Landau and Binder (2000)] (almost) at Tc, which allows for a very precise
    determination of Tc. A sample


    GET SOURCE CODE

    DIR: randomness

    FILE(S):

    binder_L8.dat

    binder_L10.dat

    binder_L16.dat

    binder_L30.dat'
