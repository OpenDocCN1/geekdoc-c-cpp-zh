  md: '# Chapter 7


    # Libraries


    Libraries are collections of data types and functions which can be used in other
    programs. There are libraries for numerical methods such as integration or solving
    differential equations, for storing, sorting and accessing data, for fancy data
    types like lists or trees, for generating colorful graphics and for thousands
    of other applications. Some libraries can be obtained for free, while other, usually
    specialized libraries have to be purchased. The use of libraries speeds up the
    software development process enormously, because you do not have to implement
    every standard method by yourself. Hence, you should always check whether someone
    has done the jobs for you already, before starting to write a program.


    You have already learned about the basics of libraries in Chap. 1. For instance,
    the library for mathematical functions was discussed, which is included with all
    C/C++ compilers. Here, only few example libraries are presented, which are freely
    available: The standard C library, the standard template (C++) library (STL),
    and the GNU scientific library. Examples for other useful libraries, not discussed
    in detail here, are the boost library [Boost; Karlsson (2005)] and the LEDA library
    [Mehlhorn and Näher (1999)]. The boost library is also freely available and is
    in fact a collection of many libraries, which are based on the STL. There are,
    for example, libraries for graphs, hash tables, interval arithmetics, parallel
    programming (MPI), statistical distributions and random numbers, respectively.
    The LEDA library, on the other hand, does not directly build on the STL. It offers
    also data types for graphs, in particular many very efficient graph algorithms,
    several container types, arbitrary-precision arithmetics, data compression, encryption,
    and support for two- and three-dimensional geometry. Unfortunately, the full version
    of the LEDA library is quite expensive. Nevertheless, you can get a free version,
    which contains a comprehensive'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'subset of the main functionality, including many container data types like
    priority queues or trees.


    Although many libraries are available, sometimes it is inevitable to implement
    some specialized but basic functions by yourself. In this case, after the code
    has been proven to be reliable and useful for some time, you can put it in a self-created
    library. How to create libraries is explained in the last part of this chapter.


    Many libraries are dynamically linked. This means, when the linker assembles the
    executable, no code will be included from the libraries. Only when the program
    is executed, the executable functions from the corresponding library will be loaded
    to the memory. This helps to keep the sizes of the executables of your simulation
    programs small. Nevertheless, sometimes you have to force the linker to include
    the library functions in the executable already when the program is linked. This
    is called static linking. This may happen when you want to run your simulations
    on another machine where the library is not installed. You can tell the linker
    to link the executable code for the library function by using the linker/compiler
    option -static.


    # 7.1 Standard C library


    You have already encountered many standard C library functions in Chap. 1, for
    example for allocating memory via malloc(), for calling shell functions via system(),
    or converting strings to integers via atoi(). To use functions from this library
    properly, you have to use the directive


    ```

    #include <stdlib.h>

    ```


    Note that you do not have to use a -l option for linking executables of functions
    for the standard C library, because they are linked always.


    Here, we are discussing only one more function, which is used quite frequently
    in the context of simulations. It is qsort(), which allows to sort in ascending
    order arrays of arbitrary data types. The function implements the efficient quicksort
    algorithm [Sedgwick (1990); Cormen et al. (2001)], which sorts n elements in typically
    O(n log n) comparison steps. The order is determined by some sorting criterion,
    which has to be provided by the program which calls qsort().


    The function prototype of qsort() looks as follows:'
