    \ two arguments: the number of sample points and an array containing a sample.\
    \ For an explanation of function pointers, see page 59. The function bootstrap_variance()\
    \ returns Var[H*].\n\nGET SOURCE CODE\nDIR: randomness\nFILE(S): bootstrap.c\n\
    bootstrap_test.c\n\n```\n```c\ndouble bootstrap_variance(int n, double *x, int\
    \ n_resample,\n double (*f)(int, double *))\n{\n double *xb; /* bootstrap sample\
    \ */\n double *h; /* results from resampling */\n int sample, i; /* loop counters\
    \ */\n int k; /* sample point id */\n double var; /* result to be returned */\n\
    \n h = (double *) malloc(n_resample * sizeof(double));\n xb = (double *) malloc(n\
    \ * sizeof(double));\n for(sample=0; sample<n_resample; sample++)\n {\n for(i=0;\
    \ i<n; i++) /* resample */\n {\n k = (int) floor(drand48()*n); /* select random\
    \ point */\n xb[i] = x[k];\n }\n h[sample] = f(n, xb); /* calculate estimator\
    \ */\n }\n\n var = variance(n_resample, h); /* obtain bootstrap variance */\n\
