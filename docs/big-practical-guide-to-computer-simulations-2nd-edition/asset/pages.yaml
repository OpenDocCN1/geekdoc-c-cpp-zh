  md: 'Consequently, for any data, for example obtained from a Markov chain Monte
    Carlo simulation, C(0) = 1 will always hold. Then C(τ) decreases with increasing
    difference τ, see for example Fig. 8.40. Very often the functional form is similar
    to an exponential ~ exp(−τ/τc). In theory, C(τ) should converge to zero for τ
    → ∞, but due to the finite size of the sample, usually strong fluctuations appear
    for τ approaching n. A typical time τc which measures how fast the dependence
    of the sample points decreases is given by C(τc) = 1/e, which is consistent with
    the above expression, if the correlation function decreases exponentially. At
    twice this distance, the correlation is already substantially decreases (to 1/e²).
    Consequently, if you want to obtain error bars for samples obtained from dependent
    data, you could include for instance only points x0, x2τc, x4τc, x6τc, … in a
    sample, or just use n/(2τc) instead of n in any calculation of error bars. Although
    these error bars are different from those if the sample was really independent,
    it gives a fairly good impression of the statistical error.


    Alternatively, to obtain a typical time without calculating a correlation function,
    you can also use the blocking method [Flyvbjerg (1998)]. Within this approach,
    you iteratively merge neighboring data points via x_i^{(z+1)} = (x_{2i}^{(z)}
    + x_{2i+1}^{(z)})/2 and n^{(z+1)} = n^{(z)}/2 (iteration level z = 0 corresponds
    to the original sample). You calculate the standard error bar σ^{(z)}/√n^{(z)}
    − 1 for each iteration level. Once it reaches a plateau at level z_c, the data
    is (almost) independent and the true error bar is given by the level value. Then
    τ_c = 2^{z_c} is a typical time of independence of the data points.


    If you are really just interested in error bars, i.e. you do not need to know
    the value of τ_c, you could also use the bootstrap approach which is not susceptible
    to dependence of data, see Sec. 8.3.4.


