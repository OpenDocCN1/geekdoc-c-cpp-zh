  md: 'post-doc projects. I became more and more experienced and refined my approaches.
    I also improved my ways to work by reading books about software engineering, algorithms,
    data structures and data analysis, as well as by learning to use many programs.
    After the first-post doc years, I began to supervise students. Hence, I started
    to pass on my knowledge, trying to help other people to avoid many pitfalls and
    to devise highly efficient programs. Some of my experiences found their way to
    the last chapter of the book of Heiko Rieger and myself with the title “Optimization
    Algorithms in Physics”. That chapter is in fact a very short version of the present
    book. Thus, it served as a seed of this book and some material of the old chapter
    appears occasionally here.² During the years, I supervised more and more students,
    and even gave a university course on the practical aspects of computer simulations.
    This course contained a lot of new material compared to the book chapter and in
    fact it served as a seed for the present book. Nevertheless, the material I used
    for supervising students was still collected from several different sources, often
    not quite compatible with each other. I started to feel that it would help my
    work, and also increase the efficiency, if I wrote a full book about practical
    aspects of computer simulations, which should contain “all” needed material comprehensively.
    After two more years, I received an email from World Scientific, where my course
    web page was noticed. They asked me whether I would like to write a book, based
    on the course. Now it was not difficult to come to the decision indeed to realize
    the book. You are now holding the result in your hands.


    Note that this book contains a very personal view of which tools are considered
    useful. Very often, I present several independent tools, such as tools for editing,
    compiling and analyzing programs rather than one all-purpose environment which
    usually contains a framework just integrating these basic tools. Nevertheless,
    most of the tools introduced are standard programs and available on all computer
    systems (for Microsoft operating systems they sometimes have other names).


    Here, I give an overview over the contents of the book. First, a short introduction
    to C programming is given. Also related topics like macros, make files and shell
    scripts are touched. In the second chapter, the main ideas of software engineering
    are explained and several hints allowing the construction of efficient and reliable
    code are stated. In Chap. 4, three very


