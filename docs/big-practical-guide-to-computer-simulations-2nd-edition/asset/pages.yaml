  md: "of the clusters are also taken into account. For details about many clustering\
    \ algorithms, see Ref. [Jain and Dubes (1988)].\n\nOnce the clustering procedure\
    \ is completed and the dendrogram calculated, the full clustering information\
    \ is contained in the dendrogram, in particular the hierarchical structure, i.e.,\
    \ if clusters contain sub clusters that in turn contain sub clusters etc. To obtain\
    \ a single set of clusters, a common approach is to use a threshold θ such that\
    \ all inter-cluster distances are larger than θ and all intra-cluster distances\
    \ are smaller or equal to θ. This is similar to the neighbor-based clustering\
    \ presented before, only that the intra-cluster distances for agglomerative clustering\
    \ represent joint properties of sub clusters instead of single pairs of nodes.\
    \ When drawing the dendrogram, one usually uses the δ = 0 (height) position for\
    \ the leaves. For all other nodes, representing mergers of two clusters i_min,\
    \ j_min one uses a height δ ~ d_(i_min, j_min), i.e., the distance of the two\
    \ clusters which are merged. Thus, using a threshold θ corresponds to drawing\
    \ a horizontal line at δ = θ and cutting off all nodes above this line, c.f. Fig.\
    \ 8.47. The remaining trees located below the line represent the clusters. Often\
    \ a meaningful choice of θ is to cut the tree at a height value inside the largest\
    \ interval where no node has its height in. This correspond to the iteration where\
    \ the difference between the distances of the last and the current mergers is\
    \ largest.\n\nIn the following, we discuss the C implementation of the single-linkage\
    \ agglomerative clustering. First, we need a data structure for the nodes of the\
