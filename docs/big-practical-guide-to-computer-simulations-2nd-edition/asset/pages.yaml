    \ is not written in the file explicitly, but it is contained in a header file,\
    \ just as the function prototypes for standard functions like sin() and printf().\
    \ This header file must be included using the #include directive, see Sec. 1.6.\
    \ Note that for including your own header files, you have to use the form #include\
    \ \"header.h\" instead of #include <header.h>, which is only used for predefined\
    \ (system) header files.\n\nIn this case, where the function is not contained\
    \ in a header file, the function prototype should be preceded by the key word\
    \ external, which indicates that the function definition occurs outside the present\
    \ file, e.g.\n\n```\nextern double step_function(double);\n```\n\nNow, the function\
    \ step_function() can always be used after the corresponding header file has been\
    \ made known by using #include. Usually, one puts all #include directives at the\
    \ beginning of a source file, such that all definitions are known everywhere inside\
    \ the source file.\n\n(4) All first three possibilities allow step_function()\
    \ to be used arbitrarily in other functions, provided that the functions are informed\
    \ about step_function() via the definition itself or via a prototype. The reason\
    \ is that step_function() is a global object. Nevertheless, it is possible to\
