  img_proc: true
- pgno: 190
  md: 'Assume that you are writing a simulation package for describing the social
    interactions of persons. For each person, there is always a (sometimes empty)
    set of other people who are currently interacting with the person. This set may
    change in time. Hence, we would like to have a data structure to store all current
    acquaintances in a flexible way, i.e., persons can be easily added and removed
    from the set. Here, we present a data structure called a list, which allows to
    solve this task. Lists are, for example, used in atomistic simulation packages
    for implementing short-range interactions. In this case, for each atom interacts
    only with atoms not too far away. In this case, for each atom a list is used (a
    so-called “Verlet table”) to store the atoms which are currently in the neighborhood.⁴
    Another example for lists are waiting queues, which consist of tasks given in
    a linear order, where one task has to be performed after the other. Here, also
    the order of the elements is important, as for many applications, in contrast
    to acquaintance lists or the Verlet tables. Note that the example applications
    and implementations given below are rather simple, in contrast to the real applications
    just mentioned, to keep the subject as simple as possible.


    Lists are generalizations of arrays of elements (of arbitrary type). Lists also
    exhibit a linear order like arrays, i.e., there is always a first element, for
    each element there is a successor, except for the last element of the list. For
    an array, the order of the elements is fixed. If you want to remove, say, the
    5th element in an array of 100 elements, and you want to keep the order of the
    remaining elements, then you have to copy the 6th element to the 5th position,
    the 7th element to the 6th, and so on, see Fig. 6.7. Hence, for a list of N elements,
    O(N) operations are needed to remove an element from the list while keeping the
    order. Also O(N) operations are required when an element is inserted into an array.
    Furthermore, the size of an array is fixed, hence usually one stores the number
    of the last element which is used and the maximum number of allowed elements.
    Now, if the number of elements to be stored grows larger than the number of allowed
    elements, one has to use realloc to obtain more memory, which might lead to a
    considerable amount of memory copy operations, if the free amount of memory right
    behind the array does not provide enough available memory to satisfy the request.'
