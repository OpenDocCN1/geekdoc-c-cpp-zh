  md: '![](img/0dfb82b7d27bdfebb8b65cb33de3626a_410_0.png)


    Fig. 9.3 A sample screen-shot showing the xfig program.


    The figures can be saved in the internal fig format, and exported in several file
    formats such as (encapsulated) postscript, LaTeX, Jpeg, Tiff or bitmap. The xfig
    program can be called in a way that it produces just an output file with a given
    fig input file. This is very convenient for larger projects where some small picture
    objects are contained in other pictures and for changing the appearance of the
    small objects in all other files. With the help of the make program, pretty large
    projects can be realized.


    Last but not least, please note that xfig is vector-oriented, but not pixel-oriented.
    Therefore, you cannot treat pictures like jpg files (e.g. photos) and apply operations
    like smoothing, sharpening or filtering. For these purposes, the package gimp
    is suitable. It is freely available again from GNU [Lou kides and Oram (1996)].


    # 9.2.3 Drawing graphs


    As we have seen in Sec. 6.8, many simulations are based on graph representations.
    In these cases, it is very useful to visualize graphs for debug-'
