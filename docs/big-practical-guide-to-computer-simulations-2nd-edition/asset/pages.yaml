    # 8.6.1 Maximum likelihood


    Here, we consider the following task: For a given sample {x0, x1, ..., xn−1} and
    a probability distribution represented by a pmf pθ(x) or a pdf fθ(x). we want
    to determine the parameters θ = (θ1,...,θnθ) such that the pmf or pdf represents
    the data "best". This is written in parentheses, because there is not unique definition
    what "best" means, or even a mathematical way to derive a suitable criterion.
    If one assumes no prior knowledge about the parameters, one can use the following
    principle:


    **Definition 8.26** The *maximum-likelihood* principle states that the parameters
    θ should be chosen such that the likelihood of the data set, given the parameters,
    is maximal.


    In case of a discrete random variable, if it can be assumed that the different
    data points are independent, the likelihood of the data is just given by the product
    of the single data point probabilities. This defines the *likelihood function*


    L(θ) ≡ pθ(x1) pθ(x2) ... pθ(xn−1) = ∏_{i=0}^{n−1} pθ(xi) (8.92)


    For the continuous case, the probability is zero that one obtains during a random
    experiment a certain sample exactly. Nevertheless, for a small uncertainty parameter
    ε, the probability to obtain a value in the interval [x̄ − ε, x̄ + ε] is P(x̄
    − ε ≤ X < x̄ + ε) = ∫_{x̄ − ε}^{x̄ + ε} fθ(x) dx ≈ fθ(x̄)2ε. Since 2ε enters just
    as a factor, it is not relevant to determining the maximum. Consequently, for
    the continuous case, one considers the following likelihood function


    L(θ) ≡ fθ(x1) fθ(x2) ... fθ(xn−1) = ∏_{i=0}^{n−1} fθ(xi) (8.93)


    To find the maximum of a likelihood function L(θ) analytically, one has to calculate
    the first derivatives with respect to all parameters, respectively, and requires
    them to be zero. Since calculating the derivative of a product involves the application
    of the product rule, it is usually more convenient'
