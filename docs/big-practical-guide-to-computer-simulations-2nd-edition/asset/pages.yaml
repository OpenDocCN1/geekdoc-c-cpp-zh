    # 6.6 Lists


    In the previous sections, elementary algorithms were presented. Now we turn to
    data structures, which are special ways to arrange data in memory such that algorithms
    can be implemented as efficiently as possible. Note that for different types of
    tasks, different data structures are most suitable, hence one always has to have
    the target application in mind. This also explains why a careful planning of the
    simulation program before actually starting programming is very recommendable,
    see Chap. 3. Furthermore, note that usually data structures which allow for very
    fast operations sometimes require some degree of redundancy. Very often, the quicker
    the operations are, the more memory you have to consume. Hence, efficiency in
    terms of running time comes at the expenses of efficiency in terms of memory,
    and vice versa.'
