    Therefore, one can calculate the probability to obtain a random number for any
    arbitrary interval, hence also for unions of intervals.


    The distribution function, although it contains all information, is sometimes
    less convenient to handle, because it gives information about cumulative probabilities.
    It is more obvious to describe the outcomes of the random experiments directly.
    For this purpose, we have to distinguish between *discrete* random variables,
    where the number of possible outcomes is denumerable or even finite, and *continuous*
    random variables, where the possible outcomes are non-denumerable. The random
    variable describing the coin is discrete, while the position of an atom inside
    a container is continuous.


    # ### 8.1.1 Discrete random variables


    We first concentrate on discrete random variables. Here, an alternative but equivalent
    description to the distribution function is to state the probability for each
    possible outcome directly:


    **Definition 8.6** For a discrete random variable $X$, the *probability mass function*
    (pmf) $p_X : \mathbb{R} \to [0,1]$ is given by


    $$p_X(x) = P(X = x). \tag{8.12}$$


    Again, the index $X$ is omitted if no confusion arises. Since a discrete random
    variable describes only a denumerable number of outcomes, the probability mass
    function is zero almost everywhere. In the following, the outcomes $x$ where $p_X(x)
    > 0$ are denoted by $\tilde{x}_i$. Since probabilities must sum up to one, see
    Eq. 8.1, one obtains $\sum_i p_X(\tilde{x}_i) = 1$. Sometimes we also write $p_i
    = p_X(\tilde{x}_i)$. The distribution function $F_X(x)$ is obtained from the pmf
    via summing up all probabilities of outcomes smaller or equal to $x$:


    $$F_X(x) = \sum_{\tilde{x}_i \le x} p_X(\tilde{x}_i) \tag{8.13}$$


    For example, the pmf of the random variable arising from the fair coin Eq. (8.9)
    is given by $p(0) = 0.5$ and $p(1) = 0.5$ ($p(x) = 0$ elsewhere). The generalization
    to a possibly unfair coin, where the outcome “1” arises with probability $p$,
