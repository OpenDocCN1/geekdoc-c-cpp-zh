    Unlike the conventional office packages, with LaTeX you do not see immediately
    the text in the form it will be printed, i.e. LaTeX is not a WYSIWYG (''What you
    see is what you get'') program. The text is entered in a conventional text editor
    (like Emacs) and all formatting is done via special commands. An introduction
    to the LaTeX language can be found, for example, in Refs. [Lamport and Bibby (1994);
    TUG]. Although you have to learn some special commands, using LaTeX has several
    advantages:


    +   - The quality of the typesetting is excellent. It is much better than self-made
    formats. You do not have to care about the layout. But still, you are free to
    change everything according to your requirements.

    +   - Large projects do not give rise to any problems, in contrast to many commercial
    office programs. When treating a LaTeX text, your computer will never complain
    when your text is more than 500 pages or contains many huge post-script figures.

    +   - Typesetting of formulas is very convenient and fast. You do not have to
    care about sizes of indices appearing themselves in indices etc. Furthermore,
    in case you want to replace all o in your formulas with β, for example, this can
    be done with a conventional replace, by replacing all \alpha strings by \beta
    strings. For the case of an office system, please do not ask how to do this conveniently.

    +   - There are many additional packages for enhanced styles such as letters,
    transparencies or books. The Bibtex package is very convenient, which allows the
    user to build up large literature data bases conveniently.

    +   - Since you can use a conventional editor, the writing process is very fast.
    You do not have to wait for a huge packet to come up.

    +   - On the other hand, if you still prefer a WYSIWYG (''what you see is what
    you get'') system, there is a program called lyx [Lyx] which operates like a conventional
    word processor but creates LaTeX files as output. Nevertheless, once you get used
