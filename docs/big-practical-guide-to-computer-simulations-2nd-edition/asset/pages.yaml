    For our example, we use an additional counter argv, to treat one argument after
    the other. This is useful in particular in case the program has additional options,
    see below. Here, the program arguments are treated via:¹⁴


    ```

    int N;                 /* number of particles */

    double temp;           /* temperature */

    int argc = 1;          /* counter to treat arguments */


    N = atoi(argv[argc++]);

    sscanf(argv[argc++], "%lf", &temp);

    ```


    Some simulation parameters are usually kept at their default values and they do
    not have to be passed as arguments each time. In this case, it is convenient to
    use program options to change the default values. Program options are usually
    indicated by a ''-'' character at the beginning, followed by some name, and maybe
    some additional values. A call to the example program including some options could
    look like


    `arguments -size 10.3 -appendix XX 100 3.7`


    Options and their accompanying values are stored in the argv[] strings like any
    other argument. Consequently, they can be processed using standard string manipulation.
    For instance, one can implement a loop, that is executed before the non-optional
    arguments are read, which is iterated as long as the "current" argument starts
    with a ''-'' character. Then, one can compare the "current" argument via strcmp
    to the different available options. If the option matches, one can take suitable
    actions, like setting a flag or assigning some parameter value. Finally, one should
    implement printing an error message in case the option passed as argument is not
    known to the program. For the example program, this could look like:


    ```

    char appendix[1000];     /* to identify output file */

    int do_save;             /* save files at end of output */

    int print_help;          /* print help message ? */

    double l;                /* lateral size of system */

    int num_steps;           /* how many MD steps are performed */


    /** default values **/

    l = 10; do_save = 0; appendix[0] = 0;

    ```


    14 For this program, no line numbers are given here because we discuss different
    parts of the example program in non-linear order.'
