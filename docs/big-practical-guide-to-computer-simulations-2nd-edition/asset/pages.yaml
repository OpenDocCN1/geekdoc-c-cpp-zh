- pgno: 128
  md: 'This will create a subdirectory in the current directory (*listtest* here),
    which contains the files (and possible other subdirectories recursively) contained
    in the given repository directory. Note that it is also possible to check out
    just subdirectories. Hence, if *list* contained a subdirectory *docs*, you could
    specify *file:///home/hartmann/svn/repos1/list/docs* as well. By default, *subversion*
    uses the base name as the name of the directory which is created; in this case,
    the subdirectory *list/docs* would be created. Also, one can give a third optional
    argument which specifies the path of the directory or directories being checked
    out; hence, specifying *ldocs* as forth argument would put all repository files
    and directories of *list/docs* into *./ldocs*. Please read the online help (*svn
    help checkout*) for more information.


    In addition to copying the regular files from the repository, *subversion* will
    create a subdirectory *.svn* in all directories which are checked out. These directories
    contain all system information needed by *subversion* to administer the working
    files. Please do not remove or edit the files in these directories.


    You can check out any directory or subdirectory of the repository as often as
    you like. This means, you can have many working versions in parallel (if you do
    not get confused by this).


    Now you may edit some files (say after changing the directory to *list*). This
    is done using the *emacs* editor here. Editing and other operations change the
    *status* of a file, which can be inspected using the *subversion* command *status*.
    You can perform these operations locally, which means that you do not have to
    enter the repository URL:


    ```

    ~~~

    Gene:list>emacs list_main.c

    Gene:list>svn status

    M       list_main.c

    ~~~

    ```


    The letter ‘M’ indicates that the file is *modified*. Other important status values
    are ‘A’ for a file or directory which has been added using *svn add* or copied
    using *svn copy*, ‘D’ for a file or directory which has been deleted using *svn
    delete*. If you use *svn move*, the old file or directory will be deleted and
    the new one created. Do never use operating system commands like *rm* or *mv*
    to remove files which are under control of *subversion*, because this would mess
    up the whole VCS. Finally, the status ‘?’ is used for files or directories which
    are not under the control of *subversion*.'
