- pgno: 411
  md: 'ging purposes and also to present results. Here, the GraphViz package [GraphViz]
    is explained. It works basically in the following way:


    +   (1) One generates an ASCII file, which describes the graph and its properties.
    This is the so-called dot file.

    +   (2) A filter program is used to generate an image from the dot file.


    The dot file is human readable and editable. This has some advantages: You can
    generate graphs either using a normal text editor or you can write simple C functions
    to output a graph in dot format, which is stored using your own data structures
    within your simulation package. This will be described below for the graph data
    structures used in Sec. 6.8. There is also the interactive program dotty, which
    allows graphs to be loaded, displayed, modified and saved in the dot format. First,
    we explain the general properties of the dot file and of the commands to generate
    an image from a dot file. Here, only short ready-to-run examples are given. Some
    details can be found in the man page when entering man dot on a Unix system or,
    more complete and up-to-date, at Ref. [GraphViz].


    The undirected graph shown in Fig. 6.24 can be described by the following dot
    file, called testgraph.dot:


    ```

    ```dot

    graph test

    {


    0

    1

    2

    3

    4

    5

    0 -- 1

    1 -- 3

    1 -- 4

    2 -- 4

    }

    ```

    ```


    On line 1, graph shows that the file describes an undirected graph, test being
    the ID of the graph. An ID can be a string composed of alphabetic characters,
    digits or underscores. Also more complex IDs are possible, in particular if they
    are double-quoted strings "..." or html strings <...>. Note that the key words
    strict, graph, digraph, node and edge are not allowed as IDs. Between the braces
    (line 2 and 14) the graph is described, this is the so-called statement part.
    For this example, first (lines 5-10)'
  merge: -1
  img_proc: true
- pgno: 412
  md: 'comes a list of node IDs (node statements). These IDs follow the same rules
    as the ID of the graph. Then (lines 11-14) comes a list of edges (edge statements),
    which are composed of two IDs joint by the edge operator --. Several statements
    per line are possible, if they are separated by spaces or tabs or semicolons.


    To generate an image, say a postscript file from the dot file, one uses a filter
    program, e.g. dot. It can be called using a command line like


    ```

    dot -Tps testgraph.dot > testgraph.eps

    ```


    The output of dot is always to stdout. Therefore, it is redirected to a file testgraph.eps
    here. The option -Tps means that the output format is postscript. Other formats
    are given below. The resulting postscript file is shown in Fig. 9.4.


    ![](img/0dfb82b7d27bdfebb8b65cb33de3626a_412_0.png)


    Fig. 9.4 The graph of Fig. 6.24, as plotted by the dot program.


    Also lists of edges of the form node1 -- node2 -- node3 -- node4 can be given.
    Note that the order of nodes and edges is arbitrary within the statement list.
    Consequently, one can mix or alternate node and edge statements. In particular,
    for nodes appearing in edges, it is not necessary to include them explicitly as
    node statements, unless one wants to state additional attributes. These optional
    attributes can be written in [...] brackets behind the nodes and edges using a
    comma-separated list of attribute assignments of the form <attribute>=<value>.
    There are many different attributes for shape, color, (minimum) size, fonts, positions
    etc. We do not list them here for conciseness, but give just an example below.
    Please refer to the man page for details. Here we state only that attributes can
    be set also globally for all nodes or all edges by writing node [<attribute list>]
    or edge [<attribute list>]. Attributes which apply to the full graph are'
