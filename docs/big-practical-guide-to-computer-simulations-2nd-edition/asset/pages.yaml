    # 8.6 General estimators


    In Sec. 8.3, different methods are presented of how to estimate parameters which
    can be obtained directly and simply from the given sample {x0, x1, ..., xn−1}.
    In this section, a general method is considered which enables estimators to be
    obtained for arbitrary parameters of probability distributions. The method is
    based on the maximum-likelihood principle, which is exposed in Sec. 8.6.1. This
    principle can be extended to the modeling of data, where often a sample of triplets
    {(x0, y0, σ0), (x1, y1, σ1), ..., (xn−1, yn−1, σn−1)} is given. Typically the
    xi data points represent some control parameter, which can be chosen in the simulation,
    such as the temperature of a gas. It is assumed that all xi values are different.
    Consequently, the simulation has been carried out at n different values of the
