  md: "defined, while this is possible when using dynamic memory management. For this\
    \ purpose, the `realloc()` function exists, which expects two arguments: 1. the\
    \ pointer to the memory area to be extended and 2. the new size of the array:\n\
    \n```\nvoid *realloc(〈pointer〉, 〈size〉);\n```\n\nThe function returns a pointer\
    \ to the new start of the memory chunk. This can be the same position as before\
    \ the call. Nevertheless, it may sometimes be necessary to extend the memory chunk\
    \ considerably. In this case it might happen that the operating system allocates\
    \ a completely different part of the memory and copies the memory content from\
    \ the old chunk to the beginning of the new chunk. In this case, the execution\
    \ of the command might take some time, depending on the size of the memory area\
    \ to be copied.\n\nNote that one should pass only pointers to `realloc()` which\
    \ have been allocated via `malloc()`, otherwise the behavior of the function is\
    \ undefined. Also, it might happen that the available memory is not sufficient.\
    \ In this case the special NULL pointer is returned.\n\nIf one wants to allocate\
    \ a matrix dynamically, one has to do this in two steps. First, one has to allocate\
    \ one array which will contain pointers to the beginning of each row, respectively.\
    \ Now, within a loop, the memory areas for the different rows can be allocated.\
    \ If `n_rows` and `n_cols` are the numbers of rows and columns, respectively,\
    \ the code to allocate the matrix `mat` could look like\n\n```\ndouble **mat;\n\
    int n_rows = 10, n_cols = 10;\nint i, j;\n\nmat = (double **) malloc(n_rows*sizeof(double\
    \ *));\nfor(i=0; i<n_rows; i++)\n    mat[i] = (double *) malloc(n_cols*sizeof(double));\n\
    ```\n\nThe access can be performed in the same way as for standard matrices; hence,\
    \ one can write, e.g. to initialize all entries to 0:\n\n```\nfor(i=0; i<n_rows;\
    \ i++)\n    for(j=0; j<n_cols; j++)\n        mat[i][j] = 0;\n```"
