  md: 'Now the program can be run as usual, passing n as argument. In addition to
    the normal output, it will generate a profile file gmon.out, which contains the
    run-time statistics of the execution. If you want a different profile file name
    (for example, when collecting several profiles) you can rename the file after
    the execution of program is finished. The run-time overhead generated by the analysis
    is usually hardly measurable.


    A human-readable analysis of the running time can be obtained by calling gprof
    with the name of the executable as first argument (a.out by default) and the name
    of the profile file as second argument (gmon.out by default). gprof allows for
    several options, which are not needed for the basic functionality. Information
    about the options can be obtained by reading the man page of gprof, i.e. via man
    gprof on UNIX systems. For the example program shown above, one obtains an analysis
    of the running times via


    ```

    `gprof gprof_test gmon.out`

    ```


    The analysis of the running times is written to stdout. The head of the default
    output looks as follows (for running the program with the size of the array set
    to n=1000):


    Flat profile:


    Each sample counts as 0.01 seconds.


    | % time | cumulative seconds | self seconds | calls | self s/call | total s/call
    | name |

    | ---: | ---: | ---: | ---: | ---: | ---: | :--- |

    | 93.16 | 24.59 | 24.59 | 500500 | 0.00 | 0.00 | calc_prod |

    | 6.74 | 26.36 | 1.78 | 501500 | 0.00 | 0.00 | calc_sum |

    | 0.09 | 26.39 | 0.03 | 1 | 0.03 | 26.39 | all1 |


    The “flat profile” (shown by default, or when using the option -p, suppressed
    by -P or --no-flat-profile) basically states for each function, listed in the
    last column (name), how much running time it consumes. The first column (% time)
    states which percentage of the total running time is spent in the function, while
    the third column (self seconds) contains the running time measured in seconds
    consumed by the function. Note that this number does not contain the running times
    used by calls to other functions from this function, i.e. to descendants. The
    flat profile table is sorted according to the third column. The second column
    (cumulative seconds) contains the cumulative running times as obtained from the
    third column. In the fourth column (calls), the number of times each function
    is invoked is given. In the above example, the number of calls to calc_prod()
    and calc_sum() are almost the same (calc_sum() exhibits some extra calls in'
