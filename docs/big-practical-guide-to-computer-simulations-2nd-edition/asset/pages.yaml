    \ tools. Formally, histograms are introduced in Sec. 8.3.3.\n\nInitially, you\
    \ have to think about the data you would like to store. The histogram itself is\
    \ an array table of bins. Each bin just counts the number of events which fall\
    \ into a small interval of the corresponding histogram range. To achieve a high\
    \ degree of flexibility, the range and the number of bins must be variable. It\
    \ is assumed here for simplicity that all bins have the same width. Thus, the\
