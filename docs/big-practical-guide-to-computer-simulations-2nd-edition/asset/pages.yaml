    # ### 8.3.2 Confidence intervals


    In the previous section, we have studied estimators for parameters of a random
    variable X using a sample obtained from a series of independent random experiments.
    This is a so-called *point estimator*, because just one number is estimated.


    Since each estimator is itself a random variable, each estimated value will be
    usually off the true value θ. Consequently, one wants to obtain an impression
    of how far off the estimate might be from the real value θ. This can be obtained
    for instance from:


    **Definition 8.22** The *mean squared error* of a point estimator H = h(X_0, X_1,
    …, X_{n−1}) for a parameter θ is


    $$

    MSE(H) ≡ E[(H − θ)²] = E[(H − E[H] + E[H] − θ)²]

    = E[(H − E[H])²] + 2E[(H − E[H])(E[H] − θ)] + E[(E[H] − θ)²]

    = E[(H − E[H])²] + 2E[(H − E[H])]_{=0}(E[H] − θ) + (E[H] − θ)²

    = Var[H] + (E[H] − θ)²  (8.60)

    $$


    If an estimator is unbiased, i.e., if E[H] = θ, the mean squared error is given
    by the variance of the estimator. Hence, if for independent samples (each consisting
    of n sample points) the estimated values are close to each other, the estimate
    is quite accurate. Unfortunately, usually only one sample is available (how to
    circumvent this problem rather ingeniously, see Sec. 8.3.4). Also the mean squared
    error does not immediately provide a probabilistic interpretation of how far the
    estimate is away from the true value θ.


    Nevertheless, one can obtain an estimate of the error in a probabilistic sense.
    Here we want to calculate a so-called confidence interval also sometimes named
    error bar.


    **Definition 8.23** For a parameter θ describing a random variable, two estimators
    l_α = l_α(x_0, x_1, …, x_{n−1}) and u_α = u_α(x_0, x_1, …, x_{n−1}) which'
