  md: 'Var_{\underline{r}}{(x^{(i)})} = \underline{r}^T C \underline{r} = \left(\sum_z
    r_z e_z\right)^T C \left(\sum_{z''} r_{z''} e_{z''}\right)

    \stackrel{(8.87)}{=} \left(\sum_z r_z e_z\right)^T \left(\sum_{z''} r_{z''} \lambda_z
    e_{z''}\right)

    = \sum_z r_z^2 \lambda_z . \tag{8.88}


    where for the last equality, we have used the orthonormality of the basis of eigenvectors.
    As mentioned in the beginning, we are interested in the direction which maximizes
    the variance of the projection of the data sample onto the \underline{r} direction,
    hence the maximum of (8.88). Due to the normalization of \underline{r} we have
    1 = \underline{r}^2 = (\sum_z r_z e_z)^2 = \sum_z r_z^2. Since the eigenvalues
    are sorted in descending order, we obtain the maximum for Var_{\underline{r}}{(x^{(i)})}
    simply by setting r_1 = 1 and r_z = 0 for z = 2, ..., d, thus \underline{r} =
    e_1. The direction of the maximum spread of the data, i.e., the first principal
    component, is simply the direction of the eigenvector corresponding to the largest
    eigenvalue of the (sample) covariance matrix, and the variance in that direction
    is the largest eigenvalue itself.


    Thus, it is straightforward to see that the direction of the second largest spread
    of the data (orthogonal to the direction of the largest spread), i.e., the second
    principal component, is the eigenvector corresponding to eigenvalue \lambda_2
    and so on. Finally, the total spread (variance) of the data is simply the sum
    \lambda = \sum_z \lambda_z of all eigenvalues and the amount \lambda_z / \lambda
    denotes the relative amount of the spread corresponding to the zth eigenvector,
    i.e., corresponding to the zth most important principal component. Thus, using
    the eigenvalues one can somehow estimate how many really important independent
    degrees of freedom the data exhibits. For example, if in a sample of d = 10 dimensional
    data points, the first three eigenvalues sum up to 99% of the total variance \lambda
    of the sample, then in fact the data can be represented by three more or less
    independent variables. The dependencies inherent in the variables are described
    by the eigenvectors, which are often, unfortunately, hard to interpret.


    The C function `principal_components()` calculates the principal components of
    a data sample. Here we again use some data types and functions from the GNU scientific
