  md: "Here, a basic example is considered. The simulation consists of some \"agents\"\
    \ which are distributed in the x-y plane. Each agent has a position, serving as\
    \ key. Furthermore, the data associated with each agent consists of some \"capacity\"\
    \ and of some \"interaction range\", the exact meaning is not important here.\
    \ This is implemented via the following two type definitions for agent_t and agentkey_t:\n\
    \nGET SOURCE CODE\nDIR: libraries\nFILE(S): maps.cpp\n\n```\nstruct agent_t\n\
    {\n    int capacity;    // how much an agent can process\n    int range;     \
    \  // interaction range\n};\n```\n\n```\nstruct agentkey_t\n{\n    int x,y;  \
    \       // position of agent\n};\n```\n\nSince the implementation is based on\
    \ search trees, one has to supply a comparison criterion. Here, we assume that\
    \ the x coordinates determine the order at first. If the x coordinates of two\
    \ agents are the same, the y coordinates are compared next. The comparison is\
    \ implemented as corresponding function object class, similar to the priority\
    \ queue shown above:\n\n```\nclass AgentkeySortCriterion\n{\npublic:\n    bool\
    \ operator() (const agentkey_t &k1, const agentkey_t &k2) const\n    {\n     \
    \   return( (k1.x < k2.x) || ( (k1.x == k2.x) &&(k1.y < k2.y) ) );\n    }\n};\n\
    ```\n\nIn the main() function, a map m1 is defined via\n\n```\ntypedef map<agentkey_t,\
    \ agent_t, AgentkeySortCriterion> agentmap_t;\nagentmap_t m1;                \
    \                           // stores all agents\n```\n\nThe first template argument\
    \ signifies the type of the keys, the second refers to the type of the value objects\
    \ to be stored, while the third is the sorting criterion. The third argument is\
    \ optional, if the operator < is defined for the keys, as for example for integer\
    \ keys."
