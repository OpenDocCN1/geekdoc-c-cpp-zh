- pgno: 28
  md: 'Hence, if you try to assign a value to num_rows somewhere else in the program,
    the compiler will report an error.


    Other fundamental data types, which have similar fundamental properties and usage
    like int, include


    +   - **short int**

    +   If you are sure that you do not need large numbers for specific variables,
    you can economize memory by using this data type. It consumes only two bytes,
    hence numbers in the range [−2^15, 2^15−1] are feasible, while for unsigned short
    int, numbers in the range [0, 2^16−1] can be used. Variables of these types are
    handled exactly like int variables.


    +   - **char**

    +   This data type is used to store characters using the ASCII coding systems
    in one byte. Characters which are assigned have to be given in single quotes.
    When printing characters using printf(), the conversion specification %c can be
    used. The following three lines define a variable of type char, assign a character
    and print it.


    ```

    char first_char;

    first_char = ''a'';

    printf("The first character is %c.\n", first_char);

