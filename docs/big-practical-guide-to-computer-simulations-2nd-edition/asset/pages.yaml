  md: 'code, even if the change is small. In that case, you can compare your new code
    with the older version. Please note that many editors only keep the second latest
    version as backup, so you have to take care of this problem yourself, unless you
    use a version control system, which keeps all older version automatically.


    For C programmers, it is always advisable to apply the -Wall (warning level: all)
    option. Then several bugs already show up during the compiling process, for example,
    the common mistake to use ''='' in comparisons instead of ''=='', or the access
    to uninitialized variables.


    In C++, some bugs can be detected by defining variables or parameter as const,
    when they are considered to stay unchanged in a block of code or subroutine. Here
    again, you will receive an error message already at compile stage, if attempts
    are made to alter the value of such a variable.


    This part finishes with a warning: Never try to save time when performing tests.
    Bugs which appear later on are much harder to find and you will have to spend
    a lot more time than you have "saved" before.


    # 3.1.7 Writing documentation


    This part of the software development process is very often disregarded, especially
    in the context of scientific research, where no direct customers exist. But even
    if you are using your own code, you should write good documentation. It should
    consist of at least three parts:


    +   - **Comments in the source code:** You should place comments at the beginning
    of each module, in front of each subroutine or each self-defined data structure,
    for blocks of the code and for selected lines. Additionally, meaningful names
    for the variables are crucial. Following these rules makes later changes and extension
    of the program much more straightforward. You will find more hints on how a good
    programming style can be achieved in Sec. 3.2.

    +   - **On-line help:** You should include a short description of the program,
    its parameters and its options in the main program. It should be printed, when
    the program is called with the wrong number/form of the parameters, or when the
    option -help is passed. Even if you are the author of the program, it is quite
    hard to remember all options and usages.

    +   - **External documentation:** This part of the documentation process is important,
    when you would like to make the program available to other users or when it grows
    really complex. Writing good instructions is'
