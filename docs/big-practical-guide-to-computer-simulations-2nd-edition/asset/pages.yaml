    Fig. 6.24 The undirected graph. G = {{0,1,2,3,4,5}, {0,1}, {1,3}, {3,4}, {4,1},
    {4,2}} is shown. The nodes are represented by circles and the edges by lines connecting
    the circles. The graph has n = 6 vertices and m = 5 edges; e.g., nodes 3 and 4
    are adjacent. The set of neighbors of vertex 1 is N(1) = {0,3,4}. Thus, node 1
    has degree 3, while node 2 has only degree 1. Node 5 is isolated. The graph contains
    the path 0,1,4,3 from node 0 to node 3 of length 3 and the cycle 1,3,4,1. Since
    the nodes 0,1,2,3,4 are mutually connected by paths, they form a connected component.
    There is a second connected component consisting only of node 5.


    A path from v1 to vk is a sequence of vertices v1,v2,...,vk which are connected
    by edges: (vi, vi+1) ∈ E ∀r 1,2,...,k − 1. The length of the path is k − 1. If
    v1 = vk the path is called closed. If no node except the first and the last one
    appears twice in a closed path, it is called a cycle. Note that trees, as introduced
    in Sec. 6.7, are just graphs without cycles. A set of nodes is called a connected
    component, if i) a path exists for each pair of nodes between the nodes within
    the connected components and ii) no nodes of the graph can be added such that
    i) still is true. Hence, a connected component is of maximal size. A graph is
    called connected if it has only one connected component.


    Now some definitions are given which apply only to directed graphs. For an edge
    e = (i,j), i is the head and j the tail of e. The edge e is called outgoing from
    i and incoming to j. Please note that for a directed path it is important that
    all edges point into the direction of the path, formally the definition is the
    same as in the case of an undirected graph. A set of nodes is called a strongly
    connected component (SCC), if i) from each of its nodes a directed path to every
    other node of the set exists within the set and ii) no nodes of the graph can
    be added such that i) still is true. In a directed graph, the outgoing and incoming
    edges can be counted separately. The indegree is given by id(i) = { |j | (j,i)
    ∈ E } and the outdegree is od(i) = { |j | (i,j) ∈ E }. Obviously, for all vertices
    d(i) = id(i) + od(i).'
