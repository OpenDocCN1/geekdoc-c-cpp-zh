  md: "This section is closed by a somehow larger example, which performs a bootstrap\
    \ resampling of a set of random numbers to obtain an error estimate for the variance\
    \ of the set of random numbers. For the concept of bootstrapping, see Sec. 8.3.4.\n\
    \n| GET SOURCE CODE |\n| --- |\n| DIR: scripts |\n| FILE(S): resampling.py |\n\
    \nWe start with a function, which computes the empirical mean, the empirical standard\
    \ deviation and the error bar of the mean (see Sec. 8.3.1) for a given set of\
    \ numbers, stored in a list:\n\n```\n```python\ndef basicStatistics(myList):\n\
    \    av=var=tiny=0.\n\n    # first pass to get mean\n    N = len(myList)\n   \
    \ av = float(sum(myList))/N\n    # second pass to get variance\n    for el in\
    \ myList:\n        dum = el - av\n        tiny += dum\n        var += dum*dum\n\
    \    # correction step\n    var = (var - tiny*tiny/N)/(N-1)\n    sDev = sqrt(var)\n\
    \    sErr = sDev/sqrt(N)\n    return av, sDev, sErr\n```\n```\n\nHere a very accurate\
    \ two-pass algorithm [Press et al. (1995)] is used for the calculation of the\
    \ variance. Note that in one single return statement a tuple of three values is\
    \ returned, see line 16. The elements of a tuple can be accessed separately using\
    \ the array notation, see the following function which picks the variance from\
    \ the tuple. In the main program we will use the resampling approach to calculate\
    \ the error bar of the variance:\n\n```\n```python\ndef Var(x):\n    return basicStatistics(x)[1]*basicStatistics(x)[1]\n\
    ```\n```\n\nThe actual resampling is performed in the following function."
