  md: '+   - \0 selects the Roman font, which is also the default font. A font is
    active until a new one is chosen.

    +   - \1 selects the italic font, used in equations.

    +   - \x selects a symbol font, which contains Greek characters. For example \xabchq\
    will generate αβγθ∂Λ, just to mention some important symbols.

    +   - \8 generates a subscript, while \M switches back to normal. For example
    \xb\s2\W\1(x) generates β₂(x).

    +   - \S generates a superscript, for instance \1A\S3x\N-5 generates A³x−5.

    +   - The font size can be changed with \t and \-.

    +   - With \o and \O one can start and stop underlining, respectively, for instance
    \1A\oBC\O D generates ABCD. Underlining can be controlled via \u and \U.


    By default, error bars are shown (toggle box lower right corner). At least you
    should increase the line width for the symbols (Symbols tab) and increase the
    base and rise line widths for error bars (Error bars tab).


    You should know that, when you are creating another plot, you do not have to redo
    all these and other adjustments of styles. Once you have found your standard,
    you can save it using the Save Parameters... sub menu from the Plot menu. You
    can conversely load a parameter set via the Load Parameters... sub menu of the
    same menu.


    Next, you can adjust the properties of the axes, by choosing the Set appearance...
    sub menu from the Plot menu or by double-clicking on an axis. The corresponding
    window will pop up, see Fig. 8.30. You have to select the axis where the current
    changes apply to [A]. For the x axis you should set the range in the fields Start
    [B] and Stop [C], here to the values 1 and 15. Below these two fields you find
    the important Scale field, where you can choose linear scaling (default), logarithmic
    or reciprocal, to mention the important ones.


    The most important adjustments you can perform within the Main tab [D]. Here you
    enter the label shown below the axis in the Label string field [E]. The format
    of the string is the same as for the data set legends. Here you enter just \1L,
    which will show as L. The major spacing of the major (with labels) and minor ticks
