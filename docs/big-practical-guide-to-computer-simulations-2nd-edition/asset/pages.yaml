    ```\n\nFor more details on string functions, please refer to the documentation,\
    \ e.g. man string will give an overview over many useful string functions.\n\n\
    Matrices or tensors can be implemented using multi-dimensional arrays. E.g a matrix\
    \ with elements of type double can be defined via\n\n```\ndouble mat1[10][20];\n\
    ```\n\nThe i,j'th element of the matrix mat1 is accessed using mat1[i][j], again\
    \ arbitrary int expressions can be used instead of i and j. Note that again no\
    \ automatic check for array boundaries is performed. Assuming that vec1 and vec2\
    \ are double arrays of lengths 20 and 10, respectively, the following piece of\
    \ code multiplies the matrix mat1 with the vector vec1 and stores the result in\
    \ the vector vec2, which is finally printed:\n\n```\nfor(i=0; i<10; i++)\n{\n\
    \    vec2[i] = 0.0;\n    for(j=0; j<20; j++)\n        vec2[i] += mat1[i][j]*vec1[j];\n\
    }\nfor(i=0; i<10; i++)\n    printf(\"%f\\n\", vec2[i]);\n```\n\nTechnically, the\
    \ compiler treats multi-dimensional arrays like a big one-dimensional array. Let's\
    \ see how this works for the matrix: First, a big chunk of memory is allocated\
    \ (again often uninitialized). Next, the array is stored in this chunk consecutively\
    \ row by row. Consequently, in this case, the matrix will be stored in a chunk\
    \ of 10×20 double elements each. Therefore, mat1 will contain the address where\
