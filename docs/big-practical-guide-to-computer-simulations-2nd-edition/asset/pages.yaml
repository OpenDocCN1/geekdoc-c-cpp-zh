  md: "```\n```c\nvoid qsort(void *base, size_t nel, size_t width,\n    int (*compare)(const\
    \ void *, const void *));\n```\n```\n\nThus, it expects as argument a pointer\
    \ base to the beginning of the array to be sorted and the number nel of elements\
    \ in the array. The third argument specifies the number of bytes of one element.\
    \ The last argument provides the sorting criterion. Technically, it is a pointer\
    \ to a function, which itself has the prototype\n\n```\n```c\nint compare(const\
    \ void *p1, const void *p2);\n```\n```\n\nThis function has to be provided by\
    \ the program which calls qsort. It should take two pointers p1, p2 as arguments,\
    \ which point to two array elements which have to be compared. The function compare()\
    \ should return the value -1, if the element indicated by p1 is \"smaller\" than\
    \ the element indicated by p2. In the opposite case, +1 should be returned, and\
    \ 0 if the two elements are equal. What \"smaller\" means is determined by the\
    \ function; hence, if you want to sort in descending order, you can return -1\
    \ if actually the second element is smaller. Note that the pointers are pointers\
    \ to void; thus, the compare() function usually has to perform an explicit type\
    \ conversion using a cast (see Sec. 1.1.2) to access the content of the array\
    \ elements. Also, the function compare() is not allowed to modify the content\
    \ of the array, indicated by the const qualifier (see Sec. 1.2).\n\nAs example,\
    \ sorting an array of numbers of type double in ascending order is considered.\
    \ In this case, the function to compare two numbers may look like\n\n| GET SOURCE\
    \ CODE |\n| DIR: libraries |\n| FILE(S): sorting.c |\n\n```\n```c\nint compare(const\
    \ void *p1, const void *p2)\n{\n    if (*(double *)p1 < *(double *)p2)\n     \
    \   return (-1);\n    else if (*(double *)p1 == *(double *)p2 )\n        return\
    \ (0);\n    else\n        return(1);\n}\n```\n```\n\nHere, the casts to access\
    \ the two elements indicated by p1 and p2 are directly included in the comparison\
    \ expression. For more complex compare() functions, it is usually more convenient\
    \ (and readable) to create two variables of the corresponding type and assign\
    \ the content of the two pointers"
