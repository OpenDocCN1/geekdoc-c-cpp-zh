  md: 'possible. To make F_Δ a "good" approximation of F_X, one has to adjust the
    parameters such that the distribution function represents the sample {x_i} "best",
    resulting in a vector Â of parameters. Methods and tools to perform this fitting
    of parameters are presented in Sec. 8.6.2. Using F_Δ one can proceed as above:
    Either one calculates F_H exactly based on F_Δ, which is most of the time too
    cumbersome. Instead, usually one performs simulations where one takes repeatedly
    samples {x̃0, x̃1, ..., x̃n-1} from simulating F_Δ and calculates each time the
    estimator ĥ = h(x̃0, x̃1, ..., x̃n-1). This results, as in the case of the empirical
    bootstrap discussed above, in a sample distribution function F_Hr, which is further
    analyzed. This approach, where F_Δ is used instead of F_X, is called parametric
    bootstrap.


    Note that the bootstrap approach does require that the sample points are statistically
    independent of each other. For instance, the data could be generated using a Markov
    chain Monte Carlo simulation [Newman and Barkema (1999); Landau and Binder (2000);
    Robert and Casella (2004); Liu (2008)], where each data point x_{i+1} is calculated
    using some random process, but also depends on the previous data point x_i. More
    details on how to quantify correlations are given in Sec. 8.5. For example, a
    confidence interval will depend on the fraction of "independent" data points.
    One can see this easily by assuming that you replace each data point in the original
    sample {x_i} by 10 copies, hence making the sample 10 times larger without adding
    any information. This will affect the following bootstrap calculations, since
    the fluctuations of the bootstrap sample will be reduced. Assume, e.g., your original
    sample has only two independent sample points x1 ≠ x2. Thus, bootstrap samples
    may exhibit two times x1 or two times x2, or each one once. Thus, the bootstrap
    average will fluctuate strongly. On the other hand, if you had 10 times data point
    x1 and 10 times x2 in the sample, the bootstrap sample will contain most of the
    times about 10 times the point x1 and about 10 times x2, only very rarely you
    will see only (i.e., 20 times) the value x2. Thus, the bootstrap mean will fluctuate
    less. With this respect, bootstrapping is similar to the classical calculation
    of confidence intervals explained in Sec. 8.3.2, where also independence of data
    is assumed and the number of independent data points enters formulas like Eq.
    (8.62). Hence, to correct for this, one can increase the obtained bootstrap error
    bars by a factor √λ_c where λ_c is the typical number of sequentially correlated
    sample points.


    It should be mentioned that bootstrapping is only one of several resampling techniques.
    Another well known approach is the jackknife approach, where one does not sample
    randomly using F_X or a fitted F_Δ. Instead the'
