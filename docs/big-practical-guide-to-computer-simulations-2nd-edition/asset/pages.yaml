- pgno: 10
  md: '# # Preface to the 1st edition


    You have decided to become an expert in computer simulations, congratulations!
    This is a good decision, because computational and simulation methods become more
    and more important in all areas of science, humanities, economy, engineering and
    mathematics. This book will help you a great deal in learning the most important
    basics which you need during all phases of a simulation research project, from
    the phases of program design, implementation, and debugging, through running the
    simulations, organizing the data and analyzing the results, to the final phase
    where you want to present and publish your results.


    Note that nowadays thousands of different problems exist which are being investigated
    by computer simulations. One studies, for example, the diffusion of chemicals
    in soils, the folding of proteins in cells, the communication of neurons in the
    brain, the deformation of cars in accidents, the behavior of brokers working at
    the stock market, the evolution of the weather during the next days or weeks,
    the turbulent behavior of flowing water in a turbine, the movement of electrons
    in semiconductors, the patterns of words in languages, or the traffic of pedestrians
    in crowded shopping malls, to name only a few. Consequently, there are many algorithms
    to treat the variety of problems, for example, finite differences, finite elements,
    integration methods, matrix inversion, eigenvalue determination, equation solvers,
    molecular dynamics simulations, Monte Carlo methods, density functional approaches,
    graph algorithms, optimization methods, and so on. Which methods are suitable
    for your problems depends heavily on the problems you want to solve. Since there
    are way too many algorithms available for all these different problems, and because
    everybody needs usually a different'
