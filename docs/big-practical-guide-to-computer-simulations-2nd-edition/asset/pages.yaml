    # 7.4 Creating your own libraries


    Although many useful libraries are available, sometimes you have to write some
    code by yourself. Over the years you will collect many functions and data structures,
    which – if properly designed – can be included in other programs, in which case
    it is convenient to put these subroutines into a library. Then you do not have
    to include the object file every time you compile one of your programs. If your
    self-created library is put into a standard search path, you can access it like
    a system library, you even do not have to remember where the object file is stored.


    To create a library you must have an object file, for example tasks.o, and a header
    file such as tasks.h where all data types and function prototypes are defined.
    Furthermore, to facilitate the use of the library, you should write a man page,
    which is not necessary for technical reasons but results in a more convenient
    usage of your library, particularly if other people want to benefit from it. To
    learn how to write a man page you should consult man man and have a look at the
    source code of some man pages, they are stored, for example, in /usr/man.


    A library is created with the UNIX command ar. To include tasks.o in your library
    libmy.a, you have to enter


    ```

    ar r libmy.a tasks.o

    ```'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'In a library several object files may be collected. The option “r” replaces
    the given object files, if they already belong to the library, otherwise they
    are added. If the library does not exist yet, it is created. For more options,
    please refer to the man page of ar.


    After including an object file, you have to update an internal object table of
    the library. This is done by


    ```

    ar a libmy.a

    ```


    Now you can compile a program prog.c using your library via


    ```

    cc -o prog prog.c libmy.a

    ```


    In case libmy.a contains several object files, it saves some typing by just writing
    libmy.a. Furthermore you do not have to remember the names of all your object
    files.


    To make the handling of the library more comfortable, you can create a directory,
    e.g. ~/lib and put your libraries there. Additionally, you should create the directory
    ~/include where all personal header files can be collected. Then your compile
    command may look like this:


    ```

    cc -o prog prog.c -I$HOME/include -L$HOME/lib -lmy

    ```


    The option -I states the search path for additional header files, the -L option
    tells the linker where your libraries are stored and via -lmy the library libmy.a
    is actually included. Please note that the prefix lib and the postfix .a are omitted
    with the -l option. Finally, it should be pointed out, that the compiler command
    given above works for all working directories, once you have set up the library
    structure as explained. Consequently, you do not have to remember directories
    or names of object files.'
  merge: -1
  img_proc: true
