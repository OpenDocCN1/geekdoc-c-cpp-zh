    # (5) Variance of data sample


    Design, implement and test a function, which calculates the variance s² of a sample
    of data points. Use directly Eq. (8.55), i.e. do not use an equivalent form of
    Eq. (8.21), since this form is more susceptible to rounding errors. The function
    prototype reads as follows:


    SOLUTION SOURCE CODE

    DIR: randomness

    FILE(S): variance.c


    ```

    /*****************************************************/

    /** Calculates the variance of n data points **/

    /** PARAMETERS: (*) = return-parameter **/

    /** n: number of data points **/

    /** x: array with data **/

    /** RETURNS: **/

    /** variance **/

    /*****************************************************/

    double variance(int n, double *x)

    ```


    Remark: The so-called corrected double-pass algorithm [Chan et al. (1983)] aims
    at further reducing the rounding error. It is based on the equation

    $s^2 = \frac{1}{n}\left[ \sum_{i=0}^{n-1}(x_i - \bar{x})^2 - \frac{1}{n}\left(\sum_{i=0}^{n-1}(x_i
    - \bar{x})\right)^2 \right]$.

    The second square would be zero for exact arithmetic and accounts for rounding
    errors occurring in the calculation. It becomes important in particular if the
    expectation value is large. Perform experiments for generating Gaussian distributed
    number with σ² = 1 and μ = 10¹⁴, without and with the correction.'
