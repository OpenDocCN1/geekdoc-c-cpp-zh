    \[ \bar{C}(\tau) = \frac{1}{n-\tau}\sum_{i=0}^{n-1-\tau} x_i x_{i+\tau} - \left(\frac{1}{n-\tau}\sum_{i=0}^{n-1-\tau}
    x_i\right) \times \left(\frac{1}{n-\tau}\sum_{i=0}^{n-1-\tau} x_{i+\tau}\right)
    \tag{8.82} \]


    The term \(\frac{1}{n-\tau}\sum_{i=0}^{n-1-\tau} x_i \times \frac{1}{n-\tau}\sum_{i=0}^{n-1-\tau}
    x_{i+\tau}\) will converge to \(\overline{x}^2\) for \(n\to\infty\) if it can
    be assumed that the distribution of the sample points is stationary, i.e. does
    not depend on the sample time. Therefore, \(\bar{C}(\tau)\) is approximately \(\frac{1}{n-\tau}\sum_{i=0}^{n-1-\tau}(x_i-\bar{x})(x_{i+\tau}-\bar{x})\),
    comparable to the nominator of the linear correlation coefficient Eq. (8.81).
    Usually one normalizes the correlation function by \(\bar{C}(0)\), which is just
    the sample variance in the stationary case, see Eq. (8.55):


    \[ C(\tau) = \bar{C}(\tau)/C(0)\,. \tag{8.83} \]


