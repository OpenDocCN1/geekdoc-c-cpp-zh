  md: 'undertake is to sit down and think for a while. This will save you a lot of
    time and effort later on. For medium- to large-scale projects, planning and structuring
    is indispensable. There are many specialized books in the field of software engineering,
    see for example Refs. [Sommerville (1989); Ghezzi et al. (1991)]. Here, just the
    main steps are listed of how to create a sophisticated software development cycle.
    The following descriptions refer to the usual situation you find in computational
    science: One or a few people are involved in the project. How to manage the development
    of big programs involving many developers is explained in the above-mentioned
    expert literature.


    # 3.1.1 Definition of the problem and solution strategies


    Write down the problem you want to solve. Drawing diagrams is always helpful!
    Discuss your problem with others and tell them how you would like to solve it.
    In this context many questions may appear of which some examples are given here:


    +   - What is the input you have to supply? In case you have only a few parameters,
    they can be passed to the program via command-line arguments or options. In other
    cases, especially when chemical systems are to be simulated, many parameters have
    to be controlled and it may be a good idea to use extra parameter files.

    +   - Which results do you want to obtain and which quantities do you have to
    analyze? Very often it is useful to write the raw results of your simulations,
    such as the positions of all atoms or the orientations of all spins of your system,
    to a configuration file. All measurable quantities can be obtained by post-processing.
    Then, in case new questions arise, it is very easy to analyze the data again.
    When using configuration files, you should estimate the amount of data you generate.
    Is there enough space on your disk? It may be helpful, to include the compression
    of the data files directly in your programs (see page 57).

    +   - Can you identify "objects" in your problem? Objects may be physical entities
    like atoms or molecules, but also internal structures like nodes in a tree or
    elements of tables. Considering the system and the program as a hierarchical collection
    of objects usually makes the problem easier to understand. More details on object-oriented
    development can be found in Chap. 5.'
  merge: -1
  img_proc: true
- pgno: 112
  md: '+   - Maybe the program will be extended later on? Usually a code is “never”
    finished. You should foresee later extensions of the program and set up everything
    in a way to be reused easily.

    +   - Do you have existing programs available which can be included into the software
    project? If you have implemented your previous projects in the above-mentioned
    fashion, it is very likely that you can recycle some code. But this requires experience
    and is not very easy to achieve at the beginning. Over the years, however you
    will have a growing library of programs which enables you to finish future software
    projects much faster. Has somebody else created a program which you can reuse?
    Sometimes you can rely on external code like libraries. Examples are the *Standard
    Template Library* and the *GNU Scientific library* which are covered in Chap.
    7.

    +   - Which algorithms are known to solve your problem? Are you sure that you
    can solve the problem at all? Many other techniques have been invented already.
    You should always search the literature for existing solutions. How searches can
    be simplified by using electronic data bases, is covered more deeply in Chap.
    9. Sometimes it is necessary to invent new methods. This part of a project may
    be the most time-consuming but also the most interesting task.


    # 3.1.2 Designing data structures


    Once you have identified the basic objects in your systems, you have to think
    about how to represent them in the code. Sometimes it is sufficient to define
    some *struct* types in C (or simple *classes* in C++). But usually you will have
    to design a large set of data structures, referencing each other in a complicated
    way.


    A sophisticated design of the data structures will lead to better organized programs;
    usually they will even run faster. For example, consider a set of vertices of
    a graph. Then assume that you have several lists $L_i$ each containing elements
    referencing the vertices of degree $i$. Maybe the graph is altered in your program
    and thus the degrees of the vertices change. Then it is sometimes necessary to
    remove a vertex from one list and insert it into another one. In this case you
    will gain speed, when your vertex data structures also contain pointers to the
    positions where they are stored in the lists. Hence, removing and inserting vertices
    in the lists will take only a constant amount of time. Without these additional
    pointers, the insert'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'and delete operations have to scan partially through the lists to locate the
    elements. This leads to a linear time complexity of these operations.


    Again, you should perform the design of the data structures in a way, such that
    later extensions are done more easily. For example, when treating lattices of
    atoms, you should use data structures which are independent of the dimensionality
    of the system or even of the structure of the lattice; an example is given in
    Sec. 1.6.


    When you are using external libraries, they usually have some data types included.
    The above-mentioned Standard Template Library has many predefined data types like
    arrays, stacks, lists or heaps. Furthermore, it is possible to combine the data
    types in complicated ways. For instance, you can define a stack of graphs having
    strings attached to the vertices.


    # 3.1.3 Defining small tasks


    After setting up the basic data types, you should think about which basic and
    complex operations, i.e. which functions in C/C++, you need to manipulate the
    objects of your simulation. Since you have already thought a lot about your problem,
    you have a good overview of which operations may occur. You should break down
    the ultimate task “perform simulation” into small subtasks. This means, you use
    a top-down approach in the design process. When implementing the design, it is
    usually not possible to write a program in a sequential way as one code. For the
    actual implementation, instead a bottom-up approach is recommended. This means,
    you should start with the most basic operations. Later on, you can use them to
    create more complicated operations. As always, you should define the subroutines
    in a way such that they can be applied in a flexible way and such that extensions
    are easy to perform.


    But it is not necessary to identify all basic operations at the beginning. During
    the development of the code, new applications may arise, which lead to the need
    for further operations. Also, it may be required to change or extend the data
    structures. However, the more you think in advance, the less you need to change
    the program later on.


    As an example, the problem of finding ground states is considered, i.e. configurations
    with the lowest energies. A model for magnetic alloys consisting of little magnetic
    moments called spins is used. The method is called simulated annealing, which
    is a special Monte Carlo technique. Some of the basic operations are:'
