  md: '![](img/0dfb82b7d27bdfebb8b65cb33de3626a_14_0.png)


    Alexander Karl Hartmann is Professor of Computational Physics of the Department
    of Science at the University of Oldenburg (Germany). He obtained a M.S. in Computer
    Science at the University of Hagen and a M.S. in Physics at the University of
    Duisburg. After receiving his Ph.D. in Theoretical Physics at the University of
    Heidelberg, he worked at the University of Göttingen, the University of California
    in Santa Cruz and the Ecole Normale Supérieure in Paris. In 2007, he moved to
    Oldenburg. His research interests comprise computer simulations, disordered systems,
    combinatorial optimization, large deviations and Bioinformatics. Professor Hartmann
    is author or co-author of 8 books and more than 120 scientific publications.'
