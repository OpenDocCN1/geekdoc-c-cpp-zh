    # ### 6.7.1 Heaps


    Sorted binary trees are useful if one wants to have ordered access to a set of
    elements, e.g. for fast access to all elements. Nevertheless, sometimes it is
    sufficient to have access only to the currently smallest (or largest) element.
    One example where this is the case is an *event-driven simulation*. Consider,
    for instance, a box filled with hard spheres like billiard balls. These spheres
    move with constant velocity unless they collide with each other, where they change
    direction and magnitude of velocities. A standard approach would be to actually
    simulate the trajectories of spheres by moving the spheres in little steps, i.e.
    by performing a *Molecular dynamics simulation* [Allen and Tildesley (1989); Haile
    (1992); Rapaport (1995)]. This is very time-consuming and indeed not necessary
    since the constant-velocity movement between the collisions is trivial and can
    be calculated exactly. Hence, one needs only to consider the *events*, given by
    pairs of spheres $(i,j)$ which collide and the corresponding times $t_{i,j}$ where
    this happens. An event-driven simulation in this case consists of treating all
    collision events one after the other in the order of increasing times $t_{i,j}$.
    This order is important, because after a collision $(i,j)$ the participating spheres
    $i$ and $j$ move in new directions. Hence, new collisions will usually be obtained,
    say $i$ will collide with particle $k$ at $t_{ik} > t_{ij}$, see Fig. 6.18. Now,
    it might be that previously a collision of sphere $k$ with another sphere $l$
    had been calculated with $t_{lk} > t_{ik}$, hence now the collision $(l,k)$ might
    actually not take place since $(i,k)$ will happen earlier.


    Thus, at each stage of the event-driven simulation one has to determine the event
    with the smallest even time. For the simplest approach, one would run through
    the list of all $N$ events and pick the smallest one, but this requires $O(N)$
    steps each time. One better uses a binary search'
