  md: '![](img/0dfb82b7d27bdfebb8b65cb33de3626a_283_0.png)


    Fig. 8.7 A discrete distribution with four outcomes with probabilities p₁ = 1/8,
    p₂ = 1/4, p₃ = 1/2 and p₄ = 1/8. The probabilities are represented in the interval
    [0, 1] by sub intervals which have lengths equal to the probabilities, respectively.
    This allows to draw random numbers according the distribution.


    probability distribution of a discrete variable, in particular for a Poisson distribution.


    Although just a logarithmic growth with the number N of possible outcomes is already
    pretty efficient, there even exist an approach [Walker (1977)] where the time
    to draw a random number is constant, independent of N. This is explained next,
    following the implementation [Fukui and Todo (2009)];


    We will consider as an example N = 5 possible outcomes with p₁ = 0.1, p₂ = 0.25,
    p₃ = 0.45, p₄ = 0.1, p₅ = 0.1. The basic idea is to distribute the different outcomes
    to N “packages”. Each package represents a weight p_avg = 1/N. The main point
    is that each package contains only up to two outcomes. Outcomes with small probabilities
    p_i ≤ p_avg will be represented in just one package, while outcomes with higher
    probabilities will be contained in more than one package. For each package i one
    stores which outcomes a_i (and maybe also b_i) are represented and what fraction
