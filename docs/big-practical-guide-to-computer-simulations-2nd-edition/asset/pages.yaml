- pgno: 414
  md: 'Any filter program must have some algorithm included, which places the nodes
    in the image. The program could, for example, try to minimize the number of crossing
    edges. The filter dot used above works very well in particular for graphs which
    can be drawn as hierarchies, such as trees. Other filters currently available
    are


    +   - **fdp and neato**

    +     Different “spring models” are used to generate pretty images. The springs
    virtually connect nodes and edges to keep them apart. The filters relax the system
    of springs such that the overall stress is minimized.

    +   - **twopi**

    +     All nodes are arranged using a radial layout. One node is placed in the
    center of the image, all other nodes on sequences of concentric circles around
    the center.

    +   - **circo**

    +     The filter generates a circular layout where nodes belonging to the same
    biconnected component¹ are drawn on the same circle.


    There are also filter-depended attributes, which control the algorithm calculating
    the graph layout. For example, for fdb and neato, nodes where the position is
    given in the attribute list including a final ''!'', like in pos="3,21", or where
    pin=true is set, will be kept in the initial positions during the layout process.
    Also, the filters are able to generate output formats other than postscript, like
    xfig files (option -Tfig), bitmap graphics (-Tpng and -Tgif), structured vector
    graphics (-Tsvg and -Tsvgz), and some more. If no output format is given, the
    output is again in dot format, but with positions of nodes and edges added.


    To plot a directed graph, one uses the keyword digraph instead of graph and the
    edge operator -> instead of the edge operator --. Furthermore, one can define
    and use subgraphs within a dot file; for details again see the documentation [GraphViz].


    Finally, we show an example of how you can write your own graph drawing functions
    using the GraphViz package. The function is based on the data structures for graphs
    as presented in Sec. 6.8. The function gs_dot_graph() receives as arguments the
    graph, a file stream and a variable which tells whether the graph is directed.
    The function outputs the graph in dot format to the file. The C source looks as
    follows:


    ¹ A biconnected component is a maximal set of nodes, where two independent paths
    within the biconnected component exist between each pair of nodes of the set.'
