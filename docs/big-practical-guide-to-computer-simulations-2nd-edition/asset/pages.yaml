    For the actual test, one calculates the p-value for the given sample using ks().
    If the p-value exceeds the indented significance level α, the null hypothesis
    is accepted, i.e. the data is compatible with the distribution with high probability.
    Usually quite small significances are used, e.g. α = 0.05. This means that even
