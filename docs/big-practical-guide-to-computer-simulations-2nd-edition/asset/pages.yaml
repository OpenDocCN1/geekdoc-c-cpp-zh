  md: 'based analysis of graphs. As pointed out in Sec. 6.8.1, graphs may exhibit
    several *connected components*, such that nodes belonging to the same component
    are connected by paths, while for nodes belonging to different components, there
    exist no path between them. For example, for a graph describing a communication
    network, nodes belonging to the same component can communicate among each other,
    while nodes belonging to different components cannot.


    Next, a simple algorithm is discussed which determines the connected components
    of a graph. This discussion be performed in three steps: First the basic idea
    is explained. Next the C code is given. Finally, the operation of the algorithm
    for a small sample graph is discussed. The basic idea is to start with any (“seed”)
    node. It is considered as first node of the first component. Subsequently, all
    neighbors of the “seed” node, i.e. all nodes connected by an edge to it, are attributed
    to the same component. In the same way, the neighbors of these neighbors belong
    to the same component, and so on. However, note that for a correct determination
    of the components, each node does not need to be processed more than once. For
    example, the “seed” node is processed first and there is no need to process it
    again when the neighbours of any of its neighbours are considered. To accomplish
    this, for each node an entry in the array *comp* is kept, which indicates whether
    the node has not been encountered so far during the determination of the components
    (then *comp*[node] = −1). Conveniently, this variable will also store an ID, identifying
    the component to which the node belongs. Initially this variable will be set to
    −1 for all nodes, indicating that each node has not been considered so far. Since
    for each node one has to consider all neighbors once, the neighbors will be stored
    in a “bag” once they are encountered, actually implemented as an array *candidate*.
    During the component construction, the algorithm takes one node after the other
    from the bag to check their neighbors. In this way, each node connected to the
    seed node by a path will be considered and added to the component at some point.
    Note that the order in which the nodes in the bag are considered does not matter
    here. If the order is *last-in first-out* (LIFO), as for a stack, then, after
    the first neighbor of the seed has been considered, in turn its first neighbor
    will be considered, etc., before the second neighbor of the seed node will be
    considered. Thus, the algorithm will tend to go as far as possible directly. This
    is called *depth-first search*. If on the other hand the bag is treated in *first-in
    first-out* (FIFO) fashion, then all neighbors of the seed are taken from the bag
    before the neighbors of'
