    # 8.4.1 gnuplot


    The program gnuplot is invoked by entering gnuplot in a shell, or from a menu
    of the graphical user interface of your operating system. For a complete manual
    see [Texinfo].


    As always, our examples refer to a UNIX window system like X11, but the program
    is available for almost all operating systems. After startup, in the window of
    your shell or the window which pops up for gnuplot the prompt (e.g. gnuplot>)
    appears and the user can enter commands in textual form, results are shown in
    additional windows or are written into files. For a general introduction you can
    type just help.


    Before giving an example, it should be pointed out that gnuplot scripts can be
    generated by simply writing the commands into a file, e.g. command.gp, and calling
    gnuplot command.gp.


    The typical case is that you have available a data file of x - y data or with
    x - y - dy data (where dy is the error bar of the y data points). Your file might
    look like this, where the energy e0 of a system10 is stored as a function of the
    system size L. The filename is sg.e0L.dat. The first column contains the L values,
    the second the energy values and the third the standard error of the energy. Please
    note that lines starting with # are comment lines which are ignored on reading:


    GET SOURCE CODE

    DIR: randomness

    FILE(S): sg.e0L.dat


    ```

    # ground state energy of +-J spin glasses

    # L e0 error

    3 -1.6710 0.0037

    4 -1.7341 0.0019

    5 -1.7603 0.0008

    ```


    10 It is the ground-state energy of a three-dimensional +-J spin glass, a pretypical
    system in statistical physics. These spin glasses model the magnetic behavior
    of alloys like iron-gold.'
