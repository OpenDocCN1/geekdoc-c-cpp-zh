  md: 'An alternative is to write the program directly in a way it can cope with almost
    arbitrary lattice types. This can be achieved by setting up the neighbor relation
    in one special initialization subroutine (not discussed here) and storing it in
    an array `next[]`. Then, the code outside the subroutine remains the same for
    all lattice types and dimensions. Since the code should work for all possible
    lattice dimensions, the array `next` is one-dimensional. It is assumed that each
    site has `num_n` neighbors. Then the neighbors of site `i` can be stored in `next[i*num_n]`,
    `next[i*num_n+1]`, ..., `next[i*num_n+num_n−1]`. Please note that the sites are
    numbered beginning with 1. This means, a system with `N` spins needs an array
    `next` of size `(N+1)*num_n`. When using free boundary conditions, missing neighbors
    can be set to 0. The access to the array can be made easier using a macro NEXT:


    ```

    #define NEXT(i,r)  next[(i)*num_n + r]

    ```


    `NEXT(i,r)` contains the neighbor of spin `i` in direction `r`. For example, a
    quadratic system, `r=0` is the +x-direction, `r=1` the −x-direction, `r=2` the
    +y-direction and `r=3` the −y-direction. However, which convention you use depends
    on you, but you should make sure that they are consistent. For the case of a quadratic
    lattice, it is `num_n=4`. Please note that whenever the macro NEXT is used, there
    must be a variable `num_n` defined, which stores the number of neighbors. You
    could include `num_n` as a third parameter of the macro, but in this case a call
    of the macro looks slightly more confusing. Nevertheless, the way you define such
    a macro depends on your personal preferences.


