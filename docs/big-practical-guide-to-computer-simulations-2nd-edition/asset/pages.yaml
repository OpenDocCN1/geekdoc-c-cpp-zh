    each data point to its closest cluster:


    c(i) = argmin_{c=0,...,k-1} { ( ξ^(c) - x^(i) )² } . (8.90)


    Thus, a very simple algorithm can be obtained by starting with a random assignments
    of the data points to clusters and then iterating Eqs. (8.89) and (8.90) until
    convergence, e.g. until the relative change of the center vectors is less than
    a small given threshold ε. Note that this approach does not guarantee a convergence
    to a solution where the spread χ² assumes its global minimum. See below for an
    example.'
