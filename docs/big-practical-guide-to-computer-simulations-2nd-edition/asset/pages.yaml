    \ |\n| %e, %E | scientific (\"exponential\") notation |\n| %s | strings |\n| %p\
    \ | pointers (addresses). |\n\nNote that one writes \"%X\" for printing a \"%\"\
    . A complete list of conversion specifications can be found in the manual documentation\
    \ of printf(), e.g. by typing man 3 printf under a UNIX system, where the number\
    \ 3 refers to the section (\"Programmer's manual\") since in Sec. 2 (\"User commands\"\
    ) there is another printf shell command. Some of these conversion specifications\
    \ appear in the following primitive example (note that the format string can be\
    \ split into several pieces, like here):\n\n| GET SOURCE CODE |\n|---|\n| DIR:\
    \ c-programming |\n| FILE(S): printing.c |\n\n```\nint counter = 777;\ndouble\
    \ energy1 = 35678.99;\nvoid *pointer = &energy1;\nchar name[100] = {\"network\"\
    };\n```\n\n```\nprintf(\"After %d (hex:%X) iterations an energy of %f \\n\"\n\"\
    %e, stored at %p) was obtained for %s\\n\",\n        counter, counter, energy1,\
    \ energy1, pointer, name);\n```\n\nWhen executing these lines of code, the following\
    \ output will appear on the screen:\n\n```\nAfter 777 (hex:309) iterations an\
    \ energy of 35678.990000\n(3.567899e+04, stored at 0xbfae... ) was obtained for\
    \ network\n```\n\nAlthough printf() can handle an arbitrary number of arguments,\
    \ the number of arguments given must always match the number of conversion specifications\
    \ in the format string. Otherwise the compiler will complain.\n\nWhen printing\
    \ just using the raw conversion specifications, e.g. the format of a floating-point\
    \ number will always be the same. The predefined format can be modified by optional\
    \ specifications. Details can be found again in the documentations (man pages).\
    \ Here, we give only the most important examples. First, right after the '%',\
    \ there can be a flag. Important flags are 0, to fill numbers with leading zeros,\
