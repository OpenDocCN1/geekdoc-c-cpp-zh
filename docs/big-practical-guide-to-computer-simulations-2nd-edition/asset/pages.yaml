  md: 'quantities. Each realization of the disorder consists of randomly chosen positions
    of the magnetic and non-magnetic particles. To generate a disorder realization
    within the simulations, random numbers are required.


    But even when the simulated system is not inherently random, very often random
    numbers are required by the algorithms, e.g. to realize a finite-temperature ensemble
    or when using randomized algorithms. In summary, the application of random numbers
    in computer simulations is ubiquitous.


    In this section an introduction to the generation of random numbers is given.
    First it is explained how they can be generated at all on a computer. Then, different
    methods are presented for obtaining numbers which obey a target distribution:
    the *inversion method*, the *rejection method* and *Box-Müller method*. More comprehensive
    information about these and similar techniques can be found in Refs. [Morgan (1984);
    Devroye (1986); Press et al. (1995)]. In this section it is assumed that you are
    familiar with the basic concepts of probability theory and statistics, as presented
    in Sec. 8.1.


    # ### 8.2.1 *Uniform (pseudo) random numbers*


    First, it should be pointed out that standard computers are deterministic machines.
    Thus, it is completely impossible to generate true random numbers directly. One
    could, for example, include interaction with the user. It is, for example, possible
    to measure the time interval between successive keystrokes, which is randomly
    distributed by nature. But the resulting time intervals depend heavily on the
    current user which means the statistical properties cannot be controlled. On the
    other hand, there are external devices, which have a true random physical process
    built in and which can be attached to a computer [Quantis; Westphal] or used via
    the internet [Hotbits]. Nevertheless, since these numbers are really random, they
    do not allow to perform stochastic simulations in a controlled and reproducible
    way. This is important in a scientific context, because spectacular or unexpected
    results are often tried to be reproduced by other research groups. Also, some
    program bugs turn up only for certain random numbers. Hence, for debugging purposes
    it is important to be able to run exactly the same simulation again. Furthermore,
    for the true random numbers, either the speed of random number generation is limited
    if the true random numbers are cheap, or otherwise the generators are expensive.


    This is the reason why *pseudo random numbers* are usually taken. They are generated
    by deterministic rules. As basis serves a number generator'
