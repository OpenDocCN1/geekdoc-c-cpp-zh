  md: "everywhere!⁷ This makes it very convenient and is even necessary for the definitions\
    \ of self-defined data types, which cannot be passed as arguments to functions.\
    \ This may also appear convenient for variables, e.g. for a large-scale simulation\
    \ consisting of many particles. Here, one could store their data in global variables,\
    \ hence one does not have to pass these variables to all functions where they\
    \ are used. Nevertheless, as discussed in Sec. 3.2, the use of global variables\
    \ is very error-prone and are also very inflexible. *Do not use global variables,\
    \ whenever you can avoid it !!*⁸ For example, consider a function which calculates\
    \ the average velocity among a set of moving particles. If you use global variables,\
    \ you have to write a function for the velocity calculation explicitly stating\
    \ the name of the array variable which is used to store the data, such as `particle[]`.\
    \ Hence, if in your program you simulate also a second independent set of particles,\
    \ say stored in `particleB[]`, you have to provide another function for the velocity\
    \ calculation of `particleB[]`. This is inefficient, so it is better to have one\
    \ single function, where the actual particles to be treated are passed as arguments.\
    \ Extrapolating these considerations leads to the conclusion that all data should\
    \ be passed via arguments to functions. Consequently, global variables are not\
    \ necessary, even dangerous, and should be avoided.\n\nNote that if you define\
    \ a function `sub()` inside another function `func()`, all other variables and\
    \ other objects defined in `func()` will be accessible from `sub()`, and hence\
    \ are global relative to `sub()`. Furthermore, a local definition overrides any\
    \ definitions which are global at the given point, as in the following example:\n\
    \n| GET SOURCE CODE |\n| --- |\n| DIR: c-programming |\n| FILE(S): hide.c |\n\n\
    ```\n    int number1, number2;    /* these are global variables */\n\n    void\
    \ do_something()\n    {\n      int number1;          /* overides global definition\
    \ */\n\n      number1 = 33;\n      printf(\"subr: n1=%d, n2=%d\\n\", number1,\
    \ number2);\n      number2 = 44;\n      printf(\"subr: n1=%d, n2=%d\\n\", number1,\
    \ number2);\n    }\n```\n\n⁷An exception, a global variable which is declared\
    \ static is only accessible inside the same source file. This may be useful when\
    \ you want to use a name for a global variable, which is already or may be used\
    \ as global variable elsewhere.\n\n⁸This is basically always possible, except\
    \ for some debugging purposes."
