    (8.94)


    This turns the product of single-data-points pmfs or pdfs into a sum, where the
    derivatives are easier to obtain. Furthermore, since the logarithm is a monotonous
    function, the maximum of the likelihood function is the same as the maximum of
    the log-likelihood function. Hence, the parameters which suit "best" are determined
    within the maximum-likelihood approach by the set of equations


    $$\frac{\partial l(\theta)}{\partial \theta_k} \stackrel{!}{=} 0 \quad (k = 1,\dots,n_p)$$
    (8.95)


    Note that the fact that the first derivatives are zero only assures that an extremal
    point is obtained. Furthermore, these equations often have several solutions.
    Therefore, one has to check explicitly which solutions are indeed maxima, and
    which is the largest one. Note that maximum-likelihood estimators, since they
    are functions of the samples, are also random variables $\mathrm{ML}_{\theta,n}(X_0,\dots,X_{n-1})$.


    As a toy example, we consider the exponential distribution with the pdf given
    by Eq. (8.39). It has one parameter $\mu$. The log-likelihood function for a sample
    $\{x_0,x_1,\dots,x_{n-1}\}$ is in this case


    $$l(\mu) = \log \prod_{i=0}^{n-1} f_\mu(x_i)$$

    $$= \sum_{i=0}^{n-1} \log \left\{\frac{1}{\mu} \exp\left(-\frac{x_i}{\mu}\right)\right\}$$

    $$= \sum_{i=0}^{n-1} \left(\log\left\{\frac{1}{\mu}\right\} - \frac{x_i}{\mu}\right)$$

    $$= n \log\left\{\frac{1}{\mu}\right\} - \frac{n \bar{x}}{\mu}$$


    Taking the derivative with respect to $\mu$ we obtain:

