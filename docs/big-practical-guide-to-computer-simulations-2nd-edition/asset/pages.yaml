    \ used for your private and local header files. This means, the compiler will\
    \ first look in the current directory for the header files. Only if they are not\
    \ found there, it will look in the standard directories. More information on what\
    \ you have to take into account when writing your own header files is given below.\n\
    \nThe second important type of compiler directive is the definition of a macro.\
    \ Macros are shortcuts for code sequences in programming languages. Their primary\
    \ purpose is to allow computer programs to be written more quickly. But the main\
    \ benefit comes from the fact that a more flexible software development becomes\
    \ possible. By using macros appropriately, programs become better structured,\
    \ more generally applicable, and less error-prone. Here, it is explained how macros\
    \ are defined and used in C; a detailed introduction can be found in C textbooks\
    \ such as Ref. [Kernighan and Ritchie (1988)]. Other high-level programming languages\
    \ exhibit similar features.\n\nIn C a macro is constructed via the `#define` directive.\
    \ Macros are processed in the preprocessing stage of the compiler. This directive\
    \ has the form\n\n```\n```c\n#define <name> <definition>\n```\n```\n\nEach definition\
    \ must be on one line, without other definitions or directives. If the definition\
    \ exceeds one line, each line except the last one has to be ended with the backslash\
    \ `\\` symbol. The simplest form of a macro is a constant, e.g.\n\n```\n```c\n\
    #define PI 3.1415926536\n```\n```\n\nYou can use the same sort of names for macros\
    \ as for variables. It is convention to use only upper-case letters for macros.\
    \ A macro can be"
