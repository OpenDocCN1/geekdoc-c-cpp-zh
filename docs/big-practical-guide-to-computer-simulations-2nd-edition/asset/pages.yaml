  md: 'useful way is an active area of research called *Computational Provenance*
    [Comp. Sci. Eng. (2008)]. A possible parameter file, e.g. for the Molecular Dynamics
    simulation¹³ of a system of gas particles, could look like this


    ```

    num_particles = 512

    temperature = 37.3

    number_steps = 10000

    step_size (fs) = 1.2

    box_size = 10

    appendix = A67

    save_config = no

    ```


    In real applications one could have many more simulation parameters, which for
    example describe different particle types and the coefficients for different force
    fields. Such a parameter file can be read in, as mentioned above, most conveniently
    using the `strstr()` function; we do not go into details here. Nevertheless, for
    many applications it is sufficient to pass simulation parameters as arguments
    when invoking the program, e.g. like


    ```

    arguments 512 37.3

    ```


    where it is assumed that `arguments` is the name of the program, the first parameter
    (here 512) determines, say, the number of particles, and the second (37.3) determines
    the temperature of the system. Different arguments always have to be separated
    by spaces. For other parameters of `arguments`, the default values are taken,
    unless they are changed via options, as described below.


    To be able to read the program arguments, one has to define the `main()` function
    as follows:


    ```

    int main(int argc, char *argv[])

    ```


    During the execution of `main()`, `argc` will contain the number of arguments
    including the program name, i.e. three in the above example. The array `argv`
    of strings contains in `argv[0]` the program name, in `argv[1]` the first argument
    (here 512), in `argv[2]` the second argument (here 37.7) and so on. Note that
    the arguments are stored in strings; hence, if they are to be interpreted as numbers,
    they have to be converted, e.g. using `atoi()`, which converts a string into an
    integer, or using `sscanf()` as described above.


    ¹³ For a Molecular Dynamics simulation, you have formulas describing the forces
    between different particles (*force fields*). Using the forces you integrate the
    Newton''s equation of motions to study the dynamic evolution of such a system.
    Molecular Dynamics simulations are widespread, such as to study the dynamics of
    proteins in cells.'
