    larger than the time spent in calc_sum() (1.15s). The reason is that calculating
    the product of two numbers takes more CPU cycles than calculating the sum. The
    fifth column (self s/call) contains the average number of seconds per call to
    a function, i.e. the value of the third column divided by the value in the fourth
    column. The six column (total s/call) states the average time spent in a function
    including its descendants. For this reason, since all1() basically contains all
    calls to calc_sum() and calc_prod(), the value for all1() contains almost the
    full running time.


    The output of gprof contains, after the flat profile, a short explanation of the
    different columns, equivalent to what was just explained. This can be suppressed
    by using the options -b or --brief.


    Next, the output contains the call graph (by default, or when using -q or --no-graph).
    This part of the output lists for each function from which functions it was called
