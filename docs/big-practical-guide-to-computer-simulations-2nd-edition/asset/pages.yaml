- pgno: 81
  md: "Note that due to the way the dynamically allocated matrix mat is stored, the\
    \ actual access is different from a standard matrix smat, which is defined via\
    \ double smat[n_rows][n_cols]: A standard matrix is stored in one large chunk\
    \ of memory, where each row follows the next. On the other hand, the different\
    \ rows for the dynamically allocated matrix mat are usually stored in different\
    \ places. Therefore, a direct access could look like **(*(mat+i)+j)). This also\
    \ means that a dynamically allocated matrix requires slightly more memory, because\
    \ in addition to the actual matrix elements one needs an array with pointers storing\
    \ the addresses of the different rows. Nevertheless, dynamically allocated matrices\
    \ are more flexible, because the size can be changed during runtime. It is also\
    \ possible that different rows contain a different number of elements, which is\
    \ not possible for standard arrays either. This is useful, for example, when one\
    \ wants to store an array of strings with strings of different lengths.\n\nFinally,\
    \ all memory which has been reserved inside the program should be released, one\
    \ says freed again. For this purpose, the free() function can be used, which takes\
    \ as argument a pointer to a previously allocated chunk of memory, e.g. like in:\n\
    \n```\nfree(p);\n```\n\nFreeing the memory which has been allocated for a matrix\
    \ is performed in two steps: First, all rows are freed, then the array containing\
    \ the pointers to the rows is freed. For the matrix mat this could look like:\n\
    \n```\nfor(i=0; i<n_rows; i++)\n  free(mat[i]);\nfree(mat);\n```\n\nFreeing of\
    \ memory is particularly important, if the memory is used only inside of some\
    \ function and will not be accessed again after the execution of the function\
    \ has terminated. If it is not freed, and if the function is called several times,\
    \ then more and more memory is allocated during the execution of the program,\
    \ which may cause the operating system to run out of memory. Such a bug is called\
    \ a memory leak and should be avoided under all circumstances. A useful tool to\
    \ detect memory leaks and other bugs connected with dynamic memory management\
    \ is introduced in Sec. 4.3. These bugs are often hard to spot by hand.\n\nUsing\
    \ dynamic memory management, arbitrarily complex data structures can be generated.\
    \ More advanced examples like lists, trees, and graphs are discussed in Secs.\
    \ 6.6 to 6.8."
