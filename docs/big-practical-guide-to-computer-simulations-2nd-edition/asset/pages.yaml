    In case the program contains recursive calls, the output of gprof will look slightly
    different. Here, we consider an recursive version of the calculation of the sums,
    which is again artificially slow compared to dynamic programming approach. The
    function reads as follows:


    ```

    1 double calc_sum_rec(double *a, int i, int j)

    2 {

    3     if(i==j)

    4         return(a[i]);

    5     else

    6         return(a[i]+calc_sum_rec(a,i+1,j));

