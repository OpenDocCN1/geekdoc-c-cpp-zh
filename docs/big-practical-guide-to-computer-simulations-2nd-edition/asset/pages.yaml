  md: '“summation algorithm”, is C × n, i.e. O(n). Note that in this case the running
    time basically does not depend on the actual numbers which are summed up, i.e.
    the worst case running time equals the typical running time. Nevertheless, there
    are examples where the running time might depend drastically on the actual problem
    instance given.


    In Table 6.1, orders of running times, which occur typically in the context of
    algorithms, are presented, accompanied by the resulting values for problem sizes
    10, 100, and 1000.


    Table 6.1 Growth of functions as a function of input size n.


    | T(n) | T(10) | T(100) | T(1000) |

    |---|---|---|---|

    | n | 10 | 100 | 1000 |

    | n log n | 10 | 200 | 3000 |

    | n² | 10² | 10⁴ | 10⁶ |

    | n³ | 10³ | 10⁶ | 10⁹ |

    | n^{log n} | 10 | 10⁴ | 10⁹ |

    | 2ⁿ | 1024 | 1.3 × 10³⁰ | 1.1 × 10³⁰¹ |

    | n! | 3.6 × 10⁶ | 10¹⁵⁸ | 4 × 10²⁵⁶⁷ |


    Usually one considers problems easy, if the running time is bounded by a polynomial,
    all others are considered hard. The reason can be understood from the table: Even
    if the polynomial functions may take higher values for small n, asymptotically
    non-polynomial functions diverge much faster. Let us consider, e.g. the relative
    performance of two computers, one being twice as fast as the other one. In a linear-time
    problem, the faster computer is able to solve a problem which is twice as large
    as the problem solvable in the same time on the slower computer. If the running
    time grows, however, as 2ⁿ, the faster computer is just able to go from n to n
    + 1 compared with the slower one. We see that for such hard problems, the utility
    of higher-speed computers is very limited – a substantial increase in the size
    of solvable problems can only be achieved via the use of better algorithms.


