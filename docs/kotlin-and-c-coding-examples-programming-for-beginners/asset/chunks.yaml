  trans: "\n\n![](img/cover.jpeg)\n\n# KOTLIN 与 C 编程示例：初学者编程\n## J KING\n\n## 目录\n\
    - 对两个数进行算术运算的 Kotlin 程序\n- 简单计算程序\n- 运行时输入数字（整数、浮点数、双精度）的程序\n- 寻找三个数中最大的 Kotlin\
    \ 程序\n- 交换两个数字 Kotlin 程序\n- 检查数字是偶数还是奇数的 Kotlin 程序\n- 打印乘法表的 Kotlin 程序\n- 计算并显示学生成绩的程序\n\
    - 转换温度的 Kotlin 程序\n- 显示斐波那契数列的 Kotlin 程序\n- 计算圆面积的 Kotlin 程序\n- 计算正方形面积的 Kotlin\
    \ 程序\n- 计算圆柱面积的程序\n- 生成 4 位 OTP 的 Kotlin 程序\n- 计算五边形面积的 Kotlin 程序\n- 寻找质数的 Kotlin\
    \ 程序\n- 进制转二进制的 Kotlin 程序\n- 计算两个数和和平均值的 C 程序\n- 打印字符 ASCII 值的 C 程序\n- 使用 goto\
    \ 语句打印从 1 到 N 的所有数字 C 程序\n- 使用 while 循环打印从 1 到 N 的数字程序\n- 打印平方、立方和平方根的程序\n- 打印给定数字数表的程序\n\
    - 三个数中最大数的程序\n- C 语言中的矩形面积程序\n- C 程序 - 英制转英寸\n- 使用文件处理创建文本文件的程序\n- 计算数字阶的 C 程序\n\
    - 交换字节中两个位的程序\n- 使用四种不同方法交换两个数字的程序\n- 年龄计算器（计算年龄的 C 程序）\n- 设计数字钟的 C 程序\n- 计算复利的程序\n\
    - 检查数字是否为完全平方程序\n- 程序中不用分号打印消息\n- 使用 C 语言的级数程序/示例\n\n# Kotlin 基础程序\n\n### 对两个数进行算术运算的\
    \ Kotlin 程序\n示例：\n输入：\n```\na = 13\nb = 5\n```\n输出：\n```\na + b = 18\na - b =\
    \ 8\na * b = 65\na / b = 2\na % b = 3\n```\n\n```kotlin\n// 程序主入口点\nfun main(args:\
    \ Array<String>) {\n    val a = 13\n    val b = 5\n    val sum = a + b // 加法\n\
    \    val sub = a - b // 减法\n    val muti = a * b // 乘法\n    val div = a / b //\
    \ 除法\n    val rem = a % b // 余\n    // 在控制台打印\n    println(\"Addition of $a and\
    \ $b is : $sum\")\n    println(\"Subtraction of $a and $b is : $sub\")\n    println(\"\
    Multiplication of $a and $b is: $muti\")\n    println(\"Division of $a and $b\
    \ is : $div\")\n    println(\"Remainder of $a and $b is : $rem\")\n}\n```\n输出：\n\
    ```\nAddition of 13 and 5 is : 18\nSubtraction of 13 and 5 is : 8\nMultiplication\
    \ of 13 and 5 is: 65\nDivision of 13 and 5 is : 2\nRemainder of 13 and 5 is :\
    \ 3\n```\n\n### 简单计算程序\n用户必须输入 (+, -, *, /, %) 中的任何选择来执行操作。\n\n```kotlin\n/**\n\
    \ * 对两个数进行简单计算的 Kotlin 程序\n * 用户必须输入 ( +, -, *, /, % ) 中的任何选择来执行操作\n */\npackage\
    \ com.includehelp.basic\nimport java.util.*\n\n// 程序主入口点\nfun main(args: Array<String>)\
    \ {\n    // 获取输入的输入流\n    val reader = Scanner(System.`in`)\n    // 输入整数值\n  \
    \  print(\"Enter Integer Value : \")\n    var first = reader.nextInt()\n    //\
    \ 输入整数值\n    print(\"Enter Integer Value : \")\n    var second = reader.nextInt()\n\
    \    // 输入任何字符作为选择\n    print(\"Enter any Action( +, -, /, % ) : \")\n    val\
    \ choice = reader.next()[0]\n    try {\n        var result = when(choice) {\n\
    \            '+' -> first + second\n            '-' -> first - second\n      \
    \      '*' -> first * second\n            '/' -> first / second\n            '%'\
    \ -> first % second\n            else -> {\n                System.err.println(\"\
    Not a Valid Operation choice\")\n                return\n            }\n     \
    \   }\n        // 打印结果\n        println(\"Result is : $result\")\n    } catch\
    \ (E: Exception) {\n        System.err.println(\"Exception : ${E.toString()}\"\
    )\n    }\n}\n```\n输出：\n```\nRUN 1:\nEnter Integer Value : 35\nEnter Integer Value\
    \ : 8\nEnter any Action( +, -, /, % ) : %\nResult is : 3\nRUN 2:\nEnter Integer\
    \ Value : 45\nEnter Integer Value : 67\nEnter any Action( +, -, /, % ) : /\nResult\
    \ is : 6\n```\n\n### 运行时输入数字（整数、浮点数、双精度）的程序\n```kotlin\nimport java.util.*\n\n\
    // 程序主入口点\nfun main(args: Array<String>) {\n    // 获取输入的输入流\n    val reader =\
    \ Scanner(System.`in`)\n    // 输入整数值\n    print(\"Enter Integer Value : \")\n\
    \    val intValue = reader.nextInt()\n    println(\"Integer Number : $intValue\"\
    )\n    // 输入长型值\n    print(\"Enter Long Value : \")\n    val longValue = reader.nextLong()\n\
    \    println(\"Long Number : $longValue\")\n    // 输入浮点值\n    print(\"Enter Float\
    \ Value : \")\n    val floatValue = reader.nextFloat()\n    println(\"Float Number\
    \ : $floatValue\")\n    // 输入双精度值\n    print(\"Enter Double Value : \")\n    val\
    \ doubleValue = reader.nextDouble()\n    println(\"Double Number : $doubleValue\"\
    )\n}\n```\n输出：\n```\nRun 1:\nEnter Integer Value : 123\nInteger Number : 123\n\
    Enter Long Value : 34355566\nLong Number : 34355566\nEnter Float Value : 45.34\n\
    Float Number : 45.34\nEnter Double Value : 456.78\nDouble Number : 456.78\n```\n\
    \n### 寻找三个数中最大的 Kotlin 程序\n示例：\n输入：\nFirst number: 10\nSecond number: 20\nThird\
    \ number: 30\n输出：\nLargest number: 30\n\n```kotlin\npackage com.includehelp.basic\n\
    import java.util.*\n\n// 程序主入口点\nfun main(args: Array<String>) {\n    // 获取输入的输入流\n\
    \    val reader = Scanner(System.`in`)\n    // 输入整数值\n    print(\"Enter First\
    \ Value : \")\n    var first = reader.nextInt()\n    // 输入第二个值\n    print(\"Enter\
    \ Second Value : \")\n    var second = reader.nextInt()\n    // 输入第三个值\n    print(\"\
    Enter Third Value : \")\n    var third = reader.nextInt()\n    // 寻找三个数中最大值的条件\n\
    \    val largest = if (first > second && first > third) {\n        first\n   \
    \ } else if (second > third) {\n        second\n    } else {\n        third\n\
    \    }\n}\n```\n\n"
- fmt: "\n# Kotlin program to swap two numbers\n\n## Example:\nInput:\nFirst number:\
    \ 10\nSecond number: 20\nOutput:\nFirst number: 20\nSecond number: 10\n\n### PROGRAM\n\
    ```kotlin\nimport java.util.*\n// Main Method Entry Point of Program\nfun main(arg:\
    \ Array<String>) {\n    // InputStream to get Input\n    var reader = Scanner(System.`in`)\n\
    \    // Input two values\n    println(\"Enter First Value : \")\n    var first\
    \ = reader.nextInt();\n    println(\"Enter Second Value : \")\n    var second\
    \ = reader.nextInt();   \n    println(\"Numbers Before Swap : \\n first = $first\
    \ \\n second = $second \")\n    //Code for Swap Numbers\n    var temp = first\n\
    \    first=second\n    second=temp\n    println(\"Numbers After  Swap : \\n first\
    \ = $first \\n second = $second \")\n}\n```\n\n### Output\nRun 1:\nEnter First\
    \ Value :\n45\nEnter Second Value :\n12\nNumbers Before Swap :\nfirst = 45\nsecond\
    \ = 12\nNumbers After  Swap :\nfirst = 12\nsecond = 45\n\n# Kotlin program to\
    \ check whether a number is EVEN or ODD\n\n## Example:\nInput:\nN = 13\nOutput:\n\
