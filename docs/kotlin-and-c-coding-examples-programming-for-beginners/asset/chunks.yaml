    \ \")\n    val start = sc.nextLong()\n    // 输入范围结束值\n    print(\"输入范围结束： \")\n\
    \    val end = sc.nextLong()\n    // 声明用于存储的可变列表\n    val list: MutableList<Long>\
    \ = ArrayList()\n    // 遍历循环从开始到结束以查找范围内的数字\n    for (i in start..end) {\n   \
    \     if (findPrimeNo(i)) {\n            list.add(i)\n        }\n    }\n    println(\"\
    从 $start 到 $end 的质数：$list\")\n}\n```\n\n# 将十进制转换为二进制的 Kotlin 程序\n\n示例：\n输入：\n\
