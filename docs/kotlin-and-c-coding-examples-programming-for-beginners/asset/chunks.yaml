    \ compound interest\n- Program to check whether number is Perfect Square or not\n\
    - Program to print message without using any semicolon in program\n- Sum of Series\
    \ Programs / Examples using C\n\n# Basic Programs in Kotlin\n\n### Kotlin program\
    \ to perform arithmetic operations on two numbers\nExample:\nInput:\n```\na =\
    \ 13\nb = 5\n```\nOutput:\n```\na + b = 18\na - b = 8\na * b = 65\na / b = 2\n\
    a % b = 3\n```\n\n```kotlin\n// Main Entry Point of Program\nfun main(args: Array<String>)\
    \ {\n    val a = 13\n    val b = 5\n    val sum = a + b // Addition\n    val sub\
    \ = a - b // Subtraction\n    val muti = a * b // Multiplication\n    val div\
    \ = a / b // Division\n    val rem = a % b // remainder\n    // Print on Console\n\
    \    println(\"Addition of $a and $b is : $sum\")\n    println(\"Subtraction of\
    \ $a and $b is : $sub\")\n    println(\"Multiplication of $a and $b is: $muti\"\
    )\n    println(\"Division of $a and $b is : $div\")\n    println(\"Remainder of\
    \ $a and $b is : $rem\")\n}\n```\nOutput:\n```\nAddition of 13 and 5 is : 18\n\
    Subtraction of 13 and 5 is : 8\nMultiplication of 13 and 5 is: 65\nDivision of\
    \ 13 and 5 is : 2\nRemainder of 13 and 5 is : 3\n```\n\n### Program to perform\
    \ simple calculation\nUser have to (+, -, *, /, %) put any choice to perform operation.\n\
    \n```kotlin\n/**\n * Kotlin Program to Perform Simple Calculation on Two numbers\n\
    \ * User have to ( +, -, *, /, % ) any choice to perform operation\n */\npackage\
    \ com.includehelp.basic\nimport java.util.*\n\n// Main Entry Point of Program\n\
    fun main(args: Array<String>) {\n    // InputStream to get Input\n    val reader\
    \ = Scanner(System.`in`)\n    // Input Integer Value\n    print(\"Enter Integer\
    \ Value : \")\n    var first = reader.nextInt()\n    // Input Integer Value\n\
    \    print(\"Enter Integer Value : \")\n    var second = reader.nextInt()\n  \
    \  // Input Any Character as Choice\n    print(\"Enter any Action( +, -, /, %\
    \ ) : \")\n    val choice = reader.next()[0]\n    try {\n        var result =\
    \ when(choice) {\n            '+' -> first + second\n            '-' -> first\
    \ - second\n            '*' -> first * second\n            '/' -> first / second\n\
    \            '%' -> first % second\n            else -> {\n                System.err.println(\"\
    Not a Valid Operation choice\")\n                return\n            }\n     \
    \   }\n        //Print Result\n        println(\"Result is : $result\")\n    }\
    \ catch (E: Exception) {\n        System.err.println(\"Exception : ${E.toString()}\"\
    )\n    }\n}\n```\nOutput:\n```\nRUN 1:\nEnter Integer Value : 35\nEnter Integer\
    \ Value : 8\nEnter any Action( +, -, /, % ) : %\nResult is : 3\nRUN 2:\nEnter\
    \ Integer Value : 45\nEnter Integer Value : 67\nEnter any Action( +, -, /, % )\
    \ : /\nResult is : 6\n```\n\n### Program to input numbers (integer, float, double)\
    \ at run time\n```kotlin\nimport java.util.*\n\n// Main Entry Point of Program\n\
    fun main(args: Array<String>) {\n    // InputStream to get Input\n    val reader\
    \ = Scanner(System.`in`)\n    // Input Integer Value\n    print(\"Enter Integer\
    \ Value : \")\n    val intValue = reader.nextInt()\n    println(\"Integer Number\
    \ : $intValue\")\n    // Input Long Value\n    print(\"Enter Long Value : \")\n\
    \    val longValue = reader.nextLong()\n    println(\"Long Number : $longValue\"\
    )\n    // Input Float Value\n    print(\"Enter Float Value : \")\n    val floatValue\
    \ = reader.nextFloat()\n    println(\"Float Number : $floatValue\")\n    // Input\
    \ Double Value\n    print(\"Enter Double Value : \")\n    val doubleValue = reader.nextDouble()\n\
    \    println(\"Double Number : $doubleValue\")\n}\n```\nOutput:\n```\nRun 1:\n\
    Enter Integer Value : 123\nInteger Number : 123\nEnter Long Value : 34355566\n\
    Long Number : 34355566\nEnter Float Value : 45.34\nFloat Number : 45.34\nEnter\
    \ Double Value : 456.78\nDouble Number : 456.78\n```\n\n### Kotlin program to\
    \ find largest of three numbers\nExample:\nInput:\nFirst number: 10\nSecond number:\
    \ 20\nThird number: 30\nOutput:\nLargest number: 30\n\n```kotlin\npackage com.includehelp.basic\n\
    import java.util.*\n\n// Main Entry Point of Program\nfun main(args: Array<String>)\
    \ {\n    // InputStream to get Input\n    val reader = Scanner(System.`in`)\n\
    \    // Input Integer values\n    print(\"Enter First Value : \")\n    var first\
    \ = reader.nextInt()\n    // Input Second Value\n    print(\"Enter Second Value\
    \ : \")\n    var second = reader.nextInt()\n    // Input Third Value\n    print(\"\
    Enter Third Value : \")\n    var third = reader.nextInt()\n    // condition to\
    \ find largest of three numbers\n    val largest = if (first > second && first\
    \ > third) {\n        first\n    } else if (second > third) {\n        second\n\
    \    } else {\n        third\n    }\n}\n```\n"
