    \ mainBundle] bundleDomainName];\n[[NSUserDefaults standardUserDefaults] removePersistentDomainName:appDomain];\n\
    ```\n\n## Chapter 33: Subscribing\n\n### Section 33.1: Subscripts with NSArray\n\
    \nSubscripts can be used to simplify retrieving and setting elements in an array.\
    \ Given the following array\n\n```objc\nNSArray *fruit = @[\"Apples\", \"Bananas\"\
    , \"Cherries\"];\n```\n\nThis line\n\n```objc\n[fruit objectAtIndexIndex: 1];\n\
    ```\n\nCan be replaced by\n\n```objc\nfruit[1];\n```\n\nThey can also be used\
    \ to set an element in a mutable array.\n\n```objc\nNSMutableArray *fruit = @[\"\
    Apples\", \"Bananas\", \"Cherries\"] mutableCopy;\nfruit[1] = @[\"Blueberries\"\
    ];\nNSLog(\"%@%\"); //Blueberries\n```\n\nIf the index of the subscript equals\
    \ the count of the array, the element will be appended to the array.\n\nRepeated\
    \ subscripts may be used to access elements of nested arrays.\n\n```objc\nNSArray\
    \ *fruit = @[\"Apples\", \"Bananas\", \"Cherries\"];\nNSArray *vegetables = @[\"\
    Avocado\", \"Beans\", \"Carrots\"];\nNSArray *produce = @[@*fruit, *vegetables];\n\
    ```\n\n```objc\nNSLog(\"%@%\"); produce[[0]]; //Bananas\n```\n\n### Section 33.2:\
    \ Custom Subscribing\n\nYou can subscribe to your classes by implementing the\
    \ required methods.\n\nFor indexed subscript (like arrays):\n\n+   - (id)objectAtIndexSubscript:(NSInteger)idx\n\
    - (void)setObject:(id)obj atIndexedSubscript:(NSInteger)idx\n\nFor keyed subscript\
    \ (like dictionaries):\n\n+   - (id)objectForKeyedSubscript:(id)key\n- (void)setObject:(id)obj\
    \ forKeyedSubscript:(id <NSObjectKey>)key\n\n### Section 33.3: Subscribing with\
    \ Dictionary\n\nSubscripts can be used with NSMutableDictionary and NSMutableDictionary.\
    \ The following code is:\n\n```objc\nNSMutableDictionary *dictionary = @[@\"Foo\"\
    : @\"Bar\"] mutableCopy;\n[dictionary setObject:@\"Baz\" forKey:@\"Foo\"];\nNSLog(\"\
    %@%\"); [dictionary objectForKey:@\"Foo\"]; // Baz\n```\n"
