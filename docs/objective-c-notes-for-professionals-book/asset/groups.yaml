    \ Foundation 框架中 Foundation.h 的内容复制到文件的顶部。#import 和 #include 之间的主要区别是，#import\
    \ 足够“智能”，不会预处理已经包含在其他 #include 中的文件。\n\nC 语言的文档解释了 `main()` 函数。\n\n`NSLog()` 函数会将字符串打印到控制台，并带有一些调试信息。在这种情况下，我们使用了一个\
    \ Objective-C 字符串字面量 \"@Hello World\"。在 C 语言中，你会将其写为 \"Hello World\"，Apple 的 Foundation\
    \ 框架增加了 `NSString` 类，它提供了许多有用功能，并被 `NSLog` 使用。创建 `NSString` 实例的最简单方法是像这样：\"@string\
    \ content here\"\n\n> 从技术上讲，`NSLog()` 是 Apple Foundation 框架的一部分，实际上并不是 Objective-C\
    \ 语言的一部分。然而，Foundation 框架贯穿 Objective-C 编程始终。Foundation 框架不是开源的，不能在开发环境之外使用。与\
    \ OPENStep 和 GNUStep 相关的框架有开源替代。\n\n## 编译程序\n\n假设我们编译 Hello World 程序，它由单个 hello.m\
    \ 文件组成，编译可执行文件的命令是：\n\n```bash\nclang -framework Foundation hello.m -o hello\n\
    ```\n\n然后你可以运行它：\n\n```bash\n./hello\n```\n\n这将输出：\n\nHello World!\n\nGoalKicker\
    \ – Objective-C® Notes for Professionals\n\n选项有：\n\n- -framework：指定用于编译编译的框架。由于此程序使用了\
    \ Foundation，我们包含了 Foundation 框架。\n- -o：此选项指示我们希望将程序输出到哪个文件。在我们的例子中是 hello。如果没有指定，默认值为\
    \ .out。\n\n# 第 2 章：基础数据类型\n\n## 第 2.1 节：SEL\n\n选择器（Selectors）在 Objective-C 中用作方法标识。\n\
    \n在下面的示例中，有两个选择器：`new` 和 `setName:`：\n\n```objc\nPerson* customer = [Person new];\n\
    [customer setName:@\"John Doe\"];\n```\n\n每一对括号对应于发送的消息的消息。在第一行，我们向 Person 发送了一个包含选择器的消息；在第二行，我们发送了一个包含\
    \ `setName:` 以及一个字符串的消息。这些消息的接收者使用选择器来查找要执行的正确操作。\n\n大多数情况下，使用括号语法的消息传递就足够了，但有时你需要处理选择器本身。在这些情况下，可以使用\
    \ `SEL` 类型来持有选择器的引用。\n\n如果选择器在编译时可用，你可以使用 `@selector` 获取它的引用。\n\n```objc\nSEL\
    \ s = @selector(setName:);\n```\n\n如果你在运行时需要该选择器，请使用 `NSSelectorFromString`\n\n\
    ```objc\nSEL s = NSSelectorFromString(\"setName:\");\n```\n\n使用 `NSSelectorFromString`\
    \ 时，请确保将选择器封装在 `NSString` 中。\n\n检查代理（delegate）是否实现了可选方法是常见的做法。\n\n```objc\nif\
    \ ([self.myDelegate respondsToSelector:@selector(doSomething)]) {\n  [self.myDelegate\
    \ doSomething];\n}\n```\n\n## 第 2.2 节：BOOL\n\n`BOOL` 类型在 Objective-C 中用于布尔值。它有两个值：`YES`\
    \ 和 `NO`，与常见的 `true` 和 `false` 相对。\n\n它的行为非常直接且与 C 语言一致。\n\n```objc\nBOOL isEqual\
    \ = (YES); // isEqual 是 YES\nBOOL notEqual = !isEqual; // notEqual 是 NO\nNSAssert(aEqual,\
    \ \"Mathematics is a lie\"); // 断言失败\n```\n\n```objc\nBOOL shouldFlattenReader\
    \ = YES;\nif (shouldFlattenReader) {\n  NSLog(\"@Only your smartest programmers\
    \ read this.\");\n}\n```\n\nBOOL 是一个原始类型，不能直接存储在 Foundation 集合中。它必须被封装在 `NSNumber`\
    \ 中。Clang 提供了这种语法：\n\n```objc\nNSNumber * yes = @YES; // 等同于 [NSNumber numberWithBool:YES];\n\
    ```\n\n```objc\nNSNumber *no = @NO; // 等同于 [NSNumber numberWithBool:NO]\n```\n\
    \nBOOL 的实现直接基于 C 语言，因为它是 C99 标准类型 `bool` 的别名。YES 和 NO 值分别由 `__obj_c` 和 `__obj_c`\
    \ 定义。这些特殊值是由 Clang 引入的内置值，会被翻译为 (BOOL) 和 (BOOL)。如果它们不可用，YES 和 NO 将直接定义为强制转换整数的形式。定义可以在\
    \ Objective-C 运行时头文件 `obj.h` 中找到\n\n## 第 2.3 节：id\n\nid 是通用对象指针，是一种表示“任何对象”的 Objective-C\
    \ 类型。Objective-C 类的实例可以存储在 `id` 中。`id` 和任何其他类型可以互相赋值无需类型转换：\n\n```objc\nid anonymousSurname\
    \ = @\"Doe\";\nNSString * surname = anonymousSurname;\nid anonymousFullName =\
    \ [NSString stringWithFormat:@\"%@\", \"John\", surname];\n```\n\n这在从集合中检索对象时变得相关。`objectAt:`\
    \ 等方法的返回类型之所以是 `id` 正是因为如此。\n\n```objc\nDataRecord * record = [records objectAtIndex:index];\n\
    ```\n\n这意味着类型化为 `id` 的方法或函数参数可以接受任何对象。\n当对象类型为 `id` 时，可以传递任何消息。消息传递依赖于编译时。\n\n\
    ```objc\nNSString * result = [anyObject stringByAppendingString:otherString];\n\
    ```\n\n## 第 2.4 节：IMP（实现指针）\n\nIMP 是方法的实现类型，称为实现指针。它是指向方法实现部分的指针。\n\n语法：\n\n```c\n\
    id (*IMP)(id, SEL)\n```\n\nIMP 定义为：\n\n```objc\ntypedef id (*IMP)(id self,SEL\
    \ _cmd,...);\n```\n\n要访问此 IMP，可以使用消息“methodForSelector”。\n\n# 示例 1：\n\n```objc\n\
    IMP ImpDoSomething = [myObject methodForSelector:@selector(doSomething)];\n```\n\
    \n由 IMP 指向的方法可以通过解引用调用。\n\n```objc\nImpDoSomething(myObject, @selector(doSomething));\n\
    ```\n\n这些调用是等等的：\n\n```objc\nmyImpDoSomething(myObject, @selector(doSomething))\n\
    [myObject doSomething]\n[myObject performSelector:mySelector]\n[myObject performSelector:@selector(doSomething)]\n\
    [myObject performSelector:NSStringWithString(\"doSomething\")]\n```\n\n# 示例 2：\n\
    \n```objc\nSEL otherWaySelector = NSStringWithString(@methodWithFirstAndSecondAndThird:);\n\
    ```\n\n```objc\nIMP methodImplementation = [self methodForSelector:otherWaySelector];\n\
    ```\n\n```objc\nresult = methodImplementation(\nself,\notherWaySelector,\nfirst,\n\
    second,\nthird\n);\n```\n\n```objc\nNSLog(@methodForSelector : \"@\", result);\n\
    ```\n\n在这里，我们调用 `[self methodForSelector:]` 返回指向实际实现方法的 C 函数指针，随后可以直接调用它。\n\n\
    ## 第 2.5 节：NSInteger\n\nNSInteger 是根据架构定义的 `int` 或 `long` 的别名。无符号整数的 `NSInteger`\
    \ 也是如此。如果你检查 `NSInteger`，你会看到以下：\n\n```objc\n#if _LP64_ || ((TARGET_OS_EMBEDDED\
    \ && TARGET_OS_IPHONE) || TARGET_OS_WIN32 || NS_BUILD_32_LIKE_64)\ntype long NSInteger;\n\
    type unsigned long NSInteger;\n#else\ntype int NSInteger;\ntype unsigned int NSInteger;\n\
    #endif\n```\n\n有符号与无符号 int 或 long 的区别在于，有符号 int 或 long 可以包含负\n\n"
