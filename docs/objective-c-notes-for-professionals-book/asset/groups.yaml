    \n## Section 7.1: Class methods\n\nA method is called on the method it belongs\
    \ to, not an instance of it. This is possible because Objective-C classes are\
    \ also objects. To denote a method as a class method, change the - to a +:\n\n\
    ```objc\n+ (void)hello {\n    NSLog(\"Hello World\");\n}\n```\n\n## Section 7.2:\
    \ Pass by value parameter passing\n\nIn pass by value of parameter passing to\
    \ a method, actual parameter value is copied to formal parameter value. So actual\
    \ parameter value will not change after returning from called function.\n\n```objc\n\
    @interface SwapClass : NSObject\n-(void)swap:(NSInteger)num1 and2:(NSInteger)num2;\n\
    @end\n\n@implementation SwapClass\n-(void)swap:(NSInteger)num1 and2:(NSInteger)num2\
    \ {\n    int temp;\n    temp = num1;\n    num1 = num2;\n    num2 = temp;\n}\n\
    @end\n```\n\nCalling the methods:\n\n```objc\nNSInteger a=10, b=20;\nSwapClass\
    \ *swap = [[SwapClass alloc] init];\nNSLog(@\"Before calling swap: a=%ld,b=%ld\"\
    ,a,b);\n[swap swap:a and2:b];\nNSLog(@\"After calling swap: a=%ld,b=%ld\",a,b);\n\
    ```\n\nOutput:\n\n```\n2016-07-30 23:55:41.870 Test(5214:81162) Before swap: a=10,b=20\n\
    2016-07-30 23:55:41.871 Test(5214:81162) After calling swap: a=10,b=20\n```\n\n\
    ## Section 7.3: Pass by reference parameter passing\n\nIn pass by reference of\
    \ parameter passing to a method, address of actual parameter is passed to formal\
    \ parameter. So actual parameter value will be changed after returning from called\
    \ function.\n\n```objc\n@interface SwapClass : NSObject\n-(void)swap:(int*)num1\
    \ and2:(int*)num2;\n@end\n\n@implementation SwapClass\n\n-(void)swap:(int*)num1\
    \ and2:(int*)num2 {\n    int temp;\n    temp = *num1;\n    *num1 = *num2;\n  \
    \  *num2 = temp;\n}\n@end\n```\n\nCalling the methods:\n\n```objc\nint a = 10,\
    \ b = 20;\nSwapClass *swap = [[SwapClass alloc] init];\nNSLog(@\"Before calling\
    \ swap: a=%d,b=%d\", a,b);\n[swap swap:&a &b];\nNSLog(@\"After calling swap: a=%d,b=%d\"\
    , a,b);\n```\n\nOutput:\n\n```\n2016-07-31 00:01:47.067 [5260:83491] Before calling\
    \ swap: a=10,b=20\n2016-07-31 00:01:47.070 [5260:83491] After calling swap: a=20,b=10\n\
    ```\n\n## Section 7.4: Getters and Setters\n\nGoal is to pass the value to the\
    \ setter.\n\n```objc\n@interface SwapClass : NSObject\n@property (nonatomic) NSInteger\
    \ value;\n@end\n\n@implementation SwapClass\n\n-(void)setValue:(NSInteger)value\
    \ {\n    _value = value;\n    NSLog(@\"Setting value to: %ld\", _value);\n}\n\n\
    -(NSInteger)value {\n    NSLog(@\"Getting value: %ld\", _value);\n    return _value;\n\
    }\n@end\n```\n\n## Section 7.5: Properties\n\nA property is a way to declare variables\
    \ in a class.\n\n```objc\n@interface Person : NSObject\n@property (nonatomic)\
    \ NSString *name;\n@end\n\n@implementation Person\n@end\n```\n\n## Section 7.6:\
    \ Associated Objects\n\nAssociated objects allow you to add properties to classes\
    \ at runtime without subclassing.\n\n```objc\n#import <objc/objc.h>\n\nstatic\
    \ char * const personAgeKey = \"personAgeKey\";\n\n@interface Person\n@property\
    \ (nonatomic) NSInteger age;\n@end\n\n@implementation Person\n\n-(void)setAge:(NSInteger)age\
    \ {\n    objc_setAssociatedObject(self, personAgeKey, @NSNumber(age), OB_ASSOCIATION_RETAIN_NONATOMIC);\n\
    }\n\n-(NSInteger)age {\n    return [[objc_getAssociatedObject(self, personAgeKey)\
    \ NSNumber] integerValue];\n}\n\n@end\n```\n\n## Section 7.7: Categories\n\nCategories\
    \ allow you to add methods to existing classes without subclassing or modifying\
    \ the source code.\n\n```objc\n@interface Person (Greeting)\n-(void)sayHello;\n\
    @end\n\n@implementation Person (Greeting)\n-(void)sayHello {\n    NSLog(@\"Hello\
    \ World!\");\n}\n@end\n```\n\n## Section 7.8: Protocols\n\nProtocols define a\
    \ set of method signatures that a class or object must implement.\n\n```objc\n\
    @protocol Speaker\n-(void)speak;\n@end\n\n@interface Person : NSObject <Speaker>\n\
    @end\n\n@implementation Person\n-(void)speak {\n    NSLog(@\"I am speaking.\"\
    );\n}\n@end\n```\n\n## Section 7.9: Blocks\n\nBlocks are anonymous objects that\
    \ can be passed around in your code.\n\n```objc\nvoid (^block)(void) = ^^{\n \
    \   NSLog(@\"Hello from block!\");\n};\nblock();\n```\n\n## Section 7.10: Enumerations\n\
    \nEnumerations allow you to define a set of named constants.\n\n```objc\ntypedef\
    \ enum(NSInteger, Color) {\n    Red,\n    Green,\n    Blue\n};\n```\n\n## Section\
    \ 7.11: Notifications\n\nNotifications allow objects to communicate with each\
    \ other without being directly linked.\n\n```objc\nstatic NSName *const myNotification\
    \ = @\"myNotificationName\";\n\n[[NSNotificationCenter defaultCenter] postNotification:myNotification\
    \ object:nil];\n[[NSNotificationCenter defaultCenter] addObserver:self selector:@selector(handleNotification:)\
    \ name:myNotification object:nil];\n```\n\n# Chapter 8: Advanced Topics\n\n##\
    \ 8.1 Key-Value Pairs\n\nKey-value pairs allow you to pass data along with a notification.\n\
    \n```objc\n[[NSNotificationCenter defaultCenter] postNotification:myNotification\
