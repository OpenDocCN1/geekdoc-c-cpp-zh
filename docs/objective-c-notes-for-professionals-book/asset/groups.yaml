    @sum will, you can probably guess, add up all the values of a property.


    ```

    @Interface Expense : NSObject

    @property NSNumber *price;


    + (instancetype)expenseWithPrice:(NSNumber*)price;

    @end

    ```


    ```

    self.expenses = @[[Expense expenseWithPrice:@1.50],

    [Expense expenseWithPrice:@9.99],

    [Expense expenseWithPrice:@2.78],

    [Expense expenseWithPrice:@9.99],

    [Expense expenseWithPrice:@24.95]];

    ```


    Here, we used @ to find the total price of all the expenses in the array. If we
    wanted to find the average price we''re paying for each expense, we can use @avg:


    Finally, there is the unionOf family. There are five different operators in this
    family, but they all work mostly the same, with only small differences between
    each. First, the unionOfObjects which will return an array of properties of objects
    in an array:


    ```

    // See "expenses" array above

    NSArray<NSNumber *>allPrices = [self valueForKeyKeyPath:@"expenses.unionOfObjects.price"];

    // Equal to @[@1.50,@9.99, @2.78, @24.95];

    ```


    ```

    @distinctUnionOfObjects functions the same as @unionOfObjects, but it removes
    duplicates:

    NSArray<NSNumber *>differentPrices = [self valueForKeyKeyPath:@"distinctUnionOfObjects.price"];

    // Equal to @[@1.50,@9.99, @2.78, @24.95];

    ```


    And finally, the last 3 operators in the @unionOf family will go one step deeper
    and return an array of values found for a property contained inside nested-arrays:'
