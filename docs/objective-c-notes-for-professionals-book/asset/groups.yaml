    # Section 13.7: Changing Case


    To convert a String to uppercase, use uppercaseString:


    ```

    NSString *myString = %@"Emphasize this";

    NSLog("%@@", [myString uppercaseString]); // "EMPHASIZE THIS"

    ```


    To convert a String to lowercase, use lowercaseString:


    ```

    NSString *myString = %@"NORMALIZE this";

    NSLog("%@@", [myString lowercaseString]); // "normalize"

    ```


    To capitalize the first letter of each word in a string, use capitalizedString:


    ```

    NSString *myString = %@"firstname lastname";

    NSLog("%@@", [myString capitalizedString]); // "First Lastname"

    ```


    # Section 13.8: Removing Leading and Trailing Whitespace


    ```

    NSString *someString = %@Objective-C Language \n";

    NSString *trimmedString = [someString stringByTrimmingCharacters:[NSCharacterSet
    whitespaceAndNewlinesCharacterSet]];

    //Output will be "Objective-C Language"

    ```


    Method stringByTrimmingCharacters returns a new string made by removing from both
    ends of the String contained in a given character.


    We can also remove only whitespace or newline


    ```

    // Removing only WhiteSpace

    NSString *trimmedSpace = [someString stringByTrimmingCharacters:[NSCharacterSet
    whitespaceCharacterSet]];

    //Output will be "Objective-C Language \n"

    // Removing only NewLine

    NSString *trimmedNewLine = [someString stringByTrimmingCharacters:[NSCharacterSet
    newlineCharacterSet]];

    //Output will be "Objective-C Language"

