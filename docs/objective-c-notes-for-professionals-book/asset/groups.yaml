    \ timer.\n\nBy taking a timer as a parameter in said function, you can access\
    \ the userInfo property.\n\n```\nNSDictionary *dictionary = @{\n    \"Message\"\
    \ : @\"Hello, world!\"\n}; //this dictionary contains a message\n[NSTimer scheduledWithTimeInterval:5.0\n\
    \    target:@self\n    selector:@selector(doSomething)\n    userInfo:dictionary\n\
    \    repeats:NO]; // the timer contains the dictionary and later calls the function\n\
    \n-(void)doSomething:(NSTimer*)timer{\n    //the function retrieves the message\
    \ from the timer\n    NSLog(\"%@\", timer.userInfo[\"Message\"]);]);\n}\n```\n\
    \n# ## Section 27.2: Creating a Timer\n\nThis will create a timer to call the\
    \ doSomething method in self 5.0 seconds.\n\n```\n[NSTimer scheduledWithTimeInterval:5.0\n\
    \    target:@self\n    selector:@selector(doSomething)\n    userInfo:nil\n   \
    \ repeats:NO];\n```\n\nSetting the repeats parameter to false/NO indicates that\
    \ we want the timer to fire only once. If we set it true/YES, it would fire every\
    \ five seconds until manually invalidated.\n\n# ## Section 27.3: Invalidating\
    \ a timer\n\n```\n[timer invalidate];\ntimer = nil;\n```\n\nThis will stop the\
    \ timer from firing. **Must be called from the thread the timer was created in**,\
    \ see Apple's notes:\n\n> You must send this message from the thread on the timer\
    \ was installed. If you send this message from another thread, the input source\
    \ associated with the timer may not be removed from its run loop, which could\
    \ prevent the thread from exiting properly.\n\nSetting **nil** will help you check\
    \ whether it's running or not.\n\n```\nif(timer) {\n    [timer invalidate];\n\
    \    timer = nil;\n}\n```"
