- md: "\n# About\n\nPlease feel free to share this PDF with anyone for free,\nlatest\
    \ version of this book can be downloaded from:\nhttps://goalkicker.com/ObjectiveCBook\n\
    \nThis Objective-C® Notes for Professionals book is compiled from Stack Overflow\
    \ Documentation, the content is written by the beautiful people at Stack Overflow.\n\
    Text content is released under Creative Commons BY-SA, see credits at the end\
    \ of this book whom contributed to the various chapters. Images may be copyright\
    \ of their respective owners unless otherwise specified\n\nThis is an unofficial\
    \ free book created for educational purposes and is not affiliated with official\
    \ Objective-C® group(s) or company(s) nor Stack Overflow.\nAll trademarks and\
    \ registered trademarks are the property of their respective company owners\n\n\
    The information presented in this book is not guaranteed to be correct accurate,\
    \ use at your own risk\n\nPlease send feedback and corrections to web@petercv.com\n\
    \n# Chapter 1: Getting started with Objective-C Language\n\n| Version | Release\
    \ Date |\n| :--- | :--- |\n| 1.0 | 1983-01-01 |\n| 2.0 | 2007-10-27 |\n| Modern\
    \ | 2014-03-10 |\n\n## Section 1.1: Hello World\n\nThis program will output \"\
    Hello World!\"\n\n```c\n#import <Foundation/Foundation.h>\nint main(int argc,\
    \ char * argv[]) {\n    NSLog(\"@Hello World!\");\n}\n```\n\n#import is a pre-processor\
    \ directive, which indicates we want to import or include the information from\
    \ that file into the program. In this case, the compiler will copy the contents\
    \ of Foundation.h in the Foundation framework to the top of the file. The main\
    \ difference between #import and #include is that #import is \"smart\" enough\
    \ not to preprocess files that have already been included in other #includes.\n\
    \nThe C Language documentation explains the main() function.\n\nThe NSLog() function\
    \ will print the string to the console, along with some debugging information.\
    \ In this case, we use an Objective-C string literal \"@Hello World\". In C, you\
    \ would write this as \"Hello World\", Apple's Foundation Framework adds the NSString\
    \ class which provides a lot of useful functionality, and is used by NSLog. The\
    \ simplest way to create an instance of NSString is like this: \"@string content\
    \ here\"\n\n> Technically, NSLog() is part of Apple's Foundation Framework and\
    \ is not actually part of the Objective-C language. However, the Foundation Framework\
    \ is ubiquitous throughout Objective-C programming. The Foundation Framework is\
    \ not open-source and cannot be used outside of Development, there are open-source\
    \ alternatives to the framework which are associated with OPENStep and GNUStep.\n\
    \n## Compiling the program\n\nAssuming we compile our Hello World program, which\
    \ consists of a single hello.m file, the command to compile the executable is:\n\
    \n```bash\nclang -framework Foundation hello.m -o hello\n```\n\nThen you can run\
    \ it:\n\n```bash\n./hello\n```\n\nThis will output:\n\nHello World!\n\nGoalKicker\
    \ – Objective-C® Notes for Professionals\n\nThe options are:\n\n- -framework:\
    \ Specifies a framework to use to compile the program. Since this program uses\
    \ Foundation, we include the Foundation framework.\n- -o: This option indicate\
    \ to which file we'd like to output our program. In our case hello. If not specified,\
    \ the default value is a .out.\n\n# Chapter 2: Basic Data Types\n\n## Section\
    \ 2.1: SEL\n\nSelectors are used as method identifiers in Objective-C.\n\nIn the\
    \ example below, there are two selectors. `new` and `setName:`:\n\n```objc\nPerson*\
    \ customer = [Person new];\n[customer setName:@\"John Doe\"];\n```\n\nEach pair\
    \ of brackets corresponds to a message sent. On the first line we send a message\
    \ containing the selector to the Person and on the second line we send a message\
    \ containing the setName: a string. The receiver of these messages uses the selector\
    \ to look up the correct action to perform.\n\nMost of the time, message passing\
    \ using the bracket syntax is sufficient, but occasionally you need to work with\
    \ the selector itself. In these cases, `SEL` type can be used to hold a reference\
    \ to the selector.\n\nIf the selector is available at compile time, you can use\
    \ @selector to get a reference to it.\n\n```objc\nSEL s = @selector(setName:);\n\
    ```\n\nAnd if you need the selector at runtime, use `NSSelectorFromString`\n\n\
    ```objc\nSEL s = NSSelectorFromString(\"setName:\");\n```\n\nWhen using NSSelectorFromString,\
    \ make sure to wrap the selector in a NSString.\n\nIt is common to check if a\
    \ delegate implements an optional method.\n\n```objc\nif ([self.myDelegate respondsToSelector:@selector(doSomething)])\
    \ {\n  [self.myDelegate doSomething];\n}\n```\n\n## Section 2.2: BOOL\n\nThe `BOOL`\
    \ type is used for boolean values in Objective-C. It has two values, `YES`, and\
    \ `NO`, in contrast to the common `true` and `false`.\n\nIts behavior is straightforward\
    \ and identical to the C language.\n\n```objc\nBOOL isEqual = (YES); // isEqual\
    \ is YES\nBOOL notEqual = !isEqual; // notEqual is NO\nNSAssert(aEqual, \"Mathematics\
    \ is a lie\"); // Assertion failed\n```\n\n```objc\nBOOL shouldFlattenReader =\
    \ YES;\nif (shouldFlattenReader) {\n  NSLog(\"@Only your smartest programmers\
    \ read this.\");\n}\n```\n\nBOOL is a primitive and cannot be stored directly\
    \ in a Foundation collection. It must be wrapped in `NSNumber`. Clang provides\
    \ syntax for this:\n\n```objc\nNSNumber * yes = @YES; // Equivalent to [NSNumber\
    \ numberWithBool:YES];\n```\n\n```objc\nNSNumber *no = @NO; // Equivalent to [NSNumber\
    \ numberWithBool:NO]\n```\n\nThe BOOL implementation is directly based on C's,\
    \ in that it is a typedef of the C99 standard type bool. The YES and NO values\
    \ are defined by __obj_c and __obj_c, respectively. These special values are builtin\
    \ introduced by Clang, which are translated to (BOOL) and (BOOL). If they are\
    \ not available, YES and NO are defined directly as the cast-int form. The definitions\
    \ are found in the Objective-C runtime header obj.h\n\n## Section 2.3: id\n\n\
    id is the generic object pointer, an Objective-C type representing \"any object\"\
    . An instance of Objective-C class can be stored in an id. An id and any other\
    \ type can be assigned back and forth without casting:\n\n```objc\nid anonymousSurname\
    \ = @\"Doe\";\nNSString * surname = anonymousSurname;\nid anonymousFullName =\
    \ [NSString stringWithFormat:@\"%@\", \"John\", surname];\n```\n\nThis becomes\
    \ relevant when retrieving objects from a collection. The return types of methods\
    \ like objectAtIndex: are id for exactly this reason.\n\n```objc\nDataRecord *\
    \ record = [records objectAtIndex:index];\n```\n\nIt also means that a method\
    \ or function parameter typed as id can accept any object.\nWhen an object is\
    \ typed as id, any known message can be passed to it: method dispatch does not\
    \ depend on the compile-time type.\n\n```objc\nNSString * extinctBirdMaybe =\n\
    [anonymousSurname stringByAppendingString:anonymousSurname];\n```\n\nA message\
    \ that the object does not actually respond to will still cause an exception at\
    \ runtime, of course.\n\n```objc\nNSDate * nope = [anonymousSurname addTimeInterval:10];\n\
    // Raises \"Does not respond to selector\" exception\n```\n\nGuarding against\
    \ exception.\n\n```objc\nNSDate * nope;\nif([anonymousSurname isKindOfClassOfClass:[NSDate\
    \ class]]) {\nnope = [anonymousSurname addTimeInterval:10];\n}\n```\n\nThe id\
    \ type is defined in objc.h\n\n```objc\ntypedef struct objc_object {\nClass isa;\n\
    } *id;\n```\n\n## Section 2.4: IMP (implementation pointer)\n\nIMP is a C type\
    \ referring to the implementation of a method, also known as an implementation\
    \ pointer. It is a pointer to the start of a method implementation.\n\nSyntax:\n\
    \n```c\nid (*IMP)(id, SEL)\n```\n\nIMP is defined by:\n\n```objc\ntypedef id (*IMP)(id\
    \ self,SEL _cmd,...);\n```\n\nTo access this IMP, the message \"methodForSelector\"\
    \ can be used.\n\n# Example 1:\n\n```objc\nIMP ImpDoSomething = [myObject methodForSelector:@selector(doSomething)];\n\
    ```\n\nThe method addressed by the IMP can be called by dereferencing the IMP.\n\
    \n```objc\nImpDoSomething(myObject, @selector(doSomething));\n```\n\nSo these\
    \ calls are equal:\n\n```objc\nmyImpDoSomething(myObject, @selector(doSomething))\n\
    [myObject doSomething]\n[myObject performSelector:mySelector]\n[myObject performSelector:@selector(doSomething)]\n\
    [myObject performSelector:NSStringWithString(\"doSomething\")]\n```\n\n# Example\
    \ 2:\n\n```objc\nSEL otherWaySelector = NSStringWithString(@methodWithFirstAndSecondAndThird:);\n\
    ```\n\n```objc\nIMP methodImplementation = [self methodForSelector:otherWaySelector];\n\
    ```\n\n```objc\nresult = methodImplementation(\nself,\nbetterWaySelector,\nfirst,\n\
    second,\nthird\n);\n```\n\n```objc\nNSLog(@methodForSelector : \"@\", result);\n\
    ```\n\nHere, we call [self methodForSelector returns us a pointer to the C function\
    \ that actually implements the method, which we can subsequently call directly.\n\
    \n## Section 2.5: NSInteger and NSInteger\n\nThe NSInteger is a typedef for either\
    \ an int or long depending on the architecture. The same goes for an NSInteger\
    \ which is a typedef for the unsigned integers. If you check the NSInteger you\
    \ will see the following:\n\n```objc\n#if _LP64_ || ((TARGET_OS_EMBEDDED && TARGET_OS_IPHONE)\
    \ || TARGET_OS_WIN32 || NS_BUILD_32_LIKE_64)\ntype long NSInteger;\ntype unsigned\
    \ long NSInteger;\n#else\ntype int NSInteger;\ntype unsigned int NSInteger;\n\
    #endif\n```\n\nThe difference between an signed and unsigned int or long is that\
    \ a signed int or long can contain negative\n"
