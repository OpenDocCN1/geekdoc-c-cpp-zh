    \ the getter to set the initial value if it has\nnot yet been set);\n\n```\n-\
    \ (NSString *)someString {\n if (_someString == nil) {\n  _someString = [self\
    \ getInitialValueForSomeString];\n }\n  return someString;\n}\n```\n\nYou can\
    \ also make a property that computes its value in the getter:\n\n```\n@interface\
    \ Circle : NSObject\n\n@property CGPoint origin;\n@property CGFloat radius;\n\
    @property (readonly) CGFloat area;\n\n@end\n```\n\n```\n@implementation Circle\n\
    \n-(CGFloat)area {\n return M_PI * pow(self.radius, 2);\n}\n\n@end\n```\n\n##\
    \ Section 8.2: Properties that cause updates\n\nThis object, Shape, has a property\
    \ that depends on numberOfSides and width. If either one of them is set,\nthe\
    \ image has to be recalculated. But recalculation is presumably long, and only\
    \ needs to be done once if both\nproperties are set, so the Shape provides a way\
    \ to set both properties and only recalculate once. This is done by\nthe Shape\
    \ draws inversely.\n\nIn Shape.h\n\n```\n@interface Shape {\nNSInteger numberOfSides;\n\
    CGFloat width;\n\nUIImage *image;\n\n// Initializer that takes initial values\
    \ for the properties.\n-(instype)initWithNumberOfSides:(NSInteger)numberOfSides\
    \ initWithWidth:(CGFloat)width;\n\n// Method that allows to set both properties\
    \ in once call.\n// This is useful if setting these properties has expensive side-effects.\n\
    // Using a method to set both values at once allows you to have the side-\n-(void)setNumberOfSides:(NSInteger)numberOfSides\
    \ initWith:(CGFloat)width;\n\n// Properties using default attributes.\n@property\
    \ NSInteger numberOfSides;\n@property CGFloat width;\n\nProperty using explicit\
    \ attributes.\n@property(strong, readonly) UIImage *image;\n@end\n```\n\nIn Shape.m\n\
    \n```\n@implementation Shape\n// The variable name of a property that is auto-generated\
    \ by the compiler\n// defaults to being the property name prefixed with an underscore,\
    \ for\n// example \"_propertyName\". You can change this default variable name\
    \ using\n// the following statement:\n// @synthesize property = customVariableName;\n\
    \n-(id)initWithNumberOfOfSides:(NSInteger)numberOfSidesWithWidth:(CGFloat)width\
    \ {\n    if (self = [self init]) {\n        [self setNumberOfOfSides:numberOfSides\
    \ andWidth:width];\n    }\n    return self;\n}\n\n-(void)setNumberOfOfSides:(NSInteger)numberOfSides\
    \ {\n    _numberOfOfSides = numberOfSides;\n    [self updateImage];\n}\n\n-(void)setSideWidth:(CGFloat)sideWidth\
    \ {\n    _sideWidth = sideWidth;\n    [self updateImage];\n}\n\n-(void)setNumberOfOfSides:(NSInteger)numberOfSides\
    \ andWidth:(CGFloat)sideWidth {\n    _numberOfOfSides = numberOfSides;\n    _sideWidth\
    \ = sideWidth;\n    [self updateImage];\n}\n\n// Method that does some post-processing\
    \ once either of the properties has\n// ben updated.\n-(void)updateImage {\n \
    \   ...\n}\n\n@end\n```\n\nWhen properties are assigned to (using object .property\
    \ = value), the method setProperty is called. setter even if by @synthesize, can\
    \ be overridden, as it is in this case for numberOfSides and sideWidth. However,\
    \ if you set a property's iv directly (the property is is, object->property),\
    \ it doesn't call the getter or setter, allowing you to do things like multiple\
    \ property sets that only call update or bypass side-effects caused by the setter.\n\
    \n## Section 8.3: What are properties?\n\nHere is an example class which has a\
    \ couple of instance variables, without using properties:\n\n```\n@interface TestClass\
    \ : NSObject\nNSString *someString;\nint _someInt;\n@end\n\n-(NSString *)someString;\n\
    -(void)setSomeString:(NSString *)newString;\n\n-(int)someInt;\n-(void)setSomeInt:(int)newInt;\n\
    \n@end\n```\n\n```\n@implementation TestClass\n\n-(NSString *)someString {\n \
    \ return someString;\n}\n\n-(void)setSomeString:(NSString *)newString {\n  _someString\
    \ = newString;\n}\n\n-(int)someInt {\n  return _someInt;\n}\n\n-(void)setSomeInt:(int)newInt\
    \ {\n  _someInt = newInt;\n}\n\n@end\n```\n\nThis is quite a lot of boilerplate\
    \ code to create a simple instance variable. You have to create variable & accessor\
    \ methods which do nothing except set or return the instance variable. So with\
    \ Objective-C 2.0, Apple introduced properties, which auto-generate some or all\
    \ of the boilerplate code.\n\nHere is the above rewritten with properties:\n\n\
    ```\n@interface TestClass\n@property NSString *someString;\n@property int someInt;\n\
    \n@end\n```\n\n```\n@implementation testClass\n\nend\n```\n\nA property is an\
    \ instance variable with auto-generated getters and setters. For a property called\
    \ someString, the getter and setter are called someString and setSomeString: respectively.\
    \ The name of the instance variable is, by default, the name of the property prefixed\
    \ with an underscore (so the instance variable for someString is called `_someString`,\
    \ but this can be overridden with a `@synthesize` directive in the `@implementation`\
    \ section:\n\n```\n@synthesize someString=foo; // names the instance variable\
    \ \"foo\"\n@synthesize someString; // names it \"someString\"\n@synthesize someString=_someString;\n\
    // names it \"_someString\"; the default if\n// there is no @synthesize directive\n\
    ```\n\nProperties can be accessed by calling the getters and setters:\n\n```\n\
    [testObject setObject:@\"Foo\"];\nNSLog(\"@someInt is %d\", [testObject someInt]);\n\
    ```\n\nThey can also be accessed using dot notation:\n\n```\ntestObject.someString\
    \ = @\"Foo\";\nNSLog(\"@someInt is %d\", testObject.someInt);\n```\n\n## Chapter\
    \ 9: Random Integer\n\n### Section 9.1: Basic Random Integer\n\nThe arc4random_uniform()\
    \ function is the simplest way to get high-quality random integers. As per the\
    \ manual:\n\n```\narc4random_uniform(upper_bound) will return a uniformly distributed\
    \ random number less than\nupper_bound.\n\narc4random_uniform() is recommended\
    \ over constructions like \"arc4random() % upper_bound\" as it\navoids \"modulo\
    \ bias\" when the upper bound is not a power of two.\n```\n\n```\nuint32_t randomInteger\
    \ = arc4random_uniform(5); // A random integer between 0 and 4\n```\n\n## Section\
    \ 9.2: Random Integer within a Range\n\nThe following code demonstrates usage\
    \ of arc4random_uniform() to generate a random integer between 3 and 12:\n\n```\n\
    uint32_t randomIntegerWithinRange = arc4random_uniform(10) + 3; // A random integer\
    \ between 3 and\n12\n```\n\nThis works to create a random range because arc4random_uniform(10)\
    \ returns an integer between 0 and 9. Adding 3 to\nthis random integer produces\
    \ a range between 0 + 3 and 9 + 3.\n\n## Chapter 10: BOOL / bool / Boolean / NSCFFBoolean\n\
    \n### Section 10.1: BOOL/Boolean/bool/NSCFBoolean\n\n1. BOOL is a datatype defined\
    \ in C99.\n2. Boolean values are used in conditionals, as if or while statements,\
    \ to conditionally perform logic or repeat execution. When evaluating a conditional\
    \ statement, the value O is considered \"false\", while any other value is considered\
    \ \"true\". Because NULL and nil are defined as 0, conditional statements on these\
    \ nonexistent values are also evaluated as \"false\".\n3. BOOL is a datatype defined\
    \ in C99.\n4. Boolean values are used in conditionals, as if or while statements,\
    \ to conditionally perform logic or repeat execution. When evaluating a conditional\
    \ statement, the value O is considered \"false\", while any other value is considered\
    \ \"true\". Because NULL and nil are defined as 0, conditional statements on these\
    \ nonexistent values are also evaluated as \"false\".\n\n## Chapter 11: Continue\
    \ and Break\n\n### Section 11.1: Continue and Break Statement\n\nThe continue\
    \ statement in Objective-C works somewhat like the break statement. Instead of\
    \ forcing termination, however, continue forces the next iteration of the loop,\
    \ skipping any code between.\n\nFor the loop, continue causes the conditional\
    \ test and increment portions of the loop to execute.\n\n```\n#import <Foundation.h>\n\
    int main () {\n  /* local variable definition */\n  int a = 10;\n\n  /* do loop\
    \ execution */\n  do {\n    if (a == 15) {\n      /* skip the iteration */\n \
    \     a = a + 1;\n      continue;\n    }\n    NSLog(\"value of a: %d\\n\", a);\n\
    \    a++;\n  }while (a < 20);\n\n  return 0;\n}\n```\n\nOutput:\n\n```\n2013-09-07\
    \ 22:20:35.647 demo value of a: 10\n2013-09-07 22:20:35.647 demo value of a: 11\n\
    2013-09-07 22:20:35.647 demo value of a: 12\n2013-09-07 22:20:35.647 demo value\
    \ of a: 13\n2013-09-07 22:20:35.647 demo value of a: 14\n2013-09-07 22:20:35.647\
    \ demo value of a: 16\n2013-09-07 22:20:35.647 demo value of a: 17\n2013-09-07\
    \ 22:20:35.647 demo value of a: 18\n2013-09-07 22:20:35.647 demo value of a: 19\n\
    ```\n"
  mdcn: "\n\n这可以用于提供，例如，懒性初始化（通过重写 getter，在尚未设置值时设置初始值）：\n\n```\n- (NSString *)someString\
    \ {\n if (_someString == nil) {\n  _someString = [self getInitialValueForSomeString];\n\
    \ }\n  return someString;\n}\n```\n\n你也可以定义一个在 getter 中计算其取值的属性：\n\n```\n@interface\
    \ Circle : NSObject\n\n@property CGPoint origin;\n@property CGFloat radius;\n\
    @property (readonly) CGFloat area;\n\n@end\n```\n\n```\n@implementation Circle\n\
    \n-(CGFloat)area {\n return M_PI * pow(self.radius, 2);\n}\n\n@end\n```\n\n##\
    \ 第 8.2 节：会导致更新的属性\n\n这个对象名为 Shape 有一个依赖于 `numberOfSides` 和 `width` 的属性。如果其中任何一个被设置，就必须重新计算图像。但重新计算可能很耗时，并且只有当两个属性都被设置时才需要执行一次，因此\
    \ Shape 提供了一种同时设置两个属性并只重新计算一次的方法。这是通过 Shape 反向绘制实现的。\n\n在 Shape.h 中\n\n```\n@interface\
    \ Shape {\nNSInteger numberOfSides;\nCGFloat width;\n\nUIImage *image;\n\n// 接收属性初始值的初始化器。\n\
    -(instype)initWithNumberOfSides:(NSInteger)numberOfSides initWithWidth:(CGFloat)width;\n\
    \n// 允许在一次调用中设置两个属性的方法。\n// 如果设置这些属性有昂贵的副作用，则这种方法非常有用。\n// 使用方法一次设置两个值可以让你拥有侧-\n\
    -(void)setNumberOfSides:(NSInteger)numberOfSides initWith:(CGFloat)width;\n\n\
    // 使用默认属性的属性。\n@property NSInteger numberOfSides;\n@property CGFloat width;\n\n\
    使用显式属性的属性。\n@property(strong, readonly) UIImage *image;\n@end\n```\n\n在 Shape.m\
    \ 中\n\n```\n@implementation Shape\n// 编译器自动生成的属性的变量名\n// 默认是属性名加上下划线前缀，例如\n//\
    \ \"_propertyName\"。你可以使用以下语句来更改此默认变量名：\n// @synthesize property = customVariableName;\n\
    \n-(id)initWithNumberOfOfSides:(NSInteger)numberOfSidesWithWidth:(CGFloat)width\
    \ {\n    if (self = [self init]) {\n        [self setNumberOfOfSides:numberOfSides\
    \ andWidth:width];\n    }\n    return self;\n}\n\n-(void)setNumberOfOfSides:(NSInteger)numberOfSides\
    \ {\n    _numberOfOfSides = numberOfSides;\n    [self updateImage];\n}\n\n-(void)setSideWidth:(CGFloat)sideWidth\
    \ {\n    _sideWidth = sideWidth;\n    [self updateImage];\n}\n\n-(void)setNumberOfOfSides:(NSInteger)numberOfSides\
    \ andWidth:(CGFloat)sideWidth {\n    _numberOfOfSides = numberOfSides;\n    _sideWidth\
    \ = sideWidth;\n    [self updateImage];\n}\n\n// 在任一属性更新后执行某些后处理的方法。\n-(void)updateImage\
    \ {\n    ...\n}\n\n@end\n```\n\n当给属性赋值时（使用 `object .property = value`）时，会调用 `setProperty`\
    \ 方法。即使是通过 `@synthesize` 生成的 setter 也可以被重写，就像在本例中 `numberOfSides` 和 `sideWidth`\
    \ 所示。然而，如果你直接设置属性的 iv（形式为 `object->property`），则不会调用 getter 或 setter，允许你执行诸如多次属性设置但只调用一次\
    \ update，或绕过 setter 引起的副作用的操作。\n\n## 第 8.3 节：什么是属性？\n\n这是一个包含几个实例变量但没有使用属性的示例类：\n\
    \n```\n@interface TestClass : NSObject\nNSString *someString;\nint _someInt;\n\
    @end\n\n-(NSString *)someString;\n-(void)setSomeString:(NSString *)newString;\n\
    \n-(int)someInt;\n-(void)setSomeInt:(int)newInt;\n\n@end\n```\n\n```\n@implementation\
    \ TestClass\n\n-(NSString *)someString {\n  return someString;\n}\n\n-(void)setSomeString:(NSString\
    \ *)newString {\n  _someString = newString;\n}\n\n-(int)someInt {\n  return _someInt;\n\
    }\n\n-(void)setSomeInt:(int)newInt {\n  _someInt = newInt;\n}\n\n@end\n```\n\n\
    为了创建一个简单的实例变量需要大量的样板代码。你必须创建变量和访问器方法，这些方法除了设置或返回实例变量外无所事。因此，在 Objective-C 2.0\
    \ 中，Apple 引入了属性，它会自动生成部分或全部样板代码。\n\n以下是使用属性重写的上述代码：\n\n```\n@interface TestClass\n\
    @property NSString *someString;\n@property int someInt;\n\n@end\n```\n\n```\n\
    @implementation testClass\n\nend\n```\n\n属性是一个带有自动生成的 getter 和 setter 的实例变量。对于一个名为\
    \ `someString` 的属性，getter 和 setter 分别是 `someString` 和 `setSomeString`。实例变量的默认是属性名加上下划线前缀（因此\
    \ `someString` 的实例变量名为 `_someString`，但可以在 `@implementation` 部分通过 `@synthesize`\
    \ 指令来重写它）：\n\n```\n@synthesize someString=foo; // 将实例变量命名为 \"foo\"\n@synthesize\
    \ someString; // 将其命名为 \"someString\"\n@synthesize someString=_someString;\n//\
    \ 将其命名为 \"_someString\"; 这是如果没有\n// @synthesize 指令时的默认\n```\n\n可以通过调用 getter 和\
    \ setter 来访问属性：\n\n```\n[testObject setObject:@\"Foo\"];\nNSLog(\"@someInt is\
    \ %d\", [testObject someInt]);\n```\n\n它们也可以使用点符号符号访问：\n\n```\ntestObject.someString\
    \ = @\"Foo\";\nNSLog(\"@someInt is %d\", testObject.someInt);\n```\n\n## 第 9 章：随机整数\n\
    \n### 第 9.1 节：基础随机整数\n\n`arc4random_uniform()` 函数是获取高质量随机整数的最简单方法。根据手册：\n\n```\n\
    arc4random_uniform(upper_bound) 将返回一个小于\nupper_bound 的均匀分布随机数。\n\n相比于 \"arc4random()\
    \ % upper_bound\" 等构造，推荐使用 arc4random_uniform()，因为它在上限不是 2 的幂时可以避免“取模运算偏差”。\n\
    ```\n\n```\nuint32_t randomInteger = arc4random_uniform(5); // 一个 0 到 4 之间的随机整数\n\
    ```\n\n## 第 9.2 节：范围内的随机整数\n\n以下代码演示了如何使用 `arc4random_uniform()` 生成一个 3 到 12 之间的随机整数：\n\
    \n```\nuint32_t randomIntegerInRange = arc4random_uniform(10) + 3; // 一个 3 到 12\
    \ 之间的\n```\n\n这工作可以创建一个随机范围，因为 `arc4random_uniform(10)` 返回 0 到 9 之间的整数，加上 3 得到\
    \ 3 到 12。\n\n## 第 10 章：BOOL / bool / NSBoolean\n\n### 第 10.1 节：BOOL/bool/NSBoolean\n\
    \n1. BOOL 是 C99 中的数据类型。\n2. Boolean 用于 `if` 或 `while` 语句来执行条件逻辑或循环。在评估条件语句时，值为\
    \ O 为 \"false\"，其他值为 \"true\"。\n3. nil 被定义为 0。\n\n## 第 11 章：Continue 和 Break\n\
    \n### 第 11.1 节：Continue 和 Break 语句\n\nObjective-C 中的 `continue` 语句与与 `break` 语句类似。然而，它不是强制终止，而是强制进入下一次迭代，跳过之间的代码。\n\
    \n对于循环，continue 会导致条件测试和增加部分执行。\n\n```\n#import <Foundation.h>\nint main () {\n\
    \  /* 本地变量定义 */\n  int a = 10;\n\n  /* do 循环 */\n  do {\n    if (a == 15) {\n\
    \      /* 跳过迭代 */\n      a = a + 1;\n      continue;\n    }\n    NSLog(\"value\
    \ of a: %d\\n\", a);\n    a++;\n  }while (a < 20);\n\n  return 0;\n}\n```\n\n\
    输出：\n\n```\n2013-09-07 22:20:35.647 value of a: 10\n2013-09-07 22:20:35.647 value\
    \ of a: 11\n2013-09-07 22:20:35.647 value of a: 12\n2013-09-07 22:20:35.647 value\
    \ of a: 13\n2013-09-07 22:20:35.647 value of a: 14\n2013-09-07 22:20:35.647 value\
    \ of a: 16\n2013-09-07 22:20:35.647 value of a: 17\n2013-09-07 22:20:35.647 value\
    \ of a: 18\n2013-09-07 22:20:35.647 value of a: 19\n```\n\n"
