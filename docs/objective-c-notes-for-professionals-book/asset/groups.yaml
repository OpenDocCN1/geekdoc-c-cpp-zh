  mdcn: "\n\n```objc\n@autoreleasepool {\n  NSString *string = [NSString stringWithWithString:@\"\
    We don't own this object\"];\n}\n```\n\n我们创建了一个字符串但没有获取所有权。`NSString stringWith:`\
    \ 必须确保该字符串在不再需要时被正确释放。在方法返回新创建的字符串之前，它会调用 `autorelease` 方法，这样它就不需要获取字符串的所有权。\n\
    \n以下是 `stringWith:` 的实现方式：\n\n```objc\n+ (NSString *)stringString:(NSString *)string\
    \ {\n  NSString *createdString = [[NSString alloc] initWithString:string];\n \
    \ [createdString autorelease];\n  return createdString;\n}\n```\n\n使用自动释放池（autorelease\
    \ pools）是必要的，因为有时你拥有一些并不自己的对象（第四条规则并不总是适用）。\n\n自动引用计数会自动处理这些规则，因此你不需要手动操作。\n\n\
    ## 章节 51.2：自动引用计数\n\n在自动引用计数（ARC）下，编译器会在需要时插入 `retain`、`release` 和 `autorelease`\
    \ 语句，你不需要自己编写它们。它还会为你编写 `dealloc` 方法。\n\n使用 ARC 后，来自《内存管理》的示例程序如下：\n\n```objc\n\
    @interface MyObject : NSObject {\n  NSString *property;\n}\n@end\n\n@implementation\
    \ MyObject\n@synthesize property = _property;\n\n-(id)initWithProperty:(NSString\
    \ *)property {\n  if (self = [super init]) {\n    _property = property;\n  }\n\
    \  return self;\n}\n\n-(NSString *)property {\n  return property;\n}\n\n-(void)setProperty:(NSString\
    \ *)property {\n  _property = property;\n}\n\n@end\n\nint main() {\n  MyObject\
    \ *obj = [[MyObject alloc] init];\n  NSString *value = [[NSString alloc] initWithString:@\"\
    value\"];\n  [obj setProperty:@value];\n}\n```\n\n你仍然可以使用 `dealloc` 方法来清理 ARC\
    \ 未处理的资源。与使用手动内存管理不同，你不需要调用 `[super dealloc]`。\n\n```objc\n(void)dealloc {\n \
    \ //clean up\n}\n```\n\n## 章节 51.3：强引用与弱引用\n\n版本 = 现代\n\n弱引用看起来像以下之一：\n\n```objc\n\
    @property (weak) NSString *property;\nNSString *_weak variable;\n```\n\n如果你对对象有一个弱引用，那么在底层：\n\
    \n- 它不会被保留（retaining）。\n- 当它被释放时，对它的每个引用都会被自动设置为 nil。\n\n对象引用默认总是强引用的。但你可以显式地指定它们是强引用：\n\
    \n```objc\n@property (strong) NSString *property;\nNSString *_strong variable;\n\
    ```\n\n强引用意味着只要该引用存在，你就在保留该对象。\n\n## 章节 51.4：手动内存管理\n\n这是一个使用手动内存管理编写的程序示例。你不应该这样写代码，由于某些原因你无法使用\
    \ ARC（如果你需要支持 32 位）。该示例避免了 `@property` 符号，以说明你必须如何编写 getter 和 setter。\n\n```objc\n\
    @interface MyObject : NSObject {\n  NSString *_property;\n}\n@end\n```\n\n```objc\n\
    @implementation MyObject\n@synthesize property = _property;\n\n-(id)initWithProperty:(NSString\
    \ *)property {\n  if (self = [super init]) {\n    // 获取 property 的引用以确保它不会消失。\n\
    \    // 该引用会在 dealloc 中释放。\n    _property = [property retain];\n  }\n  return\
    \ self;\n}\n```\n\n```objc\n- (NSString *)property {\n    return [[property retain\
    \ autorelease]];\n}\n```\n\n```objc\n- (void)setProperty:(NSString *)property\
    \ {\n    // 保留，然后释放。这样将其设置为相同的值不会丢失引用。\n    [property retain];\n    [_property\
    \ release];\n    _property = property;\n}\n```\n\n```objc\n- (void)dealloc {\n\
    \    [_property release];\n    [super dealloc]; // 别忘了！\n}\n```\n\n```objc\n@end\n\
    ```\n\n```objc\nint main() {\n    // 创建对象\n    // obj 是我们需要释放的引用\n    MyObject\
    \ *obj = [[MyObject alloc] init];\n    NSString *value = [[NSString alloc] initWithString:@\"\
    value\"];\n}\n```\n\n## 致谢\n\n非常感谢 Stack Overflow 文档所有帮助提供这些内容的成员。新内容的发布或更新可以发送至\
