    ```\n\n```objc\nNSortDescriptor *lastNameSortDescriptor = [NSortDescriptor sortDescriptorWithKey:\"\
    lastName\"\n    ascending:YES\n    selector:@selector:(localizedStandardCompare)];\n\
    ```\n\n```objc\nNSortDescriptor *ageSortDescriptor = [NSortDescriptor sortDescriptorWithKey:\"\
    age\"\n    ascending:NO];\n```\n\n```objc\nNSLog(\"By first name: %@\", [aryPerson\
    \ sortedArrayUsingDescriptors:@[firstNameSortDescriptor]]);\n// \"Alice Smith\"\
    , \"Bob Jones\", \"Charlie Smith\", \"Quentin Alberts\"\n```\n\n```objc\nNSLog(\"\
    By last name, first name: %@\", [aryPerson sortedArrayUsingDescriptors:@[lastNameSortDescriptor,\
    \ firstNameSortDescriptor]]);\n// \"Quentin Alberts\", \"Bob Jones\", \"Alice\
    \ Smith\", \"Charlie Smith\"\n```\n\n## 第 30 章：NSTextAttachment\n\n### 第 30.1节：NSTextAttachment\
    \ 示例\n\n```objc\nNSTextAttachment *attachment = [[NSTextAttachment alloc] init];\n\
    attachment.image = [UIImage imageNamed:@\"image\"];\nattachment.bounds = CGRect(0,\
    \ 0, 35, 35);\nNSAttributedString *attributedString = [NSAttributedString attributedStringWithAttachment:attachment];\n\
    ```\n\n## 第 31 章：NSCache\n\n### 第 31.1节：NSCache\n\n你使用它的与使用 NSMutableDictionary\
    \ 相同。区别在于，当 NSCache 检测到过大的内存压力（即缓存了过多值）时，它会释放某些值以腾出空间。\n\n如果你可以在运行时重新创建这些值（通过从互联网下载、通过计算等），那么\
