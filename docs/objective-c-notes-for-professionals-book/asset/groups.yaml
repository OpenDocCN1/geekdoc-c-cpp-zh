    # # Chapter 10: BOOL / bool / Boolean / NCFFBoolean


    # ## Section 10.1: BOOL/Boolean/bool/NSCFBoolean


    +   1. BOOL is a datatype defined in C99.

    2. Boolean values are used in conditionals, as if or while statements, to conditionally
    perform logic or repeat execution. When evaluating a conditional statement, the
    value O is considered "false", while any other value is considered "true". Because
    NULL and nil are defined as 0, conditional statements on these nonexistent values
    are also evaluated as "false".

    3. BOOL is an Objective-C type signed with the markers YES and NO to return true
    and false


    From the definition obj.c:


    ```

    #if (TARGET_OS_IPHONE && __LP64__) || TARGET_OS_WATCH

    ttypedef bool BOOL;

    else

    typef signed char BOOL;

    // BOOL is explicitly signed so @encode(BOOL) == "c" rather than "C"

    // even if -signed-char is used.

    #endif

    ```


    ```

    #define YES ((BOOL)1)

    #define NO ((BOOL)0)

    ```


    +   4. NSCBoolean is a private class in the NSString class cluster. It is a bridge
    to the CFBooleanRef type, which is used to wrap boolean values for Core Foundation
    property lists and collections. CFBoolean defines the constants CFBooleanTrue
    and CFBooleanFalse. Because CFNumberRef and CFBooleanRef are different types in
    Core Foundation, it makes sense that they are represented by different bridging
    classes in NSNumber.


    # ## Section 10.2: BOOL VS Boolean


    BOOL


    +   * Apple''s Objective-C frameworks and most Objective-C/Cocoa code uses BOOL.

    * Use BOOL in objective-c, when dealing with CoreFoundation APIs


    Boolean


    +   * Boolean is an old Carbon keyword, defined as an unsigned char'
  - "[PAGE 34]\n\n# # Chapter 11: Continue and Break!\n\n# ## Section 11.1: Continue\
    \ and Break Statement\n\nThe continue statement in Objective-C programming language\
    \ works somewhat like the break statement. Instead of forcing termination, however,\
    \ continue forces the next iteration of the loop to take place, skipping any code\
    \ in between.\n\nFor the loop, continue statement causes the conditional test\
    \ and increment portions of the loop to execute. For the while and do-while loops,\
    \ continue statement causes the program control pass to the conditional tests.\n\
    \n```\n#import <Foundation.h>\nint main () {\n  /* local variable definition */\n\
    \  int a = 10;\n\n  /* do loop execution */\n  do {\n    if (a == 15) {\n    \
    \  /* skip the iteration */\n      a = a + 1;\n      continue;\n    }\n    NSLog(\"\
    value of a: %d\\n\", a);\n    a++;\n  }while (a < 20);\n\n  return 0;\n}\n```\n\
    \nOutput:\n\n```\n2013-09-07 22:20:35.647 demo[2998] value of a: 10\n2013-09-07\
    \ 22:20:35.647 demo[2998] value of a: 11\n2013-09-07 22:20:35.647 demo[2998] value\
    \ of a: 12\n2013-09-07 22:20:35.647 demo[2998] value of a: 13\n2013-09-07 22:20:35.647\
    \ demo[2998] value of a: 14\n2013-09-07 22:20:35.647 demo[2998] value of a: 16\n\
    2013-09-07 22:20:35.647 demo[2998] value of a: 17\n2013-09-07 22:20:35.647 demo[2998]\
    \ value of a: 18\n2013-09-07 22:20:35.647 demo[2998] value of a: 19\n```\n\nRefer\
    \ to this link for more information."
- md: "\n# Chapter 12: Key Value Coding / Key Value Observing\n\n## Section 12.1:\
    \ Most Common Real Life Key Value Coding Example\n\nKey Value Coding is integrated\
    \ into NSObject using NSKeyValueCoding protocol.\n\nWhat this means?\n\nIt means\
    \ that any id object is capable of calling forKey method and its various variants\
    \ like forKeyPath etc.\n\nIt also means that any id object can invoke setValue\
    \ method and its various variants too.\n\nExample:\n\n```objc\nid obj = [[Class\
    \ alloc] init];\nid value = [obj forKey:@\"myNumber\"];\n\nint myNumberAsInt =\
    \ [value intValue];\n[obj setValue:@myNumberAsInt] forKey:@\"myNumber\"];\n```\n\
    \nExceptions:\n\nAbove example assumes that MyClass has an NSNumber called myNumber.\
    \ If myNumber does not appear in MyClass interface definition, an NSUndefinedException\
    \ can be raised at possibly lines 2 and 5 - popularly known as:\n\n> this class\
    \ is not key value coding-compliant for the keyNumber.\n\nWhy is this so powerful?\n\
    \nYou can write code that accesses properties of a class dynamically, without\
    \ needing interface for that class. This means a table view can display values\
    \ from any properties of an NSObject derived object, with its property names supplied\
    \ dynamically at runtime.\n\nIn the example above, the code can well work without\
    \ MyClass being available and id type obj being available to calling code.\n\n\
    ## Section 12.2: Querying KVC Data\n\n```objc\nif ([[dataObject valueForKey:@\"\
    yourVariable\"] isEqualToString:@\"Hello World\"]) {\n  return YES;\n} else {\n\
    \  return NO;\n}\n```\n\nYou can query values stored using KVC quickly and easily,\
    \ without needing to retrieve or cast them as local variables.\n\n## Section 12.3:\
    \ Collection Operators\n\nCollection Operators can be used in a KVC path to perform\
    \ an operation on a \"collection-type\" (i.e. NSArray, NSSet and similar). For\
    \ example, a common operation to perform is to count the objects in a collection.\
    \ To achieve this, you use the @count collection operator:\n\n```objc\nself.array\
    \ @count = @[@5, @4, @3, @1;\nNSNumber count = [self.array valueForKeyPath:@\"\
    @count\"];\nNSNumber countAlt = [self valueForKeyPath:@\"array.@count\"];\n//\
    \ count = countAlt = 5\n```\n\nWhile this is completely redundant (where you just\
    \ accessed the collection property), it can be useful on occasion, though it is\
    \ rarely necessary. There are, some collection operators that are much more useful,\
    \ namely @min, @sum, @avg and the @unionOf family. It is important to note that\
    \ these operators also require a separate path following the operator. Here is\
    \ a list of the type of data they work with:\n\n| Operator | Data Type |\n| ---\
    \ | --- |\n| @max | NSNumber, NSDate, int (and related), etc. |\n| @min | NSNumber,\
    \ NSDate, int (and related), etc. |\n| @sum | NSNumber, int (and related), double\
    \ (and related), etc. |\n| @avg | NSNumber, int (and related), double (and related),\
    \ etc. |\n| @unionOfObjects | NSArray, NSSet, etc. |\n| @distinctUnionOfObjects\
    \ | NSArray, NSSet, etc. |\n| @unionOfArrays | NSArray<NSArray*> |\n| @distinctUnionOfArrays\
    \ | NSArray<NSArray*> |\n| @distinctUnionOfSets | NSSet<NSSet*> |\n\n@max and\
    \ @min will return the highest or lowest value, respectively, of a property of\
    \ objects in the collection. example, look at the following code:\n\n```objc\n\
    // \"Point class used in our collection\n@interface NSObject\n\n@property NSInteger\
    \ x, y;\n\n+ (instancetype)pointWithX:(NSInteger)x y:(NSInteger);\n\n@end\n\n\
    self.points = @[[Point pointWithX:0 y:0],\n[Point pointWithX:1 y:-1],\n[Point\
    \ pointWithX:5 y:-6],\n[Point pointWithX:3 y:0],\n[Point pointWithX:8 y:-4]];\n\
    ```\n\n```objc\nNSNumber maxX = [self valueForKeyPath:@\"@points.max.x\"];\nNSNumber\
    \ minX = [self valueForKeyPath:@\"@points.min.x\"];\nNSNumber maxY = [self valueForKeyPath:@\"\
    @points.max.y\"];\nNSNumber minY = [self valueForKeyPath:@\"@points.min.y\"];\n\
    ```\n\n```objc\nNSArray<NSNumber*> *boundsOfAllPoints = @[minX, maxX, maxY];\n\
    ```\n\nIn just 4 lines of code and Pure Function, with the power of Key-Value\
    \ Coding collection operators we were able to extract a rectangle that encapsulates\
    \ all of the points in our array.\n\nIt is important to note that these comparisons\
    \ are made by using the compare: method on the objects, so if you ever want to\
    \ make your class compatible with these operators, you must implement this method.\n\
    \n@sum will, you can probably guess, add up all the values of a property.\n\n\
    ```objc\n@interface Expense : NSObject\n@property NSNumber *price;\n\n+ (instancetype)expenseWithPrice:(NSNumber*)price;\n\
    @end\n```\n\n```objc\nself.expenses = @[[Expense expenseWithPrice:@1.50],\n[Expense\
    \ expenseWithPrice:@9.99],\n[Expense expenseWithPrice:@2.78],\n[Expense expenseWithPrice:@9.99],\n\
    [Expense expenseWithPrice:@24.95]];\n```\n\nHere, we used @sum to find the total\
    \ price of all the expenses in the array. If we wanted to find the average price\
    \ we're paying for each expense, we can use @avg:\n\nFinally, there is the unionOf\
    \ family. There are five different operators in this family, but they all work\
    \ mostly the same, with only small differences between each. First, the unionOfObjects\
    \ which will return an array of properties of objects in an array:\n\n```objc\n\
    // See \"expenses\" array above\nNSArray<NSNumber *>allPrices = [self valueForKeyKeyPath:@\"\
    expenses.unionOfObjects.price\"];\n// Equal to @[@1.50,@9.99, @2.78, @24.95];\n\
    ```\n\n```objc\n@distinctUnionOfObjects functions the same as @unionOfObjects,\
    \ but it removes duplicates:\nNSArray<NSNumber *>differentPrices = [self valueForKeyKeyPath:@\"\
    distinctUnionOfObjects.price\"];\n// Equal to @[@1.50,@9.99, @2.78, @24.95];\n\
    ```\n\nAnd finally, the last 3 operators in the @unionOf family will go one step\
    \ deeper and return an array of values found for a property contained inside nested-arrays:\n\
    \n```objc\nNSArray<NSArray<Expense*, Expense***>*> arrayOfArrays =\n@[[Expense\
    \ expenseWith:@19.99],\n    [Expense expenseWith:@14.95],\n    [Expense expenseWith:@8.50],\n\
    \    [Expense expenseWith:@19.99]],\n\n    @[Expense expenseWith:@3.75],\n   \
    \ [Expense expenseWith:@14.95]]];\n```\n\n```objc\n// unionOfArrays* allPrices\
    \ = [arrayOfArrays valueForKeyPath:\n\"@unionOfArrays.price\"];\n// Equal to @[@19.99,\
    \ @14.95, @19.99, @3.75, @14.95 ];\n\n// distinctUnionOfArrays\nNSArray<NSNumber*>\
    \ allPrices = [arrayOfArrays valueForKeyPath:\n\"@distinctUnionOfArrays.price\"\
    ];\n// Equal to @[@19.99, @14.95, @3.75 ];\n```\n\nThe one thing from this example\
    \ is @distinctUnionOfSets, however this functions exactly the same as @distinctUnionOfArrays,\
    \ but it returns NSSet (there is no non-distinct version because a set, every\
    \ object must be distinct).\n\nAnd that's it! Collection operators can be really\
    \ powerful if used correctly, and can help avoid having to loop through stuff\
    \ unnecessarily.\n\nOne last note: you can also use the collection operators on\
    \ arrays of NSNumbers (without additional property access). To do this, you can\
    \ use the self-property that returns the object:\n\n```objc\nNSArray<NSNumber*>\
    \ *numbers = [@0, @1, @5, @27, @1337, @2048];\n\nNSNumber *largest = [numbers\
    \ valueForKeyPath:@\"@max.self\"];\nNSNumber *smallest = [numbers valueForKeyPath:@\"\
    @min.self\"];\nNSNumber *total = [numbers valueForKeyPath:@\"@sum.self\"];\nNSNumber\
    \ *average = [numbers valueForKeyPath:@\"@avg.self\"];\n```\n\n## Section 12.4:\
    \ Key Value Observing\n\nSetting up key value observing\n\nIn this case, we want\
    \ to observe the contentOffset on an object instead of our owner\n\n```objc\n\
    // Class to observe\n//\n@interface XYZScrollView :NSObject\n@property (nonatomic,\
    \ assign) CGPoint contentOffset;\n@end\n\n@implementation XYZScrollView\n@end\n\
    ```\n\n```objc\n// Class that will observe changes\n@interface XYZObserver : NSObject\n\
    @property (nonatomic, strong) XYZScrollView *scrollView;\n@end\n\n@implementation\
    \ XYZObserver\n\n// simple way to create a KVOObserver context\nstatic void *XYZObserverContext\
    \ = &XYZObserverContext;\n\n// Helper method to add self as an observer to\n//\
    \ the scrollView's contentOffset property\n(void)addObserver {\nNSString *keyPath\
    \ = NSStringFromSelector(@selector(contentOffset));\nNSKeyValueObservingOptions\
    \ options = NSKeyValueObservingNew;\n[self.scrollView observe:self\n         \
    \      forKeyPath:keyPath\n                 options:options\n                \
    \ context:XYZObserverContext];\n}\n\n(void)observeForKeyPath:(NSString *)keyPath\
    \ setObject:(id)object\nchange:(Dictionary<NSString,id>*)change:(void *)context\
    \ {\n  if (context == XYZObserverContext) {\n    // check the keyPath to see if\
    \ it's any of the desired keyPath's\n    // You can observe multiple keyPath's\n\
    \    if ([keyPath isEqualToString:NSStringFromSelector(@selector(contentOffset))])\
    \ {\n      // the change dictionary here for a CGPoint observation\n      // return\
    \ an NSPoint, so we can take the CGPointValue of it.\n      CGPoint point = [change[NSKeyValueChangeNew]\
    \ CGPointValue];\n      // handle point\n    }\n  } else {\n    // if the context\
    \ doesn't match our current object's context\n    // we want to pass the observation\
    \ parameters to super\n    [super observeForKeyPath:keyPath setObject:object change:change\
    \ context:context];\n  }\n}\n\n@end\n```\n"
  mdcn: "\n\n# 第 12 章：键值编码 (KVC) / 键值观测 (KVO)\n\n## 第 12.1 节：常见的现实键值编码示例\n\n键值编码通过\
    \ `NSKeyValueCoding` 协议集成到 `NSObject` 中。\n\n这意味着什么？\n\n这意味着任何 `id` 对象都可以调用 `forKey`\
    \ 方法及其各种变体（如 `forKeyPath` 等）。\n\n这意味着任何 `id` 对象都可以调用 `setValue` 方法及其各种变体。\n\n\
    示例：\n\n```objc\nid obj = [[Class alloc] init];\nid value = [obj forKey:@\"myNumber\"\
    ];\n\nint myNumberAsInt = [value intValue];\n[obj setValue:@myNumberAsInt] forKey:@\"\
    myNumber\"];\n```\n\n异常：\n\n上面的示例假设 `MyClass` 有一个名为 `myNumber` 的 `NSNumber`。如果\
    \ `myNumber` 没有出现在 `MyClass` 的接口定义，可能会在第 2 行和第 5 行抛出 `NSUndefinedException` 异常：\n\
    \n> this class is not key value coding-compliant for the keyNumber.（该类不支持 keyNumber\
    \ 的键值编码。）\n\n为什么它如此强大？\n\n你可以编写代码动态访问类的属性，而无需该类的具体接口。这意味着表格视图（table view）可以显示任何\
    \ `NSObject` 派生对象的任何属性的值，其属性名称在运行时动态提供。\n\n在上面的示例中，即使 `MyClass` 不可用且调用代码无法获取 `id`\
    \ 类型对象 `obj`，代码也可以正常工作。\n\n## 第 12.2 节：查询 KVC 数据\n\n```objc\nif ([[dataObject\
    \ valueForKey:@\"yourVariable\"] isEqualToString:@\"Hello World\"]) {\n  return\
    \ YES;\n} else {\n  return NO;\n}\n```\n\n你可以快速方便地查询使用 KVC 存储的值，而无需将它们检索或强制类型转换为局部变量。\n\
    \n## 第 12.3 节：集合操作符\n\n集合操作符可以在 KVC 路径中使用，用于对“集合类型”（例如 `NSArray`、`NSSet` 及类似类型）执行操作。例如，一种常见的操作是统计集合中对象的数量。为了实现这一点，你使用\
    \ `@count` 集合操作符：\n\n```objc\nself.array @count = @[@5, @4, @3, @1;\nNSNumber\
    \ count = [self.array valueForKeyPath:@\"@count\"];\nNSNumber countAlt = [self\
    \ valueForKeyPath:@\"array.@count\"];\n// count = countAlt = 5\n```\n\n虽然这完全是多余的（你只是访问了集合属性），但有时可能很有用，尽管很少需要。有些集合操作符要有用得多，即\
    \ `@min`、`@sum`、`@avg` 和 `@unionOf` 族。需要注意的是，这些操作符还需要在操作符后面跟随一个独立的路径。以下是它们处理的数据类型列表：\n\
    \n| 操作符 | 数据类型 |\n| --- | --- |\n| @max | NSNumber, NSDate, int (以及相关的), 等. |\n\
    | @min | NSNumber, NSDate, int (以及相关的), 等. |\n| @sum | NSNumber, int (以及相关的),\
    \ double (以及相关的), 等. |\n| @avg | NSNumber, int (以及相关的), double (以及相关的), 等. |\n\
    | @unionOfObjects | NSArray, NSSet, 等. |\n| @distinctUnionOfObjects | NSArray,\
    \ NSSet, 等. |\n| @unionOfArrays | NSArray<NSArray*> |\n| @distinctUnionOfArrays\
    \ | NSArray<NSArray*> |\n| @distinctUnionOfSets | NSSet<NSSet*> |\n\n`@max` 和\
    \ `@min` 分别返回集合对象属性的最高或最低值。例如，看以下代码：\n\n```objc\n// 集合中使用的 Point 类\n@interface\
    \ NSObject\n\n@property NSInteger x, y;\n\n+ (instancetype)pointWithX:(NSInteger)x\
    \ y:(NSInteger);\n\n@end\n\nself.points = @[[Point pointWithX:0 y:0],\n[Point\
    \ pointWithX:1 y:-1],\n[Point pointWithX:5 y:-6],\n[Point pointWithX:3 y:0],\n\
    [Point pointWithX:8 y:-4]];\n```\n\n```objc\nNSNumber maxX = [self valueForKeyPath:@\"\
    @points.max.x\"];\nNSNumber minX = [self valueForKeyPath:@\"@points.min.x\"];\n\
    NSNumber maxY = [self valueForKeyPath:@\"@points.max.y\"];\nNSNumber minY = [self\
    \ valueForKeyPath:@\"@points.min.y\"];\n```\n\n```objc\nNSArray<NSNumber*> *boundsOfAllPoints\
    \ = @[minX, maxX, maxY];\n```\n\n仅需 4 行代码和纯函数，凭借键值编码集合操作符的力量，我们能够提取出一个封装了数组中所有点的矩形。\n\
    \n重要注意的是，这些比较是通过调用对象的 `compare:` 方法完成的，因此如果你想让你的类与这些操作符兼容，就必须实现该方法。\n\n`@sum`\
    \ 你可能猜到，它会累加某个属性的所有值。\n\n```objc\n@interface Expense : NSObject\n@property NSNumber\
    \ *price;\n\n+ (instancetype)expenseWithPrice:(NSNumber*)price;\n@end\n```\n\n\
    ```objc\nself.expenses = @[[Expense expenseWithPrice:@1.50],\n[Expense expenseWithPrice:@9.99],\n\
    [Expense expenseWithPrice:@2.78],\n[Expense expenseWithPrice:@9.99],\n[Expense\
    \ expenseWithPrice:@24.95]];\n```\n\n在这里，我们使用 `@sum` 来找到数组中所有开支的总价格。如果我们想找到每个开支的平均价格，可以使用\
    \ `@avg`：\n\n最后，是 `unionOf` 族。该族有五个不同的操作符，但它们的工作方式大体相同，之间仅有细微差异。首先是 `unionOfObjects`，它将返回数组中对象属性的数组：\n\
    \n```objc\n// 查看上面的 \"expenses\" 数组\nNSArray<NSNumber *>allPrices = [self valueForKeyKeyPath:@\"\
    expenses.unionOfObjects.price\"];\n// 等于 @[@1.50,@9.99, @2.78, @24.95];\n```\n\
    \n```objc\n@distinctUnionOfObjects 的功能与 @unionOfObjects 相同，但它会去重：\nNSArray<NSNumber\
    \ *>differentPrices = [self valueForKeyKeyPath:@\"distinctUnionOfObjects.price\"\
    ];\n// 等于 @[@1.50,@9.99, @2.78, @24.95];\n```\n\n最后，`@unionOf` 族中的最后 3 个操作符会更深一层，返回在嵌套数组中包含的属性的值数组：\n\
    \n```objc\nNSArray<NSArray<Expense*, Expense***>*> arrayOfArrays =\n@[[Expense\
    \ expenseWith:@19.99],\n    [Expense expenseWith:@14.95],\n    [Expense expenseWith:@8.50],\n\
    \    [Expense expenseWith:@19.99]],\n\n    @[Expense expenseWith:@3.75],\n   \
    \ [Expense expenseWith:@14.95]]];\n```\n\n```objc\n// unionOfArrays* allPrices\
    \ = [arrayOfArrays valueForKeyPath:\n\"@unionOfArrays.price\"];\n// 等于 @[@19.99,\
    \ @14.95, @19.99, @3.75, @14.95 ];\n\n// distinctUnionOfArrays\nNSArray<NSNumber*>\
    \ allPrices = [arrayOfArrays valueForKeyPath:\n\"@distinctUnionOfArrays.price\"\
    ];\n// 等于 @[@19.99, @14.95, @3.75 ];\n```\n\n这个示例中的唯一不同是 `@distinctUnionOfSets`，然而它的功能与\
    \ `@distinctUnionOfArrays` 完全相同，但它返回的是 `NSSet`（没有非去重版本，因为集合中的每个对象必须是唯一的）。\n\n\
    就这些！如果使用得当，集合操作符可以非常强大，并帮助避免不必要的循环。\n\n最后一点：你也可以在 `NSNumber` 数组上使用集合操作符。为了这样做，你可以使用返回对象的属性：\n\
    \n```objc\nNSArray<NSNumber*> *numbers = [@0, @1, @5, @27, @1337, @2048];\n\n\
    NSNumber *largest = [numbers valueForKeyPath:@\"@max.self\"];\nNSNumber *smallest\
    \ = [numbers valueForKeyPath:@\"@min.self\"];\nNSNumber *total = [numbers valueForKeyPath:@\"\
    @sum.self\"];\nNSNumber *average = [numbers valueForKeyPath:@\"@avg.self\"];\n\
    ```\n\n## 第 12.4 节：键值观测 (KVO)\n\n设置键值观测\n\n在这种情况下，我们要观测对象的 `contentOffset` 而不是所有者\n\
    \n```objc\n// 被观测的类\n@interface XYZScrollView :NSObject\n@property (nonatomic,\
    \ assign) CGPoint contentOffset;\n@end\n\n@implementation XYZScrollView\n@end\n\
    ```\n\n```objc\n// 观测变化的类\n@interface XYZObserver : NSObject\n@property (nonatomic,\
    \ strong) XYZScrollView *scrollView;\n@end\n\n@implementation XYZObserver\n\n\
    // 创建 KVO 上下文的简单方法\nstatic void *XYZObserverContext = &XYZObserverContext;\n\n\
    // 将自己作为观察者添加到\n// scrollView 的 contentOffset 属性\n(void)addObserver {\nNSString\
    \ *keyPath = NSStringFromSelector(@selector(contentOffset));\nNSKeyValueObservingOptions\
