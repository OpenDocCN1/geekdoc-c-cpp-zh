    \ function retrieves the message from the timer\n    NSLog(\"%@\", timer.userInfo[\"\
    Message\"]);\n}\n```\n\n### Section 27.2: Creating a Timer\n\nThis will create\
    \ a timer to call the doSomething method in self 5.0 seconds.\n\n```objc\n[NSTimer\
    \ scheduledWithTimeInterval:5.0\n    target:@self\n    selector:@selector(doSomething)\n\
    \    userInfo:nil\n    repeats:NO];\n```\n\nSetting the repeats parameter to false/NO\
    \ indicates that we want the timer to fire only once. If we set it true/YES, it\
    \ would fire every five seconds until manually invalidated.\n\n### Section 27.3:\
    \ Invalidating a timer\n\n```objc\n[timer invalidate];\ntimer = nil;\n```\n\n\
    This will stop the timer from firing. **Must be called from the thread the timer\
    \ was created in**, see Apple's notes:\n\n> You must send this message from the\
    \ thread on the timer was installed. If you send this message from another thread,\
    \ the input source associated with the timer may not be removed from its run loop,\
    \ which could prevent the thread from exiting properly.\n\nSetting **nil** will\
    \ help you check whether it's running or not.\n\n```objc\nif(timer) {\n    [timer\
    \ invalidate];\n    timer = nil;\n}\n```\n\n```objc\n//Now set a timer again.\n\
    ```\n\n### Section 27.4: Manually firing a timer\n\n```objc\n[timer fire];\n```\n\
    \nCalling the timer method causes an NSTimer to perform the task it would usually\
    \ have performed on a schedule.\n\nIn a non-repeating timer, this will automatically\
    \ invalidate the timer. That is, calling fire before the time interval is up will\
    \ result in only one invocation.\n\nIn a repeating timer, this will simply invoke\
    \ the action without interrupting the usual schedule.\n\n## Chapter 28: NSObject\n\
