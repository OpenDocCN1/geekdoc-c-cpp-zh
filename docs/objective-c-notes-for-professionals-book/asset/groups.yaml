    # Chapter 13: NSString


    The NSString class is a part of Foundation framework to work with strings (series
    of characters). It also includes methods for comparing, searching and modifying
    strings.


    # Section 13.1: Encoding and Decoding


    ```

    // decode

    NSString *string = [[NSString alloc] initWithData:utf8Data

    encoding:NSUTF8StringEncoding];

    ```


    ```

    // encode

    NSData *utf8Data = [string dataUsingEncoding:NSUTF8StringEncoding];

    ```


    Some supported encodings are:


    +   - NSASCIIEncoding

    - NSUTF8StringEncoding

    - NSUTF16Encoding (== NSUnicodeEncoding)


    Note that utf8Data.bytes does not include a terminating null character, which
    is necessary for C strings. If you need a C string, use UTF8:


    ```

    const char *cstring = [string UTF8String];

    printf("%s", cstring);

    ```


    # Section 13.2: String Length


    NSString has a length property to get the number of characters.


    ```

    NSString *string = @"example";

    NSInteger length = string.length; // length equals 7

    ```


    As in the Splitting Example, keep in mind that NSString uses UTF-16 to represent
    characters. The length is actually the number of UTF-16 code units. This can differ
    from how the user perceives characters.


    Here are some cases that might be surprising:


    +   - "".length = 1 // LATIN LETTER E WITH ACCENT (U+00E9)

    - "".length = 2 // LATIN LETTER E (U+0065) + COMBINING ACUTE ACCENT (U+0301)

    - ""\ = 2 // HEAVY BLACK HEART (U+2764) + VARIATION SELECTOR-16 (U+FE0F)

    - "".length = 4 // REGIONAL INDICATOR SYMBOL L (U+1F1E1) + REGIONAL INDICATOR
    SYMBOL T (U+1F1F9)


    In order to get the number of user-perceived characters, known technically as
    grapheme clusters, you must iterate over the string with -enumerateSubstringsInRange:options:usingBlock:
    and keep a count. This is demonstrated in an answer by Nikolai Ruhe on Stack Overflow.


    # Section 13.3: Comparing Strings


    Strings are compared by using isEqualToString;

    The == operator tests for object identity and does not compare the logical values
    of objects, so it can be used:


