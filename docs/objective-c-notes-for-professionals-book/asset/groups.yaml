    # Section 14.8: Enumerating using blocks


    ```

    NSArray *myColors = @"Red", @"Green", @"Blue", @"Yellow\];

    [myColors enumerateUsingBlock:^(id obj, NSUInteger idx, BOOL *stop) {

    NSLog("enumerating object %@ at index %lu", obj, idx);

    }];

    ```


    By setting the stop parameter to YES you can indicate that further enumeration
    is not needed. to do this simply set

    &stop = YES.


    # EnumerationOptions


    You can enumerate the array in reverse and / or concurrently:


    ```

    [myColors enumerateObjectsWithOptions:NSEnumerationConcurrent | NSEnumerationReverse

    using:^(id obj, NSUInteger idx, BOOL *stop) {

    NSLog("enumerating object %@ at index %lu", obj, idx);

    }];

    ```


    # Enumerating subset of array


    ```

    NSIndexSet *indexSet = [NSIndexSet setWithIndicesInRange:NSMakeRange(1, 1)];

    [myColors enumerateObjectsAtIndexes:indexSet

    options:0

    using:^(id obj, NSUInteger idx, BOOL *stop) {

    NSLog("enumerating object %@ at index %lu", obj, idx);

    }];

    ```


    # Section 14.9: Comparing arrays


    Arrays can be compared for equality with the aptly named isEqualToArray method,
    which returns YES when both

    arrays have the same number of elements and every pair is isEqual: comparison.


    ```

    NSArray *generateMakes = @"Mercedes-Benz", @"BMW", @"Porsche",

    @"Opel", @"Volkswagen", @"Audi\];

    NSArray *generateMakes = [NSArray arrayWithObjects:@"Mercedes-Benz",n@"BMW", @"Opel",

    @"Volkswagen", @"Audi", nil];


    if ([generateMakes isEqualToArray:generateMakes]) {

    NSLog("Oh good, literal arrays are the same as NSArrays");

    }

    ```


    The important thing is every pair must be the isEqual: test. For custom objects
    this method should be

    implemented. It exists in the NSObject object.


    # Section 14.10: Comparing Arrays With Predicates


    ```

    NSArray *array = [NSArray arrayWithObjects:@"Nick", @"Ben", @"Adam", @"Melissa",
    nil];


    SPredicate *predicate = [SPredicate predicateWithFormat:"SELF contains[c] %a''];

    @beginWithA contains [array filteredUsingPredicate:predicate];

    // beginWithA contains @"Adam" }


    SPredicate *ePredicate = [SPredicate predicateWithFormat:"SELF contains[c] %e''];

    [array filteredUsingPredicate:predicate];

    // array now contains @"Ben", @"Melissa" }

    ```'
