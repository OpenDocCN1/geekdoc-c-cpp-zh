    # # Chapter 47: Modern Objective-C


    # ## Section 47.1: Literals


    Objective-C provides ways to reduce amount of code you need to initialize some
    common types. This new way is very similar to how NSString objects are initialized
    with constant strings.


    **NSNumber**


    Old way:


    ```

    NSNumber *number = [NSNumber numberWithInt:25];

    ```


    Modern way:


    ```

    NSNumber *number = @25;

    ```


    Note: you can also store BOOL values in NSNumber objects using @YES, @NO or (@someBoolValue);


    **NSArray**


    Old way:


    Modern way:


    ```

    NSArray *array = @[@"One", @"Two", @3, @"Four\];

    ```


    **NSDictionary**


    Old way:


    ```

    NSDictionary *dictionary = [NSDictionary dictionaryWithObjectsKeys:array, @"Object",
    [NSNumber floatValue:1.5], @"Value", @"Language", @"Objective-C", nil];

    ```


    Modern way:


    ```

    NSDictionary *dictionary = @{@"Object": array, @"Value": 1.5, @"Language": @"Objective-C"};

    ```


    # ## Section 47.2: Container subscribing


    In Objective-C syntax you can get values from NSArray and NSDictionary containers
    using subscribing.


    Old way:


    ```

    NSNumber *object1 = [array objectAtIndex:1];

    NSNumber *object2 = [dictionary objectForKey:@Value"];

    ```


    Modern way:'
  - '[PAGE 115]


    ```

    NSObject *object1 = array[@1];

    NSObject *object2 = dictionary[@"Value"];

    ```


    You can also insert objects into arrays and set objects for keys in dictionaries
    in a cleaner way.


    Old way:


    ```

    // replacing at specific index

    [mutableArray replaceObjectAtIndex:1 withObject:@"NewValue\];

    // adding a new value to the end

    [mutableArray addObject:@"NewValue"];

    ```


    ```

    [mutableDictionary setObject:@"NewValue" forKey:@"NewKey"];

    ```


    Modern way:


    ```

    mutableArray[1] = @"NewValue";

    mutableArray[[mutableArray count]] = @"NewValue";


    mutableDictionary[@"NewKey"] = @"NewValue";

    ```'
