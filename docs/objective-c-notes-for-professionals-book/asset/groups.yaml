  - "[PAGE 88]\n\n# Chapter 34: Low-level Runtime Environment\n\n# Section 34.1: Augmenting\
    \ methods using Method Swizzling\n\nThe Objective-C runtime allows you to change\
    \ the implementation of a method at runtime. This is called method swizzling and\
    \ is often used to exchange the implementations of two methods. For example, if\
    \ the methods foo and bar are exchanged, sending the message foo will now execute\
    \ the implementation of bar and vice versa.\n\nThis technique can be used to augment\
    \ or \"patch\" methods which you cannot edit directly, such as methods of system-provided\
    \ classes.\n\nIn the following example, the-[UserDefaults synchronize] method\
    \ is augmented to prevent the execution time of the original implementation.\n\
    \n**IMPORTANT**: Many people try to swizzle when you need to change the method\
    \ you're replacing, because you'll be calling it using a different selector than\
    \ it is expecting. As a result, you can break things in strange and unexpected\
    \ ways—particularly if multiple parties swizzle an object in this way. Instead,\
    \ you should always swizzle using setImplementation in conjunction with a C function,\
    \ allowing you to swizzle the method with the original selector.\n\n```\n#import\
    \ \"UserDefaults.h\"\n#import <objc/runtime.h> // Needed for method swizzling\n\
    \nstatic IMP old_synchronize = NULL;\n\nstatic void new_synchronize(id self, SEL\
    \ _cmd);\n\n@implementation NSUserDefaults(Timing)\n\n+(void)load {\n    Method\
    \ originalMethod = class_([self class], @selector(synchronize));\n    IMP swizzleImp\
    \ = [new_synchronize];\n    old_synchronize = method_setImplementation(originalMethod,\
    \ swizzleImp);\n}\n@end\n\nstatic void new_synchronize(id self, SEL _cmd) {\n\
    \    NSDate *started;\n    BOOL returnValue;\n\n    started = [NSDate date];\n\
    \n    // Call the original implementation, passing the same parameters\n    //\
    \ that this function was called with, including the selector.\n    returnValue\
    \ = old_synchronize(self, _cmd);\n\n    NSLog(\"@Writing user defaults took %f\
    \ seconds.\", [NSDate timeIntervalSinceDate:started]);\n\n    return returnValue;\n\
    }\n```"
