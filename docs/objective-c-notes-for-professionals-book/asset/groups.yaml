    \n# Chapter 13: NSString\n\nThe NSString class is a part of Foundation framework\
    \ to work with strings (series of characters). It also includes methods for comparing,\
    \ searching and modifying strings.\n\n## Section 13.1: Encoding and Decoding\n\
    \n```objc\n// decode\nNSString *string = [[NSString alloc] initWithData:utf8Data\n\
    encoding:NSUTF8StringEncoding];\n```\n\n```objc\n// encode\nNSData *utf8Data =\
    \ [string dataUsingEncoding:NSUTF8StringEncoding];\n```\n\nSome supported encodings\
    \ are:\n\n- NSASCIIEncoding\n- NSUTF8StringEncoding\n- NSUTF16Encoding (== NSUnicodeEncoding)\n\
    \nNote that utf8Data.bytes does not include a terminating null character, which\
    \ is necessary for C strings. If you need a C string, use UTF8:\n\n```objc\nconst\
    \ char *cstring = [string UTF8String];\nprintf(\"%s\", cstring);\n```\n\n## Section\
    \ 13.2: String Length\n\nNSString has a length property to get the number of characters.\n\
    \n```objc\nNSString *string = @\"example\";\nNSInteger length = string.length;\
    \ // length equals 7\n```\n\nAs in the Splitting Example, keep in mind that NSString\
    \ uses UTF-16 to represent characters. The length is actually the number of UTF-16\
    \ code units. This can differ from how the user perceives characters.\n\nHere\
    \ are some cases that might be surprising:\n\n- \"\".length = 1 // LATIN LETTER\
    \ E WITH ACCENT (U+00E9)\n- \"\".length = 2 // LATIN LETTER E (U+0065) + COMBINING\
    \ ACUTE ACCENT (U+0301)\n- \"\"❤️ = 2 // HEAVY BLACK HEART (U+2764) + VARIATION\
    \ SELECTOR-16 (U+FE0F)\n- \"\".length = 4 // REGIONAL INDICATOR SYMBOL L (U+1F1E1)\
    \ + REGIONAL INDICATOR SYMBOL T (U+1F1F9)\n\nIn order to get the number of user-perceived\
    \ characters, known technically as grapheme clusters, you must iterate over the\
    \ string with -enumerateSubstringsInRange:options:usingBlock: and keep a count.\
    \ This is demonstrated in an answer by Nikolai Ruhe on Stack Overflow.\n\n## Section\
    \ 13.3: Comparing Strings\n\nStrings are compared by using isEqualToString;\n\
    The == operator tests for object identity and does not compare the logical values\
    \ of objects, so it can be used:\n\n```objc\nNSString *stringOne = @\"example\"\
    ;\nNSString *stringTwo = [stringOne mutableCopy];\n```\n\n```objc\nBOOL stringsAreIdentical\
    \ = (stringOne == stringTwo); // NO\nBOOL stringsAreEqual = [stringOne isEqualToString:stringTwo];\
    \ // YES\n```\n\nThe expression (stringOne == stringTwo) tests to see if the memory\
    \ addresses of the two strings are the same, which is usually not what you want.\n\
    \nIf the string variables can be nil you have to take care about that as well:\n\
    \n```objc\nBOOL equalValues = stringOne == stringTwo || [stringOne isEqualToString:stringTwo];\n\
    ```\n\nThis condition returns YES when strings have equal value or both are nil.\n\
    \nTo order two strings alphabetically, use compare.\n\n```objc\nNSComparisonResult\
    \ result = [firstString compare:secondString];\n```\n\nNSComparisonResult can\
    \ be:\n\n- NSOrderedAscending: The first string comes before the second string.\n\
    - NSOrderedSame: The strings are equal.\n- NSOrderedDescending: The second string\
    \ comes before the first string.\n\nTo compare two strings equality, use isEqualToString:\n\
    \n```objc\nBOOL result = [firstString isEqualToString:secondString];\n```\n\n\
    ```objc\nBOOL result = string.length == 0;\n```\n\n## Section 13.4: Splitting\n\
    \nYou can split a string into an array of parts, divided by a separator character.\n\
    \n```objc\nNSString *yourString = @\"Stack,Exchange,Network\";\nArray *yourWords\
    \ = [yourString componentsSeparatedByString:@\",\"];\n// Output: @[@\"Stack\"\
    , @\"Exchange\", @\"Network\"]\n```\n\nIf you need to split on a set of several\
    \ different delimiters, use -NSString componentsSeparatedByCharactersIn:\n\n```objc\n\
    NSString *yourString = @\"Overflow+Documentation/Objective-C\";\nArray *yourWords\
    \ = [yourString componentsSeparatedByCharactersIn:\n[NSCharacterSet setWithCharactersInString:@\"\
    +//\"]];\n// Output: @[@\"Stack Overflow\", @\"Documentation\", @\"Objective-C\"\
    ]\n```\n\nIf you need to break a string into its individual characters, loop over\
    \ the length of the string and convert each character to a new string.\n\n```objc\n\
    NSMutableArray *characters = [[NSMutableArray alloc] initWithCapacity:[yourString\
    \ length]];\nfor (int i = 0; i < [yourString length]; i++) {\n    [characters\
    \ addObject:[NSString stringWithFormat:@\"%c\", [yourString characterAtIndex:i]]];\n\
    }\n```\n\nAs in the Length Example, keep in mind that \"character\" is a UTF-16\
    \ code unit, not necessarily the user sees as a character. If you use this loop\
    \ with `@@`, you'll see it's split into four pieces.\n\nIn order to get a list\
    \ of the user-perceived characters, use `-enumerateSubstringsInRange:options:usingBlock:`:\n\
    \n```objc\nNSMutableArray *characters = [NSMutableArray array];\n[yourString enumerateSubstringsInRange:0,\
    \ [yourString length]\noptions:NSStringEnumerationByComposedCharacterSequences\n\
    Block:^(NSString *string, NSRRange r, NSRRange s, BOOL *b) {\n    [characters\
    \ addObject:string];\n}];\n```\n\nThis preserves grapheme clusters like the Italian\
    \ flag as a single substring.\n\n## Section 13.5: Searching for a Substring\n\n\
    To search if a String contains a substring, do the following:\n\n```objc\nNSString\
    \ *myString = @\"This is for checking substrings\";\nNSString *subString = @\"\
    checking\";\n```\n\n```objc\nBOOL doesContainsSubstring = [myString containsSubstring:subString];\
    \ // YES\n```\n\nIf targeting iOS 7 or OS X 10.9 (or earlier):\n\n```objc\nBOOL\
    \ doesContainsSubstring = ([myString rangeOfSubstring:subString].location != NSNotFound);\
    \ // YES\n```\n\n## Section 13.6: Creation\n\nSimple:\n\n```objc\nNSString *newString\
    \ = @\"My String\";\n```\n\nFrom multiple strings:\n\n```objc\nNSString *stringOne\
    \ = @\"Hello\";\nNSString *stringTwo = @\"world\";\nNSString *newString = [NSString\
    \ stringWithFormat:@\"My message: %@ %\\n\", stringOne, stringTwo];\n```\n\nUsing\
    \ Mutable String\n\n```objc\nNSString *stringOne = @\"Hello\";\nNSString *stringTwo\
    \ = @\"World\";\nNSMutableString *mutableString = [NSMutableString new];\n[mutableString\
    \ appendString:stringOne];\n[mutableString appendString:stringTwo];\n```\n\nFrom\
    \ NSData:\n\nWhen initializing from NSData, an explicit encoding must be provided\
    \ as NSString is not able to guess how\ncharacters are represented in the raw\
    \ data stream. The most common nowadays is UTF-8, which is even a\nrequirement\
    \ for certain data like JSON.\n\nAvoid using +[NSString stringWithUTF8String:]\
    \ since it expects an explicitly NULL-terminated C-string, which - [NSData bytes]\
    \ does not provide.\n\n```objc\nNSString *newString = [[NSString alloc] initWithData:myData\
    \ encoding:NSUTF8StringEncoding];\n```\n\nFrom NSArray:\n\n```objc\nNSArray *myArray\
    \ = [NSArray arrayWithObjects:@\"Apple\", @\"Banana\", @\"Strawberry\", @\"Kiwi\"\
    , nil];\nNSString *newString = [[myArray componentsJoinedByString:@\"\"] \"\"\
    ];\n```\n\n## Section 13.7: Changing Case\n\nTo convert a String to uppercase,\
    \ use uppercaseString:\n\n```objc\nNSString *myString = @\"Emphasize this\";\n\
    NSLog(\"%@\", [myString uppercaseString]); // \"EMPHASIZE THIS\"\n```\n\nTo convert\
    \ a String to lowercase, use lowercaseString:\n\n```objc\nNSString *myString =\
    \ @\"NORMALIZE this\";\nNSLog(\"%@\", [myString lowercaseString]); // \"normalize\"\
    \n```\n\nTo capitalize the first letter of each word in a string, use capitalizedString:\n\
    \n```objc\nNSString *myString = @\"firstname lastname\";\nNSLog(\"%@\", [myString\
    \ capitalizedString]); // \"First Lastname\"\n```\n\n## Section 13.8: Removing\
    \ Leading and Trailing Whitespace\n\n```objc\nNSString *someString = @\"Objective-C\
    \ Language \\n\";\nNSString *trimmedString = [someString stringByTrimmingCharacters:[NSCharacterSet\
    \ whitespaceAndNewlinesCharacterSet]];\n//Output will be \"Objective-C Language\"\
    \n```\n\nMethod stringByTrimmingCharacters returns a new string made by removing\
    \ from both ends of the String contained in a given character.\n\nWe can also\
    \ remove only whitespace or newline\n\n```objc\n// Removing only Space\nNSString\
    \ *trimmedSpace = [someString stringByTrimmingCharacters:[NSCharacterSet whitespaceCharacterSet]];\n\
    //Output will be \"Objective-C Language \\n\"\n// Removing only NewLine\nNSString\
    \ *trimmedNewLine = [someString stringByTrimmingCharacters:[NSCharacterSet newlineCharacterSet]];\n\
    //Output will be \"Objective-C Language\"\n```\n\n## Section 13.9: Joining an\
    \ Array of Strings\n\nTo combine an NSArray into a new NSString:\n"
