    # How to Use Singleton Classes


    The Singleton Class that we created earlier will be accessible from anywhere in
    the project as long as you have imported CommonClass.h file in the relevant module.
    To modify and access the shared data in Singleton Class, you will have to access
    the shared Object of that class which can be accessed by using sharedObject method
    like following:


    ```

    [CommonClass sharedObject]

    ```


    To read or modify elements in Shared Class, do the following:


    ```

    NSString *commonString = [[CommonClass sharedObject].commonString];//Read the
    string in singleton class


    NSString *newString = @"New String";n[CommonClass sharedObject].commonString =
    newString;//Modified the string in singleton class

    ```


    # Section 5.5: The "instancype" return type


    Objective-C supports a special type "instancype" that can only be used as type
    returned by a method. It evaluates the class of the receiving object.


    Consider the following class hierarchy:


    ```

    @interface Foo : NSObject

    - (instancype)initWith:(NSString*)string;


    @end


    @interface Bar : Foo

    ```


    When [[Foo alloc] initWithString:"abc"] is called, the compiler can infer that
    the return type is Foo *. The Bar class derived from Foo did not override the
    declaration of the initializer. Yet, thanks to instancype, the compiler can infer
    that [[Bar alloc] initWithString:"xyz"] returns a value of Bar *.


    Consider the return type of -Foo initWithString: being Foo *: if you would [[Foo
    alloc] initWithString]; the compiler would infer that a Foo * is returned, not
    a Bar * as is the intention of the developer. The instancype solved this issue.


    Before the introduction of instancype, initializers, static methods like singleton
    accessors and other methods that return an instance of the receiving class needed
    to return an id. The problem is that means object of any type. The compiler is
    not able to detect that NSString *wrong = [[Foo alloc] initWithString:"abc\];
    is assigning to a variable with an incorrect type.


    Due to this issue, initializers should always use instancype instead of id as
    the return value.'
