    : @\"Bar\"} mutableCopy;\nmyDictionary[@\"Foo\"] = @\"Baz\";\nNSLog(\"%@\", myDictionary[@\"\
    Foo\"]); // Baz\n```\n\n# Chapter 34: Low-level Runtime Environment\n\n## Section\
    \ 34.1: Augmenting methods using Method Swizzling\n\nThe Objective-C runtime allows\
    \ you to change the implementation of a method at runtime. This is called method\
    \ swizzling and is often used to exchange the implementations of two methods.\
    \ For example, if the methods foo and bar are exchanged, sending the message foo\
    \ will now execute the implementation of bar and vice versa.\n\nThis technique\
    \ can be used to augment or \"patch\" methods which you cannot edit directly,\
    \ such as methods of system-provided classes.\n\nIn the following example, the\
    \ `-[UserDefaults synchronize]` method is augmented to prevent the execution time\
    \ of the original implementation.\n\n**IMPORTANT**: Many people try to swizzle\
    \ when you need to change the method you're replacing, because you'll be calling\
    \ it using a different selector than it is expecting. As a result, you can break\
    \ things in strange and unexpected ways—particularly if multiple parties swizzle\
    \ an object in this way. Instead, you should always swizzle using setImplementation\
    \ in conjunction with a C function, allowing you to swizzle the method with the\
    \ original selector.\n\n```objc\n#import \"UserDefaults.h\"\n#import <objc/runtime.h>\
    \ // Needed for method swizzling\n\nstatic IMP old_synchronize = NULL;\n\nstatic\
    \ void new_synchronize(id self, SEL _cmd);\n\n@implementation NSUserDefaults(Timing)\n\
    \n+(void)load {\n    Method originalMethod = class_method([self class], @selector(synchronize));\n\
    \    IMP swizzleImp = [new_synchronize];\n    old_synchronize = method_setImplementation(originalMethod,\
    \ swizzleImp);\n}\n@end\n\nstatic void new_synchronize(id self, SEL _cmd) {\n\
    \    NSDate *started;\n    BOOL returnValue;\n\n    started = [NSDate date];\n\
    \n    // Call the original implementation, passing the same parameters\n    //\
    \ that this function was called with, including the selector.\n    returnValue\
    \ = old_synchronize(self, _cmd);\n\n    NSLog(\"@Writing user defaults took %f\
    \ seconds.\", [NSDate timeIntervalSinceDate:started]);\n\n    return returnValue;\n\
    }\n```\n\nIf you need to swizzle a method that takes parameters, you just add\
    \ them as additional parameters to the function.\nFor example:\n\n```objc\nstatic\
    \ IMP old_viewWillAppear_animated = NULL;\nstatic void new_viewWillAppear_animated(id\
    \ self, SEL _cmd, BOOL animated);\n...\n```\n\nMethod originalMethod = class_getClass([UIViewController\
    \ class]), @selector(viewWillAppear);\nIMP swizzleImp = (IMP)new_viewWillAppear_animated;\n\
    old_viewWillAppear_animated = method_setImplementation(originalMethod, swizzleImp);\n\
    \nstatic void new_viewWillAppear_animated(id self, SEL _cmd, BOOL animated)\n\n\
    ```objc\n{\n    old_viewWillAppear_animated(self, _cmd, animated);\n}\n```\n\n\
    ## Section 34.2: Attach object to another existing object (association)\n\nIt's\
    \ possible to attach an object to an existing object as if there was a new property.\
    \ This is called association and allows one to extend existing objects. It can\
    \ be used to provide storage when adding a property via a class extension or otherwise\
    \ add additional information to an existing object.\n\nThe associated object is\
    \ automatically released by the runtime the target object is deallocated.\n\n\
    ```objc\n#import <objc/runtime.h>\n\n// \"Key\" for association. Its value of\
    \ this global static variable is to\n// matter. The only purpose of this global\
    \ static variable is\n// provide a guaranteed unique value at runtime: no two\
    \ distinct\n// global variables share the same address.\nstatic char *Key;\n\n\
    id target = ...;\nid payload = ...;\nobjc_setAssociatedObject(target, &Key, payload,\
    \ OBJC_ASSOCIATION_RETAIN);\n// Other useful values are OBJC_ASSOCIATION_COPY\n\
    // and OBJC_ASSOCIATION_ASSIGN\n\nid queryPayload = obj_getAssociatedObject(target,\
    \ &Key);\n```\n\n## Section 34.3: Calling methods directly\n\nIf you need to call\
    \ an Objective-C method from C, you have two ways: objc_msgSend, or obtaining\
    \ the IMP (method implementation function pointer) and calling that.\n\n```objc\n\
    #import <objc/objc.h>\n\n@implementation Example\n```\n\n```objc\n(double)negate:(double)value\
    \ {\n  return -value;\n}\n\n(double)invert:(double)value {\n  return 1 / value;\n\
    }\n\n@end\n```\n\n```objc\n// Calls the selector on the object. Expects the method\
    \ to have one double argument and return a double. \ndouble performSelectorWithMsgSend(id\
    \ object, SEL selector, double value) {\n// We declare pointer and cast objc_msgSend\
    \ to expected results!\n// WARNING: This step is important! Otherwise you may\
    \ get unexpected results!\ndouble (*msgSend)(id, SEL, double) = (typeof(msgSend))\
