  - "[PAGE 122]\n\n# Chapter 51: Memory Management\n\n# Section 51.1: Memory management\
    \ rules when using manual reference counting\n\nThese rules apply only if you\
    \ use manual reference counting!\n\n+   1. You own any object you create\n\nBy\
    \ calling a method whose name begins with new, copy or mutableCopy. For example:\n\
    \n```\nNSObject *object1 = [[NSObject alloc] init];\nNSObject *object2 = [NSObject\
    \ new];\nNSObject *object3 = [object2 copy];\n```\n\nThat means you are responsible\
    \ for releasing these objects when you are done with them.\n\n+   2. You can take\
    \ ownership of an object using retain\n\nTo take ownership of an object you call\
    \ the retain method.\n\nFor example:\n\n```\nNSObject *object = [NSObject new];\
    \ // object already has a retain count of 1\n[object retain]; // retain count\
    \ is now 2\n```\n\nThis makes only sense in some rare situations.\n\nFor example\
    \ when you implement an accessor or an init method to take ownership:\n\n```\n\
    (void)setNSString:(NSString*)stringValue {\n  [_privatestringValue release]; //\
    \ Release the old value, you no longer need it\n  [stringValue retain]; // You\
    \ make sure that this object does not get deallocated outside\n your scope;\n\
    \ _privatestringValue = stringValue;\n}\n```\n\n+   3. When you no longer need\
    \ it, you must relinquish ownership of an object you own\n\n```\nNSObject*object\
    \ = [NSObject new]; // The retain count is now 1\n[object performAction1]; //\
    \ Now we are done with the object\n[object release]; // Release the object\n```\n\
    \n+   4. You must not relinquish ownership of an object you do not own\n\nThat\
    \ means when you didn't take ownership of an object you don't release it.\n\n\
    +   5. Autoreleasepool\n\nThe autoreleasepool is a block of code that releases\
    \ every object in the block that received an autorelease message."
- md: "\n```objc\n@autoreleasepool {\n  NSString *string = [NSString stringWithWithString:@\"\
    We don't own this object\"];\n}\n```\n\nWe have created a string without taking\
    \ ownership. The NSString stringWith: has to make sure that the string is correctly\
    \ deallocated after it is no longer needed. Before the method returns the newly\
    \ created string calls the autorelease method so it does not have to take ownership\
    \ of the string.\n\nThis is how the stringWith: is implemented:\n\n```objc\n+\
    \ (NSString *)stringString:(NSString *)string {\n  NSString *createdString = [[NSString\
    \ alloc] initWithString:string];\n  [createdString autorelease];\n  return createdString;\n\
    }\n```\n\nIt is necessary to use autorelease pools because sometimes you have\
    \ objects that you don't own (the fourth rules does not always apply).\n\nAutomatic\
    \ reference counting automatically care of the rules so you don't have to.\n\n\
    ## Section 51.2: Automatic Reference Counting\n\nWith automatic reference counting\
    \ (ARC), the compiler inserts retain, release, and autorelease statements when\
    \ they are needed, so you don't have to write them yourself. It also writes dealloc\
    \ methods for you.\n\nThe sample program from Manual Memory Management looks like\
    \ this with ARC:\n\n```objc\n@interface MyObject : NSObject {\n  NSString *property;\n\
    }\n@end\n\n@implementation MyObject\n@synthesize property = _property;\n\n-(id)initWithProperty:(NSString\
    \ *)property {\n  if (self = [super init]) {\n    _property = property;\n  }\n\
    \  return self;\n}\n\n-(NSString *)property {\n  return property;\n}\n\n-(void)setProperty:(NSString\
    \ *)property {\n  _property = property;\n}\n\n@end\n\nint main() {\n  MyObject\
    \ *obj = [[MyObject alloc] init];\n  NSString *value = [[NSString alloc] initWithString:@\"\
    value\"];\n  [obj setProperty:@value];\n}\n```\n\nYou are still able to dealloc\
    \ the method to clean up resources not handled by ARC. Unlike using manual memory\
    \ management you do not call [super dealloc].\n\n```objc\n(void)dealloc {\n  //clean\
    \ up\n}\n```\n\n## Section 51.3: Strong and weak\n\nVersion = Modern\n\nA weak\
    \ reference looks like one of these:\n\n```objc\n@property (weak) NSString *property;\n\
    NSString *_weak variable;\n```\n\nIf you have a weak reference to an object, then\
    \ under the hood:\n\n- It's not retaining.\n- When it gets deallocated, every\
    \ reference to it will automatically be set to nil\n\nObject references are always\
    \ strong by default. But you can explicitly specify that they're strong:\n\n```objc\n\
    @property (strong) NSString *property;\nNSString *_strong variable;\n```\n\nA\
    \ strong reference means that while that reference exists, you are retaining the\
    \ object.\n\n## Section 51.4: Manual Memory Management\n\nThis is an example of\
    \ a program written with manual memory management. You shouldn't write your code\
    \ like this, for some reason you can't use ARC (if you need to support 32-bit).\
    \ The example avoids @property notation to illustrate how you had to write getters\
    \ and setters.\n\n```objc\n@interface MyObject : NSObject {\n  NSString *_property;\n\
    }\n@end\n```\n\n```objc\n@implementation MyObject\n@synthesize property = _property;\n\
    \n-(id)initWithProperty:(NSString *)property {\n  if (self = [super init]) {\n\
    \    // Grab a reference to property to make sure it doesn't go away.\n    //\
    \ The reference is released in dealloc.\n    _property = [property retain];\n\
    \  }\n  return self;\n}\n```\n\n```objc\n- (NSString *)property {\n    return\
    \ [[property retain autorelease]];\n}\n```\n\n```objc\n- (void)setProperty:(NSString\
    \ *)property {\n    // Retain, then release. So setting it to the same value won't\
    \ lose the reference.\n    [property retain];\n    [_property release];\n    _property\
    \ = property;\n}\n```\n\n```objc\n- (void)dealloc {\n    [_property release];\n\
    \    [super dealloc]; // Don't forget!\n}\n```\n\n```objc\n@end\n```\n\n```objc\n\
    int main() {\n    // create object\n    // obj is a reference that we need to\
    \ release\n    MyObject *obj = [[MyObject alloc] init];\n    NSString *value =\
    \ [[NSString alloc] initWithString:@\"value\"];\n}\n```\n\n## Credits\n\nThank\
