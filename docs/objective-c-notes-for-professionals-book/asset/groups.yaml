    \ 04:46:14.859 demo [20683] ANSI :1\n\n## Chapter 43: Grand Central Dispatch\n\
    \nGrand Central Dispatch (GCD) In iOS, Apple provides two ways to multitasking:\
    \ The Grand Central Dispatch (GCD) and NOperationQueue frameworks. We will discuss\
    \ here GCD. GCD is a lightweight way to represent units of work that are being\
    \ executed Currently You don't schedule these units of work; the system takes\
    \ care of scheduling for you. dependency among blocks can be a headache. Canceling\
    \ or suspending a block creates extra work for you as a developer!\n\n## Section\
    \ 43.1: What is Grand central dispatch\n\nWhat is Concurrency?\n\n- Doing multiple\
    \ things at the same time.\n- Taking advantage of number of cores available in\
    \ multicore CPUs.\n- Running multiple programs in parallel.\n\n## Objectives of\
    \ Concurrency\n\n- Running program in background without hogging CPU.\n- Define\
    \ Tasks, Define Rules and let the system take the responsibility of performing\
    \ them.\n- Improve responsiveness by ensuring that the main thread is free to\
    \ respond to user events.\n\n## DISPATCH QUEUES\n\nGrand central dispatch – dispatch\
    \ queues allows us to execute arbitrary blocks of code either asynchronously or\
    \ synchronously All Dispatch Queues are first in – first out All the tasks added\
    \ to dispatch queue are started in the order they were added to the dispatch queue.\n\
    \n## Chapter 44: Format-Specifiers\n\nFormat-Specifiers are used in Objective-C\
    \ to implant object-values into a string.\n\n## Section 44.1: Integer Example\
    \ - %i\n\n```objc\nint highScore = 57;\nNSString *scoreBoard = [NSString stringWithFormat:@\"\
    HighScore: %i\", (int)highScore];\nNSLog(scoreBoard);//logs \"HighScore: 57\"\n\
    ```\n\n## Chapter 45: Logging\n\n## Section 45.1: Logging\n\n```objc\nNSLog(\"\
    @Log Message!\");\nNSLog(\"@NSString value: %@\", stringValue);\nNSLog(\"@Integer\
    \ value: %d\", intValue);\n```\n\nThe first argument of NSLog is an NSString containing\
    \ the log message format. The rest of the parameters are used as substitutes in\
    \ place of the format specifiers.\n\nThe formatting works exactly the same as\
    \ printf, except for the additional format specifier % for an Objective-C object.\
    \ This:\n\n```objc\nNSLog(\"@%@\", object);\n```\n\nis equivalent to:\n\n```objc\n\
    NSLog(\"%%s\", [object description].UTF8String);\n```\n\n## Section 45.2: NSLog\
    \ Output Format\n\n```objc\nNSLog(\"@NSLog message@\");\n```\n\nThe message that\
    \ gets prints by calling NSLog has the following format when viewed in Console.app:\n\
    \n| Date | Time | Program name Process ID | Thread ID | Message |\n| :--- | :---\
