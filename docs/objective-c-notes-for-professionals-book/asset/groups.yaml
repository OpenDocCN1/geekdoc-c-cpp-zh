    \ *calendar = [NSCalendar autoupdatingCurrentCalendar];\n[calendar setTimeZone:[NSTimeZone\
    \ timeSecondsFromGMT:0]];\nNSLog(\"%@\", [calendar timeZone]);\n```\n\n### Section\
    \ 25.3: Numerical Calculations\n\n+ - components: Returns an NSDate object containing\
    \ a given date decomposed into specified components\n\n```objc\nNSCalendar *calendar\
    \ = [NSCalendar autoupdatingCurrentCalendar];\n[calendar setTimeZone:[NSTimeZone\
    \ timeSecondsFromGMT:0]];\nNSLog(\"%@\", [calendar components:NSCalendarUnitDay\
    \ from:[NSDate date]]);\n```\n\n```objc\nNSLog(\"%@\", [calendar components:NSCalendarUnitYearFromDate:[NSDate\
    \ date]]);\nNSLog(\"%@\", [calendar components:NSCalendarUnitMonthFromDate:[NSDate\
    \ date]]);\n```\n\n- components:toDate:options: Returns, an NSDateComponents object\
    \ specified components, the difference between two supplied dates.\n\n```objc\n\
    NSCalendar *calendar = [NSCalendar autoupdatingCurrentCalendar];\n[calendar setTimeZone:[NSTimeZone\
    \ timeForSecondsFromGMT:0]];\nNSLog(\"%@\", [calendar components:NSCalendarUnitYearFromDate:[NSDate\
    \ dateWithTimeIntervalSince1970:0] toDate:[NSDate dateWithTimeIntervalSinceNow:18000]\
    \ options:NSCalendarWrapComponents]);\n```\n\n- dateAddingComponents:toDate:options:\
    \ Returns a new NSDate object representing the absolute time time calculated by\
    \ adding given components to a given date.\n\n```objc\nNSCalendar *calendar =\
    \ [NSCalendar autoupdatingCurrentCalendar];\nNSDateComponents *dateComponent =\
    \ [[NSDateComponents alloc] init];\n[dateComponent setYear:10];\nNSLog(\"%@\"\
    , [calendar dateByAddingComponents:dateComponent toDate:[NSDate dateWithTimeIntervalSinceNow:0]\
    \ options:NSCalendarWrapComponents]);\n```\n\n- dateFromComponents: Returns a\
    \ new NSDate object representing the absolute time calculated from given components.\n\
