    # # Section 13.10: Formatting


    The NSString formatting supports all the strings available on the printf function.
    The only addition made by the language is the % symbol used for formatting the
    Objective-C objects.


    It is possible to format integers


    ```

    int myAge = 21;

    NSString *formattedAge = [NSString stringWithWithFormat:@"I am %d years old",
    myAge];

    ```


    Or any object subclass from NSObject


    ```

    NSDate *now = [NSDate date];

    NSString *formattedDate = [NSString stringWithFormat:@"The time right now is %@",
    now];

    ```


    For a complete list of Format Specifiers, see Objective-C, Format Specifiers,
    Syntax


    # # Section 13.11: Working with C Strings


    To convert NSString to const char use -[NSString UTF8String];


    ```

    NSString *myNSString = @"Some string";

    const char *cString = [myNSString UTF8String];

    ```


    You could also use -[NSString cStringUsingEncoding:] if your string is encoded
    with something other than UTF-8.


    For the reverse path use -[NSString stringWithUTF8String];


    ```

    const char *cString = "Some string";

    NSString *myNSString = [NSString stringWithUTF8String:cString];

    myNSString = @cString; // Equivalent to the above .

    ```


    Once you have the const char *, you can work with it like an array of chars:


    ```

    printf("%s\n", cString[5]);

    ```


    If you want to modify the string, make a copy:


    ```

    char *copy = calloc(strlen(cString), 1, 1);

    strcpy(copy, cString, strlen(cString));

    // Do stuff with copy

    free(copy);

    ```


