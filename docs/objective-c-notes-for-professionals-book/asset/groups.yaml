    \  objc_setAssociatedObject(self, @selector(screenName), screenName, OBJC_ASSOCIATION_RETAIN_NONATOMIC);\n\
    }\n@end\n```\n\n## Section 36.5: Create a Category on Xcode\n\nCategories provide\
    \ the ability to add some extra functionality to an object without subclassing\
    \ or changing the actual object.\n\nFor example we want to set some custom fonts.\
    \ Let's create a category that adds all functionality to UIColor. Open your Xcode\
