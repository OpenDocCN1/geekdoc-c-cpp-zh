    # Section 12.3: Collection Operators


    Collection Operators can be used in a KVC path to perform an operation on a "collection-type"
    (i.e. NSArray, NSSet and similar). For example, a common operation to perform
    is to count the objects in a collection. To achieve this, you use the @count collection
    operator:


    ```

    self.array @count = @5, @4, @3, @1;

    NSNumber count = [self.array valueForKeyPath:"@count\];

    NSNumber countAlt = [self valueForKeyPath:"@array.@count"];

    // count = countAlt = 5

    ```


    While this is completely redundant (where you just accessed the collection property),
    it can be useful on occasion, though it is rarely necessary. There are, some collection
    operators that are much more useful, namely @min, @sum, @avg and the @unionOf
    family. It important to note that these operators also require a separate path
    following the operator. Here is a list of the type of data they work with:


    | Operator | Data Type |

    | --- | --- |

    | @max | NSNumber, NSDate, int (and related), etc. |

    | @min | NSNumber, NSDate, int (and related), etc. |

    | @sum | NSNumber, int (and related), double (and related), etc. |

    | @avg | NSNumber, int (and related), double (and related), etc. |

    | @unionOfObjects | NSArray, NSSet, etc. |

    | @distinctUnionOfObjects | NSArray, NSSet, etc. |

    | @unionOfArrays | NSArray<NSArray*> |

    | @distinctUnionOfArrays | NSArray<NSArray*> |

    | @distinctUnionOfSets | NSSet<NSSet*> |


    @max and @min will return the highest or lowest value, respectively, of a property
    of objects in the collection. example, look at the following code:


    ```

    // "Point class used in our collection

    @interface NSObject


    @property NSInteger x, y;


    + (instancetype) pointWithX:(NSInteger)x y:(NSInteger);


    @end


    self.points = @[Point pointWithX:0 y:0];

    [Point pointWithX:1 y:-1];

    [Point pointWithX:5 y:-6];

    [Point pointWithX:3 y:0];

    [Point pointWithX:8 y:-4];

    ```


    ```

    NSNumber maxX = [self valueForKeyPath:"@points.max.x\];

    NSNumber minX = [self valueForKeyPath:"@points.min.x\];

    NSNumber maxY = [self valueForKeyPath:"@points.max.y\];

    NSNumber minY = [self valueForKeyPath:"@points.min.y];

    ```'
