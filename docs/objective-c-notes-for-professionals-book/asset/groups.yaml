    ```\n\n## 第 33 章：下标（Subscripting）\n\n### 第 33.1节：NSArray 的下标\n\n下标可以简化获取和设置数组元素。给定以下数组\n\
    \n```objc\nNSArray *fruit = @[\"Apples\", \"Bananas\", \"Cherries\"];\n```\n\n\
