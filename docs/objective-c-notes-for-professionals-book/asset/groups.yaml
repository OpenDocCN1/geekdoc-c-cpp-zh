    \ is a Singleton Class?\n\nA singleton class returns the same instance no matter\
    \ how many times an application requests it. Unlike a regular class, a Singleton\
    \ object provides a global point of access to the resources of its class.\n\n\
    When to Use Singleton Classes?\n\nSingletons are used in situations where this\
    \ single point of control is desirable, such as with classes that offer some general\
    \ service or resource.\n\nHow to Create Singleton Classes\n\nFirst, create a New\
    \ file and subclass it from NSObject. Name it anything, we will use CommonClass\
    \ here. Xcode will generate CommonClass.h and CommonClass.m files for you.\n\n\
    In your CommonClass.h file:\n\n```\n#import <Foundation/Foundation.h>\n@interface\
    \ CommonClass : NSObject\n+ (CommonClass *)sharedObject;\n@property NSString *commonString;\n\
    @end\n```\n\nIn your CommonClass.m file:\n\n```\n#import \"CommonClass.h\"\n@implementation\
    \ CommonClass\n+ (CommonClass *)sharedObject {\n    static CommonClass *sharedClass\
    \ = nil;\n    static dispatch_once_t onceToken;\n    dispatch_once(&onceToken,\
    \ {\n        sharedClass = [[self alloc] init];\n    });\n    return sharedClass;\n\
    }\n\n-(id)init {\n    if (self = [super init]) {\n        self.commonString =\
    \ @\"this is string\";\n    }\n}\n@end\n```"
