    \ = [NSArray arrayWithObjects:@\"Mercedes-Benz\", @\"BMW\", @\"Porsche\", @\"\
    Opel\", @\"Volkswagen\", @\"Audi\", nil];\n\nif ([generateMakes isEqualToArray:generateMakes2])\
    \ {\n    NSLog(@\"Oh good, literal arrays are the same\");\n}\n```\n\nThe important\
    \ thing is that isEqual: test must be implemented. For custom objects.\n\n###\
    \ Section 14.10: Comparing Arrays With Predicates\n\n```objc\nNSArray *array =\
    \ [NSArray arrayWithObjects:@\"Nick\", @\"Ben\", @\"Adam\", @\"Melissa\", nil];\n\
    \nSPredicate *predicate = [SPredicate predicateWithFormat:@\"SELF contains[c]\
    \ %@\", @\"Adam\"];\n[array filteredUsingPredicate:predicate];\n// contains \"\
    Adam\"\n\nSPredicate *ePredicate = [SPredicate predicateWithFormat:@\"SELF contains[c]\
    \ %@\", @\"Ben\"];\n[array filteredUsingPredicate:ePredicate];\n// now contains\
    \ \"Ben\", \"Melissa\"\n```\n\nMore about NSPredicate: Apple doc: NSPredicate\n\
    \n### Section 14.11: Sorting array with custom objects\n\n#### Compare method\n\
    \nEither you implement a compare-method for your object:\n\n```objc\n- (NSComparisonResult)compare:(Person\
    \ *)otherObject {\n  return [self.birthDate compare:otherObject.birthDate];\n\
    }\n```\n\n```objc\nNSArray *sortedArray = [drinkDetails sortedArrayUsingSelector:@selector(compare:)];\n\
    ```\n\n#### NSSortDescriptor\n\n```objc\nNSSortDescriptor *sortDescriptor;\nsortDescriptor\
    \ = [[NSSortDescriptor alloc] initWithKey:@\"birthDate ascending:YES];\n\nNSArray\
    \ *sortDescriptors = [NSArray arrayObject:sortDescriptor];\nNSArray *sortedArray\
    \ = [drinkDetails sortedArrayUsingDescriptors:sortDescriptors];\n```\n\nYou can\
    \ easily sort by multiple keys by adding more than one to the array. Using custom\
    \ comparator-methods is possible well. Have a look at the documentation.\n\n####\
    \ Blocks\n\n```objc\nsortedArray = [drinkDetails sortedArrayUsingComparator:^NSComparisonResult(id\
    \ a, id b) {\n    NSDate *first = [(Person*)a birthDate];\n    NSDate *second\
    \ = [(Person*)b birthDate];\n    return [first compare:second];\n}];\n```\n\n\
    #### Performance\n\nThe -compare and block-based methods will be quite a bit faster,\
    \ in general, using NSSortDescriptor as the latter relies on KVC. The primary\
    \ advantage of NSSortDescriptor method is that it provides a way to define your\
    \ sort order using data, rather than code, which makes it easy to e.g. sets up\
    \ so users can sort an UITableView\n\n### Section 14.12: Sorting Arrays\n\nThe\
