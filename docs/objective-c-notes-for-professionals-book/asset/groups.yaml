    \n### Section 25.2: Initializing a Calendar\n\n+ - initWithCalendarIdentifier:\
    \ Initializes a newly-allocated NSCalendar object as specified by a given identifier.\n\
    \n```objc\nNSCalendar *calendar = [[NSCalendar alloc] initWithCalendarIdentifier:@\"\
    gregorian\"];\nNSLog(\"%@\", calendar);\n```\n\n+ - setFirstWeekday: Sets the\
    \ index of the first weekday for the receiver.\n\n```objc\nNSCalendar *calendar\
    \ = [NSCalendar autoupdatingCurrentCalendar];\n[calendar setFirstWeekday:];\n\
    NSLog(\"%@\", [calendar firstWeekday]);\n```\n\n+ - setLocale: Sets the locale\
