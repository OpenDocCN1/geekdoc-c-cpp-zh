    \nTo read or modify elements in Shared Class, do the following:\n\n```objc\nNSString\
    \ *commonString = [[CommonClass sharedObject] commonString];//Read the string\
    \ in singleton class\n\nNSString *newString = @\"New String\";\n[CommonClass sharedObject].commonString\
    \ = newString;//Modified the string in singleton class\n```\n\n### Section 5.5:\
    \ The \"instancype\" return type\n\nObjective-C supports a special type \"instancype\"\
    \ that can only be used as type returned by a method. It evaluates the class of\
    \ the receiving object.\n\nConsider the following class hierarchy:\n\n```objc\n\
    @interface Foo : NSObject\n- (instancype)initWith:(NSString*)string;\n\n@end\n\
    \n@interface Bar : Foo\n```\n\nWhen [[Foo alloc] initWithString:\"abc\"] is called,\
    \ the compiler can infer that the return type is Foo *. The Bar class derived\
    \ from Foo did not override the declaration of the initializer. Yet, thanks to\
    \ instancype, the compiler can infer that [[Bar alloc] initWithString:\"xyz\"\
    ] returns a value of Bar *.\n\nConsider the return type of -Foo initWithString:\
    \ being Foo *: if you would [[Bar alloc] initWithString]; the compiler would infer\
    \ that a Foo * is returned, not a Bar * as is the intention of the developer.\
    \ The instancype solved this issue.\n\nBefore the introduction of instancype,\
    \ initializers, static methods like singleton accessors and other methods that\
    \ return an instance of the receiving class needed to return an id. The problem\
    \ is that means object of any type. The compiler is not able to detect that NSString\
    \ *wrong = [[Foo alloc] initWithString:\"abc\"];; is assigning to a variable with\
    \ an incorrect type.\n\nDue to this issue, initializers should always use instancype\
    \ instead of id as the return value.\n"
