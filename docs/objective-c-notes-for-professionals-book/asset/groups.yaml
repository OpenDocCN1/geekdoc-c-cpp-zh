    # # Chapter 14: NSArray


    # ## Section 14.1: Creating Arrays


    Creating immutable arrays:


    ```

    NSArray *myColors = [NSArray arrayWithObjects:@"Red", @"Green", @"Blue", @"Yellow",
    nil];

    // Using the array literal syntax:

    NSArray *myColors = @[@"Red", @"Green", @"Blue", @"Yellow\];

    ```


    For mutable arrays, see NSMutableArray.


    # ## Section 14.2: Accessing elements


    ```

    NSArray *myColors = @[@"Red", @"Green", @"Blue", @"Yellow\];

    // Preceding is the preferred equivalent to [NSArray arrayWithObjects:...];

    ```


    Getting a single item


    The objectAtIndex: method provides a single object. The first object in NSArray
    is index 0. Since NSArray can be homogenous (holding different types of objects),
    the return type is id ("any object"). An can be assigned to a variable of any
    other object type. NSArray can only contain objects. They cannot contain values
    int.


    Clang provides a better subscript syntax as part of array literals functionality.


    ```

    NSString *color = myColors[idx];

    ```


    Both of these throw an exception if the passed index is less than 0 or greater
    than count - 1.


    First and Last Item


    ```

    NSString *firstColor = myColors.firstObject;

    NSString *lastColor = myColors.lastObject;

    ```


    The firstObject and lastObject are computed properties and return nil rather than
    crashing for arrays. For single element arrays they return the object. Although,
    the firstObject method was not introduced to NSArray until iOS 4.0.


    ```

    NSArray *empty = @[];

    id notAnObject = empty.firstObject; // Returns ''nil''

    id kaboom = empty[]; // Crashes; index out of bounds

    ```


    # ## Section 14.3: Using Generics


    For safety we can define the type of object that the array contains:


    ```

    NSArray *colors = @[@"Red", @"Green", @"Blue", @"Yellow\];

    MutableArray *mutableColors = [NSMutableArray mutableArrayArrayWithObjects:colors];

    ```'
