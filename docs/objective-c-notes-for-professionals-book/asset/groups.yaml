    \n```objc\n@interface UIFont (CustomFonts)\n\n+(UIFont *)productSansRegularFontWithSize:(CGFloat)size;\n\
    @end\n```\n\n## Now Implement the Category Method:\n\nClick \"UIFont+CustomFonts.m\"\
    \ to view the category's implementation file. Add the following code to create\
    \ a method that will set ProductSansRegular Font.\n\n```objc\n+(UIFont *)productSansRegularFontWithSize:(CGFloat)size\
    \ {\n    return [UIFont fontName:\"ProductSans-Regular\" size:size];\n}\n```\n\
    \n## Import your category\n\n```objc\n#import UIFont+CustomFonts.h\n```\n\nNow\
    \ set the Label font\n\nGoalKicker.com - Objective-C® Notes for Professionals\n\
    \n```objc\n[self.label setFont:[UIFont productSansRegularFontWithSize:16.0]]\n\
    ```\n\n## Chapter 37: Protocols\n\n## Section 37.1: Optional and required methods\n\
    \nBy default, all the methods declared in a protocol are required. This means\
    \ that any class that conforms to this protocol must implement those methods.\n\
    \nIt is also possible to declare optional methods. These method can be implemented\
    \ only if needed.\n\nYou mark optional methods with the @optional directive.\n\
    \n```objc\n@protocol NewProtocol\n- (void)protocolMethod:(id)argument;\n- @optional\n\
    - (id)anotherMethod;\n- @end\n```\n\nIn this case, only anotherMethod is marked\
    \ as optional; the methods without the @optional directive are assumed to be required.\n\
    \nThe @optional directive applies to methods that follow, until the end of the\
    \ protocol definition, or until another directive is found.\n\n```objc\n@protocol\
    \ NewProtocol\n- (void)protocolMethod:(id)argument;\n- @optional\n- (id)anotherMethod;\n\
    - (id)anotherMethod:(id)argument;\n- @required\n- (void)lastProtocolMethod;\n\
    - @end\n```\n\nThis example defines a protocol with two optional methods and two\
