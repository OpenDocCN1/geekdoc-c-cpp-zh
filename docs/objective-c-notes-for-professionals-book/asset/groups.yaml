    \ 方法。\n\n```objc\n[NSTimer scheduledWithTimeInterval:5.0\n    target:@self\n \
    \   selector:@selector(doSomething)\n    userInfo:nil\n    repeats:NO];\n```\n\
    \n将 `repeats` 参数设置为 false/NO 表示我们希望 timer 只触发一次。如果将其设置为 true/YES，它将每隔五秒触发一次，直到被手动失效为止。\n\
    \n### 第 27.3节：使 timer 失效\n\n```objc\n[timer invalidate];\ntimer = nil;\n```\n\n\
    这将停止 timer 的触发。**必须在创建 timer 的线程中调用**，请参阅 Apple 的说明：\n\n> 你必须在安装 timer 的线程上发送此消息。如果你从另一个线程发送此消息，与\
    \ timer 关联的输入源可能无法从其对应的 run loop 中移除，这可能会阻止线程正常退出。\n\n设置为 **nil** 将帮助你检查它是否在运行。\n\
    \n```objc\nif(timer) {\n    [timer invalidate];\n    timer = nil;\n}\n```\n\n\
    ```objc\n//现在再次设置 timer。\n```\n\n### 第 27.4节：手动触发 timer\n\n```objc\n[timer fire];\n\
    ```\n\n调用 timer 方法会导致 NSTimer 执行它通常按计划执行的任务。\n\n在非重复性 timer 中，这会自动使该 timer 失效。也就是说，在时间间隔结束之前调用\
    \ `fire` 将导致只执行一次。\n\n在重复性 timer 中，这仅仅会调用操作而不会中断通常的计划。\n\n## 第 28 章：NSObject\n\
    \nNSObject 是 Cocoa 的根类，然而 Objective-C 语言本身并没有定义任何根类，它们完全是由 Apple 的框架 Cocoa 定义的。它是大多数\
    \ Objective-C 类层次结构的根类，子类通过它继承了基础接口、与运行时（runtime）的交互能力，以及表现为 Objective-C 对象的能力。\n\
    \n该类拥有 Objective-C 类对象的所有基本属性，例如：\n\n- self。\n- class（类名）。\n- superclass（当前类的父类）。\n\
    \n### 第 28.1节：NSObject\n\n@interface NSString : NSObject (NSObject 是 NSString\
    \ 类的基类)。\n\n你可以使用以下方法为字符串类分配内存：\n\n```objc\n- (instancetype)init\n+ (instancetype)new\n\
