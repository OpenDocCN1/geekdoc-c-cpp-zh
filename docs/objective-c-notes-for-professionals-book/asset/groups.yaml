    # Chapter 45: Logging


    # Section 45.1: Logging


    ```

    NSLog("@Log Message!");

    NSLog("@NSString value: %@", stringValue);

    NSLog("@Integer value: %d", intValue);

    ```


    The first argument of NSLog is an NSString containing the log message format.
    The rest of the parameters are used as substitutes in place of the format specifiers.


    The formatting works exactly the same as printf, except for the additional format
    specifier % for an arbitrary Objective-C object. This:


    ```

    NSLog("@%@", object);

    ```


    is equivalent to:


    ```

    NSLog("%%s", [object description].UTF8String);

    ```


    # Section 45.2: NSLog Output Format


    ```

    NSLog("@NSLog message@");"

    ```


    The message that gets prints by calling NSLog has the following format when viewed
    in Console.app:


    | Date | Time | Program name Process ID | Thread ID | Message |

    | 2016-07-16 08:58:04.681 test | [46259] | [1244733] | NSLog message |


    # Section 45.3: Removing Logging Statements from Release Build


    Messages from NSLog are displayed on Console.app even in the release build of
    your app, which doesn''t make sense for printouts that are only useful for debugging.
    To fix this, you can use this macro for debug logging instead of NSLog.


    ```

    #if DEBUG

    #define DLog((...) NSLog(__VA_ARGS__)

    #else

    #define DLog((...))

    #endif

    ```


    To use:


    In debug builds, DLog will call NSLog. In release builds, DLog will do nothing.


    # Section 45.4: Logging Variable Values


    You shouldn''t call NSLog without a literal string like this:'
- md: "\n```\nNSLog(variable); // Dangerous code!\n```\n\nIf the variable is not an\
    \ NSString, the program will crash, because NSLog expects an NSString.\n\nIf the\
    \ variable is an NSString, your will string contains a %. NSLog will parse the\
    \ % sequence as a format specifier and will return a garbage value off the stack,\
    \ causing a crash or even executing arbitrary code.\n\nInstead, make the first\
    \ argument in a format specifier, like this:\n\n```\nNSLog(\"%@\", objectVariable);\n\
    NSLog(\"%@d\", anIntegerVariable);\n```\n\n## Section 45.5: Empty message is not\
    \ printed\n\nWhen NSLog is asked to print empty message, it omits the log completely.\n\
    \n```\nNSString *name = \"@\";\nNSLog(\"%@\", name); // Resolves to \"@\"\n```\n\
    \nThe above code will print nothing.\n\nIt is a good practice to prefix logs with\
    \ labels:\n\nThe above code will print:\n\n```\n2016-07-21 14:20:28.623 App[87711:6511103]\
    \ Name:\n```\n\n## Section 45.6: Using __FUNCTION__\n\n```\nNSLog(\"%s %@\", __FUNCTION__,\
    \ \"@etc etc\");\n```\n\nInsert the class and method name into the output:\n\n\
    ```\n2016-07-16 12:51:30.099 loggingExample[18132:2971471] -[ViewController viewDidLoad]\
    \ etc\n```\n\n## Section 45.7: NSLog vs printf\n\nOutput:\n\n```\n2016-07-16 08:58:04.681\
    \ test[46259:1244773] NSLog message\nprintf message\n```\n\nNSLog outputs the\
    \ date, time, process name, process ID, and thread ID in addition to the log message.\
    \ printf just outputs the message.\n\nNSLog requires an NSString and automatically\
    \ adds a newline at the end. printf requires a C string and does not automatically\
    \ add a newline.\n\nNSLog sends output to stderr, printf sends output to stdout.\n\
    \nSome format specifiers in printf vs NSLog are different. For example when including\
    \ a nested string, the following differences incur:\n\n```\nNSLog(\"My string:\
    \ %@\", (NSString *)myString);\nprintf(\"My string: %@\", [(NSString *)myString\
    \ UTF8String]);\n```\n\n## Section 45.8: Logging NSLog meta data\n\n```\nNSLog(@\"\
    %s %d, %s: %@\", __FILE__, __LINE__, __PRETTY_FUNCTION__, yourVariable);\n```\n\
    \nThe log line, number and function data from any variables you want to log. This\
    \ can make the log lines much longer, particularly with verbose file and method\
    \ names, however it can help to speed up error diagnostics.\n\nYou can also wrap\
    \ this in a macro (store in a Singleton or when you need it to);\n\n```\n#define\
    \ ALog(fmt, ...) NSLog(@\"%s [Line %d] \" fmt, __PRETTY_FUNCTION__, __LINE__,\
    \ __VA_ARGS__);\n```\n\nWhen you want to log, simply call\n\n```\nALog(@\"name:\
    \ %@\", firstName);\n```\n\nWhich will give you something like:\n\n```\n- [AppDelegate\
    \ applicationFinishLaunchingOptions:] [Line 27] name: John\n```\n\n## Section\
    \ 45.9: NSLog and BOOL type\n\nThere is no format specifier to print boolean type\
    \ using NSLog. One way to print boolean value is to convert it to a string.\n\n\
    ```\nBOOL boolValue = YES;\nNSLog(@\"Bool value %@\", boolValue ? \"YES\" : \"\
    NO\");\n```\n\nOutput:\n\n```\n2016-07-30 22:53:18.269 [4445:64129] Bool value\
    \ YES\n```\n\nAnother way to print boolean value is to convert it to an integer,\
    \ achieving a binary output (1=yes, 0=no).\n\n```\nBOOL boolValue = YES;\nNSLog(@\"\
    Bool value %i\", boolValue);\n```\n\nOutput:\n\n```\n2016-07-30 22:53:18.269 [4445:64129]\
    \ Bool value 1\n```\n\n## Section 45.10: Logging by Appending to a File\n\nNSLog\
    \ is good, but you can also log by appending to a file instead, using code like:\n\
    \n```\nNSFileHandle fh = [NSFileHandle fileForWritingAtPath:path];\nif (!fh) {\n\
    \  [NSFileManager defaultManager] createFileAtPath:path contents:nil attributes:nil];\n\
    \  fh = [NSFileHandle fileForWritingAtPath:path];\n}\nif (fh) {\n  @try {\n  \
    \  [fh seekToEndFile];\n    fh writeData:[self dataUsingEncoding:enc];\n  } @catch\
    \ (...) {\n  }\n  [fh closeFile];\n}\n```\n\n## Chapter 46: Error Handling\n\n\
    ### Section 46.1: Error & Exception handling with try catch block\n\nExceptions\
    \ are programmer-level bugs like trying to access an array element that doesn't\
    \ exist.\n\nErrors are user-level issues like trying to load a file that doesn't\
    \ exist. Because errors are expected during the normal execution of a program.\n\
    \nExample:\n\n```\nNSArray *inventory = @[\"Sam\",@\"John\",\"Sanju\"];\nint selectedIndex\
    \ = 3;\ntry {\n    NSString *name = (NSString *)inventory[selectedIndex];\n  \
    \  NSLog(\"The selected name is: %@\", name);\n} @catch (Exception *theException)\
    \ {\n    NSLog(\"An exception occurred: %@\", theException.name);\n    NSLog(\"\
    Here are some details: %@\", theException.reason);\n} finally {\n    NSLog(\"\
    Executing finally block\");\n}\n```\n\nOutput:\n\n> An exception occurred: NSRangeException\n\
    \n> Here are some details: *** -[NSArray objectAtIndex]:index 3 out of bounds\
    \ [0 ..2]\n\n> Executing finally block\n\n## Section 46.2: Asserting Triangle\n\
    \n```\n@implementation\n...\n-(void)setAngles:(NSArray *)_angles {\n    self.angles\
    \ = [_angles copy];\n\n    NSAssert(self.angles.count == 3, @\"Triangles must\
    \ have 3 angles. Array '%@' has %i\", self.angles, (int)self.angles.count);\n\n\
    \    float angleA = [[self.angles[0]] floatValue];\n    float angleB = [[self.angles[1]]\
    \ floatValue];\n    float angleC = [[self.angles[2]] floatValue];\n    float sum\
    \ = angleA + angleB + angleC;\n    NSAssert(sum == M_PI, @\"Triangles angles must\
    \ add up to pi radians (180.0). This triangle adds up to %f degrees (%f)\", (float)sum,\
    \ (float)(180.0 / M_PI));\n}\n@end\n```\n\nThese assertions make sure that you\
    \ don't give a triangle incorrect angles, by throwing an exception if you do.\
    \ If they didn't throw an exception than the triangle, not being a true triangle\
    \ at all, might cause some bugs in later code.\n\n## Chapter 47: Modern Objective-C\n\
    \n### Section 47.1: Literals\n\nObjective-C provides ways to reduce amount of\
    \ code you need to initialize some common types. This new way is very similar\
    \ to how NSString objects are initialized with constant strings.\n\n**NSNumber**\n\
    \nOld way:\n\n```\nNSNumber *number = [NSNumber numberWithInt:25];\n```\n\nModern\
    \ way:\n\n```\nNSNumber *number = @25;\n```\n\nNote: you can also store BOOL values\
    \ in NSNumber objects using @YES, @NO or (@someBoolValue);\n\n**NSArray**\n\n\
    Old way:\n\nModern way:\n\n```\nNSArray *array = @[@\"One\", @\"Two\", @3, @\"\
    Four\"];\n```\n\n**NSDictionary**\n\nOld way:\n\n```\nNSDictionary *dictionary\
    \ = [NSDictionary dictionaryWithObjectsKeys:array, @\"Object\", [NSNumber floatValue:1.5],\
    \ @\"Value\", @\"Language\", @\"Objective-C\", nil];\n```\n\nModern way:\n\n```\n\
    NSDictionary *dictionary = @{@\"Object\": array, @\"Value\": 1.5, @\"Language\"\
    : @\"Objective-C\"};\n```\n\n### Section 47.2: Container subscribing\n\nIn Objective-C\
    \ syntax you can get values from NSArray and NSDictionary containers using subscribing.\n\
    \nOld way:\n\n```\nNSNumber *object1 = [array objectAtIndex:1];\nNSNumber *object2\
    \ = [dictionary objectForKey:@\"@Value\"];\n```\n\nModern way:\n\n```\nNSObject\
    \ *object1 = array[@1];\nNSObject *object2 = dictionary[@\"Value\"];\n```\n\n\
    You can also insert objects into arrays and set objects for keys in dictionaries\
    \ in a cleaner way.\n\nOld way:\n\n```\n// replacing at specific index\n[mutableArray\
    \ replaceObjectAtIndex:1 withObject:@\"NewValue\"];\n// adding a new value to\
    \ the end\n[mutableArray addObject:@\"NewValue\"];\n```\n\n```\n[mutableDictionary\
    \ setObject:@\"NewValue\" forKey:@\"NewKey\"];\n```\n\nModern way:\n\n```\nmutableArray[1]\
    \ = @\"NewValue\";\nmutableArray[[mutableArray count]] = @\"NewValue\";\n```\n\
    \nmutableDictionary[@\"NewKey\"] = @\"NewValue\";\n```\n\n## Chapter 48: Singletons\n\
    \nMake sure you read this thread (What is so bad about singletons?) before using\
    \ it.\n\n### Section 48.1: Using Grand Central Dispatch (GCD)\n\nGCD will guarantee\
    \ that your singleton gets instantiated once, even if called from multiple threads.\
    \ Insert this into any class for a singleton instance called shared.\n\n```\n\
    + (instancype)shared {\n// Variable that will point to the singleton instance.\
    \ The 'static'\n// modifier makes it behave like a global variable: the value\
    \ assigned\n// to it will 'survive' the method call.\nstatic id _shared;\nstatic\
    \ dispatch_once_t _onceToken;\ndispatch_once(&_onceToken, ^{\n// This block is\
    \ only executed once, in a thread-safe way.\n// Create the instance and assign\
    \ it to the static variable.\n_shared = [self new];\n});\nreturn _shared;\n}\n\
    ```\n\n### Section 48.2: Creating Singleton and also preventing it from having\
    \ multiple instance alloc/new\n\n```\nMySingletonClass.h\n@interface MySingletonClass\
    \ : NSObject\n\n+(instancype)sharedInstance;\n-(instancetype)init NS_UNAVAILABLE;\n\
    -(instancetype)new NS_UNAVAILABLE;\n@end\n```\n\n```\n@implementation\n+(instancype)sharedInstance\
    \ {\nstatic MySingletonClass *_sharedInstance = nil;\nstatic dispatch_once_t _oncePredicate;\n\
    dispatch_once(&_oncePredicate, ^{\n_sharedInstance = [[self alloc] init];\n});\n\
    return _sharedInstance;\n}\n+(instancetype)init {\nself = [super init];\n}\n@end\n\
    ```\n"
