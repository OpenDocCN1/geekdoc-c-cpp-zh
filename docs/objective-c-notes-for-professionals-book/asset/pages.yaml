  md: 'Values. The range of the int is -2 147 483 648 to 2 147 483 647 while the unsigned
    int has a range of 0 to 4 294 967. The value is doubled because the first bit
    isn''t used anymore to say the value is negative or not. For a long and NSInteger
    on 64-bit architectures, the range is much wider.


    Most models Apple provides are returning an NSInteger over the normal int. You''ll
    get a warning if you try to cast it to an int you will lose precision if you are
    running on a 64-bit architecture. Not that it would matter in most cases, but
    it is easier to use NS(U)Integer. For example, the count method on an array will
    return an NSInteger.


    ```

