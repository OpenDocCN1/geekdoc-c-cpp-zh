    ```


    This means that any instance of NewClass will respond to methods declared in its
    interface but it will also provide an implementation for all the required methods
    of NewProtocol.


    It is also possible for a class to conform to multiple protocols, by separating
    them with comma.


    ```

    @interface NewClass <Object <NewProtocol, AnotherProtocol, MyProtocol>

    ...

    @end

    ```


    Like conforming to a single protocol, the class must implement each required method
    of each protocols, and each optional method you choose to implement.


