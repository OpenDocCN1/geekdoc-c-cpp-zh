  md: "# # Chapter 3: Enums\n\n# ## Section 3.1: typedef enum declaration in Objective-C\n\
    \nA enum declares a set of ordered values - the typedef just adds a handy name\
    \ to this. The 1st element is 0 oct.\n\n```\ntypedef enum {\n    Monday=1,\n \
    \   Tuesday,\n    Wednesday\n} WORKDAYS;\nWORKDAYS today = Monday;//value 1\n\
    ```\n\n# ## Section 3.2: Converting C++ std::vector<Enum> to an Objective-C Array\n\
    \nMany C++ libraries use enums and return/receive data using vectors that contain\
    \ enums. As C enums are not Objective-C objects, Objective-C collections cannot\
    \ be used directly with C enums. The example below deals with using a combination\
    \ of an NSArray and a wrapper object for the array. This way, the collection can\
    \ be explicit about the data type and there is no worry about possible memory\
    \ leaks with C arrays Objective-C objects used.\n\nHere is the C & Objective-C\
    \ equivalent object:\n\n```\ntypedef enum {\nError0 = 0,\nError1 = 1,\nError2\
    \ = 2\n} MyError;\n```\n\n```\n@interface ErrorObj : NSObject\n@property (nonatomic)\
    \ int intValue;\n\n+ (instancype)objWithEnum:(MyError)myError;\n- (MyError) getEnumValue;\n\
    @end\n\n@implementation ErrorObj\n+ (instancype)objWithEnum:(MyError)error {\n\
    ErrorObj *obj = [ErrorObj new];\nobj.intValue = (int)error;\nreturn obj;\n}\n\
    - (MyError) getEnumValue {\nreturn (MyError)self.intValue;\n}\n@end\n```"
