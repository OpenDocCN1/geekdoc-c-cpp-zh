  md: "# # Chapter 2: Basic Data Types\n\n# ## Section 2.1: SEL\n\nSelectors are used\
    \ as method identifiers in Objective-C.\n\nIn the example below, there are two\
    \ selectors. `new` and `setName:`:\n\n```\nPerson* customer = [Person new];\n\
    [customer setName:@John Doe`];\n```\n\nEach pair of brackets corresponds to a\
    \ message sent. On the first line we send a message containing the selector to\
    \ the Person and on the second line we send a message containing the setName:\
    \ a string. The receiver of these messages uses the selector to look up the correct\
    \ action to perform.\n\nMost of the time, message passing using the bracket syntax\
    \ is sufficient, but occasionally you need to work with the selector itself. In\
    \ these cases, `SEL` type can be used to hold a reference to the selector.\n\n\
    If the selector is available at compile time, you can use @selector to get a reference\
    \ to it.\n\n```\nSEL s = @selector(setName:);\n```\n\nAnd if you need the selector\
    \ at runtime, use `NSFromString`\n\n```\nSEL s NSSelectorFromString(\"setName:\"\
    );\n```\n\nWhen using NSSelectorFromString, make sure to wrap the selector in\
    \ a NSString.\n\nIt is common to check if a delegate implements an optional method.\n\
    \n```\nif ([self.myDelegate respondsToSelector:@selector(doSomething)]) {\n  [self.myDelegate\
    \ doSomething];\n}\n```\n\n# ## Section 2.2: BOOL\n\nThe `BOOL` type is used for\
    \ boolean values in Objective-C. It has two values, `YES`, and `NO`, in contrast\
    \ to the common `true` and `false`.\n\nIts behavior is straightforward and identical\
    \ to the C language.\n\n```\nBOOL isEqual = (!==); // isEqual is YES\nBOOL notEqual\
    \ = !isEqual; // notEqual is NO\nNSAssert(aEqual, \"Mathematics is a lie\"); //\
    \ Assertion failed\n```\n\n```\nBOOL shouldFlattenReader = YES;\nif (shouldFlattenReader)\
    \ {\n  NSLog(\"@Only your smartest programmers read this.\");\n}\n```\n\nBOOL\
    \ is a primitive and cannot be stored directly in a Foundation collection. It\
    \ must be wrapped in `NSNumber`. Clang provides syntax for this:\n\n```\nNSNumber\
    \ * yes = @YES; // Equivalent to [NSNumber numberWithBool:YES];\n```"
