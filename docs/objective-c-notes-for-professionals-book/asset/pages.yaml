  md: '# Chapter 18: NSDate


    # Section 18.1: Convert NSDate that is composed from hour and minute (only) to
    a full NSDate


    There are cases when one has created an NSDate from hour and minute format, i.e:
    08:12


    The downside for this situation is that your date is almost completely "naked"
    and whatever you needs to do is to create: day, month, year, second and time zone
    in order to this object to "play along" with other NSDate types.


    ```

    NSComponents *hourAndMinuteComponents = [calendar components:NSCalendarUnitHour|NSCalendarUnitMinute
    fromDate:hourAndMinute];

    NSComponents *componentsOfDate = [[NSCalendar currentCalendar] components:NSCalendarUnitDay|NSCalendarUnitMonth|NSCalendarUnitYear
    fromDate:[NSDate date]];

    NSComponents *components = [[NSComponents alloc] init]; [components setDay:componentsOfDate.day];
    [components setMonth:componentsOfDate.month]; [components setYear:componentsOfDate.year];
    [components setHour:hourAndMinuteComponents.hour]; [components setMinute:hourAndMinuteComponents.minute];
    [components setSecond:0]; [calendar setTimeZone:NSTimeZone defaultTimeZone]];

    Date *yourNSDateObject = [calendar dateFromComponents:components];

    ```


    Now your object is the total output of being "naked".


    # Section 18.2: Converting NSDate to NSString


    If we have NSDate object, and we want to convert it into NSString. There are different
    types of Date strings. If we can do that, it is simple. Just 3 steps.


    +   1. Create NSDateFormatter Object


    ```

    NSFormatter *dateFormatter = [[NSFormatter alloc] init];

    ```


    +   2. Set the date format which you want your string.


    ```

    dateFormatter.dateFormat = @"yyyy-MM-dd ''at'' HH:mm";

    ```


    +   3. Now, get the formatted string


    ```

    NSDate *date = [NSDate date]; // your NSDate object

    NSString *dateString = [dateFormatter stringFromDate:date];

    ```


    This will give output something like this: 2001-01-02 at 13:00


    Note:'
