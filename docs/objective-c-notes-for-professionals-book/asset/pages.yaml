  md: "# # Chapter 4: Structs\n\n# ## Section 4.1: Defining a Structure and Accessing\
    \ Structure Members\n\nThe format of the struct statement is this:\n\n```\nobjc\n\
    struct [structure tag]\n{\n  member definition;\n  member definition;\n  ...\n\
    \  member definition;\n}\\ [one or more structure variables];\n```\n\nExample:\
    \ declare the ThreeFloats structure:\n\n```\nobjc\ntype struct {\n  float x, y,\
    \ z;\n} ThreeFloats;\n\n@interface MyClass\n-(void)setThreeFloats:(ThreeFloats)threeFloats;\n\
    -(ThreeFloats)threeFloats;\n@end\n```\n\nSending an instance of MyClass the message\
    \ valueForKey with the parameter \"@threeFloats\" will invoke the MyClass method\
    \ threeFloats and return the result wrapped in an NSValue.\n\n# ## Section 4.2:\
    \ CGPoint\n\nOne really good example of a struct is CGPoint; it's a simple value\
    \ that represents a 2-dimensional point. It has two properties, x and y, and can\
    \ be written as\n\n```\nobjc\ntype struct {\n  CGFloat x;\n  CGFloat y;\n} CGPoint;\n\
    ```\n\nIf you used Objective-C for Mac or iOS development before, you've almost\
    \ come across CGPoint; CGPoints hold the position of pretty much everything on\
    \ screen, from views and controls to objects in a game to changes. This means\
    \ CGPoints are used a lot. It is even more true with reality performance-heavy\
    \ games; these games have a lot of objects, and all of these objects need positions.\
    \ These positions are either CGPoints, or some other type of struct that conveys\
    \ a point (such as a 3-dimensional point for 3d games).\n\nPoints like CGPoint\
    \ could easily be represented as objects, like\n\n```\nobjc\n@interface CGPoint\n\
    \  CGFloat x;\n  CGFloat y;\n}\n\n// //Point-related methods (e.g. add, isEqualToPoint,\
    \ etc.)\n```"
