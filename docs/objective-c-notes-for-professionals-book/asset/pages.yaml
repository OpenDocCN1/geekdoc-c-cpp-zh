    // Again, you need the explicit arguments.\n  return callableImp(object, selector,\
    \ value);\n}\n```\n\n```\nint main() {\n  Example *e = [Example new];\n```\n\n\
    ```\n// Invoke negation, result is -4\ndouble x = performSelectorWithMsgSend(e,\
