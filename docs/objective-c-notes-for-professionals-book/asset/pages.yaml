    ```

    2016-07-30 23:55:41.870 Test(5214:81162) Before swap: a=10,b=20

    2016-07-30 23:55:41.871 Test(5214:81162) After calling swap: a=10,b=20

    ```


    # ## Section 7.3: Pass by reference parameter passing


    In pass by reference of parameter passing to a method, address of actual parameter
    is passed to formal parameter. So actual parameter value will be changed after
    returning from called function.


    ```

    @interface SwapClass : NSObject

    -(void)swap:(int)num1 and2:(int)num2;

    ```


