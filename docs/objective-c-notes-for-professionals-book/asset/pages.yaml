    # # Section 34.2: Attach object to another existing object (association)


    It''s possible to attach an object to an existing object as if there was a new
    property. This is called association and allows one to extend existing objects.
    It can be used to provide storage when adding a property via a class extension
    or otherwise add additional information to an existing object.


    The associated object is automatically released by the runtime the target object
    is deallocated.


    ```

    #import <objc/runtime.h>


    // "Key" for association. Its value of this global static variable is to

    // matter. The only purpose of this global static variable is

    // provide a guaranteed unique value at runtime: no two distinct

    // global variables share the same address.

    static char *Key;


    id target = ...;

    id payload = ...;

    objc_setAssociatedObject(target, &Key, payload, OBJC_ASSOCIATION_RETAIN);

    // Other useful values are OBJC_ASSOCIATION_COPY

    // and OBJC_ASSOCIATION_ASSIGN


    id queryPayload = obj_getAssociatedObject(target, &Key);

    ```


    # # Section 34.3: Calling methods directly


    If you need to call an Objective-C method from C, you have two ways: objc_msgSend,
    or obtaining the IMP (method implementation function pointer) and calling that.


    ```

    #import <objc/objc.h>


    @implementation Example

    ```


