  md: "# # Chapter 1: Getting started with Objective-C Language\n\nVersion Release\
    \ Date\n1.0 1983-01-01\n2.0 2007-10-27\nModern 2014-03-10\n\n# ## Section 1.1:\
    \ Hello World\n\nThis program will output \"Hello World!\"\n\n```\n#import <Foundation/Foundation.h>\n\
    int main(int argc, char * argv[]) {\n    NSLog(\"@Hello World!\");\n}\n```\n\n\
    #import is a pre-processor directive, which indicates we want to import or include\
    \ the information from that file into the program. In this case, the compiler\
    \ will copy the contents of Foundation.h in the Foundation framework to the top\
    \ of the file. The main difference between #import and #include is that #import\
    \ is \"smart\" enough not to preprocess files that have already been included\
    \ in other #includes.\n\nThe C Language documentation explains the main() function.\n\
    \nThe NSLog() function will print the string to the console, along with some debugging\
    \ information. In this case, we use an Objective-C string literal \"@Hello World\"\
    . In C, you would write this as \"Hello World\", Apple's Foundation Framework\
    \ adds the NSString class which provides a lot of useful functionality, and is\
    \ used by NSLog. The simplest way to create an instance of NSString is like this:\
    \ \"@string content here\"\n\n> Technically, NSLog() is part of Apple's Foundation\
    \ Framework and is not actually part of the Objective-C language. However, the\
    \ Foundation Framework is ubiquitous throughout Objective-C programming. The Foundation\
    \ Framework is not open-source and cannot be used outside of Development, there\
    \ are open-source alternatives to the framework which are associated with OPENStep\
    \ and GNUStep.\n\n# ## Compiling the program\n\nAssuming we compile our Hello\
    \ World program, which consists of a single hello.m file, the command to compile\
    \ the executable is:\n\n```\nclang -framework Foundation hello.m -o hello\n```\n\
    \nThen you can run it:\n\n```\n./hello\n```\n\nThis will output:\n\nHello World!\n\
    \nGoalKicker – Objective-C® Notes for Professionals"
