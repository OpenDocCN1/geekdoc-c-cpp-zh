  md: "# Chapter 12: Key Value Coding / Key Value Observing\n\n# Section 12.1: Most\
    \ Common Real Life Key Value Coding Example\n\nKey Value Coding is integrated\
    \ into NSObject using NSKeyValueCoding protocol.\n\nWhat this means?\n\nIt means\
    \ that any id object is capable of calling forKey method and its various variants\
    \ like forKeyPath etc.\n\nIt also means that any id object can invoke setValue\
    \ method and its various variants to.\n\nExample:\n\n```\nid obj = [[Class alloc]\
    \ init];\nid value = [obj forKey:@\"myNumber\"];\n\nint myNumberAsInt = [intValue];\n\
    [obj setValue:@myNumberAsInt] forKey:@\"myNumber\"];\n```\n\nExceptions:\n\nAbove\
    \ example assumes that MyClass has an NSNumber called myNumber. If myNumber does\
    \ not appear in MyClass interface definition, an NSUndefinedException can be raised\
    \ at possibly lines 2 and 5 - popularly known as:\n\n> this class is not key value\
    \ coding-compliant for the keyNumber.\n\nWhy is this so powerful?\n\nYou can write\
    \ code that accesses properties of a class dynamically, without needing interface\
    \ for that class. This means a table view can display values from any properties\
    \ of an NSObject derived object, with its property names supplied dynamically\
    \ at runtime.\n\nIn the example above, the code can well work without MyClass\
    \ being available and id type obj being available to calling code.\n\n# Section\
    \ 12.2: Querying KVC Data\n\n```\nif ([[dataObject objectKey:@\"yourVariable\"\
    ] isEqualToString:@\"Hello World\\]) {\n  return YES;\n} else {\n  return NO;\n\
    }\n```\n\nYou can query values stored using KVC quickly and easily, without needing\
    \ to retrieve or cast them as local variables."
