  md: '# # Chapter 7: Methods


    # ## Section 7.1: Class methods


    A method is called on the method it belongs to, not an instance of it. This is
    possible because Objective-C classes are also objects. To denote a method as a
    class method, change the - to a +:


    ```

    + (void)hello {

    NSLog("Hello World");

    }

    ```


    # ## Section 7.2: Pass by value parameter passing


    In pass by value of parameter passing to a method, actual parameter value is copied
    to formal parameter value. So actual parameter value will not change after returning
    from called function.


    ```

    @interface SwapClass : NSObject

    -(void)swap:(NSInteger)num1 and2:(NSInteger)num2;

    @end


    @implementation SwapClass

    -(void)num:(NSInteger)num1 and2:(NSInteger)num2;

    int temp;

    temp = num1;

    num1 = num2;

    num2 = temp;

    @end

    ```


    Calling the methods:


    ```

    Integer a=10, b=20;

    SwapClass *swap = [[SwapClass alloc] init];nNSLog("Before calling swap: a=%d,b=%d",a,b);

    [swap swap:a andNum:b];

    NSLog("After calling swap: a=%d,b=%d",a,b);

    ```


