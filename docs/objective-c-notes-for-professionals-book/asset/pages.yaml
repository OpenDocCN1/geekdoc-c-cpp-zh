    \ method that filters numbers.\n\nIt is good practice to add a prefix (PF) to\
    \ the method to ensure we don't overwrite any future NSArray methods.\n\n```\n\
    @interface NSArray (PFilter)\n- (NSArray *)filterSmaller:(double)number;\n@end\n\
    \n@implementation NSArray (PFilter)\n- (NSArray *)filterSmaller:(double)number\
    \ {\n  NSMutableArray *result = [NSMutableArray array];\n  for (id val in self)\
    \ {\n    if ([val isKindOfClassOf:[NSNumber class]] && [val doubleValue] >= number)\
