  md: "# # Chapter 39: Blocks\n\n# ## Section 39.1: Block Typedefs\n\n```\ntypedef\
    \ double (*Operation)(double first, double second);\n```\n\nIf you declare a block\
    \ type as a typedef, you can use the new type name instead of the full description\
    \ of the arguments and return values. This defines Operation as a block that takes\
    \ two doubles and returns a double.\n\nThe type can be used as a parameter of\
    \ a method:\n\n+   - (double)doOperation:(Operation)operation\n  first:(double)first\n\
    \  second:(double)second;\n\nor as a variable type:\n\n```\nOperation addition\
    \ = ^double(double first, double second){\n  return first + second;\n}\n```\n\n\
    ```\n// Returns 3.0\n[self doOperation:addition\n  first:1.0\n  second:2.0];\n\
    ```\n\nWithout the typedef, this is much messier:\n\n+   - (double)doOperation:(double)(^double,\
    \ double))operation\n  first:(double)first\n  second:(double)second;\n\n```\n\
    double (^addition)(double, double) = // ...\n```\n\n# ## Section 39.2: Blocks\
    \ as Properties\n\n```\n@interface NSObject : SuperClass\n@property (copy) (^blockProperty)(NSString\
    \ *string);\n@End\n```\n\nWhen assigning, since block retains blockProperty, block\
    \ should not contain a string reference to self. Mutual strong references are\
    \ called a \"retain cycle\" and will prevent the release of either object.\n\n\
    ```\n__weak __typeof(self) weakSelf = self;\nself.blockProperty = ^(NSString *string)\
    \ {\n  // refer only to weakSelf here. self will cause a retain cycle\n}\n```\n\
    \nIt is highly unlikely, that block might be delegated inside the block, somewhere\
    \ during the execution. In this case weakSelf becomes nil and all messages to\
    \ it have no effect effect. This might leave the object in an unknown state. This\
    \ can be avoided by retaining weakSelf with a __strong ivar during block execution\
    \ and clean up afterward.\n\n```\n__weak __typeof(self) weakSelf = self;\n```"
