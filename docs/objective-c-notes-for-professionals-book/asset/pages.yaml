  md: "# Chapter 35: Fast Enumeration\n\n# Section 35.1: Fast enumeration of an NSArray\
    \ with index\n\nThis example shows how to use fast enumeration in order to traverse\
    \ through an NSArray. With this way you can also track object's index while traversing.\n\
    \nSuppose you have an array,\n\n```\nNSArray *weekDays = @[@\"Monday\", @\"Tuesday\"\
    , @\"Wednesday\", @\"Thursday\", @\"Friday\", @\"Saturday\", @\"Sunday\\];\n```\n\
    \nNow you can traverse an array like,\n\n```\nweekDays enumerateUsingBlock:(id\
    \ obj, NSUInteger idx, BOOL *stop) {\n    //... Do your usual stuff here\n\n \
    \   obj // This is the current object\n    idx // This is the index of the current\
    \ object\n    stop // Set to true if you want to stop\n}\n];\n```\n\n# Section\
    \ 35.2: Fast enumeration of an NSArray\n\nThis example shows how to use fast enumeration\
    \ in order to traverse through an NSArray.\n\nWhen you have an array, such as\n\
    \n```\nNSArray *collection = @[@\"fast\", @\"enumeration\", @\"in objc\"];\n```\n\
    \nYou can use the for... in syntax to go through each item of the array, automatically\
    \ starting with the first at index 0 stopping with the last item:\n\n```\nfor\
    \ (NSString *item in collection) {\n    NSLog(\"item: %@\", item);\n}\n```\n\n\
    In this example, the output generated would look like\n\n```\n// item: fast\n\
    // item: enumeration\n// item: in objc\n```"
