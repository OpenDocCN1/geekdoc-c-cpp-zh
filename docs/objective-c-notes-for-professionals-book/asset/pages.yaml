    # # Section 27.4: Manually firing a timer


    ```

    [timer fire];

    ```


    Calling the timer method causes an NSTimer to perform the task it would usually
    have performed on a schedule.


    In a non-repeating timer, this will automatically invalidate the timer. That is,
    calling fire before the time interval is up will result in only one invocation.


    In a repeating timer, this will simply invoke the action without interrupting
    the usual schedule.'
