  md: "# # Chapter 11: Continue and Break!\n\n# ## Section 11.1: Continue and Break\
    \ Statement\n\nThe continue statement in Objective-C programming language works\
    \ somewhat like the break statement. Instead of forcing termination, however,\
    \ continue forces the next iteration of the loop to take place, skipping any code\
    \ in between.\n\nFor the loop, continue statement causes the conditional test\
    \ and increment portions of the loop to execute. For the while and do-while loops,\
    \ continue statement causes the program control pass to the conditional tests.\n\
    \n```\n#import <Foundation.h>\nint main () {\n  /* local variable definition */\n\
    \  int a = 10;\n\n  /* do loop execution */\n  do {\n    if (a == 15) {\n    \
    \  /* skip the iteration */\n      a = a + 1;\n      continue;\n    }\n    NSLog(\"\
    value of a: %d\\n\", a);\n    a++;\n  }while (a < 20);\n\n  return 0;\n}\n```\n\
    \nOutput:\n\n```\n2013-09-07 22:20:35.647 demo[2998] value of a: 10\n2013-09-07\
