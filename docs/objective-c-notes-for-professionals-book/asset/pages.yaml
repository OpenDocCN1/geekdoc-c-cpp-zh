  md: '# Section 49.3: Thread-local storage


    Every thread has access to a mutable dictionary that is local to the current thread.
    This allows to cache information in an easy way without the need for locking,
    as each thread has its its own dedicated mutable dictionary:


    ```

    NSMutableDictionary *localStorage = [NSThread currentThread].threadDictionary;

    localStorage[someKey] = someValue;

    ```


    The dictionary is automatically released when the thread terminates.'
