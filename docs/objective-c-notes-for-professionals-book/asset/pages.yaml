  md: '# # Objective-C


    Notes for Professionals


    # ## Chapter 2: Basic Data Types


    # ### 2.1: SEL


    Selectors are the names of methods in Objective-C.


    In Objective-C, there are two types of selectors: basic and encoded.


    - **Basic selectors**: A basic selector has a name and a number of arguments.


    - **Encoded selectors**: An encoded selector has a name, a number of arguments,
    and the value of the first argument. This is used when you want to manually invoke
    a method.


    ```

    ```objective-c

    sel = @sel(methodName:);

    ```

    ```


    If the selector is not available, the @sel expression returns `nil`.


    ```

    ```objective-c

    SEL sel = @sel(methodName);

    ```

    ```


    You can also create a selector using the sel_FromString function.


    ```

    ```objective-c

    SEL sel = sel_FromString("methodName");

    ```

    ```


    # ### 2.2: BOOL


    Booleans are used to represent true or false values.


    ```

    ```objective-c

    BOOL isTrue = YES;

    BOOL isFalse = NO;

    ```

    ```


    Booleans are often used in collections like arrays.


    ```

    ```objective-c

    NSNumber *boolTrue = @YES;

    NSNumber *boolFalse = @NO;

    ```

    ```


    # ## Chapter 5: Classes and Objects


    # ### 5.1: Difference between allocation and initialization


    Allocation reserves memory for an object, while initialization sets up the object''s
    state.


    ```

    ```objective-c

    MyClass *instance = [[MyClass alloc] init];

    ```

    ```


    The alloc method allocates memory, and the init method initializes the object.


    # ### 5.2: Creating classes with initialization values


    You can pass values during initialization when creating an object.


    ```

    ```objective-c

    MyClass *instance = [[MyClass alloc] initWithName:@"Name"];

    ```

    ```


    # ## Chapter 13: NSString


    NSString is a class used to represent strings of characters in Objective-C.


    # ### 13.1: Encoding and Decoding


    NSString supports various encodings, such as UTF-8.


    ```

    ```objective-c

    NSString *str = [NSString stringWithString:@"Hello" encoding:NSUTF8StringEncoding
    error:nil];


    ```


    # ### 13.2: String Length


    The length method returns the number of characters in the string.


    ```

    ```objective-c

    UInteger len = [str length];

    ```

    ```


    # ### 13.3: Comparing Strings


    Strings can be compared using the isEqual method.


    ```

    ```objective-c

    BOOL equal = [str1 isEqual:str2];

    ```

    ```


