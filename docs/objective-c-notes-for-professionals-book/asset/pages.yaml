  md: '# Chapter 33: Subscribing


    # Section 33.1: Subscripts with NSArray


    Subscripts can be used to simplify retrieving and setting elements in an array.
    Given the following array


    ```

    NSArray *fruit = @[@"Apples", @"Bananas", @"Cherries"];

    ```


    This line


    ```

    [fruit objectAtIndexIndex: 1];

    ```


    Can be replaced by


    ```

    fruit[1];

    ```


    They can also be used to set an element in a mutable array.


    ```

    NSMutableArray *fruit = @[@"Apples", @"Bananas", @"Cherries\] mutableCopy;

    fruit[1] = @[@"Blueberries\];

    NSLog("%@%"); //Blueberries

    ```


    If the index of the subscript equals the count of the array, the element will
    be appended to the array.


    Repeated subscripts may be used to access elements of nested arrays.


    ```

    NSArray *fruit = @[@"Apples", @"Bananas", @"Cherries\];

    NSArray *vegetables = @[@"Avocado", @"Beans", @"Carrots\];

    NSArray *produce = @[@*fruit, *vegetables\];

    ```


    ```

    NSLog("%@%"); produce[[0]]; //Bananas

    ```


    # Section 33.2: Custom Subscribing


    You can subscribe to your classes by implementing the required methods.


    For indexed subscript (like arrays):


    +   - (id)objectAtIndexSubscript:(NSInteger)idx

    - (void)setObject:(id)obj atIndexedSubscript:(NSInteger)idx


    For keyed subscript (like dictionaries):


    +   - (id)objectForKeyedSubscript:(id)key

    - (void)setObject:(id)obj forKeyedSubscript:(id <NSObjectKey>)key


    # Section 33.3: Subscribing with Dictionary


    Subscripts can be used with NSMutableDictionary and NSMutableDictionary. The following
    code is:


    ```

    NSMutableDictionary *dictionary = @[@"Foo": @"Bar"] mutableCopy;

    [dictionary setObject:@"Baz" forKey:@@"Foo\];

    NSLog("%@%"); [dictionary objectForKey:@"Foo\]]; // Baz

    ```'
