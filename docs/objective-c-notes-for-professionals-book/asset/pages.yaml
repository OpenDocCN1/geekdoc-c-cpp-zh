  md: "# Chapter 37: Protocols\n\n# Section 37.1: Optional and required methods\n\n\
    By default, all the methods declared in a protocol are required. This means that\
    \ any class that conforms to this protocol must implement those methods.\n\nIt\
    \ is also possible to declare optional methods. These method can be implemented\
    \ only if needed.\n\nYou mark optional methods with the @optional directive.\n\
    \n```\n@protocol NewProtocol\n- (void)protocolMethod:(id)argument;\n- @optional\n\
    - (id)anotherMethod;\n- @end\n```\n\nIn this case, only anotherMethod is marked\
    \ as optional; the methods without the @optional directive are assumed to be required.\n\
    \nThe @optional directive applies to methods that follow, until the end of the\
    \ protocol definition, or until another directive is found.\n\n```\n@protocol\
    \ NewProtocol\n- (void)protocolMethod:(id)argument;\n- @optional\n- (id)anotherMethod;\n\
    - (id)anotherMethod:(id)argument;\n- @required\n- (void)lastProtocolMethod;\n\
    - @end\n```\n\nThis example defines a protocol with two optional methods and two\
    \ required methods.\n\n# Section 37.2: Checking existence of optional method implementations\n\
    \n```\nif ([object respondsToSelector:@selector(someOptionalMethodInProtocol:))\n\
    {\n  [object someOptionalMethodInProtocol:argument];\n}\n```\n\n# Section 37.3:\
    \ Forward Declarations\n\nIt's possible to declare protocol name without methods:\n\
    \n```\n@protocol Person;\n```\n\nuse it code (class definition, etc):\n\n```\n\
    @interface World : NSObject\n@property (strong, nonatomic) NSArray<id<some>> *employees;\n\
    @end\n```"
