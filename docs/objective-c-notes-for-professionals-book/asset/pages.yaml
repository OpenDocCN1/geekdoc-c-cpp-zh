    IMP is defined by:


    ```

    typedef id (*IMP)(id self,SEL _cmd,...);

    ```


    To access this IMP, the message "methodForSelector" can be used.


    # Example 1:


    ```

    IMP ImpDoSomething = [myObject methodSelector:@selector(doSomething)];

    ```


    The method addressed by the IMP can be called by dereferencing the IMP.


    ```

    ImpDoSomething(myObject, @selector(doSomething));

    ```


    So these calls are equal:


    ```

    myImpDoSomething(myObject, @selector(doSomething))

    [myObject doSomething]

    [myObject performSelector:mySelector]

    [myObject performSelector:@selector(doSomething)]

    [myObject performSelector:NSStringWithString("doSomething")]

    ```


    # Example 2:


    ```

    SEL otherWaySelector = NSStringWithString(@methodWithFirstAndSecondAndThird:);

    ```


    ```

    IMP methodImplementation = [self methodForSelector:otherWaySelector];

    ```


    ```

    result = methodImplementation(

    self,

    betterWaySelector,

    first,

    second,

    third

    );

    ```


    ```

    NSLog(@methodForSelector : "@", result);

    ```


    Here, we call [self methodForSelector returns us a pointer to the C function that
    actually implements the method, which we can subsequently call directly.


    # Section 2.5: NSInteger and NSInteger


    The NSInteger is a typedef for either an int or long depending on the architecture.
    The same goes for an NSInteger which is a typedef for the unsigned integers. If
    you check the NSInteger you will see the following:


    ```

    #if _LP64_ || ((TARGET_OS_EMBEDDED && TARGET_OS_IPHONE) || TARGET_OS_WIN32 ||
    NS_BUILD_32_LIKE_64)

    type long NSInteger;

    type unsigned long NSInteger;

    #else

    type int NSInteger;

    type unsigned int NSInteger;

    #endif

    ```


    The difference between an signed and unsigned int or long is that a signed int
    or long can contain negative'
