  md: '# # Chapter 10: BOOL / bool / Boolean / NCFFBoolean


    # ## Section 10.1: BOOL/Boolean/bool/NSCFBoolean


    +   1. BOOL is a datatype defined in C99.

    2. Boolean values are used in conditionals, as if or while statements, to conditionally
    perform logic or repeat execution. When evaluating a conditional statement, the
    value O is considered "false", while any other value is considered "true". Because
    NULL and nil are defined as 0, conditional statements on these nonexistent values
    are also evaluated as "false".

    3. BOOL is an Objective-C type signed with the markers YES and NO to return true
    and false


    From the definition obj.c:


    ```

    #if (TARGET_OS_IPHONE && __LP64__) || TARGET_OS_WATCH

    ttypedef bool BOOL;

    else

    typef signed char BOOL;

    // BOOL is explicitly signed so @encode(BOOL) == "c" rather than "C"

    // even if -signed-char is used.

    #endif

    ```


    ```

    #define YES ((BOOL)1)

    #define NO ((BOOL)0)

    ```


    +   4. NSCBoolean is a private class in the NSString class cluster. It is a bridge
    to the CFBooleanRef type, which is used to wrap boolean values for Core Foundation
    property lists and collections. CFBoolean defines the constants CFBooleanTrue
    and CFBooleanFalse. Because CFNumberRef and CFBooleanRef are different types in
    Core Foundation, it makes sense that they are represented by different bridging
    classes in NSNumber.


    # ## Section 10.2: BOOL VS Boolean


    BOOL


    +   * Apple''s Objective-C frameworks and most Objective-C/Cocoa code uses BOOL.

    * Use BOOL in objective-c, when dealing with CoreFoundation APIs


    Boolean


    +   * Boolean is an old Carbon keyword, defined as an unsigned char'
