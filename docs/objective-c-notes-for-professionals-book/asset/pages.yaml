  md: '```

    NSNumber *no = @NO; // Equivalent to [NSNumber numberWithBool:NO]

    ```


    The BOOL implementation is directly based on C''s, in that it is a typedef of
    the C99 standard type bool. The YES and NO values are defined by __obj_c and __obj_c,
    respectively. These special values are builtin introduced by Clang, which are
    translated to (BOOL) and (BOOL). If they are not available, YES and NO are defined
    directly as the cast-int form. The definitions are found in the Objective-C runtime
    header obj.h


    # Section 2.3: id


    id is the generic object pointer, an Objective-C type representing "any object".
    An instance of Objective-C class can be stored in an id. An id and any other type
    can be assigned back and forth without casting:


    ```

    id anonymousSurname = @"Doe";

    NSString * surname = anonymousSurname;

    id anonymousFullName = [NSString stringWithFormat:@"%@", "John", surname];

    ```


    This becomes relevant when retrieving objects from a collection. The return types
    of methods like objectAtIndex: are id for exactly this reason.


    ```

    DataRecord * record = [records objectAtIndex:index];

    ```


    It also means that a method or function parameter typed as id can accept any object.

    When an object is typed as id, any known message can be passed to it: method dispatch
    does not depend on the compile-time type.


    ```

    NSString * extinctBirdMaybe =

    [anonymousSurname stringByAppendingString:anonymousSurname];

    ```


    A message that the object does not actually respond to will still cause an exception
    at runtime, of course.


    ```

    NSDate * nope = [anonymousSurname addTimeInterval:10];

    // Raises "Does not respond to selector" exception

    ```


    Guarding against exception.


    ```

    NSDate * nope;

    if([anonymousSurname isKindOfClassOfClass:[NSDate class]]) {

    nope = [anonymousSurname addTimeInterval:10];

    }

    ```


    The id type is defined in objc.h


    ```

    typedef struct objc_object {

    Class isa;

    } *id;

    ```


    # Section 2.4: IMP (implementation pointer)


    IMP is a C type referring to the implementation of a method, also known as an
    implementation pointer. It is a pointer to the start of a method implementation.


    Syntax:'
