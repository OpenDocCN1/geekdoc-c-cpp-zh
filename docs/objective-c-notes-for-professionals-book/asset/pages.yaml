  md: "# Chapter 49: Multi-Threading\n\n# Section 49.1: Creating a simple thread\n\
    \nThe most simple way to create a thread is by calling a selector \"in the background\"\
    . This means a thread is created to execute the selector. The receiving object\
    \ can be any object, not just self, but it needs to respond to the selector.\n\
    \n```\n(void)createThread {\n    [self performSelectorInBackground:@selector(threadMainWithOptionalArgument:)\n\
    \     withObject:someObject];\n}\n\n(void)threadMainWithOptionalArgument:(id)argument\
    \ {\n    // To avoid memory leaks, the first thread method needs to do\n    //\
    \ create a new autorelease pool, either manually or via \"@autoreleasepool\"\n\
    \    @autoreleasepool {\n        // The thread code should be here.\n    }\n}\n\
    ```\n\n# Section 49.2: Create more complex thread\n\nUsing a subclass allows implementation\
    \ of more complex threads (for example, to allow passing arguments or to encapsulate\
    \ all related helper methods in one class). Additionally, the NSTThread instance\
    \ can be saved in a property and can be queried about its current state (whether\
    \ it's still running).\n\nThe NSTThread class supports a method cancel that can\
    \ be called from any thread, which sets the cancelled property in a thread-safe\
    \ way. The thread implementation can query (and/or observe) the cancelled property\
    \ and exit its main method. This can be used to gracefully shut down a worker\
    \ thread.\n\n```\n// Create a new NSTThread subclass\n@interface MyThread : NSTThread\n\
    \n// Add properties for values that need to be passed from the caller to the new\n\
    // thread. Caller must not modify these after the thread is started to avoid\n\
    // threading issues (or the properties must be made thread-safe using locks).\n\
    @property NSString someProperty;\n\n@end\n\n@implementation MyThread\n\n(void)main\
    \ {\n    @autoreleasepool {\n        // The new thread method. Some property:\
    \ %ld\n        NSLog(\"@The new thread. Some property: %ld\", (long)self.someProperty);\n\
    \    }\n}\n\n@end\n```\n\n```\nMyThread *thread = [[MyThread alloc] init];\nthread.someProperty\
    \ = 42;\n[thread start];\n```"
  merge: -1
  pgno: 118
