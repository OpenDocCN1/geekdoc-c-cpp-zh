  \ 宏还是函数？\n\n许多任务可以通过使用宏或函数来完成。你应该使用哪一个？没有硬性的规则，但这里是一些考虑。\n\n宏比普通函数更难使用，因为如果你不小心（unwary），可能会产生副作用。某些编译器限制宏定义为一行，即使你的编译器没有这样做，最好也遵守这一限制。\n\
  \n宏与函数的选择代表了时间和空间之间的权衡。宏产生内联代码；即在程序中插入语句。如果你使用宏 20 次，就会得到 20 行代码。如果你使用函数 20 次，程序中只有一份函数副本，因此节省了空间。另一方面，程序控制必须跳转到函数所在的位置返回，这比内联代码慢。\n\
  \n宏的优势在于它们不担心变量类型。（因为它们处理的是字符串，而不是实际值。）因此，`SQUARE(x)` 宏可以同样适用于 `int` 或 `float`。\n\
  \nC99 提供了第三种替代方案——内联函数。我们本章稍后会讨论它们。\n\n程序员通常使用宏来处理如下简单函数：\n\n（此处省略示例）\n\n这里是一些需要注意的点：\n\
  \n- 记住宏名称中没有空格，但替换字符串中可以空格。ANSI C 允许参数列表中出现空格。\n- 使用大写字母命名宏函数。这种约定没有使用大写字母命名宏常量那样普遍。然而，使用大写字母的一个良好理由是提醒自己警惕可能的宏副作用。\n\
