  \ C 功能——C 预处理器，并学习如何定义和使用符号常量。\n\n### 介绍性程序\n\n到这里，你可能期望每个章节的开头都有示例程序，因此列表 4.1 是一个与用户进行对话的程序。为了增加变化，代码使用了新的注释样式。\n\
  \n列表 4.1 talkback.c 程序\n\n点击此处查看代码图像\n\n* * *\n\n```c\n// talkback.c -- 一个好奇的、信息丰富的程序\n\
  \n#include <stdio.h>\n\n#include <string.h>      // 用于 strlen() 原型\n\n#define DENSITY\
  \ 62.4      // 人体密度，单位为磅/立方英\n\nint main()\n{\n    float weight, volume;\n    int\
  \ size, letters;\n    char name[40];        // name 是一个 40 个字符的数组\n    printf(\"\
  Hi! What's your first name?\\n\");\n    scanf(\"%s\", name);\n    printf(\"%s, what's\
  \ your weight in pounds?\\n\", name);\n    scanf(\"%f\", &weight);\n    size = sizeof\
  \ name;\n    letters = strlen(name);\n    volume = weight / DENSITY;\n    printf(\"\
  Well, %s, your volume is %2.2f cubic feet.\\n\",\n           name, volume);\n  \
  \  printf(\"Also, your first name has %d letters,\\n\",\n           letters);\n\
  \    printf(\"and we have %d bytes to store it.\\n\", size);\n    return 0;\n}\n\
  ```\n\n* * *\n\n运行 `talkback.c` 会产生如下结果：\n\n点击此处查看代码图像\n\nHi! What's your first\
