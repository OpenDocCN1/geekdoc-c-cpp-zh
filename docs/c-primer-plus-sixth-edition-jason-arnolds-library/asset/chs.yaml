  \n***\n\n# 总结：条件运算符\n\n## 条件运算符：\n\n`?:`\n\n## 通用注释：\n\n该运算符接受三个操作数，每个操作数都是一个表达式。它们的排列如下：\n\
  \n`expression1 ? expression2 : expression3`\n\n如果 `expression1` 为真，整个表达式的值等于 `expression2`\
  \ 的值。否则，它等于 `expression3` 的值。\n\n### 示例：\n\n`(5 > 3) ? 1 : 2` 的值为 `1`。\n\n`(3 >\
  \ 5) ? 1 : 2` 的值为 `2`。\n\n`(a > b) ? a : b` 的值为 `a` 或 `b` 中的较大者。\n\n***\n\n## 循环辅助：continue\
  \ 和 break\n\n通常，在进入循环体后，程序会在执行下一次循环测试之前执行循环体中的所有语句。`continue` 和 `break` 语句允许你跳过循环的一部分甚至终止循环，这取决于在循环体中进行的测试。\n\
  \n### continue 语句\n\n该语句可以在三种循环形式中使用。当遇到它时，它会导致跳过当前迭代的剩余部分并开始下一次迭代。如果 `continue`\
  \ 语句位于嵌套结构内部，它只会影响包含它的最内层结构。让我们在列表 7.9 的短程序中尝试 `continue`。\n\n列表 7.9 程序 `skipart.c`\n\
  \n点击此处查看代码图像\n\n***\n\n```c\n/* skippart.c  -- 使用 continue 跳过循环的一部分 */\n#include\
  \ <stdio.h>\n\nint main(void)\n{\n    const float MIN = 0.0f;\n    const float MAX\
  \ = 100.0f;\n    float score;\n    float total = 0.0f;\n    int n = 0;\n    float\
  \ min = MAX;\n    float max = MIN;\n    printf(\"输入第一个分数 (q 退出): \");\n    while\
  \ (scanf(\"%f\", &score) == 1)\n    {\n        if (score < MIN || score > MAX)\n\
  \        {\n            printf(\"%0.1f 是一个无效值。请重试: \",\n                   score);\n\
  \            continue;  // 跳到 while 循环测试条件\n        }\n        printf(\"接受 %0.1f:\\\
  n\", score);\n        min = (score < min)? score: min;\n        max = (score > max)?\
  \ score: max;\n        total += score;\n        n++;\n        printf(\"输入下一个分数 (q\
  \ 退出): \");\n    }\n    if (n > 0)\n    {\n        printf(\"%d 个分数的平均分是 %0.1f。\\\
  n\", n, total / n);\n        printf(\"低分 = %0.1f, 高分 = %0.1f\\n\", min, max);\n\
  \    }\n    else\n        printf(\"未输入有效分数。\\n\");\n    return 0;\n}\n```\n\n***\n\
  \n在列表 7.9 中，`while` 循环读取输入直到你输入非数字数据。循环内的 `if` 语句过滤掉无效分数。例如，如果你输入 `188`，程序会告诉你 `188\
  \ 是一个无效值`。然后 `continue` 语句导致程序跳过循环的剩余部分（该部分用于处理输入）。相反，程序通过尝试读取下一个值来开始下一次循环。\n\n\
  注意，有两种方法可以避免 `continue`。一种方法是省略 `continue` 并将循环的剩余部分变为 `else` 块：\n\n点击此处查看代码图像\n\
  \n```c\nif (score < 0 || score > 100)\n    /* printf 语句 */\nelse\n{\n}\n```\n\n\n\
  \n\n\n# 图 7.3 比较 `break` 和 `continue`。\n\n当存在两个独立的退出原因时，有时使用 `break` 来退出循环。列表 7.10\
  \ 使用了一个计算矩形面积的循环。如果你对矩形的长度或宽度输入非数字内容，循环将终止。\n\n## 列表 7.10 `break.c` 程序\n\n点击此处查看代码图像\n\
  \n```c\n/* break.c -- uses break to exit a loop */\n\n#include <stdio.h>\n\nint\
  \ main(void)\n{\n    float length, width;\n    printf(\"Enter the length of the\
  \ rectangle:\\n\");\n    while (scanf(\"%f\", &length) == 1)\n    {\n        printf(\"\
  Length = %0.2f:\\n\", length);\n        printf(\"Enter its width:\\n\");\n     \
  \   if (scanf(\"%f\", &width) != 1)\n            break;\n        printf(\"Width\
  \ = %0.2f:\\n\", width);\n        printf(\"Area = %0.2f:\\n\", length * width);\n\
  \        printf(\"Enter the length of the rectangle:\\n\");\n    }\n    printf(\"\
  Done.\\n\");\n    return 0;\n}\n```\n\n你也可以通过这种方式控制循环：\n\n点击此处查看代码图像\n\n```c\nwhile\
  \ (scanf(\"%f %f\", &length, &width) == 2)\n```\n\n然而，使用 `break` 可以使得单独回显每个输入值变得简单。\n\
  \n与 `continue` 一样，当 `break` 会使代码复杂时，不要使用它。例如，考虑以下循环：\n\n点击此处查看代码图像\n\n```c\nwhile\
  \ ((ch = getchar()) != '\\n')\n{\n    if (ch == '\\t')\n        break;\n    putchar(ch);\n\
  }\n```\n\n如果两个测试都放在同一个地方，逻辑会更清晰：\n\n点击此处查看代码图像\n\n```c\nwhile ((ch = getchar() )\
  \ != '\\n' && ch != '\\t')\n    putchar(ch);\n```\n\n`break` 语句是 `switch` 语句必不可少的辅助，接下来将介绍。\n\
  \n`break` 语句直接将执行引导到循环后的第一个语句；与 `for` 循环中 `continue` 的不同，控制部分的更新部分会被跳过。嵌套循环中的 `break`\
  \ 只会将程序带出内层循环；要退出外层循环需要第二个 `break`：\n\n点击此处查看代码图像\n\n```c\nint p, q;\nscanf(\"%d\"\
  , &p);\nwhile ( p > 0)\n{\n    printf(\"%d\\n\", p);\n    scanf(\"%d\", &q);\n \
  \   while( q > 0)\n    {\n        printf(\"%d\\n\",p*q);\n        if (q > 100)\n\
  \            break;           // break from inner loop\n        scanf(\"%d\", &q);\n\
  \    }\n    if (q > 100)\n        break;           // break from outer loop\n  \
  \  scanf(\"%d\", &p);\n}\n```\n\n### 多选题：switch 和 break\n\n条件运算符和 `if else` 结构使得编写在两种方案之间选择的程序变得很容易。然而，有时程序需要从多个方案中选择一个。你可以通过使用\
  \ `if else if...else` 来实现。但在许多情况下，使用 C 语言的 `switch` 语句更为方便。列表 7.11 展示了 `switch`\
  \ 的工作。该程序读取一个字母，然后打印以该字母开头的动物作为响应。\n\n## 列表 7.11 `animals.c`\n\n点击此处查看代码图像\n\n```c\n\
  /* animals.c -- uses switch statement */\n#include <stdio.h>\n#include <ctype.h>\n\
  int main(void)\n{\n    char ch;\n    printf(\"Give me a letter of the alphabet,\
  \ and I will give \");\n    printf(\"an animal name\\nbeginning that letter.\\n\"\
  );\n    printf(\"Please type in a letter # to end my act.\\n\");\n    while ((ch\
  \ = getchar()) != '#')\n    {\n        if ('n' == ch)\n            continue;\n \
  \       if (islower(ch))  /* lowercase only */\n            switch (ch)\n      \
  \      {\n                case 'a':\n                    printf(\"ali, a wild sheep\
  \ of Asia\\n\");\n                    break;\n                case 'b':\n      \
  \              printf(\"babirus, a wild pig of Malay\\n\");\n                  \
  \  break;\n                case 'c':\n                    printf(\"coati, racoonlike\
  \ mammal\\n\");\n                    break;\n                case 'd':\n       \
  \             printf(\"desman, aquatic, molelike critter\\n\");\n              \
  \      break;\n                case 'e':\n                    printf(\"echidna,\
  \ the spiny anteater\\n\");\n                    break;\n                case 'f':\n\
  \                    printf(\"fisher, brownish marten\\n\");\n                 \
  \   break;\n                default :\n                    printf(\"No animal starts\
  \ with that letter.\\n\");\n                    break;\n            }\n    }\n \
  \   printf(\"Goodbye!\\n\");\n    return 0;\n}\n```\n\n\n\n\n\n括号中的 `switch` 测试表达式必须是一个整数值（包括\
  \ `char` 类型）。`case` 标签必须是整数类型（包括 `char`）的常量或整数常量表达式（表达式中仅包含整数常数的表达式）。你不能在 `case`\
  \ 标签中使用变量。那么，`switch` 的结构如如下所示：\n\n点击此处查看代码图片\n\n```c\nswitch (integer expression)\n\
  {\n    case constant1:\n        statements     <--可选\n    case constant2:\n    \
  \    statements     <--可选\n    default :                <--可选\n        statements\
  \     <--可选\n}\n```\n\n### 仅读取行的第一个字符\n\n整合到 `animals.c` 中的另一个新功能是它是如何读取输出的。正如你可能在示例运行中注意到的那样，当输入\
  \ `dab` 时，只有第一个字符被处理了。这种丢弃行内其余部分的行为在寻找单个字符响应的交互程序中通常是理想的。以下代码产生了这种行为：\n\n点击此处查看代码图片\n\
  \n```c\nwhile (getchar() != '\\n')\n    continue;           /* 跳过输入行的剩余部分 */\n```\n\
  \n此循环从输入中读取字符，直到并包括回车键生成的换行符。注意，函数的返回值没有赋值给 `ch`，因此字符仅仅被读取并丢弃了。由于最后一个丢弃的字符是换行符，因此下一个要读取的字符是下一行的第一个字符。它被\
  \ `getchar()` 读取并赋值给外层 `while` 循环中的 `ch`。\n\n假设用户一开始就按回车，导致遇到的第一个字符是换行符。以下代码处理了这种情况：\n\
  \n```c\nif (ch == '\\n')\n    continue;\n```\n\n### 多标签\n\n你可以为给语句使用多个 `case` 标签，如列表\
  \ 7.12 所示。\n\n#### 列表 7.12 vowels.c 程序\n\n点击此处查看代码图片\n\n```c\n// vowels.c -- 多标签\n\
