  \ `FLT_DIG` 和 `DBL_DIG` 的值。显示的 1.0/3.0 值与这些值一致吗？\n\n**8.** 编写一个程序，要求用户输入行驶英里数和消耗的汽仑数。它应该计算并显示每加仑英里，显示小数点后一位。接下来，利用一加仑油约为\
  \ 3.785 升、一英里约为 1.609 公里的事实，它应该将每加仑英里转换为升/公里，显示小数点后一位。\n\n## 5. 运算符、表达式和语句\n\n现在你已经了解了表示数据的方法，让我们探索如何处理数据。C\
  \ 为此目的提供了丰富的操作。你可以进行算术运算、比较值、修改变量等。让我们从基础算术开始——加、减、乘、除。\n\n处理数据的另一个方面是组织你的程序，使其按照正确的顺序执行。C\
  \ 有几种语言特性可以帮助你实现这一点。这些特性之一就是循环，在本章中你将初次眼接触它。\n\n### 介绍循环\n\n列表 5.1 显示了一个示例程序，它通过少量算术运算来计算穿美国\
  \ 9 号鞋的脚长。为了增强你对循环的理解，这个第一个版本说明了在没有循环的情况下编程的局限性。\n\n列表 5.1 shoes.c 程序\n\n点击此处查看代码图像\n\
  \n```c\n/* shoes1.c -- 将鞋码转换为英寸 */\n#include <stdio.h>\n\n#define ADJUST 7.31 //\
  \ 一种符号常量\n\nint main(void)\n{\n    const double SCALE = 0.333; // 另一种类型的符号常量\n \
  \   double shoe, foot;\n\n    shoe = 9.0;\n    foot = SCALE * shoe + ADJUST;\n\n\
  \    printf(\"Shoe size (men's)   foot length\\n\");\n    printf(\"%10.1f %15.2f\
  \ inches\\n\", shoe, foot);\n\n    return 0;\n}\n```\n\n这是输出：\n\n点击此处查看代码图像\n\n\
  ```\nShoe size (men's)   foot length\n         9.0          10.31 inches\n```\n\n\
  该程序演示了创建符号常量的方法，并使用了乘法和加法。它获取你的鞋码（如果是 9 号）并告诉你你的脚有多长（英寸）。“但是，”你说，“我手算（或用计算器）解决这个问题比你输入程序要快得多。”你说得对。一个只处理一种鞋码的一次性程序是浪费时间和精力的。你可以通过将其写为交互式程序来让它更有用，但这仅仅触及了计算机的潜力。\n\
  \n\n\n\n我们需要的是某种方法，让计算机对一系列鞋码进行重复计算。毕竟，这正是使用计算机进行算术运算的主要原因之一。C 语言提供了几种进行重复计算的方法，我们在这里概述其中一种。这种方法被称为\
  \ `while loop`（`while 循环），它将使你能够对运算符进行更有趣的探索。列表 5.2 展示了改进后的鞋码程序。\n\n### 列表 5.2 shoes2.c\
  \ 程序\n\n```c\n/* shoes2.c -- 计算几种尺寸的脚长 */\n\n#include <stdio.h>\n\n#define ADJUST\
  \ 7.31             // 一种类型的符号常量\n\nint main(void)\n{\n    const double SCALE = 0.333;\
  \  // 另一种类型的符号常量\n    double shoe, foot;\n    printf(\"Shoe size (men's)    foot\
  \ length\\n\");\n    shoe = 3.0;\n    while (shoe < 18.5)      /* 开始 while 循环 */\n\
  \    {                       /* 块开始             */\n        foot = SCALE * shoe\
  \ + ADJUST;\n        printf(\"%10.1f %15.2f inches\\n\", shoe, foot);\n        shoe\
  \ = shoe + 1.0;\n    }                       /* 块结束             */\n    printf(\"\
  If the shoe fits, wear it.\\n\");\n    return 0;\n}\n```\n\n这是 `shoes2.c` 输出的精简版本：\n\
  \n```\nShoe size (men's)    foot length\n      3.0            8.31 inches\n    \
  \  4.0            8.64 inches\n      5.0            8.97 inches\n      6.0     \
  \       9.31 inches\n...\n      16.0           12.64 inches\n      17.0        \
  \   12.97 inches\n      18.0           13.30 inches\nIf the shoe fits, wear it.\n\
  ```\n\n（那些对鞋码有兴趣的人应该注意到，程序做了一个不现实的假设，即存在一套理性且统一的鞋码系统。现实世界的尺寸可能会不同。）\n\n以下是 `while`\
  \ 循环的工作原理。当程序第一次遇到 `while` 语句时，它会检查括号内的条件是否为真。在这种情况下，该表达式如下：\n\n`shoe < 18.5`\n\n\
  `<` 符号意味着“小于”。变量 `shoe` 被初始化为 `3.0`，这显然小于 `18.5`。因此，条件为真，程序继续执行下一条语句，即将尺寸转换为英寸。然后它打印结果。下一条语句将\
  \ `shoe` 增加 1.0，使其变为 4.0：\n\n`shoe = shoe + 1.0;`\n\n此时，程序返回到 `while` 部分检查条件。为什么在这一点呢？因为下一行是右大括号（`}`），而代码使用一组大括号（`{}`）来标记\
  \ `while` 循环的范围。两个括号之间的语句是重复执行的语句。这种情况一直持续，直到 `shoe` 达到 `19.0`。现在，条件 `shoe < 18.5`\
  \ 变为为假，因为 `19.0` 不小于 `18.5`。当这种情况发生时，控制权传递到 `while` 循环后的第一个语句。在这种情况下，就是 `printf()`\
  \ 语句。你可以轻松地修改此程序来执行其他转换。例如，将 `SCALE` 改为 `1.8` 并 `ADJUST` 改为 `32.0`，编写一个将摄氏度转换为华氏度的程序。将\
  \ `SCALE` 改为 `0.621` 并 `ADJUST` 改为 `0`，你就可以将公里转换为英里。`while` 循环提供了一种方便、灵活控制程序的方法。\n\
  \n### 基本运算符\n\nC 语言使用 `operators`（运算符）来表示算术运算。例如，`+` 运算符导致其两侧的两个值相加。如果你觉得 `operator`\
  \ 这个词听起来很奇怪，请记住“运算符”似乎是一个更好的选择。现在来看一下用于基本算术运算的运算符：`=`、`-`、`*` 和 `/`。C 语言没有幂运算符。然而，标准数学库提供了用于此目的\
  \ `pow()` 函数。例如，`pow(3.5, 2.2)` 返回 `3.5` 的 `2.2` 次方。\n\n#### 赋值运算符： =\n\n在 C 语言中，等号并不意味着“等于”。相反，它是一个值赋值运算符。语句\n\
  \n`shoe = 32;`\n\n将值 `32` 赋值给名为 `shoe` 的变量。也就是说，`=` 左侧的项目是变量的 `name`（名称），而右侧的项目是赋值给变量的\
  \ `value`（值）。`=` 符号被称为赋值运算符。再次，不要把这一行看作“shoe 等于 32”。相反，将其读作“将值 32 赋值给变量 shoe”。对于这个运算符，操作是从右向左的。\n\
  \n也许变量名和变量值之间的这种区分似乎是在钻牛角尖，但请考虑以下常见的计算机语句：\n\n`i = i + 1;`\n\n从数学角度来看，这条语句没有意义。如果你在一个有限数上加上\
  \ `1`，结果并不“等于”你开始时的那个数字，但作为一条赋值语句，它是完全合理的。它的意思是“找到变量 `i` 的值，加 1，然后将新值赋值给 `i`”（见图\
  \ 5.1）。\n\n![Image](img/05fig01.jpg)\n\n图 5.1 语句 `i = i + 1;`。\n\n这样的语句\n\n`32 =\
  \ shoe;`\n\n在 C 语言中没有意义（实际上是无效的），因为 `32` 是 C 所谓的 `rvalue`（右值），在这种情况下是一个字面量。你不能给常量赋值；它本身就是值。因此，当你坐在键盘前时，记住\
  \ `=` 左侧的项目必须是一个变量。实际上，左侧引用的是存储位置。最简单的方法是使用变量名，但正如后面看到的，“指针”可以指向一个位置。更通用地说，C 语言使用\
  \ `modifiable lvalue`（可修改左值）来标记可以赋值的实体。\n\n##### 术语：数据对象、左值、右值和操作数\n\n考虑赋值语句。它的目的是在内存位置存储值。`data\
  \ object`（数据对象）是数据存储区域的通用术语。C 标准直接使用 `object` 来表示这一概念。识别对象的一种方法是使用变量名。但正如你最终学会的，还有其他识别对象的方法。例如，你可以指定数组元素、结构体成员，或者使用对象地址的指针表达式。C\
  \ 使用 `lvalue`（左值）来表示任何此类标识特定数据对象的名称或表达式。`Object` 指的是实际的数据存储，而 `lvalue` 是用于标识或定位该存储的标签。\n\
  \n在 C 语言的早期，说某物是 `lvalue` 意味着两点：\n\n1. 它指定了一个对象，因此引用内存中的一个地址。\n2. 它可以位于赋值运算符的左侧，因此\
  \ `lvalue` 中的 “l”代表左侧。\n\n\n\n但随后 C 增加了 `const` 修饰符。这允许你创建一个对象，但该对象的值不能被更改。因此，`const`\
  \ 标识符满足了上述两个属性中的第一个，但没有满足第二个。此时，标准仍然继续使用 `lvalue` 来表示任何标识对象的表达式，尽管某些 `lvalues` 并不能用于赋值运算符的左侧。C\
  \ 增加了 `modifiable lvalue`（可修改的左值）这一术语来标识值可以被更改的对象。因此，赋值运算符的左侧应该是一个可修改的 lvalue。\n\
  \n目前的标准建议 `object locator value`（对象定位值）可能是一个更好的术语。\n\n术语 `rvalue` 指可以赋值给可修改的 lvalues\
  \ 但其本身不是 `lvalues` 的值。例如，考虑以下语句：\n\n```c\nbmw = 2002;\n```\n\n在这里，`bmw` 是可修改的 lvalue，而\
  \ `2002` 是一个 `rvalue`。正如你可能猜到的那样，`rvalue` 中的 `r` 来自 `right`（右侧）。`Rvalues` 可以是常量、变量或任何产生值的其他表达式，例如函数调用。事实上，目前的标准使用\
  \ `value of an expression`（表达式的值）而不是 `rvalue`。\n\n让我们来看一个短示例：\n\n```c\nint ex;\n\
  int why;\nint zee;\nconst int TWO = 2;\n\nwhy = 42;\nzee = why;\nex = TWO * (why\
  \ + zee);\n```\n\n在这里，`ex`、`why` 和 `zee` 都是可修改的 lvalue（或对象定位值）。它们可以用于赋值运算符的左侧或右侧。`TWO`\
  \ 是不可修改的 lvalue；它只能用于右侧。（在将 `TWO` 初始化为 `2` 的上下文中，`=` 运算符表示初始化而不是赋值，所以没有违反规则。）同时，`42`\
  \ 是一个 `rvalue`；它并不指向特定的内存位置。此外，虽然 `why` 和 `zee` 是可修改的 lvalue，但表达式 `(why + zee)`\
  \ 是一个 `rvalue`；它不代表特定的内存位置，你不能给它赋值。它只是程序计算出的临时值，在处理完成后就会被丢弃。\n\n只要你正在学习这些事物的名称，对于我们所说的“项”（例如“`=`\
  \ 左侧的项”），正确的术语是 `operand`（操作数）。`Operands` 是运算符操作的对象。例如，你可以将吃汉堡描述为将“吃”运算符作用于“汉堡”操作数；类似地，你可以说\
  \ `=` 运算符的左操作数应该是一个可修改的 lvalue。\n\n基础 C 赋值运算符比大多数运算符都要花哨一点。尝试 列表 5.3 中的短程序。\n\n\
  列表 5.3 golf.c 程序\n\n```c\n/* golf.c -- 高尔夫比赛计分卡 */\n#include <stdio.h>\n\nint main(void)\n\
  {\n    int jane, tarzan, cheeta;\n    cheeta = tarzan = jane = 68;\n    printf(\"\
  \               cheeta   tarzan    jane\\n\");\n    printf(\"First round score %4d\
  \ %8d %8d\\n\",cheeta,tarzan,jane);\n    return 0;\n}\n```\n\n许多语言会对此程序中的三重赋值感到望而却步，但\
  \ C 却惯常接受它。赋值是从右到左进行的：首先，`jane` 获得值 `68`，然后是 `tarzan`，最后是 `cheeta`。因此，输出如下：\n\n\
  ```\n               cheeta   tarzan    jane\nFirst round score   68      68    \
  \  68\n```\n\n#### 加法运算符：+ \n\n`addition operator`（加法运算符）导致两侧的两个值相加。例如，语句\n\n```c\n\
  printf(\"%d\", 4 + 20);\n```\n\n会导致打印数字 `24`，而不是表达式\n\n`4 + 20`。\n\n要相加的值（操作数）可以是变量，也可以是常量。因此，语句\n\
  \n```c\nincome = salary + bribes;\n```\n\n会导致计算机查找右侧两个变量的值，将它们相加，然后将总和赋值给变量 `income`。\n\
  \n作为提醒，请注意 `income`、`salary` 和 `bribes` 都是可修改的 lvalue，因为每个都标识一个可以被赋值的数据对象，但表达式 `salary\
  \ + bribes` 是一个 `rvalue`，一个不与特定内存位置关联的计算值。\n\n#### 减法运算符：–\n\n`subtraction operator`（减法运算符）导致\
  \ `–` 符号后的数字减去符号符号的数字。语句\n\n```c\ntakehome = 224.00 – 24.00;\n```\n\n将值 `200.0`\
  \ 赋值给 `takehome`。\n\n`+` 和 `–` 运算符被称为 `binary`（二元）或 dyadic 运算符，意味着它们需要*两个*操作数。\n\
  \n#### 符号运算符：– 和 +\n\n减号也可以用于指示或更改值的代数符号。例如，序列\n\n```c\nrocky = –12;\nsmokey = –rocky;\n\
  ```\n\n这给 `smokey` 赋值值为 `12`。\n\n当减号以此方式使用时，它被称为 `unary operator`（一元运算符），意味着它只需要一个操作数（参见\
  \ 图 5.2）。\n\n![Image](img/05fig02.jpg)\n\n图 5.2 一元和二元运算符。\n\nC90 标准增加了一元 `+` 运算符。它不更改操作数的值或符号；它只是允许你使用这种构造（以前是不这样的）。\n\
  \n#### 乘法运算符：*\n\n乘法由 `*` 符号表示。语句\n\n```c\ncm = 2.5 * inch;\n```\n\n将 `inch` 乘以\
  \ `2.5` 并将结果赋值给 `cm`。\n\n你需要平方表？C 没有平方函数，但正如 列表 5.4 所示，你可以使用乘法。\n\n列表 5.4 squares.c\n\
  \n```c\n/* squares.c -- 生成表格 */\n#include <stdio.h>\n\nint main(void)\n{\n    int\
  \ num = 1;\n    while (num < 20)\n    {\n        printf(\"%4d %d\\n\", num, num\
  \ * num);\n        num = num + 1;\n    }\n    return 0;\n}\n```\n\n##### 指数增长\n\n\
  你可能听过一个统治者的故事。当学者被询问想要什么时，他指向棋盘说：第一格一粒，第二格两粒，第三格四粒，以此此类推。统治者缺乏数学能力，对这个请求感到震惊。程序计算了每格的粒数，并将运行总量与一个非常粗略的估计进行比较。\n\
  \n列表 5.5 wheat.c 程序\n\n```c\n/* wheat.c -- 指数增长 */\n#include <stdio.h>\n#define\
  \ SQUARES 64\n\nint main(void)\n{\n    const double CROP = 2E16;\n    double current,\
  \ total;\n    int count = 1;\n    printf(\"square    grains      fraction of\\n\"\
  );\n    printf(\"world total\\n\");\n    total = current = 1.0;\n    printf(\"%4d\
  \ %13.2e %12.2e %12.2e\\n\", count, current, total/CROP);\n    while (count < SQUARES)\n\
  \    {\n        count = count + 1;\n        current = 2.0 * current;\n        total\
  \ = total + current;\n        printf(\"%4d %13.2e %12.2e %12.2e\\n\", count, current,\
  \ total/CROP);\n    }\n    printf(\"That's all.\\n\");\n    return 0;\n}\n```\n\n\
  输出开始非常无常：\n\n点击此处查看代码图像\n\n```\nsquare    grains      fraction of\nworld total\n\
  ```\n\n\n\n\n```\nadded        grains      world total\n1      1.00e+00     1.00e+00\
  \     5.00e-17\n2      2.00e+00     3.00e+00     1.50e-16\n3      4.00e+00     7.00e+00\
  \     3.50e-16\n4      8.00e+00     1.50e+01     7.50e-16\n5      1.60e+01     3.10e+01\
  \     1.55e-15\n6      3.20e+01     6.30e+01     3.15e-15\n7      6.40e+01     1.27e+02\
  \     6.35e-15\n8      1.28e+02     2.55e+02     1.27e-14\n9      2.56e+02     5.11e+02\
  \     2.55e-14\n10     5.12e+02     1.02e+03     5.12e-14\n```\n\n在 10 个方格之后，学者仅获得了略多一千粒小麦，但看看在第\
  \ 55 个方格时发生了什么！\n\n点击此处查看代码图像\n\n```\n55     1.80e+16     3.60e+16     1.80e+00\n\
  ```\n\n收获已经超过了全球年度总产量！如果你想看第 64 个方格时发生了什么，你将必须自己运行程序。\n\n这个例子说明了指数级增长的现象。世界人口增长和我们对能源资源的使用遵循相同的模式。\n\
  \n### 除法运算符：/\n\nC 语言使用 `/` 符号表示除法。`/` 左侧的值被除以右侧的值。例如，以下代码使 `four` 的值为 `4.0`：\n\n\
  ```c\nfour = 12.0/3.0;\n```\n\n整数类型的除法工作方式与浮点类型不同。浮点类型除法给出一个浮点数答案，而整数除法产生一个整数答案。整数不能有小数部分，这使得将\
  \ 5 除以 3 变得很尴尬，因为答案确实有一个小数部分。在 C 语言中，整数除法产生的任何分数都会被丢弃。这个过程被称为`截断（truncation*）`。\n\
  \n尝试 列表 5.6 中的程序，查看截断是如何工作的，以及整数除法如何不同于浮点除法。\n\n#### 列表 5.6 divide.c 程序\n\n点击此处查看代码图像\n\
  \n```c\n/* divide.c -- 我们已知的除法 */\n\n#include <stdio.h>\n\nint main(void)\n{\n \
  \   printf(\"integer division:  5/4   is %d \\n\", 5/4);\n    printf(\"integer division:\
  \  6/3   is %d \\n\", 6/3);\n    printf(\"integer division:  7/4   is %d \\n\",\
  \ 7/4);\n    printf(\"floating division: 7./4. is %.2f \\n\", 7./4);\n    printf(\"\
  mixed division: 7./4. is %.2f \\n\", 7./4);\n    return 0;\n}\n```\n\n列表 5.6 包含一个“混合类型”的情况，即用一个浮点值除以一个整数。C\
  \ 比某些语言更宽容，会允许你这样做，但通常你应该避免混合类型。现在看结果：\n\n点击此处查看图像\n\n```\ninteger division: 5/4\
  \ is 1\ninteger division: 6/3 is 2\ninteger division: 7/4 is 1\nfloating division:\
  \ 7./4. is 1.75\nmixed division: 7./4 is 1.75\n```\n\n注意整数除法并不是四舍五入到最近的整数，而是总是截断（即丢弃整个小数部分）。当整数与浮点数混合时，答案与浮点数相同。实际上，计算机无法直接将浮点类型除以整数，因此编译器将两个操作数都转换为单一类型。在这种情况下，整数在除法之前被转换为浮点数。\n\
  \n在 C99 标准之前，C 语言为实现者在决定负数整数除法的工作方式方面留了一些余地。可以认为舍入过程包括找到小于或等于浮点数的最大整数。显然，与 3.8 相比，3\
  \ 符合该描述。但 -3.8 呢？最大整数方法会建议舍入到 -4，因为 -4 小于 -3.8。但观察舍入过程的另一种方法是它只是丢弃了小数部分；这种名为`向零截断（truncating\
  \ toward zero）`的解释建议将 -3.8 转换为 -3。在 C99 之前，某些实现使用一种方法，另一些使用另一种方法。但 C99 规定向零截断，因此\
  \ -3.8 被转换为 -3。\n\n整数除法的属性证明对某些问题非常有用。\n\n#### 运算符优先级\n\n考虑以下代码：\n\n点击此处查看代码图像\n\
  \n```c\nbutter = 25.0 + 60.0 * n / SCALE;\n```\n\n该语句包含加法、乘法操作。哪个操作先执行？C 通过设置优先级顺序来实现这一点。每个运算符都被分配了一个优先级级别。正如普通算术一样，乘法和除法的优先级高于加法，因此它们先执行。如果两个运算符具有相同的优先级，它们根据它们在语句中的顺序执行。对于大多数运算符，顺序是从左到右的（=`\
  \ 运算符是一个例外）。因此，在语句中\n\n执行顺序如下：\n\n![Image](img/154tab01.jpg)\n\n如果你想让加法操作先于除法，那么你可以像下面这一行那样：\n\
  \n点击此处查看图像\n\n```c\nflour = (25.0 + 60.0 * n) / SCALE;\n```\n\n括号内的任何内容首先执行。在括号内，常规规则适用。对于这个例子，首先进行乘法，然后是加法。这完成了括号内的表达式。现在结果可以除以\
  \ `SCALE`。\n\n许多人喜欢用称为`表达式树（expression tree）`的图来表示评估顺序。图 5.3 是此类图的一个示例。图显示了原始表达式如何通过步骤还原为单一值。\n\
  \n![Image](img/05fig03.jpg)\n\n图 5.3 显示运算符、操作数和评估顺序的表达式树。\n\n表 5.1 总结了到目前为止使用的运算符的规则。（这本书的内封提供了一个涵盖所有运算符的表格。）\n\
  \n![Image](img/05tab01.jpg)\n\n表 5.1 按优先级递减顺序排列的运算符\n\n\n\n\n当两个操作符共享一个操作数时，优先级决定了求值顺序。例如，`12`\
  \ 既是 `*` 运算符也是 `+` 运算符的操作数，优先级规定乘法先进行。同样，优先级规定 `5` 应该被相乘而不是相加。简而言之，乘法 `6 * 12` 和\
  \ `5 * 20` 会在任何加法之前发生。优先级并没有规定这两个乘法中哪一个先发生。C 语言将这一选择留给了具体实现，因为一种选择对于某类硬件可能更有效，而另一种选择可能在其他硬件上运行得更好。无论何种情况，表达式都会简化为\
  \ `72 + 100`，因此该选择不会影响这个特定示例的最终值。“但是，”你说，“乘法是从左到右结合的。这难道不意味着最左侧的乘法先执行吗？”（好吧，也许你没这么说，但某处确实有人这么说过。）结合性规则适用于*共享*操作数的运算符。例如，在表达式\
  \ `12 / 3 * 2` 中，`/` 和 `*` 运算符优先级相同，它们共享操作数 `3`。因此，在这种情况下适用从左到右规则，表达式简化为 `4 * 2`，即\
  \ `8`。（如果从右向左将得到 `12 / 6`，即 `2`。在这里选择就变得了。）在上一个示例中，两个 `*` 运算符并不共享共同的操作数，因此从左到右的规则不适用。\n\
  \n### 尝试规则\n\n让我们在一个更复杂的示例上尝试这些规则——列表 5.7。\n\n列表 5.7 `rules.c` 程序\n\n点击此处查看代码图片\n\
  \n```c\n/* rules.c -- 优先级测试 */\n#include <stdio.h>\n\nint main(void)\n{\n    int\
  \ top, score;\n    top = score = -(2 + 5) * 6 + (4 + 3 * (2 + 3));\n    printf(\"\
  top = %d, score = %d\\n\", top, score);\n    return 0;\n}\n```\n\n这个程序将打印什么值？想清楚它，然后运行程序或阅读下面的描述来检查你的答案。\n\
  \n首先，括号的优先级最高。`-(2 + 5) * 6` 中的括号还是 `(4 + 3 * (2 + 3))` 中的括号先求值取决于实现，正如前面所述。对于这个示例，任何一种选择都会导致相同的结果，所以让我们先取左边的。括号的高优先级意味着在子表达式\
  \ `-(2 + 5) * 6` 中，你先求值 `(2 + 5)`，得到 `7`。接下来，你对 `7` 应用一元负号运算符得到 `-7`。现在表达式为：\n\n\
  ```\ntop = score = -7 * 6 + (4 + 3 * (2 + 3))\n```\n\n下一步是求值 `2 + 3`。表达式变为：\n\n\
  ```\ntop = score = -7 * 6 + (4 + 3 * 5)\n```\n\n接下来，因为括号内的 `*` 优先级高于 `+`，表达式变为：\n\
  \n```\ntop = score = -7 * 6 + (4 + 15)\n```\n\n然后是：\n\n```\ntop = score = -7 * 6\
  \ + 19\n```\n\n将 `-7` 乘以 `6` 得到以下表达式：\n\n```\ntop = score = -42 + 19\n```\n\n然后加法使其变为：\n\
  \n```\ntop = score = -23\n```\n\n现在 `score` 被赋值为值 `-23`，最后，`top` 得到了值 `-23`。记住 `=`\
  \ 运算符是从右到左结合的。\n\n### 一些额外的运算符\n\nC 语言大约有 40 个运算符，但某些的使用频率远高于其他。刚刚涵盖的这些是最常用的，，但让我们在列表中再添加四个有用的运算符。\n\
  \n#### `sizeof` 运算符和 `size_t` 类型\n\n你在第 3 章“数据与 C”中见过 `sizeof` 运算符。回顾一下，`sizeof`\
  \ 运算符返回其操作数的大小，以字节为单位。（回想 C 字节被定义为 `char` 类型的大小。过去，这通常是 8 位，但某些字符集可能使用更大的字节。）操作数可以是一个特定的数据对象，例如变量名，也可以是一个类型。如果是一个类型，例如\
  \ `float`，则操作数必须括在括号内。列表 5.8 中的示例展示了两种形式。\n\n列表 5.8 `sizeof.c` 程序\n\n点击此处查看代码图片\n\
  \n```c\n// sizeof.c -- 使用 sizeof 运算符\n// 使用 C99 %z 修饰符 -- 尝试 %u 或 %lu\n#include\
  \ <stdio.h>\nint main(void)\n{\n    int n = 0;\n    size_t intsize;\n    intsize\
  \ = sizeof(int);\n    printf(\"n = %d, n has %zd bytes; all have %zd bytes.\\n\"\
  , n, intsize);\n    return 0;\n}\n```\n\nC 语言说 `sizeof` 返回一个值。`sizeof` 返回一个 `size_t`\
  \ 类型的值。`size_t` 是在 `<stddef.h>` 中定义的无符号整数类型。由于 `sizeof` 总是返回一个正值，因此在 `printf` 中可以使用\
  \ `%zd` 格式化符（这是 C99 标准引入的）。如果你的系统不支持 C99，可以使用 `unsigned long long`（通常在 `<limits.h>`\
  \ 中定义）并使用 `%llu` 格式化符。\n\n#### 取模运算符：%\n\n*取模运算符*用于整数算术。它给出左侧整数除以右侧整数的*余数*。例如，`13\
  \ % 5`读作“13 取 5”）的结果是 3，因为 5 除以 13 两次，余 3。不要尝试对浮点数使用此运算符。\n\n初看之下，这个运算符可能是数学家的晦涩工具，但它实际上非常实用且有用。一个常见的用途是帮助控制流程。例如，假设你正在编写一个每三个月增加额外费用的账单程序。只需让程序对月份取模（即\
  \ `month % 3`）并检查结果是否为 0。如果是，程序就会增加额外费用。在你学习第 7 章中的 `if` 语句“C 控制语句：分支与跳转”之后，你将更好地理解它。\n\
  \n\n\n\n154 秒是 2 分 34 秒。\n\n输入下一个值（<=0 退出）：\n\n567\n\n567 秒是 9 分 27 秒。\n\n输入下一个值（<=0\
  \ 退出）：\n\n0\n\n完成！\n\n列表 5.2 使用计数器来控制 `while` 循环。当计数器超过给定大小时，循环退出。然而，列表 5.9 使用 `scanf()`\
  \ 获取变量 `sec` 的新值。只要该值为正数，循环就会继续。当用户输入零或负值时，循环退出。这两种情况的重要设计点在于，每个循环周期都会修改被测试变量的值。\n\
  \n负数呢？在 C99 确定整数除法采用“向零截断”规则之前，存在过几种可能性。但随着规则的实施，如果第一个操作数是负数，你将得到一个负模值；否则将得到正模值：\n\
  \n`11 / 5` 是 `2`，`11 % 5` 是 `1`\n\n`11 / -5` 是 `-2`，`11 % -2` 是 `1`\n\n`-11 / -5`\
  \ 是 `2`，`-11 % -5` 是 `-1`\n\n`-11 / 5` 是 `-2`，`-11 % 5` 是 `-1`\n\n如果你的系统显示出不同的行为，说明它还没有跟上\
  \ C99 标准。在任何情况下，标准实际上表示，如果 `a` 和 `b` 是整数值，你可以通过从 `a` 中减去 `(a/b)*b` 来计算 `a%b`。例如，你可以这样评估\
  \ `-11%5`：\n\n点击此处查看代码图片\n\n```\n-11 - (-11/5) * 5 = -11 -(-2)*5 = -11 -(-10) =\
  \ -1\n```\n\n### 递增和递运算符：++ 和 --\n\n递增运算符执行一项简单的任务：它将操作数的值增加（增大） 1。该运算符有两种形式。第一种形式将\
  \ `++` 放在受影响变量之前；这是*前置*模式。第二种形式将 `++` 放在受影响变量之后；这是*后置*模式。这两种模式的区别在于增加发生的精确时间。我们将先解释它们的相似之处，然后回到这个差异。列表\
  \ 5.10 中的短示例展示了递增运算符是如何工作的。\n\n#### 列表 5.10 add_one.c 程序\n\n点击此处查看代码图片\n\n```\n\
  /* add_one.c -- 递增：前置和后置 */\n\n#include <stdio.h>\n\nint main(void)\n{\n    int\
  \ ultra = 0, super = 0;\n    while (super < 5)\n    {\n        super++;\n      \
  \  ++ultra;\n        printf(\"super = %d, ultra = %d \\n\", super, ultra);\n   \
  \ }\n    return 0;\n}\n```\n\n运行 `add_one.c` 会产生此输出：\n\n```\nsuper = 1, ultra =\
  \ 1\nsuper = 2, ultra = 2\nsuper = 3, ultra = 3\nsuper = 4, ultra = 4\nsuper = 5,\
  \ ultra = 5\n```\n\n该程序同时计数了五次。你可以通过将两个递增语句替换为以下内容得到相同的结果：\n\n```\nsuper = super\
  \ + 1;\nultra = ultra + 1;\n```\n\n这些都是足够简单的语句。为什么要大费精力创建一个缩写，更不用两个了？原因之一是紧凑的形式让你的程序更整洁、更容易阅读。这些运算符为你的程序增添了优雅的光彩，定能赏眼目。例如，你可以这样重写\
  \ `shoes2.c` 的部分 (列表 5.2)：\n\n点击此处查看代码图片\n\n```\nshoe = 3.0;\nwhile (shoe < 18.5)\n\
  {\n    foot = SCALE * size + ADJUST;\n    printf(\"%10.1f %20.2f inches\\n\", shoe,\
  \ foot);\n    ++shoe;\n}\n```\n\n然而，你还没有充分利用递增运算符。你可以这样缩短这段代码片段：\n\n点击此处查看代码图片\n\
  \n```\nshoe = 2.0;\nwhile (++shoe < 18.5)\n{\n    foot = SCALE*shoe + ADJUST;\n\
  \    printf(\"%10.1f %20.2f inches\\n\", shoe, foot);\n}\n```\n\n\n\n\n在阅读本书时，应该特别关注自增运算符的示例。问问自己，你是否可以互换使用前缀和后缀形式，或者某些情况是否决定了特定的选择。\n\
  \n也许更智之策略是避免编写那些使用前缀或后缀形式会产生差异的代码。例如，与其使用\n\n点击此处查看代码图像\n\n`b = ++i;` // 如果使用 `i++`，`b`\
  \ 的结果会不同\n\n不如\n\n点击此处查看代码图像\n\n`++i;` // 第 1 行\n\n`b = i;` // `b` 的结果与第 1 行使用 `i++`\
  \ 相同\n\n然而，有时稍微鲁莽一点会更有趣，因此本书不会总是遵循这一明智建议。\n\n### 递减：--\n\n对于每种形式的自增运算符，都有相应的`递减运算符`。不要使用\
  \ `++`，而使用 `--`：\n\n点击此处查看代码图像\n\n`-- count;` // 递减运算符的前缀形式\n\n`count --;` // 递减运算符的后缀形式\n\
  \nListing 5.12 说明了计算机也可以出色的歌词作家。\n\nListing 5.12 bottles.c 程序\n\n点击此处查看代码图像\n\n\
  ```c\n#include <stdio.h>\n\n#define MAX 100\n\nint main(void)\n{\n    int count\
  \ = MAX + 1;\n    while (--count > 0) {\n        printf(\"%d bottles of spring water\
  \ on the wall, \"\n               \"%d bottles of spring water!\\n\", count, count);\n\
  \        printf(\"Take one down and pass it around,\\n\");\n        printf(\"%d\
  \ bottles of spring water!\\n\\n\", count - 1);\n    }\n    return 0;\n}\n```\n\n\
  输出开头如下：\n\n点击此处查看代码图像\n\n100 bottles of spring water on the wall, 100 bottles of\
  \ spring water!\nTake one down and pass it around,\n99 bottles of spring water!\n\
  99 bottles of spring water on the wall, 99 bottles of spring water!\nTake one down\
  \ and pass it around,\n98 bottles of spring water!\n\n它持续了一会儿，并以此方式结束：\n\n点击此处查看代码图像\n\
  \n1 bottles of spring water on the wall, 1 bottles of spring water!\nTake one down\
  \ and pass it around,\n0 bottles of spring water!\n\n显然，这位出色的歌词作家在复数上存在问题，但可以通过第\
  \ 7 章中的条件运算符来修复。\n\n顺便提一下，`>`运算符表示“大于”。就像`<`（“小于”）一样，它是一个`关系运算符`。你将在第 6 章](#ch06.html_ch06）“C\
  \ 控制语句：循环](#ch06.html_ch06)”中更深入地了解关系运算符。\n\n### 优先级\n\n自增和递减运算符具有非常高的结合优先级；只有括号优先级更高。因此，`x*y++`\
  \ 意味着 `(x)*(y++)`，而不是 `(x*y)++`，这很幸后者是无效的。自增和递减运算符影响一个`变量`（或更通地说，可修改的左值），而组合 `x*y`\
  \ 本并不是可修改的左值，尽管它的组成部分是。\n\n不要将这两个运算符的优先级与求值顺序混淆。假设你有以下代码：\n\n```c\ny = 2;\nn = 3;\n\
  nextnum = (y + n++)*6;\n```\n\n`nextnum` 得到什么值？代入值后得到\n\n```c\nnextnum = (2 + 3)*6\
  \ = 5*6 = 30\n```\n\n只有在使用 `n` 之后，它才增加到 `4`。优先级告诉我们 `++` 仅关联到 `n`，而不是 `y + n`。它还告诉我们何时使用\
  \ `n` 的值来评估表达式，但自增运算符的性质决定了 `n` 的值何时改变。\n\n当 `n++` 是表达式的一部分时，你可以将其理解为“使用 `n`；然后增加它”。相反，`++n`\
  \ 意味着“增加 `n`；然后使用它”。\n\n### 不要过分聪明\n\n如果你试图一次性使用自增运算符做太多事情，可能会被欺骗。例如，你可能认为可以改进 `squares.c`\
  \ 程序（Listing 5.4\n```c\nwhile (i < 10) {\n    printf(\"%d %d\\n\", i, i*i);\n  \
  \  i++;\n}\n```\n（注：原文最后部分的文本存在乱码/重复，我已根据原文描述的 C 运算符行为的上下文重构了逻辑流）。\n\n\n\nC 语言的一个重要特性是每个\
  \ C 表达式都有一个值。要找到这个值，你需要按照操作符优先级的顺序执行操作。我们刚刚列出的前几个表达式的值是显而易见的，但那些带有 `=` 符号的表达式呢？这些表达式的值就是\
  \ `=` 符号侧变量所接收的值。因此，表达式 `q=5*2` 整体的值为 `10`。表达式 `q > 3` 的值呢？这类关系表达式为真时值为 `1`，为假时值为\
  \ `0`。以下是一些表达式及其对应的值：\n\n![Image](img/168tab01.jpg)\n\n最后一个表达式看起来很奇怪！然而，它在 C 中是完全合法的（尽管不建议），因为它是两个子表达式之和，每个子表达式都有值。\n\
  \n## 语句\n\n*语句*（Statements）是程序的构建构建。*程序*（program）是一系列带有必要标点符号的语句。语句是计算机的完整指令。在 C\
  \ 语言中，语句用末尾的分号表示。因此，\n\n`legs = 4`\n\n这只是一个表达式（可以是更大表达式的一部分），但\n\n`legs = 4;`\n\n\
  才是一个语句。\n\n最简单的语句是空语句（null statement）：\n\n```c\n;  // null statement\n```\n\n它什么都不做，是指令的一种特殊情况。\n\
  \n更通俗地说，什么构成了一个完整的指令？首先，如果你在任何表达式后面加上一个分号，C 语言就会将其视为一个语句（这些被称为*表达式语句*）。因此，C 语言不会反对像这样的行：\n\
  \n```c\n8;\n3 + 4;\n```\n\n然而，这些语句对你的程序没有实际作用，不能真正被认为是合理的语句。更常见的情况下，语句会改变值并调用函数：\n\
  \n```c\nx = 25;\n++x;\ny = sqrt(x);\n```\n\n虽然语句（或至少是合理的语句）是一条完整指令，但并不是完整指令都是语句。考虑以下语句：\n\
  \n```c\nx = 6 + (y = 5);\n```\n\n在其中，子表达式 `y = 5` 是一个完整的指令，但它只是语句的一部分。由于完整指令并不一定是语句，因此需要一个分号来识别真正是语句的指令。\n\
  \n到目前为止，你已经遇到了五种语句（不包括空语句）。列表 5.13 提供了一个使用了所有五种语句的短示例。\n\n### 列表 5.13 addemup.c\
  \ 程序\n\n点击查看代码图像\n\n***\n\n```c\n/* addemup.c -- 五种语句 */\n#include <stdio.h>\n\n\
  int main(void)              /* 计算前 20 个整数的和 */\n{\n    int count, sum;         /*\
  \ 声明语句 */\n    count = 0;              /* 赋值语句 */\n    sum = 0;                /*\
  \ 同上 */\n    while (count++ < 20)    /* while */\n        sum = sum + count;   /*\
  \ 语句 */\n        printf(\"sum = %d\\n\", sum);/* 函数语句 */\n    return 0;        \
  \       /* 返回语句 */\n}\n```\n\n让我们讨论一下列表 5.13。现在你应该对声明语句非常熟悉了。尽管如此，我们仍提醒你，它建立了变量的名称和类型以及……（文本继续）\n\
  \n## 副影响与序列点\n\n现在谈谈更多关于 C 的知识：*副作用*（side effect）是对数据对象或文件的修改。例如，`states = 50` 的副作用是将\
  \ `states` 设置为 `50`。递增和递减运算符像赋值运算符一样也有副作用，它们被主要使用是因为它们的副作用。同样，当你调用 `printf()` 时，它显示信息这一事实副作用。\n\
  \n*序列点*（sequence point）是程序执行中的一个点，在该点之前，所有的副作用都会被求值。在 C 语言中，语句中的分号标记了一个序列点。这意味着语句中赋值运算符、递增运算符和递减运算符的所有更改必须在程序继续到下一个之前发生。我们在后续章节中讨论的某些运算符具有序列点。此外，任何完全表达式的结束都是一个序列点。\n\
  \n什么是完全表达式？*完全表达式*（full expression）是指不是更大表达式的子表达式。完全表达式的示例包括表达式语句中的表达式，以及作为 `while`\
  \ 循环测试条件的表达式。\n\n序列点有助于明确后置递增发生的时间。例如，考虑以下代码：\n\n```c\nwhile (guests++ < 10)\n \
  \   printf(\"%d \\n\", guests);\n```\n\n有时 C 初学者假设“使用值然后对其递增”在这种语境下意味着在 `guests`\
  \ 在 `printf()` 语句中使用之后递增。然而，`guests++ < 10` 表达式是一个完全表达式，因为它是 `while` 循环的测试条件，所以这个表达式的结束是一个序列点。因此，C\
  \ 保证副作用（递增 `guests`）在程序移动到 `printf()` 之前发生。然而，使用后置形式保证 `guests` 在与 10 比较之后会被递增。\n\
  \n现在考虑这个语句：\n\n```c\ny = (4 + x++) + (6 + x++);\n```\n\n\n\n\n表达式 `4 + x++` 不是一个完整的表达式，因此\
  \ C 并不保证 `x` 在子表达式 `4 + x++` 求值后会立即递增。在这里，完整表达式是整个赋值语句，分号标记了序列点（sequence point），因此\
  \ C 保证的是在程序移动到下一语句之前，`x` 已经增加了了两次。C 并没有规定 `x` 是在每个子表达式求值后增加，还是仅在所有表达式求值后才增加，这就是为什么你应该避免此类类型的语句。\n\
  \n## 复合语句（块）\n\n`复合语句`（`compound statement`）是通过花括号将两个或多个语句组合在一起的语句；它也被`块`（`block`）。`shoes2.c`\
  \ 程序使用了一个块让 `while` 语句包含多个语句。比较以下程序片段：\n\n```c\n/* fragment 1 */\nindex = 0;\nwhile\
  \ (index++ < 10)\n    sam = 10 * index + 2;\nprintf(\"sam = %d\\n\", sam);\n```\n\
  \n```c\n/* fragment 2 */\nindex = 0;\nwhile (index++ < 10)\n{\n    sam = 10 * index\
  \ + 2;\n    printf(\"sam = %d\\n\", sam);\n}\n```\n\n在片段 1 中，只有赋值语句被包含在 `while`\
  \ 循环中。在没有花括号的情况下，`while` 语句从 `while` 到下一个分号运行。`printf()` 函数将在循环完成后仅调用一次。\n\n在片段\
  \ 2 中，花括号确保了两条语句都是 `while` 循环的一部分，并且在每次执行循环时都会调用 `printf()`。从 `while` 语句的结构来看，整个复合语句被视为单个语句（参见图\
  \ 5.7）。\n\n![Image](img/05fig07.jpg)\n\n图 5.7 带有复合语句的 `while` 循环。\n\n### 提示：风格技巧\n\
  \n再次观察这两个 `while` 片段，注意缩进是如何标记出每个循环体的。缩进对编译器没有影响；它使用花括号和它对 `while` 循环结构的了解来决定如何解释你的指令。缩进的存在是为了让你一目了然地看到程序是如何组织的。\n\
  \n示例展示了用于块或复合语句放置花括号的一种流行风格。另一种常见的风格是这种：\n\n点击此处查看代码图像\n\n```c\nwhile (index++ <\
  \ 10) {\n    sam = 10*index + 2;\n    printf(\"sam = %d \\n\", sam);\n}\n```\n\n\
  这种风格突出了块与 `while` 循环的结合关系。另一种风格则强调语句形成了一个块。同样，对于编译器来说，这两种形式是相同的。\n\n总结一下，使用缩进作为一种工具向读者指出程序的结构。\n\
  \n## 总结：表达式与语句\n\n**表达式：**\n\n一个`表达式`（`expression`）是操作符和操作数的组合。简单的表达式只是一个没有操作符的常量或变量，例如\
  \ `22` 或 `beebop`。更复杂的例子有 `55 + 22` 和 `vap = 2 * (vip + (vup = 4))`。\n\n**语句：**\n\
  \n`语句`（`statement`）是给计算机的命令。有简单语句和复合语句。`简单语句`以分号结束，如这些示例所示：\n\n![Image](img/173tab03.jpg)\n\
  \n`复合语句`或`块`（`blocks`）由花括号内的一个或多个语句（这些语句本身可以是复合语句）组成。下面的 `while` 语句包含一个示例：\n\n点击此处查看代码图像\n\
  \n```c\nwhile (years < 100)\n{\n    wisdom = wisdom * 1.05;\n    printf(\"%d %d\\\
  n\", years, wisdom);\n    years = years + 1;\n}\n```\n\n## 类型转换\n\n语句和表达式通常使用同一种类型的变量和常量。然而，如果你混合了类型，C\
  \ 不会像 Pascal 那样直接停下来。相反，它使用一组规则自动进行类型转换。这可能是一种便利，但也可能是一种危险，特别是当你无意中混合了类型时。（在许多 Unix\
  \ 系统上的 `lint` 程序会检查类型“冲突”。如果你选择了较高的错误级别，许多非 Unix 的 C 编译器会报告可能的类型问题。）了解一些类型转换规则是一个好主意。\n\
  \n基本规则如下：\n\n1. 出现在表达式中，`char` 和 `short`（无论有符号还是无符号）都会自动转换为 `int`，或者在必要时转换为 `unsigned\
  \ int`。（如果 `short` 与 `int` 大一样，则 `unsigned short` 比 `int` 大；在这种情况下，`unsigned short`\
  \ 被转换为 `unsigned int`。）在 K&R C 中，但在当前的 C 中，`float` 会自动转换为 `double`。由于它们是向更大类型的转换，它们被称为`提升`（`promotions`）。\n\
  2. 在涉及两种类型的任何操作中，两个值都会转换为这两种类型中排名较高的类型。\n3. 类型从从到到的排名是 `long double`、`double`、`float`、`unsigned\
  \ long long`、`long long`、`long`、`unsigned int`、`int`。一个例外是 `long` 和 `int` 大小相同，此时\
  \ `unsigned int` 高于 `long`。\n4. 在赋值语句中，最终结果被转换为赋值变量的类型。\n5. 作为函数参数传递时，`char` 和 `short`\
  \ 转换为 `int`，`float` 转换为 `double`。这种自动提升被第 9 章中讨论的内容覆盖。\n\n提升通常是平滑的，但降级（`demotion`）可能会导致问题。原因很简单：较低类型可能无法容纳数值。例如，8\
  \ 位 `char` 可以容纳整数 `1` 但不能容纳 `234`。转换目标类型时：\n\n1. 当目标是某种无符号整数且赋值值为整数时，多余的位会被忽略。例如，如果目标是\
  \ 8 位 `unsigned char`，赋值值是对模 256 的结果。\n2. 如果目标是有符号整数且赋值值为整数，结果取决于实现。\n3. 如果目标是整数且赋值值为浮点数，行为是未定义的。\n\
  \n如果浮点值转换为整数类型呢？当浮点类型降级为整数类型时，它们会被截断或向零舍入。这意味着 `23.1` 和 `23.99` 都被截断为 `23`，而 `-23.5`\
  \ 被截断为 `-23`。列表 5.14 展示了其中一些规则的作用。\n\n列表 5.14 `convert.c` 程序\n\n点击此处查看代码图像\n\n```c\n\
  /* convert.c -- automatic type conversions */\n#include <stdio.h>\nint main(void)\n\
  {\n    char ch;\n    int i;\n    float fl;\n    fl = i = ch = 'C';             \
  \    /* 第 9 行 */\n    printf(\"ch = %c, i = %d, fl = %2.2f\\n\", ch, i, fl); /*\
  \ 第 10 行 */\n    ch = ch + 1;                      /* 第 11 行 */\n    i = fl + 2\
  \ * ch;                   /* 第 12 行 */\n    fl = 2.0 * ch + i;                 /*\
  \ 第 13 行 */\n    ch = 1107;                         /* 第 14 行（注：原文此处为 15） */\n \
  \   printf(\"Now ch = %c\\n\", ch);      /* 第 15 行（注：原文此处为 16） */\n}\n```\n*(注：由于提供的文本代码块中行号与描述略有出入，翻译时保持了逻辑一致性)*\n\
  \n\n\n\n```c\nch = 80.89;                      /* line 17 */\nprintf(\"Now ch =\
  \ %c\\n\", ch);      /* line 18 */\nreturn 0;\n}\n```\n\n***\n\n运行 `convert.c` 产生输出：\n\
  \n点击此处查看代码图片\n\n```\nch = C, i = 67, fl = 67.00\nch = D, i = 203, fl = 339.00\n\
  Now ch = S\nNow ch = P\n```\n\n在这个具有 8 位 `char` 和 32 位 `int` 的系统上，发生了以下情况：\n\n![Image](img/squf.jpg)\
  \ **第 9 和第 10 行**——字符 `'C'` 以 1 字节 ASCII 值存储在 `ch` 中。整数变量 `i` 接收了 `'C'` 的整数转换，结果为\
  \ `67` 并以 4 字节存储。最后，`fl` 接收了 `67` 的浮点转换，结果为 `67.00`。\n\n![Image](img/squf.jpg) **第\
  \ 11 和第 14 行**——字符变量 `'C'` 被转换为整数 `67`，然后加上 `1`。得到的 4 字节整数 `68` 被截断为 1 字节并存储在 `ch`\
  \ 中。当使用 `%c` 符打印时，`68` 被解释为字符 `'D'` 的 ASCII 。\n\n![Image](img/squf.jpg) **第 12 和第\
  \ 14 行**——`ch` 的值转换为 4 字节整数（`68`）以便乘以 `2`。得到的整数（`136`）被转换为浮点以便加到 `fl`。结果（`203.00f`）被转换为\
  \ `int` 并存储在 `i` 中。\n\n![Image](img/squf.jpg) **第 13 和第 14 行**——`ch` 的值（`'D'` 或\
  \ `68`）被转换为浮点以便乘以 `2.0`。`i` 的值（`203`）被转换为浮点以便相加，结果（`339.00`）存储在 `fl` 中。\n\n![Image](img/squf.jpg)\
  \ **第 15 和第 16 行**——这里示例尝试了一种降级（demotion）情况，将 `ch` 设置为超出范围的数字。在忽略额外的位后，`ch` 最终得到了字符\
  \ `S` 的 ASCII 代码。更具体地说，`1107 % 256` 等于 `83`，即 `S` 的代码。\n\n![Image](img/squf.jpg)\
  \ **第 17 和第 18 行**——这里尝试了另一种降级情况，将 `ch` 设置为一个浮点数。发生截断后，`ch` 最终得到了字符 `P` 的 ASCII\
  \ 代码。\n\n### 强制转换运算符\n\n通常你应该避免自动类型转换，特别是降级，但只要你谨慎，有时进行转换是有便利的。我们到为止讨论的类型转换都是自动完成的。然而，你可以要求进行所需的精确类型转换，或者记录你明知正在进行类型转换。这种方法被称为*强制转换*（cast），它的构造是在数量前用括号括起所需的类型名称。括号和类型名共同构成了*强制转换运算符*。这是强制转换运算符的一般形式：\n\
  \n```\n(type)\n```\n\n实际所需的类型（例如 `long`）会替换单词 `type`。\n\n考虑接下来的两行代码，其中 `mice` 是一个\
  \ `int` 变量。第二行包含两个对 `int` 类型的强制转换。\n\n```c\nmice = 1.6 + 1.7;\nmice = (int) 1.6\
  \ + (int) 1.7;\n```\n\n第一个示例使用了自动转换。首先，`1.6` 和 `1.7` 相加得到 `3.3`。该数字随后通过截断转换为整数 `3`\
  \ 以匹配 `int` 变量。在第二个示例中，`1.6` 在相加之前转换为整数（`1`），`1.7` 也是如此，因此 `mice` 被赋值为 `1+1`，即 `2`。这两种形式在本质上没有哪个哪个更正确；你必须考虑编程问题的上下文来判断哪种更合理。\n\
  \n通常情况下，你不应该混合使用类型（这就是为什么某些语言不允许这样做），但在某些情况下它是有用的。C 语言的哲学是避免在你道路上设置障碍，并将不滥用这种自由的责任交给你。\n\
