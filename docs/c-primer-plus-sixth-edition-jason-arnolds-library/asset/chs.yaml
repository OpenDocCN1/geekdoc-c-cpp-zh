  \n点击此处查看代码图像\n\n```c\nbox.st_view.fill_color = CYAN; /* 位域等效写法 */\n```\n\n### 对齐特性\
  \ (C11)\n\nC11 的对齐特性更多是字节操作而非位操作，但它们也代表了语言与硬件的关系。在这种语境下，对齐是指对象在内存中的位置。例如，为了最大化效率，系统可能要求\
  \ `double` 类型存储在被 4 整除的地址上，但允许 `char` 存储在任何地址。对于大多数程序员来说，对齐并不是问题。但某些情况可以从对齐控制中受益，例如从一个硬件位置传输数据到另一个，或者调用同时操作多个数据的指令。\n\
  \n`_Alignof` 运算符产生类型的对齐要求。通过在 `_Alignof` 关键字后面加上括号类型来使用它：\n\n点击此处查看代码图像\n\n```c\n\
  size_t d_align = _Alignof(float);\n```\n\n`d_align` 的值为 `4` 意味着 `float` 对象的对齐要求为\
  \ 4。这意味着 4 是连续地址之间的字节数。\n\n\n\n\n你可以使用 `_Alignas` 限定符来为变量或类型请求特定的对齐。但你不应该请求比该类型的基础对齐更弱的对齐。例如，如果\
  \ `float` 的对齐要求为 4，则不要请求 1 或 2 的对齐值。该限定符用作声明的一部分，其后面跟着一个括号，括号内包含一个对齐值或一个类型：\n\n\
  点击此处查看代码图像\n\n```c\n_Alignas(double) char c1;\n_Alignas(8) char c2;\nunsigned char\
  \ _Alignas(long double) c_arr[sizeof(long double)];\n```\n\n***\n\n### Note\n\n\
  在编写时，Clang（版本 3.2）要求 `_Alignas(` 类型`)` 限定符跟在类型限定符之后，如上一个示例中的第三行所示。但 GCC 4.7.3 识别这两种顺序，Clang\
  \ 的后续版本（3.3）也是如此的。\n\n***\n\nListing 15.5 提供了 `_Alignas` 和 `_Alignof` 的简短示例。\n\n\
  Listing 15.5 align.c 程序\n\n点击此处查看代码图像\n\n***\n\n```c\n// align.c -- using _Alignof\
  \ and _Alignas (C11)\n\n#include <stdio.h>\n\nint main(void)\n{\n    double dx;\n\
  \    char ca;\n    char cx;\n    double dz;\n    char cb;\n    char _Alignas(double)\
  \ cz;\n    printf(\"char alignment:   %zd\\n\", _Alignof(char));\n    printf(\"\
  double alignment: %zd\\n\", _Alignof(double));\n    printf(\"&dx: %p\\n\", &dx);\n\
  \    printf(\"&ca: %p\\n\", &ca);\n    printf(\"&cx: %p\\n\", &cx);\n    printf(\"\
  &dz: %p\\n\", &dz);\n    printf(\"&cb: %p\\n\", &cb);\n    printf(\"&cz: %p\\n\"\
  , &cz);\n    return 0;\n}\n```\n\n***\n\n这是示例输出：\n\n```text\nchar alignment:   1\n\
  double alignment: 8\n&dx: 0x7fff5fbff660\n&ca: 0x7fff5fbff65f\n&cx: 0x7fff5fbff65e\n\
  &dz: 0x7fff5fbff650\n&cb: 0x7fff5fbff64f\n&cz: 0x7fff5fbff648\n```\n\n在我们的系统中，`double`\
  \ 的对齐值 8 意味着该类型对齐到 8 的倍数地址上。以 `0` 或 `8` 结尾的十六进制地址可以被 8 整除，这就是两个 `double` 变量以及 `char`\
  \ 变量 `cz` 使用使用的地址（它被赋予了 `double` 对齐值）。由于 `char` 的对齐值为 1，编译器可以为普通的 `char` 变量使用任何地址。\n\
  \n包含 `stdalign.h` 头文件允许你使用 `alignas` 和 `alignof` 来代替 `_Alignas` 和 `_Alignof`。这与\
  \ C++ 的关键字相匹配。\n\nC11 还通过向 `stdlib.h` 库添加一个新的内存分配函数，引入了分配内存的对齐能力。该函数的原型如下：\n\n点击此处查看代码图像\n\
  \n```c\nvoid *aligned_alloc(size_t alignment, size_t size);\n```\n\n第一个参数指定所需的对齐，第二个参数请求所需的字节数；它应该是第一个参数的倍数。与其他内存分配函数一样，在完成后使用\
  \ `free()` 释放内存。\n\n### 核心概念\n\nC 语言与大多数高级语言区别开来的特性之一是，它能够访问整数中的单个位。这通常是与硬件设备和操作系统交互的关键。\n\
  \nC 提供了访问位位的两种主要方法：一种是位运算符族，另一种是在结构体中创建位域的能力。\n\nC11 增加了检查内存对齐要求以及请求更严格要求的能力。\n\n\
  通常情况下（但并非总是），使用这些特性的程序与特定的硬件平台或操作系统绑定，并不具有可移植性。\n\n### 总结\n\n计算硬件与二进制数字系统密切相关，因为二进制数中的\
  \ 1 和 0 可以表示计算机内存和寄存器中位位的开启和关闭状态。虽然 C 语言不允许你以二进制形式编写整数，但它识别相关的八进制和十六进制表示法。正如每个二进制位代表\
  \ 1 位一样，每个八进制位代表 3 位，而每个十六进制位代表 4 位。\n\n### 复习习题\n\n1. 将以下十进制数转换为二进制：\na. 3\nb.\
  \ 5\nc. 9\n\n2. 将以下二进制值转换为十进制、八进制和十六进制：\na. 0000101\nb. 0100101\nc. 0101100\nd.\
  \ 1001101\n\n3. 计算以下表达式的结果（假设每个值均为 8 位）：\na. ~3\nb. 3 & 6\nc. 3 | 6\nd. 3 / 6\n\
  e. 3 ^ 6\nf. 7 >> 1\n\n4. 计算以下表达式的结果（假设每个值均为 8 位）：\na. ~0\nb. !0\nc. 2 & 4\nd. 2\
  \ && 4\ne. 2 | 4\nf. 2 || 4\ng. 5 << 3\n\n5. 因为 ASCII 只使用 7 位，有时需要屏蔽掉其他位。该掩码的二进制是多少？十进制是多少？十六进制是多少？\n\
  \n6. 在 Listing 15.2 中，你可以将\n```c\nwhile (bits-- > 0) {\n    mask |= bitval;\n  \
  \  bitval <<= 1;\n}\n```\n替换为\n```c\nwhile (bits-- > 0) {\n    mask += bitval;\n\
  \    bitval *= 2;\n}\n```\n且程序仍然运行。这意味着操作 `*= 2` 等同于 `<<= 1` 吗？`|=` 和 `+=` 呢？\n\n\
