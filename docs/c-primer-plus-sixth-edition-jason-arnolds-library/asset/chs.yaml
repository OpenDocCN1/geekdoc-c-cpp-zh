  #### 树的思考\n\n二叉搜索树有一些缺点。例如，二叉搜索树只有在完全满（或 `balanced` 平衡的）时才是高效的。假设你正在存储随机输入的单词。很有可能这棵树看起来非常茂盛，如图\
  \ 17.12 所示。现在假设你按字母顺序输入数据。那么每个新节点都会被添加到右侧，树可能会看起来像图 17.16。图 17.12 中的树被称为 `balanced`（平衡的），而图\
  \ 17.16 中的树是 `unbalanced`（不平衡的）。搜索这棵树的效率并不顺序搜索链表没有区别。\n\n![Image](img/17fig16.jpg)\n\
  图 17.16 一个极度不平衡的二叉搜索树。\n\n避免字符串树的一种方法是在构建树时更加小心。如果一棵树或子树在某一侧开始变得不平衡，就重新排列节点以恢复更好的平衡。同样，你可能在删除操作后需要重新排列树。俄罗斯数学家\
  \ Adel’skii 和 Landis 开发了一种实现此点的算法。用他们的方法构建的树被称为 `AVL trees`。由于额外的重构，构建平衡树需要更长的时间，但你可以确保获得最大（或接近最大）的搜索效率。\n\
  \n你可能想要一个允许重复项的二叉搜索树。例如，假设你想通过跟踪文本中每个单词出现的次数来分析某些文本。一种方法是将 `Item` 定义为包含一个单词和一个数字的结构体。第一次遇到某个单词时，将其添加到树中，并将数字设为\
  \ `1`。下一次遇到该单词时，则增加该数字。\n\n你可能想要一个允许重复项的二叉搜索树。例如，假设你想通过跟踪文本中每个单词出现的次数来分析某些文本。一种方法是将\
  \ `Item` 定义为包含一个单词和一个数字的结构体。第一次遇到某个单词时，将其添加到树中，并将数字设为 `1`。下一次遇到该单词时，则增加该数字。\n\n\n\
  \n\n\n当你熟悉 C 语言后，你可能想要研究 C++、Objective C 或 Java。这些 `object-oriented`（面向对象）语言都起源于\
  \ C。C 已经有了数据对象，其复杂度从简单的 `char` 变量到大型复杂的结构不等。面向对象的语言将“对象”的概念推得更远。例如，一个对象的属性不仅包括它能包含什么类型的信息，还包括对它可以执行哪些操作。本章中的\
  \ ADT（抽象数据类型）遵循了这种模式。此外，对象可以继承其他对象的属性。OOP（面向对象编程）将 C 的模块化提升到了更高的抽象水平，有助于编写大型程序。\n\
  \n你可能想查看参考章节 I 中的参考文献以及“进阶阅读”，寻找可能进一步激发你兴趣的书籍。\n\n### 核心概念\n\n数据类型的特征取决于数据的结构和存储方式，还取决于可以进行哪些操作。抽象数据类型（ADT）以抽象的方式规定了描述一个类型的属性和操作。从概念上说，你可以通过两个步骤将\
  \ ADT 翻译为特定的编程语言。第一步是定义编程接口。在 C 中，你可以通过使用头文件来定义类型名，并提供与允许的操作对应的函数原型。第二步是实现接口。在 C\
  \ 中，你可以通过源代码文件来提供与原型对应的函数定义。\n\n### 总结\n\n列表、队列和二叉树是计算机编程中常用的 ADT 示例。它们通常使用动态内存分配和链式结构来实现，但有时使用数组来实现它们是更好的选择。\n\
  \n当你使用特定类型（例如队列或树）进行编程时，你应该基于类型接口来编写程序。这样，你就可以在不更改使用接口的程序的情况下修改和改进实现。\n\n### 复习题\n\
