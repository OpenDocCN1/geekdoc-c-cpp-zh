  \n**14.** 完成编程练习 13，但使用变长数组函数参数。\n\n## 11. 字符字符串和字符串函数\n\n你将在本章中学习到以下内容：\n\n![Image](img/squf.jpg)\
  \ 函数：\n\n点击此此处查看代码图像\n\n`gets()`, `gets_s()`, `fgets()`, `puts()`, `fputs()`, `strcat()`,\
  \ `strncat()`, `strcmp()`, `strncmp()`, `strcpy()`, `strncpy()`, `sprintf()`, `strchr()`\n\
  \n![Image](img/squf.jpg) 创建和使用字符串\n\n![Image](img/squf.jpg) 使用 C 库中的多个字符串和字符函数并创建自己的字符串函数\n\
  \n![Image](img/squf.jpg) 使用命令行参数\n\n字符字符串是 C 语言中最实用和重要的数据类型之一。你一直在使用字符字符串，但关于它们仍然有很多需要学习的。C\
  \ 库提供了系列函数用于读取和写入字符串、复制字符串、比较字符串、合并字符串、搜索字符串等。本章将为你的编程技能增加这些能力。\n\n### 字符串的表示和字符串\
  \ I/O\n\n当然，你已经知道最基本的事实：字符字符串是以空字符（`\\0`）终止的 `char` 数组。因此，你学过的数组和指针的知识也适用于字符字符串。但由于字符字符串使用非常频繁，C\
  \ 提供了许多专门为处理字符串而设计的函数。本章将讨论字符串的本质、如何声明和初始化字符串、如何将它们读入和程序以及如何操作字符串。\n\n让我们来看一个短程序（参见显示列表\
  \ 11.1），它说明了在程序中表示字符串的一些方法。\n\n显示列表 11.1 strings1.c 程序\n\n点击此此处查看代码图像\n\n```\n//\
  \  strings1.c\n\n#include <stdio.h>\n\n#define MSG \"I am a symbolic string constant.\"\
  \n\n#define MAXLENGTH 81\n\nint main(void)\n{\n    char words[MAXLENGTH] = \"I am\
  \ a string in an array.\";\n    const char * pt1 = \"Something is pointing at me.\"\
  ;\n    puts(\"Here are some strings:\");\n    puts(MSG);\n    puts(words);\n   \
  \ puts(pt1);\n    words[8] = 'p';\n    puts(words);\n    return 0;\n}\n```\n\n`puts()`\
  \ 函数像 `printf()` 一样，属于 `stdio.h` 输入输出函数族。它只显示字符串，与 `printf()` 不同，它会自动在字符串末尾添加换行符。输出如下：\n\
  \n点击此此处查看代码图像\n\nHere are some strings:\n\nI am a symbolic string constant.\n\n\
  I am a string in an array.\n\nSomething is pointing at me.\n\nI am a string in an\
  \ array.\n\n与其逐行通过列表 11.1，我们采用一种更全面的方法。首先，我们将查看如何在程序内部定义字符串。然后我们将学习如何向程序读取字符串。最后，我们将学习输出字符串。\n\
  \n#### 在程序内部定义字符串\n\n正如你在 11.1 中注意到的，定义字符串有很多方法。主要方法是使用字符串常量、使用 `char` 数组以及使用 `char`\
  \ 指针。程序应该确保有地方存储字符串，我们将涵盖这个问题。\n\n##### 字符串字面量（字符串常量）\n\n字符串字面量也称为字符串常量，是任何包含在双引号中的内容。这些字符加上自动提供的\
  \ `\\0` 字符以字符串的形式存储在内存中。因此，`\"I am a string constant.\"`、`\"I am a string in an\
  \ array.\"`、`\"Something is pointing at me.\"` 和 `\"Here are some strings:\"` 都是字符串字面量。\n\
  \n回想一下，从 ANSI C 标准开始，C 会合并字符串常量。例如，\n\n点击此此处查看代码图像\n\n```\nchar greeting[50] = \"\
  Hello, and\"\" how are\" you!\";\n```\n\n等同于：\n\n点击此此处查看代码图像\n```c\nchar greeting[50]\
  \ = \"Hello, and how you!\";\n```\n\n如果你想在字符串中使用双引号，在引号前加一个反斜杠，如下：\n\n点击此此处查看代码图像\n\
  ```c\nprintf(\"\\\"Run, Spot, run!\\\" exclaimed Dick.\\n\");\n```\n\n产生以下输出：\n\n\
  \"Run, Spot, run!\" exclaimed Dick.\n\n字符字符串常量位于静态存储类中，这意味着如果你在函数中使用字符串常量，字符串只存储一次并在程序运行期间一直存在，即使该函数被多次调用。整个引用短语作为指向字符串存储处的指针。这种动作类似于数组名作为指向数组位置的指针。如果是这样，显示列表\
  \ 11.2 中的程序应该产生什么样的输出？\n\n```\n/* strptr.c -- 作为指针的字符串 */\n#include <stdio.h>\n\n\
  int main(void)\n{\n    printf(\"%s, %p, %c\\n\", \"We\", \"are\", *\"space farers\"\
  );\n    return 0;\n}\n```\n\n\n\n\n`%s` 格式应该打印字符串 `We`。`%p` 格式产生一个地址。因此，如果短语 `\"\
  are\"` 是一个地址，那么 `%p` 应该打印字符串中第一个字符的地址。（非 ANSI 的实现可能需要使用 `%u` 或 `%lu` 代替 `%p`。）最后，`*\"\
  space farers\"` 应该产生地址所指向的值，该值应该是字符串 `\"space farers\"` 的第一个字符。这真的会发生吗？嗯，这里是输出：\n\
  \n```\nWe, 0x100000f61, s\n```\n\n## 字符字符串数组与初始化\n\n当你定义一个字符字符串数组时，必须让编译器知道需要多少空间。一种方法是指定足够大的数组大小以容纳该字符串。以下声明将数组\
  \ `m1` 初始化为指定字符串的字符：\n\n点击此处查看代码图片\n\n```c\nconst char m1[40] = \"Limit yourself\
  \ to one line's worth.\";\n```\n\n`const` 表示不修改此字符串的意图。\n\n这种形式形式是数组初始化形式的简写：\n\n\
  点击此处查看代码图片\n\n```c\nconst char m1[40] = {  'L',\n'i', 'm', 'i', 't', ' ', 'y', 'o',\
  \ 'u', 'r', 's', 'e', 'l',\n'f', ' ', 't', 'o', ' ', 'o', 'n', 'e', ' ',\n'l', 'i',\
  \ 'n', 'e', '\\\"', 's', ' ', 'w', 'o', 'r',\n't', 'h', '.', '\\0'\n};\n```\n\n\
  注意结尾的空字符（null character）。如果没有它，你拥有字符数组，但不是字符串。\n\n当你指定数组大小时，请确保元素个数至少比字符串长度多一个（就是那个空字符）。任何未使用的元素都会自动初始化为\
  \ `0`（在 `char` 形式下是空字符，而不是数字字符 0）。参见图 11.1。\n\n![Image](img/11fig01.jpg)\n\n图 11.1\
  \ 初始化数组。\n\n通常，让编译器确定数组大小是方便的；记住，如果你在初始化声明中省略了大小，编译器会为你确定大小：\n\n点击此处查看代码图片\n\n```c\n\
  const char m2[] = \"If you can't think of anything, fake it.\";\n```\n\n初始化字符数组是一个让编译器确定数组大小确实非常有意义的用例。这是因为字符串处理函数通常不需要知道数组的大小，因为它们只需寻找空字符来标记结束。\n\
  \n让编译器计算数组的大小仅在你初始化了数组时才有效。如果你创建了一个打算稍后填充的数组，你需要在声明时指定大小。当你声明数组大小时，数组大小必须求值得一个整数。在\
  \ C99 变长数组（VLAs）出现之前，大小必须是一个整数常量，这包括由常量整数值形成的表达式的可能性。\n\n点击此处查看代码图片\n\n```c\nint\
  \ n = 8;\nchar cookies[1];    // 有效\nchar cakes[2 + 5];  // 有效，大小是常量表达式\nchar pies[2*sizeof(long\
  \ double) + 1];  // 有效\nchar crumbs[n];     // C99 之前无效，C99 为 VLA\n```\n\n字符数组的名称像任何数组名一样，产生数组第一个元素的地址。因此，以下等成立：\n\
  \n点击此处查看代码图片\n\n```c\nchar car[10] = \"Tata\";\ncar == &car[0], *car == 'T', and\
  \ *(car+1) == car[1] == 'a'\n```\n\n事实上，你可以使用指针表示法来设置字符串。例如，列表 11.1 使用了以下声明：\n\n\
  点击此处查看代码图片\n\n```c\nconst char * pt1 = \"Something is pointing at me.\";\n```\n\n\
  这个声明与这一个几乎相同：\n\n点击此处查看代码图片\n\n```c\nconst char ar1[] = \"Something is pointing\
  \ at me.\";\n```\n\n这些声明等同于 `pt1` 和 `ar1` 都是字符串的地址。在两种情况下，引号中的字符串本身决定了为字符串留出的存储空间。尽管如此，它们的形式并不相同。\n\
  \n### 数组对比指针\n\n那么，数组形式和指针形式之间的区别是什么？数组形式（`ar1[]`）会在计算机内存中分配一个包含 29 个元素的数组（每个字符一个，外外加一个用于终止的\
  \ `'\\0'`）。每个元素都被初始化为字符串字面量对应的字符。通常情况下，发生的情况是引号中的字符串存储在程序特定的数据段中，并在程序运行期间可以被修改。数组形式\
  \ `ar1[]` 是第一个元素的同义词。\n\n指针形式 `pt1` 同样存储字符串的地址。然而，指针本身是一个变量，可以更改指向另一个字符串。字符串字面量本身被认为是只读的。在你之后，`pt1`\
  \ 指向 `const` 数据。这并不意味着你不能更改它所指向的数据，但意味着你不能通过 `pt1` 来更改数据。第 12 章 将更深入地讨论内存。\n\n简之，初始化数组是从静态存储拷贝字符串，初始化指针仅仅是复制字符串的地址。列表\
  \ 11.3 说明了这些点。\n\n\n\n\n\n这说明了什么？首先，`pt` 和 `MSG` 是同一个地址，而 `ar` 是不同的地址，正如承诺的那样。其次，尽管字符串字面量\
  \ `\"I'm special.\"` 在 `printf()` 语句中出现了两次，但编译器选择使用一个存储位置，而不是与 `MSG` 相同的地址。编译器有权将使用多次的字面量存储在一个或多个位置中。另一个编译器可能会选择用单个存储位置来表示\
  \ `\"I'm special.\"` 的三个出现处。第三，用于静态数据的内存部分与动态内存（即 `ar` 所使用的的内存）是不同的。不仅值不同，这个特定的编译器甚至使用不同的位宽来表示这两种内存。\n\
  \n字符串的数组表示和指针表示之间的差异重要吗？通常并不重要，但这取决于你尝试做什么。让我们进一步探讨这个问题。\n\n## 数组与指针的区别\n\n让我们检查一下初始化一个字符数组来存储字符串与初始化一个指针来指向一个字符串之间的区别。（通过“指向字符串”，我们实际上是指指向字符串的第一个字符。）例如，考虑以下两个声明：\n\
  \n点击此处查看代码图像\n\n```c\nchar heart[] = \"I love Tillie!\";\nconst char *head = \"\
  I love Millie!\";\n```\n\n主要的区别在于数组名 `heart` 是常量，而指针 `head` 是变量。这在实践中造成了什么区别？\n\n\
  首先，两者都可以使用数组表示法：\n\n```c\nfor (i = 0; i < 6; i++)\n    putchar(heart[i]);\nputchar('\\\
  n');\n\nfor (i = 0; i < 6; i++)\n    putchar(head[i]));\nputchar('\\n');\n```\n\n\
  这是输出：\n\nI love\nI love\n\n接下来，两者都可以使用指针加法：\n\n```c\nfor (i = 0; i < 6; i++)\n \
  \   putchar(*(heart + i));\nputchar('\\n');\n\nfor (i = 0; i < 6; i++)\n    putchar(*(head\
  \ + i));\nputchar('\\n');\n```\n\n再次，输出如下：\n\nI love\nI love\n\n然而，只有指针版本可以使用递增运算符：\n\
  \n点击此处查看代码图像\n\n```c\nwhile (*(head) != '\\0')  /* 在字符串结束处停止 */\n    putchar(*(head++));\
  \  /* 打印字符，移动指针 */\n```\n\n产生以下输出：\n\nI love Millie!\n\n假设你想让 `head` 与 `heart` 一致。你可以说\n\
  \n点击此处查看代码图像\n\n```c\nhead = heart;  /* head 现在指向数组 heart */\n```\n\n这使得 `head`\
  \ 指针指向 `heart` 数组的第一个元素。\n\n然而，你不能说：\n\n点击此处查看代码图像\n\n```c\nheart = head;  /* 非法构造\
  \ */\n```\n\n这种情况类似于 `x = 3;` 与 `3 = x;`。赋值语句的左侧必须是一个变量，或者更通用地说是一个可修改的 `lvalue`，例如\
  \ `*p_int`。顺便提一下，`head = heart;` 不会让 Millie 字符串消失；它只是改变了存储在 `head` 中的地址。但是，除非你在别处保存了\
  \ `\"I love Millie!\"` 的地址，否则当 `head` 指向另一个位置时，你无法访问该字符串。\n\n有一种修改 `heart` 消息的方法——访问单个数组元素：\n\
  \n```c\nheart[7]= 'M';\n```\n\n或者\n\n```c\n*(heart + 7) = 'M';\n```\n\n数组的 `elements`\
  \ 是变量（除非数组被声明为 `const`），但 `name` 不是变量。\n\n让我们回到一个没有使用 `const` 修饰符的指针初始化：\n\n```c\n\
  char * word = \"frame\";\n```\n\n你可以使用指针来更改这个字符串吗？\n\n```c\nword[1] = 'l';  // 允许吗??\n\
  ```\n\n你的编译器可能允许这样做，但在当前的 C 标准下，此类操作的行为是未定义的。例如，这样的语句可能会导致内存访问错误。这是因为正如之前提到的，编译器可以选择用内存中的单副本来表示所有相同的字符串字面量。例如，以下语句都可能指向字符串\
  \ `\"Klingon\"` 的同一个内存位置：\n\n点击此处查看代码图像\n\n```c\nchar * p1 = \"Klingon\";\np1[0]\
  \ = 'F';  // 好?\nprintf(\"Klingon\");\nprintf(\": Beware the %ss!\\n\", \"Klingon\"\
  );\n```\n\n也就是说，编译器可以将每个实例 `\"Klingon\"` 替换为相同的地址。如果编译器使用这种单副本表示并允许将 `p1[0]` 改为\
  \ `'F'`，这将影响该字符串的所有使用，因此打印字符串字面量 `\"Klingon\"` 的语句实际上会显示 `\"Flingon\"`：\n\nFlingon:\
  \ Beware the Flingons!\n\n事实上，在过去，几个编译器确实表现出这种令人困惑的行为，而另一些则会产生中止的程序。因此，初始化指针指向字面量的推荐做法是使用\
  \ `const` 修饰符：\n\n点击此处查看代码图像\n\n```c\nconst char * pl = \";\n```\n\n然而，用非 `const`\
  \ 数组初始化字面量不会产生此类问题，因为数组获得的是字符串的副本。\n\n简而言之，如果你计划更改字符串，请不要使用指向字面量的指针。\n\n## 字符数组\n\
  \n拥有一个字符串数组是非常方便的。这样你可以使用下标访问多个不同的字符串。11.4 显示了两种方法：指向字符串的指针数组和 `char` 数组。\n\n列表\
  \ 11.4 arrchar.c 程序\n\n点击此处查看代码图像\n\n```c\n// arrchar.c -- 指针数组，字符数组\n#include <stdio.h>\n\
  #define SLEN 40\n#define LIM 5\nint main(void)\n{\n    const char *mytents[LIM]\
  \ = {\n        \"Adding swiftly\",\n        \"Multiplying accurately\",\n      \
  \  \"Following to the letter\",\n        \"Understanding the language\"\n    };\n\
  \    char talents[LIM][SLEN] = {\n        \"Walking in a straight line\",\n    \
  \    \"Sleeping\",\n        \"Mailing letters\",\n        \"Reading email\"\n  \
  \  };\n    int i;\n    puts(\"Let's compare talents.\");\n    printf(\"%-36s %25s\\\
  n\", \"My Talents\", \"Your Talents\");\n    for (i = 0; i < LIM; i++)\n       \
  \ printf(\"%-36s %25s\\n\", mytalents[i], talents[i]);\n    printf(\"\\sizeof mytalents:\
  \ %zd, sizeof yourtalents: %zd\\n\",\n           sizeof(mytents), sizeof(talents));\n\
  \    return 0;\n}\n```\n\n这是输出：\n\n点击此处查看代码图像\n\nLet's compare talents.\nMy Talents\
  \                             Your Talents\nAdding swiftly                     \
  \  Walking in a straight line\nMultiplying accurately                Sleeping\n\
  Following to the letter              Mailing letters\nUnderstanding the language\
  \           Reading email\nsizeof mytalents: 40, sizeof yourtalents: 200\n\n在某些方面，`mytalents`\
  \ 和 `talents` 非常相似。它们都代表五个字符串。当使用一个索引时（如 `mytalents[0]` 和 `talents[0]`），结果是单个字符串。正如\
  \ `mytalents[1][2]` 是 `'l'`（`mytalents` 表示的第二个字符串的第三个字符）一样，`talents[1][2]` 是 `'e'`（`talents`\
  \ 表示的第二个字符串的第三个字符）。它们以相同的方式初始化。\n\n\n\n但它们也存在差异。`mytalents` 数组是一个包含五个指针的数组，在我们的系统上占用\
  \ 40 字节。而 `yourtalents` 是一个包含五个数组的数组，每个数组包含 40 个 `char` 字节，在我们的系统上占用 200 字节。因此，`mytalents`\
  \ 与 `yourtalents` 是不同的类型，尽管 `mytalents[0]` 和 `yourtalents[0]` 都是字符串。`mytalents`\
  \ 中的指针指向初始化时使用的字符串字面量的位置，而这些字面量存储在静态内存中。然而，`yourtalents` 中的数组包含了字符串字面量的副本，因此每个字符串都存储了两次。此外，数组中的内存分配是低效的，因为\
  \ `yourtalents` 的每个元素必须具有相同的大小，且该大小必须足够容纳最长的字符串。\n\n可视化这种差异的一种方法是将 `yourtalents`\
  \ 视为一个矩形二维数组，其中每行的长度相同（在本例中为 40 字节）。接下来，将 `mytalents` 视为一个锯齿形数组（ragged array），即行长度不固定的数组。图\
  \ 11.2 显示了这两种数组。（实际上，`mytalents` 数组元素所指向的字符串并不一定必须连续存储在内存中，但该图确实说明了存储需求上的差异。）\n\n\
  ![Image](img/11fig02.jpg)\n\n图 11.2 矩形数组与锯齿形数组。\n\n结论是，如果你想用数组来表示一组要显示的字符串，指针数组比字符数组数组更高效。然而，这里也存在一个陷阱。由于\
  \ `mytalents` 中的指针指向字符串字面量，这些字符串不应该被修改。然而，`yourtalents` 的内容是可以被更改的。因此，如果你想修改字符串或为字符串输入留空间，请不要使用指向字符串字面量的指针。\n\
  \n## 指针与字符串\n\n也许你注意到在关于字符串的讨论中偶尔会提到指针。大多数字符串的 C 操作实际上都是通过指针完成的。例如，考虑 列表 11.5 所示的示例程序。\n\
  \n列表 11.5 `p_and_s.c` 程序\n\n点击此处查看代码图像\n\n```c\n/* p_and_s.c -- 指针与字符串 */\n\n#include\
  \ <stdio.h>\n\nint main(void)\n{\n    const char * mesg = \"Don't be a fool!\";\n\
  \    const char * copy;\n    copy = mesg;\n    printf(\"%s\\n\", copy);\n    printf(\"\
  mesg = %s; &mesg = %p; value = %p\\n\",\n           mesg, &mesg, mesg);\n    printf(\"\
  copy = %s; &copy = %p; value = %p\\n\",\n           copy, &copy);\n    return 0;\n\
  }\n```\n\n注意：如果你的编译器不支持 `%p`，请使用 `%u` 或 `%lu` 代替 `%p`。\n\n看着这个程序，你可能会认为它复制了字符串 `\"\
  Don't be a fool!\"`，而你对输出的第一眼观察可能会证实这个猜测：点击此处查看代码图像\n\nDon't be a fool!\n`mesg =\
  \ Don't be a fool!`; `&mesg = 0x02ff48`; `value = 0x0040a0`\n`copy = Don't be a\
  \ fool!`; `&copy = 0x02ff44`; `value = 0x0040a0`\n\n但仔细观察 `printf()` 的输出。首先，`mesg`\
  \ 和 `copy` 作为字符串打印（`%s`）。这里没什么惊喜；所有字符串都是 `\"Don't be a fool!\"`。每行的后续是指定指针的地址。对于这次运行，两个指针\
  \ `mesg` 和 `copy` 分别存储在位置 `0x02ff48` 和 `0x02ff44`。现在注意最后一项 `value`。它是指定指针的值。指针的值是它所包含的地址。你可以看到\
  \ `mesg` 指向位置 `0x0040a0`，`copy` 也是如此。因此，字符串本身从未被复制过。`copy = mesg;` 所做的只是产生了一个指向相同字符串的第二个指针。\n\
  \n为什么要这么做？为什么不复制整个字符串呢？问问自己，哪种更高效：复制一个地址，还是复制比如 50 个独立的元素？通常情况下，地址就是完成工作所需的全部。如果你确实需要一个完全相同的副本，可以使用本章稍后讨论的\
  \ `strcpy()` 或 `strncpy()` 函数。现在我们已经讨论了程序内部的字符串，让我们转向键盘输入的字符串。\n\n## 字符串输入\n\n如果你想将一个字符串读入程序中，你必须先留出存储该字符串的空间，然后使用输入函数获取该字符串。\n\
  \n## 创建空间\n\n首要任务是为读取后的字符串准备一个位置。正如前面提到的，这意味着你需要分配足够的存储空间来容纳你预期读取的任何字符串。不要期望计算机会自动帮你数。尝试这样做：\n\
  \n```c\nchar name;\nscanf(\"%s\", name);\n```\n\n`name` 是一个未初始化的指针，这可能会导致程序崩溃。简单的解决方法是在声明中包含式数组大小：\n\
  \n```c\nchar name[81];\n```\n\n现在 `name` 是分配了 81 字节的块。另一种可能性是使用 C 标准库提供的分配内存的函数，我们将在第\
  \ 12 章 中介绍这些。C 标准库提供了三类可以读取字符串的函数：`scanf()`、`gets()` 和 `fgets()`。最常用的是 `gets()`，我们先讨论它。\n\
  \n### 不幸的 gets() 函数\n\n回想一下，读取字符串时 `scanf()` 和 `%s` 格式说明只读取单个单词。如果程序一次读取一整行而不是单个单词，`gets()`\
  \ 函数多年来一直非常有用。它是一个简单且易用的函数。它读取直到换行符的整行内容，丢弃换行符，并剩余字符添加一个空字符创建一个 C 字符串。它通常与 `puts()`\
  \ 配对，后者显示字符串并添加换行符。列表 11.6 展示了一个适中的示例。\n\n```c\n/* getsputs.c -- 使用 gets() 和 puts()\
  \ */\n#include <stdio.h>\n#define STLEN 81\n\nint main(void)\n{\n    char words[STLEN];\n\
  \    puts(\"Enter a string, please.\");\n    gets(words);\n    printf(\"Your string\
  \ twice:\\n\");\n    printf(\"%s\\n\", words);\n    puts(words);\n    puts(\"Done.\"\
  );\n    return 0;\n}\n```\n\n这里有一个运行示例，或者至少是曾经有过的运行示例：点击此处查看代码图像\n\nEnter a string,\
  \ please.\nwarning: this program uses gets(), which is unsafe.\nOh, no!\nYour string\
  \ twice:\nOh, no!\nOh, no!\nDone.\n\n编译器采取了相当反常的行为，在程序输出中插入了一条警告！因此，每当你或其他人运行该程序时，此消息都会显示。并不是所有的编译器都会这样做。其他编译器可能会编译过程中发出警告，但并不那么吸引眼。\n\
  \n\n\n那么问题出在哪里呢？问题在于 `gets()` 并不检查输入行是否真的能放入数组。考虑到它在这里唯一的参数是 `words`，`gets()` 无法进行检查。回想一下数组名会被转换为第一个元素的地址。因此\
  \ `gets()` 只知道数组从哪里开始，而不知道它包含多少元素。\n\n如果输入字符串太长，就会发生`缓冲区溢出`（buffer overflow），这意味着多余的字符溢出了指定的区域。这些额外的字符可能只是进入了未使用的内存且没有产生时问题，也可能会覆盖你程序中的其他数据，但这些绝不是所有的可能性。这里有一个示例运行，其中我们将\
  \ `SLEN` 重置为 5，以便更容易触发缓冲区溢出：\n\n点击此处查看代码图像\n\n```\nEnter a string, please.\nwarning:\
  \ this program uses gets(), which is unsafe.\n\nI think I'll be just fine.\n\nYour\
  \ string twice:\n\nI think I'll be just fine.\n\nI think I'll be just fine.\n\n\
  Done.\n\nSegmentation fault: 11\n```\n\n“Segmentation fault”（段错误）听起来不健康，事实也如此。在\
  \ Unix 系统上，这条信息表示程序尝试访问未分配给它的内存。\n\n但 C 语言提供了许多由于糟糕编程而导致尴尬且难以追踪的失败的路径。那么，为什么要特别提出\
  \ `gets()` 呢？可能正是因为其不安全的行为构成了安全风险。在过去，人们利用使用 `gets()` 的系统程序来插入并运行会破坏系统安全的代码。\n\n\
  在很长一段时间里，C 语言社区的许多人一直建议从编程词汇中彻底除（banishing） `gets()`。创建 C99 标准的委员会还发布了标准理由说明。该说明承认了\
  \ `gets()` 的问题并不鼓励使用它。然而，它也为保留 `gets()` 作为标准的一部分提供了合理辩护，因为它在适当的情况下是一个方便的函数，而且它是许多现有代码的一部分。\n\
  \n然而，C11 委员会采取了更严厉的，并从标准中删除了 `gets()`。但是，标准规定的是编译器必须支持什么，而不是必须不能支持什么。在实践中，为了向后兼容，大多数编译器将继续提供该函数。但正如我们使用的编译器一样，它们并不对此感到高兴。\n\
  \n## gets() 的替代方案\n\n`gets()` 的传统替代方案是 `fgets()`，它的接口稍微复杂一些，处理输入的方式也略不同。C11 标准在其中加入了\
  \ `gets_s()`。它更像 `gets()`，并且更容易作为替代品替换到现有代码中。然而，它是 `stdio.h` 系列输入/输出函数的一个可选扩展，因此\
  \ C11 C 编译器并不需要支持它。\n\n### fgets() 函数（以及 fputs()）\n\n`fgets()` 函数通过接受第二个参数来限制读取的字符数，解决了可能的溢出问题。该函数是为文件输入设计的，这使得使用起来稍微有些麻烦。以下是\
  \ `fgets()` 与 `gets()` 的区别：\n\n![图像](img/squf.jpg) 它接收第二个参数，指示读取的最大字符数。如果该参数的值为\
  \ `n`，`fgets()` 将读取最多 `n-1` 个字符或遇到换行符，以先到者为准。\n\n![图像](img/squf.jpg) 如果 `fgets()`\
  \ 读取换行符，它将其存储在字符串中，而 `gets()` 则将其丢弃。\n\n![图像](img/squf.jpg) 它接收第三个参数，指示读取哪个文件。要从键盘读取，使用\
  \ `stdin`（标准输入）作为参数；该标识符定义在 `stdio.h` 中。\n\n由于 `fgets()` 函数将换行符作为字符串的一部分（假设输入行能够容），它通常与\
  \ `fputs()` 配对使用。`fputs()` 类似于 `puts()`，但它不会自动追加换行符。它接收第二个参数来指示写入哪个文件。对于计算机显示器，我们可以使用\
  \ `stdout`（标准输出）作为参数。列表 11.7 演示了 `fgets()` 和 `fputs()` 的行为。\n\n列表 11.7 fgets1.c\
  \ 程序\n\n点击此处查看代码图像\n\n* *\n\n```c\n/*  fgets1.c  -- 使用 fgets() 和 fputs() */\n\n\
  #include <stdio.h>\n\n#define STLEN 14\n\nint main(void)\n{\n    char words[STLEN];\n\
  \    puts(\"Enter a string, please.\");\n    fgets(words, STLEN, stdin);\n    printf(\"\
  Your string twice (puts(), then fputs()):\\n\");\n    puts(words);\n    fputs(words,\
  \ stdout);\n    puts(\"Enter another string, please.\");\n    fgets(words, STLEN,\
  \ stdin);\n    printf(\"Your string twice (puts(), then fputs()):\\n\");\n    puts(words);\n\
  \    fputs(words, stdout);\n    puts(\"Done.\");\n    return 0;\n}\n```\n\n* *\n\
  \n\n\n系统使用缓冲 I/O。这意味着输入会被存储在临时内存（缓冲区）中，直到按下回车键为止；回车键会向输入中添加一个换行符，并将整行发送给 `fgets()`。在输出时，`fputs()`\
  \ 将字符发送到另一个缓冲区，当发送换行符时，缓冲区的内容会被发送到显示器。\n\n`fgets()` 会存储换行符这一事实既是一个问题，也是一个机会。问题在于，你可能不希望换行符作为存储字符串的一部分。而机会在于，通过存储字符串中是否存在换行符，可以判断是否读取了整行内容。如果没有读完，你就可以决定如何处理行的剩余部分。\n\
  \n### 移除换行符\n\n首先，如何去掉换行符？一种方法是在存储的字符串中搜索换行符，并将其替换为空字符：\n\n点击此处查看代码图片\n\n```c\n\
  while (words[i] != '\\n') // 假设 words 中有 \\n\n    i++;\nwords[i] = '\\0';\n```\n\
  \n其次，如果输入行中仍有剩余字符怎么办？如果整行无法放入目标数组，一个合理的选择是丢弃无法容纳的部分：\n\n点击此处查看代码图片\n\n```c\nwhile\
  \ (getchar() != '\\n')  // 读取但不存储\n    continue;             // 输入包括 \\n\n```\n\n\
  列表 11.9 在这些基础概念的基础上增加了一些测试，以生成能够读取输入行、移除移除已存储的换行符（如果有）并丢弃无法容纳行部分的代码。\n\n#### 列表\
  \ 11.9 fgets3.c 程序\n\n点击此处查看代码图片\n\n```c\n/*  fgets3.c  -- 使用 fgets() */\n#include\
  \ <stdio.h>\n\n#define STLEN 10\n\nint main(void)\n{\n    char words[STLEN];\n \
  \   int i;\n    puts(\"输入字符串（空行退出）：\");\n    while (fgets(words, STLEN, stdin) !=\
  \ NULL\n                           && words[0] != '\\n')\n    {\n        i = 0;\n\
  \        while (words[i] != '\\n' && words[i] != '\\0')\n            i++;\n    \
  \    if (words[i] == '\\n')\n            words[i] = '\\0';\n        else // 必须是\
  \ words[i] == '\\0'\n            while (getchar() != '\\n')\n                continue;\n\
  \        puts(words);\n    }\n    puts(\"done\");\n    return 0;\n}\n```\n\n###\
  \ 循环\n\n点击此处查看代码图片\n\n```c\nwhile (words[i] != '\\n' && words[i] != '\\0')\n   \
  \ i++;\n```\n\n该循环遍历字符串，直到遇到换行符或空字符（以先到者为准）。如果字符是换行符，接下来的 `if` 语句将其替换为空字符。否则，`else`\
  \ 部分将处理输入行的剩余部分。以下是运行示例：\n\n点击此处查看代码图片\n\n输入字符串（空行退出）：\nThis\nThis\nprogram seems\n\
  program s\nunwilling to accept long lines.\nunwilling\nBut it doesn't get stuck\
  \ on long\nBut it do\nlines either.\nlines eit\ndone\n\n### 空字符 (Null) 与空指针 (Null)\n\
  \n空字符和空指针都出现在列表 11.9 中。从概念上讲，这两个“空”是不同的。空字符（或 `'\\0'`）是用于标记 C 字符串结束的字符。它的编码是零（0）。因为\
  \ 0 不是任何有效字符的编码，所以它不会意外出现在字符串的某部分。\n\n空指针（或 `NULL`）的值不对应于任何有效地址。它通常由那些本应返回有效地址的函数使用，用来指示特殊情况，例如遇到文件结束符（EOF）或未能按预期执行。\n\
  \n因此，空字符是整数类型，而空指针是指针类型。有时引起混淆的是两者都可以用数字 `0` 表示。但从概念上讲，它们是不同的类型。此外，空字符作为字符占用 1 字节，而空指针作为地址通常占用\
  \ 4 字节。\n\n### gets_s() 函数\n\nC1 可选的 `gets_s()` 函数与 `fgets()` 类似，使用一个参数来限制字符数量。给定列表\
  \ 11.9 中使用的相同定义，以下代码将一行输入读取到 `words` 数组中，并将换行符保留在前字符中：\n\n```c\ngets_s(words, STLEN);\n\
  ```\n\n与 `fgets()` 的三个主要区别如下：\n- `gets_s()` 只从标准输入读取，因此不需要第三个参数。\n- 如果 `gets_s()`\
  \ 读取了换行符，它会丢弃它而不是存储。\n- 如果 `gets_s()` 读取了最大数量的字符且未能读取到换行符，则会失败。\n\n\n\n\n如果 `fgets()`\
  \ 返回 `NULL`，表示文件结束或发生读取错误，`s_gets()` 将跳过剩余处理过程。否则，它模拟列表 11.9，如果字符串中存在换行符，则将其替换为空字符，否则丢弃该行的剩余部分。然后它会返回与\
  \ `fgets()` 相同的返回值。我们将在稍后的示例中使用此函数。\n\n你可能在想，为什么要丢弃过长行的剩余部分。问题在于，如果将行的剩余部分留在原处，它将成为下一次读取语句的输入。例如，如果下一个读取语句正在寻找\
  \ `double` 类型的值，这可能会导致程序崩溃。丢弃行的剩余部分可以保持读取语句与键盘输入之间的同步。\n\n我们的 `s_gets()` 函数并不完美。它最严重的缺陷是，当遇到不符合要求的输入时，它是沉默的。它在不通知程序或用户的情况下丢弃了多余的输入，从而关闭了其他选项，例如让用户重试或寻找更多的存储空间。另一个缺陷是它无法处理误用，例如传递了大小为\
  \ 1 或更小的尺寸。但它足够作为我们示例中 `gets()` 的替代品了。\n\n### scanf() 函数\n\n让我们再次回顾 `scanf()`。我们之前用过带有\
  \ `%s` 格式的 `scanf()` 读取字符串。`scanf()` 与 `gets()` 或 `fgets()` 的主要区别在于它们如何决定何时到达字符串末尾：`scanf()`\
  \ 更多地是一个“获取单词”函数而不是“获取字符串”函数。正如你所看到的，`gets()` 函数会读取到第一个换行符之前的所有字符，`fgets()` 也是如此（如果字符串很短）。`scanf()`\
  \ 函数有两种终止输入的选择。无论采用哪种选择，字符串都从第一个非空白字符开始。如果你使用 `%s` 格式，字符串将一直持续到（但不包括）下一个空白字符（空格、制表符或换行符）。如果你指定了字段宽度，例如\
  \ `%10s`，`scanf()` 将收集最多 10 个字符或到第一个空白字符，以先到为准（参见图 1.3）。\n\n图 1.3 字段宽度与 `scanf()`。\n\
  \n记住，`scanf()` 函数返回一个整数值，该值等于读取的项目数，或者在遇到文件结束时返回 `EOF`。列表 11.1 说明了当你指定字段宽度时 `scanf()`\
  \ 如何工作。\n\n#### 列表 11.1 scan_str.c 程序\n\n点击此处查看图像\n\n```c\n/* scan_str.c -- using\
  \ scanf() */\n#include <stdio.h>\nint main(void)\n{\n    char name1[11], name2[11];\n\
  \    int count;\n    printf(\"Please enter 2 names.\\n\");\n    count = scanf(\"\
  %5s %10s\",name1, name2);\n    printf(\"I read %d names and %s.\\n\", count, name1,\
  \ name2);\n    return 0;\n}\n```\n\n这里有三次运行：\n\n点击此处查看图像\n\nPlease enter 2 names.\n\
  Jesse Jukes\nI read 2 names and Jukes.\n\nPlease enter 2 names.\nLiza Appletham\n\
  I read 2 names and Applebotth.\n\nPlease enter 2 names.\nPortensia\nI read 2 names\
  \ and nsia.\n\n在第一个示例中，两个名字都在允许的大小范围内。在第二个示例中，只读取了 `Appletham` 的前 10 个字符，因为我们使用了\
  \ `%10s` 格式。在第三个示例中，`Portensia` 的最后四个字母进入了 `name2`，因为第二次调用 `scanf()` 从第一次结束的地方继续读取输入；在这种情况下，它仍在\
  \ `Portensia` 单词内部。\n\n根据所需输入的性质，你可能使用 `gets()` 从键盘读取文本会更好。。例如，对于输入书名或歌曲名，`scanf()`\
  \ 可能没那么有用，除非名称是单单词。`scanf()` 的典型用途是读取并转换以某种标准形式的混合数据类型。例如，如果每行输入包含工具的名称、库存数量和物品成本，你可能会使用\
  \ `scanf()`，或者自己编写一个函数来做一些输入检查。如果你想一次处理一个单词，可以使用 `scanf()`。\n\n`scanf()` 函数具有与 `gets()`\
  \ 相同的潜在缺陷；如果输入单词不适应目标位置，它可能会产生溢出。但你可以使用 `%s` 说明符中的字段宽度选项来防止溢出。\n\n## 字符串输出\n\n现在从字符串输入转向字符串输出。同样，我们将使用库函数。C\
  \ 有三个用于打印字符串的标准库函数：`puts()`、`fputs()` 和 `printf()`。\n\n#### puts() 函数\n\n`puts()`\
  \ 函数非常易用。只需给它一个字符串地址作为参数。列表 11.12 展示了实现此目的许多方法之一。\n\n#### 列表 11.12 put_out.c 程序\n\
  \n点击此处查看图像\n\n```c\n/* put_out.c -- using puts() */\n#include <stdio.h>\n#define\
  \ DEF \"I am a defined string.\"\nint main(void)\n{\n    char str1[80] = \"An array\
  \ was initialized to me.\";\n    const char * str2 = \"A pointer was initialized\
  \ to me.\";\n    puts(\"I'm an argument to puts()\");\n    puts(DEF);\n    puts(str1);\n\
  \    puts(&str1[5]);\n    puts(str2+4);\n    return 0;\n}\n```\n\n输出如下：\n\n点击此处查看图像\n\
  \nI'm an argument to puts().\nI am a defined string.\nAn array was initialized to\
  \ me.\nA pointer was initialized to me.\nray was initialized to me.\nized to me.\n\
  \n`puts()` 在显示字符串时会自动附加换行符。这个示例提醒你双引号中的短语被视为地址。表达式 `&str1[5]` 是 `str1` 的第六个元素。同样，`str2+4`\
  \ 指向包含 'i' 的内存单元。\n\n`puts()` 如何知道何时停止？它遇到空字符时停止，所以那里最好有一个。不要模仿列表 11.13 中的程序！\n\n\
  ```c\n/* nono.c -- no! */\n#include <stdio.h>\nint main(void)\n{\n    char side_a[]\
  \ = \"Side A\";\n    char dont[] = {'W', 'O', 'W', '!' };\n    char side_b[] = \"\
  Side B\";\n    puts(dont); /* dont is not a string */\n    return 0;\n}\n```\n\n\
  由于 `dont` 缺少结束空字符，它不是字符串，所以 `puts()` 不知道在哪里停止。它将继续从 `dont` 之后的内存打印，直到在某处找到空字符。这里使用的特定编译器将\
  \ `side_a` 数组存储在 `dont` 数组之后，因此 `puts()` 一直运行直到遇到 `side_a` 中的空字符。\n\n\n\n\n\n![Image](img/squf.jpg)\
  \ 与 `puts()` 不同，`fputs()` 不会自动向输出添加换行符。\n\n请注意 `gets()` 在输入时会丢弃换行符，而 `puts()` 在输出时会添加换行符。相反，`fgets()`\
  \ 在输入时存储换行符，而 `fputs()` 在输出时不添加换行符。假设你想写一个循环，读取一行并在下一行回显该行。你可以这样做：\n\n点击此处查看代码图片\n\
  \n```c\nchar line[81];\n\nwhile (gets(line))  // 等同于 while (gets(line) != NULL)\n\
  \    puts(line);\n```\n\n记住 `gets()` 在遇到文件结束（EOF）时会返回空指针。空指针求值为零，或假（false），从而终止循环。或者你也可以这样做：\n\
  \n```c\nchar line[81];\n\nwhile (fgets(line, 81, stdin))\n    fputs(line, stdout);\n\
  ```\n\n在第一个循环中，`line` 数组中的字符串会显示在单独的一行，因为 `puts()` 添加了换行符。在第二个循环中，`line` 数组中的字符串会显示在单独的一行，因为\
  \ `fgets()` 存储了换行符。注意，如果你将 `fgets()` 输入与 `puts()` 输出混合使用，每个字符串将显示两个换行符。这一点在于 `puts()`\
  \ 设计用于与 `gets()` 配合，而 `fputs()` 设计用于与 `fgets()` 配合。\n\n当然，我们提到 `gets()` 只是为了让你在代码中遇到它时知道它是如何工作的，而不是鼓励你使用它。\n\
  \n## printf() 函数\n\n我们在第 4 章“字符字符串和格式化输入/输出”中非常彻底地讨论过 `printf()`。像 `puts()` 一样，它接受一个字符串地址作为参数。`printf()`\
  \ 函数的使用不如 `puts()` 方便，但它更通用，因为它可以格式化各种数据类型。\n\n区别之一是 `printf()` 不会自动将每个字符串打印在新行上。相反，你必须指定想在何换行。因此，\n\
  \n```c\nprintf(\"%s\\n\", string);\n```\n\n的效果与以下相同：\n\n```c\nputs(string);\n```\n\
  \n如你所见，第一形式需要更多的输入。计算机执行的时间也更长（尽管你可能察觉）。另一方面，`printf()` 使得组合字符串进行单行打印变得简单。例如，以下语句将\
  \ `Well,` 与用户名以及一个 `#defined` 字符字符串组合在同一行中：\n\n```c\nprintf(\"Well, %s, %s\\n\"\
  , name, MSG);\n```\n\n## 自行其事的选项\n\n你不限于标准 C 库的输入输出选项。如果你没有这些选项或不喜欢，可以基于 `getchar()`\
  \ 和 `putchar()` 准备自己的版本。假设你需要一个像 `puts()` 但不自动添加换行符的函数。列表 11.14 显示了创建它的方法。\n\n列表\
  \ 11.14 put1() 函数\n\n点击此处查看代码图片\n\n```c\n/* put1.c -- 打印字符串但不添加 \\n */\n\n#include\
  \ <stdio.h>\n\nvoid put1(const char * string) /* string 不会被修改 */\n{\n    while (*string\
  \ != '\\0')\n        putchar(*string++);\n}\n```\n\n`char` 指针 `string` 最初指向被调用参数的第一个元素。因为此函数没有更改字符串，所以使用了\
  \ `const` 修饰符。在打印完该元素的内容后，指针递增并指向下一个元素。此过程一直持续到指针指向包含空字符的元素。记住，`++` 的优先级高于 `*`，这意味着\
  \ `putchar(*string++)` 打印 `string` 指向的值，但递增的是 `string` 本身，而不是它所指向的字符。\n\n你可以将 `put1.c`\
  \ 视为编写字符串处理函数的模型。因为每个字符串都有一个空字符标记结束，所以你不需要向函数传递尺寸。相反，函数逐个处理每个字符，直到遇到空字符。\n\n编写该函数的稍长的方法是使用数组符号：\n\
  \n```c\nint i = 0;\n\nwhile (string[i]!= '\\0')\n    putchar(string[i++]);\n```\n\
  \n这涉及到一个额外的索引变量。\n\n许多 C 程序员会使用以下 `while` 循环测试：\n\n```c\nwhile (*string)\n```\n\n\
  当 `string` 指向空字符时，`*string` 的值为 `0`，从而终止循环。这种方法确实比之前的版本需要的字符更少。如果你不熟悉 C 实践，这就不那么显而易见。然而，这种用法广泛，C\
  \ 程序员应该熟悉它。\n\n**注意**\n\n为什么列表 11.14 使用 `const char * string` 而不是 `const char string[]`\
  \ 作为形式参数？从技术上讲，两者是等价的，所以任何形式都有效。使用括号符号的一个原因是为了提醒用户函数正在处理数组。然而，对于字符串，实际参数可以是数组、引号内的字符串或声明为\
  \ `char` 的变量。使用 `const char * string` 提醒你实际参数不一定是数组。\n\n如果你想要一个像 `puts()` 但还能告诉你有多少个字符的函数（不换行），如列表\
  \ 11.14 所示，这很容易实现。\n\n列表 11.15 put2() 函数\n\n点击此处查看代码图片\n\n```c\n/* put2.c -- 打印字符串并计数\
  \ */\n\n#include <stdio.h>\n\nint put2(const char * string)\n{\n    int count =\
  \ 0;\n    while (*string) /* 常用用法 */\n    {\n        putchar(*string++);\n     \
  \   count++;\n    }\n    putchar('\\n');\n    return(count);\n}\n```\n\n以下调用将 `pizza`\
  \ 赋值给 `num`（在获取 `put2()` 的值之前，先打印了字符串）：\n\n```c\nnum = put2(\"pizza\");\n```\n\n\
  列表 11.16 展示了使用 `put1()` 和 `put2()` 的嵌套调用。\n\n列表 11.16 put_put.c 程序\n\n点击此处查看代码图片\n\
  \n```c\n//put_put.c -- 自定义输出函数\n#include <stdio.h>\nvoid put1(const char *);\nint\
  \ put2(const char *);\n\nint main(void)\n{\n    put1(\"If'd as much money\");\n\
  \    put1(\" as I could spend,\\n\");\n    printf(\"I count %d characters.\\n\"\
  ,\n      put2(\"never would old chairs to mend.\"));\n    return 0;\n}\n\nvoid put1(const\
  \ char * string)\n{\n    while (*string) /* 等于 *string != '\\0' */\n        putchar(*string++);\n\
  }\n\nint put2(const char * string)\n{\n    int count = 0;\n    while (*string)\n\
  \    {\n        putchar(*string++);\n        count++;\n    }\n    putchar('\\n');\n\
  \    return(count);\n}\n```\n\n嗯，我们使用 `printf()` 来打印 `put2()` 的值，但在获取 `put2()` 的值之前，计算机必须执行该函数，导致字符串被打印。这里是输出：\n\
  \n点击此处查看代码图片\n\nIf'd as much money as I could spend,\nI never would old chairs to\
  \ mend.\nI count 37 characters.\n\n## 字符串函数\n\nC 库提供了几种字符串处理函数；ANSI C 使用 `string.h`\
  \ 头文件提供这些原型。我们将查看一些最实用且常用的函数：`strlen()`、`strcat()`、`strncat()`、`strcmp()`、`strncmp()`、`strcpy()`\
  \ 和 `strncpy()`。我们还将检查由 `stdio.h` 头文件支持的 `sprintf()`。关于 `string.h` 系列函数的完整列表，请参阅参考章节\
  \ V“标准 ANSI C 库及 C99 扩展,”见附录 B。\n\n### strlen() 函数\n\n`strlen()` 函数如你所知，用于找到字符串的长度。它被用于下一个示例，一个缩短长字符串的函数：\n\
  \n点击此处查看代码图片\n\n```c\nvoid fit(char *string, unsigned int size)\n{\n    if (strlen(string)\
  \ > size)\n```\n\n\n\n\n\n```c\nstring[size] = '\\0';\n\n}\n```\n\n此函数确实修改了字符串，因此函数头在声明形式参数\
  \ `string` 时没有使用 `const`。\n\n尝试在列表 11.17 的测试程序中使用 `fit()` 函数。注意，代码使用了 C 语言的字符串字面量连接特性。\n\
  \n### 列表 11.17 test_fit.c 程序\n\n点击此处查看代码图像\n\n```c\n/* test_fit.c -- 尝试字符串缩减函数 */\n\
  \n#include <stdio.h>\n\n#include <string.h> /* 包含字符串函数原型 */\n\nvoid fit(char *,\
  \ unsigned int);\n\nint main(void)\n{\n    char mesg[] = \"Things should be as simple\
  \ as possible,\"\n    \" but not simpler.\";\n    puts(mesg);\n    fit(mesg,38);\n\
  \    puts(mesg);\n    puts(\"Let's look at some more of the string.\");\n    puts(mesg\
  \ + 39);\n    return 0;\n}\n\nvoid fit(char *string, unsigned int size)\n{\n   \
  \ if (strlen(string) > size)\n        string[size] = '\\0';\n}\n```\n\n输出如下：\n\n\
  点击此处查看代码图像\n\nThings should be as simple as possible, but not simpler.\n\nThings\
  \ should be as simple as possible\n\nLet's look at some more of the string.\n\n\
  but not simpler.\n\n`fit()` 函数在数组的第 39 个元素处放置了一个 `'\\0'` 字符，替换掉了一个逗号。`puts()` 函数在遇到第一个空字符时停止并忽略数组的其余部分。然而，数组的其余部分仍然存在，如下调用所示：\n\
  \n```c\nputs(mesg + 8);\n```\n\n表达式 `mesg + 39` 是 `mesq[39]` 的地址，这是一个空格字符。因此 `puts()`\
  \ 显示该字符并继续运行，直到遇到原始的空字符。图 11.4 （用一个较短的字符串）说明了该程序中发生的情况。\n\n![Image](img/11fig04.jpg)\n\
  \n图 11.4 `puts()` 函数与空字符。\n\n（`mesg` 数组中引用的变体归功于阿尔伯特·爱因斯坦，但它看起来更有可能是他哲学的体现，而非直接引用。）\n\
  \n`string.h` 文件包含了 C 族字符串函数的函数原型，这就是为什么这个示例包含了它。\n\n### 注意\n\n某些非 ANSI 系统使用 `strings.h`\
  \ 代替，而另一些系统可能完全缺少字符串头文件。\n\n### strcat() 函数\n\n`strcat()`（字符串连接）函数接受两个字符串作为参数。第二个字符串的副本会被附加在第一个字符串的末尾，这个组合后的版本变成新的第一个字符串。第二个字符串不会被修改。`strcat()`\
  \ 函数的类型为 `char *`（即指向 `char` 的指针）。它返回第一个参数的值——即附加第二个字符串的字符串第一个字符的地址。\n\n列表 11.18\
  \ 展示了 `strcat()` 的功能。它还使用了我们在列表 11.10 中定义的 `s_gets()` 函数；记得它使用 `fgets()` 读取一行，然后如果存在换行符，则将其移除。\n\
  \n### 列表 11.18 str_cat.c 程序\n\n点击此处查看代码图像\n\n```c\n/* str_cat.c -- 合并两个字符串 */\n\n\
  #include <stdio.h>\n\n#include <string.h>  /* 声明 strcat() 函数 */\n\n#define SIZE\
  \ 80\n\nchar * s_gets(char * st, int n);\n\nint main(void)\n{\n    char flower[SIZE];\n\
  \    char addon[] = \"s smell like old shoes.\";\n    puts(\"What is your favorite\
  \ flower?\");\n    if (s_gets(flower, SIZE))\n    {\n        strcat(flower, addon);\n\
  \        puts(flower);\n        puts(addon);\n    }\n    else\n        puts(\"End\
  \ of file!\");\n    puts(\"bye\");\n    return 0;\n}\n\nchar * s_gets(char * st,\
  \ int n)\n{\n    char * ret_val;\n    int i = 0;\n    ret_val = fgets(st, n, stdin);\n\
  \    if (ret_val)\n    {\n        while (st[i] != '\\n' && st[i] != '\\0')\n   \
  \         i++;\n        if (st[i] == '\\n')\n            st[i] = '\\0';\n      \
  \  else // 必须有 words[i] == '\\0'\n            while (getchar() != '\\n')\n     \
  \       continue;\n    }\n    return ret_val;\n}\n```\n\n这是一个示例输出：\n\n点击此处查看代码图像\n\
  \nWhat is your favorite flower?\n\nwonderflowerflowers like old shoes.\n\ns smell\
  \ like old shoes.\n\nbye\n\n输出说明了 `flower` 被修改了，而 `addon` 没有。\n\n### strncat() 函数\n\
  \n`strcat()` 函数像 `gets()` 一样会导致缓冲区溢出。那么，为什么 C 标准不弃用 `strcat()` 而只提供 `strncat()`？一个原因可能是\
  \ `gets()` 将程序暴露给使用程序的人，而 `strcat()` 将程序暴露给粗心程序员的危险。你无法控制未来某些用户会做什么，但你可以控制进入程序的内容。C\
  \ 信任程序员的哲学随之而来，责任在于识别何时可以安全地使用 `strcat()`。\n\n你可以，如列表 11.15 所示，使用 `strlen()` 来检查为数组留出的空间。例如，`strcat(bugs,\
  \ 13)` 会将 `addon` 的内容添加到 `bugs`，直到遇到 13 个字符或空字符（以先者为准）。`strncat()` 接受第二个参数指示要添加字符的最大数量。因此，考虑到空字符，`bugs`\
  \ 数组应该足够容纳原始字符串。\n\n### 列表 11.19 join_chk.c 程序\n\n点击此处查看代码图像\n\n```c\n/* join_chk.c\
  \ -- 合并两个字符串，先检查大小 */\n\n#include <stdio.h>\n\n#include <string.h>\n\n#define SIZE\
  \ 30\n\n#define BUGSIZE 13\n\nchar * s_gets(char * st, int n);\n\nint main(void)\n\
  {\n    char flower[SIZE];\n    char addon[] = \"s smell like old shoes.\";\n   \
  \ char bug[BUGSIZE];\n    int available;\n    puts(\"What is your favorite flower?\"\
  );\n    s_gets(flower, SIZE);\n    if ((strlen(addon) + strlen(flower) + 1) <= SIZE)\n\
  \        strcat(flower, addon);\n    puts(flower);\n    puts(\"What is your favorite\
  \ bug?\");\n    s_gets(bug, BUGSIZE);\n    available = BUGSIZE - strlen(bug) - 1;\n\
  \    strncat(bug, addon, available);\n    puts(bug);\n    return 0;\n}\n\nchar *\
  \ s_gets(char * st, int n)\n{\n    char * ret_val;\n    int i = 0;\n    ret_val\
  \ = fgets(st, n, stdin);\n    if (ret_val)\n    {\n        while (st[i] != '\\n'\
  \ && st[i] != '\\0')\n            i++;\n        if (st[i] == '\\n')\n          \
  \  st[i] = '\\0';\n        else // 必须有 words[i] == '\\0'\n            while (getchar()\
  \ != '\\n')\n            continue;\n    }\n    return ret_val;\n}\n```\n\n这里有一个示例运行：\n\
  \nWhat is your favorite flower?\n\nRose\n\nRoses smell like old shoes.\n\nWhat is\
  \ your favorite bug?\n\nAphid\n\nAphids\n\n你可能注意到 `strcat()` 和 `gets()` 一样会导致缓冲区溢出。那么，为什么\
  \ C11 标准不弃用 `strcat()` 而只提供 `strncat()`？一个原因可能是 `gets()` 将程序暴露给使用程序的人，而 `strcat()`\
  \ 将程序暴露给粗心程序员的危险。你无法控制未来某些用户会做什么，但你可以控制进入程序的内容。C 信任程序员的哲学随之而来，责任在于识别何时可以安全地使用 `strcat()`。\n\
  \n### strcmp() 函数\n\n假设你想将某人的响应与存储的字符串进行比较，如列表 11.20 所示。\n\n### 列表 11.20 nogo.c\
  \ 程序\n\n点击此处查看代码图像\n\n```c\n/* nogo.c -- 这能行吗？ */\n\n#include <stdio.h>\n\n#define\
  \ ANSWER \"Grant\"\n#define SIZE 40\n\nchar * s_gets(char * st, int n);\n\nint main(void)\n\
  {\n    char try[SIZE];\n    puts(\"Who is buried in Grant's tomb?\");\n    s_gets(try,\
  \ SIZE);\n    while (try != ANSWER)\n    {\n        puts(\"No, that's wrong. Try\
  \ again.\");\n    }\n}\n```\n\n\n\n\n\n```c\n    s_gets(try, SIZE);\n\n    }\n\n\
  \    puts(\"That's right!\");\n\n    return 0;\n}\n\nchar * s_gets(char * st, int\
  \ n)\n{\n    char * ret_val;\n    int i = 0;\n    ret_val = fgets(st, n, stdin);\n\
  \    if (ret_val)\n    {\n        while (st[i] != '\\n' && st[i] != '\\0')\n   \
  \         i++;\n        if (st[i] == '\\n')\n            st[i] = '\\0';\n      \
  \  else // must have words[i] == '\\0'\n            while (getchar() != '\\n')\n\
  \                continue;\n    }\n    return ret_val;\n}\n```\n\n* *\n\n尽管这个程序看起来很不错，但它无法正常工作。`ANSWER`\
  \ 和 `try` 实际上是指针，因此比较 `try != ANSWER` 并没有检查两个字符串是否相同。相反，它检查的是两个字符串具有相同的地址。由于 `ANSWER`\
  \ 和 `try` 存储在不同的位置，这两个地址永远不会相同，用户会被永远告诉他或她是错误的。这样的程序往往会让人感到气馁。\n\n你需要的是一个比较字符串*内容*而不是字符串*地址*的函数。你可以设计一个，但\
  \ `strcmp()`（用于*字符串比较*）已经为你完成了这项工作。这个函数对字符串的作用就像关系运算符对数字的作用一样。具体来说，如果它的两个字符串参数相同，它返回\
  \ `0`，否则返回非零。修改后的程序见列表 11.21。\n\n#### 列表 11.21 compare.c 程序\n\n点击此处查看代码图像\n\n* *\n\
  \n```c\n/* compare.c -- this will work */\n#include <stdio.h>\n#include <string.h>\
  \   // declares strcmp()\n#define ANSWER \"Grant\"\n#define SIZE 40\n\nchar * s_gets(char\
  \ * st, int n);\n\nint main(void)\n{\n    char try[SIZE];\n    puts(\"Who is buried\
  \ in Grant's tomb?\");\n    s_gets(try, SIZE);\n    while (strcmp(try,ANSWER) !=\
  \ 0)\n    {\n        puts(\"No, that's wrong. Try again.\");\n        s_gets(try,\
  \ SIZE);\n    }\n    puts(\"That's right!\");\n    return 0;\n}\n\nchar * s_gets(char\
  \ * st, int n)\n{\n    char * ret_val;\n    int i = 0;\n    ret_val = fgets(st,\
  \ n, stdin);\n    if (ret_val)\n    {\n        while (st[i] != '\\n' && st[i] !=\
  \ '\\0')\n            i++;\n        if (st[i] == '\\n')\n            st[i] = '\\\
  0';\n        else // must have words[i] == '\\0'\n            while (getchar() !=\
  \ '\\n')\n                continue;\n    }\n    return ret_val;\n}\n```\n\n* *\n\
  \n* *\n\n### 注意\n\n由于任何非零值都是“真”，大多数经验丰富的 C 程序员会将 `while` 语句简写为 `while (strcmp(try,ANSWER))`。\n\
  \n* *\n\n`strcmp()` 的优特性之一是它比较的是字符串而不是数组。虽然数组 `try` 占据了 40 个单元格，而 `\"Grant\"` 只有六个（一个用于空字符），但比较只查看\
  \ `try` 中直到其空字符为止的部分。因此，`strcmp()` 可用于比较存储在不同大小数组中的字符串。如果用户回答 `\"GRANT\"` 或 `\"\
  grant\"` 怎么办？用户会被告诉他或她是错误的。为了让程序更友好，你必须预料到所有可能的正确答案。有一些技巧可以采用。例如，你可以使用 `#define`\
  \ 将答案定义为 `\"GRANT\"`，并编写一个将所有输入转换为大写的函数。这消除了大小写引起的问题，但你仍然需要担心其他形式，以及朱莉娅（Julia）也埋葬在其中的的事实。我们将这些考虑留给你们练习。\n\
  \n#### strcmp() 的返回值\n\n如果字符串不同，`strcmp()` 返回什么值？列表 11.22 显示了一个示例。\n\n##### 列表 11.22\
  \ compback.c 程序\n\n点击此处查看代码图像\n\n* *\n\n```c\n/* compback.c -- strcmp returns */\n\
  #include <stdio.h>\n#include <string.h>\nint main(void)\n{\n    printf(\"strcmp(\\\
  \"A\\\", \\\"A\\\") is \");\n    printf(\"%d\\n\", strcmp(\"A\", \"A\"));\n    printf(\"\
  strcmp(\\\"A\\\", \\\"B\\\") is \");\n    printf(\"%d\\n\", strcmp(\"A\", \"B\"\
  ));\n    printf(\"strcmp(\\\"B\\\", \\\"A\\\") is \");\n    printf(\"%d\\n\", strcmp(\"\
  B\", \"A\"));\n    printf(\"strcmp(\\\"C\\\", \\\"A\\\") is \");\n    printf(\"\
  %d\\n\", strcmp(\"C\", \"A\"));\n    printf(\"strcmp(\\\"Z\\\", \\\"a\\\") is \"\
  );\n    printf(\"%d\\n\", strcmp(\"Z\", \"a\"));\n    printf(\"strcmp(\\\"apples\\\
  \", \\\"apple\\\") is \");\n    printf(\"%d\\n\", strcmp(\"apples\", \"apple\"));\n\
  \    return 0;\n}\n```\n\n* *\n\n以下是某个系统上的输出：点击此处查看图像\n\n```\nstrcmp(\"A\", \"A\"\
  ) is 0\nstrcmp(\"A\", \"B\") is -1\nstrcmp(\"B\", \"A\") is 1\nstrcmp(\"C\", \"\
  A\") is 1\nstrcmp(\"Z\", \"a\") is -1\nstrcmp(\"apples\", \"apple\") is 1\n```\n\
  \n如果初始字符相同怎么办？通常情况下，`strcmp()` 会一直移动，直到找到第一对不相同的字符。然后它返回相应的代码。例如，在最后一个例子中，`\"apples\"\
  ` 和 `\"apple\"` 在第一个字符串的最后一个 `s` 之前是一致的。这与 `\"apple\"` 中的第六个字符匹配，即空字符，ASCII 0。由于空字符是\
  \ ASCII 序列中的第一个字符，`s` 在它之后，因此函数返回一个正值。最后一次比较指出 `strcmp()` 比较的是所有字符而不仅仅是字母，所以与其说比较是按字母顺序的，我们应该说\
  \ `strcmp()` 是根据机器排序顺序进行的。这意味着字符是根据它们的数值表示（通常是 ASCII 值）进行比较的。在 ASCII 中，大写字母的代码在小写字母代码之前。因此，`strcmp(\"\
  Z\", \"a\")` 是负值。\n\n大多数时候，你并不关心返回的精确值。你只想知道它是零还是非零——也就是说，是否有匹配——或者你可能正在尝试按字母顺序排序字符串，在这种情况下，你想知道比较是正的、负的还是零。\n\
  \n* *\n\n### 注意\n\n`strcmp()` 函数用于比较*字符串*而不是*字符*。因此你可以使用诸如 `\"apples\"` 和 `\"A\"\
  ` 这样的参数，但你不能使用字符参数，例如 `'A'`。不过，请记住 `char` 类型是一种整数类型，因此你可以使用关系运算符进行字符比较。假设 `word`\
  \ 是存储在 `char` 数组中的字符串，`ch` 是一个 `char` 变量。那么以下语句是有效的：点击此处查看图像\n\n```c\nif (strcmp(word,\
  \ \"quit\") == 0)  // 字符串使用 strcmp()\n    puts(\"Bye!\");\nif (ch == 'q')      \
  \          // 字符使用 ==\n    puts(\"Bye!\");\n```\n\n但是，不要将 `ch` 或 `'q'` 作为 `strcmp()`\
  \ 的参数。\n\n* *\n\n\n\n\n\n```c\n#define STOP \"quit\"\n\nchar * s_gets(char * st,\
  \ int n);\n\nint main(void)\n{\n    char input[LIM][SIZE];\n    int ct = 0;\n  \
  \  printf(\"Enter up to %d lines (type quit to quit):\\n\", LIM);\n    while (ct\
  \ < LIM && s_gets(input[ct], SIZE) != NULL &&\n             strcmp(input[ct],STOP)\
  \ != 0)\n    {\n        ct++;\n    }\n    printf(\"%d strings entered\\n\", ct);\n\
  \    return 0;\n}\n\nchar * s_gets(char * st, int n)\n{\n    char * ret_val;\n \
  \   int i = 0;\n    ret_val = fgets(st, n, stdin);\n    if (ret_val)\n    {\n  \
  \      while (st[i] != '\\n' && st[i] != '\\0')\n            i++;\n        if (st[i]\
  \ == '\\n')\n            st[i] = '\\0';\n        else // must have words[i] == '\\\
  0'\n            while (getchar() != '\\n')\n                continue;\n    }\n \
  \   return ret_val;\n}\n```\n\n该程序在遇到 `EOF` 字符（在这种情况下 `s_gets()` 返回 `NULL`）、输入单词\
  \ `quit` 或达到限制限制 `LIM` 时会停止读取输入。\n\n顺便提一下，有时通过输入一个空行来结束输入——即在不输入任何其他内容的情况下按 Enter\
  \ 键或 Return 键——更为方便。为了这样做，你可以修改 `while` 循环控制语句使其如下所示：\n\n点击此处查看代码图片\n\n```c\nwhile\
  \ (ct < LIM && s_gets(input[ct], SIZE) != NULL\n             && input[ct][0] !=\
  \ '\\0')\n```\n\n在这里，`input[ct]` 是输入的字符串，`input[ct][0]` 是该字符串的第一个字符。如果用户输入空行，`s_gets()`\
  \ 会第一个元素中放置空字符，因此表达式 `input[ct][0] != '\\0'` 用于测试空输入。\n\n### `strncmp()` 变体\n\n\
  `strcmp()` 函数比较字符串直到找到不同的字符为止。而 `strncmp()` 函数在字符不同或比较完第三个参数指定的数量的字符时停止比较。例如，如果你想搜索以\
  \ `\"astro\"` 开头的字符串，可以将搜索限制为前五个字符。列表 11.24 展示了如何做到。\n\n列表 11.24 starsrch.c 程序\n\
  \n点击此处查看代码图片\n\n```c\n/* starsrch.c -- use strncmp() */\n#include <stdio.h>\n#include\
  \ <string.h>\n#define LISTSIZE 6\n\nint main()\n{\n    const char * list[LISTSIZE]\
  \ =\n    {\n        \"astronomy\", \"astounding\",\n        \"astrophysics\", \"\
  astracize\",\n        \"asterism\", \"astrophobia\"\n    };\n    int count = 0;\n\
  \    int i;\n    for (i = 0; i < LISTSIZE; i++)\n        if (strncmp(list[i],\"\
  astro\", 5) == 0)\n        {\n            printf(\"Found: %s\\n\", list[i]);\n \
  \           count++;\n        }\n    printf(\"The list contained %d words with astro.\\\
  n\", count);\n    return 0;\n}\n```\n\n这是输出：\n点击此处查看代码图片\nastronomy\nastrophysics\n\
  astrophobia\nThe list contained 3 words with astro.\n\n### `strcpy()` 函数 函数\n\n\
  我们已经说过，如果 `pts1` 和 `pts2` 都是指针，表达式 `pts2 = pts1` 只拷贝字符串地址而不是字符串本身。但假设你想拷贝一个字符串，可以使用\
  \ `strcpy()` 函数。列表 11.25 要求用户输入带有 `q` 的单词。程序将输入拷贝到临时数组，如果第一个字母是 `q`，程序使用 `strcpy()`\
  \ 将字符串从临时数组拷贝到目标。`strcpy()` 函数是赋值运算符的字符串等效操作。\n\n列表 11.25 copy1.c\n\n点击此处查看代码图片\n\
  \n```c\n/* copy1.c -- strcpy() */\n#include <stdio.h>\n#include <string.h>  // declares\
  \ strcpy\n#define SIZE 40\n#define LIM 5\nchar * s_gets(char * st, int n);\nint\
  \ main(void)\n{\n    char qwords[LIM][SIZE];\n    char temp[SIZE];\n    int i =\
  \ 0;\n    printf(\"Enter %d words with q:\\n\", LIM);\n    while (i < LIM && s_gets(temp,\
  \ SIZE))\n    {\n        if (temp[0] != 'q')\n            printf(\"%s doesn't begin\
  \ with q!\\n\", temp);\n        else\n        {\n            strcpy(qwords[i], temp);\n\
  \            i++;\n        }\n    }\n    puts(\"Here are the words accepted:\");\n\
  \    for (i = 0; i < LIM; i++)\n        puts(qwords[i]);\n    return 0;\n}\n\nchar\
  \ * s_gets(char * st, int n)\n{\n    char * ret_val;\n    int i = 0;\n    ret_val\
  \ = fgets(st, n, stdin);\n    if (ret_val)\n    {\n        while (st[i] != '\\n'\
  \ && st[i] != '\\0')\n            i++;\n        if (st[i] == '\\n')\n          \
  \  st[i] = '\\0';\n        else // must have words[i] == '\\0'\n            while\
  \ (getchar() != '\\n')\n                continue;\n    }\n    return ret_val;\n\
  }\n```\n\n这是一个示例运行：\nEnter 5 words with q:\nquackery\nquasar\nquilt\nquotient\n\
  no more\nno more doesn't begin with q!\nquiz\nHere are the words accepted:\nquackery\n\
  quasar\nquilt\nquotient\nquiz\n\n注意计数器 `i` 只有在输入的单词通过 `q` 时才会增加。\n\n### 进一步的 `strcpy()`\
  \ 属性\n\n`strcpy()` 函数两个你可能觉得有用的属性。首先，它的类型是 `char *`。它返回第一个参数的值——字符的地址。其次，第一个参数不必指向数组的开头；这允许你只拷贝数组的一部分。列表\
  \ 11.26 说明了这几点。\n\n```c\nchar target[20];\nint x;\nx = 50; // 数字赋值\nstrcpy(target,\
  \ \"Hi!\"); // 字符串赋值\ntarget = \"So long\"; // 语法错误\n```\n\n确保目标数组有足够的空间拷贝源是你的责任。以下是在寻找麻烦：\n\
  点击此处查看代码图片\n\n```c\nchar * str;\nstrcpy(str, \"The C of Tranquility\"); // 一个问题\n\
  ```\n\n简单来说，`strcpy()` 取两个指针作为参数。第二个指向原始字符串的指针可以是声明的指针、数组名或字符串常量。第一个指向拷贝的指针应该指向一个数据对象，例如数组。记住，声明数组分配用于数据的存储空间；声明指针只分配存储一个地址的空间。\n\
  \n\n\n\n\n注意 `strcpy()` 会复制源字符串中的空字符。在这个示例中，空字符覆盖了 `copy` 中 `that` 字符串的第一个 `t`，导致新字符串以\
  \ `beast` 结尾（参见图 11.5）。同样请注意，`ps` 指向 `copy` 的第 8 个元素（索引为 7），因为第一个参数是 `copy + 7`。因此，`puts(ps)`\
  \ 打印从该点开始的字符串。\n\n![Image](img/11fig05.jpg)\n\n图 11.5 `strcpy()` 函数使用指针。\n\n###\
  \ 审慎的选择：strncpy()\n\n`strcpy()` 函数与 `strcat()` 存在一个共同的问题——它们都不检查源字符串是否真的能放入目标字符串中。复制字符串更安全的方法是使用\
  \ `strncpy()`。它接受第三个参数，即复制的最大字符数。列表 11.27 是列表 11.25 的重写，使用 `strncpy()` 代替了 `strcpy()`。为了说明当源字符串太大时会发生什么，它为目标字符串使用了相当小的尺寸（七个元素，六个字符）。\n\
  \n列表 11.27 copy3.c 程序\n\n点击此处查看代码图片\n\n```c\n/* copy3.c -- strncpy() demo */\n\n\
  #include <stdio.h>\n#include <string.h>  /* declares strncpy() */\n#define SIZE\
  \ 40\n#define TARGSIZE 7\n#define LIM 5\nchar * s_gets(char * st, int n);\n\nint\
  \ main(void)\n{\n    char qwords[LIM][TARGSIZE];\n    char temp[SIZE];\n    int\
  \ i = 0;\n    printf(\"Enter %d words beginning with q:\\n\", LIM);\n    while (i\
  \ < LIM && s_gets(temp, SIZE))\n    {\n        if (temp[0] != 'q')\n           \
  \ printf(\"%s doesn't begin with q!\\n\", temp);\n        else\n        {\n    \
  \        strncpy(qwords[i], temp, TARGSIZE - 1);\n            qwords[i][TARGSIZE\
  \ - 1] = '\\0';\n            i++;\n        }\n    }\n    puts(\"Here are the words\
  \ accepted:\");\n    for (i = 0; i < LIM; i++)\n        puts(qwords[i]);\n    return\
  \ 0;\n}\n\nchar * s_gets(char * st, int n)\n{\n    char * ret_val;\n    int i =\
  \ 0;\n    ret_val = fgets(st, n, stdin);\n    if (ret_val)\n    {\n        while\
  \ (st[i] != '\\n' && st[i] != '\\0')\n            i++;\n        if (st[i] == '\\\
  n')\n            st[i] = '\\0';\n        else // must have words[i] == '\\0'\n \
  \           while (getchar() != '\\n')\n                continue;\n    }\n    return\
  \ ret_val;\n}\n```\n\n以下是一个示例运行：\n\n点击此处查看代码图片\n\n```\nEnter 5 words beginning with\
  \ q:\nquack\nquadratic\nquisling\nquota\nquagga\nHere are the words accepted:\n\
  quack\nquadra\nquisli\nquota\nagga\n```\n\n函数调用 `strncpy(target, source, n)` 从 `source`\
  \ 复制最多 `n` 个字符或直到空字符（以先者为准）到 `target`。因此，如果 `source` 中的字符数少于 `n`，则复制整个字符串，包括空字符。该函数永远不会复制超过\
  \ `n` 个字符，所以如果 string 源字符串结束之前达到了限制，则不会添加空字符。结果是，最终产品可能没有空字符。由于这个原因，程序将 `n` 设置为比数组小\
  \ 1，然后将数组中的最后一个元素设置为空字符：\n\n```c\nstrncpy(qwords[i], temp, TARGSIZE - 1);\nqwords[i][TARGSIZE\
  \ - 1] = '\\0';\n```\n\n这确保了你存储了一个字符串。如果源字符串实际上能够容纳，随之复制的空字符将标记字符串的真实终点。如果源字符串无法容纳，这个空字符将标记字符串的结束。\n\
  \n### sprintf() 函数\n\n`sprintf()` 函数声明在 `stdio.h` 中而不是 `string.h` 中。它的工作方式与 `printf()`\
  \ 相似，但它是写入字符串而不是写入显示器。因此，它提供了一种将多个元素组合成一个单一字符串的方法。`sprintf()` 的第一个参数是目标字符串的地址。其余参数与\
  \ `printf()` 相同——一个转换字符串，后面跟着要写入的项目列表。\n\n列表 11.28 使用 `sprintf()` 将三个项目（两个字符串和一个数字）组合成单个字符串。注意它使用\
  \ `sprintf()` 的方式与使用 `printf()` 相同，不同之处结果字符串存储在数组 `formal` 中而不是显示在屏幕上。\n\n列表 11.28\
  \ format.c 程序\n\n点击此处查看代码图片\n\n```c\n/* format.c -- format a string */\n#include\
  \ <stdio.h>\n#define MAX 20\nchar * s_gets(char * st, int n);\nint main(void)\n\
  {\n    char first[MAX];\n    char last[MAX];\n    char formal[2 * MAX + 10];\n \
  \   double prize;\n    puts(\"Enter your first name:\");\n    s_gets(first, MAX);\n\
  \    puts(\"Enter your last name:\");\n    s_gets(last, MAX);\n    puts(\"Enter\
  \ your prize money:\");\n    scanf(\"%lf\", &prize);\n    sprintf(formal, \"%s,\
  \ %19s: %.2f\", last, first, prize);\n    puts(formal);\n    return 0;\n}\nchar\
  \ * s_gets(char * st, int n)\n{\n    char * ret_val;\n    int i = 0;\n    ret_val\
  \ = fgets(st, n, stdin);\n    if (ret_val)\n    {\n        while (st[i] != '\\n'\
  \ && st[i] != '\\0')\n            i++;\n        if (st[i] == '\\n')\n          \
  \  st[i] = '\\0';\n        else // must have words[i] == '\\0'\n            while\
  \ (getchar() != '\\n')\n                continue;\n    }\n    return ret_val;\n\
  }\n```\n\n这是一个示例运行：\n\n点击此处查看代码图片\n\n```\nEnter your first name:\nAnnie\nEnter your\
  \ last name:\nvon Wurstasse\nEnter your prize money:\n25000\nvon Wurstasse, Annie\
  \           : $25000.00\n```\n\n`sprintf()` 命令将输入格式化，并将其存储在字符串 `formal` 中。\n\n##\
  \ 其他字符串函数\n\nANSI C 库有 20 多个字符串处理函数，以下列表总结了一些常用的：\n\n- `strcpy(s1, s2)`：将 `s2` 指向的字符串（包括空字符）复制到\
  \ `s1` 指向的位置。\n- `strncpy(s1, s2, n)`：从 `s2` 指向的字符串复制最多 `n` 个字符到 `s1` 指向的位置。如果源短于\
  \ `n`，则复制整个字符串（包括空字符）；如果源有 `n` 或更多字符，则目标用空字符填充。\n- `strcat(s1, s2)`：将 `s2` 指向的字符串附加到\
  \ `s1` 指向的字符串的末尾。\n- `strncat(s1, s2, n)`：将 `s2` 字符串的前 `n` 个字符附加到 `s1` 字符串。\n- `strcmp(s1,\
  \ s2)`：如果 `s1` 随于 `s2` 则返回正值，如果相同则返回 0，如果 `s1` 先于 `s2` 则返回负值。\n- `strncmp(s1, s2,\
  \ n)`：比较两个字符串的前 `n` 个字符。\n\n\n\n\n该函数的作用类似于 `strcmp()`，不同之处在于比较在 `n` 个字符后或遇到第一个空字符时停止，以先到者为准。\n\
  \n![Image](img/squf.jpg)\n```\nchar *strchr(const char * s, int c);\n```\n\n该函数返回指向字符串\
  \ `s` 中第一个包含字符 `c` 的位置的指针。（终止空字符是字符串的一部分，因此可以对其进行搜索。）如果未找到该字符，函数返回空指针。\n\n![Image](img/squf.jpg)\n\
  ```\nchar *strpbrk(const char * s1, const char * s2);\n```\n\n该函数返回指向字符串 `s1` 中第一个包含\
  \ `s2` 字符串中任意字符的位置的指针。如果没有找到任何匹配字符，函数返回空指针。\n\n![Image](img/squf.jpg)\n```\nchar\
  \ *strrchr(const char * s, int c);\n```\n\n该函数返回指向字符串 `s` 中字符 `c` 最后一次出现位置的指针。（终止空字符是字符串的一部分，因此可以对其进行搜索。）如果未找到该字符，函数返回空指针。\n\
  \n![Image](img/squf.jpg)\n```\nchar *strstr(const char * s1, const char * s2);\n\
  ```\n\n该函数返回指向字符串 `s1` 中字符串 `s2` 首次出现位置的指针。如果没有找到该字符串，函数返回空指针。\n\n![Image](img/squf.jpg)\n\
  ```\nsize_t strlen(const char * s);\n```\n\n该函数返回字符串 `s` 中找到的字符个数，不包括终止空字符。\n\n\
  请注意，这些原型声明使用了 `const` 关键字来指示哪些字符串不会被函数修改。例如，考虑以下内容：\n\n点击此处查看代码图像\n\n```\nchar *strcpy(char\
  \ * restrict s1, const char * restrict s2);\n```\n\n这意味着 `s2` 指向的字符串是不可修改的，至少不能被\
  \ `strcpy()` 函数修改，但 `s1` 指向的字符串是可以修改的。这是合乎逻辑的，因为 `s1` 是目标字符串，会被修改，而 `s2` 是源字符串，应该保持不变。\n\
  \n在第 12 章中讨论的 `restrict` 关键字表示了函数参数的使用限制，例如，不要将字符串拷贝到自身。\n\n正如在第 5 章中讨论的那样，`size_t`\
  \ 类型“运算符、表达式和语句”是 `sizeof` 运算符返回的任何类型。C 语言规定 `sizeof` 运算符返回一种整数类型，但没有指定是哪种整数类型，因此\
  \ `size_t` 在一个系统上可能是 `unsigned int`，在另一个系统上可能是 `unsigned long`。`string.h` 文件为特定系统定义\
  \ `size_t`，或者引用另一个具有该定义的头文件。\n\n如前所述，附章节 V 列出了 `string.h` 族中的所有函数。许多实现提供了 ANSI 标准之外的额外函数。你应该检查你所用实现的文档以查看哪些可用函数。\n\
  \n让我们来看其中一个函数的简单用法。早些我们看到 `fgets()` 在读取一行输入时，会将换行符存储在目标字符串中。我们的 `s_gets()` 函数使用\
  \ `while` 循环来检测该换行符，但我们可以改用 `strchr()`。首先，使用 `strchr()` 换行符（如果有）。如果函数找到了换行符，它会返回换行符的地址，你就可以在该地址处放置一个空字符：\n\
  \n点击此处查看代码图像\n\n```\nchar line[80];\nchar * find;\nfgets(line, 80, stdin);\nfind\
  \ = strchr(line, '\\n');   // 寻找换行符\nif (find)                   // 如果地址不是 NULL\n\
  \    *find = '\\0';            // 在那里放置一个空字符\n```\n\n如果 `strchr()` 未找到换行符，说明 `fgets()`\
  \ 在到达行尾之前达到了大小限制。你可以向 `if` 中添加一个 `else`（就像我们在 `s_gets()` 中做的那样）来处理这种情况。\n\n接下来，让我们来看处理字符串的完整程序。\n\
  \n### 字符串示例：字符串排序\n\n让我们解决按字母顺序对字符串进行排序的实际问题。任务任务出现在准备姓名列表、制作索引以及许多其他情况下。此类程序中的主要工具之一是\
  \ `strcmp()`，因为它可以用于确定两个字符串的顺序。通用的计划是读取一个字符串数组，对其进行排序，然后打印出来。早些，我们展示了一种读取字符串的方案，我们将以这种方式启动程序。打印字符串没有问题。我们将使用一种稍后会解释的标准排序算法。我们还会做一件有点棘手的事；看看是否能发现它。列表\
  \ 1.29 展示了该程序。\n\n列表 1.29 `sort_str.c`\n点击此处查看图像\n\n```c\n* sort_str.c -- 读取字符串并排序\n\
  #include <stdio.h>\n#include <string.h>\n#define SIZE 8      // 字符串长度，包含 \\0\n#define\
  \ LIM 20      // 最大行数\n#define STOP \"\"     // 停止字符串\nvoid sort(char *strings[],\
  \ int num); // 排序函数\nchar s_gets(char * st, int n);     // 获取字符串\nint main(void)\n\
  {\n    char input[LIM][SIZE]; // 存储输入的数组\n    char *ptstr[LIM];      // 指针数组\n \
  \   int ct = 0;            // 输入计数\n    int k;                 // 输出计数\n    printf(\"\
  Input to %d lines, and I will sort them.\\n\",LIM);\n    printf(\"To stop, press\
  \ the Enter key at line's start.\\n\");\n    while (ct < LIM && s_gets(input[ct],\
  \ SIZE) != NULL\n          && input[ct][0] != '\\0')\n    {\n        ptstr[ct] =\
  \ input[ct]; // 设置指针指向字符串\n        ct++;\n    }\n    sort(ptstr, ct);         //\
  \ 字符串排序\n    puts(\"\\nHere's the sorted list:\\n\");\n    for (k = 0; k < ct; k++)\n\
  \        puts(ptstr[k]);      // 输出排序后的指针\n    return 0;\n}\n/* 指针排序函数 */\nvoid\
  \ sort(char *strings[], int num)\n{\n    char *temp;\n    int top, seek;\n    for\
  \ (top = 0; top < num-1; top++)\n        for (seek = top + 1; seek < num; seek++)\n\
  \            if (strcmp(strings[top],strings[seek]) > 0)\n            {\n      \
  \          temp = strings[top];\n                strings[top] = strings[seek];\n\
  \                strings[seek] = temp;\n            }\n}\nchar * s_gets(char * st,\
  \ int n)\n{\n    char * ret_val;\n    int i = 0;\n    ret_val = fgets(st, n, stdin);\n\
  \    if (ret_val)\n    {\n        while (st[i] != '\\n' && st[i] != '\\0')\n   \
  \         i++;\n        if (st[i] == '\\n')\n            st[i] = '\\0';\n      \
  \  else // 必须是 st[i] == '\\0'\n            while (getchar() != '\\n')\n        \
  \        continue;\n    }\n    return ret_val;\n}\n```\n\n* * *\n\n我们给列表 11.29 输入了一首冷门的童谣歌进行测试：\n\
  \n点击此处查看图像\n\nInput up to 20 lines, and I will sort them.\nTo stop, press the Enter\
  \ key at line's start.\n\nHere's the sorted list:\nAnd where I would be I can not.\n\
  But where I am I must be,\nO that I was where I would be,\nThen would I be where\
  \ I am not;\n\n嗯，这首童谣歌按字母顺序排序似乎并没有太大影响。\n\n#### 排序指针而不是字符串\n\n\n\n\n\n程序的棘手之处在于，我们并没有重新排列字符串本身，而是重新排列了指向字符串的`pointers`。让我们来看看这意味着什么。最初，`ptrst[0]`\
  \ 被设置为 `input[0]`，依此类推。这意味着指针 `ptrst[i]` 指向数组 `input[i]` 中的第一个字符。每个 `input[i]` 都是一个包含\
  \ 81 个元素的数组，而每个 `ptrst[i]` 都是一个变量。排序过程重新排列 `ptrst`，而保持 `input` 不变。例如，如果 `input[1]`\
  \ 在字母顺序上于 `input[0]`，程序会交换 `ptrsts`，导致 `ptrst[0]` 指向 `input[1]` 的开头，并导致 `ptrst[1]`\
  \ 指向 `input[0]` 的开头。这比使用 `strcpy()` 来交换两个 `input` 字符串的内容简单得多。请参见图 11.6 以该过程的另一种视图。它还具有保持\
  \ `input` 数组原始顺序的优势。\n\n![Image](img/11fig06.jpg)\n\n图 11.6 排序字符串指针。\n\n## 选择排序算法\n\
  \n为了对指针排序，我们使用 `selection sort`（选择排序）算法。其核心思想是使用 `for` 循环将每个元素与第一个元素进行比较。如果比较的元素在当前第一个元素之前，程序就会交换两者。当程序到达循环结束时，第一个元素包含指向机器排序序列中排靠前的字符串的指针。然后，外层\
  \ `for` 循环重复该过程，这次从 `input` 的第二个元素开始。当内层循环完成后，指向第二排序字符串的指针最终位于 `ptrst` 的第二个元素中。该过程一直持续到所有元素都排序完毕。\n\
  \n现在让我们更详细地查看选择排序。这里是伪代码大纲：\n\n点击此处查看代码图像\n\n```\nfor n = first to n = next-to-last\
  \ element,\n    find largest remaining number and place it in the nth element\n\
  ```\n\n该方案的工作原理如下：首先，从 `n = 0` 开始。扫描整个数组，找到最大的数，并将其与第一个元素交换。接下来，设置 `n = 1`，然后扫描数组中第一个元素以外的所有元素。找到剩余中最大的数并将其与第二个元素交换。继续这个过程直到到达倒数第二个元素。现在只剩下两个元素。比较它们，并将较大的放在倒数第二个位置。这使得所有元素中最小的一个位于最后一个位置。\n\
  \n这看起来像是一个 `for` 循环任务，但我们仍然需要更详细地描述“查找并放置”的过程。选择剩余最大值的一种方法是比较剩余数组的第一个和第二个元素。如果第二个更大，则交换这两个值。现在将第一个元素与第三个元素进行比较。如果第三个更大，则交换这两个。每次交换都会将一个较大的元素移动到顶部。继续这种方式，直到你将第一个元素与最后一个元素比较完毕。当你完成后，最大值现在位于剩余数组的第一个元素中。你已经完成了第一个元素的排序，但数组其余部分仍然是乱的。以下是该过程的伪代码：\n\
  \n点击此处查看代码图像\n\n```\nfor n - second element to last element,\n  compare nth element\
  \ with first element; if nth is greater, swap values\n```\n\n这个过程看起来像另一个 `for` 循环。它将嵌套在第一个\
  \ `for` 循环中。外层循环指示要填充哪个数组元素，而内层循环找到放在那里的值。将伪代码的两部分结合并翻译成 C，我们得到了列表 11.29 中的函数。顺便提到，C\
  \ 库包含一个更高级的排序函数 `qsort()`。除其他外，它还使用函数指针来进行排序比较。第 16 章 “C 预处理器和 C 库”提供了其用法的示例。\n\n\
  ## ctype.h 字符函数与字符串\n\n第 7 章 “C 控制语句：分支与跳转”引入了 `ctype.h` 系列与字符相关的函数。这些函数不能应用于整个字符串，但可以应用于字符串中的单个字符。例如，列表\
  \ 11.30 定义了一个函数，对字符串中的每个字符应用 `toupper()` 函数，从而将整个字符串转换为大写。它还定义了一个使用 `ispunct()`\
  \ 统计字符串中标点字符数量的函数。最后，程序如前所述，使用 `strchr()` 来处理 `fgets()` 读取的字符串中可能存在的换行符。\n\n列表 11.30\
  \ mod_str.c 程序\n\n点击此处查看代码图像\n\n***\n\n```c\n/* mod_str.c -- 修改字符串 */\n\n#include\
  \ <stdio.h>\n#include <string.h>\n#include <ctype.h>\n\n#define LIMIT 81\n\nvoid\
  \ ToUpper(char *);\nint PunctCount(const char *);\n\nint main(void)\n{\n    char\
  \ line[LIMIT];\n    char *find;\n\n    puts(\"Please enter a line:\");\n    fgets(line,\
  \ LIMIT, stdin);\n    find = strchr(line, '\\n'); // 寻找换行符\n    if (find) // 如果地址不为\
  \ NULL\n        *find = '\\0'; // 在该处放置空字符\n\n    ToUpper(line);\n    puts(line);\n\
  \    printf(\"That line has %d characters.\\n\", PunctCount(line));\n\n    return\
  \ 0;\n}\n\nvoid ToUpper(char *str)\n{\n    while (*str)\n    {\n        *str = toupper(*str);\n\
  \        str++;\n    }\n}\n\nint PunctCount(const char *str)\n{\n    int ct = 0;\n\
  \    while (*str)\n    {\n        if (ispunct(*str))\n            ct++;\n      \
  \  str++;\n    }\n    return ct;\n}\n```\n\n`while (*str)` 循环处理 `str` 中的每个字符，直到遇到空字符。此时，`*str`\
  \ 的值变为 0（空字符的代码）或为假，循环终止。以下是一个示例运行结果：\n\nPlease enter a line:\nMe? You talkin' to\
  \ me? Get outta here!\nME? TALKIN' TO ME? GET OUTTA HERE!\nThat line has 4 characters.\n\
  \n\n\n\n\nC> fuss\n\n`命令行参数`是同一行中的额外项目。这里有一个示例：\n\n$ fuss -r Ginger\n\nC 程序可以读取这些额外项目供自己使用（参见图\
  \ 11.7）。\n\n![Image](img/11fig07.jpg)\n\n图 11.7 命令行参数。\n\nC 程序通过传递给 `main()` 的参数来读取这些项目。列表\
  \ 11.31 显示了一个典型的示例。\n\n列表 11.31 `repeat.c` 程序\n\n点击此此处查看代码图片\n\n* * *\n\n```c\n\
  /* repeat.c -- main() with arguments */\n\n#include <stdio.h>\n\nint main(int argc,\
  \ char *argv[])\n{\n    int count;\n    printf(\"The command line has %d arguments:\\\
  n\", argc - 1);\n    for (count = 1; count < argc; count++)\n        printf(\"%d:\
  \ %s\\n\", count, argv[count]);\n    printf(\"\\n\");\n    return 0;\n}\n```\n\n\
  * * *\n\n将此程序编译为名为 `repeat` 的可执行文件。当从命令行运行它时，会发生这些：\n\n点击此此处查看代码图片\n\nC>repeat Resistance\
  \ is futile\n\n命令行有 3 个参数：\n\n1: Resistance\n2: is\n3: futile\n\n你可以看到为什么它被称为 `repeat`，但你可能好奇它是如何工作的。我们现在来解释。\n\
  \nC 编译器允许 `main()` 没有参数，或者有两个参数。（某些实现允许允许额外的参数，但那将是标准的扩展。）当有两个参数时，第一个参数是命令行中字符串的数量。按照传统（但并非必须），这个\
  \ `int` 参数被称为 `argc`，代表*参数计数*（argument count）。系统使用空格来告知一个字符串何时结束，另一个何时开始。因此，`repeat`\
  \ 示例有四个字符串（包括命令名），而 `fuss` 示例有三个。程序将命令行字符串存储在内存中，并将每个字符串的地址存储在指针数组中。该数组的地址存储在第二个参数中。按照惯例，这种指向指针的指针被称为\
  \ `argv`，代表*参数值*（argument values）。可行时（某些操作系统不允许），`argv[0]` 被赋值为程序本身的名字。然后 `argv[1]`\
  \ 被赋值为后续字符串，依此类推。对于我们的示例，我们有以下关系：\n\n`argv[0]` 指向 `repeat`（对于大多数系统）\n`argv[1]` 指向\
  \ `Resistance`\n`argv[2]` 指向 `is`\n`argv[3]` 指向 `futile`\n\n列表 11.31 中的程序使用 `for`\
  \ 循环逐个打印字符串。记得 `printf()` 的 `%s` 格式说明期望作为参数提供字符串地址。每个元素——`argv[0]`、`argv[1]` 等——都是这样一个地址。\n\
  \n这种形式与任何具有形式参数的其它函数相同。许多程序员对 `argv` 使用了不同的声明：\n\n点击此此处查看代码图片\n\n```c\nint main(int\
  \ argc, char **argv)\n```\n\n这种 `argv` 的替代声明确实等同于 `char *argv[]`。它表示 `argv` 是一个指向\
  \ `char` 指针的指针。示例的结果是一样的。它有一个包含七个元素的数组。数组的名字指向第一个元素，因此 `argv` 指向 `argv[0]`，而 `argv[0]`\
  \ 是指向 `char` 的指针。因此，即使使用原始定义，`argv` 也是一个指向 `char` 指针的指针。你可以使用任何形式，但我们认为第一种形式更暗示\
  \ `argv` 代表一组字符串。\n\n顺便提到，包括 Unix 和 DOS 在内的许多环境允许使用引号将几个单词合并为一个参数。例如，命令\n\n`repeat\
  \ \"I am hungry\" now`\n\n会将字符串 `\"I am hungry\"` 赋值给 `argv[1]`，将字符串 `\"now\"` 赋值给\
  \ `argv[2]`。\n\n## 集成环境中的命令行参数\n\n集成 Windows 环境（如 Apple 的 Xcode、Microsoft Visual\
  \ C++ 和 Embarcadero C++ Builder）不使用命令行运行程序。然而，某些环境具有项目对话框，允许你为特定项目指定命令行参数。在其他情况下，你可能可以在\
  \ IDE 中编译程序，然后打开 MS-DOS 窗口以命令行模式运行程序。但如果你的系统有运行如 `GCC` 等命令行编译器的选项，就会更简单。\n\n## Macintosh\
  \ 命令行参数\n\n如果你正在使用 Xcode 4.6（或类似版本），可以通过进入 Products 菜单并选择 Scheme、Edit Scheme、Run\
  \ 来提供命令行参数。然后选择 Arguments 选项卡并在 Arguments Pass on Launch 中输入参数。\n\n### 字符串到数字的转换\n\
  \n数字可以存储为字符串。如果你需要将它们转换为整数，可以使用 `atoi()`。`atoi()` 接收字符串并返回整数。例如，`atoi(\"123\")`\
  \ 返回 `123`。然而，`atoi()` 有局限：它无法检测字符串是否有效，且无法处理溢出。为了更健壮的转换，建议使用 `strtol()`。\n\n\n\n\
  \n我们包含了 `stdlib.h` 头文件，因为自 ANSI C 以来，它包含了 `atoi()` 函数的声明。该头文件还包含了 `atof()` 和 `atol()`\
  \ 的声明。`atof()` 函数将字符串转换为 `double` 类型的值，而 `atol()` 函数将字符串转换为 `long` 类型的值。它们的工作原理与\
  \ `atoi()` 类似，因此它们分别对应于 `double` 和 `long` 类型。\n\nANSI C 提供了这些函数的更高级版本：`strtol()`\
  \ 将字符串转换为 `long`，`strtoul()` 将字符串转换为 `unsigned long`，而 `strtod()` 将字符串转换为 `double`。其更高级的之处在于，这些函数可以识别并报告字符串中第一个不属于数字的字符。此外，`strtol()`\
  \ 和 `strtoul()` 允许你指定数字进制。\n\n让我们来看一个涉及 `strtol()` 的示例。它的原型如下：\n\n点击此处查看代码图片\n\n\
  ```\nlong strtol(const char * restrict nptr, char ** restrict endptr, int base);\n\
  ```\n\n在这里，`nptr` 是指向要转换字符串的指针，`endptr` 是一个指针的地址，该指针被设置为输入数字结束字符的地址，而 `base` 是数字所使用的数字进制。列表\
  \ 11.33 中的一个示例使得这一点更加清晰。\n\n### 列表 11.33 strcnvt.c 程序\n\n点击此处查看代码图片\n\n```c\n/*\
  \ strcnvt.c -- try strtol()  */\n\n#include <stdio.h>\n#include <stdlib.h>\n\n#define\
  \ LIM 30\n\nchar * s_gets(char * st, int n);\n\nint main()\n{\n    char number[LIM];\n\
  \    char * end;\n    long value;\n    puts(\"Enter a number (empty line to quit):\"\
  );\n    while(s_gets(number, LIM) && number[0] != '\\0')\n    {\n        value =\
  \ strtol(number, &end, 10);  /* base 10 */\n        printf(\"base 10 input, base\
  \ 10 output: %ld, stopped at %s (%d)\\n\",\n               value, end, *end);\n\
  \        value = strtol(number, &end, 16);  /* base 16 */\n        printf(\"base\
  \ 16 input, base 10 output: %ld, stopped at %s (%d)\\n\",\n               value,\
  \ end, *end);\n        puts(\"Next number:\");\n    }\n    puts(\"Bye!\\n\");\n\
  \    return 0;\n}\n\nchar * s_gets(char * st, int n)\n{\n    char * ret_val;\n \
  \   int i = 0;\n    ret_val = fgets(st, n, stdin);\n    if (ret_val)\n    {\n  \
  \      while (st[i] != '\\n' && st[i] != '\\0')\n            i++;\n        if (st[i]\
  \ == '\\n')\n            st[i] = '\\0';\n        else // must have words[i] == '\\\
  0'\n            while (getchar() != '\\n')\n                continue;\n    }\n \
  \   return ret_val;\n}\n```\n\n这里是一些示例输出：\n\n点击此处查看代码图片\n\n```\nEnter a number (empty\
  \ line to quit):\n10\nbase 10 input, base 10 output: 10, stopped at  (0)\nbase 16\
  \ input, base 10 output: 16, stopped at  (0)\nNext number:\n10\nbase 10 input, base\
  \ 10 output: 10, stopped at atom (97)\nbase 16 input, base 10 output: 26, stopped\
  \ at tom (116)\nNext number:\nBye!\n```\n\n（注：以下文本包含源文件中的一些乱码字符/OCR 错误，已经过清理以保持核心技术含义。）\n\
  \n### 核心概念\n\n许多程序都处理文本数据。程序可能会要求你输入姓名、公司列表、地址、某种蕨类植物的学名，或音乐剧的演员……使用单词与世界交互。字符串是\
  \ C 程序处理字符串的手段。\n\n一个 C 字符串——无论是通过字符数组、指针还是字符串字面量标识——都存储为包含字符代码的字节序列，且该序列以空字符终止。C\
  \ 语言通过提供一组用于对字符串进行操作、搜索和分析的函数库，体现了字符串的用处。特别地，请记住，在比较字符串时应该使用 `strcmp()` 而不是关系运算符，在将字符串赋值给字符数组时应该使用\
  \ `strcpy()` 或 `strncpy()` 而不是赋值运算符。\n\n### 总结\n\n一个 C 字符串是一个以空字符 `'\\0'` 终止的 `char`\
  \ 序列。字符串可以存储在字符数组中。字符串也可以用字符串常量来表示，其中除空字符以外的字符被包含在双引号中。编译器会提供空字符。因此，`\"joy\"` 被存储为字符\
  \ `j`、`o`、`y` 和 `\\0`。通过 `strlen()` 衡量的字符串长度不计算空字符。\n\n字符串常量（也称为字符串字面量）可以初始化字符数组。数组的大小至少比字符串长度大一，以容纳终止的空字符。字符串常量还可以用于初始化\
  \ `char*` 类型的指针。\n\n函数使用指向字符串第一个字符的指针来识别要操作哪个字符串。通常情况下，相应的实际参数是数组名、指针变量或带引号的字符串。在每种情况下，传递的都是第一个字符的地址。通常没有必要传递字符串的长度，因为函数可以使用终止空字符来定位字符串的末尾。\n\
  \n`fgets()` 函数获取行输入，而 `puts()` 和 `fputs()` 函数显示行输出。它们都是 `stdio.h` 函数族的一部分，正如那个现在被唾弃并废弃的\
  \ `gets()` 函数一样。\n\nC 库包含了几个字符串处理函数。在 ANSI C 下，这些函数在 `string.h` 文件中声明。该库还有几个字符处理函数；它们在\
  \ `ctype.h` 文件中声明。\n\n你可以通过为 `main()` 函数提供正确的形式参数来让程序访问命令行参数。第一个参数通常称为 `argc`，是一个\
  \ `int` 类型，并赋值为命令行单词的数量。第二个参数通常称为 `argv`，是一个指向 `char` 指针数组的指针。每个 `char*` 指向命令行参数字符串，`argv[0]`\
  \ 指向命令名，`argv[1]` 指向第一个参数，依此类推。\n\n`atoi()`、`atol()` 和 `atof()` 函数将数字的字符串表示转换为 `int`、`long`\
  \ 和 `double` 类型。`strtol()`、`strtoul()` 和 `strtod()` 函数将数字的字符串表示转换为 `long`、`unsigned\
  \ long` 和 `double` 类型。\n\n### 习题\n\n你可以在 附录 A 中的“习题答案”中找到习题的答案。\n\n**1。** 这个尝试声明字符字符串的语句有什么问题？\n\
