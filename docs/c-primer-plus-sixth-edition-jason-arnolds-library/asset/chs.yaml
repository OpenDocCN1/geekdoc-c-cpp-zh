  \n\n\n\n字符串常量 `\"x\"` 与字符常量 `'x'` 不同。区别区别在于 `'x'` 是一个基本类型（`char`），而 `\"x\"` 是一个派生类型，即\
  \ `char` 数组。另一个区别是 `\"x\"` 实际上由两个字符组成：`'x'` 和 `'\\0'`，即空字符（参见图 4.3）。\n\n![Image](img/04fig03.jpg)\n\
  \n图 4.3 字符 `'x'` 和字符串 `\"x\"。\n\n## strlen() 函数\n\n上一节我们引入了 `sizeof` 运算符，它给出对象以字节为单位的大小。`strlen()`\
  \ 函数则给出字符串的字符长度。因为存储一个字符需要一个字节，你可能认为在应用于字符串时这两者会得到相同的结果，但事实并非如此。在示例中添加几行代码，如列表 4.3\
  \ 所示，并查看原因。\n\n列表 4.3 praise2.c 程序\n\n点击此处查看代码图像\n\n```\n/* praise2.c */\n// 如果你的实现不识别\
  \ %zd 符，\n// 请尝试使用 %u 或 %lu 符\n#include <stdio.h>\n#include <string.h>      /* 提供\
  \ strlen() 原型 */\n#define PRAISE \"You are an extraordinary being.\"\nint main(void)\n\
  {\n    char name[40];\n    printf(\"What's your name? \");\n    scanf(\"%s\", name);\n\
  \    printf(\"Hello, %s. %s\\n\", name, PRAISE);\n    printf(\"Your name of %zd\
  \ letters occupies %zd memory cells.\\n\",\n              strlen(name), sizeof name);\n\
  \    printf(\"The phrase of praise has %zd letters \",\n              strlen(PRAISE));\n\
  \    printf(\"and occupies %zd memory cells.\\n\", sizeof PRAISE);\n    return 0;\n\
  }\n```\n\n如果你使用的是预 ANSI 标准的 C 编译器，可能需要移除以下行行：\n\n`#include <string.h>`\n\n`string.h`\
  \ 文件包含了几个字符串相关函数的原型，包括 `strlen()`。第 11 章 “字符字符串与字符串函数”更详细地讨论了该头文件。（顺便提一下，某些预 ANSI\
  \ Unix 系统使用 `strings.h` 而不是 `string.h` 来包含字符串函数的声明。）\n\n通常来说，C 将 C 函数库分为若干相关的函数族，并为每个族提供一个头文件。例如，`printf()`\
  \ 和 `scanf()` 属于标准输入输出函数族，使用 `stdio.h` 头文件。`strlen()` 函数与其他几个字符串相关函数（如复制字符串和搜索字符串的函数）一起归属于\
  \ `string.h` 头文件提供的族中。\n\n注意列表 4.3 使用了两种方法来处理长的 `printf()` 语句。第一种方法是将一个 `printf()`\
  \ 语句拆分为两行。（你可以在 `printf(` 的参数之间换行，但不能在字符串中间换行——即不能在引号之间。）第二种方法使用两个 `printf()` 语句来打印同一行。换行符（`\\\
  n`）只出现在第二个语句中。运行程序可能会产生以下输出：\n\n点击此处查看代码图像\n\nWhat's your name? Serendipity Chance\n\
  \nHello, Serendipity. You are an extraordinary being.\n\nYour name of 11 letters\
  \ occupies 40 memory cells.\n\nThe phrase of praise has 31 letters and occupies\
  \ 32 memory cells.\n\n看看发生了什么。数组名拥有 40 个内存单元格，这正是 `sizeof` 运算符报告的结果。然而，存储 Serendipity\
  \ 只需要前 11 个单元，这正是 `strlen()` 报告的结果。数组名中的第 12 个单元格包含空字符，它的存在告诉 `strlen()` 何时停止计数。图\
  \ 4.4 用一个较短的字符串阐明了这一概念。\n\n![Image](img/04fig04.jpg)\n\n图 4.4 `strlen()` 函数知道何时停止。\n\
  \n当你处理 `PRAISE` 时，你会发现 `strlen()` 再次给出字符串中精确的字符数（包括空格和标点符号）。`sizeof` 运算符给出的数字大 1，因为它也计算了结束字符串的不可见空字符。程序并没有告诉计算机预留多少内存来存储该短语。它必须自己计算双引号之间的字符数。\n\
  \n如第 3 章 “数据与 C”所述，`sizeof`...\n\n\n\n## 常量与 C 预处理器\n\n有时你需要使用常量。例如，你可以如下给出周长：\n\
  \n点击此处查看代码图像\n\n```\ncircumference = 3.14159 * diameter;\n```\n\n在这里，常量 3.14159\
  \ 代表世界著名的常数（π）。要使用常量，只需像示例那样输入实际值即可。然而，有充分的理由使用*符号常量*。即你可以使用：\n\n```\nfloat taxrate;\n\
  taxrate = 0.015;\n```\n\n这提供了一个符号名称，但 `taxrate` 是一个变量，你的程序可能会意外改变它的值。幸运的是，C 有两个更好的主意。\n\
  \n第一个更好的主意是 C 预处理器。在第 2 章 “介绍 C”中，你看到了预处理器如何使用 `#include` 引入另一个文件的信息。预处理器允许你定义常量。只需在程序文件的顶部添加如下行：\n\
  \n```c\n#define TAXRATE 0.015\n```\n\n当编译程序时，值 `0.015` 会替换所有使用 `TAXRATE` 的地方。这被称为*编译时替换*。在你运行程序之前，所有的替换已经完成（参见图\
  \ 4.5）。这样的定义常量通常被称为*形式常量*。\n\n![Image](img/04fig05.jpg)\n\n图 4.5 你输入的的内容与编译的内容。\n\
  \n\n\n\n注意格式。首先是 `#define`。接下来是常量的符号名称（`TAXRATE`），然后是常量的值（`0.015`。（注意这种结构没有使用 `=`\
  \ 符号。）因此，通用形式如下：\n\n```c\n#define NAME value\n```\n\n你用你选择的符号名称替换 `NAME`，用适当的值替换\
  \ `value`。这里没有使用分号，因为这是由预处理器处理的替换机制，而不是 C 语句。为什么 `TAXRATE` 要大写？在 C 语言的传统中，用大写字母表示常量是一种明智的做法。这样，当你在程序深处遇到它时，会立即知道它是一个常量，而不是变量。将常量大写仅仅是提高程序可读性的另一种技术。即使你不对常量进行大写，你的程序仍然可以运行，但培养大大写的习惯是一个良好的习惯。\n\
  \n其他较不常用的命名约定包括在名称前加上 `c_` 或 `k_` 前缀以表示常量，生成如 `c_level` 或 `k_line` 这样的名称。\n\n你用于符号常量的名称必须遵循与变量名称相同的规则。你可以使用大写字母、小写字母、数字和下划字符。第一个字符不能是数字。列表\
  \ 4.4 显示了一个示例。\n\n#### 列表 4.4 pizza.c 程序\n\n点击此处查看代码图像\n\n```c\n/* pizza.c -- 在披语境中使用定义的常量\
  \ */\n\n#include <stdio.h>\n\n#define PI 3.14159\n\nint main(void)\n{\n    float\
  \ area, circum, radius;\n    printf(\"What is the radius of your pizza?\\n\");\n\
  \    scanf(\"%f\", &radius);\n    area = PI * radius * radius;\n    circum = 2.0\
  \ * PI *radius;\n    printf(\"Your basic pizza parameters are as follows:\\n\");\n\
  \    printf(\"circumference = %1.2f, area = %1.2f\\n\", circum,\n             area);\n\
  \    return 0;\n}\n```\n\n`printf()` 语句中的 `%1.2f` 会导致输出保留两位小数。当然，这个程序可能无法反映你主要的披萨关注，但它确实在披萨程序的世界中占有一席之地。这里是一个运行示例：\n\
  \n点击此处查看代码图像\n\nWhat is the radius of your pizza?\n\n6.0\n\nYour basic pizza parameters\
  \ are as follows:\n\ncircumference = 37.70, area = 113.10\n\n`#define` 语句也可以用于字符和字符串常量。对于前者使用单引号，对于后者使用双引号。以下示例是有效的：\n\
  \n点击此处查看代码图像\n\n```c\n#define BEEP '\\a'\n#define TEE 'T'\n#define ESC '\\033'\n\
  #define OOPS \"Now you have done it!\"\n```\n\n记住，符号名称之后的所有内容都会被替换为它。不要犯这个常见的错误：\n\
  \n```c\n world 以下是错误的 */\n#define TOES = 20\n```\n\n如果你这样做，`TOES` 将替换为 `= 20`，而不仅仅是\
  \ `20`。在这种情况下，像如下的语句：\n\n```c\ndigits = fingers + TOES;\n```\n\n将转换为以下错误的表示：\n\n\
  ```c\ndigits = fingers + = 20;\n```\n\n#### const 修饰符\n\nC90 添加了创建符号常量的第二种方法——使用\
  \ `const` 关键字将变量声明转换为常量的声明：\n\n点击此处查看代码图像\n\n```c\nconst int MONTHS = 12;     //\
  \ MONTHS 是 12 的符号常量\n```\n\n这使得 `MONTHS` 变成一个只读值。也就是说，你可以显示 `MONTHS` 并在计算中使用它，但你不能更改\
  \ `MONTHS` 的值。这种新方法比使用 `#define` 更灵活；它允许你声明类型，并允许更好地控制程序的哪些部分可以使用该常量。第 12 章 “存储类、链接和内存管理”\
  \ 讨论了 `const` 的这种和其他用法。\n\n实际上，C 还有第三种创建符号常量的方法，那就是在 第 14 章 “结构和其他数据形式”中讨论的 `enum`\
  \ 。\n\n#### 工作中的显式常量\n\nC 头文件 `limits.h` 和 `float.h` 分别提供了关于整数类型和浮点类型大小限制的详细信息。每个文件定义了一系列适用于你的实现的显式常量。例如，`limits.h`\
  \ 文件包含类似下面的行：\n\n```c\n#define INT_MAX    +32767\n#define INT_MIN    -32768\n```\n\
  \n`limits.h` 文件包含 `INT_MAX` 和 `INT_MIN`，代表整数类型的最大值最小值。同样，`float.h` 定义了如 `FLT_MAX`\
  \ 和 `FLT_MIN` 等常量，代表浮点类型的最大值最小值。\n\n\n\n`printf()` 和 `scanf()` 函数允许你与程序进行通信。它们被称为`输入/输出函数`，简称为\
  \ `I/O 函数`。它们不是你在 C 语言中可以使用的唯一 I/O 函数，但它们是最通用的。从历史上来看，这些函数与 C 库中的所有其他函数一样，并不是 C\
  \ 语言定义的一部分。C 最初将 I/O 的实现留给了编译器编写者；这使得 I/O 能够更好地匹配特定的机器。出于兼容性考虑，各种实现版本都带了不同版本的 `scanf()`\
  \ 和 `printf()`。然而，在不同的实现实现之间偶尔会出现差异。C90 和 C99 标准描述了这些函数的标准版本，我们将遵循该标准。\n\n尽管 `printf()`\
  \ 是输出函数而 `scanf()` 是输入函数，但两者的工作原理非常相似，每个函数都使用一个控制字符串和参数列表。我们将向你展示它们是如何工作的，首先是 `printf()`，然后是\
  \ `scanf()`。\n\n## `printf()` 函数\n\n当你要求 `printf()` 打印一个变量时，你提供给它的指令取决于变量的类型。例如，我们在打印整数时使用了\
  \ `%d` 记法，在打印字符时使用了 `%c` 记法。这些记法被称为`转换规格`（conversion specifications），因为它们指定了如何将数据转换为可显示的形式。我们将列出\
  \ ANSI C 标准为 `printf()` 提供的转换规格，然后展示如何使用更常用的那些规格。表 4.3 展示了转换说明符以及它们导致的打印输出类型。\n\n\
  ![Image](img/04tab03.jpg)\n\n表 4.3 转换说明符及产生的打印输出\n\n## 使用 `printf()`\n\nListing\
  \ 4.6 包含一个使用了某些转换规格的程序。\n\n列表 4.6 `printout.c` 程序\n\n点击此处查看代码图像\n\n```c\n/* printout.c\
  \ -- uses conversion specifiers */\n\n#include <stdio.h>\n\n#define PI 3.141593\n\
  \nint main(void)\n{\n    int number = 7;\n    float pies = 12.75;\n    int cost\
  \ = 7800;\n    printf(\"The %d contestants ate %f berry pies.\\n\", number,\n  \
  \         pies);\n    printf(\"The value of pi is %f.\\n\", PI);\n    printf(\"\
  Farewell! thou art too dear for my possessing,\\n\");\n    printf(\"%c%d\\n\", '$',\
  \ 2 * cost);\n    return 0;\n}\n```\n\n输出结果自然是：\n\n点击此处查看代码图像\n\nThe 7 contestants\
  \ ate 12.750000 berry pies.\n\nThe value of pi is 3.141593.\n\nFarewell! thou art\
  \ too dear for my possessing,\n\n$15600\n\n这是使用 `printf()` 的格式：\n\n点击此处查看代码图像\n\n\
  ```c\nprintf(Control-string, item1, item2,...);\n```\n\n`Item1`、`item2` 等是要打印的项。它们可以是变量、常量，甚至是可以在打印值之前先求值的表达式。`Control-string`\
  \ 是描述如何打印这些项的字符字符串。如第 3 章 所述，控制字符串应包含每个要打印项的转换说明符。例如，考虑以下语句：\n\n点击此处查看代码图像\n\n```c\n\
  printf(\"The %d contestants ate %f berry pies.\\n\", number,\n     pies);\n```\n\
  \n`Control-string` 是双引号括的短语。这个特定的控制字符串包含了对应 `number` 和 `pies` 的两个转换说明符——即两个要显示的项。图\
  \ 4.6 显示了另一个 `printf()` 语句的示例。\n\n![Image](img/04fig06.jpg)\n\n图 4.6 `printf()`\
  \ 的参数。\n\n这是示例中的另一行：\n\n点击此处查看代码图像\n\n```c\nprintf(\"The value of pi is %f.\\n\"\
  , PI);\n```\n\n这一次，项列表仅有一个成员——符号常量 `PI`。\n\n正如图 4.7 所示，`Control-string` 包含了两种形式的信息：\n\
  \n![Image](img/squf.jpg) 实际打印的字符\n\n![Image](img/squf.jpg) 转换规格\n\n![Image](img/04fig07.jpg)\n\
  \n图 4.7 控制字符串的结构。\n\n> **注意**\n>\n> 不要忘记为 `Control-string` 中的每个项使用转换规格。如果你简单地使用\
  \ `%`，编译器会认为你写错了。\n\n如果你想打印一个字面量 `%` 号，只需使用 `%%`：\n\n点击此处查看代码图像\n\n```c\nprintf(\"\
  Only %%d\\n\", score);\n```\n\n\n\n存在用于打印浮点类型 `double` 和 `long double` 的转换说明符。然而，并没有用于\
  \ `float` 的说明符。原因在于，在 K&R C 中，`float` 值在在表达式中使用或作为参数传递之前会被转换为 `double` 类型；而在 ANSI\
  \ C（或更后的版本）中，通常情况下并不会自动将 `float` 转换为 `double`。但是，为了保护大量假设 `float` 参数会被转换为 `double`\
  \ 的现有程序，`printf()` 的所有 `float` 参数——以及向任何其他未使用显式原型定义的 C 函数的参数——仍会被自动转换为 `double`。因此，无论是在\
  \ K&R C 还是 ANSI C 下，显示类型 `float` 都不需要特殊的转换说明符。\n\n***\n\n![Image](img/04tab05.jpg)\n\
  \n表 4.5 `printf()` 标志\n\n### 使用修饰符和标志的示例\n\n让我们让这些修饰符派上用场，首先查看字段宽度修饰符对打印整数的影响。考虑列表\
  \ 4.7 中的程序。\n\n列表 4.7 `width.c` 程序\n\n点击此处查看代码图像\n\n***\n\n```c\n/* width.c -- field\
  \ widths */\n\n#include <stdio.h>\n\n#define PAGES 959\n\nint main(void)\n{\n  \
  \  printf(\"*%d*\\n\", PAGES);\n    printf(\"*%2d*\\n\", PAGES);\n    printf(\"\
  *%10d*\\n\", PAGES);\n    printf(\"*%-10d*\\n\", PAGES);\n    return 0;\n}\n```\n\
  \n***\n\n列表 4.7 使用四种不同的转换说明四次打印了相同的数值。它使用星号（`*`）向你显示每个字段的起始和结束位置。输出如下：\n\n*959*\n\
  \n*959*\n\n*       959*\n\n*959      *\n\n第一个转换说明符是 `%d`，没有任何修饰符。它产生一个宽度与所打印整数相同的字段。这是默认选项；换说，如果你不提供进一步的指令，就会打印这个结果。第二个转换说明符是\
  \ `%2d`。这应该产生一个宽度为 2 的字段，但因为整数是三位数，所以字段会自动扩展以适应该数字。下一个转换说明符是 `%10d`。它产生一个宽度为 10\
  \ 个空格的字段，确实，星号之间有七个空格和三个数字，数字靠在字段的右端。最后一个说明符是 `%-10d`。它也产生一个宽度为 10 个空格的字段，而 `-`\
  \ 将数字放在左端，正如宣传的那样。一旦你习惯了，这个系统非常易用，并能让你对输出的外观进行良好的控制。尝试修改 `PAGES` 的值，看看不同位数的数字是如何打印的。\n\
  \n现在看一些浮点格式。输入、编译并运行列表 4.8 中的程序。\n\n列表 4.8 `floats.c` 程序\n\n点击此处查看代码图像\n\n***\n\n\
  ```c\n// floats.c -- some floating-point combinations\n\n#include <stdio.h>\n\n\
  int main(void)\n{\n    const double RENT = 3852.99;  // const-style constant\n \
  \   printf(\"*%f*\\n\", RENT);\n    printf(\"*%e*\\n\", RENT);\n    printf(\"*%4.2f*\\\
  n\", RENT);\n    printf(\"*%3.1f*\\n\", RENT);\n    printf(\"*%10.3f*\\n\", RENT);\n\
  \    printf(\"*%10.3E*\\n\", RENT);\n    printf(\"*%+4.2f*\\n\", RENT);\n    printf(\"\
  *%010.2f*\\n\", RENT);\n    return 0;\n}\n```\n\n这一次，程序使用 `const` 关键字来创建一个符号常量。输出是：\n\
  \n*3852.990000*\n\n*3.852990e+03*\n\n*3852.99*\n\n*3853.0*\n\n*  3852.990*\n\n*\
  \ 3.853E+03*\n\n*+3852.99*\n\n*0003852.99*\n\n示例从默认版本 `%f` 开始。在这种情况下，有两个默认值——字段宽度和小数点右侧的位数。第二个默认值是六位，而字段宽度是容纳该数字所需的任何宽度。\n\
  \n接下来是 `%e` 的默认值。它在小数点左侧打印一位，在右侧打印六位。我们得到了很多数字！解决办法是指定小数点右侧的位数，接下来的四个示例就是这样做的。注意第四个和第六个示例如何导致输出四舍五入。此外，第六个示例使用了\
  \ `E` 而不是 `e`。\n\n最后，`+` 标志导致结果带有其代数符号进行打印（在这种情况下是加号），而 `0` 标志产生前导零以将结果填充到整个宽度。注意在说明符\
  \ `%010.2f` 中，第一个 `0` 是前导零。\n\n\n\n\n`conversion`（转换）这个术语可能有些误导性，因为它可能暗示原始值被转换后的值所替换。转换规范实际上是“翻译规范；`%d`\
  \ 的意思是“将给定的值转换为十进制整数文本表示并打印该表示”。\n\n## 不匹配的转换\n\n自然而然，你应当将转换规范与要打印的值类型相匹配。通常情况下，你有多种选择。例如，如果你想打印一个\
  \ `int` 类型的值，可以使用 `%d`、`%x` 或 `%o`。所有这些说明符都假设你正在打印一个 `int` 类型的值；它们仅仅提供了该值的不同表示形式。同样，你可以使用\
  \ `%f`、`%e` 或 `%g` 来表示 `double` 类型的值。\n\n如果转换规范与类型不匹配会怎样？在上一章中你已经看到，不匹配会导致问题。这是一个非常需要记住的点，因此列表\
  \ 4.11 显示了整数族内部的更多一些不匹配的示例。\n\n### 列表 4.11 intconv.c 程序\n\n点击此处查看代码图像\n\n* *\n\n\
  ```c\n/* intconv.c -- 某些不匹配的整数转换 */\n\n#include <stdio.h>\n\n#define PAGES 336\n\
  \n#define WORDS 65618\n\nint main(void)\n{\n    short num = PAGES;\n    short mnum\
  \ = -PAGES;\n    printf(\"num as short and unsigned short:  %hd %hu\\n\", num,\n\
  \           num);\n    printf(\"-num as short and unsigned short: %hd %hu\\n\",\
  \ mnum,\n           mnum);\n    printf(\"num as int and char: %d %c\\n\", num, num);\n\
  \    printf(\"WORDS as int, short, and char: %d %hd %c\\n\",\n           WORDS,\
  \ WORDS, WORDS);\n    return 0;\n}\n```\n\n* *\n\n我们的系统产生了以下结果：\n\n点击此处查看代码图像\n\n\
  num as short and unsigned short:  336 336\n-num as short and unsigned short: -336\
  \ 65200\nnum as int and char: 336 P\nWORDS as int, short, and char: 65618 82 R\n\
  \n查看第一行，你可以发现 `%hd` 和 `%hu` 对变量 `num` 都输出了 `336`；这部分没有问题。在第二行中，`mnum` 的 `%u`（无符号）版本输出为\
  \ `65200`，而不是你预期的 `336`；这是由于有符号 `short int` 值在我们参考系统上的表示方式导致的。首先，它们的大小为 2 字节。其次，系统使用一种名为“补码”（two’s\
  \ complement）的方法来表示有符号整数。在这种方法中，数字 0 到 32767 表示它们本身，而 32768 到 65535 表示负数，其中 65535\
  \ 代表 −1，65534 代表 −2，以此此类推。因此，`−336` 由 `65536 - 336` 即 `65200` 表示。所以，65200 在被解释为有符号\
  \ `int` 时代表 −336，在解释为无符号 `int` 时代表 65200。小心！一个数字可以被解释为两个不同的值。并不是所有系统都使用这种方法来表示负整数。尽管如此，有一个道理：不要期望\
  \ `%u` 转换会简单地去掉数字的符号。\n\n第三行显示了尝试将大于 255 的值转换为字符时发生的情况。在我们系统中，`short int` 是 2 字节，而\
  \ `char` 是 1 字节。当 `printf()` 使用 `%c` 打印 336 时，它只查看存储 336 的 2 字节中的 1 字节。这种截断（参见图\
  \ 4.8）等于将整数除以 256 并保留余数。在这种情况下，余数 80，它是字符 `P` 的 ASCII 值。从技术角度来说，你可以说数字是按“模 256”解释的，这意味着使用数字除以\
  \ 256 时的余数。\n\n![Image](img/04fig08.jpg)\n\n图 4.8 将 336 作为字符读取。\n\n最后，我们尝试打印一个比系统允许的最大\
  \ `short int`（32767）更大的整数（65618）。计算机再次执行了它的取模运算。数字 65618 因为其大小，被存储为一个 4 字节的 `int`。\n\
  \n\n\n\n\n此调用告诉计算机将变量 `n1`、`n2`、`n3` 和 `n4` 的值交给计算机。这是实现这一点的常用方法之一。程序将值放在一个名为 `stack`（栈）的内存区域。当计算机将这些值放入\
  \ `stack` 时，它是根据变量的类型而不是转换格式符来引导的。因此，对于 `n1`，它在 `stack` 上放置了 8 个字节（`float` 被转换为\
  \ `double`）。同样，它为 `n2` 放置了 8 个字节，紧后为 `n3` 和 `n4` 各放置了 4 个字节。然后控制权转移到 `printf()`\
  \ 函数。该函数从栈中读取值，但在读取时，它是根据转换格式符进行读取的。`%ld` 格式符指示 `printf()` 应该读取 4 个字节，因此 `printf()`\
  \ 将栈中的前 4 个字节作为它的第一个值。这只是 `n1` 的前半部分，并被解释为一个 `long` 型整数。下一个 `%ld` 格式符再读取 4 个字节；这只是\
  \ `n1` 的后半部分，并被解释为第二个 `long` 型整数（参见图 4.9）。同样，第三和第四次 `%ld` 实例导致 `n2` 的前半和后半部分被读取并解释为两个额外的\
  \ `long` 整数，尽管我们为 `n3` 和 `n4` 提供了正确的格式符，但 `printf()` 读取的是错误的字节。\n\n![Image](img/04fig09.jpg)\n\
  \n图 4.9 传递参数。\n\n***\n\n### `printf()` 的返回值\n\n如第 2 章 所述，C 函数通常有一个返回值。这个值是函数计算并返回给调用它的程序的值。例如，C\
  \ 库中包含一个 `sqrt()` 函数，它接受一个数字作为参数并返回其平方根。返回值可以赋值给变量，可以在计算中使用，也可以作为参数传递——简而言之，它可以像任何其他值一样被使用。`printf()`\
  \ 函数也有返回值；它返回其打印的字符数。如果发生输出错误，`printf()` 返回一个负值。（某些旧版本的 `printf()` 有不同的返回值。）\n\n\
  `printf()` 的返回值与其打印输出的主要目的是无关的，通常通常不被使用。你可能使用返回值的一个原因是为了检查输出错误。这在写入文件而不是写入屏幕时更为常见。如果由于光光\
  \ CD 或 DVD 导致无法写入，你就可以让程序采取某些适当措施，例如让终端蜂鸣 30 秒。然而，在做这类事情之前，你必须了解 `if` 语句。列表 4.13\
  \ 中的简单示例展示了你如何确定返回值。\n\n列表 4.13 prntval.c 程序\n\n点击此处查看代码图像\n\n***\n\n```c\n/* prntval.c\
  \ -- finding printf()'s return value */\n#include <stdio.h>\n\nint main(void)\n\
  {\n    int bph2o = 212;\n    int rv;\n    rv = printf(\"%d F is water's boiling\
  \ point.\\n\", bph2o);\n    printf(\"The printf() function printed %d characters.\\\
  n\",\n           rv);\n    return 0;\n}\n```\n\n***\n\n输出如下：\n\n点击此处查看代码图像\n\n212\
  \ F is water's boiling point.\n\nThe printf() function printed 32 characters.\n\n\
  首先，程序使用 `rv = printf(...);` 形式将返回值赋值给 `rv`。因此，该语句执行了两个任务：打印信息和给变量赋值。其次，注意计数器包含了所有打印的字符，包括空格和不可见的换行符。\n\
  \n### 打印长字符串\n\n偶尔，`printf()` 语句太长，无法放在一行上。由于 C 会忽略空白字符（空格、制表符、换行符），除非它们用于分隔元素，否则你可以将一个语句跨越几行，只要你在元素之间放置换行符即可。例如，列表\
  \ 4.13 使用了两行表示一个语句。\n\n点击此处查看代码图像\n\n```c\nprintf(\"The printf() function printed\
  \ %d characters.\\n\",\n       rv);\n```\n\n行在逗号元素和 `rv` 之间断开。为了向读者显示该行在延续，示例缩进了\
  \ `rv`。C 忽略了额外的空格。\n\n然而，你不能在引号字符串的中间断开。假设你尝试了如下操作：\n\n点击此处查看代码图像\n\n```c\nprintf(\"\
  The printf() function printed %d\ncharacters.\\n\", rv);\n```\n\nC 会报错说你在字符串中有一个非法字符。如果你必须分割字符串，你有三种选择，如列表\
  \ 4.14 所示。\n\n列表 4.14 longstr.c 程序\n\n点击此处查看代码图像\n\n***\n\n```c\n/* longstr.c –\
  \ printing long strings */\n#include <stdio.h>\n\nint main(void)\n{\n    printf(\"\
  Here's one way to print\"\n           \" long string.\\n\");\n    printf(\"Here's\
  \ another way to\"\n           \" print long string.\\n\");\n    printf(\"Here's\
  \ the newest way to\"\n           \" print long string.\\n\");\n    return 0;\n\
  }\n```\n\n***\n\n输出如下：\n\n点击此处查看代码图像\n\nHere's one way to print long string.\n\n\
  Here's another way to print long string.\n\nHere's the newest way to print long\
  \ string.\n\n方法 1 是使用多个一个 `printf()` 语句。因为第一个字符串没有以 `\\n` 字符结束，所以第二个字符串从第一个字符串结束的地方继续。\n\
  \n方法 2 是用反斜杠/结束第一行的结尾。这导致屏幕上的文本开始新的一行，而字符串中不包含换行符。效果是将字符串延续到下一行。如果你对该行进行缩进（例如空格），这些空格将成为字符串的一部分。\n\
  \n方法 3 是 ANSI C 引入的字符串连接方法。如果你在一个引号字符串常量后面紧跟另一个，且仅由空白字符分隔，C 会将该组合视为单个字符串，因此以下三种形式是等价的：\n\
  \n```c\nprintf(\"Hello, young lovers, wherever you are.\");\nprintf(\"Hello, young\
  \ \" \"lovers\", wherever you are.\");\nprintf(\"Hello, young lovers\" \", wherever\
  \ you are.\");\n```\n\n使用所有这些方法，你应该在字符串中包含任何所需的空格：`\"young\" \"lovers\"` 变成 `\"\
  younglovers\"`，但组合 `\"young \" \"lovers\"` 是 `\"young lovers\"`。\n\n#### 使用 scanf\n\
  \n现在让我们从输出转向输入并检查 `scanf()` 函数。C 库包含几个输入函数，`scanf()`是最通用的，因为它可以读取多种格式。当然，来自键盘的输入是文本，因为按键产生文本字符：字母、数字和标点符号。当你想要输入整数\
  \ 2014 时，你输入的是字符 `2 0 1` 和 `4`。如果你想将其存储为数值而不是字符串，你的程序必须逐个字符将字符串转换为数值值；这正是 `scanf()`\
  \ 所做的！\n\n\n\n\n\n与 `printf()` 类似，`scanf()` 使用一个控制字符串后跟一个参数列表。控制字符串指示了字符输入流的目标数据类型。主要的区别在于参数列表。`printf()`\
  \ 函数使用变量名、常量和表达式；而 `scanf()` 函数使用指向变量的指针。幸运的是，使用该函数不需要了解任何指针的知识。只需记住这些简单的规则即可：\n\
  \n![Image](img/squf.jpg) 如果你使用 `scanf()` 为我们讨论过的基本变量类型之一读取值，请在变量名前前加一个 `&`。\n\n\
  ![Image](img/squf.jpg) 如果你使用 `scanf()` 将字符串读到字符数组中，请不要使用 `&`。\n\nListing 4.15 展示了一个说明这些规则的短程序。\n\
  \nListing 4.15 input.c 程序\n\n点击此处查看代码图像\n\n```c\n// input.c -- 何时使用 &\n\n#include\
  \ <stdio.h>\n\nint main(void)\n{\n    int age;             // 变量\n    float assets;\
  \        // 变量\n    char pet[30];       // string\n    printf(\"Enter your age,\
  \ assets, and favorite pet.\\n\");\n    scanf(\"%d %f\", &age, &assets); // 在这里使用\
  \ &\n    scanf(\"%s\", pet);              // 字符数组不需要 &\n    printf(\"%d $%.2f %s\\\
  n\", age, assets, pet);\n\n    return 0;\n}\n```\n\n这里是一个示例交互：\n\n点击此处查看代码图像\n\n\
  Enter your age, assets, and favorite pet.\n\n38\n92360.88 llama\n\n38 $92360.88\
  \ llama\n\n`scanf()` 函数使用空白字符（换行符、制表符和空格）来决定如何将输入划分为不同的字段。它将连续的转换说明符与连续的字段进行匹配，并跳过之间的空白符。注意这个示例运行是如何将输入分布在两行上的。你完全也可以使用一行或五行，只要在每个条目之间至少有一个换行符、空格或制表符即可：\n\
  \n点击此处查看代码图像\n\nEnter your age, assets, and favorite pet.\n\n  42\n    2121.45\n\
  \    guppy\n\n42 $2121.45 guppy\n\n唯一的例外是 `%c` 符，它读取紧随其字符，即使该字符是空白符。我们稍后会回到这个话题。\n\
  \n`scanf()` 函数使用了与 `printf()` 几乎相同的转换说明符字符。主要的区别在于，`printf()` 对 `float` 类型和 `double`\
  \ 类型都使用 `%f`、`%e`、`%E`、`%g` 和 `%G`，而 `scanf()` 仅用于 `float` 类型，对于 `double` 则需要 `l`\
  \ 修饰符。表 4.6 列出了 C99 标准描述的主要转换说明符。\n\n![Image](img/04tab06.jpg)\n\n表 4.6 `scanf()`\
  \ 的 ANSI C 转换说明符\n\n你也可以在 表 4.6 显示的转换说明符中使用修饰符。修饰符位于百分号和转换字母之间。如果你在一个说明符中使用多个修饰符，它们的出现顺序应与\
  \ 表 4.7 所示相同。\n\n![Image](img/04tab07.jpg)\n\n表 4.7 `scanf()` 的转换修饰符\n\n如你所见，使用转换说明符可能很复杂，而且这些表省略了一些功能。省略的功能主要为了方便从高度格式化的源（如打孔卡或其他数据记录）中读取选定的数据。由于本书主要将\
  \ `scanf()` 作为一种交互式向程序提供数据的方便手段，因此它不会讨论那些更深奥的特性。\n\n### scanf() 的输入视角\n\n让我们更详细查看\
  \ `scanf()` 如何读取输入。假设你使用 `%d` 说明符读取一个整数。`scanf()` 函数开始逐个字符地读取输入。它会跳过空白字符（空格、制表符和换行符），直到找到非空白字符。因为它正尝试读取一个整数，`scanf()`\
  \ 期望找到数字字符，或者是一个符号（`+` 或 `-`）。如果它找到了数字或符号，它会保存该字符然后读取下一个字符。如果下一个是数字，它就保存该数字并读取下一个字符。`scanf()`\
  \ 继续读取并保存字符，直到遇到非数字字符。它随后判定已到达整数的末尾。`scanf()` 将非数字字符放回输入中。这意味着当程序下次读取输入时，它将从之前被拒绝的非数字字符开始。最后，`scanf()`\
  \ 计算与读取的数字（以及可能的符号）相对应的数值，并将该值放入指定的变量中。\n\n如果你使用了字段宽度，`scanf()` 会在字段结束或第一个空白符处停止，以先者为准。\n\
  \n如果第一个非空白字符是，例如 `A` 而不是数字呢？那么 `scanf()` 会直接在那里停止，并将 `A`（或任何字符）放回输入。指定的变量不会被赋值任何值，当程序下次读取输入时，它将再次从\
  \ `A` 开始。如果你的程序中只有 `%d` 说明符，`scanf()` 将永远无法通过那个 `A`。此外，如果你使用带有多个说明符的 `scanf()` 语句，\
  \ C 要求函数在第一次失败时停止读取输入。\n\n使用其他说明符读取输入的工作与 `%d` 情况非常相似。主要区别在于 `scanf()` 可能会识别更多字符作为数字的一部分。例如，`%x`\
  \ 说明符要求 `scanf()` 识别十六进制数字 a–f 和 A–F。浮点数说明符要求 `scanf()` 识别小数点、e 计数法和 p 计数法。\n\n\
  如果你使用 `%s` 说明符，除空白以外的任何字符都是允许的，因此 `scanf()` 会跳过空白到达第一个非空白字符，然后保存非空白字符直到遇到空白符。这意味着\
  \ `%s` 会导致 `scanf()` 读取单个单词——即一个不含空白的字符串。也就是说，你不能使用字段宽度让 `scanf()` 读取超过一个单词。最后一点是：当\
  \ `scanf()` 将字符串放入数组时，它会添加终止符 `'\\0'` 使数组成为 C 字符串。\n\n如果你使用 `%c` 说明符，所有的输入字符都是有效的。如果下一个字符是空格或换行符，则会将空格或换行符赋值；不会跳过空白。\n\
  \n实际上，`scanf()` 并不是 C 中最常用的输入函数。它之所以被介绍是因为它的通用性（它可以读取所有不同类型），但 C 还有其他输入函数，例如 `getchar()`\
  \ 和 `fgets()`，它们更适合特定任务，如读取单个字符或读取字符串。我们将在第 7 章 “C 控制语句：分支与跳转”；[第 11 章 “字符字符串与字符串函数”；以及[第\
  \ 13 章 “[文件输入/输出”中介绍其中一些函数。在此期间，如果你需要整数、小数、字符或字符串，可以使用 `scanf()`。\n\n### 格式字符串中的普通字符\n\
  \n`scanf()` 函数确实允许你在格式字符串中放置普通字符。除了空格字符以外的普通字符必须与输入字符串精确匹配。例如，假设你不小心在两个说明符之间放置逗号：\n\
  \n```c\nscanf(\"%d,%d\", &n, &m);\n```\n\n`scanf()` 函数将其解释为你将输入一个数字、一个逗号，然后输入第二个数字。也就是说，你必须如下所示输入两个整数：\n\
  \n88,121\n\n\n\n\n\n由于格式字符串中的逗号紧跟在 `%d` 之后，你必须在输入 `88` 之后立即输入逗号。然而，由于 `scanf()`\
  \ 会跳过整数之前的空白字符，在输入数据时，你可以在逗号后输入空格或换行符。也就是说，\n\n```\n88, 121\n```\n\n和\n\n```\n88,\n\
  \n121\n```\n\n都是可以接受的。\n\n格式字符串中的空格意味着跳过下一个输入项之前的任何空白字符。例如，语句\n\n```\nscanf(\"%d\
  \ ,%d\", &n, &m);\n```\n\n可以接受以下任何一种输入行：\n\n```\n88,121\n88  ,121\n88 ,  121\n```\n\
  \n请请注意，“任何空白字符”的概念包含了“无空白字符”的特殊情况。\n\n除 `%c` 之外，所有说明符都会自动跳过输入值之前的空白字符，因此 `scanf(\"\
  %d%d\", &n, &m)` 的行为与 `scanf(\"%d %d\", &n, &m)` 相同。对于 `%c`，在格式字符串中添加空格字符会产生影响。例如，如果\
  \ `%c` 在格式字符串中前面有一个空格，`scanf()` 就会跳到第一个非空白字符。也就是说，命令 `scanf(\"%c\", &ch)` 读取输入中遇到的第一个字符，而\
  \ `scanf(\" %c\", &ch)` 读取输入中遇到的第一个非空白字符。\n\n### `scanf()` 的返回值\n\n`scanf()` 函数返回它成功读取的项数。如果它没有读取到任何项（当在期望数字时输入了非数字字符串就会发生这种情况），`scanf()`\
  \ 返回值 `0`。当它检测到被称为“文件结束”（end of file）的条件时，它返回 `EOF`（`EOF` 是 `stdio.h` 文件中定义的特殊值。通常，#define`\
  \ 指令将 `EOF` 赋值为 `-1`）。我们将在第 6 章“C 控制语句：循环](#ch06.html_ch06)”中讨论文件结束，并在书的后续部分利用 `scanf()`\
  \ 的返回值。在你学习了 `if` 语句和 `while` 语句之后，你可以使用 `scanf()` 的返回值来检测和处理不匹配的输入。\n\n### `printf()`\
  \ 和 `scanf()` 中的 `*` 修饰符\n\n`printf()` 和 `scanf()` 都可以使用 `*` 修饰符来修改说明符含义，但它们的操作方式不同。首先，让我们看看\
  \ `*` 修饰符能为 `printf()` 做什么。\n\n假设你不想预先确定字段宽度，而是想让程序来指定它。你可以通过在字段宽度处使用 `*` 代替数字来实现这一点，但你必须添加一个参数来告诉字段宽度应该是多少。也就是说，如果你有转换说明符\
  \ `%*d`，参数列表应该包含一个用于 `*` 的值和一个用于 `d` 的值。该技术也可以用于浮点值，以指定精度和字段宽度。列表 4.16 是一个显示其工作原理的简短示例。\n\
  \n列表 4.16 `varwid.c` 程序\n\n```\n/* varwid.c -- 使用变量宽度的输出字段 */\n\n#include <stdio.h>\n\
  \nint main(void)\n{\n    unsigned width, precision;\n    int number = 256;\n   \
  \ double weight = 242.5;\n\n    printf(\"Enter a field width:\\n\");\n    scanf(\"\
  %d\", &width);\n    printf(\"The number is :%*d:\\n\", width, number);\n    printf(\"\
  Now enter a width and a precision:\\n\");\n    scanf(\"%d %d\", &width, &precision);\n\
  \    printf(\"Weight = %*.*f\\n\", width, precision, weight);\n    printf(\"Done!\\\
  n\");\n\n    return 0;\n}\n```\n\n变量 `width` 提供了 `field width`字段宽度），而 `number` 是要打印的数字。由于说明符中\
  \ `*` 在 `d` 之前，因此在 `printf()` 的参数列表中 `width` 位于 `number` 之前。同样，`width` 和 `precision`\
  \ 为打印 `weight` 提供了格式信息。这是一个示例运行：\n\n```\nEnter a field width:\n6\nThe number is\
  \ :   256:\nNow enter a width and a precision:\n8 3\nWeight =  242.500\nDone!\n\
  ```\n\n在这里，对问题的回答是 `6`，因此使用的字段宽度是 `6`。同样，第二个回答产生了 `8` 的宽度，并且小数点后有 `3` 位数字。更通地说，程序可以在查看\
  \ `weight` 的值后决定这些变量的值。\n\n`*` 在 `scanf()` 中起着完全不同的作用。当它被放在 `%` 和说明符字母之间时，它会导致该函数跳过输入。列表\
  \ 4.17 提供了一个示例。\n\n列表 4.17 `skip.c` 程序\n\n```\n/* skip.c -- 跳过输入 */\n\n#include\
  \ <stdio.h>\n\nint main(void)\n{\n    int n;\n\n    printf(\"Enter three integers:\"\
  );\n    scanf(\"%d %* %d\", &n);\n    printf(\"The last integer is %d\\n\", n);\n\
  \n    return 0;\n}\n```\n\n列表 4.17 中的 `scanf()` 表示“跳过两个整数”。这是一个示例运行：\n\n```\nEnter\
  \ three integers:88,121 344\nThe last integer is 344\n```\n\n#### `printf()` 的用法\n\
  \n当你想要按列打印数据时，指定固定宽度是非常用的。因为默认字段宽度是数字本身的宽度，如果数字大小不一，输出就会参不齐。例如，使用固定宽度可以让输出如下：\n\n\
  ```\nNumber  256\nWeight  242.50\n```\n\n另一方面，如果要把数字嵌入短语中，指定一个比预期数字更小的字段通常很方便。这可以使数字不产生多余的空格。例如，\n\
  \n```c\nprintf(\"Count Beppo ran %f miles in 3 hours.\\n\", distance);\n```\n\n\
  可能会产生\n\n```\nCount Beppo ran 10.22 miles in 3 hours.\n```\n\n转换规范改为 `%10.2f` 你将得到：\n\
  \n```\nCount Beppo ran   10.22 miles in 3 hours.\n```\n\n#### 区域设置\n\n美国和世界上许多其他地区使用点来分隔小数的整数部分和小数，例如\
  \ `3.14159`。但世界上许多其他地区使用逗号，例如 `3,14159`。你可能已经注意到 `printf()` 和 `scanf()` 的说明符似乎没有提供逗号格式。但\
  \ C 并没有忽略世界其他地区。正如附录 B 第 V 节](#app02.html_app02lev1sec5)“带有 C99 扩展的 ANSI C 库”所述，C\
  \ 支持*区域设置*locale）的概念。这让 C 程序可以选择一个特定的区域设置。例如，它可以指定一个荷兰区域设置，此时 `printf()` 和 `scanf()`\
  \ 在显示和读取浮点值时将使用本地习惯（在这种情况下为逗号）。此外，一旦指定了该环境，你在代码中出现的数字也将使用逗号习惯：\n\n```c\ndouble pi\
  \ = 3,14159; // 荷兰区域设置\n```\n\n\n\n\nC 语言标准要求两个区域（locales）：`\"C\"` 和 `\"\"`。默认情况下，程序使用\
  \ `\"C\"` 区域，它基本上是美国的使用习惯。`\"\"` 区域代表你系统正在使用的本地区域。在原则上，它可能与 `\"C\"` 区域相同。在实践中，`Unix`、`Linux`\
  \ 和 `Windows` 等操作系统提供了大量的区域选择。然而，它们提供的列表可能并不相同。\n\n## 核心概念\n\nC 语言的 `char` 类型表示单个字符。为了表示字符序列，C\
  \ 语言使用了字符字符串（character string）。字符串的一种形式是字符常量，其中字符被包含在双引号中；例如`\"Good luck, my friend\"\
  ` 就是一个例子。你可以将字符串存储在字符数组中，数组由内存中相邻的字节组成。字符字符串，无论是以字符常量形式表示还是存储在字符数组中，都由一个名为`null`（空字符）的隐藏字符结束。\n\
  \n在程序中使用符号化的方式来表示数值常量是一个好习惯，可以使用 `#define` 或 `const` 关键字来实现。符号常量使程序更具可读性，并且更容易维护和修改。\n\
  \n标准的 C 输入输出函数 `scanf()` 和 `printf()` 使用了一种系统，即你必须匹配第一个参数中的类型说明符（type specifiers）与后续参数中的值。例如，将\
  \ `%d` 这样的 `int` 说明符匹配到 `float` 值会产生奇怪的结果。你必须小心确保说明符的数量和类型与函数的其余参数相匹配。对于 `scanf()`，记住在变量名前前加上地址操作符（`&`）。\n\
  \n空白字符（制表符、空格和换行符）在 `scanf()` 如何看待输入方面起着至关重要的作用。除了在 `%c` 模式下（只读取下一个字符）外，`scanf()`\
  \ 在读取输入时会跳过空白字符，直到读到第一个非空白字符。然后它会继续读取字符，直到遇到空白字符或遇到不符合所读取类型的字符为止。让我们考虑如果将相同的输入行交给几个不同的\
  \ `scanf()` 输入模式会发生什么。从以下输入行开始：\n\n```\n-13.45e12#  0\n```\n\n首先，假设我们使用 `%d` 模式；`scanf()`\
  \ 将读取三个字符（`−13`）并在句号处停止，将句号留下作为下一个输入字符。随后，`scanf()`会将字符序列 `−13` 转换为相应的整数值，并将该值存储在目标\
  \ `int` 变量中。接下来在 `%f` 模式下读取同一行，`scanf()` 将读取 `−13.45E12` 字符并在 `#` 符号处停止，将其留下作为下一个输入字符。它会将字符序列\
  \ `−13.45E12` 转换为相应的浮点值，并将该值存储在目标 `float` 变量中。在 `%s` 模式下读取同一行，`scanf()` 将读取 `−13.45E12#`，在空格处停止，将其留下作为下一个输入字符。然后它会将这\
  \ 10 个字符的字符编码存储到目标字符数组中，并在末尾附加一个空字符。最后，使用 `%c` 说明符读取同一行，`scanf()` 将读取并存储第一个字符，在本例中是一个空格。\n\
  \n## 总结\n\n字符串被视为一个单元的字符序列。在 C 语言中，字符串由由空字符结束的字符序列表示，空字符是 ASCII 码为 0 的字符。字符串可以存储在字符数组中。数组是一系列类型相同的项目（或元素）。要声明一个名为\
  \ `name` 且具有 30 个 `char` 类型元素的数组，请执行以下操作：\n\n```\nchar name[30];\n```\n\n确保分配足够的元素来容纳整个字符串，包括空字符。\n\
  \n字符串常量通过将字符串包含在双引号中表示：`\"This is an example of a string\"`。\n\n`strlen()` 函数（声明在\
  \ `string.h` 头文件中）可以用于找到字符串的长度（不包括结束的空字符）。`scanf()` 函数配合 `%s` 说明符使用时，可以用于读取单单词字符串。\n\
  \nC 预处理器会在源代码程序中搜索预处理器指令，这些指令以 `#` 符号开头，并在程序编译之前对它们进行处理。`#include` 指令导致处理器在指令所在的位置将另一个文件的内容添加到你的文件中。`#define`\
  \ 指令允许你建立显式常量（manifest constants）——即常量的符号表示。`limits.h` 和 `float.h` 头文件使用 `#define`\
  \ 定义了一组表示整数和浮点类型各种属性的常量。你也可以使用 `const` 修饰符来创建符号常量。\n\n`printf()` 和 `scanf()` 函数为输入输出提供了多功能支持。每个函数都使用包含嵌入转换说明符的控制字符串来指示要读取或打印的数据项的数量和类型。此外，你可以使用转换说明符来控制输出的外观：字段宽度、小数以及在字段内的位置。\n\
