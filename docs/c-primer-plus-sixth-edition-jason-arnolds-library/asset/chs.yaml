  因此 `S/2 = 1`，这意味着 `S = 2`。\n\n\n\n\n在这里，用户回答“否”之后，某些巧妙的操作仍然执行了，因为测试得太晚了。\n\n***\n\
  \n# 总结：do while 语句\n\n**关键字：**\n\n`do while`\n\n**注释：**\n\n`do while` 语句创建一个循环，该循环一直重复直到测试表达式变为假或零。`do\
  \ while` 是一种退出条件循环——在循环执行完一次后，才会决定是否再进行一次循环。因此，循环必须至少执行一次。该形式的语句部分可以是简单语句也可以可以是复合语句。\n\
  \n**格式：**\n\n```c\ndo\n    statement\nwhile (expression);\n```\n\n语句部分会重复执行，直到 `expression`\
  \ 变为假或零。\n\n**示例：**\n\n```c\ndo\n    scanf(\"%d\", &number);\nwhile (number != 20);\n\
  ```\n\n***\n\n## 使用哪种循环？\n\n当你决定需要一个循环时，应该使用哪一个呢？首先，决定你需要的是入口条件循环还是退出条件循环。通常情况下答案应该是入口条件循环。计算机科学家认为入口条件循环更优越，有几个原因。其一是一个通用原则：先看后跳（或先看后循环）比先跳了后看要好。其二是，如果循环测试位于循环开头，程序会更易读。最后，在许多用例下，如果初始不满足测试条件，完全跳过循环是非常重要的。\n\
  \n假设你需要一个入口条件循环。它应该是 `for` 还是 `while`？这在很大程度上取决于个人喜好，因为用一个能做的事，用另一个也能做到。要让 `for`\
  \ 循环像 `while` 循环，你可以省略第一个和第三个表达式。例如：\n\n```c\nfor ( ;test; )\n```\n\n等同于\n\n```c\n\
  while (test)\n```\n\n要让 `while` 像 `for`，可以在它前面加上一个初始化，并包含更新语句。例如：\n\n```c\ninitialize;\n\
  while (test)\n{\n  body;\n  update;\n}\n```\n\n等同于\n\n```c\nfor (initialize; test;\
  \ update)\n    body;\n```\n\n从流行风格来看，当循环涉及变量的初始化和更新时，`for` 循环是合适的；而在其他情况下，`while`\
  \ 循环更好。对于以下条件，`while` 循环是自然的：\n\n```c\nwhile (scanf(\"%ld\", &num) == 1)\n```\n\n\
  对于涉及索引计数的循环，`for` 循环是一个更自然的选择：\n\n```c\nfor (count = 1; count <= 100; count++)\n\
  ```\n\n## 嵌套循环\n\n*嵌套循环*是指在另一个循环内部的循环。嵌套循环的一个常见用途按行和列显示数据。一个循环可以处理（例如）行中的所有列，而第二个循环处理行。列表\
  \ 6.17 显示了一个简单的示例。\n\n列表 6.17 rows1.c 程序\n\n```c\n/* rows1.c -- uses nested loops\
  \ */\n#include <stdio.h>\n\n#define ROWS  6\n#define CHARS 10\n\nint main(void)\n\
  {\n    int row;\n    char ch;\n    for (row = 0; row < ROWS; row++)            /*\
  \ line 10 */\n    {\n        for (ch = 'A'; ch < ('A' + CHARS); ch++)  /* line 12\
  \ */\n            printf(\"%c\", ch);\n        printf(\"\\n\");\n    }\n    return\
  \ 0;\n}\n```\n\n运行程序产生此输出：\n\n```\nABCDEFGHIJ\nABCDEFGHIJ\nABCDEFGHIJ\nABCDEFGHIJ\n\
  ABCDEFGHIJ\nABCDEFGHIJ\n```\n\n## 程序讨论\n\n从第 10 行开始的 `for` 循环被称为*外层*循环，从第 12 行开始的循环被称为*内层*循环，因为它位于另一个循环内部。外层循环从\
  \ `row` 值为 `0` 开始，当 `row` 到 `6` 时终止。因此，外层循环运行六个周期，`row` 的值为 `0` 到 `5`。每个周期中的第一个语句是内层\
  \ `for` 循环。该循环运行 10 个周期，在同一行内打印字符 `A` 到 `J`。外层循环的第二个语句是 `printf(\"\\n\");`。该语句开始一个新行，以便下次运行内层循环时，输出在新的一行。\n\
  \n### 嵌套变体\n\n在前面的示例中，内层循环对外层循环的每一次执行都做了相同的操作。（注：原文此处存在重复乱码，已略过）\n\n\n\n\n例如，之前我们讨论了字符串，它是\
  \ `char` 数组中可以存储内容的一种特殊情况。（一般来说，`char` 数组是其元素被赋值为 `char` 值的数组。）如果 `char` 数组包含空字符\
  \ `\\0`，则其内容就形成了一个字符串，该字符标记字符串的结束（参见图 6.6）。\n\n![Image](img/06fig06.jpg)\n\n图 6.6\
  \ 字符数组与字符串。\n\n用于标识数组元素的数字被称为 `subscripts`（下标）、`indices`（索引）或 `offsets`（偏移量）。下标必须是整数，而且如前所述，下标从\
  \ `0` 开始。数组元素在内存中相邻存储，如图图 6.7 所示。\n\n![Image](img/06fig07.jpg)\n\n图 6.7 内存中的 `char`\
  \ 和 `int` 数组。\n\n### 在数组中使用 for 循环\n\n数组有非常多的用途。列表 6.19 是一个相对简单的用法。这是一个读取 10 个高尔夫数的程序，稍后将对其处理。通过使用数组，你避免了为每个分数发明\
  \ 10 个不同的变量名。此外，你可以使用 `for` 循环来完成读取。程序随后会报告分数的总和、平均分以及杆差（杆差是平均分与标准分——即 par——之间的差）。\n\
  \n列表 6.19 `scores_in.c` 程序\n\n点击此处查看代码图像\n\n```\n// scores_in.c -- uses loops for\
  \ array processing\n\n#include <stdio.h>\n\n#define SIZE 10\n\n#define PAR 72\n\n\
  int main(void)\n{\n    int index, score[SIZE];\n    int sum = 0;\n    float average;\n\
  \n    printf(\"Enter %d golf scores:\\n\", SIZE);\n    for (index = 0; index < SIZE;\
  \ index++)\n        scanf(\"%d\", &score[index]);  // read in the ten scores\n\n\
  \    printf(\"The scores read in are as follows:\\n\");\n    for (index = 0; index\
  \ < SIZE; index++)\n        printf(\"%5d\", score[index]); // verify input\n\n \
  \   printf(\"\\n\");\n    for (index = 0; index < SIZE; index++)\n        sum +=\
  \ score[index];           // add them up\n\n    average = (float) sum / SIZE;  \
  \   // time-honored method\n    printf(\"Sum of scores = %d, average = %.2f\\n\"\
  , sum, average);\n    printf(\"That's a handicap of %.0f.\\n\", average - PAR);\n\
  \n    return 0;\n}\n```\n\n让我们看看列表 6.19 是否运行；然后我们可以做几点评论。以下是输出：\n\n点击此处查看代码图像\n\n\
  Enter 10 golf scores:\n99 95 109 105 100\n96 98 93 99 97 98\n\nThe scores read in\
  \ are as follows:\n    99  95  109  105  100  96  98  93  99  97\nSum of scores\
  \ = 991, average = 99.10\nThat's a handicap of 27.\n\n它运行正常，所以让我们检查一些细节。首先，注意尽管示例显示输入了\
  \ 11 个数字，但只读取了 10 个，因为读取循环只读取了 10 个值。由于 `scanf()` 会跳过空白字符，你可以将 10 个数字写在同一行，每个数字单独占一行，或者像本例一样混合使用换行符和空格来分隔输入。（由于输入是有缓冲的，只有当你按下\
  \ Enter 键时，数字才会发送到程序。）\n\n接下来，使用数组和循环比使用 10 个独立的 `scanf()` 语句和 10 个独立的 `printf()`\
  \ 语句来读取和验证 10 个分数要方便得多。`for` 循环提供了一种简单且直接使用数组下标的方法。注意，`int` 数组元素的处理方式与 `int` 变量一样。要读取\
  \ `int` 变量 `fue`，你会使用 `scanf(\"%d\", &fue)`。列表 6.19 正在读取 `int` 元素 `score[index]`，因此它使用\
  \ `scanf(\"%d\", &score[index])`。\n\n这个示例说明了几个风格要点。首先，使用 `#define` 指令创建一个编译常量（`SIZE`）来指定数组的大小是一个好主意。定义数组和设置循环限制可以使用这个常量。如果你以后需要扩展程序来处理\
  \ 20 个分数，只需将 `SIZE` 重新定义为 20 即可。你不需要更改程序中使用数组大小每一个部分。其次，这种写法\n\n```\nfor (index\
  \ = 0; index < SIZE; index++)\n```\n是处理大小为 `SIZE` 的数组的一种方便方法。获取正确的数组边界至关重要。\n\n\n\
  \n\n要声明函数类型，请在函数名之前加上类型，就像你在声明变量时做的那样。关键字 `return`会导致函数向调用函数返回以下值。在这里，函数返回一个变量的值，但它也可以返回表达式的值。例如，以下语句是有效的：\n\
  \n```c\nreturn 2 * x + b;\n```\n\n该函数将计算表达式的值并将其返回。在调用函数中，返回值可以赋值给另一个变量，可以作为表达式中的值使用，可以作为另一个函数的参数——例如\
  \ `printf(\"%f\", power(6.28, 3))`——或者可以被忽略。\n\n现在让我们在程序中使用该函数。为了测试该函数，方便的方法是能够向函数提供几个值以观察它的反应。这表明我们需要设置一个输入循环。自然的选择是\
  \ `while` 循环。你可以使用 `scanf()` 一时读取两个值。如果成功读取了两个值，`scanf()` 会返回值 `2`，因此你可以通过比较 `scanf()`\
  \ 的返回值与 `2` 来控制循环。另一点：要在程序中使用 `power()` 函数，你需要对其进行声明，就像你声明程序使用的变量一样。列表 6.20 显示了该程序。\n\
  \n列表 6.20 power.c 程序\n\n```c\n// power.c -- 计算数字的整数幂\n\n#include <stdio.h>\n\ndouble\
  \ power(double n, int p); // ANSI 原型型\n\nint main(void)\n{\n    double x, xpow;\n\
  \    int exp;\n    printf(\"Enter a number and the positive integer power\");\n\
  \    printf(\" to which\\nthe number will be raised. Enter q\");\n    printf(\"\
  \ to quit.\\n\");\n    while (scanf(\"%lf%d\", &x, &exp) == 2)\n    {\n        xpow\
  \ = power(x,exp);   // 函数调用\n        printf(\"%.3g to the power %d is %.5g\\n\"\
  , x, exp, xpow);\n        printf(\"Enter next pair of numbers or q to quit.\\n\"\
  );\n    }\n    printf(\"Hope you enjoyed this power trip -- bye!\\n\");\n    return\
  \ 0;\n}\n\ndouble power(double n, int p)  // 函数定义\n{\n    double pow = 1;\n    int\
  \ i;\n    for (i = 1; i <= p; i++)\n        pow *= n;\n    return pow;         \
  \      // 返回 pow 的值\n}\n```\n\n以下是示例运行：\n\n```\nEnter a number and the positive\
  \ integer power to which\nthe number will be raised. Enter q to quit.\n1.2 12\n\
  1.2 to the power 12 is 8.9161\nEnter next pair of numbers or q to quit.\n2\n16\n\
  2 to the power 16 is 65536\nEnter next pair of numbers or q to quit.\nq\nHope you\
  \ enjoyed this power trip -- bye!\n```\n\n## 程序讨论\n\n`main()` 程序是一个驱动程序（driver）的示例，这是一种用于测试函数的短程序。\n\
  \n`while` 循环是是我们之前使用过的形式的泛化。输入 `1.2 12` 会导致 `scanf()` 成功读取两个值并返回 `2`，循环继续。由于 `scanf()`\
  \ 会跳过空白字符，输入可以分布在多行（如示例输出所示），但输入 `q` 会产生返回值 `0`，因为无法使用 `%lf` 格式读取 `q`。这导致 `scanf()`\
  \ 返回 `0`，从而终止循环。同样，输入 `2.8 q` 会产生 `scanf()` 返回值 `1`；那同样也会终止循环。\n\n现在让我们来看与函数有关的问题。`power()`\
  \ 函数在该程序出现了三次。第一次出现是这里：\n\n```c\ndouble power(double n, int p); // ANSI 原型型\n```\n\
  \n该语句宣布（或声明）了程序将使用一个名为 `power()` 的函数。初始关键字 `double` 表明 `power()` 函数返回一个 `double`\
  \ 类型的值。编译器需要知道 `power()` 返回什么类型的值，以便它知道期望多少字节的数据以及如何解释它们；这就是为什么你必须声明该函数。括号内的 `double\
  \ n, int p` 意味着 `power()` 接受两个参数。第一个应该是 `double` 类型的值，第二个应该是 `int` 类型。\n\n第二次出现是这里：\n\
  \n```c\nxpow = power(x,exp);      // 函数调用\n```\n\n在这里程序调用了函数并向其传递了两个值。函数计算 `x` 的\
  \ `exp` 次幂，并将结果返回给调用程序，返回值被赋值给变量 `xpow`。\n\n第三次出现是在函数定义的头部：\n\n```c\ndouble power(double\
  \ n, int p)  // 函数定义\n```\n\n在这里 `power()` 接受两个参数，一个 `double` 和一个 `int`，由变量 `n`\
  \ 和 `p` 表示。注意，当 `power()` 出现在函数定义中，它后面没有分号。\n\n\n\n\n数组由所有相同类型的相邻内存位置组成。你需要记住，数组元素的编号从\
  \ 0 开始，因此最后一个元素的下标总是比元素个数少 1。C 语言不会检查你所使用的下标值是否有效，因此这个责任由你承担。\n\n使用函数涉及三个独立的步骤：\n\
  \n1.  使用函数原型声明函数。\n2.  在程序内部通过函数调用来使用该函数。\n3.  定义函数。\n\n函数原型允许编译器检查你是否正确使用了该函数，而定义则规定了函数的工作方式。原型和定义是现代编程实践的示例，即将程序元素分离为接口和实现。接口描述了如何使用某项功能，这正是原型的作用；而实现则规定了所采取的具体操作，这正是定义的作用。\n\
  \n## 总结\n\n本章的主题是程序控制。C 语言为你提供了许多结构化程序的辅助。`while` 和 `for` 语句提供了入口条件循环。`for` 语句特别适用于涉及初始化和更新的循环。逗号运算符允许你在\
  \ `for` 循环中初始化和更新多个变量。对于不常见的需要退出条件循环的情况，C 语言提供了 `do while` 语句。\n\n一个典型的 `while`\
  \ 循环设计如下：\n\n```\nget first value\nwhile (value meets test)\n{\n    process the\
  \ value\n    get next value\n}\n```\n\n执行相同操作的 `for` 循环如下：\n\n点击此处查看代码图像\n\n```\n\
  for (get first value; value meets test; get next value)\n    process the value\n\
  ```\n\n所有这些循环都使用测试条件来确定是否执行另一个循环周期。通常情况下，如果测试表达式的值为非零值，循环将继续；否则，循环终止。通常，测试条件是一个关系表达式，即使用关系运算符构造的表达式。如果关系为真，该表达式的值为\
  \ `1`，否则值为 `0`。C99 引入的 `_Bool` 类型变量只能包含值 `1` 或 `0`，表示真或假。\n\n除了关系运算符外，本章还研究了 C 语言的几几种算术赋值运算符，例如\
  \ `+=` 和 `*=`。这些运算符通过对左操作数进行算术运算来修改其值。\n\n数组是下一个主题。数组使用方括号声明以指示元素个数。数组的第一个元素编号为\
  \ 0；第二个编号为 1，以此此类推。例如，声明\n\n`double hippos[20];`\n\n这创建了一个包含 20 个元素的数组，单个元素范围从 `hippos[0]`\
  \ 到 `hippos[19]`。用于给数组编号的下标可以通过循环方便地处理。\n\n最后，本章展示了如何编写和使用带有返回值的函数。\n\n## 复习题\n\n\
