  \ long` 变量来存储字体信息，并使用位运算符而不是位成员来管理信息。\n\n## 16. C 预处理器和 C 库\n\n你将在本章学习以下内容：\n\n\
  预处理器指令：\n- `#define`, `#include`, `#ifdef`\n- `#else`, `#endif`, `#ifndef`\n- `#if`,\
  \ `#elif`, `#line`, `#error`, `#pragma`\n\n关键字：\n- `_Generic`, `_Noreturn`, `_Static_assert`\n\
  \n函数/宏：\n- `sqrt()`, `atan()`, `atan2()`\n- `exit()`, `atexit()`\n- `assert()`\n\
  - `memcpy()`, `memmove()`\n- `va_start()`, `va_arg()`, `va_copy()`, `va_end()`\n\
  \n更多能力：\n- 预处理器指令\n- 关键字\n- 函数/宏\n- 更多能力\n\nC 预处理器在编译之前对源代码进行各种变换。它是一个对源代码操作的文本工具。\n\
  \n### 程序翻译的第一步\n\n编译器首先将字符映射到字符集。这处理了多字节字符和三字符组合（trigraphs）。其次，编译器找到每个紧随反斜杠的换行符并将其删除。也就是说，两行物理行，例如：\n\
  \n```c\nprintf(\"That's \\\nwonderful!\");\n```\n\n被转换为单逻辑行。\n\n接下来，编译器将文本拆分为一系列预处理标记以及空白字符和注释的序列。现在一个引起感兴趣的点是，每个注释都被替换为一个空格。此外，某些实现可能会选择将每个空白字符序列（换行除外）替换为单个空格。最后，程序准备好进入预处理阶段，预处理器寻找潜在的预处理器指令，这些指令由行开头的\
  \ `#` 符号指示。\n\n宏定义常量：#define\n\n`#define` 预处理器指令像所有预处理器指令一样，以行开头的 `#` 符号开始。标准允许\
  \ `#` 符号前空格或制表符，并允许 `#` 与指令的其余部分之间有空格。然而，旧版本的 C 通常要求指令从最左列开始，且 `#` 与指令的其余部分之间没有空格。指令可以出现在源文件的任何位置，该定义从出现处一直持续到文件结束。\n\
  \n\n\n\n预处理器指令会运行到 `#` 之后的第一个换行符为止。也就是说，一条指令的长度限制为一行。然而，如前所述，反斜杠/换行符的组合在预处理开始会被删除，因此你可以将指令分散在多个物理行上。但是，这些行构成了一个单一逻辑行。\n\
  \n### 列表 16.1 `preproc.c` 程序\n\n点击此处查看代码图像\n\n```c\n/* preproc.c -- 简单的预处理器示例 */\n\
  \n#include <stdio.h>\n\n#define TWO 2         /* 如果你，可以使用注释 */\n\n#define OW \"\
  Consistency is the last refuge of the unimagina\\\native. - Oscar Wilde\" /* 反斜杠将定义延续\
  \ */\n                           /* 到下一行              */\n\n#define FOUR  TWO*TWO\n\
  \n#define PX printf(\"X is %d.\\\n\nint main(void)\n{\n    int x = TWO;\n    PX;\n\
  \    x = FOUR;\n    printf(FMT, x);\n    printf(\"%s\\n\", OW);\n    printf(\"TWO:\
  \ OW\\n\");\n    return 0;\n}\n```\n\n每一行 `#define`（即逻辑行）都包含三个部分。第一部分是 `#define`\
  \ 指令本身。第二部分是你选择的缩写，称为 `macro`（宏）。某些宏（如这些示例）表示值；它们被称为 `object-like macros`（对象类宏）（C\
  \ 还有 `function-like macros`，我们稍后会介绍）。宏名中不能有空格，并且必须符合与 C 变量相同的命名规则：只能使用字母、数字和下划线（`_`），且第一个字符不能是数字。第三部分（行的剩余部分）称为\
  \ `replacement list`（替换列表）或 `body`（体）（参见图 16.1）。当预处理器在程序找到你定义的某个宏的实例时，它几乎总是将其替换为体。（有一个例外，我们稍后会向你展示。）这种从宏到最终替换的过程称为\
  \ `macro expansion`（宏展开）。注意，你可以在 `#define` 行上使用标准的 C 注释；如前所述，每个注释在预处理器看到它之前都会被替换为空格。\n\
  \n![图像](img/16fig01.jpg)\n\n图 16.1 对象类宏定义的各个部分。\n\n让我们运行示例并看看它是如何工作的：\n\n点击此处查看代码图像\n\
  \n``````\nX is 2.\nX is 4.\nConsistency is the last refuge of the unimaginative.\
  \ - Oscar Wilde\nTWO: OW\n```\n\n这里发生了什么。语句\n\n```c\nint x = TWO;\n```\n\n变为\n\n\
  ```c\nint x = 2;\n```\n\n因为 `TWO` 被替换为 `2`。然后语句\n\n```c\nPX;\n```\n\n变为\n\n```c\n\
  printf(\"X is %d.\\n\", x);\n```\n\n因为执行了这种整体替换。这是一个新花样，因为到为止我们只用过宏来表示常量。在这里你看到宏可以表示任何字符串，甚至是一个完整的\
  \ C 表达式。但注意，这是一个常量字符串；`PX` 只会打印名为 `x` 的变量。\n\n下一行也代表了新内容。你可能认为 `FOUR` 被替换为 `4`，但实际过程是这样的：\n\
  \n```c\nx = FOUR;\n```\n\n变为\n\n```c\nx = TWO*TWO;\n```\n\n然后变为\n\n```c\nx = 2*2;\n\
  ```\n\n宏展开过程到此结束。实际的乘法发生在预处理器工作期间，而在编译期间，因为 C 编译器在编译时评估所有的常量表达式（仅包含常量的表达式）。预处理器不进行计算；它只是字面上地执行建议的替换。\n\
  \n注意，宏定义可以包含其他宏。（某些编译器不支持这种嵌套功能。）\n\n在下一行中\n\n```c\nprintf (FMT, x);\n```\n\n变为\n\
  \n```c\nprintf(\"X is %d.\\n\",x);\n```\n\n因为 `FMT` 被替换为相应的字符串。如果你有一个需要使用多次的长控制字符串，这种方法会非常方便。或者，你可以采取如下操作：\n\
  \n点击此处查看代码图像\n\n```c\nconst char * fmt = \"X is %d.\\n\";\n```\n\n然后就可以使用 `fmt`\
  \ 作为 `printf()` 的控制字符串。\n\n在下一行，`OW` 被替换为相应的字符串。双引号使替换字符串成为字符字符串常量。编译器将将其存储在以空字符终止的数组中。因此，\n\
  \n```c\n#define HAL 'Z'\n```\n\n定义了一个字符常量，但\n\n```c\n#define HAP \"Z\"\n```\n\n\
  定义了一个字符字符串：`Z\\O`。\n\n在示例中，我们在行尾之前紧紧跟了一个反斜杠：\n\n点击此处查看代码图像\n\n```c\n#define OW \"\
  Consistency is the last refuge of the unimagina\\\native. - Oscar Wilde\"\n```\n\
  \n\n\n将正体视为字符字符串的预处理器会将 `EIGHT` 替换为 `4 * 8`。这意味着，额外的空格将成为替换内容的一部分；但将正体视为标记（tokens）的预处理器则会将\
  \ `EIGHT` 替换为三个由单空格分隔的标记：`4 * 8`。换句话之，字符字符串解释将空格视为正体的一部分，而标记解释则将空格视为正体中标记之间的分隔符。在实践中，某些\
  \ C 编译器将宏主体视为字符串而非标记。这种差异仅在比我们这里尝试的更复杂的用法中才具有实际意义。\n\n顺便提一下，C 编译器对标记的理解比预处理器更复杂。编译器理解\
  \ C 语言的规则，并不要求使用空格来分隔标记。例如，C 编译器会将 `2*2` 视为三个标记，因为它识别出每个 `2` 都是一个常量，而 `*` 是一个运算符。\n\
  \n### 重新定义常量\n\n假设你定义 `LIMIT` 为 20，然后在同一个文件的后部分将其重新定义为 `25`。这个过程被称为`重定义常量`。不同的实现在重定义策略上有所不同。有些实现认为这是一个错误，除非新定义与旧定义相同。另一些则允许重定义，可能会发出警告。ANSI\
  \ 标准采取了第一种观点，仅在新定义与旧定义重复时才允许重定义。\n\n具有相同的定义意味着主体必须以相同的顺序具有相同的标记。因此，这两个定义是契合的：\n\n\
  ```c\n#define SIX 2 * 3\n#define SIX 2    *     3\n```\n\n两者具有相同的三个标记，额外的空格不是正体的一部分。下一个定义被认为是不同的：\n\
  \n```c\n#define SIX 2*3\n```\n\n它只有一个标记，而不是三个，因此它不匹配。如果你想重新定义一个宏，请使用 `#undef` 指令，我们稍后会讨论。\n\
  \n如果你确实有需要重新定义的常量，使用 `const` 关键字和作用域规则来实现这一目的可能会更容易。\n\n### 在 #define 使用参数\n\n通过使用参数，你可以创建看起来和行为上非常像函数的`类函数宏`。带有参数的宏看起来与函数非常相似，因为参数封装在括号内。类函数宏的定义在括号内有一个或多个参数，这些参数随后出现在替换部分，如图\
  \ 16.2 所示。\n\n![图像](img/16fig02.jpg)\n\n图 16.2 类函数宏定义的组成部分。\n\n这是一个示例定义：\n\n```c\n\
  #define SQUARE(X) X*X\n```\n\n它可以像这样在程序中使用：\n\n```c\nz = SQUARE(2);\n```\n\n这看起来像是一个函数调用，但其行为并不一定完全相同。列表\
  \ 16.2 说明了使用这个宏和第二个宏。某些示例还指出了可能的陷阱，因此请仔细阅读。\n\n列表 16.2 `mac_arg.c` 程序\n\n点击此处查看代码图像\n\
  \n***\n\n```c\n/* mac_arg.c -- 带参数的宏 */\n#include <stdio.h>\n\n#define SQUARE(X)\
  \ X*X\n\n#define PR(X)   printf(\"The result is %d.\\n\", X)\n\nint main(void)\n\
  {\n    int x = 5;\n    int z;\n    printf(\"x = %d\\n\", x);\n    z = SQUARE(x);\n\
  \    printf(\"Evaluating SQUARE(x): \");\n    PR(z);\n    z = SQUARE(2);\n    printf(\"\
  Evaluating SQUARE(2): \");\n    PR(z);\n    printf(\"Evaluating SQUARE(x+2): \"\
  );\n    PR(SQUARE(x+2));\n    printf(\"Evaluating 100/SQUARE(2): \");\n    PR(100/SQUARE(2));\n\
  \    printf(\"x is %d.\\n\", x);\n    printf(\"Evaluating SQUARE(++x): \");\n  \
  \  PR(SQUARE(++x));\n    printf(\"After incrementing, x is %x.\\n\", x);\n    return\
  \ 0;\n}\n```\n\n***\n\n`SQUARE` 宏有如下定义：\n\n```c\n#define SQUARE(X) X*X\n```\n\n\
  在这里，`SQUARE` 是宏标识符，`SQUARE(X)` 中的 `X` 是宏参数，而 `X*X` 是替换列表。无论在列表 16.2 何处出现 `SQUARE(x)`，它都会被替换为\
  \ `x*x`。这与之前的示例不同之处，当你使用此宏时可以使用 `x` 以外的符号。宏定义中的 `x` 会被该符号替换。`SQUARE` 宏有如下定义：\n\n\
  ```c\n#define SQUARE(X) X*X\n```\n\n在这里，`SQUARE` 是宏标识符，`SQUARE(X)` 中的 `X` 是宏参数，而\
