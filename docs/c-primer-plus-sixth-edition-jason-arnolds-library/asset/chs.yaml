  \ 的函数，因为它是程序启动时调用的函数。一个简单的函数由函数头、紧随其后的左大括号、构成函数体的语句、以及结束性的右大括号（或 `closing` 大括号）组成。\n\
  \n每个 C 语句都是给计算机的指令，并以分号结尾标记。声明语句为变量创建一个名称，并标识要存储在变量中的数据类型。变量名是标识符的一个示例。赋值语句为变量（更通地说，为存储区域）分配一个值。函数调用语句会导致执行命名的函数。当调用的函数执行完毕，程序将返回到函数调用后的下一个语句。\n\
  \n`printf()` 函数可以用于打印字符串和变量的值。\n\n语言的`syntax`（语法）是规定该语言有效语句组合方式的规则集。语句的`semantics`（语义）是其含义。编译器帮助你检测语法错误，但语义错误只有在程序编译后才会出现在程序的行为中。检测语义错误可能涉及跟踪每个程序步骤之后的程序状态——即所有变量的值。\n\
  \n最后，`keywords`（关键字）是 C 语言的词汇。\n\n\n\n\n程序是处理数据工作的。你向计算机输入数字、字母和单词，并期望它对这些数据进行某些处理。例如，你可能希望计算机计算利息支出，或者显示一个排序后的酒庄列表。在本章中，你将做的不仅仅是阅读数据，而是将练习操作数据，这要有趣得多。\n\
  \n本章探索了数据的两个大类：整数和浮点数。C 语言提供了这些类型的多种变。本章将告诉你这些类型是什么、如何声明它们，以及何时以及使用它们。此外，你还将发现常量和变量之间的区别，作为奖励，你的第一个交互程序即将到来。\n\
  \n#### 示例程序\n\n我们再次从一个示例程序开始。像之前，你会发现一些不熟悉的地方，我们会很快为你解决。程序的整体意图应该是清晰的，请尝试编译并运行示例\
  \ 3.1 所示的代码。为了节省时间，你可以省略注释。\n\n示例 3.1 `platinum.c` 点击此处查看代码图像\n\n```c\n/* platinum.c\
  \  ——你的重量 */\n\n#include <stdio.h>\n\nint main(void)\n{\n    float weight;    /*\
  \ 用户重量 */\n    float value;     /* 价值 */\n    printf(\"你的重量值这么多钱吗？\\n\");\n    printf(\"\
  让我们检查一下。\\n\");\n    printf(\"请输入你的重量（磅）： \"); /* 从用户获取输入 */\n    scanf(\"%f\",\
  \ &weight);            /* 假设每盎司 1700 美元 */\n    /* 14.5833 将磅转换为盎司 */\n    value\
  \ = 1700.0 * weight * 14.5833;\n    printf(\"你的重量价值%.2f。\\n\", value);\n    printf(\"\
  你完全值这些钱！如果金价下跌，\\n\");\n    printf(\"多吃一点以维持你的价值。\\n\");\n    return 0;\n}\n```\n\
  \n错误与警告\n\n如果你错误地输入此程序，例如漏掉分号，编译器会给你一个错误信息。然而，即使你输入正确，编译器也可能给你一个类似于“警告——从‘double’转换到‘float’可能会丢失数据”的警告。错误信息意味着你做错了事并阻止了程序的编译。而警告意味着你做的事情是有效的，但可能不是你的本意。警告不会停止编译。这个警告与\
  \ C 如何处理如 `1700.0` 之类的值有关。对于这个示例这不是问题，本章稍后会解释。当你输入此程序时，可能想将 `1700.0` 修改为贵金属的当前价格。但不要动\
  \ `14.5833`，它代表一磅中的盎司数（盎司用于贵金属，而磅用于人们的重量以及其他情况）。\n\n注意，“输入”你的重量意味着输入你的重量然后按 Enter（回车）键。（不要只输入重量就等待。）按\
  \ Enter 会告知计算机你已完成输入。程序期望你输入一个数字，例如 `156`，而不是单词，如 `too much`。输入字母而非数字会导致需要第 7 章“C\
  \ 控制语句：分支与跳转](#ch07.html_ch07)”来解决的问题，因此请礼貌地输入一个数字。以下是一些示例输出：\n\n点击此处查看代码图像\n\n\
  ```\n你的重量值这么多钱吗？\n\n让我们检查一下。\n\n请输入你的重量（磅）：156\n\n你的重量价值$386791.25。\n\n你完全值这些钱！如果金价下跌，\n\
  \n多吃一点以维持你的价值。\n```\n\n程序调整\n\n尽管你按照第 2 章“引入 C 语言](#ch02.html_ch02)”中的描述在程序中添加了以下行，该程序的输出是否只是在屏幕上闪烁一下就消失了？\n\
  \n#### 程序中有什么新？\n\n程序中有几个新元素：\n\n1. 注意代码使用了新的变量声明。之前的示例仅使用整数变量（`int`），但这一个添加了浮点变量（`float`），以便你可以处理更多种类的数据。\n\
  2. 程序演示了常量的某些新方式。你现在有了带小数点的数字。\n3. 要打印这种新类型的变量，在 `printf()` 使用 `%f` 格式符。`%f` 格式符的\
  \ `.2` 修饰符微调了输出外观，使其显示小数点后两位。\n4. `scanf()` 函数提供了键盘输入。`&` 符号用于指示它可以在哪里找到 `weight`\
  \ 变量。\n5. 也许最突出的新特性是程序是交互式的。计算机向你索要信息，然后使用你输入的数字。交互程序比非交互类型更有趣。更重要的是，交互方法使程序更灵活。例如，示例程序可以用于任何合理的重量，而不仅仅是\
  \ 156。`scanf()` 和 `printf()` 函数使这种交互成为可能。`scanf()` 函数从键盘读取数据并将数据传递给程序，而 `printf()`\
  \ 从程序读取数据并将数据传递到你的屏幕。这两个函数共同使你能够与计算机建立双向通信（参见图 3.1），这使得使用计算机变得有趣得多。\n\n\n\n\n在程序的引导下，计算机可以完成许多任务。它可以相加数字、排序、控制扬声器或视频屏幕、计算彗星轨道、准备邮件列表、拨号、画火人、得出结论，或者你想象力能创造的任何事情。为了完成这些任务，程序需要处理`data`，即带有你所使用的信息的数字和字符。某些类型的数据在程序使用之前就已经预设，并在整个程序生命周期内保持值不变。这些是`constants`。其他类型的数据在程序运行时可能会改变或被赋值；这些是`variables`。在示例程序中，`weight`\
  \ 是一个变量，而 `14.5833` 是一个常量。那么 `1700.0` 呢？诚然，在现实生活中，铂的价格不是常量，但此程序将其视为常量。变量与常量之间的区别在于，变量在程序运行时可以赋值或更改其值，而常量不能。\n\
  \n## 数据：数据类型关键字\n\n除了变量和常量区别外，还有不同类型（`types`）的数据。某些类型的数据是数字。有些是字母，或者更广泛地说，是字符。计算机需要一种方法来识别和使用这些不同种类。C\
  \ 语言通过识别几种基础`data types`来实现这一点。如果一个数据项是常量，编译器通常可以根据它的形式判断出其类型：`42` 是整数，而 `42.100`\
  \ 是浮点数。然而，变量需要在声明语句中宣布其类型。随着学习的深入，你将学习声明变量的细节。不过，首先看看 C 语言识别的基础类型关键字。K&R C 识别了七个与类型相关的关键字。C90\
  \ 标准在列表中增加了两个。C99 标准又增加了三个（参见表 3.1）。\n\n![Image](img/03tab01.jpg)\n\n表 3.1 C 数据关键字\n\
  \n`int` 关键字提供了 C 语言中使用的整数基本类。接下来的三个关键字（`long`、`short` 和 `unsigned`）以及 C90 增加的 `signed`\
  \ 用于提供基本类型的变体，例如 `unsigned short int` 和 `long long int`。接下来，`char` 关键字指定了用于字母表中的字母和其他字符（如\
  \ `#`、`$`、`%` 和 `*`）的类型。`char` 类型也可以用于表示小整数。接下来，`float`、`double` 和组合 `long double`\
  \ 用于表示带小数点的数字。`_Bool` 类型用于布尔值（`true` 和 `false`），而 `_Complex` 和 `_Imaginary` 分别表示复数和虚数。\n\
  \n使用这些关键字创建的类型根据它们在计算机中的存储方式分为两类：`integer` 类型和 `floating-point` 类型。\n\n***\n\n##\
  \ 比特、字节与字\n\n`bit`（比特）、`byte`（字节）和 `word`（字）这些术语可以描述计算机数据单位或描述计算机内存单位。我们在这里关注第二种用法。\n\
  \n内存的最小单位称为 `bit`。它可以持有两个值中的一个：`0` 或 `1`。（或者你可以说比特被设置为“关闭”或“开启”）。你无法在一个比特中存储大量信息，但计算机拥有海量的比特。比特是计算机内存的构建构建块。\n\
  \n`byte` 是计算机内存的常用单位。对于几乎所有的机器，一个字节是 8 个比特，这是标准定义，至少在用于衡量存储时是。（然而，C 语言有不同的定义，如在本章稍后的“使用字符：类型\
  \ `char`”节中所述。）由于每个比特可以是 0 或 1，因此一个 8 比特字节中可以容纳 256 （即 2 自乘 8 次）可能的 0 和 1 比特模式。这些模式可以用于，例如，表示\
  \ 0 到 255 的整数，或表示一组字符。表示可以通过二进制代码完成，二进制代码（很方便地）仅使用 0 和 1 来表示数字。（第 15 章，“位操作”部分讨论了二进制代码，但如果你愿意，现在就可以阅读该章的介绍性材料。）\n\
  \n`word` 是特定计算机设计的内存自然单位。对于 8 比特微型计算机（如原始的苹果电脑），一个字就是 8 个比特。从那时起，个人电脑发展到了 16 位字、32\
  \ 位字以及现在的 64 位字。更大的字长能够更快速传输传输并允许访问更多内存。\n\n***\n\n### 整数型与浮点型\n\n整数类型？浮点类型？如果你发现这些术语感到令人不安的陌生，请放松。我们即将向你简要介绍它们的含义。如果你对比特、字节和字不熟悉，你可能想先读一下关于它们的侧边栏。你必须学习所有细节吗？并不真的，这就像你开车时不需要学习内燃机的原理一样，但了解一点计算机或引擎内部在发生什么在某些情况下可以对你有所帮助。\n\
  \n对于人类来说，整数和浮点数之间的区别体现在表示方式上。对于计算机来说，区别体现在存储方式上。\n\n### 整数\n\n`integer` 是不带小数点的数字。在\
  \ C 语言中，整数永远不带小数点。整数如 2、23 和 45。整数 7 的二进制表示为 111。因此，在 8 比特字节中存储这个数字，只需将其设置（参见图 3.2）。\n\
  \n![Image](img/03fig02.jpg)\n\n图 3.2 使用二进制代码存储整数 7。\n\n### 浮点数\n\n`floating-point`\
  \ 数字在很大程度上对应于数学家所说的 `real number`（实数）。实数包括整数之间的数字。浮点数如 2.75、3.16、7.00。注意添加小数点会使一个数值变为浮点。所以\
  \ 7 是整数类型，但 7.00 是浮点类型。显然，表示浮点数的方法不止一种。我们稍后会详细讨论科学计数法，但简而言之，3.16E7 法意味着 3.16 乘以\
  \ 10 的 7 次方；即乘以一个带有 7 个零 1。7 被称为 10 的 `exponent`（指数）。这里的关键点是，存储浮点数的方案与存储整数的方案不同。浮点表示涉及将数字分成小数部分和指数部分分别存储这些部分。因此，列表中的\
  \ 7.00 存储方式与整数 7 不同，尽管它们的值相同。十进制类比是将 7.0 写为 0.7E1。在这里，0.7 是小数部分，而 1 是指数部分。图 3.3\
  \ 显示了浮点存储的另一个示例。当然，计算机使用二进制数和 2 的幂代替 10 的幂进行内部存储。你可以在第 15 章中找到关于该主题的更多信息。\n\n\n\n\
  \n![Image](img/squf.jpg) 因为在任何范围内都有无限多个实数——例如，在 1.0 到 2.0 之间的范围内——计算机浮点数无法表示该范围内的所有值。相反，浮点值通常是真实值的近似值。例如，7.0\
  \ 可能被存储为 6.99999 的 `float` 值——关于精度的将在稍后讨论。\n\n![Image](img/squf.jpg) 浮点运算曾经远比整数运算慢得多。然而，今天许多\
  \ CPU 都集成了浮点运算处理器，缩小了这一差距。\n\n![Image](img/03fig03.jpg)\n\n图 3.3 以浮点格式存储数字圆周（十进制版本）。\n\
  \n## C 基础数据类型\n\n现在让我们来看 C 语言使用的基础数据类型的细节。对于每种类型，我们都会描述如何声明变量、如何用字面量值（如 `5` 或 `2.78`）表示常量，以及其典型的用途是什么。某些旧的\
  \ C 编译器不支持所有这些类型，因此请检查你的文档以查看你可以使用哪些类型。\n\n### int 类型\n\nC 提供了许多整数类型，你可能会奇怪为什么一种类型是不够的。答案是，C\
  \ 为程序员提供了将类型与特定用途匹配的选项。特别是，C 整数类型在提供的数值范围以及是否可以使用负数方面有所不同。`int` 类型是基础选择，但如果你需要其他选择来满足特定任务或机器的需求，这些选择也是提供的。\n\
  \n`int` 类型是有符号整数。这意味着它必须是一个整数，并且可以是正数、负数或零。可能值的范围取决于计算机系统。通常，一个 `int` 使用一个机器字进行存储。因此，具有\
  \ 16 位字的旧版 IBM PC 兼容机使用 16 位来存储一个 `int`。这允许取值范围在 `-32768` 到 `32767` 之间。现在的个人电脑通常具有\
  \ 32 位整数，并将 `int` 适配到该大小。现在个人电脑行业正向 64 位处理器发展，这些处理器自然会使用更大的整数。ISO C 规定类型 `int` 的最小范围应为从\
  \ `-32767` 到 `32767`。系统通常通过使用特定位的值来指示符号并表示有符号整数。第 15 章讨论了常用方法。\n\n### 声明 int 变量\n\
  \n正如你在第 2 章中看到的，关键字 `int` 用于声明基础整数变量。首先是 `int`，然后是选定的变量名，最后是一个分号。要声明多个变量，你可以单独声明每个变量，也可以在\
  \ `int` 后面跟出一个名称列表，每个名称之间用逗号分隔。以下是有效的声明：\n\n```\nint s;\nint hogs, goats;\n```\n\
  \n这些声明创建了变量，但没有为它们提供值。变量是如何获取值的？你已经见过它们在程序中获取值的两种方式。首先是赋值：\n\n```\ncows = 1;\n```\n\
  \n其次，变量可以从函数获取值。\n\n### 初始化变量\n\n初始化一个变量意味着给它分配一个初始值。在 C 中，这可以在声明的一部分完成。只需在变量名后跟随赋值运算符（`=`）和你希望变量拥有的值即可。以下是一些示例：\n\
  \n```\nint hogs = 2;\nint cows = 3, goats = 4;\nint dogs, cats = 9; /* 合法，但格式不好\
  \ */\n```\n\n在最后一行中，只有 `cats` 被初始化了。快速阅读可能会让你认为 `dogs` 也初始化为 `9`，因此最好避免在同一个声明中放置已初始化和未初始化的变量。简之，这些声明创建并标记了变量的存储空间，并为每个变量分配了初始值。\n\
  \n### int 常数\n\n上一个示例中的各种整数（`2`、`3`、`4` 和 `9`）是整数常量，也称为整数字面量。当你写出一个没有小数点且没有指数的数字时，C\
  \ 将其识别为整数。因此，`2` 和 `-4` 是整数常量，但 `2.0` 和 `2E1` 不是。C 将大多数整数常量视为 `int` 类型。非常大的整数可以被特殊处理；见后对\
  \ `long` 类型的讨论。\n\n### 打印 int 值\n\n你可以使用 `printf()` 函数打印 `int` 类型。正如你在第 2 章中看到的，使用\
  \ `%d` 表示法指示整数打印的位置。`%d` 被称为格式说明符，因为它指示了 `printf()` 显示值时使用的格式。格式字符串中的每个 `%d` 必须与打印项目列表中对应的\
  \ `int` 值匹配。该值可以是一个 `int` 变量、一个 `int` 常量或任何具有 `int` 值的其他表达式。你的任务是确保格式说明符的数量与值的数量匹配；编译器不会捕捉这类错误。列表\
  \ 3.2 提供了一个简单的程序，它初始化了一个变量并打印了变量的值、常量的值以及一个表达式的值。它还展示了如果你不小心会发生什么。\n\n```\n/* print1.c\
  \ 显示了 printf() 的一些属性\n#include <stdio.h>\n\nint main(void)\n{\n    int ten = 10;\n\
  \    int two = 2;\n    printf(\"Doing it right: \");\n    printf(\"%d minus %d is\
  \ %d\\n\", ten, 2, ten - two);\n    printf(\"Doing it wrong: \");\n    printf(\"\
  %d minus %d is %d\\n\", ten); // 缺少 2 个参数\n    return 0;\n}\n```\n\n编译并运行该程序在某系统上产生了如下输出：\n\
  \n```\nDoing it right: 10 minus 2 is 8\nDoing it wrong: 10 minus 1650287143\n```\n\
  \n对于第一行输出，第一个 `%d` 代表 `int` 变量 `ten`，第二个 `%d` 代表 `int` 常量 `2`，第三个 `%d` 代表 `int`\
  \ 表达式 `ten - two` 的值。然而，在第二次运行时，程序使用 `ten` 为第一个 `%d` 提供值，并使用内存中恰好存在的任何值作为后两个 `%d`\
  \ 的值！（你得到的数字可能与此处显示的不同。不仅内存内容可能不同，不同的编译器也会不同的管理内存。）\n\n你可能会对编译器没有捕捉到这种明显的错误而感到恼火。归怪\
  \ `printf()` 异常的设计。大多数函数接受固定数量的参数，编译器可以检查你是否使用了正确的数量。然而，`printf()` 可以有一个、两个、三个或更多参数，这使得编译器无法使用通常的错误检查方法。然而，某些编译器会使用异常的检查方法，并警告你可能做错了。\n\
  \n\n\n\n\n通常，C 假设整数常量是十进制（或基 10）数字。然而，八进制（基 8）和十六进制（基 16）深受许多程序员欢迎。因为 8 和 16 是 2\
  \ 的幂，而 10 不是，这些数制有时为表示计算机相关的数值提供了一种更方便的方法。例如，经常出现在 16 位机器中的数字 65536 在十六进制中仅为 `10000`。此外，十六进制数中的每个数字恰对应\
  \ 4 位。例如，十六进制数字 `3` 是 `0011`，十六进制数字 `5` 是 `0101`。因此，十六进制值 `35` 的位模式是 `0011 0101`，十六进制值\
  \ `53` 是 `0101 0011`。这种对应关系使得十六进制和二进制（基 2）表示之间的转换变得简单。但计算机如何判断 `10000` 是指十进制、十六进制还是八进制值呢？在\
  \ C 中，特殊前缀表示你正在使用的数字底数。前缀 `0x` 或 `0X`（zero-ex）意味着你指定了一个十六进制值，因此十六进制的 `16` 写为 `0x10`\
  \ 或 `0X10`。同样，`0`（zero）前缀意味着你正在写八进制。例如，十进制值 `16` 在八进制中写为 `020`。第 15 章更详细地讨论了这些替代底数。\n\
  \n请注意，使用不同数制的选项是为了方便你提供的。它不会影响数字的存储方式。也就是说，你可以写 `16`、`020` 或 `0x10`，数字在每情况下存储方式完全相同——都是在计算机内部使用的二进制代码。\n\
  \n### 显示八进制和十六进制\n\n正如 C 允许用三种数制中的任意一种编写数字，它也允许你用这三个系统中的任何一个显示数字。要用八进制表示而非十进制显示整数，请使用\
  \ `%o` 代替 `%d`。要用十六进制显示整数，使用 `%x`。如果你想显示 C 前缀，可以使用格式说明符 `%#o`、`%#x` 和 `%#X`分别生成\
  \ `0`、`0x` 和 `0X` 前缀。列表 3.3 显示了一个短示例。（记住，对于某些 IDE，你可能需要在代码中插入 `getchar();` 语句以防止程序执行窗口立即关闭。）\n\
  \nListing 3.3 bases.c 程序\n\n```c\n/* bases.c--用十进制、八进制和十六进制打印 100 */\n\n#include\
  \ <stdio.h>\n\nint main(void)\n{\n    int x = 100;\n    printf(\"dec = %d; octal\
  \ = %o; hex = %x\\n\", x, x, x);\n    printf(\"dec = %d; octal = %#o; hex = %#x\\\
  n\", x, x, x);\n    return 0;\n}\n```\n\n编译并运行此程序将产生此输出：\n\n```\ndec = 100; octal\
  \ = 144; hex = 64\ndec = 100; octal = 0144; hex = 0x64\n```\n\n你会在三种不同的数制中看到相同的值。`printf()`\
  \ 函数负责这些转换。注意，除非在格式说明符中包含 `#`，否则输出中不会显示 `0` 和 `0x` 前缀。\n\n### 其他整数类型\n\n当你刚开始学习这种语言时，`int`\
  \ 类型可能满足你大部分的整数需求。然而，为了完整起见，我们现在涵盖其他形式。如果你愿意，可以略过这一节，直接跳到“使用字符：类型 `char`”部分关于 `char`\
  \ 类型的讨论，在需要时返回此处。\n\nC 提供了三个形容词关键字来修改基本整数类型：`short`、`long` 和 `unsigned`。这里有一些需要记住的点：\n\
  \n- 类型 `short int` 或简写为 `short` 使用的存储可能比 `int` 少，因此在只需要较数字时可以节省空间。像 `int` 一样，`short`\
  \ 是符号类型。\n- 类型 `long int` 或 `long` 使用的存储可能比 `int` 多，从而允许你表示更大的整数值。像 `int` 一样，`long`\
  \ 是符号类型。\n- 类型 `long long int` 或 `long long`（在 C99 标准中引入）使用的存储可能比 `long` 多。至少，它必须使用至少\
  \ 64 位。像 `int` 一样，`long long` 是符号类型。\n- 类型 `unsigned int` 或 `unsigned` 用于仅有非负值的变量。这种类型改变了可以存储的数字范围。例如，16\
  \ 位的 `unsigned int` 允许值范围从 `0` 到 `65535`，而不是 -32768 到 32767。用于表示符号数符号的位现在变成了另一个二进制位，允许产生更大的数字。\n\
  - 类型 `unsigned long int` 或 `unsigned long` 以及 `unsigned short int` 或 `unsigned short`\
  \ 被 C90 标准识别为有效。在此列表基础上，C99 增加了 `unsigned long long int` 或 `unsigned long long`。\n\
  - 关键字 `signed` 可以用于任何符号类型以显式表示你的意图。例如，`short`、`short int`、`signed short` 和 `signed\
  \ short int` 都是同一种类型的名称。\n\n#### 声明其他整数类型\n\n其他整数类型的声明方式与 `int` 类型相同。以下列表了几个示例。并非所有示例都是有效的。\n\
  \n```c\nlong int;\nshort int;\nunsigned int;\nunsigned long int;\nunsigned short\
  \ int;\nunsigned long long int;\n```\n\n#### 为什么需要多种整数类型？\n\n什么时候使用各种 `int` 类型？首先考虑\
  \ `unsigned` 类型。在计数时使用它们是自然的，因为你不需要负数，而且无符号类型允许你获得比符号类型更大的正数。\n\n\n\n\n如果你需要使用 `long`\
  \ 可以处理而 `int` 不能处理的数字，请使用 `long` 类型。然而，在 `long` 比 `int` 大的系统中，使用 `long` 可能会减慢计算速度，因此在非必要的情况下不要使用\
  \ `long`。另一点：如果你在一个 `int` 和 `long` 大相同的机器上编写代码，且你确实需要 32 位整数，你应该使用 `long` 代替 `int`，这样当程序传输到\
  \ 16 位机器上时就能正常运行。同样地，如果你需要 64 位整数值，请使用 `long long`。\n\n如果（例如）在 `int` 为 32 位的系统上你需要一个\
  \ 16 位的值，请使用 `short` 来节省存储空间。通常，只有当你的程序使用了相对于系统可用内存而言较大的整数数组时，节省存储空间才是重要的。使用 `short`\
  \ 的另一个原因是它的尺寸上可能与计算机中特定组件所使用的硬件寄存器相匹配。\n\n***\n\n## 整数溢出\n\n当一个整数尝试超出其类型表示范围时会发生什么？让我们将整数设置为其最大可能值，对其进行加法运算，看看发生了什么。尝试有符号和无符号类型。（`printf()`\
  \ 函数使用 `%u` 格式符来显示 `unsigned int values`。）\n\n点击此处查看代码图像\n\n```c\n/* toobig.c-exceeds\
  \ maximum int size on our system */\n\n#include <stdio.h>\n\nint main(void)\n{\n\
  \    int i = 2147483647;\n    unsigned int j = 4294967295;\n    printf(\"%d %d %d\\\
  n\", i, i+1, i+2);\n    printf(\"%u %u %u\\n\", j, j+1, j+2);\n    return 0;\n}\n\
  ```\n\n以下是我们系统的运行结果：\n\n点击此处查看代码图像\n\n2147483647 -2147483648 -2147483647\n\n4294967295\
  \ 0 1\n\n无符号整数 `j` 的行为就像汽车的里程表。当它达到最大值时，它会从头重新开始。整数 `i` 的行为也类似。主要的区别在于，无符号整数变量 `j`\
  \ 像里程表一样从 0 开始，而 `int` 变量 `i` 从 –2147483648 开始。注意，系统不会通知 `i` 已超过（溢出）它的最大值。你必须编写自己的程序来跟踪这一点。\n\
  \n这里描述的行为是由 C 语言对无符号类型的规则规定的。标准并没有定义有符号类型如何表现。这里显示的行为是典型的，但你可能会遇到不同的。\n\n***\n\n\
  ## long 常数和 long long 常数\n\n通常，当你在程序代码中使用像 2345 这样的数字时，它被存储为 `int` 类型。如果你在一个 `int`\
  \ 无法容纳如此大数字的系统上使用 1000000 会怎样？那么编译器会将将其视为 `long int`，假设该类型足够大。如果数字大于 `long` 的最大值，C\
  \ 将其视为 `unsigned long`。如果仍然不足，C 将该值视为 `long long` 或 `unsigned long long`（如果这些类型可用）。\n\
  \n八进制和十六进制常数被视为 `int` 类型，除非该值太大。此时，编译器会尝试 `unsigned int`。如果不起作用，它会按顺序尝试 `long`、`unsigned\
  \ long`、`long long` 和 `unsigned long long`。\n\n有时你可能希望编译器将一个小数字存储为 `long` 整数。例如，在\
  \ IBM PC 上显式使用内存地址的编程可能会产生这种需求。此外，一些标准 C 函数需要 `long` 类型的值。为了让一个小常数被视为 `long` 类型，你可以添加后缀\
  \ `l`（小写 L）或 `L`。第二种形式更好，因为它看起来看起来那么那么像数字 1。因此，一个具有 16 位 `int` 和 32 位 `long` 的系统会将整数\
  \ `7` 视为 16 位，将整数 `7L` 视为 32 位。`l` 和 `L` 后缀也可以用于八进制和十六进制整数，如 `020L` 和 `0x10L`。\n\
  \n同样，在支持 `long long` 类型的系统上，你可以使用 `ll` 或 `LL` 后缀来指示 `long long` 值，如 `3LL`。对于 `unsigned\
  \ long long`，在后缀后添加 `u` 或 `U`，如 `5ull` 或 `10LLU` 或 `6LLU` 或 `9Ull`。\n\n## 打印 short,\
  \ long, long long 和无符号类型\n\n打印 `unsigned int` 数字，使用 `%u` 表示法。打印 `long` 值，使用 `%ld`\
  \ 格式符。如果 `int` 和 `long` 大相同，`%d` 即可，但如果它们不同，请使用 `%ld`。八进制和十六进制格式使用 `%o` 和 `%x`。对于\
  \ `short`，使用 `%hd`。对于 `long long`，使用 `%lld`。 `unsigned int` 使用 `%u`，`unsigned long`\
  \ 使用 `%lu`。对于 `unsigned long long`，使用 `%llu`。\n\n点击此处查看代码图像\n\n```c\n/* print2.c-more\
  \ printf() */\n#include <stdio.h>\n\nint main(void)\n{\n    unsigned int un = 3000000000;\
  \ /* 32-bit int */\n    short end = 200; /* 16-bit short */\n    long big = 65537;\n\
  \    long long verybig = 1234567890862;\n\n    printf(\"un = %u and %d\\n\", un,\
  \ un);\n    printf(\"end = %hd and %d\\n\", end, end);\n    printf(\"big = %ld and\
  \ %hd\\n\", big, big);\n    printf(\"verybig= %lld and %ld\\n\", verybig, verybig);\n\
  \    return 0;\n}\n```\n\n\n\n\n接下来，请注意无论你告诉 `printf()` `end` 是一个 `short`（使用 `%hd`\
  \ 说明符）还是一个 `int`（使用 `%d` 说明符），`short` 变量 `end` 的显示都是相同的。这是因为当变量作为参数传递给函数时，C 会自动将\
  \ `short` 类型的值扩展为 `int` 类型的值。这可能在你脑海中引起两个问题：为什么要进行这种转换？`h` 修饰符的作用是什么？第一个问题的答案是，`int`\
  \ 类型被设计为计算机处理效率最高的整数类型。因此，在 `short` 和 `int` 大小不同的计算机上，将值作为 `int` 传递可能会更快。第二个问题的答案是，你可以使用\
  \ `h` 修饰符来显示一个较长的整数在截断为 `short` 大小时时的样子。输出的第三行说明了这一点。以 32 位二进制格式表示的数值 65537 为 `00000000000000010000000000000001`。使用\
  \ `%hd` 说明符强制 `printf()` 只查看最后 16 位；因此，它将值显示为 1。同样，最后一行输出显示了 `verybig` 的完整值，然后是通过\
  \ `%ld` 说明符看到的存储在最后 32 位中的值。\n\n早些时候你已经确保说明符的数量与要显示的值的数量匹配是你的责任。在这里你看到，为要显示的值类型使用正确的说明符也是你的责任。\n\
  \n***\n\n**提示：匹配 printf 类型说明符**\n\n记得检查在 `printf()` 语句中，每个要显示的值是否都有对应的一个格式说明符。同时，还要检查每个格式说明符的类型是否与相应的显示值的类型匹配。\n\
  \n### 使用字符：类型 char\n\n`char` 类型用于存储字母和标点符号等字符，但从技术上讲，它是一种整数类型。为什么？因为 `char` 类型实际上存储的是整数，而不是字符。为了处理字符，计算机使用数值编码，其中某些整数代表特定的字符。在美国最常用的代码是书内封页表格中的\
  \ ASCII 码。本书假设使用的就是这种代码。在其中，整数值 `65` 代表大写字母 `A`。因此，为了存储字母 `A`，你实际上需要存储整数 `65`。（许多\
  \ IBM 主机使用另一种名为 EBCDIC 的代码，但原理是相同的。美国以外的计算机系统可能使用完全不同的代码。）\n\n标准 ASCII 码在数值上从 0\
  \ 运行到 127。这个范围足够小，7 位即可容纳。`char` 类型通常被定义为 8 位的内存单元，因此它足够大，可以涵盖标准 ASCII 码。许多系统（如\
  \ IBM PC 和 Apple Mac）提供了扩展 ASCII 码（两个系统不同），但它们仍然保持在 8 位的限制内。更通地说，C 保证 `char` 类型足够大，能够存储实现\
  \ C 语言系统的基础字符集。\n\n许多字符集的值远多于 127 甚至 255。例如，就有日语汉字字符集。商业性的 Unicode 倡议创建了一个系统来表示全球范围内的各种字符集，目前拥有超过\
  \ 110,000 个字符。国际标准化组织（ISO）和国际电工委员会（IEC）开发了一种名为 ISO/IEC 10646 的字符集标准。幸运的是，Unicode\
  \ 标准一直与更广泛的 ISO/IEC 10646 标准保持兼容。\n\nC 语言定义字节（byte）为 `char` 类型所使用的位数，因此可以拥有具有 16\
  \ 位或 32 位字节以及 `char` 系统。\n\n#### 声明类型 char 变量\n\n正如你预期的，`char` 变量的声明方式与其他变量相同。这里是一些示例：\n\
  \n```\nchar response;\nchar itable, latan;\n```\n\n这段代码将创建三个 `char` 变量：`response`、`itable`\
  \ 和 `latan`。\n\n#### 字符常量和初始化\n\n假设你想将字符常量初始化为字母 `A`。计算机语言应该让事情变得简单，所以你不需要记忆 ASCII\
  \ 码，你也不需要。你可以通过以下初始化将字符 `A` 赋值给 `grade`：\n\n```\nchar grade = 'A';\n```\n\n包含在单引号之间的单个字符是一个\
  \ C 字符常量。当编译器看到 `'A'` 时，它会将 `'A'` 转换为正确的代码值。单引号是至关重要的。这是另一个例子：\n\n点击此处查看图像\n\n```\n\
  char broiled;      /* 声明一个 char 变量 */\nbroiled = 'T';    /* OK */\n```\n\n有些奇怪，C\
  \ 将字符常量视为 `int` 而不是 `char`。例如，在具有具有 32 位 `int` 和 8 位 `char` 的 ASCII 系统上，代码\n\n```\n\
  char grade = 'B';\n```\n\n将 `'B'` 表示为数值值 66 并存储在 32 位单元中，但 `grade` 最终将 66 存储在 8\
  \ 位单元中。字符常量的这种特性使得诸如 `'FATE'` 的字符常量成为可能，并将四个 8 位 ASCII 代码存储在 32 位单元中。然而，将这样的字符常量赋值给\
  \ `char` 变量会导致只使用最后 8 位，因此变量得到了值 `'E'`。\n\n#### 非打印字符\n\n单引号技术对于字符、数字和标点符号是很好的，但如果你翻阅书内侧封页的表格，你会发现某些\
  \ ASCII 字符是非打印的。例如，某些字符代表如退格、到下一行或让终端铃响（或扬声器蜂鸣）等操作。如何表示这些？C 提供了三种方法。\n\n第一种方法我们已经提到——直接使用\
  \ ASCII 码。例如，蜂鸣字符的 ASCII 值是 7，所以你可以这样做：\n\n```\nchar beep = 7;\n```\n\n在 C 中表示某些困难字符的方法是使用特殊的符号序列。这些被称为转义序列。表\
  \ 3.2 显示了转义序列及其含义。\n\n![图像](img/03tab02.jpg)\n\n表 3.2 转义序列\n\n转义序列在赋值给字符变量时必须放在单引号内。例如，你可以编写语句\n\
  \n```\nchar nerf = '\\n';\n```\n\n然后打印变量 `nerf` 以使打印机或屏幕换行一行。\n\n\n\n\n现在让我们仔细观察每个转义序列的作用。警报字符（`\\\
  a`）由 C90 引入，它会产生听觉或视觉上的警报。警报的性质取决于硬件，蜂鸣声是最常见的。（在某些系统上，警报字符没有效果。）C 标准规定，警报字符不改变活动位置。标准所指的*活动位置*，是指显示设备（屏幕、电打字机、打印机等）上如果不执行该字符，下一个字符将出现的位置。简而言之，活动位置就是你可能熟悉的屏幕光标的泛化表示。在屏幕上显示的程序中使用警报字符，应该产生蜂鸣声，而不会移动屏幕光标。\n\
  \n接下来，`\\b`、`\\f`、`\\n`、`\\r`、`\\t` 和 `\\v` 转义序列是常见的输出设备控制字符。通过它们如何影响活动位置来描述它们是最恰当的。退格符（`\\\
  b`）将活动位置在当前行向后移动一个空格。换页符（`\\f`）将活动位置向前移动到下一页的开头。换行符（`\\n`）将活动位置设置到下一行的开头。回车符（`\\\
  r`）将活动位置移动到当前行的开头。水平制表符（`\\t`）将活动位置移动到下一个水平制表位（通常，这些位置位于字符位置 1, 9, 17, 25 等）。垂直制表符（`\\\
  v`）将活动位置移动到下一个垂直制表位置。\n\n这些转义序列字符并不一定适用于所有显示设备。例如，换页符和垂直制表符在 PC 屏幕上会产生奇怪的符号，而不是移动光标，但如果将它们发送到打印机而不是屏幕，就能如描述那样工作。\n\
  \n接下来的三个转义序列（`\\\\`、`\\'` 和 `\\\"`）允许你将 `\\`、`'` 和 `\"` 作为字符常量使用。（因为这些符号被用于在 `printf()`\
  \ 命令中定义字符常量，如果你直接字面地使用它们，情况可能会变得困惑。）假设你想打印下面这一行：\n\n点击此处查看代码图像\n\nGramps 说，“一个 \\\
  \ 是反斜杠。”\n\n然后使用这段代码：\n\n点击此处查看代码图像\n\n```c\nprintf(\"Gramps sez, \\\"a \\\\ is\
  \ a backslash.\\\"\\n\");\n```\n\n最后两个形式（`\\0oo` 和 `\\xhh`）是 ASCII 代码的特殊表示法。要用八进制\
  \ ASCII 代码表示字符，可以在它前面加一个反斜杠（`\\`）并将整个内容括在单引号中。例如，如果你的编译器不识别警报字符（`\\a`），你可以使用 ASCII\
  \ 代码代替：\n\n```c\nbeep = '\\007';\n```\n\n你可以省略前导的零，所以使用 `'\\07'` 甚至 `'\\7'` 都可以。这种表示法会导致数字被解释为八进制，即使没有初始的\
  \ `0`。\n\n从 C90 开始，C 提供了第三种选择——使用十六进制形式的字符常量。在这种情况下，反斜杠后面跟着一个 `x` 或 `X` 以及一到三个十六进制数字。例如，Ctrl+P\
  \ 字符的 ASCII 十六进制代码为 10（十进制为 16），因此它可以表示为 `'\\x10'` 或 `'\\X010'`。图 3.5 显示了一些代表性的整数类型。\n\
  \n![图像](img/03fig05.jpg)\n\n图 3.5 使用 `int` 族编写常量。\n\n当你使用 ASCII 代码时，注意数字和数字字符之间的区别。例如，字符\
  \ 4 由 ASCII 代码值 52 表示。表示法 `'4'` 代表符号 4，而不是数值 4。\n\n此时，你可能会有三个问题：\n\n![图像](img/squf.jpg)\
  \ *为什么上一个例子中的转义序列没有被包含在单引号内？* **(`printf(\"Gramps sez, \\\"a \\\\ is a backslash\\\
  \"\\\"n\");`)**？** 当一个字符（无论是转义序列还是不是）是双引号括的字符字符串的一部分时，不要把它用单引号括起来。注意此示例中的其他字符（`G`、`r`、`a`、`m`、`p`、`s`\
  \ 等）都没有被单引号标记。用双引号括的字符字符串称为*字符字符串*。（第 4 章 探讨了字符串。）同样，`printf(\"Hello!\\007\\n\"\
  );` 会打印 `Hello!` 并鸣叫，但 `printf(\"Hello!7\\n\");` 会打印 `Hello!7`。不是转义序列一部分的数字被视为打印的普通字符。\n\
  \n![图像](img/squf.jpg) *我什么时候应该使用 ASCII 代码，什么时候应该使用转义序列？* 如果你在使用特殊转义序列（例如 `'\\f'`）和等效的\
  \ ASCII 代码（例如 `'\\014'`）之间进行选择，请使用 `'\\f'`。首先，这种表示法更易记忆。其次，它更具移植性。如果你有一个不使用 ASCII\
  \ 代码的系统，`'\\f'` 仍然有效。\n\n![图像](img/squf.jpg) *如果我需要使用数字代码，为什么要用，例如* `'\\032'` *而不是*\
  \ `032` *呢？*\n\n\n\n\n程序使用 `Boolean` 值来选择下一步执行哪些代码。代码执行将在第 6 章“C 控制语句：循环”和第 7 章中得到更全面的介绍，因此让我们把进一步讨论推迟到那时。\n\
  \n## 可移植类型：`stdint.h` 和 `inttypes.h`\n\n到目前，你可能已经注意到 C 提供了多种整数类型，这是一件好事。你可能也注意到，相同的类型名称在不同的系统中并不一定意味着相同的内容，这并不是什么好事。如果\
  \ C 拥有无论在何种系统中含义都相同的类型就太好了。而且，从 C99 开始，它确实做到了——某种意义上的如此。\n\nC 所做的是为现有的类型创建了更多名称。技巧是在一个名为\
  \ `stdint.h` 的头文件中定义这些新名称。例如，`int32_t` 表示 32 位有符号整数类型。在一个位 32 位 `int` 的系统上，头文件可以将\
  \ `int32_t` 定义为 `int` 的别名。另一个系统（一个拥有 16 位 `int` 和 32 位 `long` 的系统）可以将相同的名称 `int32_t`\
  \ 定义为 `long` 的别名。那么，当你使用 `int32_t` 作为类型编写程序并包含 `stdint.h` 头文件时，编译器将以适用于你特定系统的方式用\
  \ `int` 或 `long` 替换该类型。\n\n我们刚刚讨论的替代名称是*精确宽度整数类型*的示例；`int32_t` 正好是 32 位，不多不少。底层系统可能不支持这些选择，因此精确宽度整数类型是可选的。\n\
  \n如果系统不支持精确宽度类型怎么办？C99 和 C11 提供了第二类强制替代名称。这组名称保证类型至少足够满足规格，且没有其他更小的类型。这些类型被称为*最小宽度类型*。例如，`int_least8_t`\
  \ 将是能够存放 8 位有符号整数值的最小可用类型的别名。如果某个系统上的最小类型是 16 位，那么 `int8_t` 类型将不会被定义。然而，`int_least8_t`\
  \ 类型是可用的，可能实现为 16 位整数。\n\n当然，有些程序员对速度的关注超过空间。对于他们来说，C99 和 C11 定义了一组允许最快计算的类型。这些被称为*最快最小宽度*类型。例如，`int_fast8_t`\
  \ 将定义为系统上允许对 8 位有符号值进行快速计算的整数类型的替代名称。\n\n最后，对于某些程序员来说，只有系统中最大的整数类型才行；`intmax_t`\
  \ 代表该类型，即一种可以包含任何有效有符号整数值的类型。同样，`uintmax_t` 代表最大的无符号类型。顺带一提，这些类型可能比 `long long`\
  \ 和 `unsigned long` 更大，因为 C 实现允许定义超出要求的范围的类型。例如，某些编译器在 `long long` 类型成为标准的一部分之前就引入了该类型。\n\
  \nC99 和 C11 不仅提供了这些新的、可移植类型名称，还提供了输入输出方面的帮助。例如，`printf()` 要求特定类型对应特定的格式符。那么当你显示一个\
  \ `int32_t` 值时，如果它在某种定义中可能需要 `%d` 格式符，而在另一种定义中需要 `%ld`，你该怎么办？目前的标准提供了一些字符串宏（在第 4\
  \ 章中引入的机制），用于显示可移植类型。例如，`inttypes.h` 头文件将 `PRId32` 定义为字符串，代表 32 位有符号值的相应格式符（例如 `d`\
  \ 或 `l`）。列表 3.6 展示了一个简单的示例，说明了如何使用可移植类型及其关联的格式符。`inttypes.h` 头文件包含了 `stdint.h`，因此程序只需要包含\
  \ `inttypes.h`。\n\n### 列表 3.6 altnames.c 程序\n\n点击此处查看代码图像\n\n```c\n/* altnames.c\
  \ -- 整数类型的可移植名称 */\n\n#include <stdio.h>\n\n#include <inttypes.h> // 支持可移植类型\n\n\
  int main(void)\n{\n    int32_t me32;     // me32 是一个 32 位有符号变量\n    me32 = 45933945;\n\
  \    printf(\"First, assume int32_t is int: \");\n    printf(\"me32 = %d\\n\", me32);\n\
  \    printf(\"Next, let's not make any assumptions.\\n\");\n    printf(\"Instead,\
  \ use a \\\"macro\\\" from inttypes.h: \");\n    printf(\"me32 = %\" PRId32 \"\\\
  n\", me32);\n\nreturn 0;\n}\n```\n\n## float, double 和 long double 类型\n\n各种整数类型适用于大多数软件项目。然而，金融和数学导向的程序通常会使用浮点数。在\
  \ C 中，这些数字被称为 `float`、`double` 或 `long double`。它们对应于 FORTRAN 和 Pascal 中的 `real`\
  \ 类型。如前所述，浮点方法允许你表示范围大多的数字，包括小数。浮点数的表示法类似于*科学计数法*，这是科学家用来表示极大或极小数字的一种系统。让我们来看。\n\
  \n在科学计数法中，数字表示为小数乘以 10 的次方。这里有一些示例。\n\n第一列显示普通表示法，第二列显示科学计数法，第三列显示指数表示法（或 *e 表示法*），这是计算机通常编写和使用的科学计数法方式，*e*\
  \ 后面跟着 10 的次方。\n\nC 标准规定 `float` 必须能够表示六个有效数字，并允许至少 10³⁷ 的范围。系统通常使用 32 位存储浮点数。八位用于赋予指数值和符号，24\
  \ 位用于表示非指数部分（称为*尾数*或*有效数字*）及其符号。\n\n## 注意：C99/C11 支持\n\n尽管 C 已经转向 C11 标准，但编译器编写者实现\
  \ C99 特性的速度和优先级各不相同。在本书准备期间，某些编译器尚未实现 `inttypes.h` 头文件。\n\n\n\n\nC 还有一种 `double`（用于双精度）浮点类型。`double`\
  \ 类型的最小范围要求与 `float` 相同，但它将可表示的最小有效数字扩展到 10 位。典型的 `double` 表示使用 64 位而不是 32 位。某些系统将所有额外的\
  \ 32 位都用于非指数部分。这增加了有效数字的数量并减少了舍入误差。其他系统则使用部分位位来容纳更大的指数；这增加了可以容纳的数字范围。无论哪种方法都能至少提供\
  \ 13 位有效数字，超过了最低标准。\n\nC 允许第三种浮点类型：`long double`。其意图是提供比 `double` 更高的精度。然而，C 仅保证\
  \ `long double` 的精度至少与 `double` 一。\n\n### 声明浮点变量\n\n浮点变量的声明和初始化方式与它们的整数同类相同。以下是一些示例：\n\
  \n```c\nfloat noah, jonah;\ndouble trouble;\nfloat planck = 6.63e-34;\nlong double\
  \ gnp;\n```\n\n### 浮点常量（字面量）\n\n在编写字面浮点常量时，你有许多选择。浮点字面量的基本形式是一个带符号的数字序列，包括一个小数点，后面跟着一个\
  \ `e` 或 `E`，然后是一个带符号的指数，表示所使用的 10 的幂。以下是两个有效的浮点常量：\n\n- `-1.56E+12`\n- `2.87e-3`\n\
  \n你可以省略正号。你可以省略小数点（`2E5`）或指数部分（`19.28`），但不能同时省略。你可以省略小数部分（`3.E16`）或整数部分（`.45E–6`），但不能都省略（那样就不剩多少东西了！）。这里更多有效的浮点常量：\n\
  \n- `3.14159`\n- `.2`\n- `4e16`\n- `.8E-5`\n- `100.`\n\n不要在浮点常量中使用空格。\n\n错误：`1.56\
  \ E+12`\n\n默认情况下，编译器假设浮点常量是 `double` 精度。假设 `some` 是一个 `float` 变量，你有以下语句：\n\n```c\n\
  some = 4.0 * 2.0;\n```\n\n那么 `4.0` 和 `2.0` 被存储为 `double`，每个（通常）使用 64 位。乘积使用双精度算术进行计算，然后将结果修整为常规的\
  \ `float` 大小。这确保了你的计算具有更高的精度，但可能会减慢程序运行。\n\nC 允许你通过 `f` 或 `F` 后缀来覆盖此默认值，使编译器将浮点常量视为\
  \ `float` 类型；例如 `2.3f` 和 `9.11E9F`。使用 `l` 或 `L` 后缀使数字类型变为 `long double`；例如 `54.3l`\
  \ 和 `4.32e4L`。注意，`L` 比 `l` 更不容易被误认为是 `1`（数字一）。如果浮点数没有后缀，它就是 `double` 类型。\n\n自 C99\
  \ 起，C 有了表示浮点常量的新格式。它使用十六进制前缀（`0x` 或 `0X`）配合十六进制数字，用 `p` 或 `P` 代替 `e` 或 `E`，并且指数是\
  \ 2 的幂而不是 10 的幂。这样的数字可能像这样：\n\n```\n0xa.1fp10\n```\n\n`a` 是十六进制中的 10，`.1f` 是 1/16\
  \ 加上 15/256（`f` 是十六进制中的 15），而 `p10` 是 2¹⁰，即 1024，使得完整值为 (10 + 1/16 + 15/256) x 1024，或在十进制表示法为\
  \ 10364.0。\n\n并不是所有的 C 编译器都添加了对此功能的支持。\n\n### 打印浮点值\n\n`printf()` 函数使用 `%f` 格式说明符用十进制符号打印\
  \ `float` 和 `double` 类型数字，并使用 `%e` 以指数计数法打印它们。如果你的系统支持浮点数的十六进制格式，可以使用 `a` 或 `A`\
  \ 代替 `e` 或 `E`。`long double` 类型需要 `%Lf`、`%Le` 和 `%La` 说明符来打印该类型。注意 `float` 和 `double`\
  \ 都使用 `%f`、`%e` 或 `%a` 说明符进行输出。这是因为当 `float` 类型的值作为参数传递给任何没有显式声明参数类型的函数（如 `printf()`）时，C\
  \ 会自动将其扩展为 `double` 类型值。列表 3.7 说明了这些行为。\n\n列表 3.7 showf_pt.c 程序\n\n点击此处查看代码图像\n\n\
  ***\n\n```c\n/* showf_pt.c -- 以两种方式显示 float 值 */\n\n#include <stdio.h>\n\nint main(void)\n\
  {\n    float aboat = 3200.0;\n    double aboot = 3200.0;\n    float planck = 6.63e-34;\n\
  \    long double gnp;\n    // ...\n}\n```\n\n\n\n\n```c\nreturn 0;\n\n}\n```\n\n\
  输出如下：\n\n点击此处查看代码图像\n\n0.000000 ←Linux 上的旧版 gcc\n\n-13584010575872.000000 ←Turbo\
  \ C 1.5\n\n4008175468544.000000 ←XCode 4.5, Visual Studio 2012, 当前 gcc\n\n出现这些异常结果的原因是计算机没有保留足够的的小位数来正确执行操作。数字\
  \ `2.0e20` 是一个数字 2 后面跟着 20 个 0，通过加 1，你正在尝试修改第 21 位数字。要正确地完成这一操作，程序需要能够存储一个 21 位的数字。`float`\
  \ 类型数字通常只有六或七位数字，通过指数进行放大或缩小来表示。这种尝试是注定失败的。另一方面，如果你用 `2.0e4` 代替 `2.0e20`，你会得到正确的答案，因为你正在尝试修改第五位，而\
  \ `float` 数字的精度足以做到这一点。\n\n## 浮点数表示\n\n之前的侧边栏列出了同一程序可能产生的不同输出，这取决于所使用的计算机系统。原因在于，在之前讨论的广义框架内，实现浮点数表示有多种方法。为了提供更大的统一性，电气电子工程师学会（IEEE）开发了一项浮点数表示和计算的标准，该标准现在被许多硬件浮点单元使用。2011\
  \ 年，该标准被采用为国际 ISO/IEC/IEEE 60559:2011 标准。该标准作为选项包含在 C99 和 C11 标准中，旨在让符合标准的硬件平台上获得支持。`floaterr.c`\
  \ 程序的最终输出来自支持此浮点标准的系统。C 的支持包含了捕获此类问题的工具。更多细节请参见附录 B,第 V 。\n\n噬 复数和虚数类型\n\n科学和工程中的许多计算使用复数和虚数。C99\
  \ 支持这些数字，但带有一些保留限制。独立实现（如用于嵌入式处理器的实现）不需要包含这些类型。（一个 VCR 芯片可能不需要复数来完成工作。）此外，更一般地说，虚数类型是可选的。在\
  \ C11 中，整个复数包都是可选的。\n\n简而言之，有三种复数类型，分别为 `float _Complex`、`double _Complex` 和 `long\
  \ double _Complex`。例如，一个 `float _Complex` 变量包含两个 `float` 值，一个代表复数的实部，另一个代表虚部。同样，还有三种虚数类型，分别为\
  \ `float _Imaginary`、`double _Imaginary` 和 `long double _Imaginary`。\n\n包含 `complex.h`\
  \ 头文件允许你用 `complex` 替换 `_Complex`，用 `imaginary` 替换 `_Imaginary`，并允许你使用符号 `I` 来表示\
  \ –1 的平方根。\n\n你可能觉得奇怪，为什么 C 标准不直接使用 `complex` 作为关键字，而是使用 `_Complex` 然后添加一个头文件将 `complex`\
  \ 定义为 `_Complex`。标准委员会对引入新关键字持犹豫态度，因为这会使现有使用该单词作为标识符的代码失效。例如，在 C99 之前，许多程序员已经使用类似\
  \ `struct complex` 来定义一个表示复数或心理状态的结构。（正如第 14 章中讨论的，“结构和其他数据形式”，`struct` 关键字用于定义能够持有多个值的数据结构。）将\
  \ `complex` 变为关键字会使这些之前的用法变成语法错误。但人们使用 `struct _Complex` 的可能性小得多，尤其是因为以下划线开头的标识符应该是保留的。因此，委员会决定使用\
  \ `_Complex` 作为关键字，并为那些不需要担心与过去用法冲突的人提供了 `complex` 选项。\n\n### 基础类型之外\n\n基础数据类型的列表到此结束。对于你们中的人来说，这个列表似乎很长。另一些人可能在想需要更多类型。字符字符串类型呢？C\
  \ 没有这种类型，但它仍然可以很好地处理字符串。你将在第 4 章中首次接触字符串。\n\nC 确实有其他从基础类型派生的类型。这些类型包括数组、指针、结构和联合。虽然它们是后续章节的主题，但我们已经在本章的示例中“偷偷溜入”了一些指针。例如，*指针*指向变量或其他数据对象的位置。在\
  \ `scanf()` 函数中使用的 `&` 前缀创建了一个指针，告诉 `scanf()` 将信息放在哪里。\n\n## 总结：基础数据类型\n\n**关键字：**\n\
  \n基础数据类型使用 11 个关键字设置：`int`、`long`、`short`、`unsigned`、`char`、`float`、`double`、`signed`、`_Bool`、`_Complex`\
  \ 和 `_Complex`。（注：原文此处重复了两次 _Complex）\n\n**有符号整数：**\n\n这些可以有正值或负值。\n\n**无符号整数：**\n\
  \n这些只有零或正值。\n\n**字符：**\n\n这些是排版符号，如 `A`、`&` 和 `+`。\n\n**布尔：**\n\n布尔值表示 `true` 和\
  \ `false`；C 使用 `1` 表示 `true`，用 `0` 表示 `false`。\n\n**实浮点数：**\n\n这些可以有正值或负值。\n\n\n\
  \n\n虚类型是可选的。实部和虚部基于对应的实类型：\n\n![Image](img/squf.jpg) `float _Complex`\n\n![Image](img/squf.jpg)\
  \ `double _Complex`\n\n![Image](img/squf.jpg) `long double _Complex`\n\n![Image](img/squf.jpg)\
  \ `float _Imaginary`\n\n![Image](img/squf.jpg) `double _Imaginary`\n\n![Image](img/squf.jpg)\
  \ `long double _Imaginary`\n\n## 总结：如何声明简单变量\n\n1. 选择你需要的类型。\n2. 使用允许的字符为变量选择名称。\n\
  3. 使用以下格式进行声明语句：\n\n```\ntype-specifier variable-name;\n```\n\n`type-specifier`\
  \ 由一个或多个类型关键字组成；以下是声明的示例：\n\n```\nint erest;\nunsigned short cash;\n```\n\n4. 你可以通过用逗号分隔变量名来声明多个相同类型的变量。例如：\n\
  \n```\nchar ch, init, ans;\n```\n\n5. 你可以在声明语句中初始化变量：\n\n```\nfloat mass = 6.0E24;\n\
  ```\n\n## 类型大小\n\n你的系统使用什么类型大小？尝试运行列表 3.8 中的程序来查找。\n\n列表 3.8 typesize.c 程序\n\n点击此处查看代码图像\n\
  \n```c\n/* typesize.c -- 打印类型大小 */\n#include <stdio.h>\n\nint main(void)\n{\n  \
  \  /* c99 为大小提供了 %zd 格式说明符 */\n    printf(\"Type int has a size of %zd bytes.\\\
  n\", sizeof(int));\n    printf(\"Type char has a size of %zd bytes.\\n\", sizeof(char));\n\
  \    printf(\"Type long has a size of %zd bytes.\\n\", sizeof(long));\n    printf(\"\
  Type long long has a size of %zd bytes.\\n\",\n              sizeof(long long));\n\
  \    printf(\"Type double has a size of %zd bytes.\\n\",\n              sizeof(double));\n\
  \    printf(\"Type long double has a size of %zd bytes.\\n\",\n              sizeof(long\
  \ double));\n    return 0;\n}\n```\n\nC 有一个名为 `sizeof` 的内置运算符，它可以提供字节为单位的大小。C99\
  \ 和 C11 为 `sizeof` 使用的类型提供了 `%zd` 格式说明符。不符合标准的编译器可能需要使用 `%u` 或 `%lu`。以下是示例输出：\n\n\
  点击此处查看代码图像\n\nType int has a size of 4 bytes.\nType char has a size of 1 bytes.\n\
  Type long has a size of 8 bytes.\nType long long has a size of 8 bytes.\nType double\
  \ has a size of 8 bytes.\nType long double has a size of 16 bytes.\n\n此程序只找到了六种类型的大小，但你可以轻松修改它来查找你感兴趣的任何其他类型的大小。注意，`char`\
  \ 的大小必然是 1 字节，因为 C 通过 `char` 定义了 1 字节的大小。因此，在具有 16 位 `char` 和 64 位 `double` 的系统上，`sizeof`\
  \ 将报告 `double` 的大小为 4 字节。你可以检查 `limits.h` 和 `float.h` 头文件以获取关于类型限制的更多详细信息。（下一章将进一步讨论这两个文件。）\n\
  \n顺便提一下，注意最后几行中一个 `printf()` 语句是如何跨越两行的。只要换行没有发生在引号部分或单词中间，你就可以这样做。\n\n## 使用数据类型\n\
  \n在开发程序时，注意你需要的变量以及它们应该是什么类型。通常你可能可以使用 `int` 或可能的 `float` 处理数字，使用 `char` 处理字符。在这些变量的函数开头声明它们。为变量选择一个暗示其含义的名称。当你初始化变量时，使常量类型与变量类型匹配。这是一个示例：\n\
  \n点击此处查看代码图像\n\n```c\nint apples = 3;         /* 正确 */\nint oranges = 3.0;     \
  \ /* 格式不良 */\n```\n\nC 在类型不匹配方面的宽容度比，例如 Pascal 要宽。C 编译器允许第二种初始化，但它们可能会发出警告，特别是当你激活了较高的警告级别时。最好不要养成粗心的习惯。\n\
  \n当你将一种数值类型的变量初始化为不同类型的值时，C 会进行转换。\n\n## 参数与陷阱\n\n`printf()` 函数可以接受任意数量的参数。第一个参数是格式字符串，后续参数是与字符串中格式说明符对应的值。\n\
  \n\n\n\n请注意，使用 `%d` 显示 `float` 值并不会将 `float` 值转换为最接近的 `int`。此外，当参数过少或类型错误时，你得到的结果因平台而异，并可能每次运行都不同。\n\
  \n在我们尝试的所有编译器中，没有一个拒绝编译这段代码；尽管大多数编译器都发出了可能存在错误的警告。在我们运行程序时，也没有遇到任何报错。确实，某些编译器可能会检测到这类错误，但\
  \ C 标准并没有要求它们这样做。因此，计算机可能无法检测到这种错误，而且由于程序可能仍然运行正常，你可能也不会注意到这些错误。如果程序没有打印预期的数值，或者打印了意料之外的值，请检查你是否使用了正确数量的\
  \ `printf()` 参数。\n\n### 另一个示例：转义序列\n\n让我们运行另一个打印示例，这个示例使用了 C 语言中一些特殊的字符转义序列。特别是列表\
  \ 3.10 中的程序展示了退格（`\\b`）、制表符（`\\t`）和回车（`\\r`）是如何工作的。这些概念源于计算机使用电打字机输出的时代，它们并不总是能成功转换到现代图形界面。例如，列表\
  \ 3.10 在某些 Macintosh 实现上的运行并不如描述所示。\n\n列表 3.10 escape.c 程序\n\n点击此处查看代码图片\n\n```\n\
  /* escape.c -- 使用转义字符 */\n\n#include <stdio.h>\n\nint main(void)\n{\n    float salary;\n\
  \    printf(\"\\aEnter your desired monthly salary:\");/* 1 */\n    printf(\" $_______\\\
  b\\b\\b\\b\\b\\b\\b\");              /* 2 */\n    scanf(\"%f\", &salary);\n    printf(\"\
  \\n\\t$%.2f a month is $%.2f a year.\", salary,\n               salary * 12.0);\
  \                  /* 3 */\n    printf(\"\\rGee!\\n\");                        \
  \    /* 4 */\n    return 0;\n}\n```\n\n#### 程序运行时发生了什么\n\n让我们在一个转义字符按描述方式运行的系统中，逐步分析这个程序。（实际行为可能会不同。例如，XCode\
  \ 4.6 将 `\\a`、`\\b` 和 `\\r` 字符显示为倒置问号！）\n\n第一个 `printf()` 语句（编号为 `1` 的）发出警报信号（由\
  \ `\\a` 触发），然后打印以下内容：\n\n点击此处查看代码图片\n\nEnter your desired monthly salary:\n\n由于字符串末尾没有\
  \ `\\n`，光标停留在冒号之后。\n\n第二个 `printf()` 语句从第一个语句停止的地方开始，因此在完成后，屏幕显示如下：\n\n点击此处查看代码图片\n\
  \nEnter your desired monthly salary: $_______\n\n冒号和美元符号之间的空格是因为第二个 `printf()` 语句中的字符串是以空格开头的。七个退格字符的作用是将光标向左移动七个位置。这让光标退回到七个下划线字符，将光标直接放在美元符号之后。通常情况下，退格并不会删除经过的字符，但某些实现可能会使用破坏性退格，这使得这个小练习失去了意义。\n\
  \n此时，你输入了回复，例如 `4000.00`。现在这一行看起来像这样：\n\n点击此处查看代码图片\n\nEnter your desired monthly\
  \ salary: $4000.00\n\n你输入的字符替换了下划线字符，当你按下 Enter（或 Return）键输入回复时，光标移动到下一行的开头。\n\n\
  第三个 `printf()` 语句的输出以 `\\n\\t` 开始。换行符将光标移动到下一行的开头。制表符通常将光标移动到该行的下一个制表位，通常（但不一定）是第\
  \ 9 列。然后打印字符串的剩余部分。在该语句之后，屏幕显示如下：\n\n点击此处查看代码图片\n\nEnter your desired monthly salary:\
  \ $4000.00\n      $4000.00 a month is $48000.00 a year.\n\n由于 `printf()` 语句没有使用换行符，光标停留在最后一个句号之后。\n\
  \n第四个 `printf()` 语句以 `\\r` 开头。这把光标置于当前行的开头。然后在那里显示 `Gee!`，`\\n` 将光标移动到下一行。这是屏幕的最终外观：\n\
  \n点击此处查看代码图片\n\nEnter your desired monthly salary: $4000.00\n\nGee!    $4000.00\
  \ a month is $48000.00 a year.\n\n#### 刷新输出\n\n`printf()` 何时将输出发送到屏幕？最初，`printf()`\
  \ 语句将输出发送到一个名为*缓冲区*bufferbuffer 的中间存储区域。每隔一段时间，缓冲区中的内容就会发送到屏幕。C 关于输出从缓冲区发送到屏幕的标准非常明确：当缓冲区满、遇到换行符或即将有输入时进行发送。（将输出从缓冲区发送到屏幕称为*刷新缓冲区*flushing\
  \ the buffer.）例如，第一个 `printf()` 语句没有填充缓冲区也不包含换行符，但后面紧跟着一个请求输入的 `scanf()` 语句。这迫使\
  \ `printf()` 输出发送到屏幕。\n\n你可能会遇到较旧的实现，在那种实现中 `scanf()` 不强制刷新，这会导致程序在没有显示提示的情况下寻找输入。在这种情况下，你可以使用换行符来刷新缓冲区。代码可以修改为如下：\n\
  \n点击此处查看代码图片\n\n```\nprintf(\"Enter your monthly salary:\\n\");\nscanf(\"%f\", &salary);\n\
  ```\n\n无论即将发生的输入是否刷新缓冲区，这段代码都能工作。然而，它也将光标置于下一行，阻止了你在提示所在的同一行输入数据。另一种解决方案是使用第 13\
  \ 章中描述的 `fflush()` 函数，“文件输入输出](ch13.html_ch13)。”\n\n### 核心概念\n\nC 拥有大量的数字类型。这反映了\
  \ C 语言避免为程序员设置障碍的意图。C 没有规定（例如）一种整数类型就足够，而是尝试让程序员选择最符合特定程序需求的种类（有符号或无符号）和大小。\n\n\
  浮点数在计算机中与整数有本质区别。它们的存储和处理方式都不同。两个 32 位内存单元可能包含相同的位模式，但如果将一个解释为 `float` 另一个解释为 `long`，它们将代表完全不同且无关的值。例如，在\
  \ PC 上，如果你将代表 `float` 数字 256.0 的位模式解释为 `long` 值，你会得到 113246208。\n\n在计算机内存中，字符由数值代码表示。ASCII\
  \ 代码是最常用的，但 C 支持使用其他代码。字符常量是计算机系统所用数值代码的符号表示——它由包含在单引号中的字符组成，例如 `'A'`。\n\n\n\n\n\
  C 具有多种数据类型。基本类型分为两类：整数类型和浮点类型。整数类型的两个区分特征是分配给类型的存储空间大小以及它是符号的还是无符号的。最小的整数类型是 `char`，它可以根据实现的不同是有符号的或无符号的。你可以使用\
  \ `signed char` 和 `unsigned char` 来显式指定你想要的哪一种，但这通常在你使用该类型存储小整数而不是字符代码时才会。其他整数类型包括\
  \ `short`、`int`、`long` 和 `long long` 类型。C 保证这些类型中的每一种都至少与前一个类型一样大。它们每一个都是符号类型，但你可以使用\
  \ `unsigned` 关键字创建相应的无符号类型：`unsigned short`、`unsigned int`、`unsigned long` 和 `unsigned\
  \ long long`。或者你也可以添加 `signed` 修饰符来显式声明该类型是有符号的。最后是 `_Bool` 类型，这是一种无符号类型，能够存储 `0`\
  \ 和 `1` 值，分别代表 `false` 和 `true`。\n\n三种浮点类型是 `float`、`double` 以及自 C90 以来的 `long double`。每一种都至少与前一个类型一样大。可选地，实现可以通过结合\
  \ `_Complex` 和 `_Imaginary` 关键字与浮点类型关键字来支持复数和虚类型。例如，会有 `double _Complex` 类型和一个 `float\
  \ _Imaginary` 类型。\n\n整数可以用十进制、八进制或十六进制形式表示。开头的 `0` 表示八进制数，开头的 `0x` 或 `0X` 表示十六进制数。例如，`32`、`040`\
  \ 和 `0x20` 分是相同值的十进制、八进制和十六进制表示。后缀 `l` 或 `L` 表示 `long` 值，而 `ll` 或 `LL` 表示 `long\
  \ long` 值。\n\n字符常量通过将字符置于单引号中来表示，例如：`'Q'`、`'8'` 和 `'$'`。C 转义序列（如 `'\\n'`）表示某些非打印字符。你可以使用\
  \ `'\\007'` 形式通过其 ASCII 码表示一个字符。\n\n浮点数可以用固定小数点形式写，如 `9393.912`，也可以用指数计数法写，如 `7.38E10`。C99\
  \ 和 C11 提供了第三种使用十六进制数字和 2 的幂次的指数计数法，如 `0xa.1fp10`。\n\n`printf()` 函数允许你通过转换说明符来打印各种类型的值，这些说明符在最简单的形式由一个百分号和一个表示类型的字母组成，如\
  \ `%d` 或 `%f`。\n\n### 复习题\n\n你可以在附录 A 中的“复习题答案”中找到复习题的答案。\n\n**1.** 对于以下每种数据你会使用哪种数据类型（有时一种类型都是合适的）？\n\
