  \n### 编程练习题\n\n以下几个程序若干要求通过 `EOF` 终止输入。如果你的操作系统让重定向变得困难或无法实现，请使用其他终止输入的方法，例如读取 `&`\
  \ 字符。\n\n**1.** 设计一个程序，统计输入中直到文件末尾的字符数。\n\n**2.** 写一个程序，以字符流的形式读取输入直到遇到 `EOF`。让程序打印每个输入字符及其\
  \ ASCII 十进制值。注意，ASCII 序列中紧跟在空格字符之前的字符是非打印字符。对它们进行特殊处理。如果不可打印字符是换行符或制表符，分别打印 `\\\
  n` 或 `\\t`。否则，使用控制字符表示法。例如，ASCII 1 是 `Ctrl+A`，可以显示为 `^A`。注意，`A` 的 ASCII 值是 `Ctrl+A`\
  \ 的值加 64。其他不可打印字符也有类似的关系。每行打印 10 对，但每次遇到换行符时另起一行。（注意：操作系统可能对某些控制字符有特殊解释，并阻止它们到达程序。）\n\
  \n**3.** 写一个程序，以字符流的形式读取输入直到遇到 `EOF`。让它报告输入中大写字母的数量、小写字母的数量以及其他字符的数量。你可以假设小写字母的数值是连续的，并假设大写字母也是如此。或者，为了更具可移植性，你可以使用\
  \ `ctype.h` 库中适当分类函数。\n\n**4.** 写一个程序，以字符流的形式读取输入直到遇到 `EOF`。让它报告每个单词的字母平均数。不要将空白字符视为单词中的字母。实际上，标点符号也不应该计入，但现在不用担心那个。（如果你确实想考虑，可以考虑使用\
  \ `ctype.h` 族中的 `ispunct()` 函数。）\n\n**5.** 修改 `8.4` 中的猜测程序（`ch08.html_04`），使其使用更智能的猜测策略。例如，让程序最初猜\
  \ 50，并询问用户是高、低还是正确。如果，比如猜低了，下一次猜测在 50 和 100 之间，以此此类推。使用二分查找策略。\n\n**6.** 修改 `8`\
  \ 中的 `get_first()` 函数（`ch08.html_08`），使其返回非空白字符。\n\n**7.** 修改第 7 章的练习 8（`ch07.html_07`），使菜单选项由字符代替数字；使用\
  \ `q` 代替 `5` 作为终止信号。\n\n**8.** 写一个程序，显示一个提供加、减、乘、除选择菜单。获取选择后，程序询问两个数字，然后执行请求的操作。它应该只接受提供的选项。使用\
  \ `float` 处理数字，并在输入失败时允许用户重试。在除法的情况下，如果第二个数字输入 0，程序应提示用户输入新值。典型的程序运行如下：\n\n```\n\
  Enter the operation of your choice:\na. add\ns. subtract\nm. multiply\nd. divide\n\
  q. quit\na\nEnter first number: 22.4\nEnter second number: one\none is not an number\n\
  Please enter a number, such as 2.5, -1.78E8, or 3: 1\n22.4 + 1 = 23.4\nEnter the\
  \ operation of your choice:\na. add\ns. subtract\nm. multiply\nd. divide\nq. quit\n\
  d\nEnter first number: 18.4\nEnter second number: 0\nEnter a number other than 0:\
  \ 0.2\n18.4 / 0.2 = 92\nEnter the operation of your choice:\na. add\ns. subtract\n\
  m. multiply\nd. divide\nq. quit\nq\nBye.\n```\n\n\n\n\n\n你如何组织一个程序？C 语言的设计哲学是使用函数作为构建模块。我们已经依赖标准\
  \ C 库中提供的如 `printf()`、`scanf()`、`getchar()`、`putchar()` 和 `strlen()` 等函数。现在，我们准备好承担更主动的角色了——创建我们自己的函数。你已经在之前的章节中预览了该过程的几个方面，本章将整合你之前的信息并对其进行扩展。\n\
  \n## 复习函数\n\n首先，什么是函数？`function` 是一个自包含的程序代码单元，用于完成特定的任务。语法规则定义了函数的结构以及如何使用它。C 语言中的函数的作用与其他语言中的函数、子程序和过程的作用相同，尽管细节可能有所不同。某些函数会触发动作的发生。例如，`printf()`\
  \ 会导致数据打印在你的屏幕上。某些函数为程序查找一个值。例如，`strlen()` 告诉程序某个字符串的长度。总的来说，函数既可以产生动作，也可以提供值。\n\
  \n为什么要使用函数？首先，它们可以让你避免重复性的编程工作。如果你需要在程序中多次执行某项任务，你只需要编写一次合适的函数。程序可以在任何需要的地方使用该函数，或者你可以在不同的程序中使用同一个函数，就像你在许多程序中使用\
  \ `putchar()` 一样。此外，即使你只在一个程序中执行一次某项任务，使用函数也是值得的，因为它使程序更具模块化，因此更容易阅读、更容易修改或修复。例如，假设你想编写一个执行以下操作的程序：\n\
  \n![Image](img/squf.jpg) 读取数字列表\n\n![Image](img/squf.jpg) 对数字进行排序\n\n![Image](img/squf.jpg)\
  \ 找到它们的平均值\n\n![Image](img/squf.jpg) 打印条形图\n\n你可以使用这个程序：\n\n点击此处查看代码图像\n\n```c\n\
  #include <stdio.h>\n\n#define SIZE 50\n\nint main(void)\n{\n  float list[SIZE];\n\
  \  readlist(list, SIZE);\n  sort(list, SIZE);\n  average(list, SIZE);\n  bargraph(list,\
  \ SIZE);\n  return 0;\n}\n```\n\n当然，你还需要编写这四个函数 `readlist()`、`sort()`、`average()`\
  \ 和 `bargraph()`——这些仅仅是细节。描述性的函数名称可以清楚地说明程序在做什么以及它是如何组织的。你可以单独处理每个函数，直到它正确工作，如果你把函数写得足够通用，你就可以在其他程序中复用它们。\n\
  \n许多程序员喜欢将函数想象成一个“黑盒”，根据输入的信息（其输入）以及它产生的值或动作（其输出）来定义。黑盒内部发生了什么与你无关，除非你是那个必须编写函数的人。例如，当你使用\
  \ `printf()` 时，你知道必须给它一个控制字符串，可能可能还有一些参数。你还知道 `printf()` 应该产生什么输出。你不需要思考用于创建 `printf()`\
  \ 的背后的编程工作。以这种方式思考函数可以帮助你关注程序的整体设计，而不是细节。在担心编写代码之前，仔细考虑函数应该做什么，以及它与整个程序有什么联系。\n\n\
  关于函数你需要了解什么？你需要知道如何正确地定义它们，如何调用它们使用，以及如何建立函数之间的通信。为了唤起你对这些点的记忆，我们将从一个非常简单的示例开始，然后引入更多功能，直到你了解整个故事。\n\
  \n### 创建和使用简单函数\n\n我们谦虚的首要目标是创建一个打印 40 个星号的函数。为了给函数提供一个上下文，让我们在一个打印简单信头的程序中使用它。列表\
  \ 9.1 展示了完整的程序。它由 `main()` 函数和 `starbar()` 两个函数组成。\n\n列表 9.1 lethead1.c 程序\n\n点击此处查看代码图像\n\
  \n```c\n/* lethead1.c */\n#include <stdio.h>\n\n#define NAME \"GIGATHINK, INC.\"\
  \n#define ADDRESS \"101 Megabuck Plaza\"\n#define PLACE \"Megapolis, CA 94904\"\n\
  #define WIDTH 40\n\nvoid starbar(void);  /* 函数原型声明 */\n\nint main(void)\n{\n  starbar();\n\
  \  printf(\"%s\\n\", NAME);\n  printf(\"%s\\n\", ADDRESS);\n  printf(\"%s\\n\",\
  \ PLACE);\n  starbar();      /* 使用函数      */\n  return 0;\n}\n\nvoid starbar(void)\
  \   /* 定义函数     */\n{\n  int count;\n  for (count = 1; count <= WIDTH; count++)\n\
  \    putchar('*');\n  putchar('\\n');\n}\n```\n\n输出如下：\n\n点击此处查看代码图像\n\n```\n****************************************\n\
  GIGATHINK, INC.\n101 Megabuck Plaza\nMegapolis, CA 94904\n****************************************\n\
  ```\n\n## 分析程序\n\n关于这个程序有几个需要注意的大点：\n\n![Image](img/squf.jpg) 它在三个不同的上下文未使用 `starbar`：*函数原型*告诉编译器\
  \ `starbar` 是什么样的函数，*函数调用*导致函数执行，而*函数定义*指定了函数做什么。\n\n![Image](img/squf.jpg) 像变量一样，函数也有类型。任何使用函数的程序都应该声明函数的类型。因此，这个\
  \ ANSI 原型出现在 `main()` 函数定义之前：\n\n```c\nvoid starbar(void);\n```\n\n括号表示 `starbar`\
  \ 是函数名。第一个 `void` 是函数类型；`void` 类型表示该函数不返回值。第二个 `void`（括号中的那个）表示该函数没有参数。分号表示你正在声明函数，而不是定义它。\n\
  \n注意某些非常老的编译器不识别 `void` 类型。在这种情况下，对于没有返回值的函数使用 `int`。并考虑换一个世纪的编译器。\n\n![Image](img/squf.jpg)\
  \ 通常，原型指定了函数返回类型以及它期望的参数类型。这些信息合称为函数的*签名*（signature）。在这个特定情况下，签名是函数没有返回值且没有参数。\n\
  \n![Image](img/squf.jpg) 程序在 `main()` 之前放置 `starbar()` 原型；相反，它可以放在 `main()` 内部，就在你放置任何变量声明的位置。这两种方式都是可以。\n\
  \n![Image](img/squf.jpg) 程序通过使用其名称后跟括号和分号从 `main()` 调用（激活、召唤）`starbar()` 函数，从而创建了语句\n\
  \n```c\nstarbar();\n```\n\n这是调用 `void` 类型函数的格式。每当计算机遇到 `starbar();` 语句时，它就会查找 `starbar()`\
  \ 函数并遵循那里的指令。当完成 `starbar()` 内部的代码后，计算机返回到*调用函数*的下一行——在本例中是 `main()`（参见图 9.1）。（更准确地说，编译器将\
  \ C 程序翻译成机器语言代码，以这种方式运行。）\n\n![Image](img/09fig01.jpg)\n\n图 9.1 `lethead1.c` 的控制流（列表\
  \ 9.1）。\n\n\n\n\n\n![Image](img/squf.jpg) 程序在定义 `starbar()` 时的形式与定义 `main()` 时相同。它以类型、名称和括号开始。然后它提供了左大括号、所用变量的声明、函数的定义语句，最后是右括号（参见图\
  \ 9.2）。注意，这个 `starbar()` 实例后面没有分号。缺少分号告诉编译器你正在定义 `starbar()`，而不是在调用它或对其进行原型声明。\n\
  \n![Image](img/09fig02.jpg)\n\n图 9.2 简单函数的结构。\n\n![Image](img/squf.jpg) 程序将 `starbar()`\
  \ 和 `main()` 包含同一个文件中。你也可以使用两个独立的文件。单文件形式稍微更容易编译。两个独立的文件使得在不同程序中使用同一个函数变得更简单。如果你确实将函数放在单独的文件中，你还需要在该文件中放置必要的\
  \ `#define` 和 `#include` 指令。我们稍后会讨论使用两个或多个文件的情况。现在，我们将所有函数都放在在一个文件中。`main()` 的右括号告诉编译器该函数何时结束，随后的\
  \ `starbar()` 头部告诉编译器 `starbar()` 是一个函数。\n\n![Image](img/squf.jpg) `starbar()` 中的变量\
  \ `count` 是一个 `local`（局部）变量。这意味着它只对 `starbar()` 可用。你可以在其他函数（包括 `main()`）中使用名称 `count`，而不会发生冲突。你只是得到了几个具有同名的独立、独立的变量。\n\
  \n如果你将 `starbar()` 视为一个黑盒，它的作用是打印一行星号。它没有任何输入，因为它不需要使用来自调用泛的任何信息。它没有向 `main()` 提供（或返回）任何信息，因此\
  \ `starbar()` 没有返回值。简而言之，`starbar()` 不需要与调用函数进行任何通信。\n\n让我们创建一个需要通信的案例。\n\n### 函数参数\n\
  \n之前显示的信头如果文本是居中的，看起来会更好看。你可以通过在打印文本之前打印正确数量的前导空格来实现文本居中。这与 `starbar()` 函数类似，它打印了特定数量的星号，但现在你想打印特定数量的空格。我们不会为每个任务编写单独的函数，而是编写一个更通用的单一函数来完成这两项任务。我们将新函数命名为\
  \ `show_n_char()`（建议显示字符 `n` 次）。唯一的变化是，不再使用内置值作为显示字符和重复次数，`show_n_char()` 将使用函数参数来传递这些值。\n\
  \n让我们来看更具体的。考虑可用空间宽度恰好为 40 个字符。星号线宽度为 40 个字符，刚好适应，函数调用 `show_n_char('*', 40)` 应该打印出结果，就像之前的\
  \ `starbar()` 做的那样。那么居中 `GIGATHINK, INC` 的空格呢？`GIGATHINK, INC.` 宽度为 15 个空格，因此在第一个版本中，标题后面有\
  \ 25 个空格。为了让它居中，你应该以 12 个空格开头，这将导致短语的一侧有 12 个空格，另一侧有 13 个空格。因此，你可以使用调用 `show_n_char('\
  \ ', 12)`。\n\n除了使用参数外，`show_n_char()` 函数与 `starbar()` 非常相似。不同之处在于它不会像 `starbar()`\
  \ 那样添加换行，因为你可能想在同一行上打印其他文本。列表 9.2 显示了修改后的程序。为了强调参数的工作原理，程序使用了多种参数形式。\n\n列表 9.2 lethead2.c\
  \ 程序\n\n点击此处查看代码图像\n\n```c\n/* lethead2.c */\n\n#include <stdio.h>\n#include <string.h>\
  \               /* 用于 strlen() */\n#define NAME \"GIGATHINK, INC.\"\n#define ADDRESS\
  \ \"101 Megabuck Plaza\"\n#define PLACE \"Megapolis, CA 94904\"\n#define WIDTH 40\n\
  #define SPACE ' '\n\nvoid show_n_char(char ch, int num);\n\nint main(void)\n{\n\
  \    int spaces;\n    show_n_char('*', WIDTH);   /* 使用常量作为参数 */\n    putchar('\\\
  n');\n    show_n_char(SPACE, 12);    /* 使用常量作为参数 */\n    printf(\"%s\\n\", NAME);\n\
  \    spaces = (WIDTH - strlen(ADDRESS)) / 2;\n                                /*\
  \ 让程序计算 */\n                                /* 跳过多少空格 */\n    show_n_char(SPACE,\
  \ spaces);/* 使用变量作为参数 */\n    printf(\"%s\\n\", ADDRESS);\n    show_n_char(SPACE,\
  \ (WIDTH - strlen(PLACE)) / 2); /* 表达式作为参数 */\n    printf(\"%s\\n\", PLACE);\n \
  \   show_n_char('*', WIDTH);\n    putchar('\\n');\n    return 0;\n}\n/* show_n_char()\
  \ 定义 */\nvoid show_n_char(char ch, int num)\n{\n    int count;\n    for (count =\
  \ 0; count < num; count++)\n        putchar(ch);\n}\n```\n这里是运行程序的结果：\n\n点击此处查看图像\n\
  \n***\n************************\nGIGATHINK, INC.\n101 Megabuck Plaza\n  Megapolis,\
  \ CA 94904\n************************\n\n现在让我们看看如何设置一个带有参数的函数。\n\n### 带参数的函数定义\n\n\
  该函数以以下 ANSI C 头部开始：\n\n点击此处查看图像\n\n```c\nvoid show_n_char(char ch, int num)\n```\n\
  \n这一行告知编译器 `show_n_char()` 使用两个参数 `ch` 和 `num`，`ch` 类型为 `char`，而 `num` 类型为 `int`。这些\
  \ `ch` 和 `num` 变量被称为 `formal arguments`（形式参数）或（目前的）`formal parameters`（形式参数）。与函数内部定义的变量一样，形式参数是局部变量，仅对函数可见。每次调用函数时，这些变量都会赋值。\n\
  \n\n\n\n当函数带有参数时，原型通过使用逗号分隔的类型列表来指示这些参数的数量和类型。如果你愿意，可以在原型中省略变量名：\n\n```c\nvoid show_n_char(char,\
  \ int);\n```\n\n在原型中使用变量名并不会实际创建变量。它仅仅是澄清了 `char` 表示一个 `char` 变量这一事实，以此类推。\n\n同样，ANSI\
  \ C 也识别较旧的函数声明形式，即不带参数列表：\n\n```c\nvoid show_n_char();\n```\n\n这种形式最终将从标准中删除。即使不会被删除，原型格式也是一种更好的设计，正如你稍后看到的。你需要了解这种形式的主要原因是，以便当你在旧代码中遇到它时，能够识别并理解它。\n\
  \n### 带参数调用函数：实参参数\n\n你通过在函数调用中使用*实际参数*（actual arguments）来给 `ch` 和 `num` 赋值。考虑 `show_n_char()`\
  \ 的第一次使用：\n\n```c\nshow_n_char(SPACE, 12);\n```\n\n实际参数是空格字符和 `12`。这些值被分配给 `show_n_char()`\
  \ 中对应的形式参数——变量 `ch` 和 `num`。简而言之，形式参数是被调用函数中的变量，而实际参数是调用函数分配给函数变量的特定值。如示例所示，实际参数可以是常量、变量，甚至是一个复杂的表达式。无论它是哪种，实际参数都会被求值，并且其值会被复制到函数对应的形式参数中。例如，考虑\
  \ `show_n_char()` 的最后一次使用：\n\n点击查看代码图像\n\n```c\nshow_n_char(SPACE, (WIDTH - strlen(PLACE))\
  \ / 2);\n```\n\n构成第二个实际参数的长表达式被求值为 `10`。然后，值 `10` 被分配给变量 `num`。函数既不知道也不在乎那个数字是来自常量、变量还是更通用的表达式。再次，实际参数是分配给称为形式参数变量的特定值（参见图\
  \ 9.3）。由于被调用函数使用的是从调用函数复制的数据，因此调用函数中的原始数据免受被调用函数对副本进行任何操作的影响。\n\n![Image](img/09fig03.jpg)\n\
  \n图 9.3 形式参数和实际参数。\n\n***\n\n注意：实际参数和形式参数\n\n实际参数是出现在函数调用括号中的表达式。形式参数是在函数定义头中声明的变量。当函数被调用时，声明为形式参数的变量会被创建并初始化为通过求值实际参数得到的值。在列表\
  \ 9.2 中，`'*'` 和 `WIDTH` 是第一次调用 `show_n_char()` 时的实际参数，而 `SPACE` 和 `11` 是第二次调用该函数的实际参数。在函数定义中，`ch`\
  \ 和 `num` 是形式参数。\n\n***\n### 黑盒视角\n\n从 `show_n_char()` 的黑盒视角来看，输入是要显示的字符和要跳过的空格数。结果操作是按指定的次数打印字符。输入通过参数传递给函数。这些信息足以告诉你如何在\
  \ `main()` 中使用该函数。此外，它还可以作为编写函数的设计规范。\n\n`ch`、`num` 和 `count` 是 `show_n_char()`\
  \ 函数私有的局部变量，这一事实是黑盒方法的一个重要方面。如果你在 `main()` 中使用相同的变量，它们将是分开且独立的变量。也就是说，如果 `main()`\
  \ 有 `count` 变量，改变它的值不会改变 `show_n_char()` 中 `count` 的值，反之亦然。黑盒内部发生的情况对调用函数是隐藏的。\n\
  \n### 使用 return 从函数返回值\n\n你已经看到如何从调用函数向被调用函数传递信息。要从相反方向发送信息，你需要使用函数的返回值。为了复习它的工作原理，我们将构造一个返回两个参数中较者的函数。我们将该函数命名为\
  \ `imin()`，因为它设计用于处理 `int` 值。此外，我们创建一个简单的 `main()`，其唯一目的是检查 `imin()` 是否有效。这种用于测试函数的程序有时被称为*驱动程序*（driver）。驱动程序对某个函数进行测试。如果函数运行良好，就可以将其安装到更具意义的程序中。列表\
  \ 9.3 显示了驱动程序和最小值函数。\n\n列表 9.3 lesser.c 程序\n\n点击查看代码图像\n\n***\n\n```c\n/* lesser.c\
  \ -- 寻找两个恶行中较小的一个 */\n\n#include <stdio.h>\n\nint imin(int, int);\n\nint main(void)\n\
  {\n    int evil1, evil2;\n    printf(\"Enter a pair of integers (q to quit):\\n\"\
  );\n    while (scanf(\"%d %d\", &evil1, &evil2) == 2)\n    {\n        printf(\"\
  The lesser of %d and %d is %d\\n\", evil1, evil2, imin(evil1, evil2));\n    }\n\
  \    if (evil1 == 'q')\n    {\n        printf(\"Bye.\\n\");\n    }\n    return 0;\n\
  }\n\nint imin(int n, int m)\n{\n    int min;\n    if (n < m)\n        min = n;\n\
  \    else\n        min = m;\n    return min;\n}\n```\n\n\n\n然后，实际的返回值将是你将指示的返回值赋值给声明的返回类型的变量时所得到的值。因此，在这个示例中，最终效果等同于将\
  \ `z` 的值赋值给一个 `int` 变量，然后返回该值。例如，假设我们有如下函数调用：\n\n```\nresult = what_if(64);\n```\n\
  \n此时 `z` 被赋值为 `1.5625`。然而，`return` 语句返回的是 `int` 类型的值 `1`。\n\n使用 `return` 还有另一个作用。它会终止函数并将控制权交回调用函数中的下一个语句。即使\
  \ `return` 语句不是函数的最后一行，也会发生这种情况。因此，你可以这样写 `imin()`：\n\n点击此处查看图像\n\n```c\n/* 最小值函数，第三版本\
  \ */\n\nimin(int n,int m)\n{\n    if (n < m)\n        return n;\n    else\n    \
  \    return m;\n}\n```\n\n许多 C 语言学者（但并非所有人）认为，最好在函数末尾只使用一次 `return`，以便别人更容易跟踪函数中的控制流。然而，在像这样这么短的函数中使用中使用多个\
  \ `return` 并不是什么大罪。无论如何，对用户来说，三个版本都是相同的，因为它们都接受相同的输入并产生相同的输出。只是内部实现不同。即使这个版本效果也一样：\n\
  \n点击此处查看图像\n\n```c\n/* 最小值函数，第四版本 */\n\nimin(int n, int m)\n{\n    if (n < m)\n\
  \        return n;\n    else\n        return m;\n\n    printf(\"Professor Fleppard\
  \ is like totally a fopdoodle.\\n\");\n}\n```\n\n`return` 语句阻止了 `printf()` 语句的执行。Fleppard\
  \ 教授可以在他自己的程序中使用该函数的编译版本，而永远无法得知他学生程序员的真实想法。\n\n你也可以使用如下这样的语句：\n\n```\nreturn;\n\
  ```\n\n它会导致函数终止并将控制权返回给调用函数。由于 `return` 后面没有表达式，因此不会返回任何值，这种形式应仅用于类型为 `void` 的函数。\n\
  \n### 函数类型\n\n函数应该按类型声明。带有返回值的函数其声明类型应与返回值的类型相同。没有返回值的函数应声明为 `void` 类型。如果没有给函数指定类型，旧版本的\
  \ C 语言会假设该函数是 `int` 类型。这种约定源于 C 语言的早期，那时大多数函数本身就是 `int` 类型。然而，C99 标准取消了对这种 `int`\
  \ 隐式类型假设的支持。\n\n类型声明是函数定义的一部分。请记住，它指的是返回值，而不是函数的参数。例如，接下来的函数头表示你正在定义一个接受两个 `int`\
  \ 类型参数但返回 `double` 类型值的函数：\n\n```\ndouble klink(int a, int b)\n```\n\n为了正确地使用函数，程序需要在第一次使用函数之前知道该函数的类型。实现这一点的某种方法是将完整的函数定义放在其首次使用之前。然而，这种方法可能会让程序更难读。此外，函数可能是\
  \ C 语言库的一部分，或者位于其他文件中。因此，你通常通过预先声明函数来告知编译器。例如，列表 9.3 中的 `main()` 函数包含了这些行：\n\n点击此处查看图像\n\
  \n```c\n#include <stdio.h>\n\nint imin(int, int);\n\nint main(void)\n{\n    int\
  \ evil1, evil2, lesser;\n```\n\n第二行确定了 `imin` 是一个函数名，它有两个 `int` 参数并返回一个 `int` 类型的值。现在，编译器知道当\
  \ `imin()` 在程序后面出现时该如何处理它。\n\n我们将这些提前函数声明放置在使用它们的函数外部。它们也可以放在函数内部。例如，你可以如下重写 `lesser.c`\
  \ 的开头：\n\n点击此处查看图像\n\n```c\n#include <stdio.h>\n\nint main(void)\n{\n    int imin(int,\
  \ int);      /* imin() 声明 */\n    int evil1, evil2, lesser;\n```\n\n无论哪种情况，你主要关心的应该是函数声明出现在函数使用之前。\n\
  \n在 ANSI C 标准库中，函数被分为若干族，每个族都有自己的头文件。这些头文件包含了该族中函数的声明等。例如，`stdio.h` 头文件包含了标准 I/O\
  \ 库函数的声明，如 `printf()` 和 `scanf()`。\n\n### ANSI C 函数原型（Prototing）\n\n传统的、ANSI C 之前的方案是有缺陷的，因为它只声明了函数的返回类型，而没有声明其参数。让我们看看使用旧形式时会出现什么样的问题。\n\
  \n#### 问题\n\n让我们看看列表 9.4，它显示了一个以旧式方法声明 `imax()` 的程序。\n\nListing 9.4 misuse.c\n\n\
  点击此处查看图像\n\n```c\n* *\n/* misuse.c -- 错误使用函数 */\n#include <stdio.h>\n\nint main(void)\n\
  {\n    printf(\"The maximum of %d and %d is %d.\\n\", 3, 5, imax(3));\n    printf(\"\
  The maximum of %d and %d is %d.\\n\", 3, 5, imax(3.0, 5.0));\n    return 0;\n}\n\
  \nint imax(n, m)\nint n, m;\n{\n    return (n > m ? n : m);\n}\n* *\n```\n\n第一个\
  \ `printf()` 调用漏掉了 `imax()` 的一个参数，而第二次调用使用了浮点数参数而不是整数。尽管存在这些错误，程序仍然编译并运行。这里是 Xcode\
  \ 4.6 的示例输出：\n\n点击此处查看图像\n\nThe maximum of 3 and 5 is 1606416656.\n\nThe maximum\
  \ of 3 and 5 is 3886.\n\n使用 gcc 运行的示例产生了 1359379472 和 1359377160。这两个编译器工作正常；它们仅仅是程序未能使用函数原型的受害者。\n\
  \n发生了什么？机制在不同系统之间可能不同，但在 PC 或 VAX 上的情况是这样的：调用函数将其参数放在一个名为*栈*（stack）的临时存储区域中，被调用函数从栈中读取这些参数。这两个过程之间*并不协调*。调用函数根据调用中的实际参数来决定传递什么类型，而被调用函数根据其形式参数的类型来读取值。\n\
  \n\n\n\n示例第二次使用 `imax()` 时，它向 `imax()` 传递了 `float` 类型的值。这在栈上放置了两个 `double` 值。（记住，当\
  \ `float` 作为参数传递时，会被提升为 `double`。）在我们的系统上，这意味着两个 64 位的值，因此在栈上放置了 128 位的数据。当 `imax()`\
  \ 从栈上读取两个 `int` 时，它读取的是栈上的前 64 位，因为在我们的系统上，每个 `int` 是 32 位。这些位恰好对应于两个整数值，其中较大的一个是\
  \ 3886。\n\n## ANSI C 解决方案\n\nANSI C 标准对参数不匹配问题的解决方案是允许函数声明也声明变量类型。其结果是一个*函数原型*（function\
  \ prototype）——一种声明了返回类型、参数个数以及这些参数类型的声明。要指示 `imax()` 需要两个 `int` 参数，你可以使用以下两种原型之一来声明它：\n\
  \n点击此处查看代码图像\n\n```\nint imax(int, int);\n\nint imax(int a, int b);\n```\n\n第一种形式使用逗号分隔的类型列表。第二种在类型后添加了变量名。记住，变量名是虚拟名称，不需要与函数定义中使用的名称匹配。\n\
  \n有了这些信息，编译器就可以检查函数调用是否与原型匹配。参数的个数是否正确？类型是否正确？如果存在类型不匹配且两种类型都是数字，编译器会将实际参数的值转换为与形式参数相同的类型。例如，`imax(3.0,\
  \ 5.0)` 变变为 `imax(3, 5)`。我们已经修改了列表 9.4 以使用函数原型。结果显示在列表 9.5 中。\n\n### 列表 9.5 proto.c\
  \ 程序\n\n点击此处查看代码图像\n\n```c\n/* proto.c -- 使用函数原型 */\n\n#include <stdio.h>\n\nint\
  \ imax(int, int);      /* 原型 */\n\nint main(void)\n{\n    printf(\"The maximum of\
  \ %d and %d is %d.\\n\",\n               3, 5, imax(3));\n    printf(\"The maximum\
  \ of %d and %d is %d.\\n\",\n               3, 5, imax(3.0, 5.0));\n    return 0;\n\
  }\n\nint imax(int n, int m)\n{\n    return (n > m ? n : m);\n}\n```\n\n当我们尝试编译列表\
  \ 9.5 时，我们的编译器给了一个错误信息，说明对 `imax()` 的调用参数太少。\n\n类型错误呢？为了调查这些错误，我们将 `imax(3)` 替换为\
  \ `imax(3, 5)` 并再次尝试编译。这次没有了错误信息，我们运行了程序。以下是输出结果：\n\n点击此处查看代码图像\n\n3 和 5 的最大值是 5。\n\
  \n3 和 5 的最大值是 5。\n\n正如承诺的那样，第二次调用中的 `3.0` 和 `5.0` 被转换为 `3` 和 `5`，以便函数能够正确处理输入。\n\
  \n尽管没有给出错误信息，但我们的编译器确实给警告，说明 `double` 被转换为了 `int`，并且可能会丢失数据。例如，调用\n\n`imax(3.9,\
  \ 5.4)`\n\n等同于以下内容：\n\n`imax(3, 5)`\n\n错误和警告之间的区别在于，错误会阻止编译，而警告允许编译。某些编译器会在不通知你的情况下进行这种类型强制转换。这是因为标准并没有要求提供警告。然而，许多编译器允许你选择一个警告级别，以控制编译器发布警告的详尽程度。\n\
  \n## 无参数和未指定的参数\n\n假设你给出了如下这样的原型：\n\n```c\nvoid print_name();\n```\n\nANSI C 编译器将假设你已经放弃了函数原型，它将不会检查参数。要指示一个函数确实没有参数，请在括号内使用\
  \ `void` 关键字：\n\n```c\nvoid print_name(void);\n```\n\nANSI C 将前述表达式解释为 `print_name()`\
  \ 不接受任何参数。然后它会检查你在调用此函数时确实没有使用参数。\n\n少数函数（例如 `printf()` 和 `scanf()`）接受可变数量参数。在 `printf()`\
  \ 中，第一个参数是字符串，但其余参数在类型和数量上都没有固定。ANSI C 允许此类情况下的部分原型设计。例如，你可以为 `printf()` 使用此原型：\n\
  \n```c\nint printf(const char *, ...);\n```\n\n此原型表示第一个参数是字符串（第 11 章，“字符字符串与字符串函数”中详细阐述了这一点），并且可能存在进一步的性质未指定的参数。\n\
  \nC 库通过 `stdarg.h` 头文件提供了这些支持。\n\n## 原型的强大之处\n\n原型是强大的工具。它们允许编译器在编译阶段发现许多错误。如果没有原型，错误可能只有在运行时才会发现，这使得调试变得异常困难。原型可以确保函数调用与函数定义之间的一致性。在大型项目中，这种一致至关重要，因为函数可能定义在不同的文件中。\n\
  \n通过原型，开发者可以清楚地了解如何调用函数，而无需查看具体的实现。这提高了代码的可读性和可维护性。\n\n## 递归\n\n递归是指函数调用它自身的现象。递归是解决许多问题的一种强大方法，可以将复杂问题分解为更小的、相同的子问题。一个递归函数通常包含两个部分：基本情况（base\
  \ case）和递归步骤。基本情况至关重要，因为它防止了无限递归导致栈溢出。一个经典的递归例子是计算阶乘：\n\n```c\nint factorial(int\
  \ n)\n{\n    if (n <= 1)\n        return 1;\n    else\n        return n * factorial(n\
  \ - 1);\n}\n```\n\n在这个例子中，`factorial(3)` 会调用 `factorial(2)`，后者又调用 `factorial(1)`，最后\
  \ `factorial(1)` 返回 1，然后结果层层返回，最终计算出 6。虽然递归非常优雅，但有时循环更加高效，因为每次递归调用都会消耗栈空间。\n\n\n\
  \n\n# 层 2：`n` 位置 0x0012ff3c\n# 层 1：`n` 位置 0x0012ff48\n\n让我们追踪一下程序，看看递归是如何工作的。首先，`main()`\
  \ 调用 `up_and_down()` 并传入参数 `1`。结果是，`up_and_down()` 中的形式参数 `n` 值为 `1`，因此打印语句 #1 输出了\
  \ `Level 1`。然后，由于 `n` 小于 `4`，`up_and_down()`（层 1）使用实际参数 `n + 1`（即 `2`）调用 `up_and_down()`（层\
  \ 2）。这导致层 2 调用中的 `n` 被赋值为 `2`，因此打印语句 #1 输出了 `Level 2`。同样地，接下来的两次调用将导致输出 `Level 3`\
  \ 和 `Level 4`。\n\n当到达层 4 时，`n` 等于 `4`，因此 `if` 测试失败。`up_and_down()` 函数不再被调用。相反，层\
  \ 4 的调用继续执行打印语句 #2，因为 `n` 是 `4`，它输出了 `LEVEL 4`。然后它到达了 `return` 语句。此时，层 4 调用结束，控制权传回给调用它的函数（层\
  \ 3 调用）。层 3 调用中执行的最后语句是 `if` 语句中对层 4 的调用。因此，层 3 继续执行接下来的语句，即打印语句 #2。这导致输出了 `LEVEL\
  \ 3`。然后层 3 结束，将控制权传递给层 2，层 2 输出 `LEVEL 2`，依此类推。\n\n注意，每一层递归都使用它们自己的私有变量 `n`。你可以通过查看地址值看出这一点。（当然，通常不同的系统会报告不同的地址，格式也可能不同。关键点是\
  \ `Level 1` 行上的地址与 `LEVEL 1` 行上的地址相同，依此类推。）\n\n如果你觉得这有点困惑，可以一下一下你有一个函数调用链时，例如 `fun1()`\
  \ 调用 `fun2()`，`fun2()` 调用 `fun3()`，`fun3()` 调用 `fun4()`。当 `fun4()` 完成时，它将控制权传回给\
  \ `fun3()`。当 `fun3()` 完成时，它将控制权传回给 `fun2()`。当 `fun2()` 完成时，它将控制权传回给 `fun1()`。递归的情况也是一样，只不过\
  \ `fun1()`、`fun2()`、`fun3()` 和 `fun4()` 都是同一个函数。\n\n## 递归基础\n\n递归起初可能会让人困惑，所以让我们来看几个有助于你理解这一过程的基本要点。\n\
  \n首先，每一层函数调用都有自己的变量。也就是说，层 1 的 `n` 与层 2 的 `n` 是不同的变量，因此程序创建了四个独立的变量，每个都叫 `n`，但每个都有不同的值。当程序最终返回到\
  \ `up_and_down()` 的第一层调用时，原始的 `n` 仍然保持其初始时的值 `1`（参见图 9.4）。\n\n![图像](img/09fig04.jpg)\n\
  \n图 9.4 递归变量。\n\n其次，每个函数调用都有一个对应的返回（return）。当程序流到达最后一个递归层末尾的 `return` 时，控制权会传递到上一个递归层。程序不会直接跳回\
  \ `main()` 中的原始调用。相反，程序必须穿过每一个递归层层返回，从一层 `up_and_down()` 返回到调用它的那层 `up_and_down()`。\n\
  \n第三，递归函数中位于递归调用之前的语句是按照函数调用的相同顺序执行的。例如，在代码列表 9.6 中，打印语句 #1 位于递归调用之前。它按照递归调用的顺序执行了四次：层\
  \ 1、层 2、层 3 和层 4。\n\n第四，递归函数中位于递归调用之后的语句，其执行顺序与函数调用的顺序**相反**。例如，打印语句 #2 位于递归调用之后，它的执行顺序是：层\
  \ 4、层 3、层 2、层 1。递归的这一特性对于涉及顺序反转的编程问题很有用。你很快就会看到例子。\n\n第五，虽然每一层递归都有自己的一组变量，但代码本身并没有重复。代码是一系列指令，而函数调用是跳转到该系列指令开头的命令。那么，递归调用会将程序带回该指令集的开头。除了递归调用会在每次调用时创建新变量外，它们非常像循环。事实上，有时递归可以代替循环，反之亦然。\n\
  \n最后，递归函数必须包含某种能停止递归调用序列的内容，这是至关重要的。通常，递归函数使用 `if` 测试或等效机制，在函数参数达到特定值时终止递归。为了使此机制生效，每次调用需要为参数使用不同的值。例如，在上一个例子中，`up_and_down(n)`\
  \ 调用了 `up_and_down(n+1)`。最终，实际参数达到了值 `4`，导致 `if (n == 4)` 失败。\n\n## 尾递归\n\n在最简单的形式中，递归调用位于函数的末尾，紧接\
  \ `return` 语句之前。这被称为*尾递归*，或者*末递归*，因为递归调用发生在函数的最后。尾递归的形式像循环。让我们看看一个循环版本和一个尾递归版本来计算阶乘。一个整数的阶乘是从\
  \ 1 到该数字的乘积。例如，`3!` 是 `1*2*3`。此外，`0!` 被视为 1，且对负数没有定义阶乘。代码列表 9.7 展示了一个使用 `for` 循环的版本和一个使用递归的版本。\n\
  \n点击查看代码图像\n\n```c\n// factor.c 使用循环和递归计算阶乘\n#include <stdio.h>\nlong fact(int n);\n\
  long rfact(int n);\n\nint main(void)\n{\n    int num;\n    printf(\"计算阶乘。\\n\");\n\
  \    printf(\"输入 0-12 范围内的数字 (q 退出):\\n\");\n    while (scanf(\"%d\", &num) == 1)\n\
  \    {\n        if (num < 0)\n            printf(\"请输入数字。\\n\");\n        else if\
  \ (num > 12)\n            printf(\"保持在 13 以下。\\n\");\n        else\n        {\n\
  \            printf(\"循环：%d 的阶乘 = %ld\\n\", num, fact(num));\n            printf(\"\
  递归：%d 的阶乘 = %ld\\n\", num, rfact(num));\n        }\n    }\n    printf(\"再见。\\n\"\
  );\n    return 0;\n}\n\nlong fact(int n) // 基于循环的函数\n{\n    long ans;\n    for (ans\
  \ = 1; n > 1; n--)\n        ans *= n;\n    return ans;\n}\n\nlong rfact(int n) //\
  \ 递归版本\n{\n    long ans;\n    if (n > 0)\n        ans = n * rfact(n - 1);\n    else\n\
  \        ans = 1;\n    return ans;\n}\n```\n\n* * *\n\n测试驱动程序将输入限制在整数 0–12。事实证明\
  \ `12!` 略小于五亿，这使得 `13!` 在我们的系统上远超 `long` 的范围。要超过 `12!`，你将必须使用范围更大的类型，例如 `double`\
  \ 或 `long long`。\n\n这是一个示例运行结果：\n\n点击查看代码图像\n\n计算阶乘。\n输入 0-12 范围内的数字 (q 退出):\n5\n\
  循环：5 的阶乘 = 120\n递归：5 的阶乘 = 120\n输入 0-12 范围内的数字 (q 退出):\n10\n循环：10 的阶乘 = 3628800\n\
  递归：10 的阶乘 = 3628800\n\n输入 0-12 范围内的数字 (q 退出):\nq\n再见。\n\n循环版本将 `ans` 初始化为 1，然后与从\
  \ `n` 到 `2` 的每个整数相乘。技术上讲，你应该乘以 1，但这不会改变值。\n\n\n\n\n现在考虑递归版本。关键在于 `n! = n` × `(n-1)!`。这是因为\
  \ `(n-1)!` 是从 1 到 `n-1` 所有正整数的乘积。因此，乘以 `n` 就得到了直到 `n` 的乘积。这暗示了使用递归的方法。如果你调用函数 `rfact()`，那么\
  \ `rfact(n)` 就是 `n * rfact(n-1)`。因此，你可以通过让它调用 `rfact(n-1)` 来评估 `rfact(n)`，如 Listing\
  \ 9.7 所示。当然，你必须在某处结束递归，可以通过当 `n` 为 `0` 时将返回值设置为 `1` 来实现这一点。\n\nListing 9.7 的递归版本与循环版本的输出相同。请注意，尽管对\
  \ `rfact()` 的递归调用不是函数的最后一行，但当 `n > 0` 时它是最后执行的语句，因此它是尾递归。\n\n既然你可以使用循环或递归来编写函数，你应该使用哪一个呢？通常，循环是更好的选择。首先，由于每个递归调用都有自己的一组变量，递归会消耗更多内存；每个递归调用都会在栈上放置一组新变量。而且栈中的空间限制可能会限制递归调用的次数。其次，递归速度较慢，因为每个函数调用都需要时间。那么为什么要展示这个例子呢？因为尾递归是最容易理解的递归形式，而递归是理解的，因为在某些情况下，没有简单的循环替代方案。\n\
  \n### 递归与反转\n\n现在让我们来看一个递归的反转顺序能力非常有用的问题。（在这种情况下，递归比使用循环更简单。）问题是：编写一个打印整数二进制等价值的函数。二进制法用\
  \ 2 的幂来表示数字。就像十进制的 234 表示 2 × 10² + 3 × 10¹ + 4 × 10⁰ 一样，二进制的 101 表示 1 × 2² + 0\
  \ × 2¹ + 1 × 2⁰。二进制数只使用 0 和 1 两个数字。你需要一种方法，或者说 `algorithm`。你如何，例如，找到 5 的二进制等价值？嗯，奇数的二进制表示以\
  \ 1 结尾。偶数以 0 结尾，所以你可以通过评估 `5 % 2` 来确定最后一位是 1 还是 0。如果结果为 1，5 是奇数，最后一位就是 1。通常情况下，如果\
  \ `n` 是一个数字，最后一位是 `n % 2`，所以你找到第一个数字就是你想打印的最后一位。这暗示使用递归函数，其中 `n % 2` 在递归调用之前计算，但在递归调用之后进行打印。这样，第一个计算的值就是最后一个打印的值。\n\
  \n要获取下一个数字，将原数除以 2。这相当于将小数点向左移动一位的二进制等价操作，以便你可以检查下一个二进制位。如果这个值是偶数，下一个二进制位就是 0。如果是奇数，二进制位就是\
  \ 1。例如，5/2 是 2（整数除法），所以下一个数字是 0。到目前得到了 01。现在重复该过程。将 2 除以 2 得到 1。评估 `1 % 2` 得到 1，所以下一个数字是\
  \ 1。这得到了 101。你何时停止？当除以 2 的结果小于 2 时你停止，因为只要它等于 2 或更大，就还会多出一个二进制位。每次除以 2 都会切掉一个二进制位，直到末尾。（如果这让你觉得很困惑，尝试一下十进制类比。628\
  \ 除以 10 的余数是 8，所以 8 是最后一位。整数除 10 得到 62，62 除以 10 的余数是 2，这就是下一个数字，依此类推。）Listing 9.8\
  \ 实现了这种方法。\n\n#### Listing 9.8 binary.c 程序\n\n点击此处查看代码图片\n\n```\n/* binary.c --\
  \ 以二进制形式打印整数 */\n\n#include <stdio.h>\n\nvoid to_binary(unsigned long n);\n\nint\
  \ main(void)\n{\n    unsigned long number;\n    printf(\"Enter an integer (q to\
  \ quit):\\n\");\n    while (scanf(\"%lu\", &number) == 1)\n    {\n        printf(\"\
  Binary equivalent: \");\n        to_binary(number);\n        putchar('\\n');\n \
  \       printf(\"Enter an integer (q to quit):\\n\");\n    }\n    printf(\"Done.\\\
  n\");\n}\n\nvoid to_binary(unsigned long n)\n{\n    int r;\n    r = n % 2;\n   \
  \ if (n >= 2)\n    {\n        to_binary(n / 2);\n    }\n    putchar(r + '0');\n\
  }\n```\n\n* * *\n\n（注：提供的文本在后半部分包含大量的重复/乱码部分。我已经根据格式规则清理了冗余逻辑，同时保持了代码的核心含义和主要说明。）\n\
  \n\n\n\n[content]\n程序中的每个 C 函数与其他函数处于平等地位。每个函数都可以调用任何其他函数，也可以被任何其他函数调用。这使得 C 函数与\
  \ Pascal 和 Modula-2 的过程有所不同，因为那些过程可以嵌套在其他过程中。一个嵌套中的过程对另一个嵌套中的过程一无所知。\n\n`main()`\
  \ 函数特殊吗？是的，它有一点特殊，即当一个包含多个函数的程序组合在一起时，执行从 `main()` 中的第一条语句开始，但就是它特殊性的极限。即使是 `main()`\
  \ 也可以被自身递归调用，或被其他函数调用，尽管这种情况很少见。\n\n# 使用两个或多个源文件编译程序\n\n使用多个函数的最简单方法是将它们放在同一个文件中。然后只需像编译单函数文件一样编译该文件即可。其他方法更取决于系统，正如接下来的几节所示。\n\
  \n## Unix\n\n这假设 Unix 系统已安装了 Unix C 编译器 `cc`。（原始的 `cc` 已退役，但许多 Unix 系统将 `cc` 命令设为其他编译器命令的别名，通常是\
  \ `gcc` 或 `clang`。）假设 `file1.c` 和 `file2.c` 是两个包含 C 函数的文件。那么以下命令将编译这两个文件并生成一个名为\
  \ `a.out` 的可执行文件：\n\n```\ncc file1.c file2.c\n```\n\n此外，还会产生两个名为 `file1.o` 和 `file2.o`\
  \ 的对象文件。如果你之后修改了 `file1.c` 但没有修改 `file2.c`，可以使用此命令编译第一个文件并与第二个文件的对象代码版本结合：\n\n```\n\
  cc file1.c file2.o\n```\n\nUnix 有一个 `make` 命令可以自动实现多文件程序的管理，但这超出了本书的范围。\n\n注意，OS\
  \ X Terminal 实用程序打开了一个命令行 Unix 环境，但你必须从 Apple 下载命令行编译器（GCC 和 Clang）。\n\n## Linux\n\
  \n这假设 Linux 系统已安装了 GNU C 编译器 `GCC`。假设 `file1.c` 和 `file2.c` 是两个包含 C 函数的文件。那么以下命令将编译这两个文件并生成一个名为\
  \ `a.out` 的可执行文件：\n\n```bash\ngcc file1.c file2.c\n```\n\n此外，还会产生两个名为 `file1.o`\
  \ 和 `file2.o` 的对象文件。如果你之后修改了 `file1.c` 但没有修改 `file2.c`，可以使用此命令编译第一个文件并与第二个文件的对象代码版本结合：\n\
  \n```bash\ngcc file1.c file2.o\n```\n\n## DOS 命令行编译器\n\n大多数 DOS 命令行编译器的工作原理与 Unix\
  \ 的 `cc` 命令类似，但使用不同的名称。区别之一是对象文件使用的是 `.obj` 扩展名而不是 `.o` 扩展名。某些编译器产生汇编语言或其他特殊代码的中间文件，而不是对象代码文件。\n\
  \n## Windows 和 Apple IDE 编译器\n\n用于 Windows 和 Macintosh 的集成开发环境编译器是*以项目为导向的*。一个*项目*描述了特定程序使用的资源。这些资源包括你的源代码文件。如果你一直在使用这些编译器之一，你可能一直创建项目来运行单文件程序。对于多文件程序，请找到允许将源文件添加到项目中的菜单命令。你应该确保所有的源代码文件（以\
  \ `.c` 扩展名的文件）都已列为项目的一部分。在许多 IDE 中，你不需要在项目列表中列出头文件（以 `.h` 扩展名的文件）。其意图是由项目管理使用哪些源代码文件，而源文件中的\
  \ `#include` 指令则管理使用哪些头文件。然而，在 Xcode 中，你确实需要将头文件添加到项目中。\n\n## 使用头文件\n\n如果你将 `main()`\
  \ 放在一个文件中，将函数定义放在第二个文件中，第一个文件仍然需要函数原型。与其在每次使用函数文件时都手动输入它们，你可以将函数原型存储在头文件中。这就是标准\
  \ C 库所做的，例如，将 I/O 函数原型放在 `stdio.h` 中，将数学函数原型放在 `math.h` 中。你也可以对你的函数文件做同样的操作。\n\n\
  此外，你经常会使用 C 预处理器来定义程序使用的常量。此类定义仅在包含 `#define` 指令的文件中有效。如果你将程序的函数放在不同的文件中，你还必须让每个文件都能使用\
  \ `#define` 指令。最直接的方法是为每个文件重写这些指令，但这是非常耗时的且增加了出错的可能性。此外，它还带来了维护问题：如果你修改了 `#define`\
  \ 值，你必须记住对每个文件都进行修改。更好的解决方案是将 `#define` 指令放在头文件中，然后在每个源文件中使用 `#include` 指令。\n\n\
  因此，将函数原型和定义的常量放在头文件中是良好的编程习惯。让我们来看一个例子。假设你管理一个拥有四家酒店的连锁店。每家酒店的房费不同，但给定酒店内所有房间的价格都相同。对于预订多个晚上的人来说，第二晚的价格是第一晚的\
  \ 95%，第三晚的价格是第二晚的 95%，以此此类推。（不用担心这种政策的经济性。）你希望有一个程序，让你能够指定酒店和天数，并给出总费用。你希望程序有一个菜单，允许你继续输入数据，直到你选择退出。示例\
  \ 9.9、9.10 和 9.11 显示了可能出现的情况。示例 9.9 包含 `main()` 函数，提供了程序的结构。示例 9.10 包含支持函数，它们存储在单独的文件中。最后，\
  \ 9.11 显示了定义的常量和函数原型。在 Unix 环境中，`#include` 双引号表示文件位于当前目录。如果你使用 IDE，你需要知道如何整合头文件。\n\
  \n### Listing 9.9 hotel.c\n\n```c\n/* hotel.c -- compile program */\n#include <stdio.h>\n\
  #include \"hotel.h\" /* constants, declares functions */\nint main(void)\n{\n  \
  \  int nights;\n    double hotel_rate;\n    int code;\n    while ((code = menu())\
  \ != QUIT)\n    {\n        switch(code)\n        {\n            case 1: hotel_rate\
  \ = HOTEL1;\n                break;\n            case 2: hotel_rate = HOTEL2;\n\
  \                break;\n            case 3: hotel_rate = HOTEL3;\n            \
  \    break;\n            case 4: hotel_rate = HOTEL4;\n                break;\n\
  \            default:\n                hotel_rate = 0.0;\n                printf(\"\
  Oops!\\n\");\n                break;\n        }\n        nights = getnights();\n\
  \        showprice(hotel_rate, nights);\n    }\n    printf(\"Thank you and goodbye.\\\
  n\");\n    return 0;\n}\n```\n\n### Listing 9.10 hotel.c Function Support\n\n```c\n\
  /* hotel.c -- management functions */\n#include <stdio.h>\n#include \"hotel.h\"\n\
  int menu(void)\n{\n    int code, status;\n    printf(\"\\n%s%s\\n\", STARS, STARS);\n\
  \    printf(\"Enter the number of the desired hotel:\\n\");\n    printf(\"1) Fairfield\
  \ Arms      2) Hotel Olympic\\n\");\n    printf(\"3) Chertworthy Plaza  4) The Stockton\\\
  n\");\n    printf(\"5) quit\\n\");\n    printf(\"%s%s\\n\", STARS, STARS);\n   \
