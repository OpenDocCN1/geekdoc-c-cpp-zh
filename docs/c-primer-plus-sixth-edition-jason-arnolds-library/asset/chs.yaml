  \n**b.** 写一个具有两个 `int` 参数的函数：下限和上限。该函数应从输入读取一个整数。如果该整数在范围之外，函数应再次打印菜单（使用本题中“a”部分的函数）以重新提示用户，然后获取新值。当输入在范围内的整数时，该函数应将该值返回给调用函数。输入非整数将导致函数返回退出值\
