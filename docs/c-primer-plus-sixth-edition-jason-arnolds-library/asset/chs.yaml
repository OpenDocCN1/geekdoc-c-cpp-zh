  \ `for` 循环的实用性。\n\n***\n\n### 总结：`for` 语句\n\n**关键字：** `for`\n\n**通用注释：**\n\n`for`\
  \ 语句使用三个由分号隔开的控制表达式来控制循环过程。`initialize`（初始化）表达式在任何循环语句执行之前执行一次。然后评估 `test`（测试）表达式，如果其结果为真（或非零），则循环执行一次。然后评估\
  \ `update`（更新）表达式，此时是时候再次检查 `test` 表达式了。`for` 语句是一种进入条件循环——是否再通过一次循环的决定是在遍历循环之前做出的。因此，循环可能永远不会被遍历。形式中的\
  \ `statement`（语句）部分可以是简单语句，也可以是复合语句。\n\n**格式：**\n\n```c\nfor (initialize ; test\
  \ ; update)\n    statement\n```\n\n循环将不断重复，直到 `test` 变为假或零。\n\n**示例：**\n\n点击此处查看代码图片\n\
  \n```c\nfor (n = 0; n < 10 ; n++)\n    printf(\" %d %d\\n\", n, 2 * n + 1);\n```\n\
  \n***\n\n### 更多赋值运算符：`+=`, `-=`, `*=`, `/=`, `%=`\n\nC 有多种赋值运算符。最基础的当然是 `=`，它将右侧的值赋值给左侧。其他的赋值运算符会更新变量。每个运算符左侧是一个变量名，右侧是一个表达式。变量将被赋值为表达式的值，调整取决于运算符。例如，\n\
  \n- `scores += 20` 等同于 `scores = scores + 20`。\n- `dimes -= 2` 等同于 `dimes = dimes\
  \ - 2`。\n- `bunnies *= 2` 等同于 `bunnies = bunnies * 2`。\n- `time /= 2.73` 等同于 `time\
  \ = time / 2.73`。\n- `reduce %= 3` 等同于 `reduce = reduce % 3`。\n\n前面的列表在右侧使用了简单的数字，但这些运算符也可以用于更复杂的表达式，如下：\n\
  \n- `x *= 3 * y + 12` 等同于 `x = x * (3 * y + 12)`。\n\n我们刚刚讨论的赋值运算符具有 `=` 相同的低优先级——即低于\
  \ `+` 或 `*`。这种低优先级体现在最后一个例子，`12` 先与 `3 * y` 相加然后再乘以 `x`。\n\n你并不强制使用这些形式。然而，它们更紧凑，并且可能比长形式产生更有效的机器代码。组合赋值运算符在你试图在一个\
  \ `for` 循环规范中挤入多个初始化或更新表达式时特别有用。\n\n### 逗号运算符\n\n逗号运算符扩展了 `for` 循环的灵活性，允许你在单个 `for`\
  \ 循环规范中包含多个初始化或更新表达式。例如，列表 6.13 显示了一个打印头等邮件费率的程序。（在本文编写时，第一盎司为 46 分，每增加一盎司 20 分。你可以查看互联网以获取当前费率。）\n\
  \n***\n\n列表 6.13 postage.c 程序\n\n```c\n// postage.c -- 头等邮件费率\n\n#include <stdio.h>\n\
  \nint main(void)\n{\n    const int FIRST_OZ = 46; // 2013 年率\n    const int NEXT_OZ\
  \ = 20;  // 2013 年率\n    int ounces, cost;\n\n    for (ounces = 1, cost = FIRST_OZ;\
  \ ounces <= 5; ounces++, cost += NEXT_OZ)\n    {\n        printf(\"%d ounce(s):\
  \ $%d\\n\", ounces, ounces == 1 ? \"s\" : \"\", cost);\n    }\n\n    return 0;\n\
  }\n```\n\n\n\n\n\n这些复合赋值运算符的优先级与普通赋值运算符相同，都低于算术运算符。因此，像如下所示的语句：\n\n点击此处查看代码图像\n\n\
  ```\ncontents *= old_rate + 1.2;\n```\n\n其最终效果与此代码相同：\n\n点击此处查看代码图像\n\n### 逗号运算符\n\
  \n逗号运算符将两个表达式连接成一个表达式，并保证左侧的表达式首先求值。它通常用于在 `for` 循环控制表达式中包含更多信息。整个表达式的值是右侧表达式的值。\n\
  \n#### 示例\n\n点击此处查看代码图像\n\n```c\nfor (step = 2, fargo = 0; fargo < 1000; step *=\
  \ 2)\n    fargo += step;\n```\n\n#### 芝诺对上 for 循环\n\n让我们来看看 `for` 循环和逗号运算符如何帮助解决一个古老的悖论。古希腊哲学家芝诺曾认为，一支箭永远无法到达目标。首先，他说，箭覆盖了到目标距离的一半。然后，它必须覆盖剩余距离的一半。接着，它还有一半的剩余距离需要覆盖，无限循环。芝诺认为，因为这段旅程由无限数量的部分组成，所以箭需要无限的时间才能到达旅程的终点。然而，我们怀疑芝诺是否会根据这一论据自愿成为一个目标。\n\
  \n让我们采用定量的方法，假设箭走完第一半路需要 1 秒。那么走完剩余部分的一半需要 1/2 秒，再走完剩余的一半需要 1/4 秒，以此此类推。你可以通过以下无限级数来表示总时间：\n\
  \n点击此处查看代码图像\n\n1 + 1/2 + 1/4 + 1/8 + 1/16 +....\n\n列表 6.14 中的短程序计算前几项之和。变量 `power_of_two`\
