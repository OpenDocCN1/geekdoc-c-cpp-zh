  \n[content]\n\n括号中的 `switch` 测试表达式必须是一个整数值（包括 `char` 类型）。`case` 标签必须是整数类型（包括 `char`）的常量或整数常量表达式（表达式中仅包含整数常数的表达式）。你不能在\
