  \n## 数组\n\n回想一下，`array` 数组由一系列相同数据类型的元素组成。你使用`declarations` 声明来告诉编译器你何时需要一个数组。`array\
  \ declaration` 数组声明告诉编译器数组包含多少个元素以及这些元素的类型是什么。有了这些信息，编译器就可以正确地设置数组。数组元素的类型可以与普通变量相同。考虑以下关于数组声明的示例：\n\
  \n点击此处查看代码图像\n\n```c\n/* 某些数组声明 */\nint main(void)\n{\n   float candy[365];    \
  \  /* 365 个浮点数的数组 */\n   char code[12];         /* 12 个字符型数组   */\n   int states[50];\
  \        /* 50 个整数型数组    */\n   ...\n}\n```\n\n方括号 `[]` 标识出 `candy` 以及其余部分数组，括号内的数字表示数组中元素的数量。\n\
  \n要访问数组中的元素，你可以通过使用下标数字（也称为`index` 索引）来标识单个元素。编号从 0 开始。因此，`candy[0]` 是 `candy` 数组的第一个元素，而\
  \ `candy[364]` 是第 365 个也是最后一个元素。\n\n这些很老生牙了；让我们学点新东西吧。\n\n## 初始化\n\n数组通常用于存储程序所需的数据。例如，一个\
  \ 12 元素的数组可以存储每个月的天数。在这种情况下，在程序开始时初始化数组是非常方便的。让我们看看是如何做的。\n\n你知道可以在声明中使用表达式来初始化单值变量（有时也称为`scalar`\
  \ 标量变量），例如：\n\n```c\nint fix = 1;\nfloat flax = PI * 2;\n```\n\n其中，希望 `PI` 在之前已经定义为一个宏。C\
  \ 语言用新语法将初始化扩展到数组，如下所示：\n\n点击此处查看代码图像\n\n```c\nint main(void)\n{\n    int powers[8]\
  \ = {1,2,4,6,8,16,32,64}; /* ANSI C 及后续版本 */\n    ...\n}\n```\n\n如你所示，你通过使用花括号括起来逗号分隔的值列表来初始化数组。如果你愿意，可以在值和逗号之间使用空格。第一个元素\
  \ `powers[0]` 被赋值为 `1`，依此类推。（如果你的编译器拒绝这种形式的初始化并认为是语法错误，你可能在使用一个预-ANSI 版本的编译器。在数组声明前加上关键字\
  \ `static` 应该可以解决这个问题。第 12 章“存储存储类、链接和内存管理”讨论了该关键字的含义。）\n\n列表 10.1 展示了一个打印每月天数的短程序。\n\
