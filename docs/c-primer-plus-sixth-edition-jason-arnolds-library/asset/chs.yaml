  \              q. quit\nq\nBye.\n\n\n\n\nC 语言拥有一族函数，称为`标准 I/O 包`，它以统一的方式处理不同系统上的不同文件格式。`getchar()`\
  \ 和 `scanf()` 函数就属于这一族。这两个函数在检测到文件末尾时，都会返回值 `EOF`（定义在 `stdio.h` 头文件中）。Unix 系统允许你通过在行首处按下\
  \ `Ctrl+D` 来模拟文件末尾条件；DOS 系统则使用 `Ctrl+Z` 实现相同的目的。\n\n许多操作系统（包括 Unix 和 DOS）都具有`重定向，`功能，这允许你使用文件代替键盘和屏幕进行输入和输出。读取输入直到\
  \ `EOF` 为止的程序既可以配合键盘输入和模拟的文件末尾信号，也可以配合重定向文件使用。\n\n在调用 `getchar()` 之间穿插 `scanf()`\
  \ 可能会导致问题，当 `scanf()` 在调用 `getchar()` 之前在输入中留下了一个换行符。然而，通过意识到这个问题，你可以在编写程序时规避它。\n\
  \n在编写程序时，要深思地规划用户界面。尝试预测用户可能犯的错误，然后设计你的程序来处理这些错误。\n\n### 复习题\n\n你可以在附录 A 中的“复习题答案”找到复习题的答案。\n\
