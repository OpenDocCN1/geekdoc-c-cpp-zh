  \n上限：0\n\n完成。\n\n## 分析程序\n\n`checking.c` 程序的计算核心（`sum_squares()` 函数）虽然很短，但输入验证支持使其比我们之前给出的示例更为复杂。让我们来看看它的某些元素，首先关注程序的整体结构。\n\
  \n我们采用了了模块化方法，使用单独的函数（模块）来验证输入并管理显示。程序越庞大，使用模块化编程就越重要。\n\n`main()` 函数管理控制流，将任务委托给其他函数。它使用\
