  \              b. bell\nc. count              q. quit\na\nBuy low, sell high.\n\
  Enter the letter of your choice:\na. advice              b. bell\nc. count     \
  \         q. quit\nc\nCount how far? Enter an integer:\n3\n1\n2\n3\nEnter the letter\
  \ of your choice:\na. advice              b. bell\nc. count              q. quit\n\
