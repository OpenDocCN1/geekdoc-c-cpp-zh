  \nCelsius = 5.0 / 9.0 * (Fahrenheit - 32.0)\n\n开尔文标通常用于科学，是一个 0 代表绝对零（可能温度的极限）的刻度。以下是将摄氏转换为开尔文度的公式：\n\
  \nKelvin = Celsius + 273.16\n\n`Temperatures()` 函数应使用 `const` 来创建转换中出现的三个常数的符号表示。`main()`\
