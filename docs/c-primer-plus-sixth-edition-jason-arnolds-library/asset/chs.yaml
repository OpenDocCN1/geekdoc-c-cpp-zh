  \ Forse\nNow enter the value.\n15.99\nEnter the next title.\n[enter]\nHere is the\
  \ list of your books:\nMetric Merriment by Polly Poetica: $18.99\nDeadly Farce by\
  \ Dudley Forse: $15.99\nBye.\n\n$ booksave\nCurrent contents of book.dat:\nMetric\
  \ Merriment by Polly Poetica: $18.99\nDeadly Farce by Dudley Forse: $15.99\nPlease\
  \ add new book titles.\nThe Third Jar\nNow enter the author.\nNellie Nostrum\nNow\
  \ enter the value.\n22.99\nEnter the next title.\n[enter]\nHere is the list of your\
  \ books:\nMetric Merriment by Polly Poetica: $18.99\nDeadly Farce by Dudley Forse:\
  \ $15.99\nThe Third Jar by Nellie Nostrum: $22.99\nBye.\n\n$\n\n再次运行 `booksave.c`\
  \ 程序将显示所有三本书作为当前文件记录。\n\n## 程序要点\n\n首先，使用 `\"a+b\"` 模式打开文件。`a+` 部分允许程序读取整个文件并将数据追加到文件末尾。`b`\
  \ 是 ANSI 标准表示方法，指示程序将使用二进制文件格式。对于不接受 `b` 的 Unix 系统，你可以忽略它，因为 Unix 无论如何只有一种文件形式。对于其他非\
  \ ANSI 之前的实现，你可能需要找到与 `b` 的本地等效方法。\n\n我们选择二进制模式是因为 `fread()` 和 `fwrite()` 是为二进制文件设计的。诚然，结构体的某些内容是文本，但\
  \ `value` 成员却不是。如果你使用文本编辑器查看 `book.dat`，文本部分将显示正常，但数字部分将不可读，甚至导致你的文本编辑器崩溃。\n\n`rewind()`\
  \ 命令确保文件指针位于文件开头，准备进行首次读取。\n\n初始 `while` 循环……\n\n### 结构体：下一步\n\n在结束对结构体的探索之前，我们想提到结构体的一个更重要的用途：创建新的数据形式。对于某些问题，计算机用户比我们提供的数组和简单结构更有效地开发了数据形式。这些形式的名称如队列、二叉树、堆、哈希表和图。许多此类形式是由链接结构构建的。通常，每个结构体包含一个或两个数据项以及指向相同类型结构的一个或两个指针。这些指针将结构连接起来，并提供了一条路径，让你能够搜索整个结构集合。例如，图\
  \ 14.3 显示了一个二叉树结构，每个单独的结构（或节点）都连接到它下方的两个结构。\n\n\n\n\n图 14.3 所示的层级结构或`树`结构比数组更高效吗？考虑一个具有\
  \ 10 层节点的树。它有 `2¹⁰−1`，即 1,023 个节点，你可以在其中存储最多 1,023 个单词。如果单词按照某种合理的计划安排，你可以从顶层开始，随着搜索每向下移动一层，最多在\
  \ 9 次移动内就能找到任何单词。如果你将单词存储在数组中，你可能在找到所寻单词之前需要搜索所有 1,023 个元素。\n\n如果你对这类更高级的概念感兴趣，可以参考任何关于数据结构的计算机科学教材。通过\
  \ `C` 结构体，你可以创建并使用这些书中介绍几乎所有形式。此外，第 17 章“高级数据表示”研究了其中一些高级形式。\n\n这是我们本章关于结构的最后说明，但我们将在第\
  \ 17 章中展示链结构的示例。接下来，我们将查看处理数据的其他三个 `C` 特性：联合（unions）、枚举（enumerations）和 `typedef`。\n\
  \n### 联合（Unions）：快速浏览\n\n`union` 是一种允许你在相同内存空间中存储不同数据类型的类型（但不同同时存储）。典型的用法是设计一个表格，以某种既不规则也不预先知道的顺序存储混合类型。通过使用联合数组，你可以创建一个等大小单元的数组，每个单元都可以存放各种数据类型。\n\
  \n联合的设置方式与结构体非常相似。它有一个联合模板和一个联合变量。它们可以在一步中定义，也可以通过联合标签（tag）分两步定义。以下是一个带有标签的联合模板示例：\n\
  \n```c\nunion hold {\n    int digit;\n    double bigfl;\n    char letter;\n};\n\
  ```\n\n具有类似声明的结构体能够存储一个 `int` 值、一个 `double` 值和一个 `char` 值。然而，这个联合可以存储一个 `int` 值或一个\
  \ `double` 值，或一个 `char` 值。\n\n以下是定义三个 `hold` 类型联合变量的示例：\n\n点击此处查看代码图像\n\n```c\n\
  union hold fit;      // hold 类型的联合变量\nunion hold save[10]; // 10 个联合变量的数组\nunion\
  \ hold * pu;     // 指向 hold 类型变量的指针\n```\n\n第一个声明创建了一个单独变量 `fit`。编译器分配足够的空间以便容纳描述的可能性中最大的。在这种情况下，列出的最大可能性是\
  \ `double`，它在我们的系统上需要 64 位或 8 字节。第二个声明创建了一个名为 `save` 的包含 10 个元素的数组，每个元素 8 字节。第三个声明创建了一个可以存储\
  \ `hold` 联合地址的指针。\n\n你可以初始化联合。由于联合只存储一个值，因此规则与结构体不同。特别是，你有三个选择：你可以将联合初始化为另一个相同类型的联合，可以初始化联合的第一个元素，或者在\
  \ C99 中，你可以使用指定初始化器（designated initializer）：\n\n点击此处查看代码图像\n\n```c\nunion hold valA;\n\
  valA.letter = 'R';\nunion hold valB = valA;  // 将一个联合初始化为另一个\nunion hold valC =\
  \ {88};  // 初始化联合的 digit 成员\nunion hold valD = {.bigfl = 118.2};  // 指定初始化器\n```\n\
  \n### 使用联合\n\n以下是使用联合的方法：\n\n点击此处查看代码图像\n\n```c\nfit.digit = 23;   // 23 存储在 fit\
  \ 中；使用了 2 字节\nfit.bigfl = 2.0;  // 23 清除，存储 2.0；使用了 8 字节\nfit.letter = 'h'; // 2.0\
  \ 被清除，存储 h；使用了 1 字节\n```\n\n点运算符显示了正在使用哪种数据类型。一次只存储一个值。你不能同时存储一个 `char` 和一个 `int`，尽管有足够的空间这样做。你有责任编写程序以跟踪当前存储在联合中的数据类型。\n\
  \n你可以像对结构体指针使用该运算符那样，对联合指针使用 `->` 运算符：\n\n点击此处查看代码图像\n\n```c\npu = &fit;\nx = pu->digit;\
  \  // 等同于 x = fit.digit\n```\n\n下一个序列显示了*不要*做的事：\n\n点击此处查看代码图像\n\n```c\nfit.letter\
  \ = 'A';\nflnum = 3.02*fit;\n```\n\n`flnum = 3.02*fit;` 是一个错误，因为 `fit` 是一个联合，而不是指针。\n\
  \n\n\n\n点击此处查看代码图像\n\n`ptrst->code` `item.code` `(*ptrst).code`\n\n* *\n\n### 枚举类型\
  \ (Enumerated Types)\n\n你可以使用`枚举类型`（enumerated type）来声明符号名称以表示整数常量。通过使用 `enum` 关键字，你可以创建一个新的“类型”并指定它可能具有的值。（实际上，`enum`\
  \ 常量的类型是 `int`；因此，你可以在任何使用 `int` 的地方使用它们。）枚举类型的目的是增强程序的可读性。其语法与结构体使用的语法相似。例如，你可以进行如下声明：\n\
  \n点击此处查看代码图像\n\n```c\nenum spectrum {red, orange, yellow, green, blue, violet};\n\
  \nenum spectrum color;\n```\n\n第一个声明将 `spectrum` 建立为一个标签名（tag name），这允许你将 `enum\
  \ spectrum` 作为类型名。第二个声明使 `color` 成为该类型的变量。大括号内的标识符列出了 `spectrum` 变量可能拥的所有值。因此，`color`\
  \ 的可能值为 `red`、`orange`、`yellow` 等。这些符号常量被称为*枚举符*（enumerators）。然后，你可以使用如下的语句：\n\n\
  点击此处查看代码图像\n\n```c\nint c;\n\ncolor = blue;\n\nif (color == yellow)\n    ...;\n\n\
  for (color = red; color <= violet; color++)\n    ...;\n```\n\n虽然像 `red` 和 `blue`\
  \ 这样的枚举符类型是 `int`，但只要该类型可以容纳枚举常量，枚举变量对整数类型的限制就相对较松的。例如，`spectrum` 的枚举常量的范围是 0–5，因此编译器可以选择使用\
  \ `unsigned char` 来表示 `color` 变量。\n\n顺便提一下，某些 C 的枚举属性并不会延续到 C++。例如，C 允许你对枚举变量应用\
  \ `++` 运算符，而 C++ 标准不允许。因此，如果你认为你的代码将来可能会被整合到 C++ 程序中，你应该在上一个示例中将 `color` 声明为 `int`\
  \ 类型。这样代码就可以在 C 或 C++ 中都能运行。\n\n#### enum 常量\n\n`blue` 和 `red` 到底是什么？从技术上讲，它们是 `int`\
  \ 类型的常量。例如，给定前面的枚举声明，你可以尝试这样做：\n\n点击此处查看代码图像\n\n```c\nprintf(\"red = %d, orange\
  \ = %d\\n\", red, orange);\n```\n\n输出如下：\n\nred = 0, orange = 1\n\n发生的情况是 `red`\
  \ 变成了一个表示整数 0 的命名常量。同样地，其他标识符也是表示整数 1 到 5 的命名常量。你可以在任何可以使用整数常量的地方使用枚举常量。例如，你可以将它们用作数组声明的大小，也可以将它们用作\
  \ `switch` 语句中的标签。\n\n#### 默认值 (Default Values)\n\n默认情况下，枚举列表中的常量被赋予整数值 0, 1, 2\
  \ 等。因此，声明\n\n点击此处查看代码图像\n\n```c\nenum kids {nippy, slats, skippy, nina, liz};\n\
  ```\n\n结果导致 `nina` 的值为 `3`。\n\n#### 赋值值 (Assigned Values)\n\n你可以选择你希望常量拥有的整数值。只需在声明中包含所需的值：\n\
  \n点击此处查看代码图像\n\n```c\nenum levels {low = 100, medium = 500, high = 2000};\n```\n\
  \n如果你给一个常量赋值了值但没有给后续常量赋值，后续常量将按顺序编号。例如，假设你有如下声明：\n\n点击此处查看代码图像\n\n```c\nenum feline\
  \ {cat, lynx = 10, puma, tiger};\n```\n\n那么 `cat` 默认是 `0`，而 `lynx`、`puma` 和 `tiger`\
  \ 分别为 `10`、`11` 和 `12`。\n\n#### enum 用法\n\n记住，枚举类型的目的是增强程序的可读性并使其更易维护。如果你正在处理颜色，使用\
  \ `red` 和 `blue` 比使用 `0` 和 `1` 要明显得多。注意，枚举类型是供内部使用的。如果你想为 `color` 输入 `orange` 的值，你必须输入\
  \ `1` 而不是单词 `orange`，或者你可以读取字符串 `\"orange\"` 并让程序将其转换为值 `orange`。\n\n由于枚举类型是整数类型，`enum`\
  \ 变量可以像整数变量一样在表达式中使用。它们为 `case` 语句提供了方便的标签。\n\n列表 14.15 显示了一个使用 `enum` 的简短示例。该示例依赖于默认值赋值方案。这使得\
  \ `red` 的值为 `0`，使其成为指向字符串 `\"red\"` 的指针的索引。\n\n列表 14.15 enum.c 程序\n\n点击此处查看代码图像\n\
  \n```c\n/* enum.c -- enumerated values */\n#include <stdio.h>\n#include <string.h>\
  \ // for strcmp(), strchr()\n#include <stdbool.h> // C99 feature\nenum spectrum\
  \ {red, orange, yellow, green, blue, violet};\nchar * colors[] = {\"red\", \"orange\"\
  , \"yellow\", \"green\", \"blue\", \"violet\"};\n#define LEN 30\n\nint main(void)\n\
  {\n    char choice[LEN];\n    enum spectrum color;\n    bool color_is_found = false;\n\
  \    puts(\"Enter a color (empty line to quit):\");\n    while (s_gets(choice, LEN)\
  \ != NULL && choice[0] != '\\0')\n    {\n        for (color = red; color <= violet;\
  \ color++)\n        {\n            if (strcmp(choice, colors[color]) == 0)\n   \
  \         {\n                color_is_found = true;\n                break;\n  \
  \          }\n        }\n        if (color_is_found)\n            switch(color)\n\
  \            {\n                case red: puts(\"Roses are red.\"); break;\n   \
  \             case orange: puts(\"Poppies are orange.\"); break;\n             \
  \   case yellow: puts(\"Sunflowers are yellow.\"); break;\n                case\
  \ green: puts(\"Grass is green.\"); break;\n                case blue: puts(\"Bluebells\
  \ are blue.\"); break;\n                case violet: puts(\"Violets are violet.\"\
  ); break;\n            }\n        else\n            printf(\"I don't know about\
  \ the color %s.\\n\", choice);\n        color_is_found = false;\n        puts(\"\
  Next color, please (empty line to quit):\");\n    }\n    puts(\"Goodbye!\");\n \
  \   return 0;\n}\n\nchar * s_gets(char * st, int n)\n{\n    char * ret_val;\n  \
  \  char * find;\n    ret_val = fgets(st, n, stdin);\n    if (ret_val)\n    {\n \
  \       find = strchr(st, '\\n'); // look for newline\n        if (find) // if the\
  \ address is not NULL\n        {\n            *find = '\\0'; // place a null character\
  \ there\n        }\n        else\n            while (getchar() != '\\n')\n     \
  \           continue; // dispose of rest of line\n    }\n    return ret_val;\n}\n\
  ```\n\n* *\n\n如果输入字符串与 `colors` 数组成员指向的字符串匹配，代码将跳出 `for` 循环。如果循环找到了匹配的颜色，程序将使用枚举变量的值来匹配作为\
  \ case 标签的枚举常量。这是一个示例运行：\n\n点击此处查看代码图像\n\nEnter a color (empty line to quit):\n\n\
  blue\n\nBluebells are blue.\n\nNext color, please (empty line to quit):\n\norange\n\
  \nPoppies are orange.\n\nNext color, please (empty line to quit):\n\npurple\n\n\
  I don't know about the color purple.\n\nNext color, please (empty line to quit):\n\
  \nGoodbye!\n\n#### 共享命名空间 (Shared Namespaces)\n\n\n\n\nC 使用 `namespace`（命名空间）一词来标识程序中名称被识别的部分。作用域（Scope）是该概念的一部分：两个具有相同名称但在不同作用域内的变量不会冲突；在相同作用域内具有相同名称变量则会冲突。命名空间还有分类属性：特定作用域内的结构体标签（struct\
  \ tags）、联合体标签（union tags）和枚举标签（enumeration tags）共享同一个 `namespace`，而这个 `namespace`\
  \ 与普通变量使用的 `namespace` 不同。这意味着你可以在同一作用域内为一个变量和一个标签使用相同的名称而不会引起错误，但你不能在同一作用域内声明两个同名的标签或两个同名的变量。例如，以下代码在\
  \ C 中不会引起冲突：\n\n点击此处查看代码图像\n\n```c\nstruct rect { double x; double y; };\n\nint\
  \ rect; // 在 C 中不构成冲突\n```\n\n然而，以两种不同的方式使用同一个标识符可能会引起混淆；此外，C++ 不允许这样做，因为它将标签和变量名放在了同一个\
  \ `namespace` 中。\n\n### typedef：快速概览\n\n`typedef` 是一种高级数据特性，允许你为类型创建自己的名称。在某方面方面它与\
  \ `#define` 相似，但有三点不同：\n\n![图像](img/squf.jpg) 与 `#define` 不同，`typedef` 仅限于为类型提供符号名称，而不为值提供名称。\n\
  \n![图像](img/squf.jpg) `typedef` 的解释是由编译器执行的，而不是预处理器。\n\n![图像](img/squf.jpg) 在其限制范围内，`typedef`\
  \ 比 `#define` 更灵活。\n\n让我们看看 `typedef` 是如何工作的。假设你想用术语 `BYTE` 表示单字节数字。你只需要将 `BYTE`\
  \ 定义为类似于 `char` 变量，并在定义前加上关键字 `typedef` 即可，如下：\n\n点击此处查看代码图像\n\n```c\ntypedef unsigned\
  \ char BYTE;\n```\n\n从那时起，你就可以使用 `BYTE` 来定义变量：\n\n```c\nBYTE x, y[10], * z;\n```\n\
  \n该定义的作用域取决于 `typedef` 语句的位置。如果定义在函数内部，则作用域是局部的，局限于该函数。如果定义在函数外部，则作用域是全局的。\n\n通常使用大写字母进行这些定义，以提醒用户类型名称实际上是一个符号缩写，你也可以使用小写：\n\
  \n```c\ntypedef unsigned char byte;\n```\n\n规定变量有效名称的规则同样适用于 `typedef` 使用的名称。\n\n\
  为现有类型创建名称似乎有些无量道，但它可能是很有用的。在前面的示例中，使用 `BYTE` 代替 `unsigned char` 有助于记录你计划使用 `BYTE`\
  \ 变量来表示数字而不是字符编码。使用 `typedef` 还有助于提高移植性。例如，我们提到过 `size_t` 类型，它表示 `sizeof` 运算符返回的类型，以及\
  \ `time_t` 类型，它表示 `time()` 函数返回值的类型。C 标准说 `sizeof` 和 `time()` 返回整数类型，但将具体是哪种类型留给实现决定。这种缺乏特定性的原因是\
  \ C 标准委员会认为，可能没有哪一种选择对每个计算机平台都是最佳选择。因此，他们创建了一个新的类型名称（如 `time_t`），并让实现使用 `typedef`\
  \ 将该名称设置为某个特定类型。这样一来，他们就可以提供如下所示的通用原型：\n\n```c\ntime_t time(time_t *);\n```\n\n\
  在一个系统上，`time_t` 可以是 `unsigned long`；在另一个系统上，它可以是 `unsigned long long`。只要你包含了 `time.h`\
  \ 头文件，你的程序就可以访问相应的定义，你可以在代码中声明 `time_t` 变量。\n\n`typedef` 的某些功能可以用 `#define` 复制。例如，\n\
  \n```c\n#define BYTE unsigned char\n```\n\n这会导致预处理器将 `BYTE` 替换为 `unsigned char`。有一个无法用\
  \ `#define` 复制的例子：\n\n```c\ntypedef char * STRING;\n```\n\n如果没有 `typedef` 关键字，这个示例会将\
  \ `STRING` 本身识别为指向 `char` 的指针。有了关键字，它使 `STRING` 成为指向 `char` 的指针的标识符。因此，\n\n```c\n\
  STRING name, sign;\n```\n\n意味着\n\n```c\nchar * name, * sign;\n```\n\n假设你反而这样做：\n\
  \n```c\n#define STRING char *\n```\n\n那么\n\n```c\nSTRING name, sign;\n```\n\n将翻译为：\n\
  \n```c\nchar * name, sign;\n```\n\n在这种情况下，只有 `name` 是指针。\n\n你也可以对结构体使用 `typedef`：\n\
  \n```c\ntypedef struct complex {\n    float real;\n    float imag;\n} COMPLEX;\n\
  ```\n\n你就可以使用类型 `COMPLEX` 代替名为 `complex` 的 `struct` 来表示复数。使用 `typedef` 的原因之一是为经常出现的类型创建方便、易的名称。例如，许多人喜欢使用\
  \ `STRING` 或其等效物（如前面的示例所示）。\n\n在使用 `typedef` 命名结构体类型时，可以省略标签：\n\n```c\ntypedef struct\
  \ {double x; double y;} rect;\n```\n\n假设你像这样使用 `typedef`：\n\n```c\nrect r1 = {3.0,\
  \ 6.0};\nrect r2;\n```\n\n点击此处查看代码图像\n\n```c\nstruct {double x; double y;}\n```\n\
  \n如果结构体在没有标签的情况下成员相同，C 认为它们是相同类型，因此将 `r1` 赋值给 `r2` 是有效的。\n\n使用 `typedef` 的另一个原因是\
  \ `typedef` 名称经常被使用。例如，\n\n```c\ntypedef char (* STRING);\n```\n\n使 `STRING` 成为一个返回\
  \ `char` 指针的类型。（参见后续关于复杂声明的讨论。）\n\n### 复杂声明\n\nC 允许创建复杂的类型形式。尽管我们坚持使用较简单的形式，但我们认为有义务指出一些。当你进行声明时，名称（或标识符）可以通过添加修饰符来修改。\n\
  \n![图像](img/655tab01)\n\n可以使用多个修饰符，这使得能够创建各种类型，如下所示：\n\n点击此处查看代码图像\n\n```c\nint\
  \ board[8][8]; // 整数数组\nint ** ptr; // 指针指向指针\nint * risks[10]; // 10 个元素的指针数组\n\
  int (* rusks)[10]; // 指向 10 个整数数组的指针\nint * oof[3][4]; // 3x4 指针数组\nint (* uuf)[3][4];\
  \ // 指向 3x4 整数数组的指针\nint (* uof[3])[4]; // 指向 4 元素数组的指针数组\n```\n\n解析这些声明的诀窍在于确定应用修饰符的顺序。这些规则应该能帮你解决：\n\
  \n1. `[]`（表示数组）和 `()`（表示函数）具有相同的优先级。这种优先级高于 `*` 取地址运算符，这意味着下面的声明使 `risks` 成为指针数组而不是指向数组的指针：\n\
  \n```c\nint * risks[10];\n```\n\n2. `[]` 和 `()` 从左到右结合。因此，下一个声明使 `goods` 成为 12 个\
  \ 50 `int` 数组，而不是 50 个 12 `int` 数组：\n\n```c\nint goods[12][50];\n```\n\n\n\n## 3.\
  \ `[]` 和 `()` 的优先级相同，但由于它们从左到右结合，因此以下声明在应用括号之前将 `*` 和 `rusks` 结合在一起。这意味着下面的声明使 `rusks`\
  \ 成为指向包含 10 个 `int` 的数组的指针：\n\n```c\nint (* rusks)[10];\n```\n\n让我们将这些规则应用于此声明：\n\
  \n```c\nint * oof[3][4];\n```\n\n`[3]` 的优先级高于 `*`，而且根据从左到右的规则，它在 `[4]` 之前应用。因此，`oof`\
  \ 是一个包含三个元素的数组。接下来是 `[4]`，所以 `oof` 的元素是包含四个元素的数组。`*` 告诉我们这些元素是指针。`int` 完成了整个幅图：`oof`\
  \ 是一个包含三个元素的数组，每个元素都是指向 `int` 的四元素数组，简单来说就是一个 3×4 的 `int` 指针数组。为 12 个指针预留了空间。\n\n\
  现在看这个声明：\n\n```c\nint (* uuf)[3][4];\n```\n\n括号使得 `*` 修饰符具有最高优先级，使 `uuf` 成为指向 3×4\
  \ `int` 数组的指针。为单个指针预留了空间。\n\n这些规则还产生了以下类型：\n\n点击此处查看代码图片\n\n```c\nchar * fump(int);\
  \      // 返回 char 指针的函数\nchar (* frump)(int);   // 指向返回 char 类型的函数的指针\nchar (* flump[3])(int);//\
  \ 包含 3 个指针的数组，这些指针指向返回 char 的函数\n```\n\n这三个函数都接受一个 `int` 参数。\n\n你可以使用 `typedef`\
  \ 来构建一系列相关类型：\n\n点击此处查看代码图片\n\n```c\ntypdef int arr5[5];\ntypedef arr5 * p_arr5;\n\
  typedef p_arr5 arrp10[10];\n\narr5 togs; // togs 是一个 5 个 int 的数组\np_arr5 p2; //\
  \ p2 是指向 5 个 int 数组的指针\narrp10 ap; // ap 是一个包含 10 个指向 5-int 数组指针的数组\n```\n\n当你引入结构体时，声明的可能性确实变得极其复杂。至于应用……好吧，我们把它留给更高级的文本了。\n\
  \n### 函数与指针\n\n正如对声明的讨论所示，可以声明指向函数的指针。你可能在想这种“怪兽”是否有任何用处。通常，函数指针被用作另一个函数的参数，告诉第二个函数应该使用哪个函数。例如，排序数组涉及比较两个元素以判断哪个在前面。如果元素是数字，你可以使用\
  \ `>` 运算符。更通用地说，元素可能是字符串或结构体，需要调用函数来进行比较。C 标准库中的 `qsort()` 函数设计用于处理任何种类的数组，只要你告诉它使用哪个函数来比较元素。为了这个目的，它接受一个函数指针作为其参数之一。然后\
  \ `qsort()` 函数使用该函数对类型进行排序——无论是整数、字符串还是结构体。\n\n让我们仔细观察函数指针。首先，它意味着什么？指向例如 `int`\
  \ 的指针持有内存中可以存储 `int` 的位置的地址。函数也有地址，因为函数的机器语言实现由加载到内存中的代码组成。指向函数的指针可以持有函数代码起始标记的地址。\n\
  \n接下来，当你声明一个数据指针时，你必须声明它指向的数据类型。在声明函数指针时，你必须声明它所指向的函数类型。要指定函数类型，你需要指定函数签名，即函数的返回类型和函数的参数类型。例如，考虑这个原型：\n\
  \n点击此处查看代码图片\n\n```c\nvoid ToUpper(char *);   // 将字符串转换为大写\n```\n\n`ToUpper()` 函数的类型是“具有\
  \ `char *` 参数和返回类型 `void` 的函数”。要声明一个名为 `pf` 的指向此函数类型的指针，请这样做：\n\n点击此处查看代码图片\n\n\
  ```c\nvoid (*pf)(char *);     // pf 是指向函数的指针\n```\n\n读取此声明，你看到第一对括号将 `*` 运算符与 `pf`\
  \ 结合，这意味着 `pf` 是一个指向函数的指针。这使得 `(*pf)` 成为一个函数，使得 `(char *)` 是函数的参数列表，`void` 是返回类型。创建此声明最简单的方法是注意到它将函数名\
  \ `ToUpper` 替换为表达式 `(*pf)`。因此，如果你想声明指向特定类型函数的指针，可以声明该类型的函数，然后将函数名替换为形式 `(*pf)` 的表达式以创建函数指针声明。如前所述，第一个括号是必须的。省略它们会导致不同的结果：\n\
  \n```c\nvoid *pf(char *);\n```\n\n\n\n这看起来很乱，但它声明了两个参数：`fp` 和 `str`。`fp` 参数是一个函数指针，而\
  \ `str` 是一个数据指针。具体来说，`fp` 指向一个接受 `char *` 参数且返回类型 `void` 的函数，而 `str` 指向一个 `char`。因此，根据我们之前的声明，你可以进行像下面的函数调用：\n\
  \n点击此处查看代码图像\n\n```c\nshow(ToLower, mis);  /* show() 使用 ToLower() 函数: fp = ToLower\
  \ */\nshow(pf, mis);      /* show() 使用 pf 指向的函数: fp = pf */\n```\n\n那么 `show()`\
  \ 是如何使用传递它的函数指针的？它使用 `fp()` 或 `(*fp)()` 语法来调用函数：\n\n点击此处查看代码图像\n\n```c\nvoid show(void\
  \ (* fp)(char *), char * str)\n{\n    (*fp)(str); /* 将选定的函数应用到 str 上 */\n    puts(str);\
  \  /* 显示结果             */\n}\n```\n\n在这里，例如`show()` 首先通过应用 `fp` 指向的函数转换字符串 `str`，然后显示转换后的字符串。\n\
  \n顺带一下，带有返回值的函数可以以两种方式作为其他函数的参数。例如，考虑以下情况：\n\n点击此处查看代码图像\n\n```c\nfunction1(sqrt);\
  \      /* 传递 sqrt 函数地址 */\nfunction2(sqrt(4.0)); /* 传递 sqrt 函数的返回值 */\n```\n\n第一条语句传递了\
  \ `sqrt()` 函数的地址，推测 `function1()` 将在其代码中使用该函数。第二条语句首先调用 `sqrt()` 函数并对其求值，然后将返回值（在这种情况下为\
  \ 2.0）传递给 `function2()`。\n\n为了展示核心思想，列表 14.16 中的程序使用了 `show()`，并以各种转换函数作为参数。该列表还展示了处理菜单的一些实用技巧。\n\
  \n### 列表 14.16 `func_ptr.c` 程序\n\n点击此处查看代码图像\n\n```c\n// func_ptr.c -- 使用函数指针\n\n\
  #include <stdio.h>\n#include <string.h>\n#include <ctype.h>\n\n#define LEN 81\n\n\
  char * s_gets(char * st, int n);\nchar showmenu(void);\nvoid eatline(void);    //\
  \ 读取到行尾\nvoid show(void (* fp)(char *), char * str);\nvoid ToUpper(char *);  //\
  \ 将字符串转换为大写\nvoid ToLower(char *);  // 将字符串转换为小写\nvoid Transpose(char *); // 转换大小写\n\
  void Dummy(char *);    // 保持字符串不变\n\nint main(void)\n{\n    char line[LEN];\n  \
  \  char copy[LEN];\n    char choice;\n    void (*pfun)(char *); // 指向一个具有\n    \
  \                     // char * 参数且没有\n                         // 返回值的函数\n    puts(\"\
  输入一个字符串（空行退出）\");\n    while (s_gets(line, LEN) != NULL && line[0] != '\\0')\n \
  \   {\n        while ((choice = showmenu()) != 'n')\n        {\n            switch\
  \ (choice)  // switch 设置指针\n            {\n                case 'u' : pfun = ToUpper;\
  \  break;\n                case 'l' : pfun = ToLower;  break;\n                case\
  \ 't' : pfun = Transpose; break;\n                case 'o' : pfun = Dummy;    break;\n\
  \            }\n            strcpy(copy, line);// 为 show() 制作副本\n            show(pfun,\
  \ copy);  // 使用函数\n        }\n        puts(\"输入一个字符串（空行退出）\");\n    }\n    puts(\"\
  再见!\");\n    return 0;\n}\n\nchar showmenu(void)\n{\n    char ans;\n    puts(\"\
  进入菜单:\");\n    puts(\"u) 大写\");\n    puts(\"l) 小写\");\n    puts(\"t) 转换大小写\");\n\
  \    puts(\"o) 原始大小写\");\n    puts(\"n) 下一个字符串\");\n    ans = getchar();  // 获取响应\n\
  \    ans = tolower(ans); // 转换为小写\n    eatline();  // 处理行的剩余部分\n    while (strchr(\"\
  ulton\", ans) == NULL)\n    {\n        puts(\"输入 u, l, o, 或 n:\");\n        ans\
  \ = tolower(getchar());\n        eatline();\n    }\n    return ans;\n}\n\nvoid eatline(void)\n\
  {\n    while (getchar() != '\\n')\n        continue;\n}\n\nvoid ToUpper(char * str)\n\
  {\n    while (*str)\n    {\n        *str = toupper(*str);\n        str++;\n    }\n\
  }\n\nvoid ToLower(char * str)\n{\n    while (*str)\n    {\n        *str = tolower(*str);\n\
  \        str++;\n    }\n}\n\nvoid Transpose(char * str)\n{\n    while (*str)\n \
  \   {\n        if (islower(*str))\n            *str = toupper(*str);\n        else\
  \ if (isupper(*str))\n            *str = tolower(*str);\n        str++;\n    }\n\
  }\n\nvoid Dummy(char * str)\n{\n    while (*str)\n    {\n        str++;\n    }\n\
  }\n```\n\n\n\n`eatline()` 函数会处理掉输入行中剩余的内容。这在两个方面很有用：首先，为了输入选项，用户输入一个字母然后按回车键，这会产生一个换行符。除非你先将其处理掉，否则该换行符将被读取为下一次的响应。其次，假设用户通过输入整个单词\
  \ `uppercase` 而不是字母 `u` 来响应。如果没有 `eatline()` 函数，程序将把 `uppercase` 单词中的每个字符视为一个独立的响应。使用\
  \ `eatline()` 后，程序会处理 `u` 并丢弃该行的其余部分。\n\n接下来，`showmenu()` 函数设计用于只向程序返回有效选项。为了帮助完成该任务，程序使用了来自\
  \ `string.h` 头文件的标准库函数 `strchr()`：\n\n点击此处查看代码图像\n\n```c\nwhile (strchr(\"ulton\"\
  , ans) == NULL)\n```\n\n该函数在字符串 `\"ulton\"` 中查找字符 `ans` 第一次出现的位置并返回指向该位置的指针。如果没有找到该字符，它返回空指针。因此，这个\
  \ `while` 循环测试是下面代码更方便的替换：\n\n点击此处查看代码图像\n\n```c\nwhile (ans != 'u' && ans != 'l'\
  \ && ans != 't' && ans != 'o' && ans != 'n')\n```\n\n需要检查的选项越多，使用 `strchr()` 就越发方便。\n\
  \n### 核心概念\n\n我们表示一个编程问题所需的信息通常比单个数字或数字列表更复杂。程序可能会处理具有多个属性的实体或实体集合。例如，你可能通过姓名、地址、电话和其他信息来表示一个客户。或者你可能通过标题、分销商、播放时间、成本等来描述电影\
  \ DVD。C 结构体（structure）允许你将所有信息收集到一个单元中。这对于组织程序非常有帮助。与其在分散的变量集合中存储信息，不如将所有相关信息存储在一个地方。\n\
  \n在设计结构体时，开发一组配套的函数通常很有用。例如，你不需要每次想显示结构体内容都编写大量的 `printf()` 语句，而是编写一个以结构体（或其地址）作为参数的显示函数。因为所有信息都在结构体中，你只需要一个参数。如果你将信息放在单独的变量中，就必须为每个单独的部分使用一个单独的参数。此外，如果你向结构体添加了一个成员，你必须重写函数，但你不需要更改函数调用，这在修改设计时是一个极大的便利。\n\
  \n联合体（union）的声明看起来与结构体的声明非常相似。然而，联合体的成员共享相同的内存空间，并且一次只有一个成员可以占据联合体。本质上，联合体允许你创建一个可以包含多种类型但只能存放值的变量。\n\
  \n`enum` 机制提供了一种定义符号常量的方法，而 `typedef` 机制提供了一种为基本类型或派生类型创建新标识符的方法。\n\n函数指针提供了告诉一个函数它应该使用哪个函数的方法。\n\
  \n### 总结\n\nC 结构体提供了在同一个数据对象中存储多个数据项（通常是不同类型）的方法。你可以使用标签（tag）来识别特定的结构体模板，并声明该类型的变量。成员运算符（`.`）允许你通过使用结构体模板中的标签来访问结构体的各个成员。\n\
  \n如果你有一个结构体的指针，可以使用该指针和间接成员运算符（`->`）来代替名称和点运算符来访问各个成员。要找到结构体的地址，使用 `&` 运算符。与数组不同，结构体的名称不作为结构体的地址。\n\
  \n传统上，结构相关的函数使用结构体指针作为参数。现代 C 允许结构体作为参数传递、作为返回值使用以及赋值给相同类型的结构体。然而，传递地址通常更高效。\n\n\
  联合体使用与结构体相同的语法。然而，对于联合体，成员共享公共存储空间。联合体不是像结构体那样同时存储多个数据类型，而是从一组选项中存储单个数据项类型。也就是说，结构体可以存储一个\
  \ `int`、一个 `double` 和一个 `char`，而相应的联合体可以存储一个 `int` 或一个 `double` 或一个 `char`。\n\n\
  枚举（Enumerations）允许你创建一组符号整数常量（枚举常量）并定义一个相关的枚举类型。\n\n`typedef` 机制允许你为标准 C 类型建立别名或简写表示。\n\
  \n函数名会产生该函数的地址。此类地址可以作为参数传递给函数，然后由函数使用指向的函数。如果 `pf` 是一个已分配特定函数地址的函数指针，你可以用两种方式调用该函数：\n\
  \n点击此处查看代码图像\n\n```c\n#include <math.h>    /*  double sin(double) 函数 */\n\n...\n\
  \ndouble (*pdf)(double);\n\ndouble x;\n\npdf = sin;\n\nx = (*pdf)(1.2);  // 调用 sin(1.2)\n\
  \nx = pdf(1.2);     // 同样调用 sin(1.2)\n```\n\n### 习题\n\n习题的答案可以在附录 A 中找到。\n\n**1.**\
  \ 这个结构体有什么问题？\n\n```c\nstruct {\n    char;\n    int num[20];\n}\n```\n\n**2.** 程序的一部分。它会打印什么？\n\
  \n点击此处查看代码图像\n\n```c\n#include <stdio.h>\n\nstruct house {\n    float sqft;\n  \
  \  int rooms;\n    int stories;\n    char address[40];\n};\n\nint main(void)\n{\n\
  \    struct house fruzt = {1560.0, 6, \"22 Road\"};\n    struct house *sign;\n \
  \   sign = &fruzt;\n    printf(\"%d %d\\n\", fruzt.rooms, sign->stories);\n    printf(\"\
  %s \\n\", fruzt.address);\n    printf(\"%c %c\\n\", sign->address[3], fruzt.address[4]);\n\
  \    return 0;\n}\n```\n\n**3.** 设计一个结构体，存储月份名称、三字母缩写、月份的天数以及月份编号。\n\n**4.** 定义一个包含\
