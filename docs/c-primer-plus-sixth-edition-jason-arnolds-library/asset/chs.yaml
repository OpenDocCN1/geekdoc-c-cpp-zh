  \n### 第 17 章复习题答案\n\n**1.** 定义数据类型包括决定如何存储数据以及设计一组管理数据的函数。\n\n**2.** 列表只能单向遍历，因为每个结构都包含了下一个结构的地址，但不包含前一个结构。你可以修改结构定义，使每个结构包含两个指针——一个指向前一个结构，另一个指向下一个结构。当然，每当添加新结构时，程序必须为这些指针分配正确的地址。\n\
  \n\n\n\n\n### 传递变量地址的优点\n如果变量是一个大型结构体，传递地址并访问原始数据比传递变量更快，且所需的内存更少。\n\n### 传递变量地址的缺点\n\
  你必须记住使用地址操作符或指针。在 K&R C 中，函数可能会无意中修改原始数据，但你可以通过 ANSI C 的 `const` 修饰符克服这一问题。\n\n\
