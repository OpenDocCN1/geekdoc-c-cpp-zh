  double sales[regions][quarters]; // 一个 VLA\n```\n\n如前所述，VLA 具有一些限制。它们必须具有自动存储类，这意味着它们要么是在函数内部声明且不使用\
  \ `static` 或 `extern` 存储类修饰符（第 12 章），要么作为函数参数。此外，你不能在声明时对其进行初始化。最后，在 C11 中，VLA 是一个可选功能而非强制性功能，就像在\
  \ C99 中那样。\n\n### 注意：VLA 不会改变大小\n\n变长数组（variable-length array）中的 `variable` 一词并不意味着你可以在创建数组后修改其长度。一旦创建，VLA\
  \ 的大小就会保持不变。`variable` 这一词的真实含义是，在首次创建数组时，可以使用变量来指定数组维度。\n\n由于 VLA 是语言中新引入的特性，目前对它的支持还不完整。让我们来看一个简单的示例，它展示了如何编写一个计算任意两个\
  \ `int` 二维数组之和函数。\n\n首先，这里是声明一个带有二维 VLA 参数函数的方法：\n\n点击此处查看代码图片\n\n```c\nint sum2d(int\
  \ rows, int cols, int ar[rows][cols]);  // ar 是一个 VLA\n```\n\n注意，前两个参数（`rows` 和\
  \ `cols`）被用作声明数组参数 `ar` 的维度。因为 `ar` 的声明使用了 `rows` 和 `cols`，所以在参数列表中必须在 `ar` 之前声明。因此，以下原型是错误的：\n\
  \n点击此处查看代码图片\n\n```c\nint sum2d(int ar[rows][cols], int rows, int cols); // 顺序无效\n\
  ```\n\nC99/C11 标准规定你可以从原型函数中省略名称；但在那种情况下，你需要用星号 `*` 替换省略的维度：\n\n点击此处查看代码图片\n\n```c\n\
  int sum2d(int, int, int ar[*][*]);  // ar 是一个 VLA，省略了名称\n```\n\n其次，这里是定义函数的方法：\n\
  \n点击此处查看代码图片\n\n```c\nint sum2d(int rows, int cols, int ar[rows][cols])\n{\n   \
  \ int r;\n    int c;\n    int tot = 0;\n    for (r = 0; r < rows; r++)\n       \
  \ for (c = 0; c < cols; c++)\n            tot += ar[r][c];\n    return tot;\n}\n\
  ```\n\n除了新的函数头外，该函数与经典 C 版本（列表 10.17）的唯一区别是常量 `COLS` 被变量 `cols` 替换了。函数头中变长数组的存在使得这种改变成为可能。此外，通过同时代表行数和列数的变量，我们能够使用新的\
  \ `sum2d()` 处理任何尺寸的 `int` 二维数组。列表 10.18 阐释了这一点。然而，这需要一个实现了 VLA 特性的 C 编译器。它还证明了基于\
  \ VLA 的函数可以用于传统的 C 数组，也可以用于变长数组。\n\n列表 10.18 vararr2d.c 程序\n\n点击此处查看代码图片\n\n```c\n\
  //vararr2d.c -- 使用 VLA 的函数\n#include <stdio.h>\n\n#define ROWS 3\n#define COLS 4\n\
  \nint sum2d(int rows, int cols, int ar[rows][cols]);\n\nint main(void)\n{\n    int\
  \ i, j;\n    int rs = 3;\n    int cs = 10;\n    int junk[ROWS][COLS] = {\n     \
  \   {2,4,6,8},\n        {3,5,7,9},\n        {12,10,8,6}\n    };\n    int morejunk[ROWS-1][COLS+2]\
  \ = {\n        {20,30,40,50,60,70},\n        {5,6,7,8,10}\n    };\n    int varr[rs][cs];\
  \ // VLA\n    for (i = 0; i < rs; i++)\n        for (j = 0; j < cs; j++)\n     \
  \       varr[i][j] = i + j;\n    printf(\"3x5 array\\n\");\n    printf(\"Sum of\
  \ all elements = %d\\n\", sum2d(ROWS, COLS, junk));\n    printf(\"2x6 array\\n\"\
  );\n    printf(\"Sum of all elements = %d\\n\", sum2d(ROWS-1, COLS+2, morejunk));\n\
  \    printf(\"3x10 VLA\\n\");\n    printf(\"Sum of all elements = %d\\n\", sum2d(rs,\
  \ cs, varr));\n    return 0;\n}\n\n// 带有 VLA 参数的函数\nint sum2d(int rows, int cols,\
  \ int ar[rows][cols])\n{\n    int r;\n    int c;\n    int tot = 0;\n    for (r =\
  \ 0; r < rows; r++)\n        for (c = 0; c < cols; c++)\n            tot += ar[r][c];\n\
  \    return tot;\n}\n```\n\n输出如下：\n3x5 array\nSum of all elements = 80\n2x6 array\n\
  Sum of all elements = 315\n3x10 VLA\nSum of all elements = 270\n\n注意的是，函数定义列表中的\
  \ VLA 声明实际上并没有创建一个数组。与旧语法一样，VLA 名称实际上是一个指针。这意味着一个带有 VLA 参数的函数实际上是与原始数组中的数据工作，因此它具有修改作为参数传递的数组的能力。以下代码片段指出了何时声明指针，何时声明的是实际数组：\n\
  \n点击此处查看代码图片\n\n```c\nint thing[10][10]; // 实际数组\n...\nvoid func(int thing[10][10]);\
  \ // thing 是实际数组\nvoid func(int thing[rows][cols]) { // thing 是一个指针\n    thing[0][0]\
  \ = 2;\n}\n```\n（注：由于用户提供的原文在结尾处不完整，此处翻译基于用户提供的文本片段。）\n\n\n\n就像在初始化命名数组时可以省略数组大小一样，你也可以从复合字面量（compound\
  \ literal）中省略它，编译器会自动统计其中元素的个数：\n\n点击此处查看代码图片\n\n```c\n(int []){50, 20, 90} // 一个包含\
  \ 3 个元素的复合字面量\n```\n\n由于这些复合字面量是没有名字的，你不能仅仅在一个语句中创建它们并在之后使用它们。相反，你必须在创建时通过某种方式使用它们。一种方法是使用指针来跟踪位置。也就是说，你可以这样做：\n\
  \n```c\nint * pt1;\npt1 = (int [2]) {10, 20};\n```\n\n注意，这个字面量常量被识别为 `int` 数组。与数组名一样，它被转换为第一个元素的地址，因此它可以赋值给指向\
  \ `int` 的指针。然后你可以在之后使用该指针。例如，在这种情况下，`*pt1` 将是 10，而 `pt1[1]` 将是 20。\n\n你对复合字面量的另一种用法是将其作为实际参数传递给具有匹配形式参数的函数：\n\
  \n点击此处查看代码图片\n\n```c\nint sum(const int ar[], int n);\n...\nint total3;\ntotal3\
  \ = sum((int []){4,4,4,5,5,5}, 6);\n```\n\n在这里，第一个参数是一个包含六个元素的 `int` 数组，它的作用类似于第一个元素的地址，就像数组名一样。这种在无需预先创建数组的情况下将信息传递给函数的用法，是复合字面量的典型用途。\n\
  \n你可以将此技术扩展到二维数组及更多结构。例如，这里是如何创建一个 `int` 二维数组并存储其地址：\n\n点击此处查看代码图片\n\n```c\nint\
  \ (*pt2)[4]; // 声明一个指向包含 4 个 int 的数组的指针\npt2 = (int [2][4]) { {1,2,3,-9}, {4,5,6,-8}\
  \ };\n```\n\n在这里，类型是 `int [2][4]`，一个 2×4 的 `int` 数组。\n\nListing 10.19 将这些示例整合到了一个完整的程序。\n\
  \n#### Listing 10.19 flc.c 程序\n\n点击此处查看代码图片\n\n```c\n// flc.c -- 看起来奇怪的常量\n#include\
  \ <stdio.h>\n\n#define COLS 4\n\nint sum2d(const int ar[][COLS], int rows);\nint\
  \ sum(const int ar[], int n);\n\nint main(void)\n{\n    int total1, total2, total3;\n\
  \    int * pt1;\n    int (*pt2)[COLS];\n    pt1 = (int [2]) {10, 20};\n    pt2 =\
  \ (int [2][COLS]) { {1,2,3,-9}, {4,5,6,-8} };\n    total1 = sum(pt1, 2);\n    total2\
  \ = sum2d(pt2, 2);\n    total3 = sum((int []){4,4,4,5,5,5}, 6);\n    printf(\"total1\
  \ = %d\\n\", total1);\n    printf(\"total2 = %d\\n\", total2);\n    printf(\"total3\
  \ = %d\\n\", total3);\n    return 0;\n}\n\nint sum(const int ar[], int n)\n{\n \
  \   int i;\n    int total = 0;\n    for( i = 0; i < n; i++)\n        total += ar[i];\n\
  \    return total;\n}\n\nint sum2d(const int ar[][COLS], int rows)\n{\n    int r;\n\
  \    int c;\n    int tot = 0;\n    for (r = 0; r < rows; r++)\n        for (c =\
  \ 0; c < COLS; c++)\n            tot += ar[r][c];\n    return tot;\n}\n```\n\n\n\
  \n将多维数组传递给函数的传统 C 语言方法是将数组名（其一个地址）传递给一个类型匹配的指针参数。该指针的声明除了第一个维度外，还应该指定数组的所有其他维度；第一个参数的维度通常作为第二个参数传递。例如，为了处理之前提到的\
  \ `sales` 数组，函数原型和函数调用看起来如下：\n\n点击此处查看代码图像\n\n```c\nvoid display(double ar[][12],\
  \ int rows);\n\n...\n\ndisplay(sales, 5);\n```\n\n变长数组提供了第二种语法，可以将两个数组维度都作为参数传递。在这种情况下，函数原型和函数调用看起来如下：\n\
  \n点击此处查看代码图像\n\n```c\nvoid display(int rows, int cols, double ar[rows][cols]);\n\
  \n...\n\ndisplay(5, 12, sales);\n```\n\n我们在讨论中使用了 `int` 数组和 `double` 数组，但相同的概念也适用于其他类型。然而，字符字符串有很多特殊规则。这是由于字符串中的终端空字符为函数提供了一种在不传递尺寸的情况下检测字符串末尾的方法。我们将在第\
  \ 11 章](#ch11.html_ch11)“字符字符串和字符串函数(#ch11.html_ch11)”中详细介绍字符字符串。\n\n### 复习习题\n\n\
