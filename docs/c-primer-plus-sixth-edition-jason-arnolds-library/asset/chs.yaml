  ### 信号处理：signal.h\n\n`signal` 是程序执行期间可以报告的条件。它用正整数表示。\n\n\n\n此头文件与 `threads.h` 一起提供了对并发编程的支持。这个主题已超出了本书的范围，但通俗来说，`stdatomic.h`\
  \ 头文件提供了用于创建原子操作的宏。编程社区使用 `atomic`（原子）这一术语正如德谟克利特在其物质理论中使用的那样，意思是“不可分割的”。一个操作（例如将一个结构体赋值另一个结构体）在编程层面看起来可能是原子的，但在机器语言层面可能由多个步骤组成。如果一个程序被分成多个线程，一个线程可能会读取或修改另一个线程正在使用的数据。例如，你可能会得到一个“奇幻怪”般的结构体，其中某些成员由一个线程赋值，而另一些成员由另一个线程赋值。`stdatomic.h`\
  \ 头文件允许你创建表现像原子操作样的操作，使得一个线程无法中断另一个线程的工作。\n\n## 布尔值支持：stdbool.h (C99)\n\n此头文件定义了表\
