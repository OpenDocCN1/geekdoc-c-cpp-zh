  \ 允许用户退出订单流程。程序应跟踪累计总数。也就是说，如果用户输入了 4 磅甜菜根，随后又输入了 5 磅甜菜根，程序报告 9 磅甜菜根。然后程序应计算总费用、折扣（如有）、运费和总金额。最后，程序应显示所有购买信息：每种蔬菜的单价、订单磅数以及该项订单的费用、订单总费用、折扣（如有）、运费以及所有费用的总和。\n\
  \n## 8. 字符输入输出与输入验证\n\n你将在本章学习到以下内容：\n\n![图像](img/squf.jpg) 关于输入、输出以及缓冲与无缓冲输入之间的区别\n\
  \n![图像](img/squf.jpg) 如何从键盘模拟文件结束 (EOF) 条件\n\n![图像](img/squf.jpg) 如何使用重定向将程序连接到文件\n\
  \n![图像](img/squf.jpg) 如何使用户界面更加友好\n\n在计算机世界，我们以多种方式使用 `input`（输入）和 `output`（输出）这两个词。我们谈论输入输出设备，如键盘、USB\
  \ 驱动器、扫描仪和激光打印机。我们谈论用于输入输出的数据。我们讨论执行输入输出的函数。本章重点关注用于输入输出（或简称为 `I/O`）的函数。\n\nI/O\
  \ 函数在你的程序与外部之间传输信息；`printf()`、`scanf()`、`getchar()` 和 `putchar()` 都是示例。许多程序面临的重要任务之一是验证输入；即确定用户输入的内容是否符合程序的预期。\n\
  \n### 单字符 I/O：getchar() 和 putchar()\n\n正如你在第 7 章 “C 控制语句：分支与跳转”中看到的，`getchar()`\
  \ 和 `putchar()` 执行的是单个字符的输入和输出。这种方法可能让你觉得做事方式相当笨拙。毕竟，你可以轻松地读取比单个字符更大的分组，但这种方法符合计算机的能力。此外，这种方法是大多数处理文本（即普通单词）程序的核心。\n\
  \n自 ANSI 标准以来，C 将 `stdio.h` 头文件与使用 `getchar()` 和 `putchar()` 相关，这就是为什么我们在程序中包含了该文件。（通常，`getchar()`\
  \ 和 `putchar()` 不是真正的函数，而是通过预处理器宏定义的，这一主题我们将在第 16 章](#ch16.html_ch16) “C 预处理器与 C\
  \ 库”介绍。）\n\n标准 I/O 函数通常利用特定的操作系统。因此，我们将关注所有系统中都可用的标准 I/O 函数，因为它们让你能够编写易于移植的程序。\n\
  \n为了回顾这些函数是如何工作的，请查看列表 8.1，这是一个非常简单的示例。它所做的是从键盘输入获取字符并发送到屏幕。这个过程被称为*回显输入*。它使用 `while`\
  \ 循环并在遇到 `#` 字符时终止。\n\n列表 8.1 echo.c 程序\n\n```\n* * *\n/* echo.c -- 重复输入 */\n#include\
  \ <stdio.h>\n\nint main(void)\n{\n    char ch;\n    while ((ch = getchar()) != '#')\n\
  \        putchar(ch);\n    return 0;\n}\n```\n\n\n\n\n\n在观看了此程序的运行后，你可能会奇怪为什么在输入回显之前必须输入一整行。你可能还会想是否有更好的方法来终止输入。使用特定的字符（例如\
  \ `#`）来终止输入会防止你将在正文中使用该字符。为了回答这些问题，让我们来看看 C 程序是如何处理键盘输入的。特别是，让我们检查缓冲（buffering）和标准输入文件的概念。\n\
  \n### 缓冲区 (Buffers)\n\n如果你在某些较旧系统上运行之前的程序，文本输入将立即回显。也就是说，示例运行可能如下：上述行为是特例。在大多数系统上，正如第一个示例所示，在按下回车键之前什么都不会发生。字符的立即回显是\
  \ `unbuffered`（无缓冲或 `direct` 直接）输入的实例，意味着你输入的字符会立即供程序使用。另一方面，延迟回显则说明了 `buffered`（缓冲）输入，在这种情况下，你输入的字符被收集并存储在一个称为缓冲区的区域中。按下回车键会导致你输入的字符块变得供你的程序可用。\n\
  \n#### 为什么需要缓冲区？\n\n首先，作为一个块传输几个字符比逐个发送它们更节省时间。其次，如果你输错了，可以使用纠正功能来修复错误。当你最终按下回车键时，你可以传输修正后的版本。另一方面，无缓冲输入对于某些交互式程序是理想的。例如，在游戏中，你希望每个命令在你按下按键时立即发生。因此，缓冲输入和无缓冲输入都有它们的用处。\n\
  \n缓冲有两种类型：`fully buffered`（全缓冲）I/O 和 `line-buffered`（行缓冲）I/O。对于全缓冲输入，缓冲区在满载时会被刷新（内容被发送到目的地）。缓冲区的大小取决于系统，但\
  \ 512 字节和 4096 字节是常见值。对于行缓冲，按下回车键会刷新缓冲区。\n\n#### 你拥有的是哪种输入：缓冲的还是无缓冲的？\n\nANSI C\
  \ 及其后续标准规定输入应该是缓冲的，但 K&R 将选择交给了编译器编写者。你可以通过运行 `echo.c` 程序并查看结果来发现这一点。ANSI C 确定缓冲输入为标准的原因是某些计算机设计不允许无缓冲输入。如果你的特定计算机允许无缓冲输入，那么很可能是你的编译器将其作为一个选项提供。例如，许多\
  \ IBM PC 的编译器提供了一组由 `conio.h` 头文件支持的特殊无缓冲输入函数。这些函数包括用于回显输入的 `getche()` 和用于不回显输入的\
  \ `getch()`。回显输入意味着你输入的字符显示在屏幕上，而不回显输入意味着它不显示。\n\nUnix 系统使用不同的方法，由 Unix 本身控制缓冲。在\
  \ Unix 中，你使用 `ioctl()` 函数（Unix 库的一部分，但在标准 C 中）来指定你想要的输入类型，而 `getchar()` 会据此运行。在\
  \ ANSI C 中，`setbuf()` 和 `setvbuf()` 函数提供了对缓冲的一些控制，但某些系统的固有限性可能会限制这些函数的有效性。简而言之，没有调用无缓冲输入的标准方法；它取决于计算机系统。在书中，我们假设你正在使用缓冲输入。\n\
  \n## 终止键盘输入\n\n`echo.c` 程序在输入 `#` 时会停止，只要你在正常输入中排除该字符，这样做就是方便的。然而，正如你所看到的，`#` 可能出现在正常输入中。理想情况下，你希望有一个通常在文本中不出现的终止字符。C\
  \ 对这种需求有答案，但要理解它，你需要知道 C 如何处理文件。\n\n#### 文件、流和键盘输入\n\n`file`（文件）是存储信息的内存区域。通常，文件被保存在某种永久内存中，例如硬盘、USB\
  \ 闪存驱动器或像 DVD 这样的光盘。你无疑意识到了文件对计算机系统的重要性。例如，你的 C 程序存储在文件中，而用于编译你程序的程序也存储在文件中。这个例子说明某些程序需要能够访问特定的文件。当你编译存储在名为\
  \ `echo.c` 文件中的程序时，编译器会打开 `echo.c` 文件并读取其内容。当编译器完成后，它会关闭该文件。其他程序（如文字处理器）不仅打开、读取和关闭文件，还会向它们写入内容。\n\
  \nC 强大且灵活，有许多库函数用于打开、读取、写入和关闭文件。在某一层上，它可以通过主机操作系统的基本文件工具来处理文件。这被称为 `low-level I/O`（低级\
  \ I/O）。由于计算机系统之间的许多差异，创建一个通用的标准低级 I/O 函数库是不可能的，ANSI C 也没有尝试这样做；然而，C 在另一个层级处理文件，称为\
  \ `standard I/O package`（标准 I/O 包）。这涉及创建一个用于处理文件的标准模型和标准 I/O 函数集。在更高的层次上，系统之间的差异由特定的\
  \ C 实现来处理，以便你处理一个统一的接口。\n\n我们讨论的是什么样的差异？例如，不同的系统存储文件的方式不同。有些将文件内容存储在一个处，将文件信息存储在另一个处。有些将文件描述构建在文件中。在处理文本时，某些系统使用单个换行符标记行的结束。其他系统可能使用回车（carriage\
  \ return）和换行（linefeed）字符的组合表示行的结束。某些系统以字节为单位测量文件大小；有些以字节块为单位。\n\n当你使用标准 I/O 包时，你受到了这些差异的影响。因此，为了检查换行符，你可以使用：\n\
  ```c\nif (ch == '\\n')\n```\n如果系统实际上使用回车/换行符组合，I/O 函数会自动在两种表示之间进行转换。\n\n从概念上说，C\
  \ 程序处理`stream`（流）而不是直接处理文件。`stream` 是一个理想化的数据流，实际的输入或输出映射到这里。这意味着具有不同属性的各种类型输入被具有更统一属性的流表示。因此，打开文件的过程就变成了将流与文件关联，而读取和写入通过流进行。\n\
  \n\n\n\n\n第 13 章 详细讨论了文件。对于本章，只需注意 C 处理输入输出设备的方式与其处理存储设备上的普通文件的方式是相同的。特别是，键盘和显示设备被视为每个\
  \ C 程序都会自动打开的文件。键盘输入由一个名为 `stdin` 的流表示，输出到屏幕（或电字机或其他输出设备）由一个名为 `stdout` 的流表示。`getchar()`、`putchar()`、`printf()`\
  \ 和 `scanf()` 函数都是标准 I/O 库的成员，它们负责处理这两个流。\n\n这一切的一个启示是，你可以对键盘输入使用与处理文件相同的技术。例如，一个读取文件的程序需要一种检测文件结束的方法，以便它知道何时何时停止读取。因此，C\
  \ 输入函数都配备了内置的文件结束检测器。由于键盘输入被视为文件，因此你也应该能够使用该文件结束检测器来终止键盘输入。让我们从文件开始看看这是如何实现的。\n\n\
  ## 文件结束 (The End of File)\n\n计算机操作系统需要某种方式来告知每个文件的开始和结束位置。检测文件结束的一种方法是在文件中放置一个特殊字符来标记结束。这种方法曾经被使用，例如在\
  \ CP/M、IBM-DOS 和 MS-DOS 文本文件中。今天，这些操作系统可能使用嵌入的 Ctrl+Z 字符来标记文件结束。曾几何时这是这些操作系统使用的唯一手段，但现在有了其他选项，例如跟踪文件大小。因此，现代文本文件可能包含也不包含嵌入的\
  \ Ctrl+Z，但如果有，操作系统将将其视为文件结束标记。图 8.2 说明了这种方法。\n\n![Image](img/08fig02.jpg)\n\n图 8.2\
  \ 带有文件结束标记的文件。\n\n### 检测文件结束的方法\n\n另一种方法是让操作系统存储文件大小的信息。如果一个文件有 3000 字节，程序已经读取了\
  \ 3000 字节，则程序已到达末尾。MS-DOS 及其衍生版本二进制文件使用这种方法，因为这种方法允许文件包含所有字符，包括 Ctrl+Z。新版本的 DOS\
  \ 也对文本文件使用这种方法。Unix 对所有文件都使用这种方法。\n\nC 通过让 `getchar()` 函数在到达文件结束时返回一个特殊值来处理这些各种方法，无论操作系统实际上是如何检测文件结束的。该值的名称为\
  \ `EOF`（end of file）。因此，`getchar()` 在检测到文件结束时的返回值为 `EOF`。`scanf()` 函数在检测到文件结束时也会返回\
  \ `EOF`。通常，`EOF` 在 `stdio.h` 文件中定义如下：\n\n```c\n#define EOF (-1)\n```\n\n为什么是 `-1`？通常，`getchar()`\
  \ 返回 `0` 到 `127` 范围内的值，因为这些值对应于标准字符集，但如果系统识别扩展字符集，它可能会返回 `0` 到 `255` 之间的值。无论何种情况，值\
  \ `-1` 都不对应于任何字符，因此它可以用来指示文件结束。\n\n某些系统可能将 `EOF` 定义为除 `-1` 以外的值，但该定义总是与合法输入字符产生的返回值不同。如果你包含了\
  \ `stdio.h` 文件并使用 `EOF` 符号，就不需要担心数值定义了。重要的点是，`EOF` 代表一个指示检测到文件结束的值；它并不是文件中实际找到的符号。\n\
  \n好了，你如何在程序中使用 `EOF` 呢？将 `getchar()` 的返回值与 `EOF` 进行比较。如果它们不同，说明尚未到达文件结束。换句话说，你可以使用这样的表达式：\n\
  \n```c\nwhile ((ch = getchar()) != EOF)\n```\n\n如果你读取的是键盘输入而不是文件怎么办？大多数系统（但不是所有）都有从键盘模拟文件结束条件的方法。知道这一点，你就可以重写基本的读取和回显程序，如列表\
  \ 8.2 所示。\n\n列表 8.2 echo_eof.c 程序\n\n点击此处查看代码图像\n\n```c\n/* echo_eof.c -- 重复输入直到文件结束\
  \ */\n\n#include <stdio.h>\n\nint main(void)\n{\n    int ch;\n    while ((ch = getchar())\
  \ != EOF)\n        putchar(ch);\n\n    return 0;\n}\n```\n\n注意以下几点：\n\n![Image](img/squf.jpg)\
  \ 你不需要定义 `EOF`，因为 `stdio.h` 已经处理了。\n\n![Image](img/squf.jpg) 你不需要担心 `EOF` 的实际值，因为\
  \ `stdio.h` 中的 `#define` 语句允许你使用符号表示法 `EOF`。你不应该编写假设 `EOF` 有特定值的代码。\n\n![Image](img/squf.jpg)\
  \ 变量 `ch` 是一个 `int` 类型，因为它必须持有 `EOF` 的值，而这个值超出了 `char` 的范围。\n\n![Image](img/squf.jpg)\
  \ `getchar()` 函数返回 `int`，因为它在返回所有可能的字符值之外，还能返回 `EOF` 的值。\n\n\n\n\n\n模拟 `EOF` 的概念出现于使用文本界面的命令行环境中。在这样的环境中，用户通过按键输入与程序交互，而操作系统产生\
  \ `EOF` 信号。某些实践并不特别适用于转换到图形用户界面，例如 Windows 和 Macintosh，这些系统具有结合了鼠标移动和按钮点击的更复杂的用户界面。程序在遇到模拟\
  \ `EOF` 时的行为取决于编译器和项目类型。例如，`Ctrl+Z` 可能会终止输入，也可能会终止整个程序，取决于具体的设置。\n\n## 重定向与文件\n\n\
  输入和输出涉及函数、数据和设备。例如，考虑 `echo_eof.c` 程序。它使用了输入函数 `getchar()`。输入设备（我们假设是）是键盘，输入数据流由单个字符组成。假设你想要保持相同的输入函数和相同的数据类型，但想更改程序查找数据的地方。可以问的一个好问题是：“程序如何知道去哪里寻找它的输入？”\n\
  \n默认情况下，使用标准 I/O 包的 C 程序将标准输入作为其输入源。这就是之前标识为 `stdin` 的流。它是任何被设置为向计算机读取数据的常规方式。它可能是一个老旧的设备，如磁带、打孔卡或电字机，或者（正如我们将继续假设的那样）你的键盘，或者某些即将的技术，如语音输入。然而，现代计算机是一个顺从的工具，你可以影响它去别寻找输入。特别是，你可以告诉程序从文件而不是键盘获取输入。\n\
  \n让程序与文件工作有两种方法。一种是显式地使用打开文件、关闭文件、读取文件、写入文件等特殊函数。我们将那种方法留到第 13 章。第二种方法是使用设计用于键盘和屏幕的程序，但通过不同的通道重定向输入和输出——例如，重定向到文件和从文件。换句话说，你将\
  \ `stdin` 流重新分配给文件。`getchar()` 程序继续从流中获取数据，而并不在乎该流从哪里获取数据。这种方法（重定向）在某些方面比第一种更局限，但它使用起来简单得多，并且允许你熟悉常见的文件处理技术。\n\
  \n重定向的一个主要问题是它与操作系统有关，而不是与 C。然而，许多 C 环境（包括 Unix、Linux 和 Windows 命令行模式）都支持重定向，某些\
  \ C 实现在缺少该特性的系统上模拟它。Apple OS X 运行在 Unix 之上，你可以通过启动终端应用程序使用 Unix 命令行模式。我们将查看 Unix、Linux\
  \ 和 Windows 版本的重定向。\n\n## Unix、Linux 和 Windows 命令行重定向\n\nUnix（当以命令行模式运行时）、Linux（同上）和\
  \ Windows 命令行（模拟旧的 DOS 命令行环境）允许你同时重定向输入和输出。重定向输入允许你的程序使用文件而不是键盘作为输入，重定向输出允许它使用文件而不是屏幕作为输出。\n\
  \n## 重定向输入\n\n假设你已经编译了 `echo_eof.c` 程序，并将可执行版本放在名为 `echo_eof` 的文件中（在 Windows 系统上为\
  \ `echo_eof.exe`）。要运行该程序，输入可执行文件的名称：\n\n```bash\necho_eof\n```\n\n程序按之前描述的那样运行，从键盘获取输入。现在假设你想在一个名为\
  \ `words` 的文本文件上使用该程序。文本文件是包含文本的文件——即存储为人类可读字符的数据。例如，它可以是一篇文章或一个 C 语言程序。包含机器语言指令的文件（例如持有程序可执行版本的文件）不是文本文件。因为程序处理的是字符，所以它应该与文本文件一起使用。你只需要输入此命令，之前的之前的命令：\n\
  \n```bash\necho_eof < words\n```\n\n`<` 符号是 Unix、Linux 和 DOS/Windows 的重定向运算符。它导致\
  \ `words` 文件与 `stdin` 流关联，将文件内容引导到 `echo_eof` 程序。`echo_eof` 程序本身不知道（或不在乎）输入是来自文件而不是键盘。它只知道有一流字符被喂给它，因此它逐个读取并打印它们，直到文件末尾（EOF）出现。因为\
  \ C 将文件和 I/O 设备视为等同，所以文件现在就是 I/O 设备。试一试！\n\n注意：重定向旁注\n\n在 Unix、Linux 和 Windows 命令行中，`<`\
  \ 两边的空格是可选的。某些系统（例如 AmigaDOS，给那些仍在回玩旧时光的人）支持重定向，但不允许重定向符号和文件名之间有空格。\n\n这里是一个特定 `words`\
  \ 文件的示例运行；`$` 是标准的 Unix 和 Linux 提示符之一。在 Windows/DOS 系统上，你会看到 DOS 提示符，可能是 `A>` 或\
  \ `C>`。\n\n点击此处查看代码图像\n\n```bash\n$ echo_eof < words\nThe world is too much with\
  \ us: late and soon,\nGetting and spending, we lay waste our powers:\nLittle we\
  \ see in Nature that is ours;\nWe have given our hearts away, a sordid boon!\n$\n\
  ```\n\n## 重定向输出\n\n假设你想让 `echo_eof` 将键盘输入到一个名为 `mywords` 的文件中。你可以输入：\n\n```bash\n\
  echo_eof > mywords\n```\n\n`>` 是第二个重定向运算符。它会导致名为 `mywords` 的新文件，并将 `echo_eof` 的输出（即你输入的字符副本）重定向到该文件。如果你已经有一个名为\
  \ `mywords` 的文件，它通常会被擦除并替换（许多操作系统提供了只读选项来保护现有文件）。屏幕上显示的只有你输入的字符，而副本进入了文件。要结束程序，在行首按\
  \ `Ctrl+D`（Unix）或 `Ctrl+Z`（DOS）。试一试。如果你想不出输入什么，就模仿下一个示例。在示例中，我们使用 `$` 提示符。记得通过回车键结束行以将缓冲区内容发送程序。\n\
  \n点击此处查看代码图像\n\n```bash\n$ echo_eof > mywords\nYou should have no problem recalling\
  \ which redirection\noperator does what. Just remember that each operator points\n\
  in the direction the information flows. Think of it as a funnel.\n```\n\n在 `Ctrl+D`\
  \ 或 `Ctrl+Z` 被处理后，程序终止，系统提示符返回。程序运行了吗？Unix `ls` 命令或 Windows 命令行 `dir` 命令（列出文件名）应该显示文件\
  \ `mywords` 现在存在。你可以使用 Unix 和 Linux 的 `cat` 或 DOS 的 `type` 命令检查内容，或者再次使用 `echo_eof`，这次将文件重定向到程序：\n\
  \n```bash\n$ echo_eof < mywords\n```\n\n## 组合重定向\n\n现在假设你想复制 `mywords` 文件并将其命名为\
  \ `savewords`。只需发布以下命令：\n\n点击此处查看代码图像\n\n```bash\n$ echo_eof < mywords > savewords\n\
  ```\n\n\n\n\n大功告成了。以下命令同样有效，因为重定向操作的顺序并不重要：\n\n点击此处查看代码图片\n\n```bash\necho_eof >\
  \ savewords < mywords\n```\n\n注意：不要在同一个命令中对同一个文件同时输入和输出。\n\n点击此处查看代码图片\n\n```bash\n\
  echo_eof < mywords > mywords....<-- 错误\n```\n\n原原因是 `> mywords` 会导致原始的 `mywords`\
  \ 在被用作输入之前就被截断为零长度。\n\n简而言之，以下是在 Unix、Linux 或 Windows/DOS 中使用两个重定向操作符（`<` 和 `>`）的规则：\n\
  \n![Image](img/squf.jpg) 重定向操作符将可执行程序（包括标准操作系统命令）与数据文件连接。它不能用于将一个数据文件连接到另一个，也不能用于将一个程序连接到另一个程序。\n\
  \n![Image](img/squf.jpg) 使用这些操作符，不能从多个文件获取输入，也不能将输出重定向到多个文件。\n\n![Image](img/squf.jpg)\
  \ 通常情况下，名称和操作符之间的空格是可选的，除非偶尔使用了对 Unix shell、Linux shell 或 Windows 命令提示符模式具有特殊含义的字符。例如，我们可以使用\
  \ `echo_eof<words`。\n\n你已经见过了好几个正确的例子。这里有一些错误的例子，其中 `addup` 和 `count` 为可执行程序，`fish`\
  \ 和 `beets` 为文本文件：\n\n![Image](img/310tab01.jpg)\n\nUnix、Linux 和 Windows/DOS 还具有\
  \ `>>` 操作符，它允许你将数据添加到现有文件的末尾；以及管道操作符（`|`），它允许你将一个程序的输出连接到第二个程序的输入。关于所有这些操作符的更多信息，请参考\
  \ Unix 书籍，例如 *UNIX Primer Plus, Third Edition* (Wilson, Pierce, and Wessler; Sams\
  \ Publishing)。\n\n### 注释\n\n重定向允许你将键盘输入程序用于文件。为了使此能够工作，程序必须检测文件结束标志。例如，第 7 章 展示了一个单词计数程序，它统计到第一个\
  \ `|` 字符为止。通过将 `ch` 的类型从 `char` 改为 `int`，并在循环测试中将 `'|'` 替换为 `EOF`，你就可以使用该程序统计文本文件的单词。\n\
  \n重定向是一个命令行概念，因为你通过在命令行上输入特殊符号来指示它。如果你没有使用命令行环境，可能仍然可以尝试这种技术。首先，某些集成环境具有允许你指明重定向的菜单选项。其次，对于\
  \ Windows 系统，你可以打开命令提示符窗口并从命令行运行可执行文件。Microsoft Visual Studio 默认会将可执行文件放在项目文件夹名为\
  \ `Debug` 的子文件夹中。文件名将具有与项目名称相同的基名称，并使用 `.exe` 扩展名。Xcode 默认也以项目名称命名可执行文件并将其放在 Debug\
  \ 文件夹中。你可以从 Terminal 终端（它运行一个 Unix 版本）运行可执行文件。但是，如果你使用 Terminal，使用从 Apple 下载的任一命令行编译器（GCC\
  \ 或 Clang）可能会更简单。\n\n如果重定向对你不起，你可以尝试让程序直接打开文件。列表 8.3 显示了一个带有最小说明的示例。你需要等到第 13 章\
  \ 了解细节。要读取的文件应与可执行文件在同一个目录下。\n\n#### 列表 8.3 file_eof.c 程序\n\n点击此处查看代码图片\n\n* * *\n\
  \n```c\n// file_eof.c --打开文件并显示内容\n\n#include <stdio.h>\n#include <stdlib.h>  //\
  \ 用于 exit()\n\nint main()\n{\n    int ch;\n    FILE * fp;\n    char fname[50]; \
  \          // 用于存储文件名\n    printf(\"Enter the name of the file: \");\n    scanf(\"\
  %s\", fname);\n    fp = fopen(fname, \"r\"); // 打开文件读取\n    if (fp == NULL)    \
  \       // 尝试失败\n    {\n        printf(\"Failed to open file. Bye\\n\");\n     \
  \   exit(1);              // 退出程序\n    }\n    // getc(fp) 从打开的文件获取字符\n    while\
  \ ((ch = getc(fp)) != EOF)\n        putchar(ch);\n    fclose(fp);              \
  \ // 关闭文件\n    return 0;\n}\n```\n\n* * *\n\n* * *\n\n### 总结：如何重定向输入和输出\n\n在大多数\
  \ C 系统中，你可以使用重定向，可以通过操作系统适用于所有程序，或者通过 C 编译器的帮助仅适用于 C 程序。在接下来，令 `prog` 为可执行程序的名称，令\
  \ `file1` 和 `file2` 为文件名称。\n\n**将输出重定向到文件：>**\n\n```bash\nprog >file1\n```\n\n**从文件重定向输入：<**\n\
  \n```bash\nprog <file2\n```\n\n**组合重定向：**\n\n```bash\nprog <file2 >file1\n```\n\n\
  ```\n\n这两种形式都使用 `file2` 作为输入，`file1` 作为输出。\n\n**间距：**\n\n某些系统要求重定向操作符左侧有空格，右侧没有。\n\
  \n* * *\n\n### 创建更友好的界面\n\n我们大多数人都编写过使用起来很尴尬的程序。幸运的是，C 提供了让输入过程更顺畅、更愉快的工具。\n\n##\
  \ 使用缓冲输入\n\n缓冲输入通常对用户很方便，但在使用时可能会导致新问题。本节的目标是引导你解决这些问题。请参列表 8.4 获取程序的初始版本。\n\n####\
  \ 列表 8.4 guess 程序\n\n```c\n/* guess.c -- 一个低效且错误的猜测器 */\n#include <stdio.h>\n\n\
  int main(void)\n{\n    int guess = 1;\n    printf(\"Pick an integer from 1 to 100\\\
  . I will try to guess \");\n    printf(\"it.\\Respond with a y if my guess is right\
  \ and with\");\n    printf(\"an n if it is wrong.\\n\");\n    printf(\"Uh...is your\
  \ number %d?\\n\", guess);\n    while (getchar() != 'y')  /* 获取响应，与 y 比较 */\n  \
  \      printf(\"Well, then, is it %d?\\n\", ++guess);\n    printf(\"I knew I could\
  \ do it!\\n\");\n    return 0;\n}\n```\n\n这是一个示例运行：\n\n点击此处查看代码图片\n\n```text\nPick\
  \ an integer from 1 to 100\\. I will try to guess it.\nRespond with a y if my guess\
  \ is right and with\nan n if it is wrong.\\n.\nUh...is your number 1?\nn\nWell,\
  \ then, is it 2?\nWell, then, is it 3?\nn\nWell, then, is it 4?\nWell, then, is\
  \ it 5?\ny\nI knew I could do it!\n```\n\n考虑到该程序糟糕的猜测算法，我们选择了一个小数字。注意每当你输入 `n` 时，程序都会进行两次猜测。发生的情况是程序读取\
  \ `n` 响应作为对数字 1 的否定，然后读取换行符作为对数字 2 的否定。\n\n\n\n\n一种解决方案是使用 `while` 循环来丢弃输入行的剩余部分，包括换行符。这样做的额外优点是将诸如\
  \ `no` 和 `no way` 等响应视为与简单的 `n` 一样处理。列表 8.4 中的版本将 `no` 视为两个不同的响应。以下是一个修复了该问题的修订循环：\n\
  \n点击此处查看代码图像\n\n```c\nwhile (getchar() != 'y')   /* 获取响应，与 y 比较 */\n{\n    printf(\"\
  Well, then, is it %d?\\n\", ++guess);\n    while (getchar() != '\\n')\n        continue;\
  \           /* 跳过输入行的剩余部分 */\n}\n```\n\n使用这个循环会产生如下响应：\n\n点击此处查看代码图像\n\n从 1 到 100\
  \ 之间选一个整数。我会尝试猜中它。\n\n如果我猜对了，请输入 y；如果错了，请输入 n。\n\n呃……你的数字是 1 吗？\nn\n\n那么，是 2 吗？\n\
  no\n\n那么，是 3 吗？\nno sir\n\n那么，是 4 吗？\nforget it\n\n那么，是 5 吗？\ny\n\n我知道我能做到的！\n\n\
  这解决了换行符带来的问题。然而，作为一个纯粹主义，你可能不喜欢将 `f` 视为与 `n` 相同含义的响应。为了消除这一缺陷，你可以使用 `if` 语句来过滤掉其他响应。首先，添加一个\
  \ `char` 变量来存储响应：\n\n```c\nchar response;\n```\n\n然后将循环修改为：\n\n点击此处查看代码图像\n\n```c\n\
  while ((response = getchar()) != 'y')     /* 获取响应 */\n{\n    if (response == 'n')\n\
  \        printf(\"Well, then, is it %d?\\n\", ++guess);\n    else\n        printf(\"\
  Sorry, I understand only y or n.\\n\");\n    while (getchar() != '\\n')\n      \
  \  continue;               /* 跳过输入行的剩余部分 */\n}\n```\n\n现在程序的响应看起来像这样：\n\n点击此处查看代码图像\n\
  \n从 1 到 100 之间选一个整数。我会尝试猜中它。\n\n如果我猜对了，请输入 y；如果错了，请输入 n。\n\n呃……你的数字是 1 吗？\nn\n\n\
  那么，是 2 吗？\nno\n\n那么，是 3 吗？\nno sir\n\n那么，是 4 吗？\nforget it\n\n抱歉，我只理解 y 或 n。\nn\n\
  \n那么，是 5 吗？\ny\n\n我知道我能做到的！\n\n当你编写交互式程序时，你应该尝试预测用户可能未遵循指令的情况。然后，你应该设计你的程序来优雅地处理用户的失败。当他们出错时告诉他们，并给他们另一个机会。\n\
  \n当然，你应该向用户提供清晰的指令，但无论你把指令写得多么清晰，总是会误解它们，然后责怪你的指令糟糕。\n\n#### 数字与字符输入的混合\n\n假设你的程序既需要使用\
  \ `getchar()` 进行字符输入，又需要使用 `scanf()` 进行数字输入。这两个函数都能很好地完成工作，但两者结合得并不好。这是因为 `getchar()`\
  \ 读取每一个字符，包括空格、制表符和换行符，而 `scanf()` 在读取数字时会跳过空格、制表符和换行符。\n\n为了说明这种情况下引起的问题，列表 8.5](#ch08.html_ch08lis05)\
  \ 展示了一个读取字符和两个数字作为输入的程序。然后它根据输入指定的行和列数打印该字符。\n\n列表 8.5 showchar1.c 程序\n\n点击此处查看代码图像\n\
  \n```c\n/* showchar1.c -- 带有严重 I/O 问题的程序 */\n#include <stdio.h>\nvoid display(char\
  \ cr, int lines, int width);\nint main(void)\n{\n    int ch;             /* 要打印的字符\
  \ */\n    int rows, cols;     /* 行数和列数 */\n    printf(\"Enter a character and two\
  \ integers:\\n\");\n    while ((ch = getchar()) != '\\n')\n    {\n        scanf(\"\
  %d %d\", &rows, &cols);\n        display(ch, rows, cols);\n        printf(\"Enter\
  \ another character and two integers;\\n\");\n        printf(\"Enter a newline to\
  \ quit.\\n\");\n    }\n    printf(\"Bye.\\n\");\n    return 0;\n}\nvoid display(char\
  \ cr, int lines, int width)\n{\n    int row, col;\n    for (row = 1; row <= lines;\
  \ row++)\n    {\n        for (col = 1; col <= width; col++)\n        {\n       \
