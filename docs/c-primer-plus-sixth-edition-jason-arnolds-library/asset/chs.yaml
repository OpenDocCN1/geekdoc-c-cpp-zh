  \ `scanf(\"%lf\", mint[2])`\nii. `scanf(\"%lf\", &mint[2])`\niii. `scanf(\"%lf\"\
  , &mint)`\n\n**11.** 诺亚先生喜欢按两个数计数，因此他写了以下程序来创建一个数组并填充 2, 4, 6, 8 等整数。这个程序有什么错误（如果有的话）？\n\
  \n\n\n\n\n点击此处查看代码\n\n```c\n#include <stdio.h>\n\n#define SIZE 8\n\nint main(void)\n\
  {\n  int by_twos[SIZE];\n  int index;\n  for (index = 1; index <= SIZE; index++)\n\
  \      by_twos[index] = 2 * index;\n\n  for (index = 1; index <= SIZE; index++)\n\
  \      printf(\"%d \", by_twos);\n\n  printf(\"\\n\");\n\n  return 0;\n}\n```\n\n\
