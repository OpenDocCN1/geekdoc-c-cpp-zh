  \ <= nights; n++, factor *= DISCOUNT)\n        total += rate * factor;\n    printf(\"\
  The total cost will be $%0.2f.\\n\", total);\n}\n```\n\n### 列表 9.11 hotel.h 头文件\n\
  \n点击此处查看代码图像\n\n```c\n/* hotel.h -- hotel.c 的常量和声明 */\n#define QUIT       5\n#define\
