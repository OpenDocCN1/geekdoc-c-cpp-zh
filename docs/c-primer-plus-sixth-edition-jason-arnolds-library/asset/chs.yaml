  \ 循环第一次运行时，函数计算数值 `01 & n`。项 `01` 是掩码的八进制表示，其除了第 0 位外的所有位都被设置为 0。因此，`01 & n` 只是\
  \ `n` 中最后一位的值。这个值是 `0` 或 `1`，但对于数组来说，你需要字符 `'0'` 或字符 `'1'`。加上 `'0'` 的代码即可完成该转换。（这假设数字是顺序编码的，如\
  \ ASCII。）结果被存放在数组的倒数第二个元素中。（最后一个元素预留给空字符。）\n\n顺便说一下，完全可以使用 `1 & n` 代替 `01 & n`。使用八进制的\
  \ 1 而不是十进制的 1 只是让氛围更有计算机味。从这个角度来看，`0x1 & n` 甚至更好。\n\n接着循环执行语句 `i--` 和 `n >>= 1`。第一条语句移动到数组中早一个元素，第二条语句将\
  \ `n` 中的位向右移动一位。那么，在下一次循环中，代码会找到新的最右位的值。随后，将相应的数字字符放置在最后数字数字之前的元素中。通过这种方式，函数从右向左填充数组。\n\
  \n你可以使用 `printf()` 或 `puts()` 来显示结果字符串，但 Listing 15.1 定义了 `show_bstr()` 函数，该函数将位分成四位一组，使字符串更易读。\n\
  \n以下是示例运行：\n\n点击此处查看代码图像\n\n输入整数并查看它们的二进制形式。\n\n非数字输入将终止程序。\n\n```\n7\n7 is 0000\
  \ 0000 0000 0000 0000 0000 0000 0111\n2013\n2013 is 0000 0000 0000 0000 0000 0111\
  \ 1101 1101\n-1\n-1 is 1111 1111 1111 1111 1111 1111 1111 1111\n32123\n32123 is\
  \ 0000 0000 0000 0000 0111 1101 0111 1011\nq\nBye!\n```\n\n#### 另一个示例\n\n让我们再来看一个例子。这次的目标是写一个函数，反转数值中最后的\
  \ `n` 位，其中 `n` 和数值都是函数的参数。\n\n`~` 算符反转位，但它反转的是字节中的所有位，而不仅仅是某些位。然而，正如你所看到的，`^` 算符（异或）可以用于切换单个位。假设你创建一个掩码，将最后\
  \ `n` 位设置为 1，其余位设置为 0。然后对该掩码和数值应用 `^`，即可切换（或反转）最后的 `n` 位，而保持其他位不变。这就是这里使用的方法：\n\n\
  点击此处查看代码图像\n\n```c\nint invert_end(int num, int bits)\n{\n    int mask = 0;\n  \
  \  int bitval = 1;\n    while (bits-- > 0)\n    {\n        mask |= bitval;\n   \
  \     bitval <<= 1;\n    }\n    return num ^ mask;\n}\n```\n\n`while` 循环创建掩码。初始时，`mask`\
  \ 的所有位都设置为 `0`。第一次循环将第 0 位设置为 `1`，然后增加 `bitval` 的值到 `2`；也就是说，它将第 0 位设置为 `0`，第 1\
  \ 位设置为 `1`。下一次循环将 `mask` 的第 1 位设置为 `1`，依此类推。最后，`num ^ mask` 操作产生预期的结果。\n\n要测试该函数，你可以将其插入前面的程序中，如\
  \ Listing 15.2 所示。\n\nListing 15.2 invert4.c 程序\n\n点击此处查看代码图像\n\n```c\n/* invert4.c\
  \ -- 使用位操作符 */\n#include <stdio.h>\n#include <limits.h>\nchar *itobs(int, char *);\n\
  void show_bstr(const char *);\nint invert_end(int num, int bits);\nint main(void)\n\
  {\n    char bin_str[CHAR_BIT * sizeof(int) + 1];\n    int number;\n    puts(\"Enter\
  \ integers and see them in binary.\");\n    puts(\"Non-numeric input terminates\
  \ program.\");\n    while (scanf(\"%d\", &number) == 1)\n    {\n        itobs(number,\
  \ bin_str);\n        printf(\"%d is\\n\", number);\n        show_bstr(bin_str);\n\
  \        putchar('\\n');\n        number = invert_end(number, 4);\n        printf(\"\
  Inverting the last 4 bits gives\\n\");\n        show_bstr(bin_str);\n        putchar('\\\
  n');\n    }\n    puts(\"Bye!\");\n    return 0;\n}\nchar *itobs(int n, char *ps)\n\
  {\n    int i;\n    const int size = CHAR_BIT * sizeof(int);\n    for (i = size -\
  \ 1; i >= 0; i--, n >>= 1)\n        ps[i] = (1 & n) + '0';\n    ps[size] = '\\0';\n\
  \    return ps;\n}\n/* 每四位一组显示二进制字符串 */\nvoid show_bstr(const char *str)\n{\n  \
  \  int i = 0;\n    while (str[i]) /* 非空字符 */\n    {\n        putchar(str[i]);\n\
  \        if (++i % 4 == 0)\n            putchar(' ');\n    }\n}\nint invert_end(int\
  \ num, int bits)\n{\n    int mask = 0;\n    int bitval = 1;\n    while (bits-- >\
  \ 0)\n    {\n        mask |= bitval;\n        bitval <<= 1;\n    }\n    return num\
  \ ^ mask;\n}\n```\n\n这里有一个示例运行：\n\n点击此处查看代码图像\n\n输入整数并查看它们的二进制形式。\n\n非数字输入将终止程序。\n\
  \n```\n7\n7 is 0000 0000 0000 0000 0000 0000 0000 0111\n2013\n2013 is 0000 0000\
  \ 0000 0000 0000 0111 1101 1101\n-1\n-1 is 1111 1111 1111 1111 1111 1111 1111 1111\n\
  32123\n32123 is 0000 0000 0000 0000 0111 1101 0111 1011\nq\nBye!\n```\n\n### 位域（Bit\
  \ Fields）\n\n操作位的第二种方法是使用位域，它只是 `signed int` 或 `unsigned int` 内部一组相邻的位。（C99 和 C11\
  \ 额外允许 `_Bool` 类型位域。）位域通过结构声明来设置，为每个字段指定标签并确定其宽度。例如，以下声明设置了四个 1 位位域：\n\n```c\nstruct\
  \ {\n    unsigned int autfd : 1;\n    unsigned int bldfc : 1;\n    unsigned int\
  \ undln : 1;\n    unsigned int itals : 1;\n} prnt;\n```\n\n这个定义使得 `prnt` 包含四个 1\
  \ 位位域。现在你可以使用通常的结构算符为单个字段赋值：\n\n```c\nprnt.itals = 0;\nprnt.undln = 1;\n```\n\n\
  由于这些特定字段每个只有 1 位，`1` 和 `0` 是你可以用于赋值的唯一。变量 `prnt` 存储在 `int` 大小的内存单元中，但只使用了 4 位。\n\
  \n带有位域的结构提供了一种跟踪设置的方法。许多设置（例如字体的粗体和斜体）仅仅是指定两个选择之一，如开启或关闭、是或否、真或假。当你只需要一个位时，没有必要使用整个变量。带有位域的结构允许你在一个单元中存储多个设置。\n\
  \n有时对一个设置的选项超过两个，因此你需要比单个位更多的位来表示所有选项。这不是问题，因为字段并不限制为 1 位大小。你也可以这样做：\n\n```c\nstruct\
  \ {\n    unsigned int code1 : 2;\n    unsigned int code2 : 2;\n    unsigned int\
  \ code3 : 8;\n} prcode;\n```\n\n这段代码创建了两个 2 位字段和一个 8 位字段。你现在可以进行如下赋值：\n\n```c\n\
  prcode.code1 = 0;\nprcode.code2 = 3;\nprcode.code3 = 102;\n```\n\n只要确保值没有超过字段的容量即可。\n\
  \n如果声明的总位数超过了 `unsigned int` 的大小怎么办？那么将使用下一个 `unsigned int` 存储位置。单个字段不允许跨越两个 `unsigned\
  \ int` 边界。编译器会自动移动重叠的字段定义，使字段与 `unsigned int` 边界对齐。当这种情况发生时，它会在第一个 `unsigned int`\
  \ 中留下一个未命名的空隙。\n\n\n\n\n你可以使用未命名的字段宽度在结构体中通过未命名的空隙进行“填充”。使用为 `0` 的未命名字段宽度会强制下一个字段与下一个整数对齐：\n\
  \n```c\nstruct {\n    unsigned int field1 : 1;\n    unsigned int        : 2;\n \
  \   unsigned int field2 : 1;\n    unsigned int        : 0;\n    unsigned int field3\
  \ : 1;\n} stuff;\n```\n\n在这里，`stuff.field1` 和 `stuff.field2` 之间存在一个 2 比特的间隙，而 `stuff.field3`\
  \ 存储在下一个 `int` 中。\n\n一个重要的机器依赖性是字段放入 `int` 的顺序。在某些机器上，顺序是从左到右；在另一些机器上，是从右到左。此外，不同机器在字段边界的位置上也不同。由于这些原因，位域字段通常不具有良好的移植性。然而，它们通常用于不可移植的用途，例如将数据以特定硬件设备所使用的精确格式存放。\n\
  \n## 位域字段示例 (Bit-Field Example)\n\n位域字段通常作为一种更紧凑的数据存储方式使用。例如，假设你决定表示屏幕上框的属性。让我们保持图形简单，并假设该框具有以下属性：\n\
  \n![Image](img/squf.jpg) 框是不透明的或透明的。\n\n![Image](img/squf.jpg) 填充颜色从以下色板中选择：黑、红、绿、黄、蓝、品红、青或白。\n\
  \n![Image](img/squf.jpg) 边框可以显示或隐藏。\n\n![Image](img/squf.jpg) 框颜色从与填充颜色相同的色板中选择。\n\
  \n![Image](img/squf.jpg) 边框可以使用三种线样式之一——实线、点线或虚线。\n\n你可以为每个属性使用单独的变量或全尺寸的结构体成员，但那样有点浪费位空间。例如，你只需要一个比特来指示框是不透明还是透明的，只需要一个比特来指示边框是显示还是隐藏。八种可能的颜色值可以用\
  \ 3 比特单元的八种可能值表示，而一个 2 比特单元表示三种可能的边框样式绰绰有余。因此，总共 10 比特就足以表示所有五个属性的可能设置。\n\n这些信息的一种可能表示方法是使用填充将填充相关的信息放在一个字节中，将边框相关的信息放在第二个字节中。`struct\
  \ box_props` 的声明正是这样做的：\n\n点击此处查看代码图像\n\n```c\nstruct box_props {\n    bool opaque\
  \                 : 1;\n    unsigned int fill_color     : 3;\n    unsigned int \
  \               : 4;\n    bool show_border            : 1;\n    unsigned int border_color\
  \   : 3;\n    unsigned int border_style   : 2;\n    unsigned int               \
  \ : 2;\n};\n```\n\n填充使结构体增加到了 16 比特。如果没有填充，结构体将是 10 比特。但请记住，C 使用 `unsigned int`\
  \ 作为位域结构体的基本布局单元。因此，即使结构体的唯一成员是一个 1 比特字段，该结构体的大小也与 `unsigned int` 相同，在我们系统上是 32\
  \ 位。此外，此代码假设可以使用 C99 的 `_Bool` 类型，并且它在 `stdbool.h` 中被别名为 `bool`。\n\n你可以对 `opaque`\
  \ 成员使用值 `1` 表示框是不透明的，使用 `0` 值表示透明。你对 `show_border` 成员也可以同样的操作。对于颜色，你可以使用简单的 RGB（红-绿-蓝）表示法。这些是调光的原色。显示器通过混合红、绿、蓝像素来产生不同的颜色。在计算机颜色的早期，每个像素可以是开启或关闭，因此你可以使用一个比特来表示这三种二进制颜色的强度强度。通常顺序是左侧比特表示蓝色强度，中间比特表示绿色强度，右侧比特表示红色强度。表\
  \ 15.3 显示了八种可能的组合。它们可以作为 `fill_color` 和 `border_color` 成员的值。最后，你可以选择 `0`、`1` 和 `2`\
  \ 分别代表实线、点线和虚线；它们可以作为 `border_style` 成员的值。\n\n![Image](img/15tab03.jpg) 表 15.3 简单表示\n\
  \n列表 15.3 在一个简单的示例在使用 `box_props` 结构体。它使用 `#define` 为可能的值创建符号常量。注意，原色通过单比特开启来表示。其他颜色可以用原色的组合来表示。例如，`magenta`（品红）由蓝色比特和红色比特开启组成，因此可以用\
  \ `BLUE | RED` 表示。列表 15.3 fields.c 点击此处查看代码图像\n\n```c\n* *\n/* fields.c -- 定义并使用字段\
  \ */\n#include <stdio.h>\n#include <stdbool.h> // C99, 定义了 bool, true, false\n/*\
  \ 线样式 */\n#define SOLID  0\n#define DOTTED 1\n#define DASHED 2\n/* 原色 */\n#define\
  \ BLUE  4\n#define GREEN 2\n#define RED   1\n/* 混合颜色 */\n#define BLACK  0\n#define\
  \ YELLOW (RED | GREEN)\n#define MAGENTA (RED | BLUE)\n#define CYAN  (GREEN | BLUE)\n\
  #define WHITE  (RED | GREEN | BLUE)\n\nconst char * colors[8] = {\"black\", \"red\"\
  , \"green\", \"yellow\", \"blue\", \"magenta\", \"cyan\", \"white\"};\n\nstruct\
  \ box_props {\n    bool opaque                 : 1;\n    unsigned int fill_color\
  \     : 3;\n    unsigned int                : 4;\n    bool show_border         \
  \   : 1;\n    unsigned int border_color   : 3;\n    unsigned int border_style  \
  \ : 2;\n    unsigned int                : 2;\n};\n\nvoid show_settings(const struct\
  \ box_props *);\n\nint main(void)\n{\n    /* 创建并初始化 box_props 结构体 */\n    struct\
  \ box_props box = {true, YELLOW, GREEN, DASHED};\n    printf(\"原始设置:\\n\");\n  \
  \  show_settings(&box);\n    box.opaque = false;\n    box.fill_color = WHITE;\n\
  \    box.border_color = MAGENTA;\n    box.border_style = SOLID;\n    printf(\"\\\
  n 修改后的设置:\\n\");\n    show_settings(&box);\n    return 0;\n}\n\nvoid show_settings(const\
  \ struct box_props * pb)\n{\n    printf(\"框是 %s。\\n\", pb->opaque ? \"不透明\" : \"\
  透明\");\n    printf(\"填充颜色为 %s。\\n\", colors[pb->fill_color]);\n    printf(\"边框 %s。\\\
  n\", pb->show_border ? \"显示\" : \"未显示\");\n    printf(\"框颜色为 %s。\\n\", colors[pb->border_color]);\n\
  \    printf(\"边框样式为 \");\n    switch(pb->border_style)\n    {\n        case SOLID:\
  \  printf(\"实线。\\n\"); break;\n        case DOTTED: printf(\"点线。\\n\"); break;\n\
  \        case DASHED: printf(\"虚线。\\n\"); break;\n        default:     printf(\"\
  未知类型。\\n\");\n    }\n}\n```\n\n\n\n注意 `colors` 数组的定义方式，使得每个索引值对应一个表示颜色名称的字符串，该索引值即为该颜色的数值颜色值。例如，索引\
  \ `1` 对应字符串 `\"red\"`，而枚举常量 `red` 的值为 `1`。\n\n### 位域字段与位运算符\n\n位域字段和位运算符是解决同一种类型编程问题的两种备选方法。也就是说，通常你都可以使用其中任何一种方法。例如，上一个示例使用了一个与\
  \ `unsigned int` 大小相同的结构体来存储图形框的信息。相反，你可以使用一个 `unsigned int` 变量来存储相同的信息。然后，你不再使用结构体成员表示法来访问不同部分，而是使用位运算符来实现这一目的。通常情况下，这样做会稍微笨拙一些。让我们来看一个同时采用这两种方法的示例。（之所以同时采用这两种方法是为了说明它们的区别，而不是建议同时使用这两种方法是个好主意！）\n\
  \n你可以使用 `union` 作为结合结构体方法与位运算符方法的手段。根据已有的 `struct box_props` 类型的声明，你可以声明如下 `union`：\n\
  \n点击此处查看代码图片\n\n```c\nunion Views    /* 将数据视为结构体或 unsigned short */\n{\n    struct\
  \ box_props st_view;\n    unsigned short us_view;\n};\n```\n\n在某些系统中，`unsigned int`\
  \ 和 `box_props` 结构体都占用 16 位内存。在其他系统（如我们的）上，`unsigned int` 和 `box_props` 是 32 位。无论哪种情况，通过这个\
  \ `union`，你可以使用 `st_view` 成员将该段内存视为结构体，或者使用 `us_view` 成员将同一块内存视为 `unsigned short`。结构体中的哪些位域对应\
  \ `unsigned short` 中的哪些位？这取决于实现和硬件。接下来的示例假设结构体是从字节的低位端到高位端加载到内存的。也就是说，结构体中的第一个位域进入字的第\
  \ 0 位。（为了简单起见，图 15.3 用一个 16 位单位说明了这一概念。）\n\n![图像](img/15fig03.jpg)\n\n图 15.3 作为整数和结构体的联合体。\n\
  \n列表 15.4 使用 `Views` 联合体让你比较位域方法和位运算符方法。在，`box` 是一个 `Views` 联合体，因此 `box.st_view`\
  \ 是使用位域的 `box_props` 结构体，而 `box.us_view` 是视为 `unsigned short` 的相同数据。记得 `union` 可以对其第一个成员进行初始化，因此初始化值与结构体视图匹配。程序分别使用基于结构体视图的函数和基于\
  \ `unsigned short` 视图的函数来显示框的属性。这两种方法都能让你访问数据，但技术有所不同。程序还使用了本章之前定义的 `itobs()` 函数将数据显示为二进制字符串，这样你就可以看到哪些位是开启的，哪些位是关闭的。\n\
  \n列表 15.4 dualview.c 程序\n\n点击此处查看代码图片\n\n* * *\n\n```c\n/* dualview.c -- 位域字段与位运算符\
  \ */\n#include <stdio.h>\n#include <stdbool.h>\n#include <limits.h>\n\n/* 位域字段常量\
  \ */\n/* 线条样式      */\n#define SOLID   0\n#define DOTTED  1\n#define DASHED  2\n\
  /* 颜色色  */\n#define BLUE    4\n#define GREEN   2\n#define RED     1\n/* 混合颜色  */\n\
  #define BLACK   0\n#define YELLOW  (RED | GREEN)\n#define MAGENTA (RED | BLUE)\n\
  #define CYAN    (GREEN | BLUE)\n#define WHITE   (RED | GREEN | BLUE)\n/* 位运算符常量\
  \    */\n#define OPAQUE          0x1\n#define FILL_BLUE       0x8\n#define FILL_GREEN\
  \      0x4\n#define FILL_RED        0x2\n#define FILL_MASK       0xE\n#define BORDER\
  \          0x100\n#define BORDER_BLUE     0x800\n#define BORDER_GREEN    0x400\n\
  #define BORDER_RED      0x200\n#define BORDER_MASK     0xE00\n#define B_SOLID  \
  \        0\n#define B_DOTTED         0x1000\n#define B_DASHED         0x2000\n#define\
  \ STYLE_MASK      0x3000\n\nconst char * colors[8] = {\"black\", \"red\", \"green\"\
  , \"yellow\", \"blue\", \"magenta\", \"cyan\", \"white\"};\n\nstruct box_props {\n\
  \    bool opaque             : 1;\n    unsigned int fill_color  : 3;\n    unsigned\
  \ int             : 4;\n    bool show_border        : 1;\n    unsigned int border_color:\
  \ 3;\n    unsigned int border_style  : 2;\n    unsigned int             : 2;\n};\n\
  \nunion Views /* 将数据视为结构体或 unsigned short */\n{\n    struct box_props st_view;\n\
  \    unsigned short us_view;\n};\n\nvoid show_settings(struct box_props * pb);\n\
  void show_settings1(unsigned short us);\nchar * itobs(int n, char * ps);\n\nint\
  \ main(void)\n{\n    /* 创建并初始化联合体 */\n    union Views box = {{true, RED, true, GREEN,\
  \ DASHED, true}};\n\n    printf(\"Original box settings:\\n\");\n    show_settings(&box.st_view);\n\
  \    printf(\"\\nUsing unsigned int view:\\n\");\n    show_settings1(box.us_view);\n\
  \n    /* 修改位域字段 */\n    box.st_view.opaque = false;\n    box.st_view.fill_color\
  \ = CYAN;\n    box.st_view.show_border = true;\n    box.st_view.border_color = YELLOW;\n\
  \    box.st_view.border_style = DOTTED;\n\n    printf(\"\\nModified box settings:\\\
  n\");\n    show_settings(&box.st_view);\n    printf(\"\\nUsing unsigned int view:\\\
  n\");\n    show_settings1(box.us_view);\n\n    return 0;\n}\n\nvoid show_settings(struct\
  \ box_props * pb)\n{\n    printf(\"Box is %s.\\n\", pb->opaque ? \"opaque\" : \"\
  transparent\");\n    printf(\"The fill color is %s.\\n\", colors[pb->fill_color]);\n\
  \    printf(\"Border %s.\\n\", pb->show_border ? \"shown\" : \"not shown\");\n \
  \   printf(\"The border color is %s.\\n\", colors[pb->border_color]);\n    printf(\"\
  The border style is \");\n    switch(pb->border_style)\n    {\n        case SOLID:\
  \ printf(\"solid.\\n\"); break;\n        case DOTTED: printf(\"dotted.\\n\"); break;\n\
  \        case DASHED: printf(\"dashed.\\n\"); break;\n        default: printf(\"\
