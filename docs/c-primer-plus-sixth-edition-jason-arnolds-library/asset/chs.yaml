  \    printf(\"upper limit: \");\n    stop = get_long();\n}\n```\n\n## 输入流与数字\n\n\
  在编写处理不当输入的代码（例如列表 8.7 中使用的）时，你应该对 C 输入的工作原理有一个清晰的认识。考虑如下一行输入：\n\n`is  28 12.4`\n\
  \n在我们看来，它看起来是一串字符，后面跟着一个整数，接着是一个浮点数。对于 C 程序来说，它看起来是一个字节流。第一个字节是字母 `i` 的字符编码，第二个是字母\
  \ `s` 的字符编码，第三个是空格字符的编码，第四个是数字 `2` 的字符编码，以此此类推。因此，如果 `get_long()` 遇到这行以非数字开头，以下代码将读取并丢弃整行，包括数字（这些数字只是行中的其他字符）：\n\
  \n点击此处查看代码\n\n```c\nwhile ((ch = getchar()) != '\\n')\n    putchar(ch);  // 忽略不当输入\n\
  ```\n\n尽管输入流由字符组成，但如果你告诉 `scanf()` 函数，它可以将这些字符转换为数值。例如，考虑以下输入：\n\n`42`\n\n如果你使用带有\
  \ `%c` 说明符的 `scanf()`，它将只会读取 `4` 字符并将其存储在 `char` 变量中。如果你使用 `%s` 说明符，它将读取两个字符（字符\
  \ `4` 和 `2`），并将它们存储在字符字符串中。如果你使用 `%d` 说明符，`scanf()` 读取相同的两个字符，但随后计算出它们对应的整数值为 `4\
  \ × 10 + 2`，即 `42`。然后，它将该值的整数二进制表示存储在 `int` 变量中。如果你使用 `%f` 说明符，`scanf()` 读取这两个字符，计算出它们对应数值\
  \ `42.0`，用内部浮点表示法表示该值，并将结果存储在 `float` 变量中。\n\n简而言之，输入是由字符组成的，但 `scanf()` 可以将该输入转换为整数或浮点值。使用诸如\
  \ `%d` 或 `%f` 之类的说明符限制了可接受输入的字符类型，但 `getchar()` 和使用 `%c` 的 `scanf()` 接受任何字符。\n\n\
  ## 菜单浏览\n\n许多计算机程序使用菜单作为用户界面的一部分。菜单让程序对用户更容易用，但也给程序员带来了一些问题。让我们来看看涉及哪些内容。\n菜单为用户提供了响应选择。这是一个假设的示例：\n\
  \n点击此处查看代码\n\n输入你选择的字母：\na. advice\nb. bell\nc. count\nq. quit\n\n理想情况下，用户输入这些选择之一，程序根据该选择采取行动。作为程序员，你希望让这个过程顺利进行。第一个目标是程序在用户遵循指令时运行顺畅。第二个目标是当用户未能遵循指令时程序也能正常工作。正如你所预期的，第二个目标更困难，因为很难预料可能出现在程序各种误操作。\n\
  \n现代应用程序通常使用图形化界面——可以点击的按钮、可以勾选的框、可以触摸的图标——而不是命令行方法，但通用过程是相同的：为用户提供选择，检测并响应用户的反馈，并防止误用。这些接口的底层程序结构是相同的。然而，使用图形化界面可以通过限制选择来更容易控制输入。\n\
  \n## 任务\n\n让我们更具体一点，看看菜单需要执行的任务。它需要获取用户的响应，并根据响应选择行动方案。此外，程序应该提供一种返回菜单以进行进一步选择的方法。C\
  \ 的 `switch` 语句是选择行动的天然工具，因为每个选择都可以对应于特定的 `case` 标签。你可以使用 `while` 语句来提供对菜单的重复访问。在伪代码中，你可以这样描述这个过程：\n\
  \n点击此处查看代码\n\n```\n获取选择\n当选择不是 'q'\n切换到选择并执行\n获取下一个选择\n```\n\n## 实现更顺畅的执行\n\n程序流畅的目标（处理输入的流畅和处理错误的流畅）在你决定如何实现该计划时发挥作用。例如，一种方法是让“获取选择”部分过滤掉不适当的响应，只有正确的响应被传递给\
  \ `switch`。这建议用一个只返回正确响应的函数来表示输入过程。将其与 `while` 循环和 `switch` 结合得到了如下程序：\n\n点击此处查看代码\n\
  \n```c\n#include <stdio.h>\nchar get_choice(void);\nvoid count(void);\nint main(void)\n\
  {\n    int choice;\n    while ( (choice = get_choice()) != 'q')\n    {\n       \
  \ switch (choice)\n        {\n            case 'a' :  printf(\"低买高卖。\\n\");\n  \
  \              break;\n            case 'b' :  putchar('\\a');  /* ANSI  */\n  \
  \              break;\n            case 'c' :  count();\n                break;\n\
  \            default  :  printf(\"程序错误!\\n\");\n                break;\n       \
  \ }\n    }\n    return 0;\n}\n```\n\n`get_choice()` 函数被定义为只能返回 `'a'`、`'b'`、`'c'`\
  \ 和 `'q'`。你使用它的方式非常类似于 `getchar()`——获取一个值并与终止值（在这种情况下是 `'q'`）比较。我们保持简单是为了专注于程序结构；我们很快就会遇到\
  \ `count()` 函数。`default` 情况对于调试很有用。如果 `get_choice()` 函数未能将其返回值限制在预期的值范围内，`default`\
  \ 情况会让你知道出了异常。\n\n### get_choice() 函数\n\n在这里，在伪代码中，是该函数的一种可能设计：\n\n\n\n\n\n点击此处查看代码图像\n\
  \nshow choices\n\nget response\n\nwhile response is not acceptable\n\n    prompt\
  \ for more response\n\n    get response\n\n这是一个简单但笨拙的实现：\n\n点击此处查看代码图像\n\n```c\n\
  char get_choice(void)\n{\n    int ch;\n    printf(\"Enter the letter of your choice:\\\
  n\");\n    printf(\"a. advice              b. bell\\n\");\n    printf(\"c. count\
  \              q. quit\\n\");\n    ch = getchar();\n    while  (ch < 'a' || ch >\
  \ 'c') && ch != 'q')\n    {\n        printf(\"Please respond with a, b, c, or q.\\\
  n\");\n        ch = getchar();\n    }\n    return ch;\n}\n```\n\n问题在于，由于使用了缓冲输入，回车键产生的每一个换行符都会被视为一个错误响应。为了让程序界面更加顺畅，函数应该跳过换行符。\n\
  \n有几种方法可以实现这一点。一种是将 `getchar()` 替换为一个名为 `get_first()` 的新函数，该函数读取行的第一个字符并丢弃其余部分。这种方法的优点是，它会将诸如\
  \ `act` 的输入行等同于简单的 `a`，而不是将其视为一个有效响应后跟一个用于 `count` 的 `c`。以这一目标为参考，我们可以如下重写输入函数：\n\
  \n点击此处查看代码图像\n\n```c\nchar get_choice(void)\n{\n    int ch;\n    printf(\"Enter\
