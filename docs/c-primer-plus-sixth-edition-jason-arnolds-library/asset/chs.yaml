  \n表 RS.V.5 errno.h 宏\n\n## 浮点环境：fenv.h (C99)\n\nC99 标准通过 `fenv.h` 头文件提供了访问和控制浮点环境的能力。\n\
  \n浮点环境由一组状态标志和控制模式组成。浮点计算期间的异常情况（例如除以零）会引发异常。这意味着 `fenv.h` 头文件定义了控制模式，例如舍入的方向。该头文件还提供了启用或禁用环境的指令：\n\
  \n```\n#pragma STDC FENV_ACCESS on\n```\n\n```\n#pragma STDC FENV_ACCESS off\n```\n\
  \n它被禁用。如果是外部的，该指令应放在任何声明之前，或在复合语句的开头。它一直有效到下一次出现该指令、文件结束（外部指令）或复合结束（块指令）。\n\n`fenv.h`\
  \ 头文件定义了两种类型，见[表 RS.V.6]。该宏表示几种可能的浮点异常。实现可以定义额外的宏，只要它们以 `FE_` 开头并跟一个大写字母。表 RS.V.7\
