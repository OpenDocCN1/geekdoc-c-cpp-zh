  **算术：**\n![Image](img/squf.jpg)\n\n**杂项：**\n![Image](img/squf.jpg)\n\n***\n\n###\
  \ 带参数的函数\n\n现在，你已经熟悉参数了。通精之路的下一步是学习如何编写自己的函数。让我们预览一下使用参数的函数。此时，你可能想回顾列表 5.15，它显示了如何定义函数。\n\
  \n```c\n#include <stdio.h>\n\nvoid pound(int n);\n\nint main(void) {\n    int times\
  \ = 5;\n    pound(times);\n    return 0;\n}\n\nvoid pound(int n) {\n    while (n--\
  \ > 0) {\n        printf(\"#\");\n    }\n    printf(\"\\n\");\n}\n```\n\n运行 `convert.c`\
  \ 产生输出：\n\n```\n#####\n```\n\n#### 注意：*Arguments Parameters*\n\n虽然 *argument*（参数）和\
  \ *parameter*（参数）这两个术语经常交叉使用，但 C99 文档决定使用 *argument* 来指代实参或实际参数，使用 *parameter* 来指代形参或形式参数。按照这种约定，我们可以说参数是变量，而参数是由函数调用提供并赋值给相应参数的值。因此，在列表\
  \ 5.15 中，`times` 是 `pound()` 的参数，而 `n` 是 `pound()` 的参数。同样，在函数调用 `pound(times+4)`\
  \ 中，表达式 `times+4` 的值就是参数。\n\n\n\n\n第二次调用是 `pound(ch)`。在这里，`ch` 的类型是 `char`。它被初始化为字符\
  \ `!`，在 ASCII 系统上，这意味着 `ch` 的数值值为 33。但 `char` 并不是 `pound()` 函数的正确类型。这时程序顶部附近的函数原型就派上用场了。*原型*（prototype）是一种函数声明，描述了函数的返回值及其参数。这个特定的原型关于\
  \ `pound()` 函数说明了两点：\n\n![Image](img/squf.jpg) 该函数没有返回值（即 `void` 部分）。\n\n![Image](img/squf.jpg)\
  \ 该函数接受一个参数，该参数的类型为 `int` 值。\n\n在这种情况下，原型告知编译器 `pound()` 期望一个 `int` 类型的参数。作为响应，当编译器遇到\
  \ `pound(ch)` 表达式时，它会自动对 `ch` 参数应用类型转换，将其转换为 `int` 参数。在该系统上，该参数从存储在 1 字节中的 33 变为存储在\
  \ 4 字节中的 33，因此值 33 现在是正确的格式，可以作为该函数的参数使用。同样，最后一次调用 `pound(f)` 生成了一个类型转换，将 `float`\
  \ 类型变量 `f` 转换为该参数的正确类型。\n\n在 ANSI C 之前，C 使用的是不是原型的函数声明；它们只指示名称和返回类型，而不指示参数类型。为了向后兼容，C\
  \ 仍然允许这种形式：\n\n点击此处查看代码图像\n\n```c\nvoid pound();      /* 预 ANSI 函数声明 */\n```\n\n\
  如果在 `pound.c` 程序中使用这种声明形式而不是原型，会发生什么？第一次函数调用 `pound(times)` 将能够正常工作，因为 `times` 的类型是\
  \ `int`。第二次调用 `pound(ch)` 也能正常工作，因为在没有原型的情况下，C 会自动将 `char` 和 `short` 参数提升为 `int`。然而，第三次调用\
  \ `pound(f)` 将失败，因为在没有原型的情况下，`float` 会被自动提升为 `double`，这并没有多大帮助。程序仍然运行，但行为不会正确。你可以通过在函数调用中使用显式类型转换来修复它：\n\
  \n点击此处查看代码图像\n\n```c\npound ((int) f); // 强制正确类型\n```\n\n注意，如果 `f` 的值大到无法放入 `int`\
  \ 类型中，这可能仍然没有帮助。\n\n### 示例程序\n\nListing 5.16 是一个实用的程序（针对一个狭定义的人类群体），说明了本章中的几个思想。它看起来很长，但所有的计算都在最后的六行中完成。程序的大部分工作是在计算机和用户之间传递信息。我们尝试使用了足够的注释来使其几乎自解释其说。通读它，当你完成后，我们将澄清几个点。\n\
  \nListing 5.16 running.c 程序\n\n点击此处查看代码图像\n\n* *\n\n```c\n// running.c -- 一个针对跑步者的实用程序\n\
  #include <stdio.h>\n\nconst int S_PER_M = 60;         // 每分钟秒数\nconst int S_PER_H\
  \ = 3600;       // 每小时秒数\nconst double M_PER_K = 0.62137; // 每公里英里\nint main(void)\n\
  {\n    double distk, distm;  // 跑步的公里数和英里数\n    double rate;          // 每小时英里数\n\
  \    int min, sec;         // 跑步时间的分钟和秒\n    int time;             // 仅以秒数的跑步时间\n\
  \    double mtime;         // 每英里的秒数\n    int mmin, msec;       // 每英里的分钟和秒\n  \
  \  printf(\"This program converts your time for a metric race\\n\");\n    printf(\"\
  to a time for running a mile and to your average\\n\");\n    printf(\"speed in miles\
  \ per hour.\\n\");\n    printf(\"Please enter, in kilometers, the distance run.\\\
  n\");\n    scanf(\"%lf\", &distk);  // %lf 用于 double 类型\n    printf(\"Next enter\
  \ the time in minutes and seconds.\\n\");\n    printf(\"Begin by entering the minutes.\\\
  n\");\n    scanf(\"%d\", &min);\n    printf(\"Now enter the seconds.\\n\");\n  \
  \  scanf(\"%d\", &sec);\n    // 将时间转换为纯秒\n    time = S_PER_M * min + sec;\n    //\
  \ 将公里转换为英里\n    distm = M_PER_K * distk;\n    // 每秒英里 x 每小时秒 = mph\n    rate = distm\
  \ / time * S_PER_H;\n    // 时间/距离 = 每英里的时间\n    mtime = (double) time / distm;\n\
  \    mmin = (int) mtime / S_PER_M; // 找到整数分钟\n    msec = (int) mtime % S_PER_M;\
  \ // 找到剩余秒\n    printf(\"You ran %1.2f km (%1.2f miles) in %d min, %d sec.\\n\"\
  , distk, distm, min, sec);\n    printf(\"That pace corresponds to running mile in\
  \ %d min, %d sec.\\n\", mmin, msec);\n    printf(\"Your average speed was %1.2f\
  \ mph.\\n\", rate);\n    return 0;\n}\n```\n*\n\n\n\n\n`Expressions`（表达式）是运算符和操作数的组合。在\
  \ C 语言中，每个表达式都有一个值，包括赋值表达式和比较表达式。`operator precedence`（运算符优先级）规则有助于在评估表达式时确定项的组合方式。当两个运算符共享一个操作数时，应用优先级较高的那个。如果运算符优先级相等，则由结合性（从左到右或从右到左）决定先应用哪个运算符。\n\
  \n`Statements`（语句）是完整的计算机指令，在 C 中以分号结束。到目前为止，你已经接触声明语句、赋值语句、函数调用语句和控制语句。包含在大括号内的语句构成了\
  \ `compound statement`（复合语句）或 `block`（块）。一种特殊的控制语句是`while`循环，只要测试条件为真，它就会重复语句。\n\
  \n在 C 语言中，许多 `type conversions`（类型转换）会自动发生。当 `char` 和 `short` 类型出现在表达式中或作为没有原型定义的函数参数时，它们会被提升为\
  \ `int` 类型。`float` 类型在用作函数参数时会被提升为 `double` 类型。在 K&R C（但不是 ANSI C）中，`float` 在表达式中使用也会被提升为\
  \ `double`。当将一种类型的值赋值给另一种类型的变量时，该值将转换为与变量相同的类型。当较大的类型转换为较小类型时（例如 `long` 转换为 `short`\
  \ 或 `double` 转换为 `float`），可能会丢失数据。在混合算术中，较小类型将按照本章概述的规则转换为较大的类型。\n\n当你定义一个接受参数的函数时，你在函数定义中声明一个\
  \ `variable`（变量）或 `formal argument`（形式参数）。然后，在函数调用时传递的值会被赋值给这个变量，该变量现在可以在函数中使用。\n\
