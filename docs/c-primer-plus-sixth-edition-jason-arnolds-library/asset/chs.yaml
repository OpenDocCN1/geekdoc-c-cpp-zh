  \ 函数按行显示内容。\n\n**9.** 编写一个具有以下行为的程序：首先询问你想要多少个单词。然后让你输入单词，最后显示这些单词。使用 `malloc()`\
  \ 和第一个问题的答案（单词数）创建一个 `char` 指针数组。（注意，因为数组中的每个元素都是 `char` 指针）。在读取字符串时，程序应将单词读入临时数组，使用\
  \ `malloc()` 分配足够存储该单词的内存，并将 `char` 指针存储在数组中。然后将单词从临时数组复制到分配的存储中。这样，你就得到了一个指向所需大小对象的字符指针数组。一个示例运行如下：\n\
  \n点击此处查看代码图像\n\nHow many words do you wish to enter? 5\nEnter 5 words now:\nI enjoyed\
  \ this exercise\nHere are your words:\nI\nenjoyed\ndoing\nexercise\n\n\n\n\n你的交互式提示符被重定向到了\
  \ `bklist`。这不仅会将不需要的文本存入 `bklist`，还会导致你无法看到应该回答的问题。\n\n正如你所预期的，C 语言提供了更强大的文件通信方法。它允许你在程序内部打开一个文件，然后使用特殊的\
  \ I/O 函数从该文件读取或向其写入数据。在研究这些方法之前，让我们简要回顾一下文件的本质。\n\n#### 什么是文件？\n\n`file`（文件）是存储设备上的一个命名区域，通常位于磁盘上，或者最近的固态设备上。例如，你可以将\
  \ `stdio.h` 认为一个包含某些有用信息的文件的名称。然而，对于操作系统来说，文件要复杂得多。例如，一个大文件可能最终存储在几个分散的碎片中，或者它可能包含额外数据，允许操作系统判断它是什么类型的文件。但是，这些都是操作系统关心的问题，而不是你的问题（除非你正在编写操作系统）。你关心的是文件在\
  \ C 程序中是如何呈现的。\n\nC 语言将文件视为连续的字节序列，每个字节都可以被单独读取。这对应于 C 语言成长的 Unix 环境中的文件结构。由于其他环境可能并不完全对应这一模型，C\
  \ 语言提供了两种查看文件的方式：文本视图（text view）和二进制视图（binary view）。\n\n#### 文本模式与二进制模式\n\n首先，让我们区分文本与二进制内容、文本与二进制文件格式，以及文件的文本与二进制模式。\n\
  \n所有文件内容都是二进制形式（0 和 1）。但如果一个文件主要使用二进制代码（例如 ASCII 或 Unicode）来表示文本（就像 C 字符串那样），那么它就是文本文件；它具有文本内容。相反，如果文件中的二进制值代表机器语言代码或数值数据（使用与\
  \ `long` 或 `double` 值相同的内部表示）或图像或音乐编码，则内容是二进制的。\n\nUnix 对这两类内容使用相同的文件格式。不意外的是，考虑到\
  \ C 语言是作为开发 Unix 的工具而创建的，C 语言和 Unix 都使用 `\\n`（换行符）来指示文本中的换行。Unix 目录维护着文件大小计数，程序可以使用该计数来确定何时到达文件末尾（EOF）。然而，其他系统有处理文件的方法，专门用于持有文本。也就是说，它们对文本文件的格式不同于\
  \ Unix 模型。例如，在 OS X 之前的 Macintosh 文件使用 `\\r`（回车符）来指示新行。早期的 MS-DOS 文件使用 `\\r\\n`\
  \ 组合来指示换行，并使用嵌入的 Ctrl+Z 字符表示文件末尾，尽管实际文件会用额外的空字符进行填充，以使总大小成为 256 的倍数。（在 Windows 中，记事本仍然会生成\
  \ MS-DOS 格式的文本文件，但较新的编辑器可能使用更类似于 Unix 的格式。）其他系统可能会使文本文件中的每一行都具有相同的长度，在必要时用空字符填充每行以确保长度正确。或者，系统可能会在每行的开头编码该行的长度。\n\
  \n为了使文本文件的处理更具规律性，C 语言提供了两种访问文件的方式：`binary`（二进制）模式和 `text`（文本）模式。在二进制模式下，文件的每一个字节都可以被程序访问。然而，在文本模式下，程序看到的内容可能与文件内容不同。在文本视图下，当读取文件时，本地环境对行结束或文件末尾等的表示会被映射到\
  \ C 视图。同样，C 视图也会映射到输出的本地表示。例如，一个在旧版 Macintosh 上编译并使用文本模式的 C 程序在以文本模式读取文件时会将 `\\\
  r` 转换为 `\\n`，并在写入文件时将 `\\n` 转换为 `\\r`。或者，在 MS-DOS 平台上编译的 C 文本模式程序在读取文件时会将 `\\r\\\
  n` 转换为 `\\n`，在写入文件时将 `\\n` 转换为 `\\r\\n`。为其他环境编写的文本模式程序也会进行类似的调整。\n\n你并不限制仅对文本文件使用文本视图。你也可以使用同一文件的二进制视图。如果你对旧的\
  \ MS-DOS 文本文件这样做，你的程序将同时看到文件中的 `\\r` 和 `\\n` 字符；不会发生任何映射。（图 13.1 用一些航海文本说明了这一点。）\n\
  \n![图像](img/13fig01.jpg)\n\n图 13.1 二进制视图与文本视图。\n\n尽管 C 语言提供了二进制视图和文本视图，但这些视图可以以相同的方式实现。正如提到的，由于\
  \ Unix 只使用一种文件结构，因此对于 Unix 实现，这两种视图是相同的。对于 Linux 也是如此。\n\n#### I/O 级别\n\n除了选择文件的视图外，在大多数情况下，你可以在两种\
  \ I/O 级别之间进行选择（即两种处理文件访问的级别）。`低级 I/O`（Low-level I/O）使用操作系统提供的基础 I/O 服务。`标准高级 I/O`（Standard\
  \ high-level I/O）使用标准的 C 库函数包和 `stdio.h` 头文件定义。C 标准仅支持标准 I/O 包，因为没有办法保证所有的操作系统都能通过相同的低级\
  \ I/O 模型表示。特定的实现也可能提供低级库，但由于 C 标准建立了可移植的 I/O 模型，我们将专注于它。\n\n#### 标准文件\n\nC 程序会自动代表你打开三个文件。它们被称为*标准输入*（standard\
  \ input）、*标准输出*（standard output）和*标准错误输出*（standard error output）。默认输入，输入是系统的正常输入设备，通常是键盘。标准输出和标准错误输出默认都是系统的正常输出设备，通常是显示器。\n\
  \n标准输入自然而然地为程序提供输入。它是 `getchar()` 和 `scanf()` 读取的文件。标准输出是程序正常输出去的地方。它被 `putchar()`、`puts()`\
  \ 和 `printf()` 使用。正如你在第 8 章中学习的样，重定向会导致其他文件被识别为标准输入或标准输出。标准错误输出文件的目的是提供一个逻辑上独立的地方来发送错误消息。例如，如果你使用重定向将输出发送到文件而不是屏幕，发送到标准错误输出的输出仍然会显示在屏幕上。这是好事，因为如果错误消息被路由到文件中，你在查看文件之前是看不到它们的。\n\
  \n\n\n\n除了可移植性之外，标准 I/O 包相比低级 I/O 有两个优势。首先，它有许多专门的函数可以简化处理不同的 I/O 问题。例如，`printf()`\
  \ 将各种形式的数据转换为适用于终端的字符串输出。其次，输入和输出是**缓冲的**（`buffered`）。这意味着信息是以大块传输的（通常一次 512 字节或更多），而不是逐字节传输的。例如，当一个程序读取文件时，一组数据会被复制到缓冲区——一个中间存储区域。这种缓冲机制极大地提高了数据传输率。程序可以检查缓冲区中的单个字节。缓冲是在后台处理的，因此你产生了一种逐个字符访问的错觉。（你也可以对低级\
  \ I/O 进行缓冲，但你必须自己完成大部分工作。）Listing 13.1 显示了如何使用标准 I/O 读取文件并统计文件中字符数。我们将在接下来的几节中讨论\
  \ Listing 13.1 的特性。（该程序使用命令行参数。如果你是 Windows 用户，可能需要在编译后在命令提示符窗口中运行程序。如果你是 Macintosh\
  \ 用户，最简单的方法是在终端中使用命令行形式编译并运行程序。或者如第 11 章“字符串和字符串函数”中描述的那样，你可以使用 Xcode 菜单为 IDE 中的程序提供命令行参数。或者，你可以修改程序使用\
  \ `puts()` 和 `fgets()` 代替命令行参数来获取文件名。）Listing 13.1 count.c 程序\n\n点击此处查看图像 ch13_html_p013lis01\n\
  \n* *\n\n```c\n/* count.c -- 使用标准 I/O */\n\n#include <stdio.h>\n\n#include <stdlib.h>\
  \ // exit() 原型\n\nint main(int argc, char *argv[])\n{\n    int ch;           //\
  \ 存储读取的每个字符\n    FILE *fp;         // \"文件指针\"\n    unsigned long count = 0;\n\n\
  \    if (argc != 2)\n    {\n        printf(\"Usage: %s filename\\n\", argv[0]);\n\
  \        exit(EXIT_FAILURE);\n    }\n\n    if ((fp = fopen(argv[1], \"r\")) == NULL)\n\
  \    {\n        printf(\"Can't open %s\\n\", argv[1]);\n        exit(EXIT_FAILURE);\n\
  \    }\n    while ((ch = getc(fp)) != EOF)\n    {\n        putc(ch,stdout);  //\
  \ 等于 putchar(ch);\n        count++;\n    }\n    fclose(fp);\n    printf(\"File %s\
  \ has %lu characters\\n\", argv[1], count);\n    return 0;\n}\n```\n\n* *\n\n####\
  \ 检查命令行参数\n\nListing 13.1 中的程序首先检查 `argc` 的值以判断是否存在命令行参数。如果没有，程序将打印用法信息并退出。字符串 `argv[0]`\
  \ 是程序的名称。使用 `argv[0]` 而不是指定的程序名称会在更改可执行文件名时自动更改错误消息。这种功能在 Unix 等允许单个文件有多个环境中环境中方便。但要注意——某些操作系统可能不识别\
  \ `argv[0]`，因此这种用法并不是完全移植的。\n\n`exit()` 函数导致程序终止并关闭所有打开的文件。`exit()` 的参数被传递给某些操作系统，包括\
  \ Unix、Linux、Windows 以及其他程序使用的 MS-DOS。通常约定对于正常终止的程序传递 `0` 值，对于异常终止传递非零值。不同的退出值可以区分不同的失败原因，这是\
  \ Unix 和 DOS 编程中的做法。然而，并不是所有的操作系统都识别相同的范围。因此，C 标准规定了一个相当有限的范围。特别是，标准要求使用值 `0` 或宏\
  \ `EXIT_SUCCESS` 表示成功终止，并使用宏 `EXIT_FAILURE` 表示失败终止。这些宏以及 `stdlib.h` 头文件提供了 `exit()`。\n\
  \n#### 的 fopen() 函数\n\n当你的程序成功打开文件后，`fopen()` 返回一个文件指针，其他函数随后可以使用该指针来指定文件。文件指针（本例中的\
  \ `fp`）是指向 `FILE` 的指针；`FILE` 是 `stdio.h` 中定义的派生类型。指针 `fp` 并不指向实际文件，而是指向一个包含文件信息的对象，包括用于\
  \ I/O 的缓冲区信息。由于标准库中的 I/O 函数使用缓冲区，它们需要知道缓冲区在哪里。它们还需要知道缓冲区有多满以及正在使用哪个文件。这使得函数能够在需要时重新填充或清空缓冲区。`fp`\
  \ 指向的对象具有所有这些信息。（该对象是 C 结构的一个示例，这是我们在第 14 章“结构和其他数据形式](#ch14.html_ch14)”中讨论的话题。）\n\
  \n如果 `fopen()` 无法打开文件，它返回空指针（同样定义在 `stdio.h` 中）。如果 `fp` 为 `NULL`，该程序退出。`fopen()`\
  \ 函数失败可能是因为磁盘满、文件不在搜索目录、名称非法、访问受限或硬件问题（仅举几个原因），所以要检查故障；一点小的错误处理大有裨益。\n\n注意！\n\n\
  如果你对现有文件使用任何不带 `x` 的 `\"w\"` 模式，文件内容将被截断，以便你的程序从干净的状态开始。然而，如果你尝试用其中一种 C 模式打开现有文件，尝试将失败，使文件不受损坏。\n\
  \n#### getc() 和 putc() 函数\n\n`getc()` 和 `putc()` 这两个函数的工作方式非常像 `getchar()` 和 `putchar()`。区别在于你必须告诉这些新成员要使用哪个文件。因此，下面的老兵语句意味着“从标准输入获取一个字符”：\n\
  \n```c\nch = getchar();\n```\n\n然而，这条语句意味着“从 `fp` 标识的文件获取一个字符”：\n\n```c\nch = getc(fp);\n\
  ```\n\n\n\n\n```c\nch = getc(fp);\n```\n\n同样，这条语句的意思是将字符 `ch` 放入由 `FILE` 指针 `fpout`\
  \ 所标识的文件中：\n\n```c\nputc(ch, fpout);\n```\n\n在 `putc()` 的参数列表中，字符在前面，然后是文件指针。\n\n\
  `列表 13.1` 使用 `stdout` 作为 `putc()` 的第二个参数。它在 `stdio.h` 中被定义为与标准输出关联的文件指针，因此 `putc(ch,stdout)`\
  \ 与 `putchar(ch)` 相同。事实上，后者通常被定义为前者的形式。同样地，`getchar()` 被定义为使用标准输入的 `getc()`。\n\n\
  你可能会奇怪，为什么这个示例使用了 `putc()` 而不是 `putchar()`。原因之一是为了介绍 `putc()` 函数。另一个原因是你可以通过使用 `stdout`\
  \ 以外的参数轻松地将此程序转换为生成文件输出。\n\n### 文件结束 (End-of-File)\n\n从文件中读取数据的程序在到达文件末尾时需要停止。程序如何判断是否已到达末尾呢？如果\
  \ `getc()` 尝试读取字符并发现已到达文件末尾，它会返回特殊值 `EOF`。因此，C 程序只有在尝试读取文件末尾之后才会发现已到达了文件末尾。（这与某些语言的行为不同，那些语言使用特殊函数在尝试读取*之前*测试文件是否结束。）\n\
  \n为了避免在尝试读取空文件时出现问题，对于文件输入，你应该使用带有入口条件的的循环（而不是 `do-while` 循环）。由于 `getc()`（以及其他 C\
  \ 输入函数）的设计，程序应该在进入循环体之前尝试第一次读取。因此，以下设计是良好的：\n\n`点击此处查看代码图片`\n\n```c\n//良好的设计 #1\n\
  int ch;             // 用 int 存储 EOF\nFILE * fp;\nfp = fopen(\"wacky.txt\", \"r\"\
  );\nch = getc(fp);      // 获取初始输入\nwhile (ch != EOF)\n{\n    putchar(ch);    //\
  \ 处理输入\n    ch = getc(fp);  // 获取下一个输入\n}\n```\n\n这可以简化为以下设计：\n\n`点击此处查看代码图片`\n\n\
  ```c\n//良好的设计 #2\nint ch;\nFILE * fp;\nfp = fopen(\"wacky.txt\", \"r\");\nwhile\
  \ (( ch = getc(fp)) != EOF)\n{\n    putchar(ch);  // 处理输入\n}\n```\n\n由于输入语句是 `while`\
  \ 测试条件的一部分，它在程序进入循环体之前就已经执行了。\n\n你应该避免这种类型的设计：\n\n`点击此处查看代码图片`\n\n```c\n//不佳的设计（两个问题）\n\
  int ch;\nFILE * fp;\nfp = fopen(\"wacky.txt\", \"r\");\nwhile (ch != EOF)    //\
  \ 第一次使用时 ch 的值是不定的\n{\n    ch = getc(fp);  // 获取输入\n    putchar(ch);      // 处理输入\n\
  }\n```\n\n第一个问题是，当 `ch` 第一次与 `EOF` 比较时，它还没有被赋值。第二个问题是，如果 `getc()` 确实返回了 `EOF`，循环会尝试将\
  \ `EOF` 作为有效字符来处理。这些缺陷是可以修复的。例如，你可以将 `ch` 初始化为一个哑值并在循环内部放置一个 `if` 语句，但既然已经有了良好的设计，何何费此呢。\n\
  \n这些警告也适用于其他输入函数。它们在遇到文件末尾后也会返回一个错误信号（`EOF` 或 `NULL` 指针）。\n\n### fclose() 函数\n\n\
  `fclose(fp)` 函数关闭由 `fp` 标识的文件，并在需要刷新缓冲区。对于一个比这个程序更严谨的程序，你应该检查文件是否已成功关闭。`fclose()`\
  \ 函数在成功时返回 `0`，失败时返回 `EOF`：\n\n`点击此处查看代码图片`\n\n```c\nif (fclose(fp) != 0)\n    printf(\"\
  Error in closing file %s\\n\", argv[1]);\n```\n\n`fclose()` 函数可能会失败，例如磁盘已满、可移动存储设备已被移除，或者发生了\
  \ I/O 错误。\n\n### 指向标准文件的指针\n\n`stdio.h` 文件将三个文件指针与 C 程序自动打开的三个标准文件关联：\n\n![图像](img/574tab01.jpg)\n\
  \n这些指针的类型都是 `pointer-to-FILE`，因此它们可以作为标准 I/O 函数的参数，就像示例中的 `fp` 一样。让我们创建一个新文件并向其写入内容的示例。\n\
  \n### 一个简单的压缩程序\n\n下一个程序将数据从一个文件复制到另一个文件。它同时打开两个文件，一个使用 `\"r\"`，另一个使用 `\"w\"`。`列表\
  \ 13.2` 显示了它通过保留每第三个字符来缩小第一个文件。最后，它将压缩后的文本放入第二个文件中。第二个文件名是原文件名加上 `.red`。正如你所看到的，使用命令行参数更有局限性。\n\
  \n```c\n//13.2\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n\n\
  int main(int argc, char *argv[])\n{\n    FILE *in, *out; // 声明 FILE 指针\n    int\
  \ ch;\n    char name[LEN]; // 输出存储空间\n    int count = 0;\n\n    // 检查命令行参数\n   \
  \ if (argc < 2)\n    {\n        fprintf(stderr, \"Usage: %s\\n\", argv[0]);\n  \
  \      exit(EXIT_FAILURE);\n    }\n    // 设置输入\n    if ((in = fopen(argv[1], \"\
  r\")) == NULL)\n    {\n        fprintf(stderr,\"I couldn't open the file \\\"%s\\\
  \"\\n\", argv[1]);\n        exit(3);\n    }\n    // 设置输出\n    strncpy(name,argv[1],\
  \ LEN - 5); // 复制文件名\n    name[LEN - 5] = '\\0';\n    strcat(name,\"\".red\"); //\
  \ 附加 .red\n    if ((out = fopen(name, \"w\")) == NULL)\n    {\n        fprintf(stderr,\"\
  Can't create output file.\\n\");\n        exit(3);\n    }\n    // 复制数据\n    while\
  \ ((ch = getc(in)) != EOF)\n    {\n        if (count++ % 3 == 0)\n            putc(ch,\
  \ out); // 打印第三个字符\n    }\n    // 清理\n    if (fclose(in) != 0 || fclose(out) !=\
  \ 0)\n    {\n        fprintf(stderr,\"Error in closing files\\n\");\n    }\n   \
  \ return 0;\n}\n```\n\n* *\n\n这个示例展示了几种编程技术。我们现在来检查其中一些。\n\n`fprintf()` 函数类似于 `printf()`，区别在于它需要一个文件指针作为第一个参数。我们使用\
  \ `stderr` 指针将错误消息发送到标准错误；这是标准的 C 做法。\n\n\n\n\n为了构造输出文件的新名称，程序使用 `strncpy()` 将名称\
  \ `eddy` 拷贝到数组 `name` 中。参数 `LEN - 5` 为 `.red` 后缀和最后的空字符留出了空间。如果 `argv[2]` 字符串的长度大于\
  \ `LEN – 5`，则不会复制空字符，因此程序会以防万一地添加一个空字符。在调用 `strncpy()` 之后，`name` 中的第一个空字符会在 `strcat()`\
  \ 函数附加该字符串时被 `.red` 中的点覆盖，在这种情况下，它生成了 `eddy.red`。我们还检查了程序是否成功打开了同名文件。这在某些环境中尤为重要，因为像\
  \ `strange.c.red` 这样的可能是无效的。例如，在传统的 DOS 下，你不能为扩展名添加扩展名。（正确的 MS-DOS 方法是将任何现有扩展名替换为\
  \ `.red`，因此 `strange.c` 的简化版本将是 `strange.red`。例如，你可以使用 `strchr()` 函数来定位名称中的点（如果有），并仅复制点之前的字符串部分。）\n\
  \n该程序同时打开了两个文件，因此我们声明了两个 `FILE` 指针。注意，每个文件的打开和关闭都是独立的。一次可以打开的文件数量是有限制的。限制取决于你的系统和实现；范围通常是\
  \ 10 到 20 之间。只要这些文件没有同时打开，就可以对不同的文件使用同一个文件指针。\n\n### 文件 I/O：`fprintf()`、`fscanf()`、`fgets()`\
  \ 和 `fputs()`\n\n对于前面章节中的每个 I/O 函数，都有类似的文件 I/O 函数。主要的区别在于你需要使用 `FILE` 指针来告诉新函数要对哪个文件进行操作。类似于\
  \ `getc()` 和 `putc()`，这些函数要求你通过使用指向 `FILE` 的指针（如 `stdout`）来标识文件，或者使用 `fopen()` 的返回值。\n\
  \n#### `fprintf()` 和 `fscanf()` 函数\n\n文件 I/O 函数 `fprintf()` 和 `fscanf()` 的工作方式与\
  \ `printf()` 和 `scanf()` 相同，但它们需要一个额外的第一个参数来识别正确的文件。你已经使用过 `fprintf()` 了。列表 13.3\
  \ 展示了这两个文件 I/O 函数以及 `rewind()` 函数。\n\n列表 13.3 程序 addaword.c\n\n点击此处查看代码图像\n\n```c\n\
  /* addaword.c -- uses fprintf(), fscanf(), and rewind() */\n#include <stdio.h>\n\
  #include <stdlib.h>\n#include <string.h>\n#define MAX 41\n\nint main(void)\n{\n\
  \    FILE *fp;\n    char words[MAX];\n    if ((fp = fopen(\"wordy\", \"a+\")) ==\
  \ NULL)\n    {\n        fprintf(stdout,\"Can't open \\\"wordy\\\" file.\\n\");\n\
  \        exit(EXIT_FAILURE);\n    }\n    puts(\"Enter words to add to the file;\
  \ press the #\");\n    puts(\"key at the beginning of a line to terminate.\");\n\
  \    while ((fscanf(stdin,\"%40s\", words) == 1)  && (words[0] != '#'))\n      \
  \  fprintf(fp, \"%s\\n\", words);\n    puts(\"File contents:\");\n    rewind(fp);\
  \             /* go back to beginning of file */\n    while (fscanf(fp,\"%s\",words)\
  \ == 1)\n        puts(words);\n    puts(\"Done!\");\n    if (fclose(fp) != 0)\n\
  \        fprintf(stderr,\"Error closing file\\n\");\n    return 0;\n}\n```\n\n该程序允许你向文件中添加单词。通过使用\
  \ `\"a+\"` 模式，程序可以对文件进行读写操作。第一次使用该程序时，它会创建 `wordy` 文件并允许你向其中放置单词，每行一个。当你后续使用该程序时，它允许你向先之前的内容添加（追加）单词。追加模式仅允许你向文件末尾添加材料，但\
  \ `\"a+\"` 模式确实允许你读取整个文件。`rewind()` 命令将程序带回文件开头，以便最后的 `while` 循环可以打印文件内容。注意 `rewind()`\
  \ 接受一个文件指针参数。\n\n以下是来自 Unix 环境的示例运行（可执行程序已重命名为 `addaword`）：\n\n```\n$ addaword\n\
  Enter words to add to the file; press the Enter\nkey at the beginning of a line\
  \ to terminate.\n#\nFile contents:\nDone!\n$ addaword\nEnter words to add to the\
  \ file; press the Enter\nkey at the beginning of a line to terminate.\n#\nFile contents:\n\
  Done!\n```\n\n如你所见，`fprintf()` 和 `fscanf()` 的工作就像 `printf()` 和 `scanf()`。与 `putc()`\
  \ 不同，`fprintf()` 和 `fscanf()` 函数将 `FILE` 指针作为第一个参数。\n\n#### `fgets()` 和 `fputs()`\
  \ 函数\n\n你在第 1 章中遇到过 `fgets()`。第一个参数类似于 `gets()`，是输入应该存储的地址（`char *`）。第二个参数是一个表示输入最大大小的整数。最后一个参数是标识要读取文件的文件指针。函数调用形式如下：\n\
  ```c\nfgets(buf, STLEN, fp);\n```\n`buf` 是 `char` 数组，`STLEN` 是输入的大小，`fp` 是指向 `FILE`\
  \ 的指针。正如我们之前看到的，`fgets()` 读取直到遇到换行符或文件末尾，并将换行符放入字符串中。如果 `fgets()` 在遇到文件结束符之前达到了限制，它会返回\
  \ `NULL`。``puts()` 函数接受两个参数：首先是字符串地址，然后是文件指针。与 `puts()` 不同，`fputs()` 在打印时不会添加换行符。正如列表\
  \ 1.8 所示，即使 `STLEN` 小于输入长度，它们也能很好地工作。\n\n### 随机访问：`fseek()` 和 `ftell()`\n\n`fseek()`\
  \ 函数允许你像数组一样处理文件，并直接移动到 `fopen()` 打开文件的任何字节。为了看到它的工作原理，让我们创建一个（见列表 13.4）反序显示文件的程序。注意\
  \ `fseek()` 有三个参数并返回一个 `int` 值。`ftell()` 函数作为 `long` 值返回文件中的当前位置。\n\n\n\n\n```c\n\
  return 0;\n\n}\n```\n\n***\n\n这里是示例文件的输出：\n\n点击此处查看代码图像\n\n输入要处理的文件名：\n\nCluv\n\n\
  .C ni eno naht ylevol erom margorp a 一个比以前更更好的程序\n\nees renen llahs I taht kniht\
  \ I 我认为应该循环\n\n该程序使用二进制模式，以便同时处理 MS-DOS 文本文件和 Unix 文件。然而，在某些其他格式文本文件的环境中，它可能无法正常工作。\n\
  \n***\n\n# 注意事项\n\n如果你从命令行环境运行该程序，该程序期望文件名与可执行程序位于同一个目录（或文件夹）中。如果你在 IDE 中运行程序，程序查找文件的位置取决于实现方式。例如，默认情况下，Microsoft\
  \ Visual Studio 2012 在包含源代码的目录查找，而 Xcode 4.6 则在包含可执行文件的目录查找。\n\n***\n\n我们现在需要讨论三个主题：`fseek()`\
  \ 和 `ftell()` 如何工作、如何使用二进制流，以及如何使程序具有移植性。\n\n## fseek() 和 ftell() 如何工作\n\n`fseek()`\
  \ 的三个参数中的第一个是指向要搜索文件的 `FILE` 指针。该文件应该已经通过 `fopen()` 打开。\n\n`fseek()` 的第二个参数称为 `offset`（偏移量）。该参数告诉程序从起点移动多少距离（参见下文模式起始点的列表）。该参数必须是一个\
  \ `long` 值。它可以是正数（向前移动）、负数（向后移动）或零（停留）。\n\n第三个参数是模式，它标识起始点。自从 ANSI 标准以来，`stdio.h`\
  \ 头文件为模式指定了以下显式常量：\n\n![图像](img/581tab01.jpg)\n\n较旧的实现可能缺少这些定义，而是分别使用数值值 `0L`、`1L`\
  \ 和 `2L` 表示这些模式。请记住，`L` 后缀标识类型为 `long` 值。或者实现可能在不同的头文件中定义了这些常量。如果有疑问，请查阅你的用户手册或在线手册。\n\
  \n以下是一些示例函数调用，其中 `fp` 是一个文件指针：\n\n点击此处查看代码图像\n\n```c\nfseek(fp, 0L, SEEK_SET); \
  \  // 到文件开头\nfseek(fp, 10L, SEEK_SET);  // 向文件中移动 10 字节\nfseek(fp, 2L, SEEK_CUR);\
  \   // 从当前位置前进 2 字节\nfseek(fp, 0L, SEEK_END);   // 到文件末尾\nfseek(fp, -10L, SEEK_END);\
  \ // 从文件末尾回退 10 字节\n```\n\n这些调用可能存在一些限制；我们稍后会回到那个话题。\n\n如果一切正常，`fseek()` 返回的值为 `0`；如果发生错误（例如尝试越文件边界），则返回\
  \ `-1`。\n\n`ftell()` 函数的类型为 `long`，它返回当前的文件位置。在 ANSI C 下，它在 `stdio.h` 中声明。在最初对 Unix\
  \ 的实现中，`ftell()` 通过返回从开始计算的字节数来指定文件位置，第一个字节为字节 0，依此类推。在 ANSI C 下，此定义适用于以二进制模式打开的文件，但不一定适用于以文本模式打开的文件。这就是为什么\
  \ 列表 13.4 使用二进制模式的原因之一。\n\n现在我们可以检查 列表 13.4 的基本元素。首先，语句\n\n```c\nfseek(fp, 0L, SEEK_END);\n\
  ```\n\n将位置设置为距离文件末尾偏移 0 字节。也就是说，它将位置设置为文件末尾。接下来，语句\n\n```c\nlast = ftell(fp);\n\
  ```\n\n将从文件开始到末尾的字节数赋值给 `last`。\n\n接下来是这个循环：\n\n点击此处查看代码图像\n\n```c\nfor (count =\
  \ 1L; count <= last; count++)\n{\n  fseek(fp, -count, SEEK_END);    /* 后移 */\n \
  \ ch = getc(fp);\n}\n```\n\n第一个循环将程序定位在文件末尾之前的第一个字符（即文件的最后一个字符）。然后程序打印该字符。下一个循环将程序定位在前一个字符并打印它。这个过程一直持续到到达并打印第一个字符。\n\
  \n## 二进制模式与文本模式\n\n我们设计的 列表 13.4 用于在 Unix 和 MS-DOS 环境中运行。Unix 只有一种文件格式，因此不需要特殊的调整。然而，MS-DOS\
  \ 确实需要额外的关注。许多 MS-DOS 编辑器用 `Ctrl+Z` 字符标记文本文件的结束。当以文本模式打开此类文件时，C 语言将此字符识别为文件结束的标记。然而，当以二进制模式打开同一个文件时，`Ctrl+Z`\
  \ 字符只是文件中的另一个字符，实际的文件结束会在之后出现。它可能紧跟在 `Ctrl+Z` 之后，或者文件可能会填充空字符以使大小成为例如 256 的倍数。空字符在\
  \ DOS 下不会打印，我们包含了代码以防止程序尝试打印 `Ctrl+Z` 字符。\n\n另一个区别是我们之前提到的：MS-DOS 用 `\\r\\n` 组合表示文本文件的换行符。以文本模式打开同一文件的\
  \ C 程序“看到” `\\r\\n` 为简单的 `\\n`，但在使用二进制模式时，程序会看到这两个字符。因此，我们包含了代码来抑制打印 `\\r`。因为 Unix\
  \ 文本文件通常既不包含 `Ctrl+Z` 包含 `\\r`，这段额外的代码不会影响大多数 Unix 文本文件。\n\n`ftell()` 函数在文本模式下的工作方式可能与二进制模式不同。许多系统的文本文件格式与\
  \ Unix 模型有很大不同，以至于从开始的字节计数不是一个有意义的数量。ANSI C 规定，对于文本模式，`ftell()` 返回一个可以作为 `fseek()`\
  \ 第二参数的值。例如，对于 MS-DOS，可以看到单个字节。\n\n## 移植性\n\n理想情况下，`fseek()` 和 `ftell()` 应符合 Unix\
  \ 模型。然而，现实系统的差异有时使得这不再可能。因此，ANSI 对这些函数降低了预期。这里是一些限制：\n\n![图像](img/sqf.jpg) 在二进制模式下，实现不需要支持\
  \ `SEEK_END` 模式。那么 列表 13.4 并不保证是移植的。更具移植性的方法是逐字节读取文件。但顺序读取文件以找到结尾比直接跳转要慢。C 处理器条件编译指令在第\
  \ 16 章中讨论，“C 处理器与 C 标准库,”为处理替代选择提供了一种系统方法。\n\n![图像](img/sqf.jpg) 在文本模式下，保证有效的 `fseek()`\
  \ 调用只有这些：\n\n![图像](img/583tab01.jpg)\n\n幸运的是，许多常见环境允许这些函数有更强的实现。\n\n## fgetpos()\
  \ 和 fsetpos() 函数\n\n`fseek()` 和 `ftell()` 的一个潜在问题是它们限制了文件大小为 `long` 可以表示的值。也许二十亿字节看起来足够了，但存储设备容量不断增加使得更大的文件成为可能。ANSI\
  \ C 引入了两个新的定位函数，用于处理更大的文件大小。它不再使用 `long` 值来表示位置，而是使用一个新类型 `fpos_t`（用于文件位置类型）来实现该目的。`fpos_t`\
  \ 类型不是基本类型；相反，它是基于其他类型定义的。一个 `fpos_t` 类型的变量或数据对象可以指定文件内的位置，它不是数组类型，但除此之外其性质未规定。实现可以提供满足特定平台需求的类型。\n\
  \nANSI C 确实定义了 `fpos_t` 的使用方法。`fgetpos()` 函数具有如下原型\n\n\n\n\n\n- 点击此处查看代码图片\n\n```\n\
  int fgetpos(FILE * restrict stream, fpos_t * restrict pos);\n```\n\n调用时，它会将一个 `fpos_t`\
  \ 值放入 `pos` 指向的位置内存中；该值描述了文件中的一个位置。函数成功时返回 0，失败时返回非零值。\n\n`fsetpos()` 函数的原型如下：\n\
  \n点击此处查看代码图片\n\n```\nint fsetpos(FILE *stream, const fpos_t *pos);\n```\n\n调用时，它使用\
  \ `pos` 指向的位置内存中的 `fpos_t` 值将文件指针设置为该值所指示的位置。函数成功时返回 0，失败时返回非零值。该 `fpos_t` 值应该通过之前调用\
  \ `fgetpos()` 获取的。\n\n### 标准 I/O 的内部机制\n\n现在你已经了解了标准 I/O 包的一些特性，让我们来检查一个代表性的概念模型，看看标准\
  \ I/O 是如何工作的。\n\n通常，使用标准 I/O 的第一步是使用 `fopen()` 打开一个文件。（然而，请记住，`stdin`、`stdout` 和\
  \ `stderr` 文件是自动打开的。）`fopen()` 函数不仅打开文件，还会设置一个缓冲区（读写模式下有两个缓冲区），并设置一个包含文件信息和缓冲区信息的数据结构。此外，`fopen()`\
  \ 返回指向该结构的指针，以便其他函数知道去哪里找到它。假设该值被赋值给名为 `fp` 的指针变量。`fopen()` 函数被称为“打开一个流”。如果文件以文本模式打开，你将得到一个文本流；如果文件以二进制模式打开，你将得到一个二进制流。\n\
  \n该数据结构通常包含一个文件位置指示器，用于指定流中的当前位置。它还有错误和文件结束的指示器、一个指向缓冲区起始位置指针、一个文件标识符，以及实际复制到缓冲区中的字节数计数。\n\
  \n让我们关注文件输入。通常，下一步是调用 `stdio.h` 中声明的输入函数之一，例如 `fscanf()`、`getc()` 或 `fgets()`。调用这些函数中的任何一个都会导致数据数据从文件复制到缓冲区。缓冲区的大小取决于实现，但通常是\
  \ 512 字节或其倍数，例如 4,096 或 16,384 字节。（随着硬盘和计算机内存的增大，缓冲区大小的选择往往也会增大。）除了填充缓冲区外，初始函数调用还会设置\
  \ `fp` 指向的结构中的值。特别是流中的当前位置和复制到缓冲区中的字节数会被设置。通常当前位置从第 0 字节开始。\n\n在数据结构和缓冲区初始化后，输入函数从缓冲区中读取请求的数据。在读取过程中，文件位置指示器被设置为指向最后一个读取字符之后的下一个字符。由于\
  \ `stdio.h` 系列中的所有输入函数都使用同一个缓冲区，因此调用其中任何一个函数都会从上一次调用任何函数停止的地方继续。\n\n当输入函数发现它已读取了缓冲区中的所有字符时，它会请求从文件中复制下一个缓冲区大小的数据块到缓冲区中。通过这种方式，输入函数可以读取直到文件结束的所有文件内容。当函数读取完最后一个缓冲区大小数据的最后一个字符后，它会将文件结束指示器设置为真。下一次调用输入函数将返回\
  \ `EOF`。\n\n类似地，输出函数写入缓冲区。当缓冲区填满时，数据会被复制到文件中。\n\n### 其他标准 I/O 函数\n\nANSI 标准库包含标准\
  \ I/O 族中的三十多个函数。虽然我们在这里没有涵盖所有函数，但我们将简要描述另外几个，让你更好地了解有哪些可用函数。我们将通过每个函数的 C 原型列出它们，以指示其参数和返回值。在我们讨论的这些函数中，除\
  \ `setvbuf()` 外，所有在预 ANSI 实现中也是可用的。章节 V“带有 C99 扩展的标准 ANSI C Library”列出了完整的 ANSI\
  \ C 标准 I/O 包。\n\n#### int ungetc(int c, FILE *fp) 函数\n\n`int ungetc()` 函数将由 `c`\
  \ 指定字符推回输入流。如果你向输入流推回一个字符，下一次调用标准输入函数时将读取该字符（参见图 13.2）。例如，假设你想让一个函数读取字符直到但不包括下一个冒号。你可以使用\
  \ `getchar()` 或 `getc()` 读取字符直到读到冒号，然后使用 `ungetc()` 将冒号推回输入流。ANSI C 标准保证一次只允许一次推回。如果某种实现允许你连续推回几个字符，则输入函数读取它们的顺序与推回的顺序相反。\n\
  \n![Image](img/13fig02.jpg)\n\n图 13.2 `ungetc()` 函数。\n\n#### int fflush() 函数\n\n\
  `fflush()` 的原型如下：\n\n```\nint fflush(FILE *fp);\n```\n\n调用 `fflush()` 函数会导致缓冲区中未写入的数据发送到\
  \ `fp` 标识的文件。这一过程被称为刷新缓冲区。如果 `fp` 为空指针，所有输出缓冲区都会刷新。在输入流上使用 `fflush()` 的效果是未定义的。\n\
  \n#### int setvbuf() 函数\n\n`setvbuf()` 的原型如下：\n\n点击此处查看代码图片\n\n```\nint setvbuf(FILE\
  \ * restrict fp, char * restrict buf, int mode, size_t size);\n```\n\n`setvbuf()`\
  \ 函数为标准/O 函数设置一个替代缓冲区。它在文件打开后、执行任何其他操作之前调用。指针 `fp` 标识流，`buf` 指向要使用的存储。如果 `buf` 的值不是\
  \ `NULL`，你必须创建该缓冲区。然而，如果你对 `buf` 使用 `NULL`，该函数将自行分配缓冲区。变量 `size` 告诉 `setvbuf()`\
  \ 数组有多大。（`size_t` 类型是一种派生整数类型，参见第 5 章](#ch05）。`mode` 从以下选项中选择：`_IOFBF` 表示全缓冲（满时刷新），`_IOLBF`\
  \ 表示行缓冲（满时或写入换行符时刷新），`_IONBF` 表示无缓冲。函数成功时返回 0，否则返回非零。\n\n假设你有一个程序处理大小为 3000 字节的存储对象。你可以使用\
  \ `setvbuf()` 创建一个大小为数据对象大小倍数的缓冲区。\n\n#### 二进制 I/O：fread() 和 fwrite()\n\n`fread()`\
  \ 和 `fwrite()` 函数是列表中的下一个，但在之前先有一些背景。到目前为止使用的标准 I/O 函数都是面向文本的，处理字符和字符串。如果你想在文件中保存数值数据怎么办？诚然，你可以使用\
  \ `fprintf()` 和 `%f` 格式来保存浮点值，但那时你是将其作为字符序列保存的。例如，代码\n\n```\ndouble num = 1./3.;\n\
  \nfprintf(fp,\"%f\", num);\n```\n\n\n\n\n将 `num` 保存为八个字符组成的序列：`0.333333`。使用 `%.2f`\
  \ 格式符将其保存为四个字符：`0.33`。使用 `%.12f` 格式符将其保存为 14 个字符：`0.333333333333`。更改格式符会改变存储该值所需的空间；它还可能导致存储不同的值。当\
  \ `num` 的值被存储为 `0.33` 后，在读取文件时无法找回原始精度。通常情况下，`fprintf()` 将数值转换为字符数据，可能会改变数值。\n\n\
  存储数字最准确且一致的方法是使用与计算机相同的位模式。因此，一个 `double` 值应该存储在大小为 `double` 的单元中。当使用与程序相同的表示法将数据存储在文件中时，我们称该数据以`二进制形式`（binary\
  \ form）存储。不存在从数值形式到字符序列的转换。对于标准 I/O，`fread()` 和 `fwrite()` 函数提供了这种二进制服务（参见图 13.3）。\n\
  \n![Image](img/13fig03.jpg)\n\n图 13.3 二进制和文本输出。\n\n实际上，正如你可能记得的，所有数据都是以`二进制形式`存储的。字符也是使用字符编码的二进制表示存储的。然而，如果文件中所有数据都被解释为字符编码，我们称该文件包含`文本数据`。如果部分或全部数据被解释为`二进制形式`的数值数据，我们称该文件包含`二进制数据`。（此外，数据代表机器语言指令的文件是二进制文件。）\n\
  \n`binary` 和 `text` 这两个术语的使用可能会引起混淆。ANSI C 识别了打开文件的两种模式：二进制和文本。许多操作系统识别两种文件格式：二进制和文本。信息可以以二进制数据或文本数据的形式存储或读取。这些之间都是相关的，但并不等同。你可以以二进制模式打开文本格式的文件。你可以在二进制格式文件中存储文本。你可以使用\
  \ `getc()` 来复制包含二进制数据的文件。然而，通常情况下，你使用二进制模式在二进制格式文件中存储二进制数据。同样，你最经常在以文本格式打开的文本文件中使用文本数据。（文字处理器产生的文件通常是二进制文件，因为它们包含了许多描述字体和格式的非文本信息。）\n\
  \n### `size_t fwrite()` 函数\n\n`fwrite()` 的原型如下：\n\n点击此处查看代码图像\n\n```c\nsize_t fwrite(const\
  \ void * restrict ptr, size_t size, size_t nmemb,\n                FILE * restrict\
  \ fp);\n```\n\n`fwrite()` 函数将二进制数据写入文件。`size_t` 类型根据标准 C 类型定义。它是 `sizeof` 运算符返回的类型。通常情况下，它是\
  \ `unsigned int`，但实现版本可以选择另一种类型。指针 `ptr` 是要写入的数据块的地址。此外，`size` 代表要写入的数据块的大小（以字节为单位），`nmemb`\
  \ 代表要写入的数据块数量。按照习惯，`fp` 标识要写入的文件。例如，为了保存一个大小为 256 字节的数据对象（如数组），你可以这样做：\n\n```c\n\
  char buffer[256];\nfwrite(buffer, 256, 1, fp);\n```\n\n此调用将 `buffer` 中的一个 256 字节的数据块写入文件。或者，为了保存包含\
  \ 10 个 `double` 值的数组，你可以这样做：\n\n点击此处查看代码图像\n\n```c\ndouble earnings[10];\nfwrite(earnings,\
  \ sizeof (double), 10, fp);\n```\n\n此调用将 `earnings` 数组中的数据分 10 个块写入文件，每个块的大小为 `double`。\n\
  \n你可能注意到了 `fwrite()` 原型中 `const void * restrict ptr` 奇怪的声明。`fwrite()` 的一个问题是它的第一个参数不是固定类型。例如，第一个示例使用了\
  \ `buffer`，其类型为指向 `char` 的指针；而第二个示例使用了 `earnings`，其类型为指向 `double` 的指针。在 ANSI C 函数原型下，这些实际参数被转换为指向\
  \ `void` 的指针类型，该类型充当了指针的通用类型。（Pre-ANSI C 使用 `char *` 类型作为此参数，要求你将实际参数转换为该类型。）\n\n\
  `fwrite()` 函数返回成功写入的项目数。通常情况下，这等于 `nmemb`，但如果发生写入错误，它可能会更小。\n\n### `size_t fread()`\
  \ 函数\n\n`fread()` 的原型如下：\n\n点击此处查看代码图像\n\n```c\nsize_t fread(void * restrict ptr,\
  \ size_t size, size_t nmemb,\n              FILE * restrict fp);\n```\n\n`fread()`\
  \ 函数采用与 `fwrite()` 相同的参数 set。这次 `ptr` 是将读取数据的内存地址，`fp` 标识要读取的文件。例如，为了恢复 10 个 `double`，请使用此代码：\n\
  \n点击此处查看代码图像\n\n```c\ndouble earnings[10];\nfread(earnings, sizeof (double), 10,\
  \ fp);\n```\n\n此调用将数据块 复制到 `earnings` 数组中。`fread()` 函数返回成功读取的项目数。通常情况下，这等于 `nmemb`，但如果发生读取错误或到达末尾，它可能会更小。\n\
  \n### `int feof(FILE *fp)` 和 `int ferror(FILE *fp)` 函数\n\n当标准输入函数返回 `EOF` 时，通常意味着它们已到达文件末尾。然而，它也可能指示错误。`feof()`\
  \ 和 `ferror()` 函数允许你区分这两种可能性。`feof()` 函数在最后一次输入检测到文件结束时返回非零值，否则返回零。`ferror()` 在发生错误时返回非零值。\n\
  \n### `fread()` 和 `fwrite()` 示例\n\n让我们使用这些函数编写一个将文件列表的内容追加到另一个文件的程序。一个问题是传递文件信息。这可以通过交互式或通过命令行参数完成。我们将采用第一种方法，它建议了以下几行：\n\
  \n1. 以追加模式打开目标文件。\n2. 如果无法操作，退出。\n3. 为该文件建立 4096 字节的缓冲区。\n4. 如果无法操作，退出。\n\n同样，我们可以通过对每个文件执行以下操作来完善复制部分：\n\
  \n- 如果与目标文件相同，则跳过下一个文件。\n- 如果无法以读取模式打开，则跳过下一个文件。\n- 将文件内容追加到目标文件中。\n\n\n\n```c\n\
  \    char file_src[SLEN];  // name of source file\n\n    int ch;\n\n    puts(\"\
  Enter name of destination file:\");\n    s_gets(file_app, SLEN);\n\n    if ((fa\
  \ = fopen(file_app, \"a+\")) == NULL)\n    {\n        fprintf(stderr, \"Can't open\
  \ %s\\n\", file_app);\n        exit(EXIT_FAILURE);\n    }\n    if (setvbuf(fa, NULL,\
  \ _IOFBF, BUFSIZE) != 0)\n    {\n        fputs(\"Can't create output buffer\\n\"\
  , stderr);\n        exit(EXIT_FAILURE);\n    }\n    puts(\"Enter name of first source\
  \ file (empty line to quit):\");\n    while (s_gets(file_src, SLEN) && file_src[0]\
  \ != '\\0')\n    {\n        if (strcmp(file_src, file_app) == 0)\n            fputs(\"\
  Can't append file to itself\\n\",stderr);\n        else if ((fs = fopen(file_src,\
  \ \"r\")) == NULL)\n            fprintf(stderr, \"Can't open %s\\n\", file_src);\n\
  \        else\n        {\n            if (setvbuf(fs, NULL, _IOFBF, BUFSIZE) !=\
  \ 0)\n            {\n                fputs(\"Can't create input buffer\\n\",stderr);\n\
  \                continue;\n            }\n            append(fs, fa);\n       \
  \     if (ferror(fs) != 0)\n                fprintf(stderr,\"Error in reading file\
  \ %s.\\n\", file_src);\n            if (ferror(fa) != 0)\n                fprintf(stderr,\"\
  Error in writing file %s.\\n\", file_app);\n            fclose(fs);\n          \
  \  files++;\n            printf(\"File %s appended.\\n\", file_src);\n         \
  \   puts(\"Next file (empty line to quit):\");\n        }\n    }\n    printf(\"\
  Done appending. %d files appended.\\n\", files);\n    rewind(fa);\n    printf(\"\
  %s contents:\\n\", file_app);\n    while ((ch = getc(fa)) != EOF)\n        putchar(ch);\n\
  \    puts(\"Done displaying.\");\n    fclose(fa);\n    return 0;\n}\n\nvoid append(FILE\
  \ *source, FILE *dest)\n{\n    size_t bytes;\n    static char temp[BUFSIZE]; //\
  \ allocate once\n    while ((bytes = fread(temp,sizeof(char),BUFSIZE,source)) >\
  \ 0)\n        fwrite(temp, sizeof (char), bytes, dest);\n}\n\nchar * s_gets(char\
  \ *st, int n)\n{\n    char * ret_val;\n    char * find;\n    ret_val = fgets(st,\
  \ stdin);\n    if (ret_val)\n    {\n        find = strchr(st, '\\n'); // look for\
  \ newline\n        if (find) // if the address is not NULL,\n            find =\
  \ '\\0'; // place a null character\n        else\n            while (getchar() !=\
  \ '\\n')\n                continue;\n    }\n    return ret_val;\n}\n```\n\n### 实现细节\n\
  \n如果 `setvbuf()` 无法创建缓冲区，它将返回一个非零值，代码随后会终止。类似的代码为当前复制的文件建立了一个 4,96 字节的缓冲区。通过将 `NULL`\
  \ 作为 `setvbuf()` 的第二个参数，我们让该函数为缓冲区分配存储。\n\n程序使用 `s_gets()` 代替 `scanf()` 来获取文件名，因为\
  \ `scanf()` 会跳过空白字符，因此无法检测到空行。它使用 `s_gets()` 代替简单的 `fgets()`，因为后者会保留换行符。这段代码防止了程序尝试将文件追加到其自身：\n\
  \n```c\nif (strcmp(file_src, file_app) == 0)\n    fputs(\"Can't append file to itself\\\
  n\",stderr);\n```\n\n参数 `file_app` 代表目标文件名，而 `file_src` 代表正在处理的文件名。`append()` 函数负责复制工作。它不是一次一个字节地复制，而是使用\
  \ `fread()` 和 `fwrite()` 每次复制 4,096 字节：\n\n```c\nvoid append(FILE *source, FILE\
  \ *dest)\n{\n    size_t bytes;\n    static char temp[BUFSIZE]; // allocate once\n\
  \    while ((bytes = fread(temp,sizeof(char),BUFSIZE,source)) > 0)\n        fwrite(temp,\
  \ sizeof (char), bytes, dest);\n}\n```\n\n由于通过 `dest` 指定的文件是以追加模式打开的，每个源文件都会逐一个添加到目标文件的末尾。注意，`temp`\
  \ 数组具有静态存储持续时间（意味着它在编译时分配，而不是每次调用 `append()` 函数时分配）并且具有块作用域（意味着它对该函数是私有的）。示例使用了文本模式文件；通过使用\
  \ `\"ab+\"` 和 `\"rb\"` 模式，它可以处理二进制文件。\n\n#### 使用二进制 I/O 的随机访问\n\n随机访问通常用于使用二进制 I/O\
  \ 写入的二进制文件，让我们来看一个简短的示例。列表 13.6 中的程序创建了一个包含 `double` 类型数字的文件，然后允许你访问其内容。\n\n列表 13.6\
  \ randbin.c 程序\n\n```c/* randbin.c -- random access, binary i/o */\n#include <stdio.h>\n\
  #include <stdlib.h>\n#define ARSIZE 1000\nint main()\n{\n    double numbers[ARSIZE];\n\
  \    double value;\n    const char * file = \"numbers.dat\";\n    int i;\n    long\
  \ pos;\n    FILE *iofile;\n    // 创建一组 double 类型的值\n    for(i = 0; i < ARSIZE; i++)\n\
  \        numbers[i] = 100.0 * i + 1.0;\n    // 尝试打开文件\n    if ((iofile = fopen(file,\
  \ \"wb\")) == NULL)\n    {\n        fprintf(stderr, \"Could not open %s\\n\", file);\n\
  \        exit(EXIT_FAILURE);\n    }\n    // 将数组写入文件\n    fwrite(numbers, sizeof(double),\
  \ ARSIZE, iofile);\n    fclose(iofile);\n\n    if ((iofile = fopen(file, \"rb\"\
  )) == NULL)\n    {\n        fprintf(stderr, \"Could not open %s\\n\", file);\n \
  \       exit(EXIT_FAILURE);\n    }\n    // 从文件中读取选内容\n    printf(\"Enter an index\
  \ in the range 0-%d\\n\", ARSIZE - 1);\n    while (scanf(\"%d\", &i) == 1 && i >=\
  \ 0 && i < ARSIZE)\n    {\n        // 计算偏移量\n        pos = (long) i * sizeof(double);\n\
  \        // 跳转到那里\n        fseek(iofile, pos, SEEK_SET);\n        // 从文件中读取\n  \
  \      fread(&value, sizeof(double), 1, iofile);\n        printf(\"The value there\
  \ is %f\\n\", value);\n        printf(\"Next index (out of range to quit):\");\n\
  \    }\n    // 收收工作\n    fclose(iofile);\n    puts(\"Bye!\");\n    return 0;\n}\n\
  ```\n\n\n\n\nC 语言解释字节输入流或输出流的方式取决于你使用的输入/输出函数。程序可以原封不动地读取并存储字节，也可以将字节解释为字符，而字符又可以被解释为普通文本或数字的文本表示。同样，在输出时，你使用的函数决定了二进制值是被原封不动地传输，还是转换为文本或数字的文本表示。如果你有需要保存并恢复且不丢失精度的数值数据，请使用二进制模式以及\
  \ `fread()` 和 `fwrite()` 函数。如果你正在保存文本信息并希望创建可以用文本编辑器查看的文件，请使用文本模式以及 `getc()` 和 `fprintf()`\
  \ 等函数。\n\n要访问文件，你需要创建一个文件指针（类型为 `FILE *`）并将指针与特定文件名关联。随后的代码在处理文件时将使用指针而不是文件名。\n\n\
  理解 C 如何处理文件结束（end-of-file）概念非常重要。通常，文件读取程序会使用循环读取输入直到到达文件末尾。C 的输入函数在尝试读取文件末尾之后之前不会检测到文件结束。这意味着测试文件结束应该在尝试读取*之后*立即进行。你可以参考本章“文件结束”部分中标记为“良好设计”的双文件输入模型作为指南。\n\
  \n### 总结\n\n对文件的读写对于大多数 C 程序都是至关重要的。大多数 C 实现为了这些目的提供了低级 I/O 服务标准高级 I/O 服务。由于 ANSI\
  \ C 包含了标准 I/O 服务但不包含低级服务，标准包更具可移植性。\n\n标准 I/O 包会自动创建输入和输出缓冲区以加速数据传输。`fopen()` 函数打开一个文件用于标准\
  \ I/O，并创建一个用于存储文件和缓冲区信息的数据结构。`fopen()` 函数返回指向该数据结构的指针，该指针被其他函数用于标识要要处理的文件。`feof()`\
  \ 和 `ferror()` 函数报告 I/O 操作失败的原因。\n\nC 将输入视为字节流。如果你使用 `fread()`，C 将输入视为二进制值，并将其放置于你指定的任何存储位置。如果你使用\
  \ `fscanf()`、`getc()`、`fgets()` 或任何相关函数，C 将每个字节视为一个字符代码。随后，`fscanf()` 和 `scanf()`\
  \ 函数会根据格式说明符的指示尝试将字符代码转换为其他类型。例如，`%f` 说明符会将输入 `23` 转换为浮点值，`%d` 说明符会将相同的输入转换为整数值，而\
  \ `%s` 说明符会将字符输入保存为字符串。`getc()` 和 `fgets()` 系列函数保持输入为字符代码，并将其存储在 `char` 变量中（单个字符）或\
  \ `char` 数组中（作为字符串）。同样，`fwrite()` 将二进制数据直接放入输出流，而其他输出函数在将其放入输出流之前会将字符数据转换为字符表示。\n\
  \nANSI C 两种文件打开模式：二进制和文本。当文件以二进制模式打开时，可以按字节读取。当文件以文本模式打开时，其内容可能会从系统的文本表示映射到 C 的表示。对于\
  \ Unix 和 Linux 系统，两种模式是相同的。\n\n输入函数 `getc()`、`fgets()`、`fscanf()` 和 `fread()` 通常从文件开始按顺序读取文件。然而，`fseek()`\
  \ 和 `ftell()` 函数允许程序移动到文件中的任意位置，从而实现随机访问。`fgetpos()` 和 `fsetpos()` 将类似的能力扩展到更大的文件。随机访问在二进制模式下的效果比在文本模式下好。\n\
