  \ rows, cols);`\n\n`scanf()` 函数会将换行符留在输入队列中。与 `scanf()` 不同，`getchar()` 不跳过换行符，因此这个换行符会被\
  \ `getchar()` 读取。这个换行符是 `ch` 循环的条件。\n\n为了解决这个问题，如果能让程序在 `scanf()` 阶段之外也能通过 `getchar()`\
  \ 测试来终止就好了。列表 8.6 中所示的下一个版本实现了这一点。\n\n列表 8.6 showchar2.c 程序\n\n点击此处查看代码图像\n\n```c\n\
  /* showchar2.c -- 打印行和列 */\n#include <stdio.h>\nvoid display(char cr, int lines,\
  \ int width);\nint main(void)\n{\n    int ch;             /* 要打印的字符 */\n    int\
  \ rows, cols;     /* 行数和列数 */\n    printf(\"Enter a character and two integers:\\\
  n\");\n    while ((ch = getchar()) != '\\n')\n    {\n        if (scanf(\"%d %d\"\
  , &rows, &cols) != 2)\n            break;\n        display(ch, rows, cols);\n  \
  \      while (getchar() != '\\n')\n            continue;\n        printf(\"Enter\
  \ another character and two integers;\\n\");\n        printf(\"Enter a newline to\
  \ quit.\\n\");\n    }\n    printf(\"Bye.\\n\");\n    return 0;\n}\nvoid display(char\
  \ cr, int lines, int width)\n{\n    int row, col;\n    for (row = 1; row <= lines;\
  \ row++)\n    {\n        for (col = 1; col <= width; col++)\n        {\n       \
  \     putchar(cr);\n            putchar('\\n'); /* 结束行并开始新行 */\n        }\n    }\n\
  }\n```\n\n`while` 语句导致程序丢弃 `scanf()` 输入之后的所有字符，包括换行符。这为循环读取下一行的第一个字符做了准备。这意味着你可以自由地输入数据：\n\
  \n点击此处查看代码图像\n\n输入一个字符和两个整数：\nc 1 2\ncc\ncc\n输入另一个字符和两个整数；\n输入换行退出。\n! 3 6\n!!!!!!\n\
  !!!!!!\n!!!!!!\n输入另一个字符和两个整数；\n输入换行退出。\nBye。\n\n通过使用 `if` 语句，如果 `scanf()` 的返回值不是\
  \ `2`，我们终止程序。当一个或两个输入值不是整数或遇到文件结束符时就会发生这种情况。\n\n\n\n\n在实践中，程序用户并不总是遵循指令，你可能会遇到程序预期的输入与实际获得的输入之间不匹配的情况。这种情况会导致程序失败。然而，通常你可以预判可能的输入错误，并通过一些额外的编程工作让程序检测并规过这些错误。\n\
  \n例如，假设你有一个处理非负数的循环。用户可能犯的一种错误是输入一个负数。你可以使用关系表达式来测试这种错误：\n\n```c\nlong n;\nscanf(\"\
  %ld\", &n);      // 获取第一个值\nwhile (n >= 0)        // 检测出范围外的值\n{\n    // 处理 n\n\
  \    scanf(\"%ld\", &n);  // 获取下一个值\n}\n```\n\n另一个潜在的陷阱是用户可能会输入错误类型的值，例如字符 `q`。检测这种误用的一种方法是检查\
  \ `scanf()` 的返回值。你可能记得，此函数返回它成功读取的项目数；因此，只有当用户输入整数时，表达式 `scanf(\"%ld\", &n) == 1`\
  \ 才为真。这建议对代码进行如下修订：\n\n```c\nlong n;\nwhile (scanf(\"%ld\", &n) == 1 && n >= 0)\n\
  {\n    // 处理 n\n}\n```\n\n用语言描述，`while` 循环条件是“当输入是整数且该整数为正时”。\n\n最后一个示例在用户输入错误类型的值时会终止输入。然而，你可以选择让程序变得更用户友好，给用户尝试输入正确类型值的机会。在这种情况下，你需要处理掉最初导致\
  \ `scanf()` 失败的输入，因为 `scanf()` 将错误的输入留在了输入队列中。在这里，输入确实是一个字符流这一事实派上了用，因为你可以使用 `getchar()`\
  \ 逐字符地读取输入。你甚至可以将这些想法整合到如下所示函数中：\n\n```c\nlong get_long(void)\n{\n    long input;\n\
  \    char ch;\n    while (scanf(\"%ld\", &input) != 1)\n    {\n        while ((ch\
  \ = getchar()) != '\\n')\n            putchar(ch);  // 丢弃坏输入\n        printf(\"\
  \ is not an integer.\\nPlease enter an \");\n        printf(\"integer value, such\
  \ as 25, -178, or 3: \");\n    }\n    return input;\n}\n```\n\n此函数尝试将一个 `int` 值读入变量\
  \ `input` 中。如果失败，函数将进入外层 `while` 循环体。内部 `while` 循环随后会逐字符地读取错误的输入字符。注意，此函数选择丢弃行上所有的剩余输入。其他可能的选择是只丢弃下一个字符或单词。然后函数提示用户重试。外层循环一直持续，直到用户成功输入整数，导致\
  \ `scanf()` 返回值 `1`。\n\n在用户越过输入整数的障碍后，程序可以检查这些值是否有效。考虑一个需要用户输入一个下限和一个上限来定义取值范围的用例。在这种情况下，你可能可能希望程序检查第一个值是否大于第二个值（通常范围假设第一个值是较小的那个）。它可能还需要检查值是否在可接受范围内。例如，存档搜索可能无法处理小于\
  \ 1958 或大于 2014 的年份值。这种检查也可以通过函数完成。\n\n这里是一种可能的方法；以下函数假设已经包含了 `stdbool.h` 头文件。如果你的系统上没有\
  \ `_Bool`，你可以用 `int` 替换 `bool`，用 `1` 替换 `true`，用 `0` 替换 `false`。注意，如果输入无效，函数将返回\
  \ `true`；因此名为 `bad_limits()`：\n\n```c\nbool bad_limits(long begin, long end, long\
  \ low, long high)\n{\n    bool not_good = false;\n    if (begin > end)\n    {\n\
  \        printf(\"%ld isn't smaller than %ld.\\n\", begin, end);\n        not_good\
  \ = true;\n    }\n    if (begin < low || end < low)\n    {\n        printf(\"Values\
  \ must be %ld or greater.\\n\", low);\n        not_good = true;\n    }\n    if (begin\
  \ > high || end > high)\n    {\n        printf(\"Values must be %ld or less.\\n\"\
  , high);\n        not_good = true;\n    }\n    return not_good;\n}\n```\n\n列表 8.7\
  \ 使用这两个函数向算术函数提供整数，该函数计算指定范围内所有整数平方的和。程序将范围的上限和下限分别限制在 1000 和 -1000。\n\n列表 8.7 checking.c\n\
  \n```c\n// checking.c -- 输入\n#include <stdio.h>\n#include <stdbool.h>\n\n// 验证输入是否为整数\n\
  long get_long(void);\n\n// 验证范围是否有效\nbool bad_limits(long begin, long end, long\
  \ low, long high);\n\n// 计算 a 到 b 整数平方的和\ndouble sum_squares(long a, long b);\n\n\
  int main(void)\n{\n    const long MIN = -1000000L; // 下限\n    const long MAX = 1000000L;\
  \ // 上限\n    long start;                 // 起始\n    long stop;                 \
  \ // 结束\n    double answer;\n\n    printf(\"This program computes the sum of the\
  \ squares of \");\n    printf(\"integers in a range. The lower bound should not\
  \ \");\n    printf(\"less than -1000000 and the upper bound should be \");\n   \
  \ printf(\"more than +1000000.Enter the \");\n    printf(\"limits (enter 0 for both\
  \ to quit):\\n\");\n    printf(\"lower limit: \");\n    start = get_long();\n  \
  \  printf(\"upper limit: \");\n    stop = get_long();\n\n    while (start != 0 ||\
