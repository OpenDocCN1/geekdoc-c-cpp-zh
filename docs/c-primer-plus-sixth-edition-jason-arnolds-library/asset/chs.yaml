  \ `for` 循环第一次启动时执行。第二个表达式是测试条件；它在每次潜在的循环执行之前进行求值。当表达式为假时（当 `count` 大于 `NUMBER` 时），循环终止。第三个表达式是变化或更新，在每个循环结束时求值。列表\
