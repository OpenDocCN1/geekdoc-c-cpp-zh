  \n你将在本章中学习以下内容：\n\n![图像](img/squf.jpg) 运算符：\n\n`~ & |^`\n\n`>> <<`\n\n`&= |= ^=\
  \ >>= <<=`\n\n![图像](img/squf.jpg) 二进制、八进制和十六进制表示法（复习）\n\n![图像](img/squf.jpg) 处理数值中单个位位的两种\
  \ C 语言方法：位运算符和位域\n\n![图像](img/squf.jpg) 关键字：\n\n`_Alignas, _Alignof`\n\n使用 C 语言，你可以操作变量中的单个位。也许你会奇怪为什么有人想这样做。请放心，有时这种能力是必要的，或者至少是有用的。例如，硬件设备通常通过向发送一个或两个字节来控制，其中每个位都有特定的含义。此外，操作系统中关于文件的信息通常也使用特定的位来指示特定的项目。许多压缩和加密操作都会处理单个位。高层语言通常不处理这种程度的细节；C\
  \ 语言既能提供高层语言设施，又能处理通常留给汇编语言的任务，这使其非常强大。\n\n### 二进制数、位与字节\n\n表示数字的通常方法是基于 10 的。例如，2157\
  \ 的千位是 2，百位是 1，十位是 5，个位是 7。这意味着你可以将 2157 认为如下：\n\n点击此处查看代码图像\n\n```\n2 x 1000 +\
  \ 1 x 100 + 5 x 10 + 7 x 1\n```\n\n然而，1000 是 10 的三次方，100 是 10 的平方，10 是 10 的一次幂，根据约定，1\
  \ 是 10（或任何正数）的零次方。因此，你也可以将 2157 写为：\n\n点击此处查看代码图像\n\n```\n2 x 10³ + 1 x 10² + 5\
  \ x 10¹ + 7 x 10⁰\n```\n\n由于我们的数字系统基于 10 的幂，我们说 2157 是十进制表示的。\n\n推测十进制系统的进化是因为我们有\
  \ 10 根手指。计算机位在某种意义上只有两个手指，因为它只能设置为 0 或 1，关闭或开启。因此，基 2 系统对计算机来说是自然的。它使用 2 的幂而不是 10\
  \ 的幂。用基 2 表示的数称为*二进制数*。数字 2 在二进制数中所扮演的作用与 10 在十进制数中所扮演的作用相同。例如，二进制数 1101 意味着：\n\n\
  ```\n1 x 2³ + 1 x 2² + 0 x 2¹ + 1 x 2⁰\n```\n\n在十进制中，它变为：\n\n```\n1 x 8 + 1 x 4\
  \ + 0 x 2 + 1 x 1 = 13\n```\n\n你可以使用二进制系统将任何整数（只要有足够的位）表示为 1 和 0 的组合。这种系统对于数字计算机非常方便，计算机通过可以解释为\
  \ 1 和 0 的开启和关闭状态组合来表示信息。让我们二进制系统是如何作用于 1 字节整数的。\n\n#### 二进制整数\n\n\n\n\n通常，一个 `byte`\
  \ 包含 8 位（bits）。请记住，C 语言使用 `byte` 一术来表示存储系统字符集的大小，因此 C 语言中的 `byte` 可以 8 位、9 位、16\
  \ 位或其他值。然而，8 位的 `byte` 是描述内存芯片的 `byte`，也是描述数据传输速率的 `byte`。为了简单起见，本章假设 `byte` 是 8\
  \ 位的。（为了清晰起见，计算机世界通常使用 `octet` 一词来称呼 8 位的 `byte`。）你可以认为这 8 位从左到右编号为 7 到 0。`byte`\
  \ 中的第 7 位被称为 `high-order bit`（高位），而第 0 位被称为 `low-order bit`（低位）。每个位数字都对应 2 的一个特定幂。想象\
  \ `byte` 看起来就像图 15.1。\n\n![Image](img/15fig01.jpg)\n\n图 15.1 位数和位值。\n\n在这里，128 是\
  \ 2 的 7 次幂，依此类推。该 `byte` 能包含的最大数字是 1，即所有位都设置为 1：`11111111`。这个二进制数的值如下：\n\n点击此处查看代码图像\n\
  \n128 + 64 + 32 + 16 + 8 + 4 + 2 + 1 = 255\n\n最小的二进制数是 `00000000`，或者简单的 0。一个 `byte`\
  \ 可以存储 0 到 255 之间的数字，总共 256 种可能的值。或者，通过不同的解释位模式，程序可以使用 `byte` 存储 –128 到 +127 之间的数字，同样是\
  \ 256 个值。例如，`unsigned char` 通常使用 `byte` 表示 0 到 255 的范围，而 `signed char` 通常使用 `byte`\
  \ 表示 –128 到 +127 的范围。\n\n#### 有符号整数\n\n有符号数的表示是由硬件决定的，而不是由 C 语言。表示有符号数最简单的方法可能是预留\
  \ 1 位（例如高位）来表示符号。在一个 1 字节值中，这为数字本身留下了 7 位。在这样的 `sign-magnitude`（原码法）表示中，`10000001`\
  \ 是 –1，`00000001` 是 1。那么，总范围是 –127 到 +127。\n\n这种方法的一个缺点是它有两个零：+0 和 –0。这很令人困惑，而且仅为了一个值就用了两个位模式。\n\
  \n`two’s-complement`（补码）方法避免了这个问题，并且是目前最常用的系统。我们将讨论该方法应用于 1 字节值的情况。在这种语境下，0 到 127\
  \ 的值由最后 7 位表示，高位设置为 0。到目前为止，这与 `sign-magnitude` 方法相同。此外，如果高位为 1，则该值是负数。区别在于确定该负数的值。将负数的位模式从\
  \ 9 位模式 `100000000`（二进制表示的 256）中减去，结果就是该值的绝对值。例如，假设模式为 `10000000`。作为一个无符号 `byte`，它是\
  \ 128。作为一个有符号值，它是负的（位 7 为 1），且其值为 `100000000−10000000`，或 `10000000` (128)。因此，该数字是\
  \ –128。（在 `sign-magnitude` 系统中它将是 –0。）同样，`10000001` 是 –127，`11111111` 是 –1。该方法表示了\
  \ –128 到 +127 范围内的数字。\n\n反转补码二进制数符号的最简单方法是反转每一位（将 0 转换为 1，将 1 转换为 0），然后加 1。因为 1\
  \ 是 `00000001`，所以 –1 是 `11111110 + 1`，或 `11111111`，正如你之前看到的那。\n\n`one’s-complement`（反码法）通过反转模式中的每一位来形成数的负数。例如，`00000001`\
  \ 是 1，`11111110` 是 –1。这种方法也有一个 –0：`11111111`。它的范围（对于 1 字节值）是 –127 到 +127。\n\n####\
  \ 二进制浮点数\n\n浮点数存储在两个部分：二进制分数和二进制指数。让我们来看看是如何完成的。\n\n##### 二进制分数\n\n普通分数 0.527 表示为\n\
  \n5/10 + 2/100 + 7/1000\n\n分母表示 10 的递增幂次。在二进制分数中，我们使用 2 的幂作为分母，因此二进制分数 `.101` 表示\n\
  \n（注：原文文本在此处存在重复和截断，已根据翻译逻辑进行处理）。\n\n\n\nC 语言提供了位运算逻辑运算符和移位运算符。在接下来的示例中，我们将以二进制表示法写出值，以便你可以看到位发生了什么变化。在实际程序中，你将使用通常形式编写的整数变量或常量。例如，你不会使用\
  \ `00011001`，而是使用 `25`、`031` 或 `0x19`。对于我们的示例，我们将使用 8 位数，位从左到右编号为 7 到 0。\n\n## 位运算逻辑运算符\n\
  \n四个位运算逻辑运算符作用于整数类型数据，包括 `char`。它们被称为*位运算*，是因为它们独立地对每个位进行操作，不受左侧或右侧位的影响。不要将它们与普通的逻辑运算符（`&&`、`||`\
  \ 和 `!`）混淆，后者是对整个值进行整体操作的。\n\n### 取反码，或位取反：~\n\n一元运算符 `~` 将每个 1 改变为 0，将每个 0 改变为\
  \ 1，例所示：\n\n```\n~(10011010)  // 表达式\n(01100101)   // 结果值\n```\n\n假设 `val` 是一个赋值为\
  \ `2` 的 `unsigned char`。在二进制中，`2` 是 `00000010`。那么 `~val` 的值为 `11111101`，即 `253`。注意，该运算符并没有改变\
  \ `val` 的值，就像 `3 * val` 不改变 `val` 的值一样；`val` 仍然是 `2`，但它创建了一个可以在其他地方使用或赋值的新值：\n\n\
  ```\nnewval = ~val;\nprintf(\"%d\", ~val);\n```\n\n如果你想将 `val` 的值改为 `~val`，请使用这个简单的赋值：\n\
  \n```\nval = ~val;\n```\n\n### 位与：&\n\n二元运算符 `&` 通过对两个操作数进行逐位比较来产生一个新值。对于每个位位置，只有当两个操作数中的对应位均为\
  \ 1 时，结果位为 1。（从真/假的角度来看，只有当两个位操作数都为真时，结果才为真。）因此，表达式\n\n```\n(10010011) & (00111101)\
  \  // 表达式\n```\n\n求值为如下结果：\n\n```\n(00010001)               // 结果值\n```\n\n原因是只有两个操作数中的位\
  \ 4 和位 0 是 `1`。\n\nC 还有一个复合的位与赋值运算符：`&=`。语句\n\n```\nval &= 0377;\n```\n\n产生的最终结果与以下代码相同：\n\
  \n```\nval = val & 0377;\n```\n\n### 位或：|\n\n二元运算符 `|` 通过对两个操作数进行逐位比较来产生一个新值。对于每个位位置，只要两个操作数中的对应位中有一个为\
  \ 1，结果位就为 1。（从真/假的角度来看，如果一个或另一个位操作数为真，或者两者都为真，结果就为真。）因此，表达式\n\n```\n(10010011) |\
  \ (00111101)  // 表达式\n```\n\n求值为如下结果：\n\n```\n(10111111)               // 结果值\n\
  ```\n\n原因是除了位 6 之外，所有位位置在其中一个操作数（或两者）中都有值 `1`。\n\nC 还有一个复合的位或赋值运算符：`|=`。语句\n\n```\n\
  val |= 0377;\n```\n\n产生的最终结果与此代码相同：\n\n```\nval = val | 0377;\n```\n\n### 位异异：^\n\
  \n二元运算符 `^` 对两个操作数进行逐位比较。对于每个位位置，如果两个操作数中的对应位中仅有一个（但不是两个）为 1，结果位就为 1。（从真/假的角度来看，如果一个或另一个位操作数为真——但不是两者都为真——结果就为真。）因此，表达式\n\
  \n```\n(10010011) ^ (00111101)  // 表达式\n```\n\n求值为如下：\n\n```\n(10101110)       \
  \        // 结果值\n```\n\n注意，因为位位置 0 在两个操作数中的值均为 `1`，所以产生的 0 位结果值为 `0`。\n\nC 还有一个复合的位异或赋值运算符：`^=`。语句\n\
  \n```\nval ^= 0377;\n```\n\n产生的最终结果与此代码相同：\n\n```\nval = val ^ 0377;\n```\n\n##\
  \ 使用：掩码 (Masks)\n\n位 `AND` 运算符通常与掩码一起使用。*掩码*是一种位模式，其中某些位被设置为开启（1），另一些位设置为关闭（0）。为了理解为什么掩码被称为掩码，让我们看看当一个量通过\
  \ `&` 运算符与掩码结合**时会发生什么。例如，假设你将符号常量 `MASK` 定义为 `2`（即二进制的 `00000010`），只有第 1 位非零。那么语句\n\
  \n```\nflags = flags & MASK;\n```\n\n会导致 `flags` 的所有位（除位 1 外外）都被设置为 0，因为任何位使用 `&`\
  \ 运算符与 0 结合都会产生 0。\n\n\n\n\n`MASK` 中所有设置为 `1` 的位位在结果中都将被设置为 `0`（清零）。`flags` 中所有与\
  \ `MASK` 中的 `0` 位对应的位位均保持不变。\n\n你可以使用这种简写形式：\n\n```c\nflags &= ~MASK;\n```\n\n###\
  \ 使用：翻转位位（Toggling Bits）\n\n翻转位位意味着如果位是开启的则将其关闭，如果是关闭的则将其开启。你可以使用位按异或（EXCLUSIVE\
  \ OR）运算符来翻转位位。其核心原理是：如果 `b` 是一个位设置（1 或 0），那么当 `b` 为 `1` 时，`1 ^ b` 为 `0`；当 `b` 为\
  \ `0` 时，结果为 `1`。同样，无论其值如何，`0 ^ b` 都等于 `b`。因此，如果你使用 `^` 将一个值与掩码结合，掩码中对应于 1 的位的值会被翻转，而掩码中对应于\
  \ 0 的位的值将保持不变。要翻转 `flags` 中的第 1 位，你可以采取以下两种操作之一：\n\n```c\nflags = flags ^ MASK;\n\
  \nflags ^= MASK;\n```\n\n例如，假设 `flags` 为 `00001111` 且 `MASK` 为 `10110110`。表达式\n\n\
  `flags ^ MASK`\n\n变为：\n\n```\n(00001111) ^ (10110110)  // 表达式\n```\n\n并评估为：\n\n\
  ```\n(10111001)              // 结果值\n```\n\n`MASK` 中所有设置为 `1` 的位都会导致 `flags` 对应的位被翻转。`flags`\
  \ 中所有与 `MASK` 中的 `0` 位对应的位均保持不变。\n\n### 使用：检查位的值\n\n你已经看到过如何改变位的值。现在，假设你想检查某个位的值。例如，`flags`\
  \ 的第 1 位是否设置为 1？你不应该简单地将 `flags` 与 `MASK` 进行比较：\n\n```c\nif (flags == MASK)\n  puts(\"\
  Wow!\");    /* 运行不正常 */\n```\n\n即使 `flags` 中的第 1 位被设置为 1，`flags` 中的其他位设置也可能导致比较不成立。相反，你必须先掩码\
  \ `flags` 中的其他位，以便只将 `flags` 的第 1 位与 `MASK` 进行比较：\n\n```c\nif ((flags & MASK) ==\
  \ MASK)\n  puts(\"Wow!\");\n```\n\n位运算符的优先级低于 `==`，因此 `flags & MASK` 周围的括号是必要的。\n\
  \n为了避免边缘信息的泄露，位掩码的宽度至少应与它所掩码的值一样宽。\n\n### 位移运算符\n\n现在让我们来看 C 语言的移位运算符。位移运算符将位向左或向右移动。同样我们将显式写出二进制数以展示其工作机制。\n\
  \n#### 左移： <<\n\n左移运算符（`<<`）将左操作数值的位向左移动，移动位数由右操作数指定。空出的位置用 0 填充，移出左操作数末端的位将丢失。在接下来的示例中，每个位都向左移动两个位置：\n\
  \n```\n(10001010) << 2  // 表达式\n(00101000)        // 结果值\n```\n\n此操作产生了一个新的位值，但不会改变它的操作数。例如，假设\
  \ `stonk` 为 `1`。那么 `stonk<<2` 为 `4`，但 `stonk` 仍然是 `1`。你可以使用左移赋值运算符（`<<=`）来实际改变变量的值。该运算符将变量中的位向左移动，位数由右侧的值指定。这里有一个示例：\n\
  \n```c\nint stonk = 1;\nint onkoo;\nonkoo = stonk << 2;   /* 将 4 赋值给 onkoo */\n\
  stonk <<= 2;          /* 将 stonk 改为 4 */\n```\n\n#### 右移： >>\n\n右移运算符（`>>`）将左操作数的位向右移动，移动位数由右操作数指定。移出左操作数右侧的位将丢失。对于无\
  \ unsigned（无 unsigned）类型，左侧空出的位置由 0 填充。对于有符号（（signed）类型，结果取决于机器。空出的位置可能用 0 填充，也可能用符号位（最左侧位）拷贝填充：\n\
  \n```\n(10001010) >> 2  // 表达式，有符号值\n(00100010)        // 结果值，某些系统\n(10001010) >>\
  \ 2  // 表达式，有符号值\n(11100010)        // 结果值，其他系统\n```\n\n对于无符号值，你会有以下情况：\n\n```\n\
  (10001010) >> 2  // 表达式，无符号值\n(00100010)        // 结果值，所有系统\n```\n\n每个位都向右移动两个位置，空出的位置用\
