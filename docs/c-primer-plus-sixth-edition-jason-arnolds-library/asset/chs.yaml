  \n```c\nint main(void)\n{\n    int powers[8] = {1,2,4,6,8,16,32,64}; /* ANSI C 及后续版本\
  \ */\n    ...\n}\n```\n\n如你所示，你通过使用花括号括起来的逗号分隔的值列表来初始化数组。如果你愿意，可以在值和逗号之间使用空格。第一个元素\
  \ `powers[0]` 被赋值为 `1`，依此类推。（如果你的编译器拒绝这种形式的初始化并认为是语法错误，你可能在使用一个预-ANSI 版本的编译器。在数组声明前加上关键字\
  \ `static` 应该可以解决这个问题。第 12 章“存储存储类、链接和内存管理”讨论了该关键字的含义。）\n\n列表 10.1 展示了一个打印每月天数的短程序。\n\
  \n列表 10.1 的 day_mon1.c 程序\n\n点击此处查看代码图像\n\n```c\n/* day_mon1.c -- 打印每个月的天数 */\n\
  #include <stdio.h>\n#define MONTHS 12\nint main(void)\n{\n    int days[MONTHS] =\
  \ {31,28,31,30,31,30,31,31,30,31,30,31};\n    int index;\n    for (index = 0; index\
  \ < MONTHS; index++)\n        printf(\"Month %d has %2d days.\\n\", index + 1, days[index]);\n\
  \    return 0;\n}\n```\n\n输出如下：\nMonth 1 has 31 days.\nMonth 2 has 28 days.\nMonth\
  \ 3 has 31 days.\nMonth 4 has 30 days.\nMonth 5 has 31 days.\nMonth 6 has 30 days.\n\
  Month 7 has 31 days.\nMonth 8 has 31 days.\nMonth 9 has 30 days.\nMonth 10 has 31\
  \ days.\nMonth 11 has 30 days.\nMonth 12 has 31 days.\n\n\n\n\n```c\n#include <stdio.h>\n\
  \n#define SIZE 4\n\nint main(void)\n{\n    int some_data[SIZE] = {1492, 1066};\n\
  \    int i;\n    printf(\"%2s%14s\\n\",\n            \"i\", \"some_data[i]\");\n\
  \    for (i = 0; i < SIZE; i++)\n        printf(\"%2d%14d\\n\", i, some_data[i]);\n\
  \    return 0;\n}\n```\n\n这次的输出看起来如下：\n\n```\ni  some_data[i]\n0           1492\n\
  1           1066\n2               0\n3               0\n```\n\n如你所见，编译器并没有问题。当它用完列表中的值时，它会将剩余的元素初始化为\
  \ `0`。也就是说，如果你完全没有初始化数组，它的元素（像未初始化的普通变量一样）将垃圾值；但如果你部分初始化了数组，剩余的元素将被设置为 `0`。\n\n\
  如果你提供的列表值太多，编译器就不会那么宽大了。这种过度的慷慨被视为错误。然而，你没有必要让自己受到编译器的嘲笑。相反，你可以通过省略括号中的大小，让编译器匹配数组大小到列表（参见列表\
  \ 10.4）。\n\n列表 10.4 的 day_mon2.c 程序\n\n点击此处查看代码图像\n\n```c\n/* day_mon2.c -- 让编译器计算元素\
  \ */\n#include <stdio.h>\n\nint main(void)\n{\n    const int days[] = {31,28,31,30,31,30,31,31,30,31};\n\
  \    int index;\n    for (index = 0; index < sizeof days / sizeof days[0]; index++)\n\
  \        printf(\"Month %2d has %d days.\\n\", index +1,\n               days[index]);\n\
  \    return 0;\n}\n```\n\n在列表 10.4 中有了两主要点需要注意：\n\n![Image](img/squf.jpg) 当你使用空括号来初始化数组时，编译器会计算列表中的项目数量，并使数组达到相应的大小。\n\
  \n![Image](img/squf.jpg) 注意我们在 `for` 循环控制语句中所做的。由于对我们正确计数的能力缺乏（理理的）信任，我们让计算机告诉我们数组的大小。`sizeof`\
  \ 运算符给出其其后的对象或*类型*的大小，以字节为单位。因此，`sizeof days` 是整个数组的大小（字节数），而 `sizeof days[0]` 是其中一个元素的大小（字节数）。将整个数组的大小除以一个元素的大小，就能知道数组中有多少个元素。\n\
  \n这是运行该程序的结果：\n\n```\nMonth  1 has 31 days.\nMonth  2 has 28 days.\nMonth  3 has\
  \ 31 days.\nMonth  4 has 30 days.\nMonth  5 has 31 days.\nMonth  6 has 30 days.\n\
  Month  7 has 31 days.\nMonth  8 has 31 days.\nMonth  9 has 30 days.\nMonth 10 has\
  \ 31 days.\n```\n\n哎！我们只输入了 10 个值，但我们让程序寻找数组大小的方法防止了我们尝试打印数组末尾之后。这指出了自动计数的一个潜在缺点：元素数量的错误可能会被忽略。\n\
  \n还有另一种初始化数组的短方法。然而，因为它只适用于字符字符串，我们将把它留到下一章。\n\n## 指定初始化器 (C99)\n\nC99 增加了一个新功能：*指定初始化器*。此功能允许你挑选并选择要初始化哪些元素。例如，假设你只想初始化数组中的最后一个元素。使用传统的\
  \ C 初始化语法，你还必须初始化最后一个元素之前的之前的每一个元素：\n\n点击此处查看代码图像\n\n```c\nint arr[6] = {0,0,0,0,212};\
  \ // 传统语法\n```\n\n使用 C99，你可以使用方括号中的索引来指定特定的元素：\n\n点击此处查看代码图像\n\n```c\nint arr[6]\
  \ = {[5] = 212}; // 将 arr[5] 初始化为 212\n```\n\n与普通初始化一样，在你初始化了至少一个元素后，未初始化的元素将被设置为\
  \ `0`。列表 10.5 显示了一个更复杂的例子。\n\n列表 10.5 的 designate.c 程序\n\n点击此处查看代码图像\n\n```c\n//\
  \ designate.c -- 指定初始化器\n#include <stdio.h>\n#define MONTHS 12\n\nint main(void)\n\
  {\n    int days[MONTHS] = {31,28, [4] = 31,30,31, [1] = 29};\n    int index;\n \
  \   for (index = 0; index < sizeof days / sizeof days[0]; index++)\n        printf(\"\
  Month %2d has %d days.\\n\", index +1,\n               days[index]);\n    return\
  \ 0;\n}\n```\n\n以下是指定初始化器的输出：\n\n```\nMonth  1 has 31 days.\nMonth  2 has 28 days.\n\
  Month  3 has 31 days.\nMonth  4 has 30 days.\nMonth  5 has 31 days.\nMonth  6 has\
  \ 30 days.\nMonth  7 has 31 days.\nMonth  8 has 31 days.\nMonth  9 has 30 days.\n\
  Month 10 has 31 days.\n```\n\n指定初始化器具有两个重要特征。首先，在使用指定初始化器时，你可以只初始化某些元素。例如，在列表 10.5\
  \ 中，我们可以初始化 `days[4]` 和 `days[1]`。其次，只要你初始化了至少一个元素，未初始化的元素将被设置为 `0`。\n\n（注：由于提供的原文文本在最后部分存在部分重复和乱码，上述译文已根据逻辑进行了整理和翻译，确保通顺。）\n\
  \n\n\n\n```c\n    printf(\"address of arr[-1]: %p\\n\", &arr[-1]);\n    printf(\"\
  address of arr[4]:  %p\\n\", &arr[4]);\n    printf(\"address of value1:  %p\\n\"\
  , &value1);\n    printf(\"address of value2:  %p\\n\", &value2);\n    return 0;\n\
  }\n``` 并不会检查索引是否有效。使用错误索引的结果在 C 语言标准的术语中是“未定义行为”（undefined）。这意味着当你运行程序时，它看起来可能运行正常，也可能运行异常，或者可能会终止。以下是使用\
  \ GCC 的示例输出：\n\n点击此处查看代码图片\n\n```\nvalue1 = 44, value2 = 88\n-1  -1\n 0  1\n 1 \
  \ 3\n 2  5\n 3  7\n 4  9\n 5  1624678494\n 6  32767\n\nvalue1 = 9, value2 = -1\n\
  address of arr[-1]: 0x7fff5fbff8cc\naddress of arr[4]:  0x7fff5fbff8e0\naddress\
  \ of value1:  0x7fff5fbff8e0\naddress of value2:  0x7fff5fbff8cc\n```\n\n注意，这个编译器似乎将\
  \ `value1` 存储在数组之后，将 `value2` 存储在数组之前。（其他编译器可能会以不同的内存顺序存储数据。）在这种情况下，如输出所示，`arr[-1]`\
  \ 与 `value2` 对应内存位置，而 `arr[4]` 与 `value1` 对应相同的内存位置。因此，使用越界的数组索引会导致程序修改其他变量的值。另一个编译器可能会产生不同的结果，包括程序终止。\n\
  \n你可能会奇怪，为什么 C 语言允许这种糟糕的事情发生。这要归因于 C 语言“信任程序员”的哲学。不检查边界允许 C 程序运行得更快。编译器并不一定能发现所有的索引错误，因为索引的值可能在程序开始执行后才被确定。因此，为了安全，编译器必须在运行时添加额外的代码来检查每个索引的值，这会拖慢速度。所以\
  \ C 语言信任程序员编写正确的代码，并以更快的程序作为奖励。当然，并非所有程序员都配得上这种信任，这时问题就会出现。\n\n一个需要记住的简单点是数组编号从\
  \ 0 开始。要养成的一个简单习惯是在数组声明以及其他使用数组大小的地方使用符号常量：\n\n```c\n#define SIZE 4\n\nint main(void)\n\
  {\n    int arr[SIZE];\n    for (i = 0; i < SIZE; i++)\n    ....\n```\n\n这有助于确保你在整个程序中一致地使用相同的数组大小。\n\
  \n## 指定数组大小\n\n到目前为止，示例在声明数组时使用了整型常量：\n\n点击此处查看代码图片\n\n```c\n#define SIZE 4\n\n\
  int main(void)\n{\n    int arr[SIZE];      // 符号整型常量\n    double lots[144];  //\
  \ 字面量整型常量\n    ...\n```\n\n还允许什么？在 C99 标准之前，答案是声明数组时必须在括号内使用`常量整型表达式`（constant integer\
  \ expression）。常量整型表达式是由整型常量组成的。出于此目的，`sizeof` 表达式被视为整型常量，但（与 C++ 情况不同）`const` 值不是。此外，表达式的值必须大于\
  \ 0：\n\n点击此处查看代码图片\n\n```c\nint n = 5;\nint m = 8;\nfloat a1[5];               //\
  \ 是\nfloat a2[5*2 + 1];          // 是\nfloat a3[sizeof(int) + 1];  // 是\nfloat a4[-4];\
  \              // 否，大小必须 > 0\nfloat a5[0];               // 否，大小必须 > 0\nfloat a6[2.5];\
  \              // 否，大小必须是整数\nfloat a7[(int)2.5];        // 是，将浮点类型转换为整型常量\nfloat\
  \ a8[n];               // C99 之前不允许\nfloat a9[m];               // C99 之前不允许\n```\n\
  \n如注释所示，遵循 C90 标准的 C 编译器将不允许最后两个声明。然而，从 C99 开始，C 语言允许了它们，但它们创建了一种新数组，被称为`变长数组`（variable-length\
  \ array），简称 `VLA`。（C11 放弃了这一大胆举措，使 VLA 成为可选而非强制的语言特性。）\n\nC99 引入变长数组主要是为了让 C 语言成为一种更好的数值计算语言。例如，VLA\
  \ 使得将现有 FORTRAN 数值计算例程转换为 C 变得更容易。VLA 有一些限制；例如，你不能在声明时初始化 VLA。本章稍后会回到 VLA，在你学习了足够知识以理解更多经典\
  \ C 数组的局限性之后。\n\n## 多维数组\n\nTempest Cloud 是一个对自己的工作非常“认真”（双关 cirrus/卷云）的气象预报员，想分析五年的每月降雨数据。她的初步决定之一是如何表示这些数据。一种选择是使用\
  \ 60 个变量，每个代表一个数据项。（我们之前提到过这种选择，它现在看起来和那时一样毫无意义。）使用一个包含 60 个元素的数组是一个改进，但如果能将每年的数据分开存放会更理想。她可以使用五个各包含\
  \ 12 个元素的数组，但这样做很笨拙，如果 Tempest 决定研究 50 年的降雨而不是 5 年，就会变得非常尴尬。她需要更好的方法。\n\n更好的方法是使用数组数组。主数组有五个元素，每个元素代表一年。其中的每个元素又是一个包含\
  \ 12 个元素的数组。\n\n\n\n\n/* 多年降雨数据的平均值 */\n\n```c\n#include <stdio.h>\n\n#define MONTHS\
  \ 12    // 一年的月份\n\n#define YEARS   5    // 数据的年份\n\nint main(void)\n{\n //// 初始化\
  \ 2010 - 2014 年的降雨数据\n    const float rain[YEARS][MONTHS] =\n    {\n        {4.3,4.3,4.3,3.0,2.0,1.2,0.2,0.2,0.4,2.4,3.5,6.6},\n\
  \        {8.5,8.2,1.2,1.6,2.4,0.0,5.2,0.9,0.3,0.9,1.4,7.3},\n        {9.1,8.5,6.7,4.3,2.1,0.8,0.2,0.2,1.1,2.3,6.1,8.4},\n\
  \        {7.2,9.9,8.4,3.3,1.2,0.8,0.4,0.0,0.6,1.7,4.3,6.2},\n        {7.6,5.6,3.8,2.8,3.8,0.2,0.0,0.0,0.0,1.3,2.6,5.2}\n\
  \    };\n\n    int year, month;\n    float subtot, total;\n    printf(\" YEAR  \
  \   RAINFALL  (inches)\\n\");\n    for (year = 0, total = 0; year < YEARS; year++)\n\
  \    {\n        // 每年累加每个月的降雨量\n        for (month = 0, subtot = 0; month < MONTHS;\
  \ month++)\n            subtot += rain[year][month];\n\n        printf(\"%5d %15.1f\\\
  n\", 2010 + year, subtot);\n\n        total += subtot; // 所有年份的总计\n    }\n    printf(\"\
  \\nThe yearly average is %.1f inches.\\n\\n\",\n               total/YEARS);\n \
  \   printf(\"MONTHLY AVERAGES:\\n\\n\");\n    printf(\" Jan  Feb  Mar  Apr  May\
  \  Jun  Jul  Aug  Sep  Oct \");\n    printf(\" Nov  Dec\\n\");\n    for (month =\
  \ 0; month < MONTHS; month++)\n    {\n        // 每个月累加多年的降雨量\n        for (year\
  \ = 0, subtot =0; year < YEARS; year++)\n            subtot += rain[year][month];\n\
  \        printf(\"%4.1f \", subtot/YEARS);\n    }\n    printf(\"\\n\");\n    return\
  \ 0;\n}\n```\n\n***\n\n这里处是输出结果：\n\n点击此处查看代码图片\n\n```\n  YEAR     RAINFALL  (inches)\n\
  \  2010             32.4\n  2011             37.9\n  2012             49.8\n  2013\
  \             44.0\n  2014             32.9\n```\n年度平均值为 39.4 英寸。\n\n```\nMONTHLY\
  \ AVERAGES:\n\n Jan  Feb  Mar  Apr  May  Jun  Jul  Aug  Sep  Oct  Nov  Dec\n 7.3\
  \  7.3  4.9  3.0  2.3  0.6  1.2  0.3  0.5  1.7  3.6  6.7\n```\n\n在学习这个程序时，请关注初始化和计算部分。初始化部分比另一部分复杂，所以我们先看较简单的部分（计算部分）。要找到一年的总和，保持\
  \ `year` 固定，并让 `month` 遍历其范围。这是第一部分的内部循环。然后对 `year` 的下一个值重复该过程。这是第一部分的外部循环。这种嵌套循环对于处理二维数组非常自然而然。一个循环处理第一个下标，另一个循环处理第二个下标：\n\
  \n点击此处查看代码图片\n```c\nfor (year = 0, total = 0; year < YEARS; year++)\n{\n    // 处理每一年\n\
  \    for (month = 0, subtot = 0; month < MONTHS; month++)\n        // 处理每个月\n  \
  \  // 处理每一年\n}\n```\n\n程序的第二部分具有相同的结构，但现在内部循环改变的是 `year`，外部循环改变的是 `month`。请记住，每当外部循环循环一次，内部循环就会完成其全部的分配次数。因此，这种安排在更改月份之前遍历了所有年份。你得到了第一个月的五年平均值，以此类推：\n\
  \n点击此处查看代码图片\n```c\nfor (month = 0; month < MONTHS; month++)\n{\n    // 处理每个月\n\
  \    for (year = 0, subtot =0; year < YEARS; year++)\n        // 处理每一年\n    // 处理每个月\n\
  }\n```\n\n## 初始化二维数组\n\n初始化二维数组建立在初始化一维数组的技术之上。首先，回想一下初始化一维数组的形式如下：\n\n点击此处查看代码图片\n\
  ```c\nsometype ar1[5] = {val1, val2, val3, val4, val5};\n```\n\n这里的 `val1`、`val2`\
  \ 等都是 `sometype` 的有效值。例如，如果 `sometype` 是 `int`，`val1` 可能是 `7`；或者如果 `sometype` 是\
  \ `double`，`val1` 可能是 `11.34`。但 `rain` 是一个五元素的数组，其中每个元素都是 `float` 类型的数组。因此，对于 `rain`，`val1`\
  \ 将是初始化 `float` 一维数组的有效值，如下：\n\n点击此处查看代码图片\n```c\n{4.3,4.3,4.3,3.0,2.0,1.2,0.2,0.2,0.4,2.4,3.5,6.6}\n\
  ```\n\n也就是说，如果 `sometype` 是 `double` 数组，`val1` 就是 12 个 `double` 值的列表。因此，我们需要用逗号分隔的五个这样的项来初始化一个二维数组，例如\
  \ `rain`：\n\n点击此处查看代码图片\n```c\nconst float rain[YEARS][MONTHS] =\n{\n    {4.3,4.3,4.3,3.0,2.0,1.2,0.2,0.2,0.4,2.4,3.5,6.6},\n\
  \    {8.5,8.2,1.2,1.6,2.4,0.0,5.2,0.9,0.3,0.9,1.4,7.3},\n    {9.1,8.5,6.7,4.3,2.1,0.8,0.2,0.2,1.1,2.3,6.1,8.4},\n\
  \    {7.2,9.9,8.4,3.3,1.2,0.8,0.4,0.0,0.6,1.7,4.3,6.2},\n    {7.6,5.6,3.8,2.8,3.8,0.2,0.0,0.0,0.0,1.3,2.6,5.2}\n\
  };\n```\n\n\n\n\n\n`flizny == &flizny[0]; // 数组名是第一个元素的地址\n\n`flizny` 和 `&flizny[0]`\
  \ 都代表该第一个元素的内存地址。（回想 `&` 是地址操作符。）它们都是`常量`，因为在整个程序运行期间它们保持固定不变。然而，可以将它们作为值赋值给指针`variable`（变量），并且如\
  \ 列表 10.8 所示，你可以更改变量的值。注意看当你给一个指针加一个数字时，该指针的值会发生什么变化。（回想指针的 `%p` 格式符通常显示十六进制值。）\n\
  \n### 列表 10.8 pnt_add.c 程序\n\n点击此处查看代码\n\n```c\n// pnt_add.c -- 指针加法\n\n#include\
  \ <stdio.h>\n\n#define SIZE 4\n\nint main(void)\n{\n    short dates [SIZE];\n  \
  \  short * pti;\n    short index;\n    double bills[SIZE];\n    double * ptf;\n\
  \    pti = dates;     //将数组地址赋值给指针\n    ptf = bills;\n    printf(\"%23s %15s\\n\"\
  , \"short\", \"double\");\n    for (index = 0; index < SIZE; index ++)\n       \
  \ printf(\"pointers + %d: %10p %10p\\n\",\n               index, pti + index, ptf\
  \ + index);\n    return 0;\n}\n```\n\n以下是示例输出：\n\n点击此处查看代码\n\n```text\nshort   \
  \        double\npointers + 0: 0x7fff5fbff8dc 0x7fff5fbff8a0\npointers + 1: 0x7fff5fbff8de\
  \ 0x7fff5fbff8a8\npointers + 2: 0x7fff5fbff8e0 0x7fff5fbff8b0\npointers + 3: 0x7fff5fbff8e2\
  \ 0x7fff5fbff8b8\n```\n\n第二行打印了两个数组的起始地址，下一行给出了地址加 1 的结果，依此类推。请记住，地址是十六进制的，所以 `dd`\
  \ 比 `dc` 大 1，`a1` 比 `a0` 大 1。但我们在这里看到了什么呢？\n\n点击此处查看代码\n\n`0x7fff5fbff8dc + 1` 等于\
  \ `0x7fff5fbff8de` ？\n\n`0x7fff5fbff8a0 + 1` 等于 `0x7fff5fbff8a8` ？\n\n很蠢吗？狐狸一样聪明！我们的系统按字节寻址的，但\
  \ `short` 类型使用 2 个字节，而 `double` 类型使用 8 个字节。这里发生的情况是，当你说“给指针加 1”时，C 会增加一个`storage\
  \ unit`（存储单元）。对于数组来说，这意味着地址增加到了下一个`element`（元素）的地址，而不仅仅是下一个字节（参见图 10.3）。这也是你必须声明指针所指向对象类型的原因之一。仅有地址是不够的，因为计算机需要知道存储对象使用了多少字节。（对于指向标量变量的指针也是如此；否则获取值的\
  \ `*pt` 操作将无法正常工作。）\n\n![图像](img/10fig03.jpg)\n\n图 10.3 数组与指针加法。\n\n现在我们可以更清楚地定义指向`int`的指针、指向`float`的指针或指向任何其他数据对象的指针含义：\n\
  \n![图像](img/squf.jpg) 指针的值是它所指向对象的地址。内部如何表示该地址取决于硬件。许多计算机（包括 PC 和 Mac）都是`字节可寻址`的，这意味着内存中的每个字节都是顺序编号的。在这里，大型对象（例如\
  \ `double` 类型变量）的地址通常是该对象第一个字节的地址。\n\n![图像](img/squf.jpg) 对指针应用 `*` 操作会得到指向对象中存储的值。\n\
  \n![图像](img/squf.jpg) 将指针加 1 会根据所指向类型的大小（以字节为单位）增加其值。\n\n由于 C 语言的巧妙设计，我们得到了以下等式：\n\
  \n点击此处查看代码\n\n`dates + 2 == &date[2]` // 相同的地址\n`*(dates + 2) == dates[2]` // 相同的值\n\
  \n这些关系总结了数组和指针之间的联系。这意味着你可以使用指针来识别数组的单个元素并获取它的值。本质上，我们对同一事物使用了两种不同的表示法。事实上，C 语言用指针来描述数组表示法。也就是说，它定义\
  \ `ar[n]` 意味着 `*(ar + n)`。你可以将第二个表达式理解为“前往内存位置 `ar`，移动 `n` 个单位，并检索值”。\n\n顺便提一下，不要将\
  \ `*(dates+2)` 与 `*dates+2` 混淆。`*` 操作符优先级高于 `+`，所以 `*dates+2` 实际上是 `(*dates)+2`。\n\
  \n\n\n\n\n点击此处查看代码图像\n\n```c\nint sum(int * ar, int n)  // 更通用的方法\n\n{\n    int\
  \ i;\n    int total = 0;\n    for( i = 0; i < n; i++)   // 使用 n 个元素\n        total\
  \ += ar[i];      // ar[i] 等于 *(ar + i)\n\n    return total;\n}\n```\n\n在这里，第一个参数告诉函数哪里找到数组以及数组中数据的类型，第二个参数告诉函数存在多少个元素。\n\
  \n关于函数参数还有一点需要说明。在函数原型声明或函数定义头部的语境中，*仅*在那种语境下，你可以用 `int ar[]` 替换 `int * ar`：\n\n\
  ```c\nint sum (int ar[], int n);\n```\n\n`int * ar` 形式始终意味着 `ar` 的类型为指向 `int` 的指针。`int\
  \ ar[]` 形式也意味着 `ar` 的类型为指向 `int` 的指针，但*仅*当用于声明形式参数时如此。这种设计的目的是让第二种形式提醒读者，`ar` 不仅指向一个\
  \ `int`，它还指向一个作为数组元素的 `int`。\n\n***\n\n### 注意：声明数组参数\n\n由于数组名是第一个元素的地址，因此数组名称的实际参数要求匹配的形式参数必须是一个指针。在这种语境下，且仅在此种语境下，C\
  \ 将 `int ar[]` 解释为与 `int * ar` 相同；即 `ar` 的类型为指向 `int` 的指针。由于原型允许你省略名称，以下四个原型都是等价的：\n\
  \n```c\nint sum(int *ar, int n);\nint sum(int *, int);\nint sum(int ar[], int n);\n\
  int sum(int [], int);\n```\n\n你不能在函数定义中省略名称，因此对于定义，以下两种形式是等价的：\n\n```c\nint sum(int\
  \ *ar, int n)\n{\n    // 代码写在这里\n}\n\nint sum(int ar[], int n)\n{\n    // 代码写在这里\n\
  }\n```\n\n你应该能够配合此处显示的两个定义中的任意一个，使用四个原型中的任何一个。\n\n***\n\n列表 10.10 显示了一个使用 `sum()`\
  \ 函数的程序。为了指出关于数组参数的一个有趣事实，程序还打印了原始数组以及代表数组的函数参数的大小。（如果你的编译器不支持打印 `sizeof` 数量的 `%zd`\
  \ 格式，请使用 `%u` 或 `%lu`。）\n\n列表 10.10 sum_arr1.c 程序\n\n点击此处查看代码图像\n\n***\n\n```c\n\
  // sum_arr1.c -- 累加数组元素\n// 如果 %zd 不起作用，使用 %u 或 %lu\n#include <stdio.h>\n#define\
  \ SIZE 10\n\nint sum(int ar[], int n);\n\nint main(void)\n{\n    int marbles[SIZE]\
  \ = {20,10,5,39,4,16,19,26,31,20};\n    long answer;\n    answer = sum(marbles,\
  \ SIZE);\n    printf(\"The total number of marbles is %ld.\\n\", answer);\n    printf(\"\
  The size of marbles is %zd bytes.\\n\",\n           sizeof marbles);\n    return\
  \ 0;\n}\n\nint sum(int ar[], int n)     // 数组有多大？\n{\n    int i;\n    int total\
  \ = 0;\n    for( i = 0; i < n; i++)\n        total += ar[i];\n    printf(\"The size\
  \ of ar is %zd bytes.\\n\", sizeof ar);\n    return total;\n}\n```\n\n***\n\n我们在系统上的输出如下：\n\
  \n点击此处查看代码图像\n\nThe size of ar is 8 bytes.\nThe total number of marbles is 190.\n\
  The size of marbles is 40 bytes.\n\n注意 `marbles` 的大小是 40 字节。这是合理的，因为 `marbles` 包含\
  \ 10 个 `int`，每个 4 字节，总共 40 字节。但 `ar` 的大小仅为 8 字节。这是因为 `ar` 本身并不是一个数组；它是指向第一个元素的指针。\n\
  \n## 使用指针参数\n\n`sum()` 函数使用了第一个元素的地址，数组名称的实际参数要求匹配的形式参数必须是一个指针。\n\n\n\n\n单元运算符 `*`\
  \ 和 `++` 具有相同的优先级，但从右向左结合。这意味着 `++` 作用于 `start`，而不是 `*start`。也就是说，指针被增加了，而不是它所指向的值。使用后置形式（即使用\
  \ `start++` 而不是 `++start`）意味着在将所指向的值加到 `total` 之前，指针不会增加。如果程序使用 `*++start`，其顺序将是先增加指针，然后使用所指向的值。然而，如果程序使用\
  \ `(*start)++`，它将先使用 `start` 的值，然后增加该值，而不是指针。这将使得指针仍然指向同一个元素，但该元素将包含一个新的数字。虽然 `*start++`\
  \ 记法常用，但 `*(start++)` 记法更清晰。列表 10.12 阐释了这些优先级的细微之处。\n\n### 列表 10.12 order.c 程序\n\
  \n点击此处查看代码图像\n\n***\n\n```c\n/* order.c -- 指针操作中的优先级 */\n\n#include <stdio.h>\n\n\
  int data[2] = {100, 200};\n\nint moredata[2] = {300, 400};\n\nint main(void)\n{\n\
  \    int * p1, * p2, * p3;\n    p1 = p2 = data;\n    p3 = moredata;\n    printf(\"\
  \  *p1 = %d,    *p2 = %d,      *p3 = %d\\n\",\n           *p1,    *p2,      *p3);\n\
  \    printf(\"*p1++ = %d, *++p2 = %d, (*p3)++ = %d\\n\",\n           *p1++,    *++p2,\
  \ (*p3)++);\n    printf(\"  *p1 = %d,    *p2 = %d,      *p3 = %d\\n\",\n       \
  \    *p1,      *p2,      *p3);\n    return 0;\n}\n```\n\n***\n\n这是它的输出结果：\n\n点击此处查看代码图像\n\
  \n  *p1 = 100,    *p2 = 100,      *p3 = 300\n*p1++ = 100, *++p2 = 200, (*p3)++ =\
  \ 300\n  *p1 = 200,    *p2 = 200,      *p3 = 301\n\n唯一改变数组值的操作是 `(*p3)++`。另外两个操作导致\
  \ `p1` 和 `p2` 进阶指向下一个数组元素。\n\n### 注释：指针与数组\n\n正如你所看到的，处理数组的函数实际上使用指针作为参数，但在编写处理数组的函数时，你可以在数组记法和指针记法之间进行选择。使用数组记法（如列表\
  \ 10.10` 在意义上是等价的。如果 `ar` 是数组名，两者有效；如果 `ar` 是指针变量，两者也有效。然而，使用像 `ar++` 这样的表达式仅在 `ar`\
  \ 是指针变量时有效。\n\n指针记法（特别是当与增运算符配合使用时）更接近机器语言，在某些编译器上会导致更高效的代码。然而，许多程序员认为，程序员主要的关注点应该是正确性和清晰度，代码优化应该交给编译器。\n\
  \n## 指针操作\n\n你用指针可以做什么？C 提供了几种可以对指针执行的各种操作，下一个程序演示了其中八种。为了显示每个操作的结果，程序会打印指针的值（即它指向的地址）、所指向地址存储的值以及指针本身的地址。（如果你的编译器不支持\
  \ `%p` 说明符，请尝试使用 `%u` 或可能是 `%lu` 来打印地址。如果它不支持用于差值的 `%td` 说明符，请尝试 `%d` 或可能是 `%ld`。）列表\
  \ 10.13 显示了可以使用指针变量执行的基本操作。除了这些操作外，你还可以使用关系运算符来比较指针。\n\n### 列表 10.13 ptr_ops.c 程序\n\
  \n点击此处查看代码图像\n\n```c\n// ptr_ops.c -- 指针操作\n#include <stdio.h>\nint main(void)\n\
  {\n    int urn[5] = {100,200,300,400,50};\n    int * ptr1, * ptr2, *ptr3;\n    ptr1\
  \ = urn; // 给指针分配一个地址\n    int urn[5] = {100,200,300,400,50};\n    int * ptr1, *\
  \ ptr2, *ptr3;\n    ptr1 = urn; // 给指针分配一个地址\n    ptr2 = urn; // 给指针分配一个地址\n   \
  \ ptr3 = moredata; // 给指针分配一个地址\n    // (此处省略部分重复代码以保持逻辑一致)\n}\n```\n*(注：由于提供的原文中代码块部分存在重复和混乱，翻译时严格遵循“代码块不需要翻译”的原则，保持了原始代码结构。)*\n\
  \n\n\n\n\n![Image](img/squf.jpg)\n\n### 给指针加上整数—\n你可以使用 `+` 运算符将整数加到指针上，或将指针加到整数上。在何种情况下，整数都会乘以所指向类型的字节数，并将结果加到原始地址上。这使得\
  \ `ptr1 + 4` 等同于 `&urn[4]`。如果加法结果位于原始指针所指向的数组之外，则该结果是未定义的，但数组末尾元素之后的一个地址保证是有效的。\n\
  \n![Image](img/squf.jpg) ### 递增指针—\n对指向数组元素的指针递增会使其移动到数组的下一个元素。因此，`ptr1++` 将 `ptr1`\
  \ 的数值值增加了 `4`（在我们的系统中，每个 `int` 占 4 字节），并使 `ptr1` 指向 `urn[1]`（请参阅图 10.4，该图使用了简化的地址）。现在\
  \ `ptr1` 的值为 `0x7fff5fbff8d4`（下一个数组地址），而 `*ptr1` 的值为 `200`（`urn[1]` 的值）。注意，`ptr1`\
  \ 身的地址保持为 `0x7fff5fbff8c8`。毕竟，变量并不会因为值的改变而移动！\n\n![Image](img/10fig04.jpg)\n\n图\
  \ 10.4 递增一个 `int` 类型的指针。\n\n![Image](img/squf.jpg) ### 从指针减去整数—\n你可以使用 `-` 运算符从指针减去一个整数；指针必须是第一个操作数，整数值是第二个操作数。整数乘以所指向类型的字节数，并将结果从原始地址减去。这使得\
  \ `ptr3 - 2` 等同于 `&urn[2]`，因为 `ptr3` 指向 `&urn[4]`。如果减法结果位于原始指针所指向的数组之外，则该结果是未定义的，但数组末尾元素之后的一个地址保证是有效的。\n\
  \n![Image](img/squf.jpg) ### 递减指针—\n当然，你也可以递减指针。在这个示例中，递减 `ptr2` 使它指向数组的第二个元素而不是第三个元素。注意，你可以同时使用递增和递减运算符的前置和后置形式。还要注意，`ptr1`\
  \ 和 `ptr2` 在被重置之前，最终都指向同一个元素 `urn[1]`。\n\n![Image](img/squf.jpg) ### 求差—\n你可以找到两个指针之间的差值。通常，你对指向同一个数组元素的两个指针进行此操作，以确定元素之间的距离有多远。结果的单位与类型大小相同。例如，在列表\
  \ 10.13 的输出中，`ptr2 - ptr1` 的值为 `2`，这意味着这些指针指向的对象之间相隔了两个 `int`，而不是 2 个字节。只要两个指针都指向同一个数组（或可能指向末尾之后的位置），减法就保证是一个有效操作。对指向两个不同数组的指针应用该操作可能会产生一个值，也可能导致运行时错误。\n\
  \n![Image](img/squf.jpg) ### 比较—\n只要指针类型相同，你就可以使用关系运算符来比较两个指针的值。\n\n注意，减法有两种形式。你可以从一个指针减去另一个指针得到一个整数，也可以从一个指针减去一个整数得到一个指针。\n\
  \n在递增或递减指针时，有一些需要注意的地方。计算机不会跟踪指针是否仍然指向数组元素。C 保证，给定一个数组，指向该数组任何元素的指针或指向最后一个元素之后的位置的都是有效指针。但递增或递减指针超出这些限制的效果是未定义的。此外，你可以对指向任何数组元素的指针进行解引用。然而，尽管指向越界一元素的指针是有效的，但不能保证这种越界一的指针可以被解引用。\n\
  \n***\n\n### 对未初始化指针进行解引用\n\n说到注意事项，有一条规则你应该牢记在心：不要对未初始化的指针进行解引用。例如，考虑以下情况：\n\n\
  点击此处查看代码图像\n\n```c\nint * pt;  // 一个未初始化的指针\n\n*pt = 5;   // 极其严重的错误\n```\n\n为什么这很糟糕？第二行的意思是将值\
  \ `5` 存储在 `pt` 指向的位置。但由于 `pt` 未初始化，它有一个随机值，因此无法知道 `5` 将被放在何处。它可能会去一个无害的地方，可能会覆盖数据或代码，也可能导致程序崩溃。记住，创建指针仅分配了用于存储指针本身的内存；它并没有分配用于存储数据的内存。因此，在使用指针之前，应该给它分配一个已经分配好的内存位置。例如，你可以将现有变量的地址赋值给指针。（这就是当你使用带有指针参数的函数时发生的情况。）或者，你可以使用第\
  \ 12 章中讨论的 `malloc()` 函数先分配内存。无论如何，为了强调这一点，不要对未初始化指针进行解引用！\n\n点击此处查看代码图像\n\n```c\n\
  double * pd; // 未初始化的指针\n\n*pd = 2.4; // 不要这样做\n```\n\n给定\n\nint urn[3];\n\nint\
  \ * ptr1, * ptr2;\n\n以下是一些有效操作：\n\n![Image](img/412tab01.jpg)\n\n开启许多可能性。放松——我们将坚持揭示的基本用法。指针的第一个用法是从函数传递信息。第二个用法是在函数中操作数组。\n\
  \n## 保护数组内容\n\n当你编写处理基本类型（如 `int`）的函数时，你可以选择按值传递或传递指针。通常规则是，除非程序需要修改值，否则按值传递。数组并没有给你这种选择；你*必须*传递指针。这是出于效率。如果函数按值传递数组，它将分配足够的空间来存放原始数组的副本，并将原始数组的所有数据拷贝到新数组中。传递数组地址并让函数与原始数据工作快得多。\n\
  \n这种技术可能会导致问题。C 通常按值传递数据是为了保护数据的完整性。如果函数与原始数据的副本工作，它就不会意外修改原始数据。但是，由于处理数组的函数确实与原始数据工作，它们可以修改数组。有时这是理想的。例如，这里有一个向数组的每个成员添加相同值的函数：\n\
  \n```c\nvoid add_to(double ar[], int n, double val)\n{\n    int i;\n    for( i =\
  \ 0; i < n; i++)\n        ar[i] += val;\n}\n```\n\n因此，函数调用\n\nadd_to(prices, 100,\
  \ 2.50);\n\n导致 `prices` 数组中的每个元素都被替换为大 2.50 的值；此函数修改了数组的内容。它能这样做是因为通过使用指针，函数使用了原始数据。\n\
  \n其他函数并没有修改数据的意图。例如，下面的函数旨在计算数组内容的和；它不应该改变数组。然而，因为 `ar` 实际上是一个指针，编程错误可能会导致原始数据被损坏。这里，例如，表达式\
  \ `ar[i]++` 会导致每个元素的值增加 1：\n\n\n\n\n\n点击此处查看代码图像\n\n```c\nint sum(int ar[], int\
  \ n)  // 错误代码\n\n{\n    int i;\n    int total = 0;\n    for( i = 0; i < n; i++)\n\
  \        total += ar[i]++;   // 错误：递增了每个元素\n    return total;\n}\n```\n\n### 在形式参数中使用\
  \ const\n\n在 K&R C 中，避免此类错误的唯一方法是保持警惕。从 ANSI C 开始，有了一种替代方案。如果一个函数的意图是不改变数组的内容，那么在原型声明和函数定义中，声明形式参数时，请使用\
  \ `const` 关键字。例如，`sum()` 的原型声明和定义应该像如下所示：\n\n点击此处查看代码图像\n\n```c\nint sum(const int\
  \ ar[], int n);  /* 声明 */\nint sum(const int ar[], int n)    /* 定义 */\n{\n    int\
  \ i;\n    int total = 0;\n    for( i = 0; i < n; i++)\n        total += ar[i];\n\
  \    return total;\n}\n```\n\n这告诉编译器，函数应该将 `ar` 指向的数组视为包含常量数据的数组。那么，如果你不小心使用了像 `ar[i]++`\
  \ 的表达式，编译器就可以捕获它并生成错误信息，告诉该函数正尝试修改常量数据。\n\n重要的一点是，这样使用 `const` 并不要求原始数组*必须*是常量；它只是说函数必须*仿佛*数组是常量一样对待它。这种方式使用\
  \ `const` 为数组提供的保护，就相当于按值传递为基本类型提供的保护；它防止了函数修改调用函数中的数据。通常情况下，如果你编写一个意图修改数组的函数，在声明数组参数时不要使用\
