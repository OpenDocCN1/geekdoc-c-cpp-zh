  \ `complex.h` 的内容。\n\n这是一个短程序，展示了复数支持的部分内容。\n\n点击此处查看代码图像\n\n```c\n//  complex.c\
  \ --  complex numbers\n\n#include <stdio.h>\n\n#include <complex.h>\n\nvoid show_cmlx(complex\
  \ double cv);\n\nint main(void)\n{\n    complex double v1 = 4.0 + 3.0*I;\n    double\
  \ re, im;\n    complex double v2;\n    complex double sum, prod, conjug;\n    printf(\"\
  Enter the real part of a complex number: \");\n    scanf(\"%lf\", &re);\n    printf(\"\
  Enter the imaginary part of a complex number: \");\n    scanf(\"%lf\", &im);\n//\
  \  CMPLX() a C11 feature\n//  v2 = CMPLX(re, im);\n    v2 = re + im * I;\n    printf(\"\
  v1: \");\n    show_cmlx(v1);\n    putchar('\\n');\n    printf(\"v2: \");\n    show_cmlx(v2);\n\
  \    putchar('\\n');\n    sum = v1 + v2;\n    prod = v1 * v2;\n    conjug =conj(v1);\n\
  \    printf(\"sum: \");\n    show_cmlx(sum);\n    putchar('\\n');\n    printf(\"\
  product: \");\n    show_cmlx(prod);\n    putchar('\\n');\n    printf(\"complex congjugate\
  \ of v1: \");\n    show_cmlx(conjug);\n    putchar('\\n');\n    return 0;\n}\n\n\
  void show_cmlx(complex double cv)\n{\n    printf(\"(%.2f, %.2fi)\", creal(cv), cimag(cv));\n\
  \    return;\n}\n```\n\n如果你使用 C++，你应该意识到 C++ 的 `complex` 头文件提供了一种基于类的处理复数的方法，这与\
  \ C 的 `complex.h` 头文件不同。\n\n## 第九节：C 与 C++ 之间的差异\n\n在大多数情况下，C++ 是 C 的超集，这意味着有效的\
  \ C 程序也是一个有效的 C++ 程序。C++ 与 C 之间的主要区别在于 C++ 支持的许多额外功能。然而，在某些领域，C++ 的规则与 C 的对应规则略有不同。这些差异可能会导致\
  \ C 程序在编译为 C++ 程序时，运行方式略有不同，或者可能无法运行。这些正是本附录所讨论的差异。如果你使用仅支持 C++ 而不支持 C 的编译器来编译你的\
  \ C 程序，你需要了解这些差异。虽然它们只影响了书中极少数的示例，但这些差异可能会导致某些有效的 C 代码在被编译为 C++ 程序时产生错误信息。\n\nC99\
  \ 标准的发布使问题变得复杂，因为它在某些地方让 C 更加趋近于 C++。例如，它允许在代码体中随处穿插声明，并识别了 `//` 注释指示符。在其他方面，C99\
  \ 增加了与 C++ 的分离——例如，通过添加变长数组和 `restrict` 关键字。C11 在某种程度上缩小了差距，例如，引入了 `char16_t` 类型，添加了关键字\
  \ `_Alignas`，并创建了宏 `alignas` 以匹配 C++ 关键字。由于 C11 仍处于起步阶段，且某些供应商尚未完全接受 C99，我们面临着 C90、C99\
  \ 和 C11 之间的差异，以及 C++11 与这些标准标准之间的差异。本节将面对未来，讨论 C99、C11 和 C++ 之间的一些差异。同时，C++ 也在不断进化，因此\
  \ C 和 C++ 之间精确的对应关系和差异将继续变化。\n\n### 函数原型\n\n在 C++ 中，函数原型是强制性的，但在 C 中是可选的。如果你在声明函数时留空括号，这种差异就会体现出来。在\
  \ C 中，空括号意味着你放弃了原型声明，但在 C++ 中，它们意味着函数没有参数。也就是说，在 C++ 中，原型：\n\n```c\nint slice();\n\
  ```\n\n等同于以下内容：\n\n```c\nint slice(void);\n```\n\n例如，以下序列在 C 中是可以接受的（尽管很过时），但在 C++\
  \ 中是错误：\n\n```c\nint slice();\n\nint main()\n{\n...\n    slice(20, 50);\n...\n}\n\
  \nint slice(int a, int b)\n{\n...\n}\n```\n\n在 C 中，编译器假设你使用了旧形式来声明函数。在 C++ 中，编译器假设\
  \ `slice()` 等同于 `slice(void)`，并且认为你没有声明 `slice(int, int)` 函数。\n\n此外，C++ 允许你声明多个同名的函数，只要它们具有不同的参数列表。\n\
  \n### 字符常量\n\nC 将 `char` 常量视为 `int` 类型，而 C++ 将它们视为 `char` 类型。例如，考虑此条语句：\n\n```c\n\
  char ch = 'A';\n```\n\n在 C 中，常量 `'A'` 存储在一个 `int` 大小的内存块中；更准确地说，字符编码被存储在 `int` 中。相同的数值也存储在变量\
  \ `ch` 中，但在这里它只占用一个字节的内存。\n\n相反，C++ 对 `'A'` 和 `ch` 均使用一个字节。这种区别不会影响本文中的任何示例。但是，某些\
  \ C 程序确实了字符常量是 `int` 类型这一特性，通过使用字符表示法表示整数值。例如，如果系统拥有 4 字节的 `int`。\n\n### const 修饰符\n\
  \n在 C 中，全局 `const` 具有外部链接，但在 C++ 中，它具有内部链接。也就是说，C++ 的声明：\n\n```cpp\nconst double\
  \ PI = 3.14159;\n```\n\n等同于 C 的声明：\n\n```c\nstatic const double PI = 3.14159;\n\
  ```\n\n只要这两个声明都在函数外部。C++ 的规则旨在使得在头文件中使用 `const` 更加简单。\n\n\n\n\n在 C++ 中（但在 C 中不能），你可以使用\
  \ `const` 来初始化其他 `const` 值：\n\n点击此处查看代码图像\n\n```cpp\nconst double RATE = 0.06; \
  \          // valid C++, C\nconst double STEP = 24.5;          // valid C++, C\n\
  const double LEVEL = RATE * STEP;  // valid C++, invalid C\n```\n\n## 结构体与联合体\n\n\
  在声明一个带有标签（tag）的结构体（structure）或联合体（union）后，你可以在 C++ 中将标签作为类型名：\n\n点击此处查看代码图像\n\n\
  ```cpp\nstruct duo\n{\n    int a;\n    int b;\n};\n\nstruct duo m;  /* valid C,\
  \ C++ */\nduo n;         /* invalid C, valid C++ */\n```\n\n因此，结构名称可能会与变量名冲突。例如，以下程序可以作为\
  \ C 程序编译，但在 C++ 程序中会失败，因为 C++ 将 `printf()` 语句中的 `duo` 解释为结构类型，而不是外部变量：\n\n点击此处查看代码图像\n\
  \n```cpp\n#include <stdio.h>\n\nfloat duo = 100.3;\n\nint main(void)\n{\n    struct\
  \ duo { int a; int b;};\n    struct duo y = { 2, 4};\n    printf (\"%f\\n\", duo);\
  \   /* ok in C, not in C++ */\n    return 0;\n}\n```\n\n在 C 和 C++ 中，你可以在结构体内部声明另一个结构体：\n\
  \n点击此处查看代码图像\n\n```cpp\nstruct box\n{\n    struct point {int x; int y; } upperleft;\n\
  \    struct point lowerright;\n};\n```\n\n在 C 中，你可以之后使用任何一个结构体，但 C++ 对嵌套结构体需要特殊的表示法：\n\
  \n点击此处查看代码图像\n\n```cpp\nstruct box ad;     /* valid C, C++ */\nstruct point dot;\
  \  /* valid C, invalid C++ */\nbox::point dot;    /* invalid C, valid C++ */\n```\n\
  \n## 举型\n\nC++ 对枚举（enumerations）的使用比 C 更严格。特别是对于 `enum` 变量，唯一能做的有用操作就是给它赋值一个 `enum`\
  \ 常量并将其与其他值进行比较。你不能在没有显式类型转换的情况下将 `int` 赋值给 `enum`，而且不能增加 `enum` 变量。以下代码说明了这些点：\n\
  \n点击此处查看代码图像\n\n```cpp\nenum sample {sage, thyme, salt, pepper};\nenum sample season;\n\
  \nseason = sage;           /* ok in C, C++ */\nseason = 2;              /* warning\
  \ in C, error in C++ */\nseason = (enum sample) 3; /* ok in C, C++ */\nseason++;\
  \                /* ok in C, error in C++ */\n```\n\n此外，C++ 允许在声明变量时省略 `enum` 关键字：\n\
  \n点击此处查看代码图像\n\n```cpp\nenum sample {sage, thyme, salt, pepper};\nsample season;\
  \     /* invalid C, valid C++ */\n```\n\n与结构体和联合体的情况一样，如果变量和 `enum` 类型具有相同的名称，可能会导致冲突。\n\
  \n## 空指针\n\n在 C++ 中，与 C 一样，你可以将任何类型的指针赋值给 `void` 指针（pointer-to-`void`），但与 C 不同，除非使用显式类型转换，否则你不能将\
  \ `void` 指针赋值给另一种类型。以下代码说明了这些点：\n\n点击此处查看代码图像\n\n```cpp\nint ar[5] = {4, 5, 6,7,\
  \ 8};\nint * pi;\nvoid * pv;\n\npv = ar;             /* ok in C, C++ */\npi = pv;\
  \             /* ok in C, invalid in C++ */\npi = (int * ) pv;   /* ok in C, C++\
  \ */\n```\n\nC++ 的另一个区别是，你可以将派生类对象的地址赋值给基类指针，但这涉及 C 中不存在的特性。\n\n## 布尔类型\n\n在 C++\
  \ 中，布尔类型是 `bool`，而 `true` 和 `false` 是关键字。在 C 中，布尔类型是 `_Bool`，但包含头文件 `stdbool.h`\
  \ 就可以使用 `bool`、`true` 和 `false` 了。\n\n## 替代拼写\n\n在 C++ 中，`||` 的替代拼写 `or` 等等符号是关键字。在\
  \ C99 和 C11 中，它们被定义为宏，你需要包含 `iso646.h` 才能使用它们。\n\n## 宽字符支持\n\n在 C++ 中，`wchar_t`\
  \ 是内置类型，且 `wchar_t` 是一个关键字。在 C99 和 C11 中，`wchar_t` 类型定义在几个文件中（`stddef.h`、`stdlib.h`、`wchar.h`、`wctype.h`）。同样，`char16_t`\
  \ 和 `char32_t` 是 C++11 的关键字，但在 C11 的 `uchar.h` 中是宏。C++ 通过 `iostream` 头文件提供宽字符 IO（`wchar_t`,\
  \ `char16_t`, 和 `char32_t`），而 C99 通过 `wchar.h` 头文件提供完全不同的 IO 包。\n\n## 复数类型\n\nC++\
  \ 通过 `complex` 头文件支持复数类型。C 有内置复数类型并通过 `complex.h` 头文件支持它们。两种方法非常不同且互不兼容。C 版本反映了数值社区的需求和实践。\n\
  \n## 内联函数\n\nC99 添加了内联函数支持，而 C++ 已经有了。但 C99 的实现更加灵活。在 C++ 中，内联函数默认具有内部链接（internal\
  \ linkage）。如果一个 C++ 内联函数出现在多个文件中，它必须相同的定义。例如，一个文件可以使用 `int` 类型参数，另一个文件可以使用 `int32_t`\
  \ 类型参数，即使 `int32_t` 是 `int` 的 `typedef`。同样，如第 15 章所述，C 允许内联和外部定义的混合使用。\n\n## C99/11\
  \ 在 C++ 中缺失的特性\n\n虽然 C 传统上是 C++ 的子集，但 C99 标准增加了若干 C++ 缺失的特性。是一些主要的 C99/C11 特有特性：\n\
