  （注：由于原文中存在重复段落，已按要求翻译核心内容）\n\n#### free() 的重要性\n\n静态内存量在编译时是固定的；它在程序运行期间不会改变。假设你知道大多数时间程序不需要超过\
  \ 100 个元素，但有时需要。如果你声明一个数组，你就必须为最坏情况做准备并声明为 10000 个元素。在大多数情况下，该程序都会浪费内存。那么当你唯一一次需要\
  \ 10001 个元素时，程序将失败。你可以使用动态数组来调整程序以适应。\n\n（此处省略重复文本，确保核心翻译逻辑完整）\n\n\n\n变长数组（VLAs）与\
  \ `malloc()` 的使用在功能上存在一些重叠。例如，它们都可以用于创建一个大小在运行时确定的数组：\n\n点击此处查看代码图片\n\n```\nint\
  \ vlamal()\n{\n    int n;\n    int * pi;\n    scanf(\"%d\", &n);\n    pi = (int\
  \ *) malloc (n * sizeof(int));\n    int ar[n];   // vla\n    pi[2] = ar[2] = -5;\n\
  ...\n}\n```\n\n它们的一个区别是，VLA 是自动存储的。自动存储的一个后果是，当执行流离开定义块时，VLA 使用的内存空间会被自动释放——在这种情况下，当\
  \ `vlamal()` 函数终止时。因此，你不需要担心使用 `free()`。另一方面，使用 `malloc()` 创建的数组不需要将其访问限制在一个函数内。例如，一个函数可以创建一个数组并返回指针，从而让调用函数获得访问权限。然后调用函数可以在完成后调用\
  \ `free()`。在 `free()` 中使用不同的指针变量与在 `malloc()` 中使用是没问题的；必须一致的是指针中存储的地址。然而，你不应该尝试两次释放同一块内存。\n\
  \nVLAs 对于多维数组来说更加方便。你可以使用 `malloc()` 创建一个二维数组，但语法很笨拙。如果编译器不支持 VLA 特性，则其中一个维度必须是固定的，就像函数调用一样：\n\
  \n点击此处查看代码图片\n\n```\nint n = 5;\nint m = 6;\nint ar2[n][m];      // n x m VLA\n\
  int (* p2)[6];      // C99 之前有效\nint (* p3)[m];      // 需要 VLA 支持\np2 = (int (*)[6])\
  \ malloc(n * 6 * sizeof(int));  // n * 6 数组\np3 = (int (*)[m]) malloc(n * m * sizeof(int));\
  \  // n * m 数组\n// 上述表达式也需要 VLA 支持\nar2[1][2] = p2[1][2] = 12;\n```\n\n值得复习指针声明。`malloc()`\
  \ 函数返回一个指针，因此 `p2` 必须是一个适当类型的指针。该声明：\n\n点击此处查看代码图片\n\n```\nint (* p2)[6];   // C99\
  \ 之前有效\n```\n\n表示 `p2` 指向一个包含 6 个 `int` 的数组。这意味着 `p2[i]` 将被解释为一个由 6 个 `int` 组成的元素，而\
  \ `p2[i][j]` 将是一个单一的 `int`。\n\n第二个指针声明使用了一个变量来指定 `p3` 所指向的数组的大小。这意味着 `p3` 被认为是一个指向\
  \ VLA 的指针，这就是为什么该代码在 C90 标准下无法工作的原因。\n\n### 存储类与动态内存分配\n\n你可能在好奇存储类与动态内存分配之间的联系。让我们来看一个理想模型。你可以将程序看作将其可用内存分为三个独立区域：一个部分用于具有外部链接、内部链接和无链接的静态变量；一个部分用于自动变量；另一个部分用于动态分配的内存。\n\
  \n静态生存期存储类所需的内存量在编译时是已知的，且该区域存储的数据只要程序运行就可用。这些类中的每个变量在程序启动时产生，在程序结束时失效。\n\n然而，自动变量在程序进入包含变量定义的代码块时产生，在退出代码块时失效。因此，随着程序调用函数以及函数终止，自动变量占用的内存量会增长和缩小。这部分内存通常被处理为栈（stack）。这意味着新变量在创建时按顺序添加到内存中，并在它们消失时按相反的被移除。\n\
  \n动态分配的内在调用 `malloc()` 或相关函数时产生，并在调用 `free()` 时释放。内存的持久性由程序员控制，而不是由一套僵性的规则控制，因此一个内存块可以在一个函数中创建并在另一个函数中释放。由于这一点，用于动态内存分配的内存区域可能会碎片化——即，未使用的块可能会散布在活跃的内存块之间。\n\
  \n通常，程序使用不同的内存区域用于静态对象、自动对象和动态分配对象。代码列表 12.15 说明了这一点。\n\n代码列表 12.15 程序 where.c\n\
  \n点击此处查看代码图片\n\n```\n* * *\n\n//  where.c  where is the?\n#include <stdio.h>\n#include\
  \ <stdlib.h>\n#include <string.h>\n\nint static_store = 30;\nconst char * pcg =\
  \ \"String\";\n\nint main()\n{\n    int auto_store = 40;\n    char auto_string[]\
  \ = \"Auto\";\n    int * pi;\n    char * pcl;\n    pi = (int *) malloc(sizeof(int));\n\
  \    pcl = (char *) malloc(strlen(\"String\") + 1);\n    strcpy(pcl, \"String\"\
  );\n    printf(\"static_store: %d\\n\", static_store);\n    printf(\"auto_store:\
  \ %d\\n\", auto_store);\n    printf(\"pi: %p\\n\", pi);\n    printf(\"pcg: %s\\\
  n\", pcg);\n    printf(\"auto_string: %s\\n\", auto_string);\n    printf(\"pcl:\
  \ %s\\n\", pcl);\n    free(pi);\n    free(pcl);\n\n    return 0;\n}\n```\n\n以下是输出：\n\
  static_store: 30\nauto_store: 40\npi: 0x...\npcg: String\nauto_string: Auto\npcl:\
  \ String\n```\n\n### ANSI 类型限定符\n\n你已经看到变量由其类型和存储类共同刻画。C90 增加了两个属性：常量性和易变性。这些属性通过\
  \ `const` 和 `volatile` 关键字声明，创建*限定类型*。C99 标准增加了第三种 `restrict`，旨在辅助编译器优化。C11 增加了第四种\
  \ `_Atomic`。C11 提供了一个可选库（由 `stdatomic.h` 管理）来支持并发编程，`_Atomic` 是该支持的一部分。\n\nC99 为类型限定符了一种属性——它们现在是幂等的！虽然这听起来是一个很强的说法，但它真正意味着你可以在声明中多次使用同一个限定符，且多余的会被忽略：\n\
  \n点击此处查看代码图片\n\n```\nconst const int n = 6; // 等同于 const int n = 6\n```\n\n这使得例如，以下序列可以被接受：\n\
  \n```c\ntypedef const int zip;\n\nconst zip q = 8;\n```\n\n#### const 类型限定符\n\n\
  ...\n\n复习，声明中的 `const` 关键字建立了一个无法通过赋值、递增或递减修改值的变量。在符合 ANSI 标准的编译器上，代码\n\n```\nconst\
  \ int nochange;   /* 将 m 限定为常量 */\nnochange = 12;   /* 不允许 */\n```\n\n应该产生错误消息。然而，你可以初始化\
  \ `const` 变量。因此，以下代码是安全的：\n\n点击此处查看代码图片\n\n```\nconst int nochange = 12;   /* 允许\
  \ */\n```\n\n之前的声明使 `nochange` 成为只读变量。在初始化之后，它无法被更改。\n\n\n\n你可以使用 `const` 关键字，例如，创建一个程序无法修改的数据数组：\n\
  \n点击此处查看代码图像\n\n```c\nconst int days1[12] = {31,28,31,30,31,30,31,31,30,31,30,31};\n\
  ```\n\n### 在指针和参数声明中使用 const\n\n在声明简单变量和数组时使用 `const` 关键字非常简单。指针的情况用起来要复杂得多，因为你必须区分是让指针本身变为\
  \ `const`，还是让它指向的值变为 `const`。以下声明：\n\n点击此处查看代码图像\n\n```c\nconst float * pf;  /*\
  \ pf 指向一个常量浮点值 */\n```\n\n确立了 `pf` 指向一个必须保持不变的值。`pf` 本身的值可以改变。例如，它可以被设置为指向另一个 `const`\
  \ 值。相比之下，下面的声明\n\n点击此处查看代码图像\n\n```c\nfloat * const pt;     /* pt 是一个常量指针 */\n```\n\
  \n表示指针 `pt` 本身的值不能改变。它必须始终指向同一个地址，但被指向的值可以改变。最后，下面的声明\n\n```c\nconst float * const\
  \ ptr;\n```\n\n意味着 `ptr` 必须始终指向同一个位置，并且该位置上存储的值不能改变。\n\n这里还有第三个可以放置 `const` 的位置：\n\
  \n点击此处查看代码图像\n\n```c\nfloat const * pfc;  // 等同于 const float * pfc;\n```\n\n如注释所示，在类型名之后、`*`\
  \ 之前放置 `const` 意味着指针不能用于修改所指向的值。简而言之，`*` 左侧的任何位置 `const` 都会让数据成为常量；而 `*` 右侧的 `const`\
  \ 则让指针本身成为常量。\n\n这个新关键字的一个常见用途是声明作为形式形式参数的指针。例如，假设你有一个名为 `display()` 的函数，用于显示数组的内容。要使用它，你需要将数组名作为实际参数传递，但数组名是一个地址。这将允许函数能够修改调用函数中的数据。但下面的原型防止了这种情况的发生：\n\
  \n点击此处查看代码图像\n\n```c\nvoid display(const int array[], int limit);\n```\n\n在原型和函数头中，参数声明\
  \ `const int array[]` 与 `const int * array` 相同，因此该声明表示 `array` 所指向的数据不能被修改。\n\n\
  ANSI C 库遵循这一做法。如果指针仅用于让函数访问值，则该指针被声明为指向带有 `const` 修符类型的指针。如果指针用于修改调用函数中的数据，则不使用\
  \ `const` 关键字。例如，ANSI 对 `strcat()` 的声明如下：\n\n点击此处查看代码图像\n\n```c\nchar *strcat(char\
  \ * restrict s1, const char * restrict s2);\n```\n\n回想一下 `strcat()` 将第二个字符串的拷贝添加到第一个字符串的末尾。这修改了第一个字符串，但保持第二个字符串不变。该声明反映了这一点。我们稍后会回到\
  \ `restrict` 的作用上。\n\n### 在全局数据中使用 const\n\n回想，使用全局变量被认为是一种风险方法，因为它会让数据暴露给程序的任何部分并导致误改。如果数据是常量，这种风险就消失了，因此使用带有\
  \ `const` 修符的全局变量是完全合理的。你可以拥有 `const` 变量、`const` 数组和 `const` 结构（结构是在章讨论的复合数据类型）。\n\
  \n然而，一个需要这些领域是跨文件共享 `const` 数据。你可以使用两种策略。第一种是遵循外部变量的通常规则——在一个文件中使用定义声明，在其他文件中引用声明（使用\
  \ `extern` 关键字）：\n\n点击此处查看代码图像\n\n```c\n/* file1.c -- 定义一些全局常量 */\nconst double\
  \ PI = 3.14159;\nconst char * MONTHS[12] =\n    {\"January\", \"February\", \"March\"\
  , \"April\", \"May\", \"June\", \"July\",\n      \"August\", \"September\", \"October\"\
  , \"November\", \"December\"};\n\n/* file2.c -- 使用其他处定义的全局常量 */\nextern const double\
  \ PI;\nextern const * MONTHS[];\n```\n\n第二种方法是将常量放在 `include` 文件中。在这里，你必须额外采取一步使用\
  \ `static` 外部存储类：\n\n点击此处查看代码图像\n\n```c\n/* constant.h -- 定义一些全局常量 */\nstatic const\
  \ double PI = 3.14159;\nstatic const char * MONTHS[12] =\n    {\"January\", \"February\"\
  , \"March\", \"April\", \"May\", \"June\", \"July\",\n      \"August\", \"September\"\
  , \"October\", \"November\", \"December\"};\n```\n（注：此处原文示例代码块中存在内容错乱，翻译时已按逻辑对应齐）\n\
  \n*纠正对应逻辑的代码块：*\n```c\n/* constant.h -- 定义一些全局常量 */\nstatic const double PI = 3.14159;\n\
  static const char * MONTHS[12] =\n    {\"January\", \"February\", \"March\", \"\
  April\", \"May\", \"June\", \"July\",\n      \"August\", \"September\", \"October\"\
  , \"November\", \"December\"};\n\n/* file1.c -- 使用其他处定义的全局常量 */\n#include \"constant.h\"\
  \n\n/* file2.c -- 使用其他处定义的全局常量 */\n#include \"constant.h\"\n```\n\n如果你不使用 `static`\
  \ 关键字，在 `file1.c` 和 `file2.c` 中包含头文件会导致每个文件都有该标识符的定义，这是不被支持的（尽管某些编译器允许）。通过让每个标识变为\
  \ `static`，你实际上是为每个文件提供了一个副本。如果文件应该相互通信，这种做法行不通，因为每个文件看到的都是自己的副本。\n\n头文件的方法的优点是不需要在一个文件中定义并在其他文件中引用；所有文件只需包含同一个头文件即可。缺点是数据被重复了。对于前面的例子，这不是真正的问题，但如果你的常量数据包含巨大的数组，可能是问题。\n\
  \n#### volatile 类型修符\n\n`volatile` 修符告诉编译器变量可能会被程序以外的机构修改。它通常用于硬件地址以及与其他同时运行的程序或线程共享的数据。例如，一个地址可能存储当前时间。无论你的程序在做什么，该地址的值都会随时间而改变。或者一个地址可能用于接收来自另一台计算机的信息。\n\
  \n语法与 `const` 相同：\n\n点击此处查看代码图像\n\n```c\nvolatile int loc1;  /* loc1 是一个 volatile\
  \ 位置 */\nvolatile int * ploc; /* ploc 指向一个 volatile 位置 */\n```\n\n这些语句声明 `loc1`\
  \ 为 `volatile` 值，`ploc` 指向一个 `volatile` 值。\n\n你可能认为 `volatile` 是有趣的概念，但你可能好奇 ANSI\
  \ 委员会为什么认为有将 `volatile` 设为关键字。由于它可以有助于编译器优化。例如，假设你有如下代码：\n\n```c\nval1 = x;\n\n\
  /* 不使用 x 的某些代码 */\n\nval2 = x;\n```\n\n\n\n\n一个智能（优化型）编译器可能会注意到你两次使用了 `x` 且没有改变它的值。它会临时地将\
  \ `x` 的值存储在寄存器中。然后，当为 `val2` 需要使用 `x` 时，它可以通过从寄存器中读取值而不是从原始内存位置读取来节省时间。这个过程被称为 `caching`（缓存）。通常情况下，缓存是一种很好的优化，但如果\
  \ `x` 在两个语句之间被其他机构更改了，则不如此。如果没有 `volatile` 关键字，编译器将无法得知是否会发生这种情况。因此，为了安全起见，编译器无法缓存。这就是非\
  \ ANSI 时代的情况。现在，如果在声明中未使用 `volatile` 关键字，编译器就可以假设值在两次使用之间没有发生变化，然后就可以尝试优化代码。\n\n\
  一个值既可以是 `const` 的也是 `volatile` 的。例如，硬件时钟设置通常不应该由程序更改，因此它是 `const` 的；但它又会被程序以外的机构更改，因此它是\
  \ `volatile` 的。只需在声明中使用这两个限定符即可，如下所示；顺序并不重要：\n\n```\nvolatile const int loc;\nconst\
  \ volatile int * ploc;\n```\n\n### restrict 类型限定符\n\n`restrict` 关键字通过赋予编译器优化某些类型代码的权限来增强计算支持。它只能应用于指针，并指示该指针是访问数据对象的唯一初始手段。为了理解为什么这很有用，我们需要看几个示例。考虑以下：\n\
  \n点击此处查看代码图像\n\n```c\nint ar[10];\nint * restrict restar = (int *) malloc(10 * sizeof(int));\n\
  int * par = ar;\n```\n\n在这里，指针 `restar` 是访问由 `malloc()` 分配的内存的唯一初始手段。因此，可以使用 `restrict`\
  \ 关键字对其进行限定。然而，指针 `par` 既不是访问 `ar` 数组中数据的初始手段，也不是唯一手段，因此它不能被限定为 `restrict`。\n\n\
  现在考虑下面这个相当人为的例子，其中 `n` 是一个 `int`：\n\n```c\nfor (n = 0; n < 10; n++)\n{\n    par[n]\
  \ += 5;\n    restar[n] += 5;\n    ar[n] *= 2;\n    par[n] += 3;\n    restar[n] +=\
  \ 3;\n}\n```\n\n由于 `restar` 是访问其所指向的数据块的唯一初始手段，编译器可以将涉及 `restar` 的两个语句替换为具有相同效果的单一语句：\n\
  \n点击此处查看代码图像\n\n```c\nrestar[n] += 8;   /* 合法替换 */\n```\n\n然而，如果将涉及 `par` 的两个语句合并为一个，将是一个计算错误：\n\
  \n点击此处查看代码图像\n\n```c\npar[n] += 8;     /* 给出错误答案 */\n```\n\n它给出错误答案的原因是，循环使用 `ar`\
  \ 在 `par` 两次访问相同数据之间更改了数据的值。\n\n如果没有 `restrict` 关键字，编译器必须假设最坏的情况；即在指针的两次使用之间，其他标识符可能更改了数据。使用了\
  \ `restrict` 关键字后，编译器就可以自由地寻找计算捷径。\n\n你可以将 `restrict` 关键字用作指针函数参数的限定符。这意味着编译器可以假设在函数体内部没有其他标识符修改所指向的数据，并且编译器可以尝试它在其他情况下可能使用的优化。例如，C\
  \ 库有两个从一个位置拷贝字节到另一个位置的函数。在 C99 下，它们有这些原型：\n\n点击此处查看代码图像\n\n```c\nvoid * memcpy(void\
  \ * restrict s1, const void * restrict s2, size_t n);\nvoid * memmove(void * s1,\
  \ void * s2, size_t n);\n```\n\n每个函数都从位置 `s2` 拷贝 `n` 个字节到位置 `s1`。`memcpy()` 要求这两个位置之间没有重叠，但\
  \ `memmove()` 没有要求。将 `s1` 和 `s2` 声明为 `restrict` 意味着每个指针都是唯一的访问手段，因此它们不能访问同一数据块。这符合没有重叠的要求。允许重叠的\
  \ `memmove()` 函数在复制数据时必须更加小心，以免在数据被使用之前就覆盖它。\n\n`restrict` 关键字有两个受众。一个是编译器，它告诉编译器它可以自由地对优化做出某些假设。另一个受众是用户，它告诉用户只使用满足\
  \ `restrict` 要求的参数。通常，编译器无法检查你是否遵守了这一限制，但如果你违反了，风险需自负。\n\n### _Atomic 类型限定符 (C11)\n\
  \n并发编程将程序执行划分为可能并行执行的线程。这引发了若干编程挑战，包括如何管理访问相同数据的不同线程。C11 通过可选头文件 `stdatomic.h` 和\
  \ `threads.h` 提供了一种可选而非强制的管理方式。其中一个方面是原子类型的概念，用于控制访问。例如，类似：\n\n点击此处查看代码图像\n\n```c\n\
  _Atomic int hogs;\n```\n\n在这里，将 `12` 存储到 `hogs` 是一个原子过程，可以用以下内容替换：\n\n点击此处查看代码图像\n\
  \n```c\natomic_store(&hogs, 12);\n```\n\n这种 `_Atomic` 的用法指示其他线程不会访问它。在本文编写时，预计会有该功能的支持。\n\
  \n### 关键字的新位置\n\nC99 允许你在函数原型和头文件的形式参数括号内放置类型限定符和存储类限定符 `static`。对于类型限定符，这为现有功能提供了一种替代语法。例如，这里有一个使用旧语法的声明：\n\
  \n点击此处查看代码图像\n\n```c\nvoid ofmouth(int * const a1, int * restrict a2, int n);\n\
  ```\n\n它表示 `a1` 是指向 `int` 的 `const` 指针，正如你记得的，这意味着指针本身是常量，而不是它指向的数据。它还指示 `a2` 是受限制的指针，如前所述。新的等效语法是：\n\
  \n点击此处查看代码图像\n\n```c\nvoid ofmouth(int a1[const], int a2[restrict], int n);\n```\n\
  \n基本上，新规则允许你在声明函数参数时，对指针或数组表示均使用这些限定符。\n\n`static` 的情况有所不同，因为它引入了该关键字的一个全新且无关的用途。它不再指示静态存储变量的作用域或链接，新用法是告诉编译器形式参数将如何被使用。例如，考虑此原型：\n\
  \n点击此处查看代码图像\n\n```c\ndouble stick(double ar[static 20]);\n```\n\n这种 `static` 的用法指示函数调用中的实际参数将是一个指向至少包含\
  \ 20 个元素的数组的指针。这样做的目的是让编译器能够利用这一信息来优化对函数的编码。\n\n\n\n\n\n与 `restrict` 类似，关键字 `static`\
  \ 有两个受众。一个是编译器，它告诉编译器可以自由对优化做出某些假设。另一个受众是用户，它告诉用户仅提供满足 `static`要求的参数。\n\n### 核心概念\n\
  \nC 语言提供了多种管理内存的模型。你应该熟悉这些选择。你还需要培养一种判断何时选择各种类型的直觉。在大多数情况下，自动变量是最佳选择。如果你决定使用其他类型，你应该有一个充分的理由。对于函数之间的通信，通常使用自动变量、函数参数和返回值比使用全局变量更好。另一方面，全局变量对于常量数据特别有用。\n\
  \n你应该尝试理解静态内存、自动内存和分配内存的属性。特别要意识到，静态内存量是在编译时确定的，并且静态数据在程序加载到内存时加载到内存中。自动变量在程序运行时进行分配和释放，因此自动变量占用的内存会在程序执行期间发生变化。你可以将自动内存看作一个可写的工作空间。分配内存也会增长和收缩，但在这种情况下，该过程是由函数调用控制的，而不是自动发生。\n\
  \n### 总结\n\n程序中存储数据使用的内存可以根据存储持续时间、作用域和链接来描述。存储持续时间可以是静态的、自动的或分配的。如果是静态的，内会在程序执行开始时分配并在程序运行期间一直存在。如果是自动的，变量的内会在程序执行进入定义变量的块时分配，并在退出块时释放。如果是分配的，内存通过调用\
  \ `malloc()`（或相关函数）进行分配，并通过调用 `free()` 函数进行释放。\n\n作用域决定了程序的哪些部分可以访问数据。定义在任何函数之外的变量具有文件作用域，对在该变量声明之后定义的任何函数都可见。定义在块内部或作为函数参数的变量具有块作用域，仅对该块以及嵌套在其中的任何块可见。\n\
  \n链接描述了在程序一个单元中定义的变量在多大程度上可以链接到其他地方。具有块作用域的变量由于是局部的，没有链接。具有文件作用域的变量可以有内部链接或外部链接。内部链接意味着该变量只能在包含定义的文件中使用。外部链接意味着该变量也可以其他文件中使用。\n\
  \n以下是 C 语言的五种存储类（不包括线程概念）：\n\n![Image](img/squf.jpg) **自动（Automatic）—** 在块中声明（或作为函数头中的参数）没有存储类修饰符或带有\
  \ `auto` 存储类修饰符的属于自动存储类。它具有自动存储持续时间、块作用域且没有链接。它的值如果未初始化，则不是未定的。\n\n![Image](img/squf.jpg)\
  \ **寄存器（Register）—** 在块中声明（或作为函数头中的参数）带有 `register` 存储类修饰符的属于寄存器存储类。它具有自动存储持续时间、块作用域且没有链接，并且无法获取地址。将变量声明为寄存器变量是对编译器提供尽可能快速访问的提示。它的值如果未初始化，则不是未定的。\n\
  \n![Image](img/squf.jpg) **静态无链接（Static, no linkage）—** 在块中声明带有 `static` 存储类修饰符的属于“静态无链接”存储类。它具有静态存储持续时间、块作用域且没有链接。它在编译时初始化一次。如果没有显式初始化，其字节将设置为\
  \ 0。\n\n![Image](img/squf.jpg) **静态外部链接（Static, external linkage）—** 定义在任何函数外部且未使用\
  \ `static` 存储类修饰符的变量属于“静态外部链接”存储类。它具有静态存储持续时间、文件作用域和外部链接。它在编译时初始化一次。如果没有显式初始化，其字节将设置为\
  \ 0。\n\n![Image](img/squf.jpg) **静态内部链接（Static, internal linkage）—** 定义在任何函数外部并使用\
  \ `static` 存储类修饰符的属于“静态内部链接”存储类。它具有静态存储持续时间、文件作用域和内部链接。它在编译时初始化一次。如果没有显式初始化，其字节将设置为\
  \ 0。\n\n分配内存是通过使用 `malloc()`（或相关）函数提供的，该函数返回指向具有请求字节数的内存块的指针。可以通过调用 `free()` 函数并将地址作为参数，使该内存变得可重用。\n\
  \n类型限定符有 `const`、`volatile` 和 `restrict`。`const` 限定符将数据限定为常量。当与指针配合使用时，`const` 可以指示指针本身是常量，或者它所指向的数据是常量，取决于\
  \ `const` 在声明中的位置。`volatile` 限定符指示数据可能被程序以外的进程修改。其目的是警告编译器避免做出非此类假设的优化。`restrict`\
  \ 限定符也是为了优化的原因提供的。被 `restrict` 限定的指针被识别为提供了对某块数据块的唯一访问。\n\n### 复习题\n\n你可以在附录 A 中的“复习题答案”中找到答案。\n\
