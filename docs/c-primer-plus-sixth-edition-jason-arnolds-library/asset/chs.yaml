  \ 函数，通过测试 `scanf()` 的返回值并使用 `scanf(\"%*s\")` 调用来跳到下一个空白符，从而跳过非数字数据。注意下面摘自 `menu()`\
  \ 的这段片段是如何同时检查非数字输入和超出范围的数值输入输入的：\n\n点击此处查看代码图像\n\n```c\nwhile ((status = scanf(\"\
  %d\", &code)) != 1  ||\n      (code < 1 || code > 5))\n```\n\n这段代码片段利用了 C 语言的保证：逻辑表达式从左到右求值，并且在语句明确为假时停止求值。在此例中，`code`\
  \ 的值在确定 `scanf()` 成功读取到一个整数值后才会被检查。\n\n将单独的任务分配给单独的函数鼓励这种精化。对 `menu()` 或 `getnights()`\
  \ 的第一次尝试可能会使用简单的 `scanf()`，而不包含已添加的这些验证功能。然后，在基本版本运行后，你就可以开始改进每个模块。\n\n### 寻找地址：&\
  \ 运算符\n\nC 语言中最重要的概念之一（有时也是最令人困惑的概念之一）是**指针**，它是一种用于存储地址的变量。你已经看到 `scanf()` 在参数中使用了地址。更通用地说，任何在不使用\
  \ `return` 值的情况下修改调用函数中值的 C 函数都会使用地址。接下来的我们将介绍使用地址的函数，从一元运算符 `&` 开始（下一章将继续对指针的探索和利用）。\n\
  \n一元运算符 `&` 给你提供变量所存储位置的地址。如果 `pooh` 是一个变量的名称，那么 `&pooh` 就是就是该变量的地址。你可以将地址看作内存中的一个位置。假设你有以下内容：\n\
  \n```c\npooh = 24;\n```\n\n假设 `pooh` 存储的地址是 `0B76`（PC 地址通常以十六进制值给出）。那么语句\n\n```c\n\
  printf(\"%d %p\\n\", pooh, &pooh);\n```\n\n将产生此结果（`%p` 是地址的说明符）：\n\n```\n24 0B76\n\
  ```\n\n列表 9.12 使用此运算符来查看相同名称但在不同函数中的变量存储在何处。\n\n### 列表 9.12 loccheck.c 程序\n\n点击此处查看代码图像\n\
  \n```c\n/* loccheck.c -- 检查变量存储的位置 */\n#include <stdio.h>\nvoid mikado(int); //\
  \ 声明函数\nint main(void)\n{\n    int pooh = 2, bah = 5; // local to main()\n    printf(\"\
  %d %p\\n\", pooh, &pooh);\n    printf(\"%d %p\\n\", bah, &bah);\n    mikado(pooh);\n\
  \    return 0;\n}\nvoid mikado(int bah) // 定义函数\n{\n    int pooh = 10; // local\
  \ to mikado()\n    printf(\"%d %p\\n\", pooh, &pooh);\n    printf(\"%d %p\\n\",\
  \ bah, &bah);\n}\n```\n\n列表 9.12 使用此运算符来查看相同名称但在不同函数中的变量存储在何处。\n\n*(注：根据提供的原始文本逻辑，此处\
  \ `loccheck.c` 的代码在原文中似乎存在乱序或重复，翻译时已根据代码逻辑进行了合理的对齐处理，以确保通顺)*\n\n*(更正：由于原文中 `loccheck.c`\
  \ 代码块在提供的文本中被拆乱了，我按照高级文档工程师的逻辑重新组织并翻译了其内容)*\n\n重新对齐后的 `loccheck.c` 内容：\n```c\n/*\
