  另一种使用程序的方法是保持小时数不变，但尝试不同的每小时平均客户数。这里是探索这种变化的两个示例运行：\n\n点击此处查看代码图像\n\n```\n输入模拟小时数：\n\
  80\n输入每小时平均客户数：\n25\n接受的客户: 1960\n  服务的客户: 1959\n      拒绝人数: 3\n平均队列长度: 1.43\n平均等待时间:\
  \ 3.50 分钟\n```\n\n```\n输入模拟小时数：\n80\n输入每小时平均客户数：\n30\n接受的客户: 2376\n  服务的客户: 2373\n\
  \      拒绝人数: 94\n平均队列长度: 5.85\n平均等待时间: 11.83 分钟\n```\n\n注意平均等待时间随着客户频率的增加而急剧上升。每小时\
  \ 20 名客户（80 小时模拟）的平均等待时间为 1.35 分钟。当每小时增加到 25 名客户时，它上升到 3.50 分钟，并且在每小时 30 名客户时飙升至\
  \ 11.83 分钟。此外，拒绝人数也从 0 增加到 3，再增加到 94。西格德可以使用这种分析来决定是否需要第二个咨询台。\n\n## 链表与数组\n\n许多编程问题（例如创建列表或队列）都可以用链表——我们指的是动态分配结构的链式序列——或用数组来处理。每种形式都有其优缺点，因此选择使用哪种取决于问题的具体要求。表\
  \ 17.1 总结了链表和数组的特性。\n\n![图像](img/17tab01.jpg)\n\n表 17.1 数组与链表的比较\n\n仔细观察插入和删除元素的过程。要在数组中插入一个元素，你必须移动元素为新元素腾出空间，如图图\
  \ 17.9 所示。新元素越靠前，需要移动的元素就越多。然而，要在链表中插入一个节点，只需要给两个指针赋值即可，如图 17.10 所示。\n\n![图像](img/17fig09.jpg)\n\
  \n图 17.9 在数组中插入元素。\n\n![图像](img/17fig10.jpg)\n\n图 17.10 在链表中插入节点。\n\n接下来考虑访问元素的方法。在数组中访问元素可以通过索引直接访问，这被称为随机访问。在链表中访问元素，你必须从开始遍历，这被称为顺序访问。在数组中，你可以通过索引访问任何元素，这也是顺序访问。在链表中，你必须从头开始移动，这仍然是顺序访问。在某些情况下，顺序访问是足够的。例如，如果你想在列表中显示项目，顺序访问即可。在链表中，你必须从头开始移动节点，这被称为顺序访问。假设你想在列表中搜索特定项目。如果项目没有按顺序排列，你必须查看每个项目才能确定是否存在，这被称为顺序搜索。（在这里，并发编程可以帮助，因为不同的\
  \ CPU 可以搜索列表的不同部分。）你可以通过排序列表来改进顺序搜索。这样，如果你没有找到项目就可以终止搜索。例如，假设你在字母列表中查找西格德。从列表顶部开始，你查看每个项目，最终没有发现西格德。\n\
  \n对于有序列表，你可以通过二分查找方法获得远好于顺序搜索的结果。其工作原理如下：首先，确定你想要查找的列表项目，并假设列表是有序的。接下来，选择列表中间的元素与目标进行比较。如果两者相同，搜索结束。如果列表项目在字母顺序上于目标之前，则目标在后半部分。如果列表项目在字母顺序上于目标之后，则目标在前部分。无论何种情况，比较都排除了一部分的搜索区域。接下来，再次应用该方法，即选择剩余列表部分的中间元素。按照这种方式进行，直到找到项目或消除了整个列表（参见图\
  \ 17.11）。\n\n这种方法非常高效。例如，假设列表有 127 个项目。平均而言，顺序搜索在找到项目或排除其存在之前需要 64 次比较。另一方面，二分查找法最多只需要\
  \ 7 次比较。第一次比较将可能的匹配减少到 63 个，第二次比较将可能的匹配减少到 31 个，以此此类推，直到第六次比较将可能性减少到 1 个。第七次比较决定剩下的最后一个选择是否为目标。通常，`n`\
  \ 次比较可以让你处理具有 `2^n−1` 个成员的数组，因此二分查找相对于顺序搜索的优势随着列表越长而变得越大。\n\n![图像](img/17fig11.jpg)\n\
  \n图 17.11 对西格德的二分查找。\n\n\n\n\n使用数组实现二分查找非常简单，因为可以使用数组索引来确定任何列表或列表子部分的中间位置。将该子部分起始和结束元素的下标相加并除以\
  \ 2 即可。例如，在一个包含 100 个元素的列表中，第一个索引为 0，最后一个索引为 99，初始猜测值为 `(0 + 99) / 2`，即 49（整数除法）。如果索引为\
  \ 49 的元素在字母表中太靠后，那么正确的选择必然在 0–48 范围内，因此下一次猜测将为 `(0 + 48) / 2`，即 24。如果元素 24 在字母表中太靠前，那么下一次猜测值将为\
  \ `(25 + 48) / 2`，即 36。\n\n这就是数组的随机访问特征发挥用场的地方。它让你能够从一个位置跳转到另一个位置，而无需访问之间的每一个位置。链表仅支持顺序访问，无法提供跳转到列表中间的方法，因此你不能在链表上使用二分查找技术。\n\
  \n可见，数据类型的选择取决于问题。如果情况需要一个频繁插入和删除以不断调整大小、但并不经常查找的列表，那么链表是更好的选择。如果情况需要一个仅偶尔插入删除、但必须频繁查找的稳定列表，那么数组是更好的选择。\n\
  \n如果你需要一种既支持频繁插入删除又支持频繁查找的数据结构呢？链表和数组都无法满足这些需求。另一种形式——二分查找树——可能正是你需要的。\n\n## 二分查找树\n\
  \n二分查找树是一种结合了二分查找策略的链接结构。树中的每个节点都包含一个项目和指向其他节点的两个指针，称为子节点。图 17.12 显示了二分查找树中的节点是如何链接的。其核心思想是每个节点有两个子节点——一个左节点和一个右节点。顺序性源于：左节点中的项目排在父节点项目之前，而右节点中的项目排在父节点项目之后。这种关系适用于每一个拥有子节点的节点。此外，所有可以追溯到父节点左节点的项目，其顺序上都早于父节点项目；而每个源自右节点的项目，其顺序上都晚于父节点项目。\n\
  \n图 17.12 中的树以这种方式存储单词。树的顶部（在植物学中这是一个有趣的反转）被称为“根”。树是一种层次结构，意味着数据是按层级（或秩次）组织的，每一级通常上方和下方都有层级。如果一棵二分查找树是满的，则每一层的节点数都是其上方层的两倍。\n\
  \n![Image](img/17fig12.jpg)\n\n图 17.12 存储单词的二分查找树。\n\n二分查找树中的每个节点本身都是其下方所有节点的根，使得该节点及其后代构成一个子树。在图\
  \ 17.12 中，包含单词 *fate*、*carpet* 和 *llama* 的节点构成了整棵树的左子树，而单词 *voyage* 是 *style*-**plenum*-**voyage*\
  \ 子树的右子树。\n\n假设你想在这样的树中找到一个项目——称之为 *target*（目标）。如果该项目在根节点项目之前，你只需要搜索树的左半部分；如果目标在根节点项目之后，你只需要搜索根节点的右子树。因此，一次比较就能排除掉一半的树。假设你搜索左半部分，这意味着将目标与左子节点中的项目进行比较。如果目标在左节点项目之前，你只需要搜索其后代中的左半部分，依此类推。与二分查找一样，每次比较都会让潜在匹配项的数量减半。\n\
  \n让我们应用这种方法来查看图 17.12 所示的树中是否存在单词 *puppy*。通过将 *puppy* 与 *melon*（根节点项目）进行比较，你发现如果\
  \ *puppy* 存在，它一定在树的右半部分。因此，你走向右节点，并将 *puppy* 与 *style* 进行比较。在这种情况下，*puppy* 在节点项目之前，所以你必须沿着链接找到左节点。在你在那里找到了\
  \ *plenum*，它在 *puppy* 之前。你现在必须遵循该节点的右分支，但它是空的，因此三次比较就让你发现 *puppy* 不在树中。\n\n因此，二分查找树结合了链接结构与二分查找的效率。编程上的代价是构建一棵树比创建一个链表要复杂。让我们为下一个也是最后一个\
  \ ADT 项目创建一个二叉树。\n\n### 二叉树 ADT\n\n一如既往，我们首先从通用的术语上定义二叉树。这个特定的定义假设树不包含重复项目。许多操作与列表操作相同。区别在于数据的层次结构安排。以下是该\
  \ ADT 的非正式总结：\n\n![Image](img/829tab01.jpg)\n\n### 二叉树接口\n\n在原则上，你可以通过多种方式实现二分查找树。你甚至可以用数组来实现一个。但实现二分查找树最直接的方法是通过指针将动态分配的连接在一起，因此我们将从这些开始：\n\
  \n```c\ntypedef Item;\ntypedef struct node {\n    Item item;\n    struct node *left;\n\
  \    struct node *right;\n} node;\ntypedef struct tree {\n    structnode *root;\n\
  \    int size;\n} Tree;\n```\n\n每个节点包含一个项目、一个指向左子节点的指针和一个指向右子节点的指针。你可以将 `Tree` 定义为指向\
  \ `node` 的指针，因为你只需要知道根即可访问整棵树。然而，使用带有 `size` 的结构体更易于跟踪大小。我们将开发的示例是 Nerville 俱乐部的成员名单，每个项目由一个名称和一种种类组成。考虑到这一点，我们可以设置如列表\
  \ 17.10 所示的接口。我们将树的大小限制为 10。较小的尺寸更容易测试树是否被填满。你可以随时将 `MAXITEMS` 设置为更大的值。\n\n```c\n\
  /* tree.h -- 二叉树 */\n#ifndef TREE_H\n#define TREE_H\n\n#include <stdbool.h>\n\n\
  /* 根据需要重定义 Item */\ntypedef struct {\n    char name[20];\n    char kind[20];\n}\
  \ Item;\n\n#define MAXITEMS 10\n\ntypedef struct node {\n    Item item;\n    struct\
  \ node *left; /* 指向右分支 */\n    struct node *right; /* 指向左分支 */\n} node;\n\ntypedef\
  \ struct tree {\n    struct node *root; /* 指向树 */\n    int size; /* 树中的项目数量 */\n\
  } Tree;\n\n/* 函数原型 */\n/* 操作：初始化树 */\n/* 前提：ptree 指向一个树 */\n/* 后置条件：树已初始化 */\nvoid\
  \ InitializeTree(Tree * ptree);\n\n/* 操作：判断树是否为空 */\n/* 前提：ptree 指向一个树 */\n/* 后置条件：如果树为空返回真，否则返回假\
  \ */\nbool TreeIsEmpty(const Tree * ptree);\n\n/* 操作：判断树是否为满 */\n/* 前提：ptree 指向一个树\
  \ */\n/* 后置条件：如果树为满返回真，否则返回假 */\nbool TreeIsFull(const Tree * ptree);\n\n#endif\
  \ /* TREE_H */\n```\n\n\n\n\n```c\nbool TreeIsFull(const Tree * ptree);\n\n/* 操作：确定树中元素的数量\
  \ */\n/* 前提：ptree 指向一棵树 */\n/* 后置条件：函数返回树中元素的数量 */\n\nint TreeItemCount(const Tree\
  \ * ptree);\n\n/* 操作：向树添加一个元素 */\n/* 前提：pi 是要添加元素的地址 */\n/* ptree 指向一个已初始树 */\n\
  /* 后置条件：如果可能，函数将元素添加到树中并返回 true；否则，函数返回 false */\n\nbool AddItem(const Item * pi,\
  \ Tree * ptree);\n\n/* 操作：在树中查找元素 */\n/* 前提：pi 指向一个元素 */\n/* ptree 指向一个已初始树 */\n\
  /* 后置条件：如果元素在树中则返回 true，否则返回 false */\n\nbool InTree(const Item * pi, const Tree\
  \ * ptree);\n\n/* 操作：从树中删除元素 */\n/* 前提：pi 是要删除元素的地址 */\n/* ptree 指向一个已初始树 */\n/*\
  \ 后置条件：如果可能，函数从树中删除元素并返回 true；否则，函数返回 false */\n\nbool DeleteItem(const Item * pi,\
  \ Tree * ptree);\n\n/* 操作：对树中的每个元素应用函数 */\n/* 前提：ptree 指向一棵树 */\n/* pfun 指向一个接受\
  \ Item 参数且没有返回值的函数 */\n/* 后置条件：pfun 指向的函数会为树中的每个元素执行一次 */\n\nvoid Traverse (const\
  \ Tree * ptree, void (* pfun)(Item));\n\n/* 操作：删除树中的所有内容 */\n/* 前提：ptree 指向已初始树\
  \ */\n/* 后置条件：树为空 */\n\nvoid DeleteAll(Tree * ptree);\n```\n\n# 二叉树的实现\n\n接下来，开始实现\
  \ `tree.h` 中列出的函数。`InitializeTree()`、`EmptyTree()` 和 `TreeItems()` 函数非常简单，其工作方式与列表和队列抽象数据类型（ADT）的对应函数类似，因此我们将集中在剩余函数上。\n\
  \n## 添加元素\n\n在向树中添加元素时，你应该首先检查树是否有空间容纳新节点。由于，由于二叉搜索树的定义为没有重复元素，你应该检查该元素是否已在树中。如果新元素通过了这两个障碍，你就可以创建一个新节点，将元素复制到节点中，并将节点的左、右指针设置为\
  \ `NULL`。这表示该节点没有子节点。然后，你应该更新 `Tree` 结构体的 `size` 成员，以标记新元素的添加。接下来，你必须找到节点在树中应该所在的位置。如果树是空的，你应该将根指针指向新节点。否则，遍历树以找到可以添加节点的地方。`AddItem()`\
  \ 函数遵循这一配方，将部分工作交给了尚待定义的函数：`SeekItem()`、`MakeNode()` 和 `AddNode()`。\n\n点击此处查看图像\n\
  \n```c\nbool AddItem(const Item * pi, Tree * ptree)\n{\n  Trnode * new_node;\n \
  \ if (TreeIsFull(ptree))\n  {\n    fprintf(stderr,\"Tree is full\\n\");\n    return\
  \ false; /* 提前返回 */\n  }\n  if (SeekItem(pi, ptree).child != NULL)\n  {\n    fprintf(stderr,\
  \ \"Attempted to duplicate item\\n\");\n    return false; /* 提前返回 */\n  }\n  new_node\
  \ = MakeNode(pi); /* 指向新节点 */\n  if (new_node == NULL)\n  {\n    fprintf(stderr,\
  \ \"Couldn't create node\\n\");\n    return false; /* 提前返回 */\n  }\n  /* 成功创建新节点\
  \ */\n  ptree->size++;\n  if (ptree->root == NULL) /* 情况 1：树为空 */\n    ptree->root\
  \ = new_node; /* 新节点成为树根 */\n  else /* 情况 2：不空 */\n    AddNode(new_node, ptree->root);\
  \ /* 添加节点 */\n  return true; /* 成功返回 */\n}\n```\n\n`AddNode()` 函数是二叉树中最困难的。它必须确定新节点所在的位置，然后将其添加。特别是，它需要将新元素与根节点进行比较，以确定它是进入左子树还是右子树。如果元素是数字，你可以使用\
  \ `<` 和 `>`。如果元素是字符串，你可以使用 `strcmp()`。但元素是一个结构体，因此你必须为比较定义自己的函数。稍后定义的 `ToLeft()`\
  \ 函数在新元素应该在左子树中时返回 `True`，而 `ToRight()` 函数在新元素应该在右子树中时返回 `True`。这两个函数分别类比于 `<` 和\
  \ `>`。\n\n假设新元素进入左子树。左子树可能是空的。在这种情况下，函数只需让左指针指向新节点。如果左子树不是空的呢？那么函数应该将新元素与左节点中的元素进行比较，决定新元素应该进入子节点的左子树还是右子树。这个过程应该一直持续，直到函数到达一个空子树，此时就可以添加新节点。实现这种搜索的一种方法是使用递归——即将\
  \ `AddNode()` 函数应用于子节点而不是根节点。递归系列函数调用会在左或右子树为空时结束——即当 `root->left` 或 `root->right`\
  \ 为 `NULL` 时。记住，`root` 是指向当前子树的指针，因此在每次递归调用时，它指向一个新的、更层的子树。（你可能想复习第 9 章中关于递归的讨论。）\n\
  \n`MakeNode()` 函数非常简单。它处理内存分配和新节点的初始化。\n\n```c\nstatic Trnode * MakeNode(const Item\
  \ * pi)\n{\n  Trnode * new_node;\n  new_node = (Trnode *) malloc(sizeof(Trnode));\n\
  \  if (new_node != NULL)\n  {\n    new_node->item = *pi;\n    new_node->left = NULL;\n\
  \    new_node->right = NULL;\n  }\n  return new_node;\n}\n```\n\n点击此处查看图像\n\n```c\n\
  static void AddNode(Trnode * new_node, Trnode * root)\n{\n  if (ToLeft(&new_node->item,\
  \ &root->item))\n  {\n    if (root->left == NULL) /* 空子树 */\n      root->left =\
  \ new_node; /* 所以在此添加节点 */\n    else\n      AddNode(new_node, root->left); /* 否则处理子树\
  \ */\n  }\n  else if (ToRight(&new_node->item, &root->item))\n  {\n    if (root->right\
  \ == NULL)\n```\n\n\n\n\n\n```c\nroot->right = new_node;\nelse\n    AddNode(new_node,\
  \ root->right);\n}\nelse                        /* should be no duplicates */\n\
  {\n    fprintf(stderr,\"location error in AddNode()\\n\");\n    exit(1);\n}\n```\n\
  \n`ToLeft()` 和 `ToRight()` 函数取决于 `Item` 类型的性质。Nerfville 宠物俱乐部的成员将按照名称的字母顺序进行排列。如果两只宠物有相同的名字，则按种类排序。如果它们的种类也相同，那么这两个项目就是重复的，这在基础搜索树中是不允许的。记住，标准\
  \ C 库函数 `strcmp()`：如果第一个参数表示的字符串在第二个字符串之前，它返回负数；如果两个字符串相同，它返回零；如果第一个字符串在第二个字符串之后，它返回正数。`ToRight()`\
  \ 函数具有类似的代码。使用这两个函数而不是直接在 `AddNode()` 中进行比较，可以使代码更容易适应新需求。当需要不同形式的比较时，不需要重写 `AddNode()`，只需重写\
  \ `ToLeft()` 和 `ToRight()` 即可。\n\n点击此处查看代码图片\n\n```c\nstatic bool ToLeft(const Item\
  \ * i1, const Item * i2)\n{\n    int comp1;\n    if ((comp1 = strcmp(i1->petname,\
  \ i2->petname)) < 0)\n        return true;\n    else if (comp1 == 0 &&\n       \
  \        strcmp(i1->petkind, i2->petkind) < 0 )\n        return true;\n    else\n\
  \        return false;\n}\n```\n\n### 查找项目\n\n三个接口函数涉及在树中搜索特定项目：`AddItem()`、`InTree()`\
  \ 和 `DeleteItem()`。此实现使用一个 `SeekItem()` 函数来提供该服务。`DeleteItem()` 函数有一个额外要求：它需要知道被删除项目的父节点，以便在子节点被删除时更新父节点的子指针。因此，我们设计了\
  \ `SeekItem()` 返回一个包含两个指针的结构体：一个指向包含项目的节点（如果未找到项目则为 `NULL`），另一个指向父节点（如果该节点是根节点且没有父节点则为\
  \ `NULL`）。该结构体类型定义如下：\n\n```c\ntypedef struct pair {\n    Trnode * parent;\n   \
  \ Trnode * child;\n} Pair;\n```\n\n`SeekItem()` 函数可以通过递归实现。然而，为了让你接触到各种编程技术，我们将使用\
  \ `while` 循环来处理树的下降。与 `AddNode()` 一样，`SeekItem()` 使用 `ToLeft()` 和 `ToRight()` 来遍历树。`SeekItem()`\
  \ 最初将 `look.child` 指针指向树的根节点，然后当它追踪到应该找到项目的路径时，它将 `look.child` 重置为后续连续的子树。与此同时，`look.parent`\
  \ 被设置为指向连续的父节点。如果没有找到匹配的项目，`look.child` 将是 `NULL`。如果匹配的项目在根节点中，`look.parent` 将为\
  \ `NULL`，因为根节点没有父节点。以下是 `SeekItem()` 的代码：\n\n点击此处查看代码图片\n\n```c\nstatic Pair SeekItem(const\
  \ Item * pi, const Tree * ptree)\n{\n    Pair look;\n    look.parent = NULL;\n \
  \   look.child = ptree->root;\n    if (look.child == NULL)\n        return look;\
  \                /* early return    */\n    while (look.child != NULL)\n    {\n\
  \        if (ToLeft(pi, &(look.child->item)))\n        {\n            look.parent\
  \ = look.child;\n            look.child = look.child->left;\n        }\n       \
  \ else if (ToRight(pi, &(look.child->item)))\n        {\n            look.parent\
  \ = look.child;\n            look.child = look.child->right;\n        }\n      \
  \  else /* must be same if not left or right */\n            break; /* look.child\
  \ is address of node */\n    }\n    return look; /* successful return */\n}\n```\n\
  \n注意，由于 `SeekItem()` 函数返回一个结构体，因此可以使用结构体运算符使用它。例如，`AddItem()` 函数使用了以下代码：\n\n点击此处查看代码图片\n\
  ```c\nif (SeekItem(pi, ptree).child != NULL)\n```\n\n一旦你有了 `SeekItem()`，编写 `InTree()`\
  \ 公共接口就简单了：\n\n点击此处查看代码图片\n```c\nbool InTree(const Item * pi, const Tree * ptree)\n\
  {\n    return (SeekItem(pi, ptree).child == NULL) ? false : true;\n}\n```\n\n###\
  \ 删除项目的注意事项\n\n移除项目是这些任务中最困难的，因为你必须重新连接剩余的子树以形成一棵有效的树。在尝试此任务之前，对必须要做的工作建立一个视觉上的形象是个好主意。\n\
  \n图 17.13 展示了最简单的情况。在这里，要删除的节点没有子节点。这样的节点被称为 `leaf`（叶子节点）。你需要做的是将父节点的指针置为 `NULL`\
  \ 并释放该节点使用的内存。\n\n接下来是删除具有一个子节点的节点。删除节点后，子树与树的其余部分分离。为了修复这一点，需要将父节点的指针指向子树（参见图 17.14）。\n\
  \n最后的情况是删除具有两个子节点的节点。一个子树（例如左侧）可以连接到删除节点所在的位置。但剩余的子树应该放在哪里？记住树的设计。右侧子树的项目位于父节点之前，这意味着右侧子树的项目位于左侧子树项目之后。因此，你需要沿着左子树的右分支向下，直到找到一个空间。图\
  \ 17.15 展示了这种方法。\n\n\n\n\n\n```c\ntemp = *ptr;\n*ptr = (*ptr)->left;\nfree(temp);\n\
  }\nelse /* 删除的节点有两个孩子 */\n{\n    /* 找到重新附加右子树的位置 */\n    for (temp = (*ptr)->left;\
  \ temp->right != NULL;\n         temp = temp->right)\n        continue;\n    temp->right\
  \ = (*ptr)->right;\n    temp = *ptr;\n    *ptr =(*ptr)->left;\n    free(temp);\n\
  }\n```此函数显式地处理了三种情况：没有左子节点的节点、没有右子节点的节点以及有两个孩子的节点。没有孩子的节点可以被视为没有左子节点的特例。如果节点没有左子节点，代码会将右子节点的地址赋值给父指针。但如果该节点也没有右子节点，则该指针为\
  \ `NULL`，这正是无节点情况的正确值。\n\n注意，代码使用了一个临时指针来跟踪被删除节点的地址。在重置父指针（`*ptr`）之后，程序将丢失被删除节点的位置，但\
  \ `free()` 函数需要该信息。因此，程序将 `*ptr` 的原始值存储在 `temp` 中，然后使用 `temp` 释放被删除节点使用的内存。\n\n\
  两个孩子情况的代码首先在 `for` 循环中使用 `temp` 指针在左子树的右侧搜索空位。当找到一个空位时，将右子树附加在那里。然后，它重用 `temp` 来跟踪被删除节点的位置。接下来，它将左子树附加到父节点，然后释放\
  \ `temp` 指向的节点。\n\n注意，由于 `ptr` 的类型为 `Trnode **`，`*ptr` 的类型为 `Trnode *`，使其与 `temp`\
  \ 的类型相同。\n\n## 删除项目\n问题的剩余部分是将节点与特定项目关联。你可以使用 `SeekItem()` 函数来实现这一点。记住，它返回一个结构体，其中包含一个指向父节点的指针和一个指向包含项目的节点的指针。然后，你可以使用父节点指针来获取传递给\
  \ `DeleteNode()` 函数的正确地址。这里显示的 `DeleteItem()` 函数遵循了这一计划：\n\n```c\nbool DeleteItem(const\
  \ Item * pi, Tree * ptree)\n{\n    Pair look;\n    look = SeekItem(pi, ptree);\n\
  \    if (look.child == NULL)\n        return false;\n    if (look.parent == NULL)\
  \      /* 删除根项目 */\n        DeleteNode(&ptree->root);\n    else if (look.parent->left\
  \ == look.child)\n        DeleteNode(&look.parent->left);\n    else\n        DeleteNode(&look.parent->right);\n\
  \    ptree->size--;\n    return true;\n}\n```\n首先，将 `SeekItem()` 函数的返回值赋值给 `look`\
  \ 结构体变量。如果 `look.child` 为 `NULL`，则搜索未找到该项目，`DeleteItem()` 函数退出并返回 `false`。如果找到了\
  \ `Item`，函数将处理三种情况。首先，`look.parent` 为 `NULL` 意味着在根节点中找到了项目。在这种情况下，没有父节点需要更新。相反，程序必须更新\
  \ `Tree` 结构体中的根指针。因此，函数将该指针的地址传递给 `DeleteNode()` 函数。否则，程序确定要删除的节点是父节点的左孩子还是右孩子，然后传递相应指针的地址。\n\
  \n注意，公共接口函数（`DeleteItem()`）是以终端用户的关注点（项目和树）来描述的，而隐藏的 `DeleteNode()` 函数则处理指针移动的琐碎细节。\n\
  \n### 遍历树\n遍历树比遍历链表要复杂，因为每个节点都有两个分支需要遵循。这种分支的性质使得分治策略的递归成为处理该问题的自然选择。在每个节点处，函数都应该执行以下操作：\n\
  - 处理项目。\n- 处理左子树（递归调用）。\n- 处理右子树（递归调用）。\n\n你可以将此过程分为两个函数：`Traverse()` 和 `InOrder()`。注意，`InOrder()`\
  \ 函数先处理左子树，然后是项目，最后是右子树。这种顺序导致了按字母顺序遍历树。如果你有时间，可能想看看使用不同的顺序会发生什么，例如 `item-left-right`\
  \ 和 `left-right-item`。\n\n```c\nvoid Traverse (const Tree * ptree, void (* pfun)(Item\
  \ item))\n{\n    if (ptree != NULL)\n        InOrder(ptree->root, pfun);\n}\n\n\
  static void InOrder(const Trnode * root, void (* pfun)(Item item))\n{\n    if (root\
  \ != NULL)\n    {\n        InOrder(root->left, pfun);\n        (*pfun)(root->item);\n\
  \        InOrder(root->right, pfun);\n    }\n}\n```\n\n### 清空树\n清空树的过程与遍历基本相同。也就是说，代码需要访问每个节点并对其应用\
  \ `free()`。它还需要重置 `Tree` 结构体的成员以表示一个空的 `Tree`。`DeleteAll()` 函数处理 `Tree` 结构体，并将释放内存的任务交给\
  \ `DeleteNodes()`。后者的函数设计与 `InOrder()` 相同。它保存了指针 `root`，以便在根被释放后仍然可用。这里是这两个函数的代码：\n\
  \n```c\nvoid DeleteAll(Tree * ptree)\n{\n    if (ptree != NULL)\n        DeleteNodes(ptree->root);\n\
  \    ptree->root = NULL;\n    ptree->size = 0;\n}\n\nstatic void DeleteNodes(Trnode\
  \ * root)\n{\n    Trnode * pright;\n    if (root != NULL)\n    {\n        pright\
  \ = root->right;\n        DeleteNodes(root->left);\n        DeleteNodes(pright);\n\
  \        free(root);\n    }\n}\n```\n\n### 完整包\n列表 17.11 显示了整个 `tree.c` 代码。`tree.h`\
