  邮寄：Reader Feedback\n\n## 读者服务\n\n访问我们的网站并在 `http://developers-library.info` 注册，以便方便获取任何下载内容或错误列表。\n\
  \n## 前言\n\nC 语言是由贝尔实验室的 Dennis Ritchie 于 1972 年创建的，当时他和 Ken Thompson 正在设计 Unix 操作系统。然而，C\
  \ 并不是从 Ritchie 脑中凭空产生的。它源于 Thompson 的 B 语言，而 B 语言源于……那是另一个故事了。要点是，C 是作为程序员工作的工具而创建的，因此它的主要目标是成为一种实用的语言。\n\
  \n从那时以后，C 语言蓬勃发展，许多人通过这本书的帮助学会了 C。在所有版本中，我的目标都是创建一个具有启发性、清晰且有用的 C 语言介绍。\n\n为了获得最大的益处，你应该在学习书中的主题时尽可能的采取积极的角色。\n\
  \n学习 方法与目标\n\n我的目标是让这本书成为一个友好、易于使用的自学指南。为了实现这一点，C 语言采用了以下策略：\n\n- 编程概念一次解释一或两个，因为通过实践来学习是掌握新信息最有效的方法之一。\n\
  - 图表和插图解释了仅用文字难以理解的概念。\n- 高亮显示框总结了 C 的主要特征，方便查阅和复习。\n- 每章末的复习题和编程练习允许你测试并提高理解水平。\n\
  \n不要只读示例，要将它们输入你的系统并尝试运行。C 是一种非常可移植的语言，但你可能会发现程序在你的系统上的运行方式与在我们系统上的运行方式存在差异。尝试修改程序的一部分查看效果。修改程序以实现不同的功能。看看你是否能开发出替代方法。忽略偶尔出现的警告，看看当你做错时会发生什么。你自己做的越多，学得和记得就越越多。\n\
  \n我希望你会发现这个最新版本是 C 语言的一个愉快且有效的介绍。\n\n# 1. 准备工作\n\n欢迎 C 语言的世界——一种充满活力、专业的编程语言，深受爱好者和商业程序员的喜爱。本章将为你为学习和使用这种强大且流行的语言做好准备，并向你介绍最可能练就\
  \ C 功底的环境。\n\n你将在本章学习到以下内容：\n\n- C 的历史和特性\n- 编写程序所需的步骤\n- 关于编译器和链接器的简单介绍\n- C 标准\n\
  \n首先，我们看看 C 的起源并研究它的某些特性（包括优点和缺点）。然后，我们查看编程的起源并研究一些通用的编程原则。最后，我们讨论如何在一些常用系统中运行 C\
  \ 程序。\n\n\n\n大多数语言都旨在实现实用性，但它们往往还有其他考量。例如，`Pascal` 的主要目标是为教授良好的编程原则提供可靠的基础。相比之下，`BASIC`\
  \ 的开发是为了类似于英语，以便不熟悉计算机的学生能够轻松学习。这些都是重要的目标，但它们并不总是与务实的、日常的用途兼容。然而，`C` 作为一种专为程序员设计的语言，其发展使其成为现代首选语言之一。\n\
  \n## 为什么选择 C？\n\n在过去的四十年里，`C` 已经成为最重要、最流行的编程语言之一。它的成长是因为人们尝试过并喜欢它。在过去的十、二十年里，许多人从\
  \ `C` 转向了 `C++`、`Objective C` 和 `Java` 等语言，但 `C` 本身仍然是一门重要的语言，也是通往其他语言的迁移路径。在学习\
  \ `C` 时，你会发现它的许多优点（参见图 1.1）。让我们现在预览一下其中几个。\n\n![Image](img/01fig01.jpg)\n\n图 1.1\
  \ `C` 的优点。\n\n### 设计特性\n\n`C` 是一门现代语言，结合了计算机科学理论和实践中认为所需的控制特性。它的设计使其自然适用于自顶向下规划、结构化编程和模块设计。结果是程序更加可靠、更易于理解。\n\
  \n### 效率\n\n`C` 是一门高效的语言。它的设计利用了当前计算机的能力。`C` 程序倾向于紧凑且运行快速。事实上，`C` 展示了某些通常与汇编语言相关的精细控制。（`汇编语言`是特定中央处理器设计所使用的内部指令集的助记符表示；不同的\
  \ CPU 家族有不同的汇编语言。）如果你愿意，可以对程序进行微调以实现最大速度或最高效的内存利用。\n\n### 可移植性\n\n`C` 是一门可移植的语言，这意味着在一个系统上编写的\
  \ `C` 程序可以在很少或不经过修改的情况下在其他系统上运行。如果需要修改，通常可以通过简单更改随主程序的头文件中的几个条目来实现。大多数语言的设计初衷都是可移植的，但任何尝试过将\
  \ `IBM PC BASIC` 程序转换为 `Apple BASIC`（它们是近亲关系）或尝试在 `Unix` 系统上运行 `IBM mainframe FORTRAN`\
  \ 程序的人都知道，移植充其量只是一件麻烦事。`C` 是可移植性的领导者。`C` 编译器（将你的 `C` 代码转换为计算机内部使用的指令的程序）适用于许多计算机架构，从\
  \ 8 位微处理器到 Cray 超级计算机。然而，请注意，程序中专门为访问特定硬件设备（如显示器）或操作系统的特殊功能（如 `Windows 8` 或 `OS\
  \ X`）而编写的部分通常是不移植的。\n\n由于 `C` 与 `Unix` 紧密联系，`Unix` 系统通常带有一个 `C` 编译器作为软件包的一部分。`Linux`\
  \ 安装通常也包含 `C` 编译器。个人电脑有多种 `C` 编译器可用，包括运行各种版本 `Windows` 和 `Macintosh` 的 PC。因此，无论你是在使用家用电脑、专业工作站还是大型机，你都有机会为你的特定系统获取一个\
  \ `C` 编译器。\n\n### 强大与灵活性\n\n`C` 强大且灵活（这是计算机文献中两个喜爱的词）。例如，大部分强大且灵活的 `Unix` 操作系统是用\
  \ `C` 编写的。其他语言的许多编译器和解释器——如 `FORTRAN`、`Perl`、`Python`、`Pascal`、`LISP`、`Logo` 和 `BASIC`——都是用\
  \ `C` 编写的。因此，当你在 `Unix` 上使用 `FORTRAN` 时，最终是一个 `C` 程序完成了生成最终可执行程序的工作。`C` 程序用于解决物理和工程问题，甚至用于电影特效动画。\n\
  \n### 面向程序员\n\n`C` 倾向于满足程序员的需求。它让你能够访问硬件，并允许你操作内存中的单个比特位。它丰富的运算符选择允许你简洁地表达自己的想法。在限制你能做什么方面，`C`\
  \ 比 `Pascal` 甚至比 `C++` 都要少。这种灵活性既是优势也是危险。优势在于，许多任务（例如转换数据格式）在 `C` 中要简单得多。危险在于，使用\
  \ `C` 时你可以犯下在某些语言中无法发生的错误。`C` 给了你更多的自由，但也给你承担了更多的责任。\n\n此外，大多数 `C` 的实现都包含一个实用的 `C`\
  \ 函数库。这些函数处理了程序员经常面对的许多需求。\n\n### 缺点\n\n`C` 确实有一些缺陷。通常，就像人一样，缺点和优点是同一特性的对立面。例如，我们提到过\
  \ `C` 的表达自由也需要额外的责任。特别是 `C` 对指针的使用（这是你可以在书中期待学习的内容），意味着你可能会犯难以追踪的编程错误。正如一位早期的计算机门外汉所评论的那样，自由的代价是永恒的警惕。\n\
  \n`C` 的简洁性结合其丰富的运算符，使得编写出极其难以阅读的代码成为可能。你并不是被迫要编写晦涩的代码，但机会就在那里。毕竟，还有什么语言会举办每年的“混淆代码”（Obfuscated\
  \ Code）大赛呢？\n\n还有更多的优点，无疑还有一些缺点。我们不再深入探讨这个问题，让我们转向新话题。\n\n## C 的去向何方？\n\n在 20 世纪\
  \ 80 年代初，`C` 已经是 `Unix` 世界的主导语言。它的成长是因为人们尝试过并喜欢它。在过去的十、二十年里，许多人从 `C` 转向了 `C++`、`Objective\
  \ C` 和 `Java` 等语言，但 `C` 本身仍然是一门重要的语言，也是通往其他语言的迁移路径。在学习 `C` 时，你会发现它的许多优点（参见图 1.1）。让我们现在预览一下其中几个。\n\
  \n![Image](img/01fig02.jpg)\n\n图 1.2 `C` 的用途。\n\n从那以后，它扩展到了个人计算机（微机）和大型机。许多公司使用\
  \ `C` 作为制作文字处理程序、电子表格和其他产品的首选语言。这些公司知道 `C` 能产生紧凑且高效的程序。对公司和 `C` 老兵有好处，对其他用户也有好处。越来越多的计算机用户转向\
  \ `C` 以为自己赢得优势。你不需要成为计算机专业人士也能使用 `C`。\n\n在 20 世纪 90 年代，许多软件公司开始转向 `C++` 语言进行大型项目。`C++`\
  \ 为 `C` 语言嫁接了对象面向编程工具。（`对象面向编程`是一种哲学，试图让语言适应问题，而不是让问题适应语言。）`C++` 几乎是 `C` 的超集，这意味着任何\
  \ `C` 程序都是（或几乎是）有效的 `C++` 程序。通过学习 `C`，你也学会了大部分 `C++`。\n\n尽管较新语言（如 `C++` 和 `Java`）很流行，但\
  \ `C` 仍然是软件行业的一项核心技能，通常位所需技能的前 10 名。特别是，`C` 在编程嵌入式系统方面变得流行。也就是说，它被用于为汽车、相机、DVD 播放器和其他现代设备日益常见的微处理器编程。此外，`C`\
  \ 进入了 `FORTRAN` 在科学编程领域的长期主导地位。最后，作为一种为开发操作系统而创建的语言，理，它在 `Linux` 的开发中发挥着重要作用。因此，21\
  \ 世纪的第二个十年发现 `C` 依然表现强劲。\n\n简而言之，`C` 是最重要的编程语言之一，并将继续保持如此。如果你想找一份写软件的工作，你应该能够回答的第一个问题之一就是：“噢说，你会\
  \ `C` 吗？”\n\n\n\n既然你正准备学习用 C 语言编程，你可能应该稍微了解一下计算机是如何工作的。这些知识将帮助你理解编写 C 程序与在你运行该程序时最终发生的情况之间的联系。\n\
  \n现代计算机有多个组件。`central processing unit`（即 `CPU`）承担了大部分计算工作。`random access memory`（即\
  \ `RAM`）作为工作空间，用于存放程序和文件。永久性存储设备（过去通常是硬盘，但现在越来越多是固态设备）即使在计算机关机时也能记住这些程序和文件。各种外围设备——如键盘、鼠标、触摸屏和显示器——提供了计算机与你之间的通信手段。`CPU`\
  \ 处理你的程序；所以，让我们集中关注它的角色吧。\n\n至少在这个简化的叙述中，`CPU` 的运行非常简单。它从内存中取一条指令并执行它。它再次从内存中取回下一条指令并执行它，以此此类推。（一个吉赫兹的\
  \ `CPU` 每秒可以执行大约十亿次操作，因此 `CPU` 以极快的速度度过它枯燥的生活。）`CPU` 拥有自己的小型工作空间，由几个 `registers`（寄存器）组成，每个寄存器可以存储一个数字。一个寄存器存储下一条指令的内存地址，`CPU`\
  \ 使用此信息获取下一条指令。在获取指令后，`CPU` 将指令存储在另一个寄存器中，并更新第一个寄存器为下一条指令的地址。`CPU` 所理解的指令范围有限（被称为\
  \ `instruction set`，即指令集）。此外，这些指令相当具体；其中许多指令要求计算机将数字从一个位置移动到另一个位置——例如，从内存位置移动到寄存器。\n\
  \n关于这个叙述有两个有趣的点。首先，存储在计算机中的一切都是以数字的形式存储的。数字以数字的形式存储。字符（例如你在文本文档中使用的字母）是以数字的形式存储的；每个字符都有一个数字代码。计算机加载到寄存器中的指令是以数字的形式存储的；`instruction\
  \ set` 中的每条指令都有一个数字代码。其次，计算机程序最终必须以这种数字指令代码表示，或者所说的 `machine language`（机器语言）。\n\n\
  计算机工作方式导致的结果是，如果你想让计算机做某事，你就必须提供一份特定的指令列表（程序），准确告诉它要做什么以及如何做。你必须用计算机直接理解的语言（`machine\
  \ language`）来创建程序。这是一项详尽、枯燥且精确的任务。即使是两个数字相加这样简单的操作也必须分解为几个步骤，可能如下：\n\n1. 将内存位置 `2000`\
  \ 中的数字复制到 `register 1`。\n2. 将内存位置 `2004` 中的数字复制到 `register 2`。\n3. 将 `register 2`\
  \ 的内容加到 `register 1` 内容上，并将结果留在 `register 1` 中。\n4. 将 `register 1` 的内容复制到内存位置 `2008`。\n\
  \n你必须用数字代码来表示这些每条指令！\n\n如果以这种方式编写程序听起来像是你想要做的事情，那么你会遗憾地发现，机器语言编程的黄金时代早已过去。但如果你更倾向于一些更有趣的东西，请对高级程序编程语言敞开胸怀。\n\
  \n## 高级计算机语言与编译器\n\n高级程序编程语言（如 C、Java 和 Pascal）从多个方面简化了你的编程生活。首先，你不需要用数字代码来表示你的指令。其次，你使用的指令比计算机使用的详细方法更接近你思考问题的方式。你不需要担心某个特定\
  \ `CPU` 完成某个特定任务必须采取的精确步骤，你可以在更抽象的层面上表达你的愿望。例如，将两个数字相加，你可能会写如下代码：\n\n```\ntotal\
  \ = mine + yours;\n```\n\n看到这样的代码，你就能很好地知道它的作用；而观察用数字代码表示的几条机器语言等价指令，启发性要小得多。\n\n\
  遗憾的是，对于计算机来说，情况恰恰相反；对它来说，高级指令是不可理解的言乱语。这就是编译器登场的地方。`compiler`（编译器）是一个将高级语言程序翻译成计算机所需的详细机器语言指令集的程序。你负责高级的思考；编译器负责处理枯燥的细节。\n\
  \n编译器方法还有另一个优点。通常情况下，每种计算机设计都有其独特的机器语言；因此，为例如 `Intel Core i7 CPU` 编写的机器语言程序对 `ARM\
  \ Cortex-A57 CPU` 来说毫无意义。但你可以为特定的机器语言匹配编译器。因此，通过正确的编译器或一组编译器，你可以将同一个高级语言程序转换为多种不同的机器语言程序。你只需要解决一次编程问题，然后让你的编译器将解决方案翻译成各种机器语言。\n\
  \n简而言之，高级语言——如 C、Java 和 Pascal——以更抽象的形式描述动作，并且不与特定的 `CPU` 或指令集绑定。此外，高级语言比机器语言更容易学习，编程起来也容易得多。\n\
  \n## 计算技术的进展\n\n1964 年，控制数据公司发布了 `CDC 6600` 计算机。这台占满整个房间的机器被认为是第一台超级计算机，它的起价约为 600\
  \ 万美元。它是高能核物理研究的首选计算机。现代智能手机在计算能力和内存方面是它的几百倍。它还能显示视频和播放音乐。而且还是部手机。\n\n1964 年，`FORTRAN`\
  \ 是主导编程语言，至少在工程和科学领域如此。编程语言的演进并没有它们运行的硬件那么剧烈。尽管如此，编程语言的世界发生了变化。为了应对日益巨大的编程项目，语言首先提供了对结构化编程的支持，然后提供了对对象编程的支持。不仅有新语言出现，现有语言也随时代进步。\n\
  \n## 语言标准\n\n目前，有许多 C 的实现。理想情况下，当你编写一个 C 程序时，它在任何实现上的运行方式都是相同的，只要没有使用特定机器的编程。为了在实践中实现，不同的实现需要符合一个公认的标准。\n\
  \n起，C 并没有官方标准。相反，Brian Kernighan 和 Dennis Ritchie 编写的第一版《The C Programming Language》（1978\
  \ 年）成为了接受的标准，通常被称为 `K&R C` 或 `Classic C`。特别是该书附录中的 `C Reference Manual` 充当了 C 实现的指南。例如，编译器会声称提供完整的\
  \ K&R 实现。然而，尽管附录定义了 C 语言，但它没有定义 C 库。C 比大多数语言都更依赖它的库，因此也需要库标准。在缺乏官方标准的情况下，Unix 实现提供的库变成了事实上的标准。\n\
  \n\n\n随着 C 语言的演变并在更多系统中被广泛使用，C 社区意识到它需要一个更全面、更新且严谨的标准。为了这一需求，美国国家标准协会（ANSI）于 1983\
  \ 年成立了一个委员会（`X3J11`）来开发新标准，该标准于 1989 年正式通过。该标准（`ANSI C`）定义了语言以及标准 C 库。国际标准化组织于 1990\
  \ 年采纳了 C 标准（`ISO C`）。`ISO C` 和 `ANSI C` 基本上是同一个标准。ANSI/ISO 标准最终版本通常被称为 `C89`（因为那是\
  \ ANSI 批准的时间）或 `C90`（因为那是 ISO 批准的时间）。此外，由于 ANSI 版本先发布，人们经常使用 `ANSI C` 这个术语。\n\n\
  该委员会有几项指导原则。也许最有趣的一点是：保持 C 的精神。委员会列出了以下观点来表达这种精神的内核：\n\n![Image](img/squf.jpg) 信任程序员。\n\
  \n![Image](img/squf.jpg) 不要阻止程序员执行需要做的事情。\n\n![Image](img/squf.jpg) 保持语言的小巧和简单。\n\
  \n![Image](img/squf.jpg) 为一种操作仅提供一种方法。\n\n![Image](img/squf.jpg) 确保运行快速，即使不保证可移植性。\n\
  \n通过最后一点，委员会的意思是实现应该根据目标计算机最有效的方式来定义特定操作，而不是试图强加一个抽象、统一的定义。在学习这种语言的过程中，你会遇到这种哲学的示例。\n\
  \n### C99 标准\n\n1994 年，当时被称为 `C9X` 委员会的 ANSI/ISO 联合委员会开始修订标准，这一努力促成了 `C99` 标准。委员会认可了\
  \ `C90` 标准的原始原则，包括保持语言的小巧和简单。委员会的意图除非为了满足新目标所需要，否则不会为语言添加新功能。这些主要目标之一是支持国际编程，例如提供处理国际字符集的方法。第二个目标是“对现有实践进行规范以解决明显的缺陷”。因此，在满足将\
  \ C 迁移到 64 位处理器的需求时，委员会根据那些在现实生活中处理这一问题的人的经验对标准进行了补充。第三个目标是提高 C 用于科学工程项目关键数值计算的适用性，使\
  \ C 成为比 FORTRAN 更吸引人的替代方案。\n\n这三点——国际化、修正缺陷和提高计算实用性——是面向变化的主要目标。其余的变化计划性质上更为保守——例如，尽量与\
  \ `C90` 以及 `C++` 的不兼容性，并保持语言概念上的简单。用委员会的话说，“……委员会乐于让 C++ 成为大型且雄心勃勃的语言。”\n\n结果是，`C99`\
  \ 的变化保留了 C 的本质，C 仍然是一种简洁、干净、高效的语言。本书指出了许多 `C99` 的变化。然而，尽管标准已经发布了一段时间，但并不是所有的编译器都完全实现了所有的\
  \ `C99` 更改。你可能会发现某些特性在你的系统上不可用。或者你可能会发现某些 `C99` 特只有在修改编译器设置时才可用。\n\n### C11 标准\n\
  \n维护标准是一个持续的过程，2007 年，标准委员会承诺进行下一次修订 `C1X`，并演变为 `C11`。委员会提出了一些新的指导原则。其中之一是，面对当代对编程安全和安全的关注，“信任程序员”的目标应该适度放缓。委员会还做出了一些重要的观察。之一是，`C99`\
  \ 受厂商欢迎和欢迎不如 `C90` 那样广泛。因此，`C99` 的某些特性在 `C11` 中变得可选。其中一个原因是，委员会认为服务于小型机器市场的厂商不应被要求支持在其目标环境中未使用的特性。另一个观察是，标准的修订并不是因为标准坏了，而是因为有跟踪新技术的需要。一个例子是为了响应计算机使用多个处理器的趋势，增加了对并发编程的可选支持。我们简要地查看一下这个主题，但深入探索它超出了本书的范围。\n\
  \n***\n\n**注意**\n\n本书将使用术语 `ANSI C`，或者从更国际化的角度使用 `ANSI/ISO C` 或直接 `ISO C` 来指代 `C89/90`\
  \ 及后续标准通用的特性，并使用 `C99` 和 `C11` 指代新特性。偶尔它会提到 `C90`（例如在讨论某特性首次添加到 C 中时）。\n\n***\n\n\
  ### 使用 C 语言：七步\n\n正如你所看到的，C 是一种编译语言。如果你习惯于使用编译型语言（如 Pascal 或 FORTRAN），你将熟悉组合 C 程序的基本步骤。然而，如果你的背景是解释型语言（如\
  \ BASIC），或面向图形界面的语言（如 Visual Basic），或者你完全没有背景，你就需要学习如何编译。我们很快就会该过程，你会发现它是直观且合理的。首先，为了让你对编程有一个概览，让我们把编写\
  \ C 程序的行为分解为七步（参见图 1.3）。注意，这是一种理想化。在实践中，特别是对于大型项目，你会反复根据后续步骤改进前面的步骤。\n\n#### 第 1\
  \ ：定义程序目标\n\n自然，你应该从对程序想要完成的明确想法开始。从程序所需的信息、程序需要执行的计算和处理，以及程序应该向你报告的信息来考虑。在规划的这一阶段，你应该用通用术语思考，而不是特定的计算机语言。\n\
  \n#### 第 2 ：设计程序\n\n当你对程序应该做什么有了概念性的认识后，应该决定程序如何实现它。用户界面应该是怎样的？程序应该如何组织？目标用户是谁？你完成程序有多少时间？\n\
  \n你还需要决定如何在程序中（可能在辅助文件中）表示数据，以及使用何种方法处理数据。当你初次学习 C 编程时，选择是简单的，但随着你处理更复杂的情况，你会发现这些决策需要更多的思考。选择一种良好的表示方法通常可以让程序设计和数据处理变得容易。\n\
  \n再次，你应该用通用术语思考，而不是具体的代码，但你的某些决定可能基于语言的通用特性。例如，C 程序员在数据表示方面比 Pascal 程序员有更多选择。\n\n\
  #### 第 3 ：编写代码\n\n\n\n\n现在你已经对程序有了清晰的设计，可以开始通过编写代码来实现它了。也就是说，你要将程序设计翻译成 C 语言。这正是你真正需要施展\
  \ C 语言知识才能的地方。你可以在纸上勾勒你的想法，但最终你必须将代码输入计算机。这一过程的机制取决于你的编程环境。我们很快就会介绍一些常见环境的细节。通常，你使用文本编辑器创建一个所谓的`source\
  \ code`（源代码）文件。该文件包含了程序设计的 C 语言版本。列表 1.1 显示了 C 源代码的一个示例。\n\n#### 列表 1.1 C 源代码示例\n\
  \n点击此处查看代码图像\n\n```c\n#include <stdio.h>\n\nint main(void)\n{\n    int dogs;\n \
  \   printf(\"How many dogs do you have?\\n\");\n    scanf(\"%d\", &dogs);\n    printf(\"\
  So you have %d dog(s)!\\n\", dogs);\n    return 0;\n}\n```\n\n作为这一步的一部分，你应该记录你的工作。最简单的方法是使用\
  \ C 的注释功能将说明整合到你的源代码中。第 2 章“介绍 C”将详细介绍关于在代码中使用注释的知识。\n\n### 步骤 4：编译\n\n下一步是编译源代码。同样，细节取决于你的编程环境，我们很快会查看一些常见的环境。现在，让我们先从一个更具概念性的视角来看发生了发生了什么。\n\
  \n记住，编译器是一个程序，它的工作是将源代码转换为可执行代码。`Executable code`（可执行代码）是计算机的原生语言，或称为`machine language`（机器语言）。这种语言由用数字代码表示的详细指令组成。正如你之前读到的，不同的计算机有不同的机器语言，而\
  \ C 编译器会将 C 翻译成特定的机器语言。C 编译器还将将 C 库中的代码整合到最终程序中；这些库包含了大量的标准例程，例如 `printf()` 和 `scanf()`，供你使用。（更准确地说，一个名为`linker`（链接器）的程序会引入库例程，但在大多数系统上，编译器会为你运行链接器。）最终结果是一个可执行文件，其中包含了计算机能理解且你可以运行的代码。\n\
  \n编译器还会检查你的程序是否为有效的 C 语言。如果编译器发现错误，它会向你报告并且不产生可执行文件。理解特定编译器的报错信息是你将学会的另一个技能。\n\n\
  ### 步骤 5：运行程序\n\n传统上，可执行文件是一个你可以运行的程序。要在许多常见环境（包括 Windows 命令提示符模式、Unix 终端模式和 Linux\
  \ 终端模式）中运行程序，只需输入可执行文件的文件名。其他环境（如 VAX  VMS）可能需要运行命令或其他机制。`Integrated development\
  \ environments (IDEs)`（例如为 Windows 和 Macintosh 环境提供的 IDE）允许你通过从菜单中选择或按下特殊键，在 IDE\
  \ 内部编辑并执行你的 C 程序。生成的程序也可以通过点击或双击文件名或图标直接从操作系统运行。\n\n### 步骤 6：测试和调试程序\n\n程序可以运行是一个良好的迹象，但它也可能运行不正确。因此，你应该检查程序是否执行了它应该做的事情。你会发现你的某些程序存在错误——计算机术语中称为`bugs`（漏洞）。`Debugging`（调试）是发现并修复程序错误的过程。犯错是学习的自然部分。它似乎是编程中固有的，所以当你将学习和编程相结合时，最好准备好经常被提醒自己是有局限性的。当你成为一名更强大、更微妙的程序员时，你的错误也会变得更加强大和微妙。\n\
  \n你有许多机会犯错。你可以犯下基础的设计错误。你可以错误地实现好的想法。你可能会忽略弄乱你程序的意外输入。你可以错误地使用 C 语言。你可以写出打字错误。你可以把括号放在错误的位置，等等。你会发现自己可以添加到这个列表中的其他项目。\n\
  \n幸运的是，情况并非绝望，尽管有时你可能会认为是如此。编译器可以捕获许多种错误，你也可以做一些事情来帮助追踪那些编译器无法捕获的错误。本书会在学习过程中为你提供调试建议。\n\
  \n### 步骤 7：维护和修改程序\n\n当你自己或为他人创建一个程序时，该程序可能会被广泛使用。如果是，你可能会找到对其进行更改的理由。也许有一个微小的漏洞只在有人输入以\
  \ `Zz` 开头的名字时才会出现，或者你可能想程序中执行某事的更好方法。你可以添加一个巧妙的新功能。你可能调整程序使其在不同的计算机系统上运行。如果你清晰地记录了程序并遵循良好的设计实践，所有这些任务都将大大简化。\n\
  \n### 评述\n\n编程通常不像像刚才描述的过程那样是线性的。有时你需要在步骤之间来回移动。例如，当你编写代码时，你可能会发现你的计划是不切实际的。你可能会看到执行某事的更好方法，或者在看到程序如何运行后，你可能会有改变设计的动力。记录你的工作有助于你在不同层次之间来回移动。\n\
  \n大多数学习者倾向于忽略步骤 1 和步骤 2（定义程序目标和设计程序），直接跳到步骤 3（编写程序）。你编写的第一个程序是简单到你可以在脑海中可视化整个过程。如果你犯了错，很容易发现。随着你的程序变得越来越长、越来越复杂，可视化开始失效，错误也变得难以发现。\n\
  \n### 编程机制\n\n产生程序必须遵循的具体步骤取决于你的计算机环境。由于 C 是可移植的，它适用于许多环境，包括 Unix、Linux、MS-DOS（是的，仍然有人在使用它）、Windows\
  \ 和 Macintosh OS。本书没有足够的空间涵盖所有环境，特别是特定的产品会演变、消亡并被取代。\n\n首先，让我们看看许多 C 环境（包括我们刚刚提到的五个）共同的一些方面。运行\
  \ C 程序并不真的需要了解这些，但它是很好的背景知识。它还可以帮助你理解为什么运行 C 程序需要经过某些特定的步骤。\n\n\n\n\n当你用 C 语言编写程序时，你会将编写的内容存储在一个名为\
  \ `source code file`（源代码文件）的文本文件中。大多数 C 系统（包括我们提到的那些）要求文件名以 `.c` 结尾（例如 `wordcount.c`\
  \ 和 `budget.c`）。文件名中点之前的部分被称为 `basename`（基名），点之后的部分被称为 `extension`（扩展名）。因此，`budget`\
  \ 是基名，`c` 是扩展名。组合后的 `budget.c` 就是文件名。文件名还应该满足特定计算机操作系统的要求。例如，MS-DOS 是一种用于 IBM PC\
  \ 及其克隆机的旧版操作系统。它要求基名长度不超过八个字符，因此之前提到的 `wordcount.c` 文件名并不是有效的 DOS 文件名。某些 Unix 系统对整个名称（包括扩展名）设置了\
  \ 14 个字符的限制；其他 Unix 系统允许更长的名称，最多可达 255 个字符。Linux、Windows 和 Macintosh OS 也允许长文件名。\n\
  \n为了让我们有具体的内容可以参考，假设我们有一个名为 `concrete.c` 的源文件，其中包含了 Listing 1.2 中的 C 源代码。\n\n###\
  \ 列表 1.2 concrete.c 程序\n\n点击此处查看代码图像\n\n```c\n#include <stdio.h>\n\nint main(void)\n\
  {\n    printf(\"Concrete contains gravel and cement.\\n\");\n    return 0;\n}\n\
  ```\n\n不要担心 Listing 1.2 中所示源代码文件的细节；你将在第 2 章中学习它们。\n\n### 目标代码文件、可执行文件和库\n\nC 编程的基本策略是使用程序将你的源代码文件转换为可执行文件，可执行文件是一个包含就绪运行机器语言代码的文件。C\
  \ 实现通常通过两个步骤完成：：编译（compiling）和链接（linking）。编译器将你的源代码转换为中间代码，链接器则将其与其他代码结合以生成可执行文件。C\
  \ 使用这种两部分的方法来促进程序的模块化。你可以单独编译各个模块，稍后使用链接器将编译后的模块结合起来。这样，如果你需要更改一个模块，就不需要重新编译其他模块。此外，链接器会将你的程序与预编译的库代码结合。\n\
  \n中间文件的形式有多种选择。最常见的选择以及此处描述的实现所采用的选择是将源代码转换为机器语言代码，并将结果放在 `object code file`（目标代码文件）或简称\
  \ `object file`（目标文件）中。（这假设你的源代码由单个文件组成。）尽管目标文件包含机器语言代码，但它还没有准备好运行。目标文件包含了你源代码的翻译，但它还一个完整的程序。\n\
  \n目标代码文件中缺失的第一个元素是所谓的 `startup code`（启动代码），它是作为程序与操作系统之间接口的代码。例如，你可以在 MS Windows\
  \ 或 Linux 下运行 IBM PC 兼容机。两种情况下硬件是相同的，因此相同的目标代码可以在两个系统中工作，但你需要为 Windows 和 Linux 使用不同的启动代码，因为这些系统处理程序的方式不相同。\n\
  \n第二个缺失的元素是库例程的代码。几乎所有的 C 程序都会使用标准 C 库中的例程（称为 `functions` 函数）。例如，`concrete.c` 使用了\
  \ `printf()` 函数。目标代码文件并不包含该函数的代码；它仅包含指示使用 `printf()` 函数的指令。实际代码存储在另一个名为 `library`（库）的文件中。库文件包含许多函数的目标代码。\n\
  \n链接器的作用是将这三个元素——你的目标代码、你系统的标准启动代码以及库代码——结合在一起，并将它们合并成一个单一文件，即可执行文件。对于库代码，链接器仅从库中提取你所用函数所需的代码（参见图\
  \ 1.4）。\n\n![Image](img/01fig04.jpg)\n\n图 1.4 编译器和链接器。\n\n简而言，目标文件和可执行文件都由机器语言指令组成。然而，目标文件仅包含你使用的代码的机器语言翻译，而可执行文件还包含你使用的库例程以及启动代码的机器码。\n\
  \n在某些系统中，你必须分别运行编译和链接程序。在其他系统上，编译器会自动启动链接器，因此你只需要给出编译命令。\n\n现在让我们来看一些特定的系统。\n\n\
  ### Unix 系统\n\n由于 C 语言的流行和起源于 Unix 系统，我们将从这里开始。（注意：此处的“Unix”包括 FreeBSD 等系统，它们源自\
  \ Unix 但由于法律原因无法使用该名称。）\n\n#### 在 Unix 系统上编辑\n\nUnix C 没有它自己的编辑器。相反，你使用一个通用的 Unix\
  \ 编辑器，如 `emacs`、`jove`、`vi` 或 X Window 系统文本编辑器。\n\n你的两个主要职责是正确输入程序，并为存储程序的程序选择一个名称。如所述，名称应以\
  \ `.c` 结尾。注意 Unix 区分大小写。因此，`budget.c`、`BUDGET.c` 和 `Budget.c` 是 C 文件的三个不同且有效的名称，但\
  \ `BUDGET.C` 是无效的因为它使用了大写 C。\n\n使用 `vi` 编辑器，我们准备了以下程序并将其存储在名为 `inform.c` 的文件中。点击此处查看代码图像\n\
  \n```c\n#include <stdio.h>\n\nint main(void)\n{\n    printf(\"A .c is used to end\
  \ a program.\\n\");\n    return 0;\n}\n```\n\n文本是源代码，`inform.c` 是源文件。这里的关键点是源文件是一个过程的开始而不是结束。\n\
  \n#### 在 Unix 系统上编译\n\n我们的程序虽然无疑很出色，但对计算机仍然是乱码。计算机不理解像 `#include` 和 `printf` 之类的东西。（你可能也不理解，但很快就会。）正如我们之前提到的，我们需要编译器的帮助将我们的代码（源代码）转换为计算机的代码（机器码）。这些努力的结果将是可执行文件，包含了计算机完成工作所需的所有机器码。\n\
  \n历史上，通过 `cc` 命令调用的 Unix 编译器定义了语言。但它没有跟上发展的标准，并已被淘汰。然而，Unix 系统通常提供来自其他来源的 C 编译器，并将\
  \ `cc` 命令设置为该编译器的别名。因此你仍然可以使用相同的命令，尽管它在不同的系统中调用不同的编译器。\n\n要编译 `inform.c` 程序，输入：\n\
  \n```cc inform.c\n```\n\n片刻后，Unix 提示符返回，告诉你完成了。如果你没有正确编写程序，可能会收到警告和错误信息，但让我们假设你都做对了。（如果编译器对\
  \ `void` 一词报错，说明你的系统尚未更新到 ANSI 编译器。我们将很快讨论更多标准。在此期间，只需从示例中删除 `void` 一词。）如果你使用 `ls`\
  \ 命令列出文件，你会发现有一个名为 `a.out` 的新文件（参见图 1.5）。这就是包含程序翻译（或编译）的可执行文件。要运行它，只需输入\n\n```bash\n\
  a.out\n```\n\n然后智慧喷涌而出：\n\n点击此处查看代码图像\n\n\n\n\n\n如果你想保留可执行文件（`a.out`），你应该对其进行重命名。否则，在下次编译程序时，该文件会被一个新的\
  \ `a.out` 替换。\n\n那么对象代码呢？`cc` 编译器会创建一个与源代码具有相同文件名（basename）但扩展名为 `.o` 的对象代码文件。在我们的示例中，对象代码文件被称为\
  \ `inform.o`，但你找不到它，因为链接器在可执行程序生成完成后就会将其删除。然而，如果原始程序使用了多个源代码文件，对象代码文件就会被保存下来。当我们我们在后后部分讨论多文件程序时，你会发现这是一个非常好的主意。\n\
  \n## GNU 编译器集与 LLVM 项目\n\nGNU 项目追溯到 1987 年，是一项大规模协作项目，开发了大量的自由类 Unix 软件。（GNU 的意思是“GNU's\
  \ Not Unix”。）它的产品之一是 GNU 编译器集，或称 `GCC`，它包含了 `GCC` C 编译器。`GCC` 在指导委员会的指导下不断开发，其 C\
  \ 编译器紧跟不断变化的 C 标准。`GCC` 版本适用于多种硬件平台和操作系统，包括 Unix、Linux 和 Windows。可以使用 `gcc` 命令调用\
  \ `GCC` C 编译器。许多使用 `gcc` 的系统会将 `cc` 设置为 `gcc` 的别名。\n\nLLVM 项目提供了 `cc` 的第二种替代方案。该项目是一个开源的编译器相关软件集，源于\
  \ 2000 年伊利诺伊大学的一个研究项目。它的 `Clang` 编译器处理 C 代码，可以通过 `clang` 调用。`Clang` 可用于 Linux 在内的多个平台，并在\
  \ 2012 年底成为 FreeBSD 的默认 C 编译器。与 `GCC` 一样，`Clang` 对 C 标准遵循得非常好。\n\n两者都接受 `-v` 来获取版本信息，因此在将\
  \ `cc` 别名指向 `gcc` 或 `clang` 命令的系统上，组合命令\n\n```\ncc -v\n```\n\n显示显示正在使用的哪个编译器以及哪个版本。\n\
  \n`gcc` 和 `clang` 命令取决于版本，可能需要运行时选项来调用较新的 C 标准：\n\n```\ngcc -std=c99 inform.c\n\
  gcc -std=c1x inform.c\ngcc -std=c11 inform.c\n```\n\n第一个示例调用 C99 标准，第二个示例在接受该标准之前的\
  \ GCC 版本中调用 C11 草案标准，第三个示例在接受标准之后的 GCC 版本中调用 C11 标准`Clang` 编译器使用相同的标志。\n\n## Linux\
  \ 系统\n\nLinux 是一种流行的开源类 Unix 操作系统，运行在包括 PC 和 Mac 在内的各种平台上。在 Linux 上准备 C 程序与在 Unix\
  \ 系统上几乎相同，只是你会使用 GNU 提供的公有领域 `GCC` C 编译器。编译命令如下：\n\n```\ngcc inform.c\n```\n\n注意，在安装\
  \ Linux 时安装 `GCC` 可能是可选的，因此如果之前没有安装，你（或某人）可能需要安装 `GCC`。通常情况下，安装过程会将 `cc` 设置为 `gcc`\
  \ 的别名，所以如果你愿意，可以在命令行中使用 `cc` 代替 `gcc`。\n\n你可以在 [`www.gnu.org/software/gcc/index.html`](http://www.gnu.org/software/gcc/index.html)\
  \ 获取有关 `GCC` 的更多信息，包括有关新发布版本的信息。\n\n## PC 命令行编译器\n\nC 编译器不是标准 Windows 软件包的一部分，因此你可能需要获取并安装\
  \ C 编译器。`Cygwin` 和 `MinGW` 是免费下载软件，它们让 PC 上命令行可以使用 `GCC` 编译器。`Cygwin` 运行在自己的窗口中，具有命令提示符的外观，但模仿\
  \ Linux 命令行环境。另一方面，`MinGW` 在 Windows 命令提示符模式下运行。这些带有最新（或接近最新）版本的 `GCC`，支持 C99 以及至少部分\
  \ C11。Borland C++ 编译器 5.5 是另一个免费下载程序；它支持 C90。\n\n源代码应该是文本文件，而不是文字处理文件。（文字处理文件包含许多关于字体和格式的额外信息。）你应该使用文本编辑器，例如\
  \ Windows 记本。如果你使用“另存为”功能以文本模式保存文件，可以使用文字处理程序。文件应具有 `.c` 扩展名。某些文字处理器会自动为文本文件添加 `.txt`\
  \ 扩展名。如果发生这种情况，你需要更改文件名，将 `txt` 替换为 `c`。\n\nPC C 编译器通常（并非总是）产生具有 `.obj` 扩展名的中间对象代码文件。与\
  \ Unix 编译器不同，这些编译器在完成后通常不会删除这些文件。某些编译器产生具有 `.asm` 扩展名的汇编语言文件，或使用自己的特殊格式。\n\n某些编译器在编译后会自动运行链接器；另一些可能要求你手动运行链接器。链接产生可执行文件，它会在原始源代码文件名后附加\
  \ `.EXE` 扩展名。例如，编译并链接名为 `concrete.c` 的源代码文件会生成名为 `concrete.exe` 的文件。你可以通过命令行输入文件名来运行程序：\n\
  \n```\nC>concrete\n```\n\n## 集成开发环境 (Windows)\n\n包括 Microsoft、Embaradero 和 Digital\
  \ Mars 在内的许多供应商都提供基于 Windows 的集成开发环境，或 `IDEs`。（如今，大多数是 C 和 C++ 组合编译器。）免费下载包括 Microsoft\
  \ Visual Studio 和 Pelles C。它们都是编写 C 程序的快速集成环境。关键点是，每个程序都有一个内置编辑器来编写 C 程序。每个程序都提供了允许你命名和保存源文件的菜单，以及允许你编译和运行程序的菜单。当编译器发现任何错误时，每个程序都会把你带回编辑器。\n\
  \n初看起来可能有些令人畏畏，因为它们提供了多种目标（`targets`）——也就是说，程序将使用的各种环境。例如，它们可能会提供 32 位 Windows 程序、64\
  \ 位 Windows 程序、动态库文件（`DLLs`）等选择。为了管理这些（或其他）选择，你通常会创建一个项目（`project`），然后向其添加你将使用的源代码文件。具体步骤取决于你使用的产品。通常，你首先使用文件菜单或项目菜单创建一个项目。重要的是选择正确的项目类型。书中的示例是通用示例，设计用于在简单的环境中运行。各种\
  \ Windows IDE 提供了一个或多个选项来匹配这种简单的假设。例如，Microsoft Visual Studio 提供了 Win32 控制台选项。\n\
  \n由于 Windows IDE 通常同时处理 C 和 C++，你需要指示你想编写一个 C 程序。在某些产品中，你使用项目类型来指示你想使用 C。在其他产品中（例如\
  \ Microsoft Visual C++），你使用 `.c` 文件扩展名来指示你想使用 C 而不是 C++。然而，大多数 C 程序也可以作为 C++ 程序运行。\n\
  \n\n\n\n\n你可能会遇到的一个问题是，当程序结束时，显示程序执行的窗口会消失。如果你遇到了这种情况，可以使程序暂停，直到你按下 Enter 键为止。要做到这一点，可以在程序的末尾、`return`\
  \ 语句之前添加以下行代码：\n\n```\ngetchar();\n```\n\n这一行会读取一个按键，因此程序将暂停，直到你按下 Enter 键为止。有时，取决于程序的运行方式，可能已经有一个按键在等待了。在这种情况下，你将需要使用两次\
  \ `getchar()`：\n\n```c\ngetchar();\ngetchar();\n```\n\n例如，如果程序最后做的一件事是要求你输入体重，那么你输入输入体重并按下\
  \ Enter 键来提交数据。程序会读取体重，第一个 `getchar()` 会读取 Enter 键，而第二个 `getchar()` 则会让程序暂停，直到你再次按下\
  \ Enter。如果你现在觉得这不太好理解，那么在你学习了更多 C 输入知识后，你就会理解了。我们稍后会再次提醒你这种方法。\n\n尽管各种 IDE 有许多共同的通用原则，但细节上随产品而异，在同一产品线内，也随版本而异。你必须进行一些实验来了解你的编译器是如何工作的。你甚至可能需要阅读手册或尝试在线教程。\n\
  \n***\n\n## Microsoft Visual Studio 与 C 标准\n\nMicrosoft Visual Studio 和免费软件 Microsoft\
  \ Visual Studio Express 在 Windows 软件开发中占据主流，因此它们与 C 标准的关系具有一定的重要性。简而言之，微软鼓励程序员从\
  \ C 转向到 C++ 或 C#。Visual Studio 支持 C89/90，但目前为止，它对后续标准的支持仅限于支持在 C++ 中也存在的新功能，例如 `long\
  \ long` 类型。此外，从 2012 版本开始，Visual Studio 不再将 C 作为项目类型之一提供。然而，你仍然可以使用 Visual Studio\
  \ 书中的大部分程序。一种方法是直接选择 C++ 选项，然后选择 Win32 Console，最后在应用程序设置中选择 Empty Project（空项目）。几乎所有的\
  \ C 都与 C++ 兼容，因此书中的大多数 C 程序也可以作为 C++ 程序运行。或者，在在选择 C++ 选项后，对源文件使用 `.c` 扩展而不是默认的 `.cpp`\
  \ 扩展，编译器将使用 C 规则而不是 C++ 规则。\n\n***\n\n### Windows/Linux 选项\n\n许多 Linux 发行版可以从 Windows\
  \ 安装以建立双引导系统。你的部分存储空间将预留给 Linux 系统，然后你就可以启动到 Windows 或 Linux。你无法从 Windows 运行 Linux\
  \ 程序（反之亦然），也无法从 Windows 访问 Linux 文件，但你可以从 Linux 访问 Windows 文档。\n\n### Macintosh\
  \  C\n\n目前，Apple 提供了 Xcode 开发系统作为免费下载。（过去，它有时是免费的，有时需要支付少量的费用。）它让你从多种编程语言中选择 C。\n\
  \nXcode 具有处理多种编程语言、针对多个平台以及开发大型项目的能力，看起来可能令人生生畏。但你只需要学习足够编写简单 C 程序的知识。使用 Xcode 4.6，通过\
  \ File（文件）菜单选择 New（新建）、Project（项目）、OS X Application Command Line Tool（操作系统应用程序命令行工具），然后输入产品名称并在\
  \ Type（类型）中选择 C。Xcode 对 C 代码使用 Clang 或 GCC C 编译器。它以前默认使用 GCC，现在默认使用 Clang。你可以使用\
  \ Xcode 设置选择它使用哪种编译器以及支持哪种 C 标准。（由于许可问题，Xcode 附带的 Clang 版本比 GCC 版本更新。）\n\nMac OS\
  \ X 构建在 Unix 之上，Terminal（终端）工具打开一个窗口，让你能够在 Unix 命令行环境中运行程序。Apple 没有在其标准包中提供命令行编译器，但如果你下载了\
  \ Xcode，还可以下载可选的命令行工具，允许你使用 `clang` 和 `gcc` 命令在命令行模式下编译。\n\n### 本书的组织结构\n\n组织信息有许多方法。最直接的方法之一是呈现关于主题\
  \ A 的所有内容、关于主题 B 的所有内容，以此类推。这对于参考书来说特别有用，因为你可以在一个地方找到关于给定主题的所有信息。但这通常不是学习某个学科的最优顺序。例如，如果你在开始学习英语时先学习所有的名词，你表达想法的能力将受到严重限制。当然，你可以指向物体并大喊它们的名字，但如果你只学习几个名词、动词、形容词等，以及一些关于这些部分如何相互关联的规则，你表达自己的能力会强得多。\n\
  \n为了给你提供更均衡的信息输入，本书采用了“螺旋上升”的方法，即在前面的章节中引入几个主题，稍后回来进行更充分的讨论。例如，理解函数对于理解 C 至关重要。因此，前面的几章节都包含了对函数的一些讨论，这样当你到达\
  \ 第 9 章 的“函数”时，你已经对使用函数有了些熟练。同样，前面的章节预览了字符串和循环，以便你可以在详细学习它们之前，就开始在程序中使用这些实用的工具。\n\
  \n### 书中使用的约定\n\n我们几乎准备好开始学习 C 语言本身了。本节介绍了我们在介绍材料时使用的一些约定。\n\n#### 字体\n\n对于代表程序和计算机输入输出的文本，我们使用一种类似于你在屏幕上看到的等宽字体。我们已经使用过几次了。以防你注意到，这种字体如下：\n\
  \n```c\n#include <stdio.h>\n\nint main(void)\n{\n    printf(\"Concrete contains\
  \ gravel and cement.\\n\");\n    return 0;\n}\n```\n\n同样的等宽字体用于文本中的代码术语，如 `main()`，以及文件名如\
  \ `stdio.h`。使用使用斜等宽字体表示你需要替换的占位符术语，如下所示：\n\n`type_name variable_name;`\n\n在这里，例如，你可能将\
  \ `type_name` 替换为 `int`，将 `variable_name` 替换为 `zebra_count`。\n\n#### 程序输出\n\n计算机的输出以相同的格式打印，例外是用户输入将加粗显示。例如，以下是第\
  \ 14 章“结构和其他数据形式”中的示例程序输出：\n\n请输入书名。\n**在行开头按下 [enter] 停止。**\n**我的鹦鹉生活**\n**现在输入作者。**\n\
  **Mack Zackles**\n\n以普通字体打印的行是程序输出，加粗行是用户输入。\n\n你和计算机之间有很多通信方式。然而，我们将假设你通过键盘输入命令，并在屏幕读取响应。\n\
  \n##### 特殊按键\n\n通常，你通过按下标有 Enter、c/r、Return 或这些变体的键发送一行指令。我们在文中将此键称为 *Enter 键*。通常，书中默认你在每行输入结束处都会按下\
  \ Enter 键。然而，为了澄清某些观点，少数示例会显式显示 Enter 键，使用符号 `[enter]` 来表示它。括号意味着你按下的是单个键，而不是输入单词\
  \ *enter*。\n\n\n\n\n\n我们还会提到控制字符，例如 `Ctrl+D`。这种表示法意味着在按下标记为 `Ctrl`（或者 Control）的键的同时，按下\
  \ `D` 键。\n\n## 编写本书时使用的系统\n\n`C` 的某些方面（例如存储数字时使用的空间大小）取决于系统。当我们给出示例并提到“我们的系统”时，我们通常指的是运行在\
  \ `OS X 10.8.4` 下的、并使用 `Xcode 4.6.2` 开发系统以及 `Clang 3.2` 编译器的 iMac。大多数程序还已经在 `Windows\
  \ 7` 系统上使用 `Microsoft Visual Studio Express 2012` 和 `Pelles C 7.0` 完成编译，或者在 `Ubuntu\
  \ 13.04 Linux` 系统上使用 `GCC 4.7.3` 完成编译。\n\n如果你在 [www.informit.com/register](http://www.informit.com/register)\
  \ 注册本书，就可以下载书中的示例代码。\n\n## 你的系统——你需要什么\n\n你需要拥有 `C` 编译器或获取一个编译器。`C` 运行在各种计算机系统中，因此你有许多选择。请务必确保使用的是针对你特定系统设计的\
  \ `C` 编译器。书中的某些示例需要支持 `C99` 或 `C11` 标准，但大多数示例可以在 `C90` 编译器运行。如果你使用的编译器是预 ANSI/ISO\
  \ 版本的，你将不得不进行调整，这种调整的频率可能足以促使你寻找更新的工具。\n\n大多数编译器供应商为学生和教育工作者提供特殊价格，所以如果你属于这一类，请检查供应商的网站。\n\
  \n## 特殊元素\n\n本书包含了几个特殊元素，用于突出某些重点：侧边栏（Sidebars）、`Tips`、`Cautions` 和 `Notes`（注释）。下文说明了它们的样式和用途：\n\
  \n### 侧边栏（Sidebar）\n侧边栏提供了深入的讨论或额外的背景，有助于解释某个主题。\n\n### 提示（Tip）\n提示针对特定的编程情况提供简短实用的指南。\n\
  \n### 警告（Caution）\n警告你注意潜在的陷阱。\n\n### 注释（Note）\n注释为不属于其他类别的评论提供了一个分类。\n\n## 总结\n\
  \n`C` 是一种强大且简洁的编程语言。它之所以流行，因为它提供了实用的编程工具、对硬件的良好控制，并且因为 `C` 程序比大多数语言更容易从一个系统迁移到另一个系统。\n\
  \n`C` 是一种编译语言。`C` 编译器和链接器是将 `C` 语言源代码转换为可执行代码的程序。\n\n用 `C` 编程可能是很费力的、困难且令人沮丧的，但它也可以引人入胜、令人兴奋且令人满足。我们和你发现它像我们一样有趣迷人。\n\
  \n## 复习题\n\n你可以在附录 A 中的“复习题答案”找到复习题的答案。\n\n**1。** 在编程背景下，“可移植性”（portability）是什么意思？\n\
  \n**2。** 解释源代码文件、目标代码文件和可执行文件之间的区别。\n\n**3。** 编程的七个主要步骤是什么？\n\n**4。** 编译器做什么做什么？\n\
  \n**5。** 链接器是做什么？\n\n## 编程练习\n\n我们并不要求你现在编写 `C` 代码，所以这个练习集中在编程过程的早期阶段。\n\n**1.**\
  \ 你刚刚被 `MacroMuscle`, `Inc.`（硬体软件公司）聘用。公司正在进入欧洲市场，想要一个程序将英寸转换为厘米（1 英寸 = 2.54 厘米）。公司希望程序设计为提示用户输入一个英寸值。你的任务是定义程序目标并设计程序（编程过程的第\
  \ 1 和第 2 步）。\n\n# 2. 介绍 C\n\n你将在本章学习以下内容：\n\n![Image](img/squf.jpg) 运算符：\n\n`=`\n\
  \n![Image](img/squf.jpg) 函数：\n\n`main(), printf()`\n\n![Image](img/squf.jpg) 组合成一个简单的\
  \ C 程序\n\n![Image](img/squf.jpg) 创建整数值变量、为其赋值并在屏幕上显示这些值\n\n![Image](img/squf.jpg)\
  \ 换行符\n\n![Image](img/squf.jpg) 如何在程序中包含注释、创建包含多个函数的程序以及查找程序错误\n\n![Image](img/squf.jpg)\
  \ 什么是关键字\n\n一个 `C` 程序看起来像什么样？如果你快速翻阅这本书，你将看到很多示例。你很可能会发现 `C` 看起来有点奇怪，点布着诸如 `{, cp->tort`\
  \ 和 `*ptr++` 之类的符号。然而，当你读完这本书时，你会发现这些以及其他特征性 `C` 符号的外观不再那么陌生，变得更加熟悉，甚至可能大受欢迎！或者，如果你已经熟悉\
  \ `C` 的众多后代语言之一，你可能会感觉自己回到了了源头。在本章中，我们首先展示一个简单的示例程序并解释它的作用。同时，我们还强调了 `C` 的一些基本特性。\n\
  \n### C 的简单示例\n\n让我们来看一个简单的 `C` 程序。这个程序如列表 2.1 所示，用于指出一些基本特性。在阅读该程序的逐行解释之前，请阅读一遍列表\
  \ 2.1，看看能否看出它在做什么。\n\n列表 2.1 first.c\n\n```c\n#include <stdio.h>\n\nint main(void)\n\
  {\n    int num;\n    num = 1;\n    printf(\"I am a simple \");\n    printf(\"computer.\\\
  n\");\n    printf(\"My favorite number is %d because it is first.\\n\",num);\n \
  \   return 0;\n}\n```\n\n### 程序调整\n\n该程序的输出是否在屏幕上短暂消失？某些窗口环境在独立的窗口中运行程序，并在程序结束后自动关闭窗口。在这种情况下，你需要提供额外的代码让窗口保持打开直到你按下按键。一种方法是在返回语句之前添加以下行：\n\
  \n```c\ngetchar();\n```\n\n这段代码导致程序等待一次击键，因此窗口会在你按键之前保持打开。你将在第 8 章](#ch08.html_ch08)“字符输入输出和输入验证”中学更多关于\
  \ `getchar()` 的知识。\n\n### 示例解释\n\n我们将对程序的源代码进行两次遍历。第一遍（路径 1：快速概览）强调了每一行的含义，帮助你对整体有一个感觉。第二遍（路径\
  \ 2：程序细节）探索了具体的含义和细节，帮助你获得更深入的理解。\n\n图 2.1 总结了 C 程序的组成；它包含了比我们第一个示例更多的元素。\n\n![Image](img/02fig01.jpg)\n\
  \n\n\n\n\n图 2.1 C 程序的结构。\n\n## 第 1 遍：快速概述\n\n本节介绍了程序中的每一行代码，并附有简短描述；下一节（第 2 遍）将更深入探讨此处提出的主题。\n\
  \n点击此处查看代码图像\n\n```c\n#include <stdio.h>    包含另一个文件\n```\n\n这一行告诉编译器包含 `stdio.h`\
  \ 文件中的信息，该文件是所有 C 编译器包中的标准部分；此文件为键盘输入和输出显示提供了支持。\n\n点击此处查看代码图像\n\n```c\nint main(void)\
  \        ←一个函数名\n```\n\nC 程序由一个或多个函数组成，函数是 C 程序的 Basic 模块。这个程序由一个名为 `main` 的函数组成。括号将\
  \ `main()` 标识为名。`int` 表示 `main()` 函数返回一个整数，`void` 表示 `main()` 不接受任何参数。这些都是我们稍后会讨论的内容。现在，只需接受\
  \ `int` 和 `void` 是标准 ANSI C 定义 `main()` 方式的一部分。（如果你使用的是前 ANSI C 编译器，请省略 `void`；你可能需要获取较新的版本以避免不兼容。）\n\
  \n点击此处查看代码图像\n\n```c\n/* 一个简单的程序 */    ←一个注释\n```\n\n符号 `/*` 和 `*/` 包围着注释——即有助于理解程序的备注。它们仅供读者阅读，编译器会忽略它们。\n\
  \n点击此处查看代码图像\n\n```c\n{        ←函数体的开始\n```\n\n这个左括号标记了组成函数的语句的开始。右括号（`}`）标记了函数定义的结束。\n\
  \n点击此处查看代码图像\n\n```c\nint num;        ←一个声明语句\n```\n\n这条语句宣布你正在使用一个名为 `num` 的变量，且\
  \ `num` 将是 `int`（整数）类型。\n\n点击此处查看代码图像\n\n```c\nnum = 1;    ←一个赋值语句\n```\n\n语句 `num\
  \ = 1;` 将值 `1` 赋值给名为 `num` 的变量。\n\n点击此处查看代码图像\n\n```c\nprintf(\"I am a simple \"\
  );    ←一个函数调用语句\n```\n\n第一个使用 `printf()` 的语句在你的屏幕上显示短语 `I am a simple`，并将光标留在同一行。在这里，`printf()`\
  \ 是标准 C 库的一部分。它被称为“函数”，而是在程序中使用函数被称为“调用函数”。\n\n点击此处查看代码图像\n\n```c\nprintf(\"computer.\\\
  n\");    ←另一个函数调用语句\n```\n\n下一次对 `printf()` 函数的在上一个打印的短语末尾加上 `computer`。`\\n` 是告诉计算机开始新行的代码——即将光标移动到下一行的开头。\n\
  \n点击此处查看代码图像\n\n```c\nprintf(\"My favorite number is %d because it is first.\\n\"\
  , num);\n```\n\n最后一次使用 `printf()` 将 `num` 的值（即 `1`）嵌入到引号中的短语中。`%d` 指示计算机在何处以及什么格式打印\
  \ `num` 的值。\n\n点击此处查看代码图像\n\n```c\nreturn 0;    ←一个返回语句\n```\n\nC 函数可以向调用它的机构提供或返回一个数字。目前，将此行视为\
  \ `main()` 函数的适当结束即可。\n\n```c\n}    ←结束\n```\n\n正如承诺的，程序以一个右括号结束。\n\n## 第 2 遍：程序细节\n\
  \n现在你已经对 列表 2.1 有了了解，我们将进行更仔细的观察。再次，我们将检查程序中的每一行，这次将使用每行代码作为起点，深入了解代码背后的细节，并作为开发对\
  \ C 编程特征更具通用性的视角的基础。\n\n### #include 指指令和头文件\n\n```c\n#include <stdio.h>\n```\n\n\
  这是程序的起始行。`#include <stdio.h>` 的效果等于你在 `#include` 行出现的地方，将 `stdio.h` 文件的全部内容输入到你的文件中。实际上，这是一个剪切和粘贴操作。`include`\
  \ 文件提供了一种共享许多程序中共用信息的方便方法。\n\n`#include` 语句是 C 预处理器指令的一个示例。通常，C 编译器在编译之前会执行一些准备性工作；这就是预处理。\n\
  \n`stdio.h` 文件是所有 C 编译器包的一部分。它包含了关于输入和输出的信息，例如 `printf()`。ANSI C 标准规定了编译器必须包含哪些头文件。\n\
  \n### 注意：为什么输入输出不是内置的\n\n你可能奇怪为什么像输入输出这样基础的功能没有自动包含。答案是并不是所有程序都使用 I/O（输入输出）包，C 的哲学之一是避免不必要的。这种对资源的经济利用使得\
  \ C 在嵌入式编程中流行——例如为控制汽车燃料系统或蓝光播放器编写代码。顺便说一下，`#include` 行不是 C 语言语句！第一列的 `#` 符号将该行标识为由\
  \ C 预处理器处理。稍后你会遇到更多预处理器指令的示例，第 16 章\n```\n\n程序的下一行声明了一个名为 `main` 的函数。诚然，`main` 是一个相当普通的名字，但它是唯一的选择。C\
  \ 程序（某些我们不考虑的例外）总是从名为 `main()` 的函数开始执行。你可以自由为你使用的其他函数命名，但 `main()` 必须在那里以启动程序。括号呢？它们将\
  \ `main()` 标识为函数。你很快就会学习更多函数的知识。`int` 是 `main()` 函数的返回类型。这意味着 `main()` 返回的值类型是整数。返回哪里？返回给操作系统——我们将在第\
  \ 6 章](#ch06.html_ch06）“C 控制语句：循环”中回到这个问题。\n\n\n\n\n函数名后的括号通常包含要传递给函数的信息。对于这个简单的示例，没有传递任何信息，因此括号内包含\
  \ `void` 单词。（第 11 章“字符字符串和字符串函数” 介绍了另一种格式，该格式允许操作系统向 `main()` 传递信息。）\n\n如果你浏览古老的\
  \ C 代码，经常会看到程序以以下格式开头：\n\n```c\nmain()\n```\n\nC90 标准勉强容忍了这种形式，但 `C99` 和 `C11` 标准并不如此。因此，即使你当前的编译器允许你这样做，也请不要。\n\
  \n下面是你可能会看到的另一种形式：\n\n```c\nvoid main()\n```\n\n某些编译器允许这种写法，但没有任何一个标准曾将其列为受认可的选项。因此，编译器没有义务接受这种形式，而且有些编译器并不接受。再次，坚持标准形式，这样当你将程序从一个编译器移动到另一个编译器时就不会遇到问题。\n\
  \n### 注释\n\n```c\n/* a simple program */\n```\n\n被 `/* */` 符号包围的程序部分是注释。使用注释可以让其他人（包括你自己）更容易地理解你的程序。C\
  \ 注释的一个优秀特性是，它们可以放在任何地方，甚至可以与它们所解释的内容位于同一行。较长的注释可以单独放在一行，甚至可以跨多行。起始符号 `/*` 和结束符号\
  \ `*/` 之间的所有内容都会被编译器忽略。以下是一些有效和无效的注释形式：\n\n点击此处查看代码图像\n\n```c\n/* 这是一个 C 注释。 */\n\
  \n/* 这个注释有些冗长，跨越了\n\n   两行。 */\n\n/*\n\n  你也可以这样做。\n*/\n\n/* 但这是无效的，因为没有结束标记。\n\
  ```\n\n`C99` 添加了第二种注释风格，这种风格被 C++ 和 Java 所流行。新样式使用 `//` 符号来创建局限于单行的注释：\n\n点击此处查看代码图像\n\
  \n```c\n// 这是一个局限于单行的注释。\n\nint rigue;      // 这种注释也可以在这里。\n```\n\n因为行的结束标志着注释的结束，所以这种样式只需要在注释的开头放置注释标记。\n\
  \n较新的形式是对旧形式中潜在问题的回应。假设你有以下代码：\n\n```c\n/*\n\n我希望这能行。\n\n*/\n\nx = 100;\n\ny = 200;\n\
  \n/* 现在处理其他内容。 */\n```\n\n接下来，假设你决定删除第四行，并且不小心也删除了第三行（`*/`）。代码随后变为：\n\n```c\n/*\n\
  \n我希望这能行。\n\ny = 200;\n\n/* 现在处理其他内容。 */\n```\n\n现在，编译器将第一行的 `/*` 与第四行的 `*/` 配对，使得所有四行都变成了一条注释，其中包含了那行本应是代码的行。由于\
  \ `//` 形式不会跨越多行，它不会导致这种“代码消失”的问题。\n\n某些编译器可能不支持此功能；其他编译器可能需要更改编译器设置以启用 `C99` 或 `C11`\
  \ 特性。\n\n本书基于“无谓的一致可能是无聊的”这一理论，同时使用了这两种注释。\n\n### 大括号、体和块\n\n```c\n{\n\n...\n\n\
  }\n```\n\n在 列表 2.1 中，大括号界定了 `main()` 函数。通常，所有的 C 函数都使用大括号来标记函数体的开始和结束。它们的存在是强制的，所以不要漏掉它们。只有大括号（`{\
  \ }`）适用于此目的，圆括号 `( )` 和方括号 `[ ]` 不行。\n\n大括号还可以将函数内的语句聚合为一个块。如果你熟悉 Pascal、ADA、Modula-2\
  \ 或 Algol，你会发现大括号类似于这些语言中的 `begin` 和 `end`。\n\n### 声明\n\n```c\nint num;\n```\n\n\
  程序中的这一行被称为声明语句。声明语句是 C 最重要的特性之一。这个特定的示例声明了两个内容。首先，在函数的某处你有一个名为 `num` 的变量。其次，`int`\
  \ 将 `num` 宣告为整数——即一个没有小数点或小数部分的数字（`int` 是数据类型的示例）。编译器使用这些信息为 `num` 变量在内存中安排合适的存储空间。行尾的分号将该行识别为\
  \ C 语句或指令。分号是语句的一部分，而像在 Pascal 中那样仅仅是语句分隔符。\n\n单词 `int` 是 C 关键字，用于标识基础 C 数据类型之一。关键字是用于表达语言的单词，你不能将其用于其他用途。例如，你不能使用\
  \ `int` 作为函数名或变量名。然而，这些关键字限制不适用于语言之外，所以给猫或最喜欢的孩子命名为 `int` 是可以的（在某些地区，当地习惯或法律可能会使此选项失效）。\n\
  \n示例中的单词 `num` 是一个标识符——即你为变量、函数或其他实体选择的名称。\n\n\n\n\n通过 `C99` 和 `C11`，你可以定义任意长度的标识符名称，但编译器只需要考虑前\
  \ 63 个字符为有效字符。对于外部标识符（参见第 12 章，“存储类、链接与内存管理”），只需要识别 31 个字符。这与 C90 分别要求 31 个和 6 个字符相比有了大幅增加，而旧的\
  \ C 编译器通常只支持到最多 8 个字符。实际上，你可以使用超过最大限制的字符，但编译器并不要求关注额外的字符。这意味着什么？如果你有两个长度均为 63 个字符的标识符，且除一个字符外完全相同，编译器被要求识别它们是相互不同的。如果你有两个长度\
  \ 64 个字符的标识符，且除最后一个字符外完全相同，编译器可能会识别它们是不同的，也可能不会；标准并没有定义在这种情况下应该发生什么。\n\n你可以使用的字符包括小写字母、大写字母、数字和下划线（`_`）。第一个字符必须是字母或下划线。以下是一些示例：\n\
  \n![Image](img/036tab01.jpg)\n\n操作系统和 C 库经常使用以一个或两个下划线开头的标识符，例如 `_kcab`，因此你自己最好避免这种用法。以一个或两个下划线开头的标准标签（例如库标识符）是被保留的。这意味着虽然使用它们不是语法错误，但可能会导致命名冲突。\n\
  \nC 语言是**区分大小写**的，这意味着大写字母被认为与对应的小写字母不同。因此，`stars` 不同 `Stars` 以及 `STARS`。\n\n为了让\
  \ C 更加国际化，`C99` 和 `C11` 为通用字符名称（或 `UMC`）机制提供了一系列广泛可使用的字符。参考[章节 VII，“扩展字符支持”在附录 B\
  \ 中讨论了这一新增。这使得非英语字母字符变得可用。\n\n## 声明变量的四个好理由\n\n一些旧语言（如 `FORTRAN` 和 `BASIC` 的原始形式）允许你在不声明变量的情况下使用变量。那么为什么在\
  \ C 语言中不能采取这种随意的做法呢？这里是一些原因：\n\n![Image](img/squf.jpg) 将所有变量放在一个地方让读者更容易理解程序的意图。如果你给变量起了有意义的名字（例如用\
  \ `taxrate` 而不是 `r`），这一点尤为真实。如果名称不够用，请使用注释来解释变量代表的含义。以这种方式记录程序是良好编程的基本技术之一。\n\n\
  ![Image](img/squf.jpg) 思考需要声明哪些变量会促使你在着手编写程序之前做一些规划。程序启动需要哪些信息？我到底想让程序输出什么内容？表示数据的最佳方式是什么？\n\
  \n![Image](img/squf.jpg) 声明变量有助于防止编程中一种微妙且难以发现的 Bug —— 变量名拼写错误。例如，假设在某种缺少声明的语言中，你写了如下语句：\n\
  \n```\nRADIUS1 = 20.4;\n```\n\n在程序的其他地方你误写了：\n\n```\nCIRCUM = 6.28 * RADIUSl;\n\
  ```\n\n你无意中将数字 1 替换成了字母 `l`（小写 L）。另一种语言会创建一个名为 `RADIUSl` 的新变量，并使用它拥有的任何值（可能是零，也可能是垃圾值）。`CIRCUM`\
  \ 将被赋予错误的值，你可能花费大量时间来试图寻找原因。这在 C 语言中不会发生（除非你蠢到声明了两个如此相似的变量名），因为当未声明的 `RADIUSl` 出现时，编译器会报错。\n\
  \n![Image](img/squf.jpg) 如果你不声明变量，你的 C 程序将无法编译。如果前面的理由没有打动你，你应该认真考虑这一个。\n\n既然你需要声明变量，它们应该放在哪里呢？如前所述，`C99`\
  \ 之前的 C 语言要求声明必须放在块的开头。遵循这一做法的一个良好理由是将声明分组在一起，更容易看出程序在做什么。当然，散布声明也有充分的理由，正如 `C99`\
  \ 现在允许的那样。这种思想是在在你准备好给变量赋值时之前再声明它们。这使得更难忘记给它们赋值。在实际操作中，许多编译器尚未支持 `C99` 规则。\n\n###\
  \ 赋值\n\n```\nnum = 1;\n```\n\n下一行代码是一个赋值语句，这是 C 中的基本操作之一。这个特定的示例意味着“将值 `1` 赋值给变量\
  \ `num`”。之前的 `int num;` 行在计算机内存中为变量 `num` 留了空间，赋值语句在该位置存储了一个值。如果你愿意，以后可以给 `num`\
  \ 分配不同的值；这就是为什么 `num` 被称为变量。注意，赋值语句是从右向左赋值。此外，语句以分号结束，如图 2.2 所示。\n\n![Image](img/02fig02.jpg)\n\
  \n图 2.2 赋值语句是基本操作之一。\n\n### printf() 函数\n\n点击此处查看代码图像\n\n```\nprintf(\"I am a simple\
  \ \");\nprintf(\"computer.\\n\");\nprintf(\"My favorite number is \");\n```\n\n\
  这些行都使用了标准 C 函数 `printf()`。括号表示 `printf` 是一个函数名。括号内的内容是从 `main()` 函数传递给 `printf()`\
  \ 函数的信息。例如，第一行将字符串 `I am a simple` 传递给 `printf()` 函数。这种信息被称为参数，或者完整地称为实际参数（参见图 2.3）。（C\
  \ 使用*实际参数*和*形式参数*术语来区分传递函数的特定值和函数中持有该值的变量；第 5 章，“运算符、表达式和语句](#ch05.html_ch05)”对此详细讨论了这一点。）`printf()`\
  \ 函数如何处理这个参数？它查看双引号之间的任何内容并将其打印在屏幕上。\n\n![Image](img/02fig03.jpg)\n\n图 2.3 带有参数的\
  \ `printf()` 函数。\n\n第一行 `printf()` 代码是在 C 语言中调用或触发函数的示例。你只需要输入函数名称，并将所需的参数放在括号内。当程序到达这一行时，控制权交给命名的函数（在本例中为\
  \ `printf()`）。当函数完成其操作后，控制权将返回给原始（即调用者）函数——在本例中为 `main()`。\n\n\n\n\n\n那么下一行 `printf()`\
  \ 又是呢？引号中包含了 `\\n` 字符，但它们并没有被打印出来！这是怎么了？`\\n` 符号表示开始新行。`\\n` 组合（输入两个字符）代表一个名为`换行符`的单个字符。对于\
  \ `printf()` 来说，它的意思是“在左侧边界处开始新行”。换句话说，打印换行符的作用与按下普通键盘上的 Enter 键相同。为什么在输入 `printf()`\
  \ 参数时不直接使用 Enter 键呢？那会被解释为发送给编辑器的立即命令，而不是存储在源代码中的指令。换句话说，当你按下 Enter 键时，编辑器会结束当前正在工作的行并开始新的一。然而，换行符影响的是程序输出的显示方式。\n\
  \n换行符是 `escape sequence`（转义序列）的一个例子。转义序列用于表示难以输入或无法输入的字符。其他例子包括代表制表符的 `\\t` 和代表退格的\
  \ `\\b`。在每情况下，转义序列都以反杠字符 `\\` 开头。我们将在第 3 章“数据与 C](#ch03.html_ch03)”中重新回到这个主题。\n\n\
  嗯，这解释了为什么三个 `printf()` 语句只产生了两行：第一个打印指令中没有换行符，但第二个和第三个有。\n\n最后一行 `printf()` 引出了另一个异常：当该行被打印时，`%d`\
  \ 发生了什么？正如你记得的，该行的输出是：\n\n点击查看代码图像\n\n我最喜欢的数字是 1，因为它是第一个。\n\n啊！在打印行时，数字 `1` 替换了符号组\
  \ `%d`，而 `1` 是变量 `num` 的值。`%d` 是一个占位符，用于显示打印 `num` 的值。这一行与下面的 BASIC 语句相似：\n\n点击查看代码图像\n\
  \n```\n\n \"My favorite number is \"; num; \" because it is first.\"\n```\n\n实际上，C\
  \ 语言比这多做了一点工作。`%` 通知程序在该位置要打印一个变量，而 `d` 告诉它将变量打印为十进制（10 进制）整数。`printf()` 函数为打印变量的格式提供了多种选择，包括十六进制（16\
  \ 进制）整数和带有小数点的数字。事实上，`printf()` 中的 `f` 提醒人们这是一个 `formatting`（格式化）打印函数。每种类型的数据都有自己的格式说明符——随着书籍介绍新类型，它也会引入相应的说明符。\n\
  \n### 返回语句 (Return Statement)\n\n```\nreturn 0;\n```\n\n这个返回语句是程序的最后一条语句。`int main(void)`\
  \ 中的 `int` 表示 `main()` 函数应该返回一个整数。C 标准要求 `main()` 必须这样做。返回值的 C 函数通过返回语句来实现，该语句由关键字\
  \ `return`、紧随其后的返回值以及分号组成。如果你漏掉了 `main()` 的返回语句，程序在遇到闭合括号 `}` 时将返回 0。因此，你可以省略 `main()`\
  \ 结尾的返回语句。然而，你不能在其他函数中省略它，因此在 `main()` 中使用它更具一致性。此时，你可以将 `main()` 中的返回语句视为逻辑一致性要求的，但在某些操作系统（包括\
  \ Linux 和 Unix）中，它具有实际用途。第 11 章 将进一步讨论这个主题。\n\n### 简单程序的结构\n\n现在你已经看到了具体的例子，准备好学习关于\
  \ C 程序的通用规则了。一个 `program`（程序）由一个或多个函数组成，其中一个必须命名为 `main()`。`function`（函数）的描述由头部和体组成。`function\
  \ header`（函数头）包含函数名以及关于传递给函数和函数返回类型的信息。你可以通过括号来识别函数名，括号可以是空的。`body`（体）被括号 `{}` 包围，由一系列语句组成，每条语句都以分号结束（参见图\
  \ 2.4）。本章的示例包含一个`declaration statement`（声明语句），宣布所用变量名和类型。接着是一个 `assignment statement`（赋值语句），给变量赋值。再然后是三个\
  \ `print statements`（打印语句），每个都调用 `printf()` 函数。打印语句是 `function call statements`（函数调用语句）的示例。最后，`main()`\
  \ 以 `return statement` 结束。\n\n![Image](img/02fig04.jpg)\n\n图 2.4 函数包含头部和体。\n\n简而言之，一个简单的标准\
  \ C 程序应该使用以下格式：\n\n```c\n#include <stdio.h>\n\nint main(void)\n{\n   statements\n\
  \   return 0;\n}\n```\n\n（记住每条语句都包含一个结尾的分号。）\n\n### 关于提高程序可读性的提示\n\n提高程序的可读性是良好的编程习惯。可读的程序更容易理解，使得更容易纠错或修改。提高程序的可读性也有助于澄清你自己对程序功能的理解。\n\
  \n提高程序的可读性是良好的编程习惯。可读的程序更容易理解，这使得更容易纠错或修改。提高程序的可读性也有助于澄清你自己对程序功能的理解。\n\n你已经看到了两种提高可读性的技术：选择具有有意义的名字并使用注释。另一种技术涉及使用空行来分隔函数的概念部分。\n\
  \n\n\n\n第三，程序进行了计算。它利用计算机系统强大的计算能力将 2 乘以 6。在 C 语言中，与其他许多语言一样，`*` 是乘法符号。因此，该语句\n\n\
  ```\nfeet = 6 * fathoms;\n```\n\n意味着“查找变量 `fathoms` 的值，将其乘以 6，并将该计算结果赋值给变量 `feet`。”\n\
  \n## 打印多个值\n\n最后，程序对 `printf()` 使用了更高级的用法。如果你编译并运行该示例，输出应该如下所示：\n\n点击此处查看代码图片\n\n\
  2 荷兰寻等于 12 脚英尺！\n\n是的，我说的就是 12 脚英尺！\n\n这一次，代码在第一次使用 `printf()` 时进行了*两次*替换。引号中的第一个\
  \ `%d` 被引号内片段之后的列表中第一个变量（`feet`）的值替换，而第二个 `%d` 被列表中第二个变量（`fathoms`）的值替换。请注意，要打印的变量列表位于引用部分之后的语句末尾。还要注意，每个项目之间用逗号隔开。\n\
  \n第二次使用 `printf()` 说明所打印的值并不非得是一个变量；它只需要是某个东西，例如 `6 * fathoms`，只要它可以还原为相应类型的值即可。\n\
  \n这个程序的范围有限，但它可以构成一个将荷兰寻转换为脚英尺程序的核心。所需的是一种交互式为 `feet` 赋值额外值的方法；我们将在后面的章节中解释如何这样做。\n\
  \n## 顺便说——多个函数\n\n到目前为止，这些程序使用了标准的 `printf()` 函数。列表 2.3 向你展示了如何将你自己的函数（`main()`\
  \ 之外）纳入程序中。\n\n列表 2.3 two_func.c 程序\n\n点击此处查看代码图片\n\n* *\n\n```c\n//* two_func.c\
  \ -- 在一个文件中使用两个函数的程序 */\n#include <stdio.h>\n\nvoid butler(void);      /* ANSI/ISO\
  \ C 函数原型 */\n\nint main(void)\n{\n    printf(\"I will summon the butler function.\\\
  n\");\n    butler();\n    printf(\"Yes. Bring me some tea and writeable DVDs.\\\
  n\");\n    return 0;\n}\n\nvoid butler(void)      /* 函数定义开始 */\n{\n    printf(\"\
  You rang, sir?\\n\");\n}\n```\n\n输出如下：\n\n点击此处查看代码图片\n\nI will summon the butler\
  \ function.\n\nYou rang, sir?\n\nYes. Bring me some tea and writeable DVDs.\n\n\
  * *\n\n`butler()` 函数在程序中出现了三次。第一次出现于*原型*中，它告诉编译器将要使用的函数。第二次出现于 `main()` 中，形式为*函数调用*。最后，程序呈现了*函数定义*，它是该函数本身的源代码。让我们逐一查看这三个出现处的每一个。\n\
  \nC90 标准增加了原型，较旧的编译器可能无法识别它们。（稍后我们会告诉你在使用此类编译器时该怎么办。）原型向编译器声明了你正在使用某个特定函数，因此它被称为*函数声明*。它还规定了函数的属性。例如，`butler()`\
  \ 函数原型中的第一个 `void` 表示 `butler()` 没有返回值。（通常情况下，函数可以返回一个值给调用函数供使用，但 `butler()` 不会。）第二个\
  \ `void`——即 `butler(void)` 中的——表示 `butler()` 函数没有参数。因此，当编译器到达 `main()` 中使用 `butler()`\
  \ 的位置时，它可以检查 `butler()` 是否使用正确。注意，`void` 表示“空”，而不是“无效”。\n\n旧版本的 C 语言支持更有限的函数声明形式，你只需要指定返回类型但省略对参数的描述：\n\
  \n```c\nvoid butler();\n```\n\n旧版本的 C 代码使用像上述函数声明而不是函数原型。C90、C99 和 C11 标准识别这种旧形式，但指出它将逐渐被淘汰，因此不要使用它。如果你继承了一些遗留的\
  \ C 代码，你可能希望将旧式声明转换为原型。本书的后几章节将重新回到原型、函数声明和返回值。\n\n接下来，你只需通过给出函数名（包括括号）即可在 `main()`\
  \ 中调用 `butler()`。当 `butler()` 完成工作后，程序将移动到 `main()` 中的下一条语句。\n\n最后，函数 `butler()`\
  \ 的定义方式与 `main()` 相同，包含一个函数头部和括在括号中的函数体。头部重复了原型中给出的信息：`butler()` 没有参数且没有返回值。对于旧编译器，请省略第二个\
  \ `void`。\n\n需要注意的一点是，是 `main()` 中调用 `butler()` 位置——而不是 `butler()` 定义——决定了 `butler()`\
  \ 何时执行。C 标准建议为你使用的所有函数提供原型。`stdio.h` 文件负责这项任务。例如，`stdio` 有 `printf()` 的原型。\n\n##\
  \ 引入调试\n\n既然你已经编写简单的 C 程序，你就会犯错。程序错误通常被称为*bug*（漏洞），而发现并修复错误被称为*调试*。列表 2.4 展示了一个带有错误的程序。看看你能发现多少个。\n\
  \n列表 2.4 nogood.c 程序\n\n点击此处查看代码图片\n\n* *\n\n```c\n/* nogood.c -- 一个带有错误的程序 */\n\
  #include <stdio.h>\n\nint main(void)\n(\n    int n, n2, n3;\n    /* 这个程序有几个错误\n\
  \    n = 5;\n    n2 = n * n;\n    n3 = n2 * n2;\n    printf(\"n = %d, n squared\
  \ = %d, n cubed = %d\\n\", n, n2, n3)\n    return 0;\n)\n```\n\n* *\n\n### 语法错误\n\
  \n列表 2.4 包含了几个语法错误。当你不遵循 C 的规则时，就会产生*语法错误*。这类似于英语中的语法错误。例如，考虑以下句子：*Bugs frustrate\
  \ be can*。这句话使用了有效的单词，但不符合词序规则，而且用词本身也不太对。\n\n那么 `nogood.c` 有哪些语法错误？首先，它使用括号而不是大括号来标记函数体——它在错误的地方使用了有效的\
  \ C 符号。其次，声明应该是\n\n```c\nint n, n2, n3;\n```\n\n或者\n\n```c\nint n;\nint n2;\nint\
  \ n3;\n```\n\n接下来，示例遗漏了完成注释所需的 `*/` 符号对。（或者，你可以将 `/*` 替换为新的 `//` 形式。）最后，它遗漏了应该结束\
  \ `printf()` 语句的强制分号。\n\n你如何检测语法错误？首先，在编译之前，你可以查看源代码，看看自己能发现任何明显的问题。其次，你可以检查编译器发现的错误，因为编译器的工作之一就是检测语法错误。当你尝试编译此程序时，编译器会报告它发现的所有错误，识别每个错误的性质和位置。\n\
  \n\n\n然而，编译器可能会产生困惑。一个位置的真实语法错误可能会导致编译器误认为它发现了其他错误。例如，由于示例代码中没有正确声明 `n2` 和 `n3`，每当使用这些变量时，编译器都可能认为它发现了进一步的错误。事实上，如果你无法理解所有报告的错误，与其尝试一次性修正所有报告的错误，你应该只修正第一个一两个错误，然后重新编译；其他一些错误可能会消失。继续这种方法，直到程序运行正常为止。另一种常见的编译器技巧是推迟一行报告错误。例如，编译器在尝试编译下一行之前，可能无法推断出缺少分号。所以，如果编译器在某行已经有分号的行上抱怨缺少分号，请检查它的上一行。\n\
  \n### 语义错误\n\n语义错误是意义上的错误。例如，考虑以下句子：*蔑视的衍生物在绿色地歌唱*。这个句子的语法是正确的，因为形容词、名词、动词和副词的位置都是的，但这个句子没有任何意义。在\
  \ C 中，当你正确遵循了 C 的规则但达到了错误的目的时，你就犯了语义错误。示例中就有这样一个错误：\n\n```\nn3 = n2 * n2;\n```\n\
  \n在这里，`n3` 应该代表 `n` 的立方，但代码将其设置为了 `n` 的四次方。\n\n编译器不检测语义错误，因为它们没有违反 C 规则。编译器没有办法洞察你的真实意图。寻找这类错误的工作就留给你你自己了。一种方法是将程序的实际行为与你预期的行为进行比较。例如，假设你修复了示例中的语法错误，现在它读起来如列表\
  \ 2.5 所示。\n\n列表 2.5 `stillbad.c` 程序\n\n点击此处查看代码图像\n\n```\n/* stillbad.c -- 一个修复了其语法错误的程序\
  \ */\n\n#include <stdio.h>\n\nint main(void)\n{\n    int n, n2, n3;\n/* 此程序有一个语义错误\
  \ */\n    n = 5;\n    n2 = n * n;\n    n3 = n2 * n2;\n    printf(\"n = %d, n squared\
  \ = %d, n cubed = %d\\n\", n, n2, n3);\n    return 0;\n}\n```\n\n它的输出如下：\n\n点击此处查看代码图像\n\
  \nn = 5, n squared = 25, n cubed = 625\n\n如果你对立方运算敏感，你会发现 625 是错误的值。下一阶段是追踪你是如何这个答案的。对于这个示例，你可能可以通过肉眼发现错误。但通常情况下，你需要采取更系统化的方法。一种方法是假装你是计算机，并逐个遵循程序的步骤。让我们现在尝试这种方法。\n\
  \n程序体从声明三个变量开始：`n`、`n2` 和 `n3`。你可以通过画三个框并用变量名标记它们来模拟这种情况情况（参见图 2.6）。接下来，程序将 `5`\
  \ 赋值给 `n`。通过向 `n` 框写入 `5` 来模拟这一过程。接着，程序将 `n` 乘以 `n` 并将结果赋值给 `n2`，所以看 `n` 框，看到值为\
  \ `5`，将 `5` 乘以 `5` 得到 `25`，并将 `25` 放在框 `n2` 中。为了复制下一个 C 语句（`n3 = n2 * n2;`），查看 `n2`\
  \ 并找到 `25`。你将 `25` 乘以 `25`，得到 `625`，并将其放入 `n3`。啊！你是在计算 `n2` 的平方，而不是将其乘以 `n`。\n\n\
  ![图像](img/02fig06.jpg)\n\n图 2.6 追踪程序。\n\n嗯，也许这个步骤对于这个示例来说是大材小用，但以这种方式逐步执行程序通常是观察发生情况的最佳方法。\n\
  \n### 程序状态\n\n通过手动逐步追踪程序并记录每个变量，你就在监控程序状态。*程序状态*简单来说就是程序执行过程中特定点所有变量的值的集合。它是当前计算状态的快照。\n\
  \n我们刚刚讨论了追踪状态的一种方法：亲自逐步执行程序。在一个包含例如 10,000 次迭代的程序中，你可能觉得无法完成这项任务。尽管如此，你可以运行几次迭代，看看你的程序是否按照你的预期执行。然而，始终存在一种可能性，你会按照你预期执行的方式执行步骤，而不是按照你实际编写的方式执行，所以要尽可能忠于实际代码。\n\
  \n定位语义问题的另一种方法是在程序中到处添加额外的 `printf()` 语句，以监控程序关键点处选定变量的值。观察值的变化可以阐明发生了什么。当你对程序的运行结果满意后，可以删除这些额外的语句。\n\
  \n检查程序状态的第三种方法是使用调试器。*调试器*是一种允许你逐步执行并检查变量的程序。调试器有不同的使用水平和复杂程度。更高级的调试器可以显示正在执行的代码行。如果你的编译器带有调试器，请花时间学习如何使用。\n\
  \n### 关键字与保留标识符\n\n关键字是 C 的词汇。因为它们对 C 是特殊的，你不能将它们作为标识符，例如。许多关键字指定了各种类型，如 `int`。其他关键字如\
  \ `if` 则用于控制语句执行的顺序。在下面的关键字列表中，粗体表示由 C90 标准添加的关键字，斜体表示由 C99 标准添加的关键字，粗体斜体表示由 C11\
  \ 标准添加的关键字。\n\n![图像](img/049tab01.jpg)\n\n如果你尝试使用关键字，例如变量名，编译器会将其视为语法错误。还有其他标识符被称为*保留标识符*，你不应该使用它们。它们不会引起语法错误，因为语言已经使用了它们或保留了使用它们的权利，所以如果你用这些标识符表示其他含义，可能会引起问题。保留标识符包括以下划线字符开头的以及标准库函数的名称，如\
  \ `printf()`。\n\n### 核心概念\n\n计算机编程是一项挑战。它需要抽象概念思维和对细节的仔细关注。你会发现编译器强制要求关注细节。当你和朋友交流时，你可能会用错单词，犯几个语法错误，也许留下一些残句，朋友仍然能理解你想说什么。但编译器不会做这种让步；对它来说，几乎就是错误。\n\
  \n编译器不会帮助你解决这些概念性问题，因此本书将通过概述每章的核心概念来填补这一空白。\n\n对于本章，你的目标应该是理解 C 程序。你可以将程序看作是你准备的关于你希望计算机如何的行为描述。编译器处理将你的描述转换为底层机器语言的极其详细的工作。（作为一个衡量编译器工作量的标准，它可以从你的\
  \ 1KB 源代码文件创建一个 60KB 的可执行文件；表示一个简单的 C 程序也需要大量的机器语言。）\n\n\n\n\n\n编译器期望以特定的格式接收指令，我们在本章中详细描述了这种格式。作为程序员，你的工作是在编译器（在\
  \ C 标准指导下）能够成功处理的框架内，表达你对程序行为行为的想法。\n\n### 总结\n\n一个 C 程序由一个或多个 C 函数组成。每个 C 程序都必须包含一个名为\
  \ `main()` 的函数，因为它是程序启动时调用的函数。一个简单的函数由函数头、紧随其后的左大括号、构成函数体的语句、以及结束性的右大括号（或 `closing`\
  \ 大括号）组成。\n\n每个 C 语句都是给计算机的指令，并以分号结尾标记。声明语句为变量创建一个名称，并标识要存储在变量中的数据类型。变量名是标识符的一个示例。赋值语句为变量（更通地说，为存储区域）分配一个值。函数调用语句会导致执行命名的函数。当调用的函数执行完毕，程序将返回到函数调用后的下一个语句。\n\
  \n`printf()` 函数可以用于打印字符串和变量的值。\n\n语言的`syntax`（语法）是规定该语言有效语句组合方式的规则集。语句的`semantics`（语义）是其含义。编译器帮助你检测语法错误，但语义错误只有在程序编译后才会出现在程序的行为中。检测语义错误可能涉及跟踪每个程序步骤之后的程序状态——即所有变量的值。\n\
  \n最后，`keywords`（关键字）是 C 语言的词汇。\n\n### 复习题\n\n你可以在附录 A 中的“复习题答案”找到复习题的答案。\n\n**1.**\
