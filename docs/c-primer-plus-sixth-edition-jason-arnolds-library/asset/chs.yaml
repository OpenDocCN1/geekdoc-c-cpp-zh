  \n![Image](img/510tab01.jpg)\n\n此外，如果没有命令行参数，让程序的行为像使用了 `–p` 参数一样。\n\n## 12. 存储类、链接与内存管理\n\
  \n你将在本章中学习到以下内容：\n\n![Image](img/squf.jpg) 关键字：\n\n点击此处查看代码图片\n\n`auto`, `extern`,\
  \ `static`, `register`, `const`, `volatile`, `restricted`, `_Thread_local`, `_Atomic`\n\
  \n![Image](img/squf.jpg) 函数：\n\n点击此处查看代码图片\n\n`rand()`, `srand()`, `time()`, `malloc()`,\
  \ `calloc()`, `free()`\n\n![Image](img/squf.jpg) C 如何允许你确定变量的作用范围（可见范围）和变量的生命周期（其存在多长时间）\n\
  \n![Image](img/squf.jpg) 设计更复杂的程序\n\nC 语言的优势之一是它允许你控制程序的细节。C 的内存管理系统体现了这种控制，它让你决定哪些函数知道哪些变量，以及一个变量在程序中持续多久。使用内存存储是程序设计的另一个元素。\n\
  \n## 存储类\n\nC 语言提供了在内存中存储数据的多种模型，或*存储类*（storage classes）。为了理解这些选项，先回顾几个概念和术语会有帮助。\n\
  \n书中的每个编程示例都在内存中存储数据。这涉及硬件方面——每个存储的值都占用物理内存。C 语言文献使用*对象*（object）一词称为此类内存块。一个对象可以包含一个或多个值。一个对象可能还没有实际的存储值，但它将具有足够的大小来存放适当的值。（*面向对象编程*短语中的*对象*一词具有更深层次的含义，指类对象，其定义包含了数据以及对数据进行允许的操作；C\
  \ 语言并不是一种面向对象的编程语言。）\n\n还存在软件方面——程序需要一种访问对象的方法。例如，可以通过声明变量来实现：\n\n```\nint entity\
  \ = 3;\n```\n\n此声明创建了一个名为 `entity` 的*标识符*（identifier）。标识符是一个名称，在本例中，该名称可以用来指定特定对象的内容。标识符满足第\
  \ 2 章“介绍 C 语言”中讨论的变量命名规范。在本例中，标识符 `entity` 是软件（C 程序）指定存储在硬件内存中的对象的方式。此声明还为对象提供了了要存储的值。\n\
  \n变量名并不是指定对象的唯一方法。例如，考虑以下声明：\n\n```\nint * pt = &entity;\nint ranks[10];\n```\n\n\
  在第一种情况下，`pt` 是一个标识符。它指定一个持有地址的对象。接下来，表达式 `*pt` 不是标识符，因为它不是一个名称。然而，它确实指定了一个对象，在本例中，与\
  \ `entity` 指定的是同一个对象。通常情况下，正如你可能从第 3 章“数据与 C 语言”中所回的那样，指定对象的表达式被称为左值（lvalue）。因此，`entity`\
  \ 是一个作为左值的标识符，而 `*pt` 是一个作为左值的表达式。同理，表达式 `ranks + 2 * entity` 既不是标识符（不是名称），也不是左值（没有指定某个内存位置的内容）。但表达式\
  \ `*(ranks + 2 * entity)` 是一个左值，因为它确实指定了特定内存位置的值，即 `ranks` 数组的第七个元素。顺便说一下，`ranks`\
  \ 的声明创建了一个可以容十个 `int` 的对象，数组的每个成员也是一个对象。\n\n如果像所有这些示例一样，你可以使用左值来更改对象中的值，那么它就是*可修改左值*（modifiable\
  \ lvalue）。现在考虑此声明：\n\n点击此处查看代码图片\n\n```\nconst char * pc = \"Behold a string literal!\"\
  ;\n```\n\n这会导致程序将字符串字面量的内容存储在内存中，而该字符值数组就是一个对象。数组中的每个字符也是一个对象。该声明还创建了一个具有标识符 `pc`\
  \ 并持有该字符串地址的对象。标识符 `pc` 是一个可修改左值，因为它可以被重置指向不同的字符串。`const` 防止你修改所指向字符串的内容，但不能阻止你改变指向的字符串。因此，`*pc`\
  \ 指定持有 `'B'` 字符的数据对象是一个左值，但不是可修改左值。同样，字符串字面量本身因为它指定了持有字符字符串的对象，是一个左值，但不是可修改的。\n\n\
  你可以根据对象的*存储期*（storage duration）来描述对象，即它在内存中停留多长时间。你可以通过用于访问对象的标识符的*作用范围*（scope）和*链接*（linkage），这两者共同指示了程序的哪些部分可以使用它。不同的存储类提供了作用范围、链接和存储期的不同组合。你可以拥有可以在可以在多个源文件之间共享的标识符、可以在特定文件中的任何函数中使用的标识符、只能在特定函数内部使用的标识符，甚至可以是仅在函数子部分内使用的标识符。你可以拥有在整个程序运行期间都存在的对象，也可以只在包含它们的函数执行期间才存在的对象。通过并发编程，你可以拥有在特定线程持续时间内存在的对象。你还可以通过函数调用显式地分配和释放内存来存储数据。\n\
  \n接下来，让我们研究*作用范围*、*链接*和*存储期*的含义。之后，我们将回到特定的存储类。\n\n#### 作用范围\n\n\n\n\n\n`Scope`\
  \ 描述了程序可以访问标识符的区域或区域。C 变量具有以下作用域之一：块作用域（block scope）、函数作用域（function scope）、函数原型作用域（function\
  \ prototype scope）或文件作用域（file scope）。到为止的程序示例几乎对变量使用了块作用域。你可能记得，`block` 是包含在左括号和匹配的右括号之间的代码区域。例如，整个函数体就是一个块。函数内的任何复合语句也是块。在块内部定义的变量具有`block\
  \ scope`，它从定义定义点一直到包含该定义的块结束都是可见的。此外，形式函数参数虽然出现在函数左括号之前，但它们具有块作用域，并属于包含函数体的块。因此，我们到目前为止使用的局部变量（包括形式函数参数）都具有块作用域。因此，以下代码中的变量\
  \ `cleo` 和 `patrick` 都具有延伸到右括号的块作用域：\n\n```c\ndouble blocky(double cleo)\n{\n  \
  \  double patrick = 0.0;\n    ...\n    return patrick;\n}\n```\n\n在内部块中声明的变量其作用域仅限于该块：\n\
  \n点击此处查看代码图片\n\n```c\ndouble blocky(double cleo)\n{\n    double patrick = 0.0;\n\
  \    int i;\n    for (i = 0; i < 10; i++)\n    {\n        double q = cleo * i; //\
  \ q 的作用域开始\n        ...\n        patrick *= q;\n    }                      // q\
  \ 的作用域结束\n    ...\n    return patrick;\n}\n```\n\n在这个例中中，`q` 的作用域被限于内部块，只有该块内的代码可以访问\
  \ `q`。\n\n传统上，具有块作用域的变量必须在块的开始声明。C99 放宽了这个规则，允许你在块的任何地方声明变量。一种新的可能性是在 `for` 循环的控制部分。也就是说，你现在可以这样做：\n\
  \n点击此处查看代码图片\n\n```c\nfor (int i = 0; i < 10; i++)\n    printf(\"A C99 feature:\
  \ i = %d\", i);\n```\n\n作为这一新功能的一部分，C99 将块的概念扩展到包含由 `for` 循环、`while` 循环、`do while`\
  \ 循环或 `if` 语句控制的代码，即使没有括号。所以在之前的 `for` 循环中，变量 `i` 被视为 `for` 循环块的一部分。因此，它的作用域被限于\
  \ `for` 循环。执行离开 `for` 循环后，程序将不再看到 `i`。\n\n`function scope` 仅适用于用于 `goto` 语句的标签。这意味着即使标签第一次出现在函数的内部块中，它的作用域也延伸到整个函数。如果你可以在两个独立的块中使用相同的标签，将会产生混乱，而标签的作用作用域防止了这种情况发生。\n\
  \n`function prototype scope` 适用于函数原型中的变量名，如下所示：\n\n点击此处查看代码图片\n\n```c\nint mighty(int\
  \ mouse, double large);\n```\n\n函数原型作用域从变量定义点到原型声明的结束。这意味着编译器在处理函数原型参数时，关心的只有类型；你使用的名称（如果有的话）通常并不重要，而且它们不需要与你在函数定义中使用的名称匹配。名称稍微重要的一种情况是使用变长数组（VLA）参数时：\n\
  \n点击此处查看代码图片\n\n```c\nvoid use_a_VLA(int n, int m, ar[n][m]);\n```\n\n如果你在括号中使用名称，它们必须是原型中早早声明的名称。\n\
  \n定义在任何函数之外的变量具有`file scope`。具有文件作用域的变量从其定义点一直到包含该定义的文件结束都是可见的。看这个例子：\n\n点击此处查看代码图片\n\
  \n```c\n#include <stdio.h>\n\nint units = 0;          /* 一个具有文件作用域的变量 */\nvoid critic(void);\n\
  \nint main(void)\n{\n    ...\n}\n\nvoid critic(void)\n{\n    ...\n}\n```\n\n在这里，变量\
  \ `units` 具有文件作用域，它可以在 `main()` 和 `critic()` 中使用。注意，对于文件作用域变量，关键字 `static` 表示的是链接类型，而不是存储期。\n\
  \n\n\n\n线程存储持续期在并发编程中发挥作用，在并发编程中，程序的执行可以被分为多个线程。具有线程存储持续期的对象从声明一直存在到线程终止。当一个本该创建文件作用域对象的声明被关键字\
  \ `_Thread_local` 修饰时，该对象就会被创建。当使用此类型说明符声明变量时，每个线程都会获得该变量的私有拷贝。\n\n块作用域的变量通常具有自动存储持续期。当程序进入定义这些变量的块时，会为它们分配内存，当退出块时，内存会被释放。这种思想是，自动变量使用的内存是一个可以重复利用的工作区或临时草稿纸。例如，在函数调用结束后，它用于存储变量的内存可以被用于存放下一个调用的函数的变量。\n\
  \n变长数组提供了一个轻微的例外，它们从声明点开始存在到块的结束，而不是从块的开始到结束。\n\n我们目前为止使用的局部变量都属于自动类。例如，在下面的代码中，变量\
  \ `number` 和 `index` 每次调用 `bore()` 函数时都会产生，并在每次函数完成时消失：\n\n点击此处查看代码图像\n\n```c\n\
  void bore(int number)\n{\n    int index;\n    for (index = 0; index < number; index++)\n\
  \        puts(\"They don't make them the way they used to.\\n\");\n    return 0;\n\
  }\n```\n\n然而，变量可能具有块作用域但静态存储持续期。要创建这样的变量，可以在块内部声明它，并在声明中添加 `static` 关键字：\n\n```c\n\
  void more(int number)\n{\n    int index;\n    static int ct = 0;\n    ...\n    return\
  \ 0;\n}\n```\n\n在这里，变量 `ct` 存储在静态内存中；它从程序加载一直存在到程序终止。但它的作用域被限制在 `more()` 函数块内。只有当函数执行时，程序才能使用\
  \ `ct` 来访问它所指向的对象。（然而，可以通过允许函数向其他函数提供存储的地址，例如通过指针参数或返回值，来允许间接访问。）\n\nC 使用作用域、链接和存储持续期来为变量定义了几种存储方案。本书没有涵盖并发编程，所以我们不会深入介绍这方面。我们将在本章后面讨论分配存储。这留下了五种存储类：自动、寄存器、块作用域静态、外部链接静态和内部链接静态。表\
  \ 12.1 列出了这些组合。现在既然我们已经涵盖了作用域、链接和存储持续期，就可以更详细地讨论这些存储类了。\n\n![图像](img/12tab01.jpg)\n\
  \n表 12.1 五种存储类\n\n## 自动变量\n\n属于自动存储类的变量具有自动存储持续期、块作用域且没有链接。默认情况下，任何在块或函数头中声明的变量都属于自动存储类。然而，你可以通过显式使用关键字\
  \ `auto` 来让你的意图完全明确，如下所示：\n\n```c\nint main(void)\n{\n    auto int plox;\n```\n\n\
  例如，你这样做是为了记录你正有意地覆盖一个外部变量的定义，或者说明不将变量更改另一种存储类是重要的。`auto` 关键字被称为*存储类说明符*。C++ 对 `auto`\
  \ 关键字进行了重新利用，用途完全不同，因此简单地不使用 `auto` 作为存储类说明符对于 C/C++ 兼容性更好。\n\n块作用域和无链接意味着只有定义该变量的块才能通过名称访问该变量。（当然，可以使用参数将变量的值和地址通信给另一个函数，但那是间接知识。）另一个函数可以使用相同名称的变量，但它将是一个存储在不同内存位置的独立变量。\n\
  \n记住，自动存储持续期意味着变量在程序进入包含变量声明的块时产生。当程序退出该块时，自动变量就会消失。它的内存位置现在可以被用于其他地方，尽管这不一定如此。\n\
  \n让我们更仔细地观察嵌套块。变量只对声明它的块以及该块内部的任何块是知的：\n\n点击此处查看代码图像\n\n```c\nint loop(int n)\n\
  {\n    int m;          // m 在作用域内\n    scanf(\"%d\", &m);\n    {\n        int i;\
  \  // m 和 i 都在作用域内\n        for (i = m; i < n; i++)\n            puts(\"i is local\
  \ to a sub-block\\n\");\n    }\n    return m;      // m 在作用域内，i 消失\n}\n```\n\n在这段代码中，`i`\
  \ 只在内部大括号内可见。如果你尝试在内部块之前之后使用它，将得到编译器错误。通常，在设计程序时不会使用此功能。然而，如果一个变量在其他地方都不被使用，那么在子块中定义它是是有用的。这样，你可以在使用变量的地方附近记录变量的含义。此外，当变量不再被需要时，它不会闲置并占用内存。变量\
  \ `n` 和 `m` 定义在函数头和外部块中，它们在整个函数的作用域内，并持续到函数终止。\n\n如果你在内部块中声明了一个与外部块同名的变量会怎样？那么块内部的名称会隐藏外部定义。然而，当执行退出内部块时，外部变量会恢复作用域。表\
  \ 12.1 阐了这些点以及更多。\n\n```c\n#include <stdio.h>\n\n// hiding.c -- 块中的变量\nint main()\n\
  {\n    int x = 30; // 外部块\n    printf(\"outer block: %d\\n\", x);\n    {\n     \
  \   int x = 77; // 内部块隐藏了外部 x\n        printf(\"inner block: %d\\n\", x);\n    }\n\
  \    printf(\"outer block: %d\\n\", x);\n    return 0;\n}\n```\n\n* * *\n\n这是输出：\n\
  \n点击此处查看代码图像\n\nouter block: 30 at 0x7fff5ff8c8\ninner block: 77 at 0x7fff5ff8c4\n\
  outer block: 30 at 0x7fff5ff8c8\nx in while loop: 101 at 0x7fff5ff8c0\nx in while\
  \ loop: 101 at 0x7fff5ff8c0\nx in while loop: 101 at 0x7fff5ff8c0\nouter block:\
  \ 34 at 0x7fff5ff8c8\n\n程序中最引入胜的部分可能是 `while` 循环。`while` 循环测试原始的 `x`：\n\n```c\n\
  while(x++ < 33)\n```\n\n\n\n然而，在循环内部，程序看到了第三个 `x` 变量，它是直接定义在 `while` 循环块内部的。因此，当代码在循环体中使用\
  \ `x++` 时，是新的 `x` 被递增到 `101` 并显示。当每个循环周期完成后，这个新的 `x` 就会消失。然后循环测试条件会使用并递增原始的 `x`，再次进入循环块，然后新的\
  \ `x` 再次被创建。在这个示例中，该 `x` 被创建和销毁了三次。请注意，为了结束循环，必须在测试条件中递增 `x`，因为在循环体中递增 `x` 修改的是与测试条件使用的不同的\
  \ `x`。\n\n这个特定的编译器没有为 `while` 版本的 `x` 复用内部块的 `x` 内存位置，但某些编译器会这样做。\n\n这个示例的意图并不是鼓励你编写这样的代码。相反，是为了说明在块内部定义变量时会发生什么。（考虑到\
  \ C 命名规则提供的各种可用名称，想出除 `x` 以外的名字应该并不难。）\n\n### 不带括号的块\n\n之前提到的 C99 特性是，作为循环或 `if`\
  \ 语句部分的语句即使没有使用括号（即 `{ }`），也算作一个块。更完整地说，整个循环是包含它的块的子块，而循环体是整个循环块的子块。同样，`if` 语句是一个块，其相关的子语句是\
  \ `if` 语句的子块。这些规则影响了你可以在哪里声明变量以及该变量的作用范围。列表 12.2 显示了这在 `for` 循环中是如何工作的。\n\n列表 12.2\
  \ forc99.c 程序\n\n点击此处查看代码图像\n\n* * *\n\n```c\n// forc99.c -- new C99 block rules\n\
  \n#include <stdio.h>\n\nint main()\n{\n    int n = 8;\n    printf(\"   Initially,\
  \ n = %d at %p\\n\", n, &n);\n    for (int n = 1; n < 3; n++)\n        printf(\"\
  \      loop 1: n = %d at %p\\n\", n, &n);\n    printf(\"After loop 1, n = %d at\
  \ %p\\n\", n, &n);\n    for (int n = 1; n < 3; n++)\n    {\n        printf(\" loop\
  \ 2 index n = %d at %p\\n\", n, &n);\n        int n = 6;\n        printf(\"    \
  \  loop 2: n = %d at %p\\n\", n, &n);\n        n++;\n    }\n    printf(\"After loop\
  \ 2, n = %d at %p\\n\", n, &n);\n    return 0;\n}\n```\n\n* * *\n\n以下是输出，假设编译器支持这种现代\
  \ C 特性：\n\n点击此处查看代码图像\n\n```\n    Initially, n = 8 at 0x7fff5fbff8c8\n      loop\
  \ 1: n = 1 at 0x7fff5fbff8c4\n      loop 1: n = 2 at 0x7fff5fbff8c4\nAfter loop\
  \ 1, n = 8 at 0x7fff5fbff8c8\n loop 2 index n = 1 at 0x7fff5fbff8c0\n      loop\
  \ 2: n = 6 at 0x7fff5fbff8bc\n loop 2 index n = 2 at 0x7fff5fbff8c0\n      loop\
  \ 2: n = 6 at 0x7fff5fbff8bc\nAfter loop 2, n = 8 at 0x7fff5fbff8c8\n```\n\n* *\
  \ *\n\n注意：C99 和 C11 的支持\n\n某些编译器可能不支持这些 C99/C11 作用域规则。（此时，Microsoft Visual Studio\
  \ 2012 就是其中一个编译器。）其他编译器可能提供激活这些规则的选项。例如，在本文写作时，GCC 默认支持许多 C99 特性，但需要使用 `–std=c99`\
  \ 选项来激活所使用的特性。\n\n\n\n静态变量 `stay` 记住了它的值被增加了 1，但 `fade` 变量每次都会重新开始。这指出了初始化上的区别：`fade`\
  \ 在每次调用 `trystat()` 时都会被初始化，而 `stay` 仅在 `trystat()` 编译时初始化一次。如果你没有显式地将其初始化为其他值，静态变量将初始化为零。\n\
  \n这两个声明看起来相似：\n\n```c\nint fade = 1;\nstatic int stay = 1;\n```\n\n然而，第一条语句实际上是\
  \ `trystat()` 函数的一部分，并在每次调用该函数时执行。这是一个运行时操作。第二条语句实际上并不属于 `trystat()` 函数的一部分。如果你使用调试器单步执行程序，你会发现程序似乎跳过了那一步。这是因为静态变量和外部变量在程序加载到内存后就已经就位了。将语句放置在\
  \ `trystat()` 函数中是告诉编译器，只有 `trystat()` 函数允许看到该变量；它不是一条在运行期间执行的语句。\n\n你不能对函数参数使用\
  \ `static`：\n\n点击此处查看代码图像\n\n```c\nint wontwork(static int flu);   // 不允许\n```\n\
  \n具有块作用域的静态变量的另一个术是“局部静态变量”。此外，如果你阅读一些旧的 C 语言文献，你会发现这种存储类被称为“内部静态存储类”（`internal\
  \ static storage class`）。然而，`internal` 一词用于表示函数内部，而不是内部链接。\n\n### 具有外部链接的静态变量\n\n\
  具有外部链接的静态变量具有文件作用域、外部链接和静态存储持续时间。这类类有时被称为“外部存储类”（`external storage class`），这种类型的变量被称为“外部变量”。你通过在任何函数之外放置定义声明来创建一个外部变量。作为文档说明的一项，外部变量还可以通过\
  \ `extern` 关键字在使用它的函数内部进行额外声明。如果某个特定的外部变量在一个源代码文件中定义并在第二个源文件中使用，则在第二个文件中使用 `extern`\
  \ 声明该变量是强制性的。声明如下：\n\n点击此处查看代码图像\n\n```c\nint Errupt;               /* 外部定义的变量 */\n\
  double Up[100];          /* 外部定义的数组 */\nextern char Coal;       /* 强制声明，如果\n   \
  \                      /* Coal 在另一个文件中定义 */\n\nvoid next(void);\n\nint main(void)\n\
  {\n  extern int Errupt;  /* 可选声明 */\n  extern double Up[]; /* 可选声明 */\n  ...\n}\n\
  \nvoid next(void)\n{\n  ...\n}\n```\n\n注意，你不需要为 `double Up` 的可选声明提供数组大小。这是因为原始声明已经提供了该信息。`main()`\
  \ 内部的 `extern` 声明组可以完全省略，因为外部变量具有文件作用域，所以它们从声明点到文件结束都是已知的。然而，它们确实起记录你让 `main()`\
  \ 使用这些变量意图的作用。\n\n如果在函数内部的声明中仅省略 `extern`，则会设置一个自动变量。也就是说，将\n\n```c\nextern int\
  \ Errupt;\n```\n\n替换为\n\n```c\nint Errupt;\n```\n\n在 `main()` 中会导致编译器创建一个名为 `Errupt`\
  \ 的自动变量。它将是一个独立的局部变量，与原始的 `Errupt` 不同。局部变量在程序执行 `main()` 期间处于作用域内，但外部的 `Errupt`\
  \ 在同一文件的其他函数（如 `next()`）中处于作用域内。简而言之，块作用域内的变量在程序执行块中的语句时，“隐藏”文件作用域内同名的变量。如果由于某种极不利的原因，你实际上需要使用与全局变量同名的局部变量，你可能选择在局部声明中使用\
  \ `auto` 存储限定符来记录你的选择。\n\n外部变量具有静态存储持续时间。因此，无论程序是在执行 `main()`、`next()` 还是其他函数，数组\
  \ `Up` 都会维持其存在和值。\n\n以下三个示例展示了外部变量和自动变量的四种可能组合。示例 1 包含一个外部变量：`Hocus`。`main()` 和\
  \ `magic()` 都是已知的。\n\n点击此处查看代码图像\n\n```c\n/* 示例 1 */\nint Hocus;\nint magic();\n\
  \nint main(void)\n{\n    extern int Hocus;  // Hocus 声明为外部\n    ...\n}\n\nint magic()\n\
  {\n    extern int Hocus;\n    ...\n}\n```\n\n示例 2 有一个外部变量 `Hocus`，两个函数都已知它。这一次，`magic()`\
  \ 默认知道它。\n\n点击此处查看代码图像\n\n```c\n/* 示例 2 */\nint Hocus;\nint magic();\n\nint main(void)\n\
  {\n    // 声明了 Hocus\n    ...\n}\n\nint magic()\n{\n    extern int Hocus; // 与上述相同的\
  \ Hocus\n    ...\n}\n```\n\n在示例 3 中，了四个独立的变量。`main()` 中的 `Hocus` 变量默认是自动的。`magic()`\
  \ 中的 `Hocus` 变量是自动的且仅对 `magic()` 可知。外部的 `Pocus` 对 `main()` 可知但对 `magic()` 不可见，因为\
  \ `Pocus` 是外部的。\n\n点击此处查看代码图像\n\n```c\n/* 示例 3 */\nint Hocus;\nint magic();\n\n\
  int main(void)\n{\n    int Hocus; // 默认自动的\n    ...\n}\n\nint Pocus;\nint magic()\n\
  {\n    int Hocus; // 自动\n    ...\n}\n```\n\n这些示例说明了外部变量的作用域：从声明点到文件结束。它们还说明了变量的生命周期。外部\
  \ `Hocus` 和 `Pocus` 在程序运行期间持续存在，因为它们不局限于任何函数。\n\n### 初始化外部变量\n\n像自动变量一样，外部变量可以被初始化。与自动变量不同，如果你不初始化外部变量，它们将被初始化为零。此规则适用于外部定义的数组元素。与自动变量的情况不同，你可以可以使用常量表达式来初始化文件变量：\n\
  \n点击此处查看代码图像\n\n```c\nint x = 10;             // 可以，10 是常量\nint y = 3 + 20;    \
  \     // 可以，常量表达式\nsize_t z = sizeof(int); // 可以，常量表达式\nint x2 = 2 * x;        \
  \ // 不可以，x 是变量\n```\n\n（只要类型不是变量数组，`sizeof` 被视为常量表达式。）\n\n### 使用外部变量\n\n让我们来看一个涉及外部变量的简单示例。具体来说，你希望两个函数（我们称之为\
  \ `main()` 和 `critic()`——访问变量 `units`。你可以通过在两个函数之外上方声明 `units` 来实现，如列表 12.4 所示。（注意：此示例的目的是展示外部变量是如何工作的，而不是展示典型的用法。）\n\
  \n列表 12.4 global.c 程序\n\n点击此处查看代码图像\n\n```c\n/* * *\n/* global.c -- 使用外部变量 */\n\
  #include <stdio.h>\n\nint units = 0;   /* 一个外部变量 */\n\nvoid critic(void);\n\nint\
  \ main(void)\n{\n  extern int units;  /* 可选的重声明 */\n  printf(\"How many pounds to\
  \ a firkin of butter?\\n\");\n  scanf(\"%d\", &units);\n  while ( units != 56)\n\
  \    critic();\n}\n```\n\n\n\n\n```c\nprintf(\"You must have looked it up!\\n\"\
  );\n\n    return 0;\n}\n\nvoid critic(void)\n{\n    /* optional redeclaration omitted\
  \ */\n    printf(\"No luck, my friend. Try again.\\n\");\n    scanf(\"%d\", &units);\n\
  }\n```\n\n***\n\n这里是一些示例输出：\n\n点击此处查看代码图像\n\n一桶黄油是多少磅？\n14\n运气不好，我的朋友。再试一次。\n56\n\
  你一定查过了过了！\n（我们查过了。）\n\n注意，`units` 的第二个值是由 `critic()` 函数读取的，但 `main()` 函数在结束 `while`\
  \ 循环时也知道了新值。因此，`main()` 函数和 `critic()` 函数都使用标识符 `units` 来访问同一个变量。在 C 语言术语中，我们说 `units`\
  \ 具有文件作用域（file scope）、外部链接（external linkage）和静态存储期（static storage duration）。\n\n\
  我们通过在任何函数定义之外（即函数外部）定义 `units` 使其成为外部变量。这就是你所需要做的，使得 `units` 对文件中后续的所有函数都可用。\n\n\
  让我们来看一些细节。首先，在声明 `units` 的地方进行声明，使其在不采取任何进一步操作的情况下对其方的函数可用。因此，`critics()` 使用了 `units`\
  \ 变量。\n\n同样，不需要为 `main()` 访问 `units` 做任何操作。然而，`main()` 内部确实有以下声明：\n\n```c\nextern\
  \ int units;\n```\n\n在示例中，此声明主要是为了文档说明。存储类型修饰符 `extern` 告诉编译器，在此特定函数中对 `units` 的任何引用都是指向函数外部定义的变量，甚至可能在文件外部。再次，`main()`\
  \ 和 `critic()` 都使用在外部定义的 `units`。\n\n### 外部名称 (External Names)\n\nC99 和 C11 标准要求编译器能够识别局部标识符（local\
  \ identifiers）的前 63 个字符，以及外部标识符（external identifiers）的前 31 个字符。这修订了之前的要求，之前的要求仅需识别局部标识符的前\
  \ 31 个字符和外部标识符的前 6 个字符。你可能在使用旧规则。外部变量名称规则比局部变量规则更严格，是因为外部名称需要符合本地环境的规则，而本地环境的可能更具限制性。\n\
  \n定义 定义与声明 (Definitions and Declarations)\n\n让我们详细查看变量的定义和声明之间的区别。考虑以下示例：\n\n点击此处查看代码图像\n\
  \n```c\nint tern = 1;           /* tern 已定义 */\n\nmain()\n{\n    external int tern;\
  \  /* 使用别处定义的 tern */\n```\n\n在这里，`tern` 被声明了两次。第一次声明为变量留出了存储空间。它构成了变量的定义。第二次声明仅仅告诉编译器使用之前创建的\
  \ `tern` 变量，因此它不是一个定义。第一次声明被称为*定义声明*（defining declaration），第二次声明被称为*引用声明*（referencing\
  \ declaration）。关键字 `extern` 表明该声明不是定义，因为它指示编译器去别处寻找。\n\n假设你执行了以下操作：\n\n```c\nextern\
  \ int tern;\n\nint main(void)\n{\n```\n\n编译器将假设 `tern` 的实际定义位于你程序的其他地方，可能在另一个文件中。此声明不会导致空间分配。因此，不要使用关键字\
  \ `extern` 来创建外部定义；仅使用它来*引用*已有的外部定义。\n\n外部变量只能初始化一次，且必须在变量定义时进行。假设你有如下等内容：\n\n点击此处查看代码图像\n\
  \n```c\n// file one.c\nchar permis = 'N';\n...\n\n// file two.c\nextern char permis\
  \ = 'Y';   /* 错误 */\n```\n\n这是一个错误，因为 `file_one.c` 中的定义声明已经创建并初始化了 `permis`。\n\n\
  #### 具有内部链接的静态变量 (Static Variables with Internal Linkage)\n\n这种存储类型的变量具有静态存储期、文件作用域和内部链接。你通过在任何函数之外定义它（与外部变量一样）并使用存储类型修饰符\
  \ `static` 来创建一个它：\n\n点击此处查看代码图像\n\n```c\nstatic int svil = 1;  // 静态变量，内部链接\n\n\
  int main(void)\n{\n```\n\n此类变量曾被称为*外部静态*（external static）变量，但这有点误解，因为它们具有内部链接。遗憾的是，没有新的紧凑术语取代*外部静态*，我们只能使用*具有内部链接的静态变量*。普通的外部变量可以被程序任何文件的函数使用，但具有内部链接的静态变量只能由同一文件的函数使用。你可以通过存储类型修饰符\
  \ `extern` 在函数内部重新声明任何文件作用域变量。这样的声明不会改变链接。考虑以下代码：\n\n点击此处查看代码图像\n\n```c\nint traveler\
  \ = 1;           // 外部链接\n\nstatic stayhome = 1;        // 内部链接\n\nint main()\n\
  {\n    extern int traveler;    // 全局\n    extern int stayhome;    // 全局\n...\n```\n\
  \n`traveler` 和 `stayhome` 对于特定单元都是全局的，但只有 `traveler` 可以被其他单元使用。\n\n### 多文件 (Multiple\
  \ Files)\n\n内部链接与外部链接之间的区别仅在你有一个由多个单元构建的程序时才重要，所以让我们快速看一下这个主题。\n\n复杂的 C 程序通常使用多个源文件。有时这些文件可能需要共享一个外部变量。C\
  \ 语言实现这种操作的方法是在一个文件中有一个定义声明，在其他文件中有引用声明。也就是说，除了一个声明（定义声明）之外的所有声明都应该使用 `extern` 关键字，且只有定义声明应该用于初始化变量。\n\
  \n注意，在一个文件中定义的外部变量对第二个文件是不可用的，除非在第二个文件中也（通过 `extern`）对其进行了声明。单独的外部声明只会使变量*可能*对其他人可用。\n\
  \n然而，在历史上，许多编译器在这方面遵循了不同的规则。例如，许多 Unix 系统允许你在多个文件中声明变量而无需使用 `extern` 关键字，只要没有包含初始化的声明多于一个即可。如果存在一个带有初始化的声明，它就会被视为定义。\n\
  \n### 存储类型修饰符总结 (Storage-Class Specifier Roundup)\n\n你可能已经注意到 `static` 和 `extern`\
  \ 关键字的含义取决于上下文。C 语言有六个关键字被归为存储类型修饰符。它们是 `auto`、`register`、`static`、`extern`、`_Thread_local`\
  \ 和 `typedef`。`typedef` 关键字并没有说明任何内存存储，但它是为了语法原因而引入的。特别是，在大多数情况下，你可以在声明中只能使用一个存储类型修饰符，这意味着你不能在\
  \ `typedef` 的部分使用其他存储类型修饰符。唯一的例外是 `_Thread_local` 可以与 `static` 和 `extern` 一起使用。\n\
  \n`auto` 修饰符表示具有自动存储期的变量。它只能用于具有块作用域的变量的声明，而这些变量已经具有自动存储期，因此其主要作用是记录意图。\n\n`register`\
  \ 修饰符也只能用于具有块作用域的变量。它将变量放入寄存器存储类，这等同于减少该变量的访问时间。它还防止你获取该变量的地址。\n\n\n\n\n`static`\
  \ 限定符会创建一个具有静态存储生存期的对象，该对象在程序加载时创建，在程序终止时销毁。如果 `static` 用于文件作用域声明，则其作用域仅限于该文件。如果\
  \ `static` 用于块作用域声明，则其作用域仅限于该块。因此，只要程序运行，该对象就会存在并保留其值，但只有在块内代码正在执行时，才能通过标识符访问它。具有块作用域的静态变量没有链接。具有文件作用域的静态变量具有内部链接。\n\
  \n`extern` 限定符表示你正在声明一个在别处定义的变量。如果包含 `extern` 的声明具有文件作用域，则所引用的变量必须具有外部链接。如果包含 `extern`\
  \ 的声明具有块作用域，则所引用的变量可以具有外部链接，也可以具有内部链接，取决于该变量的定义声明。\n\n***\n\n### 总结：存储类型\n\n自动变量（Automatic\
  \ variables）具有块作用域、无链接且具有自动存储生存期。它们对于定义所在的块（通常是函数）是局部且私有的。寄存器变量（Register variables）具有与自动变量相同的属性，但编译器可能会使用更快的内存或寄存器来存储它们。你无法获取寄存器变量的地址。\n\
  \n具有静态存储生存期的变量可以具有外部链接、内部链接或无链接。当变量在文件的任何函数外部被声明时，它是一个外部变量，具有文件作用域、外部链接和静态存储生存期。如果你在此类声明中添加\
  \ `static` 关键字，你就得到了一个具有静态存储生存期、文件作用域和内部链接的变量。如果你在函数内部声明变量并使用 `static` 关键字，该变量具有静态存储生存期、块作用域且无链接。\n\
  \n具有自动存储生存期的变量的内存在程序执行进入包含变量声明的块时分配，在退出块时释放。如果未初始化，此类变量将有一个垃圾值。具有静态存储生存期的变量的内存在编译时分配，并随着程序的运行而一直持续存在。如果未初始化，此类变量被设置为\
  \ 0。\n\n具有块作用域的变量对于包含声明的块是局部的。具有文件作用域的变量对于在该声明之后的文件（或编译单元）中的所有函数都是可见的。如果文件作用域变量具有外部链接，它可以被程序中的其他编译单元使用。如果文件作用域变量具有内部链接，则它只可以在声明所在的文件中使用。\n\
  \n***\n\n这是一个使用了所有五种存储类型的短程序。它分布在两个文件中（列表 12.5 和 列表 12.6），因此你必须进行多文件编译。（指导请参见 第\
  \ 9 章“函数”或你的编译器手册。）它的主要目标是使用所有五种存储类型，而不是提供设计模型；更好的设计不需要文件作用域变量。\n\n#### 列表 12.5\
  \ parta.c 文件\n\n点击此处查看代码图像\n\n***\n\n```c\n// parta.c --- 各种存储类型\n// 与 partb.c 编译\n\
  \n#include <stdio.h>\n\nvoid report_count();\nvoid accumulate(int k);\n\nint count\
  \ = 0;      // 文件作用域，外部链接\n\nint main(void)\n{\n    int value;       // 自动变量\n \
  \   register int i;  // 寄存器变量\n    printf(\"Enter a positive integer (0 to quit):\
  \ \");\n    while (scanf(\"%d\", &value) == 1 && value > 0)\n    {\n        ++count;\
  \    // 使用文件作用域变量\n        for (i = value; i >= 0; i--)\n            accumulate(i);\n\
  \        printf(\"Enter a positive integer (0 to quit): \");\n    }\n    report_count();\n\
  \    return 0;\n}\n\nvoid report_count()\n{\n    printf(\"Loop executed %d times\\\
  n\", count);\n}\n```\n\n***\n\n#### 列表 12.6 partb.c 文件\n\n点击此处查看代码图像\n\n***\n\n\
  ```c\n// partb.c -- 程序的剩余\n// 与 parta.c 编译\n\n#include <stdio.h>\n\nextern int count;\
  \      // 引用声明，外部链接\nstatic int total = 0;   // 静态定义，内部链接\nvoid accumulate(int k);\
  \ // 原型\nvoid accumulate(int k)  // k 有块作用域，无链接\n{\n    static int subtotal = 0;\
  \  // 静态，无链接\n    if (k <= 0)\n    {\n        printf(\"loop cycle: %d\\n\", count);\n\
  \        printf(\"subtotal: %d; total: %d\\n\", subtotal, total);\n        subtotal\
  \ = 0;\n    }\n    else\n    {\n        subtotal += k;\n        total += k;\n  \
  \  }\n}\n```\n\n在这个程序中，块作用域静态变量 `subtotal` 保持传递给 `accumulate()` 函数的值的累加和，文件作用域、内部链接变量\
  \ `total` 保持总和。每当向其传递非正值时，`accumulate()` 函数会将 `subtotal` 重置为 0。在 `parta.c` 中，`main()`\
  \ 和 `report_count()` 共享对 `count` 的访问权限。（顺便提一下，这是一个使用外部变量的反面教材，因为 `static` 关键字将 `parta.c`\
  \ 的代码与 `partb.c` 的代码耦合在了一起。）`parta.c` 中的 `accumulate()` 原型是强制性的；对于 `partb.c`，它是可选的，因为在该文件中仅定义但未调用。\n\
  \n这是一个示例运行：\n\n点击此处查看代码图像\n\nEnter a positive integer (0 to quit): 5\nloop cycle:\
  \ 1\nsubtotal: 15; total: 15\nEnter a positive integer (0 to quit): 10\nloop cycle:\
  \ 2\nsubtotal: 55; total: 70\nEnter a positive integer (0 to quit): 2\nloop cycle:\
  \ 3\nsubtotal: 3; total: 73\nloop cycle: 0\nLoop executed 3 times\n\n#### 存储类型与函数\n\
  \n函数也有存储类型。函数可以是外部的（默认）或静态的。（C99 增加了第三种可能性，即内联函数，在第 16 章 中讨论）。外部函数可以被其他文件中的函数访问，但静态函数只能在定义文件中使用。例如，考虑包含以下函数原型的文件：\n\
  \n点击此处查看代码图像\n\n```c\ndouble gamma(double);      // 默为外部\nstatic double beta(int,\
  \ int);\nextern double delta(double, int);\n```\n\n函数 `gamma()` 和 `delta()` 可以被程序中其他文件的函数使用，但\
  \ `beta()` 则不能。由于 `beta()` 被限制在一个文件中，你可以在其他文件中使用同名的不同函数。使用 `static` 存储类型的原因之一是创建特定模块私有的函数，从而避免命名冲突的可能性。\n\
  \n在声明位于其他文件的函数时，通常的做法是使用 `extern` 关键字。这种做法主要是为了清晰，因为除非使用了 `static` 关键字，否则函数声明假设是\
  \ `extern` 的。\n\n#### 哪种存储类型？\n\n\n\n\n“哪种存储类？”这个问题的答案通常是“自动的（automatic）”。毕竟，否则为什么将自动的选为默认值呢？是的，我们知道从表面上看，外部存储是很有吸引力的。只需让所有变量都成为外部的，你就再也不需要担心使用参数和指针在函数之间进行通信了。然而，这里存在一个微妙的陷阱。你将不得不担心函数\
  \ `A()` 悄悄修改函数 `B()` 中使用的变量，尽管你的初意并非如此。多年集体计算机经验所给出的不容置疑的证据是：这种细微的危险远大于盲目使用外部存储所带来的表面浅层吸引力。\n\
  \n一个常见的例外是 `const` 数据。因为它们不能被修改，所以你不必担心无意的修改：\n\n点击此处查看代码图像\n\n```c\nconst int DAYS\
  \ = 7;\nconst char * MSGS[3] = {\"Yes\", \"No\", \"Maybe\"};\n```\n\n防御性编程的黄金法则之一是“知其必要”原则。尽可能让每个函数的内部实现对该函数私有，只共享那些需要共享的变量。其他类是有用的，而且也是可用的。但在使用它们之前，请问问自己是否有必要。\n\
  \n### 随机数函数和静态变量\n\n现在你已经对不同的存储类有了一些背景了解，让我们来看使用其中一些类的程序。首先，让我们看一个使用具有内部链接静态变量的函数：一个随机数函数。ANSI\
  \ C 库提供了 `rand()` 函数来生成随机数。生成随机数有多种算法，ANSI C 允许实现层针对特定机器使用最佳算法。然而，ANSI C 标准还提供了一种标准的、可移植的算法，可以在不同系统上产生相同的随机数。实际上，`rand()`\
  \ 是一个“伪随机数生成器”，这意味着实际数字序列是可预测的（计算机并不以自发性著称），但这些数字在可能的值范围内分布得相当均匀。\n\n我们将不使用编译器内置的\
  \ `rand()` 函数，而是使用可移植的 ANSI 版本，这样你可以看到内部发生了什么。该方案从被称为“种子（seed）”的数字开始。函数使用种子产生一个新数字，这个数字变成新的种子。然后，新种子可以产生更新的种子，以此此类推。为了让该方案生效，随机数函数必须记住它上次被调用时使用的种子。啊！这需要一个静态变量。列表\
  \ 12.7 是版本 0。（是的，版本 1 很快就会到来。）\n\n列表 12.7 rand0.c 函数文件\n\n点击此处查看代码图像\n\n```c\n/*\
  \ rand0.c --产生随机数 */\n/* 使用 ANSI C 可移植算法 */\nstatic unsigned long int next = 1;\
  \  /* 种子 */\nint rand0(void)\n{\n    /* 生成伪随机数的魔法公式 */\n    next = next * 1103515245\
  \ + 12345;\n    return (unsigned int) (next/65536) % 32768;\n}\n```\n\n在 列表 12.7\
  \ 中，静态变量 `next` 从值 `1` 开始，并在每次函数被调用时通过魔法公式修改。结果是在 `0` 到 `32767` 范围内的某个返回值。注意 `next`\
  \ 是具有内部链接的静态变量，而不仅仅是无链接的静态变量。这是因为示例稍后会被扩展，`next` 在同一个文件的两个函数之间共享。\n\n让我们用 列表 12.8\
  \ 所示的简单驱动程序尝试 `rand0()` 函数。\n\n列表 12.8 r_drive0.c 驱动程序\n\n点击此处查看代码图像\n\n```c\n/*\
  \ r_drive0.c -- 测试 rand0() 函数 */\n/* 使用 rand0.c 编译 */\n#include <stdio.h>\nextern\
  \ int rand0(void);\nint main(void)\n{\n    int count;\n    for (count = 0; count\
  \ < 5; count++)\n        printf(\"%d\\n\", rand0());\n    return 0;\n}\n```\n\n\
  又是一个练习使用多文件的机会。使用一个文件对应 列表 12.7，另一个文件对应 列表 12.8。\n\n\n\n\n对标准的 ANSI C 函数 `srand()`\
  \ 和 `rand()` 使用相同的技术。如果你确实使用这些函数，请包含 `stdlib.h` 头文件。事实上，既然你已经看到了 `srand1()` 和 `rand1()`\
  \ 如何使用具有内部链接的静态变量，你不妨直接使用你的提供的提供的版本。我们将在下一个示例中这样做。\n\n## 掷骰子（Roll ’Em）\n\n我们将模拟那种非常受欢迎的随机活动——掷骰子。最流行的掷骰子形式是使用两颗六面骰，但也有其他可能性。许多冒险奇幻游戏使用所有五种几何上可能的骰子：4\
  \ 面、6 面、8 面、12 面和 20 面。聪明的古希腊人证明了世界上只有五种所有面形状和大小都相同的正多面体，而这些多面体就是各种骰子的基础。你可以制作其他面数的骰子，但它们的面将不再是完全相同的，因此它们转到朝上的概率也不一定是相等的。\n\
  \n计算机计算不受限于这些几何考虑，因此我们可以设计出具有任意数量面数的电子骰子。让我们从六面开始，然后进行泛化。\n\n我们想要一个 1 到 6 之间的随机数。然而，`rand()`产生的是一个范围在\
  \ 0 到`RAND_MAX` 之间的整数；`RAND_MAX` 在 `stdlib.h` 中定义。它通常是 `INT_MAX`。因此，我们需要做一些调整。这里有一种方法：\n\
  \n1. 将随机数对 6 取模。它产生一个 0 到 5 之间的整数。\n2. 加 1。新数字在 1 到 6 的范围内。\n3. 为了泛化，只需将步骤 1 中的数字\
  \ 6 替换为面数即可。\n\n以下代码实现了这些思想：\n\n点击此处查看代码图像\n\n```c\n#include <stdlib.h>   /* for\
  \ rand() */\n\nint rollem(int sides)\n{\n    int roll;\n    roll = rand() % sides\
  \ + 1;\n    return roll;\n}\n```\n\n让我们再更有野心一点，编写一个函数，让你投掷任意数量的骰子并返回总数。列表 12.11\
  \ 实现了此点。\n\n列表 12.11 diceroll.c 文件\n\n点击此处查看代码图像\n\n```c\n/* diceroll.c -- dice\
  \ role simulation */\n/* compile with mandydice.c             */\n#include \"diceroll.h\"\
  \n#include <stdio.h>\n#include <stdlib.h>               /* for library rand()  \
  \ */\nint roll_count  = 0;           /* external linkage   */\nstatic int rollem(int\
  \ sides)  /* private to this file */\n{\n    int roll;\n    roll = rand() % sides\
  \ + 1;\n    ++roll_count;               /* count function calls */\n    return roll;\n\
  }\n\nint roll_n_dice(int dice, int sides)\n{\n    int d;\n    int total = 0;\n \
  \   if (sides < 2)\n    {\n        printf(\"Need at least 2 sides.\\n\");\n    \
  \    return -2;\n    }\n    if (dice < 1)\n    {\n        printf(\"Need at least\
  \ 1 die.\\n\");\n        return -1;\n    }\n    for (d = 0; d < dice; d++)\n   \
  \     total += rollem(sides);\n    return total;\n}\n```\n\n这个文件增加了一些复杂性。首先，它将 `rollem()`\
  \ 转换为该文件私有的函数。它是作为 `roll_n_dice()` 的辅助函数存在的。其次，为了说明外部链接如何工作，该文件声明了一个名为 `roll_count`\
  \ 的外部变量。该变量跟踪 `rollem()` 函数被调用的次数。这个例子有点刻意为之，但它展示了外部变量功能是如何工作的。\n\n第三，该文件包含以下语句：\n\
  `#include \"diceroll.h\"`\n\n当你使用如 `rand()` 等标准库函数时，你包含头文件（`rand()` 对应 `stdlib.h`）而不是声明函数。这是因为头文件包含了正确的声明。我们将通过提供一个与\
  \ `roll_n_dice()` 函数配合使用的 `diceroll.h` 头文件来模拟这种方法。使用双引号而不是角括号来包裹文件名，指示编译器在本地查找，而不是在编译器用于头文件的标准位置查找。“本地”的含义取决于实现。一些常见的解释是将头文件放在与源代码相同的目录下，或者放在与项目文件相同的目录下（如果你的编译器使用它们）。列表\
  \ 12.2 显示了头文件的内容。\n\n列表 12.2 diceroll.h 文件\n\n点击此处查看代码图像\n\n```c\n//diceroll.h\n\
  extern int roll_count;\nint roll_n_dice(int dice, int sides);\n```\n\n此头文件包含了函数原型和一个\
  \ `extern` 声明。由于由于 `diceroll.c` 文件包含了此头文件，`diceroll.c` 包含了两个 `roll_count` 的声明：\n\
  \n`extern int roll_count;` // 头文件\n`int roll_count = 0;` // 源文件\n\n这是可以的。你只能对变量有一个定义。但带有\
  \ `extern` 的声明是引用声明，你可以根据需要拥有多个此类。使用 `roll_n_dice()` 的程序也应该包含此文件。这不仅为 `roll_n_dice()`\
  \ 提供了原型，还让 `roll_count` 对该程序可用。列表 12.3 说明了这些点。\n\n列表 12.3 manydice.c 文件\n\n点击此处查看代码图像\n\
  \n```c\n/* manydice.c -- multiple dice rolls */\n/* compile with diceroll.c    \
  \       */\n#include <stdio.h>\n#include <stdlib.h>           /* for srand() */\n\
  #include <time.h>             /* for time()   */\n#include \"diceroll.h\"      \
  \   /* for roll_n_dice()  */\n/* and for roll_count  */\nint main(void)\n{\n   \
  \ int dice,roll;\n    int sides;\n    int status;\n    srand((unsigned int) time(0));\
  \ /* randomize seed      */\n    printf(\"Enter the number of sides per die, 0 to\
  \ stop.\\n\");\n    while (scanf(\"%d\", &sides) == 1 && sides > 0 )\n    {\n  \
  \      printf(\"How many dice?\\n\");\n        if ((status =scanf(\"%d\", &dice))\
  \ != 1)\n        {\n            if (status == EOF)\n                break;     \
  \      /* exit loop      */\n            else\n            {\n                printf(\"\
  You should have entered an integer.\");\n                printf(\" Let's begin again.\\\
  n\");\n                while (getchar() != '\\n')\n                    continue;\n\
  \            }\n        }\n        roll = roll_n_dice(dice, sides);\n        printf(\"\
  You have rolled %d using %d-sided dice.\\n\", roll, sides);\n    }\n    printf(\"\
  The rollem() function was called %d times.\\n\", roll_count);\n    printf(\"GOOD\
  \ FORTUNE TO YOU!\\n\");\n    return 0;\n}\n```\n\n\n\n\n由于程序使用 `srand()` 来随机化随机数种子，即使输入相同，你可能也不会获得相同的输出。请注意，`manydice.c`\
  \ 中的 `main()` 确实访问在 `diceroll.c` 中定义的 `roll_count` 变量。\n\n外层 `while` 循环可以通过三种原因终止：`sides`\
  \ 小于 1、输入类型不匹配（`scanf()` 返回值为 `0`）或遇到文件结束（返回值为 `EOF`）。在读取骰子数量时，程序处理文件结束的方式与处理类型不匹配的方式不同：在前者情况下，它会退出\
  \ `while` 循环；而在后者，它会启动一个新的循环周期。\n\n你可以以多种方式使用 `roll_n_dice()`。当 `sides` 等于 2 时，程序会模拟硬币投掷，“正面”为\
  \ 2，“反面”为 1（或者如果你真的更喜欢，也可以反过来）。你可以轻松地修改程序以显示单个结果以及总和，或者你可以构建一个骰点模拟器。如果你需要大量的投掷（例如在某些角色扮演游戏中），你可以轻松地修改程序以产生如下输出：\n\
  \n点击此处查看代码图像\n\n输入组数；输入 q 停止。\n\n18\n\n多少面？几个骰子？\n\n6 3\n\n这里是 18 组 3 次六面骰投掷。\n\n\
  12  10   6   9   8  14   8  15   9  14  12  17  11   7  10\n\n13    8  14\n\n多少组？输入\
  \ q 停止。\n\nq\n\n`rand1()` 或 `rand()` 的另一个用途（但不是 `rollem()`）是创建一个猜数字程序，让计算机选择而你来猜。你可以自己尝试一下。\n\
  \n### 分配内存：`malloc()` 和 `free()`\n\n我们讨论过的存储类有一个共同点。在你决定使用哪种存储类之后，关于作用域和存储生存期的决定会自动跟随。你的选择遵循了预设的内存管理规则。然而，还有一种选择，可以给你更大的灵活性。那个选择就是使用库函数来分配和管理内存。\n\
  \n首先，让我们回顾一下关于内存分配的一些事实。所有程序都必须留出足够的内存来存储它们使用的数据。其中部分内存分配是自动完成的。例如，你可以声明：\n\n点击此处查看代码图像\n\
  \n```c\nfloat x;\nchar place[] = \"Dancing Oxen Creek\";\n```\n\n留出足够的内存来存储该 `float`\
  \ 或字符串，或者你可以更显式地请求特定数量的内存：\n\n```c\nint plates[100];\n```\n\n此声明留出了 100 个内存位置，每个适合存储一个\
  \ `int` 值。在所有这些情况下，声明也为内存提供了一个标识符，因此你可以使用 `x` 或 `place` 来标识数据。记住，静态数据在程序加载到内存时分配，自动数据在程序执行进入块时分配，在执行离开块时释放。\n\
  \nC 语言不仅于此。你可以在程序运行时分配更多内存。主要的工具是 `malloc()` 函数，它接受一个参数：你想要的内存字节数。然后 `malloc()`\
  \ 会找到一个合适的空内存块。该内存是匿的；也就是说，`malloc()` 分配了内存但没有为它分配名称。然而，它确实返回了该块第一个字节的地址。因此，你可以将该地址赋值给指针变量，并使用该指针访问内存。由于\
  \ `char` 代表一个字节，`malloc()` 传统上被定义为指向 `char` 的指针类型。但自 ANSI C 标准以来，C 语言使用了一种新类型：指向\
  \ `void` 的指针。这种类型旨在作为“通用指针”。`malloc()` 函数可以返回指向数组、结构体等的指针，因此通常返回值会被强制转换为适当的值类型。在\
  \ ANSI C 下，为了清晰起见，你仍然应该进行类型转换，但将指向 `void` 的指针值赋值给其他类型的指针不被视为类型冲突。如果 `malloc()` 未能找到所需空间，它将返回空指针。\n\
  \n让我们将 `malloc()` 应用于创建数组的任务。你可以使用 `malloc()` 在程序运行时请求一个存储块。你还需要一个指针来跟踪该块在内存中的位置。例如，考虑这段代码：\n\
  \n点击此处查看代码图像\n\n```c\ndouble * ptd;\nptd = (double *) malloc(30 * sizeof(double));\n\
  ```\n\n这段代码请求 30 个 `double` 类型值的空间，并将 `ptd` 指向该位置。注意 `ptd` 被声明为指向单个 `double` 的指针，而不是指向包含\
  \ 30 个 `double` 值的块。记住，数组名是其第一个元素的地址。因此，如果你让 `ptd` 指向块的第一个元素，你就可以像数组一样使用它。\n\n\n\
  \n\n通过使用 `malloc()`，程序可以决定需要多大的数组，并在程序运行时创建它。列表 12.14 阐释了这种可能性。它将内存块的地址赋值给指针 `ptd`，然后你可以像使用数组名一样使用\
  \ `ptd`。此外，还调用了在 `stdlib.h` 中声明的 `exit()` 函数，在内存分配失败时调用它来终止程序。该头文件中还定义了值 `EXIT_FAILURE`。标准提供了两个保证在所有操作系统上都能正常工作的返回值：`EXIT_SUCCESS`（或等同于值\
  \ `0`）表示程序正常终止，以及 `EXIT_FAILURE` 表示异常终止。包括 Unix、Linux 和 Windows 在内的某些操作系统可以接受额外的整数值，用表示特定形式的失败。\n\
  \n列表 12.14 dyn_arr.c 程序\n\n点击此处查看代码图像\n\n```\n/* dyn_arr.c -- 动态分配数组 */\n\n#include\
  \ <stdio.h>\n\n#include <stdlib.h> /* 用于 malloc(), free() */\n\nint main(void)\n\
  {\n    double * ptd;\n    int max = 0;\n    int number;\n    int i = 0;\n    puts(\"\
  What is the maximum number of type double entries?\");\n    if (scanf(\"%d\", &max)\
  \ != 1)\n    {\n        puts(\"Number not correctly entered -- bye.\");\n      \
  \  exit(EXIT_FAILURE);\n    }\n    ptd = (double *) malloc(max * sizeof (double));\n\
  \    if (ptd == NULL)\n    {\n        puts(\"Memory allocation failed. Goodbye.\"\
  );\n        exit(EXIT_FAILURE);\n    }\n    /* ptd 现在指向一个包含 max 个元素的数组 */\n    puts(\"\
  Enter the values (q to quit):\");\n    while (i < max && scanf(\"%lf\", &ptd[i])\
  \ == 1)\n        ++i;\n    printf(\"Here are your %d entries:\\n\", number = i);\n\
  \    for (i = 0; i < number; i++)\n    {\n        printf(\"%7.2f \", ptd[i]);\n\
  \        if (i % 7 == 6)\n            putchar('\\n');\n    }\n    if (i % 7 != 0)\n\
  \        putchar('\\n');\n    puts(\"Done.\");\n    free(ptd);\n    return 0;\n\
  }\n```\n\n这是一个示例运行。在其中，我们输入了六个数字，但程序只处理了五个，因为我们将数组大小限制在了 5 上。\n\n点击此处查看代码图像\n\n\
  最大条数是多少?\n5\nEnter the values (q to quit):\n20 30 35 25 40 80\nHere are your 5 entries:\n\
  \  20.00   30.00   35.00   25.00   40.00\nDone.\n\n让我们来看看代码。程序通过以下几行找到了所需的数组大小：\n\
  \n点击此处查看代码图像\n\n```\nif (scanf(\"%d\", &max) != 1)\n{\n    puts(\"Number not correctly\
  \ entered -- bye.\");\n    exit(EXIT_FAILURE);\n}\n```\n\n接下来，接的一行分配了足够的空间来容纳请求的条目，并将内存块的地址赋值给指针\
  \ `ptd`：\n\n点击此处查看代码图像\n\n```\nptd = (double *) malloc(max * sizeof (double));\n\
  ```\n\n在 C 语言中类型转换 `(double *)` 是可选的，但在 C++ 中是要求的，因此使用类型转换使得程序从 C 迁移到 C++ 更加简单。\n\
  \n`malloc()` 可能无法获取所需的内存量。在这种情况下，函数返回空指针，程序终止：\n\n点击此处查看代码图像\n\n```\nif (ptd ==\
  \ NULL)\n{\n    puts(\"Memory allocation failed. Goodbye.\");\n    exit(EXIT_FAILURE);\n\
  }\n```\n\n如果程序通过了这一检查，它可以将 `ptd` 视为一个包含 `max` 个元素的数组名，而且它确实是这样。注意程序末尾的 `free()`\
  \ 函数。它释放由 `malloc()` 分配的内存。`free()` 函数仅释放其参数所指向的内存块。某些操作系统会在程序结束时自动释放分配的内存，但其他操作系统可能不会。因此请使用\
  \ `free()`，不要依赖操作系统为你清理。\n\n使用动态数组你获得了什么？在这种情况下，你获得了灵活性。假设你知道大多数时间程序不需要超过 100 个元素，但有时需要。如果你声明一个数组，你就必须考虑最坏的情况并将其声明为\
  \ 10000 个元素。在大多数情况下，该程序都会浪费内存。而在你唯一一次需要 10001 个元素时，程序将失败。你可以使用动态数组来调整程序以适应。\n\n\
  #### free() 的重要性\n\n静态内存量在编译时是固定的；它在程序运行期间不会改变。假设你知道大多数时间程序不需要超过 100 个元素，但有时需要。如果你声明一个数组，你就必须为最坏情况做准备并声明为\
  \ 10000 个元素。在大多数情况下，该程序都会浪费内存。那么当你唯一一次需要 10001 个元素时，程序将失败。你可以使用动态数组来调整程序以适应。\n\n\
