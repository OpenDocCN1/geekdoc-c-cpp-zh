  \n## 指针与多维数组\n\n指针与多维数组之间是什么什么关系？你为什么需要知道这些呢？处理多维数组的函数是通过指针操作的，因此在处理此类函数之前，你需要一些更深入的指针知识。关于第一个问题，让我们现在来看一些示例来找到答案。为了简化讨论，我们使用一个小型数组。假设你有如下声明：\n\
  \n点击此处查看代码图片\n\n```c\nint zippo[4][2];  /* 一个由 int 数组组成的数组 */\n```\n\n那么，`zippo`\
  \ 作为一个数组的名称，是该数组第一个元素的地址。在这种情况下，`zippo` 的第一个元素本身是一个包含两个 `int` 的数组，因此 `zippo` 是一个包含两个\
  \ `int` 数组的地址。让我们从指针属性的角度进一步分析一下：\n\n![Image](img/squf.jpg) 因为 `zippo` 是数组第一个元素的地址，所以\
  \ `zippo` 的值与 `&zippo[0]` 相同。接下，`zippo[0]` 本身是一个包含两个整数的数组，因此 `zippo[0]` 的值与 `&zippo[0][0]`\
  \ 相同，即它的第一个元素（一个 `int` 类型）的地址。简而言之，`zippo[0]` 是一个 `int` 大小对象的地址，而 `zippo` 是一个两个\
  \ `int` 大小对象的地址。因为整数和两个整数的数组从相同的位置开始，所以 `zippo` 和 `zippo[0]` 具有相同的数值。\n\n![Image](img/squf.jpg)\
  \ 给指针或地址加 1 会得到一个比所引用对象大一个单元的值。在这方面，`zippo` 和 `zippo[0]` 是不同的，因为 `zippo` 指的是一个两个\
  \ `int` 大小的对象，而 `zippo[0]` 指的是一个一个 `int` 大小的对象。因此，`zippo + 1` 的值与 `zippo[0] + 1`\
  \ 不同。\n\n![Image](img/squf.jpg) 对指针或地址进行解引用（应用 `*` 运算符或带有索引的 `[]` 运算符）会得到所引用对象代表的值。因为\
  \ `zippo[0]` 是它的第一个元素（`zippo[0][0]`）的地址，所以 `*(zippo[0])` 代表存储在 `zippo[0][0]` 中的值，一个\
  \ `int` 类型的值。同样，`*zippo` 代表它的第一个元素 `zippo[0]` 的值，但 `zippo[0]` 本身是一个 `int` 的地址。它是地址\
  \ `&zippo[0][0]`，所以 `*zippo` 是 `&zippo[0][0]`。对这两个表达式都应用解引用运算符意味着 `**zippo` 等于 `*&zippo[0][0]`，这被简化为\
  \ `zippo[0][0]`，一个 `int` 类型。简而言之，`zippo` 是地址的地址，必须解引用两次才能得到普通值。地址的地址或指针的指针是双重间接的例子。\n\
  \n显然，增加数组维度的数量会增加指针视角的复杂性。到此时，大多数 C 语言学生开始意识到为什么指针被认为是该语言最困难的方面之一。你可能想要仔细研究前面的几点，并看看它们是如何在\
  \ 列表 10.15 中说明的，该列表显示了一些地址值和数组内容。\n\n列表 10.15 zippo1.c 程序\n\n点击此处查看代码图片\n\n```c\n\
