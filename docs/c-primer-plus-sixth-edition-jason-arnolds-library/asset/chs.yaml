  is\ntoo\nmuch\nfun!\n\n#### 类型泛型数学：tgmath.h (C99)\n\n`math.h` 和 `complex.h` 库提供了许多仅类型上不同的函数实例。例如，以下六个函数都用于计算正弦：\n\
  \n点击此处查看代码图像\n\n```c\ndouble sin(double);\nfloat sinf(float);\nlong double sinl(long\
  \ double);\ndouble complex csin(double complex);\nfloat csinf(float complex);\n\
  long double csinl(long double complex);\n```\n\n`tgmath.h` 头文件定义了宏，这些宏根据参数类型将泛型调用展开为相应的函数。以下代码演示了对\
  \ `sin()` 宏的使用，它可以展开为正弦函数的各种形式：\n\n点击此处查看代码图像\n\n```c\n#include <tgmath.h>\n\n...\n\
  \ndouble dx, dy;\nfloat fx, fy;\nlong double complex clx, cly;\ndy = sin(dx);  \
  \ // 展开为 dy = sin(dx)  （函数）\nfy = sin(fx);   // 展开为 fy = sinf(fx)\ncly = sin(clx);\
  \ // 展开为 cly = csinl(clyx)\n```\n\n该头文件为三类函数定义了泛型宏。第一类由 `math.h` 和 `complex.h` 函数组成，共有六种变体，使用\
  \ `l` 和 `f` 后缀以及 `c` 前缀，如之前的 `sin()` 示例所示。在这种情况下，泛型宏名称与 `double` 版本的函数名称相同。\n\n\
  第二类由 `math.h` 函数组成，共有三种变体，使用 `l` 和 `f` 后缀且没有对应的复数对应项，例如 `erf()`。在这种情况下，宏名称与该示例中无后缀的函数\
  \ `erf()` 相同。对复数参数使用此类宏的效果是未定义的。\n\n第三类由 `complex.h` 函数组成，共有三种变体，使用 `l` 和 `f` 后缀且没有对应的实数对应项，例如\
  \ `cimag()`。在这种情况下，宏名称与该示例中无后缀的函数 `cimag()` 相同。对实数参数使用此类宏的效果是未定义的。\n\n表 RS.V.38\
  \ 列出了泛型宏函数。\n\n![图像](img/rs-vtab38.jpg)\n\n表 RS.V.38 泛型数学函数\n\n在 C11 之前，实现者不得不依靠标准的扩展来实现泛型宏。但\
  \ `_Generic` 表达式的引入允许使用标准 C11 进行直接实现。\n\n#### 线程：threads.h (C11)\n\n该头文件同 `stdatomic.h`\
  \ 一起提供了对并发编程的支持。这个主题远超本书的范围，但通俗来说，该头文件支持多个执行线程，原则上这些可以分配给不同的处理器。\n\n#### 日期和时间：time.h\n\
  \n`time.h` 头文件定义了三个宏。第一个在许多其他头文件中也定义了 `NULL`，表示空指针。第二个宏是 `CLOCKS_PER_SEC`；将 `clock()`\
  \ 返回的值除以此宏可得到以秒为的时间。第三个（C11）是 `TIME_UTC`，一个正整数常量，指定 UTC（协调世界时）时间基，作为 `timespec`\
  \ 的潜在参数。\n\n（注：原文中存在大量重复段落，已根据要求进行去重处理并保留核心内容。）\n\n\n\n\n![Image](img/rs-vtab48.jpg)![Image](img/rs-vtab48a.jpg)\n\
  \n表 RS.V.48 宽字符 I/O 函数\n\n存在一个没有标准 I/O 对应函数的宽字符 I/O 函数：\n\n`int fwide(FILE *stream,\
  \ int mode);`\n\n若 `mode` 为正，则首先尝试使参数 `stream` 所表示的流变为*宽字符定向*；若 `mode` 为负，则首先尝试使该流变为*字节定向*；若\
  \ `mode` 为 0，则不尝试改变流的方向。只有当流初始没有方向时，它才尝试改变方向。在所有情况下，若流为宽字符定向，则返回正值；若流为字节定向，则返回负值；若流没有方向，则返回零。\n\
  \n该头文件提供了几个字符串转换和操作函数，模仿自 `string.h` 中的函数。通常，`string.h` 标识符中的 `str` 被替换为 `wcs`，因此\
  \ `wcstod()` 是 `strtod()` 函数的宽字符版本。表 RS.V.49 列出了这些函数。\n\n![Image](img/rs-vtab49.jpg)![Image](img/rs-vtab49a.jpg)\n\
  \n表 RS.V.49 宽字符字符串工具\n\n该头文件还声明了一个一次性函数，模仿自 `time.h` 头文件中的 `strftime()` 函数：\n\n\
  点击此处查看代码图片\n\n```\nsize_t wcsftime(wchar_t * restrict s, size_t maxsize,\nconst\
  \ wchar_t * restrict format,\nconst struct tm * restrict timeptr);\n```\n\n最后，该头文件声明了几个函数，用于将宽字符字符串转换为多字节字符串，反之亦然，如表\
  \ RS.V.50 所示。\n\n![Image](img/rs-vtab50.jpg)![Image](img/rs-vtab50a.jpg)![Image](img/rs-vtab50b.jpg)\n\
  \n表 RS.V.50 宽字符、多字节转换函数\n\n#### 宽字符分类与映射工具：wctype.h (C99)\n\n`wctype.h` 库提供了 `ctype.h`\
  \ 字符函数的宽字符模拟，以及一些额外的函数。它还定义了三种类型和一个宏，如表 RS.V.51 所示。\n\n![Image](img/rs-vtab51.jpg)\n\
  \n表 RS.V.51 `wctype.h` 类型与宏\n\n本库中的字符分类函数在宽字符参数满足函数描述的条件时返回真（非零）。通常，若对应的 `ctype.h`\
  \ 函数对与该宽字符对应的单字节字符返回真，则宽字符函数返回真。表 RS.V.52 列出了这些函数。\n\n![Image](img/rs-vtab52.jpg)\n\
  \n表 RS.V.52 宽字符分类函数\n\n该库还包括两个被称为“可扩展”的分类函数，因为它们使用当前语言环境的 `LC_CTYPE` 值对字符进行分类。表\
  \ RS.V.53 列出了这些函数。\n\n![Image](img/rs-vtab53.jpg)\n\n表 RS.V.53 可扩展宽字符分类函数\n\n`wctype()`\
  \ 的有效参数由宽字符分类函数名称去掉 `isw` 前缀后以字符串形式表示。例如，`wctype(\"alpha\")` 表征了由 `iswalpha()` 函数测试的字符类。因此，调用\n\
  \n```\niswctype(wc, wctype(\"alpha\"))\n```\n\n等价于调用\n\n```\niswalpha(wc)\n```\n\
  \n但字符是使用 `LC_CTYPE` 类别进行分类的。\n\n该库提供了四个与转换相关的函数。其中两个是 `ctype.h` 库中 `toupper()` 和\
  \ `tolower()` 的宽字符等价函数。第三个是可扩展版本，它使用语言环境中的 `LC_CTYPE` 设置来确定哪些字符被视为大写或小写。第四个为第三个提供合适的分类参数。表\
  \ RS.V.54 列出了这些函数。\n\n![Image](img/rs-vtab54.jpg)\n\n表 RS.V.54 宽字符转换函数\n\n### 第\
  \ VI 节：扩展整数类型\n\n如第 3 章“数据和 C”所述，C99 头文件 `inttypes.h` 为各种整数类型提供了一套系统的替代名称。这些名称比标准名称更清晰地描述了类型的特性。例如，类型\
  \ `int` 可能是 16 位、32 位或 64 位，但 `int32_t` 类型始终是 32 位。\n\n更精确地说，`inttypes.h` 头文件定义了可与\
  \ `scanf()` 和 `printf()` 一起使用的宏，用于读写这些类型的整数。该头文件包含了 `stdlib.h` 头文件，后者提供了实际的类型定义。格式化宏是字符串，可以与其他字符串连接以产生正确的格式化指令。\n\
  \n这些类型使用 `typedef` 定义。例如，一个使用 32 位 `int` 的系统可能会使用以下定义：\n\n```\ntypedef int int32_t;\n\
  ```\n\n格式说明符使用 `#define` 指令定义。例如，一个使用上述 `int32_t` 定义的系统可能有以下定义：\n\n点击此处查看代码图片\n\n\
  ```\n#define PRId32 \"d\"   // 输出说明符\n#define SCNd32 \"d\"   // 输入说明符\n```\n\n使用这些定义，您可以声明一个扩展整数变量，输入一个值，并按如下方式显示：\n\
  \n点击此处查看代码图片\n\n```\nint32_t cd_sales;  // 32 位整数\nscanf(\"%\" SCNd32, &cd_sales);\n\
  printf(\"CD sales = %10\" PRId32 \" units\\n\", cd_sales);\n```\n\n然后，字符串连接会（如果需要）将字符串组合成最终的控制字符串。因此，上述代码会被转换为：\n\
  \n点击此处查看代码图片\n\n```\nint cd_sales;  // 32 位整数\nscanf(\"%d\", &cd_sales);\nprintf(\"\
  CD sales = %10d units\\n\", cd_sales);\n```\n\n如果将原始代码移到一个使用 16 位 `int` 的系统，该系统可能会将\
  \ `int32_t` 定义为 `long`，将 `PRId32` 定义为 `\"ld\"`，将 `SCNd32` 定义为 `\"ld\"`。但您仍可使用相同的代码，并知道它使用的是\
  \ 32 位整数。\n\n本参考节的其余部分列出了扩展类型以及表示类型限制的格式说明符和宏。\n\n#### 精确宽度类型\n\n一组 `typedef` 标识了具有精确大小的类型。有符号类型的一般形式为\
  \ `int`N`_t`，无符号类型为 `uint`N`_t`，其中 N 表示位数。但请注意，并非所有系统都支持所有类型。例如，可能存在一个系统，其最小可用内存大小为\
  \ 16 位；这样的系统将不支持 `int8_t` 和 `uint8_t` 类型。格式宏对有符号类型可以使用 `d` 或 `i`，因此 `PRIi8` 和 `SCNi8`\
  \ 也可用。对于无符号类型，可以用 `o`、`x` 或 `X` 替换 `u`，从而获得 `%o`、`%x` 或 `%X` 说明符代替 `%u`。例如，可以使用\
  \ `PRIX32` 以十六进制格式打印 `uint32_t` 类型的值。表 RS.VI.1 列出了精确宽度类型、格式说明符和值限制。\n\n![Image](img/rs-v1tab01.jpg)\n\
  \n表 RS.VI.1 精确宽度类型\n\n#### 最小宽度类型\n\n最小宽度类型保证类型至少具有特定位数的大小。这些类型始终存在。例如，不支持 8 位单元的系统可以将\
  \ `int_least_8` 定义为 16 位类型。表 RS.VI.2 列出了最小宽度类型、格式说明符和值限制。\n\n![Image](img/rs-v1tab02.jpg)\n\
  \n表 RS.VI.2 最小宽度类型\n\n#### 最快最小宽度类型\n\n\n\n\n\n对于特定的系统，某些整数表示法可能比其他的更快。例如，`int_least16_t`\
  \ 可能被实现为 `short`，但系统使用 `int` 类型进行算术运算可能会更快。因此，`inttypes.h` 还定义了用于表示至少特定位数的最快类型。这些类型始终存在。在某些情况下，可能没有明确的最快之选；在这种情况下，系统简单地指定了这些选择中的一种。表\
  \ RS.VI.3 列出了最快的最小宽度类型、格式说明符和取值范围。\n\n![Image](img/rs-v1tab03.jpg)\n\n表 RS.VI.3\
  \ 最快的最小宽度类型\n\n## 最大宽度类型\n\n有时，你可能需要可用的最大的整数类型。表 RS.VI.4 列出了这些类型。事实上，这些类型可能比 `long\
  \ long` 或 `unsigned long long` 更宽，因为系统可能会提供比所需类型更宽的额外类型。\n\n![Image](img/rs-v1tab04.jpg)\n\
  \n表 RS.VI.4 最大宽度类型\n\n## 可以存储指针值的整数\n\n`inttypes.h` 头文件（通过包含的 `stdint.h` 头文件）定义了两种整数类型，列在\
  \ 表 RS.VI.5 中，可以准确地存储指针值。也就是说，如果你将 `void *` 类型的值赋值给这些类型之一，然后将整数类型赋值回指针，则不会丢失信息。这其中一个或两种类型都可能不存在。\n\
  \n![Image](img/rs-v1tab05.jpg)\n\n表 RS.VI.5 用于存储指针值的整数类型\n\n## 扩展整数常量\n\n你可以使用 `L`\
  \ 后缀表示长常量，例如 `445566L`。如何指示一个常量是 `int32_t` 类型呢？使用在 `inttypes.h` 中定义的宏。例如，表达式 `INT32_C(445566)`\
  \ 展开为类型 `int32_t` 常量。本质上，该宏是对底层类型的类型强制转换——即在特定实现中表示 `int32_t` 的基本类型。\n\n宏名通过获取类型名称、将\
  \ `_t` 替换为 `_C` 并将所有字母大写来形成。例如，要使 `1000` 成为类型 `uint_least64_t` 常量，使用表达式 `UINT_LEAST64_C(1000)`。\n\
  \n## VII 节：扩展字符支持\n\nC 语言最初的设计并不是一种国际化编程语言。它的字符选择是基于或或标准的美国键盘。然而，C 的国际流行导致了多种支持不同且更大字符集的扩展。参考手册的这部分提供了这些新增内容的概述。\n\
  \n### 三连字符序列 (Trigraph Sequences)\n\n某些键盘不提供 C 中使用的所有符号。因此，C 通过一组三个字符的序列提供了若干符号的替代表示，这些序列称为*三连字符序列*。表\
  \ RS.VII.1 列出了这些三连字符。\n\n![Image](img/rs-v11tab01.jpg)\n\n表 RS.VII.1 三连字符序列\n\n\
  C 会将源文件中所有这些三连字符的出现（即使是在引号字符串内）替换为相应的符号。因此，\n\n点击此处查看代码图像\n\n```\n??=include <stdio.h>\n\
  \n??=define LIM 100\n\nint main()\n\n??<\n\n    int q??(LIM??);\n\n    printf(\"\
  More to come.??/n\");\n\n    ...\n\n??>\n```\n\n变为以下内容：\n\n点击此处查看代码图像\n\n```c\n\
  #include <stdio.h>\n\n#define LIM 100\n\nint main()\n\n{\n\n    int q[LIM];\n  \
  \  printf(\"More to come.\\n\");\n    ...\n}\n```\n\n你可能需要开启编译器标志来激活此功能。\n\n###\
  \ 双连字符 (Digraphs)\n\n由于三连字符系统的笨拙，C99 提供了两个字符的标记，称为*双连字符*，它们可以代替某些标准的 C 标点符号。表 RS.VII.2\
  \ 列出了这些双连字符。\n\n![Image](img/rs-v11tab02.jpg)\n\n表 RS.VII.2 双连字符\n\n与三连字符不同，引号字符串内的双连字符没有特殊含义。因此，\n\
  \n```c\n%:include <stdio.h>\n\n%:define LIM 100\n\nint main()\n\n<%\n\n    int q<:LIM:>;\n\
  \n    printf(\"More to come.:>\");\n\n    ...\n\n%>\n```\n\n行为与以下内容相同：\n\n点击此处查看代码图像\n\
  \n```c\n#include <stdio.h>\n\n#define LIM 100\n\nint main()\n\n{\n\n    int q[LIM];\n\
  \    printf(\"More to come.\");\n    ...\n}\n```\n\n（注：原文中存在重复的“与三连字符不同，引号字符串内的双连字符没有特殊含义...”段落，翻译时已按要求去重。）\n\
  \n\n\n\n\n国际标准化组织（ISO）建立了一个工作组来开发 `ISO 10646`，这也是一种用于多语言文本编码的标准。`ISO 10646` 组与 Unicode\
  \ 组自 1991 年以来一直合作工作，以保持各自的标准同步。\n\n***\n\nUCN 序列有两种形式。第一种是 `\\u` 十六进制字（hexquad），其中十六进制字是四个十六进制数字的序列；例如\
  \ `\\u00F6`。第二种是 `\\U` 十六进制字对；`\\U0000AC01` 就是一个例子。由于每个十六进制数字对应四位，`\\u` 形式可以用于由\
  \ 16 位整数表示的代码，而 `\\U` 形式可以用于由 32 位整数表示的代码。\n\n如果你的系统实现了 UCN 并且在扩展字符集中包含了所需的字符，则可以在字符串、字符常量和标识符中使用\
  \ UCN：\n\n点击此处查看代码图像\n\n```\nwchar_t value\\u00F6\\u00F8 = L'\\u00f6';\n```\n\n\
  ### 宽字符\n\nC99 通过 `wchar.h` 和 `wctype.h` 库，通过宽字符为更大的字符集提供了更多支持。这些头文件将 `wchar_t`\
  \ 定义为一种整数类型；其具体类型取决于实现。它的预期用途是存储来自基本字符集超集的扩展字符集的字符。根据定义，`char` 类型足以处理基本字符集。`wchar_t`\
  \ 类型可能需要更多位来处理更大范围的代码值。例如，`char` 可能是 8 位的字节，而 `wchar_t` 可能是 16 位的 `unsigned short`。\n\
  \n宽字符常量和字符串字面量以 `L` 前缀指示，你可以使用 `%lc` 和 `%ls` 饰符来显示宽字符数据：\n\n点击此处查看代码图像\n\n```\n\
  wchar_t wch = L'I';\n\nwchar_t w_arr[20] = L\"am wide!\";\n\nprintf(\"%lc %ls\\\
  n\", wch, w_arr);\n```\n\n例如，如果 `wchar_t` 被实现为 2 字节单元，则 `'I'` 的 1 字节代码将存储在 `wch`\
  \ 的低位字节中。非标准字符可能需要两个字节来存储字符代码。你可以使用通用字符编码，例如来指示代码值超出 `char` 范围的字符：\n\n点击此处查看代码图像\n\
  \n```\nwchar_t w = L'\\u00E2'; /* 16 位代码值 */\n```\n\n`wchar_t` 值的数组可以包含一个宽字符字符串，每个元素存储单个宽字符代码。代码值为\
  \ `0` 的 `wchar_t` 值是空字符的 `wchar_t` 等效值，被称为*空宽字符*（null wide character）。它用于终止宽字符字符串。\n\
  \n你可以使用 `%lc` 和 `%ls` 说明符读取宽字符：\n\n```\nwchar_t wch1;\n\nwchar_t w_arr[20];\n\n\
  puts(\"Enter your grade:\");\n\nscanf(\"%lc\", &wch1);\n\nputs(\"Enter your first\
  \ name:\");\n\nscanf(\"%ls\",w_arr);\n```\n\n`wchar.h` 头文件提供了进一步的宽字符支持。特别是它提供了宽字符\
  \ I/O 函数、宽字符转换函数和宽字符字符串处理函数。大多数情况下，它们是现有函数的宽字符等效版本。例如，你可以使用 `fwprintf()` 和 `wprintf()`\
  \ 进行输出，使用 `fwscanf()` 和 `wscanf()` 进行输入。主要区别在于这些函数需要宽字符控制字符串，并且处理的是宽字符输入输出流。例如，以下内容以宽字符序列显示信息：\n\
  \n点击此处查看代码图像\n\n```\nwchar_t *pw = L\"Points to a wide-character string\";\n\nint\
  \ dozen = 12;\n\nwprintf(L\"Item %d: %ls\\n\", dozen, pw);\n```\n\n类似地，还有 `getwchar()`、`putwchar()`、`fgetws()`\
  \ 和 `fputws()` 函数。头文件定义了一个 `WEOF` 宏，其作用与 `EOF` 在字节定向 I/O 中的作用相同。它必须是一个不对应于任何有效字符的值。由于\
  \ `wchar_t` 类型的所有值都可能是有效字符，库定义了一个 `wint_t` 类型，它可以包含所有 `wchar_t` 值加上 `WEOF`。\n\n\
  还有与 `string.h` 库函数等效的内容。例如，`wcscpy(ws2, ws1)` 将 `ws1` 指向的宽字符字符串拷贝到 `ws2` 指向的宽字符数组。同样，还有一个用于比较宽字符串的\
  \ `wcscmp()` 函数，以此此类推。\n\n`wctype.h` 头文件增加了字符分类函数。例如，`iswdigit()` 在其宽字符参数为数字时返回真，而\
  \ `iswblank()` 函数在其宽字符参数为数字时也返回真。\n\n\n\n\n\n国际电工委员会（IEC）发布了一项关于浮点数计算的标准（`IEC 60559`）。该标准讨论了浮点格式、精度、`NaNs`、无穷大、舍入实践、转换、异常、推荐的函数和算法等。C99\
  \ 接受该标准作为 C 语言实现浮点计算的指南。C99 对浮点设施的大多数新增内容都是属于这项工作的一部分，例如 `fenv.h` 头文件和几个新的数学函数。此外，`float.h`\
  \ 头文件定义了几个与 IEC 浮点模型相关的宏。\n\n## 浮点数模型\n\n让我们快速查看浮点数模型。该标准将浮点值 `x` 视为某个基数的幂乘以该基数下的分数，类似于\
  \ C 语言中的 E 计数法（E-notation），其中我们可以将 `876.54` 写为 `0.87654E3`。正如你预期的那样，形式化的表示看起来更加复杂：\n\
  \n![Image](img/990equ01.jpg)\n\n简而言之，这将一个数字表示为基数 `b` 的幂（或指数）`e` 乘以尾数（significand，一个多位分数）。\n\
  \n以下是各个组件的含义：\n\n* `s` 是符号（±1）。\n* `b` 是基数（`radix`），或使用的数字底。最常见的值是 2，因为浮点处理器通常使用二进制数学。\n\
  * `e` 代表整数指数。（不应与用作自然对数底的数值常量 `e` 混淆）。它将被限制在一个具有最小值和最大值的范围内。这些值将取决于用于存储指数的位数。\n\
  * `f[k]` 代表基数 `b` 的可能数字；例如，在二 进制中，可能的数字是 0 和 1；在十六进制中，可能的数字是 0 到 F。\n* `p` 是精度，即表示尾数时使用的基数\
  \ `b` 数字位数。其值将受限于用于存储尾数的位数。\n\n理解这种表示法是理解 `float.h` 和 `fenv.h` 内容的关键，因此让我们来看两个说明浮点表示法如何工作的示例。\n\
  \n首先，假设基数 `b`（或基数）为 10。假设精度 `p` 为 5。那么值 `24.51` 可以这样写成：\n\n(+1)10³(2/10 + 4/100\
  \ + 5/1000 + 1/10000 + 0/100000)\n\n计算机假设它可以存储十进制数字，可以存储符号、指数 3 以及五个 `f[k]` 值 2,\
  \ 4, 5, 1 和 0。（在这里 `f[1]` 是 2，`f[2]` 是 4，等等）。因此，尾数是 `0.24510`。将它乘以 `10³` 得到 `24.51`。\n\
  \n接下来，假设（更常见的情况）基数 `b` 为 2。假设 `p` 为 7，指数为 5，尾数存储为 `1011001`（使用 7 个二进制位，如 `p` 所示）。并假设符号为正。那么我们可以根据上面的公式构建该数字：\n\
  \nx = (+1)2⁵(1/2 +0/4 + 1/8 + 1/16 + 0/32 + 0/64 + 1/128)\n\n= 32(1/2 +0/4 + 1/8\
  \ + 1/16 + 0/32 + 0/64 + 1/128)\n\n= 16 + 0 + 4 + 2 +0 + 0 + ¼ = 22.25\n\n`float.h`\
  \ 中的许多宏引用了这种表示法。例如，`FLT_RADIX` 是使用的基数 `b`，而 `FLT_MANT_DIG` 是 `float` 值中尾数的基数 `b`\
  \ 位 `p`。\n\n## 规格化值与非规格化值\n\n*规格化浮点值*（normalized floating-point value）的概念起着重要作用，让我们来研究一下。为了简单起见，假设系统使用基数\
  \ 10（`b` = `FLT_RADIX` = 10），且尾数对于 `float` 值使用 5 个十进制数字（`p` = `FLT_MANT_DIG` = 5）。（标准要求的精度高于此，但我们的简化声明允许我们忽略这一要求。）考虑以下表示值\
  \ 31.841 的方法：\n\n* 指数 = 3，尾数 = .31841 (.31841E3)\n* 指数 = 4，尾数 = .03184 (.03184E4)\n\
  * 指数 = 5，尾数 = .00318 (.00318E5)\n\n显然，第一种方法精确，因为它使用了尾数中所有的可用数字。规格化浮点非零值是指尾数的第一位非零的值，这也是浮点值通常存储的方式。\n\
  \n现在假设最小指数（`FLT_MIN`）为 -10。那么尾数是 `0.24510`。将它乘以 `10³` 得到 `24.51`。\n\n`float.h` 中的许多宏引用了这种表示法。例如，`FLT_RADIX`\
  \ 是使用的基数 `b`，而 `FLT_MANT_DIG` 是 `float` 值中尾数的基数 `b` 位 `p`。\n\n\n\n\n\n`STDC_IEC_559_COMPLEX__`\n\
  \n如果实现遵循兼容 IEC 60559 的复数算术，则该宏被条件定义为常量 1。\n\n如果实现没有定义这些宏，则无法保证其符合 IEC 60559 标准。\n\
  \n### fenv.h 头文件\n\n`fenv.h` 头文件提供了与浮点数环境交互的手段。也就是说，它允许你设置浮点控制模式值，这些值控制浮点运算的发生方式；它还允许你确定浮点状态标志（或“异常”，`exceptions`）的值，这些标志报告有关算术运算结果影响的信息。控制模式设置的一个示例是指定用于数字舍入的方法。状态标志的一个示例是，当操作产生浮点溢出时会被设置的标志。设置状态标志的操作被描述为“抛出异常”（`raising\
  \ an exception`）。\n\n状态标志和控制模式只有在硬件支持它们时才有意义。例如，如果硬件没有该选项，你就无法更改舍入方法。\n\n你通过使用预处理器指令来开启支持：\n\
  \n```\n#pragma STDC FENV_ACCESS ON\n```\n\n支持将一直持续到程序到达包含该 pragma 的块结束，或者如果 pragma\
  \ 是外部的，则持续到文件或翻译单元的结束。或者，你可以使用以下指令来关闭支持：\n\n```c\n#pragma STDC FENV_ACCESS OFF\n\
  ```\n\n你也可以发布以下 pragma：\n\n点击此处查看代码图像\n\n```c\n#pragma STDC FENV_ACCESS DEFAULT\n\
  ```\n\n这会恢复编译器的默认状态，该状态取决于具体实现。\n\n这种机制对于涉及关键浮点运算的人员来说非常重要，但对普通用户来说意义有限，因此本附录不再详细介绍细节。\n\
  \n### STDC FP_CONTRACT Pragma\n\n某些浮点处理器可以将包含多个操作符的浮点表达式收缩为单一操作。例如，处理器可能能够一步计算以下表达式的值：\n\
  \n```\nx*y - z\n```\n\n这提高了计算速度，但可能会降低计算的可预测性。`STDC FP_CONTRACT` pragma 允许你开启或关闭此功能。默认状态取决于实现。\n\
  \n要为特定的计算关闭收缩功能，然后重新开启，你可以这样做：\n\n```c\n#pragma STDC FP_CONTRACT OFF\n\nval = x\
  \ * y - z;\n\n#pragma STDC FP_CONTRACT ON\n```\n\n### math.h 库的扩展\n\nC90 数学库大部分声明了具有\
  \ `double` 类型参数和 `double` 类型返回值的函数，如下所示：\n\n```c\ndouble sin(double);\ndouble sqrt(double);\n\
  ```\n\nC99 和 C11 库提供了所有这些函数的 `float` 类型和 `long double` 类型版本。这些函数在名称中使用 `f` 或 `l`\
  \ 后缀，如下：\n\n点击此处查看代码图像\n\n```c\nfloat sinf(float);               /* sin() 的 float\
  \ 版本 */\nlong double sinl(long double);  /* sin() 的 long double 版本 */\n```\n\n拥有不同精度层级的函数族，允许你根据特定目的选择最高效的类型和函数组合。\n\
  \nC99 还添加了几若干在科学、工程和数学计算中常用的函数。表 RS.V.14 列出了所有数学函数的 `double` 类型版本，并标识了 C99 添加的内容。在许多情况下，这些函数返回的值可以使用现有函数计算出来，但新函数计算得更快或更准确。例如，`log1p(x)`\
  \ 表示的值与 `log(1 + x)` 相同，但 `log1p(x)` 使用了不同的算法，该算法对于 `x` 的小值更准确。因此，通常情况下你会使用 `log()`\
  \ 函数进行计算，如果高精度对于 `x` 的小值至关重要，你会使用 `log1p()`。\n\n这些这些外，数学库还定义了与数字分类和舍入相关的常量和函数。例如，一个值可以被分类为无限、非数字（`NaN`）、正规数、非正规数和真零。（`NaN`\
  \ 是一个表示值不是数字的特殊值；例如，`asin(2.0)` 返回 `NaN`，因为 `asin()` 仅针对 `-1` 到 `1` 范围内的参数定义。非正规数是指值小于全精度表示的最小数。）还有一些专门的比较函数，当一个或多个参数为异常值时，它们的行为与标准关系运算符不同。\n\
  \n你可以使用 C99 的分类方案来检测计算的异常。例如，来自 `math.h` 的 `isnormal()` 宏在当参数为正规数时返回真。以下是使用该函数在数字变为非正规数时终止循环的代码：\n\
  \n点击此处查看代码图像\n\n```c\n#include <math.h>  // 用于 isnormal()\n\n...\n\nfloat num =\
  \ 1.7e-19;\n\nfloat numprev = num;\n\nwhile (isnormal(num))  // 当 num 具有全浮点精度时\n\
  {\n    numprev = num;\n    num /= 13.7f;\n}\n```\n\n### 复数支持\n\n`STDC_IEC_559_COMPLEX__`\n\
  \n如果实现遵循兼容 IEC 60559 的复数算术，则该宏被条件定义为常量 1。\n\n如果实现没有定义这些宏，则无法保证其符合 IEC 60559 标准。\n\
