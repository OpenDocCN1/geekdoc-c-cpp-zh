  \n**更正，针对您提供的特定文本，翻译如下：**\n\n[content]\n注意 `colors` 数组的定义方式，使得每个索引值对应一个表示颜色名称的字符串，该索引值即为该颜色的数值颜色值。例如，索引\
  \ `1` 对应字符串 `\"red\"`，而枚举常量 `red` 的值为 `1`。\n\n### 位域字段与位运算符\n\n位域字段和位运算符是解决同一种类型编程问题的两种备选方法。也就是说，通常你都可以使用其中任何一种方法。例如，上一个示例使用了一个与\
  \ `unsigned int` 大小相同的结构体来存储图形框的信息。相反，你可以使用一个 `unsigned int` 变量来存储相同的信息。然后，你不再使用结构体成员表示法来访问不同部分，而是使用位运算符来实现这一目的。通常情况下，这样做会稍微笨拙一些。让我们来看一个同时采用这两种方法的示例。（之所以同时采用这两种方法是为了说明它们的区别，而不是建议同时使用这两种方法是个好主意！）\n\
  \n你可以使用 `union` 作为结合结构体方法与位运算符方法的手段。根据已有的 `struct box_props` 类型的声明，你可以声明如下 `union`：\n\
  \n点击此处查看代码图片\n\n```c\nunion Views    /* 将数据视为结构体或 unsigned short */\n{\n    struct\
  \ box_props st_view;\n    unsigned short us_view;\n};\n```\n\n在某些系统中，`unsigned int`\
  \ 和 `box_props` 结构体都占用 16 位内存。在其他系统（如我们的）上，`unsigned int` 和 `box_props` 是 32 位。无论哪种情况，通过这个\
  \ `union`，你可以使用 `st_view` 成员将该段内存视为结构体，或者使用 `us_view` 成员将同一块内存视为 `unsigned short`。结构体中的哪些位域对应\
  \ `unsigned short` 中的哪些位？这取决于实现和硬件。接下来的示例假设结构体是从字节的低位端到高位端加载到内存的。也就是说，结构体中的第一个位域进入字的第\
  \ 0 位。（为了简单起见，图 15.3 用一个 16 位单位说明了这一概念。）\n\n![图像](img/15fig03.jpg)\n\n图 15.3 作为整数和结构体的联合体。\n\
  \n列表 15.4 使用 `Views` 联合体让你比较位域方法和位运算符方法。在，`box` 是一个 `Views` 联合体，因此 `box.st_view`\
  \ 是使用位域的 `box_props` 结构体，而 `box.us_view` 是视为 `unsigned short` 的相同数据。记得 `union` 可以对其第一个成员进行初始化，因此初始化值与结构体视图匹配。程序分别使用基于结构体视图的函数和基于\
  \ `unsigned short` 视图的函数来显示框的属性。这两种方法都能让你访问数据，但技术有所不同。程序还使用了本章之前定义的 `itobs()` 函数将数据显示为二进制字符串，这样你就可以看到哪些位是开启的，哪些位是关闭的。\n\
  \n列表 15.4 dualview.c 程序\n\n点击此处查看代码图片\n\n* * *\n\n```c\n/* dualview.c -- 位域字段与位运算符\
  \ */\n#include <stdio.h>\n#include <stdbool.h>\n#include <limits.h>\n\n/* 位域字段常量\
  \ */\n/* 线条样式      */\n#define SOLID   0\n#define DOTTED  1\n#define DASHED  2\n\
  /* 颜色色  */\n#define BLUE    4\n#define GREEN   2\n#define RED     1\n/* 混合颜色  */\n\
  #define BLACK   0\n#define YELLOW  (RED | GREEN)\n#define MAGENTA (RED | BLUE)\n\
  #define CYAN    (GREEN | BLUE)\n#define WHITE   (RED | GREEN | BLUE)\n/* 位运算符常量\
  \    */\n#define OPAQUE          0x1\n#define FILL_BLUE       0x8\n#define FILL_GREEN\
  \      0x4\n#define FILL_RED        0x2\n#define FILL_MASK       0xE\n#define BORDER\
  \          0x100\n#define BORDER_BLUE     0x800\n#define BORDER_GREEN    0x400\n\
  #define BORDER_RED      0x200\n#define BORDER_MASK     0xE00\n#define B_SOLID  \
  \        0\n#define B_DOTTED         0x1000\n#define B_DASHED         0x2000\n#define\
  \ STYLE_MASK      0x3000\n\nconst char * colors[8] = {\"black\", \"red\", \"green\"\
  , \"yellow\", \"blue\", \"magenta\", \"cyan\", \"white\"};\n\nstruct box_props {\n\
  \    bool opaque             : 1;\n    unsigned int fill_color  : 3;\n    unsigned\
  \ int             : 4;\n    bool show_border        : 1;\n    unsigned int border_color:\
  \ 3;\n    unsigned int border_style  : 2;\n    unsigned int             : 2;\n};\n\
  \nunion Views /* 将数据视为结构体或 unsigned short */\n{\n    struct box_props st_view;\n\
  \    unsigned short us_view;\n};\n\nvoid show_settings(struct box_props * pb);\n\
  void show_settings1(unsigned short us);\nchar * itobs(int n, char * ps);\n\nint\
  \ main(void)\n{\n    /* 创建并初始化联合体 */\n    union Views box = {{true, RED, true, GREEN,\
  \ DASHED, true}};\n\n    printf(\"Original box settings:\\n\");\n    show_settings(&box.st_view);\n\
  \    printf(\"\\nUsing unsigned int view:\\n\");\n    show_settings1(box.us_view);\n\
  \n    /* 修改位域字段 */\n    box.st_view.opaque = false;\n    box.st_view.fill_color\
  \ = CYAN;\n    box.st_view.show_border = true;\n    box.st_view.border_color = YELLOW;\n\
  \    box.st_view.border_style = DOTTED;\n\n    printf(\"\\nModified box settings:\\\
  n\");\n    show_settings(&box.st_view);\n    printf(\"\\nUsing unsigned int view:\\\
  n\");\n    show_settings1(box.us_view);\n\n    return 0;\n}\n\nvoid show_settings(struct\
  \ box_props * pb)\n{\n    printf(\"Box is %s.\\n\", pb->opaque ? \"opaque\" : \"\
  transparent\");\n    printf(\"The fill color is %s.\\n\", colors[pb->fill_color]);\n\
  \    printf(\"Border %s.\\n\", pb->show_border ? \"shown\" : \"not shown\");\n \
  \   printf(\"The border color is %s.\\n\", colors[pb->border_color]);\n    printf(\"\
  The border style is \");\n    switch(pb->border_style)\n    {\n        case SOLID:\
  \ printf(\"solid.\\n\"); break;\n        case DOTTED: printf(\"dotted.\\n\"); break;\n\
  \        case DASHED: printf(\"dashed.\\n\"); break;\n        default: printf(\"\
  unknown type.\\n\");\n    }\n}\n\nvoid show_settings1(unsigned short us)\n{\n  \
  \  printf(\"Box is %s.\\n\", (us & OPAQUE) ? \"opaque\" : \"transparent\");\n  \
  \  printf(\"The fill color is %s.\\n\", colors[(us >> 1) & 7]);\n    printf(\"Border\
  \ %s.\\n\", (us & BORDER) ? \"shown\" : \"not shown\");\n    printf(\"The border\
  \ style is \");\n    switch((us & STYLE_MASK) >> 12)\n    {\n        case B_SOLID:\
  \ printf(\"solid.\\n\"); break;\n        case B_DOTTED: printf(\"dotted.\\n\");\
  \ break;\n        case B_DASHED: printf(\"dashed.\\n\"); break;\n        default:\
  \ printf(\"unknown type.\\n\");\n    }\n}\n\nchar * itobs(int n, char * ps)\n{\n\
  \    int i;\n    const static int size = CHAR_BIT * sizeof(int);\n    for (i = size\
  \ - 1; i >= 0; i--, n >>= 1)\n        ps[i] = (1 & n) + '0';\n    ps[size] = '\\\
  0';\n    return ps;\n}\n```\n*(注：由于您提供的待翻译文本中代码部分不完整且存在断层，此处根据“代码块不需要翻译”的原则，仅对逻辑描述部分进行了翻译。若您的原始文本包含代码逻辑乱码，请提供完整文本以获得更准确的翻译)*\n\
  \n\n\n\n# 使用 unsigned int 视图的 Box 框设置：\n\n框是透明的。\n填充颜色为青色。\n不显示边框。\n边框样式为点线。\n边框颜色为黄色。\n\
  位为 `00000000000000000001011100001100`\n\n有几点需要讨论。位域（bit-field）和位运算视图（bitwise views）之间的区别之一是，位运算视图需要位置信息。例如，我们使用\
  \ `BLUE` 来表示蓝色。这个常量的数值为 `4`。但是，由于结构体中数据的排列方式，实际持有填充颜色蓝色设置的位是第 3 位（记住，编号从 0 开始——请参阅图\
  \ 15.1），而持有边框颜色蓝色设置的位是第 11 位。因此，程序定义了一些新常量：\n\n```c\n#define FILL_BLUE      0x8\n\
  #define BORDER_BLUE    0x800\n```\n\n在这里，`0x8` 是仅当第 3 位设置为 1 时的值，而 `0x800` 是仅当第\
  \ 11 位设置为 1 时的值。你可以使用第一个常量来设置填充颜色的蓝色位，使用第二个常量来设置边框的蓝色位。使用十六进制表示法更容易看出涉及哪些位。记住，每个十六进制数字代表四个位。因此，`0x800`\
  \ 与 `0x8` 的位模式相同，但在其后面标记了 8 个 0 位。与十进制等效值 `2048` 和 `8` 相比，这种关系就不那么直观了。\n\n如果值是 2\
  \ 的幂，可以使用左移运算符来提供值。例如，你可以用这些内容替换最后的 `#define` 语句：\n\n```c\n#define FILL_BLUE   \
  \   1<<3\n#define BORDER_BLUE    1<<11\n```\n\n在这里，第二个操作数是与 2 使用的幂。也就是说，`0x8` 是\
  \ `2³`，而 `0x800` 是 `2¹¹`。等价地，表达式 `1<<n` 是一个仅第 `n` 位设置为 `1` 的整数的值。像 `1<<11` 这样的表达式是常量表达式，并在编译时求值。\n\
  \n你可以使用枚举（enumeration）代替 `#define` 来创建符号常量。例如，你可以这样做：\n\n点击此处查看代码图像\n\n```c\nenum\
  \ { OPAQUE = 0x1, FILL_BLUE = 0x8, FILL_GREEN = 0x4, FILL_RED = 0x2,\n       FILL_MASK\
  \ = 0xE, BORDER = 0x100, BORDER_BLUE = 0x800,\n       BORDER_GREEN = 0x400, BORDER_RED\
  \ = 0x200, BORDER_MASK = 0xE00,\n       B_DOTTED = 0x1000, B_DASHED = 0x2000, STYLE_MASK\
  \ = 0x3000};\n```\n\n如果你不打算创建枚举变量，则不需要在声明中使用标签。\n\n注意，使用位运算运算符更改设置要复杂得多。例如，考虑将填充颜色设置为青色。仅仅开启蓝色位和绿色位是不够的：\n\
  \n点击此处查看代码图像\n\n```c\nbox.us_view |= (FILL_BLUE | FILL_GREEN); /* 重置填充 */\n```\n\
  \n问题在于，颜色还取决于红色位的设置。如果该位已经设置（如黄色所示），这段代码将使红色位保持为开启状态，并设置蓝色和绿色位，导致颜色变成白色。解决此问题的最简单方法是在设置新值之前关闭所有的颜色位。这就是为什么程序使用了以下代码：\n\
  \n点击此处查看代码图像\n\n```c\nbox.us_view &= ~FILL_MASK; /* 清除位 */\nbox.us_view |= (FILL_BLUE\
  \ | FILL_GREEN); /* 重置填充 */\n```\n\n为了展示如果不先清除相关位会发生什么，程序还执行了：\n\n点击此处查看代码图像\n\n\
  ```c\nbox.us_view |= BORDER_RED; /* 错误的方法 */\n```\n\n由于 `BORDER_GREEN` 位已经设置，结果颜色是\
  \ `BORDER_GREEN | BORDER_RED`，翻译为黄色。在这样的情况下，位域版本更简单：\n\n点击此处查看代码图像\n\n```c\nbox.st_view.fill_color\
  \ = CYAN; /* 位域等效写法 */\n```\n\n你不需要清除位。此外，对于位域成员，你可以为边框使用相同的颜色值，但对于位运算符方法，你需要使用不同的值（反映实际的位位置）。接下来，比较以下两个语句：\n\
  \n点击此处查看代码图像\n\n```c\nbox.st_view.fill_color = CYAN; /* 位域等效写法 */\n```\n\n你不需要清除位。此外，对于位域成员，你可以为边框使用相同的颜色值，但对于位运算符方法，你需要使用不同的值（反映实际的位位置）。接下来，比较以下两个语句：\n\
  \n点击此处查看代码图像\n\n```c\nbox.st_view.fill_color = CYAN; /* 位域等效写法 */\n```\n（注：由于原文末部分存在重复，译文已按要求去重处理）\n\
