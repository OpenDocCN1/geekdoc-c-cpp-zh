  \ 2013.\n\n这本书由 C++ 的创造者编写，介绍了 C++11 标准。\n\n## 第二节：C 运算符\n\nC 语言拥有丰富的运算符。表 RS.II.1\
  \ 按优先级递减的顺序列出了 C 运算符，并指示了它们的结合方式。另有说明，所有运算符都是二元的（两个操作数）。注意，某些二元和一元运算符，如 `*`（乘法）和\
  \ `*`（间接引用）共享相同的符号但优先级不同。表格之后是每个运算符的摘要。\n\n![Image](img/rs11tab01.jpg)\n\n表 RS.II.1\
  \ C 运算符\n\n### 算术运算符\n\n`+` 将其右侧的值加到其左侧的值。\n\n`+` 作为一元运算符，产生一个与右侧操作数数值相等（且符号相同）的值。\n\
  \n`–` 从其左侧的值中减去其右侧的值。\n\n`–` 作为一元运算符，产生一个与右侧操作数数值相等（但符号相反）的值。\n\n`*` 将其右侧的值乘以其左侧的值。\n\
  \n`/` 将其左侧的值除以其右侧的值。如果两个操作数都是整数，则结果被截断。\n\n`%` 产生其左侧的值除以其右侧的值时的余数（仅限整数）。\n\n`++`\
  \ 将其右侧变量的值加 1（前缀模式）或将其左侧变量的值加 1（后置模式）。\n\n`--` 类似于 `++`，但减去 1。\n\n### 关系运算符\n\n\
  以下列出的每个运算符都比较其左侧的值与其右侧的值：\n\n![Image](img/910tab01.jpg)\n\n#### 关系表达式\n\n一个简单的关系表达式由一个关系运算符和两边的操作数组成。如果关系为真，关系表达式的值为\
  \ `1`。如果关系为假，关系表达式的值为 `0`。这里有两个示例：\n\n`5 > 2` 是真的，值为 `1`。\n\n`(2 + a) == a` 是假的。\n\
  \n### 赋值运算符\n\n`=` 是基础赋值运算符，以下是组合赋值运算符：\n\n`=` 将右侧的值赋值给左侧变量。\n\n`+=` 将右侧的值加到左侧变量上。\n\
  \n`-=` 从左侧变量中减去右侧的值。\n\n`*=` 将左侧变量乘以右侧的值。\n\n`/=` 将左侧变量除以右侧的值。\n\n`%=` 产生左侧变量除以右侧的值时的余数。\n\
  \n`&=` 将左侧变量与右侧值进行按位与运算赋值。\n\n`|=` 将左侧变量与右侧值进行按位或运算赋值。\n\n`^=` 将左侧变量与右侧值进行按位异或运算赋值。\n\
  \n`>>=` 将左侧变量右移右侧位数。\n\n`<<=` 将左侧变量左移右侧位数。\n\n#####示例\n\n`rabbits *= 1.6;` 等同于 `rabbits\
  \ = rabbits * 1.6;`。\n\n### 逻辑运算符\n\n逻辑运算符通常以关系表达式作为操作数。`!` 运算符取一个操作数。其余取两个：一个在左，一个在右。\n\
  \n`&&`   与\n\n`||`   或\n\n`!`   非\n\n#### #### 逻辑表达式\n\n`expression1 && expression2`\
  \ 仅当两个表达式都为真时为真。\n\n`expression1 || expression2` 在其中一个或两个表达式为真时为真。\n\n`!expression`\
  \ 在表达式为假时为真，反之亦然。\n\n##### 逻辑表达式的求值顺序\n\n逻辑表达式从左到右求值。一旦发现使表达式为假的就会停止。\n\n##### 示例\n\
  \n`6 > 2 && 3 == 3` 为真。\n\n`! ( 6 > 2 && 3 == 3 )` 为假。\n\n`x != 0 && 20/x < 5.`\
  \ 只有当 `x` 非零时才计算第二个表达式。\n\n### 指针相关运算符\n\n`&` 是地址运算符。当跟随变量名时，`&` 给出该变量的地址。\n\n\n\
  \n\n\n`*` 是间接引用或解引用运算符。当后面跟着一个指针时，`*` 返回存储在指向地址的值。\n\n### 示例\n\n在这里，`&nurse` 是变量\
  \ `nurse` 的地址：\n\n点击此处查看代码图像\n\n```c\nnurse = 22;\nptr = &nurse; /* 指向 nurse 的指针\
  \ */\nval = *ptr;\n```\n\n最终效果是将值 `22` 赋值给 `val`。\n\n### 符号运算符\n\n`–` 是负号，反转操作数的符号。\n\
  \n`+` 是正号，保持操作数的符号不变。\n\n### 结构体和联合体运算符\n\n结构体（structure）和联合体（union）使用运算符来识别单个成员。成员运算符用于结构体和联合体，间接成员运算符则用于指向结构体或联合体的指针。\n\
  \n### 成员运算符\n\n成员运算符（`.`）用于结构体或联合体名称，指定该结构体或联合体的成员。如果 `name` 是结构体的名称，`member` 是结构体模板指定的成员，那么\
  \ `name.member` 就标识该结构体的该成员。`name.member` 的类型是 `member` 所指定的类型。成员运算符也可以以相同的方式用于联合体。\n\
  \n### 示例\n\n```c\nstruct {\n    int code;\n    float cost;\n} item;\n\nitem.code\
  \ = 1265;\n```\n\n该语句为结构体 `item` 的 `code` 成员赋值。\n\n### 间接成员运算符（或结构体指针运算符）\n\n间接成员运算符（`–>`）用于指向结构体或联合体的指针，以识别该结构体或联合体的成员。假设\
  \ `ptrstr` 是指向结构体的指针，`member` 是结构体模板指定的成员。那么 `ptrstr->member` 就标识指向的结构中的成员。间接成员运算符也可以以相同的方式用于联合体。\n\
  \n### 示例\n\n```c\nstruct {\n    int code;\n    float cost;\n} item, * ptrst;\n\n\
  ptrst = &item;\nptrst->code = 3451;\n```\n\n这段程序片段为 `item` 的 `code` 成员赋值了一个值。以下三个表达式是等价的：\n\
  \n点击此处查看代码图像\n\n```c\nptrst->code  item.code  (*ptrst).code\n```\n\n### 位运算符\n\n\
  以下所有位运算符（`~` 除外）都是二元运算符：\n\n`~` 是一元运算符，产生一个与操作数每个比特位都取反的值。\n\n`&` 是按位与（AND），只有当两个操作数的对应位都为\
  \ 1 时，生成的结果中该位才置为 1。\n\n`|` 是按位或（OR），当两个操作数的对应位中有一个或两个都为 1 时，生成的结果中该位即置为 1。\n\n\
  `^` 是按位异或（EXCLUSIVE OR），当两个操作数的对应位中仅有一个为 1（但不同不同为）时，生成的结果中该位才置为 1。\n\n`<<` 是左移，通过将左操作数的位向左移动右操作数指定的位数来产生一个值。空出的位置用\
  \ 0 填充。\n\n`>>` 是右移，通过将左操作数的位向右移动右操作数指定的位数来产生一个值。对于无符号整数，空出的位置用 0 填充。对于符号值的行为取决于具体实现。\n\
  \n### 示例\n\n假设你有以下内容：\n\n```c\nint x = 2;\nint y = 3;\n```\n\n那么 `x & y` 的值为 `2`，因为只有\
  \ `x` 和 `y` 的第 1 位都是“开启”的。同样，`y<<x` 的值为 `12`，因为这是将 `3` 的位模式向左移动两位后得到的值。\n\n### 杂运算符\n\
  \n`sizeof` 产生其右侧操作数的大小，以 `char` 值的大小为单位。通常，一个 `char` 值的大小为 1 字节。操作数可以是括号中的类型说明符，如\
  \ `sizeof (float)`，也可以是特定变量、数组等的名称，如 `sizeof foo`。`sizeof` 表达式的类型为 `size_t`。\n\n\
  `_Alignof` (C11) 产生其操作数所指定类型的对齐要求。某些系统要求特定类型存储在某个特定值（如 4）的倍数地址上。这个整数就是对齐要求。\n\n\
  `(type)` 是强制类型转换运算符，将紧随其后的值转换为括号内关键字指定的类型。例如，`(float) 9` 将整数 `9` 转换为浮点数 `9.0`。\n\
  \n`,` 是逗号运算符；它将两个表达式连接成一个，并保证左侧表达式先求值。整个表达式的值是右侧表达式的值。该运算符通常用于在 `for` 循环控制表达式包含更多信息。\n\
  \n### 示例\n\n点击此处查看代码图像\n\n```c\nfor (...) (...)\n```\n\n### 第三节：基本类型和存储类\n\n####\
  \ 总结：基本类型\n\nC 基本类型分为两类：整数型和浮点型。\n\n#### 关键字\n\n基本类型包含以下内容：`int`, `long`, `short`,\
  \ `unsigned`, `char`, `float`, `double`, `signed`。\n\n##### 符号整数\n\n符号整数可以有正值或负值：`int`\
  \ 是基本整数。`long` 比 `short` 大，至少为 32 位。某些实现使用 `signed short`。\n\n##### 无符号整数\n\n无符号整数只有零或正值，这扩展了最大数的范围。在所需的类型前使用\
  \ `unsigned`：`unsigned int`, `unsigned long`, `unsigned short` 或 `unsigned long\
  \ long`。`unsigned` 等同于 `int`。\n\n##### 字符\n\n字符是如 `A`、`&` 和 `+` 等符号。根据定义，一个字节内存用于\
  \ `char`。在过去，`char` 通常是 8 位。然而，C 处理更大字符集的能力会导致 16 位甚至 32 位的字节。\n\n`char` 是该类型的关键字。某些实现使用\
  \ `signed char`，另一些使用 `unsigned char`。ANSI C 允许使用 `signed` 和 `unsigned` 来指定你想要的形式。\n\
  \n##### 布尔类型 (C99)\n\nC99 布尔类型是 `_Bool`。它是一种无符号整数类型，可以存储两个值之一：`0` 表示假，`1` 表示真。包含\
  \ `stdbool.h` 头文件允许你使用 `bool` 代替 `_Bool`，用 `true` 代替 `1`，用 `false` 代理替 `0`，使其与 C++\
  \ 兼容。\n\n##### 实数和复数浮点类型\n\nC99 识别两个浮点类型领域：实浮点和复数浮点。这两个领域共同构成了浮点类型。\n\n实浮点数可以有正值或负值。C\
  \ 识别了三种实浮点类型：\n\n`float` 是系统的基本浮点类型。它可以准确表示至少六位有效数字。通常，`float` 使用 32 位。\n\n`double`\
  \ 是存储浮点数的（可能）更大的单元。它比 `float` 允许更多的有效数字和可能更大的指数。它可以准确表示至少 10 位有效数字。通常，`double` 使用\
  \ 64 位。\n\n\n\n\n\n`long double` 是一种（可能）更大的浮点数存储单元。与 `double` 相比，它可能允许更多的有效数字，并可能有更大的指数。\n\
  \n复数有两个组成部分：实部和虚部。C99 在内部用一个双元素数组来表示复数，第一个组件是实部，第二个组件是虚部。共有三种复数类型：\n\n`float _Complex`\
  \ 用 `float` 类型的值表示实部和虚部。\n\n`double _Complex` 用 `double` 类型的值表示实部和虚部。\n\n`long double\
  \ _Complex` 用 `long double` 类型的值表示实部和虚部。\n\n在每种情况下，前缀类型被称为*相应的实部类型*。例如，`double`\
  \ 是 `double _Complex` 对应的实部类型。\n\n根据 C99，复数类型在自包含环境（freestanding environment）中是可选的，在这种环境中，C\
  \ 程序可以在没有操作系统的情况下运行。在 C11 中，它们在自包含环境和宿主环境中都是可选的。\n\n还有三种虚数类型；这些类型在自包含环境和宿主环境（即 C\
  \ 程序在操作系统下运行的环境）中都是可选的。虚数只有虚部。三种类型列如下：\n\n`float _Imaginary` 用 `float` 类型的值表示虚部。\n\
  \n`double _Imaginary` 用 `double` 类型的值表示虚部。\n\n`long double _Imaginary` 用 `long double`\
  \ 类型的值表示虚部。\n\n复数可以使用实数和值 `I` 进行初始化，`I` 定义在 `complex.h` 中，代表 `i`，即 -1 的平方根：\n\n\
  点击此处查看代码图像\n\n```c\n#include <complex.h>  // 使用 I\n\ndouble _Complex z = 3.0;  \
  \         // 实部 = 3.0, 虚部 = 0\ndouble _Complex w = 4.0 * I;      // 实部 = 0.0, 虚部\
  \ = 4.0\n\ndouble Complex u = 6.0 – 8.0 * I; // 实部 = 6.0, 虚部 = -8.0\n```\n\n本附录稍后讨论的\
  \ `complex.h` 库包含了返回复数实部和虚部的函数。\n\n### 总结：如何声明简单变量\n\n1. 选择你需要的类型。\n2. 为变量选择一个名称。\n\
  3. 使用此格式进行声明语句：\n`type-specifierviable-name;`\n\n类型说明符（type-specifier）由一个或多个类型关键字组成。以下是一些示例：\n\
  \n```c\nint erest;\nunsigned short cash;\n```\n\n4. 若要声明同种类型的多个变量，用逗号分隔变量名：\n\n\
  ```c\nchar ch, init, ans;\n```\n\n5. 你可以在声明语句中初始化变量：\n\n```c\nfloat mass = 6.0E24;\n\
  ```\n\n***\n\n### 总结：存储类\n\n**关键字：**\n`auto`, `extern`, `static`, `register`, `_Thread_local`\
  \ (C11)\n\n**通用注释：**\n变量的存储类决定了它的作用域、链接属性和存储生存期。存储类取决于变量定义的位置以及与其关联的关键字。定义在所有函数之外的变量是外部变量，具有文件作用域、外部链接和静态存储生存期。定义在函数内部的变量是自动变量，除非使用了其他关键字之一。它们具有块作用域、无链接和自动存储生存期。在函数内部使用\
  \ `static` 关键字定义的变量具有块作用域、无链接和静态存储生存期。在函数外部使用 `static` 关键字定义的变量具有文件作用域、内部链接和静态存储生存期。\n\
  \nC11 添加了一个新的存储类限定符：`_Thread_local`。用此限定符的对象具有线程存储生存期，意味着它在声明它的线程生命周期内持续存在，并在线程开始时初始化。因此，此类对象是线程局部的。\n\
  \n**属性：**\n以下总结了存储类的属性：\n\n![图像](img/918tab01.jpg)\n\n请注意，关键字 `extern` 仅用于重新声明在其他地方已定义的变量。在函数外部定义变量的行为使其成为外部变量。\n\
  \n***\n\n除了这些存储类外，C 还提供了内存分配。这些内存是通过通过调用 `malloc()` 系列函数之一来分配的，该函数返回一个可以访问内存的指针。内存将一直保持分配状态，直到调用\
  \ `free()` 或程序终止。任何可以访问该内存指针的函数都可以对内存进行访问。例如，一个函数可以将指针值返回给另一个函数，然后该函数就可以访问该内存。\n\
  \n### 总结：限定符\n\n#### 关键字\n`const`, `volatile`, `restrict`\n\n#### 通用注释\n限定符在某种程度上限制了变量的使用。`const`\
  \ 变量在初始化后无法被更改。编译器不能假设 `volatile` 变量没有被某些外部机构（如硬件更新）更改过。带有 `restrict` 限定的指针被理解为（在特定作用域内）提供了对某块内存的唯一访问权限。\n\
  \n#### 属性\n声明：\n```c\nconst int joy = 101;\n```\n确立了 `joy` 的值固定为 `101`。\n\n声明：\n\
  点击此处查看代码图像\n```c\nvolatile int incoming;\n```\n确立了 `incoming` 的值可能会改变。\n\n声明：\n\
  ```c\nint * const ptr = &joy;\n```\n确立了 `ptr` 可以指向另一个。\n\n原型：\n点击此处查看代码图像\n```c\n\
  void simple (const char * s);\n```\n确立了 `simple()` 不改变 `s` 所指向的值。\n\n声明：\n```c\n\
  void supple(int * pi);\n```\n以及等效的原型：\n```c\nvoid supple(int pi[]);\n```\n确立了 `supple()`\
  \ 不改变 `pi` 的值。\n\n原型：\n点击此处查看代码图像\n```c\nvoid interleave(int * restrict p1, int\
  \ * restrict p2, int n);\n```\n表明 `p1` 和 `p2` 分别对其指向内存块的唯一访问；这意味着这些块之间没有重叠。\n\n\
  ### 第四节：表达式、语句和程序流\n\n#### 总结：表达式与语句\n在 C 中，表达式表示值，语句表示指令。\n\n##### 表达式\n*表达式*是运算符和操作数的组合。最简单的表达式是不带运算符的常量或变量，例如\
  \ `22` 或 `beebop`。更复杂的示例有 `55 + 22` 和 `vap = 2 * (vip + (vup = 4))`。\n\n##### 语句\n\
  *语句*是计算机的命令。任何跟随分号的表达式构成一个语句，但不一定是有意义的。语句可以是简单的也可以是复合的。*简单语句*以分号结束，如示例所示：\n\n![图像](img/920tab02.jpg)\n\
  \n（从技术上说，标准将声明分配独立的类别，而不是将其与语句分组。）\n\n*复合语句*或*块*是由封装在大括号中的一个或多个语句（这些语句本身可以是复合的）组成的。以下\
  \ `while` 语句是一个示例：\n\n```c\nwhile (years < 100)\n{\n    wisdom = wisdom + 1;\n \
  \   printf(\"%d %d\\n\", years, wisdom);\n    years = years + 1;\n}\n```\n\n####\
  \ 总结：while 语句\n\n##### 关键字\n`while`\n\n\n\n\n\n`while` 语句的关键字是 `while`。\n\n### 通用注释\n\
  `while` 语句创建一个循环，该循环会重复执行直到测试表达式变为假或零。`while` 语句是一种**进入条件**（entry-condition）循环；是否再执行一次循环的决定是在遍历循环体*之前*做出的。因此，循环可能永远不会被执行。该形式的语句部分可以是简单语句也可以是复合语句。\n\
  \n### 格式\n```\nwhile (expression)\n    statement\n```\n语句部分将重复，直到表达式变为假或零。\n\n###\
  \ 示例\n点击此处查看代码图像\n\n```c\nwhile (n++ < 100)\n    printf(\" %d %d\\n\",n, 2*n+1);\n\
  \nwhile (fargo < 1000)\n{\n    fargo = fargo + step;\n    step = 2 * step;\n}\n\
  ```\n\n## 总结：for 语句\n\n#### 关键字\n`for` 语句的关键字是 `for`。\n\n### 通用注释\n`for` 语句使用三个由分号隔开的控制表达式来控制循环过程。初始化表达式在执行任何循环语句之前执行一次。如果测试表达式为真（或非零），则循环执行一次。然后求值更新表达式，此时该是再次检查测试表达式的时间了。`for`\
  \ 语句是一种**进入条件**（entry-condition）循环；是否再执行一次循环的决定是在遍历循环体*之前*做出的。因此，循环可能永远不会被执行。该形式的语句部分可以是简单语句也可以是复合语句。\n\
  \n### 格式\n点击此处查看代码图像\n\n```c\nfor (initialize ; test ; update)\n    statement\n\
  ```\n循环将重复，直到 `test` 变为假或零。C99 允许初始化部分包含声明。变量的作用域和生命周期被限制在 `for` 循环内。\n\n### 示例\n\
  点击此处查看代码图像\n\n```c\nfor (n = 0; n < 10 ; ++n)\n    printf(\"%d %d\\n\", n, 2 * n+1);\n\
  \nfor (int k = 0; k < 10 ; ++k)      // C99\n    printf(\"%d %d\\n\", k, 2 * k+1);\n\
  ```\n\n## 总结：do while 语句\n\n#### 关键字\n`do while` 语句的关键字是 `do` 和 `while`。\n\n###\
  \ 通用注释\n`do while` 语句创建一个循环，该循环会执行直到测试表达式变为假或零。`do while` 语句是一种**退出条件**（exit-condition）循环；是否再执行一次循环的决定是在遍历循环体*之后*做出的。因此，循环至少必须执行一次。该形式的语句部分可以是简单语句也可以是复合语句。\n\
  \n### 格式\n```c\ndo\n    statement\nwhile (expression);\n```\n语句部分将重复，直到 `expression`\
  \ 变为假或零。\n\n### 示例\n```c\ndo\n    scanf(\"%d\", &number)\nwhile(number != 20);\n\
  ```\n\n## 总结：使用 if 语句进行选择\n\n#### 关键字\n`if` 语句的关键字是 `if` 和 `else`。\n\n### 通用注释\n\
  在以下每个形式中，语句可以是简单语句也可以是复合语句。“真”表达式，更通地说，是指非零值的表达式。\n\n### 格式 1\n```c\nif (expression)\n\
  \    statement\n```\n如果 `expression` 为真，则执行该语句。\n\n### 格式 2\n```c\nif (expression)\n\
  \    statement1\nelse\n    statement2\n```\n如果 `expression` 为真，则执行 `statement1`。否则，执行\
  \ `statement2`。\n\n### 格式 3\n```c\nif (expression1)\n    statement1\nelse if (expression2)\n\
  \    statement2\nelse\n    statement3\n```\n如果 `expression1` 为真，则执行 `statement1`。如果\
  \ `expression1` 为假但 `expression2` 为真，则执行 `statement2`。否则，如果两个表达式都假，则执行 `statement3`。\n\
  \n### 示例\n点击此处查看代码图像\n\n```c\nif (legs == 4)\n    printf(\"It might be a horse.\\\
  n\");\nelse if (legs > 4)\n    printf(\"It is not a horse.\\n\");\nelse  /* case\
  \ of legs < 4 */\n{\n    legs++;\n    printf(\"Now it has one more leg.\\n\");\n\
  }\n```\n\n## 总结：使用 switch 进行多路选择\n\n#### 关键字\n`switch` 语句的关键字是 `switch`。\n\n###\
  \ 通用注释\n程序控制跳转到带有 `expression` 值的标签所在的语句。随后程序流继续执行剩余的语句，除非再次被重定向。表达式和标签都必须具有整数值（包括\
  \ `char` 类型），且标签必须是常量或仅由常量组成的表达式。如果没有标签匹配表达式的值，控制将跳转到 `default` 语句。\n\n### 格式\n\
  点击此处查看代码图像\n```c\nswitch (expression)\n{\n    case label1: statement1\n    case\
  \ label2: statement2\n    default: statement3\n```\n\n### 示例\n点击此处查看代码图像\n\n```c\n\
  switch (letter)\n{\n    case 'a':\n        printf(\"a is a vowel\\n\");\n    case\
  \ 'e':\n        printf(\"e is a vowel\\n\");\n    case 'c':\n        printf(\"c\
  \ is a consonant\\n\");\n    case 'n':\n        printf(\"n is a consonant\\n\");\n\
  \    default:\n        printf(\"Invalid choice\");\n}\n```\n如果 `letter` 为 `'a'`\
  \ 或 `'e'`，则打印前三个；`'c'` 和 `'n'` 会打印后两个。\n\n## 总结：跳转\n#### 关键字\n`break`、`continue`\
  \ 和 `goto`。\n\n### 通用注释\n`break`、`continue` 和 `goto` 指令导致程序流从一个位置跳转到另一个。\n\n###\
  \ break 命令\n`break` 命令可以用于所有的循环形式以及 `switch`。它导致程序控制跳过所在循环或 `switch` 的剩余部分，并从循环或\
  \ `switch` 之后的语句继续执行。\n\n#### 示例\n点击此处查看代码图像\n```c\nwhile ((ch = getchar()) != EOF)\n\
  {\n    putchar(ch);\n    if (ch == ' ')\n        break; // 循环\n    chcount++;\n\
  }\n```\n\n### continue 命令\n`continue` 命令可以用于所有的循环形式，但不能用于 `switch`。它导致程序控制跳过循环内的剩余语句。对于\
  \ `while` 或 `for` 循环，将开始下一次循环。对于 `do while` 循环，将测试退出条件，并在必要时开始下一次循环。\n\n#### 示例\n\
  点击此处查看代码图像\n```c\nwhile ((ch = getchar()) != EOF)\n{\n    if (ch == ' ')\n     \
  \   continue; // 到测试条件\n    putchar(ch);\n    chcount++;\n}\n```\n这段代码显示并计数非空格字符。\n\
  \n### goto 命令\n`goto` 语句导致程序跳转到带有指定标签的语句。冒号用于分隔标签语句与其标签。标签名称遵循变量的命名规则。标签语句可以位于 `goto`\
  \ 之前也可以位于之后。\n\n#### 示例\n```c\ntop : ch = getchar();\nif (ch != 'y')\n    goto top;\n\
  ```\n\n### 第五节：带有 C99 和 C11 扩展的 ANSI C 标准库\n\n\n\n\n\nANSI C 标准库将函数分为若干组，每组都有一个相关的头文件。本附录为您提供了该库的概述，列出了所有头文件并简要描述了它们相关的函数。其中某些函数（例如，几个\
  \ I/O 函数）在正文中有更详细的讨论。更一般地说，要获取完整的描述，请查阅您实现版本的文档、参考手册，或者尝试以下在线参考资源：[`www.acm.uiuc.edu/webmonkeys/book/c_guide/`](http://www.acm.uiuc.edu/webmonkeys/book/c_guide/)\n\
  \n## 诊断：assert.h\n\n此头文件将 `assert()` 定义为一个宏。在包含 `assert.h` 头文件之前定义宏标识符 `NDEBUG`\
  \ 可以禁用 `assert()` 宏。作为参数使用的表达式通常是一个关系关系表达式或逻辑表达式，如果程序运行正常，则该表达式在程序的该时间点应该为真。表 RS.V.1\
  \ 描述了 `assert()` 宏。\n\n![Image](img/rs-vtab01.jpg)\n\n表 RS.V.1 诊断宏\n\nC11 增加了 `static_assert`\
  \ 宏，它展开为 `_Static_assert`。`_Static_assert` 实际上是一个关键字，被视为一种声明的形式。它提供了一种编译时检查，使用方法如下：\n\
  \n点击此处查看代码图像\n\n```\n_Static_assert (constant-expression, string-literal);\n```\n\
  \n如果常量表达式的值的值为零，编译器将发出一条包含该字符串字面量的错误消息。否则，没有影响。\n\n## 复数：complex.h (C99)\n\nC99\
  \ 标准为复数计算提供了广泛的支持，C11 扩展了这种支持。实现版本可以选择在提供 `_Complex` 类型外，额外提供 `_Imaginary` 类型。在\
  \ C11 下，两者都是可选的。C99 使 `_Complex` 变为强制性，而使 `_Imaginary` 为可选。本附录的第八 节 进一步讨论了复数支持。该头文件定义了表\
