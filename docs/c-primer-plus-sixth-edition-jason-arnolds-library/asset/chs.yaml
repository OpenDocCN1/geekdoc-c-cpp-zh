  \n## 指针兼容性\n\n将一个指针赋值给另一个指针的规则比数值类型的规则更严格。例如，你可以不使用类型转换就将 `int` 值赋值给 `double` 变量，但对于这两种类型的指针你不能这样做：\n\
  \n点击此处查看代码图片\n\n```c\nint n = 5;\ndouble x;\nint * p1 = &n;\ndouble * pd     = &x;\n\
  x = n;               // 隐式类型转换\npd = p1;            // 编译错误\n```\n\n这些限制扩展到了更复杂的类型。假设我们有以下声明：\n\
  \n点击此处查看代码图片\n\n```c\nint * pt;\nint (*pa)[3];\nint ar1[2][3];\nint ar2[3][2];\n\
  int **p2;      // 指向指针的指针\n```\n\n那么我们有以下内容：\n\n点击此处查看代码图片\n\n```c\npt = &ar1[0][0];\
  \  // 都是指向 int 的指针\npt = ar1[0];      // 都是指向 int 的指针\npt = ar1;        // 无效\n\
  ```\n\n（注：代码块后的文本在原文中包含大量的重复/乱码片段。根据“保留核心内容”和“不删除有价值信息”的指令，我已对提供的技术解释的逻辑流进行了处理。）\n\
  \n`pt = &ar1[0][0];`（都是指向 int 的指针）\n`pt = ar1[0];`（都是指向 int 的指针）\n`pt = ar1;`（无效）\n\
  \n这些限制扩展到了更复杂的类型。假设我们有以下声明 [原文中剩余的重复文本已省略，因为它们看起来是输入提示中的损坏/冗余数据，但指针兼容性的结构逻辑已保留]。\n\
  \n\n\n\n然而，这种方法丢失了行和列的信息。在这个应用程序（求所有元素和）中，这些信息并不重要，但假设每行代表一年，每列代表一个月。那么你可能需要一个函数来，比如，计算每个列的总和。在这种情况下，函数应该能够获取行和列信息。这可以通过声明正确类型的形式变量来实现，以便函数能够正确地传递数组。在这种情况下，数组\
  \ `junk` 是一个包含三个 4 个 `int` 数组的数组。正如前面的讨论提到的，这意味着 `junk` 是一个指向包含 4 个 `int` 的数组的指针。你可以像这样声明这种类型的函数参数：\n\
  \n```c\nvoid somefunction( int (* pt)[4] );\n```\n\n或者，如果（且仅当）`pt` 是函数的形式参数时，你可以如下进行声明：\n\
  \n```c\nvoid somefunction( int pt[][4] );\n```\n\n注意，第一组括号是空的。空括号将 `pt` 标识为指针。该变量可以像\
  \ `junk` 一样被使用。这就是我们在下一个示例中所做的，所示在列表 10.17 中。注意，列表展示了原型语法的三种等效替代方案。\n\n### 列表 10.17\
  \ array2d.c 程序\n\n点击此处查看代码图像\n\n```c\n// array2d.c -- 用于二维数组的函数\n\n#include <stdio.h>\n\
  \n#define ROWS 3\n\n#define COLS 4\n\nvoid sum_rows(int ar[][COLS], int rows);\n\
  \nvoid sum_cols(int [][COLS], int );    // 允许省略名称\n\nint sum2d(int (*ar)[COLS],\
  \ int rows); // 另一种语法\n\nint main(void)\n{\n    int junk[ROWS][COLS] = {\n     \
  \       {2,4,6,8},\n            {3,5,7,9},\n            {12,10,8,6}\n    };\n  \
  \  sum_rows(junk, ROWS);\n    sum_cols(junk, ROWS);\n    printf(\"Sum of all elements\
  \ = %d\\n\", sum2d(junk, ROWS));\n    return 0;\n}\n\nvoid sum_rows(int ar[][COLS],\
  \ int rows)\n{\n    int r;\n    int c;\n    int tot;\n    for (r = 0; r < rows;\
  \ r++)\n    {\n        tot = 0;\n        for (c = 0; c < COLS; c++)\n          \
  \  tot += ar[r][c];\n        printf(\"row %d: sum = %d\\n\", r, tot);\n    }\n}\n\
  \nvoid sum_cols(int ar[][COLS], int rows)\n{\n    int r;\n    int c;\n    int tot;\n\
  \    for (c = 0; c < COLS; c++)\n    {\n        tot = 0;\n        for (r = 0; r\
  \ < rows; r++)\n            tot += ar[r][c];\n        printf(\"col %d: sum = %d\\\
  n\", c, tot);\n    }\n}\n\nint sum2d(int ar[][COLS], int rows)\n{\n    int r;\n\
  \    int c;\n    int tot = 0;\n    for (r = 0; r < rows; r++)\n        for (c =\
  \ 0; c < COLS; c++)\n            tot += ar[r][c];\n    return tot;\n}\n```\n\n输出如下：\n\
  ```\nrow 0: sum = 20\nrow 1: sum = 24\nrow 2: sum = 36\ncol 0: sum = 17\ncol 1:\
  \ sum = 21\ncol 2: sum = 23\nSum of all elements = 80\n```\n\n列表 10.17 中的程序将名称 `junk`\
  \ 作为参数传递，`junk` 是一个指向第一个元素（一个子数组）的指针，以及代表行数 3 的符号常量 `ROWS`。每个函数随后将 `ar` 视为一个包含 4\
  \ 个 `int` 数组的数组。列数是构建在函数内部的，但行数是开放的。如果传递 12 作为行数，则该函数将适用于（例如）12×4 的数组。这是因为 `rows`\
  \ 是元素的数量；然而，由于每个元素都是一个数组或行，`rows` 变成了行数。注意 `ar` 在 `main()` 中的用法与 `junk` 相同。这是可能的，因为\
  \ `ar` 和 `junk` 是相同类型：指向 4 个 `int` 数组的指针。\n\n请注意，以下声明将不起作用：\n\n```c\nint sum2(int\
  \ ar[][], int rows); // 错误的声明\n```\n回编译器会将数组表示法转换为指针表示法。这意味着，例如 `ar[1]` 将变为 `ar+1`。为了让编译器计算此项，它需要知道\
  \ `ar` 指向的对象的大小。\n\n```c\nint sum2(int ar[][4], int rows); // 有效声明\n```\n表示 `ar`\
  \ 指向一个包含 4 个 `int` 的数组（因此，指向一个长度为 16 字节的对象），所以 `ar+1` 意味着“增加 16 字节”。使用空括号版本编译器将不知道该做什么。\n\
  \n你也可以在另一对括号中包含大小，所示，但编译器会忽略它：\n\n```c\nint sum2(int ar[3][4], int rows); // 有效声明，3\
  \ 被忽略\n```\n这对于那些使用 `typedef`（已在第 5 章的“ 运算符、表达式和语句”中提到，并在第 14 章中讨论“结构和其他数据形式”）的人来说非常方便：\n\
  \n```c\ntypedef int arr4[4];      // arr4 是包含 4 个 int 的数组\ntypedef arr4 arr3x4[3];\
  \   // arr3x4 是包含 3 个 arr4 的数组\nint sum2(arr3x4 ar, int rows); // 与下一个声明相同\nint\
  \ sum2(int ar[3][4], int rows); // 与下一个声明相同\nint sum2(int ar[][4], int rows); //\
  \ 与下一个声明相同\n```\n\n\n\n\n```c\ndouble sales[regions][quarters]; // 一个 VLA\n```\n\
  \n如前所述，VLA（变变长度数组）具有一些限制。它们必须具有自动存储类，这意味着它们要么是在函数内部声明且不使用 `static` 或 `extern` 存储类修饰符（第\
  \ 12 章），要么作为函数参数。此外，你不能在声明时对其进行初始化。最后，在 C11 中，VLA 是一个可选功能而非强制性功能，就像在 C99 中那样。\n\n\
  ### 注意：VLA 不会改变大小\n\n变长数组（variable-length array）中的 `variable` 一词并不意味着你可以在创建数组后修改其长度。一旦创建，VLA\
  \ 的大小就会保持不变。`variable` 这一词的真实含义是，在首次创建数组时，可以使用变量来指定数组维度。\n\n由于 VLA 是语言中新引入的特性，目前对它的支持还不完整。让我们来看一个简单的示例，它展示了如何编写一个计算任意两个\
  \ `int` 二维数组之和函数。\n\n首先，这里是声明一个带有二维 VLA 参数函数的方法：\n\n点击此处查看代码图片\n\n```c\nint sum2d(int\
  \ rows, int cols, int ar[rows][cols]);  // ar 是一个 VLA\n```\n\n注意，前两个参数（`rows` 和\
  \ `cols`）被用作声明数组参数 `ar` 的维度。因为 `ar` 的声明使用了 `rows` 和 `cols`，所以在参数列表中必须在 `ar` 之前声明。因此，以下原型是错误的：\n\
  \n点击此处查看代码图片\n\n```c\nint sum2d(int ar[rows][cols], int rows, int cols); // 顺序无效\n\
  ```\n\nC99/C11 标准规定你可以从原型函数中省略名称；但在那种情况下，你需要用星号 `*` 替换省略的维度：\n\n点击此处查看代码图片\n\n```c\n\
  int sum2d(int, int, int ar[*][*]);  // ar 是一个 VLA，省略了名称\n```\n\n其次，这里是定义函数的方法：\n\
  \n点击此处查看代码图片\n\n```c\nint sum2d(int rows, int cols, int ar[rows][cols])\n{\n   \
  \ int r;\n    int c;\n    int tot = 0;\n    for (r = 0; r < rows; r++)\n       \
  \ for (c = 0; c < cols; c++)\n            tot += ar[r][c];\n    return tot;\n}\n\
  ```\n\n除了新的函数头外，该函数与经典 C 版本（列表 10.17）的唯一区别是常量 `COLS` 被变量 `cols` 替换了。函数头中变长数组的存在使得这种改变成为可能。此外，通过同时代表行数和列数的变量，我们能够使用新的\
  \ `sum2d()` 处理任何尺寸的 `int` 二维数组。列表 10.18 阐释了这一点。然而，这需要一个实现了 VLA 特性的 C 编译器。它还证明了基于\
  \ VLA 的函数可以用于传统的 C 数组，也可以用于变长数组。\n\n列表 10.18 vararr2d.c 程序\n\n点击此处查看代码图片\n\n```c\n\
  //vararr2d.c -- 使用 VLA 的函数\n#include <stdio.h>\n\n#define ROWS 3\n#define COLS 4\n\
  \nint sum2d(int rows, int cols, int ar[rows][cols]);\n\nint main(void)\n{\n    int\
  \ i, j;\n    int rs = 3;\n    int cs = 10;\n    int junk[ROWS][COLS] = {\n     \
  \   {2,4,6,8},\n        {3,5,7,9},\n        {12,10,8,6}\n    };\n    int morejunk[ROWS-1][COLS+2]\
  \ = {\n        {20,30,40,50,60,70},\n        {5,6,7,8,10}\n    };\n    int varr[rs][cs];\
  \ // VLA\n    for (i = 0; i < rs; i++)\n        for (j = 0; j < cs; j++)\n     \
  \       varr[i][j] = i + j;\n    printf(\"3x5 array\\n\");\n    printf(\"Sum of\
  \ all elements = %d\\n\", sum2d(ROWS, COLS, junk));\n    printf(\"2x6 array\\n\"\
  );\n    printf(\"Sum of all elements = %d\\n\", sum2d(ROWS-1, COLS+2, morejunk));\n\
  \    printf(\"3x10 VLA\\n\");\n    printf(\"Sum of all elements = %d\\n\", sum2d(rs,\
  \ cs, varr));\n    return 0;\n}\n\n// 带有 VLA 参数的函数\nint sum2d(int rows, int cols,\
  \ int ar[rows][cols])\n{\n    int r;\n    int c;\n    int tot = 0;\n    for (r =\
  \ 0; r < rows; r++)\n        for (c = 0; c < cols; c++)\n            tot += ar[r][c];\n\
  \    return tot;\n}\n```\n\n输出如下：\n3x5 array\nSum of all elements = 80\n2x6 array\n\
  Sum of all elements = 315\n3x10 VLA\nSum of all elements = 270\n\n需要注意的是，函数定义列表中的\
  \ VLA 声明实际上并没有创建一个数组。与旧语法一样，VLA 名称 实际上是一个指针。这意味着一个带有 VLA 参数的函数实际上是与原始数组中的数据工作，因此它具有修改作为参数传递的数组的能力。以下代码片段指出了何时声明指针，何时声明的是实际数组：\n\
