  \ zeno.c -- series sum */\n#include <stdio.h>\n\nint main(void)\n{\n    int t_ct;\
  \       // 项数计数\n    double time, power_of_2;\n    int limit;\n    printf(\"Enter\
  \ the number of terms you want: \");\n    scanf(\"%d\", &limit);\n    for (time=0,\
  \ power_of_2=1, t_ct=1; t_ct <= limit;\n                         t_ct++, power_of_2\
  \ *= 2.0)\n    {\n        time += 1.0/power_of_2;\n        printf(\"time = %f when\
  \ terms = %d.\\n\", time, t_ct);\n    }\n    return 0;\n}\n```\n\n这里是 15 项的输出：\n\
  \n点击此处查看代码图像\n\nEnter the number of terms you want: 15\ntime = 1.000000 when terms\
