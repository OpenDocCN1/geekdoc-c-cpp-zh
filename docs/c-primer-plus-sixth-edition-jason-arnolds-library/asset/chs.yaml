  \ `int` 读取字符是为了进行 `EOF` 测试。然而，它将字符作为 `char` 传递给 `display()` 函数。由于 `char` 比 `int`\
  \ 小，某些编译器会发出警告。你可以通过类型转换来消除这个警告：`display((char)ch, rows, cols);`\n\n注意，程序以 `int`\
