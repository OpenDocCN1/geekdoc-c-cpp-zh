  \n[content]\nGwen Glenn 想要打印她的书籍库存清单。她希望为每本书打印各种信息：标题、作者、出版商、版权日期、页数、副本数以及美元价值。在这些项目中的某些项（如标题）可以存储在字符串数组中。其他项目则需要\
  \ `int` 数组或 `float` 数组。使用七个不同的数组来跟踪所有内容可能会变得复杂，特别是当 Gwen 想生成几个完整的列表时——一个按标题排序，一个按作者排序，一个按价值排序等等。更好的解决方案是使用一个数组，其中每个成员都包含某本书的所有信息。\n\
  \n那么，Gwen 需要一种既能包含字符串又能数字，并以某种方式将信息分开的数据类型。`C` 结构（structure）满足了这一需求。为了了解结构是如何设置以及如何工作的，我们将从一个有限的示例开始。为了简化问题，我们将实施两个限制：首先，我们只包含标题、作者和当前市场价值。其次，我们将库存限制为本书。不过，不用担心这个限制，因为我们很快就会扩展程序。\n\
  \n查看列表 14.1 中的程序及其输出。然后阅读对要点的解释。\n\n#### 列表 14.1 `book.c` 程序\n\n点击此处查看代码图像\n\n```c\n\
  //* book.c -- 单本书库存清单 */\n\n#include <stdio.h>\n\n#include <string.h>\n\nchar *\
  \ s_gets(char * st, int n);\n\n#define MAXTITL  41      /* 标题的最大长度 + 1         */\n\
  #define MAXAUTL  31      /* 作者名字的最大长度 + 1 */\nstruct book {               /* 结构模板：标签为\
  \ book */\n    char title[MAXTITL];\n    char author[MAXAUTL];\n    float value;\n\
  };                          /* 结构模板结束 */\n\nint main(void)\n{\n    struct book library;\
  \ /* 声明 library 为 book 类型变量 */\n    printf(\"Please enter the book title.\\n\");\n\
  \    s_gets(library.title, MAXTITL); /* 访问标题部分 */\n    printf(\"Now enter the author.\\\
  n\");\n    s_gets(library.author, MAXAUTL);\n    printf(\"Now enter the value.\\\
  n\");\n    scanf(\"%f\", &library.value);\n    printf(\"%s by %s: $%.2f\\n\",library.title,\n\
  \              library.author, library.value);\n    printf(\"%s: \\\"%s\\\" ($%.2f)\\\
  n\", library.author,\n              library.title, library.value);\n    printf(\"\
  Done.\\n\");\n    return 0;\n}\n\nchar * s_gets(char * st, int n)\n{\n    char *\
  \ ret_val;\n    char * find;\n    ret_val = fgets(st, n, stdin);\n    if (ret_val)\n\
  \    {\n        find = strchr(st, '\\n');   // 寻找换行符\n        if (find)        \
  \       // 如果地址不为空，\n            *find = '\\0';          // 在那里放置空字符\n        else\n\
  \            while (getchar() != '\\n')\n                continue;       // 丢弃剩余行\n\
  \    } return ret_val;\n}\n```\n\n与之前的章节一样，我们使用 `s_gets()` 去掉 `fgets()` 通常存储的换行符。以下是示例运行：\n\
  \n点击此处查看代码图像\nPlease enter the book title.\nChicken of the Andes\nNow enter the\
  \ author.\nDisma Lapoult\nNow enter the value.\n29.99\nChicken of the Andes by Disma\
  \ Lapoult: $29.99\nDisma Lapoult: \"Chicken of the Andes\" ($29.99)\nDone.\n\n列表\
  \ 14.1 中创建的结构包含三个部分（称为成员或字段）——一个存储标题，一个存储作者，一个存储价值。这些是你必须掌握的三项主要技能：\n\n![Image](img/squf.jpg)\
  \ 为结构设置格式或布局\n![Image](img/squf.jpg) 声明一个符合该布局的变量\n![Image](img/squf.jpg) 获取结构变量各个组件的访问\n\
  \n### 设置结构声明\n\n`结构声明`（structure declaration）是描述结构如何组合的总计划。声明看起来如下：\n\n点击此处查看代码图像\n\
  ```c\nstruct book {\n    char title[MAXTITL];\n    char author[MAXAUTL];\n    float\
  \ value;\n};\n```\n此声明描述了一个由两个字符数组和一个 `float` 变量组成的结构。它并没有创建一个实际的对象，但它描述了构成这样一个对象的要素。（偶尔，我们将结构声明称为*模板*（template），因为它概述了数据将如何被存储。如果你听过\
  \ C++ 中的模板，那是对该词的另一种、更有心勃勃的用法。）让我们来看细节。首先是关键字 `struct`。它标识接下来的内容是一个结构。接下来是一个可选的\
  \ `tag`（标签）——单词 `book`——这是一个你可以使用的简写标签。\n\n### 定义结构变量\n\n单词 `structure` 在两种意义下使用。一个是“结构计划”，即我们刚刚讨论的。结构计划告诉编译器*如何*表示数据，但它并没有让计算机*分配*空间。下一步是创建`结构变量`，这是该词的第二种意义。程序中导致创建结构变量的行是：\n\
  \n```c\nstruct book library;\n```\n看到此指令，编译器创建了变量 `library`。使用 `book` 模板，编译器为 `MAXTITL`\
  \ 个元素的 `char` 数组、`MAXAUTL` 个元素的 `char` 数组以及一个 `float` 变量分配了空间。这些存储被聚集在单一名称 `library`\
  \ 下（参见图 14.1）。下一节将解释如何根据需要将其拆分。）\n\n![Image](img/14fig01.jpg)\n图 14.1 结构的内存分配\n\n\
  在声明结构变量时，`struct book` 扮演的角色与简单声明中的 `int` 或 `float` 相同。例如，你可以声明两个 `struct book`\
  \ 类型的变量，甚至是一个指向该类型结构的指针：\n\n```c\nstruct book doyle, panshin, * ptbook;\n```\n结构变量\
  \ `doyle` 和 `panshin` 的每一个都拥有 `title`、`author` 和 `value` 部分。指针 `ptbook` 可以指向 `doyle`、`panshin`\
  \ 或任何其他 `book` 结构。从本质上说，`book` 结构声明创建一个名为 `struct book` 的新类型。对于计算机而言，声明\n\n```c\n\
  struct book library;\n```\n等同于\n\n```c\nstruct book {\n    char title[MAXTITL];\n\
  \    char author[MAXAUTL];\n    float value;\n} library; /* 在声明后跟随变量名 */\n```\n\n\
  \n\n换句话说，声明结构的过程和定义结构变量的过程可以合并为一步。将声明和变量定义结合起来如所示，这是不需要标签的唯一情况：\n\n```c\nstruct\
  \ {          /* 无标签 */\n    char title[MAXTITL];\n    char author[MAXAUTL];\n  \
  \  float value;\n} library;\n```\n\n但是，如果你打算多次使用结构模板，请使用标签形式，或者你可以使用在本节稍后出现的 `typedef`\
  \ 替代方案。\n\n在定义结构变量时，有一个方面在例子中没有提到：初始化。我们现在来看这个问题。\n\n### 初始化结构\n\n你已经见过如何初始化变量和数组了：\n\
  \n```c\nint count = 0;\nint fibo[7] = {0,1,1,2,3,5,8};\n```\n\n结构变量也可以初始化吗？是的，可以。要初始化一个结构（ANSI\
  \ C 及以后版本的任何存储存储类，但不包括预 ANSI C 版本的自动变量），你使用与数组相似的语法：\n\n点击此处查看代码图片\n\n```c\nstruct\
  \ book library = {\n    \"The Pious Pirate and the Devious Damsel\",\n    \"Renee\
  \ Vivotte\",\n    1.95\n};\n```\n\n简而言之，你使用大括号括起的逗号分隔的初始化器列表。每个初始化器都应该与被初始化的结构成员类型匹配。因此，你可以将\
  \ `title` 成员初始化为字符串，将 `value` 成员初始化为数字。为了让关联更加明显，我们为每个成员单独写一行初始化，但编译器只需要逗号来分隔一个成员的初始化和下一个。\n\
  \n***\n\n**注意：** 结构初始化与存储类持续期\n\n第 12 章，“存储类、链接与内存管理”提到，如果你初始化一个具有静态存储持续期的变量（例如静态外部链接、静态内部链接或无链接的静态变量），你必须使用常量值。这同样适用于结构。如果你正在初始化一个具有静态存储持续期的结构，初始化器列表中的值必须是常量表达式。如果存储持续期是自动的，列表中的值不需要是常量。\n\
  \n### 访问结构成员\n\n结构像一个“超级数组”，其中一个元素可以是 `char`，下一个元素是 `float`，下一个是 `int` 数组。你可以通过下标访问数组的单个元素。那么如何访问结构的单个成员呢？使用点运算符（`.`），即结构成员运算符。例如，`library.value`\
  \ 是 `library` 的 `value` 部分。你可以像使用任何其他 `float` 变量一样使用 `library.value`。同样地，你可以像使用\
  \ `char` 数组一样使用 `library.title`。因此，程序使用了如下表达式：\n\n```c\ns_gets(library.title, MAXTITL);\n\
  scanf(\"%f\", &library.value);\n```\n\n从上，，`.title`、`.author` 和 `.value` 充当了 `book`\
  \ 结构下标的角色。\n\n请注意，尽管 `library` 是一个结构，但 `library.value` 是 `float` 类型，其用法与任何其他 `float`\
  \ 类型一样。例如，`scanf(\"%f\",...)` 需要一个 `float` 位置的地址，而这正是 `&library.float` 的含义。在这里点的优先级高于\
  \ `&`，所以该表达式与 `&(library.float)` 相同。\n\n如果你有第二个相同类型的结构变量，你可以使用相同的方法：\n\n```c\nstruct\
  \ book bill, newt;\ns_gets(bill.title, MAXTITL);\ns_gets(newt.title, MAXTITL);\n\
  ```\n\n`.title` 指向 `book` 结构的第一个成员。注意初始程序是如何以两种不同的格式打印结构 `library` 的内容的。这说明了你在使用结构成员时拥有的自由。\n\
  \n### 结构的初始化器\n\nC99 和 C11 为结构提供了指定初始化器（designated initializers）。其语法与数组的指定初始化器相似。然而，结构的指定初始化器使用点运算符和成员名，而不是括号和索引来识别特定元素。例如，要仅初始化书籍结构中的\
  \ `value` 成员，你可以这样做：\n\n点击此处查看代码图片\n\n```c\nstruct book surprise = { .value = 10.99};\n\
  ```\n\n你可以以任何顺序使用指定初始化器：\n\n点击此处查看代码图片\n\n```c\nstruct book gift = { .value = 25.99,\n\
  \    .author = \"James Broadfool\",\n    .title = \"Rue for the Toad\"};\n```\n\n\
  与数组一样，跟在指定初始化器之后的普通初始化器会为指定成员之后的成员提供值。此外，为特定成员提供的最后一个值是它获得的值。例如，考虑此此声明：\n\n点击此处查看代码图片\n\
  \n```c\nstruct book gift= { .value = 18.90,\n    .author = \"Philionna Pestle\"\
  ,\n    0.25};\n```\n\n值 `0.25` 被赋值给 `value` 成员，因为它在结构声明中紧跟在 `author` 成员之后。`0.25`\
  \ 取代了 `18.90`。现在掌握了这些基础，准备好扩展视野并研究结构。\n\n#### 结构数组\n\n让我们扩展程序以处理更多的书籍。显然，每本书都可以由一个结构描述。描述两本书需要两个变量，以此此类推。为了处理几本书，你需要使用这种结构数组，这就是我们在下一节（4.2）中创建的。\n\
  \n#### 结构与内存\n\n`manybook.c` 使用了一个包含 100 个结构的数组。由于数组是自动类，信息通常放在栈上。如果你遇到运行时错误，可能是关于栈大小或溢出的，可以使用编译器选项设置栈大小为\
  \ 10000，或者将数组设为 `static`（使其不放在栈上），或者减小数组的大小。为什么我们一开始没有缩小栈？因为你应该了解潜在的栈大小，以便在遇到时能够应对。\n\
  \n#### 列表 14.2 manybook.c 程序\n\n点击此处查看代码图片\n\n```c\n/* manybook.c -- 多本库存 */\n#include\
  \ <stdio.h>\n#include <string.h>\n\nchar * s_gets(char * st, int n);\n#define MAXTITL\
  \  40\n#define MAXAUTL  40\n#define MAXBKS   100    /* 最大书籍数量 */\n\nstruct book\
  \ {           /* 设置书籍模板 */\n    char title[MAXTITL];\n    char author[MAXAUTL];\n\
  \    float value;\n};\n\nint main(void)\n{\n    struct book library[MAXBKS]; /*\
  \ 书籍结构数组 */\n    int count = 0;\n    int index;\n    printf(\"请输入书名。\\n\");\n  \
  \  printf(\"在行首按 [回车] 停止。\\n\");\n    while (count < MAXBKS && s_gets(library[count].title,\
  \ MAXTITL) != NULL\n          && library[count].title[0] != '\\0')\n    {\n    \
  \    printf(\"现在输入作者。\\n\");\n        s_gets(library[count].author, MAXAUTL);\n\
  \        printf(\"现在输入数值。\\n\");\n        scanf(\"%f\", &library[count++].value);\n\
  \        while (getchar() != '\\n')\n            continue;        /* 清除输入行 */\n\
  \    }\n}\n```\n\n\n\n\n```c\nif (count < MAXBKS)\n{\n    printf(\"Enter the next\
  \ title.\\n\");\n}\n\nif (count > 0)\n{\n    printf(\"Here is the list of your books:\\\
  n\");\n    for (index = 0; index < count; index++)\n        printf(\"%s by %s: $%.2f\\\
  n\", library[index].title,\n               library[index].author, library[index].value);\n\
  }\nelse\n    printf(\"No books? Too bad.\\n\");\nreturn 0;\n}\n\nchar * s_gets(char\
  \ * st, int n)\n{\n    char * ret_val;\n    char * find;\n    ret_val = fgets(st,\
  \ n, stdin);\n    if (ret_val)\n    {\n        find = strchr(st, '\\n');   // look\
  \ for newline\n        if (find)               // if the address is not NULL,\n\
  \            *find = '\\0';           // place a null character there\n        else\n\
  \            while (getchar() != '\\n')\n                continue;           //\
  \ dispose of rest of line\n    }\n    return ret_val;\n}\n```\n\n## Borland C 与浮点数\n\
  \n旧版本的 Borland C 编译器尝试在程序不使用浮点值时，通过使用一个小版本的 `scanf()` 来使程序更加紧凑。然而，这些编译器（通过适用于 DOS\
  \ 的 Borland C/C++ 3.1，但不包括 Borland C/C++ 4.0）会被欺骗，如果唯一的浮点值位于结构体数组中，如列表 14.2 所示。结果是，你会得到类似下面的消息：\n\
  \n点击此处查看代码图像\n\n`scanf : floating point formats not linked\nAbnormal program termination`\n\
  \n一种解决办法是向你的程序中添加这段代码：\n\n```c\n#include <math.h>\ndouble dummy = sin(0.0);\n```\n\
  \n这段代码强制编译器加载浮点数版本的 `scanf()`。\n\n以下是示例程序的运行情况：\n\n点击此处查看代码图像\n\n请输入书名。\n在行首按 [enter]\
  \ 停止。\nMy Life as a Budgie\n现在输入作者。\nMack Zackles\n现在输入数值。\n12.95\n输入下一个书名。\n...更多条目...\n\
  以下是你的书籍列表：\nMy Life as a Budgie by Mack Zackles: $12.95\nThought and Unthought Rethought\
  \ by Kindra Schlagmeyer: $43.50\nConcerto for Financial Instruments by Filmore Walletz:\
  \ $49.99\nThe CEO Power Diet by Buster Downsize: $19.25\nC++ Primer Plus by Stephen\
  \ Prata: $59.99\nFact Avoidance: Perception as Reality by Polly Bull: $19.97\nCoping\
  \ with Coping by Dr. Rubin Thonkwacker: $0.02\nDiaphanous Frivolity by Neda McFey:\
  \ $29.99\nMurder Wore a Bikini by Mickey Splats: $18.95\nA History of Buvania, Volume\
  \ 8, by Prince Nikoli Buvan: $50.04\nMastering Your Digital Watch, 5nd Edition,\
  \ by Miklos Mysz: $28.95\nA Foregone Confusion by Phalty Reasoner: $5.99\nOutsourcing\
  \ Government: Selection. Election by Ima Pund: $33.33\n\n首先，我们将描述如何声明结构体数组以及如何访问单个成员。然后，我们将重点介绍程序的某些方面。\n\
  \n## 声明结构体数组\n\n声明结构体数组与声明任何类型的数组都一样。这里有一个示例：\n\n```c\nstruct book library[MAXBKS];\n\
  ```\n\n这声明 `library` 是一个具有 `MAXBKS` 个元素的数组。该数组的每个元素都是一个 `book` 类型的结构体。因此，`library[0]`\
  \ 是一个 `book` 结构体，`library[1]` 是第二个 `book` 结构体，以此此类推。图 14.2 可能会帮助你直观地理解这一点。`library`\
  \ 本身并不是结构体；它是元素为 `struct book` 结构体的数组名称。\n\n![图像](img/14fig02)\n图 14.2 结构体数组。\n\n\
  ## 识别结构体数组的成员\n\n要识别结构体数组的成员，你应用与用于单个结构体的相同规则：在结构体名后跟点运算符（`.`），然后跟上成员名。这里有一个示例：\n\
  \n点击此处查看代码图像\n\n```c\nlibrary[0].value /* 与第一个数组元素关联的值 */\nlibrary[4].title /* 与第五个数组元素关联的标题\
  \ */\n```\n\n注意数组下标附加在 `library` 之后，而不是名称的末尾：\n\n`library.value[2]` // 错误\n`library[2].value`\
  \ // 正确\n\n使用 `library[2].value` 的原因是 `library[2]` 是结构体名，就像 `library[1]` 是另一个结构体名一样。顺便问一下，你认为以下代码代表什么？\n\
  \n`library[2].title[4]`\n\n它是标题中的第五个字符（标题的 `[4]` 部分）。点运算符右侧的是单个结构体，而点运算符左侧的是数组。总结来说，点运算符右侧的是单个结构体，而点运算符左侧的是数组。这里有一个序列：\n\
  \n点击此处查看代码图像\n\n```c\nlibrary // 数组\nlibrary[2] // 结构体\nlibrary[2].title // 数组\n\
  library[4] // 字符\n```\n\n现在让我们完成程序。\n\n## 程序讨论\n\n与第一个程序相比，主要的改变是我们插入了一个循环来读取多个条目。该循环开始于这个\
  \ `while` 条件：\n\n点击此处查看代码图像\n\n```c\nwhile (count < MAXBKS && s_gets(library[count].title,\
  \ MAXTITL) != NULL && library[count].title[0] != '\\0')\n```\n\n`s_gets(library[count].title,\
  \ MAXTITL)` 读取一个字符串；如果尝试读取文件末尾，则返回 `NULL`。`library[count].title[0] != '\\0'` 测试字符串的第一个字符是否为空字符（即如果在行首按了回车键，字符串为空），则循环结束。我们还检查了书籍数量是否超过了数组限制。\n\
  \n然后程序有这些行：\n\n点击此处查看代码图像\n\n```c\nwhile (getchar() != '\\n')\n    continue; /*\
  \ 清空行 */\n```\n\n正如你在前面的章节中所，，代码补偿了 `scanf()` 函数忽略空格和换行符。当你响应对数值的请求时，输入如下内容：\n\n\
  12.50[enter]\n\n该语句传输了以下序列：\n\n12.50\\n\n\n`scanf()` 函数收集了 `1`、`2`、`.`、`5` 和 `0`，但它留在\
  \ `\\n` 在那里等待下一个读取语句。如果没有这段预防代码，下一个读取语句 `s_gets(library[count].title, MAXTITL)`\
  \ 将将剩下的换行符读取为空空行，程序就会认为你发送了停止信号。我们插入的代码会消耗字符直到找到并丢弃换行符。除了从输入队列中移除字符之外不做任何其他操作。这为\
  \ `s_gets()` 的下次输入提供了新的开始。\n\n现在让我们回到结构体。\n\n## 嵌套结构体\n\n有时一个结构体包含或嵌套另一个结构体会很方便。例如，Shalala\
  \ Pirosky 正在构建一个关于她朋友信息的结构。该结构的一个成员自然地是朋友的名字。然而，名字本身可以由一个结构体来表示，具有独立的姓和名成员。列表 14.3\
  \ 是 Shalala 工作的一个精简示例。\n\n列表 14.3 friend.c 程序\n\n```c\n// friend.c -- 嵌套结构体的示例\n\
  #include <stdio.h>\n#define LEN 20\nconst char * msgs[5] =\n{\n    \"Thank you for\
  \ the wonderful evening, \",\n    \"You certainly prove that a \",\n    \"is a special\
  \ kind of guy. We must get together\",\n    \"over a delicious \",\n    \"and have\
  \ a few laughs\"\n};\n```\n\n\n\n\n\n```c\nstruct names {                   // 第一个结构\n\
  \    char first[LEN];\n    char last[LEN];\n};\n\nstruct guy {                 \
  \   // 第二个结构\n    struct names handle;      // 嵌套结构\n    char favfood[LEN];\n  \
  \  char job[LEN];\n    float income;\n};\n\nint main(void)\n{\n    struct guy fellow\
  \ = {       // 初始化一个变量\n        { \"Ewen\", \"Villard\" },\n        \"grilled salmon\"\
  ,\n        \"personality coach\",\n        68112.00\n    };\n\n    printf(\"Dear\
  \ %s, \\n\\n\", fellow.handle.first);\n    printf(\"%s%s.\\n\", msgs[0], fellow.handle.first);\n\
  \    printf(\"%s%s\\n\", msgs[1], fellow.job);\n    printf(\"%s\\n\", msgs[2]);\n\
  \    printf(\"%s%s%s\", msgs[3], fellow.favfood, msgs[4]);\n\n    if (fellow.income\
  \ > 150000.0)\n        puts(\"!!\");\n    else if (fellow.income > 75000.0)\n  \
  \      puts(\"!\");\n    else\n        puts(\".\");\n\n    printf(\"\\n%40s%s\\\
  n\", \" \", \"See you soon,\");\n    printf(\"%40s%s\\n\", \" \", \"Shalala\");\n\
  \    return 0;\n}\n```\n\n* * *\n\n这里是输出：\n\n点击此处查看代码图片\n\n亲爱的 Ewen，\n\n感谢你度过的美好夜晚，Ewen。\n\
  \n你确实证明了性格教练是一个特殊的家伙。我们必须聚在一起，吃顿美味的烤三文鱼并大笑几场。\n                              后见，\n\
  \                              Shalala\n\n首先，注意在结构体声明中是如何设置嵌套结构的。它仅仅是被声明出来，就像声明一个\
  \ `int` 变量一样：\n\n`struct names handle;`\n\n该声明表示 `handle` 是一个 `struct names` 类型的变量。当然，该文件还应该包含\
  \ `names` 结构的声明。\n\n其次，注意你如何访问嵌套结构中的成员；你只需要使用两次点运算符即可：\n\n点击此处查看代码图片\n\n`printf(\"\
  Hello, %s!\\n\", fellow.handle.first);`\n\n该构造的解释方式如下，从左到右顺序：\n\n`(fellow.handle).first`\n\
  \n即：找到 `fellow`，然后找到 `fellow` 的 `handle` 成员，再找到该成员的 `first` 成员。\n\n## 结构体指针\n\n\
  指针爱好者会很高兴地知道你可以拥有指向结构体的指针。拥有结构体指针至少有四个理由。首先，数组指针比数组本身（例如在排序问题中）更容易操作，而结构体指针通常也比结构体本身更容易操作。其次，在某些旧的实现中，结构体不能作为参数传递给函数，但结构体指针可以。第三，即使你可以将结构体作为参数传递，传递指针通常更高效。第四，许多奇妙的数据使用了包含指向其他结构指针的结构体。下一个短示例（参见\
  \ `Listing 14.4`#ch14.html_ch14lis4））展示了如何定义指向结构体的指针，以及如何使用它来访问结构体的成员。\n\n`Listing\
  \ 14.4 friends.c` 点击此处查看代码图片\n\n* * *\n\n```c\n/* friends.c -- 指向结构体的指针 */\n#include\
  \ <stdio.h>\n#define LEN 20\nstruct names {\n    char first[LEN];\n    char last[LEN];\n\
  };\nstruct guy {\n    struct names handle;\n    char favfood[LEN];\n    char job[LEN];\n\
  \    float income;\n};\nint main(void)\n{\n    struct guy fellow[2] = {\n      \
  \  { \"Ewen\", \"Villard\"},\n        \"grilled salmon\",\n        \"personality\
  \ coach\",\n        68112.00\n    },\n        {\"Rodney\", \"Swillbelly\"},\n  \
  \      \"tripe\",\n        \"tabloid editor\",\n        23400.00\n    };\n    struct\
  \ guy * him; /* 这里是一个指向结构体的指针 */\n    printf(\"address #1: %p #2: %p\\n\", &fellow[0],\
  \ &fellow[1]);\n    him = &fellow[0]; /* 告诉指针指向哪里 */\n    printf(\"pointer #1: %p\
  \ #2: %p\\n\", him, him + 1);\n    printf(\"him->income is $%.2f: (*him).income\
  \ is $%.2f\\n\", him->income, (*him).income);\n    him++; /* 指向下一个结构 */\n    printf(\"\
  him->favfood is %s: him->handle.last is %s\\n\", him->favfood, him->handle.last);\n\
  \    return 0;\n}\n```\n\n* * *\n\n输出如下：\n\n点击此处查看代码图片\n\naddress #1: 0x7fff5ff820\
  \ #2: 0x7fff5ff874\npointer #1: 0x7fff5ff820 #2: 0x7fff5ff84\nhim->income is $68112.00:\
  \ (*him).income is $68112.00\nhim->favfood is tripe: him->handle.last is Swillbelly\n\
  \n\n\n\n回想一下，函数参数将值传递给函数。每个值都是数字——可能是 `int`，可能是 `float`，可能是 ASCII 字符编码，或者是一个地址。结构比单个值要复杂一点，因此古老的\
  \ C 实现不允许结构作为函数的参数，这并不意外。这种限制在较新的实现中被删除了，ANSI C 允许结构作为参数。因此，现代实现允许你选择：将结构作为参数传递，或者将结构指针作为参数传递——或者，如果你只关心结构的一部分，你可以将结构成员作为参数传递。我们将检查这三种方法，从将结构成员作为参数开始。\n\
  \n## 传递结构成员\n\n只要结构成员是具有单个值的数据类型（即 `int` 或其相关的类型，如 `char`、`float`、`double` 或指针），它就可以作为函数参数传递给接受该特定类型的函数。列表\
  \ 14.5 中的那一个初创的金融分析程序（它将客户的银行账户添加到其储蓄和贷款账户中）向我们说明了这一点。\n\n列表 14.5 funds1.c 程序\n\n\
  点击此处查看代码图像\n\n```c\n/* funds1.c -- passing structure members as arguments */\n\n\
  #include <stdio.h>\n\n#define FUNDLEN 50\n\nstruct funds {\n    char   bank[FUNDLEN];\n\
  \    double bankfund;\n    char   save[FUNDLEN];\n    double savefund;\n};\n\ndouble\
  \ sum(double, double);\n\nint main(void)\n{\n    struct funds stan = {\n       \
  \ \"Garlic-Melon Bank\",\n        4032.27,\n        \"Lucky's Savings and Loan\"\
  ,\n        8543.94\n    };\n    printf(\"Stan has a total of $%.2f.\\n\",\n    \
  \       sum(stan.bankfund, stan.savefund) );\n    return 0;\n}\n\n/* 将两个 double\
  \ 相加 */\ndouble sum(double x, double y)\n{\n    return(x + y);\n}\n```\n\n这是运行该程序的运行：\n\
  \nStan has a total of $12576.21.\n\n啊，它可以工作。注意，函数 `sum()` 既不知道也不关心实际参数是否是结构的成员；它只要求这些类型为\
  \ `double`。\n\n当然，如果你想让被调用函数影响调用函数中成员的值，你可以传递该成员的地址：\n\n`modify(&stan.bankfund);`\n\
  \n这将是一个修改 Stan 银行账户的函数。\n\n告诉函数关于结构的另一种方法是让被调用函数知道它正在处理一个结构。\n\n## 使用结构地址\n\n我们将解决与之前相同的问题，但这次我们将使用结构的地址作为参数。由于函数必须处理\
  \ `funds` 结构，它也必须使用 `funds` 声明。请参见列表 14.6 中的程序。\n\n列表 14.6 funds2.c 程序\n\n点击此处查看代码图像\n\
  \n```c\n/* funds2.c -- passing a pointer to a structure */\n\n#include <stdio.h>\n\
  \n#define FUNDLEN 50\n\nstruct funds {\n    char   bank[FUNDLEN];\n    double bankfund;\n\
  \    char   save[FUNDLEN];\n    double savefund;\n};\n\ndouble sum(const struct\
  \ funds *);  /* 参数是一个指针 */\nint main(void)\n{\n    struct funds stan = {\n     \
  \   \"Garlic-Melon Bank\",\n        4032.27,\n        \"Lucky's Savings and Loan\"\
  ,\n        8543.94\n    };\n    printf(\"Stan has a total of $%.2f.\\n\", sum(&stan));\n\
  \    return 0;\n}\ndouble sum(const struct funds * money)\n{\n    return(money->bankfund\
  \ + money->savefund);\n}\n```\n\n这同样产生了以下输出：点击此处查看代码图像\n\nStan has a total of $12576.21.\n\
  \n`sum()` 函数使用指向 `funds` 结构的指针 (`money`）作为其单一参数。向函数传递地址 `&stan` 会导致指针 `money` 指向结构\
  \ `stan`。然后使用 `->` 运算符来获取 `stan.bankfund` 和 `stan.savefund` 的值。由于函数没有修改所指向的值，它将\
  \ `money` 声明为指向 `const` 的指针。此函数还可以访问机构名称，尽管它没有使用它们。注意，你必须使用 `&` 运算符来获取结构的地址。与数组名不同，结构名本身并不是其地址的同义词。\n\
  \n## 将结构作为参数\n\n对于允许结构作为参数的编译器，上一个示例可以像列表 14.7 所示那样重写。\n\n列表 14.7 funds3.c 程序\n\n\
  点击此处查看代码图像\n\n```c\n/* funds3.c -- passing a structure */\n#include <stdio.h>\n\n\
  #define FUNDLEN 50\nstruct funds {\n    char   bank[FUNDLEN];\n    double bankfund;\n\
  \    char   save[FUNDLEN];\n    double savefund;\n};\n\ndouble sum(struct funds\
  \ moolah); /* 参数是一个结构 */\nint main(void)\n{\n    struct funds stan = {\n       \
  \ \"Garlic-Melon Bank\",\n        4032.27,\n        \"Lucky's Savings and Loan\"\
  ,\n        8543.94\n    };\n    printf(\"Stan has a total of $%.2f.\\n\", sum(stan));\n\
  \    return 0;\n}\ndouble sum(struct funds moolah)\n{\n    return(moolah.bankfund\
  \ + moolah.savefund);\n}\n```\n\n再次，输出为：\n\nStan has a total of $12576.21.\n\n我们用\
  \ `struct funds` 变量 `moolah` 替换了指针 `money`。当调用 `sum()` 时，创建了一个名为 `moolah` 的自动变量。该结构的成员被初始化为\
  \ `stan` 对应成员的副本。因此，计算是通过使用结构的副本完成的；而之前的程序（使用指针的列表 14.6）使用的是原始结构。由于 `moolah` 是结构，而不是\
  \ `money->bankfund`。\n\n## 关于结构特性的更多\n\n现代 C 允许将一个结构赋值给另一个结构，这对于数组是不可行的。也就是说，如果\
  \ `n_data` 和 `o_data` 都是相同类型的结构，你可以执行以下操作：\n\n点击此处查看代码图像\n\n`o_data = n_data;` //\
  \ 将一个结构赋值给另一个\n\n这导致 `n_data` 的每个成员都被赋予 `o_data` 对应成员的值。即使某个成员恰好是数组，这种方法也有效。此外，你还可以初始化相同类型的结构：\n\
  \n点击此处查看代码图像\n\n`struct names right_field = {\"Ruthie\", \"George\"};`\n`struct\
  \ names captain = right_field;` // 初始化一个结构另一个\n\n在现代 C 中，结构不仅可以作为函数参数传递，还可以作为函数的返回值。将结构作为函数参数可以将结构信息传递给函数；通过函数返回结构可以将结构信息从被调用函数传递给调用函数。结构指针也允许双向通信，因此通常可以使用任何方法来解决编程问题。为了对比这两种方法，我们将编写一个指针处理结构，然后通过结构传递和结构返回来重写它。程序本身会询问你的姓和名，并报告它们中字母的总数。这个项目并不真正需要结构，但它提供了一个观察它们如何运作的简单框架。列表\
  \ 14.8 展示了指针形式。\n\n列表 14.8 names1.c 程序\n\n点击此处查看代码图像\n\n```c\n/* names1.c -- uses\
  \ pointers to a structure */\n```\n\n\n\n\n```c\n#include <stdio.h>\n#include <string.h>\n\
  \n#define NLEN 30\n\nstruct namect {\n    char fname[NLEN];\n    char lname[NLEN];\n\
  \    int letters;\n};\n\nvoid getinfo(struct namect *);\nvoid makeinfo(struct namect\
  \ *);\nvoid showinfo(const struct namect *);\nchar * s_gets(char * st, int n);\n\
  \nint main(void)\n{\n    struct namect person;\n    getinfo(&person);\n    makeinfo(&person);\n\
  \    showinfo(&person);\n    return 0;\n}\n\nvoid getinfo (struct namect * pst)\n\
  {\n    printf(\"Please enter your first name.\\n\");\n    s_gets(pst->fname, NLEN);\n\
  \    printf(\"Please enter your last name.\\n\");\n    s_gets(pst->lname, NLEN);\n\
  }\n\nvoid makeinfo (struct namect * pst)\n{\n    pst->letters = strlen(pst->fname)\
  \ +\n    strlen(pst->lname);\n}\n\nvoid showinfo (const struct namect * pst)\n{\n\
  \    printf(\"%s %s, your name contains %d letters.\\n\",\n           pst->fname,\
  \ pst->lname, pst->letters);\n}\n\nchar * s_gets(char * st, int n)\n{\n    char\
  \ * ret_val;\n    char * find;\n    ret_val = fgets(st, n, stdin);\n    if (ret_val)\n\
  \    {\n        find = strchr(st, '\\n');   // look for newline\n        if (find)\
  \               // if the address is not NULL,\n            *find = '\\0';     \
  \      // place a null character there\n        else\n            while (getchar()\
  \ != '\\n')\n                continue;           // dispose of rest of line\n  \
  \  }\n    return ret_val;\n}\n```\n\n编译并运行程序产生的结果如下：\n\n点击此处查看代码图像\n\n```\nPlease\
  \ enter your first name.\nViola\n\nPlease enter your last name.\nPlunderfest\n\n\
  Viola Plunderfest, your name contains 16 letters.\n```\n\n该程序的工作被分配给了三个从 `main()`\
  \ 调用的函数。在每种情况下，`person` 结构的地址都被传递给了这些函数。\n\n`getinfo()` 函数将信息从自身传递到 `main()`。具体来说，它从用户处获取名称并将其放入\
  \ `person` 结构中，使用 `pst` 指针来定位。记得 `pst->lname` 意味着 `pst` 所指向的结构体的 `lname` 成员。这使得\
  \ `pst->lname` 等同于 `char` 数组名，因此是 `gets()` 的合适参数。注意，尽管 `getinfo()` 向主程序传递了信息，但它没有使用返回机制，因此它的类型是\
  \ `void`。\n\n`makeinfo()` 函数执行了信息的双向传输。通过指向 `person` 的指针，它定位了存储在结构中的两个名称。它使用 C 库函数\
  \ `strlen()` 计算每个名称的字母总数，然后使用 `person` 的地址存储总和。同样，其类型是 `void`。最后，`showinfo()` 函数使用指针来定位要打印的信息。由于此函数没有修改数组的内容，因此它将指针声明为\
  \ `const`。\n\n在所有这些操作中，只有一个结构体变量 `person`，并且每个函数都使用了该结构的地址来访问它。一个函数将信息从自身传递到调用程序，一个将信息从调用程序传递到自身，而一个两者都做了。\n\
  \n现在让我们看看你如何使用结构体参数和返回值来实现相同的任务。首先，要传递结构体本身，请使用参数 `person` 而不是 `&person`。那么，对应的形式参数声明类型为\
  \ `struct namect`，而不是指向该类型的指针。其次，为了向 `main()` 提供结构体值，你可以返回一个结构体。列表 14.9 展示了非指针版本。\n\
  \n列表 14.9 names2.c 程序\n\n点击此处查看代码图像\n\n***\n\n```c\n/* names2.c --传递并返回结构体 */\n\
  #include <stdio.h>\n#include <string.h>\n\n#define NLEN 30\n\nstruct namect {\n\
  \    char fname[NLEN];\n    char lname[NLEN];\n    int letters;\n};\n\nstruct namect\
  \ getinfo(void);\nstruct namect makeinfo(struct namect);\nvoid showinfo(struct namect);\n\
  char * s_gets(char * st, int n);\n\nint main(void)\n{\n    struct namect person;\n\
  \    person = getinfo();\n    person = makeinfo(person);\n    showinfo(person);\n\
  \    return 0;\n}\n\nstruct namect getinfo(void)\n{\n    struct namect temp;\n \
  \   printf(\"Please enter your first name.\\n\");\n    s_gets(temp.fname, NLEN);\n\
  \    printf(\"Please enter your last name.\\n\");\n    s_gets(temp.lname, NLEN);\n\
  \    return temp;\n}\n\nstruct namect makeinfo(struct namect info)\n{\n    info.letters\
  \ = strlen(info.fname) + strlen(info.lname);\n    return info;\n}\n\nvoid showinfo(struct\
  \ namect info)\n{\n    printf(\"%s %s, your name contains %d letters.\\n\",\n  \
  \         info.fname, info.lname, info.letters);\n}\n\nchar * s_gets(char * st,\
  \ int n)\n{\n    char * ret_val;\n    char * find;\n    ret_val = fgets(st, n, stdin);\n\
  \    if (ret_val)\n    {\n        find = strchr(st, '\\n');   // 查找 newline\n  \
  \      if (find)               // 如果地址不是 NULL，\n            *find = '\\0';     \
  \      // 在处放置一个空字符\n        else\n            while (getchar() != '\\n')\n    \
  \            continue;           // 丢行的剩余部分\n    }\n    return ret_val;\n}\n```\n\
  \n***\n\n这个版本与前一个版本产生相同的结果，但处理方式不同。这三个函数中的每一个都创建了 `person` 的副本，因此此程序使用了四个不同的结构体。在前一个程序中，传递的是\
  \ `person` 的地址，函数处理的是副本。在第二个版本中，创建了一个名为 `info` 的新结构。存储在 `person` 中的值被拷贝到 `info`，但返回机制解决了这个问题。`makeinfo()`\
  \ 那行将 `info` 返回给 `person`。\n\n\n\n\n此外，在指针版本中，用户必须记住求和地址应该是第一个参数还是最后一个参数。\n\n传递结构的两个主要缺点是：旧的实现可能无法处理这些代码，而且它会浪费时间和空间。将大型结构传递给只使用结构中一或两个成员的函数是非常浪费资源的。在这种情况下，传递指针或仅将所需的成员作为单独参数传递会更有意义。\n\
  \n通常，程序员出于效率考虑，会使用结构体指针作为函数参数，并在需要时使用 `const` 来保护数据免受意外修改。按值传递结构通常用于那些本身就很小的结构。\n\
  \n## 结构体中的字符数组或字符指针\n\n到目前为止的示例都使用字符数组在结构体中存储字符串。你可能想过是否可以使用指向 `char` 的指针来代替。例如，列表\
  \ 14.3 中有如下声明：\n\n```c\n#define LEN 20\n\nstruct names {\n    char first[LEN];\n\
  \    char last[LEN];\n};\n```\n\n你可以改用这种吗？\n\n```c\nstruct pnames {\n    char *\
  \ first;\n    char * last;\n};\n```\n\n答案是你可以，但除非你理解其含义，否则你可能会遇到麻烦。考虑以下代码：\n\n点击此处查看代码图像\n\
  \n```c\nstruct names veep = {\"Talia\", \"Summers\"};\n\nstruct pnames treas = {\"\
  Brad\", \"Fallingjaw\"};\n\nprintf(\"%s and %s\\n\", veep.first, treas.first);\n\
  ```\n\n这是有效代码，并且可以运行，但请考虑字符串被存储在何处。对于 `struct names` 变量 `veep`，字符串存储在结构体内部；该结构体分配了共\
  \ 40 字节来存储这两个名字。然而，对于 `struct pnames` 变量 `treas`，字符串存储在编译器存储字符串常量的任何地方。该结构体持有的只是两个地址，这在我们的系统上总共占用\
  \ 16 字节。特别是，`struct pnames` 结构体没有为存储字符串分配任何空间。它只能用于那些在其他地方已分配空间的字符串，例如字符串常量或数组中的字符串。简而言之，`pnames`\
  \ 结构体中的指针应该仅用于管理程序中其他地方创建并分配的字符串。\n\n让我们看看这种限制何时会成为问题。考虑以下代码：\n\n点击此处查看代码图像\n\n\
  ```c\nstruct names accountant;\n\nstruct pnames attorney;\n\nputs(\"Enter the last\
  \ name of your accountant:\");\n\nscanf(\"%s\", accountant.last);\n\nputs(\"Enter\
  \ the last name of your attorney:\");\n\nscanf(\"%s\", attorney.last);   /* 这里存在危险\
  \ */\n```\n\n从语法上来说，这段代码没有问题。但输入存储在何处呢？对于会计师，名字存储在 `accountant` 变量的最后一个成员中；该结构体有一个数组来存放字符串。对于律师，`scanf()`\
  \ 被告知将字符串放在 `attorney.last` 给出的地址处。因为这是一个未初始化的变量，该地址可以是任何值，程序可能会尝试将名字放在任何地方。如果你足够幸运，程序可能会运行，至少在某些时候是这样——或者一次尝试就会让你的程序崩溃停止。实际上，如果程序运行了，说明你运气不好，因为程序将包含一个你未察觉的危险编程错误。\n\
  \n所以，如果你想用结构体存储字符串，使用字符数组成员更简单。存储指向 `char` 的指针虽有其用处，但也存在被严重误用的可能。\n\n## 结构体、指针与\
  \ malloc()\n\n在结构体中使用指针处理字符串，一种有意义的实例是：你使用 `malloc()` 分配内存并使用指针来存储地址。这种方法的优势是，你可以要求\
  \ `malloc()` 只分配字符串所需的空间。你可以要求分配 4 字节来存储 `\"Joe\"`，并为马达加斯加斯加尔的人名 `\"Rasolofomasoandro\"\
  ` 分配 18 字节。将 列表 14.9 适配为这种方法并不困难。两个主要变化是修改结构体定义以使用指针代替数组，然后提供一个新版本的 `getinfo()`\
  \ 函数。\n\n新的结构体定义看起来像这样：\n\n点击此处查看代码图像\n\n```c\nstruct namect {\n    char * fname;\
  \  // 使用指针代替数组\n    char * lname;\n    int letters;\n};\n```\n\n新版本的 `getinfo()`\
  \ 将输入读取到临时数组中，使用 `malloc()` 分配存储空间，并将字符串拷贝到新分配的空间。它将对每个名字执行此操作：\n\n点击此处查看代码图像\n\n\
  ```c\nvoid getinfo (struct namect * pst)\n{\n    char temp[SLEN];\n    printf(\"\
  Please enter your first name.\\n\");\n    s_gets(temp, SLEN); // 分配内存存放名字\n    pst->fname\
  \ = (char *) malloc(temp) + 1; // 将名字拷贝到分配的内存\n    strcpy(pst->fname, temp);\n \
  \   printf(\"Please enter your last name.\\n\");\n    s_gets(temp, SLEN);\n    pst->lname\
  \ = (char *) malloc(temp) + 1;\n    strcpy(pst->lname, temp);\n}\n```\n\n\n\n\n\
  点击此处查看代码图像\n\n请输入你的名字。\n\nFloresiensis\n\n请输入你的姓氏。\n\nMann\n\nFloresiensis Mann，你的名字包含\
  \ 16 个字母。\n\n## 复合字面量与结构体 (C99)\n\nC99 的复合字面量（compound literal）适用于结构体也适用于数组。如果你只需要一个临时的结构体值，它非常有用。例如，你可以使用复合字面量创建一个结构体，作为函数参数或赋值给另一个结构体。其语法是在花括号括的初始化列表前加上带括号的类型名。例如，以下是一个\
  \ `struct book` 类型的复合字面量：\n\n点击此处查看代码图像\n\n`(struct book) {\"The Idiot\", \"Fyodor\
  \ Dostoyevsky\", 6.99}`\n\n列表 14.11 显示了一个使用复合字面量为结构体变量提供两个备选值的示例。（在编写时，某些（但不是所有）编译器支持此特性，但时间会解决这个问题。）\n\
  \n列表 14.11 complit.c 程序\n\n点击此处查看代码图像\n\n```c\n/* complit.c -- compound literals\
  \ */\n\n#include <stdio.h>\n\n#define MAXTITL  41\n\n#define MAXAUTL  31\n\nstruct\
  \ book {           // 结构体模板：标签 为 book\n    char title[MAXTITL];\n    char author[MAXAUTL];\n\
  \    float value;\n};\n\nint main(void)\n{\n    struct book readfirst;\n    int\
  \ score;\n    printf(\"Enter test score: \");\n    scanf(\"%d\",&score);\n    if(score\
  \ >= 84)\n        readfirst = (struct book) {\"Crime and Punishment\",\n       \
  \                              \"Fyodor Dostoyevsky\",\n                       \
  \              11.25};\n    else\n        readfirst = (struct book) {\"Mr. Bouncy's\
  \ Nice Hat\",\n                                     \"Fred Winsome\",\n        \
  \                             5.99};\n    printf(\"Your assigned reading:\\n\");\n\
  \    printf(\"%s by %s: $%.2f\\n\",readfirst.title,\n      readfirst.author, readfirst.value);\n\
  \    return 0;\n}\n```\n\n你也可以将复合字面量作为函数的参数。如果函数期望一个结构体，你可以将复合字面量作为实际参数传递：\n\n点击此处查看代码图像\n\
  \n```c\nstruct rect {double x; double y;};\ndouble rect_area(struct rect r){return\
  \ r.x * r.y;}\n...\n\ndouble area;\narea = rect_area( (struct rect) {10.5, 20.0});\n\
  ```\n\n这会导致 `area` 被赋值为值 `210.0`。\n\n如果函数期望一个地址，你可以传递复合字面量的地址：\n\n点击此处查看代码图像\n\n\
  ```c\nstruct rect {double x; double y;};\ndouble rect_areap(struct rect * rp){return\
  \ rp->x * rp->y;}\n...\n\ndouble area;\narea = rect_areap( &(struct rect) {10.5,\
  \ 20.0});\n```\n\n这会导致 `area` 被赋值为值 `210.0`。\n\n出现在任何函数之外的复合字面量具有静态存储期，而出现在块内部的字面量具有自动存储期。复合字面量的语法规则与普通列表相同。这意味着，例如，你可以使用指定初始化器。\n\
  \n## 灵活数组成员 (C99)\n\nC99 拥有一个名为“灵活数组成员”（flexible array member）的特性。它允许你声明一个结构体，其最后一个成员是一个具有特殊属性的数组。一个特殊属性是该数组并不存在——至少，不是。第二个特殊属性是，通过正确的代码，你可以像使用它一样使用灵活数组，并且拥有你所需的任何数量的元素。这听起来有点奇怪，让我们来看看创建和使用带有灵活数组结构体的步骤。\n\
  \n首先，声明灵活数组的规则如下：\n- 灵活数组成员必须是结构体的最后一个成员。\n- 必须至少有另一个成员。\n- 灵活数组的声明方式与普通数组一样，只是括号内是空的。\n\
  \n这里是一个说明这些规则的示例：\n\n点击此处查看代码图像\n\n```c\nstruct flex\n{\n    int count;\n    double\
  \ average;\n    double scores[]; // 灵活数组\n};\n```\n\n如果你声明一个类型为 `struct flex` 的变量，你就无法用\
  \ `scores` 做任何事，因为没有为它留出内存空间。事实上，设计并不是让你去声明 `struct flex` 类型的变量。相反，你应该声明一个指向 `struct\
  \ flex` 的指针，然后使用 `malloc()` 为 `struct flex` 的内容加上你为灵活数组所需的额外空间分配足够的空间。例如，假设你想让 `scores`\
  \ 代表一个包含五个 `double` 值的数组。那么你应该这样做：\n\n点击此处查看代码图像\n\n```c\nstruct flex *pf; // 声明一个指针\n\
  pf = malloc(sizeof(struct flex) + 5 * sizeof(double)); // 分配空间```\n\n现在你拥有了足够的内存来存储\
  \ `count`、`average` 以及五个 `double` 值的数组。你可以使用指针 `pf` 来访问这些成员：点击此处查看代码图像\n\n```c\n\
  pf->count = 5; // 设置 count\n```\n\n列表 14.12 进一步说明了这一点，让灵活数组在一种情况下代表五个值，在另一种情况下代表九值。它还展示了带有灵活数组的结构体。列表\
  \ 14.12 flexmemb.c 程序\n\n点击此处查看代码图像\n\n```c\n// flexmemb.c -- flexible array member\
  \ (C99)\n#include <stdio.h>\n#include <stdlib.h>\n\nstruct flex\n{\n    int count;\n\
  \    double average;\n    double scores[]; // 灵活数组\n};\n\nvoid showFlex(const struct\
  \ flex * p);\n\nint main(void)\n{\n    struct flex * pf1, *pf2;\n    int n = 5;\n\
  \    int i;\n    double tot = 0;\n\n    // 分配空间用于结构加上数组\n    pf1 = malloc(sizeof(struct\
  \ flex) + n * sizeof(double));\n    pf1->count = n;\n    for (i = 0; i < n; i++)\n\
  \    {\n        pf1->scores[i] = 20.0 - i;\n        tot += pf1->scores[i];\n   \
  \ }\n    pf1->average = tot / n;\n    showFlex(pf1);\n    free(pf1);\n\n    n =\
  \ 9;\n    tot = 0;\n    // 分配空间用于数组\n    pf2 = malloc(sizeof(struct flex) + n *\
  \ sizeof(double));\n    pf2->count = n;\n    for (i = 0; i < n; i++)\n    {\n  \
  \      pf2->scores[i] = 20.0 - i/2.0;\n        tot += pf2->scores[i];\n    }\n \
  \   pf2->average = tot / n;\n    showFlex(pf2);\n    free(pf2);\n\n    return 0;\n\
  }\n\nvoid showFlex(const struct flex * p)\n{\n    int i;\n    printf(\"Scores :\
  \ \");\n    for (i = 0; i < p->count; i++)\n        printf(\"%g \", p->scores[i]);\n\
  \    printf(\"\\nAverage: %g\\n\", p->average);\n}\n```\n\n这是输出结果：\n\n点击此处查看代码图像\n\
  \n```text\nScores : 20 19 18 17 16\nAverage: 18\nScores : 20 19.5 19 18.5 18 17.5\
  \ 17 16.5 16\nAverage: 17\n```\n\n带有灵活数组的结构体有一些特殊的处理要求。首先，不要使用结构赋值进行拷贝：点击此处查看代码图像\n\
  \n```c\nstruct flex * pf1, *pf2; // *pf1 和 *pf2 是结构体\n...\n*pf2 = *pf1; // 不要这样做\n\
  ```\n\n这只会拷贝结构中的非灵活成员。相反，请使用第 16 章“C 预处理器和 C 标准库”中描述的 `memcpy()` 函数。\n\n其次，不要在按值传递结构体的函数中使用这种结构体。原因相同；按值传递参数就像赋值。相反，请使用传递结构体地址的函数。\n\
  \n第三，不要将灵活数组成员的结构体作为数组元素或另一个结构体的成员。\n\n\n\n\n\n你们中的一些可能听说过类似于灵活数组成员（flexible array\
  \ member）的东西，它被称为 `struct hack`。`struct hack` 没有使用空括号来声明灵活成员，而是指定了一个大小为 0 的数组。然而，`struct\
  \ hack` 是一种针对特定编译器（GCC）有效的技巧；它并不是标准 C 语言。灵活成员方法提供了该技术的标准认可版本。\n\n## 匿名结构体 (C11)\n\
  \n匿名结构体是一个未命名的结构的结构体成员。为了了解它是如何工作的，我们先考虑以下嵌套结构体的设置：\n\n点击此处查看代码图片\n\n```c\nstruct\
  \ names\n{\n    char first[20];\n    char last[20];\n};\n\nstruct person\n{\n  \
  \  int id;\n    struct names name;  // 嵌套结构成员\n};\n\nstruct person ted = {8483,\
  \ {\"Ted\", \"Grass\"}};\n```\n\n在这里，`name` 成员是一个嵌套结构，你可以使用像 `ted.name.first` 这样的表达式来访问\
  \ `\"Ted\"`：\n\n```c\nputs(ted.name.first);\n```\n\n在 C11 中，你可以使用嵌套的未命名成员结构来定义 `person`：\n\
  \n点击此处查看代码图片\n\n```c\nstruct person\n{\n    int id;\n    struct {char first[20];\
  \ char last[20];};  // 匿名结构体\n};\n```\n\n你可以用相同的方式初始化这个结构体：\n\n点击此处查看代码图片\n\n```c\n\
  struct person ted = {8483, {\"Ted\", \"Grass\"}};\n```\n\n但访问变得简单了，因为你可以直接使用 `first`\
  \ 等成员名，就像它们是 `person` 的成员一样：\n\n```c\nputs(ted.first);\n```\n\n当然，你完全可以直接让 `first`\
  \ 和 `last` 成为 `person` 的直接成员并消除嵌套结构。匿名功能在嵌套联合体（unions）中会变得更有用，我们将在本章稍后部分讨论。\n\n\
  ## 使用结构体数组的函数\n\n假设你有一个结构体数组并用用函数处理它。数组名是其地址的同义词，因此它可以传递给函数。同样，函数需要访问结构体模板。为了展示工作原理，列表\
  \ 14.13 将我们的货币程序扩展到两个人，以便其拥有一个包含两个 `funds` 结构体的数组。\n\n列表 14.13 funds4.c 程序\n\n点击此处查看代码图片\n\
  \n```c\n/* funds4.c -- 将结构体数组传递给函数 */\n#include <stdio.h>\n\n#define FUNDLEN 50\n\
  #define N 2\n\nstruct funds {\n    char   bank[FUNDLEN];\n    double bankfund;\n\
  \    char   save[FUNDLEN];\n    double savefund;\n};\n\ndouble sum(const struct\
  \ funds money[], int n);\n\nint main(void)\n{\n    struct funds jones[N] = {\n \
  \       {\n            \"Garlic-Melon Bank\",\n            4032.27,\n          \
  \  \"Lucky's Savings and Loan\",\n            8543.94\n        },\n        {\n \
  \           \"Honest Jack's Bank\",\n            3620.88,\n            \"Party Time\
  \ Savings\",\n            3802.91\n        }\n    };\n    printf(\"The Joneses have\
  \ a total of $%.2f.\\n\",\n           sum(jones,N));\n    return 0;\n}\n\ndouble\
  \ sum(const struct funds money[], int n)\n{\n    double total;\n    int i;\n   \
  \ for (i = 0, total = 0; i < n; i++)\n        total += money[i].bankfund + money[i].savefund;\n\
  \    return(total);\n}\n```\n\n输出如下：\n\n点击此处查看代码图片\nJones 一家总共有 $2000.00。（多么多么整齐的数字！人们会认为这些数字是伪造的。）\n\
  \n数组名 `jones` 是数组的地址。具体来说，它是数组第一个元素的地址，即 `jones[0]`。因此，指针 `money` 由此表达式给出：\n`money\
  \ = &jones[0];`\n\n由于 `money` 指向 `jones` 数组的第一个元素，`money[0]` 是第一个元素的另一个名称。同样，`money[1]`\
  \ 是第二个元素。每个元素都是 `funds` 结构体，因此每个元素都可以使用点 (`.`) 运算符来访问结构体成员。\n\n这些是要点：\n- 你可以使用数组名向函数传递第一个结构体的地址。\n\
  - 随后你可以使用数组表示法访问数组中连续的结构体。\n- 注意，函数调用 `sum(&jones[0], N)` 的效果与使用数组名相同，因为 `jones`\
  \ 和 `&jones[0]` 是同一个地址。\n- 使用数组名只是传递结构体的间接方式。\n- 因为 `sum()` 函数不应该修改原始数据，该函数使用了 ANSI\
  \ C 的 `const` 修饰符。\n\n### 在文件中保存结构体\n\n由于结构体可以包含各种类型的信息，因此它们是构建数据库的重要工具。例如，你可以使用一个结构体来存储有关员工的所有相关信息。最终，你希望能够将这些信息保存到文件中并从文件中检索。结构体中持有的整个信息集被称为\
  \ `record`（记录），单个项目被称为 `fields`（字段）。\n\n保存记录最明显的方法也许是效率最低的方法，即使用 `fprintf()`。例如，回想\
  \ 列表 14.1 中引入的 `book` 结构：\n\n```c\n#define MAXTITL 40\n#define MAXAUTL 40\nstruct\
  \ book {\n    char title[MAXTITL];\n    char author[MAXAUTL];\n    float value;\n\
  };\n```\n\n如果 `pbooks` 标识了一个文件流，你可以可以使用语句在名为 `primer` 的 `struct book` 变量中保存信息：\n\
  \n点击此处查看代码图片\n```c\nfprintf(pbooks, \"%s %s %.2f\\n\", primer.title,\n       primer.author,\
  \ primer.value);\n```\n\n对于具有例如 30 个成员的结构体，这种设置会变得难以处理。此外，它还带来了检索问题，因为程序需要某种方法来告诉一个字段何时结束，另一个字段何时开始。这个问题可以通过使用固定大小字段的格式（例如\
  \ `\"%39s%39s%8.2f\"`）来解决，但笨拙感依然存在。\n\n更好的解决方案是使用 `fread()` 和 `fwrite()` 来读取和写入结构体大小的单元。回这些函数使用程序使用的相同的二进制表示进行读写。例如，点击此处查看代码图片\n\
  \n```c\nfwrite(&primer, sizeof (struct book), 1, pbooks);\n```\n\n它跳转到 `primer`\
  \ 结构的起始地址，并将结构体的所有字节复制到与 `pbooks` 关联的文件。`sizeof (struct book)` 项告诉函数要复制多大的块，而 `1`\
  \ 表示它应该只复制一个块。带有相同参数的 `fread()` 函数从文件向 `&primer` 指向的位置复制一个结构体大小的数据块。简而言之，这些函数一次读取和写入一个整个记录，而不是一次一个字段。\n\
  \n以二进制表示保存数据的一个缺点是不同系统可能使用不同的二进制表示，因此数据文件可能不具有移植性。即使在同一个系统中，不同的编译器设置也导致不同的二进制布局。\n\
  \n## 结构体保存示例\n\n为了展示如何在程序中使用这些函数，我们修改了 列表 14.2 中的程序，将书名保存到名为 `book.dat` 的文件中。如果文件已存在，程序将显示其当前内容并允许你向文件中添加内容。列表\
  \ 14.14 展示了新版本。（如果你使用的是旧 Borland 编译器，请查看列表 14.2 附近侧边栏中的“Borland C 与浮点数#ch14.html_ch14sb01)”讨论。）\n\
  \n\n\n\n\n```c\n#include <string.h>\n\n#define MAXTITL  40\n\n#define MAXAUTL  40\n\
  \n#define MAXBKS   10          /* maximum number of books */\n\nchar * s_gets(char\
  \ * st, int n);\n\nstruct book {               /* set up book template */\n    char\
  \ title[MAXTITL];\n    char author[MAXAUTL];\n    float value;\n};\n\nint main(void)\n\
  {\n    struct book library[MAXBKS]; /* array of structures     */\n    int count\
  \ = 0;\n    int index, filecount;\n    FILE * pbooks;\n    int size = sizeof (struct\
  \ book);\n    if ((pbooks = fopen(\"book.dat\", \"a+b\")) == NULL)\n    {\n    \
  \    fputs(\"Can't open book.dat file\\n\",stderr);\n        exit(1);\n    }\n \
  \   rewind(pbooks);               /* go to start of file     */\n    while (count\
  \ < MAXBKS &&  fread(&library[count], size,\n                                  \
  \   1, pbooks) == 1)\n    {\n        if (count == 0)\n            puts(\"Current\
  \ contents of book.dat:\");\n        printf(\"%s by %s: $%.2f\\n\",library[count].title,\n\
  \              library[count].author, library[count].value);\n        count++;\n\
  \    }\n    filecount = count;\n    if (count == MAXBKS)\n    {\n        fputs(\"\
  The book.dat file is full.\", stderr);\n        exit(2);\n    }\n    puts(\"Please\
  \ add new book titles.\");\n    puts(\"Press [enter] at the start of a line to stop.\"\
  );\n    while (count < MAXBKS && s_gets(library[count].title, MAXTITL) != NULL\n\
  \          && library[count].title[0] != '\\0')\n    {\n        puts(\"Now enter\
  \ the author.\");\n        s_gets(library[count].author, MAXAUTL);\n        puts(\"\
  Now enter the value.\");\n        scanf(\"%f\", &library[count++].value);\n    \
  \    while (getchar() != '\\n')\n            continue;               /* clear input\
  \ line     */\n        if (count < MAXBKS)\n            puts(\"Enter the next title.\"\
  );\n    }\n    if (count > 0)\n    {\n        puts(\"Here is the list of your books:\"\
  );\n        for (index = 0; index < count; index++)\n            printf(\"%s by\
  \ %s: $%.2f\\n\",library[index].title,\n              library[index].author, library[index].value);\n\
  \        fwrite(&library[filecount], size, count - filecount,\n              pbooks);\n\
  \    }\n    else\n        puts(\"No books? Too bad.\\n\");\n    puts(\"Bye.\\n\"\
  );\n    fclose(pbooks);\n    return 0;\n}\n\nchar * s_gets(char * st, int n)\n{\n\
  \    char * ret_val;\n    char * find;\n    ret_val = fgets(st, n, stdin);\n   \
  \ if (ret_val)\n    {\n        find = strchr(st, '\\n');   // look for newline\n\
  \        if (find)                  // if the address is not NULL,\n           \
  \ *find = '\\0';          // place a null character there\n        else\n      \
  \      while (getchar() != '\\n')\n                continue;      // dispose of\
  \ rest of line\n    }\n    return ret_val;\n}\n```\n\n***\n\n我们将查看几次示例运行，然后讨论主要的编程点。点击此处查看代码图像\n\
  \n$ booksave\nPlease add new book titles.\nPress [enter] at the start of a line\
