  \ 特性\n\n## 索引\n\n## 献辞\n\n纪念父亲 William Prata。\n\n## 关于作者\n\n**Stephen Prata**现已退休，曾在加利福尼亚州肯特菲尔的马林学院教授天文学、物理和编程。他在加利福尼亚理工学院获得学士学位，在加州大学伯克利分校获得博士学位。他与计算机缘缘于星团的计算机建模。他编写或合著了十本书，包括\
  \ *C++ Primer Plus* 和 *Unix Primer Plus*。\n\n## 致谢\n\n我要感谢 Pearson 的 Mark Taber\
  \ 启动并完成了这个项目。还要感谢 Danny Kalev 提供的技术帮助以及他提出的“程序作用域（program scope）”这一术语。\n\n## 我们希望听取你的声音！\n\
