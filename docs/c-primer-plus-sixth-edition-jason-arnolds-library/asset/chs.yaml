  表 6.2 运算符优先级\n\n### 总结：while 语句\n\n**关键字：** `while`\n\n**通用说明：** `while`语句创建一个循环，直到测试表达式变为假（或零）。`while`语句是一种进入条件循环——也就是说，在进入循环之前就会决定是否执行一次循环。因此，循环可能永远不会执行。格式中的语句部分可以是简单语句，也可以是复合语句。\n\
  \n**格式：**\n```\nwhile (expression)\n    statement\n```\n重复语句直到表达式变为假或 0。\n\n**示例：**\
  \ 点击此处查看代码图像\n\n```\nwhile (n++ < 100)\n    printf(\" %d %d\\n\",n, 2 * n + 1);\
  \ // single statement\nwhile (argo < 100)\n{\n    argo = argo + step;\n    step\
  \ = 2 * step;\n} // compound statement\n```\n\n### 总结：关系运算符和表达式\n\n**关系运算符：** 每个关系运算符都比较其左侧的值与右侧的值。\n\
  \n**关系表达式：** 一个简单的关系表达式由一个两边各有一个操作数的`关系运算符`组成。如果关系为真，则关系表达式的值为 1。如果关系为假，关系表达式的值为\
  \ 0。\n\n**示例：** `5 > 2`为真，值为 1。`(2 + a) == a`为假，值为 0。\n\n### 不确定循环与计数循环\n\n某些`while`循环示例包含“不确定循环”。这意味着我们无法预先知道在表达式变为假之前，循环会执行多少次。例如，当列表\
  \ 6.1 使用交互式循环来计算整数总和时，我们并不知道会输入多少个整数。然而，其他示例是“计数循环”。它们执行预定的重复次数。列表 6.10 是一个`while`计数循环的简短示例。\n\
  \n#### 列表 6.10 程序：sweetie.c\n\n点击此处查看代码图像\n\n```\n// sweetie.c -- a counting loop\n\
  \n#include <stdio.h>\n\nint main(void)\n{\n    const int NUMBER = 2;\n    int count\
  \ = 1; // initialization\n    while (count <= NUMBER) // test\n    {\n        printf(\"\
