  \ `1`，但如果用户输入 `q`，它不会返回 1。`==` 运算符测试相等性，因此你可以它来比较 `scanf()` 的返回值与 `1`。\n\n## 6.\
  \ C 控制语句：循环\n\n你将在本章学习以下内容：\n\n![Image](img/squf.jpg) 关键字：\n\n`for`\n\n`while`\n\
  \n`do while`\n\n![Image](img/squf.jpg) 运算符：\n\n`< > >=`\n\n`<= != == +=`\n\n`*=\
  \ -= /= %=`\n\n![Image](img/squf.jpg) 函数：\n\n`fabs()`\n\n![Image](img/squf.jpg)\
  \ C 的三种循环结构——`while`、`for` 和 `do while`\n\n![Image](img/squf.jpg) 使用关系运算符构造控制循环的表达式\n\
  \n![Image](img/squf.jpg) 其他几个运算符\n\n![Image](img/squf.jpg) 经常与循环配合使用的数组\n\n![Image](img/squf.jpg)\
  \ 编写带有返回值的函数\n\n强大、智能、多功能且实用！我们大多数人都不介意被这样描述。通过 C 语言，至少有机会让我们的程序被这样描述。诀窍在于控制程序的流。根据计算机科学（这是关于计算机的科学，而不是由计算机的科学……目前如此），一种好的语言应该提供这三种程序流形式：\n\
  \n![Image](img/squf.jpg) 执行一组语句\n\n![Image](img/squf.jpg) 重复一组语句直到满足某些条件（循环）\n\n\
  ![Image](img/squf.jpg) 使用测试在备选序列之间做出选择（分支）\n\n你熟悉第一种；之前所有的程序都由一组语句组成。`while` 循环是第二种形式的一个示例。本章将密切关注\
  \ `while` 循环以及另外两种循环结构——`for` 和 `do while`。最后一种形式在不同的可能方案之间进行选择，使程序更加“智能”，并增加了计算机的实用性。\n\
  \n### 重温 while 循环\n\n`while` 循环是第二种形式的一个示例。本章将密切关注 `while` 循环以及另外两种循环结构——`for` 和\
  \ `do while`。最后一种形式在不同的可能方案之间进行选择，使程序变得更加“智能”，并增加了计算机的实用性。\n\n\n\n\n为了让程序正常运行，它在每个循环周期中都应该为\
  \ `num` 获取一个新值，并在每个周期中重置 `status`。程序通过使用 `scanf()` 的两个不同功能来实现这一点。首先，它使用 `scanf()`\
  \ 尝试为 `num` 读取一个新值。其次，它利用 `scanf()` 的返回值来报告该尝试的成功与。回想第 4 章 中的“字符字符串和格式化输入输出”，`scanf()`\
  \ 返回成功读取的项数。如果 `scanf()` 成功读取一个整数，它会将该整数放入 `num` 中并返回值 `1`，该值被赋值给 `status`。（注意输入值进入的是\
  \ `num` 而不是 `status`。）这同时更新了 `num` 和 `status` 的值，然后 `while` 循环进入下一个周期。如果你输入非数字内容（如\
  \ `q`），`scanf()` 将无法找到可读取的整数，因此它的返回值和 `status` 将为 `0`。这会导致循环终止。输入字符 `q` 因为不是数字，会被放回输入队列；它不会被读取。（实际上，任何非数字输入而不仅仅是\
  \ `q` 都会终止循环，但要求用户输入 `q` 比要求用户输入非数字内容的指令更简单。）\n\n如果 `scanf()` 在尝试转换值之前遇到问题（例如检测到文件结束或遇到硬件问题），它会返回特殊值\
  \ `EOF`，该值通常定义为 `-1`。这个值同样会导致循环终止。\n\n这种对 `scanf()` 的双重用法解决了循环交互式输入中一个棘手的问题：你如何告诉循环何时停止？假设，如果\
  \ `scanf()` 没有返回值，那么每个循环中唯一改变的将是 `num` 的值。你可以使用 `num` 的值来终止循环，例如使用 `num > 0`（`num`\
  \ 大于 0）或 `num != 0`（`num` 不等于 0）作为测试条件，但这会阻止你输入某些值作为输入，例如 `–3` 或 `0`。相反，你可以在循环中添加新代码，例如在每个周期询问“你想继续吗？<y/n>”，然后测试用户是否输入了\
  \ y。这有点笨拙且减慢了输入速度。使用 `scanf()` 的返回值可以避免这些问题。\n\n现在让我们仔细观察一下程序结构。我们可以将其总结如下：\n\n\
  ```\n初始化 sum 为 0\n提示用户\n读取输入\n当输入是整数时，\n    将输入加到 sum，\n    提示用户，\n    然后读取下一个输入\n\
  输入完成后，打印 sum\n```\n\n顺便提一下，这是*伪代码*（pseudocode）的一个示例，伪代码是用简单的英语表达程序且其形式与计算机语言平行的艺术。伪代码对于推演程序的逻辑非常有用。逻辑看起来正确后，你可以将伪代码翻译成实际的编程代码。伪代码的一个优势是它让你能够专注于程序的逻辑和组织，而无需同时担心如何在计算机语言中表达这些思想。在这里，例如，你可以使用缩进来表示代码块，而不必担心\
  \ C 语法需要大括号。另一个优势是伪代码不束缚于特定语言，因此相同的伪代码可以翻译成不同的计算机语言。\n\n无论如何，由于 `while` 循环是一种进入条件循环，程序在进入循环体*之前*必须获取输入并检查\
  \ `status` 的值。这就是为什么程序在 `while` 之前有一个 `scanf()`。为了让循环继续，你需要在循环内部有一个读取语句，以便它可以找到下次输入的状态。这就是为什么程序在\
  \ `while` 循环末尾也有一个 `scanf()` 语句；它为下一次迭代做准备。你可以将以下内容视为循环的标准格式：\n\n```\n获取第一个要测试的值\n\
  当测试成功时\n    处理值\n    获取下一个值\n```\n\n### C 风格读取循环\n\n列表 6.1 可以用 Pascal、BASIC 或 FORTRAN\
  \ 编写，采用与伪代码中显示的相同的设计。然而，C 提供了一个捷径。这种构造\n\n点击此处查看代码图像\n\n```c\nstatus = scanf(\"\
  %ld\", &num);\nwhile (status == 1)\n{\n    /* loop actions */\n    status = scanf(\"\
  %ld\", &num);\n}\n```\n\n可以用以下内容替换：\n\n点击此处查看代码图像\n\n```c\nwhile (scanf(\"%ld\"\
  , &num) == 1)\n{\n    /* loop actions */\n}\n```\n\n第二种形式同时以两种不同的方式使用 `scanf()`。首先，函数调用如果成功，会将一个值放入\
  \ `num` 中。其次，函数的返回值（为 `1`）控制循环。换句话说，C 的特性允许你将标准循环替换为以下这个精简版本：点击此处查看代码图像\n\n### while\
  \ 语句\n\n现在让我们更正式地观察 `while` 语句。它的通用形式如下：\n\n```\nwhile (expression)\n    statement\n\
  ```\n\n语句可以是带分号的简单语句，也可以是在大括号内的复合语句。到目前为止，示例使用了关系表达式；也就是说表达式是对值的比较。更通用，你可以使用任何表达式。如果表达式为真（通常指非零），则执行语句，然后测试表达式直到表达式为假（零）。每个周期被称为*迭代*（参见图\
  \ 6.1）。![Image](img/06fig01) 循环的结构\n\n#### 终止 while 循环\n\n关于 `while` 循环有一个*关键*点：当你构造\
  \ `while` 循环时，它必须包含更改表达式值的内容以便表达式变为假。否则，循环永远不会终止。（实际上，可以使用 `break` 和 `if` 语句来终止循环，但你还没有学习它们。）考虑这个示例：\n\
  \n点击此处查看代码图像\n\n```c\nindex = 1;\nwhile (index < 5)\n    printf(\"Good morning!\\\
  n\");\n```\n\n前面的片段无限地打印问候。为什么？因为循环内部没有改变 `index` 的初始值 `1`。现在考虑这个：\n\n点击此处查看代码图像\n\
  \n```c\nindex = 1;\nwhile (--index < 5)\n    printf(\"Good morning!\\n\");\n```\n\
  \n最后一个片段并没有好到哪里。它改变了 `index` 值，但方向错了！至少这个版本会在 `index` 降到系统可以处理的最低负数并变成最大的正值时最终终止。（第\
  \ 3 章所示的程序。\n\n列表 6.2 when.c 程序\n\n点击此处查看代码图像\n\n```c\n// when.c -- a loop quits\n\
  #include <stdio.h>\n\nint main(void)\n{\n    int n = 5;\n    while (n < 7)     \
  \   // 第 7 行\n    {\n        printf(\"n = %d\\n\", n);\n    }\n}\n```\n\n\n\n\n\n\
  ```c\n        n++;                        // line 10\n\n        printf(\"Now n =\
  \ %d\\n\", n);   // line 11\n\n    }\n\n    printf(\"The loop has finished.\\n\"\
  );\n\n    return 0;\n}\n```\n\n运行 Listing 6.2 会产生以下输出：\n\nn = 5\nNow n = 6\nn =\
  \ 6\nNow n = 7\nThe loop has finished.\n\n变量 `n` 在循环的第二次迭代中，于第 10 行获取了值 `7`。然而，程序此时并没有退出。相反，它完成了循环（第\
  \ 11 行），只有当第 7 行的测试条件被第三次求值时，才会退出循环。（在第一次测试时，变量 `n` 为 `5`；在第二次测试时为 `6`。）\n\n###\
  \ while：入口条件循环\n\n`while` 循环是一种使用入口条件的条件循环。它被称为“条件”循环，是因为语句部分的执行取决于测试表达式所描述的条件，例如\
  \ `(index < 5)`。该表达式之所以被称为入口条件，是因为在进入循环体之前，必须满足该条件。在如下所示的情况下，循环体永远不会被进入，因为条件从一开始就是虚假的：\n\
  \n点击此处查看代码图像\n\n```c\nindex = 10;\nwhile (index++ < 5)\n    printf(\"Have a fair\
  \ day or better.\\n\");\n```\n\n将第一行改为\n\n`index = 3;` 并且循环将会执行。\n\n### 语法要点\n\n\
  使用 `while` 时，请记住只有跟在测试条件之后的单个语句（无论是简单语句还是复合语句）才是循环的一部分。缩进是对读者的帮助，而不是给计算机的。Listing\
  \ 6.3 显示了如果你忘记这一点会发生什么。\n\nListing 6.3 的 while1.c 程序\n\n点击此处查看代码图像\n\n```c\n/* while1.c\
  \ -- 注意你的大括号      */\n/* 糟糕的编码会导致无限循环 */\n#include <stdio.h>\n\nint main(void)\n\
  {\n    int n = 0;\n    while (n < 3)\n        printf(\"n is %d\\n\", n);\n     \
  \   n++;\n    printf(\"That's all this program does\\n\");\n    return 0;\n}\n```\n\
  \nListing 6.3 产生以下输出：\n\nn is 0\nn is 0\nn is 0\nn is 0\nn is 0\n...依此类推，直到你杀死程序。\n\
  \n尽管这个示例对 `n++;` 语句进行了缩进，但它并没有将该语句和之前的语句包含在大括号内。因此，只有紧跟在测试条件之后的单个打印语句才是循环的一部分。变量\
  \ `n` 永远不会被更新，条件 `n < 3` 永远为真，你得到一个不断打印 `n is 0` 的循环，直到你杀死程序。这是一个无限循环的示例，一种在没有外部干预的情况下不会停止的循环。\n\
  \n始终记住，`while` 语句本身即使使用了复合语句，在语法上也被视为单个语句。该语句从 `while` 一直到第一个分号，或者在使用复合语句的情况下，运行到终止的大括号为止。\n\
  \n注意你放置分号的位置。例如，考虑 Listing 6.4 中的程序。\n\nListing 6.4 的 while2.c 程序\n\n点击此处查看代码图像\n\
  \n```c\n/* while2.c -- 注意你的分号 */\n#include <stdio.h>\n\nint main(void)\n{\n    int\
  \ n = 0;\n    while (n++ < 3);               /* line 7 */\n        printf(\"n is\
  \ %d\\n\", n);  /* line 8 */\n    printf(\"That's all this program does.\\n\");\n\
  \    return 0;\n}\n```\n\nListing 6.4 产生以下输出：\n\nn is 4\nThat's all this program\
  \ does\n\n正如我们之前说的，循环在测试条件之后的第一个语句（简单语句或复合语句）处结束。由于第 7 行测试条件后面紧跟着一个分号，循环在那里就结束了，因为一个单独的分号被视为一个语句。第\
  \ 8 行的打印语句不是循环的一部分，因此 `n` 在每次循环中都会增加，但它在退出循环后才被打印。\n\n在这个示例中，测试条件后面跟着一个空语句，即什么都不执行的语句。在\
  \ C 语言中，单独的分号表示空语句。有时，程序员会将 `while` 语句与空语句一起，因为所有的工作都在测试完成。例如，假设你想跳到第一个不是空白字符或数字的字符。你可以使用这样的循环：\n\
  \n```c\nwhile (scanf(\"%d\", &num) == 1); // 跳过输入\n```\n\n只要 `scanf()` 读取到一个整数，它就会返回\
  \ `1`，循环就会继续。请注意，为了清晰起见，你应该将分号（空语句）放在下一行，或者放在同一行。\n\n\n\n每个关系表达式都被判断为真或假（但绝不是“可能”）。这引出了一个有趣的问题。\n\
  \n### 什么是真？\n\n你可以回答这个古老的问题，至少在 C 语言方面是如此。回想 C 中的表达式始终有一个值。即使对于关系表达式也是如此，如列表 6.6\n\
  \n```c\n/* t_and_f.c -- true and false values in C */\n#include <stdio.h>\n\nint\
  \ main(void)\n{\n    int true_val, false_val;\n    true_val = (10 > 2);    // value\
  \ of a true relationship\n    false_val = (10 == 2);  // value of a false relationship\n\
  \    printf(\"true = %d; false = %d \\n\", true_val, false_val);\n    return 0;\n\
  }\n```\n\n列表 6.6 将两个关系表达式的值赋值给两个变量。简单直白地说，它将真表达式的值赋值给 `true_val`，将假表达式的值赋值给 `false_val`。运行该程序会产生以下简单输出：\n\
  \ntrue = 1; false = 0\n\n啊！对于 C 来说，真表达式的值为 `1`，假表达式的值为 `0`。事实上，某些 C 程序使用以下循环结构来实现无限循环，因为\
  \ `1` 始终为真：\n\n```c\nwhile (1)\n{\n    ...\n}\n```\n\n### 还有什么是真的？\n\n如果你可以使用 `1`\
  \ 或 `0` 作为 `while` 语句的测试表达式，那么你还可以使用其他数字吗？如果是的话，会发生什么？让我们通过尝试列表 6.7 中的程序来实验。\n\n\
  列表 6.7 `truth.c` 程序\n\n点击此处查看代码图像\n\n```c\n// truth.c -- what values are true?\n\
  #include <stdio.h>\n\nint main(void)\n{\n    int n = 3;\n    while (n)\n       \
