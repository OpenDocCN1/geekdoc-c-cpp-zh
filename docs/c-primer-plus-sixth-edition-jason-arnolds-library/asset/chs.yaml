  \ 5))\n    {\n        if (status != 1)\n            scanf(\"%*s\");  // dispose\
  \ of non-integer input\n    }\n    return code;\n}\n```\n\n\n\n\n```c\n    printf(\"\
  Enter an integer from 1 to 5, please.\\n\");\n\n    }\n\n    return code;\n}\n\n\
  int getnights(void)\n{\n    int nights;\n    printf(\"How many nights are needed?\
  \ \");\n    while (scanf(\"%d\", &nights) != 1)\n    {\n        scanf(\"%*s\");\
  \      // 忽略非数字输入\n        printf(\"Please enter an integer, such as 2.\\n\");\n\
