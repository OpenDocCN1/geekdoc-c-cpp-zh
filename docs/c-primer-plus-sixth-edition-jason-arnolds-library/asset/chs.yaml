  ## 17. 高级数据表示\n\n你将在本章学习到以下内容：\n\n![Image](img/squf.jpg) 函数：\n\n更多的 `malloc()`\n\
  \n![Image](img/squf.jpg) 使用 C 语言表示各种数据类型\n\n![Image](img/squf.jpg) 新算法以及提升你的概念编程开发能力\n\
  \n![Image](img/squf.jpg) 抽象数据类型 (ADTs)\n\n学习一种计算机语言就像学习音乐、木工或工程。起初，你使用行业工具进行工作，练习音阶，学习锤子该握哪一端以及避开哪一端，解决无数涉及掉落、滑动和平衡物体的问题。获取并练习技能是你在书中到为止所做的事情，学习创建变量、结构体、函数等。然而，最终你将移动到一个更高的水平，在那个水平上使用工具是本能，而真正的挑战是设计和创建一个项目。你发展出将项目视为有机整体的能力。本章集中于这一高水平。你可能会发现这里涵盖的内容比前面的章节更具挑战性，但你可能也会发现它更有回报，因为有助于帮助你从学徒的角色转变为工匠的角色。\n\
  \n我们将从研究程序设计的一个关键方面开始：程序表示数据的方式。通常，程序开发中最重要的方面是为该程序所操作的数据找到一种良好的表示方法。正确的数据表示可以使程序其余部分的编写变得简单。到目前，你已经看到了\
  \ C 语言内置的数据类型：简单变量、数组、指针、结构体和联合体。\n\n然而，寻找合适的数据表示往往超出了简单的类型选择。你还应该考虑哪些操作是必要的。也就是说，你应该决定如何存储数据，并定义哪些操作对数据类型是有效的。例如，C\
  \ 的实现通常将 C `int` 类型和 C 指针类型都存储为整数，但这两个类型具有不同的有效操作集。例如，你可以将一个整数乘以另一个整数，但你不能将一个指针乘以另一个指针。你可以使用\
  \ `*` 运算符对指针进行解引用，但该操作对整数来说是没有意义的。C 语言定义了其基本类型的有效操作。然而，当你设计一种表示数据的方案时，你可能需要自己定义有效操作。在\
  \ C 中，你可以通过设计 C 函数来表示所需的操作来实现。简而言之，设计一种数据类型包含决定如何存储数据，以及设计一组管理数据的函数。\n\n你还将查看一些*算法*，即处理数据的配方。作为一名程序员，你将获得一套这样的配方，并将它们反复应用于解决类似的问题。\n\
  \n本章将深入研究设计数据类型的过程，这是一个将算法与数据表示相匹配的过程。在其中，你将遇到一些常见的数据形式，如队列、列表和二叉搜索树。\n\n你还将被介绍抽象数据类型（ADT）的概念。ADT\
  \ 以面向问题为导向而非面向语言的方式，将方法和数据表示封装在一起。在你设计好 ADT 之后，可以在不同的情况下轻松地复用它。理解 ADT 为你在概念上为进入面向对象编程（OOP）和\
  \ C++ 语言的世界做了准备。\n\n### 探索数据表示\n\n让我们从思考数据开始。假设你必须创建一个电话录程序。你将使用何种数据形式来存储信息？由于每个条目都涉及多种信息，因此用结构体表示每个条目是合理的。你如何表示多个条目？使用标准的结构体数组？使用动态数组？还是使用其他形式？条目应该按字母顺序排列吗？你应该能够通过邮政编码搜索条目吗？通过区号？你想要的操作可能会影响你决定如何存储信息。简而言之，在投入编码之前，你有很多设计决策要做出。\n\
  \n你将如何表示你想存储在内存中的位图图像？位图图像是像素被单独设置的图像。在黑白时代，你可以使用一个位（0）来表示一个像素（开启或关闭），因此名为位图。有了颜色后，需要多个位来描述一个像素。例如，如果你为像素分配\
  \ 8 位，可以得到 256 种颜色。现在显示器有 65536 色色（16 位）、16777216 色色（24 位）、2147483648 色色（32 位）及更多。这是可行的方法吗，还是你可以开发出压缩信息的方法？这种压缩应该是无损的（无数据）还是有损的（不重要的数据）？\n\
  \n让我们处理表示数据的特定案例。假设你想写一个程序，让你输入你一年看过的所有电影（包括录像带、DVD 和蓝光）的列表。对于每部电影，你想记录各种信息，如标题、发行年份、导演、演员等。这建议使用结构体表示电影并使用数组表示列表。为了方便，我们将结构限制为两个成员：电影标题和评分（0\
  \ 到 10 分的排名）。列表 17.1 显示了这种方法的简单实现。\n\n```c\n/* films1.c -- 使用结构体数组 */\n#include\
  \ <stdio.h>\n#include <string.h>\n\n#define TSIZE 45 /* 标题数组的大小 */\n#define FMAX\
  \ 5  /*电影标题的最大数量 */\n\nstruct film {\n    char title[TSIZE];\n    int rating;\n\
  };\n\nchar * s_gets(char * st, int n);\n\nint main(void)\n{\n    struct film movies[FMAX];\n\
  \    int i = 0;\n    int j;\n    puts(\"输入第一个电影标题：\");\n    while (i < FMAX && s_gets(movies[i].title,\
  \ TSIZE) != NULL &&\n          movies[i].title[0] != '\\0')\n    {\n        puts(\"\
  输入你的评分 <0-10>：\");\n        scanf(\"%d\", &movies[i++].rating);\n        while(getchar()\
  \ != '\\n')\n            continue;\n        puts(\"输入下一个电影标题（空行停止）：\");\n    }\n\
  \    if (i == 0)\n        printf(\"未输入数据。 \");\n    else\n        printf(\"这里是电影列表：\\\
  n\");\n    for (j = 0; j < i; j++)\n```\n\n\n\n\n\n```c\nprintf(\"Movie: %s  Rating:\
  \ %d\\n\", movies[j].title, movies[j].rating);\nprintf(\"Bye!\\n\");\nreturn 0;\n\
  }\n\nchar * s_gets(char * st, int n)\n{\n    char * ret_val;\n    char * find;\n\
  \    ret_val = fgets(st, n, stdin);\n    if (ret_val)\n    {\n        find = strchr(st,\
  \ '\\n');  // 寻找换行符\n        if (find)               // 如果地址不是 NULL\n          \
  \  *find = '\\0';           //此处放置空字符\n        else\n            while (getchar()\
  \ != '\\n')\n                continue;           // 忽略行的剩余部分\n    }\n    return\
  \ ret_val;\n}\n```\n\n该程序创建了一个结构体数组，并用用户输入的数据填充数组。输入会持续进行直到数组满（通过 `FMAX` 测试）、到达文件结束（通过\
  \ `NULL` 测试），或者用户在行开头按下回车键（通过 `\\0` 测试）。\n\n这种方案存在一些问题。首先，程序很可能会浪费大量空间，因为大多数电影的标题没有\
  \ 40 个字符长，但某些电影的标题很长，例如《中产阶级的妙味》（The Discreet Charm of the Bourgeoisie）和《拯救好莱坞的狗\
  \ Won Ton Ton, The Dog Who Saved Hollywood）。其次，许多人会发现每年五部电影的限制太严格。当然，你可以增加这个限制，但什么值比较好？有些人认为每年看\
  \ 500 部电影，所以你可以将 `FMAX` 增加到 500，但这对某些人来说可能太小，而另一些人可能浪费大量的内存。此外，某些编译器对自动存储类变量（如 `movies`）可用内存设置了默认限制，如此大的数组可能会超过该值。你可以通过将数组改为静态或外部数组，或者指示编译器使用更大的栈来修复这个问题，但这并没有解决根本问题。\n\
  \n这里的真正问题是数据表示太缺乏活性。你必须在编译时做出决策，而这些决策放在运行时更好。这建议切换到使用动态内存分配的数据表示方法。你可以尝试如下方法：\n\n\
  点击此处查看代码图像\n\n```c\n#define TSIZE  45            /* 存放标题的数组大小 */\nstruct film {\n\
  \    char title[TSIZE];\n    int rating;\n};\n...\n\n    int n, i;\n    struct film\
  \ * movies;   /* 指向结构的指针 */\n    ...\n    printf(\"Enter the maximum number of movies\
  \ you'll enter:\\n\");\n    scanf(\"%d\", &n);\n    movies = (struct film *) malloc(n\
  \ * sizeof(struct film));\n```\n\n在这里，就像在第 12 章中的“存储类、链接与内存管理”一样，你可以像使用数组名一样使用指针\
  \ `movies`：\n\n点击此处查看代码图像\n\n```c\nwhile (i < FMAX && s_gets(movies[i].title, TSIZE)\
  \ != NULL &&\n      movies[i].title[0] != '\\0')\n```\n\n通过使用 `malloc()`，你可以将确定元素数量的操作推迟到程序运行时，因此如果只需要\
  \ 20 个元素，程序就不需要分配 500 个元素。然而，这给用户留下了提供正确值的负担。\n\n### 越数组到链表\n\n理想情况下，你希望能够无限添加数据（直到程序耗尽内存），而无需预先指定要创建多少条目，也不让程序分配巨大的内存块。你可以通过每次输入后调用\
  \ `malloc()` 并仅分配足够存放新条目的空间来实现。如果用户输入三部电影，程序会调用 `malloc()` 三次；如果用户输入 300 部电影，程序会调用\
  \ `malloc()` 300 次。\n\n这个巧妙的想法引发了一个新问题。要了解它是什么，请对比调用一次 `malloc()`（请求足够 300 个 `film`\
  \ 结构体的空间）与调用 300 次 `malloc()`（每次请求足够一个 `film` 结构体的空间）。第一种情况将内存分配为一个连续的块，你只需要一个指向块中第一个结构的结构体指针（`film`）来跟踪内容即可。简单的数组表示法允许指针访问块中的每个结构，如前面的代码所示。第二种方法的问题在于，无法保证连续调用\
  \ `malloc()` 会产生相邻的内存块。这意味着结构体并不一定连续存储（参见图 17.1）。因此，你不需要存储一个指向包含 300 个结构的块的指针，而是需要存储\
  \ 300 个指针，每个对应一个独立的结构！\n\n![图像](img/17fig01.jpg)\n\n图 17.1 在块中分配结构与逐一分配\n\n一种解决方案（我们不会使用）是创建一个大型指针数组，并在分配新结构体时逐个为指针赋值：\n\
  \n点击此处查看代码图像\n\n```c\n#define TSIZE  45    /* 存放标题的数组大小 */\n#define FMAX  500  \
  \ /* 最大电影数量 */\nstruct film {\n    char title[TSIZE];\n    int rating;\n};\n...\n\
  \    struct film * movies[FMAX]; /* 指针数组 */\n    int i;\n    ...\n    movies[i]\
  \ = (struct film *) malloc (sizeof (struct film));\n```\n\n这种方法即使没有用满 500 个指针，也会浪费大量内存（因为你使用了指针数组），而且它仍然施加了\
  \ 500 个的限制。\n\n有一种更好的方法。每次你使用 `malloc()` 分配新结构体空间时，也可以分配一个指向该新结构的指针。“但是，”你说，“那么我需要另一个指针来跟踪这个指针，以此此类推。”避免这个潜在问题的技巧是重新定义结构，使得每个结构都包含一个指向下一个结构的指针。简而言之，你需要重新定义\
  \ `film` 结构：\n\n点击此处查看代码图像\n\n```c\n#define TSIZE  45    /* 存放标题的数组大小 */\nstruct\
  \ film {\n    char title[TSIZE];\n    int rating;\n    struct film * next; /* 指向下一个结构的指针\
  \ */\n};\n```\n\n确实，结构体不能包含相同类型结构本身，但它可以包含指向相同类型结构的指针。这种定义是定义*链表*（linked list）的基础——即每个项都包含找到下一个项信息的列表。\n\
  \n在查看链表的 C 代码之前，让我们对这样的列表进行一次概念性的遍历。假设用户输入了《现代时间》作为标题，10 作为评分。程序将为 `film` 结构分配空间，将字符串\
  \ `Modern Times` 复制到 `title` 成员中，并将 `rating` 成员设置为 10。为了表示后面没有更多结构了，程序会将 `next`\
  \ 成员指针设置为 `NULL`（回想，`NULL` 是在 `stdio.h` 文件中定义的符号常量，表示空指针）。当然，你需要跟踪第一个结构存储的位置。你可以通过将它的地址分配给一个单独的指针来实现，我们称为*头指针*（head\
  \ pointer）。头指针指向链表中的第一个项。图 17.2 表示了这种结构的外观。（为了节省图表空间，省略了 `title` 成员中的空白空间。）\n\n\
  ![图像](img/17fig02.jpg)\n\n图 17.2 链表中的第一个项\n\n\n\n\n现在假设用户输入了第二个电影名称和评分——例如，`Midnight\
  \ in Paris` 和 `8`。程序为第二个 `film` 结构分配空间，并将新结构的地址存储在第一个结构的 `next` 成员中（重写了之前存储在那里的\
  \ `NULL`），使得一个结构的 `next` 指针指向链表中的下一个结构。然后，程序将 `Midnight in Paris` 和 `8` 拷贝到新结构中，并将其\
  \ `next` 成员设置为 `NULL`，表示它现在是列表中的最后一个结构。图 17.3 显示了这样一个包含两个项目的列表。\n\n![Image](img/17fig03.jpg)\n\
  \n图 17.3 包含两个项目的链表。\n\n每部新电影都将以相同的方式处理。它的地址将存储在前一个结构（prev structure）中，新信息将进入新结构中，并且它的\
  \ `next` 成员被设置为 `NULL`，从而建立一个如图 17.4 所示的链表。\n\n![Image](img/17fig04.jpg)\n\n假设你想显示该列表。每次显示一个项目时，可以使用相应结构中存储的地址来定位要显示的下一个项目。然而，为了使此方案生效，你需要一个指针来跟踪列表中的第一个项目，因为链表中没有结构存储了第一个项目的地址。幸运的是，你已经通过头指针（head\
  \ pointer）实现了这一点。\n\n### 使用链表\n\n现在你已经了解了链表的工作原理，让我们来实现它吧。列表 17.2 修改了列表 17.1，使其使用链表而不是数组来存储电影信息。\n\
  \n列表 17.2 程序的 films2.c 程序\n\n点击此处查看代码图像\n\n```c\n/* films2.c -- using a linked list\
  \ of structures */\n\n#include <stdio.h>\n\n#include <stdlib.h>      /* has the\
  \ malloc prototype      */\n#include <string.h>      /* has the strcpy prototype\
  \      */\n\n#define TSIZE    45      /* size of array to hold title   */\n\nstruct\
  \ film {\n    char title[TSIZE];\n    int rating;\n    struct film * next;  /* points\
  \ to next struct in list */\n};\n\nchar * s_gets(char * st, int n);\n\nint main(void)\n\
  {\n    struct film * head = NULL;\n    struct film * prev, * current;\n    char\
  \ input[TSIZE];\n/* Gather  and store information             */\n    puts(\"Enter\
  \ first movie title:\");\n    while (s_gets(input, TSIZE) != NULL && input[0] !=\
  \ '\\0')\n    {\n        current = (struct film *) malloc(sizeof(struct film));\n\
  \        if (head == NULL)      /* first structure      */\n            head = current;\n\
  \        else                  /* subsequent structures */\n            prev->next\
  \ = current;\n        current->next = NULL;\n        strcpy(current->title, input);\n\
  \        puts(\"Enter your rating <0-10>:\");\n        scanf(\"%d\", &current->rating);\n\
  \        while(getchar() != '\\n')\n            continue;\n        puts(\"Enter\
  \ next movie title (empty line to stop):\");\n        prev = current;\n    }\n/*\
  \ Show list of movies              */\n    if (head == NULL)\n        printf(\"\
  No entered. \");\n    else\n        printf (\"Here is the list:\\n\");\n    current\
  \ = head;\n    while (current != NULL)\n    {\n        printf(\"Movie: %s  Rating:\
  \ %d\\n\", current->title, current->rating);\n        current = current->next;\n\
  \    }\n/* Program done, so free memory */\n    current = head;\n    while (current\
  \ != NULL)\n    {\n        free(current);\n        current = current->next;\n  \
  \  }\n    printf(\"Bye!\\n\");\n    return 0;\n}\n\nchar * s_gets(char * st, int\
  \ n)\n{\n    char * ret_val;\n    char * find;\n    ret_val = fgets(st, n, stdin);\n\
  \    if (ret_val)\n    {\n        find = strchr(st, '\\n');  // look for newline\n\
  \        if (find)\n            *find = '\\0';  // place a null character there\n\
  \        else\n            while (getchar() != '\\n')\n            continue;  //\
  \ dispose of rest of line\n    }\n    return ret_val;\n}\n```\n\n程序使用链表执行两项任务。首先，它构建链表并填充存入的数据。其次，它显示列表。显示是一个较简单的任务，所以让我们先看它。\n\
  \n#### 显示列表\n\n其思路是首先设置一个指针（称之为 `current`）指向第一个结构。因为头指针（称之为 `head`）已经指向了那里，所以这段代码足够了：\n\
  \n`current = head;`\n\n然后你可以使用指针表示法来访问该结构的成员：\n\n点击此处查看代码图像\n\n```c\nprintf(\"Movie:\
  \ %s  Rating: %d\\n\", current->title, current->rating);\n```\n\n下一步的任务是让 `current`\
  \ 指针指向下一个结构。为了让打印循环结束，我们需要将 `current` 重置为 `NULL`。这是因为列表中的最后一个项目的 `next` 成员被设置为 `NULL`。以下是\
  \ `films2.c` 用来打印的代码：\n\n点击此处查看代码图像\n\n```c\nwhile (current != NULL)\n{\n    printf(\"\
  Movie: %s  Rating: %d\\n\", current->title, current->rating);\n    current = current->next;\n\
  }\n```\n\n为什么不直接使用 `head` 而不是创建一个指针 (`current`)？因为使用 `head` 会改变 `head` 的值，程序将无法找到列表的开头。\n\
  \n### 创建链表\n\n创建链表涉及三个步骤：\n\n1. 使用 `malloc()` 为结构分配空间。\n2. 存储结构的地址。\n3. 将正确的信息拷贝到结构中。\n\
  \n如果没有就不创建结构，所以程序使用临时存储（`input` 数组）来获取用户的选择。如果用户从键盘输入 `EOF` 或空行，输入循环退出：\n\n点击此处查看代码图像\n\
  \n```c\nwhile (s_gets(input, TSIZE) != NULL && input[0] != '\\0')\n```\n\n如果有输入，程序请求空间并将其地址分配指针\
  \ `current`：\n\n点击此处查看代码图像\n\n```c\ncurrent = (struct film *) malloc(sizeof(struct\
  \ film));\n```\n\n非常第一个结构的地址应该存储在指针 `head` 中。每个后续结构的地址应该存储在前一个结构的 `next` 成员中。因此，程序需要一种方法来判断是否正在处理第一个结构。简单的方法是在程序启动时将\
  \ `head` 指针初始化为 `NULL`。然后程序可以根据 `head` 的值决定做什么：\n\n点击此处查看代码图像\n\n```c\nif (head\
  \ == NULL)      /* first structure */\n    head = current;\nelse               \
  \   /* subsequent structures */\n    prev->next = current;\n```\n\n在这段代码中，`prev`\
  \ 是指向上一次分配结构的指针。\n\n接下来，你必须为结构成员设置正确的值。特别是，你应该将 `next` 成员设置为 `NULL`，表示当前结构是列表中的最后一个结构。你应该将电影标题从\
  \ `input` 数组拷贝到 `title` 成员，并为 `rating` 成员获取一个值。以下代码完成了这些事情：\n\n点击此处查看代码图像\n\n```c\n\
  current->next = NULL;\nstrcpy(current->title, input);\n```\n\n\n\n由于调用 `s_gets()`\
  \ 将输入限制在 `TSIZE – 1` 个字符，因此 `input` 数组中的字符串能够放入 `title` 成员中，所以使用 `strcpy()` 是安全的。\n\
  \n最后，你应该为下一次输入循环做准备工作。具体来说，你需要将 `prev` 指向当前结构，因为在输入下一个电影名称并分配下一个结构后，它将成为上一个结构。程序在循环结束时设置了这个指针：\n\
  \n```\nprev = current;\n```\n\n有效吗？这里有一个示例运行结果：\n\n点击此处查看代码图片\n\n输入第一个电影标题：\n\n\
  千与千寻\n\n输入你的评分 <0-10>:\n\n9\n\n输入下一个电影标题（空行停止）：\n\n决斗士\n\n输入你的评分 <0-10>:\n\n8\n\n\
  输入下一个电影标题（空行停止）：\n\n魔鬼狗：犬之冢\n\n输入你的评分 <0-10>:\n\n1\n\n输入下一个电影标题（空行停止）：\n\n以下是电影列表：\n\
  \n电影：千与千寻  评分: 9\n\n电影：决斗士  评分: 8\n\n电影：魔鬼狗：犬之冢  评分: 1\n\n再见！\n\n### 释放列表内存\n\n\
  在许多环境中，程序在终止时会释放 `malloc()` 使用的内存，但养成用 `free()` 调用平衡 `malloc()` 用的习惯是。因此，程序通过对每个分配的结构应用\
  \ `free()` 来清理其内存使用：\n\n```\ncurrent = head;\nwhile (current != NULL)\n{\n    free(current);\n\
  \    current = current->next;\n}\n```\n\n### 结语\n\n`films2.c` 程序稍微有些简陋。例如，它没有检查\
  \ `malloc()` 是否找到了请求的内存，而且没有提供从列表中删除项的机制。然而，这些缺陷是可以修复的。例如，你可以添加代码来检查 `malloc()`\
  \ 的返回值是否为 `NULL`（这是未能获取到你所需内存的标志）。如果程序需要删除条目，你可以再写一些代码来实现它。\n\n这种根据需要随随解决问题和添加功能的“临时方法”并不总是最好的编程方法。另一方面，你通常无法预判程序需要做的一切。随着编程项目规模的扩大，程序员或编程团队提前规划一切的模式变得越来越不切实际。人们观察到，最成功的大型程序是那些从成功的小程序逐步演化而来的。\n\
  \n鉴于你可能需要修改计划，以一种简化了修改的方式开发你的原始想法是很好的好主意。列表 17.2 中的示例并没有遵循这一准则。特别是，它倾向于将编码细节和概念模型混杂在一起。例如，在示例程序中，概念模型是你向列表添加项。程序通过将\
  \ `malloc()` 和 `current->next` 指针等细节推到前台，模糊了该接口。如果能以一种方式编写程序，显而易见你正在向列表添加某些东西，并隐藏了簿记细节（如调用内存管理函数和设置指针），那就太棒了。将用户界面与细节分离将使程序更容易被理解和更新。通过重新开始，你可以实现这些目标。让我们看看如何做到。\n\
  \n### 抽象数据类型 (ADTs)\n\n在编程中，你尝试使数据类型与编程问题的需求匹配。例如，你会使用 `int` 类型来表示你拥有的鞋子数量，使用 `float`\
  \ 或 `double` 类型来表示每双鞋的平均成本。在电影示例中，数据形成了一个项目列表，每个项目都由一个电影名称（一个 C 字符串）和一个评分（一个 `int`）组成。没有基础的\
  \ C 类型匹配该描述，因此我们定义了一个结构来表示单独的项目，然后设计了几个方法将一系列结构连接起来形成一个列表。本质上，我们利用 C 语言的能力设计了符合我们需求的新数据类型，但我们这样做的方式是不系统性的。现在，我们将采用更具系统性的方法来定义类型。\n\
  \n什么构成了一个类型？*类型*指定了两种信息：一组属性和一组操作。例如，`int` 类型的属性是它代表一个整数值，因此共享了整数的属性。允许的算术操作包括改变符号、两个\
  \ `int` 相加、两个 `int` 相减、两个 `int` 相乘、将一个 `int` 除以另一个 `int`，以及对一个 `int` 较于另一个 `int`\
  \ 取模。当你声明一个变量为 `int` 时，你是在说这些且仅有这些操作可以影响它。\n\n***\n\n注意：整数属性\n\n在 C `int` 类型背后是一个更抽象的概念，即*整数*。数学家可以、并且确实以正式的抽象方式定义整数的属性。例如，如果\
  \ `N` 和 `M` 是整数，那么 `N + M = M + N`，或者对于任意两个整数 `N` 和 `M`，存在一个整数 `S`使得 `N + M = S`。如果\
  \ `N + M = S` 且 `N + Q = S`，那么 `M = Q`。你可以认为数学提供了整数的抽象概念。\n\n***\n\n假设你想定义一个新类型。首先，你必须提供一种存储数据的方法，也许通过设计结构。其次，你必须提供操作数据的方法。例如，考虑\
  \ `films2.c` 程序（列表 17.2 #ch17lis02)。它有一个链结构集合来存储信息，并提供了添加信息和显示信息的代码。然而，该程序处理这些的方式并没有清楚我们正在创建一个新类型。我们本应该怎么做？\n\
  \n计算机科学开发了一种非常成功的方法来定义新数据类型。它是一个从抽象到具体的三个步骤的过程：\n\n1. 提供该类型属性以及你可以在类型上执行的操作的抽象描述。这种描述不应与任何特定实现绑定。它甚至不应与特定的编程语言绑定。这种正式的抽象描述被称为*抽象数据类型*ADT)。\n\
  2. 开发一个实现 ADT 的编程接口。即指示如何存储数据并描述执行所需操作的函数。在 C 语言中，例如，你可以提供一个结构定义以及操作这些结构的函数原型。这些函数对用户定义类型起的作用，就像\
  \ C 的内置运算符对基础 C 类型起的作用一样。\n3. 编写代码来实现接口。这一步当然是必不可少的，但使用新类型的程序员不需要知道实现的细节。\n\n让我们通过一个示例来看看这个过程是如何运作的。鉴于我们已经在电影列表示例上投入了一些精力，让我们用新方法重新做一遍。\n\
  \n#### 获取抽象\n\n\n\n\n\n基本上，电影项目只需要一个项目列表。每个项目都包含一个电影名称和一个评分。你能够能够将新项目添加到列表的末尾，并且能够显示列表的内容。让我们把处理这些需求的抽象类型命名为\
  \ `list`。\n\n## 列表应该具有什么属性？\n\n显然，列表应该能够容纳一组项。也就是说，一个列表可以包含多个项，并且这些项按照某种顺序排列，因此你可以说列表中的第一个项、第二个项或最后一个项。接下来，列表类型应该支持诸如向列表中添加一个项等操作。这里是一些实用的操作：\n\
  \n- Image(graphics/squf.jpg) 将列表初始化为空\n- Image(graphics/squf.jpg) 向列表末尾添加一个项\n-\
  \ Image(graphics/squf.jpg) 判断列表是否为空\n- Image(graphics/squf.jpg) 判断列表是否已满\n- Image(graphics/squf.jpg)\
  \ 判断列表中共有多少项\n- Image(graphics/squf.jpg) 访问列表中的每个项以执行某些操作（例如显示该项）\n\n对于这个项目，我们不需要额外的操作，但一个更通用的列表操作可能包括以下内容：\n\
  \n- Image(graphics/squf.jpg) 在列表任意位置插入一个项\n- Image(graphics/squf.jpg) 从列表中删除一个项\n\
  - Image(graphics/squf.jpg) 从列表中检索一个项\n- Image(graphics/squf.jpg) 用另一个项替换列表中的一个项\n\
  - Image(graphics/squf.jpg) 在列表中查找一个项\n\n那么，列表的非正式但抽象的定义是：它是一个能够容纳项序列的数据对象，你可以对它应用上述任何操作。这个定义并没有说明在列表中可以存储什么种的项。它没有指定应该使用数组、链式结构集合或其他数据形式来存储这些项。它也没有规定使用哪种方法（例如查找元素的数量）。这些事情都留给实现部分处理。\n\
  \n为了保持示例简单，让我们采用一个简化的列表作为抽象数据类型，它只体现了电影项目所需的特征。以下是该类型的总结：\n\n- Image(graphics/78tab01.jpg)\n\
  \n## 构建接口\n\n下一步是为简单列表 ADT 开发一个 C 语言接口。简单列表的接口分为两部分：第一部分描述数据的如何表示，第二部分描述实现 ADT 操作的。例如，将会有用于向列表添加项的函数以及报告列表项数量的函数。\n\
  \n接口设计应当尽可能与 ADT 的描述对应。因此，它应该用某种通用的 `Item` 类型来表示，而不是某些特定类型（如 `int` 或 `struct film`）。实现此点的方法一种是使用\
  \ C 语言的 `typedef` 将 `Item` 定义为所需的类型：\n\n点击此处查看代码\n\n```c\n#define TSIZE 45 /* 用于存储标题的数组大小\
  \ */\nstruct film\n{\n    char title[TSIZE];\n    int rating;\n};\ntypedef struct\
  \ film Item;\n```\n\n然后你就可以在后续的定义中使用 `Item` 类型。如果你以后需要其他形式的数据的列表，可以重新定义 `Item` 类型，而保持接口的其他部分不变。\n\
  \n定义了 `Item` 后，你现在必须决定如何存储该类型的项。这一步实际上属于实现阶段，但现在做出决定会让示例更容易于理解。在 `films2.c` 程序中，链式结构方法运行得很好，所以让我们像这里这样调整：\n\
  \n```c\ntypedef struct node\n{\n    Item item;\n    struct node * next;\n} Node;\n\
  typedef Node * List;\n```\n\n在链表实现中，每个连接被称为一个 `node`（节点）。每个节点包含构成列表内容的信息，以及一个指向下一个节点的指针。为了强调这一术语，我们使用标记名\
  \ `node` 作为节点结构体的名称，并使用 `typedef` 使 `Node` 成为 `struct node` 结构的类型名。最后，为了管理链表，我们需要一个指向其起始位置的指针，我们使用\
  \ `typedef` 使 `List` 成为该类型指针的名称。因此，声明\n\n`List movies;`\n\n将 `movies` 建立为一个适用于引用链表的指针。\n\
  \n这是定义 `List` 类型的唯一方法吗？不是。例如，你可以包含一个变量来跟踪条目的数量：\n\n点击此处查看代码图像\n\n```c\ntypedef struct\
  \ list\n{\n    Node * head; /* 指向列表头的指针 */\n    int size;    /* 列表中的条目数量 */\n} List;\
  \ /* 列表的另一种定义 */\n```\n\n你可以添加第二个指针来跟踪列表的末尾。稍后，你会看到一个那样的示例。现在，让我们坚持 `List` 类型的第一种定义。重要的点是，你应该将声明\n\
  \n`List movies;`\n\n看作建立一个列表，而不是建立一个指向节点的指针或建立一个结构。`movies` 的具体数据表示是实现细节。\n\n例如，程序在开始时应该将头指针初始化为\
  \ `NULL`，但你不应该如下代码：\n\n`movies = NULL;`\n\n为什么不呢？因为以后你可能会发现你喜欢 `List` 的结构实现，那需要如下初始化：\n\
  \n`movies.next = NULL;`\n\n`movies.size = 0;`\n\n任何使用 `List` 类型的人都不应该担心这些细节。相反，他们应该能够如下操作：\n\
  \n`InitializeList(movies);`\n\n程序员只需要知道应该使用 `InitializeList()` 函数来初始化列表。他们不需要知道\
  \ `List` 的数据实现。这就是数据隐藏的例子，即在更高层次编程中隐藏数据表示的艺术。为了引导用户，你可以提供如下所示函数原型：\n\n点击此处查看代码图像\n\
  \n```c\n/* 操作：初始化列表 */\n/* 前置条件：plist 指向一个列表 */\n/* 后置条件：列表被初始化为空 */\nvoid InitializeList(List\
  \ * plist);\n```\n\n你应该注意到的三点。首先，注释概述了*前置条件*——即在调用函数之前满足的条件。在这里，你需要一个列表来初始化。其次，注释概述了*后置条件*——即在函数执行后满足的条件。最后，函数使用列表的指针而不是列表本身作为参数，所以函数调用将是：\n\
  \n`InitializeList(&movies);`\n\n这是因为 C 语言按值传递参数的，因此 C 函数修改调用程序中变量的唯一方法是使用该变量的指针。在这里，语言的限制使得接口偏离了抽象描述。\n\
  \n\n\n\n\n在 C 语言中，将所有类型和函数信息封装到一个包中的方法是将类型定义和函数原型（包括前置条件和后置条件注释）放在头文件中。该文件应该提供程序员使用该类型所需的所有信息。列表\
  \ 17.3 显示了一个用于简单 `list` 类型的头文件。它将一个特定的结构定义为 `Item` 类型，然后根据 `Item` 定义 `Node`，再根据\
  \ `Node` 定义了 `List`。表示列表操作的函数随后使用 `Item` 类型和 `List` 类型作为参数。如果函数需要修改参数，它将使用指向对应类型的指针而不是直接使用该类型。该文件将每个函数名的首字母大写，以此将其标记为接口程序包的一部分。此外，该文件还使用了在第\
  \ 16 章“C 预处理器和 C 库”中过的 `#ifndef` 技术来防止文件被多次包含。如果你的编译器不支持 C99 的 `bool` 类型，你可以将\n\n\
  点击此处查看代码图像\n\n```c\n#include <stdbool.h>      /* C99 特性 */\n```\n\n替换为头文件中的：\n\n\
  点击此处查看代码图像\n\n```c\nenum bool {false, true}; /* 将 bool 定义为类型，false, true 定义为值 */\n\
  ```\n\n列表 17.3 list.h 接口头文件\n\n点击此处查看代码图像\n\n***\n\n```c\n/* list.h -- 简单 list 类型的头文件\
  \ */\n\n#ifndef LIST_H_\n\n#define LIST_H_\n\n#include <stdbool.h>      /* C99 特性\
  \ */\n\n/* 程序特定声明 */\n#define TSIZE      45    /* 用于存储标题的数组大小 */\n\nstruct film\n\
  {\n    char title[TSIZE];\n    int rating;\n};\n\n/* 通用类型定义 */\ntypedef struct film\
  \ Item;\ntypedef struct node\n{\n    Item item;\n    struct node * next;\n} Node;\n\
  typedef Node * List;\n\n/* 函数原型 */\n/* 操作:      初始化一个列表                       */\n\
  /* 前置条件:   plist 指向一个列表                    */\n/* 后置条件:  列表被初始化为空              \
  \          */\nvoid InitializeList(List * plist);\n\n/* 操作:      判断列表是否为空      \
  \        */\n/*                  plist 指向一个已初始列表      */\n/* 后置条件:  如果列表为空则返回 True\
  \              */\n/*                  否则返回 False              */\nbool ListIsEmpty(const\
  \ List *plist);\n\n/* 操作:      判断列表是否已满               */\n/*                  plist\
  \ 指向一个已初始列表      */\n/* 后置条件:  如果列表已满则返回 True            */\n/*                \
  \  否则返回 False                      */\nbool ListIsFull(const List *plist);\n\n/*\
  \ 操作:      列表中项目的数量                */\n/*                  plist 指向一个已初始列表     \
  \ */\n/* 后置条件:  返回项目数量                      */\nunsigned int ListItem(const List\
  \ *plist);\n\n/* 操作:      将项目添加到列表末尾                */\n/* 前置条件:   item 是要添加的项 \
  \                */\n/*                  plist 指向一个已初始列表      */\n/* 后置条件:  如果可能，函数将项目添加到\
  \         */\n/*                  列表末尾并返回 True；否则返回 False */\nbool AddItem(Item\
  \ item, List * plist);\n\n/* 操作:      对列表中的每个项目应用函数  */\n/*                  plist\
  \ 指向一个已初始列表      */\n/*                  pfun 指向一个接收一个  */\n/*                 \
  \ Item 参数且没有返回值的函数 */\n/* 后置条件:   pfun 指向的函数会为列表中的  */\n/*                  每个项目执行一次\
  \  */\nvoid Traverse (const List *plist, void (* pfun)(Item item) );\n\n/* 操作: \
  \     释放已分配的内存（如果有的话）          */\n/*                  plist 指向一个已初始列表      */\n\
  /* 后置条件:  列表分配的所有内存均被释放         */\n/*                  列表被置为空           */\nvoid\
  \ EmptyTheList(List * plist);\n\n#endif\n```\n\n***\n\n只有 `InitializeList()`、`AddItem()`\
  \ 和 `EmptyTheList()` 函数会修改列表，因此从技术上讲，它们是唯一需要指针参数的方法。然而，如果用户必须记住向某些函数传递 `List` 参数，而向其他函数传递\
  \ `List` 的地址作为参数，这可能会变得困惑。因此，为了简化用户的责任，所有函数都使用指针参数。\n\n头文件中的原型之一比其他的稍微复杂：\n\n点击此处查看代码图像\n\
  \n```c\n/* 操作:      对列表中的每个项目应用函数  */\n/*                  plist 指向一个已初始列表     \
  \ */\n/*                  pfun 指向一个接收一个  */\n/*                  Item 参数且没有返回值的函数\
  \ */\n/* 后置条件:   pfun 指向的函数会为列表中的  */\n/*                  每个项目执行一次  */\nvoid Traverse\
  \ (const List *plist, void (* pfun)(Item item) );\n```\n\n`pfun` 是一个函数指针。具体来说，它指向一个接收\
  \ `item` 作为参数且没有返回值的函数指针。正如你在第 14 章可能记得的那样，“结构和其他形式](#ch14.html_14)”，你可以将函数指针作为参数传递给第二个函数。\n\
  \n#### 使用接口\n\n我们的主张是，你应该能够在不知道任何细节的情况下使用接口——例如不知道函数是如何编写的。让我们现在写一个新版本的程序。这是一个伪代码计划：\n\
  \n点击此处查看代码图像\n\n```text\n创建一个 List 变量。\n创建一个 Item 变量。\n初始化列表为空。\n当列表未满且有输入时：\n \
  \   将输入读入 Item 变量。\n    将项目添加到列表。\n访问列表中的每个项目并显示。\n```\n\n列表 17.4 所示程序遵循了这个基本计划，并带有错误检查。注意它是如何使用\
  \ `list.h` 文件（列表 17.3` 函数的代码，它符合 `Traverse()` 的原型。因此，程序可以将 `showmovies` 指针传递给 `Traverse()`，以便\
  \ `Traverse()` 对列表中的每个项目应用 `showmovies()` 函数。（记得函数名就是指向函数的指针。）\n\n列表 17.4 films3.c\
  \ 程序\n\n点击此处查看代码图像\n\n***\n\n```c\n/* films3.c -- 使用 ADT 风格的链表 */\n/* 与 list.c 编译\
  \ */\n#include <stdio.h>\n#include <stdlib.h>    /* exit() 的原型 */\n#include \"list.h\"\
  \      /* 定义 List, Item */\n\nvoid showmovies(Item item);\nchar * s_gets(char *\
  \ st, int n);\n\nint main(void)\n{\n    List movies;\n    Item temp;\n/* 初始化 */\n\
  \    InitializeList(&movies);\n    if (ListIsFull(&movies))\n    {\n        fprintf(stderr,\"\
  无可用内存！再见!\\n\");\n        exit(1);\n    }\n/* 收集并存储 */\n    puts(\"输入第一个电影标题:\"\
  );\n```\n\n\n\n\n\n```c\nwhile (s_gets(temp.title, TSIZE) != NULL && temp.title[0]\
  \ != '\\0')\n{\n    puts(\"Enter your rating <0-10>:\");\n    scanf(\"%d\", &temp.rating);\n\
  \    while(getchar() != '\\n')\n        continue;\n    if (AddItem(temp, &movies)==false)\n\
  \    {\n        fprintf(stderr,\"Problem allocating memory\\n\");\n        break;\n\
  \    }\n    if (ListIsFull(&movies))\n    {\n        puts(\"The list is now full.\"\
  );\n        break;\n    }\n    puts(\"Enter next movie title (empty line to stop):\"\
  );\n}\n/* display */\nif (ListIsEmpty(&movies))\n    printf(\"No data entered. \"\
  );\nelse\n{\n    printf (\"Here is the movie list:\\n\");\n    Traverse(&movies,\
  \ showmovies);\n}\nprintf(\"You entered %d movies.\\n\", ListItemCount(&movies));\n\
  /* clean up */\nEmptyTheList(&movies);\nprintf(\"Bye!\\n\");\nreturn 0;\n}\n\nvoid\
  \ showmovies(Item item)\n{\n    printf(\"Movie: %s  Rating: %d\\n\", item.title,\n\
  \        item.rating);\n}\n\nchar * s_gets(char *st, int n)\n{\n    char * ret_val;\n\
  \    char * find;\n    ret_val = fgets(st, n, stdin);\n    if (ret_val)\n    {\n\
  \        find = strchr(st, '\\n');   // look for newline\n        if (find)    \
  \           // if the address is not NULL,\n        *find = '\\0';            //\
  \ place a null character there\n        else\n            while (getchar() != '\\\
  n')\n                continue;           // dispose of rest of line\n    }\n   \
  \ return ret_val;\n}\n```\n\n## 实现接口\n\n当然，你仍然需要实现 `List` 接口。C 语言的方法是将函数定义在一个名为\
  \ `list.c` 的文件中。那么，完整的程序由三个文件组成：`list.h` 定义了数据结构并为用户接口提供原型声明；`list.c` 提供实现接口的函数代码；以及\
  \ `films3.c`，这是一个将列表接口应用于特定编程问题的源代码文件。列表 17.5 显示了 `list.c` 的一种可能实现。要运行程序，你必须编译 `films3.c`\
  \ 和 `list.c` 并将它们链接（你可能想复习第 9 章“函数”中关于多文件程序的讨论）。`list.h`、`list.c` 和 `films3.c` 文件共同构成完整的程序（见图\
  \ 17.5）。\n\n### list.c 实现\n\n```c\n/* list.c -- 支持列表操作 */\n#include <stdio.h>\n\
  #include <stdlib.h>\n#include \"list.h\"\n/* 本地原型 */\nstatic void CopyNode(Item\
  \ item, Node *node);\n/* 接口函数 */\n/* 将列表置空 */\nvoid InitializeList(List * plist)\n\
  {\n    *plist = NULL;\n}\n/* 如果列表为空则返回 true */\nbool ListIsEmpty(const List * plist)\n\
  {\n    if (*plist == NULL)\n        return true;\n    else\n        return false;\n\
  }\n/* 如果列表满则返回 true */\nbool ListIsFull(const List * plist)\n{\n    Node * pt;\n\
  \    bool full;\n    pt = (Node *) malloc(Node);\n    if (pt == NULL)\n        full\
  \ = true;\n    else\n        full = false;\n    free(pt);\n    return full;\n}\n\
  /* 返回节点数量 */\nunsigned int ListItemCount(const List * plist)\n{\n    unsigned int\
  \ count = 0;\n    Node * pnode = *plist;   /* 设置到列表起始 */\n    while (pnode != NULL)\n\
  \    {\n        ++count;\n        pnode = pnode->next;   /* 设置到下一个节点 */\n    }\n\
  \    return count;\n}\n/* 创建节点保存项并将其添加到 plist 指向的列表末尾（低效实现） */\nbool AddItem(Item\
  \ item, List * plist)\n{\n    Node * pnew;\n    Node * scan = *plist;\n    pnew\
  \ = (Node *) malloc(Node);\n    if (pnew == NULL)\n        return false;   /* 失败时退出函数\
  \ */\n    CopyToNode(item, pnew);\n    pnew->next = NULL;\n    if (scan == NULL)\
  \           /* 空列表，因此放置 */\n        *plist = pnew;   /* pnew 位于列表头部 */\n    else\n\
  \    {\n        while (scan->next != NULL)\n            scan = scan->next;   /*\
  \ 找到列表末尾 */\n        scan->next = pnew;     /* 将 pnew 添加到末尾 */\n    }\n    return\
  \ true;\n}\n/* 访问每个节点并执行 pfun 指向的函数 */\nvoid Traverse (const List * plist, void\
  \ (* pfun)(Item item) )\n{\n    Node * pnode = *plist;   /* 设置到列表起始 */\n    while\
  \ (pnode != NULL)\n    {\n        (*pfun)(pnode->item); /* 将函数应用于项 */\n        pnode\
  \ = pnode->next;   /* 移动到下一个项 */\n    }\n}\n/* 释放由 malloc() 分配的内存并将列表指针置为 NULL */\n\
  void EmptyTheList(List * plist)\n{\n    Node * psave;\n    while (*plist != NULL)\n\
  \    {\n        psave = (*plist)->next; /* 保存下一个节点的地址 */\n        free(*plist);\
  \   /* 释放当前节点 */\n        *plist = psave;   /* 移动到下一个节点 */\n    }\n}\n/* 本地定义将项拷贝到节点\
  \ */\nstatic void CopyNode(Item item, Node *node)\n{\n    node->item = item;   /*\
  \ 结构体拷贝 */\n}\n```\n\n## 程序说明\n\n`list.c` 文件有很多要点。例如，它说明了何时何时使用具有内部链接（internal linkage）的函数。正如第\
  \ 12 章所述，具有内部链接的函数仅在定义它们的文件中可见。在实现接口时，你可能会发现编写不属于官方接口的辅助函数非常方便。例如，示例使用了 `CopyToNode()`\
  \ 函数将类型为 `Item` 的值拷贝到类型为 `Item` 的变量。由于此函数是实现的一部分，而不是接口的一部分，我们使用 `static` 存储类将其隐藏在\
  \ `list.c` 文件中。现在，让我们检查其他函数。\n\n`InitializeList()` 函数将列表初始化为空。在我们的实现中，这意味着将 `List`\
  \ 类型变量设置为 `NULL`。如前所述，这需要将 `List` 变量传递给该函数。\n\n`ListIsEmpty()` 函数非常简单，但它依赖于列表为空时被设置为\
  \ `NULL`。因此，在使用 `ListIsEmpty()` 函数之前初始化列表是非常重要的。如果你扩展接口以包含删除操作，你应该确保在删除最后一个项时将列表重置为空。对于链表，列表的大小取决于可用内存。`ListIsFull()`\
  \ 函数尝试为新项分配空间。如果失败，则列表已满；如果成功，它必须释放刚刚分配的内存，以便实际项使用。\n\n`ListItemCount()` 函数使用通常的链表算法遍历列表并在过程中计数：\n\
  \n```c\nunsigned int ListItemCount(const List * plist)\n{\n    unsigned int count\
  \ = 0;\n    Node * pnode = *plist;   /* 设置到列表起始 */\n    while (pnode != NULL)\n\
  \    {\n        ++count;\n        pnode = pnode->next;   /* 设置到下一个节点 */\n    }\n\
  \    return count;\n}\n```\n\n`AddItem()` 函数是这一组中最复杂的：\n\n```c\nbool AddItem(Item\
  \ item, List * plist)\n{\n    Node * pnew;\n    Node * scan = *plist;\n    pnew\
  \ = (Node *) malloc(Node);\n    if (pnew == NULL)\n        return false;   /* 失败时退出函数\
  \ */\n    CopyToNode(item, pnew);\n    pnew->next = NULL;\n    if (scan == NULL)\
  \           /* 空列表，因此放置 */\n        *plist = pnew;   /* pnew 位于列表头部 */\n    else\n\
  \    {\n        while (scan->next != NULL)\n            scan = scan->next;   /*\
  \ 找到列表末尾 */\n        scan->next = pnew;     /* 将 pnew 添加到末尾 */\n    }\n    return\
  \ true;\n}\n```\n\n\n\n\n```c\nscan = scan->next;  /* find end of list */\nscan->next\
  \ = pnew;  /* add pnew to end */\n}\nreturn true;\n}\n```\n\n`AddItem()` 函数的第一项工作是为新节点分配空间。如果成功，该函数将使用\
  \ `CopyToNode()` 将项拷贝到节点中。然后，它将节点的 `next` 成员设置为 `NULL`。正如你所记得，这表示该节点是链表中的最后一个节点。最后，在创建节点并为其成员分配正确的值后，函数将该节点附加到列表的末尾。如果该项是添加到列表的第一个项，程序会将头指针指向该项。（记住，调用\
  \ `AddItem()` 时将头指针的地址作为第二个参数传递，因此 `*plist` 是头指针的值。）否则，代码将遍历链表，直到找到 `next` 成员设置为\
  \ `NULL` 的项。该节点当前是最后一个节点，因此函数重置其 `next` 成员以指向新节点。\n\n良好的编程习惯要求你在尝试向列表添加项之前，先调用 `ListIsFull()`。然而，用户可能没有遵守这一规定，因此\
  \ `AddItem()` 会自行检查 `malloc()` 是否执行成功。此外，用户可能在调用 `ListIsFull()` 和调用 `AddItem()`\
  \ 之间执行其他内存分配操作，因此最好检查 `malloc()` 是否正常工作。\n\n`Traverse()` 函数与 `ListItemCount()` 函数类似，区别在于它对列表中的每个项应用了一个函数：\n\
  \n点击此处查看代码图片\n\n```c\nvoid Traverse (const List * plist, void (* pfun)(Item item)\
  \ )\n{\n    Node * pnode = *plist;   /* set to start of list */\n    while (pnode\
  \ != NULL)\n    {\n        (*pfun)(pnode->item); /* apply function to item */\n\
  \        pnode = pnode->next;  /* advance to next item */\n    }\n}\n```\n\n回想 `pnode->item`\
  \ 表示存储在节点中的数据，`pnode->next` 链表中的下一个节点。例如，函数调用\n\n```\nTraverse(movies, showmovies);\n\
  ```\n\n将 `showmovies()` 函数应用到列表中的每个项。\n\n最后，`EmptyTheList()` 函数释放了之前使用 `malloc()`\
  \ 分配的内存：\n\n点击此处查看代码图片\n\n```c\nvoid EmptyTheList(List * plist)\n{\n    Node * psave;\n\
  \    while (*plist != NULL)\n    {\n        psave = (*plist)->next; /* save address\
  \ of next node */\n        free(*plist);          /* free current node */\n    \
  \    *plist = psave;        /* advance to next node */\n    }\n}\n```\n\n实现通过将 `List`\
  \ 变量设置为 `NULL` 来表示空列表。因此，此函数需要传递 `List` 变量的地址以便重置它。由于 `List` 已经是一个指针，`plist` 是指向指针的指针。因此，在代码中，表达式\
  \ `*plist` 的类型为指向 `Node` 的指针。当列表终止时，`*plist` 为 `NULL`，这意味着原始实际参数现在设置为 `NULL`。\n\n\
  代码保存了下一个节点的地址，因为从原则上说，调用 `free()` 导致当前节点（`*plist` 指向的节点）的内容不再可用。\n\n***\n\n### 注意：`const`\
  \ 的限制性\n\n几个列表处理函数使用 `const List * plist` 作为参数。这表示这些函数不会修改列表。在这里，`const` 确实提供了一些保护。它防止\
  \ `*plist`（`plist` 指向的内容）被更改。在程序程序中，`plist` 指向 `movies`，因此 `const` 防止了这些函数更改 `movies`，而\
  \ `movies` 过来指向列表中的第一个链接。因此，在以下位置不允许此类代码：\n\n点击此处查看代码图片\n\n```c\n*plist = (*plist)->next;\n\
  ```\n\n### 思考你的工作\n\n现在花一点时间评估 ADT 为你做了什么。首先，比较 `Listing 17.2` 和 `117.4`。ADT 版本面向用户的关注点，读起来容易得多。\n\
  \n接下来，`list.h` 和 `list.c` 文件构成了一个可重用的资源。如果你需要另一个列表，只需取出这些文件即可。假设你需要存储姓名、地址和电话号码清单。首先，你会进入\
  \ `list.h` 并重新定义 `Item` 类型：\n\n```c\ntypedef struct item\n\n{\n    char fname[14];\n\
  \    char lname[24];\n    char relationship[36];\n    char address[60];\n    char\
  \ phonenum[20];\n} Item;\n```\n\n接下来，这就是你需要做的全部，因为所有的列表函数都是基于 `Item` 定义的。在某些情况下，你还需要重新定义\
  \ `CopyToNode()`。例如，如果项是一个数组，你就不能通过赋值来拷贝。\n\n另一个重要点是，用户界面是基于抽象操作定义的，而不是基于特定的数据表示和算法。这让你可以自由调整实现，而无需重做程序。例如，当前的\
  \ `AddItem()` 函数效率有点低，因为它总是从列表开始并搜索末尾。你可以通过跟踪末尾来修复这个问题。例如，你可以这样重新定义 `List` 类型：\n\
  \n点击此处查看代码图片\n\n```c\ntypedef struct list\n\n{\n    Node * head; /* points to head\
  \ of list */\n    Node * end;  /* points to end of list */\n} List;\n```\n\n当然，这需要重写\
  \ `list.c` 文件，但你不需要更改 `Listing 17.4` 中的任何内容。注意，特定的 ADT 甚至没有强制你将简单列表实现为链表。另一种可能性是：\n\
  \n点击此处查看代码图片](#ch17_images.html_p803pro02)\n\n```c\n#define MAXSIZE 100\n\ntypedef\
  \ struct list\n\n{\n    Item entries[MAXSIZE]; /* array of items */\n    int items;\
  \             /* number of items in list */\n}\n```\n\n再次，这需要重写 `list.c` 文件，但使用列表的部分不需要更改。\n\
  \n\n\n最后，考虑一下这种方法为程序开发过程带来的好处。如果某个部分运行不正常，你可能可以将问题定位到单个函数。如果你认为执行某项任务（例如添加项）有更好的方法，你只需要重写那一个函数即可。如果你需要一个新功能，可以考虑通过向包中添加一个新函数来实现。如果你认为使用数组或双向列表会更好，你可以重写实现部分，而无需修改使用该实现的程序。\n\
  \n### 使用 ADT 使用队列\n\n正如你所看到的，在 C 语言中采用抽象数据类型（ADT）编程方法涉及以下三个步骤：\n\n1. 以一种抽象、通用的方式描述一种类型，包括它的操作。\n\
  2. 设计一个函数接口来表示这种新类型。\n3. 编写详细的代码来实现该接口。\n\n你已经见过这种方法如何应用于简单列表。现在，将它应用于稍微复杂一点的东西：队列。\n\
  \n#### 定义队列抽象数据类型\n\n`queue` 是具有两个特殊属性的列表。首先，新项只能添加到列表的末尾。在这一点上，队列类似于简单列表。其次，项只能从列表的头部移除。你可以将队列想象成在剧院买票的人队。你从队尾加入队列，并在买完票后从队头离开。队列是一种`先进先出`（FIFO）数据结构，就像电影排队一样（如果没有人插队的话）。再次，让我们给出一个非正式的、抽象定义定义如下：\n\
  \n![Image](img/804tab01.jpg)\n\n#### 定义接口\n\n接口定义将放在名为 `queue.h` 的文件中。我们将使用 C 语言的\
  \ `typedef` 机制为两种类型创建名称：`Item` 和 `Queue`。对应结构体的具体实现应该是 `queue.h` 文件内容的一部分，但从概念上说，设计结构体属于详细实现阶段。目前，只需假设类型已经定义并将注意力放在函数原型上。\n\
  \n首先，考虑初始化。它涉及到修改 `Queue` 类型，因此函数应该接受 `Queue` 的地址作为参数：\n\n点击此处查看代码图像\n\n```\nvoid\
  \ InitializeQueue (Queue * pq);\n```\n\n接下来，确定队列是否为空或已满需要一个应该返回真值或假值的函数。这里我们假设可以使用\
  \ C99 的 `stdbool.h` 头文件。如果没有，你可以使用类型 `int` 或自己定义一个 `bool` 类型。由于函数没有修改队列，它可以接受一个\
  \ `Queue` 参数。另一方面，取决于 `Queue` 类型对象的大小，只传递 `Queue` 的地址可能会更快且更节省内存。让我们尝试那种方法。另一个优势是，通过这种方式所有函数都将接受地址作为参数。为了指示这些函数不会改变队列，你可以并且应该使用\
  \ `const` 修饰符：\n\n点击此处查看代码图像\n\n```\nbool QueueIsFull(const Queue * pq);\n\nbool\
  \ QueueIsEmpty (const Queue * pq);\n```\n\n换句话说，指针 `pq` 指向一个 `Queue` 数据对象，该对象无法通过\
  \ `pq` 改变。你可以为一个返回队列中项数量数的函数定义一个类似的原型：\n\n点击此处查看代码图像\n\n```\nint QueueItemCount(const\
  \ Queue * pq);\n```\n\n向队列末尾添加项涉及识别该项和队列。这次队列被修改了，因此使用指针是必须的，而不是可选的。函数类型可以是 `void`，或者你可以使用返回值来指示添加项的操作是否成功。让我们采用第二种方法：\n\
  \n点击此处查看代码图像\n\n```\nbool EnQueue(Item item, Queue * pq);\n```\n\n最后，移除项可以通过几种方式完成。如果该项被定义为结构体或基本类型之一，它可以通过函数返回。函数参数可以是\
  \ `Queue` 也可以是指向 `Queue` 的指针。因此，一种可能的原型是这样的：\n\n```\nItem DeQueue(Queue q);\n```\n\
  \n然而，以下原型更通用一些：\n\n点击此处查看代码图像\n\n```\nbool DeQueue(Item * pitem, Queue * pq);\n\
  ```\n\n从队列中移除的项将进入 `pitem` 指针所指向的位置，返回值指示操作是否成功。\n\n清空队列函数唯一需要的参数应该是队列的地址，这建议了如下原型：\n\
  \n点击此处查看代码图像\n\n```\nvoid EmptyTheQueue(Queue * pq);\n```\n\n#### 实现接口的数据表示\n\n\
  第一步是决定使用哪种 C 数据格式作为队列。一种可能性是数组。数组的优点是易于使用，在数组已填充部分的末尾添加项很容易。问题出现在从队列头部移除项。在排队买票的类比中，从头部移除项涉及到将每个元素向头部移动。虽然这种方法简单，但浪费了大量的计算机时间（参见图\
  \ 16).\n\n![Image](img/17fig06.jpg)\n\n17.6 使用数组作为队列\n\n处理移除的另一种方法是让元素留在原地，改为改变作为头部。这种方法的问题是空元素变成了浪费的空间，队列可用空间一直在减少。\n\
  \n![Image](img/17fig07.jpg)\n\n17.7 重新定义头部\n\n空间问题的巧妙方案是使队列`循环`。这意味着从数组末尾绕回开头。也就是说，当你到达数组末尾时，可以从开始添加项。你可以想象在纸条上画数组，然后将数组的一端粘贴在一起形成一个环。当然，你现在必须进行一些记录以确保队列末尾不会超过头部。\n\
  \n![Image](img/17fig08.jpg)\n\n17.8 循环队列\n\n另一种解决方案是使用链表。它的优点是移除头部项不需要移动其他项。相反，你只需要重置头部指向新的第一个元素。由于我们已经在处理链表，我们将采用这条路线。为了测试我们的想法，我们将从一个整数队列开始：\n\
  \n```\ntypedef int Item;\n```\n\n链表由节点构建，因此让我们定义一个节点 next：\n\n```\ntypedef struct\
  \ node\n{\n    Item item;\n    struct node * next;\n} Node;\n```\n\n对于队列，你需要跟踪头部和尾部项。可以使用指针来实现。此外，你可以使用计数器来跟踪队列中项的数量。因此，结构体有两个指针成员和一个类型\
  \ `int` 成员：\n\n点击此处查看代码图像\n\n```\ntypedef struct queue\n{\n    Node * front;  /*\
  \ 指向队列头部的指针 */\n    Node * rear;   /* 指向队列尾部的指针  */\n    int items;      /* 队列中的项数\
  \ */\n} Queue;\n```\n\n注意 `Queue` 是一个具有三个成员的结构体，因此早期使用队列指针而不是整个队列作为参数是一个节省时间和空间的做法。\n\
  \n\n\n接下来，考虑队列的大小。对于链表来说，可用内存的大小决定了限制，但通常更小的尺寸更为合适。例如，你可能使用队列来模拟在机场等待降落的飞机。如果等待的飞机数量过大，新到达的飞机可能会被重路由到其他机场。我们将最大队列大小设置为\
  \ 10。列表 17.6 包含了 `queue` 接口的定义和原型。它遗留了 `Item` 类型的具体定义。在使用该接口时，你需要为你的特定程序插入相应的定义。\n\
  \n### 列表 17.6 queue.h 接口头文件\n\n点击此处查看代码图像\n\n***\n\n```c\n/* queue.h -- 队列的接口 */\n\
  \n#ifndef _QUEUE_H_\n#define _QUEUE_H_\n\n#include <stdbool.h>\n\n/* 在此处插入 ITEM\
  \ 类型 */\n\n/* 例如， */\n\ntypedef int Item;  // 用于 use_q.c\n\n/* 或者使用 typedef struct\
  \ item {int gumption; int charisma;} Item; */\n\n#define MAXQUEUE 10\n\ntypedef\
  \ struct node\n{\n    Item item;\n    struct node * next;\n} Node;\n\ntypedef struct\
  \ queue\n{\n    Node * front;  /* 指向队头的指针 */\n    Node * rear;   /* 指向队尾的指针 */\n\
  \    int items;     /* 队列中的元素数量 */\n} Queue;\n\n/* 操作：      初始化队列             */\n\
  /* 前置条件：pq 指向一个队列              */\n/* 后置条件：队列被初始化为空  */\nvoid InitializeQueue(Queue\
  \ * pq);\n\n/* 操作：      检查队列是否满            */\n/* 前置条件：pq 指向之前初始化的队列  */\n/* 后置条件：如果队列满了返回\
  \ True，否则返回 False */\nbool QueueIsFull(const Queue * pq);\n\n/* 操作：      检查队列是否为空\
  \           */\n/* 前置条件：pq 指向之前初始化的队列  */\n/* 后置条件：如果队列为空返回 True，否则返回 False */\n\
  bool QueueIsEmpty(const Queue *pq);\n\n/* 操作：      确定队列中的元素数量  */\n/* 前置条件：pq 指向之前初始化的队列\
  \  */\n/* 后置条件：返回队列中的元素数量      */\nint QueueItemCount(const Queue * pq);\n\n/* 操作：\
  \      将元素添加到队列队尾        */\n/* 前置条件：pq 指向之前初始化的队列  */\n/*               item 将被放置在队尾\
  \  */\n/* 后置条件：如果队列不为空，元素将被放置在  */\n/*                队尾且函数返回      */\n/*      \
  \          True；否则，队列保持不变且 */\nbool EnQueue(Item item, Queue * pq);\n\n/* 操作：  \
  \    从队列队头移除元素    */\n/* 前置条件：pq 指向之前初始化的队列  */\n/* 后置条件：如果队列不为空，队头的元素将 */\n/* \
  \               被复制到 *pitem 并从  */\n/*                队列中删除，并返回 True；如果清空了 */\n\
  /*                队列，队列将重置为 */\n/*                空。如果队列原本为空，队列 */\n/*         \
  \       保持不变且  */\n\n                返回 False  */\nbool DeQueue(Item *pitem, Queue\
  \ * pq);\n\n/* 操作：      清空队列  */\n/* 前置条件：pq 指向之前初始化的队列  */\n/* 后置条件：队列为空  */\n\
  void EmptyTheQueue(Queue * pq);\n\n#endif\n```\n\n***\n\n### 实现接口函数\n\n现在我们可以开始编写接口代码了。首先，初始化队列为“空”意味着将\
  \ `front` 和 `rear` 指针设置为 `NULL`，并将元素计数器（`items` 成员）设置为 `0`：\n\n点击此处查看代码图像\n\n```c\n\
  void InitializeQueue(Queue * pq)\n{\n    pq->front = pq->rear = NULL;\n    pq->items\
  \ = 0;\n}\n```\n\n接下来，`items` 成员使得检查队列是否满或为空，以及返回队列中的元素数量变得非常简单：\n\n点击此处查看代码图像\n\
  \n```c\nbool QueueIsFull(const Queue * pq)\n{\n    return pq->items == MAXQUEUE;\n\
  }\n\nbool QueueIsEmpty(const Queue * pq)\n{\n    return pq->items == 0;\n}\n\nint\
  \ QueueItemCount(const Queue * pq)\n{\n    return pq->items;\n}\n```\n\n向队列中添加元素涉及以下步骤：\n\
  \n1. 创建新节点。\n2. 将元素复制到节点中。\n3. 将节点的 `next` 指针设置为 `NULL`，标识该节点为列表中的最后一个节点。\n4. 将当前队尾节点的\
  \ `next` 指针指向新节点，将新节点链接到队列。\n5. 将 `rear` 指针设置为新节点，以便找到最后一个节点。\n6. 将元素计数器加 1。\n\n\
  此外，该函数必须处理两种特殊情况。首先，如果队列为空，`front` 指针应该设置为指向新节点。这是因为当只有一个节点时，该节点既是队列的队头也是队尾。其次，如果函数无法获取内存，它应该做某些处理。由于我们设想的是小队列，我们将让程序在内存不足时终止。以下是\
  \ `EnQueue` 的代码：\n\n点击此处查看代码图像\n\n```c\nbool EnQueue(Item item, Queue * pq)\n{\n\
  \    Node * pnew;\n    if (QueueIsFull(pq))\n    {\n        return false;\n    }\n\
  \    pnew = (Node *) malloc(sizeof(Node));\n    if (pnew == NULL)\n    {\n     \
  \   fprintf(stderr,\"Unable to allocate memory\\n\");\n        exit(1);\n    }\n\
  \    CopyToNode(item, pnew);\n    pnew->next = NULL;\n    if (QueueIsEmpty(pq))\n\
  \    {\n        pq->front = pnew;\n    }\n    else\n    {\n        pq->rear->next\
  \ = pnew;\n    }\n    pq->rear = pnew;\n    pq->items++;\n    return true;\n}\n\
  ```\n\n`CopyToNode()` 函数是一个处理将元素到节点的静态函数：\n\n点击此处查看代码图像\n\n```c\nstatic void CopyToNode(Item\
  \ item, Node * pn)\n{\n    pn->item = item;\n}\n```\n\n从队头移除元素涉及以下步骤：\n\n1. 将元素复制到一个变量。\n\
  2. 释放节点使用的内存。\n3. 将队头指针重指向队列中的下一个元素。\n4. 如果移除最后一个元素，将队头和队尾指针重置为 `NULL`。\n5. 递减元素计数。\n\
  \n以下是完成这些操作的代码：\n\n点击此处查看代码图像\n\n```c\nbool DeQueue(Item *pitem, Queue * pq)\n{\n\
  \    Node * pt;\n    if (QueueIsEmpty(pq))\n    {\n        return false;\n    }\n\
  \    CopyToItem(pq->front, pitem);\n    pt = pq->front;\n    pq->front = pq->front->next;\n\
  \    free(pt);\n    pq->items--;\n    if (pq->items == 0)\n    {\n        pq->rear\
  \ = NULL;\n    }\n    return true;\n}\n```\n\n\n\n\n\n```c\nvoid EmptyTheQueue(Queue\
  \ * pq)\n{\n    Item dummy;\n    while (!QueueIsEmpty(pq))\n        DeQueue(&dummy,\
  \ pq);\n}\n```\n\n***\n\n**注意：** 保持你的 ADT 纯洁\n\n在定义了 ADT 接口后，你应该只使用接口提供的函数来处理数据类型。例如，注意\
  \ `Dequeue()` 依赖于 `EnQueue()` 函数能够正确设置指针，并认为 `rear` 节点的 `next` 指针设置为 `NULL`。如果在使用该\
  \ ADT 的程序中，你决定直接操作队列的部分，可能会破坏接口包中函数之间的协调性。\n\n***\n\n列表 17.7 显示了接口的所有函数，包括在 `EnQueue()`\
  \ 中使用的 `CopyToItem()` 函数。\n\n列表 17.7 `queue.c` 实现文件\n\n点击此处查看代码图像\n\n***\n\n```c\n\
  /* queue.c -- Queue 类型的实现*/\n#include <stdio.h>\n#include <stdlib.h>\n#include \"\
  queue.h\"\n\n/* 本地函数 */\nstatic void CopyToNode(Item item, Node * pn);\nstatic void\
  \ CopyToItem(Node * pn, Item * pi);\n\nvoid InitializeQueue(Queue * pq)\n{\n   \
  \ pq->front = pq->rear = NULL;\n    pq->items = 0;\n}\n\nbool QueueIsFull(const\
  \ Queue * pq)\n{\n    return pq->items == MAXQUEUE;\n}\n\nbool QueueIsEmpty(const\
  \ Queue * pq)\n{\n    return pq->items == 0;\n}\n\nint QueueItemCount(const Queue\
  \ * pq)\n{\n    return pq->items;\n}\n\nbool EnQueue(Item item, Queue * pq)\n{\n\
  \    Node * pnew;\n    if (QueueIsFull(pq))\n        return false;\n    pnew = (Node\
  \ *) malloc( sizeof(Node));\n    if (pnew == NULL)\n    {\n        fprintf(stderr,\"\
  Unable to allocate memory!\\n\");\n        exit(1);\n    }\n    CopyToNode(item,\
  \ pnew);\n    pnew->next = NULL;\n    if (QueueIsEmpty(pq))\n        pq->front =\
  \ pnew;           /* item 放入头部 */\n    else\n        pq->rear->next = pnew;    \
  \  /* 在队尾链接 */\n    pq->rear = pnew;               /* 记录末位置 */\n    pq->items++;\
  \                  /* 队列中多了一个元素 */\n    return true;\n}\n\nbool DeQueue(Item * pitem,\
  \ Queue * pq)\n{\n    Node * pt;\n    if (QueueIsEmpty(pq))\n        return false;\n\
  \    CopyToItem(pq->front, pitem);\n    pt = pq->front;\n    pq->front = pq->front->next;\n\
  \    free(pt);\n    pq->items--;\n    if (pq->items == 0)\n        pq->rear = NULL;\n\
  \    return true;\n}\n\n/* 清空队列 */\nvoid EmptyTheQueue(Queue * pq)\n{\n    Item\
  \ dummy;\n    while (!QueueIsEmpty(pq))\n        DeQueue(&dummy, pq);\n}\n/* 本地函数\
  \ */\nstatic void CopyToNode(Item item, Node * pn)\n{\n    pn->item = item;\n}\n\
  static void CopyToItem(Node * pn, Item * pi)\n{\n    *pi = pn->item;\n}\n```\n\n\
  ***\n\n#### 测试队列\n\n在将新设计（如队列包）插入关键程序之前，对其进行测试是一个好主意。测试的一种方法是编写一个短程序，有时称为*驱动程序*（*driver*），其唯一目的是测试该包。例如，列表\
  \ 17.8 使用了一个允许你添加和删除元素的队列。在使用该程序之前，请确保 `queue.h` 中存在以下行：\n\n`typedef int item;`\n\
  \n同样记住，你必须链接 `queue.c` 和 `use_q.c`。\n\n列表 17.8 `use_q.c` 程序\n\n点击此处查看图像\n\n***\n\
  \n```c\n/* use_q.c -- 测试接口的驱动程序 */\n/* 使用 queue.c 编译 */\n#include <stdio.h>\n#include\
  \ \"queue.h\" /* 定义了 Queue, Item */\nint main(void)\n{\n    Queue line;\n    Item\
  \ temp;\n    char ch;\n    InitializeQueue(&line);\n    puts(\"Testing the interface.\
  \ Type a to add a value,\");\n    puts(\"type d to delete a value, and type q to\
  \ quit.\");\n    while ((ch = getchar()) != 'q')\n    {\n        if (ch != 'a' &&\
  \ ch != 'd') /* 忽略其他输入 */\n            continue;\n        if (ch == 'a')\n     \
  \   {\n            printf(\"Integer to add: \");\n            scanf(\"%d\", &temp);\n\
  \            if (!QueueIsFull(&line))\n            {\n                printf(\"\
  Putting %d into queue\\n\", temp);\n                EnQueue(temp,&line);\n     \
  \       }\n            else\n                puts(\"Queue is full!\");\n       \
  \ }\n        else\n        {\n            if (QueueIsEmpty(&line))\n           \
  \     puts(\"Nothing to delete!\");\n            else\n            {\n         \
  \       DeQueue(&temp,&line);\n                printf(\"Removing %d from queue\\\
  n\", temp);\n            }\n        }\n        printf(\"%d items in queue\\n\",\
  \ QueueItemCount(&line));\n    }\n    EmptyTheQueue(&line);\n    puts(\"Bye!\");\n\
  \    return 0;\n}\n```\n\n这里是一个示例运行。你还应该测试当队列满时它的行为是否正确：\n\n```\nTesting the interface.\
  \ Type a to add a value,\ntype d to delete a value, and type q to quit.\na\n40\n\
  Putting 40 into queue\n1 items in queue\na\n20\nPutting 20 into queue\n2 items in\
  \ queue\na\n50\nPutting 50 into queue\n3 items in queue\nd\nRemoving 40 from queue\n\
  2 items in queue\nd\nRemoving 20 from queue\n1 items in queue\nd\nRemoving 50 from\
  \ queue\n0 items in queue\nq\nBye!\n```\n\n\n\n\n这里有一种方法。让时间以一分钟为单位递增。每过一分钟，检查一次是否有新客户到达。如果有客户到达且队列未满，则将客户加入队列。这涉及到在\
  \ `Item` 结构体中记录客户的到达时间和客户希望的咨询时长，然后将该项加入队列。然而，如果队列已满，则拒绝该客户。为了记账，请记录客户总数和“被拒绝”总数（因满员而无法排队的人数）。\n\
  \n接下来，处理队列头部。也就是说，如果队列不为空且西格蒙（Sigmund）没有忙于上一个客户，则移除队列头的项。记得，该项包含了客户加入队列的时间。通过将此时间与当前时间进行比较，你可以得到客户在队列中的分钟数。该项还包含客户需要的咨询分钟数，这决定了\
  \ Sigmund 将在新客户身上花费多长时间。使用一个变量来跟踪这个等待时间。如果 Sigmund 忙，则没有人被“出队”。但是，跟踪等待时间的变量应该减 1。\n\
  \n核心代码可能如下所示，每个循环对应一分钟的活动：\n\n```c\nfor (cycle = 0; cycle < cyclelimit; cycle++)\n\
  {\n    if (newcustomer(min_per_cust))\n    {\n        if (QueueIsFull(&line))\n\
  \            turnaways++;\n        else\n        {\n            customers++;\n \
  \           temp = customertime(cycle);\n            EnQueue(temp, &line);\n   \
  \     }\n    }\n    if (wait_time <= 0 && !QueueIsEmpty(&line))\n    {\n       \
  \ DeQueue (&temp, &line);\n        wait_time = temp.processtime;\n        line_wait\
  \ += cycle - temp.arrive;\n        served++;\n    }\n    if (wait_time > 0)\n  \
  \      wait_time--;\n\n    sum_line += QueueItemCount(&line);\n}\n```\n\n注意，时间分辨率相对粗糙（一分钟），因此每小时的最大客户人数仅为\
  \ 60 人。\n\n以下是一些变量和函数的含义：\n\n- `min_per_cust` 是客户到达之间的平均分钟数。\n- `newcustomer()`\
  \ 使用 C 语言的 `rand()` 函数来决定在这一分钟内是否有客户出现。\n- `turnaways` 是被拒绝的到达人数。\n- `customers`\
  \ 是加入队列的到达人数。\n- `temp` 是一个描述新客户的 `Item` 变量。\n- `customertime()` 设置 `temp` 结构体中的\
  \ `arrive` 和 `processtime` 成员。\n- `wait_time` 是到 Sigmund 完成当前客户所需剩余的分钟数。\n- `line_wait`\
  \ 是 true 为止所有客户在队列中花费的累计时间。\n- `served` 是实际服务的客户数量。\n- `sum_line` 是此为止的队列累计长度。\n\
  \n想一下，如果这段代码中散布着 `malloc()` 和 `free()` 函数以及指向节点的指针，它看起来会是多么混乱和晦涩。使用队列包让你能够专注于模拟问题，而不是编程细节。\n\
  \n`Listing 17.9` 显示了商场建议咨询台模拟的完整代码。它使用了标准的 `rand()`、`srand()` 和 `time()` 函数来生成随机值，遵循了第\
  \ 12 章建议的方法。要使用该程序，请记得用以下内容更新 `queue.h` 中的 `Item` 定义：\n\n```c\ntypedef struct\n\
  {\n    long arrive;  // 客户加入队列的时间\n    int processtime; // 需要的分钟数\n} Item;\n```\n\
  \n别忘了将 `mall.c` 的代码与 `queue.c` 链接。\n\n### Listing 17.9 mall.c\n\n```c\n/* *\n//\
  \ mall.c -- 使用 Queue 接口\n// 配合 queue.c 编译\n#include <stdio.h>\n#include <stdlib.h>\
  \  // 用于 rand() 和 srand()\n#include <time.h>  // 用于 time()\n#include \"queue.h\"\
  \  // 修改 Item\n#define MIN_PER_HR 60\nbool newcustomer(double x); // 是否新客户？\nItem\
  \ customertime(long when); // 设置客户参数\nint main(void)\n{\n    Queue line;\n    Item\
  \ temp;      // 新数据\n    int hours;      // 模拟的小时\n    int perhour;    // 每小时平均到达人数\n\
  \    long cycle, cyclelimit;  // 循环计数，限制\n    long turnaways = 0;  // 因队列满而被拒绝\n\
  \    long customers = 0;  // 加入队列\n    long served = 0;  // 模拟期间服务的\n    long sum_line\
  \ = 0;  // 累计队列长度\n    int wait_time = 0;  // 到 Sigmund 空闲的时间\n    double min_per_cust;\
  \  // 到达之间的平均时间\n    long line_wait = 0;  // 在队列中的累计时间\n\n    InitializeQueue(&line);\n\
  \    srand((unsigned int) time(0)); // rand() 的随机初始化\n    puts(\"案例研究: Sigmund 的建议台\"\
  );\n    puts(\"输入模拟的小时:\");\n    scanf(\"%d\", &hours);\n    cyclelimit = MIN_PER_HR\
  \ * hours;\n    puts(\"输入每小时平均客户人数:\");\n    scanf(\"%d\", &perhour);\n    min_per_cust\
  \ = MIN_PER_HR / perhour;\n    for (cycle = 0; cycle < cyclelimit; cycle++)\n  \
  \  {\n        if (newcustomer(min_per_cust))\n        {\n            if (QueueIsFull(&line))\n\
  \                turnaways++;\n            else\n            {\n               \
  \ customers++;\n                temp = customertime(cycle);\n                EnQueue(temp,\
  \ &line);\n            }\n        }\n        if (wait_time <= 0 && !QueueIsEmpty(&line))\n\
  \        {\n            DeQueue (&temp, &line);\n            wait_time = temp.processtime;\n\
  \            line_wait += cycle - temp.arrive;\n            served++;\n        }\n\
  \        if (wait_time > 0)\n            wait_time--;\n\n        sum_line += QueueItemCount(&line);\n\
  \    }\n    if (customers > 0)\n    {\n        printf(\"客户: %ld\\n\", customers);\n\
  \        printf(\"服务: %ld\\n\", served);\n        printf(\"被拒绝: %ld\\n\", turnaways);\n\
  \        printf(\"平均队列长度: %.2f\\n\", (double) sum_line / cyclelimit);\n        printf(\"\
  平均等待时间: %.2f 分\\n\", (double) line_wait / served);\n    }\n    else\n    {\n   \
  \     puts(\"没有客户!\");\n    }\n    EmptyTheQueue(&line);\n    puts(\"再见!\");\n \
  \   return 0;\n}\n\n// x = 客户之间的平均分钟数\n// 返回值为 true 表示在这一分钟内客户出现\nbool newcustomer(double\
  \ x)\n{\n    if (rand() * x / RAND_MAX < 1)\n        return true;\n    else\n  \
  \      return false;\n}\n\n// when 是客户到达的时间\n// 函数返回一个 Item 结构体，将到达时间\n// 设置为 when，并将处理时间设置为\
  \ 1-3 之间的随机值\nItem customertime(long when)\n{\n    Item cust;\n    cust.processtime\
  \ = rand() % 3 + 1;\n    cust.arrive = when;\n    return cust;\n}\n```\n\n\n\n\n\
  点击此处查看代码图像\n\n# 案例研究：西格德·兰德的咨询台\n\n```\n输入模拟小时数：\n80\n输入每小时平均客户数：\n20\n接受的客户: 1633\n\
