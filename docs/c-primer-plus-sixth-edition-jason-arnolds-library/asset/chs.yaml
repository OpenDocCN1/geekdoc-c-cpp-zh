  \ 和 `if else` 语句以及如何嵌套它们\n\n![Image](img/squf.jpg) 使用逻辑运算符将关系表达式组合为复杂的测试表达式\n\n\
  ![Image](img/squf.jpg) C 的条件运算符\n\n![Image](img/squf.jpg) `switch` 语句\n\n![Image](img/squf.jpg)\
  \ `break`、`continue` 和 `goto` 跳转\n\n![Image](img/squf.jpg) 使用 C 的字符输入输出函数——`getchar()`\
  \ 和 `putchar()`\n\n![Image](img/squf.jpg) 由 `ctype.h` 头文件提供的字符分析函数族\n\n随着你对 C 语言变得越来越熟练，你可能想要处理更复杂的任务。当你这样做时，你需要方法来控制和组织这些项目。C\
  \ 提供了满足这些需求的工具。你已经学会了使用循环来编写重复性任务程序。在本章中，你将学习分支结构，如 `if` 和 `switch`，它们允许程序根据其检查的条件来执行操作。此外，你还将接触\
  \ C 的逻辑运算符，它们允许你在 `while` 或 `if` 条件中测试多个关系，并且你将查看 C 的跳转语句，它们可以将程序流转转移到程序的另一个部分。到本章结束时，你将获得所需的所有基本信息，以设计一个按你预期运行的程序。\n\
  \n### if 语句\n\n让我们从一个简单的 `if` 语句示例开始，如列表 7.1 所示。该程序读取一个每日最低温度（摄氏度）列表，并报告总条数以及低于冰点（即低于\
  \ 0 摄氏度）的百分比。它在循环中使用 `scanf()` 读取数值。在每个循环周期中，它会增加一个计数器以跟踪条目数量。`if` 语句识别低于冰点的温度，并单独跟踪低于冰点的天数。\n\
  \n列表 7.1 colddays.c 程序\n\n点击此处查看代码图像\n\n```c\n// colddays.c -- 查找低于冰点的天数比例\n\n#include\
  \ <stdio.h>\n\nint main(void)\n{\n    const int FREEZING = 0;\n    float temperature;\n\
  \    int cold_days = 0;\n    int all_days = 0;\n    printf(\"输入每日最低温度列表。\\n\");\n\
  \    printf(\"使用摄氏度，并输入 q 退出。\\n\");\n    while (scanf(\"%f\", &temperature) ==\
  \ 1)\n    {\n        all_days++;\n        if (temperature < FREEZING)\n        \
  \    cold_days++;\n    }\n    if (all_days != 0)\n        printf(\"%d 天总量: %.1f%%\
  \ 低冰点。\\n\",\n               all_days, 100.0 * (float) cold_days / all_days);\n\
  \    if (all_days == 0)\n        printf(\"未输入数据!\\n\");\n    return 0;\n}\n```\n\
  \n这是一个示例运行：\n\n点击此处查看代码图像\n\n输入每日最低温度列表。\n使用摄氏度，并输入 q 退出。\n12 5 -2.5 0 6 8 -3 -10\
  \ 5 10 q\n10 天总量: 30.0% 低冰点。\n\n`while` 循环测试条件使用 `scanf()` 的返回值，在 `scanf()` 遇到非数字输入时终止循环。通过对\
  \ `temperature` 使用 `float` 而不是 `int`，程序能够接受如 `-2.5` 以及 `8` 等输入。\n\n这是 `while` 块中的新语句：\n\
  \n```c\nif (temperature < FREEZING)\n    cold_days++;\n```\n\n此 `if` 语句指示计算机如果刚刚读取的值（`temperature`）小于零，则将\
  \ `cold_days` 加 1。如果 `temperature` 不小于零会发生什么？那么 `cold_days++;` 语句将被跳过，`while` 循环继续读取下一个温度值。\n\
  \n程序使用两次 `if` 语句来控制输出。如果有数据，它就打印结果。如果没有数据，它就打印消息。为了避免整数除法，程序使用了 `float` 强制转换：`10.0\
  \ * (float) cold_days / all_days`。`if` 语句是一种在两条路径之间进行选择的机制。\n\n### 在 if 语句中添加 `else`\n\
  \n`if` 语句的简单形式让你拥有执行语句或跳过它的选择。C 还允许你通过使用 `if else` 形式在语句之间进行选择。让我们使用 `if else` 形式修复列表\
  \ 7.1 中一个别拙的片段。\n\n\n\n\n```c\nif (x > 0)\n    printf(\"Incrementing x:\\n\");\n\
  \    x++;\nelse            // 将产生一个错误\n    printf(\"x <= 0 \\n\");\n```\n\n编译器将\
  \ `printf()` 语句视为 `if` 语句的一部分，而将 `x++;` 语句视为一个独立的语句，而不是 `if` 语句的一部分。随后它会发现 `else`\
  \ 没有连接到任何 `if`，这是一个错误。相反，请使用以下代码：\n\n点击此处查看代码图像\n\n```c\nif (x > 0)\n{\n    printf(\"\
  Incrementing x:\\n\");\n    x++;\n}\nelse\n    printf(\"x <= 0 \\n\");\n```\n\n\
  `if` 语句允许你选择是否执行一个动作。`if else` 语句允许你在两个动作之间进行选择。图 7.1 比较了这两个语句。\n\n![Image](img/07fig01.jpg)\n\
  \n图 7.1 `if` 与 `if else`。\n\n#### 另一个示例：引入 getchar() 和 putchar()\n\n到目前的大多数示例都使用了数值输入。为了让你练习其他类型，让我们来看一个面向字符的示例。你已经知道如何使用\
  \ `scanf()` 和 `printf()` 配合 `%c` 说明符来读写字符；但现在你将遇到一对专门为面向字符的输入输出设计的 C 函数——`getchar()`\
  \ 和 `putchar()`。\n\n`getchar()` 函数不接受任何参数，它返回输入中的下一个字符。例如，以下语句读取下一个输入字符并将其赋值给变量\
  \ `ch`：\n\n```c\nch = getchar();\n```\n\n这条语句的效果与以下语句相同：\n\n```c\nscanf(\"%c\",\
  \ &ch);\n```\n\n`putchar()` 函数打印它的参数。例如，接下来的语句以字符形式打印之前赋值给 `ch` 的值：\n\n```c\nputchar(ch);\n\
  ```\n\n这条语句的效果与以下相同：\n\n```c\nprintf(\"%c\", ch);\n```\n\n由于这些函数只处理字符，它们比更通用的 `scanf()`\
  \ 和 `printf()` 函数更快、更紧凑。此外，注意它们不需要格式说明符；这是因为它们只与字符一起。这两个函数通常定义在 `stdio.h` 文件中。（此外，通常情况下，它们是预处理器宏而非真正的函数；我们将在第\
  \ 16 章 “C 预处理器和 C 库”中讨论类函数宏。）\n\n让我们通过编写一个程序来观察这些函数是如何工作的，该程序将重复输入行，但将每个非空格字符替换为\
  \ ASCII 码序列中的后续字符。空格将原样输出。你可以将预期的响应描述为：“如果字符是空格，则打印它；否则，打印 ASCII 序列中的下一个字符。”\n\n\
  C 代码看起来非常像这个语句，正如你从 列表 7.2 中所示。\n\n列表 7.2 cypher1.c 程序\n\n点击此处查看代码图像\n\n```c\n//\
  \ cypher1.c -- 修改输入，保留空格\n\n#include <stdio.h>\n\n#define SPACE ' '            //\
  \ 那是空格的引号\n\nint main(void)\n{\n    char ch;\n    ch = getchar();          // 读取一个字符\n\
  \    while (ch != '\\n')      // 当不是行尾\n    {\n        if (ch == SPACE)      //\
  \ 保留空格\n            putchar(ch);      // 字符不变\n        else\n            putchar(ch\
  \ + 1);  // 修改其他字符\n        ch = getchar();       // 获取下一个字符\n    }\n    putchar(ch);\
  \              // 打印换行符\n    return 0;\n}\n```\n\n（如果你的编译器由于转换可能导致数据丢失而报错，不要担心。第\
  \ 8 章 “字符输入输出和输入验证”会在引入 `EOF` 时解释一切。）\n\n这是一个示例运行：\n\n```\nCALL ME HAL.\nDBMM NF\
  \ IBM/\n```\n\n将此循环与 列表 7.1 中的循环进行比较。列表 7.1](#ch07.html_ch07lis01) 使用 `scanf()`\
  \ 返回的状态而不是输入项的值来决定何时终止循环。然而，列表 7.2](#ch07.html_ch07lis02) 使用输入项本身的值来决定终止循环。这种差异导致了略有不同的循环结构，在循环之前有一个读取语句，在每个循环结束时有一个读取语句。然而，C\
  \ 灵活的语法允许通过将读取和测试合并为单个表达式来模拟 列表 7.1。这意味着你可以替换如下形式的循环：\n\n点击此处查看代码图像\n\n```c\nif\
  \ (x > 0)\n    printf(\"Incrementing x:\\n\");\n    x++;\nelse            // 将产生一个错误\n\
  \    printf(\"x <= 0 \\n\");\n```\n\n\n\n\n注意，列表 7.2 的输出显示句号被转换为斜杠；这是因为斜杠字符的 ASCII\
  \ 码比句号字符的代码大 1。但如果程序的目的是只转换字母，那么如果能让所有非字母（而不只是空格）保持不变，那就更好了。在本章稍后部分讨论的逻辑运算符提供了一种测试字符是否不是空格、不是逗号等的方法，但列出所有可能的情况将相当繁琐。幸运的是，C\
  \ 语言拥有一组标准函数用于分析字符；`ctype.h` 头文件包含了这些函数的原型。这些函数接受一个字符作为参数，如果该字符属于特定类别，则返回非零（真），否则返回零（假）。例如，`isalpha()`\
  \ 函数在其参数为字母时会返回一个非零值。列表 7.3 通过使用该函数对列表 7.2 进行了泛化处理；它还结合了我们刚刚讨论过的简短循环结构。\n\n### 列表\
  \ 7.3 cypher2.c 程序\n\n点击此处查看代码图像\n\n```c\n// cypher2.c -- 修改输入，保留非字母\n\n#include\
  \ <stdio.h>\n#include <ctype.h>             // 用于 isalpha()\n\nint main(void)\n\
  {\n    char ch;\n    while ((ch = getchar()) != '\\n')\n    {\n        if (isalpha(ch))\
  \      // 如果是字母，\n            putchar(ch + 1);  // 显示下一个字母\n        else       \
  \         // 否则，\n            putchar(ch);      // 原样显示\n    }\n    putchar(ch);\
  \              // 显示换行符\n    return 0;\n}\n```\n\n这是一个示例运行；请注意小写和大写字母都被加密了，但空格和标点符号没有：\n\
  \nLook! It's a programmer!（看！是个程序员！）\n\nMppl! Ju't b qsphsbnnfs！（你好！）\n\n表 7.1 和\
  \ 7.2 列出了包含 `ctype.h` 头文件时提供的几个函数。其中一些提到了区域（locale）；这指的是 C 语言用于指定区域以修改或扩展基本 C 用法的机制。（例如，许多国家在编写小数时使用逗号而不是小数点，特定的区域可以指定\
  \ C 在浮点数输出时以相同的方式使用逗号，从而将 `123.45` 显示为 `123,45`。）注意，映射函数不会修改原始参数；相反，它们返回修改后的值。这意味着，\n\
  \n```c\ntolower(ch);      // 对 ch 无影响\n```\n\n![Image](img/07tab01.jpg)\n\n表 7.1\
  \ `ctype.h` 字符测试函数\n\n![Image](img/07tab02.jpg)\n\n表 7.2 `ctype.h` 字符映射函数\n\n并没有改变\
  \ `ch`。要改变 `ch`，请这样做操作：\n\n点击此处查看代码图像\n\n```c\nch = tolower(ch);  // 将 ch 转换为小写\n\
  ```\n\n#### 多路选择 else if\n\n生活经常为你提供的选择不止于两个。你可以用 `else if` 扩展 `if else` 结构以适应这一事实。让我们来看一个特定的例子。公用公司的费用取决于客户使用的能量量。以下是该公司根据千瓦时（kWh）收取的电费费率：\n\
  \n![Image](img/254tab01.jpg)\n\n如果你担心自己的能源管理，可能想编写一个程序来计算你的能源成本。列表 7.4 中的程序是这一方向的第一步。\n\
  \n### 列表 7.4 electric.c 程序\n\n点击此处查看代码图像\n\n```c\n// electric.c -- 计算电费单\n\n#include\
  \ <stdio.h>\n#define RATE1   0.13230    // 前 360 kwh 的费率\n#define RATE2   0.15040\
  \   // 后 108 kwh 的费率\n#define RATE3   0.30025   // 后 252 kwh 的费率\n#define RATE4\
  \   0.34025   // 720 kwh 的费率\n#define BREAK1  360.0     // 费率的第一个断点\n#define BREAK2\
  \  468.0     // 费率的第二个断点\n#define BREAK3  720.0     // 费率的第三个断点\n#define BASE1 \
  \  (RATE1 * BREAK1) // 360 kwh 的费用\n#define BASE2   (BASE1 + (RATE2 * (BREAK2 -\
  \ BREAK1))) // 468 kwh 的费用\n#define BASE3   (BASE1 + BASE2 + (RATE3 * (BREAK3 -\
  \ BREAK2))) // 720 kwh 的费用\n\nint main(void)\n{\n    double kwh;      // 使用的千瓦时\n\
  \    double bill;     // 费用\n    printf(\"Please enter the kwh used.\\n\");\n  \
  \  scanf(\"%lf\", &kwh);  // double 使用 %lf\n    if (kwh <= BREAK1)\n        bill\
  \ = RATE1 * kwh;\n    else if (kwh <= BREAK2)  // kwh 在 360 和 468 之间\n        bill\
  \ = BASE1 + (RATE2 * (kwh - BREAK1));\n    else if (kwh <= BREAK3)  // kwh 在 468\
  \ 和 720 之间\n        bill = BASE2 + (RATE3 * (kwh - BREAK2));\n    else  // kwh 超过\
  \ 680\n        bill = BASE3 + (RATE4 * (kwh - BREAK3));\n    printf(\"The charge\
  \ for %.1f kwh is $%1.2f.\\n\", kwh, bill);\n    return 0;\n}\n```\n\n这是一些输出：\n\n\
  点击此处查看代码图像\n\nPlease enter the kwh used.\n580\nThe charge for 580.0 kwh is $97.50.\n\
  \n列表 7.4 使用了符号常量来表示费率，以便将费率集中在一起。如果费率或断点发生变化，基础费用也会自动更新。请记住预处理器并没有进行计算。在 `BASE1`\
  \ 出现的地方，它将被替换为 `0.13230 * 360.0`。\n\n程序的流程非常直观。程序根据 `kwh` 的值选择三个公式之一。你应该特别注意，程序进入第一个\
  \ `else` 的唯一方法是 `kwh` 大于等于 360。因此，`else if (kwh <= BREAK2)` 这行实际上等于要求 `kwh` 在 360\
  \ 到 468 之间，正如程序注释所示。同样，最后的 `else` 只有在 `kwh` 超过 720 时才能到达。最后，注意 `BASE1`、`BASE2` 和\
  \ `BASE3` 分别代表前 360、468 和 720 时的费用。因此，你只需要加上额外的费用。\n\n实际上，`else if` 是你所熟悉知识的变体。例如，程序的内核只是另一种写法：\n\
  \n点击此处查看代码图像\n\n```c\nif (kwh <= BREAK1)\n    bill = RATE1 * kwh;\nelse\n    if\
  \ (kwh <= BREAK2)  // kwh 在 360 和 468 之间\n        bill = BASE1 + (RATE2 * (kwh -\
  \ BREAK1));\n    else\n    if (kwh <= BREAK3)  // kwh 在 468 和 720 之间\n        bill\
  \ = BASE2 + (RATE3 * (kwh - BREAK2));\n    else  // kwh 超过 680\n        bill = BASE3\
  \ + (RATE4 * (kwh - BREAK3));\n```\n\n也就是说，程序由一个 `if else` 语句组成其 `else` 部分的语句是另一个\
  \ `if else` 语句。第二个 `if else` 语句被认为*嵌套*在第一个内部，而第三个嵌套在第二个内部。记住整个 `if else` 结构算作单一语句，这就是为什么我们不需要用大括号包裹嵌套的\
  \ `if else` 语句。然而，使用大括号可以明确这种特定格式的意图。\n\n\n\n\n这两种形式是完全等价的。唯一的区别在于空格和换行符的位置，而编译器会忽略这些差异。尽管如此，第一种形式更好，因为它更清晰地展示了你正在进行四选一的选择。这种形式更容易快速浏览程序并查看各种选项。将嵌套缩进留到需要时使用——例如，当你必须测试两个独立的变量时。这种情况的一个例子是：在夏季期间对超过\
  \ 720 千度的电量收取 10% 的附加费用。\n\n你可以根据需要连接任意多个 `else if` 语句（当然是在编译器的范围内），如下片段所示：\n\n\
  ```c\nif (score < 1000)\n    bonus = 0;\nelse if (score < 1500)\n    bonus = 1;\n\
  else if (score < 2000)\n    bonus = 2;\nelse if (score < 2500)\n    bonus = 4;\n\
  else\n    bonus = 6;\n```\n\n（这可能是游戏程序的一部分，其中 `bonus` 代表你在下一回合中获得额外的光子弹或食物丸的数量。）\n\
  \n说到编译器限制，C99 标准要求编译器至少支持 127 级嵌套。\n\n### 将 else 与 if 配对\n\n当你有大量的 `if` 和 `else`\
  \ 时，计算机是如何如何决定哪个 `if` 对应哪个 `else` 的？例如，考虑以下程序片段：\n\n点击此处查看代码图像\n\n```c\nif (number\
  \ > 6)\n    if (number < 12)\n        printf(\"You're close!\\n\");\nelse\n    printf(\"\
  Sorry, you lose a turn!\\n\");\n```\n\n什么时候会打印 `Sorry, you lose a turn!`？是在 `number`\
  \ 小于或等于 `6` 时，还是当 `number` 大于 `12` 时？换句话说，`else` 是对应第一个 `if` 还是第二个？答案是，`else`对应第二个\
  \ `if`。也就是说，你会得到这些响应：\n\n![Image](img/257tab01.jpg)\n\n规则是：`else` 与离它最近的那个 `if`\
  \ 配对，除非大括号另有说明（参见图 7.2）。\n\n![Image](img/07fig02.jpg)\n\n图 7.2 `if else` 配对的规则。\n\
  \n注意：将倒数第二个“do this;”缩进两个空格，并用分号结束最后一个“do this”操作。将 `}` 和 `{` 向左移动两个空格。\n\n第一个示例的缩进使其看起来像是\
  \ `else` 对应第一个 `if`，但记住编译器会忽略缩进。如果你真的想让 `else` 对应第一个 `if`，你可以这样写这个片段：\n\n点击此处查看代码图像\n\
  \n```c\nif (number > 6)\n{\n    if (number < 12)\n        printf(\"You're close!\\\
  n\");\n}\nelse\n    printf(\"Sorry, you lose a turn!\\n\");\n```\n\n现在你将得到这些响应：\n\
  \n![Image](img/259tab01.jpg)\n\n### 更多嵌套的 if\n\n你已经看到 `if...else if...else` 序列是嵌套\
  \ `if` 的形式，用于从一系列替代方案中进行选择。另一种嵌套 `if` 用于当选择某个特定选项后会导致额外的选择时。例如，程序可以使用 `if else`\
  \ 来区分男性和女性。`if else` 内部的每个分支可以再包含另一个 `if else` 以区分不同的收入群体。\n\n让我们把这种形式嵌套 `if` 应用于以下问题：给定一个整数，打印所有能整除它的整数；如果没有除数，则报告该数字为质数。\n\
  \n在编写代码之前，这个问题需要你先进行思考。首先，你需要对程序进行整体设计。为了方便，程序应该使用循环来让你能够输入要测试的数字。这样，你每次想检查新数字时就不需要重新运行程序。我们已经为这种循环开发了一个模型：\n\
  \n点击此处查看代码图像\n\n```\nprompt user\nwhile the scanf() return value is 1\n    analyze\
  \ the number and report results\n    prompt user\n```\n\n记住，通过在循环测试条件中使用 `scanf()`，程序会尝试读取数字并检查循环是否应该终止。\n\
  \n接下来，你需要一个寻找约数的计划。也许最明显的方法是这样的：\n\n点击此处查看代码图像\n\n```c\nfor (div = 2; div < num;\
  \ div++)\n    if (num % div == 0)\n        printf(\"%d is divisible by %d\\n\",\
  \ num, div);\n```\n\n遗憾的是，这种方法非常浪费时间。你可以做得更好。例如，寻找 144 的约数。如果你发现 144 能被 2 整除，你也发现它能被\
  \ 72 整除。然后是 3, 48；4, 36；6, 24；8, 18；9, 16；12, 12。一旦到达 12，你就可以停止了，因为你已经测试了所有配对。\n\
  \n\n\n\nListing 7.5 包含了所有这些思想。为了扩展范围，程序使用了 `long` 类型代替 `int` 类型。（如果你的系统不支持 `_Bool`\
  \ 类型，你可以用 `int` 类型代替 `isPrime`，并用 `1` 和 `0` 替替 `true` 和 `false`。）\n\nListing 7.5\
  \ `divisors.c` 程序\n\n点击此处查看代码图片\n\n```c\n// divisors.c -- 嵌套 if 显示数字的因数\n\n#include\
  \ <stdio.h>\n#include <stdbool.h>\n\nint main(void)\n{\n    unsigned long num; \
  \         // 要检查的数字\n    unsigned long div;          // 潜在的因数\n    bool isPrime;\
  \               // 质数标记\n    printf(\"Please enter an integer for analysis; \");\n\
  \    printf(\"Enter q to quit.\\n\");\n    while (scanf(\"%lu\", &num) == 1)\n \
  \   {\n        for (div = 2, isPrime = true; (div * div) <= num; div++)\n      \
  \  {\n            if (num % div == 0)\n            {\n                if ((div *\
  \ div) != num)\n                {\n                    printf(\"%lu is divisible\
  \ by %lu and %lu.\\n\",\n                           num, div, num / div);\n    \
  \            }\n                else\n                    printf(\"%lu is divisible\
  \ by %lu.\\n\",\n                           num, div);\n                isPrime=\
  \ false; // 该数不是质数\n            }\n        }\n        if (isPrime)\n           \
  \ printf(\"%lu is prime.\\n\", num);\n        printf(\"Please enter another integer\
  \ for analysis; \");\n        printf(\"Enter q to quit.\\n\");\n    }\n    printf(\"\
  Bye.\\n\");\n    return 0;\n}\n```\n\n注意，程序在 `for` 循环的控制表达式使用了逗号运算符，以便为每个新输入的数字将\
  \ `isPrime` 初始化为 `true`。\n\n这里是一个示例运行：\n\n点击此处查看代码图片\n\nPlease enter an integer\
  \ for analysis; Enter q to quit.\n123456789\n123456789 is divisible by 3 and 41152263.\n\
  123456789 is divisible by 9 and 13717421.\n123456789 is divisible by 3607 and 34227.\n\
  123456789 is divisible by 3803 and 32463.\n123456789 is divisible by 10821 and 1409.\n\
  Please enter another integer for analysis; Enter q to quit.\n149\n149 is prime.\n\
  Please enter another integer for analysis; Enter q to quit.\n2013\n2013 is divisible\
  \ by 3 and 67.\n2013 is divisible by 1 and 183.\n2013 is divisible by 33 and 61.\n\
  Please enter another integer for analysis; Enter q to quit.\nq\nBye.\n\n程序将将 1 识别为质数，从技术上讲，它确实是。下一节将出现的逻辑运算符将让你能够从列表中排除\
  \ 1。\n\n## 总结：使用 if 语句进行选择\n\n**关键字：** `if`, `else`\n\n**通用注释：** 在接下来的每种形式中，语句可以是简单语句，也可以是复合语句。真表达式是指非零值的表达式。\n\
  \n**形式 1：**\n```c\nif (expression)\n    statement\n```\n如果 `expression` 为真，则执行 `statement`。\n\
  \n**形式 2：**\n```c\nif (expression)\n    statement1\nelse\n    statement2\n```\n\
  如果 `expression` 为真，则执行 `statement1`。否则，执行 `statement2`。\n\n**形式 3：**\n```c\nif (expression1)\n\
  \    statement1\nelse if (expression2)\n    statement2\nelse\n    statement3\n```\n\
  如果 `expression1` 为真，则执行 `statement1`。如果 `expression1` 为假但 `expression2` 为真，则执行 `statement2`。否则，如果两个表达式都假，则执行\
  \ `statement3`。\n\n**示例：**\n点击此处查看代码图片\n```c\nif (legs == 4)\n    printf(\"It might\
  \ be a horse.\\n\");\nelse if (legs > 4)\n    printf(\"It is not a horse.\\n\");\n\
  else /* legs < 4 的情况 */\n{\n    legs++;\n    printf(\"Now it has one leg.\\n\");\n\
  }\n```\n\n## 让我们进入逻辑世界\n\n你已经看到 `if` 和 `while` 语句经常使用关系表达式作为测试。有时，你会发现结合两个或多个关系表达式是很有用的。例如，假设你想要一个程序来统计输入中除单引号或双引号以外的字符出现的次数。你可以使用逻辑运算符来满足这一需求，并可以使用句号字符\
  \ `.` 来识别句子的结束。Listing 7.6 提供了一个说明这种方法的简短程序。\n\nListing 7.6 `chcount.c` 程序\n\n点击此处查看代码图片\n\
  \n```c\n// chcount.c -- 使用逻辑与 统计非引号字符\n#include <stdio.h>\n#define '.'\n\nint main(void)\n\
  {\n    char ch;\n    int charcount = 0;\n    while ((ch = getchar()) != PERIOD)\n\
  \    {\n        if (ch != '\"' && ch != '\\'')\n            charcount++;\n    }\n\
  \    printf(\"There are %d non-quote characters.\\n\", charcount);\n    return 0;\n\
  }\n```\n\n以下是一个示例运行：\n\n点击此处查看代码图片\nI didn't read the \"I'm a Fool\" best seller.\n\
  There are 50 non-quote characters.\n\n\n\n\n((a > b) && (b > c)) || (b > d)\n\n\
  也就是说，`b` 位于 `a` 和 `c` 之间，或者 `b` 大于 `d`。\n\n许多程序员会使用括号（如第二个版本所示），尽管它们并不是必须的。这样，即使读者不完全记得逻辑运算符的优先级，代码的含义也是清晰的。\n\
  \n### 求值顺序\n\n除了两个运算符共享一个操作数的情况外，C  通常不保证复杂表达式中的哪些部分先求值。例如，在以下语句中，表达式 `5 + 3` 可能在\
  \ `9 + 6` 之前求值，也可能在之后求值：\n\n```\napples = (5 + 3) * (9 + 6);\n```\n\n这种歧义被留在语言中是为了让编译器设计师能够为特定系统做出最有效的选择。该规则（或由于缺乏规则）的唯一例外是对逻辑运算符的处理。C\
  \ 保证逻辑表达式从左到右求值。`&&` 和 `||` 运算符是序列点（sequence points），因此所有的副作用都会在程序移动到下一个操作数之前发生。此外，它还保证一旦发现使整个表达式无效的元素，求值就会停止。这些保证使得使用如下构造成为可能：\n\
  \n点击此处查看代码图像\n\n```\nwhile ((c = getchar()) != ' ' && c != '\\n')\n```\n\n这种构造建立了一个循环，读取字符直到遇到第一个空格或换行符。第一个子表达式给\
  \ `c` 赋了一个值，然后这个值在第二个子表达式中使用。如果没有顺序保证，计算机可能会在查明 `c` 的取值之前尝试测试第二个表达式。\n\n这里是另一个例子：\n\
  \n点击此处查看代码图像\n\n```\nif (number != 0 && 12/number == 2)\n    printf(\"The number\
  \ is 5 or 6.\\n\");\n```\n\n如果 `number` 的值为 `0`，则第一个子表达式为假，关系表达式将不再继续求值。这避免了计算机尝试除以零的灾难。许多语言并没有这个特性。在看到\
  \ `number` 为 `0` 之后，它们仍然会径直向前地检查下一个条件。\n\n最后，考虑这个示例：\n\n点击此处查看代码图像\n\n```\nwhile\
  \ ( x++ < 10 && x + y < 20)\n```\n\n`&&` 运算符是一个序列点这一事实保证了在求值右侧表达式之前，`x` 会递增。\n\n\
  ***\n\n### 总结：逻辑运算符与表达式\n\n**逻辑运算符：**\n\n逻辑运算符通常以关系表达式作为操作数。`!` 运算符接受一个操作数。其余的接受两个——左侧一个，右侧一个。\n\
  \n![图像](img/267tab01.jpg)\n\n**逻辑表达式：**\n\n`expression1 && expression2` 当且仅当两个表达式都为真时为真。`expression1\
  \ || expression2` 在其中一个或两个表达式为真时为真。`!expression` 在表达式为假时为真，反之亦然。\n\n**求值顺序：**\n\n\
  逻辑表达式从左到右求值。一旦发现使表达式为假的内容，求值就会停止。\n\n**示例：**\n\n![图像](img/267tab02.jpg)\n\n***\n\
  \n### 范围\n\n你可以使用 `&&` 运算符来测试范围。例如，要测试 `score` 是否在 90 到 100 范围内，你可以这样做：\n\n点击此处查看代码图像\n\
  \n```\nif (range >= 90 && range <= 100)\n    printf(\"Good show!\\n\");\n```\n\n\
  避免模仿常见的数学表示法是非常重要的，如下所示：\n\n点击此处查看代码图像\n\n```\nif (90 <= range <= 100)   // 不！不要这样做！\n\
  \    printf(\"Good show!\\n\");\n```\n\n问题在于该代码是一个语义错误，而不是语法错误，因此编译器不会捕捉捕获它（尽管它可能会发出警告）。由于\
  \ `<=` 运算符的求值顺序是从左到右的，测试表达式被解释为：\n\n`(90 <= range) <= 100`\n\n子表达式 `90 <= range`\
  \ 的值要么为 `1`（真），要么为 `0`（假）。任何一个值都小于 100，因此整个表达式始终为真，无论 `range` 的值是多少。所以请使用 `&&` 来测试范围。\n\
  \n许多代码使用范围测试来检查字符是否（例如）小写字母。例如，假设 `ch` 是一个 `char` 变量：\n\n点击此处查看代码图像\n\n```\nif (ch\
  \ >= 'a' && ch <= 'z')\n    printf(\"That's a lowercase character.\\n\");\n```\n\
  \n这对于像 ASCII 这样的编码有效，其中连续字母的编码是连续的数字。然而，对于某些编码（包括 EBCDIC）并非如此。进行这种测试更具移植性的方法是使用\
  \ `ctype.h` 族函数。\n\n### 单词计数程序\n\n现在你拥有了工具来编写一个单词计数程序（即一个读取输入并报告发现的单词数的程序）。让我们看看涉及什么。\n\
  \n首先，程序应该读取字符并通过某种方式停止。这里是伪代码表示：\n\n点击此处查看代码图像\n\n```\n读取字符\n当有更多输入时\n    增加字符计数\n\
  \    如果读取了行，增加行计数\n    如果读取了单词，增加单词计数\n```\n\n***\n\n现在考虑循环体。你已经有了输入循环：\n\n点击此处查看代码图像\n\
  \n```\nwhile ((c = getchar()) != STOP)\n{\n    ...\n}\n```\n\n在这里，`STOP` 代表 `ch`\
  \ 的某个值。示例到为止使用了换行符和句号作为此目的，但对于通用的单词计数程序并不理想。在第 8 章，我们将展示一个更好的解决方案，该方案不仅适用于键盘输入，也适用于文本文件。由于程序使用\
  \ `getchar()` 获取输入，可以通过在每次循环增加计数器来数字符。为了数行，程序可以检查换行符。如果字符是换行符，程序应该增加计数。要决定的问题是，如果\
  \ `STOP` 字符出现在行中间怎么办。这算作一行吗？一个答案是将其算作部分行——即有字符但没有换行的行。你可以通过跟踪上一个字符来识别这种情况。\n\n最棘手的是识别单词。首先，你必须定义什么是单词。让我们采取一种相对简单的方法，将单词定义为不包含空白字符的字符序列（即没有空格、制表符或换行符）。因此，“glymxck”和“r2d2”是单词。单词在程序首次遇到非空白时开始，并在遇到下一个空白字符时结束。这里是检测非空白的最直观的测试表达式：\n\
  \n```\nc != ' ' && c != '\\n' && c != '\\t'   /* 如果 c 不是空白字符则为真 */\n```\n\n而检测空白的最直观的测试是\n\
  \n\n\n\n\n```c\nc == ' ' || c == '\\n' || c == '\\t'   /* true if c is whitespace\
  \ */\n```\n\n然而，使用 `ctype.h` 中的函数 `isspace()` 更加简单，如果其参数是空白字符，它返回 `true`。因此，如果 `c`\
