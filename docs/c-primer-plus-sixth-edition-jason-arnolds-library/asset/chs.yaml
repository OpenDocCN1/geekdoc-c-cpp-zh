  \ ch;\n}\n\nchar get_first(void)\n{\n    int ch;\n    ch = getchar();          \
  \ /* 读取下一个字符 */\n    while (getchar() != '\\n')\n        continue;            /*\
  \ 跳过行剩余部分 */\n    return ch;\n}\n```\n\n### 混合字符与数字输入\n\n创建菜单提供了另一个示例，说明了字符输入与数字输入混合如何会导致问题。例如，假设\
  \ `count()` 函数（选项 `c`）如下所示：\n\n点击此处查看代码图像\n\n```c\nvoid count(void)\n{\n    int\
