  {\n    case constant1:\n        statements     <--可选\n    case constant2:\n    \
  \    statements     <--可选\n    default :                <--可选\n        statements\
  \     <--可选\n}\n```\n\n### 仅读取行的第一个字符\n\n整合到 `animals.c` 中的另一个新功能是它是如何读取输入的。正如你可能在示例运行中注意到的那样，当输入\
  \ `dab` 时，只有第一个字符被处理了。这种丢弃行内其余部分的行为在寻找单个字符响应的交互式程序中通常是理想的。以下代码产生了这种行为：\n\n点击此处查看代码图片\n\
  \n```c\nwhile (getchar() != '\\n')\n    continue;           /* 跳过输入行的剩余部分 */\n```\n\
  \n此循环从输入中读取字符，直到并包括回车键生成的换行符。注意，函数的返回值没有赋值给 `ch`，因此字符仅仅被读取并丢弃了。由于最后一个丢弃的字符是换行符，因此下一个要读取的字符是下一行的第一个字符。它被\
  \ `getchar()` 读取并赋值给外层 `while` 循环中的 `ch`。\n\n假设用户一开始就按回车，导致遇到的第一个字符是换行符。以下代码处理了这种情况：\n\
  \n```c\nif (ch == '\\n')\n    continue;\n```\n\n### 多标签\n\n你可以为给定的语句使用多个 `case`\
  \ 标签，如列表 7.12 所示。\n\n#### 列表 7.12 vowels.c 程序\n\n点击此处查看代码图片\n\n```c\n// vowels.c\
  \ -- multiple labels\n#include <stdio.h>\nint main(void)\n{\n    char ch;\n    int\
  \ a_ct, e_ct, i_ct, o_ct, u_ct;\n    a_ct = e_ct = i_ct = u_ct = 0;\n    printf(\"\
  Enter some text; # to quit.\");\n    while ((ch = getchar()) != '#')\n    {\n  \
  \      switch (ch)\n        {\n            case 'a':\n            case 'A': a_ct++;\n\
  \            break;\n            case 'e':\n            case 'E': e_ct++;\n    \
  \        break;\n            case 'i':\n            case 'I': i_ct++;\n        \
  \    break;\n            case 'o':\n            case 'O': o_ct++;\n            break;\n\
  \            case 'u':\n            case 'U': u_ct++;\n            break;\n    \
  \        default: break;\n        }\n    }\n    printf(\"vowels: %d %d %d %d %d\\\
  n\", a_ct, e_ct, i_ct, o_ct, u_ct);\n    return 0;\n}\n```\n\n*(注：由于提供的原文文本后半部分存在大量重复和乱码，以上已根据\
  \ C 语言语法逻辑进行了去重还原翻译。)*\n\n\n\n为了使上述语句生效，函数必须包含另一个带有 `part2` 标签的语句。这是通过以标签名称开头并在其后跟一个冒号来实现：\n\
  \n点击此处查看代码图片\n\n```c\npart2: printf(\"Refined analysis:\\n\");\n```\n\n#### 避免 goto\n\
  \n从原则上说，在 C 程序中永远不需要使用 `goto` 语句，但如果你有旧版本 FORTRAN 或 BASIC 的背景（这两者都要求使用 `goto`），你可能已经养成了依赖于使用\
  \ `goto` 的编程习惯。为了帮助你克服这种依赖，我们将列出一些常见的 `goto` 情况，然后向你展示一种更符合 C 语言的方法：\n\n![Image](img/squf.jpg)\
  \ 处理需要多于一条语句的 `if` 情况：\n\n```c\nif (size > 12)\n    goto a;\ngoto b;\n\na: cost\
  \ = cost * 1.05;\nflag = 2;\n\nb: bill = cost * flag;\n```\n\n在旧式的 BASIC 和 FORTRAN\
  \ 中，只有紧跟 `if` 条件的单个语句会与 `if` 关联。它没有为块或复合语句提供规定。我们将该模式翻译成了等效的 C 语言。标准的 C 方法使用复合语句或块要容易理解得多：\n\
  \n```c\nif (size > 12)\n{\n    cost = cost * 1.05;\n    flag = 2;\n}\nbill = cost\
  \ * flag;\n```\n\n![Image](img/squf.jpg) 从两种替代方案中选择：\n\n```c\nif (ibex > 14)\n \
  \   goto a;\nsheds = 2;\ngoto b;\n\na: sheds= 3;\nb: help = 2 * sheds;\n```\n\n\
  使用 `if else` 结构允许 C 语言能够更简洁地表达这种选择：\n\n```c\nif (ibex > 14)\n    sheds = 3;\nelse\n\
  \    sheds = 2;\nhelp = 2 * sheds;\n```\n\n事实上，新版本的 BASIC 和 FORTRAN 已经将 `else` 并入了它们的语法中。\n\
  \n![Image](img/squf.jpg) 设置一个不定循环：\n\n```c\nreadin: scanf(\"%d\", &score);\nif (score\
  \ < O)\n    goto stage2;\nlots of statements\ngoto readin;\n\nstage2: more stuff;\n\
  ```\n\n使用 `while` 循环代替：\n\n```c\nscanf(\"%d\", &score);\nwhile (score <= 0)\n{\n\
  \    lots of statements\n    scanf(\"%d\", &score);\n}\nmore stuff;\n```\n\n![Image](img/squf.jpg)\
  \ 跳到循环末尾并开始下一个周期。使用 `continue` 代替。\n\n![Image](img/squf.jpg) 退出循环。使用 `break` 代替。实际上，`break`\
  \ 和 `continue` 是 `goto` 的特殊形式。使用它们的优点是，它们的名称告诉了它们应该做什么，而且因为它们不使用标签，所以没有将标签放在错误位置的危险。\n\
  \n![Image](img/squf.jpg) 疯狂地跳到程序的不同部分。简而言之，不要这么做！\n\n许多 C 实践者容忍一种 `goto` 用法——当出现问题时跳出嵌套循环（单个\
  \ `break` 只能让你退出最内层循环）：\n\n点击此处查看代码图片\n\n```c\nwhile (funct > 0)\n    {\n    for\
  \ (i = 1, i <= 100; i++)\n        {\n            for (j = 1; j <= 50; j++)\n   \
  \             {\n                    statements galore;\n                if (bit\
  \ trouble)\n                    goto help;\n                statements;\n      \
  \          }\n            more statements;\n        }\n    yet more statements;\n\
  \    }\nand more statements;\n\nhelp : bail out;\n```\n\n你可以从其他示例中看出，替代形式比 `goto`\
  \ 形式更清晰。当你混合了几种情况时，这种差异会变得更大。哪些 `goto` 是在帮助 `if`，哪些是在模拟 `if else`，哪些是在控制循环，而哪些仅仅是因为你把自己写得太深陷入了死胡同？通过过度使用\
  \ `goto`，你创建了一个程序流迷宫。如果你不熟悉 `goto`，就保持现状。如果你习惯了使用它们，尝试训练自己不要使用。讽刺的是，并不需要 `goto`\
  \ 的 C 语言拥有比大多数语言更好的 `goto`，因为它允许你使用描述性单词作为标签，而不是数字。\n\n***\n\n### 总结：程序跳转\n\n**关键词：**\n\
  \n`break`, `continue`, `goto`\n\n**通用注释：**\n\n这三条指令会导致程序流从程序的一个位置跳转到另一个位置。\n\n**`break`\
  \ 命令：**\n\n`break` 命令可以用于三种循环形式之一以及 `switch` 语句。它导致程序控制跳过循环或包含它的 `switch` 的剩余部分，并从循环或\
  \ `switch` 之后的下一个命令继续执行。\n\n**示例：**\n\n点击此处查看代码图片\n\n```c\nswitch (number)\n{\n\
  \    case 4:  printf(\"That's a good choice.\\n\");\n    case 5:  printf(\"That's\
  \ a fair choice.\\n\");\n    default: printf(\"That's a poor choice.\\n\");\n}\n\
  ```\n\n**`continue` 命令：**\n\n`continue` 命令可以用于三种循环形式，但不能用于 `switch`。它导致程序控制跳过循环中的剩余语句。对于\
  \ `while` 或 `for` 循环，开始下一个周期。对于 `do while` 循环，开始下一个周期。\n\n**示例：**\n\n点击此处查看代码图片\n\
  \n```c\nwhile ((ch = getchar()) != '\\n')\n{\n    if (ch == ' ')\n        continue;\n\
  \    putchar(ch);\n    count++;\n}\n```\n这段代码显示并计数非空格。\n\n**`goto` 命令：**\n\n`goto`\
  \ 语句导致程序控制跳转到带有标签的语句。冒号用于分离标记语句。标签名称遵循变量命名规则。标记语句可以出现在 `goto` 之前或之后。\n\n**形式：**\n\
  \n```c\ngoto label;\n```\n\n示例：\n\n```c\ntop : ch = getchar();\n\nif (ch != 'y')\n\
  \    goto top;\n```\n\n***\n\n### 核心概念\n\n智能的一个方面根据情况调整反应。因此，选择语句是开发智能程序的基础。在 C\
  \ 语言中，`if`、`if else` 和 `switch` 语句以及条件运算符 (`?:`) 实现了选择。\n\n`if` 和 `if else` 语句使用测试条件来决定执行哪些语句。任何非零值都被视为\
  \ `true`，而零被视为 `false`。通常，测试涉及关系表达式（比较两个值）和逻辑表达式（使用逻辑运算符组合或修改其他表达式）。\n\n需要记住的一个通用原则是，如果你想测试两个条件，你应该使用逻辑运算符结合两个完整的测试表达式。例如，以下两种尝试都是失败的：\n\
  \n点击此处查看代码图片\n\n```c\nif (a < x < z) // 错误——没有逻辑运算符\n```\n\n...\n\n```c\nif (ch\
  \ != 'q' && != 'Q') // 错误——缺少完整的测试\n```\n\n...\n\n记住，正确的方法是使用逻辑运算符连接两个关系表达式：\n\n\
  点击此处查看代码图片\n\n```c\nif (a < x && x < z) // 使用 && 组合两个表达式\n```\n\n\n\n本章介绍了许多需要复习的主题，让我们现在开始吧。`if`\
  \ 语句使用一个测试条件来控制程序是否执行测试条件之后的单个简单语句或块。如果测试表达式的值为非零，则执行语句；如果值为 0，则不执行。`if else` 语句允许你从两种备选方案中进行选择。如果测试条件为非零，则执行\
  \ `else` 之前的语句。如果测试表达式的值为 0，则执行 `else` 之后的语句。通过在 `else` 后面紧跟另一个 `if` 语句，你可以建立一个在系列备选方案之间进行选择的结构。\n\
  \n测试条件通常是一个`关系表达式`——即使用一个关系运算符（如 `<` 或 `==`）构造的表达式。通过使用 C 语言的逻辑运算符，你可以组合关系表达式创建创建复杂的测试。\n\
  \n`条件运算符`（`? :`）创建一个表达式，在许多情况下，它提供了比 `if else` 语句更紧凑的替代方案。\n\n`ctype.h` 系列的字符函数（如\
  \ `isspace()` 和 `isalpha()`）为根据字符分类创建测试表达式提供了方便的工具。\n\n`switch` 语句允许你从一组带有整数值标签的语句中进行选择。如果\
  \ `switch` 关键字后面测试条件的整数值与某个标签匹配，则执行执行带有该标签的语句。随后，执行将继续通过标记语句之后的语句，除非你使用了 `break`\
  \ 语句。\n\n最后，`break`、`continue` 和 `goto` 是跳转语句，它们会导致程序流跳转到程序的另一个位置。`break` 语句会导致程序跳转到包含该\
  \ `break` 的循环或 `switch` 结束后的下一个语句。`continue` 语句会导致程序跳过所在循环的剩余部分并开始下次循环。\n\n### 复习题\n\
