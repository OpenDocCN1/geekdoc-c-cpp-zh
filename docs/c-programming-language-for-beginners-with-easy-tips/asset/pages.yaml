  md: '# Preprocessor directives


    Preprocessor directives are lines included in the code of our programs that are
    not program statements but directives for the preprocessor. These lines are always
    preceded by a hash sign (#). The preprocessor is executed before the actual compilation
    of code begins, therefore the preprocessor digests all these directives before
    any code is generated by the statements.


    Preprocessor directives extend only across a single line of code. As soon as a
    newline character is found, the preprocessor directive is considered to end. Semicolon
    (;) is expected at the end of a preprocessor directive. The only way a preprocessor
    directive can extend through more than one line is by preceding the newline character
    at the end of the line by a backslash (\)


    # macro definitions (#define, undef)


    To define preprocessor macros we can use #define. Its format is:


    ```

    #define identifier replacement

    ```


    When the preprocessor encounters this, it replaces any occurrence of identifier
    in the rest of the code by replacement. This replacement can be an expression,
    a statement, a block or simply anything. The preprocessor does not understand
    C++, it simply replaces any occurrence of identifier by replacement.


    ```

    #define TABLE_SIZE 100


    int table1[TABLE_SIZE];

    int table2[TABLE_SIZE];

    ```


    After the preprocessor has replaced TABLE_SIZE, the code becomes equivalent to:


    ```

    int table1[100];


    int table2[100];

    ```


    This use of #define as constant definer is already known by us from previous tutorials,
    but #define can work also with parameters to define function macros:'
