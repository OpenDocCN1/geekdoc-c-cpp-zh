    # CRITICAL SKILL 10.8: Pointers to Derived Types


    Before moving on to virtual functions and polymorphism, it is necessary to discuss
    an important aspect of pointers. Pointers to base classes and derived classes
    are related in ways that other types of pointers are not. In general, a pointer
    of one type cannot point to an object of another type. However, base class pointers
    and derived objects are the exceptions to this rule. In C++, a base class pointer
    can also be used to point to an object of any class derived from that base. For
    example, assume that you have a base class called B and a class called D, which
    is derived from B. Any pointer declared as a pointer to B can also be used to
    point to an object of type D. Therefore, given


