  md: '# Why Data Types Are Important


    The data type of a variable is important because it determines the operations
    that are allowed and the range of values that can be stored. C++ defines several
    types of data, and each type has unique characteristics. Because data types differ,
    all variables must be declared prior to their use, and a variable declaration
    always includes a type specifier. The compiler requires this information in order
    to generate correct code. In C++ there is no concept of a “type-less” variable.


    A second reason is that data types are important to C++ programming is that several
    of the basic types are closely tied to the building blocks upon which the computer
    operates: bytes and words. Thus, C++ lets you operate on the same types of data
    as does the CPU itself. This is one of the ways C++ enables you to write very
    efficient, system-level code.


    # CRITICAL SKILL 2.1: The C++ Data Types


    C++ provides built-in data types that correspond to integers, characters, floating-point
    values, and Boolean values. These are the ways that data is commonly stored and
    manipulated by a program. As you will see later in this book, C++ allows you to
    construct more sophisticated types, such as classes, structures, and enumerations,
    but these too are ultimately composed of the built-in types.


    At the core of the C++ type system are the seven basic data types shown here:


    | Type | Meaning |

    |---|---|

    | char | Character |

    | wchar_t | Wide character |

    | int | Integer |

    | float | Floating point |

    | double | Double floating point |

    | bool | Boolean |

    | void | Valueless |'
