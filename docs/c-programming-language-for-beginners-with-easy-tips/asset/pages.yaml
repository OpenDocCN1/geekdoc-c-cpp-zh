  md: '# Functions (II)


    Arguments passed by value and by reference.


    Until now, in all the functions we have seen, the arguments have been passed by
    value. This means when calling a function with parameters, what we have passed
    to the function are copies of their values but never the variables themselves.
    For example, suppose that we called our function addition using the following
    code:


    ```

    int x=5, y=3, z;

    nz = addition ( x , y );

    ```


    We did this in this case to call to function addition passing the values of x
    and y, i.e. 5 and 3 respectively, but not the variables x and y themselves.


    ```

    int addition (int a, int b)

    z = addition ( 5 , 3 );

    ```


    This way, when the function addition is called, the value of its local variables
    a and b become 5 and 3 respectively, but any modification to either a or b within
    the function will not have any effect on the values of x and y outside it, because
    variables x and y were not themselves passed to the function, but only copies
    of their values when the function was called.


    But there might be some cases where we need to manipulate from inside a function
    of an external variable. For that purpose we can use arguments passed by reference,
    as in the function duplicate of the following:


    | passing parameters by reference | x=2, y=6, z=14 |

    | #include <iostream> | |

    | using namespace std; | |

    | void duplicate(int &a, int &b, int &c) | |'
