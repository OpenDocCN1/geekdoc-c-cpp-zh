    If we specify a more restrictive access level like protected, public members of
    the base class are inherited in the derived class. Whereas if we specify the most
    restricting of all access levels: private, all the base class members are inherited
    as private.


    For example, if daughter was a class derived from mother that we defined as:


    ```

    class daughter: protected mother;

    ```


    This would set the maximum access level for the members of daughter that it inherited
    from mother. That is, all members that were in public would become protected in
    daughter. Of course, this would not restrict daughter to declare its own public
    members. That maximum access level is only set for the members inherited from
    mother.


    If we do not specify any access level for the inheritance, the compiler assumes
    private for classes declared with class keyword and public for those declared
    with struct.


    # What is inherited from the base class?


    In principle, a derived class inherits every member of a base class except:


    ```

    its constructor and its destructor

    its operator()= members

    its friends

    ```'
