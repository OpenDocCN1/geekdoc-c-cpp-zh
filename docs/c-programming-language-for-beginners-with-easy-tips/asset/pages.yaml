  md: '# Programming


    Central to C++ is object-oriented programming (OOP). As just explained, OOP was
    the impetus for the creation of C++. Because of this, it is useful to understand
    OOP’s basic principles before you write even a simple C++ program.


    Object-oriented programming took the best ideas of structured programming and
    combined them with several new concepts. The result was a different and better
    way of organizing a program. In the most general sense, a program can be organized
    in one of two ways: around its code (what is happening) or around its data (who
    is being affected). Using only structured programming techniques, typically organized
    around code. This approach can be thought of as “code acting on data.”


    Object-oriented programs work the other way around. They are organized around
    data, with the key principle being “data controlling access to code.” In an object-oriented
    language, you define the data and the routines that are permitted to act on that
    data. Thus, a data type defines precisely what sort of operations can be applied
    to that data.


    To support the principles of object-oriented programming, all OOP languages, including
    C++, have three traits in common: encapsulation, polymorphism, and inheritance.
    Let’s examine each.


    # Encapsulation


    Encapsulation is a programming mechanism that binds together code and the data
    it manipulates, and keeps that safe from outside interference and misuse. In an
    object-oriented language, code and data can be bound together in a way that a
    self-contained black box is created. Within the box are all necessary data and
    code. When code and data are linked together in this fashion, an object is created.
    In other words, an object is the device that supports encapsulation.'
