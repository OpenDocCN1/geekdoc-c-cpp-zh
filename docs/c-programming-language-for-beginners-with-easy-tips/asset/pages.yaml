  md: '# Ask the Expert


    **Q:** Why does C++ specify only minimum ranges for its built-in types rather
    than stating these precisely?


    **A:** By not specifying precise ranges, C++ allows each compiler to optimize
    the data types for the execution environment. This is part of the reason that
    C++ can create high-performance software. The ANSI/ISO C++ standard simply states
    that the built-in types must meet certain requirements. For example, it states
    that an int will “have the natural size suggested by the architecture of the execution
    environment.” Thus, in a 32-bit environment, an int will be 32 bits long. An int
    will be 16 bits long. It would be an inefficient and unnecessary burden to force
    a 16-bit compiler to implement with a 32-bit range, for example. C++’s approach
    avoids this. Of course, the C++ standard does specify a minimum range for the
    built-in types that will be available in all environments. Thus, if you write
    your programs in such a way that these minimal ranges are not exceeded, your program
    will be portable to other environments. One last point: Each C++ compiler specifies
    the range'
