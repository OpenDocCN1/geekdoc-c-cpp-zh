    C++ solution to this problem is the pure virtual function.


    A pure virtual function is a function declared in a base class that has no definition
    relative to the base. As a result, any derived class must define its own version—it
    cannot simply use the version defined in the base. To declare a pure virtual function,
    use this general form: virtual type func(parameter-list) = 0;


