    rather than error codes. For example, the Java and C# languages rely heavily on
    exceptions, using them to report most types of common errors, such as an error
    opening a file or an arithmetic overflow. Because C++ is derived from C, it uses
    a blend of error codes and exceptions to report errors. Thus, many error conditions
    that relate to C++ library functions are reported using error return codes. However,
