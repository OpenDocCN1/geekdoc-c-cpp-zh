  md: '# Dynamic Memory


    Now, in all our programs, we have only had much memory available as we declared
    for our variables, having the size of all of them to be determined in the source
    code, before the execution of the program. But if we need a variable amount of
    memory that can only be determined during runtime? For example, in the case that
    we need some user input to determine the necessary amount of memory space.


    The answer is *dynamic memory*, for which C++ integrates the operators new and
    delete.


    # Operators new and new[]


    In order to request dynamic memory we use the operator new. new is followed by
    a data type specifier - if a sequence of more than one element is required- the
    number of these within brackets []. It returns a pointer to the beginning of the
    new block of memory allocated. Its form is:


    ```

    pointer = new type

    pointer = new type[number_of_elements];

    ```


    The first expression is used to allocate memory to contain one single element
    of type type. The second one is used to assign a block (an array) of elements
    of type type, where number_of_elements is an integer value representing the amount
    of these. For example:


    ```

    int * bobby;

    bobby = new int [5];

    ```


    In this case, the system dynamically assigns space for five elements of type int
    and returns a pointer to the first element of the sequence, which is assigned
    to bobby. Therefore, now, bobby points to a valid block of memory with space for
    five elements of type int.


    ```

    int* bobby;

    ```'
