    a larger expression, there is an important difference. When an increment or decrement
    operator precedes its operand, C++ will perform the operation prior to obtaining
    the operand''s value for use by the rest of the expression. If the operator follows
    its operand, C++ will obtain the operand''s value before incrementing or decrementing
    it. Consider


