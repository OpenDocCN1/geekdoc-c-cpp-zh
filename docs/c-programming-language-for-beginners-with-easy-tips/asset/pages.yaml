  md: 'There are two types of streams: text and binary. A text stream is used with
    characters. When a text stream is being used, some character translations may
    take place. For example, when the newline character is output, it may be converted
    into a carriage return–linefeed sequence. For this reason, there might not be
    a one-to-one correspondence between what is sent to the stream and what is written
    to the file. A binary stream can be used with any type of data. No character translations
    will occur, and there is a one-to-one correspondence between what is sent to the
    stream and what is actually contained in the file.


    One more concept to understand is that of the current location. The current location
    (also referred to as the current position) is the location in a file where the
    next file access will occur. For example, if a file is 100 bytes long and half
    the file has been read, the next read operation will occur at byte 50, which is
    the current location.


