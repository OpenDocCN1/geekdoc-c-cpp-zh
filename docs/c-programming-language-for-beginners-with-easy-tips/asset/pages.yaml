  md: '# Pointers (&)


    We have already seen how variables are seen as memory cells that can be accessed
    using their identifiers. This way we did not have to care about the physical location
    of our data within memory, we simply used its identifier whenever we wanted to
    refer to our variable.


    The memory of your computer can be imagined as a succession of memory cells, each
    one of the minimal size that computers manage (one). These single-byte memory
    cells are numbered in a consecutive way, so as, within any block of memory, every
    cell has the same number as the previous one.


    This way, each cell can be easily located in the memory because it has a unique
    address and all the memory cells follow a successive pattern. For example, if
    we are looking for cell 1776 we know that it is going to be right between 1775
    and 1777, exactly one thousand cells after 776 and exactly one thousand cells
    before 2776.


    # Reference operator (&)


    As soon as we declare a variable, the amount of memory needed is assigned for
    it at a specific location in memory (memory address). We generally do not actively
    decide the exact location of the variable within the panel of cells that we have
    imagined the memory to - Fortunately, that is a task automatically performed by
    the operating system during runtime. However, in some cases we may be interested
    in knowing the address where our variable is being stored during runtime in order
    to operate with relative positions to it.


    The address that a variable within memory is what we call a reference to that
    variable. The reference to a variable can be obtained by preceding the identifier
    of a variable with an ampersand (&), known as reference operator, and which can
    be literally translated as "address of". For example:


    ```

    ted = &andy;

    ```


    This would assign to ted the address of variable andy, since preceding the name
    of the variable andy with the reference operator (&) we are no longer talking
    about the content of the variable itself, but about its reference (i.e., its address
    in memory).


    From now on we are going to assume that and is placed during runtime memory 1776.
    (1776) is just an arbitrary assignment we are inventing right now in order to
    clarify some concepts in this tutorial, but in reality, we cannot know before
    runtime the real value the address of a variable will have in memory.


    Consider the following code fragment:'
