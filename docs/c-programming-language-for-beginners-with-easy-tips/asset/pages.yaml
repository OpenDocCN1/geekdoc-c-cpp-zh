  md: '# Inheritance


    Inheritance is the process by which one object can acquire the properties of another
    object. This is important because it supports the concept of hierarchical classification.
    If you think about it, most knowledge is manageable by hierarchical (that is,
    top-down) classifications. For example, a Red Delicious apple is part of the classification
    apple, which in turn is part of the fruit class, which is under the larger class
    food. That is, the food class possesses certain qualities (edible, nutritious,
    and so on) which also, logically, apply to its subclass, fruit. In addition to
    those qualities, the fruit class has specific characteristics (juicy, sweet, and
    so on) that distinguish it from other food. The apple class defines those qualities
    specific to an apple (grows on trees, not tropical, and so on). A Red Delicious
    apple would, in turn, inherit all the qualities of preceding classes and would
    define only those qualities that make it unique.


    Without the use of hierarchies, each object would have to explicitly define all
