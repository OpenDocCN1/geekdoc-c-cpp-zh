  md: '# CRITICAL SKILL 2.5: Relational and Logical Operators


    In the terms relational operator and logical operator, relational refers to the
    relationships that values can have with one another, and logical refers to the
    ways in which true and false values can be connected. Since the relational operators
    produce true or false results, they often work with the logical operators. For
    this reason, they will be discussed together here.


    The relational and logical operators are shown in Table 2-4. Notice that in C++,
    not equal is represented by != and equal to is represented by the double equal
    sign, ==. In C++, the outcome of a relational or logical expression produces a
    bool result. That is, the outcome of a relational or logical expression is either
    true or false.


    NOTE: For older compilers, the outcome of a relational or logical expression will
    be an integer value of 0 or 1. This difference is mostly academic, though, because
    C++ automatically converts true into 1 and false into 0, and vice versa as explained
    earlier.


    The operands for a relational operator can be of nearly any type as long as they
    can be meaningfully compared. The operands to the logical operators must produce
    a true or false result. Since any nonzero value is true and zero is false, this
    means that the logical operators can be used with any expression that evaluates
    to a zero or nonzero result. Thus, any expression other than one that has a void
    result can be used.'
