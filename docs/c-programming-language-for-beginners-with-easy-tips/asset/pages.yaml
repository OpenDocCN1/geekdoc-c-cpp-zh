    \ type or class without repeating the entire code for each type.\n\nIn C++ this\
    \ can be achieved using template parameters. A template parameter is a special\
    \ kind of parameter that can be used to pass a type as argument; just like regular\
    \ function parameters can be used to pass values to a function, template parameters\
    \ allow to pass also types to a function. These function templates can use these\
    \ parameters as if they were any other type.\n\nThe format for declaring function\
    \ templates with type parameters is:\n\n```\ntemplate <class identifier> function_declaration;\
    \ template <typename identifier> function_declaration;\n```\n\nThe difference\
    \ between both prototypes is the use of either the keyword class or the keyword\
    \ typename. use is indistinct, since both expressions have exactly the same meaning\
    \ and behave exactly the same way.\n\nFor example, to create a template function\
    \ that returns the greater of two of objects we could use:\n\n```\ntemplate <class\
    \ myType>\n\nmyType GetMax(myType a, myType b) {\n    return (a>b?a:b);\n}\n```\n\
    \nWe have created a template function with myType as its template parameter. This\
    \ template parameter represents a type that has not yet been specified, but that\
    \ can be used in the template function as if it were a regular type. As you can\
    \ see, the function template GetMax returns the greater of two parameters of this"
