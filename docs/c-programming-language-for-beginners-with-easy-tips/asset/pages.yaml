    # Lvalues and Rvalues


    There are two kinds of expressions in C++:


    **lvalue**: Expressions that refer to a memory location is called "lvalue" expression.
    An lvalue may appear as either the left-hand or right-hand side of an assignment.


    **rvalue**: The term rvalue refers to a data value that is stored at some address
    in memory. An rvalue is an expression that cannot have a value assigned to it
    which means an rvalue may appear on the right- but not left-hand side of an assignment.


    Variables are lvalues and so may appear on the left-hand side of an assignment.
