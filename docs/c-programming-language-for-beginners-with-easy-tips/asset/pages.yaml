    # CRITICAL SKILL 11.12: Check I/O system status 37


    Since the beginning of this book you have been using the C++ I/O system, but you
    have been doing so without much formal explanation. Since the I/O system is based
    upon a hierarchy of classes, it was not possible to present its theory and details
    without first discussing classes and inheritance. Now it is time to examine the
    C I/O system in detail. The C++ I/O system is quite large, and it won''t be possible
    to discuss every class, function, or commonly used parts. Specifically, it shows
    how to overload the << and >> operators so that you can input or output objects
    of classes that you design. It describes how to format output and how to use I/O
    manipulators. The module ends by discussing file I/O.


    # Old vs. Modern C++ I/O


    There are currently two versions of the C++ object-oriented I/O library in use:
    the older one that is based upon the original specifications for C++ and the newer
    one defined by Standard C++. The old I/O library is supported by the header file
    <iostream.h>. The new I/O library is supported by the header


