    and benefits. He also adhered to C’s underlying philosophy that the programmer,
    not the language, is in charge. At this point, it is critical to understand that
    Stroustrup did not create an entirely new programming language.


    Instead, he enhanced an already highly successful language.


    Most of the features that Stroustrup added to C were designed to support object-oriented
    programming. In essence, C++ is the object-oriented version of C. By building
    upon the foundation of C, Stroustrup provided a smooth migration path to OOP.
    Instead of having to learn an entirely new language, a C programmer needed to
    learn only a few new features before reaping the benefits of the object-oriented
    methodology.


    When creating C++, Stroustrup knew that it was important to maintain the original
    spirit of C, underlying its efficiency, flexibility, and philosophy, while at
    the same time adding support for object-oriented programming. Happily, his goal
    was accomplished. C++ still provides the programmer with the freedom and control
    of C, coupled with the power of objects.


    Although C++ was initially designed to aid in the management of very large programs,
