    Finally, fstream, inherits its, get and the put pointers, from iostream (which
    is itself derived from both istream and ostream).


    These internal stream pointers that point to the reading or writing locations
    within a stream can be manipulated using the following member functions:


    # tellg() and tellp()


    These two member functions have no parameters and return a value of the member
    type pos_type, which is an integer data type representing the current position
    of the get stream pointer (in the case of tellg) or the put stream pointer (in
    the case of tellp).


    # seekg() and seekp()


    These functions allow us to change the position of the get and put stream pointers.
    Both functions are overloaded with two different prototypes. The first prototype
    is:


    ```

    seekg ( position );

    ```


    ```

    seekp ( position );

    ```


    Using this prototype the stream pointer is changed to the absolute position position
    (counting from the beginning of the file). The type for this parameter is the
    same as the one returned by functions tellg and tellp: the member type pos_type,
    which is an integer value.


    The other prototype for these functions is:


    ```

    seekg ( offset, direction );

    ```


    ```

    seekp ( offset, direction );

    ```


