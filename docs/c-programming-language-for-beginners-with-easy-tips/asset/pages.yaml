  md: 'The C++ I/O system maintains status information about the outcome of each I/O
    operation. The current status of an I/O stream is described in an object of type
    iostate, which is an enumeration defined by ios that includes these members.


    | Name | Meaning |

    | ios::goodbit | No error bits set |

    | ios::eofbit | 1 when end-of-file is encountered; 0 other |

    | ios::failbit | 1 when a (possibly) nonfatal I/O error has occurred; 0 other
    |

    | ios::badbit | 1 when a fatal I/O error has occurred; 0 other |


    There are two ways in which you can obtain I/O status information. First, you
    can call the rdstate( )


    function. It has this prototype:


    iostate rdstate();


    It returns the current status of the error flags. As you can probably guess from
    looking at the preceding list of flags, rdstate() returns goodbit when no error
    has occurred. Otherwise, an error flag is turned on.


    The other way you can determine if an error has occurred is by using one or more
    of these ios member functions:


    +   - bool bad( ); bool eof();


    +   - bool fail( ); bool good();


    The eof( ) function was discussed earlier. The fail( ) function returns true if
    badbit is set. The good( ) function returns true if there are no errors. Otherwise
    they return false.


    Once an error has occurred, it may need to be cleared before your program continues.
    To do this, use the ios member function clear( ), whose prototype is shown here:'
