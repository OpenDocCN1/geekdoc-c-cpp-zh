    # Why Virtual Functions?


    As stated earlier, virtual functions in combination with derived types allow C++
    to support runtime polymorphism. Polymorphism is essential to object-oriented
    programming, because it allows a generalized class to specify those functions
    that will be common to all derivatives of that class, while allowing a derived
    class to define the specific implementation of some or all of those functions.
    Sometimes this idea is expressed as follows: the base class dictates the general
    interface that any object derived from that class will have, but lets the derived
    class define the actual method used to implement that interface. This is why the
    phrase “one interface, multiple methods” is often used to describe polymorphism.


    Part of the key to successfully applying polymorphism is understanding that the
    base and derived classes form a hierarchy, which moves from greater to lesser
    generalization (base to derived). When designed correctly, the base class provides
    all of the elements that a derived class can use directly. It also defines those
    that the derived class must implement on its own. This allows the derived class
    the flexibility to define its own methods, and yet enforces a consistent interface.
    This is, since the form of the interface is defined by the base class, any derived
    class will share that common interface. Thus, the use of virtual functions makes
    it possible for the base class to define the generic interface that will be used
    by all derived classes.


