  md: '# Polymorphism


    Standard Libraries


    Standard C++ consists of three important parts:


    The core language giving all the building blocks including variables, data types
    and literals, etc.


    The C++ Standard Library giving a rich set of functions manipulating files, strings,
    etc.


    The Standard Template Library (STL) giving a rich set of methods manipulating
    data structures, etc.


    The ANSI Standard


    The ANSI standard is an attempt to ensure that C++ is portable; that code you
    write for Microsoft''s compiler will compile without errors, using a compiler
    on a Mac, UNIX, a Windows box, or an Alpha.


    1'
