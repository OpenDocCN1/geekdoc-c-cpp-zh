  md: 'Perhaps the most important of the additional casting operators is the dynamic_cast.
    The dynamic_cast performs a runtime cast that verifies the validity of a cast.
    If at the time dynamic_cast is executed, the cast is invalid, then the cast fails.
    The general form of dynamic_cast is shown here:


    ```

    dynamic_cast<target-type>(expr)

    ```


    Here, target-type specifies the target type of the cast, and expr is the expression
    being cast into the new type. The target type must be a pointer or reference type,
    and the expression being cast must evaluate to a pointer or reference type. Thus,
    dynamic_cast can be used to cast one type of pointer into another or one type
    of reference into another.


    The purpose of dynamic_cast is to perform casts on polymorphic types. For example,
    given two polymorphic classes B and D, with D derived from B, a dynamic_cast can
    always point to a D* pointer into a B* pointer. This is because a base pointer
    can always point to a derived object. But a dynamic_cast can cast a B* pointer
    into a D* only if the object being pointed to actually is a D object. In general,
    dynamic_cast will succeed if the pointer (or reference) is being cast to (or referring
    to) either an object of the target type or an object derived from the target type.
    Otherwise, the cast will fail. If the cast fails, then dynamic_cast evaluates
    types to null if the cast involves pointers. If a dynamic_cast on reference types
    fails, a bad_cast_exception is thrown.


    Here is a simple example. Assume Base is a polymorphic class and Derived is derived
    from Base.


    ```

    Base *bp, b_ob;

    Derived *dp, d_ob;


    bp = &d_ob; // base pointer points to Derived object

    dp = dynamic_cast<Derived *>(bp); // cast to derived pointer OK

    if(dp) cout << "Cast OK";

    ```


