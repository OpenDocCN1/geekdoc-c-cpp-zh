  md: '# CRITICAL SKILL 1.12: Identifiers


    In C++, an identifier is a name assigned to a function, variable, or any other
    user-defined item. Identifiers can be from one to several characters long. Variable
    names can start with any letter of the alphabet or an underscore. Next comes a
    letter, a digit, or an underscore. The underscore can be used to enhance the readability
    of a variable name, as in line_count. Uppercase and lowercase are seen as different;
    that is, to C++, myvar and MyVar are separate names. There is one important identifier
    restriction: you cannot use any of the C++ keywords as identifier names. In addition,
    predefined identifiers such as cout are also off limits.


    Here are some examples of valid identifiers:


    | Test | x | y2 | MaxIncr |

    |---|---|---|---|n| up | _top | my_var | simpleInterest23 |


    Remember, you cannot start an identifier with a digit. Thus, 98OK is invalid.
    Good programming practice dictates that you use identifier names that reflect
    the meaning or usage of the items being named.


