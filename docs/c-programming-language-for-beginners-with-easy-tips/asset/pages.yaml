  md: '# Type Casting


    Converting an expression of a given type into another type is known as *type-casting*.
    We have already seen some ways to type cast:


    # Implicit conversion


    Implicit conversions do not require any operator. They are automatically performed
    when a value is copied to a compatible type. For example:


    ```

    short a=2000;

    int b;

    b=a;

    ```


    The value of a has been promoted from short to int and it is known as a standard
    conversion. Standard conversions affect fundamental data types, and allow conversions
    such as the conversions between numerical types (short to int, to float, double
    to int..), to bool, and some pointer conversions. Some of these may imply a loss
    of precision, which the compiler can signal with a warning. This can be avoided
    with an explicit conversion.


    Implicit conversions also include constructor or operator conversions, which affect
    classes that include specific constructors or operator functions to perform conversions.
    For example:


    ```

    class A {};

    class B { public: B (A a) {} };

    b=a;

    ```


    Here, a implicit conversion happened between objects of class A and class B, because
    B has a constructor *'
