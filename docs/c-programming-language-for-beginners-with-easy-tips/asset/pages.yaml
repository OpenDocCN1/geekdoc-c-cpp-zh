  md: 'In addition to the formatting flags, there are three member functions defined
    by ios that set these additional format values: the field width, the precision,
    and the fill character. The functions that set these values are width( ), precision(
    ), and fill( ), respectively. Each is examined in turn.


    By default, when a value is output, it occupies only much space as the number
    of characters it takes to display it. However, you can specify a minimum field
    width by using the width( ) function. Its prototype is shown here:


    ```

    streamsize width(streamsize w);

    ```


    Here, w becomes the field width, and the previous field width is returned. In
    some implementations, the field width must be set before output. If it isn''t,
    the default field width is used. The streamsize type is defined as some form of
    integer by the compiler.


    After you set a minimum field width, when a value uses less than the specified
    width, the field will be padded with the current fill character (space, by default)
    to reach the field width. If the size of the value exceeds the minimum field width,
    then the field will be overrun. No values are truncated.


    When outputting floating-point values in scientific notation, you can determine
    the number of digits to be displayed after the decimal point by using the precision(
    ) function. Its prototype is shown here:


    ```

    streamsize precision(streamsize p);

    ```


    Here, the precision is set to p, and the old value is returned. The default precision
    is 6. In some implementations, the precision must be set before each floating-point
    output. If you don''t set it, the default precision is used.


    By default, when a field needs to be filled, it is filled with spaces. You can
    specify the fill character by using the fill( ) function. Its prototype is


    ```

    char fill(char ch);

    ```


    After a call to fill( ), w becomes the new fill character, and the old one is
    returned.


