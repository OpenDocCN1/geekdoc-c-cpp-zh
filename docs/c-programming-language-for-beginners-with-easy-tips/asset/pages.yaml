    # Semicolons and Positioning


    In C++, the semicolon signals the end of a statement. That is, each individual
    statement must end with a semicolon. As you know, a block is a set of logically
    connected statements that is surrounded by opening and closing braces. A block
    is not terminated with a semicolon. Since a block is a group of statements, with
    a semicolon after each statement, it makes sense that a block is not terminated
    by a semicolon; instead, the end of the block is indicated by the closing brace.


    C++ does not recognize the end of the line as the end of a statement—only a semicolon
    terminates a statement. For this reason, it does not matter where a line you put
    a statement.


