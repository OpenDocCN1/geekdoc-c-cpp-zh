    # static_cast


    The static_cast operator performs a non-polymorphic cast. It can be used for any
    standard conversion. No runtime checks are performed. Thus, the static_cast operator
    is essentially a substitute for the original cast operator. Its general form is


    ```

    static_cast<type>(expr)

    ```


    Here, type specifies the target type of the cast, and expr is the expression being
    cast into the new type.


    # reinterpret_cast


    The reinterpret_cast operator converts one type into a fundamentally different
    type. For example, it can change a pointer into an integer and an integer into
    a pointer. It can also be used for casting inherently incompatible pointer types.
    Its general form is


    ```

    reinterpret_cast<type>(expr)

    ```


    Here, type specifies the target type of the cast, and expr is the expression being
    cast into the new type.


