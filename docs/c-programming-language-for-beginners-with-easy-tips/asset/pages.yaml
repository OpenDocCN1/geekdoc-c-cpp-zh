    # static Member Variables


    When you precede a member variable''s declaration with static, you are telling
    the compiler that only one copy of variable will exist and that all objects of
    the class will share variable. Unlike regular data members, individual copies
    of a static member variable are not made for each object. No matter how many objects
    of a class are created, only one copy of a static data member variable exists.
    Thus, all objects of that class use that same variable. All static variables are
    initialized to zero if no other initialization is specified. When you declare
    a static data member within a class, you are not defining it. Instead, you must
    provide a global definition for it elsewhere, outside the class. This is done
    by redeclaring the static variable using the scope resolution operator to identify
    which class it belongs to. This causes storage to be allocated for the static
    variable. Here is an example that uses a static member:'
