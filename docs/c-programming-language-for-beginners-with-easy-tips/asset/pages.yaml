    used to replace if...else statements. It has the following general form:


    ```

    Exp1 ? Exp2 : Exp3;

    ```


    Exp1, Exp2, and Exp3 are expressions. Notice the use and placement of the colon.


    The value of a ‘?’ expression is determined like this: Exp1 is evaluated. If it
    is true, then Exp2 is evaluated and becomes the value of the entire ‘?’ expression.
    If Exp1 is false, then Exp3 is evaluated and its value becomes the value of the
