  md: 'Both the increase (++) and decrease (-) operators have greater operator precedence
    than the dereference operator (*), but both have a special behavior when used
    as suffix *(the expression is evaluated as the value it had before being increased).
    Therefore, the following expression may lead to confusion:


    ```

    *p++

    ```


    Because ++ has greater precedence than *, this expression is equivalent to *(p++).
    Therefore, what it does increase the value of p (so it now points to the next
    element), but because ++ is used as postfix the whole expression is evaluated
    as the value pointed by the original reference (the address pointer pointed to
    before increasing).


    Notice the difference with:


    ```

    (*p)++

    ```


    Here, the expression would have been evaluated as the value pointed by p increased
    by one. The value of p (the pointer itself) would not be modified (what is being
    modified is what it is pointed to by this pointer).


    If we write:


    ```

    *p++ = *q;

    ```


    Because ++ has a higher precedence than *, both p and q are increased, but because
    both increase operators (++) are used as postfix and not prefix, the value assigned
    to *p is *q *before* both p and q are increased. And then both are increased.
    It would be roughly equivalent to:


    ```

    *p = *q;

    ++p;

    ```


    ```

    ++q;

    ```


    Like always, I recommend you to use parentheses () to avoid unexpected results
    and to give more legibility to the code.'
