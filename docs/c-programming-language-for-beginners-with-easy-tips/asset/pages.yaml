  md: '# Other Data Types


    # Defined data types (typedef)


    C++ allows the definition of our own types based on other existing data types.
    We can do this using the keyword typedef, whose format is:


    ```

    typedef existing_type new_type_name ;

    ```


    where existing_type is a C++ fundamental or compound type and new_type_name is
    the name for the new type we are defining. For example:


    ```

    typedef char;

    typ unsigned int WORD;

    typ char * pChar;

    typ char field [50];

    ```


    In this case we have defined four data types: C, WORD, pChar and field as char,
    unsigned int, char* and char[50] respectively, that we could perfectly use in
    declarations later as any other valid type:


    ```

    C mychar, anotherchar, *ptc1;

    WORD myword;

    pChar ptc2;

    field name;

    ```


    typedef does not create different types. It creates synonyms of existing types.
    That means the type of myword can be considered to be either WORD or unsigned
    int, since both are in fact the same type.'
