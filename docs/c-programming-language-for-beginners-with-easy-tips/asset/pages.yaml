  md: "# Control Structures\n\n# # Control Structures\n\nA program is usually not\
    \ limited to a linear sequence of instructions. During its process it may bifurcate,\
    \ repeat or take decisions. For that purpose, C++ provides control structures\
    \ that serve to specify what has to be done by our program, when and under which\
    \ circumstances.\n\nWith the introduction of control structures we are going to\
    \ have to introduce a new concept: the *compound-statement* or block. A block\
    \ is a group of statements that are separated by semicolons (;) like all C++ statements,\
    \ grouped together in a block enclosed in braces: { };\n\n```\n{ statement1; statement2;\
    \ statement3; }\n```\n\nMost of the control structures we will see in this section\
    \ require a generic statement as part of its syntax. A statement can be either\
    \ a simple statement (a simple instruction ending with a semicolon) or a compound\
    \ statement (several instructions grouped in a block), like the one just described.\
    \ In the case we want the statement to be a simple statement, we do not need to\
    \ enclose it in braces {}. But in the case we want the statement to be a compound\
    \ statement it must be enclosed between braces {}, forming a block.\n\n# # Conditional\
    \ structure: if and else\n\nThe if keyword is used to execute a statement or block\
    \ only if a condition is fulfilled. Its form is:\n\n```\nif (condition) statement\n\
    ```\n\nWhere condition is the expression that is being evaluated. If this condition\
    \ is true, statement is executed. If it is false, statement is ignored (not executed)\
    \ and the program continues right after this conditional structure.\nFor example,\
    \ the following code fragment prints x is 100 only if the value stored in the\
    \ x variable is indeed 100:\n\n```\nif (x == 100)\n    cout << \"x is 100\";\n\
    ```\n\nIf we want more than a single statement to be executed in case that the\
    \ condition is true we can specify a block using braces { };"
