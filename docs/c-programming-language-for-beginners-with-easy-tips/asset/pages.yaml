    # The C++ Predefined Streams


    C++ contains several predefined streams that are automatically opened when your
    C++ program begins execution. They are cin, cout, cerr, and clog. As you know,
    cin is the stream associated with standard input, and cout is the stream associated
    with standard output, and so is clog. The difference between these two streams
    is that clog is buffered, but cerr is not. This means that any output sent to
    cerr is immediately output, but output to clog is written only when a buffer is
    full. Typically, cerr and clog are streams to which program debugging or error
    information is written. C++ also opens (16-bit) character versions of the standard
    languages called wcin, wcout, and wclog. These streams exist to support languages,
    such as Chinese, that require large character sets. We won’t be using them in
    this book. By default, the C++ standard streams are linked to the console, which
    can be redirected to other devices or files by your program. They can also be
    redirected by the operating system.


