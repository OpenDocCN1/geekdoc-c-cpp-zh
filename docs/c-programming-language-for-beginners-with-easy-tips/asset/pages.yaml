    Another point to understand is that although a base pointer can be used to point
    to a derived object, the reverse is not true. That is, you cannot access an object
    of the base type using a derived class pointer.


    As you know, a pointer is incremented and decremented relative to its base type.
    When, a base class pointer is pointing at a derived object, incrementing or decrementing
    it will not make it point to the next object of the derived class. Instead, it
    will point to (what it thinks) the next object of the base class. Therefore, you
    should consider it invalid to increment or decrement a base class pointer when
    it is pointing to a derived object.


    The fact that a pointer to a base type can be used to point to any object derived
    from that base is extremely important, and fundamental to C++. As you will soon
    learn, this flexibility is crucial to the way C++ implements runtime polymorphism.


    # References to Derived Types


