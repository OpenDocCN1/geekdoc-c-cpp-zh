  md: "# CRITICAL SKILL 12.1: Exception Handling\n\nAn exception is an error that\
    \ occurs at runtime. Using C++'s exception handling subsystem, you can, in a structured\
    \ and controlled manner, handle runtime errors. When exception handling is employed,\
    \ your program automatically invokes an error-handling routine when an exception\
    \ occurs. The principal advantage of exception handling is that it automates much\
    \ of the error-handling code that previously had to be entered “by hand” into\
    \ any large program.\n\n# Exception Handling Fundamentals\n\nC++ exception handling\
    \ is built upon three keywords: try, catch, throw. In the most general terms,\
    \ program statements that you want to monitor for exceptions are contained in\
    \ a try block. If an exception (that is, an error) occurs within the try block,\
    \ it is thrown (using throw). The exception is caught, using catch, and processed.\
    \ The following discussion elaborates upon this general description.\n\nCode that\
    \ you monitor for exceptions must have been executed from within a try block.\
    \ (A function called from within a try block is also monitored.) Exceptions that\
    \ can be thrown by the monitored code are caught by a catch statement that immediately\
    \ follows the try statement in which the exception was thrown. The general forms\
    \ of try and catch are shown here:\n\n```\ntry {\n  // try-block\n} catch (type1\
    \ arg) {\n  // catch block\n} catch (type2 arg) {\n  // catch block\n} catch (type3\
    \ arg) {\n  // catch block\n} // ...\ncatch (typeN arg) {\n  // catch block\n\
    }\n```"
  merge: -1
  pgno: 1024
- img_proc: true
  md: 'The try block must contain the portion of your program that you want to monitor
    for errors. This section can be as short as a few statements within one function,
    or as all-encompassing as a try block that encloses the main( ) function code
    (which would, in effect, cause the entire program to be monitored).


    When an exception is thrown, it is caught by its corresponding catch statement,
    which then processes the exception. There can be more than one catch statement
    associated with a try. The type of the exception determines which catch statement
    is used. That is, if the data type specified by a catch statement matches that
    of the exception, then that catch statement is executed (and all others are bypassed).
    When an exception is caught, arg will receive its value. Any type of data can
    be caught, including classes that you create.


