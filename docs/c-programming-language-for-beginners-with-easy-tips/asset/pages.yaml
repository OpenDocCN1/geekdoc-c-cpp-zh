    # The std Namespace


    Standard C++ defines its entire library in its own namespace called std. This
    is the reason that most of the programs in this book have included the following
    statement:


    ```

    using namespace std;

    ```


    This causes the std namespace to be brought into the current namespace, which
    gives you direct access to the names of the functions and classes defined within
    the library without having to qualify each one with std::


    Of course, you can explicitly qualify each name with std:: if you like. For example,
    you could explicitly qualify out like this:


    ```

    std::cout << "Explicitly qualify out with std.";

    ```


    You may not want to bring the standard C++ library into the global namespace if
    your program will be making only limited use of it, or if doing so will cause
    name conflicts. However, if your program contains hundreds of references to library
    names, then including std in the current namespace is far easier than qualifying
    each name individually.


