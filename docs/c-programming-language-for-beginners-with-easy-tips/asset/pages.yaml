    # CRITICAL SKILL 12.5: Namespaces


    Namespaces were briefly described in Module 1. Here they are examined in detail.
    The purpose of a namespace is to localize the names of identifiers to avoid collisions.
    In the C++ programming environment, there has been an explosion of variable, function,
    and class names. Prior to the invention of namespaces, all of these names competed
    for slots in the global namespace and many conflicts arose. For example, if your
    program defined a function called toupper(), it could (depending upon its parameter
    list) override the standard library function toupper(), because both names would
    be stored in the global namespace. Name collision problems were compounded when
    two or more third-party libraries were used by the same program. In this case,
    it was possible—even likely—that a name defined by one library would conflict
    with the name defined by the other library. The situation can be particularly
    troublesome for class names. For example, if your program defines a class Stack
    and a library used by your program defines a class by the same name, a conflict
    will arise.'
