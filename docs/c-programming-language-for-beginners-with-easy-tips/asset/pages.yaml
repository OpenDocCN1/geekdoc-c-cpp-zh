  md: '# C++ Standard Library


    # Input/Output with files


    C++ provides the following classes to perform output and input of characters to/from
    files:


    +   ofstream: Stream class to write on files


    +   iostream: Stream class to read from files


    +   fstream: Stream class to both read and write from/to files.


    These classes are derived directly or indirectly from the classes istream, ostream.
    We have already used objects whose types were these classes: cin is an object
    of class istream and cout is an object of class ostream. Therefore, we have already
    using classes that are related to our file streams. In fact, we can use our file
    streams the same way we are already used to use cin and cout, with the only difference
    that we have to associate these streams with physical files. Let''s see an example:


    | basic | file operations | [file example.txt] |

    |---|---||

    | #include | <iostream> | Writing this to a file |

    | #include <fstream> | | |

    | using namespace std; | | |

