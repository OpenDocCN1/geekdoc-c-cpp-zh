  md: 'The creation of the namespace keyword was a response to these problems. Because
    it localizes the visibility of names declared within it, a namespace allows the
    same name to be used in different contexts without conflicts arising. Perhaps
    the most noticeable beneficiary of namespace is the C++ standard library. Prior
    to namespace, the entire C++ library was defined within the global namespace (which
    was, of course, the only namespace). Since the addition of namespace, the C++
    library is now defined within its own namespace, called std, which reduces the
    chance of name collisions. You can also create your own namespaces within your
    program to localize the visibility of any names that you think may cause conflicts.
    This is especially important if you are creating class or function libraries.


