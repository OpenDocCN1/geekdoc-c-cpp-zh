  md: '# Operators


    Once we know the existence of variables and constants, we can begin to operate
    with them. For that purpose, C++ integrates operators. Unlike other languages
    whose operators are mainly keywords, operators in C++ are mostly de signs that
    are not part of the alphabet but are available in all keyboards. This makes C++
    code shorter and more international, since it relies less on English words, but
    requires a little of learning effort in the beginning.


    You do not have to memorize all the content of this page. Most details are only
    provided to serve as a later reference in case you need it.


    # Assignment (=)


    The assignment operator assigns a value to a variable.


    ```

    a = 5;

    ```


    This statement assigns the integer value 5 to the variable a. The part at the
    left of the assignment operator (=) is known as the lvalue (left value) and the
    right one as the rvalue (right value). The lvalue has to be a variable whose rvalue
    can be either a constant, a variable, the result of an operation or any combination
    of these. The most important rule when assigning is the right-to-left rule: The
    assignment operation always takes place from right to left, and never the other
    way:


    ```

    a = b;

    ```


    This statement assigns to a (the lvalue) the value contained in b (the rvalue).
    The value that was stored until this moment in a is not considered in all this
    operation, and in fact value is lost.


    Consider also that we are assigning the value of b to a at the moment of the assignment
    operator. Therefore a later change of b will not affect the new value of a.


    For example, let us have a look at the following code - I have included the evolution
    of the content stored in the variables:


    | assignment operator | a:4 | b:7 |

    |---|---|--|

    | #include <iostream> | | |

    | using namespace std; | | |

    | int main () | | |'
