    # Constructors and Inheritance


    In a hierarchy, it is possible for both base classes and derived classes to have
    their own constructors. This raises an important question: what constructor is
    responsible for building an object of the derived class, the one in the base class,
    the one in the derived class, or both? The answer is this: the constructor for
    the base class constructs the base class portion of the object, and the constructor
    for the derived class constructs the derived class part. This makes sense because
    the base class has no knowledge of or access to any element in a derived class.
    Thus, their construction must be separate. The preceding examples relied upon
    the default constructors created automatically by C++, so this was not an issue.
    However, in practice, most classes will define constructors. Here you will see
    how to handle this situation.


    When only the derived class defines a constructor, the process is straightforward:
    simply construct the derived class object. The base class portion of the object
    is constructed automatically using its default constructor. For example, here
    is a reworked version of Triangle that defines a constructor. It also makes style
    private since it is now set by the constructor.'
