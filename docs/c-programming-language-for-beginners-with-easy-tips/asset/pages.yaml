  md: '# Open a file


    The first operation generally performed on an object of one of these classes is
    to associate it to a real file. This procedure is known as to open a file. An
    open file is represented within a program by a stream object (an instantiation
    of one of these classes, in the previous example this was myfile) and any input
    or output operation performed on this stream object will be applied to the physical
    file associated to it.


    In order to open a file with a stream object we use its member function open():


    ```

    open(filename, mode);

    ```


    Where filename is a null-terminated character sequence of type const char * (the
    same type that string literals have) representing the name of the file to be opened,
    and mode is an optional parameter with a combination of the following flags:'
