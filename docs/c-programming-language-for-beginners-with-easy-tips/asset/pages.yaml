  md: '# Closing a file


    When we are finished with our input and output operations on a file we shall close
    it so that its resources become available again. In order to do that we have to
    call the stream''s member function close(). This member function takes no parameters,
    and what it does is flush the associated buffers and close the file:


    ```

    myfile.close();

    ```


    Once this member function is called, the stream object can be used to open another
    file, and the file is available again to be opened by other processes.


    In case that an object is destroyed while still associated with an open file,
    the destructor automatically calls the member function close().


    # Text files


    File streams are those where we do not include the ios::binary flag in their opening
    mode. These files are designed to store text and thus all values that we input
    or output/to them suffer some formatting transformations, which do not necessarily
    correspond to their literal binary value.


    Data output operations on text files are performed in this way we operate with
    cout:


    | writing on a text file | file example.txt |

    | #include <iostream> | This is a line. |

