  md: '# static_cast


    static_cast can perform conversions from pointers to related classes, not only
    from the derived class to its base, but also from a base class to its derived.
    This ensures that at least the classes are compatible if the proper object is
    converted, but no safety check is performed during runtime to check if the object
    being converted is in fact a object of the destination type. Therefore, it is
    up to the programmer to ensure the conversion is safe. On the other side, the
    overhead of the type-safety checks of dynamic_cast is avoided.


    ![](img/3493dfb4b02900ddd964e5d048b809d3_612_0.png)


    ```

    class Base {};nclass CDerived : public Base {};nBase * a = new Base;

    CDerived * b = static_cast<CDerived>(a);

    ```


    This would be valid, although b would point to an incomplete object of the class
    and could lead to runtime errors if dereferenced.


    static_cast can also be used to perform any non-pointer conversion that could
    also be performed implicitly, like for example standard conversion between fundamental
    types:


    ```

    double d=3.14159265;

    int i = static_cast<int>(d);

    ```


    Or any conversion between classes with explicit constructors or operator functions
    as described in "implicit conversions" above.


    # reinterpret_cast


    reinterpret_cast can convert any pointer type to any other pointer type, the operation
    result is a simple binary copy of the value from one pointer to the other. All
    pointer conversions are allowed: neither the content pointed nor the pointer itself
    is checked.


    It can also cast pointers to from integer types. The format in this integer value
    represents a pointer as is platform-specific. The only guarantee is that a pointer
    cast to an integer type large enough to fully contain it, is granted to be able
    to cast back to a valid pointer.'
