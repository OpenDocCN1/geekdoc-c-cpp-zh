  md: '# C++


    The ANSI standard has been stable for a while, and all the major C++ compiler
    manufacturers support ANSI standard.


    Learning C++


    The most important thing while learning C++ is to focus on concepts.


    The purpose of learning a programming language is to become a better programmer;
    that is, to become more effective at designing and implementing new systems and
    at maintaining old ones.


    C++ supports a variety of programming styles. You can write in the style of Fortran,
    C, Smalltalk, etc., in any language. Each style can achieve its aims effectively
    while maintaining runtime and space efficiency.


    Use of C++


    C++ is used by hundreds of thousands of programmers in essentially every application
    domain.


    C++ is being highly used to write device drivers and other software that rely
    on direct manipulation of hardware under real-time constraints.


    C++ is widely used for teaching and research because it is clean enough for successful
    teaching of basic concepts.


    Anyone who has used either an Apple Macintosh or a PC running Windows has indirectly
    used C++ because the primary user interfaces of these systems are written in C++.'
