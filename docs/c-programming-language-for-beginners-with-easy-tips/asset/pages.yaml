  md: '<iostream>. For the most part, the two libraries appear the same to the programmer.
    This is because the new I/O library is, in essence, simply an updated and improved
    version of the old one. In fact, the vast majority of differences between the
    two occur beneath the surface, in the way that the libraries are implemented—not
    in how they are used.


    From the programmer''s perspective, there are two main differences between the
    old and new C++ I/O libraries. First, the new I/O library contains a few additional
    features and defines some new data types. Thus, the new I/O library is essentially
    a superset of the old one. Nearly all programs originally written for the old
    library will compile without substantive changes when the new library is used.
    Second, the old-style I/O library was in the global namespace. The new-style library
    is in the std namespace. (Recall that the std namespace is used by all of the
    Standard C++ libraries.) Since the old-style I/O library is now obsolete, this
    book describes only the new I/O library, but most of the information is applicable
    to the old I/O library as well.


    # CRITICAL SKILL 11.1: C++ Streams


    The most fundamental point to understand about the C++ I/O system is that it operates
    on streams. A stream is an abstraction that either produces or consumes information.
    A stream is linked to a physical device by the C++ I/O system. All streams behave
    in the same manner, even if the actual physical devices they are linked to differ.
    Because all streams act the same, the same I/O functions and operators can operate
    on virtually any type of device. For example, the method that you use to write
    to the screen can be used to write to a disk or to the printer.


    In its most common form, a stream is a logical interface to a file. As C++ defines
    the term "file," it can refer to a disk file, the screen, the keyboard, a port,
    a file tape, and so on. Although files differ in form and capabilities, all streams
    are the same. The advantage to this approach is that to you, the programmer, one
    hardware device will look much like any other. The stream provides a consistent
    interface.


    A stream is linked to a file through an open operation. A stream is disassociated
    from a file through a close operation.'
