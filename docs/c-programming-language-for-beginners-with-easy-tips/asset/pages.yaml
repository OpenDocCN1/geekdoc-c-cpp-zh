  md: 'The C++ I/O system manages two pointers associated with a file. One is the
    get pointer, which specifies where in the file the next input operation will occur.
    The other is the put pointer, which specifies where in the file the next output
    operation will occur. Each time an input or an output operation takes place, the
    appropriate pointer is automatically advanced. Using the seekg() and seekp() functions,
    it is possible to move this pointer and access the file in a non-sequential fashion.


    The seekg() function moves the associated file''s current get pointer offset number
    of bytes from the specified origin. The seekp() function moves the associated
    file''s current put pointer offset number of bytes from the specified origin.


    Generally, random access I/O should be performed only on those files opened for
    binary operations. The character translations that may occur on text files could
    cause a position request to be out of sync with the actual contents of the file.


