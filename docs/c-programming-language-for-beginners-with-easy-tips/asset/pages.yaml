  md: '# Constants


    Constants are expressions with a fixed value.


    # Literals


    Literals are used to express particular values within the source code of a program.
    We have already used these previously to give concrete values to variables or
    to express messages we wanted our programs to print out, for example, we wrote:


    ```

    a = 5;

    ```


    the 5 in this piece of code was a literal constant.


    Literal constants can be divided into Integer Numerals, Floating-Point Numerals,
    Characters, Strings and Boolean Values.


    # Integer Numerals


    ```

    1776

    707

    -273

    ```


    They are numerical constants that identify integer decimal values. Notice that
    to express a numerical constant we do not have to write quotes (")


    In addition to decimal numbers (that all of us are used to use every day) C++
    allows us to use as literal constants of octal numbers (base 8) and hexadecimal
    numbers (base 16). If we want to express an octal number we have to precede it
    with a 0 (zero character). And in order to express a hexadecimal number we have
    to precede it with the characters 0x (zero, x). For example, the following literal
    constants are all equivalent to each other:


    ```

    // decimal

    ```'
