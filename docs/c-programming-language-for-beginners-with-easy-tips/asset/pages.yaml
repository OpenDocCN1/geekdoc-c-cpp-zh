    # # Hexadecimal and Octal Literals


    As you probably know, in programming it is sometimes easier to use a number system
    based on 8 or 16 instead of 10. The number system based on 8 is called octal,
    and it uses the digits 0 through 7. In octal, the number 10 is the same as 8 in
    decimal. The base-16 number system is called hexadecimal and uses the digits 0
    through 9 plus the letters A through F, which stand for 10, 11, 12, 13, 14, and
    15. For example, the hexadecimal number 10 is 16 in decimal. Because of the frequency
    with which these two systems are used, C++ allows you to specify integer literals
    in hexadecimal or octal instead of decimal. A hexadecimal literal must begin with
    0x (a zero followed by an x). An octal literal begins with a zero. Here are some
    examples:


    ```

    hex = 0xFF; // 255 in decimal

    oct = 011; // 9 in decimal

    ```


