    In line 1, the high-order bits of the integer variable x are lopped off, leaving
    ch with the lower 8 bits. If x were between -128 and 127, ch and x would have
    identical values. Otherwise, the value of ch would reflect only the lower-order
    bits of x. In line 2, x will receive the nonfractional part of f. In line 3, f
    will convert the 8-bit integer value stored in ch to the same value in the floating-point
    format. This also happens in line 4, except that f will convert an integer value
    into floating-point format.


    When converting from integers to long integers to integers, the appropriate number
    of high-order bits will be removed. In many 32-bit environments, this means that
    24 bits will be lost when going from an integer to a character, and 16 bits will
    be lost when going from an integer to a short integer. When converting from a
    floating-point type to an integer, the fractional part will be lost. If the target
    type is not large enough to store the result, then a garbage value will result.


