- img_proc: true
  md: 'These values are used to set or clear the format flags. Some older compilers
    may not define the fmtflags enumeration type. In this case, the format flags will
    be encoded into a long integer.


    When the skipws flag is set, leading whitespace characters (spaces, tabs, and
    newlines) are discarded when performing input on a stream. When skipws is cleared,
    whitespace characters are not discarded.


    When the left flag is set, output is left-justified. When right is set, output
    is right-justified.


    When the internal flag is set, a numeric value is padded to a field by inserting
    spaces between any sign or base character. If none of these flags are set, output
    is right-justified by default.


    By default, numeric values are output in decimal. However, it is possible to change
    the number base. Setting the oct flag causes output to be displayed in octal.
    Setting the hex flag causes output to be displayed in hexadecimal. To return output
    to decimal, set the dec flag.


    Setting showbase the base of numeric values to be shown. For example, if the conversion
    base is hexadecimal, the value 1F will be displayed as 0x1F.


    By default, when scientific notation is displayed, the e is in lowercase. Also,
    when scientific notation is displayed, the x is in lowercase. When uppercase is
    set, these characters are displayed in uppercase.


    Setting showpos causes a plus sign to be displayed before positive values. Setting
    showpoint causes a decimal point and trailing zeros to be displayed for all floating-point
    output—whether needed or not.


    By setting the scientific flag, floating-point numeric values are displayed using
    scientific notation. When fixed is set, floating-point values are displayed using
    normal notation. When neither flag is set, the compiler chooses an appropriate
    method.


    When unitbit is set, the buffer is flushed after each insertion operation. When
    boolalpha is set, Booleans can be input or output using the keywords true and
    false.'
