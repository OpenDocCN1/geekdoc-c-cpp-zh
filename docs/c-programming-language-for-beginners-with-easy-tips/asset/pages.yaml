  md: "In the preceding program, the overloaded inserter function is not a member\
    \ of ThreeD. In fact, neither inserter nor extractor functions can be members\
    \ of a class. The reason is that when an operator function is a member of a class,\
    \ the left operand (implicitly passed using this pointer) is an object of that\
    \ class. There is no way to change this. However, when inserters are overloaded,\
    \ the left operand is a stream, and the right operand is an object of the class\
    \ being output. Therefore, overloaded inserters must be nonmember functions.\n\
    \nThe fact that inserters must not be members of the class they are defined to\
    \ operate on raises a serious question: How can an overloaded inserter access\
    \ the private elements of a class? In the preceding program, the variables x,\
    \ y,and z were made public so that the inserter could access them. By hiding data\
    \ is an important part of OOP, and forcing all data to be public is a serious\
    \ inconsistency. However, there is a solution: an inserter can be a friend of\
    \ a class. As a friend of the class for which it is defined, it has access to\
    \ private data. Here, the ThreeD class and sample program are reworked, with the\
    \ overloaded inserter declared as a friend:\n\n```\n// Use a friend to overload\
    \ <<,\n#include <iostream>\nusing namespace std;\n\nclass ThreeD {\n    int x,\
    \ y, z; // ThreeD coordinates - private\npublic:\n    ThreeD(int a, int b, int\
    \ c) ( x = a; y = b; z = c );\n    friend ostream &operator<<(ostream &stream,\
    \ ThreeD obj);\n};\n\n// Display X, Y, Z coordinates - ThreeD inserter.\nostream\
    \ &operator<<(ostream &stream, ThreeD obj) {\n    stream << obj.x << \" \";\n\
    \    stream << obj.y << \" \";\n    stream << obj.z << \" \\\\n\";\n    return\
    \ stream;\n}\n\nint main() {\n    ThreeD a(1, 2, 3), b(3, 4, 5), c(5, 6, 7);\n\
    \n    cout << a << b << c;\n\n    return 0;\n}\n\n```\n\nThreeD inserter is now\
    \ a friend and has access to private data."
