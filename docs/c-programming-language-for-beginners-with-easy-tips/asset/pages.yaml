  md: '# Initializing Allocated Memory


    You can initialize allocated memory to some known value by putting an initializer
    after the type name in the new statement. Here is the general form of new when
    an initialization is included:


    ```

    p_var = new var_type(initializer);

    ```


    Of course, the type of the initializer must be compatible with the type of data
    for which memory is being allocated.


    # Ask the Expert


    **Q:** I have seen C++ code that uses the functions malloc() and free( ) to handle
    dynamic allocation. What are these functions?


    **A:** The C language does not support the new and delete operators. Instead,
    C uses the functions


    malloc() and free() for dynamic allocation. malloc() allocates memory and free()
    releases it. C++ also supports these functions, and you will sometimes that code
    malloc() and free() used in C++ code. This is especially true if that code has
    been updated from older C code. However, you should use new and delete in your
    code. Not only do new and delete offer a more convenient method of handling dynamic
    allocation, but they also prevent several types of errors that are common when
    working with malloc() and free(). One other point: Although there is no formal
    rule that states this, it is best not to mix new and delete with malloc() and
    free() in the same program. There is no guarantee that they are mutually compatible.


