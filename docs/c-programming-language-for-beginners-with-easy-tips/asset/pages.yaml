  md: '# Friendship and inheritance


    # Friend functions


    In principle, private and protected members of a class cannot be accessed from
    outside the same class in which they are declared. However, this rule does not
    affect friends.*.


    Friends functions or classes declared as such.


    If we want to declare an external function as friend of a class, thus allowing
    this function to access to the private and protected members of this class, we
    do it by declaring a prototype of this external function within the class, and
    preceding it with the keyword friend:


    ```

    // friend functions

    #include <iostream>

    using namespace;

    class CRectangle {

    int width, height;

    public:

    void set_values(int, int);

    int area () {return (width * height);}

    friend CRectangle duplicate(CRectangle);

    }

    void CRectangle::set_values(int a, int b) {

    width = a;

    height = b;

    }

    CRectangle duplicate(CRectangle rectparam)

    {

    CRectangle rectres;

    rectres.width = rectparam.width*2;

    rectres.height = rectparam.height*2;

    return (rectres);

    }

    ```'
