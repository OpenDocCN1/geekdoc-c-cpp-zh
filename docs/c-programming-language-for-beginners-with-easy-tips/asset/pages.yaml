  md: 'You can detect when the end of the file is reached by using the member function
    eof() , which has this prototype:


    bool eof();


    It returns true when the end of the file has been reached; otherwise it returns
    false.


    # peek() and putback()


    You can obtain the next character in the input stream without removing from that
    stream by using peek(). It has this prototype:


    int peek();


    peek() returns the next character in the stream, or EOF if the end of the file
    is encountered. The character is contained in the low-order byte of the return
    value. You can return the last character read from a stream by using putback().
    Its prototype is shown here:


    istream &putback(char c);


    where c is the last character read.


    # flush()


    When output is performed, data is not immediately written to the physical device
    linked to the stream. Instead, information is stored in an internal buffer until
    the buffer is full. Only then are the contents of that buffer written to disk.
    However, you can force the information to be physically written to disk before
    the buffer is full by calling flush(). Its prototype is shown here:


    ostream &flush();


    Calls to flush() might be warranted when a program is going to be used in adverse
    environments (in situations where power outages occur frequently, for example).


    NOTE: Closing a file or terminating a program also flushes all buffers.'
