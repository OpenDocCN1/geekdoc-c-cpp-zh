  md: 'time and cannot be altered during the execution of a program. The second way
    information can be stored is through the use of C++’s dynamic allocation system.
    In this method, storage for data is allocated as needed from the free memory area
    that lies between your program (and its permanent storage area) and the stack.
    This region is called the heap. (Figure 12-1 shows conceptually how a C++ program
    appears in memory.)


    Dynamically allocated storage is determined at runtime. Thus, dynamic allocation
    makes it possible for your program to create variables that it needs during its
    execution. It can create as many or as few variables as required, depending upon
    the situation. Dynamic allocation is often used to support such data structures
    as linked lists, binary trees, and sparse arrays. Of course, you are free to use
    dynamic allocation wherever you determine it to be of value. Dynamic allocation
    for one purpose or another is an important part of nearly all real-world programs.


    Memory to satisfy a dynamic allocation request is taken from the heap. As you
    might guess, it is possible, under fairly extreme cases, for free memory to become
    exhausted. Therefore, while dynamic allocation offers greater flexibility, it
    too is finite.


