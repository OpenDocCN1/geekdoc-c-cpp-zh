    Here is the flow of control in a for loop:


    The init step is executed first, and only once. This step allows you to declare
    and initialize any loop control variables. You are not required to put a statement
    here, as long as a semicolon appears.


    Next, the condition is evaluated. If it is true, the body of the loop is executed.
    If it is false, the body of the loop does not execute and flow of control jumps
    to the next statement just after the loop.


    After the body of the for loop executes, the flow of control jumps back up to
    the increment'
