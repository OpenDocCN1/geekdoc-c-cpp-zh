  md: 'You can combine two or more of these values by ORing them together. Including
    ios::app causes all output to file to be appended to the end. This value can be
    used only with files capable of output. Including ios::ate causes a seek to the
    end of the file to occur when the file is opened. Although ios::ate causes an
    initial seek to end-of-file, I/O operations can still occur anywhere within the
    file.


    The ios::in value specifies that the file is capable of input. The ios::out value
    specifies that the file is capable of output.


    The ios::binary value causes a file to be opened in binary mode. By default, all
    files are opened in text mode. In text mode, various character translations may
    take place, such as carriage returnlinefeed sequences being converted into newlines.
    However, when a file is opened in binary mode, no such character translations
    will occur. Understand that any file, whether it contains formatted text or raw
    data, can be opened in either binary or text mode. The only difference is whether
    character translations take place.


