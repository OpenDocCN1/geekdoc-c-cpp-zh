    \ 1\n-- Back to the main function!\n```\n\n如你所见，协程执行了一次迭代，然后在 `coroutine.yield`\
    \ 处暂停。主函数继续其执行，而协程将控制权交还给了主函数。\n\n要继续运行协程，我们可以再次调用 `coroutine.resume`：\n\n```lua\n\
    -- 再次恢复协程\ncoroutine.resume(myCoroutine)\ncoroutine.resume(myCoroutine)\ncoroutine.resume(myCoroutine)\n\
    \n-- 输出:\n-- Coroutine is running: 2\n-- Coroutine is running: 3\n-- Coroutine\
    \ is running: 4\n```\n\n协程从它停止的地方继续运行，允许我们管理任务并对执行流保持更多控制。\n\n## 在游戏开发中使用协程\n\n\
    在游戏开发中，处理基于时间的事件、动画和处理复杂的游戏逻辑时，协程特别有用。例如，你可以创建一个协程来管理游戏倒计时事件的倒计时器：\n\n```lua\n\
    function startCountdownTimer(seconds)\n    local timeLeft = seconds\n    while\
    \ timeLeft > 0 do\n        print(\"Time left:\", timeLeft, \"seconds\")\n    \
