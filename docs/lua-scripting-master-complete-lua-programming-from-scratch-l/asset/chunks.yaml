    \n## 第 9 章：集成 Lua 与 C\n\n### 与 Lua 一起工作\n\n在本章中，我们将探索 Lua 与 C 集成的精彩世界，这为游戏开发带来了无限可能。通过无缝连接这两种语言，我们可以利用\
