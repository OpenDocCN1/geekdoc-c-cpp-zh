    \n断言在开发过程中验证假设非常有用。它们帮助帮助于在代码执行过程的早期阶段捕获逻辑性错误。\n\n### 断言示例：\n\n```lua\n-- 使用断言来验证函数输入\n\
    function calculateSquareRoot(x)\n  assert(x >= 0, \"输入不能为负数!\")\n  return math.sqrt(x)\n\
    end\n```\n\n在本章中，我们探索了 Lua 脚本编写中“解决逻辑错误”的艺术。逻辑错误可能难以捉摸，但通过使用 `print` 语句、条件断点和\
    \ IDE 特性进行勤奋的调试，我们可以有效地追踪代码流并检测问题。此外，断言是开发过程中验证假设和输入的得手工具。\n\n通过掌握解决逻辑错误的技能，你将成为一名更熟练的\
    \ Lua 开发者，能够编写出健壮的游戏脚本。\n\n## 从键盘获取输入值\n\n在本章中，我们将探索 Lua 脚本编写中令人兴奋的“从键盘获取输入值”的世界。捕捉用户输入是游戏开发的一个方面，因为它允许我们创建交互式且吸引人的体验。\n\
    \n### 使用 `io.read()` 进行基础输入：\n\n在 Lua 中，我们可以使用 `io.read()` 函数从键盘读取输入。它等待用户输入数据，然后将其存储在变量中以便后续处理。\n\
    \n### 基础输入示例：\n\n```lua\n-- 基础输入示例\nprint(\"请输入你的名字：\")\nlocal name = io.read()\n\
    print(\"你好，\" .. name .. \"!欢迎来到游戏.\")\n```\n\n### 处理不同的输入类型\n\n读取输入时，根据游戏需求处理不同的输入类型（如数字和字符串）至关重要。如果需要，我们可以使用\
    \ `tonumber()` 将输入转换为数字。\n\n### 处理数值输入的示例：\n\n```lua\n-- 处理数值输入\nprint(\"请输入你的年龄：\"\
    )\nlocal age = tonumber(io.read())\nif age then\n  print(\"你今年 \" .. age .. \"\
    \ 岁。\")\nelse\n  print(\"输入无效。请输入有效的年龄。\")\nend\n```\n\n### 使用循环验证输入\n\n确保输入有效，我们可以使用循环反复请求输入，直到用户提供正确的格式或值。\n\
    \n### 输入验证示例：\n\n```lua\n-- 循环输入验证\nlocal number\nrepeat\n  print(\"请输入 1 到 10\
    \ 之间的数字：\")\n  number = tonumber(io.read())\nuntil number and number >= 1 and\
    \ number <= 10\nprint(\"你输入的是：\" .. number)\n```\n\n### 使用提示消息\n\n在游戏中，提供提示消息来引导用户预期的输入是有益的。这有助于增强整体用户体验。\n\
    \n### 提示消息示例：\n\n```lua\n-- 使用提示消息\nprint(\"你发现自己在黑暗的房间里。你想做什么？\")\nprint(\"a)\
    \ 环顾四周\")\nprint(\"b) 返回\")\nlocal choice = io.read()\nif choice == \"a\" then\n\
    \  print(\"你发现了一把闪光的钥匙。\")\nelseif choice == \"b\" then\n  print(\"你决定回去。\")\n\
    else\n  print(\"选择无效。\")\nend\n```\n\n### 使用表处理输入选项\n\n在复杂的游戏中，我们可能有多个输入选项。使用表将用户输入映射到特定操作可以使代码更有组织且更易维护。\n\
    \n### 使用处理输入选项的示例：\n\n```lua\n-- 使用表处理输入选项\nlocal actions = {\n  [\"a\"] = function()\
    \ print(\"你选择了选项 A。\") end,\n  [\"b\"] = function() print(\"你选择了选项 B。\") end,\n\
    \  [\"c\"] = function() print(\"你选择了选项 C。\") end,\n}\nprint(\"选择一个选项：(a/b/c)\"\
    )\nlocal choice = io.read()\nif actions[choice] then\n  actions[choice]()\nelse\n\
    \  print(\"选择无效。\")\nend\n```\n\n在本章中，我们探索了 Lua 脚本编写中“从键盘获取输入值”的艺术。捕捉用户输入是游戏开发者的一项基本技能，通过利用\
    \ `io.read()` 等函数、处理不同的输入类型、使用循环验证输入、使用提示消息以及使用表组织输入选项，我们可以创建交互式的游戏。\n\n通过掌握处理用户输入的艺术，你将增强整体玩家体验，并创建出让观众参与并快乐的游戏。\n\
    \n## 处理输入选项\n\n作为游戏开发者，为玩家提供各种输入选项对于创建动态且交互的游戏体验至关重要。\n\n### 使用 if-else 语句处理输入选项：\n\
    \n处理输入选项的方法是使用 if-else 语句。根据用户的输入，我们可以执行特定的操作并控制游戏的流程。\n\n### 使用 if-else 语句处理输入选项的示例：\n\
    \n```lua\n-- 使用 if-else 语句处理输入选项\nprint(\"选择一个选项：(1/2/3)\")\nlocal choice = tonumber(io.read())\n\
    if choice == 1 then\n  print(\"你选择了选项 1。\")\nelseif choice == 2 then\n  print(\"\
    你选择了选项 2。\")\nelseif choice == 3 then\n  print(\"你选择了选项 3。\")\nelse\n  print(\"\
    选择无效。\")\nend\n```\n\n### 使用 switch-case（使用表）：\n\n在 Lua 中，没有内置的 switch-case 语句，但我们可以使用表作为不同输入选项的映射来模拟这种行为。\n\
    \n### 使用表处理输入选项的示例：\n\n```lua\n-- 使用表处理输入选项 (switch-case)\nlocal actions = {\n\
    \  [\"a\"] = function() print(\"你选择了选项 A。\") end,\n  [\"b\"] = function() print(\"\
    你选择了选项 B。\") end,\n  [\"c\"] = function() print(\"你选择了选项 C。\") end,\n}\nprint(\"\
    选择一个选项：(a/b/c)\")\nlocal choice = io.read()\nif actions[choice] then\n  actions[choice]()\n\
    else\n  print(\"选择无效。\")\nend\n```\n\n### 创建交互式菜单\n\n在复杂的游戏中，交互式菜单可以为玩家提供选项列表。我们可以使用循环显示菜单，直到玩家选择选项。\n\
    \n### 创建交互式菜单的示例：\n\n```lua\n-- 创建交互式菜单\nlocal function displayMenu()\n  print(\"\
    主菜单：\")\n  print(\"1. 开始游戏\")\n  print(\"2. 加载游戏\")\n  print(\"3. 选项\")\n  print(\"\
    4. 退出\")\nend\nlocal choice\nrepeat\n  displayMenu()\n  choice = tonumber(io.read())\n\
    \  if choice == 1 then\n    print(\"正在开始游戏...\")\n  elseif choice == 2 then\n\
    \    print(\"正在加载游戏...\")\n  elseif choice == 3 then\n    print(\"打开选项菜单...\"\
    )\n  elseif choice == 4 then\n    print(\"正在退出游戏。\")\n  else\n    print(\"选择无效。请重试。\"\
    )\n  end\nuntil choice == 4\n```\n\n### 使用函数处理用户输入\n\n为了保持代码的组织和模块化，我们可以为每个选项定义独立的函数，并根据玩家的选择调用它们。\n\
    \n### 使用函数处理用户输入的示例：\n\n```lua\n-- 使用函数处理用户输入\nlocal function startGame()\n  print(\"\
    正在开始游戏...\")\n  -- 你的游戏逻辑在这里\nend\nlocal function loadGame()\n  print(\"正在加载游戏...\"\
    )\n  -- 你的加载逻辑在这里\nend\nlocal function optionsMenu()\n  print(\"打开选项菜单...\")\n\
    \  -- 你的选项逻辑在这里\nend\nlocal function quitGame()\n  print(\"正在退出游戏...\")\n  --\
    \ 你的退出逻辑在这里\nend\nlocal actions = {\n  [1] = startGame,\n  [2] = loadGame,\n \
    \ [3] = optionsMenu,\n  [4] = quitGame,\n}\nlocal choice\nrepeat\n  print(\"主菜单：\"\
    )\n  print(\"1. 开始游戏\")\n  print(\"2. 加载游戏\")\n  print(\"3. 选项\")\n  print(\"\
    4. 退出\")\n  choice = tonumber(io.read())\n  if actions[choice] then\n    actions[choice]()\n\
    \  else\n    print(\"选择无效。请重试。\")\n  end\nuntil choice == 4\n```\n\n在本章中，我们探索了\
    \ Lua 脚本编写中“处理输入选项”的艺术。通过利用 if-else 语句或表将输入映射到特定操作，我们可以创建交互式且吸引人的游戏。此外，我们还学习了如何构建交互式菜单并使用每个选项的独立函数来处理用户输入。\n\
    \n"
- fmt: "\nLet's start with capturing single key inputs from the player. We can use\
    \ the `io.read()` function to read a single character from the standard input.\n\
    \n### Example of Capturing Single Key Input\n\n```lua\n-- Capturing single key\
    \ input\n\nprint(\"Press any key to continue...\")\n\nio.read()  -- This will\
    \ wait for any key press\n\nprint(\"You pressed a key!\")\n```\n\n### Mouse Input\n\
    \nIn some games, mouse input is essential for interactions such as clicking buttons\
    \ or aiming. We can use the `love.mouse` module in the Love2D framework to handle\
    \ mouse input.\n\n### Example of Handling Mouse Input (using Love2D):\n\n```lua\n\
    -- Handling mouse input using Love2D framework\n\nfunction love.load()\n  love.window.setTitle(\"\
    Mouse Input Demo\")\nend\n\nfunction love.mousepressed(x, y, button, istouch,\
    \ presses)\n  if button == 1 then\n    print(\"Left mouse button pressed at (\"\
    \ .. x .. \", \" .. y .. \")\")\n  elseif button == 2 then\n    print(\"Right\
    \ mouse button pressed at (\" .. x .. \", \" .. y .. \")\")\n  end\nend\n```\n\
    \n### Touch Input (Mobile Devices)\n\nFor mobile games, touch input is crucial.\
    \ Love2D also supports touch events, making it convenient to develop games for\
    \ mobile devices.\n\n### Example of Handling Touch Input (using Love2D):\n\n```lua\n\
    -- Handling touch input using Love2D framework\n\nfunction love.load()\n  love.window.setTitle(\"\
    Touch Input Demo\")\nend\n\nfunction love.touchpressed(id, x, y, dx, dy, pressure)\n\
    \  print(\"Touch pressed: ID \" .. id .. \" at (\" .. x .. \", \" .. y .. \")\"\
    )\nend\n```\n\n### Text Input\n\nText input is essential for games that require\
    \ user input, such as entering player names or messages. We can use the `love.textinput`\
    \ function in Love2D to capture text input.\n\n### Example of Capturing Text Input\
    \ (using Love2D):\n\n```lua\n-- Capturing text input using Love2D framework\n\n\
    local playerName = \"\"\n\nfunction love.textinput(text)\n  playerName = playerName\
    \ .. text\nend\n\nfunction love.draw()\n  love.graphics.print(\"Enter your name:\
    \ \" .. playerName, 10, 10)\nend\n```\n\n### Gamepad Input\n\nFor games played\
    \ with game controllers, handling gamepad input is crucial. Love2D provides functions\
    \ to detect and handle gamepad input.\n\n### Example of Handling Gamepad Input\
    \ (using Love2D):\n\n```lua\n-- Handling gamepad input using Love2D framework\n\
    \nfunction love.load()\n  love.window.setTitle(\"Gamepad Input Demo\")\nend\n\n\
    function love.gamepadpressed(joystick, button)\n  print(\"Gamepad button \" ..\
    \ button .. \" pressed.\")\nend\n```\n\nIn this chapter, we explored \"Different\
    \ Input Options\" in Lua scripting. We learned how to capture single key inputs,\
    \ handle mouse and touch inputs using Love2D framework for desktop and mobile\
    \ games, capture text input, and handle gamepad input.\n\nBy implementing these\
    \ diverse input options, you'll create games with more immersive and interactive\
    \ gameplay, providing players with a truly engaging experience.\n\n---\n\n# Finding\
    \ Distance Between Points\n\nAs game developers, understanding how to calculate\
    \ distances between objects in your game world is crucial for various gameplay\
    \ mechanics, such as collision detection, pathfinding, and more.\n\n### Euclidean\
    \ Distance\n\nThe Euclidean distance between two points `(x1, y1)` and `(x2, y2)`\
    \ in a 2D plane is given by the formula:\n\n`Distance = √((x2 - x1)^2 + (y2 -\
    \ y1)^2)`\n\nLet's implement a function to calculate the Euclidean distance between\
    \ two points in Lua:\n\n```lua\n-- Function to calculate Euclidean distance between\
    \ two points\nfunction calculateEuclideanDistance(x1, y1, x2, y2)\n  local dx\
    \ = x2 - x1\n  local dy = y2 - y1\n  return math.sqrt(dx * dx + dy * dy)\nend\n\
    \n-- Example usage\nlocal distance = calculateEuclideanDistance(0, 0, 3, 4)\n\
    print(\"Euclidean distance:\", distance)  -- Output: 5\n```\n\n### Manhattan Distance\n\
    \nThe Manhattan distance (also known as the city block distance) between two points\
    \ `(x1, y1)` and `(x2, y2)` is given by the formula:\n\n`Distance = |x2 - x1|\
    \ + |y2 - y1|`\n\nLet's implement a function to calculate the Manhattan distance\
    \ between two points in Lua:\n\n```lua\n-- Function to calculate Manhattan distance\
    \ between two points\nfunction calculateManhattanDistance(x1, y1, x2, y2)\n  local\
    \ dx = math.abs(x2 - x1)\n  local dy = math.abs(y2 - y1)\n  return dx + dy\nend\n\
    \n-- Example usage\nlocal distance = calculateManhattanDistance(0, 0, 3, 4)\n\
    print(\"Manhattan distance:\", distance)  -- Output: 7\n```\n\n### Chebyshev Distance\n\
    \nThe Chebyshev distance between two points `(x1, y1)` and `(x2, y2)` is the maximum\
    \ of the absolute differences in their coordinates:\n\n`Distance = max(|x2 - x1|,\
    \ |y2 - y1|)`\n\nLet's implement a function to calculate the Chebyshev distance\
    \ between two points in Lua:\n\n```lua\n-- Function to calculate Chebyshev distance\
    \ between two points\nfunction calculateChebyshevDistance(x1, y1, x2, y2)\n  local\
    \ dx = math.abs(x2 - x1)\n  local dy = math.abs(y2 - y1)\n  return math.max(dx,\
    \ dy)\nend\n\n-- Example usage\nlocal distance = calculateChebyshevDistance(0,\
    \ 0, 3, 4)\nprint(\"Chebyshev distance:\", distance)  -- Output: 4\n```\n\n###\
    \ Distance Between 3D Points\n\nIf you're working in a 3D environment, the distance\
    \ between two points `(x1, y1, z1)` and `(x2, y2, z2)` can be calculated using\
    \ the Euclidean distance formula with an additional dimension (z) added:\n\n`Distance\
    \ = √((x2 - x1)^2 + (y2 - y1)^2 + (z2 - z1)^2)`\n\nLet's implement a function\
    \ to calculate the Euclidean distance between two 3D points in Lua:\n\n```lua\n\
    -- Function to calculate Euclidean distance between two 3D points\nfunction calculate3DEuclideanDistance(x1,\
    \ y1, z1, x2, y2, z2)\n  local dx = x2 - x1\n  local dy = y2 - y1\n  local dz\
    \ = z2 - z1\n  return math.sqrt(dx * dx + dy * dy + dz * dz)\nend\n\n-- Example\
    \ usage\nlocal distance = calculate3DEuclideanDistance(0, 0, 0, 3, 4, 5)\nprint(\"\
    3D Euclidean distance:\", distance)  -- Output: 7.071067811865\n```\n\n---\n\n\
    # Finding Angle Between Points\n\nUnderstanding how to calculate angles between\
    \ points is essential for game developers working on projects with rotating elements\
    \ and various interactive features.\n\nTo calculate the angle between two points\
    \ `(x1, y1)` and `(x2, y2)` in a 2D plane, we can use the trigonometric function\
    \ known as the arctangent (`atan2`) function. The `atan2` function is particularly\
    \ useful as it can provide the angle considering all quadrants.\n\n### Using the\
    \ atan2 Function\n\nThe `atan2` function returns the angle between the x-axis\
    \ and the line connecting the two points. It takes the differences in `y` and\
    \ `x` coordinates as input and returns the angle in radians.\n\nLet's implement\
    \ a function to calculate the angle between two points using the `atan2` function\
    \ in Lua:\n\n```lua\n-- Function to calculate angle between two points\nfunction\
    \ calculateAngleBetweenPoints(x1, y1, x2, y2)\n  local dx = x2 - x1\n  local dy\
    \ = y2 - y1\n  return math.atan2(dy, dx)\nend\n\n-- Example usage\nlocal angle\
    \ = calculateAngleBetweenPoints(0, 0, 1, 1)\nprint(\"Angle between points:\",\
    \ angle)  -- Output: 0.78539816339745 (approximately 45 degrees)\n```\n\n### Converting\
    \ Radians to Degrees\n\nIf you prefer the angle in degrees rather than radians,\
    \ you can convert it using the following formula:\n\n`Angle in degrees = Angle\
    \ in radians * (180 / pi)`\n\nLet's modify our previous function to return the\
    \ angle in degrees:\n\n```lua\n-- Function to calculate angle between two points\
    \ in degrees\nfunction calculateAngleBetweenPointsInDegrees(x1, y1, x2, y2)\n\
    \  local dx = x2 - x1\n  local dy = y2 - y1\n  local angleRadians = math.atan2(dy,\
    \ dx)\n  local angleDegrees = angleRadians * (180 / math.pi)\n  return angleDegrees\n\
    end\n```\n"
