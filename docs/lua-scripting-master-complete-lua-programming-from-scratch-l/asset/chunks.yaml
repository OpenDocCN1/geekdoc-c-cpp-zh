    \ Lua 脚本中的常见错误。\n\n### 语法错误\n\n当违反 Lua 语言规则时，就会发生语法错误。这些错误会阻止脚本运行，需要在执行前进行修复。\n\
    \n### 语法错误示例\n\n```lua\n-- 语法错误：缺少右括号\nfunction syntaxErrorExample()\n  print(\"\
