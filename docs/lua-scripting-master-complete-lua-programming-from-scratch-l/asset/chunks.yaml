    static void registerPoint(lua_State *L) {


    luaL_newmetatable(L, "Point");


    lua_pushvalue(L, -1);


    lua_setfield(L, -2, "__index");


    lua_pushcfunction(L, newPoint);


    lua_setglobal(L, "Point");


    }


