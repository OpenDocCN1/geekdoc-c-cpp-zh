    \       const char *value = lua_tostring(L, -1);\n            printf(\"%s = %s\\\
    n\", key, value);\n        } else if (lua_isnumber(L, -1)) {\n            double\
    \ value = lua_tonumber(L, -1);\n            printf(\"%s = %f\\n\", key, value);\n\
