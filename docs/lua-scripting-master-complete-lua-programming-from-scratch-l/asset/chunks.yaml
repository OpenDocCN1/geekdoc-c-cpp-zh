  trans: "\n\n# 使用 REPL 使用 Lua\n\n欢迎来到完整 Lua 脚本课程的第一章！在本章中，我们将通过学习如何使用 REPL（读取-评估-打印循环）来开启\
    \ Lua 之之旅，这是一个用于交互式学习和实验的绝佳工具。\n\n## 什么是 REPL？\n\nREPL 是 Read-Eval-Print Loop（读取-评估-打印循环）的缩写，是一个允许你执行代码片段并立即查看结果的功能。这是实验\
    \ Lua 和测试不同概念的一种极佳方法，无需编写完整的程序。我们将使用 REPL 来感受这种语言，并理解 Lua 在各种场景下的行为。\n\n## 开始使用\
    \ REPL：\n\nLua 像某些其他编程语言那样内置了 REPL 工具，但不用担心；我们为你提供了一个优质的解决方案。如果你已经在你的平台上安装了 Lua，可以打开终端或命令提示符并输入以下命令：\n\
    \n```\nlua\n```\n\n这将启动 Lua 解释器，你将看到 Lua 提示符等待你的命令：\n\n```\nLua 5.3.5  Copyright\
    \ (C) 1994-2018 Lua.org, PUC-Rio\n>\n```\n\n如果你看到这个提示符，恭喜！你现在处于 Lua REPL 环境中并准备好开始实验。\n\
    \n## 在 REPL 中使用 Lua：\n\n让我们从尝试一些基础 Lua 表达式开始。在提示符处输入以下内容并回车：\n\n```\nprint(\"\
    Hello, world!\")\n```\n\n你应该能在命令下方看到输出的 \"Hello, world!\"。在 Lua 中，`print` 函数用于向控制台输出。你可以在实验中使用它来打印字符串、数字和其他值。\n\
    \n## 变量和表达式：\n\n接下来，让我们探索 Lua 中的变量和表达式。在 REPL 中，尝试以下操作：\n\n```lua\nlocal x = 10\n\
    local y = 5\nlocal sum = x + y\nprint(sum)\n```\n\n你应该能看到控制台打印出结果 \"15\"。在这个例子中，我们声明了两个变量\
    \ `x` 和 `y`，并分别为它们赋值为 `10` 和 `5`，然后使用 `+` 运算符执行加法。结果存储在变量 `sum` 中，我们使用 `print`\
    \ 打印了它。\n\n## 条件语句：\n\nLua 还支持 `if`、`else` 和 `elseif` 等条件语句。让我们尝试一个简单的例子：\n\n\
    ```lua\nlocal age = 25\nif age < 18 then\n  print(\"You are a minor.\")\nelse\n\
    \  print(\"You are an adult.\")\nend\n```\n\n你会看到打印出 \"You are an adult.\"，因为变量\
    \ `age` 被设置为 `25`，它大于等于 `18`。\n\n## 循环：\n\nLua 的另一个重要方面是它对循环的支持。让我们实验一个 for 循环：\n\
    \n```lua\nfor i = 1, 5 do\n  print(\"Iteration number:\", i)\nend\n```\n\n这将打印从\
    \ 1 到 5 的数字，每个数字占一行。\n\n## 退出 REPL：\n\n要退出 REPL 环境，只需输入 `exit()` 并回车。\n\n## 在\
    \ Replit 中使用 REPL：\n\n如果你在本地机器上没有安装 Lua，或者倾向于使用在线环境，可以使用 Replit。访问 Replit 网站并创建一个新的\
    \ Lua repl。你会看到一个类似的界面，可以在其中尝试我们涵盖的所有示例和实验。\n\n在本章中，我们探索了如何使用 REPL 使用 Lua，这是一个交互式实验语言的强大工具。我们涵盖了基础命令、变量、表达式、条件语句和循环，为课程的其余部分奠定了坚实的基础。\n\
    \n记住，REPL 是学习和快速测试代码片段的极佳方法，请尽管进一步实验，并熟悉 Lua 的语法和特性。\n\n在下一章中，我们将深入如何在各种平台上安装\
    \ Lua，确保你拥有必要的工具来继续你的 Lua 脚本之旅。在我们从零开始掌握 Lua 编程的过程中，让我们保持这种热情吧！\n\n# 在 Linux 上安装\
    \ Lua\n\n在本章中，我们将引导你完成在 Linux 系统上安装 Lua 的过程。无论你使用的是 Ubuntu、Fedora、CentOS 还是任何其他\
    \ Linux 发行版，安装步骤通常都是相同的。\n\n### 第 1 ：检查是否已安装 Lua\n\n在继续安装之前，让我们检查系统是否已经安装了 Lua。打开终端并输入以下命令：\n\
    \n```bash\nlua -v\n```\n\n如果 Lua 已经安装，你将在屏幕上看到打印的版本号。如果没有，你将得到一个错误，指示找不到命令 `lua`，这意味着你需要安装\
    \ Lua。\n\n### 第 2 ：安装 Lua\n\n要安装 Lua，我们将使用特定于你 Linux 发行版的包管理器。对于 Ubuntu 和基于 Debian\
    \ 的系统，使用 `apt` 包管理器。对于 Fedora 和基于 Red Hat 的系统，使用 `dnf` 或 `yum`。\n\n对于 Ubuntu 和基于\
    \ Debian 的系统，输入以下命令：\n\n```bash\nsudo apt-get update\nsudo apt-get install lua5.3\n\
    ```\n\n对于 Fedora 和基于 Red Hat 的系统，使用：\n\n```bash\nsudo dnf install lua\n```\n\n\
    ### 第 3 步：验证安装\n\n安装完成后，你可以再次检查 Lua 版本以验证是否安装成功。输入：\n\n```bash\nlua -v\n```\n\n\
    你应该能看到屏幕上显示的 Lua 版本号，表示 Lua 已成功安装在你的 Linux 系统上。\n\n## 在 Linux 上使用 Lua 交互式解释器 (REPL)：\n\
    \n现在你已经安装了 Lua，可以使用交互解释器（REPL）尝试简单的 Lua 脚本。打开终端并输入：\n\n```bash\nlua\n```\n\n这将启动\
    \ REPL，你可以在其中输入命令并查看输出。\n\n```lua\nprint(\"Hello, Linux!\")\n```\n\n## 运行 Lua\
    \ 脚本：\n\n除了交互解释器，你还可以运行保存为文件的脚本。创建一个名为 `myscript.lua` 的新文件，内容如下：\n\n```lua\nlocal\
    \ name = \"John\"\nprint(\"Hello, \" .. name .. \"!\")\n```\n\n保存文件，然后在终端执行：\n\
    \n```bash\nlua myscript.lua\n```\n\n你将看到输出 \"Hello, John!\"。你已成功在 Linux 系统上安装了\
    \ Lua 并运行了脚本。这将是你后续课程中深入研究 Lua 脚本及其与 C 集的基础。\n\n# 在 macOS 上安装 Lua\n\n在本章中，我们将引导你在\
    \ macOS 上安装 Lua。无论你使用的是 macOS Catalina、Big Sur 还是任何其他版本，安装步骤都很直观。\n\n### 第 1 步：检查是否已安装\
    \ Lua\n\n在继续安装之前，让我们检查系统是否已经安装了 Lua。打开终端并输入以下命令：\n\n```bash\nlua -v\n```\n\n如果\
    \ Lua 已经安装，你将在屏幕上看到打印的版本号。如果没有，你将得到一个错误，指示找不到命令 `lua`，这意味着你需要安装 Lua。\n\n### 第\
    \ 2 步：使用 Homebrew 安装\n\n要在 macOS 上安装 Lua，我们将使用 Homebrew，这是一个流行的 macOS 包管理器。如果你还没有安装\
    \ Homebrew，可以通过在终端运行以下命令进行安装：\n\n```bash\n/bin/bash -c \"$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)\"\
    \n```\n\nHomebrew 安装完成后，你可以运行以下命令安装 Lua：\n\n```bash\nbrew install lua\n```\n\n\
    ### 第 3 步：验证安装\n\n安装完成后，你可以再次检查 Lua 版本以验证是否安装成功。\n\n"
