    \n# 游戏循环\n\n在本章中，我们将深入探讨游戏开发的核心——游戏循环（Game Loop）。游戏循环是游戏开发中的一个基础概念，负责在持续循环中处理更新、渲染和用户输入。我们将探索如何使用\
    \ SDL 和 Lua 在 C 中实现一个简单的游戏循环，并创建一个基础游戏。\n\n### 理解游戏循环\n\n游戏循环是一个贯穿游戏整个生命周期的持续循环。它执行以下主要任务：\n\
    \n- **处理用户输入**：收集并处理用户输入，例如键盘和鼠标事件。\n- **更新游戏逻辑**：计算游戏状态的变化，包括对象的位置、得分和其他游戏特定的变量。\n\
    - **渲染**：将更新后的游戏状态绘制到屏幕上，为玩家创造视觉体验。\n\n### 第 1 步：设置 SDL 和 Lua\n\n在创建游戏循环之前，请确保你按照之前章节提供的说明正确安装了\
    \ SDL 和 Lua（SDL 参考第 63 章，Lua 参考第 5 章）。\n\n### 第 2 步：初始化 SDL\n\n在我们的 C 代码中，我们需要初始化\
    \ SDL，就像我们创建 SDL 窗口时一样：\n\n```c\n#include <SDL2/SDL.h>\n\nint main() {\n  // Initialize\
    \ SDL\n\n  if (SDL_Init(SDL_INIT_VIDEO) < 0) {\n    printf(\"SDL could not initialize!\
    \ SDL_Error: %s\\n\", SDL_GetError());\n    return -1;\n  }\n\n  // 其余代码在此处...\n\
    }\n```\n\n### 第 3 步：创建游戏循环\n\n为了创建游戏循环，我们将使用一个 `while` 循环，直到玩家退出游戏。在循环内部，我们将处理用户输入、更新游戏状态并渲染游戏的视觉效果。\n\
    \n```c\n#include <SDL2/SDL.h>\n\nint main() {\n  // Initialize SDL\n\n  if (SDL_Init(SDL_INIT_VIDEO)\
    \ < 0) {\n    printf(\"SDL could not initialize! SDL_Error: %s\\n\", SDL_GetError());\n\
    \    return -1;\n  }\n\n  // 创建一个 SDL 窗口（如第 64 章所述）\n  // 创建一个 SDL 渲染器（如第 66 章所述）\n\
    \  // 创建 Lua 状态并加载 Lua 脚本（如第 53 章所述）\n  // 游戏循环\n\n  SDL_Event event;\n  bool\
    \ isRunning = true;\n\n  while (isRunning) {\n    // 处理事件\n\n    while (SDL_PollEvent(&event))\
    \ {\n      if (event.type == SDL_QUIT) {\n        isRunning = false;\n      }\n\
    \      // 如果需要，在此处理其他输入事件（例如键盘、鼠标）\n    }\n\n    // 使用 Lua 更新游戏逻辑（调用 Lua 函数来更新游戏状态）\n\
