    \ of a Syntax Error\n\n```lua\n-- Incorrect syntax: missing closing parenthesis\n\
    function syntaxErrorExample()\n  print(\"Hello, Lua!\"\nend\n```\n\n### Semantic\
    \ Errors\n\nSemantic errors, also known as logic errors, occur when the code runs\
    \ without any syntax issues, but it doesn't produce the expected or desired result\
    \ due to flawed logic.\n\n### Example of a Semantic Error\n\n```lua\n-- Incorrect\
    \ logic: expecting the sum of two numbers, but subtracting them instead\nfunction\
    \ semanticErrorExample()\n  local x = 10\n  local y = 5\n  local result = x -\
