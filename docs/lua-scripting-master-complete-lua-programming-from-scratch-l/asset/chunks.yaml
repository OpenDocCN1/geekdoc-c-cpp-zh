    \ Lua website. Follow these steps:\n\n1. Open your web browser and go to the Lua\
    \ official website: `https://www.lua.org/`\n2. Click on the \"Download\" link\
    \ from the menu at the top.\n3. Scroll down to the \"Windows Binaries\" section\
    \ and click on the link corresponding to the latest version of Lua for Windows.\n\
    4. Once the download is complete, locate the downloaded file (e.g., `lua-5.x.x_Win64_bin.zip`)\
    \ and extract its contents to a folder of your choice. You can use any unzip utility,\
    \ such as 7-Zip or WinRAR.\n\n### Step 2: Adding Lua to the System PATH\n\nTo\
    \ use Lua from the command prompt in any directory, you need to add the Lua executable\
    \ path to the system PATH.\n\n1. Press the \"Windows key\" + \"R\" on your keyboard\
    \ to open the \"Run\" dialog.\n2. Type `sysdm.cpl` and click \"OK\" to open the\
    \ System Properties window.\n3. In the System Properties window, go to the \"\
    Advanced\" tab and click on the \"Environment Variables\" button.\n4. In the Environment\
    \ Variables window, locate the `Path` variable under the \"System variables\"\
    \ section and click \"Edit.\"\n5. Click \"New\" and add the path to the Lua executable\
    \ (e.g., `C:\\path\\to\\lua-5.x.x_Win64_bin`) to the list of paths.\n6. Click\
    \ \"OK\" to save the changes.\n\n### Step 3: Verifying the Installation\n\nNow\
    \ that Lua is installed and added to the system PATH, you can verify the installation\
    \ by opening a new command prompt window. Type the following command:\n\n```bash\n\
    lua -v\n```\n\nYou should see the Lua version number displayed on the screen,\
    \ indicating that Lua has been installed successfully on your Windows system.\n\
    \n## Using Lua Interactive Interpreter (REPL) on Windows\n\nNow that you have\
    \ Lua installed, you can use the interactive interpreter (REPL) to try out simple\
    \ Lua scripts. Open a command prompt window and type:\n\n```bash\nlua\n```\n\n\
    This will launch the Lua REPL, where you can type Lua commands and see their immediate\
    \ output.\n\n```lua\nprint(\"Hello, Windows!\")\n```\n\nYou should see the output\
