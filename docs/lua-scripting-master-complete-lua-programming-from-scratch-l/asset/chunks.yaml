    \ C 函数：\n\n```c\n// 读取 Lua 表的 C 函数\nstatic int readTable(lua_State *L) {\n   \
    \ // 检查参数是否为表\n    luaL_checktype(L, 1, LUA_TABLE);\n    // 读取并打印表的值\n    lua_pushnil(L);\n\
