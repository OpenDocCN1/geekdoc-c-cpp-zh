    Section 4:


    Strings and Standard Library Modules


    String Manipulation


    Strings are essential in game development for displaying text, managing user input,
    and creating interactive experiences. Learning how to manipulate strings effectively
    will empower you to create dynamic and engaging gameplay elements.


    Concatenation:


    Concatenation is the process of combining two or more strings to form a single
    string. In Lua, we can use the ".." operator for concatenation.


    Let''s see an example of concatenating strings to display a message to the player:


    local playerName = "John"


    local message = "Welcome, " .. playerName .. "!"


    print(message)


    In this example, the output will be "Welcome, John!"


    String Length:


    To determine the length of a string, we use the built-in function "string.len()".


    Let''s find the length of a player''s name:


    local playerName = "Alice"


    local nameLength = string.len(playerName)


    print("The length of the player''s name is: " .. nameLength)


    The output will be "The length of the player''s name is: 5".


    Substring Extraction:


    You can extract a portion of a string using the "string.sub()" function. This
    is useful for processing specific parts of strings.


    Let''s extract a substring from a player''s message:


    local message = "Hello, Lua!"


    local extracted = string.sub(message, 7)


    print("Extracted: " .. extracted)


    The output will be "Extracted: Lua!".


    String Repetition:


    You can repeat a string multiple times using the "string.rep()" function.


    Let''s create a pattern of stars for a game interface:


    local stars = string.rep("*", 10)


    print(stars)


    The output will be "**********".


    String Find and Replace:


    The "string.find()" function allows you to find the first occurrence of a pattern
    in a string. Additionally, you can use the "string.gsub()" function to replace
    occurrences of a pattern with another string.


    Let''s find and replace a word in a sentence:


    local sentence = "The quick brown fox jumps over the lazy dog."


    local wordToFind = "fox"


    local replacement = "cat"


    local foundStart, foundEnd = string.find(sentence, wordToFind)


    if foundStart then


    local newSentence = string.gsub(sentence, wordToFind, replacement)


    print(newSentence)


    else


    print("Word not found.")


    end


    The output will be "The quick brown cat jumps over the lazy dog."


    String Formatting:


    String formatting allows you to create dynamic strings with placeholders. You
    can use the "string.format()" function for this purpose.


    Let''s format a message for displaying player health:


    local playerName = "Alex"


    local playerHealth = 85


    local message = string.format("%s''s health: %d", playerName, playerHealth)


    print(message)


    The output will be "Alex''s health: 85".


    String manipulation is a powerful aspect of Lua scripting, and it''s a crucial
    skill for game developers. In this chapter, we''ve covered concatenation, string
    length, substring extraction, string repetition, finding and replacing, and string
    formatting.


    Understanding these string manipulation techniques will enable you to create dynamic
    and interactive in-game text, user interfaces, and more. As you progress through
    the course, practice applying these concepts to enhance your game development
    skills with Lua.


    In the next chapter, we will delve into "Multi-line Strings" and explore how they
    can be used for various game development tasks.


    Multi-line Strings


    Multi-line strings allow us to work with text that spans across multiple lines,
    making it convenient for storing large blocks of text, code snippets, or even
    creating game assets like level designs and dialogues.


    Creating Multi-line Strings:


    In Lua, we can create multi-line strings using double square brackets "[[" and
    "]]". Any text placed between these brackets, including line breaks, will be preserved
    exactly as written.


    Let''s create a multi-line string containing a game level layout:


    local levelLayout = [[


    ##########


    #        #


    #  @     #


    #        #


    ##########


    ]]


    print(levelLayout)


    The output will be:


    ##########


    #        #


    #  @     #


    #        #


    ##########


    Escaping Characters:


    Since multi-line strings preserve the text as-is, escaping characters like backslashes
    "" is not necessary. This is particularly useful when dealing with file paths
    or regular expressions.


    local filePath = [[C:\Game\Assets\Character.png]]


    print(filePath)


    The output will be "C:\Game\Assets\Character.png".


    Creating Templates with Multi-line Strings:


    Multi-line strings are great for creating templates where we can inject dynamic
    values into the text. We can use placeholders, such as "%s" for strings or "%d"
    for numbers, and then use the "string.format()" function to fill in the values.


    Let''s create a template for displaying a player''s statistics:


    local playerName = "John"


    local playerHealth = 100


    local playerScore = 500


    local statsTemplate = [[


    Player: %s


    Health: %d


    Score: %d


    ]]


    local playerStats = string.format(statsTemplate, playerName, playerHealth, playerScore)


    print(playerStats)


    The output will be:


    Player: John


    Health: 100


    Score: 500


    Embedding Code in Multi-line Strings:


    We can also embed Lua code within multi-line strings using the concatenation operator
    "..". This is useful when defining complex data structures like tables or JSON-like
    objects.


    Let''s create a table representing a game character using embedded Lua code:


    local characterData = [[


    {


    "name": "Hero",


    "health": 100,


    "attack": 50,


    "defense": 30


    }


    ]]


    print(characterData)


    The output will be:


    {


    "name": "Hero",


    "health": 100,


    "attack": 50,


    "defense": 30


    }


    Multi-line strings are a versatile feature of Lua that enhance the readability
    and maintainability of your code and game assets. They provide a convenient way
    to work with large blocks of text and create templates for dynamic content.


    In this chapter, we''ve covered creating multi-line strings, escaping characters,
    using templates with placeholders, and embedding Lua code within multi-line strings.
    As you progress through the course, practice leveraging multi-line strings to
    streamline your game development workflow and manage text-based assets effectively.


    In the next chapter, we will explore "Reading the Contents of a File" and discover
    how to load external data into our Lua scripts, a fundamental skill for game development.


    Reading the Contents of a File


    As a game developer, you''ll often need to load external data, such as level layouts,
    configuration files, or even save states, from files. Lua provides straightforward
    methods to read and process data from files, enhancing the flexibility and reusability
    of your game projects.


