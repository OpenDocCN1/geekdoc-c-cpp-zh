    Finding Distance Between Points


    As game developers, understanding how to calculate distances between objects in
    your game world is crucial for various gameplay mechanics, such as collision detection,
    pathfinding, and more.


    Euclidean Distance:


    The Euclidean distance between two points (x1, y1) and (x2, y2) in a 2D plane
    is given by the formula:


    Distance = √((x2 - x1)^2 + (y2 - y1)^2)


    Let''s implement a function to calculate the Euclidean distance between two points
    in Lua:


    -- Function to calculate Euclidean distance between two points


    function calculateEuclideanDistance(x1, y1, x2, y2)


    local dx = x2 - x1


    local dy = y2 - y1


    return math.sqrt(dx * dx + dy * dy)


    end


    -- Example usage


    local distance = calculateEuclideanDistance(0, 0, 3, 4)


    print("Euclidean distance:", distance)  -- Output: 5


    Manhattan Distance:


    The Manhattan distance (also known as the city block distance) between two points
    (x1, y1) and (x2, y2) is given by the formula:


    Distance = |x2 - x1| + |y2 - y1|


    Let''s implement a function to calculate the Manhattan distance between two points
    in Lua:


    -- Function to calculate Manhattan distance between two points


    function calculateManhattanDistance(x1, y1, x2, y2)


    local dx = math.abs(x2 - x1)


    local dy = math.abs(y2 - y1)


    return dx + dy


    end


    -- Example usage


    local distance = calculateManhattanDistance(0, 0, 3, 4)


    print("Manhattan distance:", distance)  -- Output: 7


    Chebyshev Distance:


    The Chebyshev distance between two points (x1, y1) and (x2, y2) is the maximum
    of the absolute differences in their coordinates:


    Distance = max(|x2 - x1|, |y2 - y1|)


    Let''s implement a function to calculate the Chebyshev distance between two points
    in Lua:


    -- Function to calculate Chebyshev distance between two points


    function calculateChebyshevDistance(x1, y1, x2, y2)


    local dx = math.abs(x2 - x1)


    local dy = math.abs(y2 - y1)


    return math.max(dx, dy)


    end


    -- Example usage


    local distance = calculateChebyshevDistance(0, 0, 3, 4)


    print("Chebyshev distance:", distance)  -- Output: 4


    Distance Between 3D Points:


    If you''re working in a 3D environment, the distance between two points (x1, y1,
    z1) and (x2, y2, z2) can be calculated using the Euclidean distance formula with
    an additional dimension (z) added:


    Distance = √((x2 - x1)^2 + (y2 - y1)^2 + (z2 - z1)^2)


    Let''s implement a function to calculate the Euclidean distance between two 3D
    points in Lua:


    -- Function to calculate Euclidean distance between two 3D points


    function calculate3DEuclideanDistance(x1, y1, z1, x2, y2, z2)


    local dx = x2 - x1


    local dy = y2 - y1


    local dz = z2 - z1


    return math.sqrt(dx * dx + dy * dy + dz * dz)


    end


    -- Example usage


    local distance = calculate3DEuclideanDistance(0, 0, 0, 3, 4, 5)


    print("3D Euclidean distance:", distance)  -- Output: 7.0710678118655


    In this chapter, we explored various techniques to "Find Distance Between Points"
    in Lua scripting. We covered the Euclidean, Manhattan, and Chebyshev distance
    formulas for both 2D and 3D points. These calculations are fundamental in game
    development for implementing essential mechanics like collision detection, character
    movement, pathfinding, and much more.


    By mastering the art of distance calculations, you''ll take your Lua scripting
    skills to new heights and create captivating games with smooth and immersive gameplay.


    In the next chapter, we''ll venture into the world of "Finding Angle Between Points"
    and uncover the secrets of computing angles in Lua, perfect for games with rotating
    elements or aiming mechanics.


    Finding Angle Between Points


    Understanding how to calculate angles between points is essential for game developers
    working on projects with rotating elements, aiming mechanics, and various interactive
    gameplay features.


    To calculate the angle between two points (x1, y1) and (x2, y2) in a 2D plane,
    we can use the trigonometric function known as the arctangent (atan2) function.
    The atan2 function is particularly useful as it can provide the angle considering
    all four quadrants.


    Using the atan2 Function:


    The atan2 function returns the angle between the x-axis and the line connecting
    the two points. It takes the differences in y and x coordinates as input and returns
    the angle in radians.


    Let''s implement a function to calculate the angle between two points using the
    atan2 function in Lua:


    -- Function to calculate angle between two points


    function calculateAngleBetweenPoints(x1, y1, x2, y2)


    local dx = x2 - x1


    local dy = y2 - y1


    return math.atan2(dy, dx)


    end


    -- Example usage


    local angle = calculateAngleBetweenPoints(0, 0, 1, 1)


    print("Angle between points:", angle)  -- Output: 0.78539816339745 (approximately
    45 degrees)


    Converting Radians to Degrees:


    If you prefer the angle in degrees rather than radians, you can convert it using
    the following formula:


    Angle in degrees = Angle in radians * (180 / pi)


    Let''s modify our previous function to return the angle in degrees:


    -- Function to calculate angle between two points in degrees


    function calculateAngleBetweenPointsInDegrees(x1, y1, x2, y2)


    local dx = x2 - x1


    local dy = y2 - y1


    local angleRadians = math.atan2(dy, dx)


    local angleDegrees = angleRadians * (180 / math.pi)


    return angleDegrees


    end


    -- Example usage'
