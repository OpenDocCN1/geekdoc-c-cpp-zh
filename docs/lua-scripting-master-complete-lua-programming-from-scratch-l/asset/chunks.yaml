- fmt: "\nFunctions are essential building blocks in programming, and they play a\
    \ crucial role in organizing code and making it reusable. By mastering functions,\
    \ you'll be equipped with a powerful tool to enhance the efficiency and structure\
    \ of your game development projects.\n\n# Section 1: Understanding Functions\n\
    \nFunctions are blocks of code that perform specific tasks and can be called multiple\
    \ times from different parts of the program. They help in modularizing the code\
    \ and reducing redundancy, which is especially valuable in game development, where\
    \ efficient code organization is essential.\n\nLet's begin by creating a simple\
    \ function that prints a welcome message to the screen.\n\n```lua\n-- Defining\
    \ a simple function\nfunction printWelcomeMessage()\n    print(\"Welcome to Lua\
    \ Scripting for Game Development!\")\nend\n\n-- Calling the function\nprintWelcomeMessage()\n\
    ```\n\nIn this example, we defined a function named `printWelcomeMessage` that\
    \ prints a welcome message when called. The `function` keyword is used to declare\
    \ a function, followed by the function name and a pair of parentheses `()`.\n\n\
    # Section 2: Function Parameters and Return Values\n\nFunctions can take input\
    \ parameters and return values, making them even more versatile. Let's create\
    \ a function that calculates the sum of two numbers and returns the result.\n\n\
    ```lua\n-- Function to calculate the sum of two numbers\nfunction addNumbers(num1,\
    \ num2)\n    local sum = num1 + num2\n    return sum\nend\n\n-- Calling the function\
    \ and storing the result in a variable\nlocal result = addNumbers(10, 5)\nprint(\"\
    The sum is: \" .. result)\n```\n\nIn this example, the function `addNumbers` takes\
    \ two input parameters `num1` and `num2`, and it calculates their sum, which is\
    \ then returned using the `return` keyword.\n\n# Section 3: Function Scope\n\n\
    Functions in Lua have their own scope, which means variables defined inside a\
    \ function are local to that function and cannot be accessed outside of it.\n\n\
    ```lua\n-- Function to demonstrate variable scope\nfunction demonstrateScope()\n\
    \    local x = 10  -- Local variable\n    print(\"Inside the function: \" .. x)\n\
    end\n\ndemonstrateScope()\nprint(\"Outside the function: \" .. x)  -- This will\
    \ cause an error\n```\n\nIn this example, we defined a local variable `x` inside\
    \ the `demonstrateScope` function. When we try to access `x` outside the function,\
    \ it will result in an error since the variable is not in the global scope.\n\n\
    # Section 4: Recursive Functions\n\nLua supports recursive functions, which are\
    \ functions that call themselves during their execution. They are useful for solving\
    \ problems that can be broken down into smaller, similar sub-problems.\n\nLet's\
    \ create a recursive function to calculate the factorial of a given number.\n\n\
    ```lua\n-- Recursive function to calculate factorial\nfunction factorial(n)\n\
    \    if n == 0 then\n        return 1\n    else\n        return n * factorial(n\
    \ - 1)\n    end\nend\n\n-- Calling the function\nlocal number = 5\nlocal result\
    \ = factorial(number)\nprint(\"Factorial of \" .. number .. \" is: \" .. result)\n\
    ```\n\nIn this example, the `factorial` function calls itself with a smaller value\
    \ of `n` until `n` becomes 0, which is the base case for the recursion.\n\nIn\
    \ this chapter, we explored the fascinating world of functions in Lua. We learned\
    \ how to create functions, pass parameters, and return values. Functions are powerful\
    \ tools that allow us to organize code efficiently and make it reusable, making\
    \ them indispensable in game development.\n\nBy mastering functions, you can design\
    \ cleaner and more maintainable code for your game projects. They will play a\
    \ crucial role in the \"Loops and Functions\" section of this book as we continue\
    \ to build more sophisticated gameplay mechanics and features.\n\n# Section 6:\
    \ Tables\n\n## Tables in Lua\n\nIn this section, we will explore one of the most\
    \ powerful data structures in Lua: tables. Tables are a fundamental concept in\
    \ Lua and are used extensively in game development.\n\n### Section 1: Introduction\
    \ to Tables\n\nIn Lua, a table is a collection of key-value pairs used to organize\
    \ data. Let's begin by creating a simple table to represent character.\n\n```lua\n\
    -- Creating a table to represent character\nlocal character = {\n    name = \"\
    Hero\",\n    level = 10,\n    health = 100,\n    mana = 50\n}\n\n-- Accessing\
    \ table elements\nprint(\"name: \" .. character.name)\nprint(\"level: \" .. character.level)\n\
    print(\"health: \" .. character.health)\nprint(\"mana: \" .. character.mana)\n\
    ```\n\n### Section 2: Adding and Modifying Table Elements\n\nTables in Lua are\
    \ dynamic, meaning you can add or modify elements after the table is created.\n\
    \n```lua\n-- Adding new elements\ncharacter.attackPower = 25\ncharacter.defense\
    \ = 15\n\n-- Modifying existing elements\ncharacter.health = 120\n\n-- Accessing\
    \ the updated table\nprint(\"attack power: \" .. character.attackPower)\nprint(\"\
    defense: \" .. character.defense)\nprint(\"health: \" .. character.health)\n```\n\
    \n### Section 3: Looping Through Table Elements\n\nLooping through table elements\
    \ is a common operation. Lua provides several ways to iterate over tables.\n\n\
    ```lua\n-- Looping through table elements using a loop\nfor key, value in pairs(character)\
    \ do\n    print(key .. \": \" .. value)\nend\n```\n\n### Section 4: Removing Table\
    \ Elements\n\nYou can remove elements from a table using the `table.remove` function.\n\
    \n```lua\n-- Removing an element from the table\ntable.remove(character, \"mana\"\
    )\n\n-- Accessing the updated table after removal\nprint(\"Updated table after\
