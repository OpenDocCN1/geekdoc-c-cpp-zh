    ### math.atan 函数


    `math.atan` 函数接收单个参数并返回该值的反正切值。它主要用于计算 x 轴与从原点 (0, 0) 出发并终止指定点 (x, y) 的直线之间的弧度角。


    ```lua

    -- 使用 math.atan 计算弧度角度

    local x = 1

    local y = 1


    local angleRadians = math.atan(y / x)


