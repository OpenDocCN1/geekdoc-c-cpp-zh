    \ of the class. Let's create two player objects:\n\n```lua\n-- Create instances\
    \ of the Player class\nlocal player1 = Player.new(\"John\", 100)\nlocal player2\
    \ = Player.new(\"Jane\", 150)\n```\n\nIn this code snippet, we instantiated two\
    \ player objects, `player1` and `player2`, with their unique names and health\
    \ values.\n\n## Accessing Object Data and Methods\n\nNow that we have our player\
    \ objects, we can access their data and call their methods. In Lua, we use the\
    \ colon syntax (`:`) to define methods, which implicitly receives the object as\
    \ its first parameter. Let's add a method to display player information:\n\n```lua\n\
    -- Method to display player info\nfunction Player:displayInfo()\n    print(\"\
    Player:\", self.name, \"| Health:\", self.health)\nend\n```\n\nWith this method\
    \ in place, we can now display the information of our player objects:\n\n```lua\n\
    player1:displayInfo() -- Output: Player: John | Health: 100\nplayer2:displayInfo()\
    \ -- Output: Player: Jane | Health: 150\n```\n\n## Inheritance and Polymorphism\n\
    \nLua allows us to implement simple inheritance and polymorphism through metatables.\
    \ We can create subclasses that inherit behavior from parent classes and override\
