    \ outcome.\n\n```lua\n-- Example: Using \"break\" to exit the loop\nfor i = 1,\
    \ 10 do\n    if i == 5 then\n        print(\"Reached iteration 5, breaking out\
    \ of the loop.\")\n        break\n    end\n    print(\"Iteration:\", i)\nend\n\
    ```\n\n### Loop \"continue\" statement (Using \"goto\"):\n\nIn Lua, there is no\
    \ built-in `continue` statement like in some other programming languages. However,\
    \ we can simulate the behavior using the `goto` statement to skip specific iterations\
    \ based on certain conditions.\n\n```lua\n-- Example: Using \"goto\" to skip iterations\n\
    for i = 1, 10 do\n    if i % 2 == 1 then\n        goto continue\n    end\n   \
    \ print(\"Even Iteration:\", i)\n::continue::\nend\n```\n\n### Loop \"continue\"\
    \ statement (Without \"goto\"):\n\nTo avoid using `goto`, we can achieve the same\
    \ effect using an `if` statement to skip iterations based on the condition.\n\n\
    ```lua\n-- Example: Using \"continue\" without \"goto\"\nfor i = 1, 10 do\n  \
    \  if i % 2 ~= 1 then\n        -- Skip odd iterations\n        print(\"Even Iteration:\"\
