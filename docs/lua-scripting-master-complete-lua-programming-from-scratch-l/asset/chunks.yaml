    Installing SDL


    Welcome to Chapter 63 of "Lua Scripting: Master complete Lua Programming from
    scratch." In this chapter, we''ll focus on installing the SDL (Simple DirectMedia
    Layer) library, an essential step in integrating Lua with C for game development.


    What is SDL?


    SDL is a popular cross-platform development library that provides a simple API
    for low-level access to audio, keyboard, mouse, joystick, and graphics hardware.
    It is widely used in game development to create 2D and 3D games and multimedia
    applications.


    Step 1: Downloading SDL


    To get started, let''s download the SDL library appropriate for your platform.
    SDL supports various platforms like Windows, macOS, and Linux. You can download
    the SDL library from the official website: https://www.libsdl.org/download-2.0.php


    Step 2: Installing SDL on Windows


    For Windows users, follow these steps to install SDL:


    Download the SDL2 development libraries for Windows (SDL2-devel-2.0.x-VC.zip)
    from the SDL website.


    Extract the downloaded zip file to a location of your choice.


    Inside the extracted folder, you''ll find a subfolder named "SDL2-2.0.x." Copy
    the "SDL2.dll" file from the "lib" folder of this subfolder and paste it into
    your project''s working directory (where your executable will be).


    In your C project, create a new folder named "include" and copy the "SDL.h" header
    file from the "include" folder of the "SDL2-2.0.x" subfolder to your new "include"
    folder.


    Similarly, create another folder named "lib" in your project and copy the "SDL2.lib"
    file from the "lib\x86" (for 32-bit) or "lib\x64" (for 64-bit) folder of the "SDL2-2.0.x"
    subfolder to your new "lib" folder.


    Make sure to link the "SDL2.lib" library in your project settings.


    Step 3: Installing SDL on macOS


    For macOS users, follow these steps to install SDL:


    Download the SDL2 development libraries for macOS (SDL2-2.0.x.dmg) from the SDL
    website.


    Open the downloaded disk image (.dmg) file, and you''ll find an "SDL2.framework"
    folder.


    Copy the "SDL2.framework" folder to either "/Library/Frameworks" (for system-wide
    installation) or to your project''s folder (for project-specific installation).


    In your C project, you can include SDL by adding the following line to your C
    code:


    #include <SDL2/SDL.h>


    When compiling your project, make sure to link the SDL framework.


    Step 4: Installing SDL on Linux


    For Linux users, SDL can be installed via the package manager. The exact commands
    may vary depending on your Linux distribution. For Ubuntu and Debian-based systems,
    you can use the following commands:


    sudo apt-get update


    sudo apt-get install libsdl2-dev


    For other Linux distributions, consult your package manager''s documentation for
    the appropriate installation commands.


    Step 5: Verifying SDL Installation


    To verify that SDL is installed correctly, you can create a simple C program that
    initializes SDL and opens a window. Here''s a minimal example:


    #include <SDL2/SDL.h>


    int main() {


    // Initialize SDL


    if (SDL_Init(SDL_INIT_VIDEO) < 0) {


    printf("SDL could not initialize! SDL_Error: %s\n", SDL_GetError());


    return -1;


    }


    // Create a window


    SDL_Window *window = SDL_CreateWindow("SDL Window", SDL_WINDOWPOS_UNDEFINED, SDL_WINDOWPOS_UNDEFINED,
    640, 480, SDL_WINDOW_SHOWN);


    if (!window) {


    printf("Window could not be created! SDL_Error: %s\n", SDL_GetError());


    return -1;


    }


    // Wait for the window to be closed


    SDL_Event event;


    while (SDL_WaitEvent(&event)) {


    if (event.type == SDL_QUIT) {


    break;


    }


    }


    // Clean up and quit


    SDL_DestroyWindow(window);


    SDL_Quit();


    return 0;


    }


    Compile and run this program according to the instructions provided in Chapter
    53\. If the SDL installation is successful, you should see a window titled "SDL
    Window" that you can close by clicking the ''x'' button.


    Congratulations! You have successfully installed SDL and verified its functionality.
    SDL is now ready to be used in your Lua and C game development projects, allowing
    you to create interactive and engaging games using the power of Lua scripting
    and the versatility of C.


    Creating a SDL Window


    In this chapter, we''ll dive into the exciting world of graphics and create an
    SDL window to provide a visual interface for our Lua and C game.


    What is SDL Window?


    The SDL window is the graphical window that serves as the canvas for your game''s
    graphics. It provides an area to display images, animations, and user interface
    elements. Creating an SDL window is the first step in building a game using the
    SDL library.


    Step 1: Setting Up SDL


    Before creating an SDL window, make sure you have correctly installed SDL following
    the instructions provided in Chapter 63\. Once SDL is installed, we can proceed
    to set up the window.


    Step 2: Initializing SDL


    To create an SDL window, we first need to initialize the SDL library. In our C
    code, we will include the necessary SDL header file:


    #include <SDL2/SDL.h>


