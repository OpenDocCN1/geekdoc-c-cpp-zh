    在这个示例中，我们使用了变量 `apples` 和 `oranges` 来计算水果的总数，并使用 `playerName` 变量来创建个性化的欢迎消息。`score`
    变量被用在 `if-else` 条件语句中，以便根据玩家的表现提供反馈。


    ### 变量的作用域


    Lua 中的变量具有不同的作用域，这取决于它们声明的位置。如果变量在任何函数之外声明，它将成为一个全局变量，可以在整个脚本中访问。如果变量在函数内部使用 `local`
    关键字声明，它将成为一个局部变量，仅在该函数内部可访问。


    ```lua

    local globalVariable = 10


    function myFunction()

    local localVariable = 5

    print(globalVariable)   -- Output: 10

    print(localVariable)     -- Output: 5

    end


    myFunction()

    print(globalVariable)         -- Output: 10

    print(localVariable)         -- Output: nil (变量在函数外部无法访问)

    ```


    在本章中，我们涵盖了 Lua 变量的核心概念。我们学习了如何声明变量、为它们赋值以及在表达式中使用它们。此外，我们还探索了不同的数据类型变量的作用域。


    变量在游戏开发和脚本编写中起着至关重要的作用，允许你为玩家创建动态且交互的体验。


    ### 旧版本的 Lua 和 REPL


    在本章中，我们将探索旧版本 Lua 的某些方面，并向你介绍 `REPL`（读取-求值-打印循环）的概念。虽然我们本课程主要关注当前的 Lua 版本，但在处理遗留代码或旧项目时，理解旧版本是非常有价值的。


    #### 旧版本的 Lua


    与任何编程语言一样，Lua 随着时间的推移经过了更新和改进。某些旧版本的 Lua 可能缺少某些功能，或者与最新版本相比语法略有不同。核心概念在不同版本之间保持一致，但意识到任何差异是非常重要的，特别是在协作项目或使用来自各种来源的代码时。


    #### REPL (Read-Eval-Print Loop)


    `REPL` 代表 Read-Eval-Print Loop，它是一个交互式编程环境，允许你执行 Lua 代码段并立即查看结果。它是实验 Lua 代码、测试小部分代码或学习新概念的优秀工具。


    在旧版本的 Lua 中，`REPL` 环境可能与当前 Lua 版本提供的略有不同。然而，基本功能保持不变：你输入一行代码，对其进行求值，并将结果打印给你。


    要使用 `REPL`，请遵循以下步骤：


    1. 打开你的终端或命令提示符。

    2. 输入 `lua` 并按回车。这将启动 Lua 交互模式，也称为 `REPL`。

    3. 你将看到一个提示符，通常表示为 `lua>`。这是你输入 Lua 代码的地方。

    4. 输入一行代码后，按回车执行它。如果有输出，结果将立即打印出来。


    例如，让我们在 `REPL` 中尝试一个简单的数学计算：


    ```

    lua> print(5 + 3)

    ```


    输出将是：


    ` 8 `


    正如你所看到的，`REPL` 是一个测试代码并快速获取结果反馈的方便工具。


    **注意：** 在现代 Lua 版本（如 Lua `5.3` 及以上）中，你还可以使用在线 `REPL`（例如课程描述中提到的 `replit` 网站），无需在机器上安装任何即可实验
    Lua 代码。


    在本章中，我们简要讨论了 Lua 的旧版本和 `REPL` 。在处理遗留项目时，理解旧会有用，而 `REPL` 为测试代码段和学习 Lua 概念提供了交互式环境。


    随着课程的进展，我们将专注于 Lua 的最新版本，以确保你拥有编写 Lua 脚本的最新知识和技能。记住多尝试变量。


