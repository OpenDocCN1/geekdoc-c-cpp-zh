    Get Lua Global Values in C


    In this chapter, we''ll dive into retrieving Lua global values from C. Being able
    to access Lua variables from C code opens up endless possibilities for creating
    dynamic and data-driven applications.


    Step 1: Setting Up the Environment


    Before we begin, make sure you have completed Chapter 53, where we learned how
    to execute a Lua script from a C application. Ensure that you have the necessary
    header files and libraries installed, as well as the lua_State object initialized
    in your C project.


    Step 2: Accessing Lua Global Values


    To retrieve a Lua global value from C, we can use the Lua C API function lua_getglobal.
    This function allows us to push the value associated with a global variable onto
    the Lua stack.


    Let''s assume that our Lua script (script.lua) contains the following global variables:


    -- script.lua


    game_name = "Super Game"


    player_health = 100


    player_score = 0


    Step 3: Writing C Code


    In our C application, let''s create a function to get the Lua global values. We''ll
    call it getLuaGlobals:


    #include <stdio.h>


    #include <lua.h>


    #include <lualib.h>


    #include <lauxlib.h>


    void getLuaGlobals(lua_State *L) {


    lua_getglobal(L, "game_name");


    const char *gameName = lua_tostring(L, -1);


    printf("Game Name: %s\n", gameName);


    lua_pop(L, 1);


    lua_getglobal(L, "player_health");


    int playerHealth = lua_tointeger(L, -1);


    printf("Player Health: %d\n", playerHealth);


    lua_pop(L, 1);


    lua_getglobal(L, "player_score");


    int playerScore = lua_tointeger(L, -1);


    printf("Player Score: %d\n", playerScore);


    lua_pop(L, 1);


    }


    Step 4: Running the C Application


    In the main function, after executing the Lua script, we can call the getLuaGlobals
    function to access the Lua global values:


    int main() {


    lua_State *L = luaL_newstate();


    luaL_openlibs(L);


    // Execute the Lua script


    if (!executeLuaScript(L, "lua_scripts/script.lua")) {


    lua_close(L);


    return 1;


    }


    // Access and print Lua global values


    getLuaGlobals(L);


    lua_close(L);


    return 0;


    }


