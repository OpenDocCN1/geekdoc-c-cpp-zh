    \ We inherited the behavior of `Player` using `setmetatable`, and then we defined\
    \ a new constructor method and an overridden `displayInfo` method for the `Mage`\
    \ class.\n\nCongratulations on learning about Object-Oriented Programming in Lua!\
    \ You now have the knowledge to create classes, objects, and implement inheritance\
