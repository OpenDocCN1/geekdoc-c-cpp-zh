  trans: "\n\n现在你已经可以使用 Roblox Studio 了，可以开始探索 Lua 脚本来让你的游戏活跃起来。在 `Explorer` 窗口中右键点击“Workspace”并选择“Script”创建一个新脚本。双击该脚本打开脚本编辑器，你可以在这里开始编写你的\
    \ Lua 代码。\n\n```lua\n-- Sample Lua script\n\nlocal part = Instance.new(\"Part\"\
    )\n\npart.Anchored = true\n\npart.Position = Vector3.new(0, 5, 0)\n\npart.Parent\
    \ = game.Workspace\n```\n\n## 测试你的游戏\n\nRoblox Studio 最强大的功能之一是可以直接在编辑器内对游戏进行测试。点击“Play”（播放）按钮，你的游戏将在在一个独立的窗口中启动。这允许你快速迭代并测试游戏的功能。\n\
    \n恭喜你！你已成功安装并访问了 Roblox Studio。这标志着你使用 Lua 脚本进行游戏开发精彩之旅的开始。Roblox Studio 提供了丰富的工具和可能性，让你能够发挥创造力并构建迷人的游戏。\n\
    \n## Roblox 部件与属性\n\nRoblox Studio 提供了各种部件（Parts）和属性，允许你创建交互式和动态的游戏元素。让我们探索这些概念，以及如何利用它们来增强你的游戏开发体验。\n\
    \n### Roblox 部件简介\n\n在 Roblox 中，“Part”（部件）是一个基础构建块，代表游戏世界中的 3D 对象。部件是你创建的任何 3D\
    \ 模型或结构的主要组件。你可以在 `Toolbox`（工具箱）的“Basic Objects”（基础对象）类别下找到部件。\n\n### 创建和放置部件\n\
    \n让我们使用 Lua 脚本创建一个简单的部件并将其放置在游戏世界中。打开 Roblox Studio 并创建一个新场地。在 `Workspace` 中右键点击并选择“Script”创建一个新脚本。我们将使用这个脚本来创建并放置我们的部件。\n\
    \n```lua\n-- Create a new part\n\nlocal part = Instance.new(\"Part\")\n\n-- 设置部件的大小\
    \ (X, Y, Z 维度)\npart.Size = Vector3.new(5, 2, 3)\n\n-- 设置部件的颜色 (RGB 值：红、绿、蓝)\n\
    part.BrickColor = BrickColor.new(\"Bright blue\")\n\n-- 设置部件的位置 (X, Y, Z 坐标)\n\
    part.Position = Vector3.new(0, 5, 0)\n\n-- 将部件的父级设置为 Workspace，以便在游戏世界中可见\npart.Parent\
    \ = game.Workspace\n```\n\n### 修改部件属性\n\nRoblox 中的部件有多种可以修改的属性以实现不同的视觉效果。常见属性包括：\n\
    \n- `Size`：决定部件的尺寸。\n- `BrickColor`：设置部件的颜色。\n- `Anchored`：如果设置为 `true`，在模拟物理效果时部件将不会移动。\n\
    - `Transparency`：设置部件的透明度（0 为完全可见，1 为完全透明）。\n- `CanCollide`：如果设置为 `true`，部件可以通过物理引擎与其他部件发生交互。\n\
    \n### 创建更复杂的结构\n\n你可以通过组合多个部件来创建更复杂的结构。例如，让我们创建一个带有墙壁、屋顶和门的简单房子。\n\n```lua\n--\
    \ Create walls\n\nlocal wall1 = Instance.new(\"Part\")\nwall1.Size = Vector3.new(10,\
    \ 5, 0.2)\nwall1.Position = Vector3.new(0, 2.5, 5)\nwall1.Parent = game.Workspace\n\
    \nlocal wall2 = wall1:Clone()\nwall2.Position = Vector3.new(0, 2.5, -5)\nwall2.Parent\
    \ = game.Workspace\n\nlocal wall3 = wall1:Clone()\nwall3.Size = Vector3.new(0.2,\
    \ 5, 10)\nwall3.Position = Vector3.new(5, 2.5, 0)\nwall3.Parent = game.Workspace\n\
    \nlocal wall4 = wall3:Clone()\nwall4.Position = Vector3.new(-5, 2.5, 0)\nwall4.Parent\
    \ = game.Workspace\n\n-- Create a roof\n\nlocal roof = Instance.new(\"Part\")\n\
    roof.Size = Vector3.new(10.2, 0.2, 10.2)\nroof.Position = Vector3.new(0, 5, 0)\n\
    roof.Parent = game.Workspace\n\n-- Create a door\n\nlocal door = Instance.new(\"\
    Part\")\ndoor.Size = Vector3.new(2, 4, 0.2)\ndoor.Position = Vector3.new(2.5,\
    \ 2, 5)\ndoor.BrickColor = BrickColor.new(\"Dark orange\")\ndoor.Parent = game.Workspace\n\
    ```\n\n### 与部件交互\n\n为了让你的游戏更具交互性，你可以为部件添加脚本以响应玩家。例如，你可以创建一个脚本，当玩家触碰部件时更改其颜色。\n\
    \n```lua\nlocal part = game.Workspace.Part -- 将 \"Part\" 替换为你的部件名称\n\n-- 触摸时改变颜色的函数\n\
    local function onTouch()\n    part.BrickColor = BrickColor.new(\"Bright red\"\
    )\nend\n\n-- 将函数绑定到 \"Touched\" 事件\npart.Touched:Connect(onTouch)\n```\n\n在本章中，我们探索了\
    \ Roblox 部件和属性的世界。你学习了如何使用 Lua 脚本创建、放置和修改部件。此外，我们还深入研究了创建更复杂的结构以及让部件与玩家产生交互。\n\
    \nRoblox Studio 多功能的部件系统为设计独特的游戏世界和交互式游戏元素提供了无限可能。通过掌握这些概念，你将游刃有余。\n\n## 向量与颜色\n\
    \nRoblox Studio 多功能的部件系统为设计独特的游戏世界和交互式游戏元素提供了无限可能。通过掌握这些概念，你将游刃有余。\n\n### Roblox\
    \ 向量简介\n\n在 Roblox 中，向量（Vector）是一个表示位置或方向的数据类型。向量由三个部分组成：X、Y 和 Z。\n\n### 创建和操作向量\n\
    \n要创建一个新向量，我们使用 `Vector3.new()` 函数。让我们创建一个表示位置的向量。\n\n```lua\n-- Create a part\n\
    \nlocal part = Instance.new(\"Part\")\npart.Size = Vector3.new(5, 2, 3)\npart.Position\
    \ = Vector3.new(0, 5, 0)\npart.Anchored = true -- 防止部件因物理移动\npart.Parent = game.Workspace\n\
    ```\n\n### 用于移动的向量\n\n向量对于控制对象的移动非常有用。例如，我们可以沿着时间沿着路径移动部件。\n\n```lua\nlocal part\
    \ = game.Workspace.Part -- 将 \"Part\" 替换为你的部件名称\n\n-- 定义起始和结束位置\nlocal startPosition\
    \ = Vector3.new(0, 5, 0)\nlocal endPosition = Vector3.new(10, 5, 0)\n\n-- 定义速度\n\
    local speed = 5\n\n-- 计算方向向量\nlocal direction = (endPosition - startPosition).unit\n\
    \n-- 移动部件的函数\nlocal function movePart()\n    local deltaTime = game:GetService(\"\
    RunService\").RenderStepped:wait()\n    local distance = (endPosition - part.Position).magnitude\n\
    \    local displacement = direction * speed * deltaTime\n    if distance > displacement.magnitude\
    \ then\n        part.Position = part.Position + displacement\n    else\n     \
    \   part.Position = endPosition\n    end\nend\n\n-- 开始移动部件\nmovePart()\n```\n\n\
    ### Roblox 颜色\n\nRoblox 中的颜色使用 `BrickColor` 数据类型表示。你可以为部件、材质和其他游戏对象分配颜色以赋予特定的外观。\n\
    \n### 为部件应用颜色\n\n你可以使用 `BrickColor.new()` 函数为部件应用颜色。让我们将部件的颜色改为红色。\n\n```lua\n\
    local part = game.Workspace.Part -- 将 \"Part\" 替换为你的部件名称\n-- 将部件颜色改为红色\npart.BrickColor\
    \ = BrickColor.new(\"Bright red\")\n```\n\n### 颜色与透明度\n\n你还可以通过设置 `Transparency`\
    \ 属性来调整部件的透明度。值为 0 表示部件完全可见，值为 1 表示完全透明。\n\n```lua\nlocal part = game.Workspace.Part\
    \ -- 将 \"Part\" 替换为你的部件名称\n-- 使部件变为半透明\npart.Transparency = 0.5\n```\n\n"
- fmt: "\nIn this chapter, we explored the essential concepts of Roblox vectors and\
    \ colors. Vectors are essential for positioning and controlling the movement of\
    \ objects in 3D space, while colors allow you to give your game elements a distinct\
    \ appearance. By mastering these concepts, you can create engaging and visually\
    \ appealing games in Roblox.\n\nAs you continue your journey in game development\
    \ with Lua and Roblox Studio, experiment with vectors and colors to add dynamic\
    \ movement and stunning visual effects to your games. In the next chapter, we'll\
    \ delve into Roblox object instances and how they can be leveraged to create dynamic\
    \ and interactive game elements.\n\n# Roblox Object Instance\n\nUnderstanding\
    \ object instances is essential for creating and manipulating game elements in\
    \ Roblox Studio. Let's explore how to work with object instances and leverage\
    \ them to create dynamic and interactive gameplay.\n\n### Introduction to Roblox\
    \ Object Instances\nIn Roblox, everything you see in the game world, such as parts,\
    \ models, characters, and UI elements, is represented as an object instance. Each\
    \ object instance is associated with a specific class, and you can interact with\
    \ them using `Lua` scripts to create, modify, and manage game elements.\n\n###\
    \ Creating and Accessing Object Instances\nTo create a new object instance, we\
    \ use the `Instance.new()` function. Let's create a new part and add it to the\
    \ game world.\n\n```lua\n-- Create a new part instance\nlocal part = Instance.new(\"\
    Part\")\npart.Size = Vector3.new(5, 5, 5)\npart.Position = Vector3.new(0, 5, 0)\n\
    part.Anchored = true  -- Prevent the part from moving due to physics\npart.Parent\
    \ = game.Workspace\n```\n\n### Parent-Child Relationship\nObject instances in\
    \ Roblox form a hierarchy through a parent-child relationship. You can parent\
    \ one instance to another, creating a tree-like structure. When you remove the\
    \ parent, all the children are also removed.\n\n```lua\n-- Create a new part and\
    \ a child part\nlocal parentPart = Instance.new(\"Part\")\nparentPart.Size = Vector3.new(10,\
    \ 1, 10)\nparentPart.Position = Vector3.new(0, 10, 0)\nparentPart.Anchored = true\n\
    parentPart.Parent = game.Workspace\n\nlocal childPart = Instance.new(\"Part\"\
    )\nchildPart.Size = Vector3.new(5, 5, 5)\nchildPart.Position = Vector3.new(0,\
    \ 15, 0)\nchildPart.Anchored = true\nchildPart.Parent = parentPart\n```\n\n###\
    \ Finding Object Instances\nYou can find object instances within the game world\
    \ using their unique names or by searching through the hierarchy. The `game.Workspace`\
    \ is a common starting point for finding objects.\n\n```lua\n-- Find an object\
    \ instance by name\nlocal part = game.Workspace:FindFirstChild(\"PartName\")\n\
    \n-- Find all parts within game.Workspace\nlocal parts = game.Workspace:GetChildren()\n\
    ```\n\n### Destroying Object Instances\nWhen you no longer need an object instance,\
    \ you can remove it from the game world using the `:Destroy()` method.\n\n```lua\n\
    local part = game.Workspace.Part -- Replace \"Part\" with the name of your part\n\
    -- Wait for 5 seconds, then destroy the part\nwait(5)\npart:Destroy()\n```\n\n\
    ### Events and Object Instances\nObject instances can raise events that your `Lua`\
    \ scripts can listen to and respond accordingly. For example, you can detect when\
    \ a player clicks on a part using the `MouseButton1Click` event.\n\n```lua\nlocal\
    \ part = game.Workspace.Part -- Replace \"Part\" with the name of your part\n\
    part.MouseButton1Click:Connect(function()\n    print(\"The part was clicked!\"\
    )\nend)\n```\n\nIn this chapter, we explored the fundamentals of Roblox object\
    \ instances. Understanding how to create, access, and manipulate object instances\
    \ is crucial for building interactive and dynamic gameplay experiences. By leveraging\
    \ the parent-child relationship and using events, you can create complex game\
    \ interactions that captivate your players.\n\nAs you continue your journey in\
    \ game development with `Lua` and Roblox Studio, experiment with different object\
    \ instances and their properties to bring your game ideas to life. In the next\
    \ chapter, we will delve into working with loops and conditionals in Roblox `Lua`\
    \ scripts, which are essential for creating logic-driven games.\n\n# Roblox Loops\
    \ and the Wait Function\n\nIn this chapter, we'll explore the power of loops and\
    \ the `wait()` function in Roblox `Lua` scripting. Loops are essential for repeating\
    \ actions and creating dynamic behavior, while the `wait()` function allows us\
    \ to introduce delays in our scripts to control the pace of the game.\n\n### Introduction\
    \ to Loops\nLoops are programming constructs that execute a block of code repeatedly\
    \ until a certain condition is met. They are incredibly useful for handling repetitive\
    \ tasks in games, such as updating player positions, animating objects, or checking\
    \ for events. In Roblox `Lua`, we have two types of loops: the `for` loop and\
    \ the `while` loop.\n\n### The 'for' Loop\nThe `for` loop is ideal when you know\
    \ in advance how many times you want to repeat an action. It has a set number\
    \ of iterations and uses a variable called the loop control variable to keep track\
    \ of the current iteration.\n\n```lua\n-- Example: Using a for loop to create\
    \ a series of bricks\nfor i = 1, 5 do\n    local brick = Instance.new(\"Part\"\
    )\n    brick.Size = Vector3.new(5, 2, 1)\n    brick.Position = Vector3.new(i *\
    \ 6, 5, 0)\n    brick.Parent = game.Workspace\nend\n```\nIn this example, we create\
    \ five bricks with equal spacing on the x-axis.\n\n### The 'while' Loop\nThe `while`\
    \ loop is useful when you want to repeat an action as long as a condition is true.\
    \ It continues executing until the condition becomes false.\n\n```lua\n-- Example:\
    \ Using a while loop to move a part upwards until it reaches a certain height\n\
    local part = game.Workspace.Part -- Replace \"Part\" with the name of your part\n\
    local targetHeight = 20\nwhile part.Position.Y < targetHeight do\n    part.Position\
    \ = part.Position + Vector3.new(0, 1, 0)\n    wait(0.1) -- Introduce a delay to\
    \ control the speed\nend\n```\nIn this example, the part will move upwards by\
    \ 1 unit every 0.1 seconds until it reaches target height of 20.\n\n### The 'wait()'\
    \ Function\nThe `wait()` function is essential for introducing delays in your\
    \ scripts. It pauses the execution of the script for the specified amount of time.\n\
    \n```lua\n-- Example: Using the wait() function to create a countdown\nfor count\
    \ = 5, 1, -1 do\n    print(\"Starting in \" .. count .. \" seconds...\")\n   \
    \ wait(1)\nend\nprint(\"Go!\")\n```\nIn this example, we create a countdown from\
    \ 5 to 1, with a one-second delay.\n\nIn this chapter, we covered the concept\
    \ of loops and the `wait()` function. Loops are powerful tools for handling repetitive\
    \ tasks, and the `wait()` function allows us to create delays in our scripts,\
    \ controlling the timing of actions in the game.\n"
  raw: 'In this chapter, we explored the essential concepts of Roblox vectors and
    colors. Vectors are essential for positioning and controlling the movement of
    objects in 3D space, while colors allow you to give your game elements a distinct
    appearance. By mastering these concepts, you can create engaging and visually
    appealing games in Roblox.


    As you continue your journey in game development with Lua and Roblox Studio, experiment
    with vectors and colors to add dynamic movement and stunning visual effects to
    your games. In the next chapter, we''ll delve into Roblox object instances and
    how they can be leveraged to create dynamic and interactive game elements.


    Roblox Object Instance


    Understanding object instances is essential for creating and manipulating game
    elements in Roblox Studio. Let''s explore how to work with object instances and
    leverage them to create dynamic and interactive gameplay.


    Introduction to Roblox Object Instances:


    In Roblox, everything you see in the game world, such as parts, models, characters,
    and UI elements, is represented as an object instance. Each object instance is
    associated with a specific class, and you can interact with them using Lua scripts
    to create, modify, and manage game elements.


    Creating and Accessing Object Instances:


    To create a new object instance, we use the Instance.new() function. Let''s create
    a new part and add it to the game world.


    -- Create a new part instance


    local part = Instance.new("Part")


    part.Size = Vector3.new(5, 5, 5)


    part.Position = Vector3.new(0, 5, 0)


    part.Anchored = true  -- Prevent the part from moving due to physics


    part.Parent = game.Workspace


    Parent-Child Relationship:


    Object instances in Roblox form a hierarchy through a parent-child relationship.
    You can parent one instance to another, creating a tree-like structure. When you
    remove the parent, all the children are also removed.


    -- Create a new part and a child part


    local parentPart = Instance.new("Part")


    parentPart.Size = Vector3.new(10, 1, 10)


    parentPart.Position = Vector3.new(0, 10, 0)


    parentPart.Anchored = true


    parentPart.Parent = game.Workspace


    local childPart = Instance.new("Part")


    childPart.Size = Vector3.new(5, 5, 5)


    childPart.Position = Vector3.new(0, 15, 0)


    childPart.Anchored = true


    childPart.Parent = parentPart


    Finding Object Instances:


    You can find object instances within the game world using their unique names or
    by searching through the hierarchy. The game.Workspace is a common starting point
    for finding objects.


    -- Find an object instance by name


    local part = game.Workspace:FindFirstChild("PartName")


    -- Find all parts within game.Workspace


    local parts = game.Workspace:GetChildren()


    Destroying Object Instances:


    When you no longer need an object instance, you can remove it from the game world
    using the :Destroy() method.


    local part = game.Workspace.Part -- Replace "Part" with the name of your part


    -- Wait for 5 seconds, then destroy the part


    wait(5)


    part:Destroy()


    Events and Object Instances:


    Object instances can raise events that your Lua scripts can listen to and respond
    accordingly. For example, you can detect when a player clicks on a part using
    the MouseButton1Click event.


    local part = game.Workspace.Part -- Replace "Part" with the name of your part


    part.MouseButton1Click:Connect(function()


    print("The part was clicked!")


    end)


    In this chapter, we explored the fundamentals of Roblox object instances. Understanding
    how to create, access, and manipulate object instances is crucial for building
    interactive and dynamic gameplay experiences. By leveraging the parent-child relationship
    and using events, you can create complex game interactions that captivate your
    players.


    As you continue your journey in game development with Lua and Roblox Studio, experiment
    with different object instances and their properties to bring your game ideas
    to life. In the next chapter, we will delve into working with loops and conditionals
    in Roblox Lua scripts, which are essential for creating logic-driven games.


    Roblox Loops and the Wait Function


    In this chapter, we''ll explore the power of loops and the wait() function in
    Roblox Lua scripting. Loops are essential for repeating actions and creating dynamic
    behavior, while the wait() function allows us to introduce delays in our scripts
    to control the pace of the game.


    Introduction to Loops:


    Loops are programming constructs that execute a block of code repeatedly until
    a certain condition is met. They are incredibly useful for handling repetitive
    tasks in games, such as updating player positions, animating objects, or checking
    for events. In Roblox Lua, we have two types of loops: the for loop and the while
    loop.


    The ''for'' Loop:


    The for loop is ideal when you know in advance how many times you want to repeat
    an action. It has a set number of iterations and uses a variable called the loop
    control variable to keep track of the current iteration.


    -- Example: Using a for loop to create a series of bricks


    for i = 1, 5 do


    local brick = Instance.new("Part")


    brick.Size = Vector3.new(5, 2, 1)


    brick.Position = Vector3.new(i * 6, 5, 0)


    brick.Parent = game.Workspace


    end


    In this example, we create five bricks with equal spacing on the x-axis.


    The ''while'' Loop:


    The while loop is useful when you want to repeat an action as long as a condition
    is true. It continues executing until the condition becomes false.


    -- Example: Using a while loop to move a part upwards until it reaches a certain
    height


    local part = game.Workspace.Part -- Replace "Part" with the name of your part


    local targetHeight = 20


    while part.Position.Y < targetHeight do


    part.Position = part.Position + Vector3.new(0, 1, 0)


    wait(0.1) -- Introduce a delay to control the speed of movement


    end


    In this example, the part will move upwards by 1 unit in the y-axis every 0.1
    seconds until it reaches the target height of 20 units.


    The ''wait()'' Function:


    The wait() function is essential for introducing delays in your scripts. It pauses
    the execution of the script for the specified amount of time.


    -- Example: Using the wait() function to create a countdown effect


    for count = 5, 1, -1 do


    print("Starting in " .. count .. " seconds...")


    wait(1)


    end


    print("Go!")


    In this example, we create a countdown from 5 to 1, with a one-second delay between
    each count.


    In this chapter, we covered the concept of loops and the wait() function in Roblox
    Lua scripting. Loops are powerful tools for handling repetitive tasks, and the
    wait() function allows us to create delays in our scripts, controlling the timing
    of actions in the game.


    By leveraging loops and wait(), you can create dynamic and interactive gameplay
    experiences for your players. Experiment with different loop structures and timings
    to achieve the desired effects in your game.


    Roblox Loops and Conditionals


    Loops allow us to repeat actions, while conditionals enable us to make decisions
    and respond to different situations in our game.


    Introduction to Loops:


    Loops are an essential programming concept that helps us repeat a block of code
    until a specific condition is met. In Roblox Lua, we have two types of loops:
    the for loop and the while loop.


    The for loop is ideal when you know the number of iterations you want to perform,
    while the while loop is useful when you want to repeat an action as long as a
    certain condition is true.


    The ''for'' Loop:


    The for loop in Roblox Lua works similarly to loops in other programming languages.
    It iterates over a range of values defined by the loop control variable.


    -- Example: Using a for loop to create a series of bricks with increasing size


    for i = 1, 5 do


    local brick = Instance.new("Part")


    brick.Size = Vector3.new(i * 5, 2, 1)


    brick.Position = Vector3.new(0, i * 5, 0)


    brick.BrickColor = BrickColor.Random()


    brick.Parent = game.Workspace


    end


    In this example, we create five bricks with increasing size along the y-axis and
    random colors.


    The ''while'' Loop:'
  toc: []
  trans: "\n\n在本章中，我们探索了 Roblox 向量（vectors）和颜色（colors）的核心概念。向量对于 3D 空间中对象的定位和控制移动至关重要，而颜色允许你为游戏元素赋予独特的外观。通过掌握这些概念，你可以在\
    \ Roblox 中创建引人注目且具有视觉吸引力的游戏。\n\n当你继续 Lua 和 Roblox Studio 的游戏开发之旅时，请尝试使用向量和颜色，为你的游戏添加动态移动和惊叹的视觉效果。在下一章中，我们将深入研究\
    \ Roblox 对象实例（object instances）以及如何利用它们来创建动态且交互式的游戏元素。\n\n# Roblox 对象实例\n\n理解对象实例对于在\
    \ Roblox Studio 中创建和操作游戏元素至关重要。让我们探索如何使用对象实例并利用它们来创建动态且交互式的游戏体验。\n\n### Roblox\
    \ 对象实例简介\n在 Roblox 中，你在游戏世界中看到的一切，如部件（parts）、模型、角色和 UI 元素，都表示为一个对象实例。每个对象实例都与特定的类关联，你可以使用\
    \ `Lua` 脚本与它们交互，以创建、修改和管理游戏元素。\n\n### 创建和访问对象实例\n要创建一个新的对象实例，我们使用 `Instance.new()`\
    \ 函数。让我们创建一个新的部件并将其添加到游戏世界。\n\n```lua\n-- 创建一个新的 part 实例\nlocal part = Instance.new(\"\
    Part\")\npart.Size = Vector3.new(5, 5, 5)\npart.Position = Vector3.new(0, 5, 0)\n\
    part.Anchored = true  -- 防止部件由于物理原因而移动\npart.Parent = game.Workspace\n```\n\n\
    ### 父子关系\nRoblox 中的对象实例通过父子关系形成层级结构。你可以将一个实例设置为另一个实例父，创建一个树形结构。当你删除父级时，所有子也会被删除。\n\
    \n```lua\n-- 创建一个新的部件和一个子部件\nlocal parentPart = Instance.new(\"Part\")\nparentPart.Size\
    \ = Vector3.new(10, 1, 10)\nparentPart.Position = Vector3.new(0, 10, 0)\nparentPart.Anchored\
    \ = true\nparentPart.Parent = game.Workspace\n\nlocal childPart = Instance.new(\"\
    Part\")\nchildPart.Size = Vector3.new(5, 5, 5)\nchildPart.Position = Vector3.new(0,\
    \ 15, 0)\nchildPart.Anchored = true\nchildPart.Parent = parentPart\n```\n\n###\
    \ 查找对象实例\n你可以使用唯一名称或通过搜索层级结构在游戏世界中查找对象实例。`game.Workspace` 是查找对象的常用起点。\n\n```lua\n\
    -- 通过名称查找对象实例\nlocal part = game.Workspace:FindFirstChild(\"PartName\")\n\n--\
    \ 查找 game.Workspace 中的所有部件\nlocal parts = game.Workspace:GetChildren()\n```\n\n\
    ### 销毁对象实例\n当你不再需要某个对象实例时，可以使用 `:Destroy()` 方法将其从游戏世界移除。\n\n```lua\nlocal part\
    \ = game.Workspace.Part -- 将 \"Part\" 替换为你部件的名称\n-- 等待 5 秒，然后销毁部件\nwait(5)\npart:Destroy()\n\
    ```\n\n### 事件与对象实例\n对象实例可以触发你的 `Lua` 脚本可以监听并做出响应的事件。例如，你可以使用 `MouseButton1Click`\
    \ 事件检测玩家何时点击部件。\n\n```lua\nlocal part = game.Workspace.Part -- 将 \"Part\" 替换为你部件的名称\n\
    part.MouseButton1Click:Connect(function()\n    print(\"部件被点击了！\")\nend)\n```\n\
    \n在本章中，我们探索了 Roblox 对象实例的基础知识。理解如何创建、访问和操作对象实例对于构建交互式和动态的游戏体验至关重要。通过利用父子关系和使用事件，你可以创建出吸引玩家的复杂游戏交互。\n\
    \n当你继续在 `Lua` 和 Roblox Studio 的游戏开发之旅时，请尝试不同的对象实例及其属性，让你的游戏想法变为现实。在下一章中，我们将深入研究在\
    \ Roblox `Lua` 脚本中使用循环和条件语句，这些对于创建创建逻辑驱动的游戏至关重要。\n\n# Roblox 循环与 Wait 函数\n\n在本章中，我们将探索\
    \ Roblox `Lua` 脚本中循环和 `wait()` 函数的力量。循环对于重复操作和创建动态行为至关重要，而 `wait()` 函数则允许我们在脚本中引入延迟，以控制游戏的节奏。\n\
    \n### 循环简介\n循环是编程构造结构，会重复执行一段代码块，直到满足特定条件。它们对于处理游戏中的重复任务非常有用，例如更新玩家位置、制作对象动画或检查事件。在\
    \ Roblox `Lua` 中，我们有两种类型的循环：`for` 循环和 `while` 循环。\n\n### 'for' 循环\n当你预先知道想要重复操作的次数时，`for`\
    \ 循环是理想的。它具有固定的迭代次数，并使用循环控制变量来跟踪当前的迭代。\n\n```lua\n-- 示例：使用 for 循环创建一系列砖\nfor i\
    \ = 1, 5 do\n    local brick = Instance.new(\"Part\")\n    brick.Size = Vector3.new(5,\
    \ 2, 1)\n    brick.Position = Vector3.new(i * 6, 5, 0)\n    brick.Parent = game.Workspace\n\
    end\n```\n在这个示例中，我们在 x 轴上创建了五个等间距的砖。\n\n### 'while' 循环\n当你希望在条件为真时一直重复操作时，`while`\
    \ 循环非常有用。它会持续执行，直到条件变为假。\n\n```lua\n-- 示例：使用 while 循环向上移动部件，直到达到特定高度\nlocal part\
    \ = game.Workspace.Part -- 将 \"Part\" 替换为你部件的名称\nlocal targetHeight = 20\nwhile\
    \ part.Position.Y < targetHeight do\n    part.Position = part.Position + Vector3.new(0,\
    \ 1, 0)\n    wait(0.1) -- 引入延迟以控制速度\nend\n```\n在这个示例中，部件每 0.1 秒向上移动 1 个单位，直到达到\
    \ 20 的目标高度。\n\n### 'wait()' 函数\n`wait()` 函数对于在脚本中引入延迟至关重要。它暂停脚本执行指定的时间。\n\n```lua\n\
    -- 示例：使用 wait() 函数创建一个倒计时\nfor count = 5, 1, -1 do\n    print(\"将在 \" .. count\
    \ .. \" 秒后开始...\")\n    wait(1)\nend\nprint(\"开始！\")\n```\n在这个示例中，我们创建了一个从 5 到\
    \ 1 的倒计时，延迟为秒。\n\n在本章中，我们涵盖了循环的概念和 `wait()` 函数。循环是处理重复任务的强大工具，而 `wait()` 函数允许我们在脚本中创建延迟，从而控制游戏中动作的时机。\n\
    \n"
