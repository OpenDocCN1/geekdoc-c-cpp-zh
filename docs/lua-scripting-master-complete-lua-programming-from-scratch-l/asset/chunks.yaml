    parts like bricks, spheres, and cylinders to construct the environment of your
    game. Use the Toolbox to add and manipulate parts in the workspace. Here''s an
    example of creating a simple part:


    local part = Instance.new("Part")


    part.Anchored = true


    part.Position = Vector3.new(0, 5, 0)


    part.Parent = game.Workspace


    Scripting in Roblox Studio:


    Roblox Studio empowers you to bring your game to life through Lua scripting. Create
