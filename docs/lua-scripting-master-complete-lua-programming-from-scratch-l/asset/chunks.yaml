    \        } else if (lua_istable(L, -1)) {\n            printf(\"%s = { \", key);\n\
    \            lua_pushnil(L);\n            while (lua_next(L, -2)) {\n        \
    \        // 嵌套表中的\n                double nestedValue = lua_tonumber(L, -1);\n\
    \                printf(\"%f \", nestedValue);\n                lua_pop(1); //\
    \ 移除 value，保留 key 用于下次迭代\n            }\n            printf(\"}\\n\");\n     \
