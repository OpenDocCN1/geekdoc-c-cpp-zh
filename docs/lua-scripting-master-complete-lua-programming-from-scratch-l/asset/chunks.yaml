    ```\n\n在这个 C 函数中，我们使用 `luaL_checktype` 检查传递的参数是否为 Lua 表。然后，我们使用 `lua_next` 遍历表并读取其内容。我们处理了不同的值类型（字符串、数字、布尔和表）并进行相应的打印。\n\
