    \n  SDL_DestroyRenderer(renderer);\n  SDL_DestroyWindow(window);\n  SDL_Quit();\n\
    \n  return 0;\n}\n```\n\n### 第 4 步：使用 Lua 更新游戏逻辑\n\n在这个示例中，我们假设你创建了处理游戏逻辑更新和渲染的\
    \ Lua 脚本。你可以通过调用 Lua 函数将 Lua 集成到你的 C 游戏循环中。\n\n例如，假设你有一个名为 `game_logic.lua` 的\
    \ Lua 脚本，其中包含更新玩家位置和检查碰撞的函数。在 C 代码中，你可以使用 Lua API 调用这些函数：\n\n```c\n#include <lua.h>\n\
    #include <lauxlib.h>\n#include <lualib.h>\n\nlua_State* L = luaL_newstate();\n\
    luaL_openlibs(L);\nint error = luaL_dofile(L, \"game_logic.lua\");\nif (error)\
    \ {\n  printf(\"Error loading Lua script: %s\\n\", lua_tostring(L, -1));\n  return\
    \ -1;\n}\n\n// 调用 Lua 函数来更新游戏逻辑\nlua_getglobal(L, \"update_player_position\");\n\
    if (lua_isfunction(L, -1)) {\n  if (lua_pcall(L, 0, 0, 0) != 0) {\n    printf(\"\
