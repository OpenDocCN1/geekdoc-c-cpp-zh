- fmt: "\n# Using Lua with REPL\n\nWelcome to the first chapter of the complete Lua\
    \ scripting course! In this chapter, we'll start our journey by understanding\
    \ how to use Lua with REPL (Read-Eval-Print Loop), a fantastic tool for experimenting\
    \ and learning the language interactively.\n\n## What is REPL?\n\nREPL stands\
    \ for Read-Eval-Print Loop, and it's a feature that allows you to execute code\
    \ snippets and see the results immediately. This is a fantastic way to experiment\
    \ with Lua and test different concepts without the need for writing complete programs.\
    \ We will use REPL to get a feel for the language and understand how Lua behaves\
    \ in various scenarios.\n\n## Getting Started with REPL:\n\nLua doesn't come with\
    \ a built-in REPL tool like some other programming languages, but don't worry;\
    \ we have an excellent solution for you. If you have already installed Lua on\
    \ your platform, you can open a terminal or command prompt and enter the following\
    \ command:\n\n```\nlua\n```\n\nThis will start the Lua interpreter, and you'll\
    \ see the Lua prompt awaiting your commands:\n\n```\nLua 5.3.5  Copyright (C)\
    \ 1994-2018 Lua.org, PUC-Rio\n>\n```\n\nIf you see this prompt, congratulations!\
    \ You are now in the Lua REPL environment and ready to start experimenting.\n\n\
    ## Using Lua in REPL:\n\nLet's begin by trying out some basic Lua expressions.\
    \ Type the following at the prompt and press Enter:\n\n```\nprint(\"Hello, world!\"\
    )\n```\n\nYou should see the output \"Hello, world!\" displayed below the command.\
    \ In Lua, the `print` function is used to display output to the console. You can\
    \ use it to print strings, numbers, and other values during your experiments.\n\
    \n## Variables and Expressions:\n\nNext, let's explore variables and expressions\
    \ in Lua. In the REPL, try the following:\n\n```lua\nlocal x = 10\nlocal y = 5\n\
    local sum = x + y\nprint(sum)\n```\n\nYou should see the result \"15\" printed\
    \ to the console. In this example, we declared two variables `x` and `y`, assigned\
    \ them the values `10` and `5`, respectively, and then performed addition using\
    \ the `+` operator. The result was stored in the variable `sum`, which we printed\
    \ using `print`.\n\n## Conditional Statements:\n\nLua also supports conditional\
    \ statements like `if`, `else`, and `elseif`. Let's try a simple example:\n\n\
    ```lua\nlocal age = 25\nif age < 18 then\n  print(\"You are a minor.\")\nelse\n\
    \  print(\"You are an adult.\")\nend\n```\n\nYou'll see \"You are an adult.\"\
    \ printed because the `age` variable is set to `25`, which is greater than or\
    \ equal to `18`.\n\n## Loops:\n\nAnother important aspect of Lua is its support\
    \ for loops. Let's experiment with a for loop:\n\n```lua\nfor i = 1, 5 do\n  print(\"\
    Iteration number:\", i)\nend\n```\n\nThis will print the numbers from 1 to 5,\
    \ each on a new line.\n\n## Exiting REPL:\n\nTo exit the REPL environment, simply\
    \ type `exit()` and press Enter.\n\n## Using REPL in Replit:\n\nIf you don't have\
    \ Lua installed on your local machine or prefer an online environment, you can\
    \ use Replit. Go to the Replit website and create a new Lua repl. You'll see a\
    \ similar interface where you can try out all the examples and experiments we\
    \ covered.\n\nIn this chapter, we explored using Lua with REPL, a powerful tool\
    \ for experimenting with the language interactively. We covered basic commands,\
    \ variables, expressions, conditional statements, and loops, providing a solid\
    \ foundation for the rest of the course.\n\nRemember, REPL is an excellent way\
    \ to learn and quickly test code snippets, so feel free to experiment further\
    \ and get comfortable with Lua's syntax and features.\n\nIn the next chapter,\
    \ we'll delve into installing Lua on various platforms, ensuring you have the\
    \ necessary tools to continue your Lua scripting journey. Let's keep the excitement\
    \ alive as we progress in mastering Lua programming from scratch!\n\n# Installing\
    \ Lua on Linux\n\nIn this chapter, we'll guide you through the process of installing\
    \ Lua on a Linux system. Whether you're using Ubuntu, Fedora, CentOS, or any other\
    \ Linux distribution, the installation steps are generally the same.\n\n### Step\
    \ 1: Checking if Lua is already installed\n\nBefore we proceed with the installation,\
    \ let's check if Lua is already installed on your system. Open a terminal and\
    \ type the following command:\n\n```bash\nlua -v\n```\n\nIf Lua is already installed,\
    \ you'll see the version number printed on the screen. If not, you'll get an error\
    \ indicating that the command `lua` is not found, which means you need to install\
    \ Lua.\n\n### Step 2: Installing Lua\n\nTo install Lua, we'll use the package\
    \ manager specific to your Linux distribution. For Ubuntu and Debian-based systems,\
    \ use the `apt` package manager. For Fedora and Red Hat-based systems, use `dnf`\
    \ or `yum`.\n\nFor Ubuntu and Debian-based systems, type the following command:\n\
    \n```bash\nsudo apt-get update\nsudo apt-get install lua5.3\n```\n\nFor Fedora\
    \ and Red Hat-based systems, use:\n\n```bash\nsudo dnf install lua\n```\n\n###\
    \ Step 3: Verifying the Installation\n\nAfter the installation is complete, you\
    \ can once again check the Lua version to verify if it was installed successfully.\
    \ Type:\n\n```bash\nlua -v\n```\n\nYou should see the Lua version number displayed\
    \ on the screen, indicating that Lua has been installed successfully on your Linux\
    \ system.\n\n## Using Lua Interactive Interpreter (REPL) on Linux:\n\nNow that\
    \ you have Lua installed, you can use the interactive interpreter (REPL) to try\
    \ out simple Lua scripts. Open your terminal and type:\n\n```bash\nlua\n```\n\n\
    This will launch the Lua REPL, where you can type Lua commands and see their immediate\
    \ output.\n\n```lua\nprint(\"Hello, Linux!\")\n```\n\n## Running Lua Scripts:\n\
    \nIn addition to the interactive interpreter, you can also run Lua scripts saved\
    \ in files. Create a new file named `myscript.lua` with the following content:\n\
    \n```lua\nlocal name = \"John\"\nprint(\"Hello, \" .. name .. \"!\")\n```\n\n\
    Save the file, and in the terminal, execute:\n\n```bash\nlua myscript.lua\n```\n\
    \nYou'll see the output \"Hello, John!\". You've successfully installed Lua on\
    \ your Linux system and run Lua scripts. This will be the foundation for the rest\
    \ of the course as we dive deeper into Lua scripting and its integration with\
    \ C.\n\n# Installing Lua on macOS\n\nIn this chapter, we'll guide you through\
    \ the process of installing Lua on macOS. Whether you're using macOS Catalina,\
    \ Big Sur, or any other version, the installation steps are straightforward.\n\
    \n### Step 1: Checking if Lua is already installed\n\nBefore we proceed with the\
    \ installation, let's check if Lua is already installed on your system. Open a\
    \ terminal and type the following command:\n\n```bash\nlua -v\n```\n\nIf Lua is\
    \ already installed, you'll see the version number printed on the screen. If not,\
    \ you'll get an error indicating that the command `lua` is not found, which means\
    \ you need to install Lua.\n\n### Step 2: Installing Lua using Homebrew\n\nTo\
    \ install Lua on macOS, we'll use Homebrew, a popular package manager for macOS.\
    \ If you don't have Homebrew installed, you can install it by running the following\
    \ command in your terminal:\n\n```bash\n/bin/bash -c \"$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)\"\
    \n```\n\nAfter Homebrew is installed, you can proceed to install Lua by running\
    \ the following command:\n\n```bash\nbrew install lua\n```\n\n### Step 3: Verifying\
    \ the Installation\n\nAfter the installation is complete, you can once again check\
    \ the Lua version to verify if it was installed successfully. Type:\n\n```bash\n\
    lua -v\n```\n"
  raw: 'Using Lua with REPL


    Welcome to the first chapter of the complete Lua scripting course! In this chapter,
    we''ll start our journey by understanding how to use Lua with REPL (Read-Eval-Print
    Loop), a fantastic tool for experimenting and learning the language interactively.


    What is REPL?


    REPL stands for Read-Eval-Print Loop, and it''s a feature that allows you to execute
    code snippets and see the results immediately. This is a fantastic way to experiment
    with Lua and test different concepts without the need for writing complete programs.
    We will use REPL to get a feel for the language and understand how Lua behaves
    in various scenarios.


    Getting Started with REPL:


    Lua doesn''t come with a built-in REPL tool like some other programming languages,
    but don''t worry; we have an excellent solution for you. If you have already installed
    Lua on your platform, you can open a terminal or command prompt and enter the
    following command:


    lua


    This will start the Lua interpreter, and you''ll see the Lua prompt awaiting your
    commands:


    Lua 5.3.5  Copyright (C) 1994-2018 Lua.org, PUC-Rio


    >


    If you see this prompt, congratulations! You are now in the Lua REPL environment
    and ready to start experimenting.


    Using Lua in REPL:


    Let''s begin by trying out some basic Lua expressions. Type the following at the
    prompt and press Enter:


    print("Hello, world!")


    You should see the output "Hello, world!" displayed below the command. In Lua,
    the print function is used to display output to the console. You can use it to
    print strings, numbers, and other values during your experiments.


    Variables and Expressions:


    Next, let''s explore variables and expressions in Lua. In the REPL, try the following:


    local x = 10


    local y = 5


    local sum = x + y


    print(sum)


    You should see the result "15" printed to the console. In this example, we declared
    two variables x and y, assigned them the values 10 and 5, respectively, and then
    performed addition using the + operator. The result was stored in the variable
    sum, which we printed using print.


    Conditional Statements:


    Lua also supports conditional statements like if, else, and elseif. Let''s try
    a simple example:


    local age = 25


    if age < 18 then


    print("You are a minor.")


    else


    print("You are an adult.")


    end


    You''ll see "You are an adult." printed because the age variable is set to 25,
    which is greater than or equal to 18.


    Loops:


    Another important aspect of Lua is its support for loops. Let''s experiment with
    a for loop:


    for i = 1, 5 do


    print("Iteration number:", i)


    end


    This will print the numbers from 1 to 5, each on a new line.


    Exiting REPL:


    To exit the REPL environment, simply type exit() and press Enter.


    Using REPL in Replit:


    If you don''t have Lua installed on your local machine or prefer an online environment,
    you can use Replit. Go to the Replit website and create a new Lua repl. You''ll
    see a similar interface where you can try out all the examples and experiments
    we covered.


    In this chapter, we explored using Lua with REPL, a powerful tool for experimenting
    with the language interactively. We covered basic commands, variables, expressions,
    conditional statements, and loops, providing a solid foundation for the rest of
    the course.


    Remember, REPL is an excellent way to learn and quickly test code snippets, so
    feel free to experiment further and get comfortable with Lua''s syntax and features.


    In the next chapter, we''ll delve into installing Lua on various platforms, ensuring
    you have the necessary tools to continue your Lua scripting journey. Let''s keep
    the excitement alive as we progress in mastering Lua programming from scratch!


    Installing Lua on Linux


    In this chapter, we''ll guide you through the process of installing Lua on a Linux
    system. Whether you''re using Ubuntu, Fedora, CentOS, or any other Linux distribution,
    the installation steps are generally the same.


    Step 1: Checking if Lua is already installed


    Before we proceed with the installation, let''s check if Lua is already installed
    on your system. Open a terminal and type the following command:


    lua -v


    If Lua is already installed, you''ll see the version number printed on the screen.
    If not, you''ll get an error indicating that the command ''lua'' is not found,
    which means you need to install Lua.


    Step 2: Installing Lua


    To install Lua, we''ll use the package manager specific to your Linux distribution.
    For Ubuntu and Debian-based systems, use the ''apt'' package manager. For Fedora
    and Red Hat-based systems, use ''dnf'' or ''yum''.


    For Ubuntu and Debian-based systems, type the following command:


    sudo apt-get update


    sudo apt-get install lua5.3


    For Fedora and Red Hat-based systems, use:


    sudo dnf install lua


    Step 3: Verifying the Installation


    After the installation is complete, you can once again check the Lua version to
    verify if it was installed successfully. Type:


    lua -v


    You should see the Lua version number displayed on the screen, indicating that
    Lua has been installed successfully on your Linux system.


    Using Lua Interactive Interpreter (REPL) on Linux:


    Now that you have Lua installed, you can use the interactive interpreter (REPL)
    to try out simple Lua scripts. Open your terminal and type:


    lua


    This will launch the Lua REPL, where you can type Lua commands and see their immediate
    output.


    print("Hello, Linux!")


    You should see the output "Hello, Linux!" displayed on the screen.


    Running Lua Scripts:


    In addition to the interactive interpreter, you can also run Lua scripts saved
    in files. Create a new text file named ''myscript.lua'' with the following content:


    local name = "John"


    print("Hello, " .. name .. "!")


    Save the file, and in the terminal, navigate to the directory where the script
    is saved. To execute the script, type:


    lua myscript.lua


    You''ll see the output "Hello, John!" displayed on the screen.


    Congratulations! You''ve successfully installed Lua on your Linux system and run
    simple Lua scripts using the interactive interpreter and through script files.
    This will be the foundation for the rest of the course as we dive deeper into
    Lua scripting and its integration with C and Roblox Studio.


    In the next chapter, we''ll cover the installation of Lua on macOS, ensuring you
    have all the necessary tools to continue your journey in mastering Lua programming
    from scratch.


    Installing Lua on MacOS


    In this chapter, we''ll guide you through the process of installing Lua on macOS.
    Whether you''re using macOS Catalina, Big Sur, or any other version, the installation
    steps are straightforward.


    Step 1: Checking if Lua is already installed


    Before we proceed with the installation, let''s check if Lua is already installed
    on your macOS system. Open a terminal and type the following command:


    lua -v


    If Lua is already installed, you''ll see the version number printed on the screen.
    If not, you''ll get an error indicating that the command ''lua'' is not found,
    which means you need to install Lua.


    Step 2: Installing Lua using Homebrew


    To install Lua on macOS, we''ll use Homebrew, a popular package manager for macOS.
    If you don''t have Homebrew installed, you can install it by running the following
    command in your terminal:


    /bin/bash -c "$(curl -fsSL [https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh](https://www.google.com/url?q=https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh&sa=D&source=editors&ust=1691414479786352&usg=AOvVaw2EKt732GYBQx5ed3DJ-gL0)  )"


    After Homebrew is installed, you can proceed to install Lua by running the following
    command:


    brew install lua


    Step 3: Verifying the Installation


    After the installation is complete, you can once again check the Lua version to
    verify if it was installed successfully. Type:


    lua -v


    You should see the Lua version number displayed on the screen, indicating that
    Lua has been installed successfully on your macOS system.


    Using Lua Interactive Interpreter (REPL) on macOS:'
