    ## Arctangent Function in New Lua Versions


    As Lua evolves with new versions, it''s essential to stay updated on changes and
    enhancements to this critical trigonometric function.


    The arctangent function, also known as `atan` or `atan2`, is commonly used in
    game development to calculate angles, aiming mechanics, and other direction-related
    tasks. In Lua, the arctangent function is available as the `math.atan` and `math.atan2`
    functions. Let''s dive into the details of each function and explore how they
    can be utilized in your game development projects.


    ### The math.atan Function


    The `math.atan` function takes a single argument and returns the arctangent of
    that value. It is primarily used to calculate the angle in radians between the
    x-axis and a line originating from the origin (0, 0) and ending at the specified
    point (x, y).


    ```lua

    -- Using math.atan to calculate the angle in radians

    local x = 1

    local y = 1


    local angleRadians = math.atan(y / x)


    print("Angle in radians:", angleRadians)  -- Output: 0.78539816339745 (approximately
    45 degrees)

    ```


    ### The math.atan2 Function


    The `math.atan2` function is a more powerful variant of the arctangent function.
    It takes two arguments (`y` and `x`) and returns the arctangent of `y/x`. The
    `atan2` function can handle all four quadrants, making it ideal for calculating
    angles between points.


    ```lua

    -- Using math.atan2 to calculate the angle in radians between two points (x1,
    y1) and (x2, y2)

    local x1, y1 = 0, 0

    local x2, y2 = 1, 1


    local dx = x2 - x1

    local dy = y2 - y1


    local angleRadians = math.atan2(dy, dx)


    print("Angle between points in radians:", angleRadians)  -- Output: 0.78539816339745
    (approximately 45 degrees)

    ```


    ## Converting Radians to Degrees


    To provide a more user-friendly representation of angles, you can convert the
    angles from radians to degrees using the following formula:


    `Angle in degrees = Angle in radians * (180 / math.pi)`


    ```lua

    -- Function to calculate angle between two points in degrees (using math.atan2)

    function calculateAngleBetweenPointsInDegrees(x1, y1, x2, y2)


    local dx = x2 - x1

    local dy = y2 - y1


    local angleRadians = math.atan2(dy, dx)

    local angleDegrees = angleRadians * (180 / math.pi)


    return angleDegrees

    end


    -- Example usage

    local angle = calculateAngleBetweenPointsInDegrees(0, 0, 1, 1)

    print("Angle between points in degrees:", angle)  -- Output: 45 (approximately)

    ```


    ## Handling Negative Angles (Continued)


    Keep in mind that the `atan2` function returns angles in the range from -π to
    π (approximately -3.14159 to 3.14159). If you want angles in the range from 0
