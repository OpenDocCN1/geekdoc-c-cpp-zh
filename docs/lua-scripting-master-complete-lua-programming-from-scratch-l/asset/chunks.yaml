    Variables are essential for performing calculations and building dynamic scripts.
    Let''s see how we can use variables in expressions:


    ```lua

    local apples = 5


    local oranges = 8


    local totalFruits = apples + oranges   -- totalFruits will be 13


    local welcomeMessage = "Hello, " .. playerName .. "!"   -- Concatenating strings


    if score >= 100 then


    print("Congratulations, you achieved a high score!")

    else

    print("Keep playing to improve your score!")

    end

    ```


    In this example, we used variables `apples` and `oranges` to calculate the total
    number of fruits and the `playerName` variable to create a personalized welcome
    message. The `score` variable is used in an `if-else` conditional statement to
    provide feedback based on the player''s performance.


    ### Scope of Variables


    Variables in Lua have different scopes, depending on where they are declared.
    If a variable is declared outside any function, it becomes a global variable,
    accessible throughout the entire script. If a variable is declared inside a function
    using the `local` keyword, it becomes a local variable, accessible only within
    that function.


    ```lua

    local globalVariable = 10


    function myFunction()

    local localVariable = 5

    print(globalVariable)   -- Output: 10

    print(localVariable)     -- Output: 5

    end


    myFunction()

    print(globalVariable)         -- Output: 10

    print(localVariable)         -- Output: nil (variable not accessible outside the
    function)

    ```


    In this chapter, we covered the essential concept of variables in Lua. We learned
    how to declare variables, assign values to them, and use them in expressions.
    Additionally, we explored different data types and the scope of variables.


    Variables play a crucial role in game development and scripting, allowing you
    to create dynamic and interactive experiences for players.


    ### Older Lua Versions and REPL


    In this chapter, we''ll explore some aspects of older Lua versions and introduce
    you to the concept of `REPL` (Read-Eval-Print Loop). Although we mainly focus
    on the current Lua version in this course, understanding older versions can be
    valuable when working with legacy code or older projects.


    #### Older Lua Versions


    As with any programming language, Lua has undergone updates and improvements over
    time. Some older versions of Lua may lack certain features or have slightly different
    syntax compared to the latest version. The core concepts remain consistent across
    versions, but it''s essential to be aware of any differences, especially when
    collaborating on projects or using code from various sources.


    #### REPL (Read-Eval-Print Loop)


    The `REPL` stands for Read-Eval-Print Loop, and it is an interactive programming
    environment that allows you to execute Lua code snippets and see the results instantly.
    It''s an excellent tool for experimenting with Lua code, testing small portions
    of code, or learning new concepts.


    In older Lua versions, the `REPL` environment may be slightly different from the
    one provided in the current Lua version. However, the basic functionality remains
    the same: you enter a line of code, it''s evaluated, and the result is printed
    back to you.


    To use the `REPL`, follow these steps:


    1. Open your terminal or command prompt.

    2. Type `lua` and press Enter. This will launch the Lua interactive mode, also
    known as the `REPL`.

    3. You''ll see a prompt, which is usually denoted by `lua>`. This is where you
    can enter your Lua code.

    4. After typing a line of code, press Enter to execute it. The result will be
    immediately printed if there''s any output.


    For example, let''s try a simple math calculation in the `REPL`:


    ```

    lua> print(5 + 3)

    ```


    The output will be:


    ` 8 `


    As you can see, the `REPL` is a convenient tool to test code and get quick feedback
    on the results.


    **Note:** In modern Lua versions (like Lua `5.3` and above), you can also use
    an online `REPL`, such as the `replit` website mentioned in the course description,
    to experiment with Lua code without installing anything on your machine.


    In this chapter, we briefly discussed older versions of Lua and the concept of
    `REPL`. Understanding older versions can be useful when working on legacy projects,
    and the `REPL` provides an interactive environment for testing code snippets and
    learning Lua concepts.


    As we progress through the course, we''ll primarily focus on the latest version
    of Lua to ensure you have the most up-to-date knowledge and skills for scripting
    with Lua. Remember to experiment with variables.

