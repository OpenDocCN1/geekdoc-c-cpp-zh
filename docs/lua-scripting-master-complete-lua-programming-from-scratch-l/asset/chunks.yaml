    \ Push Pop Peak\n\n在这一章中，我们将探索 Lua C API 中的三个核心函数：`lua_push`、`lua_pop` 和 `lua_peek`。这些函数是在\
    \ Lua 与 C 或 C++ 应用程序集成时操作 Lua 栈的基础。\n\n### 第 1 步：将值推入栈\n\n`lua_push` 函数用于向 Lua\
    \ 栈添加值。对于不同的数据类型有不同的 `lua_push` 函数，例如整数、字符串、布尔等。\n\n让我们通过一个示例来演示向栈推入一些值：\n\n```c\n\
    #include <stdio.h>\n#include <lua.h>\n#include <lualib.h>\n#include <lauxlib.h>\n\
    \nvoid pushValuesToStack(lua_State *L) {\n    lua_pushinteger(L, 42);      //\
    \ 向栈推入一个整数值 (42)\n    lua_pushstring(L, \"Hello, Lua!\"); // 向栈推入一个字符串值 (\"Hello,\
    \ Lua!\")\n    lua_pushboolean(L, 1);         // 向栈推入一个布尔值 (true)\n}\n\nint main()\
    \ {\n```\n\n"
- fmt: "\n```c\nlua_State *L = luaL_newstate();\n\nluaL_openlibs(L);\n\npushValuesToStack(L);\n\
    \n// Retrieving and printing the values from the stack\n\nprintf(\"Integer Value:\
