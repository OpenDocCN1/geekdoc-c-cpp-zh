    你按了一个键！\")\n```\n\n### 鼠标输入\n\n在某些游戏中，鼠标输入对于点击按钮或瞄准等交互至关重要。我们可以使用 Love2D 框架中的\
    \ `love.mouse` 模块处理鼠标输入。\n\n### 处理鼠标输入的示例（使用 Love2D）：\n\n```lua\n-- 使用 Love2D\
    \ 框架处理鼠标输入\n\nfunction love.load()\n  love.window.setTitle(\"Mouse Input Demo\"\
