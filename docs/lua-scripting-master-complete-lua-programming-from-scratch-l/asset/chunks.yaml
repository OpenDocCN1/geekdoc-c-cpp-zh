    \n# 修复我们的游戏循环步长\n\n在本章中，我们将解决游戏开发中的一个关键方面——修复游戏循环步长（Timestep），以确保在不同设备和帧率下具有平滑的游戏体验和一致的行为。\n\
    \n### 理解问题\n\n在上一章（第 65 章：游戏循环）中，我们实现实现了一个基础的游戏循环来更新游戏逻辑并渲染游戏元素。然而，游戏循环的更新率直接与帧率绑定，这可能导致在不同设备或帧率波动时出现不规则且不可预测的行为。\n\
    \n例如，如果一个设备的帧率较高，游戏循环将运行得更频繁，导致游戏看起来更快。反之，较低帧率会减慢游戏。这种不一致性可能会导致各种问题，例如玩家移动速度过快、物理效果异常或无意的故障。\n\
    \n为了解决这些问题，我们需要将游戏循环的更新率与帧率解耦。这被称为“固定步长”（fixed timestep）或“固定增量时间”（fixed delta\
    \ time）方法。\n\n### 第 1 步：计算增量（Delta Time）\n\n增量代表两次连续游戏循环迭代之间经过的时间。通过计算增量，我们可以确保无论帧率如何，游戏的行为都能保持一致。\n\
    \n在 C 中，我们如下所示计算增量：\n\n```c\n// 定义跟踪时间的变量\nunsigned int previousTime = 0;\nunsigned\
    \ int currentTime = 0;\nfloat deltaTime = 0.0f;\n\n// 在游戏循环内部\ncurrentTime = SDL_GetTicks();\
    \ // 获取当前毫秒时间\ndeltaTime = (currentTime - previousTime) / 1000.0f; // 计算秒级增量\n\
    previousTime = currentTime; // 更新之前的时间\n```\n\n### 第 2 步：实现固定步长\n\n现在我们有了增量时间，可以使用它来更新游戏逻辑，并确保移动和动画基于固定步长。无论帧率如何。\n\
    \n让我们修改游戏循环以整合固定步长：\n\n```c\n// 带固定步长的游戏循环\nSDL_Event event;\nbool isRunning =\
    \ true;\nconst float fixedTimestep = 1.0f / 60.0f; // 60 FPS\nfloat accumulator\
    \ = 0.0f;\n\nwhile (isRunning) {\n    // 处理事件（如第 65 章所述）\n    // 计算增量（如上）\n  \
