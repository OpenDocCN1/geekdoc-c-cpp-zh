    Step 1: Understanding Userdata


    Userdata is a special data type in Lua that enables you to create custom types
    with specific behavior. It is often used to represent C data structures or objects
    in Lua. Userdata provides a way to interact with these custom types from Lua,
    even though their implementation is in C.


    Step 2: Creating Userdata in C


    Let''s create a simple userdata type in C to represent a 2D point:


    // userdata representing a 2D point


    typedef struct {


    double x;


    double y;


    } Point;


    // Function to create a new Point userdata and push it onto the Lua stack


    static int newPoint(lua_State *L) {


    double x = luaL_checknumber(L, 1);


    double y = luaL_checknumber(L, 2);


    Point *point = (Point *)lua_newuserdata(L, sizeof(Point));


    point->x = x;


    point->y = y;


    luaL_getmetatable(L, "Point");


    lua_setmetatable(L, -2);


    return 1;


