    Calling Lua Functions From C


    In this chapter, we will explore how to call Lua functions from C, a crucial aspect
    of integrating Lua with your C or C++ applications. This will enable you to leverage
    the power of Lua scripts within your game development projects.


    Step 1: Basic Setup


    Before we begin, make sure you have completed Chapter 51 ("Working with Lua and
    C") and set up the necessary C project folder structure as explained in Chapter
    52.


    Step 2: Registering Lua Functions


    To call Lua functions from C, we need to register the desired functions with Lua.
    This allows Lua to recognize and execute the C functions when called from Lua
    scripts.


    Here''s an example of how to register a simple C function to be callable from
    Lua:


    #include <stdio.h>


    #include <lua.h>


    #include <lualib.h>


    #include <lauxlib.h>


    // A simple C function that adds two integers and returns the result


    int addNumbers(lua_State *L) {


    int a = lua_tointeger(L, 1); // Get the first argument from Lua stack


    int b = lua_tointeger(L, 2); // Get the second argument from Lua stack


    int sum = a + b;


    lua_pushinteger(L, sum); // Push the result back to the Lua stack


    return 1; // Return the number of values we pushed onto the stack


    }


    // Function to register the C function with Lua


    void registerLuaFunctions(lua_State *L) {


    lua_pushcfunction(L, addNumbers); // Push the C function onto the Lua stack


    lua_setglobal(L, "addNumbers"); // Set the function''s name in the global table


    }


    Step 3: Executing Lua Code with the Registered Functions


    With the function registered, let''s now execute a Lua script that calls the C
    function:


    #include <stdio.h>


    #include <lua.h>


    #include <lualib.h>


    #include <lauxlib.h>


    // ... (Previous code)


    int main() {


    lua_State *L = luaL_newstate();


    luaL_openlibs(L);


    registerLuaFunctions(L); // Register our C function with Lua


    // Lua script calling the C function


    const char *luaScript = "result = addNumbers(10, 20)";


    int result = luaL_dostring(L, luaScript);


    if (result != LUA_OK) {


    printf("Error executing Lua script: %s\n", lua_tostring(L, -1));


    } else {


    // Retrieve the result from Lua stack


    int sum = lua_tointeger(L, -1);


    printf("Result from Lua script: %d\n", sum);


    }


    lua_close(L);


    return 0;


    }


    Step 4: Build and Run


    Compile and run the C application as explained in Chapter 53\. When you run the
    application, you should see the following output:


    Result from Lua script: 30


    Congratulations! You have successfully called a Lua function from C, and it returned
    the correct result.


