    while startPos do

    print("找到带有重复字母的单词，位置位于:", startPos, "-", endPos)

    startPos, endPos = string.find(text, patternToFind, endPos + 1)

    end

    ```


    #### 锚点 - "^" 和 "$"


    锚点指定模式必须出现在字符串的开头 (^) 或结尾 ($)。


    -- 示例：匹配以 "Lua" 开头的行


    ```lua

    local text = "Lua is a powerful scripting language.\nLearn Lua for game development."

    local patternToFind = "^Lua"

    local startPos, endPos = string.find(text, patternToFind)


    if startPos then

    print("找到以 ''Lua'' 开头的行，位置位于:", startPos, "-", endPos)

    else

    print("未找到模式.")

    end

    ```


    Lua 模式中的特殊字符将我们的文本处理和模式匹配能力提升到了新的高度。通过掌握这些字符，你可以为游戏开发任务创建复杂且动态的模式。


    # 第 5 节：循环与函数


