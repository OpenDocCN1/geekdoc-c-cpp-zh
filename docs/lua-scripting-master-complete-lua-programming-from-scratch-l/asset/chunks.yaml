    Loop Activity


    Loops are essential for creating dynamic and interactive gameplay scenarios, and
    we''ll dive into a practical loop-related activity to reinforce your knowledge.


    Activity: Creating a Countdown Timer Using a Loop


    In this activity, we''ll create a simple countdown timer using a loop. Countdown
    timers are commonly used in games to build tension and create a sense of urgency.
    For this example, we''ll create a 10-second countdown timer that will be displayed
    on the screen.


    Step 1: Setting Up the Environment


    Before we start coding, make sure you have Lua installed on your preferred platform.
    You can use either Linux, macOS, or Windows, and you can follow along with the
    code on your preferred Lua environment.


    Step 2: Creating the Countdown Timer Function


    Let''s begin by writing the countdown timer function. We''ll use a while loop
    to decrement the timer value from 10 to 0, and we''ll display the current timer
    value on the screen at each iteration.


    -- Function to create a countdown timer


    function createCountdownTimer()


    local timerValue = 10


    while timerValue >= 0 do


    -- Clear the screen (For demonstration purposes, you can replace this with appropriate
    code to display on your game)


    print(string.format("Time remaining: %02d", timerValue))


    -- Pause the script for one second


    os.execute("sleep 1")  -- On Windows, replace this with "timeout /t 1 > nul"


    timerValue = timerValue - 1


    end


    end


    -- Call the function to start the countdown timer


    createCountdownTimer()


    Step 3: Running the Countdown Timer


    After writing the countdown timer function, execute your Lua script. You''ll notice
    the countdown timer starts at 10 seconds and decreases by one second at a time.
    The timer will display the remaining time on the screen until it reaches 0.


    Step 4: Customizing the Countdown Timer


    To make the countdown timer more engaging for your game, you can customize it
    further. For example, you can add sound effects, change the appearance, or trigger
    specific events when the timer reaches certain values.


