    ```


    ### math.atan2 函数


    `math.atan2` 函数是反正切函数的更强大变体。它接收两个参数（`y` 和 `x`）并返回 `y/x` 的反正切值。`atan2` 函数可以处理所有象限，使其成为计算两点之间角度的理想选择。


    ```lua

    -- 使用 math.atan2 计算两点 (x1, y1) 和 (x2, y2) 之间的弧度角度

    local x1, y1 = 0, 0

    local x2, y2 = 1, 1


    local dx = x2 - x1

    local dy = y2 - y1


    local angleRadians = math.atan2(dy, dx)


    print("Angle between points in radians:", angleRadians)  -- Output: 0.78539816339745
    (大约 45 度)

    ```


    ## 将弧度转换为角度


    为了提供更符合用户习惯的角度表示法，你可以使用以下公式将角度从弧度转换为角度：


    `Angle in degrees = Angle in radians * (180 / math.pi)`


    ```lua

    -- 计算两点之间角度（使用 math.atan2）的函数

    function calculateAngleBetweenPointsInDegrees(x1, y1, x2, y2)


    local dx = x2 - x1

    local dy = y2 - y1


    local angleRadians = math.atan2(dy, dx)

    local angleDegrees = angleRadians * (180 / math.pi)


    return angleDegrees

    end


    -- 示例用法

    local angle = calculateAngleBetweenPointsInDegrees(0, 0, 1, 1)

    print("Angle between points in degrees:", angle)  -- Output: 45 (大约)

    ```


    ## 处理负角度（续）


    请记住，`atan2` 函数返回的角度范围是从 -π 到 π（大约 -3.14159 到 3.14159）。如果你需要 0 到 360 度之间的角度范围，则需要相应地处理负角度。


    ```lua

    -- 计算两点之间角度（0 到 360 度）的函数

    function calculatePositiveAngleBetweenPoints(x1, y1, x2, y2)


    local dx = x2 - x1

    local dy = y2 - y1


    local angleRadians = math.atan2(dy, dx)

    local angleDegrees = angleRadians * (180 / math.pi)


    if angleDegrees < 0 then

    angleDegrees = angleDegrees + 360

    end


    return angleDegrees

    end


    -- 示例用法

    local angle = calculatePositiveAngleBetweenPoints(0, 0, -1, -1)

    print("Positive angle between points (degrees):", angle)  -- Output: 225 (approximately)

    ```


