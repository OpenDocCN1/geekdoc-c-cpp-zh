    \nHowever, this time, we have included the `lua_pop(L, 3)` line to remove the\
    \ three values from the stack after printing them.\n\n## Step 5: Peeking Values\
    \ on the Stack\n\nSometimes, you might want to access the values on the stack\
    \ without removing them. For that, you can use the `lua_peek` functions.\n\nLet's\
    \ modify the example once more to use `lua_peek`:\n\n```c\n#include <stdio.h>\n\
