    In this chapter, we explored the concept of userdata, a valuable feature for integrating
    Lua with C in game development and other applications. We created a simple userdata
    type in C to represent a 2D point, registered it with Lua, and demonstrated how
    to create and use Point userdata objects from Lua scripts.


    Using userdata, you can pass complex data structures between Lua and C, enabling
    you to build powerful game systems and enhance your game development projects.


    Sending and Receiving Userdata


    In this chapter, we''ll explore how to send and receive userdata between Lua and
    C, a crucial aspect of integrating Lua with C in game development and other applications.


    Step 1: Sending Userdata from Lua to C


    To send userdata from Lua to C, we''ll create a C function that expects userdata
    as an argument. Let''s create a simple example using the Point userdata we defined
    earlier:


    -- Lua script to send userdata to C


    local p1 = Point(10, 20)


    -- Call the C function with the userdata


    sendPointToC(p1)


    In this Lua script, we create a Point userdata p1 and then call the C function
    sendPointToC to send the userdata to our C code.


    Step 2: Receiving Userdata in C


    Now, let''s implement the sendPointToC function in C to receive the userdata and
    extract its properties:


    // C function to receive and process Point userdata from Lua


    static int sendPointToC(lua_State *L) {


    Point *point = (Point *)lua_touserdata(L, 1);


    double x = point->x;


    double y = point->y;


    // Process the userdata, e.g., print its properties


    printf("Received Point from Lua: x = %f, y = %f\n", x, y);


    return 0;


    }


    In this C function, we use lua_touserdata to retrieve the Point userdata from
    the Lua stack. Then, we extract the x and y properties from the Point userdata
    and process it in any desired way. In this example, we simply print the properties
    to the console.


    Step 3: Registering the C Function with Lua


    Before we can call the sendPointToC function from Lua, we need to register it
    with Lua:


    // Function to register the C function with Lua


    static void registerCFunctions(lua_State *L) {


    lua_pushcfunction(L, sendPointToC);


    lua_setglobal(L, "sendPointToC");


    }


    In this code, we push the sendPointToC function onto the Lua stack and associate
    it with the global variable sendPointToC. Now, we can call this function from
    Lua.


    Step 4: Putting It All Together


    Now, let''s combine sending userdata from Lua to C and receiving it in C:


    #include <stdio.h>


    #include <lua.h>


    #include <lualib.h>


    #include <lauxlib.h>


    // userdata representing a 2D point


    typedef struct {


    double x;


    double y;


    } Point;


    // Function to receive and process Point userdata from Lua


    static int sendPointToC(lua_State *L) {


    Point *point = (Point *)lua_touserdata(L, 1);


    double x = point->x;


    double y = point->y;


    // Process the userdata, e.g., print its properties


    printf("Received Point from Lua: x = %f, y = %f\n", x, y);


    return 0;


    }


    // Function to register the C function with Lua


    static void registerCFunctions(lua_State *L) {


    lua_pushcfunction(L, sendPointToC);


    lua_setglobal(L, "sendPointToC");


    }


    int main() {


    lua_State *L = luaL_newstate();


    luaL_openlibs(L);


    // Register the C function with Lua


    registerCFunctions(L);


    // Lua script to send userdata to C


    const char *luaScript = "local p1 = Point(10, 20)\n"


    "sendPointToC(p1)\n";


    // Execute the Lua script


    int result = luaL_dostring(L, luaScript);


    // Check if there was an error


    if (result != LUA_OK) {


    printf("Error executing Lua script: %s\n", lua_tostring(L, -1));


    }


    lua_close(L);


    return 0;


    }


    Step 5: Build and Run


    Compile and run the C application as explained in Chapter 53\. When you run the
    application, you should see the following output:


    Received Point from Lua: x = 10.000000, y = 20.000000


    This confirms that we successfully sent the Point userdata from Lua to C, extracted
    its properties in C, and processed it accordingly.


    Step 6: Receiving Userdata from C to Lua


    Similarly, we can send userdata from C to Lua. Let''s create a C function that
    returns userdata to Lua:


    // C function to create and return a Point userdata to Lua


    static int createPointInLua(lua_State *L) {


    double x = luaL_checknumber(L, 1);


    double y = luaL_checknumber(L, 2);


    Point *point = (Point *)lua_newuserdata(L, sizeof(Point));


    point->x = x;


    point->y = y;


    luaL_getmetatable(L, "Point");


    lua_setmetatable(L, -2);


    return 1;


    }


    In this C function, we receive x and y as arguments from Lua and create a new
    Point userdata with the provided values. We then associate the "Point" metatable
    with the userdata and push it onto the Lua stack as the return value.


    Step 7: Registering the New C Function with Lua


    Before we can call the createPointInLua function from Lua, we need to register
    it with Lua:


    // Function to register the C function with Lua


    static void registerCFunctions(lua_State *L) {


    lua_pushcfunction(L, sendPointToC);


    lua_setglobal(L, "sendPointToC");


    lua_pushcfunction(L, createPointInLua);


    lua_setglobal(L, "createPointInLua");


    }


    In this code, we push the createPointInLua function onto the Lua stack and associate
    it with the global variable createPointInLua. Now, we can call this function from
    Lua.


