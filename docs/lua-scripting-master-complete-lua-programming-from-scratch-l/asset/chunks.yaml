    Input Values from the Keyboard


    In this chapter, we''ll explore the exciting world of "Input Values from the Keyboard"
    in Lua scripting. Capturing user input is a crucial aspect of game development,
    as it allows us to create interactive and engaging experiences.


    Using io.read() for Basic Input:


    In Lua, we can use the io.read() function to read input from the keyboard. It
    waits for the user to enter data and then stores it in a variable for further
    processing.


    Example of Basic Input:


    -- Basic input example


    print("Enter your name:")


    local name = io.read()


    print("Hello, " .. name .. "! Welcome to the game.")


    Handling Different Input Types:


    When reading input, it''s essential to handle different input types, such as numbers
    and strings, based on the game''s requirements. We can use tonumber() to convert
    the input to a number if needed.


    Example of Handling Numeric Input:


    -- Handling numeric input


    print("Enter your age:")


    local age = tonumber(io.read())


    if age then


    print("You are " .. age .. " years old.")


    else


    print("Invalid input. Please enter a valid age.")


    end


    Validating Input with Loops:


    To ensure valid input, we can use loops to repeatedly ask for input until the
    user provides the correct format or values.


    Example of Input Validation:


    -- Input validation with loop


    local number


    repeat


    print("Enter a number between 1 and 10:")


    number = tonumber(io.read())


    until number and number >= 1 and number <= 10


    print("You entered: " .. number)


    Using Prompt Messages:


    In games, it''s beneficial to provide prompt messages to guide the user on what
    input is expected. This helps enhance the overall user experience.


    Example of Prompt Messages:


    -- Using prompt messages


    print("You find yourself in a dark room. What do you do?")


    print("a) Look around")


    print("b) Go back")


    local choice = io.read()


    if choice == "a" then


    print("You find a shiny key.")


    elseif choice == "b" then


    print("You decide to go back.")


    else


    print("Invalid choice.")


    end


    Handling Input Options with Tables:


    In complex games, we might have multiple input options. Using tables to map user
    input to specific actions can make the code more organized and easier to maintain.


    Example of Handling Input Options with Tables:


    -- Handling input options with tables


    local actions = {


    ["a"] = function() print("You choose option A.") end,


    ["b"] = function() print("You choose option B.") end,


    ["c"] = function() print("You choose option C.") end,


    }


    print("Choose an option: (a/b/c)")


    local choice = io.read()


    if actions[choice] then


    actions[choice]()


    else


    print("Invalid choice.")


    end


    In this chapter, we explored the art of "Input Values from the Keyboard" in Lua
    scripting. Capturing user input is an essential skill for game developers, and
    by utilizing functions like io.read(), handling different input types, validating
    input with loops, using prompt messages, and organizing input options with tables,
    we can create interactive and immersive games.


    By mastering the art of handling user input, you''ll enhance the overall player
    experience and create games that engage and delight your audience.


    Handling Input Options


    As game developers, providing various input options to players is crucial for
    creating dynamic and interactive gameplay experiences.


    Input Options with if-else Statements:


    One way to handle input options is by using if-else statements. Based on the user''s
    input, we can execute specific actions and control the flow of the game.


    Example of Handling Input Options with if-else Statements:


    -- Handling input options with if-else statements


    print("Choose an option: (1/2/3)")


    local choice = tonumber(io.read())


    if choice == 1 then


    print("You chose option 1.")


    elseif choice == 2 then


    print("You chose option 2.")


    elseif choice == 3 then


    print("You chose option 3.")


    else


    print("Invalid choice.")


    end


    Input Options with switch-case (Using Tables):


    In Lua, there''s no built-in switch-case statement, but we can mimic this behavior
    using tables as a mapping for different input options.


    Example of Handling Input Options with Tables:


    -- Handling input options with tables (switch-case)


    local actions = {


    [1] = function() print("You chose option 1.") end,


    [2] = function() print("You chose option 2.") end,


    [3] = function() print("You chose option 3.") end,


    }


    print("Choose an option: (1/2/3)")


    local choice = tonumber(io.read())


    if actions[choice] then


    actions[choice]()


    else


    print("Invalid choice.")


    end


    Creating Interactive Menus:


    In complex games, interactive menus are common to provide players with a structured
    list of choices. We can use loops to keep displaying the menu until the player
    selects an option.


    Example of Creating Interactive Menus:


    -- Creating interactive menus


    local function displayMenu()


    print("Main Menu:")


    print("1\. Start Game")


    print("2\. Load Game")


    print("3\. Options")


    print("4\. Quit")


    end


    local choice


    repeat


    displayMenu()


    choice = tonumber(io.read())


    if choice == 1 then


    print("Starting the game...")


    elseif choice == 2 then


    print("Loading the game...")


    elseif choice == 3 then


    print("Options menu...")


    elseif choice == 4 then


    print("Quitting the game.")


    else


    print("Invalid choice. Please try again.")


    end


    until choice == 4


    Handling User Input with Functions:


    To keep our code organized and modular, we can define separate functions for each
    option and call them based on the player''s choice.


    Example of Handling User Input with Functions:


    -- Handling user input with functions


    local function startGame()


    print("Starting the game...")


    -- Your game logic goes here


    end


    local function loadGame()


    print("Loading the game...")


    -- Your loading logic goes here


    end


    local function optionsMenu()


    print("Options menu...")


    -- Your options menu logic goes here


    end


    local function quitGame()


    print("Quitting the game.")


    -- Your quit logic goes here


    end


    local actions = {


    [1] = startGame,


    [2] = loadGame,


    [3] = optionsMenu,


    [4] = quitGame,


    }


    local choice


    repeat


    print("Main Menu:")


    print("1\. Start Game")


    print("2\. Load Game")


    print("3\. Options")


    print("4\. Quit")


    choice = tonumber(io.read())


    if actions[choice] then


    actions[choice]()


    else


    print("Invalid choice. Please try again.")


    end


    until choice == 4


    In this chapter, we explored the art of "Handling Input Options" in Lua scripting.
    By utilizing if-else statements or tables to map input to specific actions, we
    can create interactive and engaging games. Additionally, we learned how to build
    interactive menus and handle user input using separate functions for each option.


