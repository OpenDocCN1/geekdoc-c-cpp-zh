  trans: "\n\n恭喜！你已成功完成了建议的形成性项目，使用 Lua 表（tables）创建了一个功能性的库存系统。在这个项目中，我们学习了如何初始化表、向库存中添加物品、从库存中移除物品以及显示库存内容。\n\
    \n这个形成性项目只是表在游戏开发场景中利用方式的一个示例。随着课程的不断深入，你将发现更多利用 Lua 表的能力来增强你的游戏开发项目的方法。\n\n#\
    \ 第 7 节：元表（Metatables）与面向对象程序编程\n\n## 元表（Metatables）\n\n在本章中，我们将深入探讨元表的概念，并探索它们如何让你能够自定义表的行为，从而使元编程成为可能。\n\
    \n### 理解元表\n\nLua 中的元表允许你将自定义行为与表关联。可以将元表想象成控制其他表行为的“隐藏”表。当你对一个表执行某些操作时，Lua 会检查该表是否关联了一个元表。如果有，Lua\
    \ 就会查找元表中定义的特定元方法（特殊函数）来处理这些操作。\n\n### 建立一个元表\n\n要创建一个元表，你需要定义一个包含元方法的表，并使用 `setmetatable`\
    \ 函数将其与目标表关联。让我们创建一个简单的示例，为一个代表 2D 向量的表定义一个元表：\n\n```lua\n-- 为 2D 向量表定义元表\nlocal\
    \ vectorMetatable = {\n  -- 定义加法元方法\n  __add = function(left, right)\n    return\
    \ { x = left.x + right.x, y = left.y + right.y }\n  end,\n\n  -- 定义减法元方法\n  __sub\
    \ = function(left, right)\n    return { x = left.x - right.x, y = left.y - right.y\
    \ }\n  end,\n\n  -- 定义长度元方法\n  __len = function(vector)\n    return math.sqrt(vector.x²\
    \ + vector.y²)\n  end\n}\n\n-- 创建一个代表 2D 向量的表\nlocal vector1 = { x = 2, y = 3\
    \ }\nlocal vector2 = { x = 1, y = 2 }\n\n-- 将元表与向量表关联\nsetmetatable(vector1, vectorMetatable)\n\
    setmetatable(vector2, vectorMetatable)\n\n-- 执行向量加法和减法\nlocal resultAdd = vector1\
    \ + vector2\nlocal resultSub = vector1 - vector2\n\nprint(\"Addition result:\"\
    , resultAdd.x, resultAdd.y) -- Output: Addition result: 3 5\nprint(\"Subtraction\
    \ result:\", resultSub.x, resultSub.y) -- Output: Subtraction result: 1 1\n\n\
    -- 使用自定义的 __len 元方法计算向量长度\nprint(\"Length of vector1:\", #vector1) -- Output:\
    \ Length of vector1: 3.605551275463989\nprint(\"Length of vector2:\", #vector2)\
    \ -- Output: Length of vector2: 2.23606797749979\n```\n\n在这个示例中，我们定义了一个元表 `vectorMetatable`，它包含了针对\
    \ 2D 向量加法、减法和长度的元方法。我们将这个元表与 `vector1` 和 `vector2` 关联，使得能够在它们上使用 `+` 和 `-` 运算符并计算长度。\n\
    \n### 自定义表的行为\n\n通过元表，你可以自定义表的行为。以下是一些你可以使用的常用元方法：\n\n- `__add`: 定义 `+` 运算符的行为。\n\
    - `__sub`: 定义 `-` 运算符的行为。\n- `__mul`: 定义 `*` 运算符的行为。\n- `__div`: 定义 `/` 运算符的行为。\n\
    - `__eq`: 定义 `==` 运算符的行为。\n- `__lt`: 定义 `<` 运算符的行为。\n- `__le`: 定义 `<=` 运算符的行为。\n\
    - `__len`: 定义 `#` 运算符的行为。\n- `__index`: 定义访问键（key）时的行为。\n- `__newindex`: 定义设置新键时的行为。\n\
    - `__create`: 定义创建新表时的行为。\n- `__call`: 定义当表像函数一样被调用时的的行为。\n- `__tostring`: 定义字符串转换的行为。\n\
    \n## 在游戏开发中使用元表\n\n元表对于游戏开发来说极其强大。在本章中，我们使用元表创建了复杂的游戏系统。恭喜你学习了元表！\n\n## 面向对象程序编程\n\
    \nOOP 是一种允许我们对现实世界实体进行建模的范式。在 Lua 中，我们可以使用元表和表来实现 OOP。\n\n### 创建一个类\n\n在 Lua 中，类本质上是一个表。让我们定义一个简单的类：\n\
    \n```lua\n-- 定义 Player 类\nPlayer = {}\nPlayer.__index = Player\n\n-- Player 的构造函数方法\n\
    function Player.new(name, health)\n  local self = setmetatable({}, Player)\n \
    \ self.name = name\n  self.health = health\n  return self\nend\n\n-- 显示玩家信息的方法\n\
    function Player:displayInfo()\n  print(\"Player:\", self.name, \"| Health:\",\
    \ self.health)\nend\n\n-- 创建 Player 的实例\nlocal player1 = Player.new(\"John\",\
    \ 100)\nlocal player2 = Player.new(\"Jane\", 150)\n\n-- 显示玩家信息\nplayer1:displayInfo()\
    \ -- Output: Player: John | Health: 100\nplayer2:displayInfo() -- Output: Player:\
    \ Jane | Health: 150\n```\n\n### 创建对象并访问数据\n\n要创建类的对象（实例），我们使用构造方法。对象将拥有各自的数据，并可以访问类中定义的方法。我们使用冒号语法\
    \ (:) 来定义方法，允许方法隐式地接收对象作为第一个参数。\n\n### 继承与多态\n\nLua 通过元表支持简单的继承和多态。要创建一个子类，我们可以定义一个新表并将其元表设置为父类。子类将继承父类的行为，我们可以根据需要重写或扩展其方法。\n\
    \n```lua\n-- 将 Mage 类定义为 Player 的子类\nMage = {}\nMage.__index = Mage\nsetmetatable(Mage,\
    \ { __index = Player }) -- 继承 Player 类\n\n-- Mage 的构造函数方法\nfunction Mage.new(name,\
    \ health, mana)\n  local self = setmetatable(Player.new(name, health), Mage)\n\
    \  self.mana = mana\n  return self\nend\n\n-- 为 Mage 重写 displayInfo 方法\nfunction\
    \ Mage:displayInfo()\n  print(\"Mage:\", self.name, \"| Health:\", self.health,\
    \ \"| Mana:\", self.mana)\nend\n\n-- 创建 Mage 类实例\nlocal mage1 = Mage.new(\"Merlin\"\
    , 80, 200)\n\n-- 显示 mage 信息\nmage1:displayInfo() -- Output: Mage: Merlin | Health:\
    \ 80 | Mana: 200\n```\n\n"
