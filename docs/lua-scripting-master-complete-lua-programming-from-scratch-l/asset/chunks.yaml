- fmt: "\n```c\n#include <lualib.h>\n```\n\nThese header files contain the necessary\
    \ functions and macros for working with Lua in C.\n\n### Step 2: Create a Lua\
    \ State\n\n```c\nlua_State* L = luaL_newstate();\n```\n\nThe Lua state (`L`) represents\
    \ the entire Lua environment. We create a new state using the `luaL_newstate()`\
    \ function.\n\n### Step 3: Load Lua Standard Libraries\n\n```c\nluaL_openlibs(L);\n\
    ```\n\nBy calling `luaL_openlibs(L)`, we load the standard Lua libraries into\
    \ the Lua state. These libraries provide essential functions and modules to the\
    \ Lua environment.\n\n### Step 4: Load and Execute Lua Script\n\n```c\nif (luaL_loadfile(L,\
    \ \"script.lua\") || lua_pcall(L, 0, 0, 0)) {\n\n  fprintf(stderr, \"Error: %s\\\
    n\", lua_tostring(L, -1));\n\n  return 1;\n\n}\n```\n\nIn this example, we load\
    \ and execute the Lua script from a file named `\"script.lua\"`. If any errors\
    \ occur during loading or execution, they will be printed to the standard error\
    \ stream.\n\n### Step 5: Call Lua Functions from C\n\n```c\nlua_getglobal(L, \"\
    my_lua_function\");\n\nlua_pushinteger(L, 42);\n\nlua_pushstring(L, \"Hello, Lua!\"\
    );\n\nif (lua_pcall(L, 2, 1, 0) != LUA_OK) {\n\n  fprintf(stderr, \"Error calling\
    \ Lua function: %s\\n\", lua_tostring(L, -1));\n\n  return 1;\n\n}\n\nint result\
    \ = lua_tointeger(L, -1);\n\nprintf(\"Result from Lua function: %d\\n\", result);\n\
    \nlua_pop(L, 1); // Pop the result from the stack\n```\n\nHere, we call a Lua\
    \ function named `\"my_lua_function\"` with two arguments: an integer and a string.\
    \ The function returns an integer result, which we retrieve and print.\n\n###\
    \ Step 6: Clean Up\n\n```c\nlua_close(L);\n```\n\nBefore exiting the C application,\
    \ we must close the Lua state using `lua_close(L)` to free any allocated resources.\n\
    \n### Putting It All Together\n\nNow, let's put the steps together into a complete\
    \ C program:\n\n```c\n#include <stdio.h>\n#include <lua.h>\n#include <lauxlib.h>\n\
    #include <lualib.h>\n\nint main() {\n\n  lua_State* L = luaL_newstate();\n\n \
    \ luaL_openlibs(L);\n\n  if (luaL_loadfile(L, \"script.lua\") || lua_pcall(L,\
    \ 0, 0, 0)) {\n\n    fprintf(stderr, \"Error: %s\\n\", lua_tostring(L, -1));\n\
    \n    return 1;\n\n  }\n\n  lua_getglobal(L, \"my_lua_function\");\n\n  lua_pushinteger(L,\
    \ 42);\n\n  lua_pushstring(L, \"Hello, Lua!\");\n\n  if (lua_pcall(L, 2, 1, 0)\
    \ != LUA_OK) {\n\n    fprintf(stderr, \"Error calling Lua function: %s\\n\", lua_tostring(L,\
    \ -1));\n\n    return 1;\n\n  }\n\n  int result = lua_tointeger(L, -1);\n\n  printf(\"\
    Result from Lua function: %d\\n\", result);\n\n  lua_pop(L, 1);\n\n  lua_close(L);\n\
    \n  return 0;\n\n}\n```\n\nIn this example, we assume that we have a Lua script\
    \ named `\"script.lua\"` with the following contents:\n\n```lua\nfunction my_lua_function(x,\
    \ message)\n  print(\"Received x:\", x)\n  print(\"Received message:\", message)\n\
