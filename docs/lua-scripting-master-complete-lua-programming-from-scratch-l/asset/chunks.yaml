    cjson\")\nlocal file = io.open(\"data.json\", \"r\")\nlocal contents = file:read(\"\
    *all\")\nlocal data = cjson.decode(contents)\nprint(data.name)\nfile:close()\n\
    ```\n\n读取文件内容是游戏开发者的一项基本技能，允许你加载外部数据并让游戏更加动态和可定制。在本章中，我们涵盖了打开文件、将其内容读取为单个字符串或逐行读取、处理错误以及使用第三方库处理不同的文件格式。\n\
    \n记住在读取后务必关闭文件以释放资源。此外，请考虑错误处理并验证从文件中读取的数据，以确保游戏的稳定性和可靠性。\n\n在下一章中，我们将探索“多重赋值”（Multiple\
    \ Assignment），这是一项强大的 Lua 特性，允许我们同时处理多个变量和值，进一步提高我们的编码效率。\n\n# 多重赋值\n\n多重赋值允许你同时为多个变量赋值，使你的代码更加简洁且富有表现力。作为游戏开发者，你会发现这一特性对于处理复杂数据和优化游戏性能非常有用。\n\
    \n### 基础多重赋值\n\n让我们从一个简单的多重赋值示例开始。你可以在一行中为多个变量赋值，用逗号分隔。\n\n```lua\nlocal x, y,\
    \ z = 10, 20, 30\nprint(x, y, z) -- 输出: 10 20 30\n```\n\n### 交换变量\n\n多重赋值使得交换变量值变得轻而易举，不需要临时变量。\n\
