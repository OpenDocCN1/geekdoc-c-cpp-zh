    \n### 嵌套循环与 \"break\":\n\n在处理嵌套循环时，`break` 语句只会退出它所在的最内层循环。如果你想跳出多个嵌套循环，可以使用布尔标记或重构代码。\n\
    \n```lua\n-- Example: Nested loops and \"break\"\nfor i = 1, 5 do\n    for j =\
    \ 1, 5 do\n        if i == 3 and j == 3 then\n            print(\"Reached (3,\
    \ 3), breaking out of loops.\")\n            break\n        end\n    end\nend\n\
    ```\n\n循环选项是控制 Lua 执行流的强大工具。通过有效使用 `break` 和模拟 `continue`，你可以优化你的游戏开发流程。\n\n#\
