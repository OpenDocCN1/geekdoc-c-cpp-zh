    C Project Folder Structure


    In this chapter, we''ll dive into organizing the folder structure for your C project
    when integrating Lua. A well-structured project not only improves code maintainability
    but also enhances collaboration and overall development efficiency.


    Setting Up the Folder Structure


    To create a well-organized C project that integrates Lua, we''ll set up the following
    folder structure:


    project_root/: This is the root directory of your project.


    src/: This directory will contain all the C source files for your project.


    include/: Place all the header files (.h) here.


    lua_scripts/: Store your Lua scripts (.lua) in this directory.


    assets/: If your project includes assets like images, sounds, or configuration
    files, place them here.


    bin/: This is where the compiled executable or binary will be generated.


    build/: Intermediate build files and object files (.o) go here.


    lib/: Store any external libraries or dependencies your project uses.


    Now, let''s create the folder structure within your project root directory. For
    example:


    LuaScriptingProject/


    ├── src/


    │   ├── main.c


    │   ├── player.c


    │   ├── game.c


    │   └── ...


    ├── include/


    │   ├── player.h


    │   ├── game.h


    │   └── ...


    ├── lua_scripts/


    │   ├── script.lua


    │   ├── ai.lua


    │   └── ...


    ├── assets/


    │   ├── player.png


    │   ├── background.mp3


    │   └── ...


    ├── bin/


    │   └── LuaGame.exe (or LuaGame on Linux/Mac)


    ├── build/


    │   └── ...


    └── lib/


    └── lua/


    ├── lua.h


    ├── lua.lib (or liblua.a on Linux/Mac)


    └── …


    In this example, we have a simple game project with C source files in the src/
    folder, corresponding header files in the include/ folder, Lua scripts in the
    lua_scripts/ folder, and assets in the assets/ folder.


    Compiling the C Project


    To compile the C project and link it with Lua, we''ll use a build system or a
    makefile. Here''s a simple example of a makefile:


    CC = gcc


    CFLAGS = -Wall -Iinclude


    LDFLAGS = -Llib/lua -llua


    SRCDIR = src


    OBJDIR = build


    BINDIR = bin


    SOURCES = $(wildcard $(SRCDIR)/*.c)


    OBJECTS = $(patsubst $(SRCDIR)/%.c,$(OBJDIR)/%.o,$(SOURCES))


    EXECUTABLE = $(BINDIR)/LuaGame


    .PHONY: all clean


    all: $(EXECUTABLE)


    $(EXECUTABLE): $(OBJECTS)


    $(CC) $(LDFLAGS) -o $@ $^


    $(OBJDIR)/%.o: $(SRCDIR)/%.c


    $(CC) $(CFLAGS) -c -o $@ $<


    clean:


    rm -f $(EXECUTABLE) $(OBJECTS)


    Save this content in a file named "makefile" (or "Makefile"). Replace the paths
    and names according to your project structure. To build your project, navigate
    to the root directory of your project and run the following command:


    make


