  trans: "\n当你想重复执行某个操作直到条件变为假时，`while` 循环非常有用用。只要条件保持为真，它就会持续执行代码块。\n\n-- 示例：使用 while\
    \ 循环让部件向上移动，直到达到特定高度\n\n```lua\nlocal part = game.Workspace.Part -- 将 \"Part\"\
    \ 替换为你部件的名字\n\nlocal targetHeight = 20\n\nwhile part.Position.Y < targetHeight\
    \ do\n    part.Position = part.Position + Vector3.new(0, 1, 0)\n    wait(0.1)\
    \ -- 引入延迟以控制移动速度\nend\n```\n\n在这个示例中，部件将向上移动，直到达到 20 个单位的目标高度。\n\n## 条件语句简介\n\n\
    条件语句是决策结构，根据条件为真还是假来执行特定的代码块。我们使用 `if`、`elseif` 和 `else` 来控制脚本的流。\n\n-- 示例：使用条件语句处理玩家健康\n\
    \n```lua\nlocal player = game.Players.LocalPlayer -- 获取本地玩家\nlocal health = 80\
    \ -- 假设玩家的健康值为 80\n\nif health > 100 then\n    print(\"玩家状态完美。\")\nelseif health\
    \ > 50 then\n    print(\"玩家受伤了但仍站立。\")\nelse\n    print(\"玩家伤势严重。寻求帮助！\")\nend\n\
    ```\n\n在这个示例中，脚本检查玩家的健康状况并根据其健康值打印适当的消息。\n\n## 结合循环和条件语句\n\n你可以将循环和条件语句结合起来创建动态游戏。例如，你可以使用一个循环来遍历敌人列表，并使用条件语句根据玩家的距离或健康值来决定它们的行为。\n\
    \n-- 示例：结合 for 循环和条件语句生成敌人\n\n```lua\nlocal spawnLocations = {\n    Vector3.new(10,\
    \ 0, 10),\n    Vector3.new(-10, 0, 10),\n    Vector3.new(10, 0, -10),\n    Vector3.new(-10,\
    \ 0, -10)\n}\n\nfor i, spawnLocation in ipairs(spawnLocations) do\n    local enemy\
    \ = Instance.new(\"Part\")\n    enemy.Size = Vector3.new(2, 2, 2)\n    enemy.Position\
    \ = spawnLocation\n    enemy.BrickColor = BrickColor.Random()\n    enemy.Parent\
    \ = game.Workspace\n    if (player.Character.HumanoidRootPart.Position - spawnLocation).Magnitude\
    \ < 15 then\n        enemy.CanCollide = false\n    else\n        enemy.CanCollide\
    \ = true\n    end\nend\n```\n\n在这个示例中，我们在不同的位置生成敌人，并且如果它们在玩家 15 个单位范围内，则让它们变为无实体。\n\
    \n在本章中，我们探索了 Roblox Lua 脚本中循环和条件语句的世界。循环允许我们重复操作，而条件语句允许我们根据各种情况做出决策并调整游戏玩法。\n\
    \n结合循环和条件语句赋予了我们创建动态且吸引人的游戏的能力，这些游戏能够响应玩家的操作和游戏内事件。尝试不同的循环结构和条件语句，为你的游戏增加深度和复杂性。\n\
    \n在下一章，我们将深入研究 Roblox Lua 中的事件处理，允许你创建交互式游戏机制并响应玩家输入。\n\n# Roblox 事件\n\n事件对于在\
    \ Roblox Lua 脚本中创建交互和动态的游戏玩法至关重要。它们允许游戏的不同部分之间进行通信，并对特定的操作或游戏变化做出响应。\n\n## 事件简介\n\
    \nRoblox 中的事件就像信号，可以触发操作或通知游戏的其他部分关于特定发生的情况。它们对于让游戏对象之间相互作用以及处理玩家输入至关重要。\n\n##\
    \ 理解事件连接\n\n在 Roblox Lua 中，你可以将函数连接到事件，以便每当事件触发时都执行该函数。这允许你为各种游戏场景创建自定义行为。\n\n\
    -- 示例：将函数连接到部件的 'Touched' 事件\n\n```lua\nlocal part = game.Workspace.Part -- 将\
    \ \"Part\" 替换为你部件的名字\n\nlocal function onPartTouched(otherPart)\n    print(\"\
    部件被触摸了：\" .. otherPart.Name)\nend\n\npart.Touched:Connect(onPartTouched)\n```\n\
    \n在这个示例中，我们将 `onPartTouched` 函数连接到特定部件的 `Touched` 事件。当另一个部件触摸它时，该函数将执行，并在输出窗口中打印消息。\n\
    \n## 创建自定义事件\n\n你还可以创建自己的自定义事件，允许游戏不同部分之间进行通信。自定义事件适用于处理游戏内机制或交互。\n\n-- 示例：创建一个自定义事件来处理玩家健康值的变化\n\
    \n```lua\nlocal player = game.Players.LocalPlayer -- 获取本地玩家\nlocal healthChangedEvent\
    \ = Instance.new(\"BindableEvent\")\n\nlocal function onHealthChanged(newHealth)\n\
    \    print(\"玩家健康值变为：\" .. newHealth)\nend\n\nhealthChangedEvent.Event:Connect(onHealthChanged)\n\
    \n-- 假设玩家的健康值已经变化，我们可以这样触发事件：\nhealthChangedEvent:Fire(80) -- 传递新的健康值（将 80 替换为适当的值）\n\
    ```\n\n在这个示例中，我们创建了一个名为 `healthChangedEvent` 的自定义事件，它在触发时触发 `onHealthChanged`\
    \ 函数。这是一个基础实现，你可以根据游戏需求对其自定义。\n\n## 处理用户输入\n\n事件对于处理用户输入（如键盘或鼠标操作）也关重要。你可以使用 Roblox\
    \ 事件捕捉玩家输入并创建响应式控制。\n\n-- 示例：使用键盘输入处理玩家跳跃\n\n```lua\nlocal player = game.Players.LocalPlayer\
    \ -- 获取本地玩家\nlocal character = player.Character\nlocal humanoid = character:WaitForChild(\"\
    Humanoid\")\n\nlocal function onJump(actionName, inputState, inputObject)\n  \
    \  if inputState == Enum.UserInputState.Begin then\n        humanoid.Jump = true\n\
    \    end\nend\n\ngame:GetService(\"UserInputService\").JumpRequest:Connect(onJump)\n\
    ```\n\n在这个示例中，我们将 `onJump` 函数连接到 `UserInputService` 的 `JumpRequest` 事件。当玩家按下跳跃键时，`humanoid`\
    \ 的 `Jump` 属性被设置为 `true`。\n"
