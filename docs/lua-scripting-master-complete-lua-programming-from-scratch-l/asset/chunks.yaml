    \ -2));\n    printf(\"Boolean Value: %s\\n\", lua_toboolean(L, -1) ? \"true\"\
    \ : \"false\");\n    // Peeking the values on the stack\n    printf(\"Peek Integer\
    \ Value: %d\\n\", lua_tointeger(L, -3));\n    printf(\"Peek String Value: %s\\\
    n\", lua_tostring(L, -2));\n    printf(\"Peek Boolean Value: %s\\n\", lua_toboolean(L,\
