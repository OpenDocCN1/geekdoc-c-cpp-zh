    当我们知道要执行的迭代次数时，for 循环特别有用。它的语法允许我们指定循环的起始、结束和步长。让我们探索 Lua 中 for 循环的不同方面。


    ### 基础 for 循环


    基础 for 循环的语法由三部分组成：初始化、条件和增量。我们使用 `for` 关键字跟随变量名、等号 `=`初始值、逗号、最终值、“do,”以及步长。循环体包含在
    "end" 之间。


    -- 示例：打印从 1 到 5 的数字


    ```lua

    for i = 1, 5, 1 do

    print("迭代:", i)

    end

    ```


