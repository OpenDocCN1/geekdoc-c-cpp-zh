    The Game Loop


    In this chapter, we''ll dive into the heart of game development – the game loop.
    The game loop is a fundamental concept in game development, responsible for handling
    updates, rendering, and user input in a continuous loop. We''ll explore how to
    implement a simple game loop in C, using SDL and Lua to create a basic game.


    Understanding the Game Loop:


    The game loop is a continuous loop that runs throughout the lifetime of the game.
    It performs the following main tasks:


    Handling user input: Collecting and processing user input, such as keyboard and
    mouse events.


    Updating game logic: Calculating changes in the game''s state, including the positions
    of objects, scores, and other game-specific variables.


    Rendering: Drawing the updated game state to the screen, creating the visual experience
    for players.


    Step 1: Setting Up SDL and Lua


    Before creating the game loop, make sure you have installed SDL and Lua correctly
    following the instructions provided in previous chapters (Chapter 63 for SDL and
    Chapter 5 for Lua).


    Step 2: Initializing SDL


    In our C code, we need to initialize SDL, just like we did when creating the SDL
    window:


    #include <SDL2/SDL.h>


    int main() {


    // Initialize SDL


    if (SDL_Init(SDL_INIT_VIDEO) < 0) {


    printf("SDL could not initialize! SDL_Error: %s\n", SDL_GetError());


    return -1;


    }


    // Rest of the code goes here...


    }


    Step 3: Creating the Game Loop


    To create the game loop, we''ll use a while loop that runs until the player exits
    the game. Inside the loop, we''ll handle user input, update the game state, and
    render the game''s visuals.


    #include <SDL2/SDL.h>


    int main() {


    // Initialize SDL


    if (SDL_Init(SDL_INIT_VIDEO) < 0) {


    printf("SDL could not initialize! SDL_Error: %s\n", SDL_GetError());


    return -1;


    }


    // Create an SDL window (as discussed in Chapter 64)


    // Create an SDL renderer (as discussed in Chapter 66)


    // Create a Lua state and load Lua scripts (as discussed in Chapter 53)


    // Game loop


    SDL_Event event;


    bool isRunning = true;


    while (isRunning) {


    // Handle events


    while (SDL_PollEvent(&event)) {


    if (event.type == SDL_QUIT) {


    isRunning = false;


    }


    // Handle other input events (e.g., keyboard, mouse) here if needed


    }


    // Update game logic using Lua (call Lua functions to update game state)


    // Clear the screen


    SDL_RenderClear(renderer);


    // Render game elements using Lua (call Lua functions to draw game elements)


    // Update the screen


    SDL_RenderPresent(renderer);


    }


    // Cleanup and quit


    SDL_DestroyRenderer(renderer);


    SDL_DestroyWindow(window);


    SDL_Quit();


    return 0;


    }


    Step 4: Updating Game Logic using Lua


    In this example, we assume that you have created Lua scripts that handle game
    logic updates and rendering. You can integrate Lua with your C game loop by calling
    Lua functions to perform these tasks.


    For example, suppose you have a Lua script named "game_logic.lua" that contains
    functions to update the player''s position and check for collisions. In your C
    code, you can use the Lua API to call these functions:


    #include <lua.h>


    #include <lauxlib.h>


    #include <lualib.h>


    lua_State* L = luaL_newstate();


    luaL_openlibs(L);


    int error = luaL_dofile(L, "game_logic.lua");


    if (error) {


    printf("Error loading Lua script: %s\n", lua_tostring(L, -1));


    return -1;


    }


    // Call Lua function to update game logic


    lua_getglobal(L, "update_player_position");


    if (lua_isfunction(L, -1)) {


    if (lua_pcall(L, 0, 0, 0) != 0) {


    printf("Error calling Lua function: %s\n", lua_tostring(L, -1));


    return -1;


    }


    }


    lua_pop(L, 1);


    Step 5: Rendering Game Elements using Lua


    Similarly, you can have another Lua script named "game_render.lua" that contains
    functions to draw game elements on the screen. You can call these functions from
    your C code to render the game''s visuals:


    // Call Lua function to render game elements


    lua_getglobal(L, "draw_game_elements");


    if (lua_isfunction(L, -1)) {


    if (lua_pcall(L, 0, 0, 0) != 0) {


    printf("Error calling Lua function: %s\n", lua_tostring(L, -1));


    return -1;


    }


    }


    lua_pop(L, 1);


    Putting it All Together:


    Now that we have created the game loop and integrated Lua with C, your game loop
    is up and running! The loop will continuously handle input, update the game state
    using Lua, and render the visuals using Lua.


    This example provides a basic structure for your game loop, and you can expand
    it by adding more game-specific logic, implementing collision detection, creating
    game levels, and enhancing the game''s graphics.


    Remember, game development is an iterative process, and there''s always room for
    improvement and creativity. Feel free to experiment, add your own ideas, and create
    a unique gaming experience with Lua and C!


    In this chapter, we explored the essentials of the game loop and integrated Lua
    with C to handle game logic and rendering. The game loop is the foundation of
    any game, ensuring it runs smoothly, accepts input, and provides a visual display
    to the players.


    I hope you enjoyed this chapter and that it has sparked your creativity in developing
    engaging games using Lua and C. The journey doesn''t end here; there are countless
    possibilities and features you can add to your games. Keep exploring, experimenting,
    and honing your game development skills. Happy coding, and I''ll see you in the
    next chapter!


    SDL Rendering


    In this chapter, we''ll explore SDL rendering and learn how to display our game
    elements on the screen using SDL in combination with Lua.


    Understanding SDL Rendering:


    SDL (Simple DirectMedia Layer) provides a powerful and straightforward API for
    rendering graphics on the screen. It allows us to draw various elements, such
    as images, shapes, and text, to create a visually engaging game.


    Step 1: Setting Up SDL for Rendering


    Before we begin rendering game elements, ensure that you have successfully installed
    SDL on your platform, as we discussed in Chapter 63\. Make sure to include the
    necessary SDL header files in your C code:


    #include <SDL2/SDL.h>


    Step 2: Creating an SDL Renderer


    To render game elements on the screen, we need to create an SDL renderer associated
    with our SDL window. The renderer is responsible for drawing graphics on the window.


    SDL_Window* window = NULL;


    SDL_Renderer* renderer = NULL;


    // Create an SDL window (as discussed in Chapter 64)


    // Make sure the SDL window is created before proceeding to the next step.


    // Create an SDL renderer


    renderer = SDL_CreateRenderer(window, -1, SDL_RENDERER_ACCELERATED);


    if (renderer == NULL) {


    printf("Failed to create SDL renderer! SDL_Error: %s\n", SDL_GetError());


    // Handle the error or exit the program


    }


    Step 3: Rendering Game Elements using Lua


    Now that we have set up the SDL renderer, we can use Lua to handle the actual
    rendering of game elements. In our Lua script, we''ll create functions to draw
    different game elements, such as images, shapes, and text.


    In this example, we''ll create a simple Lua script named "game_render.lua" to
    draw a basic rectangle on the screen:


    -- game_render.lua


    function draw_rectangle(x, y, width, height)


    -- Set the rendering color (in this case, red)


    SDL_SetRenderDrawColor(renderer, 255, 0, 0, 255)


    -- Create the rectangle


    local rect = SDL_Rect(x, y, width, height)


    -- Render the rectangle to the screen


    SDL_RenderFillRect(renderer, rect)


    end'
