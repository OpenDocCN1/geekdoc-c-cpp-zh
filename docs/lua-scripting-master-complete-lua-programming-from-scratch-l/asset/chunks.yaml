  raw: 'Now that you have Lua installed, you can use the interactive interpreter (REPL)
    to try out simple Lua scripts. Open your terminal and type:


    lua


    This will launch the Lua REPL, where you can type Lua commands and see their immediate
    output.


    print("Hello, macOS!")


    You should see the output "Hello, macOS!" displayed on the screen.


    Running Lua Scripts:


    In addition to the interactive interpreter, you can also run Lua scripts saved
    in files. Create a new text file named ''myscript.lua'' with the following content:


    local name = "Alice"


    print("Hello, " .. name .. "!")


    Save the file, and in the terminal, navigate to the directory where the script
    is saved. To execute the script, type:


    lua myscript.lua


    You''ll see the output "Hello, Alice!" displayed on the screen.


    Congratulations! You''ve successfully installed Lua on your macOS system and run
    simple Lua scripts using the interactive interpreter and through script files.
    Now you have all the tools to dive deeper into Lua scripting and explore its integration
    with C and Roblox Studio.


    In the next chapter, we''ll cover the installation of Lua on Windows, ensuring
    you have a comprehensive understanding of Lua across different platforms.


    Installing Lua on Windows


    In this chapter, we''ll guide you through the process of installing Lua on Windows.
    Whether you''re using Windows 10, Windows 8, or any other version, the installation
    steps are straightforward.


    Step 1: Downloading Lua for Windows


    To install Lua on Windows, we''ll download the official Windows binaries from
    the Lua website. Follow these steps:


    Open your web browser and go to the Lua official website: https://www.lua.org/


    Click on the "Download" link from the menu at the top.


    Scroll down to the "Windows Binaries" section and click on the link corresponding
    to the latest version of Lua for Windows.


    Once the download is complete, locate the downloaded file (e.g., "lua-5.x.x_Win64_bin.zip")
    and extract its contents to a folder of your choice. You can use any unzip utility,
    such as 7-Zip or WinRAR.


    Step 2: Adding Lua to the System PATH


    To use Lua from the command prompt in any directory, you need to add the Lua executable
    path to the system PATH.


    Press the "Windows key" + "R" on your keyboard to open the "Run" dialog.


    Type "sysdm.cpl" and click "OK" to open the System Properties window.


    In the System Properties window, go to the "Advanced" tab and click on the "Environment
    Variables" button.


    In the Environment Variables window, locate the "Path" variable under the "System
    variables" section and click "Edit."


    Click "New" and add the path to the Lua executable (e.g., C:\path\to\lua-5.x.x_Win64_bin)
    to the list of paths.


    Click "OK" to save the changes.


    Step 3: Verifying the Installation


    Now that Lua is installed and added to the system PATH, you can verify the installation
    by opening a new command prompt window. Type the following command:


    lua -v


    You should see the Lua version number displayed on the screen, indicating that
    Lua has been installed successfully on your Windows system.


    Using Lua Interactive Interpreter (REPL) on Windows:


    Now that you have Lua installed, you can use the interactive interpreter (REPL)
    to try out simple Lua scripts. Open a command prompt window and type:


    lua


    This will launch the Lua REPL, where you can type Lua commands and see their immediate
    output.


    print("Hello, Windows!")


    You should see the output "Hello, Windows!" displayed on the screen.


    Running Lua Scripts:


    In addition to the interactive interpreter, you can also run Lua scripts saved
    in files. Create a new text file named ''myscript.lua'' with the following content:


    local name = "John"


    print("Hello, " .. name .. "!")


    Save the file, and in the command prompt, navigate to the directory where the
    script is saved. To execute the script, type:


    lua myscript.lua


    You''ll see the output "Hello, John!" displayed on the screen.


    Congratulations! You''ve successfully installed Lua on your Windows system and
    run simple Lua scripts using the interactive interpreter and through script files.
    Now you have all the tools to dive deeper into Lua scripting and explore its integration
    with C and Roblox Studio.


    Section 2:


    Variables and Expressions


    Our First Lua Script


    In this chapter, we''ll dive into writing our very first Lua script. We''ll cover
    the basics of variables, expressions, and print statements as we take our first
    step into the world of Lua programming.


    Let''s get started!


    Step 1: Setting Up the Environment


    Before we begin writing our first Lua script, make sure you have Lua installed
    on your platform. If you haven''t installed it yet, refer to the appropriate chapter
    in the "Installing and Using Lua" section of the book.


    Step 2: Creating a New Lua Script File


    We''ll start by creating a new text file named "first_script.lua" using a text
    editor or code editor of your choice. Ensure that the file has the ".lua" extension,
    indicating that it is a Lua script.


    Step 3: Writing the Lua Script


    In our first Lua script, we''ll learn about variables and print statements. Type
    the following code into "first_script.lua":


    -- Our First Lua Script


    -- Declare a variable to store our name


    local name = "John Doe"


    -- Print a welcome message using the value of the variable


    print("Hello, " .. name .. "! Welcome to the world of Lua scripting.")


    In this script, we use a variable named "name" to store the value "John Doe."
    We then use the print function to display a welcome message that includes the
    value of the "name" variable. The ".." is used to concatenate the string "Hello,
    " with the value stored in the "name" variable and the string " Welcome to the
    world of Lua scripting."


    Step 4: Running the Lua Script


    To execute our first Lua script, follow these steps:


    Open a command prompt or terminal on your platform.


    Navigate to the directory where you saved the "first_script.lua" file.


    Type the following command to run the script:


    lua first_script.lua


    After executing the command, you should see the following output on the screen:


    Hello, John Doe! Welcome to the world of Lua scripting.


    Congratulations! You''ve successfully written and executed your first Lua script.
    You now have a basic understanding of variables, expressions, and print statements
    in Lua.


    Feel free to experiment with different values for the "name" variable and observe
    the changes in the output.


    In this chapter, we''ve explored the basics of writing Lua scripts. We learned
    about variables, expressions, and using the print function to display output.
    These fundamental concepts will serve as a strong foundation as we progress through
    the rest of the course.


    Variables


    Variables are fundamental to any programming language as they allow us to store
    and manipulate data. We''ll learn how to declare variables, assign values to them,
    and use them in expressions.


    Let''s get started!


    Declaring Variables:


    In Lua, you don''t need to explicitly declare the data type of a variable. Instead,
    you can simply assign a value to a variable, and Lua will automatically determine
    its type. To declare a variable, use the keyword "local" followed by the variable
    name. For example:


    local playerName


    Assigning Values to Variables:


    To assign a value to a variable, use the assignment operator "=" followed by the
    value. Here''s an example:


    local playerName = "John Doe"


    In this example, we declare a variable named "playerName" and assign the value
    "John Doe" to it.


    Data Types and Variable Values:


    Lua supports several data types, including numbers, strings, booleans, and tables.
    Let''s see how we can use these data types in variables:


    local score = 100              -- Number (integer)


    local playerName = "Alice"     -- String


    local isGameOver = false       -- Boolean (true or false)


    local inventory = {           -- Table (collection of key-value pairs)


    apples = 5,


    bananas = 3,


    oranges = 10


    }


