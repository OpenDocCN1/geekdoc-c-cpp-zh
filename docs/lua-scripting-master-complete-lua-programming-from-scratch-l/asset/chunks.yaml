    # Lua 模式中的特殊字符


    特殊字符为我们的模式匹配能力增加了新层次的灵活性和力量，允许我们为游戏开发中的文本处理和解析定义复杂且动态的模式。


    #### 通配符 - "."


    点号 `.` 是一个强大的通配符，可以匹配除换行符以外的任意字符。它允许我们搜索那些在某些位置不需要指定精确字符的模式。


    -- 示例：查找以 "at" 结尾后跟任意字符的单词


    ```lua

    local text = "The cat sat on the mat."

    local patternToFind = "%sat."

    local startPos, endPos = string.find(text, patternToFind)


    if startPos then

    print("找到结尾为 ''at.'' 的模式，位置位于:", startPos, "-", endPos)

    else

    print("未找到模式.")

    end

    ```


    #### 字符类 - "[ ]"


    字符类允许我们指定一组可以在特定位置匹配的字符。它们被定义在方括号内。


    -- 示例：查找包含元音的单词


    ```lua

    local text = "The quick brown fox jumps over the lazy dog."

    local patternToFind = "[aeiou]"

    local startPos, endPos = string.find(text, patternToFind)


    while startPos do

    print("找到元音，位置位于:", startPos, "-", endPos)

    startPos, endPos = string.find(text, patternToFind, endPos + 1)

    end

    ```


    #### 字符类中的否定 - "[^ ]"


    通过在方括号后添加插入脱字符符号 `^`，我们可以创建一个否定字符类。它匹配不在指定集合中的任意字符。


    -- 示例：查找包含辅音的单词


    ```lua

    local text = "The quick brown fox jumps over the lazy dog."

    local patternToFind = "[^aeiou ]"

    local startPos, endPos = string.find(text, patternToFind)


    while startPos do

    print("找到辅音，位置位于:", startPos, "-", endPos)

    startPos, endPos = string.find(text, patternToFind, endPos + 1)

    end

    ```


    #### 重复运算符 - "*", "+", "?", "{n}", "{n}"


    重复运算符允许我们匹配具有不同次数的字符或字符类。


    -- 示例：查找带有重复字母的单词


    ```lua

    local text = "The sun is shining brightly."

    local patternToFind = "%a+%a"

