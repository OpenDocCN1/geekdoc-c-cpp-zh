    \ Lua 脚本与读取表的 C 函数结合起来：\n\n```c\n#include <stdio.h>\n#include <lua.h>\n#include\
    \ <lualib.h>\n#include <lauxlib.h>\n\n// 读取 Lua 表的函数\nstatic int readTable(lua_State\
    \ *L) {\n    luaL_checktype(L, 1, LUA_TABLE);\n    lua_pushnil(L);\n    while\
    \ (lua_next(L, 1)) {\n        const char *key = lua_tostring(L, -2);\n       \
    \ if (lua_isstring(L, -1)) {\n            const char *value = lua_tostring(L,\
