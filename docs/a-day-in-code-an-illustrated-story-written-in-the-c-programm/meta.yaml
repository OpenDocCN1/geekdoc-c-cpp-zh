  md: "# We're playing a carnival game! If you knock down 1 or more bottles and less\
    \ than 3, you win a small unicorn. If you knock down 3 or more bottles and less\
    \ or equal to 5, you win a medium unicorn. If you knock down all 6 bottles, you\
    \ win a large unicorn. Otherwise, try again. We each knocked all 6 bottles, so\
    \ we each won a large unicorn!\n\n![](img/2f70ee4f42068609791dbc3da621833c_17_0.png)\n\
    \n//Carnival game program\n\n```\n#include <stdio.h>\n```\n\n```\nint main(void)\n\
    {\n    const int bottles_knocked_down = 6, unicorn_size = 0;\n    const int small\
    \ = 3, large = 1;\n    if (bottles_knocked_down >= 1 && bottles_knocked_down <\
    \ 3)\n{\n        unicorn_size = small;\n        printf(\"You won a small unicorn\
    \ (size %d)!\", unicorn_size);\n    } else if (bottles_knocked_down >= 3 && bottles_knocked_down\
    \ <= 5)\n{\n        unicorn_size = medium;\n        printf(\"You won a medium\
    \ unicorn (size %d)!\", unicorn_size);\n    } else if (bottles_knocked_down ==\
    \ 6)\n{\n        unicorn_size = large;\n        printf(\"You won a large unicorn\
    \ (size %d)!\", unicorn_size);\n    } else\n{\n        printf(\"Try again!\");\n\
    \    }\n    return 0;\n}\n```\n\n![](img/2f70ee4f42068609791dbc3da621833c_17_1.png)\n\
    \nconst is a type qualifier that declares a variable is a constant value:\nde\
    \ declares that small, medium, and large won't change and can't be modified in\
    \ the program.\n\nelse conditions are added to an if...else statement to add more\
    \ test conditions:\nThe symbol >= means greater than or equal to and the symbol\
    \ <= means less than or equal.\nIf bottles_knocked_down is greater than or equal\
    \ to 1 AND less than 3, unicorn_size = small.\nIf bottles_knocked_down is greater\
    \ than or equal to 3 AND less or equal to 5, unicorn_size = medium.\\If bottles_knocked_down\
    \ is equal to 6, unicorn_size = large. Otherwise, the else code block executes.\
    \ Since bottles_knocked_down has a value of 6, unicorn_size is assigned a large\
    \ value.\nThe printf() finds You won a large unicorn (size 1) on the screen."
