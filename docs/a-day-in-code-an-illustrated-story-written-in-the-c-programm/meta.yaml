  md: '# Run the programs!


    Now you can share the story with YOUR computer! You can run the programs on your
    computer using a C compiler, which converts your source code (the code you write)
    into machine code that the computer can execute. There are many free compilers
    available online. If you search for “free online C”, you will find compilers that
    run online without requiring a download. This is the link to a good online compiler
    called Online GDB:


    https://www.onlinegdb.com/online_c_compiler


    Type the code in the editor and click the green Run button at the top. You''ll
    see the output of the print() functions in the console at the bottom. If there''s
    an error in your code (such as a missing semicolon or curly brace), you''ll see
    an error message- correct the code and run it again! Change values in the programs
    (order 28 pizzas instead of 6) and see how the output changes.


    ![](img/2f70ee4f42068609791dbc3da621833c_35_0.png)


    # How can you use C programming?


    The C language is widely used in many areas including computer games, graphics,
    desktop applications, operating systems, databases, and embedded systems. C is
    the most popular language in embedded systems! An embedded system is a hardware
    and software design to perform one or more specific tasks within a larger system.
    A microcontroller is a common type of embedded system that is in devices and appliances
    all around you, like your phone, printer, microwave, washing machine, and remote
    control - just to name a few!


    A microcontroller has all the components of a computer contained in a single chip
    (integrated circuit or IC). Just like your computer reads input from the keyboard
    and outputs text to the screen, a microcontroller reads inputs (such as from a
    sensor or button) and controls outputs (such as turning on an LED or motor).


    ![](img/2f70ee4f42068609791dbc3da621833c_35_1.png)


    You can apply the syntax and concepts you learned in this book to programming
    controllers, so you can create your own devices. The Arduino® is a popular microcontroller
    development platform. The Arduino language is a set of C/C++ functions that you
    call from your code. For more information about the Arduino platform, please visit:
    https://www.arduino.cc


    Arduino® is a trademark of Arduino platform SA'
