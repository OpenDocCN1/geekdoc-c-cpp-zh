    \ minutes.\"。\n\n![](img/2f70ee4f42068609791dbc3da621833c_14_0.png)\n\n我们在海边！如果薯片包是打开的或者蛋糕盒是打开的，并且我们正在玩耍，海鸥就会吃东西。如果薯片包是打开的或者蛋糕盒是打开的，但我们没有玩耍，我们会留意海鸥。否则，如果薯片包是关闭的且蛋糕盒也是关闭的，海鸥就不会吃东西。由于蛋糕盒是打开的且我们正在玩耍，海鸥正在吃东西。\n\
    \n![](img/2f70ee4f42068609791dbc3da621833c_15_0.png)\n\n```c\n//Beach program\n\
    #include <stdio.h>\n\n#define OPEN 1\n#define CLOSED 0\n\nint main(void)\n{\n\
    \    int chip_bag = 0, cupcake_box = 1, kids_playing = 1;\n\n    if (chip_bag\
    \ == OPEN || cupcake_box == OPEN) //outer if statement\n    {\n        if (kids_playing)\
    \ //inner if statement\n        {\n            printf(\"Seagulls are eating.\"\
    );\n        }\n        else\n        {\n            printf(\"Watching for seagulls.\"\
    );\n        }\n    }\n    else\n    {\n        printf(\"Seagulls are not eating.\"\
    );\n    }\n\n    return 0;\n}\n```\n\n![](img/2f70ee4f42068609791dbc3da621833c_15_1.png)\n\
    \n符号 `||` 意味着逻辑或。\n因此，外部 `if` 表达式意味着如果 `chip_bag` 等于 `OPEN` 或者 `cupcake_box` 等于\
    \ `OPEN`。由于 `cupcake_box` 的值为 1（且 `OPEN` 意味着 1），外部 `if` 表达式为真，并执行内部的 `if...else`\
    \ 语句。\n\n外部 `if` 代码块内部的 `if...else` 语句被称为嵌套 `if...else` 语句：\n`if...else` 语句测试\
    \ `kids_playing` 是否为真。任何评估为非零值的表达式均为真。由于 `kids_playing` 的值为 1，`if` 条件为真，`printf()`\
    \ 函数在屏幕上打印 \"Seagulls are eating.\"。\n\n![](img/2f70ee4f42068609791dbc3da621833c_16_0.png)\n\
    \n# 我们在玩嘉年华游戏！如果你击倒了 1 个或更多瓶子，你就能赢。如果你击倒了 3 个或更多瓶子，你就能获得中奖。如果你击倒了全部 6 个瓶子，你就能获得大奖。否则，请重试。我们击倒了全部\
