  md: "# We're biking home to: 1 Maple Lane, Sunnyvale, Florida 32004.\n\n```\n//Biking\
    \ home program\n\n#include <stdio.h>\n#include <string.h>\n\nint main(void) {\n\
    \    struct Address {\n        int street_number;\n        char street[100];\n\
    \        char city[50];\n        char state[14];\n        int zip_code;\n    }\n\
    \n    struct Address home;\n    home.street_number = 1;\n    strcpy(home.street,\
    \ \"Maple Lane\");\n    strcpy(home.city, \"Sunnyvale\");\n    strcpy(home.state,\
    \ \"Florida\");\n    home.zip_code = 32004;\n\n    printf(\"Bike home to: %d,\
    \ %s, %s %d\\\\n\", home.street_number, home.street, home.city, home.state, home.zip_code);\n\
    \n    return 0;\n}\n```\n\nThe struct statement defines a structure, which is\
    \ a custom data type that groups variables together it allows you to create a\
    \ collection of related information. The structure definition in this program\
    \ contains int and char variables. char declares a variable with a character data\
    \ type, which can store a character as a letter. Address is the name that is given\
    \ to this particular structure type.\n\nA structure's data fields are called:\
    \ this structure contains members street_number, street, city, state, and zip_code.\
    \ Each char array is an array of characters that allows it to store words as strings.\
    \ Each array length (such as 100) is enough to have enough space for the word\
    \ length.\n\nhome is declared as an Address structure variable:\nt int members\
    \ of home are accessed and assigned values with the dot operator. The char members\
    \ of which cannot be assigned values in way with the dot operator. strcpy() is\
    \ the string function which is in the C standard library and requires the header\
    \ file string.h to be included. strcpy copies the string \"Maple Lane\" into the\
    \ street member of the home variable, \"Sunnyvale\" into the city of home, \"\
    Florida\" into the state of home.\n\n%s in printf() is the string format specifier:\n\
    printf() prints Bike home to: 1 Maple Lane, Sunnyvale, Florida 32004 on the screen."
