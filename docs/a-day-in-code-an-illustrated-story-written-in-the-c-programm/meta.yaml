    \   }\n\n    char end_day[10] = {'G', 'o', 'o', 'd', 'n', 'i', 'g', 'h', 't',\
    \ '\\0'};\n    printf(\"%s\", end_day);\n    return 0;\n}\n\nvoid epic_test(int\
    \ activities, int happy_value)\n{\n    if (activities > 5 && happy_value == 1)\n\
    \    {\n        epic_day = TRUE;\n    }\n}\n```\n\nA global variable is defined\
    \ outside of any function and can be used by any function in a program: epic_day\
    \ is a global variable that can be used by main() and epic_test(). A local variable\
    \ is defined inside a function and can only be used by that function. A function's\
    \ formal parameter is a local variable that can have a different name than the\
    \ function's argument whose value is copied and passed to it.\n\nExecuting the\
    \ epic_test() function: number_of_activities and very_happy are arguments in the\
    \ epic_test() function call. The epic_test() function has two parameters, activities\
    \ and happy_value. Since activities is 10 and happy_value is 1, the epic_day value\
    \ is set to TRUE. In main(), What an epic day! is printed.\n\nThe character array\
    \ end_day is initialized as the string Goodnight with each letter as an array\
    \ element: The array elements are initialized with comma-separated values. The\
    \ null character \\0 must be included to indicate the end of the string because\
    \ it's not automatically added. The string Goodnight is printed.\n\n![](img/2f70ee4f42068609791dbc3da621833c_34_0.png)\n\
    \n# Run the programs!\n\nNow you can share the story with YOUR computer! You can\
    \ run the programs on your computer using a C compiler, which converts your source\
    \ code (the code you write) into machine code that the computer can execute. There\
    \ are many free compilers available online. If you search for “free online C”,\
    \ you will find compilers that run online without requiring a download. This is\
    \ the link to a good online compiler called Online GDB:\n\nhttps://www.onlinegdb.com/online_c_compiler\n\
    \nType the code in the editor and click the green Run button at the top. You'll\
    \ see the output of the print() functions in the console at the bottom. If there's\
    \ an error in your code (such as a missing semicolon or curly brace), you'll see\
    \ an error message - correct the code and run it again! Change values in the programs\
    \ (order 28 pizzas instead of 6) and see how the output changes.\n\n![](img/2f70ee4f42068609791dbc3da621833c_35_0.png)\n\
    \n# How can you use C programming?\n\nThe C language is widely used in many areas\
    \ including computer games, graphics, desktop applications, operating systems,\
    \ databases, and embedded systems. C is the most popular language in embedded\
    \ systems! An embedded system is a hardware and software design to perform one\
    \ or more specific tasks within a larger system. A microcontroller is a common\
    \ type of embedded system that is in devices and appliances all around you, like\
    \ your phone, printer, microwave, washing machine, and remote control - just to\
    \ name a few!\n\nA microcontroller has all the components of a computer contained\
    \ in a single chip (integrated circuit or IC). Just like your computer reads input\
    \ from the keyboard and outputs text to the screen, a microcontroller reads inputs\
    \ (such as from a sensor or button) and controls outputs (such as turning on an\
    \ LED or motor).\n\n![](img/2f70ee4f42068609791dbc3da621833c_35_1.png)\n\nYou\
    \ can apply the syntax and concepts you learned in this book to programming controllers,\
    \ so you can create your own devices. The Arduino® is a popular microcontroller\
    \ development platform. The Arduino language is a set of C/C++ functions that\
    \ you call from your code. For more information about the Arduino platform, please\
    \ visit: https://www.arduino.cc\n\nArduino® is a trademark of Arduino platform\
    \ SA\n\nPrinted in Poland\nby Amazon Fulfillment\nPoland Sp. z o.o., Wrocław\n\
    \n65182325R00021\n\n# Think in Code\n\nThis is the story of a day packed with\
    \ fun activities like eating pizza and playing games. But this is no ordinary\
    \ story - it's written in the C programming language. Don't know C? This will\
    \ help you learn it. Also, there's English translations!\n\n![](img/2f70ee4f42068609791dbc3da621833c_39_0.png)\n\
    \nSUNDAE ELECTRONICS\n\n![](img/2f70ee4f42068609791dbc3da621833c_39_1.png)\n"
  mdcn: "\n\n![](img/2f70ee4f42068609791dbc3da621833c_32_0.png)\n\n# 我们参加了10项活动，我们非常开心。真是充不起的一天！晚安！\n\
    \n```c\n//Bedtime program\n\n#include <stdio.h>\n\n#define TRUE 1\n\nvoid epic_test(int\
    \ activities, int happy_value); //function prototype\n\nint epic_day = 0;\n\n\
    int main(void)\n{\n    int number_of_activities = 10, very_happy = 1;\n    epic_test(number_of_activities,\
    \ very_happy);\n    if (epic_day == TRUE)\n    {\n        printf(\"What an epic\
    \ day!\\n\");\n    }\n\n    char end_day[10] = {'G', 'o', 'o', 'd', 'n', 'i',\
    \ 'g', 'h', 't', '\\0'};\n    printf(\"%s\", end_day);\n    return 0;\n}\n\nvoid\
    \ epic_test(int activities, int happy_value)\n{\n    if (activities > 5 && happy_value\
    \ == 1)\n    {\n        epic_day = TRUE;\n    }\n}\n```\n\n全局变量定义在任何函数之外，可以被程序中的任何函数使用：`epic_day`\
    \ 是一个全局变量，可以被 `main()` 和 `epic_test()` 使用。局部变量定义在函数内部，只能由该函数使用。函数的形式参数是一个局部变量，它的名称可以与实参数不同，实参数的值会被复制并传递给形式参数。\n\
    \n执行 `epic_test()` 函数：`number_of_activities` 和 `very_happy` 是 `epic_test()` 函数调用中的参数。`epic_test()`\
    \ 函数有两个参数，`activities` 和 `happy_value`。由于 `activities` 的值为 10 且 `happy_value`\
    \ 的值为 1，因此 `epic_day` 的值被设置为 `TRUE`。在 `main()` 函数中，打印了 \"What an epic day!\"。\n\
    \n字符数组 `end_day` 被初始化为字符串 \"Goodnight\"，每个字母都是数组的一个元素：数组元素用用逗号分隔的值进行初始化。必须包含空字符\
    \ `\\0` 来指示字符串的结束，因为它不会自动添加。最后打印了字符串 \"Goodnight\"。\n\n![](img/2f70ee4f42068609791dbc3da621833c_34_0.png)\n\
    \n# 运行程序！\n\n现在你可以向你自己的电脑分享这个故事了！你可以使用 C 编译器在你的电脑上运行程序，编译器会将你的源代码（你编写的代码）转换为计算机可以执行的机器码。网上有很多免费的编译器可用。如果你搜索“free\
    \ online C”，你将找到不需要下载即可在网上运行的编译器。这是一个名为 Online GDB 的优秀在线编译器的链接：\n\nhttps://www.onlinegdb.com/online_c_compiler\n\
    \n在编辑器中输入代码并点击顶部的绿色 Run（运行）按钮。你将在底部控制台中看到 `print()` 函数的输出。如果你的代码中有错误（例如缺少分号或大括号），你将看到错误信息——修正代码并重新运行！更改程序中的值（例如订购28\
    \ 个披萨而不是 6 个），看看输出会有什么变化。\n\n![](img/2f70ee4f42068609791dbc3da621833c_35_0.png)\n\
    \n# 你如何使用 C 语言？\n\nC 语言广泛用于许多领域，包括电脑游戏、图形、桌面应用程序、操作系统、数据库和嵌入式系统。C 是嵌入式系统中最流行的语言！嵌入式系统是为了在较大的系统中执行一个或多个特定任务的硬件和软件设计。微控制器是一种常见的嵌入式系统，存在你周围的设备和电器中，例如手机、打印机、微波炉、洗衣机和遥控器——这只是其中的一角！\n\
    \n微控制器将计算机的所有组件包含在一个芯片（集成电路或 IC）中。就像你的电脑从键盘读取输入并向屏幕输出文本一样，微控制器读取输入（例如来自传感器或按钮）并控制输出（例如开启\
    \ LED 或电机）。\n\n![](img/2f70ee4f42068609791dbc3da621833c_35_1.png)\n\n你可以将从书中中学到的语法和概念应用于控制器的编程，这样你就可以创建自己的设备。Arduino®\
    \ 是一个流行的微控制器开发平台。Arduino 语言是一组你从代码中调用的 C/C++ 函数。欲需有关 Arduino 平台的更多信息，请访问：https://www.arduino.cc\n\
    \nArduino® 是 Arduino platform SA 的商标\n\n在波兰印刷\n由 Amazon Fulfillment\nPoland Sp.\
    \ z o.o., Wrocław\n\n65182325R00021\n\n# 用代码去思考\n\n这是一个关于充满有趣活动（如吃披萨和玩游戏）一天的故事。但这不是普通故事——它是用\
    \ C 编程语言编写的。不知道 C 语言吗？这将帮助你学习。此外，还有英文翻译！\n\n![](img/2f70ee4f42068609791dbc3da621833c_39_0.png)\n\
    \nSUNDAE ELECTRONICS\n\n![](img/2f70ee4f42068609791dbc3da621833c_39_1.png)\n\n"
