  md: "# We're bowling! The game has 10 frames and each player gets 2 chances per\
    \ frame to roll the ball down all the pins. There are 4 of us.\n\n![](img/2f70ee4f42068609791dbc3da621833c_27_0.png)\n\
    \n```\n//Bowling program\n```\n\n```\n#include <stdio.h>\n```\n\n```\nint main(void)\n\
    {\n    int player, roll_ball, frame;\n    for (frame = 1; frame < 11; frame++)\
    \ //outer loop\n    {\n        for (player = 1; player < 5; player++) //inner\
    \ loop\n        {\n            roll_ball = 2;\n            while (roll_ball >\
    \ 0)\n            {\n                //this means the same as roll_ball = roll_ball\
    \ - 1\n                roll_ball--;\n            }\n            printf(\"Player\
    \ %d is done with frame %d\\n\", player, frame);\n        }\n        printf(\"\
    All done with frame %d\\n\\n\", frame);\n    }\n    return 0;\n}\n```\n\n![](img/2f70ee4f42068609791dbc3da621833c_27_1.png)\n\
    \nThe inner loop is called a nested for loop:\nThe nested for loop is executed\
    \ during each of the ten iterations of the outer loop for frame = 1 through frame\
    \ = 10. The nested for loop has four iterations from player = 1 through player\
    \ = 4. printf() All done with frame 1 at the end of the first iteration of the\
    \ outer loop for loop. Two newlines \\nn create an empty line to space frame numbers.\
    \ At the end of the last iteration of the outer loop, printf() All done with frame\
    \ 10.\n\nThere is a while loop inside the nested for loop:\nA while loop repeats\
    \ its code block if the expression in parentheses is still true after each iteration\
    \ of the loop. In this program, the decrement operator -- decreases the value\
    \ of roll_ball by 1. Since roll_ball begins with a value of 2 and the while expression\
    \ is roll_ball > 0, the while loop repeats two times. printf() prints the player\
    \ number and frame number after the while loop ends.\n\n26"
