  md: "# We're in the backyard at night! Since it's not cloudy, we're stargazing for\
    \ ten minutes and then we'll go back into the house.\n\n```\n//Backyard night\
    \ program\n\n#include <stdio.h>\n\n#define CLOUD 0\n\nvoid stargaze(void); //function\
    \ declaration\n\nint main(void) {\n    int sky = 1;\n\n    if (sky != CLOUD) {\n\
    \        stargaze();\n    }\n\n    printf(\"Let's go back into the house now.\"\
    );\n    return 0;\n}\n\nvoid stargaze(void) {\n    int minutes = 1;\n    do {\n\
    \        minutes++;\n        printf(\"We've looked at the sky for %d minutes.\\\
    n\", minutes);\n    } while (minutes < 10);\n```\n\nThe stargaze() function does\
    \ not have any formal parameters and does not return a value: Therefore, the function's\
    \ return type is void and the formal parameter is void. The purpose of the stargaze()\
    \ function is to have a separate code block that performs a specific task, which\
    \ makes the code in main() cleaner and easier to follow. The != operator means\
    \ \"not equal to\". Since sky is not equal to CLOUD, the stargaze() function is\
    \ called.\n\nThe do-while loop in the stargaze() function is a little different\
    \ than a while loop: Unlike a while loop, a do-while loop executes once before\
    \ the while the while condition is tested. If the while condition is true, the\
    \ loop will execute and continue repeating until the while condition is false.\
    \ Since minutes began at 1 and the while expression minutes < 10, the loop executes\
    \ 9 times. The do-while loop prints We've looked at the sky for 10 minutes. at\
    \ the end of the last loop. The printf() function in main() then prints Let's\
    \ go back into the house."
