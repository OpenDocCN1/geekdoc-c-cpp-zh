  md: "# We did 10 activities we're very happy. What an epic day! Goodnight!\n\n```\n\
    //Bedtime program\n\n#include <stdio.h>\n\n#define TRUE 1\n\nvoid epic_test(int\
    \ activities, int happy_value); //function prototype\n\nint epic_day = 0;\n\n\
    int main(void)\n{\n    int number_of_activities = 10, very_happy = 1;\n    epic_test(number_of_activities,\
    \ very_happy);\n    if (epic_day == TRUE)\n    {\n        printf(\"What an epic\
    \ day!\\n\");\n    }\n\n    char end_day[10] = {'G', 'o', 'o', 'd', 'n', 'i',\
    \ 'g', 'h', 't', '\\0'};\n    printf(\"%s\", end_day);\n    return 0;\n}\n\nvoid\
    \ epic_test(int activities, int happy_value)\n{\n    if (activities > 5 && happy_value\
    \ == 1)\n    {\n        epic_day = TRUE;\n    }\n}\n```\n\nA global variable is\
    \ defined outside of any function and can be used by any function in a program:\
    \ epic_day is a global variable that can be used by main() and epic_test().. A\
    \ local variable is defined inside a function and can only be used by that function.\
    \ A function's formal parameter is a local variable that can have a different\
    \ name than the function's argument whose value is copied and passed to it.\n\n\
    Executing the epic_test() function: number_of_activities and very_happy are arguments\
    \ in the epic_test() function call. The epic_test() function has two parameters,\
    \ activities and happy_value. Since activities is 10 and happy_value is 1, the\
    \ epic_day value is set to TRUE. In main(),What an epic day! is printed.\n\nThe\
    \ character array end_day is initialized as the string Goodnight with each letter\
    \ as an array element: The array elements are initialized with comma-separated\
    \ values. The null character \\0 must be included to indicate the end of the string\
    \ because it's not automatically added. The string Goodnight is printed."
