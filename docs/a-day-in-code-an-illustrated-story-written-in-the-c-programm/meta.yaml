  - "[PAGE 31]\n\n# We chose a good movie to watch and made popcorn.\n\n```\n//Movie\
    \ night program\n#include <stdio.h>\nint main(void) {\n    char movie_name[100];\n\
    \    int minutes;\n\n    printf(\"What movie do you want to watch?\\\\n\");\n\
    \    /* Read a string input from the keyboard (stdin is standard input)\n    \
    \   Using the fgets() function that is in the C Standard Library */\n    fgets(movie_name,\
    \ 100, stdin);\n    printf(\"Ok, let's watch %s\", movie_name);\n\n    printf(\"\
    How many minutes does it take to make popcorn?\\\\n\");\n    scanf(\"%d\", &minutes);\n\
    \    printf(\"Let's start the movie in %d minutes.\\\\n\", minutes);\n\n    char\
    \ movie_message[] = \"Enjoy the show!\";\n    printf(\"%s\", movie_message);\n\
    \n    return 0;\n}\n```\n\nA multi-line comment allows you to write a comment\
    \ over as many lines as you want:\nIt is created with a forward slash /* and an\
    \ asterisk and forward slash *./\n\nfgets() reads a string input from the keyboard\
    \ through stdin, which means \"standard input\":nThe character array movie_name\
    \ is defined with 100 characters to hold enough space for a movie name that will\
    \ be read into. The maximum number of characters to be read and stored into movie_name\
    \ is specified as 100 in fgets(). After you type the movie name and press Enter\
    \ on the keyboard, the string is stored in movie_name with a newline \\n and a\
    \ null character \\0 (indicating the end of the string) automatically added to\
    \ the end of the string. The next printf() function prints the movie_name string\
    \ in a sentence.\n\nThe scanf() function reads an integer into minutes with the\
    \ %d format:\n you type the number of minutes and press Enter on the keyboard,\
    \ the integer is stored in minutes. The ampersand & is used in minutes because\
    \ the operator is required before a variable in scanf() that is not a string.\
    \ scanf() can only read and store a string if it contains no white spaces, which\
    \ is why fgets() is used to read the movie name. The next printf() prints the\
    \ minutes value read by the scanf() function.\n\nA array movie_message is declared\
    \ and initialized as a string in double quotes:\nThe null character \\0 is automatically\
    \ added to the end of the string to terminate it. The character array size does\
    \ not to be included in brackets [] because of the string initialization. The\
    \ string Enjoy the show! is printed by printf()."
- md: "\n![](img/2f70ee4f42068609791dbc3da621833c_32_0.png)\n\n# We did 10 activities\
