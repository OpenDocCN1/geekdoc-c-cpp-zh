    \ begins running.\n\nprintf() is a function in the C standard library that outputs\
    \ text to the computer screen. A library is a collection of functions and data\
    \ that can be used in your code. The C standard library is built into the C language.\n\
    \nstdio.h is a header file that contains information needed for the C standard\
    \ library's input and output functions to work. This header file is needed to\
    \ use the printf() function. It is included in the program with #include.\n\n\
    return 0 returns a value of 0 to the system running the program, which is typically\
    \ used as a signal that the program successfully finished. The int before main()\
    \ indicates the return value is an integer (a whole number that doesn't have a\
    \ decimal point). The void indicates that the main() function program above does\
