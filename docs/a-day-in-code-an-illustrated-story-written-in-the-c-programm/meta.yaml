  md: "# We're making 20 pancakes for breakfast. Each pancake takes 4 minutes to\n\
    cook, so they will be done in 80 minutes.\n\n```\n//Breakfast program\n#include\
    \ <stdio.h>\n\nint pancakes[20] = {0}; //array declaration\n\nint i, count = 0,\
    \ timer = 0;\n\n#define DONE 1\nint main(void)\n{\n    for(i = 0; i < 20; i++)\
    \ {\n        count++; //increase count by 1\n        timer = timer + 4;\n    \
    \    pancakes[i] = DONE;\n        printf(\"Pancake %d is done (value of %d)\\\
    n\", count, pancakes[i]);\n    }\n    printf(\"We made %d pancakes in %d minutes.\"\
    , count, timer);\n    return 0;\n}\n```\n\nAn array stores a collection of variables\
    \ (elements) of the same data type:\nThe pancakes array is declared to have 20\
    \ elements of the int type, which are all initialized to 0.\n\nIn the for loop\
    \ code block:\nThe increment operator ++ increases the count by 1. The timer variable's\
    \ value is increased by 4.\nThe variable i is used to access each element of the\
    \ pancakes array. The first element of an array always starts at an index of 0.\
    \ The first time through the for loop, i = 0,\nso pancakes[0] is assigned the\
    \ value of DONE, which is 1. The printf() function prints Pancake 1 is done\n\
    (value of 1). The \\n character in printf() is a newline character that ends the\
    \ line so that the next printf will\nstarting at the beginning of the next line.\n\
    \nThe for loop is executed 20 times:\nThe first loop starts at i = 0 and the last\
    \ loop executes when i = 19. There are 20 array elements of\npancakes[0] to pancakes[19].\
    \ The last time through the for loop, the timer value is increased to 80,\npancakes[19]\
    \ is assigned a value of DONE, and Pancake 20 is done (value of 1) is printed.\
    \ After the\nfor loop ends, the printf() function prints We made 20 pancakes in\
    \ 80 minutes on the screen."
