- md: "\n## A Day in Code\n\nAn illustrated story written in the C programming language\n\
    By Shari Eskenas\nIllustrated by Ana Quintero Villafraz\n\n## A Day in Code\n\n\
    An illustrated story written in the C programming language\n\nBy Shari Eskenas\n\
    Illustrated by Ana Quintero Villafraz\n\nCopyright © 2020 by Shari Eskenas\n\n\
    Cover art and interior art by Ana Quintero Villafraz\n\nAll rights reserved. No\
    \ part of this book may be reproduced or used in any manner without the prior\
    \ written permission of the copyright owner, except for the use of brief quotations\
    \ in a book review.\n\nPublished by Sundae Electronics LLC\nhttps://www.sundaelectronics.com\n\
    \nFirst edition 2020.\n\n- ISBN 978-1-7359079-0-1 (Hardcover)\n- ISBN 978-1-7359079-1-8\
    \ (Paperback)\n- ISBN 978-1-7359079-2-5 (eBook)\n\n# Logic is all around you.\n\
    \nNORFOLK COUNTY LIBRARY\nWITHDRAWN FOR SALE\n\nLook for it. - S.E.\n\nOnce upon\
    \ a time, there were two kids (a brother and sister) who loved computers. One\
    \ day they did so many fun activities and had such an epic day that they wanted\
    \ to share the story of that day with computers. They began by telling the story\
    \ to some laptop computers.\n\nBut the computers couldn't understand them! Computers\
    \ read and understand information in their own language- a computer programming\
    \ language!\n\nThe kids needed to write code to communicate with the computers.\
    \ Code is a set of instructions written for a computer to perform tasks. Similarly,\
    \ a recipe like the one below is a set of instructions to perform the task of\
    \ making a chocolate cake!\n\nA program is a collection of code that can be run\
    \ by a computer. Before the kids could write programs, they had to choose a programming\
    \ language to write them in. There were many to choose from!\n\nAs they were thinking\
    \ about what language to choose, they went to a bakery and bought donuts. When\
    \ they got home, they saw an oddly shaped donut in the box that looked like the\
    \ letter C.\n\nThis reminded the kids of the C language. They did some research\
    \ and learned that C is a widely used language that has influenced the code of\
    \ other popular programming languages. This led them to choose the C language\
    \ for their first programs.\n\nThe kids found that there are rules for writing\
    \ code, called the syntax. For example, in the C language they must put a semicolon\
    \ at the end of each statement (a complete program instruction). To remember this,\
    \ they drew semicolons all around the house.\n\n# The kids started off writing\
    \ their first program:\n\n```c\n//Before the day began\n#include <stdio.h>\nint\
    \ main(void)\n{\n    printf(\"We can't wait tomorrow!\");\n    return 0;\n}\n\
    ```\n\n# This is what they learned:\n\n- //Before the day began is a comment.\
    \ A comment is a note you write for people reading-it is ignored by the computer!\
    \ A comment on a single line is made with double slash in front of the words.\n\
    - main() is a function. A function is a block of code (within curly braces) that\
    \ contains instructions. Every program needs a main() function, where the program\
    \ begins.\n- printf() is a function in the standard library that outputs text\
    \ to the screen. A library is a collection of functions and data that can be used\
    \ in your code. The standard library is built into C.\n- stdio.h is a header file\
    \ that contains information needed for input and output functions to work. This\
    \ header file is needed to use printf() function with #include.\n- return 0 returns\
    \ a value of 0 to the system, which is typically used as a signal that the program\
    \ finished.\n- int before main() indicates the return value is an integer (a whole\
    \ number). void indicates that the main() function does not receive any data.\n\
    - When the program above is run (executed), the sentence \"We can't wait tomorrow!\"\
    \ is printed on the screen.\n\nAfter spending the C language, the kids were ready\
    \ to tell the story of their epic day. In this book, you'll see the programs that\
    \ were given to the computers. I hope you enjoy the story as much as they did!\n\
    \n# We were so excited for the day ahead, we couldn't sleep. At midnight, counted\
    \ 5 before drifting into deep slumber.\n\n```c\n//Fall asleep program\n#include\
    \ <stdio.h>\n\nint main(void) {\n    int unicorns = 0; //variable declaration\n\
    \n    //Count 5 unicorns with for loop\n    for (int count = 0; count < 5; count++)\
    \ {\n        unicorns = unicorns + 1;\n    }\n    printf(\"I counted %d unicorns\
    \ and fell asleep\");\n    return 0;\n}\n```\n\n- unicorns is called a variable.\
    \ It stores the number of unicorns: A variable stores a value in the computer's\
    \ memory and the programmer gives it a name. Before variables are used, they must\
    \ be declared with a type such as int for integer. Variables can be assigned a\
    \ starting value (initialized) when they are declared.\n- for loop repeats a block\
    \ of code (in curly braces {}) for a given number of times: in this program, the\
    \ loop repeats 5 times to count unicorns. In the loop's header, `for (int count\
    \ = 0; count < 5; count++)`, `count = 0` declares an integer and initializes it\
    \ to 0. Next, this process is followed:\n    - Step 1. The condition `count <\
    \ 5` is tested for true or false.\n    - Step 2. If the condition is true, the\
    \ for loop code is executed. If it's false, the code block is not executed and\
    \ the program continues by jumping to the line of code after the for loop.\n \
    \   - Step 3. After the code block executes, `count++` increases count by 1 with\
    \ the increment operator `++`.\nSteps 1 through 3 are repeated until the condition\
    \ `count < 5` is false (when `count = 5`). The program then proceeds to `printf()`.\n\
    \nThis is how unicorns becomes 5:\nThe statement in the code block `unicorns =\
    \ unicorns + 1` increases the value of unicorns by 1. Since unicorns was initialized\
    \ to 0 and the for loop repeats 5 times, `unicorns = 5` when the loop ends.\n\n\
    The printf function prints \"I counted 5 unicorns and fell asleep\" on the screen:\
    \ When `printf()` outputs to the screen, `%d` is replaced by the value of unicorns,\
    \ which is now 5. `%d` is called a format specifier for an int data type.\n\n\
    # If the time is 9 AM, the alarm will turn on and we'll wake up. If it's not 9\
    \ AM, we'll be sleeping and the alarm will be off. It's 9 AM, so the alarm turned\
    \ on. We're jumping out of bed!\n\n```c\n//Wake up program\n#include <stdio.h>\n\
    \n#define OFF 0\n#define ON 1\n#define AM 0\n#define PM 1\n\nint main(void) {\n\
    \    int clock_time = 9, time_of_day = 0, alarm;\n\n    if (clock_time == 9 &&\
    \ time_of_day == AM) {\n        alarm = ON;\n        printf(\"It's 9 AM, wake\
    \ up! Jump out of bed!\");\n    } else {\n        alarm = OFF;\n        printf(\"\
    Sweet dreams...\");\n    }\n\n    return 0;\n}\n```\n\nThe **if_else** statement\
    \ tests if a condition is true or false:\nIf the expression in parentheses is\
    \ true, the **if** code block is executed. If it's false, the **else** code block\
    \ is executed. In the **if** expression in this program, the double equal sign\
    \ `==` tests for \"equals to\" and `&&` means logical AND. The expression tests\
    \ if `clock_time` is equal to 9 AND `time_of_day` is equal to AM. Since the expression\
    \ is true, the **if** code block is executed and alarm is assigned the value of\
    \ ON. The `printf()` prints \"It's 9 AM, wake up! Jump out of bed!\" on the screen.\n"
  mdcn: "\n\n## 代码中的一天\n\n用 C 编程语言编写的图画故事\n作者：Shari Eskenas\n插图：Ana Quintero Villafraz\n\
    \n## 代码中的一天\n\n用 C 编程语言编写的图画故事\n\n作者：Shari Eskenas\n插图：Ana Quintero Villafraz\n\
    \n版权 © 2020 Shari Eskenas\n\n封面及内页插图：Ana Quintero Villafraz\n\n版权权利所有。未经版权所有者书面许可，不得以任何方式复制或使用本书的任何部分，书评中的简短引用除外。\n\
    \nSundae Electronics LLC 出版\nhttps://www.sundaelectronics.com\n\n2020 年第一版。\n\n\
    - ISBN 978-1-7359079-0-1 (精装版)\n- ISBN 978-1-7359079-1-8 (平装版)\n- ISBN 978-1-7359079-2-5\
    \ (电子书版)\n\n# 逻辑无处不在。\n\n诺诺福克县图书馆\n已下架待售\n\n寻找它吧。 - S.E.\n\n从前，有一对孩子（一兄一妹），他们非常喜欢电脑。一天，他们参加了许多有趣的活动，度过了如此精彩的一天，以至于他们想把这一天的故事分享给电脑。他们开始向几台笔记本电脑讲述这个故事。\n\
    \n但计算机并听不懂他们！计算机用它们自己的语言来读取和理解信息——一种计算机编程语言！\n\n孩子们需要编写代码来与计算机通信。代码是为计算机执行任务而编写的一组指令。同样，像下面这样的食谱也是执行制作巧克力蛋糕任务的一组指令！\n\
    \n程序是一组可以由计算机运行的代码集合。在孩子们编写程序之前，他们必须选择一种编程语言来编写它们。有很多语言可以选择！\n\n当他们正在考虑选择哪种语言时，他们去面点店买了甜甜圈。回到家里后，他们发现盒子里有一个形状奇特的甜甜圈，看起来非常像字母\
    \ C。\n\n这让孩子们想起了 C 语言。他们做了一些研究，并发现 C 语言是一种被广泛使用的语言，影响了其他流行编程语言的代码。这促使他们选择 C 语言编写他们的第一个程序。\n\
    \n孩子们发现编写代码是有规则的，被称为语法。例如，在 C 语言中，他们必须在每个语句（一个完整的程序指令）末尾加上一个分号。为了记住这一点，他们在家里到处都画了分号。\n\
    \n# 孩子们开始编写他们的第一个程序：\n\n```c\n//Before the day began\n#include <stdio.h>\nint\
    \ main(void)\n{\n    printf(\"We can't wait tomorrow!\");\n    return 0;\n}\n\
    ```\n\n# 这是他们学到的知识：\n\n- //Before the day began 是一个注释。注释是你写给阅读者的备注——计算机会忽略它！单行注释是在单词前面加两个双斜杠创建的。\n\
    - main() 是一个函数。函数是一个包含指令的代码块（位于大括号内）。每个程序都需要一个 main() 函数，程序从这里开始。\n- printf()\
    \ 是标准库中的一个函数，用于将文本输出到屏幕上。库（library）是是一组函数和数据的集合，可以在你的代码中使用。标准库是内置在 C 语言中的。\n-\
    \ stdio.h 是一个头文件，包含了输入输出函数运行所需的信息。使用 #include 使用 printf() 函数时需要这个头文件。\n- return\
    \ 0 向系统返回值 0，这通常用作程序已完成的信号。\n- int 在 main() 之前表示返回值是一个整数（整数数字）。void 表示 main()\
    \ 函数不接收任何数据。\n- 当运行（执行）上述程序时，屏幕上会打印出 \"We can't wait tomorrow!\" 这句话。\n\n在学习了\
    \ C 语言后，孩子们准备好讲述他们那精彩一天的故事了。在书中，你将看到提供给电脑的程序。我希望你像他们一样喜欢这个故事！\n\n# 我们对即将到来的一天感到非常兴奋，无法入睡。午夜，数了\
    \ 5 次后进入了深睡眠。\n\n```c\n//Fall asleep program\n#include <stdio.h>\n\nint main(void)\
    \ {\n    int unicorns = 0; //variable declaration\n\n    //Count 5 unicorns with\
    \ for loop\n    for (int count = 0; count < 5; count++) {\n        unicorns =\
    \ unicorns + 1;\n    }\n    printf(\"I counted %d unicorns and fell asleep\");\n\
    \    return 0;\n}\n```\n\n- unicorns 被称为变量（variable）。它存储独角兽的数量：变量在计算机内存中存储一个值，程序员给它起一个名字。在使用变量之前，必须用类型（如整数的\
    \ int）对其进行声明。在声明变量时可以为它们分配初始值（初始化）。\n- for 循环（for loop）按指定的次数重复执行代码块（在大括号 {} 内）：在这个程序中，循环重复\
    \ 5 次来计算独角兽。在循环的头部，`for (int count = 0; count < 5; count++)` 中，`count = 0` 声明了一个整数并将其初始化为\
    \ 0。接着遵循此过程：\n    - 步骤 1。测试条件 `count < 5` 是真还是假。\n    - 步骤 2。如果条件为真，执行 for 循环代码。如果为假，则不执行代码块，程序通过跳转到\
    \ for 循环之后的代码行继续执行。\n    - 步骤 3。代码块执行后，使用增增运算符 `++` 将 count 加1。\n重复步骤 1 到 3，直到条件\
    \ `count < 5` 为假（当 `count = 5` 时）。程序接着执行 `printf()`。\n\n这就是独角兽变成 5 的方式：\n代码块中的语句\
    \ `unicorns = unicorns + 1` 将 unicorns 的值加 1。由于 unicorns 初始化为 0 且 for 循环重复了 5\
    \ 次，当循环结束时，`unicorns = 5`。\n\nprintf 函数在屏幕上打印 \"I counted 5 unicorns and fell\
    \ asleep\"：当 `printf()` 输出到屏幕时，`%d` 被 unicorns 的值替换，现在是 5。`%d` 被称为 int 数据类型的格式说明符。\n\
    \n# 如果时间是早上 9 点，闹钟就会开启，我们就会醒来。如果不是早上 9 点，我们就会睡觉，闹钟会关闭。现在是早上 9 点，闹钟响了。\n\n```c\n\
    //Wake up program\n#include <stdio.h>\n\n#define OFF 0\n#define ON 1\n#define\
    \ AM 0\n#define PM 1\n\nint main(void) {\n    int clock_time = 9, time_of_day\
    \ = 0, alarm;\n\n    if (clock_time == 9 && time_of_day == AM) {\n        alarm\
    \ = ON;\n        printf(\"It's 9 AM, wake up! Jump out of bed!\");\n    } else\
    \ {\n        alarm = OFF;\n        printf(\"Sweet dreams...\");\n    }\n\n   \
    \ return 0;\n}\n```\n\n**if_else** 语句测试条件是真还是假：\n如果括号中的表达式为真，则执行 **if** 代码块。如果为假，则执行\
    \ **else** 代码块。在此程序的 **if** 表达式中，双等号 `==` 测试“等于”，`&&` 表示逻辑“与”。该表达式测试 `clock_time`\
    \ 是否等于 9 且 `time_of_day` 是否等于 AM。由于表达式为真，执行了 **if** 代码块，并给 alarm 赋值为 ON。`printf()`\
    \ 在屏幕上打印 \"It's 9 AM, wake up! Jump out of bed!\"。\n\n"
