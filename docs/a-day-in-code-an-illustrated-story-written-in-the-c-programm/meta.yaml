    );\n    }\n    return 0;\n}\n```\n\n![](img/2f70ee4f42068609791dbc3da621833c_17_1.png)\n\
    \n`const` 是一个类型限定符，声明变量为常量：`small`、`medium` 和 `large` 无法被修改。\n\n`else` 条件被添加到\
    \ `if...else` 语句中以增加更多条件：\n符号 `>=` 意味着大于等于，`<=` 意味着小于等于。\n如果 `bottles_knocked_down`\
    \ 大于等于 1 且小于 3，`unicorn_size` 为 `small`。如果 `bottles_knocked_down` 大于等于 3 且小于 5，`unicorn_size`\
    \ 为 `medium`。\n如果 `bottles_knocked_down` 等于 6，`unicorn_size` 为 `large`。否则执行 `else`\
    \ 块。由于 `bottles_knocked_down` 的值为 6，`unicorn_size` 被赋值为 `large` 值。`printf()` 在屏幕上找到\
    \ \"You won a large unicorn (1)\"。\n\n![](img/2f70ee4f42068609791dbc3da621833c_18_0.png)\n\
    \n# 我们正在骑车前往：Maple Lane, Sunnyvale 32004。\n\n```c\n//Biking program\n#include\
    \ <stdio.h>\n#include <string.h>\n\nstruct Address {\n    int street_number;\n\
    \    char street[100];\n    char city[50];\n    char state[14];\n    int zip_code;\n\
    };\n\nint main(void) {\n    struct Address home;\n    home.street_number = 1;\n\
    \    strcpy(home.street, \"Maple Lane\");\n    strcpy(home.city, \"Sunnyvale\"\
    );\n    strcpy(home.state, \"Florida\");\n    home.zip_code = 32004;\n\n    printf(\"\
    Bike home to: %d, %s, %s %d\\n\", home.street_number, home.street, home.state,\
    \ home.zip_code);\n\n    return 0;\n}\n```\n\n`struct` 语句定义了一个结构体，这是一种将变量组合在一起的自定义类型，允许你创建一个相关信息的集合。程序中的结构定义包含了\
    \ `int` 和 `char` 变量。`char` 声明了一个字符类型的变量，可以存储字母。`Address` 是赋予这种特定结构类型的名称。\n\n结构的数据字段被称为：`street_number`、`street`、`city`、`state`\
    \ 和 `zip_code`。每个 `char` 数组都是字符数组，允许存储字符串。每个数组的长度（例如 100）足够存放单词。\n\n`home` 被声明为\
    \ `Address` 结构体变量：`home` 的 `int` 成员可以通过点运算符访问并赋值。`char` 成员无法通过点运算符赋值。`strcpy()`\
    \ 是 C 标准库中的字符串函数，需要包含头文件 `string.h`。`strcpy()` 将 \"Maple Lane\" 复制到变量 `home` 的\
