  md: "# We're at the arcade! If the game choice is 1, we'll play the racing game.\
    \ If the game choice is 2, we'll play air hockey. If the game choice is 3, we'll\
    \ play skeeball. If the game choice is 4, we'll play pinball. For all other game\
    \ choice values, we'll play any other arcade game. Our game choice is 2, so we're\
    \ playing air hockey.\n\n![](img/2f70ee4f42068609791dbc3da621833c_25_0.png)\n\n\
    ```\n//Arcade program\n#include <stdio.h>\n\nint main(void) {\n    int game_choice\
    \ = 2;\n    switch(game_choice) {\n        case 1:\n            printf(\"Racing\
    \ game\");\n            break;\n        case 2:\n            printf(\"Air hockey\"\
    );\n            break;\n        case 3:\n            printf(\"Skeeball\");\n \
    \           break;\n        case 4:\n            printf(\"Pinball\");\n      \
    \      break;\n        default:\n            printf(\"Any other arcade game\"\
    );\n    }\n    return 0;\n}\n```\n\n![](img/2f70ee4f42068609791dbc3da621833c_25_1.png)\n\
    \nA switch statement tests if a given value matches a value in a list.\nThe switch\
    \ statement is an alternative to using if...else statement to test for an integer\
    \ value or as a character is equal to a value in a list. If a matched value is\
    \ found, one or more statements associated with the matched value are executed.\n\
    \nThe value in parentheses after switch is tested for a list of case values:\n\
    If game_choice has a value of 1, the statements case 1 are executed and Racing\
    \ game is printed.\n game_choice has a value of 2, Air hockey is printed. If game_choice\
    \ has a value of 3, Skeeball is printed. If game_choice has a value of 4, Pinball\
    \ is printed. Otherwise, the default case is executed and Any other arcade game\
    \ is printed. A break statement is reached, the switch statement is exited. Since\
    \ game_choice has a value of 2, Air hockey is printed and break exits the switch\
    \ statement."
