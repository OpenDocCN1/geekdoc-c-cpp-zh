  md: "# We were so excited for the day ahead, we couldn't sleep. At midnight, each\
    \ counted 5 unicorns before finally drifting into a deep slumber.\n\n```\n//Fall\
    \ asleep program\n#include <stdio.h>\n\nint main(void) {\n    int unicorns = 0;\
    \ //variable declaration\n\n    //Count 5 unicorns with a for loop\n    for (int\
    \ count = 0; count < 5; count++) {\n        unicorns = unicorns + 1;\n    }\n\
    \    printf(\"I counted %d unicorns and fell asleep, unicorns\");\n    return\
    \ 0;\n}\n```\n\nunicorns is called a variable. It stores the number of unicorns\
    \ counted:\nA variable stores a value in the computer's memory and the programmer\
    \ gives it a name. Before variables are used, they must be declared with a data\
    \ type such as int for storing integer. Variables can be assigned a starting value\
    \ (initialized) when they are declared.\n\nfor loop repeats a block of code (in\
    \ curly braces {}) for a given number of times:\nin this program, the loop repeats\
    \ 5 times to count 5 unicorns. In the loop's header, for (int count = 0; count\
    \ < 5; count++), int count = 0 declares an integer and initializes it to 0. Next,\
    \ this process is followed:\n\n+   Step 1. The condition count < 5 is tested for\
    \ true or false.\nStep 2. If the condition is true, the for loop code is executed.\
    \ If it's false, the code block is not executed and the program continues by jumping\
    \ to the line of code after the for loop.\nStep 3. After the code block executes,\
    \ count++ increases count by 1 with the increment operator ++.\n\nSteps 1 through\
    \ 3 are repeated until the condition count < 5 is false (when count = 5). The\
    \ program then proceeds to the printf().\n\nThis is how unicorns becomes 5:\n\
    The statement in the code block unicorns = unicorns + 1 increases the value of\
    \ unicorns by 1. Since unicorns was initialized to 0 and the for loop repeats\
    \ 5 times, unicorns = 5 when the loop ends.\n\nThe printf function prints I counted\
    \ 5 unicorns and fell asleep on the screen:\nWhen printf() outputs to the screen,\
    \ %d is replaced by the value of unicorns, which is now 5. %d is called a format\
    \ specifier for an int data type."
