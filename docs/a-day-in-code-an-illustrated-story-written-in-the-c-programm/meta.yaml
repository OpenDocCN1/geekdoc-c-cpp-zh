  md: 'Once upon a time, there were two kids (a brother and sister) who loved computers.
    One day they did so many fun activities and had such an epic day that they wanted
    to share the story of that day with computers. They began by telling the story
    to some laptop computers.


    ![](img/2f70ee4f42068609791dbc3da621833c_6_0.png)


    But the computers couldn''t understand them! Computers read and understand information
    in their own language- a computer programming language!


    The kids needed to write code to communicate with the computers. Code is a set
    of instructions written for a computer to perform tasks. Similarly, a recipe like
    the one below is a set of instructions to perform the task of making a chocolate
    cake!


    ![](img/2f70ee4f42068609791dbc3da621833c_6_1.png)'
  merge: -1
  pgno: 6
- img_proc: true
  md: 'A program is a collection of code that can be run by a computer. Before the
    kids could write programs, they had to choose a programming language to write
    them in. There were many to choose from!


    As they were thinking about what language to choose, they went to a bakery and
    bought donuts. When they got home, they saw an oddly shaped donut in the box that
    looked like the letter C.


    ![](img/2f70ee4f42068609791dbc3da621833c_7_0.png)


    This reminded the kids of the C language. They did some research and learned that
    C is a widely used language that has influenced the code of other popular programming
    languages. This led them to choose the C language for their first programs.


    The kids found that there are rules for writing code, called the syntax. For example,
    in the C language they must put a semicolon at the end of each statement (a complete
    program instruction). To remember this, they drew semicolons all around the house.


    ![](img/2f70ee4f42068609791dbc3da621833c_7_1.png)'
  merge: -1
  pgno: 7
- img_proc: true
  md: "# The kids started off writing their first program:\n\n```\n//Before the day\
    \ began\n#include <stdio.h>\nint main(void)\n{\n    printf(\"We can't wait for\
    \ tomorrow!\");\n    return 0;\n}\n```\n\n![](img/2f70ee4f42068609791dbc3da621833c_8_0.png)\n\
    \n# This is what they learned:\n\n//Before the day began is a comment. A comment\
    \ is a note you write for a person reading the program- it's ignored by the computer!\
    \ A comment on a single line is made with a double slash // in front of the words.\n\
    \nmain() is a function. A function is a block of code (within curly braces) that\
