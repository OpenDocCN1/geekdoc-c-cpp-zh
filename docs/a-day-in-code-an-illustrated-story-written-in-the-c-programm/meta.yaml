  md: "# If the time is 9 AM, the alarm will turn on and we'll wake up. If it's not\
    \ 9 AM, we'll be sleeping and the alarm will be off. It's 9 AM, so the alarm turned\
    \ on. We're jumping out of bed!\n\n```\n//Wake up program\n#include <stdio.h>\n\
    \n#define OFF 0\n#define ON 1\n#define AM 0\n#define PM 1\n\nint main(void) {\n\
    \    int clock_time = 9, time_of_day = 0, alarm;\n\n    if (clock_time == 9 &&\
    \ time_of_day == AM) {\n        alarm = ON;\n        printf(\"It's 9 AM, wake\
    \ up! Jump out of bed!\");\n    } else {\n        alarm = OFF;\n        printf(\"\
    Sweet dreams...\");\n    }\n\n    return 0;\n}\n```\n\nThe **if_else** statement\
    \ tests if a condition is true or false:\nIf the expression in parentheses is\
    \ true, the **if** code block is executed. If it's false, the **else** code block\
    \ is executed. In the **if** expression in this program, the double equal sign\
    \ == tests for \"equals to\" and && means logical AND. The expression tests if\
    \ `clock_time` is equal to 9 AND `time_of_day` is equal to AM. Since the expression\
    \ is true, the **if** code block is executed and alarm is assigned the value of\
    \ ON. The `printf()` prints \"It's 9 AM, wake up! Jump out of bed!\" on the screen.\n\
    \nThe **#define** allows a constant value to be represented by a name:\nOFF is\
    \ defined as 0, ON is defined as 1, AM is defined as 0, and PM is defined as 1.\
    \ There is no semicolon at the end of a #define statement. By defining a constant\
    \ value with a meaningful name, it is easier to read and you can change the constant's\
    \ value in a single place. The name in #define is called a **macro**. It's common\
    \ to use uppercase for macros to easily distinguish them from variables. The variable\
    \ `time_of_day` was initialized to 0, and AM means 0, so `time_of_day == AM` is\
    \ true.\n\nVariables of the same type can be declared on the same line:\n`clock_time`,\
    \ `time_of_day`, and alarm are all declared with the **int** data type. The variable\
    \ `clock_time` is initialized to 9, `time_of_day` is initialized to 0, and alarm\
    \ is not initialized."
