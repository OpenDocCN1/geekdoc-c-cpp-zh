  md: "# We're having a pizza party! We ate 4 pizzas, so there are 2 extra pizzas.\n\
    \n```\n//Pizza party program\n#include <stdio.h>\n\nint party(int pizzas_eaten);\
    \ //function prototype\n\\int main(void) {\n    int extra_pizza = party(4); //Call\
    \ the party function\n    if (extra_pizza > 1) {\n        printf(\"There are %d\
    \ extra pizzas\",extra_pizza);\n    } else if (extra_pizza == 1) {\n        printf(\"\
    There is one extra pizza\");\n    }\n    return 0;\n}\nint party(int pizzas_eaten)\
    \ {\n    int pizzas_total = 6;\n    int pizzas_left = pizzas_total - pizzas_eaten;\n\
    \    return pizzas_left;\n}\n```\n\nA user-defined function allows you to organize\
    \ your code in a block to perform a specific task: It also allows you to easily\
    \ re-use a block of code. In this program, party() is a user-defined function\
    \ that calculates how many pizzas are left given the number of pizzas eaten. In\
    \ the party() function, pizzas_eaten is subtracted from pizzas_total and the result\
    \ is stored in pizzas_left. The party() function returns the value of pizzas_left\
    \ to the main() function and the value is stored in extra_pizza. When extra_pizza\
    \ = 2, the printf() prints There are 2 extra pizzas.\n\nWhen a function is called\
    \ in main() with a function call, the program transfers control to the function:\
    \ The party() function call pass one or more values to a function, which are called\
    \ the call's arguments. The party() function can has an argument of 4. A function\
    \ receives the call's arguments through variables called formal parameters. party()\
    \ has the formal parameter pizzas_eaten with an int data type that receives the\
    \ argument of 4. Once the function is called, its code block is executed. A function\
    \ can output a return value to main(). The party() function returns pizzas_left\
    \ to main(). The int before party indicates that the return value is an integer.\
    \ Once the function ends, control is returned to main() and the program proceeds.\n\
    \nA function needs to be defined or declared before it is called:\nA function\
    \ prototype is a function declaration that allows you to call a function defined\
    \ after main()."
