  md: "# We're ordering pizza! If we're very hungry, we'll order 6 cheese pizzas.\
    \ Otherwise, we'll order one cheese pizza. Since we're very hungry, we're ordering\
    \ 6 cheese pizzas. Each pizza is $9.99, so the cost of 6 pizzas is 6 x $9.99 =\
    \ $59.94. The total cost including the delivery cost is $59.94 + $2.99 = $62.93.\n\
    \n![](img/2f70ee4f42068609791dbc3da621833c_21_0.png)\n\n```\n#include <stdio.h>\n\
    \n#define PIZZA_COST 9.99\n#define DELIVERY_COST 2.99\n\nint main(void) {\n  \
    \  int very_hungry = 1, pizza_quantity = 6;\n    float total_cost;\n\n    if (very_hungry)\
    \ {\n        printf(\"We're ordering %d cheese pizzas.\\\\n\", pizza_quantity);\n\
    \        total_cost = PIZZA_COST * pizza_quantity;\n    } else {\n        printf(\"\
    We're ordering one cheese pizza.\\\\n\\n        total_cost = PIZZA_COST;\n   \
    \ }\n    //This means the same as total_cost = total_cost + DELIVERY_COST;\n \
    \   total_cost += DELIVERY_COST;\n\n    printf(\"The total cost is %.2f\", total_cost);\n\
    \    return 0;\n}\n```\n\n![](img/2f70ee4f42068609791dbc3da621833c_21_1.png)\n\
    \nThe variable total_cost is declared with a float data type: This allows total_cost\
    \ to store a floating-point number (a number that has a decimal point).\n\nSince\
    \ very_hungry equals 1, the if condition is true: printf() prints We're ordering\
    \ 6 cheese pizzas. on the screen. The total_cost is set to PIZZA_COST multiplied\
    \ by the pizza_quantity value of 6.\n\nDELIVERY_COST is added to total_cost using\
    \ the += addition assignment operator. %f is the format specifier for floating-point\
    \ number. It is written as %.2f because the .2 in front of f specifies the number\
    \ will be printed to two decimal places. printf() prints The total cost is $62.93."
