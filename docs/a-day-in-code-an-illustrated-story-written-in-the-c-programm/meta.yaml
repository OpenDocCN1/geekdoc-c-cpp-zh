    \ `clock_time` is equal to 9 AND `time_of_day` is equal to AM. Since the expression\
    \ is true, the **if** code block is executed and alarm is assigned the value of\
    \ ON. The `printf()` prints \"It's 9 AM, wake up! Jump out of bed!\" on the screen.\n\
    \nThe **#define** allows a constant value to be represented by a name:\nOFF is\
    \ defined as 0, ON is defined as 1, AM is defined as 0, and PM is defined as 1.\
    \ There is no semicolon at the end of a #define statement. By defining a constant\
    \ value with a meaningful name, it is easier to read and you can change the constant's\
    \ value in a single place. The name in #define is called a **macro**. It's common\
    \ to use uppercase for macros to easily distinguish them from variables. The variable\
    \ `time_of_day` was initialized to 0, and AM means 0, so `time_of_day == AM` is\
    \ true.\n\nVariables of the same type can be declared on the same line:\n`clock_time`,\
    \ `time_of_day`, and alarm are all declared with the **int** data type. The variable\
    \ `clock_time` is initialized to 9, `time_of_day` is initialized to 0, and alarm\
    \ is not initialized."
- md: "\n![](img/2f70ee4f42068609791dbc3da621833c_12_0.png)\n\n# We're making 20 pancakes\
    \ for breakfast. Each pancake takes 4 minutes to\ncook, so they will be done in\
    \ 80 minutes.\n\n```c\n//Breakfast program\n#include <stdio.h>\n\nint pancakes[20]\
    \ = {0}; //array declaration\n\nint i, count = 0, timer = 0;\n\n#define DONE 1\n\
    int main(void)\n{\n    for(i = 0; i < 20; i++) {\n        count++; //increase\
    \ count by 1\n        timer = timer + 4;\n        pancakes[i] = DONE;\n      \
    \  printf(\"Pancake %d is done (value of %d)\\n\", count, pancakes[i]);\n    }\n\
    \    printf(\"We made %d pancakes in %d minutes.\", count, timer);\n    return\
    \ 0;\n}\n```\n\nAn array stores a collection of variables (elements) of the same\
    \ data type:\nThe pancakes array is declared to have 20 elements of the int type,\
    \ which are all initialized to 0.\n\nIn the for loop code block:\nThe increment\
    \ operator ++ increases the count by 1. The timer variable's value is increased\
    \ by 4.\nThe variable i is used to access each element of the pancakes array.\
    \ The first element of an array always starts at an index of 0. The first time\
    \ through the for loop, i = 0,\nso pancakes[0] is assigned the value of DONE,\
    \ which is 1. The printf() function prints Pancake 1 is done\n(value of 1). The\
    \ \\n character in printf() is a newline character that ends the line so that\
    \ the next printf will\nstarting at the beginning of the next line.\n\nThe for\
    \ loop is executed 20 times:\nThe first loop starts at i = 0 and the last loop\
    \ executes when i = 19. There are 20 array elements of\npancakes[0] to pancakes[19].\
    \ The last time through the for loop, the timer value is increased to 80,\npancakes[19]\
    \ is assigned a value of DONE, and Pancake 20 is done (value of 1) is printed.\
    \ After the\nfor loop ends, the printf() function prints We made 20 pancakes in\
    \ 80 minutes on the screen.\n\n![](img/2f70ee4f42068609791dbc3da621833c_14_0.png)\n\
    \nWe're at the beach! If the bag of chips is open or the box of cupcakes is\n\
    open, and if we're playing, seagulls will be eating. If the bag of chips is open\n\
    or the box of cupcakes is open, and we're not playing, we'll watch out for\nseagulls.\
    \ Otherwise, if the bags of chips is closed and the box of cupcakes is\nclosed,\
    \ seagulls will not be eating. Since the cupcake box is open and we're\nplaying,\
    \ seagulls are eating.\n\n![](img/2f70ee4f42068609791dbc3da621833c_15_0.png)\n\
    \n```c\n//Beach program\n#include <stdio.h>\n\n#define OPEN 1\n#define CLOSED\
    \ 0\n\nint main(void)\n{\n    int chip_bag = 0, cupcake_box = 1, kids_playing\
    \ = 1;\n\n    if (chip_bag == OPEN || cupcake_box == OPEN) //outer if statement\n\
    \    {\n        if (kids_playing) //inner if statement\n        {\n          \
    \  printf(\"Seagulls are eating.\");\n        }\n        else\n        {\n   \
    \         printf(\"Watching for seagulls.\");\n        }\n    }\n    else\n  \
    \  {\n        printf(\"Seagulls are not eating.\");\n    }\n\n    return 0;\n\
    }\n```\n\n![](img/2f70ee4f42068609791dbc3da621833c_15_1.png)\n\nThe symbol ||\
    \ means logical OR.\nTherefore, the outer if expression means if chip_bag is equal\
    \ to OPEN OR cupcake_box is equal to\nOPEN. Since cupcake_box has a value of 1\
    \ (and OPEN means 1), the outer if expression is true and the inner\nif...else\
    \ statement is executed.\n\nThe inner if...else statement within the outer if\
    \ code block is called a nested if...else statement:\nThe if...else statement\
    \ tests if kids_playing is true. Any expression that evaluates to a non-zerovalue\
    \ is true. Since kids_playing has a value of 1, the if condition is true and the\
    \ printf() function\n\"Seagulls are eating.\" on the screen.\n\n![](img/2f70ee4f42068609791dbc3da621833c_16_0.png)\n\
    \n# We're playing a carnival game! If you knock down 1 or more bottles and less\
    \ than 3, you win a small unicorn. If you knock down 3 or more bottles and less\
    \ or equal to 5, you win a medium unicorn. If you knock down all 6 bottles, you\
    \ win a large unicorn. Otherwise, try again. We each knocked all 6 bottles, so\
    \ we each won a large unicorn!\n\n![](img/2f70ee4f42068609791dbc3da621833c_17_0.png)\n\
    \n//Carnival game program\n```c\n#include <stdio.h>\n\nint main(void)\n{\n   \
    \ const int bottles_knocked_down = 6, unicorn_size = 0;\n    const int small =\
    \ 3, large = 1;\n    if (bottles_knocked_down >= 1 && bottles_knocked_down < 3)\n\
    \    {\n        unicorn_size = small;\n        printf(\"You won a small unicorn\
    \ (size %d)!\", unicorn_size);\n    } else if (bottles_knocked_down >= 3 && bottles_knocked_down\
    \ <= 5)\n    {\n        unicorn_size = medium;\n        printf(\"You won a medium\
    \ unicorn (size %d)!\", unicorn_size);\n    } else if (bottles_knocked_down ==\
    \ 6)\n    {\n        unicorn_size = large;\n        printf(\"You won a large unicorn\
    \ (size %d)!\", unicorn_size);\n    } else\n    {\n        printf(\"Try again!\"\
    );\n    }\n    return 0;\n}\n```\n\n![](img/2f70ee4f42068609791dbc3da621833c_17_1.png)\n\
    \n`const` is a type qualifier that declares a variable is a constant value: small,\
    \ medium, and large won't change and cannot be modified in the program.\n\n`else`\
    \ conditions are added to if...else statement to add more conditions:\nThe symbol\
    \ `>=` means greater than or equal to and the symbol `<=` means less than or equal.\n\
    If `bottles_knocked_down` is greater than equal to 1 and less than 3, `unicorn_size`\
    \ = small.\nIf `bottles_knocked_down` is greater than equal to 3 and less equal\
    \ to 5, `unicorn_size` = medium.\nIf `bottles_knocked_down` is equal to 6, `unicorn_size`\
    \ = large. Otherwise, the else block executes. Since `bottles_knocked_down` has\
    \ a value of 6, `unicorn_size` is assigned a large value.\nThe `printf()` finds\
    \ \"You won a large unicorn (size 1)\" on the screen.\n\n![](img/2f70ee4f42068609791dbc3da621833c_18_0.png)\n\
    \n# We're biking home to: 1 Maple Lane, Sunnyvale 32004.\n\n```c\n//Biking program\n\
    #include <stdio.h>\n#include <string.h>\n\nstruct Address {\n    int street_number;\n\
    \    char street[100];\n    char city[50];\n    char state[14];\n    int zip_code;\n\
    };\n\nint main(void) {\n    struct Address home;\n    home.street_number = 1;\n\
    \    strcpy(home.street, \"Maple Lane\");\n    strcpy(home.city, \"Sunnyvale\"\
    );\n    strcpy(home.state, \"Florida\");\n    home.zip_code = 32004;\n\n    printf(\"\
    Bike home to: %d, %s, %s %d\\n\", home.street_number, home.street, home.state,\
    \ home.zip_code);\n\n    return 0;\n}\n```\n\nThe `struct` statement defines a\
    \ structure, which is a custom data type that groups variables together and allows\
    \ you to create a collection of related information. The structure definition\
    \ in this program contains int and char variables. `char` declares a variable\
    \ with a character data type, which can store a character as a letter. `Address`\
    \ is the name given to this particular structure type.\n\nA structure's data fields\
    \ are called: this structure contains `street_number`, `street`, `city`, `state`,\
    \ and `zip_code`. Each `char` array is an array of characters that allows it to\
    \ store strings. Each array length (such as 100) is enough space for the word.\n\
    \n`home` is declared as an `Address` structure variable: int members of `home`\
    \ are accessed and assigned values with the dot operator. The char members cannot\
    \ be assigned values with the dot operator. `strcpy()` is the string function\
    \ which is in the C standard library and requires the header file `string.h` to\
    \ be included. `strcpy()` copies the string \"Maple Lane\" into the `street` member\
    \ of the `home` variable, \"Sunnyvale\" into the `city` of `home`, \"Florida\"\
    \ into the `state` of `home`.\n\n`%s` in `printf()` is the string format specifier:\n\
    `printf()` prints Bike home to: 1 Maple Lane, Sunnyvale, Florida 32004 on the\
    \ screen.\n\n![](img/2f70ee4f42068609791dbc3da621833c_20_0.png)\n\n# We're ordering\
    \ pizza! If we're very hungry, we'll order 6 cheese pizzas. Otherwise, we'll order\
    \ one cheese pizza. Since we're very hungry, we're ordering 6 cheese pizzas. Each\
    \ pizza is $9.99, so the cost of 6 pizzas is 6 x $9.99 = $59.94. The total cost\
    \ including the delivery cost is $59.94 + $2.99 = $62.93.\n\n![](img/2f70ee4f42068609791dbc3da621833c_21_0.png)\n\
    \n```c\n#include <stdio.h>\n\n#define PIZZA_COST 9.99\n#define DELIVERY_COST 2.99\n\
    \nint main(void) {\n    int very_hungry = 1, pizza_quantity = 6;\n    float total_cost;\n\
    \n    if (very_hungry) {\n        printf(\"We're ordering %d cheese pizzas.\\\
    n\", pizza_quantity);\n        total_cost = PIZZA_COST * pizza_quantity;\n   \
    \ } else {\n        printf(\"We're ordering one cheese pizza.\\n\");\n       \
    \ total_cost = PIZZA_COST;\n    }\n    //This means the same as total_cost = total_cost\
    \ + DELIVERY_COST;\n    total_cost += DELIVERY_COST;\n\n    printf(\"The total\
    \ cost is %.2f\", total_cost);\n    return 0;\n}\n```\n\n![](img/2f70ee4f42068609791dbc3da621833c_21_1.png)\n\
    \nThe variable `total_cost` is declared with a `float` data type: this allows\
    \ `total_cost` to store a floating-point number (a number that has a decimal point).\n\
    \nSince `very_hungry` equals 1, the `if` condition is true: `printf()` prints\
    \ \"We're ordering 6 cheese pizzas.\" on the screen. The `total_cost` is set to\
    \ `PIZZA_COST` multiplied by the `pizza_quantity`.\n\n`DELIVERY_COST` is added\
    \ to `total_cost` using the `+= addition assignment operator`. `%f` is the format\
    \ specifier for floating-point number. It is written as `%.2f` because the `.2`\
    \ in front of `f` specifies the number will be printed to two decimal places.\
    \ `printf()` prints The total cost is $62.93.\n"
  mdcn: "\n\n![](img/2f70ee4f42068609791dbc3da621833c_12_0.png)\n\n# 我们正在为早餐做 20 个煎饼。每个煎饼需要\
