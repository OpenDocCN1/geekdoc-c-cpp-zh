    is treated as an integer by Python. A number written like this:


    456.01


    is called a floating number(or simply, a float). When division is performed, if
    both numerator and denominator are integers, the result will be truncated to an
    integer. So, when you divide 3 by 2, you get 1 and not 1.5. If you wish to get
    the correct answer, you have to make one (or both) of the numbers float.


    Note: This behaviour (of division) is confusing and it has been corrected in a
    more recent version of Python.'
