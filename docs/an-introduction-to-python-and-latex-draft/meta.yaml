    # 5.1 Plotting a sine curve


    Say you wish to plot one full cycle of the sine curve. The first step is to generate
    a set of numbers between 0 and 2*pi. This can be done very easily using a function
    called linspace:


    ```

    >>> from pyplot import *

    >>> a = linspace(0, 2*pi, 4)

    >>> a

    array([ 0. , 2.0943951 , 4.1887902 , 6.28318531])

    >>> sin(a)

    array([ 0.00000000e+00, 8.66025404e-01, -8.66025404e-01, -2.44921271e-16])

    ```


    The function:


    ```

    linspace(x, y, N)

    ```


    generates N spaced numbers starting from x and ending in y; the difference between
    adjacent numbers is fixed. In the above case, x is 0, y is 6.28 and N is 4. The
    output linspace generates a Numeric Array:


    ```

    array([ 0., 2.0943951 , 4.1887902 , 6.28318531])

    ```


    You observe that the difference between consecutive numbers is fixed, approximately
    equal to 2.09. When you apply the sin function on a, it computes sin of all the
    numbers in the numeric sequence.


    Plotting a sine curve with just 4 points is not a good idea; especially when it
    is so easy to generate any points:'
