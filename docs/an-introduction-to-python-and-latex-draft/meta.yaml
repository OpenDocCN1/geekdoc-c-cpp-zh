    # CHAPTER THIRTEEN


    # HANDLING DATA FILES


    Operating systems use files for permanent data storage (usually on a hard disk,
    CD/DVD or thumb drive). Python programs can read data stored in files; they can
    also write data to files. In this chapter, we will examine how this is done.


    ## 13.1 Writing a message to a file


    Here is a simple Python program which writes a message to a file:


    ```

    >>> f = open(''abc'', ''w'')

    >>> f.write(''good morning!'')

    >>> f.close()

    >>>

    ```


    The function takes two parameters - the first one is the name of a file (in this
    case, abc) and the second is a mode (in this case, ''w'' which means we wish to
    open the file for writing). Open returns an object which is stored in f; if you
    wish to write a message (say ''good morning!'') to the file, simply execute:


    ```

    f.write(''good morning!'')

    ```


    **Note:** You can also store the string in a variable and pass the variable as
    parameter to f.write


    If you are familiar with the GNU/Linux operating system, you will see a file called
    *abc* when you browse the file!


    Once a message is stored in a file, it can be easily retrieved at any time:


    ```

    >>> g = open(''abc'', ''r'')

    >>> s = g.readline()

    >>> print s

    ''good morning!''

    >>>

    ```


    We are now opening the file for reading (note the ''r'' as second parameter to
    open). The function:


    ```

    g.readline()

    ```


    reads one line from the file; it is stored in s.


    ## 13.2 Writing and reading multiple lines


    What does the following Python program do?


    ```

    >>> f = open(''data'', ''w'')

    >>> f.write(''hello\n'')

    >>> f.write(''world\n'')

    >>> f.write(''python\n'')

    >>> f.close()

    ```


    It opens a ''data'' for writing and writes strings. Note the ''\n'' at the end
    of the strings - it stands for the newline character (the character corresponding
    to the Enter key). We want the strings to be stored as three independent lines
    in the file.


    We can read these lines back:


    ```

    >>> g = open(''data'', ''r'')

    >>> a = g.readlines()

    >>> print a

    [''hello\n'', ''world\n'', ''python\n'']

    >>>

    ```


    The function:


    ```

    g.readlines()

    ```


    reads all the lines in the file and returns a list containing these lines.


    ## 13.3 Writing and reading numerical data


    Let''s try to store a number 10 into a file:


    ```

    >>> f = open(''dat2'', ''w'')

    >>> i = 10

    >>> f.write(i)

    Traceback (most recent call last):

    File "<stdin>", line 1, in <module>

    ```


    TypeError: argument 1 must be string or read-only character buffer, not int

    >>>


    This does not work; the write function expects a string as its parameter and will
    not work with any other type. A solution is to convert 10 to a string and then
    write it to the file:


    ```

    >>> f.write(str(i))

    >>> f.close()

    ```


    The str function returns a string representation of the value in i and it is then
    written to the file. Have to be careful when you read back the data:


    ```

    >>> g = open(''dat2'', ''r'')

    >>> s = g.readline()

    >>> i = int(s)

    >>>

    ```


    The readline function returns the string representation of the integer stored
    in the file. It has to be converted back to its original form by calling int.


    # CHAPTER FOUR


    # INTRODUCTION TO LATEX SYSTEM


    What will you do if your teacher asks you to prepare a project using the PC? You
    will open Microsoft Office, type the document, and save it as doc file. You will
    spend a good amount of time changing fonts, aligning the lines and in general
    trying to make the document "beautiful".


    There are many problems with this approach to document preparation especially
    as you start writing technical documents like reports or books. It is a bit difficult
    at this point to explain what these problems are; the important thing is to realize
    that using a word processor like MS Office (or OpenOffice, GNU/Linux) is not the
    only way to prepare documents. A far superior method is available; this involves
    using a program called LaTeX.


    **Note:** We will make heavy use of the system terminal/command line as well as
    a text editor like gedit in the remaining part of this book. So it is a good idea
    to review the material in Chapter 1 before proceeding further.


    ## 14.1 Simple LaTeX document


    Use your favourite editor (say gedit) and create a text file containing the following
    lines:


    ```

    \documentclass{article}

    \title{Srinasa Ramanujan}

    \begin{document}

    \maketitle


    Srinasa Ramanujan was an Indian mathematician and self-taught genius...

    \end{document}

    ```


    Save the file as ramanujan.tex; this is your report on Srinivasa Ramanujan, the
    famous mathematician whom you are supposed to submit to your maths tomorrow!


    But wait, what are all those \documentclass, \title etc in the document? The idea
    is that you can use a powerful document called LaTeX to convert this file into
    a very good document which can be printed on paper. How do we do this?


    Open a terminal and type the following command:


    ```

    pdflatex ramanujan.tex

    ```


    "pdflatex" generates a new file "ramanujan.pdf" using the data contained in "ramanujan.tex";
    you will see a lot of messages getting printed on the screen during this process
    - don''t worry about it as long as you get back the prompt (in case there is some
    error, you will not get the command prompt - we will see how to handle this the
    end of this chapter).


    A file ending in .pdf can be given directly to a printer or it can be viewed on
    the screen (on GNU/Linux) using one of two programs: either xpdf or evince. You
    simply have to give the command:


    ```

    xpdf ramanujan.pdf

    ```


    or:


    ```

    evince ramanujan.pdf

    ```


    at the operating system command line. Here is what you will see when you print
    (or view) the PDF document:


    Srinasa Ramanujan

    January 24, 2010

    Srinasa Ramanujan was an Indian mathematician and self taught genius, with almost
    no formal training in pure mathematics, made substantial contributions to mathematical
    analysis, number theory, infinite series and continued fractions.


    Sometimes, GNU/Linux installation may not have the command pdflatex installed.
    In that case, there is another way to generate printable output.


    First, we run the command latex:


    ```

    latex ramanujan.tex

    ```


    This will generate a Postscript file called "ramanujan.dvi". You have to convert
    a .dvi file to either PDF or Postscript by the commands dvipdf or dvips:


    ```

    dvips ramanujan.dvi

    ```


    will generate a new Postscript file called "ramanujan.ps" which can be directly
    printed or viewed on the screen using xpdf or evince.


    If you wish to generate PDF output, you can try:


    ```

    dvipdf ramanujan.dvi

    ```


    ## 14.2 What does LaTeX really do?


    If you look at the PDF document produced by LaTeX, you will see that it does not
    contain any of the lines \documentclass, \title etc. Instead, what you see is
    neatly formatted output. The title has a bigger font size and is centered. The
    left and right ends of all the lines are perfectly aligned; the word “continued”
    has been split to make the alignment perfect. Usually, when we prepare documents
    using MS-Word or OpenOffice, we spend a lot of time doing these things manually
    - the problem with the approach is that as the document gets larger in size, we
    will be spending more and more time on this than concentrating on our writing.
    It’s here that LaTeX comes to our rescue. All the details in getting beautiful
    printed output is handled by LaTeX - simply have to finish our writing! This does
    not mean we can simply type an article and expect LaTeX to format it properly.
    For example, how does LaTeX know what the title of the article is?


    Simple. When you write a line:


    ```

    \title(Srinasa Ramanujan)

    ```


    you are telling LaTeX that “Srinasa Ramanujan” is the title of the article. This
    does not result in the title being actually displayed - LaTeX simply notes the
    fact that the title is “Srinasa Ramanujan”. It is displayed when you use type:


    ```

    \maketitle

    ```

