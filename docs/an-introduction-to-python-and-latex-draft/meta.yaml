    # Python 和 LaTeX 简介，版本 0.01


    因为它是标题，LaTeX 会赋予它更大的字体并将其居中显示。


    现在，LaTeX 是如何知道正文应该使用多大字体大小的？如果你正在准备一份用于演示并投影到屏幕上的文稿（例如使用 LCD 投影仪），那么字体必须得大得多。这就是“documentclass（文档类）”变得重要的地方。如果你观察你周围的文档类型，你会看到文章、书籍、信件、幻灯片等。每种“类型”文档都有其特定的逻辑结构。


    信件有“发件地址”、“签名”、“称呼”、“主题”、“地点”、“日期”等，而文章则没有大部分大部分内容。书籍将有章节（chapters）、节（sections）和小
    节（sub-sections）；文章内部不会有章节。


    在开始编写 LaTeX 文档的内容之前，你必须告诉 LaTeX 你计划写什么种类型的文档。这就是：


    ```latex

    \documentclass{article}

    ```


    你告诉 LaTeX 你要准备的是一篇文章，而不是幻灯片、书籍或信件。一旦你将这些信息告诉 LaTeX，LaTeX 将决定你的文档如何进行格式化。


    **注意：** 你可以为 \documentclass 命令指定选项；例如，如果你希望字体大小为 12 点且分双栏显示，你可以写：`\documentclass[twocolumn,12pt]{article}`


    一旦你指定了文档类和标题，就可以编写文档的实际内容——这些内容必须写在以下行之间：


    ```latex

    \begin{document}

    ```


    和：


    ```latex

    \end{document}

    ```


    # 14.3 节和小 节


    创建另一个文本文件 sample1.tex，并在包含以下行：


    ```latex

    \documentclass{article}

    \title{A sample document}

    \author{Pramode C.E}

    \date{23 Jan 2010}


    \begin{document}


    \maketitle


    \section{This is a section}

    ```


    文章通常被组织为节、小 节等。


    ```latex

    \subsection{This is a sub section}

    ```


    小 节是节的一部分。


    ```latex

    \section{This is another section}

    ```


    这一节没有任何小 节！


    ```latex

    \end{document}

    ```


    生成的 pdf/postscript 文件看起来如下所示：


    # A sample document


    Pramode C.E

    23 Jan 2010


    - 1 This is a section

    文章通常被组织为节、小 节等。


    - 1.1 This is a sub section

    小 节是节的一部分。


    - 2 This is another section

    这一节没有任何小 节！


    \title, \author 和 \date 命令为文档设置了标题、作者和日期（如果未指定日期，会自动使用当前日期）——这些仅在调用 \maketitle
    时才会显示。


    新节通过编写以下代码来指定：


    ```latex

    \section{name of section}

    ```


    LaTeX 会自动对节进行编号并选择合适的字体大小。同样，小 节是通过以下方式创建的：


    ```latex

    \subsection{name of sub-section}

    ```


    注意：LaTeX 再次为我们节省了节编号和字体大小选择的精力。LaTeX 还能通过指定的节名称为我们自动生成目录！


    # 14.4 列表、引用和引言


    将以下文本输入文件，例如 sample2.tex：


    ```latex

    \documentclass {article}


    \begin{document}

    这里是如何排版一个短引用的：

    \begin{quote}

    This is an example of a short quotation. It consists of a single para of text.
    See how it is formatted.

    \end{quote}


    而且，这是一个长引用的示例：

    \begin{quote}

    This is an example of a longer quotation. It consists of more than one paragraph
    of text.


    This is the second para of the quotation.

    \end{quote}


    这是一个无序列表的示例：

    \begin{itemize}

    \item Apple

    \item Orange

    \item Banana

    \end{itemize}


    还有一个，这是一个有序列表的示例：

    \begin{enumerate}

    \item Newton

    \item Pascal

    \item Euler

    \end{enumerate}


    \end{document}

    ```


    这是 LaTeX 生成的 PDF 输出：


    这里是如何排版短引用的：


    > This is an example of a short quotation. It consists of a single para of text.
    See how it is formatted.


    而且，这是一个长引用的示例：


    > This is an example of a longer quotation. It consists of more than one paragraph
    of text.

    > This is the second para of the quotation.


    这是一个无序列表的示例：


    - Apple

    - Orange

    - Banana


    还有一个，这是一个有序列表的示例：


    1. Newton

    2. Pascal

    3. Euler


    只有一个段落的短引用可以通过将其包含在以下范围内进行格式化：


    ```latex

    \begin{quote}

    \end{quote}

    ```


    \begin 命令被用于引入一个 LaTeX 环境，环境名称在大括号中给出。注意 LaTeX 将引号内的文本向右偏移一点。


    quote 环境用于显示较长的（多段落）引言。


    itemize 环境用于无序列表。


    enumerate 环境用于有序列表。


    # 14.6 设置数学公式


    数学公式充满了符号，在编写普通文本时很少使用——LaTeX 有一套自己的语法来表示这些符号和符号组合。公式：


    $$E = mc^2$$


    公式本身就是一个很好的例子。当使用 \^ 操作符时，LaTeX 将数字 2 显示为“上标”。


    # 15.2 一些示例


    下面给出了一些使用 LaTeX 可以创建的数学表达式的示例（表达式必须处于数学模式中）：


    | 表达式 | LaTeX 命令 |

    | :--- | :--- |

    | $x_i$ | `x\_i` |

    | $p = \frac{a+b}{a-b}$ | `p = \frac{a+b}{a-b}` |

    | $\sqrt{a+b}$ | `\sqrt{a+b}` |

    | $\sqrt[n]{2}$ | `\sqrt[n]{2}` |

    | $\alpha \beta \pi$ | `\alpha \beta \pi` |

    | $\leq$ | `\leq` |


