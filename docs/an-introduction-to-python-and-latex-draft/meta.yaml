    # An Introduction to Python and LaTeX, Release 0.01


    The BSc Informatics course conducted by University of Calicut is based completely
    on Free Software. Students are required to study the Python programming language
    and also learn how to prepare technical documents using LaTeX. Majority of the
    students have a computing background limited to using Microsoft Windows for simple
    tasks like web browsing. An introduction to Python and LaTeX has the objective
    of providing a general introduction to computing to such an.


    Because most of the readers would be either Mathematics teachers or undergraduate
    Math students, sample programs are structured around simple mathematical concepts.
    No attempt has been made to go deep into language syntax - my experience with
    conducting workshops for teachers has been that any attempt to introduce syntax
    elements whose application can''t be demonstrated immediately through simple math
    examples usually leads to confusion. So, this book will not be an ideal resource
    for people who wish to master Python syntax and idioms in depth. There are plenty
    of great resources on the net for that, one of the best being Dive into Python
    (available at http://www.diveintopython.org).


    This book is being updated continuously - the most recent version is openly available
    on the Internet at address: http://radiantbytes.com/books/python-latex. Please
    visit this web site if you wish to contact the author or discuss problems encountered
    while teaching the subject.


    # CHAPTER ONE


    # # AN INTRODUCTION TO THE GNU/LINUX OPERATING SYSTEM


    This book teaches programming using Python and technical document preparation
    using LaTeX. Both LaTeX and Python are Free Software, the ideal way to learn them
    is by using the GNU/Linux system.


    ## 1.1 Installing GNU/Linux


    A complete GNU/Linux system is composed of thousands of applications, all available
    for download on the Internet. Setting up a system by downloading and installing
    each component individually is a very tough job - so we have what are called Linux
    distributions which are simply CD''s/DVD''s packed with all the tools required
    to set up a fully functional system. There are several GNU/Linux distributions
    - Fedora, Ubuntu and Debian are some of the more popular ones. These basically
    differ in the mix and software they provide - most people would advise beginners
    to get started with Ubuntu.


    A complete Ubuntu distribution can be downloaded from the web: http://www.ubuntu.com.
    The downloaded software should be written to a CD - this CD can be used to install
    Ubuntu onto the hard disk. The installation process is usually very easy and a
    person moderately experienced in using computers, even if he is using GNU/Linux
    based for the first time, should be able to complete it without too much trouble.
    We will not go into the details of system installation in this book - it is assumed
    that you have a working GNU/Linux system at hand.


    ## 1.2 Using GNU/Linux


    Shown below is the screen shot of a Fedora GNU/Linux desktop.


    ![](img/d7a432a3c25137f7a1b47cdb96ad5de3_8_0.png)


    You will find menus like Applications, Places, System etc. The menu layout and
    desktop appearance will be different on other GNU/Linux distributions. But that
    shouldn''t bother you too much. A little experimentation is all that is required
    to get up and running!


    Here are some common GNU/Linux applications for tasks like editing documents,
    browsing the web etc.


    - Firefox - the standard web browser on GNU/Linux systems

    - OpenOffice - you can use this program for word processing, spreadsheet calculations.

    - GIMP - a powerful image manipulation program. You will love this if you are
    a graphics artist.


    ## 1.3 The GNU/Linux Command line


    The mouse based Graphical User Interface is ideal for beginners. But once you
    start writing programs you will have to interact with the operating system by
    typing commands. You need to open a terminal for doing this. On a Fedora system,
    the terminal is available in the System tools sub-menu of the Applications menu
    (its name is simply Terminal). The location of this program may be different on
    other distributions - so you will have to experiment a bit! Here is a screen shot
    of Fedora with terminal active.


    # An Introduction to Python and LaTeX, Release 0.01


    ![](img/d7a432a3c25137f7a1b47cdb96ad5de3_9_0.png)


    You can type commands within terminal and they get executed. Say for example you
    wish to see current date - the command for doing this is simple `date`. Here is
    what you might see if you type `date` (followed by the **Enter** key):


    ```

    [ram@knuth ~]$ date

    Wed Nov 11 12:28:19 IST 2009

    ram@knuth ~]$

    ```


    The message shown above is called a prompt. The three greater signs constitute
    what is called the python prompt. When Python displays the prompt, you know that
    it is ready to accept commands!


    **Note:** The actual message displayed as part of the prompt will be different
    on your machine. No need to worry about it! Just keep in mind that you always
    type commands *after* the prompt.


    4 Chapter 1. An introduction to the GNU/Linux Operating System


    # GETTING STARTED WITH PYTHON


    The Python programming language was created by a Dutch Computer Scientist Guido
    Rossum. Unlike languages like C/C++/Java, Python is extremely friendly to beginners
    - famous Universities like MIT (Massachusetts Institute of Technology) use it
    to teach introductory programming courses.


    ## 2.1 First steps - use Python as a calculator!


    In the previous chapter, you had seen how to interact with GNU/Linux Operating
    System by typing commands. You can run Python by simply typing the command python.
    Here is how your screen would look:


    ```

    [ram@knuth ~]$ python

    Python 2.6 (r26:66714, Mar 17 2009, 11:44:21)

    [GCC 4.4.0 2090313 (Red Hat 4.4.0-0.26]) on linux2

    Type "help", "copyright", "credits" or "license" for more information.

    >>>

    ```


    Donont worry if the details shown below do not match exactly with what you see
    on your computer. It is enough that the last line of the output matches what you
    see exactly. The three greater signs constitute what is called the python prompt.
    When Python displays the prompt, you know that it is ready to accept commands!
    Type 1 +2, hit the Enter key and see what happens:


    ```

    >>> 1 + 2

    3

    >>>

    ```


    **Note:** In examples like the above, you should not type the three greater signs
    - it is automatically displayed by Python.


    **Note:** If Python shows you some error (instead of printing 3), read the section
    titled "use of space character in Python" which comes at the end of this chapter.

