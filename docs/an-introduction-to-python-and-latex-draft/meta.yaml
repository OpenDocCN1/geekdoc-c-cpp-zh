    # 3.1.2 Indexing a list


    The variable marks represents a set of marks as a whole. Suppose you wish to know
    the mark of each student individually. Here is how it is done:


    ```

    >>> marks

    [80, 75, 66, 55, 95]

    >>> marks[0]

    80

    >>> marks[1]

    75

    >>> marks[4]

    95

    >>>

    ```


    When you write marks[0], you are asking Python to display the first mark in the
    sequence and when you write marks[4], you are asking Python to display the fifth
    mark in the sequence. Note that Python is counting from zero, that is why the
    first mark is marks[0] and not marks[1].


    You can read the statement marks[0] as either zero or marks of zero. The operation
    of looking at individual elements of a list is called indexing.


    What will happen if you write marks[5]? Let''s find out:


    ```

    >>> marks[5]

    Traceback (most recent call last):

    File "cstdin", line 1, in <module>

    IndexError: list index out of range

    >>>

    ```


    Look at the last line of the error message, it says IndexError: list index out
    of range. The elements of the list are numbered from 0 to 4 - you are asking Python
    to display an element in the sequence which is simply not present and you get
    an error!


    # 3.1.3 Modifying the elements of a list


    Let''s say you wish to change the mark of the first student from 80 to 65. Here
    is how it is done:


    ```

    >>> marks[0] = 65

    >>> marks

    [65, 75, 66, 55, 95]

    >>>

    ```'
