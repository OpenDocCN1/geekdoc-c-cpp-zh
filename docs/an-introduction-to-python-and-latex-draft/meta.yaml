    # # USING PYTHON LISTS


    We have seen how Python works with numerical data. Now, let''s look at some of
    the techniques used by Python programmers to handle large collections of data.


    # ## 3.1 Elementary list manipulation


    # ### 3.1.1 Creating a list


    A point in the Cartesian plane is represented by two numbers - its X and Y co-ordinates.
    Using simple Python variables, we might write:


    ```

    >>> x = 2

    >>> y = 3

    >>>

    ```


    But this does not in any make it clear that we are referring to the x and y coordinates
    of a single point; we need some way to group these two numbers. Python provides
    a powerful list notation to do this:


    ```

    >>> p = [2,3]

    >>>

    ```


    The idea is simple - just write a sequence of numbers (separated by comma) within
    two brackets (note that we are using square brackets here) and you have what is
    called a Python list. In the above case, we can say that the variable p represents
    a point with co-ordinates 2 and 3.


    The number of elements in a list is not limited - you can have as many as you
    like like:


    ```

    >>> marks = [80, 75, 66, 55, 95]

    >>>

    ```


    In this case, marks represents the mark of five students in an exam.'
