  md: '# An Introduction to Python and LaTeX, Release 0.01


    # 9.2 Finding square roots


    There is a very simple technique for calculating the square root of a number based
    on what is called the Newton''s method. Let''s say you wish to calculate square
    root of 16 (we will call this X). We will make a guess that the root is 1:


    X = 16, Guess = 1.0


    Now, is this good enough? We can find out by taking the square of Guess and checking
    whether it is close to X. In this case, our guess is not good enough.


    So, we will improve our initial guess; our “improved” guess should be, according
    to Newton''s method:


    Average of two numbers: Guess and X/Guess


    In this case, it will be average of 1 and 16, that is 8.5.


    This improved guess is not good enough, so we shall improve it by again taking
    average of Guess and X/Guess where Guess is now 8.5. The value we will get be:


    ```

    (8.5 + 16/8.5) / 2 = 5.19

    ```


    We repeat this process a few times:


    ```

    (5.19 + 16/5.19) / 2 = 4.13

    (4.13 + 16/4.13) / 2 = 4.00

    ```


    In just more steps, we reach close to the required value!


    # 9.3 Writing a square root finding program


