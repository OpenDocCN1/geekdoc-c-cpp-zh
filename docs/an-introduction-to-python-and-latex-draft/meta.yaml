    \ the HCF of two numbers A and B. Simply repeat the following steps until both\
    \ become equal:\n\n+   - If A is greater than B, change A to A-B and do not modify\
    \ B\n- If B is greater than A, change B to B-A and do not modify A\n\nThe value\
    \ of the A (and B) when both become equal will be the Highest Common Factor!\n\
    \nLet's try this with two numbers, A=18 and B=42.\n\nB is greater than A, so B\
