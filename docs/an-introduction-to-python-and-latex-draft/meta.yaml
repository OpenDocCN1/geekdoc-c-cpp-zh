- md: "\n# PROGRAMMING WITH CLASSES AND OBJECTS\n\nBesides writing correct code, a\
    \ programmer has to make sure that he writes clear, readable code; code which\
    \ others can read, understand and modify easily. One way to do this is by structuring\
    \ the program as a collection of small functions. In this chapter, we examine\
    \ another powerful technique for achieving the same goal.\n\n**Note:** We are\
    \ going to examine ideas which are a bit more complicated than what we have seen\
    \ so far ... don't worry if you do not understand everything clearly.\n\n## 11.1\
    \ Representing a student\n\nAs discussed in the previous chapter, you can represent\
    \ a student in a Python program by a list:\n\n```python\n>>> p = [\"Tom\", 15,\
    \ 78]\n>>> q = [\"Jerry\", 14, 81]\n>>> p[0]\n'Tom'\n>>> q[0]\n'Jerry'\n>>> p[1]\n\
    15\n>>> q[1]\n14\n>>> p[2]\n78\n>>> q[2]\n81\n>>>\n```\n\nWe have two students,\
    \ *Tom* and *Jerry* aged 15 and 14 respectively. They have scored marks 78 and\
    \ 81 in the maths exam.\n\nLet's write a Python function to find out the name\
    \ of the student with higher mark:\n\n```python\n>>> def better_student(a, b):\n\
    ...    if a[2] > b[2]:\n...        return a[0]\n...    else:\n...        return\
    \ b[0]\n...\n>>> better_student(p, q)\n'Jerry'\n>>>\n```\n\nThe better_student\
    \ function works perfectly; it compares the marks of the two students and returns\
    \ name of the student with greater mark.\n\nImagine a situation where better_student\
    \ is just one in a big program composed of hundreds of functions. How does another\
    \ programmer reading your code know the definitions of p[2] and b[2] represents\
    \ the marks of the students without having to check the definitions of p and q\
    \ which might be at a location removed from where you are defining better_student?\
    \ Even when he sees the actual definition of p and q, how does he know that p[2]\
    \ and q[2] are the marks (rather than p[1] and q[1])? Surely, we need a better\
    \ way to represent our student!\n\n## 11.2 Using classes and objects\n\nLook at\
    \ the following Python program:\n\n```python\n>>> class student:\n...    pass\n\
    >>> a = student()\n>>> a.age = 15\n>>> a.mark = 78\n>>> a.name = \"Tom\"\n>>>\
    \ b = student()\n>>> b.age = 14\n>>> b.mark = 81\n>>> b.name = \"Jerry\"\n>>>\
    \ a.age\n15\n>>> b.mark\n81\n>>>\n```\n\nThe first two lines constitute a class\
    \ declaration. What does it do?\n\nAny data item in a Python program belongs to\
    \ one of several categories. For example, the number 12 belongs to the category\
    \ integer, the sequence \"hello\" belongs to the category string, the number 1.23\
    \ belongs to the category float. The class declaration simply tells Python:\n\n\
    We have a new category - let's call it student.\n\nThe statement:\n\n```python\n\
    a = student()\n```\n\ntells Python to create a new student; in programming language\
    \ terminology, we will call it an object.\n\nThe remaining lines:\n\n```python\n\
    a.age = 15\na.mark = 78\na.name = \"Tom\"\n```\n\nsimply instruct Python to:\n\
    \nset the age, mark and name of the new student to 15, 78 and \"Tom\".\n\nage,\
    \ mark and name are referred to as attributes of the object.\n\nWe should examine\
    \ the class declaration a bit more in detail. The first line of a class declaration\
    \ is the keyword class followed by a name:\n\n```python\nclass name_of_class:\n\
    ```\n\nThe body of a class declaration has to be indented (similar to functions,\
    \ while loops and if statements). The simplest class is one which has an empty\
