  md: '# An Introduction to Python and LaTeX, Release 0.01


    # 16.5 Using “pstricks” for advanced picture drawing


    We have seen that the facilities available by default in LaTeX for drawing lines,
    circles etc are not very sophisticated. A package called "pstricks" can be used
    for generating complex figures without too much trouble. Let''s try to plot a
    curve using pstricks:


    ```

    \documentclass{article}

    \usepackage{pstricks}

    \usepackage{pst-plot}


    \begin{document}


    \begin{ppicture}(-3,-2) (3, 2)

    \psaxes(0,0) (-3,-2) (3, 2)

    \psplot[plotstyle=curve] (-1.5) {1.5} (x exp x)

    \end{ppicture}


    \end{document}

    ```


    Two packages have to be included: pstricks and pst-plot. Also, "pdflatex" will
    not work with the above file - you have to use the "latex" command itself.


    The line:


    ```

    \begin{ppicture}(-3,-2) (3, 2)

    ```


    starts "ppicture" environment - think of it as a request to LaTeX to leave enough
    space for a rectangle whose left corner has co-ordinate (-3,-2) and top right
    corner has co-ordinate (3, 2).


    The next command:


    ```

    \psaxes(0,0) (-3,-2) (3, 2)

    ```


    draws the co-ordinate axes. The X axis and Y axis meet at the point (0,0) and
    they have to be visualized as enclosed in an imaginary rectangular box with bottom
    left corner at (-3,-2) and top right corner at (3, 2).


    We are plotting the curve:


    ```

    y = (x * x * x) - x

    ```


    This equation has to be specified in a peculiar form postfix. An arithmetic expression
    written in the usual way:'
  merge: -1
  pgno: 83
- img_proc: true
  md: '# An Introduction to Python and LaTeX, Release 0.01


    2 * 3 + 4


    is called an *infix expression*. Here is another way to write the same expression:


    2 * 3 * 4 +


    This is called a *postfix expression*. The logic is simple. Read the expression
    from left to right. When you encounter an operator, simply apply the operator
    to the two operands to the left. In the above case, the moment we see the * operator
    (multiplication), we can rewrite the expression as:


    6 4 +


    Now, when we encounter the + operator, we can rewrite the expression as:


    10


    Let''s examine this line in our LaTeX document:


    ```

    \pslot[plotstyle=curve] {-1.5} {1.5} {x 3 exp x sub}

    ```


    We are asking LaTeX to plot a curve; the curve is given by the equation:


    y = x 3 exp x sub


    (note: you need to specify only the right hand side of the equation).


    This equation is written in postfix form: *exp* is the exponentiation operator
    and *sub* is the subtraction operator. So we can read this as:


    y = (x raised to 3) minus x


    The numbers -1.5 and +1.5 in brackets refers to the range of possible values for
    x.


