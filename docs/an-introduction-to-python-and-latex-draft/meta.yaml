    ## 16.2 绘制线条


    在 LaTeX 中画线是一项复杂的任务——由于某些限制，无法绘制具有任意斜率的线条。画线命令工作的自然方式应该是接受端点的坐标并绘制一条连接它们的线。但并不是
    LaTeX 中的实现方法。为了简化问题，我们考虑了三个独立的情况：绘制水平线、绘制垂直线以及绘制具有许多其他斜率的线条。对于这三种情况，我们假设有一个大小为
    100x200 的框，原点 (0,0) 在左下角（与上一节相同的框）。


    ### 16.2.1 水平线


    假设我们想从点 (30, 90) 绘制一条长度为 40 单位的水平线。实现方法如下：


    ```

    \put(30,90) (\line(1,0) {40})

    ```


    我们可以在这个命令中识别出两个独立的部分；第一部分：


    ```

    \put(30, 90)

    ```


    表示：从点 (30, 90) 开始画线。下一部分是：


    ```

    \line(1,0) {40}

    ```


    它的工作原理是：LaTeX 绘制了一条长度为 40 单位的线，通过点：


    ```

    (30, 90) 和 (30 + 1, 90 + 0)

    ```


    并结束于 (70, 90)。


    如果我们写：


    ```

    \put(30,90) { \line(-1, 0) {30} }

    ```


    我们得到一条通过 (30, 90) 和 (30 - 1, 90 + 0) 的长度为 30 单位的线，结束于 (0, 90)。因此，绘制水平线的通用命令是：


    ```

    \put(x,y) { \line(A, 0) {len} }

    ```


    其中 (x,y) 是线条的起始坐标，A 是 +1 或 -1（取决于你想画在 (x, y) 的右侧还是左侧），而 *len* 是线条的长度。


    # Python 与 LaTeX 简介，版本 0.01


    ### 16.2.2 垂直线


    应该很容易猜到垂直线是如何绘制的！示例：


    ```

    \put(30,90) \line(0,1) {40})

    ```


    这绘制了一条连接 (30, 90) 和 (30, 91) 的长度为 40 单位的垂直线，结束于 (30, 130)。通用命令是：


    ```

    \put(x,y) {\line(0, A){len} }

    ```


    其中 (x, y) 是线条的起始坐标。A 是 +1 或 -1（取决于线条向上还是向下），len 是线条的长度。


    ### 16.2.3 斜线（既非垂直非水平）


    如果我们写：


    ```

    \put(30,90) \line(1,-1) {40})

    ```


    我们得到一条通过 (30, 90) 和 (30 - 1, 90 + 0) 的长度为 30 单位的线，结束于 (0, 90)。因此，绘制水平线的通用命令是：


    ```

    \put(x,y) { \line(A, 0) {len} }

    ```


    其中 (x,y) 是线条的起始坐标，A 是 +1 或 -1（取决于你想画在 (x, y) 的右侧还是左侧），而 *len* 是线条的长度。


