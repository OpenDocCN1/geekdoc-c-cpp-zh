    # CHAPTER SIXTEEN


    # PICTURES AND COLOURS IN LATEX


    It is possible to include pictures in your LaTeX document. It is also possible
    to draw simple figures and change colors using LaTeX commands itself. This chapter
    explains how this is done.


    **Note:** Using an additional package called “pstricks”, it is possible to generate
    complex figures (like plots of equations) in LaTeX. A simple “pstricks” example
    is given in the last section of this chapter.


    ## 16.1 The LaTeX “picture” environment


    Create a file pic1.tex containing the following lines:


    ```

    \documentclass{article}

    \begin{document}


    \section{This is a section}


    \begin{picture}(100,200)

    \put (0,0) {A}

    \put (100,0) {B}

    \put (100,200) {C}

    \put (0,200) {D}

    \end{picture}


    \end{document}

    ```


    Here is the PDF/Postscript output produced by LaTeX:


    # 1 This is a section


    The LaTeX command:


    ```

    \begin{picture}(100, 200)

    ```


    creates a "picture environment" of width 100 units and height 200 units (imagine
    the picture environment producing a 100x200 box) - a unit has a default value
    of about 0.35mm. The command:


    ```

    \put (0,0) {A}

    ```


    writes the symbol "A" at location (0,0) of the box; location (0,0) is the (x,
    y) coordinate of the lower left corner of the box (it is the origin). The +ve
    X axis is towards the right and the upward direction represents +ve Y axis. The
    command:


    ```

    \put (100,200) {C}

    ```


    places the symbol C at the top right corner. The commands:


    ```

    \put (100, 0) {B}

    \put (0, 200) {D}

    ```


    places the symbols B and D at the bottom right and top left corners of the box.


    # An Introduction to Python and LaTeX, Release 0.01


    ## 16.2 Drawing Lines


    Drawing lines in LaTeX is tricky business - due to certain limitations, it is
    not possible to draw lines with any random slope. The natural way for a line drawing
    command to work be to accept the coordinates of the endpoints and draw a line
    connecting them. But that is not the way it is done in LaTeX. To simplify things,
    we consider three separate cases: drawing a horizontal line, drawing a vertical
    line and drawing lines with many other slopes. For all three cases, we assume
    a box of size 100x200 with origin (0,0) at the bottom left corner (the same box
    as in the previous section).


    ### 16.2.1 Horizontal lines


    Let''s say we wish to draw a horizontal line of length 40 units from point (30,
    90). Here is how it is done:


    ```

    \put(30,90) (\line(1,0) {40})

    ```


    We can identify two separate parts in this command; the first part:


    ```

    \put(30, 90)

    ```


    says: start the line at point (30, 90). The next part is:


    ```

    \line(1,0) {40}

    ```


    This is how it works: LaTeX draws a line of length 40 units and passing through
    the points:


    ```

    (30, 90) and (30 + 1, 90 + 0)

    ```


    and ending at (70, 90).


    What if we write:


    ```

    \put(30,90) { \line(-1, 0) {30} }

    ```


    We get a line passing through (30, 90) and (30 - 1, 90 + 0) of length 30 units,
    ending at (0, 90). So, the general command for drawing a horizontal line is:


    ```

    \put(x,y) { \line(A, 0) {len} }

    ```


    Where (x,y) is the starting coordinate of the line, A is +1 or -1 (depending on
    whether you want to draw to the right of (x, y) or left of (x, y) and *len* is
    the length of the line.


    # An Introduction to Python and LaTeX, Release 0.01


    ### 16.2.2 Vertical lines


    It should be easy to guess how vertical lines are drawn! Here is an example:


    ```

    \put(30,90) \line(0,1) {40})

    ```


    This draws a vertical line connecting (30, 90) and (30, 91) of length 40 units
    ending at (30, 130). The general command is:


    ```

    \put(x,y) {\line(0, A){len} }

    ```


    Where (x, y) is the starting coordinate of the line. A is +1 or -1 depending on
    whether the line goes up or down and len is the length of the line.


    ### 16.2.3 Slanted lines (neither vertical nor horizontal)


    What kind of line draw LaTeX if we write:


    ```

    \put(30,90) \line(1,-1) {40})

    ```


    We get a line passing through (30, 90) and (30 - 1, 90 + 0) of length 30 units,
    ending at (0, 90). So, the general command for drawing a horizontal line is:


    ```

    \put(x,y) { \line(A, 0) {len} }

    ```


    Where (x,y) is the starting coordinate of the line, A is +1 or -1 (depending on
    whether you want to draw to the right of (x, y) or left of (x, y) and *len* is
    the length of the line.


