    \n2 * 3 + 4\n\n被称为*中缀表达式*。这里是另一种编写相同表达式的写法：\n\n2 * 3 * 4 +\n\n这被称为*后置表达式*。逻辑很简单：从左到右读取表达式。当你遇到一个运算符时，只需将该运算符应用于左侧的两个操作数。在上面的例子中，当我们看到\
    \ * 运算符（乘法）时，我们可以将表达式重写为：\n\n6 4 +\n\n现在，当我们遇到 + 运算符时，我们可以将表达式重写为：\n\n10\n\n让我们查看\
    \ LaTeX 文档中的这一行：\n\n```\n\\pslot[plotstyle=curve] {-1.5} {1.5} {x 3 exp x sub}\n\
    ```\n\n我们正在要求 LaTeX 绘制一条曲线；该曲线由方程给出：\n\ny = x 3 exp x sub\n\n（注意：你只需要指定方程的右侧）。\n\
    \n该方程是以后置形式编写的：*exp* 是幂运算符，*sub* 是减法运算符。因此我们可以将其读为：\n\ny = (x 的 3 次方) 减 x\n\n\
    括号中的数字 -1.5 和 +1.5 指 x 的取值范围。\n\n## 16.5. 使用 \"pstricks\" 进行高级绘图\n\n# 第十七章\n\n\
    # 附录 1 - 编写独立的 Python 程序\n\n到目前为止，我们一直使用交互式 Python 提示符来编写短程序。这种方法的缺点显而易见 - 当退出\
    \ Python 时，你编写的所有代码都会丢失。在本章中，我们将学习如何将 Python 程序永久存储在文本文件中。\n\n## 17.1 在 GNU/Linux\
    \ 中使用编辑器\n\n编辑器是一个帮助创建文本文件的程序，这些文件可以永久保存在计算机硬盘上。GNU/Linux 操作系统带有许多编辑器；其中最常用的两个是\
    \ vi 和 emacs。对于绝对初学者来说，这两者都有点难以使用。更好的选择可能是一个名为 gedit 的程序。你只需在操作系统命令行输入 gedit 即可运行它（关于命令行的讨论请参阅第\
    \ 1 章）。\n\ngedit 易于使用。你可以输入任何想要的内容；一旦完成输入，就是保存你输入的数据了。为此，从 File（文件）菜单中选择 Save（保存）选项；gedit\
    \ 将显示你想要保存输入数据的文件名。从 File（文件）菜单中选择 Quit（退出）选项退出 gedit。\n\n## 17.2 使用 gedit 编写\
    \ Python 程序\n\n运行 gedit 并将以下行保存到名为 hello.py 的文件中：\n\n```\nprint \"Hello\"\n```\n\
    \n退出 gedit 并在操作系统命令行输入以下内容：\n\n```\npython hello.py\n```\n\n你将看到屏幕上打印出“Hello”。\n\
    \n使用 gedit 创建另一个文件并在其中存储以下代码（.py 后缀告诉我们正在处理包含 Python 代码的文件）：\n\n```\ndef sqr(x):\n\
    \    return x+x\nm = sqr(3)\nprint m\n```\n\n你可以通过在命令行输入运行代码：\n\n```\npython abc.py\n\
    ```\n\n**注意：** 以这种方式编写 Python 代码时你应该更加小心。当你在 Python 提示符输入代码时，遇到语法错误会立即时反馈。而在文件中存储并执行\
    \ Python 代码并非如此。\n\n## 17.3 执行键盘输入\n\n使用 gedit 将此程序存储在名为 test.py 的文件中：\n\n```\n\
    a = input()\nb = input()\nprint a * b\n```\n\n在命令行运行代码：\n\n```\npython test.py\n\
    ```\n\n**input** 函数等待你从键盘输入数据；输入数字 10 并按下 *Enter* 键。数字将被读取并存储在变量 *a* 中。现在输入另一个数字（比如\
    \ 20）并按下 *Enter*；它将被存储在 *b* 中。程序将输出 200。\n\n# 第十八章\n\n# # 许可证\n\n本书根据 GNU FDL\
    \ 发布\n\n# 第十九章 如何从源码构建书籍\n\n本书是用一个名为 Sphinx 的优秀工具编写的。Sphinx 允许你使用简单的重构文本格式进行编写\
    \ -  HTML（用于在浏览器显示）以及 LaTeX（用于打印）均由 Sphinx 完成。你现在阅读的就是 Sphinx 生成的书籍！源代码可以在 GitHub\
    \ 获取。\n\n关于我写书的工作流一点：我在家庭机器上维护一个 git 仓库，偶尔推送到 GitHub。我在我的 Linode 分片上还有另一个 git\
    \ 仓库用于托管书籍 - 偶尔从 GitHub 拉取并结合直接将 HTML 文件交付到 Web 服务器（我使用 Nginx - 如果你发现 Apache 内存占用过多，可以试试）静态文件文件夹的构建，即可“发布”书籍！\n\
    \n"
