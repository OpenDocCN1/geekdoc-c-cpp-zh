  md: '# An Introduction to Python and LaTeX, Release 0.01


    # 16.2.2 Vertical lines


    It should be easy to guess how vertical lines are drawn! Here is an example:


    ```

    \put(30,90) \line(0,1) {40})

    ```


    This draws a vertical line connecting (30, 90) and (30, 91) of length 40 units
    ending at (30, 130). The general command is:


    ```

    \put(x,y) {\line(0, A){len} }

    ```


    Where (x, y) is the starting co-ordinate of the line. A is +1 or -1 depending
    on whether the line goes up or down and len is the length of the line.


    # 16.2.3 Slanted lines (neither vertical nor horizontal)


    What kind of line draw LaTeX if we write:


    ```

    \put(30,90) \line(1,-1) {40})

    ```


    LaTeX draws a line going through (30, 90) and (31, 89) (ie, sloping down to the
    right); what is the length of this line? That not specified here - the number
    40 written in curly brackets simply indicates the fact that as the line moves
    down to the right, it will end at that point where the X co-ordinate is 30+40.


    If we write:


    ```

    \put(40,90) \line(-1,1) {30})

    ```


    We get a line starting at (40, 90), going through (39, 91) (going up to the left)
    and ending at a point whose X co-ordinate is 40-30, ie 10.


    The general form for a slanted line is:


    ```

    \put(x,y) \line(p,q) {len})

    ```


    LaTeX has certain restrictions on the values of p and q - this places a limit
    on the slopes of the lines we can draw. Both p and q should be integers between
    -6 and +6, Also, they should have no common divisor bigger than one. That p/q
    is a fraction in its simplest form - you can''t have something like p=2 and q=4;
    you should write p=1 and q=2. The following are all illegal values for p and q:


    +   (1,2, 3) --- no decimal permitted

    (3, 6) --- common divisor 3 bigger than 1

    (1, 7) --- one value bigger than +'
