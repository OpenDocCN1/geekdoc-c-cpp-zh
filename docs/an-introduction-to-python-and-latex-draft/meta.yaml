    \ (3, 2)\n\\psaxes(0,0) (-3,-2) (3, 2)\n\\psplot[plotstyle=curve] (-1.5) {1.5}\
    \ (x exp x)\n\\end{ppicture}\n\n\\end{document}\n```\n\nTwo packages have to be\
    \ included: pstricks and pst-plot. Also, \"pdflatex\" will not work with the above\
    \ file - you have to use the \"latex\" command itself.\n\nThe line:\n\n```\n\\\
