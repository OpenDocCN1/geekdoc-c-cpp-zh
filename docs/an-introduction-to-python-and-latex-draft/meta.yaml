    draws a disc (a filled circle) at (20,30) with a diameter of 20 points.


    LaTeX knows to draw discs/circles with only a certain fixed number of diameters
    - it will choose the one whose diameter is closest to what you have specified.
    Also, the set of possible diameters has an upper limit.


    The command:


