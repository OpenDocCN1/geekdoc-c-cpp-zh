    # 8.2 A loop which terminates


    Here is a loop which does something a bit more interesting than printing hello
    and world.


    ```

    >>> i = 0

    >>> while (i < 5):

    ...    print i

    ...    i = i + 1

    ...

    ```


    The condition is initially true - i has the value 0 and zero is less than 5. So
    the body gets executed. The print statement displays the value of i on the screen.
    The next statement is:


    ```

    i = i + 1

    ```


    You should read this as: i assigned to i plus 1. The logic is:


    New value of i is old value of i plus one.


    So, the value of i becomes 1. Python once again checks the condition - it''s true
    (because 1 is less than 5). So the body gets executed. The value of i is printed(this
    time, the value is 1). The next statement(i = i + 1) changes the value of i to
    2. The condition gets checked once. Again, it is true (2 is less than 5). So the
    body gets executed once. The print statement displays 2 on the screen (value of
    i is now 2) and the value of i gets to 3 in the next statement. This process repeats
    until the value of i becomes 5. At this point, the condition becomes false and
    the loop terminates. Here is what you will see on the screen:


    ```

    0

    1

    2

    3

    4

    ```


