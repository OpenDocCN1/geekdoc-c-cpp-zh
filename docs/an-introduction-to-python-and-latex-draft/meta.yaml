    ....global balance

    ....balance = balance - amount

    .......

    >>>

    ```


    We first create a variable *balance* initialized with the value 1000 (say we have
    1000 Rupees initially). Then we define two simple functions *deposit* and *withdraw*.
    The interesting things about these functions are:


