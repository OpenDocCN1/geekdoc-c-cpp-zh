    If we repeat this process, we get:\n\n```\nA = 18, B = 6\nA = 12, B = 6\nA = 6,\
    \ B = 6\n```\n\nFinally, both A and B become equal (both have value 6). The HCF\
    \ of 18 and 42 is 6.\n\nYou can try out this procedure on different pairs of numbers\
