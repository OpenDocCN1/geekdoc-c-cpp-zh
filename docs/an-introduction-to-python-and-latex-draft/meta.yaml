    编程语言，并学习如何使用 LaTeX 准备技术文档。大多数学生的计算机背景仅限于使用 Microsoft Windows 处理如网页浏览等简单任务。《Python
    与 LaTeX 简介》这本书的目标是为这类学生提供一个通用的计算机入门介绍。


    由于大多数读者是数学老师或数学专业的本科生，示例程序围绕简单的数学概念构建的。本书并未尝试深入探讨语言语法——根据我为教师举办研讨会的经验，任何尝试引入无法通过简单数学示例立即演示其应用的语法元素通常会导致困惑。因此，对于那些希望深入掌握
    Python 语法和惯用法的人来说，本书将不是一个理想的资源。网上有许多优秀的资源，其中最好的之一是《Dive into Python》（可在 http://www.diveintopython.org
    获取）。


    本书正在持续更新——最新版本已发布在互联网上，地址为：http://radiantbytes.com/books/python-latex。如果您想联系作者或讨论教授该科目时遇到的问题，请访问该网站。


    # 第一章


    # # GNU/LINUX 操作系统简介


    本书教授如何使用 Python 进行编程以及如何使用 LaTeX 准备技术文档。LaTeX 和 Python 都是自由软件，学习它们的理想方式是使用 GNU/Linux
    系统。


    ## 1.1 安装 GNU/Linux


    一个完整的 GNU/Linux 系统由成千上万个应用程序组成，可以在网上下载。通过逐个下载并安装每个组件来设置系统是一项艰巨的工作——因此我们有了所谓的 Linux
    发行版，它们仅仅是封装了设置全功能系统所需的所有工具的 CD/DVD。有多个 GNU/Linux 发行版——Fedora、Ubuntu 和 Debian 是其中较流行的几个。它们本质上的区别在于提供的软件组合不同——大多数人会建议初学者从
    Ubuntu 开始。


    可以从网上下载完整的 Ubuntu 发行版：http://www.ubuntu.com。下载的软件应该写入 CD 中——这张 CD 可用于将 Ubuntu
    安装到硬盘上。安装过程通常非常简单，对于计算机使用有中等经验的人来说，即使是第一次使用 GNU/Linux，也能够在不遇到太大麻烦的情况下完成。我们不会在书中介绍系统安装的细节——假设你手头已经有一个可用的
    GNU/Linux 系统。


    ## 1.2 使用 GNU/Linux


    下面显示的是 Fedora GNU/Linux 桌面的截图。


    ![](img/d7a432a3c25137f7a1b47cdb96ad5de3_8_0.png)


    你会发现像应用程序（Applications）、位置（Places）、系统（System）等菜单。菜单的布局和桌面外观在其他 GNU/Linux 发行版上会有不同。但这不应该太困扰你。只需要一点实验就能让它运行起来！


    是一些用于文档编辑、浏览网页等任务的常用 GNU/Linux 应用程序：


    - Firefox - GNU/Linux 系统上的标准网页浏览器

    - OpenOffice - 你可以使用此程序进行文字处理、电子表格计算。

    - GIMP - 一个强大的图像处理程序。如果你是一名图形艺术家，你会喜欢它的。


    ## 1.3 GNU/Linux 命令行


    基于鼠标的图形用户界面（GUI）非常适合初学者。但一旦你开始编写程序，你就必须通过输入命令来与操作系统交互。你需要打开一个终端来进行操作。在 Fedora
    系统上，可以在“应用程序”菜单的“系统工具”子菜单找到终端（它的名字就叫 Terminal）。该程序在其他发行版上的位置可能不同——所以你必须实验一下！这里是激活了终端的
    Fedora 截图。


    # Python 与 LaTeX 简介，版本 0.01


    ![](img/d7a432a3c25137f7a1b47cdb96ad5de3_9_0.png)


    你可以在终端内输入命令并它们会被执行。例如，你想查看当前日期——执行此操作的命令简单的 `date`。如果你输入 `date`（然后按 **Enter**
    键），你可能会看到的内容：


    ```

    [ram@knuth ~]$ date

    Wed Nov 11 12:28:19 IST 2009

    ram@knuth ~]$

    ```


    上面显示的消息被称为提示符（prompt）。那三个大于号构成了所谓的 Python 提示符。当 Python 显示提示符时，你就知道它准备好接受命令了！


    **注意：** 作为提示符一部分显示的实际消息在你的机器上会有所不同。不需要担心它！只需记住你总是在提示符*之后*输入命令。


    4 第 1 章. GNU/Linux 操作系统简介


    # Python 学习之旅


    Python 编程语言是由荷兰计算机科学家 Guido·罗苏姆（Guido Rossum）创建的。与 C/C++/Java 等语言不同，Python 对初学者非常友好——像
    MIT（麻省理工学院）这样的著名大学使用它来教授入门课程。


    ## 2.1 第一步——将 Python 当作计算器！


    在上一章中，你已经了如何通过输入命令与 GNU/Linux 操作系统交互。你只需输入命令 `python` 即可运行 Python。你的屏幕看起来这样：


    ```

    [ram@knuth ~]$ python

    Python 2.6 (r26:66714, Mar 17 2009, 11:44:21)

    [GCC 4.4.0 20903 (0.26]) on linux2

    Type "help", "copyright", "credits" or "license" for more information.

    >>>

    ```


    如果下面显示的细节与你在计算机上看到的完全一致，请不要担心。输出最后一行与你看到的完全匹配即可。三个大于号构成了所谓的 Python 提示符。当 Python
    显示提示符时，你就知道它准备好接受命令了！输入 1 +2，按下 Enter 键看看会发生什么：


    ```

    >>> 1 + 2

    3

    >>>

    ```


    **注意：** 在上面的示例中，你不应该输入三个大于号——它是 Python 自动显示的。


    **注意：** 如果 Python 向你显示某些错误（而不是打印 3），请阅读本章最后标题为“Python 中空格字符的使用”的章节。


