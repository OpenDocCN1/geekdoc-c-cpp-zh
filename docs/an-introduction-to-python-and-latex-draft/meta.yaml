    # 16.3 Circles, ovals and bezier curves


    Note: We are assuming that the picture environment has width 100 units and height
    200 units in all the examples below.


    Here is how you draw a circle:


    ```

    \put(20,30) {circle{20}}

    ```


    This draws a circle at center (20,30) with diameter 20 points.


    The command:


    ```

    \put(20,30) {\circle*{20}}

    ```


    draws a disc (a filled circle) at (20,30) with a diameter of 20 points.


    LaTeX knows to draw discs/circles with only a certain fixed number of diameters
    - it will choose the one whose diameter is closest to what you have specified.
    Also, the set of possible diameters has an upper limit.


    The command:


    ```

    \put(30,30) {\oval(20,10)}

    ```


    will draw an oval (a rectangle with rounded corners) of width 20 units and height
    10 units.


    The qbezier command takes three points as arguments and draws a quadratic bezier
    curve connect-


    ```

    \qbezier (0,0) (50,100) (100,0)

    ```


