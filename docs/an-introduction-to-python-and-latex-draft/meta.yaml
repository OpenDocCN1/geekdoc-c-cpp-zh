    You can see two new keywords here: try and except. Python first attempts to execute
    statements between the try and the except (note that these statements are indented).
    If there is no zero division error, the except block (the indented set of statements
    after the line "ZeroDivisionError:") is skipped and the remaining part of the
    function (which is only a single return statement) gets executed. If there is
    an error, the statements in the try block (statements between try and except block
    constitute the try block) are skipped and control gets transferred to statements
    in the except block. Once all the statements in the except block are executed,
    the remaining part of the function gets executed.


    An informal description of this behaviour might be:


    Try the following statements. Stop if there is an error and skip to the matching
    *except block*. If there is no error, complete the statements (between *try* and
    *except*) and skip the *except block*.


    What we have achieved here? We now have a choice to decide what should be done
    in case of an error. This is a basic requirement when writing life code.


