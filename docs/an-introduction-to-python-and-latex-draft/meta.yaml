  md: '# An Introduction to Python and LaTeX, Release 0.01


    The BSc Informatics course conducted by University of Calicut is based completely
    on Free Softare. Students are required to study the Python programming language
    and also learn how to prepare technical documents using LaTeX. Majority of the
    students have a computing background limited to using Microsoft Windows for simple
    tasks like web browsing. An introduction to Python and LaTeX has the objective
    of providing a general introduction to computing to such an.


    Because most of the readers would be either Mathematics teachers or undergraduate
    Math students, sample programs are structured around simple mathematical concepts.
    No attempt has been made to go deep into language syntax - my experience with
    conducting workshops for teachers has been that any attempt to introduce syntax
    elements whose application can''t be demonstrated immediately through simple math
    examples usually leads to confusion. So, this book will not be an ideal resource
    for people who wish to master Python syntax and idioms in depth. There are plenty
    of great resources on the net for that, one of the best being Dive into Python
    (available at http://www.diveintopython.org).


    This book is being updated continuously - the most recent version is openly available
    on the Internet at address: http://radiantbytes.com/books/python-latex. Please
    visit this web site if you wish to contact the author or discuss problems encountered
    while teaching the subject.'
  merge: -1
  pgno: 6
