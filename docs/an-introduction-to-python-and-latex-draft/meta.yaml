    \ the highest common factor (also called the greatest common divisor) of two numbers.\
    \ The algorithm was invented by Euclid; it's therefore called Euclid's algorithm.\n\
    \nHere is how the algorithm works. Say wish to find out the HCF of two numbers\
    \ A and B. Simply repeat the following steps until both become equal:\n\n+   -\
    \ If A is greater than B, change A to A-B and do not modify B\n- If B is greater\
    \ than A, change B to B-A and do not modify A\n\nThe value of the A (and B) when\
    \ both become equal will be the Highest Common Factor!\n\nLet's try this with\
    \ two numbers, A=18 and B=42.\n\nB is greater than A, so B becomes 24 and A remains\
    \ as 18. So, we have:\n\n```\nA = 18, B = 24\n```\n\nIf we repeat this process,\
    \ we get:\n\n```\nA = 18, B = 6\nA = 12, B = 6\nA = 6, B = 6\n```\n\nFinally,\
    \ both A and B become equal (both have value 6). The HCF of 18 and 42 is 6.\n\n\
    You can try out this procedure on different pairs of numbers and verify that it\
    \ works perfectly!\n\nEven better, you can write a loop in Python to discover\
    \ the HCF:\n\n```\n>>> a = 18\n>>> b = 42\n>>> while (a > b):\n    if (a > b):\n\
    \        ...\n        a = a - b\n    ...\n    else:\n        ...\n        b =\
    \ b - a\n    ...\n    ...\n>>> a\n6\n>>> b\n6\n>>>\n```"
