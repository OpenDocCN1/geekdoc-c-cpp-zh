    # 14.2 What does LaTeX really do?


    If you look at the PDF document produced by LaTeX, you will see that it does not
    contain any of the linesdocumentclass, \title etc. Instead, what you see is neatly
    formatted output. The title has a bigger font size and is centered. The left and
    right ends of all the lines are perfectly aligned; the word “continued” has been
    split to make the alignment perfect. Usually, when we prepare documents using
    MS-Word or OpenOffice, we spend a lot of time doing these things manually - the
    problem with the approach is that as the document gets larger in size, we will
    be spending more and more time on this than concentrating on our writing. It’s
    here that LaTeX comes to our rescue. All the details in getting beautiful printed
    output is handled by LaTeX - simply have to finish our writing! This does not
    mean we can simply type an article and expect LaTeX to format it properly. For
    example, how does LaTeX know what the title of the article is?


    Simple. When you write a line:


    ```

    \title(Srinasa Ramanujan)

    ```


    you are telling LaTeX that “Srinasa Ramanujan” is the title of the article. This
    does not result in the title being actually displayed - LaTeX simply notes the
    fact that the title is “Srinasa Ramanujan”. It is displayed when you use type:


    ```

    \maketitle

    ```'
