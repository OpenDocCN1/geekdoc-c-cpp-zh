    manner; you will divide your essay into sections, sub-sections and paragraphs.
    You will make sure that ideas flow logically from one section to the next. If
    you are trying to explain something very complex, you will first introduce your
    audience to simpler (but related) ideas and then to build up the more complex
    idea on the basis of the simpler ones.


    Writing a program is similar to composing an essay. Ultimately, your program has
