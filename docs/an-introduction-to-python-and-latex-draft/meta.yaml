    ```

    \documentclass {article}

    \begin{document}

    Here is a formula: $E = mc^{2}$\nSame formula, but this is typeset differently:
    \[ E = mc^{2} \]

    Same formula again, different typesetting:

    \begin{equation}

    E = mc^{2}

    \end{equation}

    Repeat:

    \begin{equation}

    E = mc^{2}

    \end{equation}

    \end{document}

    ```


