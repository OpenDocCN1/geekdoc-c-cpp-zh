    ```


    Note that "pdlatex" supports only JPG and PNG formats. The file “ramanujan.jpg”
    should exist in the folder(directory) from where you are issuing the "pdlatex"
    command.


    If you are using the "latex" command, you will have to convert your JPG/PNG image
    to what called an encapsulated postscript file. This can be done very easily on
    GNU/Linux systems by using a command called "convert". At the prompt, you should
    type:


    ```

    convert ramanujan.jpg ramanujan.eps

    ```


    Once this is, you can use:


    ```

    \includegraphics{ramanujan.eps}

    ```


    to include the image in your document.


