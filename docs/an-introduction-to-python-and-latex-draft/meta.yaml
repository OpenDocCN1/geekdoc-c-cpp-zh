    # HOW TO BUILD THE BOOK FROM

    SOURCE


    This book is written using an excellent tool called Sphinx. Sphinx allows you
    to write in simple restructured text format - the conversion to HTML (for display
    in a browser) as well as LaTeX (for printing) is done by Sphinx. You are reading
    the Sphinx generated book right now! Source files are available from GitHub.


    A little bit about my book-writing work flow. I maintain a git repo on my home
    machine where I occasionally push to GitHub. I have another git repository on
    my Linode slice which hosts the book - occasional pulls from github combined with
    a build which directly delivers HTML files to the web server''s (I use Nginx -
    do try it if you find Apache to be a memory hog) static files folder is all that
    is needed to “publish” the book!'
