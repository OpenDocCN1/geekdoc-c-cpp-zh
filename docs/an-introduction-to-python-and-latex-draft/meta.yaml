    ```


    The function:


    ```

    linspace(x, y, N)

    ```


    generates N spaced numbers starting from x and ending in y; the difference between
    adjacent numbers is fixed. In the above case, x is 0, y is 6.28 and N is 4. The
    output linspace generates a Numeric Array:


    ```

    array([ 0., 2.0943951 , 4.1887902 , 6.28318531])

    ```


    You observe that the difference between consecutive numbers is fixed, approximately
    equal to 2.09. When you apply the sin function on a, it computes sin of all the
    numbers in the numeric sequence.


