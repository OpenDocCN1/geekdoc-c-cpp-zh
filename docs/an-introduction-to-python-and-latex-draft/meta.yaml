    \nThe next command:\n\n```\n\\psaxes(0,0) (-3,-2) (3, 2)\n```\n\ndraws the coordinate\
    \ axes. The X axis and Y axis meet at the point (0,0) and they have to be visualized\
    \ as enclosed in an imaginary rectangular box with bottom left corner at (-3,-2)\
    \ and top right corner at (3, 2).\n\nWe are plotting the curve:\n\n```\ny = (x\
    \ * x * x) - x\n```\n\nThis equation has to be specified in a peculiar form postfix.\
    \ An arithmetic expression written in the usual way:\n\n2 * 3 + 4\n\nis called\
    \ an *infix expression*. Here is another way to write the same expression:\n\n\
    2 * 3 * 4 +\n\nThis is called a *postfix expression*. The logic is simple. Read\
