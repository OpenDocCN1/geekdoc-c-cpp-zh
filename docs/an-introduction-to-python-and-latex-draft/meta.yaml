    use it to teach introductory programming courses. It is also a modern, powerful
    general purpose programming language used by companies and research institutions
    all over the world to solve complex computing problems.


    # 2.1 First steps - use Python as a calculator!


    In the previous chapter, you had seen how to interact with the GNU/Linux Operating
