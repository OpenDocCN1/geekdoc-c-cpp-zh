    SEVENTEEN


    # APPENDIX 1 - WRITING STAND-ALONE

    PYTHON PROGRAMS


    Till now, we were using the interactive Python prompt to write short programs.
    The disadvantage with this method is obvious - all the code that you write is
    lost when you exit Python. In this chapter, we shall see how to store Python programs
    permanently in text files.


    # 17.1 Using an editor in GNU/Linux


    An editor is a program which helps to create text files which can be saved permanently
    in the computer''s hard disk. The GNU/Linux operating system comes with many editors;
    two of the most frequently used are vi and emacs. Both of them are a bit difficult
    to use for absolute beginners. A better choice might be a program called gedit.
    You can run gedit by simply typing gedit at the operating system command line
    (refer chapter 1 for a discussion about the command line).


    gedit is easy to use. You can type whatever you want; once you are finished with
    typing, it''s time to save the data you have typed. For this, choose the Save
    option from the File menu; gedit will display a name to the file in which you
    wish to save the typed data. Choose the Quit option from the File menu to exit
    gedit.


    # 17.2 Writing a Python program using gedit


    Run gedit and save the following line into a file called hello.py:


    ```

    print "Hello"

    ```


    Quit gedit and type the following at the Operating System commandline:


    ```

    python hello.py

    ```'
