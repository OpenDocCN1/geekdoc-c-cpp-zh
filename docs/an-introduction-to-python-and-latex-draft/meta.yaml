    \ 8.5。这成为了 `guess` 的新值。`while` 循环的条件检查再次执行；函数 `good_enough` 被带参数 8.5 和 16 调用并返回\
    \ `False`。`not` 运算符返回 `True`，因此循环体再次执行一次。这个过程只有在 `good_enough` 返回 `True` 时才会停止（在这种情况下条件变为\
    \ `False`，因为 `not True` 是 `False`）。如果：\n\n```python\ngood_enough(guess, x)\n```\n\
    \n为 `True`，这意味着 `guess` 可能被视为 `x` 的平方根。当循环终止时，下一语句：\n\n```python\nreturn guess\n\
    ```\n\n将 `guess` 的值作为函数 `square_root(1, 16)` 的返回值返回。\n\n`square_root` 函数唯一的问题是我们必须用两个参数调用它，第一个是“猜测”的初始值。更自然的方法是让平方根函数只接受一个参数——即需要平方根的数字。我们可以通过定义一个额外的函数来轻松管理这一点：\n\
    \n```python\n>>> def my_sqrt(x):\n    r = square_root(1, x)\n    return r\n>>>\n\
    ```\n\n## 9.4 结论\n\n我们在其他更简单的函数的基础上开发了平方根函数。我们写的每个函数都执行一次简单的计算，并且易于阅读和理解。最终的 `square_root`\
    \ 函数非常简单（所有的困难工作都由其他函数完成）。寻找平方根绝对不是什么大事，现实生活中的程序比这个玩具示例要复杂得多。但我们采用的方法扩展性很好——大多数程序都是这样编写的，作为简单函数的集合。\n\
    \n# 字符串、元组和关联数组\n\n## 10.1 什么是字符串？\n\n假设你正在编写一个处理你学校/学院学生信息的程序。你可以在 Python 程序中将学生表示为一个简单的列表，包含姓名、年龄、分数等属性：\n\
    \n```python\n>>> a = Rahul\nTraceback (most recent call last):\nFile \"stdin>\"\
    , line 1, in <module>\nNameError: name 'Rahul' is not defined\n```\n\nPython 向你显示了一个错误！原因是\
    \ Python 将 `Rahul` 视为变量；而我们没有定义它。我们想做的是告诉 Python 不要将 `Rahul` 视为变量，而是视为简单的字符序列——可以通过将名字放在单引号（或双引号）内来实现。这样的序列在编程语言中被称为字符串：\n\
    \n```python\n>>> a = [\"Rahul\", 18, 90]\n>>>\n```\n\n### 10.1.1 基础字符串处理\n\n在\
    \ Python 提示符下尝试以下操作序列：\n\n```python\n>>> a = \"hello\"\n>>> b = \"world\"\n>>>\
    \ a + b\n'helloworld'\n>>> a[0]\n'h'\n>>> a[4]\n'e'\n>>> a * 3\n'hellohellohello'\n\
    >>> len(a)\n5\n```\n\n## 10.2 什么是元组？\n\n元组看起来和列表相似但有一些本质的区别：\n\n```python\n>>>\
    \ a = (1, 2, 3)\n>>> a[0]\n1\n>>> a[0] = 4\nTraceback (most recent call last):\n\
    File \"<stdin>\", line 1, in <module>\nTypeError: 'tuple' object does not support\
    \ item assignment\n>>> a.append(4)\nTraceback (most recent call last):\nFile \"\
    <stdin>\", line 1, in <module>\nAttributeError: 'tuple' object has no attribute\
    \ 'append'\n```\n\n元组是位于 `()` 中的值；与列表的区别在于它不可修改。\n\n## 10.3 什么是关联数组？\n\n假设你想在\
    \ Python 中表示一个电话簿：\n\n```python\n>>> d = {'Rahul': 16, 'Roy': 19, 'Vimal': 14}\n\
    >>> d['Rahul']\n16\n>>>\n```\n\n关联数组（也称为字典）通过 `{}` 中的键值对创建。在每个键值对中，键是字符串。例如：\n\
    \n```python\n>>> d['X']\nTraceback (most recent call last):\nFile \"<stdin>\"\
    , line 1, in <module>\nKeyError: 'X'\n```\n\n## 10.4 处理列表/元组的循环\n\n检查列表/元组中的每个元素并根据该值执行某些操作是一个常见问题。例如，假设你有一个列表\
    \ `[10, 11, 14, 13, 17, 24, 78]` 并编写代码来选择奇数（11、13 和 17）：\n\n```python\n>>> a =\
    \ [10, 11, 14, 13, 17, 24, 78]\n>>> n = len(a)\n>>> i = 0\n>>> while (i < n):\n\
    \    ... if(a[i] % 2 == 1):\n    ...     print a[i]\n    ... i = i + 1\n>>>\n\
    ```\n\n这里是使用 `for` 循环编写的该代码更短、更清晰的版本：\n\n```python\n>>> a = [10, 11, 14, 13, 17,\
    \ 24, 78]\n>>> for k in a:\n    ... if ((k % 2) == 1):\n    ...     print k\n\
    >>>\n```\n\n`for` 循环的通用形式是：\n\n```python\nfor variable_name in sequence:\n   \
    \ body\n```\n\n在上述情况下中，*variable_name* 是 *k*，*sequence* 是列表 *a*；*for* 循环的主体是一个\
    \ *if* 语句。\n\n"
