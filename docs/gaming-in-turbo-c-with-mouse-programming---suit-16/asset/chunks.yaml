  trans: "\n\n![](img/cover.jpeg)\n\n# 在 Turbo C++ 中进行鼠标编程游戏 - Suit 16\n\n### 作者：PRASENJIT\
    \ DAS\n\n## 游戏介绍\n\n“Suit 16”游戏由 52 张牌中的 16 张花牌组成。游戏的目标是在最多 10 步内收集齐 4 张同花色的花牌。52\
    \ 张牌共有四种花色，分别是黑桃、梅花、红心和方片。每个花色有 13 张牌，其中 9 张显示 1 到 9 的数字，其余 4 张是花牌，即“Ace（A）”、“Joker（J）”、“Queen（Q）”和“King（K）”。因此，四种花色共有\
    \ 16 张花牌被用在这个游戏中。\n\n## 游戏执行\n\n游戏从欢迎界面开始，显示游戏名称和 16 张花牌。欢迎界面所示：\n\n![](img/00001.jpeg)\n\
    \n欢迎界面之后是游戏的主界面。从这里开始，鼠标点击作为输入操作。游戏的主界面所示：\n\n![](img/00002.jpeg)\n\n主界面由 4 个主要按钮组成分别是：“Play\
    \ Game（开始游戏）”、“Instructions（说明）”、“About Game（关于游戏）”和“Exit（退出）”。用户点击“Exit”按钮退出游戏。点击“About\
    \ Game”按钮会显示关于游戏的信息，所示：\n\n![](img/00003.jpeg)\n\n点击“Instructions”按钮会显示游戏玩法说明，所示：\n\
    \n![](img/00004.jpeg)\n\n点击“Play Game”按钮后，游戏从加载界面开始。游戏加载界面所示：\n\n![](img/00005.jpeg)\n\
