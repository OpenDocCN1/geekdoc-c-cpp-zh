  md: '# Lists


    A list is another type of container. They are very similar to tuples except that
    they can be altered. Think of tuples as quick, memory-efficient lists that cannot
    be altered by other code. We cannot insert or delete items in tuples with our
    programs. There are, however, functions to allow us to insert or delete items
    in lists. Lists are written like this:


    ```

    my_list = ["one", "two", "three", "four"]

    ```


    Just as with tuples, each value in the list has an index starting from 0 and each
    value is separated by a comma.


    Look at how this works in interactive mode:


    ```

    >>> my_list = ["one", "two", "three", "four"]

    >>> my_list [2]

    ''three''

    >>> my_tuple = ("one", "two", "three", "four")

    >>> my_tuple [2]

    ''three''

    >>>

    ```


    > Hmm, the list is surrounded by square brackets this time.


    > Do you remember that interactive mode in Python means using the Python shell
    rather than saving and running a file? It is very useful for running little experiments.


    You can see that both a list and a tuple provide the same output. So, when would
    we use a list instead of a tuple? We would choose a list rather than a tuple if
    we want our program to add, remove or change an item within the list.


    ![](img/6b7e856a8941483d0527bf7e3bced0ba_15_0.png)


    ![](img/6b7e856a8941483d0527bf7e3bced0ba_15_1.png)'
