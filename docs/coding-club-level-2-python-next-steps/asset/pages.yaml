- img_proc: true
  md: '# Analysis of Code Box 2.8


    entry.get() applies the get() function to the entry widget. This collects whatever
    has been typed in to this text entry box and assigns it to the entered_text variable.


    Next we clear the text box called output with this widget''s delete() method.
    This takes two arguments. The 0.0 says start deleting from line 0 (i.e. before
    line 1) and before character 0 (i.e. the beginning). END is a constant that always
    refers to the last character in the text box. We could also have replaced END
    with line.character index but END is easier.


    # Delving Deeper


    > Did you know that the glossary contains all the key from this book and Python
    Basics?


    The indexes referred to in the delete() method work like coordinates but actually
    indicate where the cursor goes when selecting text. The rows or lines count from
    0, before the first line, then 1 is the first line, 2 is the next etc. The character
    index (or column index) counts from 0, before the first character, then 1 after
    it, 2 next etc. Don''t forget a space is a character.


    For example, my_string = "text[widget box" the cursor is at index position (1.4).


    The next line of code finds the definition in the dictionary using the entered
    text as the key. Finally, this is added to the text box widget called output using
    the widget''s insert () method. This takes two arguments:


    +   1 where to start the insertion: (END) i.e. the beginning (we have just cleared
    output)

    2 what to insert: the definition found in the dictionary in the previous line.


    ![](img/6b7e856a8941483d0527bf7e3bced0ba_32_0.png)'
