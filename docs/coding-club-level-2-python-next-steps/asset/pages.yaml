  md: '# Introduction


    # Who is this book for?


    This book is the Level 2 core book in the Coding Club series of books. To get
    the most out of this title, you should be familiar with the Python 3 programming
    language and know about variables, while loops and if, elif and else statements.
    Therefore, we advise that you first read Python Basics before reading this book.
    Python: Next steps is aimed at 12–13 year olds but is accessible to older children
    and even adults who want to learn about computer programming.


    # Why should you choose this book?


    This book explains important principles while helping you build useful short projects.
    We want you, the reader, to learn not only how to make the programs in this book
    but also how to design your own. We want you to be able to write programs well,
    so that if you take it further and become the inventor of the next Google you
    will not have to unlearn bad programming habits.


    ![](img/6b7e856a8941483d0527bf7e3bced0ba_5_0.png)'
  merge: -1
  pgno: 5
- img_proc: true
  md: '# What you need?


    Any computer can run Python 3. If your computer does not already have Python 3
    installed there is a section on the companion website (www.codingclub.co.uk) that
    guides you through the installation. This takes about five minutes! That is all
    you need to get started.


    Start files for all the projects in the book are available to download from the
    companion website so you do not get lost in the bigger projects. There are also
    finished files for each project, should you get stuck, and answers to the puzzles
    and challenges.


    # How to use this book


    You should read this book carefully and build all the main projects in order.
    At the end of each chapter there are further ideas, and challenges that you can
    think of as ''mini quests''. Some readers want to work through them all so that
    they understand everything the time. Some of you will probably prefer to rush
    through and get to the end. Which approach is best? The one you are most comfortable
    with is the best approach for you. If you are being guided by a teacher, you should
    trust their judgement so that you can get the most out of them as possible.


    There are four ways in which this book tries to help you to learn:


    +   - Typing in the code – this is important as it gets you to work through the
    code line at a time (like computers do) and will help you remember the details
    in the future.

    - Finding and fixing errors – error messages in Python give you some clues as
    to what has gone wrong. Solving these problems yourself will help you to be a
    better programmer. However, if you get stuck, the code can be downloaded from
    the companion website (www.codingclub.co.uk).'
  merge: -1
  pgno: 6
- img_proc: true
  md: '+   3 Experimenting – feel free to experiment with the code you write. See
    what else you can make it do. If you try all the challenges, puzzles and ideas,
    and generally play with the code, this will help you learn how to write code like
    a professional.


    +   4 Finally, this book will not only provide the code to build some pretty cool,
    short projects - it will also teach you how the programs were designed. You can
    then use the same methods to design your own applications.


    # A word of warning


    You may be tempted to simply get the code off the website instead of typing it
    out yourself. If you do this you will probably find that you cannot remember how
    to write code so easily later. In this book you will only be asked to type small
    chunks of code at a time – remember that this will help help you understand every
    detail of each of your programs.'
