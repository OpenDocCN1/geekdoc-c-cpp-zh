    # Dictionaries


    The last of our container data types is a dictionary. Dictionaries take a slightly
    different form. In dictionaries we supply our own indexes. Here, we call the index
    a key. Keys can be strings, integers, floats or even tuples. Here is an example:


    ```

    my_dictionary = {1:"cat", 2:"dog", 3:"horse", 4:"fish"}

    ```


    or


    ```

    my_dictionary = {"1":"cat", "2":"dog", "3":"horse", "4":"fish"}

    ```


    > Silly me, I was confused for a moment here as I had forgotten that strings always
    appear in speech marks and numbers not. So 1 is an integer but "1" is a number
    stored as a string!


    ![](img/6b7e856a8941483d0527bf7e3bced0ba_16_0.png)'
