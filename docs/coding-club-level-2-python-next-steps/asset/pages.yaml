    You might have noticed that dictionaries require a different structure within
    the brackets to assign keys to the values. They use a colon '':'' to separate
    the value from its key.


    # ## What''s with the brackets?


    When we create a new container, Python provides us with a quick way of defining
    which kind we require by our choice of brackets.


    +   - If you want a tuple – wrap it in round brackets.

    - If you want a list – use square brackets.

    - If it''s a dictionary you are after – use curly brackets.'
