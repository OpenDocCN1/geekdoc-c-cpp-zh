  md: "# Quick Quiz 6.2\n\nWhat is the coder's word for converting one data type into\
    \ another?\n1 casting\n2 throwing\n3 catching\n\nThe second line uses Python's\
    \ bin() function. This function returns a binary number as a string but precedes\
    \ it with 0b:\n\n```\n>>> bin(10)\n'0b1010'\n```\n\nTo display what we want, we\
    \ must strip off the first two characters. Because the returned value from the\
