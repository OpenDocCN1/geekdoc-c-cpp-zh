  md: "# Getting the function buttons organised\n\nTo keep our code as easy to read\
    \ and as flexible as possible, we are going to store the functions in a separate\
    \ file. You might remember from Python Basics that a file that contains functions\
    \ is called a **module**. You can remember what we do to make a module available\
    \ to your apps? We import it. First, we need to add the line of code that will\
    \ import this file, to the beginning of the program. We can then add lines of\
    \ code to the `click()` function that will go and get the functions we require.\n\
    \nIn the Chapter 5 folder in the source code from the companion website there\
    \ is a module called `calc_functions.py`. It has a skeleton structure that provides\
    \ functions that print out the name of the function buttons when they are pressed.\
    \ You can examine it in Code Box 5.5.\n\nPutting your functions in a separate\
    \ module is a good idea because the module can be used to store lots of functions.\
    \ You will never need to delete functions: they can be added or removed by making\
    \ a calculator as you wish. The functions will also be available to other applications\
    \ if you need them in the future.\n\n# Code Box 5.5\n\n```\n# function module\
    \ for calculator application in Python: Next Steps\n\n# Factorial function:\n\
    def factorial(n):\n    return \"factorial (!)\"\n\n# Convert to roman numerals\
    \ function:\ndef to_roman(n):\n    return \"-> roman\"\n\n# Convert base 10 numbers\
