- img_proc: true
  md: '# Function Strings Tuples Lists Dictionaries


    | | Strings | Tuples | Lists | Dictionaries |

    | --- | --- | --- | --- | --- |

    | print all | >>> print (s) bar | >>> print (t) (''b'', ''a'', ''r'') | >>> print
    (1) [''b'', ''a'', ''r''] | >>> print (d) {1: ''b'', 2: ''a'', 3: ''r''} |

    | print element | >>> print (s [2]) r | >>> print (t [2]) r | >>> print (1 [2])
    | >>> print (d[2]) a |

    | combine | >>> a=s+"f" a ''barf'' | >>> a=t+"f", a (''b'', ''a'', ''r'', ''f'')
    | >>> a=1+"f" a (''b'', ''a'', ''r'', ''f'') | |

    | add an element | Strings cannot be altered. | Tuples cannot be altered. | >>>
    1.append("f") 1 [''b'', ''a'', ''r'', ''f''] | |

    | sort | Strings cannot be altered. | Tuples cannot be altered. | >>> 1.sort()
    1 [''a'', ''b'', ''r''] | >>> sorted(d) [''1'', ''2'', ''3''] >>> sorted(d.values())
    |

    | delete an element | Strings cannot be altered. | Tuples cannot be altered. |
    >>> del [1] 1 [''b'', ''r''] | >>> del [1] i {2:''a'', 3:''r''} |

    | replace element | Strings cannot be altered. | Tuples cannot be altered. | >>>
    1[0]="c" 1 [''c'', ''a'', ''r''] | >>> d[1]="c" 1 >>> print(d) {1:''c'', 2:''a'',
    3:''r''} |

    | find | >>> i.find("b") 0 | >>> t.index("b") 0 | >>> 1.index("b") | |

    | get length | >>> len(s) 3 | >>> len(t) 3 | >>> len(1) 3 | >>> len(d) 3 |


    Table 1.1 Some useful functions.


    ```

    s = "bar" # a string

    t = ("b","a","r") # a tuple

    l = ["b", "a", "r"] # a list

    d = {1:"b", 2:"a", 3:"r"} # a dictionary

    ```


    > This table could be very helpful when i write my own applications!


