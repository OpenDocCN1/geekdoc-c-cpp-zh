  md: "# The final function\n\nAgain, Python already has a built-in function to cast\
    \ to an integer, int (). Normally we do not give it any other argument than a\
    \ number string. If we are giving it a binary string we need to supply an optional\
    \ argument which is the base. The default, if we do not supply it, is base 10\
    \ but we need to tell the int () function what we are doing if we supply a binary\
    \ number:\n\n```\n>>> int(\"100\", 2)\n4\n```\n\nNow copy the code from Code Box\
    \ 6.6 into calc_functions.py to finish your fully working programmable calculator.\n\
    \n```\nCode Box 6.6\n# Convert base 2 numbers to base 10 function:\ndef from_binary(n):\n\
