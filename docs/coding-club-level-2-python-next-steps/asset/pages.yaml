  md: '# Delving Deeper


    What''s the difference?


    Strings, tuples and lists are all indexed ordered containers; the values are automatically
    given an index based on the order in which they were input. Dictionaries have
    keys that you provide and the key-value pairs are not stored in a particular order.
    Strings and tuples have their content set at creation and cannot be changed by
    a program directly. Lists and dictionaries are containers in which the values
    can be added to and changed in a variety of ways.


    It is also possible to create empty containers like this:


    # Useful functions


    Table 1.1 provides a list of useful functions you can use on strings, tuples,
    lists and dictionaries. You can also find it in Appendix 1. The table assumes
    the following containers have been created:


    ```

    >>> s = "bar" # a string

    >>> t = ("b", "a", "r") # a tuple

    >>> l = ["b", "a", "r"] # a list

    >>> d = {1:"b", 2:"a", 3:"r"} # a dictionary

    ```'
  merge: -1
