    # # Some useful words


    **comparative operator** sometimes called logic operators, they allow us to compare
    data in a program; they include == and > (you can find others in Table 3 in the
    Appendix in Python Basics)


    **local variable** a variable that is defined inside a function and is only usable
    inside that function


    **mathematical operator** an operator that performs some mathematical function
    on some numbers, e.g. multiplication or addition


    **parameter** another word for argument when being used in a function


    **global variable** a variable that is usable anywhere in a program


    **hacking** taking some previously written code and rewriting bits to make it
    do something different


    **IDE** stands for Integrated Development Environment; IDLE is an example of one
    – they are special text editors with useful tools built in for programmers


    **IDLE** stands for Integrated Devopment Environment; this is the IDE that comes
    with a normal Python 3 install


    **infinite loop** a piece of code that keeps running forever; this is usually
    a bad thing


    **execute** another word for run – to execute some code is to run it'
