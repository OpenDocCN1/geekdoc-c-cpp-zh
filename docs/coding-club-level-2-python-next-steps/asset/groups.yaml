    \ see how to build a simple GUI. First we must see how tkinter arranges things\
    \ in the window we have created. The window is divided into as many columns and\
    \ rows as we require. Each row and column is numbered so that the cells can be\
    \ referenced by coordinates in the usual computer science way – (0,0) from the\
    \ top left:\n\n| (0,0) | (0,1) | (0,2) |\n| (1,0) | (1,1) | (1,2) |\n| (2,0) |\
    \ (2,1) | (2,2) |\n\nA tkinter grid.\n\nIn addition to assigning cell for our\
    \ widgets, we can determine where we put inside these cells by making them stick\
    \ to the north (top), south (bottom), west (left) or east (right) of the cells.\
    \ It is easier to see this in action. \n\n![](img/6b7e856a8941483d0527bf7e3bced0ba_26_0.png)\n\
