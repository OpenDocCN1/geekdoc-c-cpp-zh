    \ 3.333333333333333333)\n\n## Catching errors\n\nWe can solve the first problem\
    \ with a common coding technique we met first in Chapter 2: we catch errors and\
    \ handle them with helpful messages. In Python this is done by putting the function\
    \ that might not work after a `try:` clause. We then handle the error, if there\
    \ is one, after an `except:` clause.\n\nYou should now alter your click() method\
    \ so it looks like the code in Code Box 4.5.\n\n### Code Box 4.5\n\n```python#\
    \ key press function\ndef click(key):\n  # pressing equals key means calculate:\n\
    \  if key == \"=\":\n    try:\n      result = str(eval(display.get()))\n     \
    \ display.insert(END, \" = \" + result)\n    except:\n      display.insert(END,\
    \ \" --> Error!\")\n\n  # pressing C key means clear screen:\n  elif key == \"\
    C\":\n    display.delete(0, END)\n\n  # add other key-pressed values to end of\
    \ current entry:\n  else:\n    display.insert(END, key)\n```\n\n> It is very important\
