  - '[PAGE 54]


    The line that starts result does the maths and the next line of code adds an equals
    sign to the display and then the result of the calculation. This leaves us with
    one line of quite complicated code to explain – the one that does the maths.


    ```

    result = str(eval(display.get()))

    ```


    Basically, this line of code works out the answer of the contents of display and
    stores it in a variable which we name result.


    Did you know that changing one data type into another like this is called casting?


    ![](img/6b7e856a8941483d0527bf7e3bced0ba_54_0.png)


    Calculator with a calculation in the display.


    The way this works is by applying a series of functions at the same time. For
    example, the result of the eval() function is a float or integer data type. The
    Entry widget only accepts strings so we use the str() function to change the float
    into a string.


    Nesting function calls within other function calls like this saves typing but
    can be difficult to read. Here is another way of representing the same code in
    more than one line so that it is easier to understand:


    ```

    result = display.get() # store the contents of entry in a variable

    result = eval(result) # use the eval() function to do the calculation

    result = str(result) # cast result to a string.

    ```


    This takes a lot more typing though!'
