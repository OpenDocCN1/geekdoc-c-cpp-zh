    \ For loops go through the indented code as many times as required, so in this\
    \ case once for each button we need. That is, for each value of `btn_text`. The\
    \ variable `btn_text` is used to hold the values of the `num_pad_list`. So, on\
    \ the first time the loop, `btn_text` represents the string `'7'`. On the next\
    \ round `btn_text` will be `'8'`. Each time through the loop the column counter\
