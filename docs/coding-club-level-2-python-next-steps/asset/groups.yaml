    \n这里是一个制作咖啡的算法：\n\n- 拿一个杯子。\n- 在杯中加入 1 茶匙速溶咖啡。\n- 向水壶中加水。\n- 烧开水。\n- 将沸水加入杯中，直到距离顶部\
