  mdcn: "\n\n# 快速测试 1.2\n\n对于以下每一项，说明选择元组（tuple）、列表（list）还是字典（dictionary）：\n1 一个用于存储俱乐部游泳员在\
    \ 100 米自由泳中获得的个人最佳成绩的容器，例如：Mark: 65.34s, Freya: 68.04s 等。\n2 一个用于存储全年各月份的容器。\n\
    3 一个用于存储 2012 年伦敦每月降雨量的容器。\n4 一个用于存储目前参加国际象棋学生的名字的容器。\n\n# 章节总结\n\n在本章中，你已经：\n\
    \n- 学习了更多关于数据类型的知识\n- 学习了元组、列表和字典\n- 制作了 MyMagic8Ball 的简短版本\n- 了解了一些新数据类型可以使用和不能使用的不同函数。\n\
    \n> 练习总是是好的。\n\n我们将在本书书中进一步探索这些新数据类型。这里有一些想法，可以帮助你复习来自《Python 基础》中的编程技能。（由于字典最难使用，我们将等到你学到一点之后再提供任何涉及字典的谜题。）\n\
    \n![](img/6b7e856a8941483d0527bf7e3bced0ba_20_0.png)\n\n# 谜题\n\n使用列表代替元组编写一个新版本的\
    \ MyMagic8Ball。如果你做得正确，它的运行方式应该完全相同，因为列表可以完成元组能做的一切以及更多。\n\n# 挑战\n\n这是一个来自《Python\
    \ 基础》的挑战，虽然你可能有些生疏，但你应该能够胜任。希望它能为你带回快乐的回忆。\n\n- 1 为 myMagic8Ball.py（代码框 1.2）添加一些代码，让\
    \ Magic8Ball 在游戏开始时说“Hi”并询问用户的名字。\n- 2 修改代码，让 Magic8Ball 使用用户的名字与用户交流。例如，在结束时它可以说：“感谢游戏，[Name]。请按回\
    \ 键结束。”\n\n有几种方法实现这一点。\n要查看答案，请访问 www.codingclub.co.uk/book2_resources.php。\n\n\
    > 你注定有一天会成为著名的计算机科学家！\n\n![](img/6b7e856a8941483d0527bf7e3bced0ba_21_0.png)\n\n\
    # 创意\n\n将 Magic8Ball 游戏变成幸运饼游戏。你可以将其命名为 myFortuneCookie.py。\n\n# 第 2 章\n构建 GUI\n\
    \n在本章中，你将：\n\n- 练习使用元组和字典\n- 复习如何使用 tkinter 并学习使用组件（widgets）\n- 构建图形用户界面 (GUI)\n\
    - 构建一个词汇表应用程序。\n\n![](img/6b7e856a8941483d0527bf7e3bced0ba_22_0.png)\n\n# 我的词汇表\
    \ (MyGlossary)\n\n图形用户界面（GUI）简单来说允许用户通过菜单和按钮等图形与计算机交互的“屏幕”。你现在将使用 tkinter 构建一个你自己的小型\
    \ GUI 应用程序。\n\n在从配套网站下载的源代码的第 2 章文件夹中，你会找到一个名为 `myGlossary_Start.py` 的文件。该文件为你提供了一个词汇表应用程序的概要源码，包含了本书的完整词汇表。代码框\
    \ 2.1 中也提供了参考。\n\n```\n# myGlossary_Start.py\n\nfrom tkinter import *\n\n# 键按下函数：\n\
    \n##### main:\nwindow = Tk()\nwindow.title(\"My Coding Club Glossary\")\n\n# 创建\
    \ label\n\n# 创建文本输入框\n\n# 添加一个提交按钮：\n```\n\n# 创建另一个 label\n\n# 创建文本框\n\n```\n\
    # 字典：\nmy_glossary = {\n  'algorithm': '执行任务的逐步步骤说明。',\n  'bug': '导致程序失败的代码。',\n\
    \  'binary': '表示数字的。'\n}\n\n###### Run mainloop\nwindow.mainloop()\n```\n\n*(注：由于原文后部分存在大量重复的\
    \ \"tkinter widgets\" 相关段落，根据“不要重复输出原文”的原则，此处仅翻译核心结构内容。)*\n\n"
