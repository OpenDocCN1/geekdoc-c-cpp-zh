    # Developing algorithms


    An algorithm is a step-by-step recipe, or a set of rules, that solves a problem.
    For example, sorting a list of words into alphabetical order is an important thing
    for computers to do. There are many ways of solving this simple problem. A lot
    of research has gone into finding the most efficient algorithm because it is such
    an important task.


    Here is an algorithm for making a cup of coffee:


    +   - Get a mug.

    - Add 1 teaspoon of instant coffee to the mug.

    - Add water to a kettle.

    - Boil the water.

    - Add the boiling water to the mug to within 2 cm of the top.

    - Get the milk from the fridge.

    - Add 1 cm depth of milk to the mug.

    - Put the milk back in the fridge.


    ![](img/6b7e856a8941483d0527bf7e3bced0ba_76_0.png)'
  - '[PAGE 77]


    These are the kind of precise instructions a computer or robot would require to
    make a cup of coffee. When creating computer applications we often use functions
    that have algorithms in them. There are a number of ways of doing this. Some coders
    write flow diagrams. Some just write it out as it comes to them and figure it
    out as they go along. Others try to write out the algorithm in simple terms first
    and then write the code. ‘just-write-it’ method is not the best choice and often
    results in far more work in the end than the other two. In this chapter we write
    two algorithms and use a different approach to write each one.


    # The factorial function


    Factorials may be new to you. In maths lessons we might write 5! and we would
    say ‘five factorial’.


    ```

    5! = 5 x 4 x 3 x 2 x 1

    ```


    ```

    = 120

    ```


    You may be thinking that this will need a loop. Notice how you are now thinking
    like a coder. The method we will use this time is to have a first go at writing
    the algorithm and then turn it into code. Here is the algorithm:


    +   1 Assign the target number to a variable: n.

    2 Create a variable to store the answer: ans.

    3 Make ans equal to n.

    4 Reduce n by 1.

    5 Make ans equal to itself times by n.

    6 Continue doing this until n equals1.'
