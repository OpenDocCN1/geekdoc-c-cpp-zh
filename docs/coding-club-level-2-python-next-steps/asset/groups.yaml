    - learn how to convert numbers to Roman numerals.\n\n![](img/6b7e856a8941483d0527bf7e3bced0ba_75_0.png)\n\
    \n> Ahem, what is this, 'play time?'\n\n![](img/6b7e856a8941483d0527bf7e3bced0ba_75_1.png)\n\
    \n## An introductory note\n\nIn this chapter we are not going to alter the myCalculator.py\
    \ file. However, when testing the calculator, this is still the file that needs\
    \ to be opened and run. We will do the work of this chapter on the calc_functions.py\
    \ script that you met for the first time in Chapter 5. You should begin with the\
