  - '[PAGE 23]


    # MyGlossary


    A graphical user interface (GUI) is, very simply, the ''screen'' that allows a
    user to interact with their computer through graphics such as menus and buttons.
    You are now going to build a small GUI application of your own using tkinter.


    In the source code downloaded from the companion website, in the folder for Chapter
    2, you will find a file called myGlossary_Start.py. This file provides you with
    outline source code for a glossary application containing the complete glossary
    for this book. This is also provided for reference in Code Box 2.1.


    ```

    # myGlossary_Start.py


    from tkinter import *


    # key press function:


