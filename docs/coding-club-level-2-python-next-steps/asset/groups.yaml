    \ to the mug.\n- Add water to a kettle.\n- Boil the water.\n- Add the boiling\
    \ water to the mug to within 2 cm of the top.\n- Get the milk from the fridge.\n\
    - Add 1 cm depth of milk to the mug.\n- Put the milk back in the fridge.\n\n![](img/6b7e856a8941483d0527bf7e3bced0ba_76_0.png)\n\
    \nThese are the kind of precise instructions a computer or robot would require\
    \ to make a cup of coffee. When creating computer applications, this is the kind\
    \ of logic we use. There are many ways to solve a problem, and the algorithm we\
    \ choose is key.\n\n## The factorial function\n\nA factorial is the product of\
    \ an integer and all the integers below it. For example, 5! is 5 × 4 × 3 × 2 ×\
    \ 1 = 120. This is a very common operation in mathematics and programming.\n\n\
    Here is how you calculate it in Python:\n\n```python\ndef factorial(n):\n    result\
    \ = 1\n    for i in range(1, n + 1):\n        result *= i\n    return result\n\
    ```\n\nIn this chapter, we will learn how to implement this in our calculator.\
    \ We will also explore how to handle edge cases, such as 0!, which is defined\
    \ as 1.\n"
