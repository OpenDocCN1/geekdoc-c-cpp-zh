    \ column=c)\n    if c > 2:\n        c = 0\n    r += 1\n\n#####  mainloop\nwindow.mainloop()\n\
    ```\n\n## 故意错误！\n\n### 快速测验 3.1\n\n故意错误在哪里？\n（保持代码不变——我们将在测试和调试中研究这个问题。）\n\n##\
    \ 使用 frame\n\n在你尝试调查 1 的时候，你可能尝试过将三个按钮放在一起，并发现它们并不合适。控制一组元素的一种方法是跨列（spanning columns）。通常将一组控件放在另一个名为\
    \ frame 的控件中更好。这就是我们如何使用 frame 来组织计算器。有些人专门负责布局应用程序的用户界面。如果他们做得出色，他们的界面对用户来说始终是自然的。\n\
    \n| MyCalculator | | | |\n|---|---|---|---|\n| 7 | 8 | 9 | |\n| 4 | 5 | 6 | +\
    \ |\n| 1 | 2 | 3 | ( ) |\n| 0 | | | C |\n\n使用 frame 操作计算器。\n\n![](img/6b7e856a8941483d0527bf7e3bced0ba_43_png)\n\
    \n如果你仔细查看代码，你应该看到控件是如何在窗口中排列的，按钮是如何分组在 frame 中的。\n\n## for 循环\n\n在 **Python 基础**\
    \ 中我们学习了 **while 循环**。现在是时候认识 for 循环了。在处理列表、字典或元组时，**for 循环** 非常棒。for 循环会根据需要执行缩进的代码，在这种情况下，每个按钮需要执行一次。也就是说，对于\
    \ `btn_text` 的每个值。变量 `btn_text` 用于存储 `num_pad_list` 的值。所以，在第一次循环时，`btn_text` 代表字符串\
    \ '7'。在下一轮中，`btn_text` 将是 '8'。每次循环列计数器 `c` 增加 1，直到它大于 2。\n\n## 第3 章：设计简单的计算器\n\
    \n## 实验\n\n尝试运行提供的代码，然后修改代码让列计数器计数到大于 3，看看发生了什么。继续修改 `c` 和 `r` 的值，直到你对这个循环如何构建数字小键盘有了良好的感觉。`num_pad`\
