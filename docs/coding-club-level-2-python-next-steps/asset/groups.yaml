    # Appendix 2


    # Binary numbers


    To understand binary numbers it is best to remind ourselves how base 10 numbers
    work. Each column, starting from the right, stores values that are 10 times as
    large as the previous column.


    e.g. The number 347 has 7 units, 4 tens, 3 hundreds and no thousands:


    | thousands | hundreds | tens | units |

    |---|---|---||

    | | 3 | 4 | 7 |


    So we get 347 by adding:


    (3×100) + (4×10) + (7×1)


    In binary, or base 2 as it is sometimes called, the system is the same except
    each column is worth two times the preceding column:


    e.g. 1101 (or 13 in base 10) has 1 unit, zero two, 1 four, and 1 eight:


    | eights | fours | twos | units |

    |---|---|---||

    | 1 | 1 | 0 | 1 |


    So we can see 1101 in binary is 13 in base 10 by adding:


    (1×8) + (1×4) + (0×2) + (1×1)'
