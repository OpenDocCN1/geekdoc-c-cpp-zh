    \n阶乘是一个整数及其下方所有整数的乘积。例如，5! 是 5 × 4 × 3 × 2 × 1 = 120。这在数学和编程中是一个非常常见的操作。\n\n这是在\
    \ Python 中计算它的方法：\n\n```python\ndef factorial(n):\n    result = 1\n    for i in\
