    # Using frames


    While you were trying out Investigation 1, you may have tried putting the three
    buttons next to each other and found that they did not fit very well. One way
    of controlling groups of elements is by spanning columns. It is often better to
    put groups of widgets in another widget called a **frame**. This is how we use
    frames to organise the calculator.


    Some people specialise in laying out user interfaces for apps. If they are good
    at their jobs, their interfaces always appear to be the natural solution to the
    user.


    | MyCalculator |

    | 7 | 8 | 9 | |

    |---|---|---|---||

    | 4 | 5 | 6 | + |

    | 1 | 2 | 3 | ( ) |

    | 0 | | | C |


    num_pad frame


    operator frame


    Calculator with frames.


    ![](img/6b7e856a8941483d0527bf7e3bced0ba_43_0.png)


    If you look carefully at the code you should see how the frame widgets are arranged
    in the window and the buttons are then grouped in the frames.


    # for loops


    In **Python Basics** we learned about **while loops**. Now it is time to meet
    for loops. A **for loop** is great when handling lists, dictionaries or tuples.
    For loops go through the indented code as many times as required, so in this case
    once for each button we need. That is, for each value of `btn_text`. The variable
    `btn_text` is used to hold the values of the `num_pad_list`. So, on the first
    time round the loop, `btn_text` represents the string `''7''`. On the next round
    `btn_text` will be `''8''`. Each time through the loop the column counter `c`
    is increased by 1 until it is greater than 2.


