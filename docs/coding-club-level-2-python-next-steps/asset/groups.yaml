    # # Chapter 1

    Data types


    In this chapter you will:


    +   - learn about data types

    - learn about tuples, lists and dictionaries

    - make a version of MyMagic8Ball that is much shorter than the one from Python
    Basics.


    # # Data types


    In Python Basics you learned about strings (bits of text), integers (whole numbers)
    and floats (numbers with a decimal point). These are examples of data types. There
    are more! In this chapter we will look at some new data types: tuples, lists and
    dictionaries. These new data types are all called container data types because
    they store more than one piece of data. For example, they can store several strings.
    They do so in different ways and have their advantages and disadvantages.


    A string is rather like a container because it stores a whole sequence of letters
    or numbers (or a mixture of both). In Python Basics we learned that there are
    several functions we can use on strings. We can also use many of these functions
    on tuples, lists and dictionaries.


    ![](img/6b7e856a8941483d0527bf7e3bced0ba_8_0.png)'
  - '[PAGE 9]


    # Tuples


    A tuple is the simplest of our new data types. They can store strings, integers
    and other data types. Here is an example of a tuple that stores four strings,
    each separated by a comma:


    ```

    my_tuple = ("one", "two", "three", "four")

    ```


    Each value in a tuple is separated by a comma. Unlike variables, we cannot change
    what is stored in a given tuple.


    Each value in the tuple has an index starting from 0. So, print (my_tuple[1])
    for the example above produces the output two. Look at how this works below.


    ![](img/6b7e856a8941483d0527bf7e3bced0ba_9_0.png)


    A tuple.'
