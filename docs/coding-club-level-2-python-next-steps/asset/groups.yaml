    # Quick Quiz 1.2


    For each of the following say whether to choose a tuple, a list, or a dictionary:

    1 A container to store the personal best times achieved by club swimmers in the
    100m freestyle such as: Mark: 65.34s, Freya: 68.04s, etc.

    2 A container to store the months of the year.

    3 A container to store the monthly rainfall data for London in 2012.

    4 A container to store the names of the students who currently attend the chess
    club.


    # Chapter summary


    In this chapter you have:


    +   - learned more about data types

    - learned about tuples, lists and dictionaries

    - made a shorter version of MyMagic8Ball

    - seen some of the different functions that can and cannot be used with the new
    data types.


