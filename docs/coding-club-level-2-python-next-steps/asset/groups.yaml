    # tkinter widgets


    In Python Basics you were introduced to tkinter and you learned how to use this
    module to open a window. We then used tkinter Canvas class to provide an area
    where we could draw. Canvas is an example of a tkinter widget. tkinter provides
    all the normal widgets that are available in modern programming languages, such
    as buttons, labels or text entry fields. Indeed there are popular alternatives
    to tkinter even in Python.


    > I often use widgets in my web apps. The main widgets use are buttons, checkboxes,
    bullet lists, dropdown menus and checkboxes.


    ![](img/6b7e856a8941483d0527bf7e3bced0ba_25_0.png)


    # Delving Deeper


    Although all modern languages provide these GUI facilities they do not all do
    so in the same way as tkinter. If in the future you want to create an application
    in a different programming language, you will need to find out how it provides
    windows, canvases, buttons, labels, etc. To do this, read the documentation for
    the GUI library you choose to use.'
