    \n![](img/6b7e856a8941483d0527bf7e3bced0ba_40_png)\n\n## 代码框 3.3\n\n```python\n\
    # myCalculator_expt2.py\nfrom tkinter import *\nfrom decimal import *\n\n# 按键函数：\n\
    def click(key):\n    display.insert(END, key)\n\n##### main:\nwindow = Tk()\n\
    window.title(\"MyCalculator\")\n\n# 创建行\ntop_row = Frame(window)\ntop_row.grid(row=0,\
