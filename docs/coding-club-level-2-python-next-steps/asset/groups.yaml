    \ refer to this if you get stuck. Please be aware this is an interesting but difficult\
    \ chapter!\n\n> I cannot get through the day without at least one cappuccino.\n\
    \n## Developing algorithms\n\nAn algorithm is a step-by-step recipe, or a set\
    \ of rules, that solves a problem. For example, sorting a list of words into alphabetical\
    \ order is an important thing for computers to do. There are many ways of solving\
    \ this simple problem. A lot of research has gone into finding the most efficient\
    \ algorithm because it is such an important task.\n\nHere is an algorithm for\
