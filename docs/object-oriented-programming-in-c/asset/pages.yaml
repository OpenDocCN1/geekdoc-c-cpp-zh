  md: "extension of the idea of structure used in C. It is a new way of creating and\
    \ implementing a user-defined data type. We shall discuss, in this chapter, the\
    \ concept of class by first reviewing the traditional structures found in C and\
    \ then the ways in which classes can be designed, implemented and applied.\n\n\
    # 5.2  C Structures Revisited\n\nWe know that one of the unique features of the\
    \ C language is structures. They provide a method for packing together data of\
    \ different types. A structure is a convenient tool for handling a group of logically\
    \ related data items. It is a user-defined data type with a *template* that serves\
    \ to define its data properties. Once the structure type has been defined, we\
    \ can create variables of that type using declarations that are similar to the\
    \ built-in type declarations. For example, consider the following declaration:\n\
    \n```\n```c\nstruct student\n{\n        char   name[20];\n        int    roll_number;\n\
    \        float  total_marks;\n};\n```\n```\n\nThe keyword struct declares student\
    \ as a new data type that can hold three fields of different data types. These\
    \ fields are known as *structure members* or *elements*. The identifier student,\
    \ which is referred to as *structure name* or *structure tag*, can be used to\
    \ create variables of type student. Example:\n\n```\n```c\nstruct student A; \
    \  // C declaration\n```\n```\n\nA is a variable of type student and has three\
    \ member variables as defined by the template. Member variables can be accessed\
    \ using the *dot* or *period operator* as follows:\n\n```\n```c\nstrcpy(A.name,\
    \ \"John\");\nA.roll_number = 999;\nA.total_marks = 595.5;\nfinal_total = A.total_marks\
    \ + 5;\n```\n```\n\nStructures can have arrays, pointers or structures as members.\n\
    \n# Limitations of C Structure\n\nThe standard C does not allow the struct data\
    \ type to be treated like built-in types. For example, consider the following\
    \ structure:"
