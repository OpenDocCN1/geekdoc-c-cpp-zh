    \n# 8.1  Introduction\n\nReusability is yet another important feature of OOP.\
    \ It is always nice if we could reuse something that already exists rather than\
    \ trying to create the same all over again. It would not only save time and money\
    \ but also reduce frustration and increase reliability. For instance, the reuse\
    \ of a class that has already been tested, debugged and used many times can save\
    \ us the effort of developing and testing the same again.\n\nFortunately, C++\
    \ strongly supports the concept of *reusability*. The C++ classes can be reused\
    \ in several ways. Once a class has been written and tested, it can be adapted\
    \ by other programmers to suit their requirements. This is basically done by creating\
    \ new classes, reusing the properties of the existing ones. The mechanism of deriving\
    \ a new class from an old one is called *inheritance* (or *derivation*). The old\
    \ class is referred to as the *base class* and the new one is called the *derived\
    \ class* or *subclass*."
