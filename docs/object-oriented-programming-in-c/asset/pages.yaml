  md: 'A function call first matches the prototype having the same number and type
    of arguments and then calls the appropriate function for execution. A best match
    must be unique. The function selection involves the following steps:


    +   1. The compiler first tries to find an exact match in which the types of actual
    arguments are the same, and use that function.

    +   2. If an exact match is not found, the compiler uses the integral promotions
    to the actual arguments, such as,

    +   3. When either of them fails, the compiler tries to use the built-in conversions
    (the implicit assignment conversions) to the actual arguments and then uses the
    function whose match is unique. If the conversion is possible to have multiple
    matches, then the compiler will generate an error message. Suppose we use the
    following two functions:

    +   4. If all of the steps fail, then the compiler will try the user-defined conversions
    in combination with integral promotions and built-in conversions to find a unique
    match. User-defined conversions are often used in handling class objects.


    ```

    char to int

    float to double

    ```


    ```

    long square(long n)

    double square(double x)

