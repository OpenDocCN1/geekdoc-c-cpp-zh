  md: '+   7. Unary operators, overloaded by means of a member function, take no explicit
    arguments and return no explicit values, but, those overloaded by means of a friend
    function, take one reference argument (the object of the relevant class).

    +   8. Binary operators overloaded through a member function take one explicit
    argument and those which are overloaded through a friend function take two explicit
    arguments.

    +   9. When using binary operators overloaded through a member function, the left
    hand operand must be an object of the relevant class.

    +   10. Binary arithmetic operators such as +, -, *, and / must explicitly return
    a value. They must not attempt to change their own arguments.


    # Table 7.1 Operators that cannot be overloaded


    |  |  |

    |---|---|---|

    | Sizeof | Size of operator |

    | . | Membership operator |

    | .* | Pointer-to-member operator |

    | :: | Scope resolution operator |

    | ?: | Conditional operator |


    # Table 7.2 Where a friend cannot be used


    |  |  |

    |---|---|---|

    | = | Assignment operator |

    | () | Function call operator |

    | [] | Subscripting operator |

    | -> | Class member access operator |


    # 7.8 Type Conversions


    We know that when constants and variables of different types are mixed in an expression,
    C applies automatic type conversion to the operands as per certain rules. Similarly,
    an assignment operation also causes the automatic type conversion. The type of
    data to the right of an assignment operator is automatically converted to the
    type of the variable on the left. For example, the statements


    ```

    int m;

    float x = 3.14159;

    m = x;

    ```


    convert x to an integer before its value is assigned to m. Thus, the fractional
    part is truncated. The type conversions are automatic as long as the data types
    involved are built-in types.


    What happens when they are user-defined data types?'
