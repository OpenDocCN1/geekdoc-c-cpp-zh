    \ For example, a constructor was used to build a vector object from an int type\
    \ array. Similarly, we used another constructor to build a string type object\
    \ from a char* type variable. These are all examples where constructors perform\
    \ a defacto type conversion from the argument's type to the constructor's class\
    \ type.\n\nConsider the following constructor:\n\n```\nstring :: string(char *a)\n\
    {\n    length = strlen(a);\n    P = new char[length+1];\n    strcpy(P,a);\n}\n\
    ```\n\nThis constructor builds a string type object from a char* type variable\
