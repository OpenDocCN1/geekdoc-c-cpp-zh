    # 4.8 const Arguments


    In C++, an argument to a function can be declared as const as shown below.


    ```

    int strlen(const char *p);

    int length(const string &s);

    ```


    The qualifier const tells the compiler that the function should not modify the
    argument. The compiler will generate an error when this condition is violated.
    This type of declaration is significant only when we pass arguments by reference
    or pointers.


    # 4.9 Function Overloading


    As stated earlier, overloading refers to the use of the same thing for different
    purposes. C++ also permits overloading of functions. This means that we can use
    the same function name to create functions that perform a variety of different
    tasks. This is known as function polymorphism in OOP.


    Using the concept of function overloading, we can design a family of functions
    with one function name but with different argument lists. The function would perform
    different operations depending on the argument list in the function call. The
    correct function to be invoked is determined by checking the number and type of
    the arguments but not on the function type. For example, an overloaded add() function
    handles different types of data as shown below:


    ```

    // Declarations

    int add(int a, int b);                      // prototype 1

    int add(int a, int b, int c);               // prototype 2

    double add(double x, double y);             // prototype 3

    double add(int p, double q);                // prototype 4

    double add(double p, int q);                // prototype 5


    // Function calls

    cout << add(5, 10);                         // uses prototype 1

    cout << add(15, 10.0);                      // uses prototype 4

    cout << add(12.5, 7.5);                     // uses prototype 3

    cout << add(5, 10, 15);                     // uses prototype 2

    cout << add(0.75, 5);                       // uses prototype 5

    ```'
