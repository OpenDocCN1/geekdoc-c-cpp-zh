    it is important that we do not use both the constructor and the casting operator
    for the same type conversion, since this introduces an ambiguity as to how the
    conversion should be performed.


    # SUMMARY


    +   ↔ Operator overloading is one of the important features of C++ language. It
    is called compile time polymorphism.

    +   ↔ Using overloading feature we can add two user defined data types such as
    objects, with the same syntax, just as basic data types.

    +   ↔ We can overload almost all the C++ operators except the following:

    +     • class member access operators(., .*)

