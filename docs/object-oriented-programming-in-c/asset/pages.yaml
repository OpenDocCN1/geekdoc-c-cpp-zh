  md: "# 8.12 Member Classes: Nesting of Classes\n\nInheritance is the mechanism of\
    \ deriving certain properties of one class into another. We have seen in detail\
    \ how this is implemented using the concept of derived classes. C++ supports yet\
    \ another way of inheriting properties of one class into another. This approach\
    \ takes a view that an object can be a collection of many other objects. That\
    \ is, a class can contain objects of other classes as its members as shown below:\n\
    \n```\nclass alpha {...};\nclass beta {...};\nclass gamma\n{\n    alpha a;   \
    \     // a is an object of alpha class\n    beta b;         // b is an object\
    \ of beta class\n    ....\n};\n```\n\nAll objects of gamma class will contain\
    \ the objects a and b. This kind of relationship is called containership or nesting.\
    \ Creation of an object that contains another object is very different than the\
    \ creation of an independent object. An independent object is created by its constructor\
    \ when it is declared with arguments. On the other hand, a nested object is created\
    \ in two stages. First, the member objects are created using their respective\
    \ constructors and then the other 'ordinary' members are created. This means,\
    \ constructors of all the member objects should be called before its own constructor\
    \ body is executed. This is accomplished using an initialization list in the constructor\
    \ of the nested class.\n\nExample:\n\n```\nclass gamma\n{\n    ....\n    alpha\
    \ a;        // a is object of alpha\n    beta b;         // b is object of beta\n\
    public:\n    gamma(arglist): a(arglist1), b(arglist2)\n    {\n        // constructor\
    \ body\n    }\n};\n```\n\narglist is the list of arguments that is to be supplied\
    \ when a gamma object is defined. These parameters are used for initializing the\
    \ members of gamma. arglist1 is the argument list"
