- pgno: 112
  md: "# 5.3 Specifying a Class\n\nA class is a way to bind the data and its associated\
    \ functions together. It allows the data (and functions) to be hidden, if necessary,\
    \ from external use. When defining a class, we are creating a new abstract data\
    \ type that can be treated like any other built-in data type. Generally, a class\
    \ specification has two parts:\n\n+   1. Class declaration\n+   2. Class function\
    \ definitions\n\nThe class declaration describes the type and scope of its members.\
    \ The class function definitions describe how the class functions are implemented.\n\
    \nThe general form of a class declaration is:\n\n```\nclass class_name\n{\n  \
    \  private:\n        variable declarations;\n        function declarations;\n\
    \    public:\n        variable declarations;\n        function declaration;\n\
    };\n```\n\nThe class declaration is similar to a struct declaration. The keyword\
    \ class specifies, that what follows is an abstract data of type class_name. The\
    \ body of a class is enclosed within braces and terminated by a semicolon. The\
    \ class body contains the declaration of variables and functions. These functions\
    \ and variables are collectively called class members. They are usually grouped\
    \ under two sections, namely, private and public to denote which of the members\
    \ are private and which of them are public. The keywords private and public are\
    \ known as visibility labels. Note that these keywords are followed by a colon.\n\
    \nThe class members that have been declared as private can be accessed only from\
    \ within the class. On the other hand, public members can be accessed from outside\
    \ the class also. The data hiding (using private declaration) is the key feature\
    \ of object-oriented programming. The use of the keyword private is optional.\
    \ By default, the members of a class are private. If both the labels are missing,\
    \ then, by default, all the members are private. Such a class is completely hidden\
    \ from the outside world and does not serve any purpose.\n\nThe variables declared\
    \ inside the class are known as data members and the functions are known as member\
    \ functions. Only the member functions can have access to the private data members\
    \ and private functions. However, the public members (both functions and data)\
    \ can be accessed from outside the class. This is illustrated in Fig. 5.1. The\
    \ binding of data and functions together into a single class-type variable is\
    \ referred to as encapsulation."
  merge: -1
  img_proc: true
