- pgno: 18
  md: 'and printing. A number of functions are written to accomplish these tasks.
    The primary focus is on functions. A typical program structure for procedural
    programming is shown in Fig. 1.4. The technique of hierarchical decomposition
    has been used to specify the tasks to be completed for solving a problem.


    ![](img/58ab8f034e2127e80560390a921c2523_18_0.png)


    Fig. 1.4 ⇔ Typical structure of procedure-oriented programs


    Procedure-oriented programming basically consists of writing a list of instructions
    (or actions) for the computer to follow, and organizing these instructions into
    groups known as functions. We normally use a flowchart to organize these actions
    and represent the flow of control from one action to another. While we concentrate
    on the development of functions, very little attention is given to the data that
    are being used by various functions. What happens to the data? How are they affected
    by the functions that work on them?


    In a multi-function program, many important data items are placed as global so
    that they may be accessed by all the functions. Each function may have its own
    local data. Figure 1.5 shows the relationship of data and functions in a procedure-oriented
    program.


    Global data are more vulnerable to an inadvertent change by a function. In a large
    program it is very difficult to identify what data is used by which function.
    In case we need to revise an external data structure, we also need to revise all
    functions that access the data. This provides an opportunity for bugs to creep
    in.


    Another serious drawback with the procedural approach is that it does not model
    real world problems very well. This is because functions are action-oriented and
    do not really correspond to the elements of the problem.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '![](img/58ab8f034e2127e80560390a921c2523_19_0.png)


    Fig. 1.5 → *Relationship of data and functions in procedural programming*


    Some characteristics exhibited by procedure-oriented programming are:


    +   - Emphasis is on doing things (algorithms).

    +   - Large programs are divided into smaller programs known as functions.

    +   - Most of the functions share global data.

    +   - Data move openly around the system from function to function.

    +   - Functions transform data from one form to another.

    +   - Employs *top-down* approach in program design.


    # 1.4  Object-Oriented Programming Paradigm


    The major motivating factor in the invention of object-oriented approach is to
    remove some of the flaws encountered in the procedural approach. OOP treats data
    as a critical element in the program development and does not allow it to flow
    freely around the system. It ties data more closely to the functions that operate
    on it, and protects it from accidental modification from outside functions. OOP
    allows decomposition of a problem into a number of entities called objects and
    then builds data and functions around these objects. The organization of data
    and functions in object-oriented programs is shown in Fig. 1.6. The data of an
    object can be accessed only by the functions associated with that object. However,
    functions of one object can access the functions of other objects.


    Some of the striking features of object-oriented programming are:


    +   - Emphasis is on data rather than procedure.

    +   - Programs are divided into what are known as objects.

    +   - Data structures are designed such that they characterize the objects.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '+   - Functions that operate on the data of an object are tied together in
    the data structure.

    +   - Data is hidden and cannot be accessed by external functions.

    +   - Objects may communicate with each other through functions.

    +   - New data and functions can be easily added whenever necessary.

    +   - *Follows bottom-up approach in program design.*


    ![](img/58ab8f034e2127e80560390a921c2523_20_0.png)


    Fig. 1.6 ⇒ Organization of data and functions in OOP


    Object-oriented programming is the most recent concept among programming paradigms
    and still means different things to different people. It is therefore important
    to have a working definition of object-oriented programming before we proceed
    further. We define “object-oriented programming as an approach that provides a
    way of modularizing programs by creating partitioned memory area for both data
    and functions that can be used as templates for creating copies of such modules
    on demand.” Thus, an object is considered to be a partitioned area of computer
    memory that stores data and set of operations that can access that data. Since
    the memory partitions are independent, the objects can be used in a variety of
    different programs without modifications.


    # 1.5 Basic Concepts of Object-Oriented Programming


    It is necessary to understand some of the concepts used extensively in object-oriented
    programming. These include:


    +   - Objects

    +   - Classes'
  merge: -1
  img_proc: true
- pgno: 21
  md: '+   - Data abstraction and encapsulation

    +   - Inheritance

    +   - Polymorphism

    +   - Dynamic binding

    +   - Message passing


    We shall discuss these concepts in some detail in this section.


    # Objects


    *Objects* are the basic run-time entities in an object-oriented system. They may
    represent a person, a place, a bank account, a table of data or any item that
    the program has to handle. They may also represent user-defined data such as vectors,
    time and lists. Programming problem is analyzed in terms of objects and the nature
    of communication between them. Program objects should be chosen such that they
    match closely with the real-world objects. Objects take up space in the memory
    and have an associated address like a record in Pascal, or a structure in C.


    When a program is executed, the objects interact by sending messages to one another.
    For example, if "customer" and "account" are two objects in a program, then the
    customer object may send a message to the account object requesting for the bank
    balance. Each object contains data, and code to manipulate the data. Objects can
    interact without having to know details of each other''s data or code. It is sufficient
    to know the type of message accepted, and the type of response returned by the
    objects. Although different authors represent them differently, Fig. 1.7 shows
    two notations that are popularly used in object-oriented analysis and design.


    ![](img/58ab8f034e2127e80560390a921c2523_21_0.png)


    # Classes


    We just mentioned that objects contain data, and code to manipulate that data.
    The entire set of data and code of an object can be made a user-defined data type
    with the help of a'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'class. In fact, objects are variables of the type class. Once a class has been
    defined, we can create any number of objects belonging to that class. Each object
    is associated with the data of type class with which they are created. A class
    is thus a collection of objects of similar type. For example, mango, apple and
    orange are members of the class fruit. Classes are user-defined data types and
    behave like the built-in types of a programming language. The syntax used to create
    an object is no different than the syntax used to create an integer object in
    C. If fruit has been defined as a class, then the statement


    ```

    fruit mango;

    ```


    will create an object mango belonging to the class fruit.


    # Data Abstraction and Encapsulation


    The wrapping up of data and functions into a single unit (called class) is known
    as encapsulation. Data encapsulation is the most striking feature of a class.
    The data is not accessible to the outside world, and only those functions which
    are wrapped in the class can access it. These functions provide the interface
    between the object''s data and the program. This insulation of the data from direct
    access by the program is called data hiding or information hiding.


    Abstraction refers to the act of representing essential features without including
    the background details or explanations. Classes use the concept of abstraction
    and are defined as a list of abstract attributes such as size, weight and cost,
    and functions to operate on these attributes. They encapsulate all the essential
    properties of the objects that are to be created. The attributes are sometimes
    called data members because they hold information. The functions that operate
    on these data are sometimes called methods or member functions.


    Since the classes use the concept of data abstraction, they are known as Abstract
    Data Types (ADT).


    # Inheritance


    Inheritance is the process by which objects of one class acquire the properties
    of objects of another class. It supports the concept of hierarchical classification.
    For example, the bird ''robin'' is a part of the class ''flying bird'' which is
    again a part of the class ''bird''. The principle behind this sort of division
    is that each derived class shares common characteristics with the class from which
    it is derived as illustrated in Fig. 1.8.


    In OOP, the concept of inheritance provides the idea of reusability. This means
    that we can add additional features to an existing class without modifying it.
    This is possible by deriving a new class from the existing one. The new class
    will have the combined features of both the classes. The real appeal and power
    of the inheritance mechanism is that it allows the programmer to reuse a class
    that is almost, but not exactly, what he wants, and to tailor the class in such
    a way that it does not introduce any undesirable side-effects into the rest of
    the classes.'
