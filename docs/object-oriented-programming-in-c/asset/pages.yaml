    \ routines by ourselves, if such operations are required.\n\nThree types of situations\
    \ might arise in the data conversion between incompatible types:\n\n+   1. Conversion\
    \ from basic type to class type.\n+   2. Conversion from class type to basic type.\n\
    +   3. Conversion from one class type to another class type.\n\nWe shall discuss\
    \ all the three cases in detail.\n\n# Basic to Class Type\n\nThe conversion from\
