    \    .....//  members of derived class\n    .....//\n};\n```\n\nThe colon indicates\
    \ that the derived-class-name is derived from the base-class-name. The visibility-mode\
    \ is optional and, if present, may be either private or public. The default visibility-mode\
    \ is private. Visibility mode specifies whether the features of the base class\
    \ are privately derived or publicly derived.\n\nExamples:\n\n```\nclass ABC: private\
    \ XYZ      // private derivation\n{\n    members of ABC\n};\n```\n\n```\nclass\
    \ ABC: public XYZ      // public derivation\n{\n    members of ABC\n};\n```\n\n\
    ```\nclass ABC: XYZ             // private derivation by default\n{\n    members\
    \ of ABC\n};\n```\n\nWhen a base class is privately inherited by a derived class,\
    \ ‘public members’ of the base class become ‘private members’ of the derived class\
    \ and therefore the public members of the base class can only be accessed by the\
    \ member functions of the derived class. They are inaccessible to the objects\
    \ of the derived class. Remember, a public member of a class can be accessed by\
    \ its own objects using the dot operator. The result is that no member of the\
    \ base class is accessible to the objects of the derived class.\n\nOn the other\
    \ hand, when the base class is publicly inherited, ‘public members’ of the base\
    \ class become ‘public members’ of the derived class and therefore they are accessible\
    \ to the objects of the derived class. In both the cases, the private members\
    \ are not inherited and therefore, the private members of a base class will never\
    \ become the members of its derived class.\n\nIn inheritance, some of the base\
    \ class data elements and member functions are 'inherited' into the derived class.\
    \ We can add our own data and member functions and thus extend the"
