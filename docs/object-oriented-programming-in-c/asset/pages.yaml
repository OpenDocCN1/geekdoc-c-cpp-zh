    \ for the objects.\n\nObjects can also be created when a class is defined by placing\
    \ their names immediately after the closing brace, as we do in the case of structures.\
    \ That is to say, the definition\n\n```\nclass item\n{\n    .....\n    .....\n\
    \    .....\n} x,y,z;\n```\n\nwould create the objects x, y and z of type item.\
    \ This practice is seldom followed because we would like to declare the objects\
