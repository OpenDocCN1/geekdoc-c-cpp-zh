    # 3.12 Reference Variables


    C++ introduces a new kind of variable known as the reference variable. A reference
    variable provides an alias (alternative name) for a previously defined variable.
    For example, if we make the variable sum a reference to the variable total, then
    sum and total can be used interchangeably to represent that variable. A reference
    variable is created as follows:


    ```

    data-type & reference-name = variable-name

    ```


    Example:


    ```

    float total = 100;

    float & sum = total;

    ```


    total is a float type variable that has already been declared; sum is the alternative
    name declared to represent the variable total. Both the variables refer to the
    same data object in the memory. Now, the statements


    ```

    cout << total;

    ```


    and


    ```

    cout << sum;

    ```


    both print the value 100. The statement


    ```

    total = total + 10;

    ```


    will change the value of both total and sum to 110. Likewise, the assignment


    ```

    sum = 0;

    ```


    will change the value of both the variables to zero.


    A reference variable must be initialized at the time of declaration. This establishes
    the correspondence between the reference and the data object which it names. It
    is important to note that the initialization of a reference variable is completely
    different from assignment to it.'
