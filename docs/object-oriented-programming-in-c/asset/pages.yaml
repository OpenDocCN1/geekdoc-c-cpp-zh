- pgno: 14
  md: '# Preface


    Object-Oriented Programming (OOP) has become the preferred programming approach
    by the software industries, as it offers a powerful way to cope with the complexity
    of real-world problems. Among the OOP languages available today, C++ is by far
    the most widely used language.


    Since its creation by Bjarne Stroustrup in early 1980s, C++ has undergone many
    changes and improvements. The language was standardized in 1998 by the American
    National Standards Institute (ANSI) and the International Standards Organization
    (ISO) by incorporating not only the new features but also the changes suggested
    by the user groups. This book has been thoroughly revised and this edition confirms
    to the specifications of ANSI/ISO standards. Besides confirming to the standards,
    many smaller changes and additions to strengthen the existing topics as well as
    corrections to typographical errors and certain inaccuracies in the text have
    been incorporated. The highlight of this edition is the inclusion of two new programming
    projects in Appendix A - (1) Menu Based Calculation System and (2) Banking System
    that demonstrate how to integrate the various features of C++ in real life applications.


    This book is for the programmers who wish to know all about C++ language and object-oriented
    programming. It explains in a simple and easy-to-understand style the what, why
    and how of object-oriented programming with C++. The book assumes that the reader
    is already familiar with C language, although he or she need not be an expert
    programmer.


    The book provides numerous examples, illustrations and complete programs. The
    sample programs are meant to be both simple and educational. Wherever necessary,
    pictorial descriptions of concepts are included to improve clarity and facilitate
    better understanding. The book also presents the concept of object-oriented approach
    and discusses briefly the important elements of object-oriented analysis and design
    of systems.


    # Key Pedagogical Features


    # Key Concepts


    Key concepts provide a quick look into the concepts that will be discussed in
    the chapter. These are followed by an Introduction that introduces the topics
    to be covered in that chapter and also relates them to those already learned.


    ![](img/58ab8f034e2127e80560390a921c2523_14_0.png)'
  merge: -1
  img_proc: true
- pgno: 15
  md: '+   - How to ensure reusability and extensibility of modules?

    +   - How to develop modules that are tolerant to any changes in future?

    +   - How to improve software productivity and decrease software cost?

    +   - How to improve the quality of software?

    +   - How to manage time schedules?

    +   - How to industrialize the software development process?


    Many software products are either not finished, or not used, or else are delivered
    with major errors. Figure 1.1 shows the fate of the US defence software projects
    undertaken in the 1970s. Around 50% of the software products were never delivered,
    and one-third of those which were delivered were never used. It is interesting
    to note that only 2% were used as delivered, without being subjected to any changes.
    This illustrates that the software industry has a remarkably bad record in delivering
    products.


    ![](img/58ab8f034e2127e80560390a921c2523_15_0.png)


    Fig. 1.1 ⇔ The state of US defence projects (according to the US government)


    Changes in user requirements have always been a major problem. Another study (Fig.
    1.2) shows that more than 50% of the systems required modifications due to changes
    in user requirements and data formats. It only illustrates that, in a changing
    world with a dynamic business environment, requests for change are unavoidable
    and therefore systems must be adaptable and tolerant to changes.


    These studies and other reports on software implementation suggest that software
    products should be evaluated carefully for their quality before they are delivered
    and implemented. Some of the quality issues that must be considered for critical
    evaluation are:


    +   1. Correctness

    +   2. Maintainability

    +   3. Reusability

    +   4. Openness and interoperability'
  merge: -1
  img_proc: true
- pgno: 16
  md: '+   5. Portability

    +   6. Security

    +   7. Integrity

    +   8. User friendliness


    Selection and use of proper software tools would help resolving some of these
    issues.


    ![](img/58ab8f034e2127e80560390a921c2523_16_0.png)




    Ernest Tello, a well-known writer in the field of artificial intelligence, compared
    the evolution of software technology to the growth of a tree. Like a tree, the
    software evolution has had distinct phases or “layers” of growth. These layers
    were built up one by one over the last five decades as shown in Fig. 1.3, with
    each layer representing an improvement over the previous one. However, the analogy
    fails if we consider the life of these layers. In software systems, each of the
    layers continues to be functional, whereas in the case of trees, only the uppermost
    layer is functional.


    > “As complexity increases, architecture dominates the basic material”. To build
    today''s complex software it is just not enough to put together a sequence of
    programming statements and sets of procedures and modules; we need to incorporate
    sound construction techniques and program structures that are easy to comprehend,
    implement and modify.


    Since the invention of the computer, many programming approaches have been tried.'
  merge: -1
  img_proc: true
