  md: 'constant expression, such as


    ```

    const int size = 10;

    char name[size];

    ```


    This would be illegal in C. const allows us to create typed constants instead
    of having to use #define to create constants that have no type information.


    As with long and short, if we use the const modifier alone, it defaults to int.
    For example,


    ```

    const size = 10;

    ```


    means


    ```

    const int size = 10;

    ```


    The named constants are just like variables except that their values cannot be
    changed.


    C++ requires a const to be initialized. ANSI C does not require an initializer;
    if none is given, it initializes the const to 0.


    The scoping of const values differs. A const in C++ defaults to the internal linkage
    and therefore it is local to the file where it is declared. In ANSI C, const values
    are global in nature. They are visible outside the file in which they are declared.
    However, they can be made local by declaring them as static. To give a const value
    an external linkage so that it can be referenced from another file, we must explicitly
    define it as an extern in C++. Example:


    ```

    extern const total = 100;

    ```


    Another method of naming integer constants is by enumeration as under;


    ```

    enum {X,Y,Z};

    ```


    This defines X, Y and Z as integer constants with values 0, 1, and 2 respectively.
    This is equivalent to:


    ```

    const X = 0;

    const Y = 1;

    const Z = 2;

    ```


    We can also assign values to X, Y, and Z explicitly. Example:


    ```

    enum{X=100, Y=50, Z=200};

    ```


    Such values can be any integer values. Enumerated data type has been discussed
    in detail in Section 3.6.'
