  md: 'The derived class inherits some or all of the traits from the base class. A
    class can also inherit properties from more than one class or from more than one
    level. A derived class with only one base class, is called *single inheritance*
    and one with several base classes is called *multiple inheritance*. On the other
    hand, the traits of one class may be inherited by more than one class. This process
    is known as *hierarchical inheritance*. The mechanism of deriving a class from
    another ‘derived class’ is known as *multilevel inheritance*. Figure 8.1 shows
    various forms of inheritance that could be used for writing extensible programs.
    The direction of arrow indicates the direction of inheritance. (Some authors show
    the arrow in opposite direction meaning “inherited from”.)


