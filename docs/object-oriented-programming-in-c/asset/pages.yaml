    \ of what it points to cannot be changed.\n+   - Pointers are widely used in C++\
    \ for memory management and to achieve polymorphism.\n+   - C++ provides a qualifier\
    \ called const to declare named constants which are just like variables except\
    \ that their values can not be changed. A const modifier defaults to an int.\n\
    +   - C++ is very strict regarding type checking of variables. It does not allow\
    \ to equate variables of two different data types. The only way to break this\
    \ rule is type casting.\n+   - C++ allows us to declare a variable anywhere in\
    \ the program, as also its initialization at run time, using the expressions at\
