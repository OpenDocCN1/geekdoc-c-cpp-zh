    A major difference between C and C++ is the limit on the length of a name. While
    ANSI C recognizes only the first 32 characters in a name, ANSI C++ places no limit
    on its length and, therefore, all the characters in a name are significant.


    Care should be exercised while naming a variable which is being shared by more
    than one file containing C and C++ programs. Some operating systems impose a restriction
    on the length of such a variable name.


    Constants refer to fixed values that do not change during the execution of a program.


    Like C, C++ supports several kinds of literal constants. They include integers,
    characters, floating point numbers and strings. Literal constant do not have memory
