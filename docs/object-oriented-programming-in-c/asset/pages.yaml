    # 3.13 Operators in C++


    C++ has a rich set of operators. All C operators are valid in C++ also. In addition,
    C++ introduces some new operators. We have already seen two such operators, namely,
    the insertion operator <<, and the extraction operator >>. Other new operators
    are:


    +   :: Scope resolution operator

    +   :: * Pointer-to-member declarator

    +   -> * Pointer-to-member operator

    +   .* Pointer-to-member operator

    +   delete Memory release operator

    +   endl Line feed operator

    +   new Memory allocation operator

    +   setw Field width operator


    In addition, C++ also allows us to provide new definitions to some of the built-in
    operators. That is, we can give several meanings to an operator, depending upon
    the types of arguments used. This process is known as operator overloading.'
