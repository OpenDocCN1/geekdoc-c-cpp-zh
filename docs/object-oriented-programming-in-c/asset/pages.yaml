    # 1.6 Benefits of OOP


    OOP offers several benefits to both the program designer and the user. Object-orientation
    contributes to the solution of many problems associated with the development and
    quality of software products. The new technology promises greater programmer productivity,
    better quality of software and lesser maintenance cost. The principal advantages
    are:


    +   - Through inheritance, we can eliminate redundant code and extend the use
    of existing classes.

    +   - We can build programs from the standard working modules that communicate
    with one another, rather than having to start writing the code from scratch. This
    leads to saving of development time and higher productivity.

    +   - The principle of data hiding helps the programmer to build secure programs
    that cannot be invaded by code in other parts of the program.

    +   - It is possible to have multiple instances of an object to co-exist without
    any interference.

    +   - It is possible to map objects in the problem domain to those in the program.

    +   - It is easy to partition the work in a project based on objects.

    +   - The data-centered design approach enables us to capture more details of
    a model in implementable form.

    +   - Object-oriented systems can be easily upgraded from small to large systems.

    +   - Message passing techniques for communication between objects makes the interface
    descriptions with external systems much simpler.

    +   - Software complexity can be easily managed.


    While it is possible to incorporate all these features in an object-oriented system,
    their importance depends on the type of the project and the preference of the
    programmer. There are a number of issues that need to be tackled to reap some
    of the benefits stated above. For'
