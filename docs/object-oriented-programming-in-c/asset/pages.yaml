    \ const is appended to the function prototypes (in both declaration and definition).\
    \ The compiler will generate an error message if such functions try to alter the\
    \ data values.\n\n# 5.18 Pointers to Members\n\nIt is possible to take the address\
    \ of a member of a class and assign it to a pointer. The address of a member can\
    \ be obtained by applying the operator & to a “fully qualified” class member name.\
    \ A class member pointer can be declared using the operator ::* with the class\
    \ name. For example, given the class\n\n```\nclass A\n{\n    private:\n      \
    \  int m;\n    public:\n        void show();\n};\n```\n\nWe can define a pointer\
    \ to the member m as follows:\n\n```\nint A::* ip = &A :: m;\n```\n\nThe ip pointer\
    \ created thus acts like a class member in that it must be invoked with a class\
    \ object. In the statement above, the phrase A::* means “pointer-to-member of\
    \ A class”. The phrase &A::m means the “address of the m member of A class”.\n\
    \nRemember, the following statement is not valid:\n\n```\nint *ip = &m;    //\
    \ won't work\n```\n\nThis is because m is not simply an int type data. It has\
    \ meaning only when it is associated with the class to which it belongs. The scope\
    \ operator must be applied to both the pointer and the member."
