    # 7.1 Introduction


    Operator overloading is one of the many exciting features of C++ language. It
    is an important technique that has enhanced the power of extensibility of C++.
    We have stated more than once that C++ tries to make the user-defined data types
    behave in much the same way as the built-in types. For instance, C++ permits us
    to add two variables of user-defined types with the same syntax that is applied
    to the basic types. This means that C++ has the ability to provide the operators
    with a special meaning for a data type. The mechanism of giving such special meanings
    to an operator is known as operator overloading.


    Operator overloading provides a flexible option for the creation of new definitions
    for most of the C++ operators. We can'
