    \ returns the contents for copying into an object. Such an object is called a\
    \ temporary object and goes out of space as soon as the contents are assigned\
    \ to another object. Using *temporary objects* can make the code shorter, more\
    \ efficient and better to read.\n\n# 7.5  Overloading Binary Operators Using Friends\n\
    \nAs stated earlier, friend functions may be used in the place of member functions\
    \ for overloading a binary operator, the only difference being that a friend function\
    \ requires two arguments to be explicitly passed to it, while a member function\
    \ requires only one.\n\nThe complex number program discussed in the previous section\
    \ can be modified using a friend operator function as follows:\n\n+   1. Replace\
    \ the member function declaration by the friend function declaration.\n+   \n\
    +      ```cpp\n+      friend complex operator+(complex, complex);\n+      ```\n\
    +   \n+   2. Redefine the operator function as follows:\n+   \n+      ```cpp\n\
    +      complex operator+(complex a, complex b)\n+      {\n+          return complex((a.x+b.x),(a.y+b.y));\n\
    +      }\n+      ```\n\nIn this case, the statement\n\n```\nC3 = C1 + C2;\n```\n\
    \nis equivalent to\n\n```\nC3 = operator+(C1, C2);\n```\n\nIn most cases, we will\
    \ get the same results by the use of either a friend function or a member function.\
    \ Why then an alternative is made available? There are certain situations where\
    \ we would like to use a friend function rather than a member function. For instance,\
