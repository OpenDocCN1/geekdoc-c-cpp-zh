  md: "# 4.4 Call by Reference\n\nIn traditional C, a function call passes arguments\
    \ by value. The called function creates a new set of variables and copies the\
    \ values of arguments into them. The function does not have access to the actual\
    \ variables in the calling program and can only work on the copies of values.\
    \ This mechanism is fine if the function does not need to alter the values of\
    \ the original variables in the calling program. But, there may arise situations\
    \ where we would like to change the values of variables in the calling program.\
    \ For example, in bubble sort, we compare two adjacent elements in the list and\
    \ interchange their values if the first element is greater than the second. If\
    \ a function is used for bubble sort, then it should be able to alter the values\
    \ of variables in the calling function, which is not possible if the call-by-value\
    \ method is used.\n\nProvision of the reference variables in C++ permits us to\
    \ pass parameters to the functions by reference. When we pass arguments by reference,\
    \ the ‘formal’ arguments in the called function become aliases to the ‘actual’\
    \ arguments in the calling function. This means that when the function is working\
    \ with its own arguments, it is actually working on the original data. Consider\
    \ the following function:\n\n```\nvoid swap(int &a,int &b)    // a and b are reference\
    \ variables\n{\n    int t = a;              // Dynamic initialization\n    a =\
    \ b;\n    b = t;\n}\n```\n\nNow, if m and n are two integer variables, then the\
    \ function call\n\n```\nswap(m, n);\n```\n\nwill exchange the values of m and\
    \ n using their aliases (reference variables) a and b. Reference variables have\
