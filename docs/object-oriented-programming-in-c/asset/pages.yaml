    # 3.2 Tokens


    As we know, the smallest individual units in a program are known as tokens. C++
    has the following tokens:


    +   - Keywords

    +   - Identifiers

    +   - Constants

    +   - Strings

    +   - Operators


    A C++ program is written using these tokens, white spaces, and the syntax of the
    language. Most of the C++ tokens are basically similar to the C tokens with the
    exception of some additions and minor modifications.


    # 3.3 Keywords


    The keywords implement specific C++ language features. They are explicitly reserved
    identifiers and cannot be used as names for the program variables or other user-defined
    program elements.


    Table 3.1 gives the complete set of C++ keywords. Many of them are common to both
    C and C++. The ANSI C keywords are shown in boldface. Additional keywords have
    been added to the ANSI C keywords in order to enhance its features and make it
    an object-oriented language. ANSI C++ standards committee has added some more
    keywords to make the language more versatile. These are shown separately. Meaning
    and purpose of all C++ keywords are given in Appendix D.


    # 3.4 Identifiers and Constants


    Identifiers refer to the names of variables, functions, arrays, classes, etc.
    created by the programmer. They are the fundamental requirement of any language.
    Each language has its own rules for naming these identifiers. The following rules
    are common to both C and C++:


    +   - Only alphabetic characters, digits and underscores are permitted.

    +   - The name cannot start with a digit.

    +   - Uppercase and lowercase letters are distinct.

    +   - A declared keyword cannot be used as a variable name.'
