  md: "```\nvoid item :: putdata(void)\n{\n    cout << \"Number :\" << number << \"\
    \\n\";\n    cout << \"Cost   :\" << cost   << \"\\n\";\n}\n```\n\nSince these\
    \ functions do not return any value, their return-type is void. Function arguments\
    \ are declared using the ANSI prototype.\n\nThe member functions have some special\
    \ characteristics that are often used in the program development. These characteristics\
    \ are :\n\n+   - Several different classes can use the same function name. The\
    \ 'membership label' will resolve their scope.\n+   - Member functions can access\
    \ the private data of the class. A non-member function cannot do so. (However,\
    \ an exception to this rule is a friend function discussed later.)\n+   - A member\
    \ function can call another member function directly, without using the dot operator.\n\
    \n# Inside the Class Definition\n\nAnother method of defining a member function\
    \ is to replace the function declaration by the actual function definition inside\
    \ the class. For example, we could define the item class as follows:\n\n```\n\
    class item\n{\n    int number;\n    float cost;\n    public:\n        void getdata(int\
    \ a, float b);      // declaration\n        // inline function\n        void putdata(void)\
    \                // definition inside the class\n        {\n            cout <<\
    \ number  << \"\\n\";\n            cout << cost    << \"\\n\";\n        }\n};\n\
    ```\n\nWhen a function is defined inside a class, it is treated as an inline function.\
    \ Therefore, all the restrictions and limitations that apply to an inline function\
    \ are also applicable here. Normally, only small functions are defined inside\
    \ the class definition.\n\n# 5.5 A C++ Program with Class\n\nAll the details discussed\
    \ so far are implemented in Program 5.1."
