    # 3.6 User-Defined Data Types


    # Structures and Classes


    We have used user-defined data types such as struct and union in C. While these
    data types are legal in C++, some more features have been added to make them suitable
    for object-oriented programming. C++ also permits us to define another user-defined
    data type known as class which can be used, just like any other basic data type,
    to declare variables. The class variables are known as objects, which are the
    central focus of object-oriented programming. More about these data types is discussed
    later in Chapter 5.


    # Enumerated Data Type


    An enumerated data type is another user-defined type which provides a way for
    attaching names to numbers, thereby increasing comprehensibility of the code.
    The enum keyword (from C) automatically enumerates a list of words by assigning
    them values 0,1,2, and so on. This facility provides an alternative means for
    creating symbolic constants. The syntax of an enum statement is similar to that
    of the struct statement. Examples:


    ```

    enum shape{circle, square, triangle};

    enum colour{red, blue, green, yellow};

    enum position{off, on};

    ```


    The enumerated data types differ slightly in C++ when compared with those in ANSI
    C. In C++, the tag names shape, colour, and position become new type names. By
    using these tag names, we can declare new variables. Examples:


    ```

    shape ellipse;    // ellipse is of type shape

    colour background;    // background is of type colour

    ```


    ANSI C defines the types of enums to be ints. In C++, each enumerated data type
    retains its own separate type. This means that C++ does not permit an int value
    to be automatically converted to an enum value. Examples:


    ```

    colour background = blue;    // allowed

    colour background = 7;       // Error in C++

    colour background = (colour) 7;    // OK

    ```'
