  md: '# Output Operator


    The only statement in Program 2.1 is an output statement. The statement


    ```

    cout << "C++ is better than C.";

    ```


    causes the string in quotation marks to be displayed on the screen. This statement
    introduces two new C++ features, cout and <<. The identifier cout (pronounced
    as ‘C out’) is a predefined object that represents the standard output stream
    in C++. Here, the standard output stream represents the screen. It is also possible
    to redirect the output to other output devices. We shall later discuss streams
    in detail.


    The operator << is called the insertion or put to operator. It inserts (or sends)
    the contents of the variable on its right to the object on its left (Fig. 2.1).


    ![](img/58ab8f034e2127e80560390a921c2523_35_0.png)


    Fig. 2.1 ⇔ Output using insertion operator


    The object cout has a simple interface. If string represents a string variable,
    then the following statement will display its contents:


    ```

    cout << string;

    ```


    You may recall that the operator << is the bit-wise left-shift operator and it
    can still be used for this purpose. This is an example of how one operator can
    be used for different purposes, depending on the context. This concept is known
    as operator overloading, an important aspect of polymorphism. Operator overloading
    is discussed in detail in Chapter 7.'
