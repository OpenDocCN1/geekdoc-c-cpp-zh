  md: '# 9.2 Pointers


    Pointers is one of the key aspects of C++ language similar to that of C. As we
    know, pointers offer a unique approach to handle data in C and C++. We have seen
    some of the applications of pointers in Chapters 3 and 5. In this section, we
    shall discuss the rudiments of pointers and the special usage of them in C++.


    We know that a pointer is a derived data type that refers to another data variable
    by storing the variable''s memory address rather than data. A pointer variable
    defines where to get the value of a specific data variable instead of defining
    actual data.


    Like C, a pointer variable can also refer to (or point to) another pointer in
    C++. However, it often points to a data variable. Pointers provide an alternative
    approach to access other data objects.


    # Declaring and Initializing Pointers


    As discussed in Chapter 3, we can declare a pointer variable similar to other
    variables in C++. Like C, the declaration is based on the data type of the variable
    it points to. The declaration of a pointer variable takes the following form:


    ```

    data-type *pointer-variable;

    ```


    Here, pointer-variable is the name of the pointer, and the data-type refers to
    one of the valid C++ data types, such as int, char, float, and so on. The data-type
    is followed by an asterisk (*) symbol, which distinguishes a pointer variable
    from other variables to the compiler.


    > note

    > We can locate asterisk (*) immediately before the pointer variable, or between
    the data type and the pointer variable, or immediately after the data type. It
    does not cause any effect in the execution process.


    As we know, a pointer variable can point to any type of data available in C++.
    However, it is necessary to understand that a pointer is able to point to only
    one data type at the specific time. Let us declare a pointer variable, which points
    to an integer variable, as follows:


    ```

    int *ptr;

    ```


    Here, ptr is a pointer variable and points to an integer data type. The pointer
    variable, ptr, should contain the memory location of any integer variable. In
    the same manner, we can declare pointer variables for other data types also.'
