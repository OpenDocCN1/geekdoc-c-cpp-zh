  md: "# ## 6.10   const Objects\n\nWe may create and use constant objects using **const**\
    \ keyword before object declaration. For example, we may create X as a constant\
    \ object of the class **matrix** as follows:\n\n```\nconst matrix X(m,n); // object\
    \ X is constant\n```\n\nAny attempt to modify the values of m and n will generate\
    \ compile-time error. Further, a constant object can call only const member functions.\
    \ As we know, a const member is a function prototype or function definition where\
    \ the keyword const appears after the function's signature.\n\nWhenever const\
    \ objects try to invoke non-const member functions, the compiler generates errors.\n\
    \n# ## 6.11   Destructors\n\nA *destructor*, as the name implies, is used to destroy\
    \ the objects that have been created by a constructor. Like a constructor, the\
    \ destructor is a member function whose name is the same as the class name but\
    \ is preceded by a tilde. For example, the destructor for the class integer can\
    \ be defined as shown below:\n\n```\n~integer() { }\n```\n\nA destructor never\
    \ takes any argument nor does it return any value. It will be invoked implicitly\
    \ by the compiler upon exit from the program (or block or function as the case\
    \ may be) to clean up storage that is no longer accessible. It is a good practice\
    \ to declare destructors in a program since it releases memory space for future\
    \ use.\n\nWhenever new is used to allocate memory in the constructor, we should\
    \ use delete to free that memory. For example, the destructor for the matrix class\
    \ discussed above may be defined as follows:\n\n```\nmatrix :: ~matrix()\n{\n\
    \    for(int i=0; i<d1; i++)\n        delete p[i];\n    delete p;\n}\n```\n\n\
    This is required because when the pointers to objects go out of scope, a destructor\
    \ is not called implicitly."
