  md: "almost create a new language of our own by the creative use of the function\
    \ and operator overloading techniques. We can overload (give additional meaning\
    \ to) all the C++ operators except the following:\n\n+   - Class member access\
    \ operators (., .*).\n+   - Scope resolution operator (::).\n+   - Size operator\
    \ (sizeof).\n+   - Conditional operator (?:).\n\nThe excluded operators are very\
    \ few when compared to the large number of operators which qualify for the operator\
    \ overloading definition.\n\nAlthough the *semantics* of an operator can be extended,\
    \ we cannot change its *syntax*, the grammatical rules that govern its use such\
    \ as the number of operands, precedence and associativity. For example, the multiplication\
    \ operator will enjoy higher precedence than the addition operator. Remember,\
    \ when an operator is overloaded, its original meaning is not lost. For instance,\
    \ the operator +, which has been overloaded to add two vectors, can still be used\
    \ to add two integers.\n\n# 7.2 Defining Operator Overloading\n\nTo define an\
    \ additional task to an operator, we must specify what it means in relation to\
    \ the class to which the operator is applied. This is done with the help of a\
    \ special function, called *operator function*, which describes the task. The\
    \ general form of an operator function is:\n\n```\nreturn type classname :: operator\
    \ op(arglist)\n{\n    Function body        // task defined\n}\n```\n\nwhere *return\
    \ type* is the type of value returned by the specified operation and *op* is the\
    \ operator being overloaded. The *op* is preceded by the keyword **operator**.\
    \ **operator op** is the function name.\n\nOperator functions must be either member\
    \ functions (non-static) or friend functions. A basic difference between them\
    \ is that a friend function will have only one argument for unary operators and\
    \ two for binary operators, while a member function has no arguments for unary\
    \ operators and only one for binary operators. This is because the object used\
    \ to invoke the member function is passed implicitly and therefore is available\
    \ for the member function. This is not the case with **friend** functions. Arguments\
    \ may be passed either by value or by reference. Operator functions are declared\
    \ in the class using prototypes as follows:"
