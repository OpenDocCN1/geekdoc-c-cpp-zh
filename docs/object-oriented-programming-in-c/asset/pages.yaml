    \ x of type item. In C++, the class variables are known as objects. Therefore,\
    \ x is called an object of type item. We may also declare more than one object\
    \ in one statement. Example:\n\n```\nitem x, y, z;\n```\n\nThe declaration of\
    \ an object is similar to that of a variable of any basic type. The necessary\
