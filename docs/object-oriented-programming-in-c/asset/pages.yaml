  md: 'the task of allocating and freeing the memory in a better and easier way. Since
    these operators manipulate memory on the free store, they are also known as free
    store operators.


    An object can be created by using **new**, and destroyed by using **delete**,
    as and when required. A data object created inside a block with **new**, will
    remain in existence until it is explicitly destroyed by using **delete**. Thus,
    the lifetime of an object is directly under our control and is unrelated to the
    block structure of the program.


    The **new** operator can be used to create objects of any type. It takes the following
    general form:


    ```

    pointer-variable = new data-type;

    ```


    Here, *pointer-variable* is a pointer of type *data-type*. The **new** operator
    allocates sufficient memory to hold a data object of type *data-type* and returns
    the address of the object. The *data-type* may be any valid data type. The *pointer-variable*
    holds the address of the memory space allocated. Examples:


    ```

    p = new int;

    q = new float;

    ```


    where **p** is a pointer of type **int** and **q** is a pointer of type **float**.
    Here, **p** and **q** must have already been declared as pointers of appropriate
    types. Alternatively, we can combine the declaration of pointers and their assignments
    as follows:


    ```

    int *p = new int;

    float *q = new float;

    ```


    Subsequently, the statements


    ```

    *p = 25;

    *q = 7.5;

    ```


    assign 25 to the newly created **int** object and 7.5 to the **float** object.


    We can also initialize the memory using the **new** operator. This is done as
    follows:


    ```

    pointer-variable = new data-type(value);

    ```


    Here, value specifies the initial value. Examples:


    ```

    int *p = new int(25);

    float *q = new float(7.5);

    ```'
