    \ a class some meaningful name, such as item. This name now becomes a new type\
    \ identifier that can be used to declare instances of that class type. The class\
    \ item contains two data members and two function members. The data members are\
    \ private by default while both the functions are public by declaration. The function\
    \ getdata() can be used to assign values to the member variables number and cost,\
    \ and putdata() for displaying their values. These functions provide the only\
    \ access to the data members from outside the class. This means that the data\
    \ cannot be accessed by any function that is not a member of the class item. Note\
    \ that the functions are declared, not defined. Actual function definitions will\
    \ appear later in the program. The data members are usually declared as private\
    \ and the member functions as public. Figure 5.2 shows two different notations\
    \ used by the OOP analysts to represent a class.\n\n# Creating Objects\n\nRemember\
    \ that the declaration of item as shown above does not define any objects of item\
    \ but only specifies what they will contain. Once a class has been declared, we\
    \ can create variables of that type by using the class name (like any other built-in\
    \ type variable). For example,"
