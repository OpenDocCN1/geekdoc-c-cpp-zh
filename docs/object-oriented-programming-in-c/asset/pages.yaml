  md: 'A program spread over multiple files can be compiled as follows:


    ```

    cc file1.C file2.o

    ```


    The statement compiles only the file file1.C and links it with the previously
    compiled file2.o file. This is useful when only one of the files needs to be modified.
    The files that are not modified need not be compiled again.


    # Turbo C++ and Borland C++


    Turbo C++ and Borland C++ provide an integrated program development environment
    under MS DOS. They provide a built-in editor and a menu bar which includes options
    such as File, Edit, Compile and Run.


    We can create and save the source files under the File option, and edit them under
    the Edit option. We can then compile the program under the Compile option and
    execute it under the Run option. The Run option can be used without compiling
    the source code. In this case, the RUN command causes the system to compile, link
    and run the program in one step. Turbo C++ being the most popular compiler, creation
    and execution of programs under Turbo C++ system are discussed in detail in Appendix
    B.


    # Visual C++


    It is a Microsoft application development system for C++ that runs under Windows.
    Visual C++ is a visual programming environment in which basic program components
    can be selected through menu choices, buttons, icons, and other predetermined
    methods. Development and execution of C++ programs under Windows are briefly explained
    in Appendix C.


    # SUMMARY


    +   ↔ C++ is a superset of C language.


    +   ↔ C++ adds a number of object-oriented features such as objects, inheritance,
    function overloading and operator overloading to C. These features enable building
    of programs with clarity, extensibility and ease of maintenance.


    +   ↔ C++ can be used to build a variety of systems such as editors, compilers,
    databases, communication systems, and many more complex real-life application
    systems.


    +   ↔ C++ supports interactive input and output features and introduces a new
    comment symbol // that can be used for single line comments. It also supports
    C-style comments.


    +   ↔ Like C programs, execution of all C++ programs begins at main() function
    and ends at return() statement. The header file iostream should be included at
    the beginning of all programs that use input/output operations.'
