  md: 'in the function call. Default values are specified when the function is declared.
    The compiler looks at the prototype to see how many arguments a function uses
    and alerts the program for possible default values. Here is an example of a prototype
    (i.e. function declaration) with default values:


    ```

    float amount(float principal,int period,float rate=0.15);

    ```


    The default value is specified in a manner syntactically similar to a variable
    initialization. The above prototype declares a default value of 0.15 to the argument
    rate. A subsequent function call like


    ```

    value = amount(5000,7);      // one argument missing

    ```


    passes the value of 5000 to principal and 7 to period and then lets the function
    use default value of 0.15 for rate. The call


    ```

    value = amount(5000,5,0.12);      // no missing argument

    ```


    passes an explicit value of 0.12 to rate.


    A default argument is checked for type at the time of declaration and evaluated
    at the time of call. One important point to note is that only the trailing arguments
    can have default values and therefore we must add defaults from right to left.
    We cannot provide a default value to a particular argument in the middle of an
    argument list. Some examples of function declaration with default values are:


    ```

    int mul(int i, int j=5, int k=10);      // legal

    int mul(int i=5, int j);                // illegal

    int mul(int i=0, int j, int k=10);      // illegal

    int mul(int i=2, int j=5, int k=10);    // legal

    ```


    Default arguments are useful in situations where some arguments always have the
    same value. For instance, bank interest may remain the same for all customers
    for a particular period of deposit. It also provides a greater flexibility to
    the programmers. A function can be written with more parameters than are required
    for its most common application. Using default arguments, a programmer can use
    only those arguments that are meaningful to a particular situation. Program 4.2
    illustrates the use of default arguments.


