    \ expressions and produces bool type results. Examples:\n\n```\na>b && x==10\n\
    x==10 || y==5\n```\n\n# Bitwise Expressions\n\nBitwise Expressions are used to\
    \ manipulate data at bit level. They are basically used for testing or shifting\
    \ bits. Examples:\n\n```\nx << 3    // Shift three bit position to left\ny >>\
    \ 1    // Shift one bit position to right\n```\n\nShift operators are often used\
    \ for multiplication and division by powers of two.\n\nANSI C++ has introduced\
    \ what are termed as operator keywords that can be used as alternative representation\
    \ for operator symbols. Operator keywords are given in Chapter 16.\n\n# 3.20 Special\
    \ Assignment Expressions\n\n# Chained Assignment\n\n```\nx = (y = 10);\n    or\n\
    x = y = 10;\n```\n\nFirst 10 is assigned to y and then to x.\n\nA chained statement\
    \ cannot be used to initialize variables at the time of declaration. For instance,\
    \ the statement\n\n```\nfloat a = b = 12.34;    // wrong\n```\n\nis illegal. This\
    \ may be written as\n\n```\nfloat a=12.34, b=12.34    // correct\n```\n\n# Embedded\
    \ Assignment\n\n```\nx = (y = 50) + 10;\n```"
