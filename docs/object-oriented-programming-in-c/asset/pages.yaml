- pgno: 58
  md: '# 3.9 Type Compatibility


    C++ is very strict with regard to type compatibility as compared to C. For instance,
    C++ defines int, short int, and long int as three different types. They must be
    cast when their values are assigned to one another. Similarly, unsigned char,
    char, and signed char are considered as different types, although each of these
    has a size of one byte. In C++, the types of values must be the same for complete
    compatibility, or else, a cast must be applied. These restrictions in C++ are
    necessary in order to support function overloading where two functions with the
    same name are distinguished using the type of function arguments.


    Another notable difference is the way char constants are stored. In C, they are
    stored as ints, and therefore,


    ```

    sizeof (''x'')

    ```


    is equivalent to


    ```

    sizeof(int)

    ```


    in C. In C++, however, char is not promoted to the size of int and therefore


    ```

    sizeof(''x'')

    ```


    equals


    ```

    sizeof(char)

    ```


    # 3.10 Declaration of Variables


    We know that, in C, all variables must be declared before they are used in executable
    statements. This is true with C++ as well. However, there is a significant difference
    between C and C++ with regard to the place of their declaration in the program.
    C requires all the variables to be defined at the beginning of a scope. When we
    read a C program, we usually come across a group of variable declarations at the
    beginning of each scope level. Their actual use appears elsewhere in the scope,
    sometimes far away from the place of declaration. Before using a variable, we
    should go back to the beginning of the program to see whether it has been declared
    and, if so, of what type.


    C++ allows the declaration of a variable anywhere in the scope. This means that
    a variable can be declared right at the place of its first use. This makes the
    program much easier to write and reduces the errors that may be caused by having
    to scan back and forth. It also makes the program easier to understand because
    the variables are declared in the context of their use.'
  merge: -1
  img_proc: true
