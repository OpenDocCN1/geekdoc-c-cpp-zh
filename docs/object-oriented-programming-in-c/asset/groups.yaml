    # 7.8 Type Conversions


    We know that when constants and variables of different types are mixed in an expression,
    C applies automatic type conversion to the operands as per certain rules. Similarly,
    an assignment operation also causes the automatic type conversion. The type of
    data to the right of an assignment operator is automatically converted to the
    type of the variable on the left. For example, the statements


    ```

    int m;

    float x = 3.14159;

    m = x;

    ```


    convert x to an integer before its value is assigned to m. Thus, the fractional
    part is truncated. The type conversions are automatic as long as the data types
    involved are built-in types.


