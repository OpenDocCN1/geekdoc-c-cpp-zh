    \                // 非法\nint mul(int i=0, int j, int k=10);      // 非法\nint mul(int\
    \ i=2, int j=5, int k=10);    // 合法\n```\n\n在某些参数始终具有相同值的情况下，提供默认参数很有用。例如，银行利息在特定存款期间对所有客户可能保持不变。它还为程序员提供了更大的灵活性。函数可以用比其最常见应用所需的更多的参数编写。使用默认参数，程序员只能使用对特定情况有意义的参数。程序\
