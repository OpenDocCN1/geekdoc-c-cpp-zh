    the data type double.


    To use the math library functions, we must include the header file math.h in conventional
    C++ and cmath in ANSI C++.


    # SUMMARY


    +   It is possible to reduce the size of program by calling and using functions
    at different places in the program.


    +   In C++ the main() returns a value of type int to the operating system. Since
    the return type of functions is int by default, the keyword int in the main()
    header is optional. Most C++ compilers issue a warning, if there is no return
    statement.'
  - '[PAGE 104]


    Function prototyping gives the compiler the details about the functions such as
    the number and types of arguments and the type of return values.


    Reference variables in C++ permit us to pass parameters to the functions by reference.
    A function can also return a reference to a variable.


    When a function is declared inline the compiler replaces the function call with
    the respective function code. Normally, a small size function is made as inline.


    The compiler may ignore the inline declaration if the function declaration is
    too long or too complicated and hence compile the function as a normal function.


    C++ allows us to assign default values to the function parameters when the function
    is declared. In such a case we can call a function without specifying all its
    arguments. The defaults are always added from right to left.


    In C++, an argument to a function can be declared as const, indicating that the
    function should not modify the argument.


    C++ allows function overloading. That is, we can have more than one function with
    the same name in our program. The compiler matches the function call with the
    exact function code by checking the number and type of the arguments.


    C++ supports two new types of functions, namely friend functions and virtual functions.


    Many mathematical computations can be carried out using the library functions
    supported by the C++ standard library.


