    Object-oriented programming is not the right of any particular language. Like
    structured programming, OOP concepts can be implemented using languages such as
    C and Pascal. However, programming becomes clumsy and may generate confusion when
    the programs grow large. A language that is specially designed to support the
    OOP concepts makes it easier to implement them.


    The languages should support several of the OOP concepts to claim that they are
    object-oriented. Depending upon the features they support, they can be classified
    into the following two categories:


    +   1. Object-based programming languages, and

    +   2. Object-oriented programming languages.


    *Object-based programming* is the style of programming that primarily supports
    encapsulation and object identity. Major features that are required for object-based
    programming are:


    +   - Data encapsulation

    +   - Data hiding and access mechanisms

    +   - Automatic initialization and clear-up of objects

    +   - Operator overloading


    Languages that support programming with objects are said to be object-based programming
    languages. They do not support inheritance and dynamic binding. Ada is a typical
    object-based programming language.


    *Object-oriented programming* incorporates all of object-based programming features
    along with two additional features, namely, inheritance and dynamic binding. Object-oriented
    programming can therefore be characterized by the following statement:


    ```

    Object-based features + inheritance + dynamic binding

    ```


    Languages that support these features include C++, Smalltalk, Object Pascal and
    Java. There are a large number of object-based and object-oriented programming
    languages. Table 1.1 lists some popular general purpose OOP languages and their
    characteristics.'
