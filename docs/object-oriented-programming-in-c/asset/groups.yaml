  mdcn: "\n\n## 3.14 作用域解析运算符\n\n像 C 一样，C++ 也是一个块结构语言。块和作用域可以用于构造程序。我们知道同一个变量名可以在不同的块中具有不同的含义。变量的作用域从其声明点延伸到包含该声明的块的末尾。在一个块内声明的变量被称为该块的局部变量。考虑以下程序段：\n\
    \n```\n....\n....\n{\n    int x = 10;\n    ....\n    ....\n}\n....\n....\n{\n\
    \    int x = 1;\n    ....\n    ....\n}\n```\n\n两个 x 的声明引用了包含不同值的两个不同的内存位置。第二块中的语句不能引用第一块中声明的变量\
    \ x，反之亦然。C++ 中的块通常是嵌套的。例如，以下风格很常见：\n\n![](img/58ab8f034e2127e80560390a921c2523_63_0.png)\n\
    \nBlock2 包含在 block1 中。请注意，内部块中的声明会隐藏外部块中同名变量的声明，因此，每个 x 的声明都会使其引用不同的数据对象。在内部块内，变量\
    \ x 将引用其中声明的数据对象。\n\n在 C 中，变量的全局版本在内部块中无法访问。C++ 通过引入一个新的运算符 :: 来解决这个问题，称为作用域解析运算符。它可用于揭露隐藏的变量。其形式如下：\n\
    \n```\n:: variable-name\n```\n\n该运算符允许访问变量的全局版本。例如，::count 表示变量 count 的全局版本（而不是该块中声明的局部变量\
    \ count）。程序 3.1 演示了此功能：\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\
    int n = 10;        // global n\n\nint main()\n{\n        int n = 20;    // n redeclared,\
    \ local to main\n        {\n                int k = n;\n                int n\
    \ = 30;    // n declared again\n                              // local to inner\
    \ block\n\n                cout << \"We are in inner block\\n\";\n           \
    \     cout << \"k = \" << k << \"\\n\";\n                cout << \"n = \" << n\
