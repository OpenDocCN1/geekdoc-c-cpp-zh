    # 3.19 Expressions and Their Types


    An expression is a combination of operators, constants and variables arranged
    as per the rules of the language. It may also include function calls which return
    values. An expression may consist of one or more operands, and zero or more operators
    to produce a value. Expressions may be of the following seven types:


    +   - Constant expressions

    +   - Integral expressions

    +   - Float expressions

    +   - Pointer expressions

    +   - Relational expressions

    +   - Logical expressions

    +   - Bitwise expressions


    An expression may also use combinations of the above expressions. Such expressions
    are known as *compound expressions*.


    # Constant Expressions


    Constant Expressions consist of only constant values. Examples:


    ```

    15

    20 + 5 / 2.0

    ''x''

    ```'
  - '[PAGE 72]


    # Integral Expressions


    Integral Expressions are those which produce integer results after implementing
    all the automatic and explicit type conversions. Examples:


    ```

    m

    m * n - 5

    m * ''x''

    5 + int(2.0)

    ```


    where m and n are integer variables.


    # Float Expressions


    Float Expressions are those which, after all conversions, produce floating-point
    results. Examples:


    ```

    x + y

    x * y / 10

    5 + float(10)

    10.75

    ```


    where x and y are floating-point variables.


    # Pointer Expressions


    Pointer Expressions produce address values. Examples:


    ```

    &m

    ptr

    ptr + 1

    "xyz"

    ```


    where m is a variable and ptr is a pointer.


    # Relational Expressions


    Relational Expressions yield results of type bool which takes a value true or
    false. Examples:


    ```

    x <= y

    a+b == c+d

    m+n > 100

    ```


    When arithmetic expressions are used on either side of a relational operator,
    they will be evaluated first and then the results compared. Relational expressions
    are also known as Boolean expressions.'
