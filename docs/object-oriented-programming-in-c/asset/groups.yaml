    (y = 50) is an assignment expression known as embedded assignment. Here, the value
    50 is assigned to y and then the result 50+10 = 60 is assigned to x. This statement
    is identical to


    ```

    y = 50;

    x = y + 10;

    ```


    # Compound Assignment


    Like C, C++ supports a compound assignment operator, which is a combination of
    the assignment operator with a binary arithmetic operator. For example, the simple
    assignment statement


    ```

    x = x + 10;

    ```


    may be written as


    ```

    x += 10;

    ```


    The operator += is known as compound assignment operator or short-hand assignment
    operator. The general form of the compound assignment operator is:


    ```

    variable1 op= variable2;

    ```


    where op is a binary arithmetic operator. This means that


    ```

    variable1 = variable1 op variable2;

    ```


    # 3.21  Implicit Conversions


    We can mix data types in expressions. For example,


    ```

    m = 5+2.75;

    ```


    is a valid statement. Wherever data types are mixed in an expression, C++ performs
    the conversions automatically. This process is known as implicit or automatic
    conversion.


    When the compiler encounters an expression, it divides the expression into sub-expressions
    consisting of one operator and one or two operands. For a binary operator, if
    the operands type differ, the compiler converts one of them to match with the
    other, using the rule that the smaller type is converted to the wider type. For
    example, if one of the operand is an int and the other is a float, the int is
    converted into a float because a float is wider than an int. The “water-fall”
    model shown in Fig. 3.3 illustrates this rule.'
