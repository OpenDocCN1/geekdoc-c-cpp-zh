    \ = amount(5000,5,0.12);      // 没有缺少的参数\n```\n\n将显式值 0.12 传递给 rate。\n\n默认参数在声明时检查类型，在调用时求值。需要注意的一个重要点是，只有尾部参数可以有默认值，因此我们必须从右到左添加默认值。我们不能为参数列表中间的某个特定参数提供默认值。以下是带有默认值的函数声明的一些示例：\n\
