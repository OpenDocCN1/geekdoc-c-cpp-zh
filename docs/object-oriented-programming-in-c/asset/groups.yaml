    \ vector()\n{\n    for(int i=0; i<size; i++)\n        v[i] = 0;\n}\n\nvector ::\
    \ vector(int *x)\n{\n    for(int i=0; i<size; i++)\n        v[i] = x[i];\n}\n\
    ```\n\n```\nvector operator *(int a, vector b)\n{\n    vector c;\n\n    for(int\
