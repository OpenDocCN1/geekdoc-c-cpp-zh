  mdcn: "\n> note\n> 内联展开使程序运行更快，因为函数调用和返回的开销被消除了。然而，它会使程序占用更多内存，因为定义内联函数的语句会在函数被调用的每个位置被复制。因此，需要进行权衡。\n\
    \n程序 4.1 说明了内联函数的使用。\n\n## INLINE FUNCTIONS\n\n```\n#include <iostream>\nusing\
