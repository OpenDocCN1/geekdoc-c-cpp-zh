    \ 20\nn = 30\n::n = 10\n\nWe are in outer block\nn = 20\n::n = 10\n```\n\n在上面的程序中，变量\
    \ n 在三个地方声明，即在 main() 函数外部、在 main() 内部以及在内部块内部。\n\n> note\n> 需要注意的是 ::n 将始终引用全局\
