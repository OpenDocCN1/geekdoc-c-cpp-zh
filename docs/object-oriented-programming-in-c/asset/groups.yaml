    \ xxx\nAge: 45\n\nManager2\nName: yyy\nAge: 37\n\nManager3\nName: zzz\nAge: 50\n\
    ```\n\n## 5.14 对象作为函数参数\n\n与其他任何数据类型一样，对象也可以作为函数参数使用。这可以通过两种方式实现：\n\n- 将整个对象的副本传递给函数。\n\
    - 仅将对象的地址传递给函数。\n\n第一种方法称为按值传递。由于传递的是对象的副本，因此函数内部对对象所做的任何更改都不会影响用于调用函数的对象。第二种方法称为按引用传递。当传递对象的地址时，被调用的函数将直接作用于调用中使用的实际对象。这意味着函数内部对对象所做的任何更改都会反映在实际对象上。按引用传递方法效率更高，因为它只需传递对象的地址，而不必传递整个对象。\n\
    \n程序 5.7 演示了对象作为函数参数的用法。它以小时和分钟的格式执行时间的加法。\n\n### 对象作为参数\n\n```cpp\n#include <iostream>\n\
    using namespace std;\nclass time \n{\n\tint hours;\n\tint minutes;\npublic:\n\t\
    void gettime(int h, int m) \n\t{\n\t\thours = h; minutes = m; \n\t}\n\tvoid puttime(void)\n\
    \t{\n\t\tcout << hours << \" hours and \";\n\t\tcout << minutes << \" minutes\
    \ \" << \"\\n\";\n\t}\n\tvoid sum(time, time); // declaration with objects as\
    \ arguments\n};\nvoid time :: sum(time t1, time t2) // t1, t2 are objects\n{\n\
    \tminutes = t1.minutes + t2.minutes;\n\thours = minutes/60;\n\tminutes = minutes%60;\n\
    \thours = hours + t1.hours + t2.hours;\n}\nint main()\n{\n\ttime T1, T2, T3;\n\
    \tT1.gettime(2,45); // get T1\n\tT2.gettime(3,30); // get T2\n\tT3.sum(T1, T2);\
    \ // T3=T1+T2\n\tcout << \"T1 = \"; T1.puttime(); // display T1\n\tcout << \"\
    T2 = \"; T2.puttime(); // display T2\n\tcout << \"T3 = \"; T3.puttime(); // display\
    \ T3\n\treturn 0;\n}\n```\n\n**程序 5.7**\n\n为了使外部函数对某个类“友好”，我们只需将该函数声明为类的友元，如下所示：\n\
    \n```\nclass ABC\n{\n.....\n.....\npublic:\n.....\n.....\n.....\nvoid xyz(void);\
    \ // declaration\n};\n```\n\n函数声明前应加上关键字 friend。该函数在程序的其他地方像普通 C++ 函数一样定义。函数定义既不使用关键字\
    \ friend，也不使用作用域运算符 ::。使用关键字 friend 声明的函数称为友元函数。一个函数可以在任意数量的类中被声明为友元。友元函数虽然不是成员函数，但可以完全访问类的私有成员。\n\
    \n- 它不在其被声明为友元的类的作用域内。\n- 由于它不在该类的作用域内，因此不能使用该类的对象来调用它。\n- 它可以像普通函数一样在无需任何对象的情况下被调用。\n\
    - 与成员函数不同，它不能直接访问成员名称，必须使用对象名和点成员运算符来访问每个成员名称（例如 A.x）。\n- 它可以声明在类的 public 或 private\
    \ 部分，而不影响其含义。\n- 通常，它以对象作为参数。\n\n友元函数通常用于运算符重载，这将在后面讨论。\n\n程序 5.8 演示了友元函数的用法。\n\
    \n```\n#include <iostream>\nusing namespace std;\n\nclass sample\n{\n    int a;\n\
    \    int b;\n    public:\n        void setvalue() {a=25; b=40; }\n        friend\
    \ float mean(sample s);\n};\nfloat mean(sample s)\n{\n    return float(s.a + s.b)/2.0;\n\
    }\n\nint main()\n{\n    sample X;    // object X\n    X.setvalue();\n    cout\
    \ << \"Mean value = \" << mean(X) << \"\\n\";\n\n    return 0;\n}\n```\n\n程序 5.8\
    \ 的输出为：\n\n```\nMean value = 32.5\n```\n\n注意\n\n> 友元函数通过点运算符以及传递给它的对象来访问类变量 a\
    \ 和 b。函数调用 mean(X) 按值将对象 X 传递给友元函数。\n\n一个类的成员函数可以是另一个类的友元函数。在这种情况下，它们使用作用域运算符进行定义，如下所示：\n\
    \n```\nclass X\n{\n    .....\n    .....\n    int fun1();    // member function\
    \ of X\n    .....\n};\n\nclass Y\n{\n    .....\n    .....\n    friend int X ::\
    \ fun1();      // fun1() of X\n                                 // is friend of\
    \ Y\n    .....\n};\n```\n\n函数 **fun1()** 是 **类 X** 的成员，也是类 **Y** 的一个**友元**。\n\n\
    我们还可以将一个类的所有成员函数声明为另一个类的友元函数。在这种情况下，该类称为**友元类**。这可以如下指定：\n\n```\nclass Z\n{\n\
    \    .....\n    friend class X;    // all member functions of X are\n        \
    \              // friends to Z\n};\n```\n\n程序 5.9 演示了友元函数如何充当类之间的桥梁。\n\n### 对两个类友好的函数\n\
    \n```\n#include <iostream>\n\nusing namespace std;\n\nclass ABC;    // Forward\
    \ declaration\n//--------------------------------------------------//\nclass XYZ\n\
    {\n    int x;\npublic:\n    void setvalue(int i) {x = i;}\n    friend void max(XYZ,\
    \ ABC);\n};\n//--------------------------------------------------//\nclass ABC\n\
    {\n    int a;\npublic:\n    void setvalue(int i) {a = i;}\n    friend void max(XYZ,\
    \ ABC);\n};\n```\n\n### 交换类的私有数据\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nclass class_2;\n\nclass class_1\n{\n\tint value1;\npublic:\n\tvoid indata(int\
    \ a) {value1 = a;}\n\tvoid display(void) {cout << value1 << \"\\n\";}\n\tfriend\
    \ void exchange(class_1 &, class_2 &);\n};\n\nclass class_2\n{\n\tint value2;\n\
    public:\n\tvoid indata(int a) {value2 = a;}\n\tvoid display(void) {cout << value2\
    \ << \"\\n\";}\n\tfriend void exchange(class_1 &, class_2 &);\n};\n\nvoid exchange(class_1\
    \ &x, class_2 &y)\n{\n\tint temp = x.value1;\n\tx.value1 = y.value2;\n\ty.value2\
    \ = temp;\n}\n\nint main()\n{\n\tclass_1 C1;\n\tclass_2 C2;\n\tC1.indata(100);\n\
    \tC2.indata(200);\n\tcout << \"Values before exchange\" << \"\\n\";\n\tC1.display();\n\
    \tC2.display();\n\texchange(C1, C2);      // swapping\n\n\tcout << \"Values after\
    \ exchange \" << \"\\n\";\n\tC1.display();\n\tC2.display();\n\n\treturn 0;\n}\n\
    ```\n\n**程序 5.10**\n\n对象 x 和 y 分别是 C1 和 C2 的别名。以下语句\n\n```\nint temp = x.value1;\n\
    x.value1 = y.value2;\ny.value2 = temp;\n```\n\n直接修改了 class_1 和 class_2 中声明的 value1\
    \ 和 value2 的值。\n\n以下是程序 5.10 的输出：\n\n```\nValues before exchange\n100\n200\nValues\
    \ after exchange\n200\n100\n```\n\n## 5.16 返回对象\n\n函数不仅可以接收对象作为参数，还可以返回对象。程序 5.11\
    \ 中的示例说明了如何（在函数内部）创建对象并将其返回给另一个函数。\n\n### 返回对象\n\n```cpp\n#include <iostream>\n\
    \nusing namespace std;\n\nclass complex      // x + iy form\n{\n    float x; \
    \       // real part\n    float y;        // imaginary part\npublic:\n    void\
    \ input(float real, float imag)\n    { x = real; y = imag; }\n    friend complex\
    \ sum(complex, complex);\n    void show(complex);\n};\n\ncomplex sum(complex c1,\
    \ complex c2)\n{\n    complex c3;            // objects c3 is created\n    c3.x\
    \ = c1.x + c2.x;\n    c3.y = c1.y + c2.y;\n    return(c3);            // returns\
    \ object c3\n}\n\nvoid complex :: show(complex c)\n{\n    cout << c.x << \" +\
    \ j\" << c.y << \"\\n\";\n}\n\nint main()\n{\n    complex A, B, C;\n\n    A.input(3.1,\
    \ 5.65);\n    B.input(2.75, 1.2);\n\n    C = sum(A, B);          // C = A + B\n\
