  mdcn: "\n\nC 结构思想的扩展。它是创建和实现用户定义数据类型的一种新方法。我们将在本章中通过先回顾 C 语言中的传统结构，然后再介绍类如何设计、实现和应用，来讨论类的概念。\n\
    \n## 5.2  C 结构回顾\n\n我们知道 C 语言的独特特性之一就是结构。它们提供了一种将不同类型的数据打包在一起的方法。结构是处理一组逻辑相关数据项的便捷工具。它是一种用户定义的数据类型，具有一个*模板*，用于定义其数据属性。一旦结构类型被定义，我们就可以使用类似于内置类型声明的声明来创建该类型变量。例如，考虑以下声明：\n\
    \n```\n```c\nstruct student\n{\n        char   name[20];\n        int    roll_number;\n\
    \        float  total_marks;\n};\n```\n```\n\n关键字 struct 将 student 声明为一种新的数据类型，可以容纳三种不同数据类型的字段。这些字段被称为*结构成员*或*元素*。标识符\
    \ student，被称为*结构名*或*结构标签*，可用于创建 student 类型的变量。示例：\n\n```\n```c\nstruct student\
    \ A;   // C declaration\n```\n```\n\nA 是 student 类型的一个变量，并且具有模板所定义的三个成员变量。成员变量可以通过*点*或*点运算符*访问，如下所示：\n\
    \n```\n```c\nstrcpy(A.name, \"John\");\nA.roll_number = 999;\nA.total_marks =\
    \ 595.5;\nfinal_total = A.total_marks + 5;\n```\n```\n\n结构可以具有数组、指针或结构作为成员。\n\n\
    ## C 结构的局限性\n\n标准 C 不允许将 struct 数据类型像内置类型一样处理。例如，考虑以下结构：\n\n```\n```cpp\nstruct\
    \ complex\n{\n    float x;\n    float y;\n};\nstruct complex c1, c2, c3;\n```\n\
    ```\n\n复数 c1、c2 和 c3 可以通过点运算符轻松地赋予值，但我们不能将两个复数相加或从一个中减去另一个。例如，\n\n```\n```cpp\n\
    c3 = c1 + c2;\n```\n```\n\n在 C 中是非法的。\n\nC 结构的另一个重要局限性是它们不允许*数据隐藏*。结构成员可以直接被结构变量的任何函数在它们的范围内访问。换句话说，结构成员是公共成员。\n\
    \n## 对结构的扩展\n\nC++ 支持 C 中定义的结构的全部特性。但 C++ 进一步扩展了其功能以适应其面向对象的理念。它试图尽可能地使用户定义的类型接近内置数据类型，并且还提供隐藏数据的功能，这是面向对象编程的主要原则之一。*继承*，一种使一种类型能够继承其他类型的特征的机制，也得到了\
    \ C++ 的支持。\n\n在 C++ 中，结构可以同时具有变量和函数作为成员。它还可以将某些成员声明为 'private'，以便外部函数无法直接访问它们。\n\
    \n在 C++ 中，结构名称是独立的，可以像其他任何类型名称一样使用。换句话说，在结构变量的声明中可以省略关键字 struct。例如，我们可以这样声明 student\
    \ 变量 A\n\n```\n```cpp\nstudent A;    // C++ declaration\n```\n```\n\n记住，这在 C 中是错误的。\n\
    \nC++ 将所有这些扩展合并到另一种用户定义类型中，即类。C++ 中结构和类之间在语法上几乎没有区别，因此它们可以在少量修改下互换使用。由于类是 C++\
    \ 中特别引入的数据类型，大多数 C++ 程序员倾向于使用结构仅保存数据，而使用类保存数据和函数。因此，我们将不再进一步讨论结构。\n\n> **注意：**\
    \ C++ 中结构和类之间的唯一区别是，默认情况下类的成员是*私有*的，而默认情况下结构的成员是*公有*的。\n\n## 5.3 指定一个类\n\n类是将数据及其相关函数绑定在一起的一种方式。它允许数据（和函数）根据需要对外部使用进行隐藏。在定义类时，我们正在创建一个新的抽象数据类型，可以像任何其他内置数据类型一样对待。一般来说，类规范有两个部分：\n\
    \n- 1. 类声明\n- 2. 类函数定义\n\n类声明描述了其成员的类型和作用域。类函数定义描述了类函数是如何实现的。\n\n类声明的一般形式为：\n\n\
    ```\nclass class_name\n{\n    private:\n        variable declarations;\n     \
    \   function declarations;\n    public:\n        variable declarations;\n    \
    \    function declaration;\n};\n```\n\n类声明类似于 struct 声明。关键字 class 指定其后跟随的是名为 class_name\
    \ 的抽象数据。类的主体用大括号括起来并以分号结束。类主体包含变量和函数的声明。这些函数和变量统称为类成员。它们通常分为两个部分，即 private 和 public，以表示哪些成员是私有的，哪些是公有的。关键字\
    \ private 和 public 被称为可见性标签。请注意，这些关键字后面跟着一个冒号。\n\n已声明为私有的类成员只能从类内部访问。另一方面，公共成员也可以从类外部访问。数据隐藏（使用\
    \ private 声明）是面向对象编程的关键特性。使用关键字 private 是可选的。默认情况下，类的成员是私有的。如果两个标签都缺失，则默认情况下所有成员都是私有的。这样的类完全对外部世界隐藏，没有任何用途。\n\
    \n在类内部声明的变量称为数据成员，函数称为成员函数。只有成员函数可以访问私有数据成员和私有函数。然而，公共成员（函数和数据）可以从类外部访问。这在图 5.1\
    \ 中有所说明。将数据和函数绑定到单个类类型变量中称为封装。\n\n![](img/58ab8f034e2127e80560390a921c2523_113_0.png)\n\
    \n图 5.1 ⇔ 类中的数据隐藏\n\n## 一个简单的类示例\n\n典型的类声明看起来像：\n\n```\nclass item\n{\n    int\
    \ number;                // variables declaration\n    float cost;           \
    \     // private by default\npublic:\n    void getdata(int a, float b);  // functions\
    \ declaration\n    void putdata(void);            // using prototype\n};// ends\
    \ with semicolon\n```\n\n我们通常给类一个有意义的名称，例如 item。此名称现在成为一个新的类型标识符，可用于声明该类类型的实例。类\
    \ item 包含两个数据成员和两个函数成员。数据成员默认是私有的，而两个函数通过声明是公有的。函数 getdata() 可用于为成员变量 number 和\
    \ cost 分配值，而 putdata() 用于显示它们的值。这些函数提供了从类外部访问数据成员的唯一途径。这意味着数据不能被任何不是 item 类成员的函数访问。请注意，函数是声明的，而不是定义的。实际的函数定义将出现在程序的后面。数据成员通常声明为私有，成员函数声明为公有。图\
    \ 5.2 显示了面向对象分析人员用来表示类的两种不同符号。\n\n## 创建对象\n\n请记住，如上所示的 item 的声明并没有定义 item 的任何对象，而只是指定了它们将包含的内容。一旦类被声明，我们就可以使用类名（像任何其他内置类型变量一样）创建该类型变量。例如，\n\
    \n"
