    \ will contain the objects a and b. This kind of relationship is called containership\
    \ or nesting. Creation of an object that contains another object is very different\
    \ than the creation of an independent object. An independent object is created\
    \ by its constructor when it is declared with arguments. On the other hand, a\
    \ nested object is created in two stages. First, the member objects are created\
    \ using their respective constructors and then the other 'ordinary' members are\
    \ created. This means, constructors of all the member objects should be called\
    \ before its own constructor body is executed. This is accomplished using an initialization\
    \ list in the constructor of the nested class.\n\nExample:\n\n```\nclass gamma\n\
    {\n    ....\n    alpha a;        // a is object of alpha\n    beta b;        \
