    \ This approach takes a view that an object can be a collection of many other\
    \ objects. That is, a class can contain objects of other classes as its members\
    \ as shown below:\n\n```\nclass alpha {...};\nclass beta {...};\nclass gamma\n\
    {\n    alpha a;        // a is an object of alpha class\n    beta b;         //\
