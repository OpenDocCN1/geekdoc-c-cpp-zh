    complex(){ }

    ```


    It contains the empty body and does not do anything. We just stated that this
    is used to create objects without any initial values. Remember, we have defined
    objects in the earlier examples without using such a constructor. Why do we need
    this constructor now?. As pointed out earlier, C++ compiler has an implicit constructor
    which creates objects, even though it was not defined in the class.


    This works fine as long as we do not use any other constructors in the class.
    However, once we define a constructor, we must also define the "do-nothing" implicit
    constructor. This constructor will not do anything and is defined just to satisfy
    the compiler.'
  - '[PAGE 160]


    # 6.5 Constructors with Default Arguments


    It is possible to define constructors with default arguments. For example, the
    constructor complex() can be declared as follows:


    ```

    complex(float real, float imag=0);

    ```


    The default value of the argument imag is zero. Then, the statement


    ```

    complex C(5.0);

    ```


    assigns the value 5.0 to the real variable and 0.0 to imag (by default). However,
    the statement


    ```

    complex C(2.0,3.0);

    ```


    assigns 2.0 to real and 3.0 to imag. The actual parameter, when specified, overrides
    the default value. As pointed out earlier, the missing arguments must be the trailing
    ones.


    It is important to distinguish between the default constructor A::A() and the
    default argument constructor A::A(int = 0). The default argument constructor can
    be called with either one argument or no arguments. When called with no arguments,
    it becomes a default constructor. When both these forms are used in a class, it
    causes ambiguity for a statement such as


    ```

    A a;

    ```


    The ambiguity is whether to ''call'' A::A() or A::A(int = 0).


    # 6.6 Dynamic Initialization of Objects


    Class objects can be initialized dynamically too. That is to say, the initial
    value of an object may be provided during run time. One advantage of dynamic initialization
    is that we can provide various initialization formats, using overloaded constructors.
    This provides the flexibility of using different format of data at run time depending
    upon the situation.


    Consider the long term deposit schemes working in the commercial banks. The banks
    provide different interest rates for different schemes as well as for different
    periods of investment. Program 6.3 illustrates how to use the class variables
    for holding account details and how to construct these variables at run time using
    dynamic initialization.'
