    我们将在本节中详细讨论这些概念。


    ### 对象


    *对象*是面向对象系统中的基本运行时实体。它们可能代表一个人、一个地点、一个银行账户、一个数据表或程序需要处理的任何项目。它们也可能代表用户定义的数据，如向量、时间和列表。编程问题以对象及其之间的通信方式为基础进行分析。程序对象应选择使其与现实世界对象紧密匹配。对象在内存中占用空间，并具有类似
    Pascal 中的记录或 C 中的结构一样的关联地址。


    程序执行时，对象通过相互发送消息进行交互。例如，如果“客户”和“账户”是程序中的两个对象，则客户对象可能会向账户对象发送消息请求银行余额。每个对象包含数据和操作数据的代码。对象可以在不知道彼此数据或代码细节的情况下进行交互。只需知道接受的消息类型以及对象返回的响应类型即可。尽管不同作者的表示方式不同，但图
    1.7 显示了在面向对象分析和设计中流行使用的两种表示法。


    ![](img/58ab8f034e2127e80560390a921c2523_21_0.png)


    ### 类


    我们刚刚提到对象包含数据和操作该数据的代码。通过类可以将对象的整个数据和代码集合做成用户定义的数据类型。事实上，对象是类类型的变量。一旦定义了类，我们就可以创建任意数量属于该类的对象。每个对象都与创建它们的类类型的数据相关联。因此，类就是相似类型对象的集合。例如，芒果、苹果和橙子都是水果类的成员。类是用户定义的数据类型，行为类似于编程语言的内置类型。创建对象的语法与在
    C 中创建整数对象的语法没有区别。如果 fruit 已被定义为类，则语句


    ```

    fruit mango;

    ```


    将创建属于 fruit 类的对象 mango。


    ### 数据抽象和封装


    将数据和函数封装到单个单元中称为类，这被称为封装。数据封装是类的最显著特征。数据对外部世界不可访问，只有封装在类中的那些函数可以访问它。这些函数提供了对象数据与程序之间的接口。这种将数据与程序的直接访问隔离开来的做法称为数据隐藏或信息隐藏。


    抽象是指在不包含背景细节或解释的情况下表示本质特征的行为。类使用抽象的概念，并被定义为抽象属性的列表，如大小、重量和成本，以及操作这些属性的函数。它们封装了要创建的对象的全部基本属性。这些属性有时称为数据成员，因为它们保存信息。操作这些数据的函数有时称为方法或成员函数。


    由于类使用了数据抽象的概念，因此它们被称为抽象数据类型 ADT。


    ### 继承


    继承是一个类对象获取另一个类对象属性的过程。它支持分层分类的概念。例如，鸟类‘知更鸟’是‘会飞的鸟’类的一部分，而‘会飞的鸟’又是‘鸟’类的一部分。这种划分背后的原则是，每个派生类都与它派生自的类共享共同特征，如图
    1.8 所示。


    在 OOP 中，继承的概念提供了可重用的思想。这意味着我们可以在不修改现有类的情况下向其添加额外功能。这可以通过从现有类派生新类来实现。新类将具有两个类的组合功能。继承机制的真正吸引力和强大之处在于，它允许程序员重用一个几乎但不完全符合他需求的类，并以这样的方式定制该类，而不会对其他类引入任何不良副作用。


    请注意，每个子类仅定义其独有的特征。如果没有分类，每个类都必须显式包含其所有特征。


    ![](img/58ab8f034e2127e80560390a921c2523_23_0.png)


    Fig. 1.8 ⇒ 属性继承


    ### 多态


    *多态*是另一个重要的 OOP 概念。多态是一个希腊术语，意为能够采取多种形式。一个操作在不同实例中可能表现出不同的行为。行为取决于操作中使用的数据类型。例如，考虑加法操作。对于两个数字，该操作会生成一个和。如果操作数是字符串，则该操作会通过连接产生第三个字符串。使操作符在不同实例中表现出不同行为的过程称为*操作符重载*。


    图 1.9 说明了单个函数名可用于处理不同数量和不同类型的参数。这类似于某个特定词在不同上下文中具有几种不同含义。使用单个函数名执行不同类型的任务称为*函数重载*。


    多态在允许具有不同内部结构的对象共享相同的外部接口方面发挥着重要作用。这意味着一组通用操作


