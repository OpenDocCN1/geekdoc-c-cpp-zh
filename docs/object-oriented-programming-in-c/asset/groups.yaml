  mdcn: "\n\n# 5.17 常量成员函数\n\n如果成员函数不修改类中的任何数据，则可以将其声明为常量成员函数，如下所示：\n\n```\nvoid mul(int,\
    \ int) const;\ndouble get_balance() const;\n```\n\n限定符 `const` 附加在函数原型（声明和定义中都要）之后。如果此类函数试图修改数据值，编译器将生成错误消息。\n\
    \n# 5.18 指向成员的指针\n\n可以获取类成员的地址并将其赋给指针。可以通过对“完全限定”的类成员名应用运算符 `&` 来获取成员的地址。可以使用运算符\
    \ `::*` 和类名来声明类成员指针。例如，给定类\n\n```\nclass A\n{\n    private:\n        int m;\n\
    \    public:\n        void show();\n};\n```\n\n我们可以如下定义指向成员 `m` 的指针：\n\n```\n\
    int A::* ip = &A :: m;\n```\n\n这样创建的指针 `ip` 的行为类似于类成员，因为它必须使用类对象来调用。在上面的语句中，`A::*`\
    \ 表示“指向 A 类成员的指针”。`&A::m` 表示“A 类成员 `m` 的地址”。\n\n请记住，以下语句是无效的：\n\n```\nint *ip\
    \ = &m;    // 不起作用\n```\n\n这是因为 `m` 不仅仅是 `int` 类型的数据。只有与它所属的类关联时，它才有意义。作用域运算符必须同时应用于指针和成员。\n\
    \n现在可以使用指针 `ip` 在成员函数（或友元函数）中访问成员 `m`。假设 `a` 是在成员函数中声明的 `A` 类对象。我们可以如下使用指针 `ip`\
    \ 访问 `m`：\n\n```\ncout << a.*ip;    // 显示\ncout << a.m;      // 与上面相同\n```\n\n\
    现在，看下面的代码：\n\n```\nap = &a;                 // ap 是指向对象 a 的指针\ncout << ap -> *ip;\
    \       // 显示 m\ncout << ap -> m; // 与上面相同\n```\n\n当同时使用指向对象和成员的指针时，使用解引用运算符 `->*`\
    \ 来访问成员。当对象本身与成员指针一起使用时，使用解引用运算符 `.*`。请注意，`*ip` 的使用方式类似于成员名。\n\n我们还可以设计指向成员函数的指针，然后可以在\
    \ `main` 中使用解引用运算符调用它们，如下所示：\n\n```\n(对象名 .* 指向成员函数的指针) (10);\n(指向对象的指针 ->* 指向成员函数的指针)\
    \ (10)\n```\n\n`()` 的优先级高于 `.*` 和 `->*`，因此括号是必需的。\n\n程序 5.12 演示了使用解引用运算符访问类成员。\n\
    \n# 解引用运算符\n\n```\n#include <iostream>\n\nusing namespace std;\n\nclass M\n{\n\
    \    int x;\n    int y;\npublic:\n    void set_xy(int a, int b)\n    {\n     \
    \   x = a;\n        y = b;\n    }\n    friend int sum(M m);\n```\n\n```\n```cpp\n\
    int sum(M m)\n{\n        int M:: *px = &M::x;\n        int M:: *py = &M::y;\n\
    \        M *pm = &m;\n        int S = m.*px + pm->*py;\n        return S;\n}\n\
    \nint main()\n{\n        M m;\n        void (M:: *pf)(int,int) = &M::set_xy;\n\
    \        (m.*pf)(10,20);\n        cout << \"SUM = \" << sum(m) << \"\\n\";\n\n\
    \        M *pm = &m;\n        (pm->*pf)(30,40);\n        cout << \"SUM = \" <<\
    \ sum(m) << \"\\n\";\n\n        return 0;\n}\n```\n```\n\n程序 5.12 的输出为：\n\n```\n\
    ```text\nSUM = 30\nSUM = 70\n```\n```\n\n# 5.19 局部类\n\n可以在函数或块内部定义和使用类。这样的类称为局部类。示例：\n\
    \n```\n```cpp\nvoid test(int a)       // 函数\n{\n        .....\n        .....\n\
    \        class student;  // 局部类\n        {\n                .....\n          \
    \      .....  // 类定义\n        }\n}\n```\n\n```\n....\n};\n....\n....\nstudent\
    \ s1(a);      // 创建 student 对象\n....              // 使用 student 对象\n}\n```\n\n\
    局部类可以使用全局变量（在函数上方声明的变量）和在函数内部声明的静态变量，但不能使用自动局部变量。全局变量应使用作用域运算符（`::`）。\n\n构造局部类时存在一些限制。它们不能有静态数据成员，并且成员函数必须在局部类内部定义。外部函数不能访问局部类的私有成员。但是，可以通过将外部函数声明为友元来实现这一点。\n\
