    ## 前言


    面向对象编程（OOP）已成为软件行业首选的编程方法，因为它提供了一种有效应对现实世界问题复杂性的方法。在今天可用的 OOP 语言中，C++ 是使用最广泛的语言。


    自 Bjarne Stroustrup 在 20 世纪 80 年代初创建以来，C++ 经历了许多变化和改进。该语言于 1998 年由美国国家标准学会（ANSI）和国际标准化组织（ISO）标准化，不仅纳入了新特性，还纳入了用户组提出的更改。本书已彻底修订，本版符合
    ANSI/ISO 标准的规范。除了符合标准外，还纳入了许多较小的更改和补充以加强现有主题，以及对文本中印刷错误和某些不准确之处的更正。本版的亮点是附录 A
    中包含的两个新的编程项目 - （1）菜单式计算系统和（2）银行系统，展示了如何在实际应用中集成 C++ 的各种特性。


    本书面向希望了解 C++ 语言和面向对象编程的程序员。它以简单易懂的风格解释了面向对象编程的何、为何和如何。本书假设读者已熟悉 C 语言，尽管他或她不必是专家程序员。


    本书提供了大量示例、插图和完整程序。示例程序旨在既简单又具有教育意义。在必要时，包含概念的图示描述以提高清晰度并促进更好的理解。本书还介绍了面向对象方法概念，并简要讨论了面向对象系统分析和设计的要素。


    ## 关键教学特色


    ## 关键概念


    关键概念提供了对本章将讨论的概念的快速概览。这些概念后面跟着一个引言，介绍本章将涵盖的主题，并将其与已学内容联系起来。


    ![](img/58ab8f034e2127e80560390a921c2523_14_0.png)


    - - 如何确保模块的可重用性和可扩展性？

    - - 如何开发对未来任何更改都具有容忍性的模块？

    - - 如何提高软件生产率并降低软件成本？

    - - 如何提高软件质量？

    - - 如何管理时间进度？

    - - 如何将软件开发过程工业化？


    许多软件产品要么未完成，要么未使用，要么交付时存在重大错误。图 1.1 显示了 1970 年代美国国防软件项目的命运。约 50% 的软件产品从未交付，而交付的三分之一从未被使用。有趣的是，只有
    2% 的产品按交付状态使用，未经任何更改。这说明软件行业在交付产品方面有着惊人的糟糕记录。


    ![](img/58ab8f034e2127e80560390a921c2523_15_0.png)


    图 1.1 ⇔ 美国国防项目的状况（根据美国政府）


    用户需求的变化一直是一个主要问题。另一项研究（图 1.2）显示，超过 50% 的系统由于用户需求和数据格式的变化而需要修改。这只说明，在一个变化的世界和动态的商业环境中，对更改的需求是不可避免的，因此系统必须具有适应性和对更改的容忍性。


    这些研究和其他关于软件实施的报告表明，软件产品在交付和实施前应仔细评估其质量。必须考虑的关键质量问题有：


    - 1. 正确性

    - 2. 可维护性

    - 3. 可重用性

    - 4. 开放性和互操作性


    - 5. 可移植性

    - 6. 安全性

    - 7. 完整性

    - 8. 用户友好性


    选择和使用适当的软件工具将有助于解决这些问题中的一些。


    ![](img/58ab8f034e2127e80560390a921c2523_16_0.png)


    Ernest Tello，一位人工智能领域的知名作家，将软件技术的演进比作树的生长。像树一样，软件演进经历了不同的阶段或“层”。这些层在过去五十年中逐一建立起来，如图
    1.3 所示，每一层都比前一层有所改进。然而，如果考虑这些层的寿命，类比就失效了。在软件系统中，每一层都继续发挥功能，而在树的情况下，只有最上层是功能性的。


    > “随着复杂性的增加，架构主导了基本材料”。要构建当今复杂的软件，仅仅把一系列编程语句和一组过程和模块组合起来是不够的；我们需要纳入健全的构建技术和易于理解、实现和修改的程序结构。


