    # 3.22 Operator Overloading


    As stated earlier, overloading means assigning different meanings to an operation,
    depending on the context. C++ permits overloading of operators, thus allowing
    us to assign multiple meanings to operators. Actually, we have used the concept
    of overloading in C also. For example, the operator * when applied to a pointer
    variable, gives the value pointed to by the pointer. But it is also commonly used
    for multiplying two numbers. The number and type of operands decide the nature
    of operation to follow.


    The input/output operators << and >> are good examples of operator overloading.
    Although the built-in definition of the << operator is for shifting of bits, it
    is also used for displaying the values of various data types. This has been made
    possible by the header file iostream where a number of overloading definitions
    for << are included. Thus, the statement


    ```

    cout << 75.86;

    ```


    invokes the definition for displaying a double type value, and


    ```

    cout << "well done";

    ```


    invokes the definition for displaying a char value. However, none of these definitions
    in iostream affect the built-in meaning of the operator.


    Similarly, we can define additional meanings to other C++ operators. For example,
    we can define + operator to add two structures or objects. Almost all C++ operators
    can be overloaded with a few exceptions such as the member-access operators (.,
    and .*), conditional operator (?:), scope resolution operator (::) and the size
    operator (sizeof). Definitions for operator overloading are discussed in detail
    in Chapter 7.


    # 3.23 Operator Precedence


    Although C++ enables us to add multiple meanings to the operators, yet their association
    and precedence remain the same. For example, the multiplication operator will
    continue having higher precedence than the add operator. Table 3.5 gives the precedence
    and associativity of all the C++ operators. The groups are listed in the order
    of decreasing precedence. The labels prefix and postfix distinguish the uses of
    ++ and --. Also, the symbols +, -, *, and & are used as both unary and binary
    operators.


    A complete list of ANSI C++ operators and their meanings, precedence, associativity
    and use are given in Appendix E.'
