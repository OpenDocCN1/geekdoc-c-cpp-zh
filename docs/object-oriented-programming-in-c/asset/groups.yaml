    ### 2.1 什么是 C++？


    C++ 是一种面向对象编程语言。它由 Bjarne Stroustrup 于 20 世纪 80 年代初在美国新泽西州默里希尔的 AT&T 贝尔实验室开发。Stroustrup
    是 Simula67 的崇拜者，也是 C 语言的坚定支持者，他希望将两种语言的优点结合起来，创造一种更强大的语言，既能支持面向对象编程特性，又能保留 C 语言的力量和优雅。结果就是
    C++。因此，C++ 是 C 语言的扩展，主要增加了 Simula67 的类构造特性。由于类是原始 C 语言的一个重要新增部分，Stroustrup 最初将新语言称为“带类的
