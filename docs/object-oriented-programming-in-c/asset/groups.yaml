    在 20 世纪 90 年代初，该语言经历了一系列改进和变化。1997 年 11 月，ANSI/ISO 标准委员会将这些变化标准化，并在语言规范中增加了几个新特性。


    C++ 是 C 的超集。我们已知的关于 C 的绝大部分内容也适用于 C++。因此，几乎所有 C 程序也都是 C++ 程序。然而，有一些细微差别会使 C 程序无法在
    C++ 编译器下运行。我们将在遇到这些差异时再逐一讨论。


    C++ 在 C 语言基础上增加的最重要功能是类、继承、函数重载和运算符重载。这些特性使得能够创建抽象数据类型、继承现有数据类型的属性并支持多态，从而使 C++
    成为一种真正的面向对象语言。


    C++ 中的面向对象特性使程序员能够构建清晰、可扩展且易于维护的大型程序，同时融入 C 语言的精神和效率。新特性的加入已将 C 从一种当前支持自顶向下、结构化设计的语言，转变为一种提供自底向上、面向对象设计的语言。


    ### 2.2 C++ 的应用


    C++ 是一种用于处理超大型程序的多功能语言。它几乎适用于任何编程任务，包括开发编辑器、编译器、数据库、通信系统以及任何复杂的现实应用系统。


    - 由于 C++ 允许我们创建与层次结构相关的对象，因此我们可以构建特殊的面向对象库，供许多程序员以后使用。

    - C++ 能够恰当地映射现实世界的问题，同时 C++ 中的 C 部分又赋予该语言接近机器级细节的能力。

    - C++ 程序易于维护和扩展。当需要实现新功能时，很容易添加到对象的现有结构中。

    - 可以预期，在不久的将来，C++ 将取代 C 成为一种通用语言。


    ### 2.3 一个简单的 C++ 程序


    让我们从一个简单的 C++ 程序示例开始，该程序在屏幕上打印一个字符串。


    打印字符串


    ```cpp

    #include <iostream> // 包含头文件


    using namespace std;

    ```


