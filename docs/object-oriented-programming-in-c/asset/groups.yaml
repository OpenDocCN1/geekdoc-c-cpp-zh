  mdcn: "\n## 表3.5 运算符优先级和结合性\n\n| 运算符 | 结合性 |\n|---|---|\n| :: | 从左到右 |\n| -> . (\
    \ ) [ ] 后缀++ 后缀-- | 从左到右 |\n| 前缀++ 前缀-- ~ ! 一元+ 一元- 一元* 一元& (类型) sizeof new delete\
    \ | 从右到左 |\n| -> * * | 从左到右 |\n| * / % | 从左到右 |\n| + - | 从左到右 |\n| << >> | 从左到右\
    \ |\n| <<= >>= | 从左到右 |\n| == != | 从左到右 |\n| & | 从左到右 |\n| ^ | 从左到右 |\n| | | 从左到右\
