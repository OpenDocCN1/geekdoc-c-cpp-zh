    and printing. A number of functions are written to accomplish these tasks. The
    primary focus is on functions. A typical program structure for procedural programming
    is shown in Fig. 1.4. The technique of hierarchical decomposition has been used
    to specify the tasks to be completed for solving a problem.


    ![](img/58ab8f034e2127e80560390a921c2523_18_0.png)


    Fig. 1.4 ⇔ Typical structure of procedure-oriented programs


    Procedure-oriented programming basically consists of writing a list of instructions
    (or actions) for the computer to follow, and organizing these instructions into
    groups known as functions. We normally use a flowchart to organize these actions
    and represent the flow of control from one action to another. While we concentrate
    on the development of functions, very little attention is given to the data that
    are being used by various functions. What happens to the data? How are they affected
    by the functions that work on them?


    In a multi-function program, many important data items are placed as global so
    that they may be accessed by all the functions. Each function may have its own
    local data. Figure 1.5 shows the relationship of data and functions in a procedure-oriented
    program.


    Global data are more vulnerable to an inadvertent change by a function. In a large
    program it is very difficult to identify what data is used by which function.
    In case we need to revise an external data structure, we also need to revise all
    functions that access the data. This provides an opportunity for bugs to creep
    in.


    Another serious drawback with the procedural approach is that it does not model
    real world problems very well. This is because functions are action-oriented and
    do not really correspond to the elements of the problem.'
