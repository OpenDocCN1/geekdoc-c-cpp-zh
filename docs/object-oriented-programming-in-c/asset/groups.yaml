    面向对象方法的发明主要动机是为了消除在过程式方法中遇到的一些缺陷。OOP 将数据视为程序开发中的关键要素，不允许其在系统中自由流动。它将数据与操作该数据的函数更紧密地联系在一起，并防止其被外部函数意外修改。OOP
    允许将问题分解为若干称为对象的实体，然后围绕这些对象构建数据和函数。面向对象程序中数据和函数的组织如图 1.6 所示。对象的<|message|> 数据只能由与该对象关联的函数访问。然而，一个对象的函数可以访问其他对象的函数。


