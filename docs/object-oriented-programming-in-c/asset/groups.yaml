    # 3.15 Member Dereferencing Operators


    As you know, C++ permits us to define a class containing various types of data
    and functions as members. C++ also permits us to access the class members through
    pointers. In order to achieve this, C++ provides a set of three pointer-to-member
    operators. Table 3.3 shows these operators and their functions.


    # Table 3.3 Member dereferencing operators


    | Operator | Function |

    |---|---|

    | ::* | To declare a pointer to a member of a class |

    | * | To access a member using object name and a pointer to that member |

    | ->* | To access a member using a pointer to the object and a pointer to that
    member |


    Further details on these operators will be meaningful only after we discuss classes,
    and therefore we defer the use of member dereferencing operators until then.


    # 3.16 Memory Management Operators


    C uses malloc() and calloc() functions to allocate memory dynamically at run time.
    Similarly, it uses the function free() to free dynamically allocated memory. We
    use dynamic allocation techniques when it is not known in advance how much of
    memory space is needed. Although C++ supports these functions, it also defines
    two unary operators new and delete that perform'
  - '[PAGE 66]


    the task of allocating and freeing the memory in a better and easier way. Since
    these operators manipulate memory on the free store, they are also known as free
    store operators.


    An object can be created by using **new**, and destroyed by using **delete**,
    as and when required. A data object created inside a block with **new**, will
    remain in existence until it is explicitly destroyed by using **delete**. Thus,
    the lifetime of an object is directly under our control and is unrelated to the
    block structure of the program.


    The **new** operator can be used to create objects of any type. It takes the following
    general form:


    ```

    pointer-variable = new data-type;

    ```


    Here, *pointer-variable* is a pointer of type *data-type*. The **new** operator
    allocates sufficient memory to hold a data object of type *data-type* and returns
    the address of the object. The *data-type* may be any valid data type. The *pointer-variable*
    holds the address of the memory space allocated. Examples:


    ```

    p = new int;

    q = new float;

    ```


    where **p** is a pointer of type **int** and **q** is a pointer of type **float**.
    Here, **p** and **q** must have already been declared as pointers of appropriate
    types. Alternatively, we can combine the declaration of pointers and their assignments
    as follows:


    ```

    int *p = new int;

    float *q = new float;

    ```


    Subsequently, the statements


    ```

    *p = 25;

    *q = 7.5;

    ```


    assign 25 to the newly created **int** object and 7.5 to the **float** object.


    We can also initialize the memory using the **new** operator. This is done as
    follows:


    ```

    pointer-variable = new data-type(value);

    ```


    Here, value specifies the initial value. Examples:


    ```

    int *p = new int(25);

    float *q = new float(7.5);

    ```'
  - '[PAGE 67]


    As mentioned earlier, new can be used to create a memory space for any data type
    including user-defined types such as arrays, structures and classes. The general
    form for a one-dimensional array is:


    ```

    pointer-variable = new data-type[size];

    ```


    Here, size specifies the number of elements in the array. For example, the statement


    ```

    int *p = new int[10];

    ```


    creates a memory space for an array of 10 integers. p[0] will refer to the first
    element, p[1] to the second element, and so on.


    When creating multi-dimensional arrays with new, all the array sizes must be supplied.


    ```

    array_ptr = new int[3][5][4];   // legal

    array_ptr = new int[m][5][4];   // legal

    array_ptr = new int[3][5][ ];   // illegal

    array_ptr = new int[ ][5][4];   // illegal

    ```


    The first dimension may be a variable whose value is supplied at runtime. All
    others must be constants.


    The application of new to class objects will be discussed later in Chapter 6.


    When a data object is no longer needed, it is destroyed to release the memory
    space for reuse. The general form of its use is:


    ```

    delete pointer-variable;

    ```


    The pointer-variable is the pointer that points to a data object created with
    new. Examples:


    ```

    delete p;

    delete q;

    ```


    If we want to free a dynamically allocated array, we must use the following form
    of delete:


    ```

    delete [size] pointer-variable;

    ```


    The size specifies the number of elements in the array to be freed. The problem
    with this form is that the programmer should remember the size of the array. Recent
    versions of C++ do not require the size to be specified. For example,'
