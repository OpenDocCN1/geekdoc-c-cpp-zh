  md: "\n## 5.11 Static Data Members\n\nA data member of a class can be qualified\
    \ as static. The properties of a static member variable are similar to that of\
    \ a C static variable. A static member variable has certain special characteristics.\
    \ These are :\n\n- It is initialized to zero when the first object of its class\
    \ is created. No other initialization is permitted.\n- Only one copy of that member\
    \ is created for the entire class and is shared by all the objects of that class,\
    \ no matter how many objects are created.\n- It is visible only within the class,\
    \ but its lifetime is the entire program.\n\nStatic variables are normally used\
    \ to maintain values common to the entire class. For example, a static data member\
    \ can be used as a counter that records the occurrences of all the objects. Program\
    \ 5.4 illustrates the use of a static data member.\n\n### STATIC CLASS MEMBER\n\
    \n```\n#include <iostream>\n\nusing namespace std;\n\nclass item\n{\n    static\
    \ int count;\n    int number;\npublic:\n    void getdata(int a)\n    {\n     \
    \   number = a;\n        count ++;\n    }\n    void getcount(void)\n    {\n  \
    \      cout << \"count: \";\n        cout << count << \"\\n\";\n    }\n};\n\n\
    int item :: count;\n\nint main()\n{\nitem a, b, c;        // count is initialized\
    \ to zero\na.getcount();        // display count\nb.getcount();\nc.getcount();\n\
    \na.getdata(100);      // getting data into object a\nb.getdata(200);      //\
    \ getting data into object b\nc.getdata(300);      // getting data into object\
