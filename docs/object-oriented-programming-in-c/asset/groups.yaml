  - "[PAGE 177]\n\nalmost create a new language of our own by the creative use of\
    \ the function and operator overloading techniques. We can overload (give additional\
    \ meaning to) all the C++ operators except the following:\n\n+   - Class member\
    \ access operators (., .*).\n+   - Scope resolution operator (::).\n+   - Size\
    \ operator (sizeof).\n+   - Conditional operator (?:).\n\nThe excluded operators\
    \ are very few when compared to the large number of operators which qualify for\
    \ the operator overloading definition.\n\nAlthough the *semantics* of an operator\
    \ can be extended, we cannot change its *syntax*, the grammatical rules that govern\
    \ its use such as the number of operands, precedence and associativity. For example,\
    \ the multiplication operator will enjoy higher precedence than the addition operator.\
    \ Remember, when an operator is overloaded, its original meaning is not lost.\
    \ For instance, the operator +, which has been overloaded to add two vectors,\
    \ can still be used to add two integers.\n\n# 7.2 Defining Operator Overloading\n\
    \nTo define an additional task to an operator, we must specify what it means in\
    \ relation to the class to which the operator is applied. This is done with the\
    \ help of a special function, called *operator function*, which describes the\
    \ task. The general form of an operator function is:\n\n```\nreturn type classname\
    \ :: operator op(arglist)\n{\n    Function body        // task defined\n}\n```\n\
    \nwhere *return type* is the type of value returned by the specified operation\
    \ and *op* is the operator being overloaded. The *op* is preceded by the keyword\
    \ **operator**. **operator op** is the function name.\n\nOperator functions must\
    \ be either member functions (non-static) or friend functions. A basic difference\
    \ between them is that a friend function will have only one argument for unary\
    \ operators and two for binary operators, while a member function has no arguments\
    \ for unary operators and only one for binary operators. This is because the object\
    \ used to invoke the member function is passed implicitly and therefore is available\
    \ for the member function. This is not the case with **friend** functions. Arguments\
    \ may be passed either by value or by reference. Operator functions are declared\
    \ in the class using prototypes as follows:"
  - '[PAGE 178]


    ```

    vector operator+(vector);                // vector addition

    vector operator-();                       // unary minus

    friend vector operator+(vector,vector);   // vector addition

    friend vector operator-(vector);          // unary minus

    vector operator-(vector &a);              // subtraction

    int operator==(vector);                   // comparison

    friend int operator==(vector,vector)      // comparison

    ```


    **vector** is a data type of **class** and may represent both magnitude and direction
    (as in physics and engineering) or a series of points called elements (as in mathematics)


    The process of overloading involves the following steps:


    +   1. Create a class that defines the data type that is to be used in the overloading
    operaion.

    +   2. Declare the operator function **operator** op() in the public part of the
    class. It may be either a member function or a **friend** function.

    +   3. Define the operator function to implement the required operations.


    Overloaded operator functions can be invoked by expressions such as


    ```

    op x or x op

    ```


    for unary operators and


    ```

    x op y

    ```


    for binary operators. op x (or x op) would be interpreted as


    ```

    operator op (x)

    ```


    for **friend** functions. Similarly, the expression x op y would be interpreted
    as either


    ```

    x.operator op (y)

    ```


    in case of member functions, or


    ```

    operator op (x,y)

    ```


    in case of **friend** functions. When both the forms are declared, standard argument
    matching is applied to resolve any ambiguity.


    # 7.3 Overloading Unary Operators


    Let us consider the unary minus operator. A minus operator when used as a unary,
    takes just one operand. We know that this operator changes the sign of an operand
    when applied to a basic data item. We will see here how to overload this operator
    so that it can be applied'
