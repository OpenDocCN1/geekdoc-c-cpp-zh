    ## 5.14 Objects as Function Arguments\n\nLike any other data type, an object may\
    \ be used as a function argument. This can be done in two ways:\n\n- A copy of\
    \ the entire object is passed to the function.\n- Only the address of the object\
    \ is transferred to the function.\n\nThe first method is called pass-by-value.\
    \ Since a copy of the object is passed to the function, any changes made to the\
    \ object inside the function do not affect the object used to call the function.\
    \ The second method is called pass-by-reference. When an address of the object\
    \ is passed, the called function works directly on the actual object used in the\
    \ call. This means that any changes made to the object inside the function will\
    \ reflect in the actual object. The pass-by-reference method is more efficient\
    \ since it requires to pass only the address of the object and not the entire\
    \ object.\n\nProgram 5.7 illustrates the use of objects as function arguments.\
    \ It performs the addition of time in the hour and minutes format.\n\n### OBJECTS\
    \ AS ARGUMENTS\n\n```cpp\n#include <iostream>\nusing namespace std;\nclass time\
    \ \n{\n\tint hours;\n\tint minutes;\npublic:\n\tvoid gettime(int h, int m) \n\t\
    {\n\t\thours = h; minutes = m; \n\t}\n\tvoid puttime(void)\n\t{\n\t\tcout << hours\
    \ << \" hours and \";\n\t\tcout << minutes << \" minutes \" << \"\\n\";\n\t}\n\
    \tvoid sum(time, time); // declaration with objects as arguments\n};\nvoid time\
    \ :: sum(time t1, time t2) // t1, t2 are objects\n{\n\tminutes = t1.minutes +\
    \ t2.minutes;\n\thours = minutes/60;\n\tminutes = minutes%60;\n\thours = hours\
    \ + t1.hours + t2.hours;\n}\nint main()\n{\n\ttime T1, T2, T3;\n\tT1.gettime(2,45);\
    \ // get T1\n\tT2.gettime(3,30); // get T2\n\tT3.sum(T1, T2); // T3=T1+T2\n\t\
    cout << \"T1 = \"; T1.puttime(); // display T1\n\tcout << \"T2 = \"; T2.puttime();\
    \ // display T2\n\tcout << \"T3 = \"; T3.puttime(); // display T3\n\treturn 0;\n\
    }\n```\n\n**PROGRAM 5.7**\n\nTo make an outside function “friendly” to a class,\
    \ we have to simply declare this function as a friend of the class as shown below:\n\
    \n```\nclass ABC\n{\n.....\n.....\npublic:\n.....\n.....\n.....\nvoid xyz(void);\
    \ // declaration\n};\n```\n\nThe function declaration should be preceded by the\
    \ keyword friend. The function is defined elsewhere in the program like a normal\
    \ C++ function. The function definition does not use either the keyword friend\
    \ or the scope operator ::. The functions that are declared with the keyword friend\
    \ are known as friend functions. A function can be declared as a friend in any\
    \ number of classes. A friend function, although not a member function, has full\
    \ access rights to the private members of the class.\n\n- It is not in the scope\
    \ of the class to which it has been declared as friend.\n- Since it is not in\
    \ the scope of the class, it cannot be called using the object of that class.\n\
    - It can be invoked like a normal function without the help of any object.\n-\
    \ Unlike member functions, it cannot access the member names directly and has\
    \ to use an object name and dot membership operator with each member name (e.g.,\
    \ A.x).\n- It can be declared either in the public or the private part of a class\
    \ without affecting its meaning.\n- Usually, it has the objects as arguments.\n\
    \nThe friend functions are often used in operator overloading which will be discussed\
    \ later.\n\nProgram 5.8 illustrates the use of a friend function.\n\n```\n#include\
    \ <iostream>\nusing namespace std;\n\nclass sample\n{\n    int a;\n    int b;\n\
    \    public:\n        void setvalue() {a=25; b=40; }\n        friend float mean(sample\
    \ s);\n};\nfloat mean(sample s)\n{\n    return float(s.a + s.b)/2.0;\n}\n\nint\
    \ main()\n{\n    sample X;    // object X\n    X.setvalue();\n    cout << \"Mean\
    \ value = \" << mean(X) << \"\\n\";\n\n    return 0;\n}\n```\n\nThe output of\
    \ Program 5.8 would be:\n\n```\nMean value = 32.5\n```\n\nnote\n\n> The friend\
    \ function accesses the class variables a and b by using the dot operator and\
    \ the object passed to it. The function call mean(X) passes the object X by value\
    \ to the friend function.\n\nMember functions of one class can be friend functions\
    \ of another class. In such cases, they are defined using the scope resolution\
    \ operator as shown below:\n\n```\nclass X\n{\n    .....\n    .....\n    int fun1();\
    \    // member function of X\n    .....\n};\n\nclass Y\n{\n    .....\n    .....\n\
    \    friend int X :: fun1();      // fun1() of X\n                           \
    \      // is friend of Y\n    .....\n};\n```\n\nThe function **fun1()** is a member\
    \ of **class X** and a **friend** of class **Y**.\n\nWe can also declare all the\
    \ member functions of one class as the friend functions of another class. In such\
    \ cases, the class is called a **friend class**. This can be specified as follows:\n\
    \n```\nclass Z\n{\n    .....\n    friend class X;    // all member functions of\
    \ X are\n                      // friends to Z\n};\n```\n\nProgram 5.9 demonstrates\
    \ how friend functions work as a bridge between the classes.\n\n### A FUNCTION\
    \ FRIENDLY TO TWO CLASSES\n\n```\n#include <iostream>\n\nusing namespace std;\n\
    \nclass ABC;    // Forward declaration\n//--------------------------------------------------//\n\
    class XYZ\n{\n    int x;\npublic:\n    void setvalue(int i) {x = i;}\n    friend\
    \ void max(XYZ, ABC);\n};\n//--------------------------------------------------//\n\
    class ABC\n{\n    int a;\npublic:\n    void setvalue(int i) {a = i;}\n    friend\
    \ void max(XYZ, ABC);\n};\n```\n\n### SWAPPING PRIVATE DATA OF CLASSES\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\n\nclass class_2;\n\nclass class_1\n\
    {\n\tint value1;\npublic:\n\tvoid indata(int a) {value1 = a;}\n\tvoid display(void)\
    \ {cout << value1 << \"\\n\";}\n\tfriend void exchange(class_1 &, class_2 &);\n\
    };\n\nclass class_2\n{\n\tint value2;\npublic:\n\tvoid indata(int a) {value2 =\
    \ a;}\n\tvoid display(void) {cout << value2 << \"\\n\";}\n\tfriend void exchange(class_1\
    \ &, class_2 &);\n};\n\nvoid exchange(class_1 &x, class_2 &y)\n{\n\tint temp =\
    \ x.value1;\n\tx.value1 = y.value2;\n\ty.value2 = temp;\n}\n\nint main()\n{\n\t\
    class_1 C1;\n\tclass_2 C2;\n\tC1.indata(100);\n\tC2.indata(200);\n\tcout << \"\
    Values before exchange\" << \"\\n\";\n\tC1.display();\n\tC2.display();\n\texchange(C1,\
    \ C2);      // swapping\n\n\tcout << \"Values after exchange \" << \"\\n\";\n\t\
    C1.display();\n\tC2.display();\n\n\treturn 0;\n}\n```\n\n**PROGRAM 5.10**\n\n\
    The objects x and y are aliases of C1 and C2 respectively. The statements\n\n\
    ```\nint temp = x.value1;\nx.value1 = y.value2;\ny.value2 = temp;\n```\n\ndirectly\
    \ modify the values of value1 and value2 declared in class_1 and class_2.\n\n\
    Here is the output of Program 5.10:\n\n```\nValues before exchange\n100\n200\n\
    Values after exchange\n200\n100\n```\n\n## 5.16 Returning Objects\n\nA function\
    \ cannot only receive objects as arguments but also can return them. The example\
    \ in Program 5.11 illustrates how an object can be created (within a function)\
    \ and returned to another function.\n\n### RETURNING OBJECTS\n\n```cpp\n#include\
    \ <iostream>\n\nusing namespace std;\n\nclass complex      // x + iy form\n{\n\
    \    float x;        // real part\n    float y;        // imaginary part\npublic:\n\
    \    void input(float real, float imag)\n    { x = real; y = imag; }\n    friend\
    \ complex sum(complex, complex);\n    void show(complex);\n};\n\ncomplex sum(complex\
    \ c1, complex c2)\n{\n    complex c3;            // objects c3 is created\n  \
    \  c3.x = c1.x + c2.x;\n    c3.y = c1.y + c2.y;\n    return(c3);            //\
    \ returns object c3\n}\n\nvoid complex :: show(complex c)\n{\n    cout << c.x\
    \ << \" + j\" << c.y << \"\\n\";\n}\n\nint main()\n{\n    complex A, B, C;\n\n\
    \    A.input(3.1, 5.65);\n    B.input(2.75, 1.2);\n\n    C = sum(A, B);      \
    \    // C = A + B\n\n    cout << \"A = \"; A.show(A);\n    cout << \"B = \"; B.show(B);\n\
    \    cout << \"C = \"; C.show(C);\n\n    return 0;\n}\n```\n\nUpon execution,\
    \ Program 5.11 would generate the following output:\n\n```\nA = 3.1 + j5.65\n\
    B = 2.75 + j1.2\nC = 5.85 + j6.85\n```\n\nThe program adds two complex numbers\
    \ A and B to produce a third complex number C and displays all the three numbers.\n"
