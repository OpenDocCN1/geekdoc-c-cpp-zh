    \ 8, 12)\n```\n\n该程序将运算符 * 重载了两次，也就是对运算符函数 operator*() 本身进行了重载。在这两种情况下，函数都被显式传入两个参数，并像任何其他重载函数一样，根据其参数类型被调用。这使我们能够使用两种标量乘法形式，例如：\n\
    \n```\np = 2 * m;        // equivalent to p = operator*(2,m);\nq = n * 2;    \
