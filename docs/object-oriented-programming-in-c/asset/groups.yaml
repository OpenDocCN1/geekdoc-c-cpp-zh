    其他为扩展的传统语言


    从表 1.1 可以看出，所有语言都提供多态和数据隐藏。然而，许多语言不提供并发、持久性和泛型设施。Eiffel、Ada 和 C++ 提供泛型设施，这是支持重用的重要构造。然而，持久性（存储对象的过程）并没有被任何一种语言完全支持。在
    Smalltalk 中，虽然整个当前执行状态可以保存到磁盘，但单个对象不能保存到外部文件。


    在商业上，C++ 只有 10 年历史，Smalltalk 和 Objective C 有 13 年历史，而 Java 只有 5 年历史。虽然 Simula
    已存在二十多年，但它大部分时间都在研究环境中度过。这个领域太新，因此不应过于苛刻地评判。


    使用特定语言取决于应用的特性和需求、选择对组织的影响，以及现有程序的重用。C++ 现在已成为最成功、最实用的通用 OOP 语言，并在当今工业界广泛使用。


