    };\nmain()\n{\n    D d;\n    d.display();\n    d.B1::display();\n    d.B2::display();\n\
    }\n\n## 编程练习\n\n8.1 假设一家银行为客户维护两种账户，一种称为储蓄账户，另一种称为活期账户。储蓄账户提供复利和取款设施，但不提供支票簿设施。活期账户提供支票簿设施但不提供利息。活期账户持有人还应保持最低余额，如果余额低于此水平，则会收取服务费。\n\
    \n## 9.2 指针\n\n指针是 C++ 语言的关键方面之一，与 C 语言类似。正如我们所知，指针在 C 和 C++ 中提供了一种处理数据的独特方法。我们在第\
    \ 3 章和第 5 章中已经看到了指针的一些应用。在本节中，我们将讨论指针的基础知识以及它们在 C++ 中的特殊用法。\n\n我们知道，指针是一种派生数据类型，它通过存储变量的内存地址而不是数据来引用另一个数据变量。指针变量定义从何处获取特定数据变量的值，而不是定义实际数据。\n\
    \n与 C 语言一样，指针变量在 C++ 中也可以引用另一个指针。然而，它通常指向一个数据变量。指针提供了一种访问其他数据对象的替代方法。\n\n### 声明和初始化指针\n\
    \n如第 3 章所述，我们可以像在 C++ 中声明其他变量一样声明指针变量。与 C 语言一样，声明基于它所指向的变量的数据类型。指针变量的声明采用以下形式：\n\
    \n```\ndata-type *pointer-variable;\n```\n\n这里，pointer-variable 是指针的名称，data-type\
    \ 指的是有效的 C++ 数据类型之一，例如 int、char、float 等。data-type 后跟一个星号 (*) 符号，它将指针变量与编译器的其他变量区分开来。\n\
    \n> note\n> 我们可以将星号 (*) 放在指针变量之前，或放在数据类型和指针变量之间，或放在数据类型之后。它不会对执行过程产生任何影响。\n\n\
    正如我们所知，指针变量可以指向 C++ 中任何类型的数据。然而，必须理解的是，指针在特定时间只能指向一种数据类型。让我们声明一个指向整数变量的指针变量，如下所示：\n\
    \n```\nint *ptr;\n```\n\n这里，ptr 是一个指针变量并指向整数数据类型。指针变量 ptr 应包含任何整数变量的内存位置。以同样的方式，我们也可以为其他数据类型声明指针变量。\n\
    \n"
