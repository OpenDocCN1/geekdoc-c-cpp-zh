    \ and Their Types\n\n表达式是按语言规则排列的运算符、常量和变量的组合。它还可能包含返回值的函数调用。表达式可能由一个或多个操作数和零个或多个运算符组成以产生一个值。表达式可以是以下七种类型之一：\n\
    \n+   - 常量表达式\n+   - 整数表达式\n+   - 浮点表达式\n+   - 指针表达式\n+   - 关系表达式\n+   - 逻辑表达式\n\
    +   - 按位表达式\n\n表达式还可以使用上述表达式的组合。这种表达式称为 *复合表达式*。\n\n### Constant Expressions\n\
    \n常量表达式仅由常量值组成。示例：\n\n```\n15\n20 + 5 / 2.0\n'x'\n```\n\n### Integral Expressions\n\
    \n整数表达式是在执行所有自动和显式类型转换后产生整数结果的表达式。示例：\n\n```\nm\nm * n - 5\nm * 'x'\n5 + int(2.0)\n\
    ```\n\n其中 m 和 n 是整数变量。\n\n### Float Expressions\n\n浮点表达式是在所有转换后产生浮点结果的表达式。示例：\n\
    \n```\nx + y\nx * y / 10\n5 + float(10)\n10.75\n```\n\n其中 x 和 y 是浮点变量。\n\n###\
    \ Pointer Expressions\n\n指针表达式产生地址值。示例：\n\n```\n&m\nptr\nptr + 1\n\"xyz\"\n```\n\
    \n其中 m 是一个变量，ptr 是一个指针。\n\n### Relational Expressions\n\n关系表达式产生类型为 bool 的结果，其取值为\
    \ true 或 false。示例：\n\n```\nx <= y\na+b == c+d\nm+n > 100\n```\n\n当算术表达式用于关系运算符的两侧时，它们会先被求值，然后再比较结果。关系表达式也称为布尔表达式。\n\
    \n### Logical Expressions\n\n逻辑表达式组合两个或多个关系表达式并产生 bool 类型结果。示例：\n\n```\na>b &&\
    \ x==10\nx==10 || y==5\n```\n\n### Bitwise Expressions\n\n按位表达式用于在位级别操作数据。它们主要用于测试或移位位。示例：\n\
    \n```\nx << 3    // Shift three bit position to left\ny >> 1    // Shift one bit\
    \ position to right\n```\n\n移位运算符通常用于乘以或除以 2 的幂。\n\nANSI C++ 引入了所谓的运算符关键字，可用作运算符符号的替代表示。运算符关键字在第\
    \ 16 章给出。\n\n## 3.20 Special Assignment Expressions\n\n### Chained Assignment\n\
    \n```\nx = (y = 10);\n    or\nx = y = 10;\n```\n\n首先将 10 赋给 y，然后赋给 x。\n\n链式语句不能在声明时用于初始化变量。例如，语句\n\
    \n```\nfloat a = b = 12.34;    // wrong\n```\n\n是非法的。这可以写成\n\n```\nfloat a=12.34,\
    \ b=12.34    // correct\n```\n\n### Embedded Assignment\n\n```\nx = (y = 50) +\
    \ 10;\n```\n\n`(y = 50)` 是一个赋值表达式，称为嵌入赋值。这里，值 50 被赋给 y，然后结果 50+10 = 60 被赋给 x。该语句等同于\n\
    \n```\ny = 50;\nx = y + 10;\n```\n\n### Compound Assignment\n\n像 C 一样，C++ 支持复合赋值运算符，它是赋值运算符与二元算术运算符的组合。例如，简单的赋值语句\n\
    \n```\nx = x + 10;\n```\n\n可以写成\n\n```\nx += 10;\n```\n\n运算符 `+=` 称为复合赋值运算符或简写赋值运算符。复合赋值运算符的一般形式为：\n\
    \n```\nvariable1 op= variable2;\n```\n\n其中 op 是一个二元算术运算符。这意味着\n\n```\nvariable1\
    \ = variable1 op variable2;\n```\n\n## 3.21  Implicit Conversions\n\n我们可以在表达式中混合数据类型。例如，\n\
    \n```\nm = 5+2.75;\n```\n\n是一个有效的语句。每当在表达式中混合数据类型时，C++ 都会自动执行转换。此过程称为隐式或自动转换。\n\
    \n当编译器遇到一个表达式时，它将表达式分为由一个运算符和一个或两个操作数组成的子表达式。对于二元运算符，如果操作数类型不同，编译器会将其中一个转换为匹配另一个，使用规则将较小的类型转换为较宽的类型。例如，如果一个操作数是\
    \ int，另一个是 float，则 int 会被转换为 float，因为 float 比 int 更宽。图 3.3 所示的“瀑布”模型说明了此规则。\n\n\
    ## 3.22 Operator Overloading\n\n如前所述，重载意味着根据上下文为操作赋予不同的含义。C++ 允许运算符重载，从而使我们能够为运算符赋予多重含义。实际上，我们在\
    \ C 中也使用了重载的概念。例如，运算符 * 当应用于指针变量时，给出指针指向的值。但它也常用于乘以两个数字。操作数的数量和类型决定了要执行的操作的性质。\n\
    \n输入/输出运算符 << 和 >> 是运算符重载的良好示例。虽然 << 运算符的内置定义是用于位移位，但它也用于显示各种数据类型的数值。这是通过头文件 iostream\
    \ 实现的，其中包含大量 << 的重载定义。因此，语句\n\n```\ncout << 75.86;\n```\n\n调用用于显示 double 类型值的定义，而\n\
    \n```\ncout << \"well done\";\n```\n\n调用用于显示 char 值的定义。然而，iostream 中的这些定义不会影响运算符的内置含义。\n\
    \n同样，我们可以为其他 C++ 运算符定义额外的含义。例如，我们可以定义 + 运算符来添加两个结构或对象。几乎所有 C++ 运算符都可以被重载，少数例外如成员访问运算符\
    \ (., 和 .*), 条件运算符 (?:), 作用域解析运算符 (::) 和 sizeof 运算符。运算符重载的定义在第 7 章中详细讨论。\n\n##\
    \ 3.23 Operator Precedence\n\n尽管 C++ 使我们能够为运算符添加多重含义，但它们的关联性和优先级仍然保持不变。例如，乘法运算符的优先级仍高于加法运算符。表\
    \ 3.5 给出了所有 C++ 运算符的优先级和结合性。组是按优先级递减的顺序列出的。标签 prefix 和 postfix 区分了 ++ 和 -- 的用法。此外，符号\
    \ +, -, *, 和 & 既用作一元运算符也用作二元运算符。\n\nANSI C++ 运算符的完整列表及其含义、优先级、结合性和用法在附录 E 中给出。\n\
    \n"
