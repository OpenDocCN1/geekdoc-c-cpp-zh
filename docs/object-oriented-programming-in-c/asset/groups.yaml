  md: "\nconstant expression, such as\n\n```\nconst int size = 10;\nchar name[size];\n\
    ```\n\nThis would be illegal in C. `const` allows us to create typed constants\
    \ instead of having to use `#define` to create constants that have no type information.\n\
    \nAs with `long` and `short`, if we use the `const` modifier alone, it defaults\
    \ to `int`. For example,\n\n```\nconst size = 10;\n```\n\nmeans\n\n```\nconst\
    \ int size = 10;\n```\n\nThe named constants are just like variables except that\
    \ their values cannot be changed.\n\nC++ requires a `const` to be initialized.\
    \ ANSI C does not require an initializer; if none is given, it initializes the\
    \ `const` to 0.\n\nThe scoping of `const` values differs. A `const` in C++ defaults\
    \ to the internal linkage and therefore it is local to the file where it is declared.\
    \ In ANSI C, `const` values are global in nature. They are visible outside the\
    \ file in which they are declared. However, they can be made local by declaring\
    \ them as `static`. To give a `const` value an external linkage so that it can\
    \ be referenced from another file, we must explicitly define it as an `extern`\
    \ in C++. Example:\n\n```\nextern const total = 100;\n```\n\nAnother method of\
    \ naming integer constants is by enumeration as under:\n\n```\nenum {X,Y,Z};\n\
    ```\n\nThis defines X, Y and Z as integer constants with values 0, 1, and 2 respectively.\
    \ This is equivalent to:\n\n```\nconst X = 0;\nconst Y = 1;\nconst Z = 2;\n```\n\
    \nWe can also assign values to X, Y, and Z explicitly. Example:\n\n```\nenum{X=100,\
    \ Y=50, Z=200};\n```\n\nSuch values can be any integer values. Enumerated data\
    \ type has been discussed in detail in Section 3.6.\n\n## 3.9 Type Compatibility\n\
    \nC++ is very strict with regard to type compatibility as compared to C. For instance,\
    \ C++ defines `int`, `short int`, and `long int` as three different types. They\
    \ must be cast when their values are assigned to one another. Similarly, `unsigned\
    \ char`, `char`, and `signed char` are considered as different types, although\
    \ each of these has a size of one byte. In C++, the types of values must be the\
    \ same for complete compatibility, or else, a cast must be applied. These restrictions\
    \ in C++ are necessary in order to support function overloading where two functions\
    \ with the same name are distinguished using the type of function arguments.\n\
    \nAnother notable difference is the way `char` constants are stored. In C, they\
    \ are stored as `int`s, and therefore,\n\n```\nsizeof ('x')\n```\n\nis equivalent\
    \ to\n\n```\nsizeof(int)\n```\n\nin C. In C++, however, `char` is not promoted\
    \ to the size of `int` and therefore\n\n```\nsizeof('x')\n```\n\nequals\n\n```\n\
    sizeof(char)\n```\n\n## 3.10 Declaration of Variables\n\nWe know that, in C, all\
    \ variables must be declared before they are used in executable statements. This\
    \ is true with C++ as well. However, there is a significant difference between\
    \ C and C++ with regard to the place of their declaration in the program. C requires\
    \ all the variables to be defined at the beginning of a scope. When we read a\
    \ C program, we usually come across a group of variable declarations at the beginning\
    \ of each scope level. Their actual use appears elsewhere in the scope, sometimes\
    \ far away from the place of declaration. Before using a variable, we should go\
    \ back to the beginning of the program to see whether it has been declared and,\
    \ if so, of what type.\n\nC++ allows the declaration of a variable anywhere in\
    \ the scope. This means that a variable can be declared right at the place of\
    \ its first use. This makes the program much easier to write and reduces the errors\
    \ that may be caused by having to scan back and forth. It also makes the program\
    \ easier to understand because the variables are declared in the context of their\
    \ use.\n\nThe example below illustrates this point.\n\n```\nint main()\n{\n  \
    \  float x;                // declaration\n    float sum = 0;\n\n    for(int i=1;\
    \ i<5; i++)  // declaration\n    {\n        cin >> x;\n        sum = sum +x;\n\
    \    }\n    float average;          // declaration\n    average = sum/(i-1);\n\
    \    cout << average;\n\n    return 0;\n}\n```\n\nThe only disadvantage of this\
    \ style of declaration is that we cannot see all the variables used in a scope\
    \ at a glance.\n\n## 3.11 Dynamic Initialization of Variables\n\nIn C, a variable\
    \ must be initialized using a constant expression, and the C compiler would fix\
    \ the initialization code at the time of compilation. C++, however, permits initialization\
    \ of the variables at run time. This is referred to as dynamic initialization.\
    \ In C++, a variable can be initialized at run time using expressions at the place\
    \ of declaration. For example, the following are valid initialization statements:\n\
    \n```\n.....\n.....\nint n = strlen(string);\n.....\nfloat area = 3.14159 * rad\
    \ * rad;\n```\n\nThus, both the declaration and the initialization of a variable\
    \ can be done simultaneously at the place where the variable is used for the first\
    \ time. The following two statements in the example of the previous section\n\n\
    ```\nfloat average; // declare where it is necessary\naverage = sum/i;\n```\n\n\
    can be combined into a single statement:\n\n```\nfloat average = sum/i; // initialize\
    \ dynamically at run time\n```\n\nDynamic initialization is extensively used in\
    \ object-oriented programming. We can create exactly the type of object needed,\
    \ using information that is known only at the run time.\n\n## 3.12 Reference Variables\n\
    \nC++ introduces a new kind of variable known as the reference variable. A reference\
    \ variable provides an alias (alternative name) for a previously defined variable.\
    \ For example, if we make the variable `sum` a reference to the variable `total`,\
    \ then `sum` and `total` can be used interchangeably to represent that variable.\
    \ A reference variable is created as follows:\n\n```\ndata-type & reference-name\
    \ = variable-name\n```\n\nExample:\n\n```\nfloat total = 100;\nfloat & sum = total;\n\
    ```\n\n`total` is a float type variable that has already been declared; `sum`\
    \ is the alternative name declared to represent the variable `total`. Both the\
    \ variables refer to the same data object in the memory. Now, the statements\n\
    \n```\ncout << total;\n```\n\nand\n\n```\ncout << sum;\n```\n\nboth print the\
    \ value 100. The statement\n\n```\ntotal = total + 10;\n```\n\nwill change the\
    \ value of both `total` and `sum` to 110. Likewise, the assignment\n\n```\nsum\
    \ = 0;\n```\n\nwill change the value of both the variables to zero.\n\nA reference\
    \ variable must be initialized at the time of declaration. This establishes the\
    \ correspondence between the reference and the data object which it names. It\
    \ is important to note that the initialization of a reference variable is completely\
    \ different from assignment to it.\n\nC++ assigns additional meaning to the symbol\
    \ `&`. Here, `&` is not an address operator. The notation `float &` means reference\
    \ to float. Other examples are:\n\n```\nint n[10];\nint & x = n[10];      // x\
    \ is alias for n[10]\nchar & a = '\\n';      // initialize reference to a literal\n\
    ```\n\nThe variable `x` is an alternative to the array element `n[10]`. The variable\
    \ `a` is initialized to the newline constant. This creates a reference to the\
    \ otherwise unknown location where the newline constant `\\n` is stored.\n\nThe\
    \ following references are also allowed:\n\n- i. `int x;`\n  `int *p = &x;`\n\
    \  `int & m = *p;`\n- ii. `int & n = 50;`\n\nThe first set of declarations causes\
    \ `m` to refer to `x` which is pointed to by the pointer `p` and the statement\
    \ in (ii) creates an int object with value 50 and name `n`.\n\nA major application\
    \ of reference variables is in passing arguments to functions. Consider the following:\n\
    \n```\nvoid f(int & x)      // uses reference\n{\n    x = x+10;         // x is\
    \ incremented; so also m\n}\nint main()\n{\n    int m = 10;\n    f(m);       \
    \      // function call\n    .....\n    .....\n}\n```\n\nWhen the function call\
    \ `f(m)` is executed, the following initialization occurs:\n\n```\nint & x = m;\n\
    ```\n\nThus `x` becomes an alias of `m` after executing the statement\n\n```\n\
    f(m);\n```\n\nSuch function calls are known as call by reference. This implementation\
    \ is illustrated in Fig. 3.2. Since the variables `x` and `m` are aliases, when\
    \ the function increments `x`, `m` is also incremented. The value of `m` becomes\
    \ 20 after the function is executed. In traditional C, we accomplish this operation\
    \ using pointers and dereferencing techniques.\n\n![](img/58ab8f034e2127e80560390a921c2523_62_0.png)\n\
    \nThe call by reference mechanism is useful in object-oriented programming because\
    \ it permits the manipulation of objects by reference, and eliminates the copying\
    \ of object parameters back and forth. It is also important to note that references\
    \ can be created not only for built-in data types but also for user-defined data\
    \ types such as structures and classes. References work wonderfully well with\
    \ these user-defined data types.\n\n## 3.13 Operators in C++\n\nC++ has a rich\
    \ set of operators. All C operators are valid in C++ also. In addition, C++ introduces\
    \ some new operators. We have already seen two such operators, namely, the insertion\
    \ operator `<<`, and the extraction operator `>>`. Other new operators are:\n\n\
    - `::` Scope resolution operator\n- `::*` Pointer-to-member declarator\n- `->*`\
    \ Pointer-to-member operator\n- `.*` Pointer-to-member operator\n- `delete` Memory\
    \ release operator\n- `endl` Line feed operator\n- `new` Memory allocation operator\n\
    - `setw` Field width operator\n\nIn addition, C++ also allows us to provide new\
    \ definitions to some of the built-in operators. That is, we can give several\
    \ meanings to an operator, depending upon the types of arguments used. This process\
    \ is known as operator overloading.\n"
  mdcn: "\n\n常量表达式，例如\n\n```\nconst int size = 10;\nchar name[size];\n```\n\n这在 C\
    \ 中是非法的。`const` 允许我们创建类型化的常量，而不必使用 `#define` 来创建没有类型信息 的常量。\n\n与 `long` 和 `short`\
