    +   5. Portability

    +   6. Security

    +   7. Integrity

    +   8. User friendliness


    Selection and use of proper software tools would help resolving some of these
    issues.


    ![](img/58ab8f034e2127e80560390a921c2523_16_0.png)




    Ernest Tello, a well-known writer in the field of artificial intelligence, compared
    the evolution of software technology to the growth of a tree. Like a tree, the
    software evolution has had distinct phases or “layers” of growth. These layers
    were built up one by one over the last five decades as shown in Fig. 1.3, with
    each layer representing an improvement over the previous one. However, the analogy
    fails if we consider the life of these layers. In software systems, each of the
    layers continues to be functional, whereas in the case of trees, only the uppermost
    layer is functional.


    > “As complexity increases, architecture dominates the basic material”. To build
    today''s complex software it is just not enough to put together a sequence of
    programming statements and sets of procedures and modules; we need to incorporate
    sound construction techniques and program structures that are easy to comprehend,
    implement and modify.


    Since the invention of the computer, many programming approaches have been tried.'
