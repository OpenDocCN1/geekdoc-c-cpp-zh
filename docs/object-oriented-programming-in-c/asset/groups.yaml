    A major application of the scope resolution (::) operator is in the classes to
    identify the class to which a member function belongs.


    In addition to malloc(), calloc() and free() functions, C++ also provides two
    unary operators, new and delete to perform the task of allocating and freeing
    the memory in a better and easier way.


    C++ also provides manipulators to format the data display. The most commonly used
    manipulators are endl and setw.


    C++ supports seven types of expressions. When data types are mixed in an expression,
    C++ performs the conversion automatically using certain rules.


    C++ also permits explicit type conversion of variables and expressions using the
    type cast operators.


    Like C, C++ also supports the three basic control structures namely, sequence,
    selection and loop, and implements them using various control statements such
    as, if, if...else, switch, do..while, while and for.


