    ```\n\n此类值可以是任意整数值。枚举数据类型已在第 3.6 节中详细讨论。\n\n## 3.9 类型兼容性\n\n与 C 相比，C++ 对类型兼容性非常严格。例如，C++\
    \ 将 `int`、`short int` 和 `long int` 定义为三种不同的类型。当它们的值相互赋值时，必须进行强制转换。同样，`unsigned\
    \ char`、`char` 和 `signed char` 被视为不同的类型，尽管每个的大小都是一个字节。在 C++ 中，值的类型必须相同才能完全兼容，否则必须应用强制转换。C++\
    \ 中的这些限制是必要的，以便支持函数重载，其中两个同名函数使用函数参数的类型来区分。\n\n另一个显著的区别是 `char` 常量存储的方式。在 C 中，它们存储为\
    \ `int`，因此，\n\n```\nsizeof ('x')\n```\n\n等价于\n\n```\nsizeof(int)\n```\n\n在 C 中。在\
    \ C++ 中，`char` 不会提升到 `int` 的大小，因此\n\n```\nsizeof('x')\n```\n\n等于\n\n```\nsizeof(char)\n\
    ```\n\n## 3.10 变量声明\n\n我们知道，在 C 中，所有变量必须在可执行语句中使用之前声明。这在 C++ 中也是正确的。然而，C 和 C++\
    \ 在程序中声明位置方面存在显著差异。C 要求所有变量都必须在作用域开始处定义。当我们阅读 C 程序时，我们通常会在每个作用域级别的开头看到一组变量声明。它们的实际使用出现在作用域的其他地方，有时远离声明的位置。在使用变量之前，我们必须回到程序的开头，查看它是否已被声明，如果已声明，其类型是什么。\n\
    \nC++ 允许在作用域中的任何位置声明变量。这意味着变量可以在首次使用时立即声明。这使得程序更容易编写，并减少了因来回扫描而可能产生的错误。它还使程序更容易理解，因为变量是在其使用的上下文中声明的。\n\
    \n下面的示例说明了这一点。\n\n```\nint main()\n{\n    float x;                // declaration\n\
    \    float sum = 0;\n\n    for(int i=1; i<5; i++)  // declaration\n    {\n   \
    \     cin >> x;\n        sum = sum +x;\n    }\n    float average;          //\
    \ declaration\n    average = sum/(i-1);\n    cout << average;\n\n    return 0;\n\
    }\n```\n\n这种声明方式的唯一缺点是，我们无法一眼看出作用域中使用的所有变量。\n\n## 3.11 变量的动态初始化\n\n在 C 中，变量必须使用常量表达式初始化，并且\
    \ C 编译器会在编译时修复初始化代码。C++，然而，允许在运行时初始化变量。这被称为动态初始化。在 C++ 中，变量可以在声明位置使用表达式在运行时初始化。例如，以下是有效的初始化语句：\n\
    \n```\n.....\n.....\nint n = strlen(string);\n.....\nfloat area = 3.14159 * rad\
    \ * rad;\n```\n\n因此，变量的声明和初始化可以在变量首次使用时同时完成。上一节示例中的以下两个语句\n\n```\nfloat average;\
    \ // declare where it is necessary\naverage = sum/i;\n```\n\n可以合并为单个语句：\n\n```\n\
    float average = sum/i; // initialize dynamically at run time\n```\n\n动态初始化在面向对象编程中被广泛使用。我们可以使用仅在运行时才知道的信息创建所需类型的对象。\n\
    \n## 3.12 引用变量\n\nC++ 引入了一种新的变量类型，称为引用变量。引用变量为先前定义的变量提供别名（替代名称）。例如，如果我们使变量 `sum`\
    \ 成为变量 `total` 的引用，那么 `sum` 和 `total` 可以互换使用来表示该变量。引用变量的创建方式如下：\n\n```\ndata-type\
    \ & reference-name = variable-name\n```\n\n示例：\n\n```\nfloat total = 100;\nfloat\
    \ & sum = total;\n```\n\n`total` 是一个已声明的 float 类型变量；`sum` 是声明为表示变量 `total` 的替代名称。两个变量都引用内存中的同一个数据对象。现在，语句\n\
    \n```\ncout << total;\n```\n\n和\n\n```\ncout << sum;\n```\n\n都打印值 100。语句\n\n```\n\
    total = total + 10;\n```\n\n会将 `total` 和 `sum` 的值都更改为 110。同样，赋值\n\n```\nsum =\
    \ 0;\n```\n\n会将两个变量的值都更改为零。\n\n引用变量必须在声明时初始化。这建立了引用与其命名的对象之间的对应关系。需要注意的是，引用变量的初始化与对其的赋值完全不同。\n\
    \nC++ 为符号 `&` 赋予了额外的含义。这里，`&` 不是地址运算符。记号 `float &` 表示对 float 的引用。其他示例是：\n\n```\n\
    int n[10];\nint & x = n[10];      // x is alias for n[10]\nchar & a = '\\n'; \
    \     // initialize reference to a literal\n```\n\n变量 `x` 是数组元素 `n[10]` 的替代。变量\
    \ `a` 初始化为换行常量。这创建了对换行常量 `\\n` 存储的否则未知位置的引用。\n\n以下引用也是允许的：\n\n- i. `int x;`\n\
    \  `int *p = &x;`\n  `int & m = *p;`\n- ii. `int & n = 50;`\n\n第一组声明导致 `m` 引用由指针\
    \ `p` 指向的 `x`，而语句 (ii) 创建了一个值为 50 且名为 `n` 的 int 对象。\n\n引用变量的一个主要应用是在向函数传递参数时。考虑以下内容：\n\
    \n```\nvoid f(int & x)      // uses reference\n{\n    x = x+10;         // x is\
    \ incremented; so also m\n}\nint main()\n{\n    int m = 10;\n    f(m);       \
    \      // function call\n    .....\n    .....\n}\n```\n\n当执行函数调用 `f(m)` 时，会发生以下初始化：\n\
    \n```\nint & x = m;\n```\n\n因此 `x` 在执行语句\n\n```\nf(m);\n```\n\n之后成为 `m` 的别名。这种函数调用被称为按引用调用。这种实现如图\
    \ 3.2 所示。由于变量 `x` 和 `m` 是别名，当函数递增 `x` 时，`m` 也会被递增。`m` 的值在函数执行后变为 20。在传统的 C 中，我们使用指针和解引用技术完成此操作。\n\
    \n![](img/58ab8f034e2127e80560390a921c2523_62_0.png)\n\n按引用调用机制在面向对象编程中很有用，因为它允许通过引用操作对象，并消除了对象参数的来回复制。还需要注意的是，引用不仅可以为内置数据类型创建，也可以为用户定义的数据类型（如结构和类）创建。引用与这些用户定义的数据类型配合得非常好。\n\
    \n## 3.13 C++ 中的运算符\n\nC++ 拥有丰富的运算符集。所有 C 运算符在 C++ 中也有效。此外，C++ 还引入了一些新运算符。我们已经看到了两个这样的运算符，即插入运算符\
    \ `<<` 和提取运算符 `>>`。其他新运算符有：\n\n- `::` 作用域解析运算符\n- `::*` 指向成员声明符\n- `->*` 指向成员运算符\n\
    - `.*` 指向成员运算符\n- `delete` 内存释放运算符\n- `endl` 换行运算符\n- `new` 内存分配运算符\n- `setw`\
    \ 字段宽度运算符\n\n此外，C++ 还允许我们为某些内置运算符提供新的定义。也就是说，我们可以根据使用的参数类型为运算符赋予多种含义。此过程称为运算符重载。\n\
    \n"
