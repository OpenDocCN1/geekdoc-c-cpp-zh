    \ << cost    << \"\\n\";\n        }\n};\n```\n\n当函数在类内定义时，它被视为内联函数。因此，适用于内联函数的所有限制和局限性也适用于此处。通常，只有小型函数才在类定义内定义。\n\
    \n## 5.5 A C++ Program with Class\n\n迄今为止讨论的所有细节都在程序 5.1 中实现。\n\n## CLASS IMPLEMENTATION\n\
