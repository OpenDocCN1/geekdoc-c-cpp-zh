    # 3.24 Control Structures


    In C++, a large number of functions are used that pass messages, and process the
    data contained in objects. A function is set up to perform a task. When the task
    is complex, many different algorithms can be designed to achieve the same goal.
    Some are simple to comprehend, while others are not. Experience has also shown
    that the number of bugs that occur is related to the format of the program. The
    format should be such that it is easy to trace the flow of execution of statements.
    This would help not only in debugging but also in the review and maintenance of
    the program later. One method of achieving the objective of an accurate, error-resistant
    and maintainable code is to use one or any combination of the following three
    control structures:


    +   1. Sequence structure (straight line)

    +   2. Selection structure (branching)

    +   3. Loop structure (iteration or repetition)


    Figure 3.4 shows how these structures are implemented using one-entry, one-exit
    concept, a popular approach used in modular programming.'
