    \    }\n    return(sum);\n}\n\nvoid println(char ch, int len)\n{\n    for(int\
    \ i=1; i<=len; i++) printf(\"%c\",ch);\n    printf(\"\\n\");\n}\n```\n\n程序 4.2\
    \ 的输出为\n\n```\n***********************************\n\n    Final Value = 10056.8\n\
    \n===================================\n```\n\n提供默认参数的优点是：\n\n- 1. 我们可以使用默认参数为现有函数添加新参数。\n\
    - 2. 默认参数可用于将相似函数合并为一个。\n\n## 4.8 const Arguments\n\n在 C++ 中，函数的参数可以声明为 const，如下所示。\n\
    \n```\nint strlen(const char *p);\nint length(const string &s);\n```\n\n限定符 const\
    \ 告诉编译器函数不应修改参数。当此条件被违反时，编译器会生成错误。这种类型的声明只有在我们通过引用或指针传递参数时才有意义。\n\n## 4.9 Function\
    \ Overloading\n\n如前所述，重载是指对不同目的使用同一事物。C++ 也允许函数重载。这意味着我们可以使用相同的函数名创建执行各种不同任务的函数。这在\
    \ OOP 中称为函数多态性。\n\n使用函数重载的概念，我们可以用一个函数名设计一组函数，但参数列表不同。函数将根据函数调用中的参数列表执行不同的操作。要调用的正确函数是通过检查参数的数量和类型而不是函数类型来确定的。例如，重载的\
    \ add() 函数处理不同类型的数据，如下所示：\n\n```\n// Declarations\nint add(int a, int b);    \
    \                  // prototype 1\nint add(int a, int b, int c);             \
    \  // prototype 2\ndouble add(double x, double y);             // prototype 3\n\
    double add(int p, double q);                // prototype 4\ndouble add(double\
    \ p, int q);                // prototype 5\n\n// Function calls\ncout << add(5,\
    \ 10);                         // uses prototype 1\ncout << add(15, 10.0);   \
    \                   // uses prototype 4\ncout << add(12.5, 7.5);             \
    \        // uses prototype 3\ncout << add(5, 10, 15);                     // uses\
    \ prototype 2\ncout << add(0.75, 5);                       // uses prototype 5\n\
    ```\n\n函数调用首先匹配具有相同数量和类型参数的原型，然后调用适当的函数执行。最佳匹配必须是唯一的。函数选择涉及以下步骤：\n\n- 1. 编译器首先尝试找到完全匹配，其中实际参数的类型相同，并使用该函数。\n\
    - 2. 如果找不到完全匹配，编译器会使用对实际参数的整型提升，例如，\n- 3. 当两者都失败时，编译器会尝试使用内置转换（隐式赋值转换）对实际参数进行转换，然后使用匹配唯一的函数。如果转换可能产生多个匹配，则编译器会生成错误消息。假设我们使用以下两个函数：\n\
    - 4. 如果所有步骤都失败，则编译器会尝试用户定义的转换结合整型提升和内置转换来找到唯一的匹配。用户定义的转换通常用于处理类对象。\n\n```\nchar\
    \ to int\nfloat to double\n```\n\n```\nlong square(long n)\ndouble square(double\
    \ x)\n```\n\n函数调用例如\n\n```\nsquare(10)\n```\n\n会引起错误，因为 int 参数可以转换为 long 或 double，从而造成应使用\
    \ square() 的哪个版本的不明确情况。\n\n程序 4.3 说明了函数重载。\n\n## FUNCTION OVERLOADING\n\n```\n\
    // Function volume() is overloaded three times\n\n#include <iostream>\n\nusing\
    \ namespace std;\n\n// Declarations (prototypes)\nint volume(int);\ndouble volume(double,\
    \ int);\nlong volume(long, int, int);\n\nint main()\n{\n    cout << volume(10)\
    \ << \"\\n\";\n    cout << volume(2.5,8) << \"\\n\";\n    cout << volume(100L,75,15)\
    \ << \"\\n\";\n    return 0;\n}\n\n// Function definitions\n\nint volume(int s)\
    \  // cube\n{\n    return(s*s*s);\n}\n\ndouble volume(double r, int h)  // cylinder\n\
    {\n    return(3.14519*r*r*h);\n}\n\nlong volume(long l, int b, int h) // rectangular\
    \ box\n{\n    return(l*b*h);\n}\n```\n\nPROGRAM 4.3\n\n程序 4.3 的输出为：\n\n1000\n\
    157.26\n112500\n\n函数重载应谨慎进行。我们不应重载不相关的函数，而应将函数重载保留给执行密切相关任务的函数。有时，默认参数可代替重载使用。这可减少需要定义的函数数量。\n\
    \n重载函数被广泛用于处理类对象。当在下一章讨论类时，将对其进行说明。\n\n## 4.10 Friend and Virtual Functions\n\n\
    C++ 引入了两种新型函数，即友元函数和虚函数。它们基本上是为了处理与类对象相关的某些特定任务而引入的。因此，对这些函数的讨论已推迟到类对象讨论之后。友元函数在下一章的第\
    \ 5.15 节中讨论，虚函数在第 9 章的第 9.5 节中讨论。\n"
