    \ ANSI C 中，`const` 值本质上是全局的。它们在声明它们的文件之外可见。但是，可以通过将它们声明为 `static` 使其成为局部变量。要为\
    \ `const` 值赋予外部链接，以便可以从另一个文件引用它，我们必须在 C++ 中显式将其定义为 `extern`。示例：\n\n```\nextern\
    \ const total = 100;\n```\n\n命名整数常量的另一种方法是使用枚举，如下所示：\n\n```\nenum {X,Y,Z};\n```\n\
