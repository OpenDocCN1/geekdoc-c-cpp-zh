  - "[PAGE 110]\n\nextension of the idea of structure used in C. It is a new way of\
    \ creating and implementing a user-defined data type. We shall discuss, in this\
    \ chapter, the concept of class by first reviewing the traditional structures\
    \ found in C and then the ways in which classes can be designed, implemented and\
    \ applied.\n\n# 5.2  C Structures Revisited\n\nWe know that one of the unique\
    \ features of the C language is structures. They provide a method for packing\
    \ together data of different types. A structure is a convenient tool for handling\
    \ a group of logically related data items. It is a user-defined data type with\
    \ a *template* that serves to define its data properties. Once the structure type\
    \ has been defined, we can create variables of that type using declarations that\
    \ are similar to the built-in type declarations. For example, consider the following\
    \ declaration:\n\n```\n```c\nstruct student\n{\n        char   name[20];\n   \
    \     int    roll_number;\n        float  total_marks;\n};\n```\n```\n\nThe keyword\
    \ struct declares student as a new data type that can hold three fields of different\
    \ data types. These fields are known as *structure members* or *elements*. The\
    \ identifier student, which is referred to as *structure name* or *structure tag*,\
    \ can be used to create variables of type student. Example:\n\n```\n```c\nstruct\
    \ student A;   // C declaration\n```\n```\n\nA is a variable of type student and\
    \ has three member variables as defined by the template. Member variables can\
    \ be accessed using the *dot* or *period operator* as follows:\n\n```\n```c\n\
    strcpy(A.name, \"John\");\nA.roll_number = 999;\nA.total_marks = 595.5;\nfinal_total\
    \ = A.total_marks + 5;\n```\n```\n\nStructures can have arrays, pointers or structures\
    \ as members.\n\n# Limitations of C Structure\n\nThe standard C does not allow\
    \ the struct data type to be treated like built-in types. For example, consider\
    \ the following structure:"
  - "[PAGE 111]\n\n```\n```cpp\nstruct complex\n{\n    float x;\n    float y;\n};\n\
    struct complex c1, c2, c3;\n```\n```\n\nThe complex numbers c1, c2, and c3 can\
    \ easily be assigned values using the dot operator, but we cannot add two complex\
    \ numbers or subtract one from the other. For example,\n\n```\n```cpp\nc3 = c1\
    \ + c2;\n```\n```\n\nis illegal in C.\n\nAnother important limitation of C structures\
    \ is that they do not permit *data hiding*. Structure members can be directly\
    \ accessed by the structure variables by any function anywhere in their scope.\
    \ In other words, the structure members are public members.\n\n# Extensions to\
    \ Structures\n\nC++ supports all the features of structures as defined in C. But\
    \ C++ has expanded its capabilities further to suit its OOP philosophy. It attempts\
    \ to bring the user-defined types as close as possible to the built-in data types,\
    \ and also provides a facility to hide the data which is one of the main principles\
    \ of OOP. *Inheritance*, a mechanism by which one type can inherit characteristics\
    \ from other types, is also supported by C++.\n\nIn C++, a structure can have\
    \ both variables and functions as members. It can also declare some of its members\
    \ as 'private' so that they cannot be accessed directly by the external functions.\n\
    \nIn C++, the structure names are stand-alone and can be used like any other type\
    \ names. In other words, the keyword struct can be omitted in the declaration\
    \ of structure variables. For example, we can declare the student variable A as\n\
    \n```\n```cpp\nstudent A;    // C++ declaration\n```\n```\n\nRemember, this is\
    \ an error in C.\n\nC++ incorporates all these extensions in another user-defined\
    \ type known as class. There is very little syntactical difference between structures\
    \ and classes in C++ and, therefore, they can be used interchangeably with minor\
    \ modifications. Since class is a specially introduced data type in C++, most\
    \ of the C++ programmers tend to use the structures for holding only data, and\
    \ classes to hold both the data and functions. Therefore, we will not discuss\
    \ structures any further.\n\n> **Note:** The only difference between a structure\
    \ and a class in C++ is that, by default, the members of a class are *private*,\
    \ while, by default, the members of a structure are *public*."
  - "[PAGE 112]\n\n# 5.3 Specifying a Class\n\nA class is a way to bind the data and\
    \ its associated functions together. It allows the data (and functions) to be\
    \ hidden, if necessary, from external use. When defining a class, we are creating\
    \ a new abstract data type that can be treated like any other built-in data type.\
    \ Generally, a class specification has two parts:\n\n+   1. Class declaration\n\
    +   2. Class function definitions\n\nThe class declaration describes the type\
    \ and scope of its members. The class function definitions describe how the class\
    \ functions are implemented.\n\nThe general form of a class declaration is:\n\n\
    ```\nclass class_name\n{\n    private:\n        variable declarations;\n     \
    \   function declarations;\n    public:\n        variable declarations;\n    \
    \    function declaration;\n};\n```\n\nThe class declaration is similar to a struct\
    \ declaration. The keyword class specifies, that what follows is an abstract data\
    \ of type class_name. The body of a class is enclosed within braces and terminated\
    \ by a semicolon. The class body contains the declaration of variables and functions.\
    \ These functions and variables are collectively called class members. They are\
    \ usually grouped under two sections, namely, private and public to denote which\
    \ of the members are private and which of them are public. The keywords private\
    \ and public are known as visibility labels. Note that these keywords are followed\
    \ by a colon.\n\nThe class members that have been declared as private can be accessed\
    \ only from within the class. On the other hand, public members can be accessed\
    \ from outside the class also. The data hiding (using private declaration) is\
    \ the key feature of object-oriented programming. The use of the keyword private\
    \ is optional. By default, the members of a class are private. If both the labels\
    \ are missing, then, by default, all the members are private. Such a class is\
    \ completely hidden from the outside world and does not serve any purpose.\n\n\
    The variables declared inside the class are known as data members and the functions\
    \ are known as member functions. Only the member functions can have access to\
    \ the private data members and private functions. However, the public members\
    \ (both functions and data) can be accessed from outside the class. This is illustrated\
    \ in Fig. 5.1. The binding of data and functions together into a single class-type\
    \ variable is referred to as encapsulation."
