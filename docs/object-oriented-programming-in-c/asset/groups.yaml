    12.34              // floating point integer

    037                // octal integer

    0X2                // hexadecimal integer

    "C++"             // string constant

    ''A''                // character constant

    L''ab''              // wide-character constant

    ```


    The wchar_t type is a wide-character literal introduced by ANSI C++ and is intended
    for character sets that cannot fit a character into a single byte. Wide-character
    literals begin with the letter L.


