    ## 3.15 成员解引用运算符\n\n如你所知，C++ 允许我们定义一个包含各种类型的数据和函数的成员的类。C++ 还允许我们通过指针访问类的成员。为了实现这一点，C++\
    \ 提供了一组三个指针到成员运算符。表 3.3 显示了这些运算符及其功能。\n\n### 表 3.3 成员解引用运算符\n\n| Operator | Function\
    \ |\n|---|---|\n| ::* | To declare a pointer to a member of a class |\n| * | To\
    \ access a member using object name and a pointer to that member |\n| ->* | To\
    \ access a member using a pointer to the object and a pointer to that member |\n\
    \n只有在讨论完类之后，这些运算符的进一步细节才有意义，因此我们将成员解引用运算符的使用推迟到那时。\n\n## 3.16 内存管理运算符\n\nC 使用\
    \ malloc() 和 calloc() 函数在运行时动态分配内存。同样，它使用 free() 函数释放动态分配的内存。我们在事先不知道需要多少内存空间时使用动态分配技术。虽然\
    \ C++ 支持这些函数，但它还定义了两个一元运算符 new 和 delete，它们以更好、更简单的方式执行分配和释放内存的任务。由于这些运算符操作的是自由存储区上的内存，因此也被称为自由存储运算符。\n\
    \n对象可以使用 **new** 创建，并使用 **delete** 销毁，按需进行。用 **new** 在块内创建的数据对象，将一直存在，直到使用 **delete**\
    \ 显式销毁为止。因此，对象的生命周期完全在我们的控制之下，与程序的块结构无关。\n\n**new** 运算符可用于创建任何类型的对象。其一般形式为：\n\n\
    ```\npointer-variable = new data-type;\n```\n\n这里，*pointer-variable* 是 *data-type*\
    \ 类型的指针。**new** 运算符分配足够的内存来保存 *data-type* 类型的数据对象，并返回该对象的地址。*data-type* 可以是任何有效的数据类型。*pointer-variable*\
    \ 持有已分配内存空间的地址。示例：\n\n```\np = new int;\nq = new float;\n```\n\n其中 **p** 是 **int**\
    \ 类型的指针，**q** 是 **float** 类型的指针。这里，**p** 和 **q** 必须已声明为适当类型的指针。或者，我们可以按如下方式合并指针的声明和赋值：\n\
    \n```\nint *p = new int;\nfloat *q = new float;\n```\n\n随后，语句\n\n```\n*p = 25;\n\
    *q = 7.5;\n```\n\n将 25 分配给新创建的 **int** 对象，将 7.5 分配给 **float** 对象。\n\n我们也可以使用 **new**\
    \ 运算符初始化内存。这按如下方式完成：\n\n```\npointer-variable = new data-type(value);\n```\n\n\
    这里，value 指定初始值。示例：\n\n```\nint *p = new int(25);\nfloat *q = new float(7.5);\n\
    ```\n\n如前所述，new 可用于为任何数据类型创建内存空间，包括用户定义的类型，如数组、结构和类。一维数组的一般形式为：\n\n```\npointer-variable\
    \ = new data-type[size];\n```\n\n这里，size 指定数组中的元素数。例如，语句\n\n```\nint *p = new\
    \ int[10];\n```\n\n为 10 个整数的数组创建内存空间。p[0] 将引用第一个元素，p[1] 引用第二个元素，以此类推。\n\n使用 new\
    \ 创建多维数组时，必须提供所有数组大小。\n\n```\narray_ptr = new int[3][5][4];   // legal\narray_ptr\
    \ = new int[m][5][4];   // legal\narray_ptr = new int[3][5][ ];   // illegal\n\
    array_ptr = new int[ ][5][4];   // illegal\n```\n\n第一个维度可以是其值在运行时提供的变量，其余的必须是常量。\n\
    \nnew 对类对象的应用将在第 6 章中讨论。\n\n当数据对象不再需要时，它会被销毁以释放内存空间供重用。其使用的一般形式为：\n\n```\ndelete\
    \ pointer-variable;\n```\n\npointer-variable 是指向用 new 创建的数据对象的指针。示例：\n\n```\n\
    delete p;\ndelete q;\n```\n\n如果我们想释放动态分配的数组，必须使用 delete 的以下形式：\n\n```\ndelete\
    \ [size] pointer-variable;\n```\n\nsize 指定要释放的数组中的元素数。这个形式的问题在于程序员应该记住数组的大小。C++\
    \ 的最新版本不需要指定大小。例如，\n\n```\ndelete [ ]p;\n```\n\n将删除 p 所指向的整个数组。\n\n如果没有足够的内存进行分配会发生什么？在这种情况下，像\
    \ malloc() 一样，new 返回空指针。因此，在使用 new 产生的指针之前检查它是个好主意。做法如下：\n\n```\n....\n....\n\
