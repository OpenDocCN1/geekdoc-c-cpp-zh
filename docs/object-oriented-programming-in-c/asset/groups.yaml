    \n## 7.5 使用友元重载二元运算符\n\n如前所述，友元函数可以代替成员函数来重载二元运算符，唯一的区别在于：友元函数需要显式传递两个参数，而成员函数只需要一个。\n\
    \n上一节讨论的复数程序可以使用友元运算符函数进行修改，如下所示：\n\n- 1. 将成员函数声明替换为友元函数声明。\n  \n      ```cpp\n\
