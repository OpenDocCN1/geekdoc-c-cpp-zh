    changes. In November 1997, the ANSI/ISO standards committee standardised these
    changes and added several new features to the language specifications.


    C++ is a superset of C. Most of what we already know about C applies to C++ also.
    Therefore, almost all C programs are also C++ programs. However, there are a few
    minor differences that will prevent a C program to run under C++ compiler. We
    shall see these differences later as and when they are encountered.


    The most important facilities that C++ adds on to C are classes, inheritance,
    function overloading, and operator overloading. These features enable creating
    of abstract data types, inherit properties from existing data types and support
    polymorphism, thereby making C++ a truly object-oriented language.


    The object-oriented features in C++ allow programmers to build large programs
    with clarity, extensibility and ease of maintenance, incorporating the spirit
    and efficiency of C. The addition of new features has transformed C from a language
    that currently facilitates top-down, structured design, to one that provides bottom-up,
    object-oriented design.


