  - '[PAGE 43]


    of the interface (class definition) from the implementation details (member functions
    definition). Finally, the main program that uses the class is placed in a third
    file which includes the previous two files as well as any other files required.


    This approach is based on the concept of client-server model as shown in Fig.
    2.4. The class definition including the member functions constitute the server
    that provides services to the main program known as client. The client uses the
    server through the public interface of the class.


    ![](img/58ab8f034e2127e80560390a921c2523_43_0.png)


    # 2.7 Creating the Source File


    Like C programs, C++ programs can be created using any text editor. For example,
    on the UNIX, we can use vi or ed text editor for creating and editing the source
    code. On the DOS system, we can use edit or any other editor available or a word
    processor system under non-document mode.


    Some systems such as Turbo C++ provide an integrated environment for developing
    and editing programs. Appropriate manuals should be consulted for complete details.


    The file name should have a proper file extension to indicate that it is a C++
    program file. C++ implementations use extensions such as .c, .C, .cc, .cpp and
    .cxx. Turbo C++ and Borland C++ use .c for C programs and .cpp (C plus plus) for
    C++ programs. Zortech C++ system uses .cxx while UNIX AT&T version uses .C (capital
    C) and .cc. The operating system manuals should be consulted to determine the
    proper file name extensions to be used.


    # 2.8 Compiling and Linking


    The process of compiling and linking again depends upon the operating system.
    A few popular systems are discussed in this section.


    # Unix AT&T C++


    The process of implementation of a C++ program under UNIX is similar to that of
    a C program. We should use the "CC" (uppercase) command to compile the program.
    Remember, we use lowercase "cc" for compiling C programs. The command


    ```

    CC example.C

    ```


    at the UNIX prompt would compile the C++ program source code contained in the
    file example.C. The compiler would produce an object file example.o and then automatically
    link with the library functions to produce an executable file. The default executable
    filename is a.out.'
  - '[PAGE 44]


    A program spread over multiple files can be compiled as follows:


    ```

    cc file1.C file2.o

    ```


    The statement compiles only the file file1.C and links it with the previously
    compiled file2.o file. This is useful when only one of the files needs to be modified.
    The files that are not modified need not be compiled again.


    # Turbo C++ and Borland C++


    Turbo C++ and Borland C++ provide an integrated program development environment
    under MS DOS. They provide a built-in editor and a menu bar which includes options
    such as File, Edit, Compile and Run.


    We can create and save the source files under the File option, and edit them under
    the Edit option. We can then compile the program under the Compile option and
    execute it under the Run option. The Run option can be used without compiling
    the source code. In this case, the RUN command causes the system to compile, link
    and run the program in one step. Turbo C++ being the most popular compiler, creation
    and execution of programs under Turbo C++ system are discussed in detail in Appendix
    B.


    # Visual C++


    It is a Microsoft application development system for C++ that runs under Windows.
    Visual C++ is a visual programming environment in which basic program components
    can be selected through menu choices, buttons, icons, and other predetermined
    methods. Development and execution of C++ programs under Windows are briefly explained
    in Appendix C.


    # SUMMARY


    +   ↔ C++ is a superset of C language.


    +   ↔ C++ adds a number of object-oriented features such as objects, inheritance,
    function overloading and operator overloading to C. These features enable building
    of programs with clarity, extensibility and ease of maintenance.


    +   ↔ C++ can be used to build a variety of systems such as editors, compilers,
    databases, communication systems, and many more complex real-life application
    systems.


    +   ↔ C++ supports interactive input and output features and introduces a new
    comment symbol // that can be used for single line comments. It also supports
    C-style comments.


    +   ↔ Like C programs, execution of all C++ programs begins at main() function
    and ends at return() statement. The header file iostream should be included at
    the beginning of all programs that use input/output operations.'
