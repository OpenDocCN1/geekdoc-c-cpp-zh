    \ n = x;        // invokes constructor 2\n\n    cout << \"Enter elements of vector\
    \ m \" << \"\\n\";\n    cin >> m;            // invokes operator>>() function\n\
    ```\n\n```\ncout << \"\\n\";\ncout << \"m = \" << m << \"\\n\";        // invokes\
