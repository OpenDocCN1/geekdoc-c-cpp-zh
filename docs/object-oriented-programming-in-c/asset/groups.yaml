  - "[PAGE 116]\n\n> note\n> The use of data in this manner defeats the very idea\
    \ of data hiding and therefore should be avoided.\n\n# 5.4 Defining Member Functions\n\
    \nMember functions can be defined in two places:\n\n+   - Outside the class definition.\n\
    +   - Inside the class definition.\n\nIt is obvious that, irrespective of the\
    \ place of definition, the function should perform the same task. Therefore, the\
    \ code for the function body would be identical in both the cases. However, there\
    \ is a subtle difference in the way the function header is defined. Both these\
    \ approaches are discussed in detail in this section.\n\n# Outside the Class Definition\n\
    \nMember functions that are declared inside a class have to be defined separately\
    \ outside the class. Their definitions are very much like the normal functions.\
    \ They should have a function header and a function body. Since C++ does not support\
    \ the old version of function definition, the ANSI prototype form must be used\
    \ for defining the function header.\n\nAn important difference between a member\
    \ function and a normal function is that a member function incorporates a membership\
    \ 'identity label' in the header. This 'label' tells the compiler which class\
    \ the function belongs to. The general form of a member function definition is:\n\
    \n```\nreturn-type class-name :: function-name (argument declaration)\n{\n   \
    \ Function body\n}\n```\n\nThe membership label class-name :: tells the compiler\
    \ that the function function-name belongs to the class class-name. That is, the\
    \ scope of the function is restricted to the class-name specified in the header\
    \ line. The symbol :: is called the scope resolution operator.\n\nFor instance,\
    \ consider the member functions getdata() and putdata() as discussed above. They\
    \ may be coded as follows:\n\n```\nvoid item :: getdata(int a, float b)\n{\n \
    \   number = a;\n    cost = b;\n}\n```"
