    \n请参见以下 C++ 标准的解释。\n当从构造函数（包括数据成员的成员初始化列表）或析构函数中直接或间接调用虚函数，且该调用所作用的对象是正在构造或销毁的对象时，所调用的函数是定义在构造函数或析构函数类中或其某个基类中的函数，而不是在构造函数或析构函数的派生类中覆盖的函数，或在最派生对象的某个基类中覆盖的函数。\n\
