    \  Complex com1(3.0, 0.0);\n\n    if (com1 == 3.0) {\n        cout << \"Same\"\
    ;\n    } else {\n        cout << \"Not Same\";\n        return 0;\n    }\n}\n\
    ```\n\n# Output:\n\nSame"
