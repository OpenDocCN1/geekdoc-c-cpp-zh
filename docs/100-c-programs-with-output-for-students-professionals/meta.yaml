    ## 77. Program to find the sum of each row & column of a matrix of size n x m
    and if matrix is square, find the sum of the diagonals also.


    ```cpp

    #include <iostream.h>

    #include <conio.h>


    int main() {

    clrscr();

    int A[10][10],m,n,x,y,sum=0;

    //Create a Matrix A

    cout << "Enter number of rows and columns in Matrix A : \n";

    cin>>n>>m;

    cout << "Enter elements of Matrix A : \n";

    for(x=1;x<n+1;++x)

    for(y=1;y<m+1;++y)

    cin>>A[x][y];

    //Find sum of each row

    for(x=1;x<n+1;++x)

    {

    A[x][m+1]=0;

    for(y=1;y<m+1;++y)

    A[x][m+1]=A[x][m+1]+A[x][y];

    }

    //Find sum of each column

    for(y=1;y<m+1;++y)

    {

    A[n+1][y]=0;

    for(x=1;x<n+1;++x)

    A[n+1][y]+=A[x][y];

    }

    cout << "\nMatrix, Row Sum (Last Column) and Column Sum (Last Row) : \n";

    for(x=1;x<n+1;++x)

    {

    for(y=1;y<m+2;++y)

    cout << A[x][y] << " ";

    cout << "\n";

    }

    //Print sum of each column

    x=n+1;

    for(y=1;y<m+1;++y)

    cout << A[x][y] << " ";

    cout << "\n";

    if(m==n)

    {

    for(x=1;x<m+1;x++)

    for(y=1;y<n+1;y++)

    if(x==y)

    sum+=A[x][y];

    else

    if(y==m-(x+1))

    sum+=A[x][y];

    }

    cout << "Sum of diagonal elements is : " << sum << endl;

    getch();

    return 0;

    }

    ```


    ## 78. Program to convert two-digit octal number into binary number


    ```cpp

    #include <iostream.h>

    #include <conio.h>


    void octobin(int);


    void main()

    {

    clrscr();

    int a;

    cout << "Enter two-digit octal number : ";

    cin>>a;

    octobin(a);

    }


    void octobin(int oct)

    {

    long bnum=0;

    int A[6];

    int a1,a2,quo,rem,x;

    a2=oct/10;

    a1=oct-a2*10;

    // Converting the first digit.

    for(x=0;x<3;x++)

    {

    quo=a1/2;

    rem=a1%2;

    A[x]=rem;

    a1=quo;

    }

    //Storing the remainders of the''s octal digit.

    for(x=3;x<6;x++)

    {

    quo=a2/2;

    rem=a2%2;

    A[x]=rem;

    a2=quo;

    }

    //Obtaining the binary number from the remainders.

    for(x=5;x>=0;x--)

    {

    bnum*=10;

    bnum+=A[x];

    }

    cout << "The binary number for octal number " << oct << " is " << bnum << "."
    << endl;

    }

    ```


    This program takes in a two-digit octal number a as a screen input from the user.

