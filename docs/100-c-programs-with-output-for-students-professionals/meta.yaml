    \  20\nValues :50  100\n\n## 10. Simple Constructor Example Program For Find Prime\
    \ Number In C++\n\nAlgorithm:\n- STEP 1: Start the program.\n- STEP 2: Declare\
    \ the class as Prime.\n- STEP 3: Consider the argument with integer members.\n\
    - STEP 4: For i=2 to a/2 do the following.\n- STEP 5: Check if a%i==0 then set\
    \ k=0 and break.\n- STEP 6: Else set k as 1.\n- STEP 7: Increment the value i\
    \ as 1.\n- STEP 8: Check whether k value is 1 or 0.\n- STEP 9: If it is 1 then\
    \ display the value is prime number.\n- STEP 10: Else display the value is not\
    \ prime.\n- STEP 11: Stop the program.\n\n```cpp\n#include<iostream>\n#include<conio.h>\n\
    \nusing namespace std;\n\n// Class Declaration\nclass prime\n{\n  //Variable Declaration\n\
    \  int a,k,i;\npublic:\n  prime(int x)\n  {\n    a=x;\n    k=1;\n    for(i=2;i<=a/2;i++)\n\
