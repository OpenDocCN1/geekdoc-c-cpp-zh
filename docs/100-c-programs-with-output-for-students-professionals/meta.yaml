    \ x,int y) {\n        // Assign Values In Constructor\n        a=x;\n        b=y;\n\
    \        cout<<\"\\nIm Constructor\";\n    }\n\n    void Display() {\n       \
    \ cout<<\"\\nValues :\"<<a<<\"\\t\"<<b;\n    }\n};\n\nint main() {\n    Example\
    \ Object(10,20);\n\n    //Copy Constructor\n    Example Object2=Object;\n\n  \
    \  // Constructor invoked.\n    Object.Display();\n    Object2.Display();\n\n\
    \    // Wait For Output Screen\n    getch();\n    return 0;\n}\n```\n\n# Output\
    \ :\nIm Constructor\nValues :10 20\nValues :10 20\n"
