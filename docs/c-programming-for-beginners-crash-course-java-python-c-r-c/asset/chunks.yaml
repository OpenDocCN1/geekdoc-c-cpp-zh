    \  \n\n## Writing Dummy Codes  \n首先我们来尝试写一个简单的测试代码（ dummy ），这个不会像我们后面讨论的其他程序那样产生输出结果\
    \ ，但它能帮你掌握如何在 **C**中创建并保存文件以便后续操作使用 。\n\nSo start off entering into whichever\
    \ chosen editor(例如刚才提到的)，点击新建按钮打开空文档然后在编辑框内输入下面一行简单指令即可完成基础编辑工作 ：    \n\n```c\n\
    main() {}\n```\n\n然后通过保存功能将源码存储到指定位置 ——可以选择默认路径或者自定义文件夹便于日后查找浏览；注意命名时要选用好记的名字避免随着项目增多造成混乱\
    \ （此处例子命名为 “dummmy.c”）。接下来点击构建 (Build) 按键你会发现这段代码并不会被成功编译显示出来的是最小规模也就是所谓的“哑元”（Dummy）形态——所有用到的每个流程都必须包含入口函数因为它决定了整个程序的执行起点因此我们需要确保声明该函数即使目前里面没有任何具体实现语句暂时关闭运行窗口时虽然会有警告出现但并不影响整体逻辑存在只是因为没有填充有效业务所以系统无法反馈任何实质数据而已^恭喜你已经完成了首个采用**优先实践方案创造了属于自己的第一份可复现模型框架预备知识积累感谢阅读终于突破零障碍阶段迈出了坚实一步！！^^以上仅仅是最基础的表达形式实际上还能添加丰富多样元素比如接下去安排的结构类型说明包括但不限于类别如下：\n\
    \n*   结构体 \n*    变量与数值  \n *  运算符   \n *  方法定义集合关键字等等……我会逐一详解它们的特性从而助你灵活驾驭此门语言让作品更加出彩质变升级迭代优化体验精彩纷呈\
    \ ]] \n\n### Keywords(关键保留词)\n了解这些特殊标识符非常有助于高效精准完成任务目标因为在ISO标准下总共仅规定了44组不可另作他用之符号且大部分应用频次有限只需勤加练习自然熟稔于心记住后续结合实例阐述各个典型代表含义及其使用方法见真章~\n\
