  trans: "\n幸运的是，大多数编程语言的 IDE 都可以免费下载和在线使用，因此你不会花费太多金钱就能上手。本书中，我将使用 `Code Blocks`\
    \ IDE 来运行 C 语言；但根据你希望用代码做什么，也有其他不同的选项可供选择。\n\n`Code Blocks` IDE 是最好的选择之一，因为它具备了你所需的所有功能。你将无需上网寻找编译器或其他组件来辅助编写代码——因为所有功能都集成在一起了。你可以访问以下网站下载\
    \ Code Block：[`www.codeblocks.org`](http://www.codeblocks.org)\n\n有了合适的 IDE 在手、你就能够快速运用\
    \ C 程式语言并写出一些自己的厉害程序啦！不管你是资深老手还是刚入门的新同学这都没关系我们接下来会逐步引导让你掌握如何创造实用项目与酷炫作品在短时间内大有可为~\n\
    \n#第二章：基础部分之通过 C 开启首个工程写作  \n\n用 **C**写程序非常简单只需遵循语法规则即可搞定（无论是单行指令还是复杂的游戏进程亦或其它应用）。等你逐渐熟悉后就会觉得得心应手里面的门道自然懂\
    \ ……但在开始学习编码之前最好先了解基础知识以便更快地进入状态吧！\n\n## Writing Dummy Codes(假码)  \n首先我们来尝试写一个简单的测试代码（\
    \ dummy ）这个不像后面谈到的功能性模块那样会产生输出结果但它能帮你轻松掌握如何在 **C**环境中搭建文件构架并为后续操作做好准备 。\n\n从挑选任意编辑器着手\
    \ (例如刚才提到的那个)，点击新建按钮创建一个空白页面然后在输入区域键入下面一行命令就算完成初始化编辑工作：\n\n```c\nmain() {}\n```\n\
    \n随后利用保存工具将這段源码归档到指定位置 ——既可以采用系统默认路径也可以自建文件夹并把名字记录清楚避免随着开发任务增多而迷失方向 （这里可以取名 “dummmy.c”以备参考\
    \ ）。接下里执行构建操作(Build 键位)、但是你会发现此时代碼无法正常编译唯一得到的最小规模形态即“哑元”（Dummy）轮廓 ----由于每个合法流程都必须包含入口函数来控制整个程序的启动起点所以我们必须事先声明该元素尽管里面目前没有填写任何具体实现语句如果这时关闭当前窗口可能会有警告弹出但这并不影响整体逻辑的存在环境仅是因为缺乏实质的动作序列导致运算环境未能给出切实反馈罢了\
    \ ^恭喜您已经成功实践出第一份规范框架雏形丰富经验奠定坚实基石下一步即将突破零障碍考验再次升级历程！！^^以上只是最朴素的表现形式实际上还可以添加丰富多彩的扩展资源比如按照惯例整理出常见结构单元类型供大家完善理解包括但不限于如下内容︰\n\
    \n*   结构体 \n*    变量及数据值项  \n *  运算符   \n *  方法定义集合保留关键字等……我会逐一向各位解读它们的特色属性助力你灵活驾驭这门硬技能展露锋芒质变飞跃体验质感优化迭代焕发神采]]\
    \ \n\n### Keywords(关键保留词)\n熟练掌握这类特殊标识符对高效精准推进目标至关重要因为在 ISO 标准体系之下共计设定了 44 个不可挪作他用的专属符号而且大部分实际出现频率不高只有勤加练习才能保持记忆清晰无误进一步可行案例剖析各个典型代表的核心语义及其一般使用方法进阶提升；\n\
    \n Functions·库支持套件:\n内部封装了大量预设服务极具便利性它们能将分散片段拼接到最终产物想象空间极大若想自主设计某个特定行为就得引进相应的头文档落实安排配置细节这是具有深度潜力的发展方向稍后会展示其威力范围和应用延拓\
    \ await=\n\n#### Operators ·数据处理操控载具：\n依据差异化特征可划分成几组日常族群负责处理不同职责巧妙组合带来神奇效应——\n\
    -算术类如加、减乘除四则运算法;\n\n -比较相符性检测用于校验陈述真假情况 Result；\n ~赋值环节~\n使得容器拿到必要的绑定数值；\n\n ##\
    \ Variables & Values:概念辨析作为基本象征物往往承载数字或者字符等多重涵义;(举例而言前者可能覆盖小数分数极端量级区间;后者既可单一字母也可长篇大论起终点取决于意图表达\
    \ )所谓可变计量就是指存放稳定常数但是允许适时调节需求情景适应度∼建立坚实基础必不可少一套章节~!\n\n ### Structure 层级架构概要存现：\n\
    这部分展示了符合排版标准的控制流走向凭借预处理指引激活机制所标注的首要被执行的特殊构件叫做主例程 。正如先前示范除非有它支撑否则无论如何都不能够顺利运作 。\n\
    紧接着就要用到花括号把相关机构包裹起来 ，在其间填入多元短句构成表述集包括了计算 、条件判断约束字命名等内容这样官网解释器(sic.)方能准确理解需要执行的行动列表清单。\n"
