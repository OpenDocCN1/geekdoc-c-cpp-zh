  raw: 'The for loop is really helpful for cleaning up some of the code writing and
    it can help you out when working on what is known as the nested loop. The nested
    loop may sound complicated in the beginning, but it is easier to use than the
    while loop. Let’s take a look at how to work on the nested loop by looking at
    the following code:


    #include <stdio.h>


    #include <stdlib.h>


    #include <time.h>


    Int main()


    {


    Int column, r;


    Srand((unsigned)time(NULL));/*Seed Randomizer*/


    For(column=0; column<10; column++)


    {


    r = rand();


    printf(“%2d\t” ,r % 100);


    }


    Putchar(‘\n’);


    Return(0);


    }


    The code that I put above is one that will output ten randomly selected numbers.
    Take a moment to build and then run this code and then you will see that from
    your output, there is a row of ten values that are randomly selected. The spacing
    that is between the values is going to be attained by making use of the ‘\t’ character
    that we used at line 14\.


    This is just one of the examples of what you are able to do when using the nested
    loops. You can also use it to make a grid of numbers 1 to 100, or more, and to
    add in a variety of different items that you need inside of your graph. It is
    quicker to do than writing out each of the parts on their own and can really make
    for a nice end product when you are done.


    Chapter 5: The Variables in the C Programming Language


    As I mentioned a bit before, a variable is going to be the container for different
    data type sin your code. The variable, or the container, will be able to hold
    a floating point character, an integer, or some other value. In this chapter,
    I am going to explain a bit more about the variables and how you can use them,
    and how they work, inside of your C language code.


    So how do you distinguish between a variable and a value. A value can be almost
    anything inside of the code, such as an integer, a character, or something else
    that can be defined in the code. On the other hand, the variable is going to be
    the container that holds these data types together. Usually they have to have
    something that ties them together, but they don’t need to be identical. For example,
    you could have a variable that contains school supplies such as pencils, pens,
    paper, chalk, notebooks, and so on. These are similar in one way, and they make
    sense to go together, but they are not identical.


    When you declare a variable in the C language, you will learn about the type of
    variable and the name of the variable. Let’s take a look at how you would declare
    an integer variable to start:


    #include <stdio.h>


    Int main()


    {


    Int a;


    Printf(“The value of a is %d\n” ,a);


    Return(0);


    }


    In this option, the integer variable is “int” and the name of it is a. the variable
    in the above code is never assigned a value, but even though it is never given
    a value, you will still be able to use it inside the code, just like it is shown
    in the 7th line. Build and run the program really quick. On your side, you may
    see that a random value comes up. Unlike some of the other languages you will
    come across, the C language is not going to initialize the variables as they are
    declared. Internally, the program is going to allocate a chunk of the memory in
    order to store the information for that variable.


    In this case, the chunk hasn’t been initialized and yet it is not set to zero.
    It just is placed in some location in your memory. Whatever value is already placed
    there, it is going to be absorbed right away by the variable and you will see
    this s the output on your screen. The idea behind this is that you need to initialize
    the variable before you try to use them. A good way to fix this issue is with
    the following code:


    #include <stdio.h>


    Int main()


    {


    Int a;


    a = 65;


    printf(“The value of a is %d\n” ,a);


    return(0);


    }


    Save these changes and then build and run the program. Now the output of your
    code is more predictable because you know the value of the variable. In addition
    to knowing the name and the value of the variable, you can also learn a few other
    things about your variable in this language. One of these is the sizeof operator.


    Sizeof is one of the keywords in the C language, but it is also considered an
    operator. What the sizeof keyword does is return how many bytes of storage are
    used for that variable. This may not seem too important, but when you are working
    with the C language, it can come into play and you will need to know this information
    at times. Here is an example of how you can use the sizeof keyword in your code:


    #include <stdio.h>


    Int main()


    {


    Int a;


    Printf(“An int variable occupies %lu bytes of storage\n”, sizeof(a));


    Return(0);


    }


    In this example, the variable a is not initialized, but since it is not used,
    this is not a big issue. The sizeof operator can be find inside the printf statement
    and it is simply going to evaluable the variable a as an int variable to return
    how much storage on the computer is being occupied. The output that you will get
    is a long and unassigned integer value. You can change up the information that
    you would like to receive, such as looking up how much space a character will
    take up and not just the variable, by changing up some of the code to reflect
    this.


    Another thing that you will be able to find out about your variable is the location
    of the memory. This is going to tell you specifically where the data of the variable
    is located. To fetch the information about the memory location, you will need
    the ampersand operator. Here is a good example of the code that you would use
    to make this happen:


    #include <stdio.h>


    Int main()


    {


    Int a;


    Char b;


    Float c;


    Puts(“memory location:”);


    Printf(“A is at %p\n”, &a);


    Printf(“B is at %p\n”, &b);


    Printf(“C is at %p\n” , &c);


    Return(0);


    }


    There are three different variables that are declared inside this code; the floating
    point value, a character, and an integer. These variables are not initialized
    inside this code because they aren’t being used, but the program will still allocate
    some space for them at different locations inside of the memory. In order access
    these locations, the ampersand is prefixed to the name of the variable. You will
    need to use the %p placeholder inside of the printf statement in order to get
    the results that you want.


    The output values that you will receive will vary based on the machine that you
    are using. Even the formats can change based on the operating system that you
    are using. The computer will be in charge of assigning a location on the memory
    and it sometimes depends on how much memory is available on your system or where
    the system decides to place it. Learning where the information is stored on your
    computer may seem a bit trivial at this point, but it can make it easier to find
    things and work on your code later on.


    Working with variables can help you to store information in your code properly.
    You are able to assign any value to your variables that you would like, you just
    need to be careful that you are initializing it inside of the code that you are
    writing and that it makes sense with all the other data types that are being stored
    inside of the variable.


    Chapter 6: The Basics of Functions When Writing Your Code


    Like many other programming languages, the C language contains a library. As a
    beginner in coding, you will find that this library is your best friend. It allows
    you to go through and fins some functions of the code, the bones of the code,
    that helps you to write out what you want to happen. It can give commands to the
    compiler, helps you to set up the code, and so much more.'
