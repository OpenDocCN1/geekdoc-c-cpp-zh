- fmt: "\n我简要介绍了`if`语句在上述代码中的工作方式。大多数情况下，`if`语句的格式与我们之后要处理的其他语句略有不同。它通常会被拆分成至少两行：第一行包含用圆括号括起来的条件；如果该条件评估为真，则执行下一行的内容。本质上这是一个被分到两行的单一语句，因此分号会位于第二部分的末尾而非第一部分之后。\n\
    \n你当然也可以将整个 `if` 语句写在一行内（如果你愿意），但这不符合常见的编程惯例；通常将代码拆分至多行并用花括号括起来更容易阅读。\n\n你也可以在代码中包含多个\
    \ `if` 语句来实现更复杂的逻辑——根据你所设定的条件和用户输入触发不同的动作。下面是一个很好的示例：\n\n```c\n#include <stdio.h>\n\
    \nint main();\n{\n    int a;\n    \n    printf(\"Type an integer: \");\n    scanf(\"\
    %d\", &a);\n    \n    if(a > 10)\n        {\n            printf(\"%d is greater\
    \ than \\n\" ,a);\n        }\n        \n     if(a < 10)\n         {\n        \
    \     Printf (\"%d is lesser than \\n\" ,a);  \n          }\n\nreturn(0);\n\n\
    }\n```\n\n在这个示例中我们可以看到两个相邻的比较操作：各自都有自己的花括号块并分别检查大于和小于的情况.请试着编译运行这段程序.\n\n当你运行后就会发现它会根据你的输入显示相应结果\
    \ --  对比十大的数或比十小的数字给出提示;但注意这里当我们精确键入数值等于字段变换时没有任何输出,你可以修改第16行为 \"less than or\
    \ equal to ten \",从而让等情形也能得到回应 。\n\n## Else Statements (否则判断)\n\n虽然可以用几个基础判组成某些比对功能但我们还可以借助\
    \ else帮助完成二者择一之类决策需求看看下述例子理解用法:\n\n\n\n```\n# include < stdio . h >\n\nInt main()\n\
    { \n\n       Int a ;  \n\n      print f (“type an interger ：”) ;\n\nscanf(“ %\
    \ d”,&am p;a );\nprintF(“You typed % d 。\\ n” ),A );\n\nIf （ A>022 ）\nP r in t\
    \ F (! “ That ’ s too large ”…) ;\nels e      \nPrin tf(( “ it^t within range\
    \ ?”). )；\n\nretu -rn zero)   \n\n}   \n```\n\n上面基本上是从前面实例改写而成不过添加了else分支部分第十行列出了评价标准若满足判断便强\
    \ i executes进入设定流程相反不成立则会转去配套部分试行尝试 build ，run尝鲜观效\n\n值得注意的是本段并未采用常见半角符而是用了大箭头替代之尽管只有单独指令可省略束定符号但保持组汇归乃优质习惯\
    \ 。\n\n### El se If statements (多重选择 )\n\n遇到超过二及以上同时测试三种以上可能因素玩家就可考虑另起炉灶使用另外结构又称Else-\
    \ ladder组合快速扫阅Code item演示运作原理\n\n\n```\n   #include<studio.h >\n \nmain(){\nchar\
    \ option = getChar ();\n swich case ‘y’: ... default break …  \n}; end block\n\
    \  \n ``` \n \n主要成分均安放至于Switch /Case框架之内开始于Column排版序列依次枚举各类情景每个各房间携专属任务以及结尾反闸收场这几构共同合成整体控制流骨干元素\
    \ .\n\n也许你已经察觉关键词break出现其中于是总共有四个核心成员即case、default 、switch and brake把它们贴进编辑环境中跑几遍选取各种选配项目查验是否正确定义无误且看最终出图景象\n\
    \n\n\n具体如何施行呢？ switch针对单值开展判别而不像过去进行全量对比它可以容纳数学公式只要最后落回到一个独立原素即可由规定变量所做的值与每条Case后方标样逐项匹配当算法发现一致就会激发对应分区的内容不属于命中区域全部忽略不计举例而言假使应答者在第十二列填写1那么13列的puts例程火速启动其余章节不再问津反之要是入手2制式首条子区间跳过继而寻求第二个目标直至相逢触点为止如果在任何相符节点失联默认缺省处理器搭载并在范例条件下例如填四它将直抵预设置区照步就班履行其职司。\n"
  raw: 'I talked a bit about how the if statement will work inside the code above.
    For the most part, the if statement is going to be formatted a bit different than
    some of the other statements we will work on. It is going to be split out amongst
    at least two lines. The first line will have the if condition set apart in parenthesis.
    If it evaluates the condition and it is found to be true, then the following line
    will be executed. It is basically just one statement that has been divided between
    two lines, so the semicolon will be with the second part of the statement instead
    of after the first part.


    Now, you could write out the if statement into just one line if you would like,
    but this is not common programming etiquette and usually it make the code easier
    to read when they are separated out into two or more lines and enclosed in brackets.


    You can also choose to have more than one if statement in the code if you would.
    This allows you to have a few things happen inside the code based on the conditions
    that you set out and what input the user gives to you. Here is a good example
    that you can try out inside your program as well:


    #include <stdio.h>


    int main();


    {


    int a;


    printf(“Type an integer: “);


    scanf(“%d”, &a);


    printf*:You typed %d. \n” ,a);


    if(a > 10)


    {


    printf(“%d is greater than \n” ,a);


    }


    If(a < 10)


    {


    Printf(“%d is lesser than \n” ,a);


    }


    return(0);


    }


    With this code, we can see that there are two if comparisons right next to each
    other. Both of them are going to have their own set of brackets around them and
    two different conditions are going to be evaluated; one that is looking at greater
    than and one that is looking at less than. Take a moment to build this code and
    run it.


    After you run the code, you will see that the necessary output is going to be
    displayed for values that are either greater than or lesser than 10 based on the
    input that you put in. Notice with this option that there isn’t going to be an
    output that shows up when you type in the number 10, only when you have numbers
    that are bigger than or less than 10\. You can change this up in line 16 so that
    it says “less than or equal to 10” in order to change this issue and get an output
    when you use the number 10\.


    Else Statements


    While the if statements can help to add some comparisons to the C language, you
    can also use the else statement to help you out. These are great for the either
    or decisions that you want to create. Take a look at the code below to see how
    the else statements can work inside your code:


    #include <stdio.h>


    int main()


    {


    int a;


    printf(“Type an integer: “);


    scanf(“%d”, &a);


    print(“You typed %d. \n” ,a);


    if(a > 10)


    {


    printf(“%d is greater than \n” ,a);


    }


    else


    {


    Printf(“%d is less than or equal to 10\. \n” ,a);


    }


    return(0);


    }


    The code above is basically a rewrite of the codes we used before, but we added
    in the else statement. In line ten, we used the if condition in order to make
    the evaluation. This statement is going to be executed if that condition is evaluated
    as true. If the condition is evaluated and seen as false, the statement that is
    with the else part of the code will be executed. Take a moment to build and run
    this code and try out a few inputs to see how it works.


    Note in this code that I didn’t use a semi-colon, but instead of a curly bracket.
    You could write it all out without using the brackets since there is only one
    statement, but this is a great way to write it out to make sure that it all stays
    together and it is good programming practice.


    Else If Statements


    There are times when you will have at least three, if not more, conditions that
    you want to use inside of your code. In these instances, you would need something
    a bit different than the if and the else statements. This is when we will use
    at the structure for the else if statements. Let’s take a look at the following
    code to see how the else if statements would work.


    #include <stdio.h>


    int main()


    {


    Int a;


    Printf(“Type an integer: “);


    Scanf(“%d”, &a);


    Printf(“You typed %d. \n” ,a);


    If(a > 10)


    {


    Printf(“%d is greater than \n” ,a);


    }


    Else if(a < 10)


    {


    Printf)”%d is less than or equal to 10\. \n” ,a);


    }


    Else


    {


    Printf(“%d is 10, \n” ,a);


    }


    Return(0);


    }


    With this structure, you can start with the if statement that is at line ten.
    If this condition is true, the statement that is associated with it will be executed.
    If the statement is evaluated as false, it is going to move on to the else if
    statement that is examined at line 14\. If this condition ends up being evaluated
    as true, the statement will be executed and all the rest will be skipped over.
    At the very end of this is the else statement. If neither of the two conditions
    above it are met, this is the one that will be executed.


    The nice thing about this is that you can add in as many of these else if statements
    as you would like. This makes it easier for the system to evaluate a complex situation
    based on the conditions that you set and the input that your user places into
    the system.


    Switch Statements


    Inside of the C language, you are able to use the if and else conditions to deal
    with complex decisions. You can add in as many of these as you would like to the
    system t deal with this, but the more conditions that come into play in your code,
    the uglier the code can become and the harder it is to write it all out. Instead
    of dealing with this, you can use the switch case structure, which will also help
    you to make some more decisions in the C language without all the mess. Let’s
    look at the following code to see how the switch statements look inside a code
    and then how it can handle a variety of decisions at the same time:


    #include <stdio.h>


    Int main()


    {


    Char a;


    Printf(“Your choice (1,2,3): “)’


    Scanf(“%c”, &a);


    Switch(a)


    {


    Case ‘1’:


    Puts(“Excellent choice!”);


    Break;


    Case ‘2’:


    Puts(“This is the most common choice:”);


    Break


    Case ‘3’:


    Puts(“I question your judgment.”);


    Break:


    Default:


    Puts(“That’s not a valid choice.”);


    Return(0);


    }


    The majority of this code is put in the switch/case structure. It is going to
    start out on line 10 as a switch statement and then it has a series of the case
    statements, each of which will have their own statements (which you will be able
    to change up in any way that you would like based on the code that you are writing).
    The switch case also has its own statements and then a closing curly bracket.
    All of these are important elements that come with the switch/case structure.


    You may have noticed that it has the break keyword inside of it. So there are
    four keywords that are found inside this structure including break, default, case,
    and switch. Place this inside of your compiler and then run it a few times, picking
    out the different options to see what the output is and if you placed all of the
    stuff inside the code correctly.


    So how does all of this work? The switch statement is going to handle a single
    value rather than a whole comparison. It can hold onto a mathematical equation,
    but the result needs to end up being just a single value. The value, which is
    specified by the switch, is then going to be compared to the values of each of
    the case statements. If it finds that the comparison is true, the statements that
    belong to that case statement will be flagged and executed. The ones that are
    not seen as true will be skipped.


    For example, if the user puts in the number 1 for line 12, then the puts statement
    that is in line 13 will be the one that is executed and the rest are skipped.
    But if they pick the number 2, you will see that the first case is skipped and
    it will move over to execute the second case and so on until it finds the one
    that is true.


    If there is a reason that the user puts in a value that doesn’t match any of the
    case conditions, your code will go to the default condition. In this example,
    if the user puts in the number 4, it would skip to the default and execute the
    code that comes with it.'
