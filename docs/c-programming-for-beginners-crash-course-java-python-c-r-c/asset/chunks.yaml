    your code.


    The Code Blocks IDE is one of the best because it will have all of the features
    you are going to need. You won’t have to go online and find a compiler or other
    parts to help get the code written because it is all connected as one. You will
    be able to download Cod Blocks by visiting the following website [http://www.codeblocks.org](http://www.codeblocks.org)


    With the right IDE in place, you will be able to use the C programming language
    and get some of your code written in no time. It doesn’t matter if you are used
    to working in programming or you are just beginning, I will walk you through some
    of the steps that you should take in order to create great codes and great projects
    that you can do with the C language.


    Chapter 2: The Basics to Writing Your First Project with the C Language


    Working with the C language is pretty simple. You can write a code that just has
    one line or you can go on and write a nice long one that is going to be more complex
    and could run a game or some other process. While you can get more complex later
    on, I am going to look at some of the basics of writing inside of the C language
    to help you to get comfortable.


    Writing a Dummy Code


    First, let’s take a look at writing out your dummy code. This isn’t going to bring
    you an output like some of the other codes that we will discuss later on, but
    it will help you to get the hang of creating and saving a code in the C language
    so you are ready for the things we do later on.


    So to start, you need to go into the Code Blocks IDE, or whichever IDE that you
    chose, and click on the New Button. You will want to open up an Empty File. Now
    you will need to type in a code into the editor so that you are able to create
    a code to save. I am going to keep this simple and just type in one line like
    the following:


    main() {}


    Now you will need to save the source file and you can do this by clicking on the
    Save button. You can either let this save on the default of your computer or you
    can choose the folder that you would like all of these code files to be saved
    on your computer; the choice is up to you, just remember where you are saving
    all of these so if you need to find them later.


    Make sure to name the file something that you will be able to remember later on,
    or you will get confused as you start to add on more of these files over time.
    I am going to call this file “dummy.c”. once you have saved this, the source code
    file is created and it has been saved on your computer. Now you will click on
    the Build button.


    You will notice that the code is not going to compile. What you are going to see
    is the minimum of the C program, which is also called the dummy. All of your codes
    in C need to have the main function because this is where the execution of the
    program is going to start; you will just need to put the main function inside
    of the curly brackets.


    Since this is a dummy source code and one where we are just experimenting a little
    bit, I didn’t have us put any code into the curly brackets. When you try to run
    this option, you will not get an output because nothing was placed inside. We
    will be able to add in different things later on and create an output based on
    what is inside the code. You may see a compiler warning when entering the dummy
    code, but this is not critical. You will just click on your Run button and then
    find that it is not able to give you any output.


    Congratulations! You have just written your very first code using the C programming
    language. If you didn’t get any output, you did the code right. This is just the
    basic form of writing a code in the C language and there is so much more that
    you are able to add into the code. Some of the other basic parts that you can
    add into your code includes:


    Structure


    Variables and values


    Operators


    Functions


    Keywords


    I am going to take you through how some of these work so you can learn how to
    make the code shine the way that you would like.


    Keywords


    The keywords are important to learn about in the C language because they help
    you to accomplish the basic tasks that you want when writing out a code. There
    are 44 words that are reserved as keywords in the C language and you should only
    use them as such inside your code. For the most part, you may find that most of
    them are only used on occasion so you will become familiar with the rest pretty
    quickly. I will show you some of these keywords as we progress through writing
    some of the codes later on in this book.


    Functions:


    Functions are really important in this language and many of them are held inside
    the library that are found in the C language. The function is going to knit together
    the code so that it is able to make the program that you want. When you want to
    make or use a function inside of your own program, you will need to incorporate
    in a header file, which is going to define the function. There is so much that
    you are able to do with your functions and I will give some examples of how powerful
    this can be later on.


    Operators


    Operators are gong to be used inside of your code in order to manipulate the data
    that is inside the program. There are several types of operators and each of them
    are going to work in a different manner depending on how you use them. Some of
    the most common operators used inside of the C language include:


    *   Mathematical: these would include any of the signs that you would need in
    order to add, subtract, divide, or multiply information together in the code.


    *   Comparison: these operators allow you to compare different values or pieces
    of information to each other inside of the code to determine if the statement
    is true or false.


    *   Assignment: the assignment operators make it easier to assign a value to your
    variable inside the code.


    Variables and Values


    The variables and values are going to be similar to each other, but there are
    a few differences. The values are going to contain numeric values and characters
    and you can make them contain anything that you would like. For example, the numeric
    values can be fractions and decimal points or really small or really big numbers.
    Or with the characters, you could have one letter or a whole sentence or more
    depending on what you would like the code to do.


    With variables, you are working with the containers for a value. You can change
    up the contents as much as you would like and they can vary. The variables are
    basically going to hold the same values that you are going to place directly into
    your program later on.


    The Structure


    I am also going to talk about the structure that goes with the C language. This
    structure is going to help you to write out the codes the proper way and can control
    the way that the program flows. To do this, the C language is going to use the
    preprocessor directives. The first function that will be ran inside of the C language
    is the main function, like what we used in our first example above. This main
    function is a big requirement for all of the programs that you want to use because
    without it, your program will not compile or run at all.


    Next, you will need the curly braces or the brackets to help enclose the contents
    of your functions. Inside the brackets, you will be able to include statements,
    which are basically sentences that will contain math, comparisons, keywords, functions,
    and more to help the compiler to understand what you want executed inside of the
    code.'
