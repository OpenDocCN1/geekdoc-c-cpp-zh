  trans: "\n在代码中，你可能偶尔会用到注释。注释本质上是可以写给其他程序员（有时也是写给自己）看的小注脚，供日后回顾代码时参考。注释可以告诉他人代码中特定位置应该实现什么功能；只要放置得当，编译器只会读取并跳过这些内容，不会执行。\n\
    \n合理使用注释能确保所有人都清楚程序的工作原理，或解释你希望在某个位置达到的效果——因为编译器不读取它们，所以你可以在脚本中随意写出大量笔记而完全不影响程序运行。\n\
    \n## 编写另一段代码\n\n既然我已经花了一些时间解释了编写代码的几个基本部分,让我们通过引入之前的`dummy.c`来看看实际如何操作吧.只需打开它原来保存的位置,然后在主函数里定义一个整数(这意味着返回给操作系统的值);我们需要进行一些编辑来完成这个任务.\n\
    \n在编辑器中的\"main\"前面添加关键字“int”,以确保获得预期的输出;同时在这两个关键词之间加一个空格有助于让编译器的正确解读.开始键入以下内容:\n\
    \n```c\nint main()\n{\n}\n```\n\n你会注意到与最初第一个例子不同之处在于采用了大括号的方式——这是资深程序员更青睐的写法.现在是时候用语句显示实际的输出了:先保持简单,加入数字三即可键输入\
    \ `return`,后面跟上该数字 :\n\n``` c  \n int m ain() \n {   \n    r eturn(3);\n }\n```\n\
    务必记住每行末尾加上分号后保存文件接着点击 Build 按钮 —只要你严格按上面一样准确无误地打出来就不应遇到任何错误信息然后去 Click Run Button\
    \ 启动;如果你正在用的是 Linux/Mac 系统可能看到构建日志上写着 terminated status zero ;PC 终端窗口则会显示出返回值是\
    \ `3`.\n\n任何时候想要产生某种形式的 output 就需要**output function**.只靠关键词 (像 ``int``/``return``)单独是不会自行产出东西因为它们只是属于语法词汇范畴罢了所以请改换\
