- fmt: "\n# C语言函数详解\n\nC语言库中包含了许多可供使用的函数，它们能帮助你完成相当多的任务。尽管如此，它们并不能处理所有事情，有时你需要用这种语言创建自己的函数。事实上，许多有经验的C程序员都编写过大量自定义函数来确保代码正常工作。\n\
    \n本章将详细讨论函数的各个方面：如何设置一个函数、如何进行原型声明、如何调用或访问任意你想要的函数，甚至在需要时如何提前退出你的程序。在C语言中，每个`function`都有类型（type）、名称（name）和圆括号内的参数列表（arguments）。这个名称必须是唯一的且用于标识你所用的那个`function\
    \ ` 。这些参数是零个、一个或多个传递给该 (` function`) 的值 ，它被称为输入(input)。\n\n以下是一个名为alpha的函数——不过它是没有入参也没有返回值的；这在\
    \ C 中是合法有效的写法,此类叫作空类型(`void `) : \n```c\nvoid alpha(void)\n```\n这里的 void (空白)作为变量种类\
    \ ,基本上就是告诉编译器说你不用管具体是什么变量类别了！至于 count （计数），这是个整型操作单元;它会生成并返还出一个整数结果 ；与刚才不同之处在于:此物需更多数据但是却不曾携带任何形参!所以样子也就成了:\n\
    \n    int count(void)\n\n还有一个能用的是 hangup(挂断)，其完全不回送数值故亦为典型 ‘ ’  的实用案例 .但差异就在于此项允许接受单个字符最为导入量\
    \ ;而且你自己可以选那字母当实元呢 !在这门技术环境下它会被分别对应到“ch”这个变数上去哦～然而不论你是何种型式都要先介绍给编绎器认识一下好让它可以检查立论条件是否被恰当使用才对\
    \ !\n\n当你想要唤醒调取某个子过程时就只要喊名字兼加一对儿小括弧呀 ~一旦这么做了就会由当前控制权转交给那段语句序列啦～～等全部执行完后便继续紧随其后那句文辞接着走呵\
    \ ——下面我们就快速浏览怎样把这些法子嵌入源码里尽情展现一番吧！\n\n下列示例包含两个utils以期互助解决问题 :\n\n```cpp\n#include\
    \ <stdio.h>\n\nVoid blorf(void);\n\nInt main()\n{\n    Puts(“the main () function\
    \ always runs first”);\n    Blorf();\n    \nPuts(“thanks ,bl orf() ”); //注意这里缺少尾部分号？\n\
    Return(0);\n}\n```\n\n主方法还是对所有编码最关键的一员 !!此外还注意到宝宝们看到了名叫 b l o r f的新模块出现了嘛?第3行我们给它造了个prototype同时告知编译装置有关该方法所用之形式及所属\
    \ type信息噢~这样子即便还没正式实现也能凭借查看 prop不停地校验你是否采用了正确版本 ☆彡又因为那条prop属于句类收工前当然跟别人似的也得封上分号结束符号！！\n\
    \n后来跑到第八纵列真的开始召唤勒 ——由于本 subroutine不存在 arguments因此 inner保留原样什么都不填 ~~这样的routine不会苏醒直到越过第十四条线\
    \ ……确切说└─这就是重复了一遍原来的预设除了不带末尾命名规则而已！！而那些附在此专门例程的小段逻辑全都会蜷绕在大花挎中间喔 —现在停下来几秒赶紧构造并且运行看看吧～\n\
    \n如今设想还要重抬同一obj该怎么破?!简单快捷大幅度拷贝LINE8复制黏贴至LINE9再让它自个演绎一遍就得了 ?改动后长酱紫：\n\n```cpp\n\
    ＃include〈〉……同上略……\n Void B lor f(Vo id );   \nI nt mai n(){\nputs (“...”),\nBlor​f\
    \ ();\nbLOrF();/* twice */\t\n     …\n}}\n存储重新跑起来就会发现他弹出两次内容啦啦~~\n\n无论出现何处pre\
    \ declaration都类似定义为 method宣言那样事前预告译码机将来咋可能露面…有些场景其实不需要显式写出的情况只有你在真正运用代役之前就已经写出整体方案时候才成立啊———比方展示这类运作方式包括下述样本:\n\
    \ # inclue< … >...\nVOID SOU p(vOiD){pUts (\"... \")}  \nint MAiN(){printf(...)...}\n\
    \n此处soup FUNCTION排在之首出道完全没顾虑!!这么做无伤大雅反正编译器还是会遇见他们只是老是首先启动程序中真的是缺位功能的严正声明显然不见了≠咱们赶快紧接着也动手试一试这段好不好~\n\
    \n然后再举另一栗子叫做怎么配合关键词return逃逸自个别process早退避随便进行过半就能撤出好似某种循环或是连续不断在edited Content里面愈演欲罢不能等你刹停查找位于26号线\
    \ left return看看掌镜效果：\n # incldu ...\n..\n末端部分的cheers news属虚的类型不返带回什么在主账户下的必须指定数值—在上面例子中的17就有体现因为她main何等integer属性保存变动这回合然后构造接力！！！\
    \ \n\n这次输出确实略显杂乱正好 skip putchar app记录但实际上从不会被系统实施既然 existed前面最近的那一层..一般见到基于 condition先行告辞的多见于\
