  \n\n\n我简要介绍了`if`语句在上述代码中的工作方式。大多数情况下，`if`语句的格式与我们之后要处理的其他语句略有不同。它通常会被拆分成至少两行：第一行包含用圆括号括起来的条件；如果该条件评估为真，则执行下一行的内容。本质上这是一个被分到两行的单一语句，因此分号会位于第二部分的末尾而非第一部分之后。\n\
  \n你当然也可以将整个 `if` 语句写在一行内（如果你愿意），但这不符合常见的编程惯例；通常将代码拆分至多行并用花括号括起来更容易阅读。\n\n你也可以在代码中包含多个\
  \ `if` 语句来实现更复杂的逻辑——根据你所设定的条件和用户输入触发不同的动作。下面是一个很好的示例：\n\n```c\n#include <stdio.h>\n\
  \nint main();\n{\n    int a;\n    \n    printf(\"Type an integer: \");\n    scanf(\"\
  %d\", &a);\n    \n    if(a > 10)\n        {\n            printf(\"%d is greater\
  \ than \\n\" ,a);\n        }\n        \n     if(a < 10)\n         {\n          \
  \   Printf (\"%d is lesser than \\n\" ,a);  \n          }\n\nreturn(0);\n\n}\n```\n\
  \n在这个示例中我们可以看到两个相邻的比较操作：各自都有自己的花括号块并分别检查大于和小于的情况.请试着编译运行这段程序.\n\n当你运行后就会发现它会根据你的输入显示相应结果\
