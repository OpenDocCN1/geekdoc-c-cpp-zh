  md: "# Arrays\n\n141\n\n| | Column 0 | Column 1 | Column 2 | Column 3 |\n|---|---|---|---|---|n|\
    \ Row 0 | a[0] [0] | a[0] [1] | a[0] [2] | a[0] [3] |\n| Row 1 | a[1] [0] | a[1]\
    \ [1] | a[1] [2] | a[1] [3] |\n| Row 2 | a[2] [0] | a[2] [1] | a[2] [2] | a[2]\
    \ [3] |\n\n![](img/ffccba03b2ad97b0bbffe904cf6d20db_160_0.png)\n\n**FIGURE 7.1**\n\
    Layout of a two-dimensional array with 3 rows and 4 columns.\n\nThe elements are\
    \ stored in row order with the elements of row 0 first, followed by the elements\
    \ of row 1, and so on. To access an element, we must specify its row index and\
    \ its column index. For example,\n\n```\nint i = 2, j = 2, arr[3][4];\narr[0][0]\
    \ = 100; /* The value of the first element becomes 100. */\narr[1][1] = 200; /*\
    \ The value of the sixth element becomes 200. */\narr[2][3] = arr[0][0]; /* The\
    \ value of the last element becomes equal\nwith the value of the first element.\
    \ */\narr[i-2][j-2] = 300; /* The value of the first element becomes 300. */\n\
    ```\n\n> Like one-dimensional arrays be careful exceeding the bounds of any dimension.\n\
    \nSince the elements of a two-dimensional array are stored sequentially in memory,\
    \ we can find the position of an element. In the general case of an array with\
    \ ROWS rows and COLS columns, the position of the a[i][j] element is calculated\
    \ as follows:\n\n```\nposition = (i * COLS) + j+1\n```\n\nFor example, the position\
    \ of the element a[2][1] of an array with 3 rows and 4 columns is the tenth:\n\
    \n```\nposition = (i * COLS) + j+1 = (2 * 4) + 1 = 10.\n```\n\nTo find an element's\
    \ position, only the number of columns is needed.\n\n# Two-Dimensional Array Initialization\n\
    \nLike one-dimensional arrays, a two-dimensional array can be initialized when\
    \ declared. A common initialization method is to use the operator and put the\
    \ values of each element inside braces {}. For example,\n\n```\nint arr[3][3]\
    \ = {{10, 20, 30},\n               {40, 50, 60},\n               {70, 80, 90}};\n\
    ```\n\nThe value of arr[0][0] becomes 10, arr[0][1] becomes 20, arr[0][2] becomes\
    \ 30, and so on."
