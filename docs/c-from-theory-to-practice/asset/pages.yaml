  md: "# Preprocessor Directives and Macros\n\n```\n#include <stdio.h>\n#define MIN(a,\
    \ b) ((a) < (b) ? (a) : (b))\nint main() {\n    int i, j, min;\n\n    printf(\"\
    Enter numbers: %%d%%d\");\n    scanf(\"%d%%d\", &i, &j);\n    min = MIN(i, j);\n\
    \    printf(\"Min = %%d\\n\", min);\n    return 0;\n}\n```\n\nthe MIN macro takes\
    \ two parameters. Once it met, the preprocessor replaces a with i, b with j, and\
    \ expands this line to\nmin = ((i) < (j) ? (i) : (j));\n\nA macro may be more\
    \ generic than a function since it can take parameters of any data type. The MIN\
    \ macro may also be used to find the minimum of int, char, double, and other data\
    \ types.\n\n> Because of operators' precedence, always enclose each macro parameter\
    \ in parentheses.\nFor example, what happens if we omit the parentheses:\n#define\
    \ MUL(a, b) (a*b) /* Instead of ((a)*(b)). */\n\nA statement like this\nj = MUL(9+1,\
    \ 8+2);\nis is expanded to\nj = 9+1*8+2;\nand j becomes 19 and not 100 because\
    \ the multiplication is performed before the addition.\n\n> Do not leave a whitespace\
    \ after the name of a parameterized macro because the preprocessor would handle\
    \ the left parenthesis as the beginning of a simple macro definition.\n\nFor example,\
    \ if we write\n#define MIN(a, b) ((a) < (b) ? (a) : (b))\nt compilation would\
    \ fail because the preprocessor starts the replacement of MIN from the left parenthesis.\n\
    \nUsing a parameterized macro instead of a function that does the same may execute\
    \ faster because a function calls some run-time overhead due to the storage of\
    \ context information (e.g., the memory address of the function) and copy of the\
    \ arguments. On the other hand, a macro invocation doesn't impose any delay because\
    \ the preprocessor expands it before the execution of the program."
