    # # Open a File


    To open a file, we use the fopen() function. It is declared in stdio.h, like this:


    ```

    FILE *fopen(const char *filename, const char *mode);

    ```


    The first argument points to the name of the file to be opened. The "name" may
    include path information. The second argument specifies the operation to perform
    on the file, according to Table 15.1.

    To open a text file, we''d choose one of these modes. To open a binary file, add
    the letter b. For example, the "rb" opens a binary file for reading, while the
    "w+b" opens a binary file for reading and writing.

    If the file is opened successfully, fopen() returns a pointer to a structure of
    type FILE. This pointer can be used to perform file operations. The FILE structure
    is defined in stdio.h and holds information concerning the opened file. If the
    file cannot be opened, fopen() returns NULL. For example, fopen fails when the
    mode is set to "r" and the specified file doesn''t exist.


    > Always return the value of fopen() against NULL to see if the file was opened
    successfully or not.


    If the program runs in the same directory where you are looking for the file,
    just put the file in name quotes. Here''s some examples of typical fopen():


    +   - fopen("test.txt", "r"); opens the test.txt text file for reading.

    - fopen("test.dat", "a+b"); opens the test.dat binary file for reading and appending.
    opens the test.dat binary file for reading and appending. If it doesn''t exist,
    it will be created.


    > If the operating system uses \ to specify the path, write \ because C treats
    \ as the beginning of an escape sequence.


    For example, if your program runs in Windows and you intend to open the test.txt
    file in d:\dir1\dir2, you should write


    ```

    fopen("d:\dir1\dir2\test.txt", "r");

    ```'
