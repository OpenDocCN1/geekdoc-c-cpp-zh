  md: "# 6\n\n# Loops\n\nOften, programs contain blocks of code to be executed more\
    \ than once. A statement whose job is to repeatedly execute the same block of\
    \ code as long as the value of a controlling expression is true called an iteration\
    \ loop. In this chapter, you'll learn about C's iteration statements: for, while,\
    \ and do-while, which allow us to set up loops, as well as break, continue, and\
    \ goto statements, which can be used to transfer control from one point of a program\
    \ to another.\n\n# for Statement\n\nfor statement is one of C's three loop statements.\
    \ It is typically used when the number of iterations is predetermined. The general\
    \ form of the for statement is:\n\n```\nfor(init_exp, cond_exp, update_exp)\n\
    ```\n\n```\n{\n  /* a block of statements (the loop body) that is repeatedly executed\
    \ as\nlong as cond_exp evaluates to true. */\n}\n```\n\nThe expressions init_exp,\
    \ cond_exp, and update_exp can be any valid C expressions.\nIn practice, a for\
    \ statement works like this:\n\n+   1. the init_exp is executed only once, just\
    \ before the first iteration. Typically, init_exp initializes a variable used\
    \ in the other for expressions.\n2. the cond_exp is evaluated. If its value is\
    \ false, the for loop terminates. If it is true, the block of statements, called\
    \ the loop body, is executed.\n3. the update_exp is executed to initiate the next\
    \ loop iteration. Typically, update_exp changes the value of a variable used in\
    \ cond_exp.\n4. Steps 2 and 3 are repeated until the value of cond_exp becomes\
    \ false.\n\nFor example, here is how we could use for to print the numbers from\
    \ 0 to 4.\n\n```\n#include <stdio.h>\nint main ()\n{\n  int a;\n\n  for(a = 0;\
    \ a < 5; a++)\n{\n```"
