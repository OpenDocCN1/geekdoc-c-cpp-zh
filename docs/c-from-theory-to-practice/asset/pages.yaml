    \  return 0;\n}\n```\n\n# ## Bit Fields\n\nA structure may contain fields whose\
    \ length is specified as a number of bits. A bit field is\ndeared like this:\n\
    \n```\ndata_type field_name : bits_number;\n```\n\nThe fields can be used just\
    \ like any other structure field. Most compilers support\nintchar, short, long\
    \ data types for a bit field.\nHere is an example of a structure with several\
    \ bit fields:\n\n```\nstruct person\n{\n  unsigned char sex : 1;\n  unsigned char\
    \ married : 1;\n  unsigned char children : 4;\n  char name[50];\n}\n```\n\nSince\
    \ the size of the sex and married fields is one bit, their values can be either\
    \ 0 or 1.\nSince the size of the children fields is four bits, it can take values\
    \ between 0 and 15.\nSince the size of the bit fields is unsigned char, the compiler\
    \ allocates one byte.\nActually, 1+1+4 = 6 bits will be used to store their values,\
    \ while the other two won't be\nused. If we weren't using bit fields, the compiler\
    \ would allocate three bytes. Therefore, we\nsave two bytes of memory."
