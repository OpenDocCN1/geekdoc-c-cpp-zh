  md: "# while Statement\n\nThe while statement is the simplest way to create iteration\
    \ loops in C. It is mostly used when the number of the iterations is unknown.\
    \ Its form is\n\n```\nwhile (condition)\n{\n    /* block of statements (loop body)\
    \ that is repeatedly executed as long\n    as the condition remains true. */\n\
    }\n```\n\nWhen a while statement is executed, the value of the condition is evaluated\
    \ first. If its value is false, the while loop is not executed. If it is true,\
    \ the block of statements is executed and the value of condition is tested again.\
    \ If this value false, the while loop terminates. If the block of statements is\
    \ executed again. This process repeats until the value of the condition becomes\
    \ false.\nAs with the for if the loop body consists of a single statement, the\
    \ braces can be omitted.\nThe following program uses a while statement to print\
    \ the integers from 1 to 10.\n\n```\n#include <stdio.h>\nint main()\n{\n    int\
    \ i = 1;\n    while (i <= 10)\n    {\n        printf(\"%d\\n\", i);\n        i++;\n\
    \    }\n    return 0;\n}\n```\n\nThe following program uses a while statement\
    \ to print the integers from 10 down to 1.\n\n```\n#include <stdio.h>\nint main()\n\
    {\n    int i = 10;\n    while (i != 0)\n    {\n        printf(\"%d\\n\", i);\n\
    \        i--;\n    }\n    return 0;\n}\n```\n\n> while(i != 0) is equivalent to\
    \ while(i) and\nwhile(!i) is equivalent to while(i == 0)"
