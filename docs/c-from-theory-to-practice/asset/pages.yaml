    \ the following examples:\n\n```\nint (*ptr), int size); /* ptr is declared as\
    \ a pointer to\nfunction, which takes as parameters an array of integers and an\
    \ integer\nreturns an integer. */\nvoid (*ptr) (double *arr[]); /* ptr is declared\
    \ as a pointer to a\nfunction, which takes as parameters an array of pointers\
    \ to doubles\nreturns nothing. */\nint test(void (*ptr a)); /* The function returns\
    \ an integer\nvalue and takes as a pointer to another function, which returns\n\
    integer parameter and returns nothing. */\n```\n\nThe name of the function pointer\
    \ must be enclosed in parentheses else the function's\ncall operator () a higher\
    \ precedence than the * operator. For example, the statement\nint *ptr(int a);\
    \ instead of int (*ptr)(int a);\n\ndeclares a function named ptr, which takes\
    \ an integer parameter and returns a pointer\nto an integer.\nMake a pointer to\
