  md: "# Relational Operators\n\nThe relational operators, >=, <=, !=, == are used\
    \ to compare two operands and determine their relationship. As well see in next\
    \ chapters, the relational operators are mostly used in if statements and iteration\
    \ loops. For example, in the following statements,\n\n+   - if(a > 10) the operator\
    \ is used to check whether the value of a is greater than 10\n- if(a >= 10) the\
    \ operator is used to check whether the value of a is greater than or to 10\n\
    - if(a < 10) the operator is used to check whether the value of a is less than\
    \ 10\n- if(a <= 10) the operator is used to check whether the value of a is less\
    \ than or to 10\n- if(a != 10) the != operator is used to check whether the value\
    \ of a is not equal to 10\n- if(a == 10) the operator is used to check whether\
    \ the value of a is equal to 10\n\nThe outcome of an expression using relational\
    \ operators is either 1 or 0. An expression is true when it has any nonzero value;\
    \ otherwise it is considered false. For example, the outcome of the expression\
    \ (a > 10) is only true if the value of a is greater than 10, otherwise it is\
    \ 0.\n\n> Do not confuse the == operator with the = operator. The == operator\
    \ is used to check whether two expressions have the same value, while the operator\
    \ is used to assign a value to a variable. For instance, the statement if(a==10)\
    \ checks whether a is equal to 10 or not, while the statement if(a=10) assigns\
    \ the value 10 to a. Well see more examples like this in the next chapter.\n\n\
    # Exercises\n\n4.1 What is the output of the following program?\n\n```\n#include\
    \ <stdio.h>\nint main() \n{\n    int a = 3, b = 5, c;\n    a = (a > 3) + (b <=\
    \ 5);\n    b = (a == 3) + ((b-2) >= 3);\n    c = (!1);\n    printf(\"%d %d %d\\\
    n\", a, b, c);\n    return 0;\n}\n\n```\n\nAnswer: The value of the expression\
    \ (a > 3) is 0 since a is 3. The value of the expression (b <= 5) is 1 since b\
    \ is 5. Therefore, a = 0+1 = 1.\nThe value of the expression (a == 3) is 0 since\
    \ a is 1. The value of the expression ((b-2) >= 3) is 1 since b-2 = 5-2 = 3. Therefore,\
    \ b = 0+1 = 1."
