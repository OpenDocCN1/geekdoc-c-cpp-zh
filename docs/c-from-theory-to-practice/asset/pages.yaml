    discuss more about printf() in the next chapter.


    Until Chapter 11, where you''ll learn how to write other functions, main() will
    be the only function in our programs.


    # Add Comments


    A well-documented program should contain comments to explain its complicated parts
    and make it easier to understand. A comment begins with the /* symbol and ends
    with */. Comments can extend in more than one line.'
