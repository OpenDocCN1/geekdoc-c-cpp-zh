  md: 'However, using a parameterized macro instead of a function has several disadvantages.
    For example, because macros rely on text substitution, you can get into trouble
    when the macro contains complex code, like control-flow constructs. Needless to
    say, it is much harder to read, maintain and debug a macro which contains multiple
    statements. Also, it is not possible to declare a pointer to a macro, because
    macros are removed during preprocessing, so there is no "memory" for a pointer
    to point to.


    When a function is called, the compiler checks the types of the arguments. If
    an argument has the wrong type and the compiler cannot convert it to the proper
    type, it an error message. In contrast, the preprocessor does not check the types
    of the macro arguments, so non-desirable values may pass to it.


    Typically, a parameterized macro is used in place of function, when its code is
    not complicated and it doesn''t extend in many lines. See some examples why writing
    a macro might err prone.


    When passing an argument, don''t apply operators that may change its value.


    For example, the following assignment


    ```

    x = MIN(i++, j);

    ```


    is expanded to


    ```

    x = ((i++)) < (j)) ? (i++) : (j));

    ```


    Therefore, if i is less than j, it will be unintentionally incremented twice and
    a wrong value will be assigned to x.


    > If a macro contains expressions with operators, enclose them in parentheses.


    For example, see what happens if we omit the parentheses:


    ```

    #define NUM 2*5 /* Instead of (2*5). */

    ```


    A statement like this


    ```

    float j = 3.0/NUM;

    ```


    is expanded to


    ```

    float j = 3.0/2*5;

    ```


    which assigns the value 7.5 to j and not 0.3 because the division is performed
    before the multiplication.


    > A macro should be written with great care in order to avoid unexpected results.


