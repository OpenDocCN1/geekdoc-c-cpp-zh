  md: '# fseek() Function


    fseek() function moves the file pointer to a specific location. It is declared
    in stdio.h,

    like this:


    ```

    int fseek(FILE *fp, long int offset, int origin);

    ```


    The fseek() function moves the file pointer indicated by fp to a new location
    offset

    bytes from the point indicated by origin. If offset is negative, the file pointer

    moves back.

    The value of the origin must be one of the following constants, defined in stdio.h:


    +   - SEEK The file pointer is moved offset bytes from the beginning of the file.

    - SEEK_CUR. The file pointer is moved offset bytes from its current position.

    - SEEK_END. The file pointer is moved offset bytes from the end of the file.


    For example, to move to the end of the file, we would write


    ```

    fseek(fp, 0, SEEK_END);

    ```


    To move 20 bytes from the beginning of the file, we would write


    ```

    fseek(fp, 20, SEEK_SET);

    ```


    If fseek() is executed successfully, it returns 0. Otherwise, it returns a nonzero
    value.

    When fseek() is used with text files, care is required with the new line character(s).
    For

    example, suppose the following listing some text in the first two lines of a text

    file. If the operating system expands the new line character, the value of offset
    should be

    6 not 5 in order to move to the beginning of the second line.


    ```

    fputs("text\n", fp);

    fputs("another text\n", fp);

    /* move to the beginning of the second line. */

    fseek(fp, 6, SEEK_SET);

    ```


    # ftell() Function


    The ftell() function gets the current position of a file pointer. It is declared
    in stdio.h,

    like this:


    ```

    long int ftell(FILE *fp);

    ```


    The ftell() function returns the current position of the file pointer indicated
    by fp.

    The position is expressed as the number of bytes from the beginning of the file.

    ftell() may be used together with fseek() to return to a previous file position,

    like this:'
