    \ its value. For example, consider the following program:\n\n```\n#include <stdio.h>\n\
    #include <string.h>\nvoid test(struct student stud_1);\nstruct student {\n   \
    \ char name[50];\n    int code;\n    float grd;\n}\nint main() {\n    struct student\
    \ stud = {\"somebody\", 20, 5};\n    test(stud);\n    printf(\"%N: %s C: %d G:\
    \ %.2f\\n\", stud.name, stud.code, stud.grd);\n    return 0;\n}\nvoid test(struct\
    \ student stud_1) {\n    strcpy(stud_1.name, \"new_name\");\n    stud_1.code =\
    \ 30;\n    stud_1.grd = 7;\n}\n```\n\nWhen test() is called, the values of stud\
    \ fields are copied to the respective fields of stud_1. Since the stud reside\
    \ in different memory locations, any changes in the fields of stud_1 don't affect\
    \ the fields of stud. Therefore, the program displays N: somebody C: 20 G: 5.00.\n\
    \nAs you already know by now, if we were using the name stud instead of stud_1,\
