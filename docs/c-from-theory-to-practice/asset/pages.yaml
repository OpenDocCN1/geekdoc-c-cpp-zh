  md: "# C: From Theory to Practice\n\n```\nvoid avg(int a, int b)\n{\n    /* Function\
    \ body. */\n    if (a == b)\n        return;\n\n    printf(\"%f\\n\", (a+b)/2.0);\n\
    /* The return statement is unnecessary. */\n}\n```\n\nIf the function is declared\
    \ to return a value, then the return value is returned to the point at which the\
    \ function was called. For example, we modified avg(int) to return an integer\
    \ value.\n\n```\nint avg(int a, int b)\n{\n    if (a == b)\n        return 0;\n\
    \n    printf(\"%f\\n\", (a+b)/2.0);\n    /* Now, we must use the return statement\
    \ to return a value. */\n```\n\nThe type of the returned value should match the\
    \ function’s return type. If it doesn't match, the compiler will try to convert\
    \ the returned value to the return type. For example,\n\n```\nint test()\n{\n\
    \    return 4.9;\n```\n\nSince test() is declared to return an int value, the\
    \ returned value is implicitly converted to int and the function returns 4.\n\n\
    # Function Call\n\nWhen a function is called, the execution of the program continues\
    \ with the execution of the function’s code. When it terminates, the program returns\
    \ to the point at which the function was called. A function can be called as many\
    \ times as it is needed.\n\t\t\tWhen calling a function, the compiler allocates\
    \ memory to store the function’s parameters and the variables that are declared\
    \ within its body. This memory is reserved from a specific part of the memory,\
    \ called stack. Once the function terminates, the memory is automatically deallocated.\n\
    \n# Function Call without Parameters\n\nA call to a function that doesn't take\
    \ any parameters is made by writing the function name followed by a pair of empty\
    \ parentheses. The calling program doesn't pass any data to the called function."
