  md: '# Appendix A


    Table A.1 lists C operators from the highest to the lowest order of precedence.
    Operators listed in the same line have the same precedence. The last column indicates
    the order in which operators of the same precedence are evaluated.


    TABLE A.1


    | Operator Category | Operators | Associativity |

    | --- | --- | --- |

    | Primary | () [] - > ++ (postfix) -- (postfix) | Left to right |

    | Unary | ! ~ ++ (prefix) -- (prefix) * (dereference) & (address) sizeof | Right
    to left |

    | Cast | | Right to left |

    | Multiplicative | * (multiplication) / % | Left to right |

    | Additive | + | Left to right |

    | Bitwise Shift | << >> | Left to right |

    | Relational | <= >= | Left to right |

    | Equality | == != >= | Left to right |

    | Bitwise AND | & | Left to right |

    | Bitwise XOR | ^ | Left to right |

    | Bitwise OR | | | Left to right |

    | Logical AND | && | Left to right |

    | Logical OR | || | Left to right |

    | Conditional | ? | Right to left |

    | Assignment | = += - *= /= % &= = | |= <= >> | Right to left |

    | Comma | , | Left to right |'
