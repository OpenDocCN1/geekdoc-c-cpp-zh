  md: "# 66 C: From Theory to Practice\n\nSince a b is greater than 5, the program\
    \ executes the block of statements beginning with if(b == 20) and displays 1 and\
    \ 3.\n\nIn a program with nested if statements, each else statement is associated\
    \ with the nearest if statement that does not contain an else. For example, consider\
    \ the following program:\n\n```\n#include <stdio.h>\nint main()\n{\n    int a\
