  md: '# # 7

    Arrays


    The variables we''ve used so far can store a single value. In this chapter, we''ll
    talk about a

    new type of variable capable capable of storing a number of values. This type
    is called array. An

    array may be multidimensional. We''ll focus on the simplest and most usual kinds;
    the one-dimensional and two-dimensional arrays. To introduce you to arrays, we''ll
    show you how

    to use arrays of integers and floating-point numbers. We''ll discuss other types
    of arrays,

    as well as their close relationship to pointers in later chapters.


    # ## Declaring Arrays


    An array is a data structure that contains elements of the same data type. To
    declare a one-dimensional array, you must specify its name, the number of its
    elements, and their data

    type, like this:


    ```

    data_type array_name[number_of_elements];

    ```


    The elements of an array can be of any type, while their number must be enclosed
    in brack-ets. For example, the statement


    ```

    int arr[1000];

    ```


    declares the array arr with 1000 elements of type int.


    > After declaring an array, you can''t change the number of its elements


    The array''s length is specified by an integer constant expression; however, it
    is a good\practice to use a macro instead. If you ever need to change it, you
    only need to change the

    value of the constant. For example,


    ```

    #define SIZE 150

    float arr[SIZE]; /* The compiler replaces SIZE with 150 and creates

    array of 150 floats. */

    ```


    When declaring an array, the compiler allocates a memory block to store the values
    of its

    elements. These values are stored one after another in consecutive memory locations.
    This

    memory block is allocated in a region called stack, and it is automatically released
    when

    the function that declares the array terminates.


    For example, with the statement int arr[10]; the compiler allocates 40 bytes to

    the values of the 10 integer elements.'
