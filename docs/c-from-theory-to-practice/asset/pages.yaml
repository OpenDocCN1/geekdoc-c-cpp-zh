  md: "# Dynamic Data Structures\n\nThe structures we've met so far are used for data\
    \ storing and processing in an easy and fast way. For example, arrays are data\
    \ structures, which are used for the storage of the same type of data. Structures\
    \ and unions are also data structures, which can be used for the storage of any\
    \ type of data.\n\nThese data structures are static because the allocated memory\
    \ is fixed and can't be modified during program execution. However, in many applications,\
    \ it'd be more efficient to use a dynamic data structure, a structure whose size\
    \ may grow or shrink as needed.\n\nThe next sections describe how to create some\
    \ simple forms of dynamic data structures, like linked lists, queues, and stacks.\n\
    \n# Linked List\n\nA linked list consists of a chain of linked elements, called\
    \ nodes. Each node is a structure, which contains its data and a pointer to the\
    \ next node in the chain, as depicted in Figure 14.1.\n\nThe first node is the\
    \ head of the list and the last one is its tail. The value of the pointer field\
    \ in the last node must be equal to NULL to indicate the end of the list.\n\n\
    Unlike an array whose size remains fixed, a linked list is more flexible because\
    \ we can insert and delete nodes as needed. On the other hand, any array can be\
    \ accessed very fast; we just use its position as an index. The time to access\
    \ a node depends on the position of the node in the list. It is fast if the node\
    \ is close to the beginning, and slow if it is near the end.\n\n# Insert a Node\n\
    \nA new node can be inserted at any point in the list. To insert a new node, we\
    \ check the following cases:\n\n+   - If the list is empty, the node is inserted\
    \ at the beginning and the tail of the list. The value of its pointer field is\
    \ NULL since there is no next node in the list.\n- If the list isn't empty, we\
    \ check the following subcases:\n  - (a) If the node is inserted at the beginning\
    \ of the list, it becomes the new head of the list and its pointer field points\
    \ to the previous head, which now becomes the second node of the list.\n  - (b)\
    \ If the node is inserted at the end of the list, it becomes the new tail of the\
    \ list and the value of its pointer field is set to NULL. The old tail becomes\
    \ the second\n\n![](img/ffccba03b2ad97b0bbffe904cf6d20db_390_0.png)\n\nFIGURE\
    \ 14.1\nLinked list."
