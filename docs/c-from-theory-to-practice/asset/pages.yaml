  md: "# C: From Theory to Practice\n\nThe main advantage of using bit fields is to\
    \ save memory space. For example, if we use the person structure to store the\
    \ data of 200000 people, we'd save 400000 bytes when using the bit fields.\n\n\
    For better memory saving, declare all bit fields at the beginning of the structures,\
    \ not among the rest fields.\n\nWhen you assign a value to a bit field, be sure\
    \ that this value fits in the bit field. For example, suppose that the value 2\
    \ is assigned in the married bit field.\n\n```\nstruct person person_1;\nperson_1.married\
    \ = 2; /* Wrong assignment. */\n```\n\nSince the value 2 is encoded in two bits\
    \ (10), the value would be 0 (assume that bit fields are allocated from left to\
    \ right), not 2.\nSince the memory of a bit field is not allocated like the ordinary\
    \ variables, it is not allowed to apply the & operator to a bit field. For example,\
    \ this statement won't be compiled:\n\n```\nunsigned char *ptr = &person_1.married;\n\
    ```\n\nThe value of a bit field can be either positive or negative since the compiler\
    \ may treat the high-order bit as a sign bit. To avoid the case of negative values,\
    \ declare its type to be unsigned. If the size of a bit field is one bit, then\
    \ its type must be defined as unsigned since a single bit cannot be signed.\n\n\
    # Pointer to Structure\n\nA pointer to a structure is used like a pointer to an\
    \ ordinary variable. Consider the following program:\n\n```\n#include <stdio.h>\n\
    #include <string.h>\n\nstruct student {\n    char name[50];\n    float grd;\n\
    };\n\nint main() {\n    struct student *stud_ptr, stud;\n    stud_ptr = &stud;\n\
    \    strcpy((*stud_ptr).name, \"somebody\");\n    (*stud_ptr).grd = 6.7;\n   \
    \ printf(\"N: %s G: %.2f\\n\", stud.name, stud.grd);\n    return 0;\n}\n```\n\n\
    The variable stud ptr is declared as a pointer to a structure variable of type\
    \ student."
