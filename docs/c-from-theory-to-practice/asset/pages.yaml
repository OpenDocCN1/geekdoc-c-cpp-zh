  md: "# Operators\n\nexp1, exp2, exp3,...\n\nThe comma operator means \"evaluate\
    \ the expression exp1 first, then evaluate exp2, then exp3, through the last expression.\"\
    \ Since the comma operator is left associative, the expressions are sequentially\
    \ evaluated from left to right. The result of the entire expression is the result\
    \ of the last expression evaluated. For example,\n\n```\n#include <stdio.h>\n\
    int main()\n{\n    int b;\n    b = 20, b = b+30, printf(\"Num = %d\\n\", b);\n\
    \    return 0;\n}\n```\n\nSince the expressions are executed from left to right,\
    \ the value of b becomes 50 and the program displays Num = 50.\nin fact, there\
    \ is little reason to use a comma operator to merge expressions because the resulting\
    \ code can be more complex and harder to evaluate. For example, we'll see in Chapter\
    \ 6, the most common use of the comma operator is in the controlling expressions\
    \ of a for statement:\n\n```\nint a, b;\nfor(a = 1, b = 2; b < 10; a++, b++)\n\
    ```\n\nThe first controlling expression performs a = 1 and then b = 2. The third\
    \ expression performs a++ and then b++.\n\n# Exercise\n\n4.12 What is the output\
    \ of the following program?\n\n```\n#include <stdio.h>\nint main()\n{\n    int\
    \ a, b;\n    a = (b = 20, b = b+30, b++);\n    printf(\"a = %d, b = %d\\n\", a,\
    \ b);\n    return 0;\n}\n```\n\nAnswer: Since the expressions b = 20, b = b+30\
    \ are executed from left to right, the value of b becomes 50. With the expression\
    \ b++ the current value of b is first stored in a and then its value is incremented.\
    \ The final output of the program is a = 50 b = 51.\n\n> The parentheses are necessary\
    \ since the comma operator has the lowest precedence of any C operator, including\
    \ the assignment (=) operator.\n\n![](img/ffccba03b2ad97b0bbffe904cf6d20db_70_0.png)"
