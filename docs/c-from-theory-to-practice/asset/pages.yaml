  md: "operations adding an integer to pointer, subtracting an integer from a pointer\
    \ and subtraction of pointers, which point to the same type of data.\n\n# Pointers\
    \ and Integers\n\nThe addition of an integer n to a pointer variable in a statement\
    \ like\n\n```\nptr = ptr + n;\n```\n\nincreases its value by n x size of the pointer's\
    \ data type. For example, if ptr is declared as a pointer to\n\n+   * char: ptr\
    \ is increased by n since the size of char is one byte\n* int or float: ptr is\
    \ increased by nx4 since the size of both int and float is four bytes\n* double:\
    \ ptr is increased by nx8 since the size of double is eight bytes\n\nIn the following\
    \ program, the statement ptr++; increases its value by four because it is declared\
    \ as a pointer to int. In fact, this program displays two addresses and the second\
    \ is four bytes higher than the first.\n\n```\n#include <stdio.h>\nint main()\
    \ {\n    int *ptr, i;\n    ptr = &i;\n    printf(\"Address = %p\\n\", ptr);\n\
    \    ptr++;\n    printf(\"Address = %p\\n\", ptr);\n    return 0;\n}\n```\n\n\
    Similar to addition, subtracting an integer n from a pointer variable decreases\
    \ its value by n x size of the pointer's data type. For example, had we written\
    \ ptr -= 10; instead of ptr++; the second address would be 40 bytes less.\n\n\
    # Subtracting Pointers\n\nThe subtraction of two pointers is only valid if both\
    \ point to the same data type. The result of their subtraction is an integer number,\
    \ which indicates the number of data items between them.\n\nFor example, suppose\
    \ that the ptr1 and ptr2 are pointers to two integer variables stored in the addresses\
    \ 1040 and 1040, respectively. The result of ptr2-ptr1 is not equal to 40 (i.e.,\
    \ 1040-1000), but equal to (1040-1000)/sizeof(int) = 40/4 = 10. This number indicates\
    \ the number of integers between the two pointers.\n\nIf the type of both pointers\
    \ and variables was char, the result of ptr2-ptr1 would be 40 because the size\
    \ of the char type is one byte."
