  md: "# Function Parameters\n\nA function may take a list of parameters, separated\
    \ by commas. Each parameter is preceded by its type. As we'll see later, a function\
    \ parameter is essentially a variable of the function, which will be assigned\
    \ a value when the function is called.\n\nIf the function has no parameters, we\
    \ use either the word void or an empty pair of parentheses. Although we'll use\
    \ an empty pair in our examples—this is a habit coming from an older version of\
    \ C—if you want to be in full accordance with the C standard you should use the\
    \ word void between the parentheses. The reason is that a pair of empty parameters\
    \ terminates that function takes an unknown number of parameters and not any.\n\
    \nLet's see some examples of function declarations:\n\n```\nvoid show(char ch);/*\
    \ Declare a function with name show, which takes a char parameter and returns\
    \ nothing. */\ndouble show(int a, float b);/* Declare a function with name show,\
    \ which takes an integer and a float parameter and returns a value of type */\n\
    int *show(int *ptrl, double a);/* Declare a function with name show, which takes\
    \ a pointer to integer parameter and a double parameter and returns a pointer\
    \ to integer. */\n```\n\n# Function Definition\n\nThe general form of the function\
    \ definition is\n\n```\nreturn_type function_name(parameter_list)\n{\n    /* Function\
    \ body */\n}\n```\n\nThe first line of the function's definition must resemble\
    \ its declaration, with the difference that no semicolon is added at the end.\
    \ The code or the body of the function contains declarations and statements enclosed\
    \ in braces.\n\nThe function's body is executed only if the function is called\
    \ somewhere in the program. The execution of a function terminates if there an\
    \ exit statement (i.e., return) is called or its last statement is executed.\n\
    \nNow that we have seen how to define a function, let's see an example of using\
    \ a function:\n\n```\n#include <stdio.h>\nvoid test();/* Function declaration.\
    \ */\nint main()\n{\n    test();/* Function call. */\n    return 0;\n}\n```"
