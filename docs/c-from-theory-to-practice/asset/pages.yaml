  md: '# 15

    Files


    Real-world programs often need to perform access operations on files. This chapter
    introduces C''s most important library functions designed specifically for use
    with files. We won''t describe them in full detail, but we''ll give you the material
    needed in order to perform file operations. In particular, you''ll learn how to
    open and close a file, as well as how to read and write data in text and binary
    files.


    # ## Files in C


    C supports access operations on two kinds of files: text and binary.

    A text file consists of one or more lines that contain readable characters according
    to a standard format, like the ASCII code. Each line ends with special character(s)
    the operating system uses to indicate the end of line.


    In Windows systems, for example, the pair of ''\r'' (Carriage Return) and ''\n''
    (Line Feed) characters, that is CR/LF, with ASCII codes 13 and 10 respectively,
    indicate the end of line. The new line character ''\n'' is replaced by ''\r''
    and ''\n'' when written in the file. The reverse replacement happens when the
    file is read. On the other hand, this replacement does not take place in Unix
    systems because the ''\n'' character indicates the end of line.


    Unlike the text files, the bytes of a binary file do not necessarily represent
    readable characters. For example, an executable C program is stored in a binary
    file. If you open it, you''ll probably see some unintelligible characters. A binary
    file is divided into lines and no character translation takes place. In Windows,
    for example, the new line character isn''t expanded to ''\r\n'' when written in
    the file.


    Another difference between text and binary files is that the operating system
    may add a special character at the end of a file to mark its end. In Windows,
    for example, the control-Z (CTRL-Z) characters mark the end of a text file. On
    the other hand, no character has a special significance in a binary file. They
    are all treated the same.


    Storing data in a binary file can save space compared to a text file. For example,
    suppose that we are using the ASCII character set to write the number 47654 in
    a text file. Since this number is represented with 5 characters, the size of the
    file would be 5 bytes, as shown in Figure 15.1.


    On the other hand, if this number is stored in binary, the size of the file would
    be 2 bytes, as shown in Figure 15.2.'
