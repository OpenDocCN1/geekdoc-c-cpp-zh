  md: "# 14 Memory Management and Data Structures\n\nMemory management is mainly related\
    \ to memory allocation and the release of allocated memory when it is no longer\
    \ needed. Memory allocation can be performed either statically or dynamically.\
    \ Up to this point, our program variables are stored in fixed size memory, statically\
    \ allocated. In this chapter, we'll show you how to allocate memory dynamically\
    \ during program execution in order to form flexible data structures, like stacks,\
    \ queues, and linked lists.\n\n# Memory Blocks\n\nWhen a program runs, it asks\
    \ for memory resources from the operating system. Various operating systems and\
    \ compilers use their own models to manage the available memory. Typically, the\
    \ system memory is divided into four parts:\n\n+   1. The *code* segment, which\
    \ is used to store the program code.\n2. The *data* segment, which is used to\
    \ store the global and static variables. This segment may also be used to store\
    \ literal strings (typically, in a read-only memory).\n3. The *stack* segment,\
    \ which is used to store function's data, like local variables.\n4. The heap segment,\
    \ which is used for dynamic memory allocation.\n\nFor example, the following program\
    \ displays the memory addresses of the program data:\n\n```\n#include <stdio.h>\n\
    #include <stdlib.h>\n\nvoid test() {\nint global;\n\nint main() {\n    int *ptr;\n\
    \    int i;\n    static int st;\n\n    ptr = (int *) malloc(sizeof(int)); /* Allocate\
    \ memory from the heap. */\n    if(ptr != NULL) {\n        printf(\"Code seg:\
    \ %p\\n\", test);\n        printf(\"Data seg: %p %p\\n\", &global, &st);\n   \
    \     printf(\"Stack seg: %p\\n\", &i);\n    }\n```"
