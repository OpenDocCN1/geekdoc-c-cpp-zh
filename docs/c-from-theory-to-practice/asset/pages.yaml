  md: '# # Two-Dimensional Arrays


    A two-dimensional array, like the matrix in math, consists of rows and columns
    and, like one-dimensional arrays, contains elements of the same data type.


    # # Two-Dimensional Array Declaration


    To declare a two-dimensional array, you must specify its name, the data type of
    its elements, and the number of rows and columns.


    ```

    data_type array_name[number_of_rows][number_of_columns];

    ```


    The number of elements is equal to the number of its rows multiplied by the number
    of its columns.


    For example, the statement double arr[10][5]; declares the two-dimensional array
    arr with 50 elements of type double.


    # # Accessing the Elements of a Two-Dimensional Array


    To access an element, we write the name of the array followed by the element''s
    row index and column index enclosed in brackets []. Like one-dimensional arrays,
    the indexing of rows and columns starts from 0. For the statement


    ```

    int a[3][4];

    ```


    declares a two-dimensional array whose elements are the a[0][0], a[0][1], ...,
    a[2][3], as depicted in Figure 7.1.


    Like one-dimensional arrays, when a two-dimensional array is declared, the compiler
    allocates a memory block from the stack to store the values of its elements. For
    example, with the statement int arr[10][5]; the compiler allocates a block of
    200 bytes to store the values of its 50 elements.'
