  md: "# Functions\n\n```\nvoid test()/** Function definition. */\n{\n    /* Function\
    \ body. */\n    printf(\"In\\n\");\n}\n```\n\nAlthough C doesn't require to put\
    \ function definitions after main(), defining functions in that order makes it\
    \ easier for the reader to locate the starting point of the program. However,\
    \ if a function definition is put before the first call of the function (i.e.,\
    \ in the aforementioned program before main()), it's not necessary to declare\
    \ the function. Just remember that the compiler should have seen the prototype\
    \ of a function before calling it in order to know explicitly how to call it.\n\
    \n# return Statement\n\nThe return statement is used to terminate immediately\
    \ the execution of a function. The execution of the program continues from the\
    \ point where the function was made.\nIn some programs so far, we've used the\
    \ return statement to terminate the main() function, that is, the function itself.\
    \ For example, the following program terminates if the user enters the value 2,\
    \ otherwise it prints the input value:\n\n```\n#include <stdio.h>\nint main()\n\
    {\n    int num;\n    while(1)\n    {\n        printf(\"Enter number: \");\\n \
    \       scanf(\"%d\", &num);\n        if(num == 2)\n            return 0; /* Program\
    \ termination. */\n        else\n            printf(\"Num = %d\\n\", num);\n \
    \   }\n    return 0; /* The code doesn't reach here. */\n}\n```\n\nNotice that\
    \ the last return will never be executed because the first return terminates the\
    \ program.\nThe value returned by main() indicates the termination status of the\
    \ program. To indicate normal termination main() should return 0, whereas a value\
    \ other than 0 indicates abnormal termination.\nIf the function returns nothing,\
    \ just write return. The return statement at the end of a void function is unnecessary\
    \ because the function will run automatically.\nIn the following, the avg() function\
    \ compares the values of the two parameters, and if they are different, it displays\
    \ their average. If they are equal, the function terminates."
