  md: '# #2 Data Types, Variables, and Data Output


    In order to write programs that actually perform useful tasks that save us time
    and work, this chapter will teach you how to use data types and variables. We''ll
    also go into more detail on the most important function for outputting the data:
    printf() function.


    # ## Variables


    The computer''s RAM (random access memory) consists of millions of successive
    storage cells. The size of each cell is *one byte*. For example, an old PC with
    16 MB (megabytes) of RAM consists of 16 × 1024 KB (kilobytes), or 16,777,216 cells.
    A newer PC with say 8 GB (gigabytes) of RAM would have 8 × 1024 MB = 8192 × 1024
    KB = 8,388,608 × 1024 = 8,589,934,592 memory cells.

    *A variable in C is a storage location with a given name. The value of a variable
    is the content of its memory location. A program may use the name of a variable
    to access its value.


    # ## Rules for Naming Variables


    There are some basic rules for naming variables. Be sure to follow them or your
    code won''t compile:


    +   1. The name of a variable can contain uppercase letters, lowercase letters,
    digits, and the underscore `_` character.

    2. The name must begin with either a letter or the underscore character.

    3. The C programming language is *case sensitive*, meaning that it distinguishes
    between uppercase and lowercase letters. For example, the variable `var` differs
    from `vAr`.

    4. The following keywords cannot be used as variable names because they have special
    significance to the C compiler:


    ```

    auto            goto        signed      unsigned

    break           double      sizeof      void

    else            int         static      volatile

    case            enum        volatile      volatile

    char            long        struct      while

    const           extern      register    switch

    continue        for         return      typedef

    default         float       short       union

    ```


    Compilers also treat the words **asm**, **far**, and **near** as additional keywords.'
