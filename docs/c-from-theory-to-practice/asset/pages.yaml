  md: "# 5\nProgram Control\n\nUp to this point we have seen that program's statements\
    \ are executed from top to bottom, in the order that they appear inside the source\
    \ code. However, in real programming, certain statements should be executed only\
    \ if specific conditions are met. This chapter will teach you how to use if and\
    \ switch selection statements to control the flow of your program and make it\
    \ select a particular execution path from a set of alternatives. It also introduces\
    \ the conditional operator (?:), which can be used to form conditional expressions.\n\
    \n# if Statement\n\nThe if statement controls program flow based on whether a\
    \ condition evaluates to true or false. The simplest form of if statement is\n\
    \n```\nif(condition)\n{\n    /* block of statements. */\n}\n```\n\nIf the value\
    \ of the condition is true, the block of statements between the braces will be\
    \ executed. For example,\n\n```\nint x = 3;\nif(x != 0)\n{\n    printf(\"x isn't\
    \ zero\\n\");\n}\n```\n\nSince x is not 0, the value of the if condition is true\
    \ and the program displays x isn't zero.\n\n> if(x != 0) is equivalent to if(x)\n\
    \nIf the value of the condition is false, the block of statements won't be executed.\
    \ For example, the following code displays nothing:\n\n```\nint x = -3;\nif(x\
    \ == 0)\n{\n    printf(\"x is zero\\n\");\n}\n```"
