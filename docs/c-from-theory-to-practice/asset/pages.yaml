  md: "# Structures and Unions\n\nThe statement stud _ptr = &stud; makes it to the\
    \ address of the variable stud. In particular, it points to the address of its\
    \ first field. Since stud _ptr points to the address of stud, *stud _ptr is equivalent\
    \ to stud. Then, we are using the (.) operator to access its fields. The expression\
    \ (* stud ptr) must be enclosed in parentheses because the (.) operator takes\
    \ precedence over the * operator. Alternatively, we can use the pointer and the\
    \ -> operator to access the fields of a structure. For example,\n\n```\n#include\
    \ <stdio.h>\n#include <string.h>\nstruct student\n{\n    char name[50];\n    float\
    \ grd;\n};\nint main() {\n    struct student *stud_ptr, stud;\n    strcpy(stud.name,\
    \ \"somebody\");\n    stud.grd = 6.7;\n    stud_ptr = &stud;\n    printf(\"::%s\
    \ G:%.2f\\n\", stud_ptr->name, stud_ptr->grd);\n    return 0;\n}\n```\n\nThe expression\
    \ stud _ptr->name is equivalent to (*stud _ptr).name and the expression stud _ptr->grd\
    \ is equivalent to (*stud _ptr).grd.\nTherefore, both programs display\n\nN: somebody\
    \ G: 6.70\n\nUsing a pointer to access the fields of a structure, we find it simpler\
    \ to use the -> operator.\n\n> The same rules concerning the arithmetic of an\
    \ ordinary pointer variable apply to a structure pointer. For example, if a structure\
    \ pointer is increased by one, its value will be increased by the size of the\
    \ structure it points to.\n\n# Arrays of Structures\n\nAn array of structures\
