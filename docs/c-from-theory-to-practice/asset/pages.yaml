    actually sets the value of a to 10 since a has been declared as int and not float.
    (The decimal part is completely ignored, and the assigned value is not rounded
    to 11.) However, the value of a float variable can be an integer. For example,
    you could write float a = 50; since that''s equivalent to float a = 50.0;


    # Constants


    A variable whose value cannot change during the execution of the program is called
    a constant. To declare a constant, precede the type of the variable with the const
    keyword. A constant must be initialized when it is declared and you cannot assign
    it another value within the program.


    For example, the following statement declares the integer variable a as a constant
    and sets it to 10:


    ```

    const int a = 10;

    ```


    If we attempt to change the value of a constant later in a program, for example
    by writing a = 100;


    the compiler will raise an error message.


    # #define Directive


    The #define directive is used to define a macro, a name that, in most cases, represents
    a numerical value. To define a simple macro, we write


    ```

    #define name_of_macro value

    ```'
