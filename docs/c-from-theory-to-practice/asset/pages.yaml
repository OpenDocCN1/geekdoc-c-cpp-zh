    # Static Memory Allocation


    In static allocation, the memory is allocated from the stack. The size of the
    allocated memory is fixed; we must specify its size when writing the program and
    it can''t change during program execution. For example, with the statement


    ```

    float grades [100];

    ```


    the compiler allocates 500*4 = 2000 bytes to the grades of 500 students. The size
    of the array remains fixed; if we need to store for more students, we can''t change
    it during execution. If the students proved to be less than 500, we''d have a
    waste of memory. The only way to change the size of the array is to modify the
    program and compile it.


    Now, let''s see what happens when a function is called. The compiler allocates
    memory in the stack to store the function''s data. For example, if the function
    returns a value, accepts parameters, and declares local variables, the compiler
    allocates memory to store:


    +   (a) The values of the parameters

    (b) The local variables

    (c) The return value

    (d) The address of the next statement to be executed, after the function terminates


    When the function terminates, the following actions take place:


    +   (a) If the return value is assigned into a variable, it is extracted from
    the stack and stored into that variable.

    (b) The address of the next statement is extracted from the stack and the execution
    of the program continues with that statement.

    (c) The memory allocated to store the function''s data is released; therefore,
    the values of the parameters and local variables may be overwritten.


    For example, in the following program, when test() is called, the compiler allocates
    80 bytes in the stack to store the values of i, j, and arr elements:


    ```

    #include <stdio.h>

    void test(int i, int j);

    ```'
