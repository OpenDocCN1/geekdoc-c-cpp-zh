    \nNotice how indenting can trick you into thinking that the else statement is\
    \ associated with the first if statement. By aligning else statement with the\
    \ corresponding if (indenting the statements and adding braces to if-else statements\
    \ even if you don't have to) can make the program easier to read. For example,\
