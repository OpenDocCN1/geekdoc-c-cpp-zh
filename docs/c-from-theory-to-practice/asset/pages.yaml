  md: '# 1


    # Introduction to C


    Before getting into the details of C language, this chapter presents, in brief,
    its history, evolution, strengths, and weaknesses. Then, we''ll discuss some basic
    concepts that we''ll need in order to write our first program.


    # History of C


    The C language was developed at Bell Laboratories in the early 1970s by Dennis
    Richie and others. At that time, the UNIX operating system, also developed at
    Bell Labs, was written in assembly language. Programs written in assembly are
    usually hard to debug, maintain, and enhance, and UNIX was no exception. Richie
    decided to rewrite UNIX''s code in another language that would make the execution
    of these tasks easier. He named the language C because it was the evolution of
    an earlier language written by Ken Thompson, called B.


    The C language continued to evolve during the 1970s, and since then it is widely
    used by thousands of programmers for the development of various software applications.


    # ANSI Standard


    The rapid expansion of the C language and its increased popularity led many companies
    to develop their own C compilers. Due to the absence of an official standard,
    development relied on the bible of C programmers, the legendary K&R book, written
    by Brian Kernigh and Dennis Richie in 1978.


    However, the K&R book was not written in the precise way that a standard requires.
    Features were not clearly described could be implemented in different ways. As
    a result, the same program could be compiled with one compiler and not with another.
    In parallel, the C language continued to evolve with the addition of new features
    and the replacement or obsolescence of existing ones.


    The need for the standardization of C language became apparent. In 1983, the American
    National Standard Institute (ANSI) began the development of C standard was completed
    and formally approved, in 1989, as ANSI C or Standard C. This standard describes
    precisely the features, characteristics, and properties of the C language, and
    every compiler must support it. The addition of some new features to the ANSI
    standard during the late 1990s led to a new standard called C99.


    This book describes the C language based on the ANSI/ISO standard [1].'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Advantages of C


    Despite the emergence of many programming languages, C still remains competitive
    popular in the programming world for several reasons, such as the following:


    +   1. It is a flexible language, which can be used for the development of different
    kinds of applications, with embedded systems and operating systems to industrial
    applications. For example, we''ve used C in the area of communication networks
    for the development of network protocols and the support of network services.

    2. A C program is executed very fast.

    3. It is a small language. Its vocabulary consists of a few words with special
    meanings.

    4. It is portable, meaning that a C program may run under different operating
    systems.

    5. It offers structural programming, meaning that a C program may contain functions
    to perform several tasks.

    6. It is a language very close to the hardware.

    7. Every C compiler comes with a set of ready-to-use functions, called C standard
    library. The use of these library functions saves considerable effort.

    8. Thanks to the popularity of the C language, there are many C compilers available,
    some of them free of charge.

    9. Learning C is the first step toward object-oriented programming. Most of the
    features are supported in several object-oriented languages, like C++, Java, and
    C#.


    # Disadvantages of C


    +   1. Because the C language does not impose many restrictions on the use of
    its features, it is an error-prone language. When writing a C program, be cautious
    because you may insert bugs that will not be detected by the compiler.

    2. Although C is a small language, it is not "easy" to use language. C code can
    be very hard to understand if it consists of a small number of lines. After reading
    this book, check out the International Obfuscated C Code Contest (http://www.ioccc.org)
    to get a feeling.

    3. It is not an object-oriented language.


    # C Program Life Cycle


    The life cycle of a C program involves several steps: writing the source code,
    its compilation, linking the code produced by the compiler with the code of the
    used library functions, and executing the program.'
