  md: '# Authors


    Dr. George S. Tselikis received his Dipl-Ing and his PhD from the School of Electrical
    and Computer Engineering of the National Technical University of Athens (NTUA)
    in 1993 and 1997, respectively. In 1998, he joined the COMET group in the Center
    for Telecommunications Research at Columbia University, New York and worked as
    a postdoc research associate. He was a founding member of 4plus S.A. (1999–2013),
    where he worked in the development of network protocols and services. He has a
    long working experience in the telecom area, and his research focus on software
    specification, development, and testing of network protocols and services in wired
    and wireless networks. During his professional career, he has collaborated with
    big players in the telecom industry like Siemens, Nokia, and Alcatel. Since 2004,
    he has been a visiting lecturer in several universities and teaches courses related
    to network technologies, protocols, and communications, as well as the C language.


    Dr. Nikolaos D. Tselikas received his Dipl-Ing and his PhD from the School of
    Electrical and Computer Engineering of the National Technical University of Athens
    (NTUA) in 1999 and 2004, respectively. His research interests focus on the specification
    and implementation of network services and applications. He has participated in
    several European and national research projects in this field. During his involvement
    in the research projects, he has collaborated in software design and development
    topics with big players in the telecom industry like Ericsson, Siemens, Alcatel,
    and Vodafone. He has served as a visiting lecturer in the Department of Informatics
    and Telecommunications, University of Peloponnese, Greece, since 2006 and was
    appointed lecturer in 2009. He currently serves as an assistant professor at the
    same university, where he teaches courses related to applications programming
    and network services, as well as the C language.'
