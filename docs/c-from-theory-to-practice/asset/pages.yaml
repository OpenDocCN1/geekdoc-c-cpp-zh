    }\n```\n\n# Binary Search\n\nThe search algorithm is used for searching for a\
    \ value in a sorted array (either in ascending or descending order). To see how\
    \ this algorithm works, assume that we are searching for a value in an array sorted\
    \ in ascending order:\n\n+   Step 1: We use two variables, that is, start and\
    \ end, which indicate the start and the end of the part of the array, in which\
    \ we are searching for the value. We use the variable middle to calculate the\
    \ middle position of that: middle = (start+end)/2. For example, if we have a sorted\
    \ array of 100 integers, start should be initialized to 0, and to 99, middle becomes\
    \ 49.\nStep 2: We compare the value we are searching against the middle element:\n\
    \n+   (a) If they are equal, the searched value is found and the algorithm terminates.\n\
    (b) If it is greater, the algorithm is repeated at part of the array starting\
    \ from the middle position and up to the end. Therefore, start becomes middle+1\
    \ and the algorithm goes back to Step 1.\n(c) If it is less, the algorithm is\
    \ repeated at part of the array starting from the start position and up to the\
    \ middle. Therefore, end becomes middle-1 and the algorithm goes back to Step\
    \ 1.\n\nIn short, the binary search algorithm divides the array into two parts.\
    \ Then, the searched value is compared with the middle element and the same process\
    \ is repeated in the respective part."
