    # switch versus if

    The main disadvantage of using the switch instead of if that switch can check
    only whether the value of an expression and the case constants are equal, whereas
    if can check any kind of condition and not only for equality. Moreover, when using
    switch, the values of expression and case constants must be integers. Characters
    are treated as small integers so they may be used, but floating-point numbers
    and strings are not permitted.

    On the other hand, the use of the switch statement of cascaded in place of cascaded
    if-else-if statements may make the program easier to read.


