  md: '# Close a File


    The fclose() function is used to close an open file. It is declared in stdio.h,
    like this:


    ```

    int fclose(FILE *fp);

    ```


    It takes as argument a file pointer associated with an open file.

    If the file is closed successfully, fclose() returns 0, EOF otherwise. The EOF
    (End Of File) is a special constant, which indicates that either the end of the
    file is reached or a file operation failed. It is defined in stdio.h equal to
    -1.


    > Although an open file is closed automatically when the program terminates, it''d
    better to call fclose() when you no longer use it. A good reason is that if your
    program crashes the file will be intact.


    # Process a File


    As discussed, the file pointer returned from a successful call to fopen() is associated
    with the opened file and points to a structure of type FILE. For example, it keeps
    the file position where the next read or write operation can be performed.


    When a file is opened for reading or writing, the file position is at the beginning
    of the file. If it is opened for appending, it is set at the end of the file.
    When a write or read operation is performed, the file position advances automatically.
    For example, if a file is opened for reading and the program reads 50 characters,
    the file position advances 50 bytes from the beginning of the file. Similarly,
    in a write operation, the file position advances a number of places equal to the
    number of the written bytes.


    As we''ll see, the fseek() function can be used to set the file position anywhere
    in the file.


    # Write Data in a Text File


    The most common functions for writing data in a text file are fprintf(), fputs(),
    and fputc(). These functions are mostly used with text files, although you can
    use them with binary files.


    # fputs() Function


    The fputs() writes a string in an output file. It is declared in stdio.h, like
    this:


    ```

    int fputs(const char *str, FILE *fp);

    ```


    The first argument contains the string written in the file indicated by fp.

    If fputs() is executed successfully, it returns a non-negative value, EOF otherwise.'
