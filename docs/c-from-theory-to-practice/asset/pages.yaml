    ```


    Once a variable is declared, the compiler reserves the bytes in memory that it
    needs in order to store it. As indicated in the second column of Table 2.1, each
    type requires specific memory space. For example, the char type requires one byte,
    the float and int type require four bytes, the double type requires eight bytes,
    and so on.


    > The memory space that a data type may vary from one system to another. For example,
    the int type may reserve two bytes in one system and four bytes in another. (To
    determine the number of bytes a data type uses on a particular system, use the
    sizeof operator, described in Chapter 4.)


    The char, short, int, and long types are used to store integer values, which can
    be either signed or unsigned. By default these types are signed, which means the
    leftmost bit of integer variables reserved for the sign (positive or negative).
    If an integer is declared as unsigned, then it has no sign and it may only positive
    values. The advantage of this unsigned values have a higher upper limit than their
    signed counterparts they don''t need to account for values less than zero.

    The float, double, and long types are used to declare variables that can carry
    values with a fractional part, which are floating-point numbers. Unlike the integer,
    floating-point types are always signed. The C standard doesn''t specify the precision
    because different computers use different formats to store floating-point numbers.
    Usually, the precision of the float type is 6 digits after the decimal point,
    while the precision of the double type is 15 digits. The range of the long double
    type isn''t its length, with 10 and 16 bytes being the most common. The precision
    of the long double is at least much as the precision of the double type, with
    18 digits being a typical precision. Although the long double type supports the
    highest precision, it is rarely used because the precision of the float and double
    types is enough, for most applications.'
