  md: '# #4


    #  Operators


    Now that you''ve been introduced to the concepts of C data types, variables, and
    constants, it is time to learn how to manipulate their values. C provides a rich
    set of operators that are used to build expressions and perform operations on
    them. In this chapter, we''ll present some of C''s most important operators. We''ll
    introduce the rest gradually over the next chapters, and you''ll see how to apply
    them when building more complex programs.


    # Assignment Operator


    The = operator is used to assign a value to a variable. For example, the statement
    a = 10; assigns the value 10 to the variable, while the statement a = k; assigns
    the value of the variable k to a.


    When used in a chained assignment, the assigned value is stored in all variables
    in the chain, from right to left. For example, in this statement


    ```

    int a, b, c;

    a = b = c = 10;

    ```


    the variables c, b, and a are assigned the value 10, in that order. If the variable
    and assigned value are not of the same type, the value is first converted to the
    variable''s type. For example, what would the value of b be in the following?


    ```

    int a;

    float b;

    b = a = 10.22;

    ```


    Since a is an int variable, it is assigned the value 10, and this value is stored
    in b. Therefore, the value of b is 10, not 10.22 as you might expect.


    # Arithmetic Operators


    The arithmetic operators +, -, *, and / are used to perform addition, subtraction,
    multiplication, and division.


    When both operands are integers, the operator / cuts off the decimal part. For
    example, suppose that a and b are int variables with values 3 and 2, respectively.
    Then, the result of a/b is 1. If either of the operands is a floating point variable
    or constant, the decimal part is not truncated. For example, the result of a/5.0
    is 0.6 since the constant 5.0 is considered float.'
