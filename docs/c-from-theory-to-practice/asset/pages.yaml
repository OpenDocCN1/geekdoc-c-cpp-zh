    # Assigning Values to Variables


    A variable can be given a value by using the assignment operator =. For example,
    the following statement assigns the value 100 to the variable a:


    ```

    int a;

    a = 100;

    ```


    Alternatively, a variable can be initialized together with its declaration:


    ```

    int a = 100;

    ```


    You can also initialize more than one variable of the same type together with
    its declaration. For example, the following statement declares a, b, and c variables
    and assigns them the values 100, 200, and 300, respectively:


    ```

    int a = 100, b = 200, c = b+100;

    ```


    You could even write


    ```

    int a = 100, b = a+100, c = b+100;

    ```


    In this example, the assignments take place from left to right, meaning that the
    first value of a becomes 100, then b becomes 200, and finally c becomes 300.


    ```

    int a = 0100;

    ```


    Similarly, a value begins with 0x is interpreted as a hexadecimal (base-16) number.
    For example, the following statement assigns the decimal value 16 to the variable
    a:


    ```

    int a = 0x10;

    ```


    Appendix D provides a brief introduction to binary and hex systems.

    The value assigned to a variable should be within the range of its type. For example,
    the\statement


    ```

    char ch = 130;

    ```'
