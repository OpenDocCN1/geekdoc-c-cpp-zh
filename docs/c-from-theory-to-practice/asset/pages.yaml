  md: "# 250\n\nAs we'll see later, the variables of a function belong exclusively\
    \ to that function and they are not related with the variables of other functions,\
    \ even if they are named the same. Therefore, the output would be the same.\n\n\
    If we want the function to be able to modify the value of an argument, we should\
    \ pass it by reference, meaning that we should pass its address. For example:\n\
    \n```\n#include <stdio.h>\nvoid test(int *ptr1);\n{\n    int *ptr, i = 10;\n \
    \   ptr = &i;\n    test(ptr); /* Without using the variable ptr we could write\
    \ test(&i); */ */\n    printf(\"Val = %d\\n\", i);\n    return 0;\n}\n```\n\n\
    ```\nvoid test(int *ptr1)\n{\n    *ptr = 20;\n}\n```\n\nWhen test() is called,\
    \ we have ptr1 = ptr = &i. Since ptr1 points to the address of i, the function\
    \ may change the value of i. Therefore, the statement *ptr1 = 20; modifies the\
    \ value of i and the program displays Val = 20.\n\n> Since a function can't return\
    \ more than one value, passing arguments by reference is the most flexible way\
    \ to change the values of the arguments.\n\nWhen a function is called, it's allowed\
    \ to pass some arguments by value and some others by reference. For example:\n\
    \n```\n#include <stdio.h>\nvoid test(int *ptr1, int a);\n{\n    int i = 100, j\
    \ = 200;\n    test(&i, j);\n    printf(\"%d %d\\n\", i, j);\n    return 0;\n}\n\
    ```\n\n```\nvoid test(int *ptr1, int a)\n{\n    *ptr1 = 300;\n    a = 400;\n}\n\
    ```"
