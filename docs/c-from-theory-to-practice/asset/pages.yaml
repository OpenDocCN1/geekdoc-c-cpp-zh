  md: "# Operators\n\nLike the increment operator, the decrement operator -- can be\
    \ added either before or after the variable's name. Both forms decrement the variable's\
    \ value by 1, but, like the increment operator, they do so at different times.\
    \ For example,\n\n```\n#include <stdio.h>\nint main() {\n    int a = 4;\n    a--;\
    \ /* Equivalent to a = a-1; */\n    printf(\"Num = %d\\n\", a);\n    return 0;\n\
    }\n```\n\nThe output of this program is Num = 3 since the statement a-- is equivalent\
    \ to a-1. The rules that apply for the postfix and prefix usage of the increment\
    \ operator ++ also apply for the decrement operator --. For example,\n\n```\n\
    #include <stdio.h>\nint main() {\n    int a = 4, b;\n    b--;\n    printf(\"a\
    \ = %d\\n\", a, b);\n    b--;\n    printf(\"a = %d\\n\", a, b);\n    return 0;\n\
    }\n```\n\nWith the statement b = a--; the current value of a is stored in b and\
    \ then its value is decremented by 1. The first printf() displays a = 3 b = 4.\n\
    Next, with the statement b = --a; the value of a is immediately decremented by\
    \ 1 and then its value is stored in b. The second printf() displays a = 2 b =\
    \ 2.\nThe operators and -- can be combined in the same expression.\n\n```\n#include\
    \ <stdio.h>\nint main() {\n    int a = 1, b = 2, c = 3;\n    printf(\"%d\\n\"\
    , (++a)-(b--)+(--c));\n    return 0;\n}\n```\n\nWith the operation ++a the current\
    \ value of a is first increased and then used in the expression. With the operation\
    \ b-- the current value of b is first used and then its value is decremented by\
    \ 1. Finally, with the operation --c the value of c is first decreased and then\
    \ used in the expression.\n\nTherefore, the result of (++a)-(b--)+(--c) is 2-2+2=2\
    \ and the values of a, b, and c become 2, 1, and 2, respectively."
