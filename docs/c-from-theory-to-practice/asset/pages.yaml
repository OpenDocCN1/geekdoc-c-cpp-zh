    \ with '\\0'.\n\n# strcpy() Function\n\nThe strcpy function is declared in string.h,\
    \ like this:\n\n```\nchar *strcpy(char *dest, const char *src, size_t count);\n\
    ```\n\nstrcpy() is similar to strcpy(), with the difference that only the first\
    \ count characters of the string pointed by src be copied into dest.\n\nIf the\
    \ value is less than or equal to the length of the string src points to, a null\
    \ character won't be appended to the memory to dest. If it is greater, null characters\
    \ are appended, up to the value of count.\n\n> To avoid a case of memory overwrite,\
    \ use strcpy() instead of strcpy because strcpy() specifies the maximum number\
    \ of copied characters.\n\nHere's an example of how to use strcpy().\n\n```\n\
    #include <stdio.h>\n#include <string.h>\nint main ({\n    char str1[] = \"Old\
    \ text\";\n    char str2[] = \"New\";\n    char str3[] = \"Get\";\n    strcpy(str1,\
    \ str2, 3);\n    printf(\"%s\\n\", str1);\n    strcpy(str1, str3, 5);\n    printf(\"\
    %s\\n\", str1);\n    return 0;\n}\n```\n\nSince the number 3 is less than the\
    \ length of the string stored in str2, the first strcpy copies the first 3 characters\
    \ into str1 and doesn't append a null character. Therefore, the program displays\
    \ New text.\n\nSince the number 5 is greater than the length of the string stored\
    \ into str3, the second strcpy copies three characters from str3 into str1 and\
