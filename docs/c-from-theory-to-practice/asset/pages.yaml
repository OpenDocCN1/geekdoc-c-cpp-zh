  md: '# Loops


    ```

    for(i = 2; i < 7; i+=3);

    printf("%d\n", i);

    return 0;

    }

    ```


    As with the if statement, the semicolon at the end of the for statement or the
    following line indicates a null statement, a statement that does nothing. Therefore,
    the compiler assumes the loop body is empty and the printf() will be executed
    only once, after the condition i < 7 becomes false. Let''s trace the iterations:


    +   * First iteration. Since i is 2, the condition i < 7 (2 < 7) is true. Since
    the loop body is empty, the next statement to be executed is i+=3 (i = i+3 = 2+3
    = 5).

    * Second iteration. Since i is 5, the condition i < 7 (5 < 7) is true and the
    statement i+=3 makes the value of i to 8.

    * Third iteration. Since i is 8, the condition i < 7 (8 < 7) becomes false and
    the for statement ends.


    Then, the printf() is executed and the program outputs 8.


    # Omitting Expressions


    The three expressions of a for statement are optional. In fact, C allows us to
    omit any or all of them. For example, in the following listing, because a is initialized
    before the for statement, the first expression can be omitted:


    ```

    int a = 0;

    for(; a < 5; a++)

    ```


    Notice the semicolon before the second expression must be present. In fact, the
    two semicolons must always be present if both the first and second expressions
    are omitted.


    In the same way, we can pull the third expression in the loop body and remove
    it from the for statement. For example, in the following listing, the third expression
    a++ is moved inside the body:


    ```

    for(a = 0; a < 5);

    {

    printf("%d ", a);

    a++;

    }

    ```


    If the conditional expression is missing, the compiler treats it as always true,
    and the for loop never ends. Such a loop is called infinite. For example, this
    for statement creates an infinite loop:


    ```

    for(a = 0; ; a++)

    ```


    Most programmers omit all three expressions in order to create an infinite loop:


    ```

    for(;;)

    ```'
