  md: "The % operator is used to find the remainder of the division of two integer\
    \ operands.\nBoth operands should be integers or the program won't compile.\n\n\
    # Increment and Decrement Operators\n\nThe increment operator ++ is used to increment\
    \ the value of a variable by 1. It can be added\nbefore (prefix) or after (postfix)\
    \ the variable's name. Both forms increment the variable by\none, but they do\
    \ so at different times. For example,\n\n```\n#include <stdio.h>\nint main()\n\
    {\n    int a = 4;\n    a++; /* Equivalent to a a = a+1; */\n    printf(\"%d\\\
    n\", a);\n    return 0;\n}\n```\n\nThis code outputs 5 since the statement a++\
    \ is equivalent to a = a+1.\nWhen the ++ operator is used in postfix form, the\
    \ increment is performed after the cur-\nrent of the variable is used in the expression.\
    \ For example,\n\n```\n#include <stdio.h>\nint main()\n{\n    int a = 4, b;\n\
    \    b = a++;\n    printf(\"a = %d b = %d\\n\", a, b);\n    return 0;\n}\n```\n\
    \nThe statement b = a++; stores the current value of a into b first and then increments\
    \ the\nvalue of a by 1. As a result, the program displays a = 5 b = 4.\nIf used\
    \ in the prefix form, the variable's value is immediately incremented, and the\
    \ new\nvalue is used in the evaluation of the expression. For example,\n\n```\n\
    #include <stdio.h>\nint main()\n{\n    int a = 4, b;\n    b = ++a;\n    printf(\"\
    a = %d b = %d\\n\", a, b);\n    return 0;\n}\n```\n\nThe statement b = ++a; immediately\
    \ increments the value of a and then stores that value\nto b. The program displays\
    \ a = 5 b = 5."
