    \            break;\n        }\n        printf(\"End = %d\\n\", i);\n    }\n \
    \   return 0;\n}\n```\n\nAs long as i is not 5, the if condition is false and\
    \ the loop displays the values of i from 1 to 4. When i becomes 5, the break statement\
    \ terminates the for loop and the program continues with the other printf(). Therefore,\
    \ the program displays 1 2 3 4 End = 5.\n\n# continue Statement\n\nThe continue\
    \ statement can be used within a for, while, or do-while loop. The break statement\
    \ completely terminates a loop, the continue statement terminates the current\
    \ loop iteration and continues with the next iteration, skipping the rest of the\
    \ statements in the loop body. For example, consider the following program:\n\n\
    ```\n#include <stdio.h>\nint main() {\n    int i;\n    for(i = 1; i < 10; i++)\
