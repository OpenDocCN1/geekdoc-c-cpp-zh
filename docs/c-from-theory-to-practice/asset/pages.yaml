  md: "# Global Variables\n\nA variable that is declared outside the body of any function\
    \ is called global. The scope of a global variable is extended from the point\
    \ of its declaration to the end of the file in which it is declared. As a result,\
    \ it is visible to all functions that follow its declaration. Typically, when\
    \ many programmers choose to declare it global instead of passing it as an argument\
    \ in function calls.\n\nWhen naming a global variable, choose a descriptive name\
    \ that indicates its role. Don't use meaningless names that are often used for\
    \ local variables, like i. The default value for an uninitialized global variable\
    \ is 0.\n\nThe following program declares the global variable and assigns the\
    \ value 10 to it.\n\n```\n#include <stdio.h>\nvoid add();\nvoid sub();\n\nint\
    \ glob = 10;\n\nint main() {\n  add();\n  printf(\"Val = %d\\n\", glob);\n  sub();\n\
    \  printf(\"Val = %d\\n\", glob);\n  return 0;\n}\n\nvoid add() {\n  glob++;\n\
    }\n\nvoid sub() {\n  glob--;\n}\n```\n\nSince glob is visible to all functions,\
    \ they may access it. Therefore, the program displays\n\nVal = 11\nVal = 10.\n\
    \nA local variable is different from a global variable even if they are named\
    \ the same. For example,\n\n```\n#include <stdio.h>\nvoid test();\nint a = 100;\n\
    \nint main() {\n  test();\n  printf(\"Val = %d\\n\", a);\n  return 0;\n}\n```"
