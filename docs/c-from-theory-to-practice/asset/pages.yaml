  md: "# 32 C: From Theory to Practice\n\nWhen scanf() is used to read numeric values,\
    \ it skips all white-space characters (i.e., space, tab, or new line character)\
    \ before the values it reads.\n\nThe & character that usually precedes the name\
    \ of a variable is called the address operator, and it indicates the memory location\
    \ in which the input number will be stored. We'll talk much more about the & operator\
    \ when discussing pointers in Chapter 8.\n\nThe new line character ('\\n') that\
    \ is generated when the Enter key is pressed is left in stdin, and it will be\
    \ the first character read in call scanf().\n\nIn the following example, we use\
    \ scanf() to read an integer and a float number from the keyboard and store them\
    \ in variables i and j, respectively. The first argument is the format string\
    \ %d%%f, while the next arguments are the memory addresses of i and j. The %d\
    \ corresponds to the address of i, while the %f corresponds to the address of\
    \ j.\n\n```\nint i;\nfloat j;\nscanf(\"%d%%f\", &i, &j);\n```\n\nWhen scanf()\
    \ is used to read more than one number, a white-space character is used to separate\
    \ the input values. So, in the previous example, if the user enters the values\
    \ 10 and 4.65 by one or more spaces and presses Enter, the value of j will become\
    \ 4.65.\n\nIf precision is critical in your program, use a double variable (instead\
    \ of float) to store the input value and use the %lf to read it (instead of %f).\
    \ For example, consider the following program:\n\n```\n#include <stdio.h>\nint\
    \ main() {\n  float a;\n  printf(\"Enter number: %%f\", &a);\n  scanf(\"%%f\\\
    n\", &a);\n  printf(\"%%f\\n\", a);\n  return 0;\n}\n```\n\nBecause the float\
    \ data type may not always represent float numbers precisely, the program may\
    \ not display the input value, but a value close to it. It is much safer to declare\
    \ a as double and use the %lf to read it.\n\nprintf() uses the %f specifier to\
    \ display the value of either double or float type variables, but when reading\
    \ a floating point number use the %lf specifier to store it in a double variable\
    \ and the %f specifier to store it in a float variable.\n\nJust when reading numeric\
    \ values, we can use scanf() to read characters. The following example uses scanf()\
    \ to read a single character and store it in variable ch:\n\n```\nchar ch;\nscanf(\"\
    %c\", &ch);\n```"
