  md: "```\nprintf(\"%d \\ a);\n}\nreturn 0;\n}\n```\n\nLet's see what happens when\
    \ the for statement is executed:\n\n+   1. The statement a = 0; is executed.\n\
    2. The condition a < 5 is checked. Since it is true, printf() is executed and\
    \ the program displays 0.\n3. The a++ statement is executed and a becomes 1. The\
    \ condition a < 5 is checked again. Because it is still true, printf() is executed\
    \ and the program displays 1.\n\nSo far, the program has displayed 0 and 1. This\
    \ process is repeated until a becomes 5 at which point the condition a < 5 becomes\
    \ false and the for loop terminates. Each iteration prints the current value of\
    \ a.\nAs a result, the output of the aforementioned listing would be 0 1 2 3 4.\n\
    As with the if statement, if the loop body consists of a single statement, the\
    \ braces are omitted. In other words, the for loop could be written as\n\n```\n\
    for(a = 0; a < 5; a++)\nprintf(\"%d \\ a);\n```\n\nNow, what would the following\
    \ code output?\n\n```\nfor(a = 0; a > 1; a++)\n{\n  printf(\"%d\\n\", a);\n  printf(\"\
    End\\n\");\n}\n```\n\nHere, a is 0, the value of the condition a > 1 is false\
    \ and nothing would be displayed. Expressions in the for statement can contain\
    \ more than one statement when we use the comma (; ) operator. For example,\n\n\
    ```\nint a, b;\nfor(a = 1, b = 2; b < 10; a++, b++)\n```\n\nHere, the first expression\
    \ assigns values to both a and b, and the last one increases both of their values.\n\
    \n> As with if statement, a common error is to add accidentally a semicolon (;)\
    \ at the end of the for statement.\n\nFor example, let's see the following program:\n\
    \n```\n#include <stdio.h>\nint main()\n{\n  int i;\n```\n\n![](img/ffccba03b2ad97b0bbffe904cf6d20db_109_0.png)"
