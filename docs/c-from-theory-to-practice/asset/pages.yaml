  md: "# # 16\n# Preprocessor Directives and Macros\n\nPreprocessor is the part of\
    \ the compiler that processes a C program before its compilation. In this chapter,\
    \ we will discuss how to define and use macros in a C program and we'll present\
    \ preprocessor directives that support the conditional compilation of a C program.\n\
    \n# ## Simple Macros\n\nIn previous chapters, we have used the #define directive\
    \ to define a simple macro, which is a symbolic name associated with a constant\
    \ value. To define a simple macro, we write\n\n```\n#define macro_name replacement_characters\n\
    ```\n\nTypically, most programmers choose capital letters to name a macro in order\
    \ to distinguish them from program variables. The usual practice is to define\
    \ all macros with global scope at the top of the program, or in another file,\
    \ which must be included in the program with the #include directive. However,\
    \ a macro can be defined anywhere in the program, even inside a function. For\
    \ example, in the following program,\n\n```\n#include <stdio.h>\n#define NUM 200\n\
    int main() {\n    int i, arr[NUM];\n    for (i = 0; i < NUM; i++)\n        arr[i]\
    \ = i + NUM;\n    return 0;\n}\n```\n\nthe preprocessor replaces each appearance\
    \ of NUM with its defined value, that is, 200.\nA common mistake is to add the\
    \ = symbol in a macro definition. For For example, if we write\n\n```\n#define\
    \ NUM = 200\n```\n\nthe program won't compile because the definition of arr would\
    \ expand to arr[=200]. Another common error is to add a semicolon at the end of\
    \ the macro definition. For example, if we write\n\n```\n#define NUM 200;\n```\n\
    \nthe definition of arr would expand to arr[200]; and the compiler would raise\
    \ an error message."
