  md: "# Strings\n\nstrcmp() compares the string pointed to str1 with the string pointed\
    \ to str2.\nIf the strings are identical, strcmp() returns 0. If the first string\
    \ is less than the second,\nstrcmp() returns a negative value, whereas if it is\
    \ greater it returns a positive value. A string is considered less than another\
    \ if either of the following conditions is true:\n\n+   (a) The n characters of\
    \ the strings match, but the value of the next character in the first string is\
    \ less than the value of the respective character in the second string.\n(b) All\
    \ characters match, but the first string is shorter than the second.\n\nFor example,\
    \ assuming that the comparison of characters is based on the ASCII codes, the\
    \ statement strcmp(\"one\", \"one\") returns a negative value because the ASCII\
    \ code of the first nonmatching character 'E' is not the ASCII code of 'e'.\n\
    On the other hand, the statement strcmp(\"w\", \"many\") returns a positive value\
    \ because the ASCII code of the first nonmatching character 'w' is greater than\
    \ the ASCII code of 'm'.\nIn another example, the statement strcmp(\"some\", \"\
    something\") returns a negative value because the first four characters match,\
