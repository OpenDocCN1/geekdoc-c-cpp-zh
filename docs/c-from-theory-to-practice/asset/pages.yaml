  md: "# Functions\n\n```\nvoid test()\n{\n    int a;\n    a = 2000;\n}\n```\n\nSince\
    \ the variable declared in test() is different from the global variable a, any\
    \ changes in the value of a inside test() don't affect the value of the a and\
    \ vice versa. Therefore, the program displays Val = 100.\n, the source code of\
    \ a large program is split in several files. In that case, if a global variable\
    \ is declared in one file and another source file needs to access it, declare\
    \ it as extern in second file. For example, the statement\n\n```\nextern int size;\n\
    ```\n\ninforms the compiler that the variable size isn't declared in that file\
    \ but in another file. Since the compiler is informed that the variable is declared\
    \ elsewhere, it doesn't allocate extra memory to store it. In fact, the word extern\
    \ enables several source files to share the same variable.\n\n# Static Variables\n\
    \nAs discussed, the memory that is allocated to store the local variables is deallocated\
    \ when the function terminates. Therefore, there is no guarantee that a local\
    \ variable would still have its old value when the function is called again.\n\
    \nTo force a local variable to retain its value, declare it as static. Unlike\
    \ ordinary local variables, a static variable resides at the same memory location\
    \ throughout program execution and the memory is not deallocated when the function\
    \ returns. Therefore, a static variable retains its last value.\n\nA static variable\
    \ is initialized only once, the first time that the function is called. If it\
    \ is not initialized with a specific value, it is automatically assigned the value\
    \ 0. In next calls of the function, it retains its last value and it isn't initialized\
    \ again. Consider the following example:\n\n```\n#include <stdio.h>\n\nvoid test();\n\
    \nint main()\n{\n    test();\n    test();\n    test();\n    return 0;\n}\n\nvoid\
    \ test()\n{\n    static int i = 100;\n    int j = 0;\n\n    i++;\n    j++;\n \
    \   printf(\"%d %d\\n\", i, j);\n}\n```"
