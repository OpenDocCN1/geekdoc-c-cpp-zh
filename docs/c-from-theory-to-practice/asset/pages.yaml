  md: '# 8


    # Pointers


    Pointers are the most important, but also the most difficult, part of C. This
    chapter mainly uses pointers to arithmetic variables to introduce you to the pointer
    concepts. It also describes the close relationship between pointers and arrays.
    You''ll also learn how to use arrays of pointers and pointers to functions. such
    as pointers as arguments in functions, as well as pointers to other type of data,
    will be gradually presented over the next chapters.


    # Pointers and Memory


    The computer''s RAM (random access memory) consists of millions of successive
    storage cells, called bytes. Each byte stores eight bits of information and is
    identified by a unique number, called memory address. For example, in a computer
    with n bytes, the memory address of each byte is a unique number from 0 to n-1,
    as shown in Figure 8.1.


    When a variable is declared, the compiler reserves the required consecutive bytes
    to store its value. If a variable occupies more than one byte, the variable''s
    address is the address of the first byte.


    For example, with the declaration int a = 10; the compiler reserves four consecutive
    bytes (e.g., 5000-5003 as shown in Figure 8.1) and stores the value 10 (assuming
    that the less significant byte of the value is stored in the lower address byte).


    The compiler associates the name with its memory address. When the program uses
    the variable a, the compiler accesses its address. For example, with the statement
    a = 200; the compiler knows that the memory address of a is 5000 and sets its
    content to 200.


    # Declaring Pointers


    A pointer variable is a variable that can hold the memory address of another variable.
    When we store the address of a variable in a pointer variable, we say that it
    "points to" the variable. To declare a pointer, we write


    ```

    data_type *pointer_name;

    ```


    The data_type defines the type of the variable that the pointer points to. The
    operator defines that the variable is a pointer. For example, with the declaration


    ```

    int *ptr;

    ```'
