  md: 'The fwrite() function returns the number of the elements actually written in
    the file. If the return value equals the third argument, it implies that the fwrite()
    was executed successfully. If not, a write error occurred.


    # fread() Function


    Like fwrite(), fread() is very useful for reading large blocks of data in a single
    step. It is declared in stdio.h, like this:


    ```

    int fread(void *buf, size_t size, size_t count, FILE *fp);

    ```


    The first argument points to the memory in which the read data will be stored.
    Like fwrite()''s arguments, the second argument specifies the size of one element
    in bytes, while the third specifies how many elements will be read from the file.

    The fread() returns the number of elements actually read from the file. Like fwrite(),
    this value should be tested against the third argument. If they are equal, fread()
    was executed successfully. If not, either the end of the file is reached or a
    read error occurred.


    In the following example, a double number is read and stored into a.


    ```

    double a;

    fread(&a, sizeof(double), 1, fp);

    ```


    As another example, 1000 integers are read and stored into array arr.


    ```

    int arr[1000];nfread(&arr, sizeof(int), 1000, fp);

    ```


    > It is safe to use fwrite() and fread() with binary and not text files because
    new line character translations can produce unexpected results.

    For example, suppose that we use fwrite() to write a string of 50 characters in
    a text file and the value of count is set to 50. If the program runs in Windows
    and the string contains new line character(s), the replacement(s) with the \r\n
    pair would make its size more than 50, therefore the fwrite() won''t write the
    entire string.


