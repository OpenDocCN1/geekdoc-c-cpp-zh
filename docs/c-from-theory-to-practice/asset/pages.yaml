  md: '# C From Theory to Practice


    Designed for a compulsory fundamental course, C: From Theory to Practice uses
    a hands-on approach to teach the C programming language, using numerous examples
    and a clear, concise presentation. Easy to use and classroom tested, this textbook
    includes more than 500 exercises and examples of progressive difficulty to help
    students in understanding all the aspects and peculiarities of C. The exercises
    test students on various levels of programming, and the examples enhance their
    concrete understanding of know-how. Divided into three parts, this book:


    +   - Introduces the basic concepts of C, like getting input from a user, C''s
    operators, selection statements, and loops.

    - Emphasizes major features of C, such as arrays, pointers, functions, and strings.

    - Covers advanced topics, such as like searching and sorting arrays'' algorithms,
    structures and unions, memory management, the preprocessor, and files.


    The book tests the skills of beginners and advanced developers by providing an
    easy-to-read compilation of the C theory enriched with tips and advice as well
    as difficulty-scaled solved programming exercises. It decodes the secrets of the
    C language, providing inside information and programming knowledge through practical
    examples and meaningful advice. The examples are designed to be short, concrete,
    and substantial, quickly giving students the know-how they need.


