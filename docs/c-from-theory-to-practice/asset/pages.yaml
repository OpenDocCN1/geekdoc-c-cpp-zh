    \ terminate abnormally and the message \"Stack overflow\" may appear.\n\nThis\
    \ situation may occur when a function allocates large blocks of memory and calls\
    \ other nested functions that also have big memory needs. For example, a recursive\
    \ function that calls itself many times may cause the exhaustion of the available\
    \ stack memory.\n\n# Dynamic Memory Allocation\n\nIn dynamic allocation, the memory\
    \ can be allocated during program execution. That memory is allocated from the\
    \ heap and its size, unlike static allocation, isn't fixed; it may shrink or grow\
    \ according to the program's needs.\n\nTypically, the default stack size isn't\
    \ very large. For example, the following program may not run because of unavailable\
    \ stack memory:\n\n```\n#include <stdio.h>\nint main()\n{\n    int arr[10000000];\
    \ /* Static allocation. */\n    return 0;\n}\n```\n\nOn the other hand, the size\
    \ of the heap is usually much larger than the stack size. For example, if we use\
    \ dynamic allocation, the same memory would be successfully allocated:\n\n```\n\
    #include <stdio.h>\n#include <stdlib.h>\nint main()\n{\n    int *arr;\n    arr\
    \ = (int *) malloc(10000000*sizeof(int));\n}\n```"
