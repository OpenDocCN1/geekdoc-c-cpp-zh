    One\\n\");\n        else\n            printf(\"Two\\n\");\n    return 0;\n}\n\
    ```\n\nTo test a series of if statements and stop when a condition is true, use\
    \ nested if statements, like this (the comments label the blocks of statements):\n\
    \n```\nif (condition_A)\n{\n    /* block of statements A. */\n}\nelse if (condition_B)\n\
