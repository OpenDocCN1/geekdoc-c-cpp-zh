  md: "# fcanf() Function\n\nThe fscanf() function is used to read a variable number\
    \ of different data items from an input file. Like scanf(), fscanf() uses a format\
    \ string to define the order and the type of data that will be read from the file.\n\
    \n```\nint fscanf(FILE *fp, const char *format, ...);\n```\n\nThe only difference\
    \ between them is that scanf() always reads from stdin, while fscanf() reads from\
    \ the file indicated by fp.\nfscanf() returns the number of data items that were\
    \ successfully read from the file and assigned to program variables. If either\
    \ the end of file is reached or the read operation failed, it returns EOF. We'll\
    \ see that we can use eof() to determine which one happened.\n\nThe following\
    \ program assumes that the test.txt text file contains the annual temperatures\
    \ in an area. It reads and displays those within [-5,5].\n\n```\n#include <stdio.h>\n\
    #include <stdlib.h>\nint main() {\n    FILE *fp;\n    int ret;\n    double temp;\n\
    \    fp = fopen(\"test.dat\", \"r\");\n    if (fp == NULL) {\n        printf(\"\
    Error: File can't be loaded\\n\");\n        exit(1);\n    }\n    while (1) {\n\
    \        ret = fscanf(fp, \"%lf\", &temp); /* Since fscanf() reads one item, the\
    \ return value 1 implies that the value was successfully read and assigned to\
    \ temp. */\n        if (ret != 1) /* We could omit ret and write if (fscanfcan(fp,\
    \ \"%lf\", &temp) != 1) */\n            break;\n        }\n        if (temp >=\
    \ -5 && temp <= 5) {\n            printf(\"%f\\n\", temp);\n        }\n    }\n\
    \    fclose(fp);\n    return 0;\n}\n```\n\nWe could also put the fscanf() into\
    \ the while statement and write it like this:\n\n```\nwhile (fscanf(fp, \"%lf\"\
    , &temp) == 1)\n```\n\nA matter of style, we prefer the while(1) statement to\
    \ make clearer the terminating condition of the loop."
