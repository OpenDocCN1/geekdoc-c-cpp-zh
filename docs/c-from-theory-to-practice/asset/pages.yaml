  md: "# Function Call with Parameters\n\nA call to a function that takes parameters\
    \ is made by writing the function followed by a list of arguments, enclosed in\
    \ parentheses. The difference between parameters and arguments is that the term\
    \ parameter refers to the variables that appear in the definition of the function\
    \ while the term argument refers to the expressions that appear in the function\
    \ call. For example, consider the following program:\n\n```\n#include <stdio.h>\n\
    \nint test(int x, int y);\n\nint main()\n{\n    int sum, a = 10, b = 20;\n   \
    \ sum = test(a, b); /* The variables a and b become the function's arguments.\
    \ */\n    printf(\"Sum = %d\\n\", sum);\n    return 0;\n}\n\nint test(int x, int\
    \ y/* The variables x and y are called parameters. */\n{\n    return x+y;\n}\n\
    ```\n\nThe argument can be any valid expression, such as constant, variable, math,\
    \ or logical expression, even another function with a return value.\n\nWhen a\
    \ function is called, the number of the arguments and their types should match\
    \ the number and the types of the corresponding parameters in the function definition.\
    \ If the arguments are less, the compiler will raise an error message.\n\nIf the\
    \ types of the arguments do not match the types of the parameters, the compiler\
    \ will try to convert the mismatch arguments to the types of the corresponding\
    \ parameters. If it succeeds, the compiler may display a warning message to inform\
    \ the programmer for the type conversion. If not, it will raise an error message.\n\
    \nFor example, suppose that the test() function of the aforementioned program\
    \ is called like this:test(10, b).`\n\nSince the type of the first parameter is\
    \ int, the compiler will pass the value 10 to test() and be compiled.\n\nLet's\
    \ see in detail what happens when test() is called. The arguments are evaluated\
    \ and its values are assigned one-to-one to the corresponding function's parameters.\
    \ Essentially, each parameter is a variable that is initialized with the value\
    \ of the corresponding argument.\n\nTherefore, the values of x and y are initialized\
    \ with the values of a and b (10 and 20), respectively. Figure 11.1 assumes some\
    \ arbitrary values to show what happens in the memory when test() is called.\n\
    \nWhen the program is executed, the compiler reserves eight bytes (i.e., 100-107)\
    \ to store the values of the integers x and y. When test() is called, the compiler\
    \ reserves another eight bytes (i.e., 2000-2007) to store the values of the integers\
    \ x and y. Then, it copies the values of the arguments a and b in the corresponding\
    \ locations of the parameters x and y.\n\nSince the memory locations of x and\
    \ y are different from those of a and b, any changes in the values of x and y\
    \ do not affect the values of a and b. When test() terminates, the memory reserved\
    \ for x and y is deallocated automatically."
