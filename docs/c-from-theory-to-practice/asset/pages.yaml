  md: "# Getting Input with scanf()\n\nIn the following example, we use scanf() to\
    \ read a string, a series of characters, and store it in the str array:\n\n```\n\
    char str[100];\nscanf(\"%s\", str);\n```\n\nIf the user enters letters This is\
    \ s-a-m-p-l-e will be stored in the respective elements of the str array. The\
    \ value of str[0] will be 's', str[1] will be 'a', and so on.\nNotice that the\
    \ address operator & does precede the str since the name of an array may be used\
    \ as a pointer to the memory address of its first element. We'll discuss the relationship\
    \ between arrays and pointers in Chapter 8.\n\nFor now, remember that the & operator\
    \ should always precede the address of a numeric variable (such as int, short,\
    \ float, and so on). If you forget the & operator, the program will behave unpredictably\
    \ and may crash. On the other hand, be sure not to add the & when using pointer\
    \ variables.\n\n![](img/ffccba03b2ad97b0bbffe904cf6d20db_52_0.png)\n\nIf the string\
    \ contains multiple words (such as This is multiple), only the first word will\
    \ be stored into str because scanf() is used to read characters it stops reading\
    \ it encounters a white-space character. (If you were to write scanf(\"%[\\n\"\
    , str); it would read multiple words.) The format string scanf() can take forms,\
    \ but a detailed description of scanf() capabilities is beyond the scope of this\
    \ book.\n\n# Use of Ordinary Characters\n\nIn its simplest form, the format string\
    \ (such as \"%d\") does not contain other conversion characters. If you add any\
    \ characters, they must also be entered by the user in the same expected location.\
    \ If the characters don't match, scanf() aborts reading. For instance, the note\
    \ between the %d specifiers in following\n\n```\n#include <stdio.h>\nint main()\
    \ {\n int a, b;\n scanf(\"%d,%d\\n\", a, b);\n return 0;\n}\n```\n\nIn this case,\
    \ the user should also add a comma between the values (such as 12,43) or scanf()\
    \ will fail and the program won't display the expected values. If the values were\
    \ separated by the character 'm' instead of the comma, as %dm%d, the user should\
    \ also add an 'm' between the values (such as 12m43).\n\nIn another example, if\
    \ a program asks the user to enter a date using / to separate the values, the\
    \ format string should be \"%d/%d/%d\" and the user must enter the date in that\
    \ form (e.g., 3/8/2020).\n\n# scanf() Return Value\n\nA function may return a\
    \ value to the calling program, and scanf() returns the number of data items that\
    \ were successfully converted and assigned to program variables. scanf() fails\
    \ if the values entered don't match the types or order of the conversion specifiers."
