    \ 0;\n}\nvoid test(int a) {\nprintf(\"Val = %d\\n\", 2*a);\n```\n\n> As the name\
    \ of an array can be used as a pointer, a function's name can be used as a pointer\n\
    to its address.\n\nTherefore, with the statement ptr = test; ptr points to the\
    \ address of the test() func-\ntion statement ptr = test; is allowed because the\
    \ declaration of ptr matches the\ndeclaration of test().\nThe function's call\
    \ through a pointer can be done either like an ordinary call or use the\n* operator.\
    \ For example, both statements\nptr(10); and (*ptr)(10); call test() and the program\
