  md: '# Program Control


    Several conditional expressions may be merged by replacing the expression that
    follows the colon:) with another conditional expression. Next, exp3 is replaced
    with the add1 ? add2 : add3; expression as shown here:


    ```

    k = exp1 ? exp2 : add1 ? add2 : add3;

    ```


    If exp1 is true, k will be equal to the value of exp2 expression. If exp1 is false,
    the value of add1 is checked. k will be equal to the value of add2. Otherwise,
    it will be equal to the value of add3. The equivalent chain of if-else statements
    is


    ```

    if (exp1)

    k = exp2;

    else if (add1)

    k = add2;

    else

    k = add3;

    ```


