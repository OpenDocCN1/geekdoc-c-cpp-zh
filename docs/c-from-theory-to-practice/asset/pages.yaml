    \ when we want to test the value of an expression against a series of values and\
    \ handle each case differently. The general form of the switch statement\n\n```\n\
    switch(expression)\ncase constant_1:\n    /* block of statements, which will be\
    \ executed if the value of expression is equal to constant_1. */\n    break;\n\
    case constant_2:\n    /* block of statements, which will be executed if the value\
    \ of expression is equal to constant_2. */\n    break;\n...\ncase constant_n:\n\
    \    /* block of statements, which will be executed if the value of expression\
    \ is equal to constant_n. */\n    break;\ndefault:\n    /* block of statements,\
    \ which will be executed if the value of expression is not equal to any of the\
    \ pre-mentioned constants. */\n    break;\n```\n\nThe expression must be an integer\
    \ variable or expression, and the values of all constant_1, constant_2..., constant_n\
    \ must be integer constant expressions with different values.\nWhen the switch\
    \ statement is executed, the value of expression is compared with constant_1,\
    \ constant_2..., constant_n in sequence. If a match is found, the group of statements\
    \ of the matching case will be executed and the rest of the case clauses will\
    \ not be checked. If the value of expression does not match any of the choices,"
