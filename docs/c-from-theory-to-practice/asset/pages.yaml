  md: '# 11


    # Functions


    In C, a function is an independent block of code that performs a specific task
    when called, and it may return a value to the calling program. Each function is
    essentially a small program, with its own variables and statements. A program
    is divided into smaller parts using functions, making it easier to understand,
    modify, and control. Another benefit of functions is that they are reusable. For
    example, the `printf()` and `scanf()` functions can be used in every C program.


    Up to this point, we''ve written just one function, the `main()`. In this chapter,
    you''ll learn how to declare and use your own function within your programs.


    # Function Declaration


    A function declaration or function prototype specifies the name of the function,
    its return type, and list of parameters. The general form of function declaration
    is


    ```

    return_type function_name(parameter_list);

    ```


    Try to choose descriptive names for your functions. It''s much easier to read
    the code of when its name indicates its role. For example, if you write a function
    that calculates the sum of some numbers, name something like `sum` rather than
    an arbitrary name like `func`, `test`, or `lara`.


    Usually, the declarations of functions are put in a separate file. For example,
    the prototypes of C functions reside in header files. For each library function
    used, the program should use the `#include` directive to add the file that contains
    the declaration of the function. For example, the declarations of `printf()` and
    `scanf()` functions reside in `stdio.h`, which is included in the program with
    `#include <stdio.h>` line.


    For the sake of simplicity, we''ll declare our own functions in the same file
    with `main()`.


    # Return Type


    A function may return one value at most. The `return_type` specifies the type
    of the value that the function returns. A function may return any type of variable,
    except arrays. If the return type is missing, it is presumed to return a value
    of type `int`. To indicate that a function doesn''t return any value, the return
    type should be set to `void`.'
