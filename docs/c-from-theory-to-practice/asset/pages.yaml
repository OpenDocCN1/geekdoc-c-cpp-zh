    x is zero\\n\");\n```\n\n# Common Errors\n\nA common error is to add a semicolon\
    \ (;) at the end of the if statement, as you usually do with most statements.\
    \ The semicolon is handled as a statement that does nothing (null statement) and\
    \ the compiler terminates the if. For example, in the following code,\n\n```\n\
    int x = -3;\nif(x > 0);\nprintf(\"x is positive\\n\");\n```\n\n; terminates the\
    \ if statement and the program continues with the printf() call. Therefore, the\
    \ output is always x positive regardless of the x.\n\nAnother common error is\
    \ to confuse the == with = operator inside an if condition. Remember that the\
    \ == operator checks whether two expressions have the same value, while the =\
    \ operator assigns a value to a variable. For example, this code\n\n```\nint x\
    \ = -3;\nif(x = -2)\nprintf(\"x equals -2\\n\");\n```\n\nx equals -2, although\
    \ x is -3. If we had if(x == -2) nothing would have displayed. The following code\n\
    \n```\nint x = 0;\nif(x = 0)\nprintf(\"x equals zero\\n\");\n```\n\ndisplays nothing\
    \ since the assignment of 0 in x makes the condition false.\n\n# if-else Statement\n\
    \nAn if statement may have an else clause, as shown here:\n\n```\nif(condition)\n\
    {\n  /* block of statements A. */\n}\n```"
