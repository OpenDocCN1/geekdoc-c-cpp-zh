  md: '# Common Errors


    The most common errors are syntactic. For example, if you don''t add the semicolon
    at the end of printf() or you omit a parenthesis or a double quote, the compilation
    would fail and the compiler would display error messages.

    Spelling errors are very common, as well. For example, if you write studio.h instead
    of stdio.h or instead of printf(), the compilation would fail.

    C is a case-sensitive language, meaning that it distinguishes between uppercase
    and lowercase letters. For example, if you write Printf instead of printf(), the
    compilation would fail.

    If the compiler displays many errors, fix the one and recompile the program. The
    new compilation may display lesser errors, even none. Also, notice that an error
    detected by the compiler may not occur in the indicated line, but in some previous
    line.

    It is very important to understand that the compiler detects errors due to the
    wrong use of the language and not logical errors that may exist within your program.
    The compiler is "inside your head" to mean what you intend to do. Therefore, a
    successful compilation doesn''t mean that your program would operate as you expect.
    For example, if you want to write a program that displays a message if the value
    of the integer variable a is greater than 5, and you write


    ```

    if (a < 5)

    printf("One");

    ```


    then, although these lines will be compiled successfully, the program won''t display
    One. This type of error is a logical error (bug) not detected by the compiler.
    The use of the word bug as a synonym of a programming error is credited to the
    great American mathematician and scientist Grace Hopper, when she discovered a
    hidden bug inside her computer caused its abnormal operation.

    Apart from the error messages, the compiler may display warning messages. If there
    are only warning messages, the program will be compiled. However, don''t ignore
    them; it may warn you about the potential malfunction of your program.


    # Linking


    In the final step, the object code produced by the compiler is linked with the
    code of the library functions (like printf()) that the program uses.

    If the linking is successful, an executable file is created. For example, the
    default name of the executable file produced by the gcc compiler is a.out, while
    a Microsoft compiler produces an executable file having the same name with the
    source file and extension .exe.


    # Run the Program


    If the program doesn''t operate as you expect, you are in deep trouble. The depth
    you are depends on the size of the source code. If it extends to hundreds of lines,
    you''ll'
