  md: "# Pointers\n\n169\n\n![](img/ffccba03b2ad97b0bbffe904cf6d20db_188_0.png)\n\n\
    FIGURE 8.2\nArray elements.\n\nFor example, suppose that with the declaration\
    \ int arr[3]; the value of the first element is stored in the address bytes 100–103,\
    \ the value of the second element is stored in 104–107 and the value of the third\
    \ one 108–111, as shown in Figure 8.2.\n\nThe close relationship between pointers\
    \ and arrays is based on the fact that the name of an array can be used as a pointer\
    \ to its first element.\n\nSimilarly, arr+1 can be used as a pointer to the second\
    \ element, arr+2 as a pointer to the third one, and so on. In general, the following\
    \ expressions are equivalent:\n\n```\narr = &arr[0]\narr + 1 == &arr[1]\narr +\
    \ 2 == &arr[2]\n```\n\n```\narr + n == &arr[n]\n```\n\nSince the name of an array\
    \ can be used as a pointer to its first element, its content is equal to the value\
    \ of its first element. Therefore, *arr is equal to arr[0]. Similarly, since arr+1\
    \ is a pointer to the second element, (arr+1) is equal to arr[1], and so on. In\
    \ general, the following expressions are:\n\n```\n*arr == arr[0]\n*(arr + 1) ==\
    \ arr[1]\n*(arr + 2) == arr[2]\n```\n\n```\n*arr + n) == arr[n]\n```\n\nThe parentheses\
    \ are necessary because the * operator has higher precedence than the addition\
    \ operator. Therefore, the expressions *(arr+n) and *arr+n operate differently.\
    \ For example, consider the following program:\n\n```\n#include <stdio.h>\nint\
    \ main() {\n  int *ptr, arr[5] = {10, 20, 30, 40, 50};\n  ptr = arr;\n  printf(\"\
    Val2 = %d\\n\", ptr+2, *(ptr+2));\n  return 0;\n}\n```\n\nWith the statement ptr\
    \ = arr; ptr points to the address of arr[0], so *ptr is equal to arr[0], that\
    \ is, 10. Since the * operator has higher precedence than the + operator, *ptr+2\
    \ = 10+2 = 12."
