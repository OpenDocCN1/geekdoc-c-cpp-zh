    The #ifdef directive is used to check whether an identifier is defined as a macro.
    The #ifdef directive is often used to force the single compilation of a header
    file.


    For example, suppose that a program consists of several sources and some of them
    include the same file, for example, #include "test.h". If the test.h contains
    declarations of variables, the multiple compilation of the test.h would fail because
    re-declaration of the same variables is not allowed. A technique to avoid multiple
    compilation of the same file (e.g., test.h) is to add the following lines at its
    beginning.'
