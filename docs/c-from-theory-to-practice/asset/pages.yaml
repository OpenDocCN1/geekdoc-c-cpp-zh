  md: "# 13\n\n# Structures and Unions\n\nThis chapter introduces two new types: structures\
    \ and unions. Like arrays, structures and unions aggregate a set of values into\
    \ a single entity. However, their properties are quite different from an array’s.\
    \ Unlike arrays, the elements of a structure or union may have different types.\
    \ Furthermore, to access a member of a structure or union, we specify its name,\
    \ and not its position as an integer subscript. This chapter discusses how to\
    \ define structures and unions types, declare variables, and perform operations\
    \ on them.\n\n# Structures\n\nWhen we want to group related data items within\
    \ a single entity, a structure is a typical choice. For example, a structure may\
    \ hold information for a company, such as its name, business core, tax number,\
    \ number of employees, contact information, and other data.\n\n# Defining a Structure\n\
    \nTo define a named structure type, we specify the name of the structure followed\
    \ by its elements enclosed in braces, like this:\n\n```\nstruct struct_name\n\
    {\n  type_1 name_1;\n  type_2 name_2;\n  ;\n  type_n name_n;\n}\n```\n\nThe definition\
    \ of a structure type begins with the struct word and must end with a semicolon.\
    \ A structure may contain elements of different data types. For example, we need\
    \ to store information about a company, we could define a structure type named\
    \ company, like this:\n\n```\nstruct company\n{\n  char name[50];\n  int start_year;\n\
    \  int field;\n  int tax_num;\n  int num_empl;\n  char addr[50];\n  float balance;\n\
    }\n```"
