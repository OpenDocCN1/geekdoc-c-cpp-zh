  md: "# void* Pointer\n\nA pointer of type void* is a generic pointer, in the sense\
    \ that it can point to a variable of any data type. To access the content of a\
    \ memory address pointed by a void* pointer, typecast is necessary. For example,\n\
    \n```\n#include <stdio.h>\nint main() {\n    void *ptr;\n    int i = 10;\n\n \
    \   ptr = &i;\n    *(int*)ptr += 20;\n    printf(\"%d\\n\", i);\n    return 0;\n\
    }\n```\n\nTo access the value of i, typecast ptr to the type of i and the program\
    \ displays 30.\n\n# Use of const Keyword\n\nTo prohibit a pointer from changing\
    \ the value of the variable it points to, add the const keyword before it. For\
    \ example, the following code won't compile because ptr isn't allowed to change\
    \ the value of i. However, it is allowed to point to some other variable.\n\n\
    ```\nint j, i = 10;\nconst int *ptr;\nptr = &i;\n*ptr = 30; /* Not allowed action.\
    \ */\nptr = &j; /* Allowed action.\n```\n\nTo prohibit a pointer from pointing\
    \ to another variable, add the const keyword before its name. For example, the\
    \ following code won't compile because ptr isn't allowed to point to the address\
    \ of j. However, it is allowed to change the value of i.\n\n```\nint i, j;\nint*\
    \ const ptr = &i;\nptr = &j; /* Not allowed action. */\n*ptr = 30; /* Allowed\
    \ action. */\n```\n\n# Pointer Arithmetic\n\nPointer arithmetic refers to the\
    \ application of some arithmetic operations on pointers. The operators that can\
    \ be used in pointer arithmetic are +, --, +, and -, while the allowed"
