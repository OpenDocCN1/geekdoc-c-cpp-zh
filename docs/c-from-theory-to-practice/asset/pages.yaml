  md: '# Conditional Operator ?:


    The conditional operator ?: allows a program to perform one of two actions depending
    on the value of an expression. Expressions that contain the ?: operator have the
    form


    ```

    exp1 ? exp2 : exp3;

    ```


    Since the conditional operator takes three operands, it is often referred to as
    the ternary operator. A conditional expression is evaluated in steps. The expression
    expr is evaluated first. If it is true, exp2 is evaluated and its value becomes
    the value of the conditional expression. If the value of exp1 is false, exp3 is
    evaluated and its value becomes the value of the conditional expression.

    Simply put, a conditional expression is a sort of an if-else statement:


    ```

    if(exp1)

    exp2;

    else

    exp3;

    ```


    For example, the following program reads an integer and if it is greater than
    10 the program displays One, otherwise Two:


    ```

    #include <stdio.h>

    int main() {


    int a;


    printf("Enter number: ");

    ncanf("%d", &a);


    (a > 10) ? printf("One\n") : printf("Two\n");

    return 0;

    }

    ```


    The value of a conditional expression can be stored in a variable, as shown here:


    ```

    int a = 5, k;

    k = (a > 0) ? 100 : -1;

    ```


    First, the expression (a > 0) is evaluated. If it is true, k becomes 100, otherwise
    it becomes -1. Since a is 5, k becomes 100.


    The conditional operator is mostly used to replace simple if-else statements.
    example, the following if-else statement


    ```

    if(a > b)

    max = a;

    else

    max = b;

    ```


    can be replaced with


    ```

    max = (a > b) ? a : b;

    ```'
