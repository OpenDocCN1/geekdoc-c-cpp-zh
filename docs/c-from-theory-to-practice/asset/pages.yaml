  md: '# Files


    # 411


    ```

    long int old_pos;

    /*... open file and do work with it. */

    old_pos = ftell(fp);

    /*... do some other work. */

    fseek(fp, old_pos, SEEK_SET); /* return back to the old position. */

    ```


    It is safer to use fseek() and ftell() functions with binary and not text files
    because new\line characters can produce unexpected results.

    fseek() is guaranteed to work with text files, only if

    a) offset is 0 or

    b) offset is obtained from a previous call to ftell() and origin is set to SEEK_SET.


    # Write and Read Data from a Binary File


    fwrite() and fread() are used to write and read data from a binary file.

    Both are often used to write and read large blocks of data in a single step. These
    functions

    are used primarily with binary files, although with some care we can use them
    with text

    files.


    # fwrite() Function


    fwrite() is very useful for writing large blocks of data in a single step. It
    is

    declared in stdio.h, like this:


    ```

    int fwrite(const void *buf, size_t size, size_t count, FILE *fp);

    ```


    The size_t type is a synonym for unsigned int. The first argument points to the

    memory that holds the data to be written in the file indicated by fp. Since the
    pointer is

    declared as void, any kind of data can be written in the file.

    The third argument specifies how many elements will be written in the file, while

    t second argument specifies the size of one element in bytes. The product of

    the second and third arguments should be equal to the number of bytes to be written

    in the file.


    For example, to write an array of 1000 integers, the second argument should be
    equal to

    the size of one integer, that is, 4, while the third argument should be equal
    to 1000.


    ```

    int arr[1000];

    fwrite(arr, 4, 1000, fp);

    ```


    It is best to use the sizeof operator to specify the size of one element in order
    to make

    your program platform independent. For example,


    ```

    fwrite(arr, sizeof(int), 1000, fp);

    ```


    As another example, the following listing one double number.


    ```

    double a = 1.2345;

    fwrite(&a, sizeof(double), 1, fp);

    ```'
