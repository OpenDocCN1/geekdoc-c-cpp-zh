    {

    n}

    ```


    The word void indicates that the main() function doesn''t return any value. Although
    a C compiler may accept this declaration, it is illegal according to the C standard
    because main() must return a value. On the other hand, the declaration


    ```

    main()

    {

    ...

    }

    ```


    is acceptable because the return type is int by default.

    This declaration is also acceptable:


    ```

    int main(void)

    {

    n}

    ```


    The word void inside the parentheses indicates that main() has no arguments.

    In Chapter 11, we''ll see another declaration of main(), where it accepts arguments.

    As discussed, we may use functions of the standard library in our programs. For
    example, printf() is a standard library function that is used for data output.
