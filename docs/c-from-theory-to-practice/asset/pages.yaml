  md: '# 3


    # Getting Input with scanf()


    This chapter focuses on using the scanf() function to get input from a user, store
    that input in variables, and use it in your programs. scanf() is a powerful function
    that offers many ways to read and store data in program variables. We won''t cover
    every aspect of scanf() but we''ll give you enough of what you need in order to
    use it to read data. In this chapter, we''ll mainly use scanf() to read numeric
    data and store that data in numeric variables. Just remember as you read that
    scanf() is not an easy function to use; it contains several traps, so use it with
    great care.


    # scanf() Function


    scanf() function is used to read data from the standard input stream (stdin) and
    store that data in program variables. By default, the stdin stream is associated
    with the keyboard. The input data are read according to a specified format, very
    similar to the way output is handled with printf().


    The scanf() function accepts a variety of parameters. The first is a format string
    enclosed in double quotes "", followed by the memory addresses of the variables
    in which the input data will be stored.


    Like printf(), the number of conversion specifiers included in the format string
    should equal the number of variables, and the type of each should match the data
    type of the respective variable. The conversion characters used in scanf() are
    the same as those used in printf(). For example, the %d specifier is used to read
    an integer, while %f is used to read a float.


    scanf() reads the input data from stdin, converts it to the conversion specifiers,
    and stores it in the respective variables. The scanf() function stops processing
    the input data once it reads a data item that does not match the type of conversion
    specifier. Any reread input data as well as any nonmatching items are left in
    stdin.


    # scanf() Examples


    In the following example, we use scanf() to read an integer and store it in variable
    i:


    ```

    int i;

    canf("%d", &i);

    ```


    The first argument is the %d conversion specifier, and the second is the memory
    address of i. Once the user enters an Enter, this value will be stored in i.'
