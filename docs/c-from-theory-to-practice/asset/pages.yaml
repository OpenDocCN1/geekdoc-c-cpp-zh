- img_proc: true
  md: '# Variable Name Conventions


    In addition to the rules given earlier, there are a few conventions that are good
    to follow naming your variables. While these aren''t enforced by the C compiler,
    "rules of thumb" will tend to make your programs easier for you to understand,
    as well as for those who have to read your code after you''ve written it:


    +   1. Use descriptive names for variables. It''s much easier to read a program
    when the names of the variables indicate their intent. For example, if you have
    a variable that you plan to use for hold the sum of some even numbers, name that-something
    like sum_even rather than an arbitrary name like i.

    2. When necessary, don''t afraid to use long names to describe the role of a variable.
    If a variable name is several words, separate each word with the underscore character
    (_) for readability. For example, you might call a variable that holds the number
    of books in a calculation number (instead of booksnumber, or something less readable).

    3. By convention, use lowercase letters when naming variables and uppercase letters
    when defining macros and constants. This is a convention that most C programmers
    follow; it is not a requirement.


    # Declaring Variables


    Variables must be declared before being used in a program. Declare a variable
    as follows:


    ```

    data_type name_of_variable;

    ```


    The name _of variable is the variable name. The data _type should be one of the
    C-supported data types, and the int keyword is used to declare integer variables;
    and the float keyword is used to declare floating-point variables; variables that
    can


    Each data type specifies the range of values that may be stored in a variable
    of that type. The actual size of the types may vary from one machine to another.
    Table 2.1 shows the usual ranges on a 32-bit system.


    For example, to declare variables a and b as integer and floating-point variables,
    respectively,


    ```

    int a; /* Declare an integer variable with name a. */

    float b; /* Declare a float variable with name b. */

    ```


    Variables of the same type can be declared in the same line, separated with a
    comma. instead of declaring the variables a, b, and c in three different lines,
    like so


    ```

    int a;

    int b;

    int c;

    ```'
