    # Operator Precedence


    Each operator has a precedence associated with it that determines the order in
    which operators are evaluated in an expression. In an expression that contains
    several operators, the operators with higher precedence are evaluated first. For
    example, since the * operator has higher precedence than the + and -, result of
    7*5-1 is 34.


    When operators of equal precedence appear in the same expression, the operators
    are evaluated according to their associativity. For example, since the + and /
    operators have the same precedence and are left associative, the result of 7+4/2*5
    is 70. The evaluation takes place from left to right, the multiplication (7*4
    = 28) is executed first, then the division (28/2 = 14), and the last multiplication
    (14*5 = 70).


    Appendix A presents the precedence table. Parentheses have the highest precedence,
    so an expression is evaluated before any others. Parentheses may be used in an
    expression to override operator precedence and force some parts of an expression
    to be evaluated before other parts.


    Since it is not easy to memorize the entire precedence table, especially when
    you are unsure of the operator order. use parentheses, when it is not necessary
    to do so, increases the readability of code and clarifies the way that expressions
    are evaluated. For example, it is clearer to write


    ```

    a = 7*(5-3)-1; rather a = 7*5-3;

    ```


