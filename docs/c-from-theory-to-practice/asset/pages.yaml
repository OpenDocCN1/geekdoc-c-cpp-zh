    {\n    float a = 1.2365;\n    \n    printf(\"Val = %f\\n\", a);\n    printf(\"\
    Val = %.2f\\n\", a);\n    printf(\"Val = %.*f\\n\", 3, a);\n    printf(\"Val =\
    \ %.f\\n\", a);\n    return 0;\n}\n```\n\nThe first printf() displays the value\
    \ of a with the default precision of the six digits, that is, Val = 1.236500.\n\
    The second printf() displays the value of a with two precision digits. This value\
    \ is rounded up since the value of the first nondisplayed digit is 6. The program\
