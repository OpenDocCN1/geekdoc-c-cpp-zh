    # Insertion Sort


    To describe the algorithm, we''ll sort an array in ascending order.

    The algorithm is based on sequential comparisons between each element (starting
    from the second and up to the last element) and the elements on its left, which
    form the "sorted subarray". The elements on its right form the "unsorted subarray".

    In particular, the most left element of the "unsorted subarray" (i.e., the examined
    element) is compared against the elements of the "sorted subarray" from right
    to left, according to:


    +   Step 1: At first, it is stored in a temporary variable (Figure 12.1a).

    Step 2a: If it is greater than the most right element of the "sorted subarray",
    its position doesn''t change and the algorithm continues with the testing of the
    next most left element.

    Step 2b: If it is less than the most right element of the "sorted subarray", the
    latter is shifted one position to the right while the examined element is compared
    against the most right but one element (Figure 12.1b and c). If it is greater,
    the examined element is stored at the position of the last shifted element, otherwise
    the same procedure is repeated (the most right but one element is shifted one
    position to the right and the examined element is compared against the most right
    two elements) (Figure 12.1c and d). Step 2b terminates either if the examined
    element is greater than an element of the "sorted subarray" (Figure 12.1d and
    e) or the first element of the "sorted subarray" is reached. Then, Step 1 is repeated
    for the new most left element (Figure 12.1e and f).'
