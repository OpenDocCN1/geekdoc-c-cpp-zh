  md: "# Searching and Sorting Arrays\n\nThe algorithm terminates when the most right\
    \ element of the \"unsorted subarray\" is tested. The algorithm resembles the\
    \ way that a card player would sort a card game, assuming that he starts with\
    \ an empty left hand and all cards face down on the table. The player picks a\
    \ card with his right hand and inserts it in the correct position in the left\
    \ hand. To find the correct position, card is compared against the cards in the\
    \ left hand, from right to left.\n\nTo sort the array in descending order, an\
    \ element of the \"sorted subarray\" is shifted position to the right if it is\
