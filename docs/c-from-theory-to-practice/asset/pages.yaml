    \ Unions\n\nLike a structure, a union consists of one or more fields, which may\
    \ be of different types. Their difference is that the fields of a structure are\
    \ stored at different addresses, while the fields of a union are stored at the\
    \ same address.\n\n# Using Unions\n\nThe definition of a union type resembles\
    \ that of a structure, with the union used instead of struct. When a union variable\
    \ is declared, the compiler allocates memory to store the value of the largest\
    \ field, not for all. Therefore, its fields are stored in the same space, overlapping\
    \ each other.\n\nFor example, in the following program, the s variable allocates\
    \ 8 bytes because its largest field is of type double.\n\n```\n#include <stdio.h>\n\
    union sample\n{\n    char ch;\n    int i;\n    double d;\n};\n```"
