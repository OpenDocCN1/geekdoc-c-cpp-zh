    # #ifdef, #ifdef, and #undef Directives


    The #ifdef directive is used to check if an identifier is defined as a macro.
    The general form is


    ```

    #ifdef macro_name

    ... /* block of statements */

    #endif

    ```


    The difference with the #if directive is that the #ifdef directive only checks
    if the identifier is defined as a macro and does not evaluate its value. For example,


    ```

    #include <stdio.h>

    #define VER_1

    int main() {

    #ifdef VER_1

    printf("Version_1\n");

    #else

    printf("Version_2\n");

