  md: '# 54 C: From Theory to Practice


    applications, such as data coding in communication protocols, data encryption,
    and in low-level applications that communicate with the hardware.


    > When performing bitwise operations, it''s usually safer to declare your variables
    unsigned. If you choose not to, make sure you account for the sign bit when performing
    your calculations.


    # & Operator


    The & operator performs the bitwise AND operation on all corresponding bits of
    its operands. The result is 1 only if both corresponding bits are 1. Otherwise,
    the bit is set to 0. For example, the result of 19 & 2 is 2


    ```

    00100011 (19)

    & 00000010 (2)

    ----------------

    00000010 (2)

    ```


    # | Operator


    The | operator performs the bitwise inclusive OR operation on all corresponding
    bits of its two operands. The result is 0 only if both corresponding bits are
    0. Otherwise, the bit is set to 1. For example, the result of 19 | 6 is 23:


    ```

    00100011 (19)

    | 00000110 (6)

    ----------------

    00100111 (23)

    ```


    # ^ Operator


    The ^ operator performs the bitwise exclusive OR (XOR) operation on all corresponding
    bits of its two operands. The result is 1 only if both corresponding bits are
    different. Otherwise, the bit is set to 0. For example, the result of 19 ^ 6 is
    21:


    ```

    00100011 (19)

    ^ 00000110 (6)

    ----------------

    00100101 (21)

    ```


    # ~ Operator


    The complement operator ~ performs the bitwise NOT operation on all bits of its
    operand. It means that it reverses the 1s to 0s and vice versa. For example, the
    result of ~19 in a 32-bit system is


    ```

    00000000 00000000 00000000 00100011 (19) =

    11111111 11111111 11111111 11010100

    ```'
