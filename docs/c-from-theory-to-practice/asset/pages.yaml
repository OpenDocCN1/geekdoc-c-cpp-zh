    # Bubble Sort


    The sort algorithm is based on sequential comparisons between adjacent array elements.
    Each element "bubbles" up and is stored in the proper position. For example, suppose
    we want to sort in an ascending order.


    At first, the last element is compared against the last one. If it is less, the
    elements are swapped, the smaller value "bubbles" up. Then, the last by one element
    is compared against the last by two. Like before, if it is less, the elements
    are swapped, so the smaller value keeps "bubbling" up up to the beginning of the
    array, and eventually the smallest value "bubbles" to the top of the array and
    is stored at its first position.'
