    \ of data in the file.\n\n```\nint fprintf(FILE* fp, const char *format, ...);\n\
    ```\n\nThe only difference between them is that printf() always writes to stdout,\
    \ while fprintf() writes to the file indicated by fp. In fact, if fp is replaced\
    \ by stdout, a call of fprintf() is equivalent to a call of printf().\n\nThe stdin\
    \ and stdout streams are declared in stdio.h and they are ready to use; it is\
    \ not needed to open or close them. By default, the stdout output stream is associated\
    \ with the keyboard. If fprintf() is executed successfully, it returns the number\
    \ of bytes written in the file, or a negative value.\n\nFor example, the following\
    \ program shows how to use fputs() and fprintf() for writing some data in a text\
    \ file:\n\n```\n#include <stdio.h>\n#include <stdlib.h>\nint main()\n{\n    FILE\
