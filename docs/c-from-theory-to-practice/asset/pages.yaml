    # malloc() Function


    To allocate memory dynamically, we''ll need to use one of the realloc(), calloc(),
    or malloc() functions declared in stdlib.h. The most used is the malloc() function.
    It has the following prototype:


    ```

    void *malloc(size_t size);

    ```


    The size parameter declares the number of bytes to be allocated. The type size
    _t is a synonym of unsigned int type. If the memory is allocated successfully,
    malloc() returns a pointer to memory. If it not, it returns NULL


    malloc() returns a void pointer, meaning any type of data can be stored in the
    allocated-memory. For example,


    ```

    int *ptr = (int *)malloc(100);

    ```


    The (int*) casting indicates that the allocated memory will be used for the storage
    of integers. Note that the casting isnt not necessary; we could write


    ```

    ptr = malloc(100);

    ```


    The reason we prefer to return the pointer is to make clear which type of data
    will be stored in the allocated memory so that whoever reads our code won''t have
    to look for the pointer declaration to find it.


    If the allocation succeeds, ptr will point to the beginning of memory. If not,
    its value would be NULL.


    > Always check the return value of malloc(). If it is NULL, an attempt to use
    a null pointer would have unpredictable results; the program may crash.


    In the aforementioned example, the maximum number of stored integers is 25 because
    each integer is 4 bytes. Note that we could write 25*sizeof(int) instead of 100.

    In the fact, common practice is to use the sizeof operator in order to get a platform-independent
    program. For example, an int type may reserve two bytes in one computer and four
    in another. If we weren''t using the sizeof operator, malloc() would reserve 50
    integers in one case and 25 in the other.


    > Always use the sizeof operator to specify the number of bytes to be allocated.'
