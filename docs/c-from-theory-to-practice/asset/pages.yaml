  md: "The logical operators are left associative, the compiler evaluates the operands\
    \ from left to right. In expressions with multiple && operators, if the compiler\
    \ finds an operand with a false value, it makes the value of the entire expression\
    \ false and it does not evaluate the rest of the operands. For example.\n\n```\n\
    #include <stdio.h>\nint main() {\n    int a = 10, b = 20, c;\n\n    c = (a > 15)\
    \ && ((++b) > 15);\n    printf(\"%d %d\\n\", c, b);\n    return 0;\n}\n```\n\n\
    The second operand ((+b > 15) is not evaluated since the first one (a > 15) is\
    \ false. The program displays 0 20.\n\n# Operator ||\n\nThe || operator is the\
    \ logical OR operator. It works like the OR gate in electronic circuit designs.\
    \ Specifically, the value of an expression that contains || operators is only\
    \ 1 if one or more operands of the expression are true. If all operands of the\
    \ expression are false, then the result is 0.\n\nFor example, if we write a =\
    \ (10 == 10) || (3 > 5); the value of a becomes 1 since the first operand is true.\n\
    \nIf we write a = (10 != 10) || (3 > 5); the value of a becomes 0 since all operands\
    \ are false.\n\nIn expressions with multiple || operators, if the compiler finds\
    \ an operand with a true value, it makes the value of the entire expression true\
    \ and it does not evaluate the rest of the operands. For example.\n\n```\n#include\
    \ <stdio.h>\nint main() {\n    int a = 10, b = 20, c;\n\n    c = (a > 5) || ((++b)\
    \ > 15);\n    printf(\"%d %d\\n\", c, b);\n    return 0;\n}\n```\n\nThe second\
    \ operand ((+b > 15) is not evaluated since the first one (a > 5) is true. The\
    \ program displays 1 20.\n\n# Exercises\n\n4.7 What is the output of the following\
    \ program?\n\n```\n#include <stdio.h>\nint main()\n```"
