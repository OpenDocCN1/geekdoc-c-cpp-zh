  md: "# Operators\n\nThe statement a += 6; is equivalent to a = a+6, which is equal\
    \ to 10.\nThe next statement a *= b+3; is equivalent to a = a*(b+3) = 10*(2+3)\
    \ = 50. Notice that the expression b+3 is automatically enclosed in parentheses.\n\
    The statement a -= b+8; is equivalent to a = -(b+8) = 50-(2+8) = 40.\nThe statement\
    \ a /= b; is equivalent to a = a/b = 40/2 = 20.\nFinally, the statement %= b+1;\
    \ is equivalent to a = a%(b+1) = 20%(2+1) = 2.\nThe final output of the program\
    \ is Num = 2.\n\n# Exercise\n\n# 4.6 What is the output of the following program?\n\
    \n```\n#include <stdio.h>\nint main()\n{\n    int a = 4, b = 3, c = 1;\n\n   \
    \ a += b --c;\n    printf(\"%d %d %d\\n\", a, b, c);\n    return 0;\n}\n```\n\n\
    Answer: The compound operators are executed from right to left, as shown in Appendix\
    \ A. The expression a += b --+c; is equivalent to a = a+(b -- ++c); By itself,\
    \ the expression (b -- ++c) is equivalent to b = b-(++c). The value of c is first\
    \ incremented and becomes 2, therefore b = b-2 = 3-2 = 1. Now, the expression\
    \ a+(b -- ++c) becomes equivalent to a = a+1 = 5. As a result, the program displays\
    \ 5 1 2.\n\n# Logical Operators\n\nLike the relational operators, the logical\
    \ operators can also be used to form logical expressions, which produce either\
    \ 1 or 0 as their result.\n\n# Operator &&\n\nThe && operator is the logical AND\
    \ operator. It works like the AND gate in electronic circuit designs. Specifically,\
    \ the value of an expression that contains && only is 1 if all operands of the\
    \ expression are true.\nFor example, if we write a = (10 == 10) && (5 > 3); the\
    \ value of a becomes 1 since both operands are true.\nIf we write a = (13 < 8)\
    \ && (10 == 10) && (5 > 3); the value of a becomes 0 since the first operand is\
    \ false."
