  md: '# 10 Strings


    Now that you''ve seen how to use single character data, it''s time to learn how
    to use strings. A string in C is a series of characters that must end with a special
    character, the null character. This chapter will teach you how to read and write
    strings and covers some of the most important string-handling functions in the
    C library.


    # String Literals


    A string literal is a sequence of characters enclosed in double quotes. C treats
    them as character arrays. In particular, when a C compiler encounters a string
    literal, it allocates memory to store the characters of the string plus one extra
    character, to mark the end of the string. This special character is called the
    null character, and it is represented by the first character in the ASCII set,
    which is ''\0''.


    For example, if the compiler encounters the string literal "message", it allocates
    eight bytes to store the seven characters of the string plus one for the null
    character.


    # Storing Strings


    To store a string in a variable, we use an array of characters. Because of the
    C convention that a string should end with the null character, to store a string
    of up to N characters the size of the array should be N+1. For example, to declare
    an array capable of storing a string up to 7 characters, we write


    ```

    char str[8];

    ```


    An array can be initialized with a string, when it''s declared. For example, with
    the declaration


    ```

    char str[8] = "message";

    ```


    the compiler copies the characters of the "message" into the str array and adds
    the null character. In particular, the value of str[0] becomes ''m'', str[1] becomes
    ''e'', and the value of the last element str[7] becomes ''\0''. In fact, this
    declaration is equivalent to


    ```

    char str[8] = {''m'', ''e'', ''s'', ''s'', ''a'', ''g'', ''e'', ''\0''};

    ```'
