    If the "if" is executed, TrapNot will notify you by dropping you into your debugger.
    If the "if" is executed, IntTest will notify. I use an "int 3" to put me in Soft-Ice
    (the debugger I use) for each of these. I walk through the function to ensure
    the code path works correctly. Once you have tested the code path, remove all
    the Traps and IntTests that you hit testing the path.


    As time goes on, you will find fewer and fewer Traps and IntTests remaining. You
    will then have to devise special tests to actually force those paths to be hit.'
