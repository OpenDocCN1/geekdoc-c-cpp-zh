    # Windows debug version


    The Windows Software Development Kit includes a debug version of Windows. In Windows
    3.0 this made a big difference because the debug version performed parameter checking,
    while the retail version didn''t.


    The debug version still performs additional checking that the retail version does
    not perform. A Windows application should run, without even a warning, on the
    debug version of Windows. While testing a Windows application, use the debug version
    of Windows and a serial terminal connected to your serial port (which debug kernel
    will write to).


    The debug version also has several flags that you can turn on to perform additional
    checking. The first flag is ilovebear(an interesting story behind the name), which
    will cause passed-strings to be filled to their limits before returning values
    placed in them. This guarantees that all passed-in buffers are long enough.


    The debug version also has the cal ValidateSpaces, which, in conjunction with
    the flags EnableFreeChecking and EnableHeapChecking perform additional checking
    of the heap. This call adds about 20 percent overhead in Windows. However, it
    will writes to free memory.


    The call ValidateCodeSegments is useful only in real mode. If your program will
    run in real mode, then you should use this test at times. However, if your program
    will only run in protected mode, then there is no reason to use this call.


    Windows provides the Stress Applicator and Heap Walker, which can be used to eat
    up resources. The Stress Applicator can use up the heap, leaving a set amount
    of free memory. It can do this to the global heap, a programs local heap, and
    the GDI heap (more commonly known as system resources). It can also use disk space
    and file handles, once again leaving limited or no resources.


    The Heap Walker can also use the global heap as well as discardable segments.
    Both Stress Applicator and Heap Walker allow you to test your application under
    situation where resources have completely run out.


