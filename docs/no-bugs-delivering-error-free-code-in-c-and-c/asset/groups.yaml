    # 第 3 章\n\n# 通用原则\n\n从这一章开始，我们现在讨论如何开发代码以最大限度地减少 bug。本章概述了在实现后续章节列出的所有技巧时应遵循的通用原则。\n\
    \n这里讨论的原则不仅适用于书中描述的方法，也适用于你可能发明的任何其他技巧。从另一个角度来看，本章可以被视为一种需要遵循的哲学。对于非程序员来说，本章内容可读，但绝对是可选的。对于开发者来说，本章是后续所有关于编程技巧章节的基础。\n\
    \n# 调试代码应当是只读的\n\n我在许多程序中看到的一个常见问题是：程序在开启调试时运行正常，但在关闭调试时就会崩溃。（正如书中讨论的，有很多方法可以开启和关闭调试。然而，最常见的方法是使用\
    \ `#ifdef DEBUG` 和 `#endif`。）我甚至知道有一款商业程序在发布时开启了调试，但禁用了它的调试 `printf`，因为它在非调试模式下无法运行。\n\
    \n这个问题通常发生的原因是，代码中的调试检查部分在确定传递了错误的参数时，会从函数返回。然而，如果关闭了调试，同样的检查就不会发生，函数也不会返回错误。\n\
    \n这个问题有一个简单的解决方案。所有的调试代码都应该是只读的。这意味着什么？显然意味着只读取数据，从不写入数据。然而，同样重要的是它不影响代码路径。调试代码会被执行，但它永远不会导致后续代码路径发生变化。调试代码等同于调用一个返回\
    \ `void` 的函数。\n\n所有的调试代码都应该放在 `#ifdef DEBUG` 中，以便可以开启和关闭测试。此外，将所有仅在调试模式下使用的函数放在\
    \ `#ifdef DEBUG` 中，这样该函数就不会出现在程序的最终版本中。此时，如果你在关闭调试的情况下仍调用调试代码，链接器会提醒你。\n\n# 调试代码\n\
    \n```\n#ifdef DEBUG\nvoid DebugCheck(char *p)\n{\n    ...\n}\n#endif\n```\n\n\
    在宏的情况下，你可以在 `#ifdef DEBUG` 内部定义调试宏，然后定义一个在 `#else` 中不生成任何代码的宏。使用宏会让你的代码整洁得多。与其在代码中散布大量的\
    \ `#ifdef DEBUG` 语句，你只需要宏，结果代码看起来更整洁。下面的示例说明了这些宏的使用。\n\n# 调试宏\n\n```\n#ifdef DEBUG\n\
    #define DebugMacro(p) DebugCheck(p)\n#else\n#define DebugMacro(p)\n#endif\n```\n\
    \n# 使用调试宏\n\n```\n// 洁洁：\np = GetBuf(0);\nDebugMacro(p);\nWriteBuf(p);\n```\n\n\
    ```\n// 太忙乱：\np = GetBuf(0);\n#ifdef DEBUG\nDebugCheck(p);\n#endif\nWriteBuf(p);\n\
    ```\n\n调试代码将应用程序数据视为只读是非常关重要的。实现调试代码的使用时，要确保在调试定义之外执行什么代码都没有产生影响。如果调试代码修复了数据或导致函数执行了不同的路径，那么当调试被移除（或未定义）时，你将得到一个不同的程序——你的调试是在害你而不是帮助你。\n\
    \n如果你的调试代码发现了参数错误，调试代码不应该导致函数返回。如果你想在非调试模式下执行相同的错误检查，正确的方法是在调试检查之后，在你的非调试代码中再次执行检查，然后返回。你调试代码的重点不是最高速度或最小尺寸，而是最大的调试效率。\n\
    \n下面的程序演示了一个只读的代码路径和一个非只读的代码路径。注意，在错误的示例中，只有在 DEBUG 开启的情况下，函数才能处理传入的 NULL 指针。\n\
    \n```\n// 正确（只读）：\n#ifdef DEBUG\n    if (! pSrc)\n        ErrorPrintf(\"Source\
    \ String NULL\\n\");\n#endif\nif (! pSrc)\n    return (NULL);      // 即使 DEBUG\
    \ 关闭，我们也处理 NULL\n\n// 错误（非只读）：\n#ifdef DEBUG\n    if (! pSrc)\n    {\n       \
    \ ErrorPrintf(\"Source String NULL\\n\");\n        return (NULL); // 当 DEBUG 关闭时你会死在这里\n\
    \    }\n#endif\n```\n\n# 代码路径\n\n难以发现的 bug 通常发生在相对罕见的情况下。毕竟，如果程序每次运行时都会重启你的系统，它通常会修复那个错误。\n\
    \n这些罕见情况中的某些是因为执行了从未执行过的代码路径导致的。当你的程序首次启动时，你通常会执行一两次 `malloc`。你有一段代码会在 `malloc`\
    \ 失败时执行（你不是假设它会成功吗？），但它真的失败过吗？\n\n如果没有，你就坐等事故的发生。当那个特定的 `malloc` 失败时，你的程序到底做了什么只要你没有测试过某个代码路径，你就没有测试过你的程序。确保你了每一个路径。如果你有一个\
    \ `\"if () ... else...\"` 并且你总是执行 `\"else\"` 部分，那么 `\"if\"` 部分 就是一个等待发生的 bug。\n\
    \n测试代码路径最简单的方法是通过宏：`Trap ()` 和 `IntTest`。\n\n# DEBUG 的正确使用\n\n```cpp\n// 正确（只读）：\n\
