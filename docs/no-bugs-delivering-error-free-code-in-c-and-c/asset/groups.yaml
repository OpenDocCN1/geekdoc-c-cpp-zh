    # NULL pointers


    What discussion of eliminating bugs would be complete without the subject of using
    NULL pointers. This is one of the few things that the compiler companies have
    actually tried to do something about themselves. In any event, watch for NULL
    pointer writes.


    On the 8086, regardless of memory model, in C you have two NULL pointers; SS:0
    and 0.0. In some cases DS is different from SS but DS is fixed, you also have
    DS:0. For other processors, you might still have more than one NULL location.


    Regardless of the quantity of them, copy the 4 bytes from NULL to a global variable
    on start-up. When the program ends, compare these values to the values at NULL
    location. Write a message to the tester if they don''t match.


    Even most compilers perform this checking for you, do it yourself for two reasons.
    First, most of the compilers test only for overwriting SS:0. Second, you should
    have a TestNull function to add to the TestAll function. This allows you to test
    for NULL overwrites at other times than during program exit—critical to narrowing
    down when you wrote to NULL.


    Keep the following thoughts in mind. First, sometimes the NULL value will legitimately
    change. If you set an address on int 0, the NULL 0 changes. Also, some compilers
    DS:0 to 0 and use that pointer for literal strings that are empty. Therefore,
    writing to DS:0 can cause some unpredictable behavior.


