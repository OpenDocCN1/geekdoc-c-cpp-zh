    # Using variables


    The other alternative is to use variables. This method gives you some advantages.


    +   - You can change the variables at run-time.

    - You can run with different testing without first recompiling the program.

    - You can turn levels of debugging on and off while the program is running with
    your debugger.

    - You can turn types of debugging on and off rather than being limited to a level.


    The best method I have seen is simple yet powerful. Begin with two variables,
    BugType and BugLev. BugType is a byte that defines the part of the program. Each
    part of the program has its own separate number. An example would be having a
    different number for each basic function available from a menu in a program.'
