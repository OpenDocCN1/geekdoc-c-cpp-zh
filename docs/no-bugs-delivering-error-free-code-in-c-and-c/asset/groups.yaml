  - '[PAGE 145]


    Finally, time constraints might not allow bugs to be fixed. Bugs at Level 5 and
    Level 6 will often not be worth the time investment. Even if worth the time, there
    might not be enough time left before shipping. In either case, these bugs should
    then be resolved as postponed. The list of bugs that were postponed becomes part
    of the proposed feature list for the next version.


    Throughout this process, the Bug Master (as well as developers and testers) need
    to periodically check the entire database for duplicate bug reports. At times
    she or he will also find open bugs that have been resolved or can''t be resolved.


    All bugs that are assigned considered open. This is the bug count that matters.
    (Having 1000 postponed bugs that are really feature enhancements are not a terribly
    relevant number. Having Level 1 & 2 bugs is a sign of serious problems.) This
    bug count needs to drop every week. If this count gets out of control, then your
    ship date will slip further and further into the future.


    Although at times the count will climb (for example, shortly after a beta release),
    it must be brought back under control. The actual number depends on the severity
    of the bugs, the number of developers on the project, and the stage of the development.


    However, the bug count of serious items for the parts of the program that are
    complete should be in the single digits for each developer. At the later stages
    of the program, it should be less than four. If you have a high bug count, the
    developers have too high ratio of MFUs to working code.


    Having a lot of code full MFUs is not of much use. If your other option is a smaller
    body of working code, you are a lot better off. If the bug count gets too high,
    stop new development and concentrate on killing the existing bugs. Do not allow
    new development until the bug count is brought back down to a reasonable level.


    And in mind that you cannot drastically change the number of bugs a developer
    fixes in a day. If the count keeps moving upward, even in full fix mode, you are
    screwed. If the count moves downward at a relatively constant rate, then you cannot
    plan on doubling that rate simply because your ship date is approaching.


    # The testing process


    The success of your testing process depends on three things:

    © Copyright 1992 by David Thielen - All Rights Reserved'
  - '[PAGE 146]


    +   * Your level of organization


    +   * The expertise of your testers


    +   * The support of your management


    With a good testing process, you can deliver good software. Without it, you haven''t
    got a prayer; with each buggy update, fewer of your users will stay with your
    program, and more will switch to a competitor that does do a good job of testing.


    # Internal Testing


    A program is tested by several groups. The developers themselves do some testing,
    by running the program to see whether their new features allow nothing else. The
    test team uses both automated and manual tests. And finally, users test the program
    in a beta test.


    This section discusses the second group; the tests performed by the internal testers.
    Although the testing group is also responsible for managing the beta test, this
    section discusses the actual testing performed by the testing group.


    The testers are divided into two groups:


    +   * Those with knowledge of the source code (white box). These testers look
    at the source code, and based on the code, write test programs that will try to
    break the program.


    +   * Those with just knowledge of the product as a power user (black box). These
    testers know nothing about the internal logic of the program. Instead, they design
    tests based on the knowledge a power user of the program would have.


    # White box testing


    Internal testing is generally the only source of white box testing of a product.
    This testing is performed by programmers who read the source code and, based on
    the actual source code, design a set of tests. Where the TRAPs and IntTests made
    sure that all code was executed, these tests attempt to insure that all combinations
    of code paths are tested.'
  - '[PAGE 147]


    White box testing cannot be performed by the developer who wrote the code. Any
    developer, no matter how good, has blind spots. After all, the developer put all
    of those MFUs in there in the first place.


    Although white box testing should exercise the common code paths, this is the
    least important of its jobs. After all, if a code path is common, the black box
    will surely test it. Instead, testers should look for code paths that will be
    exercised very rarely.


    Ideally, tests will be written for all possible code paths. However, with a limited
    amount of time and people, this is usually not possible. In that case, the testers
    have to decide which code paths to test. You have two basic groups of tests.


    First, you want to write tests that test the basic functionality of the program.
    This test should determine whether the basic system, including all critical paths,
    works. This is necessary to determine whether the developers have made a change
    that makes it impossible to test anything because the basic system is hosted (another
    technical term that means you can''t do anything with the program)


    Second, you want to write tests that test code paths you think have the best odds
    of breaking. This is where the test group has its best opportunity to break a
    program. Also, in the course of looking for code paths to break, a tester who
    finds something wrong can bring it to the attention of the developer. This code
    review is also a way to find bugs.


    # Black box testing


    Black box testing is the opposite of white box testing. The tester has no knowledge
    of the internal code making the program. It is critical that black box testers
    truly clean. By clean, the testers must have no knowledge of the internal workings
    of the program.


    In most cases, the best way to insure that black box testers is clean is to use
    nonprogrammers to do this testing. Even if they see code, they have no idea what
    it means. It also lessens the likelihood of their learning the internal logic
    from a developer.


    Black box tests are designed by a power user of the program. Like the white box
    testers, two basic groups of tests should be written. First are the tests of common
    functionality. These are designed to verify that the basic program


    © Copyright 1992 by David Thiel - All Rights Reserved'
  - '[PAGE 148]


    works. Second, once again, are the uncommon code paths. In the case of black box
    testing, there is no way to know which code paths are shakier than others. The
    most important approach is to give an unusual response to prompts.


    For example, when prompted for a filename, try 1 and 8 character names. Try files
    that are read-only. Try bad files. Try files that don''t exist. In other words,
    try everything except a normal file.


    The uncommon code path testing is not as critical in black box testing because
    the beta test will accomplish much of that. More important in this testing is
    to add tests for bugs found in the beta process.


    If you track the initial black box tests, you will find some testers wrote tests
    which all succeeded, and some wrote tests that almost always failed. Use the people
    in the last group to keep writing tests, and the people in the other groups write
    tests for bugs reported by beta sites.


    # Designing the tests


    Tests generally have a longer lifespan than the code they test. Although a program
    may be completely rewritten between versions, the user interface stays somewhat
    constant. Because many tests are written to exercise the user interface, the tests
    are still good, or easily modifiable.


    Also, when a program is converted to another language (human, not programming),
    most of the tests are still good, although they might have to change the actual
    keystrokes input and the test in the results to match the new language. Programs,
    like test routines, are written with an eye on international support.


    Testing is broken down into "test suites." A test suite is nothing more than a
    group of tests that are run. One suite would be the basic functionality test works.
    Another suite could be all of the printing test cases.


    Two test suites can have some crossover in test cases they use. The test cases
    are the actual tests. The test suite is designed to perform a set of tests to
    check something. If possible, a test suite should include other test suites. If
    possible, you should have a test suite for each basic group as well as a master
    suite that includes all of these suites. The master suite would then include every
    test.'
- md: '

    140 No Bugs


    A test case tests one feature in a program. A test case is a test program composed
    of a set of test scenarios. By running a test case, you should be fully exercising
    the feature with all of the tests written for it. If the test case opening a file
    passes, it has passed all of the tests you have written for opening a file. A
    test case should be as comprehensive as possible—it fully and completely tests
    one feature.


    A test scenario is a part of a test case. Each scenario tests one specific way
    of exercising the function. For example, for opening a file, one scenario would
    pass in a file that doesn''t exist. Another would pass in a file that was bad,
    and so on. A test scenario should be as simple as possible—it tests one specific
    code path.


    The tests should generate logs of the tests they make and, if the tests fail,
    the results of the failure. These logs should be clear and simple as possible.
    The best logs merely tests completed successfully if there were no errors.


    The testing group should design tests to exercise the software to its limits.
    It is not the job of the testing group to randomly use the software. They should,
    with full knowledge of the product, define a set of tests that pushes the limits
    of the software. For each test, they should have a predefined set of inputs that
    corresponds with an expected outcome.


    When completed, the automated tests are a smoothly running product. They perform
    their job well and return their results clearly. They are easy to use and require
    minimal user interaction. A professional test group provides professional series
    of test suites.


    ## Running the tests


    The very first test is a test designed by the testers that the developers themselves
    run. Until the software passes this test, it is not handed over to the testers.
    The purpose of this test is not for the developers to do the testers'' job but
    to ensure that, after bug fixes, the program works. Enough of the program features
    needs to work well enough to allow the testers to actually do something.


    This test comprises the tests developed by the white box and black box to test
    the main code paths. As more of the program gets working, this initial test may
    be enlarged. However, at no time should it include capabilities not yet in the
    program. The test is not to determine whether something works for the first time
    but to insure that basic functionality that checked out previously has not been
    broken.


    This test must be completely automated. Simply put, a developer is not likely
    to run a manual test once a week. However, she/he is likely to run a program that
    will report if the program is working as expected.


    The best way to approach this test is to build the product once a week. Once the
    product is built, including everyone''s changes, the automated test is then run
    against the program. If the program passes, it is given to the test group. If
    not, the program is fixed by the developer or developers who broke the test.


    The process of building the program and running the basic test can be done by
    a developer, a person dedicated to this function (a builder), or a tester. The
    program may be built and delivered to the testers to run the basic test. However,
    if the basic test fails, the sole job of the developers is to fix it. Until that
    happens, the developers do not do any other development.


    Once the build passes the basic tests, it is turned over to the test group. The
    testers run their tests, both automated and manual, on the build. The first tests
    should be those that test whether bugs that were reported have truly been fixed.
    If not, then the bug is returned to the appropriate developer.


    Next, if new features were added, the tests developed for the new features should
    be run. Because test programs are written concurrently with development, the programs
    to test new features should be ready as soon as (or before) new features are completed.


    This gives developers immediate feedback on how well they have implemented the
    new function. Instead of waiting weeks or even months, after they have forgotten
    all the details of the implementation, they get feedback within days.


    Finally, the remainder of the tests should be run to ensure no new bugs are introduced
    into the program. This is where automated tests really pay off. Each week, when
    a new build is delivered to the testers, all of the old tests are rerun — at minimal
    cost.


    ## Testing platforms


    The testers should be sure they test under actual end-user conditions. If most
    users of a product have 80286 machines with 640K of RAM, testing exclusively with
    50 MHz 80486 systems with 8M of memory is going to allow a lot of problems to
    slip through.


    It''s important to run the full set of tests on a least common denominator of
    systems. The tests must pass on every system the program might run on, not simply
    the hardware, but also the software it will run with, including networks, TSRs,
    and so on.


    If you use special monitors, test the program with each. Look for combinations
    that cause trouble. And look for other software packages that might conflict with
    yours. Conflicts can come from sources other than TSRs and device drivers. Under
    Windows, your DOS application might be incompatible with another application that
    is running in another DOS box at the same time.


    Be sure you test with various operating system environments. In the case of DOS,
    you should test with DOS both low and high. Test your program loaded both low
    and high (a UMB). You should also test your program in a Windows DOS box – which
    will catch all illegal memory accesses.


    If your product is network aware and runs on several networks, it is critical
    that you test it on several networks. Testing a network program on only one network
    is a good way to insure it will blow up on every other network out there. Use
    at least three radically different networks. If you talk to different network
    APIs depending on the network, test at least two different networks with each
    API.


    If you are writing a Windows application, be sure it works in both 286 and 386
    mode. In each case, Windows is significantly different. And if your program can
    run in real mode, then test it in real mode. If it''s not important to test it
    in real mode, then you are doing your customers no favor by allowing it to be
    in real mode.


    As object linking and embedding (OLE) becomes more prevalent in Windows applications,
    compatibility with other applications will become more important. You will start
    to see bugs where your program blows up only when it has an OLE connection to
    application B, and application B starts a dynamic data exchange (DDE) connection
    with application C.


    If you are writing a DOS application, be sure it runs on DOS and under Windows
    (286 and 386 modes). Furthermore, even if it is not network aware, be sure it
    runs fine if your system has a network loaded on it, both as a workstation and
    as a server. These environments can make a big difference to your application.

    '
  mdcn: '


    140 零 Bug


    测试用例（Test case）测试程序中的一个功能。测试用例是由一组测试场景组成的测试程序。通过运行一个测试用例，你应该通过为该功能编写的所有测试来充分执行该功能。如果打开文件的测试用例通过了，说明它已经通过了你为打开文件所编写的所有测试。测试用例应该尽可能全面——它完整且完全地测试一个功能。


    测试场景（Test scenario）是测试用例的一部分。每个场景测试执行函数的一种特定方式。例如，对于打开文件操作，其中一个场景会传入一个不存在的文件；另一个场景会传入一个损坏的文件，以此此类推。测试场景应该尽可能简单——它测试一个特定的代码路径。


    测试应该生成其所执行测试的日志，并且如果测试失败，还要生成失败的结果。这些日志应该尽可能清晰简单。最好的日志是在没有错误的情况下，仅显示“测试成功完成”。


    测试小组应该设计测试，以将软件推向极限。随机使用软件并不是测试小组的工作。他们应该在充分了解产品的情况下，定义一组能够推软件极限的测试。对于每项测试，他们应该有一组预定义的输入，这些输入对应一个预期的结果。


    完成后，自动化测试就是一个运行顺畅的产品。它们能够很好地完成工作并清晰地返回结果。它们易于使用，且只需要极少的用户交互。专业的测试小组提供专业的系列测试套件。


    ## 运行测试


    第一项测试是由测试人员设计并由开发者自己运行的测试。在软件通过这项测试之前，它不会交给测试人员。这项测试的目的不是让开发者去承担测试人员的工作，而是确保在修复
    Bug 后程序运行正常。需要有足够的功能运行得足够好，以便测试人员能够实际开展一些工作。


    这项测试包含了白盒和黑盒开发的用于测试主代码路径的测试。随着程序越来越多的运行正常，这个初始测试可能会扩大。然而，在任何时候它都不应该包含程序尚未具备的功能。测试的目的不是判断某功能是否是第一次运行，而是为了确保之前检查过的基本功能没有被破坏。


    这项测试必须完全自动化。简单来说，开发者不太可能每周运行一次手动测试。然而，他/她可能会运行一个能够报告程序运行是否符合预期的程序。


    处理这项测试的最佳方法是每周构建一次产品。一旦产品构建（包括所有人的更改），就会对程序运行自动化测试。如果程序通过，则将其交给测试小组。如果没有通过，则由破坏测试的开发者对程序进行修复。


    构建程序和运行基础测试的过程由开发者、专门负责此功能的人员（构建者）或测试人员完成。程序可以被构建并交付给测试人员运行基础测试。然而，如果基础测试失败，开发者的唯一工作就是修复它。在此之前，开发者不进行任何其他开发。


    一旦构建通过了基础测试，它就会交给测试小组。测试人员在构建版本上运行他们的自动化和手动测试。第一批测试应该是测试已报告的 Bug 是否已真正修复。如果没有，则将
    Bug 退回给相应的开发者。


    接下来，如果添加了新功能，应该运行为这些新功能开发的测试。由于测试程序是与开发同步编写的，因此测试新功能的程序应该在新功能完成时（或之前）准备就绪。


    这为开发者提供了关于新功能实现良好的即时反馈。他们不需要等待几周甚至几个月（那时忘记了所有实现细节），而是在几天内获得反馈。


    最后，应该运行剩余的测试以确保程序中没有引入新的 Bug。这是自动化测试真正发挥作用的地方。每周当一个新的构建版本交付给测试人员时，所有的旧测试都会重新运行——且成本极低。


    ## 测试平台


    测试人员应该确保在实际终端用户条件下进行测试。如果一个产品的大多数用户使用带有 640K RAM 的 80286 机器，那么仅用带有 8M 内存的 50 MHz
    80486 系统进行测试会导致很多问题溜。


    在最小配置的系统上运行全套测试是很。测试必须在程序可能运行的每一个系统上通过，不仅是硬件，还包括其运行的软件，包括网络、TSR 等。


    如果你使用特殊的监视器，请用每种监视器测试程序。寻找引起问题的组合。并寻找可能与你的程序冲突的其他软件包。冲突可能来自 TSR 和设备驱动程序以外的来源。在
    Windows 下，你的 DOS 应用程序可能与同时在另一个 DOS 窗口中运行的应用程序不兼容。


    确保在各种操作系统环境中进行测试。在 DOS 的情况下，你应该在低内存和高内存 DOS 下进行测试。测试你的程序在低内存和高内存加载（UMB）。你还应该在
    Windows DOS 环境下测试程序——这会捕捉到所有非法内存访问。


    如果你的产品是网络感知的并在多个网络上运行，在多个网络上对其测试是至关重要的。在一个网络上测试网络程序是确保它在其他任何网络上崩溃的好方法。使用至少三个截然不同的网络。如果你根据网络调用不同的网络
    API，请对每个 API 测试至少两个不同的网络。


    如果你正在编写 Windows 应用程序，确保它在 286 和 386 模式下都能工作。在每情况下，Windows 都显著不同。而且如果你的程序可以在实模式下运行，请在实模式下进行测试。如果在实模式下测试并不重要，那么允许它在实模式下运行是对客户不负责的。


