    values:


    ```

    VERBOSE == 0    No DebugPrints

    VERBOSE == 1    Left in beta release

    VERBOSE == 2    No printsfs in normal code path

    VERBOSE == 3    Very basic prints

    VERBOSE == 4    Moderate prints

    VERBOSE == 5    Verbose prints

    ```


