    following the ALLOC struct so that the program doesn''t see the additional memory
    actually malloced from the heap.


    The Alloc struct holds several pieces of information. The pointers pPrevAlloc
    and pNextAlloc insert this allocation into the linked list of allocations. When
    performing an Alloc (equilibent of malloc), the newest element is inserted at
    the end of the linked list, with pPrevAlloc pointing to the previous last element
    and pNextAlloc pointing to the first element (which is actually a fake). When
    performing an AllocFree (equilent of a free), the element is removed from the
    list and the elements before and after the removed element are then to point to
    each other.


    pFileName and iFileLine identify where in the program the allocation was. This
    provides a very useful way to refer to a heap element. On any allocation (Alloc,
    Realloc, Some, or Free), the name and line of the calling function will be placed
    in these vars, giving you the location of the last call for this element. Although
    AllocSize will list the location it was called from if you request the size of
    a bad pointer, it is not placed in the ALLOC struct.


    The uSize holds the size of the allocation, as requested by the calling program,
    not including the extra bytes holding the ALLOC struct and end bytes. This is
    done because there is no standard to get the size of an malloced element, and
    when a library does a call to return the size of an alloc, it is done much slower
    than using an euSize.


    The uuid holds the value ALLOC_ID. If this element does not hold ALLOC_ID, then
    it is assumed that this is not an element in the heap. This stops the debug code
    from going out to link if the heap has been corrupted. When walking the heap,
    if an element does not used properly, the walk stops. When passed a pointer, if
    this element is not ALLOC_ID, then it is assumed that the pointer is bad, and
    the function returns immediately.


    The uChk holds ALLOC_CHK1 and checks for underwrites. This happens when you write
    to the beginning of some malloced memory. Following the struct is the user memory
    followed by another word that holds ALLOC_CHK2. Whenever the heap is walked, the
    words at the beginning and end are checked for overwrites and underwrites. If
    your program writes over these words, the program will continue, but it leaves
    them overwritten.'
