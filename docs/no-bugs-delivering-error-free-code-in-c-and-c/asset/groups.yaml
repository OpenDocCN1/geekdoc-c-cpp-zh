    Error checking takes some time. In many cases, checking is as simple as seeing
    whether a pointer is NULL or whether a structure''s ID is correct. Neither check
    takes much time or space.


    On the other hand, performing a CRC of all the buffers in a cache is very expensive
    in terms of time —especially if the function that includes the check is called
    often. Therefore, as the value of DEBUG is increased, the program slows down.
    I suggest the following values:


    ```

    DEBUG == 0    No debugging

    DEBUG == 1    Left in beta release

    DEBUG == 2    Fast checking

    DEBUG == 3    Moderate checking

    DEBUG == 4    Slow checking

    DEBUG == 5    Extremely slow checking

    ```


    For your first release, you would then compile with -DEBUG=1. In return for a
    slight performance slideshow, the assertions, parameter checks, etc. will be checked
    by your testers.


    This does not mean that you would even use all of these values for most code.
    In most debugging code, the checking will be fast, so you perform the checking
    if DEBUG > 0. If you use this method, be sure that if DEBUG == 0, none of the
    debugging code will be compiled.


    Separate from testing is the issue of how much information you want to send to
    the MDA. If you have a problem with one module, you do not want DebugPrints from
    it to be buried in DebugPrints from other modules that are working properly. The
