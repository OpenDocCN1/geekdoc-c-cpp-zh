    ```\n\n# Using ENTER and EXIT\n\nThe program example below illustrates the use\
    \ of ENTER and EXIT.\n\n```\nchar *strcpy (char *pDest,char *pSrc)\n{\n  ENTER(\"\
    strcpy\");\n  while (*pDest)\n    *pDest = *pSrc;\n    ;\n  EXIT(\"strcpy\");\n\
    }\n```\n\nHowever, this method leaves a lot to be desired. First, where were you\
    \ called from? If a function does not implement ENTER/EXIT, then the function\
    \ calls will appear to have been called by a higher-level function. Second, a\
    \ given function might call strcpy from multiple places, some of which might be\
    \ in loops. Where was a specific strcpy called? Finally, if a function exits in\
    \ multiple places, you have to place the EXIT macro a macro for all of places.\n\
    \nA better alternative is to create a macro for calling a function. The macro\
    \ will print that the function is being called, including the file and line number\
    \ of where it is being called from (using __FILE__ and __LINE__). The macro will\
    \ then call the function. Finally, it will print that the function returned, optionally\
    \ including the return value.\n\nThe below example will work for any C++ program.\
    \ However, most of the C compiler vendors are putting the capabilities required\
    \ for this (scoping) in their C compiler also.\n\n# Inline ENTER and EXIT\n\n\
    The program example below illustrates the use of ENTER & EXIT."
