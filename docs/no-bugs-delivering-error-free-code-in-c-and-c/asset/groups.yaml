    was slow (we''re talking big delays on a 486), but'
  - '[PAGE 29]


    all the functions worked. In this manner, I was able to force the program to use
    each memory system.


    If your temporary files are moved to a hard disk if a RAM disk fills up, be sure
    to test your application with a RAM disk that is too small. Anywhere you have
    backup procedures to protect you in case you run out of your preferred resource,
    be sure you can test the entire system using the backup resource.


    If you write a TSR that uses semaphores to prevent reentrancy, just before and
    after the semaphore, call the interrupt the TSR it is sitting on to be sure it
    will not reenter itself. The trick is to see if you can break your code.


    All of the above tricks are specific to the code they were testing. Every program,
    will have different weak points. You need to find those weak points and then break
    them. If you are determined to discover those MFUs you put in your code, then
    you will be able to figure out how to break your code.


    # Rock-solid low-level functions


    When you add two integers, the result isn''t bigger than an integer, you know
    that it will work. Think of how debugging would be if you didn''t know this. You
    would have to check what the instruction did at each place you added two numbers
    and test each with various combinations of numbers. You basically couldn''t program.


    Now lets up a level. What if you aren''t positive about strcpy (or any of the
    run-time functions). You can now at least (in fact I remember the early days of
    PC compilers when you couldn''t depend on these functions). But it''s not an easy
    task. Your testing and debugging job has grown by leaps and bounds.


    But you can trust the processor and run-times (if you can''t it to switch). However,
    every program has a set of its own low-level functions that are specific to it.
    These low-level functions have two important attributes. First, they are used
    throughout your program. A minor bug in one of them is a serious MFU in the program.


    Second, you can generally test all combinations of program flow in these low-level
    functions. Thoroughly test these low-level functions. You should be able to depend
    on these calls the same way you depend on a ''+-'' (add).'
  - '[PAGE 30]


    To do this, write test programs that call your low-level functions with enough
    different parameter combinations to test all possible code path combinations and
    print to the screen only if the return value is incorrect. That way, when you
    make a change to the function, it is very easy to test again.


    You have two major gains from exhaustive testing of the low-level functions. First,
    part of your code approaches being bug-free. Having part of your code bug-free
    should drop the total bug count.


    More importantly, although a bug in a high-level function will generally cause
    one problem, a single bug in a low-level function (such as linked list management)
    can cause innumerable bugs to appear throughout your program. The low-level functions
    are the foundation and frame of your program—if it is solid, the program is solid.
    If it''s shaky, no amount of effort elsewhere can then make the program solid.


    It is also critical that testing be performed on all functions that are widely
    used, even if they are not low level. If these functions don''t work, then you
    will get bad data at times and the rest of your program will fail. Although you
    might not be able to come up with a complete test for something like an edit window,
    you should still test it thoroughly. If it has a bug, you will see it everywhere
    in your program.


    When is a function low-enough to merit this exhaustive testing? When it is possible
    to come up with a set of test cases that will test every combination of entry
    data. Any function that can be tested this way would be; this is the most important
    step you can make to have bug-free code.


    The remaining code might have logic errors (that is, it does not do what you intended
    it to) rather than bad code (resulting, for example, a loose pointer). Logic errors
    are usually easier to find, and if they slip through to shipment, usually easier
    to work around.


    By the way, one of the two major advantages of object-oriented languages, their
    bug-free classes, are a result of extensive testing of low-level functions. The
    functions might not have test routines, but they have probably been used by enough
    people in ways that all of the bugs have been wrung out.


    If you take another look at your code, you might be surprised by how much of it
    could test this way. You can test practically every command in a database, every
    function in a word processor, every tool in a graphics package,'
  - '[PAGE 31]


    this way. When you view the program logic, it becomes clear that a small number
    of test cases will exercise all the possible combinations of paths through the
    code.


    If you can''t test anything this way, that all of your functions depend on all
    the other functions, you''ve got a serious problem on your hands. However, if
    you''ve written really clean, separable (that is, object-oriented style) code,
    you will find almost all of your functions are testable in this manner.


    So you have this giant library of code, and you don''t want to write test routines
    for all of it. So don''t. You can write test routines for sets of 15 to 40 similar
    functions (for example, strcat, strcpy, str) in about three days. You will find
    few bugs, if any. However, those you find will be bugs in the past you were never
    able to reproduce. And if you find no bugs, assuming you wrote test programs,
    you now KNOW that your low-level functions are solid.


    If most of your code is testable this way, you might be surprised by how few bugs
    make it into the final product if you test the pieces beforehand as described
    here.


    It may be coincidence, but when I started all-out testing of my low level functions
    is when I saw the biggest decrement in bugs in the programs I wrote. Not only
    that, but subsequent to doing this, I cannot recall a single instance where a
    bug seriously affected the entire program was found.'
- md: "\n# 23. No Bugs\n\n![](img/c29f9dc69d37305f082fd0bd64e612cf_32_0.png)\n\nAs\
    \ an embedded software application,\nWindward Reports puts effective and easy\
    \ customization in the hands of your clients.\n\nAs an in-house report design\
    \ solution,\nWindward Reports improves efficiency of corporate reporting efforts\
    \ and total cost of reporting.\n\nDownload a free demo:\nwww.windwardreports.com\n\
    OR\n\nRequest a consultation:\nsales@windward.net\n\n# Debugging in conditional\
    \ defines\n\nTo maintain speed, most times you will not want all of your conditional\
    \ error checking to be compiled. Some of the error checking can take an extremely\
    \ long time. (Generally, a specific check does not take a lot of time; rather,\
    \ the check is called often).\n\nThe other general reason is if you are printing\
    \ debug information to a terminal or second monitor, and you don't want useful\
    \ information to be scrolled off the screen by any other information you have\
    \ no interest in. Sometimes, the pure volume of printing can slow down the program\
    \ because a monitor can write to the screen only at a certain pace, and no faster.\n\
    \nYou can take either of two primary approaches to this problem. The first is\
    \ to not compile the extra debug code fact out not exist, but you will have to\
    \ recompile if you decide you need some of the debugging prints back. The program\
    \ example below illustrates the use of conditional compiling.\n\n# Using the value\
    \ of DEBUG\n\n```\n#ifdef DEBUG\nfast_test ();\n#endif\n#if (DEBUG > 1)\nslow_test\
    \ ();\n#endif\n#if (DEBUG > 2)\nreal_slow_test ();\n#endif\n```\n\nThe second\
    \ approach is to test a flag at the beginning of the debug code and skip it if\
    \ the test fails. If the flag is a variable, you can change its value in your\
    \ debugger, making it easy to turn the debug testing/printf on part way through\
    \ the program (or turn off after you no longer need them).\n\n# Using the variable\n\
    \nThe program example below illustrates the use of a debug variable.\n\n```\n\
    #ifdef DEBUG\nfast_test();\nif (DebugVar > 1)\n    slow_test();\nif (DebugVar\
    \ > 2)\n    real_slow_test();\n#endif\n```\n\nAlthough there are a lot of fancy\
    \ ways to implement this conditional debug code, two rules seem to hold. First,\
    \ you generally don't ever want to turn debugging on or off after a compile. Second,\
    \ both ways of implementing this seems to be equally fast to code and execute.\n\
    \nFor simple code, debugging is generally an on/off proposition. In these cases,\
    \ using #ifdef alone is generally sufficient, and anything more is a waste of\
    \ time. For code that is otherwise simple but has a couple of time-consuming checks,\
    \ you can use the value for which DEBUG is defined as conditional compiles.\n\n\
    Keep in mind with conditional debugging that some debug tests are matched. If\
    \ your allocate conditionally sets the signature bytes before and after each region\
    \ of allocated memory, it better do it if any of the conditional defines that\
    \ check the heap for the signature bytes are executed. I once spent several hours\
    \ trying to determine why some buffers were failing their CRC tests - the reason\
    \ was the CRC creation code had ifdefed out while the checking hadn't.\n\n# Comment\
    \ your open Issues\n\nAs you, issues or questions come up in certain pieces of\
    \ the code: Will a function work on a Super VGA monitor? How do you handle data\
    \ files with a particular error? Do you need to watch out for a certain condition?\n\
    \nThese questions are not resolved by Traps and IntTests. Rather, they are items\
    \ that you believe have not fully coded for or, in some cases, you have not coded\
    \ for all. In other cases, your program will fail under conditions in which you\
    \ need it to continue running.\n\nThese are possible logic errors that occurred\
    \ to you one time or another. Unfortunately, the human mind being what it is,\
    \ these errors will be quickly forgotten (until the bug comes in). These MFUs\
    \ are classified as \"oh shit\"\n\n# No Bugs\n\nbugs - based on the phrase usually\
    \ heard when the bug is first reported to the developer responsible.\n\nThe place\
    \ to write down these concerns is in the code itself. Anywhere else and the place\
    \ it is written can get lost. If in the code - its forever, or until you resolve\
    \ the question.\n\nIn these cases, place a one-line comment, the word \"bug\"\
    \ followed by your initials and the date. You can follow this with a comment that\
    \ runs for several lines, but the first line should give a reasonable description.\n\
    \n# BUGBUG\n\nThe program example below illustrates the use of the BUGBUG comment.\n\
    \n```\n// BUGBUG DNT 32/1/92 - No memory. Should we go to disk?\n// At the moment\
    \ if we run out of memory we fail. However,\n// if this runs on large files, running\
    \ out of memory could be\n// common.\n```\n\nThis BUGBUG accomplishes three things.\n\
    \n- By performing a grep or text search for BUGBUG on all the files, you get all\
    \ the title lines of open issues. (Note: in the asm chapter, a way is shown to\
    \ have the BUGS print to the screen during a compile. Unfortunately c doesn't\
    \ support printing during a compile in a manner that makes this possible.)\n\n\
    - The open issues travel with the code. You can't lose the list of open items\
    \ (unless you lose the code too).\n\n- The open items are right there at the relevant\
    \ spot in the code—you don't need to search all the files to find the correct\
    \ spot.\n\nWhen you ship a product, you should not have any BUGS in your code.\
    \ In the above example, you might have decided to go to disk. You might also have\
    \ decided you could limit yourself to memory. In either case, the question was\
    \ resolved.\n\nIf you don't use BUGBUG, you might forget or lose important issues.\
    \ You might not remember the issue until users report the bug after the program\
    \ ships. Using BUGBUG is simple, and it's more time-efficient than recording the\
    \ information elsewhere.\n\n# Keep it unobtrusive\n\nKeep your debugging as unobtrusive\
    \ as possible. The rest of your program should hardly be affected by debug code.\
    \ (The program might run a tad slower, and the user might see a pop-up debug message.)\
    \ Good debug checking stays hidden and out of the way until it finds a MFU.\n\n\
    # Chapter 4\n\n# SOME BASIC TRICKS\n\nNow we get into the actual programming tricks.\
    \ For those of you who have no idea how to program, if you're still with us, its\
    \ time to skip to the chapters on testing. For those of you in management, its\
    \ time to give your developers a raise and then skip to the testing chapters.\n\
    \nThis chapter has all the tricks that don't deserve a chapter of their own. This\
    \ isn't to say these tricks aren't important, merely that they can be explained\
    \ in fewer words. This, and the rest of the chapters until we get to the testing\
    \ process, the tricks are described generically. Most important, these tricks\
    \ will allow you to painlessly eliminate bugs from your programs.\n\n# TestAll\
    \ functions\n\nSuppose your program is mysteriously crashing. You don't know why\
    \ or exactly. But then you place the TestAll function at various points in your\
    \ program. You are now able to narrow down the bug. TestAll reports all is okay\
    \ and then, 20 lines later, reports an error.\n\nSo what is this magical TestAll\
    \ function? Quite simple, it calls every test function you have. At a minimum,\
    \ it checks the NULL memory locations, the entire heap, and the amount of stack\
    \ left. It also asserts global data structures. In Windows programs, it calls\
    \ the ValidateSegments and ValidateFreeSpaces.\n\n# TestAll function\n\nThe program\
    \ example below illustrates the implementation of TestAll.\n\n```\nvoid TestAll\
    \ (void)\n{\n  // Test system\n  TestHeap();\n  TestStack();\n  TestNull();\n\
    \  #ifdef WIN\n  ValidateCodeSegments();\n  ValidateFreeSpaces();\n  #else\n \
    \ TestEms();\n  TestXms();\n  #endif\n\n  // Test global variables\n  AssertBool(bInsertMode);\n\
    \  AssertDbase(&MainDbase);\n}\n```\n\nAnytime you create a test function that\
    \ can be called anywhere (globally) to perform its test, that test should be added\
    \ to TestAll. Eventually, TestAll becomes very slow, and because of that you rarely\
    \ want to call it. In the below example, funcBad blows up due to an error in the\
    \ system. But the code looks error-free. By using the tests, you can determine\
    \ which function is\n"
  mdcn: "\n\n# 23. 无 Bug\n\n![](img/c29f9dc69d37305f082fd0bd64e612cf_32_0.png)\n\n\
    作为一种嵌入式软件应用程序，\nWindward Reports 为您的客户提供了高效且易于自定义的工具。\n\n作为一种内部报告设计解决方案，\nWindward\
    \ Reports 提高了企业报告工作的效率，并降低了报告的总成本。\n\n下载免费演示版：\nwww.windwardreports.com\n或\n\n\
    请求咨询：\nsales@windward.net\n\n# 在条件定义中调试\n\n为了保持速度，大多数时候你不会希望所有的条件错误检查都被编译。某些错误检查可能会耗费非常长的时间。（通常情况下，特定的检查并不耗费时间，而是该检查被调用的频率频繁）。\n\
    \n另一个通用原因是，如果你正在向终端或第二个显示器打印调试信息，并且你不希望有用信息被你其他你不感兴趣的信息所刷出屏幕。有时，纯粹的打印量会减慢程序，因为显示器只能以特定的速度写入屏幕，而不能更快。\n\
    \n针对这个问题，你可以采取两种主要方法之一。第一种是不编译额外的调试代码，使其完全不存在，但如果你决定需要找回某些调试打印，你将必须重新编译。下面的程序示例说明了条件编译的使用。\n\
    \n# 使用 DEBUG 的值\n\n```\n#ifdef DEBUG\nfast_test ();\n#endif\n#if (DEBUG > 1)\n\
    slow_test ();\n#endif\n#if (DEBUG > 2)\nreal_slow_test ();\n#endif\n```\n\n第二种方法是在调试代码开头测试一个标志位，如果测试失败则跳过它。如果标志位是一个变量，你可以在调试器中更改它的值，从而轻松地在程序运行途中开启调试测试/printf（或在不再需要它们后关闭它们）。\n\
    \n# 使用变量\n\n下面的程序示例说明了调试变量的使用。\n\n```\n#ifdef DEBUG\nfast_test();\nif (DebugVar\
    \ > 1)\n    slow_test();\nif (DebugVar > 2)\n    real_slow_test();\n#endif\n```\n\
    \n尽管有很多花哨的方法可以实现这种条件调试代码，但似乎有两个规则是通。第一，你通常不希望在编译后开启或关闭调试。第二，这两种实现方式在代码编写和执行速度上似乎是一样快的。\n\
    \n对于简单代码，调试通常是一个“开/关”问题。在这些情况下，仅使用 #ifdef 通常足够了，任何额外的操作都是浪费时间。对于其他虽然简单但包含几个耗时检查的代码，你可以使用\
    \ DEBUG 定义的值作为条件编译。\n\n在进行条件调试时，请记住，某些调试测试是相互匹配的。如果你的条件分配在每个分配内存区域的前后设置了签名字节，那么当任何检查堆签名字节的条件定义被执行时，最好也执行该操作。我曾花费了几个小时试图确定为什么某些缓冲区在\
    \ CRC 测试失败了——原因是 CRC 创建代码被 ifdef 过滤掉了，而检查代码没有。\n\n# 注释你的开放/待解决问题 (Issues)\n\n\
    随着你的开发，某些代码段中会出现问题或疑问：某个函数能在 Super VGA 显示器上工作吗？你如何处理带有特定错误的数据文件？你需要注意某些情况吗？\n\n\
    这些问题无法通过 Traps（陷获）和 IntTests（内部测试）来解决。相反，它们是你认为尚未完全编码的项目，或者在某些情况下你没有写全。在其他情况下，你的程序将在你需要它继续运行的条件下失败。\n\
    \n这些是你某个时候发生的可能逻辑错误。遗憾的是，由于人类思维的局限性，这些错误会被很快遗忘（直到 Bug 出现）。这些 MFU（不可预见的故障）被归类为“该死”。\n\
    \n# 无 Bug\n\nbugs - 源于当 Bug 首次报告给负责开发人员时通常听到的短语。\n\n记录这些担忧的地方是代码本身。写在其他任何地方都可能丢失。如果写在代码中——它就是永远的，直到你解决了该问题。\n\
    \n在这些情况下，请放置单行注释，单词“bug”后面跟着你的缩写和日期。你可以在其后加上几行的注释，但第一行应该给出一个合理的描述。\n\n# BUGBUG\n\
    \n下面的程序示例说明了 BUGBUG 注释的使用。\n\n```\n// BUGBUG DNT 32/1/92 - 内存不足。我们需要用磁盘吗？\n//\
    \ 目前如果内存耗尽就会失败。然而，\n// 如果在大文件上运行，内存不足可能会很。\n```\n\n这个 BUGBUG 完成三件事：\n\n- 通过在所有文件中对\
    \ BUGBUG 进行 grep 或文本搜索，你可以获得所有开放问题的标题行。（注意：在汇编章节中，展示了一种在编译期间将 BUGS 到屏幕的方法。遗憾的是，C\
    \ 不支持这种方式的编译期间打印。）\n\n- 开放问题随代码迁移。你不会丢失开放项目列表（除非你也丢失了代码）。\n\n- 开放项目就在代码中相关的位置——你不需要搜索所有文件来找到正确的位置。\n\
    \n当你交付产品时，你的代码中不应该有任何 BUGS。在上面的示例中，你可能决定改用磁盘。你也可能决定将自己限制在内存中。无论何种情况，问题都解决了。\n\n\
    如果你不使用 BUGBUG，你可能会忘记或丢失重要问题。在程序发布后用户报告 Bug 之前，你可能不会记得这个问题。使用 BUGBUG 是简单的，而且比在其他地方记录信息更有效率。\n\
    \n# 保持不显眼\n\n让你的调试尽可能不显眼。程序的其余部分应该几乎不受受到调试代码的影响。（程序可能会运行得稍微慢一点，用户可能会看到弹出的调试消息。）良好的调试检查在发现\
    \ MFU 之前一直保持隐藏且不干扰。\n\n# 第 4 章\n\n# 基础技巧\n\n现在我们进入实际的编程技巧。对于那些完全不知道如何编程的人，如果你仍然和我们在一起，是时候跳到关于测试的章节了。对于管理层的人，是时候给你的开发者加薪了，然后跳到测试章节了。\n\
    \n本章包含了所有不值得单独成章的技巧。这并不是说这些技巧不重要，而是说可以用更少的文字来解释。在本章以及直到进入测试过程之前的章节中，这些技巧将被通用描述。最重要的是，这些技巧将允许你无痛苦地消除程序中的\
    \ Bug。\n\n# TestAll 函数\n\n假设你的程序正在神秘地崩溃。你不知道具体原因。但随后，你在程序中的各个位置放置了 TestAll 函数。现在你能够缩小\
    \ Bug 的范围。TestAll 报告一切正常，然后在 20 行后报告了一个错误。\n\n这个神奇的 TestAll 函数是什么？非常简单，它调用你所有的测试函数。至少它会检查空内存位置、整个堆以及剩余的栈空间。它还会断言全局数据结构。在\
    \ Windows 程序中，它调用 ValidateSegments 和 ValidateFreeSpaces。\n\n# TestAll 函数\n\n```\n\
    void TestAll (void)\n{\n  // 测试系统\n  TestHeap();\n  TestStack();\n  TestNull();\n\
    \  #ifdef WIN\n  ValidateCodeSegments();\n  ValidateFreeSpaces();\n  #else\n \
    \ TestEms();\n  TestXms();\n  #endif\n\n  // 测试全局变量\n  AssertBool(bInsertMode);\n\
    \  AssertDbase(&MainDbase);\n}\n```\n\n每当你创建一个可以在任何地方（全局）调用以执行测试的测试函数时，该测试都应该添加到\
    \ TestAll 中。最终，TestAll 会变得非常慢，因为这个原因，你很少调用它。在下面的示例中，funcBad 因为系统错误而崩溃。但代码看起来是无错误的。通过测试，你可以确定哪个函数是\n\
    \n"
