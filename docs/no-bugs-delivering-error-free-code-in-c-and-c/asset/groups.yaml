  mdcn: "\n# 字符串析构函数\n\n作用域内，你现在正在检查每一个变量。这是一个强大的工具。\n\n其次，你用 `FILL_CHAR` 填充数据结构。然后，如果你在变量被销毁后访问它，你将获得垃圾数据。你还会重写\
    \ ID，导致 ID 错误。你特意重写了 ID，以确保 `memset` 实例的 `FILL_CHAR` 等于正确的 ID 值。\n\n下面的程序示例说明了字符串析构函数的使用。\n\
    \n```cpp\n// note - 在非调试模式不需要析构函数\n#if DEBUG\nstring() : ::string ()\n{\n    //\
