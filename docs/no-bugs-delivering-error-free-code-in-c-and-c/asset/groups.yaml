    \ below illustrates the use of BUGBUG in masm.\nBUGBUG  macro str\nif PRNT_BUGBUG\n\
    %out BUGBUG: str\nendif\n```\n\n> BUGBUG <\"Do we need to fix this?\">\n\n# Checking\
    \ registers\n\nWhen leaving an assembly language function, each of the registers\
    \ falls into one of four categories.\n\n+   - The registers that you return in.\
    \ then usually value is returned in AX. These return values can often be asserted,\
    \ in which case, with c, they should be asserted on.\n- The registers that the\
    \ function should have preserved. For example, it's a very rare function that\
    \ will exit with a value for SS and SP different from that it was entered with.\
    \ Be sure these values did not change on return. It is okay if they were changed\
