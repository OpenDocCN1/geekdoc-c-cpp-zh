    implementing all of the tricks listed in the following chapters.


    The principles discussed here hold, not just for the methods described in this
    book, but for almost any other tricks you may invent yourself. Another way to
    view this chapter as a philosophy to follow. For non-programmers, this chapter
    is readable but definitely optional. For developers, this chapter is the basis
    for all the following chapters on programming tricks.


    # Debug code is read only


    A common problem I have seen in many programs is that the program runs fine with
    debugging turned on but blows up with debugging turned off. (Debugging can be
    turned on and off many ways as discussed in the book. However, the most common
    is with the use of #idef DEBUG and #endif.) I even know of one commercial program
    that was shipped with debugging turned on, but its debug printf disabled, because
    it wouldn''t run in non debug mode.


    This problem generally occurs because the code in its debug checking, will return
    from a function if it determines an incorrect parameter is passed. However, if
    debug is turned off, the same checking does not occur and the function does not
    return an error.


    There is a simple solution to this. All debug code should be read-only. What does
    this mean? Obviously it means data but never writes to it. Just as important however
    is that it does not affect the code path. The debug code is executed - but it
    never causes the subsequent code path to change. Debug code is the equivalent
    of calling a function that returns void.'
  - "[PAGE 23]\n\nAll debugging code should be placed within an #ifdef DEBUG so that\
    \ the testing can be turned on and off. In addition, put all functions used exclusively\
    \ in debug mode within #ifdef DEBUG so the function doesn't exist in the final\
    \ version of the program. The linker will then let you know if you are still calling\
    \ debug code with debug turned off.\n\n# Debug code\n\n```\n#ifdef DEBUG\nvoid\
    \ DebugCheck(char *p)\n{\n    ...\n}\n#endif\n```\n\nIn the case of macros, you\
    \ can define the debug macro inside a #ifdef DEBUG and then define a macro that\
    \ generates no code for the #else. Using macros leaves your code a lot cleaner.\
    \ Instead of #ifdef DEBUG statements littered throughout your code, you have just\
    \ the macros, resulting in cleaner-looking code. The example below illustrates\
    \ the use of these macros.\n\n# Debug macros\n\n```\n#ifdef DEBUG\n#define DebugMacro(p)\
    \ DebugCheck(p)\n#else\n#define DebugMacro(p)\n#endif\n```\n\n# Using Debug Macros\n\
    \n```\n// clean:\np = GetBuf(0);\nDebugMacro(p);\nWriteBuf(p);\n```\n\n```\n//\
