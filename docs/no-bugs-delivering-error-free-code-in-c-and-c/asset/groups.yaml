    ## 96 No Bugs


    The rest is all straightforward. When freeing an EMS handle, remove it from the
    Hdl linked list. Then fill it with FILL_CHAR before freeing the EMS memory. When
    reallocating a hdl, if it expands, fill the new pages with FILL_CHAR. When your
    program ends, walk the linked list to identify any memory that was not freed.


    A cautionary note: Lot of the EMS drivers, mainly hardware-based ones, have bugs
    in them (their developers must not have read this book). What''s worse, these
    bugs usually crop up only in specific cases (for example, copying 16K plus 2 bytes
    that exactly crosses three pages). Although copy seems to be the function that
    has the most problems, it''s not the only one. If you are chasing a bug memory
    that only happens on one system, it might not be your fault.


    ## Extended memory (XMS)


    The only way to access extended memory is as described in the XMS specification.
    There is no excuse for doing it any other way anymore, and you will trip over
    other programs if you use another method such as int15. Using another method is
    a very good way to guarantee bugs, in which case you will have systems where your
    program and another program use the same extended memory.


    On all copies to from XMS, verify that the number of bytes passed to copy is even.
    This is a requirement of the XMS specification. However, it is enforced on some
    XMS handlers and not on others. Passing in an odd number of bytes will lead to
    errors on some systems.


    If you lock XMS memory, be sure you track locks. Locks can cause XMS memory to
    become fragmented, which can make it a lot less usable. On an XMS free, you should
    pop up a box if the memory is still locked. You should also list it if it is locked
    when unfreeded memory at the end of your program.


    ## Chapter 9


    ### FILE I/O


    A write-only program is probably one of the deadly MFUs in existence. A write-only
    program is one that can save its data to a file but then can''t read back. There
    is a bug either in how it was written or in the code reading back. However, by
    the time the user realizes the problem, its usually too late - the data is gone.
    (Sysos is infamous for this, you can backup your data to tape but just try and
    restore any of it.)


    Also, in terms of general bugs, many applications assume that most operations
    will succeed. I know of numerous compilers and linkers (names withheld to protect
    the guilty) that simply bomb out if the ram disk they are using for a temporary
    file fills.


    This chapter covers what we can do to try and make our file I/O bug free. Two
    checks are particularly powerful, consistency checking of the file and assertion
    checking of file records. Unfortunately, these are program specific checks and
    therefore need to be written on a file-type-by-file-type basis.


    ### Consistency checks


    Most files used by programs are not ASCIIis. They are data files of some type.
    (When a linker makes an .EXE file, the EXE file at that time is a data file.)
    Any data file must obey certain rules.


    Sometimes the rules are very simple. For example, a WordStar text file is relatively
    freeform. However, the eighth bit should be set relatively often in it and at
    the first letter of a word.


    At other times the rules are very strict and complex. In these cases, it is relatively
    easy to tell whether the file is truly of the data type you expect. Even more
    important, in this case, you can determine whether the file is good or corrupted.


    ## 98 Bugs


    Using the rules, you can write a consistency check for a file. This consistency
    check, when passed a file handle, checks the file. After each open and before
    each close, you then call this consistency check.


    If the check takes too much time, the #if DEBUG > 4 so it is used only when the
    tester is willing to trade off speed for extreme debug checking. Also, if possible,
    have separate open and close functions for each data type. This makes it easier
    to include the checks.


    This check should be as thorough as possible. If your program is fed a bad data
    file, you don''t want to waste time tracking non-existent bugs in your code (after
    all, you have real bugs to find). When you create a file, if it writes bad data
    then the data is gone forever in many cases.


