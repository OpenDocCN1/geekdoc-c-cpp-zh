- md: "\n## How to use the memory\n\nThe following practices will not solve all of\
    \ your heap problems, but they will take you a long way in that direction. The\
    \ beauty of this system is that once you start using it, it stays pretty invisible\
    \ until you make a mistake. When you make a mistake in handling your heap, it\
    \ will usually tell you exactly where to look for the bug.\n\n## Be sure freed\n\
    \nAllocDone should be called at the end of your program. This is a final check\
    \ to ensure the heap is not corrupted and that you have freed up all allocations.\
    \ Although it's okay to not free a pointer that must remain malloced for the entire\
    \ life of the program, you should be sure that all pointers that are used for\
    \ periods shorter than the life of the program were freed.\n\nI free all pointers\
    \ that exist for the life of the program before calling AllocDone. That way, if\
    \ I see any elements left in the heap, I know that I forgot to free a pointer\
    \ somewhere.\n\n## AllocDone\n\nThe program example below illustrates the use\
    \ of AllocDone.\n\n```c\nFLAG _AllocDone ()\n{\n    if (_AllocHeap.pNextAlloc\
    \ == NULL)\n    {\n        Printf(\"NO remaining Allocs\\n\");\n        return\
    \ (false);\n    }\n\n    DebugPrintf(\"Remaining Allocs:\\n\");\n    if (_AllocWalkHeap(true))\n\
    \        DebugPrintf(\"ERROR: Alloc Heap Corrupted\\n\");\n    return (true);\n\
    }\n```\n\n## Asserting a pointer to the heap\n\nThere are times we will want to\
    \ assert a pointer that we believe is allocated from the heap (and is at least\
    \ n bytes long). Using _AllocChkHeap, we can verify that our pointer is good.\
    \ Using _AllocSize, we can then verify the length.\n\n## AssertHeapPtr\n\n```c\n\
    #if DEBUG > 0\n#define AssertHeapPtr(p, s) CheckHeapPtr (p, s)\n#else\n#define\
    \ AssertHeapPtr(p, s)\n#endif\n...\nvoid CheckHeapPtr(void *pMem, unsigned uLen)\n\
    {\n  ALLOC *pAlloc;\n  unsigned uSize;\n\n  // Get the ALLOC struct\n  pAlloc\
    \ = ((ALLOC *) pMem) - 1;\n\n  // See if it is a legit pointer\n  if (_AllocChkHeap(pAlloc))\n\
    \    return;\n\n  // Check its size\n  if ((uSize = AllocSize(pMem)) < uLen)\n\
    \    DebugPrintf(\"Pointer from %s:%d, memory, and %d < required len %d\\n\",\
    \ pAlloc->fileName, pAlloc->iFileLine, uSize, uLen);\n}\n```\n\n## EMS and XMS\n\
    \nEMS and XMS provide similar functions and are more difficult to check than heap\
    \ allocations. They are also trickier than regular memory, and we are therefore\
    \ more likely to make a mistake with them. Therefore, it is imperative to check\
    \ calls to this memory as thoroughly as possible.\n\nEMS and XMS are becoming\
    \ less and less important as time goes on. Windows doesn't use them. DOS applications\
    \ that need lots of memory are generally now being written as DPMI applications,\
    \ while they use XMS, the DPMI server and an application doesn't make any XMS\
    \ calls itself.\n\nIf you do not care about EMS or XMS, read the section below\
    \ on handle tracking (also used in Chapter 9, \"File I/O\") and then skip the\
    \ rest of the chapter. I have included very little code in the following sections,\
    \ only enough code to convey the basic concepts. Full code is available on the\
    \ companion disk.\n\n## Handle tracking\n\nUnfortunately, you cannot place headers\
    \ and titles on EMS/XMS memory as you can on the heap. However, you can still\
    \ implement most of the checking you can have with the heap.\n\nFirst of all,\
    \ for each EMS/XMS allocate, we allocate a header like the one we use with the\
    \ heap. However, this memory is generated by a malloc in regular memory. We use\
    \ this malloc memory to track our usage of EMS and XMS memory (as well as file\
    \ handles in the next chapter).\n\nThese structures hold the handle of the malloced\
    \ memory. Because each handle is unique, you have a linked list for EMS and another\
    \ for XMS. This adds a small amount of processing. With heap memory, you know\
    \ where the structure is when passed a pointer. With EMS and XMS, you have to\
    \ walk the appropriate linked list to find the handle you were passed.\n\nTo do\
    \ this, we create a set of handle calls. The first creates a linked list. Each\
    \ linked list has a different data size to store the information associated with\
    \ a given set of handles. This becomes important when used with files where you\
    \ want to store the filename, which can be 74 bytes long.\n\n## HdlCreate\n\n\
    The program example below illustrates the use of allocating memory to go with\
    \ a handle.\n\n```c\ntypedef struct S_HANDLE_NEXT\n{\n    struct S_HANDLE_NEXT\
    \ *pNext;\n    int iHdl;\n} HANDLE_NEXT;\n\ntypedef struct S_HANDLE_HDR\n{\n \
    \   HANDLE_NEXT sHdlNext;\n    unsigned uSize;\n} HANDLE_HDR;\n\nHANDLE_HDR *HdlCreate\
    \ (unsigned uSize)\n{\n    HANDLE_HDR *phdl;\n\n    if (phdl = malloc(sizeof (HANDLE_HDR))\
    \ == NULL)\n        return (NULL);\n\n    memset(phdl, 0, sizeof (HANDLE_HDR));\n\
    \    phdl->uSize = uSize;\n    return (phdl);\n}\n```\n\nOnce you have created\
    \ a list, you need to add an element to the list each time you get a handle. You\
    \ allocate enough memory to hold a HANDLE_NEXT. This structure holds the handle\
    \ of the malloced memory. Because each handle is unique, you have a linked list\
    \ for EMS and another for XMS. This adds a small amount of processing. With heap\
    \ memory, you know where the structure is when passed a pointer. With EMS and\
    \ XMS, you have to walk the appropriate linked list to find the handle you were\
    \ passed.\n\nTo do this, we create a set of handle calls. The first creates a\
    \ linked list. Each linked list has a different data size to store the information\
    \ associated with a given set of handles. This becomes important when used with\
    \ files where you want to store the filename, which can be 74 bytes long.\n\n\
    Once you have created a list, you need to add an element to the list each time\
    \ you get a handle. You allocate enough memory to hold a HANDLE_NEXT. This structure\
    \ holds the handle of the malloced memory. Because each handle is unique, you\
    \ have a linked list for EMS and another for XMS. This adds a small amount of\
    \ processing. With heap memory, you know where the structure is when passed a\
    \ pointer. With EMS and XMS, you have to walk the appropriate linked list to find\
    \ the handle you were passed.\n\n## HdlAdd\n\nThe program example below illustrates\
    \ the use of adding memory to a handle.\n\n```c\ntypedef struct S_HANDLE_NEXT\n\
    {\n    struct S_HANDLE_NEXT *pNext;\n    int iHdl;\n} HANDLE_NEXT;\n\ntypedef\
    \ struct S_HANDLE_HDR\n{\n    HANDLE_NEXT sHdlNext;\n    unsigned uSize;\n} HANDLE_HDR;\n\
    \nvoid HdlAdd(HANDLE_HDR *phdldr, int iHdl, void *pData)\n{\n    HANDLE_NEXT *phdlNext;\n\
    \n    // Allocate memory for the new element\n    if ((phdlNext = malloc(sizeof(HANDLE_NEXT)))\
    \ == NULL)\n    {\n        return;\n    }\n\n    // Add ourselves to the front\n\
    \    phdlNext->pNext = phdldr->sHdlNext;\n    phdldr->sHdlNext = phdlNext;\n \
    \   phdlNext->iHdl = iHdl;\n\n    // If you store additional data, save it\n \
    \   if (phdldr->uSize)\n        memcpy(phdldr + 1, pData, phdldr->uSize);\n}\n\
    ```\n\nWhen you free a handle, you need to do the same in your linked list. You\
    \ do this with HdlDelete. It removes the element from the linked list and then\
    \ frees.\n\n## No Bugs\n\nThe HdlFind provides the ability to find a linked list\
    \ element based on its handle value. This call gives us the functionality we need\
    \ both to verify a handle and to retrieve the size of a handle's memory block.\n\
    \n## HdlFind\n\nThe program example below illustrates HdlFind\n\n```c\nvoid *HdlFind\
    \ (HANDLE_HDR *phdldr, int iHdl)\n{\n    HANDLE_NEXT *phdlOn, *phdlPrev;\n\n \
    \   phdlPrev = &(phdldr->sHdlNext);\n\n    while ((phdlOn = phdlPrev->pNext) !=\
    \ NULL)\n    {\n        // If you find it - return the associated data\n     \
    \   if (phdlOn->iHdl == iHdl)\n            return (phdlOn + 1);\n\n        phdlPrev\
    \ = phdlOn;\n    }\n\n    return (NULL);\n}\n```\n\nTo verify a handle, all you\
    \ have to do is see whether HdlFind returns a non-null value. At the beginning\
    \ of each EMS and XMS function, you merely add the following code segment.\n\n\
    ## HdlExist\n\nThe program example below illustrates the use of HdlFind to see\
    \ if a passed in handle is legit.\n\n```c\n#if DEBUG\n    if (! HdlFind (phdlHREms,\
    \ iHdl))\n        MessageBox(\"func, %d, ...\\nBad Handle\", iHdl);\n#endif\n\
    ```\n"
  mdcn: "\n\n## 如何使用内存\n\n以下实践无法解决你所有的堆内存问题，但它们将让你在这个方向上走得很远。这个系统的精妙之处在于，一旦你开始使用它，在你出错之前，它会一直保持隐形状态。当你在处理堆内存时出错时，它通常会准确地告诉你去哪里查找\
    \ bug。\n\n## 确保已释放\n\n应该在程序结束时调用 `AllocDone`。这是一次最终检查，用以确保堆没有损坏，并且你已经释放了所有分配。虽然不释放在整个程序生命周期内必须保持\
    \ `malloc` 状态的指针是可以的，但你应该确保所有使用周期短于程序生命周期的都已释放。\n\n在调用 `AllocDone` 之前，我会释放所有在程序生命周期内存在的指针。这样，如果我看到堆中留有任何元素，我就知道我在某处忘记释放指针了。\n\
    \n## AllocDone\n\n下面的程序示例说明了 `AllocDone` 的用法。\n\n```c\nFLAG _AllocDone ()\n{\n\
    \    if (_AllocHeap.pNextAlloc == NULL)\n    {\n        Printf(\"NO remaining\
    \ Allocs\\n\");\n        return (false);\n    }\n\n    DebugPrintf(\"Remaining\
    \ Allocs:\\n\");\n    if (_AllocWalkHeap(true))\n        DebugPrintf(\"ERROR:\
    \ Alloc Heap Corrupted\\n\");\n    return (true);\n}\n```\n\n## 断言堆指针\n\n有时我们可能想要断言一个我们认为是从堆上分配的指针（且至少有\
    \ `n` 字节长）。使用 `_AllocChkHeap`，我们可以验证指针是否是正确的。之后使用 `_AllocSize`，我们可以验证其长度。\n\n\
    ## AssertHeapPtr\n\n```c\n#if DEBUG > 0\n#define AssertHeapPtr(p, s) CheckHeapPtr\
    \ (p, s)\n#else\n#define AssertHeapPtr(p, s)\n#endif\n...\nvoid CheckHeapPtr(void\
    \ *pMem, unsigned uLen)\n{\n  ALLOC *pAlloc;\n  unsigned uSize;\n\n  // 获取 ALLOC\
    \ 结构体\n  pAlloc = ((ALLOC *) pMem) - 1;\n\n  // 检查是否为合法指针\n  if (_AllocChkHeap(pAlloc))\n\
    \    return;\n\n  // 检查其大小\n  if ((uSize = AllocSize(pMem)) < uLen)\n    DebugPrintf(\"\
    Pointer from %s:%d, memory, and %d < required len %d\\n\", pAlloc->fileName, pAlloc->iFileLine,\
    \ uSize, uLen);\n}\n```\n\n## EMS 和 XMS\n\nEMS 和 XMS 提供类似的功能，并且比堆分配更难检查。它们也比普通内存更复杂，因此我们更容易在它们上面出错。因此，必须尽可能彻底地检查对此类内存的调用。\n\
    \n随着时间的推移，EMS 和 XMS 变得越来越不重要。Windows 不使用它们。需要大量内存的 DOS 应用程序通常被编写为 DPMI 应用程序，它们使用\
    \ DPMI 服务器，而应用程序本身不进行任何 XMS 调用。\n\n如果你不在乎 EMS 或 XMS，请阅读下面关于句柄跟踪的部分（也用于第 9 章“文件\
    \ I/O”），然后跳过该章节的其余部分。我在后续章节中包含的代码很少，仅足以传达基本概念。完整代码可以在配套磁盘上找到。\n\n## 句柄跟踪\n\n遗憾的是，你无法在\
    \ EMS/XMS 内存上像在堆上那样放置头文件和标题。然而，你仍然可以实现大部分在堆上可以进行的检查。\n\n首先，对于每个 EMS/XMS 分配，我们都会分配一个类似于我们在堆上使用的头文件。但是，这段内存是通过普通内存中的\
    \ `malloc` 生成的。我们使用这段 `malloc` 内存来跟踪对 EMS 和 XMS 内存的使用（下一章将跟踪文件句柄）。\n\n这些结构体持有\
    \ `malloc` 内存的句柄。由于每个句柄都是唯一的，所以你为 EMS 有一个链表，为 XMS 有另一个。这增加了少量的处理开销。对于堆内存，当你传递指针时，你知道结构体所在的位置。对于\
    \ EMS 和 XMS，你必须遍历相应的链表来找到传递给你的句柄。\n\n为了做到这一点，我们创建了一组句柄调用。第一个创建一个链表。每个链表都有不同的数据大小，用于存储与给定句柄集关联的信息。这在与文件配合使用时变得很重要，因为你可能需要存储长达\
    \ 74 字节的文件名。\n\n## HdlCreate\n\n下面的程序示例说明了为了配合句柄分配内存的用法。\n\n```c\ntypedef struct\
