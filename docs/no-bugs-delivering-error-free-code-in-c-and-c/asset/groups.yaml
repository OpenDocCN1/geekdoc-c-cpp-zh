    # CRC Checking


    Personally, I have never seen the need for CRC checks. However, a developer I
    respect a lot swears so I leave it up to you. I am sure there are times it can
    pay off.


    The first place to use CRC checking is on data structures (especially those buffering
    generic data). By performing a CRC check, you gain two additional checks. First,
    if there is no way to make a consistency check (the buffer is reading a binary
    file - any values are legit) of the buffer, we can still verify that the data
    is good.


    Second, if we want to make sure the structure hasn''t changed to a different set
    of consistent data, the CRC will tell us if the data set we believe, even if the
    data passes our consistency test.


    Another useful check is to verify that you didn''t write to CONST segments. If
    you use Bounds Checker (see the tools chapter) or you are running under a protected
    mode operating system (such as a Windows application in standard or enhanced mode),
    it will do this for you. However, if you don''t have these options, you can perform
    a CRC of these segments on'
