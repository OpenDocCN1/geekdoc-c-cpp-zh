    ## 断言救急


    为了解决这个问题，我们大量使用了断言能力。一个 `assert` 函数检查一个布尔表达式，如果为真，则调用警告信息函数。例如，你可以在将字符串拷贝到 16
    字节的静态缓冲区之前放置 `assert(strlen(pStr) < 16);`。如果字符串长度超过了 15 字节，断言宏将打印一条信息，列出导致错误的源文件路径和行号。


    ## Assert 宏




    下面的程序示例说明了标准 `assert` 的用法。


    ```

    #ifdef DEBUG

    #define assert(b) ( b ? printf("##b in File: %s, Line: %d\n", __FILE__, __LINE__)
    : )

    #else

    #define assert(b)

    #endif

    ```


    在大多数情况下，断言中的代码是非常快的，所以要在代码中到处使用断言。你不会看到很大的性能影响。但当断言失败时，它会直接指向错误，并显示文件名和行号。


    在大多数情况下，诚实的答案是你认为一个变量持有某个值。


    “不知道”这一事实是编程的一部分。如果你编写一个底层函数，你无法控制调用你函数的代码。在一个复杂的过程中，你认为自己理解代码可能采取的每条路径，但你无法确定。


    ## 无 Bug


    你假设某些情况不会发生，或者在代码的某些地方必须发生。在代码中放置一个断言来测试这种情况，并在不可能发生或确定情况失败时进行打印。放置这些断言的最佳方法是在完成后查看函数函数并问自己可能会出现问题。通常代码中的一个或多个地方会引起你的注意。在那里放置一个。在调试过程中，你还会遇到本可以通过
    `assert` 解决的 bug。在那里放置一个，并在下次放置断言时记住这种情况。


    例如，如果你假设两个 `int` 相乘的结果始终是一个 `int`，那么就 `assert((long)i * (long)i < 0x7FFF);`。当你遍历树时，如果你假设某个指针总是有效的，那么就
    `assert(pTree != NULL);` 或 `assert(pTree->uID == ID_TREE);`。最重要的断言之一是在调用函数或返回结构体时，检查结构体的
    ID。


    ## 断言字符串


    下面的程序示例说明了字符串断言的用法。


    ```

    #ifdef DEBUG

    ```

