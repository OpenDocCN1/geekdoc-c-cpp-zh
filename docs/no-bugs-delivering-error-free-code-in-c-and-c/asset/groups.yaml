  - '[PAGE 157]


    As the beta progresses, track your beta sites. If a beta site never reports bugs,
    they are of no use to you, and you shouldn''t bother to include them the next
    time you do a beta. There is an exception for beta sites who need advance access
    to your product for a product of their own. Even if they don''t report bugs, they
    need the beta.


    Beta sites that report bug after beta need to be rewarded (with a plaque if nothing
    else). If, after your final beta, you make a change that "sort of" impacts the
    core code, you might choose to select a post-beta out to just these sites.


    A number of companies now seem to seek for a larger beta program than any other.
    After a certain number of sites, there is no benefit in gaining additional sites.
    Pick a number, and try very hard to not go over it. For a general-purpose product
    that sells millions of copies, I see no advantage in having more than 5000 beta
    sites.


    For a vertical market application with 1000 total customers, 50 beta sites is
    more than enough (and 20 might be enough). Pick the right beta sites. Picking
    20 people who don''t actually use the beta is of no use.


    Track who reports bugs on your existing products. Ask (beg if necessary) those
    in the top 1 or 2 percent to be beta testers. Those who call up with good suggestions
    for future products should also be beta test sites.


    You are looking for quality, not quantity.


    # Handling bug reports


    When a beta site calls in a bug report, the beta program is actually providing
    its value. Equally important, during this the beta tester receives feedback that
    will encourage or discourage him or her in the future.


    When a bug report comes in, a tester needs to check whether the same bug has already
    been reported. If it has not, the tester needs to insure that enough information
    has been reported to duplicate the bug. An incomplete bug report is of no use.


    If the beta tester calls in the bug report or if a tester needs to call the beta
    site for additional information, the tester must make the beta site feel appreciated.
    Thank them for finding the bug; don''t yell at them and tell them now that you''ll
    have to stay at work all night because of what they found.'
  - '[PAGE 158]


    Let them know that you appreciate their time in testing and reporting the bug.
    Without this positive feedback, a beta site will probably not report the next
    bug they find. Make them feel like an important, appreciated member of the development
    team.


    The bug needs to be entered into the bug database. This allows it to be assigned
    to a developer to be fixed. Special care should be taken at this time to ensure
    this bug has not already been reported.


    You might also want to have a tester reproduce the bug before entering it into
    the database. A number of the reported bugs are either from earlier versions or
    were not bugs at all. Some others are specific to the hardware the user is using.
    In any of these cases, there is no point in having the developer attempt to fix
    the bug until it can be reproduced.


    When a bug is resolved, have a means of letting the beta site know it was fixed,
    and again thank them. If they were the first to report it, let them know that
    too.  If a beta site thinks you are ignoring their reports, they will give up.
    People are amazingly willing to help us out by testing our programs. However,
    almost no one is willing to do it if they think they are being ignored.


    If you have a user newsletter, give awards in it to your top 10 beta sites. If
    you have a user''s group meeting, present the beta testers with plaques. Find
    some way to show your appreciation in front of their peers. Make every user aspire
    to finding more bugs than any other.


    The success of your beta program rests primarily on three things: Who you get
    as beta testers, how motivated they are to find bugs, and how you act on the bugs
    reported.'
  - '[PAGE 159]


    # # Chapter 15


    # ## SHIPPING THE PRODUCT


    This chapter attempts to address that most difficult of all questions, when to
    finally ship the product. I say attempt because this is the hardest question of
    all answer.


    Yet it is also one of, if not the critical question. Ship too soon and the MFUs
    in the program will force you to fix disks. Ship too late and someone may beat
    you to market. At the least, you''ve delayed the revenue you may need to survive.


    This question is difficult because, with adequate testing (you followed the previous
    chapter didn''t you), you will never have no bugs. Instead, you are trying to
    come up with a release that has no bugs serious to stop you from shipping the
    program.


    As you get close to completing the final beta version of your software, you will
    build a release candidate. You will ship this as the final product –unless a significant
    bug is found. (If the developers are still working on bug fixes for the program,
    then you are now close to the release candidate stage.)


    You should put this release candidate through full regression tests (all of your
    automated and manual tests). If the software passes the regression tests, then
    everyone on the project, testers and non-testers should try to break the program.
    They should spend a couple of days doing nothing but beating on the product.


    At this point, you need to send this "mini-beta" release candidate to everyone
    in the company as well as selected beta sites. As I mentioned earlier, send it
    to the beta sites that found the most errors in the past. You might also want
    to put the beta on CompuServe or another bulletin board for beta testers to download.
    It doesn''t cost you anything to do, and it gets you an additional pool of testers.


    © Copyright 1992 by David Thiel - All Rights Reserved'
  - '[PAGE 160]


    This final test should last at least a week. If you made changes to core parts
    of the program or to the file structure of its files, this test should last a
    month. There is simply no way to shorten this period; it takes time for users
    to manipulate the program in different ways, exercising unique combinations of
    the code.


    When the program has passed the tests, it is ready for release to the manufacturer.
    Have "manufacturing" send you the first 10 sets of disks made. Take those disks,
    and have everyone in your group install the program from the disks and test again.
    Be sure that what you sent to manufacturing is what you get back. Comparing the
    disks isn''t good enough; you should be sure the program runs.


    # Release or not to release


    If the release candidate fails any of the regression tests, you must decide whether
    the bug is a release-stopper. Fixing a bug can introduce a new, unknown bug. If
    you make a change, you need to take the time to repeat the entire cycle. You need
    to be totally paranoid that the fix might have introduced a subtle, yet very serious
    bug into the program. If the change was in an area of any significance, you need
    to send the program out to a "mini-beta" testing group again.


    Even if you can fix the bug while introducing new ones, you are not necessarily
    doing your users any favors by doing so. What you have now, with the bug, might
    be more useful to them than what you can have in another month after fixing the
    bug and retesting.


    It is critical to look at the program as it is. Compare it to the program you
    could have in the future, with all the bugs fixed. When you compare these two
    programs, it might be obvious to which program your users would rather have.


    Making a bad choice in either direction can have serious ramifications. If you
    ship too buggy a product, then you get a bad reputation and your users switch
    to a competing product. If you wait, they might give up on you and go to a competitor.


    If you are worried that you will lose customers either way, then fix the bugs.
    If you ship, you lose customers and get a reputation for having a buggy'
  - '[PAGE 161]


    (unusable) product. If you ship late you lose customers, but you earn a reputation
    for solid software. The good reputation will usually gain you more new customers
    in the end.


    This decision-making is one of the most difficult parts of the development and
    testing process. The testing group needs to be involved at this point because
    often only they and developers have a clear idea of the bug and its ramifications.


    You obviously need to fix some bugs; however, mandatory fixes rarely come to light
    at the late stage. Bugs such as misspellings obviously do not need to be fixed.
    Sometimes, though, while no single bug is critical enough to merit fixing, all
    of them together are.


    Keep in mind that no matter well you test, you will ship a product with bugs that
    you haven''t discovered. And no matter extensive the beta testing, you might discover
    a serious bug after shipping. Do not keep fixing the product to remove the final
    little bugs so you can ship a bug-free product. Aiming for that will merely prolong
    the test period and deliver software that is no better.


    At the same time, don''t use the excuse that "all software is buggy" to ship a
    product with unacceptable bugs in it. Today''s users expect to find no bugs in
    your programs. At least 90 percent of your users should notice a bug in your product.


    A final note: Be sure to test just the builds leading up to the release candidate,
    but the release candidate itself. All of your efforts have been leading toward
    testing this specific build.


    # Management


    It is important that the testers not to report to a development lead. The testers
    should report to the person in charge of the technical support group because if
    the testers miss a bug, technical support pays the price. Technical support is
    the department that will get all the calls from unhappy users discovering all
    the MFUs you had in the program for them to find.


    If the testers report to the development lead, then, consciously or subconsciously,
    they will end up being encouraged to not find bugs—the death of effective testing.
    A development lead is not happy when bugs are found.


    © Copyright 1992 by David Thielen - All Rights Reserved'
- md: "\ndevelopment lead wants to finish development, and bug discovery prolongs\
    \ the process.\n\nAt a minimum, the testers' lead should report to the same person\
    \ the developers' lead reports to: the person responsible for shipping a successful\
    \ product. This ways the testers are reporting to someone responsible for a successful\
    \ product rather than for completing development.\n\nIf the testers are not part\
    \ of the technical support group, then they should talk to that group lot. Technical\
    \ support needs to work closely with the testers to minimize problems in the program.\
    \ It is a lot cheaper to make the program easier to use without asking questions\
    \ to staff up technical support. Many times technical support can find places\
    \ where small and easy changes in the program can reduce a significant number\
    \ of technical support requests.\n\n## Putting it all together\n\nAll of the above\
    \ leads back to where you started: The goal of testing is to identify bugs in\
    \ the program. You might not fix them all (in some cases it would be impossible\
    \ to do so), but you know what they are.\n\nThis allows the members of the project\
    \ to make intelligent decisions about what to fix and to leave. More importantly,\
    \ it allows project management to make an informed decision as to when to ship\
    \ the new product. Without proper testing, management is left deciding when to\
    \ ship based on guesswork—and then waiting for the inevitable bug to report in.\n\
    \nPC software development has improved greatly over the past several years. Users\
    \ have come to expect no bugs in operating systems (DOS 5 and Windows 3.1), and\
    \ users will see a few bugs in these programs.\n\nPopular software applications\
    \ are also reaching this point. Lotus recently introduced 1-2-3 spreadsheet program\
    \ for Windows and had to recall it due to a level of bugs that would have been\
    \ of no consequence two years ago. A year from now, users will expect all of their\
    \ general applications to be at this same level of robustness. Sooner or sooner\
    \ (not later), users will see a seemingly bug-free replacement for the application\
    \ they currently use. And they will buy it.\n\nAnd once user's general applications\
    \ are, in their view, bug free, they will demand freedom from bugs in their specific\
    \ applications. Developers writing vertical-market or in-house applications have\
    \ a only year or two to develop good, bug-free specific applications. Users aren't\
    \ stupid. If your word processor is well designed, full featured, and bug free,\
    \ and your vertical-market application isn't, then it will be painfully obvious\
    \ that it is not as good as it could be.\n\nTwo years from now the successful\
    \ software companies will have good test procedures in place and they will use\
    \ them. What they will do follow much, if not most, of what has been laid out\
    \ here—not necessarily because if all the staff read this book, but because they\
    \ follow the ideas enumerated here.\n\n## Dire warning\n\nMany companies already\
    \ follow the procedures I've described in this book. Over the next year many more\
    \ will begin to. If you wait a year or two to start, then you have have to wait\
    \ another year to get the procedures to work and turn out a properly tested product.\n\
    \nIf you want to be in business two years from now, set up testing procedures\
    \ now. Remember, if you don't turn out a successful product, it's not just you\
    \ might lose a job, it's everyone else in your company or division too. This is\
    \ serious stuff.\n\n- Implement proper testing procedures—don't simply go through\
    \ the motions.\n- Make use of the test results—don't ignore them.\n\n## Chapter\
    \ 16\n\n## USEFUL BUG-DISCOVERY TOOLS\n\nNow that the rest of the book has you\
    \ justifiably scared into discovering the the bugs in your code, how do you actually\
    \ do it. This chapter discusses a number of tools available in the PC market to\
    \ help you out.\n\nUnfortunately, there are not many good tools to help you discover\
    \ bugs. But three are worth their weight in gold. Bounds Checker is a must for\
    \ testing DOS programs, and Microsoft Test is a must for testing Windows programs.\
    \ MemCheck is invaluable out both systems.\n\nAside from these two tools, there\
    \ are a few other useful tools (listed below) as well as the ever critical debuggers.\
    \ There is a real need for additional tools to help discover bugs. I hope that\
    \ over the next several years, additional tools will become available to help\
    \ discovering bugs easier.\n\n## Bounds Checker\n\nEvery once in a while, someone\
    \ comes out with a new class of program: VisiCalc with the first spreadsheet,\
    \ Norton with the first Unerase, and now Mega with the first bounds checker. Any\
    \ developer who does not use Bounds Checker to test programs is guilty of gross\
    \ dereliction and as a lot of unnecessary time tracking down a class of bugs.\n\
    \nBounds Checker is actually very simple. It uses the memory mapping and page\
    \ faults of the 386 to set bounds on a program. It marks your code area as read-only\
    \ and your data area as read-write, marking all other memory limits. If your program\
    \ writes to anywhere except your data area or reads from any area other than your\
    \ code or data area, a page fault occurs, and Bounds Checker shows you which instruction\
    \ accessed out-of-bounds memory.\n\nBounds Checker turns itself off when a program\
    \ issues an interrupt. The code for the interrupt is usually not part of the program,\
    \ and Bounds Checker therefore legitimately accesses memory outside of the program's\
    \ area. It is even smart enough to track any DOS allocs and frees you do and allows\
    \ you to access only memory that you presently malloced.\n\nYou can list areas\
    \ that is ok for your program to access, such as the BIOS data area, video memory,\
    \ and EMS. If you simply specify EMS rather than a specific range, Bounds Checker\
    \ will even automatically determine the location of the EMS page frame. These\
    \ exception areas can be of any size (for the BIOS data area, I list the bytes\
    \ I read); can be listed as read-only, read-write, or write-only; and you can\
    \ allow any part of your program to access these ranges or just specific modules.\n\
    \nWhen it finds a fault, Bounds Checker tells you what part of your code made\
    \ the violation and what memory you were accessing, and it lists the call stack,\
    \ among other things. The call stack is valuable because memcmp is causing the\
    \ violation, the call stack shows you routine called memcmp with the bad pointer.\
    \ These violations are then written to a log file when the program exits, allowing\
    \ testers to use Bounds Checker without having to understand it.\n\nBounds Checker\
    \ does some limits. It is designed for foreground applications written in a high-level\
    \ language such as C. It allows one code area followed by one data area (each\
    \ area can be > 64K). This is the most serious limit. TSRs need more than foreground\
    \ applications. Ideally, Nu-Mega will come up with a method for working with TSRs\
    \ and allowing interspersed code and data areas.\n\nBoundsChecker also needs to\
    \ be more discriminating about segments. The data area should mark the constant\
    \ data as read-only. The EMS memory should only be accessible if pages belonging\
    \ to the are mapped in.\n\nThe above, however, would simply be frosting on the\
    \ cake: they would make an invaluable product even more essential. Nu-Mega is\
    \ already working on a number of improvements. As it stands, Bounds Checker is\
    \ almost certain to find all of your pointers— and definitely the far ones.\n\n\
    A program I wrote several years ago occasionally locked up when executing a certain\
    \ function. It happened very rarely and to me—I wasn't even sure it was a bug\
    \ because it was so rare. Bounds Checker found the memory violation the first\
    \ time I ran that function. I was writing to the DOS area, in a place that usually\
    \ wasn't catastrophic. In less than five minutes, I eliminated the bug.\n\nBounds\
    \ Checker makes it fast and easy to find bugs of this type and is one of the most\
    \ cost-effective development tools around it in terms of time saved. More importantly,\
    \ it completely eliminates a class of bugs (loose pointers, and so on) from programs\
    \ tested under.\n\nI believe that within a year it will be considered unacceptable\
    \ to sell a program that has not been tested with Bounds Checker as it is to sell\
    \ a program that has not gone through a decent test cycle.\n\n| Closest Label\
    \ | 00003EH | EXCEPTION INFORMATION | Source File | Line B |\n| --- | --- | ---\
    \ | --- | --- |\n| main | | BCSAMPLE.OBJ | bsample.c | 00013 |\n| Write to location\
    \ 00000000 | Interrupt 08H Division by Zero | | | |\n| Allocate an array and fill\
    \ it with 0's | | | | |\nchar *c, *ptr=malloc(calloc());\nint i, *frame=get_video_frame);\n\
    printf(\"Please enter 5 Characters, then press enter:\\n\");\nfor (i=0; i<5; i++)\
    \ {\n  c = getchar();\n  *ptr++ = c;\n}\np = array;\nprintf(\"\\nThe string entered\
    \ was: %s\\n\",p); | | | |\n\n## 157 No Bugs\n\n## MemCheck\n\nIn an earlier chapter,\
    \ I discussed an assertion function for strings. Among other things, the assertion\
    \ mock could, if the passed in pointer was dynamically malloc, verify that enough\
    \ memory was available.\n\nDynamic memory overwrites are one of the most common\
