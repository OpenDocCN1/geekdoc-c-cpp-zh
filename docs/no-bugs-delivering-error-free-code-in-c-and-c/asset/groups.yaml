    # Chapter 16


    # USEFUL BUG-DISCOVERY TOOLS


    Now that the rest of the book has you justifiably scared into discovering the
    the bugs in your code, how do you actually do it. This chapter discusses a number
    of tools available in the PC market to help you out.


    Unfortunately, there are not many good tools to help you discover bugs. But three
    are worth their weight in gold. Bounds Checker is a must for testing DOS programs,
    and Microsoft Test is a must for testing Windows programs. MemCheck is invaluable
    out both systems.


    Aside from these two tools, there are a few other useful tools (listed below)
    as well as the ever critical debuggers. There is a real need for additional tools
    to help discover bugs. I hope that over the next several years, additional tools
    will become available to help discovering bugs easier.


    # Bounds Checker


    Every once in a while, someone comes out with a new class of program: VisiCalc
    with the first spreadsheet, Norton with the first Unerase, and now Mega with the
    first bounds checker. Any developer who does not use Bounds Checker to test programs
    is guilty of gross dereliction and as a lot of unnecessary time tracking down
    a class of bugs.


    Bounds Checker is actually very simple. It uses the memory mapping and page faults
    of the 386 to set bounds on a program. It marks your code area as read-only and
    your data area as read-write, marking all other memory limits. If your program
    writes to anywhere except your data area or reads from any area other than your
    code or data area, a page fault occurs, and Bounds Checker shows you which instruction
    accessed out-of-bounds memory.


    Bounds Checker turns itself off when a program issues an interrupt. The code for
    the interrupt is usually not part of the program, and Bounds Checker'
  - '[PAGE 165]


    therefore legitimately accesses memory outside of the program''s area. It is even
    smart enough to track any DOS allocs and frees you you do and allows you to access
    only memory that you presently malloced.


    You can list areas that is ok for your program to access, such as the BIOS data
    area, video memory, and EMS. If you simply specify EMS rather than a specific
    range, Bounds Checker will even automatically determine the location of the EMS
    page frame. These exception areas can be of any size (for the BIOS data area,
    I list the bytes I read); can be listed as read-only, read-write, or write-only;
    and you can allow any part of your program to access these ranges or just specific
    modules.


    When it finds a fault, Bounds Checker tells you what part of your code made the
    violation and what memory you were accessing, and it lists the call stack, among
    other things. The call stack is valuable because memcmp is causing the violation,
    the call stack shows you routine called memcmp with the bad pointer. These violations
    are then written to a log file when the program exits, allowing testers to use
    Bounds Checker without having to understand it.


    Bounds Checker does some limits. It is designed for foreground applications written
    in a high-level language such as C. It allows one code area followed by one data
    area (each area can be > 64K). This is the most serious limit. TSRs need more
    than foreground applications. Ideally, Nu-Mega will come up with a method for
    working with TSRs and allowing interspersed code and data areas.


    BoundsChecker also needs to be more discriminating about segments. The data area
    should mark the constant data as read-only. The EMS memory should only be accessible
    if pages belonging to the are mapped in.


    The above, however, would simply be frosting on the cake: they would make an already
    invaluable product even more essential. Nu-Mega is already working on a number
    of improvements. As it stands, Bounds Checker is almost certain to find all of
    your loose pointers— and definitely the far ones.


    A program I wrote several years ago occasionally locked up when executing a certain
    function. It happened very rarely and to me—I wasn''t even sure it was a bug because
    it was so rare and I never saw it. Bounds Checker found the memory violation the
    first time I ran that function. I was writing to the


