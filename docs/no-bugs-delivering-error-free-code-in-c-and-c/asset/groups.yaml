    # Chapter 1


    # INTRODUCTION


    Attempt 1


    We''ve all been there. We''ve finished up our new application. It''s copied and
    shipped out the door. It''s arriving at our first customers - and the phone rings.


    It starts as a technical support question. But the problem gets escalated and
    pretty soon it becomes obvious - there is a bug in the program.


    And not just some little insignificant bug that user''s can work around - this
    is a big hairy bug that gets right in the face of each and every user and essentially
    stops them from using the program.


    It doesn''t matter how many customers you have, having to replace 100% of the
    copies of your program out there is a horrendous expense. And the cost is not
    limited to actually replacing the disks. You now have a reputation for delivering
    buggy software. This reputation will be costing you sales for the next several
    years - perhaps enough that a product that would have succeeded failed.


    If you cringe every time the phone rings after shipping a new product - then this
    book is for you.


    These bugs can have more than just financial impact. The most standard program
    in the world may be used in a cardiac care unit in a hospital. A small failure
    in a copy program could change a number in a loan application. A vertical market
    application may have a businessman reporting incorrect information to the government
    (which happens to be a felony). Somebody word processor was used to type up the
    specifications to the airplane you are flying in.'
  - '[PAGE 11]


    # 2 No Bugs


    People come to depend on programs in ways that the author never foresaw or intended.
    But they do depend on these programs. And just as you expect the airplane you
    are flying in to not come apart in mid-air, people expect their programs to operate
    as expected.


    Users now expect, and in many cases get, software which, while not bug free, they
    will never see a bug in. Over the next several years, they will demand this robustness
    in all of their programs.


    # Attempt 2


    I recently had this bug in some code reading from a data port. What was driving
    me crazy was while I was reading the data a byte at a time, ever once in a while
    my buffer pointer would be off by two.


    I placed checks throughout my code to make consistency checks. And the same thing
    kept happening - it would pass the tests until suddenly it was off by two.


    Finally I asked a co-worker to take a look at the code. After studying it awhile,
    he came back and said he nothing wrong assuming the function calling me hadn''t
    set the direction flag (we''re in x86 assembler here).


    To make a long story short, the function calling did not guarantee to clear the
    direction flag. Its just that it was usually clear.


    Not only could this bug have slipped through - I wasn''t even testing properly
    for it. In an environment we make assumptions (such as n = 1 + 2; will give us
    3). Unfortunately, we almost always include in this list of assumptions things
    that are almost always true.


    To add to injury, a summer hire porting this same code came in and pointed out
    that I didn''t clear the direction flag. I showed him where I did it earlier but
    spent a day determining that I had to do. He told me that I just should have shown
    to him first - which is unequivocally proof that summer hires should be tortured.


    Another case years ago I wrote a program that included a weird kind of word processor.
    Because of the requirements, the file format of the word processor was quite complex
    and we had some bugs in the code.'
