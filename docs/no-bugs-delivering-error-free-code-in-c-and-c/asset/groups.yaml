    ## New tools


    New debugging tools are being released every month. The tools described above
    are state of the art in the Spring of 1992. When you read this book, newer, and
    possibly better, tools will almost certainly be available.


    However, for now, you should look at the tools discussed here. This chapter was
    written so you know the least you should expect in terms of tools to help you
    find the MFUs you placed in your code.


    ## The End


    So we come to the end of the book. If you''ve stuck through to here from the beginning,
    thank you for taking the time to listen to what I had to say. If you have any
    suggestions or comments, please do send them to me. Preventing and finding bugs
    is still a very young practice in the PC world.


    Keep in mind that the practices discussed in this book are methods I have seen
    work. However, this does not mean they are perfect for every solution. Nor does
    it mean that they are the only possibilities. The bottom line is what practices
    are effective. If some of the ones in here don''t work for you, then you don''t
    use them. If other practices work well for you, then by all means you should use
    them.


    And most important of all, remember how those bugs got in your code. You put them
    there so that you could spend 3-day sessions without sleep trying to find them.

