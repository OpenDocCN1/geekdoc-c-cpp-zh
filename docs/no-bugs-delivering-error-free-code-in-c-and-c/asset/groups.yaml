    # 更新


    2009年6月16日 - 哇，时间过得真快。这本书写于 17 年前，在很多方面，它描述了一个与我们今天工作环境完全不同的世界。Java 和 C# 消除了这里讨论的整类
    Bug。单元测试已经证明自己是一项非常强大的工具。而我们今天拥有的调试工具——哇。


    但尽管如此，我认为这里的前两章与最初撰写时一样有用且强大。我相信你们会发现这些章节中的内容对于编写稳如磐石的代码很有帮助。欢迎在我的博客上发表任何评论。


    感谢 - David Thielen

    科罗拉多州，科尔巴德


    ![](img/c29f9dc69d37305f082fd0bd64e612cf_6_0.png)


    # 前序


    通常情况下，没有人是在真空中工作的。写这本书也不例外例外。首先，最重要的是，我想感谢我的妻子 Shirley，感谢她在帮助我写这本书方面的支持，并从本质上感谢她嫁给我。我还要感谢我的两个女儿
    Winter 和 Tanya，允许我在我本该陪她们玩耍的时候偶尔工作。


    书中充满了我多年来学到的技巧。其中一些是我摸索出来的，另一些是“借用”的。我特别感谢 Gordon Letwin 和 Mike McLaughlin，从他们那里学到了很多技巧，还感谢
    Andy Barnhart、Scott Quinn 和 Pete Stewart。


    感谢多年来合作过的许多程序员——不仅感谢他们提供了编写无 Bug 代码的想法，还感谢他们的反馈和友谊。作为一种嵌入式软件应用程序，Windward Reports
