    # Soft-Ice


    Brought to you by the people who Bounds Checker, Soft-Ice uses the capabilities
    of the 386 to give you an 8086 ICE using software. It comes admirably close to
    this goal, falling short on some very subtle problems.


    If you are debugging real-mode DOS programs, this debugger will be invaluable
    or later. You can set it to break when program reads or


    © Copyright 1992 by David Thiel - All Rights Reserved'
  - '[PAGE 178]


    writes to a memory location and then have it run at full speed until the read/write
    does occur (try that with a normal debugger).


    Soft-Ice performs this magic using a couple of features in the 80386. First of
    all, the 80386 has a couple of debug registers that can be used to cause a break
    when accessing a specific memory location. There are few of these, and they can
    be set only to break on a byte to dword range.


    Soft-Ice also uses the paging capabilities of the 80386. To break on a memory
    range, Soft-Ice marks the memory page as not there. Then, when the page is accessed,
    Soft-Ice determines whether the desired range on the page was touched. If so,
    it stops the operation. If not, it allows the operation and continues.


    This works unless the break range is on a page where other contents of the page
    are accessed constantly. Because pages are in 4K chunks, this can be a real problem.
    The most common performance problem is setting a break on access to a local variable.
    Because a local variable is on the stack, every stack access will cause a page
    fault.


    Soft-Ice is not always a perfect debugging solution. However, in most cases, it
    gives you all of the ICE capabilities you need—for a lot less money than any real
    ICE.


    Soft-ices also has a version for Windows, called Win-Ice. Win-Ice debugs not only
    Windows applications, but also Windows device drivers, virtual device drivers,
    and DOS applications running in a Windows DOS box. Quite simply, it''s incredible
    in its range of features and capabilities.'
