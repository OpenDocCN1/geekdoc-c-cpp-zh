    ## 3 无 Bug


    这是在 PC 早期，当时我还没有把书中列出的所有想法应用到程序编写中。我们在处理文件格式时出现了一些 Bug。我我知道这一点，但似乎找不到这些 Bug ——
    至少找不到全部。


    最后，在走投无路的情况下，我编写了一些代码来检查文件的一致性，并在发现问题时对其进行纠正。随着时间的推移，我在常规代码中发现了额外的 Bug，并修复了它们，将其添加到了一致性检查和错误修正逻辑中。


    虽然我一直在减少 Bug 的发生次数，但仍然无法完全消除它们。最后，为了方便测试，我删除了一致性检查和错误修正以便追踪 Bug ——结果 Bug 消失了。显然，我修复了原始
    Bug，但在此期间，修复 Bug 的代码引入了新的 Bug。


    有这样一家公司倾向于不测试产品，因为一旦报告了 Bug，他们就得修复。当然，当用户报告 Bug 时，他们还是得修复。


    在另一家公司，管理层会安排修复所有 Bug 的日期，而在那一天，根据定义已经没有剩余的 Bug 了。当然，用户请求的许多即时功能增强在发布后不久就得到了实现。


    ## 本书的读者


    大多数开发者都知道软件天生就带有 Bug。而且大多数开发者也希望在产品发布前消除这些 Bug。这本书就是为这些人编写的。


    然而，编写没有重大 Bug 的代码（抱歉，我们还没有达到真正无 Bug 代码的程度）是一项团队协作工作。它需要的不仅仅是开发者的努力。还需要测试人员、经理、支持人员等许多人的参与。这本书也针对这些人。


    ## 4 无 Bug


    本书旨在解决一个问题 —— 充满 Bug 的代码。因为它针对的是问题而非特定受众（即仅针对开发者或仅针对测试人员），书中的部分内容可能对某些读者感兴趣。第
    3 到 10 章主要为开发者编写。第 11 和 12 章主要为测试人员编写。


    然而，这本书的设计是让你连续通读的。如果你想开发出 Bug 尽可能少的代码，你需要理解实现这一目标所需的所有环节。开发者需要理解测试流程。测试人员需要理解开发者自己会测试什么。


    最重要的是，负责确保整个组织流程的管理和其他人员需要理解这个过程。同样重要的是，他们需要确保该流程确实得到了执行。


    最后，本书是从 Windows/DOS/PC 的角度编写的。虽然讨论的大多数观点对于任何计算平台都是通，但许多实现方式是针对 PC 的。某些代码不仅针对 PC，还针对特定的编译器（栈检查往往如此）。


    如果你在 PC 以外平台上使用 C 以外的语言进行编程，你仍然会发现这本书很有价值，但也会发现要整合这里的思想，你还需要付出更多工作。


    ## 无 Bug


    几乎所有的软件开发者都同意两点：软件开发耗时太长，而且软件充满 Bug。随着图形用户界面（GUI）应用程序的出现，这种情况只会变得更糟。不仅大多数程序都在增加功能（需要测试的内容更多），而且基于消息的架构已使测试所有可能的命令组合从困难变为不可能。


    虽然这本书的书名是《无 Bug》，但它并没有教你如何编写无 Bug 的代码。每个人都把“无 Bug”当作某种咒语，但用以如今的工具和技术来说是不可能的。


    本书专注于交付 Bug 尽可能少的代码。同样重要的是，它还关注在发布之前了解程序中仍然存在哪些 Bug。


    © Copyright 1992 by David Thiel - All Rights Reserved


    ## 5 无 Bug


    消除 Bug 分为三个步骤：


    - 1) 将 Bug 引入代码中（是的，是你把它放进去的）

    - 2) 找到这个 Bug

    - 3) 修复它


    本书名为《无 Bug》，是因为它试图尽量减少第一步，即在程序中引入 Bug。通过在编写代码时减少 Bug 的数量，你可以大幅缩短完成和测试程序所需的时间。书中介绍的大多数技巧实际上并不能阻止你编写带有
    Bug 的代码。换句话说，你仍然会犯犯过的同样的错误。但你的程序在发现你的错误时会举起红旗，允许你快速、无痛地修复它们。


    大多数技巧都是快速且不干扰操作的。每个人都知道编写无 Bug 的代码至关重要，但大多数开发者在进度紧迫（经理在脑后催促）或有更有趣的代码等待着他们时，不愿花时间去消除
    Bug。这些技巧的设计是为了让匆忙的开发者也能使用它们。通过几个小时的练习，你就可以实现书中大部分的代码示例，而且在发现 Bug 之前，你并不会真正看到这些新代码。


    ## 测试


    代码编写过程中一个重要且最被忽视的部分是测试。每一个软件程序，无论多么简单，都包含 Bug。每一个测试过程，无论多么彻底，都会让一些 Bug 溜掉。然而，决定程序相对“无
    Bug 程度”的最终因素是它所经历的测试过程。


    本书的第 12 章讨论了测试。PC 行业在过去的几年里已经成熟了很多。用户现在期望软件是无 Bug 的并按预期工作。几年前被认为稳如磐石的东西，现在被认为
    Bug 满到一文不值。


    ## 6 无 Bug


    本书旨在教授编写无 Bug 代码的方法，但它没有提供实际代码。你可以订购包含完整源代码的磁盘。订购信息出现在书末。


    ## 这本书


    本书旨在教授编写无 Bug 代码的方法，但它没有提供实际代码。你可以订购包含完整源代码的磁盘。订购信息出现在书末。


    ## 更多技巧


    本书没有列出所有可能用技巧。它仅仅列出了我发明或学到的技巧。如果你有自己的想法，请告诉我。如果我有了新点子，可以将它们包含在书的修订版中。除非你要求匿名，否则我会为你提供完整的署名。


    '
