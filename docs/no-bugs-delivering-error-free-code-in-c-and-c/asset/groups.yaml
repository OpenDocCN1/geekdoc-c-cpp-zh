    # Assert to the rescue


    To solve this, we make massive use of the assert capability. An assert function
    checks a Boolean expression, and, if it is true, calls the warning message function.
    For example, you may place assert(strlen(pStr) < 16); just before you copy a string
    into a 16-byte static buffer. If a string is ever longer than 15 bytes, the assert
    macro will print a message listing the file and the line in the source code that
    caused the error.


    # Assert macro


    The program example below illustrates the use of a standard assert.


    ```

    #ifdef DEBUG

    #define assert(b) ( b ? printf("##b in File: %s, Line: %d\n", __FILE__, __LINE__)
    : : )

    #else

    #define assert(b)

    #endif

    ```


    Most compilers support two asserts. One only exists if DEBUG is on, and the other
    exists even in the final released version. In this case, the first one is placed
    everywhere you believe the Boolean value to be FALSE. The second assert is placed
    only where you want the retail version of the program to exit if the Boolean value
    is TRUE.


    This is bad coding—you have left MFUs in your program. There should be no assert
    in non-debug code. Under certain conditions, you might want to exit your program.
    However, you should exit gracefully with a message to the user that makes sense.
    How good will you feel a program that suddenly exits to DOS with the line internal
    error @ dave.c, line 253?


    This bears repeating because there are numerous commercial programs that ship
    with asserts in them. You need to handle ALL error conditions properly. Exiting
    to DOS with an incomprehensible message to the user is not acceptable. Give the
    user enough information that, if it is 2:00 in the morning and they need to use
    your program to complete something by 8:00 in the morning, they have a prayer
    of figuring out what to do differently so the program will work. (End of lecture)'
