    \ 512 bytes is a safe number before DOS has a small stack (256 bytes), and if\
    \ a TSR uses more than 256 bytes, then the TSR will probably crash DOS.\n\nFor\
    \ other simple, sequential programs, there is no way to measure stack usage under\
    \ every circumstance. However, you can easily measure stack usage every time you\
    \ run the program. By watching the usage under various circumstances, you can\
    \ get an ideal of the overall usage.\n\nYou can also check the stack every time\
    \ you enter a function to see whether enough remain. If space gets tight, you\
    \ can use a DebugMessageBox to warn that you are out of stack. With the two tools\
    \ described here, you can insure your stack is not too big, not too small, but\
    \ just right (sortof Goldilocks & the Three Bears).\n\nThe stack tools are very\
    \ compiler specific. Every compiler I know of has a variable value or location\
    \ you allow to determine the beginning and end of the stack. Each also has a call\
    \ that can be at the beginning of each function to check and see whether enough\
    \ remain for the local variables in that function. The code below works with Microsoft\
    \ C 7.\n\nWe perform this testing with three simple tools. First, when a program\
    \ starts, we make a call that will fill the unused stack with a specific value.\
    \ Fill from SS:SP to the base of the stack (the stack grows downward). By definition,\
    \ it must be safe to fill from SS:SP downward because SS:SP is used by hardware\
    \ interrupts.\n\n© Copyright 1992 by David Thielen - All Rights Reserved\n\n#\
    \ stckfill.c\n\nThe program example below illustrates filling the unused part\
    \ of the stack.\n\n```c\nextern unsigned end;\n\nvoid StackFill (void)\n{\n  \
    \  unsigned uLen;\n    BYTE *pStck;\n\n    pStck = (BYTE *) &end;\n    uLen =\
    \ OFF (&uLen) - OFF (pStck) - 256;\n    memset (pStck, '$', uLen);\n}\n```\n\n\
    When the program ends, we make a call to a second function that then starts at\
    \ the base of the stack and moves up until it finds a value other than the fill\
    \ value. This is the size of the unused stack. It then prints the total stack\
