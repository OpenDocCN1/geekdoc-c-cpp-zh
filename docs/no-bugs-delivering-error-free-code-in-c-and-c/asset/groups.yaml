    is inviting trouble.


    # RT-link


    RT-Link deserves mention here. RT-Link is a sophisticated linker for DOS programs,
    and on the face of it, does not belong in this section. However, RT-Link implements
    some tools that show how powerful some error checking can be implemented properly.


    RT-Link allows you to link your programs to use virtual memory on an 8088 Code
    (and data too, in some cases) is kept on disk and paged into memory as needed.
    Unlike the overlay linker, RT-Link keeps a list of pages and loads the code into
    the LRU page.


    Needless to say, the program is loaded quite differently each time you run it.
    Because code that has called other code can be unloaded (and then reloaded on
    return), you have a very dangerous situation if any one page of code depends on
    another page actually being in memory.


    This is not a bug in RT-Link. You can tell RT-Link when you believe it''s safe
    for one code page to access another directly, saving the performance hit of going
    through RT-Link''s virtual memory manager.


    However, if you are wrong somewhere, you might be accessing a page that is usually
    still in memory. This leads to a bug that occurs only on systems with a small
    amount of memory or on any system when you call a set of functions in a certain
    order.


    RT-Link includes a command (VM_MURPHY) that allocates just one page for all virtual
    memory swapping. When linked with this command, the program is painfully slow.
    However, at no time is there more than one page in memory. If one page depends
    on another page being in memory, it will crash.


    This is a commendable example of a tool vendor incorporating technology that helps
    find bugs. Moreover, this command is a technique that can be'
