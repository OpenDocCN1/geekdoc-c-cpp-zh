    bugs, and testers will verify that they have been fixed. It includes a list of
    the tests to be written and the test writers.


    You need to lay out what the program does and how it will be tested. A program
    appears different to a tester than it does to a developer (and it appears different
    from both of those to a user). The test plan basically provides a specification
    of the program from the tester''s point of view. This allows the tester to create
    a list of items to test.


    You need to determine the testing methods. This includes figuring out the tools
    you will test with, including those that might not exist and which you will have
    to write. This also covers the systems that you need to test on.


    The test plan needs criteria to judge the product. How do you know when a product
    has been tested enough that you can ship it? How do you know whether a bug is
    serious enough to delay shipping? The deadline to ship approaches, the pressure
    become intense to declare all known bugs acceptable and simply ship it. The only
    way to avoid this is to come up with reasonable objectives early in the process,
    before pressure mounts. Changes that occur during development might change the
    approval criteria some, but at least you have a strong baseline to work from.


    # Automation


    When the testers sit down to design their tests, they should concentrate on one
    thing: automation. If at all possible, every test should be fully automated, giving
    the program input and checking its output, flagging the tester only if an error
    is found.


    Generally, automating a test takes more time than running the test manually once
    or twice. Often, automating a test takes more time than running the test manually
    50 or 100 times. However, testers should still automate as many tests as possible.
    Any given test will run hundreds of times before the product ships. If the test
    is automated, not only do you eliminate a tester missing an error, but it becomes
    very easy to run the tests again and again and again. By the end of the project,
    the investment in automating your tests will pay off many times over.


    There is an even more important reason for automating the tests. Before word processors,
    a document had to have serious errors before someone would'
