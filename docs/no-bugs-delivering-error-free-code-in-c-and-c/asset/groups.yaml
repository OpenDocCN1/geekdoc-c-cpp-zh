    # Chapter 4


    # SOME BASIC TRICKS


    Now we get into the actual programming tricks. For those of you who have no idea
    how to program, if you''re still with us, its time to skip to the chapters on
    testing. For those of you in management, its time to give your developers a raise
    and then skip to the testing chapters.


    This chapter has all the tricks that don''t deserve a chapter of their own. This
    isn''t to say these tricks aren''t important, merely that they can be explained
    in fewer words.


    This, and the rest of the chapters until we get to the testing process, both lists
    specific and how to implement them. The tricks are described generically. The
    code is c (and assembler where required) code for the PC.


    Most important, these tricks will allow you to painlessly eliminate bugs from
    your programs. These tricks do not add to your work - but they save a lot of the
    time you previously spent debugging.


    # TestAll functions


    Suppose your program is mysteriously crashing. You don''t know why or exactly.
    But then you place the TestAll function at various points in your program. You
    are now able to narrow down the bug. TestAll reports all is okay and then, 20
    lines later, reports an error. The bug is in those 20 lines.


    So what is this magical TestAll function? Quite simple, it calls every global
    test function you have. At a minimum, it checks the NULL memory locations, the
    entire heap, and the amount of stack left. It also asserts all global data structures.
    In Windows programs, it calls the ValidateCodeSegments and ValidateFreeSpaces
    functions.'
  - "[PAGE 38]\n\n# TestAll function\n\nThe program example below illustrates the\
    \ implementation of\nTestAll.\n\n```\nvoid TestAll (void)\n{\n  // Test system\n\
    \  TestHeap();\n  TestStack();\n  TestNull();\n  #ifdef WIN\n  ValidateCodeSegments();\n\
    \  ValidateFreeSpaces();\n  #else\n  TestEms();\n  TestXms();\n  #endif\n\n  //\
    \ Test global variables\n  AssertBool(bInsertMode);\n  AssertDbase(&MainDbase);\n\
    }\n```\n\nAnytime you create a test function that can be called anywhere (globally)\
    \ to\nperform its test, that test should be added to TestAll. Eventually, TestAll\n\
    becomes very slow, and because of that you rarely want to call it. However, it\n\
    invaluable in two places.\n\n+   - When your program completes a major task (for\
    \ example, a word processor\nsaves one file and is about to open another). It\
    \ is invaluable because\nis switching data sets and you should know which data\
    \ set doesn't work.\n\n+   - When tracking down a bug that could be to anything.\
    \ It is a quick way\nto identify the bug. You place the TestAll function at various\
    \ places -\nwhere you know the system is still okay up to the point where you\
    \ know it\ntrashed. It will not only find where you start to mess up your\nprogram;\
    \ it will also tell you which test failed, helping you identify what is\nwrong,\
    \ and where.\n\nIn the below example, funcBad blows up due to an error in the\
    \ system. But the\ncode looks error-free. By using the tests, you can determine\
    \ which function is"
- md: "\ncausing the problem. Before walking through funcBad, you can see if func1\
    \ or func2 is actually the culprit although you don't see the bug's effects until\
    \ funcBad.\n\n# Using TestAll\n\nThe program example below illustrates the use\
    \ of TestAll.\n\n```\nfuncMfu ()\n{\n    funcOk ();             // You know this\
    \ function is okay\n    TestAll ();\n    func1 ();               // Might have\
    \ a bug\n    TestAll ();\n    func2 ();               // Might have a bug\n  \
    \  TestAll ();\n    funcBad ();             // See the bug's effects\n}\n```\n\
    \n# Restoring system state\n\nWe have used all programs where the program runs\
    \ fine, but DOS always seems to lock shortly after using the program. There is\
    \ one program I used to use regularly with no bad affects ever. However, when\
    \ I ran it in a Windows DOS box, it would cause UAE every time when starting.\
    \ Obviously, it was playing with memory that didn't belong to it.\n\nWhen your\
    \ program is about to exit, you should fully test the system. Many programmers\
    \ don't worry about an error message on exit, then after, you are exiting—who\
    \ cares if things are a little screwed up?\n\nThis is a very dangerous practice.\
    \ First of all, many of these errors are symptoms of bugs that could, under different\
    \ configurations or use, cause problems while you run the program. Second, many\
    \ of these errors are damaging to the operating system. If your program returns\
    \ to DOS but locks up 5 seconds later, it's still your fault.\n\nBe careful to\
    \ catch a program's exit under all conditions. In DOS, if you don't watch for\
    \ CTRL-C, be you called when the default CTRL-C handler exits the program. Under\
    \ Windows, you need to check both when closing your application and when Windows\
    \ itself shuts down while your application is active.\n\n- 1. Call TestAll. This\
    \ single call should test the integrity of your system.\n\n- 2. Call the StackUsed\
    \ function (discussed later). This will tell you the maximum amount of stack size\
    \ used. Every time you exit the program, print out the maximum stack size used\
    \ as well as the total stack size. This gives you constant feedback, letting you\
    \ know whether you have set your stack size appropriately.\n\n- 3. Compare the\
    \ interrupt table and any other OPERATING SYSTEM global variables, as parts of\
    \ the BIOS data area that are of interest to ensure that you have left the system\
    \ as you found it. This is not a concern unless you are writing some VERY dirty\
    \ code—in which this case is the least of your problems. Bounds Checker (discussed\
    \ in the tools chapter) will check the interrupt table as well as the BIOS data\
    \ area to see if you have changed any of it, so there is no sample code for this.\
    \ However, if you do not use Bounds Checker, you need to write a program that\
    \ saves the interrupt table on start-up(before the c-runtime initialization code\
    \ runs). Then, on exit, compare the existing table (after the c-runtime_end function\
    \ runs) with the saved table.\n\n- 4. Leave the system in the state in you found\
    \ it. This is critical to insure that your program does not swallow resources\
    \ every time you run it. Any files opened should be closed. Any DOS, EMS, or XPS\
    \ memory allocated should be freed. This is critical for EMS and XPS memory because\
    \ DOS will not free that on exit itself. Also, if this memory is not free, your\
    \ program is wasting resources while it is running.\n\n- 5. Check your heap for\
    \ allallocate memory that is not freed. If you use the near and far heaps, check\
    \ both. Unfree memory generally indicates a logic error when you finish an action.\
    \ Even if the only problem was that you forgot to free a pointer, you are still\
    \ eating a scarce resource.\n\n- 6. Check for files that are still open. This\
    \ might be indicative of a logic error when you finish an action. However, open\
    \ file handles, as well as being a scarce resource like the heap, are much more\
    \ dangerous if left open. If the system crashes, part of the file is still in\
    \ memory instead of disk, and the file can be corrupted. Second, if another application\
    \ wants to access the file and you have opened it with exclusive access, you have\
    \ locked out the other application.\n\n- 7. If you are running Windows, insure\
    \ that you have freed up all resources. Some Windows resources are still in very\
    \ short supply (for example, Windows has only five screen-device contexts).\n\n\
    Most of the examples in the list above are illustrated later in this.\n\n# 32\
    \ No Bugs\n\n# ENTER / EXIT logging\n\nA sometimes useful practice is to have\
    \ DebugPrintf decide which printfs are going to the monitor, the file, or both.\
    \ The most common method is to use ENTER and EXIT to track where you are. The\
    \ program example below illustrates the use of ENTER and EXIT.\n\nIn the above\
    \ example, ENTER and EXIT are functions. Let you see how deep the function is\
    \ and indent the printfs appropriately. Regardless of how you set this up, you\
    \ won't be down in data. Also, if the logging occurs every function call, including\
    \ those to the low-level library calls, your program can slow to a crawl as it\
    \ spewing vast amounts of data to the terminal, virtually all of which is ignored.\n\
    \nSo when should you use this? Personally, I have never found ENTER/EXIT logging\
    \ to be useful to me. I list it because it is a technique some use. However, my\
    \ recommendation is that, unless you see a return in doing it, skip ENTER/EXIT\
    \ logging.\n\n# ENTER and EXIT\n\nThe program example below illustrates the use\
    \ of ENTER and EXIT.\n\n```\n#ifdef DEBUG\n{DebugPrintf(\"Calling\")\n#define\
    \ StrCpy(d,s)   (%p, %p) from:%d\\n\", d, __FILE__, __LINE__); char *r; r =strcpy(d,s);\
    \ DebugPrintf(\"Return\") %p\\n\", r)}\n#else\n#define StrCpy(d,s)      strcpy\
    \ (d,s)\n#endif\n```\n\n# Using ENTER and EXIT\n\nThe program example below illustrates\
    \ the use of ENTER and EXIT.\n\n```\n#ifndef DEBUG\n{DebugPrintf(\"Entering\"\
    )\n#define StrCpy(d,s)   (%p, %p) from:%d\\n\", d, __FILE__, __LINE__); char *r;\
    \ r =strcpy(d,s); DebugPrintf(\"Exiting\") %p\\n\", r)}\n#else\n#define StrCpy(d,s)\
    \      strcpy (d,s)\n#endif\n```\n\n# Message file\n\nIn most cases you will probably\
    \ want to send your debug output to a second monitor. In some cases, you might\
    \ want to send it to a log file. The easiest way to do this is to have the DebugPrintf\
    \ decide which printfs are going to the monitor, the file, or both.\n\nThe error\
    \ file needs to be opened when the program starts. You will probably want to either\
    \ create the file (deleting the previous log file) or use a new name each time\
    \ (such as incrementing the extension until you find a filename in not existence)\
    \ so that you are not creating a very large file.\n\nYou then need to consider\
    \ committing (DOS function ah=68h) the file on each write. If you do not and the\
    \ program locks up, you will lose the most recent writes, usually the ones that\
    \ tell why the program locked up. However, a commit on each lock is slow. And\
    \ you can't use your RAM disk – that is lost if the system goes up. I have found\
    \ writing to a log file, with enough information and commits to be useful, is\
    \ so slow as to be useless.\n"
  mdcn: "\n导致了问题。在执行 `funcBad` 之前，你可以查看 `func1` 或 `func2` 是否为真正的罪魁祸首，尽管你直到 `funcBad`\
    \ 才会看到错误的影响。\n\n# 使用 TestAll\n\n下面的程序示例演示了 `TestAll` 的用法。\n\n```\nfuncMfu ()\n\
    {\n    funcOk ();             // 你知道这个函数是好的\n    TestAll ();\n    func1 ();  \
    \             // 可能有 bug\n    TestAll ();\n    func2 ();               // 可能有\
    \ bug\n    TestAll ();\n    funcBad ();             // 查看错误的影响\n}\n```\n\n# 恢复系统状态\n\
    \n我们已经使用了所有运行良好的程序，但 DOS 在使用该程序后不久似乎总是会锁定。我有一个经常使用的程序，从没有出现过任何坏影响。然而，当我在 Windows\
    \ DOS 盒上运行它时，每次启动都会导致 UAE。显然，它在操作不属于它自己的内存。\n\n当你的程序准备退出时，你应该对系统进行完全测试。许多程序员并不担心退出时的错误信息，然后之后，你就退出了——谁在乎东西是不是稍微搞乱了呢？\n\
    \n这是一种非常危险的做法。首先，这些错误中的许多是 bug 的症状，在不同的配置或使用下，它们可能会在你运行程序时引发问题。其次，这些错误中的许多对操作系统是有破坏性的。如果你的程序返回到\
    \ DOS 但 5 秒后锁定，那仍然是你的错。\n\n小心在所有条件下捕获程序的退出。在 DOS 中，如果不监控 `CTRL-C`，当默认的 `CTRL-C`\
    \ 处理程序退出程序时，你会被调用。在 Windows 下，你不仅检查关闭应用程序的情况，还需要检查 Windows 在应用程序活动运行时自身关闭的情况。\n\
    \n- 1. 调用 `TestAll`。这个单次调用应该测试你的系统的完整性。\n\n- 2. 调用 `StackUsed` 函数（后文讨论）。这将告诉你你使用的最大栈大小。每当你退出程序时，打印出使用的最大栈大小以及总栈大小。这可以给你持续的反馈，让你知道你是否适当设置了栈大小。\n\
    \n- 3. 对比中断表以及任何其他操作系统全局变量（作为 BIOS 数据区域中你感兴趣的部分），以确保你离开系统时的状态与你发现时一致。除非你正在编写某些非常脏的代码，否则这不需要担心——在这种情况下，这只是你最最小的问题。`Bounds\
    \ Checker`（在工具章节讨论）将检查中断表以及 BIOS 数据区域，查看你是否更改了其中任何内容，因此没有相关的示例代码。然而，如果你不使用 `Bounds\
    \ Checker`，你需要编写一个程序在启动时（在 c-runtime 初始化代码运行之前）保存中断表。然后在退出时，将现有表（在 `c-runtime_end`\
    \ 函数运行后）与保存的表进行比较。\n\n- 4. 让系统保持在你发现时的状态。这对于确保你的程序每次运行时都不会吞噬资源至关重要。任何打开的文件都应该关闭。任何分配的\
    \ DOS、EMS 或 XPS 内存都应该释放。这对 EMS 和 XPS 内存非常关键，因为 DOS 不会在退出时自动释放它们。此外，如果这些内存没有释放，你的程序在运行时就会浪费资源。\n\
    \n- 5. 检查你的堆是否有未释放的 `allallocate` 内存。如果你使用近堆和远堆，请检查两者。在完成操作后，未释放的内存通常表示逻辑错误。即使问题仅仅是你忘记释放一个指针，你仍然在消耗稀缺资源。\n\
