    \ the default size. If an error results, the developer attributes to stack overflow,\
    \ or if he increases the stack size by an arbitrary amount. Think about it: In\
    \ the last program you shipped, how much of the stack is utilized?\n\nStack size\
    \ is critical not only for your own program. When a hardware interrupt occurs,\
    \ the interrupt handler will use your stack. Many TSRs do so. You generally should\
    \ have a big stack enough that you use the last 512 bytes of it. This gives you\
