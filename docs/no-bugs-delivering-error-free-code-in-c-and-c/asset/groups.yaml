    ## 第 2 章


    ## 什么是 BUG？


    这是全书中最重要的一章。“什么是 bug ？”这个极其简单的问题，实际上有一个非常复杂的答案。本章专门用于回答这个问题。因为，在我们不知道什么是 bug 之前，我们没有机会减少它们。


    我认识的一位开发者曾说过：“bug 不应该被称为 bug，它们应该被称为**大烂砸（Massive Fuck-Ups [MFUs]）**。”“Bug”这个词暗示了某种外部力量决定向你的程序中注入
    bug，而且好像只要你生活圣洁，在电脑脚下牺牲一些小毛茸茸动物，它们就会消失。


    MFU 的存在是因为程序是由人编写的，而人会出错。消除 MFUs 的唯一方法是进入你的代码，找到 bug 并修复它们。


    这是最需要理解的概念（也是最经常被忽略的）。你会写出 MFUs。你会坐下来，并带着完全故意的恶意，在你的代码中放入 MFUs。想一想——你知道你自己就是那个把
    bug 放进那里的人。所以，当你坐下来写代码时，你就会插入一些 bug。


    而且有人需要找到它们并删除它们。无论进行多少的设计、原型制作、CASE、评审、管理等，都无法避免这一点。


    这个概念之所以重要，因为它影响了你调试代码的方法。如果你将错误视为“bugs”，你就会希望它们一个也没有被发现（你希望好心仙子路过并洒了仙尘，bug 就此离开了）。如果你将错误视为
    MFUs，你就知道它们确实存在，并且你希望找到所有的它们，以便它们被修复。


    对于开发者和经理来说，在 MFUs 被发现时感到良好而不是糟糕，是至关重要的。如果他们没有发现任何问题，他们反而应该担心。与其假设你的程序运行良好并等待别人证明反之，开发者应该假设它运行并不良好，并拼命寻找导致它失败的
    bug。


    所以，目前，你必须接受会在代码中创建 MFUs（我设法在我的代码里偷偷塞进很多）。我不知道任何方法可以避免这一点。诀窍在于尽可能无痛地找到并纠正它们。


    顺便提一句，“bug”这个词在开发者的词汇中已经根深蒂固，我没看到 MFU 能取代它的可能。然而，我认为偶尔将 bug 称为 MFUs 是重要的，这可以提醒人们
    bug 是由于开发者的错误而“故意”放置在代码中的。


    当开发者坚持认为 bugs 不是 MFUs 时，你应该感到担心。为什么？因为他们放弃了找出并修复它们的责任。这时，提醒他们至关重要，要告诉他们：当他们被告诉代码里有一个
    MFU 时，比他们被告诉代码里有一个 bug 时，想要逃避责任要困难得多。


    那么什么是 bug 呢？嗯，如果你运行程序它格式化了你的磁盘（假设你不是在写一个格式化程序），大多数人会同意是 bug 导致的。从现在起，意见开始产生分歧。我听过此类类的陈述：“没人用那个功能，所以硬盘崩溃了也没关系”；“告诉他们买个并口打印机就行了”；“可以手动同步结果，所以加得不对也没关系”，以及“那不是
    bug，那是功能！”那些在自己编写的程序中认为这种类型可以接受的人，转过头就会把他们买的程序中的坏处归类为 bug。


    根据我的定义，如果一个理智的人预期程序以某种方式运行某些功能，而它并没有做到——那么就是一个 bug。


    ## bug 从哪里来


    bug 是如何进入程序的？非常简单：是你把它们放进去的。你肆无忌惮地坐下来并在你的程序中输入一些 bug 代码。它们不是自己溜进去。你可能写错了一行。你可能使用了错误的变量。你可能从别处拷贝了一些并不好用的代码。无论如何，都是你你你。


    ## 10 没有 bug


    你每次写代码时，都会插入 bug。这是编程的肮脏秘密之一。程序员每天都在编写代码并创建 bug。优秀的程序员通常非常擅长创建 bug。这样我们的雇主就可以留住我们来以后修复所有的
    bug（COBOL 程序员多年前就学会了）。


    ## 行业技巧


    书中并不包含任何关于如何停止创建 bug 的技巧。它确实包含了如何让 bug 变得更显易的技巧。这样我们的雇主就可以留住我们来以后修复所有的 bug（COBOL
    程序员多年前就学会了）。

    '
