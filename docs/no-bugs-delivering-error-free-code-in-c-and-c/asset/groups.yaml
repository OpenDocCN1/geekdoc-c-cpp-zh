    \ times, causing various problems. If the stack is too large, you do not get stack\
    \ problems, but restrict memory 68 No Bugs that could have been put to other uses.\
    \ That 1K or 2K extra stack you never use (sometimes 4K or 8K) can make a big\
    \ difference when memory gets tight (ie, malloc fails).\n\nSo how is the stack\
