    \ example below illustrates determining the stack usage.\n\n```c\nextern unsigned\
    \ end, _atopsp;\n\nvoid StackUsed (void)\n{\n    unsigned uLen, uStckLen;\n  \
    \  BYTE *pStck;\n\n    pStck = (BYTE *) &end;\n    uStckLen = _atopsp()-uLen=0;\n\
    \    for (uLen=0; uLen<uStckLen; uLen++, pStck++)\n        if (*pStck != '!')\n\
    \            break;\n    uLen -= 512;\n\n    printf(\"Stack size:%d, Unused:%d,\
    \ Needed:%d\\n\", uStckLen, uLen, uStckLen-uLen);\n}\n```\n\n# 70 No Bugs\n\n\
    Keep a record of the maximum amount used over time. Add 512 bytes to the maximum\
