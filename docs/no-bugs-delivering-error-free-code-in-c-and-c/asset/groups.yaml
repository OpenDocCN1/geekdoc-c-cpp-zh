    # Chapter 11


    # SPECIAL TRICKS FOR ASSEMBLY LANGUAGE


    If you don''t program in assembler, skip this chapter. For the studs reading this
    book though, this chapter lists a number of tricks for assembler. Some merely
    show how to implement tricks mentioned earlier in this book. Other tricks though
    are specific to assembler - they handle bugs you just won''t get in a higher level
    language (yes c is slightly higher level than assembler).


    The following tricks are not the only ones to use in assembly language. All the
    tricks covered in this book up to this point should be used in assembly language
    just as they would be in any other language. This chapter brings up special points
    about using tricks in assembly language.


    # Trap and IntTest


    The Trap and IntTest macros are very easy to implement in assembly language. For
    every conditional jmp, you place a conditional trap before the jmp and an IntTest
    after the jump instruction. If the jmp will be taken, the Trap will hit an int
    3. If it won''t be taken, the IntTest will hit an int 3.


    With assembly language, you truly know that you have exercised every machine instruction.
    With C and C++, you never know the optimizer created code in such a manner that
    there are machine-level code paths that were never exercised. This problem doesn''t
    exist with assembly language.


    # TRAP


    The program example below illustrates the use of TRAP and IntTest.


    ```

    ; Will hit the int 3 if CARRY is set

    TRAPc      macro

    local      a

    ```'
