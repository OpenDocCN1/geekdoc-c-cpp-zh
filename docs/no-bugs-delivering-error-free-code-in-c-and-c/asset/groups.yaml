    \ 1K 或 2K 栈（有时是 4K 或 8K）在内存紧张（即 `malloc` 失败）时可能会产生巨大影响。\n\n那么，大多数程序的栈大小是如何确定的呢？在大多数情况下，开发者从默认大小开始。如果出现错误，开发者将其归因于栈溢出，或者通过任意增加栈的大小来解决。想一想：在你最后发布的程序中，栈的利用率有多多少？\n\
