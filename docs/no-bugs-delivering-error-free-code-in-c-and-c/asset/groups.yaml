    # Object-oriented programming


    Object-oriented orprogramming OOP is the buzzword of the moment. It will solve
    all your programming problems, give you unlimited wealth, and make you irresistible
    to the opposite sex (actually, unlimited wealth will do to that).


    The subject of OOP merits a book of its own. In this book, we will discuss how
    OOP can stop bugs from ever showing up. It''s also important to discuss what parts
    of OOP give you these advantages.


    OOP does not require any specific language. You can write OOP code with assembly
    language. But a language like C++ forces you into a number of object-oriented
    practices and makes some other practices very easy to implement.


    At the simplest level, OOP means keeping your function separate. For example,
    functions that handle circles have no code or data in them for squares. Code for
    squares has no code or data for circles. Code for drawing an item has no code
    or data for circles or squares—but knows how to call the circle or square drawing
    functions.


    This separability in your program makes it easy to implement exhaustive tests
    for virtually all functions in your objects. This separability also means that
    a change in one object does not affect any other object. Use an OOP approach to
    your coding. It will pay off in a much-easier-to-test product.


    That said, realize that OOP is not a panacea. It makes it easier to do some kinds
    of testing but it does not eliminate the need for tests. It also adds some new
    bugs that you normally don''t see in c or asm.


    # Filling buffers


    Another bug that makes its presence rarely felt is using buffers before they have
    been initialized or after they are free. When you do, in most cases, the buffer
    will still have the correct data. Many times the buffer will have legitimate data,
    although not the data it should - leading to very subtle bugs.'
  - '[PAGE 45]


    # 36 No Bugs


    Whenever buffer is considered empty, fill it with an an ID byte (or string if
    you prefer). This ID byte should be a value that is invalid for the structure
    being filled (-2 usually works for everything). This way, if you access the buffer
    after filling it, you will get data that, hopefully, so incorrect, that it causes
    an immediately visible MFU.


    This is very valuable before file reads to insure that you handle the end of file
    when you get a partial read successfully. Filling passed in buffers is also a
    good check to make sure the passed in buffers are long enough. If a function returns
    a string, and one of the parameters is the maximum length of the string, filling
    the buffer first will insure bugs if the passed in buffer is too short.


    Also, when you free up a buffer, first fill it. This prevents bugs by accessing
    a free''ed buffer which usually holds the old data. This holds not just for freeing
    a buffer you allocated but for internal cache buffers, structures, and so on.
    Anytime you are through with any kind of memory, fill it before freeing it.


    By freeing memory, if you access this memory after the free, you are guaranteed
    to get bad values, hopefully causing an obvious MFU. If you don''t fill it, then
    when you access the memory after it is free, you will see the bug only in the
    rare cases where the memory is reused to your post-free access.


    Try several values for DEBUG_FILL_CHAR at different times. In some circumstances
    0 is deadly; in others, totally benign. Test your entire program using 0x00, 0x7E,
    and 0xFE. I have found 0xFE to be the most damaging in most cases. I don''t use
    0xFF because -1 in many cases has a special, sometimes benign, meaning.


    # Freeing a structure


    The program example below illustrates the use of filling a buffer.


    ```

    // Include file contents:

    #ifdef DEBUG

    #define DEBUG_FILL_CHAR   0xFE

    #define DebugMemSet(p, n)    memset (p, DEBUG_FILL_CHAR, n)

    #else

    #define DebugMemSet(p, n)

    ```


    © Copyright 1992 by David Thiel - All Rights Reserved


