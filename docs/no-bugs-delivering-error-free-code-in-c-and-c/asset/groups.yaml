    # Debuggers


    Be sure you have a good debugger. Personally, I''m partial to Soft-Ice on a 386
    and Periscope on a 286 or 8086. However, I prefer debugging in assembly language.
    Although both Soft-Ice and Periscope have C source-level debugging, it is generally
    one step behind that of the compiler vendor''s source level displays.


    When you really need to get down and dirty with Windows in 386 mode, then you
    have only two choices of debuggers: wdeb386 or Win-Ice (Soft-Ice for Windows).
    wdeb386 comes with the Windows SDK and is an awesome command-line debugger. Win-Ice,
    however, is a full-screen debugger and works at a source-code level


    Periscope has a debugger for Windows. However, for debugging on a system level,
    on VxDs, it is much more limited than Win-Ice or WDE386. For application-level
    debugging, it is not as good as Multiscope. Also, it requires two 80386 systems
    connected via a serial line.


    The valuable thing about debugging in assembly language is you see what you are
    actually getting for final code. This not only allows you to see whether the compiler
    is generating bad code (which occasionally happens) but also to see how efficient
    the code is. This will become more important with the advent of C++, where a +
    can become a horribly slow and complex set of instructions.


    The source-level debuggers shipped with compilers, as those from Microsoft and
    Borel, are all good and getting better. Multiscope''s source-level debugging is
    flat-out incredible. Simply be the debugger does what you want and know how to
    use it.


    Finally, if you really need to get down to the hardware, and you find that Soft-Ice
    is interfering with some subtle timing problems, then you need a hardware ICE.
    In this case there is only one choice: Periscope IV. Some of the Periscope debuggers
    are hardware based, so do not affect the system at all (Soft-Ice does affect it).
    And they cost a less than the ICEs from Intel.


    If you get down to the system level, you need Soft-Ice (or Win-Ice) on a 386 and
    Periscope on a 286 or earlier machine. If you program at the application level,


