    ## 第6 章


    ## DEBUG PRINTSFS


    我们现在编写了一些例程来帮助发现和消除 MFU（主要故障单元）。然而，我们需要某种方式让这些代码与我们进行通信。同时，我们不希望调试输出与正常输出混杂。因此，我们需要用于显示信息的调试函数。


    一组有效的调试打印函数决定了调试信息是帮助你调试，还是会成为你的障碍。本章将展示如何显示调试信息，而不会干扰程序对数据的正常显示。


    你需要调试打印主要有两个原因：


    - 第一，用于消息框（Message Boxes）。它可以告诉用户发生了错误，然后要求用户在继续之前按一个键。通常，当断言或参数检查失败时，应该使用消息框，让用户停在错误处。


    - 第二，用于信息性消息。这些消息告诉你程序当前正在做什么，程序在打印每条消息后应该在无人干预的情况下继续运行。列出正在处理的 Windows 消息就是一个信息性消息的好例子。


    调试 printf 是消除代码 Bug 过程中的重要工具。当出现问题时，你应该尽可能直接地显示错误。在用户面前弹出的消息框可以很好地满足这一需求。创建一个易于格式化和调用的此类弹出函数是非常重要的，这样它就能出现在任何需要的地方和任何需要的时间。


    然而，同样重要的是一种整洁且易于列出信息性调试消息的方法。如果实现得当，这些消息将允许你将程序内部的操作与监视器显示的操作进行比较。如果调试 printf
    显示你正在编辑一个文档，而你的程序显示的却是另一个，那么可能可能出了问题。


    下面的程序并没有将调试 printf 写入串行终端，而是写入单色显示器，该显示器被划分为多个窗口。因为显示器被划分为窗口，向一个窗口的 printf 不会将另一个窗口中的有用信息滚出屏幕。


    条件调试 printf 仅在开启时打印。它们可以通过编译时定义或运行时变量（在第3章介绍）来开启或关闭。使用定义要简单得多，但需要你重新编译程序来开启或某些调试打印。使用调试变量稍微复杂，但它们允许你在不重新编译程序的情况下开启和关闭调试。


    本章讨论了这三个过程：调试弹出消息框、打印到第二个显示器的调试 printf 以及条件调试 printf。这些功能的几乎所有代码都列在附录中。由于没有办法将代码拆分成小块，因此我没有在书中间放置一大块代码，而是将这些代码移动到了附录。


    ## 消息框 (Message Box)


    即使在 Windows 下，一个良好的消息框函数也需要一些编码。在 DOS 的情况下，它需要大量工作。你使用两个消息框函数：DebugMessageBox
    和 DebugMessageRes。DebugMessageBox 的参数与 printf 相同。DebugMessageRes 使用资源（resource）而不是格式化字符串。


    这种资源将格式字符串从默认数据段移动出来。如果你大量使用断言和参数检查（你应该这样做），你可能会发现所有对 DebugMessageBox 调用的格式字符串消耗了默认数据段的很大比例，可能导致你空间不足。因为调试代码的工作是解决问题而不是引起问题，所以你应该将字符串存储为资源而不是数据。


    因为 DOS 与 Windows 不同，没有资源，因此字符串存储在远数据段（far data segment）中，并带有其的资源号。当调用 DebugMessageRes
    时，字符串从远数据段复制到缓冲区中，然后调用 DebugMessageBox。这样一来，字符串仍然不在默认数据段中。


    DOS 有两种类型的消息框。第一种简单地在屏幕上执行 printf。第二种会在屏幕上弹出一个框，在用户按一个键后消失，并将之前被框住的内容放回屏幕。弹出框在显示框之前会强制屏幕切换到
    80 x 25 模式，完成后将屏幕切回之前的模式。因此，即使你的程序没有处于字符模式，只要它使用 ROM BIOS 进行屏幕切换，弹出框就应该正常工作。


    当框出现时，你只能按 <CR> 或 ESC。如果你按 <CR>，程序将继续。如果你按 ESC，程序将退出到 DOS，并将消息框留在屏幕上。如果你遇到了一个让你想要退出的错误——例如，继续运行可能会导致你的硬硬盘被重新格式化——那么
    ESC 就很有用了。它还具有将调试信息留在屏幕上的额外好处。


    Windows 使用 Windows MessageBox 函数。它以 TASKMODAL 状态引入，因此你的程序被停止了，但你仍然可以使用系统上的其他程序。退出一个
    Windows 应用会导致大量消息被处理，在 Windows 中按 ESC 不会退出程序。相反，它会关闭 MessageBox 处理，以便后续消息不再被显示。


    这证明了 DOS 和 Windows 之间功能上的差异。然而，我发现 Windows Windows 下，一个错误导致后续 50 到 100 条错误消息是常见现象。然而，我可能想在第一个错误发生后继续测试，而不需要按
    100 次 <CR>。在 DOS 下，这种级联错误要少得多。这是环境差异的本质属性。


    调试消息可以用另一种方式打印。使用本章稍后描述的 DebugPrintf，调试消息显示在调试监视器中，然后等待按键。使用此系统的 Windows 3 时，程序的显示完全不受影响。


    ## 59 个 Bug


    调试消息可以用另一种方式打印。使用本章稍后描述的 DebugPrintf，调试消息显示在调试监视器中，然后等待按键。使用此系统的 Windows 3 时，程序的显示完全不受影响。


    ## 调试打印 (Debug printf)


    当我们编写程序时，即使你没有在寻找 Bug，有时能够打印系统内部状态的信息也是非常有用的。然而，你不希望将这些信息打印在主屏幕上，因为会干扰你正在运行的程序。


    然而，大多数彩色显卡可以与系统中的单色显卡共存。这个第二个显示器可以用来写入。调试 printf 不会干扰主屏幕显示。此外，由于 printf 是写入显存的，它不会影响
    DOS。


    我们还将 printf 分为几个固定大小/位置的窗口。然后编写一个 printf，其第一个参数是一个指定要写入哪个窗口的 int 类型。你就可以将信息写入第二个显示器了。


    多个窗口的目的是保护重要信息不被后续的不重要信息滚出屏幕。在 Windows 中，我有一个窗口列出发送给我的 WndProc 的消息，另一个专门用于调试/错误消息。这给我留下了三个窗口用于打印不同重要性的消息。


    '
