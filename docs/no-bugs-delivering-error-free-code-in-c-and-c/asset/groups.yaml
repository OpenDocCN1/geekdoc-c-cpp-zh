- md: "\n## Chapter 2\n\n## WHAT IS A BUG?\n\nThis is the most important chapter in\
    \ the entire book. The very simple question, What is a bug, actually has a very\
    \ complicated answer. This chapter is devoted to answering that question. Because,\
    \ until we know what a bug is, we don't have a chance of minimizing them.\n\n\
    A developer I know once said, \"Bugs should not be called bugs, they should be\
    \ called **Massive Fuck-Ups [MFUs]**.\" \"Bug\" connotes that some outside agency\
    \ decided to infuse your program with bugs and that if you live a clean life,\
    \ sacrifice small furry animals at the foot of your computer, they will go away.\n\
    \nMFUs exist because programs are written by people, and people make mistakes.\
    \ The only way to eliminate MFUs is to go into your code, find the bugs, and fix\
    \ them.\n\nThis is the most critical concept to understand (and the one most often\
    \ blown off). You will write MFUs. You will sit down and with complete malice\
    \ of forethought put MFUs in your code. Think about it - you know that you are\
    \ the one putting the bugs in there. So if you sit down to code, you will be inserting\
    \ some bugs.\n\nAnd somebody needs to find them so they can remove them. No amount\
    \ of designing, prototyping, CASE, reviewing, management, and so on, will avoid\
    \ this.\n\nThis concept is important because it colors your approach to debugging\
    \ your code. If you view mistakes as \"bugs,\" you hope none are found. (You hope\
    \ the good fairy came by sprinkled pixie dust, and the bugs left.) If you view\
    \ the mistakes as MFUs, you know them unquestionably exist, and you hope to find\
    \ all of them so that they can be fixed.\n\nIt is critical developers and managers\
    \ feel good, not bad, if MFUs are discovered. They should worry if they don't\
    \ find any. Rather than assuming your program works and waiting for someone to\
    \ prove otherwise, a developer should assume it doesn't work and search desperately\
    \ for the bug that will make it fail.\n\nSo, for the moment, you have to accept\
