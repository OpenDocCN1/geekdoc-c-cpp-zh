    \ I ran it in a Windows DOS box, it would cause UAE every time when starting.\
    \ Obviously, it was playing with memory that didn't belong to it.\n\nWhen your\
    \ program is about to exit, you should fully test the system. Many programmers\
    \ don't worry about an error message on exit, then after, you are exiting—who\
    \ cares if things are a little screwed up?\n\nThis is a very dangerous practice.\
    \ First of all, many of these errors are symptoms of bugs that could, under different\
    \ configurations or use, cause problems while you run the program. Second, many\
    \ of these errors are damaging to the operating system. If your program returns\
    \ to DOS but locks up 5 seconds later, it's still your fault.\n\nBe careful to\
    \ catch a program's exit under all conditions. In DOS, if you don't watch for\
    \ CTRL-C, be you called when the default CTRL-C handler exits the program. Under\
    \ Windows, you need to check both when closing your\n\n© Copyright 1992 by David\
    \ Thiel - All Rights Reserved"
  - '[PAGE 40]


    application and when Windows itself shuts down while your application is active.


    +   1. Call TestAll. This single call should test the integrity of your system.


    +   2. Call the StackUsed function (discussed later). This will tell you the maximum
    amount of stack size used. Every time you exit the program, print out the maximum
    stack size used as well as the total stack size. This gives you constant feedback,
    letting you know whether you have set your stack size appropriately.


    +   3. Compare the interrupt table and any other OPERATING SYSTEM global variables,
    as parts of the BIOS data area that are of interest to ensure that you have left
    the system as you found it. This is not a concern unless you are writing some
    VERY dirty code—in which this case is the least of your problems. Bounds Checker
    (discussed in the tools chapter) will check the interrupt table as well as the
    BIOS data area to see if you have changed any of it, so there is no sample code
    for this. However, if you do not use Bounds Checker, you need to write a program
    that saves the interrupt table on start-up(before the c-runtime initialization
    code runs). Then, on exit, compare the existing table (after the c-runtime_end
    function runs) with the saved table.


    +   4. Leave the system in the state in you found it. This is critical to insure
    that your program does not swallow resources every time you run it. Any files
    opened should be closed. Any DOS, EMS, or XPS memory allocated should be freed.
    This is critical for EMS and XPS memory because DOS will not free that on exit
    itself. Also, if this memory is not free, your program is wasting resources while
    it is running.


    +   5. Check your heap for allallocate memory that is not freed. If you use the
    near and far heaps, check both. Unfree memory generally indicates a logic error
    when you finish an action. Even if the only problem was that you forgot to free
    a pointer, you are still eating a scarce resource.


    +   6. Check for files that are still open. This might be indicative of a logic
    error when you finish an action. However, open file handles, as well as being
    a scarce resource like the heap, are much more dangerous if left open. If the
    system crashes, part of the file is still in memory instead of disk, and the'
  - '[PAGE 41]


    # 32 No Bugs


    file can be corrupted. Second, if another application wants to access the file
    and you have opened it with exclusive access, you have locked out the other application.


    +   7. If you are running Windows, insure that you have freed up all resources.
    Some Windows resources are still in very short supply (for example, Windows has
    only five screen-device contexts).


    Most of the examples in the list above are illustrated later in this book. However,
    some programs use resources that are not as general. Be sure that you have freed
    up those resources.


    Your mother was right, it is very important to clean up after yourself.


    # ENTER / EXIT logging


    A sometimes useful practice is to log the functions you call. This logging is
    written to a debug terminal and/or to a debug file. Essentially, it gives you
    a running list of what function you are in and where you were called from.


    It can also be used by a debugger to track your call stack. This allows the debugger
    to list,by function name, the calls you made (beginning with main) to get your
    present location.


    The most common method is to make an ENTER macro the first line of every function
    and an EXIT macro return. The ENTER macro prints that the program is entering
    the function. The EXIT macro prints that the program is leaving the function and
    returns from the function.


    You will see the use of __FILE__ and __LINE__ below. These are constants defined
    by the compiler. __FILE__ is the file being compiled and __LINE__ is the line
    of the file being compiled. Using these constants can give you the source location
    of a debug printf.


    # ENTER AND EXIT Macros


    The program example below illustrates the definition of ENTER and EXIT.


    ```

    #ifndef DEBUG

    #define ENTER(func) DebugPrintf("Entering %s (%s:%d)\n")

    func, __FILE__, __LINE__);

    ```


    © Copyright 1992 by David Thielen - All Rights Reserved'
