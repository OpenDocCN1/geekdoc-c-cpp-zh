    ## 158 Bugs


    MemCheck finds these bugs through a number of simple mechanisms. It does this
    with almost no effect on your existing code. You include memcheck.h in your source
    files and can add two calls. That''s it.


    Although MemCheck can turn its on and off for debug and non-debug mode, you can
    also put the include and two function calls inside #if DEBUG statements, and then
    it disappears in non-debug mode.


    MemCheck provides two basic functions.


    First, it implements the functionality described in Chapter 8, "Watching Heap
    Allocation." All allocations have check bytes placed before and after them. All
    allocations know the file and line of source they were malloc''d. With this capability,
    MemCheck will tell you whether you underline or overwrite the memory you have
    allocated. It can also list for you, on exit, any unfreed memory — to prevent
    you from not freeing your memory.


    Second, MemCheck includes its own library of all the basic string and memory calls.
    You then call MemCheck''s strlen and memcpy instead of the one in your compiler''s
    run-time library.


    Anytime one of these functions receives a pointer, it will determine whether the
    pointer is in the heap. If so, MemCheck then checks to see whether the pointer
    points to enough memory for the function. If you dynamically allocate a pointer
    to 26 bytes and then try to strcpy 27 bytes to it, MemCheck will find the error.


    Unfortunately, MemCheck only works on dynamically malloc''ed pointers. There is
    a mc_register, which you can use to list the base and extent of your global and
    local variables (you can also unregister, which is crucial for local variables).
    However, this requires a function call for each variable. It''s too bad that MemCheck
    can''t read the code information in a .EXE file — it lists all variables including
    their base and extent.


    MemCheck includes the capability to check for writing to NULL. It can also check
    the entire heap at any time. Both of these are good additions to the TestAll.


    It also allows you to provide a function to replace printf, which MemCheck uses
    to display errors. If you use a window system for your program, you can have error
    messages either pop up in a message box or be written to the debug monitor.


    MemCheck gives you a lot of checking for very little time or pain. If you don''t
    already have code to perform this parameter validation, use MemCheck. I only wish
    it did more. Checking just malloc''ed pointers is better than checking no pointers,
    though.


    This is the epitime of a good No Bugs tool: You can basically forget it''s there
    until it finds a bug.


