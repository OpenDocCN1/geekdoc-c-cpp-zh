    ## Windows debug version


    The Windows Software Development Kit includes a debug version of Windows. In Windows
    3.0 this made a big difference because the debug version performed parameter checking,
    while the retail version didn''t.


    The debug version still performs additional checking that the retail version does
    not perform. A Windows application should run, without even a warning, on the
    debug version of Windows. While testing a Windows application, use the debug version
    of Windows and a serial terminal connected to your serial port (which debug kernel
    will write to).


    The debug version also has several flags that you can turn on to perform additional
    checking. The first flag is ilovebear(an interesting story behind the name), which
    will cause passed-strings to be filled to their limits before returning values
    placed in them. This guarantees that all passed-in buffers are long enough.


    The debug version also has the cal ValidateSpaces, which, in conjunction with
    the flags EnableFreeChecking and EnableHeapChecking perform additional checking
    of the heap. This call adds about 20 percent overhead in Windows. However, it
    will writes to free memory.


    The call ValidateCodeSegments is useful only in real mode. If your program will
    run in real mode, then you should use this test at times. However, if your program
    will only run in protected mode, then there is no reason to use this call.


    Windows provides the Stress Applicator and Heap Walker, which can be used to eat
    up resources. The Stress Applicator can use up the heap, leaving a set amount
    of free memory. It can do this to the global heap, a programs local heap, and
    the GDI heap (more commonly known as system resources). It can also use disk space
    and file handles, once again leaving limited or no resources.


    The Heap Walker can also use the global heap as well as discardable segments.
    Both Stress Applicator and Heap Walker allow you to test your application under
    situation where resources have completely run out.


    © Copyright 1992 by David Thielen - All Rights Reserved


    Generally, your program will not be expected to be able to continue in these cases,
    but it should at least gracefully decline to perform a function.


    Again, these valuable tools allow you to see what your program will do under severe
    constraints. Between these tools and the debug kernel, you can do a decent job
    testing your Windows application. Not using these tools to test your Windows application
    is inviting trouble.


    ## RT-link


    RT-Link deserves mention here. RT-Link is a sophisticated linker for DOS programs,
    and on the face of it, does not belong in this section. However, RT-Link implements
    some tools that show how powerful some error checking can be implemented properly.


    RT-Link allows you to link your programs to use virtual memory on an 8088 Code
    (and data too, in some cases) is kept on disk and paged into memory as needed.
    Unlike the overlay linker, RT-Link keeps a list of pages and loads the code into
    the LRU page.


    Needless to say, the program is loaded quite differently each time you run it.
    Because code that has called other code can be unloaded (and then reloaded on
    return), you have a very dangerous situation if any one page of code depends on
    another page actually being in memory.


    This is not a bug in RT-Link. You can tell RT-Link when you believe it''s safe
    for one code page to access another directly, saving the performance hit of going
    through RT-Link''s virtual memory manager.


    However, if you are wrong somewhere, you might be accessing a page that is usually
    still in memory. This leads to a bug that occurs only on systems with a small
    amount of memory or on any system when you call a set of functions in a certain
    order.


    RT-Link includes a command (VM_MURPHY) that allocates just one page for all virtual
    memory swapping. When linked with this command, the program is painfully slow.
    However, at no time is there more than one page in memory. If one page depends
    on another page being in memory, it will crash.


    This is a commendable example of a tool vendor incorporating technology that helps
    find bugs. Moreover, this command is a technique that can be incorporated only
    by the tool vendor. If only more tool vendors would provide features like this...


