    consider retyping it. With the advent of word processors, that someone thinks
    nothing of reprinting a 100 page document to correct a single phrase.


    By the same measure, if you want to run a series of manual tests, testers you
    need to have a very good reason to spend the time and money required. However,
    to rerun a series of automated tests merely requires someone start them. In fact,
    because the testers spent the time writing them, they run the tests whenever possible.


    Every time a change is made to the program, no matter how small and insignificant,
    towards the end of the project, when only major bug fixes are allowed, this can
    become critical.


    If right, testers spend most of their time developing automated tests for the
    first time and very little time actually testing. At the same time, test systems
    are almost constantly running, performing their tests automatically.


    # Bug reporting


    The bug-reporting process should also be automated. When a bug is reported, as
    much information about the bug as possible should be conveyed to the appropriate
    developer.


    A program that reports all information about the system the bug was found on is
    a very useful feature. Among other things, it should have a copy of the system''s
    config.sys and autexec.bat files, motherboard and ROM-BIOS manufacturer, and so
    on. It should tell you anything that could be relevant to the bug.


    The ability to write information to a log file is another useful feature to include
    in debug versions of the program. When a bug is found, the contents of the log
    file will often provide all needed information. Although this is not an appropriate
    feature in a final product, it is very valuable in beta programs, especially if
    it can be turned off (for speed).


    The tester needs to recreate the bug before passing it on to the developer. If
    the tester can''t recreate the bug, neither they or the developer have no way
    of verifying that it has been fixed.


    If the bug occurs on only one system, the tester and developer will have to use
    that system. This can be a problem if the system in question is located at a beta'
  - '[PAGE 142]


    site. In that case, if the bug is serious enough, the computer will need to be
    shipped to the development site.


    A developer needs to inform the tester when a bug has been fixed. This communication
    channel should be automated (electronic mail is great for this). The tester can
    then test to see whether the bug is truly fixed. The tester is the one who determines
    whether the bug has been really fixed.


    If there is no automated test to find the bug that was fixed, then the tester
    should strongly consider adding it to an existing test or writing a test to check
    for the bug. If it happened once, it could happen again. This "regression testing"
    can be crucial. Many times, fixing a bug will introduce a new bug. When fixing
    the new bug, another developer might inadvertently reintroduce the old bug.


    # The bug database


    Tracking bugs is critical as finding. If a bug is found but never fixed, then
    the program is no better off. If a developer determines, after a week of work,
    that a bug cannot be fixed, you do not want another developer spending a week
    rediscovering the same thing.


    If two people report the same bug, you do not want two different developers fixing
    it. If a bug is fixed and then reappears in another, later version, referring
    to the earlier report should point the developer to the actual bug.


    A bug database is more than simply a database on a computer. It is part communication
    program, part process, and part database. It is the means by which bugs are followed.


    Although a one-person effort can simplify a lot of this process, the actual process
    should still exist. A developer/tester working alone still needs to track bugs.


    If at all possible, a single person should enter all bugs into the system. This
    person is the bug Master, one of the most thankless jobs in the entire development
    process. Individuals who find bugs should e-mail the bug reports to a bug alias
    (assuming you have e-mail).


    All developers and testers on the project should be on this alias and should read
    all e-mail to this alias. Many times, a developer or tester will know the'
  - '[PAGE 143]


    answer to a bug and can e-mail a response to the sender and Bug Master, thus saving
    a lot of time.


    This bears repeating. The job of the developers is not to wait to be assigned
    a bug. The job of the developers is to help find all the MFUs they put in the
    program. Getting a copy of every bug report, even if most of them are discarded
    after reading the first line or two, is critical to this process.


    Although everyone reads the e-mail to the bug alias, the Bug Master is the one
    who acts on it. He or enters the bug in the database. Entering a bug in the database
    should include the name of the developer and tester of the bug is assigned to.
    This should then generate e-mail to them as well as to the person who reported
    the bug.


    When the bug is assigned, it is also assigned a "severity." This severity should
    generally be a number within a small range that spells out clearly how critical
    the bug is:


    +   - Level 1: The program causes catastrophic damage (for example, formats your
    hard drive)

    - Level 2: Some major functionality doesn''t work (for example, you can''t print)

    - Level 3: Some minor functionality doesn''t work (for example, you can''t print
    to a file on another drive)

    - Level 4: The program works but something is wrong (for example, spelling mistake,
    caps lock ignored)

    - Level 5: A design flaw (for example, call printing instead of type)

    - Level 6: A suggestion for the future (for example, allow wild cards when specifying
    files to back up)


    Categorizing by severity is important for two reasons. First of all, it allows
    a developer to prioritize bugs. Second, as the ship date approaches, only bugs
    assigned lower severity will be fixed. (Because fixing a bug always leaves the
    possibility of introducing a new, and potentially more serious, bug, you need
    to be very careful as your ship date approaches. Although a product


    © Copyright 1992 by David Thiel - All Rights Reserved'
  - '[PAGE 144]


    should ship with no Level 1 or Level 2 bug, a Level 3 bug may be left if it would
    be dangerous to fix it at the last second.)


    You can always change the assigned severity of a bug. However, don''t change all
    bugs from Level 1 and Level 2 to Level 3 simply so you can ship. This grading
    of levels is important so that management can determine whether a product is approaching
    a state at which it can be shipped.


    Once a bug is fixed, the developer needs to enter details of the fix into the
    bug database. This step provides a reference to used in case the bug is ever put
    back in it. It is also useful when trying to solve a similar bug.


    The developer e-mails the tester and Bug Master that if he believes the bug to
    be fixed. At this point the bug is assigned to the tester. It is now the responsibility
    of the tester to determine whether the bug has been eliminated. Ideally, while
    the developer was fixing the bug, the tester was writing an automated test for
    the bug.


    If multiple developers are working on the same program, then it is usually more
    efficient to "build" the program once a week (sometimes more or less often) and
    hand that build over to the testers.(A build consists of taking the code everyone
    has checked in and creating a version of the program for everyone to use and test.)
    The testers can then test against this build.


    Regular (usually weekly) builds give you big advantages. First, when testing to
    see whether a bug has been fixed, the tester is testing against all the changes
    made that week, not just the one small change to fix that bug. Second, the entire
    suite of automated tests can be run against the new build, allowing the testers
    to determine whether the fix has broken anything else.


    Finally, if the tester determines the bug has been fixed, then he or she emails
    an announcement to the Bug Master and developer. The bug is then marked as fixed
    in the database.


    Sometimes a developer will determine that a bug cannot be fixed. This decision
    might be reviewed by management, but if the final decision is that the bug can''t
    be fixed, it is then marked in the database as "can''t be fixed." In this case,
    it is even more critical that the bug is fully documented in the database because
    it will most likely be reported again.'
- md: '

    Finally, time constraints might not allow bugs to be fixed. Bugs at Level 5 and
    Level 6 will often not be worth the time investment. Even if worth the time, there
    might not be enough time left before shipping. In either case, these bugs should
    then be resolved as postponed. The list of bugs that were postponed becomes part
    of the proposed feature list for the next version.


    Throughout this process, the Bug Master (as well as developers and testers) need
    to periodically check the entire database for duplicate bug reports. At times
    she or he will also find open bugs that have been resolved or can''t be resolved.


    All bugs that are assigned considered open. This is the bug count that matters.
    (Having 1000 postponed bugs that are really feature enhancements are not a terribly
    relevant number. Having Level 1 & 2 bugs is a sign of serious problems.) This
    bug count needs to drop every week. If this count gets out of control, then your
    ship date will slip further and further into the future.


    Although at times the count will climb (for example, shortly after a beta release),
    it must be brought back under control. The actual number depends on the severity
    of the bugs, the number of developers on the project, and the stage of the development.


    However, the bug count of serious items for the parts of the program that are
    complete should be in the single digits for each developer. At the later stages
    of the program, it should be less than four. If you have a high bug count, the
    developers have too high ratio of MFUs to working code.


    Having a lot of code full MFUs is not of much use. If your other option is a smaller
    body of working code, you are a lot better off. If the bug count gets too high,
    stop new development and concentrate on killing the existing bugs. Do not allow
    new development until the bug count is brought back down to a reasonable level.


    And in mind that you cannot drastically change the number of bugs a developer
    fixes in a day. If the count keeps moving upward, even in full fix mode, you are
    screwed. If the count moves downward at a relatively constant rate, then you cannot
    plan on doubling that rate simply because your ship date is approaching.


    # The testing process


    The success of your testing process depends on three things:


    - Your level of organization

    - The expertise of your testers

    - The support of your management


    With a good testing process, you can deliver good software. Without it, you haven''t
    got a prayer; with each buggy update, fewer of your users will stay with your
    program, and more will switch to a competitor that does do a good job of testing.


    # Internal Testing


    A program is tested by several groups. The developers themselves do some testing,
    by running the program to see whether their new features allow nothing else. The
    test team uses both automated and manual tests. And finally, users test the program
    in a beta test.


    This section discusses the second group; the tests performed by the internal testers.
    Although the testing group is also responsible for managing the beta test, this
    section discusses the actual testing performed by the testing group.


    The testers are divided into two groups:


    - Those with knowledge of the source code (white box). These testers look at the
    source code, and based on the code, write test programs that will try to break
    the program.

    - Those with just knowledge of the product as a power user (black box). These
    testers know nothing about the internal logic of the program. Instead, they design
    tests based on the knowledge a power user of the program would have.


    # White box testing


    Internal testing is generally the only source of white box testing of a product.
    This testing is performed by programmers who read the source code and, based on
    the actual source code, design a set of tests. Where the TRAPs and IntTests made
    sure that all code was executed, these tests attempt to insure that all combinations
    of code paths are tested.


    White box testing cannot be performed by the developer who wrote the code. Any
    developer, no matter how good, has blind spots. After all, the developer put all
    of those MFUs in there in the first place.


    Although white box testing should exercise the common code paths, this is the
    least important of its jobs. After all, if a code path is common, the black box
    will surely test it. Instead, testers should look for code paths that will be
    exercised very rarely.


    Ideally, tests will be written for all possible code paths. However, with a limited
    amount of time and people, this is usually not possible. In that case, the testers
    have to decide which code paths to test. You have two basic groups of tests.


    First, you want to write tests that test the basic functionality of the program.
    This test should determine whether the basic system, including all critical paths,
    works. This is necessary to determine whether the developers have made a change
    that makes it impossible to test anything because the basic system is hosted (another
    technical term that means you can''t do anything with the program)


    Second, you want to write tests that test code paths you think have the best odds
    of breaking. This is where the test group has its best opportunity to break a
    program. Also, in the course of looking for code paths to break, a tester who
    finds something wrong can bring it to the attention of the developer. This code
    review is also a way to find bugs.


    # Black box testing


    Black box testing is the opposite of white box testing. The tester has no knowledge
    of the internal code making the program. It is critical that black box testers
    truly clean. By clean, the testers must have no knowledge of the internal workings
    of the program.


    In most cases, the best way to insure that black box testers is clean is to use
    nonprogrammers to do this testing. Even if they see code, they have no idea. It
    also lessens the learning from a developer.


    Black box tests are designed by a power user of the program. Like the white box
    testers, two basic groups of tests should be written. First are the tests of common
    functionality. These are designed to verify that the program works. Second, once
    again, are the uncommon code paths. In the case of black box testing, there is
    no way to know which code paths are shakier than others. The most important approach
    is to give an unusual response to prompts.


    For example, when prompted for a filename, try 8 character names. Try files that
    are read-only. Try bad files. Try files that don''t exist. In other words, try
    everything except a normal file.


    The uncommon code path testing is not as critical in black box testing because
    the beta test will accomplish much of that. More important in this testing is
    to add tests for bugs found in the beta process.


    If you track the initial black box tests, you will find some testers wrote tests
    which all succeeded, and some wrote tests that almost always failed. Use the people
    in the last group to keep writing tests, and the people in the other groups write
    tests for bugs reported by beta sites.


    # Designing the tests


    Tests generally have a longer lifespan than the code they test. Although a program
    may be completely rewritten between versions, the user interface stays somewhat
    constant. Because many tests are written to exercise the user interface, the tests
    are still good, or easily modifiable.


    Also, when a program is converted to another language (human, not programming),
    most of the tests are still good, although they might have to change the actual
    keystrokes input and the test in the results to match the new language. Programs,
    like test routines, are written with an eye on international support.


    Testing is broken down into "test suites." A test suite is nothing more than a
    group of tests that are run. One suite would be the basic functionality test works.
    Another suite could be all of the printing test cases.


    Two test suites can have some crossover in test cases they use. The test cases
    are the actual tests. The test suite is designed to perform a set of tests to
    check something. If possible, a test suite should include other test suites. If
    possible, you should have a test suite for each basic group as well as a master
    suite that includes all of these suites. The master suite would then include every
    test.

