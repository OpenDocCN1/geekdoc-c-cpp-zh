  - '[PAGE 149]


    140 No Bugs


    A test case tests one feature in a program. A test case is a test program composed
    of a set of test scenarios. By running a test case, you should be fully exercising
    the feature with all of the tests written for it. If the test case opening a file
    passes, it has passed all of the tests you have written for opening a file. A
    test case should be as comprehensive as possible—it fully and completely tests
    one feature.


    A test scenario is a part of a test case. Each scenario tests one specific way
    of exercising the function. For example, for opening a file, one scenario would
    pass in a file that doesn''t exist. Another would pass in a file that was bad,
    and so on. A test scenario should be as simple as possible—it tests one specific
    code path.


    The tests should generate logs of the tests they make and, if the tests fail,
    the results of the failure. These logs should be clear and simple as possible.
    The best logs merely tests completed successfully if there were no errors.


    The testing group should design tests to exercise the software to its limits.
    It is not the job of the testing group to randomly use the software. They should,
    with full knowledge of the product, define a set of tests that pushes the limits
    of the software. For each test, they should have a predefined set of inputs that
    corresponds with an expected outcome.


    When completed, the automated tests are a smoothly running product. They perform
    their job well and return their results clearly. They are easy to use and require
    minimal user interaction. A professional test group provides professional series
    of test suites.


    # Running the tests


    The very first test is a test designed by the testers that the developers themselves
    run. Until the software passes this test, it is not handed over to the testers.
    The purpose of this test is not for the developers to do the testers'' job but
    to ensure that, after bug fixes, the program works. Enough of the program features
    needs to work well enough to allow the testers to actually do something.


    This test comprises the tests developed by the white box and black box to test
    the main code paths. As more of the program gets working, this initial test may
    be enlarged. However, at no time should it include capabilities not yet in the
    program. The test is not to determine whether something works for


    © Copyright 1992 by David Thielen - All Rights Reserved'
  - '[PAGE 150]


    the first time but to insure that basic functionality that checked out previously
    has not been broken.


    This test must be completely automated. Simply put, a developer is not likely
    to run a manual test once a week. However, she/he is likely to run a program that
    will report if the program is working as expected.


    The best way to approach this test is to build the product once a week. Once the
    product is built, including everyone''s changes, the automated test is then run
    against the program. If the program passes, it is given to the test group. If
    not, the program is fixed by the developer or developers who broke the test.


    The process of building the program and running the basic test can be done by
    a developer, a person dedicated to this function (a builder), or a tester. The
    program may be built and delivered to the testers to run the basic test. However,
    if the basic test fails, the sole job of the developers is to fix it. Until that
    happens, the developers do not do any other development.


    Once the build passes the basic tests, it is turned over to the test group. The
    testers run their tests, both automated and manual, on the build. The first tests
    should be those that test whether bugs that were reported have truly been fixed.
    If not, then the bug is returned to the appropriate developer.


    Next, if new features were added, the tests developed for the new features should
    be run. Because test programs are written concurrently with development, the programs
    to test new features should be ready as soon as (or before) new features are completed.


    This gives developers immediate feedback on how well they have implemented the
    new function. Instead of waiting weeks or even months, after they have forgotten
    all the details of the implementation, they get feedback within days.


    Finally, the remainder of the tests should be run to ensure no new bugs are introduced
    into the program. This is where automated tests really pay off. Each week, when
    a new build is delivered to the testers, all of the old tests are rerun — at minimal
    cost.


    # Testing platforms


    The testers should be sure they test under actual end-user conditions. If most
    users of a product have 80286 machines with 640K of RAM, testing exclusively'
  - '[PAGE 151]


    with 50 MHz 80486 systems with 8M of memory is going to allow a lot of problems
    to slip through.


    It''s important to run the full set of tests on a least common denominator of
    systems. The tests must pass on every system the program might run on, not simply
    the hardware, but also the software it will run with, including networks, TSRs,
    and so on.


    If you use special monitors, test the program with each. Look for combinations
    that cause trouble. And look for other software packages that might conflict with
    yours. Conflicts can come from sources other than TSRs and device drivers. Under
    Windows, your DOS application might be incompatible with another application that
    is running in another DOS box at the same time.


    Be sure you test with various operating system environments. In the case of DOS,
    you should test with DOS both low and high. Test your program loaded both low
    and high (a UMB). You should also test your program in a Windows DOS box – which
    will catch all illegal memory accesses.


    If your product is network aware and runs on several networks, it is critical
    that you test it on several networks. Testing a network program on only one network
    is a good way to insure it will blow up on every other network out there. Use
    at least three radically different networks. If you talk to different network
    APIs depending on the network, test at least two different networks with each
    API.


    If you are writing a Windows application, be sure it works in both 286 and 386
    mode. In each case, Windows is significantly different. And if your program can
    run in real mode, then test it in real mode. If it''s not important to test it
    in real mode, then you are doing your customers no favor by allowing it to be
    in real mode.


    As object linking and embedding (OLE) becomes more prevalent in Windows applications,
    compatibility with other applications will become more important. You will start
    to see bugs where your program blows up only when it has an OLE connection to
    application B, and application B starts a dynamic data exchange (DDE) connection
    with application C.


    If you are writing a DOS application, be sure it runs on DOS and under Windows
    (286 and 386 modes). Furthermore, even if it is not network aware, be sure it
    runs fine if your system has a network loaded on it, both as a'
  - '[PAGE 152]


    workstation and as a server. These environments can make a big difference to your
    application.


    Work on bringing the system to its knees. A common test for software is to have
    everyone on the net perform the same function at the same time. The real test
    isn''t ''Can one user retrieve a record over the net?'' it''s ''Can 200 retrieve
    a record at the same time?''


    # Testing, testing


    Testers are essentially super users—not power users who know the program well,
    but users who can act like a power user one second and like a novice next. The
    testers ensure that a program not only works as advertised; they also ensure that
    it is usable. A bug-free program that is too difficult (or weird) is of no use
    to anyone.


    users'' advocates to the developers. The testers will first notice that the way
    the program works confuses a user. They are the ones who will use the system to
    see what happens


    Just as the tricks for developers in the earlier chapters attempt to make bugs
    immediately apparent, so do the tests. Each week when a new build is released
    to testing, an immediate and thorough test for bugs begins. Reports of any bugs
    identified are immediately e-mailed to the developers.


    And it all relies on the testers being as good at finding MFUs as the developers
    were at putting the MFUs in the code in the first place.


    # The Beta Test


    A beta test is not a process. A beta test is not a substitute for any of the other
    parts of the test process. A beta test by itself will not find most of the bugs
    in a program. Many companies try to use a beta test instead of a proper internal
    test program. This does not work.


    At the same time, a beta test is essential. No matter how good your internal test
    system is, no matter how talented your testers are, no matter how safe your developers,
    you will produce code with bugs in it. And the only way to find those bugs is
    to have a beta test.'
- md: '

    # No Bugs


    Although everyone has a beta test nowadays, most of the tests are not very effective.
    So what do you want a beta test to accomplish? Four critical items:


    - Test your program on a diverse set of hardware platforms. Of the 80 million
    PCs in the world, 79,999,998 are each slightly different from all of the others.
    (There are two in Iowa that are completely identical.) A beta test allows you
    to test your program on a much wider selection of hardware than you ever could
    internally.

    - This diverse testing is critical. As hard as companies try to use a diverse
    set of hardware for internal testing, the set is in fact remarkably similar. By
    using existing platforms across the United States and the world, you can have
    a chance to be sure your program will run on any hardware combination.

    - Second, test your program with various other programs. Again, aside from the
    two PCs in Iowa, all the computers in the world run a set of TSRs, device drivers,
    and so on that is slightly different from all of the other computers in the world.
    Add to this mix of software products (Some programs are so old, they haven''t
    been updated since the invention of hard drives, networks, or hierarchical file
    systems. Needless to say, some of these programs have trouble with the concept
    of 640k of RAM and freak out if they use USB.) This combination of software can
    cause a completely safe operation to malfunction on some systems. You might actually
    have to program around bugs in other programs to solve some of these problems.
    Only a beta test allows your program to be tested against a truly diverse set
    of combinations.

    - A beta test allows developers to get feedback on a program. If a feature is
    difficult to use, beta testers will let you know. If a very important feature
    is missing, they will let you know. If a feature gets in the way and is not needed,
    they will let you know.


    This gives you feedback before you make a final ship of the product and is too
    late to change it. One missing feature in an otherwise outstanding product can
    drastically reduce sales. One bad feature can ruin a product''s usefulness.


    Developers are interested in creating a product, and testers are interested in
    finding bugs, but users are interested in using it. Beta testers are trying to
    use the software to solve problems. A well-written, bug-free program is not necessarily
    usable. Usability problems are as serious as a bug that makes a program difficult
    to use.


    - A small sub-set of beta testers write programs that interact with your program.
    These users need an advance copy so they can ship an update to their program when
    you ship yours.


    This holds not simply for operating systems such as Windows and OS/2. It holds
    for word processors if someone is dependent on your file structure. It holds for
    programs that have an API you can talk to. It holds for Windows applications that
    support DDE and OLE.


    This group is special for two reasons. First, this group is a subset of the entire
    beta test. Second, depending on the difficulty of incorporating the changes necessary
    due to the changes in your program, these people might need to get a copy before
    the regular beta test.


    # When to beta


    If you look at the first two reasons to have a beta test, you are probably concerned
    with bugs due to very subtle influences. Testing for these influences should wait
    until you are near the end of your development process. If the program changes
    significantly, these subtle influences can act directly. You are not concerned
    whether an early build of the program won''t work with a certain TSR—only if the
    final build won.


    If you look at the third reason to have a beta test, you are concerned with how
    the program acts as a whole. Generally, the feedback for a beta test will not
    uncover a reason to throw away most of the existing work. Instead, it will uncover
    small inconsistencies. Or it will find that some users use the program in different
    ways or under different circumstances, necessitating changes for those circumstances.
    Again, a relatively complete product is needed to get this type of feedback.


    The beta test should come relatively late in the process. Many companies make
    the mistake of starting the beta early to hasten the product''s ship date. A beta
    test will not have the ship date (although it might prolong it).


    There is no reason to start a beta test too early. In fact, there are numerous
    reasons NOT to start a beta too early. First of all, even though labeled beta,
    the quality of the product will influence opinions on the final product. (Windows
    7 was labeled a buggy product due to its early beta state even though the final
    product was rock solid.)


    Also, if a beta product lasts long enough, the beta product will start to be considered
    a released product because all of the opinion-makers have been working with it
    for so long. If the product is still buggy or has bad functionality, the product
    can fail before it is released.


    On the flip side, you should also not wait too long. Initiating a beta period
    week prior to shipping the final product is worse than useless. Not only is it
    no help, but by telling management you had a beta test (and is NOT a beta test),
    they might think the product is ready to ship.


    The purpose of the test is very simple: Developers are ingenious at putting MFUs
    in the program than your testers are at finding them (sorry, testers). MFUs are
    in the code—you know they are—and you want to find them.


    So how do you decide when to start the beta? The first step is to make yourself-hosted
    if possible. If you are writing an operating system, the developers should be
    running the new operating system to develop first. If you are writing a compiler,
    the compiler should be compiling itself. (For non-systems software, self-hosting
    is not always possible—how many developers use a spreadsheet?)


    Also, you should have an internal alpha release while a small number of users,
    preferably within the company developing the product, use it. That way, a small
    group of users (not testers) are actually using the product.


    Ideally, these users will say that aside from a few bugs, the new product, in
    its present state, is preferable to what they are presently using. Once you reach
    this point, after you fix the minor bugs that were found, you are at the perfect
    stage to make your first beta release.


    If your alpha testers are not able to use the program, there is nothing to be
    gained by having a larger group that cannot use the program. As long as the alpha
    testers are reporting significant bugs, you don''t need more people reporting
    the same bugs.


    The best guide is that internal testing is finding a minimal number of bugs and
    the developers will be done coding within another month or two. In other words,
    you need to get some bugs reported within the next month, or some people won''t
    have anything to do.


    # When to ship


    You''re ready to ship your final beta when you send out a beta, and subsequent
    to it, you did not have to make any changes to your core code.


    A development group that does a very job writing bug-free code will generally
    have one to two beta releases (software will generally have more because applications
    talk to operating systems, adding another layer to the puzzle). However, it''s
    better to have additional betas than to ship a buggy product that customers will
    return.


    All of the beta periods except the final one can last for any period of time,
    although the average will be one to two months. If you are still receiving lots
    of new bug reports for a beta, there probably isn''t much to ship a new one. If
    you have a radically new version or you have fixed a lot of critical bugs, it''s
    probably time to ship another beta.


    The final beta period should last a minimum of at least one month and really should
    be two months unless you are getting reports of bugs. The longer you wait, the
    more unusual combinations the program will be put through in the field.


    If you make final changes that you consider safe but do touch the core code, you
    might want to consider shipping a limited beta. Ship copies to those sites that
    you have found the most problems.


    You might also want to consider beta testing through CompuServe or another bulletin
    board service. If beta testers download the beta, then there is no cost to you
    for having some intermediate betas in the course of the beta test.


    # Selecting beta sites


    In our criteria for beta sites, another important feature is diversity. Two users
    with identical computers, software, and habits are not any more useful than one.
    Two radically different users with different systems and software are.

    '
  mdcn: '


    # 无 Bug


    尽管如今每个人都有测试版（beta test），但大多数测试的效果并不理想。那么，你希望 Beta 测试实现什么呢？有四个关键点：


    -   在多样化的硬件平台上测试你的程序。在世界上 8000 万台 PC 中，有 79,999,998 台每台都与所有其他电脑略有不同。（爱荷华州有两台是完全相同的。）Beta
    测试让你能够在内部测试无法触及的更广泛的硬件选择上测试你的程序。

    -   这种多样化的测试至关重要。无论公司如何努力在内部测试中使用多样化的硬件，实际上这组硬件是极其相似的。通过使用美国及全球范围内的现有平台，你有机会确保你的程序可以在任何硬件组合上运行。

    -   第二，用各种其他程序测试你的程序。再次，除了爱荷华州的那两台 PC 外，世界上所有的计算机运行的一组 TSR（终端驻留程序）、设备驱动程序等，与世界上所有其他计算机运行的程序略有不同。将这些软件产品混合在其中（有些程序非常老旧，自从硬盘、网络或分级文件系统发明以来就没有更新过。不用说，其中一些程序在处理
    640k RAM 概念时会有困难，如果使用 USB 它们会“发疯”）。这种软件组合可能导致某些系统上原本完全安全运行发生故障。你实际上可能需要针对其他程序中的
    Bug 编写规避性代码（program around）来解决其中一些问题。只有 Beta 测试才能让你的程序针对真正多样化的组合进行测试。

    -   Beta 测试允许开发者获取对程序的反馈。如果一个功能很难用，Beta 测试员会让你知道。如果缺少了非常重要的功能，他们会告诉你。如果某个功能造成了干扰且不需要，他们也会告诉你。


    这让你在最终发布产品之前（那时就太晚无法了）获得反馈。在一个原本非常出色的产品中，缺少一个功能可能会大幅减少销售额。一个糟糕的功能可能会毁掉一个产品的实用性。


    开发者感兴趣的是创建产品，测试人员感兴趣的是发现 Bug，但用户感兴趣的是使用它。Beta 测试员试图使用软件来解决问题。一个编写良好、无 Bug 的程序并不意味着就好用。易用性问题与导致程序难以使用的
    Bug 一样严重。


    -   一小部分 Beta 测试员编写了与你的程序交互的程序。这些用户需要一个预览版本，以便在你发布你的程序时，他们可以向他们的程序发布更新。


    这不仅适用于 Windows 和 OS/2 等操作系统。如果有人依赖于你的文件结构，它也适用于文字处理器。它适用于你可以与之通信的 API 的程序。它适用于支持
    DDE 和 OLE 的 Windows 应用程序。


    这组人的特殊之处有两个原因。第一，这个小组是整个 Beta 测试的子集。第二，根据你的程序变化而纳入必要更改的难度，这些人可能需要在常规 Beta 测试之前获得一个副本。


    # 何时进行 Beta


    如果你看进行 Beta 测试的前两个原因，你可能在担心由于非常细微的影响导致的 Bug。对这些影响进行测试应该等到开发过程接近尾声时。如果程序发生了重大变化，这些细微的影响就会产生直接作用。你并不关心程序的早期版本是否能与某个
    TSR 工作——只关心最终版本是否可以。


    如果你看进行 Beta 测试的第三个原因，你关心的是程序的整体表现。通常情况下，Beta 测试的反馈不会发现抛弃大部分现有工作的原因。相反，它会发现细微的不一致之处。或者会发现某些用户以不同的方式或在不同的情况下使用程序，导致需要针对这些情况进行更改。再次，需要一个相对完整的产品才能获得这种反馈。


    Beta 测试应该在过程的较晚阶段进行。许多公司犯了一个错误，即过早开始 Beta 以加快产品的发布日期。Beta 测试本身没有发布日期（尽管可能会推迟发布日期）。


    没有理由过早开始 Beta 测试。事实上，有许多理由**不要**过早开始 Beta。首先，尽管被标记为 beta，产品的质量也会影响对最终产品的看法。（Windows
    7 因为其早期的 Beta 状态曾被标记为多 Bug 产品，尽管最终产品是稳如磐石的。）


    此外，如果一个 Beta 产品持续时间足够长，Beta 产品将开始被视为已发布的产品，因为所有的意见领袖都已经在用它这么久了。如果产品仍然有 Bug 或功能缺陷，该产品在发布之前就可能失败。


    相反，你不应该等得太久。在发布最终产品前一周启动 Beta 期间，比没用更糟糕。这不仅没有帮助，而且通过告诉管理层你进行过 Beta 测试（而且**不是**
    Beta 测试），他们可能会认为产品已经准备好发布了。


    测试的目的是非常简单：开发者在程序中放置 MFU（用户误用功能）的技巧远高于测试人员发现它们的技巧（抱歉，测试人员）。MFU 存在于代码中——你知道它们存在——而你想找到它们。


    那么你如何决定何时开始 Beta 呢？第一步是尽可能自托管。如果你正在写一个操作系统，开发者应该先运行新操作系统进行开发。如果你正在写一个编译器，编译器应该编译它自己。（对于非系统软件，自托管并不总是可能的——有多少开发者使用电子表格呢？）


    此外，你应该有一个内部 Alpha 版本，让少数用户（最好是开发产品公司内部的用户）使用它。这样，一小组人（而非测试员）实际上在使用该产品。


    理想情况下，这些用户会认为，除了几个 Bug 之外，目前的产品优于他们正在使用的版本。当你达到这一点并修复了发现的小 Bug 后，就是发布第一个 Beta
    的完美时机。


    如果你的 Alpha 测试员无法使用程序，那么扩大用户群没有任何益处。只要 Alpha 测试员仍在报告 Bug，你就不需要更多人报告相同的 Bug。


    最好的指导是内部测试发现了极少数 Bug，且开发者将在未来一两个月内完成编码。换句话说，你需要在下个月内获得一些报告，否则有些人将无事可做。


    # 何时发布


    当你发送一个 Beta 并且在此之后不需要对核心代码进行任何更改时，你就准备好发布你的最终 Beta 了。


    一个编写无 Bug 代码的开发小组通常会有一个到两个 Beta 版本（因为软件通常会与操作系统交互，增加了问题的复杂性）。然而，拥有额外的 Beta 比发布一个会被退货的
    Bug 产品要好。


    除了最后一个外，所有的 Beta 期间可以持续任何时间，尽管平均是一到两个月。如果你仍然收到大量的新 Bug 报告，那么可能还没到发布新的。如果你有了全新的版本或修复了许多关键
    Bug，可能该发布另一个 Beta 了。


    最后的 Beta 期间至少应持续一个月，除非收到 Bug ，否则真的应该持续两个月。等待得越久，程序在现场经历的异常组合就越多。


    如果你做了你认为是安全的但确实接触了核心代码的最终更改，你可能希望发布限量 Beta。将副本发送给那些发现问题最多的站点。


    你可能还会考虑通过 CompuServe 或其他公告服务进行 Beta 测试。如果 Beta 测试员下载了 Beta，那么在 Beta 测试过程中拥有一些中间
    Beta 对你来说没有任何成本。


    # 选择 Beta 站点


    在我们 Beta 站点的标准中，另一个重要特征是多样性。两个具有相同电脑、软件和习惯的用户并不比一个更有用。两个具有完全不同系统和软件的用户则有。


