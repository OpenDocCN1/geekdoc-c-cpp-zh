    ## 3 No Bugs


    This was in the early days of the PC and I didn''t have all the ideas laid out
    in this book to use writing the program. There were some bugs in how we were handling
    the file format. I knew that much but I couldn''t seem to find those bugs - at
    least all.


    Finally, in desperation, I put code in to check the consistency of the file and
    to correct it when it found problems. As time went on, I found additional bugs
    in my regular code, which I fixed and added to the consistency checks and error
    correction.


    While I kept reducing the bug occurrences, I couldn''t eliminate them. Finally,
    to make testing easier, I ripped out the consistency checks and error correction
    to track down the bugs - and the bugs went away. I had apparently fixed the original
    bugs but bugs in my bug-fix code had introduced new bugs in the meantime.


    There is one company where they preferred to not test the product because bugs
    were reported and they would have to fix them. Of course, when the users reported
    the bugs they had to fix anyway.


    At another company, management would schedule when all bugs were going to be fixed
    and on that day, by definition there were no remaining bugs. Of course, there
    were lots of immediate feature enhancements that users requested that were implemented
    shortly after shipping.


    ## Who this book is for


    Most developers know that software is inherently buggy. And most developers also,
    hopefully, want to eliminate these bugs before shipping a product. This book is
    written for these people.


    However, writing code with no major bugs (sorry, we haven''t yet reached the point
    of truly bug-free code), is a team effort. It takes the work of more than just
    the developers. It takes testers, managers, support personnel, and many more.
    And this book is aimed at these people too.


    ## 4 No Bugs


    This book is designed to solve a problem - buggy code. Because it is aimed at
    the problem instead of a specific audience (ie, just developers or just testers),
    parts of this book may not be interesting to certain audiences. Chapters 3 - 10
    are written mainly for developers. Chapters 11 & 12 are written mainly for testers.


    Yet the book is written to be read straight through. If you want to develop minimally
    buggy code, then you need to understand all the pieces go into getting there.
    Developers need to understand the test process. Testers need to understand what
    the developers will be testing on their own.


    Most importantly, the managers and others responsible for insuring that the whole
    organization need to understand the process. And as important, they need to insure
    that the process is actually being followed.


    Finally, this book is written from the Windows/DOS/PC perspective. While most
    of the ideas discussed are generic to any computing platform, many of the implementations
    are specific to the PC. And some of the code is specific not only to the PC, but
    to specific compilers (stack checking has a tendency to be that way).


    If you program on a platform other than the PC, in a language other than C, you
    will still find this book valuable but you will also find that it leaves a lot
    more work for you to incorporate the ideas here.


    ## No Bugs


    Almost all software developers agree on two things: Software development takes
    too long and software is buggy. With the advent of graphical user interface (GUI)
    applications, this situation will only get worse. Not only are most programs adding
    functionality (more to test), but the message-based architecture has changed it
    from difficult to impossible to test all possible combinations of commands.


    While this book is titled No Bugs, it does not tell you how to write bug-free
    code. Everyone says bug-free like some kind of mantra but it isn''t possible with
    today''s tools and technology.


    This book focuses on delivering code with as few bugs in it as possible. Just
    as important, it also focuses on knowing what bugs still exist in the program
    before you ship it.


    © Copyright 1992 by David Thiel - All Rights Reserved


    ## 5 No Bugs


    Eliminating bugs breaks down into three steps:


    - 1) Putting the bug in the code (yes, you put it there)

    - 2) Finding the bug

    - 3) Fixing it


    This book is entitled No Bugs because it attempts to minimize the first step,
    putting a bug in the program. By reducing the number of bugs in code as you write
    it, you can drastically shorten the amount of time necessary to complete and test
    the program. Most of the tricks presented in this book do not actually stop you
    from writing buggy code. In other words, you will still make the same mistakes
    you made before. But your program will wave a red flag upon discovering your errors
    will allow you to fix them quickly and painlessly.


    Most of the tricks are quick and unobtrusive. Everyone knows writing bug-free
    code is critical, but most developers are loath to spend time eliminating bugs
    when they are working on a tight schedule (with managers breathing down their
    necks), or more interesting code-writing awaiting them. These tricks are designed
    so that a developer in a hurry will use them. With a few hours of practice, you
    can implement most of the enclosed code samples, and you won''t really see any
    of this new code until you find a bug.


    ## Testing


    An important, and most ignored, part of the code-writing process is testing. Every
    software program, no matter how simple, has bugs in it. Every testing process,
    no matter how thorough, lets some slip through. However, the final determiner
    of a program''s relative "bug-freeness" is the testing process it is put through.


    Chapter 12 of this book discusses testing. The PC industry has matured greatly
    over the past several years. Users now expect their software to be bug free and
    to work as expected. What would have been considered rock-solid several years
    ago is now considered bug-ridden as to be worthless.


    ## 6 No Bugs


    This book is designed to teach methods for writing bug-free code, but it doesn''t
    provide the actual code. You may order a disk that includes complete source code.
    Ordering information appears at the back of the book.


    ## This book


    This book is designed to teach methods for writing bug-free code, but it doesn''t
    provide the actual code. You may order a disk that includes complete source code.
    Ordering information appears at the back of the book.


    ## More Tricks


    This book by no way lists all possible tricks being used. It merely lists tricks
    I have invented or learned of. If you have some ideas of your own, please let
    me know about them. If I get new items, then I can include them in a revised edition
    of the book. I will, of course, provide full credit to you unless you request
    anonymity.

    '
