    \ should work for any based processor, this type of code is very compiler specific.\
    \ The code shown here is for Microsoft C 7. An example for Borland C++ 3 is in\
    \ the appendix.\n\n# Stack Space\n\nHow much stack space does your program use?\
    \ This is one of the most critical questions facing a program, yet of the least\
