    通常情况下，不期望程序在这些情况下能够继续运行，但它至少应该优雅地拒绝执行某项功能。


    再次，这些宝贵的工具允许你看到程序在严苛限制下会做什么。通过这些工具和调试内核，你可以很不错地完成 Windows 应用的测试工作。不使用这些工具来测试你的
    Windows 应用是自讨苦福的。


    ## RT-link


    RT-Link 值得在这里提到。RT-Link 是一个用于 DOS 程序的复杂链接器，从上看，它不属于这一节。然而，RT-Link 实现了一些工具，展示了正确实现某些错误检查可以有多强大。


    RT-Link 允许你链接程序以在 8088 代码上使用虚拟内存（在某些情况下也包括数据），代码保存在磁盘上，并在需要时调入内存。与覆盖链接器不同，RT-Link
    维护一个页面列表并将代码加载到 LRU 页面中。


    不用俗说，程序每次运行时的加载方式都非常不同。因为调用了其他代码的代码可以被卸载（然后在返回时重新加载），如果任何一个代码页依赖另一个代码页实际上位于内存中，你就处于一种非常危险的局面。


    这不是 RT-Link 的 bug。你可以告诉 RT-Link 你认为一个代码页直接访问另一个页是安全的，从而节省通过 RT-Link 虚拟内存管理器带来的性能损失。


    然而，如果你在某处错了，你可能会访问一个通常仍在内存中的页面。这会导致只在内存较小的系统上，或在按特定顺序调用一组函数的任何系统上发生的 bug。


    RT-Link 包含一个命令 (`VM_MURPHY`)，为所有虚拟内存交换仅分配一个页面。当与此命令链接时，程序运行速度极慢。然而，内存中任何时候都不会多于一个页面。如果一个页依赖于另一个页在内存中，它就会崩溃。


    这是一个工具供应商整合有助于发现 bug 技术的值得赞的范例。此外，这个命令是一种只有工具供应商才能整合的技术。如果有更多工具供应商提供这样的功能就好了……


    ## 调试器


    确保你有一个良好的调试器。对我个人而言，我倾向于在 386 上使用 Soft-Ice，在 286 或 8086 上使用 Periscope。然而，我更倾向于用汇编语言进行调试。尽管
    Soft-Ice 和 Periscope 都有 C 源码级调试，但通常比编译器厂商提供的源码级显示慢一步步。


    当你真的需要在 386 模式下深入研究 Windows 时，你只有两个调试器可选：`wdeb386` 或 Win-Ice（Windows 版的 Soft-Ice）。`wdeb386`
    随 Windows SDK 附，是一个优秀的命令行调试器。然而，Win-Ice 是一个全屏调试器，并在源码级工作。


    Periscope 有一个 Windows 调试器。然而，对于系统级（在 VxDs 上）调试，它比 Win-Ice 或 WDE386 受限得多。对于应用级调试，它不如
    Multiscope。此外，它需要两个通过串口线连接的 80386 系统。


    用汇编语言调试的宝贵之处在于，你可以看到最终代码的真实情况。这不仅允许你看到编译器是否生成了糟糕的代码（这偶尔会发生），还能看到代码的效率如何。随着 C++
    的出现，这将变得更加重要，因为一个 `+` 可能会变成一组极其缓慢且复杂的指令。


    随编译器附带的源码级调试器（如微软提供的）以低得多的提供了大部分相同的功能。虽然 Soft-ice 会稍微改变系统，但 Periscope 辅助辅助卡对一切都没有影响。这造成了有时是至关重要的区别。


    最后，如果你真的需要深入硬件，并且发现 Soft-ice 干扰了某些时序问题，你需要硬件设备。在这种情况下，只有一个选择：Periscope。


