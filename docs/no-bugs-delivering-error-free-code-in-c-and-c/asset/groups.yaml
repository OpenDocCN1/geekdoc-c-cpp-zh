    # 34 No Bugs


    ```

    #ifdef DEBUG

    {DebugPrintf("Calling strcpy")

    #define StrCpy(d,s)   (%p, %p) from s:%d\n", d, __FILE__, __LINE__);); char *r;
    r =

    strcpy(d, s); DebugPrintf("Return strcpy") %p\n", r)}

    #else

    #define StrCpy(d,s)      strcpy (d, s)

    #endif

    ```


    In the above example, ENTER and EXIT are functions. Functions can track how deep
    the function is nested and indent the printfs appropriately. Let you see the matching
    EXIT for an ENTER.


    Regardless of how you set this up, you won''t be down in data. Also, if the logging
    occurs every function call, including those to the low-level library calls, your
    program can slow to a crawl as it spends most of its time spewing vast amounts
    of data to the debug terminal, virtually all of which is ignored.


    So when should you use this? Personally, I have never found ENTER/EXIT logging
    to be useful to me. I list it because it is a technique some people use. However,
    my recommendation is that, unless you see a return in doing it, to skip ENTER/EXIT
    logging.


    # Error Message file


    In most cases you will probably want to send your debug output to a second monitor.
    In some cases, you might want to send it to a log file. The easiest way to do
    this is to have the DebugPrintf decide which printfs are going to the monitor,
    the file, or both.


    The error file needs to be opened when the program starts. You will probably want
    to either create the file (deleting the previous log file) or use a new name each
    time (such as incrementing the extension until you find a filename in not existence)
    so that you are not creating a very large file.


    You then need to consider committing (DOS function ah=68h) the file on each write.
    If you do not and the program locks up, you will lose the most recent writes,
    usually the ones that tell why the program locked up. However, a commit on each
    lock is slow. And you can''t use your RAM disk – that is lost if the system goes
    up. I have found writing to a log file, with enough information and commits to
    be useful, is so slow as to be useless.


