    \ I have seen is simple yet powerful. Begin with two variables, BugType and BugLev.\
    \ BugType is a byte that defines the part of the program. BugLev is an array of\
    \ bitmaps. For each BugType value, there is a separate BugLev bitmap determining\
    \ what to turn on. To determine whether you should perform a debug check, you\
    \ use the value of BugType for your function, index BugLev with BugType, and check\
    \ the value against the bit that signifies the check should be performed.\n\n\
