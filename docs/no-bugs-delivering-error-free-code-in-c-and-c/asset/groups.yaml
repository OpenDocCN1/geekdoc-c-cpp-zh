    ## Bug 报告


    bug 报告过程也应该是自动化的。当一个 bug 被报告时，应该尽可能将关于 bug 的信息传递给相关的开发人员。


    一个能够报告发现 bug 的所在系统所有信息的程序是一个非常有用的功能。除外，它应该包含系统 `config.sys` 和 `autexec.bat` 文件的副本，主板和
    ROM-BIOS 制造商等。它应该告诉你任何可能与 bug 相关的信息。


    将信息写入日志文件的能力是程序调试版本中应包含的另一个有用功能。当发现 bug 时，日志文件的内容通常会提供所有所需的信息。虽然这对于在最终产品中不是一个适当的功能，但在
    Beta 程序中非常有价值，特别是如果它可以被关闭（为了速度）。


    测试人员在将 bug 交给开发人员之前，需要先重现该 bug。如果测试人员无法重现该 bug，那么他们或开发人员都没有办法验证它是否已被修复。


    如果 bug 只发生在一个系统上，那么测试人员和开发人员将不得不使用该系统。如果该系统位于 Beta 现场，这可能会成为一个问题。在这种情况下，如果 bug
    足够严重，则需要将计算机运送到开发现场。


    当 bug 被修复后，开发人员需要通知测试人员。这种通信通道应该是自动化的（电子邮件非常适合此类）。测试人员可以进行测试以查看 bug 是否真的被修复。测试人员是决定
    bug 是否已真正修复的人。


    如果没有自动化测试来发现已修复的 bug，那么测试人员应该强烈考虑将其添加到现有的测试中，或者编写一个测试来检查该 bug。如果它发生过一次，它可能会再次发生。这种“回归测试”可能是至关重要的。很多时候，修复一个
    bug 会引入一个新的 bug。在修复新 bug 时，另一个开发人员可能会在无意中重新引入旧 bug。


    ## Bug 数据库


    跟踪 bug 与发现 bug 一样关键。如果发现了一个 bug 但从未被修复，那么程序并不会好转。如果一个开发人员在工作一周后确定某个 bug 无法修复，你不希望另一个开发人员再花费一周时间去重新发现相同的问题。


    如果两个人报告了同一个 bug，你不希望由两个不同的开发人员去修复它。如果一个 bug 被修复，然后在另一个较晚的版本中重新出现，引用早期的报告应该引导开发人员找到真正的
    bug。


    Bug 数据库不仅仅是计算机上的一个简单数据库。它部分是通信程序，部分是流程，部分是数据库。它是跟踪 bug 的手段。


    虽然一个人的努力可以简化这一过程的大部分，但实际过程仍然应该存在。独立工作的开发人员/测试人员仍然需要跟踪 bug。


    如果可能的话，应该由一个人将所有 bug 输入系统。这个人是 Bug 主管（Bug Master），是整个开发过程中最不受感谢的工作之一。发现 bug 的个人应该将
    bug 报告通过电子邮件发送到 bug 邮箱（假设你有电子邮件）。


    项目上的所有开发人员和测试人员都应该在这个别名列表中，并应该阅读所有发送该别名的邮件。很多时候，开发人员或测试人员会知道 bug 的答案，并可以向发送者和
    Bug 主管发送回复，从而节省大量时间。


    这一点值得重复。开发人员的工作不是等待分配 bug。开发人员的工作是帮助发现他们置于程序中的所有 MFU（用户功能故障/缺陷）。获取每个 bug 报告的副本，即使大多数报告在阅读第一行或两行后被丢弃，对这一过程来说也是至关重要的。


    虽然每个人都阅读发送给 bug 别名的邮件，但 Bug 主管是执行操作的人。他或她将 bug 输入数据库。在数据库中输入 bug 应该包含分配给该 bug
    的开发人员和测试人员的姓名。这应该会向他们以及报告 bug 的人同时生成电子邮件。


    当 bug 被指派时，它还会被分配一个“严重程度”（severity）。这种严重程度通常应该是小范围内的一个数字，清晰地说明该 bug 的关键程度：


    - 等级 1：程序导致灾难性的破坏（例如，格式化你的硬盘）

    - 等级 2：某些主要功能无法工作（例如，你无法打印）

    - 等级 3：某些次要功能无法工作（例如，无法自动备份）

    - 等级 4：程序可以运行但有问题（例如，无法到驱动器）

    - 等级 5：设计缺陷

    - 等级 6：未来的建议（例如，允许通配符）


    按严重程度分类有两个原因很重要。首先，它允许开发人员优先处理 bug。其次，随着发布日的临近，只有低程度的 bug 会被修复。因为修复 bug 可能会引入新的、更严重的
    bug，你在最后时刻需要非常小心。


    你可以随时更改 bug 的严重程度。然而，这种对级别的评定对于管理层判断何时可以发布非常重要。


    当 bug 被修复后，开发人员需要将修复细节输入数据库。这为该 bug 再次出现时提供了参考。它在尝试解决类似的 bug 时也有用。


    开发人员发送电子邮件给测试人员和 Bug 主管，表示他认为 bug 已修复。此时，bug 被分配给测试人员。现在，由测试人员负责确定 bug 是否已消除。理想情况下，当开发人员修复
    bug 时，测试人员正在编写针对该 bug 的自动化测试。


    如果多个开发人员在同一个程序上工作，通常更有效的方法是每周（有时更多或更少）构建一次程序，并将该构建交给测试人员。（构建提取所有人提交的代码并创建一个大家使用和测试程序版本。）测试人员可以对该构建进行测试。


    定期的（通常是每周）构建带来了巨大的优势。首先，在测试 bug 是否被修复时，测试人员测试的是该周进行的所有更改，而不仅仅是修复该 bug 的一个小更改。其次，可以在新构建上运行整个自动化测试套，允许测试人员判断修复是否破坏了其他部分。


    最后，如果测试人员确定 bug 已修复，那么他或她将向 Bug 主管和开发人员发送公告。该 bug 在数据库中随后被标记为已修复。


    有时开发人员会确定某个 bug 无法修复。这个决定可能会由管理层审查，但如果最终决定该 bug 无法修复，那么它在数据库中就会被标记为“无法修复”。在这种情况下，在数据库中充分记录该
    bug 变得更加至关重要，因为它可能会再次被报告。


