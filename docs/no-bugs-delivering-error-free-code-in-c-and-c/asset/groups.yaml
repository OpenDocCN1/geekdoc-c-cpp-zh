    ## No Bugs


    You assume certain things can''t happen or must happen at certain places in code.
    Place an assertion in your code that tests for this and prints if the impossible
    happens or the certain fails. The best way to place these is to look at your functions
    after you have finished and ask yourself what can go wrong. Usually one or more
    places in the code will jump out at you. Place one there. While debugging you
    will also come across bugs that would have been solved by assert. Place one there
    and remember the situation the next time you are placing assertions.


    For example, if you assume multiplying 2 ints will always have a result that is
    an int, then assert((long)i * (long)i < 0x7FFF); As you walk through a tree, if
    you assume a certain pointer is always good, then assert(pTree != NULL); or assert(pTree->uID
    == ID_TREE); One of the most important assertions is that you check the ID of
    a struct when a function is called, or returns a struct.


