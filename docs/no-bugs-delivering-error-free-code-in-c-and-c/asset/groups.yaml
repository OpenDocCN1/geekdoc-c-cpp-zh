  - "[PAGE 34]\n\n```\n#ifdef DEBUG\nfast_test();\nif (DebugVar > 1)\n    slow_test();\n\
    if (DebugVar > 2)\n    real_slow_test();\n#endif\n```\n\nAlthough there are a\
    \ lot of fancy ways to implement this conditional debug code, two rules seem to\
    \ hold. First, you generally don't ever want to turn debugging on or off after\
    \ a compile. Second, both ways of implementing this seems to be equally fast to\
    \ code and execute.\n\nFor simple code, debugging is generally an on/off proposition.\
    \ In these cases, using #ifdef alone is generally sufficient, and anything more\
    \ is a waste of time. For code that is otherwise simple but has a couple of time-consuming\
    \ checks, you can use the value for which DEBUG is defined as conditional compiles.\n\
    \nKeep in mind with conditional debugging that some debug tests are matched. If\
    \ your allocate conditionally sets the signature bytes before and after each region\
    \ of allocated memory, it better do it if any of the conditional defines that\
    \ check the heap for the signature bytes are executed. I once spent several hours\
    \ trying to determine why some buffers were failing their CRC tests - the reason\
    \ was the CRC creation code had ifdefed out while the checking hadn't.\n\n# Comment\
    \ your open Issues\n\nAs you, issues or questions come up in certain pieces of\
    \ the code: Will a function work on a Super VGA monitor? How do you handle data\
    \ files with a particular error? Do you need to watch out for a certain condition?\n\
    \nThese questions are not resolved by Traps and IntTests. Rather, they are items\
    \ that you believe have not fully coded for or, in some cases, you have not coded\
    \ for all. In other cases, your program will fail under conditions in which you\
    \ need it to continue running.\n\nThese are possible logic errors that occurred\
    \ to you one time or another. Unfortunately, the human mind being what it is,\
    \ these errors will be quickly forgotten (until the bug comes in). These MFUs\
    \ are classified as \"oh shit\""
  - '[PAGE 35]


    # No Bugs


    bugs - based on the phrase usually heard when the bug is first reported to the
    developer responsible.


    The place to write down these concerns is in the code itself. Anywhere else and
    the place it is written can get lost. If in the code - its forever, or until you
    resolve the question.


    In these cases, place a one-line comment, the word "bugbug" followed by your initials
    and the date. You can follow this with a comment that runs for several lines,
    but the first line should give a reasonable description.


    # BUGBUG


    The program example below illustrates the use of the BUGBUG comment.


    ```

    // BUGBUG DNT 32/1/92 - No memory. Should we go to disk?

    // At the moment if we run out of memory we fail. However,

    // if this runs on large files, running out of memory could be

    // common.

    ```


    This BUGBUG accomplishes three things.


    +   By performing a grep or text search for BUGBUG on all the files, you get all
    the title lines of open issues. (Note: in the asm chapter, a way is shown to have
    the BUGUGS print to the screen during a compile. Unfortunately c doesn''t support
    printing during a compile in a manner that makes this possible.)


    +   The open issues travel with the code. You can''t lose the list of open items
    (unless you lose the code too).


    +   The open items are right there at the relevant spot in the code—you don''t
    need to search all the files to find the correct spot.


    When you ship a product, you should not have any BUGUGS in your code. In the above
    example, you might have decided to go to disk. You might also have decided you
    could limit yourself to memory. In either case, the question was resolved.


    If you don''t use BUGBUG, you might forget or lose important issues. You might
    not remember the issue until users report the bug after the program'
