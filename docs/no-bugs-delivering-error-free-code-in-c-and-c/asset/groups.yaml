    );\n\n    memset(&vars, FILL_CHAR, sizeof(s_string));\n    ID = ~STRING_ID;\n\
    }\n#endif\n```\n\n通过在构造函数和析构函数中使用上述实践，你就可以从我们所有的类中消除以下类型的错误。如果你使用了未初始化的变量，将得到一个坏值（`FILL_CHAR`）。如果你得到了一个错误的指针，在销毁错误的指针时，你会收到一条消息。最后，如果你覆盖了数据，也会收到一条消息。如果你尝试在变量超出作用域后访问它，将得到坏数据。\n\
    \n仅仅通过在每个构造函数和析构函数中放置少量代码，我们就获得了所有这些强大的功能。而且性能影响微乎其微。\n\n# 基类断言\n\n大多数 C++ 程序员使用一个所有类都派生的基类。仅在调试模式下，为基类添加两个方法。第一个是\
    \ `Assert` 函数。你只需调用 `inst.Assert()` 对类的任何实例进行断言。在非调试模式下，`Assert` 应该定义为空空函数，这样就不会为断言调用生成代码。\n\
    \n这把断言放在了它应该，作为类定义的一部分。随着类的变化，它的断言也会之变化。它也使得断言任何实例变得非常简单。\n\n# 基断言\n\n下面的程序示例说明了\
    \ `Assert` 的定义。\n\n```cpp\nclass base\n{\n...\n\n#if DEBUG\n  void Assert (void);\n\
    \  void Dump (void);\n#else\n  void Assert (void) {};\n  void Dump (void) {};\n\
    #endif\n\n#if DEBUG\nvoid base::Assert (void)\n{\n  // 这个函数不应该被调用\n  DebugMessageBox\
    \ (\"No Assert for this class - OhOh\");\n}\n#endif\n```\n\n你应该添加的第二个方法是 `Dump`。`Dump`\
    \ 将输出调试监控器的内容。有了 `Assert`，它把 `Dump` 放在了它应该，与类在一起。它也使得导出类实例的内容变得容易。\n\n# 基转储\n\n\
    ```cpp\n#if DEBUG\nvoid base::Dump(void)\n{\n    // 这个函数不应该被调用\n    DebugPrintf(0,\
    \ \"No Dump for this class - OhOh.. \");\n}\n#endif\n```\n\n对于每个类，你都在调试模式下定义这两个函数。在非调试模式下，将使用基类的空定义。如果一个人设计了一个类，另一个开发者可以在不了解类本身的情况下对其进行断言或转储。\n\
    \n这把一些调试功能带入了面向对象的世界。仅仅因为我正在销毁一个类的实例，并不意味着我想知道它是如何工作的。我只是想知道它是什么时候被销毁的。\n\n我们可以让断言简单如检查\
