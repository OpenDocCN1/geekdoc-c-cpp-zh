    # No Bugs


    Once you have exercised all possible code paths, you have not ensured that all
    possible combinations of code paths will work, but it does ensure that each subpath
    has been tested.


    # Walking each path


    Walk yourself through each code path in each function. You do not have to walk
    through every combination of paths, but you should walk through every part of
    each function. Watching the affected variables as you single-step through functions
    will often make a bug stand out.


    As you walk through, sometimes you can move quickly and other times you might
    want to watch several variables at each step. Use your judgment. In most cases
    simply watching the program run and focusing on one or two variables allows you
    to single-step through quickly. Suddenly, the code will do the opposite of what
    you expect on a conditional, and then you should pay close attention to everything.


    Unfortunately, there is no set of rules that tell you how to be and what to watch
    for any type of program. The one rule I almost always follow though, the first
    time I go through a function, I look at all the parameters on entry, single step
    through very carefully, and check the parameters on exit.


    On subsequent passes through a function, I generally only check those items that
    are affected differently by the new code path that caused me to hit a Trap.


    As your code nears completion, you will find some IntTests and Traps still in
    your code. Just because no one has ever caused that path to be exercised is no
    reason to simply pull them. You should develop special test cases to exercise
    these paths. This is a critical step.


    # Forcing actions


    Another set of bugs that occur rarely is due to system functions usually acting
    one way, but occasionally another. The most common case is a realloc call, that,
    under somewhat circumstances, will usually return the address passed in. However,
    occasionally it returns a different address.


    If your testing, the realloc always returns the same address, then you have no
    way of testing if your code properly handles being returned a different


    © Copyright 1992 by David Thiel - All Rights Reserved'
- md: '

    # 19 Bugs


    address. You not only have to worry about the variable you pass to realloc, but
    if another variable is also holding a pointer to the old (pre-realloc) address.


    However, if in debug mode, a realloc would always return a different pointer,
    then you know you will handle that properly. In addition, the realloc needs to
    put garbage data in the old memory location. Otherwise, a pointer to the old location
    would still see legitimate data until that memory is used again.


    Whenever you unlock relocatable memory, move it and, if you are caching garbage
    data at the old location. If you are caching disk data, as soon as it is unlocked,
    write it to disk and clear the buffer. If you are interacting with a TSR on the
    timer tick and there are you set a semaphore to turn the TSR off, call the timer
    interrupt on the instruction before and after turning it off.


    You also want to create an impossibly bad environment for the program. If it survives,
    it should survive any actual situation where resources become a little tight.


    RT-Link, a linker that provides code swapping, does this beautifully. You can
    run it with one available code page so all code is swapped into the same page.
    This insures that every code page will be swapped in top of the previous code
    page. If any code page depends on another code page also being in memory at the
    same time, it will crash the program.


    On any call, if an error can occur, it should be tested. Every malloc should be
    tested for returning a NULL. Not only this is criminal, as you will then cause
    intermittently noticeable errors only on low memory systems.


    Every file open test for handle of -1, including creating temporary files. You
    should also test all file I/O for success. I have seen programs where the program
    assumes a temporary file create and write always succeed. I guess the developer''s
    RAM drive was always big enough, but mine wasn''t. You even need to check read/writes
    to existing parts of a file. If a connection drops, you cannot access the file.


    For one program I wrote, I created a virtual memory system (for DOS) that would
    go first to regular memory. If regular memory was used, it would go to EMS. If
    EMS was used up, it would go to disk. So do I know it all works? I set it up in
    debug mode to optionally, always allocate from EMS or disk. The disk-only version
    was slow (we''re talking big delays on a 486), but all the functions worked. In
    this manner, I was able to force the program to use each memory system.


    If your temporary files are moved to a hard disk if a RAM disk fills up, be sure
    to test your application with a RAM disk that is too small. Anywhere you have
    backup procedures to protect you in case you run out of your preferred resource,
    be sure you can test the entire system using the backup resource.


    If you write a TSR that uses semaphores to prevent reentrancy, just before and
    after the semaphore, call the interrupt the TSR it is sitting on to be sure it
    will not reenter itself. The trick is to see if you can break your code.


    All of the above tricks are specific to the code they were testing. Every program,
    will have different weak points. You need to find those weak points and then break
    them. If you are determined to discover those MFUs you put in your code, then
    you will be able to figure out how to break your code.


    # Rock-solid low-level functions


    When you add two integers, the result isn''t bigger than an integer, you know
    that it will work. Think of how debugging would be if you didn''t know this. You
    would have to check what the instruction did at each place you added two numbers
    and test each with various combinations of numbers. You basically couldn''t program.


    Now lets up a level. What if you aren''t positive about strcpy (or any of the
    run-time functions). You can now at least (in fact I remember the early days of
    PC compilers when you couldn''t depend on these functions). But it''s not an easy
    task. Your testing and debugging job has grown by leaps and bounds.


    But you can trust the processor and run-times (if you can''t it to switch). However,
    every program has a set of its own low-level functions that are specific to it.
    These low-level functions have two important attributes. First, they are used
    throughout your program. A minor bug in one of them is a serious MFU in the program.


    Second, you can generally test all combinations of program flow in these low-level
    functions. Thoroughly test these low-level functions. You should be able to depend
    on these calls the same way you depend on a ''+-'' (add).


    To do this, write test programs that call your low-level functions with enough
    different parameter combinations to test all possible code path combinations and
    print to the screen only if the return value is incorrect. That way, when you
    make a change to the function, it is very easy to test again.


    You have two major gains from exhaustive testing of the low-level functions. First,
    part of your code approaches being bug-free. Having part of your code bug-free
    should drop the total bug count.


    More importantly, although a bug in a high-level function will generally cause
    one problem, a single bug in a low-level function (such as linked list management)
    can cause innumerable bugs to appear throughout your program. The low-level functions
    are the foundation and frame of your program—if it is solid, the program is solid.
    If it''s shaky, no amount of effort elsewhere can then make the program solid.


    It is also critical that testing be performed on all functions that are widely
    used, even if they are not low level. When is a function-enough to merit exhaustive
    testing? When is it possible to come up with a set of test cases that test every
    combination of entry. If you take another look at your code, you might be surprised
    by how much of it could test this way. You can test practically every command
    in a database, every function in a word processor, every tool in a graphics package,
    this way.


    When you view the program logic, it becomes clear that a small number of test
    cases will exercise all the possible paths through the code. If you can''t test
    anything this way, that all of your functions depend on all the other functions,
    you''ve got a serious problem on your hands. However, if you''ve written really
    clean, separable (that is, object-oriented style) code, you will find almost all
    of your functions are testable in this manner.


    So you have this giant library of code, and you don''t want to write test routines
    for all of it. So don''t. You can write test routines for sets of 15 to 40 similar
    functions (for example, strcat, strcpy, str) in about three days. You will find
    few bugs, if any. However, those you find will be bugs in the past you were never
    able to reproduce. And if you find no bugs, assuming you wrote test programs,
    you now KNOW that your low-level functions are solid.


    If most of your code is testable this way, you might be surprised by how few bugs
    make it into the final product if you test the pieces beforehand as described
    here.


    It may be coincidence, but when I started all-out testing of my low level functions
    is when I saw the biggest decrement in bugs in the programs I wrote. Not only
    that, but subsequent to doing this, I cannot recall a single instance where a
    bug seriously affected the entire program was found.

    '
