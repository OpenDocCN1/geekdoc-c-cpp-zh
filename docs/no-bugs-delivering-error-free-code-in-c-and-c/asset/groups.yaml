    ## Chapter 6


    ## DEBUG PRINTSFS


    We''ve now written a number of routines to help us find and eliminate MFUs. However,
    we need some way for this code to communicate with us. However, we don''t want
    our debug output getting mixed up in our regular output. Therefore, we need debug
    functions for displaying information.


    An effective set of debug printfs make the difference between the debug information
    helping you debug or getting in your way. This chapter shows how to display the
    debug information without its interfering with the normal displaying of data in
    the program.


    You need debug prints for two reasons.


    - First, for Message Boxes that tell the user of an error and then tell the user
    to press a key before continuing. Generally, when an assertion or parameter check
    fails, a Message Box should be used so the user stops at the error.


    - Second, for informational messages. These messages tell you what the program
    is presently doing, and the program should continue, without intervention, after
    printing each message. Listing the Windows message presently being processed is
    a good example of an informational message.


    The debug printf is an important tool in the process of eliminating bugs in your
    code. When something is wrong, you should display the error as directly as possible.
    A Message Box that pops up in front of the user fulfils this need nicely. Creating
    a function that makes this pop-up easy to format and call is important so that
    it is wherever and whenever it should be.


    However, just as important is a clean and easy way to list the informational debug
    messages. If properly implemented, these messages will allow you to compare what
    the program is doing internally with what the monitor says it is doing. If the
    debug printf say you are editing one document when your program is showing another,
    something is probably wrong.


    Rather than writing debug printfs to a serial terminal, the program below writes
    to the monochrome monitor, which is divided into a number of windows. Because
    the monitor is divided into windows, printfs to one windows will not scroll valuable
    information in another window offscreen.


    Conditional debug printf de print only when turned on. They can be turned on and
    off either with compile-time defines or run-time variables (covered in chapter
    3). Using defines is a lot simpler but requires you to rebuild a program to turn
    some debug prints off or on. Using debug variables is a little more complicated,
    but they allow you to turn debugs on and off without rebuilding the program.


    This chapter discusses these three processes, debug pop-up Message Boxes, debug
    printf’s to a second monitor, and conditional debug printf’s. Virtually all code
    for these functions is listed in the appendix. There was no way to break the code
    into small pieces. So rather than have a giant chunk of code in the middle of
    the book, I moved this code to the appendix.


    ## Message Box


    Even under Windows, a good Message Box function requires some coding. In the case
    of DOS, it requires quite a bit of work. You use two Message Box functions; DebugMessageBox
    and DebugMessageRes. DebugMessageBox has the same parameters as printf. DebugMessageRes
    has a resource instead of a format string.


    This resource moves the format string out of the default data segment. If you
    make extensive use of assertions and parameter checking (as you should), you could
    find the format strings for all the calls to DebugMessageBox consuming a significant
    percentage of the default data segment, possible causing you to run out of room.
    Because the job of the debugging code is to fix problems, not cause them, you
    should store the strings as resources rather than as data.


    Because DOS, unlike Windows, does not have resources, the strings are stored in
    a far data segment along with their resource number. When DebugMessageRes is called,
    the string is copied from the far data segment into a buffer, and DebugMessageBox
    is called. This way, the strings are still not in the default data segment.


    DOS has two types of Message Boxes. The first simply performs printfs to the screen.
    The second pops up a box on the screen and after the user presses a key, will
    disappear, with what was under the box placed back on the screen. The pop-up box
    will force the screen into 80 x 25 mode before displaying the box and place the
    screen back to its previous mode when done. Therefore, even if your program is
    not in character mode, if it uses the ROM BIOS to do its screen switching, the
    pop-up box should work fine.


    When the box comes up, you may only press <CR> or ESC. If you press <CR>, the
    program will continue. If you press ESC, the program will exit to DOS, leaving
    the Message Box on the screen. ESC is useful if you run into an error that makes
    you want to bail out—where continuing might result in reformatting your hard disk,
    for example. It has the added benefit of leaving the debug message on the screen.


    Windows uses the Windows MessageBox function. It is brought in a TASKMODAL state
    so your program is stopped but you can still use other programs on the system.
    By exiting a Windows app causes numerous messages to be handled, pressing ESC
    in Windows does not exit the program. Instead, it turns off the MessageBox processing
    so subsequent messages are not displayed.


    This demonstrates a difference in functionality between DOS and Windows. I have
    found, however, that under Windows it is common for one error to cause 50 to 100
    subsequent error messages. Yet I might want to continue testing after the first
    error occurs without having to press <CR> 100 times. Under DOS this cascading
    of errors is a lot less common. Its part of the nature of the differences in the
    environments.


    Debug messages can be printed one other way. Using the DebugPrintf described later
    in this chapter, the debug message is displayed in the debug monitor and then
    waits for a key press. Using Windows 3 of this system, the program display is
    not affected at all.


    ## 59 Bugs


    Debug messages can be printed one other way. Using the DebugPrintf described later
    in this chapter, the debug message is displayed in the debug monitor and then
    waits for a key press. Using Windows 3 of this system, the program display is
    not affected at all.


    ## Debug printf


    When we are writing a program, even when you are not looking for bugs, it is very
    useful at times to be able to print out information on the internal state of the
    system. However, you do not want to print this on your main screen as it will
    interfere with the program you are running.


    However, most color video cards can co-exist with a monochrome card also in your
    system. This second monitor can be used to write to. The debug printf''s will''t
    interfere with the main screen display. Also, since the printf''s goes to video
    memory, it doesn''t affect DOS.


    We also divide the printf into several fixed size/location windows. Then write
    a printf which the first parameter is an int that states which window to write
    to. You can then write information to the second monitor.


    The purpose of the multiple windows is to protect important information from being
    scrolled off the screen by subsequent unimportant information. In Windows, I have
    one window that lists messages sent to my WndProc In one just for debug/error
    messages. This leaves me three windows for printing messages of various importance.

    '
