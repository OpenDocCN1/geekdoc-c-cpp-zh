    \n; NOTE: Error not written yet\nErr:  TRAP\n```\n\n# BUGBUG\n\nIn MASM, you can\
    \ make BUGBUG a macro. This has the advantage that you can then have these optionally\
    \ print to the screen when compiling. As you get close to your final beta release,\
    \ you should cause these to print. Like Traps and IntTests, these should all be\
