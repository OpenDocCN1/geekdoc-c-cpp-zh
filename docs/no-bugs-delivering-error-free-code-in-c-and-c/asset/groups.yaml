    ## CRC Checking


    Personally, I have never seen the need for CRC checks. However, a developer I
    respect a lot swears so I leave it up to you. I am sure there are times it can
    pay off.


    The first place to use CRC checking is on data structures (especially those buffering
    generic data). By performing a CRC check, you gain two additional checks. First,
    if there is no way to make a consistency check (the buffer is reading a binary
    file - any values are legit) of the buffer, we can still verify that the data
    is good.


    Second, if we want to make sure the structure hasn''t changed to a different set
    of consistent data, the CRC will tell us if the data set we believe, even if the
    data passes our consistency test.


    Another useful check is to verify that you didn''t write to CONST segments. If
    you use Bounds Checker (see the tools chapter) or you are running under a protected
    mode operating system (such as a Windows application in standard or enhanced mode),
    it will do this for you. However, if you don''t have these options, you can perform
    a CRC of these segments on start-up and then compare it in your TestAll function
    and when the program exits.


    In both cases, this is usually due to a loose pointer. Keep in mind that some
    third-party libraries use self-modifying code which would make this test difficult.
    However, with the chip pre-fetch queue in the 80286 and beyond, self-modifying
    code has become a dangerous practice that is being used less and less.


    ## Roll your Own


    Keep in mind that this chapter is filled with suggestions, not a rigid set of
    practices to take as a whole. Some of these will work better for you, some worse.
    You want to use those that will pay off for you and not waste your time with those
    that won''t.


    In addition, if you have practices of your own that are not mentioned here, continue
    to use them. The trick is to use what works, not what is written down. These tricks
    are ones to add to your repetoir, not to replace it.


    # Chapter 5


    ## ASSERT THE WORLD


    A couple of years ago, I was writing a piece of code where I was performing some
    very complicated actions on a buffer I was walking. I had several pointers, that
    had a very specific relationship to each other. If one of these pointers was off
    in relation to the others, then I would get major errors.


    I spent days on this code, each time I found a bug, tracking its cause. Almost
    every time I found one bug, another would get created. Finally, in desperation,
    I wrote a function to check the pointers'' relationship to each other at the beginning
    of each pass through the loop. If the pointers didn''t match, I printed out the
    value of every local variable.


    Within a couple of hours, I found the remaining bugs and had the function working.
    I surrounded my assert code with a #ifdef DEBUG and left it in there. Subsequent
    bugs in the code identified themselves.


    Since then, I have come to use this practice (assertion) virtually everywhere.
    Not only does it save you days of tracking bugs, but it finds bugs that otherwise
    wouldn''t found. And finally, for the asserts that never find a bug, you can feel
    that much more secure your code - you have parts that you know are working correctly.


    As you go through your code, you have places where a variable holds a certain
    value and you have places where you believe that a variable holds a certain value.
    And unfortunately, you might have places where you hope that a variable holds
    a certain value (major MFU alert). In most cases, the honest answer is that you
    believe a variable holds a certain value.


    The fact that you don''t know is part of programming. If you write a low-level
    function, you have no control over the code calling your function. In a complicated
    procedure you believe that you understand every possible path the code can take
    but you can''t know for certain.


