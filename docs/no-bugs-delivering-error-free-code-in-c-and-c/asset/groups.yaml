    # When to beta


    If you look at the first two reasons to have a beta test, you are probably concerned
    with bugs due to very subtle influences. Testing for these influences should wait
    until you are near the end of your development process. If the program changes
    significantly, these subtle influences can act directly. You are not concerned
    whether an early build of the program won''t work with a certain TSR—only if the
    final build won.


    If you look at the third reason to have a beta test, you are concerned with how
    the program acts as a whole. Generally, the feedback for a beta test will not
    uncover a reason to throw away most of the existing work. Instead, it will uncover
    small inconsistencies. Or it will find that some users use the program in different
    ways or under different circumstances, necessitating changes for those circumstances.
    Again, a relatively complete product is needed to get this type of feedback.


    The beta test should come relatively late in the process. Many companies make
    the mistake of starting the beta early to hasten the product''s ship date. A beta
    test will not have the ship date (although it might prolong it).


    There is no reason to start a beta test too early. In fact, there are numerous
    reasons NOT to start a beta too early. First of all, even though labeled beta,
    the quality of the product will influence opinions on the final product. (Microsoft'
