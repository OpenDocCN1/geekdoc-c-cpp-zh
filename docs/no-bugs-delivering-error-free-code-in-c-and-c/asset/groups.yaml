- md: "\nWe can check these registers by preserving them all on entry and checking\
    \ them on exit. The following macros use pusha to keep the code example short.\
    \ They also don't check segment registers; that check is not needed in a small\
    \ model program with no far pointers.\n\nEntry must be the first call in each\
    \ function. If you access variables on the stack, you need to take the pusha into\
    \ account when determining offsets for parameters. The equate STACK_OFF can simply\
    \ be added to each offset.\n\nThe only call that should come after the RegCheck\
    \ call is a ret. You might want to include the ret in RegCheck. I prefer to use\
    \ it separately. A function with no ret at the end looks strange. RegCheck uses\
    \ add sp, 16 because you cannot restore those registers that have changed. You\
    \ check against the registers that were pusahed, but you then them away.\n\nThese\
    \ macros will not only find whether you are not preserving a register—they will\
    \ also find whether have cleaned up the stack properly. If you have not returned\
    \ SP to its previous value, then none of the checks should pass. Test SP first\
    \ so that it fails, you-think of the stack frame.\n\n## Check Registers\n\nThe\
    \ program example below illustrates CHECK_STACK.\n\n```\nif DEBUG\nSTACK_OFF \
    \     EQU     16\nelse\nSTACK_OFF      EQU     0\nendif\n```\n\n```\nCHECK_STACK\
    \      STRUCT\n    csFlags        dw\n    csBPret        dw\n    csDI        \
    \   dw\n    csSI           dw\n    csBP           dw\n```\n\n```\ncsSP    dw\n\
    csBX    dw\ncsDX    dw\ncsCX    dw\ncsAX    dw\nCHECK_STACK  ENDS\n```\n\n```\n\
    RegEntry  MACRO\nif DEBUG\n    pusha\nendif\nendm\n```\n\n```\nRegCheck  MACRO\
    \  r\nif DEBUG\n    pushf\n    push bp\n    mov    bp, sp\n    irp    reg, <r>\n\
    ifidni  <reg>, <sp>\n    cmp    sp, [bp + csBP]\n    TrapNe\nelse\n```\n\n```\n\
    ; bp is special - you have to use the value on the stack\nifidni  <reg>, <ax>\n\
    \    push    ax\n    mov     ax, [bp + csBPRet]\n    cmp     ax, [bp + csBP]\n\
    \    pop     ax\n    TrapNe\nelse\n```\n\n```\n; Do the rest of the registers\n\
    ; including al, ah, ..., dh\nendif\nendm\n```\n\n```\npop     bp\npopf\nadd  \
    \   sp, 16\nendif\nendm\n```\n\n## 123 No Bugs\n\n```\nfunc    proc near\n   \
    \            RegEntry\n\n               ; Get the passed in parameter\n      \
    \         mov     bp, sp\n               mov     ax, [bp + STACK_OFF + 2]\n  \
    \             ...\n               RegCheck <di,si,bp>\n               ret\n  \
    \             end\n```\n\n- Registers that have random values returned in them.\
    \ These are used by the function, and depending on the code executed and values\
    \ determined, hold various values on return. In most functions, CX and DX fall\
    \ into this category. \n\nThese registers can be dangerous because there is usually\
    \ a relationship between their final value and the return value of the function.\
    \ If DX is usually equal to AX, then if another function uses DX instead of AX,\
    \ you will intermittently see a bug.\n\nTo avoid this problem, trash the registers\
    \ that are used by the function and not restored. Do this with a very simple macro\
    \ that places a specific value into all the trashed registers. You can then set\
    \ this word to variously be 0, 7FFFh, and FFEh. If you run under all three values,\
    \ then the odds are pretty good that no other function is depending on the return\
    \ values of the functions.\n\n## TrashReg\n\nThe program example below illustrates\
    \ TrashReg.\n\n```\nTRASH_WORD      EQU     7F7Fh\n\nTrashReg        MACRO   r\n\
    if DEBUG         irp reg, <r>\n                if (type (reg)) EQ 1\n        \
    \                mov     reg, TRASH_WORD SHR 8\n```\n\n```\nelse\n    mov reg,\
    \ TRASH_WORD\n    endif\nendif endm\nendif\nfunc proc\n    ; function body\n \
    \   ...\n    TrashReg <cx,dx>\n    ret\nfunc endp\n```\n\n- Registers that will\
    \ change in a function but will always return with a specific value. For example,\
    \ if you have a function that fills a buffer with 0, then AX may always have a\
    \ value of 0 on return.\n\nThese registers should not be trashed. They have a\
    \ known, constant value on exit. It might even be useful to the calling function\
    \ to make use of this value. In this case, you need to assert that the register\
    \ is set to this constant value.\n\n## ConstReg\n\nThe program example below illustrates\
    \ ConstReg.\n\n```\nConstReg MACRO reg, val\n    pushf\n    cmp reg, val\n   \
    \ TRAPne\n    popf\nendm\n```\n\n## Creating local variables\n\nLocal variables\
    \ are often a source of errors in assembly language programs. When you add a variable\
    \ or change its size, you might introduce errors. One of the code paths might\
    \ not eliminate the new variable from the stack before returning. Another code\
    \ path might reference the old location of a variable — the location used before\
    \ the new variable shifted everything in the stack. Finally, you do not have the\
    \ capability, as you do in C, to initialize your local variables.\n\nWe solve\
    \ these problems by creating a struct that holds your local variables. Then, for\
    \ a function, substitute the size of the struct to create room for the local variables.\
    \ When you return, add the size of the struct. Adding or subtracting local variables\
    \ will cause no problems due to the size change.\n\nWe also set BP to the base\
    \ of the local variables. You can then use the struct to access all the local\
    \ variables. This has a few advantages.\n\n- If a local variable moves in the\
    \ structure, you are still accessing it at the right location. You do not need\
    \ to go through and change all [bp + 8] to [bp + 10], [bp + elem] will continue\
    \ to work.\n\n- If you remove a local variable, you will know at assembly time\
    \ whether you are still using it. Because the variable has been removed from the\
    \ struct, code that is still accessing the element will fail to compile because\
    \ the element has been removed.\n\n- This ensures type-checking to the size of\
    \ the variable. The assembler will complain if you try to move from a word-size\
    \ register or from a byte-size element in the struct.\n\nIn debug mode, you also\
    \ fill the local variables with a FILL_CHAR. At the same time you should catch\
    \ any of uninitialized local variables.\n\n## Local Variables\n\nThe program example\
    \ below illustrates the use of a struct for local variables.\n\n```\nCreateLocals\
    \  MACRO  size\n; Make the stack space\npush bp\nsub sp, size\nmov bp, sp\n```\n\
    \n```\n; Fill it in debug mode\nif DEBUG\npusha\npush ss\npop es\nmov di, bp\n\
    mov ax, FILL_WORD\nrep stosw\nendif\nendm\n```\n\n```\n; Using the macros\nLCL_FUNC\
    \  STRUCT\n    var1  dw\n    var2  db\n    _fill db ; To stay word aligned\nENDS\n\
    LCLCF   proc\n```\n\n```\nRegEntry<size LCL_FUNC> ; Save for RegCheck\nCreateLocals\
    \ <size LCL_FUNC> ; Create the local vars\n                             ; Body\
    \ of the function\n                             ...\nFreeLocals <size LCL_FUNC>\
    \ ; Free the local vars\nret\nendp\n```\n\n## Wrapping it all together\n\nWith\
    \ all the above tricks, it can get a little confusing. You need to handle checking\
    \ preserved registers and creating and freeing local variables both on entry and\
    \ exit of the function. On exit, you must trash first—lest you check a register\
    \ you are also trashing. You then do asserts before finally checking the preserved\
    \ registers.\n\n## Complete Function\n\nThe program example below illustrates\
    \ the use of all of the assembler specific tricks.\n\n```\nLCL_CF      STRUCT\n\
    \    cfVar       dw\n    cfVar2      dd\nENDS\nLCLCF       proc\nRegEntry    <size\
    \ LCL_CF> ; Save for RegCheck\nCreateLocals <size LCL_CF> ; Create the local vars\n\
    \                             ; Body of the function\n                       \
    \      ...\nFreeLocals <size LCL_CF> ; Free the local vars\nTrashReg    <bx,dx>\
    \      ; Set to TRASH_WORD\nConst_Reg   cx, 0        ; Should always return 0\n\
    AssertVar   <ax>         ; Should point to buf\nRegCheck    <di,si,bp,sp>  ; Be\
    \ sure preserved\nret              ; We're done\nCompleteFunc endp\n```\n"
  mdcn: "\n我们可以通过在入口处保留所有寄存器并在出口处检查它们来核对这些寄存器。以下宏使用 `pusha` 以保持代码示例简短。它们也没有检查段寄存器；在没有远端指针（far\
    \ pointers）的小模型程序中，不需要这种检查。\n\n入口（Entry）必须是每个函数的第一个调用。如果你访问栈上的变量，在确定参数的偏移量时，需要考虑\
    \ `pusha`。可以简单地将 `equate STACK_OFF` 添加到每个偏移量上。\n\n在 `RegCheck` 调用之后，唯一的调用应该是 `ret`。你可能想将\
    \ `ret` 包含在 `RegCheck` 中。但我倾向于单独使用。没有 `ret` 的函数看起来很奇怪。`RegCheck` 使用 `add sp, 16`\
    \ 是因为你无法恢复那些已经改变的寄存器。你与 `pushed` 的寄存器进行对比，但随后会将它们丢弃。\n\n这些宏不仅可以发现你是否没有保留某个寄存器——还能发现你是否正确清理了栈。如果你没有将\
    \ `SP` 恢复到之前的值，那么所有检查都不应该通过。先测试 `SP` 确保它失败，这样你就会考虑到栈帧（stack frame）。\n\n## 检查寄存器\n\
    \n下面的程序示例演示了 `CHECK_STACK`。\n\n```\nif DEBUG\nSTACK_OFF      EQU     16\nelse\n\
    STACK_OFF      EQU     0\nendif\n```\n\n```\nCHECK_STACK      STRUCT\n    csFlags\
    \        dw\n    csBPret        dw\n    csDI           dw\n    csSI          \
    \ dw\n    csBP           dw\n```\n\n```\ncsSP    dw\ncsBX    dw\ncsDX    dw\n\
    csCX    dw\ncsAX    dw\nCHECK_STACK  ENDS\n```\n\n```\nRegEntry  MACRO\nif DEBUG\n\
    \    pusha\nendif\nendm\n```\n\n```\nRegCheck  MACRO  r\nif DEBUG\n    pushf\n\
    \    push bp\n    mov    bp, sp\n    irp    reg, <r>\nifidni  <reg>, <sp>\n  \
    \  cmp    sp, [bp + csBP]\n    TrapNe\nelse\n```\n\n```\n; bp 是特殊的 - 你必须使用栈上的值\n\
    ifidni  <reg>, <ax>\n    push    ax\n    mov     ax, [bp + csBPRet]\n    cmp \
    \    ax, [bp + csBP]\n    pop     ax\n    TrapNe\nelse\n```\n\n```\n; 处理其余寄存器\n\
    ; 包括 al, ah, ..., dh\nendif\nendm\n```\n\n```\npop     bp\npopf\nadd     sp, 16\n\
    endif\nendm\n```\n\n## 123 无 Bug\n\n```\nfunc    proc near\n               RegEntry\n\
    \n               ; 获取传入的参数\n               mov     bp, sp\n               mov\
    \     ax, [bp + STACK_OFF + 2]\n               ...\n               RegCheck <di,si,bp>\n\
    \               ret\n               end\n```\n\n- 返回时带有随机值的寄存器。这些寄存器被函数使用，并根据执行的代码和确定的值，在返回时持有各种值。在大多数函数中，`CX`\
    \ 和 `DX` 属于这一类。\n\n这些寄存器可能是危险的，因为它们的最终值与函数的返回值之间通常存在关系。如果 `DX` 通常等于 `AX`，那么如果另一个函数使用\
    \ `DX` 代替 `AX`，你将间歇性看到 Bug。\n\n为了避免这个问题，丢弃那些函数使用且未恢复的寄存器。使用一个非常简单的宏来实现此，将特定值放入所有被丢弃的寄存器中。你可以将这个字（word）设置为\
    \ `0`、`7FFFh` 和 `FFEh`。如果你在所有三个值下运行，那么很有可能没有其他函数依赖这些函数的返回值。\n\n## 丢弃寄存器\n\n下面的程序示例演示了\
    \ `TrashReg`。\n\n```\nTRASH_WORD      EQU     7F7Fh\n\nTrashReg        MACRO \
    \  r\nif DEBUG         irp reg, <r>\n                if (type (reg)) EQ 1\n  \
    \                      mov     reg, TRASH_WORD SHR 8\n```\n\n```\nelse\n    mov\
    \ reg, TRASH_WORD\n    endif\nendif endm\nendif\nfunc proc\n    ; 函数体\n    ...\n\
    \    TrashReg <cx,dx>\n    ret\nfunc endp\n```\n\n- 在函数中会改变但在返回时总是带有特定值的寄存器。例如，如果你有一个函数用\
    \ 0 填充缓冲区，那么 `AX` 在返回时的值可能始终为 0。\n\n这些寄存器不应该被丢弃。它们在退出时有一个已知的常量值。对于调用函数来说，利用这个值可能仍然有用。在这种情况下，你需要断言该寄存器被设置为此常量值。\n\
    \n## 常量寄存器\n\n```\nConstReg MACRO reg, val\n    pushf\n    cmp reg, val\n    TRAPne\n\
    \    popf\nendm\n```\n\n## 创建局部变量\n\n局部变量通常是汇编语言程序中错误的源头。当你添加变量或更改其大小时，可能会引入错误。其中一条代码路径可能在返回之前没有从栈中消除新变量。另一个代码路径可能会引用变量的旧位置——即在新变量移动栈中所有内容之前使用的位置。最后，你没有像在\
    \ C 语言中那样初始化局部变量。\n\n我们通过创建一个持有局部变量的结构体来解决这些问题。然后，对于一个函数，替换结构体的大小以为局部变量留空间。返回时，加上结构体的大小。由于大小的变化，增加或减少局部变量不会产生问题。\n\
    \n我们还将 `BP` 设置为局部变量的基地址。你就可以可以使用结构体来访问所有局部变量。这有几个优势：\n\n- 如果局部变量在结构体中移动，你仍然在正确的位置访问它。你不需要遍历并更改所有的\
    \ `[bp + 8]` 为 `[bp + 10]`，`[bp + elem]` 将继续有效。\n\n- 如果你删除了一个局部变量，你将在汇编阶段知道是否仍然在使用它。因为变量已从结构体中删除，仍然访问该元素的代码将编译失败，因为该元素已被移除。\n\
    \n- 这确保了变量大小的类型检查。如果你尝试从字大小的寄存器或结构体中的字节大小元素移动，汇编器将报错。\n\n在调试模式下，你还用 `FILL_CHAR`\
    \ 填充局部变量。同时，你应该捕获任何未初始化的局部变量。\n\n## 局部变量\n\n下面的程序示例演示了使用结构体处理局部变量。\n\n```\nCreateLocals\
    \  MACRO  size\n; 创建栈空间\npush bp\nsub sp, size\nmov bp, sp\n```\n\n```\n; 在调试模式下填充\n\
    if DEBUG\npusha\npush ss\npop es\nmov di, bp\nmov ax, FILL_WORD\nrep stosw\nendif\n\
    endm\n```\n\n```\n; 使用宏\nLCL_FUNC  STRUCT\n    var1  dw\n    var2  db\n    _fill\
    \ db ; 为了保持对齐\nENDS\nLCLCF   proc\n```\n\n```\nRegEntry<size LCL_FUNC> ; 供 RegCheck\
    \ 使用\nCreateLocals <size LCL_FUNC> ; 创建局部变量\n                             ; 函数体\n\
    \                             ...\nFreeLocals <size LCL_FUNC> ; 释放局部变量\nret\n\
    endp\n```\n\n## 整合所有内容\n\n有了上述所有技巧，可能会变得有点混乱。你需要在函数的入口和出口处理保留寄存器的检查以及局部变量的创建和释放。在出口处，你必须先丢弃——否则你会检查一个你正要丢弃的寄存器。在最后检查保留寄存器之前，进行断言。\n\
    \n## 完整函数\n\n下面的程序示例演示了所有汇编器特定的技巧。\n\n```\nLCL_CF      STRUCT\n    cfVar     \
    \  dw\n    cfVar2      dd\nENDS\nLCLCF       proc\nRegEntry    <size LCL_CF> ;\
    \ 供 RegCheck 使用\nCreateLocals <size LCL_CF> ; 创建局部变量\n                       \
    \      ; 函数体\n                             ...\nFreeLocals <size LCL_CF> ; 释放局部变量\n\
    TrashReg    <bx,dx>      ; 设置为 TRASH_WORD\nConst_Reg   cx, 0        ; 应该始终返回 0\n\
    AssertVar   <ax>         ; 应该指向 buf\nRegCheck    <di,si,bp,sp>  ; 确保已保留\nret \
    \             ; 我们完成了\nCompleteFunc endp\n```\n"
