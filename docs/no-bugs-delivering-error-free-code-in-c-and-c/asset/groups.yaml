    returning. Another code path might reference the old location of a variable —
    the location used before the new variable shifted everything in the the stack.
    Finally, you do not have the capability, as you do in C, to initialize your local
    variables.


    We solve these problems by creating a struct that holds your local variables.
    Then, for a function, substitute the size of the struct to create room for the
    local variables. When you return, add the size of the struct. Adding or subtracting
    local variables will cause no problems due to the size change.


    We also set BP to the base of the local variables. You can then use the struct
    to access all the local variables. This has a few advantages.


    +   - If a local variable moves in the structure, you are still accessing it at
    the right location. You do not need to go through and change all [bp + 8] to [bp
    + 10], [bp + elem] will continue to work.


    +   - If you remove a local variable, you will know at assembly time whether you
    are still using it. Because the variable has been removed from the struct, code
    that is still accessing the element will fail to compile because the element has
    been removed.


    +   - This ensures type-checking to the size of the variable. The assembler will
    complain if you try to move from a word-size register or from a byte-size element
    in the struct.


    In debug mode, you also fill the local variables with a FILL_CHAR. At the same
    time you should catch any of uninitialized local variables. At the same time you
    should check whether you have enough stack. Because many assembly language programs
    set-up and their stack in their own way, checking for stack underrun is not shown
    here. However, you should add the stack checking code.


    # Local Variables


    The program example below illustrates the use of a struct for local variables.


