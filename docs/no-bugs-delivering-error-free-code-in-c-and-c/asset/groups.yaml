    \ 端口等），都用 ID 值填充缓冲区。然后，如果读取没有错误但实际上没有读取到任何内容，缓冲区将包含之前的内容，可能来自上一次成功的读取。\n\n如果读取是部分成功（即你读取了文件末尾），填充执行了第二个功能。如果你假设所有操作都是成功的，缓冲区将包含之前的内容，可能来自上一次成功的读取。\n\
