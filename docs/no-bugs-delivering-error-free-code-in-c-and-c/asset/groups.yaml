    \ (HANDLE_HDR));\n    phdl->uSize = uSize;\n    return (phdl);\nn\n```\n\nOnce\
    \ you have created a list, you need to add an element to the list each time you\
    \ get a handle. You allocate enough memory to hold a HANDLE_NEXT structure as\
    \ well as additional uSize bytes. Therefore, for each EMS/XMS allocation, you\
    \ will have a malloc.\n\nWe store the handle in HANDLE_NEXT so that you can find\
    \ a structure for a specific handle. The rest of the is stored in the additional\
    \ malloc'd memory directly following the HANDLE_NEXT structure. This additional\
    \ information is used when writing debug prints to identify the handle.\n\nFor\
    \ both EMS and XMS, you identify the handle by the module and number where it\
    \ was created. However, in the case of EMS, you can also give an allocation name\
    \ up to 8 bytes long. Because this name is a better identifier, we also track\
    \ the name for EMS.\n\n(A note on when to call malloc and when to call Alloc.\
    \ Your non-debug code should, however, generally call malloc for two reasons.\
    \ First, it is very easy to get into recursive loops when debug code calls debug\
    \ code. Second, the debug code should attempt to make a minimal impact on the\
    \ system—and every byte counts when it comes to malloc.)\n\n© Copyright 1992 by\
    \ David Thielen - All Rights Reserved"
  - "[PAGE 98]\n\n# HdlAdd\n\nThe program example below illustrates the use of adding\
    \ an element to the linked list.\n\n```\ntypedef struct S_HANDLE_XMS\n{\n    BYTE\
    \ *pFile;\n    int iLine;\n    unsigned uMaxKb;\n} HANDLE_XMS;\n\n// Add a newly\
    \ malloc handle to the linked list\nvoid HdlAdd(HANDLE_HDR *pHdlHdr, int iHdl,\
    \ void *pData)\n{\n    HANDLE_NEXT *pHdlNext;\n\n    // Allocate the memory for\
    \ a linked-list element\n    // If you can't get the memory, you simply don't\
    \ do it\n    if ((pHdlNext = malloc(sizeof(HANDLE_NEXT) + pHdlHdr->uSize)) ==\
    \ NULL)\n{\n        return;\n\n\n    // Add ourselves to the linked list - at\
    \ the front\n    pHdlNext->pNext = pHdlHdr->sHdlNext.pNext;\n    pHdlHdr->sHdlNext.pNext\
    \ = pHdlNext;\n    pHdlNext->iHdl = iHdl;\n\n    // If you store additional data,\
    \ save it\n    if (pHdlHdr->uSize)\n        memcpy(pHdlHdr + 1, pData, pHdlHdr->uSize);\n\
    }\n```\n\nWe can now verify the handle passed to all EMS and XMS functions. If\
    \ a bad handle is passed, a MessageBox will pop-up displaying the bug.\n\nBecause\
    \ EMS and XMS handles are global to the system instead of an application, a bad\
    \ handle can work - but you are using memory belonging to another application.\
    \ This can lead to intermittent & deadly bugs.\n\nWe can also check the function\
    \ parameters against the size of the malloc memory. This is useful for the copy\
    \ functions under both EMS and XMS. It can also be used for the mapping command\
    \ under EMS."
  - "[PAGE 99]\n\n# 90 No Bugs\n\nThe HdlFind provides the ability to find a linked\
    \ list element based on its handle value. This call gives us the functionality\
    \ we need both to verify a handle and to retrieve the size of a handle's memory\
    \ block.\n\n# HdlFind\n\nThe program example below illustrates HdlFind\n\n```\n\
    void *HdlFind (HANDLE_HDR *pHdlHdr, int iHdl)\n{\n    HANDLE_NEXT *pHdlOn, *pHdlPrev;\n\
    \n    pHdlPrev = &(pHdlHdr->sHdlNext);\n\n    while ((pHdlOn = pHdlPrev->pNext)\
    \ != NULL)\n    {\n        // If you find it - return the associated data\n  \
    \      if (pHdlOn->iHdl == iHdl)\n            return (pHdlOn + 1);\n\n       \
    \ pHdlPrev = pHdlOn;\n    }\n\n    return (NULL);\n}\n```\n\nTo verify a handle,\
    \ all you have to do is see whether HdlFind returns a non-null value. At the beginning\
    \ of each EMS and XMS function, you merely add the following code segment.\n\n\
    # HdlExist\n\nThe program example below illustrates the use of HdlFind to see\
    \ if a passed in handle is legit.\n\n```\n#if DEBUG\n    if (! HdlFind (pHdlHREms,\
    \ iHdl))\n        MessageBox(\"func, %d, ...\\nBad Handle\", iHdl);\n#endif\n\
    ```\n\nWhen you free a handle, you need to do the same in your linked list. You\
    \ do this with HdlDelete. It removes the element from the linked list and then\
    \ frees\n\n© Copyright 1992 by David Thielen - All Rights Reserved"
- md: "\nthe malloc'd memory. It has to walk the list because you have a singly linked\
    \ list, and you need the element prior to the one you are deleting to remove it\
    \ from the linked list.\n\n## HdlDelete\n\nThe program example below illustrates\
    \ HdlDelete.\n\n```\nvoid HdlDelete (HANDLE_HDR *pHdlHdr, int iHdl)\n{\n    HANDLE_NEXT\
    \ *pHdlOn, *pHdlPrev;\n\n    pHdlPrev = pHdlHdr->sHdlNext;\n\n    while ((pHdlOn\
    \ = pHdlPrev->pNext) != NULL)\n    {\n        // If found, remove it, free it,\
    \ and deallocate it\n        if (pHdlOn->iHdl == iHdl)\n        {\n          \
    \  pHdlPrev->pNext = pHdlOn->pNext;\n            free(pHdlOn);\n            return;\n\
    \        }\n    }\n\n    pHdlPrev = pHdlOn;\n}\n```\n\nFinally, you can determine\
    \ on exit whether you have freed all of your memory.\nIn the case of XMS memory,\
    \ you can also determine whether the unfreed XMS memory was left locked on exit\
    \ (a very bad situation). Because you will store the _FILE_ and _LINE_ from each\
    \ alloc in the linked list, you can display the location of the alloc on all errors.\n\
    \nBecause DOS does not clean up EMS and XMS allocations on exit, it is very important\
    \ that a program free up all malloced EMS and XMS memory on exit. If it doesn't\
    \ do this, every time the program is run, it will use up additional memory.\n\n\
    ## HdlNext\n\nThe program example below illustrates HdlNext.\n\n## 92 Bugs\n\n\
    ```\nvoid *HdlNext (HANDLE_HDR *pHdlHdr, void *pData)\n{\n  HANDLE_NEXT *pHdlOn;\n\
    \n  // If there are no elements, return NULL\n  if (! (pHdlOn = pHdlHdr->sHdlNext.pNext))\n\
    \    return (NULL);\n  // If you passed in NULL, it's find first\n  if ( pData)\n\
    \    return (pHdlOn + 1);\n\n  // Get the one you found last time\n  // Re-walk\
    \ because you DON'T trust to be passed a good value\n  while ((pHdlOn) != pData)\n\
    \    if ((pHdlOn = pHdlOn->pNext) == NULL)\n      return (NULL);\n\n  // You have\
    \ the last one. Get pNext - it may be NULL\n  if ((pHdlOn = pHdlOn->pNext) ==\
    \ NULL)\n    return (NULL);\n  return (pHdlOn + 1);\n}\n```\n\nWhen a program\
    \ exits, it can then call HdlNext to walk the list of malloc EMS and XMS memory\
    \ to see what has not been freed. Do not use this as a way to clean up in a final\
    \ release of a program; this list ALWAYS be empty when exiting. If not, find where\
    \ you be freeing memory and free it.\n\n## Expanded memory (EMS)\n\nOn-start,\
    \ most programs need to check to whether they have real EMS memory (including\
    \ 386 software emulators) or whether they have an 8086-based emulator cannot map\
    \ the same page of EMS memory to two locations in the page frame simultaneously.\
    \ A hardware or 386-based software emulator can.\n\nTo check this, allocate a\
    \ page, map it to two physical pages, set the memory in one page to a value, and\
    \ then check in the other page to see whether it matches. If it does, change it\
    \ and check again. If it still matches, you can use the memory.\n\n© Copyright\
    \ 1992 by David Thiel - All Rights Reserved\n\n## 93 Bugs\n\nIf you only access\
    \ EMS by using the copy function, then the above test is unnecessary. You need\
    \ to perform this test only if you might end up mapping the physical page to logical\
    \ pages simultaneously.\n\nThis check, along with checking the EMS version support\
    \ (and determining whether EMS memory even exists) should be part of your check\
    \ to see whether a system has EMS memory. All of this should occur in both debug\
    \ and non-debug modes.\n\nOn initialization, we allocate a 4-page EMS block. We\
    \ then fill these pages with FILL_CHAR to -1 (that is, map nothing), we map in\
    \ the appropriate page from our 4-page block. When a new page is mapped in, we\
    \ check our FILL_CHAR page.\n\nThis performs two services. First, if you read\
    \ from a page after unmapping, you will get garbage data. Second, if you map a\
    \ page to page after unmapping it, you will see the change when you test on the\
    \ next map call. You also should testtest each FILL_CHAR page mapped in our TestAll\
    \ function.\n\nWhen allocating EMS memory, we need to add the EMS handle to your\
    \ linked list for EMS. In debug mode, you should also include the file and line\
    \ that function was called from.\n\nWe also initialize the malloced memory to\
    \ FILL_CHAR. EMS memory is generally recycled—even more than heap memory—so that\
    \ reused memory is almost always holding the same values the previous user of\
    \ the memory assigned.\n\nYou must save and restore the page state before after\
    \ fill. Otherwise, a call to allocate EMS memory in debug mode will cause the\
    \ page map to change. This would introduce a bug—and our job is to eliminate it.\n\
    \nYou can also name the EMS memory. If you do so, copy the name into HANDLE_EMS.\
    \ This is not required, but naming the memory makes it easier to identify. Naming\
    \ is a good idea in general because programs such as mem will display the name.\n\
    \nOn all the EMS memory, you passed in, first to see whether a handle handle.\n\
    \n## 94 No Bugs\n\n### HdlCheck\n\nThe program example below illustrates the use\
    \ of HdlCheck.\n\n```\n#if DEBUG\n// See whether it's our handle\nif ((pHdlOn\
    \ = HdlNext(pHdlHdr, iHdl)) == NULL)\n    DebugMessageBox(\"HdlNext\", ...);\n\
    #endif\n```\n\nIf, after calling HdlNext, you need to check for the EMS memory,\
    \ you passed in, first to see whether a handle handle.\n\nOn all the EMS memory,\
    \ you passed in, first to see whether a handle handle.\n\nOn all the EMS memory,\
    \ you passed in, first to see whether a handle handle.\n\nOn all the EMS memory,\
    \ you passed in, first to see whether a handle handle.\n\nOn all the EMS memory,\
    \ you passed in, first to see whether a handle handle.\n\nto of the EMS memory.\n\
    \nOn all the EMS memory, you passed in, first to see whether a handle handle.\n\
    \n## 95 Bugs\n\n- 1. Ensure that you are pointing to a page.\n- 2. Ensure that\
    \ the logical page you expect is in fact mapped to that page.\n- 3. Ensure that\
    \ the pointer is pointing to the page you expect to.\n\n## AssertmsPtr\n\nThe\
    \ program example below illustrates AssertmsPtr.\n\n```\nAssertmsPtr (void *pBuf,\
    \ int Hdl, int iPh, int iNum)\n{\n  int iPage;\n\n// See whether it's our handle\n\
    if ((phdlEms = HdlFind(pHdlHdr, Hdl)) == NULL)\n{\n  DebugMessageBox(\"AssertmsPtr\
    \ (%p, %d, %d, %d)\\nBad Handle\",\npBuf, Hdl, iPhy, iNum);\n  return;\n}\n\n\
    // Do you have this handle mapped?\nfor (iPage=0; iPage<iNum; iPage++)\n  if ((aPageMap[iPage+iPh][0]\
    \ != Hdl) ||\n  (aPageMap[iPage+iPh][0] != iLog+iPh))\n    DebugMessageBox(\"\
    AssertmsPtr (%p, %d, %d, %d)\\nMalloced File: %s, Line: %d, Name: %s\\nHandle\
    \ %d, Logical page %d mapped to physical page %d\",\npBuf, Hdl, iPhy, iNum,\n\
    phdlEms->pFile, phdlEms->iLine, phdlEms->sName,\naPageMap[iPage+iPh][0], aPageMap[iPage+iPh][1],\n\
    iPage+iPhy);\n\n// Is the pointer within the pages?\nif ((pBuf < pBase+(iPh+iNum)*0x4000))\n\
    \  DebugMessageBox(\"AssertmsPtr (%p, %d, %d, %d)\\nMalloced File: %s, Line: %d,\
    \ Name: %s\\nPointer out of range\",\npBuf, Hdl, iPhy, iNum,\nphdlEms->pFile,\
    \ phdlEms->iLine, phdlEms->sName);\n}\n```\n"
  mdcn: "\nmalloc 分配内存。你必须遍历列表，因为你使用的是单向链表，而你需要获取要删除元素的前一个元素才能将其从链表中移除。\n\n## HdlDelete\n\
    \n下面的程序示例说明了 HdlDelete。\n\n```\nvoid HdlDelete (HANDLE_HDR *pHdlHdr, int iHdl)\n\
    {\n    HANDLE_NEXT *pHdlOn, *pHdlPrev;\n\n    pHdlPrev = pHdlHdr->sHdlNext;\n\n\
    \    while ((pHdlOn = pHdlPrev->pNext) != NULL)\n    {\n        // 如果找到，移除它，释放它并取消分配内存\n\
    \        if (pHdlOn->iHdl == iHdl)\n        {\n            pHdlPrev->pNext = pHdlOn->pNext;\n\
    \            free(pHdlOn);\n            return;\n        }\n    }\n\n    pHdlPrev\
    \ = pHdlOn;\n}\n```\n\n最后，你可以在退出时确定是否已经释放了所有内存。\n对于 XMS 内存，你还可以确定在退出时未释放的 XMS\
    \ 内存是否仍处于锁定状态（一种非常糟糕的情况）。因为你会在链表中存储来自每次分配的 _FILE_ 和 _LINE_，所以你可以在可以在所有错误发生时显示分配的位置。\n\
    \n由于 DOS 不会在退出时清理 EMS 和 XMS 分配，因此程序在退出时释放所有 malloc 分配的 EMS 和 XMS 内存是非常重要的。如果不这样做，每次运行程序时，都会消耗额外的内存。\n\
    \n## HdlNext\n\n下面的程序示例说明了 HdlNext。\n\n## 92 Bugs\n\n```\nvoid *HdlNext (HANDLE_HDR\
    \ *pHdlHdr, void *pData)\n{\n  HANDLE_NEXT *pHdlOn;\n\n  // 如果没有元素，返回 NULL\n \
    \ if (! (pHdlOn = pHdlHdr->sHdlNext.pNext))\n    return (NULL);\n  // 如果传入了 NULL，则查找第一个\n\
    \  if ( pData)\n    return (pHdlOn + 1);\n\n  // 获取你上一次找到的那个\n  // 重新遍历，因为你不信任传入的值是有效的\n\
    \  while ((pHdlOn) != pData)\n    if ((pHdlOn = pHdlOn->pNext) == NULL)\n    \
    \  return (NULL);\n\n  // 你已经有了最后一个。获取 pNext - 它可能可能是 NULL\n  if ((pHdlOn = pHdlOn->pNext)\
    \ == NULL)\n    return (NULL);\n  return (pHdlOn + 1);\n}\n```\n\n当程序退出时，它可以调用\
    \ HdlNext 来遍历 malloc 分配的 EMS 和 XMS 内存列表，查看哪些尚未被释放。不要将此用作程序最后释放时的清理方法；在退出时此列表*总是*空的。如果不是，请找到你释放内存的地方并释放它。\n\
    \n## 扩展内存 (EMS)\n\n在启动时，大多数程序需要检查它们是否拥有真实的 EMS 内存（包括 386 软件模拟器），或者是否是基于 8086 的模拟器（后者无法将同一页\
    \ EMS 内存同时映射到两个位置）。硬件或基于 386 的软件模拟器可以做到。\n\n要检查这一点，分配一个页面，将其映射到两个物理页，将一个页面中的内存设置为一个值，然后在另一个页面中检查是否匹配。如果匹配，则更改它并再次检查。如果仍然匹配，你就可以使用该内存。\n\
    \n© Copyright 1992 by David Thiel - All Rights Reserved\n\n## 93 Bugs\n\n如果你仅通过使用拷贝函数来访问\
    \ EMS，那么上面的测试是不必要的。只有当你可能最终将物理页同时映射到逻辑页时，才需要进行此测试。\n\n此检查以及对 EMS 版本支持的检查（以及确定\
    \ EMS 内存是否存在）应该是你检查系统是否具有 EMS 内存的一部分。所有这些应该在调试模式和非调试模式下发生。\n\n在初始化时，我们分配一个 4 页\
    \ EMS 块。然后我们用 FILL_CHAR 填充这些页面为 -1（即不映射任何内容），然后我们从我们的 4 页块中映射适当的页面。当映射入一个新页面时，我们检查我们的\
    \ FILL_CHAR 页面。\n\n这提供了两种服务。首先，如果你在取消映射后从页面中读取，你将得到垃圾数据。其次，如果你在取消映射后将页面映射到页面，你将在下次映射调用时看到变化。你还应该在\
    \ TestAll 函数中测试映射的每个 FILL_CHAR 页面。\n\n在分配 EMS 内存时，我们需要将 EMS 句柄添加到你的 EMS 链表中。在调试模式下，你还包含调用该函数的文件和行号。\n\
    \n我们还将 malloc 分配的内存初始化为 FILL_CHAR。EMS 内存通常是回收的——比堆内存更频繁——因此重用的内存几乎总是持有上一个内存用户分配的值。\n\
    \n你必须在填充前后保存并恢复页面状态。否则，在调试模式下调用分配 EMS 内存会导致页面映射发生。这将引入 bug——而我们的工作就是消除它。\n\n你也可以为\
    \ EMS 内存命名。如果你这样做，将名称拷贝到 HANDLE_EMS 中。这不是必须的，但命名内存使其更容易识别。通常情况下命名是一个好主意，因为像 mem\
    \ 等程序会显示名称。\n\n对于所有传入的 EMS 内存，首先查看是否为句柄处理。\n\n## 94 No Bugs\n\n### HdlCheck\n\n\
    下面的程序示例说明了 HdlCheck 的用法。\n\n```\n#if DEBUG\n// 检查是否是我们的句柄\nif ((pHdlOn = HdlNext(pHdlHdr,\
    \ iHdl)) == NULL)\n    DebugMessageBox(\"HdlNext\", ...);\n#endif\n```\n\n在调用\
    \ HdlNext 后，如果你需要检查传入的 EMS 内存，首先查看是否为句柄处理。\n\n对于所有传入的 EMS 内存，首先查看是否为句柄处理。\n\n\
    对于所有传入的 EMS 内存，首先查看是否为句柄处理。\n\n对于所有传入的 EMS 内存，首先查看是否为句柄处理。\n\n对于所有传入的 EMS 内存，首先查看是否为句柄处理。\n\
    \nEMS 内存的。\n\n对于所有传入的 EMS 内存，首先查看是否为句柄处理。\n\n## 95 Bugs\n\n- 1. 确保你正指向一个页面。\n\
    - 2. 确保你预期的逻辑页确实映射到该页面。\n- 3. 确保指针指向你预期的页面。\n\n## AssertmsPtr\n\n下面的程序示例说明了 AssertmsPtr。\n\
    \n```\nAssertmsPtr (void *pBuf, int Hdl, int iPh, int iNum)\n{\n  int iPage;\n\
    \n// 检查是否是我们的句柄\nif ((phdlEms = HdlFind(pHdlHdr, Hdl)) == NULL)\n{\n  DebugMessageBox(\"\
    AssertmsPtr (%p, %d, %d, %d)\\n错误的句柄\",\npBuf, Hdl, iPh, iNum);\n  return;\n}\n\
    \n// 你映射了这个句柄吗？\nfor (iPage=0; iPage<iNum; iPage++)\n  if ((aPageMap[iPage+iPh][0]\
    \ != Hdl) ||\n  (aPageMap[iPage+iPh][0] != iLog+iPh))\n    DebugMessageBox(\"\
    AssertmsPtr (%p, %d, %d, %d)\\n分配的文件: %s, 行: %d, 名称: %s\\n句柄 %d, 逻辑页 %d 映射到物理页\
    \ %d\",\npBuf, Hdl, iPh, iNum,\nphdlEms->pFile, phdlEms->iLine, phdlEms->sName,\n\
    aPageMap[iPage+iPh][0], aPageMap[iPage+iPh][1],\niPage+iPhy);\n\n// 指针在页面范围内吗？\n\
    if ((pBuf < pBase+(iPh+iNum)*0x4000))\n  DebugMessageBox(\"AssertmsPtr (%p, %d,\
    \ %d, %d)\\n分配的文件: %s, 行: %d, 名称: %s\\n指针超出范围\",\npBuf, Hdl, iPh, iNum,\nphdlEms->pFile,\
    \ phdlEms->iLine, phdlEms->sName);\n}\n```\n"
