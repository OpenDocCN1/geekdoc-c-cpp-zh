    was called from.


    We also initialize the malloced memory to FILL_CHAR. EMS memory is generally recycled—even
    more than heap memory—so that reused memory is almost always holding the same
    values the previous user of the memory assigned.


    You must save and restore the page state before after fill. Otherwise, a call
    to allocate EMS memory in debug mode will cause the page map to change. This would
    introduce a bug—and our job is to eliminate it.


    You can also name the EMS memory. If you do so, copy the name into HANDLE_EMS.
    This is not required, but naming the memory makes it easier to identify. Naming
