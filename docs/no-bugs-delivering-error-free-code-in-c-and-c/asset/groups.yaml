    ## Assert to the rescue


    To solve this, we make massive use of the assert capability. An assert function
    checks a Boolean expression, and, if it is true, calls the warning message function.
    For example, you may place assert(strlen(pStr) < 16); just before you copy a string
    into a 16-byte static buffer. If a string is ever longer than 15 bytes, the assert
    macro will print a message listing the file and the line in the source code that
    caused the error.


    ## Assert macro


    The program example below illustrates the use of a standard assert.


    ```

    #ifdef DEBUG

    #define assert(b) ( b ? printf("##b in File: %s, Line: %d\n", __FILE__, __LINE__)
    : )

    #else

    #define assert(b)

    #endif

    ```


    In most cases, the code in an assertion is quite fast, so load your code with
    assertions everywhere. You won''t see much of a hit in speed. But when assertion
    fails, you are pointed right at the failure, by module and line number.


    We break assertions into 2 parts; the code to check a data structure and the common
    code to all assertions. We will discuss the common code first. C has had an assertion
