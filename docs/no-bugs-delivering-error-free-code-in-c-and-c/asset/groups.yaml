    时的源代码文件名和行号。凭借此功能，MemCheck 会告诉你你是否越界访问或覆盖了已分配的内存。它还可以在退出时为你列出任何未释放的内存——防止你忘记释放内存。


    其次，MemCheck 包含了它自带的所有基本字符串和内存调用的库。你只需调用 MemCheck 的 `strlen` 和 `memcpy`，而不是你编译器运行时库中的版本。


    每当这些函数之一接收到指针时，它都会确定该指针是否在堆中。如果是，MemCheck 将会检查该指针指向的内存是否足够函数使用。如果你动态分配了一个 26 字节的指针，然后尝试向其
    `strcpy` 27 字节，MemCheck 将发现该错误。


    遗憾的是，MemCheck 只对动态 `malloc` 生成的指针有效。有一个 `mc_register`，你可以用它来列出全局和局部变量的基地址和范围（你也可以取消注册，这对于局部变量至关重要）。然而，这需要为每个变量调用一次函数。很遗憾，MemCheck
    无法读取 `.EXE` 文件中的代码信息——它会列出所有变量以及它们的基地址和范围。


    MemCheck 包含了检查写入 `NULL` 的功能。它还可以随时检查整个堆。这两项都是 `TestAll` 的良好补充。


    它还允许你提供一个函数来替换 `printf`，MemCheck 使用它来显示错误。如果你的程序使用了窗口系统，你可以让错误消息在消息框中弹出，或者写入调试监视器中。


    MemCheck 让你用极小的时间或精力获得大量的检查。如果你还没有用于进行参数验证的代码，请使用 MemCheck。它只检查动态 `malloc` 的指针，但这比检查非指针要好得多。


    这是一个良好的无 Bug 工具的精髓：在它发现 Bug 之前，你基本上可以忘记它的存在。


