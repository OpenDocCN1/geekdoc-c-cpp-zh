    # 第12 章


    # 测试过程


    你已经写好了程序，而且它可以运行良好。那么接下来要做什么？发布它！开个玩笑——那是老办法了。本章以及接下来的章节描述了创建程序的后半部分——测试过程。这些章节与编码过程本身对于交付一个良好的产品同样重要。


    这些章节将阐述你的测试过程应该如何运作。如果没有这些实践，你将得到一个可能看起来不错，但由于其中仍存在大量 MFU（低级错误）而无法使用的程序。那么，流程是什么呢？


    它非常简单：你现在必须找到并移除你在代码中放入的所有 MFU。无论你自己在尝试编写无 bug 代码时做得有多出色，你总会有 bug。你的整个测试过程取决于你是否遵循这一哲学。如果你不把测试视为寻找你自己在代码中引入的
    MFU 的过程，你就无法发现它们。


    ## 开发人员与测试人员


    大多数开发者在写完代码后，都希望不要发现 bug。毕竟，他们的乐趣在于编写新代码。追踪和纠正 bug，以及向系统中引入新的 bug，通常是一个非常痛苦的过程。当
    bug 被发现时，开发者通常会对被提醒这些问题感到恼火。然而，如果开发者以这种态度对待 bug，你可能会发布一个健壮的产品。


    但是，如果测试人员采取这种态度，你就能保证发布一个充满 bug 的产品。测试人员必须采取这样的方法：如果他们没有找到 bug，他们就失败了。他们应该由于过了糟糕的一天而沮丧地回家。如果他们发现一个接一个
    bug，他们应该高兴地回家，兜里还揣着奖金。


    重复一遍：测试小组的工作不是证明产品是 bug 的。测试小组的工作是尝试找到产品中所有的 MFU。每天，测试人员都应该努力寻找新方法来破坏他们正在测试的产品。一个优秀的测试人员是极的愤世嫉俗——无论开发者做什么，测试人员都会找到让它崩溃的方法。


    测试人员还要验证产品是否如广告所言。当营销人员忙于根据新功能推销即将上市的产品时，测试人员必须检查每个功能是否都在产品中，以及它们是否符合预期。


    ## 瑕疵并存


    bug 确实存在。测试人员的目标应该是识别出每一个。他们的工作是为我们提供程序当前状态的完整画面。


    你可能决定不修复某些 bug，但在发布之前，你必须**知晓**每一个存在的 bug。如果你不知道代码中有什么 bug，那么在发布后几乎肯定会出现很多糟糕的
    bug，并导致“每周修复光盘”综合征——你每周都要发布一个光盘来修复用户发现的某个 bug。这通常会形成恶性循环。当你发布所有原始 bug 的修复程序时，你会开始收到由于修复而引入新
    bug 的报告。


    ## 建立流程


    幸运的是，建立一个寻找程序 bug 的流程相对简单。这只需要时间和金钱。接受测试是软件开发成本这一事实，并对该过程投入。


    这并不意味着你必须投入无限的时间和资金。就像编写无 bug 软件是不可能的，找到每一个 bug 也是可能的。（要清楚测试人员和开发者一样都会犯错。）但然而，你需要为测试过程分配足够的资源，以确保你有很大机会发现所有重大
    bug。


    在项目末尾增加测试人员的效果与在项目末尾增加额外的开发人员大相相同——也就是说，这通常是适得其反的。这和“9 个女性无法在 1 个月内生孩子”的原因相同。测试软件所需的技能与编写软件一样多。它需要特定的培训和知识。而且最重要的是，它需要整个开发过程的时间。


