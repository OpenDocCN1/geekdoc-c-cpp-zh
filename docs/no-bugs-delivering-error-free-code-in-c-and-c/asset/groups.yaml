    ## Windows 调试版本


    Windows 软件工具包（SDK）包含一个 Windows 调试版本。在 Windows 3.0 中，这区别很大，因为调试版本会执行参数检查，而零售版不会。


    调试版本仍然执行零售版未进行的额外检查。Windows 应用应该在 Windows 调试版本上运行，甚至不会产生警告。在测试 Windows 应用时，请使用
    Windows 调试版本以及连接到你串口的串口终端（调试内核将写入该终端）。


    调试版本还有几个可以开启的标志，以执行额外的检查。第一个标志是 `ilovebear`（这个名字背后有一个有趣的故事），它会在返回存放在其中的值之前将传递的字符串填充到极限限制。这保证了所有传入的缓冲区都足够长。


    调试版本还有 `ValidateSpaces` 调用，它结合 `EnableFreeChecking` 和 `EnableHeapChecking` 标志会对堆进行额外的检查。此调用在
    Windows 中会增加约 20% 的开销。然而，它会写入空闲内存。


    `ValidateCodeSegments` 调用仅在实模式下有用。如果你的程序将在实模式下运行，那么你应该不时使用此测试。但是，如果你的程序只在保护模式下运行，那么没有理由使用此调用。


    Windows 提供了 Stress Applicator（压力测试器）和 Heap Walker（堆遍历器），它们可以用于消耗资源。Stress Applicator
    可以耗尽堆，留下固定数量的空闲内存。它可以对全局堆、程序本地堆以及 GDI 堆（通常被称为系统资源）执行。它还可以使用磁盘空间和文件句柄，再次留下有限或没有资源。


    Heap Walker 也可以使用全局堆以及可丢弃段。Stress Applicator 和 Heap Walker 均允许你在资源完全耗尽的情况下测试你的应用程序。


