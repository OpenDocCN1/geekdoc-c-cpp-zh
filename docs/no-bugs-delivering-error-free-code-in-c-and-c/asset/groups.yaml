    ## Multiscope


    Multiscope is a debugger for DOS, Windows, and OS/2 (whatever that is). In Windows,
    it runs as a Windows application, which gives you an awesome interface. Although
    not as good on low-level debugging, for source-level debugging an application
    it shines.


    Multiscope is hard to describe in a couple of paragraphs. It is simply the best
    debugger on the market. It provides a multitude of interfaces, the best way to
    use it is with its Windows interface.


    Under Windows you can debug both DOS (in a box) and Windows programs. You can
    debug programs running on the same machine or on a different system over a serial
    line. You can use dual monitors, but if your second monitor is a character-based
    interface instead of Windows, part of Multiscope''s appeal is that it is Windows
    based. Providing the same windowed data via Windows instead of using a character-based
    display makes it a better interface than any other debugger. Also, Windows allows
    better sizing and layout than you will get on 80x25 monochrome display adapter
    (MDA).


    Also, the interface is generally easier to use than a character-based one. All
    the reasons prefer Windows-based applications hold for debugger. In addition,
    Windows makes it very easy to do things such as modify memory—you click and type.


    Multiscope is light-years ahead of all debuggers for one of its features: its
    graphic data display. It gives you the normal capabilities to view your data plus,
    when you click on a structure or pointer, it displays the contents of the structure.
    Even better than that, it has a Graphic Data window.


    The Graphic Data feature will draw pictures of your data. Each structure is drawn
    as a row of boxes. The structure values will be in each box. Each pointer in the
    structure will be identified by name and will have an arrow pointing to its pointe.
    Sometimes a picture is worth 1000 words, and Multiscope proves that.


    Unfortunately, Multiscope is designed as an application debugger. For debugging
    systems-level programs, you need Soft-Ice or Periscope. But if you are writing
    applications, this is the debugger to use.


