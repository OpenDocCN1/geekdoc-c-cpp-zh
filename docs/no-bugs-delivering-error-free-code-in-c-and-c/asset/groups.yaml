  mdcn: '

    这是编写 DOS 程序的一种方法。其主要的缺点是当调试器出现时，它会覆盖第二个屏幕上的信息。


    随附的代码允许在编译时定义任意数量的窗口。MDA（单色显示适配器）代码都在 `mda.c` 中（位于附录 B），因此为调试 `printf` 输出到串口终端或其他显示器编写驱动程序会非常容易。


    除了写入多个窗口外，还有许多其他函数可用。每当向 MDA 写入时，按下 `SCROLL LOCK`（在 Windows 环境下为 `NUM LOCK`）将导致
    `printf` 暂停。此时，使用各种组合键，你可以停止某些调试函数。


    通过按下右 `SHIFT` 键，你还可以在按键时将 MDA 打印到打印机，显示器的内容会被导出 LPT1（使用完整的 IBM 字符集或仅 ASCII）。


    调用 `DebugPause` 将暂停，直到你开启并关闭 `SCROLL LOCK`（Windows 环境下为 `NUM LOCK`）。这为你提供了一种让程序停在某一点的简单方法。`DebugMessageBox`
    在打印到窗口 3 时会使用此调用。


    我将 MDA 分为五个窗口（0 到 4）。在 Windows 环境下，我使用窗口 4 显示发送到我的应用程序的消息。窗口 3 用于错误消息（我更倾向于使用
    `MessageBox`）。窗口 2 由于其尺寸较小，显示程序的各种状态。窗口 1 列出信息，我尽量减少这部分内容，这样相关信息就不会因为随后的 `printf`
    而滚动出屏幕，即使它仍然很重要。窗口 0 用于我所有的调试 `printf`。


    当设置得当时（包括在代码的适当位置放置 `DebugPrintf`），这种安排变得极其宝贵，令人惊讶。当你发现某些问题时，通常可以通过查看 MDA 的内容来确定问题所在。


    更重要的是，在运行程序时观察 MDA 的内容可以提醒你注意那些原本可能错过的错误。本质上，MDA 允许你实时看到程序的内部运行情况。


    ## 62 无 Bug


    ```

    > CreateWindow <Hb17.Spread Win - 14 x 6,[160,35,229,0](E:Qtext:<07?>-09)218(35,160,183,139)-->

    > > WinCreate <List - with hdr & ftr - 20 items,(07?>-09)2210(13956,Paint: 13956,3190,0](35,147,202,96)-->

    > BeforeHbWinPos <240,315,490>(315,240,175,120)

    > AfterHbWinPos <240,315,498>(315,240,183,99)

    > > HbWin:Activate: OFF (Old: 4)

    > CreateWindow <Hb2List - with hdr & ftr - 20 items,(240,315,379,183),...>

    ```


    ## 条件打印


    一旦你向程序中添加了资源、`DebugPrint` 以及上述其他功能，请将它们移除。你永远不知道何时会再次需要它们——而且，移除它们是一项额外工作。相反，请使用一种方法来开启和关闭调试代码。


    你可以通过两种方式实现这一点：使用 `#if` 来决定是否编译某些调试代码，或者使用调试变量在运行时决定是否执行某些调试代码。


    通常，如果你在每次需要切换调试开关时都要重新编译，并且对于想要执行的哪些调试代码有一套非常简单的规则，请使用 `#if`。如果情况更复杂，请使用变量。两种方法都列在下方。


    ## 条件定义


    通常，在我使用条件定义的代码中，`DEBUG` 和 `VERBOSE` 设置了我想要执行的错误检查数量，而 `VERBOSE` 设置了我想发送到 MDA 的信息量。


    错误检查需要时间。在许多情况下，检查只需查看指针是否为 `NULL` 或结构体 ID 是否正确。这些检查都不占用多少时间或空间。


    另一方面，对缓存中的所有缓冲区进行 CRC 是非常昂贵的——特别是如果检查被频繁调用。因此，随着 `DEBUG` 值的增大，程序会变慢。我建议使用以下值：


    ```

    DEBUG == 0    无调试

    DEBUG == 1    测试版保留

    DEBUG == 2    快速检查

    DEBUG == 3    中等检查

    DEBUG == 4    慢检查

    DEBUG == 5    极慢检查

    ```


    对于你的第一个版本，将使用 `-DEBUG=1` 进行编译。作为性能略微下降的代价，断言、参数检查等将由测试人员检查。


    这并不意味着对大多数代码都使用这些值。在大多数调试代码中，检查是非常快的，所以如果 `DEBUG > 0` 就执行检查。如果你使用这种方法，请确保当 `DEBUG
    == 0` 时没有任何调试代码会被编译。


    测试之外的问题是你想发送到 MDA 的信息量。如果某个模块出现问题，你不希望看到该模块的调试打印。


    ## 使用变量


    另一种方案是使用变量。这种方法带给你一些优势：


    - 你可以在运行时更改变量。

    - 你可以在无需重新编译的情况下开启或关闭各种检查。

    - 你可以在程序运行时开启或关闭调试类型。我见过的最好的方法简单而强大。从两个变量开始：`BugType` 和 `BugLev`。`BugType` 是定义程序部分的字节。`BugLev`
    是位图数组。对于每个 `BugType` 值，都有一个独立的 `BugLev` 位图决定开启哪些内容。要确定是否执行调试检查，你使用函数的 `BugType`
    值，对 `BugLev` 进行索引，并检查代表应执行检查的位。


    ## bug.h


    ```

    extern byte BugLev[MAX_BUG_TYP];

    #define BUG_LEV_FATAL 0x01

    #define BUG_LEV_ERROR 0x02

    #define BUG_LEV_INIT 0x04

    #define BUG_LEV_UNUSUAL 0x08

    #define BUG_LEV_BASIC 0x10

    #define BUG_LEV_MODERATE 0x20

    #define BUG_LEV_VERBOSE 0x40

    #define BUG_LEV_MISC 0x80

    #define IfDebug(BugType, Lev) (BugLev[BugType] & Lev)

    ```


    ## verbose.h


    ```

    #if VERBOSE > 0

    #define v1Printf

    #endif

    #if VERBOSE > 1

    #define v2Printf

    #endif

    #if VERBOSE > 2

    #define v3Printf

    #endif

    #if VERBOSE > 3

    #define v4Printf

    #endif

    #if VERBOSE > 4

    #define v5Printf

    #endif

    ```

