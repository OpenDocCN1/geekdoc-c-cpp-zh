    easy to find the remaining bugs. In most cases, it eliminates certain classes
    of bugs.


    # Finding those MFUs


    Given the level of complexity in today''s programs, especially those written for
    message-passing architectures such as that of Windows or Macintosh''s operating
    system, it is impossible to test for all possible combinations of uses. Instead,
    you need to test each message in such a way that you feel confident it will work
    in combination with any other set of messages.


    Over the years, by using the tricks described in this book, I have drastically
    reduced the bugs that make it to the testing stage. I have also spent a lot less
    time debugging and a lot more time coding. I not only get more done—I also spend
    time wanting to kill myself because I can''t find a bug. More importantly, the
    code I generate is not shaky. A bug or two might still get through testing, but
    the bugs that do generally arise only if a very rare sequence of events occur.


    If you use these tricks, you will be able to generate more code with fewer bugs.
    It is critical, however, that you will implement these as you go; not after you
    are done. You might be surprised at how easy early debugging becomes. When you
    have a mistake, a pop-up window tells you what you did wrong. And you will rarely
    have to track down some subtle bug that takes days to discover.


    # Create a list


    The best start to fixing bugs is to prioritize jobs. Which is more important,
    adding a feature or fixing a bug? Suppose you''re aware of two faults with your
    word processing program: It lacks a print feature, and it has a bug that keeps
    it from finding words beginning with "z." You prioritize adding a print feature
    over fixing the find feature.


    Create a priority list. Call it "bug list," call it "to do list," call it anything
    you want, but maintain only one list for all jobs. If you have two lists, you
    have to decide which task to take care of if there time for only one of many.


    By keeping one list, the work remaining on your program will be a known quantity.
    You will know, in order of importance, which bugs to fix and what'
