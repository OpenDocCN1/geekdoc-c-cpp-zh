    ## 96 无 Bug


    其余部分都非常直观。在释放 EMS 句柄时，将其从 Hdl 链列表中删除。然后在在释放 EMS 内存之前，用 `FILL_CHAR` 填充它。当重新分配 hdl
    时，如果发生扩展，则用 `FILL_CHAR` 填充新页。当程序结束时，遍历链表以识别任何未释放的内存。


    注意：许多 EMS 驱动程序（主要是基于硬件的）都存在 Bug（它们的开发者一定没读过这本书）。更糟糕的是，这些 Bug 通常只在特定情况下出现（例如，复制
    16K 加 2 字节且恰好跨越三个页时）。虽然 `copy` 似乎是问题最多的函数，但它并不是唯一的。如果你正在追踪一个只在某个系统上发生的内存 Bug，那可能不是你的错。


    ## 扩展内存 (XMS)


    访问扩展内存的唯一方法是 XMS 规范中所描述的方法。现在没有理由用其他方式进行了，如果你使用如 `int15` 等方法，将会与其他程序发生冲突。使用其他方法是保证
    Bug 产生的极佳方法，在这种情况下，你会遇到程序和另一个程序使用同一个扩展内存的情况。


    在所有从 XMS 的拷贝操作中，验证传递给 `copy` 的字节数是否为偶数。这是 XMS 规范的要求。然而，在某些 XMS 处理程序上被强制，而在另一些上没有。传递奇数字节会导致某些系统上出现错误。


    如果你锁定了 XMS 内存，务必跟踪锁定情况。锁定会导致 XMS 内存碎片化，使其可用性大大降低。在释放 XMS 时，如果内存仍被锁定，你应该弹出一个框。如果在程序结束时未释放的内存仍锁定，你也应该将其列出来。


    ## 第 9 章


    ### 文件 I/O


    只写程序可能是存在的最具致命性的 MFU（内存功能单元）之一。只写程序可以将数据保存到文件中，但无法读回。这要么是写入方式有 Bug，要么是读回的代码有 Bug。然而，当用户意识到问题时，通常已经太晚了——数据已经丢失。（Sysos
    在这方面臭名昭著，你可以将数据备份到带上，但只需尝试恢复其中的。）


    此外，从通用 Bug 的角度来看，许多应用程序假设大多数操作都会成功。我知道许多编译器和链接器（为了保护这些过错者隐藏了名称），如果它们用于临时文件的内存磁盘满了，就会直接崩溃。


    本章涵盖了我们可以做哪些工作来尝试让我们的文件 I/O 无 Bug。有两种检查特别强大：文件的一致性检查和文件记录的断言检查。遗憾的是，这些是针对特定程序的检查，因此需要根据文件类型逐一编写。


    ### 一致性检查


    程序使用的大多数文件都不是 ASCIIis。它们是某种类型的数据文件。（当链接器创建一个 .EXE 文件时，那时的 EXE 文件就是一个数据文件。）任何数据文件必须遵守某些规则。


    有时规则非常简单。例如，WordStar 文本文件是相对自由的。但它的第八位在单词的首字母处应该经常被设置。


    在其他情况下，规则非常严格且复杂。在这种情况下，相对容易判断文件是否确实是你预期的数据类型。更重要的是，在这种情况下，你可以判断文件是完还是还是损坏。


    ## 98 Bug


    利用规则，你可以为文件编写一致性检查。该一致性检查在接收到文件句柄后检查文件。在每次 `open` 之后和每次 `close` 之前，调用此一致性检查。


    如果检查耗时过长，使用 `#if DEBUG > 4`，使其仅在测试人员愿意用速度换取极端调试检查时使用。此外，如果可能，为每种数据类型设置独立的 `open`
    和 `close` 函数。这使得包含检查更容易。


    此检查应该尽可能详尽。如果你的程序输入了一个坏数据文件，你不想浪费时间去追踪代码中不存在的 Bug（毕竟，你有真正的 Bug 要找）。当你创建一个文件时，如果它写入了坏数据，在很多情况下，数据将永远丢失。


    ## 断言


    许多具有严格规则的文件类型都是一次写入一个块的。（此处原文为大量重复句子，已按原意处理：每个块都是一次写入一个块的。）


