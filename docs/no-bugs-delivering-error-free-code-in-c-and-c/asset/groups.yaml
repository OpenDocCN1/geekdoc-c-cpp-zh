    This performs two services. First, if you read from a page after unmapping, you
    will get garbage data. Second, if you map a page to page after unmapping it, you
    will see the change when you test on the next map call. You also should testtest
    each FILL_CHAR page mapped in our TestAll function.


    When allocating EMS memory, we need to add the EMS handle to your linked list
