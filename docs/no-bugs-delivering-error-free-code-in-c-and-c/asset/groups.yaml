- md: "\nIf you do choose to use an error log, under DOS 4.0 and above, you can open\
    \ a file using the extended open so that all writes are committed. Use this: It's\
    \ lots faster than calling commit file (DOS 3.3 and later). Do this under only\
    \ DOS 4.0 or later, if at all.\n\n## Object-oriented programming\n\nObject-oriented\
    \ or programming OOP is the buzzword of the moment. It will solve all your programming\
    \ problems, give you unlimited wealth, and make you irresistible to the opposite\
    \ sex (actually, unlimited wealth will do to that).\n\nThe subject of OOP merits\
    \ a book of its own. In this book, we will discuss how OOP can stop bugs from\
    \ ever showing up. It's also important to discuss what parts of OOP give you these\
    \ advantages.\n\nOOP does not require any specific language. You can write OOP\
    \ code with assembly language. But a language like C++ forces you into a number\
    \ of object-oriented practices and makes some other practices very easy to implement.\n\
    \nAt the simplest level, OOP means keeping your function separate. For example,\
    \ functions that handle circles have no code or data in them for squares. Code\
    \ for squares has no code or data for circles. Code for drawing an item has no\
    \ code or data for circles or squares—but knows how to call the circle or square\
    \ drawing functions.\n\nThis separability in your program makes it easy to implement\
    \ exhaustive tests for virtually all functions in your objects. This separability\
    \ also means that a change in one object does not affect any other object. Use\
    \ an OOP approach to your coding. It will pay off in a much-easier-to-test product.\n\
    \nThat said, realize that OOP is not a panacea. It makes it easier to do some\
    \ kinds of testing but it does not eliminate the need for tests. It also adds\
    \ some new bugs that you normally don't see in c or asm.\n\n## Filling buffers\n\
    \nAnother bug that makes its presence rarely felt is using buffers before they\
    \ have been initialized or after they are free. When you do, in most cases, the\
    \ buffer will still have the correct data. Many times the buffer will have legitimate\
    \ data, although not the data it should - leading to very subtle bugs.\n\n## 36\
    \ No Bugs\n\nWhenever buffer is considered empty, fill it with an an ID byte (or\
    \ string if you prefer). This ID byte should be a value that is invalid for the\
    \ structure being filled (-2 usually works for everything). This way, if you access\
    \ the buffer after filling it, you will get data that, hopefully, so incorrect,\
    \ that it causes an immediately visible MFU.\n\nThis is very valuable before file\
    \ reads to insure that you handle the end of file when you get a partial read\
    \ successfully. Filling passed in buffers is also a good check to make sure the\
    \ passed in buffers are long enough. If a function returns a string, and one of\
    \ the parameters is the maximum length of the string, filling the buffer first\
    \ will insure bugs if the passed in buffer is too short.\n\nAlso, when you free\
    \ up a buffer, first fill it. This prevents bugs by accessing a free'ed buffer\
    \ which usually holds the old data. This holds not just for freeing a buffer you\
    \ allocated but for internal cache buffers, structures, and so on. Anytime you\
    \ are through with any kind of memory, fill it before freeing it.\n\nBy freeing\
    \ memory, if you access this memory after the free, you are guaranteed to get\
    \ bad values, hopefully causing an obvious MFU. If you don't fill it, then when\
    \ you access the memory after it is free, you will see the bug only in the rare\
    \ cases where the memory is reused to your post-free access.\n\nTry several values\
    \ for DEBUG_FILL_CHAR at different times. In some circumstances 0 is deadly; in\
    \ others, totally benign. Test your entire program using 0x00, 0x7E, and 0xFE.\
    \ I have found 0xFE to be the most damaging in most cases. I don't use 0xFF because\
    \ -1 in many cases has a special, sometimes benign, meaning.\n\n## Freeing a structure\n\
    \nThe program example below illustrates the use of filling a buffer.\n\n```\n\
    // Include file contents:\n#ifdef DEBUG\n#define DEBUG_FILL_CHAR   0xFE\n#define\
    \ DebugMemSet(p, n)    memset (p, DEBUG_FILL_CHAR, n)\n#else\n#define DebugMemSet(p,\
    \ n)\n```\n\n© Copyright 1992 by David Thiel - All Rights Reserved\n\n![](img/c29f9dc69d37305f082fd0bd64e612cf_45_0.png)\n\
    \n```c\n#endif\n\n// .c file contents\nLinkListDelete (elem *p)\n{\n    // Take\
    \ p out of the linked list\n    (p->next)->prev = p->prev;\n    (p->prev)->next\
    \ = p->next;\n\n    // Fill p\n    DebugMem(p, sizeof(elem));\n\n    // Add p\
    \ to free list\n    p->next = pFree->next;\n    pFree->next = p;\n}\n```\n\nThe\
    \ above example can be used not only for memory, but also for disk I/O. If you\
    \ delete a record in a database file, filling the deleted record will guarantee\
    \ that you get bad data if another record is still pointing to the deleted record.\
    \ In short, fill anything that persists after the free/delete function returns.\n\
    \nBefore any read, not just from disk but from anywhere (RS-232 port, and so on),\
    \ fill the buffer with the ID value. Then, if the read returns with no error but\
    \ didn't actually read anything, the buffer will have previous contents, possibly\
    \ from a previous successful read.\n\nIf the read is partially successful (that\
    \ is, you read the end of a file), the fill performs a second function. If you\
    \ assume all are successful, you are using the same buffer to perform all reads,\
    \ and the remainder of the buffer generally holds what appears to be legitimate\
    \ data.\n\nYou don't need to do this prior to a MemCpy or direct memory copying.\
    \ However, whenever you expect someone else to fill a buffer for you (DDE, networks,\
    \ and so on), first fill the buffer.\n\n## Filling Buffers\n\nThe program example\
    \ below illustrates the use of filling a buffer prior to a read.\n\n```c\nMyRead\
    \ (int iFile, void *pvBuf, unsigned uNum)\n{\n\nDebugMemSet (pvBuf, uNum);\nreturn\
    \ (read (iFile, pvBuf, uNum));\n}\n```\n\nI have found it useful to set registers\
    \ that I use in assembly languages modules to this same ID value. In higher-level\
    \ languages you generally don't have scratch global variables (you can, but it's\
    \ a terrible practice). The idea is to fill any variable of any type before someone\
    \ else will set it or after you are done with it.\n\n## NULL pointers\n\nWhat\
    \ discussion of eliminating bugs would be complete without the subject of NULL\
    \ pointers. What discussion of eliminating bugs would be complete without the\
    \ subject of NULL pointers. What discussion of eliminating bugs would be complete\
    \ without the subject of NULL pointers.\n\nWhat discussion of eliminating bugs\
    \ would be complete without the subject of NULL pointers. What discussion of eliminating\
    \ bugs would be complete without the subject of NULL pointers. What discussion\
    \ of eliminating bugs would be complete without the subject of NULL pointers.\n\
    \n## Prototyping including CONST\n\nThere is a certain type of bug I used to get\
    \ a lot. I would spend hours tracking it down. And then I would finally find it.\
    \ I would have done something like pass an int when I was supposed to pass a pointer\
    \ to an. I did this so often, that as soon the compilers started doing prototype\
    \ checking (I'm showing my age), I always prototyped functions. For a very effort\
    \ you get a large return on your investment.\n\nC is designed to help you do anything\
    \ you want. However, it also has the ability to use function prototypes and perform\
    \ very strong type checking. Use prototyping. A good C programmer breaks the rules\
    \ at times—carefully and deliberately.\n\nAll functions should be fully prototyped.\
    \ This includes whenever possible on the prototype for function variables. Also,\
    \ void * should be used whenever appropriate (as in malloc, memcpy and read) when\
    \ it is legitimate to pass in, or return any type of data. However, do not use\
    \ void * when a function normally accepts only one type (such as strcpy).\n\n\
    ## Prototyping examples\n\nThe program example below illustrates the use of proper\
    \ prototyping:\n\n```\nvoid *malloc (unsigned uLen);\nvoid *memcpy (void *pdest,\
    \ void const *pSrc);\nchar *strcpy (char *pdest, char const *pSrc);\n```\n\nAll\
    \ code should compile at the highest warning level with NO warnings or errors\
    \ produced. With C's casting capabilities, there is no need for any warnings.\
    \ First, if you see a warning, you know something is wrong (although it might\
    \ be as simple as having forgotten to catch something).\n\nSecond, this will catch\
    \ a number of errors that otherwise might not be seen for some time and that could\
    \ take days to resolve. Prototyping rarely will show where I have made a mistake,\
    \ but when it does, it generally shows the type of bug that normally make itself\
    \ known till much later, When it is very difficult to track down.\n"
  mdcn: "\n如果你选择使用错误日志，在 DOS 4.0 及更高版本中，你可以使用扩展 `open` 打开文件，这样所有写入操作都会提交。使用这种方法：它比调用\
    \ `commit file`（DOS 3.3 及以后版本）快得多。仅在 DOS 4.0 或更高版本中使用此方法，如果确实需要的话。\n\n## 对象面向编程\n\
    \n面向对象编程（简称 OOP）是当下的流行词汇。它将解决你所有的编程问题，带给你无限的财富，并让你对异性产生不可抵抗的魅力（实际上，无限的财富足够了）。\n\
    \nOOP 的主题值得专门写一本书。在书中，我们将讨论 OOP 如何防止 Bug 出现。同时，讨论 OOP 的哪些部分带带给你这些优势也是同样重要的。\n\n\
    OOP 不需要任何特定的语言。你可以用汇编语言编写 OOP 代码。但像 C++ 这样的语言会强制你采用许多面向对象的实践，并让某些其他实践变得非常容易实现。\n\
    \n在最简单的层次，OOP 意味着保持你的函数相互独立。例如，处理圆的函数中没有关于正方形的代码或数据；正方形的代码中没有关于圆的代码或数据。绘制某个物品的代码中没有关于圆或正方形的代码或数据——但知道如何调用绘制圆或正方形的函数。\n\
    \n程序中的这种可分离性使得易于对对象中的几乎所有函数进行详尽测试。这种可分离性也意味着一个对象的改变不会影响任何其他对象。使用 OOP 的方法进行编码。它将带来一个更易于测试的产品。\n\
    \n尽管如此，要意识到 OOP 并不是万灵药。它让某些类型的测试变得更容易，但它并没有消除对测试的需求。它还引入了一些通常在 C 或汇编语言中不会看到的新\
    \ Bug。\n\n## 填充缓冲区\n\n另一个存在感极少被察觉的 Bug 是在缓冲区初始化之前或释放（free）之后使用缓冲区。当你这样做时，大多数情况下，缓冲区仍然包含正确的数据。很多时候，缓冲区会包含合法的数据，尽管不是它应该包含的数据——这导致了非常微妙的\
    \ Bug。\n\n## 36 无 Bug \n\n每当缓冲区被认为为空时，用一个 ID 字节（或者如果你愿意，也用字符串）填充它。这个 ID 字节应该是一个对于被填充结构来说是无效的值（通常\
    \ `-2` 适用于所有情况）。这样，如果你在填充缓冲区后访问它，你将获得数据，希望这些数据足够错误，以至于导致立即可见的 MFU（内存访问错误）。\n\n\
    这在文件读取之前非常有价值，可以确保你在成功获取部分读取时处理了文件末尾。填充传入的缓冲区也是一种很好的检查，可以确保传入的缓冲区足够长。如果一个函数返回字符串，且其中一个参数是字符串的最大长度，那么先填充缓冲区将确保在传入的缓冲区太短时产生\
    \ Bug。\n\n此外，当你释放一个缓冲区时，先填充它。这可以防止因访问已释放缓冲区而导致的 Bug，因为释放的缓冲区通常持有着旧数据。这不仅适用于释放你分配的缓冲区，也适用于内部缓存缓冲区、结构等。每当你完成任何类型内存的使用时，在释放它之前先填充它。\n\
    \n通过释放内存，如果你在释放后访问这块内存，你保证会得到坏值，希望这能引起明显的 MFU。如果你不填充它，那么当你在内存释放后访问它时，只有在内存被重用到你释放后访问的极少数情况下，你才会看到\
    \ Bug。\n\n在不同的时间尝试 `DEBUG_FILL_CHAR` 的多个值。在某些情况下 0 是致命的；在另一些情况下则完全无害。使用 `0x00`、`0x7E`\
    \ 和 `0xFE` 测试你的整个程序。我发现大多数情况下 `0xFE` 的破坏性最大。我不使用 `0xFF`，因为在很多情况下 `-1` 有特殊的、有时是无害的含义。\n\
    \n## 释放结构\n\n下面的程序示例说明了填充缓冲区的用法。\n\n```\n// 头文件内容：\n#ifdef DEBUG\n#define DEBUG_FILL_CHAR\
    \   0xFE\n#define DebugMemSet(p, n)    memset (p, DEBUG_FILL_CHAR, n)\n#else\n\
    #define DebugMemSet(p, n)\n```\n\n© Copyright 1992 by David Thiel - All Rights\
    \ Reserved\n\n![](img/c29f9dc69d37305f082fd0bd64e612cf_45_0.png)\n\n```c\n#endif\n\
    \n// .c 文件内容\nLinkListDelete (elem *p)\n{\n    // 从链表中取出 p\n    (p->next)->prev\
    \ = p->prev;\n    (p->prev)->next = p->next;\n\n    // 填充 p\n    DebugMem(p, sizeof(elem));\n\
    \n    // 将 p 添加到空列表\n    p->next = pFree->next;\n    pFree->next = p;\n}\n```\n\
    \n上面的示例不仅可以用于内存，还可以用于磁盘 I/O。如果你在数据库文件中删除了一条记录，填充被删除的记录将保证如果另一个记录仍然指向该被删除记录，你会获得坏数据。简而言之，对任何在释放/删除函数返回后仍然存在的内容进行填充。\n\
    \n在任何读取之前（不仅是从磁盘，还是从任何地方，RS-232 端口等），都用 ID 值填充缓冲区。然后，如果读取没有错误但实际上没有读取到任何内容，缓冲区将包含之前的内容，可能来自上一次成功的读取。\n\
    \n如果读取是部分成功（即你读取了文件末尾），填充执行了第二个功能。如果你假设所有操作都是成功的，缓冲区将包含之前的内容，可能来自上一次成功的读取（*注：此处原文逻辑略有重复，译文按意保留*）。\n\
    \n填充传入的缓冲区也是一种很好的检查，可以确保传入的缓冲区足够长。如果一个函数返回字符串，且其中一个参数是字符串的最大长度，那么先填充缓冲区将确保在传入的缓冲区太短时产生\
