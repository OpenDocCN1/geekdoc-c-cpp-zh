    # Chapter 12


    # THE TESTING PROCESS


    So you''ve written the program, and it works. So what comes next? You ship it!
    Just kidding - that was the old method. This chapter, and the following one, describe
    the second half of creating a program - the testing process. These chapters are
    as critical as delivering a good product as the coding process itself.


    These chapters will lay out how your testing process should work. Without these
    practices, you will be left with a program that may look good, but is unusable
    to the number of MFUs still in it. So what is the process?


    It''s very simple; you now have to find and remove all of those MFUs you put in
    the code. No matter how good a job you did trying to write bug-free code, you
    will have bugs. Your entire testing process depends on whether or not you live
    by that philosophy. If you do not approach testing as the process of finding MFUs
    you put in the code, you will not find them.


    ## Developers and testers


    Most developers, after writing their code, hope that no bugs will be found. After
    all, their fun is writing the new code. Tracking down and correcting bugs, and
    introducing new bugs into the system, is generally a very painful process. When
    bugs are found, developers are generally upset to have them brought to their attention.
    If the developers approach bugs this way, though, you might ship a solid product.


    If testers take this attitude, though, you are guaranteed to ship a buggy product.
    Testers must take the approach that if they don''t find bugs, they have failed.
    They should go home upset that they have had an awful day. If they find bug after
    bug, they should go home happy with a bonus in their pocket.


    To repeat: The job of the test group is not to certify a product bug-free. The
    job of the test group is to attempt to find all of the MFUs in a product. Every
    day, testers should strive to find a new approach that will break the product
    they are testing. A good tester is the ultimate cynic—no matter what a developer
    does, the tester will find a way to break it.


    Testers also verify that the product works as advertised. As the marketing staff
    busily sells the upcoming product based on its new features, testers must check
    that each feature is in the product and that it works as expected.


    ## Warts and all


    Bugs are in there. The testers'' goal should be to identify every last one of
    them. Their job is to give us a complete picture of the program as it presently
    exists.


    You might decide not to fix some of the bugs, but you need to KNOW of every bug
    that exists before shipping. If you don''t know what bugs are in your code, then
    nasty bugs are almost certain to show up after you ship, and leads to the "fix-disk
    of the week" syndrome, where you ship out a disk every week to fix some bug that
    a user found. This usually perpetuates itself. As you ship fixes for all of the
    original bugs, you start getting reports of bugs introduced with the fixes.


    ## Setting up the process


    Fortunately, it''s relatively simple to set up a process to find the bugs in a
    program. All it takes time and money. Accept the fact that testing is a cost of
    developing software, and invest in the process.


    This does not mean that you have to invest an unlimited amount of time and money.
    Just as it is impossible to write bug-free software, it is also impossible to
    find every last bug. (It''s to know the testers are as fallible as the developers.)
    However, you need to allocate enough resources to the testing process to ensure
    that you have a very good chance of finding all significant bugs.


    Adding testers towards the end of a project works about as well as adding extra
    developers at the end of a project—that is, it''s usually counter-productive.
    This holds for the same reason that 9 women can''t have a baby in 1 month. Testing
    software requires as much skill as writing software. It requires specific training
    and knowledge. And mostly, it requires time over the entire development process.


    And, like developing, testing is partially innate talent. Some people can sit
    down at a program and, almost just by looking at it, cause it to "crash and burn"
    (that''s a highly technical term that means the program won''t work). Others can
    spend days on it and never find a bug.


    Generally, you should allocate many resources to testing as you do to development.
    One tester cannot test for 10 developers. By the same token, developer can''t
    test 10 testers. The actual ratio of testers to developers may vary but generally,
    for each 1 - 4 developers busy putting MFUs in the code, you need a tester finding
    them.


    ## The plan


    Let''s set up a scenario. Let''s pretend the last time you shipped a program,
    you had one dedicated tester, who was assisted by everyone in the company testing
    the week before you shipped the program. The original program and subsequent bug
    fixes were so bad that most users were better off before they received the update.


    Now management is so desperate—really desperate—that they will try debugging plans
    that make sense and cost money. They have the resources to create a decent test
    process.


    First, you need to create a testing plan. Although software development occurs
    best in an unstructured environment, testing is at the other end of the spectrum.
    It requires significant structure and planning. The testing plan must hold up
    the development process. The testing process should work with the development
    process on a day-to-day basis. Testers must try to complete their job as developers
    finish theirs. While developers design and code their basic system, testers should
    determine how they are going to break the program.


    Testers should be brought into the development process before the first code is
    released. They need to know what will be getting so they can be prepared to test.
    In the case of a new product (as opposed to an update), testers might very well
    have to start preparing.


    The testing plan determines what, how, and when you will test. It includes the
    process whereby testers will report bugs to developers, developers will fix bugs,
    and testers will verify that they have been fixed. It includes a list of the tests
    to be written and.


    You need to lay out what the program does and how it will be tested. A program
    appears different to a tester than it does to a developer (and it appears different
    from both of those to a user). The test plan basically provides a specification
    of the program from the tester''s view. This allows the tester to create a list
    of items to test.


    You need to determine the testing methods. This includes figuring out the tools
    you will test with, including those that might not exist and which you will have
    to write. This also covers the systems that you need to test.


    The test plan needs criteria to judge the product. How do you know when a product
    has been tested enough that you can ship it? How do you know whether a bug is
    serious enough to delay shipping? The deadline to ship approaches, the pressure
    becomes to declare all known bugs acceptable and simply ship it. The only way
    to avoid this is to come up with reasonable objectives early in the process, before
    pressure mounts. Changes that occur during development might change the approval
    criteria some, but at least you have a strong baseline to work from.


    ## Automation


    When the testers sit down to design their tests, they should concentrate on one
    thing: automation. If at all possible, every test should be fully automated, giving
    the program input and checking its output, flagging the tester only if an error
    is found.


    Generally, automating a test takes more time than running the test manually once
