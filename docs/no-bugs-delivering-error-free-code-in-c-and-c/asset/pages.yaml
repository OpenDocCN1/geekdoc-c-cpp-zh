  md: '# Chapter 1


    # INTRODUCTION


    Attempt 1


    We''ve all been there. We''ve finished up our new application. It''s copied and
    shipped out the door. It''s arriving at our first customers - and the phone rings.


    It starts as a technical support question. But the problem gets escalated and
    pretty soon it becomes obvious - there is a bug in the program.


    And not just some little insignificant bug that user''s can work around - this
    is a big hairy bug that gets right in the face of each and every user and essentially
    stops them from using the program.


    It doesn''t matter how many customers you have, having to replace 100% of the
    copies of your program out there is a horrendous expense. And the cost is not
    limited to actually replacing the disks. You now have a reputation for delivering
    buggy software. This reputation will be costing you sales for the next several
    years - perhaps enough that a product that would have succeeded failed.


    If you cringe every time the phone rings after shipping a new product - then this
    book is for you.


    These bugs can have more than just financial impact. The most standard program
    in the world may be used in a cardiac care unit in a hospital. A small failure
    in a copy program could change a number in a loan application. A vertical market
    application may have a businessman reporting incorrect information to the government
    (which happens to be a felony). Somebody word processor was used to type up the
    specifications to the airplane you are flying in.'
  merge: -1
