    \ freeing local variables both on entry and exit of the function. You also need\
    \ to trash some registers, assert others, and check some others for constant values.\n\
    \nThe following stub shows how to order all of this. The local variables have\
    \ to be created and freed inside the register checking. On exit, you must trash\
    \ first—lest you check a register you are also trashing. You then do asserts before\
    \ finally checking the preserved registers.\n\n# Complete Function\n\nThe program\
    \ example below illustrates the use of all of the assembler specific tricks.\n\
    \n```\nLCL_CF      STRUCT\n    cfVar       dw\n    cfVar2      dd\nENDS\nLCLCF\
    \       proc\n```\n\n```\nRegEntry        <size LCL_CF> ; Save for RegCheck\n\
    CreateLocals    <size LCL_CF> ; Create the local vars\n                      \
    \       ; Body of the function\n                             ...\nFreeLocals \
    \     <size LCL_CF> ; Free the local vars\nTrashReg         <bx,dx>      ; Set\
    \ to TRASH_WORD\nConst_Reg        cx, 0        ; Should always return 0\nAssertVar\
    \       <ax>         ; Should point to buf\nRegCheck        <di,si,bp,sp>  ; Be\
    \ sure preserved\nret              ; We're done\nCompleteFunc    endp\n```"
  merge: -1
