    # Testing, testing


    Testers are essentially super users—not power users who know the program well,
    but users who can act like a power user one second and like a novice next. The
    testers ensure that a program not only works as advertised; they also ensure that
    it is usable. A bug-free program that is too difficult (or weird) is of no use
    to anyone.


    users'' advocates to the developers. The testers will first notice that the way
    the program works confuses a user. They are the ones who will use the system to
    see what happens


    Just as the tricks for developers in the earlier chapters attempt to make bugs
    immediately apparent, so do the tests. Each week when a new build is released
    to testing, an immediate and thorough test for bugs begins. Reports of any bugs
    identified are immediately e-mailed to the developers.


    And it all relies on the testers being as good at finding MFUs as the developers
    were at putting the MFUs in the code in the first place.


    # The Beta Test


    A beta test is not a process. A beta test is not a substitute for any of the other
    parts of the test process. A beta test by itself will not find most of the bugs
    in a program. Many companies try to use a beta test instead of a proper internal
    test program. This does not work.


    At the same time, a beta test is essential. No matter how good your internal test
    system is, no matter how talented your testers are, no matter how safe your developers,
    you will produce code with bugs in it. And the only way to find those bugs is
    to have a beta test.'
