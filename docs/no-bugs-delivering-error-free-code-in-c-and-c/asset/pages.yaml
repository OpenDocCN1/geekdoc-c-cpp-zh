  md: '# Chapter 7


    # WATCHING THE STACK


    Virtually everyone has written a program where they ran out of stack space. How
    do most of us tell? The way I used to do it is if I started getting weird errors,
    where local variables or return addresses were suddenly overwritten, I would increase
    the stack. If the problem went away, I would consider it solved.


    I got tired of using this guess & hope approach to setting the stack size. This
    chapter presents a way to determine what is actually needed. This allows you to
    set a size that will work on systems with TSRs that use more of your stack than
    your own system. At the same time, you do not waste memory needed elsewhere by
    having a stack bigger than you.


    An allied problem is using uninitialized local variables. All uninitialized global
    variables are set to 0 in c, so in a sense they are initialized. However, local
    variables start out with random values in them. This can make it extremely difficult
    to repeat bugs based this problem.


    This chapter includes a method to initialize all local variables in debug mode.
    Then, if your code is using a local variable before setting its value, the bug
    will get repeatable.


    While the ideas here should work for any based processor, this type of code is
    very compiler specific. The code shown here is for Microsoft C 7. An example for
    Borland C++ 3 is in the appendix.


    # Stack Space


    How much stack space does your program use? This is one of the most critical questions
    facing a program, yet of the least answered. If your program has too small a stack,
    it will "blow up" at random times, causing various problems. If the stack is too
    large, you do not get stack problems, but restrict memory'
  merge: -1
  pgno: 76
- img_proc: true
  md: '# 68 No Bugs


    that could have been put to other uses. That 1K or 2K extra stack you never use
    (sometimes 4K or 8K) can make a big difference when memory gets tight (ie, malloc
    fails).


    So how is the stack size determined for most programs? In most cases, a developer
    starts out with the default size. If an error results, the developer attributes
    to stack overflow, or if he increases the stack size by an arbitrary amount. Think
    about it: In the last program you shipped, how much of the stack is utilized?


    Stack size is critical not only for your own program. When a hardware interrupt
    occurs, the interrupt handler will use your stack. Many TSRs do so. You generally
    should have a big stack enough that you use the last 512 bytes of it. This gives
    you some leeway on systems with BIOSes or TSRs that use more stack than your system.
    512 bytes is a safe number before DOS has a small stack (256 bytes), and if a
    TSR uses more than 256 bytes, then the TSR will probably crash DOS.


    For other simple, sequential programs, there is no way to measure stack usage
    under every circumstance. However, you can easily measure stack usage every time
    you run the program. By watching the usage under various circumstances, you can
    get an ideal of the overall usage.


    You can also check the stack every time you enter a function to see whether enough
    remain. If space gets tight, you can use a DebugMessageBox to warn that you are
    out of stack. With the two tools described here, you can insure your stack is
    not too big, not too small, but just right (sortof Goldilocks & the Three Bears).


    The stack tools are very compiler specific. Every compiler I know of has a variable
    value or location you allow to determine the beginning and end of the stack. Each
    also has a call that can be at the beginning of each function to check and see
    whether enough remain for the local variables in that function. The code below
    works with Microsoft C 7.


    We perform this testing with three simple tools. First, when a program starts,
    we make a call that will fill the unused stack with a specific value. Fill from
    SS:SP to the base of the stack (the stack grows downward). By definition, it must
    be safe to fill from SS:SP downward because SS:SP is used by hardware interrupts.


    © Copyright 1992 by David Thielen - All Rights Reserved'
