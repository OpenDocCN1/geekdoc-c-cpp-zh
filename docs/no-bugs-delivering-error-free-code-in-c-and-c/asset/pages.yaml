  md: "# Asserting a pointer to the heap\n\nThere are times we will want to assert\
    \ a pointer that we believe is allocated from the heap (and is at least n bytes\
    \ long). Using _AllocChkHeap, we can verify that our pointer is food. Using _AllocSize,\
    \ we can then verify the length.\n\n# AssertHeapPtr\n\n```\n#if DEBUG > 0\n#define\
    \ AssertHeapPtr(p, s) CheckHeapPtr (p, s)\n#else\n#define AssertHeapPtr(p, s)\n\
    #endif\n...\nvoid CheckHeapPtr(void *pMem, unsigned uLen)\n(\n  ALLOC *pAlloc;\n\
    \  unsigned uSize;\n\n  // Get the ALLOC struct\n  pAlloc = ((ALLOC *) pMem) -\
    \ 1;\n\n  // See if it is a legit pointer\n  if (_AllocChkHeap(pAlloc))\n    return;\n\
    \n  // Check its size\n  if ((uSize = AllocSize(pMem)) < uLen)\n    DebugPrintf(\"\
    Pointer from %s:%d, memory, and %d < required len %d\\n\", pAlloc->fileName, pAlloc->iFileLine,\
    \ uSize, uLen);\n)\n```\n\n# EMS and XMS\n\nEMS and XMS provide similar functions\
    \ and are more difficult to check than heap allocations. They are also trickier\
    \ than regular memory, and we are therefore more likely to make a mistake with\
    \ them. Therefore, it is imperative to check calls to this memory as thoroughly\
    \ as possible."
