    # Multiscope


    Multiscope is a debugger for DOS, Windows, and OS/2 (whatever that is). In Windows,
    it runs as a Windows application, which gives you an awesome interface. Although
    not as good on really low-level debugging, for source-level debugging of an application
    it shines.


    Multiscope is hard to describe in a couple of paragraphs. It is simply the best
    applications debugger on the market. It provides a multitude of interfaces, the
    best way to use it is with its Windows interface.


    Under Windows you can debug both DOS (in a box) and Windows programs. You can
    debug programs running on the same machine or on a different system over a serial
    line. You can use dual monitors, but if your second monitor is a character-based
    interface instead of Windows.


    Part of Multiscope''s appeal is that it is Windows based. Providing the same windowed
    data via Windows instead of using a character-based display makes it a better
    interface than any other debugger. Also, Windows allows better sizing and layout
    that you will get on an 80 x 25 monochrome display adapter (MDA).


    Also, the interface is generally lot easier to use than a character-based one.
    All of the reasons prefer Windows-based applications hold


    © Copyright 1992 by David Thielen - All Rights Reserved'
  merge: -1
