  md: '# Exercising code paths


    The hard to find bugs generally occur under circumstances that are relatively
    rare. After all, if the program re-boots your system every time you run it, it
    will usually fix that error.


    Some of these rare cases are caused by executing a code path that has never been
    executed. When your program first starts, you will generally do a malloc or two.
    You have a code path take if the malloc fails (you don''t assume it succeeds to
    you?) but has it ever failed?


    If not, you have an accident waiting to happen. What does your program actually
    do when that particular malloc fails? As long as you have not tested a code path,
    you have not tested your program. Be sure that you exercise every path. If you
    have an "if () ... else..." and you have always executed the "else" part, then
    the "if" is a bug waiting to happen.


    The easiest way to test code paths is via macros: Trap () and IntTest. Trap ()
    will advise the tester if the expression is true, and IntTest will advise the
    tester regardless of the result. For each conditional (if, for, do, & & switch)
    put combination of Traps and IntTests that you will hit a Trap or IntTest for
    each possibility.


    When you hit an IntTest or Trap, you can do one or two things. You can do a printf
    that that particular code path. Or you can place an int stop at line of code.
    If your debugger is a source-level debugger, then there is no need for a printf
    – when the debugger pops up, it will tell you where you are.


    If the "if" contains increments (i++), function calls, or other code that cannot
    be executed, then put an IntTest in the "else." If there is no "else," put one
    in for debugging. The program example below illustrates the use of these macros.


    # Trap Macros


    ```

    #ifndef DEBUG

    #define IntTest          _asm { int 3 }

    #define Trap(t)           ( (T) ? _asm { int 3 } : )

    #define TrapNot(t)        ( (T) ? _asm { int 3 } : )

    #define IntTestElse      else _asm { int 3 }

    #else

    ```


    © Copyright 1992 by David Thiel - All Rights Reserved'
  merge: -1
