  md: "EMS and XMS are becoming less and less important as time goes on. Windows doesn't\
    \ use them. DOS applications that need lots of memory are generally now being\
    \ written as DPMI applications, while they use XMS, the DPMI server that and an\
    \ application doesn't make any XMS calls itself.\n\nIf you do not care about EMS\
    \ or XMS, read the section below on handle tracking (also used in Chapter 9, \"\
    File I/O\") and then skip the rest of the chapter. I have included very little\
    \ code in the following sections, only enough code to convey the basic concepts.\
    \ Full code is available on the companion disk.\n\n# Handle tracking\n\nUnfortunately,\
    \ you cannot place headers and titles on EMS/XMS memory as you can on the heap.\
    \ However, you can still implement most of the checking you can have with the\
    \ heap.\n\nFirst of all, for each EMS/XMS allocate, we allocate a header like\
    \ the one we use with the heap. However, this memory is generated by a malloc\
    \ in regular memory. We use this malloc memory to track our usage of EMS and XMS\
    \ memory (as well as file handles in the next chapter).\n\nThese structures hold\
    \ the handle of the malloced memory. Because each handle is unique, you have a\
    \ linked list for EMS and another for XMS. This adds a small amount of processing.\
    \ With heap memory, you know where the structure is when passed a pointer. With\
    \ EMS and XMS, you have to walk the appropriate linked list to find the handle\
    \ you were passed.\n\nTo do this, we create a set of handle calls. The first creates\
    \ a linked list. Each linked list has a different data size to store the information\
    \ associated with a given set of handles. This becomes important when used with\
    \ files where you want to store the filename, which can be 74 bytes long.\n\n\
    # HdlCreate\n\nThe program example below illustrates the use of allocating memory\
    \ to go with a handle.\n\n```\ntypedef struct S_HANDLE_NEXT\n{\n    struct S_HANDLE_NEXT\
    \ *pNext;\n    int iHdl;\n```"
