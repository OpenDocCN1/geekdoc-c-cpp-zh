  md: '# 93 Bugs


    If you only access EMS by using the copy function, then the above test is unnecessary.
    You need to perform this test only if you might end up mapping the physical page
    to logical pages simultaneously.


    This check, along with checking the EMS version support (and determining whether
    EMS memory even exists) should be part of your check to see whether a system has
    EMS memory. All of this should occur in both debug and non-debug modes.


    On initialization, we allocate a 4-page EMS block. We then fill these pages with
    FILL_CHAR to -1 (that is, map nothing), we map in the appropriate page from our
    4-page block. When a new page is mapped in, we check our FILL_CHAR page.


    This performs two services. First, if you read from a page after unmapping, you
    will get garbage data. Second, if you map a page to page after unmapping it, you
    will see the change when you test on the next map call. You also should testtest
    each FILL_CHAR page mapped in our TestAll function.


    When allocating EMS memory, we need to add the EMS handle to your linked list
    for EMS. In debug mode, you should also include the file and line that function
    was called from.


    We also initialize the malloced memory to FILL_CHAR. EMS memory is generally recycled—even
    more than heap memory—so that reused memory is almost always holding the same
    values the previous user of the memory assigned.


    You must save and restore the page state before after fill. Otherwise, a call
