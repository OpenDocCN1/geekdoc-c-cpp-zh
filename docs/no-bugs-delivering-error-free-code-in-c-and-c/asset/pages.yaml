- img_proc: true
  md: 'site. In that case, if the bug is serious enough, the computer will need to
    be shipped to the development site.


    A developer needs to inform the tester when a bug has been fixed. This communication
    channel should be automated (electronic mail is great for this). The tester can
    then test to see whether the bug is truly fixed. The tester is the one who determines
    whether the bug has been really fixed.


    If there is no automated test to find the bug that was fixed, then the tester
    should strongly consider adding it to an existing test or writing a test to check
    for the bug. If it happened once, it could happen again. This "regression testing"
    can be crucial. Many times, fixing a bug will introduce a new bug. When fixing
    the new bug, another developer might inadvertently reintroduce the old bug.


    # The bug database


    Tracking bugs is critical as finding. If a bug is found but never fixed, then
    the program is no better off. If a developer determines, after a week of work,
    that a bug cannot be fixed, you do not want another developer spending a week
    rediscovering the same thing.


    If two people report the same bug, you do not want two different developers fixing
    it. If a bug is fixed and then reappears in another, later version, referring
    to the earlier report should point the developer to the actual bug.


    A bug database is more than simply a database on a computer. It is part communication
    program, part process, and part database. It is the means by which bugs are followed.


    Although a one-person effort can simplify a lot of this process, the actual process
    should still exist. A developer/tester working alone still needs to track bugs.


    If at all possible, a single person should enter all bugs into the system. This
    person is the bug Master, one of the most thankless jobs in the entire development
    process. Individuals who find bugs should e-mail the bug reports to a bug alias
    (assuming you have e-mail).


    All developers and testers on the project should be on this alias and should read
    all e-mail to this alias. Many times, a developer or tester will know the'
