  md: "# stckfill.c\n\nThe program example below illustrates filling the unused part\
    \ of the stack.\n\nextern unsigned end;\n\n```\nvoid StackFill (void)\n{\n   \
    \ unsigned uLen;\n    BYTE *pStck;\n\n    pStck = (BYTE *) &end;\n    uLen = OFF\
    \ (&uLen) - OFF (pStck) - 256;\n    memset (pStck, '$', uLen);\n}\n```\n\nWhen\
    \ the program ends, we make a call to a second function that then starts at the\
    \ base of the stack and moves up until it finds a value other than the fill value.\
    \ This is the size of the unused stack. It then prints the total stack size: the\
    \ amount used and the amount unused.\n\n# stckused.c\n\nThe program example below\
    \ illustrates determining the stack usage.\n\nextern unsigned end, _atopsp;\n\n\
    ```\nvoid StackUsed (void)\n{\n    unsigned uLen, uStckLen;\n    BYTE *pStck;\n\
    \n    pStck = (BYTE *) &end;\n    uStckLen = _atopsp()-uLen=0;\n    for (uLen=0;\
    \ uLen<uStckLen; uLen++, pStck++)\n        if (*pStck != '!')\n            break;\n\
    \    uLen -= 512;\n\n    printf(\"Stack size:%d, Unused:%d, Needed:%d\\n\", uStckLen,\
    \ uLen, uStckLen-uLen);\n}\n```"
