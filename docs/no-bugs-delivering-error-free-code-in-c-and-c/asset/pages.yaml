  md: 'answer to a bug and can e-mail a response to the sender and Bug Master, thus
    saving a lot of time.


    This bears repeating. The job of the developers is not to wait to be assigned
    a bug. The job of the developers is to help find all the MFUs they put in the
    program. Getting a copy of every bug report, even if most of them are discarded
    after reading the first line or two, is critical to this process.


    Although everyone reads the e-mail to the bug alias, the Bug Master is the one
    who acts on it. He or enters the bug in the database. Entering a bug in the database
    should include the name of the developer and tester of the bug is assigned to.
    This should then generate e-mail to them as well as to the person who reported
    the bug.


    When the bug is assigned, it is also assigned a "severity." This severity should
    generally be a number within a small range that spells out clearly how critical
    the bug is:


    +   - Level 1: The program causes catastrophic damage (for example, formats your
    hard drive)

    - Level 2: Some major functionality doesn''t work (for example, you can''t print)

    - Level 3: Some minor functionality doesn''t work (for example, you can''t print
    to a file on another drive)

    - Level 4: The program works but something is wrong (for example, spelling mistake,
    caps lock ignored)

    - Level 5: A design flaw (for example, call printing instead of type)

    - Level 6: A suggestion for the future (for example, allow wild cards when specifying
    files to back up)


    Categorizing by severity is important for two reasons. First of all, it allows
    a developer to prioritize bugs. Second, as the ship date approaches, only bugs
    assigned lower severity will be fixed. (Because fixing a bug always leaves the
    possibility of introducing a new, and potentially more serious, bug, you need
    to be very careful as your ship date approaches. Although a product


