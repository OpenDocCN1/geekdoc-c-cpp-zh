    # When to ship


    You''re ready to ship your final beta when you send out a beta, and subsequent
    to it, you did not have to make any changes to your core code—no changes to any
    part of the code that is central to the system.


    A development group that does a very good job writing bug-free code will generally
    have one to two beta releases.(Operating software software will generally have
    more because applications talk to operating systems, adding another layer to the
    puzzle). However, it''s better to have additional betas than to ship a buggy product
    that customers will return.


    All of the beta periods except the final one can last for any period of time,
    although the average will be one to two months. If you are still receiving lots
    of new bug reports for an exciting beta, there probably isn''t much to ship a
    new one. If you have a radically new version or you have fixed a lot of critical
    bugs, it''s probably time to ship another beta.


    The final beta period should last a minimum of at least one month and really should
    be two months unless you are getting reports of bugs. The longer you wait, the
    more unusual combinations the program will be put through out in the field.


    If you make final changes that you consider safe but do touch the core code, you
    might want to consider shipping a limited beta. Ship copies to those sites that
    you have found the most problems.


    You might also want to consider beta testing through CompuServe or another bulletin
    board service. If beta testers download the beta, then there is no cost to you
    for having some intermediate betas in the course of the beta test. It''s hard
    to believe, but people will actually take the time to download 8 Mg of files just
    to test a program for you.


    # Selecting beta sites


    In our criteria for beta sites, another important feature is diversity. Two users
    with identical computers, software, and habits are not any more useful than one.
    Two radically different users with different systems and software are.'
