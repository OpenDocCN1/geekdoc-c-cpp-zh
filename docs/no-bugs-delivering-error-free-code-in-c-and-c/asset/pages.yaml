  md: "# Base class assert\n\nMost C++ programmers use a base class that everything\
    \ is derived from. In debug mode only, add two methods to the base class. The\
    \ first is an Assert function. You can then assert any instance of a class by\
    \ merely calling inst.Assert(); In non-debug mode Assert should be defined as\
    \ a NULL function so no code is generated for assert calls.\n\nThis places an\
    \ assert where it belongs, as a part of the class definition. As the class changes,\
    \ so will will its assert. It also makes it very simple to assert any instance.\n\
    \n# Base Assert\n\nThe program example below illustrates the definition of Assert.\n\
    \n```\nclass base\n{\n...\n\n#if DEBUG\n  void Assert (void);\n  void Dump (void);\n\
