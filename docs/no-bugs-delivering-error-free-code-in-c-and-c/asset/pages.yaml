  md: "# 88 No Bugs\n\n```\n} HANDLE_NEXT;\ntypedef struct S_HANDLE_HDR\n{\n    HANDLE_NEXT\
    \ sHdlNext;\n    unsigned uSize;\n} HANDLE_HDR;\n\nHANGLE_HDR *HdlCreate (unsigned\
    \ uSize)\n{\n    HANDLE_HDR *phdl;\n\n    if (phdl = malloc(sizeof (HANDLE_HDR))\
    \ == NULL)\n        return (NULL);\n\n    memset(phdl, 0, sizeof (HANDLE_HDR));\n\
    \    phdl->uSize = uSize;\n    return (phdl);\nn\n```\n\nOnce you have created\
    \ a list, you need to add an element to the list each time you get a handle. You\
    \ allocate enough memory to hold a HANDLE_NEXT structure as well as additional\
    \ uSize bytes. Therefore, for each EMS/XMS allocation, you will have a malloc.\n\
    \nWe store the handle in HANDLE_NEXT so that you can find a structure for a specific\
    \ handle. The rest of the is stored in the additional malloc'd memory directly\
    \ following the HANDLE_NEXT structure. This additional information is used when\
    \ writing debug prints to identify the handle.\n\nFor both EMS and XMS, you identify\
    \ the handle by the module and number where it was created. However, in the case\
    \ of EMS, you can also give an allocation name up to 8 bytes long. Because this\
    \ name is a better identifier, we also track the name for EMS.\n\n(A note on when\
    \ to call malloc and when to call Alloc. Your non-debug code should, however,\
    \ generally call malloc for two reasons. First, it is very easy to get into recursive\
    \ loops when debug code calls debug code. Second, the debug code should attempt\
    \ to make a minimal impact on the system—and every byte counts when it comes to\
    \ malloc.)\n\n© Copyright 1992 by David Thielen - All Rights Reserved"
