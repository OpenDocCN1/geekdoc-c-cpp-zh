    # Write


    As with read, the most important test you can perform on a write is to assert
    the data being written before calling the write. If it''s possible to do so, assert
    each write. The assert is more valuable than all these other tests combined.


    As with a read, a write call should include a call to test the handler on entry.
    It should include a test of errno on competition. You should pop up if errno is
    any value other than 0.


    Unlike a read, a write should always return the number of bytes the write requested.
    The test after a write is simple: Did it get written and did you get an error?


    In the code below you will notice that two different error conditions produce
    the same error message. This is okay here because the error always be obvious.
    If the error is non-zero, that''s our problem. If the error is 0, you will see
    that you were not able to write everything.


    Although an error should occur if the disk fills up, the event still deserves
    a pop-up. First of all, filling a disk is a rare event, and you know when it happens.
    Second, and more importantly, many programs never test their code if a disk runs
    out of space. You should be sure the program handles this situation gracefully.


