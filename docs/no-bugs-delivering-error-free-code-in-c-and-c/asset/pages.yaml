  md: '# Chapter 4


    # SOME BASIC TRICKS


    Now we get into the actual programming tricks. For those of you who have no idea
    how to program, if you''re still with us, its time to skip to the chapters on
    testing. For those of you in management, its time to give your developers a raise
    and then skip to the testing chapters.


    This chapter has all the tricks that don''t deserve a chapter of their own. This
    isn''t to say these tricks aren''t important, merely that they can be explained
    in fewer words.


    This, and the rest of the chapters until we get to the testing process, both lists
    specific and how to implement them. The tricks are described generically. The
    code is c (and assembler where required) code for the PC.


    Most important, these tricks will allow you to painlessly eliminate bugs from
    your programs. These tricks do not add to your work - but they save a lot of the
    time you previously spent debugging.


    # TestAll functions


    Suppose your program is mysteriously crashing. You don''t know why or exactly.
    But then you place the TestAll function at various points in your program. You
    are now able to narrow down the bug. TestAll reports all is okay and then, 20
    lines later, reports an error. The bug is in those 20 lines.


    So what is this magical TestAll function? Quite simple, it calls every global
    test function you have. At a minimum, it checks the NULL memory locations, the
    entire heap, and the amount of stack left. It also asserts all global data structures.
    In Windows programs, it calls the ValidateCodeSegments and ValidateFreeSpaces
    functions.'
  merge: -1
  pgno: 37
- img_proc: true
  md: "# TestAll function\n\nThe program example below illustrates the implementation\
    \ of\nTestAll.\n\n```\nvoid TestAll (void)\n{\n  // Test system\n  TestHeap();\n\
    \  TestStack();\n  TestNull();\n  #ifdef WIN\n  ValidateCodeSegments();\n  ValidateFreeSpaces();\n\
    \  #else\n  TestEms();\n  TestXms();\n  #endif\n\n  // Test global variables\n\
    \  AssertBool(bInsertMode);\n  AssertDbase(&MainDbase);\n}\n```\n\nAnytime you\
    \ create a test function that can be called anywhere (globally) to\nperform its\
    \ test, that test should be added to TestAll. Eventually, TestAll\nbecomes very\
    \ slow, and because of that you rarely want to call it. However, it\ninvaluable\
    \ in two places.\n\n+   - When your program completes a major task (for example,\
    \ a word processor\nsaves one file and is about to open another). It is invaluable\
    \ because\nis switching data sets and you should know which data set doesn't work.\n\
    \n+   - When tracking down a bug that could be to anything. It is a quick way\n\
    to identify the bug. You place the TestAll function at various places -\nwhere\
    \ you know the system is still okay up to the point where you know it\ntrashed.\
    \ It will not only find where you start to mess up your\nprogram; it will also\
    \ tell you which test failed, helping you identify what is\nwrong, and where.\n\
    \nIn the below example, funcBad blows up due to an error in the system. But the\n\
    code looks error-free. By using the tests, you can determine which function is"
