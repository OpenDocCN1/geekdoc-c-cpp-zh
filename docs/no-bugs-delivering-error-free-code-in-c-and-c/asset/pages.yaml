  md: 'At the other end are the do-what-I-say-not-what-I-mean bugs. Here, logic errors
    are hard to find because the program is properly doing exactly what you told it
    to do. This is where asserts shine. Ideally, your asserts assert what you mean
    in addition to what you said.


    To handle logic errors, you need to assert everywhere. All return values from
    a function should be asserted just before return. If you don''t know whether a
    function asserts its return values, assert after calling the function. All functions
    need to assert all parameters they are passed. If you don''t know whether the
    function you are calling asserts, assert just before calling the function.


    When you have complicated logic, especially in large loops (while or for loops
    with a lot of code in them), place asserts at logic breaks in the loop (including
    the start of the loop). The asserts at this point should assert everything possible.
    Do not assert only your pointers, individually; assert the relationship between
    them. For example, if a loop will advance a pointer by 2 bytes in a string each
    iteration, be sure that there are at least 2 more characters in the string.


    It is critical that the asserts make you confident that you are working with the
    correct data. You still have to verify that you are performing the correct operations
    on the data, but you shouldn''t have to worry if the data itself is correct. And
    even more importantly, you shouldn''t have to worry if your different variables
    are consistent among themselves (for example, if p is supposed to be equal to
    a[i], assert p == a[i]).


    If you make liberal use of asserts, while you are first writing your code, you
    will be pleasantly surprised at how much easier they make your coding. The asserts
    will point you right at a large number of the bugs you have to fix your code first
    running - bugs that previously would take days to find all of them. Generally,
    writing asserts will pay for itself within a day or two.'
