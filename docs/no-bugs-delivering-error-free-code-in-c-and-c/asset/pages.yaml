  md: '# 160 No Bugs


    Until now, most companies either didn''t automate – they primarily used batch
    files or wrote their own test programs. Microsoft Test does all of this for you.


    Microsoft Test is unique and invaluable. With it you can create full-featured
    automated tests, essential to a good testing process. By setting up test scripts,
    you can, with no human intervention, run scripts that perform every test you have
    created against each new version of a program.


    Testing a program no longer requires a major investment in time. Testing no longer
    requires fallible humans to watch each step of the program to verify the program
    is working properly. Tests are no longer skipped because of inadequate staff or
    time. Microsoft Test allows you to create your own automated test system.


    It includes everything you need to create and run automated test scripts, including
    keyboard and mouse input and checking the screen output. It runs tests automatically
    and logs the results.


    Keyboard and mouse input are handled by placing the key and mouse events in the
    message queue of the application being tested. The application truly sees no difference
    between Microsoft Test and a user typing in some keys.


    For screen dump comparisons, you can separate screen dumps for each monitor type
    (EGA, VGA, and so on). You can also use fuzzy logic where it will look for a button
    in a given area. Because a button might have a slightly different shape on different
    monitor types, the fuzzy logic allows you to use one screen dump.


    As well as looking at the screen output, Microsoft Test can check dialog boxes
    by the contents of controls, DDE and OLE messages, and so on. This allows you
    to test against actual results instead of the screen display (ie, the text contents
    of an edit control rather than the image of the text on the screen).


    It is a lot more valuable to test what values are in a dialog box because normally
    you will be using those values. Your program doesn''t read the bitmap of the dialog
    box, but it reads the text in edit control.


    The same holds for DDE and OLE: The contents of these messages is critical to
    using them properly. By checking the actual values, you can insure proper communication
    with other programs. Without this feature, you would be left waiting to see the
    effects of bad data passed.


    © Copyright 1992 by David Thiel - All Rights Reserved'
  merge: -1
  pgno: 169
- img_proc: true
  md: 'Microsoft Test includes a Basic command language so that you can develop sophisticated
    test scripts. The Basic environment includes a recorder and debugger so you can
    debug your debugging scripts.


    I had planned on never learning COBOL or Basic. Unfortunately, with the advent
    of Microsoft Test (and Microsoft Visual Basic), it is now critical to learn Basic
    be able to program Test. For those of you who already know Basic, all you have
    to learn is a few additional commands. The rest of you, like me, have to learn
    the whole language.


    I wish there were a test program for DOS applications. You can, though, test your
    DOS application in a window and use Microsoft Test on it. For most cases, however,
    I think you would be better off writing your own test software than using Microsoft
    Test for a DOS application.


    Test could make life a lot easier for you when you write a Windows application,
    even if you have some automated tools. Test definitely would make it easier to
    adequately test your products. With the advent of Test, there is no excuse for
    not having a full set of automated tests for every product you have under development.
    With the advent of Test, you no longer have any excuse to ship a Windows application
    that has not been fully tested.


    And how did Microsoft test Test? They had test Test testing a program. And what
    was one of the programs they tested Test testing? Why, Test of course. So you
    had Test testing Test testing Test. Now that''s testing recursion.'
