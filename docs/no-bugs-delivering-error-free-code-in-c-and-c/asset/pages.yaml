  md: '# Chapter 8


    # WATCHING THE HEAP


    We now come to the infamous heap. This seems to be the root of the most common
    bugs in c. Even the loose pointer bugs are generally due to pointers that, at
    least in theory, are supposed to be pointing to memory in the heap. Fortunately,
    there are a number of tricks, listed in this chapter, that we can use to make
    the heap virtually bulletproof.


    Most programmers have—usually more than once—created a bug by overwriting the
    heap. Other serious problems include passing a bad value for a malloced pointer,
    using a pointer after it has been free, and leaving memory allocated that is no
    longer needed which will quickly exhaust your heap.


    This chapter will teach you how to watch for overwriting the end (or beginning)
    of allocated memory. The following code runs in two modes. The first, debug mode,
    will use memory allocations to take longer and use more space. The second, for
    final release, adds no overhead to memory allocation—neither time nor space. Use
    the debug mode until you have eliminated any heap problems, and switch to non-debug
    mode.


    # The concepts behind the code


    The code implements four simple concepts.


    +   1. It places special words before and after all malloced memory. If you overwrite
    or underline malloced memory, the value of these special words will change, and
    the next time you check the special words, you will discover the illegal access.


    +   2. It keeps a doubly linked list of the allocations. Every malloc is entered
    into the list, and every free is removed. This list makes it possible to walk
    the linked list at any time to check or dump all malloced memory.'
  merge: -1
  pgno: 82
- img_proc: true
  md: '# 74 No Bugs


    +   3. It stores the location (source module filename and line number) of the
    call that initially malloc or reallocated the heap memory. All of the malloc calls
    that affect the heap (malloc, realloc, free, and so on) pass in the name of the
    file they are called from and the line number in the file. The filename and line
    number are then stored with the allocated memory that allocated. Therefore, when
    a specific malloc entry in the heap is displayed, it is listed with the location
    of the call that created, resized, or freed. This makes it very easy to determine
    where in your code the listed allocated was malloc, reallocated, and freed.


    +   4. In the beginning of every malloc call, the function walks the heap and
    checks for overwritten or corrupted memory. Because these checks are performed
    often, you generally know within 10 or 20 lines of your dynamic memory is overwritten
    or corrupted. This usually makes debugging relatively simple.


    # Some details


    The functions AllocCheck, AllocList, and AllocDone exist only in the debug mode.
    Their use makes no sense in non-debug mode because the debugging information does
    not exist in that mode.


    In non-debug mode I have changed the meaning of some of the functions. Alloc always
    returns 0 initialized memory. If you don''t wish this to happen, be sure the debug
    version fills an alloc with ALL_CHK3. Realloc perform a malloc if you pass a NULL
    pointer. It also incorporates expand and NODISCARD into the same function.


    Because the non-debug code is totally different code, you need to test your program
    with the non-debug code as well as the debug code. In the nondebug code I have
    left the extra 2 bytes on the end of each allocation, although they are initialized
    to 0 instead. This is an attempt to keep problems caused by switching debug and
    non-debug modes to a minimum.


    # Allocate some memory


    Every time memory is malloc from the heap, more than the requested memory is malloc.
    The actual memory malloc has a copy of the ALLOC struct at the beginning, followed
    by the number of bytes requested, followed by two more bytes. The pointer returned
    points to the memory directly


    © Copyright 1992 by David Thiel - All Rights Reserved'
  merge: -1
  pgno: 83
- img_proc: true
  md: 'following the ALLOC struct so that the program doesn''t see the additional
    memory actually malloced from the heap.


    The Alloc struct holds several pieces of information. The pointers pPrevAlloc
    and pNextAlloc insert this allocation into the linked list of allocations. When
    performing an Alloc (equilibent of malloc), the newest element is inserted at
    the end of the linked list, with pPrevAlloc pointing to the previous last element
    and pNextAlloc pointing to the first element (which is actually a fake). When
    performing an AllocFree (equilent of a free), the element is removed from the
    list and the elements before and after the removed element are then to point to
    each other.


    pFileName and iFileLine identify where in the program the allocation was. This
    provides a very useful way to refer to a heap element. On any allocation (Alloc,
    Realloc, Some, or Free), the name and line of the calling function will be placed
    in these vars, giving you the location of the last call for this element. Although
    AllocSize will list the location it was called from if you request the size of
    a bad pointer, it is not placed in the ALLOC struct.


    The uSize holds the size of the allocation, as requested by the calling program,
    not including the extra bytes holding the ALLOC struct and end bytes. This is
    done because there is no standard to get the size of an malloced element, and
    when a library does a call to return the size of an alloc, it is done much slower
    than using an euSize.


    The uuid holds the value ALLOC_ID. If this element does not hold ALLOC_ID, then
    it is assumed that this is not an element in the heap. This stops the debug code
    from going out to link if the heap has been corrupted. When walking the heap,
    if an element does not used properly, the walk stops. When passed a pointer, if
    this element is not ALLOC_ID, then it is assumed that the pointer is bad, and
    the function returns immediately.


    The uChk holds ALLOC_CHK1 and checks for underwrites. This happens when you write
    to the beginning of some malloced memory. Following the struct is the user memory
    followed by another word that holds ALLOC_CHK2. Whenever the heap is walked, the
    words at the beginning and end are checked for overwrites and underwrites. If
    your program writes over these words, the program will continue, but it leaves
    them overwritten.'
