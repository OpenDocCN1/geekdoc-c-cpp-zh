  md: '# Prototyping including CONST


    There is a certain type of bug I used to get a lot. I would spend hours tracking
    it down. And then I would finally find it. I would have done something like pass
    an int int when I was supposed to pass a pointer to an int.


    I did this so often, that as soon as the compilers started doing prototype checking
    (I''m showing my age here), I always prototyped functions. For a very small effort
    you get a large return on your investment.


    C is designed to help you do anything you want. However, it also has the ability
    to use function prototypes and perform very strong type checking. Use prototyping.
    A good C programmer breaks the rules at times—carefully and deliberately.


    All functions should be fully prototyped. This includes whenever possible on the
    prototype for function variables. Also, void * should be used whenever appropriate
    (as in malloc, memcpy and read) when it is legitimate to pass in, or return any
    type of data. However, do not use void * when a function normally accepts only
    one type (such as strcpy).


    # Prototyping examples


    The program example below illustrates the use of proper prototyping:


    ```

    void *malloc (unsigned uLen);

    void *memcpy (void *pdest, void const *pSrc);

    char *strcpy (char *pdest, char const *pSrc);

    ```


    All code should compile at the highest warning level with NO warnings or errors
    produced. With C''s casting capabilities, there is no need for any warnings. First,
    if you see a warning, you know something is wrong (although it might be as simple
    as having forgotten to catch something).


    Second, this will catch a number of errors that otherwise might not be seen for
    some time and that could take days to resolve. Prototyping rarely will show where
    I have made a mistake, but when it does, it generally shows the type of bug that
    normally make itself known till much later, When it is very difficult to track
    down.'
