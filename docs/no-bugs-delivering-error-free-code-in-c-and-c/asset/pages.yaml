  md: 'for a debugger. In addition, Windows makes it very easy to do things such as
    modify memory—you click and type.


    Multiscope is light-years ahead of all other debuggers for one of its features:
    its graphic data display. It gives you the normal capabilities to view your data
    plus, when you click on a structure or pointer, it displays the contents of the
    structure. Even better than that, it has a Graphic Data window.


    The Graphic Data feature will draw pictures of your data. Each structure is drawn
    as a row of boxes. The structure values will be in each box. Each pointer in the
    structure will be identified by name and will have an arrow pointing to its pointee.
    Sometimes a picture is worth a 1000 words, and Multiscope proves that.


    Unfortunately, Multiscope is designed as an application debugger. For debugging
    systems-level programs, you need Soft-Ice or Periscope. But if you are writing
    applications, this is the debugger to use.'
