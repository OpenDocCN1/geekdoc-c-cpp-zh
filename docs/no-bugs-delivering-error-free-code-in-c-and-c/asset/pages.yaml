    point. This call is used by DebugMessageBox when it prints to Window 3.


    I divide the MDA into five windows (0 through 4). Under Windows, 1 use Window
    4 to display the messages sent to my application. Window 3 is for error messages.
    (I prefer to this using MessageBox.) Window 2, due to its small size, displays
    the program''s basic state. Window 1 lists information, and I try to keep this
    to a minimum so that it''s rare that something has scrolled off this screen, due
    to subsequent printfs, while it is pertinent. Window 0 is for all my debug printfs.


    When set up properly, including DebugPrintf at the proper places in your code,
    it''s amazing how valuable this arrangement becomes. When you discover something
    is wrong, you can generally determine what is wrong by looking at the contents
    of the MDA .


