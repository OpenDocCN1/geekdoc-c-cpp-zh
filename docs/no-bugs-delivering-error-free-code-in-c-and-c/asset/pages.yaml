    \ is very\nimportant that a program free up all malloced EMS and XMS memory on\
    \ exit.\nIf it doesn't do this, every time the program is run, it will use up\n\
    additional memory.\n\n# HdlNext\n\nThe program example below illustrates HdlNext."
