  md: 'application and when Windows itself shuts down while your application is active.


    +   1. Call TestAll. This single call should test the integrity of your system.


    +   2. Call the StackUsed function (discussed later). This will tell you the maximum
    amount of stack size used. Every time you exit the program, print out the maximum
