  md: '# 6 No Bugs


    possible. MS-DOS 5 was designed to run on every existing PC system, regardless
    of the system''s hardware and software. It had to run on PCs built before anyone
    was sure what compatibility meant, and it had to run with TSR (Terminate & Stay
    Resident) combinations that were presently running only via luck.


    Thanks to an extensive testing process, MS-DOS 5 was shipped without a single
    significant bug. Microsoft shipped a solid product.


    By setting up, and following, a good testing system, you end up shipping a solid
    product. If you ship a product and have to cross your fingers, you can be pretty
    sure its bugs will come back to haunt you.


    # This book


    This book is designed to teach methods for writing bug-free code. Complete, fully
    functioning code examples would have expanded this book to an unacceptable length,
    so I have included illustrative code fragments. Pieces of full code follow in
    an appendix.


    This book also gives you all the information you need to create your debugging
    code, but it doesn''t provide the actual code. You may order a disk that includes
    complete source code. Ordering information appears at the back of the book.


    # More Tricks


    This book by no way lists all the possible tricks being used. It merely lists
    tricks that I have invented or learned of. If you have some ideas of your own,
    please let me know about them. If I get new items, then I can include them in
    a revised edition of the book. I will, of course, provide full credit to you unless
    you request anonymity.


    © Copyright 1992 by David Thiel - All Rights Reserved'
