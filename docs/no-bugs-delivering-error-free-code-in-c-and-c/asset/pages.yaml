    In many cases you know the maximum length of the buffer. If you are storing the
    string in a global or local array, you know the size of the array. If you allocated
    a buffer, you can get the size of the allocate buffer. Use the following rules
    for the length of the buffer.


    +   - If the length is the size of the buffer – the longest string is 1 byte shorter.

    - If the length is -1, it''s a malloced pointer, and you ask the heap manager
    for the length of the buffer.

    - If the length is 0, you don''t know the maximum length and don''t test for it.


    If you know the size of the buffer, you can fill the unused space after the termination
    \0 with the fill byte (normally 0FE). Then, if the termination \0 is overwritten
    or you skip it in your logic, you will be reading very abnormal characters. To
    assert this however, you must also initialize all strings this way.


    Again, this gives us a powerful tool to verify a string. Although it will not
    differentiate between the right and wrong string, it will differentiate between
    a pointer to a string and a pointer to most data structures.


    # Assert a structure


    For structures our assert falls into two parts. The first part is to determine
    if we are pointing at a structure. To check this, if DEBUG is defined, we place
    an unsigned int (i name uID) as the last element of every struct of importance.


    Then, whenever you have initialized the struct, set uID to a specific ID value
    (a different value for each struct). When you are finished with the structure,
    set uID to a specific done value (this can be the same for all of the structs).
    In C++ this is trivial, set uID to the struct specific ID value in the constructor
    and set it to the "done" value in the destructor.


    If you want to get real fancy, you can also put a 32-bit ID at the beginning of
    each structure. For its ID, use a value that will be the ASCII values for a 4-byte
    abbreviation of the structure (Window = "Win "). That way, you db p a pointer
    in your debugger, know what type of structure it was set up as.'
