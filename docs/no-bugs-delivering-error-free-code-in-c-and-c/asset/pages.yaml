  md: "# 70 No Bugs\n\nKeep a record of the maximum amount used over time. Add 512\
    \ bytes to the maximum used and you have the optimum stack size for your program.\
    \ Keep in mind that debugging code might increase the stack requirements, so do\
    \ your final tuning with the other debug code not compiled.\n\nUninitialized local\
    \ variables are another major stack-related problem. They can be very difficult\
    \ to find. In many cases, you won't see the problem except in special circumstances.\
