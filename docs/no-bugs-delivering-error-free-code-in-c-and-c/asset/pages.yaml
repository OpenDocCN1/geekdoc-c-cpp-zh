  md: 'BugLev is an array of bitmaps. For each BugType value, there is a separate
    BugLev bitmap determining what debugging to turn on. The values in the bitmap
    are the same for each BugLev. If bit 0 means turn on on parameter checking, then
    that should work regardless of BugType value.


    To determine whether you should perform a debug check, you use the value of BugType
    for your function, index BugLev with BugType, and check the value of BugType against
    the bit that signifies the check should be performed.


    # bugcheck.h


    The program example below illustrates the use of BugType and BugLev.


    ```

    extern byte BugLev[MAX_BUG_TYP];

    #define BUG_LEV_FATAL 0x01

    #define BUG_LEV_ERROR 0x02

    #define BUG_LEV_INIT 0x04

    #define BUG_LEV_UNUSUAL 0x08

    #define BUG_LEV_BASIC 0x10

    #define BUG_LEV_MODERATE 0x20

    #define BUG_LEV_VERBOSE 0x40

    #define BUG_LEV_MISC 0x80

    #define IfDebug(BugType, Lev) (BugLev[BugType] & Lev)

    ```


    You would normally initialize BugLev to 0x03 or 0x0F for each section of your
    program. However, you could then turn various checking on or off. The macro IfDebug
    TRUE if you should perform debug checking for a given value of BugType and a given
    BUG_LEV* bit.


    You should almost never remove a DebugPrintf or other debug checking, instead,
    you should set the initial value of BugLev for that BugType so that unneeded debug
    checking and printfs are not executed. You never know when you might need a specific
    check or printf again.


    Also, be sure you include any code inside #if DEBUG > 0 so that the code doesn''t
    exist if debug are turned off.


