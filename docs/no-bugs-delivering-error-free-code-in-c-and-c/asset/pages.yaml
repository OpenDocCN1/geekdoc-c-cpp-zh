- img_proc: true
  md: '# 3 No Bugs


    This was in the early days of the PC and I didn''t have all the ideas laid out
    in this book to use writing the program. There were some bugs in how we were handling
    the file format. I knew that much but I couldn''t seem to find that bugs - at
    least all.


    Finally, in desperation, I put code in to check the consistency of the file and
    to correct it when it found problems. As time went on, I found additional bugs
    in my regular code, which I fixed and added to the consistency checks and error
    correction.


    While I kept reducing the bug occurrences, I couldn''t eliminate them. Finally,
    to make testing easier, I ripped out the consistency checks and error correction
    to track down the bugs - and the bugs went away. I had apparently fixed the original
    bugs but bugs in my bug-fix code had introduced new bugs in the meantime.


    There is one company where they preferred to not test the product because bugs
    were reported and they would have to fix them. Of course, when the users reported
    the bugs they had to fix anyway.


    At another company, management would schedule when all bugs were going to be fixed
    and on that day, by definition there were no remaining bugs. Of course, there
    were lots of immediate feature enhancements that users requested that were implemented
    shortly after shipping.


    # Who this book is for


    Most developers know that software is inherently buggy. And most developers also,
    hopefully, want to eliminate these bugs before shipping a product. This book is
    written for these people.


    However, writing code with no major bugs (sorry, we haven''t yet reached the point
    of truely bug-free code), is a team effort. It takes the work of more than just
    the developers. It takes testers, managers, support persone, and many more. And
    this book is aimed at these people too.'
  merge: -1
