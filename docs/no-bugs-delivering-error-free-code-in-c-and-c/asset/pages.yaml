    # ENTER / EXIT logging


    A sometimes useful practice is to log the functions you call. This logging is
    written to a debug terminal and/or to a debug file. Essentially, it gives you
    a running list of what function you are in and where you were called from.


    It can also be used by a debugger to track your call stack. This allows the debugger
    to list,by function name, the calls you made (beginning with main) to get your
    present location.


    The most common method is to make an ENTER macro the first line of every function
    and an EXIT macro return. The ENTER macro prints that the program is entering
    the function. The EXIT macro prints that the program is leaving the function and
    returns from the function.


    You will see the use of __FILE__ and __LINE__ below. These are constants defined
    by the compiler. __FILE__ is the file being compiled and __LINE__ is the line
    of the file being compiled. Using these constants can give you the source location
    of a debug printf.


