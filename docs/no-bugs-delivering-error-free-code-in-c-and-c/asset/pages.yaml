    # Windows Dr. Watson


    The program drwatson.exe included with each copy of Windows also deserves seperate
    mention. Those of you who were in the Windows 3.1 beta test have almost certainly
    seen Dr. Watson in action. When Windows gets a GP fault or protection violation,
    Dr. Watson prompts the user for a short statement as to what went wrong.


    Dr. Watson then writes a log file with all pertinent information about the system,
    including the instruction in the application that caused the error. In many cases,
    this log would point you directly to the bug.


    If a user reports a bug in your program that causes Windows 3.1 to close the program,
    have them repeat the error with drwatson.exe running. Then'
  merge: -1
