  md: "# How to use the memory\n\nThe following practices will not solve all of your\
    \ heap problems, but they will take you a long way in that direction. The beauty\
    \ of this system is that once you start using it, it stays pretty invisible until\
    \ you make a mistake. When you make a mistake in handling your heap, it will usually\
    \ tell you exactly where to look for the bug.\n\n# Be sure freed\n\nAllocDone\
    \ should be called at the end of your program. This is a final check to ensure\
    \ the heap is not corrupted and that you have freed up all allocations. Although\
    \ it's okay to not free a pointer that must remain malloced for the entire life\
    \ of the program, you should be sure that all pointers that are used for periods\
    \ shorter than the life of the program were freed.\n\nI free all pointers that\
    \ exist for the life of the program before calling AllocDone. That way, if I see\
    \ any elements left in the heap, I know that I forgot to free a pointer somewhere.\n\
    \n# AllocDone\n\nThe program example below illustrates the use of AllocDone.\n\
    \n```\nFLAG _AllocDone ()\n{\nif (_AllocHeap.pNextAlloc == NULL)\n{\n    Printf(\"\
    NO remaining Allocs\\n\");\n    return (false);\n}\n\nDebugPrintf(\"Remaining\
    \ Allocs:\\n\");\nif (_AllocWalkHeap(true))\n    DebugPrintf(\"ERROR: Alloc Heap\
    \ Corrupted\\n\");\n    return (true);\n}\n```"
