  md: '# Debugging in conditional defines


    To maintain speed, most times you will not want all of your conditional error
    checking to be compiled. Some of the error checking can take an extremely long
    time. (Generally, a specific check does not take a lot of time; rather, the check
    is called often).


    The other general reason is if you are printing debug information to a terminal
    or second monitor, and you don''t want useful information to be scrolled off the
    screen by any other information you have no interest in. Sometimes, the pure volume
    of printing can slow down the program because a monitor can write to the screen
    only at a certain pace, and no faster.


    You can take either of two primary approaches to this problem. The first is to
    not compile the extra debug code fact out not exist, but you will have to recompile
    if you decide you need some of the debugging prints back. The program example
    below illustrates the use of conditional compiling.


    # Using the value of DEBUG


    ```

    #ifdef DEBUG

    fast_test ();

    #endif

    #if (DEBUG > 1)

    slow_test ();

    #endif

    #if (DEBUG > 2)

    real_slow_test ();

    #endif

    ```


    The second approach is to test a flag at the beginning of the debug code and skip
    it if the test fails. If the flag is a variable, you can change its value in your
    debugger, making it easy to turn the debug testing/printfs on part way through
    the program (or turn off after you no longer need them).


    # Using the variable


    The program example below illustrates the use of a debug variable.'
  merge: -1
  pgno: 33
- img_proc: true
  md: "```\n#ifdef DEBUG\nfast_test();\nif (DebugVar > 1)\n    slow_test();\nif (DebugVar\
    \ > 2)\n    real_slow_test();\n#endif\n```\n\nAlthough there are a lot of fancy\
    \ ways to implement this conditional debug code, two rules seem to hold. First,\
    \ you generally don't ever want to turn debugging on or off after a compile. Second,\
    \ both ways of implementing this seems to be equally fast to code and execute.\n\
    \nFor simple code, debugging is generally an on/off proposition. In these cases,\
    \ using #ifdef alone is generally sufficient, and anything more is a waste of\
    \ time. For code that is otherwise simple but has a couple of time-consuming checks,\
    \ you can use the value for which DEBUG is defined as conditional compiles.\n\n\
    Keep in mind with conditional debugging that some debug tests are matched. If\
    \ your allocate conditionally sets the signature bytes before and after each region\
    \ of allocated memory, it better do it if any of the conditional defines that\
    \ check the heap for the signature bytes are executed. I once spent several hours\
    \ trying to determine why some buffers were failing their CRC tests - the reason\
    \ was the CRC creation code had ifdefed out while the checking hadn't.\n\n# Comment\
    \ your open Issues\n\nAs you, issues or questions come up in certain pieces of\
    \ the code: Will a function work on a Super VGA monitor? How do you handle data\
    \ files with a particular error? Do you need to watch out for a certain condition?\n\
    \nThese questions are not resolved by Traps and IntTests. Rather, they are items\
    \ that you believe have not fully coded for or, in some cases, you have not coded\
    \ for all. In other cases, your program will fail under conditions in which you\
    \ need it to continue running.\n\nThese are possible logic errors that occurred\
    \ to you one time or another. Unfortunately, the human mind being what it is,\
    \ these errors will be quickly forgotten (until the bug comes in). These MFUs\
    \ are classified as \"oh shit\""
