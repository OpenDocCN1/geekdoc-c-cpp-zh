  md: '# Chapter 2


    # WHAT IS A BUG?


    This is the most important chapter in the entire book. The very simple question,
    What is a bug, actually has a very complicated answer. This chapter is devoted
    to answering that question. Because, until we know what a bug is, we don''t have
    a chance of minimizing them.


    A developer I know once said, "Bugs should not be called bugs, they should be
    called **Massive Fuck-Ups [MFUs]**." "Bug" connotes that some outside agency decided
    to infuse your program with bugs and that if you live a clean life, sacrifice
    small furry animals at the foot of your computer, they will go away.


    MFUs exist because programs are written by people, and people make mistakes. The
    only way to eliminate MFUs is to go into your code, find the bugs, and fix them.


    This is the most critical concept to understand (and the one most often blown
    off). You will write MFUs. You will sit down and with complete malice of forethought
    put MFUs in your code. Think about it - you know that you are the one putting
    the bugs in there. So if you sit down to code, you will be inserting some bugs.


    And somebody needs to find them so they can remove them. No amount of designing,
    prototyping, CASE, reviewing, management, and so on, will avoid this.


    This concept is important because it colors your approach to debugging your code.
    If you view mistakes as "bugs," you hope none are found. (You hope the good fairy
    came by sprinkled pixie dust, and the bugs left.) If you view the mistakes as
    MFUs, you know them unquestionably exist, and you hope to find all of them so
    that they can be fixed.'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'It is critical developers and managers feel good, not bad, if MFUs are discovered.
    They should worry if they don''t find any. Rather than assuming your program works
    and waiting for someone to prove otherwise, a developer should assume it doesn''t
    work and search desperately for the bug that will make it fail.


    So, for the moment, you have to accept that you will create MFUs in your code
    (I manage to sneak a lot in my code). I do not know any way to avoid that. The
    trick becomes to find and correct them as painlessly as possible.


    As a side note, the term "bug" is so firmly established in the lexicon of developers
    that I see no way MFU will replace it. However, I think it is important that you
    occasionally refer to bugs as MFUs to remind people that bugs are "intentionally"
    placed in the code due to a developer''s mistake.


    When developers insist that bugs are not MFUs, you should worry. Why? Because
    they have abdicated responsibility for ferriting them out and fixing them. This
    is when its critical to remind them when they are told there is an MFU in their
    code its much harder to avoid responsibility when they are told there is an MFU
    than when they are told a bug in their code.


    So what is a bug? Well, if you run the program and it formats your disk (assuming
    you are not writing a format program), most people will agree that a bug did it.
    From this point on, opinions start to differ. I hear statements like "No one uses
    that feature so it''s ok that it will crash the hard disk"; Just tell them to
    buy a parallel port printer"; "They can carry over the result so its okay that
    it doesn''t add correctly", and "That''s not a bug, that''s a feature!" The same
    people who find this type acceptable in the programs they write turn around and
    categorize bad in a program they bought as a bug.


    By my definition, if a reasonable person would expect certain functionality, for
    a program to work in a certain manner, and it doesn''t—there is a bug.


    # Where bugs come from


    How do bugs get into a program? Very simply: You put them there. With reckless
    disregard, you sit down and type some bug code into your program. It does not
    sneak in its own. You might mistake a line. You might use a wrong variable. You
    might copy over some code from elsewhere that doesn''t quite work. In any case,
    it is YOU YOU YOU.'
  merge: -1
