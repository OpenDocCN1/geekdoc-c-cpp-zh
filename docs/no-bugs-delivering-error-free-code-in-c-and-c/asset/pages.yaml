  md: '# 10 No Bugs


    Every time you code, you insert bugs. This is one of the dirty little secrets
    of programming. Programmers write code and create bugs every day. Good coders
    are generally really good at creating bugs. That way our employers have to keep
    us around to fix all of the bugs later (COBOL programmers learned this years ago).


    # Tricks of the trade


    This book does not contain any tips on how to stop creating bugs. It does contain
    tips on how to make bugs more obvious. A bug that always crashes the program is
    preferable to one that crashes only one system; the one located in Siberia. If
    it always crashes the system, you will fix it immediately. (and possibly with
    no return ticket).


    A bug that causes a message to pop up, stating that a problem exists, is preferable
    a system crash. It might not fix the bug for you, but at least it tells you exactly
    what is wrong. The trick is to catch a bug as soon as something goes wrong, not
    to later discover the problems it has caused.


    Every C programmer has undoubtedly had to track down a lower pointer bug where
    a pointer writes over memory that doesn''t belong to it. Later in the program,
    you will find the bug when you use the memory lower pointer corrupted. You then
    have to work backwards to see who wrote the data. Wouldn''t it be much nicer to
    have a pop-up notify you when the pointer first writes over the data, informing
    you immediately that you have a bad pointer?


    The next chapters contain a number of practices that I have developed over the
    years to help me debug my code. The important thing about these practices is that
    you implement them while you write the code. They help you weed out bugs much
    earlier and as part of the development process rather than after the product is
    turned over to testers (or even worse, users).


    These practices will reveal bugs that might otherwise be hard to find, making
    development faster and easier. They also find bugs that developers normally spend
    hours or days trying to fix during initial development.


    This book assumes that you will have all bugs in your programs. It is an attempt
    to minimize the number of bugs that are initially written into code, making it


