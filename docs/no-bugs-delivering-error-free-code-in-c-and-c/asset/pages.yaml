  md: '# 5 No Bugs


    Eliminating bugs breaks down into three steps:


    +   1) Putting the bug in the code (yes, you put it there)

    2) Finding the bug

    3) Fixing it


    This book is entitled No Bugs because it attempts to minimize the first step,
    putting a bug in the program. By reducing the number of bugs in code as you write
    it, you can drastically shorten the amount of time necessary to complete and test
    the program. Most of the tricks presented in this book do not actually stop you
    from writing buggy code. In other words, you will still make the same mistakes
    you made before. But your program will wave a red flag upon discovering your errors
    will allow you to fix them quickly and painlessly


    Most of the tricks are quick and unobtrusive. Everyone knows writing bug-free
    code is critical, but most developers are loath to spend time eliminating bugs
    when they are working on a tight schedule (with managers breathing down their
    necks), or more interesting code-writing awaiting them. These tricks are designed
    so that a developer in a hurry will use them. With a few hours of practice, you
    can implement most of the enclosed code samples, and you won''t really see any
    of this new code until you find a bug.


    # Testing


    An important, and most ignored, part of the code-writing process is testing. Every
    software program, no matter how simple, has bugs in it. Every testing process,
    no matter how thorough, lets some slip through. However, the final determiner
    of a program''s relative "bug-freeness is the testing process it is put through.


    Chapter 12 of this book discusses testing. The PC industry has matured greatly
    over the past several years. Users now expect their software to be bug free and
    to work as expected. What would have been consider rock-solid several years ago
    is now considered bug-ridden as to be worthless. And a worthless product is not
    purchased.


    A good testing strategy can help you deliver a rock-solid product under almost
    impossible circumstances. The MS-DOS® version 5.0 operating system offers an impressive
    example of what a thorough, intensive testing strategy makes'
  merge: -1
