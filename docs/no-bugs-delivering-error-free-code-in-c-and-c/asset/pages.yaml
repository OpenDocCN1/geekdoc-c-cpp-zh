    The rest is all straightforward. When freeing an EMS handle, remove it from the
    Hdl linked list. Then fill it with FILL_CHAR before freeing the EMS memory. When
    reallocating a hdl, if it expands, fill the new pages with FILL_CHAR. When your
    program ends, walk the linked list to identify any memory that was not freed.


    A cautionary note: Lot of the EMS drivers, mainly hardware-based ones, have bugs
    in them (their developers must not have read this book). What''s worse, these
    bugs usually crop up only in specific cases (for example, copying 16K plus 2 bytes
    that exactly crosses three pages). Although copy seems to be the function that
    has the most problems, it''s not the only one. If you are chasing a bug memory
    that only happens on one system, it might not be your fault.


    # Extended memory (XMS)


    The only way to access extended memory is as described in the XMS specification.
    There is no excuse for doing it any other way anymore, and you will trip over
    other programs if you use another method such as int15. Using another method is
    a very good way to guarantee bugs, in which case you will have systems where your
    program and another program use the same extended memory.


    On all copies to from XMS, verify that the number of bytes passed to copy is even.
    This is a requirement of the XMS specification. However, it is enforced on some
    XMS handlers and not on others. Passing in an odd number of bytes will lead to
    errors on some systems.


    If you lock XMS memory, be sure you track locks. Locks can cause XMS memory to
    become fragmented, which can make it a lot less usable. On an XMS free, you should
    pop up a box if the memory is still locked. You should also list it if it is locked
    when unfreeded memory at the end of your program.'
