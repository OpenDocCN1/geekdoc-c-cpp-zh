  md: '# No Bugs


    bugs - based on the phrase usually heard when the bug is first reported to the
    developer responsible.


    The place to write down these concerns is in the code itself. Anywhere else and
    the place it is written can get lost. If in the code - its forever, or until you
    resolve the question.


    In these cases, place a one-line comment, the word "bugbug" followed by your initials
    and the date. You can follow this with a comment that runs for several lines,
    but the first line should give a reasonable description.


    # BUGBUG


    The program example below illustrates the use of the BUGBUG comment.


    ```

    // BUGBUG DNT 32/1/92 - No memory. Should we go to disk?

    // At the moment if we run out of memory we fail. However,

    // if this runs on large files, running out of memory could be

    // common.

    ```


    This BUGBUG accomplishes three things.


    +   By performing a grep or text search for BUGBUG on all the files, you get all
    the title lines of open issues. (Note: in the asm chapter, a way is shown to have
    the BUGUGS print to the screen during a compile. Unfortunately c doesn''t support
    printing during a compile in a manner that makes this possible.)


    +   The open issues travel with the code. You can''t lose the list of open items
    (unless you lose the code too).


    +   The open items are right there at the relevant spot in the code—you don''t
    need to search all the files to find the correct spot.


    When you ship a product, you should not have any BUGUGS in your code. In the above
    example, you might have decided to go to disk. You might also have decided you
    could limit yourself to memory. In either case, the question was resolved.


    If you don''t use BUGBUG, you might forget or lose important issues. You might
    not remember the issue until users report the bug after the program'
  merge: -1
  pgno: 35
- img_proc: true
  md: 'ships. Using BUGBUG is simple, and it''s more time-efficient than recording
    the information elsewhere.


    # Keep it unobtrusive


    Keep your debugging as unobtrusive as possible. The rest of your program should
    hardly be affected by debug code. (The program might run a tad slower, and the
    user might see a pop-up debug message.) Good debug checking stays hidden and out
    of the way until it finds a MFU.'
