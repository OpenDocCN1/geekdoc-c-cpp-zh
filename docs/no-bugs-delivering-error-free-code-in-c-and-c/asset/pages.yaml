    Windows, your DOS application might be incompatible with another application that
    is running in another DOS box at the same time.


    Be sure you test with various operating system environments. In the case of DOS,
    you should test with DOS both low and high. Test your program loaded both low
    and high (a UMB). You should also test your program in a Windows DOS box – which
    will catch all illegal memory accesses.


    If your product is network aware and runs on several networks, it is critical
    that you test it on several networks. Testing a network program on only one network
    is a good way to insure it will blow up on every other network out there. Use
    at least three radically different networks. If you talk to different network
    APIs depending on the network, test at least two different networks with each
    API.


    If you are writing a Windows application, be sure it works in both 286 and 386
    mode. In each case, Windows is significantly different. And if your program can
    run in real mode, then test it in real mode. If it''s not important to test it
    in real mode, then you are doing your customers no favor by allowing it to be
    in real mode.


    As object linking and embedding (OLE) becomes more prevalent in Windows applications,
    compatibility with other applications will become more important. You will start
    to see bugs where your program blows up only when it has an OLE connection to
    application B, and application B starts a dynamic data exchange (DDE) connection
    with application C.


    If you are writing a DOS application, be sure it runs on DOS and under Windows
    (286 and 386 modes). Furthermore, even if it is not network aware, be sure it
