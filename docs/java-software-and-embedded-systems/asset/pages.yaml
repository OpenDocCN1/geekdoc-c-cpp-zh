    At the moment, the platform is supporting the development of the ALANIS (Autonomous
    Navigator for Intelligent Sensing) USV! for surface and underwater monitoring.
    Moreover, the integration with generic field buses and image acquisition systems
    is being carried out.


    After an introduction representing summary of related research in the field and
    a discussion of the platform requirements, the key points of the followed methodology
    for making GNU/Linux real-time will be presented. Finally, two applications, a
    research and an industrial one, pointing out the real-time structures that the
    platform is required to implement, will be described.


    # # Introduction


    In the last years, the impressive growth of computer computational power and of
    the flash memory cards capacity, which has dramatically increased the space available
    for embedded operating systems, has made GNU/Linux, in spite of its historical
    development as an operating system for the desktop/server environment, an attractive
    choice in the field of embedded OS [1] with respect to open proprietary real-time
    OSs. As a matter of fact, thanks to its basics of reliability, scalability, portability,
    open source specifications and standards, support and large programmer base, and
    free of charge availability [2], GNU/Linux provides rapid development with a reduced
    time to market. Its main limitation is that, being Linux a Unix-like kernel designed
    to guarantee a fair sharing of resources among many users and applications, it
    does not satisfy real-time performance requirements, which are fundamental in
    the embedded operating system world. In order to obtain real-time capabilities,
    two different approaches can be followed:


    +   introducing a new software layer (essentially a real-time kernel called micro/nano
    kernel) between Linux, which runs as a low priority process of the real-time kernel,
    and the hardware, proposed by RTLinux, RTAI and most recently by AEOS;


    +   2. applying a set of patches to a standard Linux kernel to make it a real-time
    one, initially proposed by the KURT kernel and TypeSys Linux, and then by R. M.
    Morton and I. Molnar (low-latency patch), and be become a standard configuration
    option (CONFIG_PREEMPT) for Linux starting from 2.5.4-preempt.


