    mode). The information about the SOR Information Agent (SFA) detailed in this
    section is related to the initial configuration of the node and the management
    of the system invocation mode.


    The client application does not need an initial configuration to be perfectly
    integrated (IP and port number of the Residential Gateway). The system will get
    this information dynamically with a poll which chooses between every received
    answer. Nodes will answer affirmatively (if appropriate) with the address of the
    web service, besides additional information. It will help the client to invoke
    the searching and invocation meta-service. In no messages are received, it will
    stay listening and making periodic polls, contacting the system administrator
    at last if necessary.


    # 4.3.2. Sor Internal Agent


    The Internal Agent (STA) is the agent in charge of the communication between elements
    at the same level (such as D-SOR nodes) or at different levels (such as ACSs or'
