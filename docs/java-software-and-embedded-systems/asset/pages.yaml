    # 5. Conclusions


    Figure 5 presents existing mechanisms for enforcing security in Java systems.


    ![](img/c669dc86947c1e394b7ee25b3acc20f3_179_0.png)


    Figure 5. Existing mechanisms for Java systems


    Protection mechanisms for Java are of three types: transparent mechanisms which
    have no impact on the development process, constraint-based mechanisms which enforce
    specific properties of programs developed according to the standards, and mechanisms
    that require the insertion of additional code. Additional code can be independent
    of the semantic of the application or depend on it.


    Those mechanisms are enforced throughout the life-cycle of applications: during
    development, at load time, or at runtime. Security mechanisms that are enforced
    at runtime can be driven by the virtual machine or by the application itself.


