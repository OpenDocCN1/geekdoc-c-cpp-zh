  md: '# Tunable Algorithms


    The described optimization techniques can be used mainly to calibrate automotive
    estimation algorithms. These algorithms are, as a first step, validated through
    specific sensor measurement by means of test instrumentation, not present in commercial
    automotive engines.


    The algorithms have to be memory-less like, e.g., the torque estimation algorithm.
    It is difficult to use the above mentioned optimization techniques for dynamic
    algorithms, like gas temperature estimation; for these dynamics, only the stationary
    part is calibrated using multi map optimization, while the dynamic part has to
    be calibrated in a different way.


    It is furthermore impossible to calibrate algorithms which require the control
    of a non simulated, e.g., the mixture for the fuel of wall wetting compensation
    strategy, while the wall wetting is the fuel quantity lying manifold walls next
    to the injector that will contribute to combustion process in runtime. In this
    case, the verification tools presented below can anyway help the calibration process.


    # Performance Measurement


    The optimized maps are usually evaluated by computing the mean square error, denoted
    hereafter with σ, of the predicted values related to the experimental ones: the
    lower the error, the better representation of the experimental points given by
    the maps. The statistic, multiplied by 3, is a good estimation of the experimental
    data variation range around the surface described by the map. To be more precise,
    the experimental data in the described range with a probability of 99.97% in the
    hypothesis of normal error distribution.


    For similar applications, the percentage mean square error is more interesting.
    It is obtained by dividing the square error of the experimental one and multiplying
    it by 10. In this way the statistic is more correlated with the final performance;
    e.g., in the air charge estimation, the percentage mean square error is correlated
    with the error on the mixture tincture actuation.


    The error of an estimation algorithm can be divided into two parts: model error
    and measurement error. The model error is caused by the utilization of a model
    which is not complex enough to describe the examined phenomenon. It can be reduced
    by using a different model equation, increasing the number or changing the breakpoints
    of a map.


    The measurement error is due to the limited precision of the data acquisition
    and elaboration instruments. An experimental data measured with a value that is
    far from the regression model, generally denoted as an outlier, has to be, eliminated
    and, if possible, measured again, to enhance the model precision. As a result,
    the optimized maps are then more robust against measurement errors than the ones
    manually measured at each specific breakpoint. This statement, based on the Chebyshev
    inequality, justifies the improvement in the calibration quality achieved by using
    multivariable regression models, which are more robust against measurement errors
    than those based on a single variable. By forcing the continuity on the dependant
    variables in more dimensions, the resulting model depend on more experimental
    points, reducing the probability of interpreting a measurement error as a phenomenon.'
