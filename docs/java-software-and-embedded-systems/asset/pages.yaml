    # Abstract


    Java is heavily used in a variety of research applications, due to its ease of
    use, maintainability, and portability. In this chapter, the use of Java in robotics
    and artificial intelligence is discussed, accompanied by examples of Java-based
    research in these areas. We have developed software architectures for robotics
    and artificial intelligence using Java, specifically for two autonomous polar
    robots, which were deployed in Greenland and Antarctica to support radar sensing
    missions. Environments require both reliable and robust software to minimize failures
    during autonomous operation. Also, a team of low-cost exploration and mapping
    robots has been built, utilizing Sun Spots as the means of wireless robot communication
    and coordination, and a custom inertial measurement unit (IMU) for keeping track
    of robot pose. As part of this development, Java was additionally used to implement
    a portion of the Joint Architecture for Unmanned Systems (JAUS) communication
    protocol. Currently, researching collaborative multi-agent machine learning is
    being performed with the Java-based WEKA machine learning suite and additional
    Java wrapper software. These applications illustrate that Java has a wide range
    of research applications in the fields of robotics and artificial intelligence.


    # 1. Introduction


    Since its inception in 1995, Java has seen a substantial growth in application
    development and in research. This has primarily been the result of the language''s
    evolution over time, including its modernization through updated language features
    and development environments.


