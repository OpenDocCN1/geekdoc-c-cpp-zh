    centralized station and sorting through it for desired information, intelligent
    mobile agents can take the required processing algorithm to select individual
    embedded devices.


    The rest of this chapter is organized as follows. Section 2, discusses the programmability
    of embedded systems and introduces Ch, a C/C++ interpreter, as the scripting platform
    of choice for embedded systems. Section 3 discusses the Web-based interface and
    remote control of embedded systems and introduces the use of Ch CGI toolkit for
    dynamic Web content generation. Section 4. introduces the use of mobile agents
    for the distributed control of multiple networked embedded systems. Conclusions
    are drawn in Section 5..


    # 2. Embedded Script Computing


    To make diverse collections of embedded resources work together and dynamically
    respond to unforeseen events, an integration-programming environment is needed.
    Since the characteristics of this integration programming environment is different
    from traditional programming tasks, the compilation-based programming languages
    such as C and C++ are poorly suited for integration tasks [28]. Because of intermediate
    byte code, even with just-in-time compilation, Java is also not suited for integration
    application. The main problem with system programming languages is inflexibility,
    which stems from their compilation. Compilation freezes the functionality of an
    application at the time it is compiled, making it difficult to modify or extend
    the behavior of the application in the field. As a result, system-programming
    languages cannot accommodate the variety and rapid evolution that are typical
    in integration applications. In contrast, scripting languages are designed for
    “gluing” applications [23]. There are many scripting languages, such as T/Tk,
    Perl, Python, PHP, and Ruby, have been developed for various applications. An
    embedded interpreter based programming provides a superb platform for the integration
    applications. The interpreted nature makes it easy to modify and extend applications
    on the fly and evolve rapidly. However, this flexibility comes with a cost. Since
    most applications, especially system level and real-time measurement/control systems
    are written in system languages, such as C and C++, using a scripting language
    to integrate different application modules needs to create an interface to connect
    to these modules. The interface between binary space and scripting space is both
    expensive and inconvenient. For example, due to different data types, to convert
    an array in C/C++ into a Python object and pass back to the Python script. It
    comes with a call of callback “baggage” that often closes the developer’s mind.
    To export binary C/C++ functions to a scripting language, SWIG [4] can be used
    to facilitate connecting programs written in C and C with scripting languages.
    It works by taking the declarations found in C/C++ header files and using them
    to generate the wrapper that scripting languages need to access the underlying
    C/C++ code. However, SWIG cannot be used for embedded scripting. For cross-system
    environment that can seamlessly integrate binary and scripting spaces using the
    same language will be most desirable. The following sections introduce Ch as an
    embedded-programming environment and provides examples of Ch under different embedded
    computers.


