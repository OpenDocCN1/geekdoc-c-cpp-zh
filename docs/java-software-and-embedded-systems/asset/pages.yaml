  md: '# Security for Java Platforms


    # 4.1. Platform Extensions


    Platform extensions aim at isolating applications and making them accountable
    for the resource they consume.


    **Isolates** the goal of isolates is to run independent programs in the same Java
    runtime environment while preventing interactions between them [16]. The execution
    in an isolate should not be different than the execution in a dedicated VM from
    the point of view of the program. Isolates are specified in the Sun JSR 121 [35]
    and detailed in [7]. The reference implementation is provided in the Sun Barcelona
    project⁵ and following and is known as the Multi-tasking Virtual Machine (MVM)
    [31]. It is available for Solaris os.


    Each isolate executes a task, i.e. an application in a dedicated thread. This
    enforces strong isolation with others so as to overcome the limitations of class
    loaders in particular: an isolate has its own system variables, to prevent any
    interference (the example of the `System.out` variable); it has its own set of
    `Strings`, i.e. immutable string values. Consequently, the communication can be
    be performed through IPCs or networking techniques, which prevents the realization
    of efficient multi-task applications with this technique.


    The benefits of isolates are manifold [7]. First multi-programmed and multi-application
    environments become platform-neutral which enhances the testability and the management
    of systems. Scalability is improved. The next security is improved through the
    combination of OS security such as process isolation and isolation of data shared
    between applications and VM security which provides a protection against direct
    access to OS resources. Moreover, access to operating systems is no longer required
    to manage multiapplication systems. Lastly resource management is made possible
    because each application is executed independently from others if this is not
    part of the Isolate specification.


    Though these important gains are in support of multi-task environments, Isolates
    and the MVM are so far only used in a limited manner. This is due to their lack
    of convenience for production environments and the lack of transparency of the
    programming model [7, 25]. Isolates are inappropriate for a matter of widespread
    Java environments with such restricted resources, with no address isolation between
    processes or with no thread. Moreover, they provide no centralized management
    of the Java entities in the system and are very inefficient in term of resource
    consumption especially at the instantiation of a new task, since all execution
    and mechanisms are duplicated.


    **Sun Resource Management Interface** (RM interface) is specified by Sun JSR 284⁶.
    It is an extension of the isolate concept. The RM interface enables to monitor
    and monitor any resource type and in to track the resource consumption for each
    isolate. It is an follow up of the JREs (Java Resources) prototype [18]. Its goal
    is to ensure a trusted pair of the Java system be informed of thread creation,
    to state an upper limit to the resources that


