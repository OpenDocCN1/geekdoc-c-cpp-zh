    # 4.1. Mobile-C Library


    Mobile-C [9, 20, 10] was originally developed as a standalone, FIPA compliant
    mobile agent system with a primary intention of fitting into applications with
    networked mechanisms and embedded systems involving low-level hardware. Since
    most of these systems are written in C/C++, Mobile-C chooses C++ as the agent
    language for easy interfacing with low-level controls and the underlying hardware.
    In addition, Mobile-C used embedded Ch to support the execution of C/C++ mobile
    agents. For integrating Mobile-C with applications, a Mobile-C API [14] was developed
    that allows Mobile-C to be embedded into applications to support C/C++ mobile
    agents. In addition, the Mobile-C API facilitates the development of a multi-agent
    system that can easily interface with a variety of devices.


    Since the agent engine of Mobile-C is based on Ch, code can readily be used as
    Mobile-C agent code. The mobile agent code is wrapped into a mobile agent message
    with a FIPA agent communication language in XML. The XML mobile agent message
    contains encapsulated agent data along with the agent C code. The encapsulated
    agent data includes agent states, an itinerary, and tasks.


