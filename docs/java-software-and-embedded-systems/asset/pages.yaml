    # 4.3. Behavior Injection


    Behavior injection consists of modifying the code to be executed to enable the
    enforcement of security policies in the application, runtime. It can be performed
    in two manners: transparently or through weable code. In both cases, it is independent
    of the semantic of the monitored methods.


    # Bytecode Injection enables to monitor and control the usage of resources as
    well as limit functionality [9]. It is performed through insertion of Bytecode
    in existing classes and is usually performed with Bytecode manipulation libraries
    as ASM¹² or BCEL¹³. Two main techniques are used: class modification, u.subclass
    non-final classes and method control over object of classes. It provides for protection
    against denial-of-service attacks through excessive resource consumption or against
    the use of sensitive functions such as networking. The authors present two example
    implementations for Java Applets and for Jenni pois, i.e code that is dynamically
    discovered, and executed. This demonstrate that the approach is generic enough
    to be applied in a fully automated manner. It implies a performance overhead that
    is estimated from 5 % to 20 %.


    Weable Code Also named aspect code, it consists in integrating code precepts at
    defined cut points. It is a technology dedicated to implementing non-functional
    features. Such security mechanisms are natural candidates for being implemented
    as weable code.


    To the best of our knowledge, there is little work regarding the application of
    Aspect-Oriented Programming (AOP) in particular, in the Java language. A solution,
    AOSF, the Aspect Oriented Security Framework, is proposed by [49, 55]. It targets
    C programs. Their concerns also apply to the Java language. The principles of
    AOSF are:


    +   * Separation of Concerns: developers should not handle security issues.

    * Proactive stance: weable code is for security mechanisms defined and configured
    during the development process.

    * Global implementation: Consistent of security mechanisms throughout the system.

    * Adaptability: security policies should be flexible to implement various sets
    of configurations.


