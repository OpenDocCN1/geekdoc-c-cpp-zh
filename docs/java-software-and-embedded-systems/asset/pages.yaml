    # Bluetooth Protocol and JSR-82 Package


    In this section we explore some topics about the Bluetooth protocol and the JSR-82
    package for Java implementation. First of all, we start with the Bluetooth Stack
    protocols and then we describe the most important classes and interfaces of the
    JSR-82 package. Finally, we show some sample codes of using this package.


    # Bluetooth Stack Protocols


    The Bluetooth stack has a defined number of protocols that helps developers to
    establish communication between devices and to offer a good range of services.
    Among others, these are most important protocols:


    +   - L2CAP (Logical Link Control and Adaptation Protocol): is intended to offer
    a communication infrastructure based on a pair of sockets between devices, granting
    the ability to send raw data through the connection. Based on this one protocol
    are the defined other Bluetooth protocols.

    - SDP (Service Discovery Protocol): this protocol is in charge of offering services
    of a device at petition, telling which services are available and its properties.
    This protocol is really important, because it is intended to serve the main capability
    of Bluetooth, the offering of services.

    - OBEX (Object Exchange): this other protocol is used between devices to help
    sending formatted messages between them, helping to offer a robust framework,
    where communication limitations can be negotiated between devices, and messages
    can be refused before received, but knowing about their attributes. This protocol
    is widely used in mobile devices, mainly to be able to exchange image and audio
    files between them, independently of the platform of the device, for example in
    a printer and a photo camera.


    This list of protocols can be expanded, new protocols can use these to help define
    the functionality, so a protocol that helps to create a chat application will
    use OBEX features


