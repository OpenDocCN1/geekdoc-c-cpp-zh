    +   - Service, with concepts tying the parts of an OWL-S service description together,
    holds a textual description of the service.


    +   - Profile, which has properties used to describe what the service does—what
    it provides to the clients, and what it requires from them. More specifically,
    a service profile presents the inputs, outputs, preconditions and effects of a
    service. This information is used for matching; i.e. to find an appropriate service
    based on its capabilities.


    +   - Model, which has properties used to describe how the service works, i.e.
    what happens when the service is used. Services can be described as a collection
    of atomic or composite processes, which can be connected together in various ways,
    and the data and control flow can be specified. Service-seeking agents can use
    this information to perform a more in-depth analysis of the service, to compose
    several services to perform a task, to coordinate the activities of the services,
    and to monitor their execution.


    +   - Grounding, with properties used to specify how the service is activated,
    including details on communication protocols, message formats, port numbers, etc.
    This ‘abstract grounding’ is usually tied to a ‘concrete grounding’ in the form
    of a WSDL interface description.


    Any transaction in the web services marketplace involves three parties: the service
    requester, the service provider, and the infrastructure components. The service
    requester seeks to complete its specific work; the service provider offers a service
    sought by the requester. In an open environment such as the Internet, the requester
    may not know previously the existence of the provider, so the requester relies
    on infrastructure components to find the appropriate provider. Within the OWL-S
    framework, the Service Profile will provide a way to describe the services offered
    by the providers, and the services needed by the requesters.


    D-SOR is a mixed solution design, with the core composed by the OSGI mechanism
