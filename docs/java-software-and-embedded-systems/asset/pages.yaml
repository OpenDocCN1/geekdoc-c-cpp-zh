    # # 8. Conclusion


    In this chapter architecture for embedded tunable antenna is presented. The architecture
    results in a compact and extended tunable patch antenna, which is discretely tuned
    or programmed by digital codes. When reverse bias in the form of digital code
    is applied to the lowest, the lower order resonance is significantly reduced as
    (=80% at 0 V bias in a typical case) to the unperturbed patch. Also seen is the
    fact that the two higher order resonances is widely tunable in frequency. By changing
    the feed point location, it is possible to excite a particular mode efficiently.
    However, the return loss varies with bias level. Therefore, useful frequency range
    is limited and less the complete tunable range. It is also observed that thicker
    shocking results in an increased tuning range of resonant frequencies. From this
    configuration, an adaptive system be devised where a look-up table could be generated
    for changing the antenna parameters electronically. Such an adaptive antenna system
    with a computer interface is designed and the demonstrated experimentally. Experimental
    results indicate seamless integration of the antenna with the computer based control
    mechanism. This widely tunable antenna will find applications in communication
    systems, where frequency synthesizer of the receiver


