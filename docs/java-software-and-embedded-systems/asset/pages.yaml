    A MATLAB/Simulink® model of the algorithm has been implemented. This model, fed
    by experimental acquisitions, produces an output that depends on the calibration
    requirements. The multi-map optimization changes the calibration results in several
    aspects. It changes the values of the vectors and scalars, elements of the maps,
