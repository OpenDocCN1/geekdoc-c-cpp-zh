    # 3.2. Portable Software Architecture for Mobile Robots


    A Java application programming interface (API) has been developed for the described
    mobile robots. A key facet of its overall design was that the software architecture
    should remain intact if the underlying hardware changes. In such situations, only
    modifications would be required for the new hardware component(s). Additionally,
    hardware abstraction and sensor interfaces could be utilized at a high level by
    viewing related to their actual function (e.g., position sensor, heading sensor,
    range sensor). This represents a hierarchical design, such that interfaces define
    common terms for components that implement them. For example, the Sensor interface
    provides common components for all sensors, and is implemented by sub-interfaces
    such as Position Sensor interface, which can then be implemented by an actual
    position sensor (e.g., TopconGPSReceiver). Similarly, a more general Actuator
    interface can be extended by a Motor interface, and implemented for specific left
    and right motors. These interfaces define the method of accessing available data
    and basic control requirements.'
