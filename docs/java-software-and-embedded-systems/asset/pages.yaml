    # 4.1. SOR: The Semantic OSGI Service Registry


    SOR is created and adapted from the OWL-S approach, in order to provide as much
    compatibility with upper layers or bundles compliant with other standards deployed
    in the Framework. SOR information is compatible with the OWL-S standard and the
    rest of semantic protocols and tools, making the information available from OWL
    or RDF and, therefore, readable and processable from all applications with access
    granted to.


    Providing a common ontology for services in OSGI, more information will be available
    and a more complex and powerful OSGI search engine will be created, based on rules
    or constraints defined by the applications that demand those services deployed
    in the Framework.


    The Service Registry contains the services and provides ways to access them, get
    them or track their execution in the Framework. With an instance of the ServiceListener
    class configured to track a specific service, information can be retrieved from
    events of that service (registration, start, stop, etc.).


    Each service defines its own properties, and they are there to differentiate from
    other services in the Framework. But it is not enough, since that information
    is not well-defined (for example, it is not compliant with an existing standard
    ontology about service definition), and searching engines will not be able to
    take advantage of this knowledge.


    SOR extends the architecture of the service layer with addition of new semantic
    properties of the services, still being compatible with the original OSGI Framework,
    making OSGI "classic" applications work without taking care of the changes adopted
    by the Framework.


    Dependences between the bundle owning the service and the bundles it using are
    managed by the Framework. Moreover, it maps services to their underlying service
    objects, and provides simple powerful query mechanism that enables a bundle to
    request the services it needs. It provides an event mechanism so bundles can receive
    events of services that are'
