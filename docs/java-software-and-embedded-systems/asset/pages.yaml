  md: 'Regarding common practices in previous attempts, in order to promote the reuse
    of software via modularization or to use predefined groups of functions known
    as classes, the objects at an atomic level of SOA are associated by an application
    designer or an engineer via orchestration. In the orchestration process, relatively
    large chunks of code with such functionality are associated in a non-hierarchical
    way (contrary to what happens in hierarchical classes) by a software engineer,
    or process engineer, using an special software tool containing an exhaustive list
    of all the services, their characteristics and other functionalities. Allowing
    the designer to pick the services that will form part of the software system,
    managing consumptions, uses and other aspects during execution time.


    The objective is allowing those functional chunks of code to be linked, forming
    ad-hoc accumulations built entirely from existing software services. The bigger
    those functional chunks, the less interface points will be required to implement
    the set of functionalities. However, those chunks of code must not be too large
    granularity could be lost at this. The great promise in SOA is that the marginal
    cost related to the creation of the n-application is zero, because all the software
    required to carry out the requirements is to exist already. Only the orchestration
    is needed to create a new application.


    There are no interactions between the services themselves. Instead, the interactions
    between the services remain specified by the designer in a relatively ad-hoc way.
    Therefore, the services must be bigger functional units than the traditional functions
    or classes, in order to avoid the situation in which hundreds of services are
    needed to complete the new system, exceeding the application designer. Services
    are developed using traditional programming languages, such as Java, C#, C or
    COBOL.


    Services in SOA are weakly coupled if compared with, for example, the functions
    that are inside an environment like Java or .NET, which manage memory reservations,
    allowing a late and ad-hoc binding, and providing a certain level of uncertainty
    in data typing.


    Application architecture that SOA can help the customers answering in a faster
    and more efficient way in relating to costs, because of the changeable market
    conditions. This architectural style promotes the reuse at the service level (macro)
    instead of the class level (micro). It can also simplify the interconnection and
    use of existing IT resources (also called legacy applications).


    SOA can be considered an architectural evolution that takes many of the best practices
    from previous software architectures. SOA has been questioned from some forums,
    about whether it is a rebirth of the modular programming (1990) or not. SOA promotes
    the goal of getting the users (consumers) away from the implementation of services.
    Then, services can be executed over different distributed platforms and accessed
    through the network.


    SOA is a design and architectural discipline conceived to reach the goals of a
    greater interoperability (information exchange, usability and composition), bigger
    union (combining resources and applications while while their autonomy and individual
    government capability remains the same) and major alignment in the domain of business
    and technology.'
