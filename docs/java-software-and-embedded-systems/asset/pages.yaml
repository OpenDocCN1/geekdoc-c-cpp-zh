  md: '# A New Development Environment for Embedded Control Systems... 101


    ![](img/c669dc86947c1e394b7ee25b3acc20f3_114_0.png)


    Figure 10. Multivariable switching regression model example.


    It is important to note that the dependence can be extended to any number of independent
    variables ([19]). Such a model is characterized by a great continuity which, however,
    can lead to large errors if the equation does not fit well to the phenomenon.
    There are a number of advantages in using this new switching regression model:


    +   * The non-linearity allows one to describe known phenomena with a greater
    precision.

    * The multidimensionality allows one to utilize “Robust Design of Experiment”
    techniques, which reduce the experimental efforts [20–24] and the effect of measurement
    errors [21] over the model parameters estimation. Moreover, the high continuity
    of the maps guarantees the correct working of the control algorithms for the whole
    engine family and not only for the single engine.

    * More freedom in the choice of the experimental points: if the independent variables
    are not precisely controlled, or not controllable at the breakpoints (that are
    steady-state engine regimes where data are collected), the error of the measure,
    if acquired in the nearest breakpoint, can be of the same order of the control
    error. For example, the air inlet efficiency is controlled by regulating the throttle
    valve, with an error which can reach 2% on valve position at very low loads, reflecting
    on a 2% error on the target economy. This problem is usually tackled in the industrial
    practice by a manual modification of the measures. The multidimensional switching
    regressor, instead, does not require such modifications of data to maintain the
    same estimation precision in the engine zones where the physical phenomenon is
    hard to be modeled or controlled.


