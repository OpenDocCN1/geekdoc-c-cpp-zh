    **Traits, mixins, AOP, and virtual classes.** Traits define fields and to be used
    in a class similar to superclasses that also provide for methods and fields [27,
    1]. Mixin classes [29] and virtual classes behave in this respect – therefore,
    we will discuss their relation to IDM by means of traits. In contrast to inheritance,
    traits cannot instantiate objects [27] but can be assigned to classes (that can
    be instantiated) of other classes. Traits provide reusable implementations for
    classes even in single-inheritance languages. Methods of traits can be multiplied
    through alias mechanisms where one method becomes available under different names
    [27].


