    # 3. Methodology


    Basic evaluations, steps and components required for making Linux embedded and
    real-time are discussed in the following.


    # 3.1. Pros & Cons of Standard Linux for Real-Time


    The advantages of using standard Linux for application development over the dual
    Linux/real-time kernel method are summarised by the need of writing kernel code.
    Indeed, the threads of the real-time layer cannot directly access Linux services,
    for the same reasons that prohibit Linux processes from behaving deterministically,
    the developer has to design its application divided in two separate, although
    collaborating, worlds: "pure" real-time threads with no access to Linux services
    which are loaded as kernel modules, and non-real threads that have full access
    to Linux system calls. Communications resources such as shared memory or FIFOs
    are needed to allow inter-changes between these two worlds. Although it is entirely
    possible to separate real-time and non-real kernel instances, so increases application
    complexity, introducing dangers to the system integrity related to the running
    of user as kernel modules. By using a pure kernel with the CONFIG_PREEMPT option
    activated, it is possible to run real-time applications in user space, allowing
    their code and start-up like a normal Unix process (which is much easier than
    inserting modules into the kernel) and avoiding any problem to overall system
    stability in case of crashes due to programming bugs. In addition, using a GNU/Linux
    environment allows the user to use a unique set of tools for debugging and performance
    analysis, without any need of either on the real-time parts or of the GNU/Linux-based
    application components at any given time.


    It is worth to remember that performance of a standard Linux kernel compiled with
    the CONFIG_PREEMPT option are limited to a maximum latency and jitter of order
    of a few msecs when performing demanding activities such as accessing large amounts
    of memory causing faults, stressing the system through keyboard caps-lock, console
    switch, memory-mapped I/O; proc file access, and process fork are executed [5].
    Anyway, these limitations are usually handled by real-time embedded system programming
    techniques that allow the execution of such operations. In the case a user interaction
    with keyboard and monitor is, connection from a remote computer by means of a
    serial line or network can be activated.


