    # Abstract


    Embedded real-time platforms are a basic component of both robots and machines
    for the automation of industrial processes. Although industrial applications traditionally
    rely on PLC-based hardware and, in any, proprietary software, i.e. operating systems
    and development tools, in recent years dramatic improvements in hardware power
    and free software quality made realistic employment of architectures based on
    PC-compatible hardware and GNU/Linux software, more common in the search community.
    The advantages of a free infrastructure, that can become the terrain of fruitful
    cooperation between research institutions and companies, can be exploited mainly
    in fields, where the added value is in the application, i.e. in mechanical and
    algorithmic solutions, and where the point of view is that of users of human-interface,
    rather than R&D competitors. This is the case of the project presented in the
    following, research and a small enterprise led to the identification of the requirements
    and the joined development of a common software infrastructure. When the project
    started in 2004, both partners, i.e. the Autonomous robotic systems and control
    group of CN-ISSIA and Green Project Srl, had to substitute the obsolete platforms
    for their marine robots and marking machines for constructing products in steels
    with a stable software and hardware infrastructure able of transparently technological
    improvements while maintaining compatibility with the past (backward compatibility).
    On the basis of considerations, discussed below, about reliability, development
    and maintenance soundness, the choice was to verify the possibility of using standard
    GNU/Linux


