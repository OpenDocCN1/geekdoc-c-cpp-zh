    # 5. Conclusion


    It has been shown through examples that Java has been used in a wide variety of
    robotics and artificial intelligence research efforts. Its use in research and
    embedded systems is also increasing, due to the inherent aspects of Java''s design
    and evolution over time. These efforts express the utility of Java as a partial
    solution to the problems of exploited development, ease of validation, and modern
    computing constructs. From machine learning suites to wireless networks and multi-robot
    systems, Java''s versatility enhances how it can be used to teach, learn, and
    apply it in the real world.


    This chapter discussed how Java and Java-based devices can play a major role in
    sophisticated-single- and multi-robot autonomous systems. Java can be used as
    a tool to teach entry-level robotics, prototype components and entire systems,
    and develop robust interfaces for human-system interaction. Java''s object-oriented
    nature also aids in the organization of large and complex applications, as well
    as constructing higher behavioral intelligence for the control of low level sensors
    and actuators. Java''s breadth keeps growing, we will see additional use in future
    robotics and artificial intelligence research.


