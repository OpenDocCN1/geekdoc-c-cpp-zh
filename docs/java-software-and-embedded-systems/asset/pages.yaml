    ![](img/c669dc86947c1e394b7ee25b3acc20f3_34_0.png)


    The Java ME edition consists of different components that can be seen in the diagram.
    This paper will focus on the study of the specific components of the execution
    environment on mobile phones and PDAs. In conclusion one can say that Java ME
    is an execution environment that provides an API specifically to enable the creation
    and execution of applications in cellular phones and other devices described above.
    The edition for cell phones and PDAs is made up of 4 main components:


    +   * CLDC (Connected Limited Device Configuration): Setting Connection Limited
    Device is the primary component of Java ME. Its function is to provide a link
    between the application and the native capabilities of the devices. It provides
    the application access to resources necessary for its implementation.


    +   * KVM (Kernel Virtual Machine): Este componente reimierte por ser la ma virtual
    que ofrece la lenguaje nativo de la aplicación con el fin de ser ejecutada en
    el dispositivo.


    +   * MIDP (Mobile Information Device Profile): Profile information on mobile
    devices is a component formed mostly by point graph that provides Java ME. Based
    on the component CLDC provides the application of high-level services (such as
    gaming and multimedia features, sophisticated user interfaces and services of
    high connectivity).


    +   * Optional Packages: Additional components not present on all platforms that
    implement Java ME. In particular component JSR-179, location-based services is
    an additional package whose companies have licensed Java from outside and this
    is not implemented in many devices.'
