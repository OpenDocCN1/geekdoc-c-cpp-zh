    These tools have been developed using MathWorks’ MATLAB®/Simulink® software, which
    is a de-facto standard in the embedded system industry.


    # F.I.R.E. Tool Use Context


    The development of embedded control systems is usually a complex process because
    of the system size and the shared resources amount ([3],[4] and [5]). The modelling
    of these systems has to include knowledge of the top level structure, the distribution
    of the functionalities among system resources, the links and the data transmission
    among the components and system response to asynchronous or synchronous views
    [3].


    Such different information cannot be expressed by a single graphical notation.
    As an example, a single graphical view can show abstract functional aspects, and
    another one shows the control organization or the physical structure. An actual
    design methodology is based on the idea that every control system can be observed
    using three different views: the functional, the implementation, and the re-usability
    views.


    # Functional View


    Following a model-based approach for embedded system design during the design
    phase, which the customer requirements are analyzed and the control engineer plans
    a logical-functional view (Figure 1) of the control system in which the functions
    of the different parts of the process—e.g., signal acquisition, error value computation
    or command actuation—are highlighted ([16] and [7]). Such a view focuses on the
    data flow—that is, in graphical notation, each activity is data-driven, i.e.,
    every block undertakes its elaborations as soon as input data are on its input
    ports, waiting without any priority or CPU availability.'
