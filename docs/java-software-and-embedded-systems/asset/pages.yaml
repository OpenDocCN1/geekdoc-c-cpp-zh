  md: '# J.A. Tejedor, Jose J. Durán, Miguel A. Patricio et al.


    +   - boolean populateRecord(int[] attrIDs): fills the attribute list with the
    ones from the list, if able, the value of the attribute can be set.

    - boolean setAttributeValue(int attrID, DataElement attrValue): changes an attribute
    value.

    - void setServiceClasses(int classes): sets the device service classes, so the
    device will be recognized as one of a list of generic devices.

    - ClientSession: Permits to use OBEX (OBJECT Exchange) primitives in a session
    between mobile devices. As mentioned above, OBEX is a communications protocol
    that facilitates the exchange of binary objects between devices. This connection
    is similar to the one between a web client and a server, where the server sends
    a file to the client telling about how is the file, and the file itself. The example
    of service search this protocol as example of communication between devices, in
    this case to be retrieve an image file.

    - HeaderConnect(HeaderSet headers): Creates a connection between devices through
    an OBEX service, with the desired information.

    - Header createHeaderSet(): Creates a predefined HeaderSet needed for the service,
    and the attributes that are needed.

    - Header disconnect(HeaderSet headers): Disconnects from the other device.

    - Operation get(HeaderSet headers): Creates a reception operation, retrieve data
    from the other device. The parameter is fill with connection properties.

    - Operation put(HeaderSet headers): Creates a sending operation, be able to send
    the announced data.

    - Header: Contains the meta-information of the communication using OBEX, defining
    the object attributes and authentication.

    - void createAuthenticationChallenge(String realm, boolean userID, boolean access):
    Creates a security mechanism, based in the realm pass

    - Object getHeader(int headerID): return an attribute header. Normally it is an
    String, but it is recommended to use the toString() returned String.

    - int[] getList(): List of header from the HeaderSet.

    - void setHeader(int headerID, object headerValue): sets a header to a desired
    value. The value is defined by the toString() method of the object.

    - Operation : Offers functionality to interact using data streams to exchange
    information using OBEX, so an HeaderSet can be sent throw a connection, negotiating
    transfers.

    - void abort(): aborts the operation between the devices.

    - Header getReceivedHeaders(): Returns the headers assigned to this operation.

    - int getResponse(): Return a response code to be able to track errors.

    - void sendHeaders(HeaderSet headers): sends headers to the other device.


    Classes:


    +   - RemoteDevice : Access to device information, and defines some methods to
    obtain not broadcasted information of the device as the friendly name.

    - String getBluetoothAddress(): Returns an unique identifier of the device, that
    identifies it of the rest of device available.'
