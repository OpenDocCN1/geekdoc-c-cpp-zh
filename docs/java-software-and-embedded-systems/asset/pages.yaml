  md: '# REDUCING CODE REPLICATION

    IN DELEGATION-BASED JAVA PROGRAMS


    Martin Kuhlemann*

    School of Computer Science, University of Magburg, Germany

    Christian Kastner†

    School of Computer Science, University of Magdeburg, Germany

    Sven Apel†

    Department of Informatics and Mathematics, University of Passau,Germany


    Abstract

    Interfaces and delegation are fundamental concepts in OO languages. Both concepts
    have been shown to be beneficial in software development, sometimes their implementation
    is cumbersome. This result in numbers of forwarding methods and of empty methods
    for respective classes. These trivial methods distract the user from non-trivial
    methods the class comprises. This increases complexity and decreases maintainability.
    In its current form, Java does not provide sufficient mechanisms to avoid this
    boilerplate code. Instead, all the methods that are only forward calls have to
    be coded manually. In this paper, we introduce a new mechanism, that improves
    the implementation of interface-based and delegation-based programs. We show,
    though this mechanism is very simple, it solves these problems that are well-known
    in object-oriented software development. In open-source Java programs of over
    25,000 lines of source code, we show how we use this mechanism to generate up
    to 5.7% of all methods per case study that were empty or only forwarding calls.


    **Keywords:** Java language, generative programming


    # 1. Introduction


    Interfaces and delegation are fundamental concepts of object-oriented programming
    (OOP) and Java [12, 11, 15]. An interface defines a protocol to access a class
    and


