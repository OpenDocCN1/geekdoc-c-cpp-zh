    # Abstract


    Wireless communications technologies are the platform to develop user-centric
    systems in a

    multi-device platform that allows mobility and user-friendly interaction. The
    development of a

    multi-device platform requires a common language Java. In this chapter, two different

    works related to Bluetooth and GPS-GSM communication has been selected to illustrate
    the

    capacity of Java to develop applications that need wireless communications.


    # Introduction


    Computational resources are every time closer to all people because of the

    development of devices such as Personal Digital Assistants and mobile phones which
    have

    gained a lot of popularity in these days and are increasingly being networked
    (e.g., Bluetooth,\IEEE 802.11). The use of this technology gave birth to a new
    concept: mobile computing.

    Mobile computing is having an increasing attention as many systems are designed

    towards this direction. Most of them are desired to be aware with the aim of

    optimizing and automating the distribution of their services in the right time
    and in the right

    place. Context computing is a paradigm first defined by (Shilt, 1995). This

    paradigm studies for modelling and using contextual information. A more widely

    def definition of what context is, was given by (Dey et al., 2001) who defines

    context as: "any information that characterizes a situation related to the interaction
    between

    humans, applications, and the surrounding environment." There are also some

    categories described by Chen and Kotz (Chen and Kotz, 2000) which classify context
    in a

    more fine-grained categories.


