  md: '# 3.2. Vulnerabilities in Code


    Various authors propose lists of vulnerabilities that are to be avoided and coding
    rules that help prevent them. Though these lists are partially overlapping, each
    provide specific entries.


    Source Code The first set of vulnerabilities that can be identified in the Java
    source code consists of counterintuitive behaviors of Java programs [5, 6] known
    as puzzlers. They concern the range limit of numbers or intricate exception and
    thread management. ‘strange’ behaviors lead to code misunderstanding and infinite
    loops or program deadlocks. An example of such an infinite loop is in Listing
    2. Its origin is the integer counter is incremented: when it reaches Integer.MAX_VALUE,
    the count goes on Integer.MIN_VALUE.


    # Listing 2: Example of a counterintuitive infinite loop in the Java language


    ```

    public static final int END = Integer.MAX_VALUE;\public static final int START
    = END - 100;

    // or any other start value

    for (int i = START; i <= END; i++)

    ```


    The reader is invited to refer to the books or our technical report [42] for selected
    puzzlers that turn out introduce vulnerabilities.


    The second set of vulnerabilities is defined by McGraw and Felten ‘12 rules’ for
    developing more severe Java code [40]:


    +   1. Don''t depend on initialization: most Java programs implicitly consider
    that initialization is performed in a correct manner through the constructor.
    Since there are many ways of initializing objects without the constructor such
    as cloning and deserialization, all methods should have a well defined behavior
    in such cases.

    2. Limit access to your classes, methods and variables: every class, method and
    variable that is public provides a potential entry point for an attacker. By default,
    everything should be private unless there is a good (documented) reason.

    3. Make everything final (unless there''s a reason not to): if a class or method
    isn''t final, an attacker could try to extend it in a dangerous and unforeseen
    way. By default, everything should be final.

    4. Don''t depend on package scope: classes, methods and variables that are not
    explicitly labeled as public, private or protected are accessible within the same
    package. An attacker can add a new class to a package, this setting does not protect.

    5. Don''t use inner classes: Java Bytecode has no of inner classes, so inner classes
    are translated by the compiler into ordinary classes that happen to be accessible
    by any code in the same package. This is illustrated in Listings 3 and 4.

    6. Avoid signing your code: Code that isn''t signed will run without any special
    privilege. And with no special privilege is much less to damage. Moreover, grant
    privileges only if it is not possible to avoid it.'
