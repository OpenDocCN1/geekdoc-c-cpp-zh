  md: '# Security for Java Platforms


    The default Java security model is presented. Its sound design does not prevent
    the existence of vulnerabilities in the JVM and in the code of Java applications.
    Security extensions to the JVM are then detailed. They intend to address the challenges
    that are brought in by the simultaneous execution of mutually untrusted components.


    # 2. The Default Security Model


    The security model of Java evolved from HotJava, Netscape, to Java 2 [19]. It
    was first designed to support the secure execution of Applets, which are potentially
    malicious code pieces. This is made possible by the strict language definition
    and its mechanisms for security enforcement. The shift towards components applications
    used the support of modularity: components from various sources can be executed
    on the same platform with no mutual access to their data. A comprehensive introduction
    is to be found in [26].


    # 2.1. The Java Execution Environment


    The Java language is meant to be a safe subset of the C language. This means that
    all language elements that can be exploited in C programs such as the nefarious
    buffer overflows or memory management activities are removed from the specification.
    This simplicity intends to free developers from error-prone tasks and to enhance
    their productivity by letting them focus on the features they develop. principles
    that underlie the security of the Java language are the following [29]:


    +   * Type safety.

    * Automated memory management.

    * Bytecode validation.

    * Modularity.


    Type Safety means that each language element has a given type and can only perform
    actions that are coherent with this type. In particular type safe languages are
    free from pointers which enable us to manipulate memory addresses independently
    of their type. Type safety is enforced at three moments: during the compilation,
    when the Bytecode is loaded into memory, and at runtime to ensure type coherence
    with libraries that are dynamically linked. Some authors consider that the Java
    language is not completely type safe since it enables us to handle Sets and Collections
    of data without regard to their actual type. Errors lead to thrown exceptions
    at runtime. The solution at the language level is the use of Generics which fixes
    the data structures to only contain objects of a given type. For backward compatibility
    reasons, this feature is not mandatory. A solution exists in certain service-oriented
    programming (SOP) platforms such as Guice, that create objects in an ‘extraordinarily
    type safe’ manner, i.e., SOP factories provide well-typed objects that do not
    need to be cast in the requesting code. This prevents runtime exceptions which
    could occur due to cast errors.'
