  md: '# Discrete Regression Model


    To describe the relationship of the type z=f(x,y), it is possible to use a map
    which represents the z value for every point on a discrete x-y grid, defined by
    two breakpoint vectors. The output value of the map in the points that do not
    belong to this grid, is calculated using a bilinear interpolation method, like
    in the Engine Control Unit.


    The DiscreteRegression tool has been developed to meet this need. It computes
    the values that minimize the mean square error between the experimental data and
    the surface, described as the bilinear interpolation of the map. In Figure 11
    an example is reported. The experimental points are plotted as red dots, while
    the map is represented in transparent blue.


    ![](img/c669dc86947c1e394b7ee25b3acc20f3_115_0.png)


    Figure 11. DiscreteRegression tool example.


    On the left side of the figure, there is a slider that increases the surface stiffness.
    It works like a spring which stretches the surface edges. A high stiffness generates
    a plain surface, increasing the mean square error. The map continuity is one of
    the requirements in the calibration phase. The discontinuities can be caused by
    a large error in some points. A discontinuous map can generate different output
    values for very similar values. This is dangerous in the use of the map, because
    an error in the input variable or its estimation can generate a big variation
    on its output, causing instability in the control loop. The stiffness can also
    be used to impose a rule for the extrapolation of the map in not experienced x
    and y coordinates.'
  merge: -1
  pgno: 115
- img_proc: true
  md: '# A New Development Environment for Embedded Control Systems... 103


    The discrete regression allows one to be free in the acquisition dataset choice,
    because it is not any longer necessary, for example, to acquire data exactly in
    the breakpoint intersection points. It doesn''t need to split the problem into
    sub problems as with the traditional calibration tools.


    The advantages are essentially the same as the continuous regression model with
    the addition of the following:


    +   - The model implemented in the ECU is the output of a map. By acquiring data
    not only in breakpoint intersections, it is possible to obtain a map that minimizes
    also the model error, not only the measurement one. This aspect is fully explained
    below.


    +   - The possibility to interactively stiff the map produces more physically
    realistic input/output relationships thus avoiding the overfitting problem.


    # Discrete Regression Algorithm


    The aim of the discrete regression algorithm is to minimize the sum of the squares
    of the distances amongst the map and the experimental points. In order to achieve
    this goal, an analogy with a mechanical phenomenon can be done: every experimental
    point is fixed in the space while the map slides z-axis like shown in Figure 12.
    Every experimental point, which is red coloured the figure, is linked by a spring,
    in blue, whose stiffness is the same for each point. A damper is also present.
    The damping value may be critical. The map segments, surfaces in three dimensional
    space, have a mass and react to the spring and damper according to the second
    dynamic principle. The forces move the map toward the points. The equilibrium
    will be reached in the map along a configuration that minimizes the energy of
    the spring system. The expression of this energy is:


    ```

    E = \sum K * \Delta z_i^2

    ```


    where K is the stiffness of the spring


    $\Delta z_i$ is the z-axis distance between the $i^{th}$ experimental point and
    the map

    N is the number of experimental points


    Such a formula represents the sum of the square errors between the experimental
    points and the map.


    The mechanical system dynamic has been discretized and MATLAB® coded with a discrete
    difference equation. Some programming technicalities have been used to avoid possible
    instabilities and to enhance the simulation speed. As a result, more than 200,000
    points can be handled in a few minutes. Moreover, the outgoing maps are smoother,
    more coherent with the description of the physical phenomenon and can be interactively
    judged and modified by the calibration engineer.'
