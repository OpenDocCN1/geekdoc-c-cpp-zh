    # 2.1. Ch — an Embeddable C/C++ Interpreter


    Ch, originally developed by Cheng [12, 11], is an embeddable C/C++ interpreter
    [2] developed as an integrated programming environment for cross platform scripting
    [12], and numerical and embedded computing. Ch is an extension and enhancement
    of the widely used C computing environment. The relation between Ch and other
    major programming languages and software packages is illustrated in Figure 1.
    Being platform independent, a Ch program developed on one platform can be readily
    executed on different platforms without recompiling and linking. The use of Ch
    for the interactive control and integration of heterogeneous mechatronic and robotic
    systems has already been verified in [22, 7]. Functions, commands, and scripts
    in Ch are the basic blocks for high level robot programming. A function file in
    Ch is a C program that contains at least one function definition. In the Ch programming
    environment, functions are defined using function files are treated as if they
    were built-in systems. With Ch functions, automaton programs are created not by
    writing large programs from scratch, but are instead combined from relatively
    small components. These components are small and concentrate on simple commands
    that they are easy to build, understand, describe and maintain. The command-line
    argument interface in Ch is compatible. Statements, functions, and commands can
    be grouped as a script file or a script in Ch. A script can also contain scripts
    written in other shells such as C, Bourne, and Korn. Some salient and important
    features of embedded systems are as follows:


    +   * Deterministic for real-time computing

    * Interpretive

    * Interactive user interface

    * Superset of an established language

    * Code portable across different platforms

    * Secure network computing

    * Advanced numerical computing with matrix capabilities


