    development of an additional semantic layer based on OWL. This allows new technical
    approaches, adding capabilities to the development of software agents that make
    use of this new information.


    These capabilities cover the search of services according to terms in shared commonologies,
    providing concepts and values by the client that are used in the searching and
    invocation process, the download of services including possible dependencies,
    remote invocation, and so on. Thanks to the conjunction of this semantic layer
    with software libraries such as the Java Reflection API, the client does not need
    to know any detail behind the public facade in the technical literature. Instead,
    intelligent software agents manage the existing and arranged catalogue of services
    in an absolutely transparent way.


    In Chapter 3, the authors outline a method to tune a conventional (regular shaped)
    microstrip antenna. An analytical method to express the resonant frequency in
    terms of the lumped component values is evaluated.


    The development of embedded control systems for automotive applications is an
    emerging field in the technical literature. There is, consequently, a lack of
    methodologies and tools that support the various development phases, starting
    from the architectural design and ending with the calibration and validation processes.
    In Chapter 4, a new framework for embedded control systems and engine calibration
    (F.I.R.E.—Functional Implementation Re-usability) is presented, which supports
    the modelling of such systems at a high abstraction level and provides tools for
    the design and validation activities. The F.I.R.E. enables control engines and
    software developers to focus on control system aspects instead of platforms. This
    is achieved by means of automation procedure of some necessary transformations
    during the development process. Two application examples are reported to provide
    the tool capabilities to allow a time analysis and to detect a bad task scheduling
    before the production code is generated.


    The tool also provides a set of support functions to the embedded system design
    process, calibration and validation phases which are always crucial in the overall
    development cycle. This consideration is particularly for engine control systems,
    because their complexity is continuously increasing and more stringent time-to-market
    deadlines are conversely required.


    The use of utilization tools, to speed up the single calibration and verification
    phases, have been proven effective and is now a current industrial practice. Such
    experiences have also suggested that their integration within the F.I.R.E engine
    needs to be encouraged. The rationale is that the development process of Engine
    Management Systems consists of several phases, in which there is an incremental
    SW development, it is necessary to estimate from the physical engine a set of
    calibration parameters in a very short time and with great accuracy.


