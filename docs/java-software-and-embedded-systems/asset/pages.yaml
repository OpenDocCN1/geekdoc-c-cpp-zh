  md: '# SECURITY FOR JAVA PLATFORMS


    Pierre Parredd*


    Software Engineering, FZI Forschungszentrum Informatik

    Haid-und-Neu-Strasse 10-14, 76131 Karlsruhe, Germany


    Abstract


    The Java environment is composed of two main parts: the Java language and the
    Java virtual machine. It is designed with the assumption that no software entity
    is to be trusted and, therefore, that each needs to be checked. The first success
    of Java was the inception of Java Applets, which enabled fully untrusted code
    provided by unknown Web sites to be executed in a browser. This feature demonstrated
    the isolation of the Java Virtual Machine (JVM) between the applications and the
    underlying operating system. However, the evolution of Java systems from mono-application
    to multi-component systems introduce new vulnerabilities developers are not aware
    of. This requires additional security mechanisms to be used to support secure
    Java environments.


    This survey presents an overview of the security issues for the Java language
    and Virtual Machine. The default security model is defined and explained. Its
    main components are the Java language itself, the Bytecode validation at load
    time and modularity such as the class loaders and permission domains. Known vulnerabilities
    are presented. They originate either in the JVM or in the code of applications.
    Two approaches exist for describing code vulnerabilities: source code and Bytecode.
    This enables us to identify them both during development through manual code review
    and tools, and in an automated manner during code deployment or installation.
    Security extensions for the Java Execution Environment and tools for writing Java
    code are present. There are three types: platform extensions, static analysis
    approaches and behavior injection. Platform extensions consistent in strengthening
    the isolation between components (beans, etc.), and providing support for resource
    consumption and control. Static analysis is often performed through generic tools
    that improve code quality and reduce the number of exploitable bugs in the Java
    code. Some of these tools, such as FindBugs, encompass security-specific bugs,
    and JSLint are dedicated to security analysis. Bytecode injection us to introduce
    security checks in the core of the code. It can be performed


