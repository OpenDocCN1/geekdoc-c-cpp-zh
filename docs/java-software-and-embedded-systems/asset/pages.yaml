  md: '# THE POWER OF REFLECTION: COMBINING SEMANTICS IN SERVICE ORIENTED ARCHITECTURES
    FOR DYNAMIC INTELLIGENT INVOCATION


    P. Cabezasᵃ, S. Arrizabalagaᵇ, A. Salteráinᶜ and J. Legardaᵈ

    CEIT and TECNUN (University of Navarra)

    Manuel de Lardizabal 15, 20018 San Sebastián, Spain


    # Abstract


    Service Oriented Architectures offer an incomparable setting for the management
    and reuse of services. In the case of such big scaled architectures the ability
    to choose between those services often get blurry, because of the difficulty when
    trying to find the one which fits the better needs, or even its invocation process
    gets excessively complex.

