    As explained in Chapter 8, interfaces and design are fundamental concepts in OO
    development, although both concepts have been shown to be beneficial in software
    development, sometimes their implementation is cumbersome. Both results in forwarding
    methods or numbers of empty methods for respective classes. These trivial methods
    extract the user from non-trivial methods the classes comprises. This increases
    complexity and decreases maintainability. In its current form, Java does not provide
    sufficient mechanisms to avoid boilerplate code. Instead, all the methods that
    are empty or forward calls have to be coded manually. In this case, the authors
    introduce a new lightweight mechanism, that improves the implementation of interface-based
    and delegation-based programs. The authors show, this mechanism is simple, it
    solves some of the problems that are well-known in object-oriented software development.
    In three open-source Java programs of up to 25,000 lines of source code, the authors
    show how they use this mechanism to generate up to 5.7% of all methods per case
    study that were empty or forwarding calls.


