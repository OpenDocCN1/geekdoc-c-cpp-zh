    a method''s body with aliases for the method name [27], but the method signature
    (despite its name) and the body remains unchanged – which is inappropriate for
    forwarding of methods that we focus on). IDM is more simpler than traits in that
    traits introduce methods into classes while IDM only generates forwarding or empty
    methods. In contrast, IDM does not divide the implementation of a class into multiple
    parts to define default implementations; but IDM integrates default methods into
    every class that needs to provide them.


