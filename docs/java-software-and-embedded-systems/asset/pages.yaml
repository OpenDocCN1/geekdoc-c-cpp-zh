    the service properties describe the service to its audience. The OSGI Service
    Registry dynamically links bundles together while tracking their state and Dependencies.
    With the Service Registry, bundles can register objects, search for matching objects
    and receive notifications when services become registered or unregistered.


    As it has been already said, the primary goal of the OSGI service framework is
    the use of the independence of the Java programming language platform and the
    dynamic code-loading capacity to develop and dynamically deploy applications for
    small-memory devices. It also provides a life cycle management functionality (see
    Figure 1) that permits application developers to partition applications into small
    self-installable components. These components are called bundles, and they can
    be downloaded on demand and removed when they are no longer needed. When a bundle
    is installed and activated in the framework, it can register a number of services
    that can be used by other bundles.


    A bundle is a physical and logical unit that allocates and delivers service implementations
    in the OSGI service registry. From a physical perspective, a bundle is distributed
    in a Java archive file (JAR) that includes code, registers and manifest file.
    The manifest file informs the framework about the bundle class execution path,
    and it declares Java packages to be shared with other bundles. It also contains
    information regarding the actor of the bundle. From a logical perspective, it
    is a service provider for a certain service or a service requester needs to use
    a particular service within the framework during execution time.


    The OSGI framework provides the mechanism for managing the bundle lifecycle. A
    bundle is installed and executed in the framework, it can provide its services,
    and find other services available on the framework and can be grouped with other
    bundles through the framework''s service registry. The service registry contains
    all registered services and Each service is registered under a specified class
    name, and defines its properties at registration time, in the form of attribute-value
    pairs. They are differate from other services in the framework, as well as to
    provide additional information.


    The class name string is one of the ways to retrieve a service from the service
    registry, casting it to the desired class which provides the services for the
    client application. If it is possible to apply filters with the properties and
    their values at this stage, the string under which the service was registered
    is not known previously. If the search is successful, the client application will
    get a ServiceRegistration object which finally contains the invokable services.
    But services will not be able to be invoked if the client does not know the object
    class and, therefore, will not be able to cast the object into the needed class
    (or interface). This is reason why reflection is so powerful in OSGI. If a class
    providing implements an interface known by the client, there will be no problems
    when getting recently implemented and deployed services, the client will get the
    object through the interface, because all the available services will be those
    contained in that interface.


    Even using patterns and property filters, service and client bundles are highly
    coupled through simple text expressions and interfaces that cannot be enriched
    with the addition of new methods and services. When a service entity wants to
    extend the capabilities of an existing system, those additional services have
    to be implemented strictly using the interfaces and properties defined for that
    environment.'
