  md: '# The Power of Reflection


    Service Providers). The information in this point is related to the communication
    processes between the different internal entities in the system.


    Once the client has made a request, the service must be successfully invoked.
    In case it is found locally, that service is invoked and its return value goes
    back to the client. But in case it is not, STA will start a searching process
    with D-SOR nodes in the network, and in a transparent layer for the user.


    Every positive answer has been queued, in order to find the option that best satisfies
    the initial client request. This process can be moved to different levels, in
    which each node accesses new networks that could not be reached in the first request.
    It is also possible to define an internal depth-level value, so that if the service
    is not found after a number of attempts, the agent will proceed with the communication
    with the Service Providers.


    After the node discovering process, service invocations are executed over web
    services. In the same way as SFA, discovered nodes provide the address of the
    service that will be able to invoke requests by the client.


    STA also provides an easy way for the management of service invocation mode, by
    asking to the rest of accessible nodes for their actual operation mode, regarding
    to the invocation aspect. Depending on the system policies, this mode will be
    adopted or not, thanks to the information obtained in this process.


    # 4.3.3. SOR Invocation Agent


    The SOR Invocation Agent (SIA) is directly invoked by the client, providing information
    about the service and different argument names. SIA also has the capability to
    interact with the rest of agents, but their functionality could be needed in several
    cases.


    SIA counts with two possible invocation modes. With ''findAndInvoke'', the information
    of the client is provided to the node containing the service, and this agent executes
    and returns the result. However, for the second mode ''retrieveBundleAndInvoke''
    the bundle is downloaded into the requesting node. A bundle can have dependencies
    with other bundles, so this solution makes it possible to analyze those dependencies
    and existing bundles in both source and destination, in order to download and
    install the related dependencies in the correct sequence.


    Anyway, the searching process of D-SOR nodes can be recursively extended to several
    levels by the rest of the nodes that, after a first unsuccessful search by the
    source node, access to other nodes that could not be accessed in the first term.


