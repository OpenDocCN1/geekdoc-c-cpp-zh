    system variables through the OSGI platform. Since in the OSGI platform each component,
    named bundle, is started in its own class loader, is isolated from the others.
    Language security support enable to prevent the use of dangerous language constructs
    such as the synchronized keyword. Moreover, direct calls between components are
    preserved, which is not the case of Java objects which require IPC-based communications.
    They are based on the JnJVM [53] project, which is a set of scripts that support
    of tuned virtual machines according to the target environment and the selected
    internal building blocks such as JIT (Just-in-Time) compiler or garbage collectors.


    J-Seal [4] is another Java micro-kernel architecture that aims at executing mobile
    objects that are not rooted. Resource accounting is performed for low resources
    such as CPU and memory for high resources such as thread. Three types of objects
    are defined: system services as networking and GUI, sandboxes for trusted code
    that allow access to all system services, and sandboxes for anonymous code that
    allow access to limited networking only. Each mobile object and service executes
    in a protection domain, or ''sealed object''. Each protection domain has its set
    of threads which cannot cross boundary arbitrarily. Access to sensitive resources
    is performed through a dedicated service. In particular, objects have to use a
    safe wrapper to create new threads. Lately objects are organized a hierarchy which
    enables parent objects to terminate their children and release resources at any
    time.


    RAJE [32] (Resource Aware Java Environment) is an extension of the standard Java2
    platform. It aims at monitoring resource access and consumption for global resources
    such as each thread. It is implemented through the reification of system resources
    and application level resources as threads, and socket, their representation as
    Java objects. RAJE support Jamus (Java Accommodation of Mobile Untrusted Software)
    which is a framework for executing Java components. Each component is enriched
    with a contract that specifies the amount of resources it is allowed to consume.
    This enables to limit the resource amount a component can use and guarantees the
    availability of sufficient resources for satisfactory execution.


