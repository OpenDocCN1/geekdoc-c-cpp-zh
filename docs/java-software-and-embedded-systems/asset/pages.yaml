    **Meta-Programming** provides a comprehensive framework for code injection [8].
    It is implemented by Meta-Object Protocols, MOPs, that define a language to access
    and modify the code. As AOP, Meta-programming is considered as a solution of choice
    to add nonfunctional properties to software. It provides the advantage not to
    require the definition of cut points and to be applicable to third party components.
    MOPs enforce code injection at various moments of the life-cycle: compile time,
    with transformation of the source code, load time with transformation of the Bytecode,
    runtime either in the VM with modification of the program during its interpretation
    or compilation, or using proxies through hooks in the program. This latter version
    is similar to AOP and does not require the modification of the VM. Meta-programming
    is when the standard Java security manager requires that security checks are served
    development. Its main limitation is that it is not a lightweight approach which
    is explained by the definition of a rich application manipulation framework.


    # **Inlined Reference Monitor** (IRM) uses code injection to flexibly enforce
    a wide range of security policies [23]. An IRM is built of three entities: security
    events, security states and security updates. Security events are the operations
    that must be mediated by the security mechanism. Security states are data stored
    about earlier security events. Security violation and/or trigger remedial actions.
    It is based on the security-passing system (SPS) [57] approach that aims at enhancing
    the performance of security checks by extending function calls with a dedicated
    parameter that stores the local context. The conditions for validity of IRM are:
    (i) it must mediate all events relevant to the policy being enforced, (ii) its
    integrity must be protected from supervision by applications and (iii) its presence
    must be transparent to applications. The performance overhead of IRM is between
    20 and 70 % when it is based on SPS and between 2 and 7 when it uses the JVM call.


    The benefit of IRM is its great flexibility it introduces in the eligible security
    policies. For instance, it is capable of enforcing Execution Monitoring (EM) policies
    which include mandatory and discretionary access control Chinese Wall, type enforcement,
    and the Clark-Wilson commercial policy.


