  md: '# 3. Java Software Architecture for Polar Mobile Robots


    Mobile robots which autonomously operate in outdoor environments, referred to
    as field robots, can be quite challenging from a software development perspective.
    Mobile robots utilize several sensors and actuators to perceive the environment
    and act accordingly based on their programmed behavior. Extensive testing and
    evaluation of robot performance is required, which affects how the software is
    developed. The environment in which the robot is operating becomes more harsh
    and complex, additional challenges that the robots may encounter.


    As part of the PRISM [15] and CReSIS [3] projects at the University of Kansas,
    a soft-architecture has been developed entirely in Java for two tracked mobile
    robots for polar regions [21]. These robots were designed for the support of autonomous
    datar acquisition on ice sheets in Greenland and Antarctica. Primary requirements
    were high-precision navigation and tuning of one or more radar antenna sensors
    in a grid pattern. In harsh environments, the robots might not be able to accomplish
    their task, but they must also operate under conditions exposed to extreme temperatures,
    mobility in inconsistent snow and ice terrain, limited visibility due to blowing
    snow, snow drifting from high wind speeds, and presence of crevasses. Therefore,
    the software architecture must be designed to allow easy testing and fusion of
    sensors to ensure reliable performance.


    The development of a reusable, extensible, and portable software architecture
    allows for easy testing and fusion core features on various platforms. This design
    methodology ways


