    # Implementation Aspects


    The operation provided by the F.I.R.E. tool is accomplished via a text low-level
    parsing

    procedure acting on the Simulink files related to the functional view. The parsing
    is\undertaken by some of MATLAB® scripts which analyze and re-write these files
    on

    the basis of the desired transformation chosen by the user.


    Each F.I.R.E. transformation is composed by two different sections: a low-level
    one

    where the parameters characterizing the new build up are extracted from the

    functional viewed subsystems, and a high-level one, in which the new file is completed

    with aid of MATLAB® Simulink Model Construction commands, using the information

    extracted during the low-level phase. The cluster has set priorities, driven by
    the

    scheduler block in the implementation view to solve task activation conflicts,
    by means of

    a Graphical User Interface.


    # Examples of F.I.R.E. Applications


    This software has been validated on two different real control system design

