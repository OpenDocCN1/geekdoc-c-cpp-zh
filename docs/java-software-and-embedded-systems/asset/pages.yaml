  md: '# The Power of Reflection


    # 2. Services: Evolving from the Object Oriented Programming


    As a result of objects and services conjunction, a new paradigm arises to carry
    out the socioeconomic and technological requirements of the actual Information
    Society: the ones in Service Oriented Architectures (SOA). The technological alternatives
    that make the implementation of this pattern possible are also presented, with
    concepts such as middleware and service provisioning platforms.


    # 2.1. Service Oriented Architectures


    There are two ways to understand what is behind the SOA acronym. In the one hand,
    SOA can be seen as a methodological guide, a concept of architectural design or
    a way of consistently working for aligning and optimizing existing systems and
    solutions with the objectives of every organization, integrating them with new
    solutions and services in an easy and flexible way. In the other hand, those new
    solutions and systems, if they are designed bearing in mind those methodological
    aspects, constitute the second way of understanding SOA; this is, SOA technology.


    From a technical point of view, SOA is an architectural design for computational
    systems, focused on the creation and use of software processes, packaged as services,
    along their life cycle.


    SOA also defines and provides the IT infrastructure which allows the different
    applications to exchange information and part in different processes. These functions
    are low coupled with operating systems and programming languages that coexist
    under the applications.


    SOA divides the functions in distinct units (services) that can be distributed,
    combined and reused through a network to create new applications. These services
    get communicated by passing information from one to another, or via a coordination
    of two or more services. The SOA concepts can be visualized as a natural evolution
    of concepts like distributed computing or modular programming. Therefore, a flexible
    and standardized architecture is required to support the connection of several
    applications and their information exchanging processes. SOA is one of those architectures.


    SOA structures big applications as an ad-hoc collection of smaller modules. These
    applications can be built by different and heterogeneous groups of people, and
    new applications can be built over the resulting set of services, which shows
    a great flexibility and uniformity. Developing applications from the same set
    of services makes this goal easier to be reached.


    In SOA the applications are built from software services, which can be identified
    as independent functions. They usually implement functionalities that could be
    identified as services, for example, filling a form of an application for a bank
    account, visualizing a charge of an online bank, or getting an order to reserve
    an airplane ticket or buy an online book.


    Services make calls between them at source code, and protocols are defined to
    describe how this architecture is based on a business process, specialized in
    the union and assignment of service sequences, called orchestration.'
