    # # The Location API for Java ME: JSR-179


    JSR-179 is a Location API for Java ME specification developed under the Java Community
    Process. This specification defines a ME Optional Package that enables mobile
    location-based applications for resource limited devices. The API is designed
    to be a compact and generic API that provides information about the present geographic
    location of the terminal to Java applications. This API covers obtaining information
    about the present geographic location and orientation of the terminal and accessing
    a database of known landmarks stored in the terminal.


    Java Community Process is responsible for development Java Technology. Its main
    purpose is to guide and approve the specifications in Java Platform. Different
    companies can contribute to the creation of specifications. This contribution
    comes through established contracts.


    This specification is subject to the license driven by Nokia, the company is the
    author of the development and design of this specification. According to the contract,
    the specification is jointly owned by Nokia and Sun Microsystems. But the agreement
    is subject to private agreements for the implementation on other platforms than
    those created by Nokia.


    As an additional package left at the mercy of manufacturers (including distributors
    of operating systems targeted to mobile devices) to implement the specification.


    Because this is to verify that the device supports the specification to be able
    to use it properly and thus avoid inconsistencies.

    If you want to go deeper into the specifications of this API is recommended reading
    the JSR itself.


    http://jcp.org/aboutJava/communityprocess/final/jsr179/index.html


    Within JavaME, the specification JSR-179 package consists of optional java.microedition.location
    and its internal components and basic functionality required to solicit and process
    results of localization.


