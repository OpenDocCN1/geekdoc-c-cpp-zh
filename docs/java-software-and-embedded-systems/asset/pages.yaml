    # LocationProvider Class


    This class represents the source of all information related to the location of
    the terminal. It has implemented the Singleton pattern that should be used to
    access the provider. When a reference is sought from the supplier is required
    after the creation of an object type criteria. This is because the supplier''s
    need to know certain criteria established to provide, the information has been
    requested.


    The following code shows an example of how to make the call to the method of creation
    of a provider:


    ```

    // default values for each object

    cr = new Criteria();

    //Adjust the horizontal accuracy level

    cr.setHorizontalAccuracy(100);

    //Adjust the vertical accuracy level

    cr.setVerticalAccuracy(100);

    //Provide information about speed and Course

    cr.setSpeedAndCourseRequired(true);

    //calling the factory method for singleton behaviour.

    provider = LocationProvider.getInstance(cr);

    ```


