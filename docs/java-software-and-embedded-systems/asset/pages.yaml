    # 4.2. Static Analysis


    Besides the modification of the execution platform, the enforcement of security
    constraints at the code level enables to improve the security properties of the
    applications in an important manner. Static analysis consists in verifying the
    compliance of the code with explicit constraints. It is usually performed at development
    time to enhance the quality of the code. This enables to perform verifications
    which could not be performed at runtime.


    Static analyzers are often executed as a post-development mechanism. They intend
    to be more lightweight than proper languages such as B that enable to specify
    systems in a formal manner. They therefore aim at providing a reasonable trade-off
    between the cardinal properties of analyzers: completeness, soundness and effectiveness.
    Completeness means that the checked property holds for all code that is analyzed.
    Soundness means that false positive, i.e. code corrects that are identified as
    being bugs but are not produced. Effectiveness relates to the capabilities of
    tools for finding bugs errors.


    A comparison of several tools for static analysis of Java programs is proposed
    by [45]. The authors consider JLint, PMD FindBugs, ESC/2, Bander. The conclusion
    of this study is that the tools find non-overlapping sets of bugs because they
    each take a different approach. Consequently no tool is sufficient and all tools
    are complementary. Moreover, no tool can always report correct results and false
    positives are unavoidable.


    Most tools are targeted at identifying generic bugs. Some as FindBugs consider
    a subset of security bugs. One tool that is presented to the research community,
    JSLint, is targeted at security bugs. Commercial tools also exist but no precise
    technical data are published.


    Bug Pattern Detection consists in identifying generic bugs that are described
    as structured programming constructs, the bug patterns. It focuses on syntactic
    features of the code. This approach aims at improving the global quality of the
    analyzed software. This makes it more robust and less likely to malicious users
    take advantage of its failures. However this can not be considered as a security
    mechanism since no specific attention is paid to exploitable vulnerabilities and
    their.


