    This class is standard information related to the location. Contains information
    about latitude, longitude, accurate, method for obtaining location and speed of
    the terminal.


    The constructor of this class is protected, the only way to get a location is
    to require the supplier. This prevents inconsistencies arising from the creation
    of undue locations.


    This class provides the encapsulation of the data set set out. It also provides
    a set of methods that encourage the use of the class. Such as isValid(), which
    verifies the reliability of the location provided, or getQualifiedCoordinates(),
    which provides an object of coordinates obtained with a precision set.'
