  md: '# Security for Java Platforms


    The obvious benefit of class loaders is the namespace isolation which prevents
    one component to access another without being explicitly allowed to. Moreover,
    system classes are shared which prevent inconsistencies.


    However, class loaders are not designed to support strong isolation. In particular,
    static variables in parent class loaders are shared. For instance, the System.out
    variable in the bootstrap class loader can be accessed and modified by all classes.
    This can lead to unrequired interference such as denial-of-service or data transmission
    that should not occur. Similarly, synchronized calls can be exploited. Moreover,
    they do not support resource isolation which is the necessary protection besides
    namespace safety. The last drawback of class loaders is that they cannot be simply
    removed to uninstall a component since this could inconsistencies in programs
    executed by others. For all these reasons, class loaders build an interesting
    feature of Java component platforms but can not be considered to be secure.


    Protection Domains are the solution provided by Sun for executing components in
    parallel. This approach is also known as Stack Based Access Control (SBAC) since
    it relies on the inspection of the class stack to determine whether all callers
    have sufficient rights to execute a given method. It is defined in [2, 58]. A
    technical presentation is to be found in [50].


    Per se, a Protection Domain is the set of objects currently accessible by a principal
    [46]. A Principal is the representation of an entity (an individual, a corporation,
    a login, a place in the file system) to which execution rights are granted. In
    the case of Java component platforms, a Protection Domain thus represents all
    objects that can be accessed by one component. It is made of insensitive code
    which can be called seamlessly and sensitive code to access is explicitly granted
    through a permission policy. The use of protection domains in Java applications
    requires that the security manager of the JVM or the policy file defined according
    to the requirements of the applications:


    ```

    java -Djava.security.manager -Djava.security.policy=java.policy ...

    ```


    Security checks are performed at runtime in the code of the application, the framework
    or the standard libraries through a call to the security manager:


    ```

    mySecurityManager.checkPermission( new ServicePermission(serviceName, ServicePermission.GET));

    ```


    The example shows the permission check in the OSGi platform when a service is
    requested. The security manager then performs operations: it reconstructs the
    class stack that leads the service and identifies principals; it checks whether
    all principal has sufficient rights to perform the sensitive calls. If they are
    not granted, a java.lang.SecurityException is thrown.'
