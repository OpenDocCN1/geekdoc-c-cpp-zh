    interfaces through specialized packages like Swing and the Standard Widget Toolkit
    (SWT). These attributes exhibit the vast possibilities for Java in real-world
    research.


    This chapter discusses robotics and AI efforts utilizing the Java programming
    language or Java-based methods. Emphasis is given on more discussing the breadth
    of use in these fields, coupled with real-world research examples. Thus, this
    is not intended to be a comprehensive overview, but rather a showcase of Java''s
    abilities and versatility.


    # 2. Java Efforts in Robotics and Artificial Intelligence


    One of the best assets for Java is the wealth of knowledge and tutorials available
    on the Internet. Novices can interact with experts to tailor how to exploit Java
    for the particular problem they are attempting to solve. The simplicity of Java
    makes it a great learning tool for robotics, monitoring of sensing components,
    and interfacing with devices.


    Applying object-oriented software engineering practices to complex robotics and
    intelligence algorithms allows in creating flexible, extensible, and swappable
    software architectures. These valuable in large-scale systems involving many sensing
    components and connected devices. Organization of such systems is paramount for
    both debugging and long-term maintainability. The following sections discuss some
    of the efforts using Java in robotics and artificial intelligence.


