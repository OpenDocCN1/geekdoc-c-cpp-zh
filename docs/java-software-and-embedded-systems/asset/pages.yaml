    # Conclusion


    In this chapter, a powerful analysis and simulation tool for embedded control
    system design has been presented. A discussion regarding the related automotive
    industry demands and the relevance of support tools for control system design
    has been provided. From these considerations, F.I.R.E. has been built up to provide
    multiple views of the Simulink model, because control system developers have to
    consider different aspects, not all visible with a single graphical notation.
    It mainly allows a graphical reorganization and an early timing analysis of the
    control system, according to the Auto-Code Generator requirements, with the objective
    of automatically generating the production code for the ECU directly from these
    models.


    This software has been tested and validated on real applications, and the relevance
    of this tool has been illustrated by investigating different closed-loop system
    behaviours which result from bad scheduling choices and by the tool assistance
    in finding the most correct time slicing for each task. Future developments include:


    +   - automatic discretization of continuous-time blocks in the Functional to
    Implementation transformation,

    - joint comparison of simulation results between functional and implementation
    views, inverse transformations and overall consistency checks among the views,

    - explicit specification of the execution order of subtasks within each task in
    the Functional to Implementation transformation.


    Another important feature that can be added is the possibility to undertake more
    investigations and comparisons between different scheduling policies (e.g., priority-preemptive
    scheduling and Earliest Deadline First (EDF) scheduling) and a deeper analysis
    of the synchronization among tasks that use shared data for their computation.
    It could be interesting to investigate the delay due to common data access and
    the transmission rate into the network by integrating the F.I.R.E. tool with handmade
    scripts or other blocks representing different schedulers, networks and monitors
    for synchronization, in the TrueTime platform.


    > 7 Simulink simulation engine uses a fixed-priority Rate Monotonic (RM) scheduling
    to simulate multitasking models.'
