    # 2. Background


    Of the simplest methods of frequency tuning a microstrip antenna is to load with
    varactor diode. The reverse bias applied to a varactor diode will alter the capacitance
    by the loaded RLC circuit i.e antenna, thus changing the resonant frequency. Simple
    as it may be, the implementation of such a configuration is tricky. The change
    in capacitance for varying loads is not linear in fact it has an exponential variation
    in nature. Thus for accurate prediction of resonant frequency, one needs to calibrate
    the system. It is not possible to obtain the same return figures for the tuned
    antenna given a constant location of feed probe. Given all the above constraints,
    an electronically tunable microstrip opens up new possibilities in innovative
    use. Instead of attempting to design a broadband antenna, one can tune the antenna
