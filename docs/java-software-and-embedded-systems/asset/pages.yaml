  md: '# Java in Ambient Intelligence Applications


    +   * LocationListener: This interface represents an observer who receives events
    at a particular provider.

    * ProximityListener: This interface represents an observer who receives events
    related to the detection of proximity to coordinates previously stored.

    * AddressInfo: This class is a wrapper that stores information about addresses

    * Coordinates: This class represents the physical and geographical coordinates.

    * Criteria: This class provides a set of values which will be configured as the
    provider

    * LandMark: This class is a wrapper that holds information about a landmark

    * LandStore: This class provides a store brand that provides the basic operations
    of insertion and deletion.

    * Location: This class represents the values that set a standard location

    * LocationProvider: Main engine of API, this class is the source of information
    about location.

    * Orientation: This class is a wrapper that collects information from the physical
    orientation of the terminal.

    * QualifiedCoordinates: This class represents physical and geographical coordinates
    of wings attached to a period.

    * LandmarkException: This exception will be thrown when an error occurs to the
    handling of landmarks.

    * LocationException: This exception will be thrown when a general error occurs.


    This specification, like the rest of JavaME implementation has associated security
    permissions to enable the resource that provides location. The security permissions
    are:


    | Security Permission name | Methods protected |

    | jav.microedition.location.Location | LocationProvider.getLocation(), LocationProvider.setListener()
    |

    | jav.microedition.location.Orientation | Orientation.getOrientation() |

    | jav.microedition.location.ProximityListener | LocationProvider.addProximityListener()
    |

