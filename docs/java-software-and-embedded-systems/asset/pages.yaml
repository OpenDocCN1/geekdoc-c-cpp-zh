  md: '# 94 Alessandro Casavola, Ferdinando Cristofaro and Iolanda Montalto


    This view improves the re-usability of a control algorithm, because it provides
    a physical representation of the control system in which the process resources
    physical location is illustrated.


    # F.I.R.E. Tool Objectives and Main Functionalities


    The development of an embedded system ensures the cooperation of different planning
    activities. In particular, the interaction between the design and algorithm implementation
    phases requires a (fragile) information sharing between control and software engineering
    groups. On the other hand, the control and software engineers have different points
    of view, design approaches, terminology and development tools.


    Up now, the system designer is in charge of choosing the most suitable view to
    model a control system, and all transformations of the Simulink® models, realized
    in collaboration with the software engineer, are manually accomplished. Such activity
    is slow and affected by possible unavoidable errors and omissions.


    F.I.R.E.^4 has been created to automate these transformations, ensuring consistency
    in each view of the same system. F.I.R.E. is a software tool which allows the
    designer to design, to analyze and implement embedded control systems at a high
    abstraction level. It helps realize more correct and efficient implementations
    of the functional graphical models, it supports the early steps of the V-cycle
    design methodology [4], ensures more flexibility and re-usability of the Simulink®
    models and improves the development cost and time. Moreover, F.I.R.E. assures
    that the implementation is realized according to the Auto-Code Generators (ACG)
    requirements [8].


    The Simulink® library has been extended to support the design of the F.I.R.E.
    models providing a user-friendly graphical interface. From these models, the control
    engineer can carry out an early evaluation of the timing problems potentially
    affecting the control system, such as delays in the data flow, jitters, potential
    data-loss in buffers, and priority task handling ([111] and [122]). A simulation
    with different sampling times on the same system is also possible. In this way
    the results of such an analysis can be used by the software engineers to produce
    more correct ECU codes.


    It is important to notice that the transformation from a functional view to a
    re-usability consists in a graphical blocks rearrangement, which is useful during
    the reverse engineering phase, while focusing on some particular hardware dependencies
    of the control system is of interest. Moreover, transit from a functional view
    to an implementation offers a logical tasks reorganization by their timing requirements.
    On the other hand, the implementation view makes it possible to analyze different
    multi-rate simulations by acting on the scheduler block.


