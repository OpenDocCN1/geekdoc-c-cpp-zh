    Accordingly, there are several approaches developing mobile systems such as platforms,
    frameworks and applications for offering context-aware services. The Context Toolkit
    proposed by Dey et al., 2001 assist for instance developers by providing them
    with abstractions enabling to build context-aware applications. The Context Fusion
    Networks (Chen et al., 2004) was introduced by Chen and Kotz in 2004. It allows
    context-aware applications to select distributed data sources and communicate
    with customized data fusion operators into an information fusion graph. The represents
    how an application computes high levels of understanding its execution context
    from low-level sensory data. The Context Fabric (Hong, 2002) is another toolkit
    which facilitates the development of privacy-sensitive, ubiquitous computing applications.
    This is another platform Gaia (Schmidt et al., 1999), which was developed by Roman
    et al. 2002 and was designed to support the development and execution of applications
    for ubiquitous computing spaces in which users interact with several devices and
    services at the same time. RCSM is another middleware proposed by (Yau and Karim,
    2004) designed to provide the properties of context-awareness and ad-hoc communications
    to the applications. It provides an object-based framework for supporting context-sensitive
    applications like CORBA (OMG, 2000) or Tao (Gokhale and Schmidt, 1999) for fixed
    networks. There are previous approaches like (Burke et al., 1996) which use a
