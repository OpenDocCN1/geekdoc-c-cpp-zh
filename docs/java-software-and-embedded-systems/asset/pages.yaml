    # Introduction


    Today, motor vehicles are equipped with a set of embedded control systems with
    an increasing number of software-implemented features. The design of such systems
    is a challenging problem because of the functions'' complexity to be implemented,
    for the constraints that are due to the tight interaction between mechanical and
    electrical components and for safety reasons. Moreover, automobile manufacturers
    have to deal with several goals, i.e., customer requirements and satisfaction,
    development time, cost reduction and quality criteria fulfillment.


    Current software development is aided by simulation tools that allow block diagram
    generation, providing customers with a graphical environment that supports the
    design and the simulation activities and can be on PCs.


    However, much is required for the complete development of embedded control systems.
    The current lack of automated tools (see [1] and [2]), methods and models make
    the whole process tedious, time-consuming and potentially affected by errors and
    omissions because most stages are handmade, in the earlier stages.


    The main goal of this work is to present some ideas for automating the whole embedded
    control system design process. As a result, many of the above ideas have been
    implemented in the F.I.R.E environment, which supports embedded control systems
    modelling, design and simulation at a high level, allowing control engineers and
    software developers to focus on the control system aspects of the problem inside
    the platform².


    Another relevant aspect when dealing with modern internal combustion engine control
    systems is the availability of new robust and multi-objective engine calibration
    methods and tools, which potentially allow substantial new flexibility and performance
    with respect to the traditional calibration practice. In this work, a novel general-purpose-based
    calibration methodology will be described, which merges statistical concepts like
    the robust design theory of experiments, numerical optimization techniques and
    Engine Control Unit (ECU) algorithm modelling. This approach explores software
    tools in order to support the calibration of estimation algorithms used in the
    ECU. The proposed tools are


    +   - non-linear multivariate regression,

    - discrete regression,

    - multi-map optimization,

    - graphical user interface for calibration, validation and change,


