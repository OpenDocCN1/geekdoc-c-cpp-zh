  md: '# Standard Files


    To make easy the information exchange, some standard file formats and contents
    have been defined.


    # Engine Bench Data


    The engine bench data file is generated at the bench test. It is an Excel sheet
    that contains, in the first row, the names of the acquired variables while in
    the second row there are the measurement units, and, from the third row, the acquired
    data values. Every row represents an operating stationary point, characterized
    by the measure of input-output values after a stabilizing time. The measure lasts
    for a predetermined amount of time. All the acquisition process can be automated.


    Usually the data are acquired in a first phase for calibration purposes and in
    a second phase for calibration verification.


    # Calibration


    The calibration file has to contain information about the ECU parameters related
    to the calibrating algorithm.


    # Developed Tools: Application to a Real Engine Calibration


    The following tools have been developed in the MATLAB®7/Simulink environment.
    They are currently used by the calibration engineers for real engine applications.


    # Air Charge Estimation


    Before the introduction of the above described tools, the experimental plan took
    15 days (24 hours per day). This effort had to be multiplied by the number of
    significant changes in the hardware during the calibration phase, which are usually
    up to four. The data analysis requires almost 5 days for each plan. The resulting
    maps present a significant number of discontinuities and the estimation error
    is not satisfactory.


    The calibration tools were introduced in the development process at the start
    of one real calibration phase. The experimental plan time has been halved, now
    taking 8 days, 24 hours a day. The data analysis now needs a few hours. The estimation
    is almost halved and it is now fully satisfactory.


    **Automatic calibration:** The criteria exploited by the calibration engineers
    have been implemented in this tool. The synergies between the calibration department
    and the engine test department produce the continuous enhancement of the automatic
    calibration tools.'
