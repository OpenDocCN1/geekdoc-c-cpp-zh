    Figure 3. The hierarchy of class loaders


    component has access to the classes of its parent class loaders as well as its
    own classes. This ensures that no naming conflict can occur if several components
    contain classes with the same name. As shown in Figure 3, the component 1 and
    3 can both have an internal class named my.package.Foo that have different implementations.
    They will share system classes such as java.lang.System


    Each class loader has the following behavior. It first checks whether the class
    to be loaded is already available. If this is the case, it returns it. Otherwise,
    it delegates the search for the new class to its parent class loader. If this
    request is unsuccessful, i.e. if none of the class loader in the hierarchy finds
    it, the current class loader searches for the class itself with the findClass()
    method.


    The default class loaders of the hierarchy are the bootstrap class loader, the
    extension class loader and the system class loader. The bootstrap class loader
    has access to the classes that are required to load the JVM (rt.jar archive) and
    the internationalization classes (i18n.jar). The extension class loader is responsible
    for extension classes such as the implementation of cryptographic libraries. It
    concerns the archive that are stored in the lib/ext/ directory such as the sun.provider.jar,
    sunkscli.jar or located.jar archives in the case of the Sun. The system class
    loader is responsible for the classpath, which is set through the CLSPATH environment
    variable or the -classpath option of the JVM. Additional class loaders can be
    defined by the applications or by the framework used. Classes can be shared between
    the bundles and thus between the class loaders through a specific package import
    and export mechanism.


    Java Software and Embedded Systems, edited by Matt Hayes, and Isaac Johansson,
    Nova Science Publishers, Incorporated, 2010. ProQuest'
