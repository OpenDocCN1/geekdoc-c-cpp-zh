    Another Sun SPOT was used as the dedicated inter-robot communication node, sending
    packets over radio to specific robots (based on the ID of the radio onboard the
    robot it is communicating with) or to all robots (broadcast). This node was responsible
    for filtering messages not intended for that robot, and passing on valid outgoing
    or incoming messages. Communication between nodes on the same robot occurred through
    sending data over serial or I2C lines from one device to another. All of this
    was made possible through a Java implementation of the Joint Architecture for
    Unmanned Systems (JAUS) [10]. JAUS is a formal message passing specification for
    systems with multiple robots, devices, or device components. It provides a common
    message format and protocol, to avoid language differences or device specific
    details. Each subsystem component implements its version of the JAUS protocol
    using a language compatible with its hardware (e.g., C, C++, or Java in this case).
    Once implemented, each component in the system was referred similar to an IP address
    in a hierarchical fashion. Each robot represented a subsystem within the multi-robot
    system. Figure 16 demonstrates how the system was decomposed into JAUS subsystems,
    nodes, and components.


