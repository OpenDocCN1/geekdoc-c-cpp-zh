    16MHz microcontroller. The Robotics connects to the Gumstick through a 60 pin
    Header connector and contains multiple features including PWM, GPIO, ADC, I2C,
    SPI, UARTs and others. Ch scripts running on the Gumstick can control the Robotics
    by issuing commands over I2C. An i2cio binary can be installed to provide users
    direct access to I/O lines and registers over I2C. A complementary Gumstick i2c-io
    library provides users'
