  md: '# Preface


    xi


    of view is that aware users of an infrastructure, rather than R&D competitors.
    This is the case of the project presented in the following, representing a success
    story in which the discussion between a research group and a small enterprise
    led to the identification of the requirements and the joined development of a
    common software infrastructure. When the project started in 2004, both partners,
    ie the Autonomous robotic systems and control group of CNR-ISSIA and Green Project
    Srl, had to substitute the obsolete platforms of their marine robots and marking
    machines for casting products with a stable software and hardware infrastructure
    of superbly integrating technological improvements while remaining compatible
    with the past (backward compatibility). On the basis of considerations, discussed
    below, about system reliability, development and maintenance costs (including
    human resources), foreseen compatibility and general technical soundness, the
    choice was to verify the possibility of using standard GNU/Linux for embedded
    real-time applications. The result is the main technical contribution of this
    chapter, ie the practical demonstration of the possibility of using standard GNU/Linux
    for implementing embedded real-time control systems working up to a sampling frequency
    of at 2 Khz. Furthermore, four years later, the developed system is still demonstrating
    its capabilities fairly integrating technological improvements and increasing
    more and more its performance thanks to the new realtime properties of the Linux
    kernel.


    A first operative release of the platform was completed in 2005 and integrated
    with the CNR-ISSIA Charlie unmanned surface vehicle (USV) for robotics research.
    A second application was the porting to the platform of the software of the control
    system of Hammer, a steelwork industrial machine used for marking continuous casting
    products, developed by Greenproject s.r.l.


    At the moment, the platform is supporting the development of the ALANIS (Aluminium
    Autonomous Navigator for Intelligent Sampling) USV for surface and underwater
    coastal monitoring. More, the integration with generic field buses and image acquisition
    systems is being carried out.


    After an introduction reporting a summary of related research in the field and
    a discussion of the platform requirements, the key points of the followed methodology
    for making GNU/Linux real-time will be presented. Finally, two applications, a
    research one and an industrial one, pointing out the basic real-time structures
    that the platform is required to implement, will be described in Chapter 10.'
