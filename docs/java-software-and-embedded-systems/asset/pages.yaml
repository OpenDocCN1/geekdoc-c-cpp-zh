    # 4. Case Studies


    We implemented IDM for Java5 as a pre-compiler but consider our proper and lightweight
    mechanism to be integrated in a Java compiler.⁴ To assess its relevance, we measure
    the impact of the proposed method in three open-source projects: JHotDraw, a GUI
    framework; Jfe, an editor for Java binaries; and java.io, a standard Java package
    providing different streams. The package java.io is based on abstract classes
    instead of interfaces (with the side effects discussed in Sec. 2) which forced
    us to prepare the classes with Extract Interface refactoring [10]. We show the
    study''s results in Table 1.⁵


    We removed forwarding and empty methods in the programs, we instructed an interface
    declaration. After removing these methods – we generated from 180 to 107 methods
    (2.2 to 5.7% of all methods) and saved 32 to 270 lines of sourcecode. Using IDM,
    we pruned 27 classes for JHotDraw (4.5% of all classes), we pruned one class and
    ones respectively (1.5% and 9.2%) for Jfe and java.io. Notably, in JHotDraw using
    IDM, we generated 24 methods for one class (NullDrawingView). In Jfe, we generate
    18 methods for one class (NavigationClassVisitor) which contains 30 methods and
    in java.io we generate 15 methods for one class (ObjectInputStream) which contains
    53 methods at all. Some classes even become empty with IDM which allowed further
    simplifications with refactorings; in JHotDraw two classes become completely empty,
    four classes (one in JHotDraw and three in java.io) become empty of methods except
    one delegate method to forward.


    We observed that some methods could not be generated. Default methods of an interface
    cannot be generated if they are not homogeneous (i.e., they do not perform the
    same actions) or are different from forwarding or empty methods. In most cases
    (9% in our case studies) a method is not a default method and cannot be generated.
    However, IDM saved implementing up to 5.7% of all methods.


    # 5. Discussion


    In our cases, we observed that all default delegate methods could be generated.
    The developers of JHotDraw, Jfe, and java.io could have saved writing up to 5.7
    % of all methods with IDM.


    IDM only generates homogeneous methods that either simply forward messages or
    are empty. Although the tackled problem of repetitive methods is small, to solve
    it is beneficial because it is typical for systems that actually use delegation.
    Notably, our approach is lightweight, makes only minimal changes to the language,
    and is backward compatible with legacy applications.


    IDM does not impair type safety because only generated methods that the class
