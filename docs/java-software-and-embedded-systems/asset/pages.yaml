    ```

    void sendFile(File f, String string) throws IOException {

    javax.microedition.io.Connection con = Connector.open(string);


    ClientSession cs = (ClientSession)con;

    HeaderSet hs = cs.createHeaderSet();

    cs.connect(null);


    hs.setHeader(HeaderSet.NAME, f.getName());

    hs.setHeader(HeaderSet.TYPE, "image/jpeg");

    hs.setHeader(HeaderSet.LENGTH, new Long(f.length()));


    putOperation operation = cs.putOperation();


    OutputStream outputStream = operation.getOutputStream();

    InputStream is = new FileInputStream(f);

    for (long i=0; i<f.length(); i++

    outStream.write(is.read());


    is.close();

    outStream.close();

    putOperation.close();

    cs.disconnect(null);

    con.close();

    ```


    Sample 14. BluetoothDiscover sendFile method.


    This other method can get a connection string obtained from the services list,
    as an image file can be used using the OBEX protocol, in which, information is
    sent using an stream flow as a system file stream or the system console stream.



    +   Connection to the device: The first time, it is necessary to write a password
    in the mobile device and the operating system of the computer sending the file,
    that functionality bind to Java.

    Communication of headers: Before to send information through OBEX, it is needed
    to send a header defining the MIME type format, the name of the file, and its
    length, so by this way there is a Buffer overflow protection.

    Sending information: After, data is send using an output stream, in case it can
    be done using Java capabilities and be able to use stream oriented classes like
    the Buffered''s.

    Connection close: once the transmission is finished, the connection will be closed
    like a file stream, so the OBEX service will be available.'
