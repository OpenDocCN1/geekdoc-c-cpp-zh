    # Gasoline Injector Model


    Automatic calibration: This tool automatically calibrates the gasoline injector
    model (Figure 11). It uses the same engine bench test data for charge estimation.
    The discrete regression tool easily calculates the map which minimizes the error
    between the injected gasoline estimation, done by the ECU, and the measured one.


    # Spark Advance Calculation and Torque Estimation


    Automatic calibration: The torque supplied by the engine is estimated mainly by
    the engine speed, air inlet efficiency, cam phase position and spark advance ([13]
    and [14]). In an engine without the cam phase, the algorithm uses two maps and
    one vector:


    +   - MTA (speed, eta), called the maximum torque map advance: it describes for
    each engine speed/air inlet efficiency, the spark advance that maximizes the torque.
    If the detonation occurs before reaching the maximum, an extrapolated value is
    used to fit the data. In Figure 15, the x-coordinate of the red triangles represents
    the maximum torque.

    - MT (speed, eta), called the maximum torque map: it describes the indicated torque
    measured at the maximum advance. In Figure 15, it is represented by the y-coordinate
    of the red triangles.

    - UC (advance – MTA [speed, eta]), called the unique curve: it describes how the
    distance between the spark advance and the maximum spark advance reduces the torque.
    If the output is 1 if the input is 0. The output decreases while the difference
    increases. It is very similar to a parabolic curve and it has the property to
    fit well the experimental data in the equation


    TORQUE = MT (speed, eta) * UC (advance – MTA [speed, eta]) (2)


    where:


    +   - speed is the engine speed

    - eta is the air inlet efficiency

    - advance is the actuated spark advance


    The hyper surface that describes the torque delivery has to be continuous, because
    it describes a physical phenomenon. The multi-map optimization automatically finds
    the values of the maps which fit the experimental data. The result is very continuous
    (Figure 14).'
