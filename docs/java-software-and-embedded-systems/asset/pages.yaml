    The final goal of the intelligent agent (AMI) is to construct intelligent environments
    that facilitate ubiquitous access to the physical location. This ubiquity has
    produced the growth of wireless devices (especially handheld devices) in recent
    years. Wireless networks are location independent; provide a wide range of coverage
    and extended wired communication techniques. Protocols used to communicate in
    wireless technologies are mainly classified in the 802.11x protocol family for
    Bluetooth, infrared and protocols used in mobile phones within the GPRS or UMTS
    technologies. Other technologies that must be taken into account are GSM, GPS,
    RFID and ZigBee. Wireless LANs, also known as Wi-Fi (Wireless Fidelity) networks
    are used to replace or as an extension of wired LANs.


    Many developments have been carried out over these technologies to develop user-centric
    systems. Many of this development need to process information in a multi-device
    platform that allows mobility and user-friendly interaction. Many examples of
    this new development in domestic house, assist assisting living, new surveillance
    paradigm, etc. The development of a multi-device platform requires a common language
    to facilitate the development of complex device-dependent applications.


    From this set of technologies and device-dependent applications, we select two
    different works related with Bluetooth and GPS-GSM communication to facilitate
    user interaction and allowing developing location system, respectively.


    Bluetooth is a technology that utilizes a short-range radio link and operates
    in the 2.4 - 2.48 GHz frequency band. Bluetooth is a technology that facilitates
    the interaction between devices providing a high reliability and low-consumption.
    Using this technology, we'
