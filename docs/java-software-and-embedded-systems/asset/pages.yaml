  md: '# The Java Virtual Machine


    Automated Memory Management consists of hiding memory allocation and de-allocation
    from the language. It is done by postponing these operations from the compilation
    phase as in C and C++ to runtime. The virtual machine is itself responsible to
    allocate required memory at object instantiation and release the memory that is
    no longer used by a Garbage Collector (GC). Garbage collection is performed by
    maintaining a list of objects in use. When an object is referenced by all callers,
    it can be removed safely. This prevents development errors. It also prevents malicious
    code from directly accessing the memory, which makes the resulting code more robust
    against attacks. Additional mechanisms are enforced to guarantee the integrity
    of the memory. For instance, array bounds are checked to prevent reading or writing
    data outside the defined data structures. This prevents buffer overflows and eliminates
    one potential attack vector used for executing malicious code.


    Bytecode Validation mechanisms are presented in Section 2..2.. guarantee that
    the executed bytecode is compliant with the specification and prevents the forgery
    of instruction suites that could not be derived from the source code by a valid
    compiler.


    Modularity mechanisms are presented in Section 2..3.. They enable to execute components
    with no naming conflict and unintended access. In particular, they target classes
    that are loaded from diverse locations such as remote servers.


    The security mechanisms for the Java language might the Software Security, e.g.,
    language features, and the Application Security approaches in a much integrated
    way such as modular support. It is a powerful illustration of the complementarity
    of the two techniques: Software Security is enforced when possible to assert security
    properties in an efficient manner. When it is not sufficient, it is complemented
    with Application Security mechanisms.


    # 2.2. Bytecode Validation


    Loaded Bytecode is considered untrusted. It must be completely validated before
    its execution to ensure it is compliant with the specification. This validation
    occurs in the Bytecode verifier of the JVM immediately before the code is loaded
    in memory [29]. It is complemented by runtime checks in two cases: when the required
    information is not available during validation, e.g., when several libraries are
    used together and when optimizations make runtime checks more efficient.


    Figure 2 shows the process of Bytecode validation.


    The code is generated from a .java source file to a .class class file by the compiler.
    Language specifications are enforced here but no guarantees that 1) the compiler
    is valid [54], 2) the Bytecode has not been forged without compiler or 3) the
    file is not modified during its transfer through the network or any other medium.
    When it is loaded, the Bytecode is first checked in the System Service Unit (SSU)
    of the JVM, before being forwarded to the Execution Unit (ExecU) for JIT compilation
    or interpretation.'
