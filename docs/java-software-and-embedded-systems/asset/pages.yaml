    # 4.2. Sor Behaviour


    Once a bundle has been deployed and started within a framework, the SOR Registration
    Agent begins its work. The SOR Registration Agent (SRA) implements the OSGi ServiceListener
    pattern, looking for events in the framework concerning valid or SOR-compliant
    service-providing bundles.


    When an event of the type STARTED or STOPPED is released, the SRA will parse and
    get the information if only the bundle is SOR-compliant. As it has been commented
    in the previous section, the property "SOR.PUBLISH" will be the key.


    At this time, the SRA will get the ServiceReference from the ServiceEvent object,
    and from another property "objectClass" the names of classes deployed in this
    bundle will be obtained. Now, for each valid object class string a generic class
    will be obtained, from which the SRA will start getting method information.


    For the first case, in a STARTED event, SRA will only get information from method
    annotations (and from the methods themselves) if Annotation is valid; if information
    can only partially be retrieved, in order it will not make the method be invoked,
    so method parsing is considered. If a valid Annotation is found, SRA will use
    one of the Java Reflection API to get all required data from its name, arguments,
    types, etc. In the second case, when a STOPPED event is fired, SRA will have to
    find if a SOR-compliant bundle has been involved in that event, in order to leave
    the SOR registry in a consistent state with the respect published in the OSGi
    registry.


    Using Annotations and the Java Reflection API, service-providing bundles will
    not have previous SOR knowledge, nor will they have to include a reference to
    that bundle in their manifest. This way, the deployment of services in the framework
    is absolutely dynamic and independent of the interface pattern connected.


    When a S is registered in the SOR architecture, it can then be invoked by a client
    bundle. The client will have to get a reference to SOR, by adding an extra reference
    to it. It will then have to specify to the SOR Invocation Agent (SIA) details
    relative to the DomainConcept which may be related, and a set of Arguments which
    to execute the method.


    Then, the SIA will query the Domain related to the main DomainConcept provided
    by the client, to get a top-level view of services in the system. When finding
    services related to that Domain the process will take a step forward and look
    for compatibilities in the number and type of arguments provided. If no case is
    found, the client will get a NoS3CompatibleException, indicating this event. The
    client will not have to take care if the service is static or not, because the
    SIA will get the class object instance if required (or not) and make the invocation
    in an absolutely transparent way for the end-user.


