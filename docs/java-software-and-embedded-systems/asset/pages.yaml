  md: '# The Power of Reflection


    # 4.3. Distributed Concepts for the SOR Architecture, D-SOR


    The Distributed Semantic OSGI Service Architecture (D-SOR) supposes an evolution
    of SOR. It adapts and creates new agents that take advantage of more distributed
    information, available from D-SOR nodes in the network or from Service Providers
    that can directly be interrogated in the need of services.


    D-SOR complements the actual OSGI service architecture, adding functionalities
    that do not prevent the default search and invocation engine of the OSGI framework.
    The SOR in memory registry makes it possible, providing new searching capabilities
    that go further from local search, and adding new layers to the OSGI architecture,
    without the need of any additional library bundle.


    The new functionalities are related to remote management, invocation mode of services,
    self-configuration and communication with external systems for information retrieval.
    These concepts are summarized in the following lines:


    Clients can modify the D-SOR behaviour exchanging messages with the agent for
    remote management, and other D-SOR nodes can modify the characteristics of a certain
    node to fit in the cooperative network.


    Regarding the invocation functionality, two invocation modes are provided: ''findAndInvoke''
    and ''retrieveBundleAndInvoke''. With respect to the self-configuration, in the
    first connection or in reconnection, the D-SOR node can acquire the network how
    the actual configuration is, and then configures itself according to.


    The composition of D-SOR, as well as the main relations between its components,
    is depicted in Figure 5.


    D-SOR is an agent-based architecture, consisting of four entities that are responsible
    of different tasks in the modularized structure. These agents are:


    +   * SOR Registration Agent (SRA)

    * SOR Invocation Agent (SIA)

    * SOR Information Agent (SFA)

    * SOR Internal Agent (STA)


    The local registration of services in D-SOR is similar to the basic registration,
    so SRA always maintains its functionality. In this approach one is not listening
    to registration events in other nodes, so when a service is needed but not found
    in the local system, a searching process is started as spreading questions, in
    order to find an appropriate service.'
