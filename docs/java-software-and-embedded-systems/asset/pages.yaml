    for class-sharing components and $SOP$ for object-sharing, or SOP components.
    The cardinality of each class is $N_{SA}$, $N_{CL}$, and $N_{SOP}$. $N_x$ is the
    cardinality of vulnerabilities that are exposed through object-sharing, but also
    through class-sharing in specific cases. It is the case of **synchronized** calls,
    which introduce freezing risks in applications, and can be performed in a class-sharing
    context provided that the related method can be performed normally. Cardinalities
    are here given at the example of the ''Vulnerable Bundle'' catalog [44], which
    summarizes known vulnerabilities that malicious components can exploit to others.


    These cases call for two important shifts in the Java development community: the
    training of developers to be aware of the flaws they may introduce in their applications
    and the extensive use of automated tools to identify at least the most common
    of these issues.


    # 4. Security Extensions


    The limitations of the default security model and the existence of vulnerabilities
    in Java applications lead to the development of security extensions: platform
    extensions, specific coding constraints and behavior injection mechanisms.'
