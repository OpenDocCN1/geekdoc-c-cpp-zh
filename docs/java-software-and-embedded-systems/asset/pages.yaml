    # 1. Introduction


    The Java environment is composed of two main parts: the Java language specified
    in [28] and the Java virtual machine specified in [38]. It is designed with the
    assumption that no software entity is to be trusted and, therefore, that each
    needs to be checked. The first success of Java was the injection of Java Applets,
    which enabled fully untrusted code provided by unknown Web sites to be executed
    in a browser [19]. This feature demonstrated the isolation brought by the Java
    Virtual Machine (JVM) between the applications and the underlying operating system.
    It is made possible because each internal unit of the JVM is designed to enforce
    such security.


    Figure 1 shows the architecture of a Java Virtual Machine (adapted from [15]).


    ![](img/c669dc86947c1e394b7ee25b3acc20f3_157_0.png)


    Figure 1. Architecture of a Java Virtual Machine


    The units of the JVM are:


    +   - SSU: The System Services Unit. It contains the class loader and Bytecode
    verifier, the thread management, management and debugging tools and timers.

    - MMU: The Memory Management Unit. It contains the reference handling, finalization,
    garbage collection and fast allocation mechanisms.

    - ExecU: Execution Unit. It contains the exception handling, Just-In-Time (JIT)
    Compiler, Interpreter and JNI mechanisms. It is responsible for executing runtime
    operations.

    - OS Virtualization Layer: a platform-independent abstraction layer to access
    host resources. It is the very module that is in charge of application virtualization.


