    # 3. Web-Based Embedded Computing


    When dealing with remote embedded systems such as sensor nodes, physically interacting
    with the system to gain data or to change control parameters may be impractical.
    Embedded systems developers have started using Web-based user interfaces as a
    means of interacting with their systems. This section introduces the use of Web-based
    embedded computing to interact and control remote embedded systems and describes
    their implementation using Ch and the Ch CGI toolkit. An example of a bio-production
    execution systems is provided where networked bio-production machinery and sensors
    can be controlled and checked through an embedded Web-based interface.


