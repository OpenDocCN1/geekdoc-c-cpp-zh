    Java is heavily used in a variety of research applications, due to its ease of
    use, maintainability, and portability. In Chapter 6, the use of Java in robotics
    and artificial intelligence is discussed, accompanied by examples of Java-based
    research in these areas. The authors have developed software architectures for
    research in robotics and artificial intelligence using Java, for two autonomous
    polar robots, which were deployed in Greenland and Antarctica require both reliable
    and robust software to minimize failures during autonomous operation. Also, a
    team of low-cost exploration and mapping mobile robots have been built, using
    Java SPOTs as means of wireless communication and coordination, and a custom inertial
    measurement (IMU) for tracking robot pose. As of this development, Java was additionally
    used to implement a portion of the Joint Architecture for Unmanned Systems (JAUS)
    communication protocol. Currently, involving collaborative multi-agent machine
    learning is performed with the Java-based WEKA learning suite and addition Java
    wrapper. These applications illustrate that Java has a wide range of research
    applications in the fields of robotics and artificial intelligence.


    The environment is composed of two parts: the Java language and the virtual machine.
    It is designed with that no software entity is to be trusted and, therefore, each
    needs to be checked. The first success of Java was the inception of Java Applets,
    which enabled fully untrusted code by unknown Web Sites to be executed in a browser.
    This feature demonstrated the isolation brought by the Java Virtual Machine (JVM)
    between the applications and the underlying operating system. However, the evolution
    of Java systems from mono-application to multi-component systems introduce new
    vulnerabilities developers are not aware of. They require additional security
    mechanisms to support secure environments.


    This survey presents an overview of the security issues for the Java language
    and Virtual Machine. The default security model is defined and explained. Three
    main components are the Java itself, the Bytecode validation for logic and modularities
    such as the class loaders and permission domains. Known vulnerabilities are presented.
    They originate either in the JVM or in the code of applications. Two approaches
    exist for describing code vulnerabilities: source code and Bytecode. This duality
    enables us to identify them both during development through manual code review
    and tools, and in an automated manner during code deployment or installation.
    Security extensions for the Java Execution Environment and tools for writing Java
    code are presented of three types: platform extensions, static analysis approaches
    and behavior injection. Platform extensions in strengthening the isolation between
    components (beans, etc.) and providing support for resource accounting and control.
    Static analysis is performed through'
