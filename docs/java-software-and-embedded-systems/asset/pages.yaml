    # 1. Model-View-Control (Mvc)


    Model View Control is composed of view for receiving inputs from GUI, control
    for judging of the inputs for model and the model for storing the inputs. MVC
    consists of three design patterns enables avoid complexity of software architecture
    in the application, and simplicity of the software architecture can update the
    structure easily. In the case that MVC is used in GUI application, compound design
    pattern is composed of composite design pattern, controller as strategy design
    pattern and model as observer design pattern. On the other hand, Spring Frame
    Work is used in web application.


