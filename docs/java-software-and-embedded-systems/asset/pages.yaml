    Moreover, following limitations of the Java Stack Inspection policy are identified
    in the literature [23]:


    +   - If a new thread is created within a doPrivileged block then that thread
    will continue to enjoy amplified privileges, though its code might not be within
    the scope of a doPrivileged block and even after its creator has exited within
    the doPrivileged. This is because new thread starts execution with a copy of its
    creator''s call-stack (whose frame is marked as being within the scope of a doPrivileged).

    - When a class B extends class A but not the protection domain for A (and not
    B) will always be used by checkPermission for foo()''s stack frame. Because B
    can extend A in ways that may act the semantics of foo, (such as by overriding
    other methods), one might argue that the wrong protection domain is being consulted.


    # 3. Vulnerabilities


    Vulnerabilities in Java-based systems can be found in two distinct locations:
    the virtual machine and application code. Their disclosure acts as a strong incentive
    for JVM developers to increase the security level of the system.


    # 3.1. Vulnerabilities in the Java Virtual Machine


    Generic JVM Vulnerabilities can be identified. A comprehensive analysis of bug
    databases of Sun JVM and Jikes is proposed by [41, 14]. They can be exploited
    to perform at least denial-of-service exploits. Statistics related to the origin
    of failures are extracted from a selected set of bug entries: 103 bugs from Sun
    and 28 bugs from Jikes. Consequently, only those two VMs are directly concerned
    by the given results.


    +   - Garbage collection is responsible for 73 % of the failures in the memory
    management unit (MMU).

    - Runtime support operations such as invocation, stack allocation and deallocation,
    exception handling and optimized Just-in-Time (JIT) compilation are responsible
    for 77 % of the failures in the Execution Unit (ExecU).

    - Thread management is responsible for 76 % of the failures of the System Service
    Unit (SSU).

    - Most of the failures (80 %) occur when the JVM is running under an important
    work-load.


    JVM optimizations such as garbage and JIT compilers are clearly identified as
    reliability bottlenecks. A clear trade-off appears here between performance and
    reliability.


    ```

    ³http://jikes.org/

    ```


