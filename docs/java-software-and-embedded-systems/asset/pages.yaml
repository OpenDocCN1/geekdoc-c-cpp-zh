  md: '# Reducing Code Replication in Delegation-based Java Programs


    # 7. Conclusions


    In this paper, we addressed the problem of default methods in delegation and interface-programming
    and discussed its impact in different styles of object-oriented programming design
    patterns and frameworks. We proposed a lightweight mechanism, called Implicit
    Default Methods (IDM), for Java, that avoids default methods, and discussed its
    limitations and benefits. Using IDM, we can reduce code replication and simplify
    the implementation of class hierarchies using three open source programs and found
    that we can simplify up to 9.2% of all classes by generating up to 5.7% of all
    methods. These percentages show that even though the proposed generative mechanism
    is only applicable in some situations, the lightweight syntax extension is justified.


