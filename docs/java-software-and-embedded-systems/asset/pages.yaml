    # # Abstract


    The development of embedded control systems for automotive applications is an
    emerging field in the technical literature. There is, consequently, a lack of
    methodologies and tools that support the various development phases, starting
    from the early architectural design and ending with the calibration and validation
    processes. In this chapter, a new development framework for embedded control systems
    and engine calibration (F.I.R.E.—Functional Implementation Re-usable Environment)
    is presented, which supports the modelling of systems at a high abstraction level
    and provides tools for the development and validation activities.

    The F.I.R.E. tool enables control engineers and software developers to focus on
    control systems aspects instead of platform ones. This is achieved by means of
    automation necessary transformations during the development process. Two applications
    are reported to provide control capabilities to allow a time analysis and to detect
    a bad scheduling before production code is generated.

    The tool also provides a set of support functions for the embedded system design
    process, calibration and validation phases which are always crucial aspects in
    the overall development cycle. This is particularly true for engine control systems,
    because their


