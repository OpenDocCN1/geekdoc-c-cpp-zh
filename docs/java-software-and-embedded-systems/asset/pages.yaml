    # # Conclusions


    In this chapter, we have shown the capabilities of Java code to manage wireless
    interface as Bluetooth and GPS devices. These capabilities allow to consider Java
    as the most popular language for developing applications inside mobile device
    to allow user-centric technologies that use user-context as the paradigm to adapt
    to preferences, real-environmental situation, predictions, and etc. of the user.


    Java package avoids the necessity of complex software to work with bluetooth or
    GPS, then the developer could focus the attention to the context-aware application
    without taking care of real devices used by the application.


