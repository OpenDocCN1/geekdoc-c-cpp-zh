    IDM allows programmers to implement delegation more easily because default methods
    are generated implicitly. Default methods can be generated using a parameter of
    a subtype declaration, i.e., only one method definition needs to be defined to
    generate different methods of a class. Default methods are no longer replicated
    across multiple classes and methods within single classes are no longer repetitive.
    Furthermore, disabling methods, for reuse were placed to high in an inheritance
    hierarchy, That is, IDM exactly generates the methods needed by every class. Some
    classes may become empty and allow further simplifications using refactors.


    Default methods are generated at compile-time and are hidden during development;
    thus, IDM allows a developer to concentrate on the core implementation of each
    class and prevents controversial designs of classes (i.e., IDM code prevents smells
    Middle Man and Lazy Class) and complex class hierarchies (cf. Sec. 2.). The existence
    of generated methods after compilation eases debugging because every executed
    method is viable for each debugging step. Type safety of implicit methods is guaranteed
    because the IDM mechanism generates all methods that a class has to provide when
    IDM does not invalidate core methods implemented by the developer.


    Beyond method generation, IDM encodes design directly in the source code by exposing
    delegating and delegate classes and, improves reasoning about classes [4]; if
    no method is generated, IDM annotates and explains the meaning of fields (e.g.,
    references to delegates), classes (e.g., delegate classes), and interfaces. IDM
    allows the communication between software designers that use the vocabulary of
    now exposed design patterns.


    IDM additionally supports software evolution. When software evolves and methods
    are added to a class, the developer only has to adapt the delegating class'' interface
    that is used for method generation; methods of other delegating classes that follow
    that are generated automatically – this is equivalent to adding methods to delegates.
    However, if a default method in one subclass of the interface is not sufficient,
    the developer needs to implement a new core method instead.


    In summary, we achieved the following benefits with IDM: (a) reduced number of
    methods, (b) isolation of core methods, (c) isolation of delegating and delegate
    classes in the code.


