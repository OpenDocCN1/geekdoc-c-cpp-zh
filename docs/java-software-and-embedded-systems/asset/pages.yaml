    # Pierre Parrend


    The JVM failures worsen when the applications are running a long-time without
    interruption. This phenomenon is called aging and is especially present for application
    servers. It leads to the following behavior of an example mail application running
    on a Java server:


    +   - A consistent memory depletion trend (up to 50 KB/min) during periods of
    garbage collector activity.

    - A consistent throughput loss (up to 2.4 KB/min) has also been observed.

    - The Just-In-Compiler is responsible for a negligible memory depletion trend
    (numerical value is not given).


    The experiment is conducted with a mail server called James for a duration of
    100 hours with a workload generator.

    More exotic vulnerabilities can be exploited. For instance, memory errors can
    be used to abuse a virtual machine [30]. The attack relies on an aleatory error
    in a program with a repetitive address scheme. The shift of any bit in one method
    leads to unsafe behavior. The attack is sped up through physical access to the
    machine: the authors use a simple light bulb to perform the shift.


    System specific Vulnerabilities As can be expected, each specific implementation
    of the JVM introduces new vulnerabilities. Mobile platforms are fragile to such
    attacks since they are meant to be extended through MIDlets by third parties.
    A vulnerability analysis is proposed for Sun Connected Limited Device Configuration
    (CLDC) [20]. Identified vulnerabilities are:


    +   - SMS can be sent by malicious MIDlets. This has been on the Siemens S55 phone
    only.

    - Several errors exist in the MIDP Reference Implementation (MIDP RI): opening
    of a socket on a PC port that is already occupied results in exceptions that are
    generated while-passing the security manager; RSA implementation contains; the
    return value of midInitializeMemory() is never checked which makes impossible
    to analyze the reason for system crash if one occurs.

    - MIDP SSL is based on a weak random number generator based on system time only.

    - Data in record stores are not protected from malicious attacks.

    - No quota can be set in data stores for MIDlets.

    - Low level APIs will provide helper functions for high level libraries available
    to MIDlets can be accessed directly by the MIDlets in J2ME CLDC RI.

    - MIDlets can be transferred from one device to another by the user. Since this,
