    hides the class implementation [6, 2]. Delegation is a mechanism that forwards
    message calls from a delegating class to an associate delegate class for the purpose
    of reuse [20]. Delegation and interfaces are used frequently in design patterns
    [11] and black-box frameworks [15] to improve flexibility and extensibility. However,
    there are several known problems related to the implementation of methods that
    forward calls to a delegating class and that abstract methods of implemented interfaces—
    we name both types of default methods. These methods are trivial and tedious to
    reuse. These default methods also distract from the non-trivial methods of a call
    we call core methods. Default methods are replicated throughout the class [11,
    15] and the resulting code is criticized as bad design (a.k.a. ‘code smell’) [10].
    They may reduce software maintainability and understandability [14] which is in
    contrast to the promised benefits of reuse through interfaces and delegation.


    We that default methods constitute 2% to 5% of all methods in three medium-sized
    programs. In order to have the implementation of these methods, we provide a lightweight
    language mechanism for Java, called Implicit Defined Methods (IDM), that takes
    care of generating default methods when required. Our aim is to improve code quality
    and to take the burden from the developer who otherwise has to implement and maintain
    a high number of default methods (e.g., up to 107 in JHotDraw). We illustrate
    IDM using the delegation-based design patterns Decorator and Visitor, and evaluate
    it using three open-source case studies of different size and purpose, JHotDraw
    [8, 26], Java Class Editor (Jfe²), the Java Class java [24].


    Note, with only 2.2% to 5% of all methods in our analyzed programs, default methods
    occur rather infrequently. In many programs that do not use delegation it may
    not occur at all. Nevertheless, it is a problem— when it occurs— conflicts code
    quality and is tedious for the developers. Our studies show, even though default
    methods do not occur frequently, we can gain considerable benefit from IDM.


    # 2. Problem Statement


    Delegation is the process of forwarding a request to a delegate class that deals
    with the request instead of the delegating class that received the request originally.
    Delegation is a reuse mechanism based inheritance in Java and other OOP languages
    [35], i.e., different delegating classes may reuse the implementation of one delegate
    class by forwarding requests to it. Both, delegating and delegate classes, may
    include repetitive method implementations.


    In delegating classes, a high number of forwarding methods makes their implementation
    tedious. This may hamper reasoning about such class because the core methods,
    i.e., the reason for implementing it, is hard to identify all forwarding methods.
    Consequently, the class design may be considered problematic because it mainly
    forwards messages (known as Middle man smell) and contains numerous methods that
    do not communicate with each other [15].


