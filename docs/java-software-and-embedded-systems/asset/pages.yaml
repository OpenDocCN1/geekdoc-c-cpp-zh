    save the difference between the requested delay and the actual one (on the delay).
    At the end of the application the arrays are copied from RAM to files, following
    an off-line analysis of the data.


    Experiments to evaluate system performances with without CONFIG.PREEMPT activated
    carried out running the system for about two weeks using Linux Threads with Linux
    2.6.9 and the NPTL 2.3.5 with Linux 2.6.21.1. In particular, three parameters
    were considered:


    +   1. $T_{max}$: the maximum error on the requested period of the scheduler

    2. $T_{99}$: the 99.99th percentile of the scheduler error, i.e. one scheduler
    period sample over ten thousand has an error higher than $T_{99}$

    3. $T_{99999}$: the 99.9999th percentile of the scheduler error, i.e. one scheduler
    period sample over one million has an error higher than $T_{99999}$


    Summarized in Table 1, show how applications with timing requirements of the order
    of 0.5-1 ms are handled by standard Linux. Furthermore, they point out the performance
    of recent kernels and POSIX library NPTL is noticeably better than that obtainable
    from old kernels and the outdated LinuxThreads. In particular, activating the
    CONFIG.PREEMPT option reduces the maximum error on the requested period of the
    scheduler, while NPTL shows to be more efficient than LinuxThreads. An example
    of


