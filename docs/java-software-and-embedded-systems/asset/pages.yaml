  md: '# Architecture of Embedded Tunable Circular Microstrip Antenna


    # 7. Development of Adaptive Antenna System with a Computer Interface


    In this configuration for a computer controlled frequency hopping microstrip antenna
    is presented. a circular microstrip antenna loaded with a series L-C tuned circuit
    in the form of a varactor diode along with a metallic pin is electronically tuned
    over 807 MHz by sending digital words using the asynchronous serial communication
    facility of a computer. The frequency hopping sequence can be predetermined or
    random. Unlike embedded systems, this computer interface circuit offers flexibility
    in choice of hopping sequence and facilitates remote operation. The design details
    and measured results are: Results illustrate the feasibility of the proposed scheme
    to convert a low profile antenna into an adaptive system.


    # 7.1. System Description


    The computer, as per user request, sends a serial code to the interface circuit,
    which in turn is captured, stored and placed on the parallel data bus input of
    a digital to analog converter (DAC). The DAC converts the digital data into analog
    voltage, which is then given to the varactor bias network through a buffer/amplifier,
    and accordingly the patch is tuned.


    ![](img/c669dc86947c1e394b7ee25b3acc20f3_94_0.png)


    Figure 6. Block schematic of computer controlled frequency hopping system.


    Figure 6 shows the schematic diagram of the proposed system. The antenna assembly
    was connected to the computer using one of serial ports. The use of asynchronous
    serial mode for communication eliminates requirement of any additional timing
    arrangement as needed in synchronous mode. At the beginning the varactor-post
    loaded antenna was characterized by frequency vs. digital words. Information was
    inserted in the computer program in the form of a look-up table, where can give
    a choice of frequency and the corresponding bias voltage will be generated at
    the antenna end by sending the appropriate digital word from the look-up table.
    The flexibility of the scheme lies in the fact that the resolution of the tuning
    range can be increased easily without using any additional data line from the
    computer.'
  merge: -1
  pgno: 94
- img_proc: true
  md: 'With a little modification to the existing scheme, the system can be used to
    generate random frequency hopping. The typical application of frequency hopping
    may be in jamming RADAR. The program incorporates a scope of introducing a finite
    time delay between consecutive hops, which may be precalculated for the echo to
    come back the antenna for the given range of the RADAR, while the antenna is still
    operating at the same frequency. The computer programs was developed using Turbo
    C compiler, which provides easy access to the computer serial ports with flexible
    arrangement for data.


    # 7.2. Design of the Interface Circuit


    The interface circuit plays a crucial role in the above system. It converts the
    RS 232 signal (9 to -9V) to TTL (0 to 5V), intercepts the serial data and makes
    it available in parallel form to the DAC for analog conversion. The heart of the
    circuit is the 8751 microcontroller, which does all the required signal processing.


    The advantages of using one 8751 microcontroller instead of a discrete logic gates
    are reduced hardware and enhanced performance. No external memory is required
    as the microcontroller itself has built in data and program. A 12 MHz crystal
    was used to drive the clock of the microcontroller. Design of precise timing circuitry
    is also avoided by using asynchronous communication mode present in the microcontroller.
    The data rate of communication is possible with unlike discrete circuits. A MAX232
    line driver was used to convert the RS 232 signal to TTL signal. The inbuilt USART
    (Universal Synchronous Asynchronous Receive Transmit) in the 8751 was used to
    receive the data from the computer. Once the word is received and stored in a
    register 8751, it can be made available to any of the ports of the microcontroller
    to drive the DAC. The microcontroller port lines were directly connected to the
    DAC as each port line can carry 3 TTL inputs. Four bits of the DAC were used to
    generate the dc voltage driving the bias network. A DAC with higher number of
    bits will provide a better resolution within the frequency tuning range. The data
    rate of communication is programmable to go up to 104.2 bit per second (kbps)
    in this configuration and between the computer and the interface end. For the
    higher rate operations the microcontroller has to be driven by a clock of high
    frequency.


    The frequency of operation is selected (predetermined or random) according to
    the hopping sequence and receiving a 8 bit digital word with a start and stop
    bit is sent from the computer through the RS232 line to the MAX 232 line driver.
    The line driver converts the code to TTL level and presents it to the serial port
    of the microcontroller. The microcontroller, which gets reset with power, waits
    for the data after initialization by the executing code. On receiving the start
    bit (a low transition to the line) the microcontroller initiates the receiver
    and samples each bit three times. The value accepted is the one, which is received
    at least twice out of three samples taken [122]. After receiving the 8 bits (the
    whole word), the word is written to a register and upon receiving the stop bit
    of the USART resets itself for another receive operation. The word is written
    to a port, which drives the DAC to the antenna accordingly.'
