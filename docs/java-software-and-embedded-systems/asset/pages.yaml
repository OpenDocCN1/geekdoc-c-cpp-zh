    # 6. Conclusion


    The choice of GNU/Linux as the basis for a software platform devoted to the development
    of robotics and industrial automation applications has to be particularly good
    and farsighted over the last years, generalised by a growing interest in GNU/Linux
    community for robotics and automation applications. Pre-emption patches have become
    a standard configuration option (CONFIG_PREEMPT) for Linux starting from release
    2.5.4-pre. Moreover, the support of real-time scheduling options by the NPTL libraries
    is today avoid the old and incomplete LinuxThreads libraries, mandatory when the
    first release of the system was implemented. Thanks to the good design and compliance
    to standards of free software it has been possible, all these years, to adapt,
    with very little effort, the software platform and relative developed applications
    to the contemporaneous technological evolution of GNU/Linux kernel. Nowadays are
    more powerful options provided by kernel developers: the real-time


