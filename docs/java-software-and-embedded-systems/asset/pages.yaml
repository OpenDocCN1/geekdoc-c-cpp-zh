    # 2. Requirements


    Both the research group and the small enterprise cooperating in this research
    were interested in developing reliable and maintainable systems, operating in
    harsh/or remote environments such as polar regions and satellites, In addition,
    the desired platform has to be stable, i.e. changing as little as possible in
    time, supported by a strong and agile community and able to run on a wide set
    of hardware architectures, in terms of both boards and communication bus, for
    at least ten years. Basic software components (e.g. operating and development
    systems, programming languages, APIs, etc.) have to be stable, largely diffused
    and known by developers, making this easy to find personnel to work on it. Even,
    the existence of hardware and software keys used by proprietary products can be
    seen as a strong constraint, in particular by enterprises with the perspective
    of maintaining and/ upgrading industrial machines for many years in remote areas.
    Such constraint may motivate the choice of free software more than the possibility
    of saving money (the price of software licenses is usually compatible with the
    cost of advanced industrial machines). Moreover, if on one side the freedom of
    sharing, studying and modifying software, as well as the correlated affirmation
    of the right to learn, and the acquired knowledge with others, is strongly related
    to the ethical guidelines of basic research, on the other, free software can also
    afford low costs. Indeed, the possibility of developing and testing different
    applications, e.g. human computer interface, embedded real-time control system,
    supervision system, using the same software tools and, even, hardware, dramatically
    reduces the stress and the time required by mental context switches of human developers,
    optimising the employment of human resources especially in relatively small teams,
    where as in the case of many research groups, people are required to be interchangable
    in their capability of working on different parts of complex systems.'
