    of this chapter, i.c. the practical demonstration of the possibility of using
    standard GNU/Linux for implementing embedded real-time control systems up to a
    sampling frequency of at 2 kHz. Furthermore, four years later, the developed system
    is still demonstrating its capabilities potentially integrating improvements and
