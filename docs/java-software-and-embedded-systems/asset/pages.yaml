    software.


    The entire process can be sped up by using statistical techniques which reduce
    the number of experiments undertaken and maximize the informative contents of
    each test. Using the advanced calibration techniques, again implemented in the
    MATLAB® environment, it is possible to automatically transform information in
    calibration maps directly usable by the ECU. Higher precision achievable, especially
    when dealing with multidimensional actuation (throttle body, cam phaser for or
    exhaust camshaft, injectors..), correspondingly reflects on color performance
    (lower fuel consumption, larger maximum power and so on) and on a more robust
    characterization of the phenomena for the whole engine family, not only for the
    "tested engine." This is also important for reducing the influence of noise factors
    on the engine performance and the generation of diagnostic false alarms. Moreover,
    the availability of automatic calibration speeds up the development process of
    new engine control algorithms ([16]).


    # General Purpose Calibration Tools


    In a model-based software development process, the simulation models of the processes
    are often available. A complete collection of general purpose calibration tools
    are developed in the MATLAB®/Simulink environment. These tools are described below.


    # Continuous Multivariable Non-linear Regression Models


    In order to describe a relationship of the type z=f(x,y), it is possible to use
    a regression model which relates the experimental points having x, y and z coordinates.
    The model is imposed by the ECU algorithms and/or the physics underlying the process.


    In Figure 10, the coloured surfaces represent the volumetric efficiency of the
    engine, at a defined speed, which depends on the manifold pressure and cam phaser
    position. This surface minimizes the mean percentage square error from the experimental
    points represented by blue circles.


    The regression model is quadratic in the cam phaser variable and linear in the
    manifold pressure until the breaking pressure, at a value of 950 mbar, is reached
    there is a quadratic relationship over that pressure value. This switching relationship
    describes the natural supercharge effect ([17] and [18]), which is particularly
    evident at 2700–3300 rpm in this real engine application. The traditional regressors
    produce an error up to 8% in the air charge estimation at full load, worsening
    other actuations like spark advance and mixture title.'
