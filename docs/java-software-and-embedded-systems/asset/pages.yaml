    preemption path (CONFIG_RT_PREEMPT kernel option) by Ingo Molnar and Thomas Gleixner''s
    generic event loop with high resolution timers (HRTs) support (CONFIG_HIGH_RES_TIMERS
    kernel option). The real-time preemption path connects to Linux in a fully preemptible
    kernel, by replacing most kernel spinlocks with mutexes that support priority
    inheritance, as well as moving all interrupt and software interrupts to kernel
    threads. As far as the HRT is concerned, it enables POSIX timers and nanosleep
    system call to be accurate as the hardware (today around 1 μs). Thus GNU/Linux
    gains in short time real-time capabilities and can be reliably used for more demanding
    robotics and industrial automation applications.


