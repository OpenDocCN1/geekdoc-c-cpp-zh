    # 1. Introduction


    It turns out to be undeniable that the Object Oriented Programming (OOP) approach
    has actually become the main trend for the implementation of high – level software
    systems. For sure disparate voices will point that many other trends replace or
    complement the OOP approach. However, the use of the OOP approach got more popular
    in the early 90s and nowadays many programming languages support it.


    The OOP uses objects and their interactions to design software programs and applications.
    These objects combine state, behaviour and identity; this way a program is expressed
    as a set of objects, coming closer to the way of thinking of the human being.
    Therefore the programmer properly defines objects, later send them messages asking
    them to execute their methods by themselves. This allows the programs and modules
    to be easily written, maintained and reused. And precisely the modularity and
    reusability characteristics give a new point of view to software here.


    Regarding socioeconomic terms, actually a revolutionary transformation of the
    digital economy is taking place, with a similar range to the one in the industrial
    revolution, which offers at the same time a great challenge and a great chance.
    New Information Technologies (IT), when transforming the information processing
    stages, act in every domain of the human activity. A clear tendency exists in
    the market, giving from the software product to the service. This entails all
    kind of consequences in the client-provider relationship at every level, in the
    business processes and in the technological infrastructure. The client is not
    the owner of the service, nor he needs to manage any kind of license, but he receives
    the service when he needs, with certain previously agreed quality about service
    quality. This gives a great flexibility to the market, because services can be
    combined and reconfigured in every occasion, offering a great variety of check-in
