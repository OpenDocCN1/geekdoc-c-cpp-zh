  md: '# The Power of Reflection 59


    It is comprised of the following elements:


    +   - The central element SOR Semantic Service (S3). It has a name, a textual
    description for human-beings, and is connected with other elements, such as Domain,
    Type and Arguments.

    - A Domain has DomainConcepts, and contains terms in external ontologies for the
    S3s to be described. It has a valid identifier and a name, which is an indexable
    term in an upper level ontology.

    - A DomainConcept is a term in a low-level ontology, and has a valid identifier,
    a name and a textual description.

    - A Type has a name, and is related to an S3 object (through its hasS3ReturnType
    connection) and with Arguments (through their hasType relationship).

    - An Argument has a valid identifier, a textual description, a name, Type and
    a DomainConcept which it is related to.


    Besides the basic relationships, inverse relations have been created in order
    to establish searches from one point of the relation to another and vice, where
    required.

    Initially, when a bundle is registered in the framework, the agent will look for
    the property "SOR.PUBLISH", if set to "true", will indicate the agent to the semantic
    information provided to the SOR registry.

    The information will be extracted from each method, defining a valid one as a
    method that supplies data in the form of Java Annotations. A service – providing
    bundle will not have to know anything about the SOR bundle, only having to:


    +   - Apply the correct property to the initial set at deployment time.

    - Specify the correct Java Annotation for each method that is wanted to be deployed.

    - The Java Annotation''s name is S3Method, and has the following fields:

    - Domain, corresponding to the Domain object in the SOR registry data structure.
    Defines a term in a high-level ontology, and can be a key in searching.

    - Concept, corresponding to the DomainConcept object in the SOR registry data
    structure, defines a more specific term in a low-level ontology. It can be defined
    as a technical specification or detail in a specific area.

    - Description, which is a textual description for human-beings about the service.

    - Arguments, an array of Java Annotations, each one called S3MethodArgument.

    - Each S3MethodArgument has the following fields:

    - Order of the argument in the method declaration, as an integer number.

    - Concept, corresponding to the DomainConcept object in the SOR registry data
    structure, defines a more specific term for this method argument.

    - Description.'
