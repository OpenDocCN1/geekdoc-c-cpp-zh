    As an embedded C/C++ interpreter, Ch can be embedded into a C/C++ application
    to enhance prototyping capabilities and increase flexibility. With embedded Ch,
    users can load scripts into their application numerically and execute them dynamically.
    As a built-in C scripting engine, embedded Ch can relieve embedded programmers
    from the burden of developing and maintaining a scripting language or interpreter
    and instead focus on the core research or application of the system. Embedded
    Ch has a small footprint to meet the limited memory capacities of various embedded
    and mechatronic systems for automation. Once installed onto the embedded system,
    Ch can be set as the default login shell or started at the command prompt after
    logging into the system.


