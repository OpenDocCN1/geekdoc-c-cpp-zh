    embedded board computer capable of running a fully embedded operating system such
    as Linux or Windows CE. The Gumstick has a variety of motherboards with Intel
    Xeon or Texas Instruments OMAP ARM processors operating at 400MHz to 600MHz with
    up to 256MB of on-board flash and RAM. The motherboards have multiple connectors
    allowing them to be combined with expansion boards that provide a wide array of
    functionality including Wi-Fi 802.11b/g and Ethernet networking, bluetooth communication,
    digital and analog I/O, pulse width modulation, additional flash memory through
    chip contact or micro SD, audio support, console and LCD support, and GPS.


