    # # Implementation View


    The next step in system planning is the ANSI-code implementation of the functional
    models onto the specific target to be installed into the vehicle Electronic Control
    Unit, which is usually accomplished by means of some automated production code
    generator [8] and [9].


    A functional view is not suitable for dealing with the implementation aspects
    arising by the use of a real-time operating system in the ECU, such as tasking
    and scheduling, or asynchronous events handled ([10] and [11]). Such aspects can
    be better analyzed in an implementation view (Figure 2) of the same model where
    the control flow is also highlighted.


    In this view, the customer considers the effect of introducing prescribed timing
    requirements in the execution of each Simulink block. This is accomplished by
    introducing an additional scheduler block which simulates the real behaviour of
    the control system when implemented on a RTOS (Real-Time Operating System) for
    embedded systems.


