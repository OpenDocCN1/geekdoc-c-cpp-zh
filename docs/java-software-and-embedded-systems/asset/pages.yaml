    # Study Case: Management of a Video Surveillance System Using a Wii Remote


    One of the common users of the Wiiote is to be able to interact with games, principally
    using the gestures to move the point of view. But, it is possible to use technology
    in other scenario, the video surveillance one, so a user can manage the movement
    of a camera through its gestures.


    To be able to interact between the Wiiote and the camera, it is needed to develop
    a framework that allows a developer to extract the movements of the user, transform
    them into gesture, and that gestures into commands to a camera management system.


    We have seen before how to extract the movement of the Wiiote, but to be able
    to transform that information into gesture, there is needed to use some kind of
    pattern recognition system, for example neural networks. Neural networks will
    be really useful, because we can tell the user to move the device in some way,
    and the neural networks will be able to extract what kind of pattern is been done.


    Once the gestures are recognised, they can be used to move the camera, so them
    it is only needed to be able to interact Java with a camera system. The best way
    to do this is to create a server that has the capability to send commands to the
    camera, so they are transformed into camera movements, using an Ethernet socket
    connection, for example.


    Of course, it is possible to use all the possibilities of Java to create a system
    as complex as possible, so these examples are only a little view of what is possible
    to do with Java, specially with mobile devices using the Bluetooth technology,
    a technology that any day is more present in our environment.


    # Inside of JSR - 179 Location-Based Services


    # An Overview to Java Platform, Micro Edition (Java ME)


    The component described has been developed using Java Platform, Micro Edition
    (Java ME) that provides a robust, flexible environment for applications running
    on mobile and embedded devices—mobile phones, personal digital assistants (PDAs),
    TV settop boxes, and printers. Java ME includes flexible user interfaces, robust
    security, built-in network protocols, and support for networked and offline applications
    that can be downloaded dynamically. Applications based on Java ME are portable
    across many devices, yet leverage each device''s native capabilities.'
