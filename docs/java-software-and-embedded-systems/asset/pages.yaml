    # Chapter 9


    # SCRIPT COMPUTING FOR EMBEDDED SYSTEMS


    Stephen N. Nestinger and Harry H. Cheng

    Department of Mechanical and Aeronautical Engineering,

    University of California, Davis, CA, USA


    # Abstract


    The advent of high speed ubiquitous embedded systems and features normally expected
    in conventional operating systems provide developers with new system flexibility
    and versatility. These features are keen to the advancement of mechatronic and
    embedded computing such as robotic systems, sensor networks, distributed embedded
    computing, structural health monitoring, first respond systems, supervisory control
    and data acquisition (SCADA), and traffic management, especially in geographically
    distributed and unstructured domains. To address the challenges of uncertainty
    and rapid prototyping, a flexible embedded systems programming platform is critical
    to enhancing capabilities and maintainability, and provide dynamic reconfiguration
    and in-situ processing. This chapter discusses the programmability and reconfigurability
    of modern full featured embedded systems along current trends in interfacing methods.
    This chapter also introduces tools that allow embedded systems developers to easily
    program for their specific embedded system hierarchy and with multiple levels
    of complexity using the C language while exposing the rich functionality of embedded
    operating systems.


    # 1. Introduction


    Embedded systems are components of a larger system and comprised of computer hardware
    and software specifically implemented to interface with the physical world. Their
    characteristics and components are traditionally application specific where every
    available functionality is fully utilized for maximum optimization. Traditionally,
    programming embedded systems were painstakingly done using the very low level
    assembly language and later upgraded to a simplified version of C. Most general
    embedded systems can be programmed using C where the application is developed
    and compiled to native code on a host and downloaded or burned into the embedded
    board. Having to deal with the compile and download cycle can greatly increase
    the development time of embedded systems. Furthermore, when dealing with multiple
    distributed embedded'
