  md: '# Java in Ambient Intelligence Applications


    | Interfaces | Classes | Exception |

    | --- | --- | --- |

    | DiscoveryListener | RemoteDevice | BluetoothConnectionException |

    | L2CAPConnection | DeviceClass | BluetoothStateException |

    | ServiceRecord | UUID | |

    | ClientSession | LocalDevice | |

    | HeaderSet | DiscoveryAgent | |

    | Operation | DataElement | |


    Figure 1. Elements of JSR-82.


    These functionalities are described as follows:


    Interfaces:


    +   * DiscoveryListener : Provides of the primitive methods to notify an object
    about device and service queries. A more accurate view of this interface can be
    seen in the examples about devices and services search.

    * *void deviceDiscovered(RemoteDevice蓝牙, DeviceClass cod)*: This method is called
    whenever a new device is discovered by a discovery agent, telling about about
    the remote device and his type.

    * *void inquiryCompleted(int discType)*: When a query is completed, the listener
    is notified by this, telling about what kind of search it was.

    * *void servicesDiscovered(int transID, ServiceRecord[] servRecord)*: When services
    are found in a service query, the listener is notified with the full list, and
    the transaction ID.

    * *void serviceSearchCompleted(int transID, int respCode)*: Whenever a service
    query is finished, it is notified to the listener, telling about the transaction
    ID and the result code, telling about problems if they are.

    * L2CAPConnection : Represents a connection using L2CAP protocol. L2CAPconnection
    interface provides the primitives needed to interact with this protocol. This
    kind of connection will work totally like a socket, being able to send an undetermined
    amount of information in a one-way connection. This connection is used in the
    example that is explained further.

    * *boolean ready()*: Tells if the listener is ready to send data.

    * *int receive(byte[] inBuf)*: In the buffer the received data is, and tells how
    many data is received.

    * *void send(byte[] data)*: Send all the data in the vector.

    * ServiceRecord : Offers access to service information, and defines some constants
    for standard id''s attributes. This class is intended to help devices to negotiate
    each other about services and its restrictions, like authentication.

    * *int[]getAttributeIds()*: Received attributes.

    * DataElement getAttributeValue(int attr)* : returns information about a desired
    attribute.

    * *String getConnectionURL(int requiredSecurity, boolean mustBeMaster)*: creates
    a connection string to the desired service, with the authentication options implicit.

    * RemoteDevice getHost()*: gets the RemoteDevice object associated with the service.'
