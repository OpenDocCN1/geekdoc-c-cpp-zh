    systems not easily accessible, reprogramming or patching each board individually
    is highly impractical.


    The advent of high speed embedded systems and full blown embedded systems provide
    embedded system developers with increased flexibility and versatility. These features
    are key to the advancement of mechatronic and embedded systems as robotic systems,
    sensor networks, distributed embedded computing, structural health monitoring,
    first respond, supervisory control and data acquisition (SCADA), traffic management,
    each, especially in geographically distributed and unstructured domains. Some
    known embedded operating systems use QNX, Windows CE and XP embedded, embedded
    Linux, FreeBSD, FreeRTOS, and VxWorks


    The complexity in these mechatronic and embedded systems is due to a wide range
    of technologies and capabilities, and the need to predict and operate despite
    design flaws, human error, and other disturbances. However, traditional embedded
    systems guarantee robust operation only to the events that have been anticipated
    and accounted for during the design stages and hard coded into the system. Unfortunately,
    new technologies and systems continue to emerge, the embedded systems become more
    and more difficult to predict and characterize at the design stage. To ensure
    optimal operation during and unexpected disturbances, the dynamic integration
    of measurement, computation, and control processes is necessary to allow computing
    systems dynamically adapting to unforeseen events [15]. Such an integration will
    be the cyber infrastructure [21] and all advances in engineering and information
    sciences will provide the ability of adding and invoking new computing components
    by dynamic inputs, and in reverse, the ability to dynamically control the measurement
    and control process. To address the challenges of uncertainty, a flexible programming
    platform is critical to enhance prototyping capabilities, dynamic reconfiguration
    and in-situ processing, and gain access to the increased functionality embedded
    operating systems. Due to the limitations of hard binary application development,
    developers are using scripting languages which provide efficient code reuse, high
    level functionality through system calls, and use code mode modification.


    Developers have started using Web-based user interfaces (WUI) to promote remote
    data monitoring and hardware manipulation. Multiple programming languages capable
    of providing the necessary dynamic interaction with embedded systems. However,
    using a single platform for both control and interface would be more practical
    for developers and time efficiency. This requires a scripting platform capable
    of easily interacting with low hardware and provides Web-based programming capability
    for dynamic Web-based data visualization and configuration.


    Direct control of a single or few embedded systems via remote connection or a
    Webbased user interface is highly impractical when dealing with a dozen or more
    embedded devices working in a network configuration. Centralized control of entire
    systems may require large communication bandwidth and a powerful resource abundant
    system. However, when dealing with geographically distributed embedded systems
    in an unstructured environment, the use of decentralized control has gained popularity.
    The introduction of mobile agents provided a flexible framework for distributed
    systems by allowing in-situ information processing [13]. Therefore, instead of
    having all embedded devices broadcast new to a'
