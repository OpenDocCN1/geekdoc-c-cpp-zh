    # 3. Characteristics of Varactor Diode


    The operation of varactor diode is based on reverse-biased p n junction. An increase
    in the reverse bias winds the depletion region between the p- and n-type substrates,
    and the junction capacitance reduced. The junction capacitance as a function of
    reverse bias is given as


    ```

    $C_j(V) = C_j(0)\{1 - \frac{V}{\Phi_b}\}^M$

    ```


    where $C_j(0)$ is the junction capacitance at zero bias, $\Phi_b$ is the contact
    potential (0.7V for silicon and 1.3V for GaAs) and $M$ is a coefficient depending
    on junction profile. $M=0.5$ for abrupt varactor. For hyperabrupt type varactor
    $M$ varies from 0.5 to 5 depending on reverse bias.


    The equivalent circuit of the diode is modeled by a voltage dependent capacitance
    $C_j(V)$ and a series resistance $R_s(V)$, associated with the ohmic contact and
    the finite thickness of the epitaxial layer. Since the depletion bias increases,
    the undeleted region becomes smaller which decreases the resistance of the structure.
    The series resistance should be as low as possible in order to keep the losses
    associated with the diode low. For a packaged diode (e.g SOT-23), the package
    inductance $L_s$ and the package capacitance $C_p$ also affect the functioning
    of the diode. The equivalent circuit of a packaged varactor diode is shown in
    Figure 1.


    Usually the effect of package capacitance on the characteristics of the varactor
    diode is negligible and is therefore ignored. The impedance can be obtained from
    the equivalent circuit as


    ```

    $Z_d(\omega, V) = R_s(V) + j\omega L_s - \frac{1}{\omega C_j(V)}$

    ```


    The varactor diode should be operated below a cut-off frequency. This cut-off
    frequency is given as


    ```

    $f_{cut-off} = \frac{1}{2\pi R_s(V) C_j(V)}$

    ```'
