  md: "# A Game: Dragon!\n\nWe’ve learned a lot about Scratch so far. Now let’s put\
    \ it all together into a game. You are the cat. You can control where you are\
    \ on the stage using the computer mouse. Avoid the ferocious dragon for as long\
    \ as you can!\n\n![](img/c8b294ee7af329f5e2b96cede7af2ab1_33_0.png)\n\n+   Enter\
    \ the Dragon\nAdd the “Dragon” sprite to the project. Add a variable for all sprites,\
    \ and give it the name speed.\n\n![](img/c8b294ee7af329f5e2b96cede7af2ab1_33_1.png)\n\
    \n+   Get the Dragon Bouncing\nChoose the dragon in the sprite list and add this\
    \ script. This is the bouncing script we used before, but with a slight change.\
    \ We control the dragon’s speed with a variable and set the dragon off in a different\
    \ direction each game. Read and run the script. The dragon bounces around the\
    \ stage.\n\n```\nwhen clicked\nset [speed] to [10]\npoint toward [cursor]\nforever\n\
    \  move [speed] steps\n  if on edge, bounce\n```\n\nPoints dragon in a new direction\
    \ when run\n\n+   Mouse Controls Cat!\nNow select the cat in the sprite list and\
    \ add this script. Carefully read the script. It “sticks” to the cat to the cursor.\
    \ Inside the loop it checks if we’re touching the dragon. If we are, it stops\
    \ the project—game over! Run the script to check that it works.\n\n```\nwait block\
    \ lets dragon move away\nIf true, then scripts stop\nwhen clicked\nwait [1] secs\n\
    forever\n  go [cursor]\n  if [touching Dragon ?] then\n    stop [all]\n```"
