  md: '# A Closer Look at the if-then Block


    Look at this if-then block taken from a script.

    Read carefully and think about what it does.


    If answer''s "false," blocks are skipped


    Condition

    (answer is "true" or "false")


    If answer''s "true," blocks are run


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_24_0.png)


    +   - The if-then block is a yellow Control block, because it controls blocks
    inside it are run.


    +   - An if-then block has a question known as a condition. The question must
    have a true/false answer.


    +   - The blocks inside the if-then block are only run when the answer to the
    question is "true."


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_24_1.png)


    +   - If the answer to the question is "false," then the blocks inside the if-then
    block are ignored.


