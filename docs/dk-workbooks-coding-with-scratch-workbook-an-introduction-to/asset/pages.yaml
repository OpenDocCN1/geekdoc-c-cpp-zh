- pgno: 15
  md: '# Which Way?


    When you want to move a sprite, you need to know two things: how far and which
    way. Every sprite has a built-in direction arrow. When a script gets to a dark
    blue move block, that''s the direction in which the sprite will go.


    +   What You''ll Learn:

    * How to point a sprite in different directions

    * How to make a sprite


    # Cat Follows Mouse!


    Let''s spin our cat in every possible direction. Open a new project in the Scratch
    editor. Build this script for the cat sprite. Read the script. What do you think
    it does? Click the green flag to see if you guessed correctly.


    From brown Events blocks

    From yellow Control blocks

    From dark blue Motion blocks


    ```

    when clicked

    forever

    point toward cursor

    ```


    The cat will follow the cursor


    Move the cursor around the stage and watch the cat turn around so it always looks
    towards the pointer. The forever block runs the point toward cursor block over
    and over.


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_15_0.png)


    If it doesn''t work, check rotation style


    # Sprites Know Where to Go!


    direction: -90


    Every sprite knows what direction it''s pointing. A sprite''s direction is shown
    in the sprite information panel when you click the blue i.


    Direction circle shown on sprite information panel


    Direction -90° means "left"


    Direction 0° means "up"


    As the cat spins around, you''ll see its direction value change and the blue line
    pointer move around the circle.


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_15_1.png)


    Direction 180° means "down"


    Direction 90° means "right"


    Use the "compass" shown here to decode the direction number.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Choosing a Sprite''s Direction


    We can also set a sprite''s direction using the window with the **point in direction**
    block. You can click on the little triangle beside the number for useful directions,
    or just click on the window and type in a number.


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_16_0.png)


    # Bouncing Off the Walls Again


    Add the **point in direction 45** block to the “bouncing off the walls” script
    from page 12. Put it after the **when green flag clicked** block but before the
    **forever** block. Run the script. The cat will set off diagonally. Try using
    different directions and rotation styles.


    # Show What You Know


    Know your way around Scratch? Then try these brain teasers!


    +   1. What number should replace the ? in this block to set the sprite''s direction
    to:


    Up = .................................................nDown = .................................................


    Left = .................................................nRight = .................................................


    +   2. Test your Scratch script reading powers! What does this script do? Read
    it carefully and try to act out each block in your mind.


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_16_1.png)


    ................................................................................................n................................................................................................n................................................................................................'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Loops


    In computer programs, we often want to carry out the same instructions more than
    once. To avoid having to put down the same blocks many times, we can wrap them
    in a loop instruction that repeats the blocks. Meet forever and repeat loops!


    +   What You''ll Learn:

    - How to repeat a group of blocks using a loop

    - The difference between forever and repeat loops

    - How to make some noise in Scratch


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_17_0.png)


    # Running Down the Blocks


    Start a new project and make this script. Read, understand, and run it. It runs
    very quickly and doesn''t do much.


    Blocks run in this order.


    When we run the script, each block is run in from top to bottom. First the cat
    turns a little, then the cat''s color changes to green.


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_17_1.png)


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_17_2.png)


    # Forever Loops


    A loop instruction runs a script in the normal order from top to bottom, but then
    loops back to the top. The loop runs the blocks inside and over again. Try wrapping
    a forever loop around the blocks from the last script.


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_17_3.png)


    When the actions finish, the program always goes back to the start of the loop


    Now the cat turns more and changes color each time the blocks in the forever loop
    are repeated.


    Press the red button to stop the loop.


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_17_4.png)


    The red button stops a program'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Repeat Loops


    If we want to repeat a group of blocks only a few times and then move on to the
    rest of the script, we can use the repeat loop block.


    Try this script for a siren that annoys the cat. The repeat loop runs the two
