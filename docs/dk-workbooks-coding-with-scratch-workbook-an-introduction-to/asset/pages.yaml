  md: '# 3. True or False?


    +   a. A project can have only one backdrop loaded. False


    +   b. Only the sprite that loaded a sound can play it. True


    +   c. The stage can have sounds and scripts. True


    +   d. Once you''ve chosen a backdrop for a script, you can''t change it. False


    +   e. A sprite can use a script to change the stage''s backdrop. True


    pages 22–23 if-then


    This script should make the sprite change color when you press the space key,
    but the sprite changes color all the time. You can spot the “bug?” The “change
    color effect by 25” block needs to go inside the “if-then” block.


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_38_0.png)


    pages 24–25 Variables


