  md: '# Solutions


    Well done, you''ve completed all the tasks! Time to check your “Show What You
    Know” answers. How did you do? Are you a Scratch genius now?


    pages 4–5 What is Scratch?


    +   1. A **script** is a set of instructions (program) in Scratch.

    2. Objects that perform actions in a project are called **sprites**.

    3. In a Scratch program, the action takes place on the **stage**.

    4. Starting a program is called **running** it.

    5. A collection of sounds or graphics is called a **library**.


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_35_0.png)


    pages 10–11 Your First Project


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_35_1.png)


    pages 12–13 Move It!


    +   1. What color are the **Motion** blocks? **dark blue**

    2. Scratch measures distances in units called **steps**.'
