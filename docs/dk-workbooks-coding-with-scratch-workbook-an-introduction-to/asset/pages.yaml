- pgno: 7
  md: '# Getting Scratch


    You can code online at the Scratch website, but if you aren''t always connected
    to the Internet, you can install it on your computer. Ask a grown-up to help you.
    You will need the newer Scratch 2.0 for this book, not the old Scratch 1.4.


    +   What You''ll Learn:

    * You need Scratch 2.0

    * How to use Scratch on a computer

    * How to join the Scratch website

    * How to save your projects


    # Using Scratch Online


    If you register for a Scratch account, you will be able to save your projects
    online and share them with friends.


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_7_0.png)


    +   Sign Up for Scratch

    Go to scratch.mit.edu and select Join Scratch for instructions on how to register.
    You will need to get permission from an adult with an e-mail address.


    +   Create in Scratch

    When you want to use Scratch, go to the Scratch website and click on Create. This
    will open the Scratch editor window.


    Click on this file to see your saved projects


    +   Save in Scratch

    Projects save automatically if you''re logged in your Scratch account. You can
    see your saved projects by clicking the file with “S” at the top right of the
    screen.


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_7_1.png)


    > Top Tip from Scratch Cat

    Need to “right click” but only have one button on your mouse? Usually you can
    hold down the CTRL key on the keyboard as you click. Not working? Then ask the
    owner of the computer.


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_7_2.png)


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_7_3.png)'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# Installing Scratch on a Computer


    If you don''t have access to the Internet or you want to work offline, you''ll
    need the Scratch installer. Go to scratch.mit.edu/scratch2download and just follow
    the installation instructions.


    To start Scratch, double-click the Scratch 2.0 icon on your desktop.


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_8_0.png)


    Double-click the Scratch 2.0 icon to start


    # Operating Systems


    Check that your computer''s operating system is able to run Scratch.


    +   - The online version of Scratch 2.0 will run on Windows (PC), OS X (Macs),
    and some Linux computers.

    - The offline version might not work with some Linux computers.

    - The Raspberry Pi can''t run Scratch 2.0 at the moment.


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_8_1.png)


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_8_2.png)


    > You''re not in this book.


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_8_3.png)


    # Scratch Online Community


    On the Scratch website you can share your projects and try out other coders''
    Scratch creations. Even better, you can explore how every project works and even
    change (“remix”) them. Look out for the buttons shown below.


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_8_4.png)


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_8_5.png)


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_8_6.png)


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_8_7.png)'
  merge: -1
  img_proc: true
