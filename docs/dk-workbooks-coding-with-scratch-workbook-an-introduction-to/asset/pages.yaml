  md: "# Animation\n\nThe characters in cartoons seem to move, but really you are\
    \ just watching lots of slightly different pictures that fool your brain into\
    \ seeing movement. This is called animation. Sprites can be animated in the same\
    \ way.\n\n+   What You'll Learn:\n- How to animate sprites\n- Sprites can change\
    \ how they look\n- How to use costumes\n- How to load new sprites from the Scratch\
    \ library\n\n![](img/c8b294ee7af329f5e2b96cede7af2ab1_19_0.png)\n\nChanging Costumes\n\
    Our cat sprite has two different pictures, or \"costumes,\" it can show. Start\
    \ a new scratch project and click on the Costumes tab just above the block list.\
    \ You will then see the two costumes the cat sprite can \"wear\".\n\nTo animate\
    \ the cat, build and run this script. The forever loop repeats the next costume\
    \ block. The picture of the sprite changes every half second, and this makes the\
    \ cat look like it's walking. Try adding a move block in the loop to improve the\
    \ animation.\n\n![](img/c8b294ee7af329f5e2b96cede7af2ab1_19_1.png)\n\n![](img/c8b294ee7af329f5e2b96cede7af2ab1_19_2.png)\n\
    \n> Sprite's costumes are listed in order\n\nThis picks the next costume.\nQuickly\
    \ swapping costumes makes it look as if the cat is walking.\n\n```\nwhen clicked\n\
    forever\n  next costume\n  wait 0.5 secs\n```\n\n![](img/c8b294ee7af329f5e2b96cede7af2ab1_19_3.png)\n\
    \nPause stops the costumes from changing too quickly"
