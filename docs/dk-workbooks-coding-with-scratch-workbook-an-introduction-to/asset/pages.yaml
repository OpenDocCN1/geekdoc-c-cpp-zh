- pgno: 5
  md: '# What is Scratch?


    A computer doesn''t have a smart brain like you, so everything you want to do
    must be broken down into lists of simple instructions called programs. Giving
    instructions to the computer is known as programming, or coding.


    +   What You''ll Learn:

    * To do tasks, computers need simple instructions called programs

    * Scratch is a great place to start programming

    * What the ingredients of a Scratch project are


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_5_0.png)


    # What Does a Computer Understand?


    Instructions for computers have to be written following special rules and using
    only words the computer understands. These words and rules make up a “programming
    language.” There are lots of different programming languages. Many have funny
    names, such as JavaScript, C++, and Python.


    A program is a list of instructions for the computer


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_5_1.png)


    # What is Scratch?


    Scratch is a computer programming language that''s easy for beginners to use.
    In Scratch, programs are made by joining together colored blocks using the mouse.
    These groups of blocks (called scripts) tell characters on the screen (called
    sprites) what to do. Scratch is free, safe, and fun to experiment with.


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_5_2.png)


    The blocks fit together like jigsaw pieces


    # Scratch Projects


    With Scratch, you can make your own interactive stories, animations, games, and
    art. Scratch has large collections (or “libraries”) of cool graphics and fun sounds
    you can play around with. Let your imagination run wild—you’ll soon pick up the
    coding skills you need!


    > We can make lots of sounds!


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_5_3.png)'
  merge: -1
  img_proc: true
- pgno: 6
  md: '# What Makes Up a Scratch Project?


    Here''s a Scratch project. Think of it like a play. The action takes place in
    an area called the stage. The “actors” (the sprites) are controlled by lists of
    instructions (the scripts). Behind is the backdrop—the “scenery,” which can be
    changed.


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_6_0.png)


    Backdrop

    (background picture)


    Click the green flag

    nto run (start) a

    program


    Add a script to

    make the shark

    sprite move


    Click the red

    button to stop

    a program


    Sprites are used

    for all the objects

    we want to move

    or control


    This is the

    stage


    ```

    when clicked

    forever

    next costume

    wait 0.25 secs

    move 10 steps

    if on edge, bounce

    ```


    # Scripts for Sprites


    This is an example of a script. It makes the shark bounce around the stage, opening
    and closing its mouth. Each block gives an instruction to the sprite. A block
    might tell a sprite to move, change how it looks, in speech bubbles, react to
    other sprites, or make a sound.


    # Show What You Know


    Fill in the spaces to practice the key language of Scratch.


    +   1. A ............................................ is a set of instructions
    (program) in Scratch.


    +   2. Objects that perform actions in a project are called .................................................


    +   3. In a Scratch program, the action takes place on the .................................


    +   4. Starting a program is called .................................................
    it.


    +   5. A collection of sounds or graphics is called a .........................................'
