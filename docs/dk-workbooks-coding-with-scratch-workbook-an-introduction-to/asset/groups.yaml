    \n# 灯光秀！\n\n我们可以为舞台添加脚本：点击**舞台信息**区域上方舞台区域的小图。然后尝试在你的派对背景下下运行这个脚本，让它活起来。![](img/c8b294ee7af329f5e2b96cede7af2ab1_21_4.png)\n\
    \n# 音乐\n\n没有音乐的派对就不是派对！\n声音可以加载到角色或舞台中。但你必须在脚本区域制作脚本来播放它们。\n\n点击声音（Sounds）选项卡下的扬声器图标将带你进入声音库。\n\
