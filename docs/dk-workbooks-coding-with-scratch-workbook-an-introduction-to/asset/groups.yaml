  mdcn: "\n\n# 分数\n\n一个好的游戏需要分数和挑战。为所有角色添加一个名为 `score`（分数）的新变量。勾选该变量，以便它显示在舞台上。\n\n\
    将此脚本添加到猫咪角色中。阅读它。每当你拖动龙 3 秒，你就能得到 1 分。但每当你得分，龙的游戏速度就会增加 1！\n\n运行游戏看看它是否符合你的预期。如果不符合，请从头开始检查一切。和朋友们竞争获得最高分。为什么不添加一个背景和一些音乐呢？\n\
    \n```\nwhen clicked\nset score to 0\nforever\n  wait 3 secs\n  change score by\
    \ 1\n  change speed by 1\n```\n\n勾选此框\n\n分数越高，龙移动得就越快\n\n![](img/c8b294ee7af329f5e2b96cede7af2ab1_34_0.png)\n\
    \n你喜欢 Scratch 吗？\n\n只有当我“痒”的时候才喜欢！\n\n# 展示你的才学\n\n回答测验——会得到高分还是“游戏结束”？\n\n- 1.\
    \ 为什么我们要保持分数变量的复选框勾选状态？\n- 2. 你如何让龙在开始时以半速度运行？\n- 3. 你可以在猫咪的无限循环内部添加哪个积木，让它看起来像在走路？\n\
    - 4. 龙有多少种装扮？\n- 5. 如果你在角色列表中右键点击龙并选择“复制”，会发生什么？\n\n# 答案\n\n做得好，你完成了所有任务！现在是检查你的“展示才学”答案的时候了。表现得如何？你现在是\
    \ Scratch 天才了吗？\n\n第 4–5 页什么是 Scratch？\n\n- 1. **脚本**（script）是 Scratch 中的一组指令（程序）。\n\
    - 2. 在项目中执行动作的对象被称为**角色**（sprites）。\n- 3. 在 Scratch 程序中，动作发生在**舞台**（stage）上。\n\
    - 4. 启动程序被称为**运行**（running）它。\n- 5. 声音或图形的集合被称为**库**（library）。\n\n![](img/c8b294ee7af329f5e2b96cede7af2ab1_35_0.png)\n\
    \n第 10–11 页你的第一个项目\n\n![](img/c8b294ee7af329f5e2b96cede7af2ab1_35_1.png)\n\n第\
    \ 12–13 页 动起来！\n\n- 1. **动作**（Motion）积木是什么颜色的？**深蓝色**\n- 2. Scratch 使用称为**步**（steps）的单位来测量距离。\n\
    \n- 2a. 舞台宽是多少个单位？480\n- 2b. 舞台高是多少个单位？360\n- 3. 程序中的错误被称为“虫虫”（bug）。这个脚本本应该让猫咪穿过舞台，但当我点击绿色旗帜运行它时，什么都没有发生！怎么了？缺少了“当点击绿色旗帜时”积木。\n\
    \n![](img/c8b294ee7af329f5e2b96cede7af2ab1_36_0.png)\n\n第 14–15 页 哪一边？\n\n- 1.\
    \ 这个积木中的 ? 应该用什么数字来将角色的方向设置为：\n  上 = 0\n  左 = -90\n  下 = 180\n  右 = 90\n- 2. 测试你的\
    \ Scratch 能力！这个脚本是做什么的？仔细阅读它并尝试表演每个积木的内容。这个脚本让猫咪向舞台上的光标运行。\n\n![](img/c8b294ee7af329f5e2b96cede7af2ab1_36_2.png)\n\
    \n第 16–17 页 循环\n\n- 1. 循环用于重复一组积木。\n- 2. Scratch 的两种类型循环是“无限”（forever）和“重复”（repeat）。\n\
    - 3. 你可以通过点击红色按钮停止无限循环。\n- 4. 你在哪个部分找到粉红色的积木？\n- 5. 哪个部分包含循环？\n- 6. 找虫虫！这个脚本应该画出正方形的四条边，但运行时运行时什么都没有发生。你能发现虫虫并建议修复方法吗？程序员称之为“调试”（debugging）。重复循环没有说明要重复多少次。在窗口中输入“4”来修复虫虫。\n\
    \n第 18–19 页 动画\n\n- 1. 舞台上显示的不同图片被称为装扮（costume）。\n- 2. 动画按顺序显示细微差异的图片使角色移动。\n\
    - 3. 你可以重新排列下面的角色来制作跳跃的小马动画吗？在框内写数字 1 到 5 显示正确的顺序。\n\n![](img/c8b294ee7af329f5e2b96cede7af2ab1_37_1.png)\n\
    \n第 20–21 页 派对时间！\n\n- 1. 舞台上的背景图片被称为背景（backdrop）。\n- 2. 圈出在继续之前播放完整声音的积木：\n\n\
    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_37_2.png)\n\n3. 判断对或错？\n\n- a. 一个项目只能有一个背景。错\n\
    - b. 只有加载的角色可以播放它。对\n- c. 舞台可以有声音和脚本。对\n- d. 一旦你为脚本选择了背景，你就无法更改它。错\n- e. 角色可以使用脚本更改舞台背景。对\n\
    \n第 22–23 页 如果那么\n\n这个脚本应该在按下空格键时让角色改变颜色，但角色一直在改变颜色。你能发现虫虫吗？“将特效增加 5”积木需要放在“如果那么”积木内部。\n\
    \n![](img/c8b294ee7af329f5e2b96cede7af2ab1_38_0.png)\n\n第 24–25 页 变量\n\n- 1. 变量有一个名称和一个值。\n\
    - 2. 制作变量按钮位于橙色的数据积木中。\n- 3. 填充这些积木组的对话框：\n\n![](img/c8b294ee7af329f5e2b96cede7af2ab1_38_1.png)\n\
    \n橙色变量积木让狗说“Spot!”（变量）。如果你输入“name?”它就会说“name!”（始终使用橙色积木获取变量的值。）\n\n第 26–27 页 数学\n\
    \n- 1. 你是电脑！计算这些积木的值。![](img/c8b294ee7af329f5e2b96cede7af2ab1_39_0.png)\n\n- 2.\
    \ 这些积木使用了变量。你能算出答案吗？\n\n![](img/c8b294ee7af329f5e2b96cede7af2ab1_39_1.png)\n\n\
    - 3. 写下存储在这些变量中的值。![](img/c8b294ee7af329f5e2b96cede7af2ab1_39_2.png)\n\n第 28–29\
    \ 页 输入与事件\n\n- 1. 哪个蓝色积木让角色提问？ask\n- 2. 哪个积木持有回答？answer\n- 3. 发生在电脑上的事情（如鼠标点击或按键）被称为事件（event）。\n\
    - 4. 如果我点击带有此脚本的角色，会发生什么？！[](img/c8b294ee7af329f5e2b96cede7af2ab1_39_3.png)\n\
    角色说：“你点击了我！”\n- 5. 可以同时运行多个脚本吗？是的。（许多脚本可以同时在多个角色上运行。）\n\n第 30–31 页 如果那么否则\n\n\
    - 1. 什么形状的积木进入“如果那么”或“如果那么否则”的条件窗口？\n- 2. 查看下面的变量，然后圈出值为“true”（真）的绿色运算符积木。\n\n\
    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_40_0.png)\n\n第 32–33 页 ：龙！\n\n- 1. 我们为什么要保持分数变量的复选框勾选状态？\n\
    - 2. 你如何让龙在开始时以半速度运行？\n- 3. 你可以在猫咪的无限循环内部添加哪个积木让它看起来像在走路？\n- 4. 龙有多少种装扮？\n- 5.\
    \ 如果你在角色列表中右键点击龙并选择“复制”，会发生什么？\n\n# 词汇表\n\n动画（animation）：快速更换图片使物体移动。\n\n在 Scratch\
    \ 中卡住了？点击菜单栏上的“提示”（Tips）获取建议。或使用“帮助”工具——点击它可以打开该积木的帮助页面。\n\n![](img/c8b294ee7af329f5e2b96cede7af2ab1_41_0.png)\n\
    \n背景（backdrop）：角色后面的图片。\n\n调试（debug）：移除并修复虫虫。\n\n操作系统（OS）：控制你电脑所有内容的程序，例如 OS 或\
    \ Windows。\n\n背包（backpack）：在 Scratch 项目之间复制内容的方法。\n\n事件（event）：发生在电脑上的事情，如鼠标点击。\n\
    \n运行（run）：启动程序。\n\n积木（block）：Scratch 中的一种指令。积木可以组合在一起。\n\n输入（input）：进入程序的数据，例如来自键盘。\n\
    \n脚本（script）：运行的指令堆。\n\n虫虫（bug）：程序中的错误。因为昆虫进入了第一批电脑的布线导致了错误。\n\n库（library）：角色、声音或装扮的集合。\n\
    \n角色（sprite）：舞台上可以移动和改变的图片。\n\n条件（condition）：用于在程序中做出决策的“真”或“假”问题。\n\n循环（loop）：让指令重复的指令。\n\
    \n舞台（stage）：包含角色区域，Scratch 项目在此运行。\n\n装扮（costume）：角色在舞台上显示的图片。\n\n程序（program）：告诉电脑执行的指令列表。\n\
    \n字符串（string）：程序员用于包含单词的数据类型。\n\n数据（data）：信息——例如数字或单词。\n\n运算符（operator）：根据数据计算的积木，例如将两个数字相加。\n\
    \n变量（variable）：程序中存储数据的地方。变量始终有一个名称和一个值。\n\n> 给家长的注\n帮助孩子逻辑性地解决任何困难。检查明显的错误，例如脚本中交换了相似的积木。还要检查脚本是否控制了正确的角色。不要忘记\
    \ Scratch 应该是有趣的。Scratch 网站由麻省省理工学院（MIT）运行，旨在供儿童安全使用。自己试 true吧！\n\n"
