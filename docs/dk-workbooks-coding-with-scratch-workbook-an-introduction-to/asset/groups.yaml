  - '[PAGE 30]


    # Events Trigger Scripts


    Events are things that happen that the computer can tell Scratch about, such as
    key presses and mouse clicks. The brown Events “header” blocks start to run a
    script when a chosen event happens, in the same way that the green flag button
    can start a script when you click on it.


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_30_0.png)


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_30_1.png)


    # Build a Drum Kit


    Create lists of scripts like these. Select a different key and a different drum
    for each version of the script. The blocks below an Events header are run when
    you press the correct key. Play an epic drum solo using your selected keys!


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_30_2.png)


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_30_3.png)


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_30_4.png)


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_30_5.png)


    # Show What You Know


    Can you answer these questions about inputs and Events?


    +   1. Which blue Sensing block makes a sprite ask a question? ............................

    2. Which block holds the reply given to the question? ....................................

    3. Something that happens to the computer, like a mouse click or a key press,
    is called an ....................................

    4. What happens if I click a sprite with this script? ....................................................

    5. Can more than one script be running at once? ....................................


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_30_6.png)'
  - '[PAGE 31]


    # if-then-else


    Let''s meet the if-then-else block. This block uses a question, or condition,
    to choose between two groups of blocks to run. We''ll also look at some handy
    condition blocks that use variables and values to ask “true or false?”


    +   What You''ll Learn:

    * How to compare numbers, replies, and variables to make decisions

    * How an if-then-else block works


    # Comparing Things


    There is another kind of block that asks a “true or false?” question. In the green
    Operators section there are 3 blocks that compare what''s in their two windows.
    To read them, you need to know what these symbols mean: =, <, and >.


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_31_0.png)


    # Password Checker


    An if-then-else block has two groups of blocks inside. It runs the first group
    if the condition is true, and the second group if the condition is false. We can
    use it to check a password.


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_31_1.png)


    Block runs if answer is “dragon”


    Block runs if answer is NOT “dragon”


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_31_2.png)


    Equals (=) block compares answer with password'
  - '[PAGE 32]


    # Friend or Foe?


    Read and run the script. Only one of the two say blocks is run. The other is skipped.
    We get just one of the replies. If we type in the correct password


    If condition is TRUE, then else


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_32_0.png)


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_32_1.png)


    # Free Ice Cream!


    The if-then-else block can be used to check if you''re under 10 and so get free
    ice cream. One say block gets run, but the other doesn''t. Read the script. Run
    it a few times with different ages.


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_32_2.png)


    Is age less than 10? TRUE—under 10 FALSE—10 and over


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_32_3.png)


