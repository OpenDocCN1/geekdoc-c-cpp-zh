  mdcn: '


    # 数学


    Scratch 可以完成你熟悉的所有数学运算。但它使用的一些符号有所不同，以适应你电脑键盘的布局。我们可以在 Scratch 中编写等式并在其中使用变量。Scratch
    甚至可以为掷骰子。


    - 你将学习：

    - 如何在 Scratch 中进行数学运算

    - 计算机使用的数学符号

    - 如何使用变量编写等式

    - 如何使用电脑“掷骰子”


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_27_0.png)


    # 数学工具


    要进行数学运算，你需要绿色的“运算符”模块。每个模块都会对两个窗口中的数字进行不同的运算。


    ### 加法 (+)

    "+" 积会将模块中的两个数字相加。


    ### 减法 (-)

    "-" 积会从第一个数字中减去第二个数字。


    # 放置运算符


    无论你将运算符积放在哪里，它都会显示该题目的答案。所以，如果你把它放在“说”积的窗口里，猫就会说出答案。


    ### 乘法 (*)

    Scratch 使用 "*" 符号，因为 "x" 看起来像一个字母。


    ### 除法 (/)

    键盘上没有除法符号。Scratch 使用 "/" 代替。


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_27_1.png)


    放入说窗口的加法 积


    聪明的猫！


    # 数学与变量


    我们可以使用运算符积来解决涉及变量的问题。例如，为了找到宠物的总数，我们可以使用加法 积将变量 `dogs` 和 `cats` 的值相加并将并将存储在一个名为
    `pets` 的变量中。


    将加法 积放入设置积的窗口中


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_27_2.png)


    猫在想 15


    # 掷骰子


    随机数是我们无法预测的数字。它就像我们掷骰子时得到的数字——在掷之前，我们并不知道数字是多少。Scratch 可以像骰子一样工作为我们“掷骰”。在一个新项目中尝试这个脚本。


    阅读脚本然后运行它。猫在思考时会向你展示四个随机数。随机数在游戏中非常有用，因为它们让动作变得难以预测。


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_28_0.png)


    # 展示你的所学


    - 1. 你是电脑！计算这些积模块的值。


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_28_1.png)


    - 2. 这些积使用了变量。你能算出答案吗？


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_28_2.png)


    - 3. 写下存储在变量中的值。


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_28_3.png)


    # 输入与事件


    输入程序的数据（例如当 Scratch 提问时你输入的答案）被称为“输入”。事件是动作，比如点击角色或按下选定的键，Scratch 可以利用这些事件运行脚本。


    - 你将学习：

    - 如何提问并使用答案

    - 什么是**事件** 积

    - 如何通过按键或点击运行脚本


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_29_0.png)


    # 只管提问


    角色可以使用“感知”标签下的浅蓝色“询问”和“回答”积来提问和获取答案。开启新项目并添加此脚本。阅读脚本。它会做什么？


    猫在提问。


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_29_1.png)


    午吃什么？


    输入“猫吃的”


    ```

    当询问午吃什么？

    想：好吃！

    等待 2 秒

    ```


    问题在这里


    ```

    猫吃的！

    ```


    运算符部分


    存储在回答 积中的回复


    然后按下回车


    # Scratch 的午餐时间！


    猫提问并等待你输入回复。当你按下回车时，你输入的内容就是 `回答` 积的值。


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_29_2.png)


    好吃！

    猫吃的！


    # 回答就像变量


    `回答` 积的作用就像一个变量。无论你把 `回答` 积放在哪里，它都会被你的回答替换。上面的绿色“拼接”积会将它的两个窗口的内容连接在一起。


    它总是饿的！


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_29_3.png)


    # 事件触发


    事件是电脑可以告知你的状况，比如按键和鼠标点击。棕色的“事件”积在事件发生时运行脚本，就像绿色旗帜在被点击时运行脚本一样。


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_30_0.png)


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_30_1.png)


    # 制作一套打击乐


    创建像这样的脚本列表。为每个版本的脚本选择不同的键和不同的乐器。当你按下正确的键时，运行下面的积。使用你选择的键弹奏独奏！


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_30_2.png)


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_30_3.png)


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_30_4.png)


    # 展示你的知识


    你能回答这些关于输入和事件的问题吗？


    - 1. 哪个蓝色的感知积让角色提问？...........................

    - 2. 哪个积持有给出的回复？...................................

    - 3. 电脑上发生的动作（如鼠标点击或按键）被称为...................................................

    - 4. 如果我点击带有此脚本的角色会发生什么？...................................................

    - 5. 可以同时运行多个脚本吗？...................................


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_30_6.png)


    # 如果-那么-否则 (if-then-else)


    让我们认识“如果-那么-否则”。如果-那么-否则”积可以做决策。


    - 你将学习：

    - 如何提问并使用答案

    - 什么是**事件** 积

    - 如何通过按键或点击运行脚本


    # 比较事物


    还有一个“如果-那么-否则”。在“运算符”部分有 `=`、`<` 和 `>` 等符号。


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_31_0.png)


    # 检查器


    “如果-那么-否则”积可以检查你是否小于 10。第一组为真，第二组为假。


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_31_1.png)


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_31_2.png)


    # 朋友还是敌人？


    “如果-那么-否则”积有两个组。一个在为真运行时，另一个在为假时运行。


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_32_0.png)


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_32_1.png)


    # 冰淇淋！


    “如果-那么-否则”积可以检查你是否小于 10。第一组为真，第二组为假。


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_32_2.png)


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_32_3.png)


    # 展示你的知识


    你能回答这些关于输入和事件的问题吗？


    - 1. 哪个蓝色的感知积让角色提问？...........................

    - 2. 哪个积持有给出的回复？...................................

    - 3. 电脑上发生的动作（如鼠标点击或按键）被称为...................................

    - 4. 如果我点击带有此脚本的角色会发生什么？...................................................

    - 5. 可以同时运行多个脚本吗？...................................


    '
