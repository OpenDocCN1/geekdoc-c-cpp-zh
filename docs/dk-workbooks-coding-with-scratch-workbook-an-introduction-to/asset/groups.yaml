  mdcn: "\n\n## 哪个方向？\n\n当你想要移动一个角色时，你需要知道两件事：多远以及向哪个方向。每个角色都有一个内置的方向箭头。当脚本运行到深蓝色的移动模块时，那就是角色将要去的方向。\n\
    \n- 你将学到：\n- 如何让角色指向不同的方向\n- 如何制作一个角色\n\n## 猫咪跟随鼠标！\n\n让我们的猫咪在所有可能的方向上旋转。在 Scratch\
    \ 编辑器中打开一个新项目。为猫咪角色编写此脚本。阅读这段脚本。你认为它是做什么的？点击绿色旗帜看看你是否猜得正确。\n\n来自棕色的“事件 (Events)”模块\n\
    - 来自黄色的“控制 (Control)”模块\n- 来自深蓝色的“动作 (Motion)”模块\n\n```\nwhen clicked\nforever\n\
    point toward cursor\n```\n\n猫咪将跟随鼠标指针\n\n在舞台上移动鼠标，观察猫咪转动，让它始终面向指针。`forever` 模块会反复执行\
    \ `point toward cursor` 模块。\n\n![](img/c8b294ee7af329f5e2b96cede7af2ab1_15_0.png)\n\
    \n如果不起作用，请检查旋转样式 (rotation style)\n\n## 角色知道要去哪里！\n\n方向 (direction): -90\n\n每个角色都知道自己指向的方向。当你点击蓝色的\
    \ **i** 时，角色信息面板中会显示角色的方向。\n\n角色信息面板上的方向圆\n\n方向 -90° 意味着“向左”\n\n方向 0° 意味着“向上”\n\
    \n随着猫咪旋转，你会看到它的方向值在变化，蓝色的线条指针在圆上移动。\n\n![](img/c8b294ee7af329f5e2b96cede7af2ab1_15_1.png)\n\
    \n方向 180° 意味着“向下”\n\n方向 90° 意味着“向右”\n\n使用这里显示的“指南针”来解码方向数字。\n\n## 选择角色方向\n\n我们也可以使用带有\
    \ **point in direction**（面向方向）模块的窗口来设置角色的方向。你可以点击数字旁边的小三角形来选择常用方向，或者直接点击窗口并输入数字。\n\
    \n![](img/c8b294ee7af329f5e2b96cede7af2ab1_16_0.png)\n\n## 再次碰撞墙壁\n\n在第 12 页的“反弹墙壁”脚本中添加\
    \ **point in direction 45** 模块。将它放在 **when green flag clicked** 模块之后、**forever**\
    \ 模块之前。运行脚本。猫咪将沿对角线出发。尝试不同的方向和旋转样式。\n\n## 展示你的才华\n\n熟悉 Scratch 吗？试一下这些脑筋转弯吧！\n\
    \n- 1. 这个模块中应该用哪个数字替换 ? 来将角色的方向设置为：\n\n向上 = .................................................n向下\
    \ = .................................................\n\n向左 = .................................................n向右\
    \ = .................................................\n\n- 2. 测试你的 Scratch 脚本阅读能力！这个脚本是做什么什么的？仔细阅读它并尝试在脑海中模拟每个模块。\n\
    \n![](img/c8b294ee7af329f5e2b96cede7af2ab1_16_1.png)\n\n................................................................................................n................................................................................................n................................................................................................\n\
    \n## 循环\n\n在计算机程序中，我们经常想要多次执行相同的指令。为了避免多次放置相同的模块，我们可以将它们包装在一个循环指令中，以重复这些模块。来认识\
    \ `forever`（永远）和 `repeat`（重复）循环吧！\n\n- 你将学到：\n- 如何使用循环重复一组模块\n- `forever` 循环和\
    \ `repeat` 循环之间的区别\n- 如何在 Scratch 中发出声音\n\n![](img/c8b294ee7af329f5e2b96cede7af2ab1_17_0.png)\n\
    \n## 执行模块\n\n启动新项目并制作此脚本。阅读、理解并运行它。它运行得很快，没做什么作用。\n\n模块按顺序执行。\n\n当我们运行脚本时，每个模块都从上到底执行。首先猫咪转动了一下，然后猫咪的颜色变了。\n\
    \n![](img/c8b294ee7af329f5e2b96cede7af2ab1_17_1.png)\n\n![](img/c8b294ee7af329f5e2b96cede7af2ab1_17_2.png)\n\
    \n## 永远循环\n\n循环指令按从上到下的顺序运行脚本，然后回到顶部。`forever` 循环再次运行内部的模块。尝试在模块周围套上 `forever`\
    \ 循环。\n\n![](img/c8b294ee7af329f5e2b96cede7af2ab1_17_3.png)\n\n动作完成后，程序总是回到开始。现在每次重复\
    \ `forever` 循环中的模块时，猫咪转动更多并改变颜色。点击红色按钮停止循环。\n\n![](img/c8b294ee7af329f5e2b96cede7af2ab1_17_4.png)\n\
    \n## 重复循环\n\n如果我们只想重复几次模块然后执行脚本的剩余部分，我们可以使用 `repeat` 循环。\n\n为猫咪尝试此脚本。`repeat`\
    \ 循环执行两个模块 10 次，然后执行 `think` 模块。尝试改变重复次数。\n\n![](img/c8b294ee7af329f5e2b96cede7af2ab1_18_0.png)\n\
    \n## 展示你的知识\n\n你对循环了解多少？通过这个测验测试一下自己。\n\n- 1. 循环用于 ............................................模块组。\n\
    - 2. 两种 Scratch 循环是 ......................... 和 ....................................\n\
    - 3. 你可以通过点击 .................................停止 `forever` 循环。\n- 4. 在哪个部分你可以找到粉色的模块？........................\n\
    - 5. 哪个模块包含循环？\n- 6. 找虫！这个脚本应该画出正方形的四边，但运行时什么都没有发生。你能发现并建议修复方法吗？程序员称之为“调试 (debugging)”。\n\
    \n![](img/c8b294ee7af329f5e2b96cede7af2ab1_18_1.png)\n\n## 动画\n\n动画中的角色似乎在移动，但实际上你只是看着许多略微不同的图片欺骗了你的大脑。这被称为动画。角色可以用相同的方式制作动画。\n\
    \n- 如何为角色制作动画\n- 角色可以改变外观\n- 如何使用装帧 (costumes)\n- 如何从库中加载新角色\n\n![](img/c8b294ee7af329f5e2b96cede7af2ab1_19_0.png)\n\
    \n## 装帧\n\n我们的猫咪角色有两个不同的图片，或“装帧 (costumes)”，它可以显示。启动一个新的 Scratch 项目并点击模块列表上面的“装帧”选项卡。你将看到猫咪角色可以“穿”的两个装帧。\n\
    \n为了制作动画，编写并运行此脚本。`forever` 循环重复 `next costume` 模块。图片每半秒变化一次，这让猫咪看起来像在走路。尝试在循环中添加\
    \ `move` 模块来改进动画。\n\n![](img/c8b294ee7af329f5e2b96cede7af2ab1_19_1.png)\n\n![](img/c8b294ee7af329f5e2b96cede7af2ab1_19_2.png)\n\
    \n> 角色的装帧按顺序排列\n\n这选择了下一个装帧。快速切换装帧让猫咪看起来像在走路。\n\n```\nwhen clicked\nforever\n\
    \  next costume\n  wait 0.5 secs\n```\n\n![](img/c8b294ee7af329f5e2b96cede7af2ab1_19_3.png)\n\
    \n`wait` 防止装帧切换过快\n\n## 芭蕾舞者\n\n你可以使用相同的脚本让其他角色也跳起来！让我们添加芭蕾舞者角色。点击角色列表顶部的“从库中选择角色”。然后选择芭蕾舞者并点击确定。\n\
    \n将切换装帧的脚本添加到芭蕾舞者的脚本区域。她有四个装帧。点击“装帧”选项卡查看它们。当你运行脚本时，她在舞台上跳舞时使用了所有的装帧。\n\n![](img/c8b294ee7af329f5e2b96cede7af2ab1_20_0.png)\n\
    \n点击第一个图标查看所有角色\n\n![](img/c8b294ee7af329f5e2b96cede7af2ab1_20_1.png)\n\n![](img/c8b294ee7af329f5e2b96cede7af2ab1_20_2.png)\n\
    \n## 角色派对！\n\n尝试向你的项目添加许多正在跳舞的角色。选择具有两个或更多装帧的角色。尝试 Dinosaur1 或一些跳舞的小孩。\n\n## 展示你的才华\n\
    \n你可以让角色跳舞。你也能解决这些问题吗？\n\n- 1. 角色在舞台上显示的不同图片是 .................................................\n\
    - 2. ............................................ 通过按顺序显示略微不同的图片来让角色看起来在移动。\n\
    - 3. 你能重新排列下面的角色来制作跳跃小马的动画吗？\n在框内填写数字 1 到 5 以显示正确的顺序。\n\n![](img/c8b294ee7af329f5e2b96cede7af2ab1_20_3.png)\n\
    \n"
