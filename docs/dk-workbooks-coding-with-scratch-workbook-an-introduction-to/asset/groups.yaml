    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_23_2.png)


    Cat turns 15 degrees to the right


    - Now Press the “d” Key

    The cat turns the other way. The turn block inside the second if-then block is
    only run when the answer to the question "key d pressed?" is “true.” If neither
    key is pressed, both blocks are skipped.


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_23_3.png)


    # A Closer Look at the if-then Block


    Look at this if-then block from a script. Read carefully and think about what
    it does.


    If answer''s "false," blocks are skipped

    Condition (answer is "true" or "false")

    If answer''s "true," blocks are run


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_24_0.png)


    - The if-then block is a yellow Control block because blocks inside it are run.

    - An if-then block has a question as condition. The question must have a true/false
    answer.

    - The blocks inside the if-then block are only run when the answer to the question
    is "true."


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_24_1.png)


    - If the answer to the question is "false," the blocks inside the if-then block
    are ignored.

    - Add this if-then to your script so the cat meows when you press the "s" key.
    Put the if-then block inside the loop but outside the if-then blocks.


    # Show What You Know


    If you''re a Scratch expert, you''ll find this bug easy!

    This script should make the sprite change color when you press the space key,
    but the sprite changes color all the time. Can you spot the "bug"?


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_24_2.png)


    # Variables


    Computers are excellent at storing information, or "data." This data could be
    someone''s name or the weight of a cake. A variable is like a labeled box in which
    you can store data until your program needs it.


    - You''ll Learn:

    - Variables store data in programs

    - How to make and use variables

    - Using variables makes code clearer


    # A Box with a Label


    A variable can store a number or some words (programmers call words a "string").
    The thing stored in a variable is called its value. You can change the value of
    a variable. Give variables helpful names to make the code easy.


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_25_0.png)


    Follow these instructions to create your first variable in Scratch.


    - 1 Start with Data

    Select **Data** under the **Scripts** tab. Then click on **Make Variable** button.
    The **New Variable** window will pop up.


    - 2 Name It, Check It, Click It!

    First, give your variable a useful name. Check *For all sprites*, and click **OK**.
    (You can ignore *For this sprite only* and *Cloud variables*.)


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_25_1.png)


    - 3 Get to Know Your Blocks!

    Blocks for this variable will then appear in the blocks area. Make sure you know
    what each of the blocks does.


    Check to show the variable on the stage

    The variable block can be used inside other blocks


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_25_2.png)


    # Countdown Cat


    Time to see some variables in action. Start a new project.


    In the orange Data section, create two variables called count and message. Always
    give your variables names that explain what''s stored in them.


    Add this script. Make sure you drag the little orange blocks with count and message
    on them into the windows of the say blocks. Don''t type the words into the say
    windows. If you do, the cat will say the variable''s name rather than what''s
    stored in the variable.


    Read the script. Can you work out what''s going to happen? Now run the script.


    Experiment with the numbers and text in the script. Can you make the cat count
    up instead of down?


    ```

    when clicked

    set [count] to [10]

    set [message] to Blast off!

    repeat (10)

    say [count] for 1 secs

    change [count] by -1

    ```


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_26_1.png)


    # See What You Know


    Test how much Scratch data you''ve stored in your brain-box.


    - 1. A variable has a name and a ....

    - 2. Make a Variable button is found in the orange ... blocks section.

    - 3. Fill in the speech bubbles for these sets of blocks:


    ```

    set [name] to Spot!

    say [name]

    set [name] to Spot!

    say [name]

    ```


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_26_2.png)

