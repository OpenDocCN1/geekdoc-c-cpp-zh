    ![](img/c8294ee7af329f5e2b96cede7af2ab1_10_1.png)


    背包用于复制角色、造型和声音

    从此处将块拖入脚本区域

    在此处编写脚本


    # 你的第一个项目


    该开始我们的 Scratch 项目了。我们将创建一些简单的指令来让猫说话。通过用鼠标移动块，我们可以构建一个名为脚本的简单程序。


    - 你将学习：

    - 角色是由脚本控制的

    - 如何从 Scratch 块构建脚本

    - 脚本中的事情会一个个执行

    - 你可以阅读 Scratch 来了解它的功能


    ![](img/c8294ee7af329f5e2b96cede7af2ab1_11_0.png)


    # Scratch——友善的小猫


    首先，打开 Scratch 编辑器：：在 Scratch 网站上选择，或点击你电脑上的图标。你会看到猫角色站在舞台上。让我们编写一个脚本来告诉猫该做什么。


    ![](img/c8294ee7af329f5e2b96cede7af2ab1_11_1.png) 点击“看起来”标签


    ![](img/c8294ee7af329f5e2b96cede7af2ab1_11_2.png)


    - 1 开始一个新脚本

    我们将从让猫说“你好！”开始。点击编辑器中心的脚本标签。

    - 2 选择“说”块

    编辑器中间的块列表会变化。用鼠标点击顶部的“说”块并将其拖到右侧。


    ```

    说 你好！2 秒

    ```

    - 3 再次执行

    将第二个“说”块拖入脚本区域。当块重叠时释放鼠标，它们会像拼图一样锁定。


    ```

    说 你好！2 秒

    说 你好！2 秒

    ```

    - 4 更改猫说的内容我们可以让猫说不同的内容。点击底部的说框。输入一条新消息，如“天气不错！”。


    ```

    说 你好！2 秒

    说 天气不错！2 秒

    ``` 消息在这里


    # 完成你的脚本


    点击“事件”标签。将列表中的棕色块拖到右侧脚本区域。悬停在顶部的“说”块上，然后松开。棕色块会连接。


    点击绿旗运行脚本


    # 阅读整个脚本


    脚本告诉我们我们需要点击舞台右上角的绿旗。这被称为“运行”脚本。


    ![](img/c8294ee7af329f5e2b96cede7af2ab1_12_0.png)


    # 观察动作


    当你点击绿旗时，猫会说“你好！”2 秒。然后它会说“天气不错！”2 秒。


    > 观察块是如何工作的——猫按顺序执行每个动作。


    # 保存


    做得棒！你构建了第一个 Scratch 项目。点击“文件”菜单并“保存”或“全部保存”。


    # Scratch 谜题


    我们挑选了一些块供猫尝试。为每个块画一条线到猫将执行的正确图片。


    # 移动它！


    你将学习：

    * 如何创建一个角色

    * Scratch 以“步”为单位测量

    * 如何让角色直立


    ![](img/c8294ee7af329f5e2b96cede7af2ab1_13_0.png) 现在开始动作。让我们使用深蓝色动作块让猫移动。Scratch
    以“步”测量距离。舞台宽 480 步，高 360 步。有一个块可以防止角色卡在墙上。它们会弹回来！


    - 让猫移动

    开始一个新项目。点击舞台上“新建”。添加此脚本并思考块的作用。


    ![](img/c8294ee7af329f5e2b96cede7af2ab1_13_1.png) 点击绿旗运行脚本。猫会向右移动一小段。尝试几次。


    ![](img/c8294ee7af329f5e2b96cede7af2ab1_13_2.png) 点击“移动”块中的 10 并输入 100。现在猫每次移动的距离远得多。尝试不同的步数进行实验。


    ![](img/c8294ee7af329f5e2b96cede7af2ab1_13_3.png)


    - 在墙上反弹

    现在将你的脚本改为这样。阅读脚本。你认为它在做什么？“重复”块会重复内部的内容！“如果碰到边缘”块会让猫在边缘转弯。


    ![](img/c8294ee7af329f5e2b96cede7af2ab1_13_4.png) 运行新脚本。现在猫会在舞台上向右、向左移动。实验——步数越多，猫移动得越快。


    ![](img/c8294ee7af329f5e2b96cede7af2ab1_13_5.png)


    # 别倒立着，猫！


    可怜的猫整天倒着——太糟糕了！要停止这一点，点击角色列表左角的蓝色区域。会出现关于角色的额外信息。将旋转样式改为 <->。尝试其他样式看看猫会做什么。


    ![](img/c8294ee7af329f5e2b96cede7af2ab1_14_0.png)


    ![](img/c8294ee7af329f5e2b96cede7af2ab1_14_1.png)


    猫面向它行走的方向，有时是倒着的。


    直立着向右走


    ![](img/c8294ee7af329f5e2b96cede7af2ab1_14_2.png)


    | 猫 | x: 84 y: 69 方向: -90° |

    | 旋转样式: [] 拖入玩家: [] 显示: |


    猫面向左或右，且始终直立。


    # 展示你所学的


    你能通过这个测验答多远？一直到最后吗？


    - 1. 动作块是什么颜色的？

    2. Scratch 以什么为单位测量距离？

    2a. 舞台宽是多少单位？

    2b. 舞台高是多少单位？

    3. 程序中的错误被称为“漏洞 (bug)”。


    '
