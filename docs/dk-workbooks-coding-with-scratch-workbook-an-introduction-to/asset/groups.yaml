    \  a. 角色可以使用脚本来更改舞台的背景。................................................\n\n# 如果-那么\n\
    \n如果下雨了，我们决定穿雨衣。我们可以使用黄色控制（Control）部分的如果那么积块来制作这种判断。就像循环一样，它们包裹其他积块并控制它们的何时执行。\n\
    \n- 你将学到：\n- 关于如果那么积块\n- 如何控制积块执行或跳过\n- 如何在按下按时感知![](img/c8b294ee7af329f5e2b96cede7af2ab1_23_0.png)\n\
    \n# 旋转控制\n\n让我们使用如果那么积块来决定猫何时旋转。我们将使用一些蓝色的感知（Sensing）积块来询问“真或假？”。在脚本选项卡下找到它们。\n\
    \n- 启动新项目\n  添加这个脚本。你认为它是做什么的？每个如果那么积块内部的积块只有在答案为“真”时才执行。\n猫向左旋转15 度![](img/c8b294ee7af329f5e2b96cede7af2ab1_23_1.png)\n\
