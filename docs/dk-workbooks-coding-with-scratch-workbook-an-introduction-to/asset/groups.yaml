    \n猫向右旋转15 度\n\n- 现在按下“d”键\n  猫向另一个方向旋转。第二个如果那么积块内部的积块只有在“按下d?”的答案为“真”时才执行。如果两个键都没有按下，两个积块都会被跳过![](img/c8b294ee7af329f5e2b96cede7af2ab1_23_3.png)\n\
    \n# 观察如果那么积块\n\n查看这个脚本中的如果那么积块。仔细阅读并思考它是做什么的。\n\n如果答案为“假”，积块被跳过\n条件（答案为“真”或“假”）\n\
    如果答案为“真”，积块执行![](img/c8b294ee7af329f5e2b96cede7af2ab1_24_0.png)\n\n- 如果那么积块是黄色控制积块，因为其内部的积块会被执行。\n\
    - 一个如果那么积块有一个问题作为条件。问题必须有真/假答案。\n- 如果那么积块内部的积块只有在问题的答案为“真”时才执行![](img/c8b294ee7af329f5e2b96cede7af2ab1_24_1.png)\n\
    \n- 如果问题的答案为“假”，如果那么积块内部的积块会被忽略。\n- 将这个如果添加到添加到脚本中，当按下“s”键时猫会喵喵。将如果那么积块放在循环内部但在如果那么积块外部。\n\
    \n# 展示你的知识\n\n如果你是 Scratch 专家，你会很容易发现这个 Bug！这个脚本应该在按下空格键时让角色改变颜色，但角色一直在变色。你能发现这个“Bug”吗？![](img/c8b294ee7af329f5e2b96cede7af2ab1_24_2.png)\n\
    \n# 变量\n\n计算机非常擅长存储信息或“数据”。这些数据可以是人的名字，可以是蛋糕的重量。变量就像一个带标签的盒子，你可以在其中存储数据直到程序需要它。\n\
    \n- 你将学习：\n- 变量在程序中存储数据\n- 如何制作和使用变量\n- 使用变量让代码更清晰\n\n 带标签的盒子\n\n变量可以存储数字或单词（程序员称单词为“字符串”）。存储在变量中的内容被称为它的值。你可以更改变量的值。给变量起有帮助的名字让代码变得易读![](img/c8b294ee7af329f5e2b96cede7af2ab1_25_0.png)\n\
    \n按照这些指令在 Scratch 中创建第一个变量。\n\n- 1 从数据开始\n  在脚本（Scripts）选项卡下选择**数据**(Data)。然后点击**制作变量**(Make\
    \ Variable)按钮。将弹出**新建变量**(New Variable)窗口。\n\n- 2 命名、勾选、点击！\n  首先，给你的变量起一个有用的名字。勾选“所有角色”（For\
    \ all sprites），并点击“确定”（你可以忽略“仅限此角色”和“云端变量”）![](img/c8b294ee7af329f5e2b96cede7af2ab1_25_1.png)\n\
    \n- 3 认识你的积块！\n  该变量的积块将出现在积块区域。确保你了解每个积块的作用。\n\n勾选在舞台上显示变量\n变量积块可以在其他积块内部使用![](img/c8b294ee7af329f5e2b96cede7af2ab1_25_2.png)\n\
    \n# 倒计时的猫\n\n是时候看看变量的动作了。启动一个新项目。\n\n在橙色的数据部分，创建两个名为 count 和 message 的变量。始终给你的变量起一个解释其中存储了内容的名字。\n\
    \n添加这个脚本。确保你将带有 count 和 message 的小橙色积块拖入“说”（say）积块的窗口中。不要在说窗口里输入单词。如果你这样做，猫会说变量的名字而不是存储在变量的内容。\n\
    \n阅读脚本。你能算出会发生什么吗？现在运行脚本。\n\n尝试脚本中的数字和文本。你能让猫向上数而不是向下数吗？\n\n```\nwhen clicked\n\
    set [count] to [10]\nset [message] to [Blast off!]\nrepeat (10)\nsay [count] for\
    \ 1 secs\nchange [count] by -1\n```\n\n![](img/c8b294ee7af329f5e2b96cede7af2ab1_26_1.png)\n\
    \n# 展示你的知识\n\n测试你的大脑盒中存储了多少 Scratch 数据。\n\n- 1. 变量有一个名字和一个 ....\n- 2. 制作变量按钮位于橙色的\
