    \ 库中选取一些场景和音乐来让项目活跃起来。\n\n- 你将学到：\n- 如何更改背景图片\n- 如何为背景添加效果\n- 如何为你的项目添加音乐\n\n\
    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_21_0.png)\n\n# 添加场景——背景\n\n就像角色可以有很多造型一样，舞台也可以有多个背景图片，或者说多个背景（backdrop）。点击**舞台信息**(Stage\
