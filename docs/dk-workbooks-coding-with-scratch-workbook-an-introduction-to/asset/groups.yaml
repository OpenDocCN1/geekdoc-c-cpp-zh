  - '[PAGE 27]


    # Math


    Scratch can do all the math you know about. But some of the symbols it uses are
    different, to fit with what''s on your computer''s keyboard. We can do equations
    in Scratch and use variables in them. Scratch can even roll dice for us.


    +   What You''ll Learn:

    * How to do math in Scratch

    * What math symbols computers use

    * How to do equations with variables

    * How to "roll dice" using the computer


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_27_0.png)


    # Math Tools


    To do math you need the green Operators blocks. Each block does a different problem
    with the numbers in the two windows.


    Add (+)

    The "+" block adds the two numbers in block together.


    Subtract (-)

    The "-" block takes the second number away from the first.


    # Placing Operators


    Wherever you put an operator block, it will put the answer to the problem. So
    if you put it into the window of a say block, the cat will say the answer.


    Multiply (*)

    Scratch uses the "*" symbol, because "x" looks like a letter.


    Divide (/\)

    The keyboard has no division sign. Scratch uses "/" instead.


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_27_1.png)


    Add (+) block put into say window


    Smart cat!


    # Math and Variables


    We can use operator blocks to solve problems with variables. For example, to find
    the total number of pets, we can use the add (+) block to add up the values of
    the variables dogs and cats, and store the answer in a variable called pets.


    Add (+) block put into window of set block


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_27_2.png)


    Cat will think of 15'
  - '[PAGE 28]


    # ► Throwing Dice


    A random number is one we can''t predict. It''s like a number we get when we roll
    dice—we don''t know what the numbers will be before we roll. Scratch can act like
    dice and “roll” for us. Try this script in a new project.


    Read the script, then run it. The cat will show you four random numbers as it
    thinks of them. Random numbers are useful in games, because they make the action
    difficult to guess.


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_28_0.png)


    # Show What You Know


    Try these mathematical mind-bogglers.


    +   1. You are the computer! Calculate the values of these blocks.


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_28_1.png)


    +   2. These blocks use variables. Can you work out the answers?


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_28_2.png)


    +   3. Write down the values stored in these variables.


    ![](img/c8b294ee7af329f5e2b96cede7af2ab1_28_3.png)'
