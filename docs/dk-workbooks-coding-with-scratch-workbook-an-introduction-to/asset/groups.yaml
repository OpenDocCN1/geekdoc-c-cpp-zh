  md: "\n# Math\n\nScratch can do all the math you know about. But some of the symbols\
    \ it uses are different, to fit with what's on your computer's keyboard. We can\
    \ do equations in Scratch and use variables in them. Scratch can even roll dice\
    \ for us.\n\n- What You'll Learn:\n- How to do math in Scratch\n- What math symbols\
    \ computers use\n- How to do equations with variables\n- How to \"roll dice\"\
    \ using the computer\n\n![](img/c8b294ee7af329f5e2b96cede7af2ab1_27_0.png)\n\n\
    # Math Tools\n\nTo do math you need the green Operators blocks. Each block does\
    \ a different problem with the numbers in the two windows.\n\n### Add (+)\nThe\
    \ \"+\" block adds the two numbers in block together.\n\n### Subtract (-)\nThe\
    \ \"-\" block takes the second number away from the first.\n\n# Placing Operators\n\
    \nWherever you put an operator block, it will put the answer to the problem. So\
    \ if you put it into the window of a say block, the cat will say the answer.\n\
    \n### Multiply (*)\nScratch uses the \"*\" symbol, because \"x\" looks like a\
    \ letter.\n\n### Divide (/)\nThe keyboard has no division sign. Scratch uses \"\
    /\" instead.\n\n![](img/c8b294ee7af329f5e2b96cede7af2ab1_27_1.png)\n\nAdd (+)\
    \ block put into say window\n\nSmart cat!\n\n# Math and Variables\n\nWe can use\
    \ operator blocks to solve problems with variables. For example, to find the total\
    \ number of pets, we can use the add (+) block to add up the values of the variables\
    \ dogs and cats, and store the answer in a variable called pets.\n\nAdd (+) block\
    \ put into window of set block\n\n![](img/c8b294ee7af329f5e2b96cede7af2ab1_27_2.png)\n\
    \nCat will think of 15\n\n# Throwing Dice\n\nA random number is one we can't predict.\
    \ It's like a number we get when we roll dice—we don't know what the numbers will\
