    # I digress . . .


    A while ago, I wondered what would happen if I called the Character.toUpperCase
    method and fed the method a character that isn''t lowercase to begin with. I yanked
    out the Java API documentation, but I found no useful information. The documentation
    said that toUpperCase ''converts the character argument to uppercase using case
    mapping information from the UnicodeData file.'' Thanks, but that''s not useful
    to me.


    Silly as it seems, I asked myself what I''d do if I were the toUpperCase method.
    What would I say if someone handed me a capital R and told me to capitalize that
