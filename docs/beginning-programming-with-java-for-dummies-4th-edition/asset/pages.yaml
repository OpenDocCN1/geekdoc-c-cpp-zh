- pgno: 42
  md: '# Setting Up Java


    You can get the latest, greatest versions of Java by visiting www.oracle.com/technetwork/java/javase/downloads.
    Look for the newest available version of the JDK. Select a version that runs on
    your computer''s operating system. Figure 2-1 shows me clicking a Download JDK
    button (circa March 2014) at the Oracle website.


    ![](img/bf4858233d2b2a32ff4e3991860526b3_42_0.png)


    Figure 2-1: Getting the Java JDK.


    If you can''t identify the most appropriate Java version or if you want to know
    what the acronyms JRE and JDK stand for, see the sidebar entitled ''Eenie, meenie,
    miney mo.'''
  merge: -1
  img_proc: true
- pgno: 43
  md: 'After you accept a license agreement and click a link to a Java installation
    file, your computer does one of two things:


    +   - Downloads and installs Java on your system.

    +   - Downloads the Java installation file and saves the file on your computer''s
    hard drive.


    If the installation begins on its own, follow the instructions, answer "Yes" to
    any prompts, and (unless you have good reason to do otherwise) accept the defaults.
    If the installation doesn''t begin on its own, start the installation by double-clicking
    the downloaded installation file.


    # Eenie, meenie, miney mo


    The Java Standard Edition download page (www.oracle.com/technetwork/java/javase/downloads)
    has many options. If you''re not familiar with these options, the page can be
    intimidating. Here are some of the choices on the page:


    # Word length: 32-bit or 64-bit


    You may have to choose between links labeled for 32-bit systems and links labeled
    for 64-bit systems. If you don''t know which to choose, start by trying the 32-bit
    version. (For more information about 32-bit systems and 64-bit systems, see the
    "How many bits does your computer have?" sidebar.)


    # Java version number


    The Java download page may have older and newer Java versions for you to choose
    from. You may see links to Java SE 7, Java SE 8, Java SE 8u4, and many others.
    (Numbering such as 8u4 stands for the fourth update to Java 8.) If you''re not
    sure which version number you want, choosing the highest version number is probably
    safe. Most of this book''s examples run on a computer with Java 5 installed. A
    few examples run only on Java 7, Java 8, or higher.


    The numbering of Java''s versions is really confusing. First comes Java 1.0, then
    Java 1.1, and then Java 2 Standard Edition 1.2 (J2SE 1.2). Yes, the "Java 2" numbering
    overlaps partially with the "1x" numbering. Next come versions 1.3 and 1.4. After
    version 1.4.1 comes version 1.4.2 (with intermediate stops at versions like 1.4_02).
    After 1.4.2_06, the next version is version 1.5, which is also known as version
    5.0. (That''s no misprint. Version 5.0 comes immediately after the 1.4 versions.)


    The formal name for version 1.5 is "Java 2 Platform, Standard Edition 5.0." And
    to make matters even worse, the next big release is "Java Platform, Standard Edition
    6" with the "2" removed from "Java 2" and the ".0" missing from "6.0." That''s
    what happens when a company lets marketing people call the shots.


    Mercifully, from Java 6 onward, the version numbers settle into a predictable
    pattern. After Java 6 comes "Java Platform, Standard Edition 7" and "Java Platform,
    Standard Edition 8" with updates such as "8u02" (meaning "Java 8, update 2").


    # JDK versus JRE


    The download page offers you a choice between the JDK (Java Development Kit) and
    the JRE (Java Runtime Environment). The JDK download contains more stuff than
    the JRE download. The JRE includes'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'a Java Virtual Machine and the Application Programming Interface (refer to
    Chapter 1). The JDK includes everything in the JRE, and in addition, the JDK includes
    a Java compiler (again, refer to Chapter 1).


    The Eclipse IDE contains its own Java compiler. So, you can start by downloading
    the smaller JRE (avoiding the big JDK download). But I recommend downloading the
    entire JDK. Why? Because you never know when another compiler (separate from Eclipse)
    will come in handy. Besides, the installation and configuration of Eclipse on
    a Mac is convoluted if you haven’t installed the full JDK. So, if you want to
    have a smooth ride, download the JDK instead of the JRE.


    By the way, another name for the JDK is the Java SDK — the Java Software Development
    Kit. Some people still use the SDK acronym, even though the folks at Oracle don’t
    use it anymore. (Actually, the original name was the JDK. Later, Sun Microsystems
    changed it to the SDK. A few years after that, the captains of Java changed back
    to the name JDK. This constant naming and renaming drives me crazy as an author.)


    # **Java SE versus Java EE versus Java ME**


    While you wonder around, you may notice links labeled Java EE or Java ME. If you
    know what these are, and you know you need them, by all means, download these
    goodies. But if you’re not sure, bypass both the Java EE and the Java ME links.
    Instead, follow links to the Java SE (Java Standard Edition).


    The abbreviation Java EE stands for Java Enterprise Edition and Java ME stands
    for Java Micro Edition. The Enterprise Edition has software for large businesses,
    and the Micro Edition has software for handheld devices. (Google’s Android software
    bears


    a passing resemblance to Java’s Micro Edition, but in many ways, Android and Java
    ME are very different animals.)


    You don’t need the Java EE or the Java ME to run any of the examples in this book.


    # **Additional Java-related software**


    You can download Java alone, or you can download Java with Oracle’s NetBeans IDE.
    You can download a collection of demos and samples. You can probably even download
    Java with fries and a soft drink. You can download plenty of extra stuff, but
    in truth, all you need is the Java JDK.


    # **Installation type**


    You may be prompted to choose between online installation and offline installation.


    With the offline installation, you begin by downloading a large setup file. The
    file takes up lots of space on your hard drive (between 30MB and 150MB, depending
    on what you choose to download). If you ever need to install the JDK again, you
    have the file on your own computer. Until you want a newer version of the JDK,
    you don’t need to download the JDK again.


    Why would anyone want to install the same version of the JDK a second time? Typically,
    I have two reasons. Either I want to install the software on a second computer,
    or I mess something up and have to uninstall (and then reinstall) the software.


    With the online installation, you don’t download a big setup file. Instead, you
    download a teeny little setup file. Then you download (and discard) pieces of
    the big 30MB to 150MB file as you need them. Using online installation saves you
    many megabytes of hard drive space. But, if you want to install the same version
    of the JDK a second time, you have to redo the whole surf/click/download process.'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'If your computer runs Linux, the downloaded file might be a .tar.gz file. A
    .tar.gz file is a compressed archive. Extract the archive''s contents to a folder
    of your choice and follow the installation instructions posted on the Oracle website.


    For more information about filenames, file types, and archives, see the sidebars
    entitled "Those pesky filename extensions" and "Compressed archive files" in this
    chapter.


    While you''re visiting www.oracle.com/technetwork/java/javase/downloads, you can
    also download a copy of the Java API documentation. Look for a download labeled
    Java SE Development Kit Documentation (or something like that). Accept the license
    agreement, click the download link, and watch the file flow downward onto your
    computer''s hard drive. The downloaded file is a compressed .zip archive, so you
    can uncompress it the way you uncompress all other such archives. (The uncompressed
    folder is a bunch of web pages. To start reading the Java API documentation, look
    in that folder for an index file or an index.html file. Double-click the file,
    and you''re on your way.)


    For an introduction to the Java API documentation, refer to Chapter 1.


    Most people have no difficulties visiting the Oracle website http://oracle.com/
    and installing Java using the website''s menus. But if your situation is more
    "interesting" than most, you may have to make some decisions and perform some
    extra steps. The next few sections describe some of these "interesting" scenarios.


    # How many bits does your computer have?


    As you follow this chapter''s instructions, you may be prompted to choose between
    two versions of a piece of software — the 32-bit version and the 64-bit version.
    What''s the difference, and why should you care?


    A bit is the smallest piece of information that you can store on a computer. Most
    people think of a bit as either a zero or a one, and that depiction of "bit" is
    quite useful. To represent almost any number, you pile several bits next to one
    another and do some fancy things with powers of two. The numbering system''s details
    aren''t show stoppers. The important thing to remember is that each piece of circuitry
    inside your computer stores the same number of bits. (Well, some circuits inside
    your computer are outliers with their own particular numbers of bits, but that''s
    not a big deal.)


    In an older computer, each piece of circuitry stores 32 bits. In a newer computer,
    each piece of circuitry stores 64 bits. This number of bits (either 32 or 64)
    is the computer''s word length. In a newer computer, a word is 64 bits long.


    "Great!" you say. "I bought my computer last week. It must be a 64-bit computer."
    Well, the story may not be that simple. In addition to your computer''s circuitry
    having a word length, the operating system on your computer also has a word length.
    An operating system''s instructions work with a particular number of bits. An
    operating system with 32-bit instructions can run on either a 32-bit computer
    or a 64-bit computer, but an operating system with 64-bit instructions can run
    only on a 64-bit computer. And to make things even more complicated, each program
    that you run (a web browser, a word'
  merge: -1
  img_proc: true
- pgno: 46
  md: "processor, or one of your own Java programs) is either a 32-bit program or\
    \ a 64-bit program. You may run a 32-bit web browser on a 64-bit operating system\
    \ running on a 64-bit computer. Alternatively, you may run a 32-bit browser on\
    \ a 32-bit operating system on a 64-bit computer. (See the figure that accompanies\
    \ this sidebar.)\n\n+   - If you run a 32-bit operating system, you run only 32-bit\
    \ software.\n+   - If you run a 64-bit operating system, you probably run some\
    \ 32-bit software and some 64-bit software. Most 32-bit software runs fine on\
    \ a 64-bit operating system.\n\n![](img/bf4858233d2b2a32ff4e3991860526b3_46_0.png)\n\
    \nWhen a website makes you choose between 32-bit and 64-bit software versions,\
    \ the main consideration is the word length of your operating system, not the\
    \ word length of your computer’s circuitry. You can run a 32-bit word processor\
    \ on a 64-bit operating system, but you can’t run a 64-bit word processor on a\
    \ 32-bit operating system (no matter what word length your computer’s circuitry\
    \ has). Choosing 64-bit software has one big advantage — namely, that 64-bit software\
    \ can access more than three gigabytes of a computer’s fast random access memory.\
    \ And in my experience, more memory means faster processing.\n\nHow does all this\
    \ stuff about word lengths affect your Java and Eclipse downloads? Here’s the\
    \ story:\n\n+   - On a 64-bit operating system, you might have two versions of\
    \ the same program. For example, on my Windows computer, I have two versions of\
    \ Internet Explorer — a 32-bit version and a 64-bit version.\n+   \n+   - Normally,\
    \ Windows puts 32-bit programs in its `Program Files (x86)` directory and puts\
    \ 64-bit programs in its `Program Files` directory.\n+   \n+   - A chain of word\
    \ lengths is as strong as its weakest link. For example, when I visit `http://java.com`\
    \ and click the site’s Do I Have Java? link, the answer I get depends on the match\
    \ between my computer’s Java version and the web browser that I’m running. With\
    \ only 64-bit Java installed"
  merge: -1
  img_proc: true
- pgno: 47
  md: '(continued)


    on my computer, the Do I Have? link in my 32-bit Firefox browser answers NO working
    Java was detected on your system. But the same link in my 64-bit Internet Explorer
    answers You have the recommended Java installed.


    On a Mac, Safari and Firefox are 64-bit browsers, but Chrome is a 32-bit browser.
    So on a Mac, you’re likely to see slightly different behavior when using Firefox
    versus Chrome.


    Here’s the most important thing to remember about word lengths: When you follow
    this chapter’s instructions, you get Java software and Eclipse software on your
    computer. Your Java software’s word length


    must match your Eclipse software’s word length. In other words, 32-bit Eclipse
    runs with 32-bit Java, and 64-bit Eclipse runs with 64-bit Java. I haven’t tried
    all possible combinations, but when I try to run 32-bit Eclipse with 64-bit Java,
    I see a misleading No Java virtual machine was found error message.


    Finally, some websites use unintuitive names for their software downloads. If
    you see *i365* or *i586* in the name of a download, that usually means 32-bit.
    If you see *x86* without the number 64 anywhere in a download’s name, that also
    means 32-bits. If you see *64* in the name (with or without the *x86* designation),
    that indicates a 64-bit program.


    # Finding Java on your computer


    Chapter 1 describes the Java ecosystem with its compiler, its virtual machine,
    and its other parts. Your computer may already have some of these Java gizmos.
    If so, you can either live with what you already have or add the newest version
    of Java to whatever is already on your system.


    ![](img/bf4858233d2b2a32ff4e3991860526b3_47_0.png)


    Java’s versions aren’t like indoor cats. They can coexist on the same computer
    without fighting or hissing at one another. If you have more than one version
    of Java on your computer, you’re okay. You can even mix 32-bit versions and 64-bit
    versions on the same computer (as long as you have at least one Java version whose
    word length matches your Eclipse version). I have three versions of Java on my
    Windows 8 computer, and I never run into trouble. (Occasionally, I cause my own
    trouble by confusing one version of Java for another. But this chapter’s “Configuring
    Java in Eclipse” section helps me sort things out. What would I do without this
    book by my side?)


    To find out what you already have and possibly avoid reinstalling Java, keep reading.


    # On Windows 8


    In the Start screen, hold down the Windows key while pressing Q. In the resulting
    search box, type **Programs and Features** and then press Enter. Then proceed
    to the In All Versions of Windows (XP and Newer) paragraphs.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# On Windows 7


    Select Start→Control Panel→Programs→Programs and Features. Then follow the instructions
    in the In All Versions of Windows (XP and Newer) paragraphs.


    # On Windows XP


    Select Start→Control Panel→Add or Remove Programs. Then follow the instructions
    in the In All Versions of Windows (XP and Newer) paragraphs.


    # In all versions of Windows (XP and newer)


    Look for Java in the list of installed programs (see Figure 2-2). If you see Java
    8 or higher, you''re okay. If the only Java version numbers that you see are lower
    than 8 (such as 1.4.2, 5.0, or 6), your computer can run some (but not all) of
    the programs in this book.


    Figure 2-2:

    The Programs and Features dialog box on Windows 8.


    ![](img/bf4858233d2b2a32ff4e3991860526b3_48_0.png)


    ![](img/bf4858233d2b2a32ff4e3991860526b3_48_1.png)


    If the version number is 5.0 or higher, you can run many (but not all) of the
    programs in this book.


    # On a Mac


    A Macintosh computer can support two different flavors of Java — a flavor developed
    in-house at Apple, Inc., and another flavor developed under Oracle''s auspices.
    Certain commands and procedures apply to one flavor of Java but not to the other.
    For example, to find Apple''s version of Java, you look in the /System/Library/Java/Java
    Virtual Machines directory. But to find Oracle''s Java, you look in the /Library/Java/JavaVirtualMachines
    directory. (One path starts with /System/Library; the other path starts with /Library.)
    You might also find Oracle''s Java in the /Library/Internet Plug-Ins/JavaAppletPlugin.plugin/Contents/Home
    directory.


    Tiger, Leopard, and Snow Leopard (OS X 10.4, OS X 10.5, and OS X 10.6) have Java
    preinstalled. Java isn''t preinstalled on Lion, Mountain Lion, or Mavericks (OS
    X 10.7, OS X 10.8, or OS X 10.9). On Lion, Mountain Lion, or Mavericks, the system
    prompts you to install either Apple''s Java or Oracle''s Java the'
  merge: -1
  img_proc: true
- pgno: 49
