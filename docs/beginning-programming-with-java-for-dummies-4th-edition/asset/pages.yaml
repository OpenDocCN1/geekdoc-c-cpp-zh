- pgno: 245
  md: "February also contains its own if statement. In Chapter 10, I nest if statements\
    \ within other if statements. But in February, I nest an if statement within a\
    \ switch statement. That's cool.\n\n# Using a Conditional Operator\n\nJava has\
    \ a neat feature that I can't resist writing about. Using this feature, you can\
    \ think about alternatives in a very natural way.\n\nAnd what do I mean by \"\
    a natural way?\" If I think out loud as I imitate the if statement near the end\
    \ of Listing 11-3, I come up with this:\n\n```\n//The thinking in Listing 11-3:\n\
    What should I do next?\nIf this is a leap year,\n    I_ll make the numberOfDays\
    \ be 29;\nOtherwise,\n    I_ll make the numberOfDays be 28.\n```\n\nI'm wandering\
    \ into an if statement without a clue about what I'm doing next. That seems silly.\
    \ It's February, and everybody knows what you do in February. You ask how many\
    \ days the month has.\n\nIn my opinion, the code in Listing 11-3 doesn't reflect\
    \ the most natural way to think about February. So here's a more natural way:\n\
    \n```\n//A more natural way to think about the problem:\nThe value of numberOfDays\
    \ is...\n    Wait! Is this a leap year?\n        If yes, 29\n        If no, 28\n\
    ```\n\nIn this second, more natural way of thinking, I know from the start that\
    \ I'm picking a number of days. So by the time I reach a fork in the road (Is\
    \ this a leap year?), the only remaining task is to choose between 29 and 28.\n\
    \nI can make the choice with finesse:\n\n```\ncase 2:\n    System.out.print(\"\
    Leap year (true/false)? \");\n    isLeapYear = keyboard.nextBoolean();\n    numberOfDays\
    \ = isLeapYear ? 29 : 28;\n```\n\nThe ? : combination is called a conditional\
    \ operator. In Figure 11-6, I show you how my natural thinking about February\
    \ can morph into the conditional operator's format."
  merge: -1
  img_proc: true
- pgno: 246
  md: '![](img/bf4858233d2b2a32ff4e3991860526b3_246_0.png)


    Figure 11-6:

    From your mind to the computer''s code.


    Taken as a whole, `isLeapYear ? 29 : 28` is an expression with a value. And what
    value does this expression have? Well, the value of `isLeapYear ? 29 : 28` is
    either 29 or 28. It depends on whether `isLeapYear` is or isn''t true. That''s
    how the conditional operator works:


    +   - ✓ If the stuff before the question mark is true, the whole expression''s
    value is whatever comes between the question mark and the colon.

    +   - ✓ If the stuff before the question mark is false, the whole expression''s
    value is whatever comes after the colon.


    Figure 11-7 gives you a goofy way to visualize these ideas.


    ![](img/bf4858233d2b2a32ff4e3991860526b3_246_1.png)


    Figure 11-7:

    Have you ever seen an expression talking to itself?'
