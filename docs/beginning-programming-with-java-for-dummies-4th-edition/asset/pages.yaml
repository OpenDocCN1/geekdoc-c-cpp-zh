    To find out which version of OS X you''re running, do the following:


    +   1. Choose Apple→About This Mac.

    +   2. In the About This Mac dialog that appears, look for the word Version.

    +      You see Version 10.9.2 (or something like that) in very light gray text.


    ![](img/bf4858233d2b2a32ff4e3991860526b3_49_0.png)


    The information in Table 2.1 applies to updated versions of Mac OS X. If you don''t
    regularly apply software updates, you may be running OS X 10.8.1 instead of 10.8.5.
    If so, select Software Update in the Apple menu and follow the resulting prompts.


    ![](img/bf4858233d2b2a32ff4e3991860526b3_49_1.png)


    Here and there on the web, I see postings describing ways to install Java 5.0
    on OS X 10.3 and other ways to circumvent the restrictions in Table 2-1. But if
    you don''t like to tinker, these workarounds aren''t for you. (For every hardware
    or software requirement, someone tries to create a workaround, or hack. Anyway,
    apply hacks at your own risk.)'
