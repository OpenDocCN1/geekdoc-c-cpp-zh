    \ you hover over an icon, a tooltip appears. Select the icon whose tooltip has\
    \ the title Workbench.\n\n+   6. **In Eclipse, import the code that you downloaded\
    \ in Step 1.**\n\nFor details about any of this stuff, see the next several sections.\n\
    \n# Those pesky filename extensions\n\nThe filenames displayed in Windows File\
    \ Explorer or in a Finder window can be misleading. You may browse one of your\
    \ directories and see the name Mortgage.java. The file’s real name might be Mortgage.java,\
    \ Mortgage.class, Mortgage.somethingElse, or plain old Mortgage. Filename endings\
    \ like `.zip`, `.java`, and `.class` are called *filename extensions*.\n\nThe\
    \ ugly truth is that, by default, Windows and Macs hide many filename extensions.\
    \ This awful feature tends to confuse programmers. So, if you don’t want to be\
    \ confused, change your computer’s system-wide settings. Here’s how you do it:\n\
    \n+   - **In Windows XP:** Choose Start➜Control Panel➜Appearance and Themes➜Folder\
    \ Options. Then follow the instructions in the All Versions of Windows bullet.\n\
    +   \n+   - **In Windows 7:** Choose Start➜Control Panel➜Appearance and Personalization➜Folder\
    \ Options. Then follow the instructions in the All Versions of Windows bullet.\n\
    +   \n+   - **In Windows 8:** In the Start screen, hold down the Windows key while\
