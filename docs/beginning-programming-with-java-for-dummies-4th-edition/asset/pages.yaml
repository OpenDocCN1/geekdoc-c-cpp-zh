  md: "![](img/bf4858233d2b2a32ff4e3991860526b3_226_0.png)\n\nListing 10-6 illustrates\
    \ a way of thinking about a problem. You have one question with more than two\
    \ answers. (In this section’s baseball problem, the question is “Who wins?” and\
    \ the answers are “Yankees,” “Socks,” or “Neither.”) The problem begs for an if\
    \ statement, but an if statement has only two branches — the true branch and the\
    \ false branch. So you combine alternatives to form cascading if statements.\n\
    \nIn Listing 10-6, the format for the cascading if statements is\n\n```\n```java\n\
    if (Condition1) {\n    SomeStatements\n} else if (Condition2) {\n    OtherStatements\n\
    } else {\n    EvenMoreStatements\n}\n```\n```\n\nIn general, you can use else\
    \ if as many times as you want:\n\n```\n```java\nif (hankeesWin) {\n    out.println(\"\
    Hankees win...\");\n    out.print(\"Hankees: \");\n    out.println(hankees);\n\
    \    out.print(\"Socks:   \");\n    out.println(socks);\n} else if (socksWin)\
    \ {\n    out.println(\"Socks win...\");\n    out.print(\"Socks:   \");\n    out.println(socks);\n\
    \    out.print(\"Hankees: \");\n    out.println(hankees);\n} else if (isATie)\
    \ {\n    out.println(\"It's a tie...\");\n    out.print(\"Hankees: \");\n```\n\
    ```"
