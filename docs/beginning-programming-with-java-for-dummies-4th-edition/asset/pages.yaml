    +   - The *method declaration* in Listing 4-2 has two parts. The first line (the
    part with the name FixTheAlternator in it, up to but not including the open curly
    brace) is called a *method header*. The rest of Listing 4-2 (the part surrounded
    by curly braces) is a *method body*.

    +   - The term *method declaration* distinguishes the list of instructions in
