  md: 'Figure 18-6: Viewing the `String` class as `String` objects as parts of a table.


    | **String** |  |  |

    |---|---|---|

    | **value** | **count** | **equals** |

    | `swordfish` | 9 | *(A method to compare `swordfish` with any string)* |

    | `catfish` | 7 | *(A method to compare `catfish` with any string)* |


    The stuff shown in Figure 18-6 is much simpler than the real `String` class story.
    But Figure 18-6 makes a good point. Like the purchases in Figure 17-7, each string
    has its own features. For example, each string has a value (the actual characters
    stored in the string), and each string has a count (the number of characters stored
    in the string). You can’t really write the following line of code because the
    stuff in Figure 18-6 omits a few subtle details.


    ```

    ```java

    //This code does NOT work:

    System.out.println(password.count);

    ```

    ```


    Anyway, each row in Figure 18-6 has three items — a value, a count, and an equals
    method. So each row of the table contains more than just data. Each row contains
    an equals method, a way of doing something useful with the data. It’s as though
    each object (each instance of the `String` class) has three things:


    +   - A bunch of characters (the object’s value)

    +   - A number (the object’s count)

    +   - A way of being compared with other strings (the object’s equals method)


    That’s the essence of object-oriented programming. Each string has its own personal
    copy of the equals method. For example, in Listing 18-5, the password string has
    its own equals method. When you call the password string’s equals method and put
    the userInput string in the method’s parentheses, the method compares the two
    strings to see if those strings contain the same characters.


    The userInput string in Listing 18-5 has an equals method, too. I could use the
    userInput string’s equals method to compare this string with the password string.
    But I don’t. In fact, in Listing 18-5, I don’t use the userInput string’s equals
    method at all. (To compare the userInput with the password, I had to use either
    the password string’s equals method or the userInput string’s equals method. So
    I made an arbitrary choice: I chose the password string’s method.)'
