    Here''s why I get a NullPointerException: The email.txt file has no more characters,
    so the call to findWithinHorizon("", ,0) comes up empty. (There''s nothing to
    find.) In Java, a more precise way of describing that emptiness is with the word
    null. The call findWithinHorizon("", ,0) is pointing to a character that was found
    (charAt(0)) is a fruitless endeavor. Thus, Java displays a NullPointerException
    message.'
