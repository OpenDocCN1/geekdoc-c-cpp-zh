- pgno: 332
  md: "![](img/bf4858233d2b2a32ff4e3991860526b3_332_0.png)\n\nIn Listing 16-3, I want\
    \ to know if the occupancy file contains any more data (any data that I haven't\
    \ read yet). So I call the Scanner class's hasNext method. The hasNext method\
    \ looks ahead to see whether I can read any kind of data — an int value, a double\
    \ value, a word, a boolean, or whatever. That's okay for this section's example,\
    \ but in some situations, you need to be pickier about your input data. For example,\
    \ you may want to know if you can call nextInt (as opposed to nextDouble or nextLine).\
    \ Fortunately, Java has methods for your pickiest input needs. A method like if\
    \ (diskScanner.hasNextInt()) tests to see whether you can read an int value from\
    \ the disk file. Java also has methods like hasNextLine, hasNextDouble, and so\
    \ on. For more information on the plain old hasNext method, see Chapter 14.\n\n\
    Listing 16-3 has a big fat condition to keep the for loop going:\n\n```\n```java\n\
    for (int roomNum = 0;\n    roomNum < whichRoom && diskScanner.hasNext();\n   \
    \ roomNum++) {\n```\n```\n\nMany for loop conditions are simple \"less-than\"\
    \ tests, but there's no rule saying that all for loop conditions have to be so\
    \ simple. In fact, any expression can be a for loop's condition, as long as the\
    \ expression has value true or false. The condition in Listing 16-3 combines a\
    \ \"less than\" with a call to the Scanner class's hasNext method.\n\n# Reader,\
    \ Meet Arrays; Arrays, Meet the Reader\n\nA weary traveler steps up to the Java\
    \ Motel's front desk. \"I'd like a room,\" says the traveler. So the desk clerk\
    \ runs a report like the one in Figure 16-2. Noticing the first vacant room in\
    \ the list, the clerk suggests Room 2. \"I'll take it,\" says the traveler."
