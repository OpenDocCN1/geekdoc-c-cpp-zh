- pgno: 34
  md: '![](img/bf4858233d2b2a32ff4e3991860526b3_34_0.png)


    Figure 1-5:

    Two ways to run a computer program.


    ![](img/bf4858233d2b2a32ff4e3991860526b3_34_1.png)


    Your computer’s hard drive may have files named javac and java (or javac.exe and
    java.exe). A java (or java.exe) file contains the instructions illustrated previously
    in Figure 1-4 — the instructions in the JVM. As a Java programmer, you often tell
    your computer to run a Java program. Your computer fulfills this wish by going
    behind the scenes and running the instructions in the java file.


    # Write once, run anywhere


    When Java first hit the tech scene in 1995, the language became popular almost
    immediately. This happened in part because of the JVM. The JVM is like a foreign
    language interpreter, turning Java bytecode into whatever native language a particular
    computer understands. So if you hand my Windows computer a Java bytecode file,
    then the computer’s JVM interprets the file for the Windows environment. If you
    hand the same Java bytecode file to my colleague’s Macintosh, then the Macintosh
    JVM interprets that same bytecode for the Mac environment.


    Look again at Figure 1-5. Without a virtual machine, you need a different kind
    of object code for each operating system. But with the JVM, just one piece of
    bytecode works on Windows machines, Unix boxes, Macs, or whatever. This is called
    portability, and in the computer-programming world, portability is a very precious
    commodity. Think about all the people using computers to browse the Internet.
    These people don’t all run Microsoft Windows, but each person’s computer can have
    its own bytecode interpreter — its own JVM.


    The marketing folks at Oracle call it the Write Once, Run Anywhere model of computing.
    I call it a great way to create software.'
  merge: -1
  img_proc: true
