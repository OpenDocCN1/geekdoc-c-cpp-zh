  md: "# Chapter 14\n\n# Creating Loops within Loops\n\n# In This Chapter\n\n+   -\
    \ Analyzing loop strategies\n+   - Diagnosing loop problems\n+   - Creating nested\
    \ loops\n\nIf you're an editor at Wiley Publishing, please don't read the next\
    \ few paragraphs. In the next few paragraphs, I give away an important trade secret\
    \ (something you really don't want me to do).\n\nI'm about to describe a surefire\
    \ process for writing a best-selling *For Dummies* book. Here's the process:\n\
    \nWrite several words to create a sentence. Do this several times to create a\
    \ paragraph.\n\n```\nRepeat the following to form a paragraph:\n  Repeat the following\
    \ to form a sentence:\n    Write a word.\n```\n\nRepeat the previous instructions\
    \ several times to make a section. Make several sections and then make several\
    \ chapters.\n\n```\nRepeat the following to form a best-selling book\nin the For\
    \ Dummies series:\n  Repeat the following to form a chapter:\n    Repeat the following\
    \ to form a section:\n      Repeat the following to form a paragraph:\n      \
    \  Repeat the following to form a sentence:\n          Write a word.\n```\n\n\
    This process involves a loop within a loop within a loop within a loop within\
    \ a loop. It's like a verbal M.C. Escher print. Is it useful, or is it trivialous?"
