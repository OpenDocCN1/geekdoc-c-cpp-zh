  md: 'Figure 6-2 gives a before-and-after picture of the code in Listing 6-1. When
    the computer executes amount = 5.95, the variable amount has the number 5.95 in
    it. Then, after the amount = amount + 25.00 statement is executed, the variable
    amount suddenly has 30.95 in it. When you think about a variable, picture a place
    in the computer''s memory where wires and transistors store 5.95, 30.95, or whatever.
    In Figure 6-2, imagine that each box is surrounded by millions of other such boxes.


    Figure 6-2: A variable (before and after).


    ![](img/bf4858233d2b2a32ff4e3991860526b3_138_0.png)


    Now you need some terminology. (You can follow along in Figure 6-3.) The thing
    stored in a variable is called a value. A variable''s value can change during
    the run of a program (when SnitSoft adds the shipping and handling cost, for example).
    The value stored in a variable isn''t necessarily a number. (You can, for example,
    create a variable that always stores a letter.) The kind of value stored in a
    variable is a variable''s type. (You can read more about types in the rest of
    this chapter and in the next two chapters as well.)


    Figure 6-3: A variable, its value, and its type.


