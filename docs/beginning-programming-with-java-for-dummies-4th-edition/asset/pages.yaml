- pgno: 290
  md: "![](img/bf4858233d2b2a32ff4e3991860526b3_290_0.png)\n\n# Reworking some existing\
    \ code\n\nTo solve the administrator’s problem, you need to modify the code in\
    \ Listing 12-5. The new version gets an e-mail address from a disk file and writes\
    \ a username to another disk file. The new version is in Listing 14-1.\n\n# Listing\
    \ 14-1: From One File to Another\n\n```\n```java\nimport java.util.Scanner;\n\
    import java.io.File;\nimport java.io.FileNotFoundException;\nimport java.io.PrintStream;\n\
    \nclass ListOneUsername {\n\n    public static void main(String args[])\n    \
    \        throws FileNotFoundException {\n\n        Scanner diskScanner =\n   \
    \         new Scanner(new File(\"email.txt\"));\n        PrintStream diskWriter\
    \ =\n            new PrintStream(\"usernames.txt\");\n        char symbol;\n\n\
    \        symbol =\n            diskScanner.findWithinHorizon(\".\", 0).charAt(0);\n\
    \n        while (symbol != '@') {\n            diskWriter.print(symbol);\n   \
    \         symbol =\n                diskScanner.findWithinHorizon(\".\", 0).charAt(0);\n\
    \        }\n\n        diskWriter.println();\n\n        diskScanner.close();\n\
    \        diskWriter.close();\n\n    }\n}\n```\n```"
