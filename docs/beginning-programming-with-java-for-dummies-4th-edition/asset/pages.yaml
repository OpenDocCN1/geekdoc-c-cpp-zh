  md: "# The boolean Type\n\nI'm in big trouble. I have 140 gumballs, and 15 kids\
    \ are running around and screaming in my living room. They're screaming because\
    \ each kid wants 10 gumballs, and they're running because that's what kids do\
    \ in a crowded living room. I need a program that tells me if I can give 10 gumballs\
    \ to each kid.\n\nI need a variable of type boolean. A boolean variable stores\
    \ one of 2 values — true or false (true, I can give 10 gumballs to each kid; or\
    \ false, I can't give 10 gumballs to each kid). Anyway, the kids are going berserk,\
    \ so I've written a short program and put it in Listing 8-4. The output of the\
    \ program is shown in Figure 8-9.\n\n# Listing 8-4: Using the boolean Type\n\n\
    ```\n```java\nclass CanIKeepKidsQuiet {\n    public static void main(String args[])\
    \ {\n        int gumballs;\n        int kids;\n        int gumballsPerKid;\n \
    \       boolean eachKidGetsTen;\n\n        gumballs = 140;\n        kids = 15;\n\
    \        gumballsPerKid = gumballs / kids;\n        System.out.print(\"True or\
    \ false? \");\n        System.out.println(\"Each kid gets 10 gumballs.\");\n \
    \       eachKidGetsTen = gumballsPerKid >= 10;\n        System.out.println(eachKidGetsTen);\n\
    \    }\n}\n```\n```\n\n# Figure 8-9: Oh, no!\n\n![](img/bf4858233d2b2a32ff4e3991860526b3_179_0.png)\n\
    \nIn Listing 8-4, the variable eachKidGetsTen is of type boolean. So the value\
    \ stored in the eachKidGetsTen variable can be either true or false. (I can't\
    \ store a number or a character in the eachKidGetsTen variable.)\n\nTo find a\
    \ value for the variable eachKidGetsTen, the program checks to see whether gumballsPerKid\
    \ is greater than or equal to ten. (The symbols >= stand for \"greater than or\
    \ equal to.\" What a pity! There's no ≥ key on"
