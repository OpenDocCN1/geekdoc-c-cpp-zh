  md: "That does it. That's all you need. The code to create the display of Figure\
    \ 15-5 is in Listing 15-3.\n\n# Listing 15-3: Hey! Is This a For-by-For?\n\n```\n\
    ```java\nimport java.util.Scanner;\nimport java.io.File;\nimport java.io.FileNotFoundException;\n\
    import static java.lang.System.out;\n\nclass DisplayHotelData {\n    public static\
    \ void main(String args[])\n    throws FileNotFoundException {\n        Scanner\
    \ diskScanner =\n            new Scanner(new File(\"hotelData\"));\n        for\
    \ (int floor = 1; floor <= 9; floor++) {\n            out.print(\"Floor \");\n\
    \            out.print(floor);\n            out.print(\": \");\n            for\
    \ (int roomNum = 1; roomNum <= 20; roomNum++) {\n                out.print(diskScanner.nextInt());\n\
    \                out.print(' ');\n            }\n            out.println();\n\
    \        }\n        diskScanner.close();\n    }\n}\n```\n```\n\nThe code in Listing\
    \ 15-3 has the variable floor going from 1 to 9 and has the variable roomNum going\
    \ from 1 to 20. Because the roomNum loop is inside the floor loop, the writing\
    \ of 20 numbers happens 9 times. That's good. It's exactly what I want.\n\n# Repeating\
    \ Until You Get What You Need (Java do Statements)\n\nI introduce Java's while\
    \ loop in Chapter 12. When you create a while loop, you write the loop's condition\
    \ first. After the condition, you write the code that gets repeatedly executed."
