- pgno: 250
  md: "```\nout.print(die1);\nout.print(\" \");\nout.println(die2);\n}\n\nout.print(\"\
    Rolled \");\nout.println(die1 + die2);\n}\n```\n\nAt the core of Listing 12-1\
    \ is a thing called a while statement (also known as a while loop). A while statement\
    \ has the following form:\n\n```\nwhile (Condition) {\n    Statements\n}\n```\n\
    \nRephrased in English, the while statement in Listing 12-1 would say\n\n```\n\
    while the sum of the two dice isn't 7 and isn't 11\nkeep doing all the stuff in\
    \ curly braces: {\n}\n```\n\nThe stuff in curly braces (the stuff that's repeated\
    \ over and over) is the code that gets two new random numbers and displays those\
    \ random numbers' values. The statements in curly braces are repeated as long\
    \ as die1 + die2 != 7 && die1 + die2 != 11 keeps being true.\n\nEach repetition\
    \ of the statements in the loop is called an iteration of the loop. In Figure\
    \ 12-1, the first run has 2 iterations, and the second run has 12 iterations.\n\
    \nWhen die1 + die2 != 7 && die1 + die2 != 11 is no longer true (that is, when\
    \ the sum is either 7 or 11), the repeating of statements stops dead in its tracks.\
    \ The computer marches on to the statements that come after the loop.\n\n# Following\
    \ the action in a loop\n\nTo trace the action of the code in Listing 12-1, I'll\
    \ borrow numbers from the first run in Figure 12-1:\n\n+   - At the start, the\
    \ values of die1 and die2 are both 0.\n+   - The computer gets to the top of the\
    \ while statement and checks to see if die1 + die2 != 7 && die1 + die2 != 11 is\
    \ true (see Figure 12-2). The condition is true, so the computer takes the true\
    \ path in Figure 12-3."
