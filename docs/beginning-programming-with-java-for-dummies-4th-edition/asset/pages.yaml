    ✓ The first if statement''s condition tests for the regular price group. Anyone
    who''s at least 12 years of age and is under 65 belongs in this group.


    ✓ The second if statement''s condition tests for the fringe ages. A person who''s
    under 12 or is 65 or older belongs in this category.


    When you form the opposite of an existing condition, you can often follow the
    pattern in Listing 10-1. The opposite of >= is <. The opposite of < is >=. The
    opposite of && is ||.


    If you change the dollar amounts in Listing 10-1, you can get into trouble. For
