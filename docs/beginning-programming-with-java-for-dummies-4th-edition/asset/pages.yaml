    \n```\nJFrame frame = new JFrame();\nImageIcon icon = new ImageIcon(\"androidBook.jpg\"\
    );\nJLabel label = new JLabel(icon);\n```\n\nlook as though they contain method\
    \ calls. After all, a method call consists of a name followed by parentheses.\
    \ You might put some parameters between the open- and close-parentheses. The expression\
