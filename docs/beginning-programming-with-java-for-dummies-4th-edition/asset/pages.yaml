  md: '# What Do All Those Zeros and Ones Mean?


    Here''s a word:


    gift


    The question for discussion is, what does that word mean? Well, it depends on
    who looks at the word. For example, an English-speaking reader would say that
    “gift” stands for something one person bestows upon another in a box covered in
    bright paper and ribbons.


    Look! I''m giving you a gift!


    But in German, the word “gift” means “poison.”


    Let me give you some gift, my dear.


    And in Swedish, “gift” can mean either “married” or “poison.”


    As soon as they got gift, she slipped a gift into his drink.


    Then there''s French. In France, there''s a candy bar named “Gift.”


    He came for the holidays, and all he gave me was a bar of Gift.


    So what do the letters g-i-f-t really mean? Well, they don''t mean anything until
    you decide on a way to interpret them. The same is true of the zeros and ones
    inside a computer''s circuitry.


    Take, for example, the sequence 01001010. This sequence can stand for the letter
    J, but it can also stand for the number 74. That same sequence of zeros and ones
    can stand for 1.036960863603646×10⁻⁴³. And when interpreted as screen pixels,
    the same sequence can represent the dots shown in Figure 6-6. The meaning of 01001010
    depends entirely on the way the software interprets this sequence.


    Figure 6-6:

    An extreme close-up of eight black-and-white screen pixels.


    ![](img/bf4858233d2b2a32ff4e3991860526b3_141_0.png)'
