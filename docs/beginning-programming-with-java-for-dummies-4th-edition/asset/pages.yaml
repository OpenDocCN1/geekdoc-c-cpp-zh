  md: "Figure 17-8:\nA purchase corresponds to a row of the table.\n\n| Purchase |\
    \  |  |\n|---|---|---|\n| amount | taxable | total |\n| 20.00 | true | 21.00 |\n\
    | 20.00 | false | 20.00 |\n| 95.00 | true | 99.75 |\n\n```\naPurchase = new Purchase();\n\
    ...\naPurchase.amount = myScanner.nextDouble();\naPurchase.taxable = myScanner.nextBoolean();\n\
    ...\naPurchase.total = aPurchase.amount * 1.05;\n```\n\n![](img/bf4858233d2b2a32ff4e3991860526b3_360_0.png)\n\
    \n# Some questions and answers\n\nHere's the world's briefest object-oriented\
    \ programming FAQ:\n\n+   ✓ **Can I have an object without having a class?**\n\
    +   No, you can't. In Java, every object is an instance of a class.\n+   \n+ \
    \  ✓ **Can I have a class without having an object?**\n+   Yes, you can. In fact,\
    \ almost every program in this book creates a class without an object. Take Listing\
    \ 17-5, for example. The code in Listing 17-5 defines a class named ProcessPurchases.\
    \ And nowhere in Listing 17-5 (or anywhere else) do I create an instance of the\
    \ ProcessPurchases class. I have a class with no objects. That's just fine. It's\
    \ business as usual.\n+   \n+   ✓ **After I've created a class and its instances,\
    \ can I add more instances to the class?**\n+   Yes, you can. In Listing 17-5,\
    \ I create one instance, then another, and then a third. If I went one additional\
    \ time around the for loop, I'd have a fourth instance, and I'd put a fourth row\
    \ in the table of Figure 17-8. With no objects, three objects, four objects, or\
    \ more objects, I still have the same old Purchase class.\n+   \n+   ✓ **Can an\
    \ object come from more than one class?**\n+   Bite your tongue! Maybe other object-oriented\
    \ languages allow this nasty class cross-breeding, but in Java, it's strictly\
    \ forbidden. That's one of the things that distinguishes Java from some of the\
    \ languages that preceded it. Java is cleaner, more uniform, and easier to understand."
