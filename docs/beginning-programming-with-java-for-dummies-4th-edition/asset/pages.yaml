- pgno: 198
  md: "# A complete program\n\nListing 9-2 contains a complete program with a simple\
    \ if statement. The listing's code behaves like an electronic oracle. Ask the\
    \ program a yes or no question, and the program answers you back. Of course, the\
    \ answer to your question is randomly generated. But who cares? It's fun to ask\
    \ anyway.\n\n# Listing 9-2: I Know Everything\n\n```\nimport java.util.Scanner;\n\
    import java.util.Random;\n\nclass AnswerYesOrNo {\n    public static void main(String\
    \ args[]) {\n        Scanner keyboard = new Scanner(System.in);\n        Random\
    \ myRandom = new Random();\n        int randomNumber;\n\n        System.out.print(\"\
    Type your question, my child: \");\n        keyboard.nextLine();\n\n        randomNumber\
    \ = myRandom.nextInt(10) + 1;\n\n        if (randomNumber > 5) {\n           \
    \ System.out.println(\"Yes. Isn't it obvious?\");\n        } else {\n        \
    \    System.out.println(\"No, and don't ask again.\");\n        }\n        keyboard.close();\n\
    \    }\n}\n```\n\nFigure 9-4 shows several runs of the program in Listing 9-2.\
    \ The program's action has four parts:\n\n+   1. Prompt the user.\n+   \n+   \
    \   Call System.out.print, telling the user to type a question.\n+   \n+   2.\
    \ Get the user's question from the keyboard.\n+   \n+      In Figure 9-4, I run\
    \ the AnswerYesOrNo program four times, and I type a different question each time.\
    \ Meanwhile, back in Listing 9-2, the statement\n+   \n+      `keyboard.nextLine();`\n\
    +   \n+      swallows up my question and does absolutely nothing with it. This\
    \ is an anomaly, but you're smart, so you can handle it."
  merge: -1
  img_proc: true
- pgno: 199
  md: 'Figure 9-4: The all-knowing Java program in action.


    ![](img/bf4858233d2b2a32ff4e3991860526b3_199_0.png)


    Normally, when a program gets input from the keyboard, the program does something
    with the input. For example, the program can assign the input to a variable:


    ```

    amount = keyboard.nextDouble();

    ```


    Alternatively, the program can display the input on the screen:


    ```

    System.out.println(keyboard.nextLine());

    ```


    But the code in Listing 9-2 is different. When this AnswerYesOrNo program runs,
    the user has to type something. (The call to getLine waits for the user to type
    some stuff and then press Enter.) But the AnswerYesOrNo program has no need to
    store the input for further analysis. (The computer does what I do when my wife
    asks me if I plan to clean up after myself. I ignore the question and make up
    an arbitrary answer.) So the program doesn''t do anything with the user''s input.
    The call to keyboard.nextLine just sits there in a statement of its own, doing
    nothing, behaving like a big black hole. It''s unusual for a program to do this,
    but an electronic oracle is an unusual thing. It calls for some slightly unusual
    code.


    +   3. Get a random number — any int value from 1 to 10.


    Okay, wise guys. You''ve just trashed the user''s input. How will you answer yes
    or no to the user''s question?'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'No problem! None at all! You''ll display an answer randomly. The user won''t
    know the difference. (Hah, hah!) You can do this as long as you can generate random
    numbers. The numbers from 1 to 10 will do just fine.


    In Listing 9-2, the stuff about Random and myRandom looks very much like the familiar
    Scanner code. From a beginning programmer''s point of view, Random and Scanner
    work almost the same way. Of course, there''s an important difference. A call
    to the Random class''s nextInt(10) method doesn''t fetch anything from the keyboard.
    Instead, this nextInt(10) method gets a number out of the blue.


    The name Random is defined in the Java API. The call to myRandom.nextInt(10) in
    Listing 9-2 gets a number from 0 to 9. Then my code adds 1 (making a number from
    1 to 10) and assigns that number to the variable randomNumber. When that''s done,
    you''re ready to answer the user''s question.


    In Java''s API, the word Random is the name of a Java class, and nextInt is the
    name of a Java method. For more information on the relationship between classes
    and methods, see Chapters 17, 18, and 19.


    ![](img/bf4858233d2b2a32ff4e3991860526b3_200_0.png)


    # 4. Answer yes or no.


    Calling myRandom.nextInt(10) is like spinning a wheel on a TV game show. The wheel
    has slots numbered 1 to 10. The if statement in Listing 9-2 turns your number
    into a yes or no alternative. If you roll a number that''s greater than 5, the
    program answers yes. Otherwise (if you roll a number that''s less than or equal
    to 5), the program answers no.


    You can trust me on this one. I''ve made lots of important decisions based on
    my AnswerYesOrNo program.


    # Indenting if statements in your code


    Notice how, in Listing 9-2, the println calls inside the if statement are indented.
    Strictly speaking, you don''t have to indent the statements that are inside an
    if statement. For all the compiler cares, you can write your whole program on
    a single line or place all your statements in an artful, misshapen zigzag. The
    problem is, if you don''t indent your statements in some logical fashion, then
    neither you nor anyone else can make sense of your code. In Listing 9-2, the indenting
    of the println calls helps your eyes (and brain) see quickly that these statements
    are subordinate to the overall if/else flow.


    In a small program, unindented or poorly indented code is barely tolerable. But
    in a complicated program, indentation that doesn''t follow a neat, logical pattern
    is a big, ugly nightmare.


    Always indent your code to make the program''s flow apparent at a glance.


    ![](img/bf4858233d2b2a32ff4e3991860526b3_200_1.png)'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# Randomness makes me dizzy


    When you call myRandom.nextInt(10) + 1, you get a number from 1 to 10. As a test,
    I wrote a program that calls the myRandom.nextInt(10) + 1 20 times.


    ```

    Random myRandom=new Random();

    System.out.print

    (myRandom.nextInt(10) + 1);

    System.out.print(" ");

    System.out.print

    (myRandom.nextInt(10) + 1);

    System.out.print(" ");

    System.out.print

    (myRandom.nextInt(10) + 1);

    //...And so on.

    ```


    I ran the program several times and got the results shown in the following figure.
    (Actually, I copied the results from Eclipse''s Console view to Windows Notepad.)
    Stare briefly at the figure and notice two trends:


    +   - There''s no obvious way to predict what number comes next.

    +   - No number occurs much more often than any of the others.


    ![](img/bf4858233d2b2a32ff4e3991860526b3_201_0.png)


    The Java Virtual Machine jumps through hoops to maintain these trends. That''s
    because crank-ing out numbers in a random fashion is a very tricky business. Here
    are some interesting facts about the process:


    +   - Scientists and nonscientists use the term random number. But in reality,
    there''s no such thing as a single random number. After all, how random is a number
    like 9?


    A number is random only when it''s one in a very disorderly collection of numbers.


    More precisely, a number is random if the process used to generate the number
    follows the two preceding trends. When they''re being careful, scientists avoid
    the term random number and use the term randomly generated number instead.


    +   - It''s hard to generate numbers randomly. Computer programs do the best they
    can, but ultimately, today''s computer programs follow a pattern, and that pattern
    isn''t truly random.


    To generate numbers in a truly random fashion, you need a big tub of ping-pong
    balls, like the kind they use in state lottery drawings. The problem is, most
    computers don''t come with big tubs of ping-pong balls among their peripherals.
    So strictly speaking, the numbers generated by Java''s Random class aren''t random.
    Instead, scientists call these numbers pseudorandom.


    +   - It surprises us all, but knowing one randomly generated value is of no help
    in predicting the next randomly generated value.


    For example, if you toss a coin twice, and get heads each time, are you more likely
    to get tails on the third flip? No. It''s still 50-50.


    If you have three sons, and you''re expecting a fourth child, is the fourth child
    more likely to be a girl? No. A child''s gender has nothing to do with the genders
    of the older children. (I''m ignoring any biological effects, which I know absolutely
    nothing about. Wait! I do know some biological trivia: A newborn child is more
    likely to be a boy than a girl. For every 21 newborn boys, there are only 20 newborn
    girls. Boys are weaker, so we die off faster. That''s why nature makes more of
    us at birth.)'
  merge: -1
  img_proc: true
