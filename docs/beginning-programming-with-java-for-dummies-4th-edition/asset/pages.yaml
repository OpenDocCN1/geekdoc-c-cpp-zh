- pgno: 335
  md: 'Well, you can write loops of this kind. All you need are some square brackets.
    When you add square brackets to the idea shown in the preceding code, you get
    what’s called an array. An array is a row of values, like the row of rooms in
    a one-floor motel. To picture the array, just picture the Java Motel:


    +   - First, picture the rooms, lined up next to one another.

    +   - Next, picture the same rooms with their front walls missing. Inside each
    room, you can see a certain number of guests.

    +   - If you can, forget that the two guests in Room 9 are putting piles of bills
    into a big briefcase. Ignore the fact that the guest in Room 5 hasn’t moved away
    from the TV set in a day and a half. Instead of all these details, just see numbers.
    Each room, see a number representing the count of guests in that room. (If freeform
    visualization isn’t your strong point, take a look at Figure 16-6.)


    ![](img/bf4858233d2b2a32ff4e3991860526b3_335_0.png)


    In the lingo of Java programming, the entire row of rooms is called an *array*.
    Each room in the array is called a *component* of the array (also known as an
    *array element*). Each component has two numbers associated with it.


    +   - **Index:** In the case of the Java Motel array, the index is the room number
    (a number from 0 to 9).

    +   - **Value:** In the Java Motel array, the value is the number of guests in
    a given room (a number stored in a component of the array).'
  merge: -1
  img_proc: true
- pgno: 336
  md: "Using an array saves you from having to declare ten separate variables: guestsIn0,\
    \ guestsIn1, guestsIn2, and so on. To declare an array with ten values in it,\
    \ you can write two fairly short lines of code:\n\n```\nint guestsIn[];\nguestsIn\
    \ = new int[10];\n```\n\nYou can even squish these two lines into one longer line:\n\
    \n```\nint guestsIn[] = new int[10];\n```\n\nIn either of these code snippets,\
    \ notice the use of the number 10. This number tells the computer to make the\
    \ guestsIn array have ten components. Each component of the array has a name of\
    \ its own. The starting component is named guestsIn[0], the next is named guestsIn[1],\
    \ and so on. The last of the ten components is named guestsIn[9].\n\n![](img/bf4858233d2b2a32ff4e3991860526b3_336_0.png)\n\
    \nIn creating an array, you always specify the number of components. The array's\
    \ indices always start with 0 and end with the number that's one fewer than the\
    \ total number of components. For example, if your array has ten components (and\
    \ you declare the array with new int[10]), the array's indices go from 0 to 9.\n\
    \n# Storing values in an array\n\nAfter you've created an array, you can put values\
    \ into the array's components. For example, the guests in Room 6 are fed up with\
    \ all those mint candies that you put on peoples' beds. So they check out, and\
    \ Room 6 becomes vacant. You should put the value 0 into the 6 component. You\
    \ can do it with this assignment statement:\n\n```\nguestsIn[6] = 0;\n```\n\n\
    On one weekday, business is awful. No one's staying at the motel. But then you\
    \ get a lucky break. A big bus pulls up to the motel. The side of the bus has\
    \ a sign that says \"Loners' Convention.\" Out of the bus come 25 people, each\
    \ walking to the motel's small office, none paying attention to the others who\
    \ were on the bus. Each person wants a private room. Only 10 of them can stay\
    \ at the Java Motel, but that's okay, because you can send the other 15 loners\
    \ down the road to the old C-Side Resort and Motor Lodge.\n\nAnyway, to register\
    \ ten of the loners into the Java Motel, you put one guest in each of your ten\
    \ rooms. Having created an array, you can take advantage of the array's indexing\
    \ and write a for loop, like this:\n\n```\nfor (int roomNum = 0; roomNum < 10;\
    \ roomNum++) {\n    guestsIn[roomNum] = 1;\n}\n```"
  merge: -1
  img_proc: true
