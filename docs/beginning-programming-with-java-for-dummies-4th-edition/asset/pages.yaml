- pgno: 196
  md: "Sometimes I need alternate names for parts of an if statement. I call them\
    \ the if clause and the else clause.\n\n```\nif (Condition) {\n    if clause\n\
    } else {\n    else clause\n}\n```\n\nAn if statement is an example of a compound\
    \ statement — a statement that includes other statements within it. The if statement\
    \ in Listing 9-1 includes two println calls, and these calls to println are statements.\n\
    \nNotice how I use parentheses and semicolons in the if statement of Listing 9-1.\
    \ In particular, notice the following:\n\n+   - The condition must be in parentheses.\n\
    +   - Statements inside the if clause end with semicolons. So do statements inside\
    \ the else clause.\n+   - There's no semicolon immediately after the condition.\n\
    +   - There's no semicolon immediately after the word else.\n\nAs a beginning\
    \ programmer, you may think these rules are arbitrary. But they're not. These\
    \ rules belong to a very carefully crafted grammar. They're like the grammar rules\
    \ for English sentences, but they're even more logical! (Sorry, Melba.)\n\nTable\
    \ 9-1 shows you the kinds of things that can go wrong when you break the if statement's\
    \ punctuation rules. The table's last two items are the most notorious. In these\
    \ two situations, the compiler doesn't catch the error. This lulls you into a\
    \ false sense of security. The trouble is, when you run the program, the code's\
    \ behavior isn't what you expect it to be.\n\n# Table 9-1 Common if Statement\
    \ Error Messages\n\n| Error | Example | Most Likely Messages or Results |\n|---|---|---|\n\
    | Missing parentheses surrounding the condition | if randomNumber > 5 { | '('\
    \ expected Syntax error on token \"if\", ( expected after this token |"
