  md: "# Automated debugging\n\nIf your program isn't working correctly, you can try\
    \ something called a debugger. A debugger automatically adds invisible print and\
    \ println calls to your suspicious code. In fact, debuggers have all kinds of\
    \ features to help you diagnose problems. For example, a debugger can pause a\
    \ run of your program and accept special commands to display variables' values.\
    \ With some debuggers, you can pause a run and change a variable's value (just\
    \ to see if things go better when you do).\n\nAn Eclipse perspective is a collection\
    \ of views intended to help you with a certain aspect of program development.\
    \ By default, Eclipse starts in the Java perspective — the arrangement of views\
    \ to help you create Java programs. Another perspective — the Debug perspective\
    \ — helps you diagnose errors in your code.\n\nIn this book, I don't promote the\
    \ use of an automated debugger. But for any large programming project, automated\
    \ debugging is an essential tool. So if you plan to write bigger and better programs,\
    \ please give Eclipse's Debug perspective a try. For a small sample of the Debug\
    \ perspective's capabilities, do the following:\n\n+   1. **In the editor (where\
    \ you see your Java code) double-click in the margin to the left of a line of\
    \ code.**\n+   \n+   A little blue dot appears in the margin (see the first figure\
    \ below). This dot indicates a breakpoint in the code. In the steps that follow,\
    \ you'll make the run of the program pause at this breakpoint. In the figure,\
    \ I click the last line of code from Listing 8-5.\n+   \n+   2. **In Eclipse's\
    \ main menu, click Window→Open Perspective→Debug.**\n+   \n+   As a result, Eclipse\
    \ displays a new layout. The new layout contains some familiar views, such as\
    \ the Console view and the Outline view. The layout also contains some new views,\
    \ such as the Debug view, the Variables view, and the Breakpoints view (see this\
    \ next figure).\n+   \n+   3. **In Eclipse's main menu, click Run→Debug As→Java\
    \ Application.**\n+   \n+   Remember to select the Debug As menu item. Selecting\
    \ this item enables all the debugging tools.\n+   Your code begins running. Because\
    \ you're working with the program in Listing 8-5, the code prompts you to enter\
    \ the Celsius temperature.\n+   \n+   4. **Type the number 21 and then press Enter.**\n\
    +   \n+   Your code continues running until execution reaches the breakpoint.\
    \ At the breakpoint, the execution pauses to allow you to examine the program's\
    \ state.\n\n```\nSystem.out.print(\"Room temperature? \");\nSystem.out.println(fahrenheit\
    \ == 69.8);\n```"
