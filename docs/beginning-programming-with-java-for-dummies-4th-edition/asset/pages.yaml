    Here''s a useful exercise: Start with a working Java program. After successfully
    running the code, make a change that intentionally introduces errors. Look carefully
    at each error message and ask yourself whether the message would help you diagnose
    the problem. This exercise is great because it helps you think of errors as normal
    occurrences and gives you practice analyzing messages when you''re not under pressure
    to get your program to run correctly.


    # Runtime error messages


    Up to this point in the chapter, I describe errors that crop up when you compile
    a program. Another category of errors hides until you run the program.


    A case in point is the improper spelling or capitalization of the word main.


    Assume that, in a moment of wild abandon, you incorrectly spell main with a capital
    M:


    ```

    //The following line is incorrect:

    public static void Main(String args[]) {

    ```


