  md: "When you compare two things with a double equal sign, reference types and primitive\
    \ types don't behave the same way. Consider, for example, int versus String:\n\
    \nYou can compare two int values with a double equal sign. When you do, things\
    \ work exactly as you would expect. For example, the condition in the following\
    \ code is true:\n\n```\nint apples = 7;\nint oranges = 7;\n\nif (apples == oranges)\
    \ {\n    System.out.println(\"They're equal.\");\n}\n```\n\nWhen you compare two\
    \ String values with the double equal sign, things don't work the way you expect.\
    \ The computer doesn't check to see if the two String values contain the same\
    \ letters. Instead, the computer checks some esoteric property of the way variables\
    \ are stored in memory.\n\n![](img/bf4858233d2b2a32ff4e3991860526b3_369_0.png)\n\
    \nFor your purposes, the term reference type is just a fancy name for a class.\
    \ Because String is defined to be a class in the Java API, I call String a reference\
    \ type. This terminology highlights the parallel between primitive types (such\
    \ as int) and classes (that is, reference types, such as String).\n\n# Comparing\
    \ strings\n\nIn the preceding bullets, the difference between int and String is\
    \ mighty interesting. But if the double equal sign doesn't work for String values,\
    \ how do you check to see if Joe User enters the correct password? You do it with\
    \ the code in Listing 18-5.\n\n# Listing 18-5: Calling an Object's Method\n\n\
    ```\n/*\n* This program works!\n*/\nimport java.util.Scanner;\nimport static java.lang.System.out;\n\
    \nclass CheckPassword {\n    public static void main(String args[]) {\n      \
