  md: "# Reading whole numbers from the keyboard\n\nWhat a life! Yesterday there were\
    \ 4 kids in my living room, and I had 30 gumballs. Today there are 6 kids in my\
    \ house, and I have 80 gumballs. How can I cope with all this change? I know!\
    \ I'll write a program that reads the numbers of gumballs and kids from the keyboard.\
    \ The program is in Listing 7-2, and a run of the program is shown in Figure 7-2.\n\
    \n# Listing 7-2: A More Versatile Program for Kids and Gumballs\n\n```\nimport\
    \ java.util.Scanner;\n\nclass KeepingMoreKidsQuiet {\n    public static void main(String\
    \ args[]) {\n        Scanner keyboard = new Scanner(System.in);\n        int gumballs;\n\
    \        int kids;\n        int gumballsPerKid;\n\n        System.out.print\n\
    \            (\"How many gumballs? How many kids? \");\n\n        gumballs = keyboard.nextInt();\n\
    \        kids = keyboard.nextInt();\n\n        gumballsPerKid = gumballs / kids;\n\
    \        System.out.print(\"Each kid gets \");\n        System.out.print(gumballsPerKid);\n\
    \        System.out.println(\" gumballs.\");\n\n        keyboard.close();\n  \
    \  }\n}\n```\n\nFigure 7-2: Next thing you know, I'll have 70 kids and 1,000 gumballs.\n\
