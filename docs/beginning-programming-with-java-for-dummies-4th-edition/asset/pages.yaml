- pgno: 209
  md: 'So to simulate a Backgammon game (and many other, more practical situations)
    you need to combine conditions.


    ```

    If die1 + die2 equals 8 and die1 equals die2, ...

    ```


    You need things like and or — things that can wire conditions together. Java has
    operators to represent these concepts, which are described in Table 10-1 and illustrated
    in Figure 10-1.


    Table 10-1 Logical Operators


    | Operator Symbol | Meaning | Example | Illustration |

    |---|---|---|---|

    | && | and | 4 < age && age < 8 | Figure 10-1(a) |

    | || | or | age < 4 || 8 < age | Figure 10-1(b) |

    | ! | not | !eachKidGetsTen | Figure 10-1(c) |


    ![](img/bf4858233d2b2a32ff4e3991860526b3_209_0.png)


    Combined conditions, like the ones in Table 10-1, can be mighty confusing. That''s
    why I tread carefully when I use such things. Here''s a short explanation of each
    example in the table:


    ```

    4 < age && age < 8

    ```


    The value of the age variable is greater than 4 and is less than 8. The numbers
    5, 6, 7, 8, 9 ... are all greater than 4. But among these numbers, only 5, 6,
    7 are less than 8. So only the numbers 5, 6, and 7 satisfy this combined condition.'
  merge: -1
  img_proc: true
- pgno: 210
  md: '```

    age < 4 || 8 < age

    ```


    The value of the age variable is less than 4 or is greater than 8. To create the
    or condition, you use two pipe symbols. On many U.S. English keyboards, you can
    find the pipe symbol immediately above the Enter key (the same key as the backslash,
    but shifted).


    In this combined condition, the value of the age variable is either less than
    4 or greater than 8. For example, if a number is less than 4, the number satisfies
    the condition. Numbers like 1, 2, and 3 are all less than 4, so these numbers
    satisfy the combined condition.


    Also, if a number is greater than 8, the number satisfies the combined condition.
    Numbers like 9, 10, and 11 are all greater than 8, so these numbers satisfy the
    condition.


    ```

    !eachKidGetsTen

    ```


    If I weren''t experienced with computer programming languages, I''d be confused
    by the exclamation point. I''d think that !eachKidGetsTen means, "Yes, each kid
    does get ten." But that''s not what this expression means. This expression says,
    "The variable eachKidGetsTen does not have the value true." In Java and other
    programming languages, an exclamation point stands for negative, for no way, for
    not.


    Listing 8-4 (refer to Chapter 8) has a boolean variable named eachKidGetsTen.
    A boolean variable''s value is either true or false. Because ! means not, the
    expressions eachKidGetsTen and !eachKidGetsTen have opposite values. So when eachKidGetsTen
    is true, !eachKidGetsTen is false (and vice versa).


    ![](img/bf4858233d2b2a32ff4e3991860526b3_210_0.png)


    Java''s || operator is inclusive. This means that you get true whenever the thing
    on the left side is true, the thing on the right side is true, or both things
    are true. For example, the condition 2 < 10 || 20 < 30 is true.


    ![](img/bf4858233d2b2a32ff4e3991860526b3_210_1.png)


    In Java, you can''t combine comparisons the way you do in ordinary English. In
    English, you may say, "We''ll have between three and ten people at the dinner
    table." But in Java, you get an error message if you write 3 <= people <= 10.
    To do this comparison, you need to something like 3 <= people && people <= 10.


    # Combining conditions: An example


    Here''s a handy example of the use of logical operators. A movie theater posts
    its prices for admission.


    +   - Regular price: $9.25

    +   - Kids under 12: $5.25

    +   - Seniors (65 and older): $5.25'
