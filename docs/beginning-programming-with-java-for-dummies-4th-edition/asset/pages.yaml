  md: '# Ending a statement with a semicolon


    In Java, each statement ends with a semicolon. The code in Listing 4-1 has only
    one statement in it, so only one line in Listing 4-1 ends with a semicolon.


    Take any other line in Listing 4-1, like the method header, for example. The method
    header (the line with the word main in it) doesn''t directly tell the computer
    to do anything. Instead, the method header describes some action for future reference.
    The header announces ''Just in case someone ever calls the main method, the next
    few lines of code tell you what to do in response to that call.''


    ![](img/bf4858233d2b2a32ff4e3991860526b3_108_0.png)


    Every complete Java statement ends with a semicolon. A method call is a statement,
    so it ends with a semicolon, but neither a method header nor a method declaration
    is a statement.


    # The method named System.out.println


    The statement in the middle of Listing 4-1 calls a method named System.out.println.
    This method is defined in the Java API. Whenever you call the System.out.println
    method, the computer displays text on its screen.


    Think about names. Believe it or not, I know two people named Pauline Ott. One
    of them is a nun; the other is a physicist. Of course, there are plenty of Paulines
    in the English-speaking world, just as there are several things named println
    in the Java API. So to distinguish the physicist Pauline Ott from the film critic
    Pauline Kael, I write the full name ''Pauline Ott.'' And to distinguish the nun
    from the physicist, I write ''Sister Pauline Ott.'' In the same way, I write either
    System.out.println or DriverManager.println. The first (which you use often) writes
    text on the computer''s screen. The second (which you don''t use at all in this
    book) writes to a database log file.


    Just as Pauline and Ott are names in their own right, so System, out, and println
    are names in the Java API. But to use println, you must write the method''s full
    name. You never write println alone. It''s always System.out.println or some other
    combination of API names.


    ![](img/bf4858233d2b2a32ff4e3991860526b3_108_1.png)


    The Java programming language is cAsE-sEnSiTiVe. If you change a lowercase letter
    to an uppercase letter (or vice versa), you change a word''s meaning. You can''t
    replace System.out.println with system.out.Println. If you do, your program won''t
    work.'
