- pgno: 95
  md: '# The Elements in a Java Program


    That both English and Java are called languages is no coincidence. You use a language
    to express ideas. English expresses ideas to people, and Java expresses ideas
    to computers. What''s more, both English and Java have things like words, names,
    and punctuation. In fact, the biggest difference between the two languages is
    that Java is easier to learn than English. (If English were easy, then computers
    would understand English. Unfortunately, they can''t.)


    Take an ordinary English sentence and compare it with the code in Listing 4-1.
    Here''s the sentence:


    Suzanne says "eh" because, as you know, she lives in Canada.


    In your high school grammar class, you worried about verbs, adjectives, and other
    such things. But in this book, you''ll think in terms of keywords and identifiers,
    as summarized in Figure 4-2.


    Figure 4-2: The things you find in a simple sentence.


    ![](img/bf4858233d2b2a32ff4e3991860526b3_95_0.png)


    Suzanne''s sentence has all kinds of things in it. They''re the same kinds of
    things that you find in a computer program. So here''s the plan: Compare the elements
    in Figure 4-1 with similar elements in Listing 4-1. You already understand English,
    so you use this understanding to figure out some new things about Java.


    But first, here''s a friendly reminder: In the next several paragraphs, I draw
    comparisons between English and Java. As you read these paragraphs, it''s important
    to keep an open mind. For example, in comparing Java with English, I may write
    that "names of things aren''t the same as dictionary words." Sure, you can argue
    that some dictionaries list proper nouns and that some people have first names
    like Hope, Prudence, and Spike, but please don''t. You''ll get more out of the
    reading if you avoid nitpicking. Okay? Are we still friends?'
  merge: -1
  img_proc: true
