  md: '# A quick look at Java’s disk access facilities


    Templates like the ones in Listings 13-3 and 13-4 are very nice. But knowing how
    the templates work is even better. Here are a few tidbits describing the inner
    workings of Java’s disk access code.


    In Listing 13-2, the added words `throws FileNotFoundException` form a `throws
    clause`. A throws clause is a kind of disclaimer. Putting a throws clause in your
    code is like saying, "I realize that this code can run into trouble."


    ✓ **A PrintStream is something you can use for writing output.**


    A PrintStream is like a Scanner. The big difference is that a Scanner is for reading
    input and a PrintStream is for writing output. To see what I mean, look at Listing
    13-2. Notice the similarity between the statements that use Scanner and the statements
    that use PrintStream.


    The word PrintStream is defined in the Java API.


    Of course, in the legal realm, you often have no choice about signing disclaimers.
    "If you don’t sign this disclaimer, then the surgeon won’t operate on you." Okay,
    then I’ll sign it. The same is true with a Java throws clause. If you put things
    like new PrintStream("cookedData.txt") in your code, and you don’t add something
    like throws FileNotFoundException, then the Java compiler refuses to compile your
    code.


    ✓ **In Listing 13-2, the expression new File("rawData.txt") plays the same role
    that System.in plays in so many other programs.**


    Just as System.in stands for the computer’s keyboard, the expression new File("rawData.txt")
    stands for a file on your computer’s hard drive. When the computer calls new File("rawData.txt"),
    the computer creates something like System.in — something you can stuff inside
    the new Scanner() parentheses.


    The word File is defined in the Java API.


    So when do you need this throws FileNotFoundException clause, and when should
    you do without it? Well, having certain things in your code — things like new
    PrintStream("cookedData.txt") — forces you to create a throws clause. You can
