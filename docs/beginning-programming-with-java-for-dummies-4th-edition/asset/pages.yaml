    \nLike the code in Listing 15-3, the program in Listing 15-6 contains a loop within\
    \ a loop. In fact, Listing 15-6 has a loop within a loop within a loop. Here's\
    \ the strategy in Listing 15-6:\n\n```\nfor (each of the 4 symbols that\n    can\
    \ appear on the left reel),\n    for (each of the 4 symbols that\n        can\
