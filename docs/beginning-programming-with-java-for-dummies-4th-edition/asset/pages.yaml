- pgno: 26
  md: '# Chapter 1


    # # Getting Started


    # ### In This Chapter


    +   - Realizing what computer programming is all about

    +   - Understanding the software that enables you to write programs

    +   - Revving up to use an integrated development environment


    Computer programming? What’s that? Is it technical? Does it hurt? Is it politically
    correct? Does Bill Gates control it? Why would anyone want to do it? And what
    about me? Can I learn to do it?


    # ## What’s It All About?


    You’ve probably used a computer to do word processing. Type a letter, print it,
    and then send the printout to someone you love. If you have easy access to a computer,
    then you’ve probably surfed the web. Visit a page, click a link, and see another
    page. It’s easy, right?


    Well, it’s easy only because someone told the computer exactly what to do. If
    you take a computer right from the factory and give no instructions to this computer,
    the computer can’t do word processing, it can’t surf the web, and it can’t do
    anything. All a computer can do is follow the instructions that people give to
    it.


    Now imagine that you’re using Microsoft Word to write the great American novel,
    and you come to the end of a line. (You’re not at the end of a sentence; just
    the end of a line.) As you type the next word, the computer’s cursor jumps automatically
    to the next line of type. What’s going on here?


    Well, someone wrote a *computer program* — a set of instructions telling the computer
    what to do. Another name for a program (or part of a program) is *code*. Listing
    1-1 shows you what some of Microsoft Word’s code may look like.'
  merge: -1
  img_proc: true
