  md: "# Chapter 11\n\n# How to Flick a Virtual Switch\n\n# In This Chapter\n\n+ \
    \  - Dealing with many alternatives\n+   - Jumping out from the middle of a statement\n\
    +   - Handling alternative assignments\n\nImagine playing *Let's Make a Deal*\
    \ with ten different doors. \"Choose door number 1, door number 2, door number\
    \ 3, door number 4 . . . Wait! Let's break for a commercial. When we come back,\
    \ I'll say the names of the other six doors.\"\n\nWhat Monty Hall needs is Java's\
    \ `switch` statement.\n\n# Meet the switch Statement\n\nThe code in Listing 9-2\
    \ in Chapter 9 simulates a fortune-telling toy — an electronic oracle. Ask the\
    \ program a question, and the program randomly generates a yes or no answer. But,\
    \ as toys go, the code in Listing 9-2 isn't much fun. The code has only two possible\
    \ answers. There's no variety. Even the earliest talking dolls could say about\
    \ ten different sentences.\n\nSuppose that you want to enhance the code of Listing\
    \ 9-2. The call to `myRandom.nextInt(10) + 1` generates numbers from 1 to 10.\
    \ So maybe you can display a different sentence for each of the ten numbers. A\
    \ big pile of if statements should do the trick:\n\n```\nif (randomNumber == 1)\
    \ {\n    System.out.println(\"Yes. Isn't it obvious?\");\n}\nif (randomNumber\
    \ == 2) {\n    System.out.println(\"No, and don't ask again.\");\n}\nif (randomNumber\
    \ == 3) {\n    System.out.println(\"Yessir, yessir!\");\n    System.out.println(\"\
    \ Three bags full.\");\n}\n```"
