- pgno: 145
  md: 'the computer can substitute something in place of a method call. The computer
    does this in Listing 6-2. When you type 5.75 on the keyboard, the computer turns


    ```

    amount = keyboard.nextDouble();

    ```


    into


    ```

    amount = 5.75;

    ```


    (The computer doesn''t really rewrite the code in Listing 6-2. This amount = 5.75
    line just illustrates the effect of the computer''s action.) In the second assignment
    statement in Listing 6-2, the computer adds 25.00 to the 5.75 that''s stored in
    amount.


    Some method calls have this substitution effect, and others (like System.out.println)
    don''t. To find out more about this topic, see Chapter 19.


    # Who does what, and how?


    When you write a program, you''re called a programmer, but when you run a program,
    you''re called a user. So when you test your own code, you''re being both the
    programmer and the user.


    Suppose that your program contains a keyboard.nextSomething() call, like the calls
    in Listings 5-1 and 6-2. Then your program gets input from the user. But when
    the program runs, how does the user know to type something on the keyboard? If
    the user and the programmer are the same person, and the program is fairly simple,
    then knowing what to type is no big deal. For example, when you start running
    the code in Listing 5-1, you have this book in front of you, and the book says
    "The computer is waiting for you to type something . . . You type one line of
    text . . ." So you type the text and press Enter. Everything is fine.


    starts running, the user has to stare at the screen to figure out what to do next.
    The code in Listing 6-2 works in this stare-at-the-screen scenario. In Listing
    6-2, the first call to print puts an informative message (What''s the price of
    a CD-ROM?) on the user''s screen. A message of this kind is called a prompt.


    When you start writing programs, you can easily confuse the roles of the program
    and the user''s input. So remember, no preordained relationship exists between
    a prompt and the subsequent input. To create a prompt, you call print or println.
    Then, to read the user''s input, you call nextLine, nextDouble, or one of the
    Scanner class''s other nextSomething methods. These print and next calls belong
    in two separate statements. Java has no commonly used, single statement that does
    both the prompting and the "next-ing."'
