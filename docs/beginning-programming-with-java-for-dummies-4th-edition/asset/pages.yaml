  md: '![](img/bf4858233d2b2a32ff4e3991860526b3_425_0.png)


    When you open any copy of eclipse, the program prompts you for a place on your
    hard drive for the Eclipse workspace (your collection of Eclipse projects). At
    this point, you have a choice:


    You can have two different folders for two different workspaces — one workspace
    for your original copy of Eclipse, and a second workspace for your new copy of
    Eclipse.


    Doing so keeps your original work (for preceding chapters) separate from this
    chapter''s work. Also, with two different workspaces, you can run both copies
    of Eclipse simultaneously.


    Alternatively, you can point both versions of Eclipse to the same folder (and
    thus, to the same workspace).


    Doing so keeps all your work in one place. You don''t have to change workspaces
    in order to change from your original work to this chapter''s work. On the minus
    side, you can''t run two copies of Eclipse using the same workspace simultaneously.


    ![](img/bf4858233d2b2a32ff4e3991860526b3_425_1.png)


    Don''t fret over the decision you make about Eclipse workspaces. In any copy of
    Eclipse, you can switch from one workspace to another. You can decide on a particular
    workspace whenever you launch Eclipse. You can also move from one workspace to
    another by selecting File→Switch Workspace in Eclipse''s main menu.


    ![](img/bf4858233d2b2a32ff4e3991860526b3_425_2.png)


    You need at least JDK 7u7 in order to run e(fx)clipse.


    # Creating a bare-bones JavaFX project


    There''s a wise old saying, "A picture is worth 50 words." And if you count things
    like javafx.application.Application as three separate words, the same picture
    is worth 70 words. In this section, you create a picture from which Eclipse builds
    a 70-word Java program.


    +   1. Follow the instructions in the previous sections (the "Installing Scene
    Builder" and "Installing e(fx)clipse" sections).

    +   2. Launch your new copy of Eclipse and click the Welcome screen''s Workbench
    icon.

    +   3. From Eclipse''s menu bar, choose File→New→Project.

    +      The New Project dialog box appears.

    +   4. In the dialog box''s list, expand the JavaFX branch. Within that branch,
    select JavaFX project and then click Next.

    +      A New Java Project dialog box appears.'
