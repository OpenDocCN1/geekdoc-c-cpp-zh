- pgno: 37
  md: 'In the best of all possible worlds, you do all your program editing, documentation
    reading, and command issuing through one nice interface. This interface is called
    an integrated development environment (IDE).


    A typical IDE divides your screen''s work area into several panes — one pane for
    editing programs, another pane for listing the names of programs, a third pane
    for issuing commands, and other panes to help you compose and test programs. You
    can arrange the panes for quick access. Better yet, if you change the information
    in one pane, the IDE automatically updates the information in all the other panes.


    An IDE helps you move seamlessly from one part of the programming endeavor to
    another. With an IDE, you don''t have to worry about the mechanics of editing,
    compiling, and running a JVM. Instead, you can worry about the logic of writing
    programs. (Wouldn''t you know it? One way or another, you always have something
    to worry about!)


    # What''s already on your hard drive?


    You may already have some of the tools you need for creating Java programs. But,
    on an older computer, your tools may be obsolete. Most of this book''s examples
    run on all versions of Java. But some examples don''t run on versions earlier
    than Java 5.0. Other examples run only on Java 6, Java 7, Java 8, or later.


    The safest bet is to download tools afresh from java.com or from the Oracle website.
    To get detailed instructions on doing the download, see Chapter 2.


    # Eclipse


    The programs in this book work with any IDE that can run Java. This includes IDEs
    such as NetBeans, IntelliJ IDEA, JDeveloper, JCreator, and others. You can even
    run the programs without an IDE. But to illustrate the examples in this book,
    I use the Eclipse IDE. I chose Eclipse over other IDEs for several reasons:


    +   - Eclipse is free.

    +   - Among all the Java IDEs, Eclipse is the one most commonly used by professional
    programmers.

    +   - Eclipse has many bells and whistles, but you can ignore most of them and
    learn to repeat a few routine sequences of steps. After using Eclipse a few times,
    your brain automatically performs the routine steps. From then on, you can stop
    worrying about Eclipse and concentrate on Java programming.

    +   - Eclipse is free. (It''s worth mentioning twice.)'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# Chapter 2


    # Setting Up Your Computer


    # In This Chapter


    +   - Installing Java

    +   - Downloading and installing the Eclipse integrated development environment

    +   - Checking your Eclipse configuration

    +   - Getting the code in this book''s examples


    This book tells you how to write Java programs, and before you can write Java
    programs, you need some software. At the very least, you need the software that
    I describe in Chapter 1 — a Java compiler and a Java Virtual Machine (JVM, for
    short). You can also use a good integrated development environment (IDE) and some
    sample code to get you started.


    All the software you need for writing Java programs is free. The software comes
    as three downloads — one from this book''s website, another from Oracle, and a
    third from eclipse.org.


    ![](img/bf4858233d2b2a32ff4e3991860526b3_38_0.png)


    The Oracle and Eclipse websites that I describe in this chapter are always changing.
    The software that you download from these sites changes, too. A specific instruction
    such as "click the button in the upper-right corner" becomes obsolete (and even
    misleading) in no time at all. So in this chapter, I provide long lists of steps,
    but I also describe the ideas behind the steps. Browse each of the suggested sites
    and look for ways to get the software that I describe. When a website offers you
    several options, check the instructions in this chapter for hints on choosing
    the best option. If your computer''s Eclipse window doesn''t look quite like the
    window in this chapter''s figures, scan your computer''s window for whatever options
    it describes. If, after all that, you can''t find what you''re looking for, check
    this book''s website (http://allmycode.com/BeginProg) or send an e-mail to me
    at BeginProg@allmycode.com. You can also find me on Facebook at /allmycode or
    on Twitter at @allmycode.'
