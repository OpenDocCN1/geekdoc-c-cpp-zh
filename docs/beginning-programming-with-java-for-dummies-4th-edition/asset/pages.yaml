    # From infinity to affinity


    For some problems, an infinite loop is normal and desirable. Consider, for example,
    a real-time mission-critical application — air traffic control, or the monitoring
    of a heart-lung machine. In these situations, a program should run and run and
    run.


    But a game of Twenty-One should end pretty quickly. In Figure 12-8, the game doesn''t
    end because the total never reaches 21 or higher. In fact, the total is always
    zero. The problem is that my code has no statement to change the total variable''s
    value. I should add each card''s value to the total:


    ```

    total += card;

