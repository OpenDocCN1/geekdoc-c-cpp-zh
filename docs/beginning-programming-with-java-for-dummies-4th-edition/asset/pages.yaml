    What number or numbers are stored in Figure 7-13? Is it two numbers, 42 and 21?
    Or is it one number, 4,221? And what about storing four numbers, 4, 2, 2, and
    1? It all depends on the amount of space each number consumes.


    Imagine a variable that stores the number of paydays in a month. This number never
    gets bigger than 31. You can represent this small number with just eight zeros
    and ones. But what about a variable that counts stars in the universe? That number
    could easily be more than a trillion, and to represent one trillion accurately,
    you need 64 zeros and ones.


    At this point, Java comes to the rescue. Java has four types of whole numbers.
    Just as in Listing 7-1, I declare


