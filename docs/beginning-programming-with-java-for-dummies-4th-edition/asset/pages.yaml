- pgno: 206
  md: "![](img/bf4858233d2b2a32ff4e3991860526b3_206_0.png)\n\nFigure 9-8:\nCheer for\
    \ your favorite team.\n\n# Statements and blocks\n\nAn elegant way to think about\
    \ if statements is to realize that you can put only one statement inside each\
    \ clause of an if statement.\n\n```\nif (Condition)\n    aStatement\nelse\n  \
    \  anotherStatement\n```\n\nOn your first reading of this one-statement rule,\
    \ you're probably thinking that there's a misprint. After all, in Listing 9-4,\
    \ each clause (the if clause and the else clause) seems to contain four statements,\
    \ not just one.\n\nBut technically, the if clause in Listing 9-4 has only one\
    \ statement, and the else clause in Listing 9-4 has only one statement. The trick\
    \ is, when you surround a bunch of statements with curly braces, you get what's\
    \ called a block, and a block behaves, in all respects, like a single statement.\
    \ In fact, the official\n\nJava documentation lists a block as a kind of statement\
    \ (one of many different kinds of statements). So in Listing 9-4, the block\n\n\
    ```\n{\n    out.print(\"Hankees: \");\n    out.println(hankees);\n    out.print(\"\
    Socks: \");\n    out.println(socks);\n}\n```\n\nis a single statement. It's a\
    \ statement that has four smaller statements within it. So this big block, this\
    \ single statement, serves as the one and only statement inside the if clause\
    \ in Listing 9-4.\n\nThat's how the one-statement rule works. In an if statement,\
    \ when you want the computer to execute several statements, you combine those\
    \ statements into one big statement. To do this, you make a block using curly\
    \ braces."
