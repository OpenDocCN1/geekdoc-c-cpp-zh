  md: 'decisions. They made some obvious choices, and they also made some unexpected
    choices. No one knows everything about Java''s features, so don''t expect to cram
    all the answers into your head.


    The Java documentation is great, but for every question that the documentation
    answers, it ignores three other questions. So be bold. Don''t be afraid to tinker.
    Write lots of short, experimental programs. You can''t break the computer, so
    play tough with it. Your inquisitive spirit will always pay off.


    Reading and understanding Java''s API documentation is an art, not a science.
    For advice on making the most of these docs, read my article "Making Sense of
    Java''s API Documentation," at http://www.dummies.com/extras/beginningprogrammingwithjava.


    # One character only, please


    A char variable stores only one character. So if you''re tempted to write the
    following statements


    ```

    char smallLetters;

    smallLetters = ''barry''; //Don''t do this

    ```


    please resist the temptation. You can''t store more than one letter at a time
    in a char variable, and you can''t put more than one letter between a pair of
    single quotes. If you''re trying to store words or sentences (not just single
