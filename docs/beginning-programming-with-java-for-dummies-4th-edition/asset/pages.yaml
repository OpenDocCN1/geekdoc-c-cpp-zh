- pgno: 118
  md: 'So what''s the big deal when you type the program yourself? Well, lots of interesting
    things can happen when you apply fingers to keyboard. That''s why the second half
    of this chapter is devoted to troubleshooting.


    # How the EchoLine program works


    When you were a tiny newborn, resting comfortably in your mother''s arms, she
    told you how to send characters to the computer screen:


    ```

    System.out.println(whatever text you want displayed);

    ```


    What she didn''t tell you was how to fetch characters from the computer keyboard.
    There are lots of ways to do it, but the one I recommend in this chapter is


    ```

    keyboard.nextLine()

    ```


    Now, here''s the fun part. Calling the nextLine method doesn''t just scoop characters
    from the keyboard. When the computer runs your program, the computer substitutes
    whatever you type on the keyboard in place of the text keyboard.nextLine().


    To understand this, look at the statement in Listing 5-1:


    ```

    System.out.println(keyboard.nextLine());

    ```


    When you run the program, the computer sees your call to nextLine and stops dead
    in its tracks. (Refer to Figure 5-2.) The computer waits for you to type a line
    of text. So (refer to Figure 5-3) you type this line:


    ```

    Hey, there''s an echo in here.

    ```


    The computer substitutes this entire Hey line for the keyboard.nextLine() call
    in your program. The process is illustrated in Figure 5-5.


    The call to keyboard.nextLine() is nestled inside the System.out.println call.
    So when all is said and done, the computer behaves as though the statement in
    Listing 5-1 looks like this:


    ```

    System.out.println("Hey, there''s an echo in here.");

    ```


    The computer displays another copy of the text Hey, there''s an echo in here.
    on the screen. That''s why you see two copies of the Hey line in Figure 5-4.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '![](img/bf4858233d2b2a32ff4e3991860526b3_119_0.png)


    Figure 5-5:

    The computer substitutes text in place of the nextLine call.


    # Getting numbers, words, and other things


    In Listing 5-1, the words keyboard.nextLine() get an entire line of text from
    the computer keyboard. So if you type


    ```

    Testing 1 2 3

    ```


    the program in Listing 5-1 echoes back your entire Testing 1 2 3 line of text.


    Sometimes you don''t want a program to get an entire line of text. Instead, you
    want the program to get a piece of a line. For example, when you type 1 2 3, you
    may want the computer to get the number 1. (Maybe the number 1 stands for one
    customer or something like that.) In such situations, you don''t put keyboard.nextLine()
    in your program. Instead, you use keyboard.nextInt().


    Table 5-1 shows you a few variations on the keyboard.next business. Unfortunately,
    the table''s entries aren''t very predictable. To read a line of input, you call
    nextLine. But to read a word of input, you don''t call nextWord. (The Java API
    has no nextWord method.) Instead, to read a word, you call next.'
