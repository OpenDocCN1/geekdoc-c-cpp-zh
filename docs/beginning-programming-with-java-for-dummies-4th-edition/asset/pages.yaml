    \ with for statements, the message may surprise you. 'Whadaya mean 'count cannot\
    \ be resolved to a variable'? There's a count variable declaration just four lines\
    \ above that statement.' Ah, yes. But the count variable is declared in the for\
    \ loop's initialization. Outside the for loop, that count variable doesn't exist.\n\
    \n# Figure 15-3: What count variable? I don't see a count variable.\n\n![](img/bf4858233d2b2a32ff4e3991860526b3_305_0.png)\n\
    \nTo use a variable outside of a for statement, you have to declare that variable\
    \ outside the for statement. You can even do this with the for statement's counting\
    \ variable. Listing 15-2 has an example.\n\n# Listing 15-2: Using a Variable Declared\
    \ Outside of a for Loop\n\n```\nimport static java.lang.System.out;\n\nclass AuntEdnaDoesItAgain\
    \ {\n    public static void main(String args[]) {\n        int count;\n      \
    \  for (count = 0; count < 10; count++) {\n            out.print(\"I've chewed\
    \ \");\n            out.print(count);\n            out.println(\" time(s).\");\n\
    \        }\n        out.print(count);\n        out.println(\" times! Hooray!\"\
    );\n        out.println(\"I can swallow!\");\n    }\n}\n```"
