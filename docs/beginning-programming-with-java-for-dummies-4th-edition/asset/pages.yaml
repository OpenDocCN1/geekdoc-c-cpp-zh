    ```

    firstInt = keyboard.nextInt();

    secondInt = keyboard.nextInt();


    onlyInt = keyboard.nextInt();


    firstChar = keyboard.findWithinHorizon(".", 0).charAt(0);

    secondChar = keyboard.findWithinHorizon(".", 0).charAt(0);


    firstChar = keyboard.findWithinHorizon(".", 0).charAt(0);

    secondChar = keyboard.findWithinHorizon(".", 0).charAt(0);

    ```


    ![](img/bf4858233d2b2a32ff4e3991860526b3_178_1.png)


    To represent a lone character in the text of a computer program, you surround
    the character with single quote marks. But, when you type a character as part
    of a program''s input, you don''t surround the character with quote marks.


    ![](img/bf4858233d2b2a32ff4e3991860526b3_178_2.png)


    Suppose that your program calls nextInt and then findWithinHorizon(".", 0).charAt(0).
    If you type 80x on the keyboard, you get an error message. (The message says InputMismatchException.
    The nextInt method expects you to type a blank space after each int value.) Now
    what happens if, instead of typing 80x, you type 80 x on the keyboard? Then the
    program gets 80 for the int value, followed by a blank space for the character
    value. For the program to get the x, the program has to call findWithinHorizon(".",
    0).charAt(0) one more time. It seems wasteful, but it makes sense in the long
    run.'
