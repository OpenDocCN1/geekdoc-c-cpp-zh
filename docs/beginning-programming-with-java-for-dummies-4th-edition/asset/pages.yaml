  md: 'looks the same on every operating system.

    In a Swing program, you can create table components and tree components because
    Java simply draws them in the computer''s window. The bad news is, Swing components
    aren''t pretty. A JButton looks primitive and crude compared to a Mac button or
    a Windows button.


    Java''s Swing classes replace some (but not all) of the classes in the older AWT.
    To use some of the Swing classes, you have to call on some of the old AWT classes.


    ✓ Eclipse''s Standard Widget Toolkit (SWT):

    An alternative to Java''s AWT and Swing sets. Despite the word "Standard" in SWT''s
    name, SWT is not part of Oracle''s standard Java.


    Classes in this set belong to packages whose names begin with org.eclipse.swt.


    The SWT takes an "all or nothing" approach. When you create an exotic component
    that a particular operating system doesn''t have, the SWT draws the component
    the way Swing does. (That is, SWT does all the work of creating and managing the
    component.) But when you create a component that''s built into a computer''s operating
    system, SWT displays the operating system''s component and adds no additional
    functionality.


    and adds no additional functionality. Unlike the AWT, the SWT creates an operating
    system button and then lets the button do its own thing. This carefully defined
    window of interaction between SWT and the operating system overcomes many of the
    difficulties posed by the design of the AWT.


    (FYI: A Google Trends search in 2014 puts Swing way ahead of AWT and SWT in terms
    of interest by Java developers. See www.bogotobogo.com/JavaWebStart/awt_swing_swt.php.)


    ✓ JavaFX: The newest set of GUI classes in Oracle standard Java. JavaFX comes
    with new(er) versions of Java 7 and with all versions of Java 8.


    Classes in this set belong to packages whose names begin with javafx.


    JavaFX supports over 60 kinds of components. (Sure, you want a Button component.
    But do you also want an Accordion component? JavaFX has one.) In addition, JavaFX
    supports multi-touch operations and takes advantage of each processor''s specialized
    graphics capabilities.


    For more information about JavaFX, see this chapter''s "Code Soup: Mixing XML
    with Java" section.


    # Showing an image on the screen


    The program in Listing 20-1 displays a window on your computer screen. To see
    the window, look at Figure 20-1.


    The code in Listing 20-1 has very little logic of its own. Instead, this code
    pulls together a bunch of classes from the Java API.'
