    \ have to excuse the folks who created the `Scanner` class. They created `Scanner`\
    \ from a specialized point of view.)\n\nTo see some of the table's methods in\
    \ action, check other program listings in this book. Chapters 6, 7, and 8 have\
    \ some particularly nice examples.\n\n# Type three lines of code and don't look\
    \ back\n\nBuried innocently inside Listing 5-1 are three extra lines of code.\
    \ These lines help the computer read input from the keyboard. The three lines\
    \ are\n\n```\nimport java.util.Scanner;\n\n    Scanner keyboard = new Scanner(System.in);\n\
