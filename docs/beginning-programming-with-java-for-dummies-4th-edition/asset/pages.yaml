- pgno: 421
  md: '# Code Soup: Mixing XML with Java


    Go back and feast your eyes one more time on the code in Listing 20-1. Despite
    Java''s object-oriented flavor, the code displays a window using a "do this, then
    do that" approach.


    ```

    Here''s how you show a picture:

    Construct a frame

    Construct an icon containing a certain image

    Construct a label containing the icon

    Add the icon to the frame

    ...

    Pack the frame

    Make the frame be visible

    ```


    This "do this, then do that" approach is called procedural programming.


    Now imagine you''re at the Louvre looking at the Mona Lisa. You don''t think "Da
    Vinci added a face, then he put a smile on the face, then he added a body, and
    then a background." The painting doesn''t progress from one action to another.
    Instead, the painting simply is.


    In the same way, a window in a GUI application doesn''t need a procedural progression.
    Instead, you can describe a window declaratively. You write code that says "Here''s
    how the window looks." The Java Virtual Machine uses your description to decide
    (on its own) what to display and when.


    Consider, for example, the grid in Figure 20-7.


    ![](img/bf4858233d2b2a32ff4e3991860526b3_421_0.png)


    The following Swing code creates a grid like the one in Figure 20-7. Don''t look
    at all the details in the code. Instead, notice all the verbs: "set the layout
    to a new GridLayout, add a label to the frame, set the font, pack the frame, and
    so on." It''s all procedural.


    ```

    import java.awt.Font;

    import java.awt.GridLayout;


    import javax.swing.JFrame;

    import javax.swing.JLabel;

    ```'
