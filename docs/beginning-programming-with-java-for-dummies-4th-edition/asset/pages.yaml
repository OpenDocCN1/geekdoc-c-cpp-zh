  md: "# Listing 12-5: How to Prime a Loop\n\n```\n/*\n * This code works correctly!\n\
    \ */\nimport java.util.Scanner;\n\nclass GetUserName {\n    public static void\
    \ main(String args[]) {\n        Scanner keyboard = new Scanner(System.in);\n\
    \        char symbol;\n\n        symbol = keyboard.findWithinHorizon(\".\",0)\n\
    \                .charAt(0);\n\n        while (symbol != '@') {\n            System.out.print(symbol);\n\
    \            symbol = keyboard.findWithinHorizon(\".\",0)\n                  \
    \  .charAt(0);\n        }\n\n        System.out.println();\n        keyboard.close();\n\
    \    }\n}\n```\n\nListing 12-5 follows the strategy shown in Figure 12-13. First\
    \ you get a character (the letter J in John, for example), and then you enter\
    \ the loop. After you're in the loop, you test the letter against the @ sign and\
    \ print the letter if it's appropriate to do so. Figure 12-14 shows a beautiful\
    \ run of the GetUserName program.\n\n# Figure 12-13:\nThe strategy\nin Listing\n\
    12-5.\n\n![](img/bf4858233d2b2a32ff4e3991860526b3_266_0.png)"
