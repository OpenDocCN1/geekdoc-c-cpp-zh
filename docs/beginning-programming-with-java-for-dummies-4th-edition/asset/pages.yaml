  md: '![](img/bf4858233d2b2a32ff4e3991860526b3_313_0.png)


    # 6. Observe that the file''s name appears in Eclipse''s Package Explorer.


    The name is in the 15-04 project''s root directory. You put it in the root directory
    because, in Listing 15-04, the name importantData.txt (with no slashes or backslashes)
    refers only to a name in the project''s root directory. The program''s run has
    no effect on any files outside the root directory, even if any of those files
    have the name importantData.txt.


    To find out how to refer to files outside of the project''s root directory, refer
    to Chapter 13.


    For this experiment, you don''t have to add any text to the file. The file exists
    only to be deleted.


    # 7. Run the program.


    When the program runs, type Y to delete the importantData.txt file.


    After running the program, you want to check to make sure that the program deleted
    the importantData.txt file.


    # 8. In the Package Explorer, select the project''s root (again, for good measure).


    # 9. In Eclipse''s main menu, choose File→Refresh.


    Eclipse takes another look at the project directory and lists the directory''s
    files in the Package Explorer''s tree. Assuming that the program did its job correctly,
    the file named importantData.txt no longer appears in the tree.


    In Listing 15-4, the statement


    ```

    new File("importantData.txt").delete();

    ```


    is tricky. At first glance, you seem to be creating a new file, only to delete
    that file in the same line of code! But in reality, the words new File create
    only a representation of a file inside your program. To be more precise, the words
    new File create, inside your program, a representation of a disk file that may
    or may not already exist on your computer''s hard drive. So here''s what the new
    File statement really means:


    > "Let new File("importantData.txt") refer to a file named importantData.txt.
    If such a file exists, then delete it."


    Yes, the devil is in the details. But smiles are in the subtleties and nobility
    is in the nuance.'
