  md: "But first, take a look at Listing 10-4. In that code, the condition age >=\
    \ 12 && age < 65 is tested twice. Both times, the computer sends the numbers 12,\
    \ 65, and the age value through its jumble of circuits; and both times, the computer\
    \ gets the same answer. This is wasteful, but waste isn't your only concern.\n\
    \nWhat if you decide to change the age limit for senior tickets? From now on,\
    \ no one under 100 gets a senior discount. You fish through the code and see the\
    \ first age >= 12 && age < 65 test. You change 65 to 100, pat yourself on the\
    \ back, and go home. The problem is, you've changed one of the two age >= 12 &&\
    \ age < 65 tests, but you haven't changed the other. Wouldn't it be better to\
    \ keep all the age >= 12 && age < 65 testing in just one place?\n\nListing 10-5\
    \ comes to the rescue. In Listing 10-5, I smoosh all my if statements together\
    \ into one big glob. The code is dense, but it gets the job done nicely.\n\n#\
    \ Listing 10-5: Nested if Statements\n\n```\nimport java.util.Scanner;\n\nclass\
    \ AnotherAgeCheck {\n\n    public static void main(String args[]) {\n        Scanner\
    \ keyboard = new Scanner(System.in);\n        int age;\n        double price =\
