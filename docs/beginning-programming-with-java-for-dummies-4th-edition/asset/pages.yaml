    \ other applications, extra output can be disastrous.\n\n# Fixing the problem\n\
    \nDisastrous or not, an unwanted blank space is the symptom of a logical flaw.\
    \ The program shouldn't display results before it has any meaningful results to\
    \ display. The solution to this problem is called... (drumroll, please)... priming\
    \ the loop. You pump findWithinHorizon(\".\",0).charAt(0) once to get some values\
    \ flowing. Listing 12-5 shows you how to do it."
