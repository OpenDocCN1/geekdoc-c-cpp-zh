- pgno: 92
  md: '# Chapter 4


    # Exploring the Parts of a Program


    # In This Chapter


    +   - Identifying the words in a Java program

    +   - Using punctuation and indentation

    +   - Understanding Java statements and methods


    I work in the science building at a liberal arts college. When I walk past the
    biology lab, I always say a word of thanks under my breath. I''m thankful for
    not having to dissect small animals. In my line of work, I dissect computer programs
    instead. Computer programs smell much better than preserved dead animals. Besides,
    when I dissect a program, I''m not reminded of my own mortality.


    In this chapter, I invite you to dissect a program with me. I have a small program,
    named ThingsILike. I cut apart the program and carefully investigate the program''s
    innards. Get your scalpel ready. Here we go!


    # Checking Out Java Code

    for the First Time


    I have a confession to make. The first time I look at somebody else''s computer
    program, I feel a bit queasy. The realization that I don''t understand something
    (or many things) in the code makes me nervous. I''ve written hundreds (maybe thousands)
    of programs, but I still feel insecure when I start reading someone else''s code.


    The truth is, learning about a computer program is a bootstrapping experience.
    First, I gawk in awe of the program. Then I run the program to see what it does.
    Then I stare at the program for a while or read someone''s explanation of the
    program and its parts. Then I gawk a little more and run the program again. Eventually,
    I come to terms with the program. Don''t believe the wise guys who say they never
    go through these steps. Even experienced programmers approach a new project slowly
    and carefully.'
  merge: -1
  img_proc: true
- pgno: 93
  md: "# Behold! A program!\n\nIn Listing 4-1, you get a blast of Java code. Like\
    \ all novice programmers, you're expected to gawk humbly at the code. But don't\
    \ be intimidated. When you get the hang of it, programming is pretty easy. Yes,\
    \ it's fun, too.\n\n# Listing 4-1: A Simple Java Program\n\n```\n/*\n* A program\
    \ to list the good things in life\n* Author: Barry Burd, BeginProg@allmycode.com\n\
    * February 13, 2014\n*/\n\nclass ThingsILike {\n    public static void main(String\
    \ args[]) {\n        System.out.println(\"Chocolate, royalties, sleep\");\n  \
    \  }\n}\n```\n\nWhen I run the program in Listing 4-1, I get the result shown\
    \ in Figure 4-1: The computer shows the words Chocolate, royalties, sleep on the\
    \ screen. Now, I admit that writing and running a Java program is a lot of work\
    \ just to get the words Chocolate, royalties, sleep to appear on somebody's computer\
    \ screen, but every endeavor has to start somewhere.\n\n# Figure 4-1:\nRunning\
    \ the program in Listing 4-1.\n\n![](img/bf4858233d2b2a32ff4e3991860526b3_93_0.png)\n\
    \n![](img/bf4858233d2b2a32ff4e3991860526b3_93_1.png)\n\nMost of the programs in\
    \ this book are text-based programs. These programs do their input and output\
    \ almost exclusively in Eclipse's Console view. In contrast, a GUI (Graphical\
    \ User Interface) program displays windows, buttons, text fields, and other widgets\
    \ to interact with the user. You can see GUI versions of the program in Listing\
    \ 4-1, and in many other examples from this book, by visiting the book's website\
    \ (http://allmycode.com/BeginProg)."
