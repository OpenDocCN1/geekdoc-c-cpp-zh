- pgno: 228
  md: "One of the goals in computer programming is for each program's structure to\
    \ mirror whatever problem the program solves. When a program reminds you of its\
    \ underlying problem, the program is easy to understand and inexpensive to maintain.\
    \ For example, a program to tabulate customer accounts should use names like customer\
    \ and account. And a program that deals with three possible outcomes (home wins,\
    \ visitor wins, and tie) should have a variable with three possible values. The\
    \ line enum WhoWins {home, visitor, neither} creates a type to store three values.\n\
    \nThe WhoWins type is called an enum type. Think of the new WhoWins type as a\
    \ boolean on steroids. Instead of two values (true and false), the WhoWins type\
    \ has three values (home, visitor, and neither). You can create a variable of\
    \ type WhoWins\n\n```\nWhoWins who;\n```\n\nand then assign a value to the new\
    \ variable.\n\n```\nwho = WhoWins.home;\n```\n\nIn the next section, I put the\
    \ WhoWins type to good use.\n\n# Using an enum type\n\nListing 10-7 shows you\
    \ how to use the brand new WhoWins type.\n\n# Listing 10-7: Proud Winners and\
    \ Sore Losers\n\n```\nimport java.util.Scanner;\nimport static java.lang.System.out;\n\
    \nclass Scoreboard {\n    enum WhoWins {home, visitor, neither}\n    public static\
    \ void main(String args[]) {\n        Scanner keyboard = new Scanner(System.in);\n\
    \        int hankees, socks;\n        WhoWins who;\n        out.print(\"Hankees\
    \ and Socks scores? \");\n        hankees = keyboard.nextInt();\n        socks\
    \ = keyboard.nextInt();\n        out.println();\n    }\n}\n```"
