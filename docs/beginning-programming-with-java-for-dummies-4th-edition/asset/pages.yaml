  md: 'This new Root.fxml file describes the layout of the buttons, text fields, and
    other things in your new JavaFX application. This is the XML document that I make
    such a fuss about at the start of the “Code Soup: Mixing XML with Java” section.


    ![](img/bf4858233d2b2a32ff4e3991860526b3_428_0.png)


    **Figure 20-9:** The FXML File dialog box.


    +   7. **Right-click (or on a Mac, control-click) the new Root.fxml branch in
    Eclipse’s Package Explorer.** In the context menu that appears, select **Open
    with SceneBuilder**.


    The Scene Builder application window appears (see Figure 20-10).


    The Scene Builder window contains several areas:


    +   - The middle of the Scene Builder window contains the *Content panel*, where
    you see a preview of your new app. (Currently, there’s nothing in your app to
    see, so the Content panel is a big empty space.)

    +   - The upper-left portion of the window contains a *Library panel*, which houses
    a Containers section, a Controls section, and several other sections.


    In the GUI world, things like buttons, text fields, labels, and check boxes are
    called *controls*. The Library panel’s Controls section forms a palette. To create
    a GUI window, you drag controls from the palette and drop them onto the Content
    panel.'
