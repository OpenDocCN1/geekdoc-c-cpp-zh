    5. Follow the installation routine''s instructions.


    On a Windows computer, you accept a bunch of defaults.


    On a Mac, you drag the Scene Builder''s icon to the Applications folder.


    That''s it! You''ve installed Scene Builder.


    # Installing e(fx)clipse


    Eclipse has its own elaborate facility for incorporating new functionality. An
    Eclipse tool is called an Eclipse plug-in. When you first install Eclipse, you
    get many plug-ins by default. Then, to enhance Eclipse''s power, you can install
    many additional plug-ins.


    Eclipse''s e(fx)clipse plug-in facilitates the creation of JavaFX applications.
    You can add the plug-in to your existing installation of Eclipse, but it''s much
    simpler to download a new copy of Eclipse (a copy with e(fx)clipse already installed).
    Here''s how you get the new copy of Eclipse:


    ![](img/bf4858233d2b2a32ff4e3991860526b3_424_0.png)


    +   1. Visit efxclipse.bestsolution.at.

    +   2. Look for the page containing All-in One downloads.

    +   3. On the All-in One downloads page, look for a way to download a copy of
    Eclipse for your operating system.

    +   4. Follow the appropriate links or click the appropriate buttons to begin
    the download.

    +   5. Follow the instructions in Chapter 2 to install this new copy of Eclipse
    on your computer.


    Your Eclipse download''s word length (32-bit or 64-bit) must match your Java version''s
    word length. For the full lowdown on 32-bit and 64-bit word lengths, see Chapter
    2.


    Place the new copy of Eclipse in a brand-new folder. That way, you don''t have
    to uninstall your old copy of Eclipse. (In fact, it''s helpful to have two separate
    Eclipse installations on your computer.) On my Windows computer, I have a c:\eclipse
    folder and a c:\eclipseFX folder. Both folders have their own subfolders with
    names like configuration, features, and plugins. Both folders have their own eclipse.exe
    file. Similarly, my Mac has both eclipse and e(fx)clipse folders inside the Applications
    folder.'
