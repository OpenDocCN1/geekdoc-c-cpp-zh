    \ as long as the address contains an @ sign.\n+   \n+   2. **Put the** `ListOneUsername.java`\
    \ **file (the code from Listing 14-1) in your project’s** `src/(default package)`\
    \ **directory.**\n+   \n+   3. **Run the code in Listing 14-1.**\n+   \n+    \
    \  When you run the code, you see nothing interesting in the Console view. What\
    \ a pity!\n+   \n+   4. **View the contents of the** `usernames.txt` **file.**\n\
    +   \n+      If your `email.txt` file contains John@BurdBrain.com, the `usernames.txt`\
    \ file contains John.\n\nFor more details on any of these steps, see the discussion\
    \ accompanying Listings 13-2, 13-3, and 13-4 in Chapter 13. (The discussion is\
    \ especially useful if you don’t know how to view the `usernames.txt` file’s contents.)\n\
    \n# Creating Useful Code\n\nThe previous section describes a network administrator’s\
    \ problem — creating a file filled with usernames from a file filled with e-mail\
    \ addresses. The code in Listing 14-1 solves part of the problem — it extracts\
    \ just one e-mail address. That’s a good start, but to get just one username,\
    \ you don’t need a computer program. A pencil and paper does the trick.\n\nSo\
    \ don’t keep the network administrator waiting any longer. In this section, you\
    \ develop a program that processes dozens, hundreds, and even thousands of e-mail\
    \ addresses from a file on your hard drive.\n\nFirst, you need a strategy to create\
    \ the program. Take the statements in Listing 14-1 and run them over and over\
    \ again. Better yet, have the statements run themselves over and over again. Fortunately,\
    \ you already know how to do something over and over again: You use a loop. (See\
    \ Chapter 12 for the basics on loops.)"
