- pgno: 213
  md: '# When to initialize?


    Take a look at Listing 10-1 and notice the `price` variable’s initialization:


    ```

    ```java

    double price = 0.00;

    ```

    ```


    This line declares the price variable and sets the variable’s starting value to
    `0.00`. When I omit this initialization, I get an error message:


    ```

    ```

    The local variable price may not have been initialized

    ```

    ```


    What’s the deal here? I don’t initialize the age variable, but the compiler doesn’t
    complain about that. Why is the compiler fussing over the price variable?


    The answer is in the placement of the code’s assignment statements. Consider the
    following two facts:


    > > ✓ **The statement that assigns a value to `age` (`age = keyboard.nextInt()`)
    isn’t inside an `if` statement.**

    > >

    > > That assignment statement always gets executed, and (as long as nothing extraordinary
    happens) the variable `age` is sure to be assigned a value.

    > >

    > > ✓ **Both statements that assign a value to `price` (`price = 9.25` and `price
    = 5.25`) are inside `if` statements.**

    > >

    > > If you look at Figure 10-3, you see that every age group is covered. No one
    shows up at the ticket counter with an age that forces both `if` conditions to
    be false. So, whenever you run the TicketPrice program, either the first or the
    second `price` assignment is executed.

    > >

    > > The problem is that the compiler isn’t smart enough to check all this. The
    compiler just sees the structure in Figure 10-4 and becomes scared that the computer
    won’t take either of the true detours.

    > >

    > > If (for some unforeseen reason) both of the `if` statements’ conditions are
    false, then the variable `price` isn’t assigned a value. So without an initialization,
    price has no value. (More precisely, price has no value that’s intentionally given
    to it in the code.)

    > >

    > > Eventually, the computer reaches the `System.out.print(price)` statement.
    It can’t display price unless price has a meaningful value. So at that point,
    the compiler throws up its virtual hands in disgust.'
  merge: -1
  img_proc: true
