  md: "# Listing 8-5: It's Warm and Cozy in Here\n\n```\nimport java.util.Scanner;\n\
    \nclass CelsiusToFahrenheit {\n    public static void main(String args[]) {\n\
    \        Scanner keyboard = new Scanner(System.in);\n        double celsius, fahrenheit;\n\
    \n        System.out.print(\"Enter the Celsius temperature: \");\n        celsius\
    \ = keyboard.nextDouble();\n\n        fahrenheit = 9.0 / 5.0 * celsius + 32.0;\n\
    \n        System.out.print(\"Room temperature? \");\n        System.out.println(fahrenheit\
    \ == 69.8);\n        keyboard.close();\n    }\n}\n```\n\nIf you run the code in\
    \ Listing 8-5 and input the number 21, the computer finds the value of 9.0 / 5.0\
    \ * 21 + 32.0. Believe it or not, you want to check the computer's answer. (Who\
    \ knows? Maybe the computer gets it wrong!) You need to do some arithmetic, but\
    \ please don't reach for your calculator. A calculator is just a small computer,\
    \ and machines of that kind stick up for one another. To check the computer's\
    \ work, you need to do the arithmetic by hand. What? You say you're math phobic?\
    \ Well, don't worry. I've done all the math in Figure 8-11.\n\n# Figure 8-11:\n\
    The Fahrenheit temperature is exactly 69.8.\n\n![](img/bf4858233d2b2a32ff4e3991860526b3_182_0.png)"
