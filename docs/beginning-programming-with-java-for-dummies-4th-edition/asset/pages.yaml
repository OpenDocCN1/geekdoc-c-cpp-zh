  md: "Listing 16-3 fixes the end-of-file problem.\n\n# Listing 16-3: A More Refined\
    \ Version of the One-Room Code\n\n```\nimport java.util.Scanner;\nimport java.io.File;\n\
    import java.io.FileNotFoundException;\nimport static java.lang.System.out;\n\n\
    public class BetterShowOneRoom {\n\n    public static void main(String args[])\n\
    \            throws FileNotFoundException {\n\n        Scanner keyboard = new\
    \ Scanner(System.in);\n        Scanner diskScanner\n            = new Scanner(new\
    \ File(\"occupancy\"));\n        int whichRoom;\n\n        out.print(\"Which room?\
    \ \");\n        whichRoom = keyboard.nextInt();\n\n        for (int roomNum =\
    \ 0;\n                 roomNum < whichRoom && diskScanner.hasNext();\n       \
    \          roomNum++) {\n\n            diskScanner.nextInt();\n        }\n\n \
    \       if (diskScanner.hasNext()) {\n            out.print(\"Room \");\n    \
    \        out.print(whichRoom);\n            out.print(\" has \");\n          \
    \  out.print(diskScanner.nextInt());\n            out.println(\" guest(s).\");\n\
    \        }\n\n        keyboard.close();\n        diskScanner.close();\n    }\n\
    }\n```\n\nThe code in Listing 16-3 isn’t earth shattering. To get this code, you\
    \ take the code in Listing 16-2 and add a few tests for the end of the occupancy\
    \ file. You perform the diskScanner.hasNext test before each call to nextInt.\
    \ That way, if the call to nextInt is doomed to failure, you catch the potential\
    \ failure before it happens. A few test runs of the code in Listing 16-3 are shown\
    \ in Figure 16-4."
