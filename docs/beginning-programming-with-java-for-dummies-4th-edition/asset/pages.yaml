    \ on the new label's face.\n+   - ✔ The constructor adds the JLabel object.\n\n\
    Time out! What's being added to what? In Listing 20-1, the statement\n\n```\n\
    ```\nframe.add(label);\n```\n```\n\nadds the JLabel object to the frame. But in\
    \ Listing 20-2, there's no frame variable. In Listing 20-2, all you have is\n\n\
    ```\n```\nadd(label);\n```\n```\n\nWell, here's the good news: Inside a constructor\
    \ declaration, the object that you're constructing is \"a given.\" You don't name\
    \ that new object in order to refer to that new object. It's as though the constructor's\
    \ code looked like this:\n\n```\n```java\nMyFrame() {\n    ImageIcon icon = new\
    \ ImageIcon(\"androidBook.jpg\");\n    JLabel label = new JLabel(icon);\n    new_frame_that_is_being_constructed.add(label);\n\
    \    new_frame_that_is_being_constructed.\n    setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
    \    new_frame_that_is_being_constructed.pack();\n    new_frame_that_is_being_constructed.\n\
    \    setVisible(true);\n}\n```\n```\n\nHere's how the constructor in Listing 20-2\
    \ finishes its work:\n\n+   - The constructor adds the JLabel object to the MyFrame\
    \ object that's being constructed.\n+   - The constructor tells the Java Virtual\
    \ Machine to shut itself down when you close the frame.\n+   - The constructor\
    \ shrink-wraps the frame around the image that appears on the frame.\n+   - The\
    \ constructor makes the frame appear on your screen.\n\nThe extends keyword adds\
    \ a very important idea to Java programming — the notion of inheritance. In Listing\
    \ 20-2, the newly created MyFrame class inherits the methods (and other things)\
    \ that are declared in the existing JFrame class. Inheritance is a pivotal feature\
    \ of an object-oriented programming language."
