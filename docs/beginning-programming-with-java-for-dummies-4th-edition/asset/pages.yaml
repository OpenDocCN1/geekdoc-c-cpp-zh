    \    symbol = keyboard.findWithinHorizon(\".\",0)\n        .charAt(0);\n}\n\n\
    System.out.println();\n\nkeyboard.close();\n}\n```\n\nA run of the Listing 12-4\
    \ code is shown in Figure 12-12. The code is almost correct, but I still have\
