    \    }\n}\n```\n\nThis “fixed” code has no compile-time errors. But when you run\
    \ this code, nothing happens. The program starts running and then stops running\
    \ with nothing in Eclipse’s Console view.\n\nWe all know that a computer is a\
    \ very patient, very sympathetic machine. That’s why the computer looks at your\
    \ code and decides to give you one more chance. The computer remembers that Java\
    \ has an advanced feature in which you write a method header without writing a\
    \ method body. When you do this, you get what’s called an abstract method — something\
    \ that I don’t use at all in this book. Anyway, in Figure 5-9, the computer sees\
    \ a header with no body. So the computer says to itself, “I know! Maybe the programmer\
    \ is trying to write an abstract method. The trouble is, an abstract method’s\
    \ header has to have the word abstract in it. I should remind the programmer about\
    \ that.” So the computer offers the add ‘abstract’ modifier quick fix in Figure\
    \ 5-9.\n\nOne way or another, you can’t interpret the error message and the quick\
    \ fixes in Figure 5-9 without reading between the lines. So here are some tips\
    \ to help you decipher murky messages:\n\n+   ✔ Avoid the knee-jerk response.\n\
    +   Some people see the add ‘abstract’ modifier quick fix in Figure 5-9 and wonder\
    \ where they can add a modifier. Unfortunately, this isn’t the right approach.\
    \ If you don’t know what an ‘abstract’ modifier is, then chances are you didn’t\
    \ mean to use an abstract modifier in the first place.\n+   \n+   ✔ Stare at the\
    \ bad line of code for a long, long time.\n+   If you look carefully at the public\
    \ static . . . line in Figure 5-9, eventually you’ll notice that it’s different\
