  md: "![](img/bf4858233d2b2a32ff4e3991860526b3_125_0.png)\n\nAs you type a program\
    \ in Eclipse's editor, Eclipse tries to compile the program. When Eclipse finds\
    \ a compile-time error, the editor usually displays at least three red error markers\
    \ (see Figure 5-6). The marker in the editor's left margin has an X-like marking\
    \ and sometimes a tiny light bulb. The marker in the right margin is a small rectangle.\
    \ The marker in the middle is a jagged red underline.\n\nIf you hover your mouse\
    \ over any of these markers, Eclipse displays a message that attempts to describe\
    \ the nature of the error. If you hover over the jagged line, Eclipse displays\
    \ a message and possibly a list of suggested solutions. (Each suggested solution\
    \ is called a quick fix.) If you right-click the left margin's marker (or control-click\
    \ on a Mac) and choose Quick Fix in the resulting context menu, Eclipse displays\
    \ the suggested solutions. To have Eclipse modify your code automatically (using\
    \ a suggestion from the quick-fix list), either single-click or double-click the\
    \ item in the quick-fix list. (That is, single-click anything that looks like\
    \ a link; double-click anything that doesn't look like a link.)\n\n# Omitting\
    \ punctuation\n\nIn English and in Java, using the; proper! punctuation is important)\n\
    \nTake, for example, the semicolons in Listing 5-1. What happens if you forget\
    \ to type a semicolon?\n\n```\n//The following code is incorrect:\n\n    System.out.println(keyboard.nextLine())\n\
    }\n```\n\nIf you leave off the semicolon, you get the message shown in Figure\
    \ 5-7.\n\n![](img/bf4858233d2b2a32ff4e3991860526b3_125_1.png)\n\nA message like\
    \ the one in Figure 5-8 makes your life much simpler. I don't have to explain\
    \ the message, and you don't have to puzzle over the message's meaning. Just take\
    \ the message insert \";\" to complete Statement on its face value. Insert the\
    \ semicolon between the end of the System.out.println(keyboard.nextLine()) statement\
    \ and whatever code comes after the statement. (For code that's easier to read\
    \ and understand, tack on the semicolon at the end of the System.out.println(keyboard.nextLine())\
    \ statement.)"
