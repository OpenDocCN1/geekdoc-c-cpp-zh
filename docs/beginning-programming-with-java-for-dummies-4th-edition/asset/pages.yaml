  md: "To find out why this happens, follow the computer's actions as it reads the\
    \ input John@BurdBrain.com:\n\n```\nSet symbol to ' ' (a blank space).\n\nIs that\
    \ blank space the same as an @ sign?\nNo, so perform a loop iteration.\n    Input\
    \ the letter 'J'.\n    Print the letter 'J'.\n\nIs that 'J' the same as an @ sign?\n\
    No, so perform a loop iteration.\n    Input the letter 'o'.\n    Print the letter\
    \ 'o'.\n\nIs that 'o' the same as an @ sign?\nNo, so perform a loop iteration.\n\
    \    Input the letter 'h'.\n    Print the letter 'h'.\n\nIs that 'h' the same\
    \ as an @ sign?\nNo, so perform a loop iteration.\n    Input the letter 'n'.\n\
    \    Print the letter 'n'.\n\nIs that 'n' the same as an @ sign? //Here's the\
    \ problem.\nNo, so perform a loop iteration.\n    Input the @ sign.\n    Print\
    \ the @ sign.          //Oops!\n\nIs that @ sign the same as an @ sign?\nYes,\
    \ so stop iterating.\n```\n\nNear the end of the program's run, the computer compares\
    \ the letter n with the @ sign. Because n isn't an @ sign, the computer dives\
    \ right into the loop:\n\n+   ✔ The first statement in the loop reads an @ sign\
    \ from the keyboard.\n+   ✔ The second statement in the loop doesn't check to\
    \ see if it's time to stop printing. Instead, that second statement just marches\
    \ ahead and displays the @ sign.\n\nAfter you've displayed the @ sign, there's\
    \ no going back. You can't change your mind and undisplay the @ sign. So the code\
    \ in Listing 12-3 doesn't quite work."
