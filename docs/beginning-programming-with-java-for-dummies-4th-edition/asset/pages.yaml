- pgno: 427
  md: '# Adding Stuff to Your JavaFX Project


    The fact that this window contains no images, no buttons, no text fields — no
    nothing — comes from the way e(fx)clipse creates your new project. The e(fx)clipse
    tool populates the project with a minimum amount of code. That way, the new project
    is a blank slate — an empty shell to which you add buttons, text fields, or other
    useful components.


    I like empty spaces. When I lived on my own right out of college, my apartment
    had no pictures on the walls. I didn''t want to stare at the same works of art
    day after day. I preferred to fill in the plain white spaces with images from
    my own imagination. So for me, the empty window in Figure 20-8 is soothing.


    But if Figure 20-8 isn''t acquired by New York''s Museum of Modern Art, the window
    is quite useless. (By the way, I''m still waiting to hear back from the museum''s
    curator.) When you create a high-powered GUI program, you start by creating a
    window with buttons and other widgets. Then you add methods to respond to keystrokes,
    button clicks, and other such things.


    The next section contains some code to respond to a user''s button clicks. But
    in this section, you use an XML file to describe a button and a text field:


    +   1. **Follow the instructions in this chapter''s earlier "Creating a bare-bones
    JavaFX project" section.**

    +      Look in Eclipse''s Package Explorer for the new project that you create
    in that section.

    +   2. **Expand the new project''s branch in Eclipse''s Package Explorer.**

    +      Look for the `application` branch, which is inside the `src` branch.

    +   3. **Right-click (or on a Mac, control-click) the application branch. In the
    context menu that appears, choose File→New→Other.**

    +      The Select A Wizard dialog box appears.

    +   4. **In the Select A Wizard dialog box''s tree, expand the JavaFX branch.**

    +   5. **In the JavaFX branch, double-click the New FXM L Document item.**

    +      An FXM L File dialog box appears, as shown in Figure 20-9.

    +   6. **In the dialog box''s Name field, type a name for your new file and then
    click Finish.**

    +      If you''re following my instructions faithfully, name the file Root.

    +      In Figure 20-9, you type the name Root, but e(fx)clipse creates a file
    whose full name is Root.fxml.


    ![](img/bf4858233d2b2a32ff4e3991860526b3_427_0.png)'
