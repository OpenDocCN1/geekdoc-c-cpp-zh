- pgno: 98
  md: "# Identifiers that you or I can define\n\nI like the name Suzanne, but if you\
    \ don’t like traditional names, then make up a brand new name. You’re having a\
    \ new baby. Call her “Deneen” or “Chrisanta.” Name him “Belton” or “Merk.”\n\n\
    A name is a word that identifies something, so I’ll stop calling these things\
    \ names and start calling them identifiers. In computer programming, an identifier\
    \ is a noun of some kind. An identifier refers to a value, a part of a program,\
    \ a certain kind structure, or any number of things.\n\nListing 4-1 has two identifiers\
    \ that you or I can define on our own. They’re the made-up words ThingsILike and\
    \ args.\n\n```\nclass ThingsILike {\n    public static void main(String args[])\
    \ {\n\n```\n\nJust as the names Suzanne and Chrisanta have no special meaning\
    \ in English, so the names ThingsILike and args have no special meaning in Java.\
    \ In Listing 4-1, I use ThingsILike for the name of my program, but I could also\
    \ have used a name like GooseGrease, Enzyme, or Kalamazoo. I have to put (String\
    \ someName[]) in my program, but I could use (String args[]), (String commandLineArguments[]),\
    \ or (String cheese[]).\n\n![](img/bf4858233d2b2a32ff4e3991860526b3_98_0.png)\n\
    \nTIP\nDo as I say, not as I do. Make up sensible, informative names for the things\
    \ in your Java programs. Names like GooseGrease are cute, but they don’t help\
    \ you keep track of your program-writing strategy.\n\n![](img/bf4858233d2b2a32ff4e3991860526b3_98_1.png)\n\
    \nREMEMBER\nWhen I name my Java program, I can use ThingsILike or GooseGrease,\
    \ but I can’t use the word public. Words like class, public, static, and void\
    \ are keywords in Java.\n\nThe args in (String args[]) holds anything extra that\
    \ you type when you issue the command to run a Java program. For example, if you\
    \ get the program to run by typing java ThingsILike won too 3, then args stores\
    \ the extra values won, too, and 3. As a beginning programmer, you don’t need\
    \ to think about this feature of Java. Just paste (String args[]) into each of\
    \ your programs.\n\n# Identifiers with agreed-upon meanings\n\nMany people are\
    \ named Suzanne, but only one country is named Canada. That’s because there’s\
    \ a standard, well-known meaning for the word “Canada.” It’s the country with\
    \ a red maple leaf on its flag. If you start your own country, you should avoid\
    \ naming it Canada because naming it Canada would just confuse everyone. (I know,\
    \ a town in Kentucky is named Canada, but that doesn’t count. Remember, you should\
    \ ignore exceptions like this.)"
  merge: -1
  img_proc: true
- pgno: 99
  md: "Most programming languages have identifiers with agreed-upon meanings. In Java,\
    \ almost all these identifiers are defined in the Java API. Listing 4-1 has five\
    \ such identifiers. They're the words main, String, System, out, and println:\n\
    \n```\npublic static void main(String args[]) {\n    System.out.println(\"Chocolate,\
    \ royalties, sleep\");\n}\n```\n\nHere's a quick rundown on the meaning of each\
    \ of these names (and more detailed descriptions appear throughout this book):\n\
    \n+   - **main:** The main starting point for execution in every Java program.\n\
    +   - **String:** A bunch of text; a row of characters, one after another.\n+\
    \   - **System:** A canned program in the Java API. This program accesses some\
    \ features of your computer that are outside the direct control of the Java Virtual\
    \ Machine (JVM).\n+   - **out:** The place where a text-based program displays\
    \ its text. (For a program running in Eclipse, the word out represents the Console\
    \ view. To read more about text-based programs, check the first several paragraphs\
    \ of Chapter 3.)\n+   - **println:** Display text on your computer screen.\n\n\
    ![](img/bf4858233d2b2a32ff4e3991860526b3_99_0.png)\n\nThe name println comes from\
    \ the words \"print a line.\" If you were allowed to write the name in uppercase\
    \ letters, it would be PRINTLN, with a letter L near the end of the word. When\
    \ the computer executes println, the computer puts some text in Eclipse's Console\
    \ view and then immediately moves to the beginning of the next line in preparation\
    \ for whatever else will appear in the Console view.\n\n![](img/bf4858233d2b2a32ff4e3991860526b3_99_1.png)\n\
    \nStrictly speaking, the meanings of the identifiers in the Java API aren't cast\
    \ in stone. Although you can make up your own meanings for words like System or\
    \ println, doing so isn't a good idea — because you'd confuse the dickens out\
    \ of other programmers, who are used to the standard API meanings for these familiar\
    \ identifier names.\n\n# Literals\n\nA literal is a chunk of text that looks like\
    \ whatever value it represents. In Suzanne's sentence (refer to Figure 4-2), \"\
    eh\" is a literal because \"eh\" refers to the word \"eh.\"\n\nProgramming languages\
    \ have literals, too. For example, in Listing 4-1, the stuff in quotes is a literal:\n\
    \n```\nSystem.out.println(\"Chocolate, royalties, sleep\");\n```"
  merge: -1
  img_proc: true
- pgno: 100
  md: "When you run the ThingsILike program, you see the words Chocolate, royalties,\
    \ sleep on the screen. In Listing 4-1, the text \"Chocolate, royalties, sleep\"\
    \ refers to these words, exactly as they appear on the screen (minus the quotation\
    \ marks).\n\nMost of the numbers that you use in computer programs are literals.\
    \ If you put the statement\n\n```\nmySalary = 1000000.00;\n```\n\nin a computer\
    \ program, then 1000000.00 is a literal. It stands for the number 1000000.00 (one\
    \ million).\n\nIf you don't enjoy counting digits, you can put the following statement\
    \ in your Java 7 program:\n\n```\nmySalary = 1_000_000.00;\n```\n\nStarting with\
    \ Java 7, numbers with underscores are permissible as literals.\n\nIn versions\
    \ of Java before Java 7, you cannot use numbers such as 1_000_000.00 in your code.\n\
    \n![](img/bf4858233d2b2a32ff4e3991860526b3_100_0.png)\n\n![](img/bf4858233d2b2a32ff4e3991860526b3_100_1.png)\n\
    \nDifferent countries use different number separators and different number formats.\
    \ For example, in the United States, you write 1,234,567,890.55. In France, you\
    \ write 1234567890,55. In India, you group digits in sets of two and three. You\
    \ can't put a statement like mySalary = 1,000,000.00 in your Java program. Java's\
    \ numeric literals don't have any commas in them. But you can write mySalary =\
    \ 10_00_000.00 for easy-to-read programming in India. And for a program's output,\
    \ you can display numbers like 1234567890,55 using Java's Locale and NumberFormat\
    \ classes. (For more on Locale and NumberFormat, check out Chapter 18.)\n\n# Punctuation\n\
    \nA typical computer program has lots of punctuation. For example, consider the\
    \ program in Listing 4-1:\n\n```\nclass ThingsILike {\n    public static void\
    \ main(String args[]) {\n        System.out.println(\"Chocolate, royalties, sleep\"\
    );\n    }\n}\n```\n\nEach bracket, each brace, each squiggle of any kind plays\
    \ a role in making the program meaningful."
  merge: -1
  img_proc: true
- pgno: 101
  md: "In English, you write all the way across one line and then you wrap your text\
    \ to the start of the next line. In programming, you seldom work this way. Instead,\
    \ the code's punctuation guides the indenting of certain lines. The indentation\
    \ shows which parts of the program are subordinate to which other parts. It's\
    \ as though, in English, you wrote Suzanne's sentence like this:\n\nSuzanne says\
    \ \"eh\" because\n'\n    as you know\n'\nshe lives in Canada.\n\nThe diagrams\
    \ in Figures 4-3 and 4-4 show you how parts of the ThingsILike program are contained\
    \ inside other parts. Notice how a pair of curly braces acts like a box. To make\
    \ the program's structure visible at a glance, you indent all the stuff inside\
    \ of each box.\n\nFigure 4-3: A pair of curly braces acts like a box.\n\n![](img/bf4858233d2b2a32ff4e3991860526b3_101_0.png)\n\
    \nFigure 4-4: The ideas in a computer program are nested inside one another.\n\
    \n![](img/bf4858233d2b2a32ff4e3991860526b3_101_1.png)\n\nREMEMBER I can't emphasize\
    \ this point enough. If you don't indent your code or if you indent but you don't\
    \ do it carefully, then your code still compiles and runs correctly. But this\
    \ successful run gives you a false sense of confidence. The minute you try to\
    \ update some poorly indented code, you become hopelessly confused. So take my\
    \ advice: Keep your code carefully indented at every step in the process. Make\
    \ your indentation precise, whether you're scratching out a quick test program\
    \ or writing code for a billionaire customer.\n\nTIP Eclipse can indent your code\
    \ automatically for you. Select the .java file whose code you want to indent.\
    \ Then, in Eclipse's main menu, choose Source→Format. Eclipse rearranges your\
    \ lines in the editor, indenting things that should be indented and generally\
    \ making your code look good."
  merge: -1
  img_proc: true
- pgno: 102
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 103
  md: "**Javadoc comments:** A special Javadoc comment is any traditional comment\
    \ that begins with an extra asterisk.\n\n```\n/**\n * Print a String and then\
    \ terminate the line.\n */\n```\n\nThis is a cool Java feature. The software that\
    \ you can download from java.sun.com includes a little program called javadoc.\
    \ The javadoc program looks for these special comments in your code. The program\
    \ uses these comments to create a brand new web page — a customized documentation\
    \ page for your code. To find out more about turning Javadoc comments into web\
    \ pages, visit this book's website (http://allmycode.com/BeginProg).\n\n# Understanding\
    \ a Simple Java Program\n\nThe following sections present, explain, analyze, dissect,\
    \ and otherwise demystify the Java program in Listing 4-1.\n\n# What is a method?\n\
    \nYou're working as an auto mechanic in an upscale garage. Your boss, who's always\
    \ in a hurry and has a habit of running words together, says, \"FixTheAlternator.\"\
    \ Mentally, you run through a list of tasks. \"Drive the car into the bay, lift\
    \ the hood, get a wrench, loosen the alternator belt,\" and so on. Three things\
    \ are going on here:\n\n+   - **You have a name for the thing you're supposed\
    \ to do.** The name is FixTheAlternator.\n+   - **In your mind, you have a list\
    \ of tasks associated with the name FixThe Alternator.** The list includes \"\
    Drive the car into the bay, lift the hood, get a wrench, loosen the alternator\
    \ belt,\" and so on.\n+   - **You have a grumpy boss who's telling you to do all\
    \ this work.** Your boss gets you working by saying, \"FixTheAlternator.\" In\
    \ other words, your boss gets you working by saying the name of the thing you're\
    \ supposed to do.\n\nIn this scenario, using the word method wouldn't be a big\
    \ stretch. You have a method for doing something with an alternator. Your boss\
    \ calls that method into action, and you respond by doing all the things in the\
    \ list of instructions that you've associated with the method."
  merge: -1
  img_proc: true
- pgno: 104
  md: "# Java methods\n\nIf you believe all that stuff in the preceding section, then\
    \ you're ready to read about Java methods. In Java, a method is a list of things\
    \ to do. Every method has a name, and you tell the computer to do the things in\
    \ the list by using the method's name in your program.\n\nI've never written a\
    \ program to get a robot to fix an alternator. But, if I were to, the program\
    \ might include a method named FixTheAlternator. The list of instructions in my\
    \ FixTheAlternator method would look something like the text in Listing 4-2.\n\
    \n# Listing 4-2: A Method Declaration\n\n```\nvoid FixTheAlternator() {\n  DriveInto(car,\
    \ bay);\n  Lift(hood);\n  Get(wrench);\n  Loosen(alternatorBelt);\n  ...\n}\n\
    ```\n\nSomewhere else in my Java code (somewhere outside of Listing 4-2), I need\
    \ an instruction to call my FixTheAlternator method into action. The instruction\
    \ to call the FixTheAlternator method into action may look like the line in Listing\
    \ 4-3.\n\n# Listing 4-3: Calling a Method\n\n```\nFixTheAlternator(junkyOldFord);\n\
    ```\n\n![](img/bf4858233d2b2a32ff4e3991860526b3_104_0.png)\n\nDon't scrutinize\
    \ Listings 4-2 and 4-3 too carefully. All the lines of code in Listings 4-2 and\
    \ 4-3 are fakes! I made up this code so that it looks a lot like real Java code,\
    \ but it's not real. What's more important, the code in Listings 4-2 and 4-3 isn't\
    \ meant to illustrate all the rules about Java. So if you have a grain of salt\
    \ handy, take it with Listings 4-2 and 4-3.\n\n![](img/bf4858233d2b2a32ff4e3991860526b3_104_1.png)\n\
    \nAlmost every computer programming language has something akin to Java's methods.\
    \ If you've worked with other languages, you may remember things like subprograms,\
    \ procedures, functions, subroutines, Sub procedures, or PERFORM statements. Whatever\
    \ you call it in your favorite programming language, a method is a bunch of instructions\
    \ collected together and given a new name."
  merge: -1
  img_proc: true
- pgno: 105
  md: '# The declaration, the header, and the call


    If you have a basic understanding of what a method is and how it works (see preceding
    section), you can dig a little deeper into some useful terminology:


    +   - If I''m being lazy, I refer to the code in Listing 4-2 as a *method*. If
