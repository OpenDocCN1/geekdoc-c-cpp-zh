  md: '# Another Way to Think about Classes


    When you start learning object-oriented programming, you may think this class
    idea is a big hoax. Some geeks in Silicon Valley had nothing better to do, so
    they went to a bar and made up some confusing gibberish about classes. They don''t
    know what it means, but they have fun watching people struggle to understand it.


    Well, that''s not what classes are all about. Classes are serious stuff. What''s
    more, classes are useful. Many reputable studies have shown that classes and object-oriented
    programming save time and money.


    Even so, the notion of a class can be very elusive. Even experienced programmers
    — the ones who are new to object-oriented programming — have trouble understanding
    how an object differs from a class.


    # Classes, objects, and tables


    Because classes can be so mysterious, I''ll expand your understanding with another
    analogy. Figure 17-7 has a table of three purchases. The table''s title consists
    of one word (the word "Purchase"), and the table has three column headings — the
    words "amount," "taxable," and "total." Well, the code in Listing 17-2 has the
    same stuff — Purchase, amount, taxable, and total. So in Figure 17-7, think of
    the top part of the table (the title and column headings) as a class. Like the
    code in Listing 17-2, this top part of the table tells us what it means to be
    a Purchase. (It means having an amount value, a taxable value, and a total value.)


    Figure 17-7:

    A table of purchases.


    ![](img/bf4858233d2b2a32ff4e3991860526b3_359_0.png)


    A class is like the top part of a table. And what about an object? Well, an object
    is like a row of a table. For example, with the code in Listing 17-5 and the input
    in Figure 17-5, I create three objects (three instances of the Purchase class).
    The first object has amount value 20.00, taxable value true, and total value 21.00.
    In the table, the first row has these three values — 20.00, true, and 21.00, as
    shown in Figure 17-8'
