- pgno: 252
  md: "The computer returns to the top of the while statement and checks to see if\
    \ die1 + die2 != 7 && die1 + die2 != 11 is still true. Lo and behold! This condition\
    \ has become false! (See Figure 12-4.) The computer takes the false path in Figure\
    \ 12-3.\n\nThe computer leaps to the statements after the loop. The computer displays\
    \ Rolled 7 and ends its run of the program.\n\nFigure 12-4:\nLook! I rolled a\
    \ seven!\n\n![](img/bf4858233d2b2a32ff4e3991860526b3_252_0.png)\n\n# Statements\
    \ and blocks (plagiarizing my own sentences from Chapter 9)\n\nJava's while statements\
    \ have a lot in common with if statements. Like an if statement, a while statement\
    \ is a compound statement — that is, a while statement includes other statements\
    \ within it. Also, both if statements and while statements typically include blocks\
    \ of statements. When you surround a bunch of statements with curly braces, you\
    \ get what's called a block, and a block behaves, in all respects, like a single\
    \ statement.\n\n```\n{\n    die1=myRandom.nextInt(6)+1;\n    die2=myRandom.nextInt(6)+1;\n\
    \n    out.print(die1);\n    out.print(\" \");\n    out.println(die2);\n}\n```\n\
    \nIn a typical while statement, you want the computer to repeat several smaller\
    \ statements over and over again. To repeat several smaller statements, you combine\
    \ those statements into one big statement. To do this, you make a block using\
    \ curly braces.\n\nIn Listing 12-1, the block\n\nis a single statement. It's a\
    \ statement that has, within it, five smaller statements. So this big block (this\
    \ single statement) serves as one big statement inside the while statement in\
    \ Listing 12-1.\n\nThat's the story about while statements and blocks. To find\
    \ out how this stuff applies to if statements, see the \"Statements and blocks\"\
    \ sidebar near the end of Chapter 9."
