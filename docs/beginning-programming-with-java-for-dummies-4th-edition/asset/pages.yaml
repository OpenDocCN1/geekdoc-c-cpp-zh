    \n**Figure 18-5:** At last, Joe User can log in.\n\n# The truth about classes\
    \ and methods\n\nThe magic in Listing 18-5 is the use of a method named equals.\
    \ I have two ways to explain the equals method—a simple way, and a more detailed\
    \ way. First, here’s the simple way: The equals method compares the characters\
    \ in one string with the characters in another. If the characters are the same,\
    \ the condition inside the if statement is true. That’s all there is to it.\n\n\
    ![](img/bf4858233d2b2a32ff4e3991860526b3_370_1.png)\n\nDon’t use a double equal\
    \ sign to compare two String objects. Instead, use one of the object’s equals\
    \ methods.\n\nFor a more detailed understanding of the equals method, flip to\
    \ Chapter 17 and take a look at Figures 17-7 and 17-8. Those figures illustrate\
    \ the similarities between classes, objects, and the parts of a table. In the\
    \ figures, each row represents a purchase, and each column represents a feature\
    \ that purchases possess.\n\nYou can observe the same similarities for any class,\
    \ including Java’s String class. In fact, what Figure 17-7 does for purchases,\
