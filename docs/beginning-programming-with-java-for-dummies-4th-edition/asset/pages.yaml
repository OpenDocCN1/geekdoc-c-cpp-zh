- pgno: 330
  md: "# ## Grabbing input here and there\n\nListing 16-2 illustrates some pithy issues\
    \ surrounding the input of data. For one thing, the program gets input from both\
    \ the keyboard and a disk file. (The program gets a room number from the keyboard.\
    \ Then the program gets the number of guests in that room from the occupancy file.)\
    \ To make this happen, Listing 16-2 sports two Scanner declarations — one to declare\
    \ keyboard, and a second to declare diskScanner.\n\nLater in the program, the\
    \ call `keyboard.nextInt` reads from the keyboard, and `diskScanner.nextInt` reads\
    \ from the file. Within the program, you can read from the keyboard or the disk\
    \ as many times as you want. You can even intermingle the calls — reading once\
    \ from the keyboard, then three times from the disk, then twice from the keyboard,\
    \ and so on. All you have to do is remember to use keyboard whenever you read\
    \ from the keyboard and use diskScanner whenever you read from the disk.\n\nAnother\
    \ interesting tidbit in Listing 16-2 concerns the occupancy file. Many of this\
    \ chapter’s examples read from an occupancy file, and I use the same data in each\
    \ of these examples. (I use the data shown in Figure 16-1.) To run an example,\
    \ I copy the occupancy file from one Eclipse project to another.\n\nthe code in\
    \ Listing 16-2. I go to my old `16-01` project in Eclipse’s Package Explorer.\
    \ I right-click the occupancy file in the `16-01` project and select Copy from\
    \ the context menu. Then I right-click the new `16-02` project branch and select\
    \ Paste from the context menu. As usual, Mac users do control-click instead of\
    \ right-click.)\n\nIn real life, having several copies of a data file can be dangerous.\
    \ You can modify one copy and then accidentally read out-of-date data from a different\
    \ copy. Sure, you should have backup copies, but you should have only one “master”\
    \ copy — the copy from which all programs get the same input.\n\nSo in a real-life\
    \ program, you don’t copy the occupancy file from one project to another. What\
    \ do you do instead? You put an occupancy file in one place on your hard drive\
    \ and then have each program refer to the file using the names of the file’s directories.\
    \ For example, if your occupancy file is in the `c:\\oct\\22` directory, you write\n\
    \n```\nScanner diskScanner =\n    new Scanner(new File(\n        \"c:\\\\oct\\\
    \\22\\\\occupancy\"));\n```\n\nA sidebar in Chapter 13 has more details about\
    \ filenames and double backslashes.\n\nAs you stare at the runs in Figure 16-3,\
    \ it’s important to remember the unusual numbering of rooms. Room 3 has two guests\
    \ because Room 3 is the fourth room in the occupancy file of Figure 16-1. That’s\
    \ because the motel’s rooms are numbered 0 through 9.\n\n# ## Using all kinds\
    \ of conditions in a for loop\n\nLook at the run in Figure 16-3 and notice the\
    \ program’s awful behavior when the user mistakenly asks about a nonexistent room.\
    \ The motel has no Room 10. If you ask for the number of guests in Room 10, the\
    \ program tries to read more numbers than the occupancy file contains. This unfortunate\
    \ attempt causes a `NoSuchElementException`."
