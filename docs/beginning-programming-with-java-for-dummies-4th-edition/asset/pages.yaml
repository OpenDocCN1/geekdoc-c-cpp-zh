  md: "![](img/bf4858233d2b2a32ff4e3991860526b3_143_0.png)\n\nThis paragraph deals\
    \ with a really picky point, so skip it if you're not in the mood. People often\
    \ use the phrase \"decimal number\" to describe a number with digits to the right\
    \ of the decimal point. The problem is, the syllable \"dec\" stands for the number\
    \ 10, so the word \"decimal\" implies a base-10 representation. Because computers\
    \ store base-2 (not base-10) representations, the word \"decimal\" to describe\
    \ such a number is a misnomer. But in this book, I just can't help myself. I'm\
    \ calling them \"decimal numbers,\" whether the techies like it or not.\n\n# Reading\
    \ Decimal Numbers\nfrom the Keyboard\n\nI don't believe it! SnitSoft is having\
