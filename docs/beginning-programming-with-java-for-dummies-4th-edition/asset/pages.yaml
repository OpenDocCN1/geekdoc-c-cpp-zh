  md: '# Working on the problem


    You learn from your mistakes. The problem with Listing 12-3 is that, between reading
    and writing a character, the program doesn''t check for an @ sign. Instead of
    doing "Test, Input, Print," it should do "Input, Test, Print." That is, instead
    of doing this:


    ```

    Is that ''o'' the same as an @ sign?

    No, so perform a loop iteration.

    Input the letter ''h''.

    Print the letter ''h''.


    Is that ''h'' the same as an @ sign?

    No, so perform a loop iteration.

    Input the letter ''n''.

    Print the letter ''n''.


    Is that ''n'' the same as an @ sign? //Here''s the problem.

    No, so perform a loop iteration.

    Input the @ sign.

    Print the @ sign. //Oops!

    ```


    the program should do this:


    ```

    Input the letter ''o''.

    Is that ''o'' the same as an @ sign?

    No, so perform a loop iteration.

    Print the letter ''o''.


    Input the letter ''n''.

    Is that ''n'' the same as an @ sign?

    No, so perform a loop iteration.

    Print the letter ''n''.


    Input the @ sign.

    Is that @ sign the same as an @ sign?

    Yes, so stop iterating.

    ```


    This cycle is shown in Figure 12-10.


    Figure 12-10:

    What the program needs to do.


    ![](img/bf4858233d2b2a32ff4e3991860526b3_263_0.png)'
