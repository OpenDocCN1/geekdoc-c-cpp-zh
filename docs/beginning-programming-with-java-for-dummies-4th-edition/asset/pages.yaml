- pgno: 29
  md: '# # From Your Mind to the Computer’s Processor


    When you create a new computer program, you go through a multistep process. The
    process involves three important tools.


    +   - **Compiler:** A compiler translates your code into computer-friendly (human-unfriendly)
    instructions.

    +   - **Virtual machine:** A virtual machine steps through the computer-friendly
    instructions.

    +   - **Application programming interface:** An application programming interface
    contains useful prewritten code.


    The next three sections describe each of the three tools.


    # ## Translating your code


    You may have heard that computers deal with zeros and ones. That’s certainly true,
    but what does it mean? Well, for starters, computer circuits don’t deal directly
    with letters of the alphabet. When you see the word *Start* on your computer screen,
    the computer stores the word internally as `01010011 01110100 01100001 01110010
    01110100`. That feeling you get of seeing a friendly-looking five-letter word
    is your interpretation of the computer screen’s pixels, and nothing more. Computers
    break everything down into very low-level, unfriendly sequences of zeros and ones
    and then put things back together so that humans can deal with the results.


    So what happens when you write a computer program? Well, the program has to get
    translated into zeros and ones. The official name for the translation process
    is *compilation*. Without compilation, the computer can’t run your program.


    I compiled the code in Listing 1-1. Then I did some harmless hacking to help me
    see the resulting zeros and ones. What I saw was the mishmash in Figure 1-1.


    The compiled mumbo jumbo in Figure 1-1 goes by many different names:


    +   - Most Java programmers call it *bytecode*.

    +   - I often call it a *.class file*. That’s because, in Java, the bytecode gets
    stored in files named `SomethingOrOther.class`.

    +   - To emphasize the difference, Java programmers call Listing 1-1 the *source
    code* and refer to the zeros and ones in Figure 1-1 as *object code*.'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'Figure 1-1:

    My computer understands these zeros and ones, but I don''t.


    ![](img/bf4858233d2b2a32ff4e3991860526b3_30_0.png)


    To visualize the relationship between source code and object code, see Figure
    1-2. You can write source code and then get the computer to create object code
    from your source code. To create object code, the computer uses a special software
    tool called a compiler.


    Figure 1-2:

    The computer compiles source code to create object code.


    ![](img/bf4858233d2b2a32ff4e3991860526b3_30_1.png)


    ```

    if (columnNumber > 60)...

    ```


    Your computer''s hard drive may have a file named javac or javac.exe. This file
    contains that special software tool — the compiler. (Hey, how about that? The
    word javac stands for "Java compiler!") As a Java programmer, you often tell your
    computer to build some new object code. Your computer fulfills this wish by going
    behind the scenes and running the instructions in the javac file.


    # Running code


    Several years ago, I spent a week in Copenhagen. I hung out with a friend who
    spoke both Danish and English fluently. As we chatted in the public park, I vaguely
    noticed some kids orbiting around us. I don''t speak a word of Danish, so I assumed
    that the kids were talking about ordinary kid stuff.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# What is bytecode, anyway?


    Look at Listing 1-1 and at the listing''s translation into bytecode in Figure
    1-1. You may be tempted to think that a bytecode file is just a cryptogram — substituting
    zeros and ones for the letters in words like if and else. But it doesn''t work
    that way at all. In fact, the most important part of a bytecode file is the encoding
    of a program''s logic.


    The zeros and ones in Figure 1-1 describe the flow of data from one part of your
    computer to another. I illustrate this flow in the following figure. But remember,
    this figure is just an illustration. Your computer doesn''t look at this particular
    figure, or at anything like it. Instead, your computer reads a bunch of zeros
    and ones to decide what to do next.


    ![](img/bf4858233d2b2a32ff4e3991860526b3_31_0.png)


    Don''t bother to absorb the details in my attempt at graphical representation
    in the figure. It''s not worth your time. The thing you should glean from my mix
    of text, boxes, and arrows is that bytecode (the stuff in a .class file) contains
    a complete description of the operations that the computer is to perform. When
    you write a


    computer program, your source code describes an overall strategy — a big picture.
    The compiled bytecode turns the overall strategy into hundreds of tiny, step-by-step
    details. When the computer "runs your program," the computer examines this bytecode
    and carries out each of the little step-by-step details.'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'Then my friend told me that the kids weren''t speaking Danish. "What language
    are they speaking?" I asked.


    > "They''re talking gibberish," she said. "It''s just nonsense syllables. They
    don''t understand English, so they''re imitating you."


    Now to return to present-day matters. I look at the stuff in Figure 1-1, and I''m
    tempted to make fun of the way my computer talks. But then I''d be just like the
    kids in Copenhagen. What''s meaningless to me can make perfect sense to my computer.
    When the zeros and ones in Figure 1-1 percolate through my computer''s circuits,
    the computer "thinks" the thoughts shown in Figure 1-3.


    ![](img/bf4858233d2b2a32ff4e3991860526b3_32_0.png)


    Everyone knows that computers don''t think, but a computer can carry out the instructions
    depicted in Figure 1-3. With many programming languages (languages like C++ and
    COBOL, for example), a computer does exactly what I''m describing. A computer
    gobbles up some object code and does whatever the object code says to do.'
  merge: -1
  img_proc: true
