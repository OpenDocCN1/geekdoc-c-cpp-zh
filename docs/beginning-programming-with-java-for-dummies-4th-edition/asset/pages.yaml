- pgno: 193
  md: "You see a fork in the road. You see two signs — one pointing to the right;\
    \ the other pointing to the left. One sign reads, “Storing words or sentences?\
    \ True.” The other sign reads, “Storing words or sentences? False.” You evaluate\
    \ the words-or-sentences situation and march on, veering right or left depending\
    \ on your software situation. A diagram of this story is shown in Figure 9-1.\n\
    \n![](img/bf4858233d2b2a32ff4e3991860526b3_193_0.png)\n\nLife is filled with forks\
    \ in the road. Take an ordinary set of directions for heating up a frozen snack:\n\
    \n+   ✓ **Microwave cooking directions:**\n+   \n+      Place on microwave-safe\
    \ plate.\n+   \n+      Microwave on high for 2 minutes.\n+   \n+      Turn product.\n\
    +   \n+      Microwave on high for 2 more minutes.\n+   \n+   ✓ **Conventional\
    \ oven directions:**\n+   \n+      Preheat oven to 350 degrees.\n+   \n+     \
    \ Place product on baking sheet.\n+   \n+      Bake for 25 minutes.\n\nAgain,\
    \ you choose between alternatives. If you use a microwave oven, do this. Otherwise,\
    \ do that."
