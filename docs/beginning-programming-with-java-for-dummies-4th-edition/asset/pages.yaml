- pgno: 237
  md: "# Picky details about the switch statement\n\nA switch statement can take the\
    \ following form:\n\n```\nswitch (Expression) {\ncase FirstValue:\n    Statements\n\
    \ncase SecondValue:\n    MoreStatements\n\n// ... more cases...\n\ndefault:\n\
    \    EvenMoreStatements\n}\n```\n\nHere are some tidbits about switch statements:\n\
    \nThe Expression doesn't have to have an int value. It can be char, byte, short,\
    \ or int.\n\nFor example, the following code works in Java 5 and later:\n\n```\n\
    char letterGrade;\nletterGrade =\n    keyboard.findWithinHorizon(\".\",0).charAt(0);\n\
    \nswitch (letterGrade) {\ncase 'A':\n    System.out.println(\"Excellent\");\n\
    \    break;\n\ncase 'B':\n    System.out.println(\"Good\");\n    break;\n\ncase\
    \ 'C':\n    System.out.println(\"Average\");\n    break;\n}\n```\n\nIn fact, if\
    \ you avoid using the Scanner class and its findWithinHorizon method, this bullet's\
    \ switch statement works with all versions of Java — old and new."
  merge: -1
  img_proc: true
- pgno: 238
  md: "If you use Java 7 or later, the Expression can be a String. For example, the\
    \ following code doesn't work with Java 6, but works well in Java 7:\n\n```\n\
    String description;\ndescription = keyboard.next();\n\nswitch (description) {\n\
    case \"Excellent\":\n    System.out.println('A');\n    break;\n\ncase \"Good\"\
    :\n    System.out.println('B');\n    break;\n\ncase \"Average\":\n    System.out.println('C');\n\
    \    break;\n}\n```\n\nThe Expression doesn't have to be a single variable. It\
    \ can be any expression of type char, byte, short, or int. For example, you can\
    \ simulate the rolling of two dice with the following code:\n\n```\nint die1,\
    \ die2;\n\ndie1 = myRandom.nextInt(6) + 1;\ndie2 = myRandom.nextInt(6) + 1;\n\n\
    switch (die1 + die2) {\n    //...etc\n```\n\nThe cases in a switch statement don't\
    \ have to be in order. Here's some acceptable code:\n\n```\nswitch (randomNumber)\
    \ {\ncase 2:\n    System.out.println(\"No, and don't ask again.\");\n    break;\n\
    \ncase 1:\n    System.out.println(\"Yes. Isn't it obvious?\");\n    break;\n\n\
    case 3:\n    System.out.print(\"Yessir, yessir!\");\n    System.out.println(\"\
    \ Three bags full.\");\n    break;\n\n//...etc\n```"
  merge: -1
  img_proc: true
- pgno: 239
  md: "This mixing of cases may slow you down when you're trying to read a program,\
    \ but it's legal nonetheless.\n\nYou don't need a case for each expected value\
    \ of the Expression. You can leave some expected values to the default. Here's\
    \ an example:\n\n```\nswitch (randomNumber) {\n  case 1:\n    System.out.println(\"\
    Yes. Isn't it obvious?\");\n    break;\n\n  case 5:\n    System.out.println(\"\
    No chance, Lance.\");\n    break;\n\n  case 7:\n    System.out.print(\"Yes, but\
    \ only if\");\n    System.out.println(\" you're nice to me.\");\n    break;\n\n\
    \  case 10:\n    System.out.print(\"No, not until\");\n    System.out.println(\"\
    \ Nell squeezes Rover.\");\n    break;\n\n  default:\n    System.out.print(\"\
    Sorry,\");\n    System.out.println(\" I just can't decide.\");\n    break;\n}\n\
    ```\n\nThe default clause is optional.\n\n```\nswitch (randomNumber) {\n  case\
    \ 1:\n    System.out.println(\"Yes. Isn't it obvious?\");\n    break;\n\n  case\
    \ 2:\n    System.out.println(\"No, and don't ask again.\");\n    break;\n\n  case\
    \ 3:\n    System.out.print(\"I'm too tired.\");\n    System.out.println(\" Go\
    \ somebody else.\");\n    break;\n}\nSystem.out.println(\"Goodbye\");\n```\n\n\
    If you have no default clause, and a value that's not covered by any of the cases\
    \ comes up, the switch statement does nothing. For example, if randomNumber is\
    \ 4, the preceding code displays Goodbye, and nothing else."
  merge: -1
  img_proc: true
- pgno: 240
  md: "In some ways, if statements are more versatile than switch statements. For\
    \ example, you can't use a condition in a switch statement's Expression:\n\n```\n\
    //You can't do this:\nswitch (age >= 12 && age < 65)\n```\n\nYou can't use a condition\
    \ as a case value, either:\n\n```\n//You can't do this:\nswitch (age) {\ncase\
    \ age <= 12: //...etc.\n```\n\n# To break or not to break\n\nAt one time or another,\
    \ every Java programmer forgets to use break statements. At first, the resulting\
    \ output is confusing, but then the programmer remembers fall-through. The term\
    \ fall-through describes what happens when you end a case without a break statement.\
    \ What happens is that execution of the code falls right through to the next case\
    \ in line. Execution keeps falling through until you eventually reach a break\
    \ statement or the end of the entire switch statement.\n\nIf you don't believe\
    \ me, just look at Listing 11-2. This listing's code has a switch statement gone\
    \ bad.\n\n# Listing 11-2: Please, Gimme a Break!\n\n```\n/*\n * This isn't good\
