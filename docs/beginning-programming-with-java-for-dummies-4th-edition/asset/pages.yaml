- pgno: 18
  md: '# What You Don’t Have to Read


    Pick the first chapter or section that has material you don’t already know and
    start reading there. Of course, you may hate making decisions as much as I do.
    If so, here are some guidelines you can follow:


    +   - If you already know what computer programming is all about, skip the first
    half of Chapter 1. Believe me, I won’t mind.

    +   - If you’re required to use a development environment other than Eclipse,
    you can skip Chapter 2. This applies if you plan to use NetBeans, IntelliJ IDEA,
    or a number of other development environments.

    +   - Most of this book’s examples require Java 5.0 or later, and some of the
    examples require Java 7 or later. So make sure that your system uses Java 7 or
    later. If you’re not sure about your computer’s Java version or if you have leeway
    in choosing a development environment, your safest move is to read Chapter 3.

    +   - If you’ve already done a little computer programming, be prepared to skim
    Chapters 6 through 8. Dive fully into Chapter 9 and see whether it feels comfortable.
    (If so, then read on. If not, re-skim Chapters 6, 7, and 8.)

    +   - If you feel comfortable writing programs in a language other than Java,
    this book isn’t for you. Keep this book as a memento and buy my *Java For Dummies*,
    6th Edition, also published by John Wiley & Sons, Inc.


    If you want to skip the sidebars and the Technical Stuff icons, please do. In
    fact, if you want to skip anything at all, feel free.


    # Foolish Assumptions


    In this book, I make a few assumptions about you, the reader. If one of these
    assumptions is incorrect, you’re probably okay. If all these assumptions are incorrect
    . . . well, buy the book anyway.


    +   - **I assume that you have access to a computer.** Here’s good news. You can
    run the code in this book on almost any computer. The only computers you can’t
    use to run this code are ancient things that are more than eight years old (give
    or take a few years). You can run the latest version of Java on Windows, Macintosh,
    and Linux computers.

    +   - **I assume that you can navigate through your computer’s common menus and
    dialog boxes.** You don’t have to be a Windows, Linux, or Macintosh power user,
    but you should be able to start a program, find a file, put a file into a certain
    directory . . . that sort of thing. Most of the time, when you practice the stuff
    in this book, you’re typing code on your keyboard, not pointing and clicking your
    mouse.'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'On those rare occasions when you need to drag and drop, cut and paste, or plug
    and play, I guide you carefully through the steps. But your computer may be configured
    in any of several billion ways, and my instructions may not quite fit your special
    situation. So when you reach one of these platform-specific tasks, try following
    the steps in this book. If the steps don''t quite fit, send me an e-mail message,
    or consult a book with instructions tailored to your system.


    ✓ **I assume that you can think logically.** That''s all there is to computer
    programming — thinking logically. If you can think logically, you''ve got it made.
    If you don''t believe that you can think logically, read on. You may be pleasantly
    surprised.


    ✓ **I assume that you know little or nothing about computer programming.** This
    isn''t one of those "all things to all people" books. I don''t please the novice
    while I tease the expert. I aim this book specifically toward the novice — the
    person who has never programmed a computer or has never felt comfortable programming
    a computer. If you''re one of these people, you''re reading the right book.


    # How This Book Is Organized


    This book is divided into subsections, which are grouped into sections, which
    come together to make chapters, which are lumped finally into five parts. (When
    you write a book, you get to know your book''s structure pretty well. After months
    of writing, you find yourself dreaming in sections and chapters when you go to
    bed at night.) The parts of the book are listed here.


    # Part I: Getting Started with Java Programming


    The chapters in Part I prepare you for the overall programming experience. In
    these chapters, you find out what programming is all about and get your computer
    ready for writing and testing programs.


    # Part II: Writing Your Own Java Programs


    This part covers the basic building blocks — the elements in any Java program
    and in any program written using a Java-like language. In this part, you discover
    how to represent data and how to get new values from existing values. The program
    examples are short, but cute.'
  merge: -1
