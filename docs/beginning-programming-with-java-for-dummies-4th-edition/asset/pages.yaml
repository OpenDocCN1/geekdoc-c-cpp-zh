  md: "# Passing Values to Methods\n\nThink about sending someone to the supermarket\
    \ to buy bread. When you do this, you say, \"Go to the supermarket and buy some\
    \ bread.\" (Try it at home. You’ll have a fresh loaf of bread in no time at all!)\
    \ Of course, some other time, you send that same person to the supermarket to\
    \ buy bananas. You say, \"Go to the supermarket and buy some bananas.\" And what’s\
    \ the point of all this? Well, you have a method, and you have some on-the-fly\
    \ information that you pass to the method when you call it. The method is named\
    \ \"Go to the supermarket and buy some . . .\" The on-the-fly information is either\
    \ \"bread\" or \"bananas,\" depending on your culinary needs. In Java, the method\
    \ calls would look like this:\n\n```\n```java\ngoToTheSupermarketAndBuySome(bread);\n\
    goToTheSupermarketAndBuySome(bananas);\n```\n```\n\nThe things in parentheses\
    \ are called parameters or parameter lists. With parameters, your methods become\
    \ much more versatile. Instead of getting the same thing each time, you can send\
    \ somebody to the supermarket to buy bread one time, bananas another time, and\
    \ birdseed the third time. When you call your goToTheSupermarketAndBuySome method,\
    \ you decide right there and then what you’re going to ask your pal to buy.\n\n\
    These concepts are made more concrete in Listings 19-6 and 19-7.\n\n# Listing\
    \ 19-6: Adding Interest\n\n```\n```java\nimport java.text.NumberFormat;\nimport\
    \ static java.lang.System.out;\n\nclass NiceAccount {\n    String lastName;\n\
    \    int id;\n    double balance;\n\n    void addInterest(double rate) {\n   \
    \     out.print(\"Adding \");\n        out.print(rate);\n        out.println(\"\
    \ percent...\");\n\n        balance += balance * (rate / 100.0);\n    }\n\n  \
    \  void display() {\n        NumberFormat currency =\n            NumberFormat.getCurrencyInstance();\n\
    \n        out.print(\"The account with last name \");\n        out.print(lastName);\n\
    \        out.print(\" and ID number \");\n```\n```"
  merge: -1
  img_proc: true
