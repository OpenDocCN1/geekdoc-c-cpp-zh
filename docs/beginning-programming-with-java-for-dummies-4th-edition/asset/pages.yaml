  md: "To turn this into an enhanced for loop, you make up a new variable name. (What\
    \ about the name howMany? I like that name.) Whatever name you choose, the new\
    \ variable ranges over the values in the guestsIn array.\n\n```\nfor (int howMany\
    \ : guestsIn) {\n    out.println(howMany);\n}\n```\n\nThis enhanced loop uses\
    \ the same format as the loop in Chapter 15.\n\n```\nfor (TypeName variableName\
    \ : RangeOfValues) {\n    Statements\n}\n```\n\nIn Chapter 15, the RangeOfValues\
    \ belongs to an enum type. But in this chapter's example, the RangeOfValues belongs\
    \ to an array.\n\nEnhanced for loops are nice and concise. But don't be too anxious\
    \ to use enhanced loops with arrays. This feature has some nasty limitations.\
    \ For example, my new howMany loop doesn't display room numbers. I avoid room\
    \ numbers because the room numbers in my guestsIn array are the indices 0 through\
    \ 9. Unfortunately, an enhanced loop doesn't provide easy access to an array's\
    \ indices.\n\nAnd here's another unpleasant surprise. Start with the following\
    \ loop from Listing 16-4:\n\n```\nfor (int roomNum = 0; roomNum < 10; roomNum++)\
    \ {\n    guestsIn[roomNum] = diskScanner.nextInt();\n}\n```\n\nTurn this traditional\
    \ for loop into an enhanced for loop, and you get the following misleading code:\n\
    \n```\nfor (int howMany : guestsIn) {\n    howMany = diskScanner.nextInt();  //Don't\
    \ do this\n}\n```\n\nThe new enhanced loop doesn't do what you want it to do.\
    \ This loop reads values from an input file and then dumps these values into the\
    \ garbage can. In the end, the array's values remain unchanged.\n\nIt's sad but\
    \ true. To make full use of an array, you have to fall back on Java's plain old\
    \ for loop."
