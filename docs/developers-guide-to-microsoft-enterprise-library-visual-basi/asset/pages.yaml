    # Reading Rows Using Queries with Named Parameters


    The technique in the previous example of supplying just an array of parameter
    values is easy and efficient, but has some limitations. It does not allow you
    to specify the direction (such as input or output), or the data type—which may
    be an issue if the data type of a parameter does not exactly match (or cannot
    be implicitly converted into) the correct type discovered for a stored procedure.
    If you create an array of parameters for your query, you can specify more details
    about the types of the parameters and the way they should be used.


    In addition, some database systems allocate parameters used in SQL statements
    or stored procedures simply by position. However, many database systems, such
    as SQL Server, allow you to use named parameters. The database matches the names
    of the parameters sent with the command to the names of the parameters defined
    in the SQL statement or stored procedure. This means that you are not confined
    to adding parameters to your command in a specific order. However, be aware that
    if you use named parameters and then change the database type to one that does
    not support named parameters, any parameters that are supplied out of order will
    probably cause errors. (This may be difficult to detect if all of the parameters
    are of the same data type!)


    To work with named parameters or parameters of defined types, you must access
    the **Command** object that will be used to execute the query, and manipulate
    its collection or parameters. The Data Access block makes it easy to create and
    access the **Command**'
