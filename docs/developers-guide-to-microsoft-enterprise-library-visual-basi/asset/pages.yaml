- pgno: 62
  md: "For example, you might be able to perform multiple queries concurrently and\
    \ combine the results to create the required data set. Or query multiple databases,\
    \ and only use the data from the one that returned the results first (which is\
    \ also a kind of failover feature). However, keep in mind that asynchronous data\
    \ access has an effect on connection and data streaming performance over the wire.\
    \ Don't expect a query that returns ten rows to show any improvement using an\
    \ asynchronous approach—it is more likely to take longer to return the results!\n\
    \nThe Data Access block provides asynchronous Begin and End versions of many of\
    \ the standard data access methods, including ExecuteReader, ExecuteScalar, ExecuteXmlReader,\
    \ and ExecuteNonQuery. It also provides asynchronous Begin and End versions of\
    \ the Execute method for accessors that return data as a sequence of objects.\
    \ You will see both of these techniques here.\n\n# Preparing for Asynchronous\
    \ Data Access\n\nBefore you can execute a query asynchronously, you must specify\
    \ the appropriate setting in the connection string for the database you want to\
    \ use. By default, asynchronous data access is disabled for connections, which\
    \ prevents them from suffering the performance hit associated with asynchronous\
    \ data retrieval. To use asynchronous methods over a connection, the connection\
    \ string must include Asynchronous Processing=true (or just async=true), as shown\
    \ in this example from a <connectionStrings> section of a configuration file.\n\
    \n```\n<connectionStrings>\n  <add name=\"AsyncExampleDatabase\"\n       connectionString=\"\
    Asynchronous Processing=true; Data Source=.\\SQLEXPRESS;\n       Initial Catalog=MyDatabase;\
    \ Integrated Security=True;\"\n       providerName=\"System.Data.SqlClient\" />\n\
    \  ...\n</connectionStrings>\n```\n\nIn addition, asynchronous processing in the\
    \ Data Access block is only available for SQL Server databases. The Database class\
    \ includes a property named SupportsAsync that you can query to see if the current\
    \ Database instance does, in fact, support asynchronous operations. The example\
    \ for this chapter contains a simple check for this.\n\nOne other point to note\
    \ is that asynchronous data access usually involves the use of a callback that\
    \ runs on a different thread from the calling code. A common approach to writing\
    \ callback code in modern applications is to use Lambda expressions rather than\
    \ a separate callback handler routine. However, Visual Basic in version 9 (in\
    \ Visual Studio® 2008 and version 3.5 of the .NET Framework) does not fully support\
    \ Lambda expressions for callbacks, so you may need to use separate callback routines\
    \ in this scenario. This callback usually cannot directly access the user interface\
    \ in a Windows® Forms or Windows Presentation Foundation (WPF) application. You\
    \ will, in most cases, need to use a delegate to call a method in the original\
    \ UI class to update the data returned by the callback."
  merge: -1
  img_proc: true
- pgno: 63
  md: "Other points to note about asynchronous data access are the following:\n\n\
    +   - **Threading** namespace, such as wait handles and manual reset events, to\
    \ manage asynchronous execution of the Data Access block methods. You can also\
    \ cancel a pending or executing command by calling the **Cancel** method of the\
    \ command you used to initiate the operation. For more information, see “Asynchronous\
    \ Command Execution in ADO.NET 2.0” on MSDN at http://msdn.microsoft.com/en-us/library/ms379553(VS.80).aspx.\n\
    \n+   - The **BeginExecuteReader** method does not accept a **CommandBehavior**\
    \ parameter. By default, the method will automatically set the **Command Behavior**\
    \ property on the underlying reader to **CloseConnection** unless you specify\
    \ a transaction when you call the method. If you do specify a transaction, it\
    \ does not set the **CommandBehavior** property.\n\n+   - Always ensure you call\
    \ the appropriate **EndExecute** method when you use asynchronous data access,\
    \ even if you do not actually require access to the results, or call the **Cancel**\
    \ method on the connection. Failing to do so can cause memory leaks and consume\
    \ additional system resources.\n\n+   - Using asynchronous data access with the\
    \ Multiple Active Results Set (MARS) feature of ADO.NET may produce unexpected\
    \ behavior, and should generally be avoided.\n\n+   - Asynchronous data access\
    \ is only available if the database is SQL Server 7.0 or later. Also, for SQL\
    \ Server 7.0 and SQL Server 2000, the database connection must use TCP. It cannot\
    \ use shared memory. To ensure that TCP is used for SQL Server 7.0 and SQL Server\
    \ 2000, use **localhost**, **tcp:server_name**, or **tcp:ip_address** for the\
    \ server name in the connection string.\n\nAsynchronous code is notoriously difficult\
    \ to write, test, and debug for all edge cases, and you should only consider using\
    \ it where it really can provide a performance benefit. For guidance on performance\
    \ testing and setting performance goals see “patterns & practices Performance\
    \ Testing Guidance for Web Applications” at http://perftesting guide.codeplex.com/.\n\
    \n# Retrieving Row Set Data Asynchronously\n\nThe following code shows how you\
    \ can perform asynchronous data access to retrieve a row set from a SQL database.\
    \ The code creates a **Command** instance and adds two parameters, and then calls\
    \ the **BeginExecuteReader** method of the **Database** class to start the process.\
    \ Although you can use complex Lambda expressions in Visual Studio 2010 and Visual\
    \ Basic 10, you cannot do so if you are using Visual Basic version 9 in Visual\
    \ Studio 2008. Instead, you can create a separate callback function and specify\
    \ it when you call the **BeginExecuteReader** method, as shown here.\n\n```\n\
    Try\n    ' Create command to execute stored procedure and add parameters.\n  \
    \  Dim cmd As DbCommand = asyncDB.GetStoredProcCommand(\"ListOrdersSlowly\")\n\
    ```"
