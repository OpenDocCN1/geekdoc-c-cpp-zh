    # Creating and Using Mappers


    In some cases, you may need to create a custom parameter mapper to pass your parameters
    to the query that the accessor will execute. This typically occurs when you need
    to execute a SQL statement to work with a database system that does not support
    parameter resolution, or when a default mapping cannot be inferred due to a mismatch
    in the number or types of the parameters. The parameter mapper class must implement
    the IParameterMapper interface and contain a method named AssignParameters that
    takes a reference to the current Command instance and the array of parameters.
    The method simply needs to add the required parameters to the Command object’s
    Parameters collection.


    More often, you will need to create a custom output mapper. To help you do this,
    the block provides a class called MapBuilder that you can use to create the set
    of mappings you require between the columns of the data set returned by the query
    and the properties of the objects you need.


    By default, the accessor will expect to generate a simple sequence of a single
    type of object (in our earlier example, this was a sequence of the Product class).
    However, you can use an accessor to return a more complex graph of objects if
    you wish. For example, you might execute a query that returns a series of Order
    objects and the related Order Lines objects for all of the selected orders. Simple
    output mapping cannot cope with this scenario, and neither can the MapBuilder
    class. In this case, you would create a result set mapper by implementing the
    IResultSetMapper interface. Your custom row set mapper must contain a method named
    MapSet that receives a reference to an object that implements the IDataReader
    interface. The method should read all of the data available through the data reader,
    processes it to create the sequence of objects you require, and return this sequence.'
  merge: -1
  img_proc: true
- pgno: 59
  md: "# RETRIEVING XML DATA\n\nSome years ago, XML was the coolest new technology\
    \ that was going to rule the world and change the way we think about data. In\
    \ some ways, it did, though the emphasis on XML has receded as the relational\
    \ database model continues to be the basis for most enterprise systems. However,\
    \ the ability to retrieve data from a relational database as XML is useful in\
    \ many scenarios, and is supported by the Data Access block.\n\nSQL Server supports\
    \ a mechanism called SQLXML that allows you to extract data as a series of XML\
    \ elements, or in a range of XML document formats, by executing specially formatted\
    \ SQL queries. You can use templates to precisely control the output, and have\
    \ the server format the data in almost any way you require. For a description\
    \ of the capabilities of SQLXML, see http://msdn.microsoft.com/library/aa226527(v=MSDN.10).aspx.\n\
    \nThe Data Access block provides the **ExecuteXmlReader** method for querying\
    \ data as XML. It takes a SQL statement that contains the **FOR XML** statement\
    \ and executes it against the database, returning the result as an **XmlReader**.\
    \ You can iterate through the resulting XML elements or work with them in any\
    \ of the ways supported by the XML classes in the .NET Framework. However, as\
    \ SQLXML is limited to SQL Server (the implementation of this type of query differ\
    \ in other database systems), it is only available when you specifically use the\
    \ **SqlDatabase** class (rather than the **Database** class).\n\nThe following\
    \ code shows how you can obtain a **SqlDatabase** instance, specify a suitable\
    \ SQLXML query, and execute it using the **ExecuteXmlReader** method.\n\n```\n\
    ' Resolve a SqlDatabase object from the container using the default database.\n\
    Dim sqlServerDB As SqlDatabase _\n    = TryCast(EnterpriseLibraryContainer.Current.GetInstance(Of\
    \ Database)(), _\n    SqlDatabase)\n\n' Specify a SQL query that returns XML data.\n\
    Dim xmlQuery As String _\n    = \"SELECT * FROM OrderList WHERE State = @state\
    \ FOR XML AUTO\"\n\n' Create a suitable command type and add the required parameter\n\
    ' NB: ExecuteXmlReader is only available for SQL Server databases\nUsing xmlCmd\
    \ As DbCommand = sqlServerDB.GetSqlStringCommand(xmlQuery)\n    xmlCmd.Parameters.Add(New\
    \ SqlParameter(\"@state\", \"Colorado\"))\n    Using reader As XmlReader = sqlServerDB.ExecuteXmlReader(xmlCmd)\n\
    \        ' Iterate through the elements in the XmlReader\n        While Not reader.EOF\n\
    \            If reader.IsStartElement() Then\n                Console.WriteLine(reader.ReadOuterXml())\n\
    \            End If\n        End While\n    End Using\nEnd Using\n```"
  merge: -1
  img_proc: true
- pgno: 60
  md: 'The code above also shows a simple approach to extracting the XML data from
    the **XmlReader** returned from the **ExecuteXmlReader** method. One point to
    note is that, by default, the result is an XML fragment, and not a valid XML document.
    It is, effectively, a sequence of XML elements that represent each row in the
    results set. Therefore, at minimum, you must wrap the output with a single root
    element so that it is well-formed. For more information about using an **XmlReader**,
    see “Reading XML with the XmlReader” in the online MSDN documentation at http://msdn.microsoft.com/en-us/library/9d8k26z1.aspx.


    The example **Return data as an XML fragment using a SQL Server XML query** uses
    the code you see above to query a SQL Server database. It returns two XML elements
    in the default format for a FOR XML AUTO query, with the values of each column
    in the data set represented as attributes, as shown here.


    ```

    `<OrderList Id="1" Status="DRAFT" CreatedOn="2009-02-01T11:12:06" Name="Adjustable
    Race" LastName="Abbas" FirstName="Syed" ShipStreet="123 Elm Street" ShipCity="Denver"
    ShipZipCode="12345" ShippingOption="Two-day shipping" State="Colorado" /> <OrderList
    Id="2" Status="DRAFT" CreatedOn="2009-02-03T11:12:06" Name="All-Purpose Bike Stand"
    LastName="Abel" FirstName="Catherine" ShipStreet="321 Cedar Court" ShipCity="Denver"
    ShipZipCode="12345" ShippingOption="One-day shipping" State="Colorado" />`

    ```


    You might use this approach when you want to populate an XML document, transform
    the data for display, or persist it in some other form. You might use an XSLT
    style sheet to transform the data to the required format. For more information
    on XSLT, see “XSLT Transformations” at http://msdn.microsoft.com/en-us/library/14689742.aspx.


    # RETRIEVING SINGLE SCALAR VALUES


    A common requirement when working with a database is to extract a single scalar
    value based on a query that selects either a single row or a single value. This
    is typically the case when using lookup tables or checking for the presence of
    a specific entity in the database. The Data Access block provides the **ExecuteScalar**
    method to handle this requirement. It executes the query you specify, and then
    returns the value of the first column of the first row of the result set as an
    **Object** type. This means that it provides much better performance than the
    **ExecuteReader** method, because there is no need to create a **DataReader**
    and stream the results to the client as a row set. To maximize this efficiency,
    you should aim to use a query that returns a single value or a single row.


    The **ExecuteScalar** method has a set of overloads similar to the **ExecuteReader**
    method we used earlier in this chapter. You can specify a **CommandType** (the
    default is **StoredProcedure**) and either a SQL statement or a stored procedure
    name. You can also pass in an array of **Object** instances that represent the
    parameters for the query. Alternatively, you can pass to the method a **Command**
    object that contains any parameters you require.


    The following code demonstrates passing a **Command** object to the method to
    execute both an inline SQL statement and a stored procedure. It obtains a suitable'
