    # Combining Validation Attribute Operations


    One other use of validation attributes worth a mention here is the application
    of a composite validator. By default, multiple validators defined for a member
    are combined using the **And** operation. If you want to combine multiple validation
    attributes using an **Or** operation, you must apply the **ValidatorComposition**
    attribute first and specify **CompositionType.Or**. The results of all validation
    operations defined in subsequent validation attributes are combined using the
    operation you specify for composition type.


    The example class uses a **ValidatorComposition** attribute on the nullable **DateDue**
    property to combine a Not Null validator and a Relative DateTime validator. The
    top-level error message that the user will see for this property (when you do
    not recursively iterate through the contents of the **ValidationResults**) is
    the message from the **ValidatorComposition** attribute.


    ```

    <ValidatorComposition(CompositionType.[Or], _

    MessageTemplate:="Date due must be between today and six months time.")> _

    <NotNullValidator(Negated:=True, _

    MessageTemplate:="{0}Value can be NULL or a date.")> _

    <RelativeDateTimeValidator(0, DateTimeUnit.Day, 6, DateTimeUnit.Month, _

    MessageTemplate:="{0}Value can be NULL or a date.")> _

    Public Property DateDue() As System.Nullable(Of DateTime)

    ...

    End Property

    ```


    If you want to allow null values for a member of a class, you can apply the **IgnoreNulls**
    attribute.


    # Applying Self-Validation


    Some validation rules are too complex to apply using the validators provided with
    the Validation block or the .NET Data Annotation validation attributes. It may
    be that the values you need to perform validation come from different places,
    such as properties, fields, and internal variables, or involve complex calculations.


    In this case, you can define self-validation rules as methods within your class
    (the method names are irrelevant), as described earlier in this chapter in the
    section “Self-Validation.” We’ve implemented a self-validation routine in the
    **AttributedProduct** class in the example application. The method simply checks
    that the combination of the values of the **InStock**, **OnOrder**, and **DateDue**
    properties meets predefined rules. You can examine the code within the **AttributedProduct**
    class to see the implementation.'
