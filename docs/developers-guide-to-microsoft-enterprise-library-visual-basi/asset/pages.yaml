    be useful if you want to check what types are registered in your run-time code,
    or display a list of available types. However, Unity also exposes methods that
    allow you to iterate over the container and obtain information about all of the
    registrations.


    We don''t have room to provide a full guide to using Unity here. However, this
    discussion should have given you a taste of what you can achieve using dependency
    injection. For more detailed information about using Unity, see the documentation
    installed with Enterprise Library and available online at http://go.microsoft.com/fwlink/?LinkId=188874.'
