    \ key, save the key file, and automatically update the content of App.config.\
    \ Then repeat this procedure for the RijndaelManager symmetric provider. Rijndael\
    \ is an implementation of the AES algorithm. However, we will demonstrate both\
    \ as we show you how to encrypt and decrypt both value types and objects."
