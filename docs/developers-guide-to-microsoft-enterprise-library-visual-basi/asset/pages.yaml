    Validation block attribute validation occurs only on the server, and not on the
    client.


    Also keep in mind that, while DataAnnotations supports most of the Validation
    block attributes, not all of the validation attributes provided with the Validation
    block are supported by the built-in .NET validation mechanism. For more information,
    see the documentation installed with Enterprise Library, and the topic “System.ComponentModel.DataAnnotations
    Namespace” at http://msdn.microsoft.com/en-us/library/system.componentmodel.dataannotations.aspx.


    # SELF-VALIDATION


    Self-validation might sound as though you should be congratulating yourself on
    your attractiveness and wisdom, and your status as fine and upstanding citizen.
    However, in Enterprise Library terms, self-validation is concerned with the use
    of classes that contain their own validation logic.


    For example, a class that stores spare parts for aircraft might contain a function
    that checks that the part ID matches a specific format containing letters and
    numbers. You add the **HasSelfValidation** attribute to the class, add the **SelfValidation**
    attribute to any validation functions it contains, and optionally add attributes
    for the built-in Validation block validators to any relevant properties. Then
    you can validate an instance of the class using the Validation block. The block
    will execute the self-validation method.


    Self-validation cannot be used with the UI validation integration features for
    Windows Forms, WPF, or ASP.NET.


    Self-validation is typically used where the validation rule you want to apply
    involves values from different parts of your class or values that are not publicly
    exposed by the class, or when the validation scenario requires complex rules that
    even a combination of composed validators cannot achieve. For example, you may
    want to check if the sum of the number of products on order and the number already
    in stock is less than a certain value before'
