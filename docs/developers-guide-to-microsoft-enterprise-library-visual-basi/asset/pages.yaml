  md: '# Creating Custom Trace Listeners, Filters, and Formatters


    You can extend the capabilities of the Logging block if you need to add specific
    functionality to it. In general, you will only need to implement custom log filters,
    trace listeners, or log formatters. The design of the block makes it easy to add
    these and make them available through configuration.


    To create a new log filter, you can either implement the ILogFilter interface,
    which specifies the single method Filter that must accept an instance of a LogEntry
    and return true or false, or you can inherit the base class LogFilter and implement
    the Filter method.


    To create a custom trace listener, you can inherit from the abstract base class
    CustomTraceListener and implement the methods required to send your log entry
    to the appropriate location or execute the relevant actions to log the message.
    You can expose a property for the relevant log formatter if you want to allow
    users to select a specific formatter for the message.


    To create a custom log formatter, you can either implement the ILogFormatter interface,
    which specifies the single method, Format, that must accept an instance of a Log
    Entry and return the formatted message, or you can inherit the base class, LogFormatter,
    and implement the Format method.


    For more information about extending the Logging block, see the online documentation
    at http://go.microsoft.com/fwlink/?LinkId=188874 or consult the installed help
    files.


    For more information about extending the Logging block, see the online documentation
    at http://go.microsoft.com/fwlink/?LinkId=188874 or consult the installed help
    files.


    # Summary


    This chapter described the Enterprise Library Logging Application Block. This
    block is extremely useful for logging activities, events, messages, and other
    information that your application must persist or expose—both to monitor performance
    and to generate auditing information. The Logging block is, like all of the other
    Enterprise Library blocks, highly customizable and driven through configuration
    so that you (or administrators and operations staff) can modify the behavior to
    suit your requirements exactly.


    You can use the Logging block to categorize, filter, and write logging information
    to a wide variety of targets, including Windows event logs, e-mail messages, disk
    files, Windows Message Queuing, and a database. You can even collect additional
    context information and add it to the log entries automatically, and add activity
    IDs to help you correlate related messages and activities. And, if none of the
    built-in features meets your requirements, you can create and integrate custom
    listeners, filters, and formatters.


    This chapter explained why you should consider decoupling your logging features
    from your application code, what the Logging block can do to help you implement
    flexible and configurable logging, and how you actually perform the common tasks
    related to logging. For more information about using the Logging block, see the
    online documentation at http://go.microsoft.com/fwlink/?LinkId=188874 or consult
    the installed help files.'
