- pgno: 141
  md: '# Introduction


    How do you make your applications perform faster? You could simply throw hardware
    at the problem, but with the increasing move towards green data centers, soaking
    up more electricity and generating more heat that you have to get rid of is not
    exactly a great way to showcase your environmental awareness. Of course, you should
    always endeavor to write efficient code and take full advantage of the capabilities
    of the platform and operating system, but what does that entail?


    One of the ways that you may be able to make your application more efficient is
    to ensure you employ an appropriate level of caching for data that you reuse,
    and which is expensive to create. However, caching every scrap of data that you
    use may be counter-productive. For example, I once installed a photo screensaver
    that used caching to store the transformed versions of the original images and
    reduce processing requirements as it repeatedly cycled through the collection
    of photos. It probably works fine if you only have a few dozen images, but with
    my vast collection of high-resolution photos it very quickly soaked up three gigabytes
    of memory, bringing my machine (with only one gig of memory installed) to its
    knees.


    So, before you blindly implement caching across your whole application, think
    about what, how, where, and when you should implement caching. Table 1 contains
    some pointers.'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'TABLE 1 Defining a caching strategy


    | | |

    |---|---|

    | **What?** | Data that applies to all users of the application and does not change
    frequently, or data that you can use to optimize reference data lookups, avoid
    network round-trips, and avoid unnecessary and duplicate processing. Examples
    are data such as product lists, constant values, and values read from configuration
    or a database. Where possible, cache data in a ready-to-use format. Do not cache
    volatile data, and do not cache sensitive data unless you encrypt it. |

    | **When?** | You can cache data when the application starts if you know it will
    be required and it is unlikely to change. However, you should cache data that
    may or may not be used, or data that is relatively volatile, only when your application
    first accesses it. |

    | **Where?** | Ideally, you should cache data as near as possible to the code
    that will use it, especially in a layered application that is distributed across
    physical tiers. For example, cache data you use for controls in your user interface
    in the presentation layer, cache business data in the business layer, and cache
    parameters for stored procedures in your data layer. If your application runs
    on multiple servers and the data may change as the application runs, you will
    usually need to use a distributed cache accessible from all servers. If you are
    caching data for a user interface, you can usually cache the data on the client.
    |

    | **How ?** | Caching is a crosscutting concern—you are likely to implement caching
    in several places, and in many of your applications. Therefore, a reusable and
    configurable caching mechanism that you can install in the appropriate locations
    is the obvious choice. The Caching Application Block is an ideal solution for
    non-distributed caching. It supports both an in-memory cache and, optionally,
    a backing store that can be either a database or isolated storage. The block provides
    all the functionality needed to retrieve, add, and remove cached data, and supports
    configurable expiration and scavenging policies. |


    This chapter concentrates (obviously) on the patterns & practices Caching Application
    Block, which is designed for use as a non-distributed cache on a client machine.
    It is ideal for caching data in Windows® Forms, Windows Presentation Foundation
    (WPF), and console-based applications. You can use it in server-based roles such
    as ASP.NET applications, services, business layer code, or data layer code; but
    only where you have a single instance of the code running.


    Out of the box, the Caching Application Block does not provide the features required
    for distributed caching across multiple servers. Other solutions you may consider
    for caching are the ASP.NET cache mechanism, which can be used on a single server
    (in-process) and on multiple servers (using a state server or a SQL Server® database),
    or a third party solution that uses the Caching Application Block extension points.
    Also keep in mind that version 4.0 of the .NET Framework includes the System.Runtime.Caching
    namespace, which provides features to support in-memory caching. The current version
    of the Caching block is likely to be deprecated after this release, and Enterprise
    Library will instead make use of the caching features of the .NET Framework.'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# # What Does the Caching Block Do?


    The Caching Application Block provides high-performance and scalable caching capabilities,
    and is both thread safe and exception safe. It caches data in memory, and optionally
    maintains a synchronized backing store that, by default, can be isolated storage
    or a database. It also provides a wide range of expiration features, including
    the use of multiple expiration settings for cached items (including both time-based
    and notification-based policies).


    Even better, if the cache locations are not suitable for your requirements, or
    the caching mechanism doesn''t do quite what you want in terms of storing or retrieving
    cache items, you can modify or extend it. For example, you can create your own
    custom expiration policies and backing store providers, and plug them in using
    the built-in extension points. This means that you can implement caching operations
    throughout your applications that you access from code using a simple simple API.


    On top of all that, the caches you implement are configurable at design time and
    run time, so that administrators can change the caching behavior as required both
    before and after deployment. Administrators can change the backing store that
    the caching mechanism uses, configure encryption of the cached contents, and change
    the scavenging behavior—all through configuration settings.


    # ## FLUSHED OR EXPIRED?


    One of the main factors that can affect application performance is memory availability.
    While caching data can improve performance, caching too much data can (as you
    saw earlier) reduce performance if the cache uses too much of the available memory.
    To counter this, the Caching Block performs scavenging on a fixed cycle in order
    remove items when memory is in short supply. Items may be removed from the cache
    in two ways:


    +   - **When they expire.** If you specify an expiration setting, the item is
    removed from the cache during the next scavenging cycle if they have expired.
    You can specify a combination of settings based on the absolute time, sliding
    time, extended time format (for example, every evening at midnight), file dependency,
    or never. You can also specify a priority, so that lower priority items are scavenged
    first. The scavenging interval and the maximum number of items to scavenge on
    each pass are configurable.


    +   - **When they are flushed.** You can explicitly expire (mark for removal)
    individual items in the cache, or explicitly expire all items, using methods exposed
    by the Caching block. This allows you to control which items are available from
    the cache. The scavenging mechanism removes items that it detects have expired
    and are no longer valid. However, until the scavenging cycle occurs, the items
    remain in the cache but are marked as expired, and you cannot retrieve them.'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'The difference is that flushing might remove valid cache items to make space
    for more frequently used items, whereas expiration removes invalid and expired
    items. Remember that items may have been removed from the cache by the scavenging
    mechanism even if they haven''t expired, and you should always check that the
    cached item exists when you try to retrieve and use it. You may choose to recreate
    the item and re-cache it at this point.


    # WHICH EXPIRATION POLICY?


    If you have data that is relatively volatile, is updated regularly, or is valid
    for only a specific time or interval, you can use a time-based expiration policy
    to ensure that items do not remain in the cache beyond their useful valid lifetime.
    You can specify how long an item should remain in the cache if not accessed (effectively
    the timer starts at zero again each time it is accessed), or specify the absolute
    time that it should be removed irrespective of whether it has been accessed in
    the meantime.


    If the data you cache depends on changes to another resource, such as a disk file,
    you can improve caching efficiency by using a notification-based expiration policy.
    The Caching block contains an expiration provider that detects changes to disk
    files. You can create your own custom expiration policy providers that detect,
    for example, WMI events, database events, or business logic operations and invalidate
    the cached item when they occur.


    # How Do I Configure the Caching Block?


    Like all of the Enterprise Library application blocks, you start by configuring
    your application to use the block. Chapter 1, “Introduction,” demonstrates the
    basic principles for using the configuration tool. To configure the Caching block,
    you add the Caching Settings section to the tool, which adds a default cache manager.
    The cache manager exposes the caching API and is responsible for manipulating
    the cached items. You can add more than one cache manager to the configuration
    if you want to implement multiple caches, or change the default cache manager
    for a custom one that you create. For example, you may decide to replace it with
    a custom or third-party cache manager that supports distributed caching for a
    Web farm or application farm containing multiple servers.


    Figure 1 shows the configuration for the examples in this chapter of the guide.
    You can see the four cache managers we use, with the section for the EncryptedCache
    Manager expanded to show its property settings.'
  merge: -1
  img_proc: true
- pgno: 145
  md: '![](img/d7009d38323c3b86f2dfbc5155fbf141_145_0.png)


    # FIGURE 1 Configuring caching in Enterprise Library


    For each cache manager, you can specify the expiration poll frequency (the interval
    in seconds at which the block will check for expired items and remove them), the
    maximum number of items in the cache before scavenging will occur irrespective
    of the polling frequency, and the number of items to remove when scavenging the
    cache.


    You can also specify, in the configuration properties of the Caching Application
    Block root node, which of the cache managers you configure should be the default.
    The Caching block will use the one you specify if you instantiate a cache manager
    without providing the name of that cache manager.


    # PERSISTENT CACHING


    The cache manager caches items in memory only. If you want to persist cached items
    across application and system restarts, you can add a persistent backing store
    to your configuration. You can specify only a single backing store for each cache
    manager (obviously, or it would get extremely confused), and the Caching block
    contains providers for caching in both a database and isolated storage. You can
    specify a partition name for each persistent backing store, which allows you to
    target multiple cache storage providers at isolated storage or at the same database.'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'If you add a data cache store to your configuration, the configuration tool
    automatically adds the Data Access Application Block to the configuration. You
    configure a database connection in the Data Access block configuration section,
    and then select this connection in the properties of the data cache store provider.
    For details of how you configure the Data Access Application Block, see Chapter
    2 “Much ADO about Data Access.”


    # ## ENCRYPTING CACHED ITEMS


    You can add a provider that implements symmetric storage encryption to each persistent
    backing store you configure if you want to encrypt the stored items. This is a
    really good plan if you must store sensitive information. When you add a symmetric
    storage encryption provider to your configuration, the configuration tool automatically
    adds the Cryptography Application Block to the configuration.


    You configure a symmetric cryptography provider in the Cryptography block configuration
    section. You can use the Windows Data Protection API (DPAPI) symmetric provider,
    or select from other providers such as AES, Triple DES, and Rijndael. For details
    of how you configure the Cryptography Application Block, see Chapter 7, “Relying
    Cryptography Complexity.” Then in the properties of the symmetric storage encryption
    provider in the Caching block section, select the provider you just configured.


    > > Note that the Caching Application Block does not encrypt data in the in-memory
    cache, even if you configure encryption for the associated backing store. It is
    possible that a malicious user could access the application process’s memory,
    do not store sensitive information, such as credit card numbers or passwords,
    in the cache.


    And now, at last, you are ready to write code that uses the Caching block. You’ll
    see the ways that you can use it demonstrated in the examples in this chapter.


    # ## INITIALIZING THE CACHING BLOCK


    When you create a project that uses the Caching block, you must edit the project
    and code to add references to the appropriate Enterprise Library assemblies and
    namespaces. The examples in this chapter demonstrate caching to a database and
    encrypting cached data, as well as writing to the isolated storage backing store.


    The assemblies you must add to your project (in addition to the assemblies listed
    in Chapter 1, “Introduction,” that are required for all Enterprise Library projects)
    are:


    +   - Microsoft.Practices.EnterpriseLibrary.Caching.dll

    +   - Microsoft.Practices.EnterpriseLibrary.Caching.Cryptography.dll

    +   - Microsoft.Practices.EnterpriseLibrary.Caching.Database.dll

    +   - Microsoft.Practices.EnterpriseLibrary.Data.dll

    +   - Microsoft.Practices.EnterpriseLibrary.Security.Cryptography.dll


    > > If you do not wish to cache items in a database, you don’t need to add the
    Database and Data assemblies. If you do not wish to encrypt cached items, you
    don’t need to add the two Cryptography assemblies.


    To make it easier to use the objects in the Caching block, you can add references
    to the relevant namespaces to your project. Then you are ready to write some code.'
  merge: -1
  img_proc: true
- pgno: 147
  md: '# How Do I Use the Caching Block?


    You manipulate your caches using the interface of the Cache Manager. It is a relatively
    simple interface. There are two overloads of the Add method for adding items to
    the cache, plus methods to retrieve a cached item, remove a single item, flush
    all items, and check if the cache contains a specified item. The single property,
    Count, returns the number of items currently in the cache.


    # ABOUT THE EXAMPLE APPLICATION


    The code you can download for this guide contains a sample application named Caching
    that demonstrates the techniques described in this chapter. The sample provides
    a number of different examples that you can run.


    Before you attempt to run the example, you must create a new encryption key for
    the Caching block to use to encrypt the data in one of the examples that uses
    a symmetric encryption provider. This is because the key is tied to either the
    user or the machine, and so the key included in the sample files will not work
    on your machine. In the configuration console, navigate to the Symmetric Cryptography
    Providers section of the Cryptography Application Block Settings and select the
    RijndaelManaged provider. Click the “...” button next to the Key property to start
    the Cryptographic Key Wizard. Use this wizard to generate a new key, save the
    key file, and automatically update the contents of App.config.


    The first of the examples, Cache data in memory using the null backing store,
    demonstrates some of the options you have when adding items to the cache.


    # ADDING ITEMS TO AND RETRIEVING ITEMS FROM THE CACHE


    To add an item to the cache, you can use the simple approach of specifying just
    the key for the item and the value to cache as parameters to the Add method. The
    item is cached with a never expired lifetime, and normal priority. If you want
    more control over the way an item is cached, you can use the other overload of
    the Add method, which additionally accepts a value for the priority, a reference
    to a callback that will execute when the cached item expires, and an array of
    expirations that specify when the item should expire.


    Possible values for the priority, as defined in the CacheItemPriority enumeration,
    are None, Low, Normal, High, and NotRemovable. In addition to the NeverExpired
    value for the expirations, you can use AbsoluteTime, SlidingTime, FileDependency,
    and ExtendedFormatTime expirations. If you create an array containing more than
    one expiration instance, the block will expire the item when any one of these
    indicates that it has expired.


    The example starts by obtaining a reference to an instance of a CacheManager—
    in this case one that has no backing store defined in its configuration (or, to
    be more precise, it has the NullBackingStore class defined) and so uses only the
    in-memory cache. It stores this reference as the interface type ICacheManager.


    Next, it calls a separate routine that adds items to the cache and then displays
    the contents of the cache. This routine is reused in many of the examples in this
    chapter.'
  merge: -1
  img_proc: true
