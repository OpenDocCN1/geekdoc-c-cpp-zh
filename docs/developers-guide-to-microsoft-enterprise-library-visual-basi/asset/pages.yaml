    +   - You can use the **Database** class to create **Accessor** instances that
    execute data access operations both synchronously and asynchronously, and return
    the results as a series of objects suitable for client-side querying using technologies
    such as LINQ.


    # How Do I Use the Data Access Block?


    Before you start to use the Data Access block, you must add it to your application.
    You configure the block to specify the databases you want to work with, and add
    the relevant assemblies to your project. Then you can create instances of these
    databases in your code and use them to read and write data.


    # CONFIGURING THE BLOCK AND REFERENCING THE REQUIRED ASSEMBLIES


    The first step in using the Data Access block is to configure the databases you
    want to access. The block makes use of the standard **<connectionStrings>** section
    of the App.config, Web.config, or other configuration file to store the individual
    database connection strings, with the addition of a small Enterprise Library-specific
    section that defines which of the configured databases is the default. You can
    configure all of these settings using the Enterprise Library configuration console,
    as shown in Figure 1.


    ![](img/d7009d38323c3b86f2dfbc5155fbf141_48_0.png)


    FIGURE 1 Creating a new configuration for the Data Access Application Block'
