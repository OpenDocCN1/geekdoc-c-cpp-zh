- pgno: 171
  md: 'For more details on each validator, see the documentation installed with Enterprise
    Library or available online at http://go.microsoft.com/fwlink/?LinkId=188874.
    You will see examples that use many of these validators throughout this chapter.


    # VALIDATING WITH ATTRIBUTES


    If you have full access to the source code of your application, you can use attributes
    within your classes to define your validation rules. You can apply validation
    attributes in the following ways:


    +   - To a field. The Validation block will check that the field value satisfies
    all validation rules defined in validators applied to the field.

    +   - To a property. The Validation block will check that the value of the get
    property satisfies all validation rules defined in validators applied to the property.

    +   - To a method that takes no parameters. The Validation block will check that
    the return value of the method satisfies all validation rules defined in validators
    applied to the method.

    +   - To an entire Class, using only the NotNullValidator, ObjectCollection Validator,
    AndCompositeValidator, and OrCompositeValidator). The Validation block can check
    if the object is null, or that it is a member of the specified collection, and
    that any validation rules defined within it are satisfied.

    +   - To a parameter in a WCF Service Contract. The Validation block will check
    that the parameter value satisfies all validation rules defined in validators
    applied to the parameter.

    +   - To parameters of methods that are intercepted, by using the validation call
    handler in conjunction with the Policy Injection application block. For more information
    on using interception, see Appendix C, “Policy Injection in Enterprise Library.”


    Each of the validators described in the previous section has a related attribute
    that you apply in your code, specifying the values for validation (such as the
    range or comparison value) as parameters to the attribute. For example, you can
    validate a property that must have a value between 0 and 10 inclusive by applying
    the following attribute to the property definition, as seen in the following code.


    ```

    <RangeValidator(0, RangeBoundaryType.Inclusive, 10, RangeBoundaryType.Inclusive)>

    ```


    # DataAnnotations Attributes


    In addition to using the built-in validation attributes, the Validation block
    will perform validation defined in the vast majority of the validation attributes
    in the System.ComponentModel.DataAnnotations namespace. These attributes are typically
    used by frameworks and object/relational mapping (O/RM) solutions that auto-generate
    classes that represent data items. They are also generated by the ASP.NET validation
    controls that perform both client-side and server-side validation. While the set
    of validation attributes provided by the Validation block does not map exactly
    to those in the DataAnnotations namespace, the most common types of validation
    are supported. A typical use of data annotations is shown here.'
  merge: -1
  img_proc: true
