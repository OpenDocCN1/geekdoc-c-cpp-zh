- pgno: 185
  md: "+   - If you do not specify a target type when you create an Object Validator\
    \ programmatically, you can use it to validate any type. When you call the **Validate**\
    \ method, you specify the target instance, and the Object validator creates a\
    \ type-specific validator for the type of the target instance. In contrast, the\
    \ validator to obtain from a factory can only be used to validate instances of\
    \ the type you specify when you obtain the validator. However, it can also be\
    \ used to validate subclasses of the specified type, but it will use the rules\
    \ defined for the specified target type.\n+   - The Object Validator will always\
    \ use rules in configuration for the type of the target object, and attributes\
    \ and self-validation methods within the target instance. In contrast, you can\
    \ use a specific factory class type to obtain validators that only validate the\
    \ target instance using one type of rule source (in other words, just configuration\
    \ rule sets, or just one type of attributes).\n+   - The Object Validator will\
    \ acquire a type-specific validator of the appropriate type each time you call\
    \ the **Validate** method, even if you use the same instance of the Object validator\
    \ every time. In contrast, a validator obtained from one of the factory classes\
    \ does not need to do this, and will offer improved performance.\n\nAs you can\
    \ see from the flexibility and performance advantages listed above, you should\
    \ generally consider using the **ValidatorFactory** approach for creating validators\
    \ to validate objects rather than creating individual Object Validator instances.\n\
    \n# ## Validating Collections of Objects\n\nBefore we leave the topic of validation\
    \ of objects, it is worth looking at how you can validate collections of objects.\
    \ The Object Collection validator can be used to check that every object in a\
    \ collection is of the specified type, and to perform validation on every member\
    \ of the collection. You can apply the Object Collection validator to a property\
    \ of a class that is a collection of objects using a Validation block attribute\
    \ if you wish, as shown in this example that ensures that the **ProductList**\
    \ property is a collection of **Product** instances, and that every instance in\
    \ the collection contains valid values.\n\n```\n```\n<ObjectCollectionValidator(GetType(Product))>\
    \ _\nReadOnly Property ProductList() As ProductList\n    Get\n        Return theProductList\n\
    \    End Get\nEnd Property\n```\n```\n\nYou can also create an Object Collection\
    \ validator programmatically, and use it to validate a collection held in a variable.\
    \ The example named Validating a Collection of Objects demonstrates this approach.\
    \ It creates a List named productList that contains two instances of the Product\
    \ class, one of which contains all valid values, and one that contains invalid\
    \ values for some of its properties. Next, the code creates an Object Collection\
    \ validator for the Product type and then calls the Validate method."
