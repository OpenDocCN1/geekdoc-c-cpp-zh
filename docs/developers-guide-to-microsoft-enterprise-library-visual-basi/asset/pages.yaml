  md: "# CACHING A USER IDENTITY AND OBTAINING A TEMPORARY TOKEN\n\nThe first example,\
    \ Authenticate a user and cache the identity, shows how you can use the Security\
    \ block to cache both an authenticated identity and a user principal, and return\
    \ temporary tokens that serve as an alternative to user credentials for the duration\
    \ of the user session. The following code, taken from the example, first checks\
    \ that the user is authenticated within the operating system and, if so, displays\
    \ details of the user’s identity using a separate routine named ShowUserIdentityDetails.\
    \ We’ll look at that routine in a short while.\n\nThe code then caches this Windows\
    \ identity in the security cache to obtain the token, and displays details of\
    \ this token. Then it generates a new generic principal for this identity, defining\
    \ it as a member of a role named FieldSalesStaff, and displays the details of\
    \ this new principal using another routine named ShowGenericPrincipalDetails.\
    \ Again, we’ll look at this routine in a short while. Next, the code caches the\
    \ generic principal, collects the token from the security cache, and displays\
    \ details of this token.\n\n```\n' Get current Windows Identity and check if authenticated.\n\
    Dim identity As WindowsIdentity = WindowsIdentity.GetCurrent()\nIf identity.IsAuthenticated\
    \ Then\n    Console.WriteLine(\"Current user identity obtained from Windows:\"\
    )\n    ShowUserIdentityDetails(identity)\n' Cache the Windows Identity and save\
    \ the token in a variable.\nidentityToken = secCache.SaveIdentity(identity)\n\
    Console.WriteLine(\"Current user identity has been cached.\")\nConsole.WriteLine(\"\
    The identity security token is '{0}'.\", _\n    identityToken.Value)\nConsole.WriteLine()\n\
    ' Generate a Generic Principal for this identity and save in cache.\nDim principal\
    \ As IPrincipal = New GenericPrincipal(identity, _\n    New String() {\"FieldSalesStaff\"\
    })\nConsole.WriteLine(\"Created a new Generic Principal for this user.\")\nShowGenericPrincipalDetails(principal)\n\
    principalToken = secCache.SavePrincipal(principal)\nConsole.WriteLine(\"Current\
    \ user principal has been cached.\")\nConsole.WriteLine(\"The IPrincipal security\
    \ token is '{0}'.\", _\n    principalToken.Value)\nElse\n    Console.WriteLine(\"\
    Current user is not authenticated.\")\nEnd If\n```\n\nThe tokens are stored in\
    \ program-wide variables and are therefore available to code in the other examples\
    \ for this chapter."
  merge: -1
  img_proc: true
