  md: "```\nSub ShowDetailsAndAddExtraInfo(ByVal entry As LogEntry)\n\n    ' Display\
    \ information about the Trace Sources and Listeners for this LogEntry.\n    Dim\
    \ sources As IEnumerable(Of LogSource) _\n        = defaultWriter.GetMatchingTraceSources(entry)\n\
    \n    For Each source As LogSource In sources\n        Console.WriteLine(\"Log\
    \ Source name: '{0}'\", source.Name)\n        For Each listener As TraceListener\
    \ In source.Listeners\n            Console.WriteLine(\" - Listener name: '{0}'\"\
    , listener.Name)\n        Next\n    Next\n    ...\n```\n\n# Checking if Filters\
    \ Will Block a Log Entry\n\nNext, the ShowDetailsAndAddExtraInfo method checks\
    \ if any filters will block the current log entry. There are two ways you can\
    \ do this. You can query each filter type in turn, or just a specific filter type,\
    \ by using the GetFilter method of the LogWriter class to get a reference to that\
    \ type of filter. Then you can check if this filter is enabled, and also use the\
    \ ShouldLog method (to which you pass the list of categories for the log entry)\
    \ to see if logging will succeed.\n\nThe following code shows this approach. It\
    \ also shows the simpler approach that you can use if you are not interested in\
    \ the result for a specific filter type. The LogWriter class also exposes the\
    \ ShouldLog method, which indicates if any filters will block this entry.\n\n\
    ```\n...\n    ' Check if any filters will block this LogEntry.\n    ' This approach\
    \ allows you to check for specific types of filter.\n    ' If there are no filters\
    \ of the specified type configured, the GetFilter\n    ' method returns null,\
    \ so check this before calling the ShouldLog method.\n    Dim catfilter As CategoryFilter\
    \ = defaultWriter.GetFilter(Of CategoryFilter)()\n    If catfilter Is Nothing\
    \ OrElse catfilter.ShouldLog(entry.Categories) Then\n        Console.WriteLine(\"\
    Category Filter(s) will not block this LogEntry.\")\n    Else\n        Console.WriteLine(\"\
    A Category Filter will block this LogEntry.\")\n    End If\n\n    Dim prifilter\
    \ As PriorityFilter = defaultWriter.GetFilter(Of PriorityFilter)()\n    If prifilter\
    \ Is Nothing OrElse prifilter.ShouldLog(entry.Priority) Then\n        Console.WriteLine(\"\
    Priority Filter(s) will not block this LogEntry.\")\n    Else\n        Console.WriteLine(\"\
    A Priority Filter will block this LogEntry.\")\n    End If\n\n    ' Alternatively,\
    \ a simple approach can be used to check for any type of filter\n    If defaultWriter.ShouldLog(entry)\
    \ Then\n```"
