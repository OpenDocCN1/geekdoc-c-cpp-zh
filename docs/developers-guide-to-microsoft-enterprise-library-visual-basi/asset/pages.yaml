    ' Call the ExecuteScalar method of the command.\nConsole.WriteLine(\"Result using\
    \ a stored procedure: {0}\", _\n    defaultDB.ExecuteScalar(sprocCmd).ToString())\n\
    End Using\n```\n\nYou can see the code listed above running in the example Return\
    \ a single scalar value from a SQL statement or stored procedure. The somewhat\
    \ unexciting result it produces is shown here.\n\n```\nResult using a SQL statement:\
    \ Alabama\nResult using a stored procedure: Alabama\n```\n\n# RETRIEVING DATA\
    \ ASYNCHRONOUSLY\n\nHaving looked at all of the main ways you can extract data\
    \ using the Data Access block, we’ll move on to look at some more exciting scenarios\
    \ (although many would perhaps fail to consider anything connected with data access\
    \ exciting...). Databases are generally not renowned for being the fastest of\
    \ components in an application—in fact many people will tell you that they are\
    \ major bottleneck in any enterprise application. It’s not that they are inefficient,\
    \ it’s usually just that they contain many millions of rows, and the queries you\
    \ need to execute are relatively complex. Of course, it may just be that the query\
    \ is badly written and causes poor performance, but that’s a different story.\n\
    \nOne way that applications can minimize the performance hit from data access\
    \ is to perform it asynchronously. This means that the application code can continue\
    \ to execute, and the user interface can remain interactive during the process.\
    \ Asynchronous data access may not suit every situation, but it can be extremely\
    \ useful."
