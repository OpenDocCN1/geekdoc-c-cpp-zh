- pgno: 107
  md: '# Extending Your Exception Handling


    Like all of the Enterprise Library application blocks, the Exception Handling
    block is extensible. You can create new exception handlers and exception formatters
    if you need to perform specific tasks that the block does not implement by default.
    For example, you could create an exception handler that displays the exception
    details in a dialog, creates an XML message, or generates a Web page. All that
    is required is that you implement the **IExceptionHandler** interface defined
    within the block. This interface contains one method named **HandleException**
    that the Exception Handling block will execute when you add your handler to a
    policy chain.


    The Exception Handling block uses formatters to create the message sent to the
    Logging block when you use a **Logging** handler. The two formatters provided
    are the **TextExceptionFormatter** and the **XmlExceptionFormatter**. The **TextExceptionFormatter**
    generates a simple text format for the error message, as you have seen in the
    previous sections of this chapter. The **XmlExceptionFormatter** generates, as
    you would expect, an XML-formatted document as the error message. You can create
    custom formatters if you want to control the exact format of this information.
    You simply create a new class that derives from the **ExceptionFormatter** base
    class in the Exception Handling block, and override the several methods it contains
    for formatting the exception information as required.


    # Summary


    In this chapter you have seen why, when, and how you can use the Enterprise Library
    Exception Handling block to create and implement exception handling strategies.
    Poor error handling can make your application difficult to manage and maintain,
    hard to debug and test, and may allow it to expose sensitive information that
    would be useful to attackers and malicious users.


    A good practice for exception management is to implement strategies that provide
    a controlled and decoupled approach to exception handling through configurable
    policies. The Exception Handling block makes it easy to implement such strategies
    for your applications, irrespective of their type and complexity. You can use
    the Exception Handling block in Web and Windows Forms applications, Web services,
    console-based applications and utilities, and even in administration scripts and
    applications hosted in environments such as SharePoint®, Microsoft Office applications,
    other enterprise systems.


    This chapter demonstrated how you can implement common exception handling patterns,
    such as Exception Shielding, using techniques such as wrapping, replacing, and
    logging exceptions. It also demonstrated how you can handle different types of
    exceptions, assist administrators by using unique exception identifiers, and extend
    the Exception Handling block to perform tasks that are specific to your own requirements.'
  merge: -1
  img_proc: true
