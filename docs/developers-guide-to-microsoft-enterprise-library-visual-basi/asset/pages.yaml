    \ TO PERFORM A TASK\n\nOne of the main reasons for using the Security block to\
    \ manage identities is that it makes it easy to check if a user is authorized\
    \ to perform a specified task or operation. The Security block contains two authorization\
    \ providers, though you can create your own and integrate them with the Security\
    \ block if you wish.\n\nTo check if a user is authorized, you call the Authorize\
    \ method of an authorization provider, passing to it the user principal and the\
    \ name of the task or operation. The Authorize method returns either True or False.\
    \ The two providers included in the block are the authorization rule provider\
    \ and the AzMan authorization provider (for details of these providers, see “What\
    \ Are Authorization Rule Providers?” near the beginning of this chapter). The\
    \ examples we present for this chapter include one that uses the authorization\
    \ rule provider and one that uses the AzMan authorization provider.\n\n# Using\
    \ Security Block Configured Rules\n\nIf you only need to store authorization rules\
    \ within the configuration of your application and have them fully managed by\
    \ the Security block, you can use the authorization rule provider. As you saw\
    \ earlier in this chapter, you configure a series of authorization rules for your\
    \ application. Each rule defines an expression that specifies which users can\
    \ access a specific task or carry out a specific operation.\n\nThe example Authorize\
    \ a user for a process using a stored rule demonstrates this approach to authorization.\
    \ In the application configuration we defined two rules:\n\n+   * The rule named\
    \ UpdateSalesData uses the expression “R:Administrators OR R:SalesManagers.” This\
    \ allows a user who is a member of the Administrators role or the SalesManagers\
    \ role to execute this task.\n\n+   * the rule named ReadSalesData uses the expression\
    \ “R:Users OR R:FieldSalesStaff OR R:SalesManagers.” This allows a user who is\
    \ a member of the Users, FieldSalesStaff, or SalesManagers role to execute this\
    \ task."
