- pgno: 66
  md: "obtain a reference to the accessor that was executed from the AsyncState (casting\
    \ it to an instance of the DataAccessor base type so that the code will work with\
    \ any accessor implementation), and then call the EndExecute method of the accessor\
    \ to obtain a reference to the sequence of objects the accessor retrieved from\
    \ the database.\n\n# UPDATING DATA\n\nSo far, we've looked at retrieving data\
    \ from a database using the classes and methods of the Data Access block. Of course,\
    \ while this is typically the major focus of many applications, you will often\
    \ need to update data in your database. The Data Access block provides features\
    \ that support data updates. You can execute update queries (such as INSERT, DELETE,\
    \ and UPDATE statements) directly against a database using the ExecuteNonQuery\
    \ method. In addition, you can use the ExecuteDataSet, LoadDataSet, and UpdateDataSet\
    \ methods to populate a DataSet and push changes to the rows back into the database.\
    \ We'll look at both of these approaches here.\n\n# Executing an Update Query\n\
    \nThe Data Access block makes it easy to execute update queries against a database.\
    \ By update queries, we mean inline SQL statements, or SQL statements within stored\
    \ procedures, that use the UPDATE, DELETE, or INSERT keywords. You can execute\
    \ these kinds of queries using the ExecuteNonQuery method of the Database class.\n\
    \nLike the ExecuteReader method we used earlier in this chapter, the ExecuteNonQuery\
    \ method has a broad set of overloads. You can specify a CommandType (the default\
    \ is StoredProcedure) and either a SQL statement or a stored procedure name. You\
    \ can also pass in an array of Object instances that represent the parameters\
    \ for the query. Alternatively, you can pass to the method a Command object that\
    \ contains any parameters you require. There are also Begin and End versions that\
    \ allow you to execute update queries asynchronously.\n\nThe following code from\
    \ the example application for this chapter shows how you can use the ExecuteNonQuery\
    \ method to update a row in a table in the database. It updates the Description\
    \ column of a single row in the Products table, checks that the update succeeded,\
    \ and then updates it again to return it to the original value (so that you can\
    \ run the example again). The first step is to create the command and add the\
    \ required parameters, as you've seen in earlier examples, and then call the ExecuteNonQuery\
    \ method with the command as the single parameter. Next, the code changes the\
    \ value of the command parameter named description to the original value in the\
    \ database, and then executes the compensating update.\n\n```\nDim oldDescription\
    \ As String _\n    = \"Carries 4 bikes safely; steel construction, fits 2\"\"\
    \ receiver hitch.\"\nDim newDescription As String = \"Bikes tend to fall off after\
    \ a few miles.\"\n' Create command to execute stored procedure and add parameters.\n\
    Dim cmd As DbCommand = defaultDb.GetStoredProcCommand(\"UpdateProductsTable\"\
    )\ndefaultDb.AddInParameter(cmd, \"productID\", DbType.Int32, 84)\ndefaultDb.AddInParameter(cmd,\
    \ \"description\", DbType.String, newDescription)\n```"
