    # RETRIEVING DATA AS OBJECTS


    Modern programming techniques typically concentrate on data as objects. This approach
    is useful if you use Data Transfer Objects (DTOs) (see http://msdn.microsoft.com/en-us/library/ms978717.aspx)
    to pass data around you application layers, implement a data access layer using
    O/RM techniques, or want to take advantage of new client-side data querying techniques
    such as LINQ.


    The Data Access block is not, in itself, an O/RM solution; but it contains features
    that allow you to extract data using a SQL statement or a stored procedure as
    the query, and have the data returned to you as a sequence of objects that implements
    the IEnumerable interface. This allows you to execute queries, or obtain lists
    or arrays of objects that represent the original data in the database.


    # About Accessors


    The block provides two core classes for performing this kind of query: the SqlProcAccessor
    and the SqlStringAccessor. You can create and execute these accessors in one operation
    using the ExecuteSqlProcAccessor and ExecuteSqlSqlAccessor methods of the Database
    class, or create a new accessor directly and then call its Execute method.


    Accessors use two other objects to manage the parameters you want to pass into
    the accessor (and on to the database as it executes the query), and to map the
    values in the rows returned from the database to the properties of the objects
    it will return to the client code. Figure 2 shows the overall process.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '![](img/d7009d38323c3b86f2dfbc5155fbf141_56_0.png)


    # FIGURE 2

    Overview of data accessors and the related types


    The accessor will attempt to resolve the parameters automatically using a default
    mapper if you do not specify a parameter mapper. However, this feature is only
    available for stored procedures executed against SQL Server and Oracle databases.
    It is not available when using SQL statements, or for other databases and providers,
    where you must specify a custom parameter mapper that can resolve the parameters.


    If you do not specify an output mapper, the block uses a default map builder class
    that maps the column names of the returned data to properties of the objects it
    creates. Alternatively, you can create a custom mapping to specify the relationship
    between columns in the row set and the properties of the objects.


    > Inferring the details required to create the correct mappings means that the
    default parameter and output mappers can have an effect on performance. You may
    prefer to create your own custom mappers and retain a reference to them for reuse
    when possible to maximize performance of your data access processes when using
    accessors.'
  merge: -1
  img_proc: true
- pgno: 57
  md: "For a full description of the techniques for using accessors, see the Enterprise\
    \ Library documentation on MSDN® at http://go.microsoft.com/fwlink/?LinkId=188874,\
    \ or installed with Enterprise Library. This chapter covers only the simplest\
    \ approach: using the **ExecuteProcAccessor** method of the **Database** class.\n\
    \n# Creating and Executing an Accessor\n\nThe following code shows how you can\
    \ use an accessor to execute a stored procedure and then manipulate the sequence\
    \ of objects that is returned. You must specify the object type that you want\
    \ the data returned as—in this example it is a simple class named **Product**\
    \ that has the three properties: **ID**, **Name**, and **Description**.\n\nThe\
    \ stored procedure takes a single parameter that is a search string, and returns\
    \ details of all products in the database that contain this string. Therefore,\
    \ the code first creates an array of parameter values to pass to the accessor,\
    \ and then calls the **ExecuteProcAccessor** method. It specifies the **Product**\
    \ class as the type of object to return, and passes to the method the name of\
    \ the stored procedure to execute and the array of parameter values.\n\n```\n\
    ' Create an object array and populate it with the required parameter values.\n\
    Dim params() As Object = New Object() {\"%bike%\"}\n\n' Create and execute a sproc\
    \ accessor that uses default\n' parameter and output mappings.\nDim productData\
    \ = defaultDB.ExecuteProcAccessor(Of Product)(\"GetProductList\", _\n    params)\n\
    \n' Perform a client-side query on the returned data. Be aware that\n' the orderby\
    \ and filtering is happening on the client, not the database.\nDim results = From\
    \ productItem In productData _\n    Where Not productItem.Description Is Nothing\
    \ _\n    Order By productItem.Name _\n    Select New Product(productItem.Name,\
    \ productItem.Description)\n\n' Display the results\nFor Each item In results\n\
    \    Console.WriteLine(\"Product Name: {0}\", item.Name)\n    Console.WriteLine(\"\
    Description: {0}\", item.Description)\n    Console.WriteLine()\nNext\n```\n\n\
    The accessor returns the data as a sequence that, in this example, the code handles\
    \ using a LINQ query to remove all items where the description is empty, sort\
    \ the list by name, and then create a new sequence of objects that have just the\
    \ **Name** and **Description** properties. For more information on using LINQ\
    \ to query sequences, see http://msdn.microsoft.com/en-us/library/bb397676."
