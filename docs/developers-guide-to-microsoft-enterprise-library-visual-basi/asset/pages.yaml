    # # Creating Custom Cryptography Providers


    While the Cryptography block contains providers for a range of hashing and encryption
    algorithms, you may find that you have specific requirements that none of these
    algorithms can satisfy. For example, you may wish to perform some company-specific
    encryption technique, or implement a non-standard hashing algorithm. You may even
    want to apply multiple levels of encryption based on business requirements or
    data handling standards relevant to your industry.


    > > Be aware that you may introduce vulnerabilities into your application by using
    non-standard or custom encryption algorithms. The strength of any algorithm you
    use must be verified as being suitable for your requirements, and rechecked regularly
    to ensure that new decryption techniques or known vulnerabilities do not compromise
    your application.


    You can implement a custom hashing provider or a custom encryption provider, and
    integrate them with Enterprise Library. The Cryptography block contains two interfaces,
    IHashProvider and ISymmetricCryptoProvider, that define hashing and encryption
    provider requirements. For a custom hashing provider, you must implement the Create
    Hash and CompareHash methods based on the hashing algorithm you choose. For a
    custom encryption provider, you must implement the Encrypt and Decrypt methods
    based on the encryption algorithm you choose.


    One other way that you may want to modify the block is to change the way that
    it creates and stores keys. By default, it stores keys that you provide or generate
    for the providers in DPAPI-encrypted disk files. You can modify the KeyManager
    class in the block to change this behavior, and modify the Wizard that helps you
    to specify the key in the configuration tools.


    For more information about extending and modifying the Cryptography block, see
    the online documentation and the help files installed with Enterprise Library.'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# Summary


    This chapter looked at the Cryptography Application Block. It began by discussing
    cryptographic techniques and strategies for which the block is suitable, and helped
    you decide how you might use the block in your applications. The two most common
    scenarios are symmetric encryption/decryption of data, and creating hash values
    from data. Symmetric encryption is useful whenever you need to protect data that
    you are storing or sending across a network. Hashing is useful for tasks such
    as storing passwords so that you can confirm user identity without allowing the
    passwords to be visible to anyone who may access the database or intercept the
    passwords as they pass over a network.


    Many types of cryptographic algorithms that you may use with the Cryptography
    block require access to a key for both encryption and decryption. It is vitally
    important that you protect this key both to prevent unauthorized access to the
    data and to allow you to encrypt it when required. The Cryptography block protects
    key files using DPAPI encryption.


    The bulk of the chapter then explored the main techniques for using the block.
    This includes encrypting and decrypting data, creating a hash value, and comparing
    hash values (for example, when verifying a submitted user password). As you have
    seen, the block makes these commonly repeated tasks much simpler, while allowing
    the configuration to be easily managed post-deployment and at run time by administrators
    and operations staff.'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# # An Authentic Approach to Token Identity


    # ## Introduction


    I guess most people have seen a sitcom on TV where some unfortunate member of
    the cast is faced with a large red button carrying a sign that says “Do not press
    this button.” You know that, after the requisite amount of facial contortions
    and farcical fretting, they are going to press the button and some comedic event
    will occur. So it’s reasonably certain that any user authorization strategy you
    adopt that contains an element that simply asks the user not to press button unless
    he is a manager or administrator is not likely to provide a secure environment
    for your enterprise application.


    User authorization—controlling what your users can and cannot do with your application—is
    a vital ingredient of a robust security strategy. In general, an application UI
    should prevent users from attempting actions for which they are not eligible;
    usually by disabling or even hiding controls that, depending on their permissions
    within the application, they are not permitted to use. And, of course, the application
    should check that users are authorized to carry out all operations that they initiate,
    whether it is through a UI or as a call from another layer or segment of the application.


    The Security Application Block provides features that can help you to implement
    authorization for your applications, and can simplify the task by allowing you
    to maintain consistent security practices across the entire application and your
    enterprise as a whole. It makes it easier for you to implement authorization using
    standard practices, and you can extend the block to add specific functionality
    that you require for your own scenarios.'
  merge: -1
  img_proc: true
- pgno: 218
  md: '# What Does the Security Block Do?


    The Security Application Block implements two related features. It provides the
    capability to configure and manage sets of authorization rules using a variety
    of rule providers, and can help you to cache credentials for your application
    to use where it must make repeated authorization checks. These two features combine
    to provide an environment for implementing authorization in a flexible way, while
    allowing the details of the authorization policies (the sets of rules) to be administered
    without requiring changes to the application—eliminating the requirement to recompile,
    test, and redeploy the application as the policies change. It also means that
    administrators can manage the policies using Group Policy if required.


    In your application code, you can quickly and easily create tokens for users,
    cache these tokens, expire them, and check if users are authorized to perform
    specific tasks or operations. These features make use of one or more authorization
    rule providers and security caches that you define for your application, and even
    use across multiple applications. The following sections of this chapter explain
    what an authorization rule provider and a security cache are, and how they help
    you to implement a security strategy for your applications.


    # WHAT ARE AUTHORIZATION RULE PROVIDERS?


    An authorization rule provider is a component or service that allows you to define
    rules. Using a rule you specify a task or operation that users may perform, and
    you then allocate users and groups to this task or operation. The Security block
    uses these rules to determine whether a specific user or role is authorized to
    execute a specified task or operation.


    The Security block includes a rule provider that stores the information as a series
    of expressions, one for each task or operation, in the application configuration
    file. You can encrypt this section of the configuration file to prevent anyone
    who can access it from being able to see the expressions. Alternatively, you can
    use the Windows® Authorization Manager (AzMan) provider, part of the current Microsoft®
    Windows® operating systems, which allows you to store the authorization rules
    in a variety of locations, and include Windows users and groups in the rules.
    Enterprise Library includes an assembly named Microsoft.Practices.EnterpriseLibrary.Security.AzMan.dll
    that allows it to interact with AzMan.


    # About Authorization Manager (AzMan)


    While it''s useful to be able to define your security roles and authorization
    rules in the application configuration file, what would be really cool is to be
    able to make use of the groups, roles, and user accounts already defined on your
    system or network, and store the rules in some portable format such as an XML
    file or (perhaps less portable) a database. The details of Windows users and groups
    are stored in Active Directory®, and—while you can write code to access the information—using
    Active Directory is not'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'a trivial exercise. Windows Authorization Manager (AzMan) gives you a way to
    access this information, and administer security rules in other locations, without
    requiring complex code. It even provides a GUI that you can use to create authorization
    rules and administer these rules.


    The Windows AzMan provider is part of the operating system in Windows XP Professional
    and Windows Server® 2003 and later. The GUI is part of the operating system in
    Windows Vista® and Windows Server 2003 later. In Windows Vista, Windows Server®
    2008, and Windows 7, AzMan provides additional capabilities. For more information
    about AzMan, see the following resources:


    +   - "Authorization Manager" (Overview) at http://technet.microsoft.com/en-us/library/cc732290.aspx.

    +   - "Authorization Manager" (Details) at http://technet.microsoft.com/en-us/library/cc732077(WS.10).aspx.

    +   - "How to install and administer the Authorization Manager in Windows Server
    2003" at http://support.microsoft.com/kb/324470.


    AzMan allows you to define an application, the roles for that application, and
    the operations (such as submit order or approve expenses) that the application
    exposes. For each operation, you can define users and groups that can execute
    that operation. You can include local and domain user accounts and account groups
    stored in Active Directory. You can store your authorization rules in Active Directory,
    in an XML file, or in a database.


    # WHY DO I NEED A SECURITY CACHE?


    Unless all of the features of your application are meant to be completely available
    to anonymous users, you will need to authenticate users and definitively identify
    each one. You can then determine what that user is and is not permitted to do
    inside your application. Common approaches to authentication include logon dialogs
    where users enter their user name and password (and, perhaps, additional information
    that helps to confirm their identity), and other mechanisms such as smart card
    readers, fingerprint readers, and more.


    You may force users to authenticate when they first access the application, or
    at some later stage when they try to execute some activity that has limited permissions.
    This really depends on whether you want to hide or disable elements of the UI,
    or you are happy to accept requests and then authenticate at that point in your
    application. For example, a Web service application will usually authenticate
    users when a request is received, while a Windows Forms application will usually
    authenticate users when they start the application.


    What you don''t want to do is continually annoy users by forcing them to reauthenticate
    every time they try to execute some operation or carry out some task. For example,
    if you are browsing a shopping Web site and adding to your cart all of those science
    fiction DVDs you want to be able to watch over and over again, you wouldn''t expect
    to have to enter your account logon details for every item. Once your application
    knows who a user is, it should reuse the results of the initial authentication
    if possible.'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'To be able to do this, you must cache the user’s credentials for a predetermined
    period when you first authenticate them, and generate a token that represents
    the user. You may decide to cache the credentials for the duration that a Windows
    Forms application is running, or for the duration of the user’s session in ASP.NET.
    You may even decide to persist them in a cache that survives application and machine
    restarts (such as the user-specific isolated storage mechanism) if you want to
    allow the logged-on user of the machine to be able to access the application without
    reauthenticating. An example is the Windows operating system, which forces you
    to log on when you first start it up, but can then reuse persistently cached credentials
    to connect to other resources such as mapped drives.


    The Security Application Block allows you to configure one or more Security Caches
    that use an in-memory cache, and optionally a persistent backing store, to cache
    user credentials for specific periods and obtain a token that you can use to check
    the user’s identity at some future stage in your application.


    > *An alternative approach to caching identities you may consider is to use the
    Microsoft .NET Framework version 4.0 System.Runtime.Caching capabilities. However,
    you would then need to implement suitable methods that accept and return identities,
    and ensure that you correctly secure the stored content.*


    # # How Do I Configure the Security Block?


    Like all of the Enterprise Library application blocks, you start by configuring
    your application to use the block, as demonstrated in Chapter 1, “Introduction.”
    The Security Settings section of the configuration for the Security block contains
    three areas, shown in Figure 1. The first is where you specify the authorization
    providers you want to use. Below that is the area where you configure one or more
    security caches for your security tokens. Your code can store tokens in this cache,
    and retrieve them when required. You can even persist the credentials across application
    restarts by defining backing stores for credentials. The third area is where you
    configure the authorization rules that define the users, groups, and operations
    related to your application.'
  merge: -1
  img_proc: true
- pgno: 221
  md: '![](img/d7009d38323c3b86f2dfbc5155fbf141_221_0.png)


    # FIGURE 1 The security settings section


    Figure 1 shows the configuration for the example application we provide for this
    chapter. You can see the areas where we defined the authorization providers and
    the security cache. Because we specified the Caching Application Block as the
    security cache, the configuration tool added the Caching block to the configuration
    automatically. We added an isolated storage backing store to the Caching block
    to persist credentials, and specified a symmetric storage provider for this store
    to protect the persisted credentials. This automatically added the Cryptography
    block to the configuration, and we specified a DPAPI symmetric crypto provider
    to perform the encryption.'
