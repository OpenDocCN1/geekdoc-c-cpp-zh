    # TRACING AND CORRELATING ACTIVITIES


    The final topic for this chapter demonstrates another feature of the Logging block
    that makes it easier to correlate multiple log entries when you are trying to
    trace or debug some recalcitrant code in your application. One of the problems
    with logging is that relying simply on the event ID to correlate multiple events
    that are related to a specific process or section of code is difficult and error
    prone. Event IDs are often not unique, and there can be many events with the same
    event ID generated from different instances of the components in your application
    that are intermixed in the logs.


    The Logging block makes it easy to add an additional unique identifier to specific
    log entries that you can later use to filter the log and locate only entries related
    to a specific process or task. The Logging block tracing feature makes use of
    the .NET Correlation Manager class, which maintains an Activity ID that is a GUID.
    By default, this is not set, but the Logging block allows you to use a TraceManager
    to generate Tracer instances. Each of these sets the Activity ID to a randomly
    generated GUID value that is maintained only during the context of the tracer.
    The Activity ID returns to its previous value when the tracer is disposed or goes
    out of scope.


    You specify an operation name when you create the tracer. This is effectively
    the name of a category defined in the configuration of the block. All log entries
    created within the context of the tracer will be assigned to that category in
    addition to any categories you specify when you create the log entry.


    You can specify a GUID value when you create and start a tracer, and all subsequent
    log entries within the scope of that tracer and all nested tracers that do not
    specify a different GUID will have the specified activity ID. If you start a new
    nested tracer instance within the scope of a previous one, it will have the same
    activity ID as the parent tracer unless you specify a different one when you create
    and start the nested tracer; in that case, this new activity ID will be used in
    subsequent log entries within the scope of this tracer.'
  merge: -1
  img_proc: true
- pgno: 136
  md: "Although the Logging block automatically adds the activity ID to each log entry,\
    \ this does not appear in the resulting message when you use the text formatter\
    \ with the default template. To include the activity ID in the logged message\
    \ that uses a text formatter, you must edit the template property in the configuration\
    \ tools to include the token {property(ActivityId)}. Note that property names\
    \ are case-sensitive in the template definition.\n\n# An Example of Tracing Activities\n\
    \nThe example, Tracing activities and publishing activity information to categories,\
    \ should help to make this clear. At the start of the application, the code resolves\
    \ a TraceManager instance from the Enterprise Library container in the same way\
    \ as we resolved the LogWriter we've been using so far.\n\n```\n' Resolve a TraceManager\
    \ object from the container.\nDim traceMgr As TraceManager _\n    = EnterpriseLibrary.Current.GetInstance(Of\
    \ TraceManager)()\n```\n\nNext, the code creates and starts a new Tracer instance\
    \ using the StartTrace method of the TraceManager, specifying the category named\
    \ General. As it does not specify an Activity ID value, the TraceManager creates\
    \ one automatically. This is the preferred approach, because each separate process\
    \ running an instance of this code will generate a different GUID value. This\
    \ means you can isolate individual events for each process.\n\nThe code then creates\
    \ and writes a log entry within the context of this tracer, specifying that it\
    \ belongs to the DiskFiles category in addition to the General category defined\
    \ by the tracer. Next, it creates a nested Tracer instance that specifies the\
    \ category named Database, and writes another log entry that itself specifies\
    \ the category named Important. This log entry will therefore belong to the General,\
    \ Database, and Important categories. Then, after the Database tracer goes out\
    \ of scope, the code creates a new Tracer that again specifies the Database category,\
    \ but this time it also specifies the Activity ID to use in the context of this\
    \ new tracer. Finally, it writes another log entry within the context of the new\
    \ Database tracer scope.\n\n```\n' Start tracing for category 'General'. All log\
    \ entries within trace context\n' will be included in this category and use any\
    \ specified Activity ID (GUID).\n' If you do not specify an Activity ID, the TraceManager\
    \ will create a new one.\nUsing traceMgr.StartTrace(\"General\")\n```\n\n```\n\
    ' Write a log entry with another category, will be assigned to both.\ndefaultWriter.Write(\"\
    LogEntry with category 'DiskFiles' created within \" _\n    & \"context of 'General'\
    \ category tracer.\", \"DiskFiles\")\n```\n\n```\n' Start tracing for category\
    \ 'Database' within context of 'General' tracer.\n' Do not specify a GUID to use\
    \ so that the existing one is used.\nUsing traceMgr.StartTrace(\"Database\")\n\
    ```"
