- pgno: 156
  md: '```

    '' Create an expiration that never expires

    Dim never As New NeverExpired()

    '' Create a text file to use in a FileDependency

    File.AppendAllText("ATextFile.txt", "Some contents for the file")

    '' Create an expiration dependency on the new text file

    Dim fileDep As New FileDependency("ATextFile.txt")

    ```


    Next, the code creates an instance of the ExtendedFormatTime class. This class
    allows you to specify expiration times for the cached item based on a repeating
    schedule. It provides additional opportunities compared to the more common SlidingTime
    and AbsoluteTime expiration types you have seen so far.


    The constructor of the ExtendedFormatTime class accepts a string value that it
    parses into individual values for the minute, hour, day, month, and weekday (where
    zero is Sunday) that together specify the frequency with which the cached item
    will expire. Each value is delimited by a space. An asterisk indicates that there
    is no value for that part of the format string, and effectively means that expiration
    will occur for every occurrence of that item. It all sounds very complicated,
    so some examples will no doubt be useful (see Table 2).


    | Extended Format String | Meaning |

    | :--- | :--- |

    | * * * * * | Expires every minute. |

    | 5 * * * * | Expires at the 5th minute of every hour. |

    | * 21 * * * | Expires every minute of the 21st hour of every day. |

    | 31 15 * * * | Expires at 3:31 PM every day. |

    | 7 4 * * 6 | Expires every Saturday 4:07 AM. |

    | 15 21 4 7 * | Expires at 9:15 PM on every 4th of July. |


    The example generates an ExtendedFormatTime that expires at 30 minutes past every
    hour. Then it creates an array of type ICacheItemExpiration that contains the
    File Dependency created earlier and the new ExtendedFormatTime instance.


    ```

    '' Create an extended expiration for 30 minutes past every hour

    Dim extTime As New ExtendedFormatTime("30 * * * *")

    '' Create array of expirations containing the file dependency and extended format

    Dim exp As ICacheItemExpiration() = _

    = New ICacheItemExpiration() {fileDep, extTime}

    ```'
