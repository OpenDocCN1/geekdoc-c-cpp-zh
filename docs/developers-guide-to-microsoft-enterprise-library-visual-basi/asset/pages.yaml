  md: 'You can also implement custom cache managers and cache backing stores and integrate
    these with the Caching Application Block to provide a custom caching mechanism
    for credentials, and implement a custom cryptography provider for the Cryptography
    Application Block that you can then use to encrypt cached credentials. For more
    information about creating custom providers, cache managers, and backing stores,
    see the online documentation and the help files installed with Enterprise Library
    and available online at http://go.microsoft.com/fwlink/?LinkId=188874.


    # Summary


    This chapter described how you can use the Security Application Block to simplify
    common tasks such as caching authenticated user credentials and checking if users
    are authorized to perform specific tasks. While the code required to implement
    these tasks without using the Security Block is not overly onerous, the block
    does save you the effort of writing and testing the same code in multiple locations.
    It also allows you to use a variety of different cache and authorization providers,
    depending on your requirements, and change the provider through configuration.
    Administrators and operators will find this feature useful when they come to deploy
    your applications in different environments.


    The chapter described the scenarios for using the Security block, and explained
    the concepts of authorizing users and caching credentials. It then presented detailed
    examples of how you can use the features of the block in a sample application.
    You will find more details on specific tasks, such as configuration and deployment,
    in online documentation and the help files installed with Enterprise Library.'
