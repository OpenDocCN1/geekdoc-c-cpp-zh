- pgno: 118
  md: '# About Logging Categories


    Categories are the way that Enterprise Library routes events sent to the block
    to the appropriate target, such as a database, the event log, an e-mail message,
    and more. The previous example makes use of the default configuration for the
    Logging block. When you add the Logging block to your application configuration
    using the Enterprise Library configuration tools, it contains the single category
    named **General** that is configured to write events to the Windows Application
    Event Log.


    You can change the behavior of logging for any category. For example, you can
    change the behavior of the previous example by reconfiguring the event log trace
    listener specified for the **General** category, or by reconfiguring the text
    formatter that this trace listener uses. You can change the event log to which
    the event log trace listener sends events; edit the template used by the text
    formatter; or add other trace listeners.


    However, it''s likely that your application will need to perform different types
    of logging for different tasks. The typical way to achieve this is to define additional
    categories, and then specify the type of trace listener you need for each category.
    For example, you may want to send audit information to a text file or an XML file,
    to a database, or both; instead of to Windows Event Log. Or you may want to send
    indications of catastrophic failures to administrators as e-mail messages. If
    you are using an enterprise-level monitoring system, you may instead prefer to
    write events to the WMI subsystem, or send them to another system through Windows
    Message Queuing.


    You can easily add categories to your application configuration. The approach
    is to add the trace listeners for the logging targets you require, such as the
    flat file trace listener or database trace listener to the **Logging Target Listeners**
    section, and then add the categories you require to the **Category Filters** section.
    Finally, you link them together in any combination by adding each of the required
    trace listener(s) to the category filter in the **Category Filters** section.
    Figure 4 shows this type of configuration, where the General category will output
    log messages to an event log listener and a database trace listener.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '![](img/d7009d38323c3b86f2dfbc5155fbf141_119_0.png)


    # FIGURE 4 Configuring trace listeners for different categories


    You can specify two properties for each category (source) you add, and for the
    default **General** category. You can set the **Auto Flush** property to specify
    that the block should flush log entries to their configured target trace listeners
    each time as soon as they are written to the block, or only when you call the
    **FlushContextItems** method of the **LogWriter**. If you set the **Auto Flush**
    property to **False**, ensure that your code calls this method when an exception
    or failure occurs to avoid losing any cached logging information.


    The other property you can set for each category is the **Minimum Severity** (which
    sets the **Source Levels** property of each listener). This specifies the minimum
    severity (such as Warning or Critical) for the log entries that the category filter
    will pass to its'
