    # REMOVING ITEMS FROM AND FLUSHING THE CACHE


    Having seen how you can add items to your cache, and use a variety of backing
    store options and encryption, it’s time now to see how you can manipulate the
    cache to remove items, or clear it completely by flushing it. Items are removed
    from the cache automatically based on their expiration or dependencies, but you
    can also remove individual items or remove all items.


    The example, Remove and flush cached items, actually demonstrates more than just
    removing and flushing items—it shows how you can use a dependency to remove related
    items from your cache, how to create extended time expirations, and how to use
    an array of expirations. There is quite a lot of code in this example, so we’ll
    step through it and explain each part in turn.


    # Using a File Dependency and Extended Time Expiration


    The example starts by creating a NeverExpired expiration instance, followed by
    writing a text file to the current execution folder. It then creates a FileDependency
    on that file. This is a typical scenario where you read data from a file, such
    as a text file or an XML document, which you will access frequently in your code.
    However, if the original file is changed or deleted, you want the equivalent cached
    item to be removed from the cache.'
