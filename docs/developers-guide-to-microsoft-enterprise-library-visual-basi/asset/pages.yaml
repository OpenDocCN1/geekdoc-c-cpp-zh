    # OBTAINING AND COMPARING HASH VALUES


    To create and compare hash values, you use a hash provider. As you saw earlier,
    the Cryptography block includes several hash providers. The examples we provide
    use two of these: the SHA512 hash algorithm provider and the MD5Cng hash algorithm
    provider. The examples demonstrate how to use these providers to create a hash
    for both a text string and an object (in our example this is a simple class named
    Product), and how to compare the generated hashes with the original and other
    text strings and object instances.


    The Cryptography Manager exposes two methods for working with hash providers:


    +   The CreateHash method takes as parameters the name of a hash provider configured
    in the Cryptography block for the application, and the item for which it will
    create the hash value. There are two overloads of this method. One accepts a string
    and returns the hash as a string. The second overload accepts the data to encrypt
    as a byte array, and returns a byte array containing the hash value.


    +   The CompareHash method takes as parameters the name of a hash provider configured
    in the Cryptography block for the application, the un-hashed item to compare the
    hash with, and the hash value to compare to the un-hashed item. There are two
    overloads of this method. One accepts the un-hashed item and the hash as strings.
    The second overload accepts the un-hashed item and the hash as byte arrays.


    # Creating and Comparing Hash Values for Text Strings


    The example Create and Compare Hash Values for Text Strings uses the SHA512 hash
    algorithm provider to create a hash of three text strings. It then compares these
    hashes with the original and other values to demonstrate how even a minor difference
    between the original strings creates different hash values.


    The code shown below creates three text strings that will be hashed. Notice that
    the second and third vary only in the letter case of two words. Then the code
    uses the CreateHash method of the Cryptography Manager to create the hashes of
    these three strings. In each case, the code passes to the CreateHash method the
    name of the SHA512 hash algorithm provider defined in the configuration of the
    application, and the text string.'
