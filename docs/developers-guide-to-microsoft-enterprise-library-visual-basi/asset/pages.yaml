- pgno: 242
  md: "```\ntheDB = value\nEnd Set\nEnd Property\nEnd Class\n```\n\nWhen you apply\
    \ the **Dependency** attribute without specifying a name, the container will return\
    \ the type specified as the default (an unregistered registration) or a new instance\
    \ of that type. To specify a named registration when using property injection\
    \ with attributes, you include the name as a parameter of the **Dependency** attribute,\
    \ as shown below.\n\n```\nPublic Class MyNewObject\n\nPrivate theDB As Database\n\
    \n<Dependency(\"LocalDB\")> _\nPublic Property NamedDB() As Database\n    Get\n\
    \        Return theDB\n    End Get\n    Set(ByVal value As Database)\n       \
    \ theDB = value\n    End Set\nEnd Property\n\nEnd Class\n```\n\n# METHOD CALL\
    \ INJECTION\n\nMethod call injection is a less common approach than constructor\
    \ and property setter injection, but is useful in two specific situations. Firstly,\
    \ constructor injection only works when you are instantiating new instances of\
    \ objects (when the constructor is executed), whereas method call injection will\
    \ work with existing instances of objects. For example, Unity will execute the\
    \ method when it resolves an instance that is registered as a singleton, or when\
    \ you call the **BuildUp** method of the container.\n\nSecondly, while property\
    \ setter injection also works with existing instances, it requires public properties\
    \ to be exposed. Using method call injection means that you do not need to expose\
    \ public properties to be able to inject values into existing instances of resolved\
    \ types.\n\nThe usual approach is to expose a public initialization method that\
    \ takes as parameters the objects you want to resolve and obtain references to.\
    \ Unity will populate the parameters and then call the method. As the method executes,\
    \ you store the resolved types in local variables of your class.\n\nMethod call\
    \ injection does not occur by default, and must be configured using a configuration\
    \ file, programmatically at run time, or by applying an attribute to the method."
  merge: -1
  img_proc: true
- pgno: 243
  md: "# Design-Time Configuration\n\nThe techniques for specifying dependency injection\
    \ for method parameters is very similar to what you saw earlier for constructor\
    \ parameters. The following excerpt from a configuration file defines the dependencies\
    \ for the two parameters of a method named Initialize for a type named MyNewObject.\
    \ Unity will resolve the type of the parameter named customerDB through the container\
    \ and inject the result into that parameter of the target object. It will also\
    \ inject the string value “Customer Services” into the parameter named departmentName.\n\
    \n```\n<register type=\"MyNewObject\">\n    <method name=\"Initialize\">\n   \
    \     <param name=\"customerDB\" />\n        <param name=\"departmentName\" value=\"\
    Customer Services\" />\n    </method>\n</register>\n```\n\nYou can also use the\
    \ dependencyName and dependencyType attributes to specify how Unity should resolve\
    \ the type for a parameter in exactly the same way as you saw for property injection.\
    \ If you have more than one overload of a method in your class, Unity uses the\
    \ set of parameters you define in your configuration to determine the actual method\
    \ to populate and execute.\n\n# Run-Time Configuration\n\nAs with constructor\
    \ and property injection, you can configure injection for any public method of\
    \ the target class at run time by calling the RegisterType method of the Unity\
    \ container. The following code achieves the same result as the configuration\
    \ extract you have just seen.\n\n```\nmyContainer.RegisterType<Of MyNewObject>(\
    \ _\n    New InjectionMethod(\"Initialize\", GetType(Database), \"CustomerServices\"\
    ) _\n)\n```\n\nIn addition, you can specify the lifetime of the type, and use\
    \ named dependencies, in exactly the same way as you saw for constructor injection.\n\
    \n# Configuration with Attributes\n\nYou can apply the InjectionMethod attribute\
    \ to a method to indicate that any types defined in parameters of the method are\
    \ dependencies of the class. The following code demonstrates the most common scenario,\
    \ saving the dependent object instance in a class-level variable, for a class\
    \ named MyNewObject that exposes a method named Initialize that takes as parameters\
    \ instances of the type Database and an instance of a concrete type that implements\
    \ the ILogger interface.\n\n```\nPublic Class MyNewObject\n    Private theDB As\
    \ Database\n    Private theLogger As ILogger\n```"
  merge: -1
  img_proc: true
- pgno: 244
  md: "```\n<InjectionMethod()> _\nPublic Sub Initialize(customerDB As Database, loggingComponent\
    \ As ILogger)\n    ' assign the dependent objects to class-level variables\n \
    \   theDB = customerDB\n    theLogger = loggingComponent\nEnd Sub\nEnd Class\n\
    ```\n\nYou can also add the **Dependency** attribute to a parameter to specify\
    \ the name of the registration Unity should use to resolve the parameter type,\
    \ just as you saw earlier for constructor injection with attributes. And, as with\
    \ constructor injection, all of the parameters of the method must be resolvable\
    \ through the container. If any are value types that Unity cannot create, you\
    \ must ensure that you have a suitable registration in the container for that\
    \ type, or use a dependency override to set the value.\n\n# MORE DEPENDENCY INJECTION\
    \ OPPORTUNITIES\n\nIn addition to the techniques we have shown here for defining\
    \ dependencies, Unity allows you to specify both the type to resolve, and its\
    \ dependencies, as generic types. You can also specify dependencies that are arrays\
    \ of any type, including generic types. You can even have Unity resolve all the\
    \ members of an array automatically, or specify individual members of the array\
    \ yourself.\n\n# Resolving Populated Instances of Your Classes\n\nAfter you have\
    \ defined your object graph dependencies, you must resolve the type at the root\
    \ of this hierarchy through the container to initiate the dependency injection\
    \ process. In Unity, you use the **Resolve** method to kick off the process by\
    \ specifying the type of the object whose dependencies you want Unity to populate.\
    \ The following code resolves a populated instance of the **MyNewObject** type\
    \ from the container.\n\n```\nDim theInstance As MyNewObject = container.Resolve(Of\
    \ MyNewObject)()\n```\n\nThis returns the type registered as the default (no name\
    \ was specified when it was registered). If you want to resolve a type that was\
    \ registered with a name, you specify this name as a parameter of the **Resolve**\
    \ method. You might also consider using implicit typing instead of specifying\
    \ the type, to make your code less dependent on the results of the resolve process.\n\
    \n```\nDim theInstance = container.Resolve(Of MyNewObject)(\"Registration Name\"\
    )\n```\n\nAlternatively, you may choose to define the returned type as the interface\
    \ type when you are resolving a mapped type. For example, if you registered a\
    \ type mapping between the interface **IMyType** and the concrete type **MyNewObject**,\
    \ you should consider using the following code when you resolve it."
