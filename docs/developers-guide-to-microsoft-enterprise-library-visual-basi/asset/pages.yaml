    \ Street\nShipCity = Denver\nShipZipCode = 12345\nShippingOption = Two-day shipping\n\
    State = Colorado\n```\n\n# Reading Rows Using an Array of Parameter Values\n\n\
    While you may use simple no-parameter stored procedures and SQL statements in\
    \ some scenarios, it's far more common to use queries that accept input parameters\
    \ that select rows or specify how the query will execute within the database server.\
    \ If you use only input parameters, you can wrap the values up as an **Object**\
    \ array and pass them to the stored procedure or SQL statement. Note that this\
    \ means you must add them to the array in the same order as they are expected\
    \ by the query, because you are not using names for these parameters—you are only\
    \ supplying the actual values. The following code shows how you can execute a\
