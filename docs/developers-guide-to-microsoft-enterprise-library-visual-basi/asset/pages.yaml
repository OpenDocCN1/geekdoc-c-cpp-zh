    # # CAPTURING UNPROCESSED EVENTS AND LOGGING ERRORS


    The capability to route log entries through different categories to a configured
    set of trace listener targets provides a very powerful mechanism for performing
    a wide range of logging activities. However, it prompts some questions. In particular,
    what happens if the categories specified in a log entry don''t match any in the
    configuration? And what happens if there is an error when the trace listener attempts
    to write the log entry to the target?


    # ## About Special Sources


    In fact, the Logging block includes three special sources that handle these situations.
    Each is effectively a category, and you can add references to configured trace
    listeners to each one so that events arriving in that category will be written
    to the target(s) you specify.


    The **All Events** special source receives all events, irrespective of all other
    settings within the configuration of the block. You can use this to provide an
    audit trail of all events, if required. By default, it has no trace listeners
    configured.


    The **Unprocessed Category** special source receives any log entry that has a
    category that does not match any configured categories. By default, this category
    has no trace listeners configured.


    The **Logging Errors & Warnings** special source receives any log entry that causes
    an error in the logging process. By default, this category contains a reference
    to a trace listener that writes details of the error to the Windows Application
    Event Log, though you can reconfigure this if you wish.'
  merge: -1
  img_proc: true
- pgno: 126
  md: "# An Example of Using Special Sources\n\nThe example, Using Special Sources\
    \ to capture unprocessed events or errors, demonstrates how the Logging block\
    \ reacts under these two circumstances. The code first writes a log entry to a\
    \ category named InvalidCategory, which does not exist in the configuration. Next,\
    \ it writes another log entry to a category named CauseLoggingError that is configured\
    \ to use a Database trace listener. However, this trace listener specifies a connection\
    \ string that is invalid; it points to a database that does not exist.\n\n```\n\
    ' Check if logging is enabled before creating log entries.\nIf defaultWriter.IsLoggingEnabled()\
    \ Then\n\n    ' Create a log entry to be processed by the \"Unprocessed\" special\
    \ source.\n    defaultWriter.Write(\"Entry with category not defined in configuration.\"\
    , _\n        \"InvalidCategory\")\n\n    ' Create log entry to be processed by\
    \ the \"Errors & Warnings\" special source.\n    defaultWriter.Write(\"Entry that\
    \ causes a logging error.\", \"CauseLoggingError\")\n\nElse\n    Console.WriteLine(\"\
    Logging is disabled in the configuration.\")\nEnd If\n```\n\nYou might expect\
    \ that neither of these log entries would actually make it to their target. However,\
    \ the example generates the following messages that indicate where to look for\
    \ the log entries that are generated.\n\n```\nCreated a Log Entry with a category\
    \ name not defined in the configuration.\nThe Log Entry will appear in the Unprocessed.log\
    \ file in the C:\\Temp folder.\n\nCreated a Log Entry that causes a logging error.\n\
    The Log Entry will appear in the Windows Application Event Log.\n```\n\nThis occurs\
    \ because we configured the Unprocessed Category in the Special Sources section\
    \ with a reference to a flat file trace listener that writes log entries to a\
    \ file named Unprocessed.log. If you open this file, you will see the log entry\
    \ that was sent to the InvalidCategory category.\n\nThe example uses the default\
    \ configuration for the Logging Errors & Warnings special source. This means that\
    \ the log entry that caused a logging error will be sent to the formatted event\
    \ log trace listener referenced in this category. If you open the application\
    \ event log, you will see this entry in the category. The listing below shows\
    \ some of the content.\n\n```\nTimestamp: 24/11/2009 15:14:30\nMessage: Tracing\
    \ to LogSource 'CauseLoggingError' failed. Processing for other sources will continue.\
    \ See summary information below for more information. Should this problem persist,\
    \ stop the service and check the configuration file(s) for possible error(s) in\
    \ the configuration of the categories and sinks.\n```"
