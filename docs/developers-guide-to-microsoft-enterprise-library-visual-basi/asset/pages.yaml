    \ XmlReader = db.ExecuteXmlReader(cmd)\n ' use the reader here\nEnd Using\n```\n\
    \nFinally, if you want to be able to access the connection your code is using,\
    \ perhaps to create connection-based transactions in your code, you can use the\
    \ Data Access block methods to explicitly create a connection for your data access\
    \ methods to use. This means that you must manage the connection yourself, usually\
    \ through a Using statement as shown below, which automatically closes and disposes\
    \ the connection:\n\n```\nUsing con As DbConnection = defaultDB.CreateConnection()\n\
    con.Open()\nTry\n ' perform data access here\nCatch\n ' handle any errors here\n\
    End Try\nEnd Using\n```\n\n# WORKING WITH CONNECTION-BASED TRANSACTIONS\n\nA common\
    \ requirement in many applications is to perform multiple updates to data in such\
    \ a way that they all succeed, or can all be undone (rolled back) to leave the\
    \ databases in a valid state that is consistent with the original content. The\
    \ traditional example is when your bank carries out a monetary transaction that\
    \ requires them to subtract a payment from one account and add the same amount\
    \ to another account (or perhaps slightly less, with the commission going into\
    \ their own account).\n\nTransactions should follow the four ACID principles.\
    \ These are Atomicity (all of the tasks of a transaction are performed or none\
    \ of them are), Consistency (the database remains in a consistent state before\
    \ and after the transaction), Isolation (other operations cannot access or see\
    \ the data in an intermediate state during a transaction), and Durability (the\
    \ results of a successful transaction are persisted and will survive system failure).\n\
    \nYou can execute transactions when all of the updates occur in a single database\
    \ by using the features of your database system (by including the relevant commands\
    \ such as BEGIN TRANSACTION and ROLLBACK TRANSACTION in your stored procedures).\
    \ ADO.NET also provides features that allow you to perform connection-based"
