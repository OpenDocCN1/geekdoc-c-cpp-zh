- pgno: 208
  md: '# ENCRYPTING AND DECRYPTING DATA USING A SYMMETRIC PROVIDER


    To encrypt and decrypt information, you use a symmetric encryption provider. As
    you saw earlier, the Cryptography block includes several symmetric encryption
    providers. The examples we provide use two of these: the AES managed symmetric
    algorithm provider and the Rijndael managed symmetric algorithm provider. The
    examples demonstrate how to use these providers to encrypt both a text string
    and an object (in our example this is a simple class named **Product**), and how
    to decrypt the encrypted item.


    The Cryptography Manager exposes two methods for working with symmetric encryption
    providers:


    +   The **EncryptSymmetric** method takes as parameters the name of a symmetric
    provider configured in the Cryptography block for the application, and the item
    to encrypt. There are two overloads of this method. One accepts a string and returns
    a base-64 encoded string containing the encrypted text. The second overload accepts
    the data to encrypt as a byte array, and returns a byte array containing the encrypted
    data.


    +   The **DecryptSymmetric** method takes as parameters the name of a symmetric
    provider configured in the Cryptography block for the application, and the item
    to decrypt. There are two overloads of this method. One accepts a base-64 encoded
    string containing the encrypted text and returns the decrypted text. The second
    overload accepts a byte array containing the encrypted data and returns a byte
    array containing the decrypted item.


    # Encrypting and Decrypting a Text String


    The first example, *Encrypt and Decrypt a Text String using a Symmetric Algorithm*,
    uses the AES managed symmetric algorithm provider to encrypt and decrypt a text
    string.


    The code shown below creates a text string and then calls the **EncryptSymmetric**
    method of the Cryptography Manager, passing to it the name of the AES managed
    symmetric algorithm provider defined in the configuration of the application,
    and the text string to encrypt. To decrypt the resulting string, the code then
    calls the **Decrypt Symmetric** method of the Cryptography Manager, passing to
    it (as before) the name of the AES managed symmetric algorithm provider defined
    in the configuration of the application, and the encrypted base-64 encoded string.
    We''ve removed some of the lines of code that simply write values to the console
    screen to make it easier to see the code that actually does the work.


    ```

    '' Define the text string instance to encrypt.

    Dim sampleText As String = "This is some text to encrypt."


    '' Use the AES Symmetric Algorithm Provider.

    '' The overload of the EncryptSymmetric method that takes a

    '' string returns the result as a Base-64 encoded string.

    Dim encrypted As String = defaultCrypto.EncryptSymmetric("AesManaged", sampleText)


    '' Now decrypt the result string.

    ```'
  merge: -1
  img_proc: true
- pgno: 209
  md: '```

    Dim decrypted As String = defaultCrypto.DecryptSymmetric("AesManaged", encrypted)


    '' Destroy any in-memory variables that hold sensitive information.

    encrypted = Nothing

    decrypted = Nothing

    ```


    Notice that the last lines of the code destroy the in-memory values that hold
    the sensitive information used in the code. This is good practice as it prevents
    any leakage of this information should an error occur elsewhere in the application,
    and prevents any attacker from being able to dump the memory contents and view
    the information. If you store data in a string, set it to **Nothing**, allowing
    the garbage collector to remove it from memory during its next run cycle. If you
    use an array, call the static **Array.Clear** method (passing in the array you
    used) to remove the contents after use.


    *You may also consider storing values in memory using the **SecureString** class,
    which is part of the Microsoft .NET Framework. However, in the current release
    of Enterprise Library, the methods of the Security block do not accept or return
    **SecureString** instances, and so you must translate them into strings when interacting
    with the block methods. For more information about using the **SecureString**
    class, see "SecureString Class" at http://msdn.microsoft.com/en-us/library/system.security.securestring.aspx.*


    When you run this example, you''ll see the output shown below. You can see the
    value of the original string, the base-64 encoded encrypted data, and the result
    after decrypting this value.


    ```

    Text to encrypt is ''This is some text to encrypt.''


    Encrypted and Base-64 Encoded result is ''+03zUIn0EoggpIqJeIiHRUDI2D4E8T5PXCJS/D6kI14CUcJedfv1MX0jrginja72WbDjp5yFyh/Vrh7wQ9P2tUuAx1XNdy1qSVDGU814NwNq4=''


    Decrypted string is ''This is some text to encrypt.''

    ```


    # Encrypting and Decrypting an Object Instance


    The second example, **Encrypt and Decrypt Data using a Symmetric Algorithm**,
    uses the Rijndael managed symmetric algorithm provider to encrypt and decrypt
    an instance of the **Product** class defined within the example project.


    The code shown below first creates a new instance of the **Product** class. We
    need to pass this to the **EncryptSymmetric** method of the Cryptography Manager,
    along with the name of the Rijndael managed symmetric algorithm provider defined
    in the configuration of the application, as an array of bytes. The easiest way
    to perform the conversion to a byte array is to take advantage of the **SerializationUtility**
    class in the Caching block. This class exposes two methods: **ToBytes** and **ToObject**.
    We use the **ToBytes** method to convert the **Product** instance into a byte
    array before passing it the **EncryptSymmetric** method.'
  merge: -1
  img_proc: true
- pgno: 210
  md: "Then the code decrypts the resulting byte array using the **DecryptSymmetric**\
    \ method of the Cryptography Manager, passing to it (as before) the name of the\
    \ Rijndael managed symmetric algorithm provider defined in the configuration of\
    \ the application, and the encrypted byte array. The **ToObject** method of the\
    \ **SerializationUtility** class then converts this back into an instance of the\
    \ Product class. Again, we've removed some of the lines of code that simply write\
    \ values to the console screen to make it easier to see the code that actually\
    \ does the work.\n\n```\n' Create the object instance to encrypt.\nDim sampleObject\
