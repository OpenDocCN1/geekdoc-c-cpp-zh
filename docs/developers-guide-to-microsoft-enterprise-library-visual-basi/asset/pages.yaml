  md: 'This appendix discusses some of the more advanced topics that will help you
    to obtain the maximum benefit from Enterprise Library in terms of creating objects
    and managing the dependency injection container. It includes the following:


    +   - Loading configuration information into a Unity container

    +   - Viewing the registrations in the container

    +   - Populating entire object graphs at application startup

    +   - Maintaining a reference to the container in request-based applications

    +   - Using an alternative service locator or dependency injection container


    These topics provide information about how you can use the more sophisticated
    dependency injection approach for creating instances of Enterprise Library objects,
    as described in Chapter 1, “Introduction.” If you have decided not to use this
    approach, and you are using the Enterprise Library service locator and its **GetInstance**
    method to instantiate Enterprise Library types, they are not applicable to your
    scenario.


    # Loading Configuration Information into a Unity Container


    Unlike many applications, and unlike the application blocks within Enterprise
    Library, Unity does not automatically load configuration information when it starts.
    This is intentional; it means that you can load configuration information into
    one or more new or existing containers, including containers that you create as
    a hierarchy of parent and child containers.


    This also means that you can exert considerable control over how requests for
    types are handled. For example, you can use multiple containers to specify dependencies
    for different parts of your application, while allowing requests that cannot be
    satisfied in a child container to pass up through the hierarchy of parent containers
    until a suitable registration is found.


    It also means that you can load configuration information from different sources.
    A typical example is loading configuration from a file other than App.config or
    Web.config, or by adding registrations programmatically—by for example—reading
    them from a database and applying them to the container.


    The Unity container class exposes the **LoadConfiguration** method that you can
    use to populate a container. You can call this method with no parameters to read
    a <unity>'
  merge: -1
  img_proc: true
- pgno: 248
  md: "section from the current application configuration file (App.config or Web.config),\
    \ as demonstrated in Chapter 1 of this guide. Alternatively, you can provide the\
    \ method with a UnityConfigurationSection instance that contains the configuration\
    \ information. The following code opens a configuration file using the methods\
    \ of the Microsoft® .NET Framework configuration system, casts it to a UnityConfigurationSection\
    \ type, and loads the registrations in the <container> section that has the name\
    \ MyContainerName into a new Unity container.\n\n```\n' Read a specified config\
    \ file using the .NET configuration system.\nDim map As New ExeConfigurationFileMap()\n\
    map.ExeConfigurationFilename = \"c:\\\\configfiles\\\\myunityconfig.config\"\n\
    Dim config As System.Configuration.Configuration = _\n    ConfigurationManager.OpenMappedExeConfiguration(map,\
    \ _\n    ConfigurationUserLevel.None)\n\n' Get the unity configuration section.\n\
    Dim section As UnityConfigurationSection = _\n    DirectCast(config.GetSection(\"\
    unity\"), UnityConfigurationSection)\n\n' Create and populate a new UnityContainer\
    \ with the configuration information.\nDim theContainer As IUnityContainer = New\
    \ UnityContainer()\ntheContainer.LoadConfiguration(section, \"MyContainerName\"\
    )\n```\n\nYou can define multiple containers within the <unity> section of a configuration\
    \ file providing each has a unique name, and load each one into a separate container\
    \ at run time. If you do not assign a name to a container in the configuration\
    \ file, it becomes the default container, and you can load it by omitting the\
    \ name parameter in the LoadConfiguration method.\n\nTo load a container programmatically\
    \ in this way, you must add the System.Configuration.dll assembly and the Microsoft.Practices.Unity.Configuration.dll\
    \ assembly to your project. You should also import the following namespaces:\n\
    \n+   * Microsoft.Practices.EnterpriseLibrary.Common.Configuration.Unity\n+  \
    \ * Microsoft.Practices.Unity\n\n# Viewing Registrations in the Container\n\n\
    Sometimes you may find that your application throws an error indicating that it\
    \ cannot resolve a specific type. The error messages that Unity returns are detailed,\
    \ and should help you to find the problem quickly. However, you may find it useful\
    \ to be able to browse the contents of the container to see the registrations\
    \ and mappings it contains.\n\nThe Unity container exposes the Registrations property,\
    \ which returns a collection of ContainerRegistration instances, one for each\
    \ registration or type mapping in the container. The following example code shows\
    \ how you can extract details for each registration: the registered type, the\
    \ type it maps to (if any), the name of the registration (if it is not a default\
    \ registration), and the lifetime manager type."
