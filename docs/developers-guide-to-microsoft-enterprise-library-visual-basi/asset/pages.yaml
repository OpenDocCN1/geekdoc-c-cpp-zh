- pgno: 164
  md: '# Summary


    This chapter looked at the ways that you can implement caching across your application
    and your enterprise in a consistent and configurable way by using the Caching
    Application Block. The block provides a non-distributed cache that can cache items
    in memory, and optionally in a persistent backing store such as isolated storage
    or a database. You can also easily add new backing stores if required, and even
    replace the cache manager if you want to create a mechanism that does support
    other features, such as distributed caching.


    The Caching block is flexible in order to meet most requirements for most types
    of applications. You can define multiple caches and partition each one, which
    is useful if you want to use a single database for multiple caches. And you can
    easily add encryption to the caching mechanism for items stored in a persistent
    backing store.


    The block also provides a wide range of expiration mechanisms, including several
    time-based expirations as well as file-based expiration. Unlike some caching mechanisms,
    you can specify multiple expirations for each cached item, and even create your
    own custom expiration policies.


    On top of all of this flexibility, the block makes it easy for administrators
    and operators to change the behavior through configuration using the configuration
    tools provided with Enterprise Library. They can change the settings for the cache,
    such as the polling frequency, change the backing stores that the block uses,
    and change the algorithms that it uses to encrypt cached data.


    This chapter discussed all of these features, and contained detailed examples
    of how you can use the block in your own applications. For more information about
    the Caching block, see the online documentation and the help files installed with
    Enterprise Library.'
  merge: -1
  img_proc: true
- pgno: 165
  md: '# Introduction


    If you happen to live in the U.S. and I told you that the original release date
    of version 2.0 of Enterprise Library was 13/01/2006, you''d wonder if I''d invented
    some new kind of calendar. Perhaps they added a new month to the calendar without
    you noticing (which I''d like to call Plutember in honor of the now-downgraded
    ninth planet). Of course, in many other countries around the world, 13/01/2006
    is a perfectly valid date in January. This validation issue is well known and
    the solution probably seems obvious, but I once worked with an application that
    used dates formatted in the U.S. mm/dd/yyyy pattern for the filenames of reports
    it generated, and defaulted to opening the report for the previous day when you
    started the program. Needless to say, on my machines set up to use U.K. date formats,
    it never did manage to find the previous day''s report.


    Even better, when I tried to submit a technical support question on their Web
    site, it asked me for the date I purchased the software. The JavaScript validation
    code in the Web page running on my machine checked the format of my answer (27/04/2008)
    and accepted it. But the server refused to believe that there are twenty seven
    months in a year, and blocked my submission. I had to lie and say I purchased
    it on May 1 instead.


    The problem is that validation can be an onerous task, especially when you need
    to do it in so many places in your applications, and for a lot of different kinds
    of values. It''s extremely easy to end up with repeated code scattered throughout
    your classes, and yet still leave holes where unexpected input can creep into
    your application and possibly cause havoc.


    Robust validation can help to protect your application against malicious users
    and dangerous input (including SQL injection attacks), ensure that it processes
    only valid data and enforces business rules, and improve responsiveness by detecting
    invalid data before performing expensive processing tasks.


    So, how do you implement comprehensive and centralized validation in your applications?
    One easy solution is to take advantage of the Enterprise Library Validation block.
    The Validation block is a highly flexible solution that allows you to specify
    validation rules in configuration, with attributes, or in code, and have that
    validation applied to objects, method parameters, fields, and properties. It even
    includes features that integrate with Windows Forms, Windows Presentation Foundation
    (WPF), ASP.NET, and Windows Communication Foundation (WCF) applications to present
    validation errors within the user interface or have them handled automatically
    by the service.'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# Techniques for Validation


    Before we explore the Validation block, it''s worth briefly reviewing some validation
    good practices. In general, there are three factors you should consider: where
    you are going to perform validation, what data should you validate, and how you
    will perform this validation.


    # WHERE SHOULD I VALIDATE?


    Validation should, of course, protect your entire application. However, it is
    often the case that you need to apply validation in more than one location. If
    your application consists of layers, distributed services, or discrete components,
    you probably need to validate at each boundary. This is especially the case where
    individual parts of the application could be called from more than one place (for
    example, a business layer that is used by several user interfaces and other services).


    It is also a really good idea to validate at trust boundaries, even if the components
    on each side of the boundary are not physically separated. For example, your business
    layer may run under a different trust level or account context than your data
    layer (even if they reside on the same machine). Validation at this boundary can
    prevent code that is running in low trust and which may have been compromised,
    from submitting invalid data to code that runs in higher trust mode.


    Finally, a common scenario: validation in the user interface. Validating data
    on the client can improve application responsiveness, especially if the UI is
    remote from the server. Users do not have to wait for the server to respond when
    they enter or submit invalid data, and the server does not need to attempt to
    process data that it will later reject. However, remember that even if you do
    validate data on the client or in the UI you must always revalidate on the server
    or in the receiving service. This protects against malicious users who may circumvent
    client-side validation and submit invalid data.


    # WHAT SHOULD I VALIDATE?


    To put it simply, everything. Or, at least any input values you will use in your
    application that may cause an error, involve a security risk, or could result
    in incorrect processing. Remember that Web page and service requests may contain
    data that the user did not enter directly, but could be used in your application.
    This can include cookies, header information, credentials, and context information
    that the server may use in various ways. Treat all input data as suspicious until
    you have validated it.'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# **HOW SHOULD I VALIDATE?**


    For maximum security, your validation process should be designed to accept only
    data that you can directly determine to be valid. This approach is known as positive
    validation and generally uses an allow list that specifies data that satisfies
    defined criteria, and rejects all other data. Examples are rules that check if
    a number is between two predefined limits, or if the submitted value is within
    a list of valid values. Use this approach whenever possible.


    The alternative and less-secure approach is to use a block list containing values
    that are not valid. This is called negative validation, and generally involves
    accepting only data that does not meet specific criteria. For example, as long
    as a string does not contain any of the specified invalid characters, it would
    be accepted. You should use this approach cautiously and as a secondary line of
    defense, because it is very difficult to create a complete list of criteria for
    all known invalid input—which may allow malicious data to enter your system.


    Finally, consider sanitizing data. While this is not strictly a validation task,
    you can as an extra precaution attempt to eliminate or translate characters in
    an effort to make the input safe. However, do not rely on this technique alone
    because, as with negative validation, it can be difficult to create a complete
    list of criteria for all known invalid input unless there is a limited range of
    invalid values.


    # **What Does the Validation Block Do?**


    The Validation block consists of a broad range of validators, plus a mechanism
    that executes these validators and collects and correlates the results to provide
    an overall validation result (true/valid or false/invalid). The Validation block
    can use individual attributes applied to classes and class members that the application
    uses (both the validation attributes provided with the Validation block and data
    annotation attributes from the System.ComponentModel.DataAnnotations namespace),
    in addition to rule sets defined in the configuration of the block, which specify
    the validation rules to apply.


    The typical scenario when using the Validation block is to define rule sets through
    configuration or attributes applied to your classes. Each rule set specifies the
    set of individual validators and combinations of these validators that implement
    the validation rules you wish to apply to that class. Then you use a ValidatorFactory
    (or one of the equivalent implementations of this factory) to create a type validator
    for the class, optionally specifying the rule set it should use. If you don’t
    specify a rule set, it uses the default rules. Then you can call the Validate
    method of the type validator. This method returns an instance of the ValidationResults
    class that contains details of all the validation errors detected. Figure 1 illustrates
    this process.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '![](img/d7009d38323c3b86f2dfbc5155fbf141_168_0.png)


    # FIGURE 1

    An overview of the validation process


    When you use a rule set to validate an instance of a specific type or object,
    the block can apply the rules to:


    +   - The type itself

    +   - The values of public readable properties

    +   - The values of public fields

    +   - The return values of public methods that take no parameters


    Notice that you can validate the values of method parameters and the return type
    of methods that take parameters when that method is invoked, only by using the
    validation call handler (which is part of the Validation block) in conjunction
    with the Unity dependency injection and interception mechanism. The validation
    call handler will validate the parameter values based on the rules for each parameter
    type and any'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'validation attributes applied to the parameters. We don''t cover the use of
    the validation call handler in this guide, as it requires you to be familiar with
    Unity interception techniques. For more information about interception and the
    validation call handler, see the Unity interception documentation installed with
    Enterprise Library or available online at http://go.microsoft.com/fwlink/?LinkId=188875.


    Alternatively, you can create individual validators programmatically to validate
    specific values, such as strings or numeric values. However, this is not the main
    focus of the block—though we do include samples in this chapter that show how
    you can use individual validators.


    In addition, the Validation block contains features that integrate with Windows®
    Forms, Windows Presentation Foundation (WPF), ASP.NET, and Windows Communication
    Foundation (WCF) applications. These features use a range of different techniques
    to connect to the UI, such as a proxy validator class based on the standard ASP.NET
    Validator control that you can add to a Web page, a ValidationProvider class that
    you can specify in the properties of Windows Forms controls, a ValidatorRule class
    that you can specify in the definition of WPF controls, and a behavior extension
    that you can specify in the <system.ServiceModel> section of your WCF configuration.
    You''ll see more details of these features later in this chapter.


    # THE RANGE OF VALIDATORS


    Validators implement functionality for validating Microsoft® .NET Framework data
    types. The validators included with the Validation block fall into three broad
    categories: value validators, composite validators, and type (object) validators.
    The value validators allow you to perform specific validation tests such as verifying:


    +   * The length of a string, or the occurrence of a specified set of characters
    within it.

    +   * Whether a value lies within a specified range, including tests for dates
    and times relative to a specified date/time.

    +   * Whether a value is one of a specified set of values, or can be converted
    to a specific data type or enumeration value.

    +   * Whether a value is null, or is the same as the value of a specific property
    of an object.

    +   * Whether the value matches a specified regular expression.


    The composite validators are used to combine other validators when you need to
    apply more complex validation rules. The Validation block includes an AND validator
    and an OR validator, each of which acts as a container for other validators. By
    nesting these composite validators in any combination and populating them with
    other validators, you can create very comprehensive and very specific validation
    rules.'
  merge: -1
  img_proc: true
