    # ADDING ADDITIONAL CONTEXT INFORMATION


    While it''s useful to have every conceivable item of information included in your
    log messages, it''s not always the best approach. Collecting information from
    the environment absorbs processing cycles and increases the load that logging
    places on your application. The Logging block is highly optimized to minimize
    the load that logging incurs. As an example, some of the less useful information
    is not included in the log messages by default—particularly information that does
    require additional resources to collect.


    However, you can collect this information if you wish. You may decide to do so
    in special debugging instrumentation that you only turn on when investigating
    problems, or'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'for specific areas of your code where you need the additional information,
    such as security context details for a particularly sensitive process.


    After checking that a log entry will not be blocked by filters, the ShowDetailsAndAddExtraInfo
    method (shown in the previous section) adds a range of additional content and
    custom information to the log entry. It uses the four standard Logging block helper
    classes that can generate additional context information and add it to a Dictionary.
    These helper classes are:


    +   - The DebugInformationProvider, which adds the current stack trace to the
    Dictionary

    +   - The ManagedSecurityContextInformationProvider, which adds the current identity
    name, authorization type, and authorization status to the Dictionary

    +   - The UnmanagedSecurityContextInformationProvider, which adds the current
    user name and process account name to the Dictionary.

    +   - The ComPlusInformationProvider, which adds the current activity ID, application
    ID, transaction ID (if any), direct caller account name, and original caller account
    name to the Dictionary.


    The following code shows how you can use these helper classes to create additional
    information for a log entry. It also demonstrates how you can add custom information
    to the log entry—in this case by reading the contents of the application configuration
    file into the Dictionary. After populating the Dictionary, you simply set it as
    the value of the ExtendedProperties property of the log entry before writing that
    log entry.


    ```

    ```vb

    '' Create the additional context information to add to the LogEntry.

    Dim dict As New Dictionary(Of String, Object)()

    '' Use the information helper classes to get information about

    '' the environment and add it to the dictionary.

    Dim debugHelper As New DebugInformationProvider()

    debugHelper.PopulateDictionary(dict)

    Dim infoHelper As New ManagedSecurityContextInformationProvider()

    infoHelper.PopulateDictionary(dict)

    Dim secHelper As New UnmanagedSecurityContextInformationProvider()

    secHelper.PopulateDictionary(dict)

    Dim comHelper As New ComPlusInformationProvider()

    comHelper.PopulateDictionary(dict)

    '' Get any other information you require and add it to the dictionary.

    Dim configInfo As String = File.ReadAllText("...\App.config")

    dict.Add("Config information", configInfo)

    '' Set the dictionary in the LogEntry and write it using the default LogWriter.

    ```

    ```'
