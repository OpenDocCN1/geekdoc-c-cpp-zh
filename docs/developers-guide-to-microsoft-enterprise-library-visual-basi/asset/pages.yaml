  md: "```\nasyncDB.AddInParameter(cmd, \"state\", DbType.String, \"Colorado\")\n\
    asyncDB.AddInParameter(cmd, \"status\", DbType.String, \"DRAFT\")\n\n' Execute\
    \ the query asynchronously specifying the command and\n' the callback to execute\
    \ when data access completes.\nasyncDB.BeginExecuteReader(cmd, AddressOf ExecuteReadData,\
    \ asyncDB)\n\nCatch ex As Exception\n    Console.WriteLine(\"Error while starting\
    \ data access: {0}\", ex.Message)\nEnd Try\n...\n\n' Callback executed when the\
    \ data access completes.\nSub ExecuteReadData(ByVal asyncResult As IAsyncResult)\n\
    \    Try\n        ' Extract Database instance from async state passed to callback\n\
    \        Dim db As Database = CType(asyncResult.AsyncState, Database)\n      \
    \  Using reader As IDataReader = db.EndExecuteReader(asyncResult)\n          \
    \  DisplayRowValues(reader)\n        End Using\n    Catch ex As Exception\n  \
    \      Console.WriteLine(\"Error after data access completed: {0}\", ex.Message)\n\
    \    End Try\nEnd Sub\n```\n\nThe Lambda expression then calls the **EndExecuteReader**\
    \ method to obtain the results of the query execution.\n\nThe **AsyncState** parameter\
    \ can be used to pass any required state information into the callback routine.\
    \ For example, when you use a separate callback, you would pass a reference to\
    \ the current **Database** instance as the **AsyncState** parameter so that the\
    \ callback code can call the **EndExecuteReader** (or other appropriate **End**\
    \ method) to obtain the results. If you use a Lambda expression instead, the current\
    \ **Database** instance is available within the expression and, therefore, you\
    \ do not need to populate the **AsyncState** parameter.\n\nThe callback executes\
    \ the **EndExecuteReader** method to obtain the results of the query. At this\
    \ point you can consume the row set in your application or, as the code above\
    \ does, just display the values. Notice that the callback expression should handle\
    \ any errors that may occur during the asynchronous operation.\n\nThe example\
    \ **Execute a command that retrieves data asynchronously** uses the code shown\
