    to check that the SQL Server (SQLEXPRESS) database service (the service named
    MSSQL$SQLEXPRESS) is running.


    # TESTING LOGGING FILTER STATUS


    As you''ve seen in earlier examples, the Logging block allows you to check if
    logging is enabled before you create and write a log entry. You can avoid the
    additional load that this places on your application if logging is not enabled.
    However, even when logging is enabled, there is no guarantee that a specific log
    entry will be written to the target log store. For example, it may be blocked
    by a priority filter if the message priority is below a specified level, or it
    may belong only to one or more categories where the relevant category filter(s)
    have logging disabled (a common scenario in the case of logging code specifically
    designed only for debugging use).'
  merge: -1
  img_proc: true
- pgno: 131
  md: "The example, Checking filter status and adding context information to the log\
    \ entry, demonstrates how you can check if a specific log entry will be written\
    \ to its target before you actually call the **Write** method. After checking\
    \ that logging is not globally disabled, the example creates two **LogEntry**\
    \ instances with different categories and priorities. It passes each in turn to\
    \ another method named **ShowDetailsAndAddExtraInfo**. The following is the code\
    \ that creates the **LogEntry** instances.\n\n```\n' Check if logging is enabled\
    \ before creating log entries.\nIf defaultWriter.IsLoggingEnabled() Then\n   \
    \ ' Create a new LogEntry with two categories and priority 3.\n    Dim logCategories\
    \ As String() = New String() {\"General\", \"DiskFiles\"}\n    Dim entry1 As New\
    \ LogEntry(\"Logging with categories 'General' and _\n        & \" 'DiskFiles'\
    \ and Priority 3.\", logCategories, _\n        3, 9009, TraceEventType.Error,\
    \ _\n        \"Logging Block Examples\", Nothing)\n    ShowDetailsAndAddExtraInfo(entry1)\n\
    \    ' Create a new LogEntry with one category and priority 1.\n    logCategories\
    \ = New String() {\"BlockedByFilter\"}\n    Dim entry2 As New LogEntry(\"Logging\
    \ with category 'BlockedByFilter' and _\n        & \" Priority 1.\", logCategories,\
    \ 1, 9010, _\n        TraceEventType.Information, _\n        \"Logging Block Examples\"\
    , Nothing)\n    ShowDetailsAndAddExtraInfo(entry2)\nElse\n    Console.WriteLine(\"\
    Logging is disabled in the configuration.\")\nEnd If\n```\n\nThe **ShowDetailsAndAddExtraInfo**\
    \ method takes a **LogEntry** instance and does two different things. Firstly,\
    \ it shows how you can obtain information about the way that the Logging block\
    \ will handle the log entry. This may be useful in advanced scenarios where you\
    \ need to be able to programmatically determine if a specific log entry was detected\
    \ by a specific trace source, or will be written to a specific target. Secondly,\
    \ it demonstrates how you can check if specific filters, or all filters, will\
    \ block a log entry from being written to its target.\n\n# Obtaining Information\
    \ about Trace Sources and Trace Listeners\n\nThe first section of the **ShowDetailsAndAddExtraInfo**\
    \ method iterates through the collection of trace sources (**LogSource** instances)\
    \ exposed by the **GetMatchingTraceSources** method of the LogWriter class. Each\
    \ **LogSource** instance exposes a **Listeners** collection that contains information\
    \ about the listeners (which specify the targets to which the log entry will be\
    \ sent)."
