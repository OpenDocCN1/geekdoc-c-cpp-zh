    the accessor. This works in much the same way as when using the BeginExecuteReader
    method described in the previous example.


    You pass to the BeginExecute method the lambda expression or callback to execute
    when the asynchronous data access process completes, along with the AsyncSync
    and an array of Object instances that represent the parameters to apply to the
    stored procedure or SQL statement you are executing. The lambda expression or
    callback method can'
