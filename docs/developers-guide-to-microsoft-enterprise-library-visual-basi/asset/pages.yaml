    application. You can expand each of the sections to see the property settings,
    and to relate each item to the others.


    # INITIALIZING THE LOGGING BLOCK


    Now you must edit your code to use the Logging block. You''ll need to add references
    to the appropriate Enterprise Library assemblies and namespaces. The assemblies
    you must add to your project (in addition to the assemblies required for all Enterprise
    Library projects) are:


    +   - Microsoft.Practices.EnterpriseLibrary.Logging.dll

    +   - Microsoft.Practices.EnterpriseLibrary.Logging.Database.dll

    +   - Microsoft.Practices.EnterpriseLibrary.Data.dll


    However, if you do not intend to send log entries to a database, you will not
    require the last two assemblies on this list.


    Now you are ready to write some code.'
