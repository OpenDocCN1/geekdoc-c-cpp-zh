- pgno: 78
  md: '# Extending the Block to Use Other Databases


    The Data Access block contains providers for SQL Server, Oracle, and SQL Server
    Compact Edition. However, you can extend the block to use other databases if you
    wish. Writing a new provider is not a trivial task, and you may find that there
    is already a third party provider available for your database. For example, at
    the time of writing, the Enterprise Library Community Contribution site listed
    providers for MySql and SQLite databases. For more information, visit the EntLib
    Contrib Project site at http://codeplex.com/entlibcontrib/.


    If you decide to create a new provider, you can create a new class derived from
    the Enterprise Library **Database** class and override its methods to implement
    the appropriate functionality. One limiting factor is that there must be an ADO.NET
    provider available for your database. The **Database** class in Enterprise Library
    relies on this to perform data access operations.


    You must also be aware of the differences between database functionality, and
    manage these differences in your code. For example, you must handle return values,
    parameter prefixes (such as "@") data type conversions, and other relevant factors.
    However, you can add additional methods to your provider to take advantage of
    features of your target database that are not available for other database types.
    For example, the SQL Server provider in the Data Access block exposes a method
    that uses the SQLXML functionality in SQL Server to extract data in XML format.


    For more information on creating additional database providers for the Data Access
    block, see the Enterprise Library online guidance at http://go.microsoft.com/fwlink/?LinkId=188874
    or the installed documentation.


    # Summary


    This chapter discussed the Data Access Application Block; one of the most commonly
    used blocks in Enterprise Library. The Data Access block provides two key advantages
    for developers and administrators. Firstly, it abstracts the database so that
    developers and administrators can switch the application from one type of database
    to another with only changes to the configuration files required. Secondly, it
    helps developers by making it easier to write the most commonly used sections
    of data access code with less effort, and it hides some of the complexity of working
    directly with ADO.NET.


    In terms of abstracting the database, the block allows developers to write code
    in such a way that (for most functions) they do not need to worry which database
    (such as SQL Server, SQL Server CE, or Oracle) their applications will use. They
    write the same code for all of them, and configure the application to specify
    the actual database at run time. This means that administrators and operations
    staff can change the targeted database without requiring changes to the code,
    recompilation, retesting, and redeployment.


    In terms of simplifying data access code, the block provides a small number of
    methods that encompass most data access requirements, such as retrieving a **DataSet**,
    a **DataReader**, a scalar (single) value, one or more values as output parameters,
    or a series of XML elements. It also provides methods for updating a database
    from a **DataSet**, and integrates with the ADO.NET **TransactionScope** class
    to allow a range of options for'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'working with transactions. However, the block does not limit your options to
    use more advanced ADO.NET techniques, as it allows you to access the underlying
    objects such as the connection and the DataAdapter.


    The chapter also described general issues such as managing connections and integration
    with transactions, and explored the actual capabilities of the block in more depth.
    Finally, we looked briefly at how you can use the block with other databases,
    including those supported by third-party providers.'
  merge: -1
