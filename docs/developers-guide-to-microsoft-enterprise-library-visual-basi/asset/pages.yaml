- pgno: 69
  md: '# Updating the Database from a DataSet


    To update data in a database from a **DataSet**, you use the **UpdateDataSet**
    method, which returns a total count of the number of rows affected by the update,
    delete, and insert operations. The overloads of this method allow you to specify
    the source **DataSet** containing the updated rows, the name of the table in the
    database to update, and references to the three **Command** instances that the
    method will execute to perform UPDATE, DELETE, and INSERT operations on the specified
    database table.


    In addition, you can specify a value for the **UpdateBehavior**, which determines
    how the method will apply the updates to the target table rows. You can specify
    one of the following values for this parameter:


    +   * **Standard**. If the underlying ADO.NET update process encounters an error,
    the update stops and no subsequent updates are applied to the target table.

    +   * **Continue**. If the underlying ADO.NET update process encounters an error,
    the update will continue and attempt to apply any subsequent updates.

    +   * **Transactional**. If the underlying ADO.NET update process encounters an
    error, all the updates made to all rows will be rolled back.


    Finally, you can—if you wish—provide a value for the **UpdateBatchSize** parameter
    of the **UpdateDataSet** method. This forces the method to attempt to perform
    updates in batches instead of sending each one to the database individually. This
    is more efficient, but the return value for the method will show only the number
    of updates made in the final batch, and not the total number for all batches.
    Typically, you are likely to use a batch size value between 10 and 100. You should
    experiment to find the most appropriate batch size; it depends on the type of
    database you are using, the query you are executing, and the number of parameters
    for the query.


    The examples for this chapter include one named **Fill a DataSet and update the
    source data**, which demonstrates the **ExecuteDataSet** and **LoadDataSet** methods.
    It uses the simple overloads of the **ExecuteDataSet** and **LoadDataSet** methods
    to fill two **DataSet** instances, using a separate routine named **DisplayTableNames**
    (not shown here) to display the table names and a count of the number of rows
    in these tables. This shows one of the differences between these two methods.
    Note that the **LoadDataSet** method requires a reference to an existing **DataSet**
    instance, and an array containing the names of the tables to populate.


    ```

    Dim selectSQL As String _

    = "SELECT Id, Name, Description FROM Products WHERE Id > 90"

    '' Fill a DataSet from the Products table using the simple approach.

    Dim simpleDS As DataSet = defaultDB.ExecuteDataSet(CommandType.Text, selectSQL)

    DisplayTableNames(simpleDS, "ExecuteDataSet")

    '' Fill a DataSet from the Products table using the LoadDataSet method.

    '' This allows you to specify the name(s) for the table(s) in the DataSet.

    Dim loadedDS As New DataSet("ProductDataSet")

    defaultDB.LoadDataSet(CommandType.Text, selectSQL, loadedDS, _

    New String() {"Products"})

    DisplayTableNames(loadedDS, "LoadDataSet")

    ```'
  merge: -1
  img_proc: true
