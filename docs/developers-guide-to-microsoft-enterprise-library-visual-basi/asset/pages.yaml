    - Tag value: dateDue

    - Message: ''Date due must be between today and six months time.''

    ```


    Again, we''ve omitted some of the duplication so that you can more easily see
    the result. Notice that there is no value available for the name of the member
    being validated or the validator that was used. This is a form of exception shielding
    that prevents external clients from gaining information about the internal workings
    of the service. However, the Tag value returns the name of the parameter that
    failed validation (the parameter names exposed by the service), allowing you to
    see which of the values you sent to the service actually failed validation.


    # USER INTERFACE VALIDATION INTEGRATION


    The Validation block contains integration components that make it easy to use
    the Validation mechanism and rules to validate user input within the user interface
    of ASP.NET, Windows Forms, and WPF applications. While these technologies do include
    facilities to perform validation, this validation is generally based on individual
    controls and values.


    When you integrate the Validation block with your applications, you can validate
    entire objects, and collections of objects, using sets of rules you define. You
    can also apply complex validation using the wide range of validators included
    with the Validation block. This allows you to centrally define a single set of
    validation rules, and apply them in more than one layer and when using different
    UI technologies.


    > The UI integration technologies provided with the Validation block do not instantiate
    the classes that contain the validation rules. This means that you cannot use
    self-validation with these technologies.


    # ASP.NET User Interface Validation


    The Validation block includes the PropertyProxyValidator class that derives from
    the ASP.NET BaseValidator control, and can therefore take part in the standard
    ASP.NET validation cycle. It acts as a wrapper that links an ASP.NET control on
    your Web page to a rule set defined in your application through configuration,
    attributes, and self-validation.


    To use the PropertyProxyValidator, you add the assembly named Microsoft.Practices.EnterpriseLibrary.Validation.Integration.AspNet
    to your application, and reference it in your project. You must also include a
    Register directive in your Web pages to specify this assembly and the prefix for
    the element that will insert the PropertyProxyValidator into your page.


    ```

    <%@ Register TagPrefix="EntLibValidators"

    Assembly="Microsoft.Practices.EnterpriseLibrary.Validation.Integration.AspNet"

    Namespace="Microsoft.Practices.EnterpriseLibrary.Validation.Integration.AspNet"

    %>

    ```


    Then you can define the validation controls in your page. The following shows
    an example that validates text box that accepts a value for the FirstName property
    of a Customer class, and validates it using the rule set named RuleSetA.'
  merge: -1
  img_proc: true
- pgno: 201
