- pgno: 98
  md: "# Shielding Exceptions at WCF Service Boundaries\n\nYou can use the Exception\
    \ Handling block to implement exception handling policies for WCF services. A\
    \ common scenario is to implement the Exception Shielding pattern at a WCF service\
    \ boundary. The Exception Handling block contains a handler specifically designed\
    \ for this (the Fault Contract exception handler), which maps the values in the\
    \ exception to a new instance of a fault contract that you specify.\n\n# CREATING\
    \ A FAULT CONTRACT\n\nA fault contract for a WCF service will generally contain\
    \ just the most useful properties for an exception, and exclude sensitive information\
    \ such as the stack trace and anything else that may provide attackers with useful\
    \ information about the internal workings of the service. The following code shows\
    \ a simple example of a fault contract suitable for use with the Fault Contract\
    \ exception handler:\n\n```\n<DataContract>() _\nPublic Class SalaryCalculationFault\n\
    \    Dim theID As Guid\n    Dim theMessage As String\n    Public Sub New()\n \
    \   End Sub\n    Public Sub New(ByVal FaultID As Guid, ByVal FaultMessage As String)\n\
    \        theID = FaultID\n        theMessage = FaultMessage\n    End Sub\nEnd\
    \ Class\n<DataMember>() _\nPublic Property FaultID() As Guid\n    Get\n      \
    \  Return theID\n    End Get\n    Set(ByVal value As Guid)\n        theID = value\n\
    \    End Set\nEnd Property\n<DataMember>() _\nPublic Property FaultMessage() As\
    \ String\n    Get\n        Return theMessage\n    End Get\n    Set(ByVal value\
    \ As String)\n```"
  merge: -1
  img_proc: true
- pgno: 99
