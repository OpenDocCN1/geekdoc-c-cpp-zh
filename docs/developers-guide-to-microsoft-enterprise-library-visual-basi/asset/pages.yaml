- pgno: 189
  md: '# *Validating Subclass Types*


    While discussing validation through attributes, we should briefly touch on the
    factors involved when you validate a class that inherits from the type you specified
    when creating the validator you use to validate it. For example, if you have a
    class named **SaleProduct** that derives from **Product**, you can use a validator
    defined for the **Product** class to validate instances of the **SaleProduct**
    class. The **Validate** method will also apply any relevant rules defined in attributes
    in both the **SaleProduct** class and the **Product** base class.


    If the derived class inherits a member from the base class and does not override
    it, the validators for that member defined in the base class apply to the derived
    class. If the derived class inherits a member but overrides it, the validators
    defined in the base class for that member do not apply to the derived class.


    # *Validating Properties that are Objects*


    In many cases, you may have a property of your class defined as the type of another
    class. For example, your **OrderLine** class is likely to have a property that
    is a reference to an instance of the **Product** class. It is common for this
    property to be defined as a base type or interface type, allowing you to set it
    to an instance of any class that inherits or implements the type specified for
    the property.


    You can validate such a property using an **ObjectValidator** attribute within
    the class.


    However, by default, the validator will validate the property using rules defined
    for the type of the property—in this example the type **IProduct**. If you want
    the validation to take place based on the actual type of the object that is currently
    set as the value of the property, you can add the **ValidateActualType** parameter
    to the **ObjectValidator** attribute, as shown here.


    ```

    Public Class Orderline

    <ObjectValidator(ValidateActualType:=True)> _

    Public Property OrderProduct(ByVal oProduct As IProduct)

    ...

    End Property

    ...

    End Class

    ```


    # *Using Data Annotation Attributes*


    The System.ComponentModel.DataAnnotations namespace in the .NET Framework contains
    a series of attributes that you can add to your classes and class members to signify
    metadata for these classes and members. They include a range of validation attributes
    that you can use to apply validation rules to your classes in much the same way
    as you can with the Validation block attributes. For example, the following shows
    how you can use the Range attribute to specify that the value of the property
    named **OnOrder** must be between 0 and 50.


    ```

    <Range(0, 50, ErrorMessage:="Quantity on order must be between 0 and 50.")> _

    Public Property OnOrder() As Integer

    ```'
  merge: -1
  img_proc: true
- pgno: 190
  md: '```

    End Property

    ```


    Compared to the validation attributes provided with the Validation block, there
    are some limitations when using the validation attributes from the DataAnnotations
    namespace:


    +   - The range of supported validation operations is less comprehensive, though
    there are some new validation types available in .NET Framework 4.0 that extend
    the range. However, some validation operations such as property value comparison,
    enumeration membership checking, and relative date and time comparison are not
    available when using data annotation validation attributes.

    +   - There is no capability to use Or composition, as there is with the Or Composite
    validator in the Validation block. The only composition available with data annotation
    validation attributes is the And operation.

    +   - You cannot specify rule sets names, and so all rules implemented with data
    annotation validation attributes belong to the default rule set.

    +   - There is no simple built-in support for self-validation, as there is in
    the Validation block.


    You can, of course, include both data annotation and Validation block attributes
    in the same class if you wish, and implement self-validation using the Validation
    block mechanism in a class that contains data annotation validation attributes.
    The validation methods in the Validation block will process both types of attributes.


    For more information about data annotations, see http://msdn.microsoft.com/en-us/library/system.componentmodel.dataannotations.aspx
    (NET Framework 3.5) and http://msdn.microsoft.com/en-us/library/system.componentmodel.dataannotations(VS.100).aspx
    (NET Framework 4.0).


    # An Example of Using Data Annotations


    The examples we provide for this chapter include one named Using Data Annotation
    Attributes and Self-Validation. This uses only the range of data annotation attributes
    in version 3.5 of the .NET Framework, so you can run it on machines that do not
    have Visual Studio 2010 or version 4.0 of the .NET Framework installed.


    The class named AnnotatedProduct contains data annotation attributes to implement
    the same rules as those applied by Validation block attributes in the Attributed
    Product class (which you saw in the previous example). However, due to the limitations
    with data annotations, the self-validation method within the class has to do more
    work to achieve the same validation rules.


    For example, it has to check the minimum value of some properties as the data
    annotation attributes in version 3.5 of the .NET Framework only support validation
    of the maximum value (in version 4.0, they do support minimum value validation).
    It also has to check the value of the DateDue property to ensure it is not more
    than six months in the future, and that the value of the ProductType property
    is a member of the ProductType enumeration.


    To perform the enumeration check, the self-validation method creates an instance
    of the Validation block Enum Conversion validator programmatically, and then calls
    its DoValidate method (which allows you to pass in all of the values of the required
    to perform the validation). The code passes to this method the value of the ProductType
    property,'
