    theMessage = value

    End Set

    End Property

    End Class

    ```


    # CONFIGURING THE EXCEPTION HANDLING POLICY


    Figure 6 shows a sample configuration for the Fault Contract exception handler.
    This specifies the type SalaryCalculationFault as the target fault contract type,
    and the exception message that the policy will generate to send to the client.
    Note that, when using the Fault Contract exception handler, you should always
    set the PostHandlingAction property to ThrowNewException so that the Exception
    Handling block throws an exception that forces WCF to return the fault contract
    to the client.


