- pgno: 102
  md: '# Handling Specific Exception Types


    So far, all of the examples have used an exception policy that handles a single
    exception type (in the examples, this is **Exception** so that the policy will
    apply to any type of exception passed to it). However, you can specify multiple
    exception types within a policy, and specify different handlers—including chains
    of handlers—for each exception type. Figure 7 shows a section of the configuration
    console with three exception types defined for the policy named **NotifyingRethrow**
    (which is used in the next example). Each exception type has a defined exception
    handler specified.


    ![](img/d7009d38323c3b86f2dfbc5155fbf141_102_0.png)


    FIGURE 7 Three exception types defined


    The advantage of this capability should be obvious. You can create policies that
    will handle different types of exceptions in different ways and, for each exception
    type, can have different messages and post-handling actions as well as different
    handler combinations. And, best of all, administrators can modify the policies
    post deployment to change the behavior of the exception handling as required.
    They can add new exception types, modify the types specified, change the properties
    for each exception type and the associated handlers, and generally fine-tune the
    strategy to suit day-to-day operational requirements.


    Of course, this will only work if your application code throws the appropriate
    exception types. If you generate informational exceptions that are all of the
    base type **Exception**, as we did in earlier examples in this chapter, only the
    handlers for that exception type will execute.'
  merge: -1
  img_proc: true
