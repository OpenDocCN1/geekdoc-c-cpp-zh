- pgno: 123
  md: '# Filtering by Severity in a Trace Listener


    The previous example generates a third disk file that we haven''t looked at yet.
    We didn''t forget this, but saved if for this section because it demonstrates
    another feature of the trace listeners that you will often find extremely useful.
    To see this, you need to view the file XmlLogFile.xml that was generated in the
    C:\Temp folder by the XML trace listener we used in the previous example. You
    should open it in Microsoft Internet Explorer® (or another Web browser or text
    editor) to see the structure.


    You will see that the file contains only one event from the previous example,
    not the three that the code in the example generated. This is because the XML
    trace listener has the **Filter** property in its configuration set to **Error**.
    Therefore, it will log only events with a severity of **Error** or higher. If
    you look back at the example code, you will see that only the last of the three
    calls to the **Write** method specified a value for the severity (**TraceEventType.Critical**
    in this case), and so the default value **Information** was used for the other
    two events.


    > If you get an error indicating that the XML document created by the XML trace
    listener is invalid, it''s probably because you have more than one log entry in
    the file. This means that it is not a valid XML document—it contains separate
    event log entries added to the file each time you ran this example. To view it
    as XML, you must open the file in a text editor and add an opening and closing
    element (such as **<root>** and **</root>**) around the content. Or, just delete
    it and run the example once more.


    All of the trace listeners provided with Enterprise Library expose the **Filter**
    property, and you can use this to limit the log entries written to the logging
    target to only those that are important to you. If your code generates many information
    events that you use for monitoring and debugging only under specific circumstances,
    you can filter these to reduce the growth and size of the log when they are not
    required.


    Alternatively, (as in the example) you can use the **Filter** property to differentiate
    the granularity of logging for different listeners in the same category. It may
    be that a flat file trace listener will log all entries to an audit log file for
    some particular event, but an E-mail trace listener in the same category will
    send e-mail messages to administrators only when an Error or Critical event occurs.


    # Filtering All Log Entries by Priority


    As well as being able to filter log entries in individual trace listeners based
    on their severity, you can set the Logging block to filter all log entries sent
    to it based on their priority. Alongside the log-enabled filter and category filter
    in the **Filters** section of the configuration (which we discussed earlier in
    this chapter), you can add a filter named Priority Filter.


    This filter has two properties that you can set: **Minimum Priority** and **Maximum
    Priority**. The default setting for the priority of a log entry is -1, which is
    the same as the default setting of the **Minimum Priority** property of the filter,
    and there is no maximum priority set. Therefore, this filter will not block any
    log entries. However, if you change the defaults for these properties, only log
    entries with a priority between the configured values (including the specified
    maximum and minimum values) will be logged. The exception is log entries that
    have the default priority of -1. These are never filtered.'
  merge: -1
  img_proc: true
