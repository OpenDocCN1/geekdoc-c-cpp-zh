    FIGURE 5 Editing the template for a text formatter


    The template we used in the Brief Format text formatter is shown here.


    ```

    Timestamp: {timestamp(local)}{newline}Message: {message}{newline}Category: {category}{newline}Priority:
    {priority}{newline}EventId: {eventid}{newline}ActivityId: {property(ActivityId)}{newline}Severity:
    {severity}{newline}Title: {title}{newline}

    ```


    # Non-Formatted Trace Listeners


    While we are discussing output formatting, there is one other factor to consider.
    Some trace listeners do not use a text formatter to format the output they generate.
    This is generally because the output is in a binary or specific format. The WMI
    trace listener is a typical example that does not use a text formatter.


    For such trace listeners, you can set the TraceOutputOptions property to one of
    a range of values to specify the values you want to include in the output. The
    Trace OutputOptions property accepts the value from the System.Diagnostics.TraceOptions
    enumeration. Valid values include CallStack, DateTime, ProcessId, LogicalOperation
    Stack, Timestamp, and ThreadId. The documentation installed with Enterprise Library,
    and the documentation for the System.Diagnostics namespace on MSDN®, provide more
    information.'
