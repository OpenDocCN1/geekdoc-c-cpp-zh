- pgno: 43
  md: '# Summary


    This brief introduction to Enterprise Library will help you to get started if
    you are not familiar with its capabilities and the basics of using it in applications.
    This chapter described what Enterprise Library is, where you can get it, and how
    it can make it much easier to manage your crosscutting concerns. This book concentrates
    on the application blocks in Enterprise Library that “do stuff” (as opposed to
    those that “wire up stuff”). The blocks we concentrate on in this book include
    the Caching, Cryptography, Data Access, Exception Handling, Logging, Security,
    and Validation Application Blocks.


    The aim of this chapter was also to help you get started with Enterprise Library
    by explaining how you deploy and reference the assemblies it contains, how you
    configure your applications to use Enterprise Library, how you instantiate Enterprise
    Library objects, and the example applications we provide. Some of the more advanced
    features and configuration options were omitted so that you may concentrate on
    the fundamental requirements. However, each appendix in this guide provides more
    detailed information, while Enterprise Library contains substantial reference
    documentation, samples, and other resources that will guide you as you explore
    these more advanced features.'
  merge: -1
  img_proc: true
