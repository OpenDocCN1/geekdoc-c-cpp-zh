- pgno: 21
  md: '# Welcome to the Library


    # Meet the Librarian


    Before we begin our exploration of Microsoft® Enterprise Library and the wondrous
    range of capabilities and opportunities it encompasses, you need to meet the Librarian.
    Sometimes we call him Tom, sometimes we call him Chris, and sometimes we call
    him Grigori. But, despite this somewhat unnerving name variability, he—in collaboration
    with an advisory board of experts from the industry and other internal Microsoft
    product groups, and a considerable number of other community contributors—is the
    guardian and protector of the Microsoft Enterprise Library.


    Since its inception as a disparate collection of individual application blocks,
    the Librarian has guided, prodded, inspired, and encouraged his team to transform
    it into a comprehensive, powerful, easy-to-use, and proven library of code that
    can help to minimize design and maintenance pain, maximize development productivity,
    and reduce costs. And now in version 5.0, it contains even more built-in goodness
    that should make your job easier. It’s even possible that, with the time and effort
    you will save, Enterprise Library can reduce your golf handicap, help you master
    the ski slopes, let you spend more time with your kids, or just make you a better
    person. However, note that the author, the publisher, and their employees cannot
    be held responsible if you just end up watching more TV or discovering you actually
    have a life.


    # What You Get with Enterprise Library


    Enterprise Library is made up of a series of application blocks, each aimed at
    managing specific crosscutting concerns. In case this concept is unfamiliar, crosscutting
    concerns are those annoying tasks that you need to accomplish in several places
    in your application. When trying to manage crosscutting concerns there is often
    the risk that you will implement slightly different solutions for each task at
    each location in your application, or that you will just forget them altogether.
    Writing entries to a system log file or Windows® Event Log, caching data, and
    validating user input are typical crosscutting concerns. While there are several
    approaches to managing them, the Enterprise Library application blocks can centralize
    and manage.'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'What are application blocks? The definition we use is “pluggable and reusable
    software components designed to assist developers with common enterprise development
    challenges.” Application blocks help address the kinds of problems developers
    commonly face from one line-of-business project to the next. Their design encapsulates
    the Microsoft recommended practices for Microsoft .NET Framework–based applications,
    and developers can add them to .NET-based applications and configure them quickly
    and easily.


    As well as the application blocks, Enterprise Library contains configuration tools,
    plus a set of core functions that manage tasks applicable to all of the blocks.
    Some of these functions—routines for handling configuration and serialization,
    for example—are exposed and available for you to use in your own applications.


    And, on the grounds that you need to learn how to use any new tool that is more
    complicated than a hammer or screwdriver, Enterprise Library includes a range
    of sample applications, descriptions of key scenarios for each block, hands-on
    labs, and comprehensive reference documentation. You even get all of the source
    code and the unit tests that the team created when building each block (the team
    follows a test-driven design approach by writing tests before writing code). So
    you can understand how it works, see how the team followed good practices to create
    it, and then modify it if you want it to do something different. Figure 1 shows
    the big picture of Enterprise Library.


    # Enterprise Library Big Picture


    ![](img/d7009d38323c3b86f2dfbc5155fbf141_22_0.png)'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# Things You Can Do with Enterprise Library


    If you look at the installed documentation, you''ll see that Enterprise Library
    today actually contains nine application blocks. However, there are actually only
    seven blocks that “do stuff”—these are referred to as functional blocks. The other
    two are concerned with “wiring up stuff” (the wiring blocks). What this really
    means is that there are seven blocks that target specific crosscutting concerns
    such as caching, logging, data access, and validation. The other two, the Unity
    Dependency Injection mechanism and the Policy Injection Application Block, are
    designed to help you implement more loosely coupled, testable, and maintainable
    systems. There’s also some shared core pieces used in all the blocks. This is
    shown in Figure 2.


    ![](img/d7009d38323c3b86f2dfbc5155fbf141_23_0.png)


    **FIGURE 2** The parts of Enterprise Library


    In this book we’ll be concentrating on the seven functional blocks. If you want
    to know more about how you can use Unity and the Policy Injection Application
    Block, check out the appendixes for this guide. They describe the capabilities
    of Unity as a dependency injection mechanism and the use of policy injection in
    more detail.


    +   • **Caching.** The Caching Application Block lets you incorporate a local
    cache in your applications that uses an in-memory cache and, optionally, a database
    or isolated storage backing store. The block provides all the functionality needed
    to retrieve, add, and remove cached data, and supports configurable expiration
    and scavenging policies. You can also extend it by creating your own pluggable'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'providers or by using third-party providers—for example, to support distributed
    caching and other features. Caching can provide considerable improvements in performance
    and efficiency in many application scenarios.


    +   - Credential Management. The Security Application Block lets you easily implement
    common authorization-related functionality, such as caching the user''s authorization
    and authentication data and integrating with the Microsoft .NET Framework security
    features.


    +   - Data Access. The Data Access Application Block simplifies many common data
    access tasks such as reading data for display, passing data through application
    layers, and submitting changed data back to the database system. It includes support
    for both stored procedures and in-line SQL, can expose the data as a sequence
    of objects for client-side querying, and provides access to the most frequently
    used features of ADO.NET in simple-to-use classes.


    +   - Encryption. The Cryptography Application Block makes it easy to incorporate
    cryptographic functionality such as encrypting and decrypting data, creating a
    hash from data, and comparing hash values to verify that data has not been altered.
    Using this block can help you avoid common pitfalls when developing custom mechanisms
    that might introduce security vulnerabilities.


    +   - Exception Handling. The Exception Handling Application Block lets you quickly
    and easily design and implement a consistent strategy for managing exceptions
    that occur in various architectural layers of your application. It can log exception
    information, hide sensitive information by replacing the original exception with
    another exception, and maintain contextual information for an exception by wrapping
    the original exception inside another exception.


    +   - Logging. The Logging Application Block simplifies the implementation of
    common logging functions such as writing information to the Windows Event Log,
    an e-mail message, a database, Windows Message Queuing, a text file, a Windows
    Management Instrumentation (WMI) event, or a custom location.


    +   - Validation. The Validation Application Block provides a range of features
    for implementing structured and easy-to-maintain validation mechanisms using attributes
    and rule sets, and integrating with most types of application interface technologies.


    # Why You Should Use Enterprise Library


    As you can see from the previous section, Enterprise Library provides a comprehensive
    set of features that can help you to manage your crosscutting concerns though
    a reusable set of components and core functionality. Of course, like many developers,
    you may suffer from the well-known NIH (not invented here) syndrome. But, seriously,
    isn''t it about time that every developer on your team stopped writing his or
    her own logging framework? It''s a commonly accepted fact that the use of standard
    and proven code libraries and components can save development time, minimize costs,
    reduce the use of precious test resources, and decrease the overall maintenance
    effort. In the words of the Librarian, “These days you cannot afford not to reuse.”'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'You can download the Nucleus Research 2009 Report on Microsoft patterns & practices,
    which reviews the key components, benefits, and includes direct feedback from
    software architects and developers who have adopted patterns & practices deliverables
    in their projects and products from http://msdn.microsoft.com/en-us/practices/ee406167.aspx.


    And it''s not as though Enterprise Library is some new kid on the block that might
    morph into something completely different next month. Enterprise Library as a
    concept has been around for many years, and has passed through five full releases
    of the library as well as intermediate incremental releases.


    Enterprise Library continues to evolve along with the capabilities of the .NET
    Framework. As the .NET Framework has changed over time, some features that were
    part of Enterprise Library were subsumed into the core, while Enterprise Library
    changed to take advantage of the new features available in both the .NET Framework
    and the underlying system. Examples include new programming language capabilities
    and improved performance and capabilities in the .NET configuration and I/O mechanisms.
    Yet, even in version 5.0, the vast majority of the code is entirely backwards
    compatible with applications written to use Enterprise Library 2.0.


    You can also use Enterprise Library as learning material—not only to implement
    design patterns in your application, but also to learn how the development team
    applies patterns when writing code. Enterprise Library embodies many design patterns,
    and demonstrates good architectural and coding techniques. The source code for
    the entire library is provided, so you can explore the implementations and reuse
    the techniques in your own applications.


    And, finally, it is free! Or rather, it is distributed under the Microsoft Public
    License (MSPL) that grants you a royalty-free license to build derivative works,
    and distribute them free—or even sell them. You must retain the attribution headers
    in the source files, but you can modify the code and include your own custom extensions.
    Do you really need any other reasons to try Enterprise Library?


    You''ll notice that, even though we didn''t print “Don''t Panic!” in large friendly
    letters on your cover, this book does take a little time to settle down into a
    more typical style of documentation, and start providing practical examples. However,
    you can be sure that—from here on in—you''ll find a whole range of guidance and
    examples that will help you master Enterprise Library quickly and easily. There
    are other resources to help if you''re getting started with Enterprise Library
    (such as hands-on-labs), and there''s help for existing users as well (such as
    the breaking changes and migration information for previous versions) available
    at http://www.codeplex.com/entlib/. You can also visit the source code section
    of the site to see what the Enterprise Library team is working on as you read
    this guide.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# Some Fundamentals of Enterprise Library


    Before we dive into our tour of the application blocks and features of Enterprise
    Library, you need to grasp some fundamentals. In this chapter, the Librarian will
    help you explore topics such as how to install and deploy the library, and how
    to perform initial configuration. After that, you''ll be free to skip to any of
    the other chapters and learn more about the ways that each block helps you to
    simplify your code and manage your crosscutting concerns. For more information
    about the topics covered in this chapter, see the product documentation installed
    with Enterprise Library, or the online documentation available at http://go.microsoft.com/fwlink/?LinkId=188874.


    # CHOOSING WHICH BLOCKS TO INSTALL


    Enterprise Library is a “pick and mix” candy store, where you choose just the
    features you want to use and simply disregard the rest. Of course, before you
    can choose your favorite candies from the tempting displays in the candy store,
    you need to find a paper bag to hold them. You can think of this as a prerequisite
    for picking and mixing, a basic feature that you will use every time—irrespective
    of whether you choose gummy bears, chocolate-covered hazelnuts, or mint imperials.


    Likewise, with Enterprise Library, there are prerequisites and basic features.
    The main prerequisite before you start development is to install the binaries
    and support files onto your machine. The basic features that you need every time
    you use Enterprise Library are the core assemblies that implement access to configuration,
    object creation, and ancillary features used by all of the blocks.


    However, when you install Enterprise Library, you can choose which of the application
    blocks you want to install; though it is generally a good idea to install them
    all unless you are sure you will not use specific blocks. Some blocks have dependencies
    on other blocks, and installing all of them while developing your applications
    will simplify configuration and ensure that you do not have to re-run the installer
    to add other blocks later on. When you come to deploy your application, you only
    need to deploy the blocks you are using and their dependent blocks.


    For example, the Exception Handling block depends on the Logging block for logging
    exception information. Table 1 shows the full list of these dependencies.


    TABLE 1 Application block optional dependencies


    | Application Block | Optional dependencies |

    |---|---|

    | Caching Block | May use the Data Access block to cache data in a database. May
    use the Cryptography block to encrypt cached data. |

    | Exception Handling Block | May use the Logging block to log exception information.
    May use the Data Access block to log exception information to a database. |

    | Logging Block | May use the Data Access block to log to a database. |

    | Security Block | May use the Caching block to cache credentials. May use the
    Data Access block to cache credentials in a database. May use the Cryptography
    block to encrypt cached credentials. |'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'The configuration tools will automatically add the required block to your application
    configuration file with the default configuration when required. For example,
    when you will add a Logging handler to an Exception Handling block policy, the
    configuration tool will add the Logging block to the configuration with the default
    settings.


    The seven application blocks we cover in this guide are the functional blocks
    that are specifically designed to help you manage a range of crosscutting concerns.
    All of these blocks depend on the core features of Enterprise Library, which in
    turn depend on the Unity dependency injection and interception mechanism (the
    Unity Application Block) to perform object creation and additional basic functions.


    # INSTALLING ENTERPRISE LIBRARY


    To begin using Enterprise Library you must first install it. You can download
    the current version from http://msdn.microsoft.com/entlib/. Simply run the Microsoft
    Installer (MSI) package to begin the installation, and select the blocks and features
    you want to install. This installs the precompiled binaries ready for you to use,
    along with the accompanying tools and resources such as the configuration editor
    and scripts to install the samples and instrumentation.


    If you want to examine the source code, and perhaps even modify it to suit your
    own requirements, be sure to select the option to install the source code when
    you run the installer. The source code is included within the main installer as
    a separate package, which allows you to make as many working copies of the source
    as you want and go back to the original version easily if required. If you choose
    to install the source, then it''s also a good idea to select the option to have
    the installer compile the library for you so that you are ready to start using
    it straight away. However, if you are happy to use the precompiled assemblies,
    you do not need to install or compile the source code.


    After the installation is complete, you will see a Start menu entry containing
    links to the Enterprise Library tools, source code installer, and documentation.
    The tools include batch files that install instrumentation, database files, and
    other features. There are also batch files that you can use to compile the entire
    library source code, and to copy all assemblies to the bin folder within the source
    code folders, if you want to rebuild the library from the source code.


    # ASSEMBLIES AND REFERENCES


    It''s not uncommon, when people first look at Enterprise Library, to see a look
    of mild alarm spread across their faces. Yes, there are quite a few assemblies,
    but remember:


    +   - You only need to use those directly connected with your own scenario.

    +   - Several are required for only very special situations.

    +   - The runtime assemblies you will use in your applications are mostly less
    than 100 KB in size; and the largest of all is only around 500 KB.

    +   - In most applications, the total size of all the assemblies you will use
    will be between 1 and 2 MB.'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'The assemblies you should add to any application that uses Enterprise Library
    are the common (core) assembly, the Unity dependency injection mechanism (if you
    are using the default Unity container), and the container service location assembly:


    +   - Microsoft.Practices.EnterpriseLibrary.Common.dll

    +   - Microsoft.Practices.Unity.dll

    +   - Microsoft.Practices.Unity.Interception.dll

    +   - Microsoft.Practices.ServiceLocation.dll


    You will also need the assembly **Microsoft.Practices.Unity.Configuration.dll**
    if you wish to reference specific Unity configuration classes in your code. However,
    in the majority of cases, you will not require this assembly.


    In addition to the required assemblies, you must reference the assemblies that
    implement the Enterprise Library features you will use in your application. There
    are several assemblies for each application block. Generally, these comprise a
    main assembly that has the same name as the block (such as **Microsoft.Practices.EnterpriseLibrary.Logging.dll**),
    plus additional assemblies that implement specific handlers or capabilities for
    the block. You only need these additional assemblies if you want to use the features
    they add. For example, in the case of the Logging block, there is a separate assembly
    for logging to a database (**Microsoft.Practices.EnterpriseLibrary.Logging.Database.dll**).
    If you do not log to a database, you do not need to reference this additional
    assembly.


    # # GAC or Bin, Signed or Unsigned?


    All of the assemblies are provided as precompiled signed versions that you can
    install into the global assembly cache (GAC) if you wish. However, if you need
    to run different versions of Enterprise Library assemblies side by side, this
    may be problematic and you may prefer to locate them in folders close to your
    application.


    You can then reference the compiled assemblies in your projects, which automatically
    copies them to the bin folder. In a Web application, you can simply copy them
    directly to your application''s bin folder. This approach gives you simple portability
    and easy installation.


    Alternatively, you can install the source code for Enterprise Library and use
    the scripts provided to compile unsigned versions of the assemblies. This is useful
    if you decide to modify the source code to suit your own specific requirements.
    You can strong name and sign the assemblies using your own credentials afterwards
    if required.


    For more information about side-by-side operation and other deployment issues,
    see the documentation installed with Enterprise Library and available online at
    http://go.microsoft.com/fwlink/?LinkId=188874.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# # Importing Namespaces


    After importing the appropriate assemblies in your projects, you will probably
    want to add **Imports** statements to your project files to simplify your code
    and avoid specifying objects using the full namespace names. Start by importing
    the two core namespaces that you will require in every project that uses Enterprise
    Library:


    +   - Microsoft.Practices.EnterpriseLibrary.Common

    +   - Microsoft.Practices.EnterpriseLibrary.Common.Configuration


    Depending on how you decide to work with Enterprise Library in terms of instantiating
    the objects it contains, you may need to import two more namespaces. We’ll come
    to this when we look at object instantiation in Enterprise Library a little later
    in this chapter.


    You will also need to import the namespaces for the specific application blocks
    you are using. Most of the Enterprise Library assemblies contain several namespaces
    to organize the contents. For example, as you can see in Figure 3, the main assembly
    for the Logging block (one of the more complex blocks) contains a dozen subsidiary
    namespaces. If you use classes from these namespaces, such as specific filters,
    listeners, or formatters, you may need to import several of these namespaces.


    ![](img/d7009d38323c3b86f2dfbc5155fbf141_29_0.png)


    FIGURE 3 Namespaces in the Logging block'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# Configuring Enterprise Library


    Before the original individual application blocks were combined into Enterprise
    Library, one of the biggest challenges for users was configuration. You had to
    edit the sections of the application configuration file manually, which proved
    to be error-prone and just plain annoying. In Enterprise Library, you have a choice
    of tools for performing configuration and a wealth of opportunities for defining
    and managing your configuration information.


    This flexibility comes about because Enterprise Library uses configuration sources
    to expose configuration information to the application blocks and the core features
    of the library. The configuration sources can read configuration from standard
    .NET configuration files (such as App.config and Web.config), from other files,
    from a database (using the example SQL Configuration Source available from http://entlib.codeplex.com),
    and can also take into account Group Policy rules for a machine or a domain.


    In addition, you can use the fluent interface or the .NET configuration API to
    create and populate configuration sources programmatically, merge parts of your
    configuration with a central shared configuration, generate merged configuration
    files, and generate different configurations for individual run-time environments.
    For more information about these more advanced configuration scenarios, see Appendix
    D, “Enterprise Library Configuration Scenarios.”


    # THE CONFIGURATION TOOLS


    Enterprise Library includes a stand-alone console, and a configuration editor
    that integrates with Microsoft Visual Studio®. The stand-alone console is provided
    as versions specifically aimed at the 32-bit (x86) platform and versions compiled
    for any platform. For each of these platforms, there is a separate version of
    the console for the 3.5 and 4.0 versions of the .NET Framework. You can even copy
    it (and the assemblies it uses) to a machine that does not have Enterprise Library
    installed if you just want to perform post-deployment configuration and system
    administration. Figure 4 shows the configuration console with some of the application
    blocks covered in this book installed into the configuration.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '![](img/d7009d38323c3b86f2dfbc5155fbf141_31_0.png)


    # FIGURE 4 The Enterprise Library configuration console


    The Visual Studio configuration editor displays an interface very similar to that
    shown in Figure 4, but allows you to edit your configuration files with a simple
    right-click in Solution Explorer.


    # USING THE CONFIGURATION TOOLS


    The most common scenario for basic configuration of an application is to store
    the configuration information in a local configuration file (such as Web.config
    or App.config). You can create a new Enterprise Library configuration in the configuration
    console and then save it to a disk, or you can open an existing configuration
    file and edit it to add Enterprise Library to your application.


    Even if you use the more advanced approaches described in Appendix D, “Enterprise
    Library Configuration Scenarios,” the techniques for defining your Enterprise
    Library configuration are basically the same. The general procedure for configuring
    an application is as follows:'
  merge: -1
  img_proc: true
- pgno: 32
  md: "1. Open the stand-alone configuration tool from your **Start** menu, or right-click\
    \ on a configuration file in Visual Studio Solution Explorer and click **Edit\
