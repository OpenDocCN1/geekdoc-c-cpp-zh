    \ values in the `<appSettings>` section of your configuration file, select **Add\
    \ Application Settings**.\n   * If you want to enable instrumentation for Enterprise\
    \ Library, select **Add Instrumentation Settings**.\n   * If you want to use an\
    \ alternative source for your configuration, such as a custom XML file, select\
    \ **Add Configuration Settings**.\n\n3. To view the configuration settings for\
    \ each section, block, or provider, click the right-facing arrow next to the name\
    \ of that section, block, or provider. Click it again, or press the Spacebar key,\
    \ to collapse this section.\n\n4. To view the properties pane for each main configuration\
    \ section, click the downward-facing double arrow. Click it again to close the\
    \ properties pane.\n\n5. To add a provider to a block, depending on the block\
    \ or the type of provider, you either right-click the section in the left column\
    \ and select the appropriate **Add** item on the shortcut menu, or click the plus-sign\
    \ icon in the appropriate column of the configuration tool. For example, to add\
    \ a new exception type to a policy in the Exception Handling block, right-click\
