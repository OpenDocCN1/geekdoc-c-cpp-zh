- pgno: 120
  md: 'configured trace listeners. Any log entries with a lower severity will be blocked.
    The default severity is All, and so no log entries will be blocked unless you
    change this value. You can also configure a Severity Filter (which sets the Filter
    property) for each individual trace listener, and these values can be different
    for trace listeners in the same category. You will see how to use the Filter property
    of a trace listener in the next example in this chapter.


    # Filtering by Category


    The Logging Filters section of the Logging block configuration can contain a filter
    that you can use to filter log entries sent to the block based on their membership
    in specified categories. You can add multiple categories to your configuration
    to manage filtering, though overuse of this capability can make it difficult to
    manage logging.


    To help you define filters, the Configuration tool contains a filter editor dialog
    that allows you to specify the filter mode (Allow all except... or Deny all except...)
    and then build a list of categories to which this filter will apply. The example
    application contains only a single filter that is configured to allow logging
    to all categories except for the category named (rather appropriately) BlockedByFilter.
    You will see the BlockedByFilter category used in the section “Capturing Unprocessed
    Events and Logging Errors” later in this chapter.


    # Writing Log Entries to Multiple Categories


    In addition to being able to define multiple categories, you can send a log entry
    to more than one category in a single operation. This approach often means you
    can define fewer categories, and it simplifies the configuration because each
    category can focus on a specific task. You don’t need to have multiple categories
    with similar sets of trace listeners.


    The second example, Logging to multiple categories with the Write method of a
    LogWriter, shows how to write to multiple categories. The example has two categories,
    named DiskFiles and Important, defined in the configuration. The DiskFiles category
    contains references to a flat file trace listener and an XML trace listener. The
    Important category contains references to an event log trace listener and a rolling
    flat file trace listener.


    The example uses the following code to create an array of the two category names,
    DiskFiles and Important, and then it writes three log messages to these two categories
    using the Write method of the LogWriter in the same way as in the previous example.
    Again, we’ve removed some of the Console.WriteLine statements to make it easier
    to see what the code actually does.


    ```

    '' Check if logging is enabled before creating log entries.

    If defaultWriter.IsLoggingEnabled() Then


    '' Create a string array (or List<>) containing the categories.

    Dim logCategories As String() = New String() {"DiskFiles", "Important"}


    '' Write the log entries using these categories.

    defaultWriter.Write("Log entry with multiple categories.", logCategories)

    ```'
