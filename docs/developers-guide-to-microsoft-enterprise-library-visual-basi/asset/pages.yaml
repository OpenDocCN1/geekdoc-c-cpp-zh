  md: "Name = Hitch Rack - 4-Bike\nDescription = Carries 4 bikes securely; steel construction,\
    \ fits 2\" receiver hitch.\n\n# Working with DataSets\n\nIf you need to retrieve\
    \ data and store it in a way that allows you to push changes back into the database,\
    \ you will usually use a **DataSet**. The Data Access block supports simple operations\
    \ on a original (non-typed) **DataSet**, including the capability to fill a **DataSet**\
    \ and then update the original database table from the **DataSet**.\n\nTo fill\
    \ a **DataSet**, you use the **ExecuteDataSet** method, which returns a new instance\
    \ of the **DataSet** class populated with a table containing the data for each\
    \ row set returned by the query (which may be a multiple-statement batch query).\
    \ The tables in this **DataSet** will have default names such as **Table**, **Table1**,\
    \ and **Table2**.\n\nIf you want to load data into an existing **DataSet**, you\
    \ use the **LoadDataSet** method. This allows you to specify the name(s) of the\
    \ target table(s) in the **DataSet**, and lets you add additional tables to an\
    \ existing **DataSet** or refresh the contents of specific tables in the **DataSet**.\n\
    \nBoth of these methods, **ExecuteDataSet** and **LoadDataSet**, have a similar\
    \ broad set of overloads to the **ExecuteReader** and other methods you've seen\
    \ earlier in this chapter. You can specify a **CommandType** (the default is **StoredProcedure**)\
    \ and either a SQL statement or a stored procedure name. You can also pass in\
    \ an array of **Object** instances that represent the parameters for the query.\
    \ Alternatively, you can pass to the method a **Command** object that contains\
    \ any parameters you require.\n\nFor example, the following code lines show how\
    \ you can use the **ExecuteDataSet** method with a SQL statement; with a stored\
    \ procedure and a parameter array; and with a command pre-populated with parameters.\
    \ The code assumes you have created the Data Access block **Database** instance\
    \ named **db**.\n\n```\n```vb\nDim productDataSet As DataSet\n\n' Using a SQL\
    \ statement.\nDim sql As String = \"SELECT CustomerName, CustomerPhone FROM Customers\"\
    \nproductDataSet = db.ExecuteDataSet(CommandType.Text, sql)\n\n' Using a stored\
    \ procedure and a parameter array.\nproductDataSet = db.ExecuteDataSet(\"GetProductsByCategory\"\
    , _\n    New Object() { \"%bike%\" })\n\n' Using a stored procedure and a named\
    \ parameter.\nDim cmd As DbCommand = db.GetStoredProcCommand(\"GetProductsByCategory\"\
    )\ndb.AddInParameter(cmd, \"@CategoryID\", DbType.Int32, 7)\nproductDataSet =\
    \ db.ExecuteDataSet(cmd)\n```\n```"
