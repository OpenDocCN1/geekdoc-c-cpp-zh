- pgno: 33
  md: '+   8. To set the default provider for a block, such as the default **Database**
    for the Data Access block, click the down-pointing double arrow icon next to the
    block name and select the default provider name from the drop-down list. In this
    section you can also specify the type of provider used to encrypt this section,
