  md: "```\nSub DisplayRowValues(ByVal reader As IDataReader)\n    While reader.Read()\n\
    \        Dim i As Integer = 0\n        While i < reader.FieldCount\n         \
    \   Console.WriteLine(\"{0} = {1}\", reader.GetName(i), reader(i).ToString())\n\
    \            System.Math.Max(System.Threading.Interlocked.Increment(i), i - 1)\n\
