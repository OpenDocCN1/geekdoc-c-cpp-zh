- pgno: 109
  md: '# Introduction


    Just in case you didn''t quite grasp it from the title, this chapter is about
    one of the most useful and popular of the Enterprise Library blocks, the Logging
    application block, which makes it really easy to perform logging in a myriad of
    different ways depending on the requirements of your application.


    Logging generally fulfills two main requirements: monitoring general application
    performance, and providing information. In terms of performance, logging allows
    you to monitor what’s happening inside your application and, in some cases, what’s
    happening in the world outside as well. For example, logging can indicate what
    errors or failures have occurred, when something that should have happened did
    not, and when things are taking a lot longer than they should. It can also simply
    provide status information on processes that are working correctly—including those
    that talk to the outside world. Let’s face it, there’s nothing more rewarding
    for an administrator than seeing an event log full of those nice blue information
    icons.


    Secondly, and possibly even more importantly, logging can provide vital information
    about your application. Often referred to as auditing, this type of logging allows
    you to track the behavior of users and processes in terms of the tasks they carry
    out, the information they read and change, and the resources they access. It can
    provide an audit trail that allows you to follow up and get information about
    malicious activity (whether it succeeds or not), will allow you to trace events
    that may indicate future attack vectors or reveal security weaknesses, and even
    help you to recover when disaster strikes (though this doesn’t mean you shouldn’t
    be taking the usual precautions such as backing up systems and data). One other
    area where audit logging is useful is in managing repudiation. For example, your
    audit logs may be useful in legal or procedural situations where users or external
    attackers deny their actions.


    The Logging block is a highly flexible and configurable solution that allows you
    to create and store log messages in a wide variety of locations, categorize and
    filter messages, and collect contextual information useful for debugging and tracing
    as well as for auditing and general logging requirements. It abstracts the logging
    functionality from the log destination so that the application code is consistent,
    irrespective of the location and type of the target logging store. Changes to
    almost all of the parameters that control'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'logging are possible simply by changing the configuration after deployment
    and at run time. This means that administrators and operators can vary the logging
    behavior as they manage the application, including when using Group Policy.


    # What Does the Logging Block Do?


    The Logging application block allows you to decouple your logging functionality
    from your application code. The block can route log entries to a Windows® Event
    Log, a database, or a text (or XML) file. It can also generate an e-mail message
    containing the logging information, a message you can route through Windows Message
    Queuing (using a distributor service provided with the block), or a Windows Management
    Instrumentation (WMI) event. And, if none of these built-in capabilities meets
    your requirements, you can create a provider that sends the log entry to any other
    custom location or executes some other action.


    In your application, you simply evaluate a log entry using a suitable logging
    object, such as the LogWriter class, and then call a method to write the information
    it contains to the logging system. The Logging block routes the log message through
    any filters you define in your configuration, and on to the listeners that you
    configure. Each listener defines the target of the log entry, such as Windows
    Event Log or an e-mail message, and uses a formatter to generate suitably formatted
    content for that logging target.


    You can see from this that there are many objects involved in this multi-step
    process, and it is important to understand how they interact and how the log message
    flows through the pipeline of processes. Figure 1 shows the overall process in
    more detail, and provides an explanation of each stage.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '![](img/d7009d38323c3b86f2dfbc5155fbf141_111_0.png)


    FIGURE 1 An overview of the logging process and the objects in the Logging block'
  merge: -1
  img_proc: true
- pgno: 112
  md: '| Stage | Description |

    | :--- | :--- |

    | Creating the Log Entry | The user creates a **LogWriter** instance, uses it
    to create a new **LogEntry**, and passes it to the Logging block for processing.
    Alternatively, the user can create a new **LogEntry** explicitly, populate it
    with the required information, and use a **LogWriter** to pass it to the Logging
    block for processing. |

    | Filtering the Log Entry | The Logging block filters the **LogEntry** (based
    on your configuration settings) for message priority, or categories you added
    to the **LogEntry** when you created it. It also checks to see if logging is enabled.
    These filters can prevent any further processing of the log entries. This is useful,
    for example, when you want to allow administrators to enable and disable additional
    debug information logging without requiring them to restart the application. |

    | Selecting Trace Sources | Trace sources act as the link between the log entries
    and the log targets. There is a trace source for each category you define in the
    logging block configuration; plus, there are three built-in trace sources that
    capture all log entries, unprocessed entries that do not match any category, and
    entries that cannot be processed due to an error while logging (such as an error
    while writing to the target log). |

    | Selecting Trace Listeners | Each trace source has one or more trace listeners
    defined. These listeners are responsible for taking the log entry, passing it
    through a separate log formatter that translates the content into a suitable format,
    and passing it to the target log. Several trace listeners are provided with the
    block, and you can create your own if required. |

    | Formatting the Log Entry | Each trace listener can use a log formatter to format
    the information contained in the log entry. The block contains log message formatters,
    and you can create your own formatter if required. The text formatter uses a template
    containing placeholders that makes it easy to generate the required format for
    log entries. |


    # LOGGING CATEGORIES


    Categories allow you to specify the target(s) for log entries processed by the
    block. You can define categories that relate to one or more targets. For example,
    you might create a category named General containing trace listeners that write
    to text files and XML files, and a category named Auditing for administrative
    information that is configured to use trace listeners that write to one or more
    databases. Then you can assign a log entry to one or more categories, effectively
    mapping it to multiple targets. The three log sources shown in the schematic in
    Figure 1 (all events log source, not processed log source, and errors log source)
    are themselves categories for which you can define trace listeners.


    Logging is an added-value service for applications, and so any failures in the
    logging process must be handled gracefully without raising an exception to the
    main business processes. The Logging block achieves this by sending all logging
    failures to a special category (the errors log source) which is named **Logging
    Errors & Warnings**. By default, these error messages are written to Windows Event
    Log, though you can configure this category to write to other targets using different
    trace listeners if you wish.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# LOGGING OVERHEAD AND ADDITIONAL CONTEXT INFORMATION


    No matter how you implement logging, it will always have some performance impact.
    The Logging block provides a flexible and highly configurable logging solution
    that is carefully designed to minimize performance impact. However, you should
    be aware of this impact, and consider how your logging strategy will affect it.
    For example, a complex configuration that writes log entries to multiple logs
    and uses multiple filters is likely to have more impact than simple configurations.
    You must balance your requirements for logging against performance and scalability
    needs.


    To maximize performance, the **LogWriter** class by default exposes properties
    only for the commonly required information. This includes the event ID, message,
    priority, and categories you specify in the configuration. The **LogWriter** also
    automatically collects some context information such as the time, the application
    domain, the machine name, and the process ID—where possible—using cached values
    in order to minimize performance impact.


    However, collecting additional context information can be expensive in processing
    terms and, if you are not going to use the information, wastes precious resources
    and may affect performance. Therefore, the Logging block only collects other less
    commonly used information from the environment, which you might require only occasionally,
    if you specify that you want this information when you create the **LogEntry**
    instance. Four classes within the Logging block can collect specific sets of context
    information that you can add to your log entry. This includes COM+ diagnostic
    information, the current stack trace, the security-related information from the
    managed runtime, and security-related information from the operating system. There
    is also a dictionary property for the log entry where you can add any additional
    custom information you require, and which must appear in your logs.


    # How Do I Use the Logging Block?


    It’s time to see some examples of the Logging block use, including how to create
    log entries and write them to various targets such as the Windows Event Log, disk
    files, and a database. Later you’ll see how you can use some of the advanced features
    of the block, such as checking filter status and adding context information to
    a log entry. However, before you can start using the Logging block, you must configure
    it.


    # CONFIGURING THE LOGGING BLOCK


    You can configure the Logging block using the configuration tool described in
    Chapter 1, “Introduction.” The logging settings section of the configuration tool
    contains three columns where you configure filters (trace sources), logging target
    listeners (trace listeners), and log message formatters. The first column contains
    three types of filter: categories (category sources), special categories, and
    logging filters. All of these items were described in the schematic shown in Figure
    1 and the accompanying table.


    Figure 2 shows the configuration tool loaded with the configuration for the examples
    used in this chapter. You can see that we have configured several types of filters,
    listeners, and formatters. As the configuration contains the Database trace listener,
    the configuration tool has automatically added the Database Settings section as
    well.'
  merge: -1
  img_proc: true
