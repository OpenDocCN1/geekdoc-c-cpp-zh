- pgno: 105
  md: '# Assisting Administrators


    Some would say that the Exception Handling block already does plenty to make an
    administrator''s life easy. However, it also contains features that allow you
    to exert extra control over the way that exception information is made available,
    and the way that it can be used by administrators and operations staff. If you
    have ever worked in a technical support role, you''ll recognize the scenario.
    A user calls to tell you that an error has occurred in the application. If you
    are lucky, the user will be able to tell you exactly what they were doing at the
    time, and the exact text of the error message. More likely, he or she will tell
    you that they weren''t really doing anything, and that the message said something
    about contacting the administrator.


    To resolve this regularly occurring problem, you can make use of the Handling
    InstanceID value generated by the block to associate logged exception details
    with specific exceptions, and with related exceptions. The Exception Handling
    block creates a unique GUID value for the HandlingInstanceID of every execution
    of a policy. The value is available to all of the handlers in the policy while
    that policy is executing. The Logging handler automatically writes the HandlingInstanceID
    value into every log message it creates. The Wrap and Replace handlers can access
    the HandlingInstanceID value and include it in a message using the special token
    {handlingInstanceID}.


    Figure 8 shows how you can configure a Logging handler and a Replace handler in
    a policy, and include the {handlingInstanceID} token in the Exception Message
    property of the Replace handler.


    ![](img/d7009d38323c3b86f2dfbc5155fbf141_105_0.png)


    FIGURE 8 Configuring a unique exception handling instance identifier


    Now your application can display the unique exception identifier to the user,
    and they can pass it to the administrator who can use it to identify the matching
    logged exception information. This logged information will include the information
    from the original exception, before the Replace handler replaced it with the sanitized
    exception. If you select the option Providing Assistance to Administrators for
    Locating Exception Details in the example'
  merge: -1
  img_proc: true
