- pgno: 74
  md: "transactions over a single connection. This allows you to perform multiple\
    \ actions on different tables in the same database, and manage the commit or rollback\
    \ in your data access code.\n\nAll of the methods of the Data Access block that\
    \ retrieve or update data have overloads that accept a reference to an existing\
    \ transaction as a DbTransaction type. As an example of their use, the following\
    \ code explicitly creates a transaction over a connection. It assumes you have\
    \ created the Data Access block Database instance named db and two DbCommand instances\
    \ named cmdA and cmdB.\n\n```\nUsing conn As DbConnection = db.CreateConnection()\n\
    conn.Open()\nDim trans As DbTransaction = conn.BeginTransaction()\nTry\n    '\
    \ execute commands, passing in the current transaction to each one\n    db.ExecuteNonQuery(cmdA,\
    \ trans)\n    db.ExecuteNonQuery(cmdB, trans)\n    trans.Commit() ' commit the\
    \ transaction\nCatch\n    trans.Rollback() ' rollback the transaction\nEnd Try\n\
    End Using\n```\n\nThe examples for this chapter include one named Use a connection-based\
    \ transaction, which demonstrates the approach shown above. It starts by displaying\
    \ the values of two rows in the Products table, and then uses the ExecuteNonQuery\
    \ method twice to update the Description column of two rows in the database within\
    \ the context of a connection-based transaction. As it does so, it displays the\
    \ new description for these rows. Finally, it rolls back the transaction, which\
    \ restores the original values, and then displays these values to prove that it\
    \ worked.\n\nContents of rows before update:\n\n```\nId = 53\nName = Half-Finger\
    \ Gloves, L\nDescription = Full padding, improved finger flex, durable palm, adjustable\
    \ closure.\n\nId = 84\nName = Hitch Rack - 4-Bike\nDescription = Carries 4 bikes\
    \ securely; steel construction, fits 2\" receiver hitch.\n--------------------------------------------------------------------------------\n\
    Updated row with ID = 53 to 'Third and little fingers tend to get cold.'.\nUpdated\
    \ row with ID = 84 to 'Bikes tend to fall off after a few miles.'.\n--------------------------------------------------------------------------------\n\
    ```"
