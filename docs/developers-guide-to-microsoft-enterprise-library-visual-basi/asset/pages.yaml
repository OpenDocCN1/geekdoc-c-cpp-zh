  md: "However, one important issue is the way that service exceptions are handled.\
    \ The example code specifically catches exceptions of type FaultException<ValidationFault>.\
    \ This is the exception generated by the service, and ValidationFault is the type\
    \ the fault contract we specified in the service contract.\n\nValidation errors\
    \ detected in the WCF service are returned in the Details property of the exception\
    \ as a collection. You can simply iterate this collection to see the validation\
    \ errors. However, if you want to combine them into a ValidationResults instance\
    \ for display, especially if this is part of a multi-step process that may cause\
    \ other validation errors, you must convert the collection of validation errors\
    \ returned in the exception.\n\nThe example application does this using a method\
    \ named ConvertToValidationResults, as shown here. Notice that the validation\
    \ errors returned in the ValidationFault do not contain information about the\
    \ validator that generated the error, and so we must use Nothing for when creating\
    \ each ValidationResult instance.\n\n```\n' Convert the validation details in\
    \ the exception to individual\n' ValidationResult instances and add them to the\
    \ collection.\nDim adaptedResults As New ValidationResults()\nFor Each result\
    \ As ValidationDetail In results\n    adaptedResults.AddResult(New ValidationResult(result.Message,\
    \ target, _\n        result.Key, result.Tag, Nothing))\nNext\nReturn adaptedResults\n\
    ```\n\nWhen you execute this example, you will see a message indicating the service\
    \ being started—this may take a while the first time, and may even time out so\
    \ that you need to try again. Then the output shows the result of validating the\
    \ valid Product instance (which succeeds) and the result of validating the invalid\
