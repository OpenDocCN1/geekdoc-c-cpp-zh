    # WCF SERVICE VALIDATION INTEGRATION


    This section of the chapter demonstrates how you can integrate your validation
    requirements for WCF services with the Validation block. The Validation block
    allows you to add validation attributes to the parameters of methods defined in
    your WCF service contract, and have the values of these automatically validated
    each time the method is invoked by a client.


    To use WCF integration, you edit your service contract, edit the WCF configuration
    to add the Validation block and behaviors, and then handle errors that arise due
    to validation failures. In addition to the other assemblies required by Enterprise
    Library and the Validation block, you must add the assembly named Microsoft.Practices.EnterpriseLibrary.Validation.Integration.WCF
    to your application and reference them all in your service project.


    The example, Validating Parameters in a WCF Service, demonstrates validation in
    a simple WCF service. It uses a service named ProductService (defined in the Example
    Service project of the solution). This service contains a method named AddNewProduct
    that accepts a set of values for a product, and adds this product to its internal
    list of products.


    # Defining Validation in the Service Contract


    The service contract, shown below, carries the ValidationBehavior attribute, and
    each service method defines a fault contract of type ValidationFault.


    ```

    <ServiceContract()> _

    <ValidationBehavior()> _

    Public Interface IProductService

    <OperationContract()> _

    <FaultContract(GetType(ValidationFault))> _

    Function AddNewProduct( _

    <NotNullValidator(MessageTemplate:="Must specify a product ID.")> _

    <StringLengthValidator(6, RangeBoundaryType.Inclusive, _

    6, RangeBoundaryType.Inclusive, _

    MessageTemplate:="Product ID must be {3} characters.")> _

    <RegexValidator("[A-Z]{2}[0-9]{4}"), _

    MessageTemplate:="Product Product ID must be 2 letters and 4 numbers.")> _

    ByVal id As String, _

    ...

    <IgnoreNulls(MessageTemplate:="Description can be NULL or a string value.")> _

    <StringLengthValidator(5, RangeBoundaryType.Inclusive, _

    100, RangeBoundaryType.Inclusive, _

    ```'
