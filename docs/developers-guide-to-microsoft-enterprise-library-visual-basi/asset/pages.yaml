    configProtectionProvider="DataProtectionConfigurationProvider">

    <EncryptedData>

    <CipherData>

    <CipherValue>AQAAANCMnd8BFdERjHoAwE/Cl+sBAAAAcHVgTvQb80uQiB1ya0uH

    ..

    zBjP7SQXVAsA<=</CipherValue>

    </CipherData>

    </EncryptedData>

    </connectionStrings>

    ```

    ```


    If you only intend to deploy the encrypted configuration file to the server where
    you encrypted the file, you can use the **DataProtectionConfigurationProvider**.
    However, if you want to deploy the encrypted configuration file on a different
    server, or on multiple servers in a Web farm, you should use the **RsaProtectedConfigurationProvider**.
    You will need to export the RSA private key that is required to decrypt the data.
    You can then deploy the configuration file and the exported key to the target
    servers, and re-import the keys. For more information, see “Importing and Exporting
    Protected Configuration RSA Key Containers” at http://msdn.microsoft.com/en-us/library/ywx286t2(VS.80).aspx.


    Of course, the next obvious question is “How do I decrypt the configuration?”
    Thankfully, you don’t need to. You can open an encrypted file in the configuration
    tools as long as it was created on that machine or you have imported the RSA key
    file. In addition, Enterprise Library blocks will be able to decrypt and read
    the configuration automatically, providing that the same conditions apply.'
