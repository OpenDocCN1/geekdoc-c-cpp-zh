- pgno: 236
  md: '# # Defining Dependencies with Unity


    Unity provides three ways for you to define the dependencies for each of your
    custom types:


    +   - You can define all of your dependency injection and interception requirements
    using a configuration file. At run time, you use a single line of code to read
    the configuration and load it into a Unity container.

    +   - You can use the methods of the container that register types, type mappings,
    parameter and property values, and interception requirements in your code. You
    can also use these methods to modify any existing registrations in the container
    at run time.

    +   - You can apply attributes to define dependencies for constructor and method
    parameters and properties of types that you will resolve through the container.
    This is a simple approach, but does not provide the same level of control as using
    a configuration file or the run-time container API.


    You can also use a mixture of all of these techniques; for example, you can register
    a mapping in the container between an interface and a concrete implementation,
    then use an attribute to define a dependency for a property or parameter on an
    implementation of this interface.


    Table 1 will help you to choose the best approach for your own requirements.


    # TABLE 1 Defining dependencies


    | Technique | Description | Considerations |

    |---|---|---|

    | Configuration-based | Define dependencies using registrations and mappings loaded
    into the container from a file or other configuration source. | Makes it easy
    to change the registrations and dependency mappings; often by just editing the
    configuration file. However, users of the classes do not see the dependencies
    in the source code. This approach is flexible and allows comprehensive configuration
    of injection of resolved type instances, fixed values, and arrays. |

    | Dynamic registration | Define dependencies using registrations and mappings
    within the container by generating them dynamically at run time using code. |
    Changes to the registrations and dependency mappings require you edit the code,
    though this is usually only in one location in a startup file. However, users
    of the classes do not see the dependencies in the source code. This approach is
    flexible and allows comprehensive configuration of injection of resolved type
    instances, fixed values, and arrays. |

    | Attribute-based | Use attributes applied to parameters and properties within
    the classes to define the dependencies. | Makes the dependencies obvious and easy
    to see in the source code of classes, but requires you to edit the source code
    when you need to change the dependencies. This approach is also less flexible
    and less comprehensive than the other approaches. |'
  merge: -1
  img_proc: true
- pgno: 237
  md: "In addition, you can change the behavior of the dependency resolution mechanism\
    \ in several ways:\n\n+   - You can specify parameter overrides or dependency\
    \ overrides that set the values of specific parameters.\n+   - You can define\
    \ optional dependencies, so that Unity will set the value of a parameter or property\
    \ to **Nothing** if it cannot resolve the type of the dependency.\n+   - You can\
    \ use deferred resolution, so that the resolution does not take place until the\
    \ target type is actually required or used in your code.\n+   - You can specify\
    \ a lifetime manager that will control the lifetime of the resolved type.\n\n\
    The following sections of this appendix describe some of the more common techniques\
    \ for defining dependencies in your classes through constructor, property, and\
    \ method call injection. We do not discuss intersection in this appendix. For\
    \ full details of all the capabilities and uses of Unity, see the Unity section\
    \ of the documentation installed with Enterprise Library and available online\
    \ at http://go.microsoft.com/fwlink/?LinkId= 188875.\n\n# CONSTRUCTOR INJECTION\n\
    \nBy default, Unity will attempt to resolve and populate the types of every parameter\
    \ of a class constructor when you resolve that type through the container. You\
    \ do not need to configure or add attributes to a class for this to occur. Unity\
    \ will choose the most complex constructor (usually the one with the largest number\
    \ of parameters), resolve the type of each parameter through the container, and\
    \ then create a new instance of the target type using the resolved values.\n\n\
    The following are some simple examples that demonstrate how you can define constructor\
    \ injection for a type.\n\n# Automatic Constructor Injection\n\nIf you have a\
    \ class that contains a non-default constructor, Unity will automatically populate\
    \ any dependencies defined in the parameters of the constructor. For example,\
    \ the following type has a dependency on a type named **Database**.\n\n```\nPublic\
    \ Class MyNewObject\n    Public Sub New(defaultDB As Database)\n        ' code\
    \ to use the resolved Database instance here\n    End Sub\nEnd Class\n```\n\n\
    If you need to change the behavior of the automatic constructor injection process,\
    \ perhaps to specify the lifetime of the resolved type or to set the value or\
    \ lifetime of the types resolved for the parameters, you can configure the container\
    \ at design time using a configuration file or at run time using the container\
    \ API."
  merge: -1
  img_proc: true
- pgno: 238
  md: "# Design-Time Configuration\n\nConfiguring constructor injection in a configuration\
    \ file is useful when you need to exert control over the process. For example,\
    \ consider the following class that contains a single constructor that takes two\
    \ parameters.\n\n```\nPublic Class MyNewObject\n    Public Sub New(defaultDB As\
    \ Database, departmentName As String)\n        ...\n    End Sub\nEnd Class\n```\n\
    \nThe second parameter is a string, and Unity cannot generate an instance of a\
    \ String type unless you have registered it in the container using a named instance\
    \ registration. Therefore, you must override the default behavior of the automatic\
    \ injection process. You can do this in a configuration file, and at the same\
    \ time manage three aspects of the injection process: the resolved object lifetime,\
    \ the value of parameters, and the choice of constructor when the type contains\
    \ more than one constructor.\n\nFor example, you can use the following register\
    \ directive in a configuration file to specify that the resolved instance of MyNewObject\
    \ should be a singleton (with its lifetime managed by the container), that Unity\
    \ should resolve the type Database of the parameter named defaultDB and inject\
    \ the result, and that Unity should inject the string value “Customer Service”\
    \ into the parameter named departmentName.\n\n```\n<register type=\"MyNewObject\"\
    >\n    <lifetime type=\"singleton\" />\n    <constructor>\n        <param name=\"\
    defaultDB\" />\n        <param name=\"departmentName\" value=\"Customer Service\"\
    \ />\n    </constructor>\n</register>\n```\n\nWhen you specify constructor injection\
    \ like this, you are also specifying which constructor Unity should use. Even\
    \ if the MyNewObject class contains a more complex constructor, Unity will use\
    \ the one that matches the list of parameters you specify in the register element.\n\
    \nTo register your types using named registrations, you simply add the name attribute\
    \ to the register element, as shown here.\n\n```\n<register type=\"MyNewObject\"\
    \ name=\"Special Customer Object\">\n    ...\n</register>\n```\n\nTo register\
    \ mappings between an interface or base class and a type that implements the interface\
    \ or inherits the base type, you add the mapTo attribute to the register element.\
    \ You can, of course, define default (unnamed) and named mappings in the same\
    \ way as you do type registrations. The following example shows registration of\
    \ a named mapping."
  merge: -1
  img_proc: true
- pgno: 239
  md: '```

    <register type="IMyType" mapTo="MyImplementingType"

    ...

    name="Special Customer Object">

    </register>

    ```


    # Run-Time Configuration


    You can configure injection for the default or a specific constructor at run time
    by calling the RegisterType method of the Unity container. This approach also
    gives you a great deal of control over the process. The following code registers
    the MyNewObject type with a singleton (container-controlled) lifetime.


    ```

    myContainer.RegisterType(Of MyNewObject)(New ContainerControlledLifetimeManager())

    ```


    If you want to create a named registration, you add the name as the first parameter
    of the RegisterType method, as shown here.


    ```

    myContainer.RegisterType(Of MyNewObject)("Special Customer Object", _

    New ContainerControlledLifetimeManager()))

    ```


    If you want to create a mapping, you specify the mapped type as the second generic
    type parameter, as shown here.


    ```

    myContainer.RegisterType(Of IMyType, MyImplementingType)( _

    "Special Customer Object", _

    New ContainerControlledLifetimeManager()))

    ```


    If you need to specify the value of the constructor parameters, such as a String
    type (which Unity cannot create unless you register a String instance with the
    container), or specify which constructor Unity should choose, you include an instance
    of the Injection Constructor type in your call to the RegisterType method. For
    example, the following creates a registration named Special Customer Object for
    the MyNewObject type as a singleton, specifies that Unity should resolve the type
    of the parameter named defaultDB and inject the result, and that Unity should
    inject the string value “Customer Service” into the parameter named departmentName.


    ```

    myContainer.RegisterType(Of MyNewObject)( _

    "Special Customer Object", _

    New ContainerControlledLifetimeManager(), _

    New InjectionConstructor(GetType(Database), "Customer Service") _

    )

    ```


    # Configuration with Attributes


    When you specify just the type in a constructor parameter, as shown earlier, the
    container will return the default concrete implementation of that type as defined
    in the registrations within the container. To specify a named registration when
    using constructor injection, you can add the Dependency attribute to the parameter
    definition, as shown below.'
  merge: -1
  img_proc: true
- pgno: 240
  md: "```\nPublic Class MyNewObject\n    Public Sub New(<Dependency(\"CustomerDB\"\
    )> customers As Database)\n        ' code to use the resolved Database instance\
    \ here\n    End Sub\nEnd Class\n```\n\nIf your class has multiple constructors,\
    \ and you want to specify the one Unity will use, you apply the InjectionConstructor\
    \ attribute to that constructor, as shown in the code excerpt that follows. If\
    \ you do not specify the constructor to use, Unity chooses the most complex (usually\
    \ the one with the most parameters). This technique is useful if the most complex\
    \ constructor has parameters that Unity cannot resolve.\n\n```\nPublic Class MyNewObject\n\
    \    Public Sub New(defaultDB As Database, departmentName As String)\n       \
    \ ...\n    End Sub\n    <InjectionConstructor> _\n    Public Sub New(defaultDB\
    \ As Database)\n        ...\n    End Sub\nEnd Class\n```\n\n# PROPERTY (SETTER)\
    \ INJECTION\n\nProperty (setter) injection can populate one or more properties\
    \ of your custom classes at run time. Unlike constructor injection, property injection\
    \ does not occur by default. You must specify the dependency using a configuration\
    \ file, programmatically at run time, or by applying an attribute to the property\
    \ that holds the dependent type.\n\n# Design-Time Configuration\n\nTo define property\
    \ injection using a configuration file, you simply specify the names of the properties\
    \ that Unity should populate within the register element. If you want Unity to\
    \ resolve the type specified by the property, you need do no more than that. If\
    \ you want to specify a value, you can include this within the property element.\
    \ If you want Unity to use a named registration within the container to resolve\
    \ the type, you include the dependencyName attribute in the property element.\
    \ Finally, if you want to resolve a type that is compatible with the property\
    \ name, such as resolving an interface type for which you have named mappings\
    \ already registered in the container, you specify the type to resolve using a\
    \ dependencyType attribute.\n\nThe following excerpt from a configuration file\
    \ specifies dependency injection for three public properties of a type named MyOtherObject.\
    \ Unity will resolve whatever type the BusinessComponent property of the MyOtherObject\
    \ type is defined as through the container and inject the result into that property.\
    \ It will also inject the string"
  merge: -1
  img_proc: true
- pgno: 241
  md: "value \"CorpData42\" into the property named DataSource, and resolve the type\
    \ ILogger using a mapping method named StdLogger and inject the result into the\
    \ Logger property.\n\n```\n<register type=\"MyOtherObject\">\n    <property name=\"\
    BusinessComponent\" />\n    <property name=\"DataSource\" value=\"CorpData42\"\
    \ />\n    <property name=\"Logger\" dependencyName=\"StdLogger\" dependencyType=\"\
    ILogger\" />\n</register>\n```\n\n# Run-Time Configuration\n\nYou can configure\
    \ injection for any public property of the target class at run time by calling\
    \ the RegisterType method of the Unity container. This gives you a great deal\
    \ of control over the process. The following code performs the same dependency\
    \ injection process as the configuration file example you have just seen. Notice\
    \ the use of the ResolvedParameter type to specify the named mapping that Unity\
    \ should use to resolve the ILogger interface.\n\n```\nmyContainer.RegisterType(Of\
    \ MyOtherObject)(\n    New InjectionProperty(\"BusinessComponent\"), _\n    New\
    \ InjectionProperty(\"DataSource\", \"CorpData42\"), _\n    New InjectionProperty(\"\
    Logger\", _\n        New ResolvedParameter(typeof(ILogger), \"StdLogger\") _\n\
    \    )\n)\n```\n\nYou can use the ResolvedParameter type in constructor and method\
    \ call injection as well as in property injection, and there are other types of\
    \ injection parameter classes available for even more specialized tasks when configuring\
    \ injection.\n\n# Configuration with Attributes\n\nTo specify injection for a\
    \ property, you can alternatively apply the Dependency attribute to it to indicate\
    \ that the type defined and exposed by the property is a dependency of the class.\
    \ The following code demonstrates property injection for a class named MyNewObject\
    \ that exposes as a property a reference to an instance of the type Database.\n\
    \n```\nPublic Class MyNewObject\n\n    Private theDB As Database\n\n    <Dependency>\
    \ _\n    Public Property CustomerDB() As Database\n        Get\n            Return\
    \ theDB\n        End Get\n        Set(ByVal value As Database)\n```"
