    +   12. When you have finished configuring your application, use the commands
    on the **File** menu to save it as a file in your application folder with the
    appropriate name, for example, use Web.config for a Web application and App.config
    for a Windows Forms application.


    You can, of course, edit the configuration files using a text or XML editor, but
    this is likely to be a more tedious process compared to using the configuration
    console. However, it may be a useful approach for minor changes to the configuration
    when the application is running on a server where the configuration console is
    not installed. Enterprise Library also contains an XML configuration schema that
    you can use to enable IntelliSense® and simplify hand editing of the configuration
    files.


    To enable the Enterprise Library XML schema in Visual Studio, open the configuration
    file, open the **XML** menu, and click **Schemas**. In the **XML Schemas** dialog,
    locate the Enterprise Library schema and change the value in the **Use** column
    to **Use this schema**. Then click **OK**.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# ## ENCRYPTING CONFIGURATION SECTIONS


    Probably the most common approach for storing configuration information for your
    applications that use Enterprise Library is to use an App.config or Web.config
    file stored in the root folder of your application. That’s fine, but you may be
    concerned that anyone who happens to stroll past the server (either physically,
    or virtually over the Internet) will be able to open the file and see sensitive
    details. These might include connection strings for the Data Access block, validation
    rules for the Validation block, or connection information used by the Logging
    block to communicate with Windows Message Queuing.


    While in theory, you will protect your configuration files by physically securing
    the server and not leaving it running under a logged-on administrator account,
    you can (and probably should) add an extra layer of protection by encrypting sections
    of your configuration files. The configuration tools can do this for you automatically;
    all you need to do is set the **ProtectionProvider** property of the specific
    block or configuration section that you want to encrypt. For more information,
    see Appendix E, “Encrypting Configuration Files.”


    # ## Instantiating and Using Enterprise Library Objects


    After you have referenced the assemblies you need, imported the required namespaces,
    and configured your application, you can start to think about creating instances
    of the Enterprise Library objects you want to use in your applications. As you
    will see in each of the following chapters, the Enterprise Library application
    blocks are optimized for use as loosely coupled components in almost any type
    of application. In addition, the change in this release to using a dependency
    injection container to generate instances of Enterprise Library objects means
    that you can realize the benefits of contemporary design patterns and solution
    architectures more easily.


    > > By default, Enterprise Library uses the Unity dependency injection mechanism,
    which is provided as part of Enterprise Library. However, it’s possible to configure
    Enterprise Library to use any dependency injection container—or other underlying
    mechanism—that exposes the required configuration information though an implementation
    of the **IServiceLocator** interface. See Appendix B, “Dependency Injection in
    Enterprise Library,” and http://commonservicelocator.codeplex.com for more information.


    In Appendix A, “Dependency Injection with Unity,” we take a more in-depth look
    at what a dependency injection container actually is, and how it can assist you
    in applying design patterns that follow the dependency inversion principle (DIP);
    in particular, how the Dependency Injection (DI) pattern can help you create more
    decoupled applications that are easier to build, test, and maintain. However,
    you don’t need to understand this or learn about DI to be able to use Enterprise
    Library. You can create instances of Enterprise Library objects easily and quickly
    with a single line of code.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# ENTERPRISE LIBRARY OBJECTS, FACADES, AND FACTORIES


    Each of the application blocks in Enterprise Library contains one or more core
    objects that you typically use to access the functionality of that block. An example
    is the Exception Handling Application Block, which provides a facade named **Exception
    Manager** that exposes the methods you use to pass exceptions to the block for
    handling.


    The following table lists the commonly used objects for each block.


    | Application Block | Non-static Instance or Factory |

    | :--- | :--- |

    | Caching | ICacheManager |

    | Cryptography | CryptographyManager |

    | Data Access | Database |

    | Exception Handling | ExceptionManager |

    | Logging | LogWriter<br>TraceManager |

    | Security | ISecurityCacheProvider<br>IAuthorizationProvider |

    | Validation | ValidatorFactory<br>ConfigurationValidatorFactory<br>AttributeValidatorFactory<br>ValidationAttributeValidatorFactory
    |


    There are also task-specific objects in some blocks that you can create directly
    in your code in the traditional way using the operator. For example, you can create
    individual validators from the Validation Application Block, or log entries from
    the Logging Application Block. We show how to do this in the examples for each
    application block chapter.


    To use the features of an application block, all you need to do is create an instance
    of the appropriate object, facade, or factory listed in the table above and then
    call its methods. The behavior of the block is controlled by the configuration
    you specified, and often you can carry out tasks such as exception handling, logging,
    caching, and encrypting values with just a single line of code. Even tasks such
    as accessing data or validating instances of your custom types require only a
    few lines of simple code. So, let''s look at how you create instances of the Enterprise
    Library objects you want to use.


    # CREATING INSTANCES OF ENTERPRISE LIBRARY TYPES


    In this release of Enterprise Library, there are two recommended approaches to
    creating instances of the Enterprise Library objects. The decision as to which
    you use is based solely on the way you decide to architect your application. You
    can use the simple approach of obtaining instances using the Enterprise Library
    service locator, which provides access to the Unity container that holds the Enterprise
    Library configuration information. Alternatively, if you are already a DI convert,
    you can take charge of the entire process by creating and populating a container
    and using it to create and manage both Enterprise Library objects and your own
    custom types. We''ll look at both approaches next.'
  merge: -1
  img_proc: true
- pgno: 36
  md: "# The Simple Approach — Using the Enterprise Library Service Locator\n\nWhen\
    \ you initially create an instance of an Enterprise Library type in your application\
    \ code, the underlying mechanism reads your configuration information into a container\
    \ and exposes it to your code through a service locator that is initialized as\
    \ part of the Enterprise Library configuration mechanism. This service locator\
    \ provides methods that you can call at any point in your application code to\
    \ obtain configured instances of any Enterprise Library type.\n\nFor example,\
    \ if you are using the Logging Application Block, you can obtain a reference to\
    \ a LogWriter using a single line of code, and then call its Write method to write\
    \ your log entry to the configured targets, as shown here.\n\n```\nDim writer\
    \ = EnterpriseLibraryContainer.Current.GetInstance(Of LogWriter)()\nwriter.Write(\"\
    I'm a log entry created by the Logging block.\")\n```\n\n> Notice that this code\
    \ uses type inference by omitting the variable type name keyword. The variable\
    \ will assume the type returned by the assignment; this technique can make your\
    \ code more maintainable.\n\nIf you configured more than one instance of a type\
    \ for a block, such as more than one Database for the Data Access Application\
    \ Block, you can specify the name when you call the GetInstance method. For example,\
    \ you may configure an Enterprise Library Database instance named Customers that\
    \ specifies a Microsoft SQL Server® database, and a separate Database instance\
    \ named Products that specifies a different type of database. In this case, you\
    \ specify the name of the object you want to resolve when you call the Get Instance\
    \ method, as shown here.\n\n```\nDim customerDb _\n    = EnterpriseLibraryContainer.Current.GetInstance(Of\
    \ Database)(\"Customers\")\n```\n\nYou don't have to initialize the block, read\
    \ configuration information, or do anything other than call the methods of the\
    \ service locator. For many application scenarios, this simple approach is ideal\
    \ for obtaining instances of the Enterprise Library types you want to use.\n\n\
    # The Sophisticated Approach — Accessing the Container Directly\n\nIf you want\
    \ to take advantage of design patterns such as Dependency Injection and Inversion\
    \ of Control in your application, you will probably already be considering the\
    \ use of a dependency injection mechanism to decouple your components and layers,\
    \ and to resolve types. If this is the case, the more sophisticated approach to\
    \ incorporating Enterprise Library into your applications will fit well with your\
    \ solution architecture.\n\nInstead of allowing Enterprise Library to create,\
    \ populate, and expose a default container that holds just Enterprise Library\
    \ configuration information, you can create the container and populate it yourself—and\
    \ hold onto a reference to the container for use in your application code. This\
    \ not only allows you to obtain instances of Enterprise Library objects, it also\
    \ lets you use the container to implement dependency injection for your own custom\
    \ types. Effectively, the container itself becomes your service locator."
  merge: -1
  img_proc: true
- pgno: 37
  md: 'For example, you can create registrations and mappings in the container that
    specify features such as the dependencies between the components of your application,
    mappings between types, the values of parameters and properties, interception
    for methods, and deferred object creation.


    You may be thinking that all of these wondrous capabilities will require a great
    deal of code and effort to achieve; however, they don''t. To initialize and populate
    the default Unity container with the Enterprise Library configuration information
    and make it available to your application, only a single line of code is required.
    It is shown here:


    ```

    Dim theContainer = New UnityContainer() _

    .AddNewExtension(Of EnterpriseLibraryCoreExtension)()

    ```


    Now that you have a reference to the container, you can obtain an instance of
    any Enterprise Library Application Block by calling the container methods directly.
    For example, if you are using the Logging Application Block, you can obtain a
    reference to a LogWriter using a single line of code, and then call its Write
    method to write your log entry to the configured targets.


    ```

    Dim writer = theContainer.Resolve(Of LogWriter)()

    writer.Write("I''m a log entry created by the Logging block!")

    ```


    And if you configured more than one instance of a type for a block, such as more
    than one database for the Data Access Application Block, you can specify the name
    when you call the Resolve method, as shown here:


    ```

    Dim customerDb = theContainer.Resolve(Of Database)("Customers")

    ```


    You may have noticed the similarity in syntax between the **Resolve** method and
    the **GetInstance** method we used earlier. Effectively, when you are using the
    default Unity container, the **GetInstance** method of the service locator simply
    calls the **Resolve** method of the Unity container. It therefore makes sense
    that the syntax and parameters are similar. Both the container and the service
    locator expose other methods that allow you to get collections of objects, and
    there are both generic and non-generic overloads that allow you to use the methods
    in languages that do not support generics.


    One point to note if you choose this more sophisticated approach to using Enterprise
    Library in your applications is that you should import two additional namespaces
    into your code. These namespaces include the container and core extension definitions:


    +   Microsoft.Practices.EnterpriseLibrary.Common.Configuration.Unity


    +   Microsoft.Practices.Unity'
  merge: -1
  img_proc: true
- pgno: 38
  md: "# Pros and Cons of Object Instantiation\n\nIf you haven't already decided which\
    \ approach to follow for creating Enterprise Library objects, the following table\
    \ will help you to understand the advantages and disadvantages of each one.\n\n\
    | Object instantiation technique | Advantages | Considerations |\n| :--- | :---\
    \ | :--- |\n| Using the Enterprise Library service locator | Requires no initialization\
    \ code. The service locator is made available automatically.\nYou can resolve\
    \ types anywhere in your application code. You don't need to hold onto a reference\
    \ to the container. | You can only resolve Enterprise Library types (as interfaces,\
    \ abstract types, or concrete types that are registered automatically).\nYou cannot\
    \ manipulate, or add registrations or mappings to the container. |\n| Using the\
    \ container as the service locator | You can directly access all the functionality\
    \ of the Unity container.\nYou can iterate over the contents and read or manipulate\
    \ the registrations and mappings (though you should not attempt to change the\
    \ Enterprise Library configuration information).\nYou can add and remove your\
    \ own registrations and mappings, allowing you to take full advantage of DI techniques.\
    \ | Requires initialization, though this is simply one line of code executed at\
    \ application startup, or simple configuration settings, when you use the default\
    \ Unity container.\nRequest-based applications such as ASP.NET and Web services\
    \ require additional code to store the container reference and resolve the dependencies\
    \ of the request class (such as the Page). |\n\nOne of the prime advantages of\
    \ the more sophisticated approach of accessing the container directly is that\
    \ you can use it to resolve dependencies of your own custom types. For example,\
    \ assume you have a class named **TaxCalculator** that needs to perform logging\
    \ and implement a consistent policy for handling exceptions that you apply across\
    \ your entire application. Your class will contain a constructor that accepts\
    \ an instance of an **ExceptionManager** and a **LogWriter** as dependencies.\n\
    \n```\nPublic Class TaxCalculator\n    Private _exceptionManager As ExceptionManager\n\
    \    Private _logWriter As LogWriter\n\n    Public Sub New(em As ExceptionManager,\
    \ lw As LogWriter)\n        Me._exceptionManager = em\n        Me._logWriter =\
    \ lw\n    End Sub\n    ...\nEnd Class\n```"
  merge: -1
  img_proc: true
- pgno: 39
  md: 'If you use the Enterprise Library service locator approach, you could simply
    obtain these instances within the class constructor or methods when required,
    rather than passing them in as parameters. However, a more commonly used approach
    is to generate and reuse the instances in your main application code, and pass
    them to the TaxCalculator when you create an instance.


    ```

    Dim exManager _

    = EnterpriseLibraryContainer.Current.GetInstance(Of ExceptionManager)()

    Dim writer _

    = EnterpriseLibraryContainer.Current.GetInstance(Of LogWriter)()

    Dim calc As New TaxCalculator(exManager, writer)

    ```


    Alternatively, if you have created and held a reference to the container, you
    just need to resolve the TaxCalculator type through the container. Unity will
    instantiate the type, examine the constructor parameters, and automatically inject
    instances of the ExceptionManager and a LogWriter into them. It returns your new
    TaxCalculator instance with all of the dependencies populated.


    ```

    Dim calc As TaxCalculator = theContainer.Resolve(Of TaxCalculator)()

    ```


    # More Reasons to be Sophisticated


    It is clear from the preceding examples that managing the container yourself offers
    considerable advantages in all but the simplest applications or scenarios. And
    the example you''ve seen for using dependency injection only scratches the surface
    of what you can do using the more sophisticated approach. For example, if you
    have a reference to the container, you can:


    +   - Manage the lifetime of your custom types. They can be resolved by the container
    as singletons, with a lifetime based on the lifetime of the object that created
    them, or as a new instance per execution thread.

    +   - Implement patterns such as plug-in and service locator by mapping interfaces
    and abstract types to concrete implementations of your custom types.

    +   - Defer creation of the resolved custom type until it is actually required.

    +   - Specify dependencies and values for parameters and properties of the resolved
    instances of your custom types.

    +   - Apply interception to your custom types to modify their behavior, implement
    management of crosscutting concerns, or add additional functionality.

    +   - Set up hierarchies of dependencies that are automatically populated to achieve
    maximum decoupling between components, assist in debugging, simplify testing,
    and reduce maintenance cost and effort.


    When you use the default Unity container, you have a powerful general-purpose
    dependency injection mechanism in your arsenal. You can define and modify registrations
    and mappings in the container programmatically at run time, or you can define
    them using configuration files. Appendix A, “Dependency Injection with Unity,”
    contains more information about using Unity.'
  merge: -1
  img_proc: true
- pgno: 40
  md: "To give you a sense of how easy it is to use, the following code registers\
    \ a mapping between an interface named **IMyService** and a concrete type named\
    \ **CustomerService**, specifying that it should be a singleton.\n\n```\ntheContainer.RegisterType(Of\
    \ IMyService, CustomerService)(_\n    New ContainerControlledLifetimeManager())\n\
    ```\n\nThen you can resolve the single instance of the concrete type using the\
    \ following code.\n\n```\nDim myServiceInstance As IMyService = theContainer.Resolve(Of\
    \ IMyService)()\n```\n\nThis returns an instance of the **CustomerService** type,\
    \ though you can change the actual type returned at run time by changing the mapping\
    \ in the container. Alternatively, you can create multiple registrations or mappings\
    \ for an interface or base class with different names and specify the name when\
    \ you resolve the type.\n\nUnity can also read its configuration from your application's\
    \ App.config or Web.config file (or any other configuration file). This means\
    \ that you can use the sophisticated approach to creating Enterprise Library objects\
    \ and your own custom types, while being able to change the behavior of your application\
    \ just by editing the configuration file.\n\n> If you want to load type registrations\
    \ and mappings into a Unity container from a configuration file, you must add\
    \ the assembly Microsoft.Practices.Unity.Configuration.dll to your project, and\
    \ optionally import the namespace Microsoft.Practices.Unity.Configuration into\
    \ your code. This assembly and namespace contains the extension to the Unity container\
    \ for loading configuration information.\n\nFor example, the following extract\
    \ from a configuration file initializes the container and adds the same custom\
    \ mapping to it as the **RegisterType** example shown above.\n\n```\n<unity>\n\
    \  <alias alias=\"CoreExtension\"\n    type=\"Microsoft.Practices.EnterpriseLibrary.Common.Configuration\n\
    \    .Unity.EnterpriseLibraryCoreExtension,\n    Microsoft.Practices.EnterpriseLibrary.Common\"\
    \ />\n  <namespace name=\"Your.Custom.Types.Namespace\" />\n  <assembly name=\"\
    Your.Custom.Types.Assembly.Name\" />\n  <container>\n    <extension type=\"CoreExtension\"\
    \ />\n    <register type=\"IMyService\" mapTo=\"CustomerService\">\n      <lifetime\
    \ type=\"singleton\" />\n    </register>\n  </container>\n</unity>\n```"
  merge: -1
  img_proc: true
- pgno: 41
  md: 'Then, all you need to do is load this configuration into a new Unity container.
    This requires just one line of code, as shown here.


    ```

    Dim theContainer = New UnityContainer().LoadConfiguration()

    ```


    > Other techniques we demonstrate in Appendix A, “Dependency Injection with Unity,”
    include using attributes to register type mappings and dependencies, defining
    named registrations, and specifying dependencies and values for parameters and
    properties


    The one point to be aware of when you use the more sophisticated technique for
    creating objects is that your application is responsible for managing the container,
    holding a reference to it, and making that reference available to code that must
    access the container. In forms-based applications that automatically maintain
    global state (for example, applications built using technologies such as Windows
    Forms, Windows Presentation Foundation (WPF), and Silverlight®), you can use an
    application-wide variable for this.


    However, in request-based applications built using technologies such as ASP.NET,
    ASMX, and Windows Communication Foundation (WCF), you generally require additional
    code to maintain the container and make it available for each request. We discuss
    some of the ways that you can achieve this in Appendix B, “Dependency Injection
    in Enterprise Library,” and you will find full details in the documentation installed
    with Enterprise Library and available online at http://go.microsoft.com/fwlink/?LinkId=188874.


    # GETTING OBJECTS FROM PREVIOUS VERSIONS OF ENTERPRISE LIBRARY


    If you have used versions of Enterprise Library prior to version 5.0, you may
    be more familiar with the previous approach to creating objects within your application
    code. Earlier versions generally supported or recommended the use of a series
    of static facades. While these facades are still supported in version 5.0 for
    backward compatibility with existing applications, they are no longer the recommended
    approach and may be deprecated in future releases.


    Figure 5 summarizes all the approaches you can use to get access to the features
    of Enterprise Library. 1 and 2 are the recommended approaches for Enterprise Library
    5.0; 3 and 4 are still supported to make it easier to upgrade your existing applications
    that use a previous version of Enterprise Library.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '![](img/d7009d38323c3b86f2dfbc5155fbf141_42_0.png)


    # FIGURE 5 Four ways, one library


    # The Example Applications


    To help you understand how you can use Enterprise Library and each of the seven
    application blocks covered in this guide, we provide a series of simple example
    applications that you can run and examine. Each is a console-based application
    and, in most cases, all of the relevant code that uses Enterprise Library is found
    within a series of routines in the Program.vb file. This makes it easy to see
    how the different blocks work, and what you can achieve with each one.


    The examples use the simplest approach (the service locator and GetInstance method
    described earlier in the chapter) for creating the Enterprise Library objects
    they require, and have the configuration information for the blocks they use stored
    in the App.config file. Each of the options in the examples exercises specific
    features of the relevant block and displays the results. You can open the solutions
    for these examples in Visual Studio, or just run the executable file in the bin\debug
    folder and view the source files in a text editor if you prefer.


    To obtain the example applications, go to http://go.microsoft.com/fwlink/?LinkId=189009.'
