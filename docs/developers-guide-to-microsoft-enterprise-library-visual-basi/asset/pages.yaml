- pgno: 75
  md: "Contents of row after rolling back transaction:\n\nId = 53\nName = Half-Finger\
    \ Gloves, L\nDescription = Full padding, improved finger flex, durable palm, adjustable\
    \ closure.\n\nId = 84\nName = Hitch Rack - 4-Bike\nDescription = Carries 4 bikes\
    \ securely; steel construction, fits 2\" receiver hitch.\n\n# WORKING WITH DISTRIBUTED\
    \ TRANSACTIONS\n\nIf you need to access different databases as part of the same\
    \ transaction (including databases on separate servers), or if you need to include\
    \ other data sources such as Microsoft Message Queuing (MSMQ) in your transaction,\
    \ you must use a distributed transaction coordinator (DTC) mechanism such as Windows\
    \ Component Services. In this case, you just perform the usual data access actions,\
    \ and configure your components to use the DTC. Commonly, this is done through\
    \ attributes added to the classes that perform the data access.\n\nHowever, ADO.NET\
    \ supports the concept of automatic or lightweight transactions through the **TransactionScope**\
    \ class. You can specify that a series of actions require transactional support,\
    \ but ADO.NET will not generate an expensive distributed transaction unless you\
    \ actually open more than one connection within the transaction scope. This means\
    \ that you can perform multiple transacted updates to different tables in the\
    \ same database over a single connection. As soon as you open a new connection,\
    \ ADO.NET automatically creates a distributed transaction (using Windows Component\
    \ Services), and enrolls the original connections and all new connections created\
    \ within the transaction scope into that distributed transaction. You then call\
    \ methods on the transaction scope to either commit all updates, or to roll back\
    \ (undo) all of them.\n\nTherefore, once you create the transaction scope or explicitly\
    \ create a transaction, you use the Data Access block methods in exactly the same\
    \ way as you would outside of a transaction. You do not need to pass the transaction\
    \ scope to the methods as you would when using ADO.NET methods directly. For example,\
    \ the methods of the Data Access Application Block automatically detect if they\
    \ are being executed within the scope of a transaction. If they are, they enlist\
    \ in the transaction scope and reuse the existing connection (because opening\
    \ a new one would force Component Services to start a distributed transaction),\
    \ and do not close the connection when they complete. The transaction scope will\
    \ close and dispose the connection when it is disposed.\n\nTypically, you will\
    \ use the **TransactionScope** class in the following way:\n\n```\nUsing scope\
    \ = New TransactionScope(TransactionScopeOption.RequiresNew)\n  ' perform data\
    \ access here\nEnd Using\n```"
