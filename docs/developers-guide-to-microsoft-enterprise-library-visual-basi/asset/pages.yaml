    \    regType = item.RegisteredType.Name\n    mapType = item.MappedToType.Name\n\
    \    regName = If(item.Name, \"[default]\")\n    lifetime = item.LifetimeManagerType.Name\n\
    \    If mapType <> regType Then\n        mapTo = \" -> \" & mapTo\n    Else\n\
    \        mapTo = String.Empty\n    End If\n    lifetime = lifetime.Substring(0,\
    \ lifetime.Length - \"LifetimeManager\".Length)\n    ' Display details of the\
    \ registration as appropriate.\nNext\n```\n```\n\n# # Populating Entire Object\
    \ Graphs at Application Startup\n\nAfter you populate the container with your\
    \ configuration information, both the Enterprise Library information and the registrations\
    \ and mappings for your own custom types, you can resolve these custom types with\
    \ all of their dependencies populated through dependency injection. You can define\
    \ dependencies in three ways:\n\n+   * As one or more parameters of a constructor\
    \ in the target class. Unity will create instances of the appropriate types and\
    \ populate the constructor parameters when the target object is instantiated.\
    \ This is the approach you will typically use. For example, you can have Unity\
    \ automatically create and pass into your constructor an instance of a LogWriter\
    \ or an ExceptionManager, store the reference in a class variable or field, and\
    \ use it within that class.\n\n+   * As one or more properties of the target class.\
    \ Unity will create an instance of the type defined by the property or in configuration\
    \ and set that instance as the value of the property when the class is resolved\
    \ through the container.\n\n+   * As one or more parameters of a method in the\
    \ target class. Unity will create instances of the appropriate types and populate\
    \ the method parameters when the target object is instantiated, and then call\
    \ that method. You can store the references passed in the parameters in a class\
    \ variable or field for use within that class. This approach is typically used\
    \ when you have an Initialize or similar method that should execute when the class\
    \ is instantiated.\n\nBy taking advantage of this capability to populate an entire\
    \ object graph, you may decide to have the container create and inject instances\
    \ of the appropriate types for all of the dependencies defined in your entire\
    \ application when it starts up or, at least, a significant proportion of it.\n\
    \nWhile this may seem to be a strange concept, it means that you do not need to\
    \ hold onto a reference to the container after you perform this initial population\
    \ of dependencies. That doesn't mean you cannot hold onto the container reference\
    \ as well, but resolving all of the"
  merge: -1
  img_proc: true
- pgno: 250
  md: 'required types at startup can improve run-time performance at the cost of slightly
    increased startup time. Of course, this also requires additional memory and resources
    to hold all of the resolved instances, and you must balance this against the expected
    improvement in run-time performance.


    You can populate all of your dependencies by resolving the main form or startup
    class through the container. The container will automatically create the appropriate
    instances of the objects required by each class and inject them into the parameters
    and properties. However, it does rely on the container being able to create and
    return instances of types that are not registered in the container. The Unity
    container can do this. If you use an alternative container, you may need to preregister
    all of the types in your application, including the main form or startup class.


    Typically, this approach to populating an entire application object graph is best
    suited to applications built using form-based or window-based technologies such
    as Microsoft® Presentation Foundation (WPF), Windows Forms, console applications,
    and Microsoft Silverlight® (using the version of Unity specifically designed for
    use in Silverlight applications).


    For information about how you can resolve the main form, window, or startup class
    of your application, together with example code, see the documentation installed
    with Enterprise Library or available online at http://go.microsoft.com/fwlink/?LinkId=188874.


    # Maintaining a Container Reference in Request-Based Applications


    When using the default Unity DI mechanism with Enterprise Library, all you need
    to do is initialize the container once on your application, and then use it to
    resolve (or obtain) instances of Enterprise Library objects or your own classes
    and objects. Initializing the container requires just the following single line
    of code.


    ```

    '' Create and populate the default container with application configuration.

    Dim container = New UnityContainer() _

    .AddNewExtension(Of EnterpriseLibraryCoreExtension)()

    ```


    However, to use the container to resolve types throughout your application, you
    must hold a reference to it. You can store the container in a global variable
    in a Windows Forms or WPF application, in the **Application** dictionary of an
    ASP.NET application, or in a custom extension to the **InstanceContext** of a
    Windows Communication Foundation (WCF) service.


    Table 1 will help you to understand when and where you should hold a reference
    to the container in forms-based and rich client applications built using technologies
    such as Windows Forms, WPF, and Silverlight.'
  merge: -1
  img_proc: true
- pgno: 251
  md: 'TABLE 1 Holding a reference to the container in forms-based and rich client
    applications


    | Task | When | Where |

    | :--- | :--- | :--- |

    | Create and configure container. | At application startup. | Main routine, startup
    events, application definition file, or as appropriate for the technology. |

    | Obtain objects from the container. | At application startup, and later if required.
    | Where appropriate in the code. |

    | Store a reference to the container. | At application startup. | Global application
    state. |

    | Dispose the container. | When the application shuts down. | Where appropriate
    in the code or automatically when the application ends. |


    Table 2 will help you to understand when and where you should hold a reference
    to the container in request-based applications built using technologies such as
    ASP.NET Web applications and Web services.


    TABLE 2 Holding a reference to the container in request-based applications


    | Task | When | Where |

    | :--- | :--- | :--- |

    | Create and configure container. | At application startup. | HTTP Module (ASP.NET
    and ASMX), InstanceContext extension (WCF). |

    | Obtain objects from the container. | During each HTTP request. | In the request
    start event or load event. Objects are disposed when the request ends. |

    | Store a reference to the container. | At application startup. | Global application
    state or service context. |

    | Dispose the container. | When the application shuts down. | Where appropriate
    in the code. |


    For more detailed information about how you can maintain a reference to the container
    in different types of applications, in particular, request-based applications,
    and the code you can use to achieve this, see the documentation installed with
    Enterprise Library or available online at http://go.microsoft.com/fwlink/?LinkId=188874.


    # Using an Alternative Service Locator or Container


    Enterprise Library, by default, uses the Unity dependency injection mechanism
    to create instances of Enterprise Library objects. If you are already using, or
    plan to use, a different dependency injection container in your application you
    may be able to use it to create Enterprise Library objects instead of using Unity.


    For this to work, you can obtain or write your own configurator that can load
    the container with the Enterprise Library configuration information you specify,
    or create a type that implements the **IServiceLocator** interface and can expose
    the configuration information.'
  merge: -1
  img_proc: true
- pgno: 252
  md: "The default behavior of Enterprise Library is to create a new Unity container,\
    \ create a new configurator for the container, and then read the configuration\
    \ information from the application's default configuration file (App.config or\
    \ Web.config). The following code extract shows the process that occurs.\n\n```\n\
    ```vb\nDim container = New UnityContainer()\nDim configurator = New UnityContainerConfigurator(container)\n\
    \n' Read the configuration files and set up the container.\nEnterpriseLibraryContainer.ConfigureContainer(container,\
    \ _\n    ConfigurationSourceFactory.Create())\n\n' The container is now ready\
    \ to resolve Enterprise Library objects\n```\n```\n\nThe task of the configurator\
    \ is to translate the configuration file information into a series of registrations\
    \ within the container. Enterprise Library contains only the **Unity ContainerConfigurator**,\
    \ though you can write your own to suit your chosen container, or obtain one from\
    \ a third party.\n\nAn alternative approach is to create a custom implementation\
    \ of the **IServiceLocator** interface that may not use a configurator, but can\
    \ read the application configuration and return the appropriate fully populated\
    \ Enterprise Library objects on demand.\n\nSee http://commonservicelocator.codeplex.com\
    \ for more information about the **IServiceLocator** interface.\n\nTo keep up\
    \ with discussions regarding alternate configuration options for Enterprise Library,\
    \ see the forums on CodePlex at http://www.codeplex.com/entlib/Thread/List.aspx."
  merge: -1
  img_proc: true
- pgno: 253
  md: 'Policy injection describes a method for inserting code between the client and
    an object that the client uses, in order to change the behavior of the target
    object without requiring any changes to that object, or to the client. The general
    design pattern for this technique is called interception, and has become popular
    through the Aspect-Oriented Programming (AOP) paradigm.


    Interception has been a feature of Enterprise Library since version 3.0. In previous
    releases of Enterprise Library, the manner in which you would enable interception
    was through the Policy Injection Application Block, which exposed static facades
    you could use to create wrapped instances of target objects and the appropriate
    proxy through which the client can access that target object.


    The block also contained a series of call handlers that are inserted into the
    interception pipeline, between the client and the target object. The same set
    of call handlers as used in previous versions of Enterprise Library is included
    in version 5.0, though they are no longer located in the Policy Injection block
    (which is provided mainly for backwards compatibility with existing applications).


    In version 5.0 of Enterprise Library, the recommended approach for implementing
    policy injection is through the Unity interception mechanism. This supports several
    different techniques for implementing interception, including the creation of
    derived classes rather than remoting proxies, and it has much less impact on application
    performance.


    The call handlers you use with the Unity interception mechanism can instantiate
    application blocks, allowing you to apply the capabilities of the blocks for managing
    crosscutting concerns for the target object. The capabilities provided by interception
    and policy injection through Unity and Enterprise Library allow you to:


    +   • Add validation capabilities by using the validation handler. This call handler
    uses the Validation block to validate the values passed in parameters to the target
    object. This is a useful approach to circumvent the limitations within the Validation
    block, which cannot validate parameters of method calls except in specific scenarios
    such as in Windows® Communication Foundation (WCF) applications.


    +   • Add logging capabilities to objects by using the logging handler. This call
    handler uses the Logging block to generate log entries and write them to configured
    target sources.'
  merge: -1
  img_proc: true
- pgno: 254
  md: '+   - Add exception handling capabilities by using the exception handling handler.

    +     This call handler uses the Exception Handling block to implement a consistent

    +     strategy for handling, replacing, wrapping, and logging exceptions.

    +   - Add authorization capabilities to objects by using the authorization handler.

    +     This call handler uses the Security block to check if the caller has the
    required

    +     permission to execute each call.

    +   - Add performance measurement capabilities by using the performance counter

    +     handler. This call handler updates Windows® performance counters with each

    +     call, allowing you to measure performance and monitor target object activity.

    +   - Add custom behavior to objects by creating your own interception call

    +     handlers.


    For more information about using Unity to implement interception, see the documentation

    installed with Enterprise Library or available online at http://go.microsoft.com/fwlink/

    ?LinkId=188874.


    For information on how to use the Policy Injection block facade, see the documentation

    for version 4.1 of Enterprise Library on MSDN® at http://msdn.microsoft.com/en-us/

    library/dd139982.aspx.'
  merge: -1
  img_proc: true
- pgno: 255
  md: '# Appendix D


    # Enterprise Library Configuration Scenarios


    The comprehensive configuration capabilities of Enterprise Library—the result
    of the extensible configuration system and the configuration tools it includes—make
    Enterprise Library highly flexible and easy to use. The combination of these features
    allows you to:


    +   - Read configuration information from a wide range of sources.

    +   - Enforce common configuration settings across multiple applications.

    +   - Share configuration settings between applications.

    +   - Specify a core set of configuration settings that applications can inherit.

    +   - Merge configuration settings that are stored in a shared location.

    +   - Create different configurations for different deployment environments.


    This appendix provides an overview of the scenarios for using these features and
    demonstrates how you can apply them in your own applications and environments.
    More information on the scenarios presented here is provided in the documentation
    installed with Enterprise Library and available online at http://go.microsoft.com/fwlink/?LinkId=188874.


    # About Enterprise Library Configuration


    Enterprise Library configuration information is stored in instances of classes
    that implement the IConfigurationSource interface, and are typically known as
    configuration sources. Figure 1 shows a high-level view of the two types of information
    for a configuration source and the different ways that an application''s configuration
    can be defined and applied.


    ![](img/d7009d38323c3b86f2dfbc5155fbf141_255_0.png)


    **FIGURE 1** Configuration sources in Enterprise Library'
  merge: -1
  img_proc: true
- pgno: 256
  md: "# EXTERNAL CONFIGURATION\n\nExternal configuration encompasses the different\
    \ ways that configuration information can reside in a persistent store and be\
    \ applied to a configuration source at run time. Possible sources of persistent\
    \ configuration information are files, a database, and other custom sources. Enterprise\
    \ Library can load configuration information from any of these stores automatically.\
    \ To store configuration in a database you can use the SQL configuration source\
    \ that is available as a sample from the Enterprise Library community site at\
    \ http://entlib.codeplex.com. You can also specify one or more configuration sources\
    \ to satisfy more complex configuration scenarios, and create different configurations\
    \ for different run-time environments. See the section “Scenarios for Advanced\
    \ Configuration” later in this appendix for more information.\n\n# PROGRAMMATIC\
    \ SUPPORT\n\nProgrammatic support encompasses the different ways that configuration\
    \ information can be generated dynamically and applied to a configuration source\
    \ at run time. Typically, in Enterprise Library this programmatic configuration\
    \ takes place through the fluent interface specially designed to simplify dynamic\
    \ configuration, or by using the methods exposed by the Microsoft® .NET Framework\
    \ System.Configuration API.\n\n# Using the Fluent Interfaces\n\nAll of the application\
    \ blocks except for the Validation Application Block and Policy Injection Application\
    \ Block expose a fluent interface. This allows you to configure the block at run\
    \ time using intuitive code assisted by Microsoft IntelliSense® in Visual Studio®\
    \ to specify the providers and properties for the block. The following is an example\
    \ of configuring an exception policy for the Exception Handling Application Block\
    \ and loading this configuration into the Enterprise Library container.\n\n```\n\
    Dim builder = New ConfigurationSourceBuilder()\n\nbuilder.ConfigureExceptionHandling()\
    \ _\n    .GivenPolicyWithName(\"MyPolicy\") _\n    .ForExceptionTypeOf(Of NullReferenceException)()\
    \ _\n    .LogToCategory(\"General\") _\n    .WithSeverity(System.Diagnostics.TraceEventType.Warning)\
    \ _\n    .UsingEventId(9000) _\n    .WrapWith(Of InvalidOperationException)()\
    \ _\n    .UsingMessage(\"MyMessage\") _\n    .ThenThrowNewException()\n\nDim configSource\
    \ = New DictionaryConfigurationSource()\nbuilder.UpdateConfigurationWithReplace(configSource)\n\
    EnterpriseLibraryContainer.Current _\n    = EnterpriseLibraryContainer.CreateDefaultContainer\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 257
  md: '# Scenarios for Advanced Configuration


    The Enterprise Library stand-alone configuration console and the Visual Studio
    integrated configuration editor allow you to satisfy a range of advanced configuration
    scenarios based on external configuration sources such as disk files. When you
    use the configuration tools without specifying a configuration source, they default
    to using the System Configuration Source to create a single configuration file
    that contains the entire configuration for the application. Your application will
    expect this to be named App.config or Web.config (depending on the technology
    you are using), and will read it automatically.


    You can select Add Configuration Settings on the Blocks menu to display the section
    that contains the default system configuration source. If you click the chevron
    arrow to the right of the Configuration Sources title to open the section properties
    pane you can see that this is also, by default, specified as the Selected Source—the
    configuration source to which the configuration generated by the tool will be
    written. When an application that uses Enterprise Library reads the configuration,
    it uses the settings specified for the selected source.


    The following sections describe the common scenarios for more advanced configuration
    that you can accomplish using the configuration tools. Some of these scenarios
    require you to add additional configuration sources to the application configuration.


    # SCENARIO 1: USING THE DEFAULT APPLICATION CONFIGURATION FILE


    This is the default and simplest scenario. You configure your application using
    the configuration tool without adding a Configuration Sources section or any configuration
    sources. You must specify either your application''s App.config or Web.config
    file when you save the configuration, or use the configuration tool to edit an
    existing App.config or Web.config file.


    # SCENARIO 2: USING A NON-DEFAULT CONFIGURATION STORE


    In this scenario, you want to store your configuration in a file or other type
    of store, instead of in the application''s App.config or Web.config file. To achieve
    this you:


    +   1. Use the configuration tools to add a suitable configuration source to the
    Configuration Sources section. If you want to use a standard format configuration
    file, add a file-based configuration source. To store the configuration information
    in a different type of store, you must install a suitable configuration source.
    You can use the sample SQL configuration source that is available from the Enterprise
    Library community site at http://entlib.codeplex.com to store your configuration
    in a database.


    +   2. Set the relevant properties of the new configuration source. For example,
    if you are using the built-in file-based configuration source, set the File Path
    property to the path and name for the configuration file.'
  merge: -1
  img_proc: true
- pgno: 258
  md: "3. Set the **Selected Source** property in the properties pane for the **Configuration\
    \ Sources** section to your new configuration source. This updates the application's\
    \ default App.config or Web.config file to instruct Enterprise Library to use\
    \ this as its configuration source.\n\n# SCENARIO 3: SHARING THE SAME CONFIGURATION\
    \ BETWEEN MULTIPLE APPLICATIONS\n\nIn this scenario, you want to share configuration\
    \ settings between multiple applications or application layers that run in different\
    \ locations, such as on different computers. To achieve this, you simply implement\
    \ the same configuration as described in the previous scenario, locating the configuration\
    \ file or store in a central location. Then specify this file or configuration\
    \ store in the settings for the configuration source (such as the built-in file-based\
    \ configuration source) for each application.\n\n# SCENARIO 4: MANAGING AND ENFORCING\
    \ CONFIGURATION FOR MULTIPLE APPLICATIONS\n\nIn this scenario, you not only want\
    \ to share configuration settings between multiple applications or application\
    \ layers that run on different computers (as in the previous scenario), but also\
    \ be able to manage and enforce these configuration settings for this application\
    \ or its layers on all machines within the same Active Directory® domain. To achieve\
    \ this you:\n\n+   1. Use the configuration tools to add a manageable configuration\
    \ source to the **Configuration Sources** section.\n+   \n+   2. Specify a unique\
    \ name for the **Application Name** property that defines the application within\
    \ the Active Directory repository and domain.\n+   \n+   3. Set the **File Path**\
    \ property to the path and name for the configuration file.\n+   \n+   4. Set\
    \ the **Selected Source** property in the properties pane for the **Configuration\
    \ Sources** section to the new manageable configuration source. This updates the\
    \ application's default App.config or Web.config file to instruct Enterprise Library\
    \ to use this as its configuration file.\n+   \n+   5. After you finish configuring\
    \ the application blocks and settings for your application, right-click the title\
    \ bar of the manageable configuration source and select **Generate ADM Template**.\
    \ This creates a Group Policy template that you can install into Active Directory.\
    \ The template contains the settings for the application blocks, and configuring\
    \ them in Active Directory forces each application instance to use the centrally\
    \ specified settings.\n\n*The manageable configuration source does not provide\
    \ Group Policy support for the Validation Application Block, the Policy Injection\
    \ Application Block, or Unity.*"
  merge: -1
  img_proc: true
- pgno: 259
  md: '# # SCENARIO 5: SHARING CONFIGURATION SECTIONS ACROSS MULTIPLE APPLICATIONS


    In this scenario, you have multiple applications or application layers that must
    use the same shared configuration for some application blocks (or for some sections
    of the configuration such as instrumentation settings or connection strings).
    Effectively, you want to be able to redirect Enterprise Library to some shared
    configuration sections, rather than sharing the complete application configuration.
    For example, you may want to specify the settings for the Logging Application
    Block and share these settings between several applications, while allowing each
    application to use its own local settings for the Exception Handling Application
    Block. You achieve this by redirecting specific configuration sections to matching
    sections of a configuration store in a shared location.


    The steps to implement this scenario are as follows:


    +   1. Use the configuration tools to add a suitable configuration source for
    your application to the **Configuration Sources** section. This configuration
    source should point to the shared configuration store. If you want to use a standard
    format configuration file as the shared configuration store, add a file-based
    configuration source. To store the shared configuration information in a different
    type of store, you must install a suitable configuration source. You can use the
    sample SQL configuration source that is available from the Enterprise Library
    community site at http://entlib.codeplex.com to store your configuration in a
    database.


    +   2. Set the relevant properties of the shared configuration source. For example,
    if you are using the built-in file-based configuration source, set the **File
    Path** property to the path and name for the application’s configuration file.


    +   3. Set the **Selected Source** property in the properties pane for the **Configuration
    Sources** section to **System Configuration Source**.


    +   4. Click the plus-sign icon in the **Redirected Sections** column and click
    **Add Redirected Section**. A redirected section defines one specific section
    of the local application’s configuration that you want to redirect to the shared
    configuration source so that it loads the configuration information defined there.
    Any local configuration settings for this section are ignored.


    +   5. In the new redirected section, select the configuration section you want
    to load from the shared configuration store using the drop-down list in the **Name**
    property. The name of the section changes to reflect your choice.


    +   6. Set the **Configuration Source** property of the redirected section by
    selecting the shared configuration source you defined in your configuration. This
    configuration source will provide the settings for the configuration sections
    that are redirected.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '+   7. Repeat steps 4, 5, and 6 if you want to redirect other configuration
    sections to the shared configuration store. Configuration information for all
    sections for which you do not define a redirected section will come from the local
    configuration source.


    +   8. To edit the contents of the shared configuration store, you must open that
    configuration in the configuration tools or in a text editor; you cannot edit
    the configuration of shared sections when you have the local application''s configuration
    open in the configuration tool. If you open the shared configuration in the configuration
    tool, ensure that the **Selected Source** property of that configuration is set
    to use the system configuration source.


    You cannot share the contents of the **Application Settings** section. This section
    in the configuration tool stores information in the standard <appSettings> section
    of the configuration file, which cannot be redirected.


    # SCENARIO 6: APPLYING A COMMON CONFIGURATION STRUCTURE FOR APPLICATIONS


    In this scenario you have a number of applications or application layers that
    use the same configuration structure, and you want to inherit that structure but
    be able to modify or add individual configuration settings by defining them in
    your local configuration file. You can specify a configuration that inherits settings
    from a parent configuration source in a shared location, and optionally override
    local settings. For example, you can configure additional providers for an application
    block whose base configuration is defined in the parent configuration. The steps
    to implement this scenario are as follows:


    +   1. Use the configuration tools to add a suitable configuration source for
    your application to the **Configuration Sources** section. This configuration
    source should point to the shared configuration store. If you want to use a standard
    format configuration file as the shared configuration store, add a file-based
    configuration source. To store the shared configuration information in a different
    type of store, you must install a suitable configuration source. You can use the
    sample SQL configuration source that is available from the Enterprise Library
    community site at http://entlib.codeplex.com to store your configuration in a
    database.


    +   2. Set the relevant properties of the shared configuration source. For example,
    if you are using the built-in file-based configuration source, set the **File
    Path** property to the path and name for the application''s configuration file.


    +   3. Set the **Parent Source** property in the properties pane for the **Configuration
    Sources** section to your shared configuration source. Leave the **Selected Source**
    property in the properties pane set to **System Configuration Source**.


    +   4. Configure your application in the usual way. You will not be able to see
    the settings inherited from the shared configuration source you specified as the
    parent source. However, these settings will be inherited by your local'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'configuration unless you override them by configuring them in the local configuration.
    Where a setting is specified in both the parent source and the local configuration,
    the local configuration setting will apply.


    +   5. To edit the contents of the shared parent configuration store, you must
    open that configuration in the configuration tools or in a text editor; you cannot
    edit the configuration of parent sections when you have the local application''s
    configuration open in the configuration tool. If you open the parent configuration
    in the configuration tool, ensure that the Selected Source property of that configuration
    is set to the system configuration source.


    The way that the configuration settings are merged, and the ordering of items
    in the resulting configuration, follows a predefined set of rules. These are described
    in detail in the documentation installed with Enterprise Library and available
    online at http://go.microsoft.com/fwlink/?LinkId=128874.


    # SCENARIO 7: MANAGING CONFIGURATION IN DIFFERENT DEPLOYMENT ENVIRONMENTS


    In this scenario, you want to be able to define different configuration settings
    for the same application that will be appropriate when it is deployed to different
    environments, such as a test and a production environment. In most cases the differences
    are minor, and usually involve settings such as database connection strings or
    the use of a different provider for a block. Enterprise Library implements this
    capability using a feature called environment overrides. The principle is that
    you specify override values for settings that are different in two or more environments,
    and the differences are saved as separate delta configuration files. The administrator
    then applies these differences to the main configuration file when the application
    is deployed in each environment. To achieve this:


    +   1. Follow the instructions in the step-by-step procedure in the section “Using
    the Configuration Tools” in Chapter 1, “Introduction,” which describes how you
    configure multiple environments in the configuration tools and how you define
    the overridden settings.


    +   2. Open the properties pane for each of the environments you added to your
    configuration by clicking the chevron arrow to the right of the environment title,
    and set the Environment Delta File property to the path and name for the delta
    file for that environment.


    +   3. Save the configuration. The configuration tool generates a normal (.config)
    file and a delta (.dconfig) file for each environment. The delta file(s) can be
    managed by administrators, and stored in a separate secure location, if required.
    This may be appropriate when, for example, the production environment settings
    should not be visible to developers or testers.


    +   4. To create a run-time merged configuration file (typically, this is done
    by an administrator):'
  merge: -1
  img_proc: true
- pgno: 262
  md: '+   - Open the local configuration (config) file.

    +   - Select **Open Delta File** from the **Environments** menu and load the appropriate
    override configuration (dconfig) file.

    +   - Set the **Environment Configuration File** property in the properties pane
    for the environment to the path and name for the merged configuration file for
    that environment.

    +   - Right-click on the title of the environment and click **Export Merged Environment
    Configuration File**.


    5. Deploy the merged configuration file in the target environment.


    Enterprise Library also contains a command-line utility named MergeConfiguration.exe
    that you can use to merge configuration and delta files if you do not have the
    configuration console deployed on your administrator system. It can also be used
    if you wish to automate the configuration merge as part of your deployment process.
    Information about MergeConfiguration.exe is included in the documentation installed
    with Enterprise Library.


    > *You cannot use environmental overrides with redirected sections or inherited
    configuration settings. You can only use them when the entire configuration of
    your application is defined within a local configuration source.*


    For more information on all of the scenarios presented here, see the documentation
    installed with Enterprise Library and available online at http://go.microsoft.com/fwlink/?LinkId=188874.'
  merge: -1
  img_proc: true
- pgno: 263
  md: "# # Appendix E Encrypting Configuration Files\n\nEnterprise Library supports\
    \ encryption of configuration information. Unless your server is fully protected\
    \ from both physical incursion and remote incursion over the network, you should\
    \ consider encrypting any configuration files that contain sensitive information,\
    \ such as database connection strings, passwords and user names, or validation\
    \ rules.\n\nYou can select any of the encryption providers that are included in\
    \ your system’s Machine.config file. Typically, these are the **DataProtectionConfigurationProvider**,\
    \ which uses the Microsoft® Windows® Data Protection API (DPAPI), and the **RsaProtectedConfigurationProvider**,\
    \ which uses RSA. The settings for these providers, such as where keys are stored,\
    \ are also in the Machine.config file. You cannot edit this file with a configuration\
    \ tool; instead, you must modify it using a text editor or an operating system\
    \ configuration tool.\n\nAs an example of the effect of this option, the following\
    \ is a simple unencrypted configuration for the Data Access block.\n\n```\n<dataConfiguration\
    \ defaultDatabase=\"Connection String\" />\n<connectionStrings>\n  <add name=\"\
    Connection String\"\n    connectionString=\"Database=TheImportantOne; Server=WEHAVELIFTOFF;\n\
    \    User ID=secret; Password=DontTellNE1\"\n    providerName=\"System.Data.SqlClient\"\
    \ />\n</connectionStrings>\n```\n\nWhen you specify the **DataProtectionConfigurationProvider**\
    \ option, the resulting configuration section looks like the following.\n\n```\n\
    <dataConfiguration\n  configProtectionProvider=\"DataProtectionConfigurationProvider\"\
