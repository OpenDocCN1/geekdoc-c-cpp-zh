    # Defining Attributes in Metadata Classes


    In some cases, you may want to locate your validation attributes (both Validation
    block attributes and .NET Data Annotation validation attributes) in a file separate
    from the one that defines the class that you will validate. This is a common scenario
    when you are using tools that generate the class files, and would therefore overwrite
    your validation attributes. To avoid this you can locate your validation attributes
    in a separate file that forms a partial class along with the main class file.
    This approach makes use of the Meta dataType attribute from the System.ComponentModel.DataAnnotations
    namespace.


    You apply the MetadataType attribute to your main class file, specifying the type
    of the class that stores the validation attributes you want to apply to your main
    class'
