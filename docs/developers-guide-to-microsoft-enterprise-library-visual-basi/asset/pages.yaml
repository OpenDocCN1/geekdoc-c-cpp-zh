- pgno: 174
  md: '# VALIDATION RULE SETS


    A validation rule set is a combination of all the rules with the same name, which
    may be located in a configuration file or other configuration source, in attributes
    defined within the target type, and implemented through self-validation. In other
    words, a rule set includes any type of validation rule that has a specified name.


    **Rule set names are case-sensitive.** The two rule sets named **MyRuleset** and
    **MyRuleSet** are different!


    How do you apply a rule set to a validation rule? And what happens if you don''t
    specify a name? In fact, the way it works is relatively simple, even though it
    may appear complicated when you look at configuration and attributes, and take
    into account how these are actually processed.


    To start with, every validation rule is a member of some rule set. If you do not
    specify a name, that rule is a member of the default rule set; effectively, this
    is the rule set whose name is an empty string. When you do specify a name for
    a rule, it becomes part of the rule set with that name.


    # Assigning Validation Rules to Rule Sets


    You specify rule set names in a variety of ways, depending on the location and
    type of the rule:


    +   * **In configuration.** You define a type that you want to apply rules to,
    and then define one or more rule sets for that type. To each rule set you add
    the required combination of validators, each one representing a validation rule
    within that rule set. You can specify one rule set for each type as the default
    rule set for that type. The rules within this rule set are then treated as members
    of the default (unnamed) rule set, as well as that named rule set.


    +   * **In Validation block validator attributes applied to classes and their
    members.** Every validation attribute will accept a rule set name as a parameter.
    For example, you specify that a `NotNullValidator` is a member of a rule set named
    **MyRuleset**, like this:


    ```

    <NotNullValidator(MessageTemplate:="Cannot be null", _ RuleSet:="MyRulesetName")>

    ```


    +   * **In SelfValidation attributes within a class.** You add the **RuleSet**
    parameter to the attribute to indicate which rule set this self-validation rule
    belongs to. You can define multiple self-validation methods in a class, and add
    them to different rule sets if required.


    ```

    <SelfValidation(RuleSet:="MyRulesetName")>

    ```


    # Configuring Validation Block Rule Sets


    The Enterprise Library configuration console makes it easy to define rule sets
    for specific types that you will validate. Each rule set specifies a type to which
    you will apply the rule set, and allows you to specify a set of validation rules.
    You can then apply these rules as a complete set to an instance of an object of
    the defined type.'
  merge: -1
  img_proc: true
- pgno: 175
  md: '![](img/d7009d38323c3b86f2dfbc5155fbf141_175_0.png)


    # FIGURE 2

    The configuration for the examples


    Figure 2 shows the configuration console with the configuration used in the example
    application for this chapter. It defines a rule set named MyRuleset for the validated
    type (the Product class). MyRuleset is configured as the default rule set, and
    contains a series of validators for all of the properties of the Product type.
    These validators include two Or Composite Validators (which contain other validators)
    for the DateDue and Description properties, three validators that will be combined
    with the And operation for the ID property, and individual validators for the
    remaining properties.


    > When you highlight a rule, member, or validator in the configuration console,
    it shows connection lines between the configured items to help you see the relationships
    between them.


    # Specifying Rule Sets When Validating


    You can specify a rule set name when you create a type validator that will validate
    an instance of a type. If you use the ValidatorFactory facade to create a type
    validator for a type, you can specify a rule set name as a parameter of the CreateValidator
    method. If you create an Object Validator or an Object Collection Validator programmatically
    by calling the constructor, you can specify a rule set name as a parameter of
    the constructor. Finally, if you resolve a validator for a type through the Enterprise
    Library Container, you can specify a rule set name as the string key value. We
    look in more detail at the options for creating validators later in this chapter.


    +   If you specify a rule set name when you create a validator for an object,
    the Validation block will apply only those validation rules that are part of the
    specified rule set. It will, by default, apply all rules with the specified name
    that it can find in configuration, attributes, and self-validation.'
  merge: -1
  img_proc: true
- pgno: 176
  md: '+   • If you do not specify a rule set name when you create a validator for
    an object, the Validation block will, by default, apply all rules that have no
    name (effectively, rules with an empty string as the name) that it can find in
    configuration, attributes, and self-validation. If you have specified one rule
    set in configuration as the default set for the type you are validating (by setting
    the DefaultRule property for that type to the rule set name), rules within this
    rule set are also treated as being members of the default (unnamed) rule set.


    The one time that this default mechanism changes is if you create a validator
    for a type using a facade other than ValidatorFactory. As you''ll see later in
    this chapter you can use the ConfigurationValidatorFactory, AttributeValidatorFactory,
    or ValidationAttributeValidatorFactory to generate type validators. In this case,
    the validator will only apply rules that have the specified name and exist in
    the specified location.


    For example, when you use a ConfigurationValidatorFactory and specify the name
    MyRuleset as the rule set name when you call the CreateValidator method, the validator
    you obtain will only process rules it finds in configuration that are defined
    within a rule set named MyRuleset for the target object type. If you use an AttributeValidatorFactory,
    the validator will only apply Validation block rules located in attributes and
    self-validation methods of the target class that have the name MyRuleset.


    Configuring multiple rule sets for the same type is useful when the type you need
    to validate is a primitive type such as a String. A single application may have
    dozens of different rule sets that all target String.


    # How Do I Use The Validation Block?


    In the remainder of this chapter, we''ll show you in more detail how you can use
    the features of the Validation block you have seen in previous sections. In this
    section, we cover three topics that you should be familiar with when you start
    to use the block in your applications: preparing your application to use the block,
    choosing a suitable approach for validation, the options available for creating
    validators, accessing and displaying validation errors, and understanding how
    you can use template tokens in validation messages.


    # PREPARING YOUR APPLICATION


    To use the Validation block, you must reference the required assemblies. In addition
    to the assemblies required in every application that uses Enterprise Library (listed
    in Chapter 1, "Introduction"), you require the main Validation block assembly,
    Microsoft.Practices.EnterpriseLibrary.Validation.dll. If you intend to use the
    integration features for ASP.NET, Windows Forms, WPF, or WCF, you must also reference
    the relevant assembly that contains these features.


    Then you can edit your code to specify the namespaces used by the Validation block
    and, optionally, the integration features if you need to integrate with WCF or
    a UI technology.


    If you are using WCF integration, you should add a reference to the System.Service
    Model namespace.'
  merge: -1
  img_proc: true
- pgno: 177
  md: '# CHOOSING A VALIDATION APPROACH


    Before you start to use the Validation block, you should consider how you want
    to perform validation. As you''ve seen, there are several approaches you can follow.
    Table 2 summarizes these, and will help you to choose one, or a combination, most
    suited to your requirements.


    # TABLE 2 Validation approaches


    | Validation approach | Advantages | Considerations |

    | :--- | :--- | :--- |

    | Rule sets in configuration | Supports the full capabilities of the Validation
    block validators. Validation rules can be changed without requiring recompilation
    and redeployment. Validation rules are more visible and easier to manage. | Rules
    are visible in configuration files unless the content is encrypted. May be open
    to unauthorized alteration if not properly protected. Type definitions and validation
    rule definitions are stored in different files and accessed using different tools,
    which can be confusing. |

    | Validation block attributes | Supports the full capabilities of the Validation
    block validators. Validation attributes may be defined in separate metadata classes.
    Rules can be extracted from the metadata for a type by using reflection. | Requires
    modification of the source code of the types to validate. Some complex rule combinations
    may not be possible—only a single **And** or **Or** combination is available for
    multiple rules. Hides validation rules from administrators and operators. |

    | Data annotation attributes | Allows you to apply validation rules defined by
    .NET data annotation attributes, which may be defined in separate metadata classes.
    Typically used with technologies such as LINQ, for which supporting tools might
    be used to generate code. Technologies such as ASP.NET Dynamic Data that use these
    attributes can perform partial client-side validation. Rules can be extracted
    from the metadata for a type by using reflection. | Requires modification of the
    source code. Does not support all of the powerful validation capabilities of the
    Validation block. |

    | Self-validation | Allows you to create custom validation rules that may combine
    values of different members of the class. | Requires modification of the source
    code. Hides validation rules from administrators and operators. Rules cannot be
    extracted from the metadata for a type by using reflection. |

    | Validators created programmatically | A simple way to validate individual values
    as well as entire objects. Useful if you only need to perform small and specific
    validation tasks, especially on value types held in variables. | Requires additional
    code and is generally more difficult to manage for complex validation scenarios.
    Hides validation rules from administrators and operators. More difficult to administer
    and manage. |'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'If you decide to use attributes to define your validation rules within classes
    but are finding it difficult to choose between using the Validation block attributes
    and the Microsoft .NET data annotation attributes, you should consider using the
    Validation block attributes approach as this provides more powerful capabilities
    and supports a far wider range of validation operations. However, you should consider
    the data annotations approach in the following scenarios:


    +   - When you are working with existing applications that already use data annotations.

    +   - When you require validation to take place on the client.

    +   - When you are building a Web application where you will use the ASP.NET Data
    Annotation Model Binder, or you are using ASP.NET Dynamic Data to create data-driven
    user interfaces.

    +   - When you are using a framework such as the Microsoft Entity Framework, or
    another object/relational mapping (O/RM) technology that auto-generates classes
    that include data annotations.


    # OPTIONS FOR CREATING VALIDATORS PROGRAMMATICALLY


    There are several ways that you can create the validators you require, whether
    you are creating a type validator that will validate an instance of your class
    using a rule set or attributes, or you are creating individual value validators:


    +   - **Use the ValidatorFactory facade to create validators.** This approach
    makes it easy to create type validators that you can use, in conjunction with
    rule sets, to validate multiple members of an object instance. This is generally
    the recommended approach. You also use this approach to create validators that
    use only validation attributes or data annotations within the classes you want
    to validate, or only rule sets defined in configuration. You can resolve an instance
    of the ValidatorFactory using a single line of code, as you will see later in
    this chapter.

    +   - **Create individual validators programmatically** by calling their constructor.
    The constructor parameters allow you to specify most of the properties you require
    for the validator. You can then set additional properties, such as the Tag or
    the resource name and type if you want to use a resource file to provide the message
    template. You can also build combinations of validators using this approach to
    implement complex validation rules.

    +   - **Resolve individual validators through the Enterprise Library Container.**
    This approach allows you to obtain a validator instance using dependency injection;
    for example, by simply specifying the type of validator you require in the constructor
    of a class that you resolve through the container. If you specify a name when
    you resolve the instance, this is interpreted as the name of the rule set for
    that validator to use when validating objects. See Appendix A, “Dependency Injection
    with Unity” and Appendix B, “Using Dependency Injection in Enterprise Library”
    for more information about using a container to resolve and populate the dependencies
    of objects.'
  merge: -1
  img_proc: true
- pgno: 179
  md: "Previous versions of Enterprise Library used static facades named Validation\
    \ and ValidationFactory (as opposed to ValidatorFactory described above) to create\
    \ validators and perform validation. While these facades are still available for\
    \ backwards compatibility, you should use the approaches described above for creating\
    \ validators as you write new code.\n\n# PERFORMING VALIDATION AND DISPLAYING\
    \ VALIDATION ERRORS\n\nTo initiate validation, you call the Validate method of\
    \ your validator. There are two overloads of this method: one that creates and\
    \ returns a populated ValidationResults instance, and one that accepts an existing\
    \ ValidationResults instance as a parameter. The second overload allows you to\
    \ perform several validation operations, and collect all of the errors in one\
    \ ValidationResults instance.\n\nYou can check if validation succeeded, or if\
    \ any validation errors were detected, by examining the IsValid property of a\
    \ ValidationResults instance, and displaying details of any validation errors\
    \ that occurred. The following code shows a simple example of how you can display\
    \ the most relevant details of each validation error. See the section on self-validation\
    \ earlier in this chapter for a description of the properties of each individual\
    \ ValidationResult within the ValidationResults.\n\n```\n' Check if the ValidationResults\
    \ detected any validation errors.\nIf results.IsValid Then\n    Console.WriteLine(\"\
    There were no validation errors.\")\nElse\n    Console.WriteLine(\"The following\
    \ {0} validation errors were detected:\", _\n        results.Count)\n' Iterate\
    \ through the collection of validation results.\nFor Each item As ValidationResult\
    \ In results\n    ' Show the target member name and current value.\n    Console.WriteLine(\"\
    Target: '{0}' Key: '{1}' Tag: '{2}' Message: '{3}'\", _\n        item.Target,\
    \ item.Key, item.Tag, item.Message)\nNext\nEnd If\n```\n\nAlternatively, you can\
    \ extract more information about the validation result for each individual validator\
    \ where an error occurred. The example application we provide demonstrates how\
    \ you can do this, and you'll see more details later in this chapter."
  merge: -1
  img_proc: true
- pgno: 180
  md: '# UNDERSTANDING MESSAGE TEMPLATE TOKENS


    One specific and very useful feature of the individual validators you define in
    your configuration or attributes is the capability to include tokens in the message
    to automatically insert values of the validator’s properties. This applies no
    matter how you create your validator—in rule sets defined in configuration, as
    validation attributes, or when you create validators programmatically.


    The Message property of a validator is actually a template, not just a simple
    text string that is displayable. When the block adds an individual ValidationResult
    to the ValidationResults instance for each validation error it detects, it parses
    the value of the Message property looking for tokens that it will replace with
    the value of specific properties of the validator that detected the error.


    The value injected into the placeholder tokens, and the number of tokens used,
    depends on the type of validator—although there are three tokens that are common
    to all validators. The token {0} will be replaced by the value of the object being
    validated (ensure that you escape this value before you display or use it in order
    to guard against injection attacks). The token {1} will contain the name of the
    member that was being validated, if available, and is equivalent to the Key property
    of the validator. The token {2} will contain the value of the Tag property of
    the validator.


    The remaining tokens depend on the individual validator type. For example, in
    the case of the Contains Characters validator, the tokens {3} and {4} will contain
    the characters to check for and the ContainsCharacters value (All or Any). In
    the case of a range validator, such as the String Length validator, the tokens
    {3} to {6} will contain the values and bound types (Inclusive, Exclusive, or Ignore)
    for the lower and upper bounds you specify for the validator. For example, you
    may define a String Length validator like this:


    ```

    <StringLengthValidator(5, RangeBoundaryType.Inclusive, 20, _ RangeBoundaryType.Inclusive,
    _ MessageTemplate:="{1} must be between {3} and {5} characters.")>

    ```


    If this validator is attached to a property named Description, and the value of
    this property is invalid, the ValidationResults instance will contain the error
    message Description must be between 5 and 20 characters.


    Other validators use tokens that are appropriate for the type of validation they
    perform. The documentation installed with Enterprise Library lists the tokens
    for each of the Validation block validators. You will also see the range of tokens
    used in the examples that follow.'
  merge: -1
  img_proc: true
- pgno: 181
  md: '# Diving in With Some Simple Examples


    The remainder of this chapter shows how you can use the Validation block in a
    variety of situations within your applications. We provide a simple console-based
    example application implemented as the Microsoft Visual Studio® solution named
    Validation. You can open it in Visual Studio to view the code, or run the application
    directly from the bin\Debug folder.


    The application uses three versions of a class that stores product information.
    All of these implement an interface named IProduct, as illustrated in Figure 3.
    Each has a string property that is designed to be set to a value from an enumeration
    called ProductType that defines the valid set of product type names.


    ![](img/d7009d38323c3b86f2dfbc5155fbf141_181_0.png)


    FIGURE 3 The product classes used in the examples


    The Product class is used primarily with the example that demonstrates using a
    configured rule set, and contains no validation attributes. The AttributedProduct
    class contains Validation block attributes, while the AnnotatedProduct class contains
    .NET Data Annotation attributes. The latter two classes also contain self-validation
    routines—the extent depending on the capabilities of the type of validation attributes
    they contain. You''ll see more on this topic when we look at the use of validation
    attributes later in this chapter.


    The following sections of this chapter will help you understand in detail the
    different ways that you can use the Validation block:


    +   Validating Objects and Collections of Objects. This is the core topic for
    using the Validation block, and is likely to be the most common scenario in your
    applications. It shows how you can create type validators to validate instances
    of your custom classes, how you can dive deeper into the ValidationResults instance
    that is returned, how you can use the Object Validator, and how you can validate
    collections of objects.


    +   Using Validation Attributes. This section describes how you can use attributes
    applied to your classes to enable validation of members of these classes. These
    attributes use the Validation block validators and the .NET Data Annotation attributes.'
  merge: -1
  img_proc: true
- pgno: 182
  md: '+   • **Creating and Using Individual Validators.** This section shows how
    you can create and use the validators provided with the block to validate individual
    values and members of objects.


    +   • **WCF Service Validation Integration.** This section describes how you can
    use the block to validate parameters within a WCF service.


    Finally, we''ll round off the chapter by looking briefly at how you can integrate
    the Validation block with user interface technologies such as Windows Forms, WPF,
    and ASP.NET.


    # VALIDATING OBJECTS AND COLLECTIONS OF OBJECTS


    The most common scenario when using the Validation block is to validate an instance
    of a class in your application. The Validation block uses the combination of rules
    defined in a rule set and validators added as attributes to test the values of
    members of the class, and the result of executing any self-validation methods
    within the class.


    The Validation block makes it easy to validate entire objects (all or a subset
    of its members) using a specific type validator or by using the Object validator.
    You can also validate all of the objects in a collection using the Object Collection
    validator. We will look at the Object validator and the Object Collection validator
    later. For the moment, we''ll concentrate on creating and using a specific type
    validator.


    # Creating a Type Validator using the ValidatorFactory


    You can resolve a ValidatorFactory instance through the Enterprise Library container
    and use it to create a validator for a specific target type. This validator will
    validate objects using a rule set, and/or any attributes and self-validation methods
    the target object contains. To obtain an instance of the ValidatorFactory class,
    you can use the following code.


    ```

    Dim valFactory As ValidatorFactory _

    = EnterpriseLibraryContainer.Current.GetInstance(Of ValidatorFactory)()

    ```


    You can then create a validator for any type you want to validate. For example,
    this code creates a validator for the Product class and then validates an instance
    of that class named myProduct.


    ```

    Dim pValidator As Validator(Of Product) _

    = valFactory.CreateValidator(Of Product)()

    Dim valResults As ValidationResults = pValidator.Validate(myProduct)

    ```


    By default, the validator will use the default rule set defined for the target
    type (you can define multiple rule sets for a type, and specify one of these as
    the default for this type). If you want the validator to use a specific rule set,
    you specify this as the single parameter to the CreateValidator method, as shown
    here.


    ```

    Dim productValidator As Validator(Of Product) _

    = valFactory.CreateValidator(Of Product)("RuleSetName")

    Dim valResults As ValidationResults = productValidator.Validate(myProduct)

    ```'
  merge: -1
  img_proc: true
