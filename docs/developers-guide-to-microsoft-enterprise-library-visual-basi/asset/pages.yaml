    \ chapter. These two methods, named RaiseDivideByZeroException and RaiseArgumentOutOfRangeException,\
    \ will cause an exception of the type indicated by the method name when called.\n\
    \nThe sample first attempted to execute the RaiseDivideByZeroException method,\
    \ like this.\n\n```\nDim calc As New SalaryCalculator()\nConsole.WriteLine(\"\
    Result is: {0}\", calc.RaiseDivideByZeroException(\"Jsmith\", 0))\n```\n\nThis\
    \ exception is caught in the main routine using the exception handling code shown\
    \ below. This creates a new Exception instance and passes it to the Exception\
