    \ block, or provider using the controls in that section for that block. You will\
    \ see information about the settings required, and what they do, in the subsequent\
    \ chapters of this guide. For full details of all of the settings that you can\
    \ specify, see the documentation installed with Enterprise Library for that block.\n\
    \n7. To delete a section or provider, right-click the section or provider and\
    \ click **Delete** on the shortcut menu. To change the order of providers when\
    \ more than one is configured for a block, right-click the section or provider\
