    \ value from the exception handling policy executed by the Exception Handling\
    \ block (it returns the value of the method or function it executes). In some\
    \ cases, though perhaps rarely, you may want to detect the return value from the\
    \ exception handling policy and perform some processing based on this value, and\
    \ perhaps even capture the exception returned by the Exception Handling block\
    \ to manipulate it or decide whether or not to throw it in your code.\n\nIn this\
    \ case, you can use the HandleException method to pass an exception to the block\
    \ as an out parameter to be populated by the policy, and retrieve the Boolean\
    \ result that indicates if the policy determined that the exception should be\
