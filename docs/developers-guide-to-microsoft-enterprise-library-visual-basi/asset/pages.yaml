- pgno: 45
  md: '# Much ADO about Data Access


    # Introduction


    When did you last write an enterprise-level application where you didn''t need
    to handle data? And when you were handling data there was a good chance it came
    from some kind of relational database. Working with databases is the single most
    common task most enterprise applications need to accomplish, so it''s no surprise
    that the Data Access Application Block is the most widely used of all of the Enterprise
    Library blocks—and no coincidence that we decided to cover it in the first of
    the application block chapters in this book.


    A great many of the millions of Enterprise Library users around the world first
    cut their teeth on the Data Access block. Why? Because it makes it easy to implement
    the most commonly used data access operations without needing to write the same
    repetitive code over and over again, and without having to worry about which database
    the application will target. As long as there is a Data Access block provider
    available for your target database, you can use the same code to access the data.
    You don''t need to worry about the syntax for parameters, the idiosyncrasies of
    the individual data access methods, or the different data types that are returned.


    This means that it''s also easy to switch your application to use a different
    database, without having to rewrite code, recompile, and redeploy. Administrators
    and operators can change the target database to a different server; and even to
    a different database (such as moving from Oracle to Microsoft® SQL Server® or
    the reverse), without affecting the application code. In the current release,
    the Data Access Application Block contains providers for SQL Server, SQL Server
    Compact Edition, and Oracle databases. There are also third-party providers available
    for the IBM DB2, MySql, Oracle (ODP.NET), PostgreSQL, and SQLite databases. For
    more information on these, see http://codeplex.com/entlibcontrib.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# # What Does the Data Access Application Block Do?


    The Data Access Application Block abstracts the actual database you are using,
    and exposes a series of methods that make it easy to access that database to perform
    common tasks. It is designed to simplify the task of calling stored procedures,
    but also provides full support for the use of parameterized SQL statements. As
    an example of how easy the block is to use, when you want to fill a **DataSet**
    you simply create an instance of the appropriate **Database** class, use it to
    get an appropriate command instance (such as **DbCommand**), and pass this to
    the **ExecuteDataSet** method of the **Database** class. You don’t need to create
    a **DataAdapter** or call the **Fill** method. The **ExecuteDataSet** method manages
    the connection, and carries out all the tasks required to populate your **DataSet**.
    In a similar way, the **Database** class allows you to obtain a **DataReader**,
    execute commands directly, and update the database from a **DataSet**. The block
    also supports transactions to help you manage multiple operations that can be
    rolled back if an error occurs.


    In addition to the more common approaches familiar to users of ADO.NET, the Data
    Access block also provides techniques for asynchronous data access for databases
    that support this feature, and provides the ability to return data as a sequence
    of objects suitable for client-side querying using techniques such as Language
    Integrated Query (LINQ). However, the block is *not* intended to be an Object/Relational
    Mapping (O/RM) solution. It uses mappings to relate parameters and relational
    data with the properties of objects, but does not implement an O/RM modeling solution.


    The major advantage of using the Data Access block, besides the simplicity achieved
    through the encapsulation of the boilerplate code that you would otherwise need
    to write, is that it provides a way to create provider-independent applications
    that can easily be moved to use a different source database type. In most cases,
    unless your code takes advantage of methods specific to a particular database,
    the only change required is to update the contents of your configuration file
    with the appropriate connection string. You don’t have to change the way you specify
    queries (such as SQL statements or stored procedure names), create and populate
    parameters, or handle return values. This also means reduced requirements for
    testing, and the configuration changes can even be accomplished through Group
    Policy.


    # ## DATA OPERATIONS SUPPORTED BY THE DATA ACCESS BLOCK


    The following table lists by task the most commonly used methods that the Data
    Access Application Block exposes to retrieve and update data. Some of the method
    names will be familiar to those used to using ADO.NET directly.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '| Task | Methods |

    | :--- | :--- |

    | Filling a DataSet and updating the database from a DataSet. | **ExecuteDataSet**.
    Creates, populates, and returns a DataSet.<br>**LoadDataSet**. Populates an existing
    DataSet.<br>**UpdateDataSet**. Updates the database using an existing DataSet.
    |

    | Reading multiple data rows. | **ExecuteReader**. Creates and returns a provider-independent
    DbDataReader instance. |

    | Executing a Command. | **ExecuteNonQuery**. Executes the command and returns
    the number of rows affected. Other return values (if any) appear as output parameters.<br>**ExecuteScalar**.
    Executes the command and returns a single value. |

    | Retrieving data as a sequence of objects. | **ExecuteProcAccessor**. Returns
    data selected by a stored procedure as a sequence of objects for client-side querying.<br>**ExecuteSqlStringAccessor**.
    Returns data selected by a SQL statement as a sequence of objects for client-side
    querying. |

    | Retrieving XML data (SQL Server only). | **ExecuteXmlReader**. Returns data
    as a series of XML elements exposed through an XmlReader. Note that this method
    is specific to the SqlDatabase class (not the underlying Database class). |

    | Creating a Command. | **GetStoredProcCommand**. Returns a command object suitable
    for executing a stored procedure.<br>**GetSqlStringCommand**. Returns a command
    object suitable for executing a SQL statement (which may contain parameters).
    |

    | Working with Command parameters. | **AddInParameter**. Creates a new input parameter
    and adds it to the parameter collection of a Command.<br>**AddOutParameter**.
    Creates a new output parameter and adds it to the parameter collection of a command.<br>**AddParameter**.
    Creates a new parameter of the specific type and direction and adds it to the
    parameter collection of a command.<br>**GetParameterValue**. Returns the value
    of the specified parameter as an Object type.<br>**SetParameterValue**. Sets the
    value of the specified parameter. |

    | Working with transactions. | **CreateConnection**. Creates and returns a connection
    for the current database that allows you to initiate and manage a transaction
    over the connection. |


    You can see from this table that the Data Access block supports almost all of
    the common scenarios that you will encounter when working with relational databases.
    Each data access method also has multiple overloads, designed to simplify usage
    and integrate—when necessary—with existing data transactions. In general, you
    should choose the overload you use based on the following guidelines:


    +   * Overloads that accept an ADO.NET **DbCommand** object provide the most flexibility
    and control for each method.

    +   * Overloads that accept a stored procedure name and a collection of values
    to be used as parameter values for the stored procedure are convenient when your
    application calls stored procedures that require parameters.'
  merge: -1
  img_proc: true
- pgno: 48
