- pgno: 128
  md: '# LOGGING TO A DATABASE


    One of the most common requirements for logging, after Windows Event Log and text
    files, is to store log entries in a database. The Logging block contains the database
    trace listener that makes this easy. You configure the database using a script
    provided with Enterprise Library, located in the \Blocks\Logging\Src\DatabaseTraceListener\Scripts
    folder of the source code. We also include these scripts with the example for
    this chapter.


    The scripts assume that you will use the locally installed SQL Server Express
    database, but you can edit the CreateLoggingDb.cmd file to change the target to
    a different database server. The SQL script that the command file executes creates
    a database named Logging, and adds the required tables and stored procedures to
    it.


    However, if you only want to run the example application we provide for this chapter,
    you do not need to create a database. The project contains a preconfigured database
    file named Logging.mdf (located in the bin\Debug folder) that is auto-attached
    to your local SQL Server Express instance. You can connect to this database using
    Visual Studio Server Explorer to see the contents. The configuration of the database
    trace listener contains the Database Instance property, which is a reference to
    this database as configured in the settings section for the Data Access application
    block (see Figure 7).


    ![](img/d7009d38323c3b86f2dfbc5155fbf141_128_0.png)


    FIGURE 7 Configuration of the Database trace listener'
  merge: -1
  img_proc: true
- pgno: 129
  md: "The database trace listener uses a text formatter to format the output, and\
    \ so you can edit the template used to generate the log message to suit your requirements.\
    \ You can also add extended properties to the log entry if you wish. In addition,\
    \ as with all trace listeners, you can filter log entries based on their severity\
    \ if you like.\n\nThe Log table in the database contains columns for only the\
    \ commonly required values, such as the message, event ID, priority, severity,\
    \ title, timestamp, machine and process details, and more. It also contains a\
    \ column named FormattedMessage that contains the message generated by the text\
    \ formatter.\n\nUsing the Database Trace Listener\nThe example, Sending log entries\
    \ to a database, demonstrates the use of the database trace listener. The code\
    \ is relatively simple, following the same style as the earlier example of creating\
    \ a Dictionary of extended properties, and then using the Write method of the\
    \ LogWriter to write two log entries. The first log entry is created by the LogWriter\
    \ from the parameter values provided to the Write method. The second is generated\
    \ in code as a new LogEntry instance by specifying the values for the constructor\
    \ parameters. Also notice how easy it is to add additional information to a log\
    \ entry using a simple Dictionary as the ExtendedProperties of the log entry.\n\
    \n```\n' Check if logging is enabled before creating log entries.\nIf defaultWriter.IsLoggingEnabled()\
    \ Then\n\n    ' Create a Dictionary of extended properties\n    Dim exProperties\
    \ As New Dictionary(Of String, Object())\n    exProperties.Add(\"Extra Information\"\
    , \"Some Special Value\")\n\n    ' Create a LogEntry using the constructor parameters.\n\
    \    defaultWriter.Write(\"Log entry with category, priority, event ID, severity,\
    \ \" _\n        & \"title, and extended properties.\", \"Database\", _\n     \
    \   5, 9008, TraceEventType.Warning, _\n        \"Logging Block Examples\", exProperties)\n\
    \n    ' Create a LogEntry using the constructor parameters.\n    Dim entry As\
    \ New LogEntry(\"LogEntry with category, priority, event ID, \" _\n        & \"\
    severity, title, and extended properties.\", _\n        \"Database\", 8, 9009,\
    \ TraceEventType.Error, _\n        \"Logging Block Examples\", exProperties)\n\
    \n    defaultWriter.Write(entry)\nElse\n    Console.WriteLine(\"Logging is disabled\
    \ in the configuration.\")\nEnd If\n```"
