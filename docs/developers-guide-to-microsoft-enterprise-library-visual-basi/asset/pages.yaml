    \ method with the stored procedure\n' name and an Object array containing the\
    \ parameter values\nUsing reader As IDataReader = defaultDB.ExecuteReader(\"ListOrdersByState\"\
    , _\n    New Object() (\"Colorado\"))\n    DisplayRowValues(reader)\nEnd Using\n\
    ```\n\nThe example named Return rows using a stored procedure with parameters\
