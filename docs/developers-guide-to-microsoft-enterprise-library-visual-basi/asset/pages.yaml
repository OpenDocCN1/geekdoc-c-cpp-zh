- pgno: 13
  md: '# Foreword


    You are holding in your hands a book that will make your life as an enterprise
    developer a whole lot easier.


    It''s a guide on Microsoft Enterprise Library and it''s meant to *guide* you through
    how to apply .NET for enterprise development. Enterprise Library, developed by
    the patterns & practices group, is a collection of reusable components, each addressing
    a specific cross-cutting concern—be it system logging, or data validation, or
    exception management. Many of these can be taken advantage of easily. These components
    are architecture agnostic and can be applied in a multitude of different contexts.


    The book walks you through functional blocks of the Enterprise Library, which
    include data access, caching, cryptography, exception handling, logging, security,
    and validation. It contains a large collection of exercises, tricks and tips.


    Developing robust, reusable, and maintainable application requires knowledge of
    design patterns, software architectures and solid coding skills. We can help you
    develop those skills with Enterprise Library since it encapsulates proven and
    recommended practices of developing enterprise applications on the .NET platform.
    Though this guide does not go into the depth of discussions of architecture and
    platforms, it provides a solid basis for you to discover and implement these patterns
    from a reusable set of components. That''s why I also encourage you to check out
    the Enterprise Library source code and read it.


    This guide is not meant to be a complete reference on Enterprise Library. For
    that, you should go to MSDN. Instead, the guide covers most commonly used scenarios
    and illustrates how Enterprise Library can be applied in implementing those. The
    powerful message manifesting from the guide is the importance of code reuse. In
    today''s world of complex large software systems, high-quality pluggable components
    are a must. After all, who can afford to write and then maintain dozens of different
    frameworks in a system—all to accomplish the same thing? Enterprise Library allows
    you to take advantage of the proven code complements to manage a wide range of
    task and leaves you free to concentrate on the core business logic and other “working
    parts” of your application.


    Another important emphasis that the guide makes is on software designs, which
    are easy to configure, testable and maintainable. Enterprise Library has a flexible
    configuration subsystem driven from either external config files, or programmatically,
    or both. Leading by example, Enterprise Library itself is designed in a loosely-coupled
    manner. It'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'promotes key design principles of the separation of concerns, single responsibility
    principle, principle of least knowledge and the DRY principle (Don''t Repeat Yourself).
    Having said this, don''t expect this particular guide to be a comprehensive reference
    on design patterns. It is not. It provides just enough to demonstrate how key
    patterns are used with Enterprise Library. Once you see and understand them, try
    to extrapolate them to other problems, contexts, scenarios.


    The authors succeeded in writing a book that is targeted at both those who are
    seasoned Enterprise Library developers and who would like to learn about the improvements
    in version 5.0, and those, who are brand new to Enterprise Library. Hopefully,
    for the first group, it will help orientate you and also get a quick refresher
    of some of the key concepts. For the second group, the book may lower your learning
    curve and get you going with Enterprise Library quickly.


    Lastly, don''t just read this book. It is meant to be a practical tutorial. And
    learning comes only through practice. Experience Enterprise Library. Build something
    with it. Apply the concepts learnt in practice. And don''t forget to share your
    experience.


    In conclusion, I am excited about both the release of Enterprise Library 5.0 and
    this book. Especially, since they ship and support some of our great new releases—Visual
    Studio 2010, .NET Framework 4.0 and Silverlight 4, which together will make you,
    the developer, ever more productive.


    Scott Guthrie

    Corporate Vice-President

    Microsoft .NET Developer Platform

    Redmond, Washington'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# About This Guide


    When you casually pick up a book in your local bookstore or select one from the
    endless collection available on your favorite Web site, you’re probably wondering
    what the book actually covers, what you’ll learn from it, whether the content
    is likely to be interesting and useful, and—of course—whether it is actually any
    good. We’ll have a go at answering the first three of these questions here. The
    final question is one only you can answer. Of course, we would be pleased to hear
    your opinion through our community Web site at http://entlib.codeplex.com/.


    # WHAT DOES THIS GUIDE COVER?


    As you can probably tell from the title, this guide concentrates on how you can
    get started with Enterprise Library. It will help you learn how to use Enterprise
    Library in your applications to manage your crosscutting concerns, simplify and
    accelerate your development cycle, and take advantage of proven practices. Enterprise
    Library is a collection of prewritten code components that have been developed
    and fine-tuned over many years. You can use them out of the box, modify them as
    required, and distribute them with your applications. You can even use Enterprise
    Library as a learning resource. It includes the source code that demonstrates
    Microsoft® .NET programming techniques and the use of common design patterns that
    can improve the design and maintainability of your applications. By the way, if
    you are not familiar with the term crosscutting concerns, don’t worry, we’ll explain
    it as we go along.


    Enterprise Library is an extensive collection, with a great many moving parts.
    To the beginner knowing how to best take advantage of it is not completely intuitive.
    Therefore, in this guide we’ll help you to quickly understand what Enterprise
    Library is, what it contains, how you can select and use just the specific features
    you require, and how easy it is to get started using them. You will see how you
    can quickly and simply add Enterprise Library to your applications, configure
    it to do exactly what you need, and then benefit from the simple-to-use, yet extremely
    compelling opportunities it provides for writing less code that achieves more.


    The first chapter of this guide discusses Enterprise Library in general, and provides
    details of the individual parts so that you become familiar with the framework
    as a whole.'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'The aim is for you to understand the basic principles of each of the application
    blocks in Enterprise Library, and how you can choose exactly which blocks and
    features you require. Chapter 1 also discusses the fundamentals of using the blocks,
    such as how to configure them, how to instantiate the components, and how to use
    these components in your code.


    The remaining seven chapters discuss in detail the application blocks that provide
    the basic crosscutting functionality such as data access, caching, logging, and
    exception handling. These chapters explain the concepts that drove development
    of the blocks, the kinds of tasks they can comprehend, and how they help you implement
    many well-known design patterns. And, of course, they explain—by way of code extracts
    and sample programs—how you actually use the blocks in your applications. After
    you’ve read each chapter, you should be familiar with the block and be able to
    use it to perform a range of functions quickly and easily, in both new and existing
    applications.


    Finally, the appendixes present more detailed information on specific topics that
    you don’t need to know about in detail to use Enterprise Library, but are useful
    as additional resources and will help you understand how features such as dependency
    injection, interception, and encryption fit into the Enterprise Library world.


    You can also download and work through the Hands-On Labs for Enterprise Library,
    which are available at http://go.microsoft.com/fwlink/?LinkId=188936.


    # WHAT THIS GUIDE DOES NOT COVER


    The aim of this guide is to help you learn how to benefit from the capabilities
    of Enterprise Library. It does not describe the common design patterns in depth,
    or attempt to teach you about application architecture in general. Instead, it
    concentrates on getting you up to speed quickly and with minimum fuss so you can
    use Enterprise Library to manage your crosscutting concerns.


    One of the core tenets of modern application design is that you should reduce
    the coupling or dependencies between components and objects, and Enterprise Library
    version 5.0 helps you achieve this goal through use of the Dependency Injection
    (DI) design pattern. However, you do not have to be a DI expert to use Enterprise
    Library; all of the complexity is managed internally by the core mechanisms within
    the framework. While we do explain the basic use of DI in terms of Enterprise
    Library, that is not a fundamental feature of this guide.


    Enterprise Library is designed to be extensible. You can extend it simply by writing
    custom plug-in providers, by modifying the core code of the library, or even by
    creating entirely new blocks. In this guide, we provide pointers to how you can
    do this and explain the kinds of providers that you may be tempted to create,
    but it is not a topic that we cover in depth. These topics are discussed more
    fully in the documentation installed with Enterprise Library and available online
    at http://go.microsoft.com/fwlink/?LinkId=188874, and in the many other resources
    available from our community Web site at http://www.codeplex.com/entlib.


    For more information about the Dependency Injection (DI) design pattern and the
    associated patterns, see “Inversion of Control Containers and the Dependency Injection
    pattern” at http://martinfowler.com/articles/injection.html.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# HOW WILL THIS GUIDE HELP YOU?


    If you build applications that run on the Microsoft .NET Framework, whether they
    are enterprise-level business applications or even relatively modest Windows®
    Forms, Windows Presentation Foundation (WPF), Windows Communication Foundation
    (WCF), or ASP.NET applications, you can benefit from Enterprise Library. This
    guide helps you to quickly grasp what Enterprise Library can do for you, presents
    examples that show it in action, and make it easier for you to start experimenting
    with Enterprise Library.


    The sample applications are easy to assimilate, fully commented, and contain code
    that demonstrates all of the main features. You can copy this code directly into
    your applications if you wish, or just use it as a guide when you need to implement
    the common functionality it provides. The samples are console-based applications
    that contain separate procedures for each function they demonstrate. You can download
    these samples from http://go.microsoft.com/fwlink/?LinkId=189009.


    Finally, what is perhaps the most important feature of this guide is that it will
    hopefully ally any fears you may have about using other people’s code in your
    applications. By understanding how to select exactly the features you need, and
    installing the minimum requirements to implement these features, you will see
    that what might seem like a huge and complicated framework is actually a really
    useful set of individual components and features from which you can pick and choose—a
    candy store for the architect and developer.


    # What Do You Need to Get Started?


    The prerequisites for using this guide are relatively simple. You’ll need to be
    relatively experienced in Visual Basic, and understand general object-oriented
    programming techniques. The system requirements and prerequisites for using Enterprise
    Library are:


    +   - Supported architectures: x86 and x64.


    +   - Operating system: Microsoft Windows® 7 Professional, Enterprise, or Ultimate;
    Windows Server® 2003 R2; Windows Server 2008 with Service Pack 2; Windows Server
    2008 R2; Windows Vista® with Service Pack 2; or Windows XP with Service Pack 3.


    +   - Microsoft .NET Framework 3.5 with Service Pack 1 or Microsoft .NET Framework
    4.0.


    +   - For a rich development environment, the following are recommended:

    +     * Microsoft Visual Studio® 2008 Development System with Service Pack 1 (any
    edition) or Microsoft Visual Studio 2010 Development System (any edition).


    +   - To run the unit tests, the following are also required:

    +     * Microsoft Visual Studio 2008 Professional, Visual Studio 2008 Team Edition,
    Visual Studio 2010 Premium, Visual Studio 2010 Professional, or Visual Studio
    2010 Ultimate Edition.

    +     * Moq v3.1 assemblies.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '+   - For the Data Access Application Block, the following is also required:

    +     - A database server running a database that is supported by a .NET Framework
    3.5 with Service Pack 1 or .NET Framework 4.0 data provider. This includes Microsoft
    SQL Server® 2000 or later, SQL Server 2005 Compact Edition, and Oracle 9i or later.
    The database server can also run a database that is supported by the .NET Framework
    3.5 with Service Pack 1 or the .NET Framework 4.0 data providers for OLE DB or
    ODBC.


    +   - For the Logging Application Block, the following are also required:

    +     - Stores to maintain log messages. If you are using the MSMQ trace listener
    to store log messages, you need the Microsoft Message Queuing (MSMQ) component
    installed. If you are using the Database trace listener to store log messages,
    you need access to a database server. If you are using the Email trace listener
    to store log messages, you need access to an SMTP server.


    Other than that, all you require is some spare time to sit and read, and to play
    with the example programs. Hopefully you will find the contents interesting (and
    perhaps even entertaining), as well as a useful source for learning about Enterprise
    Library.'
  merge: -1
  img_proc: true
