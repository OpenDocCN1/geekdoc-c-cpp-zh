    property of the exception generated within the service to the FaultMessage property
    of the SalaryCalculationFault class, and map the unique Handling Instance ID of
    the exception (specified by setting the Source to ''{Guid}'') to the FaultId property,
    as shown in Figure 6.


    # EDITING THE SERVICE CODE TO USE THE NEW POLICY


    After you specify your fault contract and configure the Fault Contract exception
    handler, you must edit your service code to use the new exception policy. If you
    did not already do so, you must also add a reference to the assembly that contains
