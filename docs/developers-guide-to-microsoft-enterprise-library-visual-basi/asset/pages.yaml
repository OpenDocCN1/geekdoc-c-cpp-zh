    # MANAGING CONNECTIONS


    For many years, developers have fretted about the ideal way to manage connections
    in data access code. Connections are scarce, expensive in terms of resource usage,
    and can cause a big performance hit if not managed correctly. You must obviously
    open a connection before you can access data, and you should make sure it is closed
    after you have finished with it. However, if the operating system does actually
    create a new connection, and then closes and destroys it every time, execution
    in your applications would flow like molasses.


    Instead, ADO.NET holds a pool of open connections that it hands out to applications
    that require them. Data access code must still go through the motions of calling
    the methods to create, open, and close connections, but ADO.NET automatically
    retrieves connections from the connection pool when possible, and decides when
    and whether to actually close the underlying connection and dispose it. The main
    issues arise when you have to decide when and how your code should call the Close
    method. The Data Access block helps to resolve these issues by automatically managing
    connections as far as is reasonably possible.


    When you use the Data Access block to retrieve a DataSet, the ExecuteDataSet method
    automatically opens and closes the connection to the database. If an error occurs,
    it will ensure that the connection is closed. If you want to keep a connection
    open, perhaps to perform multiple operations over that connection, you can access
    the Active Connection property of your DbCommand object and open it before calling
    the ExecuteDataSet method. The ExecuteDataSet method will leave the connection
    open when it completes, so you must ensure that your code closes it afterwards.


    In contrast, when you retrieve a DataReader or an XmlReader, the ExecuteReader
    method (or, in the case of the XmlReader, the ExecuteXmlReader method) must leave
    the connection open so that you can read the data. The ExecuteReader method sets
    the CommandBehavior property of the reader to CloseConnection so that the connection
    is closed when you dispose the reader. Commonly, you will use a Using construct
    to ensure that the reader is disposed, as shown here:


    ```

    Using reader As IDataReader = db.ExecuteReader(cmd)

    '' use the reader here

    End Using

    ```'
  merge: -1
  img_proc: true
