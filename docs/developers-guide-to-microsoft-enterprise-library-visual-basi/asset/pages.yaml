- pgno: 202
  md: 'You can also specify a rule set using the **RulesetName** property, and use
    the **Validation SpecificationSource** property to refine the way that the block
    creates the validator for the property.


    For more information about WPF integration, see the documentation installed with
    Enterprise Library and available online at http://go.microsoft.com/fwlink/?LinkId=188874.


    # Creating Custom Validators


    While the wide range of validators included with the Validation block should satisfy
    most requirements, you can easily create your own custom validators and integrate
    them with the block. This may be useful if you have some specific and repetitive
    validation task that you need to carry out, and which is more easily accomplished
    using custom code.


    The easiest way to create a custom validator is to create a class that inherits
    from one of the abstract base classes provided with the Validation block. Depending
    on the type of validation you need to perform, you may choose to inherit from
    base types such as the **ValueValidator** or **MemberAccessValidator** classes,
    the **Validator(Of T)** base class (for a strongly typed validator) or from the
    **Validator** class (for a loosely typed validator).


    You can also create your own custom validation attributes that will apply custom
    validators you create. The base class, **ValidatorAttribute**, provides a good
    starting point for this.


    For more information on extending Enterprise Library and creating custom providers,
    see the documentation installed with Enterprise Library and available online at
    http://go.microsoft.com/fwlink/?LinkId=188874.


    # Summary


    In this chapter we have explored the Enterprise Library Validation block and shown
    you how easy it is to decouple your validation code from your main application
    code. The Validation block allows you to define validation rules and rule sets;
    and apply them to objects, method parameters, properties, and fields of objects
    you use in your application. You can define these rules using configuration, attributes,
    or even using custom code and self-validation within your classes.


    Validation is a vital crosscutting concern, and should occur at the perimeter
    of your application, at trust boundaries, and (in most cases) between layers and
    distributed components. Robust validation can help to protect your applications
    and services from malicious users and dangerous input (including SQL injection
    attacks); ensure that it processes only valid data and enforces business rules;
    and improve responsiveness.


    The ability to centralize your validation mechanism and the ability to define
    rules through configuration also make it easy to deploy and manage applications.
    Administrators can update the rules when required without requiring recompilation,
    additional testing, and redeployment of the application. Alternatively, you can
    define rules, validation mechanisms, and parameters within your code if this is
    a more appropriate solution for your own requirements.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# Introduction


    How secret are your secrets? We all know how important it is to encrypt information
    that is sensitive, whether it is stored in a database or a disk file, passed over
    the network (especially the Internet), or even sitting around in memory. Handing
    over a list of your customers'' credit card numbers to some geek sitting in his
    bedroom hacking your online store is not a great way to build customer confidence.
    Neither is allowing some disenfranchised administrator to leave your company with
    a plain-text copy of all your trading partners'' network passwords.


    The trouble is that writing all that extra code from scratch to perform reliable
    and secure encryption is complicated and soaks up valuable development time. Even
    the names of the encryption algorithms are impenetrable, such as AES, 3DES, and
    RC5. And when it comes to hashing algorithms, there''s even more of an assortment.
    How do you implement routines to use the HMAC, MD5, RIPEMD, and SHA algorithms?


    The Microsoft® .NET Framework provides a range of managed code hashing and encryption
    mechanisms, but you still need to write a good deal of code to use them. Thankfully,
    the Cryptography Application Block makes it all very much easier. Like all of
    the other application blocks in Enterprise Library, the Cryptography block is
    completely configurable and manageable, and offers a wide range of hashing and
    encryption options using many of the common (and some not so common) algorithms.


    # What Does the Cryptography Block Do?


    The Cryptography block provides mechanisms to perform two basic activities: symmetric
    encryption/decryption of data, and creating hash values for data. It contains
    a range of providers that make use of the platform functions for a range of encryption
    and hashing algorithms. These providers have a simple API that makes it easy to
    perform common actions, without requiring you to be familiar with the individual
    algorithms or the process of interacting with the platform functionality.'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# A SECRET SHARED


    One important point you must be aware of is that there are two basic types of
    encryption: symmetric (or shared key) encryption, and asymmetric (or public key)
    encryption. The Cryptography block supports only symmetric encryption. The patterns
    & practices guide “Data Confidentiality” at http://msdn.microsoft.com/en-us/library/aa480570.aspx
    provides an overview of both types of encryption and lists the factors you should
    consider when using encryption.


    Is secret still secret when you tell it to somebody else? When using symmetric
    encryption, you don’t have a choice. Unlike asymmetric encryption, which uses
    different public and private keys, symmetric encryption uses a single key to both
    encrypt and decrypt the data. Therefore, you must share the encryption key with
    the other party so that they (or it, in the case of code) can decrypt the data.


    In general, this means that the key should be long and complex (the name of your
    dog is not a great example of an encryption key). Depending on the algorithm you
    choose, this key will usually be a minimum of 128 bits—the configuration tools
    in Enterprise Library can generate random keys for you, as you’ll see in the section
    “Configuring Cryptographic Providers” later in this chapter. Alternatively, you
    can configure the encryption providers to use your existing keys.


    # MAKING A HASH OF IT


    Hashing is useful when you need to store a value or data in a way that hides the
    original content with no option of reconstructing the original content. An obvious
    example is when storing passwords in a database. Of course, the whole point of
    creating a hash is to prevent the initial value from being readable; thus, the
    process is usually described as a one-way hashing function. Therefore, as you
    can’t get the original value back again, you can only use hashing where it is
    possible to compare hashed values. This is why many systems allow users only to
    reset (but not retrieve) their passwords, because the system itself has no way
    to retrieve the original password text.


    In the case of stored passwords, the process is easy. You just hash the password
    the user provides when they log in and compare it with the hash stored in your
    database or repository. Just be aware that you cannot provide a forgotten password
    function that allows users to retrieve a password. Sending them the hashed value
    would not be of any help at all.


    Other examples for using hashing are to compare two long string values or large
    objects. Hashing effectively generates a unique key for such a value or object
    that is considerably smaller, or shorter, than the value itself.


    # HOW DOES THE CRYPTOGRAPHY BLOCK MANAGE ENCRYPTION KEYS?


    The keys required for both encryption and decryption are stored in separate files,
    one for each key, on your machine. The full physical path and name of each key
    file is stored in the configuration of your application. If you move your application
    or key files, you must update this path.


    One vitally important issue you must be aware of when using encryption (both symmetric
    providers and some hashing algorithms) is that, if a malicious user or attacker'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'obtains access to your keys, they can use them to decrypt your data. Therefore,
    to protect the keys, the key files are encrypted automatically using the Windows®
    Data Protection application programming interface (DPAPI), which relies on either
    a machine key or a user key that is auto-generated by the operating system. If
    you lose a key file, or if a malicious user or attacker damages it, you will be
    unable to decrypt the data you encrypted with that key.


    Therefore, ensure that you protect your key files from malicious access, and keep
    backup copies. In particular, protect your keys with access control lists (ACL)
    that grant only the necessary permissions to the identities that require access
    to the key file, and avoid allowing remote debugging if the computer runs in a
    high-risk environment (such as a Web server that allows anonymous access).


    For more information on DPAPI, and a description of how it works, see “Windows
    Data Protection” at http://msdn.microsoft.com/en-us/library/ms953555.aspx.


    # HOW DOES THE CRYPTOGRAPHY BLOCK INTEGRATE WITH OTHER BLOCKS?


    The Cryptography block integrates with the Caching block, where it can be used
    to encrypt cached data. When you add a symmetric storage encryption provider to
    the Caching block, it automatically adds the Cryptography block to your application
    configuration. The Security block uses the Caching block to store credentials.
    When you add a caching store provider to a security cache for the Security block,
    you can configure that caching store manager to use one of your configured cache
    managers. If that cache manager uses a persistent backing store, you should ensure
    that you use a symmetric storage encryption provider for that cache manager.


    # How Do I Use the Cryptography Block?


    Like all of the Enterprise Library application blocks, you start by configuring
    your application to use the block, as demonstrated in Chapter 1, “Introduction.”
    Then you add one or more hash algorithm providers and one or more symmetric encryption
    providers, depending on the requirements of your application. For each of the
    providers that you add, you select a specific cryptographic provider (algorithm
    type) and set the relevant properties for each provider. If none of the built-in
    hash and symmetric encryption providers meets your requirements, you can create
    custom providers and add these to your application configuration.


    After you add the hash algorithm providers and symmetric encryption providers
    you want to use to your configuration, you can specify which of each of these
    is the default—the one that the block will use if you don’t specify a provider
    by name in your application code. You just use the drop-down lists for the DefaultHashProvider
    and Default SymmetricCryptoProvider properties of the Cryptography Application
    Block node to select the default providers.


    Of course, as part of the configuration task, you still need to decide which algorithms
    to use. For a Hash Algorithm Provider, you can specify if the provider will use
    a SALT value (a random string pre-pended to the plain-text before hashing to improve
    the security of the algorithm). In addition, for some of the hash algorithms,
    you can specify or'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'generate a key for the algorithm. Other providers, such as SHA and MD5, do
    not require a key. As a general recommendation, you should aim to use at minimum
    the SHA256 algorithm for hashing, and preferably a more robust version such as
    SHA384 or SHA512.


    You can use two different types of **Symmetric Encryption Provider** in the Cryptography
    block (in addition to custom providers that you create). You can choose the DPAPI
    provider, or one of the well-known symmetric algorithms such as AES or 3DES. As
    a general recommendation, you should aim to use the AES (Rijndael) algorithm for
    encryption.


    > Comprehensive information about the many different encryption and hashing algorithms
    is contained in the Handbook of Applied Cryptography (Menezes, Alfred J., Paul
    C. van Oorschot and Scott A. Vanstone, CRC Press, October 1996, ISBN: 0-8493-8523-7).
    See http://www.cacr.math.uwaterloo.ca/hac/ for more information. You will also
    find a list of publications that focus on cryptography at "Additional Documentation
    on Cryptography" (http://msdn.microsoft.com/en-us/library/aa375543(VS.85).aspx).


    # CONFIGURING CRYPTOGRAPHIC PROVIDERS


    In addition to the obvious properties for each cryptographic provider you add
    to your configuration, such as the name, some providers require you to specify
    an encryption key. If you already have a DPAPI-encrypted key file for the selected
    algorithm type, you can use this. Alternatively, you can copy an existing plain
    text value of the appropriate size and use this as the key value. The third approach
    is to allow the Enterprise Library configuration to generate a new key for you.


    When you add a provider that requires a key to your configuration, the configuration
    tool starts the Cryptographic Key Wizard. This makes it easy to select or create
    the key you need and save it to a file and to set the appropriate values in the
    configuration. The only page you may find confusing is the final one where you
    must specify either Machine mode or User mode access to the key.


    You should select **Machine** mode if your application runs on its own dedicated
    server that is not shared with other applications, or when you have multiple applications
    that run on the same server and you want those applications to be able to share
    sensitive information.


    Select **User** mode if you run your application in a shared hosting environment
    and you want to make sure that your application''s sensitive data is not accessible
    to other applications on the server. In this situation, each application should
    run under a separate identity, and the resources for the application—such as files
    and databases—should be restricted to that identity.


    If you add a DPAPI symmetric cryptography provider to your list of symmetric providers,
    you can specify the Protection Scope as either **CurrentUser** or **LocalMachine**.
    Current user means that DPAPI uses a loaded user profile to generate the key,
    and only that user account can decrypt the encrypted data. Local machine means
    that any code running on the machine has access to the protected key, and can
    decrypt any secret encrypted in the same mode.'
  merge: -1
  img_proc: true
- pgno: 207
  md: "# ## ADDING THE REQUIRED REFERENCES\n\nTo use the Cryptography block features\
