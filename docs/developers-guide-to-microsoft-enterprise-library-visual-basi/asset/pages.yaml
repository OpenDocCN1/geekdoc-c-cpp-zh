    \ EncryptSymmetric method that takes a\n' byte array returns the result as a byte\
    \ array.\nDim encrypted As Byte() = defaultCrypto.EncryptSymmetric(\"RijndaelManaged\"\
    , _\n    serializedObject)\n\n' Now decrypt the result byte array and deserialize\
