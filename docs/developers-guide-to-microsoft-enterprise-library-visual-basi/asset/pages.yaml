    +   - Microsoft.Practices.EnterpriseLibrary.Security.Caching.dll\n\nTo make it\
    \ easier to use the objects in the Cryptography block, you can add references\
    \ to the relevant namespaces to your project. Then you are ready to write some\
    \ code. The following sections demonstrate the tasks you can accomplish, and provide\
    \ more details about how the block helps you to implement a common, reusable strategy\
    \ for cryptography.\n\nHowever, before you start to use the objects in the block,\
    \ you must resolve an instance of the CryptographyManager class. This class exposes\
    \ the API that you interact with to use the cryptography providers (symmetric\
    \ and hash providers) in your code. The simplest approach is to use the GetInstance\
    \ method of the Enterprise Library container, as shown here.\n\n```\n' Resolve\
    \ the default CryptographyManager object from the container.\nDim defaultCrypto\
    \ As CryptographyManager _\n    = EnterpriseLibraryContainer.Current.GetInstance(Of\
    \ CryptographyManager)()\n```\n\n# ## Diving in with an Example\n\nYou can download\
    \ an example application (a simple console-based application) that demonstrates\
