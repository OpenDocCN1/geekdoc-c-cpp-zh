- pgno: 233
  md: 'Modern business applications consist of custom business objects and components
    that perform specific or generic tasks within the application, in addition to
    components that individually address crosscutting concerns such as logging, authentication,
    authorization, caching, and exception handling. The key to successfully building
    these types of applications is to achieve a decoupled or very loosely coupled
    design. Loosely coupled applications are more flexible and easier to maintain.
    They are also easier to test during development.


    # What is Dependency Injection?


    Dependency injection (DI) is a prime technique for building loosely coupled applications.
    It provides opportunities to simplify code, abstract and handle dependencies between
    objects, and automatically generate dependent object instances. Dependency injection
    describes the process of designing applications so that, rather than specifying
    concrete dependencies within the application at design time and creating the required
    objects in the code, the application decides at run time what objects it needs,
    and generates and injects these into the application.


    +   The use of dependency injection provides several benefits, including:

    +   - **Reducing coupling between classes.** Dependencies are clearly defined
    in each class. The configuration information, and mappings between interfaces
    or base classes and the actual concrete types, are stored in the container used
    by the dependency injection mechanism, and can be updated as required—without
    requiring any changes to the run-time code.

    +   - **Making your code more discoverable.** You can easily tell from the types
    of the constructors, properties, or methods of your classes what objects they
    use and what dependencies they have. If you create instances using code inside
    the classes, it is more difficult to trace dependencies. Resolving dependencies
    at the surface of a class by specifying the types or interfaces it requires and
    taking advantage of dependency injection is the recommended approach.

    +   - **Making testing easier.** If you resolve or obtain objects using code within
    your classes, you must provide a suitably configured container for use when unit
    testing these classes. If you take advantage of dependency injection, you can
    create simple mock test objects for your classes to use.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# The Unity Dependency Injection and Interception Mechanism


    Unity is a lightweight, flexible, configurable, and extensible dependency injection
    container that supports constructor, property setter, and method call injection
    (as well as instance and type interception). It is provided as an integral part
    of Enterprise Library and is also available as a stand-alone DI mechanism. Unity
    provides a comprehensive set of capabilities, and makes it easy to implement common
    dependency inversion patterns and techniques that are useful in application architecture,
    design, and development.


    Unity provides a container that you use to store mappings and registrations. You
    can create multiple containers, and nest these containers in a hierarchical fashion,
    if required. It also supports extensions that allow you to implement extra functionality
    for objects resolved through the container. Unity can generate instances of any
    object that has a public constructor (in other words, objects that you can create
    using the New operator).


    As Unity creates each object, it inspects it for dependencies and automatically
    populates these. So, for example, if you specify a parameter for the constructor
    or a dependent property of a custom class to be of type MyBusinessComponent, Unity
    will create an instance of MyBusinessComponent and populate the constructor or
    property. However, if MyBusinessComponent defines a dependency on another class
    named MyDataComponent, Unity will create an instance of that class and populate
    that dependency, and so on. If there is no mapping in the container for the type
    specified in the parameter or property, Unity simply creates a new instance of
    the specified type by calling the constructor of that type that has the greatest
    number of parameters, and returns it.


    Imagine that MyDataComponent requires a LogWriter to create log messages. If it
    contains a dependent parameter or property of type LogWriter, Unity will propagate
    that as part of the instantiation process as well. This process (sometimes referred
    to as auto-wiring) can apply right across the defined dependencies in your application,
    as shown in Figure 1.


    ![](img/d7009d38323c3b86f2dfbc5155fbf141_234_0.png)


    FIGURE 1

    A possible object graph for a business component'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# SUMMARY OF UNITY FEATURES


    Unity is more than just a simple dependency injection container. It provides advanced
    capabilities that allow you to satisfy a wide range of requirements that can help
    you build more decoupled applications. Unity allows you to:


    +   **Register mappings between interfaces or base classes and concrete object
    types.** When you resolve the interface or base type, Unity will return an instance
    of the concrete type. This may be a new or an existing instance, depending on
    the lifetime you specify for the registration.


    +   **Register instances of existing objects in the container.** When you resolve
    the type, Unity will return an instance of that type. This is useful when working
    with objects that must be instantiated as single instances (singletons), or must
    have a non-standard lifetime, such as services used by your application. Unity
    will return the existing instance.


    +   **Specify the lifetime of objects that will be resolved through the container.**
    Unity can resolve objects based on the singleton pattern; or with a weak reference
    when the object is managed by another process. It can also be configured to return
    instances on a per-thread basis, where a new instance is created for each thread
    while an existing instance is returned for calls on the same thread.


    +   **Define multiple named registrations for a type.** You can create more than
    one registration or mapping for a type as long as these registrations and mappings
    have a unique name. Registrations and mappings that do not have a name are known
    as default registrations and default mappings, where the name is effectively an
    empty string.


    +   **Construct an entire object graph for an application that will be resolved
    at run time.** Unity can automatically resolve the types specified in constructor
    and method parameters and properties at run time. The parameters of constructors
    or methods of objects that are resolved through the container, or the values for
    properties of objects resolved through the container, can be populated with an
    object resolved through another registration within the container, or an instance
    of the specified type if no matching registration exists.


    +   **Specify values for constructor and method parameters and properties.** These
    can be the parameters of constructors or methods of objects that are resolved
    through the container, or the values for properties of objects resolved through
    the container. The value can be specified directly, or it can be an object resolved
    through another registration within the container.


    +   **Define matching rules and behaviors as part of an interception policy.**
    These can be used to apply business rules or change the behavior of existing components.
    Calls to methods or properties of these objects will then pass through a policy
    pipeline containing one or more interception behaviors. This is a similar approach
    to that used in aspect-oriented programming (AOP).


    +   **Add custom extensions to the container.** These can extend or change the
    behavior of the container when resolving objects. Some Unity features, such as
    interception, are powered by a container extension that is included with the standard
    Unity installation.'
  merge: -1
