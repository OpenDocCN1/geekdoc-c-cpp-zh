    # Specifying the Location of Validation Rules


    When you use a validator obtained from the **ValidatorFactory**, as we''ve done
    so far in the example, validation will take into account any applicable rule sets
    defined in configuration and in attributes and self-validation methods found within
    the target object. However, you can resolve different factory types if you want
    to perform validation using only rule sets defined in configuration, or using
    only attributes and self-validation. The specialized types of factory you can
    use are:


    +   - **ConfigurationValidatorFactory.** This factory creates validators that
    only apply rules defined in a configuration file, or in a configuration source
    you provide. By default it looks for configuration in the default configuration
    file (App.config or Web.config). However, you can create an instance of a class
    that implements the **IConfigurationSource** interface, populate it with configuration
    data from another file or configuration storage media, and use this with when
    you create this validator factory.

    +   - **AttributeValidatorFactory.** This factory creates validators that only
    apply rules defined in Validation block attributes located in the target class,
    and rules defined through self-validation methods.

    +   - **ValidationAttributeValidatorFactory.** This factory creates validators
    that only apply rules defined in .NET Data Annotations validation attributes.'
