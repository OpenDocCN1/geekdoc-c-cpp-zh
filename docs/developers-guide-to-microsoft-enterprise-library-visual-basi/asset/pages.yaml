    # REFRESHING THE CACHE


    So far, when we used the Add method to add items to the cache, we passed a null
    value for the refreshAction parameter. You can use this parameter to detect when
    an item is removed from the cache, and discover the value of that item and the
    reason it was removed.


    You must create a class that implements the ICacheItemRefreshAction interface,
    and contains a method named Refresh that accepts as parameters the key of the
    item being removed, the value as an Object type, and a value from the CacheItemRemovedReason
    enumeration. The values from this enumeration are Expired, Removed (typically
    by your code or a dependency), Scavenged (typically in response to shortage of
    available memory), and Unknown (a reserved value you should avoid using).'
