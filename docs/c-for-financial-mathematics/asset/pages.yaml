    \ = (randInt + 0.5)/(RAND_MAX+1.0);\n    }\n    return ret;\n}\n```\n```\n\nWe've\
    \ called this `randuniformOld` because it uses the old C random number generator\
    \ `rand`. This isn't a good choice for Monte Carlo algorithms because the sequence\
    \ of pseudo random numbers it generates start to repeat themselves rather quickly.\n\
    \nFortunately, experts in generating random numbers on computers have produced\
    \ much better algorithms for generating pseudo random numbers. The *Mersenne Twister*\
    \ algorithm is a commonly used random number generator for Monte Carlo simulations\
    \ which takes advantage of the properties of so-called *Mersenne primes* to generate\
    \ pseudo random numbers. The details are not important for the purposes of this\
    \ book. The $C++$ class `mt19937` allows you to use the Mersenne Twister algorithm\
    \ without much more difficulty than using the old `rand` function. Admittedly\
    \ the class name `mt19937` is substantially more intimidating than the old function\
    \ name `rand` but that is the only big difference. The name comes from the fact\
    \ that it takes a whopping $2^{19937}-1$ calls to the random number generator\
    \ before the sequence of random numbers it generates repeats.\n\nThe code to generate\
    \ random numbers using the `mt19937` class is shown below. It uses several $C++$\
    \ features we have not seen before. First we create a global variable of type\
    \ `mt19937` called `mersenneTwister`.\n\n```\n`static mt19937 mersenneTwister;`\n\
    ```\n\nThe `mt19937` class is a standard class in modern versions of $C++$. To\
    \ use it one has to `#include <random>`.\n\nThe object `mersenneTwister` is our\
    \ random number generator. We have rewritten the `randuniform` function in `matlib.cpp`\
