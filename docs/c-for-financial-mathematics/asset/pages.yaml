    Begin by creating a new C++ project called **MyLib**. This is to distinguish it
    from the model code on the website **FMLib**. When this section is complete, the
    projects should in fact be identical.


    Our aim is to write a small library that makes available a **normcdf** function
    and a **norminv** function that compute the cumulative distribution function of
    the normal distribution and its inverse. We also want to make available a standard
    constant PI.


    In a separate file, we want to write a small main function to show how the library
    can be used.


    # 5.3.1 Creating the first header file


    So that other files can use these functions, we will need to declare them in a
    *header file*. This is a C++ file with the file name extension .h.


    You should now create a header file called **matlib.h** following the instructions
