    Simple though these numerical experiments are to perform, this does not reflect
    the history of the development of the theory of risk neutral pricing. In [2],
    it was proved mathematically that if the stock price follows the P-measure model
    (A.4), then the delta hedging strategy in continuous time is risk-free so long
    as one uses the Q-measure model (A.5). This has the consequence that if you believe
    that the continuous-time version of the P-measure model (A.4) is a perfect model
    for stock prices, then the only possible consistent way of pricing derivatives
    is to use the Q-measure model (A.5).


    This mathematical result has had a profound impact on financial markets. It provides
    a form of mathematical explanation of how a bank can trade in derivatives to make
    a profit.


    However, the mathematical result requires a number of unrealistic assumptions.
    In particular:


    +   - Unlimited amounts of stock can be bought or sold at this price and one is
    not restricted to buying whole numbers of stocks (we say there is infinite liquidity).

    - There are no transaction costs.

    - It is possible to trade in continuous time.

    - The stock price follows the continuous-time limit of the model (A.5).

    - Any amount of money may be invested or borrowed at a fixed risk-free rate of
    $ r $.

    - The stock does not pay a dividend.


    More sophisticated modelling can be used to remedy the last three problems and
    still obtain similar mathematical results, but the first three assumptions are
    essential to the argument.


    In some ways, therefore, the numerical results of Chapter 14 are more convincing
    than the mathematical result as one can easily test the performance of the strategy
    with more realistic market models.


    It is clear empirically that assumptions such as no transaction costs, infinite
    liquidity, constant volatility, and log normally distributed stock prices are
    unrealistic. More subtly, the assumption that the trader starts with their own
    view on the likely evolution of the market (i.e., a fixed P-measure model) is
    also typically false. Just as bookmakers have little or no opinion about the racing-form
