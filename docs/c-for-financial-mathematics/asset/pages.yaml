  md: 'In memory a **char** is stored as a number between 0 and 255, or, in hexadecimal,
    between 00 and FF. In other words, a **char** takes up exactly one byte. Some
    of the mappings between a numeric value and a character are given in Table 2.1.


    Unfortunately, C++ was designed to be compatible with C, and C was written by
    Americans in the 1960s. The authors of C clearly thought that an alphabet of 256
    characters would be more than enough for anyone, but for languages like Chinese
    it is nowhere near enough. Thus a **char** is an appropriate data type to store
    a character string written in English which may contain some numbers and punctuation
    marks. However, using the **char** data type is inappropriate for serious programs
    targeted at an international audience. We will largely ignore these issues in
    this book, since we are far more interested in working with numbers than working
    with text.


    Interestingly, back when C was being devised, not everyone had computer screens.
    Some computers just printed their output on paper. For this reason the set of
    possible **char** values doesn''t just consist of letters, numbers, and punctuation,
    it also contains some instructions for a *teleprinter*. A teleprinter was a primitive
    printer that behaved more like a typewriter than a modern printer. As a result,
    there is a special char value '' `\n`'' which means the instruction "new line",
    ''`\r`'' means carriage return. ''`\t`'' means tab. There is even ''`\a`'' which
    means make a ping sound to alert the user that the printout is complete!


    You specify a **char** by writing the character in quotes. For example:


    ```

