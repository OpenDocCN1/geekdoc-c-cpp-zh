    \ call themselves. This programming technique is called recursion.\n\nAs an example,\
    \ consider the following recursively defined sequence:\n\n```\n$$\\begin{gathered}\
    \ x_n = n x_{n-1} \\quad n \\geq 1 \\\\ x_0 = 1 . \\end{gathered}$$\n```\n\nClearly\
    \ $x_n = n!$.\n\nOne can define a function to compute $x_n$ as follows:\n\n```\n\
    ```cpp\nint factorial(int n) {\n    if (n == 0) {\n        return 1;\n    }\n\
    \    return n * factorial(n - 1);\n}\n```\n```\n\nIf this function is called with\
    \ the value $n = 0$ it will return 1, otherwise it will return $n * \\texttt{factorial}(n-1)$.\
    \ By induction it really does compute $n!$.\n\nOne other feature of C++ that this\
    \ example illustrates is that a function can contain arbitrarily complex statements\
    \ combining if statements and return statements. Indeed, a function can have multiple\
    \ return statements. Once a `return` statement has been executed, the processing\
    \ of the function is complete and all further lines of code are ignored.\n\nRecursion\
    \ can be a powerful programming technique, and some algorithms are easier to write\
    \ if one uses recursion. While recursion is a popular topic in computer science\
    \ courses, we will not use recursion much in this book. The exercises should give\
