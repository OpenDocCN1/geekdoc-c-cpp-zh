    # ### Tip: Declarations before definitions


    When you write a C++ file, put all your function declarations before the first
    definition.


    Since function declarations don''t contain any code (and so can''t use other functions),
    the order of the different function declarations isn''t important. You should
    declare the most interesting functions first so that someone reading your file
    can quickly understand the intention of the code.


    Resist the urge to try and reorder functions so that the code compiles without
    the need for separate declarations.


