  md: "It creates data of type `char*`. This means “a pointer to a memory address\
    \ containing a sequence of characters”. You need to tell C++ that you want to\
    \ convert this to a `string`.\n\nHow does a `char*` differ from a `string`? The\
    \ key difference is that a `char*` consists only of the data. A `string` combines\
    \ the data and a number of helpful functions into a single package.\n\nSo, for\
    \ example, the following code makes no sense in C++:\n\n```\nint a = \"Quick brown\
    \ fox\".size();\n```\n\nYou must first convert the raw data of \"Quick brown fox\"\
    \ into a `string` object and then you can call `size`.\n\n```\nstring s(\"Quick\
    \ brown fox\");\nint a = s.size();\n```\n\nIn general, we will prefer to use a\
    \ `string` rather than work with the raw data directly because these functions\
    \ are so helpful. Moreover, using `string` is more efficient because it stores\
    \ the length of the string as well as the actual characters.\n\nWhile we are discussing\
