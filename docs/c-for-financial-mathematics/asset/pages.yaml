  md: '# ### 15.4.5 Continuous integration


    Continuous integration is a development practice where everyone working on a software
    project integrates their code with the work of other developers on a regular basis
    (often several times a day). The advantage of doing this is that any problems
    caused by the interactions between different people''s work are caught early.
    It is very difficult to remember how you changed the software even a couple of
    hours ago, so if you don''t integrate regularly it can become very challenging
    to merge code together.


    To make continuous integration work, it is essential that you have a fully automated
    build that is run every time changes are made. To do this you can use a continuous
    integration server. A continuous integration server will:


    +   - check your version control system to see when changes are made;

    - automatically run a build;

    - send emails if the build has stopped working, which say whose changes are responsible
    for this.


    Even for a developer who is working on their own project, it is very useful to
    have a system that checks whether all your code is working every time you make
    a change. It is much better to find out what errors you have introduced at the
    time you introduce them.


    # ### 15.4.6 Logging


    Logging statements are a very useful way of understanding what is happening in
    your code. However, if you have too many logging statements, it becomes difficult
    to see the wood for the trees. Furthermore, too much logging can really slow your
    program down.


    It is a good idea to use a lot of logging statements in your code, but to have
    some mechanism to increase or decrease the amount of logging that occurs as your
    program runs. As well as being able to record a log of what is happening as you
    develop code, it can be a good idea to record some sort of log of what your code
    is doing whenever your code runs. That way, if someone finds a bug, they can send
    you the log file to help you get started on debugging.


    One very useful feature is to be able to click on a line in your log file and
    then jump to that line in your source code. Many text editors and integrated development
    environments can do this so long as you output your error messages using a format
    your environment understands. You should consult the documentation for your chosen
    development environment.


    Tools you can use to perform logging include the Boost library''s Boost.Log, and
    Apache''s log4cxx.


    # ### 15.4.7 Static analysis


    There are many bugs that can be detected in C++ code automatically.'
