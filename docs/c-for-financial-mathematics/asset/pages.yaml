- pgno: 285
  md: 'optimise the performance of almost any other function, your effort will be
    wasted!


    Before making any serious attempt to optimise your code, it is advisable that
    you profile it.


    Unless your performance requirements are very precise, you may not need to buy
    a separate piece of software to profile your code. A simple approach is to execute
    the slow bit of code and then stop the processing randomly ten times and record
    what is happening. You will probably find that the code is doing much the same
    thing each time you stop it. You can safely deduce that this is where the performance
    problem is.


    It is important to say that this book is about writing good quality C++ code,
    but it is not about writing C++ code for absolutely optimal performance. For most
    problems, it is far more important that your code executes correctly than that
    it executes as fast as humanly possible. Most of the time it is worth sacrificing
    some speed for other qualities of good code such as being easy to understand,
    read, and extend.


    Donald Knuth, a winner of the prestigious Turing Prize and a celebrated programming
    expert, famously said, “Premature optimisation is the root of all evil”.


