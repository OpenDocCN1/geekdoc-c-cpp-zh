  md: 'A useful mental picture is to think of an object as some data and an instruction
    manual explaining how to make sense of the data.


    When we want to price an option we need to know the strike, the maturity, and
    also some instructions on how to compute the payoff at maturity. These instructions
    take the form of a function called **payoff**.


    When we call the **price** function on our **MonteCarloPricer** we pass an option
    object as the first parameter. This object contains all the data we need plus
    all the instructions we need. When given an option to price, the **price** function
    looks up the **getMaturity** and the **payoff** functions in the index of the
    instruction manual, and uses these instructions to perform the computation. Implementing
    an interface is simply a way of stating clearly that the **getMaturity** and **payoff**
    functions will be there when needed.


    This simple metaphor is the heart of object-oriented programming. When writing
    software you should pass round not just data, but also the instruction manual
    for working with that data. An object is nothing but some data and an instruction
    manual. This is why we pass objects as parameters. This is why we write object-oriented
    programs.


    There are many object-oriented programming languages other than C++. Some other
    examples that are popular in the financial industry are Java and C#. Object-oriented
    programming principles are the same in different languages. For this reason a
    simple system of pictures was invented which allows you to draw the essential
    features of your software design without worrying about language-specific details.
    This system of pictures is called UML (Unified Modelling Language). Figure 10.1
    shows the UML diagram for our **CallOption**, **PutOption**, and **PathIndependentOption**
    classes.


    ![](img/c60a618fcc2a2ed9d1e8d96a1b4157ff_189_0.png)


    **FIGURE 10.1**: UML diagram for **PathIndependentOption**


    The dotted arrows in Figure 10.1 tell us that the **CallOption** and the **PutOption**
    classes implement the interface. The *italics* tell us that **PathIndependentOption**
    is an interface and that the methods are only declared by **PathIndependentOption**
    but not defined.


    The advantage of the UML diagram is that it strips away some of the more'
