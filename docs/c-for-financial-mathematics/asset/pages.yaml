    # ## 6.5 What have we gained?


    +   - We no longer need to keep writing **main** methods. It is no longer necessary
    to create new projects to answer exercises in this book. Instead we can simply
    write a new unit test for each exercise and have a single project with a single
    main method.

    - When trying out our code we don''t have to keep changing the main method to
    check that our code is correct.

    - We have a record of all the tests performed.

    - Whenever we change our code we can test immediately.

    - We know that our code always works! (So long as we have enough tests).

    - We have useful `DEBUG_PRINT` statements that will help us figure out what is
    going on if we find a bug in future.


    These advantages are enormous. So much so that many programmers advocate *test-driven
    development*. This phrase was introduced by highly influential software developer
    Kent Beck as part of a general set of programming principles called *extreme programming*
    [1].


    The idea of test-driven development is simple: You should write the test before
    you write the code. Why is this a good idea?


    Firstly it forces you to write the test. Your motivation to write a test will
    drop once you have a function that already appears to work. Secondly it will force
    you to think about what problem you are actually trying to solve before you go
    and solve it. Third it will prevent you writing untestable code. Fourth it tests
    your tests. Its quite easy to write tests that don''t actually test anything,
    so its good to see that they fail until you''ve finished writing the code.


    Writing tests is a significant skill and one of the most important skills that
    you should develop by reading this book. A programmer who has learned the benefits
    of writing unit tests and who won''t write code without them is sometimes called
    *test infected*. It sounds like an insult, but it''s a compliment. I hope you
    become test infected.'
