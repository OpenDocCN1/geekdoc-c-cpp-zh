    \ refer to shared pointers to `Priceable`. We can then use this to add a member\
    \ type `spVec`, which makes it easier to refer to vectors of shared pointers to\
    \ `Priceable`. We would then be able to use the abbreviation `Priceable::spVec`\
    \ to refer to this type in other classes, as shown below.\n\n```\n```cpp\nclass\
    \ Priceable {\npublic:\n   typedef shared_ptr<Priceable> sp;\n   typedef vector<\
    \ sp > spVec;\n   // ... more code ...\n};\n\nclass Portfolio {\nprivate:\n  \
    \ Priceable::spVec securities;\n   // ... more code ...\n};\n```\n```\n\nThere\
    \ is an alternative notation which is sometimes necessary to help the compiler\
    \ work out whether a term such as `Priceable::spVec` refers to a static member\
    \ variable or a member type. The alternative notation is simply to add the word\
    \ `typename` at the front.\n\n```\n```cpp\ntypename Priceable::spVec securities;\n\
