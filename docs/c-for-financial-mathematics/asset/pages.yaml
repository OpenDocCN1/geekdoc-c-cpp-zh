- pgno: 156
  md: '# 8.5 Recommendations on writing classes


    You have many choices available to you when you write a class about such matters
    as the name of the class and which file to define it in. It is good to have some
    conventions. In this book we choose to follow the following guidelines.


    +   1) Whenever possible, don''t put class declarations in header files, put them
    in `cpp` files. This follows from the general principle that you should try to
    hide information if possible.


    +   2) If you decide to put a class in a header file, define only one class in
    each header file.


    +   3) Name that class the same as the header file.


    +   4) Give classes names that are nouns: for example `CartesianPoint` or `BlackScholesModel`.


    +   5) Use upper case for the first letter of a class name.


    The files `BlackScholesModel.h` and `CallOption.h` demonstrate these conventions.


    The file `geometry.h` breaks these conventions but only because we don''t want
    to clutter the project with too many files that have nothing to do with financial
    mathematics. If we were really writing a geometry library, we would put all the
    point classes in their own header files for readability.


    A second issue to consider is the `const` keyword. In this chapter we have tried
    to use the `const` keyword consistently. However, the `const` keyword is an optional
    feature in C++. You can choose to use it if you want the compiler to guarantee
    that you never accidentally change an object when you didn''t mean to, but your
    code will work if you never use `const` at all.


    This means that you can make a software architecture decision for your project.
    Will you use `const` or won''t you? This is a decision for the entire project
    because it turns out that if you want to use the `const` keyword at all, you really
    need to use it everywhere. This is because if someone has passed you a `const`
    reference, you can only pass it to functions that themselves are declared as taking
    a `const` reference.


    In practice, this means you won''t get to choose whether to use `const` or not.
    You will need to ask your boss whether she wants you to use it or not.


    Even if you don''t like the `const` keyword yourself, if you are writing a library,
    you''ll need to use the `const` keyword if you your library users want to use
    the `const` keyword.


    In this book we will use `const` so that you can understand the issues raised,
    but you may prefer to avoid using it in your own code.'
