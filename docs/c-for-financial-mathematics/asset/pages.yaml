    However, the volatility parameter does not correspond to any market data in such
    a clear manner. Instead, one often attempts to calibrate the Black–Scholes model
    to the market by inverting the Black–Scholes formula and using the prices of call
    options on the market to deduce the volatility. The volatility computed in this
    way is called an *implied volatility*.'
