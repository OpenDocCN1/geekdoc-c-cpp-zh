  md: '# 1.3.1 Compiling on Windows


    +   - Open Visual Studio.

    - Select **File→New→Project . . .**

    - Select **Empty→Project**

    - Enter the Name `InterestCalculator` and press **OK**.

    - Note the name of the folder where your project is being saved.

    - Notice that to the right of the screen you have an area marked **Solution Explorer**
    inside which there is a picture of a folder marked **Source Files**. Right click
    on this and select **Add→New item. . .**

    - Select the option “C++ file” and enter the name `main.cpp` and press Add.

    - This creates a file called `main.cpp` which we will use to store our code. On
    the right-hand side of the screen you will see a text editor window where you
    can edit the code for `main.cpp`.

    - Copy and paste the example code from the website⁴ into the editor window.

    - Select **Project→Interest Calculator Properties. . .**, then select **Linker→System**
    and set the `SubSystem` to `Console (/SUBSYSTEM:CONSOLE)` using the drop down.

    - Press **OK**

    - Press `CTRL` + `F5` to compile and run your program


    This should have worked if you have managed to follow every instruction exactly.
    If it fails, close Visual Studio, delete all the files in the directory you noted
    down and try again! But this time be more careful.


    Setting up your first-ever project is probably the most fiddly and tedious task
    you will have to perform in this book.


    Why are there so many steps to creating your project?


    Firstly a typical C++ project contains a lot of different files, so in practice
    you don’t normally run through such a complex process very often. Most of the
    steps above are only needed when you create a new project. The two steps that
    you would be likely to perform repeatedly are:


    +   (i) creating new C++ source files by right clicking on the **Source Files**
    folder;


    (ii) pressing `CTRL` and `F5` to compile and run your program.


