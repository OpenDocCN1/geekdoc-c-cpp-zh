  md: "```\ncase <possible value>:\n   <statements>\ncase <possible value>:\n   <statements>\n\
    ...\ncase <possible value>:\n   <statements>\ndefault:\n   <statements>\n}\n```\n\
    \nThe body of the switch statement is the code between the curly brackets. This\
    \ consists of a list of possible cases and some code to execute. When executing\
    \ this switch statement, the computer will first evaluate **expression**. It then\
    \ looks for the first matching case statement and executes all the code from there\
    \ up to either the first **break** statement or up to the end of the switch statement.\n\
    \nIf there is no match, the computer looks for a **default** statement and evaluates\
    \ all the code from there to the end of the switch statement.\n\nAfter executing\
    \ the required statements from the body of the switch statement, the program moves\
    \ on to the next statement after the switch statement. In our example this means\
    \ it will wish you good luck in your career.\n\nNotice that you have to be careful\
    \ to insert **break** or **return** statements into your **switch** statements\
    \ to make sure the code doesn't execute more statements than you want it to.\n\
    \nFor example, if you remove all the **break** statements from our example, then\
    \ a score of 0 would be greeted with the response\n\n```\nYou have failed.\nYou\
    \ have passed.\nMerit.\nDistinction.\nInvalid score.\nGood luck in your future\
    \ career.\n```\n\nIf you dislike the syntax of **switch** statements, you are\
    \ not alone. Fortunately, they aren't very useful in modern C++ code. In modern\
    \ C++ one should use the object-oriented programming technique of *polymorphism*\
    \ instead. We will cover this subject in depth in Chapter 10. If you find yourself\
    \ tempted to write a **switch** statement, it's a sign that you aren't using object-oriented\
    \ programming to full advantage.\n\n# **Tip: Always include a default case**\n\
    \nIf you must write a **switch** statement, always be sure to include a **default**"
