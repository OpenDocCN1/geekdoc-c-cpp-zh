- pgno: 187
  md: '+   By telling the C++ compiler about the interface we were able to write one
    **priceByMonteCarlo** function that works for any path-independent option.


    If two different types of objects have similar functions then we can write algorithms
    that will work with both types of objects by using interfaces. This is a powerful
    way to avoid duplicating code.


    How common is it for two different types of object to have similar functions?
    The answer is *extremely common*. Here are some examples:


    +   1. Two printers provided by different manufacturers will differ in many ways,
    but the manufacturers should provide objects that allow us to print files on the
    different printers without duplicating our code. They can do this by agreeing
    on a common interface for all printers. This is the same thing as saying they
    should agree on a common set of print functions all printers are guaranteed to
    support.


    +   2. Two monsters in a computer game (say an elf and a dragon) will have many
    functions in common. For example, they will have functions to return their weights,
    heights, name and to draw them on the screen. The author of the game will introduce
    an interface **Monster** to avoid duplicating code.


    +   3. All stock price models should have a function **generatePrices**. We can
    write a standard interface **StockPriceModel** with various implementations such
    as **BlackScholesModel**, **StudentTModel**, **HestonModel** and **JumpDiffusionModel**.
    The last three are simply the names of some stock price models that have been
    proposed in the mathematical finance literature. Our Monte Carlo pricing code
    can then be modified so it will work with any model. Doing this is left as an
    exercise, see Exercise 14.4.5. The end result is a very powerful pricing function
    that can price any path-independent option using any model for the stock price
    at time T.


    +   4. All trading strategies should have a function **selectPortfolio** which
    decides how to invest at a particular moment in time. We can have a general interface
    **TradingStrategy** and concrete subclasses **Delta-HedgingStrategy** and **BuyAndHoldStrategy**.
    See Exercise 14.4.6.


    +   5. Any encryption algorithm should have methods **encrypt** and **decrypt**.
    This can be represented as an interface called **Cipher**. It is then possible
    to provide different implementations of the encryption algorithm that work in
    different ways. For example, you might write a **CaesarCipher** that replaces
    a with d, b with e, c with f, etc., or you might write a **ReverseCipher** that
    replaces a with z and b with y, etc. You could then write software that sends
    encrypted messages and that is capable of working with any **Cipher**.'
