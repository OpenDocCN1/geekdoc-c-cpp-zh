  md: 'The mathematical theorem underpinning this approach is the central limit theorem.
    It tells us that the expected price computed in this way is equal to the risk-neutral
    price. Moreover, it tells us that the standard error in this estimate is proportional
    to $1/\sqrt{N}$. So by increasing the number of scenarios in the simulation one
    can get increasingly accurate estimates of the derivative price. We can also compute
    confidence bounds for the error using the central limit theorem.


    Monte Carlo pricing is not necessary if the payoff of the derivative depends upon
    a single stock price at a single time. Recall that the risk-neutral price is defined
    as an expectation which is, in turn, defined as an integral. If the price of the
    derivative depends on the stock price at a single time, one only needs to calculate
    a 1-dimensional integral. This can be done more efficiently using Simpson''s rule
    than by using the Monte Carlo algorithm.


    If the payoff of the derivative depends upon the stock price at multiple time
    points or upon multiple risk factors, then the relevant integral will be a higher-dimensional
    integral. In general, high-dimensional integrals are difficult to perform efficiently
    and some form of Monte Carlo algorithm is required. The Monte Carlo algorithm
    we have given above for pricing derivatives is just an application of the Monte
    Carlo integration formula.


    Let us state the result explicitly even though it is simply a special case of
    the central limit theorem.


    > **Theorem 2.** Let $f : [0,1]^d \to \mathbb{R}$ be an integrable and square
    integrable function. Then one can estimate the $d$-dimensional integral $\int
    f$ by


    $\frac{1}{N} \sum_{j=1}^{N} f((x_1^j, x_2^j, \dots, x_d^j))$


    where the $x_i^j$ are uniformly distributed random variables on the interval $[0,
    1]$. By this we mean that the sum on the right hand side has expectation equal
    to $\int f$ and


    $\sqrt{N} \left( \frac{1}{N} \left( \sum_{j=1}^{N} f((x_1^j, x_2^j, \dots, x_d^j))
    \right) - \int f \right)$


    converges in distribution to a normal distribution $N(0, \sigma^2)$.


    It is important to know that section has simply described the most basic form
    of Monte Carlo pricing. Many refinements are possible. For a simple example, see
    Exercise 9.3.7. One should consult a book dedicated to Monte Carlo pricing to
    understand the state of the art. Implementing more sophisticated Monte Carlo algorithms
    would be an excellent test of the C++ skills you will develop by reading this
    book.


    We remark that Monte Carlo techniques can be used for many purposes other than
    just calculating risk-neutral prices. Monte Carlo methods can also'
