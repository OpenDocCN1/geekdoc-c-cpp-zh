    # 12.7 Forward declarations and the structure of cpp files


    The class Shape has a method boundingRectangle. This method returns a Rectangle.
    This means it is impossible to write the class Shape without first having told
    the compiler about the class Rectangle.


    On the other hand, a Rectangle is a Shape itself, so we have a circularity. This
    seems to make it impossible to declare either Rectangle or Shape.


    To deal with the problem you can use a forward declaration of the class Rectangle.
    Here''s an example of how to make forward declarations:


    ```

    class CartesianPoint;\nclass Rectangle;\n\nclass Shape {\npublic:\n/* Does the
    point lie in the shape */\nvirtual bool contains(const CartesianPoint& point)\nconst
    = 0;\n/* A rectangle bounding the shape */\nvirtual Rectangle boundingRectangle()
    const = 0;\n/* By default area is computed by Monte Carlo */\nvirtual double area()
    const;\n};

