  md: '# # Chapter 15

    ## Debugging and Development Tools


    Our software project has now become large and complex. It is still nothing like
    as complex as a bank’s actual trading system, but it already spans thousands of
    lines of code and dozens of files. The need for some additional development tools
    to help us work productively is becoming obvious.


    Because development tools are not standardised, we cannot describe in detail how
    to use all the different development tools you may find useful. We will focus
    on one standard tool called a “debugger”. A debugger is an essential part of any
    C++ developer’s toolkit. Its primary purpose is that it allows you to quickly
    locate where in your code an error is occurring. We will indicate how you can
    use the standard Visual Studio debugger on Windows and the standard gdb tool on
    Unix to help find bugs in your code. Other debuggers work in a broadly similar
    fashion, but you will need to consult their documentation for fuller details.


    To show how a debugger can be used to find bugs, FMLib15 compiles but does not
    work correctly. We will show how to find the bugs that have been deliberately
    introduced.


    A debugger is by no means the only development tool you should be using. We finish
    the chapter with a description of some other development tools you might want
    to use to increase your productivity. We will also discuss some important software
    development best practices which are crucial to working with large software projects.


    # ### 15.1 Debugging strategies


    Before explaining how to use a debugger, let us describe a number of strategies
    and techniques you can use to debug your code.


    # #### 15.1.1 Unit tests


    Your code should contain a lot of unit tests. Unit tests are the most valuable
    debugging tool you have available.


    This means that whenever you introduce a bug, your tests should hopefully'
  merge: -1
  img_proc: true
- pgno: 268
  md: 'tell you about it quickly. This is important because it is much easier to fix
    a bug shortly after you have written it. You may even find that you can hardly
    remember precisely what code changes you have made after a couple of hours have
    passed. This will obviously make debugging much harder. To help with this, write
    lots of unit tests and make sure all your tests are run whenever you change your
    code (see Section 15.4.5).


    As important as telling you which parts of your code are currently not working,
    unit tests tell you which parts of your code are working. If you have a million
    lines of code, knowing which parts of code you need to think about is extremely
    important.


    Whenever you discover a bug in your code that wasn''t picked up by a unit test
    you should write a unit test to make sure it never happens again. You should never
    write new code unless you are also writing tests for it.


    > **Tip: Write a little, test a little.**


    Do not write large amounts of code in one sitting. Write a small amount of code.
    Write some tests. Make sure everything compiles and all the tests pass. Then back
    up your code using your version control system (see Section 15.4.1). That way
    when an error occurs you should have a clear idea of what you are doing that might
    have caused it.


    # 15.1.2 Reading your code


    Often the quickest way to find a bug in your code is to read it through. This
    approach will only work if you know already which function contains the error
    as you cannot possibly re-read all your code every time a bug occurs. However,
    if you are following the strategy of writing a little and testing a little, you
    can usually guess that the bug is in the code you have just written.


    Very often it helps to explain your code to someone else. A very effective development
    practice is to write your code with a colleague. This is called pair programming
    [1]. You will find that you and your colleague both learn from each other and
    that many bugs are spotted before the code is even executed.


    Some people suggest an alternative practice called code-review, where developers
    read each other''s code and comment on it. This is much less enjoyable than pair
    programming and, it is argued in [1], much less effective.


    # 15.1.3 Logging statements


    You have probably already discovered for yourself the strategy of inserting logging
    statements throughout your code. By printing out the values of different variables
    at each line, one can often quickly work out what is going wrong.


    You may find that you are regularly inserting and deleting logging state-'
