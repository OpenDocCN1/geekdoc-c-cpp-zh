    When line 6 is executed the stack will look as shown in Figure 11.5:


    | | |

    | :--- | :--- |

    | | int n |

    | factorial | int ret |

    | | Called by testFactorial at line 11. |

    | | int n |

    | testFactorial | int nFactorial |

    | | Called by main at line 16 |

    | | int n |

    | main | int nFactorial |

    | | Called by the operating system. |



    ![](img/c60a618fcc2a2ed9d1e8d96a1b4157ff_223_0.png)


    For each function being executed, the stack stores all the parameters and local
    variables. It also contains a reference to where that function was called. The
    computer needs a record of where the code was called in order to be able to move
    the processing back to the correct location on return.


    The moment testFactorial returns, the memory used by that function can be deleted.
    The local variables n and ret of testFactorial are simply discarded from the stack.
    The stack will now look as shown in Figure 11.6.


    | | |

    | :--- | :--- |

    | | int n |

    | testFactorial | int nFactorial |

    | | Called by main at line 16 |

    | | int n |

    | main | int nFactorial |

    | | Called by the operating system. |



    ![](img/c60a618fcc2a2ed9d1e8d96a1b4157ff_223_1.png)


    This simple system of using a single block of memory for all function calls and
    simply adding and removing data at the top as new functions are called and then
    return is extremely efficient. It is one of the reasons why C++ code can be particularly
    fast.


    However, the stack is not sufficient to solve all problems. For example, the data
    allocated on the stack is always of a fixed size that is known when the program
    is compiled. This is why C arrays are of a fixed size that is determined before
    the program is compiled. As we have discussed, this makes C arrays too inflexible
    for most purposes and so it is usually better to use the vector class instead.
    Although it isn’t immediately apparent to the end user, a vector must store its
    data on the heap.'
