  md: "```\n```c++\n    int offset( int i, int j ) const {\n        ASSERT( i >=0\
    \ && i<nrows && j>=0 && j<ncols );\n        return j*nrows + i;\n    }\n```\n\
    ```\n\nYou will notice that this code performs an **ASSERT** statement that checks\
    \ whether the coordinates are within the range of the matrix. This is great for\
    \ debugging since it will find many bugs quickly. However, if you know that your\
    \ code is bug free, for maximum speed you would want to ensure that this **ASSERT**\
    \ statement is never called. Our testing macro **ASSERT** is designed so that\
    \ it will only be called in debug mode.\n\n# ### 16.2     The constructor and\
    \ destructor of Matrix\n\nThe most important constructor of Matrix has the following\
    \ declaration:\n\n```\n```c++\nMatrix( int nrows, int ncols, bool zeros=1 );\n\
    ```\n```\n\nAs we’ll see, it is often a waste of effort to initialise the contents\
    \ of a Matrix. On the other hand, it is a common bug to fail to initialise a variable.\
    \ For this reason we’ve allowed the user to say whether they would like our Matrix\
    \ to be initialised with zeros or not. By default it is initialised with zeros.\
    \ This should prevent the accidental bug, but allows the code to be optimised\
    \ if desired.\n\nHere is the definition of our constructor:\n\n```\n```c++\nMatrix::Matrix(\
    \ int nrows, int ncols, bool zeros )\n: nrows( nrows ), ncols( ncols ) {\n   \
    \ int size = nrows*ncols;\n    data = new double[size];\n    endPointer = data+size;\n\
    \    if (zeros) {\n        // memset is an optimised low level function\n    \
    \    // that should be faster than looping\n        memset( data, 0, sizeof( double\
    \ )*size );\n    }\n};\n```\n```\n\nThis is the first example where we’ve had\
    \ some serious work to do in the constructor. The most important feature is that\
    \ we create the in-memory storage using `new [ ]`. We then initialise it to zero\
    \ if required using `memset`.\n\n`memset` is a standard C function which can be\
    \ used to initialise a large amount of data all to the same value. Calling it\
    \ may be quicker than writing a loop since CPUs often have special instructions\
    \ for repetitive tasks such as this. We’ll discuss this more in Section 16.7."
