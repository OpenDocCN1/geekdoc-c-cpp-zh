  md: "# ### 16.3 Const pointers\n\nThe Matrix class has methods `begin()` and `end()`\
    \ that return pointers to the start and end of its data region.\n\n```\n\"\"\"\
    \n/*  Access a pointer to the first element  */\nconst double* begin() const {\n\
    \treturn data;\n}\n/*  Access a pointer to the element after last  */\nconst double*\
    \ end() const {\n\treturn endPointer;\n}\n/*  Access a pointer to the first element\
    \  */\ndouble* begin() {\n\treturn data;\n}\n/*  Access a pointer to the element\
    \ after last  */\ndouble* end() {\n\treturn endPointer;\n}\n\"\"\"\n```\n\nSome\
    \ of these methods return “const pointers”. Recall from Chapter 11 that you can\
    \ use `const` with a pointer much as you can with references. `const double*`\
    \ p means that p points to a `double` but you can't change the value pointed to\
    \ using p. So you can think of this as being very like a `const` reference.\n\n\
    Our Matrix function has two member functions called `begin()`. On a `const` Matrix\
    \ we want `begin()` to return a `const` pointer to the data. On an ordinary Matrix\
    \ we want `begin()` to return an ordinary pointer to the data. This will ensure\
    \ that you can't get round the `const` nature of a `const` Matrix by obtaining\
    \ a non `const` reference to data inside the Matrix.\n\nTo ensure that we have\
    \ the `begin` function return the correct type of pointer, we need two `begin`\
    \ functions. One is called for a `const` Matrix and the other is called for an\
    \ ordinary Matrix.\n\nExtra work like this is often required when working with\
    \ `const`. It has to be said, this is one of those occasions where you wonder\
    \ if you are working for the compiler rather than it working for you."
