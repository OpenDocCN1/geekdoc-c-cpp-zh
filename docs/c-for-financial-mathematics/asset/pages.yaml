- pgno: 88
  md: "# ### 4.8.1 Short circuit evaluation\n\nThe expression `lhs && rhs` evaluates\
    \ to true if both `lhs` and `rhs` evaluate to true. To improve efficiency, C++\
    \ doesn't even bother evaluating the expression `rhs` if `lhs` isn't true. This\
    \ is usually just what you want to happen. However, if evaluating the expression\
    \ `rhs` actually calls another function, you may be surprised that this function\
    \ isn't always called.\n\nSimilarly `lhs || rhs` doesn't evaluate `rhs` if it\
    \ is already known that `lhs` is true.\n\nAs an example, try the following code:\n\
    \n```\n```c++\nbool test1() {\n    cout << \"In test1\\n\";\n    return false;\n\
    }\n\nbool test2() {\n    cout << \"In test2\\n\";\n    return true;\n}\n\nint\
    \ main() {\n    bool value = test1() && test2();\n    cout << \"Value \" << value\
    \ << \"\\n\";\n    return 0;\n}\n```\n```\n\nYou will see that the function test2\
    \ is never called.\n\n# ### 4.8.2 The ternary operator\n\nThe operator `*` as\
    \ in the expression `a*b` is called a binary operator because it takes two arguments.\
    \ The operator `++` on the other hand is called a unary operator.\n\nC++ also\
    \ contains one operator which takes three arguments and which so is known as *the\
    \ ternary operator*.\n\nThe ternary operator is, in essence, a short cut for writing\
    \ if statements. The syntax is:\n\n```\n`<test expression> ? <value if true> :\
    \ <value if false>`\n```\n\nAs an example, here is a program that uses the ternary\
    \ operator to compute the maximum of two numbers:\n\n```\n```c++\nint max(int\
    \ a, int b) {\n    return a>b ? a : b;\n}\n```\n```"
  merge: -1
  img_proc: true
