  md: 'The build configuration that we have used performs some additional checking
    of our code on top of that required by **C++**.


    In particular, we have configured our builds to fail if there is a compiler warning.
    We have also set the warning level so that a number of common **C++** bugs will
    be caught automatically.


    The process of looking through your code for bugs is called *static analysis*.
    By contrast, *dynamic analysis* would examine what happens to your code when it
    is actually running.


    You might want to use more static analysis than we have used in this book. It
    is possible to ask the compiler to perform a higher level of static analysis than
    we have done. The danger is that the compiler will find some false positives.
    In other words the compiler may refuse to accept code you know does not contain
    any bugs. When this happens, all compilers give you a way of temporarily disabling
    a warning so that you can ignore these false positives. In practice it is a good
    idea to use more warnings and disable the warnings when necessary.


    For example, writing a class without a virtual destructor is valid **C++** code.
    For this reason compilers do not complain if you omit a virtual destructor. However,
    in practice your code is likely to contain memory leaks if you ever extend a class
    that doesn''t have a virtual destructor. Therefore, if your compiler allows this,
    you should ask it to issue a warning whenever you extend a class without a virtual
    destructor. On the rare occasions when you know this isn''t a problem, you can
    suppress the warning.


    # ### 15.4.8  Memory-leak detection


    Memory leaks are difficult to detect using ordinary unit tests. The reason is
    that memory leaks are normally only problematic once software has been running
    for a considerable period of time.


    A good unit testing framework for **C++** should be able to help with this by
    checking that the total memory used before and after each of your tests remains
    the same. In addition, there are numerous tools that you can use to help detect
    memory leaks in your software.


    # ### 15.4.9  Profiling tools


    If you have performance problems in your software then *profiling* tools can help.
    These allow you to find out how much time the computer spends executing different
    parts of your code. This then allows you to concentrate your efforts at improving
    performance on the areas of the code that are actually causing problems.


    A mistake that many beginner programmers make is to assume that all code is performance
    sensitive. This is not true at all. If you use a profiler, you will discover that
    most (perhaps 99% or more) of the CPU effort is spent executing only a few performance-critical
    functions. This means that if you'
