  md: "# 20.3.3 Implementing Task\n\nIf we wish to use our Executor class, we will\
    \ need to write an implementation of Task to perform the Monte Carlo pricing.\
    \ We will create a number of identical tasks, give them to the executor, and then\
    \ compute the average result. The main work required by our task instances is\
    \ to call singleThreadedPrice.\n\n```\nclass PriceTask : public Task {\n    public:\n\
    \        /* Amount of random numbers to skip */\n        int taskNumber;\n   \
    \     int nScenarios, nSteps;\n        const ContinuousTimeOption& option;\n \
    \       const MultiStockModel& model;\n        /* Output data */\n        double\
    \ result;\n\n        PriceTask(\n            int taskNumber,\n            int\
    \ nScenarios,\n            int nSteps,\n            const ContinuousTimeOption&\
    \ option,\n            const MultiStockModel& model)\n            :\n        \
    \    taskNumber(taskNumber),\n            nScenarios(nScenarios),\n          \
    \  nSteps(nSteps),\n            option(option),\n            model(model) {\n\
    \        }\n\n        void execute() {\n            result = singleThreadedPrice(taskNumber,\n\
    \                nScenarios, nSteps, option, model);\n        }\n};\n```\n\nOne\
    \ thing to notice about our design is that our task does not share data with other\
    \ tasks except for the const references. Thus we are following the design recommendation\
    \ given earlier to minimise the amount of communication between the threads.\n\
    \nWriting this Task class is rather tedious. It would be nice to use lambda functions\
    \ instead. Doing this is left as an exercise."
