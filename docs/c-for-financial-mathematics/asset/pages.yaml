    # 16.5.4 Move operators


    In $C++11$, $C++$ was improved so that you can reduce the amount of copying of
    memory that is performed when you return data by value. This is a performance
    enhancement technique called **RValue** references. As a result, to write as efficient
    a `Matrix` implementation as possible, one should use this technique. Doing this
    involves writing a *move constructor* and a *move assignment* operator.


    Whenever you write a class that manages its own memory, you might want to consider
    whether you should write a move constructor and move assignment operator for maximum
    efficiency. For this reason, in $C++11$ one can say that there is a rule of five.


    In practice, as a financial mathematician, your expertise is probably in writing
    mathematical algorithms and not in writing data structures. For this reason we
    will not discuss how to implement move constructors and move assignment operators
    in this book.


