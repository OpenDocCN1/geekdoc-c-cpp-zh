    # ## 20.5 Summary


    We have learned about the C++ threading library. In particular we have learned
    about the following C++ threading classes:


    +   1. thread,

    2. mutex

    3. condition_variable

    4. lock_guard (used with `mutex`)

    5. `unique_lock` (used with `condition_variable`)


    We have also learned some important design patterns.


    +   - The resource acquisition is initialisation pattern.

    - The command pattern

    - The pipeline pattern


    We have used these techniques to improve the performance of our Monte Carlo pricer.
    We have learned that while, in this case multi-threaded code was worth the extra
    effort, this is not always the case. Multi-threaded code is harder to write and
    test. There is a danger of race conditions and deadlocks.'
