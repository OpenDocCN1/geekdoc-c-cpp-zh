    Another important player in financial markets is the ordinary pensions investor.
    Each individual is an insignificant player, but together the pensions market is
    enormous. Most people do not have either the qualifications or interest to devise
    an investment strategy based on a careful analysis of company performance. Instead
    they hire someone else to manage their investments on their behalf: a pension
    fund manager. A pension fund manager is a member of the *financial services* industry.
    They make their money by performing a service for some other investor, specifically
    dealing with all the difficult investment questions on behalf of the pension fund
    members.


    In actual fact, a pension fund manager will use other members of the financial
    services industry to help them. For example, one standard investment strategy
    is to “diversify” your wealth across a large number of stocks in the expectation
    that one’s wealth will then grown in accordance with the stock market as a whole.
    This should be less risky than investing in individual stocks. This investment
    approach is based heavily on the mathematical theory of Markowitz [11]. A pension
    fund manager is likely to put money into investment funds that invest in large
    numbers of stocks and track market indices. Whoever manages these tracker funds
    will, of course, charge a fee for their service.


    Notice how impractical it would be for most individuals to manage their pension
    funds without any help from the financial services industry. Following a diversification
    strategy where one chooses hundreds of different stocks to invest in and monitoring
    the performance of one’s fund is a full-time job in itself. Most people are glad
    to pay someone else to do it for them.


    In addition to ordinary individuals investing for their retirement, there are
    high-net-worth individuals. These are people such as dot-com millionaires and
    royals who have vast amounts of money to invest but have neither the experience
    nor the inclination to play the stock market themselves. They too pay for financial
    services and often use strategies such as investing in hedge funds to manage their
    money. Hedge funds are simply investment funds which use more sophisticated investment
    strategies than basic diversification. They aim to produce investments that they
    hope will be appealing to their clients. Speculators, pension investors, high-net-worth
    individuals, investment funds, and hedge funds are all in the business of trying
    to invest wisely to make a high return. They will follow quite different strategies
    according to how much risk they are willing to take, and their different theories
