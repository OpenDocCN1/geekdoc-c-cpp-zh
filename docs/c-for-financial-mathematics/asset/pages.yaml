  md: 'This solution may seem simpler than the solution we gave using polymorphism.
    However, it suffers from a number of significant problems.


    +   * You need to write clear documentation of how to use your template classes.
    In this documentation you will need to list all the functions you expect to be
    present in your template parameter classes and their return types. By contrast,
    an interface class automatically documents this information. In addition the compiler
    checks that the interface is correct.

    * All the code must go in the header file. This makes encapsulation more challenging
    and increases the coupling between your files. One practical consequence of this
    is that your code will take longer to build.

    * The compiler error messages that appear when you make a mistake with templates
    are very confusing. In particular the compiler will often tell you that the error
    is in a library file when it is in fact in your code. See Exercise 17.3.1 for
    an example of this.

    * When you use templates, the compiler only finds the errors when the template
    is actually used. With object orientation, the errors are found when the code
    is written.


    Templates can work well in mature, stable, and carefully designed and documented
    libraries such as the C++ standard library and Boost. They are less effective
    in financial software that has to be constantly adapted to changing business requirements.


