    The syntax is essentially the same as for all other constructors. Rules for a
    copy constructor are as follows.


    +   * A copy constructor takes a single parameter, a **const** reference to another
    instance.

    * It is not marked as **explicit** despite only taking one parameter.

    * It performs whatever tasks are necessary to copy the data from the other reference.


    In our example the **assign** function is used by both the copy constructor and
    the assignment operator. This is a common pattern, you''ll often find that the
    **operator=** implementation and the copy constructor have a lot of code in common.


    # 16.5.3 The easy way to abide by the rule of three


    The copy constructor and assignment (**=**) operator won''t be called unless either
    we call them explicitly or we use pass by value with instances of our class.


    However, we normally pass large objects by reference, so do we really need a copy
    constructor and assignment operator at all? The answer, usually, is no.


    Therefore, rather than writing a complex implementation of functions that will
    never be used, a sensible approach is to implement a **private** copy constructor
    and a **private** assignment operator. Rather than have the implementation of
    these functions do anything, they can simply **ASSERT** that they are never called.
    If you prefer, you can even simply fail to provide an implementation of the functions.
    The code will still compile and run since you actually only need to implement
