  md: '# Chapter 3


    # Functions


    A function in C++ is a piece of code that you can call to perform some task. We
    have already seen the function `pow` that raises one number to a given power.
    The cmath library (`http://www.cplusplus.com/reference/cmath/`) contains various
    other mathematical functions.


    As we shall see, functions in C++ are used for much more than just computing mathematical
    formulae. In C++ all software should be divided into functions, each of which
    performs a particular task. One builds up complex functions by calling simpler
    functions. For example, you will write a `blackScholesCallPrice` function which
    will price a Call option using the Black-Scholes formula (Equation (A.6)). This
    in turn will call a `normcdf` function to compute the cumulative distribution
    function of the normal distribution.


    On a larger scale, a bank''s trading system will contain a function to value the
    bank''s portfolio. This will call functions to: read the current trading position
    from a database; extract current market data from some source such as Bloomberg
    or Reuters; price the many different types of traded product. Each of these tasks
    is itself very complex and is coded by breaking it down into lots of small specialist
    functions.


    In the introduction to this book we discussed the need to write scalable and maintainable
    programs. One of the key ingredients is the technique of breaking a problem into
    simpler pieces, each represented by its own function.


    # 3.1 The C++ function syntax


    Consider the mathematical function:


    `compoundInterest : R x R x Z → R`


    given by


    `compoundInterest(P, i, n) = P (1 + i/100)^n − P.`


    Here *P* is the principal, *i* is the annual percentage rate, and *n* is the number
    of years. To formally specify a mathematical function, you need to provide the
    domain and the codomain as well as the formula to use.'
