    # Tip: Less is more


    The slogan “Less is more” was first coined by the architect Mies van der Rohe.
    He used it to explain his pared-down approach to architecture and design. The
    slogan applies equally well in many areas of design. Most people prefer the sleek
    and simple interface of an iPad to the complex interface of a standard PC.


    Less is more applies particularly well to programming. Using every available feature
    of a language can make your software harder to understand. The Java language was
    deliberately designed to have less features than C++ and so is easier to learn
    and debug. Similarly, the kernel of the Linux operating system is written in C
    not C++, because it is easier to reason about C programs than C++ programs.


    It is a good idea to increase your knowledge of the C++ language. It is also a
    good idea to show restraint when you decide which features of C++ to use.


