    # ## 16.7 Array Programming


    # ### 16.7.1 Implementing an efficient matrix class


    We have not attempted to write the most efficient matrix class possible. We have
    written the simplest C++ code that is likely to work. In practice it may be possible
    to write a faster matrix class, but doing so requires using techniques that are
    specific to the operating system you are using. Naturally enough, the fastest
    possible class will be carefully tuned to the hardware available.


    Let us list some techniques that can be used to make a matrix class faster.


    +   (i) *Vectorisation.* Most CPUs contain special instructions for performing
    repetitive tasks of the type that occur frequently in linear algebra and in Monte
    Carlo pricing. If our code takes advantage of these instructions it may run faster.
    This technique is called vectorisation. As an example the **memset** function
    may run faster than a simple loop that sets the values of memory directly by using
    these special CPU instructions. Modern compilers can vectorise a lot of your code
    automatically. However, for optimal performance you may wish to use either assembly
    language or special compiler instructions in order to take advantage of vectorisation.


    +   (ii) *Careful memory management.* It can pay to think in detail about how
    memory is manipulated by a computer. The actual layout of memory on a modern computer
    is complex. Some data is stored on the hard drive,'
  merge: -1
