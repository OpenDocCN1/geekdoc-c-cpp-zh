  md: '# ### 1.3 Compiling and running the code


    Running C++ code isn''t as easy as you might like. The reason for this is that
    C++ is what is called a “compiled language”.


    The chip inside a computer that does most of the work is called the CPU (central
    processing unit). It does not know the C++ language or indeed any computer language
    which is pleasant to program in. The CPU speaks a language called assembly language,
    also known as machine code . In machine code, all instructions are coded up as
    a sequence of numbers. Each number is a code word for some action the CPU should
    take. Programming in machine code directly is completely unbearable. What is worse,
    different CPUs may use different versions of assembly language, so you have to
    rewrite your code for different computers.


    To get around this, one programs in “higher level languages” which are written
    in ways that humans can understand. At some point, the program’s instructions
    need to be converted to machine code.


    In an “interpreted” language, the instructions are converted to machine code every
    time they are executed. MATLAB and Python are examples of interpreted languages.


    In a “compiled” language, the instructions are converted to machine code before
    the program is ever run. This process is called compilation. C++ is a compiled
    language, so you must compile your code before you can run it.


    Historically, the advantage of compiled languages was that they run faster. The
    reason for this is that converting things to machine code takes time. If you do
    this every time the code is run, it will necessarily run slower. The big disadvantage
    was that you have to recompile your code if you change the type of computer you
    want to run it on.


    These days, computers are so fast that this advantage is not really relevant any
    more. Modern languages can be compiled very fast and even use “just in time compilers”
    that observe how the software is being used by the user and perform optimisations
    based on this. This is one of the reasons why the claim C++ is faster than languages
    such as Java and C# is a bit of a myth.


