    once** and then **\#included** the header twice.


    Another rule you should follow is to never have circular dependencies through
    **\#include**. For example, two header files should not **\#include** each other.


    Technically **\#pragma once** isn''t part of the C++ standard. However, most compilers
    understand this command and I recommend you use it.


    The phrase **\#pragma once** may be hard to remember since there is no such English
    word as "pragma". It is actually short for the word "pragmatic" which is itself
    just a fancy word for practical. So **\#pragma once** is just a practical fix
    that isn''t really a part of the C++ standard.


    If you are a strict adherent to the C++ standard, an alternative way to solve
    the same problem is to use the following recipe: For each header file pick a unique
    random name (e.g., G4569327457263475698023452376519876247) and then start and
    end the header file as follows:


    ```

    ```cpp

    #define G4569327457263475698023452376519876247

    #define G4569327457263475698023452376519876247

    ... rest of code ...

    #endif

    ```

    ```


    You''ll see this technique (which is called an *include guard*) used in many C++
    libraries. Naturally, many library authors want to write code that is as portable
    as possible, so they stick to the letter of the C++ standard. That''s why they
    use this more fiddly technique whereas you can get away with the easier **\#pragma
    once**.


    # ## 5.4.3 Information hiding


    You shouldn''t declare *all* your functions in your header files. You should only
    declare the functions you want other people to use.


    It is good practice to write lots of small helper functions. However, making these
    part of your library is confusing for users of your library. Your users will see
    the .h files you wrote as containing the definition of what your library does.
    By limiting the amount of information in this file, you make life easier on your
    users.


    It also gives some other advantages. The moment you have released a function as
    part of a library you can never change it except to fix bugs! This is because
    someone else might already be using it. The less you give away in your header
    file, the less potential there is to write functions you have to spend the next
    ten years supporting.


    **Example 1:** If you misspell the name of a function in a library and then give
    it to your users, you have to stick with that misspelling forever.'
