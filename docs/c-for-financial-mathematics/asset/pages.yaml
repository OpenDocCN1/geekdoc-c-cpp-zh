    casting an `int` to a `float` is risky, since the `float` data type uses binary
    scientific notation with only a handful of significant figures. So an `int` cannot
    be represented precisely using a `float`.


    Casting a `bool` to an `int` converts `true` to 1 and `false` to 0. Casting an
    `int` to a `bool` is possible too, but will normally result in a loss of information.


    Casting a `char` to an `int` converts a character to the number used to represent
    that character on your system. This is not a very useful feature unless you are
    interested in performing text processing. One of the exercises at the end of the
    chapter suggests you convert text to upper case by using this feature.


    Very often, the C++ compiler will automatically convert between one data type
    and another for you. For example the following code works as you expect without
