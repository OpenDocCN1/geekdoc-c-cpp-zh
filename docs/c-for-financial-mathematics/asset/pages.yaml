    true.


    To speed up performance of a real system, all ASSERT checks are skipped when running
    the release build.


    This needs to be a macro because it prints out the line where the assertion failed.
    You can''t do this with functions.


    Here is an example of using ASSERT to verify that the input arguments to a function
    are valid. The function below will fail immediately if you attempt to take the
    square root of a negative number.


    ```

    ```

    double safeSqrt( double x) {

    ASSERT( x >= 0);

    return sqrt( x);

    }

    ```

    ```


    # ### 6.3.2 The ASSERT_APPROX_EQUAL macro


    When writing numerical methods, you don''t often want to check if two numbers
    are exactly equal. You normally want to check if they are approximately equal.
    This is because numerical methods are only approximate and calculations always
    involve rounding errors.


    ASSERT_APPROX_EQUAL(x,y,tol) throws an error if x and y are not within tol of
    each other. Here is an example of ASSERT_APPROX_EQUAL being used to test the output
    of norminv


    ```

    ```

    static void testNormInv() {

    ASSERT_APPROX_EQUAL(norminv(0.975), 1.96, 0.01);

    ```


