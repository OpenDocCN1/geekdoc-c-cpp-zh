  md: "# ### 20.3.1 Random number generation with multiple threads\n\nA naive random\
    \ number generator uses a global variable to store the current state of the random\
    \ number generator. To use this in a multi-threaded program, we would need to\
    \ add a mutex to protect this global variable. This is potentially inefficient\
    \ since multiple threads will be constantly locking and unlocking the same mutex.\
    \ This will mean that the cache of each processor will be frequently written to\
    \ main memory.\n\nA better approach is to use a separate random number generator\
    \ for each thread. So long as we obtain appropriate seeds for the random number\
    \ generators, it should be possible to ensure that the numbers generated for each\
    \ thread are independent.\n\nTo implement this approach, we will want to pass\
    \ around the random number generator to use whenever we call a function that generates\
    \ random scenarios. You may recall that the name of the class we are using to\
    \ generate random numbers is the class **mt19337**.\n\nFor this reason, the functions\
    \ such as **randn** and **randuniform** in **matlib** have been updated to allow\
    \ you to pass in the random number generator you would like to use:\n\n```\n```\n\
    /* Create uniformly distributed random numbers */\nMatrix randuniform ( int rows,\
    \ int cols );\n/* Create normally distributed random numbers */\nMatrix randn(\
    \ int rows, int cols );\n/* Create uniformly distributed random numbers */\nMatrix\
    \ randuniform(std::mt19937& random,\n                   int rows, int cols);\n\
    /* Create normally distributed random numbers */\nMatrix randn(std::mt19937& random,\n\
    \             int rows, int cols);\n```\n```\n\nSimilarly, we need to update the\
    \ various **generatePricePaths** functions so that they take in a **mt19937**\
    \ instance. Here is the change to the declaration of one such method on **MultiStockModel**.\n\
    \n```\n```\nMarketSimulation generatePricePaths(\n    std::mt19937& rng,\n   \
    \ double toDate,\n    int nPaths,\n    int nSteps) const;\n```\n```\n\nIn addition,\
    \ **MultiStockModel** has a function that tells us how many random numbers it\
    \ needs to generate a given stock price.\n\n```\n```\n/* How many random numbers\
    \ are needed\n   to generate the given paths? */\nlong long randSize(long long\
    \ nPaths,\n                   long long nSteps) {\n```\n```"
