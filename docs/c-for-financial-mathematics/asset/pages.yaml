    # **Tip: You Aren''t Going to Need It (YAGNI)**


    One of the slogans of extreme programming is “You Aren''t Going to Need It”. Many
    programmers have a tendency to write the most general software they possibly can.
    However, doing this can make your design more complex and harder to use. Often
    the extra generality goes unused. There is clearly no point writing code that
    will never be used.


    You might be tempted to write a template version of our **matrix** class so that
    we can store matrices of **double**, **float** or more usefully complex numbers.
    However, the YAGNI slogan advises that you shouldn''t bother doing this until
    you actually have a use for these classes.


    In general, whenever you feel tempted to use templates, remember the YAGNI slogan
    and ask yourself if it is really going to be worth the trouble and complexity.


    # 17.3 Templates as an alternative to interfaces


    Recall that we introduced interface classes so that we could generalise our Monte
    Carlo pricer, so that it can work equally well with any option. We can solve this
    problem in a slightly different way using templates.


    We can write a **monteCarloPricer** function that uses template to price options
    of any class using any model so long as:


    +   (i) The option has a **double** valued field called **maturity**.


    +   (ii) The option has a function **payoff** that takes the stock price at maturity
    as a parameter and returns the payoff of that option.


    +   (iii) The model has a function **generateRiskNeutralPricePath** that returns
    a vector representing a simulated stock path in the risk-neutral measure. This
    function must take as parameters: the time up to which we wish to simulate the
    stock price path; the number of steps.


    So long as all of these requirements are met, the following code will be able
    to price the option using the given model.'
