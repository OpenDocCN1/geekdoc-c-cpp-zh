    # 18.13   Summary


    The standard template library is a powerful tool which will allow you to write
    more sophisticated programs with ease. Key points we have covered are:


    +   * The **typedef** keyword allows us to abbreviate complex type names. A convention
    for naming **shared_ptr** types is particularly convenient.

    * The **auto** keyword allows you to avoid typing the full name of a class when
    the compiler can deduce it for you. It is possible to combine **auto** with **const**
    and **&**.

    * Classes can contain member types. This is particularly useful when writing template
    algorithms.

    * A container is any class that stores data and returns iterators when you call
    **begin** and **end**. There is a special syntax for looping through containers
    using **for**.

    * C++ contains numerous container classes that make it easy to store data. They
    can also act as building blocks for implementing efficient algorithms. All containers
    behave in a broadly similar manner. There are clear conventions for naming functions
    such as **size**, **insert**, **remove**, **begin**, and **end**.'
