    # ### 12.3.1 What have we gained?


    So far we seem to have only made things more complicated. But we can now easily
    write the following classes:


    +   - CallOption,

    - DigitalCallOption,

    - DigitalPutOption,

    - UpAndOutOption.


    If all of them extend ContinuousTimeOptionBase, we won’t have to write getMaturity,
    getStrike, etc., methods for any of them.


    This gets rid of a tremendous amount of repetitive code. Notice that the very
    idea of interfaces, with a fixed set of methods that must be implemented by all
    classes, naturally leads to somewhat repetitive code. You should use inheritance
    to avoid this kind of code repetition.


    # ### 12.3.2 Terminology


    Various terms are used to describe the relationship between PutOption and ContinuousTimeOptionBase.


    +   - ContinuousTimeOptionBase is termed a superclass or a parent class of PutOption.

    - PutOption is termed a subclass or a child class of ContinuousTimeOptionBase.

    - PutOption extends from ContinuousTimeOptionBase.

    - PutOption inherits from ContinuousTimeOptionBase.'
