    \    double* endPointer;\n```\n```\n\nOur matrix class will allow the user to\
    \ read the number of rows and columns but not change them. So we add the following\
    \ data access methods in the header file:\n\n```\n```\n    /* The number of rows\
    \ in the matrix */\n    int nRows() const {\n        return nrows;\n    }\n\n\
    \    /* The number of columns in the matrix */\n    int nCols() const {\n    \
    \    return ncols;\n    }\n```\n```\n\nThese methods are inlined—that is, we write\
    \ the function definition inside the class declaration. Since we'll make heavy\
    \ use of the Matrix class it is important that we take advantage of some inlining.\n\
    \nWe have already stated that the value of cell $(i,j)$ is stored in the memory\
    \ location $data + (j * nRows) + i$. Let's supply get and set functions so that\
    \ the user can read the value of a given cell and change the value of a cell.\n\
    \n```\n```\n    /* Retrieve the value at the given index */\n    double get( int\
    \ i, int j ) const {\n        return data[ offset( i, j ) ];\n    }\n\n    /*\
    \ Set the value at the given index */\n    void set( int i, int j, double value\
    \ ) {\n        data[ offset( i, j ) ] = value;\n    }\n```\n```\n\nThese functions\
    \ both take advantage of the function offset. This function performs the calculation\
    \ of whereabouts in memory the cell $(i,j)$ is stored relative to the point data."
