  md: "# ## 12.3 Inheritance\n\nInheritance is a powerful technique for reusing code\
    \ in C++. It is a technique specifically designed to make it easier to implement\
    \ interfaces. To give an example of how inheritance can be useful, let us consider\
    \ an example of an interface which at first sight seems quite time consuming to\
    \ implement.\n\nThe following interface defines a *ContinuousTimeOption*.\n\n\
    ```\n```\nclass ContinuousTimeOption {\npublic:\n    /* Virtual destructor */\n\
    \    virtual ~ContinuousTimeOption() {};\n    /* The maturity of the option */\n\
    \    virtual double getMaturity() const = 0;\n    /* Calculate the payoff of the\
    \ option given\n    a history of prices */\n    virtual double payoff(\n     \
    \   const std::vector<double>& stockPrices\n    ) const = 0;\n    /* Is the option\
    \ path-dependent?*/\n    virtual bool isPathDependent() const = 0;\n};\n```\n\
    ```\n\nA continuous time option has a maturity and we can compute the payoff come\
    \ maturity by looking at the price path up to maturity. This is the idea captured\
    \ by the *ContinuousTimeOption* interface.\n\nThere are three functions to implement\
    \ in *ContinuousTimeOption*. Most of the implementation will be the same for a\
    \ *PutOption*, a *CallOption*, a *DigitalPutOption*, etc. *Inheritance* gives\
    \ a way of implementing methods for a number of classes at once.\n\nTo use inheritance,\
    \ one begins by defining a so-called \"base class\" that defines functions we\
    \ wish to reuse. We will call our base class *ContinuousTimeOptionBase*. Here\
    \ is a declaration of an appropriate base class. We're using the inlining technique\
    \ here to implement appropriate get and set methods.\n\n```\n```\nclass ContinuousTimeOptionBase\
    \ :\n    public ContinuousTimeOption {\npublic:\n    virtual ~ContinuousTimeOptionBase()\
    \ {}\n    double getMaturity() const {\n        return maturity;\n    }\n    void\
    \ setMaturity(double maturity) {\n        this->maturity = maturity;\n```\n```"
