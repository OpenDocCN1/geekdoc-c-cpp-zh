    \ specifying the date as a **double**. We'll measure dates in years since 0 A.D.\
    \ So January the first 2014 would be represented as 2014.0. You wouldn't do this\
    \ in real code, but we don't want to waste energy thinking about leap years and\
    \ how many days September hath. When you come to price real option contracts,\
    \ you will want to be a little more careful. You will then want to use a library\
    \ containing a proper date class.\n\nWe now define a separate class for the option\
    \ contract. We'll create a class CallOption which contains a strike and a maturity\
    \ but does not contain any details about the current market data. The idea behind\
    \ this design is that we can use the same BlackScholesModel to price either a\
    \ CallOption or a PutOption. Note that the CallOption does not change as the market\
    \ data changes. This reflects reality: a call option *contract* is unchanged by\
    \ the market even though its price may vary.\n\n```\nclass CallOption {\npublic:\n\
    \tdouble strike;\n\tdouble maturity;\n\n\tdouble payoff( double stockAtMaturity\
    \ ) const;\n```"
