  md: "Using the `new[]` operator raises a problem. When will `delete[]` be called?\
    \ We need to ensure that when our **Matrix** itself is removed from memory, someone\
    \ calls `delete[]`.\n\nOur **Matrix** will be removed from memory under the following\
    \ circumstances:\n\n+   (i) If the **Matrix** was created by **new**, it will\
    \ be removed from memory when **delete** is called.\n\n+   (ii) If the **Matrix**\
    \ was created by **new []**, it will be removed from memory when `delete[]` is\
    \ called.\n\n+   (iii) If the **Matrix** was created on the stack as a local variable,\
    \ it will be removed from memory when the local variable is no longer needed (i.e.,\
    \ when it goes out of scope).\n\n+   (iv) If the **Matrix** is a member variable\
    \ of another object, this will happen when the containing object is deleted.\n\
    \nWe need a function that is called under precisely these circumstances. That\
    \ is what a destructor is.\n\nTo write a destructor for your class you must follow\
    \ these rules.\n\n+   (i) A destructor is declared and defined just like a function\
    \ except...\n\n+   (ii) It must have the same name as the class except with the\
    \ the addition of a tilde `~`.\n\n+   (iii) It must have no return value (not\
    \ even **void**).\n\n+   (iv) It must have no parameters.\n\n+   (v) It must not\
    \ be **const**.\n\nHere is the destructor for **Matrix**. It is inlined, so we\
    \ have both declared it and defined it in the header file.\n\n```\n`~Matrix()\
    \ {\n    delete[] data;\n}`\n```\n\nYou don't have to inline the destructor, you\
    \ can write separate declarations and definitions if preferred as\n\n```\n`//\
    \ declaration\nclass Matrix {\npublic:\n    ...\n    ~Matrix();\n};`\n```"
