    # 6.1 A testing framework for C++


    Since C++ has no built-in support for unit testing, we’ll have to write our own.
    One might argue that it would be more sensible to use a testing framework that
    somebody else has written. There are lots of choices, such as the Boost Test Library
    (http://www.boost.org), Google Test (Google it!), cppunit, and many others.


    Unfortunately these testing frameworks are designed for people who can already
    program in C++ and so won’t be put off by their odd syntax. This makes them inappropriate
    to use in an introductory C++ course.


    Instead, I’ve written a very simple testing framework for use in this book. By
    the end of the book, you will be able to download and use the testing framework
    of your choice without too much difficulty.


    Download FMIbib6 and you will see that it contains a header file called testing.h.
    This file should be incomprehensible to you at the moment as it contains various
    C++ macros.


    # 6.2 Macros


    A macro is a special command to the C++ pre-processor which allows you to avoid
    repeated typing. A classic example is the MAX macro:


    ```

    #define MAX(a,b) (((a)>(b)) ? (a) : (b))

    ```


    This definition means that every time the text MAX(a,b) appears in the code, it
    should be replaced with (((a)>(b)) ? (a) : (b)). This expression computes the
    maximum using the ternary operator (see Section 4.8.2 for a reminder of what the
    ternary operator is). The expression contains lots of brackets which look unnecessary,
    but which are there because you’re allowed to type complex expressions such as
    like MAX(3*7, 3+5). Having the brackets in place guarantees everything behaves
    as you expect.


    The pre-processor blindly expands macro definitions. This means that you can write
    “fake functions” like MAX that are really just shorthand ways of writing out a
    repetitive chunk of code.'
