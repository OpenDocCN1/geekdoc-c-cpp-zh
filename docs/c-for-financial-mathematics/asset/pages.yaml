  md: '# 1.4  Understanding the example code


    If you have run the example code on page 6 it will ask you to supply a principal,
    interest rate and duration of an investment. It then computes the interest that
    will be accrued.


    The mathematics is just compound interest. If the principal is P, the interest
    rate is i per annum, and the duration of the investment is T, then the interest
    accrued will be P(1+i)^T−P. Note that we''re using i here for an interest rate
    compounded once per year.


    The first few lines of code are all what is called “boiler plate” code. This is
    a term for boring code that you have to write for technical reasons but which
    doesn’t do much. It is called “boiler plate” because boilers often come with a
    steel plate attached saying who made them and perhaps containing some warnings
    about how to operate the boiler. Nobody ever reads this, but it has to be there
    “for legal reasons”. The same is true for the first few lines of our code. Its
    dull, and for the time being we’ll skip it.


    The first interesting line of code is:


    ```

    // Interesting code starts

    ```


    This is an example of a comment. Once you write //, C++ ignores the rest of the
    line. This allows you to put in helpful comments to guide others through your
    code.


    The last interesting line of code is


    ```

    /* Interesting code ends */

    ```


    C++ also ignores any text sandwiched between the character combinations /* and
    */. It even ignores new lines. For this reason this is called a multi-line comment.


    The first lines that actually do anything are the lines:


    ```

    int principal;

    double interestRate;

    int numberOfYears;

    ```


    These lines tell the computer to make room in memory for three variables called
    principal, interestRate, and numberOfYears.


    In order to work out how much space it will need to store the data, C++ needs
    to know what sort of data we will store in these variables. We will store an integer
    in the variable principal and in the variable numberOfYears. We will store a real
    number in the variable interestRate.


    The phrase “int principal;” means: “please make room in memory for a variable
    called principal that will store an integer”.$^{6}$'
