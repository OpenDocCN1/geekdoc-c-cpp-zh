    # Kolmogorov’s axioms


    For a pure mathematician, intuitive notions such as “chance” have no meaning.
    To do rigorous mathematics, one needs axioms for probability theory from which
    to rigorously deduce results. Kolmogorov’s axioms provide this basic foundation.
    One advantage of the mathematical approach to problem solving is that the same
    mathematical model can often be applied to different phenomena. For example, the
    theories of gravity and electricity both obey inverse square laws and so can be
    modelled in the same way. It is useful to think of the mathematical theory of
    probability as a purely abstract theory which can then be applied to either model
    chance events (using probability as a $\mathbb{P}$-measure) or model prices (using
    probability as a $\mathbb{Q}$-measure). Probability theory can also be applied
    to study subjects which appear to have nothing to do with chance. For example,
    probability theory can be used to study integration.


    The mathematical details of Kolmogorov’s axioms can be found in any rigorous introductory
    book on probability. Speaking loosely, a probability model is defined to be a
    function from a set of events to the interval [0, 1], which assigns the “probability”
    to each event. Note that mathematically, this model is simply a function. Interpreting
    this function in terms of chance or in terms of pricing is outside the scope of
    strict mathematics. This function can be seen as a measure of the “size” of a
    set of events, with larger sets being those with a higher probability of occurring.
    The mathematical theory which makes this precise is called measure theory, and
    Kolmogorov’s axioms are stated in terms of measure theory. This is where the word
    measure comes from when we discuss the $\mathbb{P}$-measure and the $\mathbb{Q}$-measure.


    # A.4 Modelling stock prices


    What would be a good $\mathbb{Q}$-measure probability model for stock prices and
    what would be a good $\mathbb{P}$-measure model?


    One idea is to assume that the stock price moves up and down by a normally distributed
    amount at each time step. If we choose a time step $\delta t$ we can model a stock
    price by assuming that it starts at a given level $S_0$ at time 0, and then model
    the values at subsequent times $\delta t$, $2\delta t$, $3\delta t$, and so forth
    using the equation:


    ```

    $S_{t+\delta t}=S_{t}+X_{t}$

    ```'
