    # 18.9.2 How an unordered_map works


    Let us suppose that you wish to store approximately 100 key-value pairs so that
    we can look up the value given the key as quickly as possible. If you could somehow
    quickly associate a unique number between 0 and 99 to each key, then you could
    store your data in a **vector** instead of a **map**. Simply take a key, find
    the associated number, then read the element at the given index in the **vector**.


    The problem is that we can’t associate a unique number to a key in a straightforward
    way. However, one idea that *almost* works for a string is to take all the character
    codes in the string and add them up. This will give you a number for each string
    which we will call the *hash code*. The hash code is almost unique in the sense
    that two random strings aren’t very likely to have the same hash code.


    If you then take the remainder after dividing the hash code by 100, you will have
    a number between 0 and 99. Let us call this the *bucket id* of the string.


    We can now group all the keys we want to use into *buckets*. Two strings are in
    the same bucket if and only if they have the same bucket id.


    In an unordered map, one stores a **vector** of bucket objects. There is a bucket
    for each bucket id. The bucket objects contain a list of all the key-value pairs
    where the key happens to have the given bucket id. The situation is depicted in
    Figure 18.5. This shows an unordered map with 10 buckets, so the bucket id has
    been computed by taking the remainder on dividing the hash code by 10. In other
    words, the bucket id is just the last digit of the hash code. The hash codes have
    been computed by adding up the character codes for each letter in the key as described
    above.


    To search for an element in an unordered map given a key, you proceed as follows.


    +   1. Compute the hash code of the key.


    +   2. Compute the bucket id by dividing the hash code by the number of buckets
    and taking the remainder.'
