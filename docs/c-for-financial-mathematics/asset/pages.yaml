  md: '# # Chapter 2


    # ## *Basic Data Types and Operators*


    Whenever you use a variable in C++ you must specify the type of data that will
    be stored in that variable. Moreover, once you have chosen the type of data to
    be stored in a given variable you can''t change it. The jargon phrase is that
    it is a *statically typed language*. This distinguishes C++ from computer languages
    which take a more relaxed attitude to specifying the type of data.


    The reason that specifying the type of data is important is that ultimately, data
    is stored on your computer data as strings of 1s and 0s. Integers are encoded
    as binary numbers. Letters are encoded as numbers written in binary. Floating
    point numbers are stored in a binary version of scientific notation.


    The problem is that if you just look at the 1s and 0s without also knowing the
    type of the data, the data is completely meaningless. The chip that powers your
    computer''s processing (the CPU or Central Processing Unit) treats data blindly
    without caring about the type. This means that the CPU is willing to carry out
    some pretty silly computations if you ask it to. For example, you can ask your
    CPU to multiply the integer representing the character “w” by the number seven.
    Probably the only reason you would do this is if your code contains a bug and
    is accidentally using the same variable for numbers and letters. These kinds of
    bugs can be found before you ever even run your code if you use a statically typed
    language.


    The C++ language has evolved from the C language. C is also statically typed.


    One of the reasons C caught on in the first place is that it is statically typed.
    The machine-code everyone used before C came along is not statically typed. Programmers
    quickly found that the C compiler was able to find a lot of bugs automatically
    by checking types. This meant that they were able to spend more time writing new
    code and less time fixing bugs.


    # ### 2.1 Memory terminology


    Because data is stored on computers using 1s and 0s, it is natural to store integers
    using binary.


    17'
