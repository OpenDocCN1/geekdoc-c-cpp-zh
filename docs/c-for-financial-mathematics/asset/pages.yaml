  md: '# Chapter 18


    # The Standard Template Library


    The **Portfolio** class we developed in Chapter 13 can only be used to store options
    on a single stock. This is a significant limitation. In this chapter we would
    like to enhance our classes so that we can cope with a market that contains multiple
    stocks.


    To do this we will need to use some more interesting data structures than just
    vectors and matrices. In particular we will want to use a data structure called
    a **map** which allows you to store data indexed by a key of some sort. For example,
    suppose you have written a class called `CompanyInfo` which contains a great deal
    of practical information about a company such as the address of its head office
    and the names of its directors. You would then want to be able to store a `CompanyInfo`
    object for each stock in such a way that you can quickly look up the `CompanyInfo`
    given just the name of the associated stock. The **map** class allows you to do
    this efficiently.


    In Exercise 18.12.3, the same ideas will allow you to address another criticism
    of our **Portfolio** class. If multiple options in a **Portfolio** have the same
    maturity and underlying stocks, then we could use the same set of market simulations
    to price all of these options at once. The class **map** allows you to conveniently
    group data and so is a useful tool in developing more sophisticated algorithms.


    C++ has a number of built-in data structures. **map** is one, as is **vector**.
    These standard data structures are called *containers*. The full library that
    includes these data structures is called the Standard Template Library (STL).
    It is called the Standard Template Library because all of these data structures
    are written using templates.


    In this chapter we will look at how to use the Standard Template Library and will
    see how the data structures in the Standard Template Library can be used to model
    a market with multiple stocks.'
