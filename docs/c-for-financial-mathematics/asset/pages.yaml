    You can extract the memory address of any variable even if it was not created
    with new. You use the operator & to do this. You can then store this memory address
    in another variable so long as that variable is declared to have a pointer type.
    Given a pointer, you can access what it points to using \*. These ideas are illustrated
    in the following code:


    ```

    int myVariable = 10;

    int* pointerToMyVariable = &myVariable;


    cout << "Memory location of myVariable ";

    cout << pointerToMyVariable;

    cout << "\n";


    cout << "Value of myVariable ";

    cout << (*pointerToMyVariable);

    cout << "\n";

    ```'
