    # **Tip: The rule of three**


    Whenever you write a destructor (other than an empty virtual destructor) you must:


    +   * override the assignment operator `=`;

    * write a copy constructor.


    In fact, if you write any one of these three things:


    +   * a non-trivial destructor;

    * a copy constructor;

    * an assignment operator `=`;


    then you should write all three. While the rule of three is not a strict rule
    of the C++ language it is a very useful rule of thumb.


    # #### 16.5.1 Overriding the assignment operator


    Suppose that we have two variables of type `Matrix` called `a` and `b`. If we
    write the line


    ```

    a = b;

    ```


