- pgno: 102
  md: "# ### 5.4.4 Inline\n\nAs a general rule, a good programmer never writes the\
    \ same code twice. You should write reusable functions. That way you minimise\
    \ the amount of effort you have to make in testing your code.\n\nNovice programmers\
    \ often make the mistake of using the cut-and-paste features of their development\
    \ environment as an alternative to writing functions. This is a very bad idea.\
    \ It results in code that is hard to read and hard to test. If you detect a mistake\
    \ in some code that has been manually cut and pasted into 100 other files, you\
    \ are going to have to track down that error in lots of files.\n\n> **Tip: Write\
    \ functions. Don’t use cut and paste.**\n\nHowever, from a performance point of\
    \ view it is ever so slightly faster to run code that has been cut and pasted\
    \ than it is to write code that has been divided into functions. The reason is\
    \ that at the level of assembly language, calls to functions are turned into machine\
    \ code CALL commands. The performance cost of calling a function is therefore\
    \ equal to the cost of running the code for the function plus the cost of a CALL\
    \ statement.\n\nMost of the time this extra overhead of using functions is absolutely\
    \ trivial and not worth considering. But every now and again, it is worth thinking\
    \ about. The solution is not to stop writing functions: it is to tell the compiler\
    \ to “inline” the functions. This means that you wish to use functions to write\
    \ your code, but you are telling the compiler to generate the machine code as\
    \ if you had used cut and paste. The net effect is that the machine code for your\
    \ function is “copied and pasted” throughout your program by the compiler and\
    \ so there is no need for CALL statements. In other words, you end up with the\
    \ faster code you would get by cutting and pasting but without having to sacrifice\
    \ the benefits of functions.\n\nThe `hornerFunction` examples discussed in Exercise\
    \ 3.9.6 are best inlined. Here is one of the `hornerFunctions` with the `inline`\
    \ keyword added.\n\n```\n```cpp\nstatic inline double hornerFunction(\n    double\
    \ x,\n    double a0,\n    double a1) {\n    return a0 + x*a1;\n}\n```\n```\n\n\
    The optimisation can be justified in this special case because we use `hornerFunction`\
    \ to compute `norminv` and we will be calling `norminv` a great deal in our Monte\
    \ Carlo simulations. So getting these functions to be as fast as possible is worthwhile."
  merge: -1
  img_proc: true
- pgno: 103
  md: 'You might be tempted to make every function **inline** but this may actually
    make the performance of your program worse. The reason is that all the duplication
    of machine code that would happen if you did this makes your program much larger
    and so takes up more memory. This means that your program will take longer to
    start and will have less memory to play with while it is running.


    Modern compilers contain some very sophisticated optimisation routines, so it
    is usually best not to **inline** anything except for very short functions that
    you know are performance critical.


    Incidentally, notice that `hornerFunction` is also **static** because we don''t
    want it to be part of the library. It is an implementation detail that we don''t
    want our end users to know about.


    The reason that we are discussing inline functions in a chapter on dividing your
    code into multiple files is that inline functions cannot have separate definitions
    and declarations. This means that if you wish to share an inline function between
    different files you *must* put the definition into a header file. For all other
    functions you *must not* put the definition into a header file1.


    This does make some sense. If the compiler is going to copy in the relevant code,
    it needs to know what that code should be. So that code must be contained either
    in the `.cpp` file or included from a header file. On the other hand, for non-inlined
    code the code should only be written once. So that code should only be in one
    `.cpp` file and should never be included from a header file.


    # ### 5.5 A complete example


    We will provide many versions of **FMLib** on the website for this book, numbered
    chapter by chapter. For example, **FMLib5** contains the code needed to understand
    this chapter.


    You should download this library and unzip it into a folder called **FMLib5**.
    You should then check that you can compile and run the project.


    Have a look through the code and observe the following points:


    +   - The `hornerFunction` functions are *not* in the header file. We think users
    of our library won''t want to know about them.


    +   - The `hornerFunction` functions are **static**.


    +   - The constants a1, a2, etc., used in our calculations are all **static**.


    +   - The `hornerFunction` functions are **inline**.


    1In Chapter 17 we will add an extra item to this rule to cover template functions.'
