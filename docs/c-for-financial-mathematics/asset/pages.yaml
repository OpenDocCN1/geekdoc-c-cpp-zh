    19.4.3. Suppose that $f: [a, b] \rightarrow \mathbb{R}$ is a continuous function
    and we wish to solve the equation $f(x) = y$ for some value of $y$ lying between
    $f(a)$ and $f(b)$. Obviously there is a solution and it must lie in one of the
    two sub-intervals $[a, (a + b)/2]$ or $[(a + b)/2, b]$. Depending on the value
    of $f$ at $(a + b)/2$, we can determine which of the two sub-intervals we need
    to look in to solve the equation: Simply choose the interval such that $y$ lies
    between the values of $f$ at the end points of the interval.


    This gives a recursive algorithm to numerically solve the equation $f(x) = y$
    within a given tolerance $\epsilon$. To solve the equation on $[a, b]$:


    +   (i) Check if either of the end points is a solution within the desired tolerance,
    in which case we are done.


    +   (ii) Otherwise, decide which sub interval $[a, (a + b)/2]$ or $[(a + b)/2,
    b]$ must contain the solution. Use recursion to apply the algorithm to the smaller
    interval.


    This algorithm is called the method of bisection. Implement it. (There are many
    other algorithms to solve equations of this type, such as the Newton–Raphson method.
    You can find implementations in libraries such as GSL, the GNU Scientific Library.)


    19.4.4. It is easy to calibrate all the parameters in the Black–Scholes formula
    to the market, except for the volatility $\sigma$.


