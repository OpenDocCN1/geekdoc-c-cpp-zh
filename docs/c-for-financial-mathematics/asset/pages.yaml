  md: '```

    ofstream out;


    // choose where to write

    out.open("myfile.txt");


    out << "The first line\n";

    out << "The second line\n";

    out << "The third line\n";


    // always close when you are finished

    out.close();

    ```


    As you can see, it works just like std::cout except for the open and closing of
    the file. When using an ofstream you must call open to specify which file you
    want to write to. You must call close when you have finished writing.


    You must call close because C++ performs some “buffering”, which means your data
    might not actually be written until you call close. Buffering is a common performance
    enhancement that is used when writing data to networks and files. It is usually
    quicker to write 100 characters to a file in one go than it is to make a separate
    call for each character. As a result, when you write to a file, C++ will quietly
    batch together all your writes until it thinks there is enough data to be worth
    sending to the file. Calling close indicates that it is time to finish writing
    the data.


    In addition, calling close indicates to other programs you are running that you
    are no longer trying to write to the file—you normally want to prevent two different
    programs trying to write to the same file.


    When passing round an ofstream, pass a reference to an ostream. Read the last
    sentence carefully: There is no f in ostream. It stands for “output stream” and
    it can be used to refer to *any* kind of stream to which you might wish to write
    the output of your program.


    ```

    void writeHaiku( ostream& out ) {

    out << "The wren\n";

    out << "Earns his living\n";

    out << "Noiselessly.\n";

    }


    void testWriteHaiku() {

    // write a Haiku to cout

    writeHaiku( cout );

    // write a Haiku to a file

    ofstream out;

    out.open("haiku.txt");

    writeHaiku( out );

    out.close();

    }

    ```'
