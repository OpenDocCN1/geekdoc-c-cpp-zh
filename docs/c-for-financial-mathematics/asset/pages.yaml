  md: '+   - A single binary digit is called a bit. This is just a truncation of the
    phrase binary digit.


    - 8 binary digits are called a byte. This is just a bad joke.


    - 1024 bytes make a kilobyte (1024 = $2^{10}$ so the usual use of “kilo” to mean
    1000 is tweaked to work better in binary).


    - 1048576 = $2^{20}$ bytes make up a megabyte.


    - Numbers representing memory locations are often written in hexadecimal. This
    is base 16. The 16 characters 0, 1, 2, \dots, 9, A, B, C, D, E, and F are used
    to represent hexadecimal digits. So A is equivalent to the decimal number 10 and
    F to the decimal number 15. The hexadecimal number 10 can be written in decimal
    as 16. Four binary digits are equivalent to one hexadecimal digit. For this reason,
    one hexadecimal digit is called a nibble.


    As is already clear, computer programmers have a particularly poor sense of humour.


    > **Old Joke:** There are 10 kinds of people. Those who understand binary, and
