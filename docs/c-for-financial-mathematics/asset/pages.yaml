    \ rng.discard(randSize*taskNumber);\n```\n\nThis use of discard guarantees that\
    \ if we create n tasks and give them consecutive task numbers from 0-n, then the\
    \ set of random numbers used for the Monte Carlo calculation will be exactly the\
