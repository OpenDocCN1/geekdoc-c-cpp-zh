    \ const int& x ) {\n        x = x + 1;\n        cout << \"B: Value of x is \"\
    <<x<<\"\\n\";\n}\n```\n```\n\nyou will no longer be able to compile the code.\
    \ This is because the function attempts to modify the variable x contradicting\
    \ the use of the **const** keyword.\n    You can use the **const** keyword on\
    \ variables, too. We've seen it used on global variables, but you can use it on\
    \ local variables. Whenever it is used, it means that the value of the variable\
    \ must not change.\n\n> **Tip: Use const consistently or don't use it at all**\n\
    \nAs we have discussed, using the **const** keyword means the compiler will check\
    \ your functions to make sure they don't have any side effects.\n\nThis has some\
    \ advantages, but it has the obvious downside that you need to type **const**!\
    \ If you choose to use the **const** keyword you will quickly discover that you\
    \ must use the **const** keyword consistently throughout your code in order to\
    \ avoid compilation errors. It turns out that this will mean typing **const**\
    \ *extremely* often.\n\nYou need to decide whether you want to use **const** in\
    \ your code or not. In this book we will demonstrate how to write code using the\
    \ **const** keyword and so will use **const** a lot.\n\nIf you are working on\
    \ an existing C++ project, a decision will have been made on whether or not to\
    \ use **const** in that project. In this case you should fall in with this decision.\n\
    \nIf you are writing your own software project, perhaps for a student dissertation,\
