  md: '# ## 12.4 Overriding methods — the virtual keyword


    Let us add a new method to ContinuousTimeOptionBase to price an option given the
    pricing model.


    ```

    ```

    class ContinuousTimeOptionBase

    : public ContinuousTimeOption {

    public:

    /* Price the option, by Monte Carlo or otherwise*/

    double price(

    const BlackScholesModel& model) const;

    // ... other members ...

    };

    ```

    ```


    To implement the method using Monte Carlo we would simply use the following code:


    ```

    ```

    double ContinuousTimeOptionBase::price(

    const BlackScholesModel& model ) const {

    MonteCarloPricer pricer;

    return pricer.price( *this, model );

    }

    ```

    ```


    This implementation works reasonably for all option types, but it isn’t necessarily
    optimal. For example, a PutOption is best priced analytically rather than by Monte
    Carlo.


    Therefore we would like to be able to override the default implementation. The
    keyword virtual means that a function may be overriden in a subclass. So we must
    add it to the declaration of price


    ```

    ```

    class ContinuousTimeOptionBase

    : public ContinuousTimeOption {

    public:

    /* Price the option, by Monte Carlo or otherwise*/

    virtual double price(

    const BlackScholesModel& model) const;

    // ... other members ...

    };

    ```

    ```


    If you wish to override a method in a subclass you should do the following:


    +   - Check it is declared as virtual in the superclass.


    +   - Declare it with precisely the same parameter and return types (and uses
    of const) in your subclass. Optionally, you can use the keyword override so the
    compiler checks that you have done this correctly.'
