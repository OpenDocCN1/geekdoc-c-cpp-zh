    class mt19937. Because the default_seed will be the same for all instances, it
    is logical to associate it with the class rather than any instance. For more complex
    data objects than a single integer, it may save a considerable amount of memory
    to have only one copy of a variable that is shared by all instances.


    In summary, static functions and static variables behave exactly like global functions
    and global variables except for the following.


    +   - They can be made private and have privileged access to private data.

    This increases encapsulation.

    - They are associated with the class. Calls to static functions need to be qualified
    with the class name. This prevents name clashes.


    Confusingly, C++ also uses the static keyword with functions that aren’t defined
    in any class. In this context static means “cannot be used outside the current
    file”. It is unfortunate that C++ uses the same keyword for two completely different
    purposes.


    Just as with other global variables, if you are using multi-threaded code then
    you must be careful to use locks using non-constant static variables. See Chapter
    20.


    # 12.9 The protected keyword


    We know already that we can use the keywords public or private for information
    hiding. public means everyone can use the methods and variables. private means
    nobody can use the methods/variables including subclasses.'
