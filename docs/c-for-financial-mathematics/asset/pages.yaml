- pgno: 282
  md: 'We have introduced a simple test framework for unit testing code. In practice
    you might want to consider using a more elaborate testing framework. For example,
    you might want to use a test framework that integrates closely with your debugger
    so that you can jump to the right line of code whenever an error occurs. Another
    useful feature might be an online report showing how many tests are being run
    and how many pass and fail at any moment in time.


    Some test frameworks you might consider are Unit Test++, Boost library’s testing
    framework Boost.Test, or Microsoft’s Unit Testing Framework for Visual Studio.


    # ### 15.4.4  Automated build


    It should be possible to build, test, and deploy all your code with a single command.


    In this book we have automated the process of compiling your code and running
    your tests for you.


    If you are using Visual Studio, we have shown you how to configure your project
    so you can compile it and run it by pressing \*\*CTRL+F5\*\*. If you are working
    on Unix, you can build your project by typing \*\*make\*\* and then type the name
    of the project to execute it.


    When working with larger projects you should make sure that you maintain a similar
    level of simplicity. This is not so straightforward for larger projects as they
    are often divided into multiple libraries. You will want to make sure that it
    is possible to build each library individually or to build all libraries at once.
    You will want to be able to build code for every operating system that your code
    runs on. You will want to be able to build debug versions of all your code and
    release versions of your code. Furthermore, some of your code may actually be
    automatically generated by other programs that you write.


    However, it is crucial that you have a simple process for the following reasons.


    +   i) It should be an essentially automatic process to recreate your software
    from your source code. If there are written instructions that someone has to follow,
    there is a danger they won’t be followed correctly and you will release software
    you cannot recreate.


    +   ii) It should be quick and easy to test your system. A developer new to your
    system should be able to build it and test it with ease. If it is hard to test
    your system, you won’t test it much. This means it will be full of bugs.


    On Windows, Visual Studio contains various tools to help automate your build.
    There are also numerous open source tools that can be used with any operating
    system such as \*\*make\*\*, Boost build, \*\*cmake\*\*, and Ant.'
