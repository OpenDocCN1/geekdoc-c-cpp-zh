  md: 'only thing you will need to change is the name of the PROg_NAME variable. This
    is just the name of the executable you want to create. One aspect of the file
    that is worth mentioning is the line


    ```

    CFLAGS = -Wall -Werror -D_GLIBCXX_DEBUG -std=c++11 -g

    ```


    Here we are configuring some compiler options to aid with debugging. For example
    we are saying that we would like all possible warning messages to be shown (-Wall)
    and that we would like any warning to result in compilation failing (-Werror).
    The flag -std=c++11 indicates that we are using a relatively recent version of
    the C++ standard called C++11. We discuss the possible compiler options further
    in Chapter 15.


    > Note that it is crucial that the tabs on the left of this file are actual tab
    characters and not spaces!


    You can now compile the code by running the following from a command shell


    ```

    make clean all

    ```


    You can then run the code by typing


    ```

    ./InterestCalculator

    ```


    The make command is a standard Unix tool to make it easier to compile C++ programs.
    It actually does very little itself other than call another Unix program called
    g++ which actually compiles your files into assembly code. The main advantages
    of make over using g++ directly are:


    +   - You don''t need to type in the names of every single file you want to compile.
    This is a big help for larger projects.

    - If only one file has changed, make won''t recompile everything.


    Running make clean gets rid of any code that has been created as part of the compilation.
    Running make all runs an incremental compilation of the files that have changed.
    Running make clean all first gets rid of all the code and then runs a full compilation
    from scratch.'
