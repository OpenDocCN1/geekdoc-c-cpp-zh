  md: 'senses, cheating. If you were the first person in history to write a normcdf
    function, you wouldn''t yet know what the value of normcdf(1.96) should be.


    When you come to write complex code, to price some exotic derivatives, for example,
    you probably won''t be able to look up the correct answer. So you will have to
    come up with rather more cunning tests. Here are some general ideas.


    +   • Are there any mathematical properties that should hold for your answer?
    Then test that they hold.

    • Can you think of alternative ways of calculating the answer? Then implement
    both methods.

    • Does your problem simplify for extreme parameter values? Then check what happens
    for these extreme values.

    • Can you break the calculation down into separate functions which you can test
    individually? Then do so.


    # Exercises


    +   6.6.1. Write a unit test for your functions that compute the area and circumference
    of a circle. Make sure they are actually running.


    6.6.2. Insert `DEBUG_PRINT` statements into the functions to compute the area
    and circumference of a circle. Check that you can enable the `DEBUG_PRINT` statements.


    6.6.3. The unit test function `testNormcdf` is marked as `static void`. Why? The
    function `testMatlib` is marked as `void` but not `static`. Why not?


    6.6.4. Write a function to compute the price of a put option using the Black-Scholes
    formula, Equation (A.7). Write a test for this function.


    # 6.7 Summary


    We''ve seen how to use the `testing.h` testing framework. In a production system
    one would probably use something more sophisticated.


    When writing C++, write lots of small functions with tests for each. Constantly
    compile and run your code to make sure you spot your errors as soon as you make
    them.'
