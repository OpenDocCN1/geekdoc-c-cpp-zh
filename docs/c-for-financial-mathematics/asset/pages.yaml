  md: 'To see the difference, imagine your program contains one million lines of code.
    Reading the code through clearly takes one million steps. Let us be honest, you
    will fall asleep and miss the bug. The divide and conquer strategy might require
    writing log$_{2}(1000000) \approx$ 20 tests before you find the problem. This
    is clearly much better. It has the additional advantage that you will be increasing
    the size of your test suite as you work. This means that next time a bug occurs,
    you should be able to find it far more quickly.


    # 15.2 Debugging with Visual Studio


    This section describes how to use the debugger built into Visual Studio. If you
    are developing on Unix using command line tools, you should read Section 15.3
    instead.


    If you are using some other debugger, you should consult its documentation for
    the precise details of how to debug your code. Nevertheless, this section may
    be useful to you as an indication of the key things to look for when debugging.


    When debugging your code in Visual Studio, you should select “Debug” from the
    drop-down menu on the Toolbar. This drop-down menu gives the choice of compiling
    and running either “Debug” or “Release” versions of your software. As the names
    suggest, the Debug version is very useful for development purposes. The Release
    version eliminates most of the code that helps with debugging, resulting in software
    that runs considerably faster.


