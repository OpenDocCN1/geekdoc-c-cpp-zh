  md: "# 18.6 The container vector\n\nWe are familiar with the container **vector**\
    \ already, but we have not given a great deal of detail about when it should be\
    \ used and when other containers should be used.\n\nA *vector* stores its data\
    \ in memory in a single contiguous region just as happens if you create a block\
    \ of memory using **new** [ ]. **vector** improves upon creating memory using\
    \ **new** [ ] yourself in the following ways.\n\n+       (i) A vector stores the\
    \ size of the memory block as well as just a pointer.\n\n    (ii) When you add\
    \ elements to a vector, it will decide if it needs to allocate more memory and,\
    \ if required, it will allocate a new block of memory and copy the data in. A\
    \ vector has a *capacity* which is the size of the memory it has allocated and\
    \ a *size* which is the number of elements it contains. The vector will always\
    \ make sure the capacity is larger than the size by allocating new memory as needed.\n\
    \n    (iii) In debug mode, the iterator and the operator [ ] contain extra checks\
    \ that you are only accessing data that lies inside the vector. This is very helpful\
    \ for debugging.\n\n    (iv) A vector obeys all the conventions of the standard\
    \ template library so it can be used more easily than a raw pointer.\n\nAs we\
    \ have seen already, vectors are easy to use. They are also very fast because\
    \ they use contiguous blocks of memory which the computer finds easy to work with.\
    \ In particular you can access the $i$-th element of a vector extremely rapidly.\
    \ It does not take significantly longer than accessing the first element.\n\n\
    The downside of a vector is that it is very slow to insert a new item in the middle\
    \ of a vector. The worst case is if you wish to insert a single item at the beginning\
    \ of a vector. You will then need to copy all the old contents of the vector into\
    \ new memory locations before inserting the new element. This is illustrated in\
    \ Figure 18.1.\n\n![](img/c60a618fcc2a2ed9d1e8d96a1b4157ff_333_0.png)\n\n**FIGURE\
    \ 18.1:** Inserting into a vector is $O(N)$. Blank squares indicate unused capacity."
  merge: -1
  img_proc: true
- pgno: 334
  md: "This means that a **vector** is not the right data type to use to store the\
    \ characters in a spreadsheet document. Nobody wants it to take a long time to\
    \ insert a single character at the beginning of a document.\n\nWe say that the\
    \ time taken to insert an element into a vector is $O(N)$ where $N$ is the length\
    \ of the vector. On the other hand, reading a single element at a specified index\
    \ is $O(1)$. In other words, reading a single item in a vector is independent\
    \ of the length of the vector. Adding elements to the end of a vector is typically\
    \ of $O(1)$ unless you are unlucky and the vector has to expand its capacity,\
    \ in which case it is $O(N)$ as the entire vector has to be copied.\n\nA **set**\
    \ is faster than a **vector** for inserting data. Inserting is $O(\\log N)$. We\
    \ will explain why when we discuss the very similar **map** container in Section\
    \ 18.9.1.\n\n# ## 18.7 The container list\n\nA **list** is very similar to a **vector**\
    \ but it is designed so that it is easy to insert data at arbitrary points in\
    \ $O(1)$. In particular, you can add data efficiently to either the front or end\
    \ of a list. By contrast, with vectors you can only add data at the end efficiently.\n\
    \nThis means that the **list** class is very useful for organising priority lists.\
    \ You can put high-priority items at the front of the list and low-priority items\
    \ at the end.\n\nUnder the covers, each element in a **list** is stored using\
    \ a data type that looks something like this:\n\n```\nclass Link {\n    Data d;\n\
    \    Link* next;\n    Link* previous;\n};\n```\n\nEach **Link** is stored in an\
    \ arbitrary location in memory, but by following the pointer **next** you can\
    \ always quickly find the next item in the list. If you wish to go backwards you\
    \ can follow the pointer **prev**. The actual **list** class itself needs to store\
    \ a pointer to the first and last elements. The situation is depicted in Figure\
    \ 18.2.\n\nThis data structure is called a doubly linked list. You can quickly\
    \ insert a new element by creating a new **Link** and re-routing a few of the\
    \ pointers. The changes that need to be made are indicated in Figure 18.3 using\
    \ bold and dashed arrows. The important point is that the number of changes is\
    \ independent of the length of the list. This means that insertion takes $O(1)$."
