    # 11.9\ \ \ \ Summary


    Pointers are an essential tool for a C programmer, but aren’t so important to
    a C++ programmer. Nevertheless you must use pointers to some extent if you want
    to work with data of variable sizes or with long-lived data. By far the easiest
    way to use pointers is to use the **shared_ptr** class.


    +   • Pointers, references, and **shared_ptr** can be used to achieve similar
    things.

    • Use **vector** and **string** rather than arrays or **char \***.

    • References are a bit safer than pointers, for example you can’t call **delete**
    on a reference and you *must* initialise reference variables. So pass by reference
    is preferred to pass by pointer.

    • A **shared_ptr** is a bit slower than a reference or a pointer, but is really
    the only viable option for long-lived data if you want to avoid memory leaks.'
