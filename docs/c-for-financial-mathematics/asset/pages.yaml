    \ - amount;\n    if (newAmount < 0.0) {\n        throw logic_error(\"No overdraft\
    \ agreed\");\n    }\n    return newAmount;\n}\n```\n```\n\nIt is much better for\
    \ a program to `throw` an error and terminate than for it to print out an error\
    \ message and try to struggle on. This is true for several reasons:\n\n+   - Nobody\
