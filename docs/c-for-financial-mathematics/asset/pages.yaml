- pgno: 343
  md: 'Our model will be simply the most obvious multi-dimensional generalisation
    of Brownian motion. It is a natural first attempt at writing a multi-dimensional
    model but is by no means the final word on modelling more complex stock markets.


    We assume that the changes in the stock prices over each time interval $\delta
    t$ are determined by $R$ independent normally distributed risk factors $c^{j}$
    with $j$ varying between 1 and $R$. We write $\underline{c}_{t}$ for the $R$-vector
    of risk factors at time $t$.


    We have $n$ stock prices $S_{i}^{t}$ at each time $t$ with $i$ between 1 and $n$.
    We write $z_{i}^{t} := \log(S_{i}^{t})$ and write $\underline{z}_{t}$ for the
    vector of log stock prices at time $t$.


    Our model is that the log of the stock prices evolves according to the difference
    equation:


    ```

    $\underline{z}_{t+\delta t} = \underline{z}_{t} + \underline{\eta}\delta t + (\delta
    t)^{\frac{1}{2}}L\underline{c}_{t}$

    ```


    where $\underline{\eta}$ is an $n$ vector and $L$ is an $n \times R$ matrix. It
    is not significantly more difficult to simulate this multi-dimensional model than
    it is to simulate a one-dimensional model.


    Given the value at $\underline{z}_{t}$, the value at of $\underline{z}$ at time
    $\underline{z}_{t+\delta t}$ will have a multi-dimensional normal distribution
    with covariance matrix $(\delta t)L L^{\mathrm{T}}$ where the superscript $\mathrm{T}$
    denotes the matrix transpose. We write $A = L L^{\mathrm{T}}$ for the covariance
    matrix over a year. Two models of the form (18.1) with the same $\underline{\eta}$
    should be considered equivalent if they have the same value for the covariance
    matrix $A$.


    Normally one chooses the matrix $L$ for this model by first choosing a covariance
    matrix $A$ and then finding a matrix $A$ such that $L L^{\mathrm{T}} = A$. Such
    a matrix is called a *pseudo square root* of $A$. An algorithm for finding a pseudo
    square root of a covariance matrix called “Cholesky decomposition” was given in
    Exercise 16.7.5.


    The larger the value of $R$ one uses, the longer it takes to compute each term
    in the model (18.1). Computing each successive term in (18.1) requires $n \times
    R^{2}$ calculations. For this reason when one has a large number of stocks one
    might try to model the market with less risk factors than stocks. To do this,
    one works with a lower dimensional approximate pseudo square root of the covariance
    matrix instead of a true pseudo square root. This can be done by finding a basis
    of eigenvectors for the covariance matrix and using only the eigenvectors with
    the largest eigenvalues to create the matrix $L$. This allows one to use a moderate
    number of risk factors to model a large market.


    For simplicity, however, we will assume from now on that $L$ is the Cholesky decomposition
    of a given covariance matrix $A$. This is the situation we shall model in our
    software.


    If we consider the behaviour the $i$-th component of our log stock price vector
    $\underline{z}_{t}$ we see that it is normally distributed with variance $(\delta
    t)A_{(i, i)}$ and mean $(\delta t)\underline{\eta}_{i}$. Thus each stock individually
    follows a geometric Brownian motion with drift $\underline{\eta}_{i} + \frac{1}{2}
    A_{(i, i)}$ and volatility $\sqrt{A_{(i, i)}}$.


    We deduce that this is a risk-neutral model for stock prices in a world with'
