- pgno: 359
  md: '# **Chapter 20**


    # *Threads*


    A computer is capable of doing more than one thing at once. As well as running
    more than one program at a time, it is also possible for each program to be performing
    more than one task at each time. Each separate program that is running is called
    a *process*. Within each process, each separate running task is called a *thread*.
    The programs we have written so far contain a single thread. This chapter is about
    writing programs that execute multiple threads at once.


    If a computer has multiple CPUs, each CPU can manage its own thread of execution
    and so one can run multiple threads simultaneously. Modern processors often contain
    multiple *cores*. You can think of each core as being effectively a processor
    in its own right. Each core can execute a separate thread.


    However, even if you only have one processor you can still run multiple threads.
    The threads will appear to run simultaneously, but in fact the operating system
    will simply allocate a little bit of time to each thread in turn. More generally,
    you can run more threads than processors. One of the main tasks of the operating
    system is to determine which threads to run at any one time. For example, the
    operating system may give priority to graphical user interfaces and less priority
    to background computations.


    A multi-threaded program is simply a program that contains more than one thread.
    Here is a short list of the possible benefits one might hope to obtain from writing
    a multi-threaded program.


    +   (i) **CPU Performance:** In order to use all your processors or cores you
    must run multiple threads, so multi-threading is essential to making full use
    of your computer resources.


    +   (ii) **Network Performance:** When you are waiting for network operations
    to complete (e.g., a web page to download), you might as well use your processors
    to do other things.


    +   (iii) **Fairness:** If you are writing a web server, users who want to view
    one page shouldn’t have to wait half an hour for some other user’s enormous download
    to complete.


    +   (iv) **Usability:** While a program is performing a lengthy calculation, users
    appreciate being able to perform other tasks while the processing happens “in
    the background”.'
