    # 18.12 Using the Standard Template Library in FMLib


    We wish to enhance FMLib so that it is possible to price a portfolio which contains
    options on more than one stock. In addition we would like to be able to price
    options such as a Margrabe option where the contract involves the interaction
    of two stocks (see Exercise 18.12.2).


    The key changes we need to make to FMLib are summarised in Figure 18.6. Let us
    also explain them in words.


    The **ContinuousTimeOption** interface is changed so that its payoff function
    now takes a **MarketSimulation** object as a parameter. The previous version of
    this function took a matrix of stock price paths as a parameter.


    The **MarketSimulation** class is a simple class that stores a map between the
    name of a stock and a matrix of stock price paths. It stores all our simulations
    of the stock market. In order to compute the payoff of an option on multiple stocks,
    one queries the **MarketSimulation** for the price paths for each of the stocks
    involved in the option contract. One can now compute the payoff of the option
    according to the option contract.


