    the formulae for the expectation and variance of a sum of random variables, we
    can compute the mean and variance of $\log S_t$ as follows.


    ```

    $\mathbb{E}(\log(S_1) - \log(S_0)) = N \mathbb{E}(Y_t) = \frac{A}{\delta t}$.

    ```


    ```

    $\mathrm{Var}(\log(S_1) - \log(S_0)) = N \mathrm{Var}(Y_t) = \frac{B^2}{\delta
