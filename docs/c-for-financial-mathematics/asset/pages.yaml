  md: 'thread 1 will acquire the mutex on A, thread 2 will acquire the mutex on B,
    and then neither thread will be able to proceed.

    There are various techniques one can use to try and resolve the problem. For example,
    you could:


    +   (i) Write single-threaded code instead.

    (ii) Only use one lock for all accounts.

    (iii) Give the locks an ordering and insist that (say) lock A is always acquired
    before lock B.

    (iv) Include a time-out so if you don’t acquire a lock in a reasonable time frame
    you should release all the locks that you hold.

    (v) Incorporate some deadlock detection and resolution algorithm in your locking
    classes.


    All of these are sensible possible solutions to the deadlock problem. Which is
    the right choice depends upon what your priorities are in writing the system.
    For example, the first option is probably best if ease of programming is important
    to you and performance is unimportant.


    # Tip: Guidelines for multi-threaded code


    +   • Don’t use global variables. If you must have global variables other than
    constants you will need to use locks to protect them.

    • Minimise the data shared between threads. The less that is shared, the less
    locking required.

    • Where possible, use const data between threads as this won’t require locking.

    • Divide your code into simple sequential algorithms and small separate sections
    where threads communicate.

    • Use standard established design patterns and classes for multi-threaded code.

    • Don’t write multi-threaded code unless there is a clear benefit. Even then only
    a tiny part of your code should involve threading.


    For example, one important design pattern for writing multi-threaded code is to
    use a database to communicate between threads. Standard database software is specifically
    designed for concurrent use. Commercial databases support sophisticated “transactions”
    which are a way of allowing multiple users'
