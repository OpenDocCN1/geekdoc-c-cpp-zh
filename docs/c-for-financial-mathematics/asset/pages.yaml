    \ else {\n        return x;\n    }\n}\n```\n```\n\nWhen you write a templated\
    \ function, you don’t specify all the types of the parameters to your function.\
    \ Instead, you provide a list of dummy variables, called template parameters,\
    \ which can be replaced as necessary with the required types. In this example,\
