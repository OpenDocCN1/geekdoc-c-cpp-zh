    # #### 21.1.1 Libraries


    You have reached a point in your development as a C++ programmer where it no longer
    makes sense to write everything from scratch. It is time to learn some C++ libraries.
    Useful libraries for financial mathematics include:


    +   1. **The standard library.** We introduced some of the most useful features
    in Chapter 18, but it pays to be familiar with the entire library. There are excellent
    online resources as well as books such as [8].

    2. **Boost.** The Boost libraries are a collection of general purpose libraries
    that are useful for many C++ applications. They are written to a high standard.
    Many of the newer standard C++ libraries were first part of the Boost library.
    See http://www.boost.org.

    3. **Quantlib.** This is a C++ library designed specifically for financial mathematics.
    See http://quantlib.org.

    4. **GNU Scientific Library.** The GNU scientific library contains many useful
    routines for numerical computations. See http://www.gnu.org/software/gsl/.


    # #### 21.1.2 Software development


    There is more to writing software than learning to program.

    Your code needs to be easy to understand, easy to test, and easy to debug. Books
    such as [5] can enhance your approach to programming.

    You need to learn how to make the most of a team of programmers and how to deliver
    what your customers want. [1] is a thought-provoking account of how to do this.'
