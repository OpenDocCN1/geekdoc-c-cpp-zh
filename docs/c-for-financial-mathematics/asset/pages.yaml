  md: "Because the test is only performed at the end of a **do-while** loop, the body\
    \ of the loop is always executed at least once.\n\nIt is generally accepted that\
    \ **do-while** loops are hard to read, so they are not used very often. The other\
    \ looping constructs are preferred.\n\n# 4.3 for loops\n\nIt was noticed by the\
    \ designers of C that most **while** statements look, in outline, like this:\n\
    \n```\n<initialise loop variables>;\nwhile (<test loop variables>) {\n  <perform\
    \ main steps of code>\n  <update loop variables>\n}\n```\n\nTo make this repeated\
    \ design more obvious in code, they introduced the **for** loop. This takes the\
    \ general form:\n\n```\nfor (<initialise loop variables>;\n    <test loop variables>;\n\
    \    <update loop variables>) {\n    <perform main steps of code>\n}\n```\n\n\
    To write a **for** loop one simply takes a **while** loop of the form above and\
    \ moves the code around to match the syntax of a **for** loop.\n\nFor example,\
    \ our code to launch a rocket becomes:\n\n```\nfor (int i = 10; i > 0; i--) {\n\
    \  cout << i;\n  cout << \"\\n\";\n}\ncout << \"Blast off!\\n\";\n```\n\nTo a\
    \ newcomer to C++, this doesn’t look like much of an improvement. The only obvious\
    \ advantage is that this takes up less lines than the **while** loop equivalent.\
    \ However, it reads less like English than the **while** loop. If you are new\
    \ to C and C++ you will probably think that the **while** loop is easier to follow.\n\
    \nWith familiarity you will grow to prefer the **for** loop. Not because it’s\
    \ easier to understand when you actually read the code, but because you recognise\
    \ the general shape and so can guess the meaning without looking at the details.\
    \ Fairly quickly, you’ll be able to glance at a **for** loop and immediately"
