  md: '# **Chapter 16**


    A Matrix Class


    C++ does not have a built-in class that represents a matrix of real numbers. We''re
    going to write our own in this chapter.


    During the course of writing a **Matrix** class we will cover some interesting
    C++ topics. Specifically,


    +   - constructors and destructors,

    - operator overloading,

    - the rule of three,

    - returning references,

    - overloading using `const`.


    # ## 16.1 Basic functionality of Matrix


    Let us begin designing the basic behaviour of our matrix class. The **Matrix**
    class will store a 2-dimensional array of doubles and will have the following
    data members (all private).


    +   (i) `int nrows`. The number of rows.

    (ii) `int nrows`. The number of columns.

    (iii) `double* data`. A pointer to the first cell.

    (iv) `double* endPointer`. A pointer to one after the last cell.


    The pointer `data` will point to a single chunk of memory of length $\text{nrows}
    \times \text{ncols}$. The cell $(i, j)$ will be stored at the location `data+(j*nRows)+i`.
    Note that we''re using pointer arithmetic in this last expression.


    We''ve decided to use pointers and the `new []` operator rather than a **vector**
    because ultimately if you want to use special CPU optimisations (as we''ll discuss
    in Section 16.7) you''ll need to have a pointer to your data rather than just
    a **vector** object. In addition, it makes this **Matrix** class a good test for
    your pointer programming skills.


    Here is the declaration of the data members of **Matrix**.'
