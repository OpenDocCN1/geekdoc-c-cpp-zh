    # ## Getting Started


    We start by learning how to write and run a simple example program to compute
    compound interest. First we will need to install and configure the software required
    to write C++ programs. Next we will see how to write a simple program.


    # ### 1.1 Installing your development environment


    You will need to install some sort of *development environment* on your computer
    in order to write C++ programs. A development environment is rather like a word
    processor, except it allows you to write software rather than documents. Just
    as with word processors, there are quite a few different development environments
    you can choose from. We will give some recommendations that have been tested to
    work with this course.


    # #### 1.1.1 For Windows


    You will need to download Microsoft Visual Studio Express for Windows Desktop¹.
    This software is freely available.


    # #### 1.1.2 For Unix


    If you are using Unix you will need a text editor and the programs **g++** and
    **make**. If they are not already installed, follow the instructions for your
    Unix distribution, which you should be able to readily find online. Another program
    you should install is **gdb**, which we will discuss in Chapter 15.


    # #### 1.1.3 For MacOS X


    Install Apple''s XCode² development environment.


