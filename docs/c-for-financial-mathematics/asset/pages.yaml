    \ for the function.\n\nIn C++ one would write the **compoundInterest** function\
    \ as follows.\n\n```\n```\ndouble compoundInterest(double P, double i, int n)\
    \ {\n    double interest = P * pow(1 + 0.01*i, n) - P;\n    return interest;\n\
    }\n```\n```\n\nOn the first line we first provide the type of data the function\
    \ computes. In this case it computes a *double*. Next we give the name of the\
    \ function. In this case the name is **compoundInterest**. We then list the names\
    \ of all the parameters and their types. In this example we have said that the\
    \ name of the function is **compoundInterest**. We have said that it takes 3 parameters\
    \ named $P$, $i$ and $n$. We have said that the variable $P$ is of type *double*.\
    \ $i$ is also of type *double* and $n$ is an integer.\n\nThe actual code for the\
    \ function is written between a pair of curly brackets. You can write any collection\
    \ of statements you like inside the curly brackets—perhaps assigning several variables\
    \ and some *if* statements, for example. When the computation is complete, the\
    \ code uses the **return** keyword to say what the result of the computation is.\n\
    \nIn summary, the syntax for defining a function is:\n\n```\n```\nReturnType functionName(\
    \ ParameterType1 parameterName1,\n                        ParameterType1 parameterName2,\n\
    \                        ...\n                        ParameterTypeN parameterNameN\
    \ ) {\n    ... statements ...\n}\n```\n```\n\nIn any code written after this function\
    \ has been defined, you can just call the function exactly as though it was a\
