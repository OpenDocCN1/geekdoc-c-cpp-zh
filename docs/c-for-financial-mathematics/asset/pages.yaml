- pgno: 194
  md: 'This function above integrates the payoff function of an option between the
    range $a$ and $b$. We have to store the member variable using a reference because
    you cannot store polymorphic variables by value. Storing data in member variables
    by reference can be dangerous, because the data referred to may be deleted before
    the object holding the reference is deleted. This would cause the program to behave
    badly and perhaps crash. In this case, the code will delete the variable *integrand*
    from memory the moment *integratePayoff* returns. So there should be no danger
    of *option* being deleted before *integrand* is deleted.


    There is an neater notation called *lamdba functions* which can be used to create
    local classes. We will revisit the example of writing an integrator in Chapter
    19 and show how the use of lamdba classes simplifies the code.


    We should also add that the rectangle rule is not the best integration method
    to use. You probably already know of Simpson''s rule. An even more interesting
    technique for one-dimensional numerical integration is called Gaussian quadrature.
    Numerical libraries such as the GNU scientific library contain sophisticated integration
    routines that you should use in practice.


