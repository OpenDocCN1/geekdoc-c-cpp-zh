  md: "# ### 20.3.4 Using the Executor\n\nWe now need to create a number of tasks\
    \ and run them. To decide on the most appropriate number of tasks to create, we\
    \ simply add a new configuration parameter `nTasks` to the `MonteCarloPricer`\
    \ class.\n\nWe can now write a multi-threaded `price` function that: creates the\
    \ desired number of tasks; runs them to obtain estimates for the Monte Carlo price;\
    \ and combines the results to obtain a better estimate for the price.\n\n```\n\
    ```cpp\ndouble MonteCarloPricer::price(\n    const ContinuousTimeOption& option,\n\
    \    const MultiStockModel& model) const {\n  ASSERT(nTasks >= 1);\n  vector<\
    \ shared_ptr<PriceTask> > tasks;\n  shared_ptr<Executor> executor =\n      Executor::newInstance(nTasks);\n\
    \  for (int i = 0; i<nTasks; i++) {\n    shared_ptr<PriceTask> task(new PriceTask(\n\
    \        i, nScenarios/nTasks,\n        nSteps, option, model));\n    tasks.push_back(task);\n\
    \    executor->addTask(task);\n  }\n  executor->join();\n  double total = 0.0;\n\
    \  for (int i = 0; i<nTasks; i++) {\n    total += tasks[i]->result;\n  }\n  return\
    \ total / nTasks;\n}\n```\n```\n\nFinally we update our tests to confirm that\
    \ the result of pricing an option using multiple threads is the same result as\
    \ obtained using a single thread. Since the order of calculations is slightly\
    \ different there may be very tiny differences, so one does not expect precisely\
    \ the same double value. Nevertheless, exactly the same random numbers are used\
    \ in the calculation, so this should be the only source of differences.\n\n# ###\
    \ 20.3.5 Remarks upon the design\n\nFirst, notice that the `Executor` class has\
    \ been written to use the static factory method design pattern. We don’t need\
    \ to know how it was implemented in order to use it. In fact, if you look at the\
    \ code in `Executor.cpp` you will see that it is very sophisticated. On the other\
    \ hand, each `Task` is easy to write.\n\nSecond, notice that the only interaction\
    \ with the `Task` instances happens before and after they are run."
