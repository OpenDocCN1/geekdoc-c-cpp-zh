    # ## *Risk-Neutral Pricing*


    In this appendix we will briskly review the theory of risk-neutral pricing that
    is at the heart of much financial mathematics. The reader should not restrict
    themselves to this chapter if they wish to learn financial mathematics. They should
    begin by consulting one of the many excellent and accessible textbooks, e.g.,
    [14], [15], and [6].


    However, it will be useful to collect together the results needed in this book.
    In addition we will take a slightly different approach to these books. We will
    describe the central ideas of financial mathematics without requiring any high-powered
    mathematical ideas. Instead of proving theorems, we will simply refer to the numerical
    experiments one can perform to verify the theorems in practice. Hopefully the
    reader will find our presentation to be an interesting complement to more standard
    presentations.


    # ### A.1 The players in financial markets


    To understand financial mathematics, it helps to understand who the different
    players are in financial markets, and what trading strategies they are using.


    Probably the most obvious player in the financial markets is the *speculator*.
    A speculator is someone who has a theory about what will happen in the future
    and invests on the basis of that in order to make a profit. They take a lot of
    risks but hope that because of their judgement they will be able to make a large
    return. A famous speculator is Warren Buffett. By carefully analysing the market
    and the fundamentals of companies, he has successfully made billions of dollars,
    and in 2008 was named the richest man in the world by *Forbes*.


    However, there are many other players in financial markets and many profit-making
    strategies. Traditionally, one important role was the *stockbroker*. They would
    act as a broker between different parties, some of whom wanted to buy stock and
    some of whom wanted to sell stock and arrange trades. With the advent of electronic
    trading, this role is now performed largely automatically by electronic stock
    exchanges. These stock exchanges make a profit simply by charging individuals
    to trade. The charges are quite small and often considered'
