    of doubles and the length of the list and reverses it. So (1, 2, 3, 4) should
    be changed to (4, 3, 2, 1), for example. Write a test for this function.


    +   11.8.3. Write a function `meanDistance` which takes a pointer to a list of
    Pair objects and computes the mean distance of $(x, y)$ to the origin.


    +   11.8.4. Write a function `polarToCartesian` which takes four parameters: `r`,
    `theta`, `x`, and `y`. `x` and `y` should be passed by pointers. The function
    should populate the values pointed to by `x` and `y` with $r\cos(\theta)$ and
    $r\sin(\theta)$. Write a test for this function.


    In the C language, one does not have references, so passing by pointer is the
    C equivalent of passing by reference.


    +   11.8.5. Write a function `reverseString` which takes a `char*` string and
