- pgno: 27
  md: 'The “project” groups together all of your files and allows you to set in one
    place the configuration options for all your files. This is why it makes sense
    to have a “project” as well as just the C++ files.


    Secondly, you can write different types of programs on Windows. Most programs
    have Windows user interfaces, but very old fashioned programs have text input
    through the “console”. Console programs are easier to write, but not the default
    on Windows. So we have to tell Windows that is the kind of program we want. This
    is why we must set the SubSystem.


    # Danger!


    Don’t use just F5 or press the “play” button in the toolbar to compile and run
    your program. Press **CTRL+F5** to run your programs. If you just press F5, the
    output of your program will disappear the moment the program finishes running,
    which is confusing at first. In addition, pressing just F5 will execute your program
    using the Visual Studio debugger, which we do not explain how to use until Chapter
    15.


    Let us examine all the files that have been created.


    If you open Windows Explorer (by pressing the windows key and E) you should be
    able to browse to where your project has been saved and you will see that a lot
    of different files have been created.


    Most of these are used internally by Visual Studio and so are of no interest.
    However, the following are interesting.


    +   - `InterestCalculator/main.cpp`. This contains the code we wrote.


    +   - `Debug/InterestCalculator.exe`. This contains the machine code created by
    the compilation process. You could give someone else with a Windows computer this
    executable and they could run your program without using Visual Studio.


    +   - `InterestCalculator.sln`. You can double click this to view the project
    in Visual Studio.


    One problem with compiled languages is that when they are running and a problem
    occurs, the original source code may no longer be available. This makes it very
    difficult for a program to report where in the code the error actually occurred.
    This in turn makes it very difficult to debug compiled code.


    To help with this, Visual Studio can create executables for you that contain not
    just machine code but also information about how that machine code corresponds
    to the original source code. These are called debug executables. By default, Visual
    Studio will create debug executables. This explains why the executable is in a
    folder called **Debug**.


    Adding in debugging information makes your program bigger and slower.'
