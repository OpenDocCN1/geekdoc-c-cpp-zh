    This is the first significant example of *software architecture* in this book.
    Developing software may require you to do any of the following:


    +   * write code in a given language;

    * design functions and data types in that language to produce convenient and useful
    libraries;

    * write systems using multiple computers and languages to create a useful end
    product.


    These tasks are termed coding, software design, and software architecture, respectively.
    Tim Berners-Lee was acting as a software architect when he devised the World Wide
    Web. As the World Wide Web demonstrates, a good architecture can make all the
    difference to the success of your application.


    An introductory book like this on programming in C++ inevitably focuses on coding
    and on software design. However, it is worth keeping in mind that a good software
    developer will be willing to use multiple interacting programs and multiple languages
    to achieve their goals.


    Finally, you may wonder how to produce charts that you can include in publications
    from your C++ code. A tool such as GNU plot can be used to produce very high-quality
    charts. The essential idea is similar: use C++ to write a text file GNU plot understands;
    run GNU plot to turn this text file into a pdf file ready for publication.


