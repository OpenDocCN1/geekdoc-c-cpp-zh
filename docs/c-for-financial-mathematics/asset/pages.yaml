    \ {\n   Circle c;\n   c.radius = 4;\n   ASSERT_APPROX_EQUAL( c.area(), 16*PI,\
    \ 0.01 );\n}\n\nstatic void testCircumferenceOfCircle() {\n   Circle c;\n   c.radius\
    \ = 2;\n   ASSERT_APPROX_EQUAL(c.circumference(),4*PI,0.01);\n}\n```\n```\n\n\
    As the examples above show, you use a dot to call a function on an object. For\
