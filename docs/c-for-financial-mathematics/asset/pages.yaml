  md: "# ### 8.2.3 Passing objects between functions\n\nLet us write a new class called\
    \ **PolarPoint** which represents a point in polar coordinates. It will therefore\
    \ have member variables corresponding to polar coordinates ($r$, $\\theta$).\n\
    \n```\n```\nclass PolarPoint {\npublic:\n    double r;\n    double theta;\n};\n\
    ```\n```\n\nWe can use this class to illustrate how one passes objects to and\
    \ from functions. Let us write a new function **polarToCartesian** which takes\
    \ a point in polar coordinates and returns the corresponding **CartesianPoint**.\n\
    \n```\n```cpp\nCartesianPoint polarToCartesian( const PolarPoint& p) {\n    CartesianPoint\
    \ c;\n    c.x = p.r*cos( p.theta );\n    c.y = p.r*sin( p.theta );\n    return\
    \ c;\n}\n```\n```\n\nAs we discussed in Section 7.2.1, you should use pass by\
    \ reference when passing objects to functions. This explains the use of the **const**\
    \ keyword and the **&** symbol. Normally any custom data type should be passed\
    \ by reference. Pass by value is normally reserved just for **double**, **int**,\
    \ and **bool**.\n\n# ### 8.2.4 How have classes helped?\n\nIt is worth pausing\
    \ to see how using classes has improved our code. Let us examine the code needed\
    \ to test our new **polarToCartesian** function:\n\n```\n```cpp\nstatic void testPolarToCartesian()\
    \ {\n    PolarPoint p;\n    p.r = 2.0;\n    p.theta = PI/2;\n    CartesianPoint\
    \ c = polarToCartesian( p );\n    ASSERT_APPROX_EQUAL( c.x,0.0,0.001 );\n    ASSERT_APPROX_EQUAL(\
    \ c.y,2.0,0.001 );\n}\n```\n```\n\nand compare it with our previous test code:\n\
    \n```\n```cpp\nstatic void testPolarToCartesian() {\n    double r = 2.0;\n   \
    \ double theta = PI/2;\n    double x=0.0,y=0.0;\n```\n```"
