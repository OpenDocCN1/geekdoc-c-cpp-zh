  md: 'a certain amount, one should increase the number of buckets and recompute all
    the bucket ids. This process is called re-hashing.


    Thus, roughly speaking, an unordered map allows one to insert, remove, and query
    data in approximately *O*(1) and so is often faster than a `map`.


    The key functions an unordered map needs to be able to perform on a key are to
    compute the hash code and to check if two keys are equal. For strings and numeric
    types, the unordered map will use a sensible choice of hash code and will test
    equality using `==`. For user-defined types, the default behaviour is that two
    keys are considered equal if and only if they are precisely the same instance
    of the object. If you wish to use a more refined notion of equality for your keys,
    then you should consult the documentation for `unordered_map`.


    Note that the actual hash code used for a string in C++ is computed using a slightly
    cleverer algorithm than just adding up all the character codes in a string that
    is more likely to produce unique hash codes.


    # 18.10 Storing complex types in containers


    > **Tip: Store large objects using shared pointers**


    It is better to store large objects in containers using a `shared_ptr`. For example
    it is better to use a `vector< shared_ptr<Matrix>>` to store a list of matrices
    than a `vector<Matrix>`.


    It is important to know that when you store data in a C++ container, the container
    stores a copy of the data. Similarly, when you extract data from a container,
    you obtain a copy of the data.


    This is reasonable behaviour for small data types such as `int` or `double` or
    small `string` objects. However, if you are storing large objects in containers
    this will be very inefficient. The solution is to always store large objects using
    a `shared_ptr`.


