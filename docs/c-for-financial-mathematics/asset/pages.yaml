    # ### 13.2 The Portfolio interface and implementation


    Now that we have designed our `Priceable` class it is easy to design the key functions
    of a `Portfolio`. A `Portfolio` class must have the following key functions:


    +   (i) a function to add a `Priceable` instance together with an associated quantity;


    +   (ii) a function to change the quantity held of a given security;


    +   (iii) a function `price` to compute the value of the `Portfolio`.


    The last item suggests that a `Portfolio` should itself implement the interface
    `Priceable`. This means that it will be possible to create a `Portfolio` that
    itself contains `Portfolio`s. This accurately reflects how banks manage their
    books. They organise their holdings into a number of different portfolios first
    by line of business, then by trading desk, then by trader. Each trader will then
    maintain a number of separate portfolios simply as a means of organising their
    work.


    One can see that our `Portfolio` implementation will need some way to store objects
    of type `Priceable` in order to keep track of the investor’s position. It not
    possible for the `Portfolio` implementation to have member variables of type `Priceable`
    because `Priceable` is an abstract class. For the same reason it is impossible
    to have a vector of `Priceable` objects. The fundamental reason for this is that
    member variables and elements of vectors must all be of the same size. Different
    `Priceable` objects will take up different amounts of memory depending upon the
    variables they contain.


    The solution for this is for the `Portfolio` to store data using `shared_ptr`.
    This unavoidable use of pointers was the reason we had to introduce the topic
    of pointers in Chapter 11.


    This leads us to the following decisions about the design for the `Portfolio`
    class.


    +   (i) Our `Portfolio` implementation will hold a vector of `shared_ptr` objects
    that point to `Priceable` instances.'
