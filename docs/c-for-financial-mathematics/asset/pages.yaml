  md: '# # Chapter 8


    # ## User-Defined Types


    In the previous chapter we learned how to use:


    +   - vector<double>,

    - string,

    - ofstream,

    - stringstream.


    Using these new types has made us much more productive C++ programmers. The next
    step is to learn to write our own types, which we hope will similarly boost our
    productivity.


    As you will learn, the main job of a programmer in an object-oriented language
    is writing their own types.


    Throughout this chapter we will assume that you have opened FMLib8 in your development
    environment so you can view the code and experiment with it.


    # ### 8.1 Terminology


    We already know the following.


    +   - Every variable in C++ has a type (for example, `double`).

    - You can have lots of variables of a given type.


    We are about to start learning a programming style called “object-oriented programming”
    in which it is conventional to use slightly different vocabulary for the same
    ideas.


    +   - Every *object* in C++ has a *class*.

    - You can have lots of *instances* of the same class.


    **Example 1:**'
