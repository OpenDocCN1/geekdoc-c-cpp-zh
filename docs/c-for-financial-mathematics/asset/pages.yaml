    # ## A.3 Risk-neutral pricing


    Banks wish to provide the financial products desired by their customers. To make
    their customers happy and to ensure that there is a liquid market in their financial
    products, banks are typically willing to either buy or sell the same financial
    product. Due to the intense competition in the market, banks can only charge slightly
    different amounts for buying and selling the same product. Of course, they do
    always charge slightly different amounts for buying and selling. This difference
    reflects the requirement of the bank to make a profit. This willingness to both
    buy and sell at similar prices is perhaps the most immediately apparent difference
    between banks and speculators.


    Banks behave very much like bookmakers in that they are willing to take either
    side of a bet. As a result they price their financial products in a very similar
    way to bookmakers.


    One very interesting fact about the odds offered by bookmakers is that these odds
    do not necessarily reflect the chance of a particular event happening. Instead,
    bookmaker’s odds tell you more about which bets are selling well and which are
    selling badly.


    As an example, many people are willing to bet on their favourite football team
    for emotional reasons rather than because of any serious belief that they will
    win. They bet on what they *want* to happen rather than on what they think *will*
    happen. Similarly, many people don’t like to bet on a firm favourite. This is
    because even if their horse wins they might not make enough money to make it exciting.
    Most people bet for entertainment as much as profit. A 1% return on an investment
    in a day is, from a financial markets point of view, an excellent rate of return.
    However, if you are at a race track and bet £100 on the only four-legged horse
    running a particular race in the hope of making £1 profit, then you probably won’t
    find your watching the race to be particularly exciting.


    As a result, bookmakers do not trouble themselves with carefully studying the
    physiques and pedigrees of horses when they choose what odds to offer. Instead
    they simply match up the bets between different parties in such a way that they
    are guaranteed to make a profit. This profit comes from the small difference in
    the price offered by bookmakers when taking the different sides in any particular
    bet.


    The derivatives desks of banks operate in almost exactly the same way.'
