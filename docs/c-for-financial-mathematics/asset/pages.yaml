    To use a function that is defined in another file, you must first load in a “header
    file” that contains the declaration of that function using the `#include` command.


    In case you have forgotten, we discussed the difference between *declaring* a
    function and *defining* a function in Section 3.4. Briefly, the declaration says
    *what a function does* and the definition says *how it does it*.


    The rule in C++ is that before you can use a function it *must* have been'
