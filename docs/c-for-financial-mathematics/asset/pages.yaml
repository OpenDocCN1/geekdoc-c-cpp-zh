    This raises the question of what is the right order in which to put all your declarations,
    definitions, and so forth within a C++ file. Here are my recommendations. You
    should write cpp files in the following order.


    +   1. Include statements.


    +   2. using namespace statements.


    +   3. Forward declarations of classes.


    +   4. Class declarations and function declarations.


    +   5. Function definitions and member definitions.


    +   6. Tests (other projects often have different test conventions).


    # 12.8 The static keyword


    Sometimes you may want to associate a function with a class but not with a particular
    instance. Here are some reasons why you might want do this.


    +   - The function is designed to construct instances—a so called factory method.
    We will see a detailed example of this in the next chapter.


    +   - The function operates on vectors of instances, so you can’t sensibly associate
    it with a particular instance.


    +   - The function is designed to change the behaviour of every instance at once.
    For example, you might want to enable extra logging information for a class to
    help with debugging.


    +   - The function is designed to manage all the of instances of your class. For
    example, since connecting to a database the first time is slow, you might want
    to maintain a pool of ten connections to a given database. You could then associate
    functions with the **DatabaseConnection** class that allows you to obtain and
    return connections from this pool.


    If you want to associate a function with the class, but not with any instance,
    you should use the keyword **static**. You can also declare that a member variable
    is **static**, which means that it is shared by all instances of the class.'
