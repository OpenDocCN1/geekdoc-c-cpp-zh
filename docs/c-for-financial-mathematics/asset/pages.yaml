  md: "# ### 8.6 Encapsulation\n\nLet us now try to understand the public keyword\
    \ in more detail. To do this let’s write an object-oriented version of our pie\
    \ chart code. We begin with a class declaration called PieChart.\n\n```\n```\n\
    class PieChart {\npublic:\n    void setTitle( const std::string& title );\n  \
    \  void addEntry( const std::string& label,\n                    double value\
    \ );\n    void writeAsHTML( std::ostream& out ) const;\n    void writeAsHTML(\
    \ const std::string& file ) const;\nprivate:\n    std::string title;\n    std::vector<std::string>\
    \ labels;\n    std::vector<double> values;\n};\n```\n```\n\nFollowing our conventions,\
    \ you can find this in PieChart.h.\n\nWe have now marked the data variables as\
    \ private. This means only member functions of PieChart can see those variables.\n\
    \nThe only member function that modifies the title is setTitle. The only function\
    \ that modifies the list of labels and the list of data points is addEntry. Here\
    \ are their definitions:\n\n```\n```\nvoid PieChart::setTitle( const std::string&\
    \ t ) {\n    title = t;\n}\n\nvoid PieChart::addEntry( const string& label,\n\
    \                          double value ) {\n    labels.push_back( label );\n\
    \    values.push_back( value );\n}\n```\n```\n\nThe interesting point is that\
    \ it is now impossible for labels and values ever to contain a different number\
    \ of elements. This is because the only code that ever modifies them is addEntry\
    \ and that function maintains the guarantee that the two vectors always have the\
    \ same length. We know that there can’t be any other code elsewhere in the project\
    \ that breaks this guarantee because the variables are private. Because we have\
    \ used the private keyword, we only have to check that member functions are well\
    \ behaved to be certain that labels and values have the same number of elements.\n\
