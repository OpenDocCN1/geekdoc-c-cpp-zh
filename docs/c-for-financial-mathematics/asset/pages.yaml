  md: '# **Bugs with pointers**


    Using pointers introduces a number of new kinds of potential bug into our code.


    +   - A *null pointer error*. This is where you try to access data at the memory
    address `nullptr` or `0`.


    +   - A *general protection fault (GP)*, also known as a *segmentation violation
    (SEGV)*. This is where you try and access memory you aren''t allowed to access
    because you are using an invalid pointer.


    +   - A *memory leak*. This is where you call `new` but never call `delete`. Memory
    leaks tend not to be obvious immediately. They usually show up as a program that
    gradually starts running more and more slowly to the point where you have to close
    it and reopen it. Using `shared_ptr` is the best way to avoid memory leaks. There
    are also tools such as `INSURE++` that will help you detect memory leaks.


    These are extremely common problems in C++ code and you are sure to experience
    them at some time.


