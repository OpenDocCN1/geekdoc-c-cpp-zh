  md: '# # Chapter 7

    ## Using C++ Classes


    The types `double` and `int`, etc., are too restrictive. What about complex numbers,
    strings, matrices ...? To make significant progress with C++ we will need to use
    more sophisticated data types. Indeed, as you will discover during this chapter,
    with just a few more data types we will be able to write extremely sophisticated
    programs. For example, in this chapter we will write the code to produce a very
    attractive pie chart. As exercises you will be able to write your own functions
    to produce line plots and histograms.


    To use the new data types we will want some `#include` statements. The correct
    `#include` statements are:


    +   - `#include <string>` to use strings.

    - `#include <sstream>` to use strings efficiently.

    - `#include <vector>` to work with vectors.

    - `#include <fstream>` to work with files.

    - Matrices? There is no built-in type for matrices in C++. You can use a library
    like Eigen, Boost, or Quantlib. Or you can write your own matrix type. We''ll
    do this in Chapter 16.


    We''ll assume that the relevant `#include` statements have all been added to the
    file `stdafx.h` so that we can use all the libraries easily. We''ll also assume
    that you''ve written `using namespace std;` at the top of all your `cpp` files.


    We''ll make this kind of assumption without comment from now on.


    # ## 7.1 Vectors


    A vector in C++ is the name given to a data structure containing an numbered list
    of elements of a given data type. A vector of `double` data corresponds to the
    mathematical notion of a vector. The name of this type in C++ is written as `vector<double>`.


    We''ll now see some examples of how you work with vectors.


    ![](img/c60a618fcc2a2ed9d1e8d96a1b4157ff_119_0.png)'
