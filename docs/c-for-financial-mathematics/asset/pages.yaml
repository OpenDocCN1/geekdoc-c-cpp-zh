    input values.


    3.9.1. Write a recursive function to compute the sum of the numbers between 1
    and $n$.


    3.9.2. Write a recursive function that takes two integer parameters $a$ and $b$
    and prints out all the numbers from $a$ to $b$.


    3.9.3. The $n$-th Fibonacci number can be defined by $x_n = x_{n-1} + x_{n-2}$
    if $n \geq 2$. We define $x_0 = 1$ and $x_1 = 1$. Write a function **fibonacci**
    that evaluates the $n$-th Fibonacci number by recursion. How many times is the
    function **fibonacci** called in order to compute each of $x_2, x_3, x_4$, and
    in general, $x_n$? Don’t worry, we will find a far more efficient way to compute
    the Fibonacci numbers in the next chapter.


    3.9.4. A commonly occurring function in financial mathematics is the cumulative
    normal function defined by:


    ```

    $$\mathbf{normcdf}(\mathbf{x}) = N(x) = \frac{1}{\sqrt{2\pi}} \int_{-\infty}^{x}
    \exp(-t^2/2) \mathrm{d}t$$

    ```


    If $x >= 0$ we define:


    ```

    $$k = 1/(1 + 0.2316419x)$$

    ```


    a good approximation for $N(x)$ is given by:


    ```

    $$1 - \frac{1}{\sqrt{2\pi}} \exp(-x^2/2)k(0.319381530 + k(-0.356563782 + k(1.781477937
    + k(-1.821255978 + 1.330274429k))))$$.

    ```


    For $x <= 0$ you can use the same formula to evaluate $1 - N(-x)$.


    The formula can be derived by choosing the general functional form and then finding
    the coefficients that give the best fit. For this question, you should just accept
    the formula on face value.


    Write a function called **normcdf** to evaluate the cumulative normal function.
    Why would N be a bad name for the function?


    3.9.5. Is $\sqrt{2\pi}$ recomputed every time your **normcdf** function is used?
    Use a global variable to improve this.'
