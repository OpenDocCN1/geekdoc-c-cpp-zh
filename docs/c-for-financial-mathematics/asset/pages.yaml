  md: "The code above is called a class declaration. You can choose whether to put\
    \ a class declaration in a `.h` file or a `.cpp` file. If you want it to be part\
    \ of your library, you put it in the header file. If you are using it to implement\
    \ your library but don’t want anyone else to use it, you put it in the `.cpp`\
    \ file.\n\nIn this case we want the class to be available to users of our library,\
    \ so we’ve declared it in the `.h` file **geometry.h**.\n\nIn the example above:\n\
    \n+   - The name of our class is **CartesianPoint**.\n\n+   - A Cartesian point\
    \ contains two **double** values called x and y. These are called *member variables*\
    \ of the class.\n\n+   - Users of the library are allowed to use the values of\
    \ x and y in their own code, so these are marked as **public**.\n\nWhen writing\
    \ classes one uses the following general syntax for the class declaration:\n\n\
    ```\nclass CLASS_NAME {\npublic:\n    DATA AND FUNCTION DECLARATIONS\nprivate:\n\
    \    DATA AND FUNCTION DECLARATIONS\n};\n```\n\nThe data and functions you declare\
    \ in the section marked **public:** will be available to users of your library.\
    \ The data and functions marked as **private:** are not available to users of\
    \ your library. This allows you to hide information about how your class works.\
    \ This will make your library easier to use and maintain.\n\nSome points to notice\
    \ are:\n\n+   - You can define classes in header files or cpp files. Use header\
    \ files if you want users of the library to use your class.\n\n+   - You must\
    \ remember the semi-colon at the end. You may get very confusing compiler errors\
    \ if you omit it.\n\n+   - Like variable names, class names should contain no\
    \ spaces or strange characters and should start with a letter. It is a good idea\
    \ to use a naming convention so it is easy to distinguish class names and variable\
    \ names. In this book we’ll use the naming convention of writing class names using\
    \ camel case starting with a capital letter. For example, we have the class name\
    \ **CartesianPoint**."
