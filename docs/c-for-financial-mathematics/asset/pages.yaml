  md: "# **3.7 Overloading functions**\n\nIt is possible in C++ to have two different\
    \ functions that share the same name but which take different numbers or types\
    \ of parameters.\n\nFor example, you might write the following two functions which\
    \ are both called **average**.\n\n```\n```\ndouble average(double a, double b)\
    \ {\n    return 0.5 * (a + b);\n}\n\ndouble average(double a, double b, double\
    \ c) {\n    return (a + b + c) / 3.0;\n}\n```\n```\n\nAlthough these functions\
    \ have the same name, they take different numbers of parameters so when you type\
    \ **average(1.0, 2.0, 3.0)** it is possible for the C++ compiler to work out that\
    \ you must want to call the second function.\n\nSimilarly, here are two possible\
    \ **max** functions, one operates on integers and the other on reals.\n\n```\n\
    ```\nint max(int a, int b) {\n    if (a>b)\n        return a;\n    return b;\n\
    }\n\ndouble max(double a, double b) {\n    if (a>b)\n        return a;\n    return\
    \ b;\n}\n```\n```\n\nAgain the compiler can work out which one you are calling.\
    \ The code **max(1, 2)** would call the first version, whereas the code **max(1.0,\
    \ 2.0)** would call the second version. This is desirable because we are avoiding\
    \ unnecessary conversions from *int* variables to *double* variables.\n\nSince\
    \ the identity of a function is determined by both its name and the types of its\
    \ parameters, this combination is called the *signature* of the function. The\
    \ idea is that two people are the same if they have the same signature and similarly\
    \ two functions are the same if they have the same signature.\n\nIf when you call\
    \ a function, there isn’t a version with just the right signature available, C++\
    \ will perform automatic casting if necessary. For example, you can type **max(1,\
    \ 2.0)** and it will call the version of the code that treats all parameters as\
    \ doubles."
