    ```

    $\log(S_{t+\delta t}) = \log(S_t) + Y_t$ (A.1)

    ```


    where the $Y_t$ are independent, normally distributed random variables with some
    fixed mean and standard deviation.


    We can now write each $Y_t$ in terms of some other normally distributed random
