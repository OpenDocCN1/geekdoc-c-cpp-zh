    # **13.5 Limitations**


    We do not claim that the code in this chapter is the last word on pricing a portfolio
    of options. Here are some important limitations.


    +   (i) We are using a fixed number of scenarios and steps in Monte Carlo calculations,
    this should be configurable.


    +   (ii) We haven''t made any attempt to optimise our code.


    +   (iii) We haven''t taken advantage of the multiple CPUs available on modern
    computers.


    +   (iv) Our ContinuousTime0ption and Priceable interfaces are not sufficiently
    general. For example, they cannot cope with discrete time options and options
    on multiple underlying stocks.


    +   (v) When pricing a portfolio by Monte Carlo, it isn''t a good idea to keep
    generating random numbers. It is better to generate all the risk factors in one
    go and then use the same scenarios to price each element. This both involves less
    random number generation and will ensure that hedges cancel each other accurately.


    Many of these limitations will be addressed in later chapters.


