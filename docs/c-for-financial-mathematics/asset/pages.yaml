  md: '+   *   The library `<algorithm>` contains a number of functions that are very
    useful for working with containers such as `find`.


    *   Different data structures have different performance characteristics. You
    should choose your data structure based on how you intend to access and update
    the data.


    *   You should not store large objects in containers. Store them by reference
    using `shared_ptr` instead.


    We should add that although the standard template library is very powerful, it
    is also rather difficult to learn. Unfortunately it makes heavy use of sophisticated
    ideas such as templates and operator over-loading. The syntax chosen for iterators
    also assumes that you are very used to working with pointers and so will find
    the use of `*` and `++` to be natural and convenient.


    When the standard template library was first invented it was rather experimental.
    Time has shown that the object-oriented programming style is quite intuitive.
    For this reason many computer languages include some form of object orientation.
    On the other hand, the standard template library is quite difficult to grasp for
    new programmers. As a result, the use of templates has not been adopted in many
    other languages.


    > **Tip: Use the standard template library, but don’t copy its design.**


    You should know how to use the standard template library as it contains invaluable
    tools. Nevertheless, you should not rush to copy the design of the standard template
    library. See if you can find an object-oriented solution to your problem before
    using templates.'
