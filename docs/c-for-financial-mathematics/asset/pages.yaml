    \ Monte Carlo pricer will require a similar level of work.\n\nThe idea of array\
    \ programming is to exploit the work others have already done writing matrix libraries\
    \ in order to make your numerical code more efficient without doing too much work.\n\
    \nIn array programming, one attempts to replace repetitive operations with matrix\
    \ calculations. For example, when performing a Monte Carlo simulation with 10000\
    \ scenarios, we could replace every vector of length n with a 10000 \\times n\
    \ matrix. By writing our code so that it works with matrices representing all\
    \ the scenarios at once, we can remove most of the for loops from our code and\
    \ turn all the time-consuming parts of our calculation into matrix manipulations.\
    \ The hope is that, if we then use a high-performance Matrix library, our Monte\
    \ Carlo pricer should now perform well too.\n\nThis idea is taken to an extreme\
    \ in array programming languages such as MATLAB. These encourage you to write\
    \ every calculation using matrices. Indeed MATLAB stands for \"Matrix laboratory\"\
    . Another popular example is Python with its numerical library numpy.\n\nBecause\
    \ matrix languages encourage you to work with large matrices, they are able to\
    \ perform numerical calculations extremely rapidly. There is a popular myth that\
    \ C++ code is always faster than code written in other languages. In fact, numerical\
    \ code written in MATLAB or Python can often be much faster than badly written\
    \ C++ code. This is because of the use of the array programming technique.\n\n\
    It is easy to introduce array programming into FMLib, although it is admittedly\
    \ a little tedious. In FMLib16 we have written new versions of all the functions\
    \ in matlib that now operate on matrices instead of vectors. For example, we now\
