    \ declarations for all the functions we wish to make available. It contains both\
    \ the declaration and the definition for PI.\n\nIn general, you should put the\
    \ following in your header file:\n\n+   * (i) The first line `#pragma once`. We'll\
    \ explain why shortly.\n* (ii) Declarations of functions you wish to make available\
    \ from your library.\n* (iii) Declarations of global variables you wish to make\
    \ available.\n* (iv) Definitions of constant global variables.\n\nWhereas in your\
    \ source file you should put:\n\n+   * (i) Definitions of functions declared in\
    \ the header.\n* (ii) Definitions of global variables missing from the header.\n\
    \nWe will expand on these rules throughout this book as we meet more types of\
