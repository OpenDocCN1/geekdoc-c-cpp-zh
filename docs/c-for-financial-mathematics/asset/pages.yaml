    # The recipe for implementing an interface


    ```

    class CLASS_NAME : public INTERFACE_NAME {

    ... declarations for CLASS_NAME ...

    };

    ```


    +   - You will need to provide a new declaration and definition for every function
    defined in the interface INTERFACE_NAME.

    - They must have exactly the same types, `const` declarations, and so forth.


    # 10.3 Examples of interfaces


    Let us recap:


    +   - We had two classes, `PutOption` and `CallOption`.

    - These classes could be used in much the same way, so the code for pricing them
    was almost identical.

    - To avoid duplicating code, we carefully observed which functions `PutOption`
    and `CallOption` had in common.

    - We designed an *interface* which simply listed these common functions, albeit
    using some unusual syntax.

    - We indicated that `PutOption` and `CallOption` implemented the interface.'
