  md: "As an example, the global variables **cin** and **cout** that we have been\
    \ using extensively are actually declared in a namespace called **std**. If you\
    \ were to create your own variables with the same names, you could still refer\
    \ to the familiar variables by using the qualified names **std::cin** and **std::cout**.\n\
    \nIn fact, unless you explicitly declare that you are using a namespace with the\
    \ **using namespace** command, you will have to fully qualify the names. This\
    \ is why all our programs have begun with the line\n\n```\n```\nusing namespace\
    \ std;\n```\n```\n\nThe line above means that we want to use any code in the C++\
    \ standard library without the need to qualify the names. One can get rid of this\
    \ line, but at the expense of needing to fully qualify the variable name as shown\
    \ below:\n\n```\n```\n#include <iostream>\nint main() {\n    std::cout << \"Hello\
    \ World\\n\";\n}\n```\n```\n\nYou can put your own functions into a namespace\
    \ as follows.\n\n```\n```\nnamespace geometry {\n\n    double computeArea(int\
    \ r) {\n        double answer = 0.5 * PI * r * r;\n        return answer;\n  \
    \  }\n\n    double computeCircumference(int r) {\n        double answer = 2.0\
    \ * PI * r;\n        return answer;\n    }\n}\n```\n```\n\nThis code creates two\
    \ functions and puts them both in a namespace called **geometry**.\n\nWe won’t\
    \ write our own namespaces in this book simply because doing so would make our\
    \ code examples a little longer. However, in real code that you expect to use\
    \ in practice and share with other people, you should always use namespaces to\
    \ avoid potential naming conflicts."
