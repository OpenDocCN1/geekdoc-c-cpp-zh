    \    virtual void addTask(\n        std::shared_ptr<Task> task ) = 0;\n    /*\
    \ W a i t u n t i l a l l t a s k s a r e c o m p l e t e */\n    virtual void\
    \ join() = 0;\n    /* F a c t o r y m e t h o d */\n    static std::shared_ptr<Executor>\
