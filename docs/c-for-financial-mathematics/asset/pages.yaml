- pgno: 95
  md: 'declared. So you must always **#include** a file where the function is declared
    if you want to use a function.


    You can think of .cpp files as communicating via the .h files that they include.
    If two .cpp files both #include the same function declarations, then that function
    only needs to be defined in one of the two .cpp files. The same definition is
    shared across multiple files. If two .cpp files don''t have a .h file in common
    that mentions a particular function, then they can''t share that function.


    As a matter of convention, whenever we write a .cpp file we will typically write
    another file with the same name, but the extension .h. This header file contains
    function declarations for all the functions we want to be available outside that
    .cpp file.


    Some people prefer to use the file name extension .hpp for C++ header files and
    leave .h for C header files.


    # 5.3 Creating our project


