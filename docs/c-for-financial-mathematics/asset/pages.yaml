  md: 'these indices go up or down, the tracker fund manager still makes money. They
    are purely interested in selling financial products to buy-side investors. So,
    tracker fund managers can be thought of as part of the *sell side*.


    Banks are on the sell side. One part of their business is maintaining deposit
    accounts for customers and also giving loans. This part of their business is partly
    acting as a broker between people who want to save and people who want to borrow,
    and partly a matter of managing the risks of lending money. Another part of a
    bank’s business is assisting companies with valuation, publicity, and so forth
    when those companies decide they want to float on the stock market. As you can
    see from these examples, the focus of banks is on providing a service rather than
    on speculation.


    This book focuses on the part of a bank’s business where they sell derivatives,
    typically to other members of the financial services industry. Derivatives are
    financial products that are designed to make it easier to manage risk.


    One simple example of a derivative is a *call option*. A call option is a financial
    product that is a promise to pay at some fixed time T an amount


    ```

    max{ST − K, 0}

    ```


    where $S_{T}$ is the price of a stock at time $T$ and $K$ is some pre-agreed amount
    called the *strike price*. If you are absolutely confident that the stock price
    will not fall below $100 then you will make more money by investing in a call
    option with strike of $100 than you would by investing in just the stock. However,
    if it turns out you are wrong and the stock price does fall below $100, you will
    lose everything. So, buying a call option is a riskier strategy than investing
    in the stock, but potentially more rewarding. A less risk-averse investor might
    prefer to invest in a call option rather than in the stock itself.


    Banks provide a large range of financial derivatives that allow investors to tailor
    their investments to very precisely match their beliefs and risk preferences.
    What banks wish to do is to sell such products to their customers without taking
    on any significant risk themselves. They are interested in making money from charges,
    or equivalently, by adding on a small profit margin to all the prices that they
    quote.


    If you are going to promise to pay someone an amount equal to the value of the
    S&P 500 in one year’s time, it is rather obvious how to hedge this risk: simply
    invest in the stock market in the proportions of the S&P 500. From this it is
    easy to work out the minimum you should charge a customer in exchange for making
    this promise if you want to guarantee that you don’t make a loss. Note that hedging
    a risk simply means finding an investment strategy you can use that counteracts
    that risk.


    It turns out that derivatives such as options can also be hedged very effectively
    by following certain somewhat elaborate strategies. This means that banks can
    sell derivatives to their customers without taking on significant risk. Customers
    gladly buy the derivatives because they do not have the time, expertise, inclination,
    or scale to follow the required hedging strategies themselves. Banks gladly take
    on the work, because they know that they will be'
