- pgno: 101
  md: 'This issue is not so pressing if you are the only person who ever uses your
    code, but if you work in a team it is absolutely essential.


    As a very practical matter, if you have a job writing software and your software
    goes wrong for some reason, then the chances are high that you will be asked to
    fix it. As a result, the more people use your code, the more likely you are to
    get phoned in the middle of the night and asked to debug that code! This means
    that is essential that you only let people use the code that is of sufficient
    quality to be shared with the team. This means it should work perfectly, be well
    documented, and be thoroughly tested. In practice you can’t write all your code
    to this standard, so it is vital to be clear which parts of your code are ready
    to be shared and which parts are for personal use only. If you don’t declare your
    functions in header files, then that code can’t be shared by other files and so
    *cannot* be used. This means that you can improve your chances of an undisturbed
    night’s sleep if you keep the contents of your header files down to a minimum!


    > **Old Joke:** Programming is like sex. One mistake and you have to support it
    for the rest of your life.


    Although simply not including things in the header files is the main way of achieving
    information-hiding, you can go further with the `static` keyword.


    You should try to use the `static` keyword on all variables and functions that
    are *not* in your header file. For example, one might write the following in a
    `.cpp` file:


    ```

    ```cpp

    static const double SQRТ_2_PI = 2.507;

    ```

    ```


    This is flawed code in that it is a very low-precision estimate of $\sqrt{2\pi}$.
    This might not be a big problem for your particular application, but you wouldn’t
    want other people using this in their calculations. That sort of thing results
    in phone calls in the middle of the night.


    By marking this function as `static` we are saying it can only be used in the
    current source file. This means that we can reuse the name in other source files
    if desired. It is technically possible (but unlikely) for someone to use a function
    defined in another file without declaring it in a header file. Using the keyword
    `static` prevents this trick altogether.


    > **Danger!**


    If you are a Java programmer, notice that this has nothing to do with the Java
    keyword `static`.'
