- pgno: 124
  md: 'A: Value of x is 10

    B: Value of x is 11

    C: Value of x is 11


    The only important difference is the & symbol used in the definition of **printNextValue2**.
    In this case the parameter **x** is *passed by reference*. This means that the
    variable *x* in the function **main** is actually modified by **printNextValue2**.
    The function is not passed a copy of the variable, but instead is asked to modify
    the variable itself.


    We say that the function **printNextValue** which uses pass by value has no *side
    effects* since the function simply performs the computation you expect. On the
    other hand, **printNextValue2** has the side effect of unexpectedly changing the
    value of **x**.


    As we will see in the next section, there are times when you might actually want
    a function to change the values of the data that you pass as parameter. When this
    happens, it is good practice to make sure this is obvious from the name of the
    function. If **printNextValue2** was instead called **incrementAndPrint** it would
    not be such a confusing function. Its name would make its behaviour clear. In
    general, programmers assume that a function won''t change the parameters passed
    to it unless the documentation makes that very clear. As a result, just as in
    medicine, unwanted side effects are usually considered a bad thing.


    This would seem to suggest that you should rarely use pass by reference. However,
    when you pass large objects around, passing data by reference can be much quicker
    than passing a copy by value. This is because creating a copy of a large object
    can take a lot of time. With pass by reference there is no need for any copying.
    Pass by reference works by telling the function you are calling whereabouts in
    memory your data can be found. Your data is read, and potentially modified, in
    situ.


    **Tip: When to use pass by reference (&)**


    When passing objects, pass them by reference as your default choice.


    When passing the primitive data types **double**, **int**, and **bool**, pass
    by value is perhaps marginally quicker, so for these data types it is conventional
    to use pass by value.


    # ### 7.2.2 The const keyword


    We seem to be caught between two alternatives: Pass by reference is quick but
    potentially confusing; pass by value is slow but should not cause confusion.


    There are two possible solutions.


    +   - Use pass by reference but take care not to actually modify the parame-'
