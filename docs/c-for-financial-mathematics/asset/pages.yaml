  md: "There are several things to observe about these function definitions.\n\n+\
    \   (i) When you define a member function of a class, you must always specify\
    \ the name of the class in the definition. The syntax is: `CLASS_NAME::FUNCTION_NAME`.\
    \ If you forget to do this you'll get linker errors saying you've forgotten to\
    \ define the function. The reason why you must specify the name is that many classes\
    \ may have functions of the same name. For example, we might have a class `Square`\
    \ which also has an `area` function. This is why you need to say which class's\
    \ method you are actually implementing.\n\n+   (ii) The `Circle` class's member\
    \ functions are able to access the member variable `radius` and the global variable\
    \ `PI`.\n\n# 8.3.1 Using const on member functions\n\nAs we mentioned when the\
    \ `const` keyword was introduced in Section 7.2, if you are going to use `const`\
    \ at all, you must use it consistently throughout your code. If you have decided\
    \ to use `const`, then if a member function doesn't change the object, you should\
    \ mark it as `const`. You do this by writing `const` at the end of the declaration\
    \ and definition.\n\n```\nclass Circle {\npublic:\n    double radius;\n    double\
    \ area() const;\n    double circumference() const;\n};\n\n/**\n *  Computes the\
    \ area of a circle\n */\ndouble Circle::area() const {\n    return PI*radius*radius;\n\
    }\n```\n\nIn this example we note that measuring the area of a circle doesn't\
    \ change the circle in any way. This is why we have added `const` to the declaration\
    \ of the `area` function.\n\nWe have then added it to the definition as well because\
    \ the use of `const` and `&` must exactly match between a functions declaration\
    \ and definition. If they don't match exactly, you will get linker errors. It\
    \ is worth experimenting with seeing what errors actually occur if you don't have\
    \ matching `const` statements.\n\nWhen you pass a reference to `const Circle`\
    \ as a parameter to a function, the compiler will insist that the function does\
    \ not modify that circle. This means that you won't be able to call any of the\
    \ functions on the circle except"
