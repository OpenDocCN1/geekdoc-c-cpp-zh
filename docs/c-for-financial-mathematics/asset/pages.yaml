    The assumption that one can buy and sell any desired amount of stock and that
    one can lend or borrow unlimited amounts all at the same rate is a simplifying
    assumption. The essence of this assumption is that one is a small player in a
    large market and that the costs of trading are negligible. Notice that we allow
    one to sell stock one does not own in order to obtain a portfolio containing a
    negative quantity of stock. This is just a mathematical shorthand for borrowing
    stock off someone else in the same way that a negative bank account is shorthand
    for being in debt.


    Under this assumption, it is always possible to trade in stock to ensure that
    the delta of your portfolio is 0. This means that, to first order, the value of
    your portfolio will not change when the stock price changes. This is as good a
    hedge as it is possible to make at any one time. The delta hedging trading strategy
    is to regularly trade in stock in order to ensure that the delta of one''s portfolio
    is always close to zero. This trading strategy is the key to the success of risk-neutral
    pricing.


    A trader who pursues this strategy charges the risk-neutral price for derivative
    products and then follows the delta hedging trading strategy. The idea is that
    since the sensitivity to changes in the stock price is kept at 0, this strategy
    should be close to risk free (at least if one measures risk using the Q probabilities).
