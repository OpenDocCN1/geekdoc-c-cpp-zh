    has been enhanced so that it stores the name of a single stock. It implements
    **getStocks** by returning this name. **ContinuousTimeOptionBase** also implements
    the payoff function that takes a **MarketSimulation** as a parameter by extracting
    the matrix of stock price paths for this single stock and then calling an abstract
    function, which is also called **payoff** but which takes a single **Matrix**
    as parameter. Since all our existing subclasses of **ContinuousTimeOptionBase**
    already implement this second version of the payoff function, they will now automatically
    implement the modified **ContinuousTimeOption** interface.


