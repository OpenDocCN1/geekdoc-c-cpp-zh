  md: 'Derivatives traders are largely indifferent to whether a stock goes up or down
    in much the same way as bookmakers are indifferent as to which horse wins a race.


    Since the margin between the buy and sell prices of both bookmakers and banks
    are rather small, they find it a useful approximation to think of themselves as
    offering a single price at which they will either buy or sell. In practice, both
    banks and bookmakers can first choose a self-consistent set of prices at which
    they are willing to either buy or sell. Then when a customer asks to buy a particular
    product, they quote a slightly higher price, and a slightly lower price when their
    customer wishes to sell. In this way, they expect to make a small profit from
    each event that their customers bet on.


    It is vital that the prices offered by the bank or the bookmaker are self-consistent
    in some sense. What they don’t want to happen is for a customer to be able to
    place a complex bet that the customer knows they are guaranteed to win. Such a
    bet is called an arbitrage.


    To ensure that such a bet is impossible, bookmakers price their bets *as if* the
    cost of a bet was determined by the expected payoff in some probability model.
    As one knows, the odds offered by bookmakers *look* as though they are derived
    from the probability of each horse winning. Yet as we have discussed, those prices
    are derived by considering the market for bets and not by considering the real
    chance of those events occurring.


    Derivatives traders work in exactly the same way. One slight difference is that
    derivatives traders offer bets over longer time periods than bookmakers, so they
    factor charging and paying interest into their calculations.


    The probability model used by bookmakers and derivatives traders is called a $\mathbb{Q}$-measure
    model. This is a model that looks exactly like an ordinary probability model,
    but the values it computes are measures of price and not measures of the chance
    of an event happening. A classical probability model that attempts to measure
    the chance of an event taking place is called a $\mathbb{P}$-measure model.


    If the interest rate for a risk-free bank account is at a constant level *r* so
    that a principal *P* invested is worth *Pe* ${}^{rt}$ at time *t*, then the amount
    charged by a derivatives trader for an option that pays *f*(*S* ${}_{T}$) at time
    *T* is given by the following formula:


    ```

    Risk neutral price $: = e^{-rT} \mathbb{E}_{\mathbb{Q}}(f(S_T))$.

    ```


    Here $\mathbb{E}_{\mathbb{Q}}$ denotes the expectation taken using the $\mathbb{Q}$-measure
    model. The factor *e* ${}^{-rT}$ is a discount factor to take account of interest
    payments. The motivation for calling this price the “risk neutral price” will
    be explained shortly.


    Notice that if you invest an initial sum *P* in the risk-free bank account, then
    the payoff will be *Pe* ${}^{rT}$ and is independent of the stock price. Hence,
    its expectation in the $\mathbb{Q}$-measure model will also be *Pe* ${}^{rT}$.
    So the “risk neutral” valuation of a bank account in which *P* is invested at
    time 0 is:


    ```

    *e* ${}^{-rT}\ \mathbb{E}_{\mathbb{Q}}(Pe^{rT}) = P$.

    ```'
