- pgno: 269
  md: 'ments from your code as bugs are found and fixed. The `DEBUG_PRINT` macro from
    our testing framework is meant to help with this as it allows you to switch debugging
    on and off without needing to actually delete the lines. See Section 15.4.6 for
    a brief discussion of other logging frameworks.


    # 15.1.4 Using a debugger


    The error messages produced by C++ when it is running can be very unhelpful. Sometimes
    a program will crash without providing any clue as to where in the code the problem
    occurred.


    A *debugger* is a tool that helps alleviate this problem.


    Recall that the compiler turns your C++ code into machine code. During this process,
    the code turns from something you wrote and understand into something that you
    didn’t write and don’t understand. This is a serious problem. To alleviate the
    problem, you can compile your code with additional debugging information that
    links your source code to the machine code that is being executed.


    If you have compiled your program with the necessary debugging information, then
    it is possible to run your program inside a debugger. The debugger will then allow
    you to step through your code line by line to see what is happening. It will also
    translate between the machine code and your source code so you can understand
    what is going on. In addition you can tell the debugger to pause the execution
    whenever an error is detected. This allows you to gather detailed information
    about the cause of the error. We will describe how to use the Visual Studio debugger
    on Windows in Section 15.2, and how to use the GDB debugger on Unix in Section
    15.3. Other debuggers work in a similar way. You should consult their documentation.


    # 15.1.5 Divide and conquer


    If you have a difficult bug to fix, it can be very useful to know the following
    algorithm for debugging code.


    +   (i) By considering which of your unit tests pass and which fail, decide which
    area of your code contains the error.


    +   (ii) Consider how to divide the code that contains the bug into two roughly
    equally sized pieces. What tests can you run to determine which of these two pieces
    actually contains the error?


    +   (iii) Write the tests. Repeat this process until you have fixed the bug.


    The important point is that one should not look at all your code and read through
    it. This approach is very time-consuming and unlikely to work. Instead, this approach
    uses a *divide and conquer* strategy. At each stage we halve the size of the problem.'
