  md: '# Introduction


    The aim of this book is teach you C++ from scratch using examples from financial
    mathematics. It is a streamlined account of the features of C++ that are most
    useful to a financial mathematician.


    Throughout the book we will focus on a key recurring example: How do you price
    a portfolio of financial derivatives? We will use this example to show


    +   - How to use C++ language in practice

    - What kinds of problems banks face

    - The skills you need to solve them


    These skills include C++ programming skills and mathematical skills but also include
    testing, debugging, design, and software architecture.


    The financial mathematics knowledge needed for this book has been kept to a minimum
    and is summarised in Appendix A.


    # Why should you learn C++?


    There are many jobs in the finance industry which require sophisticated mathematical
    skills. One of those roles is being a “quant developer”. A quant developer’s task
    is to implement the ideas of financial mathematics in practice to produce practical
    systems to price, trade, and risk manage complex financial products. This book
    is aimed at people who already know the mathematics and want to learn the programming
    skills of a quant developer.


    C++ is a programming language. It is just one of many languages that can be used
    for performing financial calculations. When banks began to develop their trading
    and risk management platforms, many of them decided that they would write them
    in C++. As a result, C++ is one of the most sought-after programming skills for
    quant-developer jobs.


    However, it would be wrong to say that C++ is the only programming language worth
    knowing if you want to be a quant developer. Languages such as C#, Java, MATLAB®,
    and Python are all heavily used in the financial industry. For someone new to
    programming, the biggest practical difference between C++ and these other languages
    is that C++ is much harder to learn!'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'But as a result, C++ skills are also particularly highly valued. Moreover,
    once you know C++ you will find any of these other languages easy to learn.


    In summary, C++ is the language to learn if you want to open up the maximum number
    of employment possibilities in quant-developer roles. Of course, this probably
    won''t be true forever as technologies do change. So before buying this book,
    have a search online for your dream job. If C++ is one of the skills required,
    read on.


    # ## Pricing a portfolio


    This book will focus throughout on financial examples. As we introduce features
    of C++ we will show how they can be used to solve real financial problems. Indeed,
    we will focus on a single important financial problem: How do you compute the
    price and risk of a portfolio of complex financial products? This is just a simplified
    version of the real problem faced by a bank of valuing and measuring the risk
    of their entire position.


    It is important to see just how complex this question really is. So let us examine
    it in more detail.


    Any major bank will trade on many different exchanges. Famous examples include
    the New York Stock Exchange and the London Stock Exchange. However, there are
    many other less-famous exchanges in cities throughout the world.


    Each stock exchange has its own trading rules. Obviously there is some attempt
    to rationalise things on national and international bases, but contracts and conventions
    can, and do, vary from market to market.


    Of course, one doesn''t just trade in stocks. One can also trade in stock derivatives,
    currencies, currency derivatives, government bonds, municipal bonds, commodities,
    electricity, etc.


    Now let us return again to the problem of calculating the current value of a bank''s
    overall position and the riskiness of that position. Given the complexity of a
    bank''s total position, and the total amount of detail in all the contracts they
    have entered into, one sees that this is a daunting task. No individual is ever
    likely to understand every detail of the calculation.


    **Problem 1.** *How do you write software so that no individual has to understand
    everything that is going on?*


    **Problem 2.** *How do you write software so that a team of hundreds can work
    on the software at the same time without getting in a mess?*


    **Problem 3.** *How do you write code that is easy for others to understand?*


    Another important consideration is that the results of a computer error in financial
    applications can be catastrophic. If Adobe Acrobat crashes,'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'you might swear under your breath. When Barclay''s cash machine network crashed,
    it was headline news in the UK. If your trading algorithm throws away half a billion
    dollars, it is unlikely that you will get as large a bonus as you were hoping
    for.


    **Problem 4.** *How do you write code that doesn''t contain bugs? How do you ensure
    that there are no bugs in the code written by a team of hundreds?*


    **Problem 5.** *Given that you probably can''t guarantee that there are no bugs,
    how do you ensure that the effects of a bug are not too harmful?*


    Every day, new financial products are invented and creative new financial contracts
    are devised and sold. It must be possible to rapidly update the software used
    by a bank to reflect these new contracts. While Microsoft only releases a new
    version of its operating system periodically, banks update their software on an
    almost daily basis.


    **Problem 6.** *How do you write code that can be extended easily and rapidly?*


    **Problem 7.** *How do you ensure that no bugs have crept into the latest version
    of your code, given that you plan to release a new version almost daily?*


    **Problem 8.** *How do you release new code, when all the software has to keep
    running 24 × 7?*


    If a bank is doing well, their business should be expanding. The bank will be
    moving into new markets and the data volumes in existing markets will be growing
    exponentially. Nobody wants investments that have sub-exponential growth!


    **Problem 9.** *How can you ensure that your software will continue to work with
    exponentially increasing data volumes?*


    We can broadly categorise all of these problems as problems of *scalability* and
    *maintainability*. These problems are the biggest IT problems that banks face.
    It is these problems that explain why such a large proportion of the employees
    in the finance sector in fact work in IT rather than finance. And it is problems
    of this sort that *object-oriented programming* was designed to address.


    In this book we will show you how to use the object-oriented features of C++ to
    solve these problems. In addition we will show you how to use other important
    programming techniques such as testing, debugging, and design, all of which are
    essential to building complex financial software.


    # ## Why do banks use C++?


    We have already discussed why you should learn C++. In case you''ve forgotten,
    it is to get a job in finance. But why do banks choose to use C++?'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'Back in 1969, development had started on the computer language C. It quickly
    caught on because it allows you to write very fast code reasonably easily. Unfortunately
    that code can be difficult to maintain.


    C++ first appeared in 1983. It promised to combine the speed of C with the scalability
    and maintainability of object-oriented programming techniques. By the 1990s C++
    was a mature language which seemed to hold the promise of solving the software
    problems faced by large financial institutions. This is why banks started developing
    in C++.


    The reason that banks have continued to develop in C++ is that once you have written
    a lot of code in one language (and trained your teams to program in that language)
    it is very expensive to start again in a different language.


    These days there are many other languages available that you can use for developing
    financial software. Some, such as Python, Mathematica, and MATLAB allow you to
    quickly prototype mathematical ideas but aren''t as good for writing large, high-performance
    systems. Others such as C# and Java are often used for high-performance systems,
    but just weren''t mature enough technologies when banks started their development.
    Nevertheless, many new institutions such as hedge funds choose to use these more
    recent languages rather than C++. The people who have invented these newer languages
    have focussed more heavily on making these languages easy to learn.


    One point that is worth emphasising is that many people believe C++ is used because
    it is the fastest language. It is true that C++ code has the potential to match
    or outperform other code, but it can require great skill and effort to achieve
    this potential. The reasons for using C++ involve many subtle considerations other
    than just speed.


    In fact, many banks might not choose to use C++ if they started writing their
    code again today. They continue to use it as the most pragmatic option for their
    business. In much the same way, it is probably the most pragmatic choice of language
    for you to choose to learn if you want to work in the banking sector.


    # Example: Slang


    Not all banks choose to use C++ for their quant development. Goldman Sachs makes
    heavy use of a language called Slang. Never heard of it? That''s because Goldman
    Sachs invented the language themselves.


    Deciding what language you will write your software in is a major decision. Not
    only does it affect how easy your system will be to write and maintain, it has
    more subtle repercussions such as how easy it is to hire people and how good their
    job prospects are. Do you think it is easy to recruit Slang developers? Do you
    think Slang developers are highly sought after outside of Goldman Sachs?


    Once you have chosen your language and built a system it will cost a lot'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'to move to a new language. For better or worse, many banks are stuck with C++
    and for better or worse Goldman Sachs is stuck with Slang.


    The point to emphasise is that C++ is not necessarily “the best language” for
    financial mathematics. A good quant-developer might decide to use R for statistical
    analyses, Python for prototyping, C# for developing user interfaces, Excel for
    their tax returns, and only use C++ to develop code for a legacy trading system.
    This book focuses on C++, but don’t close your eyes to other languages.


    # ## How to use this book


    The accompanying website for this book<sup>1</sup> contains C++ code you can download
    and run. This consists of a number of software projects that start from humble
    beginnings and culminate in a sophisticated financial mathematics library. This
    gives a concrete demonstration of how one can develop complex software through
    an incremental process of testing and refactoring. You will find it helpful to
    download the code for each chapter so you can refer to it easily.


    C++ is a computer language. It is almost impossible to learn a language without
    attempting to speak it! So to get the most out of this book, it is crucial to
    do as many exercises as possible. The solutions to many of the exercises form
    an integral part of the software developed in this book. As a result the solutions
    to many of the exercises can be found by looking ahead at the code for later chapters.
    The accompanying website for this book contains a solutions guide which shows
    you where to find the answers to these key exercises.


    The order of the chapters has been carefully chosen so that the most useful aspects
    of C++ are taught first. Therefore, if you are using this book for self study,
    I recommend that you work through the chapters in order, completing the exercises
    as you go. If you are using this book as the basis of a lecture course, then the
    material should be taught sequentially. Chapter 14 and Chapter 15 may be omitted
    without loss of continuity. Chapter 14 shows how to simulate delta hedging in
    C++. It is of considerable mathematical interest, but the programming interest
    is primarily in the exercises. These challenge the reader to design their own
    polymorphic classes. Chapter 15 discusses debuggers and other development tools.
    This is very useful practical information, but is perhaps better suited to an
    interactive class than a formal lecture course.'
