- pgno: 2
  md: '# CHAPMAN & HALL/CRC

    Financial Mathematics Series


    **Aims and scope:**

    The field of financial mathematics forms an ever-expanding slice of the financial
    sector. This series aims to capture new developments and summarize what is known
    over the whole spectrum of this field. It will include a broad range of textbooks,
    reference works and handbooks that are meant to appeal to both academics and practitioners.
    The inclusion of numerical code and concrete real-world examples is highly encouraged.


    **Series Editors**

    M.A.H. Dempster

    *Centre for Financial Research*

    *Department of Pure Mathematics and Statistics*

    *University of Cambridge*


    Dilip B. Madan

    *Robert H. Smith School of Business*

    *University of Maryland*


    Rama Cont

    *Department of Mathematics*

    *Imperial College*


    **Published Titles**

    American-Style Derivatives; Valuation and Computation, *Jerome Detemple*

    Analysis, Geometry, and Modeling in Finance: Advanced Methods in Option Pricing,
    *Pierre Henry-Labordère*

    C++ for Financial Mathematics, *John Armstrong*

    Commodities, *M. A. H. Dempster and Ke Tang*

    Computational Methods in Finance, *Ali Hirs*a

    Counterparty Risk and Funding: A Tale of Two Puzzles, *Stéphane Crépéy and Tomasz
    R. Bielecki*, *With an Introductory Dialogue by Damiano Brigo*

    Credit Risk: Models, Derivatives, and Management, *Niklas Wagner*

    Engineering BGM, *Alan Brace*

    Financial Mathematics: A Comprehensive Treatment, *Giuseppe Campolieti and Roman
    N. Makarov*

    The Financial Mathematics of Market Liquidity: From Optimal Execution to Market
    Making, *Olivier Guéant*

    Financial Modelling with Jump Processes, *Rama Cont and Peter Tankov*

    Interest Rate Modeling: Theory and Practice, *Lixin Wu*

    Introduction to Credit Risk Modeling, Second Edition, *Christian Bluhm, Ludger
    Overbeck, and Christoph Wagner*

    An Introduction to Exotic Option Pricing, *Peter Buchen*

    Introduction to Risk Parity and Budgeting, *Thierry Roncalli*

    Introduction to Stochastic Calculus Applied to Finance, Second Edition, *Damien
    Lamberton and Bernard Lapeyre*

    Monte Carlo Methods and Models in Finance and Insurance, *Ralf Korn, Elke Korn,
    and Gerald Kroisandt*

    Monte Carlo Simulation with Applications to Finance, *Hui Wang*'
