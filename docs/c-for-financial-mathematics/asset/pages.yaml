  md: "As a somewhat contrived example, let us suppose that we have found a performance\
    \ problem in our code. We suspect it is something to do with the `evaluate` function\
    \ of a class we have written to compute the `sin` function. As part of debugging\
    \ this we want to count just how often this method is called. Here is one way\
    \ we could do this:\n\n```\nclass CallCountedSin : public RealFunction {\n  public:\n\
    \    static int getNumberOfCalls();\n    double evaluate(double x) {\n      numCalls++;\n\
    \      return sin(x);\n    }\n  private:\n    static int numCalls;\n};\n```\n\n\
    Our class `CallCountedSin` acts like the `sin` function, but also counts the number\
    \ of times `evaluate` is called on `any` instance. We have a `static` member variable\
    \ to save the number of calls and a `static` member function to read the value.\n\
    \nThe definition of the function looks just like an ordinary member function.\n\
    \n```\nint CallCountedSin::getNumberOfCalls() {\n  return numCalls;\n}\n```\n\n\
    Notice that this function it is not allowed to access any variables other than\
    \ those that are `static`.\n\nHere is how we initialize the static variable `numCalls`:\n\
    \n```\nint CallCountedSin::numCalls = 0;\n```\n\nThis looks pretty much like a\
    \ global variable definition. In a sense, that is exactly what it is. The difference\
    \ is that we have associated the variable `numCalls` with the class `CallCountedSin`.\
    \ This is an improvement over having a global variable called `numCalls` because\
    \ the static variable can be declared private. This means it is impossible for\
    \ it to be used by any function in another class.\n\nHere is an example of how\
    \ you actually call a static function:\n\n```\nvoid testCallCountedSin() {\n \
    \ CallCountedSin instance1;\n  CallCountedSin instance2;\n  integral(instance1,\
    \ 0, 1, 1000);\n  integral(instance2, 0, 1, 1000);\n  int numCalls=CallCountedSin::getNumberOfCalls();\n\
    \  ASSERT(numCalls == 2000);\n```"
