  md: '# ## Chapter 10


    # ### Interfaces


    To complete Exercise 9.3.1 to price a PutOption in the last chapter you should
    have written a function that was simply a copy of the code for a CallOption except
    that the type of the option has changed. This violates the “Once and Only Once”
    principle (see Section 3.1).


    In this chapter we will see how to write a function that can price an infinite
    number of option contracts by Monte Carlo. It will work equally well with put
    options, call options, digital put options, digital call options, and even options
    with payoff functions we''ve not thought of yet. The possibilities are endless.


    # #### 10.1 An interface for pricing options


    A path-independent option is an option whose payoff is completely determined by
    the stock price at maturity. For example, put options, call options, digital put
    options, and digital call options are all examples of path-independent options.
    By contrast, a knock-out option depends not just on the final stock price but
    upon the entire history of the stock price. This is why a knock-out option is
    called a path-dependent option.


    We would like to write a function price which takes two parameters:


    +   - a path-independent option,

    - a BlackScholesModel object,


    and which returns the risk-neutral price of the option. The function will compute
    the risk-neutral price using the following procedure.


    +   - Compute a large number of possible stock price scenarios at the maturity
    of the option.

    - Compute the option''s payoff in each scenario.

    - Compute the average payoff and discount by the risk-free rate to get the current
    price of the option.'
