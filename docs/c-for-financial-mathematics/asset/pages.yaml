  md: '# ## Chapter 6


    # ### Unit Testing


    A revolution occurred in computer programming in the late 1990s (which some banks
    are still struggling to catch up with). The revolutionary idea was that you should
    write automated tests for all of your code.


    Actually it wasn’t such a new idea. Computer programming veterans tell me that
    in the 1960s and early 1970s, testing your code was commonplace. But somehow lots
    of development teams forgot about it. It became quite normal to write code without
    any automated tests. This code was typically very expensive to maintain (with
    an army of manual testers) and was very prone to bugs.


    If you are old enough to remember software from the 1990s, then you might have
    noticed that software doesn’t crash as much as it used to. I put this down, at
    least in part, to the automated testing boom.


    The basic ideas of unit testing are as follows.


    +   (i) Every function (near enough) should have at least one test.


    +   (ii) All tests should be fully automated.


    +   (iii) You should assume that code that is not tested does not work.


    +   (iv) You should keep your tests forever.


    Naturally, some manual testing is also required, but this should be much more
    along the lines of acceptance and usability testing. For example, finding out
    whether your music download app is *easy to use* would need some manual testing.
    Testing if your music download app actually *works* should be automated.


    If you attempt to write any C++ code that is more than a few lines long, you will
    probably write a bug. This is partly because you are new to C++, but mostly because
    you are human and humans make errors constantly. Just as you can be pretty sure
    that your calculus computation is wrong unless you’ve double-checked it, you can
    be pretty sure that C++ code is wrong unless it has a unit test.


    One possible way to test your code is to write a main method to test the bit you
    are working on. The problem is that you find yourself constantly recreating tests
    that you have written before when you need to fix bugs.


    The solution is to:'
