  md: 'In [2], Black and Scholes proposed that the continuous-time version of this
    model could be used as a \( \mathbb{P} \)-measure model for stock prices. For
    this reason we will sometimes refer to this model as the Black–Scholes model for
    stock prices.


    To answer whether it is a good \( \mathbb{P} \)-measure model, one would need
    to perform statistical tests to see how well the model fits real-world data. The
    data suggests that this is only a rather crude approximation of the real behaviour
    of stock prices. One notable gap in the model is that it underestimates the probability
    of large changes in the stock price. Another notable gap in the model is that
    the volatility is constant, but it appears to change over time. For real financial
    applications, therefore, the discrete-time geometric Brownian motion might not
    be a good choice of \( \mathbb{P} \)-measure model for stock prices. However,
    for teaching purposes it is a good choice because it is relatively easy to write
    down and analyse.


    Is discrete-time geometric Brownian motion a good choice for a \( \mathbb{Q} \)-measure
    model of stock prices? In general it is not, because it would give inconsistent
    price information. Recall that in a \( \mathbb{Q} \)-measure model the price of
    financial products is given by the discounted expected value of the financial
    product. We can use this to calculate that the stock price at time 0 is given
    by:


    ```

    $$S_0 \exp((\mu - r)t).$$

    ```


    On the other hand, by definition the stock price at time 0 is \( S_0 \). Therefore
    discrete-time geometric Brownian motion can only be a \( \mathbb{Q} \)-measure
    model if we have \( \mu = r \) where \( r \) is the risk-free interest rate. We
    make the following definition.


    **Definition.** The \( \mathbb{Q} \)-measure geometric Brownian motion model for
    the stock price is given by


    ```

    $$\log \left( \frac{S_{t+ \delta t}}{S_t} \right) = \left( r - \frac{1}{2} \sigma^2
    \right) \delta t + \sigma(\delta t)^{ \frac{1}{2}} \epsilon_t . \tag{A.5}$$

    ```


    It is important to notice that most people would agree immediately that this is
    not a plausible \( \mathbb{P} \)-measure model. The motivation of most investors
    for investing in the stock market is that they expect a better rate of return
    from stocks than from risk-free investments. It follows immediately for these
    investors that their \( \mathbb{P} \)-measure model cannot be a \( \mathbb{Q}
    \)-measure model. In the case of the model (A.4) one would expect that a \( \mathbb{P}
    \)-measure model would have \( \mu > r \). This is where the phrase *risk neutral
    pricing* comes from. The \( \mathbb{P} \)-measure and the \( \mathbb{Q} \)-measure
    only coincide for highly unusual investors who are indifferent as to whether their
    investments are risky. Such investors are called *risk-neutral* investors. Typical
    pensions investors are *risk averse*. Gambling addicts are *risk seeking*.


    While we have seen that Equation (A.5) is not a good \( \mathbb{P} \)-measure
    model for anyone but risk neutral investors, is it a good choice of \( \mathbb{Q}
    \)-measure model? It is certainly a probability model that gives the correct initial
    value of the'
