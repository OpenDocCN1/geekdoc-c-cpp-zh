  md: 'use an appropriate class with a destructor that performs the clean-up. This
    is summarised by saying that:


    - resource acquisition is initialisation;

    - resource release is deletion.


    When we introduced destructors in Section 16.2, the resource we wished to manage
    was memory. In this section we are viewing holding a lock as another form of resource
    acquisition. In both cases there is a limited supply of the resource that needs
    to be managed: A computer has finite memory; only one thread can hold a lock.


    If you do not use mutual exclusion locks, you have very little guarantee about
    the order in which code will be executed (or appear to be executed). Two problems
    one has to consider when one doesn''t use mutual exclusion locks are: The compiler
    may decide to optimise the code by reordering certain sections; processors have
    caches that contain data that may not be written to main memory for some time.
    C++ does contain some classes to enable you to write multi-threaded code without
    using mutual exclusion locks, but this is a specialist subject beyond the scope
    of this book.


    # Danger!


    The compiler can reorder your code as part of the optimisation process. If you
    don''t use locks you have very little guarantee on what order code executes. In
    other words, if you don''t use locks some very strange bugs will occur.


