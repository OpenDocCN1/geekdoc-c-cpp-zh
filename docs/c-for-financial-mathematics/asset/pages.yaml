  md: '# ## 11.2 Pointers


    # ### 11.2.1 new and delete


    Because arrays are not flexible enough, the C language also contains the concept
    of a pointer. This allows a C programmer to work with sequences of data of varying
    lengths.


    ```

    ```

    int n = 5;

    int* myArray = new int[n];

    for (int i=0; i<n; i++) {

    cout<<"Entry "<<i<<"=";

    cout << myArray[i];

    cout << "\n";

    }

    delete [] myArray;

    ```

    ```


    The code above uses the `new...[]` operator to allocate a chunk of memory. In
    this case we are creating a sequence of `int` data types in memory, but you could
    use other data types instead.


    The good news is that you can choose the size of the chunk of memory at run time.
    Unlike with an array, you don''t have to choose the size in advance when you write
    your program.


    The downside of using `new []` is that the memory will *not* be automatically
    deleted when the variable goes out of scope (see Section 4.7 for the meaning of
    the word *scope*). You must use `delete []` to free the memory created with the
    `new[]` operator. This is good and bad. With arrays we couldn''t return arrays
    because the memory was deleted automatically, but on the other hand we didn''t
    have to remember to call `delete []`. With memory created using `new[]` we have
    to remember to delete the memory by hand, but you can safely return the data.


    The value returned by `new int[n]` is called a *pointer*. It has type `int*` which
    means "a pointer to an `int". In actual fact the array discussed in the previous
    section was of type `int*` too. It''s just that the notation for arrays in C hides
    the fact that an array-valued variable is just a pointer to a memory location.
    All that the `int* myArray` contains is the memory address where the array starts.
    As a result, we have to remember ourselves that the block of memory is of length
    n.


    You can use `[]` with a pointer to find the integer at a given offset in just
    the same way as we use `[]` with arrays and vectors. We have used this in the
    example above to print out the values in the array.


    If you run the code example above, you will find that the entries in the array
    take arbitrary values. Just as local variables of type `int` have unpredictable
    initial values, so does `int` data created with `new`.'
