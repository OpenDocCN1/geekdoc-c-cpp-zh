    # A.5 Monte Carlo pricing


    To compute risk-neutral prices of more complex derivatives, one can use the algorithm
    of Monte Carlo pricing. The algorithm is as follows.


    +   • *Simulate N scenarios for the asset prices using your Q-measure model.*


    A scenario is simply one possible future set of asset prices. These asset prices
    only need to be computed at the times relevant to the derivatives contract. For
    a European option this means you only need to compute prices at maturity. For
    a discrete-time knock-out option, you would need to compute prices at intermediate
    times to see if the option has knocked out. Your simulation should have the same
    probability distribution as your Q-measure model.


    +   • Compute the mean final payoff of the derivative.


    +   • Discount the mean payoff to take account of the interest rate. This is an
    estimate for the price of the derivative.'
