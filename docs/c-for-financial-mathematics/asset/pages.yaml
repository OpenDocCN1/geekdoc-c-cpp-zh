  md: "# 18.8 The container initializer_list\n\nA new container type called an **initializer_list**\
    \ was introduced in C++11. These are useful because they are easy to create and\
    \ populate with a list of values. They are not intended for long-term storage\
    \ of data. Here is an example of an initializer list being used to create a list\
    \ of doubles and then print them out.\n\n```\n```\nstd::initializer_list<double>\n\
    \    list = { 1, 2, 3, 4 };\nfor (auto d : list) {\n    std::cout << \"Value \"\
    <<d<<\"\\n\";\n}\n```\n```\n\nInitializer lists are read-only data structures,\
    \ so they are primarily used as a constructor parameter to another container.\
    \ For example, if you want to create a vector that contains some fixed specified\
    \ values, you could use code such as that shown below.\n\n```\n```std::vector<double>\
    \ v({ 1, 2, 3, 4 });```\n```\n\nThis code creates a vector which contains the\
    \ values 1, 2, 3, and 4. This can now be used like any other vector.\n\nMost collection\
    \ classes have a constructor that takes an **initializer_list** as a parameter\
    \ so that this convenient notation can be used.\n\n# 18.9 The containers map and\
    \ unordered_map\n\nSo far our containers have simply stored a sequence or a set\
    \ of values. Another broad class of data structures is used to store mappings\
    \ from a key to some associated data. To give an example, a dictionary can be\
    \ thought of as a data structure which maps a key (a word) to a value (the meaning\
    \ of the word).\n\nTwo classes that can be used to store such mappings in C++\
    \ are the class **map** and **unordered_map**. They can be found in <map> and\
    \ <unordered_map>, respectively.\n\nThe two classes are almost indistinguishable\
    \ in how you use them. The key differences are:\n\n+   (i) The elements in a **map**\
    \ are ordered by the keys, just as the entries in a dictionary are ordered;"
