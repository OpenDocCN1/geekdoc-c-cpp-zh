  md: '# # Chapter 14

    ## Delta Hedging


    In this chapter we will show how C++ can be applied to financial mathematics questions
    that go beyond simple risk-neutral pricing. In particular the exercises will show
    you how object-oriented programming techniques can be applied to solve a broad
    range of problems.


    The problem we will address is to show numerically that the *delta hedging* strategy
    described in Appendix A is an effective trading strategy.


    In [2], it is proved that the delta hedging strategy is completely risk free providing
    that various approximations to reality are used. These assumptions include that:
    One must be able to re-hedge one’s position in continuous time; the stock price
    must follow geometric Brownian motion in the ℙ measure; there must be no transaction
    costs; the market must be infinitely liquid; interest rates must be at a fixed
    level *r*; and so forth.


    We will show in this chapter that delta hedging is still a reasonably effective
    strategy if one weakens the assumption of continuous-time trading to trading at
    fixed time points. The strategy is no longer entirely risk free, but the risk
    can be reduced to acceptable levels by reheding reasonably often.


    The software that we develop can then easily be enhanced to test the effects of
    weakening the other assumptions. In addition one can adapt the software easily
    to test the effectiveness of other hedging and investment strategies.


    # ## 14.1 Discrete-time delta hedging


    We will simulate trading in a stock that evolves according to the Black–Scholes
    ℙ-measure model. This means that we can use our existing **BlackScholesModel**
    and its function *generatePricePath* to simulate a stock price over a given time
    interval. The price of the stock at time *t* is denoted *S*_*t*.


    At time 0, a trader sells a European call option on the stock with strike *K*
    and maturity *T* to a customer at the Black–Scholes price. This means that in
    exchange for the price *P*, the trader is committed to paying the customer the
    amount


    $$\max\{S_{T} - K, 0\}$$


    at time *T*.'
