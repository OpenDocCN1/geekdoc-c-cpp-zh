  md: "Here is some equivalent code that uses an **if** statement.\n\n```\n```\nint\
    \ max(int a, int b) {\n    if (a > b) {\n        return a;\n    } else {\n   \
    \     return b;\n    }\n}\n```\n```\n\nPeople who are too lazy to type like the\
    \ ternary operator, but it results in code which is very hard to understand. Don't\
    \ use it.\n\n# 4.8.3 The comma operator\n\nBetween the round brackets of a **for**\
    \ statement one always has three expressions separated by semi-colons. Here is\
    \ an example:\n\n```\n```\nfor (int i = 0; i < 100; i++) {\n    cout << i << \"\
    \\n\";\n}\n```\n```\n\nYou can if you like perform multiple calculations at the\
    \ end of each loop and multiple initialisations by using the so-called \"comma\
    \ operator\". Here's an example that prints out the first 10 powers of 2:\n\n\
    ```\n```\nfor (int count = 0, power = 1;\n     count < 10;\n     count++, power\
    \ *= 2) {\n    cout << power << \"\\n\";\n}\n```\n```\n\nIn this code we maintain\
    \ two loop variables, count and power, each of which is updated every iteration.\n\
    \nThe formal definition of the comma operator is that the expression lhs, rhs\
    \ evaluates lhs and discards the result and then evaluates rhs. Thus you can,\
    \ if you wish, string expressions together using the comma operator as an alternative\
    \ to using semi-colons in the conventional way.\n\nDon't use the comma operator\
    \ yourself. It leads to code that is hard to read (as our example demonstrates).\
    \ We wrote a program earlier (page 56) that printed out the powers of 2 using\
    \ a **while** loop that was much easier to follow."
