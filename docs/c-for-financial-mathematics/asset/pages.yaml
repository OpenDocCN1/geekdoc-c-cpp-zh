  md: 'some data is stored in read-only memory, some data is stored on the CPU either
    in caches or in registers. Data that is on the CPU can be accessed much faster
    than data stored in RAM. This in turn can be accessed much faster than data stored
    on the hard drive. We usually let the compiler decide on the details about how
    to move memory from place to place. In principle if we think about this closely,
    we may be able to improve performance significantly.


    (iii) *Parallet* processing. A computer is able to perform multiple tasks at once.
    This is called parallet processing because multiple tasks are performed in parallet.
    If you are using a computer with multiple CPUs, each CPU can perform calculations
    in parallet. So you should take advantage of this to get the maximum performance
    on your computer. We will discuss this topic in more detail in Chapter 20.


    (iv) *GPUs*. A graphics processing unit (GPU) is a chip designed specifically
    for processing image data. They have been designed, for example, to perform the
    highly intensive computer processing required for Hollywood animations. GPUs have
    a very different design from traditional CPUs. GPUs are designed to perform highly
    repetitive tasks at speed and in parallet. CPUs are designed for general purpose
    computing. As a result, for the highly repetitive tasks required for linear algebra
    or Monte Carlo pricing, a GPU may out-perform similarly priced CPUs. GPUs have
    been used successfully for derivatives pricing by a number of banks.


    These issues are highly specialised and the details vary considerably according
    to the hardware available. Moreover, as computer technology improves, the optimal
    way to implement your code is likely to change.


    This makes it extremely challenging to write a high-performance matrix library.
    Fortunately it is not necessary to do so as excellent matrix libraries are available
    both commercially and as open-source software. We will give a brief list of possible
    libraries, though there are many other options you might consider.


    +   Eigen is an open-source library with an easy-to-use interface which has been
    designed to perform well across a variety of architectures.


    +   The Intel Math Kernel library is designed specifically for Intel processors.
    It is commercial software.


    +   cuBLAS is a linear algebra library designed for use with NVIDIA graphics cards.


