    \ notice that our **Matrix** class does not have a **virtual** destructor, therefore\
    \ you must not subclass it. The same applies to many standard classes. For example,\
    \ you should never subclass **vector<double>** no matter how tempted you may feel!\n\
    \n# 16.2.1   Virtual destructors\n\nEvery C++ class has a destructor written automatically.\
    \ Irritatingly, this default destructor is not virtual. If your destructor is\
    \ not **virtual** there is a danger that the wrong destructor might be called\
