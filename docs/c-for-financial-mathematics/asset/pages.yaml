  md: 'The book has been designed for a 12-week course at the level of a UK financial
    mathematics MSc programme. For a shorter course, it would be natural to end at
    one of the following milestones.


    +   * In Chapter 9 we price a call option using the Monte Carlo method. This gives
    a practical demonstration of the *procedural programming* skills learned in previous
    chapters.


    * In Chapter 13 we price a portfolio of derivatives using the Monte Carlo method.
    Since there should be no restrictions on the derivatives that might be in the
    portfolio, this makes heavy use of *object-oriented* programming.


    * In Chapter 18 we extend our model to include markets with multiple stocks. This
    requires us to use some more interesting data structures and showcases more advanced
    techniques such as templates and operator overloading.


    * In Chapter 20 we show how multiple threads can be used to speed up Monte Carlo
    calculations. This demonstrates how the C++ techniques described in the book can
    be combined to build a sophisticated project.


    Finally, in Chapter 21 we give some suggestions for further reading and give some
    general suggestions for possible programming projects to build on the skills you
    developed by this book.


    # ## Acknowledgements


    I am indebted to Plamen Turkedjiev, Soheli Rahman, and Alice Sullivan for their
    many contributions to this book.


    # ## Summary


    This book provides an introduction to the C++ language and the art of writing
    high-quality code in that language.


    We will illustrate these computer skills with financial examples, specifically
    the problem of pricing a portfolio of derivatives.'
