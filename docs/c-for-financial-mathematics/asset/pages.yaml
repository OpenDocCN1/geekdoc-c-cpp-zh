  md: "```\nstring s(\"To be, or not to be?\");\n```\n\nIn the code above, s is an\
    \ object of type string. It is an instance of the class string.\n\nThe term object\
    \ in object-oriented programming refers to a data type which consists of a bundle\
    \ of data together with helpful functions to work with that data.\n\nSo a vector<double>\
    \ is an object because it contains the data of a vector and helpful functions\
    \ like size(). Similarly a string is an object.\n\nOn the other hand, double,\
    \ int and the raw data type char* are not object-oriented types because they consist\
    \ purely of data with no special helper functions.\n\nThe type of data and functions\
    \ supported by an object depend only on its class. All instances of the same class\
    \ have the same functions and the same types of data.\n\nExample 2: An instance\
    \ of the class string consists of:\n\n+   data consisting of a sequence of characters;\n\
    functions such as size, insert, erase for working with these data.\n\nThe class\
    \ string is where all these functions and data types are defined.\n\nFinally,\
    \ the functions associated with an object are often called methods. There isn't\
    \ meant to be any meaningful difference between the words function and method.\
    \ Some authors prefer the word method as the word function can scare non-mathematicians.\
    \ We will use both terms.\n\n# 8.2 Writing your own class\n\n# 8.2.1 Writing the\
    \ declaration\n\nTo show how to write your own class, let us create a data type\
    \ which represents a point in two-dimensional space.\n\n```\nclass CartesianPoint\
    \ {\npublic:\n     double x;\n     double y;\n};\n```"
