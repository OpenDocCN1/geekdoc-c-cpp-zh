    The first advantage that using classes has given us is that they have established
    a clear convention that $x$-coordinates are called x and $y$-coordinates are called
    y. This will make code written using CartesianPoint clearer than code that uses
    x some of the time, X some of the time, and xcoord the rest of the time.


    The second advantage that using classes has given us is that our code no longer
    depends so heavily on the ordering of parameters. One needs to be very careful
    in the original code that you pass every parameter in the correct order, and the
    compiler will provide no help. With classes it becomes impossible to get the order
    wrong. This becomes particularly important when, for example, passing 5 parameters
    to a function to price a call option. It is then all too easy to pass the parameters
    in the wrong order.


    The third advantage is that we are no longer using pass by reference to return
    multiple values. Most people find returning a single object conceptually simpler
    than modifying parameters by reference. This means that the version of the code
    using classes is easier for most people to understand.


    So using classes gives us consistency, readability, and reliability. The advantages
    may seem marginal at the moment, but, as our examples become more and more complex,
    the advantages will become increasingly apparent.


    There is a trade-off, however. We''ve had to write the code to represent the classes.
    We should ask whether this trade-off is worthwhile. The philosophy of library
    design says that our aim should always be to make life easy for the users of the
    library even at the expense of more work for the author of the library. This is
    because a library that is any good will be used a lot and written only once. So
    it is worth putting in some extra work to make a library as good as possible.
    According to this philosophy, therefore, the trade-off is worthwhile.


    In this example, the advantages of object orientation are quite small. As we learn
    more of the object-oriented features of C++, the advantages of this programming
    style will increase.


    # 8.3 Adding functions to classes


    The value of object orientation becomes more apparent when we add *member functions*
    to our classes. Let us illustrate this with a Circle class. Our circle class will
    have only one piece of data associated with it, the radius of the circle. But
    it will also have various functions for working with that data.'
