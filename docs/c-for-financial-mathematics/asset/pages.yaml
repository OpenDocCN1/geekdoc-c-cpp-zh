    # 4.9 Summary


    We have learned how to control the flow of execution in C++ using the following
    keywords:


    +   - `for`

    - `while`

    - `do`

    - `break`

    - `continue`

    - `return`

    - `switch`

    - `case`

    - `default`

    - `throw`


    By far the most useful flow of control statements are `for`, `while`, and `throw`.


    # Tip: Which control statement to use


    +   - Use `for` statements for simple loops such as for counting from 0 to 99.

    - Use `while` statements for more complex looping logic. Unusual `while` statements
    are easier to read than unusual `for` statements.

    - Use `throw` when errors occur. Don''t just print out a message and continue.'
