  md: 'Again, notice that we start counting from zero and stop counting using a less-than
    sign. If you developed this habit when writing your C++ code you will avoid a
    lot of bugs!


    Tip: C++ programmers count from 0


    Because the first index of a vector is 0, you should always count from 0 in your
    for loops.


    We’ve just seen another member function of vector<double> in this last example.
    We’re using the member function size() to compute the size of a vector.


    You may be tempted to write the code:


    ```

    ```c++

    for (int i=0; i<myVector.size(); i++) {

    ...

    }

    ```

    ```


    rather than compute the size on a separate line. This is technically correct C++,
    but some compilers (for example Visual Studio) issue a warning if you do this.
    The reason is that the type of vector.size() is an unsigned integer and the compiler
    is concerned that you are comparing signed and unsigned data types. The fix to
    this problem is simply to write:


    ```

    ```c++

    for (int i=0; i<(int)myVector.size(); i++) {

    ...

    }

    ```

    ```


    By casting the size to a signed int, we stop the compiler from fretting. Similarly,
    if one attempts to compile using 64-bit Windows, you need to cast the return of
    size() before trying to store it in an int because the compiler is concerned that
    you are trying to store a potentially 64-bit number using only 32 bits. In practice,
    we will not create vectors with $2^{31}$ or more elements! As an alternative we
    could use variables of type size_t ourselves. As we have discussed, working with
    unsigned integers can cause confusion, which is why we prefer the option of casting
    to an int.


    Let’s see some more examples of what we can do with a vector.


    +   * We can initialise one to be of a certain size and with certain fixed values.

    * We can initialise a vector to be a copy of another vector.

    * We can replace the contents of one vector with the contents of another vector.


    These actions are demonstrated in the code below:'
