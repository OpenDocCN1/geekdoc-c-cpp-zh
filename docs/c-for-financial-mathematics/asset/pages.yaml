    # A.6 Hedging


    We have described how a trader can produce prices that are guaranteed to be arbitrage-free
    if they use the risk-neutral pricing methodology. However, this is by no means
    enough to guarantee that a trader who charges these prices will make money.


    This is obvious if one considers bookmakers. Bookmakers need to produce a consistent
    set of prices at which they are willing to buy and sell different bets. However,
    that is not all they must do. They need to work out how to *hedge* their bets.
    This is the process of balancing the bets of different customers off against each
    other in such a way that the bookmaker can be sure that they will not lose money.
    Note that another way of hedging bets is to place your own counter-bets with another
    bookmaker, so it is not necessary to wait for appropriate customers to arrive
    before you can start hedging bets.


    In general you will need to place at least one hedge for every source of risk
    that you are potentially exposed to. In a simple model of a stock market with
    a single stock, following the geometric Brownian motion (A.4) and with a fixed
    risk-free interest rate, the only source of risk is the stock price. Thus, a trader
    who sells derivatives will want to place at least one bet to reduce their risk
    to changes in the stock price.


    One way to measure the amount of risk of your portfolio to changes in the stock
    price is to compute the sensitivity to changes in the stock price. If $P$ is the
    value of your portfolio, the sensitivity:


    $\frac{\partial P}{\partial S}$


    gives a measure of how much your portfolio would change in value if the stock
    price changed, everything else being fixed. This sensitivity is called the delta
    of the portfolio and is denoted by $\Delta$.


    Clearly the delta of a portfolio consisting solely of $n$ units of stock is simply
    $n$ and the delta of a portfolio consisting of only risk-free investments is 0.
    This means that by borrowing money to sell stock or by selling stock and placing
    the money in risk-free investments, one can change the delta of one’s portfolio.
    We assume that any amount of stock can be bought or sold at a given price'
