  md: 'We can break this down into smaller pieces as follows:


    ```

    $a = \left(\mu - \frac{1}{2}\sigma^{2}\right) \delta t$

    $b = \sigma \sqrt{\delta t}$

    $v_{1} = \epsilon_{1}$

    $v_{2} = b \epsilon_{1}$

    $v_{3} = a + b \epsilon_{1}$

    $v_{4} = s_{i-1} + a + b \epsilon_{1} = s_{i}$

    $v_{5} = \exp(s_{i-1} + a + b \epsilon_{1}) = S_{i}.$

    ```


    In our code we use the same variable **vals** to store the different values $v_{1}$,
    $v_{2}$, $v_{3}$, $v_{4}$, and $v_{5}$. By reusing the same vector we avoid constantly
    allocating memory for a temporary variable which will be deleted almost immediately.


    Notice the way that array programming has naturally made us reduce the number
    of times we compute the square root of $\textbf{dt}$. Previously we recomputed
    this for every scenario. This simple example gives a concrete hint as to why array
    programming might lead to faster code.


    # ### 16.7.5 Array programming the Monte Carlo pricer


    It is very easy to rewrite the Monte Carlo pricer to use array programming. However,
    there is an issue that if one wishes to use a very large number of scenarios the
    size of the matrices involved may become too big to comfortably fit in memory.
    There is a balance to be struck between the efficiency gains from array programming
    and the performance penalty that occurs from using too much memory.


    As a result, the Monte Carlo Pricer class has been written to perform its processing
    in batches. Each batch uses a reasonably sized matrix of scenarios. Since the
    code does not require any new programming techniques we will not show it here.


    **FMLib16** is a version of our financial maths library that uses array programming
    throughout.


    # ### 16.7.6 Performance


    We performed some numerical experiments and found that using array programming
    **FMLib16** actually performs a little *worse* than the original code. However,
    when we introduce a more complex market model with multiple stocks in Chapter
    18, the array programming begins to pay off. For a multi-stock model, our array
    programming resulted in code that is several times faster than the naive code.
    These experiments were performed without using any parallel processing. Much greater
    improvements should be possible if one takes advantage of multiple CPUs or GPUs.'
