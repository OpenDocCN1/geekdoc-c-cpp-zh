    # 16.4.4.1 Remarks on return by reference


    We have seen that operator<< returns a value by a reference. We''ve avoided return
    by reference so far.


    Return by reference is acceptable so long as you don''t return a reference to
    a local variable. Return by reference saves copying, and so is more efficient
    than return by value. Therefore, it makes sense to use return by reference whenever
    it is safe to do so. Moreover, when you don''t know how to copy the data (e.g.,
    for polymorphic classes like ostream), return by reference is the only choice.


    One effect of returning a reference is that whoever receives the reference can
    use that reference to modify whatever it points to. For this reason, sometimes
    you may want to return a const reference rather than just a simple reference.


    As we will see in the next sub-section, sometimes we use return by reference specifically
    because it allows the caller to modify what the reference points to.


    # 16.4.5 Overloading the ( ) operator


    We would like to be able to change the cells of a Matrix just as easily as we
    can change the cells of a vector. To achieve this we can overload the () operator
    so that you can type expressions such as m(1,2) to access the given row and column
    in matrix m. Here''s an example of how we''d like to be able to use the () operator


    ```

    ```

    Matrix m("1,2,3;4,5,6");

    ASSERT( m(1,2)==6 ); // read a value

    m(1,2)=0; // change the value

    ```

    ```


    When you overload the () operator, you must write a member function rather than
    a top-level function. Here are the necessary definitions to overload the () operator
    on the Matrix class.


    ```

    ```

    double& operator() (int i, int j ) {

    return data[ offset(i,j) ];

    }

    ```

    ```


    ```

    ```

    const double& operator() (int i, int j ) const {

    return data[ offset(i,j) ];

    }

    ```

