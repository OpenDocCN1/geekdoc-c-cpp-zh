  md: '# **Type safety and testing**


    From a modern perspective, a significant criticism of the C++ language is that
    it claims to be designed to make large projects easy to write, but it contains
    no built-in support for testing whatsoever! From a modern perspective this is
    simply astonishing. Fortunately, there are now plenty of good testing frameworks
    available to plug the gap.


    What C++ has always done well is to make sure that your code doesn''t contain
    any gross errors where you accidentally treat a memory location containing a string
    as though it contains a double. C++ does this by getting the compiler to check
    that all the type definitions in your code match up. However, there is a great
    deal more to getting code to work than ensuring that the type definitions are
    correct.


    Many modern languages don''t bother with type safety at all. This is because if
    your code is tested fully with unit tests, then there won''t be any type safety
    problems. In other words, if you have good unit tests, you won''t need to rely
    on the compiler testing your code for you.


    # ## 6.6 Testing normcdf


    The biggest challenge in testing your code isn''t writing the C++ code for the
    tests. The challenge is thinking of the tests to run. It demands some creativity
    to think of good tests.


    **Example 1:** How should you test the function normcdf, which is intended to
    compute the cumulative distribution function of the normal distribution?


    *Solution:* Here are some tests you could run on normcdf:


    +   1.  Given any value *x* (say *x* = 0.3) it should be true that normcdf(*x*)
    > 0 and normcdf(*x*) < 1. These properties hold for any cumulative distribution
    function.

    2.  For very small values of *x*, normcdf(*x*) should be close to 0.

    3.  For very large values of *x*, normcdf(*x*) should be close to 1.

    4.  normcdf should be increasing

    5.  normcdf(*x*) should be equal to $1 - \text{normcdf}(-x)$ by the symmetry of
    the normal distribution.'
