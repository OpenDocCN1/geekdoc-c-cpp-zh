    \ If **Priceable** did not have a virtual destructor, C++ would not call the destructor\
    \ of **CallOption** as we would like.\n\nAlthough you're unlikely to write the\
    \ code above, you are very likely to\n\n¹A pedant would actually say that any\
    \ class that you might wish to delete using a pointer to a base class should have\
    \ a virtual destructor, otherwise a virtual destructor is not necessary. If you\
    \ follow the recommendation that all classes you intend to subclass should have\
    \ a virtual destructor, you will follow this rule automatically."
