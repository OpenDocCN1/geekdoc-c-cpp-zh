  md: "What does using a function actually buy us? In this case, the code is a little\
    \ bit longer than it was before, but does precisely the same thing. So what are\
    \ the advantages?\n\n+   • Reuse. Every time we want to compute compound interest,\
    \ we can simply call the **compoundInterest** function. We never have to write\
    \ it again.\n\n+   • Division of labour. The person who writes the main body of\
    \ the code only has to be an expert in asking the user for input and output. They\
    \ don’t need to understand how **compoundInterest** is actually computed to write\
    \ the main chunk of code. If you scale this up to an iPad user interface to price\
    \ a knock-out option, you realise why you might need to divide the task between\
    \ different team members.\n\n+   • Modularity. We have broken our problem into\
    \ distinct simpler pieces. Just as a theorem is easier to follow when broken into\
    \ lemmas, a program is easier to understand when broken down into functions.\n\
    \n+   • Testability. In Chapter 6 we’ll see how using functions makes our code\
    \ easier to test.\n\n# Tip: Once and only once\n\nYou should never write the same\
    \ code twice. If you want to perform the same task twice, write a function that\
    \ carries out that task.\n\nA good programmer will avoid using cut and paste.\
    \ If you copy code from one place to another, you are just increasing the number\
    \ of lines of code in your program and hence increasing the amount of code you\
    \ will need to debug.\n\n**Example 1:** Write a function to compute the kinetic\
    \ energy of a body of given mass and velocity using the formula: *E* = 1/2 *mv*².\n\
    \n*Solution:*\n\n```\n```\ndouble kineticEnergy(double mass, double velocity)\
    \ {\n    return 0.5 * mass * velocity * velocity;\n}\n```\n```\n\nAs this example\
    \ demonstrates, you can return complex expressions as well as the value of a single\
    \ variable.\n\nOne thing to observe is that this function doesn’t print anything\
