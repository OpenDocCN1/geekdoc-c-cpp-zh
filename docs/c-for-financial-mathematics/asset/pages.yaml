- pgno: 224
  md: '# ### 11.8.2 The heap


    The heap is an area of memory that is less organised than the stack. As shown
    in Figure 11.7, the stack is a neatly arranged block of memory, whereas the heap
    contains objects arranged in a haphazard manner.


    ![](img/c60a618fcc2a2ed9d1e8d96a1b4157ff_224_0.png)


    **FIGURE 11.7:** The stack and the heap


    When you call `new`, a clever memory management algorithm hunts for an unused
    area of the heap that is large enough for your requirements. When you call `delete`,
    that same memory management algorithm is informed that it can now reuse that area
    of computer memory.


    The big advantage of the heap is that you can call `new` and `delete` whenever
    you like and you can choose the size of the memory allocated at run time rather
    than at compile time.


    Many mathematical problems can be solved without using the heap consciously at
    all. When you create a data object such as a `string` or a `vector` it will create
    data on the heap on your behalf, but you usually don''t need to think about this
    in detail. However, there are times when you will need to use flexibility of the
    heap yourself.


    The key example for us will be when pricing a portfolio of options. We don''t
    expect to know when the program is compiled exactly what our portfolio will look
    like. We don''t know how many options we will hold or even what types of option
    we will hold. Since the memory used by the stack is fixed at compile time, it
    cannot be used to store an unknown portfolio of options. In Chapter 13 we will
    show how to write a Portfolio class which uses `shared_ptr` to store the data
    of a Portfolio on the heap.'
