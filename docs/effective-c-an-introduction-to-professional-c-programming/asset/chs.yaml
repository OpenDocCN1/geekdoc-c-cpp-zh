  \  // 程序名。如果分配失败，将其视为\n  // 转换失败（调用 free(NULL） 是安全的）。\n  unsigned long long *args\
  \ = (unsigned long long *)malloc(sizeof(unsigned long long) * (argc - 1));\n  bool\
  \ failed_conversion = (args == NULL);\n  for (int i = 1; i < argc && !failed_conversion;\
  \ ++i) {\n    // 尝试将参数转换为整数。如果\n    // 无法转换，将 failed_conversion 设置为 true。\n    unsigned\
  \ long long one_arg;\n    failed_conversion |= !convert_arg(argv[i], &one_arg);\n\
  \    args[i - 1] = one_arg;\n  }\n  if (failed_conversion) {\n    // 释放数组，打印帮助，并退出。\n\
  \    free(args);\n    print_help();\n    return NULL;\n  }\n  *num_args = argc -\
  \ 1;\n  return args;\n}\n```\n\n*Listing 10-4: 处理所有命令行参数*\n\n在探索如何构建程序之前，让我们先查看用户界面。首先，我们打印命令行程序的帮助文本，如\
  \ Listing 10-2 所示。\n\n然而，在源文件中，所有实现细节的声明都应该显式声明为 `static` 以保持其私有性，仅该源文件可见。你可以通过\
  \ `#include` 预处理器指令包含头文件中声明的公共接口，以便从另一个文件中访问其接口。一个好的经验法是：不需要在文件外可见的文件作用域实体应该被声明为\
  \ `static`。这种做法限制了全局命名空间的污染，并减少了编译单元之间发生意外交互的概率。\n\n### 构建简单程序的结构\n\n为了学习如何构建一个复杂的真实世界程序，让我们编写一个简单的程序来判断一个数字是否为质数。`prime\
  \ number`（或 `prime`）是指大于 1 且不能通过两个较小的自然数相乘得到的自然数。我们将编写两个独立的组件：一个包含测试运行功能的静态库，以及一个为该库提供用户界面的命令行应用程序。\n\
  \n`primetest` 程序接受由空格分隔的整数值列表作为输入，并输出每个值是否为质数。如果任何输入无效，程序将输出一条有用的信息，解释如何使用该接口。\n\
  \n在探索如何构建程序之前，让我们先查看用户界面。首先，我们打印命令行程序的帮助文本，如 Listing 10-2 所示。\n\n```c\n// Print\
  \ command line help text.\n\nstatic void print_help(void) {\n  printf(\"%s\", \"\
  primetest num1 [num2 num3 ... numN]\\n\\n\");\n  printf(\"%s\", \"Tests positive\
  \ integers for primality. Supports testing \");\n  printf(\"%s [2-%llu].\\n\", \"\
  numbers in the range\", ULLONG_MAX);\n}\n```\n\n*Listing 10-2: 打印帮助文本*\n\n`print_help`\
  \ 函数由三个独立的 `printf` 函数调用组成，向标准输出打印关于如何使用命令的帮助文本。\n\n接下来，由于命令行参数是以文本输入传递给程序的，我们定义了一个实用函数将它们转换为整数值，如\
  \ Listing 10-3 所示。\n\n```c\n// 将字符串参数 arg 转换为 val 所引用的 unsigned long long 值。\n//\
  \ 如果参数转换成功返回 true，失败则返回 false。\nstatic bool convert_arg(const char *arg, unsigned\
  \ long long *val) {\n  char *end;\n  // strtoll 返回一个带内错误指示；在调用前清除 errno。\n  errno\
  \ = 0;\n  *val = strtoull(arg, &end, 10);\n  // 检查调用返回哨兵值并设置 errno 的失败情况。\n  if\
  \ (*val == ULLONG_MAX) && errno) return false;\n  if (*val == 0 && errno) return\
  \ false;\n  if (end == arg) return false;\n  // 如果到达这里，说明我们能够转换参数。但是，我们只允许\n  //\
  \ 大于 1 的值，因此我们拒绝 <= 1 的值。\n  if (*val <= 1) return false;\n  return true;\n}\n```\n\
  \n*Listing 10-3: 转换单个命令行参数*\n\n`convert_arg` 函数接受字符串参数作为输入，并使用输出参数报告转换后的参数。（`output\
  \ parameter` 通过参数而不是返回值向调用者返回函数结果，允许返回多个值。）如果参数转换成功，函数返回 true，失败则返回 false。`convert_arg`\
  \ 函数使用 `strtoull` 函数将字符串转换为 unsigned long long 整数值，并妥善地处理转换错误。此外，由于质数的定义排除了 0、1\
  \ 和负值，`convert_arg` 函数将这些视为无效输入。\n\n我们在 `convert_command_line_args` 函数中使用 `convert_arg`\
  \ 实用函数，该函数如 Listing 10-4 所示，它遍历所有提供的命令行参数，并尝试将每个参数从字符串转换为整数。\n\n```c\nstatic unsigned\
  \ long long *convert_command_line_args(int argc, const char *argv[], size_t *num_args)\
  \ {\n  *num_args = 0;\n  if (argc <= 1) {\n    // 未提供命令行参数（第一个参数是执行的程序名称）。\n   \
  \ print_help();\n    return NULL;\n  }\n  // 我们知道用户可能传递的最大参数数量，\n  // 因此分配一个足够大的数组来容纳所有元素。减去\n\
  \  // 程序名。如果分配失败，将其视为\n  // 转换失败（调用 free(NULL) 是安全的）。\n  unsigned long long *args\
  \ = (unsigned long long *)malloc(sizeof(unsigned long long) * (argc - 1));\n  bool\
  \ failed_conversion = (args == NULL);\n  for (int i = 1; i < argc && !failed_conversion;\
  \ ++i) {\n    // 尝试将参数转换为整数。如果\n    // 无法转换，将 failed_conversion 设置为 true。\n    unsigned\
  \ long long one_arg;\n    failed_conversion |= !convert_arg(argv[i], &one_arg);\n\
  \    args[i - 1] = one_arg;\n  }\n  if (failed_conversion) {\n    // 释放数组，打印帮助，并退出。\n\
  \    free(args);\n    print_help();\n  return NULL;\n  }\n  *num_args = argc - 1;\n\
  \  return args;\n}\n```\n\n*Listing 10-4: 处理所有命令行参数*\n\n有几种方法判断一个数字是否为质数。朴素的方法是测试\
  \ `N` 是否被 `2..N-1` 整除。这种方法随着 `N` 变大而性能很差。相反，我们使用许多为测试质数设计的算法。Listing 10-5 (#ch10.xhtml_ch10ex05)\
  \ 显示了一种非确定性实现，适用于快速测试质数（参见 Schoof 2008 论文了解 Miller-Rabin 测试背后的数学原理）。\n\n```c\nstatic\
  \ unsigned long long power(unsigned long long x, unsigned long long y, unsigned\
  \ long long p) {\n  unsigned long long result = 1;\n  x %= p;\n  while (y) {\n \
  \   if (y & 1) result = (result * x) % p;\n    y >>= 1;\n    x = (x * x) % p;\n\
  \  }\n  return result;\n}\n\nstatic bool miller_rabin_test(unsigned long long d,\
  \ unsigned long long n) {\n  unsigned long long a = 2 + rand() % (n - 4);\n  unsigned\
  \ long long x = power(a, d, n);\n  if (x == 1 || x == n - 1) return true;\n  while\
  \ (d != n - 1) {\n    x = (x * x) % n;\n    d *= 2;\n    if (x == 1) return false;\n\
  \    if (x == n - 1) return true;\n  }\n  return false;\n}\n```\n\n*Listing 10-5:\
  \ Miller-Rabin 质数测试算法*\n\nMiller-Rabin 质数测试的接口是 Listing 10-6 (#ch10.xhtml_ch10ex06)所示的\
  \ `is_prime` 函数。该函数接受两个参数：测试数字 (`n`) 和测试次数 (`k`)。较大的 `k` 值提供更准确的结果，但是以性能下降为代价的。\n\
  \n```c\nbool is_prime(unsigned long long n, unsigned int k) {\n  if (n <= 1 || n\
  \ == 4) return false;\n  if (n <= 3) return true;\n  unsigned long long d = n -\
  \ 1;\n  while (d % 2 == 0) d /= 2;\n  for (; k != 0; --k) {\n```\n\n\n\n```c\n \
  \   if (!miller_rabin_test(d, n)) return false;\n\n  }\n\n  return true;\n}\n```\n\
  列表 10-6：Miller-Rabin 质性测试算法的接口*\n\n最后，我们需要将这些工具函数组合成一个程序。列表 10-7 显示了 `main` 函数的实现。它使用固定次数的\
  \ Miller-Rabin 测试，并报告输入值是可能是质数还是确定不是质数。它还处理了由 `convert_command_line_args` 分配的内存释放。\n\
  \n```c\nint main(int argc, char *argv[]) {\n\n  size_t num_args;\n  unsigned long\
  \ long *vals = convert_command_line_args(argc, argv, &num_args);\n\n  if (!vals)\
  \ return EXIT_FAILURE;\n\n  for (size_t i = 0; i < num_args; ++i) {\n    printf(\"\
  %llu is %s.\\n\", vals[i],\n            is_prime(vals[i], 100) ? \"probably prime\"\
  \ : \"not prime\");\n  }\n\n  free(vals);\n  return EXIT_SUCCESS;\n}\n```\n列表 10-7：main\
  \ 函数*\n\n`main` 函数调用 `convert_command_line_args` 函数将命令行参数转换为 `unsigned long long`\
  \ 整数数组。对于该数组中的每个参数，程序都会循环，并调用 `is_prime`，使用 `is_prime` 函数实现的 Miller-Rabin 质性测试来确定每个值是可能是质数还是不是质数。\n\
  \n现在我们已经实现了程序逻辑，并将生成所需的构建产物。我们的目标是生成一个包含 Miller-Rabin 实现的静态库和一个命令行应用程序驱动程序。\n\n\
  ### 编译代码\n\n创建一个名为 `isprime.c` 的新文件，并包含来自 列表 10-5 和 10-6 的代码（按此顺序），在文件顶部添加针对 `\"\
  isprime.h\"` 和 `<stdlib.h>` 的 `#include` 指令。头文件周围的引号和角括号非常重要，因为它们告诉预处理器去哪里搜索这些文件，正如\
  \ 第 9 章 中讨论的那样。接下来，创建一个名为 `isprime.h` 的头文件，包含来自 列表 10-8 的代码以为静态库提供公共接口，并带有头文件保护。\n\
  \n```c\n#ifndef PRIMETEST_IS_PRIME_H\n#define PRIMETEST_IS_PRIME_H\n\n#include <stdbool.h>\n\
  \nbool is_prime(unsigned long long n, unsigned long k);\n\n#endif // PRIMETEST_IS_PRIME_H\n\
  ```\n列表 10-8：静态库的公共接口*\n\n创建一个名为 `driver.c` 的新文件，并按顺序包含来自 列表 10-2、10-3、10-4 和 10-7\
  \ 的代码，在文件顶部添加以下内容的 `#include` 指令：`\"isprime.h\"`、`<assert.h>`、`<errno.h>`、`<limits.h>`、`<stdbool.h>`、`<stdio.h>`\
  \ 和 `<stdlib.h>`。在示例中三个文件都在同一个目录下，但在实际项目中，你可能会根据特定构建系统的约定将文件放在不同的目录中。创建一个名为 `bin`\
  \ 的本地目录，这是本示例创建构建产物的地方。\n\n我们使用 `Clang` 来创建静态库和可执行程序，但 `GCC` 和 `Clang` 都支持示例中的命令行参数，因此任何一个编译器都可以工作。首先，将两个\
  \ C 源文件编译为放在 `bin` 目录中的目标文件：\n\n```bash\n% clang -c -std=c17 -Wall -Wextra -pedantic\
  \ -Werror isprime.c -o bin/isprime.o\n% clang -c -std=c17 -Wall -Wextra -pedantic\
  \ -Werror driver.c -o bin/driver.o\n```\n\n如果你执行该命令并得到如下错误：\n\n`unable to open output\
  \ file 'bin/isprime.o': 'No such file or directory'`\n\n则创建本地的 `bin` 目录并重试命令。`-c`\
  \ 标志指示编译器将源代码编译为目标文件，而不调用链接器生成可执行输出。我们需要目标文件来创建库。`-o` 标志指定输出文件的路径。\n\n执行命令后，`bin`\
  \ 目录应该包含两个目标文件：`isprime.o` 和 `driver.o`。这些文件包含每个翻译单元的目标代码。你可以直接将它们链接在一起创建可执行程序。然而，在这种情况下，我们将创建一个静态库（由于历史原因也称为\
  \ *archive*）。要此此，执行 `ar` 命令在 `bin` 目录中生成名为 `libPrimalityUtilities.a` 的静态库：\n\n```bash\n\
  % ar rcs bin/libPrimalityUtilities.a bin/isprime.o\n```\n\n`r` 选项指示 `ar` 命令替换存档中的现有文件，`c`\
  \ 选项创建存档，`s` 选项向存档中写入索引（等同于运行 `ranlib` 命令）。\n\n现在你可以将 `driver.o` 与 `libPrimalityUtilities.a`\
  \ 静态库链接，以名为 `primetest` 的可执行程序。这可以通过不带 `-c` 标志调用编译器来实现，也可以通过直接调用链接器来实现：\n\n```bash\n\
  % clang driver.o -Lbin -lPrimalityUtilities -o primetest\n```\n\n`-L` 标志指示链接器在本地\
  \ `bin` 目录查找库，`-l` 标志指示链接 `libPrimalityUtilities.a`。例如，链接 `libm` 数学库，你需要指定 `-lm`。\n\
  \n现在你可以测试程序以查看值是否可能是质数或不是质数。请确保尝试负数、已知的质数和非质数以及错误输入，如列表 10-9 所示。\n\n```bash\n% ./bin/primetest\
  \ 899180\n899180 is not prime\n\n% ./bin/primetest 867509\n867509 is probably prime\n\
  \n% ./bin/primetest 0\nprimetest num1 num2 ... numN\n测试正整数的质性。支持范围为 [2-18446744073709551615]。\n\
  ```\n列表 10-9：使用示例输入运行 primetest 程序*\n\n8,675,309 是质数。\n\n## 总结\n\n在本章中，你学习了低耦合和高内聚、数据抽象以及代码重用。此外，你还学习了相关的语言结构，如不透明数据类型和链接。你还学习了组织代码的最佳实践，并看到了一个使用不同可执行组件构建程序的示例。\n\
  \n\n\n\n\n### 静态断言 (Static Assertions)\n\n`static assertions` 可以使用 `static_assert`\
  \ 宏如下所示：\n\n```c\nstatic_assert(integer-constant-expression, string-literal);\n\
  ```\n\n如果整数常量表达式的值不等于 0，则 `static_assert` 声明不起作用。如果整数常量表达式等于 0，编译器将生成一条包含你指定的字符串字面量文本的诊断信息。\n\
  \n你可以使用静态断言在编译时验证假设，例如特定的实现定义行为。一旦实现定义行为发生任何变化，都将在编译时被诊断出来。\n\n让我们来看使用静态断言的三个示例。首先，在列表\
  \ 11-1 中，我们使用 `static_assert` 来验证 `struct packed` 缺少填充字节。\n\n```c\n#include <assert.h>\n\
  \nstruct packed {\n  unsigned int i;\n  char *p;\n};\n\nstatic_assert(\n  sizeof(struct\
  \ packed) == sizeof(unsigned int) + sizeof(char *),\n  \"struct packed must not\
  \ have any padding\"\n);\n```\n*列表 11-1: 使用 static_assert 验证结构体缺少填充字节*\n\n此示例中静态断言的谓词验证了\
  \ `packed` 结构体的大小与其 `unsigned int` 和 `char *` 成员的大小之相等。由于静态断言是一种声明，它可以出现在文件作用域中，紧随在其后断言属性的\
  \ `struct` 定义之后。\n\n接下来，在列表 11-2 所示的 `clear_stdin` 函数调用了 `getchar` 函数从 `stdin` 读取字符，直到到达文件结束。每个字符都作为\
  \ `unsigned char` 获取并转换为 `int`。通常的习惯是将 `getchar` 函数返回的字符与 `EOF` 比较（通常在 `do...while`\
  \ 循环中进行），以确定何时读取了所有可用字符。为了让该函数的循环正常工作，终止条件必须能够区分字符和 `EOF`。然而，C 标准允许 `unsigned char`\
  \ 和 `int` 具有相同的范围，这意味着在某些实现上，此对 `EOF` 的测试可能会返回假阳性，在这种情况下，`do... while` 循环可能会提前终止。由于这是一种异常情况，你可以使用\
  \ `static_assert` 来验证 `do...while` 循环能够正确区分有效字符和 `EOF`。\n\n```c\n#include <assert.h>\n\
  #include <stdio.h>\n#include <limits.h>\n\nvoid clear_stdin(void) {\n  int c;\n\
  \  do {\n    c = getchar();\n    static_assert(UCHAR_MAX < UINT_MAX, \"FIO34-C violation\"\
  );\n  } while (c != EOF);\n}\n```\n*列表 11-2: 使用 static_assert 验证整数大小*\n\n在此示例中，静态断言验证了最大的\
  \ `unsigned char` 值 `UCHAR_MAX` 小于最大的 `unsigned int` 值 `UINT_MAX`。静态断言放置于依赖该假设的代码附近，这样如果假设被违反，你就能轻松找到需要修复的代码。由于静态断言是在编译时评估的，因此将它们放在执行代码中对程序的运行时效率没有影响。有关此主题的更多信息，请参见\
  \ CERT C 规则 FIO34-C（区分从文件中读取的字符与 EOF 或 WEOF）。\n\n最后，在列表 11-3 中，我们使用 `static_assert`\
  \ 在编译时执行边界检查。此代码段使用 `strcpy` 将常量字符串前缀拷贝到静态分配的数组 `str` 中。静态断言确保 `str` 将有足够的空间在调用\
  \ `strcpy` 之后存储至少一个用于错误码的额外字符。\n\n```c\nstatic const char prefix[] = \"Error No:\
  \ \";\n\n#define ARRAYSIZE 14\n\nchar str[ARRAYSIZE];\n// 确保 str 有足够的空间存储至少一个额外的\n\
  // 用于错误码的字符\nstatic_assert(\n  sizeof(str) > sizeof(prefix),\n  \"str must be larger\
  \ than prefix\"\n);\nstrcpy(str, prefix);\n```\n*列表 11-3: 使用 static_assert 执行边界检查*\n\
  \n如果开发者在维护期间例如减少了 `ARRAYSIZE`，或者将前缀字符串更改为 \"Error Number: \"，此假设可能会失效。由于添加了静态断言，维护者现在会收到关于该问题的警告。记住，字符串字面量是给开发者或维护者的信息，而不是给系统的终端用户。它的目的是提供对调试有用的信息。\n\
  \n### 运行时断言 (Runtime Assertions)\n\n`assert` 宏向程序中注入运行时诊断测试。它定义在 `<assert.h>` 头文件中，并接受一个标量表达式作为单一参数：\n\
  \n```c\n#define assert(scalar-expression) /* implementation defined */\n```\n\n\
  `assert` 宏是由实现定义的。如果 `scalar expression` 等于 0，宏展开通常会将有关失败调用的信息（包括参数文本、源文件名 `__FILE__`、源行号\
  \ `__LINE__` 以及闭包函数名称 `__func__`）写入到标准错误流 `stderr`。在向 `stderr` 写入这些信息后，`assert`\
  \ 宏会调用 `abort` 函数。\n\n在列表 11-4 所示的 `dup_string` 函数通过 `getchar` 函数从 `stdin` 读取字符，直到到达文件结束。每个字符都作为\
  \ `unsigned char` 获取并转换为 `int`。通常的习惯是将 `getchar` 函数返回的字符与 `EOF` 比较（通常在 `do...while`\
  \ 循环中进行），以确定何时读取了所有可用字符。为了让该函数的循环正常工作，终止条件必须能够区分字符和 `EOF`。然而，C 标准允许 `unsigned char`\
  \ 和 `int` 具有相同的范围，这意味着在某些实现上，此对 `EOF` 的测试可能会返回假阳性，在这种情况下，`do... while` 循环可能会提前终止。由于这是一种异常情况，你可以使用\
  \ `static_assert` 来验证 `do...while` 循环能够正确区分有效字符和 `EOF`。\n\n```c\n#include <assert.h>\n\
  #include <stdio.h>\n#include <limits.h>\n\nvoid clear_stdin(void) {\n  int c;\n\
  \  do {\n    c = getchar();\n    static_assert(UCHAR_MAX < UINT_MAX, \"FIO34-C violation\"\
  );\n  } while (c != EOF);\n}\n```\n*列表 11-2: 使用 static_assert 验证整数大小*\n\n在此示例中，静态断言验证了最大的\
  \ `unsigned char` 值 `UCHAR_MAX` 小于最大的 `unsigned int` 值 `UINT_MAX`。静态断言放置于依赖该假设的代码附近，这样如果假设被违反，你就能轻松找到需要修复的代码。由于静态断言是在编译时评估的，因此将它们放在执行代码中对程序的运行时效率没有影响。有关此主题的更多信息，请参见\
  \ CERT C 规则 FIO34-C（区分从文件中读取的字符与 EOF 或 WEOF）。\n\n最后，在列表 11-3 中，我们使用 `static_assert`\
  \ 在编译时执行边界检查。此代码段使用 `strcpy` 将常量字符串前缀拷贝到静态分配的数组 `str` 中。静态断言确保 `str` 将有足够的空间在调用\
  \ `strcpy` 之后存储至少一个用于错误码的额外字符。\n\n```c\nstatic const char prefix[] = \"Error No:\
  \ \";\n\n#define ARRAYSIZE 14\n\nchar str[ARRAYSIZE];\n// 确保 str 有足够的空间存储至少一个额外的\n\
  // 用于错误码的字符\nstatic_assert(\n  sizeof(str) > sizeof(prefix),\n  \"str must be larger\
  \ than prefix\"\n);\nstrcpy(str, prefix);\n```\n*列表 11-3: 使用 static_assert 执行边界检查*\n\
  \n如果开发者在维护期间例如减少了 `ARRAYSIZE`，或者将前缀字符串更改为 \"Error Number: \"，此假设可能会失效。由于添加了静态断言，维护者现在会收到关于该问题的警告。记住，字符串字面量是给开发者或维护者的信息，而不是给系统的终端用户。它的目的是提供对调试有用的信息。\n\
  \n### 运行时断言 (Runtime Assertions)\n\n`assert` 宏向程序中注入运行时诊断测试。它定义在 `<assert.h>` 头文件中，并接受一个标量表达式作为单一参数：\n\
  \n```c\n#define assert(scalar-expression) /* implementation defined */\n```\n\n\
  `assert` 宏是由实现定义的。如果 `scalar expression` 等于 0，宏展开通常会将有关失败调用的信息（包括参数文本、源文件名 `__FILE__`、源行号\
  \ `__LINE__` 以及闭包函数名称 `__func__`）写入到标准错误流 `stderr`。在向 `stderr` 写入这些信息后，`assert`\
  \ 宏会调用 `abort` 函数。\n\n在列表 11-4 所示的 `dup_string` 函数通过 `getchar` 函数从 `stdin` 读取字符，直到到达文件结束。每个字符都作为\
  \ `unsigned char` 获取并转换为 `int`。通常的习惯是将 `getchar` 函数返回的字符与 `EOF` 比较（通常在 `do...while`\
  \ 循环中进行），以确定何时读取了所有可用字符。为了让该函数的循环正常工作，终止条件必须能够区分字符和 `EOF`。然而，C 标准允许 `unsigned char`\
  \ 和 `int` 具有相同的范围，这意味着在某些实现上，此对 `EOF` 的测试可能会返回假阳性，在这种情况下，`do... while` 循环可能会提前终止。由于这是一种异常情况，你可以使用\
  \ `static_assert` 来验证 `do...while` 循环能够正确区分有效字符和 `EOF`。\n\n```c\n#include <assert.h>\n\
  #include <stdio.h>\n#include <limits.h>\n\nvoid clear_stdin(void) {\n  int c;\n\
  \  do {\n    c = getchar();\n    static_assert(UCHAR_MAX < UINT_MAX, \"FIO34-C violation\"\
  );\n  } while (c != EOF);\n}\n```\n*列表 11-2: 使用 static_assert 验证整数大小*\n\n在此示例中，静态断言验证了最大的\
  \ `unsigned char` 值 `UCHAR_MAX` 小于最大的 `unsigned int` 值 `UINT_MAX`。静态断言放置于依赖该假设的代码附近，这样如果假设被违反，你就能轻松找到需要修复的代码。由于静态断言是在编译时评估的，因此将它们放在执行代码中对程序的运行时效率没有影响。有关此主题的更多信息，请参见\
  \ CERT C 规则 FIO34-C（区分从文件中读取的字符与 EOF 或 WEOF）。\n\n最后，在列表 11-3 中，我们使用 `static_assert`\
  \ 在编译时执行边界检查。此代码段使用 `strcpy` 将常量字符串前缀拷贝到静态分配的数组 `str` 中。静态断言确保 `str` 将有足够的空间在调用\
  \ `strcpy` 之后存储至少一个用于错误码的额外字符。\n\n如果开发者在维护期间例如减少了 `ARRAYSIZE`，或者将前缀字符串更改为 \"Error\
  \ Number: \"，此假设可能会失效。由于添加了静态断言，维护者现在会收到关于该问题的警告。记住，字符串字面量是给开发者或维护者的信息，而不是给系统的终端用户。它的目的是提供对调试有用的信息。\n\
  \n### 运行时断言 (Runtime Assertions)\n\n`assert` 宏向程序中注入运行时诊断测试。它定义在 `<assert.h>` 头文件中，并接受一个标量表达式作为单一参数：\n\
  \n```c\n#define assert(scalar-expression) /* implementation defined */\n```\n\n\
  `assert` 宏是由实现定义的。如果 `scalar expression` 等于 0，宏展开通常会将有关失败调用的信息（包括参数文本、源文件名 `__FILE__`、源行号\
  \ `__LINE__` 以及闭包函数名称 `__func__`）写入到标准错误流 `stderr`。在向 `stderr` 写入这些信息后，`assert`\
  \ 宏会调用 `abort` 函数。\n\n在列表 11-4 所示的 `dup_string` 函数通过 `getchar` 函数从 `stdin` 读取字符，直到到达文件结束。每个字符都作为\
  \ `unsigned char` 获取并转换为 `int`。通常的习惯是将 `getchar` 函数返回的字符与 `EOF` 比较（通常在 `do...while`\
  \ 循环中进行），以确定何时读取了所有可用字符。为了让该函数的循环正常工作，终止条件必须能够区分字符和 `EOF`。然而，C 标准允许 `unsigned char`\
  \ 和 `int` 具有相同的范围，这意味着在某些实现上，此对 `EOF` 的测试可能会返回假阳性，在这种情况下，`do... while` 循环可能会提前终止。由于这是一种异常情况，你可以使用\
  \ `static_assert` 来验证 `do...while` 循环能够正确区分有效字符和 `EOF`。\n\n```c\n#include <assert.h>\n\
  #include <stdio.h>\n#include <limits.h>\n\nvoid clear_stdin(void) {\n  int c;\n\
  \  do {\n    c = getchar();\n    static_assert(UCHAR_MAX < UINT_MAX, \"FIO34-C violation\"\
  );\n  } while (c != EOF);\n}\n```\n*列表 11-2: 使用 static_assert 验证整数大小*\n\n（注：由于提供的原文中存在大量内容重复，译文已根据要求“不要重复输出原文”进行了去重处理）\n\
  \n\n\n\n你应该将这些检查实现为始终包含在可执行文件普通错误检查代码。断言（Assertions）应仅用于验证代码中设计的先置条件、后置条件和不变性（编程错误）。\n\
  \n## 编译器设置与标志\n\n编译器默认不会启用优化或安全加固。相反，你可以使用构建标志（Weimer 2018）启用优化、错误检测和安全加固。在下一节中，我将为\
  \ `GCC`、`Clang` 和 `Visual C++` 推荐特定的标志，在此之前先描述你可能想要使用它们的方法以及原因。\n\n你应该根据尝试实现的目标来选择构建标志。软件开发的不同阶段需要不同的构建标志：\n\
  \n**分析（Analysis）**：在分析期间，你的目标是让代码通过编译。在此阶段处理大量的诊断信息可能看起来很麻烦，但比通过调试和测试来发现这些问题，或者在代码发布后才发现它们要好得多。在分析阶段，你应该使用能够最大化诊断信息的编译器选项，以帮助你尽可能消除缺陷。\n\
  \n**调试（Debugging）**：在调试期间，你通常在试图弄清楚代码为什么无法工作，因此你应该使用一组编译器标志，其中应包含调试信息、允许断言生效、注入运行时插桩以检测错误，并为不可避免的“编辑-编译-调试”循环提供快速周转时间。\n\
  \n**测试（Testing）**：在测试期间，你可能希望禁用符号名称以外的调试信息，以便为崩溃获取良好的堆栈跟踪，并保持断言开启。你可能还想开始测试优化后的构建。这些设置也可能用于产品的\
  \ Beta 版本，以帮助隔离 Beta 测试期间发现任何缺陷。\n\n**验收测试/部署（Acceptance testing/deployment）**：最后阶段是为部署到运行环境构建代码。在部署系统之前，确保你已充分测试了构建配置，因为使用不同的编译标志集可能会触发新的缺陷——例如，运行优化代码时产生的定时效应的结果。\n\
  \n现在我将针对你的编译器和软件开发阶段推荐一些可能需要的特定标志。\n\n### GCC 和 Clang\n\n[表 11-1] 列出了适用于 `GCC` 和\
  \ `Clang` 的推荐编译器标志和链接器标志，以及这两个编译器之间的差异。你可以在 `GCC` 手册（`https://gcc.gnu.org/onlinedocs/gcc/Invoking-GCC.html`）和\
  \ `Clang` 编译器用户手册（`https://clang.llvm.org/docs/UsersManual.html#command-line-options`）中找到编译器标志的文档。\n\
  \n**表 11-1:** GCC 和 Clang 的推荐编译器和链接器标志\n\n| 标志 | 用途 |\n| --- | --- |\n| `-D_FORTIFY_SOURCE=2`\
  \ | 检测运行时缓冲区溢出 |\n| `-fpie -Wl,-pie` | 为可执行文件启用完全 ASLR 所需 |\n| `-fpic -shared` |\
  \ 禁用共享库的重定位 |\n| `-g3` | 生成丰富的调试信息 |\n| `-O2` | 为了速度/空间效率优化你的代码 |\n| `-Wall` | 开启推荐的编译器警告\
  \ |\n| `-Werror` | 将警告转换为错误 |\n| `-std=c17` | 指定语言标准 |\n| `-pedantic` | 针对严格符合标准的要求发出警告\
  \ |\n\n#### -O 优化\n\n大写字母 `-O` 标志控制编译器优化。大多数优化在 `-O0` 或命令行上未设置 `-O` 级别时禁用。如果禁用了优化，编译器将尝试加速编译并简化调试。`-Og`\
  \ 级别为调试优化代码，抑制了许多优化阶段，对于生成可调试代码来说，它是比 `-O0` 更好的选择。\n\n当你准备好部署应用程序或提交进行验收测试时，你将希望优化代码。开启优化会指示编译器以编译时间和你调试程序的能力为代价，提高性能或缩小代码大小。`-O2`\
  \ 级别执行几乎所有不涉及空间-速度权衡的优化，通常建议用于生产级代码。`FORTIFY_SOURCE` 也要求使用 `-O2` 或更高级别。还有一个 `-O3`\
  \ 优化级别，它可能会增加生成的可执行文件的速度，但也会增加其大小。\n\n在初始编译代码时（例如，在分析阶段），你可能希望使用 `-O2` 标志，以启用仅在用\
  \ `GCC` 构建优化版本时执行的诊断信息。在分析期间不要启用净化化（sanitization，见第 217 页“AddressSanitizer”讨论），因为插入的运行时插桩会导致假误报。\n\
  \n`-O1` 级别执行快速优化，不会显著增加构建时间，这对于测试可能很有用。\n\n#### -glevel 调试\n\n`-g` 标志以操作系统的原生格式产生调试信息。你可以通过设置调试级别来指定产生多少信息。默认级别是\
  \ `-g2`。级别 3（`-g3`）包含额外信息，例如程序中存在的所有宏定义。级别 3 还允许你在支持该功能的调试器中展开宏。\n\n#### -Wall 警告\n\
  \n`-Wall` 标志启用了一组有用的警告标志，但不是所有标志。你还可以指定 `-Wextra` 来启用 `-Wall` 未启的额外警告。\n\n#### -Werror\
  \ 错误\n\n`-Werror` 标志将所有警告转换为错误，要求你在开始调试之前处理它们。此标志仅仅是鼓励良好的编程纪律。\n\n#### -std= flag\
  \ 语言标准\n\n`-std=` 标志可以用于指定语言标准，如 `c89`、`c90`、`c99`、`c11`、`c17` 或 `c2x`。对于 `GCC`，如果没有给出\
  \ C 语言变言，默认值为 `-std=gnu17`，它提供了某些 C 语言扩展，这些扩展在少数情况下会与 C 标准冲突。对于 `Clang`，默认值为 `-std=gnu11`。为了可移植性，请指定你使用的标准。为了使用新语言特性，请指定最近的标准。一个很好的选择（2020\
  \ 年）是 `-std=c17`。\n\n#### -pedantic 警告\n\n`-pedantic` 标志在代码偏离严格符合标准时发出警告。此标志通常与\
  \ `-std=` 标志配合使用，以提高代码的可移植性。\n\n#### -D_FORTIFY_SOURCE=2 缓冲区溢出检测\n\n`FORTIFY_SOURCE`\
  \ 宏为检测内存和字符串操作函数的缓冲区溢出提供辅助支持。并不是所有的缓冲区溢出都能通过此宏检测，但使用 `-D_FORTIFY_SOURCE=2` 编译源码可以对执行内存拷贝且可能导致缓冲区溢出的函数（如\
  \ `memcpy`、`memset`、`strcpy`、`strcat` 和 `sprintf`）提供额外的验证。某些检查可以在编译时进行并产生诊断信息；另一些在运行时进行并可能导致运行时错误。\n\
  \n#### -fpie -Wl, -pie 和 -fpic -shared 位置独立\n\n*地址空间布局随机化 (ASLR)* 是一种安全机制，通过随机化进程的内存空间来防止攻击者定位试图执行的代码。你可以在《C\
  \ 和 C++ 安全编码》（Seacord 2013）中了解更多关于 ASLR 和其他安全缓解措施的信息。\n\n\n\n\n\n你必须指定 `-fpie`、`-Wl,`\
  \ 和 `-pie` 标志来创建位置无关的可执行程序，并使你的主程序（可执行文件）能够启用 ASLR。然而，虽然使用这些选项为主程序生成的代码是位置无关的，但它使用了一些无法在共享库（动态共享对象）中重定位。对于共享库，请使用\
  \ `-fpic` 并使用 `-shared` 进行链接，以避免在支持位置相关共享库的架构上产生文本重定位。动态共享对象总是位置无关的，因此支持 ASLR。\n\
  \n## Visual C++\n\nVisual C++ 提供了丰富的编译器选项，其中许多选项与 GCC 和 Clang 提供的选项相似。一个明显的区别是 Visual\
  \ C++ 通常使用正斜杠（`/`）而不是连字符（`-`）来指示标志。表 11-2 列出了 Visual C++ 推荐的编译器和链接器标志。\n\n**表 11-2：Visual\
  \ C++ 推荐的编译器标志**\n\n| **标志** | **目的** |\n\n| --- | --- |\n| `/guard:cf` | 添加控制流保护安全检查\
  \ |\n| `/analyze` | 启用静态分析 |\n| `/sdl` | 启用安全功能 |\n| `/permissive-` |向编译器指定标准一致性模式\
  \ |\n| `/O2` | 将优化级别设置为 2 |\n| `/W4` | 将编译器警告级别设置为 4 |\n| `/WX` | 将警告转换为错误 |\n\n\
  这些选项中的几个几个与 GCC 和 Clang 编译器提供的选项相似。`/O2` 是部署代码的良好优化级别，而 `/Od` 则禁用优化，以加快编译并简化调试。`/W4`\
  \ 是一个很好的警告级别，特别是对于新代码，它大致等同于 GCC 和 Clang 中的 `-Wall`。不建议在 Visual C++ 中使用 `/Wall`，因为它产生大量的误报。`/WX`\
  \ 将警告转换为错误，等同于 GCC 和 Clang 中的 `-Werror` 标志。我将在接后的章节中详细介绍其余的标志。\n\n### /guard:cf\
  \ 安全检查\n\n当你指定 `control flow guard (CFG)` 选项时，编译器和链接器会插入额外的运行时安全检查，以检测尝试破坏你代码的行为。必须向编译器和链接器都传递\
  \ `/guard:cf` 选项。\n\n### /analyze 静态分析\n\n`/analyze` 标志启用静态分析，它可以提供有关代码中可能缺陷的信息。我将在第\
  \ 214 页 的“静态分析”中详细讨论静态分析。\n\n### /sdl 安全功能\n\n`/sdl` 标志启用额外的安全功能，包括将额外的安全警告视为错误，以及微软\
  \ `Security Development Lifecycle (SDL)` 中的其他安全功能。在所有考虑安全的生产构建中，都应该使用 `/sdl` 标志。\n\
  \n### /permissive- 标准一致性\n\n你可以使用 `/permissive-` 来帮助识别并修复代码中的一致性问题，从而提高代码的正确性和移植性。此选项禁用了宽松行为，并设置\
  \ `/Zc` 编译器选项以实现严格一致。在 IDE 中，此选项还会为不符合标准的代码标记下划线。\n\n### 调试\n\n我职业化编程 37 年了。在这段时间里，只有一次或两次我写的程序在第一次尝试就能正确编译并运行。在所有其他时候，都需要调试。\n\
  \n让我们来调试一个有错误的程序。列表 11-6 所示的程序测试了 `print_error` 函数，但没有产生预期的结果。\n\n```c\n#define\
  \ __STDC_WANT_LIB_EXT1__ 1\n\n#include <stdio.h>\n\n#include <string.h>\n\n#include\
  \ <stdlib.h>\n\n#include <errno.h>\n\n#include <malloc.h>\n\nerrno_t print_error(errno_t\
  \ errnum) {\n  rsize_t size = strerrorlen_s(errnum);\n  char* msg = malloc(size);\n\
  \  if ((msg != NULL) && (strerror_s(msg, size, errnum) != 0)) {\n    fputs(msg,\
  \ stderr);\n    return 0;\n  }\n  else {\n    fputs(\"unknown error\", stderr);\n\
  \    return ENOMEM;\n  }\n}\n\nint main(void) {\n  print_error(ENOMEM);\n  exit(1);\n\
  }\n```\n*列表 11-6：打印错误*\n\n当从 Visual C++ 运行此程序时，它输出以下内容：\n\n`unknown error`\n\n这不是该测试的预期结果。`ENOMEM`\
  \ 宏应该生成类似于 \"out of memory\" 的字符串。输出 \"unknown error\" 字符串可能意味着 `else` 子句中的 `fputs`\
  \ 调用被执行了，如果调用 `malloc` 或 `strerror_s` 任何一个失败就会这种情况。还有一种微小的可能是 \"unknown error\"\
  \ 是 `strerror_s` 调用返回的实际字符串。我们可以通过将 ➋ 处的字符串输出更改其他内容（例如 \"bananarama\"）并重新运行测试来测试这种可能性。当我们重新编译并重新运行测试时，我们将看到以下输出：\n\
  \n`bananarama`\n\n我们可以此作为 `else` 语句正在执行的确定证据。这表明测试结果为假，导致了 `else` 语句的执行。我们需要测试这一点。初学者往往倾向于通过在整个代码中插入打印语句来调试一切，但使用调试器通常更有效。在\
  \ Visual C++ 中，你可以通过选择“调试”来开始调试。在此之前，你应该设置一个断点——例如在 `if` 语句之前。在 Visual C++ 中，通过点击要断行的行号左侧设置断点。在这种情况下，我们将选择“逐步执行”来查看将执行哪条语句。控制继续执行\
  \ `else` 语句中的 `fputs` 调用 ➊，但仍然不清楚原因。一种可能的假设是 `strerror_s` 调用以某种方式失败了，因此接下来我们将尝试捕获错误。\n\
  \n在 Visual C++ 中检查函数的返回值可能是可能的，但相反，我们将临时重写 `print_error` 函数，将 `strerror_s` 的返回值存储在自动变量中，如列表\
  \ 11-7 所示。现在我们可以轻松地检查此变量的值。\n\n\n\n\n\n```c\nchar* msg = malloc(size);\n\nif (msg\
  \ != NULL) {\n  errno_t status = strerror_s(msg, size, errnum);\n  if (status !=\
  \ 0) {\n    fputs(msg, stderr);\n    return ENOMEM;\n  }\n}\nelse {\n  fputs(\"\
  unknown error\", stderr);\n  return ENOMEM;\n}\n}\n```\n\n*   *Listing 11-7: 重写后的\
  \ `print_error` 函数*\n\n在 `status != 0` 的测试处设置断点，并在调试器中检查自动变量 `status` 的值，以确定发生了何种错误。你应该能看到\
  \ `status` 的值为 `0`，这意味着没有发生错误，因此我们可以排除 `strerror_s` 失败导致问题的原因。\n\n既然我们看到 `status`\
  \ 的值为 `0`，那么你应该很直易地发现这个测试写反了——我们希望在调用 `strerror_s` 成功时打印错误信息，而不是在失败时打印。你可以通过测试 `status`\
  \ 是否等于 `0` 来修复这个缺陷，如下所示：\n\n```c\nif (status == 0) {\n```\n\n现在我们极可能修复了一个 bug 并恢复了我们的过度自信，我们将重新运行这个程序：\n\
  \nNot enough spac\n\n我们现在似乎选择了正确的分支并获取了正确的错误信息，但错误信息似乎被截断了。这仍然是一种进展（某种意义上的）。在这种情况下，我通常会绝望到去查阅文档。C\
  \ 标准第 K.3.7.4.2 节（`strerror_s` 函数）规定：\n\n如果目标字符串的长度小于 `maxsize`，则将字符串复制到 `s` 指向的数组中。否则，如果\
  \ `maxsize` 大于 0，则从字符串中复制 `maxsize-1` 个字符到 `s` 指向的数组中，然后将 `s[maxsize-1]` 设为空字符。接着，如果\
  \ `maxsize` 大于 3，则将 `s[maxsize-2]`、`s[maxsize-3]` 和 `s[maxsize-4]` 设置为句号（.）。\n\n\
  我们现在可以看到，情况比最初想象的要糟糕得多（通常都是如此）。因为边界检查接口如果没有完全复制字符串通常就会失败，所以 `print_error` 函数假设如果\
  \ `strerror_s` 无法将字符串完全复制到可用存储空间，它就会失败，但显然事实并非如此。然而，我们也没有看到标准要求的将字符串末尾设置为“...”的文档行为。这本会导致以下输出：\n\
  \nNot enough s...\n\n检查 `strerrorlen_s` 函数的规范，我们可以看到它返回完整消息字符串中的字符数（不包括空字符）。这个解释是合理的，并且与\
  \ `strlen` 函数的行为保持一致。因此，也许我们可以通过为 `size` 增加一个字节来解决问题，如下：\n\n```c\nrsize_t size =\
  \ strerrorlen_s(errnum) + 1;\n```\n\n再次，让我们过度自信并运行程序：\n\nNot enough space\n\n显然，我们的自信是有根据的，因为完整的错误信息现在已经成功输出了。然而，在这个版本的\
  \ `print_error` 函数中仍然存在一个缺陷。我稍后会来看它，但你可以先尝试找到它。\n\n一旦成功调试了 `print_error` 函数，你可以将其恢复为修正后更紧凑的表示形式，或者保持原样。如果你再次修改代码，请确保重新测试程序以确保它仍在运行。你还应该花时间向开发者报告实现中的任何缺陷。\n\
  \n### 单元测试\n\n现在我们有了一个“可以工作”的 `print_error` 函数实现，是时候进行一些单元测试了，以确认我们关于函数正在运行的假设。*单元测试*是运行代码的小型程序。*单元测试*是一个验证软件每个单元都按照设计要求运行的过程。*单元*是任何软件中最小的可测试部分；在\
  \ C 中，这通常是一个独立的函数或数据抽象。\n\n你可以编写类似于普通应用程序代码的简单测试（例如参见列表 11-7），但使用*单元测试框架*通常是有益的。目前有多种单元测试框架，包括\
  \ Google Test、CUnit、Unity、DejaGnu 和 CppUnit。我们将检查其中最流行的一个（根据 JetBrains 对 C 开发生态系统的最新调查）：Google\
  \ Test。\n\nGoogle Test 支持 Linux、Windows 或 macOS。测试是用 C++ 编写的，因此你为了测试之目的学习了另一种（相关的）编程语言。在\
  \ Google Test 中，你编写断言来验证被测代码的行为。Google Test 断言是类函数的宏，它们是测试的真实语言。如果测试崩溃或断言失败，则测试为失败；否则，测试为成功。断言的结果可以是成功、非致命失败或致命失败。如果发生致命失败，当前函数将终止；否则，程序将正常继续。\n\
  \nGoogle Test 已集成到 Visual Studio 2017 及更高版本的 IDE 中，作为“使用 C++ 的桌面开发”工作负载的默认组件。这使得设置和使用变得非常简单。\n\
  \n我们将使用 Google Test 来测试列表 11-9 所示的 `get_error` 函数。大部分 C++ 代码都是样板代码，可以在不修改的情况下复制，例如\
  \ `main` 函数，它调用类函数宏 `RUN_ALL_TESTS` 来运行你定义的测试。\n\n```c\nchar *get_error(errno_t\
  \ errnum) {\n  rsize_t size = strerrorlen_s(errnum) + 1;\n  char* msg = malloc(size);\n\
  \  if (msg != NULL) {\n    errno_t status = strerror_s(msg, size, errnum);\n   \
  \ if (status != 0) {\n      fputs(msg, stderr);\n      return ENOMEM;\n    }\n \
  \ }\n  else {\n    fputs(\"unknown error\", stderr);\n    return ENOMEM;\n  }\n\
  \  return msg;\n}\n```\n*   Listing 11-8: `get_error` 函数*\n\n```cpp\n#include \"\
  pch.h\"\nextern \"C\" char* get_error(errno_t errnum); // 在 C 源实现\nnamespace {\n\
  \  TEST(MyTestSuite, MsgTestCase) {\n    EXPECT_STREQ(get_error(ENOMEM), \"Not enough\
  \ space\");\n    EXPECT_STREQ(get_error(ENOTSOCK), \"Not a socket\");\n    EXPECT_STREQ(get_error(EPIPE),\
  \ \"Broken pipe\");\n  }\n} // namespace\nint main(int argc, char** argv) {\n  ::testing::InitGoogleTest(&argc,\
  \ argv);\n  return RUN_ALL_TESTS();\n}\n```\n*   Listing 11-9: `get_error` 函数的单元测试*\n\
  \n\n\n\n\n在函数体中插入任何 Google Test 断言，以及你想要包含的任何额外 C++ 语句。在列表 11-9 中，我们使用了 `EXPECT_STREQ`\
  \ 断言，它用于验证两个字符串的内容是否相同。我们对几个错误代码使用了该断言，以验证函数是否为每个错误代码返回了正确的字符串。`EXPECT_STREQ` 断言是非致命性断言，因为即使此特定断言失败，测试也可以继续。这通常比致命性断言要好，因为它允许你能够在单次“运行-编辑-编译”循环中检测并修复多个\
  \ bug。如果在发生初始失败后无法继续测试（例如，后续操作依赖于之前的结果），你可以使用致命性的 `ASSERT_STREQ` 断言。\n\n该测试用例测试了来自\
  \ `<errno.h>` 的几个错误代码。应该测试其中的多少个，取决于你想要实现的目标。理想情况下，测试应该是全面的，这意味着要为 `<errno.h>` 中的每一个错误代码添加断言。然而，这可能会变得非常乏味；一旦你确认了代码运行正常，你大部分时候只是在测试你使用的底层\
  \ C 标准库函数是否实现正确。相反，我们可以测试我们可能会获取的错误代码，但这再次可能变得乏味，因为我们必须识别程序中调用的所有函数以及它们可能返回的错误代码。\n\
  \n在列表 11-9 中，我们选择实现一个抽点检查，检查列表中不同位置随机选择的几个错误代码。运行此测试的结果如列表 11-10 所示。\n\n```\n.\\\
  crash-test.exe\n\n[==========] Running 1 test from 1 test case.\n\n[----------]\
  \ Global test environment setup.\n\n[----------] 1 test from MyTestSuite\n\n[ RUN\
  \      ] MyTestSuite.MsgTestCase\n\ncrash-test\\TestMain.cpp(39): error: Expected\
  \ equality of these values:\n\n  get_error(128)\n\n➊ Which is: \"Unknown error\"\
  \n\n➋ \"Not a socket\"\n\n[  FAILED  ] MyTestSuite.MsgTestCase (5 ms)\n\n[----------]\
  \ 1 test from MyTestSuite (10 ms total)\n\n[----------] Global test environment\
  \ tear-down\n\n[==========] 1 test from 1 test case ran. (31 ms total)\n\n[  PASSED\
  \  ] 0 tests.\n\n[  FAILED  ] 1 test, listed below:\n\n[  FAILED  ] MyTestSuite.MsgTestCase\n\
  \n1 FAILED TEST\n```\n\n*列表 11-10：MyTestSuite.MsgTestCase 的测试运行*\n\n令人有些惊讶的是（至少，我很很惊讶），有两个断言通过了，但对\
  \ `get_error(ENOTSOCK)` 的调用失败了，因为 `strerror_s` 返回的是 \"Unknown error\" ➊ 而不是 \"Not\
  \ a socket\" ➋。\n\n在提交强制性的缺陷报告后，我们面临着如何解决这个问题的难题。第一个解决方案就是接受它。这意味着如果以后返回了该 `errno`，用户可能会看到一条模糊的\
  \ \"Unknown error\" 消息，而不是更有用的内容。如果你能接受这一点，可以将预期结果更改为 \"Unknown error\"，或者保持测试用例不变，并知道你最终可能需要在带有失败测试用例的情况下部署你的应用程序。无论哪种情况，你都应该能够判断库实现者最终是否修复了所报告的缺陷。\n\
  \n如果你无法接受模糊的错误消息，可以为 `strerror_s` 函数提供一个包装方法，以提供缺失的错误消息。如果你计划这样做，那么现在可能值得你对 `get_error`\
  \ 和 `strerror_s` 函数进行全面的测试，以识别所有需要修复的用例。\n\n### 静态分析\n\n静态分析包括任何在不执行代码的情况下评估代码的过程（ISO/IEC\
  \ TS 17961:2013），其目标是提供有关可能的软件缺陷的信息。这些分析可以手动进行，尽管随着程序复杂性的增加，手动分析会迅速变得不可行。相反，我们可以使用静态分析工具。\n\
  \n静态分析具有实际操作的局限性，因为软件的正确性在计算上是不可判定的。例如，计算机科学中的停机问题指出，某些程序的精确控制流是无法静态确定的。因此，任何依赖于控制流的属性（如停止）对于某些程序可能是不可判定的。结果是静态分析可能无法报告缺陷，或者在不存在缺陷的地方报告缺陷。\n\
  \n未能报告代码中的真实缺陷被称为假性阴性（false negative）。假性阴性是严重的分析错误，因为它们可能会带给你一种虚假的安全感。大多数工具倾向于采取谨慎态度，因此会产生假性阳性（false\
  \ positive）。假性阳性是一个错误地指示存在缺陷的测试结果。工具可能会报告某些高风险缺陷，并漏掉其他缺陷，这是试图不让假性阳性淹没用户的非意图后果。当代码过于复杂而无法完整分析时，也可能发生假性阳性。使用函数指针和库会增加假性阳性的可能性。\n\
  \n理想情况下，工具在分析中既是完备的（complete）的又是可靠的（sound）。如果一个分析器不会给出假性阴性结果，则它被认为是`可靠的`。如果一个分析器不会发布假性阳性，则它被认为是`完备的`。给定规则的各种概述在图\
  \ 11-1 中。\n\n![image](img/fig11.jpg)\n*图 11-1：完备性与可靠性*\n\n编译过程执行了有限的静态分析，提供了不需要太多推理的局部问题诊断。例如，当符号值与无符号值比较时，编译器可能会发出类型不匹配的诊断。我们之前讨论的标志如\
  \ Visual C++ 的 `/W4` 和 GCC 的 `-Wall` 控制了编译器的输出。编译器通常提供高质量的诊断，你不应该忽略它们。始终尝试理解警告的原因并重写代码以消除错误，而不是通过随意修改来消除警告。有关此主题的更多信息，请参见\
  \ CERT C 规则 `MSC00-C`（清洁编译）。\n\n一旦你解决了代码中的编译器警告，可以使用独立的静态分析器来识别额外的缺陷。静态分析器通过评估程序中的表达式、执行深度流分析以及对可能的数值范围和控制路径进行推理，诊断更复杂的缺陷。\n\
  \n让工具定位并识别程序中的特定错误比反复测试和调试容易得多，比部署缺陷代码成本低得多。有很多免费和商业静态分析工具。例如，Visual C++ 有可以通过 `/analyze`\
  \ 标志启用的静态分析功能。Visual++ 分析允许指定想要运行的规则集（如推荐、安全或国际化），或运行所有规则。有关 Visual C++ 代码分析的更多信息，请访问微软网站：[`docs.microsoft.com/en-us/visualstudio/code-quality/code-analysis-for-c-cpp-overview/`](https://docs.microsoft.com/en-us/visualstudio/code-quality/code-analysis-for-c-cpp-overview/)。同样，Clang\
  \ 有一个静态分析器，可以作为独立工具或在 Xcode 中运行（[`clang-analyzer.llvm.org/`](https://clang-analyzer.llvm.org/)）。GCC\
  \ 10 也会有一个简单的静态分析器。还存在商业工具，例如 GrammaTech 的 CodeSonar、TrustInSoft Analyzer、SonarSource\
  \ 的 SonarQube、Synopsys 的 Coverity、LDRA Testbed、Perforce 的 Helix QAC 等。\n\n许多静态分析工具的功能互不重叠，因此使用多个工具可能是合理的。\n\
  \n\n\n\n\n# 动态分析\n\n动态分析是在执行过程中对系统或组件进行评估的过程。也被称为运行时分析（runtime analysis）。\n\n动态分析的一种常用方法是对代码进行插桩（instrument）——例如，通过启用编译标志向可执行文件注入额外的指令，然后运行插桩后的可执行文件。第\
  \ 6 章 中描述的调试内存分配库 `dmalloc` 也采用了类似的方法。`dmalloc` 库提供了替换的内存管理程序，并带有运行时可配置的调试功能。你可以使用命令行工具（也称为\
  \ `dmalloc`）来控制这些程序的行为，以检测内存泄漏，并发现和报告如写入对象边界之外以及在释放后使用指针等缺陷。\n\n动态分析的优点是其误报率较低，因此，如果这些工具之一标记了问题，请修复它！\n\
  \n动态分析的缺点是它需要足够的代码覆盖率。如果如果在测试过程中没有执行缺陷代码路径，则缺陷将无法被发现。另一个缺点是插桩可能会以不受意的方式改变程序的其他方面，例如增加性能开销或增大二进制文件的大小。\n\
  \nAddressSanitizer 是一个有效的动态分析工具示例，已针对多个编译器（免费）提供。存在几个相关的清理工具，包括 `ThreadSanitizer`、`MemorySanitizer`、`Hardware-Assisted\
  \ AddressSanitizer` 和 `UndefinedBehaviorSanitizer`。(16) 许多其他商业和免费的动态分析工具可用。通过详细讨论\
  \ AddressSanitizer 来演示这些工具的价值。\n\n## AddressSanitizer\n\n`AddressSanitizer (ASan)`\
  \ 是一个用于 C 和 C++ 语言程序的动态内存错误检测器；参见 *[`github.com/google/sanitizers/wiki/AddressSanitizer`](https://github.com/google/sanitizers/wiki/AddressSanitizer)*。它已集成到\
  \ LLVM 3.1 版本和 GCC 4.8 以及这些编译器的更高版本中。ASan 也从 Visual Studio 2019 开始可用。这个动态分析工具可以发现多种内存错误，包括：\n\
  \n* 释放后使用（悬指针解引用）\n* 堆、栈和全局缓冲区溢出\n* 返回后使用\n* 作用域后使用\n* 初始化顺序缺陷\n* 内存泄漏\n\n为了演示 ASan\
  \ 的用处，我们将使用 ASan 对列表 11-7 中重写的 `print_error` 函数以及列表 11-8 中的 `get_error` 函数进行插桩，然后在\
  \ Ubuntu Linux 上分析代码。我们已经为列表 11-9 中的 `get_error` 函数开发了单元测试，我们将为该目的扩展这些测试。\n\n列表\
  \ 11-11 中的 Google Test 代码测试了两个打印错误的实用函数。除了确保 `get_error` 函数返回正确字符串的测试用例外，，我们还添加了非致命的\
  \ `EXPECT_EQ` 断言，用于测试调用 `print_error` 的返回值是否为 0。\n\n```cpp\nTEST(PrintTests, MsgTestCase)\
  \ {\n  ASSERT_STREQ(get_error(ENOMEM), \"Not enough space\");\n  ASSERT_STREQ(get_error(ENOTSOCK),\
  \ \"Not a socket\");\n  ASSERT_STREQ(get_error(EPIPE), \"Broken pipe\");\n  EXPECT_EQ(print_error(ENOMEM),\
  \ 0);\n  EXPECT_EQ(print_error(ENOTSOCK), 0);\n  EXPECT_EQ(print_error(EPIPE), 0);\n\
  }\n```\n*列表 11-11: 错误打印测试*\n\n接下来，我们需要在 Ubuntu Linux 上构建并运行这些代码。\n\n### 在 Ubuntu\
  \ Linux 上构建代码\n\n如果你成功编译并测试了列表 11-8 中的 `get_error` 函数，那么在你的 Ubuntu Linux 机器上应该有一个工作良好的边界检查接口实现。接下来，你可能需要使用\
  \ Ubuntu 上的 `apt-get` 命令安装 Google Test 开发包：\n\n```bash\nsudo apt-get install libgtest-dev\n\
  ```\n\n该包仅安装源文件，因此你需要编译代码以创建必要的库文件。切换到存放这些源文件的 `/usr/src/gtest` 文件夹，并使用 `cmake`\
  \ 编译库，使用以下命令：\n\n```bash\nsudo apt-get install cmake # 安装 cmake\ncd /usr/src/gtest\n\
  sudo cmake CMakeLists.txt\nsudo make\n# # 将 libgtest.a 和 libgtest_main.a 拷贝或链接到你的\
  \ /usr/lib 文件夹\nsudo cp *.a /usr/lib\n```\n\n现在你应该可以在 Ubuntu 机器上继续构建并运行列表 11-11\
  \ 中的 `PrintTests`。这可能需要对源代码和构建文件进行修改。\n\n### 运行测试\n\n`get_error` 和 `print_error`\
  \ 函数使用的 `strerror_s` 函数返回特定于区域环境的消息字符串。运行列表 11-11 中的测试，你可能会发现某些不对劲——即 `get_error`\
  \ 函数的测试全部失败了。\n\n```cpp\nTEST(PrintTests, MsgTestCase) {\n  ASSERT_STREQ(get_error(ENOMEM),\
  \ \"Not enough space\");\n  ASSERT_STREQ(get_error(ENOTSOCK), \"Not a socket\");\n\
  \  ASSERT_STREQ(get_error(EPIPE), \"Broken pipe\");\n  EXPECT_EQ(print_error(ENOMEM),\
  \ 0);\n  EXPECT_EQ(print_error(ENOTSOCK), 0);\n  EXPECT_EQ(print_error(EPIPE), 0);\n\
  }\n```\n*列表 11-12: 错误打印测试*\n\n运行修改后的列表 11-12 测试现在应该产生预期的结果。没有经验的测试人员可能会查看这些结果并错误地认为：“嘿，代码运行正常！”然而，你应该采取额外步骤来提高对代码没有缺陷的信心。\n\
  \n```bash\nstudent@scode:asan$ ./runTests\n[==========] Running 1 test case.\n[----------]\
  \ Global test environment set-up.\n[----------] 1 test from PrintTests\n[ RUN  \
  \    ] PrintTests.MsgTestCase\nCannot allocate memory\nSocket operation non-socket\n\
  Broken pipe\n[       OK ] PrintTests.MsgTestCase (0 ms)\n[----------] 1 test from\
  \ PrintTests (0 ms total)\n[----------] Global test environment tear-down\n[==========]\
  \ 1 test ran. (0 ms total)\n[  PASSED  ] 1 test.\n```\n*列表 11-13: PrintTests 的运行*\n\
  \n现在我们已经有了工作良好的测试框架，是时候对代码进行插桩了。\n\n### 代码插桩\n\n你可以通过在使用 AddressSanitizer 编译和链接程序时使用\
  \ `-fsanitize=address` 标志来插桩代码。为了获得更有信息的栈跟踪添加 `-fno-omit-frame-pointer` 标志，为了获取符号调试信息添加\
  \ `-g3` 标志。使用 `cmake`，你可以通过在 `CMakeLists.txt` 文件包含以下行来添加这些标志：\n\n```cmake\nset (CMAKE_C_FLAGS\
  \ \"${CMAKE_C_FLAGS} -g3 -fno-omit-frame-pointer -fsanitize=address\")\n```\n\n\
  如前所述，AddressSanitizer 支持 Clang、GCC 和 Visual C++(17) 根据你使用的编译器版本，可能还需要定义以下环境变量：\n\
  \n```bash\nASAN_OPTIONS=symbolize=1\nASAN_SYMBOLIZER_PATH=/path/to/llvm_build/bin/llvm-symbolizer\n\
  ```\n\n设置好这些后，尝试重新构建并运行你的测试。\n\n### 运行测试\n\n你使用 Google Test 编写的单元测试应该通过，但也会通过允许\
  \ AddressSanitizer 检测额外问题来执行你的代码。你现在应该能在运行 `PrintTests` 时看到列表 11-14 中的额外输出。\n\n\n\
