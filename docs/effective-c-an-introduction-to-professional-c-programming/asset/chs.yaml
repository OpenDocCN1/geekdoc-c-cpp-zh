  \ 首席科学家\n## 前言\n作者：OLLIE WHITEHOUSE\n当我 25 多年前开始进入网络安全领域时，我主要是通过通过发现和利用 C 程序中不安全的内存处理来学习本领的——这类漏洞在当时就已经有\
  \ 20 多年的历史了。在 BlackBerry 的职业期间，当我审阅如山般的代码时，我亲眼证了 C 语言对于处理不当的人来说是多么危险。现在，作为一家跨国网络安全专业和托管服务公司的\
  \ CTO，我每天都能看到编写糟糕的 C 代码对我们互联社会带来的后果。\n今天，我们在编写安全且专业的 C 语言方面仍然面临许多挑战。编译器和操作系统层面防御措施的许多创新可以被且经常被破坏。尽管我们看到其他现代语言中先进的创新，但对\
  \ C 的需求仍在增长，特别是在 IoT 或其他高度资源受限的环境中。\nRobert 是如何用 C 语言进行专业且安全编程的权威。十多年来，我一直向客户和内部团队推荐他的教材。没有比他更合适的人来教如何以专业的方式（以及其他安全的方式）编写\
  \ C 代码了。\n在今天编写专业的 C 代码意味着编写高性能、安全且稳固的代码。通过这种方式，你将为我们的互联社会做出贡献，而不会增加其技术债。\n本书将帮助那些几乎或完全没有\
  \ C 经验的人快速掌握知识和技能，成为专业的 C 程序员，并为开发高性能、安全且稳固的系统提供坚实的基础。\nOllie Whitehouse\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n- 不要阻止程序员做需要做的事。因为 C 是一种系统编程语言，它必须能够处理各种低级任务。\n- 为一种操作只提供一种方法。这被称为机制守恒，C\
  \ 语言试图限制重复机制的引入。\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n你将学习如何控制单个语句求值的顺序。我们将首先回顾定义执行任务的表达式语句和复合语句。然后，我们将涵盖三种决定哪些代码块执行以及执行顺序的语句：选择语句、迭代语句和跳转语句。\n\
