  Target: x86_64-pc-linux-gnu\nInstalledDir: /usr/bin\n\n\n\n\n\n\n\n\n\n*   未指定的行为\
  \ (Unspecified behavior)\n*   特定区域语言的行为 (Locale-specific behavior)\n\n\n\n\n\n\n\
  \n\n\n*   当行为被明确指定为“未定义行为”时\n\n\n\n*   避免定义偏于某种特定实现策略的模糊边缘情况\n\n\n这三个原因确实非常不同，但都被视为可移植性问题。我们将在本书的后续内容检查这三种情况的示例。编译器（实现）有权执行以下操作：\n\
  *   完全忽略未定义行为，导致不可预测的结果\n*   终止编译或执行（并发出诊断信息）\n这些选项都不理想（特别是第一种），因此最好的做法是避免未定义行为，除非实现规定这些行为是已定义的，以便允许你调用语言扩展。\n\
  ### 区域特定行为与常见扩展\n`区域特定行为`（Locale-specific behavior）取决于每个实现所记录的国、文化和语言的局部惯例。常见扩展在许多系统中被广泛使用，但它们并不移植到所有实现中。\n\
  ## 总结\n在本章中，你学习了如何编写一个简单的 C 语言程序、编译它并运行它。我们还查看了几个编辑器和交互式开发环境，以及你可以用于在 Windows、Linux\
  \ 和 macOS 系统上开发 C 程序的编译器。通常情况下，你应该使用较新版本的编译器和其他工具，因为它们往往支持 C 编程语言的新特性，并提供更好的诊断和优化。如果新版本的编译器会破坏你的现有代码，或者你正准备部署代码，你可能就不想使用新版本的编译器，以避免向已经测试过的应用程序中引入不必要的更改。我们通过对\
  \ C 语言程序可移植性的讨论结束了本章。\n后续章节将检查 C 语言和库的特定特性，从下一章的对象、函数和类型开始。\n# 2 对象、函数和类型\n![Image](img/common.jpg)\n\
  在本章中，你将学习对象、函数和类型。我们将研究如何声明变量（带有标识符的对象）和函数、获取对象的地址，以及对这些对象指针进行解引用。你已经看到了一些 C 程序员可以使用的类型。在本章中学到的第一件事是我学到的最后事情之一：C\
  \ 语言中的每个类型类型是`对象`类型或`函数`类型。\n### 对象、函数、类型和指针\n`对象`（object）是可以表示值的存储区域。准确来说，C 标准（ISO/IEC\
  \ 9899:2018）将对象定义为“执行环境中的数据存储区域，其内容可以表示值”，并补充说明：“当引用时，对象可以被解释为具有特定的类型”。变量是对象的一个示例。\n\
  `变量`（Variables）具有声明的`类型`（type），它告诉该值所表示的是什么种的对象。例如，类型为 `int` 的对象包含一个整数值。类型非常重要，因为表示一种类型对象的位集合如果被解释为另一种类型的对象，可能会产生不同的值。例如，数字\
  \ 1 在 IEEE 754（IEEE 浮点数算术标准）中通过位模式 `0x3f800000`（IEEE 754–2008）表示。但如果你将相同的位模式解释为整数，你将得到值\
  \ 1,065,353,216 而不是 1。\n`函数`（Functions）不是对象，但它们有类型。函数类型的特征由其返回类型以及参数的数量和类型共同决定。\n\
  C 语言还有`指针`（pointers），它们可以被认为是一个`地址`（address）——内存中存储对象或函数的位置。指针类型派生自一个函数类型或对象类型，称为`引用类型`（referenced\
  \ type）。派自引用类型 `T` 的指针类型称为指向 `T` 的指针（pointer to T）。\n由于对象和函数是不同的实体，对象指针和函数指针也是不同的实体，不应互换使用。在接下来的节中，你将编写一个简单的程序尝试交换两个变量的值，以帮助更好地理解对象、函数、指针和类型。\n\
