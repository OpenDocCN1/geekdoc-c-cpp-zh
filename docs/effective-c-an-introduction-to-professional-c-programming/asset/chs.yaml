  \n![image](img/f0243-01.jpg)\n\n## 涵盖 C17 和 C2x\n\n![image](img/f0244-01.jpg)\n\n\
  “现代时代的 C 编程”\n— PASCAL CUOQ\n\n世界运行在 C 语言编写的代码之上，但大多数学校从 Python 或 Java 开始课程。《Effective\
  \ C》弥补了这一空白，并将 C 引入现代时代——涵盖现代 C17 标准以及潜在的 C2x 特性。在经典经典的帮助下，你很快就能编写专业、可移植且安全的 C 程序来驱动强大的系统并解决现实问题。\n\
  \nRobert C. Seacord 介绍了 C 和 C 标准库，同时解决了最佳实践、常见错误以及 C 社区中的公开辩论。《Effective C》与其他 C\
  \ 标准委员会专家共同开发，教你如何调试、测试和分析 C 程序。你将从 Seacord 对 C 语言结构和行为的简洁解释，以及他 40 年的编程经验中受益。\n\
  \n你将学习：\n\n* 如何识别和处理 C 程序中的未定义行为\n* 整数和浮点值的范围和表示\n* 动态内存分配的工作原理以及使用非标准函数\n* 如何使用字符编码和类型\n\
  * 如何使用 C 标准流和 POSIX 文件描述符与终端及文件系统进行 I/O 操作\n* 如何理解 C 编译器的翻译阶段以及预处理器的作用\n* 如何测试、调试和分析\
  \ C 程序\n\n### 关于作者\n\nRobert C. Seacord 是 NCC Group 的技术总监，在那里他开发并提供 C、C++ 以及其他语言的安全编码培训。Seacord\
  \ 是标准委员会的专家。他之前的书籍包括《CERT 编码标准与 C++ 安全编码》。\n\n![image](img/logo.jpg)\n\n***极客娱乐之极品***\n\
