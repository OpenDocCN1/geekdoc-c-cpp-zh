  \ `pass-by-reference`）。\n### 作用域\n对象、函数、宏和其他 C 语言标识符具有`作用域`（scope），它限制了它们可以被访问的连续区域。C\
  \ 语言有四种作用域：文件、块、函数原型和函数。\n对象或函数标识符的作用域由其声明的位置决定。如果声明在任何块或参数列表之外，则标识符具有文件作用域。如果声明在块或参数列表内部，则标识符具有块作用域。如果声明在函数原型内部，则标识符具有函数原型作用域。\n\
  ```c\n\n  int j = 1; // j 的块作用域开始；隐藏了文件作用域 j\n  for (int i = 0; i < 2; i++) { //\
  \ 循环局部 i 的块作用域开始\n    printf(\"%d\\n\", j); // 内部 j 在范围内，打印 2\n  printf(\"%d\\n\"\
  , j); // 外部 j 在范围内，打印 1\n\n```\n\n\n只要注释准确地描述了你的意图，这段代码没有问题。最佳实践是对不同的标识符使用不同的名称，以避免导致混淆从而产生错误。对于作用域较小的标识符，使用像\
  \ `i` 和 `j` 这样的短名称是可以的在大作用域内的标识符应该具有较长的、描述性的名称，这些名称不太可能在嵌套作用域中被隐藏。某些编译器会对隐藏的标识符发出警告。\n\
  ## 存储生存期\n对象具有存储生存期，这决定了它们的寿命。总共有四种存储生存期：自动（automatic）、静态（static）、线程（thread）和分配（allocated）。你已经看到，自动存储生存期的对象是在块内或作为函数参数声明的。这些对象的生命周期从它们所在的块开始执行开始，到该块执行结束结束。如果递归进入该块，每次都会创建一个新对象，每个对象都有自己的存储空间。\n\
  **注意**\n作用域（Scope）和生命周期（lifetime）是完全不同的概念。作用域适用于标识符，而生命周期适用于对象。标识符的作用域可以通过其名称访问该标识符所指对象的代码区域。对象的生命周期是对象存在的时间段。\n\
  在文件作用域内声明的对象具有静态存储生存期。这些对象的生命周期是整个程序的执行过程，它们的存储值在程序启动之前初始化。你也可以通过存储类限定符 `static`\
  \ 在块作用域内声明一个具有静态存储生存期的变量，如列表 2-6 中的计数示例所示。这些对象在函数退出后依然存在。\n```c\n  static unsigned\
  \ int counter = 0;\n  printf(\"%d \", counter);\n\n  for (int i = 0; i < 5; i++)\
  \ {\n  }\n}\n\n\n\n\nint *func(int i) {\n  static int k = j; // 错误\n}\n\n\n\n\n\n\
  \n\n\nstruct S {\n};\nint main(void) {\n  _Alignas(struct S) unsigned char good_buff[sizeof(struct\
  \ S)];\n  struct S *good_s_ptr = (struct S *)good_buff; // 正确的指针对齐\n```\n*列表 2-7：使用\
  \ _Alignas 关键字*\n对齐从弱到强（也称为严格）排序。严格的对齐具有更大的对齐值。满足对齐要求的地址也满足任何有效的弱对齐要求。\n## 对象类型\n\
