  \ Studio 有三个版本：社区版、专业版和企业版。社区版的优势是免费，而其他版本则需要付费。对于本书，你需要社区版。\n对于 Linux，选择并不那么明显。Vim、Emacs、Visual\
  \ Studio Code 和 Eclipse 都是选项。Vim 是许多开发者和高级用户的首选编辑器。它是基于 Bill Joy 在 70 年代为 Unix 版本编写的\
  \ vi 编辑器。它继承了 vi 的按键绑定，但增加了原始 vi 缺失的功能和扩展性。你可以选择安装 Vim 插件，如 `YouCompleteMe` (`[`github.com/Valloric/YouCompleteMe/`](https://github.com/Valloric/YouCompleteMe/)`)\
  \ 或 `deoplete` (`[`github.com/nvim-deoplete/`](https://github.com/nvim-deoplete/)`)\
  \ 来为 C 编程提供原生的语义补全。\nGNU Emacs 是一个可扩展、可定制且免费的文本编辑器。它的核心是一个 Emacs Lisp 解释器，它是 Lisp\
  \ 编程语言的一种，带有文本编辑的扩展——尽管我从未发现这有什么问题。如实说明：我开发过的所有 C 代码都是在 Emacs 中编辑的。\n*Visual Studio\
  \ Code (VS Code)* 是一个精简的代码编辑器，支持调试、任务运行和版本控制等开发操作（在第 11 章](#ch11.xhtml_ch11) 中介绍）。它为开发者提供了代码-构建-调试循环所需的工具。VS\
  \ Code 运行在 macOS、Linux 和 Windows 上，并且个人或商业用途均免费。Linux 和其他平台都有安装说明；^(4)在 Windows\
