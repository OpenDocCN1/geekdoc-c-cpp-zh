  你即将开启一段旅程，这段旅程结束后，你将成为一名崭崭的但专业的 C 开发者。\n# 1. 开启 C 语言之旅\n![Image](img/common.jpg)\n\
  在本章中，你将开发你的第一个 C 程序：传统的“Hello, world!”程序。我将带你了解这个简单程序的各个方面，以及如何编译和运行 C 程序。然后，我将讨论一些编辑器和编译器选项，并列出你在编写\
  \ C 语言时会迅速熟悉的常见移植性问题。\n### 开发你的第一个 C 程序\n\n\n\n#include <stdio.h>\nint main(void)\
  \ {\n    return EXIT_SUCCESS;\n```\n\n\n如果你购买了电子书，请将程序剪切粘贴到编辑器中。尽可能使用剪切粘贴，因为可以减少转录错误。\n\
  #### 编译并运行你的程序\n\n% cc hello.c\n\n这些命令特定于 Linux（以及其他类 Unix 操作系统）。其他操作系统上的其他编译器需要以不同的方式调用。请参阅你特定编译器的文档。\n\
  如果你正确输入了程序，编译命令将在源代码所在的相同目录下创建一个名为 `a.out` 的新文件。使用 `ls` 命令检查目录，你应该能看到以下内容：\n```\n\
  a.out  hello.c\n\n\n% ./a.out\n```\n如果一切顺利，程序应该在终端窗口中打印出 Hello, world!。如果没有打印，请将你的程序文本与列表\
  \ 1-1 中的程序文本进行对比，以确保它们一致。\n`cc` 命令有许多标志和编译器选项。例如，`-o` 标志允许为可执行文件赋予一个好记的名字而不是 `a.out`。以下编译器调用将可执行文件命名为\
  \ `hello`：\n```\n% ./hello\n```\n现在我们将逐行检查 `hello.c` 程序。\n#### 预处理器指令\n\n程序的主部分（之前在列表\
  \ 1-1 中所示）如下：\n```c\n```\n该行定义了启动时调用的 main 函数。main 函数定义了程序从命令行或其他程序被调用时，在托管环境中执行的主入口。C\
  \ 定义了两种可能的执行环境：*独立*（freestanding）和*托管*（hosted）。独立环境可能没有操作系统，通常用于嵌入式编程。这些实现提供了最小的库函数，且启动时调用的函数名称和类型由实现定义。我们主要定义\
  \ main 返回一个 `int` 类型的值，并在括号内放置 `void` 表示该函数不接受参数。`int` 类型是一种有符号整数类型，可以表示正负整数值以及零。与其他过程化语言类似，C\
  \ 程序由过程（称为*函数*）组成，这些可以接受参数并返回值。每个函数都是可重用的工作单元，你可以根据需要频繁调用它们。在本例中，`main` 函数的返回值表示程序是否成功终止。\n\
  \n\n\n\nreturn EXIT_SUCCESS;\n\n\n#define EXIT_SUCCESS 0\n\n\n\nint main(void) {\n\
  }\n\n\nint main(void)\n  // ---snip---\n```\n这个决定纯粹是风格上的选择，因为空白字符（包括换行符）在语法上通常没有意义。在本书中，我通常将左大括号放在与函数声明的同一行，因为这样在风格上更紧凑。\n\
  ### 检查函数返回值\n函数通常会返回一个值，该值是计算的结果，或者表示该函数是否成功完成了其任务。例如，我们在“Hello, world!”程序中使用的 `puts`\
  \ 函数接收一个要打印的字符串，并返回一个 `int` 类型的值。如果发生写入错误，`puts` 函数将返回宏 `EOF` 的值（一个负整数）；否则，它返回一个非负整数值。尽管对于我们的简单的程序来说，`puts`\
  \ 函数失败并返回 `EOF` 的可能性很小，但这是完全可能的。因为调用 `puts` 可能会失败并返回 `EOF`，这意味着你的第一个 C 程序存在 bug，或者至少可以改进如下：\n\
  ```c\n#include <stdlib.h>\nint main(void) {\n    return EXIT_FAILURE;\n  }\n  //\
  \ 这里的代码永远不会执行\n```\n这个修改后的“Hello, world!”程序检查了 `puts` 调用是否返回了值 `EOF`，这表示写入错误。如果函数返回\
  \ `EOF`，程序将返回 `EXIT_FAILURE` 宏的值（其评估结果为非零值）。否则，函数成功，程序返回 `EXIT_SUCCESS`（要求为 0）。调用程序的脚本随后可以检查其状态以判断是否执行成功。跟在\
  \ `return` 语句之后的代码是*死代码*，永远不会执行。在修改后的程序中通过单行注释指出了这一点。`//` 之后的所有内容会被编译器忽略。\n### 格式化输出\n\
  `puts` 函数是向 `stdout` 写入字符串的一种很好、简单的方法，但最终你将需要使用 `printf` 函数打印格式化输出——例如，打印字符串以外的参数。`printf`\
  \ 函数接收一个定义输出格式的格式字符串，后面跟着任意数量的参数，这些参数是你想要打印的实际值。例如，如果你想使用 `printf` 函数来打印 Hello,\
  \ world!，你可以这样写：\n```c\n```\n第一个参数是格式字符串 `\"%s\\n\"`。`%s` 是一个转换规范，指示 `printf` 函数读取第二个参数（字符串字面量）并将其打印到\
  \ `stdout`。`\\n` 是一个用于表示非图形字符的字母转义序列，它告诉函数在字符串后包含一个新行。如果没有这个换行序列，下一个打印的字符（很可能是命令提示符）将出现在同一行。此函数调用输出以下内容：\n\
  ```\n```\n注意不要将用户提供的数据作为 `printf` 函数第一个参数的一部分，因为这样做可能会导致格式化输出安全漏洞 (Seacord 2013)。\n\
  输出字符串最简单的方法是如之前所示使用 `puts` 函数。如果你在修改后的“Hello, world!”程序中使用 `printf` 代替 `puts`，你会发现它不再能够工作了，因为\
  \ `printf` 函数返回状态的方式与 `puts` 函数不同。`printf` 函数在成功时返回打印的字符数，如果发生输出或编码错误，则返回负值。你可以尝试修改“Hello,\
  \ world!”程序来使用 `printf` 函数作为练习。\n### 编辑器与集成开发环境\n可以使用各种编辑器和 IDE 来开发你的 C 程序。图 1-1\
