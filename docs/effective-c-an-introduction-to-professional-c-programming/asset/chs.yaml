  \ `AddressSanitizer` 的组件 `LeakSanitizer` 已经“检测到内存泄漏”，并且这是来自一个对象的 31 字节直接泄漏。堆栈跟踪将我们指向了以下行\
  \ `0x564622aa0b39 in print_error ~/asan/PrintUtils/print_utils.c:12`。\n\n这行代码包含了\
  \ `print_error` 函数中对 `malloc` 的调用：\n\n```c\nerrno_t print_error(errno_t errnum)\
  \ {\n    size_t size = strerror(errnum);\n    char* msg = malloc(size); //---snip---\n\
  }\n```\n\n这是一个相当明显的错误；`malloc` 的返回值被赋值给 `print_error` 作用域内的一个自动变量，且从未被释放。在函数返回且持有指针的对象的生命周期结束后，我们失去了释放该内存的机会。要修复这个问题，在分配的存储空间不再需要之后添加对\
  \ `free(msg)` 的调用。重新运行测试，直到你对程序的质量感到满意。如果你觉得自己特别有虐待倾向，就在周五部署你的代码并挂掉电话。\n\n### 练习题\n\
