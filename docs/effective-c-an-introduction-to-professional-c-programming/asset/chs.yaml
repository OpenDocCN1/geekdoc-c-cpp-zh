  \ 总结\n在本章中，你学习了对象和函数以及它们的区别。你学习了如何声明变量和函数、获取对象的地址以及解引用指针。你还学习了 C 语言中大多数对象类型以及派生类型。我们将在后面的章节中返回这些类型，以详细探索如何使用它们来实现你的设计。在下一章中，我们将提供两种算术类型的详细信息：整数和浮点。\n\
  # 3 算术类型\n![Image](img/common.jpg)\n在本章中你将学习两种算术类型：整数类型和浮点类型。由于 C 中的大多数运算符作用于算术类型，且\
  \ C 是一门系统级语言，正确执行算术操作可能是困难的——因为在限制范围和精度的系统中，结果并不总是与数学结果相同。在 C 中正确执行基本算术操作是成为专业程序员的基础。\n\
  我们将深入研究 C 语言中算术运算的工作原理，让你牢固掌握这些基础概念。我们还将如何将一种算术类型转换为另一种，这对于执行混合类型的操作是必要的。\n### 整数\n\
  正如[第 2 章]所示，每个整数类型表示一个有限的整数范围。符号整数类型可以表示负、零或正；无符号整数只能表示零或正。每个整数类型可以表示的范围取决于实现。整数对象的*值*是存储在对象中的数学值。整数对象的*表示*是对象分配存储中的特定编码。稍后我们将详细查看表示。\n\
  #### 填充与精度\n除了 `char`、`signed char` 和 `unsigned char` 外的所有整数类型可能包含未使用的位，称为*填充*（padding），这允许实现适应硬件特性（例如在多字节表示中间跳过符号位）或与目标架构进行优化对齐。用于表示给定类型值（排除填充但包含符号）的位数被称为*宽度*（width），通常用\
  \ `N` 表示。*精度*（precision）是用于表示值的排除符号和填充位。\n#### <limits.h> 头文件\n`<limits.h>` 头文件提供了各种整数类型的最小和最大可表示值。可表示值是在特定类型对象可用位数内可以表示。无法表示的值将由编译器诊断或转换为一个可表示但不同的（错误的）值。编译器编写者为他们的实现提供了正确的最小、最大和宽度。为了编写可移植的代码，你应该使用这些常量，而不是像\
  \ `2147483647` 这样的字面量，后者在移植到不同的实现时可能会变化。\nC 标准对整数大小仅施加三个限制：首先，每种数据类型的存储空间占据整数个相邻\
  \ `unsigned char` 对象（可能包括填充）。其次，每个整数类型必须支持最小范围，允许你依赖任何实现中可移植的值范围。第三，较小类型的宽度不能大于较大类型。例如，`USHRT_MAX`\
  \ 不能大于 `UINT_MAX`，但它们的宽度可以相同。\n#### 声明整数\n除非显式声明为 `unsigned`，否则整数类型被假设是有符号的（`char`\
  \ 除外，实现可以将其定义为符号或无符号整数类型）。以下是无符号整数的有效声明：\n```c\nunsigned u; // 可以省略 int\nunsigned\
  \ char uc; // 必须使用 unsigned\n\n\nint i; // 可以省略 signed\nlong long sll2; // 可以省略\
  \ signed 和 int\n```\n### 无符号整数\n无符号整数的范围从 0 开始，其上限大于符号整数类型。无符号整数经常用于计数可能具有大量非负数量的项目。\n\
  #### 表示\n无符号整数类型比符号整数类型更容易理解和使用。它们使用纯二进制系统表示值，没有偏移量：最低位权重为 `2⁰`，次低位权重为 `2¹`，依此类推。二进制数的值是所有置位位权重之和。表\
  \ 3-1 显示了某些使用无填充 8 位表示的无符号值示例。\n**表 3-1：8 位无符号值**\n| 十进制 | 二进制 | 十六进制 |\n| 0 | 0000\
  \ 0000 | 0x00 |\n| 17 | 0001 0001 | 0x11 |\n\n\n无符号整数类型不需要表示符号位，因此通常比对应的有符号整数类型多出\
  \ 1 位的精度。无符号整数值的范围是从 0 到一个取决于类型宽度的最大值。这个最大值为 `2^(N) – 1`，其中 `N` 是宽度。例如，大多数 x86 架构使用\
  \ 32 位整数且没有填充位，因此类型为 `unsigned int` 的对象的范围是从 0 到 `2³² – 1` (4,294,967,295)。来自 `<limits.h>`\
  \ 的常量表达式 `UINT_MAX` 规定了该类型实现定义的上范围。表 3-2 显示了每个无符号类型在 `<limits.h>` 中的常量表达式、标准要求的最小范围，以及在在现代\
  \ x86 实现上的实际范围。\n### 表 3-2：无符号整数范围\n| **常量表达式** | **最小幅度** | **x86** | **该类型对象的最大值**\
  \ |\n| `UCHAR_MAX` | 255 // 2⁸ – 1 | 相同 | `unsigned char` |\n| `UINT_MAX` | 65,535\
  \ // 2¹⁶ – 1 | 4,294,967,295 | `unsigned int` |\n| `ULLONG_MAX` | 18,446,744,073,709,551,615\
  \ // 2⁶⁴ – 1 | 相同 | `unsigned long long int` |\n### 溢回 (Wraparound)\n当你执行的算术运算产生的值太小（小于\
  \ 0）或太大（大于 `2^(N) – 1`）而无法用特定的无符号整数类型表示时，就会发生溢回。在这种情况下，该值将对结果类型中可以表示的最大值加 1 的数字取模（modulo）。溢回在\
  \ C 语言中是定义良好的行为。它是否是你的代码中的缺陷取决于上下文。如果你正在计数某些东西而值发生了溢回，这可能是一个错误。然而，在某些加密算法中使用溢回是有意为之的。\n\
  例如，列表 3-1 中的代码将 `ui` 初始化为其最大值然后对其进行递增。结果无法用 `unsigned int` 表示，因此它溢回到了 0。如果此时对该值进行减\
  \ 1 操作，它将再次超出范围，因此会再次溢回到 `UINT_MAX`。\n```c\n\n\n\n\n```\n\n\nfor (unsigned int i\
  \ = n; i >= 0; --i)\n\n\n\nextern unsigned int ui, sum;\n// 为 ui 和 sum 赋值值\nif (sum\
  \ + ui > UINT_MAX)\nelse\n```\n如果 `sum + ui` 的结果大于 `UINT_MAX`，它将对 `UINT_MAX + 1`\
  \ 取模。因此，整个测试都是徒用的，生成的代码将无条件地执行加法运算。高质量的编译器可能会发布警告以指出这一点，但并非所有编译器都这样做。为了纠正这个问题，我们可以从不等式的两边都减去\
  \ `sum`，形成以下有效的测试：\n```c\n\n\n  too_big();\n  sum = sum + ui;\n\n\nfor (unsigned\
  \ int i = n; i >= 0; --i)\n\n\n\n\n\n\n\n2. **反码**：符号位权重为 `–2^(N–1)`，符号位与表示符号相反，其余位权重与无符号相同。\n\
  \n\n\n\n| --- | --- | --- | --- |\n\n\n\n| :--- | :--- | :--- | :--- |\n| SHRT_MIN\
  \ | –32,767 // –(2¹⁵ – 1) | –32,768 | short int |\n| INT_MIN | –32,767 // –(2¹⁵\
  \ – 1) | –2,147,483,648 | int |\n| LONG_MIN | –2,147,483,647 // –(2³¹ – 1) | –2,147,483,648\
  \ | long int |\n| LLONG_MIN | –9,223,372,036,854,775,807 // – (2⁶³ – 1) | -9,223,372,036,854,775,808\
  \ | long long int |\n\n\n\n\n\n\n| --- | --- | --- | --- |\n| 00000001 | 1 | 2⁰\
  \ | |\n| 01111111 | 127 | 2^(N – 1) – 1 | `SCHAR_MAX` |\n| 10000001 | –127 | –(2^(N\
  \ – 1) ) + 1 | |\n| 11111111 | –1 | –(2^(N – 1) ) + 127 | |\n### 溢出\n*溢出*发生在一个运算的结果超出了该类型能表示的范围时。例如，以下代码展示了溢出情况：\n\
  ```c\nc = c + 1; // c 变为 -128\n\n\n\n\nunsigned int ui = 71;\nsi = -12;\n\n\n\n\
  int agent = 007;\n```\n示例中，八进制 007 等于十进制 7，八进制常量 0777 等于 511。在处理 3 位字段时，八进制常量非常方便。\n\
  你还可以通过在十进制数字和字母 a (或 A) 到 f (或 F) 之前加上 0x 或 0X 来创建*十六进制常量*。例如：\n```c\n```\n\n\n\n\
  \nunsigned int ui = 71U;\nunsigned long long int ui = 18446744073709551615ULL;\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n* IEC 60559 binary64 扩展格式\n* IEC 60559 双精度（或 binary64）格式\n\
