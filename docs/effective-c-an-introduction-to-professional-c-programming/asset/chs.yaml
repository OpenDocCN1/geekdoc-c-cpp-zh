  \ `73`。指数 –127（所有指数位均为 0）和 +128（所有指数位均为 1）被留给特殊值使用。\n### 浮点运算\n浮点运算是计算机中表示实数最常用的表示方式。浮点表示是一种使用科学计数法通过基数和指数对数字编码的技术。例如，十进制\
  \ `123.456` 可以表示为 `1.23456 × 10²`，而二进制数 `0b10100.110` 可以表示为 `1.0100110 × 2⁴`。\n\
  浮点运算与实数运算相似并用于模拟它。然而，存在一些差异。特别是与实数相比，浮点数是有界的的且具有有限精度。\n浮点类型无法精确表示所有实数，即使这些数可以用少数位数精确表示。例如，常见的十进制常量如\
  \ 0.1 无法用二进制浮点精确表示。请参考 CERT 规则 FLP30-C（不要将浮点变量作为计数器）获取更多信息。\n### 浮点值\n通常情况下，浮点类型的所有尾数都表示有效数字，外还有一个隐含的\
  \ 1，它是被省略的但仍是值的一部分。作为一个特殊情况，为了表示值 0，指数和尾数都必须为 0；零根据符号位有符号（+0 和 –0），因此有两个浮点零值：正和一个负。\n\
  普通浮点值的尾数中没有领先零；领先零通过调整指数来移除。因此，`float` 具有 24 位精度，`double` 具有 53 位精度，而 `long double`\
  \ 具有 113 位精度（假设使用四倍精度 128 位 IEC 60559 格式）。这些是归一化数，它们保持了尾数的完整精度。\n非归一化（或规格化）数是非常小的正负数（但不是\
  \ 0），其表示方式会导致指数小于最小可表示值。`图 3-3` 是一条显示 0 周围规格化范围的数轴。以最小指数表示（即隐含的 1 位被视为 0）的非零数字就是规格化数。\n\
  \n\n\n\n\n\n#include <math.h>\nint fpclassify(real-floating x);\n\n\nconst char\
  \ *show_classification(double x) {\n    case FP_INFINITE:  return \"Inf\";\n   \
  \ case FP_NORMAL:    return \"normal\";\n    case FP_ZERO:      return \"zero\"\
  ;\n  }\n```\n\n\n\n\n- `1.575E1  /* 15.75 */`\n- `-2.5e-3  /* -0.0025 */`\n\n\n\
  - `10.0F  /* type float */`\n\n\n\n\nint si = 5;\nlong sl = (long)si;\n```\n\n\n\
