    ## Take a Tour


    It''s so much fun to build programs and watch them run! We will use the Frozen
    project site at Code.org to create our programs. To access the website, we go
    to studio.code.org/projects/frozen/.


    Are you excited to create some drawings with Elsa and Anna? Great! The first thing
    you''ll need to do is learn about the space you''ll be playing in. Let''s take
    a tour of the coding website. There are three main areas to explore.


    ![](img/a962ec79491408ecc743f3f11c25a851_7_0.png)


    ### Play space:

    This is the area where your code will run. After you''ve built your program, click
    the **Run** button to see what your code does!


    ### Toolbox:

    This is where all of the code blocks are stored. The blocks are organized under
    labels that describe the type of work they do. For example, you''ll find the **move
    forward** block under the **Actions** label.


    ### Workspace:

    This is where you will build your code to make your drawings. Drag a block from
    the toolbox here and click it in place to add it to your program. If you want
    to remove any blocks, drag them back to the toolbox.


    ## Helpful Tips


    * If you''d like to save your projects, you need to create an account before you
    get started. Make sure to get an adult''s permission and help.


    * To start a new project, use the **Create New** button at the top of the page.


    * Use the **Rename** button to give your project name that describes what it does.
    Choose a fun and memorable name!


    * After you hit the **Run** button, it becomes a **Reset** button. Use **Reset**
    to clear the play space and continue working on your program.


    * Notice the slider to the right of the **Run** button. If you''d like the drawing
    to be completed more quickly, move the slider toward the rabbit. If you''d like
    the drawing to be completed more slowly, move the slider toward the turtle.


    * The Frozen project site is available in many languages. The language selector
    is below the play space, at the bottom left. Click the button to see the available
    languages. Then choose the language you want.


