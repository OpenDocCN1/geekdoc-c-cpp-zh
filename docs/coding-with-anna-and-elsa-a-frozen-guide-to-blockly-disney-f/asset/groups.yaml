- md: "\n## More Flowers with Functions\n\nThe children of Arendelle have joined Anna\
    \ in drawing flowers on the ice. They're creating a beautiful garden of ice flowers!\
    \ Help Anna and the children fill their garden with different flowers by creating\
    \ more functions.\n\n- 1. Remix your \"Flower\" project, and rename it \"More\
    \ Flowers.\"\n- 2. Follow the directions from the last activity to make three\
    \ more flower functions. Call them \"Draw Flower 2,\" \"Draw Flower 3,\" and \"\
    Draw Flower 4.\" You can create your code, or create functions like these:\n\n\
    ![](img/a962ec79491408ecc743f3f11c25a851_29_0.png)\n\n```\nDraw Flower 2\nrepeat\
    \ 8 times\n  repeat 3 times\n    move forward by 40 pixels\n    turn right by\
    \ 120 degrees\nturn right by 45 degrees\n```\n\n![](img/a962ec79491408ecc743f3f11c25a851_29_1.png)\n\
    \n```\nDraw Flower 3\nrepeat 5 times\n  repeat 4 times\n    move forward by 40\
    \ pixels\n    turn right by 90 degrees\nturn right by 72 degrees\n```\n\n![](img/a962ec79491408ecc743f3f11c25a851_29_2.png)\n\
    \n```\nDraw Flower 4\nrepeat 4 times\n  repeat 6 times\n    move forward by 15\
    \ pixels\n    turn right by 60 degrees\nturn right by 70 degrees\n```\n\nOnce\
    \ you have all four of your flower functions defined, go back to your main program.\n\
    \nAdjust the code so that you call each of the flower functions. Try to create\
    \ something like this:\n\n![](img/a962ec79491408ecc743f3f11c25a851_30_0.png)\n\
    \n(Check out the Answer Key to see the code that created the drawing above.)\n\
    \nExperiment and fill the play space with different flowers!\n\n## Helpful Tip\n\
    \nLoops will help you remember when you like to draw curves in them. To draw a\
    \ curve move and turn with an angle. Repeating a loop 160 times will give you\
    \ a really shape to draw almost any time.\n\n## Nested Functions\n\nElsa looks\
    \ down and sees two different flowers drawn in the same spot. The combined design\
    \ looks like a glistening snowflake! Help Elsa draw flower snowflakes by using\
    \ functions inside another function! These are called **nested functions**.\n\n\
    - 1. Remix your \"More Flowers\" project, and rename it to \"Flower Snowflakes.\"\
    \n- 5. Back in the workspace, remove all code after the **set character** block.\n\
    - 2. Under the **set character** parameter to \"Elsa.\"\n- 6. Add the **Draw Flower\
    \ Snowflake** block under the **set character** block. Run the program. What does\
    \ your flower snowflake look like? Add code to your program to fill the play space\
    \ with flower snowflakes!\n- 3. Under the **Functions** label in the toolbox,\
    \ click the **Create a Function** button.\n- 7. Remix your project, and rename\
    \ it \"More Flower Snowflakes.\"\n- 4. In the function editor, name your function\
    \ \"Draw Flower Snowflake.\" Draw two of your flower functions into your \"Draw\
    \ Flower Snowflake\" function. For example,\n- 8. Create more flower snowflake\
    \ functions. Page 31 shows some of Elsa's flower combinations. Can you create\
    \ some similar designs? HINT: Refer to the code on page 28. Adjust the parameters\
    \ until you're happy with the design. Then think of different ways to combine\
    \ your flower functions into snowflake functions.\n\n```\nDraw Flower Snowflake\n\
    Draw Flower 2 edit\nDraw Flower 4 edit\n```\n\nClose the function editor.\n\n\
    - 9. Create a program that calls all your flower snowflake functions. Fill the\
    \ play space with your designs. Does it look as though there's a blizzard in Arendelle?\n\
    \n![](img/a962ec79491408ecc743f3f11c25a851_32_0.png)\n\n## Simplifying with Functions\n\
    \nOne way to simplify a program is to look for repeating code that can be pulled\
    \ out into a function. Study this program. Find the section of code that repeats.\
    \ In your notebook, write a function name for this code. Then write the simplified\
    \ program using functions.\n\n```\nwhen run\n  jump to 100 over 100 down\n  turn\
    \ left by 140 degrees\nrepeat 2 times\n  do:\n    move forward by 50 pixels\n\
    \    turn left by 80 degrees\n    move forward by 50 pixels\n    turn left by\
    \ 100 degrees\nturn right by 50 degrees\njump to 200 over 200 down\nturn left\
    \ by 50 degrees\nrepeat 2 times\n  do:\n    move forward by 50 pixels\n    turn\
    \ left by 80 degrees\n    move forward by 50 pixels\n    turn left by 100 degrees\n\
    turn right by 50 degrees\njump to 300 over 300 down\nturn left by 50 degrees\n\
    repeat 2 times\n  do:\n    move forward by 50 pixels\n    turn left by 80 degrees\n\
    \    move forward by 50 pixels\n    turn left by 100 degrees\nturn right by 50\
    \ degrees\njump to 400 over 400 down (wait, text says 300 over 300) \nWait, let's\
    \ re-read the OCR:\njump to 300 over 300 down\nturn left by 50 degrees\nrepeat\
    \ 2 times\n  do:\n    move forward by 50 pixels\n    turn left by 80 degrees\n\
    \    move forward by 50 pixels\n    turn left by 100 degrees\nturn left by 100\
    \ degrees![](img/a962ec79491408ecc743f3f11c25a851_33_0.png)\n\n## For Loops\n\n\
    Now it's time to learn about for loops! These loops use a counter to go from a\
    \ starting value to an ending value by an increment. This program uses a for loop\
    \ to draw dots in a spiral. See how it starts by drawing one dot, ends by drawing\
    \ three dots, and adds one dot each time? The drawings below use all the code\
    \ from this program. The only differences are the parameters in the for loop.\
    \ In your notebook, fill in the for loop to get each drawing. Hint: Count the\
    \ dots on each side of the spiral. Each drawing starts at the center of the spiral.\n\
    \n![](img/a962ec79491408ecc743f3f11c25a851_34_0.png)\n\n# 1\n![](img/a962ec79491408ecc743f3f11c25a851_34_1.png)\n\
    for counter from \\_\\_ to count by \\_\\_\n\n# 2\n![](img/a962ec79491408ecc743f3f11c25a851_34_2.png)\n\
    for counter from \\_\\_ to count by \\_\\_\n\n# 3\n![](img/a962ec79491408ecc743f3f11c25a851_34_3.png)\n\
    for counter from \\_\\_ to count by \\_\\_\n\n# 4\n![](img/a962ec79491408ecc743f3f11c25a851_34_4.png)\n\
    for counter from \\_\\_ to count by \\_\\_\n\n## For Loop Spirals\n\nElsa is practicing\
    \ her spirals. The ice looks quite elegant in swirls! Do you want to help her\
    \ create an amazing design using a for loop? Let's try it!\n\n- 1. Create a new\
    \ project, and call it \"Square Spiral.\"\n- 2. Drag a for loop into the workspace\
    \ and click it under the when run block. You will find the for loop under the\
    \ Loops label in the toolbox.\n![](img/a962ec79491408ecc743f3f11c25a851_35_0.png)\n\
    - 3. Next, drag a move forward block and a turn right block into the for loop.\n\
    - 4. Grab the purple number block inside the move forward block, and drag it back\
    \ to the toolbox.\n- 5. Find the counter block under the Variables label in the\
    \ toolbox. Drag it into the move forward block. This tells Elsa to move the same\
    \ amount as your counter every time through the loop.\n![](img/a962ec79491408ecc743f3f11c25a851_35_1.png)\n\
    - 6. Finally, set the for loop's starting value to \"5\" and ending value to \"\
    300.\" Set the increment to \"5.\" Here's what the completed code looks like\n\
    \nTime to play around with your code! Remix your project, and rename it “Square\
    \ Spiral 2.” Let’s say you want more space between the lines of your spiral. No\
    \ problem! Just change the parameters in the for loop. Set the start value to\
    \ “10” and the increment to “10.” How do you like this spiral?\n\nCan you figure\
    \ out what code block to add to your program to create this drawing? That's right!\
    \ Just add a turn right block before the for loop and set the degree parameter\
    \ to “45.”\n\n![](img/a962ec79491408ecc743f3f11c25a851_36_0.png)\n![](img/a962ec79491408ecc743f3f11c25a851_36_1.png)\n\
    \n```\nfor counter from 10 to 300 count by 10\nmove forward by counter pixels\n\
    turn right by 90 degrees\n```\n\n```\nturn right by 45 degrees\nfor counter from\
    \ 10 to 300 count by 10\nmove forward by counter pixels\nturn right by 90 degrees\n\
    ```\n\nPlay with the parameters, and create your own spiral designs.\n\n> Did\
    \ You Know?\n> repeat loops, for loops are a powerful tool. With just a few times\
    \ of code, you can create intricate drawings like the spirals shown here. Can\
    \ you think of other ways to use a for loop?\n\n## More Spiral Designs\n\nAnna\
    \ wants to try something different with Elsa's spiral design. She wonders how\
    \ to make spirals that are not perfectly square. Use your coding skills to help\
    \ Anna create a unique design!\n\n- 1. Remix your \"Square Spiral\" project, and\
    \ call it \"More Spirals.\"\n- 2. Add the set character to Anna block between\
    \ the when run block and the for loop.\n- 3. Instead of turning by 90 degrees,\
    \ try a slightly different angle.\n- 4. Play around with the degree parameter\
    \ until you have a design you like.\n- 5. Next, try changing the color of your\
    \ lines to give your spiral more personality! You can find the set color block\
    \ under the Actions label in the toolbox.\n\n```\nwhen run\nset character to Anna\n\
    for counter from 5 to 300 count by 5\nmove forward by counter pixels\nturn right\
    \ by 89 degrees\n```\n\nThese drawings use 89 degrees and 91 degrees, respectively.\
    \ Look at how different these drawings are from Elsa's spiral. And the only change\
    \ was a 1-degree difference in each turn!\n\n![](img/a962ec79491408ecc743f3f11c25a851_37_0.png)\n\
    ![](img/a962ec79491408ecc743f3f11c25a851_37_1.png)\n"
