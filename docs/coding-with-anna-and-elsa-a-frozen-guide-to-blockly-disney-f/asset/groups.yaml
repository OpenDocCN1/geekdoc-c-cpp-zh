    ## Glossary


    **angle:**

    The number of degrees that a line turns at a corner.


    ![](img/a962ec79491408ecc743f3f11c25a851_49_0.png)


    **for loops:**

    Loops where you can control the starting value, ending value, and increment.


    **play space:**

    The area of the website where you see your code does when it runs.


    **block-based language:**

    A programming language runs programs that have been created using code blocks
    that resemble puzzle pieces.


    **function:**

    A named piece of code that you can call in a program whenever you need it.


    **program:**

    A set of instructions for a computer.


    **Blockly:**

    A visual programming language that lets you drag and drop code to create programs.


    **function editor:**

    A pop-up box that lets you create or edit the code inside your function.


    **remix:**

    To save a copy of a program you can build it into something new. This allows you
    to use functions and sections of code you''ve already created, instead of rebuilding
    them from scratch.


    **call a function:**

    To ask the computer to run the code inside a function.


    **increment:**

    The amount that your counter goes up (or down) each time for a loop.


    **repeat loop:**

    The block that allows you to loop a code sequence as many times as you tell it
    to.


    **code:**

    Instructions for a computer.


    **coding:**

    The process of creating code.


    **inner angles:**

    The measurements of an angle from the inside of the shape.


    **sequence:**

    The order in which things are arranged.


    **computer science:**

    The study of computers and computer-related ideas.


    **loop:**

    A segment of code that runs over and without doing anything else in between.


    **software:**

    Programs that run on a machine or computer.


    **counter:**

    A placeholder that keeps track of a value that is added to (or subtracted from)
    each time from a loop.


    **nested functions:**

    Functions placed inside other functions.


    **starting value:**

    The value where your counter will start in a loop.


    **debugging:**

    Finding and fixing errors in a program.


    **nested loop:**

    A loop placed inside another loop.


    **toolbox:**

    The area of the website where you find the code to create your program.


    **define the function:**

    To put code inside a function block that tells the computer what to do when that
    function is called inside a program.


    **parameters:**

    Special places where you can customize blocks to do things in different ways.


    **workspace:**

    The area of the website where you drag code to create a program.


    **ending value:**

    The value where your counter will stop counting in a loop.


    **pattern:**

    Something that repeats multiple times.


    **pixels:**

    Small squares laid out in a grid that make up an image. A pixel can also be a
    unit of measurement used to specify how far something travels.


    **exterior angles:**

    The measurements of the outside of an angle.


