    \ 接下来，尝试改变线条的颜色，让你的螺旋更有个性！你可以在工具箱的 Actions 标签下找到 set color 块。\n\n```\nwhen run\n\
    set character to Anna\nfor counter from 5 to 300 count by 5\nmove forward by counter\
