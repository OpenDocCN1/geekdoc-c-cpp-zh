    \ when run 块下方点击它。你会在工具箱的 Loops 标签下找到 for 循环。\n![](img/a962ec79491408ecc743f3f11c25a851_35_0.png)\n\
    - 3. 接下来，将 move forward 块和 turn right 块拖入 for 循环。\n- 4. 取出 move forward 块内的紫色数字块，将其拖回工具箱。\n\
    - 5. 在工具箱的 Variables 标签下找到计数 块。将其拖入 move forward 块。这告诉艾莎每次循环时移动与你的计数器相同的距离。\n\
