    Learning to code opens the door to a world of possibilities! When you write code,
    you use a special language to talk directly to a computer or machine. Code that
    tells computers how to complete specific tasks is called a program. Computer programs
    let you do cool things like digital art, drive robots, and develop video games!


    Professional computer programmers usually use text to write code. But we will
    start our lessons using a block-based language. Instead of text, block-based languages
    use code blocks that look like puzzle pieces. You drag and drop these blocks to
    create programs. This is a fun, professional programmers use! The name of the
    language we''ll be using is Blockly.


    Coding is one part of a bigger subject called computer science. This is the study
    of computers and computer-related ideas. When you study computer science, you
    learn a lot of useful skills besides working with computers. You also practice
    problem-solving, creative thinking, teamwork, and persistence. Being persistent
    means that you keep trying, even when things get hard.


    The activities in this book will help you use Blockly to create some amazing drawings
    with your favorite characters. Grab a notebook and something to write with. As
    you work on the projects, you will break large problems into smaller pieces. This
    makes them easier to solve. After some practice, you will notice challenges in
    the real world that you can handle the same way!


