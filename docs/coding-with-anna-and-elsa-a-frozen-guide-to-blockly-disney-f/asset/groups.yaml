    # Why Code?


    Many of the devices we use every day need code to work. Computers, phones, TVs,
    and even cars all use software. Software refers to programs that run on a machine
    or computer. You can''t touch software, but you can see the results of it almost
    everywhere you go. When you use an app, see traffic signals change, or read a
    car''s electronic display, software is at work!


    Learning to code opens the door to a world of possibilities! When you write code,
    you use a special language to talk directly to computer. Instead of text, block-based
    languages use blocks that look like puzzle pieces. You drag and drop these blocks
    to create programs. Being persistent means that you keep trying, even when things
    get hard activities in this book will help you use Blockly to create some amazing
    drawings with your favorite characters. Grab a notebook and something to write
    with. As you work on the projects, you will break large problems into smaller
    pieces. This makes them easier to solve. After some practice, you will notice
    challenges in the real world that you can handle the same way!


