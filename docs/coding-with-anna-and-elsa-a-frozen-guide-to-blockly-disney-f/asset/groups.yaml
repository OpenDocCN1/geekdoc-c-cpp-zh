  mdcn: "\n6 现在更改 `for` 循环中的增量参数。当你把增量变大或变小时会发生什么呢？这里有一些你可以尝试的螺旋设计：\n\n![](img/a962ec79491408ecc743f3f11c25a851_38_0.png)\n\
    \n```\nwhen run\nset character to Anna\nset color\nfor counter from 5 to 300 count\
    \ by 2\nmove forward by counter pixels\nturn right by 91 degrees\n```\n\n![](img/a962ec79491408ecc743f3f11c25a851_38_1.png)\n\
    \n```\nwhen run\nset character to Anna\nset color\nfor counter from 3 to 300 count\
    \ by 3\nmove forward by counter pixels\nturn right by 93 degrees\n```\n\n7 不断实验，直到你对独特的螺旋设计感到满意。\n\
    \n## 一朵巨大的雪花\n\n当阿伦德尔王国的人们喜欢在冰上作画时，雪花开始从天空飘落。轻柔的雪花激发了艾莎画出一个复杂雪花的灵感。\n\n帮助艾莎创建一个由不同大小形状重叠的设计。回想一下你制作形状并让它们绕圆旋转的过程。`for`\
    \ 循环让你以许多尺寸来实现。尝试一下吧！\n\n- 1. 创建新项目，命名为“巨大的雪花”。\n- 2. 将下面的代码添加到你的工作区。点击“运行”，看看艾莎画出一个由不同大小五边形组成的雪花。多漂亮啊！\n\
    \n![](img/a962ec79491408ecc743f3f11c25a851_39_0.png)\n\n```\nwhen run\n  for counter\
    \ from 100 to 25 count by 25\n    set color to random color\n    repeat 5 times\n\
    \      repeat 5 times\n        move forward 72 pixels\n        turn left 72 degrees\n\
    ```\n\n- 3. 也许你希望雪花由不同的形状组成。你可以同样地使用三角形、正方形、六边形甚至是八边形！只需更改最内层循环的参数即可创建一个新形状。\n\
    \n## 尝试不同的参数，直到你对你的巨大的雪花感到满意。\n\n## 边数 \n代码\n\n```\nrepeat 3 times\n  move forward\
    \ by counter steps\n  turn left by 120 degrees\n```\n\n![](img/a962ec79491408ecc743f3f11c25a851_40_0.png)\n\
    \n### 3\n\n```\nrepeat 4 times\n  move forward by counter steps\n  turn left by\
    \ 90 degrees\n```\n\n![](img/a962ec79491408ecc743f3f11c25a851_40_1.png)\n\n###\
    \ 4\n\n```\nrepeat 6 times\n  move forward by counter steps\n  turn left by 60\
    \ degrees\n```\n\n![](img/a962ec79491408ecc743f3f11c25a851_40_2.png)\n\n### 6\n\
    \n```\nrepeat 8 times\n  move forward by counter steps\n  turn left by 45 degrees\n\
    ```\n\n### 8\n\n![](img/a962ec79491408ecc743f3f11c25a851_40_3.png)\n\n假设你想更改每次运行\
    \ `for` 循环时形状被绘制的次数。你需要更改哪些参数？提示：你有两个参数需要调整。第 38 页的代码在每次 `for` 循环的迭代中都绘制了 5 次形状。\n\
    \n## 遵循代码\n\n奥拉夫、安娜和艾莎在冰上玩得太开心了，以至于不小心画了别人的设计。噢天哪！这幅画由三个不同的设计组成。你能认出哪一部分是奥拉夫画的吗？看看下面奥拉夫设计的代码。复制此页，并在空白方框中画出他的设计。提示：方框中间的点显示了奥拉夫在开始画之前的位置。他位于底部。\n\
    \n![](img/a962ec79491408ecc743f3f11c25a851_41_0.png)\n\n| 奥拉夫的设计 |\n| :--- |\n\
    | counter from 30 to 60 count by 30 |\n| repeat 4 times |\n| do move forward by\
    \ counter pixels |\n| turn left by 90 degrees |\n| counter from 30 to 60 count\
    \ by 30 |\n| repeat 4 times |\n| do move forward by counter pixels |\n| turn left\
    \ by 90 degrees |\n\n![](img/a962ec79491408ecc743f3f11c25a851_41_1.png) 每个网格代表\
    \ 30 像素宽和 30 像素高。\n\n## 复习\n\n太阳低挂在天空，冰上绘画结束了。艾莎、安娜和奥拉夫与阿伦德尔的人们一起工作。大家都度过了美好的一天。他们会记住这美好的一。你应该对你在书中探索的所有内容感到自豪！看看下面用于画画的代码。复制此页并完成以下任务。\n\
    \n![](img/a962ec79491408ecc743f3f11c25a851_42_0.png)\n\n- 画一个指向代码中 `repeat` 循环的箭头。\n\
    - 在 `for` 循环上方画一个勾号。\n- 在 `for` 循环旁边画一个三角形。\n- 在此程序的参数周围画一个矩形。\n\n![](img/a962ec79491408ecc743f3f11c25a851_42_1.png)\n\
    \n```\nwhen run\nfor counter from 15 to 140 count by 5\n  move forward by counter\
    \ pixels\n  turn left by 45 degrees\n  set color to random\n  repeat 5 times\n\
    \    move forward by 8 pixels\n    move backward by 8 pixels\n    turn left by\
    \ 72 degrees\n```\n\n## 获取灵感！\n\n恭喜你完成了冒险！让我们用一些代码块制作什么样的创意画。复制这些页面。下面的每个活动提供了五个代码块。将它们包含在你自己的程序中创建一个特殊的画。你可以按照你喜欢的方式排列这些块。也可以包含其他块。调整代码直到你对你的画感到满意。完成后，画出你创建的图像。\n\
    \n```\nmove forward by 30 pixels\nturn right by 120 degrees\nrepeat 2 times\n\
    do\nmove forward by 30 pixels\nturn right by 60 degrees\n```\n\n```\nrepeat 5\
    \ times\ndo\nturn right by 72 degrees\nmove forward by 40 pixels\nmove forward\
    \ by 10 pixels\nturn right by 90 degrees\n```\n\n![](img/a962ec79491408ecc743f3f11c25a851_44_0.png)\n\
