    \n- 正方形的每个角都是 90 度。\n- 直线的度数是 180 度。\n- 圆形的总度数是 360 度。\n- 等边三角形的每个角都是 60 度。\n\n\
    ![](img/a962ec79491408ecc743f3f11c25a851_16_0.png)\n\n你会注意到 Anna 在“Sisters Design”中画了一个等边三角形。你是否好奇为什么我们程序化的旋转是\
