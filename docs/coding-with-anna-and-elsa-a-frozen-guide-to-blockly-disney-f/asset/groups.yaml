  - '[PAGE 16]


    # Did You Know?


    An angle tells us how big or small a turn is. You probably know some information
    about angles already. Examples might include:


    +   - Each angle in a square measures 90 degrees.

    - A straight line measures 180 degrees.

    - A circle measures 360 degrees.

    - Each angle in an equilateral triangle measures 60 degrees.


    ![](img/a962ec79491408ecc743f3f11c25a851_16_0.png)


    You’ll notice Anna drew an equilateral triangle in the “Sisters Design.” Are you
    wondering why we programmed the turn at 120 degrees instead of 60 degrees? Great
    question! When Anna and Elsa draw shapes in your programs, they are outside of
    the shape. They draw corners along the outside. We exterior angles for that shape.
    Exterior angles are different from interior angles.


    ![](img/a962ec79491408ecc743f3f11c25a851_16_1.png)


    Let’s say we want to create a shape with interior angle of 60 degrees. We have
    to make a turn of 120 degrees along the outside of that shape. This is because
    120 degrees + 60 degrees = 180 degrees. The two angles added make a straight line,
    which measures 180 degrees.


    Think of this way: Elsa is walking in a straight line. Then she turns left by
    120 degrees and keeps walking. The right side of the angle she just made measures
    120 degrees. The left side of the angle measures 60 degrees.


    ![](img/a962ec79491408ecc743f3f11c25a851_16_2.png)'
