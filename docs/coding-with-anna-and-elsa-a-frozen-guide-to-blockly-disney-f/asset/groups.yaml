- md: "\n## Add a Triangle\n\nAnna loves what Elsa has drawn! She wants to take it\
    \ a step further by adding a different shape. Let's help her create a design that\
    \ uses a square and a triangle.\n\n- Because Anna wants to include a square in\
    \ her design, let's reuse the code from your \"Square\" project. First, open your\
    \ \"Square\" project. Remix the project, and rename it \"Sisters Design.\"\n\n\
    - You'll see that your project already has the code needed to draw a square. That's\
    \ a nice shortcut! Since we are drawing with Anna in this activity, drag the **set**\
    \ character to **run** and **move forward** blocks to the workspace. Place it\
    \ between the when run blocks.\n\n- Now add code blocks to draw a triangle that\
    \ overlaps the square. Here is an example of how your program could look. Feel\
    \ free to play around with the parameters. Try making the design bigger or smaller\
    \ until you're happy with it.\n\n```\nset characters to Anna\nmove forward by\
    \ 100 steps\nturn right by 90 degrees\nmove forward by 100 steps\nturn right by\
    \ 90 degrees\nmove forward by 100 steps\nturn right by 90 degrees\nmove forward\
    \ by 100 steps\nturn right by 120 degrees\nmove forward by 120 steps\n```\n\n\
    ![](img/a962ec79491408ecc743f3f11c25a851_15_0.png)\n\nA pattern is something that\
    \ repeats. Help Anna create a pattern with her design. Remix and rename your project\
    \ \"Sisters Pattern.\" How would you change the code if you wanted Anna to draw\
    \ the design three times?\n\n![](img/a962ec79491408ecc743f3f11c25a851_15_1.png)\n\
    \n## Did You Know?\n\nAn angle tells us how big or small a turn is. You probably\
    \ know some information about angles already. Examples might include:\n\n- Each\
    \ angle in a square measures 90 degrees.\n- A straight line measures 180 degrees.\n\
    - A circle measures 360 degrees.\n- Each angle in an equilateral triangle measures\
    \ 60 degrees.\n\n![](img/a962ec79491408ecc743f3f11c25a851_16_0.png)\n\nYou’ll\
    \ notice Anna drew an equilateral triangle in the “Sisters Design.” Are you wondering\
    \ why we programmed the turn at 120 degrees instead of 60 degrees? Great question!\
    \ When Anna and Elsa draw shapes in your programs, they are outside of the shape.\
    \ They draw corners along the outside. We use exterior angles for that shape.\
    \ Exterior angles are different from interior angles.\n\n![](img/a962ec79491408ecc743f3f11c25a851_16_1.png)\n\
    \nLet’s say we want to create a shape with interior angle of 60 degrees. We have\
    \ to make a turn of 120 degrees along the outside of that shape. This is because\
    \ 120 degrees + 60 degrees = 180 degrees. The two angles added make a straight\
    \ line, which measures 180 degrees.\n\nThink of this way: Elsa is walking in a\
    \ straight line. Then she turns left by 120 degrees and keeps walking. The right\
    \ side of the angle she just made measures 120 degrees. The left side of the angle\
    \ measures 60 degrees.\n\n![](img/a962ec79491408ecc743f3f11c25a851_16_2.png)\n\
    \n## Debugging\n\nDo you want to draw a snowman? Olaf sure does! But something\
    \ is not quite right in his drawings. Help Olaf fix the drawings by debugging\
    \ the code below. Each drawing has something that doesn't belong. Look at the\
    \ code. Make a copy of this page. Then cross out the block that needs to be removed\
    \ for the drawing to be correct.\n\n![](img/a962ec79491408ecc743f3f11c25a851_17_0.png)\n\
    \n1\n\n![](img/a962ec79491408ecc743f3f11c25a851_17_1.png)\n\n2\n\n- when run\n\
    - when run\n- Draw Head\n- Draw Head\n- Draw Face\n- Draw Face\n- Draw Body\n\
    - Draw Medium Oval\n- Draw Square\n- Draw Face\n- Draw Large Oval\n\n![](img/a962ec79491408ecc743f3f11c25a851_17_2.png)\n\
    \n3\n\n![](img/a962ec79491408ecc743f3f11c25a851_17_3.png)\n\n4\n\n- when run\n\
    - when run\n- Draw Head\n- Draw Head\n- Draw Face\n- Draw Face\n- Draw Large Oval\n\
    - Draw Medium Oval\n- Draw Large Oval\n\n## Repeat Loops\n\nAnna's designs below\
    \ use the repeat loop. The code inside this block is a loop that will run as many\
    \ times as you tell it. This makes it easy to do something over and over. In your\
    \ notebook, match each program with the correct design. HINTS: Anna is facing\
    \ the bottom of play space when she starts. Try tracing the design with your finger\
    \ as you go through the code.\n\n```\nrepeat 4 times\n  move forward by 40 pixels\n\
    \  turn right by 90 degrees\n  move forward by 40 pixels\n  turn left by 90 degrees\n\
    ```\n\n1\n\nA\n\n![](img/a962ec79491408ecc743f3f11c25a851_18_0.png)\n\n```\nrepeat\
    \ 4 times\n  turn left by 90 degrees\n  move forward by 40 pixels\n  turn right\
    \ by 90 degrees\n  move forward by 40 pixels\n```\n\n2\n\nB\n\n![](img/a962ec79491408ecc743f3f11c25a851_18_1.png)\n\
    \n```\nrepeat 3 times\n  turn right by 90 degrees\n  move forward by 60 pixels\n\
    \  turn left by 90 degrees\n  move forward by 30 pixels\n```\n\n3\n\nC\n\n![](img/a962ec79491408ecc743f3f11c25a851_18_2.png)\n\
    \n```\nrepeat 3 times\n  move forward by 60 pixels\n  turn left by 90 degrees\n\
    \  move forward by 30 pixels\n  turn right by 90 degrees\n```\n\n4\n\nD\n\n![](img/a962ec79491408ecc743f3f11c25a851_18_3.png)\n\
    \n## Patterns That Repeat\n\nAnna enjoys making patterns on the ice. She's thinking\
    \ about using a stair design to create a diamond pattern.\n\n- Create a new project,\
    \ and call it \"Diamond Stairs.\"\n\n- Now it's time to create the **repeat**\
    \ loop that makes one half of the design. Add the code below after the **turn\
    \ left** block in your workspace. Run the program. The drawing will look like\
    \ stairs that take Anna from the top of the play space to the bottom.\n\n- Start\
    \ by having Anna jump all way back to the top left using these blocks.\n\n```\n\
    set character to Anna\njump backward by 150 pixels\nturn right by 90 degrees\n\
    jump forward by 150 pixels\nturn left by 90 degrees\n```\n\n![](img/a962ec79491408ecc743f3f11c25a851_19_0.png)\n\
    \n```\nrepeat 6 times\nmove forward by 50 pixels\nturn left by 90 degrees\nmove\
    \ forward by 50 pixels\nturn right by 90 degrees\n```\n\n> Did You Know?\n> Loops\
    \ can save us a lot of work. Imagine if we had to code Anna's staircase design\
    \ without **repeat** loops. That would mean coding every movement and turn, line\
    \ by line! Loops give us a powerful shortcut.\n\nTo finish this design, have Anna\
    \ turn by 180 degrees. Then repeat the stair code one more time. Wonderful work!\n\
    \n![](img/a962ec79491408ecc743f3f11c25a851_20_0.png)\n\n```\nwhen character to\
    \ Anna\n  jump backward by 150 pixels\n  turn right by 90 degrees\n  jump forward\
    \ by 150 pixels\n  turn left by 90 degrees\n  repeat 6 times\n    move forward\
    \ by 50 pixels\n    turn left by 90 degrees\n    move forward by 50 pixels\n \
    \   turn right by 90 degrees\n    repeat 6 times\n      move forward by 50 pixels\n\
    \      turn left by 90 degrees\n      move forward by 50 pixels\n      turn right\
    \ by 90 degrees\n```\n\nGive these extra challenges to try!\n\n- What happens\
    \ if Anna turns 180 degrees between repeat loops? Why do you think that happens?\n\
    - What happens if Anna turns 170 degrees between repeat loops?\n- Remix your project,\
    \ and play with your parameters. Try using 80 degrees instead of 90 degrees for\
    \ each of the stair patterns. Try making each stair step longer or shorter. Try\
    \ a different starting position for your drawing. Try changing the forward/backward\
    \ and left/right parameters. Try changing the number in the repeat loop. Experiment\
    \ and have fun!\n\n![](img/a962ec79491408ecc743f3f11c25a851_20_1.png)\n\n## \"\
    Sisters Design\" with Loops\n\nElsa really likes the stair design that Anna created.\
    \ She wonders if she can use a similar strategy to draw the \"Sisters Design.\"\
    \n\n- Find your \"Sisters Design\" project. Remix the project and rename it \"\
    Sisters Loop.\"\n\n- Change the set character parameter to \"Elsa.\"\n\n- Drag\
    \ a repeat loop into the workspace. Change the parameter to \"4. Put the first\
    \ two lines of code for the square inside the loop. Now you can remove the rest\
    \ of the square code from the workspace.\n\n![](img/a962ec79491408ecc743f3f11c25a851_21_0.png)\n"
  mdcn: "\n\n## 添加一个三角形\n\nAnna 喜欢 Elsa 画的画！她想更进一步，添加一个不同的形状。让我们帮助她创建一个包含正方形和三角形的设计。\n\
