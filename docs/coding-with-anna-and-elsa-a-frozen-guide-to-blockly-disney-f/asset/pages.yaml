  md: '# # Let''s Get Started!


    It is a lovely winter day in Arendelle. Queen Elsa and Princess Anna are very
    excited. They are hosting an ice-drawing event to thank the kingdom''s ice harvesters.
    Let''s help them make this an event to remember!


    +   1 Click on the Create New button. This will start a new project. Use the Rename
    button to name your project "Warm-Up."


    +   2 Help Elsa draw a straight line on the ice as she walks. First, click on
    the Actions label. Then drag a move forward by 100 pixels to the workspace. Computer
    images are made of tiny squares of color pixels. The move forward block tells
    the computer how far many pixels—Elsa will move. Connect it to the bottom of the
    when run block. What happens when you click the Run button?


    +   3 It''s hard to see the line we just drew, since Elsa is standing in front
    of it! Drag out a turn right by 90 degrees block. Slip it between the when run
    block and the move forward by 100 pixels. Tap the Reset button. Then run your
    program.


