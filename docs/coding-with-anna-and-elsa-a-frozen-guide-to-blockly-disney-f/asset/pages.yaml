  md: '# Would you like to learn a special language that can help you build your own
    computer programs?

    Join Anna and Elsa and discover how to write code that will allow you to create
    amazing drawings and designs?


    # Introduction


    People around the world rely on uses computer programs to communicate with one
    another in a variety of ways. How are these programs created and what makes them
    work on a computer?


    In this book, you will learn how to use blocks of code that tell a computer what
    to do. But first, find out more about the world of coding by reading pages 4 and
    5. Then discuss the questions and glossary below.


    # Take a Book Tour


    +   - Look at the picture on the cover. What do you think this book will be about?
    Do you know who these characters are? Are you familiar with Frozen?

    - The title of this book is Coding with Anna and Elsa. It is all about a kind
    of coding that "tells" computers how to make decisions. What part do you think
    the characters from Frozen will play in this adventure?

    - Find the Contents page and look at the titles of each section. Are there terms
    you already know? Where have you seen them before?

    - There are 24 coding activities in this book. Skim pages 8 through 45. How are
    the activity pages in each section similar? What part do you think the characters
    play in each section?

    - Read the two paragraphs at the top of page 6. Based on the information provided,
    how do you think you will be using this book to learn about coding?


    # Glossary-Words


    As you use the language of computers, you will learn many new words. Here are
    some important words you will need to know. Skip the first 16 pages. Can you find
    these words? Next, locate them in the glossary on page 48. Remember to use the
    glossary if you need help understanding some of the new words in this book.


    ```

    block-based language

    code

    debug

    parameter

    pattern

    pixel

    remix

    sequence

    ```


    # Now, let''s get coding!'
