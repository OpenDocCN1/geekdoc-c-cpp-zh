  md: "# Did You Know?\n\nIt's not hard to figure out how many degrees you need to\
    \ spin a shape in order to take it around in a full circle. All you need is a\
    \ little math!\n\n+   Figure out how many times you want the shape to go around.\n\
    \n+   Divide 360 degrees (the number of degrees in a circle) by that number. The\
    \ result is the number of degrees you need to turn!\n\nTake, for example, the\
    \ snowflake Anna drew using the \"Sisters Design.\" She spun the design around\
    \ 6 times. 360 degrees + 6 = 60 degrees. That is why we used 60 degrees in our\
    \ code.\n\nLook at Elsa's design below. It uses 8 squares. 360 degrees + 8 = 45\
    \ degrees. This means we need to turn 45 degrees after each square.\n\n![](img/a962ec79491408ecc743f3f11c25a851_24_0.png)\n\
    \nHow many degrees would we use if we wanted to spin the square around 10 times?\
    \ Complete this equation in your notebook to find the answer:\n\n360 degrees +\
    \ ___ = ____\n\n```\nset character to Elsa\nrepeat 8 times\n  repeat 4 times\n\
    \    do move forward 100 pixels\n    turn right 90 degrees\nturn right 45 degrees\n\
    ```\n\n![](img/a962ec79491408ecc743f3f11c25a851_24_1.png)\n\n```\nset character\
    \ to Elsa\nrepeat 10 times\n  do repeat 4 times\n    do move forward 100 pixels\n\
    \    turn right 90 degrees\nturn right ?? degrees\n```"
