  md: '![](img/a962ec79491408ecc743f3f11c25a851_6_0.png)


    Many of the devices we use every day need code to work. Computers, phones, TVs,
    and even cars all use software. Software refers to programs that run on a machine
    or computer. You can''t touch software, but you can see the results of it almost
    everywhere you go. When you use an app, see traffic signals change, or read a
    car''s electronic display, software is at work!


    computers what text and images to display when people visit their websites. And
    Disney Imagineers use code to program Audio-Animatronic characters, telling them
    how they should move and sound. As you see, code can be used to create really
    amazing things!


    A lot of the entertainment we enjoy also uses code. This includes movies, TV shows,
    video games, and even theme rides. Special software helps filmmakers design and
    animate characters in movies like Frozen. In code video games tells the game how
    to react when the player does something. Web engineers use code to tell


    # ## Did You Know?


    +   * Computers are boxes full of circuits that shuffle electricity from one area
    to another. They are not smart without code. It is only through code that computers
    understand how to play music, show images, or run games.'
