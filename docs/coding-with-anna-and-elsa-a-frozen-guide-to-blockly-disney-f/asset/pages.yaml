  md: '# # Helpful Tips


    * If you''d like to save your projects, you need to create an account before you
    get started. Make sure to get an adult''s permission and help.


    * To start a new project, use the **Create New** button at the top of the page.


    * Use the **Rename** button to give your project name that describes what it does.
    Choose a fun and memorable name!


    * After you hit the **Run** button, it becomes a **Reset** button. Use **Reset**
    to clear the play space and continue working on your program.


    * Notice the slider to the right of the **Run** button. If you''d like the drawing
    to be completed more quickly, move the slider toward the rabbit. If you''d like
    the drawing to be completed more slowly, move the slider toward the turtle.


    * The Frozen project site is available in many languages. The language selector
    is is below the play space, at the bottom left. Click the button to see the available
    languages. Then choose the language you want.


