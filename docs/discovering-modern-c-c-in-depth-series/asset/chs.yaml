  ### C.3.2 提升\n### C.3.3 算术\n### C.3.4 窄化\n\n# 参考文献\n\n## 前言\n\n美与兽\n\n“美与兽”\n\n\n\
  \n\n我们将通过一个简单的例子给您一个直观印象：固定步长的梯度下降法。其原理极其简单：我们通过 `f(x)` 的梯度（假设为 `g(x)`）计算其最陡下降的方向，并以固定的步长沿着这个方向移动到局部最小值。即使算法伪代码也像这段描述一样简单：\n\
  \n**算法 1:** 梯度下降算法\n\n**输入**: 起值 `x`、步长 `s`、终止准则 `ɛ`、函数 `f`、梯度 `g`\n\n**输出**: 局部最小值\
  \ `x`\n1 **do**\n2 | `x = x – s · g(x)`\n3 **while** |`Δf(x)|` > `ɛ` ;\n\n对于这个简单的算法，我们写了截然不同的实现。请看一看并让它内化，无需尝试去理解技术细节。\n\
  \n```cpp\nvoid gradient_descent(double* x,\n    double* y, double s, double eps,\n\
  \    double(*f)(double, double),\n    double(*gx)(double, double),\n    double(*gy)(double,\
  \ double))\n{\n    double val= f(*x, *y), delta;\n    do {\n        *x-= s * gx(*x,\
  \ *y);\n        *y-= s * gy(*x, *y);\n        double new_val= f(*x, *y);\n     \
  \   delta= abs(new_val - val);\n        val= new_val;\n    } while (delta > eps);\n\
  }\n```\n\n```cpp\ntemplate <typename Value, typename P1,\n          typename P2,\
  \ typename F,\n          typename G>\nValue gradient_descent(Value x, P1 s,\n  \
  \  P2 eps, F f, G g)\n{\n    auto val= f(x), delta= val;\n    do {\n        x-=\
  \ s * g(x);\n        auto new_val= f(x);\n        delta= abs(new_val - val);\n \
  \       val= new_val;\n    } while (delta > eps);\n    return x;\n}\n```\n\n乍看之下，它们非常相似，我们很快就会告诉您我们更喜欢哪一个。第一个版本在原理上是纯\
  \ C，也就是说也可以用 C 编译器编译。它的优点是优化的部分是直接可见的：一个带有 `double` 值的二维函数（由**高亮的**函数参数指示）。我们更倾向于第二个版本，因为它更具通用性：具有任意维度和任意值类型的两个函数（通过**标记的**类型和函数参数可见）。惊讶的是，这种通用的实现效率并没有更低。相反，传递给\
  \ `F` 和 `G` 的函数可能会被内联（见 §1.5.3），从而节省函数调用开销，而第一个版本中显式使用（丑的）函数指针会让编译器难以对代码进行加速。\n\n\
  对于真正有心的读者，对比新旧风格的较示例可以在 附录 A (§A.1) 中找到。在那里现代编程的优势比这里的玩具示例要明显得多。但我们不想在初步的遭遇战中耽误你太久。\n\
  \n### 科学与工程中的语言\n\n“如果每种数值软件都能不损失效率的情况下用 C++ 编写，那就太好了，但除非能找到在不损害 C++ 类型系统的情况下实现此目标，否则可能依赖\
  \ Fortran、汇编或特定体系的扩展更好。”\n\n—Bjarne Stroustrup\n\n科学和工程软件使用不同的语言编写，哪种最合适取决于目标和可用资源：\n\
  \n- MATLAB、Mathematica 或 R 等数学工具在我们可以使用它们现有的算法时是极佳的。当我们用细粒度（例如标量）操作实现自己的算法时，会遇到性能的显著下降。当问题较小或用户极具耐心时，这可能不是问题；否则，我们应该考虑替代语言。\n\
  - Python 非常擅于快速软件开发，并且已经包含了如“scipy”和“numpy”之类的科学库，且基于这些库的应用程序（通常用 C 和 C++ 实现）效率相当。同样，来自细粒度操作的用户定义算法会付出性能代价。Python\
  \ 是高效实现中小型任务的极佳方法。当项目变得足够大时，编译器更加严格（例如，当参数类型不匹配时拒绝赋值）变得变得越来越重要。\n- 当我们可以依赖现有的、调良好的操作（如稠密矩阵运算）时，Fortran\
  \ 也很棒。它非常适合完成老教授们的家庭作业（因为他们只要求 Fortran 中容易实现的内容）。在作者看来，引入新的数据结构是非常繁琐的，在 Fortran\
  \ 中编写大型模拟程序是一项挑战——今天只有不断萎缩的少数人会自愿这样做。\n- C 允许获得良好的性能，大量软件是用 C 编写的。核心语言较小且易于学习。挑战在于用简单而危险的语言特性编写大型且无\
  \ bug 的软件，特别是指针 (§1.8.2) 和宏 (§1.9.2.1)。最后一个标准发布于 2017 年，因此命名为 C17。\n- 当主组件是 Web\
  \ 或计算量较少时，Java、C# 和 PHP 可能是很好的选择。\n- C++ 在我们开发大型、高质量软件时尤为出色。尽管如此，开发过程并不需要是缓慢痛苦的。有了合适的抽象，我们可以非常快速地编写\
  \ C++。\n\n### 排版规范\n\n新术语采用*清晰的蓝色斜体*。C++ 源代码使用`蓝色等宽字体`。重要细节**加粗**。类、函数、变量和常量使用小写，可选包含下划线。例外是矩阵，通常用单个大写字母命名。模板参数和概念以大写字母开头并可能包含后续大写（驼峰命名）。程序输出和命令使用`蓝色蓝色字体`。\n\
  \n除了极短的代码说明外，本书中的所有编程示例至少在一个编译器上测试通过，大多数情况下在三个编译器上通过：`g++`、`clang++` 和 Visual Studio。为了便于理解，所有示例都尽可能短。为此，我们没有包含在类似的生产代码可能会使用的所有功能。显然，我们尽量减少对尚未引入的功能的使用。\n\
  \n对于 C++20 示例，我们建议你尝试它们以看看在你的系统上是否有效。在本文编写期间，大多数新功能尚未被所有编译器完全支持。即使现有的编译器支持在当时可能也不\
  \ 100% 正确。对于某些新库，当任何编译器上都没有标准版本时，我们使用了原型实现（例如 format 库）。\n\n需要 C++11、C++14、C++17\
  \ 或 C++20 特性的程序带有相应的边框标记。若干轻度使用 C++11 特性且易被 C++03 表达式替换的程序未显式标记。\n\n\n\n\n\n与所讨论主题相关的程序示例位置将通过箭头指示，并在段落或章节的开头给出完整程序的路径。所有程序都可以在\
  \ GitHub 上的公共仓库 `https://github.com/petergottschling/dmc3` 获取，可以通过以下方式克隆：\n\n```\n\
