  \ end(seq), check);\n\n    cout ≪ \"The first value in range is \" ≪ *it ≪ '\\n';\n\
  \n}\n```\n\nC++11 或者是我们可以直接就地地创建谓词：\n\n```cpp\nauto it= find_if(begin(seq), end(seq),\n\
  \n                 [](int i){ return i > 4 && i <  7; } );\n```\n\n搜索和计数算法可以类似地使用，在线手册提供了良好的文档。\n\
  \n### 4.1.4.2 修改序列操作\n\n`copy`：修改操作必须谨慎使用，因为修改后的序列通常只通过起始迭代器进行参数。因此，作为程序员，我们的责任确保有足够的空间。例如，在\
  \ `copy` 容器之前，我们可以 `resize` 目标到源序列的大小：\n\n```cpp\nvector <int> seq= {3, 4, 7, 9,\
  \ 2, 5, 7, 8}, v;\n\nv.resize(seq.size());\n\ncopy(begin(seq), end(seq), begin(v));\n\
  ```\n\n通过 `copy` 打印序列是迭代器灵活性的很好的演示：\n\n```cpp\ncopy(begin(seq), end(seq), ostream_iterator<int>{cout,\
  \ \", \"});\n```\n\n`ostream_iterator` 为输出流构建了一个极简的迭代器接口：`++` 和 `*` 操作是空的，不需要比较，赋值一个值将其连同分隔符发送到所引用的流中。`unique`\
  \ 是一个在软件中非常有用的函数：它移除了序列中的重复条目。作为前提条件，序列必须是排序的。然后 `unique` 就可以重新排列条目，使得唯一值位于前端，重复值位于末尾。返回一个指向第一个重复条目的迭代器，并可以用于去重：\n\
  \n```cpp\nstd::vector <int> seq= {3, 4, 7, 9, 2, 5, 7, 8, 3, 4};\n\nsort(begin(seq),\
  \ end(seq));\n\nauto it= unique(begin(seq), end(seq));\n\nresize(distance(seq),\
  \ it));\n```\n\n如果这是一项频繁的任务，可以将前面的操作封装在一个以序列为参数的泛型函数中：\n\n```cpp\ntemplate <typename\
  \ Seq>\nvoid make_unique(Seq& seq)\n\n{\n    using std::begin; using std::end; using\
  \ std::distance;\n    std::sort(begin(seq), end(seq));\n\n    auto it= std::unique(begin(seq),\
  \ end(seq));\n\n    seq.resize(distance(begin(seq), it));\n}\n```\n\n还有许多遵循类似的变异序列操作。\n\
  \n### 4.1.4.3 排序操作\n\n标准库中的排序函数非常强大，几乎可以在所有情况下使用。早期的实现基于快速排序，平均复杂度为 `O(n log n)`，但最坏情况为二次方复杂度。最近的版本使用\
  \ `intro-sort`，其最坏情况复杂度也是 `O(n log n)`。简而言之，几乎没有理由费心编写我们自己的实现。默认情况下，`sort` 使用 `operator<`，但我们可以自定义比较，例如按降序排序序列：\n\
  \n```cpp\nvector <int> seq= {3, 4, 7, 9, 2, 5, 7, 8, 3, 4, 3, 9};\n\nsort(begin(seq),\
  \ end(seq), [](int x, int y){return x > y;});\n```\n\n较低的最坏情况复杂度在当时已经由 `stable_sort`\
  \ 提供。对于用户类型，`begin` 函数通过 ADL（§3.2.2）被找到，并且比 `std::begin` 是更好的匹配。`end` 也是如此。相比之下，对于\
  \ `find` 函数，我们不想调用可能的用户重载，并确保它是从 `std` 中获取的。\n\n`find_if` 通过搜索符合通用判据的第一个条目对 `find`\
  \ 进行了泛化。它不是与单个值进行比较，而是评估一个 `Predicate`——一个返回 `bool` 的函数。假设我们搜索 `list` 中第一个大于 4 且小于\
  \ 7 的条目：\n\n```cpp\nbool check(int i) { return i > 4 && i <  7; }\n\nint main ()\n\
  \n{\n\n    list <int> seq= {3, 4, 7, 9, 2, 5, 7, 8};\n\n    auto it= find_if(begin(seq),\
  \ end(seq), check);\n\n    cout ≪ \"The first value in range is \" ≪ *it ≪ '\\n';\n\
  \n}\n```\n\nC++11 或者是我们可以直接就地地创建谓词：\n\n```cpp\nauto it= find_if(begin(seq), end(seq),\n\
  \n                 [](int i){ return i > 4 && i <  7; } );\n```\n\n### 4.1.4.4 数值操作\n\
  \nSTL 的数值操作位于头文件 `<numeric>`。`iota` 从给定值开始递增 1 生成序列。`accumulate` 默认评估序列之和，并在提供二元函数时执行任意归约。`inner_product`\
  \ 默认执行点积，其中通用形式允许用户替换加法和乘法。`partial_sum` 和 `adjacent_difference` 的行为正如其名。以下小程序展示了一些基本的数值函数：\n\
  \n```cpp\nvector <float> v= {3.1, 4.2, 7, 9.3, 2, 5, 7, 8, 3, 4},\n            \
  \    w(10), x(10), y(10);\n\niota(begin(w), end(w), 12.1);\n\npartial_sum (begin(v),\
  \ end(v), begin(x));\n\nadjacent_difference(begin(v), end(v), begin(y));\n\nfloat\
  \ alpha= inner_product(begin(w), end(w), begin(v), 0.0f);\n\nfloat sum_w= accumulate(begin(w),\
  \ end(w), 0.0f),\n      product_w= accumulate(begin(w), end(w), 1.0f,\n        \
  \                     [](float x, float y){return x * y;});\n```\n\n`iota` 函数不是\
  \ C++03 的一部分，但从 C++11 开始集成到标准中。\n\n### 4.1.4.5 复杂度\n\nBjarne Stroustrup 将所有算法的复杂度总结在一个简洁的表格（表\
  \ 4–1）中，他慷地允许我们分享。\n\n**表 4–1：STL 算法的复杂度**\n\n![Images](img/04tab01.jpg)\n\n###\
  \ 4.1.5 范围\n\n#### 4.1.5.1 迭代器的风险与局限性\n\nC++20 迭代器无疑对 C++ 编程做了重要贡献。然而，它们可能危险并导致接口不优雅。让我们从风险开始。迭代器通常成对出现，只有程序员才能确保这两个迭代器确实相关。这为我们提供了一个令人不悦的错误集：\n\
  \n• 结束迭代器在前。\n\n• 迭代器来自不同的容器。\n\n• 迭代器跨步过长（跨越多个条目）没有命中结束迭代器。\n\n\n\n在所有这些情况下，迭代都可以在任意内存上运行，并且可能只有在程序离开可访问的地址空间时才会停止。程序崩溃可能仍然我们的最佳选择，因为我们可以看到我们在哪里失败了。在某处停止迭代的执行过程很可能已经破坏了大量数据，导致程序在以崩溃或所谓的“成功”结束之前造成了严重损害。\n\
  \n同样地，大多数针对多个容器的 `STL` 函数只接受来自一个容器的迭代器对，而对其他容器则仅接受其起始迭代器，例如：\n\n```\ncopy(begin(v),\
  \ end(v), begin(w));\n```\n\n因此，无法测试 `copy` 的目标是否提供了足够的空间以及随机内存是否可以被覆盖。最后，基于迭代器的接口并不总是优雅。对比一下：\n\
  \n```\nx = inner_product(begin(v), end(v), begin(w));\n```\n\n与：\n\n```\nx = dot(v,\
  \ w);\n```\n\n这个示例已经说明了一切。此外，第二种构想允许我们检查 `v` 和 `w` 的大小是否匹配。出于这些原因，我们建议：\n\n# 基于迭代器的函数\n\
  \n如果你编写基于迭代器的函数，请在它们之上提供一个用户友好的接口。\n\n如何做到？这将在下文中解释。\n\n## 4.1.5.2 新函数接口\n\n⇒ `c++20/ranges_copy.cpp`\n\
  \nC++20 引入了 *Ranges*。遗憾的是，在编写时编译器的支持并不尽人意。因此，我们部分通过 Eric Niebler 的原型库研究了这一有趣的功能。在\
  \ GitHub 上，你可以在大多数示例中同时找到标准版本和原型版本。由于与 `std` 的歧义，我们的源代码包含许多显式的命名空间限定。我们乐观地认为，当 ranges\
  \ 完全集成到编译器的标准库时，这种负担将会减少。在使用标准 ranges 尝试以下代码段时，你应该在程序中添加 `using namespace std::ranges;`。尽管有这些细节，我们希望这一节能帮助你开始使用这个非常有用的功能。\n\
  \n通俗地说：ranges 是所有我们可以通过 `begin` 和 `end` 函数进行迭代的类型。这允许我们通过使用 ranges 而不是迭代器来减少许多函数中的参数数量。例如，我们可以减少之前提到的\
  \ `copy` 函数的参数数量：\n\n```\nvector <int> u{3, 2, 6, 7, 4}, v(5), w;\n\nranges::copy(u,\
  \ begin(v));\n```\n\n一对迭代器并不一定代表整个容器。它也可以指向容器的一部分或更通用的抽象。仅考虑整个容器就已经足以证明即使是微小的错误也会导致灾难性的后果。\n\
  \n源直接作为第一个参数传递，我们从目标容器获取 `begin` 迭代器。该接口显然比以前更简洁。它也不容易出现前一节中的错误。只有当源的起始和终止迭代器在相应的文中单独提供时，基于迭代器的接口才是优选的。但这非常罕见；在大多数情况下，它们都是通过对同一个容器（或其他范围）调用\
  \ `begin` 和 `end` 提供的，因此新接口涵盖了大部分应用。\n\n这种新接口仍然存在一个风险：越过目标可用空间的末尾。更好的做法是类似于：\n\n\
  ```\ncopy(u, w);\n```\n\n其中 `w` 被调整为与 `v` 大小。标准库没有提供这种接口，我们现在将实现它。\n\n为了使目标的大小适应源的大小，我们必须添加两个额外要求：源必须提供大小信息，目标必须能够更改其大小。源的大小可以通过迭代器函数\
  \ `distance` 确定，但它可能是开销的（复杂度最高达线性），并且当类型不是 `forward_iterator` 时会导致起始迭代器失效。range\
  \ 库引入了 `sized_range` 概念，用于具有常数复杂度 `size` 函数的范围。该概念涵盖了我们对源的要求。要求的必须在一个新的概念中实现：\n\n\
  ```\ntemplate <typename R>\n\nconcept ResizableRange =\n\n    ranges::range <R>\
  \ &&\n\n    requires(R& r, size_t n)\n\n    {\n\n        r.resize(n);\n    };\n\
  ```\n\n现在我们可以写 true 一个可靠的 `copy` 函数：\n\n```\ntemplate <sized_range Source, ResizableRange\
  \ Target>\n\nauto copy(const Source& src, Target& tgt)\n\n{\n\n    tgt.resize(size(src));\n\
  \n    return copy(src, begin(tgt));\n\n}\n```\n\n当所有的 `copy` 重载都经过适当约束时，我们的实现就不会引起任何歧义。Sean\
  \ Parent 指出了这种实现的一个缺点：对象在扩容 resize 期间会进行默认构造，然后无论如何会被覆盖。为了避免这种开销或对于没有默认构造函数的类的编译错误，我们最好在在使用\
  \ `back_insert_iterator` 拷贝之前使用 `clear` 和 `reserve`：\n\n```\ntemplate <typename\
  \ R>\n\nconcept ExpandableRange =\n\n    ranges::range <R> &&\n\n    requires(R&\
  \ r, size_t n)\n\n    {\n\n        r.reserve(n);\n    };\n\ntemplate <sized_range\
  \ Source, ExpandableRange Target>\n\nauto copy(const Source& src, Target& tgt)\n\
  \n{\n\n    tgt.clear();\n\n    tgt.reserve(ranges::size(src));\n\n    return ranges::copy(src,\
  \ back_insert_iterator{tgt});\n}\n```\n\n以类似的方式，许多标准函数现在可以为每个迭代器对或单个迭代器通过一个范围来实现。这建立了一个更方便且更可靠的接口。\n\
  \n## 4.1.5.3 标准视图\n\n⇒ `c++20/ranges_iota.cpp`\n\n所有标准容器都包含返回迭代器的 `begin` 和 `end`\
  \ 函数，因此它们都是范围。然而，范围并不限于容器；它们的定义更通用。一个范围并不一定包含数据。例如，遍历一个名为 `iota` 的视图等同于从容器读取数据：\n\
  \n```\nfor (int i : views::iota(1, 10))\n\n    cout << i << endl;\n```\n\n这段代码段打印从\
  \ 1 到 9 的值，就像我们遍历包含这些值的容器一样。该视图类似于我们在 2.7.6 节介绍的 `irange` 类。\n\n⇒ `c++20/ranges_examples.cpp`\n\
  \n大多数视图在不创建新容器的情况下建立新的视角。为了从给定范围内选择符合特定标准的条目，我们可以使用 `filter` 视图。遗憾的是，大多数视图类需要另一个视图作为参数且不适用于任意范围。因此，建议直接使用它们。相反，我们应该使用相应的*范围适配器\
  \ (Range Adaptor)*。对于每个视图类，`views` 子命名空间存在对应的适配器。例如，`views::filter` 是 `filter_view`\
  \ 的适配器。假设我们要打印 vector 中大于 4 且小于 7 的值：\n\n```\nbool in_range(int i) { return i >\
  \ 4 && i < 7; }\n\nvector <int> seq= {3, 4, 7, 6, 9, 2, 5, 7, 8};\n\nfor (int i\
  \ : views::filter(seq, in_range))\n\n    cout << i << \" is in range.\";\n```\n\n\
  在这个循环中，只有符合 `in_range` 的数字被打印，其他的被跳过。`views::filter` 没有创建新容器，仅是 `seq` 的轻量级代理。`filter`\
  \ 的迭代器仅仅是范围（在此情况下 vector）迭代器的封装。为了查看 `seq` 中过滤后的值，`filter` 的迭代器增会重复 `vector` 迭代器的增，直到引用值符合过滤条件。另一个实用的视图是\
  \ `transform`，它对每个条目应用一元函数：\n\n```\nauto square= [](int n){ return n * n; };\n\n\
  for (int i : views::transform(views::filter(seq, in_range),\n\n                \
  \               square))\n\n    cout << i << \" is the squared value of an in-range\
  \ entry.\";\n```\n\n\n\n在这里，我们对 `seq` 中所有大于 4 且小于 7 的值进行平方。在这个示例中我们看到，嵌套视图（views）并不会导致代码特别易读。为了提高可读性，视图提供了一种类似于\
  \ Unix shell 中的管道操作符。在这种情况下，我们在适配器（adaptor）中省略了范围参数：\n\n```cpp\nfor (int i : seq\
  \ | views::filter(in_range)\n                 | views::transform(square))\n    cout\
  \ ≪ i ≪ \" is the squared value of an in-range entry.\\n\";\n```\n\n范围（ranges）的另一个推广是\
  \ `begin` 和 `end` 可能返回不同的类型，因为 `end` 迭代器仅用于比较。实际上，`end` 返回的对象不需要是一个迭代器，而是一个所谓的“哨兵”（`Sentinel`）。只要它能与相应的迭代器比较，它可以是任何类型。\n\
  \n使用哨兵对算法产生一定影响。基于范围的 `for` 循环在 C++17 中已经过泛化，允许 `begin` 和 `end` 之间使用不同类型。经典的 STL\
  \ 算法是为迭代器对设计的。为了能够使用任意范围调用它们，我们可以使用 `common` 视图。例如，一个基于范围的排序函数可以如下实现：\n\n```cpp\n\
  template <random_access_range Range>\nvoid sort(Range& r)\n{\n    auto cr{views::common(r)};\n\
  \    sort(begin(cr), end(cr));\n}\n```\n\n一眼看去并不有用但事实证明很方便的视图是 `all`：它只是一个表示相同内容的范围的视图。然而，与某些容器类型不同，范围视图拥有输出操作符，因此我们可以用它打印：\n\
  \n```cpp\ncout ≪ \"seq = \" ≪ views::all(seq) ≪ endl;\n```\n\n至少在原型中是这样。\n\n此外，`views::all`\
  \ 被其他视图内部使用，用于将任意范围转换为视图。在表 4–2 中，你将找到 C++20 引入的视图概览。\n\n### 4.1.5.4 编写我们自己的视图\n\
  \n⇒ `c++20/range_enumerate_example.cpp`\n\nEric Niebler 原型实现中没有进入标准的视图是 `enumerate`。该视图为范围内的每个条目提供位置和值。作者在\
  \ Python 程序中经常使用它，因此现在也渴望在 C++ 中也拥有它。\n\n**表 4–2: 范围视图**\n\n![Images](img/04tab02.jpg)\n\
  \n为了简单起见，假设枚举范围不是右值（rvalue）且不需要存储。我们进一步假设 `begin` 和 `end` 返回相同的类型。那么视图本身非常简单：\n\n\
  ```cpp\ntemplate <typename Range>\nclass enumerate_view\n{\n    using iter= enumerate_iterator\
  \ <Range>;\npublic:\n    enumerate_view(Range& r) : r{r} {}\n    iter begin() const\
  \ noexcept { return iter{0, std::begin(r)};\n    iter end() const noexcept { return\
  \ iter{-1, std::end(r)}; }\nprivate:\n    Range& r; // 需要左值！\n};\n```\n\n它仅持有范围的引用并提供\
  \ `begin` 和 `end` 迭代器。`end` 迭代器中的位置不会被使用，并被设置为任意值。甚至迭代器也可以以简单的方式实现：\n\n```cpp\n\
  template <typename Range>\nclass enumerate_iterator\n{\n    using riter= decltype(std::begin(std::\
  \ declval <Range>()));\n    using self= enumerate_iterator <Range>;\npublic:\n \
  \   explicit enumerate_iterator(int index, riter it) : index{index}, it{it} {}\n\
  \    auto operator*() const noexcept { return make_pair(index, *it); }\n    bool\
  \ operator!=(self other) const noexcept { return it != other.it; }\n    self& operator++()\
  \ noexcept { ++index; ++it; return *this; }\nprivate:\n    int   index;\n    riter\
  \ it;\n};\n```\n\n如你所见，我们只比较底层迭代器，并在比较中忽略索引。解引用运算符返回索引和范围迭代器的 `pair`。现在我们现在可以使用的视图在基于范围的\
  \ `for` 循环中枚举 `vector` 的条目了：\n\n```cpp\nvector <int> seq= {3, 4, 7, 9, 2, 5, 7,\
  \ 8, 3, 4, 3, 9};\nfor (auto [i, value] : enumerate_view{seq})\n    cout ≪ \"The\
  \ \" ≪ i ≪ \"th value is \" ≪ value ≪ endl;\n```\n\n为了与标准视图一致，我们还提供了相应的适配器，它可以像函数一样调用：\n\
  \n```cpp\nnamespace views {\n    struct enumerate_t\n    {\n        template <typename\
  \ Range>\n        enumerate_view <Range> operator()(Range&& r) const noexcept\n\
  \        {\n             return enumerate_view <Range>{std::forward <Range>(r)};\n\
  \        }\n    };\n    static constexpr enumerate_t enumerate;\n}\n\nfor (auto\
  \ [i, value] : views:: enumerate(seq))\n    cout ≪ \"The \" ≪ i ≪ \"th value is\
  \ \" ≪ value ≪ endl;\n```\n\n等待，让我重新检查一下最后一部分提供的文本。末尾有一些混乱的文本。我将根据并行计算部分的逻辑对其进行清理。\n\
  \n### 4.1.5.5 并行计算\n\n⇒ `c++20/parallel_sort.cpp`\n\n大多数 STL 算法在 C++17 中就可以并行执行。正如我们所知，相应的函数通过新的执行策略进行了重载。所有策略位于\
  \ `std::execution` 中。为了顺序执行算法（如以前），我们可以使用 `seq` 策略。因此以下两个调用是等价的：\n\n```cpp\nsort(seq,\
  \ begin (v), end(v));\nsort(begin(v), end(v));\n```\n\n`par` 策略触发多线程执行而线程内部计算是顺序的。为了释放硬件的最大潜力，可以使用\
  \ `par_unseq`：\n\n```cpp\nsort(par_unseq, begin (v), end(v));\n```\n\n这允许在每个线程内并行执行操作（即非顺序）。C++20\
  \ 增加了 `unseq` 策略用于单线程的非顺序计算。为了测试并行 `sort`，我们在 Visual Studio 2019 版本 16.9.3 的四核 Intel\
  \ i7-8550U 1.8 GHz 上运行 1000 万个 `int` 值，得到了以下时钟时间：\n\n```\nSorting with seq     \
  \  took 0.82638s.\nSorting with par       took 0.216368s.\nSorting with unseq  \
  \   took 0.819744s.\nSorting with par_unseq took 0.219476s.\n```\n\n我们可以看到多线程版本快了大约四倍，而线程内的并行化并没有加速执行，因为\
  \ SSE/AVX 在排序 `int` 值时帮助不大。然而，本书的一位评论者在他的机器上观察到 `unseq` 的结果快。在其他编译器上，我们没有看到并行策略带来的收益（且系统没有指示使用多线程）。因此，在你喜爱的平台上尝试是值得的。\n\
  \n在并行化的背景下，增加了七种新算法：\n\n- `for_each_n` 对前 *n* 个条目应用函数对象；\n- `reduce` 执行类似于 `accumulate`\
  \ 的归约操作，但允许顺序改变；\n- `transform_reduce` 在归约之前应用函数对象（通用 map-reduce）；\n- `inclusive_scan`\
  \ 计算与现有的顺序函数 `partial_sum` 相同的的前缀和；\n\n\n\n\n\n- `exclusive_scan` 计算一种部分和，其中第 $i^{th}$\
  \ 个元素被排除在第 $i^{th}$ 个和之外；以及\n- `transform_inclusive_scan` 和 `transform_exclusive_scan`\
  \ 在对每个元素应用趣函数（functor）后，计算相应的部分和。\n\n⇒ `c++20/parallel_reduce.cpp`\n\n我们希望 `reduce`\
  \ 操作能够从 AVX 加速中受益。我们在上述 i7 上对一组十亿个 `double` 值的大集合进行了测量：\n\n```\nReducing with seq\
  \       took 0.429475s.\nReducing with par       took 0.2653s.\nReducing with unseq\
  \     took 0.42294s.\nReducing with par_unseq took 0.261549s.\n```\n\n在这次计算中，限制因素显然是内存带宽，我们这种加速归功于第二个内存通道，它允许通过多个线程进行更快的加载。为了消除带宽限制，我们测量了较小的集合，由于线程管理的开销，顺序版本甚至比并行版本更快。尽管如此，我们仍然没有看到\
  \ `par_unseq` 策略相比 `par` 的收益。\n\n**结语：** 本节仅触及 STL 的一角， 仅作为一道开菜。\n\n### 4.2 数值\n\
  \n在本节中，我们将阐述如何使用 C++ 的复数和随机数生成器。`<cmath>` 头文件包含许多数值函数，其用法非常直接，不需要进一步说明。\n\n### 4.2.1\
  \ 复数\n\n我们已经在 第 2 章 中演示了如何实现一个非模板的 `complex` 类，并在 第 3 章 中使用了 `complex` 类模板。为了不再重复显而易见的内容，我们将通过一个图形示例来说明其用法。\n\
  \n##### 4.2.1.1 曼德尔集合\n\n曼德尔集合——以以其创建者 Benoît B. Mandelbrot 命名——是通过连续平方并加上原始值后不会趋于无穷大的\
  \ `complex` 数集合：\n\n![Images](img/239equ01.jpg)\n\n其中\n\n![Images](img/239equ02.jpg)\n\
  \n可以证明，当 $|zn| > 2$ 时，该点位于曼德尔集合之外。计算幅度最耗资源的部分是最后的平方根。C++ 提供了一个函数 `norm`，它是 `abs`\
  \ 的平方，即：在不进行最终 `sqrt` 的情况下计算 `abs`。因此，我们将终止准则 `abs(z) <= 2` 替换为 `norm(z) <= 4`。\n\
  \n⇒ `c++11/mandelbrot.cpp`\n\n曼德尔集合的可视化是对达到该限制所需的迭代进行编码。为了绘制分形，我们使用了跨平台库 Simple\
  \ DirectMedia Layer (SDL 1.2)。数值部分由 `mandel_pixel` 类实现，该类计算每个像素需要多少次迭代直到 `norm(z)\
  \ > 4` 以及这代表哪种颜色：\n\n```cpp\nclass mandel_pixel\n{\n  public:\n    mandel_pixel(SDL_Surface*\
  \ screen, int x, int y,\n                 int xdim, ydim, int max_iter)\n      :\
  \ screen{screen}, max_iter{max_iter}, iter{0}, c{x, y}\n    {\n      // scale y\
  \ to [-1.2,1.2] and shift -0.5+0i to the center\n      c*= 2.4f / static_cast <float>(ydim);\n\
  \      c-= complex <float>(1.2 * xdim / ydim + 0.5, 1.2);\n      iterate();\n  \
  \  }\n\n    int iterations() const { return iter; }\n    uint32_t color() const\
  \ { ... }\n\n  private:\n    void iterate()\n   {\n        complex <float> z= c;\n\
  \        for (; iter < max_iter && norm(z) <= 4.0f; iter++)\n           z= z * z\
  \ + c;\n   };\n\n   // ...\n   int iter;\n   complex <float> c;\n};\n```\n\n复数经过了缩放，使得对于任何图像尺寸，它们的虚部都位于\
  \ -1.2 和 1.2 之间。然后图片向左移动了 0.5。我们省略了图形部分的代码行，因为我们在这里想关注复数。完整程序可以在 GitHub 上找到，结果图片见\
  \ 图 4–7。\n\n最后，我们的核心计算仅用三行实现，而其他约 50 行则用于画出一幅漂亮的图片，尽管已经使用了一个非常简单的图形库。遗憾的是，这种情况并不罕见：许多现实应用中用于文件\
  \ I/O、数据库访问、图形的代码远多核心逻辑代码。\n\n\n\n\n在 C++11 之前，只有来自 C 语言的 `rand` 和 `srand` 函数，功能非常有限。更糟糕的是，无法保证生成数字的质量，而且在某些平台上其质量实际上相当低。因此，C++11\
  \ 引入了高质量的 `<random>` 库。C++ 甚至考虑过完全弃用 `rand` 和 `srand`。虽然它们仍然存在，但在随机数质量要求重要的地方，应该尽量避免使用。\n\
  \n#### 4.2.2.1 保持简单\n\n⇒ `c++11/simple_random.hpp`\n\nC++11 中的随机数生成器提供了很大的灵活性，这对专家来说非常有用，但对初学者来说可能有些负担。Walter\
  \ Brown 提出了一组对新手友好的函数 [8]。经过略微调整^6 后，它们如下：\n\n```cpp\n#include <random>\n\nstd::default_random_engine&\
  \ global_urng()\n{\n    static std::default_random_engine u{};\n    return u;\n\
  }\n\nvoid randomize()\n{\n    static std::random_device rd{};\n    global_urng().seed(rd());\n\
  }\n\nint pick(int from, int thru)\n{\n    static std::uniform_int_distribution <>\
  \ d{};\n    using parm_t= decltype(d)::param_type;\n    return d(global_urng(),\
  \ parm_t{from, thru});\n}\n\ndouble pick(double from, double upto)\n{\n    static\
  \ std::uniform_real_distribution <> d{};\n    using parm_t= decltype(d)::param_type;\n\
  \    return d(global_urng(), parm_t{from, upto});\n}\n```\n\n要开始使用随机数，只需将这三个函数复制到项目中，稍后再查看细节。Walter\
  \ 的接口非常简单，但对于许多实际用途（如代码测试）已经足够了。我们只需要记住以下三个函数：\n\n- `random`：通过初始化生成器的种子使数字变得真正随机。\n\
  - `pick(int a, int b)`：当 `a` 和 `b` 为 `int` 时，返回区间 `[a, b]` 内的一个 `int`。\n- `pick(double\
  \ a, double b)`：当 `a` 和 `b` 为 `double` 时，返回右开区间 `a, b)` 内的一个 `double`。\n\n[6。Walter\
  \ 使用非 lambda 函数的返回类型推导，这在 C++14 及更高版本中才可用。我们把函数名从 `pick_a_number` 缩短为 `pick`。\n\n\
  如果不调用 `randomize`，生成的数字序列每次都是相等的，这在某些情况下是有益的：具有可复现的行为更容易发现 bug。注意，`pick` 包含了 `int`\
  \ 的上限，但没有包含 `double` 的上界，以与标准函数保持一致。`global_urng` 目前可以被视为一个实现细节。有了这些函数，我们可以轻松地编写用于掷骰子的循环：\n\
  \n```cpp\nrandomize();\n\ncout << \"Now, we roll dice:\\n\";\n\nfor (int i= 0; i\
  \ < 15; ++i)\n    cout << pick(1, 6) << endl;\n\ncout << \"\\nLet's roll continuous\
  \ dice now: ;-)\\n\";\n\nfor (int i= 0; i < 15; ++i)\n    cout << pick(1.0, 6.0)\
  \ << endl;\n```\n\n事实上，这比旧的 C 接口还要简单。但它仍然没有进入标准。也许对于严苛的 C++ 程序员来说太简单了。尽管如此，我们将在后续节中使用此接口进行测试。\n\
  \n#### 4.2.2.2 随机测试\n\n⇒ `c++11/random_testing.cpp`\n\n假设我们要测试来自第 2 章的 `complex`\
  \ 实现是否满足分配律：\n\n![Images](img/04equ01.jpg)\n\n乘法的标准实现方式如下：\n\n```cpp\ninline complex\
  \ operator*(const complex& c1, const complex& c2)\n{\n    return complex(real(c1)\
  \ * real(c2) - imag(c1) * imag(c2),\n                   real(c1) * imag(c2) + imag(c1)\
  \ * real(c2));\n}\n```\n\n为了处理舍入误差，我们引入了一个 `similar` 函数来检查相对差异：\n\n```cpp\n#include\
  \ <limits>\n\ninline bool similar(complex x, complex y)\n{\n    const double eps=\
  \ 10 * numeric_limits<double>::epsilon();\n    double sum= abs(x) + abs(y);\n  \
  \  if (sum < 1000 * numeric_limits<double>::min())\n        return true;\n    return\
  \ abs(x - y) / sum <= eps;\n}\n```\n\n为了避免除零，如果两个 `complex` 数的模都非常接近零，则认为它们是相似的（模之和小于可表示的\
  \ `double` 最小值的 1000 倍）。否则，我们将两个值之差与它们的模之和联系。这个差不应大于 epsilon 的 10 倍（即 1 与下一个可表示的\
  \ `double` 值之间的差异）。这些信息由在第 4.3.1 节中引入的 `<limits>` 库提供。\n\n```cpp\nstruct distributivity_violated\
  \ {};\n\ninline bool similar(complex x, complex y)\n{\n    const double eps= 10\
  \ * numeric_limits<double>::epsilon();\n    double sum= abs(x) + abs(y);\n    if\
  \ (sum < 1000 * numeric_limits<double>::min())\n        return true;\n    return\
  \ abs(x - y) / sum <= eps;\n}\n\nvoid test(complex a, complex b, complex c)\n{\n\
  \    if (!similar(a * b + c, a * (b + c)))\n    {\n        cerr << \"Test detected\
  \ that \" << (a * b + c) << \" != \" << a * (b + c) << endl;\n        throw distributivity_violated();\n\
  \    }\n}\n\nint main ()\n{\n    const double from= -10.0, upto= 10.0;\n    int\
  \ max_test= 20;\n    randomize();\n    for (int i= 0; i < max_test; ++i)\n    {\n\
  \        complex a= mypick();\n        for (int j= 0; j < max_test; ++j)\n     \
  \   {\n            complex b= mypick();\n            for (int k= 0; k < max_test;\
  \ ++k)\n            {\n                complex c= mypick();\n                test(a,\
  \ b, c);\n            }\n        }\n    }\n}\n```\n\n#### 4.2.2.3 引擎\n\n`<random>`\
  \ 库包含了两种功能对象：生成器和分布。。前者生成无符号整数序列（精确类型由每个类的别名提供）。每个值应具有相同的概率。分布类将这些数字映射到概率对应参数化分布的值。\n\
  \n除非有特殊需求，否则我们可以使用 `default_random_engine`。它的具体定义取决于实现，但我们可以信任标准库开发者已经选择了合适的引擎。我们必须记住，随机数序列确定地取决于它的种子，并且每次创建对象时引擎都使用相同的种子初始化。因此，给定类型的新引擎总是产生相同的序列，例如：\n\
  \n```cpp\nvoid random_numbers()\n{\n    default_random_engine re;\n    cout << \"\
  Random numbers: \";\n    for (int i= 0; i < 4; i++)\n        cout << re() << (i\
  \ < 3 ? \", \" : \"\");\n    cout << '\\n';\n}\n\nint main ()\n{\n    random_numbers();\n\
  \    random_numbers();\n}\n```\n\n这在作者的机器上产生了：\n\n\n\n\n\n```\nRandom numbers: 16807,\
  \ 282475249, 1622650073, 984943658\n\nRandom numbers: 16807, 282475249, 1622650073,\
  \ 984943658\n```\n\n为了在每次调用 `random_numbers()` 时都获得不同的序列，我们必须通过将引擎声明为 `static` 来创建一个持久的引擎：\n\
  \n```cpp\nvoid random_numbers()\n{\n    static default_random_engine re;\n    ...\n\
  }\n```\n\n尽管如此，在每次程序运行时我们仍然得到相同的序列。为了克服这个问题，我们必须将种子设置为一个接近真随机的值。这样的值由 `random_device`\
  \ 提供：\n\n```cpp\nvoid random_numbers()\n{\n    static random_device rd;\n    static\
  \ default_random_engine re{rd()};\n    ...\n}\n```\n\n`random_device` 返回的值取决于硬件测量结果和操作系统事件，可以被视为虚拟随机（即实现了极高的\
  \ `Entropy`）。事实上，`random_device` 与引擎提供了相同的接口，只是不能设置种子。因此，它也可以用于生成随机值，至少在不考虑性能的情况下。在我们的测试机器上，使用\
  \ `default_random_engine` 生成一百万个随机数需要 4–13 ms，而使用 `random_device` 则需要 810–820 ms。在依赖高质量随机数的应用（如密码学）中，这种性能开销是可以接受的。在大多数情况下，仅用\
  \ `random_device` 生成初始种子或以后偶尔调用它就足够了。\n\n在这些生成器中，包括主引擎、引擎的可参数化适配器以及预定义的适配器引擎：\n\n\
  *   生成随机值的的**基础引擎**：\n    *   `linear_congruential_engine`，\n    *   `mersenne_twister_engine`，\n\
  \    *   以及 `subtract_with_carry_engine`。\n*   从另一个引擎创建新引擎的**引擎适配器**：\n    *   `discard_block_engine`：每次忽略底层引擎的\
  \ `n` 个条目；\n    *   `independent_bits_engine`：将主随机数映射到 `w` 位；\n    *   `shuffle_order_engine`：通过保留最后值的内部缓冲区来修改随机数的顺序。\n\
  *   通过实例化或适配从基础引擎构建的**预定义适配器引擎**：\n    *   `knuth_b`\n    *   `minstd_rand`\n  \
  \  *   `minstd_rand0`\n    *   `mt19937`\n    *   `mt19937_64`\n    *   `ranlux24`\n\
  \    *   `ranlux24_base`\n    *   `ranlux48`\n    *   `ranlux48_base`\n\n最后一组中的预定义引擎只是类型定义，例如：\n\
  \n```cpp\nusing knuth_b = shuffle_order_engine <minstd_rand0, 256>;\n```\n\n###\
  \ 4.2.2.4 分布概述\n\n如前所述，分布类将无符号整数映射到参数化分布。表 4–3 总结了 C++11 中定义的分布。由于空间限制，我们使用了一些缩写符号。分布的结果类型可以指定为类模板的参数，其中\
  \ `I` 表示整数，`R` 表示实数类型。当构造函数中（例如 `m`）和描述公式中（例如 `μ`）使用不同的符号时，我们在先决条件中指明了二者的等价性（如 `m`\
  \ ≡ `μ`）。为了保持一致，我们在对数正态分布和正态分布中使用了相同的符号（与其他书籍、在线参考和标准不同）。\n\n**表 4–3：待评审内容**\n\n\
  ![Images](img/04tab03.jpg)\n\n### 4.2.2.5 使用分布\n\n分布通过随机数生成器进行参数化，例如：\n\n```cpp\n\
  default_random_engine re(random_device{}());\n\nnormal_distribution <> normal;\n\
  \nfor (int i= 0; i < 6; ++i)\n    cout << normal(re) << endl;\n```\n\n在这里，我们创建了一个引擎（在构造函数中进行随机化）以及一个类型为\
  \ `double` 且默认参数 `μ` = 0.0 和 `σ` = 1.0 的正态分布。在每次调用基于分布的生成器时，我们将随机引擎作为参数传递。以下是程序的输出示例：\n\
  \n```\n-0.339502\n0.766392\n-0.891504\n0.218919\n2.12442\n-1.56393\n```\n\n当然，每次调用它时结果都是不同的。或者，我们可以使用来自\
  \ `<functional>` 头文件的 `bind` 函数（见 §4.4.7）将分布绑定到引擎：\n\n```cpp\nauto normal= bind(normal_distribution<>{},\n\
  \                  default_random_engine(random_device{}()));\n\nfor (int i= 0;\
  \ i < 6; ++i)\n    cout << normal() << endl;\n```\n\nC++14 函数对象 `normal` 现在可以无参数调用了。在这种情况下，`bind`\
  \ 更加简洁。\n\n### 4.2.2.6 股价随机模拟\n\n使用 Black-Scholes 模型，我们可以模拟股价的演变。公式为：\n$S_{t+dt}\
  \ = S_t \\exp((\\mu - 0.5\\sigma²)dt + \\sigma\\sqrt{dt}Z)$\n其中 $Z$ 是标准正态随机变量。\n\
  \n```cpp\ndefault_random_engine re(random_device{}());\nnormal_distribution<> normal;\n\
  \ndouble mu = 0.05;\ndouble sigma = 0.3;\ndouble dt = 1.0/252.0;\ndouble years =\
  \ 20;\nvector<double> s{345.0};\n\nfor (double t=0; t < years; t+=dt) {\n    double\
  \ Z = normal(re);\n    s.push_back(s.back() * exp((mu - 0.5*sigma*sigma)*dt + sigma*sqrt(dt)*Z));\n\
  }\n```\n\n图 4–8 描述了 20 年内股价的五种发展情况。\n\n![Images](img/04fig8.jpg)\n\n\n\n\n\n表 4–5\
  \ 给出了所有常数的概述。在表中，我们只命名了 `double` 实例；相应的变量模板则通过附加 `_v` 来获取。\n\n**表 4–5：数学常数**\n\n\
  ![Images](img/04tab05.jpg)\n\n⇒ `c++20/math_constant_examples.cpp`\n\n使用这些常量允许我们编写无需转换的泛型函数：\n\
  \n```cpp\ntemplate <typename T>\nT circular_area(T r)\n{\n    return std::numbers::pi_v<T>\
  \ * r * r;\n}\n```\n\n如圆面积示例所示。\n\n## 4.3 元编程\n\n在本节中，我们将带你领略元编程的奥秘。在这里，我们将重点关注库的支持，并在第\
  \ 5 章中我们将提供更多背景知识。\n\n### 4.3.1 限制 (Limits)\n\n`<limits>` 是一个非常有用的泛型编程库，它提供了关于类型的重要信息。它还可以防止当源代码在另一个平台编译且某些类型的实现方式不同时产生意外行为。`<limits>`\
  \ 头文件包含了类模板 `numeric_limits`，它提供关于内建类型的特定类型信息。这在处理数值型类型参数时尤为重要。\n\n在第 1.7.5 节中，我们已经演示了浮点数的只有部分数字会被写入输出。特别是当数字被写入文件时，我们希望能够读回正确的值。十位数在\
  \ `numeric_limits` 中以编译时常数给出。以下程序以不同的浮点格式打印 1/3，并额外多出一个位：\n\n```cpp\n#include <iostream>\n\
  #include <limits>\n\nusing namespace std;\n\ntemplate <typename T>\ninline void\
  \ test(const T& x)\n{\n    cout << \"x = \" << x << \" (\";\n    auto oldp= cout.precision(numeric_limits\
  \ <T>::digits10 + 1);\n    cout << x << \")\" << endl;\n    cout.precision(oldp);\n\
  }\n\nint main ()\n{\n    test(1.f/3.f);\n    test(1./3.0);\n    test(1./3.0l);\n\
  }\n```\n\n这在作者的系统上输出：\n\n```\nx = 0.333333 (0.3333333)\nx = 0.333333 (0.3333333333333333)\n\
  x = 0.333333 (0.3333333333333333333)\n```\n\n另一个例子是计算容器的最小值。当容器为空时，我们想要最小操作的单位元素，即对应类型的最大表示值：\n\
  \n```cpp\ntemplate <typename Container>\ntypename Container::value_type\ninline\
  \ minimum(const Container& c)\n{\n    using vt= typename Container::value_type;\n\
  \    vt min_value= numeric_limits <vt>::max();\n    for (const vt& x : c)\n    if\
  \ (x < min_value)\n            min_value= x;\n    return min_value;\n}\n```\n\n\
  C++11 方法 `max` 是 `static` 的（类似于 `numeric_limits` 中的所有函数），可以直接为类型调用，而不需要对象。同样，`static`\
  \ 方法 `min` 产生最小值——更准确地说，是 `int` 类型的最小表示值，以及浮点类型大于 0 的最小值。因此，C++11 引入了成员 `lowest`，它确实能为所有基本类型产生最小值。\n\
  \n定点计算中的终止标准应该是依赖于类型的。当准则太大时，结果会变得不必要的精确。当准则太小时，算法可能无法终止（它只有在两个连续值相相运行时才能结束）。对于浮点类型，`static`\
  \ 方法 `epsilon` 产生加到 1 上的最小值，使得结果大于 1，换句话说，就是最小可能的增量（相对于 1），也称为*最小精度单位* (ULP)。我们已经在第\
  \ 4.2.2.2 节中用过它来确定两个值的相似性。\n\n以下泛型示例迭代地计算平方根。终止标准是 ![Images](img/04fig01.jpg) 的平方近似结果位于\
  \ *x* 的 *ɛ* 环境中。为了确保我们的环境足够大，我们用 *x* 对其进行缩并在之后翻倍：\n\n```cpp\ntemplate <typename\
  \ T>\nT square_root(const T& x)\n{\n    const T my_eps = T{2} * x * numeric_limits\
  \ <T>::epsilon();\n    T r= x;\n    while (std::abs((r * r) - x) > my_eps)\n   \
  \     r= (r + x/r) / T {2};\n    return r;\n}\n```\n\n`numeric_limits` 成员完整集合可以在在线参考中找到，如**[www.cppreference.com](http://www.cppreference.com)**\
  \ 和**[www.cplusplus.com](http://www.cplusplus.com)**。\n\n#### C++11 4.3.2 类型特性 (Type\
  \ Traits)\n\nC++11 4.3.2 类型特性\n\n[www.cppreference.com](http://www.cppreference.com)\
  \ 和 [www.cplusplus.com](http://www.cplusplus.com) 等在线参考中提供了完整的 `numeric_limits`\
  \ 成员集合。\n\n`c++11/type_traits_example.cpp`\n\n许多程序员多年来一直在 Boost 库中使用类型特性，C++11 在\
  \ `<type_traits>` 中提供了它们。我们在此处节制不再列出它们。\n\n使用这些常量允许我们编写无需转换的泛型函数：\n\n```cpp\ntemplate\
  \ <typename T>\nT circular_area(T r)\n{\n    return std::numbers::pi_v<T> * r *\
  \ r;\n}\n```\n\n如圆面积示例所示。\n\n\n\n\n\n```\nsimple_point p1 {3.0, 7.1}, p2;\n\nstatic_assert(std::is_trivially_copyable\
  \ <simple_point>::value,\n              \"simple_point is not as simple as you think\
  \ \"\n              \"and cannot be memcpyd!\");\nstd:: memcpy (&p2, &p1, sizeof(p1));\n\
  ```\n\n要成为“平凡可拷贝”（trivially copyable），前提是用户没有提供自己的拷贝或移动操作。更简单且通用的方法是使用 STL 函数 `copy`：\n\
  \n```\ncopy (&x, &x + 1, &y);\n```\n\n无论我们的类如何实现，这总是有效的。在类型允许的情况下，`copy` 在内部会使用\
  \ `memmove` 或 `memcpy`。\n\n### C++14\n\nC++14 增加了一些模板别名，例如：\n\n```\nconditional_t\
  \ <B, T, F>\n```\n\n作为以下内容的简写：\n\n```\ntypename conditional <B, T, F>:: type\n```\n\
  \n同样，`enable_if_t` 是 `enable_if` 类型的缩写。\n\n### C++17\n\n基于值的类型特性的模板化常量允许我们在 C++17\
  \ 中替换，例如：\n\n```\nis_trivially_copyable <T>::value\n```\n\n为：\n\n```\nis_trivially_copyable_v\
  \ <T>\n```\n\n### C++11 4.4 Utilities\n\nC++11 增加了新的库，使得现代编程风格更加简单和优雅。例如，我们可以更容易地返回多个结果，更灵活地引用函数和仿函数，并创建引用的容器。C++17\
  \ 增加了更多实用程序，允许我们例如处理有时可能未定义的值，或者以类型安全的方式处理不同类型的值。\n\n#### C++17 4.4.1 `optional`\n\
  \n⇒ `c++17/optional_example.cpp`\n\n当我们在实数中计算平方根时，结果是未定义的（在 ℝ 中）。为了表达这一点，我们可以返回一个额外的\
  \ `bool` 来指示计算是否成功。理想的做法是将数值结果与 `bool` 一起封装在一个类中；这正是 `optional` 所提供的，它让我们的平方根计算变得非常清晰：\n\
  \n```\noptional <double> square_root(double x)\n{\n    if (x < 0.0)\n        return\
  \ nullopt;\n    else\n        return sqrt(x);\n}\n```\n\n`nullopt` 是一个对象（类型为 `nullopt_t`），用于构造一个没有值的\
  \ `optional` 对象。这等于类的默认构造函数，但 `nullopt` 版本更具表达力。\n\n为了方便，`optional` 提供了到 `bool`\
  \ 的隐式转换，指示值是否有定义，并允许我们在 `if`-语句中直接使用。访问值的简洁方法是使用 `operator*`。平方根的条件输出可以以非常紧凑的方式编写：\n\
  \n```\nvector <double> v= {4.0, -4.0, -0.09, 0.25};\n\nfor (double d : v)\n    if\
  \ (auto s= square_root(d); s)\n        cout ≪ \"Square root of \" ≪ d ≪ is \" ≪\
  \ *s ≪ '\\n';\n    else\n        cout ≪ d ≪ \" has no square root.\\n\";\n```\n\n\
  使用 `if` 的初始化功能，我们甚至不需要大括号。\n\n#### C++11 4.4.2 `tuple`\n\n当一个函数计算多个结果时，它们过去作为可变引用参数传递。假设我们实现了一个带主元化的\
  \ LU 分解，接收矩阵 `A` 并返回分解后的矩阵 `LU` 和排列向量 `p`：\n\n```\nvoid lu(const matrix& A, matrix&\
  \ LU, vector& p) { ... }\n```\n\n我们也可以将 `LU` 或 `p` 作为函数结果返回，并通过引用传递另一个对象。这种混合方法更加令人困惑。\n\
  \n⇒ `c++11/tuple_move_test.cpp`\n\n为了在不实现新类的情况下返回多个结果，我们可以它们封装成一个 `Tuple`。一个 `tuple`（来自\
  \ `<tuple>`）与容器的区别在于它允许不同的类型。与大多数容器不同，它的对象数量必须在编译时已知。通过 `tuple`，我们可以同时返回 LU 分解的两个结果：\n\
  \n```\ntuple <matrix, vector> lu(const matrix& A)\n{\n    matrix LU(A);\n    vector\
  \ p(n);\n    // ... some computations\n    return tuple <matrix, vector>(LU, p);\n\
  }\n```\n\n`return` 语句可以使用辅助函数 `make_tuple` 通过推导类型参数来简化：\n\n```\ntuple <matrix, vector>\
  \ lu(const matrix& A)\n{\n    ...\n    return make_tuple(LU, p);\n}\n```\n\nC++17\
  \ 在 C++17 中我们可以使用类和返回类型推导：\n\n```\nauto lu(const matrix& A)\n{\n        ...\n  \
  \  return tuple{LU, p}\n}\n```\n\n`make_tuple` 在 C++11 和 C++14 中结合 `auto` 变量使用时非常方便：\n\
  \n```\n// 9.0i is complex <double>{0.0, 9.0} in C++14\nauto t= make_tuple (LU, p,\
  \ 7.3, 9, LU*p, 2.0+9.0i);\n```\n\nC++17 在 C++17 中我们可以使用类和返回类型推导：\n\n```\nauto lu(const\
  \ matrix& A)\n{\n        ...\n    return tuple{LU, p}\n}\n```\n\n`make_tuple` 在\
  \ C++11 和 C++14 中结合 `auto` 变量时非常方便：\n\n```cpp\n// 9.0i is complex <double>{0.0,\
  \ 9.0} in C++14\nauto t= make_tuple (LU, p, 7.3, 9, LU*p, 2.0+9.0i);\n```\n\n提供的文本末尾有很多重复。让我根据代码块提供的内容重新梳理逻辑流。\n\
