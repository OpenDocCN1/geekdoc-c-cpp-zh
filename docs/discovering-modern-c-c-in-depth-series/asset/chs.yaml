  ## 第 1 章 C++ 基础\n\n“致我的孩子们：永远不要嘲笑必须帮我处理电脑事务。我教过你们如何使用勺子了。”\n\n—Sue Fitzmaurice\n\
  \n在第一章中，我们将引导您了解 C++ 的基本特性。对于整本书，我们将从不同的角度来看这些特性，但不会尝试暴露每一个可能的细节——这本身也是不可行的。关于特定功能的更多详细问题，我们建议参考\
  \ `http://en.cppreference.com` 在线参考。\n\n### 1.1 我们的第一个程序\n\n作为 C++ 语言的介绍，让我们来看下面的示例：\n\
  \n```cpp\n# include <iostream>\n\nint main ()\n\n{\n    std::cout ≪ \"The answer\
  \  to the Ultimate Question of Life,\\n\"\n              ≪ \"the Universe, and Everything\
  \ is:\"\n              ≪ std::endl ≪ 6 * 7 ≪ std::endl;\n\n    return 0;\n\n}\n\
  ```\n\n根据 Douglas Adams [2]，它的输出为：\n\n```\nThe answer to the Ultimate Question of\
  \ Life,\nthe Universe, and Everything is:\n42\n```\n\n这个短的示例已经说明了 C++ 的几个特性：\n\n\
  • 输入和输出不是核心语言的一部分，而是由库提供的。它们必须显式包含；否则我们无法读取或写入。\n• 标准 I/O 具有流模型，因此命名为 `<iostream>`。为了启用其功能，我们在第一行中\
  \ `#include <iostream>`。\n• 每个 C++ 程序都从调用函数 `main` 开始。它返回（return）一个整数，其中 0 表示成功终止。\n\
  • 大括号 `{}` 表示代码块/组（也称为复合语句）。\n• `std::cout` 和 `std::endl` 定义在 `<iostream>` 中。前者是一个输出流，允许在屏幕上打印文本。`std::endl`\
  \ 结束一行。我们也可以使用特殊字符 `\\n` 跳到新行。\n• 运算符 `≪` 可将对象传递给如 `std::cout` 等输出流以执行输出操作。请注意，该运算符在程序中表示为两个小于号（`<<`）。为了获得更优雅的打印效果，我们在代码列表中使用了单个法语书角号（guillemet）。\n\
  • `std::` 表示该类型或函数来自标准*命名空间*（Namespace）。命名空间帮助我们组织名称并处理命名冲突。\n• 本书中的许多示例使用了来自 `std`\
  \ 命名空间的类型，而没有带上 `std::` 限定前缀。要编译此类示例，假设在包含头文件后，程序包含以下声明：\n\n```cpp\nusing namespace\
  \ std;\n```\n\n命名空间的细节将在 第 3.2.1 节 中讨论。\n• 字符串常量（更准确地说是字面量）包含双引号内。\n• 表达式 `6 * 7`\
  \ 被求值并作为整数传递给 `std::cout`。在 C++ 中，每个表达式都有类型。有时我们程序员必须显式声明类型，而有时编译器可以为我们推断。`6` 和\
  \ `7` 是 `int` 类型的字面量常量，因此它们的积也是 `int`。\n\n在您继续阅读之前，我们强烈建议您在计算机上编译并运行这个小程序。一旦它编译并运行，您就可以稍微玩玩，例如添加更多操作和输出（并查看错误消息）。最后，真正学习语言的唯一方法就是使用它。如果您已经知道如何使用编译器甚至\
  \ C++ IDE，可以跳过本节的剩余部分。\n\n**Linux:** 每个发行版都提供 GNU C++ 编译器——通常已安装（参见 第 B.1 节 中的简短介绍）。假设我们把程序命名为\
  \ `hello42.cpp`；可以使用命令轻松编译：\n\n```bash\ng++ hello42.cpp\n```\n\n遵循上世纪的传统，生成的二进制文件默认命名为\
  \ `a.out`。有一天我们可能会有多个程序，那时我们可以使用输出标志配合更有意义的名字：\n\n```bash\ng++ hello42.cpp -o hello42\n\
  ```\n\n我们还可以使用构建工具 `make`（参见 7.2.1 节 概述），它提供了构建二进制文件的默认规则。因此，我们可以调用：\n\n```bash\n\
  make hello42\n```\n\n`make` 会在当前目录查找同名的源文件。它会找到 `hello42.cpp`，由于 `.cpp` 是 C++ 源的标准后缀，它将调用系统的默认\
  \ C++ 编译器。编译完成后，我们可以在命令行调用：\n\n```bash\n./hello42\n```\n\n我们的二进制文件不需要其他软件即可执行，我们可以将其拷贝到另一个兼容的\
  \ Linux 系统^(1) 并在那里运行。\n\n1. 通常标准库是动态链接的（参见 7.1.4 节），然后在另一个系统中存在是兼容性要求的一部分。\n\n\
  **Windows:** 如果您运行 MinGW，编译方式与 Linux 相同。如果您使用 Visual Studio，则需要创建一个项目。为了开始，最简单的方法是使用控制台应用程序模板，正如\
  \ [`www.cplusplus.com/doc/tutorial/introduction/visualstudio`](http://www.cplusplus.com/doc/tutorial/introduction/visualstudio)\
  \ 所示。当您运行程序时，在控制台关闭之前，您可能只有几毫秒时间读取输出。(2) 要将读取阶段延长到一秒，只需插入非移植的命令 `Sleep(1000);` 并包含\
  \ `<windows.h>`。使用 C++11 或更高版本，等待阶段可以移植地实现：\n\n```cpp\nstd::this_thread::sleep_for(std::chrono::seconds\
  \ (1));\n```\n\n2. 自 VS 2019 起，在包含 `<chrono>` 和 `<thread>` 后，控制台将自动暂停。\n\n\n\n\n\
  \n# IDE\n\n`IDE`：像本书中的示例这类短程序可以使用普通的编辑器轻松处理。在较大的项目中，建议使用集成开发环境（IDE）来查看函数的定义或使用位置、显示代码内文档、在整个项目范围内搜索或替换名称等。KDevelop\
  \ 是由 KDE 社区提供的用 `C++` 编写的免费 IDE。它可能是 Linux 上效率最高的 IDE，并且与 `git`、`subversion` 和 `CMake`\
  \ 集成得良好。Eclipse 是用 Java 开发的，速度明显较慢。然而，最近人们在改进 C++ 支持方面投入了大量精力，许多开发者在使用它时效率非常高。Visual\
  \ Studio 是一个非常稳健的 IDE，允许在 Windows 下进行高效开发，在较新版本中还支持 `CMake` 项目的集成。\n\n寻找最高效的环境需要一些时间、实验，而且当然取决于个人和协作的口味。因此，它也会随着时间的推移而演变。\n\
  \n## 1.2 变量\n\nC++ 是一种强类型语言（与许多脚本语言相比）。这意味着每个变量都有一个类型，且该类型永远改变。变量通过以类型开头的语句声明，后面跟着变量名以及可选的初始化——或者它们的列表：\n\
  \n```\nint    i1= 2;              // 仅为了可读性对齐\n\nint    i2, i3= 5;\n\nfloat  pi=\
  \ 3.14159;\n\ndouble x= -1.5e6;          // -1500000\n\ndouble y= -1.5e-6;     \
  \    // -0.0000015\n\nchar   c1= 'a', c2= 35;\n\nbool   cmp= i1 < pi,       // ->\
  \ true\n\n       happy= true;\n```\n\n这里的双斜杠 `//` 开始单行注释；即，从双斜杠到行尾的所有内容都会被忽略。原则上，这就是关于注释唯一真正重要的地方。为了不让你觉得该主题遗漏了某些重要内容，我们将在第\
  \ 1.9.1 节进一步讨论。\n\n### 1.2.1 内建类型\n\nC++ 中最基本的类型是表 1–1 列出的内建类型（Intrinsic Types）。它们是语言的核心部分，始终可用。\n\
  \n**表 1–1：内建类型**\n\n![Images](img/01tab01.jpg)\n\n前五种类型是长度非递减的整数。例如，`int` 的长度至少与\
  \ `short` 一样；也就是说，它通常长但不一定。每种类型的具体长度取决于实现；例如，`int` 可能是 16、32 或 64 位。所有这些类型都可以被限定为\
  \ `signed`（有符号）或 `unsigned`（无符号）。前者对整数（`char` 除外）没有影响，因为它们默认是 `signed` 的。\n\n当我们将整数类型声明为\
  \ `unsigned` 时，将没有负值，但正值数量是两倍（如果考虑零既不是正数也不是负数则多一个）。`signed` 和 `unsigned` 可以被视为名词\
  \ `int` 的形容词，当只声明形容词时，`int` 是默认名词。对于形容词 `short`、`long` 和 `long long` 也是如此。\n\n类型\
  \ `char` 有两种用法：用于字母和较短的数字。除了极奇特的架构外，它的长度几乎总是 8 位。因此，我们可以表示从 -128 到 127（`signed`）或从\
  \ 0 到 255（`unsigned`）的值，并对它们执行整数可用的所有数值操作。当既没有声明 `signed` 声明 `unsigned` 时，使用哪一个取决于编译器的实现。然而当存在大量此类容器时，使用\
  \ `char` 或 `unsigned char` 处理小数字是有用的。\n\n逻辑值最好表示为 `bool`。布尔变量可以存储 `true` 和 `false`。\n\
  \n非递减长度属性同样适用于浮点数：`float` 比 `double` 短或等长，而 `double` 又比 `long double` 短或等长。典型的尺寸通常为：`float`\
  \ 为 32 位，`double` 为 64 位，`long double` 为 128 位。\n\n### 1.2.2 字符与字符串\n\n如前所述，`char`\
  \ 类型可以用于存储字符：\n\n```\nchar c= 'f';\n```\n\n我们还可以表示任何代码能放入 8 位的字母。它甚至可以与数字混合；例如，取决于字母的底层编码，`'a'\
  \ + 7` 通常会导致 `'h'`。我们强烈建议不要玩这种花样，因为潜在的混淆可能会导致可感知的时间浪费。\n\n从 C 语言中，我们继承了将字符串表示为 `char`\
  \ 数组的机会。\n\n```\nchar name [8]= \"Herbert\";\n```\n\n这些旧的 C 字符串都以作为 `char` 值的二进制\
  \ 0 结尾。如果缺少 0，算法将继续运行，直到找到下一个带有 0 字节的内存位置。另一个大风险是向字符串追加内容：`name` 没有额外的空间，额外的字符会覆盖某些其他数据。对于这些旧字符串，要正确处理所有的字符串操作——而不损坏内存或截断较长的字符串——这绝非易事。因此，我们强烈建议除了用于字面量外，否则不要使用它们。\n\
  \nC++ 编译器区分单引号和双引号：`'a'` 是 `char`，而 `\"a\"` 是一个 `char` 数组。C++11 引入了 `string` 类，要方便得多：\n\
  \n```cpp\n#include <string>\n\nint main()\n\n{\n    std::string name= \"Herbert\"\
  ;\n}\n```\n\nC++ 字符串使用动态内存并管理它。因此如果我们如果我们它追加更多文本，就不需要担心内存损坏或截断：\n\n```cpp\nname\
  \ = name + \", cool\";\n```\n\nC++14 引入了字符串字面量运算符，允许我们通过后缀 `s` 指定文本应视为 `string`。\n\
  \n### 1.2.3 变量声明\n\n**建议**\n\n尽可能晚声明变量，通常在第一次使用之前，并且尽可能在可以初始化的时候。\n\n这使得程序增长时更具可读性。它还允许编译器在嵌套作用域中更有效地使用内存。\n\
  \nC++11 的 `auto` 可以为我们推导变量的类型，例如：\n\n```cppauto i4 = i3 + 7;\n```\n\n`i4` 的类型与 `i3\
  \ + 7` 相同，即 `int`。虽然类型是自动确定的，但保持不变，赋值给 `i4` 的内容都将转换为 `int`。我们稍后会看到 `auto` 在高级编程中有用。对于本节中的简单变量声明，通常显式声明类型更好。`auto`\
  \ 将在第 3.4 节中进行详细讨论。\n\n### 1.2.4 常量\n\n语法上，常量就像 C++ 中具有额外常量属性特殊变量：\n\n```cpp\nconst\
  \ int    ci1 = 2;\n\nconst int    ci3;                // 错误：没有值\n\nconst float \
  \ pi= 3.14159;\n\nconst char   cc= 'a';\n\nconst bool   cmp = ci1 < pi;\n```\n\n\
  \n\n\n由于它们无法被更改，因此必须在声明时设置它们的值。第二个常量声明违反了这一规则，编译器将不会容忍这种行为。\n\n常量可以使用任何允许变量的地方——当然，只要它们不被修改。另一方面，像上面那常量在编译期间就已经确定。这使得许多优化成为可能，而且常量甚至可以作为类型的参数（我们稍后将在\
  \ §5.1.4 中回到这一点）。\n\n## 1.2.5 字面量\n\n像 `2` 或 `3.14` 这样的字面量也是类型的。简单来说，整数根据位数被处理为\
  \ `int`、`long` 或 `unsigned long`。任何带有点或指数的数字（例如 `3e12` ≡ 3· 10¹²）都应被视为 `double`。\n\
  \n其他类型的字面量可以通过添加下表中的后缀来编写：\n\n![Images](img/007tab01.jpg)\n\n在大多数情况下，没有必要显式声明字面量的类型，因为内置数值类型之间的隐式转换（也称为\
  \ `Coercion`）通常会将值设定为程序员预期的结果。\n\n然而，我们应该关注字面量类型有四个主要原因。\n\n**可用性：** 标准库提供了一种用于复数的类型，其中实部和虚部的类型可以由用户参数化：\n\
  \n```\nstd :: complex <float> z (1.3, 2.4), z2;\n```\n\n不幸的是，操作仅在类型本身与其底层实数类型之间提供（此处不进行参数转换）。4。结果是，我们无法将\
  \ `z` 与 `int` 或 `double` 相乘，但可以与 `float` 相乘：\n\n```\nz2= 2 * z;       // Error:\
  \ no int * complex<float>\n\nz2= 2.0 * z;     // Error: no double * complex<float>\n\
  \nz2= 2.0f * z;    // Okay:  float * complex<float>\n```\n\n4。然而，混合算术是可以实现的，如 [19]所示。\n\
  \n**歧义性：** 当函数针对不同参数类型重载时（§1.5.4），像 `0` 这样的参数可能会产生歧义，而像 `0u` 这样的限定参数可能存在唯一匹配。\n\n\
  **准确性：** 当我们使用 `long double` 时会出现准确性问题。由于非限定字面量是 `double`，在将其赋值给 `long double` 变量之前，可能会丢失数字：\n\
  \n```\nlong double third1 = 0.3333333333333333333;     // may lose digits\n\nlong\
  \ double third2 = 0.3333333333333333333l;    // accurate\n```\n\n**非十数字：** 以零开头的整数字面量被解释为八进制数，例如：\n\
  \n```\nint o1= 042;         // int o1= 34;\n\nint o2= 084;         // Error! No\
  \ 8 or 9 in octals!\n```\n\n十六进制字面量可以通过以前 `0x` 或 `0X` 前缀来编写：\n\n```\nint h1= 0x42;\
  \        // int h1= 66;\n\nint h2= 0xfa;        // int h2= 250;\n```\n\nC++14 C++14\
  \ 引入了二进制字面量，以 `0b` 或 `0B` 为前缀：\n\n```\nint b1= 0b11111010;  // int b1= 250;\n```\n\
  \nC++14 为了提高长字面量的可读性，C++14 允许我们使用单引号分隔数字：\n\n```\nlong              d=   6'546'687'616'861'129l;\n\
  \nunsigned long     ulx= 0x139'ae3b'2ab0'94f3;\n\nint               b=   0b101'1001'0011'1010'1101'1010'0001;\n\
  \nconst long double pi=  3.141'592'653'589'793'238'462l;\n```\n\nC++17 自 C++17 起，我们甚至可以编写十六进制浮点字面量：\n\
  \n```\nfloat  f1= 0x10.1p0f; // 16.0625\n\ndouble d2= 0x1ffp10;  // 523264\n```\n\
  \n对于这些字面量，指数是强制性的——因此在第一个示例中我们需要 `p0`。由于后缀 `f`，`f1` 是存储值为 16¹+16^(–1) = 16.0625\
  \ 的 `float`。这些字面量涉及三个基数：伪尾数是 2 的幂缩放的十六进制，而指数以十进制数字给出。因此，`d2` 是 512。\n\n\n\n\n\n\
  ```\nunsigned u3= {3};\n\nint      i2= {2};\n\nunsigned u4= {i2};    // 转换错误：没有负值\n\
  \nint      i3= {u3};    // 转换错误：并非所有大值均可用\n```\n\n`signed int` 和 `unsigned int`\
  \ 类型的大小相同，但每个类型的值都能在另一种类型中表示。\n\n## 1.2.7 作用域\n\n作用域决定了（非静态）变量和常量的生命周期以及可见性，有助于建立程序的结构。\n\
  \n### 1.2.7.1 全局定义\n\n我们在程序中使用的每个变量都必须在代码更早的地方通过其类型说明符进行声明。变量可以位于全局作用域或局部作用域。全局变量在所有函数之外声明。声明后，可以在代码的任何地方引用全局变量，即使是在函数内部。这起初听起来非常方便，因为使得变量易于获取，但当你的软件规模扩大时，跟踪全局变量的修改将变得困难且痛苦。在某个时刻，任何代码更改都可能引发连锁反应般的错误崩塌。\n\
  \n**建议**\n\n不要使用全局变量。\n\n如果你确实使用了它们，迟早会后悔的，因为它们可以从整个程序访问，因此跟踪全局变量在何处、何时以及如何被更改是非常繁琐的。\n\
  \n全局常量如\n\n```\nconst double pi= 3.14159265358979323846264338327950288419716939;\n\
  ```\n\n这些常量是可以的，因为它们不会产生副作用。\n\n### 1.2.7.2 局部定义\n\n局部变量在函数体内声明。它的可见性/可用性局限于其声明所在的\
  \ `{ }` 封闭块。更精确地说，变量的作用域从它的声明开始，到声明块的右括号结束。\n\n如果我们在 `main` 函数中定义 `π`：\n\n```\n\
  int main ()\n\n{\n\n    const double pi= 3.14159265358979323846264338327950288419716939;\n\
  \n    std::cout ≪ \"pi is \" ≪ pi ≪ \".\\n\";\n\n}\n```\n\n变量 `π` 只存在于 `main` 函数中。我们可以在函数内部以及其他块内部再次定义块：\n\
  \n```\nint main ()\n\n{\n\n    {\n\n        const double pi= 3.14159265358979323846264338327950288419716939;\n\
  \n    }\n\n    std::cout ≪ \"pi is \" ≪ pi ≪ \".\\n\"; // 错误：pi 超出作用域\n\n}\n```\n\
  \n在这个示例中，`π` 的定义被限于函数内的块，因此在函数其余部分的输出是一个错误：\n\n```\n>>pi<< is not defined in this\
  \ scope.\n```\n\n因为 `π` *超出作用域 (Out of Scope)*。\n\n### 1.2.7.3 隐藏\n\n当同名变量存在于嵌套作用域中时，只有一个变量是可见的。内部作用域中的变量会隐藏外层作用域中的同名变量（在许多编译器中会产生警告）。例如：\n\
  \n```\nint main ()\n\n{\n\n    int a= 5;            // 定义 a#1\n\n    {\n\n     \
  \   a= 3;            // 赋值 a#1，a#2 尚未定义\n\n        int a;           // 定义 a#2\n\n\
  \        a= 8;            // 赋值 a#2，a#1 被隐藏\n\n        {\n\n            a= 7;  \
  \      // 赋值 a#2\n\n        }\n\n    }                    // a#2 作用域结束\n\n    a=\
  \ 11;               // 赋值给 a#1 (a#2 超出作用域)\n\n    return 0;\n\n}\n```\n\n由于隐藏机制，我们必须区分变量的生命周期和可见性。例如，`a#1`\
  \ 从声明一直存到 `main` 函数结束。然而，它只从声明处可见到 `a#2` 的声明处，之后在包含 `a#2` 的块闭合后再次可见。事实上，可见性是生命周期减去被隐藏的时间。在同一个作用域内两次定义相同的变量名是一个错误。\n\
  \n作用域的优点是，我们不需要担心变量是否已经在作用域外的某个地方定义过了。它只是被隐藏了，并没有产生冲突。不幸的是，隐藏使得外层作用域中的同名变量不可访问。我们可以在某种程度上通过巧妙的重命名来应对。然而，管理嵌套和访问的更好解决方案是命名空间（namespaces）；见第\
  \ 3.2.1 节。\n\n`static` 变量是法则的例外：它们一直生存到执行结束，但仅在作用域内可见。我们担心在这个阶段对其进行详细介绍的干扰多于帮助，因此将讨论推迟到了\
  \ A.2.1 节。\n\n与宏相反，后者是 C 中一种过时且鲁莽的遗留特征，应该不惜代价地避免，因为它破坏了所有的结构和可靠性。\n\n## 1.3 运算符\n\
  \nC++ 拥有丰富的内置运算符。有不同类型的运算符：\n\n– 计算型：\n\n 算术：`++`, `+`, `*`, `%`\n\n– 布尔：`<`, `!=`\n\
  \n– 逻辑：`&&` 和 `||`\n\n– 位运算：`~`, `≪`, `≫`, `^`, `|`\n\n– 赋值：`=` `+=`\n\n– 程序流：`?:`,\
  \ `,`\n\n– 内存处理：`new` 和 `delete`\n\n– 访问：`.`, `->`\n\n– 类型处理：`dynamic_cast`, `typeid`,\
  \ `sizeof`\n\n– 错误处理：`throw`\n\n本节将提供运算符的概述。某些运算符在别处描述。在本节末尾，你将找到优先级表。\n\n第一类操作是递增和递减。这些操作可以增加或减少数字\
  \ 1。由于它们改变数字的值，因此对变量是有效的。可寻数据项的技术术语是 *左值 (lvalue)*（更正式的表达见附录 C-1）。在 C.2 节中，我们将提供一个完整的列表。\n\
  \n### 1.3.1 算术运算符\n\n表 1–2 列出了 C++ 中可用的算术运算符。我们按照它们的优先级进行了排序，但让我们逐一查看。\n\n**表 1–2：算术运算符**\n\
  \n![Images](img/01tab02.jpg)\n\n第一类操作是递增和递减。这些操作可以增加或减少数字 1。由于它们改变数字的值，对变量是有效的，而不是对临时结果，例如：\n\
  \n```\nint i= 3;\n\ni++; // i 现在是 4\n\nconst int j= 5;\n\nj++; // 错误：j 是常量\n\n(3\
  \ + 5)++; // 错误：3 + 5 只是临时值\n```\n\n简单来说，递增和递减操作需要是可以修改且可寻的。在我们上面的代码段中，只有 `i` 是这样的。相反，`j`\
  \ 是常量而 `3 + 5` 不可寻。两种符号（前缀和后缀）对变量的效果都是加减 1。递增递减表达式的值对于前缀和后缀运算符是不同的：前缀运算符返回修改后的值，而后缀返回旧值，例如：\n\
  \n```\nint i= 3, j= 3;\n\nint k= ++i + 4; // i 是 4, k 是 8\n\nint l= j++ + 4; //\
  \ j 是 4, l 是 7\n```\n\n最后，`i` 和 `j` 都是 4。但在计算 `l` 时使用的是 `j` 的旧值，而第一次加法使用了已经递增的 `i`\
  \ 值。\n\n\n\n\n通常情况下，最好避免在数学表达式中使用自增和自减运算符，而是将其替换为 `j+1` 等，或者单独执行自增/自减操作。当数学表达式没有**副作用**时，人类读者更容易理解，编译器也更容易进行优化。我们很快就会看到原因（见§1.3.12](#ch01.xhtml_sec1_3_12)）。\n\
  \n一元负号将数值取反：\n\n```cpp\nint i= 3;\nint j= -i;       // j 为 -3\n```\n\n一元加号对标准类型没有算术影响。对于用户类型，我们可以定义一元加和负号的行为。如表\
  \ 1–2 所示，这些一元运算符的优先级与预增和预减相同。\n\n运算符 `*` 和 `/` 自然是乘法和除法，它们定义在所有数值类型上。当除法的两个操作数都是整数时，结果的小数将被截断（向零舍入）。运算符\
  \ `%` 返回整数除法的余数。因此，两个操作数都应该是整数类型。\n\n最后但同样，两个变量或表达式之间的运算符 `+` 和 `-` 代表加法和减法。\n\n\
  操作的语义细节——结果如何舍入或如何处理溢出——在语言中并没有规定。出于性能考虑，C++ 通常将这些交留给底层硬件。\n\n通常，一元运算符的优先级高于二元运算符。在同时应用后置和前缀一元表示的少数情况下，后置表示的优先级高于前缀表示。\n\
  \n在二元运算符中，我们拥有在数学中已知的行为：乘法和除法优先于加减，且操作是左结合的，即：\n\n```cpp\nx - y + z\n```\n\n始终被解释为\n\
  \n```cpp\n(x - y) + z\n```\n\n有一点非常重要记住：操作数的求值顺序是没有定义的。例如：\n\n```cpp\nint i= 3,\
  \ j= 7, k;\nk= f(++ i) + g(++ i) + j;\n```\n\n在这个示例中，结合性保证了第一次加法在第二次加法之前执行。但表达式\
  \ `f(++i)` 还是 `g(++i)` 先计算取决于编译器的实现。因此，`k` 可能是 `f(4) + g(5) + 7` 或 `f(5) + g(4)\
  \ + 7`（当两个自增操作在函数调用之前都执行时，甚至可能是 `f(5) + g(5) + 7`）。此外，我们不能假设结果在不同平台上是相同的。通常情况下，在表达式内部修改值是危险的。虽然它在某些条件下有效，但我们始终必须对其测试并高度关注。总的来说，我们最好花时间输入几个额外的字母并单独进行修改。关于此主题的更多信息请见第\
  \ 1.3.12 节。\n\n⇒ `c++03/num_1.cpp`\n\n通过这些运算符，我们可以编写第一个（完整的）数值程序：\n\n```cpp\n#include\
  \ <iostream>\n\nint main ()\n{\n    const float r1= 3.5, r2 = 7.3, pi = 3.14159;\n\
  \    float area1 = pi * r1*r1;\n    std::cout << \"A circle of radius \" << r1 <<\
  \ \" has area \"\n              << area1 << \".\" << std::endl;\n    std::cout <<\
  \ \"The average of \" << r1 << \" and \" << r2 << \" is \"\n              << (r1\
  \ + r2) / 2 << \".\" << std::endl;\n}\n```\n\n当二元操作的操作数类型不同时，一个或两个操作数将根据§C.3 中的规则自动转换（强制转换）为公共类型。\n\
  \n转换会导致精度丢失。浮点数优于整数，显然将 64 位的 `long` 转换为 32 位的 `float` 会导致精度损失；即使 32 位的 `int` 也不能总是正确表示为\
  \ 32 位的 `float`，因为指数需要某些位。还有某些情况，目标变量可以持有正确的结果，但精度已经在中间计算中丢失了。为了说明这种转换行为，让我们来看下面的示例：\n\
  \n```cpp\nlong l=  1234567890123;\nlong l2= l + 1.0f - 1.0;   // 不精确\nlong l3= l\
  \ + (1.0f - 1.0); // 正确\n```\n\n这在作者的平台上导致：\n\n```\nl2 = 1234567954431\nl3 = 1234567890123\n\
  ```\n\n在 `l2` 的情况下，我们由于中间转换而丢失了精度，而 `l3` 是正确计算的。这确实是一个人为的示例，但你应该意识到中间结果不精确的风险。特别是在进行大型计算时，必须仔细选择数值算法以防止误差积累。幸运的是，不准确的问题在下一节中不会困扰我们。\n\
  \n### 1.3.2 布尔运算符\n\n布尔运算符是逻辑和关系运算符。它们都返回 `bool` 值。它们在表 1–3 中按优先级列出。\n\n关系运算符位于所有算术运算符之前。注意比较不能这样链式：\n\
  \n```cpp\nbool in_bound= min <= x <= max; // 语法错误\n```\n\n相反，我们需要更冗长的逻辑归约。布尔运算符还有\
  \ `&&`、`||` 和 `!` 等关键字。甚至还有用于赋值的关键字，如 `!=`。\n\n### 1.3.3 位运算符\n\n运算符允许我们测试或操作整数类型的位。它们对于系统编程很重要，但对于应用开发没那么重要。表\
  \ 1–4 按优先级列出了这些运算符。\n\n操作 `x << y` 将 `x` 的位左移 `y` 位。相反，`x >> y` 将 `x` 的位右移 `y` 次。在大多数情况下（负符号\
  \ `signed` 值外），向右移动的是 0，这取决于实现。\n\n### 1.3.4 赋值\n\n对象（可修改的左值）的值可以通过赋值来设置：\n\n```cpp\n\
  object= expr;\n```\n\n当类型不匹配时，如果可能，`expr` 将转换为 `object` 的类型。赋值是右结合的，因此可以在表达式中将值连续赋值给多个对象：\n\
  \n```cpp\no3= o2= o1= expr;\n```\n\n\n\n说到赋值，作者现在将解释为什么他将赋值符号左对齐。大多数二进制运算符在意义上是对称的，因为两个操作数都是值。相比之下，赋值的左侧必须有一个可修改的变量，而右侧可以是任意表达式（带有适当的值）。虽然其他语言使用非对称的符号（例如\
  \ Pascal 中的 `:=`），但作者在 `C++` 中使用了非对称的间距。\n\n复合赋值运算符对左侧的对象和右侧的操作数进行算术或位运算；例如，以下两个操作是等价的：\n\
  \n```\na+= b;         // 对应于\n\na=  a + b;\n```\n\n所有赋值运算符的优先级都低于任何算术或位运算，因此右侧表达式总会在复合赋值之前被求值：\n\
  \n```\na*= b + c;     // 对应于\n\na= a * (b + c);\n```\n\n赋值运算符列在表 1–5 中。它们都是右右结合的，且优先级相同。\n\
  \n### 1.3.5 程序流\n\n有三个运算符用于控制程序流。首先，`C++` 中的函数调用被处理为一种运算符。有关函数及其调用的详细描述，请参见第 1.5\
  \ 节。\n\n**表 1–5：赋值运算符**\n\n![Images](img/01tab05.jpg)\n\n条件运算符 `c ? x:y` 求值条件 `c`，当其为真时，表达式值为\
  \ `x`，否则为 `y`。它可以作为 `if` 分支的替代，特别是在只允许表达式不允许语句的地方；参见第 1.4.3.1 节。\n\n`C++` 中一个非常特殊的运算符是逗号运算符，它提供了顺序求值。它的含义只是先求值逗号左侧的子表达式，然后求值右侧。整个表达式的值是右子表达式的值：\n\
  \n```\n3 + 4, 7 * 9.3\n```\n\n表达式的结果是 65.1，在这种情况下，第一个子表达式的计算完全无关。子表达式也可以包含逗号运算符，因此可以定义任意长度的序列。借助逗号运算符，人们可以在只允许一个表达式的程序位置求值多个表达式。一个典型的例子是在\
  \ `for`-循环中多个索引的递增（§1.4.4.2）：\n\n```\n++i, ++j\n```\n\n当用函数参数使用时，逗号表达式需要圆括号；否则逗号会被解释为函数参数的分隔符。\n\
  \n### 1.3.6 内存处理\n\n`new` 和 `delete` 运算符分别分配和释放内存。我们将它们的描述推迟到第 1.8.2 节，因为在谈论指针之前讨论这些运算符是没有意义的。\n\
  \n### 1.3.7 访问运算符\n\n`C++` 提供了几个运算符用于访问子结构、引用（即获取变量的地址）以及解引用（即访问地址所指向的内存）。它们列在表\
  \ 1–6 中。我们将在介绍指针和类之后，在第 2.2.3 节中演示如何使用它们。\n\n**表 1–6：访问运算符**\n\n![Images](img/01tab06.jpg)\n\
  \n### 1.3.8 类型处理\n\n处理类型的运算符将在第 5 章中介绍，那时我们将编写作用于类型的编译时程序。现在我们仅将它们列在表 1–7 中。\n\n\
  **表 1–7：类型处理运算符**\n\n![Images](img/01tab07.jpg)\n\n注意，当 `sizeof` 运算符用于表达式时，它是唯一不需要括号即可应用的运算符。`alignof`\
  \ 是 `C++11` 引入的；其他所有运算符自 `C++98` 起就已经存在。\n\n### 1.3.9 错误处理\n\n`throw` 运算符用于指示执行中的异常（例如内存不足）；参见第\
  \ 1.6.2 节。\n\n### 1.3.10 重载\n\n`C++` 的一个非常强大的方面是程序员可以为新类型定义运算符。这将在第 2.7 节中解释。内置类型的运算符不能更改。然而，我们可以定义内置类型与新类型的交互；即我们可以重载混合操作，如\
  \ `double` 乘以 `matrix`。大多数运算符都可以重载。异常是：\n\n| `::` | 作用域解析； |\n| `.` | 成员选择； |\n\
  | `.*` | 通过指针选择成员； |\n| `?:` | 条件； |\n| `sizeof` | 类型或对象的大小； |\n| `sizeof...` |\
  \ 参数个数； |\n| `alignof` | 类型或对象的内存对齐；以及 |\n| `typeid` | 类型标识符 |\n\n`C++` 中的运算符重载赋予了我们很大的自由。我们将在\
  \ 2.7 回到主题。\n\n### 1.3.11 优先级\n\n表 1–8 提供了运算符的简要概述。花些时间思考运算符优先级、子表达式类型和求值顺序是一个很好的思维练习。\n\
  \n**表 1–8：优先级**\n\n![Images](img/01tab08.jpg)\n\n### 1.3.12 避免副作用！\n\n“疯狂：反复做同样的事情并期望不同的结果。”\n\
  ——未知^(7)\n\n在带有副作用的应用中，期望不同的结果并不是疯狂的。相反，对于组件相互干扰的程序，其行为非常难以预测。此外，一个结果错误的确定性程序比偶然得到正确结果的程序要好。\n\
  \n副作用正确纳入的例子是标准库中的字符串拷贝函数 `strcpy`。该函数获取源和目标第一个字符的指针并复制后续字符直到找到零。这可以使用一个单循环来实现，拷贝和递增作为循环测试的副作用完成：\n\
  \n```\nwhile (*tgt++= *src++);\n```\n\n看起来很可怕吗？确实如此。尽管如此，这是完全合法的 `C++` 代码，某些编译器在严格模式下可能会抱怨。让我们想点简单的：我们将值\
  \ `i` 赋值给数组的第 `i` 个元素，并为下次迭代增加 `i` 的值：\n\n```\nv[i]= i++;    // C++17 之前是未定义行为\n\
  ```\n\n看起来没问题。在 C++17 之前，此表达式的行为是未定义的。为什么？`i` 的后置递增保证我们分配 `i` 的旧值并在之后增加 `i`。然而，这个递增可以在表达式\
  \ `v[i]` 被求值之前执行，导致我们可能将 `i` 赋值给 `v[i+1]`。嗯，这在 C++17 中被修复了，要求赋值右侧的整个表达式在评估左侧之前必须完成。这并不意味着在此期间所有未定义行为都消失了。以下这个令人讨厌的表达式仍然是未定义的：\n\
  \n```\ni = ++i + i++;\n```\n\n\n\n最后的几个例子应该让你产生这样的印象：副作用并不总是一眼一眼就能显而易见的。一些非常棘手的东西可能有效，但许多更简单的东西却可能无效。更糟糕的是，某些代码可能会运行一段时间，直到有人在不同的编译器上编译它，或者你使用的编译器新版本更改了某些实现细节。\n\
  \n第一个代码片段是优秀编程技巧的示例，也证明了运算符优先级是合理的——不需要括号。尽管如此，这种编程风格并不适用于现代 C++。尽可能缩短代码的渴望可以追溯到早期\
  \ C 时代，那时候的打字要求更高，使用的是机械性多于电子性能的打字机，并且有打孔器，而且没有显示器。在今天的技术下，多输入几个字母不应该是问题。\n\n这种简练的拷贝实现的另一个不利方面是不同关注点的混合：测试、修改和遍历。软件设计中的一个重要概念是`关注分离`（Separation\
  \ of Concerns）。它有助于增加灵活性并降低复杂性。在这种情况下，我们想要降低理解实现所需的心理过程的复杂度。将该原则应用于臭名昭彰的单行拷贝，可以得到：\n\
  \n```cpp\nfor (; *src; tgt++, src++)\n    *tgt= *src;\n*tgt= *src; // 拷贝最后的 0\n\
  ```\n\n现在，我们可以清晰地区分这三个关注点：\n\n1. 测试：`*src`\n2. 修改：`*tgt= *src;`\n3. 遍历：`tgt++, src++`\n\
  \n同样明显的是，增加操作是在指针上进行的，而测试和赋值是在它们指向的内容上进行的。实现没有以前那么紧凑，但检查正确性要容易得多。建议让非零测试更明显一些（`*src\
  \ != 0`）。\n\n有一类编程语言被称为`函数式语言`（Functional Languages）。这些语言中的值一旦设定就无法更改。C++ 显然不是那样。但当我们尽可能合理地以函数式风格编程时，我们是在为自己大大忙。例如，当我们写一个赋值时，唯一应该改变的是赋值符号左侧的变量。为此，我们必须将突变操作替换为常量表达式：例如，将\
  \ `++i` 替换为 `i+1`。没有副作用的右侧表达式有助于我们理解程序行为，并让编译器更容易优化代码。经验法：更易理解的程序具有更好的优化潜力。话虽如此，`const`\
  \ 声明不仅保护我们免受意外修改，它们也是实现更多优化的简单方法。\n\n### 1.4 表达式与语句\n\nC++ 区分了表达式和语句。随口来说，我们可以说每个表达式只要加上一个分号就变成了一个语句。然而，我们想更深入地讨论这个话题。\n\
  \n#### 1.4.1 表达式\n\n让我们从下而上递归地构建它。任何变量名（`x`, `y`, `z`, ... )）、常量或字面量都是表达式。一个或多个表达式由运算符组合在一起构成一个表达式，例如\
  \ `x + y` 或 `x * y + z`。在某些语言（如 Pascal）中，赋值是一个语句。在 C++ 中，它是一个表达式，例如 `x = y + z`。结果是它可以在另一个赋值中使用：`x2=\
  \ x= y + z`。赋值从右到左求值。输入和输出操作，例如\n\n```cpp\nstd::cout << \"x is \" << x << \"\\n\"\
  \n```\n\n也是表达式。\n\n带有表达式参数的函数调用是一个表达式，例如 `abs(x)` 或 `abs(x * y + z)`。因此，函数调用是可以嵌套的：`pow(abs(x),\
  \ y)`。注意，如果函数调用是语句，那么嵌套是不可能的。\n\n由于赋值是一个表达式，它可以用作函数的参数：`abs(x= y)`。或者像上面的 I/O 操作，例如：\n\
  \n```cpp\nprint(std::cout << \"x is \" << x << \"\\n\", \"I am such a nerd !\");\n\
  ```\n\n不言而喻，这并不特别可读，它造成的混乱比做某些实用的事情更多。被括号包围的表达式也是表达式，例如 `(x + y)`。由于这种分组优先于所有运算符，我们可以更改求值顺序以适应我们的需求：`x\
  \ * (y + z)` 先计算加法。\n\n#### 1.4.2 语句\n\n上述任何表达式后跟着一个分号都是语句，例如：\n\n```cpp\nx= y +\
  \ z;\ny= f(x + z) * 3.5;\n```\n\n像这样的语句\n\n```cpp\ny + z;\n```\n\n是被允许的，尽管它（通常）没有任何效果。在程序执行期间，会计算\
  \ `y` 和 `z` 的和然后将其丢弃。最近的编译器会优化掉这种用的计算。然而，不能保证这种语句总是可以省略。如果 `y` 或 `z` 是用户定义类型的对象，那么加法也是用户定义的，并且可能会改变\
  \ `y` 或 `z` 或其他东西。这显然是糟糕的编程风格（隐藏副作用），但在 C++ 中是合法的。\n\n单个分号是一个空语句，因此我们可以在表达式后面放置任意数量的分号。某些语句不以分号结束，例如函数定义。如果在此类语句后面加上分号，它不是错误，只是多了一个空语句。尽管如此，某些编译器在严谨模式（pedantic\
  \ mode）下会打印警告。任何用大括号包围的语句序列都是语句——被称为`复合语句`（Compound Statement）。\n\n我们见过的变量和常量声明也是语句。除了条件运算符外，程序流由语句控制。在这里我们将区分分支和循环。\n\
  \n#### 1.4.3 分支\n\n在本节中，我们将介绍允许我们在程序执行中选择分支的不同特性。\n\n##### 1.4.3.1 `if`-语句\n\n这是最简单的形式，其意义直观上很清楚，例如：\n\
  \n```cpp\nif (weight > 100.0)\n    cout << \"This is quite heavy.\\n\";\nelse\n\
  \    cout << \"I can carry this.\\n\";\n```\n\n通常，`else` 分支不需要，可以省略。假设我们在变量 `x`\
  \ 中有一个值并对其进行某些计算：\n\n```cpp\nif (x < 0.0)\n    x= -x;\n// 现在我们知道 x >= 0.0（后置）\n\
  ```\n\n`if`-语句的分支是作用域，使得以下语句出错：\n\n```cpp\nif (x < 0.0)\n    double absx= -x;\n\
  else\n    double absx= x;\n\ncout << \"|x| is \" << absx << \"\\n\"; // 错误：absx\
  \ 作用域外\n```\n\n上面我们引入了两个新变量 `absx`。它们并不冲突，因为它们位于不同的作用域中。它们在 `if`-语句之后都不存在，因此在最后一行访问\
  \ `absx` 是错误的。事实上，在分支中声明的变量只能在该分支内使用。\n\n每个 `if` 分支由一个单一语句组成。为了执行多次操作，我们可以使用大括号，如下例实现卡丹诺方法的示例：\n\
  \n```cpp\ndouble D= q*q/4.0 + p*p*p/27.0;\n\nif (D > 0.0) {\n    double z1= ...;\n\
  \    complex<double> z2 = ..., z3= ...;\n    ...\n} else if (D == 0.0) {\n    double\
  \ z1= ..., z2= ..., z3= ...;\n    ...\n} else {                  // D < 0.0\n  \
  \  complex<double> z1= ..., z2= ..., z3= ...;\n    ...\n}\n```\n\n在开始，始终编写大括号是有帮助的。许多风格指南也强制对单一语句使用大括号，而作者倾向于不使用大括号。无论如何，强烈建议对分支进行缩进以提高可读性。\n\
  \n\n\n\n`if`-语句可以嵌套，而每个 `else` 都与上一个打开的 `if` 关联。如果你对示例感兴趣，请查看 Section A.2.2。最后，我们为你提供了以下内容：\n\
  \n### 建议\n\n虽然空格在 C++ 中不影响编译，但缩进应该反映程序的结构。理解 C++ 并且能够自动缩进的编辑器（如 Visual Studio 的\
  \ IDE 或 C++ 模式下的 `emacs`）对结构化编程有很大帮助。当语言感知工具（language-aware tool）中的某行代码缩进不符合预期时，很可能是其没有按照意图进行嵌套。\n\
  \n⇒ `c++17/if_init.cpp`\n\n#### C++17 \n\n`if`-语句在 C++17 中得到了扩展，可以初始化一个变量，其作用范围仅限于该\
  \ `if`-语句。这有助于控制变量的生命周期；例如，插入 `map` 的结果（参见 Section 4.1.3.5）是对新条目的的一种引用，如果插入成功，则返回一个\
  \ `bool`：\n\n```\nmap <string, double> constants= {{\"e\", 2.7}, {\"pi\", 3.14}};\n\
  \nif (auto res = constants.insert({\"h\", 6.6e-34}); res.second)\n\n    cout ≪ \"\
  inserted\" ≪ res.first->first ≪ \" mapping to \"\n\n         ≪ res.first->second\
  \ ≪ endl;\n\nelse\n\n    cout ≪ \"entry for \" ≪ res.first->first ≪ \" already exists.\\\
  n\";\n```\n\n我们本可以在 `if`-语句之前声明 `res`，它将一直存在到周围块的结束——除非我们在变量声明和 `if`-语句周围加上了额外的大括号。\n\
  \n#### 1.4.3.2 条件表达式\n\n尽管本节描述的是语句，但我们仍然倾向于在这里讨论条件表达式，因为它与 `if`-语句非常接近。结果的结果\n\n\
  ```\ncondition ? result_for_true : result_for_false\n```\n\n当 `condition` 结果为 `true`\
  \ 时，结果为第二个子表达式（即 `result_for_true`），否则为 `result_for_false`。例如，\n\n```\nmin= x <=\
  \ y ? x : y;\n```\n\n对应于以下 `if`-语句：\n\n```\nif (x <= y)\n\n    min= x;\n\nelse\n\
  \n    min= y;\n```\n\n对于初学者来说，第二个版本可能更具读性，而经验丰富的程序员通常更倾向于第一种形式，因为它简洁。\n\n`?:` 是一个表达式，因此可以用于初始化变量：\n\
  \n```\nint x= f(a),\n\n    y= x < 0 ? -x : 2 * x;\n```\n\n使用该运算符调用带有多个选择参数的函数很容易：\n\
  \n```\nf(a, (x < 0 ? b : c), (y < 0 ? d : e));\n```\n\n但用 `if`-语句来实现就相当笨拙。如果你不信，可以试一试。\n\
  \n在大多数情况下，使用 `if` 还是条件表达式并不重要。所以，请使用你觉得最方便的方法。\n\n**轶事：** 一个在 `if` 和 `?:` 之间选择产生差异的例子是标准模板库（STL）中的\
  \ `replace_copy` 操作，§4.1。它以前是用条件运算符实现的，而 `if` 则会稍微通用一些。这个“错误”大约隐藏了 10 年未被发现，直到 Jeremy\
  \ Siek 的博士论文中通过自动分析才检测出来 [57]。\n\n#### 1.4.3.3 `switch` 语句\n\n`switch` 类似于一种特殊的\
  \ `if`。当对整数值的不同用例执行不同的计算时，它提供了一种简洁的表示法：\n\n```\nswitch(op_code) {\n\n  case 0: z=\
  \ x + y; break;\n\n  case 1: z= x - y; cout ≪ \"compute diff\\n\"; break;\n\n  case\
  \ 2:\n\n  case 3: z= x * y; break;\n\n  default: z= x / y;\n\n}\n```\n\n一个有点令人惊讶的行为是，除非我们用\
  \ `break` 终止，否则后续 case 的代码也会执行。因此，在我们的示例中，case 2 和 case 3 执行了相同的操作。在 `g++` 和 `clang++`\
  \ 中，使用 `-Wimplicit-fallthrough` 会为没有 `break` 的（非空）case 生成编译器警告。\n\nC++17 为了避免此类警告并告知共同开发者贯穿（fall-through）是有故意的，C++17\
  \ 引入了 `[[fallthrough]]` 属性：\n\n```\nswitch(op_code) {\n\n  case 0: z= x + y; break;\n\
  \n  case 1: z= x - y; cout ≪ \"compute diff\\n\"; break;\n\n  case 2: x= y; [[fallthrough]];\n\
  \n  case 3: z= x * y; break;\n\n  default: z= x / y;\n\n}\n```\n\nC++17 同样增加了在 `switch`-语句中初始化变量的能力，方式与\
  \ `if` 相同。\n\n`switch` 的高级用法可以在 Appendix A.2.3 中找到。\n\n#### 1.4.4 循环\n\n##### 1.4.4.1\
  \ `while` 和 `do-while`\n\n正如名称所示，`while` 循环只要条件成立就会重复执行。让我们实现 **Algorithm 1:**\n\
  \n![Images/026equ1) 如果不考虑溢出，定义如下：\n\n```\nint x=1;\n\nwhile (x != 1) {\n\n    cout\
  \ ≪ x ≪ '\\n';\n\n    if (x % 2 == 1) // 奇数\n        x= x + 1;\n\n    else     \
  \             // 偶数\n        x= 2;\n\n}\n```\n\n与 `if`-语句类似，`do-while` 的条件在最后测试：\n\
  \n```\ndouble eps = 0;\n\ndo {\n\n    cout ≪ \"eps= ≪ eps ≪ '\\n';\n\n    eps/=2;\n\
  \n} while ( eps > 0 );\n```\n\n##### 1.4.4.2 `for` 循环\n\nC++ 中常见的循环是 `for`。头部由三个部分组成：\n\
  \n1. 初始化\n2. *条件*\n3. 步进操作\n\n初始化部分通常声明变量。为了保持一致，我们始终对循环索引使用自增。初学者一个非常常见的错误是编写类似\
  \ `i <= size()` 的条件。由于 C++ 的索引是从 0 开始的，`i == size()` 已经超出了范围。具有 Fortran 或 MATLAB\
  \ 经验的人需要时间来适应零索引。从 1 开始的索引对许多人来说更自然，用于数学文献。\n\n作为另一个例子，我们喜欢计算指数函数的泰勒级数：\n\n![Images/028equ1)\n\
  \n计算到第十项：\n\n```\ndouble x=2.0 , xn=1.0 , exp_x=1.0;\n\nunsigned long fac=1;\n\n\
  for (unsigned long n= 1; n <= 10; ++n) {\n\n    xn*= x;\n\n    fac*= n;\n\n    exp_x+=\
  \ xn / fac;\n\n    cout ≪ \"e^x is \" ≪ exp_x ≪ '\\n';\n\n}\n```\n\n在这里，单独计算第 0\
  \ 项并从第一项开始循环更简单。我们还使用了小于等于以确保 *x*¹⁰/10! 被考虑在内。对于 `int` 等内置类型，写 `++i` 还是 `i++` 没有区别。但对于用户类型是有区别的，因为后置自增会导致不必要的拷贝；参见\
  \ 3.2.5。\n\n`for` 循环在 C++ 中非常灵活。初始化部分可以是任何表达式、变量声明，或为空。可以引入多个相同类型的新变量。这可以避免在条件中重复执行相同的操作，例如：\n\
  \n```\nfor (int i= begin (xyz), e= end (xyz); i < e; ++ i) ...\n```\n\n在初始化中声明的变量仅在循环内部可见，并会隐藏循环外部的同名变量。\n\
  \n\n条件可以是任何可以转换为 `bool` 的表达式。空条件始终为 `true`，循环将无限重复。我们仍然可以在循环体内终止循环，这将在第 1.4.4.4\
  \ 节 中讨论。我们已经提到过，循环索引通常在 `for` 的第三个子表达式中递增。原则上，我们也可以在循环体内修改它。然而，如果在循环头部进行此操作，程序会清晰得多。另一方面，并没有限制只能有一个变量增加\
  \ 1。我们可以使用逗号运算符（§1.3.5）以及任何所需的修改来修改任意数量的变量，例如：\n\n```cpp\nfor (int i= 0, j= 0, p=\
  \ 1; ...; ++i , j += 4, p *= 2) ...\n```\n\n这显然比只有一个循环索引要复杂，但它仍然比在循环之前或循环体内部声明/修改索引更具可读性。\n\
  \n### C++11 1.4.4.3 基于范围的 `for`-循环\n\n这种名为基于范围的 `for`-循环的特性提供了一种非常紧凑的表示。当我们学习迭代器概念（§4.1.2）时，我们会介绍更多背景。\n\
  \n目前，我们将其视为遍历数组或其他容器中所有元素的简洁形式：\n\n```cpp\nint primes[]= {2, 3, 5, 7, 11, 13, 17,\
  \ 19};\n\nfor (int i : primes)\n    std::cout ≪ i ≪ \" \";\n```\n\nC++20 这将打印由空格分隔的数组中的质数。在\
  \ C++20 中，我们可以在基于范围的循环初始化 `primes`：\n\n```cpp\nfor (int primes[]= {2, 3, 5, 7, 11,\
  \ 13, 17, 19}; int i : primes)\n    std::cout ≪ i ≪ \" \";\n```\n\n### 1.4.4.4 循环控制\n\
  \n有两个语句可以偏离常规循环评估：\n\n1. `break`\n2. `continue`\n\n`break` 会完全终止循环，而 `continue`\
  \ 仅结束当前迭代并继续执行下一次迭代，例如：\n\n```cpp\nfor (...; ...; ...) {\n    ...\n    if (dx ==\
  \ 0.0)\n        continue;\n    x+= dx;\n    ...\n    if (r < eps)\n        break;\n\
  \    ...\n}\n```\n\n在上面的示例中，我们假设当 `dx == 0.0` 时不需要迭代的剩余。在某些迭代计算中，在迭代中间（此处为 `r <\
  \ eps` 时）可能会清楚所有工作已经完成。\n\n### 1.4.5 `goto`\n\n所有的分支和循环内部都是通过跳转实现的。C++ 提供了名为 `goto`\
  \ 的显式跳转。然而：\n\n**建议**\n\n不要使用 `goto`！永远不要！绝对不要！\n\n`goto` 的适用性在 C++ 中比在 C 中更受（例如，我们不能跳过初始化）；它仍然具有破坏程序结构的能力。\n\
  \n不使用 `goto` 编写软件被称为结构化编程。然而，这个术语现在很少使用了，因为这在高质量软件中被认为是理所当然的。\n\n### 1.5 函数\n\n\
  函数是 C++ 程序的重要构建模块。我们看到的第一个例子是你好世界程序中的 `main` 函数。我们将在第 1.5.5 节中多介绍一些关于 `main`。\n\n\
  ### 1.5.1 参数\n\nC++ 区分了两种传递参数的形式：按值传递和引用传递。\n\n#### 1.5.1.1 值传递\n\n当我们向函数传递参数时，它默认会创建一个副本。例如，以下函数增加了\
  \ `x`，但这种对外部世界不可见：\n\n```cpp\nvoid increment (int x)\n{\n    x ++;\n}\n\nint main()\n\
  {\n    int i= 4;\n    increment(i);        // 没有增加 i\n    cout ≪ \"i is \" ≪ i ≪\
  \ '\\n';\n}\n```\n\n输出是 4。操作 `x++` 仅增加了 `increment` 函数内部 `i` 的局部副本，而没有增加 `i` 本身。这种参数传递被称为按值传递（Call\
  \ by Value 或 Pass by Value）。\n\n#### 1.5.1.2 引用传递\n\n为了修改函数参数，我们必须引用传递参数：\n\n```cpp\n\
  void increment (int& x)\n{\n    x ++;\n}\n```\n\n现在变量本身被增加了，输出将如预期的为 5。我们将在 §1.8.4\
  \ 中更详细讨论引用。\n\n临时变量——例如操作的结果——不能通过引用传递：\n\n```cpp\nincrement (i + 9); // 错误：临时变量不可引用\n\
  ```\n\n为了将表达式传递给此函数，我们必须先将其存储在变量中并传递该变量。显然，在临时变量上修改函数本身没有意义，因为我们永远看不到修改的影响。\n\n\
  较大的数据结构几乎总是通过引用传递，以避免昂贵的拷贝：\n\n```cpp\ndouble two_norm(vector& v)\n```\n\n与 `const`\
  \ 引用相反，常量引用允许传递临时变量：\n\n```cpp\ndouble two_norm(const vector& v)\n```\n\n#### 1.5.1.3\
  \ 默认参数\n\n如果参数通常具有相同的值，我们可以为其声明一个默认值。假设我们实现了一个计算次方根的函数，大部分是平方根，那么我们可以写：\n\n```cpp\n\
  double root(double x, int degree= 2) { ... }\n```\n\n此函数可以使用一个或两个参数调用：\n\n```cpp\n\
  x= root (3.5, 3);\ny= root (7.0);     // 相当于 root(7.0,  2)\n```\n\n我们可以声明多个默认值，但只能在参数列表的最后。换句话说，在一个具有默认值的参数之后不能有没有默认值的参数。\n\
  \n默认值在添加额外参数时也有帮助。假设我们有一个画圆的函数：\n\n```cpp\ndraw_circle(int x, int y, float radius);\n\
  ```\n\n这些圆都是黑色的。后来，我们增加了颜色：\n\n```cpp\ndraw_circle(int x, int y, float radius, color\
  \ c= black);\n```\n\n得益于默认参数，我们不需要重构应用程序，因为三个参数的 `draw_circle` 调用仍然有效。\n\n### 1.5.2\
  \ 返回结果\n\n在早期的示例中，我们只返回 `double` 或 `int`。这些是良好的 `return` 类型。现在我们来看极端情况：大型数据或无数据。\n\
  \n### 1.5.2.1 返回大型数据结构\n\n\n\n计算大型数据结构新值的函数要困难得多。关于细节，我们稍后会介绍，这里仅提到这些选项。好消息是，编译器足够智能，在很多情况下可以省略返回值的拷贝；参见第\
  \ 2.3.5.3 节。此外，移动语义（第 2.3.5 节）通过“窃取”临时变量的数据在上述省略不适用时避免了拷贝。高级库通过一种名为“表达式模板”（expression\
  \ templates）的技术完全避免了返回大型数据结构，并将计算推迟到确定结果存储位置为止（第 5.3.2 节）。无论如何，我们绝不能返回局部函数变量的引用（第\
  \ 1.8.6 节）。\n\n## 1.5.2.2 返回空\n\n在语法上，每个函数都必须返回某些内容，即使没有内容可以返回。这种困境通过命名为 `void`\
  \ 的类型来解决。例如，仅仅打印 `x` 的函数没有结果：\n\n```\nvoid print_x(int x)\n{\n    std::cout << \"\
  The value x is \" << x << '\\n';\n}\n```\n\n`void` 不是一个真正的类型，而更像是一个占位符，允许我们省略返回数值。我们无法定义\
  \ `void` 对象：\n\n```cpp\nvoid nothing;     // 错误：没有 void 对象\n```\n\n`void` 函数可以提前结束：\n\
  \n```cpp\nvoid heavy_compute(const vector& x, double eps, vector& y)\n{\n    for\
  \ (...) {\n        ...\n        if (two_norm(y) < eps)\n            return;\n  \
  \  }\n}\n```\n\n使用不带参数的 `return`。在 `void` 函数中返回内容将是一个错误。在 `return` 语句中唯一可以出现的内容是另一个\
  \ `void` 函数的调用（作为调用加空 `return` 的快捷方式）。\n\n## 1.5.3 内联\n\n调用函数是非常开销的：必须存储寄存器、将参数拷贝到栈上等。为了避免这种开销，编译器可以内联（`inline`）函数调用。在这种情况下，函数调用被替换为函数包含的操作。程序员可以使用适当关键字请求编译器这样做：\n\
  \n```cpp\ninline double square(double x) { return x*x; }\n```\n\n然而，编译器并没有义务执行 `inline`。相反，如果这看起来对性能有益，它也可以在没有关键字的情况下对函数进行内联。`inline`\
  \ 声明仍然有其用途：用于将函数包含在多个编译单元中，我们将在第 7.2.3.2 节中讨论这一点。\n\n## 1.5.4 重载\n\n在 C++ 中，只要参数声明足够不同，函数就可以共享相同的名称。这被称为函数重载（Function\
  \ Overloading）。让我们先看一个例子：\n\n```cpp\n#include <iostream>\n#include <cmath> \n\n\
  int divide(int a,  int b) {\n    return a / b ;\n}\n\nfloat divide(float a, float\
  \ b) {\n    return std::floor( a / b ) ;\n} \n\nint main() {\n    int   x= 5, y=\
  \ 2;\n    float n= 5.0 , m= 2.0;\n    std::cout << divide (x, y) << std::endl;\n\
  \    std::cout << divide (n, m) << std::endl;\n    std::cout << divide (x, m) <<\
  \ std::endl; // 错误：歧义\n}\n```\n\n在这里我们定义了两次 `divide` 函数：分别带有 `int` 和 `float` 参数。当我们调用\
  \ `divide` 时，编译器执行重载解析（Overload Resolution）：\n\n1. 是否存在精确匹配参数类型的重载？如果是，则采用；否则：\n\
  2. 转换后是否存在匹配的重载？有多少个？\n- 0: 错误：未找到匹配的函数。\n- 1: 采用。\n- > 1: 错误：调用歧义。\n\n这如何应用于我们的示例？`divide(x,\
  \ y)` 和 `divide(n, m)` 是精确匹配。对于 `divide(x, m)`，没有重载是精确匹配，且通过隐式转换都能匹配，因此它是歧义的。\n\n\
  “隐式转换”一词需要一些解释。我们已经看到语言的数值类型可以相互转换。如示例所示，这些都是隐式转换。当我们以后定义自己的类型时，可以实现从另一种类型到该类型的转换，反之也可以从我们的新类型到现有类型的转换。\n\
  \n⇒ `c++11/overload_testing.cpp`\n\n更正式地表述，函数重载在签名（Signature）上必须不同。在 C++ 中，签名由以下部分组成：\n\
  \n- 函数名；\n- 参数个数称为元（Arity）；以及\n- 参数类型（按它们各自的顺序）。\n\n相比，仅在 `return` 类型或参数名称上变化的重载具有相同的签名，并被视为（禁止的）重复定义：\n\
  \n```cpp\nvoid f(int x) {}\nvoid f(int y) {} // 重定义：仅参数名不同\nlong f(int x) {} //\
  \ 重定义：仅返回类型不同\n```\n\n名称或元数不同的函数是不同的，这不言而喻。`inline` 声明的存在仍然有其用途：用于将函数包含在多个编译单元中，我们将在第\
  \ 7.2.3.2 节中讨论这一点。\n\n## 1.5.5 main 函数\n\n`main` 函数与任何函数没有本质区别。标准允许两种签名：\n\n```cpp\n\
  int main ()\n```\n\n或者\n\n```cpp\nint main (int argc, char* argv [])\n```\n\n后者等于：\n\
  \n```cpp\nint main(int argc, char** argv)\n```\n\n参数 `argv` 参数列表，`argc` 是其长度。第一个参数（`argv[0]`）在大多数系统中是执行文件的名称（可能与源代码不同）。为了测试参数，我们可以写一个名为\
  \ `argc_argv_test` 的程序：\n\n```cpp\nint main (int argc, char* argv[])\n{\n    for\
  \ (int i= 0; i < argc; ++i)\n        cout << argv[i] << '\\n';\n    return 0;\n\
  }\n```\n\n使用以下选项调用该程序：\n\n```\nargc_argv_test first second third fourth\n```\n\n\
  产生：\n\n```\nargc_argv_test\nfirst\nsecond\nthird\nfourth\n```\n\n可以看到，命令行中的每个空格都会分割参数。`main`\
  \ 函数返回一个整数作为退出码，表示程序是否正确结束。返回 0（或 `<cstdlib>` 中的宏 `EXIT_SUCCESS`）表示成功，其他任何值表示失败。在\
  \ `main` 函数中省略 `return` 语句是标准的。在这种情况下，会自动插入 `return 0;`。更多细节请见附录 A.2.4。\n\n## 1.6\
  \ 错误处理\n\n“错误在你拒绝纠正它之前不是错误。”\n\n——Orlando Aloysius Battista\n\nC++ 中处理意外行为两种主要方法是断言和异常。前者用于检测编程错误，后者用于防止程序正常运行的异常情况。坦率地说，这两者的区别并不总是明显的。\n\
  \n### 1.6.1 断言\n\n来自头文件 `<cassert>` 的宏 `assert` 继承自 C 但仍然很有用。它评估一个表达式，当结果为 `false`\
  \ 时，程序立即终止。它应该用于检测编程错误。假设我们实现了一个计算非负实数平方根的酷算法。那么从数学上知道结果是非负的。否则我们的计算出了问题：\n\n\n\n\
  \n\n```cpp\n# include <cassert>\n\ndouble square_root(double x)\n{\n    check_somehow(x\
  \ >= 0);\n    ...\n    assert(result >= 0.0);\n    return result;\n}\n```\n\n如何实现初始检查目前尚未开放。当我们的结果为负数时，程序执行将打印如下错误信息：\n\
  \n```\nassert_test: assert_test.cpp:10: double square_root(double):\nAssertion 'result\
  \ >= 0.0' failed.\n```\n\n断言要求我们的结果必须大于或等于零；否则我们的实现包含一个 bug，必须在将此函数用于正式应用程序之前修复它。\n\
  \n在修复 bug 之后，我们可能会想要删除断言。我们不应该这样做。也许在某一天我们会更改实现方式；届时我们仍然拥有所有的完整性测试在运行。事实上，对后置条件的断言在某种程度上类似于微单元测试。\n\
  \n`assert` 的一个巨大优势是我们可以通过简单的宏定义让它完全消失。在包含 `<cassert>` 之前，我们可以定义 `NDEBUG`：\n\n```\n\
  #define NDEBUG\n#include <cassert>\n```\n\n然后所有的断言都会被禁用；即它们不会在可执行文件中引起任何操作。与其每次在调试模式和发布模式之间切换时修改程序源码，不如在编译器标志中声明\
  \ `NDEBUG`（通常在 Linux 上使用 `-D`，在 Windows 上使用 `/D`）更好且干净：\n\n```\ng++ my_app.cpp -o\
  \ my_app -O3 -DNDEBUG\n```\n\n在关键内核中带有断言的软件如果在发布模式下没有禁用断言，速度可能会慢一倍以上。像 `CMake` 这样良好的构建系统会在发布模式的编译标志中自动激活\
  \ `-DNDEBUG`。由于断言可以很容易被禁用，我们应该遵循这条建议：\n\n### 防御性编程\n\n尽可能测试许多属性。\n\n即使你确定某个属性对于你的实现来说显然成立，也要写一个断言。有时系统的行为并不完全如我们假设的那样，或者编译器可能有\
  \ bug（极罕见但并非不可能），或者我们所的操作与最初意图略有不同。无论我们进行多少推论、实现实现多么多么仔细，早晚都会触发某个断言。如果需要检查的属性太多，以至于代码中实际功能不再清晰可见，可以将测试外包到另一个函数中。\n\
  \n负责任的程序员会实现大量的测试。尽管如此，这并不能保证程序在所有情况下都能运行。一个应用程序可能完美运行多年，然后在某天突然崩溃。在这种情况下，我们可以开启所有断言并在调试模式下运行，在大多数情况下，它们对找到崩溃原因有很大帮助。然而，这要求崩溃的情况是可复的，并且程序在较慢的调试模式下合理时间内到达关键区域。\n\
  \n### 1.6.2 异常\n\n在前节中，我们查看了断言如何帮助我们检测编程错误。然而，有很多即使是最聪明的编程也无法防止的关键情况，例如我们需要读取但被删除的文件。或者我们的程序需要的内存超过了实际机器上的内存。其他问题在理论上是可以的，但实际付出的努力不成比例，例如，检查矩阵是否正则是行的，但其工作量可能与实际任务相当甚至更多。在这种情况下，尝试完成任务并在过程中检查\
  \ `Exceptions`（异常）通常更高效。\n\n#### 1.6.2.1 动机\n\n在阐述旧式错误处理之前，我们介绍了我们的反英雄 Herbert^(11)，他是一位天才数学家，认为编程是一种必要的恶，用以展示他的算法运行得多么完美。他对现代编程中那些新奇的胡闹完全不免疫。\n\
  \n11。致所有名叫 Herbert 的读者：请接受我们对使用了你们的名字的诚意道歉。\n\n他最喜欢的处理计算问题的方法是返回错误代码（如 `main` 函数所的那样）。假设我们要从文件中读取一个矩阵并检查文件是否真的存在。如果没有，我们返回错误代码\
  \ 1：\n\n```cpp\nint read_matrix_file(const char* fname, matrix& A)\n{\n    fstream\
  \ f(fname);\n    if (!f.is_open())\n        return 1;\n        ...\n    return 0;\n\
  }\n```\n\n因此，他检查了可能发生的一切错误并用相应的错误代码通知调用者。当调用者评估错误并做出相应反应时，这是没问题的。但如果调用者简单地忽略了他的返回值会发生什么？什么都没有！程序会继续运行，并可能以后在荒谬的数据上崩溃，或者更糟的是可能会产生无意义的结果，粗心的人可能会用这些结果制造汽车或飞机。当然，汽车和飞机的制造者不会那么粗心，但在更真实的软件中，即使是细心的人也无法关注每一个微细节。\n\
  \n尽管如此，将这种推理带给像 Herbert 这样的编程恐龙可能无法说服他们：“你不仅蠢到向我那完美实现的函数传递一个不存在的文件，而且你甚至不检查返回值。你什么都做错了，不是我。”\n\
  \n通过 C++17，我们获得了一点点安全性。它引入了属性 `[[nodiscard]]` 来表示返回返回值不应被丢弃：\n\n```cpp\n[[nodiscard]]\
  \ int read_matrix_file(const char* fname, matrix& A)\n```\n\n结果是每个忽略返回值的调用都会导致警告，通过额外的编译器标志，我们可以将此警告转换为错误。相反，仅仅将返回值赋值给变量就已经视为使用了，无论我们之后是否触碰该变量。错误代码的另一个缺点是我们无法返回计算结果而必须将其作为参数传递。这阻止了我们使用表达式构建结果。反过来的方法是返回结果并将错误代码作为函数参数，这并不比之前的更麻烦。所以别纠结于错误代码了。现在让我们看看异常是如何工作的。\n\
  \n#### 1.6.2.2 抛出\n\n处理问题的更好方法是 `throw`（抛出）异常：\n\n```cpp\nmatrix read_matrix_file(const\
  \ std::string& fname)\n{\n    fstream f(fname);\n    if (!f.is_open())\n       \
  \ throw \"Cannot open file.\";\n    ...\n}\n```\n\nC++ 允许我们抛出任何异常：字符串、数字、用户类型等等。然而，为了正确处理异常，最好定义异常类型或使用标准库中的：\n\
  \n```cpp\nstruct cannot_open_file {};\n\nmatrix read_matrix_file(const std::string&\
  \ fname)\n{\n    fstream f(fname);\n    if (!f.is_open())\n        throw cannot_open_file{};\n\
  \n    matrix A;\n    // 填充 A（可能抛出异常）\n    return A;\n}\n```\n\n在这里，我们引入了自己的异常类型。在第\
  \ 2 章中，我们将详细解释如何定义类。之前的示例中，我们定义了一个空类，只需要大括号后跟一个分号。大型项目通常建立整个异常类型层次结构，这些类型通常派生 (第\
  \ 6 章) 自 `std::exception`。\n\n#### 1.6.2.3 捕获\n\n为了对异常做出反应，我们必须 `catch`（捕获）它。这在\
  \ `try`-`catch`-块中完成。在我们示例中，我们为无法打开的文件抛出了异常，现在我们可以捕获它：\n\n```cpp\ntry {\n    A=\
  \ read_matrix_file (\"does_not_exist.dat\");\n} catch (const cannot_open_file& e)\
  \ {\n    // 在这里我们可以处理它，希望如此。\n}\n```\n\n\n\n\n我们可以在块中编写多个 `catch` 子句，以便在一个地方处理不同类型的异常。在引入类和继承后，详细讨论这个问题将意义得多。因此，我们将其推到\
  \ 第 6.1.5 节。\n\n## 1.6.2.4 处理异常\n\n简单的处理是将将其委托给调用者。这通过什么都不做（即不使用 `try`-`catch` 块）来实现。\n\
  \n我们也可以捕获异常，提供信息丰富的错误消息并终止程序：\n\n```\ntry {\n    A= read_matrix_file (\"does_not_exist.dat\"\
  );\n\n} catch (const cannot_open_file& e) {\n\n    cerr ≪ \"Hey guys, your file\
  \ does not exist! I'm out.\\n\";\n\n    exit(EXIT_FAILURE);\n\n}\n```\n\n一旦异常被捕获，问题就被认为已经解决，执行将在\
  \ `catch` 块之后继续。要终止执行，我们使用了来自头文件 `<cstdlib>` 的 `exit`。`exit` 函数在不在 `main` 函数中也能结束执行。它应该只在进一步执行太危险，且没有希望调用函数对该异常有任何办法时使用。\n\
  \n或者，我们可以在抱怨或部分补救措施后通过重新抛出异常来继续，这可能会稍后处理：\n\n```\ntry {\n    A= read_matrix_file(\"\
  does_not_exist.dat\");\n\n} catch (const cannot_open_file& e) {\n\n    cerr ≪ \"\
  O my gosh, the file is not there! Please caller help me.\\n\";\n\n    throw;\n\n\
  }\n```\n\n在我们的情况下，我们已经在 `main` 函数中，且调用堆栈上没有其他函数可以捕获我们的异常。忽略异常可以通过空块轻松实现：\n\n```cpp\n\
  } catch (cannot_open_file&) {} // File is rubbish, don't care\n```\n\n到目前为止，我们的异常处理并没有真正解决文件缺失的问题。如果文件名是由用户提供的，我们可以一直纠扰他/她，直到得到一个让我们满意的名称：\n\
  \n```cpp\nbool keep_trying= true;\n\ndo {\n    std::string fname;\n\n    cout ≪\
  \ \"Please enter the filename: \";\n\n    cin ≫ fname;\n\n    try {\n        A=\
  \ read_matrix_file(fname);\n\n        ...\n\n        keep_trying = false;\n\n  \
  \  } catch (const cannot_open_file& e)  {\n\n        cout ≪ \"Could not open the\
  \ file. Try another one!\\n\";\n\n    }\n\n} while (keep_trying);\n```\n\n当我们到达\
  \ `try` 块的结尾时，我们知道没有异常抛出，可以结束工作了。否则，我们会进入其中一个 `catch` 块且 `keep_trying` 保持为 `true`。\n\
  \n## 1.6.2.5 异常的优势\n\n当程序遇到无法在检测处解决的问题时，错误处理是必要的（否则显然我们会这样做）。因此，我们必须将此传递给调用函数，希望检测到的问题可以被解决，或者至少以用户接受的方式进行处理。检测问题的函数的直接调用者可能无法处理，问题必须通过多个函数进一步传递到调用堆栈，可能一直传到\
  \ `main` 函数。考虑到这一点，异常相比错误代码具有以下优势：\n\n- 函数接口更清晰。\n- 返回结果而不是错误代码允许函数调用嵌套。\n- 未经处理的错误会立即放弃应用程序，而不是带有损坏数据静默继续。\n\
  - 异常会自动向上调用堆栈传。。\n- 错误代码的显式通信会模糊程序结构。\n\n作者实践中的一个示例涉及 LU 分解。对于奇异矩阵，无法计算 LU 分解。对此无能为力。然而，如果分解是迭代计算的一部分，我们能够以某种方式在没有该分解的情况下继续迭代。虽然使用传统的错误处理也可以实现，但异常允许我们以更易读、更优雅的方式来实现。\n\
  \n我们可以为普通情况编写分解程序，当检测到奇异性时，我们抛出一个异常。然后，取决于调用者如何在相应的语境中处理这种奇异性——如果可能的话。\n\n## C++11\
  \ 1.6.2.6 谁抛出？\n\nC++03 允许指定从函数可以抛出哪些类型的异常。不详细节，这些规范证明并不非常有用，并从 C++11 起被弃用，从 C++17\
  \ 起被移除。\n\nC++11 添加了一个新的限定符，用于指定函数不能抛出异常，例如：\n\n```cpp\ndouble square_root(double\
  \ x) noexcept { ... }\n```\n\n该限定符的用处是调用代码在 `square_root` 之后不需要检查抛出的异常。尽管有该限定符，如果抛出了异常，程序将终止。\n\
  \n在模板函数中，抛出异常取决于参数类型。为了正确处理这一点，`noexcept` 可以取决于编译时条件；参见 第 5.2.2 节。\n\n断言还是异常更优并不是一个简单的问题，我们没有简短的答案。这个问题现在可能不会困扰你。因此，我们将讨论推迟到\
  \ 第 A.2.5 节 并留给你自己。\n\n### C++11 1.6.2.3 静态断言\n\n编译期间就能检测到的程序错误可以使用 `static_assert`\
  \ 引起。在这种情况下，会发出一个错误消息。\n\n```cpp\nstatic_assert(sizeof(int) >= 4, \"int is too small\"\
  );\n\nconst int capacity= 70000;\n```\n\n在这个示例中，我们将 `70000` 存储在 `int` 中。`static_assert`\
  \ 允许我们验证 `sizeof(int)` 是否足够。`static_assert` 的完整威力将在元编程中（第 5 章](#ch05））释放，那里会有更多示例。\n\
  \n### 1.7 I/O\n\nC++ 使用一种称为*流*（streams）的方便抽象在顺序介质（如屏幕或键盘）上执行 I/O 操作。流是一个可以插入或提取字符的对象。标准\
  \ C++ 库包含声明标准输入输出对象的头文件 `<iostream>`。\n\n#### 1.7.1 标准输出\n\n默认情况下，程序的标准输出写入屏幕，我们可以通过名为\
  \ `cout` 的 C++ 流访问它。它配合插入运算符 ≪（类似于左移）。我们已经看到它可以在单个语句中使用多次。这在我们想要打印文本、变量和常量的组合时特别有用，例如：\n\
  \n```cpp\ncout ≪ \"The square root of \" ≪ x ≪ \" is \" ≪ sqrt(x) ≪ endl;\n```\n\
  \n输出类似于\n\n```\nThe square root of 5 is 2.23607\n```\n\n`endl` 产生一个换行符。`endl` 的另一种表示形式是字符\
  \ `\\n`。为了效率考虑，输出可能是缓冲的。在这方面，`endl` 和 `\\n` 不同：前者会刷新缓冲区，而后者不会。在我们调试（不使用调试器）时，刷新可以帮助我们找到程序在哪些输出之间崩溃。相反，当向文件写入大量文本时，每行刷新都会减慢\
  \ I/O。\n\n幸运的是，插入运算符的优先级较低，因此算术操作可以直接编写：\n\n```cpp\nstd :: cout ≪ \"11 * 19 = \"\
  \ ≪ 11 * 19 ≪ std::endl;\n```\n\n所有的比较、逻辑和位运算必须通过圆括号分组。条件运算符也是如此：\n\n```cpp\nstd::cout\
  \ ≪ (age > 65 ? \"I'm a wise guy\\n\" : \"I am still half-baked.\\n\");\n```\n\n\
  当我们忘记圆括号时，编译器会提醒我们（提供一个晦涩的消息供解读）。\n\n#### 1.7.2 标准输入\n\n\n\n\n在 C++ 中，处理标准输入是通过应用重载的提取运算符\
  \ `>>` 完成的。标准输入设备通常是名为 `cin` 的键盘：\n\n```cpp\nint age;\n\nstd::cin >> age;\n```\n\
  \n此命令从输入设备读取字符，并将它们解释为所存储的变量类型（这里是 `int`）的值（这里是 `age`）。键盘的输入在按下 `RETURN` 键后就会被处理。我们还可以使用\
  \ `cin` 请求用户输入多于一个数据输入：\n\n```cpp\nstd::cin >> width >> length;\n```\n\n这等同于\n\n\
  ```cpp\nstd::cin >> width;\n\nstd::cin >> length;\n```\n\n在这两种情况下，用户必须提供两个值：一个用于\
  \ `width`，另一个用于 `length`。它们可以用任何有效的空白分隔符隔开：空格、制表符或换行符。\n\n### 1.7.3 文件的输入/输出\n\n\
  C++ 提供了以下类来执行从/到文件的字符输入和输出：\n\n![Images](img/043tab01.jpg)\n\n我们可以像使用 `cin` 和 `cout`\
  \ 一样使用文件流，唯一的区别是我们必须将这些流与物理文件关联。这是一个示例：\n\n```cpp\n#include <fstream>\n\nint main\
  \ ()\n{\n    std::ofstream square_file;\n\n    square_file.open(\"squares.txt\"\
  );\n\n    for (int i= 0; i < 10; ++i)\n        square_file << i << \"² = \" << i*i\
  \ << '\\n';\n\n    square_file.close();\n}\n```\n\n这段代码创建一个名为 `squares.txt` 的文件（如果它已存在则覆盖它），并向其中写入几——就像向\
  \ `cout` 写入一样。C++ 建立了一个通用的流概念，输出文件和 `std::cout` 都满足这一概念。这意味着我们可以写入可以写入 `std::cout`\
  \ 的文件中，反之亦然。当我们为新类型定义 `operator<<` 时，我们只需对 `ostream` 执行一次（第 2.7.3 节），它将适用于控制台、文件以及任何其他输出流。\n\
  \n或者，我们可以将文件名作为参数传递给流的构造函数以隐式打开文件。当 `square_file` 离开作用范围时，文件也会隐式关闭，在这种情况下是在 `main`\
  \ 函数结束时。上述程序的短版本是：得益于名为 RAII 的强大技术，我们将在第 2.4.2.1 节 中讨论它。\n\n```cpp\n#include <fstream\
  \ >\n\nint main ()\n{\n    std::ofstream square_file{\"squares.txt\"};\n\n    for\
  \ (int i= 0; i < 10; ++ i)\n        square_file << i << \"² = \" << i*i << '\\n';\n\
  }\n```\n\n我们更倾向于短形式（通常如此）。显式形式只有在文件首次声明由于某些原因以后打开时才是必要的。同样，显式的 `close` 仅需要在文件离开作用范围之前关闭。\n\
  \n### 1.7.4 通用流概念\n\n流不仅限于屏幕、键盘和文件；只要一个类派生自 `istream`、`ostream` 或 `iostream` 并提供了这些类函数的实现，它就可以用作流。例如，Boost.Asio\
  \ 提供了 TCP/IP 的流，Boost. IOStream 提供了上述 I/O 的替代方案。标准库包含一个 `stringstream`，它可以从任何可打印类型创建字符串。`stringstream`\
  \ 的方法 `str()` 返回流内部的 `string`。\n\n类的派生方式见第 6 章。我们只需注意到，作为输出流在技术是通过派生自 `std::ostream`\
  \ 实现的。\n\n我们可以通过使用 `ostream` 的可引用作为参数编写接受各种输出流的输出函数：\n\n```cpp\n#include <iostream>\n\
  #include <fstream>\n#include <sstream> \n\nvoid write_something (std::ostream& os)\n\
  {\n    os << \"Hi stream, did you know that 3 * 3 = \" << 3 * 3 << '\\n';\n}\n\n\
  int main (int argc, char * argv[])\n{\n    std::ofstream myfile{\"example.txt\"\
  };\n    std::stringstream mysstream; \n\n    write_something(std::cout);\n    write_something(myfile);\n\
  \    write_something(mysstream); \n\n    std::cout << \"mysstream is: \" << mysstream.str();\
  \ // newline contained\n}\n```\n\n同样，可以用 `istream` 实现通用输入，用 `iostream` 实现读/写 I/O。\n\
  \n### 1.7.5 格式化\n\n⇒ `c++03/formatting.cpp`\n\nI/O 流通过所谓的 I/O 操纵符格式化，这些操纵符位于 `<iomanip>`\
  \ 头文件中。默认情况下，C++ 只打印浮点数的几位。\n\n```cpp\ndouble pi = 3.14159265358979;\ncout << setprecision(16)\
  \ << pi << endl;\n```\n\n输出： \n`3.14159265358979`\n\n(注：原文后续部分包含大量重复的句子，此处已根据要求对核心逻辑内容进行处理。)\n\
  \n\n\n尽管如此，我们不建议使用 `printf`，原因有两个：它不能与用户自定义类型配合，而且它不是类型安全的。格式字符串在运行时解析，而随后的参数通过一种模糊的宏机制进行处理。如果参数与格式字符串不匹配，行为将是未定义的并可能导致程序崩溃。例如，一个字符串被作为指针传递，从所指向的地址开始，字节被读取并打印为\
  \ `char`，直到在内存中找到二进制 `0` 为止。如果我们不小心地尝试将一个 `int` 打印为字符串，该 `int` 值将被误解为一个地址，从该地址开始打印一系列\
  \ `char`。这将导致完全无意义的输出，或者（更有可能）如果地址不可访问则会导致内存错误。我们必须承认，最近的编译器会解析格式字符串（当编译时已知时）并对参数不匹配发出警告。\n\
  \nC++20 中新的 `<format>` 库将格式字符串的表达能力与流 I/O 的类型安全性和用户可扩展性相结合，并增加了在输出中重新排列参数的机会。遗憾的是，截至本书时，即使是最新的编译器（GCC\
  \ 12.0、Clang 13 和 Visual Studio 16.9.6）也不支持 `<format>` 库。因此，我们使用了原型库 `<fmt>`，并避免了盲猜这将如何转换为最终的标准接口。我们强烈建议您在可用的情况下自行将这些示例迁移到\
  \ `<format>`。语法不同，但原理是相同的。\n\n然而，我们看到公告 VS 16.10 将实现完整的库支持。\n\n我们没有使用正式规范，而是从 [`cppreference.com`](http://cppreference.com)\
  \ 将一些 `printf` 示例移植到新格式：\n\n```\nprint(\"Decimal:\\t{} {} {:06} {} {:0} {:+} {:d}\\\
  n\",\n      1, 2, 3, 0, 0, 4, -1);\n\nprint(\"Hexadecimal:\\t{:x} {:x} {:X} {:#x}\\\
  n\", 5, 10, 10, 6);\n\nprint(\"Octal:\\t\\t{:o} {:#o} {:#o}\\n\", 10, 10, 4);\n\n\
  print(\"Binary:\\t\\t{:b} {:# b} {:#b}\\n\", 10, 10, 4);\n```\n\n此代码段打印出：\n\n```\n\
  Decimal:         1 2 000003 0 0 +4 -1\n\nHexadecimal:     5 a A 0x6\n\nOctal:  \
  \         12 012 04\n\nBinary:          1010 0 b1010 0 b100\n```\n\n前两个数字是在没有提供任何格式信息的情况下打印的。当我们使用格式指定符\
  \ `\"{:d}\"` 请求十进制数字时，生成的输出相同。第三个数字的宽度至少为 6 个字符，并用前导 `0` 填充。指定符 `+` 允许我们强制打印所有数字的符号。`printf`\
  \ 允许指定数字的 `unsigned` 输出。当要打印的值为负时，会导致大数字错误。`<format>` 库避免了用户声明 `unsigned` 输出，因为此信息已经包含在相应参数的类型中。如果有人想将负值打印为大正数，他必须显式地进行转换。\n\
  \n第二行演示了我们可以以十六进制打印值——对于大于 9 的数字，大小写形式均可。指定符 `\"#\"` 生成用于十六进制字面量的 `\"0x\"` 前缀。同样地，我们可以以八进制和二进制格式打印值，并选择带有相应的字面量前缀。\n\
  \n对于浮点数，我们有更多的格式选项：\n\n```\nprint(\"Default:\\t{} {:g} {:g}\\n\", 1.5, 1.5, 1e20);\n\
  \nprint(\"Rounding:\\t{:f} {:.0f} {:.22f}\\n\", 1.5, 1.5, 1.3);\n\nprint(\"Padding:\\\
  t {:05.2f} {:.2f} {:5.2 f}\\n\", 1.5, 1.5, 1.5);\n\nprint(\"Scientific:\\t{:E} {:e}\\\
  n\", 1.5, 1.5);\n\nprint(\"Hexadecimal:\\t{:a} {:A}\\n\\n\", 1.5, 1.3);\n```\n\n\
  然后我们得到：\n\n```\nDefault:        1.5 1.5 1e+20\n\nRounding:       1.500000 2 1.3000000000000000444089\n\
  \nPadding:        01.50 1.50 1.50\n\nScientific:     1.500000E+00 1.500000e+00\n\
  \nHexadecimal:    0x1.8p+0 0X1.4 CCCCCCCCCCCCDP+0\n```\n\n使用空括号或仅包含冒号的括号，我们得到默认输出。这对应于格式指定符\
  \ `\"{:g}\"`，并产生与没有操作符的流相同的输出。小数位数可以在点和格式指定符 `\"f\"` 之间给出。指定符 `+` 允许我们强制打印所有数字的符号。`printf`\
  \ 允许指定数字的 `unsigned` 输出。当要打印的值为负时，会导致大数字错误。`<format>` 库避免了用户声明 `unsigned` 输出，因为此信息已经包含在相应参数的类型中。如果有人想将负值打印为大正数，他必须显式地进行转换。\n\
  \n\n\n尽管文件不存在，打开操作也不会失败。我们甚至可以从不存在的文件中读取，程序会继续运行。不用说，`i` 和 `d` 的值是毫无意义的：\n\n```\n\
  i is 1, d is 2.3452 e-310\n```\n\n默认情况下，流不会抛出异常。其原因是历史性的：它们出现得比异常早，后来为了不破坏在此期间编写的软件，一直保留了这种行为。另一个理由是，I/O\
  \ 失败并不是异常情况而是非常常见，因此在（每次操作后）检查错误是理所当然的。\n\n为了确保一切顺利，原则上我们必须在每次 I/O 操作后检查错误标志位。以下程序要求用户输入新文件名，直到能够打开文件为止。在读取内容后，我们再次检查了是否成功：\n\
  \n```\nint main ()\n\n{\n    std::ifstream infile;\n    std::string filename{\"\
  some_missing_file.xyz\"};\n    bool opened= false;\n\n    while (!opened) {\n  \
  \      infile.open(filename);\n\n        if (infile.good()) {\n            opened=\
  \ true;\n        } else {\n            std::cout ≪ \"The file '\"≪ filename\n  \
  \                    ≪ \"' doesn't exist (or can't be opened),\"\n             \
  \         ≪ \"please give a new filename: \";\n            std::cin ≫ filename;\n\
  \        }\n    }\n\n    int i;\n    double d;\n    infile ≫ i ≫ d;\n\n    if (infile.good())\n\
  \        std::cout ≪ \"i is \" ≪ i ≪ \", d is \" ≪ d ≪ '\\n';\n    else\n      \
  \  std::cout ≪ \"Could not correctly read the content.\\n\";\n\n    infile.close();\n\
  }\n```\n\n从这个简单的示例可以看出，使用文件 I/O 编写健壮的应用程序会带来一些工作。如果我们想使用异常，必须在运行时为每个流启用异常：\n\n```\n\
  cin.exceptions(ios_base::badbit | ios_base::failbit);\ncout.exceptions(ios_base::badbit\
  \ | ios_base::failbit);\nstd::ifstream infile(\"f.txt\");\ninfile.exceptions(ios_base::badbit\
  \ | ios_base::failbit);\n```\n\n每当操作失败或流处于“坏”状态时，流就会抛出异常。异常也可能在（意外的）文件末尾抛出。然而，文件末尾通过测试（例如\
  \ `while (!f.eof())`）处理起来更方便。\n\n在在上述示例中，`infile` 的异常仅在打开文件（或尝试打开）后才被启用。为了检查打开操作，我们必须先创建流，然后开启异常，最后显式地打开文件。启用异常至少为我们保证了当程序正常终止时，所有的\
  \ I/O 操作都是成功的。我们可以通过捕获可能的异常来使程序变得更加健壮。\n\n文件 I/O 中的异常只能部分保护我们免于犯错。例如，下面这个小程序显然是错误的（类型不匹配且数字未分离）：\n\
  \n```\nvoid with_io_exceptions(ios& io)\n{ io.exceptions(ios_base::badbit | ios_base::failbit);\
  \ } \n\nint main ()\n{\n    std::ofstream outfile;\n    with_io_exceptions(outfile);\n\
  \    outfile.open(\"f.txt\"); \n    double o1= 5.2, o2= 6.2;\n    outfile ≪ o1 ≪\
  \ o2 ≪ std::endl;  // 没有分离\n    outfile.close(); \n\n    std::ifstream infile;\n\
  \    with_io_exceptions(infile);\n    infile.open(\"f.txt\"); \n    int  i1, i2;\n\
  \    char c;\n    infile ≫ i1 ≫ c ≫ i2;            // 类型不匹配\n    std::cout ≪ \"\
  i1 = \" ≪ i1 ≪ \", i2 = \" ≪ i2 ≪ \"\\n\";\n}\n```\n\n尽管如此，它并没有抛出异常并输出了以下输出：\n\n\
  ```\ni1 = 5, i2 = 26\n```\n\n众所周知，测试不能证明程序的正确性。在涉及 I/O 时这一点更为明显。流输入读取输入的字符并将其作为相应变量类型的值（例如在设置\
  \ `i1` 时为 `int`）。它在第一个不能作为值一部分的字符处停止，对于 `int` 值 `i1`，首先在小数点处停止。如果我们之后读取另一个 `int`，它将失败，因为空字符串无法被解释为\
  \ `int` 值。但我们并没有这样做；相反，我们读取下一个 `char`并将小数点赋值给它。在解析 `i2` 的输入时，我们首先发现了 `o1` 的小数部分，然后是\
  \ `o2` 的整数部分，最后得到了一个不属于 `int` 值的字符。\n\n遗憾的是，在实践中并不是每个违反语法规则的行为会导致异常：`.3` 解析为 `int`\
  \ 会产生零（而下一个输入可能会失败）；`-5` 解析为 `unsigned` 导致产生 `4294967291`（当 `unsigned` 为 32 位时）。窄转换原则显然还没有进入\
  \ I/O 流（即使为了后兼容性以后会进入的话）。\n\n无论如何，应用程序的 I/O 部分需要密切关注。数字必须被正确地分离（例如通过空格），并用相同的类型读取。\n\
  \n### 1.8 数组、指针和引用\n\n#### 1.8.1 数组\n\nC++ 内置的数组具有某些局限性和一些奇怪的行为。尽管如此，我们认为每个 C++\
  \ 程序员应该了解并意识到这些问题。数组的声明如下：\n\n```\nint x[10];\n```\n\n变量 `x` 是一个拥有 10 个 `int` 项的数组。在标准\
  \ C++ 中，数组的大小必须是编译时已常量。某些编译器（例如 `g++`）支持运行时大小。\n\n数组通过方括号访问：`x[i]` 是 `x` 中第 *i*\
  \ 个元素的引用。第一个元素是 `x[0]`；最后一个是 `x[9]`。数组可以在定义时初始化：\n\n```\nfloat v[]={1.0, 2.0, 3.0},\
  \ w[]={7.0, 8.0, 9.0};\n```\n\n在这种情况下，数组的大小会被推导。\n\nC++11 列表初始化禁止值的窄转换。这在实践中很少产生影响。例如，以下代码：\n\
  \n```cpp\nint v []={1.0, 2.0, 3.0};    // C++11 错误：窄转换\n```\n\n在 C++03 中是合法的但在 C++11\
  \ 中不是，因为从浮点数字面量到 `int` 可能会丢失精度。然而，我们根本不会写这种丑的代码。\n\n数组的操作通常在循环中执行；例如，计算 *x* = *v*\
  \ – 3*w* 作为向量操作是通过以下实现的：\n\n```cpp\nfloat x[3];\nfor (int i= 0; i < 3; ++i)\n  \
  \  x[i]= v[i] - 3.0 * w[i];\n```\n\n我们还可以定义高维数组：\n\n\n\n\n\n```cpp\nfloat A[7][9];\
  \     // 一个 7x9 矩阵\n\nint   q[3][2][3];  // 一个 3x2x3 数组\n```\n\n该语言并没有为数组提供线性代数操作。基于数组的实现方式既不优雅又容易出错。例如，一个向量加法的函数看起来如下：\n\
  \n```cpp\nvoid vector_add(unsigned size, const double v1[], const double v2[],\n\
  \                double s[])\n{\n    for (unsigned i= 0; i < size; ++i)\n      \
  \  s[i]= v1[i] + v2[i];\n}\n```\n\n注意，我们将数组的大小作为第一个函数参数传递进去，因为数组参数本身并不包含大小信息。在这种情况下，函数的调用者负责传递数组的正确大小：\n\
  \n```cpp\nint main ()\n{\n    double x[]= {2, 3, 4}, y[] {4, 2, 0}, sum[3];\n  \
  \  vector_add(3, x, y, sum);\n    ...\n}\n```\n\n在传递高维数组时，只有第一维度可以是开放的，而其他维度必须在编译期间已知。然而，这种程序很容易变得棘手，而我们在\
  \ `C++` 中有更好的技术。\n\n由于数组大小在编译期间是知的，我们可以通过将数组的字节大小除以单个条目的字节大小来计算它：\n\n```cpp\nvector_add(sizeof\
  \ x / sizeof x[0], x, y, sum);\n```\n\n使用这种旧式的接口，我们无法测试数组的大小是否匹配。遗憾的是，如今仍在使用这种将大小信息作为函数参数传递的\
  \ `C` 和 `Fortran` 库。它们在用户出现最轻微错误时就会崩溃，追溯崩溃的原因可能需要花费巨大的精力。正因如此，我们将在书中展示如何实现我们自己的更易于使用且更不容易出错的数学软件。希望未来的\
  \ `C++` 标准能带来更多高级的数学支持，特别是一个线性代数库。\n\n数组有以下两个缺点：\n\n1. 在访问数组之前不会检查索引，当程序因分段错误（segmentation\
  \ fault/violation）崩溃时，我们可能会发现自己处于数组范围之外。这甚至不是最糟糕的情况；至少我们能看到出问题了。非法访问还可能破坏我们的数据；程序会继续运行并产生完全错误的结果，产生你可以想象的任何后果。我们甚至可能覆盖程序代码。然后我们的数据就会被解释为机器操作，导致任何可能的荒谬。\n\
  \n2. 数组的大小必须在编译时已知。当我们从文件中读取数据填充数组时，这是一个严重的问题：\n\n```cpp\nifstream ifs(\"some_array.dat\"\
  );\nifs >> size;\nfloat v[size];    // 错误：size 在编译期间未知\n```\n\n某些编译器支持将运行时值作为数组大小。由于这在其他编译器中无法得到保证，因此在可移植软件中应避免这种做法。这一特性曾在\
  \ `C++14` 中被考虑过，但被推迟了（也许永远推迟了），因为在每个平台上都无法解决所有微妙的问题。\n\n当文件中条目的数量变化时，这种方法不起作用。\n\
  \n第一个问题只能通过新的数组类型解决，第二个问题则通过动态分配解决。这引导我们离开了指针。\n\n### 1.8.2 指针\n\n指针是一个包含内存地址的变量。该地址可以是取地址符（例如\
  \ `&x`）提供的另一个变量的地址，也可以是动态分配的内存地址。让我们从后者开始，因为我们正在寻找动态大小的数组。\n\n```cpp\nint* y= new\
  \ int[10];\n```\n\n这分配了一个包含 10 个 `int` 的数组。现在可以在运行时选择大小。我们还可以实现前一节中的向量读取示例：\n\n\
  ```cpp\nifstream ifs(\"some_array.dat\");\nint size;\nifs >> size;\nfloat* v= new\
  \ float[size];\nfor (int i= 0; i < size; ++i)\n    ifs >> v[i];\n```\n\n指针带有与数组相同的危险：访问范围外的数据，这可能导致程序崩溃或静默的数据失效。在处理动态分配的数组时，存储数组的大小是程序的责任。\n\
  \n此外，程序员负责在内存不再需要时释放它。通过以下方式实现：\n\n```cpp\ndelete[] v;\n```\n\n由于数组作为函数参数与指针兼容，第\
  \ 1.8.1 节中的 `vector_add` 函数同样适用于指针：\n\n```cpp\nint main (int argc, char* argv[])\n\
  {\n    const int size= 3;\n    double *x= new double[size], *y= new double[size],\n\
  \           *sum= new double[3];\n    for (unsigned i= 0; i < size; ++i)\n     \
  \   x[i]= i+2, y[i]= 4-2*i;\n    vector_add(size, x, y, sum);\n    ...\n}\n```\n\
  \n使用指针时我们无法使用 `sizeof` 技巧；它只会带给我们指针本身的字节大小，这显然与数组无关。它们唯一的不同之处在于定义处：在大多数情况下，`pointer`\
  \ 不能与 `array` 混淆：`pointer` 可以赋值给 `array` 参数。由于我们从数组开始，在指针使用上，我们在第一步之前走了第二步。\n\n\
  ```cpp\nint* ip= new int;\n```\n\n释放这块内存通过以下方式完成：\n\n```cpp\ndelete ip;\n```\n\n\
  注意分配与释放的对偶性：`单对象分配`需要`单对象释放`，而*数组分配`要求`数组释放`。否则运行时系统可能会错误处理。指针也可以引用其他变量：\n\n```cpp\n\
  int i= 3;\nint* ip2= &i;\n```\n\n运算符 `&` 接收对象并返回其地址。相反运算符是 `*`，它接收地址并返回对象：\n\n```cpp\n\
  int j= *ip2;\n```\n\n这被称为解引用。考虑到运算符的优先级和语法规则，符号 `*` 作为解引用或乘法的含义不会被混淆——至少编译器不会。\n\
  \n`C++11` 未初始化的指针包含一个随机值（取决于相应内存中设置的位）。使用未定义的指针可能会导致任何错误。为了显式表示指针不指向任何内容，我们应该设置为：\n\
  \n```cpp\nint* ip3= nullptr;    // C++11\nint* ip4{};           // 同上\n```\n\n或者在旧编译器中：\n\
  \n```cpp\nint* ip3= 0;           // C++11 及以后不建议这样做\nint* ip4= NULL;        // 同上\n\
  ```\n\n`C++11` 地址 0 保证永远不会用于，因此以这种方式指示指针为空是安全的。然而，字面量 0 无法清晰地传达意图，并在函数重载中引起歧义。宏\
  \ `NULL` 并没有更好：它只是求值为 `0`。\n\n指针指针非常常见的错误是*内存泄漏*。例如，我们的数组 `y` 太小了，我们想要分配一个新的数组：\n\
  \n```cpp\nint* y= new int[10];\n// 一些操作\ny= new int [15];\n```\n\n\n\n\n最初，我们为 10\
  \ 个 `int` 值分配了空间。后来我们需要更多空间，于是分配了 15 个 `int` 位置。但我们之前分配的内存去哪里了？它们仍然在那里，但我们再也无法访问它们。我们甚至无法释放它们，因为这需要该内存块的地址。这部分内存会在程序的剩余执行时间内一直处于状态。只有当程序结束时，操作系统才能释放它。在我们的示例中，在可能拥有的几个\
  \ GB 内存中只丢失了 40 字节。但这种情况发生在迭代过程中，未使用的内存将持续增长，直到在某一个点整个（虚拟）内存被耗尽。\n\n即使浪费的内存对当前应用程序并非至关重要，当我们编写高质量的科学软件时，内存泄漏是不可接受的。当许多人使用我们的软件时，早晚会有人为此批评我们，并最终阻碍其他人使用它。幸运的是，可以使用工具帮助我们发现内存泄漏，如第\
  \ B.3 节 所示。\n\n所展示的指针问题并不是为了成为“乐趣杀手”。我们并不反对使用指针。许多事情只有通过指针才能实现：列表、队列、树、图等。但必须谨慎使用指针，以避免上述提到的所有真正严重的问题。有三种策略可以减少与指针相关的错误：\n\
  \n1. `使用标准容器` 来自标准库或其他经过验证的库。标准库中的 `std::vector` 为我们提供了动态数组的所有功能，包括调整大小和范围检查，并且内存会自动释放。\n\
  \n2. 在类中`封装` 动态内存管理。这样我们只需要为每个类处理一次。^(19) 当由对象分配的所有内存在对象销毁时释放时，无论我们分配内存的频率，并不重要。如果我们有\
  \ 738 个带有动态内存的对象，那么它将被释放 738 次。内存应该在对象的构造函数中分配，在析构函数中释放。这一原则被称为*资源获取即初始化*（RAII）。相比之下，如果我们调用了\
  \ 738 次 `new`（部分在循环和分支中），我们能确定自己恰好调用了 738 次 `delete` 吗？我们知道有工具可以做到这一点，但这些错误最好通过预防\
  \ own 修复。^(20) 当然，封装的想法并不是万无一失的，但正确实现它比在整个程序中到处洒（原始）指针要工作要少得多。我们将在第 2.4.2.1 节 中详细讨论\
  \ RAII。\n\n19。 可以地假设对象的数量远多于类；否则，整个程序的设计就出了问题。\n\n20。 此外，工具只能说明当前运行没有错误，但对于其他输入可能会有所不同。\n\
  \n3. `使用智能指针`，我们将在下一节中介绍（§1.8.3）。\n\n指针有两个用途：\n\n1. 引用对象\n2. 管理动态内存\n\n所谓*原始指针*（Raw\
  \ Pointers）的问题在于，我们无法判断一个指针是仅仅引用数据，还是在不再需要时还负责释放内存。为了在类型级别明确这种区别，我们可以使用*智能指针*。\n\
  \n### C++11 1.8.3 智能指针\n\nC++11 引入了三种新的智能指针类型：`unique_ptr`、`shared_ptr` 和 `weak_ptr`。C++03\
  \ 中已存在的名为 `auto_ptr` 的智能指针通常被认为是通往 `unique_ptr` 的失败尝试，因为当时语言尚未准备好。因此它在 C++17 中被移除。所有智能指针都定义在头文件\
  \ `<memory>` 中。如果你的平台无法 C++11 特（例如在嵌入式编程中），Boost 中的智能指针是一个很好的替代品。\n\n#### C++11\
  \ 1.8.3.1 唯一指针 (Unique Pointer)\n\n该指针的名字表示对所引用数据的*唯一所有权*。它基本上像普通指针一样使用：\n\n```cpp\n\
  #include <memory>\n\nint main ()\n{\n    unique_ptr<double> dp{new double};\n  \
  \  *dp= 7;\n    ...\n    cout << \" The value of *dp is \" << *dp << endl;\n}\n\
  ```\n\n与原始指针的主要区别在于，当指针失效时，内存会自动释放。因此，分配未动态分配的地址是一个错误：\n\n```cpp\ndouble d= 7.2;\n\
  unique_ptr<double> dd{&d}; // 错误：导致非法删除\n```\n\n指针 `dd` 的析构函数将尝试删除 `d`。为了保证内存所有权的唯一性，`unique_ptr`\
  \ 不能被拷贝：\n\n```cpp\nunique_ptr<double> dp2{dp}; // 错误：不允许拷贝\ndp2 = dp;         \
  \          // 同样\n```\n\n然而，我们可以使用 `move` 将内存位置转移到另一个 `unique_ptr`：\n\n```cpp\n\
  unique_ptr<double> dp2{move(dp)}, dp3;\ndp3= move(dp2);\n```\n\n#### C++11 1.8.3.2\
  \ 共享指针 (Shared Pointer)\n\n正如名称所示，`shared_ptr` 管理由方（每个都持有它的指针）共享的内存。一旦不再有 `shared_ptr`\
  \ 引用数据，内存就会自动释放。这可以极大地简化程序，特别是对于复杂的数据结构。一个极其重要的应用领域是并发：当所有线程终止对它的访问时，内存会自动释放。与 `unique_ptr`\
  \ 相比，`shared_ptr` 可以根据需要频繁拷贝，例如：\n\n```cpp\nshared_ptr<double> f()\n{\n    shared_ptr<double>\
  \ p1{new double};\n    shared_ptr<double> p2{new double}, p3= p1;\n    cout << \"\
  p3.use_count() = \" << p3.use_count() << endl;\n    return p3;\n}\n\nint main ()\n\
  {\n    shared_ptr<double> p= f();\n    cout << \"p.use_count() = \" << p.use_count()\
  \ << endl;\n}\n```\n\n在这个示例中，我们为两个 `double` 值分配了内存：在 `p1` 中和 `p2` 中。指针 `p1` 被拷贝到\
  \ `p3`，使得它们指向同一块内存，如图 1–1 所示。\n\n![Images](img/01fig01.jpg)\n\n**图 1–1：内存中的共享指针**\n\
  \n我们可以从 `use_count` 的输出看到这一点：\n\n```\np3.use_count() = 2\np.use_count() = 1\n```\n\
  \n\n\n当 `f` 返回时，指针被销毁，`p2` 所指向的内存被释放（且从未被使用）。第二个分配的内存块仍然存在，因为 `main` 函数中的 `p` 仍然指向它。\n\
  \n如果可能，应该使用 `make_shared` 创建一个 `shared_ptr`：\n\n```cpp\nshared_ptr<double>p1 = make_shared<double>();\n\
  ```\n\n然后，内部数据和用户数据被一起存储在内存中——如图 1–2 所示，并且内存缓存更高效。`make_shared` 还提供了更好的异常安全性，因为我们只需要一次内存分配。显然\
  \ `make_shared` 返回的是一个智能指针，为了简单起见，我们可以使用自动类型检测 (§3.4.1)：\n\n```cpp\nauto p1= make_shared<double>();\n\
  ```\n\n我们必须承认，`shared_ptr` 在内存和运行上有一些开销。另一方面，得益于 `shared_ptr`，我们程序的简化在大多数情况下是值得这些少量开销的。\n\
  \n**进阅读：** 关于 `shared_ptr` 的删除器和其他细节，请参阅库参考 40, §[5.2], [62, §34.3.2], 或在线参考。\n\n\
  ![Images](img/01fig02.jpg)\n\n**图 1–2：`make_shared` 之后内存中的智能指针**\n\n### C++11 1.8.3.3\
  \ 弱指针 (Weak Pointer)\n\n智能指针出现的一个问题是“循环引用”，这会阻止内存释放。这种循环可以通过 `weak_ptr` 破坏。它们并不拥有内存的所有权，即使是共享所有权。在这里，我们只是为了完整性而提到它们，并建议在确定需要时阅读相应的参考文献：40,\
  \ §[5.2.2], [62, §34.3.3], 或 `cppreference.com`。\n\n对于动态内存管理，没有指针的替代方案。如果仅引用其他对象，我们可以使用另一种语言特性，称为“引用”（Reference，惊喜吧！），我们在下一节中介绍它。\n\
  \n### 1.8.4 引用 (References)\n\n以下代码引入了引用：\n\n```cpp\nint  i= 5;\n\nint& j= i;\n\n\
  j= 4;\n\nstd::cout ≪ \"i = \" ≪ i ≪ '\\n';\n```\n\n变量 `j` 引用 `i`。改变 `j` 也会改变 `i`，反之亦然，如示例所示。`i`\
  \ 和 `j` 将始终具有相同的值。可以将引用视为别名：它为现有的对象或子对象引入了一个新名称。每当我们定义引用时，必须直接声明它引用的是什么（指针除外）。无法稍后引用另一个变量。\n\
  \n引用对于函数参数 (§1.5)、引用其他对象的各个部分（例如 vector 的第七个元素）以及构建视图（例如 §5.2.3）来说更加有用。\n\nC++11\
  \ 作为指针和引用之间的折中方案，C++11 提供了一个 `reference_wrapper` 类，其行为与引用类似，但避免了引用的一些局限性。例如，它可以在容器内部使用；参见\
  \ §4.4.8。\n\n### 1.8.5 指针与引用的比较\n\n指针相对于引用的主要优势是动态内存管理和地址计算的能力。另一方面，引用强制引用已存在的位置(22)。因此，它们不会导致内存泄漏（除非你玩非常恶劣的花招），并且在用法上的符号与被引用对象相同。遗憾的是，几乎无法构造引用容器（请使用\
  \ `reference_wrapper`）。\n\n22。引用也可以引用任意地址，但你必须付出更多努力才能实现。为了你的安全，我们不会展示如何让引用变得像指针一样糟糕。\n\
  \n简而言之，引用不是绝对，但比指针不容易出错。只有在处理动态内存时才使用指针，例如当我们动态创建列表或树等数据结构时。即使如此，我们也应该通过经过测试的类型或将指针封装在类中来这样做。智能指针负责内存分配，即使在类内部也应优于原始指针。指针与引用的比较总结在表\
  \ 1-9](#ch01.xhtml_ch01tab09) 中。\n\n**表 1–9：指针与引用的比较**\n\n![Images](img/01tab09.jpg)\n\
  \n### 1.8.6 不要引用过时的数据！\n\n函数局部变量仅在函数作用域内有效，例如：\n\n```cpp\ndouble& square_ref(double\
  \ d) // 错误：返回失效引用\n\n{\n\n    double s= d * d;\n\n    return s;               //\
  \ 错误：s 将超出作用域\n}\n```\n\n在这里，我们的函数结果引用了不存在的局部变量 `s`。（注：原文此处存在大量重复行，已已处理）。\n\n\n\n\
  \n\n```\nvoid vector_add(const vector <float>& v1, const vector<float>& v2,\n\n\
  \                vector<float>& s)\n{\n    assert(v1.size() == v2.size());\n   \
  \ assert(v1.size() == s.size());\n    for (unsigned i= 0; i < v1.size(); ++i)\n\
  \        s[i]= v1[i] + v2[i];\n}\n```\n\n与 C 数组和指针不同，`vector` 参数知道它们的大小，我们现在可以检查它们是否匹配。注意，数组的大小可以通过模板推导出来，我们将在后后的\
  \ 第 3.3.2.1 节 中展示。\n\n向量是可以拷贝的，并且可以通过函数返回。这允许我们使用更自然的表示法：\n\n```\nvector <float>\
  \ add(const vector<float>& v1, const vector<float>& v2)\n{\n    assert(v1.size()\
  \ == v2.size());\n    vector<float> s(v1.size());\n    for (unsigned i= 0; i < v1.size();\
  \ ++i)\n        s[i]= v1[i] + v2[i];\n    return s;\n}\n\nint main ()\n{\n    std::vector<float>\
  \ v= {1 , 2, 3}, w= {7, 8, 9}, s= add(v, w);\n}\n```\n\n这种实现可能比之前那种目标向量作为引用传递的实现开销更大。我们稍后将讨论优化的可能性：包括编译器和用户两端。根据我们的经验，从一个高效的接口开始并稍后处理性能问题更为重要。让一个正确的程序变快比让一个快速的程序变得正确容易得多。因此，首要目标是良好的程序设计。在几乎所有情况下，良好的接口可以通过足够的性能来实现。\n\
  \n`std::vector` 容器并不是数学意义上的向量。它没有算术运算。尽管如此，该容器在科学应用中处理非标量中间结果被证明是非常有用的。\n\n### 1.8.7.2\
  \ valarray\n\n`valarray` 是一种具有逐元素操作能力的一维数组；甚至乘法也是逐元素执行的。与标量值的运算是分别对 `valarray` 的每个元素执行的。因此，浮点数的\
  \ `valarray` 是一个向量空间。\n\n下面的示例演示了一些操作：\n\n```\n#include <iostream>\n#include <valarray\
  \ >\nint main ()\n{\n    std::valarray<float> v= {1, 2, 3}, w= {7, 8, 9},\n    \
  \                        s= v + 2.0f * w;\n    v= sin (s);\n    for (float x : v)\n\
  \        std::cout ≪ x ≪ ' ';\n    std::cout ≪ '\\n';\n}\n```\n\n注意，`valarray<float>`\
  \ 只能与自身或 `float` 操作。例如，`2 * w` 将失败，因为这是不支持的 `int` 与 `valarray<float>` 相乘。\n\n`valarray`\
  \ 的优势之一是访问其切片的能力。这允许我们模拟矩阵和高阶张量，包括它们各自的操作。尽管由于缺乏对大多数线性代数操作的直接支持，`valarray` 在数值社区并没有广泛使用。我们还建议使用成熟的\
  \ C++ 库进行线性代数。希望未来的标准能包含一个。\n\n为了完成动态内存管理的主题，我们参考 第 A.2.8 节，其中简要描述了垃圾收集。底线是，C++\
  \ 程序员可以很好地没有它，而且目前（无论如何还没有编译器支持它。\n\n### 1.9 软件项目的结构化\n\n大型项目的一个大问题是命名冲突。由于由于，我们将讨论宏如何加剧这个问题。另一方面，我们将在后后的\
  \ 第 3.2.1 节 展示命名空间如何帮助我们掌握命名冲突。\n\n为了理解 C++ 软件项目中的文件是如何相互作用的，有必要理解构建过程，即如何从源码生成可执行文件。这将是我们第二个小节的主题。从这个角度，我们将介绍宏机制和其他语言特性。\n\
  \n首先，我们将简要讨论一个有助于程序结构化的特性：注释。\n\n#### 1.9.1 注释\n\n注释的主要目的显然是用纯语言描述程序源码中并非所有人都能直观理解的内容，如下：\n\
  \n```\n// 在 O(n log n) 时间内对反-binoxe 进行变形\nwhile (cryptographic(trans_thingy) < end_of(whatever))\
  \ {\n    ....\n```\n\n通常，注释是对混淆实现的说明性伪代码：\n\n```\n// A= B * C\nfor ( ... ) {\n \
  \   int x78zy97= yo6954fq, y89haf= q6843, ...\n    for ( ... ) {\n        y89haf+=\
  \ ab6899(fa69f) + omygosh(fdab); ...\n        for ( ... ) {\n             A(dyoa929,\
  \ oa9978)+= ...\n```\n\n在这种情况下，我们应该问自己是否可以重构我们的软件：\n\n```\nA= B * C;\n```\n\n注释另一个频繁用法是临时移除代码片段进行实验，例如：\n\
  \n```\nfor ( ... ) {\n    // int x= a + b\n    int x = d + e;\n    for ( ... ) {\n\
  \        ...\n}\n```\n\n像 C 一样，C++ 提供了由 `/*` 和 `*/` 包围的块注释。它们可以将代码的任意部分或多行转换为注释。遗憾的是，它们不能嵌套：无论用\
  \ `/*` 打开多少层注释，第一个 `*/` 都会结束所有注释。许多程序员有时会掉进这个陷阱：他们注释掉包含块注释的代码，例如：\n\n```\nfor (\
  \ ... ) {\n    /* int x78zy97=6954fq; // 开始新注释\n    int x78zy98=6953fq;\n    /*\
  \ int x78zy99=6952fq; // 开始旧注释\n    int x78zy9a=6951fq;    */ 结束旧注释\n    int x78zy9b=6950fq;\
  \    */ 结束新注释（推测）\n    int x78zy9c=6949fq;\n    \n```\n\n在这里，`x78zy9b` 行应该被禁用，但前面的\
  \ `*/` 提前结束了注释。\n\n嵌套注释可以通过预处理指令 `#if`（正确地）实现，我们将在 第 1.9.2.4 节 中进行说明。另一种方便的禁用多行的方法是使用\
  \ IDE 和语言感知编辑器的相应功能。无论如何，注释代码应只是开发期间探索各种方法的临时解决方案。一旦我们确定了某个选项，就可以删除所有未使用的代码，并依靠我们的版本控制系统确保它们对于以后可能的修改可用。\n\
  \n#### 1.9.2 预处理器指令\n\n在本节中，我们将介绍用于预处理的命令（指令）。由于它们大多与语言无关，我们建议将它们的使用限制在最低范围内，特别是宏。\n\
  \n##### 1.9.2.1 宏\n\n*“几乎每一个宏都展示了编程语言、程序或程序员的缺陷。”*\n\n——Bjarne Stroustrup\n\n\n\n\
  \n\n这是一种旧的代码复用技术，通过将宏名称展开为其文本定义（可能带有参数）来实现。使用宏可以为你的程序提供很多可能性，但也有更多可能毁掉它。宏对命名空间、作用域或任何其他语言特性具有免疫力，因为它们仅仅是不计后果的文本替换，完全不具备任何类型概念。遗憾的是，某些库定义了如\
  \ `major` 类的通用名称宏。我们会毫不留情地取消这些宏，例如 `#undef major`，完全不顾及可能想要使用这些宏的人。在 Visual Studio\
  \ 中——即便在今天！——我们仍然有 `min` 和 `max` 宏，我们强烈建议你通过编译选项 `/DNOMINMAX` 来禁用它们。几乎所有的宏都可以被其他技术（常量、模板、内联函数）取代。但如果你真的找不到其他实现方案的方法：\n\
  \n## 宏名称\n\n为宏请使用 `LONG_AND_UGLY_NAMES_IN_CAPITALS`！\n\n从技术上讲，这些宏来自 `Windows.h`\
  \ 而不是 Visual Studio 本身，但一旦我们遇到相关问题，这种区别就微不足道，而且由于这个头文件被频繁使用，这种情况并不罕见。\n\n宏会以几乎所有能想象到和意想不到的方式产生奇怪的问题。为了让你有一个大致的了解，我们查看附录\
  \ A.2.9 中的几个示例，并提供一些处理它们的建议。你可以等遇到具体问题时再考虑阅读。\n\n## 宏的使用\n\n尽可能将每个宏替换为其他语言特性，只有在别无他法时才使用宏。\n\
  \n正如你将在整本书中所看到的，C++ 提供了更好的替代方案，如常量、`inline` 函数、模板和 `constexpr`。\n\n### 1.9.2.2 包含\n\
  \n为了保持 C 语言的简单，许多功能（如 I/O）被排除在核心语言之外，转而由库来实现。C++ 遵循了这一设计，并尽可能通过标准库实现新功能，尽管如此没有人会称\
  \ C++ 为一种语言的语言。\n\n因此，几乎每个程序都需要包含一个或多个头文件。最常见的是用于 I/O，如所示：\n\n```cpp\n#include <iostream>\n\
  ```\n\n预处理器在 Unix-类系统上的标准包含目录（如 `/usr/include` 和 `/usr/local/include`）中搜索该文件。我们可以通过编译器标志向此搜索路径添加更多目录——在\
  \ Unix/Linux/Mac OS 世界通常使用 `-I`，在 Windows 中使用 `/I`。\n\n我们在双引号内编写文件名，例如：\n\n```cpp\n\
  #include \"herberts_math_functions.hpp\"\n```\n\n编译器通常首先搜索当前目录，然后在标准路径中搜索。这等同于使用角括号并将当前目录添加到搜索路径。有些人认为角括号只应该用于系统头文件，而用户头文件应该使用双引号（但我们并不认同他们的观点）。\n\
  \n然而，使用双引号文件名时搜索哪些目录取决于实现，标准并未强制规定。\n\n为了避免命名冲突，通常会将包含文件的父目录添加到搜索路径中，并在指令中使用相对路径：\n\
  \n```cpp\n#include \"herberts_includes/math_functions.hpp\"\n\n#include <another_project/math_functions.h>\n\
  ```\n\n斜杠是可移植的，在 Windows 下同样有效（Windows 的正斜杠和反斜杠均可用于目录）。\n\n**包含保护（Include guards）：**\
  \ 频繁使用的头文件可能由于间接包含而在一个源文件中被包含多次。为了避免禁止的重复并限制文本展开，所谓的“包含保护（Include Guards）”确保了只执行第一次包含。这些保护是声明包含特定文件的普通宏。一个典型的包含文件看起来如下：\n\
  \n```cpp\n// Author: me\n\n// License: 每阅读此文件请付我 $100\n\n#ifndef HERBERTS_MATH_FUNCTIONS_INCLUDE\n\
  \n#define HERBERTS_MATH_FUNCTIONS_INCLUDE\n\n#include <cmath>\n\ndouble sine (double\
  \ x);\n\n...\n\n#endif // HERBERTS_MATH_FUNCTIONS_INCLUDE\n```\n\n因此，只有当保护尚未定义时，文件的内容才会被包含。在内容内部，我们定义该保护以抑制进一步的包含。\n\
  \n与所有宏一样，我们必须密切注意名称的唯一性，不仅在我们的项目中，而且在我们直接或间接包含的所有其他头文件中。理想情况下，该名称应该代表项目和文件名。它也可以包含相对于项目的路径或命名空间。以\
  \ `_INCLUDE` 或 `_HEADER` 结尾是一种常见做法。\n\n意外重用保护宏可能会产生大量不同的错误信息。根据我们的经验，发现这种邪恶的根源可能花费非常长的时间。高级开发者会根据上述信息自动生成它们，或使用随机生成器生成。\n\
  \n一个方便的替代方案是 `#pragma once`。之前的示例可以简化为：\n\n```cpp\n// Author: me\n\n// License:\
  \ 每阅读此文件请付我 $100\n\n#pragma once\n\n#include <cmath>\n\ndouble sine(double x);\n\
  \n...\n```\n\nPragmas 是编译器特有的扩展，这就是为什么我们不能指它的可移植性。然而，`#pragma once` 被所有主流编译器支持，并且无疑是移植性最高的\
  \ pragma。除了更短的表示法外，我们还可以将责任委托给编译器。用于文件中组织代码的高级技术在 C20 中通过模块（modules）引入。我们将在第 7.3\
  \ 节中介绍它们。\n\n### 1.9.2.3 条件编译\n\n预处理器指令的一个重要且必要的用法是控制条件编译。预处理器提供了 `#if`、`#else`、`#elif`\
  \ 和 `#endif` 用于分支。条件可以是比较、检查定义或逻辑表达式。指令 `#ifdef` 和 `#ifndef` 分别是以下内容的简写：\n\n```cpp\n\
  #if defined(MACRO_NAME)\n\n#if !defined(MACRO_NAME)\n```\n\n当定义与其他条件结合时，必须使用长形式。同样，`#elif`\
  \ 是 `#else` 和 `#if` 的简写。\n\n在一个理想的世界里，我们只应该编写符合标准的 C++ 程序。在现实中，我们有时必须使用不可移植的库。假设我们有一个库仅在\
  \ Windows 上可用，更具体地说是在 Visual Studio 上（预定义了宏 `_MSC_VER`）。对于所有其他相关的编译器，我们有一个替代库。平台相关实现最简单的方法为不同的编译器提供替代代码段：\n\
  \n```cpp\n#ifdef _MSC_VER\n\n    ... Windows 代码\n\n#else\n\n    ... Linux/Unix 代码\n\
  \n#endif\n```\n\n同样，当我们想要使用并非所有目标平台都支持的新语言特性时，我们需要条件编译，例如模块：\n\n```cpp\n#ifdef MY_LIBRARY_WITH_MODULES\n\
  \n   ... 使用模块的库\n\n#else\n\n   ... 旧的可移植库\n\n#endif\n```\n\n在这里，我们可以在特性可用时使用它，同时保持对不支持该特性编译器的移植性。当然，我们需要可靠的工具仅在特性真正可用时才定义该宏。\n\
  \nC++20 另一种方法是我们可以依赖编译器开发者对于该特性是否得到良好支持的意见。为此，C++20 为自 C++11 以来引入的每个特性都引入了一个宏——例如用于模块支持的\
  \ `__cpp_modules`——因此我们的示例现在变为如下：\n\n```cpp\n#ifdef __cpp_modules\n\n    ... 使用模块的库\n\
  \n#else\n\n    ... 旧的可移植库\n\n#endif\n```\n\n\n\n\n此宏的值是该特性添加到标准（草案）时的年份和月份。对于不断进的核心语言和库特性，这允许我们找到实际上支持哪个版本。例如，`<chrono>`\
  \ 库（Section 4.5）随着时间的推移不断增长，为了检查系统是否支持其 C++20 功能，我们可以使用 `__cpp_lib_chrono` 的值：\n\
  \n```cpp\n#if __cpp_lib_chrono >= 201907L\n```\n\n条件编译非常强大，但也是代价的：源代码的维护和测试变得更加费力且容易出错。这些工作可以通过设计良好的封装来减少，使得通过通用接口使用不同的实现。\n\
  \n### 1.9.2.4 嵌套注释\n\n`#if` 指令可以用于注释掉代码块：\n\n```\n#if 0\n\n    ... 这里我们写了一些相当恶劣的代码！总有一天我们会搞定它的。真的。\n\
  \n#endif\n```\n\n与 `/* ... */` 相比，它的优势是它可以嵌套：\n\n```cpp\n#if 0\n\n    ... 这里开始了胡乱的内容。\n\
  \n#if 0\n\n    ... 这里是胡闹之中的胡闹。\n\n#endif\n\n    ... 我们胡闹的终结。（幸运地被忽略了。）\n\n#endif\n\
  ```\n\n尽管如此，这种技术应该适节使用：如果程序的四分之三都是注释，我们应该考虑进行严肃的修订。\n\n**更多细节：** 在 Appendix A.3\
  \ 中，我们展示了一个真实的示例，它总结了第一章的许多特性。我们没有将其包含在主阅读范围内，以便为不耐心的读者保持高节奏。对于那些不赶时间的人，我们建议花时间阅读它，看看非平凡软件是如何演化的。\n\
  \n### 1.10 练习\n\n#### 1.10.1 窄化转换\n\n使用统一初始化（即使用大括号）为不同的整数类型分配大值。例如，\n\n```cpp\n\
  const unsigned c1 {4000000000};\n```\n\n这在你的机器上能编译通过吗？尝试不同的值（包括负值）和不同的类型，看看在你的平台上哪些是可以通过编译的。如果可能，通过更改机器或关于目标平台的编译器标志来尝试其他平台。\n\
  \n#### 1.10.2 字面量\n\n重构来自 Exercise 1.10.1 的示例，使用字面量后缀 `u` 和 `l` 以及它们的合法组合。如果你愿意，可以将变量/常量的类型更改为\
  \ `auto`。\n\n#### 1.10.3 运算符\n\n编写计算不同几何体体积和表面积的表达式。尝试尽可能少使用括号（在现实生活中你可以再次使用任意数量的括号）。尝试通过将结果存储在中间变量中来重用常见的部分表达式。\n\
  \n#### 1.10.4 分支\n\n编写一个程序，读取三个 `double` 数字数字并打印出中间的一个。可选：尝试用 `?:` 表达式相同的功能。\n\n\
  #### 1.10.5 循环\n\n通过区间嵌套在 0 到 1 之间找到 `f = sin(5*x) + cos(x)` 的零点。对于给定的区间，从中间将其拆分，观察\
  \ `f` 的符号在哪侧发生变化，然后继续处理该区间。当区间小于 `10^(–12)` 时（因此我们需要 `double`）停止计算，并以 11 位打印该区间的中心点作为近似结果。提示：结果大约为\
  \ 0.785。C++11 引入的 `signbit` 函数在这里非常有帮助。尝试不同类型的循环，并思考哪种在这种背景下最合适。\n\n#### 1.10.6\
  \ I/O\n\n重构 Exercise 1.10.3，将计算中使用的所有输入参数和所有结果写入文件。每组新值使用新的一行。注意在两个数字之间留出空格。编写第二个程序，从文件中读取值并与原始值进行比较。\n\
  \n#### 1.10.7 数组和指针\n\n编写一个小型程序，在栈上创建数组（固定大小数组）并在堆上创建数组（使用分配）。使用 `valgrind`（或 Windows\
  \ 上的 Visual Studio 工具）来检查当你没有正确 `delete` 它们或使用错误的 `delete`（数组 vs 单个元素）时会发生什么。\n\n\
  #### 1.10.8 函数\n\n编写转换 SI 单位的函数，如 `meter2km` 和/或在 SI 单位与旧式英制单位（如 `usgallon2liter`）之间转换。使用\
  \ `assert` 测试你的实现。使用 `ɛ` 环境来处理浮点舍入问题，即计算值与预期值之间差的大小小于某些预定义的 `ɛ`。\n\n# 第 2 章 类\n\n\
  “计算机科学对于计算机的意义，就像天文学之于望远镜一样。”*\n\n—Edsger W. Dijkstra\n\n计算机科学不仅仅是钻研编程语言的细节。尽管如此，本章不仅将提供关于声明类的信息，还将让你了解我们如何最好地利用它们，它们如何最好地服务于我们的需求。甚至更好：如何在广泛的情况下方便且高效地使用类。我们不仅将类视为一种封装数据的方式，更主要将其视为在我们的软件中建立新抽象的工具。\n\
  \n### 2.1 面向通用意义而非技术细节的程序\n\n编写前沿工程或科学软件，如果仅仅关注细节是非常痛苦的且很可能失败的。科学工程编程中最重要的任务是：\n\
  \n- 识别领域中重要的数学抽象，\n- 在软件中全面且高效地表示这些抽象。\n\n**建议** 使用正确的抽象！如果不存在，请实现它们。\n\n专注于为特定领域寻找正确的表示以至于这种方法演变成了一种编程范式：*领域驱动设计*（DDD）。核心思想是软件开发人员与领域专家讨论软件组件应该如何命名和行为，以便生成的软件尽可能直观（不仅对于程序员，甚至对于用户也是如此）。书中没有深入讨论该范式。我们参考其他文献如\
  \ [72]。\n\n**科学软件的目的**\n\n科学家进行研究。工程师创造新技术。\n\n优秀的科学工程软件仅用数学和领域特定的操作表示，而不暴露任何技术细节。\n\
  \n在这个抽象层上，科学家可以专注于模型和算法，从而提高效率并促进科学发现。\n\n\n\n\n科学软件提供像上一个示例那样的底层接口（遗憾的是，我们见过比那更糟糕的），其致命错误在于在用户界面中陷入了过多的技术细节。其原因部分在于使用了如\
  \ `C` 和 `Fortran 77` 这样简单的编程语言，或者是为了与用这些语言之一编写的软件进行互操作。如果你被迫要编写与 `C` 或 `Fortran`\
  \ 互操作的软件，请先用 `C++` 为你自己以及其他 `C++` 程序员编写一个具有简洁直观接口的 `C++` 程序，并对 `C` 和 `Fortran` 库的接口进行封装，使其不暴露给开发者。\n\
  \n诚然，从 `C++` 应用中调用 `C` 或 `Fortran` 函数比反过来要容易。尽管如此，用这些语言开发大型项目的效率要低得多，因此从 `C` 或 `Fortran`\
  \ 调用 `C++` 函数所付出的额外努力是完全合理的。Stefanus Du Toit 在他的 `Hourglass API` 中演示了一个如何通过一个薄层的\
  \ `C` API 使 `C++` 程序与其他语言程序建立接口的示例 [12]。编写科学软件的优雅方式是提供最好的抽象。良好的实现将用户界面精简为本质行为，并省略所有对技术细节的必要承诺。具有简洁直观接口的应用，其效率可以与其那些外陋且痴迷于细节的程序一样高效。\n\
  \n我们这里的抽象是线性算子和向量空间。对于开发者来说，重要的是这些抽象是如何被使用的，在我们的案例中，即如何将线性算子作用于向量。假设应用用符号 `*` 表示，如\
  \ `L * v` 或 `A * x`。显然，我们期望此操作的结果会产生一个向量类型的对象（因此，语句 `w= L * v;` 应该可以通过编译），并且满足线性数学性质。这就是开发者使用线性算子所需要的全部信息。\n\
  \n线性算子在内部如何存储与程序的正确性无关——只要该操作满足所有的数学要求，且实现没有意外的副作用（例如覆盖其他对象的内存）。因此，两个提供必要的接口和语义行为的不同实现是可以相互互换的；也就是说，程序仍然可以编译并产生相同的结果。当然，不同的实现在性能上可能会有巨大差异。因此，对于目标平台或特定应用选择最佳实现时，能够在应用层面通过极少（或无需）程序修改即可完成，是至关重要的。\n\
  \n这就是为什么 `C++` 类对我们最重要的优势不是继承机制（第 6 章），而是建立新抽象并为它们提供替代实现的能力。本章将为此奠基础，我们将在后续章节中使用更高级的技术详细阐述这种编程风格。\n\
  \n## 2.2 成员\n\n在对类的长期诉求之后，是时候定义类了。类定义了一种新的数据类型，可以包含：\n\n* 数据：称为`成员变量（Member Variables）；标准也称其为数据成员（Data\
  \ Members）；另一个术语是`字段（Fields）；\n* 函数：称为`方法（Methods）或`成员函数（Member Functions）；\n* 类型定义；\n\
  * 嵌套类。\n\n本节将讨论数据成员和方法。\n\n### 2.2.1 成员变量\n\n一个简洁的类示例是表示复数的类型。当然，`C++` 中已经存在这样的类，但为了说明目的，我们编写了自己的：\n\
  \n```\nclass complex\n{\n  public:\n    double r, i;\n};\n```\n\n该类包含用于存储复数实部和虚部的变量。类定义角色的一个常见心理模型是“蓝图”。这意味着，我们还没有定义任何具体的复数。我们只是说复数包含两个类型为\
  \ `double` 的变量，命名为 `r` 和 `i`。现在我们要创建我们这种类型的`对象（Objects）`：\n\n```\ncomplex z, c;\n\
  \nz.r= 3.5; z.i= 2;\n\nc.r= 2; c.i= - 3.5;\n\nstd :: cout ≪ \"z is (\" ≪ z.r ≪ \"\
  , \" ≪ z.i ≪ \")\\n\";\n```\n\n这段代码通过变量声明定义了对象 `z` 和 `c`。此类声明与内置类型没有区别：一个类型名后跟一个变量名或变量列表。如上所示，可以使用点运算符\
  \ `.` 访问对象的成员。正如我们所看到的，成员变量可以像普通变量一样被读取和写入——前提是它们是可可访问的。\n\n### 2.2.2 可访问性\n\n类的每个成员都有指定的`可访问性（Accessibility）`。`C++`\
  \ 提供了三种：\n\n* `public:`：从任何地方可见；\n* `private:`：仅在类内部可见；以及\n* `protected:`：在类本身及其派生类中可见。\n\
  \n这让类设计者能够很好地控制类用户与每个成员交互的方式。定义更多的公共成员提供了更大的使用自由度，但控制更少。另一方面，更多的私有成员建立了一个更具限制性的用户界面。\n\
  \n类成员的访问性由`访问修饰符（Access Modifiers）`控制。假设我们想实现一个具有 `public` 方法和 `private` 数据的 `rational`\
  \ 类：\n\n```cpp\nclass rational\n{\n  public:\n    ...\n\n    rational operator+(...)\
  \ {...}\n\n    rational operator-(...) {...}\n  private :\n    int p;\n    int q;\n\
  };\n```\n\n一个访问修饰符适用于其后的所有成员，直到另一个修饰符出现。我们可以放置尽可能多的修饰符。请注意我们语言上的区分：声明单个项目属性的指定符与描述多个项目的修饰符之间的区别：下一个修饰符之前的所有方法和数据成员。拥有许多访问修饰符比混乱的类成员要好。第一个修饰符之前的类成员都是\
  \ `private`。\n\n#### 2.2.2.1 隐藏细节\n\n面向对象编程纯主义者将所有数据成员声明为 `private`。这样就可以保证所有对象的属性，例如当我们想在上述\
  \ `rational` 类中建立分母始终为正的不变性时。这时我们将分子和分母声明为 `private`（正如我们所做的），并实现所有方法以保持这种不变性。如果数据成员是\
  \ `public` 的，我们就无法保证这种不变性，因为用户可以在修改时违反它。\n\n`private` 成员也增加了我们在修改代码方面的自由度。当我们更改\
  \ `private` 方法的接口或 `private` 变量的类型时，该类的应用程序在重新编译后将继续工作。修改 `public` 方法的接口会（且通常会）破坏用户代码。换句话说法：`public`\
  \ 变量和 `public` 方法的接口构建了类的接口。只要我们不更改这个接口，就可以修改类而所有应用程序仍然可以编译。当 `public` 方法保持行为不变时，所有应用程序也会如此。我们如何设计\
  \ `private` 成员完全取决于我们，只要它们对 `public` 方法行为的贡献不受影响（且我们没有浪费所有的内存或计算能力）。通过仅在外部接口中定义类的行为而不固定其内部实现，我们建立了一个`抽象数据类型（ADT）`。\n\
  \n另一方面，对于小型辅助类（例如包含两个值的对），仅通过 getter 和 setter 函数来访问数据可能会是不必要的麻烦：\n\n```cpp\np.set_first(p.get_first()*2);\n\
  ```\n\n而不是\n\n```cpp\np.first*= 2;\n```\n\n\n\n\n在具有 `public` 成员的简单类与具有 `private`\
  \ 数据的完整类之间该如何划分界限，这是一个相当主观的问题（因此在开发者团队中容易引发激烈的争论）。Herb Sutter 和 Andrei Alexandrescu\
  \ 对这种区别描述得非常到位：当你建立一个新的抽象时，将所有内部细节设为 `private`；而当你仅仅是聚合现有的抽象时，数据成员可以是 `public` 的\
  \ [66, Item 11]。我们想增加一个更具挑衅性的表述：当你的抽象数据类型的所有成员变量都只有极其不足道的 getter 和 setter 时，该类型根本不是抽象的，你可以直接将变量改为\
  \ `public`，而除了失去笨拙的接口外不会丢失任何东西。\n\n`protected` 成员仅对于具有派生类的类型才有意义。Section 6.3.2.2\
  \ 将提供一个 `protected` 的良好用例示例。\n\n`C++` 还包含了来自 C 语言的 `struct` 关键字。它也可以声明类，并可以使用类的所有功能。唯一的区别是，所有成员（以及所有基类，§6）默认都是\
  \ `public` 的。因此，\n\n```\nstruct xyz\n{\n    ...\n};\n```\n\n等同于\n\n```cpp\nclass\
  \ xyz\n{\n  public:\n    ...\n};\n```\n\n根据经验法则：\n\n### 建议\n\n对于新的抽象优先使用 `class`，对于以数据为中心、功能有限且没有不变式的辅助类型使用\
  \ `struct`。\n\n### 2.2.2.2 友元 (Friends)\n\n尽管我们不想将内部数据提供给所有人，但我们可能会对良好的 `friend`\
  \ 破例。在我们的类内部，我们可以授予自由函数和类特殊许可来访问 `private` 和 `protected` 成员，例如：\n\n```\nclass complex\n\
  {\n    ...\n    friend std::ostream& operator≪(std::ostream&, const complex&);\n\
  \    friend class complex_algebra;\n};\n```\n\n在例例中，我们允许输出操作符和一个名为 `complex_algebra`\
  \ 的类访问内部数据和功能。`friend` 声明可以位于类的 `public`、`private` 或 `protected` 部分。当然，我们应该尽可能少地使用\
  \ `friend` 声明，因为我们必须确定每个 `friend` 都能维护我们内部数据的完整性。翻译成日常生活中：不要把这种 `friend` 看作任何和你一起喝啤酒的人，而要看作你会把公寓钥匙给他的人。\n\
  \n### 2.2.3 访问运算符\n\n共有四种运算符。第一种我们已经见过了：使用点 `.` 进行成员选择，`x.m`。所有其他运算符都以某种方式处理指针。首先，我们考虑一个指向\
  \ `complex` 类的指针以及如何通过该指针访问成员变量：\n\n```\ncomplex  c;\ncomplex* p= &c;\n*p.r= 3.5;\
  \           // 错误：意味着 *(p.r)\n(*p).r= 3.5;         // 可以\n```\n\n通过指针访问成员并不特别优雅，因为选择运算符\
  \ `.` 的优先级高于解引用运算符 `*`。为了自我惩罚，假设该成员本身是指向另一个类的指针，而我们想要访问该类的成员。那么我们需要另一对括号置于第二次选择之前：\n\
  \n```\n(*(*p).pm).m2 = 11;   // 哎呀\n```\n\n通过箭头（`->`）提供了更方便的指针成员访问：\n\n```\np->r=\
  \ 3.5;           // 看起来好多了；-)\n```\n\n即使是上述间接访问也不是问题了：\n\n```\np->pm->m2= 11;  \
  \   // 如此\n```\n\n在 C++ 中，我们可以定义*成员指针* (Pointers to Members)，这可能对并非所有读者都相关（作者到目前在本书之外未使用过它们，但被告诉它们在测试中可能有用）。如果你能想出一个用例，请阅读\
  \ Appendix A.4.1。\n\n### 2.2.4 类的静态声明符\n\n声明为 `static` 的成员变量每个类中只存在一次。这允许我们在类的不同对象之间共享资源。另一个用例是创建*单例*\
  \ (Singleton)：一种设计模式，确保某个类只存在一个实例 [16, pages 127–136]。\n\n因此，既是 `static` 又是 `const`\
  \ 的数据成员只存在一次且不可更改。结果是它在编译时即可可用。我们将在 第 5 章 中将其用于元编程。\n\n方法也可以被声明为 `static`。这意味着它们只能访问\
  \ `static` 数据并调用 `static` 函数。当方法不需要访问对象数据时，这可以实现额外的优化。\n\n我们的示例仅以常量形式使用 `static`\
  \ 数据成员，且没有 `static` 方法。然而，后者出现在 第 4 章 的标准库中。\n\n### 2.2.5 成员函数\n\n类中的函数被称为*成员函数*\
  \ (Member Functions) 或*方法* (Methods)。面向对象软件中典型的成员函数是 getter 和 setter：\n\n**列表 2–1:\
  \ 带有 getter 和 setter 的类**\n\n```\nclass complex\n{\n  public:\n    double get_r()\
  \ { return r; }               // 导致笨拙\n    void set_r( double newr ) { r = newr\
  \ ; }   // 代码\n    double get_i() { return i; }\n    void set_i( double newi ) {\
  \ i = newi; }\n\n  private:\n    double r, i;\n};\n```\n\n方法是 `private` 的；也就是说它们只能通过函数访问。这为类设计者提供了对行为的最大控制。例如，我们可以限制\
  \ setter 接受的数值范围。我们可以统计每个 `complex` 数字在执行期间被读取或写入的次数。我们甚至可以在程序在具有特定 IP 的计算机运行时允许读取。我们可能不会这样做，至少对于复数不会，但我们可以这样做。如果变量是公共并直接访问，这种行为是不可能的。然而，以这种方式处理复数的实部和虚部是笨拙的，我们将讨论更好的替代方案。\n\
  \n大多数 C++ 程序员不会这样实现。那么 C++ 程序员会做什么？编写构造函数。\n\n### 2.3 设置值：构造与赋值\n\n构造和赋值是设置对象值的两种机制，可以在创建时或之后进行。因此，这两个机制有很多共同之处并一起介绍。\n\
  \n### 2.3.1 构造函数\n\n*构造函数*是初始化类对象并为成员函数创建环境的方法。有时这种环境包括文件、内存或锁等在使用后必须释放的资源。稍后我们会回到这里。\n\
  \n我们的第一个构造将设置 `complex` 的实部和虚部值：\n\n```\nclass complex\n{\n  public:\n    complex\
  \ (double rnew, double inew)\n    {\n        r= rnew; i= inew;\n    }\n  // ...\n\
  };\n```\n\n构造函数是一个与类本身同名的成员函数。它没有返回值并且可以拥有任意数量的参数。上面的构造函数允许我们在定义中直接设置 `c1` 的值：\n\
  \n**列表 2–2: 使用 getter 和 setter**\n\n```\nint main ()\n{\n  complex c1(3.0, 2.0),\
  \ c2;\n\n  // 将 c1 拷贝到 c2\n  c2 = c1;\n\n  return 0;\n}\n```\n\n\n\n\n```cpp\ncomplex\
  \ c1(2.0, 3.0); // 传统的构造函数\n```\n\n为了验证我们在这里没有丢失精度，我们可以使用统一初始化：\n\n```cpp\nC++11\
  \  complex c1{2.0, 3.0}; // 现代风格\n```\n\n有一种特殊的语法用于在构造函数中设置成员变量和常量，被称为`成员初始化列表`（Member\
  \ Initialization List），简称为`初始化列表`（Initialization List）：\n\n```cpp\nclass complex\n\
  {\n  public:\n    complex(double rnew, double inew)\n      : r(rnew),   // 旧式\n\
  \        i{inew}    // 现代风格\n    {}\n  // ...\n};\n```\n\n初始化列表从构造函数函数头后的的冒号开始。从原则上说，它是一个用于成员变量（以及基类）的构造函数调用的非空列表或其子集。构造函数的语法同样适用于\
  \ `double` 等非类类型。在这里我们再次可以在传统的括号语法和大花括号（C++11 之后）之间进行选择。花括号防止从构造函数参数（或其表达式）到成员变量的收窄转换。在大多数情况下，它们的类型本身是相同的，但花括号比括号更好地传达了初始的含义，而括号与函数调用关联得更紧密。\n\
  \n初始化成员的顺序应该与它们的声明顺序一致，以便正确处理成员之间可能的引用。编译器会检查这一点，并在我们没有遵守成员顺序时发出警告。对于初始化列表中不存在的成员，编译器会在相应位置隐式插入不带参数的构造函数调用。这种不带参数的构造函数被称为`默认构造函数`（Default\
  \ Constructor）（我们将在 §2.3.1.1 中详细讨论它）。因此，我们的第一个构造函数示例等于：\n\n```cpp\nclass complex\n\
  {\n  public:\n    complex(double rnew, double inew)\n       : r{}, i {} // 由编译器生成\n\
  \    {\n         r= rnew; i= inew;\n    }\n};\n```\n\n对于像 `int` 和 `double` 这样的简单算术类型，在初始化列表中设置值还是在构造函数体中设置并不重要。未出现在初始化列表中的内置类型数据成员将保持未初始化。类类型的成员数据项如果未包含在初始化列表中，会被隐式地默认构造。\n\
  \n当成员本身是类时，成员如何初始化变得更加重要。假设我们写了一个类，通过给定矩阵求解线性方程组并将其存储在类中：\n\n```cpp\nclass solver\n\
  {\n  public:\n    solver (int nrows, int ncols)\n    // : A{}    #1  错误：调用了不存在的默认构造函数\n\
  \    {\n        A(nrows, ncols); // #2 错误：此处不允许调用构造函数\n    }\n  // ...\n  private:\n\
  \    matrix_type A;\n};\n```\n\n假设我们的矩阵类只有一个接受两个参数来设置尺寸的构造函数。该构造函数不能在构造函数的函数体内调用\
  \ (#2)。#2 中的表达式不会被解释为构造函数，而是作为一个函数调用：`A.operator()(nrows, ncols)`; 参见 §3.7。\n\n\
  由于所有成员变量在到达构造函数体之前就已经构造了，我们的矩阵 `A` 将在 #1 处被默认构造。遗憾的是，`matrix_type` 不是`可默认构造的`（Default-Constructible），这会导致类似错误的消息：\n\
  \n```cpp\nOperator ≫matrix_type::matrix_type()≪ not found.\n```\n\n因此，我们需要写：\n\n\
  ```cpp\nclass solver\n{\n  public:\n    solver(int nrows, int ncols) : A{nrows,\
  \ ncols} {}\n  // ...\n};\n```\n\n以便调用矩阵的正确构造函数。\n\n在之前的示例中，矩阵是 `solver` 的一部分。更可能的情况是矩阵已经存在了。那么我们不想浪费所有内存进行拷贝，而是引用该矩阵。现在我们的类包含一个引用作为成员，我们再次有义务在初始化列表中设置引用（因为引用也是不可默认构造的）：\n\
  \n```cpp\nclass solver\n{\n  public:\n    solver (const matrix_type& A) : A{A} {}\n\
  \  // ...\n  private:\n    const matrix_type& A;\n};\n```\n\n这段代码还证明了我们可以为构造函数参数赋予与成员变量相同的名称。这引出了一个问题：这些名称指向哪些对象？在我们的案例中，不同的出现处指的是哪一个\
  \ `A`？规则是：初始化列表中括号之外的名称始终指向成员。在括号内部，名称遵循成员函数的作用域规则。成员函数局部的名称（包括参数名称）会隐藏类中的名称。构造函数体也是如此：参数名称和局部变量的名称会隐藏类中的名称。这在开始时令人困惑，但你适应得会比你想的要快。\n\
  \n让我们回到 `complex` 示例。到目前为止，我们有一个允许我们设置实部和虚部的构造函数。通常只设置实部，而虚部默认为 0。\n\n```cpp\nclass\
  \ complex\n{\n  public:\n    complex (double r, double i) : r{r}, i{i} {}\n    complex\
  \ (double r) : r{r}, i{0} {}\n // ...\n};\n```\n\n我们也可以说，在没有给出值时，该数字是 `0 + 0*i`，也就是说如果复数被默认构造：\n\
  \n```cpp\ncomplex() : r{0}, i{0} {}\n```\n\n这三个构造函数可以使用默认参数合并为一个：\n\n```cpp\nclass\
  \ complex\n{\n  public:\n    complex (double r= 0, double i= 0) : r{r}, i{i} {}\n\
  \  // ...\n};\n```\n\n此构造函数允许各种初始化形式：\n\n```cpp\ncomplex z1,       // 默认构造\ncomplex\
  \ z2(),     // 默认构造\ncomplex z3{4},    // 等于 z3 {4.0, 0.0}\ncomplex z4= 4,    //\
  \ 等于 z4 (4.0, 0.0)\ncomplex z5{0, 1};\n```\n\n`z2` 的定义是一个陷阱。它看起来完全像是调用默认构造，但并不是。相反，它被解释为一个不接受参数并返回\
  \ `complex` 值的声明。Scott Meyers 将这种解释称为“最易析解析”（Most Vexing Parse）。\n\nC++ 包含了上述的默认构造函数\n\
  - `拷贝构造函数`（Copy Constructor），\n- `移动构造函数`（Move Constructor）（C++11 及更高版本；§2.3.5.1）。\n\
  \n在后续章节中，我们将更深入地讨论它们。\n\n##### 2.3.1.1 默认构造函数\n\n默认构造函数无非是不带参数的构造函数，或者是每个参数都有默认值的构造函数。类并不是强制包含默认构造函数的。\n\
  \n初看起来，许多类并不需要默认构造函数。然而在现实生活中，有它要方便得多。对于 `complex` 类，似乎我们没有默认构造函数也可以生存，因为我们可以等到知道对象的值时再进行声明。缺少默认构造函数会产生（至少两个）问题：\n\
  \n- 在内部作用域内初始化但由于算法原因在外部作用域生存的变量必须已经以无意义的值被构造。在这种情况下，使用默认构造函数来声明变量更为合适。\n- 最重要的原因是，对于没有默认构造函数的类型，实现容器（如列表、映射、向量和矩阵）是非常困难的（尽管可行）。\n\
  \n简而言之，人们可以在没有默认构造函数生存，但生活可能会变得很辛苦。\n\n**建议**\n\n尽可能定义默认构造函数。\n\n\n\n\n然而，对于某些类，定义默认构造函数非常困难，例如当某些成员是引用或包含引用时。在这种情况下，与其构建设计糟糕的默认构造函数，不如接受上述缺点。\n\
  \n### 2.3.1.2 拷贝构造函数\n\n在我们介绍性的 getter-setter 示例的 `main` 函数中（Listing 2–2），我们定义了两个对象，其中一个是另一个对象的拷贝。拷贝操作是通过读取和写入应用程序中的每个成员变量来实现的。更好的拷贝方法是使用拷贝构造函数：\n\
  \n```cpp\nclass complex\n\n{\n\n  public:\n\n    complex (const complex& c) : r{c.r},\
  \ i{c.i} {}\n\n  // ...\n\n};\n\nint main ()\n\n{\n    complex z1 (3.0, 2.0),\n\
  \            z2(z1),         //拷贝\n            z3{z1};         // C++11: 非收缩转换\n\
  }\n```\n\n如果用户没有编写拷贝构造函数，编译器通常会按标准生成^(1)一个：按照定义的顺序调用所有成员（以及基类）的拷贝构造函数，正如我们在示例中所做的那样。\n\
  \n1。隐式生成的确切规则将在附录 A.5.3 中给出。\n\n在这种拷贝所有成员正是我们拷贝构造函数所需要的的情况下，我们应该使用默认值，原因如下：\n\n\
  *   它更简洁；\n*   它更不容易出错；\n*   其他人无需阅读我们的代码就能直接知道执行了什么；以及\n*   编译器可能会发现更多优化空间。\n\n\
  如果我们不编译器是否会生成拷贝构造函数，可以使用以下声明以默认方式请求一个：\n\n```cpp\ncomplex(const complex& c) = default;\
  \ // 自 C++11 起\n```\n\n在几乎所有情况下，参数都是作为常量引用传递给拷贝构造函数的。原则上，它们也可以作为非 `const` 引用传递，但这很少用。而按值传递：\n\
  \n```cpp\ncomplex(complex c) // 错误！\n```\n\n对比是行不通的。请花几分钟思考一下为什么。我们将在本节最后告诉你。\n\n\
  ⇒ `c++03/vector_test.cpp`\n\n在默认拷贝构造函数不按预期工作的情况下，特别是当类包含指针时。假设我们有一个简单的 vector 类，其数据存储在指针中：\n\
  \n```cpp\nclass vector\n\n{\n\n  public:\n\n    vector (int size) : my_size {size},\
  \ data{new double[size]} {}\n    // .. 其他方法\n\n  private:\n\n    int     my_size;\n\
  \    double* data;\n};\n```\n\n如果我们不定义拷贝构造函数，编译器将以以下方式为我们执行：\n\n```cpp\nvector(\
  \ const vector & that )\n  : my_size{that.my_size}, data{that.data} {}\n```\n\n\
  你可以看到，所有成员都按照声明的顺序进行拷贝。这对于 `size` 参数是没问题的，但对于 `data` 指针是有问题的。通过拷贝指针，所有拷贝的 vector\
  \ 共享内存中的数据，如图 2–1 所示，修改其中一个会改变所有其他的：\n\n```cpp\nvector v1 (4);\nv1 [0] = v1 [1]\
  \ = 1.0; v1[2] = 2.0; v1[3] = -3.0;\nconst vector v2{v1};\nstd::cout << \" v2[3]\
  \ is \" << v2[3] << '\\n';\nv1[3]= 3.14;\nstd::cout << \" v2[3] is \" << v2[3] <<\
  \ '\\n';\n```\n\n![Images](img/02fig01.jpg)\n\n**图 2–1：生成的 vector 拷贝**\n\n在这里我们甚至可以更改常量\
  \ vector `v2` 的项，因为它与非常量 vector `v1` 共享数据。\n\n我们观察到的另一个问题是运行时库将尝试释放两次内存。^(2) 为了说明目的，我们在这里预留了来自第\
  \ 2.4.2 节的析构函数：它删除 `data` 所指向的内存。由于两个指针包含相同的内存地址，第二次析构函数调用将失败。\n\n2。这是每个程序员一生至少经历一次的错误信息（除非他们没有在做正事）。我希望我是错的。我的朋友兼校对员\
  \ Fabio Fracassi 乐观地认为使用现代 C++ 的未来程序员将不会遇到这个问题。让我们希望他是正确的。\n\n现在我们实现自己的实际拷贝数据的构造函数。为了证明我们没有双重内存释放，我们也添加了析构函数：\n\
  \n```cpp\nclass vector\n\n{\n\n  public:\n\n    vector ( const vector & v)\n   \
  \   : my_size {v. my_size}, data {new double [my_size]}\n    {\n        for (unsigned\
  \ i= 0; i < my_size; ++i)\n            data [i]= v. data [i];\n    }\n\n    ~vector()\
  \ { delete[] data; }\n\n  private:\n\n    unsigned my_size;\n    double* data;\n\
  };\n\n``` 2.3.1.3 转换与显式构造函数\n\n在 C++ 中，我们区分了隐式构造函数和显式构造函数。隐式构造函数允许在需要一种类型而给出另一种类型时进行转换，例如用\
  \ `double` 代替 `complex`。假设我们有一个函数：^(3)\n\n3。`real` 和 `imag` 的定义很快就会给出。\n\n```cpp\n\
  double inline complex_abs(complex c)\n{\n    return std::sqrt(real(c) * real(c)\
  \ + imag(c) * imag(c));\n}\n```\n\n并用 `double` 调用它，例如：\n\n```cpp\ncout << \" |7|\
  \ = \" << complex_abs(7.0) << '\\n';\n```\n\n字面量 `7.0` 是 `double`，但没有接受 `double`\
  \ 的 `complex_abs` 函数重载。然而，我们有一个接受 `complex` 参数的重载，而 `complex` 有一个接受 `double` 的构造函数。因此，`complex`\
  \ 值从 `double` 字面量隐式构建。通过声明为 `explicit` 可以禁用隐式转换：\n\n```cpp\nclass complex {\n\n\
  \  public:\n\n    explicit complex(double nr= 0.0, double i= 0.0) : r{nr}, i{i}\
  \ {}\n\n};\n```\n\n那么 `complex_abs` 就不会用 `double` 调用。要用 `double` 调用此函数，我们可以写一个接受\
  \ `double` 的重载，或者在函数调用中显式构造 `complex`：\n\n```cpp\ncout << \" |7| = \" << complex_abs(complex\
  \ {7.0}) << '\\n';\n```\n\n`explicit` 属性对于某些类非常重要，例如 `vector`。通常有一个以向量大小作为参数的构造函数：\n\
  \n```cpp\nclass vector\n\n{\n  public:\n    vector(int n) : my_size{n}, data{new\
  \ double[n]} {}\n};\n```\n\n计算点积的函数期望两个 vector 作为参数：\n\n```cpp\ndouble dot(const\
  \ vector& v, const vector& w) { ... }\n```\n\n该函数可以使用整数参数调用：\n\n```cpp\ndouble d=\
  \ dot (8, 8);\n```\n\n\n\n\n发生了什么？通过隐式构造函数创建了两个大小为 8 的临时向量，并将其传递给函数 `dot`。这种错误行为可以通过将构造函数声明为\
  \ `explicit` 来轻松避免。底底哪个构造函数应该是 `explicit` 的，取决于类设计者的决定。在 vector 示例中，这是显而易见的：任何理智的程序员都不希望编译器自动将整数转换为向量，而且这种类似于赋值的语法：\n\
  \n```\nvector v= 8;\n```\n\n看起来很奇怪，这也是隐式构造函数不恰当的一个指标。\n\n`complex` 类的构造函数是否应该是 `explicit`\
  \ 取决于预期的用法。由于虚部为零的 `complex` 数在数学上等同于实数，因此隐式转换不会产生语义上的不一致。隐式构造函数更加方便，因为在任何需要 `complex`\
  \ 值的地方都可以 `double` 值或字面量。对于性能不敏感的函数，只需为 `complex` 实现一次，即可供 `double` 使用。相比之下，`vector`\
  \ 构造函数的尺寸参数不是一个特殊的 `vector` 对象，而是对该对象的规范。因此，对于这种类型，隐式转换完全没有意义。\n\n在 C++03 中，`explicit`\
  \ 属性仅对单参数构造函数有效。从 C++11 开始，由于统一初始化，`explicit` 也适用于具有多个参数的构造函数，参见第 2.3.4 节。\n\n###\
  \ C++11 2.3.1.4 委托构造\n\n在之前的示例中，我们拥有具有多个构造函数的类。通常这些构造函数并不完全不同并且有一些共同代码；即通常存在很多冗余。在\
  \ C++03 中，公共代码段只能通过外包到一个方法中并由多个构造函数调用该方法来复用。\n\nC++11 提供了*委托构造*（Delegating Constructors）；这些是调用其他构造函数的构造函数。我们的\
  \ `complex` 类可以使用此特性来代替默认值：\n\n```\nclass complex\n{\n  public:\n    complex(double\
  \ r, double i) : r{r}, i{i} {}\n    complex(double r) : complex{r, 0.0} {}\n   \
  \ complex() : complex{0.0} {}\n    ...\n\n};\n```\n\n显然，对于这个小示例来说，这种处并不显著。对于初始化过程更加复杂（比我们的\
  \ `complex` 更复杂）的类，委托构造变得更有用。\n\n### C++11 2.3.1.5 成员的默认值\n\nC++11 的另一个新特性是成员变量的默认值。这样我们只需要在构造函数中设置与默认值不同的值：\n\
  \n```\nclass complex\n{\n  public:\n    complex(double r, double i) : r{r}, i{i}\
  \ {}\n    complex(double r) : r{r} {}\n    complex() {}\n    ...\n\n  private:\n\
  \    double r= 0.0, i= 0.0;\n};\n```\n\n同样，这种益处对于大型类来说显然更加明显。\n\n### 2.3.2 赋值\n\n\
  在第 2.3.1.2 节中，我们已经可以看到拷贝没有 getter 和 setter 的用户类对象——至少在构造期间。现在，我们想通过编写代码将其拷贝到现有对象中：\n\
  \n```\nx= y;\nu= v= w= x;\n```\n\n为了实现这一点，类必须提供一个赋值运算符（或者阻止编译器生成一个）。像通常一样，我们首先考虑\
  \ `complex` 类。将 `complex` 值赋值给 `complex` 变量需要这样的运算符：\n\n```\ncomplex& operator =(\
  \ const complex& src)\n{\n    r= src.r; i= src.i;\n    return *this;\n}\n```\n\n\
  显然，我们拷贝了成员变量 `r` 和 `i`。该运算符返回对象的引用以便实现多次赋值。`this` 是指向对象本身的指针，由于我们需要引用，所以我们对 `this`\
  \ 指针进行解引用。赋值对象类型赋值的运算符被称为*拷贝赋值*（Copy Assignment），可以由编译器合成。在我们的示例中，生成的代码将与我们的相同，我们可以省略此处的实现。如果我们把一个\
  \ `double` 赋值给 `complex` 会发生什么？\n\n```\nc= 7.5;\n```\n\n在没有定义 `double` 赋值运算符的情况下，它也能编译。再次，我们有了一个隐式转换：隐式构造函数临时创建一个\
  \ `complex` 对象并将其赋值。如果这成为性能问题，我们可以为 `double` 添加赋值：\n\n```\ncomplex& operator =(double\
  \ nr)\n{\n    r= nr; i= 0;\n    return *this;\n}\n```\n\n对于使用原始指针的 `vector` 实现，合成的拷贝赋值是不令人意的，因为只拷贝了数据的地址而不是数据本身。使用\
  \ `unique_ptr` 时，编译器无法生成拷贝操作，因为 `unique_ptr` 没有拷贝。两种情况下，我们需要实现拷贝赋值：\n\n```\n1  vector&\
  \ operator =( const vector& src)\n2  {\n3      if (this == &src)\n4          return\
  \ *this;\n5      assert(my_size == src.my_size);\n6      for (int i= 0; i < my_size;\
  \ ++i)\n7          data[i]= src.data[i];\n8      return *this;\n9   }\n```\n\n对象对自身的赋值（源和目标地址相同）可以跳过（第\
  \ 3 和第 4 行）。\n\n### 2.3.3 初始化列表\n\nC++11 引入了*初始化列表*（Initializer Lists）作为一项新特性——不要与“成员初始化列表”混淆。要使用它，必须包含头文件\
  \ `<initializer_list>`。虽然此特性与类概念是独立的，但 vector 的构造和赋值是极佳的用例，使得这里适用于初始化列表。普通的 C 数组可以在定义时完全初始化：\n\
  \n```\nfloat v[]= {1.0 , 2.0 , 3.0};\n```\n\n这种能力在 C++11 中被泛化，任何类都可以用列表初始化。通过适当的构造函数，我们可以写：\n\
  \n```\nvector v= {1.0 , 2.0 , 3.0};\n```\n\n接受 `vector` 参数的函数现在可以使用临时设置的 `vector`\
  \ 调用：\n\n```\nvector x= lu_solve(A, vector{1.0 , 2.0 , 3.0});\n```\n\n上述语句通过对 *A*\
  \ 进行 LU 分解为向量 (1, 2, 3)求解线性方程。要在我们的 `vector` 类中使用此特性，我们需要一个构造函数和一个接受 `initializer_list<double>`\
  \ 作为参数的赋值运算符。懒惰的人只需实现构造函数，并结合拷贝赋值使用。为了演示和性能考虑，我们将实现两者。这还允许我们在赋值中验证 `vector` 的大小是否匹配：\n\
  \n```\n# include <initializer_list>\n# include <algorithm>\n\nclass vector\n{\n\
  \    // ...\n\n    vector (std::initializer_list<double> values)\n      : my_size\
  \ {values.size()}, data {new double [my_size]}\n    {\n        copy(begin(values),\
  \ end(values), data);\n    }\n\n    vector& operator=(std::initializer_list<double>\
  \ values)\n    {\n        assert(my_size == values.size());\n        copy(begin(values),\
  \ end(values), data);\n        return *this;\n    }\n\n};\n```\n\n\n\n\n为了将列表中的值复制到我们的数据中，我们使用标准库中的\
  \ `std::copy` 函数。该函数接受三个迭代器作为参数。这三个参数分别代表输入的 `begin` 和 `end`，以及输出的 `begin`。`begin`\
  \ 和 `end` 在 C++11 中作为自由函数引入；在此之前，我们必须使用相应的成员函数，例如 `values.begin()`。当使用 `unique_ptr`\
  \ 处理数据时，我们需要进行一些微调，因为 `unique_ptr` 没有迭代器接口。通过 `get` 方法访问内部原始指针可以允许我们使用 `copy` 函数，但在直接操作地址时，存在损坏\
  \ `unique_ptr` 的风险。\n\n这些在某种程度上是广义指针；请参阅第 4.1.2 节。\n\n#### C++11 2.3.4 统一初始化\n\n\
  在 C++11 中，大括号 `{}` 被用作所有形式变量初始化的通用符号，通过：\n\n• 初始化列表构造函数，\n• 其他构造函数，或\n• 直接成员设置。\n\
  \n后者仅适用于数组和所有（非静态）变量均为 `public` 且该类没有用户定义构造函数的类。此类类型被称为*聚合体 (Aggregates)*，使用大括号列表设置其值被称为*聚合初始化\
  \ (Aggregate Initialization)*。\n\n进一步的条件是该类没有基类且没有虚函数（§6.1）。\n\n假设我们定义了一个没有构造函数的粗略\
  \ `complex` 类，我们可以这样初始化它：\n\n```\nstruct sloppy_complex\n{\n    double r, i;\n};\n\
  \nsloppy_complex z1{3.66, 2.33},\n               z2 = {0, 1};\n```\n\nC++20 引入了*指定初始化\
  \ (Designated Initialization)*，它允许我们指定要为哪个成员分配特定的值：\n\n```\nsloppy_complex z1 {.r=\
  \ 3.66, .i= 2.33},\n               z2 = {. i= 1};           // r 将为 0.0\n\nsloppy_complex\
  \ z3 {.i= 4.4, .r= 0.9};   // 错误：顺序错误\n```\n\n我们可以跳过某些成员，但不允许改变顺序。不用说，我们更倾向于使用构造函数而非聚合初始化甚至是指定初始化。然而，当我们被迫处理遗留代码时，它非常有用。\n\
  \n本节中包含构造函数的 `complex` 类可以使用相同的符号进行初始化：\n\n```\ncomplex c{7.0, 8}, c2= {0, 1}, c3=\
  \ {9.3}, c4= {c};\n\nconst complex cc= {c3};\n```\n\n当相关的构造函数被声明为 `explicit` 时，则不允许使用带有\
  \ `=` 的符号表示。\n\n仍然存在我们在上一节中引入的初始化列表。将列表作为统一初始化的参数实际上需要双层大括号：\n\n```\nvector v1=\
  \ {{1.0, 2.0, 3.0}},\n       v2{{3, 4, 5}};\n```\n\n为了简化生活，C++11 在统一初始化器中提供了*大括号省略\
  \ (Brace Elision)*；即大括号可以省略，列表项将按照给定的顺序传递给构造函数参数或数据成员。因此，我们可以将声明缩短为：\n\n```\nvector\
  \ v1= {1.0, 2.0, 3.0},\n       v2{3, 4, 5};\n```\n\n大括号省略既是福赐也是诅咒。假设我们将 `complex`\
  \ 类集成到 `vector` 中以实现一个我们可以方便设置的 `vector_complex`：\n\n```\nvector_complex v= {{1.5,\
  \ -2}, {3.4}, {2.6, 5.13}};\n```\n\n然而，接下来的示例：\n\n```\nvector_complex v1d= {{2}};\n\
  vector_complex v2d= {{2, 3}};\nvector_complex v3d= {{2, 3, 4}};\n\nstd::cout <<\
  \ \" v1d is \" << v1d << std::endl; ...\n```\n\n可能会让人感到意外：\n\n```\nv1d is [(2,0)]\n\
  v2d is [(2,3)]\nv3d is [(2,0), (3,0), (4,0)]\n```\n\n在第一行中，我们有一个参数，因此 vector 包含一个复数，该复数通过单参数构造函数初始化（虚部为\
  \ 0）。下一条语句创建了一个带有一个元素的 vector，其构造函数是用两个参数调用的。这种方案显然无法继续：`complex` 没有带三个参数的构造函数。因此，在这里我们切换到多个\
  \ vector 项，每个项都用一个参数进行构造。对于感兴趣的读者，附录 A.4.2 中提供了更多实验。\n\n大括号的另一个应用是成员变量的初始化：\n\n\
  ```cpp\nclass vector\n{\n  public:\n    vector(int n)\n      : my_size{n}, data{new\
  \ double[my_size]} {}\n    ...\n  private:\n    unsigned my_size;\n    double *data;\n\
  };\n```\n\n这防止了我们无意的双重释放：\n\n```cpp\nvector(int n)\n  : my_size{n}, data{new double[my_size]}\
  \ {}\n```\n\n我们已经证明统一初始化在小心的情况下是可以工作的。在本节中，我们展示了统一初始化的可能性以及一些风险。\n\n#### C++11 2.3.5\
  \ 移动语义\n\n复制大量数据是昂贵的，人们使用了许多技巧来避免不复制。许多包使用浅拷贝。对于 `vector` 示例，这意味着我们只复制地址而不是数据。因此，在赋值之后：\n\
  \n```\nv= w;\n```\n\n两个变量包含相同的数据。如果我们修改 `v[7]`，也会修改 `w[7]`。因此，使用浅拷贝的软件通常会显式调用深拷贝的函数：\n\
  \n```\ncopy (v, w);\n```\n\n每次变量赋值时，必须使用此函数代替赋值。对于临时值——例如返回的 vector——浅拷贝并不关键，因为否则无法访问它且我们没有别名。相反，当大对象作为函数结果返回时，深拷贝是非常贵的。稍后我们将介绍非常高效的避免复制的技术（参见\
  \ 5.3）。现在，我们引入该功能的另一个 C++ 特性：*移动语义 (Move Semantics)*。其思想是变量（即所有命名的项）进行深拷贝，而临时变量（无法通过名称的对象）转移数据。\n\
  \n这引出了问题：我们如何区分临时数据和持久数据？好消息是编译器为我们做了这件事。在 C++ 术语中，临时变量被称为右值（Rvalue），因为它们只能出现在赋值的右侧。C++11\
  \ 引入了右值引用，用两个连接符 `&&` 表示。具有名称的值（称为左值）不能传递给右值引用。\n\n##### C++11 2.3.5.1 移动构造函数\n\n\
  通过提供移动构造函数和移动赋值，我们可以确保右值不会被昂贵地复制：\n\n```cpp\nclass vector\n{\n    // ...\n    vector(vector&&\
  \ v) noexcept\n      : my_size{v.my_size}, data{v.data}\n    {\n        v.data =\
  \ nullptr;\n        v.my_size = 0;\n   }\n};\n```\n\n\n\n\n移动构造函数从源对象中窃取数据，并将其留为空状态。由于我们没有分配新内存，因此不存在发生\
  \ `bad_alloc` 异常的风险，并且可以将此构造函数声明为 `noexcept`。通常，许多 C++ 专家要求所有移动操作都应该是 `noexcept`。\n\
  \n作为右值（rvalue）传递给函数的对象在函数返回后被认为失效。这意味着我们不能再依赖数据的完整性。唯一的要求是对象的析毁 (§2.4) 不能失败。必须特别注意原始指针（一如既常）。它们不能指向随机内存，否则会导致删除失败或某些用户数据被释放。如果我们保持指针\
  \ `v.data` 不变，那么当 `v` 出范围时，内存将被释放，导致我们目标向量的数据失效。通常，在移动操作后，原始指针应该是 `nullptr`。\n\n\
  请注意，像 `vector&& v` 这样的右值引用本身并不是右值，因为它拥有名称，是一个左值（lvalue）。如果我们想将 `v` 传递给另一个帮助移动构造函数处理数据的方法，我们必须使用标准函数\
  \ `std::move` 再次将其转换为右值（参见 §2.3.5.4）。\n\n### C++11 2.3.5.2 移动赋值\n\n移动赋值可以通过交换指向数据的指针简单地实现：\n\
  \n```cpp\nclass vector\n{\n    // ...\n\n    vector& operator=(vector&& src) noexcept\n\
  \    {\n        assert(my_size == 0 || my_size == src.my_size);\n        std::swap(data,\
  \ src.data);\n        std::swap(my_size, src.my_size);\n        return *this;\n\
  \    }\n};\n```\n\n这让我们无需释放自己的数据（如果存在的话），因为这是在源对象析毁时完成的。\n\n假设我们有一个空向量 `v1` 和在函数\
  \ `f()` 中临时创建的向量 `v2`，如图 2–2 上部所示。当我们将 `f()` 的结果赋值给 `v1` 时：\n\n```cpp\nv1= f();\
  \   // f 返回 v2\n```\n\n移动赋值将 `swap` `data` 指针，使得 `v1` 之后包含 `v2` 的值，而后者则为空，如图 2–2\
  \ 下部所示。\n\n### C++17 2.3.5.3 拷贝消除\n\n如果我们在这两个函数中添加日志，我们可能会发现移动构造函数的调用频率并不像我们想象的那么高。其原因是现代编译器提供了比窃取数据更优优化。这种优化被称为*拷贝消除（Copy\
  \ Elision）*，编译器会省略数据的拷贝，并修改数据的生成方式，使其直接存储到拷贝操作的目标地址。\n\n![Images](img/02fig02.jpg)\n\
  \n**图 2–2: 移动后的数据**\n\n它最重要的用例是*返回值优化（RVO）*，特别是当用函数结果初始化新变量时：\n\n```cpp\ninline\
  \ vector ones(int n)\n{\n   vector v(n);\n   for (unsigned i= 0; i < n; ++i)\n \
  \      v[i]= 1.0;\n   return v;\n}\n\n...\n\nvector w(ones (7));\n```\n\n编译器并不是构造\
  \ `v` 并在函数结束时将其拷贝（或移动）到 `w`，而是可以直接创建 `w` 并直接在其上执行所有操作。拷贝（或移动）构造函数永远不会被调用。我们只需通过日志输出或调试器检查这一点。\n\
  \n在移动语义出现之前，许多编译器就已经支持拷贝消除。从 C++17 开始，符合标准是强制性的。在 Visual Studio 中，它仅在发布模式下可用。然而，拷贝消除并没有让移动构造函数失效。在某些情况下\
  \ RVO 无法应用。\n\n### C++11 2.3.5.4 我们需要移动语义的地方\n\n当我们创建一个新对象并将左值转换为右值时，绝对会被移动构造函数。因此引入了函数\
  \ `std::move`，它将每个对象转换为（临时）右值引用。函数本身并不移动任何数据，只是将对象声明为临时，以便其他函数移动其数据。结果是，以下代码调用了右值的构造函数和赋值操作：\n\
  \n```cpp\nvector x(std::move(w));\n\nv= std::move(u);\n```\n\n在第一行中，`x` 窃取 `w` 的数据并将其留为空向量。第二个语句将交换\
  \ `v` 和 `u`。\n\n当配合 `std::move` 时，我们的移动构造函数和赋值并不完全一致。只要我们只处理真正的临时对象，就不会发现差异。但为了更强的一性，我们也可以让移动赋值的源保持为空状态：\n\
  \n```cpp\nclass vector\n{\n    // ...\n\n    vector& operator =(vector&& src) noexcept\n\
  \    {\n        assert(my_size == src.my_size);\n        delete[] data;\n      \
  \  data= src.data;\n        src.data= nullptr;\n        src.my_size= 0;\n\n    \
  \    return *this;\n    }\n};\n```\n\n### C++11 2.3.5.5 移动后的生活\n\n比雅尼·斯特斯特鲁普（Bjarne\
  \ Stroustrup）曾说过，C 让你很容易射中脚趾；而 C++ 让这变得困难，但当你这样做时，它会炸掉你的整条腿。\n\n\n\n\n\n有趣的是，标准库中的类通常已经提供了我们在这里想要提议的行为。\n\
  \n右值（Rvalues）可以以不同的方式处理，我们在标准库中发现了它们的示例：\n\n- **完全交接 (Complete Handover)**：仅包含动态管理资源的类可以将这些资源从一个对象移交给另一个对象。例如\
  \ `unique_ptr`，它将所引内存从一个对象传递到另一个对象。\n- **拷贝 (Copy)**：不包含任何动态资源的类只能拷贝其内容，且通常既不提供移动构造函数也不提供赋值运算符。例如\
  \ `vector` 迭代器，本质上是一个指针。\n- **内部交接 (Internal Handover)**：某些容器无法完整传递其内容，但能够交接单个条目。例如\
  \ `unique_ptr` 的 `std::array`。当元素本身无法完全交接但允许内部交接时，这种方案当然可以递归地继续，例如一个由 `unique_ptr`\
  \ 组成的 `array` 的 `array` 的 . . .\n- **部分交接 (Partial Handover)**：类的成员可能有不同的移动行为。例如，一个由\
  \ `int` 和一个 `unique_ptr` 组成的 `pair` 会拷贝前者并交接后者的内存。\n- **可选交接 (Optional Handover)**：某些类可以在特定条件下交接其资源。该决策可以在运行时和/或在编译时根据模板参数做出。一个示例是具有短对象优化的\
  \ `string` 类，长度长度内的字符串直接存储在对象中，而较长的字符串在堆上进行动态处理。因此，短字符串被拷贝，而长字符串仅交接。即使是像 `vector`\
  \ 这样可调整大小的容器也属于此类。它们通常交接完整数据。但对于某些分配器类型和状态，这是不允许的，此时条目将按元素移动（通过拷贝或交接）。[7]。作者不得不承认，在得知这种特殊行为时也感到惊讶。因此，他感谢移动语义的主要创建者\
  \ Howard Hinnant 指出这一点。\n\n两种处理方式是极端：我们认为完全交接是移动最纯粹的形式，而拷贝代表了移动的完全缺失。其他三种处理可以被视为它们的混合版本。除了纯拷贝的对象外，我们将移动操作的源称为**空对象\
  \ (Emptied Object)**。\n\n为了研究对移动后对象进行操作的影响，我们现在区分三种情况：\n\n1. 显式删除的移动操作；\n2. 不存在或隐式删除的移动操作；以及\n\
  3. 存在的移动操作。\n\n隐式删除和显式删除移动操作之间的差异在 [Section A.5.4.3] 中详细讨论。\n\n### 情况 1：显式删除的操作\n\
  显式删除的操作是不允许调用的。因此，向此类操作传递右值将导致编译错误，我们不需要担心对象会失效。\n\n### 情况 2\n当移动操作（例如构造）不存在或被隐式删除时，编译器将寻找在隐式转换右值参数后可调用的备用重载函数。例如，如果移动构造函数被隐式删除且存在拷贝构造函数，则对象将被无声拷贝，因为右值引用可以隐式转换为常量左值引用。如果拷贝构造函数也不可用，那么我们无法从右值创建新对象\
  \ [8]。这同样适用于任何接收右值的函数。通常情况下，要么右值被视为常量左值，以至于它无法（合法地）被更改，要么程序无法编译。在这两种情况下，我们都不需要担心之前有效的对象会变得无效。[8]。实际上，是从左值开始的。\n\
  \n### 情况 3\n当我们提供自己的移动操作时，这是一个有趣的案例。根据标准，移动操作的源在之后会失效（expiring），因为该对象只需要是可以正确析构且可赋值的。这些对象在标准中被称为\
  \ `XValues` [38]。它们不应被再次使用。然而，我们并没有让右值处于无效状态，而是将其设置为有意义的值。因此，我们强烈建议：\n\n#### 清空右值\n\
  每当你从右值接管数据时，请让该对象处于有效状态。为了提供一致的类行为，如果可能，空对象应该与默认构造的对象相等。优先选择完全交接而非其他形式。\n\n完全交接始终是处理动态资源最高效的形式。它的行为也最容易理解。交接的其他形式也有其原因，正如标准库中的示例所示。\n\
  \n当我们完全交接动态资源时，事后处于空状态是自然而然。即使在混合情况下，空状态通常也是最佳选择。在我们的 `dmc::vector` 示例中，我们有一个部分交接：`unique_ptr`\
  \ 有真正的移动语义，但没有大小参数。然而，由于类设计假设指针指向的条目数量与 size 成员中存储的数量相同，这两个成员是关联的。当指针被清空时，size 值必须与之调整。\n\
  \n对于可选交接，移动后的对象有时是空的，否则仍包含旧值。当内容足够大并存储在堆上时，`string` 对象为空。较短的内容保留在对象中。为了保持一致性，我们也可以在拷贝后清空字符串内容；这只需要在\
  \ size 成员中存储一个 `0`。标准库的实现通常不会这样做，因为对于一个假设不再被使用的对象来说，这被认为是多余的操作。在我们自己的项目中，我们可以将一致的行为置于微小的性能收益之上。\n\
  \n同样，像 `vector` 这样的容器无法交接其完整内容，但会按元素交接所有条目。此时，移动后的容器保留了条目数量，但它们都是空的。在这种情况下，将容器大小调整为零不是更合理吗？再次，标准库实现通常由于上述原因不会这样做，但我们可以在应用程序中这样做。\n\
  \n这些可能未清理的移动后对象对用户类的后果是，我们应该在移动操作后清空相应的成员（或基类）。此时，我们不必太担心性能开销。一旦我们的项目运行正常并经过仔细的基准测试和性能分析，如果发现这些操作是严重的瓶颈，我们仍然可以考虑省略这些清理操作——在我们看来，这是极不可能的。\n\
  \n正如之前所说的，只要努力允许，尽可能将你的移动后对象留在与默认构造对象等值的定义的空状态中。反对此准则的可能担忧如下：\n\n- 如果类没有默认构造函数且没有提供其他有意义的空状态怎么办？那么该类可能不适合移动操作。相反，我们应该定义一个空状态，并可能添加一个建立建立该状态的默认构造函数。\n\
  \n\n\n\n在设置一个空对象时，移动赋值无法通过 `swap` 来实现，而这通常是更简单的方法。是的，这对于类的实现者来说更简单。但对于类的用户来说，让赋值和构造函数的行为保持一致更符合逻辑，而且在构造函数中，我们没有其他对象可以进行\
  \ `swap`。\n\n- 如果设置空状态的开销很高怎么办？移动操作中昂贵的部分通常是资源传输的目标如果存在原有资源，则必须释放这些原有资源。在大多数情况下，这将是内存的释放，但也可能影响文件句柄等其他资源。如果我们通过交换资源来实现移动操作，这并不能节省释放的工作量；它只是将这些工作推迟到了被移动对象的析构阶段（除非资源被泄露或进一步转移）。简而言之，通常昂贵的资源释放反正要执行，因此将某些值置为零或\
  \ `nullptr` 是微忽略其道的。当很明显对象在之后将直接被销毁时，编译器甚至会将这些清零操作优化掉。空对象的昂贵设置也可能是实现低效的标志，例如为空容器分配内存而不是使用\
  \ `nullptr`。\n\n- 我们难道不能改变语言，使得被移动后的对象不再能使用吗？也许可以。但这在短期内不太发生。此外，这种变化会导致在运行时决定何时移动对象时产生新的跟踪开销。因此，我们最好自力而为，现在就提供一个良好的解决方案。\n\
  \n关于成本论点的另一个备注：计算中最昂贵的资源不是处理器周期或内存，而是开发者。我们通过更具一致性且易于理解的行为所能节省的开发时间，其价值远高于减少的计算周期（尤其是因为这些开销通常由他人来买单）。\n\
  \n我们还应该考虑何时可以依赖生成的移动操作，以及何时我们需要自己的实现。我们编写移动操作主要有两个原因：\n\n### 案例 1\n成员类或基类的移动行为与我们类的行为不匹配。包含原始指针的类通常需要用户定义的移动操作以避免双重内存释放。使用\
  \ `unique_ptr` 或 `shared_ptr` 可以避免这种危险。但即使使用智能指针，也并不总是可以依赖生成的行为。Herb Sutter 举了一个例子\
  \ [65]，描述了一个包含 `shared_ptr<int>` 的类，该类有一个不变式：指针不能不能为空。这个不变式显然不是由 `shared_ptr` 强制要求的，因此我们要么省略移动操作，要么以满足这种不变式的方式来实现它。\n\
  \n### 案例 2\n即使单个成员的移动行为与类的设计不冲突，成员之间的关系也可能是一个问题。我们已经在 `dmc::vector` 类中见过这种情况，其中\
  \ `unique_ptr` 被正确地移动了，而 `size` 属性被复制了。这两个操作都是没问题的：`unique_ptr` 为空且 `size` 属性仍然包含旧值，这两个事实并没有违反类不变式——当分开考虑时是。当将它们联系起来时，我们看到了问题：在交付数据后，`size`\
  \ 应该为零。这种移动后的不一致性甚至取决于微妙的实现细节（包括来自标准类型的细节）。假设我们有一个 `department` 类，其中包含一个 `employee`\
  \ 的 `vector` 以及一些用 `map` 实现的多索引访问。`map` 的值应该是 `employees` 中的索引位置：\n\n```\nclass\
  \ department\n{\n    vector <employee>  employees;\n    map<int, int>      phone_access;\n\
  \    map<string, int>   name_access;\n    ...\n};\n```\n\n这些成员的通常移动行为是三个容器都完全从一个对象转移到另一个对象。在这种情况下，被移动后的对象只包含空容器，这是完全正确的。然而，无法保证这种通常行为实际上得到了实现，因为标准只要求容器处于有效状态，而没有说明是哪种状态。当使用非默认分配器时，情况变得更加棘手。在某些条件下，移动操作后容器可能不是空的。当所有容器都保持不变时，`department`\
  \ 对象仍然有效。关键情况是 `employees` 容器被清空但访问 map 没有被清空，因为我们获得的所有位置将不再存在于 `employees` 中了。对于\
  \ `name_access` 来说，情况更加令人困惑，因为对值的移动操作会将键作为 `string` 移交，但不会将位置值作为 `int` 移交。实际上实际上优势，因为我们不会在\
  \ map 中找到该名称，因此也就不会访问空的 `employees` 容器。好吧，这只适用于足够长的名称，因为短名称只是被复制并保留在 map 条目的键中。好在\
  \ particular，我们可以简单地在移动所有容器后对它们调用 `clear` 来避免这整个噩梦。对于你们中现在认为在已经知道容器为空的情况下调用 `clear`\
  \ 是在为没使用的东西买单的人，欢迎你们实现一种依赖于类型和编译器的代码，仅在需要时调用 `clear`（警告：你的代码将是元编程和 `#ifdef` 的邪恶结合）。\n\
  \n⇒ `c++17/move_sanity_test.cpp`^(9)\n\n9. `std::movable` 可能在 Visual Studio 的某些编译标志下存在歧义和其他问题。\n\
  \n\n\n因此，当一个对象的类型是移动安全的（move-safe）时，我们就不需要担心它的有效性。这样，一个对象是否为 `xvalue` 就不再重要，我们也可以从繁琐地分析软件以检查这一点中解脱出来。\n\
  \n一个类的移动安全性应该有良好的文档说明，以减轻用户担心对象被之前的移动操作所损坏的负担。显然，我们不仅想知道一个对象是否有效，还想知道它具有什么值。我们希望具有移动安全类的库在未来具有竞争优势，并希望有一天移动安全性能像释放获取的资源一样成为常态。\n\
  \n我们可以从不同的角度来理解移动语义：\n\n*   作为拷贝的快速版本，在其中我们允许修改源对象；\n*   作为深拷贝和浅拷贝之间的明智选择（后者应经过恰当的后处理），或\n\
  *   作为从即将过期的对象中窃取资源。\n\n这三个视角都没有涵盖本节中提到的所有实现。唯一的事实是，从对象 `a` 移动到对象 `b` 后，`b` 的值必须是\
  \ `a` 的原始值。`a` 的值可能会改变，但即使大多数对象在移动操作后被销毁且不再被访问，它也应该是有效的。`a` 的值可能会改变这一事实并不意味着它的值是任意的。理想情况下，`a`\
  \ 应该是空的，但这并不总是可行的。与其重复上面的讨论，我们更喜欢用以下接近有效的 C++ 伪代码来说明关于 `a` 值的想法：\n\n```\nT a= something,\
  \ b{a}, c{move (a)}, d;\n\nif (a != T {} && a != b)\n   cout ≪ \" Peter doesn't\
  \ like T.\\n\";\n\n// 内部移交（单层）\n\nif (a == T( size (b), value_type <T >{}))\n  \
  \ cout ≪ \" Well, if really necessary ... okay.\\n\";\n\nd= move(b);\n\nif (a !=\
  \ b)\n   cout ≪ \" Please make your operations consistent .\\n\";\n```\n\n**总结：**\
  \ 我们对移动语义需要全新的视角。我们不应该将其看作一种我们不太关心源对象的加速拷贝。在任何适用情况下，我们应该将其视为一种不同的操作，将所有动态管理的资源从一个对象移交给另一个对象。许多类已经这样做过了。对于标准库中的类，操作的源应该保持在有效状态。我们强烈建议对用户类也实施这一要求。此外，我们鼓励你指定被移动后的对象处于什么种状态，并确保这种状态不依赖于上下文。在合理努力允许的情况下，被移动后的对象应该处于一个定义良好的空状态，理想情况下等同于默认构造对象的状态。通过这种视角，我们消除了\
  \ xvalues、prvalues 和 glvalues。更重要的是，当类设计完全消除了无效对象时，类的使用将变得安全得多。当我们知道被移动后的对象处于什么种状态时，软件也将更容易被理解和开发。\n\
  \n### C++11 2.3.6 从字面量构造对象\n\n⇒ `c++11/udl_examples.cpp`\n\n字面量的类型可以通过后缀更改，如第 1.2.5\
  \ 节所示：例如 `123` 是 `int`，而 `123ul` 是 `unsigned long int`。C++11 引入了*用户自定义字面量*（User-Defined\
  \ Literals），允许我们定义自己的后缀来构造我们自定义类型的对象。\n\n假设我们要处理不同单位的长度：公里、米、厘米等，以及陆里和海里。（12）。在内部，所有值都以米表示，这样我们就可以安全地对它们进行计算：12。请注意，我们对标准的合规性不仅限于\
  \ C++。陆里和海里的测量值指的是 SI 定义；传统的测量值分别长了 3 和 216 毫米。\n\n```\nclass length\n{\n  public:\n\
  \    explicit length(double l) : l{l} {}\n    friend length operator+(length len1,\
  \ length len2)\n    {\n        return length{len1.l + len2.l};\n    }\n    // ...\n\
  \  private:\n    double l;\n};\n```\n\n所有其他单位首先被转换为米。当然，任何足够聪明能用 C++ 编程的人都能将其他测量值正确转换为米。然而，我们不应该因为微小的数学错误而感到丢脸，(13)，我们应该关注编程并拥抱语言提供的机会。13。这绝对不会发生在我们朋友\
  \ Herbert 身上，永远不会发生。因此，他不需要 UDLs。\n\n为了简洁起见，每个运算符都实现为内联 `friend` 函数。这是一种简短的符号，用于将自由函数（类外）和\
  \ `friend` 声明（类内）结合起来。它被放在类内部，但实现方式像在外部一样，即不能直接访问成员，并且必须将类的对象作为函数参数传递。回到我们的单位：为了定义不同的单位，我们使用\
  \ `operator\"\"`：\n\n```\nlength operator\"\" _m(long double l)\n{\n    return length(l);\n\
  }\n\nlength operator\"\" _km(long double l)\n{\n    return length(l);\n}\n\nlength\
  \ operator\"\" _nm(long double l)\n{\n    return length(l);\n}\n```\n\n## 2.4 析构函数\n\
  \n析构函数是在对象被销毁时调用的函数，例如：\n\n```\n~complex()\n{\n    std::cout ≪ \"So long and thanks\
  \ for the fish.\\n\";\n}\n```\n\n由于析构函数是构造函数的互补操作，它使用了互补符号 (~)。与构造函数相反，它只有一个重载且不允许参数。\n\
  \n### 2.4.1 实现规则\n\n有两个非常重要的规则：\n\n1. **规则：** 所有后缀以下划线开头以避免冲突。\n2. **绝不要**从析构函数抛出异常！如果在析构函数或调用的函数抛出异常，必须在析构函数内部捕获。否则我们的程序可能会崩溃。在\
  \ C++11 及更高版本中，析构函数的异常总是被视为终止执行的运行时错误（析构函数隐式声明为 `noexcept`，§1.6.2.6）。在 C++03 中，行为是未定义的，但最可能是程序中止。\n\
  3. 如果一个类包含虚函数，那么它的析构函数也应该是虚的。我们将在第 6.1.3 节中回到这个问题。\n\n### 2.4.2 妥善处理资源\n\n\n\n\n\
  我们在析构函数中所做的完全取决于我们自己的选择，语言并没有提供任何限制。实践上，析构函数的主要任务是释放对象的资源（内存、文件句柄、套接字、锁等），并清理程序中不再需要的与对象相关的所有内容。由于析构函数不能抛出异常，许多程序员深信释放资源应该是析构函数的唯一活动。\n\
  \n⇒ `c++03/vector_test.cpp`\n\n在我们的示例中，当复数被销毁时没有什么需要做，因此我们可以省略析构函数。当对象获取内存等资源时，则需要析构函数。在这种情况下，内存或其他资源必须在析构函数中释放：\n\
  \n```cpp\nclass vector\n\n{\n\n    public:\n\n    // ...\n\n     ~vector ()\n\n\
  \    {\n\n        delete [] data;\n\n    }\n  // ...\n\n  private:\n\n    unsigned\
  \ my_size;\n\n    double   *data;\n};\n```\n\n注意 `delete` 已经测试了指针是否为 `nullptr`（C++03\
  \ 中的 0）。同样，使用旧的 C 句柄打开的文件需要显式关闭（这只是不使用它们的原因之一）。基于 `unique_ptr` 的 `vector` 不需要析构函数的实现，因为编译器生成了一个释放内存的析构函数。\n\
  \n### 2.4.2.1 资源获取初始化\n\n*资源获取初始化*（RAII）是一种主要由 Bjarne Stroustrup 和 Andrew Koenig\
  \ 开发的范。该思想是将资源与对象绑定，并利用对象的构造和析构机制在程序中自动处理资源。每当我们想要获取资源时，通过创建一个拥有该资源的对象来实现。每当对象超出范围，资源（内存、文件、套接字等）就会自动释放，就像我们在上面的\
  \ `vector` 示例所示。\n\n想象程序在 986 个程序位置分配了 37,186 个内存块。我们能确定所有内存块都释放了吗？我们需要花费多少时间才能这种确定性，或者至少达到可以接受的信心水平？即使使用\
  \ `valgrind` (§B.3) 等工具，我们也只能测试单次运行是否存在内存泄漏，而无法保证内存总是被释放。相反，当所有内存块都在构造函数中分配并在析构函数中释放时，我们可以确定不存在泄漏。\n\
  \n### 2.4.2.2 异常\n\n当抛出异常时，释放所有资源更具挑战性。当我们检测到问题时，必须在抛出异常之前释放已获取的所有资源。不幸的是，这不仅限于当前范围内的资源，还取决于异常捕获的位置，延伸到周围范围。这意味着更改错误处理需要对手动资源管理进行繁琐的调整。好消息是，这只适用于手动处理的资源；通过\
  \ RAII 绑定到本地对象的资源会在我们带异常离开范围时在相应的析构函数中自动释放（实际上是任何离开范围的时刻）。\n\n### 2.4.2.3 托管资源\n\
  \n之前提到的所有问题都可以引入管理资源的类来解决。C++ 标准库已经提供了这样的管理器。文件流管理来自 C 的文件句柄。`unique_ptr` 和 `shared_ptr`\
  \ 以无无、异常安全的方式处理内存(14)。同样在我们的 `vector` 示例中，我们也可以从 `unique_ptr` 中受益，因为不需要实现析构函数。\n\
  \n14. 只有循环引用需要特殊处理。\n\n### 2.4.2.4 自我管理\n\n智能指针表明，资源类型可以有不同的处理方式。然而，当没有现有的类以我们想要的方式处理资源时，这就是编写一个为我们需求定制的资源管理器的绝佳时机。\n\
  \n当我们这样做时，不应该在一个类中管理多个一个资源。这一准则的动机是构造函数中可能会抛出异常，要以一种保证所有获取的资源都被释放的方式编写构造函数是非常繁琐的。\n\
  \n因此，每当我们写一个处理两个资源（即使类型相同）的类时，我们应该引入一个管理其中一个资源的类。更好的情况下，我们应该为两个资源都编写管理器，并将资源处理与科学内容完全分离。即使在构造函数中间抛出异常，我们也不必担心资源泄漏，因为管理器的析构函数会被自动调用并处理好这一切。\n\
  \n“RAII”术语在语言上更强调“初始化”。但从技术上讲，最终化（finalization）更为重要。资源并不强制在构造函数中获取，这可能发生在对象生命周期的后期。关键在于由单个对象负责该资源并在其生命周期结束时释放它。因此，Jon\
  \ Kalb 将 RAII 称为*单一职责原则*（SRP）的应用。\n\n### C++11 2.4.2.5 资源抢救\n\n在本节中，我们引入了一种即使在使用带有手动资源处理的软件包时也能自动释放资源的技术。我们将通过\
  \ Oracle C++ Call Interface (OCCI) [51] 演示从程序访问 Oracle 数据库。这个示例允许我们展示一个真实的应用，我们假设许多科学家和工程师经常需要处理数据库。尽管\
  \ Oracle 数据库是商业产品，但我们的示例可以使用免费的 Express 版进行测试。此外，这种技术也可以应用于其他旧库。\n\nOCCI 是 C 库 OCI\
  \ 的 C++ 扩展，只添加了一个非常薄的功能层，同时保持整个软件架构的 C 风格。由于 C 不支持析构函数，无法建立 RAII，资源必须手动释放。\n\n在\
  \ OCCI 中，我们首先必须创建一个 `Environment`，用于建立到数据库的 `Connection`。这反过来允许我们编写返回 `ResultSet`\
  \ 的 `Statement`。所有这些资源都由原始指针表示，并且必须以反顺序释放。\n\n**表 2–1: Herbert 的解决方案**\n\n![Images](img/02tab01.jpg)\n\
  \n作为一个示例，我们查看表 2–1，我们的朋友 Herbert 在这里记录他对（所谓的）未解决数学问题的解决方案。第二列表示他是否确定自己的工作值得获得奖项。由于尺寸原因，我们无法在这里打印他巨大发现的完整列表。\n\
  \n⇒ `c++03/occi_old_style.cpp`\n\n有时，Herbert 使用以下 C++ 程序查找他那些值得奖项的发现：\n\n```cpp\n\
  # include <iostream>\n# include <string >\n# include <occi.h>\n\nusing namespace\
  \ std;               //导入命名空间 (§3.2.1)\nusing namespace oracle::occi;\n\nint main()\n\
  {\n    string dbConn = \"172.17.42.1\", user = \"herbert\",\n           password\
  \ = \"NSA_go_away\";\n\n    Environment *env = Environment::createEnvironment();\n\
  \    Connection *conn = env->createConnection(user, password,\n                \
  \                             dbConn);\n    string query = \"select problem from\
  \ my_solutions\"\n                   \"  where award_worthy != 0\";\n    Statement\
  \ *stmt = conn->createStatement(query);\n    ResultSet *rs = stmt->executeQuery();\n\
  \n    while (rs->next())\n        cout << rs->getString(1) << endl;\n\n    stmt->closeResultSet(rs);\n\
  \    conn->terminateStatement(stmt);\n    env->terminateConnection(conn);\n    Environment::terminateEnvironment(env);\n\
  \n}\n```\n\n\n\n\n这一次，我们不能责怪 Herbert 使用这种旧式的编程方法；这是由库强制要求的。让我们来看代码。即使对于不熟悉 `OCCI`\
  \ 的人来说，发生了什么也是显而易见的。首先我们获取资源，然后遍历 Herbert 构思巧妙的成果，最后按反顺序释放资源。我们高亮了资源释放操作，因为我们必须对这些操作额外关注。\n\
  \n当我们的程序（或 Herbert 的程序）像上面一样是一个单体代码块时，这种释放技术工作得相当不错。但当我们尝试构建带有查询的函数时，情况完全发生了变化：\n\
  \n```cpp\nResultSet *rs = makes_me_famous();\n\nwhile (rs->next())\n\n    cout ≪\
  \ rs->getString(1) ≪ endl;\n\nResultSet *rs2 = needs_more_work();\n\nwhile (rs2\
  \ ->next())\n    cout ≪ rs2->getString(1) ≪ endl;\n```\n\n现在，我们有了结果集，却没有相应的关闭它们的语句；它们是在查询函数内部声明的，现在已经离开了作用范围。因此，对于每一个对象，我们都必须额外保留用于生成它的对象。早晚，这会变成一场依赖关系的噩梦，并存在巨大的错误风险。\n\
  \n⇒ `c++11/occi_resource_rescue.cpp`\n\n问题是：我们如何管理依赖其他资源的资源？解决方案是使用 `shared_ptr`\
  \ 的删除器（deleters）。它们在托管内存释放时会被被调用。删除器的一个有趣方面点是，它们并没有义务真正释放内存。我们将利用这种自由来管理我们的资源。`Environment`\
  \ 的处理最简单，因为它不依赖于其他资源：\n\n```cpp\nstruct environment_deleter {\n\n    void operator()(\
  \ Environment* env )\n    { Environment::terminateEnvironment(env); }\n};\n\nshared_ptr\
  \ <Environment> environment(\n\n    Environment::createEnvironment(), environment_deleter{});\n\
  ```\n\n现在，我们可以根据需要创建任意数量的环境副本，并保证当最后一个副本离开作用范围时，执行 `terminateEnvironment(env)` 的删除器会被调用。\n\
  \n`Connection` 的创建和终止需要一个 `Environment`。因此，我们在 `connection_deleter` 中保留了一个副本：\n\n\
  ```cpp\nstruct connection_deleter\n{\n\n    connection_deleter(shared_ptr <Environment>\
  \ env)\n      : env{env} {}\n\n    void operator()(Connection* conn)\n    { env\
  \ ->terminateConnection(conn); }\n\n    shared_ptr <Environment> env;\n};\n\nshared_ptr\
  \ <Connection> connection(environment->createConnection(...),\n\n              \
  \                     connection_deleter{environment});\n```\n\n现在，我们有了保证当 `Connection`\
  \ 不再需要时它会被终止。在 `connection_deleter` 中拥有 `Environment` 的副本确保了只要 `Connection` 存在，它就不会被终止。当我们为数据库创建一个管理器时，也可以更方便地处理数据库：\n\
  \n```cpp\nclass db_manager\n{\n  public:\n\n    using ResultSetSharedPtr = std::shared_ptr<ResultSet>;\n\
  \n    db_manager(string const & dbConnection, string const & dbUser,\n\n       \
  \        string const & dbPw)\n      : environment{Environment::createEnvironment(),\n\
  \                    environment_deleter{}},\n        connection{environment->createConnection(dbUser,\
  \ dbPw,\n                                                 dbConnection),\n     \
  \              connection_deleter{environment} }\n    {}\n\n    // some getters\
  \ ...\n\n  private:\n\n    shared_ptr<Environment> environment;\n\n    shared_ptr<Connection>\
  \  connection;\n};\n```\n\n注意，该类没有析构函数，因为成员现在是托管资源了。在这个类中，我们可以添加一个返回托管 `ResultSet`\
  \ 的 `query` 方法：\n\n```cpp\nstruct result_set_deleter\n{\n\n    result_set_deleter(shared_ptr<Connection>\
  \ conn,\n\n                       Statement* stmt)\n      : conn{conn}, stmt{stmt}\
  \ {}\n\n    void operator()( ResultSet *rs )     // 调用 op. 如 (§3.7)\n    {\n   \
  \     stmt->closeResultSet(rs);\n        conn->terminateStatement(stmt);\n    }\n\
  \n    shared_ptr<Connection> conn;\n\n    Statement*             stmt;\n};\n\nclass\
  \ db_manager\n{\n  public:\n\n    // ...\n\n    ResultSetSharedPtr query(const std::string&\
  \ q) const\n    {\n        Statement *stmt = connection->createStatement(q);\n \
  \       ResultSet *rs = stmt->executeQuery();\n        auto deleter = result_set_deleter{connection,\
  \ stmt};\n        return ResultSetSharedPtr{rs, deleter};\n    }\n};\n```\n\n得益于这种新方法和我们的删除器，应用程序变得非常简单：\n\
  \n```cpp\nint main()\n{\n    db_manager db(\"172.17.42.1\", \"herbert\", \"NSA_go_away\"\
  );\n    auto rs= db. query (\"select problem from my_solutions\"\n             \
  \           \"   where award_worthy != 0\");\n    while (rs->next())\n        cout\
  \ ≪ rs->getString (1) ≪ endl;\n}\n```\n\n查询越多，我们的努力就越值。不为重复而重复：所有资源都隐式地释放了。\n\n\
  细心的读者已经意识到违反了单一职责原则。为了表达对这一发现的感谢，我们邀请你在练习 2.8.5 中改进我们的设计。\n\n## 2.5 方法生成总结\n\n`C++`\
  \ 有六种方法（C++03 中四种）是编译器尝试隐式生成的：\n\n• 默认构造函数\n• 拷贝构造函数\n• 移动构造函数 (C++11)\n• 拷贝赋值\n\
  • 移动赋值 (C++11)\n• 析构函数\n\n这节省了我们的日常工作，并防止了疏忽。从 C++11 开始，我们可以通过 `default` 或 `delete`\
  \ 控制（并记录）这种生成：\n\n```cpp\nclass complex\n{\n  public:\n    complex(const complex&)\
  \ = delete;\n    operator=(const complex&) = default;\n};\n```\n\n在这个示例中，我们删除了拷贝构造函数，并请求以默认方式生成赋值。隐式生成可能会根据\
  \ A.5 中的规则静默忽略列表中的一个或多个，而请求默认生成某个方法会导致编译错误。（ 15）。在 C++03 中我们无法删除函数，但至少可以通过声明在 `private`\
  \ 部分禁用方法。`delete` 是表达我们意图的更好方式，产生更少困惑的错误信息。与 `private` 技巧相反，我们可以对自由函数使用 `delete`。（\
  \ 15）。模板中存在一些少数例外，但在大多数情况下我们会看到错误消息。\n\n**六项规则**\n\n关于上述六项操作，尽可能少地实现，并尽可能地声明。任何未实现的操作应在适用时声明为\
  \ `default` 或 `delete`。缺失操作的行为至少应该在注释中解释。\n\n\n\n\n\n`C++` 提供了多种访问类成员的方法。在本节中，我们将介绍不同的选项并讨论它们的优缺点。希望通过这些内容，你对未来如何设计最适合你领域的类有一个直观的感受。\n\
  \n### 2.6.1 访问函数\n\n在 §2.2.5 中，我们引入了 getters 和 setters 来访问 `complex` 类的变量。setter\
  \ 的优点是我们对被设置的值具有更多控制权，但对于这个类来说我们不需要这种控制。另一方面，这种访问风格可能相当繁琐，例如，当我们想要增加实部时：\n\n```\n\
  c.set_r (c.get_r () + 5\\. );\n```\n\n这看起来并不像数值运算，可读性也不好。实现此操作更好的方法是编写一个返回引用的成员函数：\n\
  \n```\nclass complex {\n\n  public:\n    double& real() { return r; }\n};\n```\n\
  \n有了这个函数，我们可以写：\n\n```\nc.real()+= 5.;\n```\n\n这看起来已经好多了，但仍然有一点奇怪。为什么不这样增加值呢：\n\n\
  ```\nreal(c)+= 5.;\n```\n\n为此我们写了一个自由函数（free function）：\n\n```\ninline double& real(complex&\
  \ c) { return c.r; }\n```\n\n遗憾的是，这个函数访问了私有成员 `r`。我们可以修改这个自由函数，使其调用成员函数：\n\n```\n\
  inline double& real(complex& c) { return c.real(); }\n```\n\n或者，将该自由函数声明为 `complex`\
  \ 的友元函数（friend），以访问其 `private` 数据：\n\n```\nclass complex {\n    friend double& real(complex&\
  \ c);\n};\n```\n\n当 `complex` 数是常量时，访问 `real` 部分也应该是有效的。因此，我们还需要该函数的常量版本：\n\n```\n\
  inline const double& real(const complex& c) { return c.r; }\n```\n\n这个函数同样需要 `friend`\
  \ 声明。\n\n在最后两个函数中返回了引用，但这些引用保证不会失效。这些函数（无论是自由形式还是成员形式）显然只有在所引用的对象已创建时才能被调用。我们在语句中使用的数字\
  \ `real` 部分的引用\n\n```\nreal(c)+= 5.;\n```\n\n只存在到语句结束，而与被引用的变量 `c` 相比，后者的寿命更长：直到它定义的作用域结束。我们可以创建一个引用变量：\n\
  \n```\ndouble &rr = real(c);\n```\n\n它将持续到当前作用域结束。即使 `c` 是在同一个作用域内的，C++ 中对象析构的反向顺序也保证了\
  \ `c` 的寿命比 `rr` 长。\n\n临时对象的成员引用可以安全地用在同一个表达式中：\n\n```\ndouble r2= real(complex(3,\
  \ 7)) * 2.0;       // 好的！\n```\n\n临时 `complex` 数字只在语句中存在，但至少活得比其 `real` 部分的引用长，因此该语句是正确的。\n\
  \n我们强烈不建议对临时表达式使用引用。在 C++ 中，绑定到常量引用的对象的生命周期会延长，但这种机制不会通过多次函数调用间接生效，并且仅适用于局部变量而不适用于类成员。这些细微的差异使我们难以证明此类程序的正确性，因此我们建议：\n\
  \n**规则**\n\n不要保留临时表达式的引用！\n\n### 2.6.2 下标运算符\n\n为了遍历 `vector`，我们可以写一个这样的函数：\n\n\
  ```\nclass vector\n{\n  public:\n    double at(int i)\n    {\n        assert (i\
  \ >= 0 && i < my_size);\n        return data[i];\n    }\n};\n```\n\n累加向量 `v` 的元素写法如下：\n\
  \n```\ndouble sum = 0.0;\n\nfor (int i= 0; i < v. size(); ++i)\n    sum += v.at(i);\n\
  ```\n\n`C++` 和 C 使用下标运算符访问（固定大小）数组的元素。因此，对（动态大小的）`vector` 执行同样的操作也是理所当然的。我们可以重写之前的示例：\n\
  \n```\ndouble sum = 0.0;\n\nfor (int i= 0; i < v. size(); ++i)\n    sum += v[i];\n\
  ```\n\n这样更加简洁，并更清晰地展示了我们在做什么。运算符重载的语法与赋值运算符相似，且实现方式与函数 `at` ：\n\n```\nclass vector\n\
  {\n  public:\n    double& operator[](int i)\n    {\n        assert(i >= 0 && i <\
  \ my_size);\n        return data[i];\n    }\n};\n```\n\n通过这个运算符，我们可以用括号访问向量元素，但（在这种形式下）只有当向量是可变的（mutable）时才可以。\n\
  \n### 2.6.3 常量成员函数\n\n这提出了一个更通用的问题：我们如何编写接受常量对象的运算符和成员函数？事实上，运算符是成员函数的特殊形式，可以像成员函数一样被调用：\n\
  \n```\nv[i];               // 是语法糖：\n\nv. operator [](i);\n```\n\n当然，长形式几乎从未使用，但它说明了运算符是普通方法，仅仅提供了额外的调用语法。\n\
  \n自由函数允许限定每个参数的 `const` 属性。成员函数甚至没有提到对象。那么我们如何指定该对象是 `const` 的呢？有一种特殊的符号，可以在函数头之后添加限定符：\n\
  \n```\nclass vector\n{\n  public:\n    const double& operator[](int i) const\n \
  \   {\n        assert(i >= 0 && i < my_size);\n        return data[i];\n    }\n\
  };\n```\n\n`const` 属性不仅仅是程序员不介意用常量对象调用此函数的指示。C++ 编译器对这种常量非常认真，并将验证该函数没有修改对象（即它的某些成员）。常量成员函数可以用非常量对象作为参数进行调用（因为\
  \ C++ 在需要时会将非常量引用转换为常量引用）。因此，通常提供常量成员函数就足够了。例如，这里有一个返回向量大小的函数：\n\n```\nclass vector\n\
  {\n  public:\n    int size() const { return my_size; }\n    // int size() { return\
  \ my_size; } // 无用\n};\n```\n\n非常量 `size` 函数与常量相同，因此是多余的。\n\n对于我们的运算符，我们需要常量和变量的版本。如果我们只有常量成员函数，我们可以读取常量和可变向量的元素，但无法修改后者。\n\
  \n数据成员可以声明为 `mutable`。这样它们甚至可以在 `const` 方法中被更改。这用于内部状态——例如缓存——这些状态不会影响可观测的行为。我们在本书中很少使用这一特性，并建议你仅在真正需要时才使用，因为它可能会危险地破坏语言的数据保护。\n\
  \n#### C++11 2.6.4 引用限定成员\n\n⇒ **`c++11/vector_features.cpp`**\n\n\n\n\n除了对象的常量性（即\
  \ `this` 的常量性）外，在 C++11 中我们还可以要求对象为左值引用或右值引用。假设我们有一个向量加法操作（参见 §2.7.3）。它的结果将是一个非常量的临时对象。因此我们可以对它或其元素进行赋值：\n\
  \n```\n(v + w)= x;      // 无意义的\n\n(v + w)[i]= 7.3; // 更无意义的\n```\n\n诚然，这些都是相当人为为的例子，但它说明了存在改进空间。赋值操作应该只在左侧接受可变的左值。这无无例外地适用于内建类型。对于用户类型，我们必须通过引用限定符来强制执行：\n\
  \n```cpp\nvector& operator =(const vector& src) & { ... }\n```\n\n现在，赋值的左侧只允许可变的左值。\n\
  \n同样地，我们可以处理元素访问的行为。我们的 `vector` 的括号运算符有两个重载：针对可变对象和常量对象。`v+w` 不是常量的，因此优先选择可变向量的重载。因此，我们访问了可变对象成员的可变引用，这是合法的。问题是\
  \ `(v + w)[i]` 是左值，而 `v+w` 不是。我们在这里缺失的要求是：括号运算符只能应用于左值：\n\n```cpp\nclass vector\n\
  {\n  public:\n    double&       operator[](int i) & { ... }      // #1\n\n    const\
  \ double& operator[](int i) const& { ... } // #2\n};\n```\n\n当对方法的其中一个重载使用引用进行限定时，我们必须对其他重载也进行引用限定。通过这种实现方式，重载\
  \ #1 无法用于临时向量，而重载 #2 返回一个常量引用，无法对其赋值。结果，对于上述无意义的赋值，我们将看到编译器错误：\n\n```cpp\nvector_features\
  \ .cpp:167:15: error : read - only variable is not assignable\n\n    (v + w)[i]=\
  \ 3;\n\n    ~~~~~~~~~~^\n```\n\n引用限定保护了我们免受写入访问，但没有防止读取，因为常量左值引用也接受右值。为了避免这种隐式转换，我们也可以实现一个右值重载：\n\
  \n```cpp\nclass vector\n{\n  public:\n    double         operator[](int i) && {\
  \ ... }   // #3\n};\n```\n\n注意，右值通常代表一个即将被销的临时对象，因此我们在这里返回值而不是引用。我们也可以完全禁止对临时对象的元素访问，并对右值运算符进行\
  \ `delete`：\n\n```cpp\nclass vector\n{\n    double operator[](int i) && = delete;\n\
  };\n```\n\n像矩阵这样的多维数据结构可以通过不同的方式访问。首先，我们可以使用函数调用运算符（§3.7），它允许我们传递多个索引作为参数。遗憾的是，括号运算符只接受一个参数，我们在附录\
  \ A.4.3 中讨论了处理这种情况的一些方法，但没有一种是令人满意的。从连接的括号运算符调用应用运算符的高级方法将在第 6.6.1.2 节 中介绍。\n\n\
  ## 2.7 运算符重载设计\n\n除了少数例外（列在 §1.3.10）之外，大多数运算符在 C++ 中都可以重载。然而，某些运算符仅针对特定目的重载才有意义；例如，解引用成员选择\
  \ `p->m` 仅对于实现新的智能指针有用。在科学或工程背景下，如何直观地使用此运算符并不明显。同样，为地址运算符 `&o` 定义自定义含义需要非常充分的理由。\n\
  \n### 2.7.1 保持一致！\n\n如前所述，语言在类运算符的设计和实现上给了我们高度的自由度。我们可以自由地选择每个运算符的语义。然而，我们的自定义行为越接近标准类型的行为，其他人（共同开发者、开源用户等……）就越容易理解我们在做什么，并越信任我们的软件。\n\
  \n重载当然可以用于简洁地表示特定应用领域中的操作，即建立一种*领域特定嵌入式语言*（DSEL）。在这种情况下，偏离运算符的典型含义可能是有益的。尽管如此，DSEL\
  \ 内部应该保持一致。例如，如果定义了运算符 `=`、`+` 和 `+=`，那么表达式 `a= a + b` 和 `a+= b` 应该产生相同的效果。\n\n\
  **一致的重载**\n\n定义的运算符之间要保持一致，并在适当的情况下提供与标准类型相似的语义。\n\n我们也可以自由地选择每个运算符的返回类型；例如，`x ==\
  \ y` 可以返回字符串或文件句柄。再次，自定义运算符越接近标准，大家（包括我们自己）使用它们时工作起来就越容易。\n\n运算符唯一的预定义方面是它们的*元数性*（Arity）：即参数的数量以及运算符的相对优先级。在大多数情况下，这是所表示的操作所固有的：乘法总是接受两个参数。对于某些运算符，可以想象它是可变元数的。例如，如果下标运算符除了被订阅对象外还能接受两个参数，那就太好了，这样我们可以这样访问矩阵：`A[i,\
  \ j]`。唯一允许任意元数的（包括变变实现，§3.11)）运算符是应用运算符：`operator()`。\n\n语言提供的另一个自由是参数类型的选择。例如，我们可以为\
  \ `unsigned` 实现订阅运算符（返回单个元素）、范围（返回子向量）以及集合（返回元素集）。这在 MTL4 中确实实现了。与 MATLAB 相比，C++\
  \ 提供的运算符较少，但我们有无限的机会通过重载它们来创建任何功能。\n\n### 2.7.2 尊重优先级\n\n当我们自己实现运算符时，需要确保 C++ 中的优先级与应用领域的优先级相匹配。例如，我们可能想使用\
  \ L^AT[E] 表示法进行矩阵幂：\n\n```cpp\nA= B²;\n```\n\n*A* 是 *B* 的平方。到目前为止很好。`^` 的原始含义是位异或这并不让我们担心，因为我们从未计划对矩阵执行位运算。现在我们把\
  \ *C* 加到 *B*² 上：\n\n```cpp\nA= B² + C;\n```\n\n看起来很好。但它不起作用（或者结果奇怪）。为什么？因为在 C++\
  \ 中 `+` 的优先级高于 `^`。因此，编译器将我们的表达式理解为：\n\n```cpp\nA= B ^ (2 + C);\n```\n\n哎。虽然运算符符号提供了简洁直观的界面，但某些表达式并不符合我们的预期。因此：\n\
  \n**尊重优先级**\n\n注意你的重载运算符的语义/预期优先级与 **C++** 运算符的优先级匹配。\n\n### 2.7.3 成员函数还是自由函数\n\n\
  大多数运算符可以定义为成员函数或自由函数。以下运算符——简单赋值运算符、`operator[]`、`operator->` 和 `operator()`——必须是方法，因为它们与对象紧密绑定。我们在第\
  \ 2.6 节展示了 `operator[]` 和 `operator()` 的示例。相比之下，第一个参数为基本类型或来自其他软件包的类型的二元运算符只能作为自由函数实现。\n\
  \n\n\n\n\n```cpp\nclass complex\n\n{\n\n  public:\n    explicit complex(double rn\
  \ = 0.0, double in = 0.0)\n      : r{rn}, i{in} {}\n    complex operator+(const\
  \ complex& c2) const\n    {\n        return complex(r + c2.r, i + c2.i);\n    }\n\
  \n    ...\n\n  private:\n    double r, i;\n};\n\nint main()\n\n{\n    complex cc{7.0,\
  \ 8.0}, c4{cc};\n    std::cout << \"cc + c4 is \" << cc + c4 << std::endl;\n}\n\
  ```\n\n我们能将一个 `complex` 和一个 `double` 相加吗？\n\n```cpp\nstd::cout << \"cc + 4.2 is\
  \ \" << cc + 4.2 << std::endl;\n```\n\n用上面的实现是不行的。我们可以为 `operator` 添加一个重载，接受一个 `double`\
  \ 作为第二个参数：\n\n```cpp\nclass complex\n\n{\n    ...\n\n    complex operator+(double\
  \ r2) const\n    {\n        return complex(r + r2, i);\n    }\n\n    ...\n};\n```\n\
  \n或者，我们可以从构造函数中移除 `explicit`。这样 `double` 就可以隐式转换为 `complex`，然后我们就可以两个 `complex`\
  \ 值相加。\n\n这两种方法各有优劣：隐式构造函数通常情况下更灵活，且我们只需要为加法编写一个重载。编写所有三个实现提供了更好的性能。我们也可以同时提供隐式转换和完整的重载；这样我们既拥有性能，又拥有其他操作灵活性。现在我们调换参数：\n\
  \n```cpp\nstd::cout << \"4.2 + c4 is \" << 4.2 + c4 << std::endl;\n```\n\n无法编译。事实上，表达式\
  \ `4.2 + c4` 是以下内容的简写形式：\n\n```cpp\n4.2.operator +(c4)\n```\n\n换句话说，我们正在寻找 `double`\
  \ 中的 `operator`，而它甚至不是一个类。为了提供一个以内置类型作为第一个参数的 `operator`，我们必须编写一个自由函数：\n\n```cpp\n\
  inline complex operator+(double d, const complex& c2)\n{\n    return complex(d +\
  \ real(c2), imag(c2 ));\n}\n```\n\n两个 `complex` 值的加法更自然的表达方式是自由函数：\n\n```cpp\ninline\
  \ complex operator+(const complex& c1, const complex& c2)\n{\n    return complex(real(c1)\
  \ + real(c2), imag(c1) + imag(c2));\n}\n```\n\n为了避免歧义，我们必须移除带有 `complex` 参数的成员函数。\n\
  \n即使我们保留所有三个重载，将它们全部实现为自由函数也更具对称。对于许多应用来说，某个二进制运算符实现为自由函数还是方法并没有太大区别。然而，可能会存在细微的：自由函数通过重载解析进行选择，并对两个参数都可能进行隐式转换；而方法在类派生时会受到重写和名称隐藏的影响（第\
  \ 6 章）。\n\n## 二进制运算符\n\n优先将二进制运算符实现为自由函数。\n\n同样，我们可以将大多数一元操作实现为一元自由函数：\n\n```cpp\n\
  complex operator-(const complex& c1)\n{ return complex(-real(c1), -imag(c1)); }\n\
  ```\n\n或者实现为零参数方法（无参数的方法）：\n\n```cpp\nclass complex\n\n{\n  public:\n    complex\
  \ operator-() const { return complex(-r, -i); }\n};\n```\n\n由于一元操作不会与其他类型组合，且每个类型只有一个重载，方法与自由函数之间的区别不像二进制操作那样产生影响。\n\
  \n最后但同样重要的是，我们还想为流实现一个输出运算符。该运算符接受 `std::ostream` 的可变引用，通常通常是用户类型的常量引用。为了简单起见，让我们继续使用我们的\
  \ `complex` 类：\n\n```cpp\nstd::ostream& operator<<(std::ostream& os, const complex&\
  \ c)\n{\n    return os '(' << real(c) << ',' << imag(c) << \")\";\n}\n```\n\n由于第一个参数是\
  \ `ostream&`，我们无法在 `complex` 中编写成员函数，而向 `std::ostream` 添加成员并不是一个可行方案。通过这个单一实现，我们为所有标准输出流（即派生自\
  \ `std::ostream` 的类）提供了输出功能。\n\n### C++20 2.7.4 重载相等性\n\n⇒ `c++20/equality_rational.cpp`\n\
  \n当然，自第一个 C++ 标准以来，相等运算符就可以被重载。C++20 的新之处在于可以对其进行 `default` 赋值。让我们用第 2.2.2 节中 `rational`\
  \ 类的稍微扩展版本尝试一下：\n\n```cpp\nstruct zero_denominator {};\n\nclass rational\n\n{\n\
  \  public:\n    rational(int p, unsigned q) : p{p}, q{q} {\n        if (q == 0)\n\
  \            throw zero_denominator{};\n    }\n    bool operator ==const rational&\
  \ r2) const = default;\n\n  private:\n    int      p;\n    unsigned q;\n};\n```\n\
  \n只要有相等运算符，无论它是生成的还是手动实现的，从 C++20 开始也会自动生成不等运算符。这允许我们比较两个有理数：\n\n```cpp\nrational\
  \ half{1, 2}, third{1, 3};\n\ncout << \"half == third: \" << boolalpha << (half\
  \ == third);\n\ncout << \"half != third: \" << boolalpha << (half != third);\n```\n\
  \n生成的相等运算符会比较所有 `static` 成员。\n\n### C++20 2.7.5 重载飞船运算符\n\n⇒ `c++20/spaceship_example.cpp`\n\
  \n许多情况下，我们可以让编译器来生成实现：\n\n```cpp\nclass value\n\n{\n  public:\n    explicit value(double\
  \ x) : x{x} {}\n    auto operator<=>(const value& v2) const = default;\n\n  private:\n\
  \    double x;\n};\n```\n\n生成的飞船运算符的行为与 `double` 一。对于具有多个成员和/或基类的类型，它们将按照声明顺序进行字典序比较。`static`\
  \ 成员被排除在比较之外。\n\n不幸的是，我们不能总是依赖生成的运算符，有时需要建立自己的比较行为。当我们这样做时，可以区分以下排序：\n\n**强序（Strong\
  \ ordering）：** 这可能是最符合直觉的排序。对于每一对值 *a* 和 *b*，*a* 要么小于 *b*、大于 *b* 或等于 *b*，且相同的关系对于它们的任何函数的结果也成立，例如：*a\
  \ < b* *→* *f*(*a*) *< f*(*b*) 任意*f*。\n\n\n\n\n**弱序（Weak ordering）：** 它的行为与强序（strong\
  \ ordering）相似，区别在于对值应用函数后，比较结果可能会不同。\n\n**偏序（Partial ordering）：** 这允许某些值对之间是不可比较的，即\
  \ `a` 既不小于、不大于、也不等于 `b`。\n\n当编译器从成员变量中生成飞船运算符（spaceship operator）时，它会采用该类型的排序。当比较多个成员时，其排序是这些成员排序中限制性最小的一个。例如，如果所有排序都是强序或弱序且没有偏序，那么生成的飞船运算符具有弱序。\n\
  \n⇒ **`c++20/spaceship_partial.cpp`**\n\n`partial_ordering` 的一个示例是整数对，当 `a` 的两个值都小于/大于\
  \ `b` 的对应值时，`a` 小于/大于 `b`。当两个成员都相等时，值是`equivalent`（等的），如果上述三个标准都不适用，则为 `unordered`（无序的，仅在\
  \ `partial_ordering` 中定义）：\n\n```\nclass partial\n{\n  public:\n    partial(int\
  \ x, int y) : x{x}, y{y} {}\n\n    bool operator==(const partial&) const = default;\n\
  \n    std::partial_ordering operator⇔(const partial& p2) const {\n        using\
  \ po= std::partial_ordering;\n        if (x < p2.x && y < p2.y)\n            return\
  \ po::less;\n        if (x > p2.x && y > p2.y)\n            return po::greater;\n\
  \        if (x == p2.x && y == p2.y)\n            return po::equivalent;\n     \
  \   return po::unordered;\n    }\n\n  private:\n    int      x, y;\n};\n```\n\n\
  当我们实现自定义的飞船运算符时，编译器没有生成相等和不相等运算符，因此我们必须手动添加。更常用的类型示例是浮点数，它们通常包含一个名为 `NaN`（非数字）的值，用于如\
  \ `0*/0` 或 `∞–∞` 等未定义操作的结果。将 `NaN` 与任何值（包括自身）比较始终返回 `false`。\n\n我们的 `rational` 类型的排序以一种有趣的方式取决于实现：如果我们将分子和分母归约为标准形式，我们就拥有\
  \ `strong_ordering`；如果不归约，则只有 `weak_ordering`。它是弱序，因为我们可以定义不保持顺序的函数。例如，`1*/2` 的不同表示是等等的，但一个返回有理数分数的函数会破坏这种等价性，如下：\n\
  \n```\nrational half1{1, 2}, half2 {2, 4};\n\ncout << \"half1 == half2: \" << boolalpha\
  \ << (half1 == half2) << endl;\n\ncout << \"half1.denominator() == half2.denominator():\
  \ \"\n     << (half1.denominator() == half2.denominator()) << endl;\n```\n\n此外，有理数的非标准表示更容易发生溢出。然而，只要比较实现正确，`strong_ordering`\
  \ 和 `weak_ordering` 之间的区别在实践中可能并不致命。`strong_ordering` 类定义了额外的值 `equal`，它（目前）等同于\
  \ `equivalent`（这是一个双关语）。\n\n在下一章中，我们将看到允许我们为这两种情况实现类的模板，并在 Section 5.2.4 中展示如何根据所选情况定义排序类型。目前，我们硬编码了不归约成员的标准版本：\n\
  \n```\nclass rational\n{\n  public:\n    std::weak_ordering operator⇔(const rational&\
  \ r2) const {\n        using wo= std::weak_ordering;\n        int cmp= p * ll(r2.q)\
  \ - r2.p * ll(q);\n        if (cmp == 0)\n            return wo::equivalent;\n \
  \       else if (cmp < 0)\n            return wo::less;\n        else\n        \
  \    return wo::greater;\n    }\n}\n```\n\n与之前的相等运算符一样，我们首先将分母转换为 `long long`，在这种范围内这比以前更为重要。当我们乘以\
  \ `p` 和 `r2.q` 时，编译器会首先将两个值强制转换为公共类型，而这个类型是一个非常糟糕的选择。相同大小的 `signed` 和 `unsigned`\
  \ 整数的转换会产生相同大小的 `unsigned` 整数。每个负符号 `int` 都会被转换为相当大的 `unsigned`，与这些值的乘积会导致完全无意义的比较。\n\
  \n此外，我们必须承认包含所有这些情况的实现并不特别优雅。我们想要的是类似这样的实现：\n\n```\nstd::weak_ordering operator\
  \ ⇔ (const rational& r2) const {\n    return p * ll(r2.q) - r2.p * ll(q); // 错误：无转换\n\
  }\n```\n\n这是不可行的，因为 `weak_ordering` 没有用于整数值的构造函数。我们当然可以实现一个辅助函数，接收整数、区分所有情况并返回相应的排序值（如示例代码所示），但有更好的方法。Jens\
  \ Maurer——飞船运算符提案的最终作者之一——建议结合我们的计算结果使用飞船运算符：\n\n```cpp\nstd::weak_ordering operator\
  \ ⇔ (const rational& r2) const {\n    return p * ll(r2.q) - r2.p * ll(q); // 错误：无转换\n\
  }\n```\n\n\n\n额外的成员如算术运算是可选的。\n\n### 2.8.2 有理数\n\n实现一个满足以下要求的理数类：\n\n- 分子和分母类型为\
  \ `int`（我们将在随后的章节中更改它）；\n- `rational` 类可以通过 2 个 `int` 值构造；\n- `int` 可以隐式转换为 `rational`；\n\
  - 值始终以归一化的方式存储：\n  - 分母始终为正，且\n  - 分子和分母互质。\n- 实现了基本操作：\n  - 加法；\n  - 减法；\n  - 乘法；以及\n\
  \  - 除法。\n每个操作的结果都是归一化的。\n- 为每个基本操作都提供了复合操作（如 `+=`）；以及\n- 实现了针对 `ostream` 的输出运算符。\n\
  \n额外的功能是可选的。\n\n### 2.8.3 移动赋值\n\n为练习 2.8.1 中的多项式编写一个移动赋值运算符。将拷贝构造函数定义为 `default`。为了测试是否使用了你的赋值，编写一个函数\
  \ `polynomial f(double c2, double c1, double c0)`，它接受三个系数并返回一个多项式。在你的移动赋值中打印一条消息或使用调试器确保你的赋值被调用了。\n\
  \n### 2.8.4 初始化列表\n\n扩展练习 2.8.1 中的程序，增加一个用于初始化列表的构造函数和赋值运算符。之后多项式的次数应为初始化列表的长度减\
  \ 1。\n\n### 2.8.5 资源救援\n\n重构节 2.4.2.5 中的实现。为 `Statement` 实现一个删除器（deleter），并在管理 `ResultSet`\
  \ 时使用它。\n\n## 第 3 章 通用编程\n\n*“人必须始终试图看清真相。这让事物变得通用。”*\n\n—V. S. Naipaul\n\n`Templates`\
  \ 是 C++ 的一种特性，用于创建处理参数（泛型）类型的函数和类。因此，函数或类可以处理许多不同的数据类型，而无需为每种类型手动重写。\n\n`Generic\
  \ Programming` 有时被认为与模板编程同义。但并非如此。通用编程是一种旨在提供正确性的同时追求最大适用性的编程范式。它的主要工具是模板。在数学上，它基于`Formal\
  \ Concept Analysis` [17]。在通用编程中，模板程序包含了正确使用的全部充分条件——这些条件以前只在文档中说明，现在可以通过新的语言特性概念来表达。可以说，通用编程是模板编程的一种负责任的方式。\n\
  \n### 3.1 函数模板\n\n`Function Template`（函数模板——也称为泛型函数）是一个生成可能无限数量函数重载的蓝图。在日常对话中，`Template\
  \ Function` 一词比 function template 使用得更多，而后者是标准中的正确术语。在本书中，我们使用的这两个术语含义相同。\n\n假设我们想写一个函数\
  \ `max(x, y)`，其中 `x` 和 `y` 是某些类型的变量或表达式。使用函数重载，我们可以轻松地如下实现：\n\n```\nint max (int\
  \ a, int b)\n{\n    if (a > b)\n        return a;\n    else\n        return b;\n\
  }\n\ndouble max (double a, double b)\n{\n    if (a > b)\n        return a;\n   \
  \ else\n        return b;\n}\n```\n\n注意，`int` 和 `double` 的函数体是完全相同的。通过模板机制，我们可以只写一个通用的实现：\n\
  \n```\ntemplate <typename T>\nT max (T a, T b)\n{\n    if (a > b)\n        return\
  \ a;\n    else\n        return b;\n}\n```\n\n这个函数模板替换了非模板的重载，我们保留了名称 `max`。它可以像重载函数一样以相同的方式：\n\
  \n```\nstd::cout << \"The maximum of 3 and 5 is \" << max(3, 5) << '\\n';\nstd::cout\
  \ << \"The maximum of 3l and 5l is \" << max(3l, 5l) << '\\n';\nstd::cout << \"\
  The maximum of 3.0 and 5.0 is \" << max(3.0, 5.0) << '\\n';\n```\n\n在第一种情况下，3 和\
  \ 5 是 `int` 类型的字面量，`max` 函数被 `Instantiated` 为：\n\n```\nint max<int>(int, int);\n\
  ```\n\n同样，`max` 的第二次和第三次调用实例化了：\n\n```\nlong max<long>(long, long);\ndouble max<double>(double,\
  \ double);\n```\n\n因为字面量被解释为 `long` 和 `double`。同样，模板函数可以使用变量和表达式调用：\n\n```\nunsigned\
  \ u1= 2, u2= 8;\nstd::cout << \"The maximum of u1 and u2 is \" << max(u1, u2) <<\
  \ '\\n';\nstd::cout << \"The maximum of u1*u2 and u1+u2 is \"\n          << max(u1*u2,\
  \ u1+u2) << '\\n';\n```\n\n在这里，函数为 `unsigned` 实例化了。\n\n在此上下文中，可以使用 `class` 代替 `typename`，但我们不推荐这样做，因为\
  \ `typename` 表达了泛型函数的意图。\n\n### 3.1.1 实例化\n\n`Instantiation` 是什么意思？对于非通用函数，编译器读取其定义、检查错误并生成可执行代码。当编译器处理泛型函数的定义时，它只能检测与模板参数无关的错误，例如解析错误。例如：\n\
  \n```\ntemplate <typename T>\ninline T max (T a, T b)\n{\n    if a > b         //\
  \ 错误！\n        return a;\n    else\n        return b;\n}\n```\n\n无法编译，因为没有括号的 `if`\
  \ 语句不是 C++ 语法的合法表达式。\n\n然而，我们遇到大多数错误取决于替换的类型。例如，以下实现可以编译：\n\n```\ntemplate <typename\
  \ T>\ninline T max(T x, T y)\n{\n    return x > y ? x.value : y.value;\n}\n```\n\
  \n我们无法用任何内置类型（如 `int` 或 `double`）调用它，但函数模板可能并不是为内置类型设计的，它可以与实际参数配合。\n\n\n\n在本节中，我们将仔细观察模板参数如何根据参数按值、左值或右值引用传递来\
  \ get 替换。如第 3.4.1 节所示，当通过 `auto` 自动类型声明变量时，这一知识尤为重要。然而，函数参数的替换规则比 `auto` 变量更直直观，因此我们在这里在这里讨论它们。\n\
  \n### 3.1.2.1 值参数\n\n在以前的示例中，我们直接将类型参数 `T` 作为 `max` 函数的函数参数：\n\n```\ntemplate <typename\
  \ T>\n\nT max (T a, T b);\n```\n\n与任何其他函数参数一样，函数模板的参数也可以带有 `const` 和引用限定：\n\n```\n\
  template <typename T>\n\nT max (const T& a, const T& b);\n```\n\n让我们（在不失泛化的情况下）用一元\
  \ `void` 函数 `f` 来表示这种情况：\n\n```\ntemplate <typename TPara>\n\nvoid f(FPara p);\n\
  ```\n\n其中 `FPara` 包含 `TPara`。当我们调用 `f(arg)` 时，编译器必须推导出类型 `TPara`，使得参数 `p` 能够用 `arg`\
  \ 初始化。这就是故事的梗。但让我们看一些情况来获得直感受。最简单的语法情况是 `TPara` 和 `Fara` 相等：\n\n```\ntemplate <typename\
  \ TPara>\n\nvoid f1(TPara p);\n```\n\n这意味着函数参数是参数的局部拷贝。我们用 `int` 字面量、`int` 变量以及可变和常量的\
  \ `int` 引用调用 `f1`：\n\n```\ntemplate <typename TPara>\n\nvoid f1(TPara p) {}\n\n\
  int main ()\n\n{\n\n    int        i= 0;\n\n    int&       j= i;\n\n    const int&\
  \ k= i;\n\n    f1(3);\n\n    f1(i);\n\n    f1(j);\n\n    f1(k);\n\n    ...\n\n}\n\
  ```\n\n在所有四个实例化中，`TPara` 都被替换为 `int`，使得函数参数 `p` 的类型也是 `int`。因此，如果函数参数是不带限定符的类型参数，`TPara`\
  \ 对应于去掉限定符后的参数类型，例如类型为 `const int&` 的参数会导致类型为 `int` 的函数参数。此模板函数接受所有参数，只要它们的类型在右值情况下可以被拷贝或移动。\n\
  \n作为一个反例，删除了拷贝构造函数的 `unique_ptr` 只能作为临时对象传递：\n\n```\nunique_ptr<int> up;\n\n// f1(up);\
  \                  // 错误：没有拷贝构造函数\n\nf1(move(up));               // 可以：使用移动构造函数\n\
  ```\n\n### 3.1.2.2 左值引用参数\n\n为了真正接受所有参数，我们可以使用引用作为参数：\n\n```\ntemplate <typename\
  \ TPara>\n\nvoid f2(const TPara& p) {}\n```\n\n`TPara` 仍然去掉所有限定符后的参数类型。因此，`p` 是未限定参数类型的常量引用，我们无法修改\
  \ `p`。\n\n更有趣的情况是可变引用作为参数：\n\n```\ntemplate <typename TPara>\n\nvoid f3(TPara& p)\
  \ {}\n```\n\n此函数拒绝所有字面量和临时变量，因为它们不可被引用（(1)）。我们也可以从类型替换的角度来表述：拒绝临时变量是因为不存在某种 `TPara`\
  \ 类型能使得 `TPara&` 变为 `int&&`（我们在讨论第 3.1.2.3 节中的引用折叠时会回到这一点）。当传递普通的 `int` 变量 `i` 时，`TPara`\
  \ 被替换为 `int`，因此 `p` 为 `int&`。传递可变引用 `j` 时也可以可以看到相同的替换。当传递 `const int` 或 `const int&`\
  \ 如 `k` 时会发生什么？这能与 `TPara&` 匹配吗？可以，当 `TPara` 被替换为 `const int` 时，`p` 的类型是 `const\
  \ int&`。因此，`TPara&` 并没有限制参数为引用。然而，如果函数修改了 `p`，实例化将失败。\n\n### C++11 3.1.2.3 右值引用\n\
  \n在第 2.3.5 节中，我们引入了只接受右值的引用。类型为 `T&&` 的引用也接受左值。由于这个原因，Scott Meyers 为它们命名为“通用引用”（Universal\
  \ Reference）。我们将展示为什么它们可以同时接受右值和左值。为此，我们查看以下一元函数的类型替换：\n\n```\ntemplate <typename\
  \ TPara>\n\nvoid f4(TPara&& p) {}\n```\n\n当我们向此函数传递右值时，例如：\n\n```\nf4(3);\n\nf4(move(i));\n\
  \nf4(move(up));\n```\n\n###++11 3.1.2.4 完美转发\n\n在第 2.3.5 节中，我们引入了只接受右值的引用。类型为 `T&&`\
  \ 的引用也接受左值。由于这个原因，Scott Meyers 为它们命名为“通用引用”。我们将展示为什么它们可以同时接受右值和左值。（注：提示中提供的文本有重复/缺失，我将严格按照提供的文本块进行处理。）\n\
  \n*纠正：为了确保准确性，重新处理最后提供的提供的文本块。*\n\n在本节中，我们将仔细观察模板参数如何根据参数按值、左值或右值引用传递来 get 替换。如第\
  \ 3.4.1 节所示，当通过 `auto` 自动类型声明变量时，这一知识尤为重要。然而，函数参数的替换规则比 `auto` 变量更直观，因此我们在这里讨论它们。\n\
  \n### 3.1.2.1 值参数\n\n在以前的示例中，我们直接将类型参数 `T` 作为 `max` 函数的函数参数：\n\n```\ntemplate <typename\
  \ T>\n\nT max (T a, T b);\n```\n\n与任何其他函数参数一样，函数模板的参数也可以带有 `const` 和引用限定：\n\n```\n\
  template <typename T>\n\nT max (const T& a, const T& b);\n```\n\n让我们（在不失泛化的情况下）用一元\
  \ `void` 函数 `f` 来表示这种情况：\n\n```\ntemplate <typename TPara>\n\nvoid f(FPara p);\n\
  ```\n\n其中 `FPara` 包含 `TPara`。当我们调用 `f(arg)` 时，编译器必须推导出类型 `TPara`，使得参数 `p` 能够用 `arg`\
  \ 初始化。这就是故事的梗。但让我们看一些情况来获得直感受。最简单的语法情况是 `TPara` 和 `Fara` 相等：\n\n```\ntemplate <typename\
  \ TPara>\n\nvoid f1(TPara p);\n```\n\n这意味着函数参数是参数的局部拷贝。我们用 `int` 字面量、`int` 变量以及可变和常量的\
  \ `int` 引用调用 `f1`：\n\n```\ntemplate <typename TPara>\n\nvoid f1(TPara p) {}\n\n\
  int main ()\n\n{\n\n    int        i= 0;\n\n    int&       j= i;\n\n    const int&\
  \ k= i;\n\n    f1(3);\n\n    f1(i);\n\n    f1(j);\n\n    f1(k);\n\n    ...\n\n}\n\
  ```\n\n在所有四个实例化中，`TPara` 都被替换为 `int`，使得函数参数 `p` 的类型也是 `int`。因此，如果函数参数是不带限定符的类型参数，`TPara`\
  \ 对应于去掉限定符后的参数类型，例如类型为 `const int&` 的参数会导致类型为 `int` 的函数参数。此模板函数接受所有参数，只要它们的类型在右值情况下可以被拷贝或移动。\n\
  \n作为一个反例，删除了拷贝构造函数的 `unique_ptr` 只能作为临时对象传递：\n\n```\nunique_ptr<int> up;\n\n// f1(up);\
  \                  // 错误：没有拷贝构造函数\n\nf1(move(up));               // 可以：使用移动构造函数\n\
  ```\n\n### 3.1.2.2 左值引用参数\n\n为了真正接受所有参数，我们可以使用引用作为参数：\n\n```\ntemplate <typename\
  \ TPara>\n\nvoid f2(const TPara& p) {}\n```\n\n`TPara` 仍然去掉所有限定符后的参数类型。因此，`p` 是未限定参数类型的常量引用，我们无法修改\
  \ `p`。\n\n更有趣的情况是可变引用作为参数：\n\n```\ntemplate <typename TPara>\n\nvoid f3(TPara& p)\
  \ {}\n```\n\n此函数拒绝所有字面量和临时变量，因为它们不可被引用（(1)）。我们也可以从类型替换的角度来表述：拒绝临时变量是因为不存在某种 `TPara`\
  \ 类型能使得 `TPara&` 变为 `int&&`（我们在讨论第 3.1.2.3 节中的引用折叠时会回到这一点）。当传递普通的 `int` 变量 `i` 时，`TPara`\
  \ 被替换为 `int`，因此 `p` 为 `int&`。传递可变引用 `j` 时也可以可以看到相同的替换。当传递 `const int` 或 `const int&`\
  \ 如 `k` 时会发生什么？这能与 `TPara&` 匹配吗？可以，当 `TPara` 被替换为 `const int` 时，`p` 的类型是 `const\
  \ int&`。因此，`TPara&` 并没有限制参数为引用。然而，如果函数修改了 `p`，实例化将失败。\n\n### C++11 3.1.2.3 右值引用\n\
  \n在第 2.3.5 节中，我们引入了只接受右值的引用。类型为 `T&&` 的引用也接受左值。由于这个原因，Scott Meyers 为它们命名为“通用引用”（Universal\
  \ Reference）。我们将展示为什么它们可以同时接受右值和左值。为此，我们查看以下一元函数的类型替换：\n\n```\ntemplate <typename\
  \ TPara>\n\nvoid f4(TPara&& p) {}\n```\n\n当我们向此函数传递右值时，例如：\n\n```\nf4(3);\n\nf4(move(i));\n\
  \nf4(move(up));\n```\n\n\n\nC++11 在第 2.3.5 节 中提到过，两个 `&` 表示右值引用——当没有完全替换这些函数参数时，这是正确的。这引出了问题：我们如何为右值编写泛型函数？一种方法是使用相应的左值引用对函数进行重载，并\
  \ `delete` 掉该重载：\n\n```cpp\ntemplate <typename T>\nvoid rvalue_only1(T&& arg)\n\
  {\n     // ...\n}\n\ntemplate <typename T>\nvoid rvalue_only1(T&) = delete;\n```\n\
  \n当我们只用右值调用此函数时，只有第一个重载会匹配，并且函数会按预期执行。对于任何左值参数——包括 `const` 左值——第二个重载是更好的匹配项，编译器会抛出错误。\n\
  \n或者，我们也可以制不使用重载，而是添加一个 `static_assert` 来确保我们的参数确实是右值引用：\n\n```cpp\ntemplate <typename\
  \ T>\nvoid rvalue_only2(T&& arg)\n{\n     static_assert(is_rvalue_reference<decltype(arg)>::value,\n\
  \                   \"此函数仅允许右值使用!\");\n     // ...\n}\n```\n\n`is_rvalue_reference`\
  \ 是所谓的类型特性，我们将在第 5.2.1 节 中详细讨论。这个版本的优势在于我们可以选择错误信息。此外，当我们有多个右值参数时，我们可以在随后的静态断言中对它们进行测试，而第一方法需要为每个右值参数提供一个重载（如果我们不想产生关于歧义的混淆错误信息，则需要为所有组合提供）。\n\
  \n### 3.1.3 处理模板中的错误\n\n回到我们适用于所有数值类型的 `max` 示例。但对于没有提供 `operator>` 的类型会发生什么呢，例如\
  \ `std::complex<T>`？让我们尝试编译以下代码段：^(3)\n\n```cpp\nstd::complex<float> z(3, 2), c(4,\
  \ 8);\nstd::cout << \"The maximum of c and z is \" << ::max(c, z) << '\\n';\n```\n\
  \n3。`max` 前面的双冒号是为了避免与某些可能隐式包含的标准库 `max`（例如 `g++`）产生歧义。\n\n我们的编译尝试将以如下错误结束：\n\n\
  ```\nError: no match for operator> in a > b\n```\n\n当我们的模板函数调用另一个模板函数，而该函数又调用另一个函数…………以此类推时，会发生什么？同样，这些函数只被解析，完整的检查被延迟到实例化。让我们来看下面的程序：\n\
  \n```cpp\nint main ()\n{\n    vector<complex<float> > v;\n    sort(v.begin(), v.end());\n\
  }\n```\n\n不谈细节，问题和之前一样：我们无法比较 `complex` 数，因此无法对它们的数组进行排序。这次，缺失的比较是在一个间接调用的函数发现的，编译器为我们提供了整个调用栈和包含栈，以便我们追溯错误。请尝试在不同的编译器上编译此示例，看看是否能理解这些错误信息。\n\
  \n如果你遇到了这样冗长的错误信息，^(4) **不要惊慌！** 首先查看错误本身并提取对你有用的部分：例如，缺少 `operator>`，或者某些内容不可赋值，或者某些不应该是\
  \ `const` 的东西是 `const` 了。然后在调用栈中找到属于你程序的最内层代码，即你从标准库或第三方库调用模板函数的位置。盯着这段代码及其之前的几行看一会儿，因为这最可能是错误发生的地方（根据我们的经验）。然后问问自己：根据错误信息，函数模板参数的某种类型是否缺少某个运算符或函数？\n\
  \n4。我们听过的最长信息是 18MB，对应于大约 9000 页文本。\n\n不要被吓到决定余生都不再使用模板。在大多数情况下，问题比那条没完没了的错误信息所让我们信的的要简单得多。根据我们的经验，经过一些训练，模板函数中的大多数错误可以比运行时错误更快找到。\n\
  \n使用 C++20 概念（concepts，将在第 3.10 节 中引入）表达函数需求可以导致更短但更易理解的错误信息。\n\n### 3.1.4 混合类型\n\
  \n另一个我们到为止还没有回答的问题：当我们使用两个不同类型作为参数时，我们的函数 `max` 会发生什么？\n\n```cpp\nunsigned u1= 2;\n\
  int i= 3;\nstd::cout << \"The maximum of u1 and i is \" << max(u1, i) << '\\n';\n\
  ```\n\n编译器告诉我们——这次出奇地简短——类似：\n\n```\nError: no match for function call max(unsigned\
  \ int&, int)\n```\n\n事实上，我们假设这两种类型是相等的。但等等，当没有精确匹配时，C++ 不会隐式转换参数吗？是的，它会，但对于类型推导参数不会。\n\
  \n到目前为止情况都不妙。我们可以写一个带有模板参数的函数吗？当然可以。但这产生了一个新问题：这个模板的 `return` 类型应该是什么？有不同的选择。首先，我们可以添加非模板重载，如：\n\
  \n```cpp\ninline int max (int a, int b) { return a > b; }\n```\n\n这可以使用混合类型调用，并且\
  \ `unsigned` 参数会被隐式转换为 `int`。但如果我们也为 `unsigned` 添加另一个函数会发生什么？\n\n```cpp\ninline\
  \ int max(unsigned a, unsigned b) { return a > b; }\n```\n\n无论如何，在模板实现中添加相同代码非模板重载既不优雅也不高效。因此，我们移除所有非模板重载，首先看看在函数调用中可以做什么。我们可以显式地将一个参数转换为另一个的类型：\n\
  \n```cpp\nunsigned u1= 2;\nint i= 3;\nstd::cout << \"The maximum of u1 and i is\
  \ \" << max(int(u1), i) << '\\n';\n```\n\n现在，`max` 使用两个 `int` 调用。另一种选择是在函数调用中指定模板类型，以避免问题的类型推导：\n\
  \n```cpp\nstd::cout << \"The maximum of u1 and i is \" << max<int>(u1, i) << '\\\
  n';\n```\n\n那么两个参数都是 `int`，当两个参数都是 `int` 或隐式转换为 `int` 时，就可以调用函数模板的实例。\n\n在这些关于模板不太愉快的细节之后，有一个非常好的消息：模板函数的执行效率与它们的非模板副本一样！原因是\
  \ C++ 为每个实例化的类型或类型组合生成了新代码。相比之下，Java 只编译一次模板，并通过将它们转换为相应的类型来执行。这导致了更快的编译和更短的可执行文件，但花费了更多时间。\n\
  \n快速模板的另一个代价是由于每个类型（组合）的多次实例化，我们的执行文件更长。在极端（罕见）的情况下，较大的二进制文件可能会导致执行变慢，因为更快的内存(5)\
  \ 被汇编指令填充，而数据必须从较慢的内存加载和存储。\n\n5。L2 和 L3 缓存通常在数据和指令之间共享。\n\n\n\n### C++11 3.1.5\
  \ 统一初始化\n\n统一初始化（来自§2.3.4）也适用于模板。然而，在极少数情况下，括号消除（brace elimination）可能会导致某些令人惊讶的行为。如果你好奇或已经遇到过一些惊喜，请阅读附录\
  \ A.6.1。\n\n### C++14 3.1.6 自动返回值\n\n从 C++14 开始，我们可以让编译器推导函数的 `return` 类型：\n\n```cpp\n\
  template <typename T, typename U>\nauto max (T a, U b)\n{\n    return a > b ? a\
  \ : b;\n}\n```\n\n`return` 类型从 `return` 语句中的表达式推导出来，其方式与函数模板参数从参数推导的方式相同。如果函数包含多个\
  \ `return` 语句，它们的推导类型必须全部相等。在模板库中，有时简单函数的 `return` 类型声明非常冗长——甚至比函数体还要长——对于程序员来说，不需要手动写出这些类型是一个极大的解脱。\n\
  \n### C++20 3.1.7 简洁模板参数\n\n⇒ `c++20/auto_parameters.cpp`\n\nC++20 引入了另一种简洁的函数表示法：使用\
  \ `auto` 作为函数参数。这允许我们在无需第一行代码的情况下实现上一节中的 `max` 函数：\n\n```cpp\nauto max(auto a, auto\
  \ b)\n{\n    return a > b ? a : b;\n}\n```\n\n函数的每个 `auto` 参数都会隐式引入一个新的类型参数。\n\n\
  ### 3.2 命名空间与函数查找\n\n命名空间并不是泛型编程的一个主题（事实上它们与其是完全正交的）。然而，在存在函数模板的情况下它们变得更加重要，因此这是书中讨论它们的好地方。\n\
  \n### 3.2.1 命名空间\n\n命名空间的动机是像 `min`、`max` 或 `abs` 等常用名称可以在不同的上下文中定义；因此这些名称可能会歧义。即使在实现函数或类时唯一的名称，在之后包含更多库或包含的库发生进时也可能发生冲突。例如，GUI\
  \ 实现中通常有一个名为 `window` 的类，而在统计库中也可能有一个。我们可以通过命名空间来区分它们：\n\n```cpp\nnamespace GUI\
  \ {\n   class window;\n}\n\nnamespace statistics {\n   class window;\n}\n```\n\n\
  处理命名冲突的一种可能性是使用不同的名称，如 `abs`、`my_abs` 或 `library_name_abs`。这实际上是 C 中的做法。广泛使用的库通常使用短函数名，用户库使用较长的名称，与操作系统相关的内部实现通常以\
  \ `_` 开头。这降低了冲突的概率，但并不充分。当我们编写自己的类时命名空间非常重要，当它们用于函数模板时更是如此。它们允许我们对软件中的名称进行分层结构。这避免了命名冲突，并为函数和类名提供了复杂的访问控制。\n\
  \n命名空间与作用域相似之处在于我们可以看到外部命名空间中的名称：\n\n```cpp\nstruct global {};\nnamespace c1 {\n\
  \    struct c1c {};\n    namespace c2 {\n        struct c2c {};\n        struct\
  \ cc {\n            global x;\n            c1c    y;\n            c2c    z;\n  \
  \      };\n    } // namespace c2\n} // namespace c1\n```\n\n在内部命名空间中重定义的名称会隐藏外部的名称。与块不同，外部名称对我们并没有丢失，仍然可以通过*命名空间限定*（Namespace\
  \ Qualification）来使用：\n\n```cpp\nstruct same {};\nnamespace c1 {\n    struct same\
  \ {};\n    namespace c2 {\n        struct same {};\n        struct csame {\n   \
  \         :: same    x;\n            c1:: same  y;\n            same       z;\n\
  \        };\n    } // namespace c2\n} // namespace c1\n```\n\n正如你所猜想的，`::same` 指全局命名空间中的类型，`c1::same`\
  \ 指 `c1` 中的名称。由于内部名称隐藏了外部名称，成员变量 `z` 的类型为 `c1::c2::same`。命名空间是从内向查找的。如果在 `c2` 中添加一个命名空间\
  \ `c1`，这将隐藏具有同名的外部命名空间，`y` 的类型将变得错误：\n\n```cpp\nstruct same {};\nnamespace c1 {\n\
  \    struct same {};\n    namespace c2 {\n        struct same {};\n        namespace\
  \ c1 {} // 隐藏了 ::c1\n        struct csame {\n            ::same    x;\n        \
  \    c1::same y; // 错误：未定义 c1::c2::c1::same\n            same      z;\n        };\n\
  \    } // namespace c2\n} // namespace c1\n```\n\n在这里，`c1::same` 存在于全局命名空间，但由于 `c1`\
  \ 被 `c1::c2::c1` 隐藏，我们无法访问它。如果在命名空间 `c2` 中定义名为 `c1` 的 `class`，也会观察类似的隐藏。通过在命名空间前面加上双冒号，我们可以避免隐藏并更显式地指定\
  \ `y` 的类型：\n\n```cpp\nstruct csame {\n   ::c1::same    y; // 这是唯一的\n};\n```\n\n\
  这清楚地表示我们需要全局命名空间中的名称 `c1` 而不是其他名称。需要的函数或类名可以通过在命名空间前加双冒号来导入。\n\n#### 3.2.2 参数依赖的查找\n\
  \n*参数依赖查找*（Argument-Dependent Lookup，简称 ADL）将函数的查找范围扩展到参数所在的命名空间——而不是它们各自的父级命名空间。这为我们节省了函数的冗长命名空间限定。假设我们在\
  \ `rocketscience` 命名空间内编写最终科学库：\n\n\n\n\n```cpp\nnamespace rocketscience {\n\n \
  \   struct matrix {};\n\n    template <typename LinOp>\n\n    void initialize(LinOp&\
  \ A) { /* ... */ }\n\n    matrix operator+(const matrix& A, const matrix& B)\n\n\
  \    {\n\n        matrix C;\n        initialize(C); // 未限定，相同命名空间\n\n        add(A,\
  \ B, C);\n\n        return C;\n\n    }\n\n}\n```\n\n每当我们使用函数 `initialize`（假定它只定义在\
  \ `rocketscience` 中）时，我们可以省略对 `rocketscience` 命名空间下所有类的限定：\n\n```cpp\nint main ()\n\
  \n{\n\n    rocketscience::matrix A, B, C, D;\n\n    rocketscience::initialize(B);\
  \ // 限定\n\n    initialize(C); // 依赖 ADL\n\n    chez_herbert::matrix E, F, G;\n\n\
  \    rocketscience::initialize(E); // 需要限定\n\n    initialize(F);               \
  \  // 错误：未找到 initialize\n\n}\n```\n\n运算符也受 ADL 影响：\n\n```cpp\nA= B + C + D;\n```\n\
  \n想象一下没有 ADL 时的上述表达式：\n\n```cpp\nA= rocketscience::operator+(rocketscience::operator+(B,\
  \ C), D);\n```\n\n同样丑陋甚至更繁琐的是当必须限定命名空间时的流式 I/O。由于用户代码不应该位于 `std` 命名空间中，因此某个类的 `operator≪`\
  \ 最好定义在该类所属的命名空间中。这允许 ADL 为每个类型找到正确的重载，例如：\n\n```cpp\nstd::cout ≪ A ≪ E ≪ B ≪ F\
  \ ≪ std::endl;\n```\n\n如果没有 ADL，我们需要在其冗长的表示法中为每个运算符限定命名空间。这将导致上述表达式变为：\n\n```cpp\n\
  std::operator≪(chez_herbert::operator≪(\n\n    rocketscience::operator≪(chez_herbert::operator≪(\n\
  \n        rocketscience::operator≪(std::cout, A), E), B),\n\n    F), std::endl);\n\
  ```\n\nADL 机制还可以用于当类分布在多个命名空间时，选择正确的函数模板重载。线性代数中的 `L[1]` 范数（也称为曼哈顿范数）对矩阵和向量都有定义，我们希望为两者都提供模板实现：\n\
  \n```cpp\ntemplate <typename Matrix>\n\ndouble one_norm(const Matrix& A) { ... }\n\
  \ntemplate <typename Vector>\n\ndouble one_norm(const Vector& x) { ... }\n```\n\n\
  编译器如何知道我们对每个类型偏向于哪种重载？一种可能的解决方案是为矩阵和向量引入不同的命名空间，以便通过 ADL 选择正确的重载：\n\n```cpp\nnamespace\
  \ rocketscience {\n\n    namespace mat {\n\n        struct sparse_matrix {};\n\n\
  \        struct dense_matrix {};\n\n        struct über_matrix6 {};\n\n        template\
  \ <typename Matrix>\n\n        double one_norm(const Matrix& A) { ... }\n\n    }\n\
  \    namespace vec {\n\n        struct sparse_vector {};\n\n        struct dense_vector\
  \ {};\n\n        struct über_vector {};\n\n        template <typename Vector>\n\n\
  \        double one_norm(const Vector& x) { ... }\n\n    }\n\n}\n```\n\nADL 机制仅在参数类型声明的命名空间中搜索函数，而不在它们各自的父命名空间中搜索：\n\
  \n```cpp\nnamespace rocketscience {\n\n    ...\n\n    namespace vec {\n\n      \
  \  struct sparse_vector {};\n\n        struct dense_vector {};\n\n        struct\
  \ über_vector {};\n\n    }\n\n    template <typename Vector>\n\n    double one_norm(const\
  \ Vector& x) { ... }\n}\n\nint main ()\n\n{\n\n    rocketscience::vec::über_vector\
  \ x;\n\n    double norm_x= one_norm(x);       // 错误：ADL 未找到\n\n}\n```\n\n[6]。当然，我们使用了\
  \ `uber` 的原始德语拼写——有时在美国论文中也会看到。请注意，某些编译器（例如 `g++-9`）处理非 ASCII 字符存在有问题。\n\n此外，当我们将名称导入另一个命名空间时，该命名空间中的函数也不会被\
  \ ADL 考虑：\n\n```cpp\nnamespace rocketscience {\n\n    ...\n\n    using vec::über_vector;\n\
  \n    template <typename Vector>\n\n    double one_norm(const Vector& x) { ... }\n\
  \n}\n\nint main ()\n\n{\n\n    rocketscience::über_vector x;\n\n    double norm_x=\
  \ one_norm(x);      // 错误：ADL 未找到\n\n}\n```\n\n仅依赖 ADL 来选择正确的重载是有其局限性的。当我们使用第三方库时，可能会发现一些我们在自己的命名空间中也实现的函数和运算符。通过使用\
  \ `using` 导入单个函数而不是整个命名空间，可以减少这种歧义性（但无法完全避免）。\n\n多参数函数的歧义概率会随之进一步上升，特别是当参数类型来自不同的命名空间时，例如：\n\
  \n```cpp\nnamespace rocketscience {\n\n    namespace mat {\n\n        ...\n\n  \
  \      template <typename Scalar, typename Matrix>\n\n        Matrix operator*(const\
  \ Scalar& a, const Matrix& A) { ... }\n\n    }\n    namespace vec {\n\n        ...\n\
  \n        template <typename Scalar, typename Vector>\n\n        Vector operator*(const\
  \ Scalar& a, const Vector& x) { ... }\n\n        template <typename Matrix, typename\
  \ Vector>\n\n        Vector operator*(const Matrix& A, const Vector& x) { ... }\n\
  \    }\n\n}\n\nint main (int argc, char* argv[])\n\n{\n\n    rocketscience::mat::über_matrix\
  \ A;\n\n    rocketscience::vec::über_vector x, y;\n\n    y= A * x;             \
  \        // 选择了哪个重载？\n}\n```\n\n\n\n\n```cpp\ntemplate <typename T, typename U>\n\
  inline void some_function(T& x, T& y, const U& z, int i)\n{\n    ...\n    std::swap(x,\
  \ y); // can be expensive\n    ...\n};\n```\n\n我们采取了稳妥的方法，使用了标准的 `swap` 函数，它适用于所有可拷贝类型。但我们拷贝了\
  \ 3GB 的数据。使用只交换指针的自定义实现会快得多且节省内存。这可以通过通用的方式进行少量更改来实现：\n\n```cpp\ntemplate <typename\
  \ T, typename U>\n\ninline void some_function(T& x, T& y, const U& z, int i)\n{\n\
  \    using std::swap;\n\n    ...\n\n    swap(x, y); // involves ADL\n\n    ...\n\
  }\n```\n\n通过这种实现，两个 `swap` 重载版本都是候选者，但我们类中的那个在重载解析中会被优先考虑，因为它的参数类型比标准实现的更具体。更通用地说，对用户类型的任何实现都比\
  \ `std::swap` 具体。事实上，由于相同的原因，`std::swap` 已经对标准容器进行了重载。这是一个通用模式：\n\n使用 `using`\n\n\
  不要对可能存在用户类型重载的函数模板限定命名空间。相反，让名称可见并以不带限定符的方式调用函数。\n\nC++11 作为默认 `swap` 实现的补充：从 C++11\
  \ 开始，默认行为是在可能的情况下在两个参数和临时变量之间移动值：\n\n```cpp\ntemplate <typename T>\ninline void\
  \ swap(T& x, T& y)\n{\n    T tmp(move(x));\n    x= move(y);\n    y= move(tmp);\n\
  }\n```\n\n结果是，对于没有定义 `swap` 的类型，当它们提供了快速的移动构造函数和赋值运算符时，可以高效地交换。只有没有用户实现和移动支持的类型最终会被拷贝。\n\
  \n## 3.3 类模板\n\n在介绍命名空间之前，我们描述了使用模板创建泛型函数。模板也可以用于创建泛型类。类似于泛型函数，类模板（class template）是标准中的正确术语，而模板类（template\
  \ class 或 templated class）在日常生活中更常用。在这些类中，数据成员的类型可以是参数化的。\n\n这对于像 vector、矩阵和列表这样的通用容器类来说特别有用。我们还可以用参数化值类型来扩展复杂类。然而，我们已经在这个类上花费了这么多时间，看起来看其他东西更有趣。\n\
  \n### 3.3.1 容器示例\n\n⇒ `c++11/vector_template.cpp`\n\n例如，让我们写一个泛型 vector 类，是线性代数意义上的，而不是像\
  \ STL vector。首先，我们实现一个只包含最基础运算符的类：\n\n**列表 3–1：模板 vector 类**\n\n```cpp\ntemplate\
  \ <typename T>\nclass vector\n{\n  public:\n    explicit vector(int size)\n    \
  \  : my_size{size}, data{new T[my_size]}\n    {}\n\n    vector(const vector& that)\n\
  \      : my_size{that.my_size}, data{new T[my_size]}\n    {\n        std::copy(&that.data[0],\
  \ &that.data[that.my_size], &data[0]);\n    }\n\n    int size() const { return my_size;\
  \ }\n\n    const T& operator[](int i) const\n    {\n        check_index(i);\n  \
  \      return data[i];\n    }\n\n    // ...\n  private:\n    int               \
  \    my_size;\n    std::unique_ptr<T[]> data;\n};\n```\n\n模板类在本质上与非模板类没有区别。唯一的额外参数\
  \ `T` 是其元素类型的占位符。我们拥有像 `my_size` 这样的成员变量和像 `size()` 这样的成员函数，它们不受模板参数的影响。其他函数（如下标运算符或拷贝构造函数）是参数化的，仍然类似于它们：：之前使用\
  \ `double` 的地方，现在我们在 `return` 类型或分配中放置了类型参数 `T`。同样，成员变量 `data` 只是通过 `T` 参数化的。\n\n\
  模板参数可以有默认值。假设我们的 vector 类不仅参数化值类型，还参数化方向和位置：\n\n```cpp\nstruct row_major {}; //\
  \ 仅用于标记\nstruct col_major {}; // 亦之\nstruct heap {};\nstruct stack {};\n\ntemplate\
  \ <typename T= double, typename Orientation= col_major,\n          typename Where=\
  \ heap>\nclass vector;\n```\n\nvector 的参数可以完全声明：\n\n```cpp\nvector<float, row_major,\
  \ heap>v;\n```\n\n如果最后一个参数等于默认值，则可以省略：\n\n```cpp\nvector<float, row_major>v;\n```\n\
  \n对于函数，只有最后的参数可以省略。例如，如果第二个参数是默认的而最后一个不是，我们必须全部写下它们：\n\n```cpp\nvector<float, col_major,\
  \ stack>w;\n```\n\n当所有模板参数都设置为默认值时，我们当然可以省略它们。但由于此处未讨论的语法原因，仍然需要写括号：\n\n```cpp\n\
  vector    x; // C++17 中的特殊含义（参见 §3.4.4），之前是错误的\nvector<> y; // 看起来有点奇怪但正确的\n```\n\
  \n模板默认值可以引用之前的参数：\n\n```cpp\ntemplate <typename T, typename U=T>\n```\n\n\n\n在这里，类型和大小是推导出来的。这意味着如果我们对两个类型相同但大小不同的数组进行求和，该函数将被实例化两次。尽管如此，这不会影响可执行文件的大小，因为这些短小的函数通常会被内联。\n\
  \n### 3.3.2.2 列表项求和\n\n列表（list）是一种简单的数据结构，其元素包含一个值和一个指向下一个元素的引用（有时也包含指向上一个元素的引用）。在\
  \ C++ 标准库中，类模板 `std::list` 是双向链表 (§4.1.3.3），而没有后向引用的列表在 C++11 中作为 `std::forward_list`\
  \ 被引入。这里我们只考虑前向引用：\n\n```cpp\ntemplate <typename T>\nstruct list_entry\n{\n    list_entry(const\
  \ T& value) : value{value}, next{nullptr} {}\n    T               value;\n    list_entry<T>*\
  \ next;\n};\n\ntemplate <typename T>\nstruct list\n{\n    list() : first{nullptr},\
  \ last{nullptr} {}\n    ~list()\n    {\n        while (first) {\n            list_entry<T>\
  \ *tmp= first->next;\n            delete first;\n            first= tmp;\n     \
  \   }\n    }\n    void append(const T& x)\n    {\n        last= (first? last->next\
  \ : first)= new list_entry<T>(x);\n    }\n    list_entry<T> *first, *last;\n};\n\
  ```\n\n这个 `list` 实现实际上非常精简且有些简练。有了现有的接口，我们可以设置一个小列表：\n\n```cpp\nlist<float> l;\n\
  l.append(2.0f); l.append(4.0f); l.append(7.0f);\n```\n\n请随时使用 `initializer_list`\
  \ 构造等有用方法丰富我们的代码。为这个 `list` 编写求和函数是非常直接的：\n\n**列表 3–2: 列表项之和**\n\n```cpp\ntemplate\
  \ <typename T>\nT sum(const list <T>& l)\n{\n    T sum= 0;\n    for (auto entry=\
  \ l.first; entry != nullptr; entry= entry ->next)\n        sum+= entry ->value;\n\
  \    return sum;\n}\n```\n\n并且可以用显而易见的方式调用。我们强调了与数组实现不同的细节。\n\n### 3.3.2.3 差异与共同点\n\
  \n当我们目标是通用接口时，我们必须先问自己：这两个 `sum` 实现有多相似？初一看，并不很像：\n\n• 值的访问方式不同；\n• 元素遍历的实现方式不同；以及\n\
  • 终止标准也不同。\n\n然而，在更抽象的层面上，两个函数执行了相同的任务：\n\n• 访问数据；\n• 移动到下一个元素；以及\n• 检查是否结束。\n\n\
  两种实现之间的区别在于如何利用类型的接口来实现这些任务。因此，为了为两种类型提供单一的泛型函数，我们必须建立一个通用接口。\n\n### 3.3.2.4 另一种数组求和\n\
  \n在第 3.3.2.1 节 中，我们以索引风格访问数组，这种方式无法应用于内存中随机分散的列表（至少不能高效地）。因此，我们在这里用更具顺序性的、带有步进遍历的方式重新实现了数组求和。我们可以通过增加指针直到越过数组末尾来实现。数组之外的第一个地址是\
  \ `&a[n]`，或者用指针运算更简洁地表示为 `a + n`。图 3–1 阐明了我们从 `a` 的地址开始遍历，并在到达 `a+n` 时停止。因此，我们通过地址的右开区间来指定元素的范围。\n\
  \n![Images](img/03fig01.jpg)\n\n**图 3–1: 长度为 *n* 带有起始和结束指针的数组**\n\n当为了最大适用性而编写软件时，右开区间证明比闭闭区间更灵活，特别是对于像列表这样位置无法（高效地）通过\
  \ `<` 进行比较的类型。右开区间上的求和可以如列表 3-3 所示所示。\n\n**列表 3-3: 数组项之和**\n\n```cpp\ntemplate <typename\
  \ T>\ninline T accumulate_array(T* a,T* a_end)\n{\n    T sum(0);\n    for (; a !=\
  \ a_end; ++a)\n        sum+= *a;\n    return sum;\n}\n```\n\n用法如下：\n\n```cpp\nint\
  \    ai[]= {2, 4, 7};\ndouble ad[]= {2., 4.5, 7.};\ncout ≪ \"sum ai is \" ≪ accumulate_array(ai,\
  \ &ai[3]) ≪ '\\n';\ncout ≪ \"sum ad is \" ≪ accumulate_array(ad, ad+3) ≪ '\\n';\n\
  ```\n\n像上面那样表示右开区间的对对指针是一个 `Range`（范围）：这是 C++ 中一个非常重要的概念。标准库中的许多算法都是针对指针类对象的范围实现的，其风格与\
  \ `accumulate_array` 类似。为了将此类函数用于新容器，我们需要一个迭代器。\n\n### 3.3.2.5 泛型求和\n\n我们现在需要的是一个提供类似指针语法的迭代器，即：\n\
  \n• 用 `++it` 遍历序列；\n• 用 `*it` 访问值；\n• 用 `==` 或 `!=` 比较迭代器。\n\n实现非常直接：\n\n```cpp\n\
  template <typename T>\nstruct list_iterator\n{\n    using value_type= T;\n    list_iterator(list_entry<T>*\
  \ entry) : entry{entry} {}\n    T& operator*() { return entry->value; }\n    const\
  \ T& operator*() const\n    { return entry->value; }\n    list_iterator<T>& operator++()\n\
  \    { entry= entry->next; return *this; }\n    bool operator!==(const list_iterator<T>&\
  \ other) const\n    { return entry != other.entry; }\n    list_entry<T>* entry;\n\
  };\n```\n\n为了方便，为我们的 `list` 添加 `begin` 和 `end` 方法：\n\n```cpp\ntemplate <typename\
  \ T>\nstruct list\n{\n    list_iterator<T> begin() { return list_iterator<T>(first);\
  \ }\n    list_iterator<T> end() { return list_iterator<T>(0); }\n}\n```\n\n`list_iterator`\
  \ 允许我们将列表 3-2 和列表 3-3 合并为 `accumulate`：\n\n```cpp\ntemplate <typename Iter , typename\
  \ T>\ninline T accumulate(Iter it, Iter end, T init)\n{\n    for (; it != end; ++it)\n\
  \        init+= *it;\n    return init;\n}\n```\n\n这个泛型 `sum` 可以以以下形式用于数组和列表：\n\n\
  ```cpp\ncout ≪ \"array sum = \" ≪ accumulate(a, a+10, 0.0) ≪ '\\n';\ncout ≪ \"list\
  \ sum = \" ≪ accumulate(l.begin(), l.end(), 0) ≪ '\\n';\n```\n\n和之前一样，成功的关键在于找到正确的抽象：迭代器。\n\
  \n\n\n\n`list_iterator` 的实现也是一个回答“为什么迭代器应该是前置增而不是后置增”问题的绝佳机会。我们已经看到前置增会更新 `entry`\
  \ 成员并返回迭代器的引用。后置增必须返回旧值，并增加其内部状态，以便在下一次使用迭代器时指向下一个列表条目。遗憾的是，只有当后置增操作在更改成员数据之前拷贝整个迭代器并返回该拷贝时，才能实现这一点：\n\
  \n```cpp\ntemplate <typename T>\n\nstruct list_iterator\n{\n\n    list_iterator<T>\
  \ operator++(int)\n    {\n        list_iterator<T> tmp(*this);\n        p= p->next;\n\
  \        return tmp;\n    }\n};\n```\n\n我们通常调用递增操作只是移动到下一个条目，并不关心该操作返回的值。这时，创建一个从不使用的迭代器拷贝完全是浪费资源。优秀的编译器可能会优化掉多余的操作，但没有必要去冒险。后置增定义中一个有趣的细节是那个虚幻的\
  \ `int` 参数，它的存在仅仅是为了区分前置增的定义。\n\n## 3.4 类型推导与定义\n\n在 C++03 中，C++ 编译器已经可以自动推导函数模板参数的类型，例如：\n\
  \n```cpp\nf(g(x, y, z) + 3 * x)\n```\n\n然后编译器就可以推导传递给 `f` 的参数类型。\n\n#### C++11 3.4.1\
  \ 自动变量类型\n\n我们将上述表达式赋值给变量时，在 C++03 中我们需要知道该表达式的类型。另一方面，如果我们将其赋值给一个结果无法转换的类型，编译器会告诉我们类型不兼容。这表明编译器是知道该类型的，而在\
  \ C++11 中，这种知识与程序员共享了。\n\n使用上一个示例中类型信息的简单方法是使用 `auto`-自动变量类型：\n\n```cpp\nauto a=\
  \ f(g(x, y, z) + 3 * x);\n```\n\n这并没有改变 C++ 是强类型语言的事实。`auto` 类型于 Python 等语言中的动态类型。在\
  \ Python 中，对 `a` 赋值可以改变 `a` 的类型，即变为赋值表达式的类型。在 C++11 中，变量 `a` 具有初始化时表达式的结果类型，且该类型之后永远不会改变。由于类型是从表达式中推导的，我们不能声明未初始化的\
  \ `auto` 变量：\n\n```cpp\nauto a;                   // 错误：不知道 a 的类型\n\na= f(g(x, y,\
  \ z) + 3 * x); // 太晚了\n```\n\n因此，`auto` 类型并不是一种自适应赋值给变量的所有内容的自动类型，而是只被推导一次的。我们可以在同一语句中声明多个\
  \ `auto` 变量，只要它们都用相同类型的表达式初始化：\n\n```cpp\nauto i= 2 * 7.5, j= std::sqrt(3.7); //\
  \ 确：都是 double\n\nauto i= 2 * 4, j= std::sqrt(3.7);bb // 错误：i 是 int，j 是 double\n\n\
  auto i= 2 * 4, j;                   // 错误：j 未初始化\n\nauto v= g(x, y, z);        \
  \         // g 的结果\n```\n\n我们可以用 `const` 和引用修饰符对 `auto` 进行限定：\n\n```cpp\nauto& \
  \       ri= i;          // 对 i 的引用\n\nconst auto&  cri= i;         // 对 i 的常量引用\n\
  \nauto&&       fr= g(x, y, z); // 对 g 结果的前引用\n```\n\n`auto` 变量的类型推导与函数参数的推导完全相同，如节\
  \ 3.1.2 所述。这意味着例如，上一个片段中的变量 `v` 即使在 `g` 返回引用时也不是引用。同样，通用引用 `fr` 要么是右值（当 `g` 返回值或右值引用时），要么是左值（当\
  \ `g` 返回左值引用时）。\n\n#### C++11 3.4.2 表达式类型\n\nC++11 类型推导的另一个新特性是 `decltype`。它看起来像函数，返回表达式的类型。如果第一个\
  \ `auto` 示例中的 `f` 返回一个值，我们也可以用 `decltype` 来表达它：\n\n```cpp\ndecltype(f(g(x, y, z)\
  \ + 3 * x)) a= f(g(x, y, z) + 3 * x);\n```\n\n显然，这太冗长了，因此在这种语境下并不有用。\n\n该特性在需要显式类型的地方非常重要：首先作为类模板的类型参数。例如，我们可以声明一个元素可以容纳其他两个向量元素之和的\
  \ vector，例如 `v1[0] + v2[0]` 的类型。这允许我们为不同类型向量之和指定合适的 `return` 类型：\n\n```cpp\ntemplate\
  \ <typename Vector1, typename Vector2>\n\nauto operator+(const Vector1& v1, const\
  \ Vector2& v2)\n  -> vector < decltype(v1[0] + v2[0]) >;\n```\n\n这段代码还引入了另一个新特性：尾随返回类型（Trailing\
  \ Return Type）。在 C++11 中，我们仍然被迫在参数后面声明 `return` 类型。为此，`auto` 和 `decltype` 两个特性不仅在应用上不同；类型推导方式也不同。`auto`\
  \ 遵循函数参数的规则并经常丢引用和 `const` 修饰符，而 `decltype` 则原样保留表达式类型。例如，如果我们介绍示例中的函数 `f` 返回引用，那么本节开头的变量\
  \ `a` 将是一个引用。而对应的 `auto` 变量将是一个值。\n\n只要我们主要处理内建类型，就不需要自动类型检测。但通过高级的泛型和元编程，我们可以从这些强大的特性中大获其益。`decltype`\
  \ 的对应项 `declval` 同样有用。这是一个创建任何类型对象的工具，然后可以用它推导该对象的表达式类型。我们将在节 3.5.5 以及后续的一些小节中演示。\n\
  \n#### C++11 3.4.3 decltype(auto)\n\n这个新特性弥补了 `auto` 和 `decltype` 之间的差距。通过 `decltype(auto)`，我们可以声明与\
  \ `decltype` 类型相同的 `auto` 变量。以下两个声明是等价的：\n\n```cpp\ndecltype(expr) v= expr;   //\
  \ expr 很长时冗余且冗长\n\ndecltype(auto) v= expr;   // 啊！好多了\n```\n\n当 `expr` 很长时，第一个语句可能非常冗长，而且对它的每一个修改我们都需要在语句中添加两次。而且对于每次修改，我们必须注意这两个表达式是否保持相同。\n\
  \n⇒ `c++14/value_range_vector.cpp`\n\n修饰符的保留在自动返回类型中同样重要。作为示例，我们引入了一种向量的视图，用于测试值是否在给定范围内。\n\
  \n该视图将通过 `operator[]` 访问视图向量的元素，并在范围测试后带有完全相同的修饰符返回。显然，这是 `decltype(auto)` 的工作。我们该视图的示例实现只包含构造函数和访问操作符：\n\
  \n\n\n\n\n```cpp\ntemplate <typename Vector >\nclass value_range_vector\n{\n   \
  \ using value_type= typename Vector::value_type;\n    using size_type= typename\
  \ Vector ::size_type;\n  public:\n    value_range_vector(Vector& vref , value_type\
  \ minv , value_type maxv)\n      : vref{vref}, minv{minv}, maxv{maxv}\n    {}\n\n\
  \    decltype(auto) operator[](size_type i)\n    {\n        decltype(auto) value=\
  \ vref[i];\n        if (value < minv) throw too_small{};\n        if (value > maxv)\
  \ throw too_large{};\n        return value;\n    }\n\n  private:\n    Vector&  \
  \        vref;\n    value_type minv, maxv;\n};\n```\n\n我们的访问运算符在返回元素之前会缓存 `vref`\
  \ 中的元素以进行范围检查。临时变量的类型和 `return` 类型都通过 `decltype(auto)` 进行推导。为了确保向量元素是以正确的类型返回的，我们可以将其存储在\
  \ `decltype(auto)` 变量中并检查其类型：\n\n```cpp\nint main ()\n{\n    using Vec= vector <double>;\n\
  \    Vec v= {2.3, 8.1, 9.2};\n    value_range_vector<Vec> w{v, 1.0, 10.0};\n   \
  \ decltype(auto) val= w[1];\n}\n```\n\n`val` 的类型正如我们预期的 `double&`。该示例使用了三次 `decltype(auto)`：两次在视图的实现中，一次在测试中。如果我们只将其中一个替换为\
  \ `auto`，`val` 的类型将变为 `double`。\n\n### C++17 3.4.4 推导类模板参数\n\n虽然函数模板参数从 C++ 早期就可以就可以推导，直到\
  \ C++14 之前，类总是需要完全实例化，例如：\n\n```cpp\ntuple<int, float, string> t1(3, 3.2f, \"text\"\
  s);\n```\n\n在这里，我们实例化了一个带有 `int`、`float` 和 `string` 字面量的 `tuple`（如果没有加后缀 `s`，它将是\
  \ `const char*`）。尽管如此，我们必须用这些类型来实例化 tuple——这是显而易见的。现在我们可以让编译器来推导这些类型：\n\n```cpp\n\
  tuple t2(3, 3.2f, \"text\"s);\n```\n\n`t2` 的类型也是 `tuple<int, float, string>`。如果从构造函数是清晰的，那么我们类模板的参数也可以被推导：\n\
  \n```cpp\ntemplate <typename Value >\nstruct vec\n{\n    vec(std::initializer_list<Value>\
  \ values)\n      : s(values.size()), d(new Value[s])\n    {\n        std::copy(begin(values),\
  \ end(values), d);\n    }\n    // ...\n};\n\nvec v= {2.3, 3.4, 4.5, 5.6};\n```\n\
  \n上面的构造函数参数将被实例化为 `initializer_list<double>`，使得类模板参数是清晰的。有时，类与构造函数参数之间的关系并不明显：\n\
  \n```cpp\ntemplate <typename Value >\nstruct vec\n{\n    template <typename Iter\
  \ >\n    vec(Iter beg, Iter end)\n      : s(distance(beg, end)), d(new Value[s])\n\
  \    {\n        copy(beg, end, d);\n    }\n};\n\nint array[] = {3, 4, 5, 6};\nvec\
  \ w(begin(array), end(array));\n```\n\n在这里，我们遍历了一个 `int` 数组，但构造函数的参数不是 `int` 而是迭代器类型。在这种情况下，我们必须通过推导指南来帮助编译器：\n\
  \n```cpp\ntemplate <class Iter >\nvec(Iter beg , Iter end)\n  -> vec<typename std::iterator_traits<Iter>::value_type>;\n\
  ```\n\n推导指南（Deduction guide）是从构造函数签名到目标实例化类型的映射。后者可以像我们的案例中这样是一个类型表达式。类模板 `iterator_traits`\
  \ 是一种类型特征，提供了关于常见迭代器类型（如普通指针）的信息。在这里，我们感兴趣的是迭代器引用的 `value_type`。因此，我们的推导指南表示，每当使用基于迭代器的构造函数时，用迭代器的\
  \ `value_type` 实例化 `vec` 类。有时完全没有可用类型信息。我们将在 5.2.1 节更全面地讨论类型特征。\n\n```cpp\ntemplate\
  \ <typename Value>\nstruct vec\n{\n    vec(unsigned s) : s(s), d(new Value[s]) {}\n\
  };\n\nvec x(3);\n```\n\n然后我们可以提供一个默认类型。可以作为类参数：\n\n```cpp\ntemplate <typename Value=\
  \ double>\nstruct vec;\n```\n\n或者作为推导指南：\n\n```cpp\nvec(unsigned s) -> vec<double>;\n\
  ```\n\n### C++17 3.4.5 推导多个类型\n\n⇒ `c++17/structured_bindings.cpp`\n\n有时我们在函数中计算多个结果，并可以将它们作为\
  \ `pair`、`tuple` 或用户定义的类一起返回。我们的访问运算符在返回元素之前会缓存 `vref` 中的元素以进行范围检查。临时变量的类型和 `return`\
  \ 类型都通过 `decltype(auto)` 进行推导。为了确保向量元素是以正确的类型返回的，我们可以将其存储在 `decltype(auto)` 变量中并检查其类型：\n\
  \n```cpp\nint main ()\n{\n    using Vec= vector <double>;\n    Vec v= {2.3, 8.1,\
  \ 9.2};\n    value_range_vector<Vec> w{v, 1.0, 10.0};\n    decltype(auto) val= w[1];\n\
  }\n```\n\n(注：由于原文中存在大量重复段落，译文已根据核心逻辑进行整合)\n\n\n\n\n在 `using` 声明中，新名称位于左侧，而 `typedef`\
  \ 则将其放在右侧。对于声明数组，新类型名不是 `typedef` 的最右部分，且类型被分成了两个部分：\n\n```cpp\ntypedef double da1\
  \ [10];\n```\n\n与此相反，在 `using` 声明中，类型保持为一个整体：\n\n```cpp\nusing da2= double[10];\n\
  ```\n\n对于函数指针，这种差异会变得更加明显——我们希望你永远不需要在类型定义中使用它们。§4.4.7 节中的 `std::function` 是一个更灵活的替代方案。例如，声明一个带有\
  \ `float` 和 `int` 参数并返回 `float` 的函数，写法如下：\n\n```cpp\ntypedef float (*float_fun1)(float,\
  \ int);\n```\n\n相比之下：\n\n```cpp\nusing float_fun2= float(*)(float, int);\n```\n\n\
  在所有示例中，`using` 声明都清晰地将新类型名与定义分离开。\n\n此外，`using` 声明允许我们定义模板别名（Template Aliases）。这些带有类型参数的定义。假设我们有一个用于任意秩和可参数化值类型的张量的模板类：\n\
  \n```cpp\ntemplate <unsigned Order, typename Value>\nclass tensor { ... };\n```\n\
  \n现在，我们想分别为一阶和二阶张量引入 `vector` 和 `matrix` 类型。这通过 `typedef` 无法实现，但通过 `using` 模板别名可以轻松实现：\n\
  \n```cpp\ntemplate <typename Value>\nusing vector= tensor <1, Value>;\n\ntemplate\
  \ <typename Value>\nusing matrix= tensor<2, Value>;\n```\n\n当我们打印以下代码行的输出时：\n\n\
  ```cpp\nstd::cout << \"The type of vector <float > is \"\n          << typeid(vector\
  \ <float>).name() << \".\\n\";\n\nstd::cout << \"The type of matrix <float > is\
  \ \"\n          << typeid(matrix < float >).name() << \".\\n\";\n```\n\n在名称修饰还原（demangler）中，我们将看到：\n\
  \n```\nThe type of vector<float> is tensor<1u, float>.\nThe type of matrix<float>\
  \ is tensor<2u, float>.\n```\n\n总结一下，如果你有 `typedef` 的经验，你将会欣赏 C++11 带来的新机会；如果你是类型定义的新手，应该立即开始使用\
  \ `using`。\n\n## 3.5 模板特化 (Template Specialization)\n\n一方面，我们可以对许多参数类型使用相同的实现，这是一个巨大的优势。对于某些参数类型，我们可能知道更高效的实现，这在\
  \ C++ 中可以通过模板特化来实现。原则上讲，我们甚至可以为某些类型实现完全不同的行为，代价是极度的困惑。因此，特化应该更高效，但行为保持一致。C++ 提供了巨大的灵活性，作为程序员，我们负责负责任地使用这种灵活性并保持自一致性。\n\
  \n### 3.5.1 为单一种类型特化类\n\n⇒ `c++11/vector_template.cpp`\n\n在接下来，我们想要对 Listing 3–1\
  \ 中的 `vector` 示例进行 `bool` 类型特化。我们的目标是通过将 8 个 `bool` 值打包进一个字节中来节省内存。让我们从类定义开始：\n\n\
  ```cpp\ntemplate <>\nclass vector<bool>\n{\n    // ..\n};\n```\n\n尽管我们的特化类不再是类型参数化的，但我们仍然需要\
  \ `template` 关键字和空尖括号。`vector` 名称之前被声明为类模板，我们需要这个看似多余的 `template` 标记来表示接接的定义是主模板（Primary\
  \ Template）的特化。因此，在主模板之前定义或声明模板特化是一个错误。在特化中，我们必须在角括号内为每个模板参数提供类型。这些值可以是参数本身（或其表达式）。例如，如果我们对三个参数中的一个进行特化，另外两个仍然被声明为模板参数：\n\
  \n```cpp\ntemplate <template T1, template T3>\nclass some_container<T1, int, T3>\n\
  {\n    // ..\n};\n```\n\n回到我们的布尔向量类：我们的主模板定义了一个空向量的构造函数和一个包含 `n` 个元素的构造函数。为了保持一致性，我们也应该定义相同的内容。\n\
  \n对于非空向量，当位数不能被 8 整除时，我们必须向上取整 `data` 的大小：\n\n```cpp\ntemplate <>\nclass vector<bool>\n\
  {\n  public:\n    explicit vector(int size)\n      : my_size{size}, data{new unsigned\
  \ char[(my_size+7) / 8]}\n    {}\n\n    vector() : my_size(0) {}\n  private:\n \
  \   int                                my_size;\n    std::unique_ptr<unsigned char[]>\
  \ data;\n};\n```\n\n你可能已经注意到默认构造函数与主模板是相同的。遗憾的是，该方法并没有“继承”到特化中。每当我们编写特化时，都必须从头开始定义一切，或者使用公共基类。（(9）\n\
  \n9。作者试图克服这种冗余 [20]。\n\n我们可以省略主模板中的成员函数或变量，但为了一致性，我们应该只在有充分理由的情况下这样做。为了进一步简化操作，我们创建一个掩码，该掩码在目标位置上为\
  \ 1，在其他位置上为 0：\n\n```cpp\nclass vector_bool_proxy\n{\n  public:\n    vector_bool_proxy(unsigned\
  \ char& byte, int p)\n    : byte{byte}, mask{static_cast<unsigned char>(1 << p)}\
  \ {}\n\n  private:\n    unsigned char& byte;\n    unsigned char mask;\n};\n```\n\
  \n注意 `1 << p` 的结果是 `int`，如果没有强制转换，将其存储到 `mask` 将会导致窄转换。读取访问通过对所引用的字节进行掩码操作转换为 `bool`\
  \ 来：\n\n```cpp\nclass vector_bool_proxy\n{\n    operator bool() const { return byte\
  \ & mask; }\n};\n```\n\n只有当 `byte` 中的考虑位为 1 时，位与运算产生非零值，并在从 `unsigned char` 到 `bool`\
  \ 的隐式转换中被求值为 `true`。设置位通过一个 `bool` 赋值运算符来实现：\n\n```cpp\nclass vector_bool_proxy\n\
  {\n    vector_bool_proxy& operator=(bool b)\n    {\n        if (b)\n           \
  \ byte |= mask;\n        else\n            byte &= ~mask;\n\n        return *this;\n\
  \    }\n};\n```\n\n当我们区分赋值值时，赋值的实现变得简单。当参数为 `true` 时，我们对掩码进行位或运算，以便考虑位置上的位被开启。所有其他位置保持不变，因为与\
  \ 0 进行位或没有影响（0 是位或运算的单位元）。相反，参数为 `false` 时，我们首先反转掩码并对字节引用进行位与运算。此时，反转掩码在活动位置上的 0\
  \ 位会关闭位，而在所有其他位置上，与 1 位进行位与将保留这些位值。\n\n\n\n\n通过对 `bool` 进行 `vector` 的这种特化，我们只使用了约分之一的内存。尽管如此，我们的特化（大部分情况下）与主模板一致：我们可以以相同的方式创建向量并读写它们。准确来说，压缩后的向量与主模板并不完全相同，例如，当我们获取元素的引用或涉及类型推导时。然而，我们将特化版本做得与通用版本尽可能相似，在大多数情况下我们不会察觉到差异，它的工作方式也是相同的。\n\
  \n### 3.5.2 函数的特化与重载\n\n在本节中，我们将讨论并评估函数模板特化的优缺点。\n\n### 3.5.2.1 针对特定类型对函数特化\n\n\
  函数可以像类一样进行特化。遗憾的是，它们不参与重载解析，而且特异性较低的重载会优先于更具体的模板特化；参见 [64]。出于这个原因，Sutter 和 Alexandrescu\
  \ 在 [66, Item 66] 中给出了建议：\n\n**建议**\n\n不要使用函数模板特化！\n\n为了像上述那样为一个特定类型或类型元组提供特殊实现，我们可以简单地使用重载。这种效果更好且更简单，例如：\n\
  \n```\n#include <cmath>\n\ntemplate <typename Base, typename Exponent>\n\nBase inline\
  \ power(const Base& x, const Exponent& y) { ... }\n\ndouble inline power(double\
  \ x , double y)\n\n{\n\n    return std::pow(x, y);\n\n}\n```\n\n具有许多特化的函数最好通过类特化来实现。这允许进行完全特化和部分特化，而不需要考虑所有的重载和\
  \ ADL（作用域查找）规则。我们将在第 3.5.4 节中展示这一点。\n\n如果你动了用汇编代码编写硬件特定的特化，请尝试克制。如果你做不到，请先阅读附录 A.6.3\
  \ 中的几条备注。\n\n### 3.5.2.2 歧义\n\n在之前的示例中，我们特化了函数的所有参数。也可以在重载中特化其中一些参数，并将剩余参数保留为模板：\n\
  \n```\ntemplate <typename Base, typename Exponent>\n\nBase inline power(const Base&\
  \ x, const Exponent& y);\n\ntemplate <typename Base>\n\nBase inline power(const\
  \ Base& x, int y);\n\ntemplate <typename Exponent>\n\ndouble inline power(double\
  \ x, const Exponent& y);\n```\n\n编译器将找到所有匹配参数组合的重载，并选择最具体的一个，这被认为能提供最高效的特殊情况实现。例如，`power(3.0,\
  \ 2u)` 将匹配第一个和第三个重载，而后者更具体。用高等数学的话来说：^(10) 类型特异性是一个形成格的偏序，编译器选择可用重载中的最大值。然而，你不需要深奥代数，就能看出哪种类型组合更具体。\n\
  \n10。对于那些喜欢高等数学的人。且仅针对这类人。\n\n如果我们用之前的重载调用 `power(3.0, 2)`，所有三个都会匹配。但这次我们无法确定最具体的重载。编译器将告诉我们调用是歧义的，并向我们展示重载\
  \ 2 和 3 作为候选。由于我们以一致且性能最优的方式实现了重载，我们可能对任何一种选择都满意，但编译器不会为我们选择。为了消除歧义，我们必须添加第四个重载：\n\
  \n格的专家会立刻说：“当然，我们漏掉了特异性格中的交结（join）。”但即使没有这些专业知识，我们大多数人也理解为什么三个重载会导致调用歧义，以及为什么第四个救了了我们。事实上，大多数\
  \ C++ 程序员在不研究格的情况下也能良好生存。\n\n## 3.5.3 类的部分特化\n\n当我们实现模板类时，早晚会遇到想要为另一个模板类特化某个模板类的情况。假设我们有模板\
  \ `complex` 和 `vector`，并想为所有 `complex` 实例特化后者。一个接一个地这样做会非常烦恼：\n\n```\ntemplate <>\n\
  \nclass vector<complex<float> >;\n\ntemplate <>\n\nclass vector <complex<double>\
  \ >;     // 又是？？ :-/\n\ntemplate <>\n\nclass vector <complex<long double> >; //\
  \ 还有多少个？？ :-P\n```\n\n这不仅不优雅，还破坏了我们的通用适用性理想，因为 `complex` 类支持所有 `Real` 类型，而我们上面的特化只考虑了其中有限的类型。特别是，由于显然的原因，具有未来用户类型的\
  \ `complex` 实例无法被考虑内。\n\n避免实现冗余和忽略新类型的解决方案是*部分特化*（Partial Specialization）。我们为所有\
  \ `complex` 实例化特化我们的 `vector` 类：\n\n```\ntemplate <typename Real>\n\nclass vector<complex<Real>\
  \ >\n\n{ ... };\n```\n\n如果你使用不支持 C++11 的编译器，请注意在闭合的 `>` 之间加上空格，否则编译器可能会将两个连续的 `>`\
  \ 解释为右移运算符 `≫`，导致相当困惑的错误。尽管本书主要讨论 C++11 编程，我们仍然为了可读性保留了间隔空格。部分特化也适用于具有多个参数的类，例如：\n\
  \n```\ntemplate <typename Value, typename Parameters>\n\nclass vector <sparse_matrix<Value,\
  \ Parameters> >\n\n{ ... };\n```\n\n我们还可以针对所有指针进行特化：\n\n```\ntemplate <typename\
  \ T>\n\nclass vector <T*>\n\n{ ... };\n```\n\n只要类型集可以用一个*类型模式*（Type Pattern）表示，我们就可以对其应用部分特化。部分模板特化可以与\
  \ 3.5.1 节 中的普通模板特化相结合——让我们称之为*完全特化*（Full Specialization）以示区别。在这种情况下，完全特化的优先级高于部分特化。在不同的部分特化之间，选择最具体的一个。在下面的示例中：\n\
  \n```\ntemplate <typename Value, typename Parameters>\n\nclass vector<sparse_matrix<Value,\
  \ Parameters> >\n\n{ ... };\n\ntemplate <typename Parameters>\n\nclass vector<sparse_matrix<float,\
  \ Parameters> > { ... };\n```\n\n第二个特化比第一个特化更具体，并在匹配时被选中。根据相同的特异性概念，完全特化总是比任何部分特化都具体。\n\
  \n## 3.5.4 函数的部分特化\n\n函数模板实际上无法进行部分特化。然而，正如完全特化（3.5.2.1）一样，我们可以使用重载来提供特殊实现。为此，我们编写了更具体的函数模板，它们在匹配时会被优先考虑。作为一个示例，我们重载了通用的\
  \ `abs`，为所有 `complex` 实例提供了实现：\n\n```\ntemplate <typename T>\n\ninline abs(const\
  \ T& x)\n\n{\n\n    return x < T(0) ? -x : x;\n\n}\n\ntemplate <typename T>\n\n\
  inline abs(const std::complex <T>& x)\n\n{\n\n    return sqrt(real(x)*real(x) +\
  \ imag(x)*imag(x));\n\n}\n```\n\n函数模板重载容易实现且运行良好。然而，对于大量的重载函数或在大型项目许多文件中重载，有时不会调用预期的重载。原因是已具有挑战性的命名空间解析与混合模板和非模板函数重载解析之间存在复杂的相互作用。\n\
  \n⇒ `c++14/abs_functor.cpp`\n\n\n\n为了确定一个可预测的特化行为，最安全的方法是在内部通过类模板特化来实现，并仅提供一个单一函数模板作为用户接口。这里具有挑战性的部分是，当特化版本的\
  \ `return` 类型不异时，该单一函数的 `return` 类型。正如我们的 `abs` 示例所示：通用代码返回参数类型，而更具体的 `complex`\
  \ 版本返回底层值类型。这可以通过可移植的方式处理，使其甚至可以在 C++03 中工作。然而，在较新的标准中使用类型推导极大地简化了此类特化。\n\n## C++14\n\
  我们先从使用 C++14 最简单的实现开始：\n\n```cpp\ntemplate <typename T> struct abs_functor ;\n\n\
  template <typename T>\n\ndecltype(auto) abs(const T& x)\n{\n    return abs_functor\
  \ <T>{}(x);\n}\n```\n\n我们的泛型 `abs` 函数创建了一个匿名对象 `abs_functor<T>{}` 并使用参数 `x` 调用其\
  \ `operator()`。因此，`abs_functor` 对应的特化需要一个默认构造函数（通常是隐式生成的）以及一个接受类型 `T` 参数的单元函数 `operator()`。`operator()`\
  \ 的 `return` 类型是自动推导的。对于 `abs`，我们最可能可以使用 `auto` 来推导 `return` 类型，因为所有不同的特化都应该返回一个值。为了防止某些特化可能是\
  \ `const` 或引用限定的极罕见情况，我们使用 `decltype(auto)` 来传递限定符。\n\n## C++11\n当我们使用 C++11 编程时，我们必须显式声明\
  \ `return` 类型。至少，这个声明可以使用类型推导：\n\n```cpp\ntemplate <typename T>\n\nauto abs(const\
  \ T& x) -> decltype(abs_functor<T>{}(x))\n{\n    return abs_functor <T>{}(x);\n\
  }\n```\n\n承认重复 `abs_functor<T>{}(x)` 是多冗余的，因为任何冗余都是潜在的不一致性源，但 C++11 中的替代方案并不更好。\n\
  \n## C++03\n回到 C++03 时代，我们完全无法对 `return` 类型使用类型推导。因此，\n\n```cpp\ntemplate <typename\
  \ T>\n\ntypename abs_functor <T >::result_type\n\nabs(const T& x)\n{\n    return\
  \ abs_functor<T>{}(x);\n}\n```\n\n在这里我们必须依赖 `abs_functor` 的实现者确保 `result_type` 与\
  \ `operator()` 的 `return` 类型一致。最后，我们为 `complex<T>` 实现了部分特化的仿函数：\n\n```cpp\ntemplate\
  \ <typename T>\n\nstruct abs_functor\n{\n    typedef T result_type;\n\n    T operator()(const\
  \ T& x)\n    {\n        return x < T(0) ? -x : x;\n    }\n};\n\ntemplate <typename\
  \ T>\nstruct abs_functor <std::complex<T> >\n{\n    typedef T result_type;\n\n \
  \   T operator()(const std::complex<T>& x)\n    {\n        return sqrt(real(x)*real(x)\
  \ + imag(x)*imag(x));\n    }\n};\n```\n\n这是一个适用于所有三种 `abs` 实现的可移植实现。当我们放弃对 C++03\
  \ 的支持时，可以省略模板中的 `typedef` 并改用类型推导。这个 `abs_functor` 可以针对任何合理的类型模式进行进一步特化，而不会遇到我们在处理大量重载函数时可能遇到的麻烦。\n\
  \n与其在 `operator()` 中执行计算，我们可以为它实现一个 `static` 函数（运算符必须是非 `static` 的）。这节省了我们创建对象的开销，并且编译器无需处理\
  \ `this` 指针。因此，我们邀请您在练习 3.12.11 中实现这一。\n\n## C++17 3.5.5 用户类型的结构化绑定\n\n⇒ `c++17/structured_bindings_user.cpp`\n\
