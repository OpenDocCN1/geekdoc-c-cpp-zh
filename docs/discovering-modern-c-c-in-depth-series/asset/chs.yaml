  \ z);\n\ntemplate <typename T>\ndecltype(auto) get<0, T>(const complex<T>& z)\n\
  { return z.real(); }\n\ntemplate <typename T>\ndecltype(auto) get<1, T>(const complex<T>&\
  \ z)\n{ return z.imag(); }\n```\n\n由于我们只对 `N` 进行了特化而没有 `T`，这属于部分特化，而函数是不允许部分特化的。对于类来说这是允许的，我们可以实现一个非特化的函数\
  \ `get` 并调用部分特化类的方法。相比之下，全特化对于函数是可以可能的：\n\n```cpp\ntemplate <>\ndecltype(auto) get<0,\
  \ int>(const complex<int>& z)\n{ return z.real(); }\n\ntemplate <>\ndecltype(auto)\
  \ get<1, int>(const complex<int>& z)\n{ return z.imag(); }\n```\n\n但这并不可泛泛化，不是一个真正合适的方案。无论如何，我们需要将类型特征\
  \ `tuple_element` 适配到我们的自由函数中。\n\n总结一下，我们在这里看到了模板特化的局限性，在这种语境下 `constexpr`-`if`\
  \ 大大简化了问题。我们还看到，对用户类型应用结构化绑定需要付出努力，我们可能需要问自己是否愿意投入这些精力。\n\n但在提出这个问题之前，我们应该先自问，直接访问某些私有成员对于所考虑的类来说是否是一个明智的设计决策，因为我们显然比以前暴露了更多技术细节，更危险的是：我们冒了对象的有效性。然而，这种访问对于调试或测试目的可能是方便的。\n\
  \n为了实现这一点，我们可以引入一个如 `uncover_members` 类的 `private` 或 `protected` 方法，并将调试和测试代码声明为\
  \ `friend`。当 `uncover_members` 返回一个 `tuple` 时，就可以轻松避免本节中烦人的声明工作：\n\n```cpp\ntemplate\
  \ <typename T, typename U= T>\nclass complex\n{\n  private:\n    auto uncover_members\
  \ () const { return std::tuple{r, i}; }\n    friend complex_fixture;\n};\n```\n\n\
  在调试或测试上下文中，我们现在可以应用结构化绑定：\n\n```cpp\nauto [re, im]= z. uncover_members ();\n```\n\
  \n而成员在其他任何地方仍然是不可见的。\n\n### C++20 3.5.6 用户定义格式\n\n⇒ `c++20/vector_fmt_output.cpp`\n\
  \n我们关于模板特化的最后一个例子是对第 1.7.6 节引入的新的 `<format>` 库进行自定义以支持用户类型。之前，我们使用原型库 `<fmt>` 实现了它，如果你在阅读本文时你的平台已经支持\
  \ `<format>`，我们建议你迁移到它。作为一个示例，我们再次选择了 `vector` 类，我们希望为该类指定单个值的格式化方式。此外，当格式字符串包含字母\
  \ `'c'` 时，我们想要将外层括号替换为大括号。\n\n为此，我们必须特化类 `std::formatter`（相应地为 `fmt::formatter`）。我们的特化类应包含\
  \ `parse` 和 `format` 方法。让我们从前者开始：\n\n```cpp\ntemplate <typename Value>\nstruct formatter\
  \ <dmc:: vector <Value> >\n{\n    constexpr auto parse(format_parse_context& ctx)\n\
  \    {\n       value_format= \"{:\";\n       for (auto it= begin(ctx); it != end(ctx);\
  \ ++it) {\n           char c= *it;\n           if (c == 'c')\n               curly=\
  \ true;\n           else\n               value_format+= c;\n           if (c ==\
  \ '}')\n               return it;\n       }\n       return end(ctx);\n    }\n  \
  \  // ...\n    bool curly{false};\n    std::string value_format;\n};\n```\n\n给出的参数是解析上下文，其\
  \ `begin` 迭代器指向格式规范的第一个字符，即冒号后的第一个字符，如果没有冒号，则是左括号后的第一个字符。我们几乎相同地将格式规范拷贝到本地的 `value_format`\
  \ 中，仅跳过了我们的特殊字符 `'c'`。为了简单起见，我们假设格式不包含任何左右括号，这样下一个右括号将结束我们的格式字符串。最后，我们返回指向右括号或 `end`\
  \ 迭代器。通过这些信息，我们可以在 `format` 方法中输出我们的 `vector`：\n\n```cpp\ntemplate <typename Value>\n\
  struct formatter<dmc::vector <Value>>\n{\n    template <typename FormatContext>\n\
  \    auto format(const dmc::vector<Value>& v, FormatContext& ctx)\n    {\n     \
  \   auto&& out= ctx.out();\n        format_to(out, curly ? \"{{\" : \"[\");\n  \
  \      if (v.size() > 0)\n            format_to(out, value_format, v[0]);\n    \
  \    for (int i= 1; i < v.size(); ++i)\n             format_to(out, \", \" + value_format,\
  \ v[i]);\n\n        return format_to(out, curly ? \"}}\" : \"]\");\n    }\n    //\
  \ ...\n};\n```\n\n首先，我们获取输出缓冲器的引用。然后向其写入左括号或中括号。由于括号在 `<format>` 库中有特殊含义，我们需要双大括号作为转义序列。剩余的输出等同于\
  \ `ostream` 输出。最后，我们可以尝试各种格式：\n\n### 模板的非类型参数\n\n到为止，我们只将模板参数用于类型。值也可以作为模板参数。在 C++20\
  \ 之前，这本质上仅限于整数类型（即整数）和指针。从 C++20 开始，浮点数和类也是允许的。但在本节中，我们将重点关注整数。\n\n#### 固定大小容器\n\
  \n⇒ `c++11/fsize_vector.cpp`\n\n非常流行的一种定义是将大小作为模板参数的短向量和小型矩阵：\n\n```cpp\ntemplate\
  \ <typename T, int Size >\nclass fsize_vector\n{\n    using self= fsize_vector;\n\
  \  public:\n    using value_type= T;\n    static constprint my_size= Size;\n   \
  \ fsize_vector(int s= Size) { assert(s == Size); }\n\n    self& operator=(const\
  \ self& that)\n    {\n        std::copy(that.data, that.data + Size, data);\n  \
  \      return *this;\n    }\n\n    self operator+(const self& that) const\n    {\n\
  \        self sum;\n        for (int i= 0; i < my_size; ++i)\n            sum[i]=\
  \ data[i] + that[i];\n        return sum;\n    }\n    // ...\n  private:\n    T\
  \ data [my_size];\n};\n```\n\n由于大小已经作为模板参数提供，我们不需要将其传递给构造函数。然而，为了建立统一的接口，我们仍然在构造时接收大小参数并检查它是否与模板参数匹配。\n\
  \n将此实现与第 3.3.1 节中的动态大小向量相比，我们不会看到很多区别。区别在于大小现在是类型的一部分，并且可以在编译时访问。因此编译器可以进行额外的优化。例如，当我们相两个大小为\
  \ 3 的向量时，编译器可以将循环转换为如下三个语句：\n\n```cpp\nself operator+(const self& that) const\n\
  {\n    self sum;\n    sum[0]= data[0] + that[0];\n    sum[1]= data[1] + that[1];\n\
  \    sum[2]= data[2] + that[2];\n    return sum;\n}\n```\n\n这节省了计数器的递增和循环结束的测试。这些操作可能在\
  \ SSE/AVX 上并行执行。我们将在第 5.4 节中详细讨论循环展开。\n\n\n\n\n由于额外的编译时信息而引发的优化显然取决于编译器。人们只能通过读取生成的汇编代码，或者间接地通过观察性能并与其他实现进行比较，找出实际上执行了哪些转换。阅读汇编代码是困难的，特别是在高优化级别下。如果优化得不够激进，我们可能无法从编译时尺寸中获益。一个非常棒工具是\
  \ [`godbolt.org`](http://godbolt.org) 上的编译器浏览器，它通过根据源行对汇编代码进行颜色编码，以更具可读的方式展示汇编代码。\n\
  \n在上面的示例中，编译器对于像 3 这样小的尺寸可能会如所示展开循环，而对于像 100 这样较大的尺寸则保留循环。因此，这些编译时尺寸对于小型矩阵和向量特别感兴趣，例如三维坐标或旋转。\n\
  \n在编译时知道尺寸的另一个好处是，我们可以将值存储在数组中，使得我们的 `fsize_vector` 使用单个内存块。与管理成本昂贵的动态分配内存相比，这使得创建和销毁变得容易得多。我们之前提到过大小是类型的一部分。因此，我们不需要检查相同类型向量的大小是否匹配。考虑以下代码段：\n\
  \n```cpp\nfsize_vector <float, 3> v;\n\nfsize_vector<float, 4> w;\n\nvector <float\
  \ >          x(3), y(4);\n\nv= w;      // 编译时错误\n\nx= y;      // 运行时错误\n```\n\n\
  最后两行是不兼容的向量赋值。区别在于，第二次赋值 `x= y;` 中的不兼容是在我们的断言运行时发现的。赋值 `v= w;` 甚至无法编译，因为维度为 3 的固定尺寸向量只接受相同维度向量作为参数。\n\
  \n如果我们愿意，可以为非类型模板参数声明默认值。生活在三维世界中，假设许多向量的维度为 3 是有意义的：\n\n```cpp\ntemplate<typename\
  \ T, int Size = 3>\n\nclass fsize_vector\n\n{ /* ... */ };\n\nfsize_vector <float>\
  \      v, w, x, y;\n\nfsize_vector <float, 4>  space_time;\n\nfsize_vector <float,\
  \ 11> string;\n```\n\n对于相对论和弦理论，我们接受声明向量维度的额外工作。\n\n### C++17 3.6.2 推导非类型参数\n\n\
  ⇒ `c++17/auto_template_argument.cpp`\n\nC++ 11 为整数值引入了编译时常量：\n\n```cpp\ntemplate<typename\
  \ T, T Value>\n\nstruct integral_constant;\n```\n\n这允许我们定义一个在编译时表示为 `false` 的类型：\n\
  \n```cpp\nusing false_type= integral_constant<bool, false>;\n```\n\n使用 `integral_constant`，我们首先必须声明常量的类型，然后是值。这显然是多余的，因为类型可以从值推导出来。为此，C++17\
  \ 在模板参数中启用了 `auto`。例如，我们可以在不显式声明类型的情况下为整数常量定义一个类：\n\n```cpp\ntemplate <auto Value\
  \ >\n\nstruct integral_constant_c\n\n  : std::integral_constant <decltype(Value),\
  \ Value>\n\n{};\n\nusing f_type= integral_constant_c <false>;\n```\n\n现在我们只声明了值并推导了它的类型。在大多数地方，类型\
  \ `f_type` 可以替换 `false_type`——例外是那些显式为 `false_type` 特化的实例模板。比继承自 `integral_constant`\
  \ 更好的方法是使用它的模板别名：\n\n```cpp\ntemplate <auto Value>\n\nusing integral_constant_t=\n\
  \n    std::integral_constant <decltype(Value), Value >;\n\nusing t_type= integral_constant_t\
  \ <true>;\n```\n\n这不仅更好地表达了我们的意图；我们的 `t_type` 现在与 `true_type` 完全相同，并可以在任何地方替代它。\n\
  \n### 3.7 函数对象\n\n在本节中，我们引入了一个极其强大的特性：函数对象（Functors）。初一看，它们只是提供可以像函数一样调用的运算符的类。与普通函数的区别在于，函数对象可以更灵活地应用于彼此或自身，允许我们创建新的类函数对象。这些应用需要一些时间来适应，阅读这一节可能比之前的章节更有挑战性。然而，我们在这里达到了编程的全新境界，在阅读上花费的每一分钟都是值得的。这一节也为\
  \ lambda 表达式（§3.8）铺平了道路，并开启了元编程的大门（第 5 章）。\n\n作为一个研究案例，我们开发了一个数学算法来计算可微函数 `f` 的有限差分。有限差分是对一阶导数的近似：\n\
  \n![Images](img/177equ01.jpg)\n\n其中 `h` 是一个小值，也称为间距。\n\n列表 3-5 展示了一个用于计算有限差分的通用函数。我们在\
  \ `fin_diff` 函数中实现了它，该函数接受任意函数（从 `double` 到 `double`）作为参数：\n\n**列表 3–5：使用函数指针的有限差分**\n\
  \n```cpp\ndouble fin_diff(double f(double),double x, double h)\n\n{\n\n    return\
  \ (f(x+h) - f(x) ) / h;\n\n}\n\ndouble sin_plus_cos(double x)\n\n{\n\n    return\
  \ sin(x) + cos(x);\n\n}\n\nint main() {\n\n    cout << fin_diff(sin_plus_cos, 1.,\
  \ 0.01) << endl;\n}\n```\n\n这里我们计算 `sin_plus_cos` 在 `x=1.` 处 `h=0.01` 的导数。现在我们想计算二阶导数。似乎应该将\
  \ `fin_diff` 自身作为参数。不幸，由于 `fin_diff` 有三个参数，它与自身的函数指针不匹配。我们可以通过以下方式解决这个问题：\n\n**定义\
  \ 3–2。** 函数对象是提供 `operator()` 以使得可以像函数一样调用的类。\n\n一些其他作者使用“函数对象”一词代替 functor，并且在他们的文中通常不清楚是指类还是对象。这在那些语境下可能不是问题，但在这里我们需要区分类和对象。因此，尽管在范畴论中有其他含义，我们更倾向于使用\
  \ functor。在本书中， functor 始终指类，而其对象被称为函数对象。\n\n回到我们的示例。以函数对象形式实现的函数 `sin_plus_cos`\
  \ 如下：\n\n**列表 3–6：函数对象**\n\n```cpp\nstruct sc_f\n\n{\n\n    double operator() (double\
  \ x) const\n\n    {\n\n        return sin(x) + cos(x);\n\n    }\n\n};\n```\n\n函数对象的一个巨大优势是能够持有作为内部的状态。因此我们可以在\
  \ sin 函数中使用 *α* 来缩放 *x*，即 sin *αx* + cos *x*：\n\n**列表 3–7：带有状态的函数对象**\n\n```cpp\n\
  class psc_f\n\n{\n  public:\n\n    psc_f(double alpha) : alpha{alpha} {}\n\n   \
  \ double operator() (double x) const\n\n    {\n\n        return sin(alpha * x) +\
  \ cos(x);\n\n    }\n\n  private:\n\n    double alpha;\n\n};\n```\n\n\n\n\n### 3.7.1\
  \ 类函数参数\n\n⇒ `c++11/derivative.cpp`\n\n在定义了我们的泛函数类型后，我们必须找到如何将这些对象传递给函数。我们之前对 `fin_diff`\
  \ 的定义使用函数指针作为参数，这无法无法用于我们的泛函数对象。此外，当我们想要支持不同的泛函数（例如 `sc_f` 和 `psc_f`）时，无法使用特定的参数类型。接受不同类型的参数本质上有两种技术：继承和模板。继承的版本推迟到第\
  \ 6.1.4 节，直到我们实际引入该功能。现在，我们必须提到，泛型方法在适用性和性能上都是优的。因此，我们为泛函数和函数使用类型参数：\n\n```cpp\n\
  template <typename F, typename T>\n\nT inline fin_diff(F f, const T& x, const T&\
  \ h)\n{\n    return (f(x+h) - f(x)) / h;\n}\n\nint main()\n{\n    psc_f psc_o{1.0};\n\
  \    cout << fin_diff(psc_o, 1., 0.001) << endl;\n    cout << fin_diff(psc_f{2.0},\
  \ 1., 0.001) << endl;\n    cout << fin_diff(sin_plus_cos, 0., 0.001) << endl;\n\
  }\n```\n\n在这个示例中，我们创建了泛函数对象 `psc_o` 并将其作为模板参数传递给 `fin_diff`。下次调用将动态创建的对象 `psc_f{2.0}`\
  \ 传递给微分函数。在 `fin_diff` 的最后一次调用中，我们演示了仍然可以传递普通函数 `sin_plus_cos`。\n\n这三个示例说明参数 `f`\
  \ 是多功能的。这引发了一个问题：到底有多功能？从我们使用 `f` 的方式推断出，它必须是一个接受一个参数的函数。STL（§§4.1）针对这些需求引入了 `UnaryFunction`\
  \ 概念：\n\n* 令 `f` 的类型为 `F`。\n* 令 `x` 的类型为 `T`，其中 `T` 是 `F` 的参数类型。\n* `f(x)` 带一个参数调用\
  \ `f` 并返回一个结果类型的对象。\n\n由于我们使用类型 `T` 的值进行所有计算，我们应该增加一个要求：`f` 的返回类型也应该是 `T`。\n\n###\
  \ 3.7.2 泛函数的组合\n\n到为止，我们已经了计算中不同类型的函数参数。遗憾的是，我们离通过将 `fin_diff` 作为自身的参数来优雅地计算高阶导数的目标并不远。问题是\
  \ `fin_diff` 需要一个一元函数作为参数，而它本身是一个三元函数。我们可以通过定义一个一元泛函数^(12) 来克服这种差异，它将待微分的函数和步长作为内部状态：\n\
  \n```cpp\ntemplate <typename F, typename T>\n\nclass derivative\n{\n  public:\n\
  \    derivative(const F& f, const T& h) : f{f}, h{h} {}\n    T operator()(const\
  \ T& x) const\n    {\n        return (f(x+h) - f(x) ) / h;\n    }\n  private:\n\
  \    const F& f;\n    T        h;\n};\n```\n\n12。为了简洁，我们将对象行为类似于一元函数的泛函数称为一元泛函数。\n\
  \n此时只有 `x` 仍然作为普通函数参数传递给微分函数。这个泛函数可以用代表 `f`(*x*)` 的^(13) 泛函数来实例化，结果是近似 `f`(*x*)`\
  \ 的泛函数：\n\n```cpp\nusing d_psc_f= derivative<psc_f, double>;\n```\n\n13。这是另一种缩略表达：当我们说泛函数\
  \ `ft` 代表 `f`(*x*)` 时，意味着 `ft` 的一个对象计算了 `f`(*x*)`。\n\n这里 `f`(*x*) = sin(*α*.*x*)\
  \ + cos *x* 的导数由泛函数 `d_psc_f` 代表。我们现在可以为 *α* = 1 的导数创建一个函数对象：\n\n```cpp\npsc_f \
  \      psc_o{1.0};\nd_psc_f     d_psc_o{psc_o, 0.001} ;\n```\n\n这允许我们计算 *x* = 0\
  \ 处的差商：\n\n```cpp\ncout << \"der. of sin(x) + cos(x) at 0 is \" << d_psc_o(0.0)\
  \ << '\\n';\n```\n\n嗯，我们之前可以这样做。与我们之前的解决方案的根本区别在于原始函数及其导数的相似性。它们都是由泛函数创建的一元函数对象。\n\
  \n因此，我们终于实现了目标：我们可以像对待 `f` (*x*) 一样对待 `f`(*x*)，并构建 `f`\"( (*x*)。\n\n### 3.7.3 递归\n\
  \n当我们思考如何实现三阶、四阶或通用的第 n 阶导数时，我们它们看起来就像二阶。我们可以探索这种递归方案：\n\n```cpp\ntemplate <unsigned\
  \ N, typename F, typename T>\nclass nth_derivative\n{\n    using prev_derivative=\
  \ nth_derivative<N-1, F, T>;\n  public:\n    nth_derivative(const F& f, const T&\
  \ h)\n      : h{h}, fp{f} {}\n    T operator()(const T& x) const\n    {\n      \
  \  return (fp(x+h) - fp(x)) / h;\n    }\n  private:\n    T               h;\n  \
  \  F fp;\n};\n```\n\n为了防止编译器无限递归，我们在到达一阶导数时停止。注意不能使用 `if` 或 `?:` 来停止递归，因为它的两个分支都会被急于求，其中一个包含无限递归。在\
  \ C++17 中我们可以使用 `constexpr`- `if`。传统上，递归模板定义通过下面的特化来终止：\n\n```cpp\ntemplate <typename\
  \ F, typename T>\nclass nth_derivative <1, F, T>\n{\n  public:\n    nth_derivative(const\
  \ F& f, const T& h) : f{f}, h{h} {}\n    T operator()(const T& x) const\n    {\n\
  \        return (f(x+h) - f(x) ) / h;\n    }\n  private:\n    const F& f;\n    T\
  \        h;\n}\n```\n\n这个特化与我们现在可以丢弃的 `derivative` 类相同。或者我们保留它并简单地通过派生来重用它的功能（更多关于推导的内容请参见第\
  \ 6 章）。\n\n```cpp\ntemplate <typename F, typename T>\nclass nth_derivative <1, F,\
  \ T>\n  : public derivative <F, T>\n{\n    using derivative <F, T >::derivative;\n\
  };\n```\n\n现在我们可以计算任何阶导，例如第 22 阶：\n\n```cpp\nnth_derivative<22, psc_f, double>d22_psc_o{psc_f(1.0),\
  \ 0.00001};\n```\n\n\n\n\n```cpp\ntemplate <unsigned N, typename F, typename T>\n\
  \nclass nth_derivative\n{\n    using prev_derivative= nth_derivative <N-1, F, T>;\n\
  \n  public:\n    nth_derivative(const F& f, const T& h) : h{h}, fp{f, h} {}\n\n\
  \    T operator()(const T& x) const\n    {\n      return N & 1 ? ( fp(x+h) - fp(x)\
  \ ) / h\n                   : ( fp(x) - fp(x-h) ) / h;\n    }\n\n  private:\n  \
  \  T        h;\n    prev_derivative fp;\n};\n```\n\n遗憾的是，我们的第 22 阶导数仍然和以前一样错误，甚至稍微糟糕了一点。当我们意识到自己对\
  \ `f` 评估了四百万次时，这变得尤为令人沮丧。(14) 减小 `h` 也没有帮助：切线确实更接近导数，但另一方面，`f(x)` 和 `f(x ± h)` 的值彼此接近，因此它们的差值中只剩下几个有意义的位了。至少正如泰勒级数告诉我们的那样，我们的交替差分方案改进二阶导数。另一个肯定的事实是，我们可能并没有为这种改变付出代价。条件\
  \ `N&1` 的结果在编译时已知，最近的编译器只会评估相应的子表达式。即使没有其他收获，我们也学到了关于 C++ 的知识，并在后续内容中得到了确认：\n\n\
  **真理** 即使是最酷的编程也无法替代坚实的数学。\n\n归根结底，这本书主要是关于编程的。事实函数对象被证明在生成新函数对象方面具有极强的表达能力。尽管如此，如果任何读者对高阶导数的更好计算有好的主意，请随时联系作者——如果情况允许，这可能值得请吃顿晚餐。\n\
  \n只有一个细节仍然困扰着我们：函数对象参数与构造函数参数之间的冗余。假设我们要计算 `psc_o:` 的七阶导数：\n\n```\nnth_derivative\
  \ <7, psc_f, double > d7_psc_o{psc_o, 0.00001};\n```\n\n`nth_derivative` 的最后两个参数正好是构造函数参数的类型。这是冗余的，我们更倾向于推导它们。`auto`\
  \ 和 `decltype` 在这里没有太大帮助：\n\n```\nauto d7_psc_o= nth_derivative <7, psc_f, double>{psc_o,\
  \ 0.00001};\n\nnth_derivative<decltype(psc_o),\n                decltype(0.00001),\
  \ 7>   d7_psc_o{psc_o, 0.00001};\n```\n\n14。通过在每个位置仅计算一次 `f` 并使用相应的二项式系数进行缩放，计算量可以从指数降低到线性。希望你的教授读到这里，并为下次练习带来灵感。\n\
  \n更有前景的是函数模板，它接收构造函数的参数并像这样推导它们的类型：\n\n```cpp\ntemplate <typename F, typename T,\
  \ unsigned N> // 不聪明\n\nnth_derivative<N, F, T>\n\nderive(const F& f, const T& h)\n\
  \n{\n    return nth_derivative <N, F, T>{f, h};\n}\n```\n\n这应该推导出 `F` 和 `T`，我们只需要显式声明\
  \ `N`。遗憾的是，这的结果并不符合预期。当我们声明某个模板参数时，我们必须声明所有之前的参数：\n\n```\nauto d7_psc_o= derive<psc_f,\
  \ double, 7>(psc_o, 0.00001);\n```\n\n因此，我们必须更改函数模板参数的顺序：`N` 必须显式声明，而 `F` 和 `T`\
  \ 可以推导。因此，我们将 `N` 放在前面：\n\n```cpp\ntemplate <unsigned N, typename F, typename T>\n\
  \nnth_derivative<N, F, T>\n\nderive(const F& f, const T& h)\n\n{\n    return nth_derivative<N,\
  \ F, T>{f, h};\n}\n```\n\n现在编译器可以推导出七阶导数的函数对象和值类型：\n\n```\nauto d7_psc_o= derive<7>(psc_o,\
  \ 0.00001);\n```\n\n我们已经看到模板参数的顺序对我们的函数很重要。在所有参数都由编译器推导的函数模板中，它们的顺序是无关。只有当参数或某些参数被显式声明时，我们才需要注意。未推导的参数必须位于参数列表的前部。为了记住这一点，想象一个带有部分推导参数的模板函数调用：显式声明的参数在前（位于括号\
  \ `(` 的左侧），其他参数从 `(` 右侧的参数中推导出。\n\n#### 3.7.4 通用归约\n\n⇒ `c++11/accumulate_functor_example.cpp`\n\
  \n回想第 3.3.2.5 节中的 `accumulate` 函数，我们用它来说明通用编程。在本节中，我们将该函数泛化为通用归约。我们引入了一个 `BinaryFunction`，它以函数或可调用类对象的形式对两个参数执行操作。然后我们就可以对所有元素应用\
  \ `BinaryFunction` 来执行任何归约。\n\n## 3.8 Lambda\n\n⇒ `c++11/lambda.cpp`\n\nC++11 引入了\
  \ lambda 表达式。*λ*-表达式仅仅是函数对象的简写。然而，它使得程序更加紧凑，且通常更易理解。特别是对于简单的计算，查看它们的实现会更清晰。之前见过函数对象后，很容易理解什么是\
  \ lambda。\n\n\n\n遗憾的是，这个语句在教科书中太长无法写在一行，但在实际程序中并非如此。\n\n一旦 lambda 一出现，许多程序员就感到非常兴奋，以至于用\
  \ lambda 实现了每一个函数参数——这通常跨越多行，并在内部包含其他的 lambda。对于经验丰富的程序员来说，这可能是一个有趣的挑战，但我们深信，将复杂的嵌套表达式分解为可读的部分有助于所有人（包括我们自己）使用和维护软件。\n\
  \n### 3.8.1 捕获 (Capture)\n\nC++11 在上一个节中，我们通过简单插入操作对 lambda 进行参数化。然而，对于大量参数来说，这样做效率并不高：\n\
  \n```\na= fin_diff([](double x){ return sin(2.5 * x); }, 1., 0.001);\n\nb= fin_diff([](double\
  \ x){ return sin(3.0 * x); }, 1., 0.001);\n\nc= fin_diff([](double x){ return sin(3.5\
  \ * x); }, 1., 0.001);\n```\n\n遗憾的是，我们无法这样访问 lambda 作用域中的变量或常量：\n\n```\ndouble phi=\
  \ 2.5;\n\nauto sin_phi= [](double x){ return sin(phi * x); }; // Error\n```\n\n\
  `λ`-表达式只能使用它自己的参数或之前`捕获 (Captured)` 的参数。\n\n#### 3.8.1.1 按值捕获 (Capture by Value)\n\
  \nC++11 为了使用 `phi` 的值，我们必须先捕获它：\n\n```\ndouble phi= 2.5;\n\nauto sin_phi= phi{ return\
  \ sin(phi * x); };\n```\n\n捕获某些内容的 lambda 通常被称为 `闭包 (Closure)`。可以在逗号分隔的列表中捕获多个值：\n\
  \n```\ndouble phi= 2.5, xi= 0.2;\n\nauto sin2= phi,xi{ return sin(phi*x) + cos(x)*xi;\
  \ };\n```\n\n这些参数是被复制的，但与按值传递的函数参数不同的是，禁止修改它们。写成一个函数对象类，之前的 `λ` 对应于：\n\n```struct\n\
  struct lambda_f\n\n{\n   lambda_f(double phi, double xi) : phi{phi}, xi{xi} {}\n\
  \n   double operator()(double x) const\n   {\n       return sin(phi *x)+cos(x)*xi;\n\
  \   }\n\n   double phi, xi;\n};\n```\n\n结果是，稍修改捕获的变量对 lambda 没有影响：\n\n```\ndouble\
  \ phi= 2.5, xi= 0.2;\n\nauto px= phi,xi{ return sin(phi * x) + cos(x) * xi; };\n\
  \nphi= 3.5; xi= 1.2;\n\na= fin_diff(px, 1., 0.001); // 仍然使用 phi= 2.5 和 xi= 0.2\n\
  ```\n\n变量在 `λ` 定义时被捕获，因此在调用 lambda 时使用的是该时刻的值。\n\n此外，尽管这些是副本，我们仍然无法修改 lambda 函数内部的值。原因是\
  \ lambda 的函数体对应于上面 `lambda_f` 中带有 `const` 修饰符的 `operator()`。例如，在下面的 lambda 中，增加捕获的\
  \ `phi` 是非法的：\n\n```\nauto l_inc= phi {phi+= 0.6; return phi; }; // Error\n```\n\
  \n为了允许修改捕获的值，lambda 必须被标记为 `mutable`：\n\n```\nauto l_mut= phi mutable {phi+= 0.6;\
  \ return phi; }; \n```\n\n然后它的行为就像该值被复制到一个 `mutable` 变量中，并且可以在 `const` 修饰的方法中进行修改。尽管如此，我们应该尽量避免\
  \ `mutable`，例如通过返回 `phi+0.6`。如果 lambda 只被调用一次（大多数 lambda 都是这样），那么我们增加变量还是在 `return`\
  \ 语句中加上增量就没有任何区别。\n\n#### 3.8.1.2 按引用捕获 (Capture by Reference)\n\n变量也可以按引用捕获：\n\n\
  ```\ndouble phi= 2.5, xi= 0.2;\n\nauto pxr= &phi,&xi{ return sin(phi * x) + cos(x)\
  \ * xi; };\n\nphi= 3.5; xi= 1.2;\n\na= fin_diff(pxr, 1., 0.001); // 现在使用 phi= 3.5\
  \ 和 xi= 1.2\n```\n\n在这个示例中，使用的是 `λ` 函数调用时 `phi` 和 `xi` 的值，而不是 lambda 创建时的值。对应的函数对象类看起来如下：\n\
  \n```\nstruct lambda_ref_type\n\n{\n    lambda_ref_type(double& phi, double& xi)\
  \ : phi{phi}, xi{xi} {}\n\n    double operator()(double x) const\n    {\n      \
  \  return sin(phi *x)+ cos(x)* xi;\n    }\n\n    double& phi;\n\n    double& xi;\n\
  };\n```\n\n引用语义的另一个结果是可以修改被引用的值。这不仅是副作用的可能来源，还可以高效使用。假设我们有不同的稠密和稀疏矩阵类。对于所有这些类，我们提供了一个通用的遍历函数\
  \ `on_each_nonzero`，将矩阵作为第一个参数，将函数对象作为第二个（作为第二个传递）。\n\n#### 3.8.1.3 通用捕获 (Generalized\
  \ Capture)\n\nC++14 通过 *初始化捕获 (Init Capture)* 将捕获泛泛化。它允许我们为现有变量引入新名称，并评估表达式并将结果与名称关联：\n\
  \n```\nint x= 4;\n\nauto l= [r= x, i= x + 1](){ r+= 2; };\n```\n\n空的参数列表可以省略（C11\
  \ 也是如此）：\n\n```\nauto l= [r= x, i= x + 1]{ r+= 2; };\n```\n\n这种泛化最重要的益处是将变量移动到闭包中。假设我们有一个返回\
  \ `unique_ptr` 尔伯特矩阵的函数：\n\n```\nauto F= make_unique<Mat>{{1., 0.5},{0.5,1./3.}});\n\
  ```\n\n我们允许按引用捕获 `F`，但如果闭包比指针活，就会失效。另一方面，`unique_ptr` 不能复制。为了确保矩阵只要闭包就存在，我们必须将数据移动到闭包拥有的\
  \ `unique_ptr` 中：\n\n```\nauto apply_f= F= move(F){ return Vec(*F * x); };\n```\n\
  \n### 3.8.2 通用 lambda (Generic Lambdas)\n\nC++11 中的 lambda 确定了返回类型，但参数需要显式声明。这一限制在\
  \ C++14 中被消除了。与函数模板相比，参数不是通过繁琐的 `template`- `typename` 语法声明，而是通过 `auto` 关键字声明。例如，一个对（随机访问）容器元素进行降序排序的函数实现如下：\n\
  \n```\ntemplate <typename C>\n\nvoid reverse_sort(C& c)\n\n{\n    sort(begin(c),\
  \ end(c), [](auto x, auto y){ return x > y; });\n}\n```\n\n\n\n\n```cpp\ntemplate\
  \ <typename Matrix>\n\ninline auto frobenius_norm(const Matrix& A)\n\n{\n    using\
  \ std::abs; using std::sqrt;\n    decltype(abs(A[0][0])) ss= 0;\n    on_each_nonzero(A,\
  \ &ss { ss+= abs(x) * abs(x); });\n    return sqrt(ss);\n}\n```\n\n在这个小函数中，我们使用了更多的类型推导机制，并完全从声明\
  \ `value_type` 中解放了出来。我们现在还可以处理 `abs` 返回类型可能与 `value_type`不同的情况。\n\nC++17 允许我们定义在编译时求值的\
  \ lambda。在我们广泛讨论编译时计算后，将在第 5.1.5 节 中讨论它们。C++20 也像普通函数模板一样为模板参数命了名。这使得我们能够可以编写要求多个参数必须实例化为相同类型的泛型\
  \ lambda。此外，某些带有类型推导的 lambda 可以写得更简洁。面对这种仍在不断增强的表达能力：\n\n#### 建议\n\n适度使用 lambda！并不是所有用\
  \ lambda 能实现的功能都需要用它们来实现。使用它们是为了让你的程序更具表现力，而不是更晦涩。\n\n避免无止且过度复杂的 lambda。即使在现代 C++\
  \ 中，为了整体清晰性，传统的函数或类可能是更好的选择。作者的个人准则是：\n\n- 如果函数调用仍然保持在一行内且 lambda 只使用一次，则在调用中创建\
  \ lambda。\n- 拆分嵌套 lambda 并至少存储内部 lambda。\n- 如果 lambda 长度不超过五行，则将其存储在变量中。\n- 超此之外的所有情况最好用其他方式实现。\n\
  \n曾经有这样的情况：成员函数中需要一个简单的功能，提供一个三行的 lambda 很方便。然后该功能被扩展了，lambda 增长到了五行。后来又来了另一个扩展，这时\
  \ lambda 看起来不再是正确的解决方案，于是它被转换成了传统的成员函数。\n\n## 3.9 变量模板\n\nC++14 的数学常量以前定义在可用的最大类型（通常是\
  \ `long double`）中，并在表达式中使用时转换为所需的类型。相反，当常量没有被转换时，其他参数可能会被强制转换为较大的常量，导致表达式的评估性能较低。\n\
  \n因此，C++14 引入了*变量模板*：用模板参数进行参数化的变量。例如，常量 `π` 可以用类型参数定义：\n\n```cpp\ntemplate <typename\
  \ Value>\nconstexpr Value pi{3.14'592'653'589'793'238'462'643'383'279l};\n```\n\n\
  当我们在泛型表达式需要 `π` 时，可以使用相应的类型对其进行实例化：\n\n```cpp\ntemplate<class T>\nT circular_area(const\
  \ T& r)\n{\n    return pi<T> * r * r;\n}\n```\n\nAlex Shabalin 提出了一个有趣得多的例子。(15)\
  \ Lambda——就像我们基于 lambda 的导数近似——是对象，可以像我们之前几次那样存储在类型推导的变量中。这次我们将导数的阶数作为编译时参数添加：^(16)\n\
  \n```cpp\ntemplate <size_t N>\nauto derive= [] (auto f, auto x, auto h) {\n    auto\
  \ prev = [&] (auto x2) {\n        return derive<N-1>(f, x2, h);\n    };\n    return\
  \ (prev(x+h) - prev(x)) / h;\n};\n\ntemplate <>\nauto derive<0>= [] (auto f, auto\
  \ x, auto h) {\n    return f(x);\n}\n```\n\n在这里，变量存储了一个 lambda，通过在内部定义另一个计算 $(n-1)$\
  \ 阶导数的 lambda 来动态计算函数 `f` 的 $n^{(th)}$ 阶导数，例如：\n\n```cpp\nauto f= [] (double x)\
  \ { return 2.0 * std::cos(x) + x*x; };\ncout ≪ \"f''(1) = \" ≪ derive <2>(f, 1.0,\
  \ 1e-3) ≪ endl;\ncout ≪ \"f(5)(1) = \" ≪ derive <5>(f, 1.0, 1e-3) ≪ endl;\n```\n\
  \n此此，首先由一元函数生成的仿函数的导数是通过另一个一元函数来近似其 $n^{(th)}$ 阶导数的。因此，我们可以以与原始相同的方式使用该函数。为了用 lambda\
  \ 和变量模板实现这一点，我们必须避免即时计算，而是创建某种工厂来返回一个可以稍后执行计算的函数：\n\n15。他参加了作者的一场研讨会，在用传统模板解释函数器期间，他自发地想到用现代语言特性更紧凑地表达这一点。这是最棒的培训体验。\n\
  \n16。遗憾的是，以下 lambda 目前在 VS 上无法编译。我们感谢 Marc Gregoire 在校对期间对此提交了错误报告。\n\n```cpp\n\
  template <size_t N>\nauto derive = [] (auto f, auto h) {\n    // ... implementation\
  \ ...\n};\n```\n\n\n\n\n概念（concept）可以包含纯粹的语法要求，例如某个类型参数必须具有拷贝构造函数或一个 `operator+`。语义要求则规定了强制性属性，例如加法的交换律：`x`\
  \ + `y` = `y` + `x` ∀ `x, y`。\n\n在 C++20 之前，概念仅存在于文档中（如果存在的话），泛型函数和类的用户负责满足模板参数上的所有要求。如果违反了语法要求，用户可能会通过编译器对缺少某函数的报错来发现它。不幸的是，这通常发生在大型函数调用栈的深处，即在实例化某些与程序员无关的内部细节内部实现时。结果是，错误信息对于无法实例化的内部代码的作者以外，对其他人来说并没有特殊意义。编译器在冗长的信息中提供调用栈和包含栈，这对程序员的震慑作用远大于启示作用。然而，语法错误总是会被编译器捕获——尽管报告方式并不一定很有帮助。另一方面，语义错误是编译器是无法检测的。\n\
  \n现在，通过 C++20，我们可以将概念表达为程序的一部分。使用概念有几个优势：\n\n*   未满足的要求已经在被调用函数中检测到。\n    *   而不是在实现的深处。\n\
  \    *   这导致错误信息显著缩短。\n*   错误信息通常更有意义。\n*   语义错误可以被检测。\n*   函数可以根据类型属性进行分发。\n\n\
  到目前为止，只能直接表达语法要求，但我们可以模拟语义概念，正如我们稍后将演示的那样（Section 5.5）。之前通过元技巧就可以实现类型属性的分发，但概念让实现变得更加简单且易读。\n\
  \n### 3.10.1 定义概念\n\n⇒ `c++20/concept_accumulate_syntactic.cpp`\n\n在 Listing 3–4\
  \ 中，我们实现了一种适用于可加值类型的数组和列表的通用求和。此外，它还可以用于任何迭代器对，只要其值是可读的并且可以加上初始值的类型。这些类型要求应该在概念\
  \ `Summable` 中实现，因为这正是我们的函数 `requires` 的：\n\n```cpp\ntemplate <typename Iter, typename\
  \ Value>\n\nValue accumulate(Iter first, Iter last, Value init)\n\n    requires\
  \ Summable<Iter, Value>\n\n{\n\n    for (; first != last; ++first)\n        init+=\
  \ *first;\n\n    return init;\n}\n```\n\n`requires` 子句可以插入函数头之后（如我们所做），也可以插入模板参数列表之后：\n\
  \n```cpp\ntemplate <typename Iter, typename Value>\n\n    requires Summable<Iter,\
  \ Value>\nValue accumulate(Iter first, Iter last, Value init);\n```\n\n现在，我们的函数被**约束**（Constrained）为概念\
  \ `Summable` 模型，我们最终应该实现它。它应该包含什么？\n\n*   类型 `Iter` 应该是：\n    *   可比较的；\n    * \
  \  可增的；以及\n    *   间接可读的，即 `operator*` 的结果应该是可读的。\n*   类型 `Value` 应该是可拷贝的以便返回结果。\n\
  *   `Iter` 的 `operator*` 结果应该是可以加 `Value` 的。\n\n这些要求在以下概念中实现：\n\n```cpp\ntemplate\
  \ <typename Iter, typename Value>\nconcept Summable = requires(Iter first, Value\
  \ init) {\n    { *first } -> std::convertible_to<Value>;\n    { init += *first }\
  \ -> std::same_as<Value&>;\n};\n```\n\n\n\n\n```cpp\ntemplate <typename Iter, typename\
  \ Value, typename Op>\n\nconcept Accumulatable=\n\n    requires (Iter it, Value\
  \ init, Op op)\n\n{\n\n    requires std::input_iterator <Iter >;\n\n    requires\
  \ Returnable <Value >;\n\n    init= op(init, *it);\n};\n\ntemplate <typename Iter,\
  \ typename Value, typename Op>\n\nValue accumulate(Iter first, Iter last, Value\
  \ init, Op op)\n    requires Accumulatable <Iter, Value, Op>\n\n{\n    for (; first\
  \ != last; ++first)\n        init= op(init, *first);\n    return init;\n}\n```\n\
  \n该语言允许我们通过简单将概念替换为其定义，直接在需求所在实现概念性约束。这往往会导致奇异的双重 `requires` 子句：\n\n```cpp\ntemplate\
  \ <typename Iter, typename Value, typename Op>\n\nValue accumulate(Iter first, Iter\
  \ last, Value init, Op op)\n    requires requires (Iter it, Value init, Op op)\n\
  \    {\n        requires std::input_iterator <Iter >;\n        requires Returnable\
  \ <Value >;\n        init= op(init, *it);\n    }\n\n{\n    for (; first != last;\
  \ ++first)\n        init= op(init, *first);\n    return init;\n}\n```\n\n我们认为这个例子本身说明了，概念定义与使用的分离在大多数情况下是更好的选择。\n\
  \n### 3.10.2 通过概念进行分发\n\n我们之前见过，当调用重载函数时，编译器会根据参数类型选择最佳匹配。同样，C++20 编译器按照限制性从大到小的顺序对约束函数排序，并为给定的函数调用选择符合约束限制性最大的重载。\n\
  \n标准库中受益于概念排序的简单函数是 `advance`。在最通的版本中，它接受任意迭代器 `it` 和一个正数 `n`，并将 `it` 递增 `n` 次：\n\
  \n```cpp\ntemplate <typename Iter >\n\nvoid advance(Iter& it, unsigned n)\n    requires\
  \ input_or_output_iterator <Iter >\n{\n    while (n-- > 0)\n        ++it;\n}\n```\n\
  \n当迭代器是 `bidirectional_iterator` 时，`n` 可以为负数，`it` 相应地递减：\n\n```cpp\ntemplate <typename\
  \ Iter >\n\nvoid advance(Iter& it, int n)\n    requires bidirectional_iterator <Iter>\n\
  {\n    if (n >= 0) {\n        while (n-- > 0)\n            ++it;\n    } else {\n\
  \        while (n++ < 0)\n           --it;\n    }\n}\n```\n\n对于 `random_access_iterator`，我们可以消除循环并直接将\
  \ `n` 加到 `it` 上：\n\n```cpp\ntemplate <typename Iter >\n\nvoid advance( Iter& it,\
  \ int n)\n    requires random_access_iterator <Iter >\n{\n    it+= n;\n}\n```\n\n\
  这很好地将函数的复杂度从 `O(*n*)` 降低到 `O*(1)`。标准的 `advance` 函数始终在这三种实现之间进行分发，但在概念出现之前，实现要更为复杂：它引入了人工类型来模拟概念排序。我们将在第\
  \ 4.1.2.3 节 中演示这一点。\n\n在前面的示例中，我们首先引入了类型参数 `Iter` 并在之后对其施加了约束。我们也可以在声明中直接对类型参数进行约束：\n\
  \n```cpp\ntemplate < random_access_iterator Iter >\n\nvoid advance(Iter& it, int\
  \ n)\n{ ... }\n```\n\n或者我们使用来自第 3.1.7 节 的简洁 `auto` 记法并对 `auto` 参数进行约束：\n\n```cpp\n\
  void advance( random_access_iterator auto& it, int n)\n{ ... }\n```\n\n我们之前提到过编译时\
  \ `bool` 常量用于 `requires` 子句。然而，它们不能在简写符号中使用。因此，如果 `random_access_iterator` 是 `bool`\
  \ 常量，带有 `requires` 子句的第一个重载将编译，但两个简写实现不会。此外，这里演示的分发基于包含（subsumption）关系，需要概念才能正常工作。因此：\n\
  \n**建议**  \n优先使用概念而非 `bool` 常量。\n\n### 3.10.3 类中的概念\n\n⇒ `c++20/vector_constraint_initialization.cpp`\n\
  \n概念在类中的工作方式与函数相同。尽管如此，我们本可以结束这一节了。但我们还是忍不住让概念展现出它们的魅力，为我们的 `vector` 类建立非常通用的构造函数。我们的第一个构造函数接受两个迭代器，并将所引的内容拷贝到具有足够空间的新\
  \ `vector` 中：\n\n```cpp\ntemplate <typename Value >\n\nclass vector\n{\n    // ...\n\
  \n    explicit vector(int size) // ...\n\n    template < std::forward_iterator Iter\
  \ >\n    vector(Iter first, Iter last) : vector(distance(first, last))\n    {\n\
  \         using std::copy;\n         copy(first, last, & data[0]);\n    }\n};\n\
  ```\n\n类型 `Iter` 必须符合 `std::forward_iterator` 概念。这是一个针对可以复制且每个拷贝在递增后仍指向相同数据的迭代器的概念。相比之下，输入流不是前进迭代器，因为递增会消耗流中的数据，导致复制的迭代器在递增后获得其他数据。在我们的实现中，我们使用\
  \ `distance` 函数，它计算了 `first` 的拷贝必须递增多少次。\n\n\n\n\n\n一个概念（concept）不应包含无限的任务列表，即使该概念约束了一个复杂的函数。此外，我们应该从更简单的概念构建更复杂的概念。标准库就是一个很好的例子：迭代器概念（iterator\
  \ concepts）相互完善，而范围概念（range concepts）使用了迭代器概念。用户库应该大量使用它们，并添加自己的层次结构。这可以从一些基础技术概念开始，演变为如\
  \ `Node` 或 `Cell` 等中间概念，并最终形成 `Solver` 或 `Mesh` 等高级概念。\n\n### 3.11 变长模板\n\n当 C++11\
  \ 的函数、类和变量模板以及模板别名的参数个数（arity）可以变化时，它们被称为`变长`（Variadic）模板；即它们适用于任意数量的参数。更准确地说，参数可能有一个最小数量，但没有最大数量。此外，模板参数允许不同的类型。\n\
  \n### 3.11.1 递归函数\n\nC++11 我们将通过一个用于混合类型的 `sum` 函数来演示这一特性：\n\n```\ntemplate <typename\
  \ T>\ninline T sum(T t) { return t; }\n\ntemplate <typename T, typename ...P>\n\
  inline T sum(T t, P ...p)\n{\n    return t + sum(p... );\n}\n```\n\n变长模板通常通过递归来处理。我们拆解所谓的`参数包`（Parameter\
  \ Pack）并处理其子集。通常，分离出一个元素并将其与剩余的结果相结合。\n\n变长模板引入了新的省略号运算符，用三个点（`...`）表示。起初，这种表示法可能会令人困惑，许多程序员在记忆把点放在哪里方面遇到了困难。在挣扎一段时间后，我们发现了一个实用的约定：将要打包的参数放在省略号的右侧，将解包的参数放在省略号的左侧。在下面的示例中，你可以看到这种约定如何应用于\
  \ `sum` 函数的类型和对象：\n\n* `typename ...P`: 将多个类型参数封装进类型包 `P` 中；\n* `<P...>`：实例化类或函数模板时解包\
  \ `P`（稍后会提到）；\n* `P ...p`: 将多个函数参数封装进变量包 `p` 中；\n* `sum(p...)`: 解包变量包 `p` 并使用多个参数调用\
  \ `sum`。\n\n关于我们的约定，第三行是最难完整编写的。它在没有空格的情况下也可以编译，且紧跟类型后面的省略号从技术角度来看是合理的。然而，我们发现像上面那样的空格最便于解释表达式。\n\
  \n回到我们的 `sum` 函数，它计算第一个条目与其他项之和。这个和又以相同的方式递归地计算。为了终止递归，我们为单参数编写了一个重载。我们也可以为零参数函数（无参数的函数）编写一个重载，返回\
  \ `int`  0。\n\n我们的实现有一个很大的缺点：返回类型是第一个参数的类型——这里是 `int`。这在某些情况下可能部分可行：\n\n```\nauto\
  \ s= sum(-7, 3.7f, 9u, -2.6);\nstd::cout ≪ \"s is \" ≪ s\n          ≪ \" and its\
  \ type is \" ≪ typeid(s).name() ≪ \".\\n\";\n```\n\n这产生了：\n\n```\ns is 2 and its\
  \ type is int.\n```\n\n3.1 的正确结果不能存储为 `int`。这并不十分理想，但在接下来的计算中情况可能会更糟：\n\n```\nauto\
  \ s2= sum(-7, 3.7f, 9u, -42.6);\n```\n\n这同样返回一个 `int`：\n\n```\ns2 is -2147483648\
  \ and its type is int.\n```\n\n在 Linux 上，`typeid` 的输出必须使用 `c++filt` 等工具进行反混淆。Visual\
  \ Studio 则贴心地地提供了原始类型名称。\n\n第一个中间结果是 9 - 42.6 = -33.6，它在转换为 `unsigned` 时会产生一个很大的数，随后变成一个非常小的\
  \ `int` 值。另一方面，计算：\n\n```\nauto s= -7 + 3.7f + 9u + -42.6;\n```\n\n计算得正确的结果并将其存储为\
  \ `double`。但在我们指责变长模板之前，我们必须承认为中间值和最终结果选择了不恰的类型。我们将在 5.2.7 节中使用更合适的 `return` 类型来修正这一点。或者，使用\
  \ `auto` 推导的返回类型也能解决这个问题。\n\n为了在编译时计算参数包中的参数个数，我们可以使用函数类的表达式 `sizeof...`：\n\n```\n\
  template <typename ...P>\nvoid count(P ...p)\n{\n    cout ≪ \"You have \" ≪ sizeof...(P)\
  \ ≪ \" parameters.\\n\";\n    ...\n}\n```\n\nA.2.6 节中的二进制 I/O 在 A.6.4 节中修订，允许在读写操作中使用任意数量的参数。\n\
  \n正如 `sum` 示例所示，变长模板的全部威力只有在与元编程结合时才会释放。\n\n### 3.11.2 直接展开\n\nC++11 在上一节中使用了展开。遗憾的是，该运算符的优先级最低。我们通过逗号来演示这一点：\n\
  \n```\ntemplate <typename ... Args>\nvoid print1(ostream& os, const Args ...args)\n\
  {\n    (os ≪ args ≪ \", \")...;\n    os ≪ '\\n';\n}\n```\n\n参数包遗憾位于函数调用和初始化列表中。我们可以通过将其转换为\
  \ `dummy` 来解决这个问题：\n\n```\ntemplate <typename ... Args >\nvoid dummy(Args ...) {}\n\
  \ntemplate <typename ... Args >\nvoid print2(ostream& os, const Args ...args)\n\
  {\n    dummy((os ≪ args ≪ \", \"));\n    os ≪ '\\n';\n}\n```\n\n现在我们遇到了另一个小问题：参数求值的顺序不受标准规定，每个编译器都可以自由选择顺序。例如下面的调用：\n\
  \n```\nprint3(cout, 3, 17.2, \"Thingy\")\n```\n\n为了 100% 确定这一点，我们可以将第一个表达式转换为 `void`，以防该类型重载了运算符。我们在\
  \ `clang++` 上得到了预期的输出：\n\n```\n3, 17.2, Thingy,\n```\n\n而在 `g++` 上则是：\n\n```\nThingy,\
  \ 17.2, 3,\n```\n\n只要操作顺序无关，我们就可以这种方法，但对于打印来说，如果在所有编译器上都有相同的顺序（最好与调用顺序相同）。为了保证顺序，我们可以在初始化中使用它：\n\
  \n```\ntemplate <typename ... Args >\nvoid print4(ostream& os, const Args ...args)\n\
  {\n    auto dummy = {(os ≪ args ≪ \", \", 0)... };\n    os ≪ '\\n';\n}\n```\n\n\
  C++17 为了避免编译器抱怨对象 `dummy` 未被使用，我们可以在变量名后插入 `[[maybe_unused]]` 属性，至少在 C++17 中可以。\n\
  \n### 3.11.3 索引序列\n\nC++14 C++14 我们有了一个变长类型 `index_sequence`，其模板参数是索引：\n\n```\n\
  using seq1= index_sequence<3, 9, 4, 11>;\n\nusing seq2= index_sequence<0, 1, 2,\
  \ 3>;\n```\n\n像 `seq2` 这样从 0 到 *n*-1 的序列非常常见，可以通过 `make_index_sequence` 方便地创建：\n\
  \n```\nusing seq2= make_index_sequence <4>;\n```\n\n\n\n\n\n20. 它实际上不是一种类型，而是 `integer_sequence`\
  \ 的模板别名，但它可以像类型一样被使用。\n\n通过这样的 `index_sequence`，我们可以创建索引从 0 到 `n - 1` 的表达式，例如同时访问\
  \ `tuple` 或 `array` 的所有成员。作为一个用用例，我们喜欢创建一个 `caller` 类，它存储任意对象，以便稍后用这些对象作为参数调用变长函数：\n\
  \n```cpp\ntemplate <typename ... Args>\nstruct caller\n{\n    caller(Args&& ...\
  \ args) : t(forward<Args>(args)...) {}\n    template <typename F> auto call(F f)\
  \ const\n    { f( /* t 已解包 */ ); }\n    std::tuple<Args...>t;\n}\n```\n\n因此，我们可以利用其变长构造函数将变长参数列表存储到\
  \ `tuple` 中。我们还需要相反的操作：将 `tuple` 转换为其组件的（变长）列表。在上一节中，我们遇到了一个问题，即只能在函数调用或初始化列表中展开变长表达式。而这次我们有一个函数调用，但\
  \ `call` 方法并不是变长模板。这就是 `index_sequence` 发挥作用场的地方；我们为类添加了另一个带有变长索引的方法，并使用 `index_sequence`\
  \ 对象来调用它：\n\n```cpp\ntemplate <typename F> auto call(F f) const\n{ call_help(f,\
  \ make_index_sequence<sizeof ...(Args)>{}); }\n\ntemplate <typename F, size_t ...I>\n\
  auto call_help(F f, index_sequence<I... >) const\n{ return f(get <I>(t)...); }\n\
  ```\n\n假设我们有三个参数，那么 `call_help` 将被要调用的函数和一个类型为 `index_sequence<0, 1, 2>` 的（未使用）对象调用。这会将参数包\
  \ `I` 实例化为 `0, 1, 2`，并将函数调用展开为 `f(get<0>(t), get<1>(t), get<2>(t))`。这种方法相比递归的优势在于，实例化函数的数量是固定的。\n\
  \nC++17 上述类在 C++17 中变得更加简单。已经存在一个变长函数：\n\n```cpp\ntemplate <typename F>\nauto call(F\
  \ f) const\n{ std::apply(f, t); }\n```\n\n在 第 4.6.7 节 中，我们将演示如何使用这种技术同时 `lock` 一个任意大小的互斥锁数组。\n\
  \n### 3.11.4 折叠（Folding）\n\nC++17 与之前演示的递归方法不同，可以在 C++17 中折叠大多数二元操作。之前的示例是从右结合求和，且不支持空的加数列表。我们可以使用折叠表达式来实现相同的功能：\n\
  \n```cpp\ntemplate <typename ...P>\nauto sum(const P& ...p)\n{\n    return (p +\
  \ ... );\n}\n```\n\n注意，折叠表达式需要外括号。为了简单起见，我们推导了返回类型。然而，对于常用类型，加法是左结合定义的。此外，我们可以说，在缺少加数的情况下，结果应为\
  \ `int`  0：\n\n```cpp\ntemplate <typename ...P>\nauto sum(const P& ...p)\n{\n  \
  \  return (0 + ... + p);\n}\n```\n\n总而言，结合左结合和右结合，以及带或无单位元，我们共有四种版本的折叠表达式：\n\n-\
  \ 左结合：\n    - “... + x” 对应 `(((*x*[1] + *x*[2]) + *x*[3]) + ··`\n    - “0 + ...\
  \ + x” 对应 `(((0 + *x*[1]) + *x*[2]) + ··`\n- 右结合：\n    - “x + ...” 对应 `x*[1] + (*x*[2]\
  \ + (· · +*x[n]*))`\n    - “x + ... + 0” 对应 `x*[1] + (· · +(*x[n]* + 0))`\n\n支持折叠表达式的操作有：\n\
  \n```\n+  -  *   /    %   ∧   &   |   ≪   ≫\n+= -= *=  /=   %=  ∧=  &&=  |=  ≪=\
  \  ≫=  =\n== != <   >    <=  >=     &&  || ,         .*        -<*\n```\n\n### 3.11.5\
  \ 类型生成器\n\n现实世界中的模板类通常是高度参数化的。为了减少编码工作量，我们可以为这些参数定义默认值，这样我们就不需要声明所有的参数。令人沮丧的是，某些类型的模板参数大部分等于默认值，但仅在长参数列表的末尾才有一些非默认值；这时我们必须也声明之前的所有参数——即使它们有默认值。\n\
  \n为了通过仅声明非默认值从类模板定义类型，我们可以创建一个类型生成器。我们甚至可以更进一步，让生成器从不同的类模板中选择。这样我们可以达到高水平的抽象：我们只声明相关的属性，并让类型生成器选择具有这些属性的适当类型。为了说明，我们喜欢给出一些来自\
  \ MTL5:^(21)\n\n21. 希望它在书出版前或稍后发布；另见 §[4.7]。\n\n```cpp\nusing A = matrix;\nusing\
  \ B = matrix;\nusing B2 = matrix;\nusing B3 = matrix;\nusing C = matrix;\nusing\
  \ E = matrix;\nusing F = matrix;\nusing H = matrix;\n```\n\n在这里，`A` 是 `matrix`。`B`\
  \ 可能是 `sparse`。`B2` 是 `compressed`。`B3` 是 `compressed`。`C` 是 `column-major`。`E`\
  \ 是 `int`。`F` 是 `dimension`。`H` 是 `referring`。\n\n### 3.11.6 增长测试\n\n`c++11/growing_test.cpp`\n\
  \n变长模板的一个并不明显的领域是测试。在我们较传统的 C03 编程中，实现了一个新的数据结构（例如矩阵）并测试了它的行为。后来我们添加了一个新的泛型函数，并用当时的实体对其进行了测试。\n\
  \n我们没有做的是用后期开发的类型扩展泛型函数的测试。有了变长函数和 `tuple`，我们现在可以编写随库演变的测试。我们从定义测试集开始：\n\n```cpp\n\
  using small_set = tuple<int, float>;\nusing compact_set = tuple_cat_type<small_set,\
  \ tuple<short, double>>;\n```\n\n元组自 C++11 起就可以合并，但我们并不合并 `tuple` 对象，只合并它们的类型：\n\
  \n```cpp\ntemplate <typename ... Tuples>\nusing tuple_cat_type = decltype(tuple_cat(declval<Tuples>()...));\n\
  ```\n\n请注意，这是一个以变长类型作为参数的变长模板别名。\n\n我们现在编写一个工具函数，递归地对 `tuple` 中的每个类型调用测试（或其他任何函数对象）：\n\
  \n```cpp\ntemplate <typename Fun>\nvoid foreach_type(tuple<>, Fun) {}\n\ntemplate\
  \ <typename First, typename ... Others, typename Fun>\nvoid foreach_type(tuple<First,\
  \ Others...>, Fun f)\n{\n    Fun::template eval<First>();\n    foreach_type(tuple<Others...>{},\
  \ f);\n}\n```\n\n\n\n假设我们想检查测试集中的类型，使得 0 和 1 分别是加法和乘法的单位元：\n\n```\nstruct identity_test\n\
  \n{\n\n    template <typename T>\n\n    static void eval()\n    {\n\n        T zero{0},\
  \ one{1}, nine{9};\n\n        if (zero + nine != nine)\n            throw logic_error{\"\
  Addition wrong\"};\n\n        if (one * nine != nine)\n            throw logic_error{\"\
  Multiplication wrong\"};\n\n        cout ≪ \"Test passed for \" ≪ typeid(T).name()\
  \  endl;\n\n    }\n}\n```\n\n我们现在可以通过单次函数调用对我们的 `compact_set` 执行此测试：\n\n```\nforeach_type(compact_set{},\
  \ identity_test {});\n```\n\n并看到它们都通过了测试：^(22)\n\n```\nTest passed for int\n\nTest\
  \ passed for float\n\nTest passed for short\n\nTest passed for double\n```\n\n22。在必要时对输出进行反修饰（demangling）。\n\
  \n诚然，在简单类型上进行简单操作这并不那么令人深刻。但想象一个包含许多测试的大泛型库。当测试像之前那样以泛型方式实现时，我们只需要通过添加新类型来维护测试集以扩展现有测试。\n\
  \n## 3.12 练习\n\n### 3.12.1 字符串表示\n\n编写一个泛型函数 `to_string`，它接受一个任意类型的参数（作为 `const&`），并通过将其传递给\
  \ `std::stringstream` 来生成一个字符串。\n\n### 3.12.2 元组的字符串表示\n\n编写一个变变模板函数，将任意数量的参数以元组的形式表示为字符串。也就是说，函数调用\
  \ `to_tuple_string(x, y, z)` 通过将每个元素打印到字符串流来返回形式为 `(x, y, z)` 的字符串。\n\n提示：实现这一点有多种方法。对于大多数程序员来说，最简单的方法是使用一个外部函数处理括号，并使用辅助函数\
  \ `to_tuple_string_aux` 递归输出参数。更具挑战性的是使用伪初始化列表（fake initializer list）的非递归方法。只要忽略分隔逗号，使用折叠表达式（fold\
  \ expression）也相对简单，但加上逗号会更有趣。\n\n### 3.12.3 泛型栈\n\n为泛型值类型编写一个栈实现。栈的最大大小在类中定义（硬编码）。提供以下函数：\n\
  \n- 构造函数；\n- 必要时的析构函数；\n- `top`：显示最后一个元素；\n- `pop`：移除最后一个元素（不返回）；\n- `push`：插入新元素；\n\
  - `clear`：删除所有条目；\n- `size`：元素数量；\n- `full`：栈满；以及\n- `empty`：栈为空。\n\n栈溢或栈空必须抛出异常。\n\
  \n#### 3.12.4 带类型参数的有理数\n\n实现练习 2.8.2 中分数的模板版本。\n\n### 3.12.5 Vector 的迭代器\n\n为 `vector`\
  \ 类添加 `begin()` 和 `end()` 方法，以返回起始和结束迭代器。在类中也定义类型 `iterator` 和 `const_iterator`。注意，原始指针可以作为迭代器。这给了你两个选项：\n\
  \n- 使用指针的快速粗略的实现，或\n- 定义良好的迭代器类，它甚至可以检查迭代器是否超出范围或两个比较的迭代器是否指向同一个 vector。\n\n使用 STL\
  \ 函数 `sort` 对 vector 元素进行排序，以证明你的迭代器按预期方式工作。\n\n### 3.12.6 奇数迭代器\n\n为奇数编写一个名为 `odd_iterator`\
  \ 的迭代器类。该类必须建模（实现）`ForwardIterator` 概念。这意味着它必须提供以下成员：\n\n- 默认构造函数和拷贝构造函数；\n- `operator++`\
  \ 到下一个奇数元素，支持前增和后增；\n- `operator*` 作为解引用，返回一个（奇数的）`int`；\n- `operator==` 和 `operator!=`\
  \ 以及\n- `operator=`。\n\n具有明显的语义。此外，该类应包含一个接受 `int` 值的构造函数。该值将在解引用运算符中返回（只要迭代器没有增加）。如果该值是偶数，此构造函数应抛出异常。同样，默认构造函数应将内部值初始化为\
  \ 1 以提供合法状态。\n\n### 3.12.7 奇数范围\n\n编写一个表示奇数范围的类。成员函数或自由函数 `begin` 和 `end` 应返回练习\
  \ 3.12.6 中定义的 `odd_iterator`。以下代码应该打印奇数 {7, 9, ..., 25}：\n\n```\nfor (int i : odd_range(7,\
  \ 27))\n    std::cout ≪ i ≪ \"\\n\";\n```\n\n#### 3.12.8 bool 栈\n\n对练习 3.12.3 中的你的实现进行\
  \ `bool` 特化。像第 3.5.1 节 那样使用 `unsigned char` 来表示 8 个 `bool` 值。\n\n### 3.12.9 自定义大小的栈\n\
  \n修改你在练习 3.12.3 中的实现，使其支持自定义大小。大小作为第二个参数传递。\n\n### 3.12.10 梯形法则\n\n计算函数积分的简单方法是梯形法则。假设我们要在\
  \ $[a, b]$ 上积分 $f$。我们将区间分为 $n$ 个长度为 $(b - a)/n$ 的小区间。这得出了以下公式：\n\n![Images](img/210.jpg)\n\
  \n在此练习中，我们使用函数对象和边界开发梯形法的函数。作为对比，使用继承来实现。作为测试用例，对于 $[0, 4]$ 积分 $exp(3x)$。尝试使用以下内容调用\
  \ `trapezoid`：\n\n```\ndouble exp3f(double x) {\n  return std::exp(3.0 * x);\n}\n\
  \nstruct exp3t {\n  double operator() (double x) const {\n    return std::exp(3.0\
  \ * x);\n  }\n};\n```\n\n- $x \\ge 1$ 时 $f = \\sin(x)$，$x < 1$ 时 $f = \\cos(x)$，范围\
  \ $[0, 4]$。\n- 我们可以调用 `trapezoid(std::sin, 0.0, 2.0)` 吗？\n\n作为第二个练习，开发一个计算差分的函数对象。然后积分差分以验证返回的函数值。\n\
  \n#### 3.12.11 使用 static 的部分特化\n\n实现第 3.5.4 节 中的 `abs` 功能，使用一个名为 `eval` 的 `static`\
  \ 函数并在不创建类对象的情况下调用它。\n\n#### 3.12.12 函数对象\n\n编写一个 $2\\cos(x)+x²$ 的函数对象，并使用第 3.7.1\
  \ 节 中的函数对象计算一阶和二阶导数。\n\n### 3.12.13 Lambda\n\n计算与练习 3.12.12](#ch03.xhtml_sec3_12_12）相同的导数，但这次使用\
  \ lambda 表达式。\n\n#### 3.12.14 实现 make_unique\n\n实现你自己的 `make_unique`。使用 `std::forward`\
  \ 将参数包传递给 `new` 运算符。\n\n\n\n\n实际上，在没有多年使用经验的情况下依赖某些软件，甚至需要某种预知能力。有时候，某些包在开始时运行良好，但只有在在其之上构建了更大的项目后，我们可能会遇到一些无法轻易弥补的严重问题。那时，我们可能会痛苦地意识到，选择另一个软件包或从零开始实现才是更好的选择。\n\
  \nC++ 标准库并不完美，但它的设计和实现非常严谨，使我们能够避免此类糟糕的意外。标准库的组件通过了与核心语言特性相同的详尽评估过程，并保证了最高质量。库的标准化还确保了它的类和函数在每个合规的编译器上都是可用的。我们之前已经介绍了一些库组件，例如\
  \ §2.3.3 中的初始化列表和 §1.7 中的 I/O 流。在本章中，我们将介绍更多的库组件，这些组件对编程科学家和工程师来说非常有用。\n\nNicolai\
  \ Josuttis 提供了关于 C++11 标准库的详尽教程和参考书籍 [40]。Bjarne Stroustrup 的书的第四版 [62] 也涵盖了所有的库组件，尽管细节略少。\n\
  \n此外，针对线性代数或图算法等标准领域，还有许多科学库。我们将在最后一节简要介绍其中一些。\n\n## 4.1 标准模板库\n\n`Standard Template\
  \ Library` (STL) 是用于容器和算法的基础泛型库。每个程序员都应该知道它，并在适当的情况下使用它，而不是造轮子。这个名字可能有点让人困惑：由 Alex\
  \ Stepanov 和 David Musser 创建的 STL 大部分内容已成为 C++ 标准库的一部分。另一方面，标准库的其他组件也是用模板实现的。为了让这种困惑变得“完美”，C++\
  \ 标准将一个库的名称与每个库相关的章节关联起来。在 2011 和 2014 标准中，STL 包含在三个这样的章节中：第 23 节容器库、第 24 节迭代器库和第\
  \ 25 节算法库（后者还包含了部分 C 语言库内容）。\n\n标准模板库不仅提供了实用的功能，还奠了一种编程哲学的基础，这种哲学在重用性和性能的结合上具有不可比拟的力量。STL\
  \ 定义了泛型容器类、泛型算法和迭代器。在线文档在通常的 C++ 参考书中提供。还有整本关于 STL 使用的书籍，因此我们在这里可以简而言之，并参考这些书籍。例如，STL\
  \ 核心实现者之一 Matt Austern 就撰写过这样一本书：[4]。Josuttis 的库教程仅针对 STL 就花费了约 500 页。\n\n### 4.1.1\
  \ 入门示例\n\n容器是其目的是包含对象（包括容器、容器的容器等）的类。`vector` 和 `list` 类是 STL 容器的示例。这些类模板中的每一个都由元素类型参数。例如，以下语句创建了一个\
  \ `double` 向量和一个 `int` 向量：\n\n```\nstd::vector <double> vec_d;\n\nstd::vector <int>\
  \   vec_i;\n```\n\n注意，STL 的 vectors 并不是数学意义上的向量，因为它们不提供算术运算。因此，在各种演变的实现中，我们创建了自己的向量类。\n\
  \nSTL 还包含大量算法，用于评估和更改容器的数据。例如，上述的 `accumulate` 算法可以按如下方式计算列表或向量上的任何归约——例如和、乘积或最小值：\n\
  \n```\nstd::vector <double> vec ; // 填充向量...\n\nstd::list <double>  lst ; // 填充列表...\n\
  \ndouble vec_sum = std::accumulate(begin(vec), end(vec), 0.0);\n\ndouble lst_sum\
  \ = std::accumulate(begin(lst), end(lst), 0.0);\n```\n\n函数 `begin()` 和 `end()` 像以前一样返回右开区间的迭代器。C++11\
  \ 为它们引入了自由函数表示法，而在 C++03 中我们必须使用相应的成员函数。\n\n### 4.1.2 迭代器\n\nSTL 的核心抽象是 `Iterators`（迭代器）。简单来说，迭代器是泛化的指针：人们可以对它们进行解引用、比较，并改变所指的位置，正如我们已经在\
  \ 第 3.3.2.5 节 中通过自己的 `list_iterator` 演示的那样。然而，这种简化并没有体现迭代器的重要性。迭代器是`一种解耦数据结构与算法实现的基本方法论`。在\
  \ STL 中，每个数据结构都提供一个用于遍历它的迭代器，且所有算法都是基于迭代器实现的，如图图 4–1 所示。\n\n![Images](img/04fig01.jpg)\n\
  \n**图 4–1：STL 容器与算法之间的互操作性**\n\n要在 *n* 个数据结构上编写 *m* 个算法，在经典的 C 和 Fortran 编程中需要：\n\
  \n*m* × *n* 次实现。\n\n有了迭代器，我们首先必须为所有容器提供接口，但每个算法只需要一个实现，这把总编程工作减少到：\n\n*m* + *n*\
  \ 次实现！\n\n#### 4.1.2.1 分类\n\n并不是所有的算法都能与每个数据结构配合。哪种算法可以在给定的数据结构上工作取决于提供的迭代器类型。迭代器可以通过访问形式进行区分：\n\
  \n`InputIterator`（输入迭代器）：用于读取条目的（仅一次）。\n\n`OutputIterator`（输出迭代器）：用于写入条目的（仅一次）。\n\
  \n注意，写入能力并不意味着可读性；例如，`ostream_iterator` 是用于向输出流（如 `cout`）写入的 STL 接口。迭代器的另一种区分是遍历形式：\n\
  \n`ForwardIterator`（向前迭代器）：可以移动到下一个元素的概念，即提供 `operator++` 的类型。它是 `InputIterator`\
  \ 和 `OutputIterator` 的细化^(1)。与它们相比，`ForwardIterator` 允许多次读取和多次遍历。\n\n`BidirectionalIterator`（双向迭代器）：具有向前和向后遍历能力的概念，即具有\
  \ `operator++` 和 `operator--` 的类型。它是 `ForwardIterator` 的细化。1。在 §3.10 的上。\n\n`RandomAccessIterator`（随机访问迭代器）：可以添加任意正负偏移量的概念，即额外提供\
  \ `operator[]` 的类型。它是 `BidirectionalIterator` 的细化。\n\n只使用简单迭代器接口（如 `InputIterator`）的算法实现适用于更多数据结构。相反，提供更丰富迭代器接口（例如模拟\
  \ `RandomAccessIterator`）的数据结构可以用于更多算法。\n\n所有迭代器接口的一个巧妙设计是，它们的操作也可以通过指针提供。每个指针都模拟\
  \ `RandomAccessIterator`，因此所有 STL 算法都可以应用于传统的数组。\n\n#### 4.1.2.2 使用迭代器\n\nC++11\
  \ 所有标准容器模板都提供了一组丰富且一致的迭代器类型。以下这个非常简单的示例展示了迭代器的典型用法：\n\n```\nusing namespace std;\n\
  \nstd::list <int> l= {3, 5, 9, 7};           // C++11\n\nfor (list <int>::iterator\
  \ it= l.begin(); it != l.end(); ++it) {\n\n    int i= *it;\n\n    cout ≪ i ≪ endl;\n\
  \n}\n\n```\n\n\n\n\n在第一个示例中，我们将范围限制在 C++03 特性（列表初始化除外），以证明操作迭代器对于 C++11 来说并不是新事物。在本节的剩余部分中，我们将使用更多的\
  \ C++11 特性，但原理保持不变。\n\n如代码段所示，迭代器通常成对使用，第一个处理实际迭代，第二个标记容器的末尾。迭代器由相应的容器类通过标准方法 `begin()`\
  \ 和 `end()` 创建。`begin()` 返回的迭代器指向第一个元素，而 `end()` 返回一个指向元素末尾之后的迭代器。`end` 迭代器仅用于比较，在大多数情况下，尝试访问其值将失败。STL\
  \ 中的所有算法都是用右半开区间 `[b, e*)` 实现的，该区间对 `b` 所所引的值进行操作，然后不断递增直到 `b = e`。因此，`[x, x*)`\
  \ 表示一个空区间。成员函数 `begin()` 和 `end()` 保留了容器的常量性：\n\n- 如果容器对象是可变的，则这些方法返回一个指向可变容器条目的\
  \ `iterator` 类型。\n- 对于常量容器，这些方法返回 `const_iterator`，通过常量引用访问容器条目。\n\n通常 `iterator`\
  \ 可以隐式转换为 `const_iterator`，但你不应该依赖此点。回到现代 C++，我们首先为迭代器引入了类型推导：\n\n```\nstd::list\
  \ <int> l= {3, 5, 9, 7};\n\nfor (auto it =begin(l), e= end(l); it != e; ++it) {\n\
  \    int i= *it;\n    std::cout << i << std::endl;\n}\n```\n\n我们还切换到了 C++11 引入的更符合习惯的\
  \ `begin` 和 `end` 自由函数写法。由于它们是 `inline` 函数，这种变化不会影响性能。提到性能，我们引入了一个新的临时变量来存储 `end`\
  \ 迭代器，因为我们无法 100% 确定编译器能够优化对 `end` 函数的重复调用。\n\n虽然在 във只需要读取数据的语境下可以使用 `const_iterator`，但推导出的迭代器允许我们修改所引用的条目。这里有多种可能性可以确保列表在循环内部不被修改。一种不起作用的是\
  \ `const auto`：\n\n```\nfor (const auto it = begin(l), e= end(l); ...) // 错误\n```\n\
  \n这推导出的不是 `const_iterator` 而是 `const iterator`。这是一个微小但重要的区别：前者是一个指向常量数据的（可变）迭代器，而后者是常量本身，因此不能递增。如前所述，`begin()`\
  \ 和 `end()` 对于常量列表返回 `const_iterator`。因此，我们可以将列表声明为常量，缺点是只能在构造函数中设置。或者我们为此列表定义一个\
  \ `const` 引用：\n\n```cpp\nconst std::list <int>& lr= l;\n\nfor (auto it = begin(lr),\
  \ e= end(lr); it != e; ++it) ...\n```\n\n或者将列表转换为 `const` 引用：\n\n```cpp\nfor (auto\
  \ it = begin(const_cast<const std::list <int>&>(l)),\n          e= end(const_cast<const\
  \ std::list <int>&>(l));\n    it != e; ++it) ...\n```\n\n### C++17\n使用 C++17 函数\
  \ `as_const` 可以更轻松地创建常量引用：\n\n```cpp\nfor (auto it = begin(as_const(l)), e= end(as_const(l));\n\
  \    it != e; ++it) ...\n```\n\n### C++14 此外，C++11 引入了成员函数 `cbegin` 和 `cend`，它们为常量和可变容器返回\
  \ `const_iterator`。相应的自由函数在 C++14 中引入：\n\n```cpp\nfor (auto it = cbegin(l); it !=\
  \ cend(l); ++it) ...\n```\n\n这种基于 `begin`-`end` 的遍历模式如此常见，这引入基于范围的 `for` 循环的。到目前为止，我们只在过时的\
  \ C 数组上使用它，现在很高兴终于将其应用于真实的容器：\n\n```cpp\nstd::list <int> l= {3, 5, 9, 7};\n\nfor\
  \ (auto i : l)\n    std::cout << i << std::endl;\n```\n\n### C++17\n循环变量 `i` 是内部用于遍历整个容器的迭代器的解引用值。因此，`i`\
  \ 连续地引用每个容器条目。由于所有 STL 容器都提供了 `begin` 和 `end` 函数，我们可以用这种简洁的 `for` 循环遍历它们。\n\n为了确定内部使用了\
  \ `const_iterator`，我们可以对列表应用 `as_const`：\n\n```cpp\nfor (auto i : as_const(l))\n\
  \    std::cout << i << std::endl;\n```\n\n细心的读者会意识到，在在这种情况下差异并不真正重要，因为在这个循环中复制了每个条目，但在可能存在其他其他情况，我们可能希望强制内部使用\
  \ `const_iterator`。\n\n更通用地说，我们可以将此 `for` 应用于所有具有返回迭代器的 `begin` 和 `end` 函数的类型：例如表示子容器的类，或返回反向遍历迭代器的辅助函数。这个更广泛的概念被称为范围（Range），这也是基于范围的\
  \ `for` 循环的起源。\n\n#### 4.1.2.3 操作\n`<iterator>` 库提供了两个基本操作：`advance` 和 `distance`。`advance(it,\
  \ n)` 操作将迭代器 `it` 递增 `n` 次。这看起来像是 `it+n` 的笨拙写法，但有两个根本区别：后者不会改变迭代器 `it`（这不一定是劣势），并且仅适用于\
  \ `RandomIterator`。`advance` 函数可以用于任何类型的迭代器。从意义上说，`advance` 就像 `+=` 的实现，但适用于只能移动一步的迭代器。\n\
  \n为了效率，函数内部对不同的迭代器类别进行分发。我们已经见过如何用概念（concepts）来实现。现在我们演示以前是如何做的：\n\n**列表 4–1：`advance`\
  \ 中的函数分发**\n\n```cpp\ntemplate <typename Iter, typename Distance>\ninline void advance_aux(Iter&\
  \ i, Distance n, input_iterator_tag)\n{\n    assert(n >= 0);\n    for (; n > 0;\
  \ --n)\n        ++i;\n}\n\ntemplate <typename Iter, typename Distance>\ninline void\
  \ advance_aux(Iter& i, Distance n,\n                        bidirectional_iterator_tag)\n\
  {\n    if (n >= 0)\n        for (; n > 0; --n) ++i;\n    else\n        for (; n\
  \ < 0; ++n) --i;\n}\n\ntemplate <typename Iter, typename Distance>\ninline void\
  \ advance_aux(Iter& i, Distance n,\n                        random_access_iterator_tag)\n\
  {\n    i+= n;\n}\n\ntemplate <typename Iter, typename Distance>\ninline void advance(Iter&\
  \ i, Distance n)\n{\n    using cat= typename iterator_traits<Iter>::iterator_category;\n\
  \    advance_aux(i, n, cat{});\n}\n```\n\n\n\n\n当函数 `advance` 使用某种迭代器类型进行实例化时，该迭代器的类别由类型特性（§5.2.1](#ch05.xhtml_sec5_2_1)）决定。该“标签类型”（Tag\
  \ Type）的对象决定了调用辅助函数 `advance_aux` 的哪个重载。因此，当 `Iterator` 是随机访问迭代器时，`advance` 的运行时间是常数，否则为线性时间。双向迭代器和随机访问迭代器允许负数距离。这种基于标签的函数选择也称为“标签分发”（Tag\
  \ Dispatching）。\n\n请注意，对于 `advance_aux` 对应的最后一个参数，仅指定了类型而没有给出参数名。否则，编译器在严格（pedantic）模式下会发出该参数未被使用的警告。为了消除此警告，我们可以在\
  \ C++17 中使用属性 `[[maybe_unused]]` 声明这是有有意的，例如：\n\n```cpp\ntemplate <typename Iter,\
  \ typename Distance>\n\ninline void advance_aux(Iter& i, Distance n,\n\n       \
  \                 input_iterator_tag tag [[maybe_unused]]);\n```\n\n现代编译器足够智能，能够意识到\
  \ `advance_aux` 每个重载中的第三个参数都是未使用的，并且标签类型是空类。因此，参数传递和标签类型对象的构造会被优化掉。因此，额外的函数层和标签分发不会导致运行时开销。例如，对\
  \ vector 迭代器调用 `advance` 只等于生成 `i+= n` 的代码。\n\n`advance` 的对应操作是 `distance`：\n\n\
  ```cpp\nint i= distance(it1, it2);\n```\n\n它计算两个迭代器之间的距离，即第一个迭代器必须增加多少次才能等于第二个。它的它的实现也是通过标签（或概念）分发的，使得随机访问迭代器的操作是常数级的，否则是线性的。\n\
  \n### 4.1.3 容器\n\n标准库中的容器涵盖了广泛的重要数据结构，它们易于使用且非常高效。在编写自己的容器之前，尝试标准容器绝对是值得的。\n\n####\
  \ 4.1.3.1 Vectors\n\n`std::vector` 是最简单的标准容器，在连续存储数据方面效率最高，类似于 C 数组。C 数组在一定大小内存储在栈上，而\
  \ `vector` 始终驻留在堆上。Vector 提供了下标运算符，并可以使用数组风格的算法：\n\n```cpp\nstd::vector <int> v=\
  \ {3, 4, 7, 9};\n\nfor (int i= 0; i < v.size(); ++i)\n\n    v[i]*= 2;\n```\n\n或者，我们可以使用迭代器：直接使用或隐藏在基于范围的\
  \ `for` 循环中：\n\n```cpp\nfor (auto& x : v)\n\n    x*= 2;\n```\n\n遍历的不同的形式同样高效。可以通过向末尾添加新条目来扩大\
  \ vector：\n\n```cpp\nstd::vector <int> v;\n\nfor (int i= 0; i < 100; ++i)\n\n  \
  \  v.push_back(my_random());\n```\n\n其中 `my_random()` 返回随机数，类似于第 4.2.2 节 中的生成器。STL\
  \ `vector` 经常预留额外的空间，如图 4–2 所示，以加速 `push_back`。\n\n![Images](img/04fig02.jpg)\n\n\
  **图 4–2：`vector` 的内存布局**\n\n因此，追加条目可以：\n\n- 通过只需填充已预留的空间变得非常快，或者\n- 当必须分配更多内存并复制所有数据（或至少逐元素移动）时速度较慢。\n\
  \n可用空间由成员函数 `capacity` 提供。当 `vector` 数据增大时，额外空间量通常与 `vector` 的大小成比例，因此 `push_back`\
  \ 耗时渐近对数级。典型实现在 vector 大小翻倍时（即从 *s* 扩大到 2*s* 或 ![Images](img/2-root.jpg) 在每次重新分配时）执行一次或两次内存分配。图\
  \ 4–3 说明了这一点：第一幅图是一个完全填充的 vector，添加新条目需要像第二幅图那样进行新的分配。之后，我们可以继续添加条目，直到额外空间也被填满，如第三幅图所示。这时，必须分配新内存并复制所有条目（或逐元素移动），如第四幅图所示；只有这样才能添加新条目。结果是该\
  \ vector 的所有迭代器都可能失效。为了安全起见，你不应该使用在插入或删除条目之前创建的 `vector` 迭代器。\n\n![Images](img/04fig03.jpg)\n\
  \n**图 4–3：追加 `vector` 条目**\n\n`resize(n)` 方法将 vector 缩小或扩大到大小 `n`。新条目会被默认构造（对于内置类型则设置为\
  \ 0）。使用 `resize` 缩小 vector 不会释放内存。这在 C++11 中可以通过 `shrink_to_fit` 实现，它可以将容量减少到 vector\
  \ 的实际大小。\n\n⇒ `c++11/vector_usage.cpp`\n\nC++11 下面的简单程序演示了如何使用 C++11 特性设置和修改 `vector`：\n\
  \n```cpp\n#include <iostream>\n#include <vector>\n#include <algorithm>\n\nint main()\n\
  {\n    using namespace std;\n    vector<int> v = {3, 4, 7, 9};\n    auto it = find(v.begin(),\
  \ v.end(), 4);\n    cout << \"After find, capacity = \" << v.capacity() << endl;\n\
  \    for (auto i : v)\n        cout << i << \" \";\n    cout << \"\\nSize = \" <<\
  \ v.size() << \", capacity = \" << v.capacity() << endl;\n    v.shrink_to_fit();\n\
  \    cout << \"After shrink_to_fit, capacity = \" << v.capacity() << endl;\n   \
  \ return 0;\n}\n```\n\n#### 4.1.3.2 双端队列\n\n`deque`（**D**ouble-**E**nded **QUE**\
  \ 的缩写）可以从几个角度来理解：\n\n- 作为一个 FIFO（先进先出）队列；\n- 作为一个 LIFO（后进先出）栈；\n- 作为一个可以在开头快速插入的\
  \ `vector` 泛化。\n\n由于其内存布局，这种容器具有非常有趣的属性。内部上由如图 4–4]。同时，`deque` 条目只有在中间插入或删除内容时才会重新定位。这不仅节省了拷贝或移动的代价，还允许我们存储既不可拷贝也不可移动的类型，正如我们将在后面所示。\n\
  \n⇒ `c++11/deque_emplace.cpp`\n\n\n\n\nC++11 **非常高级：** 通过 `emplace` 方法，我们甚至可以创建不可拷贝、不可移动类对象的容器。假设我们有一个\
  \ `solver` 类，它既不包含拷贝函数也不包含移动构造函数（例如，由于存在 `atomic` 成员；关于 `atomic` 请参阅 §4.6）：\n\n\
  ```cpp\nstruct parameters {};\n\nstruct solver\n{\n    solver(const mat& ref, const\
  \ parameters& para)\n      : ref(ref), para(para) {}\n    solver(const solver&)\
  \ = delete;\n    solver(solver&&) = delete;\n    const mat&        ref;\n    const\
  \ parameters& para;\n};\n```\n\n![Images](img/04fig04.jpg)\n\n**图 4–4：`deque`**\n\
  \n该类的多个对象存储在 `deque` 中。稍后，我们遍历这些 solver：\n\n```cpp\nvoid solve_x(const solver& s)\
  \ { ... }\n\nint main ()\n{\n    parameters     p1, p2, p3;\n    mat           \
  \ A, B, C;\n    deque<solver> solvers;\n    // solvers.push_back(solver(A, p1));\
  \ // 将无法编译\n    solvers.emplace_back(B, p1);\n    solvers.emplace_back(C, p2);\n\
  \    solvers.emplace_front(A, p1);\n    for (auto& s : solvers)\n        solve_x(s);\n\
  }\n```\n\n请注意，`solver` 类只能在没有数据移动或拷贝的容器方法中使用。例如，`insert` 和 `erase` 会重新定位数据，将无法编译。对于其他容器——如\
  \ `vector`——由于分配新内存时的数据移动，我们甚至无法使用 `emplace_back`。我们必须对循环变量 `s` 使用引用以避免在此处拷贝。\n\n\
  ### 4.1.3.3 列表\n\n`list` 容器（在 `<list>` 中）是双向链表，如图 4–5 所示，它可以向前和向后遍历（即其迭代器实现了 `BidirectionalIterator`）。与之前的容器相比，我们无法直接访问第\
  \ *n* 个元素。与 `vector` 和 `deque` 相比，它的优势在于中间插入和删除开销较低。\n\n![Images](img/04fig05.jpg)\n\
  \n**图 4–5：双向链表（理论上）**\n\n当插入或删除其他元素时，列表元素永远不会移动。因此，只有被删除条目的引用和迭代器会失效，而所有其他条目保持有效。\n\
  \n```cpp\nint main ()\n{\n    list<int> l= {3, 4, 7, 9};\n    auto it=  find(begin(l),\
  \ end(l), 4),\n         it2= find(begin(l), end(l), 7);\n    l.erase(it);\n    cout\
  \ << \"it2 still points to \" << *it2 << '\\n';\n}\n```\n\n每个单独条目的动态内存处理将它们分散在内存中，如图\
  \ 4–6 所示，导致不幸的缓存行为使得性能差于 `vector` 和 `deque`。列表在某些操作上更高效，但在许多其他操作上较慢，因此 `list` 的整体性能很少优于其他；例如，对比\
  \ [30] 或 [74]。幸运的是，在泛型编程应用程序中，只需更改容器类型即可快速克服此类性能瓶颈。\n\n![Images](img/04fig06.jpg)\n\
  \n**图 4–6：现实中的双向链表**\n\n在典型的 64 位平台上，我们的 `list<int>` 条目占用 20 字节：两个 8 字节的 64 位指针和\
  \ 4 字节的 `int`。当不需要向后迭代时，我们可以节省一个指针的空间，并使用 `forward_list`（在 `<forward_list>` 中），这使得对应的列表条目只需要\
  \ 12 字节。\n\n### 4.1.3.4 集合和多重集合\n\n`set` 容器存储值属于集合的信息。`set` 中的条目内部是有排序的，因此可以以对数复杂度进行访问。除非用户提供自己的准则，否则使用\
  \ `operator<` 进行比较。可以通过成员函数 `find` 和 `count` 测试值是否在 `set` 中存在。`find` 返回一个指向该值的迭代器，如果未找到，则返回\
  \ `end` 迭代器。如果不需要迭代器，方法 `count` 更方便：\n\n```cpp\nset <int> s= {1, 3, 4, 7, 9};\n\
  s.insert(5);\nfor (int i= 0; i < 6; ++i)\n    cout << i << \" appears \" << s.count(i)\
  \ << \" time(s).\\n\";\n```\n\n产生预期的输出：\n\n```\n0 appears 0 time(s).\n1 appears\
  \ 1 time(s).\n2 appears 0 time(s).\n3 appears 1 time(s).\n4 appears 1 time(s).\n\
  5 appears 1 time(s).\n```\n\nC++20 添加了 `contains` 方法来测试值是否存在：\n\n```cpp\nif (s.contains(i))\
  \ {\n    cout << \"is\";\n} else {\n    cout << \"n't\";\n}\n```\n*(注：原文文本中存在关于\
  \ C++20 方法的重复和乱码，已按逻辑整合。)*\n\n\n\n当我们确定 `map` 中存在某个键时，可以使用 `at` 方法。它返回一个对值的引用，类似于\
  \ `[]` 运算符。主要的区别在于，当未找到键时，它会抛出一个 `out_of_range` 异常——即使 `map` 是可变的。因此，它不能用于插入新条目，但为查找这些条目提供了一个紧凑的接口。\n\
  \n当我们遍历容器时，会得到键和关联值的对（因为单独的值本身是没有意义的）。\n\n⇒ `c++17/multimap_test.cpp`\n\n当一个键可以与多个值关联时，我们需要一个\
  \ `multimap`。具有相同键的条目存储相邻相邻，以便我们对它们进行迭代。迭代器范围由 `lower_bound` 和 `upper_bound` 方法提供。在下一个示例中，我们遍历所有键等于\
  \ 3 的条目并打印它们的值：\n\n```\nmultimap<int, double> mm=\n    {{3, 1.3}, {2, 4.1}, {3,\
  \ 1.8}, {4, 9.2}, {3, 1.5}};\n\nfor (auto it= mm.lower_bound(3),\n          end=\
  \ mm.upper_bound(3); it != end; ++it)\n    cout ≪ \"The value is \" ≪ it->second\
  \ << '\\n';\n```\n\n产生如下：\n\n```\nThe value is 1.3.\n\nThe value is 1.8.\n\nThe\
  \ value is 1.5.\n```\n\n使用 `equal_range` 方法可以更方便且更高效地实现相同的输出：\n\n```cpp\nfor (auto\
  \ [it, end]= mm.equal_range(3); it != end; ++it)\n    cout ≪ \"The value is \" ≪\
  \ it->second << \".\\n\";\n```\n\n如果该方法实际上返回的是一个范围而不是迭代器对，它将变得更加方便。这样我们就可以使用基于范围的\
  \ `for` 循环流畅地遍历它，而不是显式地使用迭代器。\n\n最后四个容器——`set`、`multiset`、`map` 和 `multimap` 都是实现为某种树，并且访问具有对数复杂度。在下一节中，我们将介绍平均访问速度更快的容器。\n\
  \n### C++11 4.1.3.6 哈希表\n\n⇒ `c++11/unordered_map_test.cpp`\n\n哈希表是具有高效搜索能力的容器。与之前的容器相比，哈希映射（hash\
  \ maps）单次访问具有常数复杂度（当哈希函数良好时）。为了避免与现有软件命名冲突，标准委员会避免了使用带有“hash”的名称，并在有序容器的名称前加上了“unordered”（无序）。无序容器的使用方法与它们的有序版本相同：\n\
  \n```cpp\nunordered_map <string, double> constants=\n    {{\"e\", 2.7}, {\"pi\"\
  , 3.14}, {\"h\", 6.6e- 34}};\n\ncout ≪ \"The Planck constant is \" ≪ constants[\"\
  h\"] << '\\n';\n\nconstants [\"c\"]= 299792458;\n\ncout ≪ \"The Euler constant is\
  \ \" ≪ constants.at(\"e\") << \"\\n\\n\";\n```\n\n产生与 `map` 相同的结果。如果需要，可以提供自定义的哈希函数。\n\
  \n**进阅读：** 所有容器都提供了一个可自定义的分配器，允许我们实现自己的内存管理或使用特定平台的内存。分配器的接口在例如参见 [40], [62]。\n\n\
  ### 4.1.4 算法\n\n通用 STL 算法定义在头文件 `<algorithm>` 中，主要用于数值计算的算法定义在 `<numeric>` 中。\n\n\
  #### 4.1.4.1 非修改序列操作\n\n`find` 接受三个参数：两个定义搜索空间右开区间的迭代器，以及一个在该范围内要搜索的值。由 `first`\
  \ 指出的每个条目都会与 `value` 进行比较。当找到匹配项时，返回指向该项的迭代器；否则，迭代器递增。如果序列不包含该值，则返回一个与 `last` 相等的迭代器。因此，调用者可以通过将结果与\
  \ `last` 比较来测试搜索是否成功。这实际上并不是一个特别困难的任务，我们可以自己实现：\n\n```cpp\ntemplate <typename InputIterator,\
  \ typename T>\nInputIterator find(InputIterator first, InputIterator last,\n   \
  \                const T& value)\n{\n    while (first != last && *first != value)\n\
  \        ++first;\n    return first;\n}\n```\n\n这段代码片段确实是 `find` 实现的标准方式，尽管可能存在针对特殊迭代器的特化重载。\n\
  \n⇒ `c++11/find_test.cpp`\n\n作为演示，我们考虑一个包含两个 7 的整数值序列。我们想写出从第一个 7 开始到第二个 7 结束的子序列。换句话说，我们必须\
  \ `find` 这两个出现的位置并打印出一个闭区间——而 STL 总是工作在右开区间上。这需要做一些额外的工作：\n\n```cpp\nvector <int>\
  \ seq= {3, 4, 7, 9, 2, 5, 7, 8};\n\nauto it= find(begin(seq), end(seq), 7);    \
  \ // 第一个 7\nauto last= find(it+1, end(seq), 7);         // 第二个 7\n\nfor (auto past=\
  \ last+1; it != past; ++it) // 注意：此处原文逻辑似乎有误，但按要求翻译\n    // 原文逻辑保持不变\n```\n\n （注：原文代码中\
  \ `for (auto past= last+1; it != past; ++it)` 逻辑在数学上可能存在问题，但根据指令我不修改代码逻辑，仅翻译符号和注释）\n\
