  \n\n\n\n```cpp\n# include <boost / static_assert.hpp>\n\ntemplate <typename Matrix>\n\
  class transposed_view\n{\n    BOOST_STATIC_ASSERT ((is_matrix<Matrix>::value));\
  \ // 必须是矩阵\n    // ...\n};\n```\n\n遗憾的是，错误信息并没有什么意义，甚至可以说非常令人困惑：\n\n```\ntrans_const.cpp:96:\
  \ Error: Invalid application of ≫sizeof≪\non incomplete type\n  ≫boost::STATIC_ASSERTION_FAILURE<false>≪\n\
  ```\n\n如果你看到包含 `STATIC ASSERTION` 的错误信息，不要纠结于消息本身——它是没有意义的——而要查看导致此错误的源代码行，并希望编写断言的作者在注释中提供了更多信息。在较新版本的\
  \ Boost 和且符合 C++11 标准的编译器中，该宏会被展开为 `static_assert`，且至少条件会作为错误消息打印出来。注意 `BOOST_STATIC_ASSERT`\
  \ 是一个宏，它并不理解 C++。这在参数包含一个或多个逗号时表现得尤为明显。此时预处理器会将其解释为宏的多个参数并产生混淆。可以通过将 `BOOST_STATIC_ASSERT`\
  \ 的参数包含在双括号中来避免这种混淆，正如我们在示例中所做的那样（尽管在这里并没有必要）。\n\n### A.9.4 匿名类型参数\n\n除了返回参数类型，SFINAE\
  \ 技术也可以应用于模板参数类型。这使得实现代码具有更清晰的可读性。当使能类型处理不再扭曲返回类型或参数，而是表示为一个未使用的且未命名的类型参数时，函数模板的结构会变得好得多。第\
  \ 5.2.6 节中提到的通过在返回类型上应用 SFINAE 为矩阵和向量启用 `L*[1]` 范数的示例，可以被更全面地实现：\n\n```cpp\ntemplate\
  \ <typename T,\n          typename= enable_if_t<is_matrix<T>::value\n          \
  \                         && !is_sparse_matrix<T>::value> >\ninline Magnitude_t<T>\
  \ one_norm (const T& A);\n```\n\n由于我们现在不再对 `enable_if_t` 定义的类型感兴趣，我们可以将其默认值作为未使用的类型参数。必须提到的是，这种形式的函数使能对于在多个实现之间进行分发并不理想。\n\
  \n⇒ `c++11/enable_if_class.cpp`\n\n此时，我们想讨论通过类模板参数来控制成员函数的可用性的话。它们与 SFINAE 无关，因此\
  \ `enable_if` 表达式是错误。假设我们想对向量的每个条目应用位与与操作，即使用标量实现 `&=`。这只有在向量具有整数值时才有意义：\n\n```cpp\n\
  template <typename T>\nclass vector\n{\n    ...\n    template <typename= enable_if_t<std::is_integral<T>::value\
  \ >>\n    vector <T>& operator&=(const T& value);    // 错误错误）\n};\n```\n\n遗憾的是，这段代码无法编译。替换失败必须依赖于函数的模板参数，而不是类的参数。根据\
  \ Jeremiah Wilcock（`enable_if` 的发明者之一）的观点，只需要*看起来*依赖于函数模板参数。因此，我们的 `operator&=`\
  \ 必须依赖于某个参数（例如 `U`），这样我们就可以在 `U` 上应用 `enable_if`：\n\n```cpp\ntemplate <typename\
  \ T>\nclass vector\n{\n    template <typename U>\n    using is_int = std::is_integral\
  \ <T>;\n    template <typename U, typename = enable_if_t<is_int <U>::value> >\n\
  \    vector <T>& operator&=(const U& value);\n};\n```\n\n技巧在于，这个条件可以间接地依赖于 `T`，并且实际上只依赖于\
  \ `T` 而不依赖于 `U`。这里函数有一个自由的模板参数，可以使用 SFINAE：\n\n```cpp\nvector <int>     v1 (3);\n\
  vector <double>  v2 (3);\nv1&= 7;\nv2&= 7.0;       // 错误：operator 已禁用\n```\n\n现在我们成功地根据类的模板参数启用了了一个方法。`clang++`\
  \ 3.4 的错误信息甚至告诉我们该重载已被禁用：\n\n```\nenable_if_class.cpp:87:7: error : no viable overloaded\
  \ '&='\n    v2 &= 7.0; // 未启用\n    ∽∽  ∽∽∽\nenable_if_class.cpp:6:44: note : candidate\
  \ template ignored :\n    disabled by 'enable_if' [with U = double]\nusing enable_if_t\
  \ = typename std::enable_if <Cond, T>::type;\n```\n\n好了，我们的使能机制引用了类模板参数。遗憾的是，仅引用它。函数的模板参数在我们的实现中并不重要。我们可以让\
  \ `double` 标量与 `int` 向量进行“与”操作：\n\n```cpp\nv1&= 7.0;\n```\n\n这个函数调用是被启用的（尽管它无法编译）。我们原始的实现将向量的值类型（即\
  \ `T`）作为函数参数，但这并没有允许我们使用 SFINAE。为了应用 SFINAE 并仅接受 `T` 作为参数，我们必须确定 `T` 和 `U` 是相等的：\n\
  \n```cpp\ntemplate <typename T>\nclass vector\n{\n    template <typename U>\n  \
  \  using is_int = std::is_integral <T>;\n    template <typename U, typename = enable_if_t<is_int\
  \ <U>::value> >\n    ...\n```\n\n\n\n\n\n在这里，我们首先创建了 `A` 的拷贝，所有的转换都在这个拷贝上进行。最后，同一个拷贝被\
  \ `B` 的移动构造函数接管。总而言之，我们只创建了一个 `A` 的拷贝，其转换后的数据最终保留在 `B` 中。尽管我们某种程度上通过 `enable_if`\
  \ 实现了目标，但如果你的平台支持 concepts，使用它们会简单得多，你应该优先使用它们。\n\n## A.10 链接到 C 代码\n\n许多科学库是用 C\
  \ 语言编写，例如 `PETSc`。要在 C++ 软件中使用它们，我们有两种选择：\n\n- 使用 C++ 编译器编译 C 代码或\n- 链接编译后的代码。\n\
  \nC++ 起初是作为 C 的超集。C99 引入了一些不属于 C++ 的特性，甚至在旧的 C 中也存在一些不是合法的 C++ 代码的学术示例。某些特别热心的 C++\
  \ 讨厌者会使用 `class` 和 `bool` 等 C++ 关键字（这些关键字在 C 中不是保留字），以确保他们的代码不会被 C++ 编译器编译。然而，在实践中，大多数\
  \ C 程序都可以用 C++ 编译器编译。\n\n对于不兼容的 C 源码或仅以编译形式提供的软件，可以将 C 二进制文件链接到 C++ 应用程序。然而，C 没有像\
  \ C++ 那样的符号修饰（name mangling）。结果是 C 和 C++ 编译器会将函数声明映射到不同的符号。\n\n假设我们的朋友 Herbert 用\
  \ C 语言开发了史上最好的立方根算法。为了获得菲尔兹奖，他拒绝向我们提供源代码。作为一名伟大的科学家，他特权地表现出固执，并认为用 C++ 编译器编译他的秘密\
  \ C 函数是对它们的亵渎。然而，在他无限的慷慨下，他向我们提供了编译后的代码。为了链接它，我们需要用 C 命名方式声明函数（即不进行符号修饰）：\n\n```\n\
  extern \"C\" double cubic_root (double);\n\nextern \"C\" double fifth_root (double);\n\
  \n...\n```\n\n为了少写一些，我们可以使用块表示法：\n\n```\nextern \"C\" {\n\n    double cubic_root\
  \ (double);\n\n    double fifth_root (double);\n\n...\n\n}\n```\n\n后来他变得更加慷慨，向我们提供了他宝贵的头文件。有了它，我们可以使用所谓的“链接块”（Linkage\
  \ Block）将整组函数声明为 C 代码：\n\n```\nextern \"C\" {\n  # include <herberts/good_ole_math_functions.h>\n\
  \n}\n```\n\n在这种样式下，`<math.h>` 通常包含在 `<cmath>` 中（例外是 Visual Studio）。\n\n⇒ `c++03/interoperable.cpp`\n\
  \n相反，我们可以在 C 中使用 C++ 实现。这种做法可能较少，但并非完全不合理。假设我们正在一个主要用 C 实现的项目工作，并且为它贡献一个组件。该组件应该能被\
  \ C 调用，但我们不想放弃 C++ 更强的类型安全性和高级特性。假设我们在一个模板类中实现了一些函数：\n\n```\ntemplate <typename\
  \ Value>\nclass adder\n{\n  public :\n    static Value eval (Value x, Value y) {\
  \ return x + y; }\n};\n```\n\n由于 C 不得懂我们伟大的模板，我们将它们封装在非模板函数中：\n\n```\nint iadder\
  \ (int x, int y) { return adder <int>:: eval (x, y); }\n\nfloat fadder (float x,\
  \ float y) { return adder < float >:: eval (x, y); }\n```\n\n⇒ `c++03/interoperable.h`\n\
  \n为了让这些函数能够从 C 链接，我们必须将它们声明为 `extern \"C\"`。我们在头文件中这样做，并将其包含在我们的 `cpp` 文件中。现在可以使用以下命令编译它：\n\
  \n```\ng++ -c interoperable.cpp -o interoperable.o\n```\n\n现在我们得到了一个函数名未修饰的对象文件。该对象文件现在可以从我们的\
  \ C 项目中链接。为了调用编译后的函数，我们还需要它们的声明。遗憾的是，C 编译器会在遇到 `extern \"C\"` 时卡住。因此，在 C 和 C++ 中需要略有不同的函数声明。我们可能会想提供两个头文件，但这种冗余是不一致和双重维护的非必要来源。更好的方法是条件编译：\n\
  \n```cpp\n# ifdef __cplusplus\nextern \"C\" {\n# endif\n     int iadder (int x,\
  \ int y);\n     float fadder (float x, float y);\n# ifdef __cplusplus\n}\n# endif\n\
  ```\n\n宏 `__cplusplus` 在每个 C++ 编译器中都是预定义的（但在 C 编译器中不是）。因此，C 编译器只看到函数声明，而 C++ 编译器也会读取链接声明。\n\
  \n⇒ `c++03/interoperable_main.c`\n\n现在在 C 中使用这些函数变得很直接了：\n\n```\n# include <stdio.h>\n\
  # include \" interoperable.h\"\n\nint main ()\n{\n    printf (\"iadder (3, 4) =\
  \ %i.\\n\", iadder (3, 4));\n    printf (\"fadder (3, 4.2 f) = %f.\\n\", fadder\
  \ (3, 4.2f));\n}\n```\n\n尽管 C 和 C++ 之间具有互操作性，你最好还是坚持后者。尽管如此，我们希望这些示例能证明复杂的 C++ 库偶尔会被用于古老的\
  \ C 项目。\n\n# 附录 B 编程工具\n\n“永远不要低估简单工具的力量。”\n—Craig Bruce\n\n在本附录中，我们介绍了一些可以帮助我们实现目标的基础编程工具。\n\
  \n## B.1 `g++`\n\n介绍一些可以帮助我们实现目标的编程编程工具。受欢迎的 C++ 编译器之一是 `g++`，它是 `gcc` 的 C++ 版本。该缩写本代表\
  \ GNU Compiler，但它还支持其他语言（Fortran, Ada, ...）。本节简要介绍如何使用它。\n\n以下命令：\n\n```\ng++ -o\
  \ hello.cpp\n```\n\n将 C++ 源文件 `hello.cpp` 编译为可执行文件 `hello`。`-o` 标志可以省略。此时可执行文件将被命名为\
  \ `a.out`（由于的原因，它是 output 的缩写）。当目录中有多个 C++ 程序时，它们总是互相覆盖会很困扰；因此最好使用输出标志。\n\n最重要的编译器选项有：\n\
  \n- `-I` `directory`：将 `directory` 添加到路径；\n- `-O` `n`：以级别 `n` 优化；\n- `-g`：生成调试信息；\n\
  - `-p`：生成性能分析信息；\n- `-o` `filename`：将输出命名为 `filename` 而不是 `a.out`；\n- `-c`：只编译，不链接；\n\
  - `-D` `macro`：定义 `macro`；\n- `-L` `directory`：将 `directory` 添加到库搜索路径；\n- `-l` `file`：链接\
  \ `lib`file`.a` 或 `lib`file`.so`。\n\n稍微复杂一点的例子是：\n\n```\ng++ -o myfluxer myfluxer.cpp\
  \ -I/opt/include -L/opt/lib -lblas\n```\n\n编译 `myfluxer.cpp` 并将其与 `/opt/lib` 中的\
  \ BLAS 库链接。除了标准包含路径，还在 `/opt/include` 中搜索包含文件。为了生成快速的可执行文件，我们必须使用以下标志：\n\n```\n\
  -O3 - DNDEBUG\n```\n\n`-O3` 是 `g++` 的最高优化。`-DNDEBUG` 定义了一个宏，通过条件编译（`#ifndef NDEBUG`）让\
  \ `assert` 在可执行文件中消失。这对性能非常重要：例如，MTL4 会慢一个数量级，因为每次访问都会进行范围检查。相反，调试时也应该使用某些编译器标志：\n\
  \n```\n-O0 -g\n```\n\n`-O0` 关闭所有优化并全局禁用内联，以便调试器可以单步程序。`-g` 让编译器在二进制文件中存储所有函数和变量名称以及源行标签，以便调试器可以将机器码与源代码关联起来。使用\
  \ `g++` 的简短教程可以在此处找到：[`http://tinf2.vub.ac.be/-dvermeir/manual/uintro/gpp.html](http://tinf2.vub.ac.be/-dvermeir/manual/uintro/gpp.html)`.\n\
  \n\n\n\n\n对于那些玩数独的朋友，让我们大胆进行一次比较吧。调试程序与修复数独中的错误相似之处：它要么快速而简单，要么非常令人恼火，很少介于两者之间。如果错误发生得不久，我们可以迅速检测并修复它。但当错误长时间未被察觉时，它会导致错误的假设，并引发一系列后续错误。结果是，在寻找错误的过程中，我们会发现许多结果错误和/或存在矛盾的部分，但这些部分内部是一致的。这是因为它们建立在虚假的前提之上。要花费大量的思考和工作去反思我们之前创建的一切，是非常令人沮丧的。在数独的情况下，最好的方法通常是彻底放弃并从头开始。对于软件开发来说，这并不总是可选。\n\
  \n带有详细错误处理的防御性编程——不仅针对用户的错误，也针对我们潜在的编程错误——不仅能带来更好的软件，而且通常是非常极佳的时间投资。检查我们自己的编程错误（使用断言\
  \ `assertions`）所需的额外工作是有限（例如 5–20%），而当 bug 隐藏在大型程序的深处时，调试工作可能会无限增长。\n\n### B.2.1\
  \ 基于文本的调试器\n\n有多种调试工具。通常，图形界面工具更符合用户习惯，但它们并不总是可用或方便（尤其是在远程机器上工作时）。在本节中，我们将描述 `gdb`\
  \ 调试器，它对于追踪运行时错误非常有用。\n\n以下使用 GLAS [43] 的小型程序将作为一个案例研究：\n\n```cpp\n#include <glas/glas.hpp>\n\
  #include <iostream>\n\nint main ()\n{\n    glas::dense_vector< int > x( 2 );\n \
  \   x(0)= 1; x(1)= 2;\n\n    for (int i= 0; i < 3; ++ i)\n        std::cout ≪ x(i)\
  \ ≪ std::endl;\n\n    return 0 ;\n}\n```\n\n在 `gdb` 中运行该程序将得到以下输出：\n\n```\n> gdb\
  \ hello\n\n1\n\n2\n\nhello: glas/type/continuous_dense_vector.hpp:85:\n\nT& glas::continuous_dense_vector<T>::operator()(ptrdiff_t)\
  \ [with T = int]:\n\nAssertion `i<size_' failed.\n\nAborted\n```\n\n程序失败的原因是我们无法访问\
  \ `x(2)`，因为索引超出范围。以下是运行同一程序的 `gdb` 会话打印：\n\n```\n(gdb) r\n\nStarting program: hello\n\
  \n1\n\n2\n\nhello: glas/type/continuous_dense_vector.hpp:85:\n\nT& glas::continuous_dense_vector<T>::operator()(ptrdiff_t)\
  \ [with T = int]:\n\nAssertion `i<size_' failed.\n\nProgram received signal SIGABRT,\
  \ Aborted.\n\n0xb7ce283b in raise () from /lib/tls/libc.so.6\n\n(gdb) backtrace\n\
  \n#0  0xb7ce283b in raise () from /lib/tls/libc.so.6\n#1  0xb7ce3fa2 in abort ()\
  \ from /lib/tls/libc.so.6\n#2  0xb7cdc2df in __assert_fail () from /lib/tls/libc.so.6\n\
  #3  0x08048c4e in glas::continuous_dense_vector<int>::operator() (\n    this=0 xbfdafe14,\
  \ i=2) at continuous_dense_vector.hpp:85\n#4  0x08048a82 in main () at hello.cpp:10\n\
  \n(gdb) break 7\n\nBreakpoint 1 at 0x8048a67: file hello.cpp, line 7.\n\n(gdb) rerun\n\
  \nThe program being debugged has been started already.\n\nStart it from the beginning?\
  \ (y or n) y\n\nStarting program: hello\n\nBreakpoint 1, main () at hello.cpp:7\n\
  \n7         for (int i=0; i<3; ++i) {\n\n(gdb) step\n\n8           std:: cout ≪\
  \ x(i) ≪ std:: endl ;\n\n(gdb) next\n\n1\n\n7         for (int i=0; i<3; ++i) {\n\
  \n(gdb) next\n\n2\n\n7         for (int i=0; i<3; ++i) {\n\n(gdb) next\n\n8    \
  \       std:: cout ≪ x(i) ≪ std::endl ;\n\n(gdb) print i\n\n$2 = 2\n\n(gdb) next\n\
  \nhello: glas/type/continuous_dense_vector.hpp:85:\n\nT& glas::continuous_dense_vector<T>::operator()(\
  \ ptrdiff_t) [with T = int]:\n\nAssertion `i<size_' failed.\n\nProgram received\
  \ signal SIGABRT , Aborted.\n\n0xb7cc483b in raise () from /lib/tls/libc.so.6\n\n\
  (gdb) quit\n\nThe program is running.  Exit anyway? (y or n) y\n```\n\n`backtrace`\
  \ 命令告诉我们程序程序中的位置。通过这个回溯，我们可以看到程序崩溃在 `main` 函数的第 10 行，因为当 `i` 为 2 时，在 `glas::continuous_dense_vector<int>::operator()`\
  \ 中触发了 `assert`。\n\n### B.2.2 使用图形界面调试：`DDD`\n\n相比文本，使用像 `DDD` 这样的图形界面更方便。它具有与 `gdb`\
  \ 若干相同的功能，并允许我们查看图 1 中的源码。然而，我们可以在图 2 中查看变量。我们有以下命令：\n\n- `Run`: 启动或重启程序。\n- `Interrupt`:\
  \ 暂停程序。\n- `Step`: 向进一步。\n- `Next`: 到下一行。\n- `Stepi` 和 `Nexti`: 这些是指令层面的等价操作。仅在调试汇编代码时需要。\n\
  - `Until`: 当我们将光标定位时，程序运行到到达这一行。如果我们的程序没有通过该行，它可能会无限运行。\n- `Finish`: 执行当前函数的剩余部分，并在函数外的第一行停止。\n\
  - `Cont`: 继续执行，直到遇到下一个事件（断点、错误）。\n- `Kill`: 杀死程序。\n- `Up`: 显示当前函数的调用行；即，在调用栈中向上移动一级（如果支持）。\n\
  - `Down`: 回到被调用函数；即，在调用栈中向下移动一级（如果支持）。\n- `Undo`: 撤销上一步操作（很少使用或无效）。\n- `Redo`: 重复上一个命令（更有效）。\n\
  - `Edit`: 调用编辑器打开文件。\n- `Make`: 调用 `make` 重新构建可执行文件。\n\n`gdb` 自 7 版本的一个重要新功能是可以使用\
  \ Python 实现漂亮打印器（pretty printers）。这允许我们在图形调试器中简洁地表示我们的类型；例如，矩阵可以以二维数组的形式可视化，而不是指向第一个元素的指针或模糊的内部表示。IDE\
  \ 也提供了调试功能，某些（如 Visual Studio）允许定义漂亮打印器。\n\n对于较大的特别是并行软件，考虑 `DDT` 或 `Totalview`\
  \ 等专业调试器是值得的。它们允许我们控制单个、部分所有进程、线程或 GPU 线程。\n\n## B.3 内存分析\n\n⇒ `c++03/vector_test.cpp`\n\
  \n根据经验，处理内存问题最常用的工具集是 `valgrind` 分发（它不仅限于内存问题）。在这里我们关注 `memcheck`。`memcheck` 可以检测内存管理问题，如泄漏。它还会报告对未初始化内存的读取以及部分越界访问。\n\
  \n\n\n\n\n```\n==17306== Memcheck, 内存错误检测器\n\n==17306== Copyright (C) 2002-2013,\
  \ and GNU GPL'd, by Julian Seward et al.\n\n==17306== Using Valgrind-3.10.0\\. SVN\
  \ and LibVEX; rerun with -h for copyright info\n\n==17306== Command: vector_test\n\
  \n==17306==\n\n[1,1,2,-3,]\n\nz[3] is -3\n\nw is [1,1,2,-3,]\n\nw is [1,1,2,-3,]\n\
  \n==17306==\n\n==17306== HEAP SUMMARY:\n\n==17306==     in use at exit: 72 ,832\
  \ bytes in 5 blocks\n==17306==   total heap usage: 5 allocs, 0 frees, 72,832 bytes\
  \ allocated\n\n==17306==\n\n==17306== LEAK SUMMARY:\n\n==17306==    definitely lost:\
  \ 128 bytes in 4 blocks\n==17306==    indirectly lost: 0 bytes in 0 blocks\n==17306==\
  \      possibly lost: 0 bytes in 0 blocks\n==17306==    still reachable: 72 ,704\
  \ bytes in 1 blocks\n==17306==         suppressed: 0 bytes in 0 blocks\n==17306==\
  \ Rerun with --leak-check=full to see details of leaked memory\n\n==17306== For\
  \ counts of detected and suppressed errors, rerun with: -v\n==17306== ERROR SUMMARY:\
  \ 0 errors from 0 contexts (suppressed: 0 from 0)\n```\n\n我们可以看到分配了五个内存块，但没有一个被释放。因此，工具告诉我们存在内存泄漏，这也显示为“definitely\
  \ lost: 128 bytes in 4 blocks”。第五个未释放的块来自运行时库——也显示为“still reachable: 72,704 bytes\
  \ in 1 blocks”——幸运的是，这不是我们的错。工具还报告了不匹配的释放，例如在内存未以数组形式分配的情况下使用了 `delete[]`。\n\n所有这些错误都可以在详细模式下报告，并带有相应的源行和函数调用栈：\n\
  \n```\nvalgrind --tool=memcheck -v --leak-check=full \\\n         --show-leak-kinds=all\
  \ vector_test\n```\n\n现在我们看到了多得多的细节，由于长度原因，我们在此不再打印。请自行尝试。\n\n使用 `memcheck` 运行的程序速度较慢，在极端情况下慢可达\
  \ 10 或 30 倍。特别是使用原始指针的软件（希望这未来成为例外），应该定期使用 `valgrind` 进行检查。更多信息请参阅 `http://valgrind.org`。\n\
  \n一些商业调试器（如 `DDT`）已经包含了内存分析功能。Visual Studio 提供了 CRT 库来查找内存泄漏 [47]。\n\n## B.4 gnuplot\n\
  \n`gnuplot` 是一个用于可视化输出的公共领域程序。假设我们有一个名为 `results.dat` 的文件，内容如下：\n\n```\n0 1\n0.25\
  \ 0.968713\n0.75 0.740851\n1.25 0.401059\n1.75 0.0953422\n2.25 -0.110732\n2.75 -0.215106\n\
  3.25 -0.237847\n3.75 -0.205626\n4.25 -0.145718\n4.75 -0.0807886\n5.25 -0.0256738\n\
  5.75 0.0127226\n6.25 0.0335624\n6.75 0.0397399\n7.25 0.0358296\n7.75 0.0265507\n\
  8.25 0.0158041\n8.75 0.00623965\n9.25 -0.000763948\n9.75 -0.00486465\n```\n\n第一列代表\
  \ `x` 坐标，第二列包含 `u` 的对应值。我们可以在 `gnuplot` 中通过以下命令绘制这些值：\n\n```\nplot \"results.dat\"\
  \ with lines\n```\n\n命令：\n\n```\nplot \"results.dat\"\n```\n\n仅会绘制星号，如 图 B–3 所示。3D\
  \ 图形可以通过命令 `splot` 实现。对于更复杂的视化处理，我们可以使用同样免费获取的 `Paraview`。\n\n## B.5 Unix, Linux\
  \ 和 Mac OS\n\n像 Linux 和 Mac OS 这样的 Unix 系统提供了丰富的命令集，允许我们用极少或不通过编程完成许多任务。其中最重要的命令包括：\n\
  \n- `ps`: 列出运行中的进程。\n- `kill`: 杀死进程。\n- `mkdir`: 创建新目录。\n- `pwd`: 打印当前工作目录。\n- `ls`:\
  \ 列出目录下的文件。\n- `cp`: 复制文件。\n- `mv`: 移动或重命名文件。\n- `chmod`: 修改访问权限。\n- `grep`: 搜索表达式。\n\
  - `sort`: 排序输入。\n- `uniq`: 过滤重复行。\n\n---\n\n# 附录 C 语言定义\n\n*“语言是一种能够为特定情况提供任何精度的工具。”*\n\
  ——Kenneth L. Pike\n\n本附录旨在为相关定义提供参考。\n\n### C.1 值类别\n\nC++ 区分了不同的值类别。我们在这里关注左值和右值，并相应对\
  \ ISO 标准 [38] 进行了调整。\n\n**定义 C–1. 左值 (lvalue)。** 左值是一个对象、位域、函数。\n\n更实用地说，左值是指或引用具有名称的实体，允许我们通过地址运算符\
  \ `&` 确定其地址。这个规则的适用范围比我们想象的要广。即使是代码在每次调用时都会被替换且符号可能不会出现在可执行文件函数^(1)，也有地址。我们可以通过获取其地址将其作为参数传递给另一个函数，或者依赖函数向指向自身指针的隐式转换。\n\
  \n**定义 C–2. 右值 (rvalue)。** 右值是一个即将过期的值（例如转换为右值的对象）、一个临时对象或其子对象，或者是不与对象关联的值。\n\n\n\
  \n\n\n这些名称的历史动机是只有 `lvalues`（左值）可以出现在赋值的左侧，而 `rvalues`（右值）只能出现在右侧。遗憾的是，这一标准并不真正有用，因为\
  \ `lvalues` 可以是常量，这导致它们不能出现在赋值的左侧。当赋值运算符没有带有 `&` 限定符时，我们也可以为用户类型的 `rvalue` 对象赋值；请参见第\
  \ 2.6.4 节。而且 `lvalues` 显然也允许出现在赋值的右侧。\n\n**定义 C–3. (xvalue)。** `xvalue` 是一个被强制类型转换为\
  \ `rvalue` 的 `lvalue`。\n\n在作为 `rvalue` 期间，对象的内容可能会被破坏，导致其被视为失效。正如我们在第 2.3.5.4 节\
  \ 中讨论过的，正确清空的 `rvalue` 对象不会引起这个问题——即使以后作为 `lvalues` 也是如此——我们希望在未来的某个时刻，`xvalue`\
  \ 将不再是一个需要考虑的术语。对于你自己的项目，你应该使用书中的技术，即使在存在 `std::move` 和 `std::forward` 的情况下也要避免数据损坏。\n\
  \n## C.2 运算符概述\n\n**表 C–1: 运算符摘要**\n\n![Images](img/btab01.jpg)![Images](img/btab01a.jpg)\n\
  \n该表是 [62, §10.3] 的更新版本；^(2) 我们提供了二元运算符和三元运算符的结合性。相同优先级的一元运算符从内向外求值。在具有左结合性运算符（用\
  \ `⇒` 标记）的表达式中，先求值左子表达式；例如：\n\n```\na + b + c + d + e           // 对应：\n\n((( a\
  \ + b) + c) + d) + e\n```\n\n2。在**[cppreference.com](http://cppreference.com)**\
  \ 上，条件表达式的优先级与后续的赋值组相同（这在实践中显然没有区别）。标准文档本身并没有直接以列表形式提供优先级。\n\n赋值是右结合的（⇐）；即：\n\n\
  ```\na= b= c= d= e               // 对应：\n\na= (b= (c= (d= e)))\n```\n\n一个值得注意的细节是\
  \ `sizeof` 的定义。它可以直接应用于类似对象的表达式，但当应用于类型时需要括号：\n\n```cpp\nint  i;\n\nsizeof i;  \
  \              // 正确：i 是一个表达式\n\nsizeof(i);               // 同样正确：额外的 () 无害\n\n\
  sizeof int;              // 错误：类型需要括号\n\nsizeof(int);             // 正确\n```\n\n\
  如果你不确定是否需要括号，可以始终添加一些额外的括号。\n\n## C.3 转换规则\n\n整数、浮点数和 `bool` 值在 C++ 中可以自由混合，因为这些每种类型都可以转换为任何其他类型。在可能的情况下，值的转换将以确保不丢失任何信息。当转换回原始类型后得到原始值时，该转换是*值保持的*（Value-Preserving）。否则，转换是*收缩的*（Narrowing）。这段文字是\
  \ [62, Intro §10.5] 的简短版本。\n\n### C.3.1 提升\n\n保持值的隐式转换被称为*提升*（Promotion）。较短的整数或浮点值可以精确地转换为更长的整数或浮点类型。在可能的情况下，优先转换为\
  \ `int` 和 `double`（优于更长类型），因为这些类型在算术操作中被认为具有“自然”大小（即受硬件支持得最好）。整数提升的细节如下：\n\n• 如果\
  \ `int` 可以表示所有源类型的值，则 `char`、`signed char`、`unsigned char`、`short int` 或 `unsigned\
  \ short int` 被转换为 `int`；否则，转换为 `unsigned int`。\n\n• `char8_t`、`char16_t`、`char32_t`、`wchar_t`\
  \ 或普通 `enum` 被转换为能够容纳所有源类型值的以下类型中的：`int`、`unsigned int`、`long`、`unsigned long`、`unsigned\
  \ long long`。\n\n• 如果位域可以表示所有值，则转换为 `int`；否则在相同条件下转换为 `unsigned int`。否则，不适用提升。\n\
  \n• `bool` 转换为 `int`：`false` 变为 `0`，`true` 变为 `1`。\n\n提升作为算术转换的一部分（§C.3.3）。来源：[62,\
  \ §10.5.1]。\n\n### C.3.2 其他转换\n\nC++ 隐式地执行以下可能的收缩转换：^(3)\n\n3。现代编译器通常会对此给出警告。\n\n\
  • 整数和普通 `enum` 类型可以转换为任何整数类型。如果目标类型较短，高位会被截断。\n\n• 浮点值可以转换为较短的浮点类型。如果源值位于两个目标值之间，结果为其中之一；否则，行为未定义。\n\
  \n• 指针和引用：任何指向对象的指针可以转换为 `void*`。任何指向对象的指针可以转换为 `void*`。相比之下，指向函数的指针/引用不能转换为 `void*`。派生类的指针/引用可以转换为\
  \ `void*`。`0`（或表达式）可以转换为任何指针类型。`T*` 可以转换为 `T&`。\n\n• `bool`：指针、整数和浮点值可以转换为 `bool`：零变为\
  \ `false`，其他变为 `true`。备注：这些转换有助于理解程序。\n\n• 整数⇔浮点数：当浮点数转换为整数时，小数部分被丢弃（向零取整）。如果值太大无法表示，行为未定义。整数到浮点类型的转换在前可表示时是精确的。否则，取下一个浮点值。\n\
  \n来源：[62, §10.2] 及标准。\n\n### C.3.3 通常算术转换\n\n这些转换在二元运算符的操作数上执行，将其转换为公共类型，然后作为结果：\n\
  \n1. 如果任操作数为 `long double`，另一个转换为 `long double`；\n• 否则，如果任操作数为 `double`，另一个转换为 `double`；\n\
  • 否则，如果任操作数为 `float`，另一个转换为 `float`；\n• 否则，对两个操作数执行第 C.3.1 节整数提升。\n\n2. 否则，如果任操作数为\
  \ `unsigned long long`，另一个转换为 `unsigned long long`；\n• 否则，如果一个操作数为 `long long` 而另一个是\
  \ `unsigned long`，如果后者可以表示前者所有值，则将 `unsigned long` 转换为 `long long`；否则，两者转换为 `unsigned\
  \ long long`。\n• 否则，如果一个操作数为 `long` 而另一个是 `unsigned`，如果后者可以表示前者所有值，则将 `unsigned`\
  \ 转换为 `long`；否则，两者转换为 `unsigned long`。\n• 否则，如果任操作数为 `long`，另一个转换为 `long`；\n• 否则，如果任操作数为\
  \ `unsigned`，另一个转换为 `unsigned`；\n• 否则，两个操作数都转换为 `int`。\n\n由于此结果，混合了 `signed` 和 `unsigned`\
  \ 整数的程序具有取决于平台的行为，因为转换规则取决于整数类型的大小。来源：[62, §10.5.3]。\n\n### C.3.4 收缩\n\n*收缩转换*是一种隐式转换：\n\
  \n• 从浮点类型到整数类型；或\n\n• 从 `long double` 到 `double` 或 `float`，或从 `double` 到 `float`，除非源是常量表达式且转换后的实际值在可表示值的范围内（即使无法精确表示）；或\n\
  \n\n\n\n\n- 从整数类型或无作用枚举类型转换为浮点类型，除非源操作是常量表达式且转换后的实际值能够放入目标类型，并在转换回原始类型时能产生原始值的情况；或\n\
  - 从整数类型或无作用枚举类型转换为无法表示原始类型所有值的整数类型，除非源操作是常量表达式且转换后的实际值能够放入目标类型，并在转换回原始类型时能产生原始值的情况。\n\
