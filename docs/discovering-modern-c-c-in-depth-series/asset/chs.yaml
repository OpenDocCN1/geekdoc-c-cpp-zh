  \n### 4.1.4.2 修改序列操作\n\n`copy`：修改操作必须谨慎使用，因为修改后的序列通常只通过起始迭代器进行参数。因此，作为程序员，我们的责任确保有足够的空间。例如，在\
  \ `copy` 容器之前，我们可以 `resize` 目标到源序列的大小：\n\n```cpp\nvector <int> seq= {3, 4, 7, 9,\
