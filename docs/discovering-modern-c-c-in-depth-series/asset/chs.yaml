  \ 是一个在软件中非常有用的函数：它移除了序列中的重复条目。作为前提条件，序列必须是排序的。然后 `unique` 就可以重新排列条目，使得唯一值位于前端，重复值位于末尾。返回一个指向第一个重复条目的迭代器，并可以用于去重：\n\
  \n```cpp\nstd::vector <int> seq= {3, 4, 7, 9, 2, 5, 7, 8, 3, 4};\n\nsort(begin(seq),\
  \ end(seq));\n\nauto it= unique(begin(seq), end(seq));\n\nresize(distance(seq),\
  \ it));\n```\n\n如果这是一项频繁的任务，可以将前面的操作封装在一个以序列为参数的泛型函数中：\n\n```cpp\ntemplate <typename\
  \ Seq>\nvoid make_unique(Seq& seq)\n\n{\n    using std::begin; using std::end; using\
  \ std::distance;\n    std::sort(begin(seq), end(seq));\n\n    auto it= std::unique(begin(seq),\
  \ end(seq));\n\n    seq.resize(distance(begin(seq), it));\n}\n```\n\n还有许多遵循类似的变异序列操作。\n\
  \n### 4.1.4.3 排序操作\n\n标准库中的排序函数非常强大，几乎可以在所有情况下使用。早期的实现基于快速排序，平均复杂度为 `O(n log n)`，但最坏情况为二次方复杂度。最近的版本使用\
