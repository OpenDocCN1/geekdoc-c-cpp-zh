  \ 范式仅适用于函数本身的模板参数。成员函数无法在类的模板参数上应用 `enable_if`。例如，Listing 5–1 第 9 行中的可变访问运算符无法通过\
  \ `enable_if` 为常量矩阵视图进行隐藏，因为该运算符本身不是模板函数。\n\n在之前的示例中，我们使用 SFINAE 使返回类型失效。或者，我们可以根据条件使函数参数失效。问题在于那些没有参数且具有自定义返回类型的函数（如转换运算符）。有时可以通过匿名类型参数解决这个问题。\n\
  \n我们还可以通过使用不总是有效的类型声明在没有 `enable_if` 的情况下应用 SFINAE。常见的用法是使用 `decltype` 处理可能未定义的表达式。以经常用于遍历容器的自由函数\
  \ `begin` 为例。它为所有提供 `begin` 方法的类型定义。通过 SFINAE 和 `decltype`，我们可以精确地表达这一点：为每个拥有名为\
