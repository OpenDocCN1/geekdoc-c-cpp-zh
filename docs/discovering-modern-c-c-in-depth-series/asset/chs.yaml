  \ -> decltype(x.begin())\n{\n    return x.begin();\n}\n```\n\n在这里，我们定义了一个尾随返回类型作为表达式\
  \ `x.begin()` 的类型。当该表达式未定义时，`decltype` 表达式无效，返回类型也是无效；此时此函数模板将根据 SFINAE 被忽略。这实际上是标准中定义\
  \ `begin` 和 `end` 的方式（带有一些额外的 `constexpr` 和 `noexcept` 细节以及 `const&` 重载）。结果是，我们可以为自己的类型选择将\
  \ `begin` 和 `end` 实现为成员或自由函数。\n\n## C++11 5.2.7 修订后的变长模板\n\n在 Section 3.11 中，我们实现了一个接受任意数量混合类型参数的变长求和。该实现的问题在于，我们不知道合适的返回类型，并使用了第一个参数的返回类型，结果失败得很惨烈。与此同时，我们看到了更多特性，并想重新解决这个问题。我们的第一种方法是使用\
  \ `decltype` 来确定结果类型：\n\n```cpp\ntemplate <typename T>\ninline T sum(T t) { return\
  \ t; }\n\ntemplate <typename T, typename ...P>\nauto sum(T t, P ...p) -> decltype(t\
  \ + sum(p...)) // 错误\n{\n    return t + sum (p ...);\n}\n```\n\n遗憾的是，该实现在参数超过两个时无法编译。要确定\
  \ *n* 个参数的 `return` 类型，需要最后 *n-1* 个参数的 `return` 类型，而这在函数完全定义后才可用，对于尾随 `return` 类型无效。\n\
  \n### C++11 5.2.7.1 变长类模板\n\n因此，我们必须首先确定结果类型。这可以通过变长类型特征（type trait）递归完成：\n\n```cpp\n\
  // 前向声明\ntemplate <typename ...P> struct sum_type;\n\ntemplate <typename T>\nstruct\
  \ sum_type<T>\n{\n    using type= T;\n};\n\ntemplate <typename T, typename ...P>\n\
  struct sum_type<T, P ... >\n{\n    using type= decltype(T() + typename sum_type<P...>::\
  \ type ());\n};\n\ntemplate <typename ...P>\nusing sum_type_t= typename sum_type<P...>::type;\n\
  ```\n\n变长类模板也是递归声明的。为了可见性，在编写定义之前，我们需要一个通用形式作为声明。定义始终包含两个部分：\n\n- 组合部分——如何根据 *n-1*\
  \ 个参数定义具有 *n* 个参数的类；\n- 通常针对零或一个参数的基础情况。\n\n上面的示例使用了一个之前在变长函数模板中出现过的表达式：`P...` 解包了类型包。\n\
  \n请注意递归函数和类的不同编译行为：后者是递归实例化的，而前者不是。这就是为什么我们可以在变长类中递归地使用 `decltype`，但在变长函数中不能。\n\n\
  ### C++11 5.2.7.2 解耦返回类型推导与变长计算\n\n通过之前的类型特征，我们为 `sum` 获取了合适的返回类型：\n\n```cpp\ntemplate\
  \ <typename T>\ninline T sum(T t) { return t; }\n\ntemplate <typename T, typename\
  \ ...P>\nauto sum(T t, P ...p) -> decltype(t + sum(p...)) // 错误\n```\n\n\n\n整数具有结合律（即计算顺序不重要）。浮点数由于舍入误差，则不具有结合律。因此，我们必须注意，使用变长模板导致的求值顺序变化不会引起数值不稳定。\n\
  \n## 5.3 表达式模板\n\n科学软件通常有很高的性能性求——尤其是当涉及 C++ 的时候。许多物理、化学或生物过程的大规模模拟运行需要几周或几个月，如果能至少节省这段漫长执行时间中的某部分，大家都会非常乐意。工程领域也是如此，例如对于大型结构的静态和动态分析。节省执行时间通常是以牺牲程序源代码的可读性和可维护性为代价的。在第\
  \ 5.3.1 节中我们将展示一个运算符的简单实现并讨论为什么这种做法不是高效的；在第 5.3 节的剩余部分，我们将演示如何在不牺牲自然表示法的情况下提高性能。\n\
  \n### 5.3.1 简单运算符的实现\n\n`⇒ c++11/expression_template_example.cpp`\n\n假设我们有一个带有向量加法的应用程序。例如，我们想要写下下面的向量表达式：\n\
  \n```\nw = x + y + z;\n```\n\n假设我们有一个像第 3.3 节中那样的 `vector` 类：\n\n```cpp\ntemplate\
  \ <typename T>\nclass vector\n{\n  public :\n    explicit vector(int size):my_size{size},\
  \ data{new T[size]} {}\n    const T& operator[](int i) const { check_index(i); return\
  \ data [i]; }\n    T& operator[](int i) { check_index(i); return data[i]; }\n  \
  \  // ...\n};\n```\n\n我们当然可以为这种向量的加法提供一个运算符：\n\n**列表 5–4：朴真的加法运算符**\n\n```cpp\n\
  1 template <typename T>\n2 inline vector<T> operator+(const vector<T>& x, const\
  \ vector<T>& y)\n3{\n4     x.check_size(size(y));\n5     vector <T> sum(size(x));\n\
  6     for (int i= 0; i ≪ size(x); ++i)\n7         sum[i] = x[i] + y[i];\n8     return\
  \ sum;\n9 }\n```\n\n一个短的测试程序检查一切是否工作正常：\n\n```cpp\nvector << float> x= {1.0, 1.0,\
  \ 2.0, -3.0},\n               y= {1.7, 1.7, 4.0, -6.0},\n               z= {4.1,\
  \ 4.1, 2.6, 11.0},\n               w(4); \ncout << \"x = \" << x << std::endl;\n\
  cout << \"y = \" << y << std::endl;\ncout << \"z = \" << z << std::endl ;\nw= x\
  \ + y + z;\ncout << \"w= x + y + z = \" << w << endl;\n```\n\n如果这运行符合预期，那么它有什么问题呢？从软件工程的角度来看：没有问题。从性能的角度来看：问题很大。\n\
  \n下面的列表显示了在执行语句时，`operator+` 的每一行执行了什么操作：\n\n1. 为 `x` 和 `y` 的加法创建一个临时变量 `sum`（第\
  \ 5 行）。\n2. 执行循环读取 `x` 和 `y`，逐元素相加，并将结果写入 `sum`（第 6+7 行）。\n3. 在返回语句中将 `sum` 拷贝到临时变量（例如\
  \ `t_xy`）（第 8 行）。\n4. 当 `sum` 离开作用域时通过析构函数删除它（第 9 行）。\n5. 为 `t_xy` 和 `z` 的加法创建一个临时变量\
  \ `sum`（第 5 行）。\n6. 执行循环读取 `t_xy` 和 `z`，逐元素相加，并将结果写入 `sum`（第 6+7 行）。\n7. 在返回语句中将\
  \ `sum` 拷贝到临时变量（例如 `t_xyz`）（第 8 行）。\n8. 删除 `sum`（第 9 行）。\n9. 在第二次加法后删除 `t_xy`。\n\
  10. 执行循环读取 `t_xyz` 并写入 `w`（在赋值中）。\n11. 在赋值后删除 `t_xyz`。\n\n这诚然是最坏的情况；然而，这只发生在非常老老的编译器上。现代编译器通过静态分析执行更多优化并优化返回值（§2.3.5](#ch02.xhtml_sec2_3_5)），从而避免了向\
  \ `t_xy` 和 `t_xyz` 的拷贝。优化后的版本执行：\n\n1. 为 `x` 和 `y` 的加法创建一个临时变量 `sum`（为了区分 `sum_xy`）（第\
  \ 5 行）。\n2. 执行循环读取 `x` 和 `y`，逐元素相加，并将结果写入 `sum`（第 6+7 行）。\n3. 为 `sum_xy` 和 `z` 的加法创建一个临时变量\
  \ `sum`（为了区分 `sum_xyz`）（第 5 行）。\n4. 执行循环读取 `sum_xy` 和 `z`，将其相加，并将结果写入 `sum_xyz`（第\
  \ 6+7 行）。\n5. 在加法后删除 `sum_xy`。\n6. 在赋值后删除 `sum_xyz`。\n\n### 5.3.2 表达式模板类\n\n表达式模板（ET）目的是目的是不引入临时变量开销的情况下保留原始的运算符符号。该技术由\
  \ Todd Veldhuizen 和 Daveed Vandevoorde 独立发现。\n\n为了在优雅性和性能之间做出选择，我们引入了一个表示两个向量之和的新类（这些向量在新类中引用）。加法不再返回向量，而是返回该类的对象：\n\
  \n```cpp\ntemplate <typename T>\nclass vector_sum\n{\n  public :\n    vector_sum(const\
  \ vector<T>& v1, const vector<T>& v2)\n    : v1{v1}, v2{v2} {}\n  private :\n  \
  \  const vector<T> &v1, &v2;\n};\n\ntemplate <typename T>\nvector_sum <T> operator\
  \ + (const vector <T>& x, const vector <T>& y)\n{\n  return {x, y};\n}\n```\n\n\n\
  \n现在我们可以写 `x + y`，但还不能写 `w= x + y`。这不仅是因为赋值操作尚未被定义；我们还没有为 `vector_sum` 提供足够的功能来在赋值中执行有用的操作。因此，我们首先扩展\
  \ `vector_sum`，让它看起来像一个向量本身：\n\n```\ntemplate <typename T>\nclass vector_sum\n{\n\
  \  public :\n    // ...\n    friend int size(const vector_sum& x) { return size(x.v1);\
  \ }\n    T operator[](int i) const { return v1[i] + v2[i]; }\n  private :\n    const\
  \ vector <T> &v1, & v2;\n};\n```\n\n该类中很有意思的是括号运算符：当访问第 `i` 个元素时，我们会即时计算操作数第 `i`\
  \ 个元素之和。\n\n在括号运算符中逐元素计算求和的缺点是，当元素被多次访问时会发生重复计算。例如，这发生在矩阵向量乘法中，如 `A * (x+y)`。因此，对于某些操作，预先计算向量和可能比在访问运算符中逐元素计算更有利。\n\
  \n为了计算 `w=x + y`，我们还需要为 `vector_sum` 定义一个赋值运算符：\n\n```\ntemplate <typename T> class\
  \ vector_sum; // 前向声明\n\ntemplate <typename T>\nclass vector\n{    // ...\n    vector&\
  \ operator=(const vector_sum<T>& that)\n    {\n      check_size(size(that));\n \
  \     for (int i= 0; i ≪ my_size; ++i)\n         data [i]= that [i];\n      return\
  \ *this;\n    }\n};\n```\n\n赋值操作遍历了当前对象的 `data` 以及参数 `that` 的 `data`。由于后者是一个 `vector_sum`，表达式\
  \ `that[i]` 会计算逐元素求和，此处为 `x[i] + y[i]`。因此，与[代码列表 5–4] 中的朴素实现相比，`w= x + y` 的求值现在具有：\n\
  \n* 只有一个循环；\n* 没有临时向量；\n* 没有额外的内存分配和释放；且\n* 没有额外的数据读取和写入。\n\n事实上，在循环中执行的是相同的操作：\n\
  \n```\nfor (int i= 0; i ≪ size (w); ++i)\n    w[i] = x[i] + y[i];\n```\n\n创建一个 `vector_sum`\
  \ 对象的代价是可以忽略不计的。该对象将保留在栈上，不需要内存分配。即使是创建对象的这个微小努力，通常也会被大多数具有静态代码分析能力的编译器所优化掉。\n\n\
  当我们添加三个向量时会发生什么？[代码列表 5–4] 中的朴素实现返回一个向量，这个向量可以与另一个向量相。我们的方法返回一个 `vector_sum`，而我们没有定义\
  \ `vector_sum` 和 `vector` 之间的加法。因此，我们需要另一个表达式模板类以及相应的操作：\n\n```\ntemplate <typename\
  \ T>\nclass vector_sum3\n{\n  public:\n    vector_sum3(const vector<T>& v1, const\
  \ vector<T>&v2,\n                  const vector <T>& v3)\n    : v1{v1}, v2{v2},\
  \ v3{v3}\n    { ... }\n    T operator [] (int i) const { return v1[i] + v2[i] +\
  \ v3[i]; }\n  private :\n    const vector <T> &v1, &v2, &v3;\n};\n\ntemplate <typename\
  \ T>\nvector_sum3<T> inline operator+(const vector_sum<T>& x,\n                \
  \                   const vector <T>& y)\n{\n    return {x.v1, x.v2, y};\n}\n```\n\
  \n此外，`vector_sum` 必须将我们新的加法运算符声明为 `friend` 以访问其私有成员，并且 `vector` 需要对应 `vector_sum3`\
  \ 的赋值操作。这变得越来越烦人。另外，如果我们执行第二次加法：`w=x+(y + z)` 会发生什么？那时我们需要另一个运算符。如果某些向量与标量相乘，如 `w=x\
  \ + dot(x,y) * y + 4 * z`，而这个标量积也是通过 ET 实现的？我们的实现将会遇到组合爆炸，我们需要在下一节中引入一种更灵活的解决方案。\n\
  \n### 5.3.3 通用表达式模板\n\n`c++11/expression_template_example.cpp`\n\n到此为止，我们从一个特定的类（`vector`）开始并将实现通用。尽管这可以帮助我们理解该机制，但我们现在直接进入适用于任意类型及其视图的通用版本：\n\
  \n```\ntemplate <typename V1, typename V2>\ninline vector_sum<V1, V2> operator+(const\
  \ V1& x, const V2& y)\n{\n    return {x, y};\n}\n```\n\n现在我们需要一个带有任意参数的表达式类：\n\n\
  ```\ntemplate <typename V1, typename V2>\nclass vector_sum\n{\n  public:\n    vector_sum(const\
  \ V1& v1, const V2& v2) : v1{v1}, v2{v2} {}\n    operator[](int i) const { return\
  \ v1[i] + v2[i]; }\n  private:\n    const V1& v1;\n    const V2& v2;\n};\n```\n\n\
  这种做法是非常直观的。唯一的问题是 `operator[]` 返回什么类型。为了这一点，我们必须在每个类中定义 `value_type`（外部 trait 会更灵活，但我们希望尽可能简单）。在\
  \ `vector_sum` 中，我们可以从参数获取。只要类型是相同的，这种方案是可以接受的。然而，正如我们在第 11 节看到的，如果不注意混合类型，会得到荒谬的结果。为了准备混合类型，我们取参数的\
  \ `common_type_t`：\n\n```\ntemplate <typename V1, typename V2>\nclass vector_sum\n\
  {\n  // ...\n  using value_type = std::common_type_t<typename V1::value_type, typename\
  \ V2::value_type>;\n  value_type operator[](int i) const { return v1[i] + v2[i];\
  \ }\n};\n```\n\n如果我们的 `vector_sum` 类不需要显式声明 `value_type`，我们可以使用 C++14 的 `decltype(auto)`\
  \ 作为返回类型，并将类型推导完全交给编译器。相反，当模板与 `vector_sum` 本身实例化时，这种类型会产生依赖。为了将不同类型的表达式赋值给向量类，我们应该泛化赋值运算符：\n\
  \n```cpp\ntemplate <typename T>\nclass vector\n{\n  public :\n    template <typename\
  \ Src>\n    vector& operator=(const Src& that)\n    {\n      check_size(size(that));\n\
  \      for (int i= 0; i ≪ my_size; ++i)\n         data [i]= that [i];\n      return\
  \ *this;\n    }\n};\n```\n\n这个赋值运算符接受除了 `vector<T>` 之外的所有类型，后者我们需要专门的拷贝赋值运算符。为了避免代码冗余，我们可以实现一个执行实际拷贝的方法，并在通用和拷贝赋值中调用它。\n\
  \n\n\n\n```\nw= x + y + z + vector {2.0, 8.4, 9.1, 11.1};\n```\n\n这仍然会导致失效引用（stale\
  \ reference）。因此，作为 rvalues 传递的容器也应该被拷贝。我们可以通过拷贝所有的 rvalues 并引用所有的 lvalues 来简化这种方法：\n\
  \n```cpp\ntemplate <typename T>\n\nusing copy_or_cref= conditional_t<is_lvalue_reference_v<T>,\n\
  \n                               remove_reference_t<T> const&,\n\n             \
  \                  remove_reference_t<T> >;\n```\n\n这样做的动机是，像 `vector_sum` 这样的纯表达式对象在常规用法下只以\
  \ rvalues 的形式出现。即使在极少数情况下，有人显式创建了 `vector_sum` 对象并将其传递给表达式，我们也不会遇到失效引用。\n\n现在是棘手的部分。`vector_sum`（以及类似的类）的每个成员变量的类型取决于我们处理的是\
  \ lvalue 还是 rvalue。此外，这些成员数据类型只能取决于类模板参数，因此后者必须反映 lvalue 参数和 rvalue 参数之间的区别。假设类参数已经过适当实例化，我们直接使用这些类型作为我们的成员数据：\n\
  \n```cpp\ntemplate <typename V1, typename V2>\n\nclass vector_sum\n\n{\n\n    V1\
  \ v1;\n\n    V2 v2;\n\n};\n```\n\n剩下的挑战性任务是在哪里确定我们处理的是 lvalue 还是 rvalue 类参数。有两种方案。第一种涉及带有转发引用（forward\
  \ references）的构造函数：\n\n```cpp\ntemplate <typename VV1, typename VV2>\n\nvector_sum(VV1&&\
  \ v1, VV2&& v2);\n```\n\n如果所有引用都正确地转发给它，我们可以知道它是哪种引用类型。然而，构造函数本身不需要这个信息，而是类模板参数需要。为了这种类型的传播，我们引入了推导引导（deduction\
  \ guide）：\n\n```cpp\ntemplate <typename VV1, typename VV2>\n\nvector_sum(VV1&&,\
  \ VV2&&)\n\n  -> vector_sum << copy_or_cref <VV1 >, copy_or_cref <VV2 > >;\n```\n\
  \n为了触发这个引导，我们的运算符必须在不显式模板类型的情况下返回 `vector_sum`：\n\n```cpp\ntemplate <typename V1,\
  \ typename V2 >\n\nauto operator+(V1&& x, V2&& y)\n\n{\n\n    return vector_sum{std::forward\
  \ <V1 >(x), std::forward <V2>(y)};\n\n}\n```\n\n除了结果，我们还检查上一个表达式的类型：\n\n```cpp\n\
  cout << typeid(x + y + z + vector{2.0, 8.4, 9.1, 11.1}).name ();\n```\n\n然后我们将看到所有的加数项都被正确地拷贝或引用了：\n\
  \n```cpp\nvector_sum<vector_sum<vector_sum<vector <float> const&,\n\n          \
  \                     vector <float> const&>,\n\n                              \
  \ vector <float> const&>,\n\n                               vector <double> >\n\
  ```\n\n向量 `x`、`y` 和 `z` 都是通过常量引用的，而最后一个向量被拷贝到表达式模板中。所有的 `vector_sum` 对象都按值存储。\n\n\
  `⇒ c++17/expression_template_nonstale.cpp`\n\n尽管推导引导很酷，但我们也可以在运算符中直接实例化 `vector_sum`：\n\
  \n```cpp\ntemplate <typename V1, typename V2 >\n\noperator+(V1&& x, V2&& y)\n\n\
  \  -> vector_sum<copy_or_cref<V1>, copy_or_cref<V2> >\n\n{  return {x, y};  }\n\
  ```\n\n这种方法简化了如 `vector_sum` 等表达式模板类的实现。除此之外，表达式的类型与之前的技术相同，考虑到运算符签名和引导的相似性，这并不意外。\n\
  \n**表达式模板总结：** 尽管运算符重载使得代码表示更漂亮，但科学界拒绝放弃 Fortran 。\n\n### 5.4 编写自己的优化\n\n引言：本节标记为\
  \ C17。然而，这些技术本身在旧标准中也是可行的。\n\n\n\n\n将简单的循环实现替换为运行速度接近峰值性能的代码，无疑是一项巨大的成就。遗憾的是，这让许多程序员认为大多数计算都可以以类似的方式加速。通常情况下，微小的变化就足以脱离这种模式，且性能表现远不如预期。无论这些模式定义得多么通用，它们的适用性总是有限的。一种算法上的改变（例如，乘以三角矩阵而非矩形矩阵）如果不阻碍块（blocking）和展开（unrolling）优化，可能会超出编译器的特殊情况优化范围。\n\
  \n简而言之：编译器可以做很多事情，但并非无所不能。无论编译器调整了多少种特殊情况，始终存在领域特定优化的需求。除了编译器中的技术，还有诸如 `ROSE` [53]\
  \ 这样的工具，允许你通过对抽象语法树（`AST`，编译器内部的程序表示）对源代码（包括 C++）进行用户定义的转换。\n\n编译器优化的一个主要障碍是某些变换需要语义知识。而这些知识对于编译器实现者已知的类型和操作可用。感兴趣的读者也可以在\
  \ [22] 中查看对该主题更深入的讨论。目前正在进行提供基于概念优化的用户定义转换的研究 [67]。遗憾的是，这成为主流还需要时间；即使是 C++20 中引入的新\
  \ `Concept` 扩展，也只是向用户语义驱动优化的一步，因为它最初只处理语法，而语义概念只能被模拟（见 §5.5）。\n\n在接两个章节中，我们将展示在线代数领域中使用元编程进行用户定义的代码转换。目标是让用户尽可能清晰地编写操作，让\
  \ `function` 和 `class` 模板达到可实现的最高性能。考虑到模板系统的图完备性，我们可以提供任何理想的用户界面，同时实现一个与最高效代码行为等效底层实现，正如我们将在本节中演示的那样。编写调良好的模板是一项意义巨大的编程、测试和基准测试工作。为了获得回报，这些模板应该包含在维护良好的库中，并供广泛的用户社区使用（至少在研究团队或公司内部）。\n\
  \n### 5.4.1 经典固定尺寸展开\n\n`⇒ c++17/fsize_unroll_test.cpp`\n\n最形式的编译优化可以针对固定尺寸的数据类型实现，特别是对于数学向量，如第\
  \ 3.6 节\n    {\n        for (int i= 0; i < my_size ; ++ i)\n            data [i]=\
  \ that [i];\n    }\n};\n```\n\n先进的编译器会识别出所有迭代都是相互独立的；例如，`data[2]= that[2];` 与 `data[1]=\
  \ that[1];` 是独立的。编译器会在编译期间确定循环的大小。因此，为大小为 3 的 `fsize_vector` 生成的二进制文件等同于：\n\n```\n\
  template <typename T, int Size>\n\nclass fsize_vector\n{\n    template <typename\
  \ Vector >\n    self& operator=(const Vector& that)\n    {\n        data[0]= that[0];\n\
  \        data[1]= that[1];\n        data[2]= that[2];\n    }\n};\n```\n\n右侧向量 `that`\
  \ 可能是一个表达式模板（§5.3），例如 `alpha * x + y`，其求值也可以内联：\n\n```\ntemplate <typename T, int\
  \ Size >\n\nclass fsize_vector\n{\n    template <typename Vector >\n    self& operator=(const\
  \ Vector& that)\n    {\n        data[0]= alpha * x[0] + y[0];\n        data[1]=\
  \ alpha * x[1] + y[1];\n        data[2]= alpha * x[2] + y[2];\n    }\n};\n```\n\n\
  为了让展开变得显式化并为了逐步引入元调优步骤，我们开发了一个执行赋值的（静态）函数对象：\n\n```cpp\ntemplate <typename Target,\
  \ typename Source, int N>\nstruct fsize_assign\n{\n    static void eval(Target&\
  \ tar, const Source& src)\n    {\n        if constexpr (N > 0)\n            fsize_assign<Target,\
  \ Source, N-1>::eval(tar, src);\n        tar[N]= src[N];\n    }\n};\n```\n\n\n\n\
  \n\n根据我们的经验，大多数编译器都会展开非嵌套循环。即使是能够处理某些嵌套循环的优秀编译器，也无法优化每一个程序内核，特别是那些包含许多使用用户定义类型实例化的模板参数的内核。在这里，我们将演示如何以矩阵向量乘法为例，在编译时展开嵌套循环。为此，我们引入了一个简单的固定大小矩阵类型：\n\
  \n```cpp\ntemplate <typename T, int Rows, int Cols>\n\nclass fsize_matrix\n{\n \
  \   static_assert(Rows > 0, \"Rows must be larger than 0.\");\n    static_assert(Cols\
  \ > 0, \"Cols must be larger than 0.\");\n    using self= fsize_matrix;\n\n  public:\n\
  \    using value_type= T;\n    constexpr static int my_rows= Rows, my_cols= Cols;\n\
  \    fsize_matrix(const self& that) { ... } \n    // 在这里无法检查列索引！\n    const T* operator[](int\
  \ r) const { return data[r]; }\n    T* operator[](int r) { return data [r]; }\n\
  \    mat_vec_et << self, fsize_vector <T, Cols > >\n    operator*(const fsize_vector<T,\
  \ Cols>& v) const\n    {\n        return {* this, v };\n    }\n  private:\n    T\
  \ data [ Rows ][ Cols ];\n};\n```\n\n为了简单起见，下标运算符返回指针，而良好的实现应该返回一个允许检查列索引的代理对象（参见\
  \ §A.4.3.3）。与向量的乘法通过返回表达式模板 `mat_vec_et` 来避免拷贝结果向量。然后，为我们的表达式模板类型重载了向量赋值操作：\n\n\
  ```cpp\ntemplate <typename T, int Size>\n\nclass fsize_vector\n{\n    template <typename\
  \ Matrix, typename Vector >\n    self& operator=(const mat_vec_et<Matrix, Vector>&\
  \ that)\n    {\n        using et= mat_vec_et<Matrix, Vector>;\n        fsize_mat_vec_mult\
  \ < et::my_rows -1, et::my_cols-1 >:: eval (\n            that.A, that.v, *this);\n\
  \        return *this;\n    }\n};\n```\n\n`static` 结构体 `fsize_mat_vec_mult` 计算矩阵向量乘积并将结果存储在输出向量中：\n\
  \n```cpp\ntemplate <int Row, int Col>\n\nstruct fsize_mat_vec_mult\n{\n    template\
  \ <int R, int C> using mvm= fsize_mat_vec_mult<R, C>; \n    template <typename Matrix,\
  \ typename VecIn, typename VecOut>\n    static void eval(const Matrix& A, const\
  \ VecIn& v_in, VecOut& v_out)\n    {\n        if constexpr (Col == 0) {\n      \
  \      if constexpr (Row > 0)\n                mvm<Row-1, Matrix::my_cols-1>::eval(A,\
  \ v_in, v_out);\n            v_out[Row]= A[Row][Col] * v_in[Col];\n        } else\
  \ {\n            mvm<Row, Col-1>::eval(A, v_in, v_out);\n            v_out[Row]+=\
  \ A[Row][Col]*v_in[Col];\n        }\n    }\n};\n```\n\n通用情况（在 `else` 分支中）在调用前一列的操作后，通过\
  \ `A[Row][Col]` 和 `v_in[Col]` 的标量积来增加 `v_out` 的条目。在列 `0` 中，我们将增量替换为普通的赋值以初始化结果，并切换到另一行——行\
  \ `0` 除外，递归在该处结束。在 C++17 之前，需要一个主模板和两个特化。通过内联，我们的程序对大小为 4 的向量执行操作 `w= A * v` 时，就像我们计算了：\n\
  \n```\nw[0]= A[0][0] * v[0];\nw[0]+= A[0][1] * v[1];\nw[0]+= A[0][2] * v[2];\nw[0]+=\
  \ A[0][3] * v[3];\nw[1]= A[1][0] * v[0];\nw[1]+= A[1][1] * v[1];\n```\n\n我们的测试表明，这种实现实际上比编译器的优化循环要快。\n\
  \n##### 5.4.2.1 增加并发性\n\n上述实现的一个缺点是，目标向量条目的所有操作都在一次扫描中完成。因此，第二次操作必须等待第一次操作，第三次操作等待第二次，以此类推。第五次操作可以与第四次并行进行，第九次可以与第八次并行，等等。然而，这种并发性是非常有限的。我们喜欢程序中拥有并行性，以便启用超标量处理器中的并行流水线或\
  \ `SSE`（流式 SIMD 扩展）以及 `AVX`（高级向量扩展）。再次，我们可以祈祷编译器会将语句重排为我们喜欢的顺序，或者亲自动为之。当我们在“内部”循环中遍历结果向量和矩阵行时，可以提供更多的并发性：\n\
  \n```\nw[0]= A[0][0] * v[0];\nw[1]= A[1][0] * v[0];\nw[2]= A[2][0] * v[0];\nw[3]=\
  \ A[3][0] * v[0];\nw[0]+= A[0][1] * v[1];\nw[1]+= A[1][1] * v[1];\n```\n\n我们只需要重构我们的\
  \ `static` 结构体：\n\n```cpp\ntemplate <int Row, int Col>\n\nstruct fsize_mat_vec_mult\n\
  {\n    template <int R, int C> using mvm= fsize_mat_vec_mult_cm<R, C>; \n    template\
  \ <typename Matrix, typename VecIn, typename VecOut>\n    static void eval(const\
  \ Matrix& A, const VecIn& v, VecOut& w)\n    {\n        if constexpr (Col == 0)\
  \ {\n            if constexpr (Row > 0)\n                mvm<Row-1, 0>:: eval (A,\
  \ v, w);\n            w[Row]= A[Row][0] * v[0];\n        } else {\n            if\
  \ constexpr (Row > 0)\n                mvm< Row-1, Col>::eval (A, v, w);\n     \
  \       else\n                mvm <Matrix::my_rows -1, Col -1>::eval (A, v, w);\n\
  \            w[Row]+= A[Row][Col] * v[Col];\n        }\n    }\n};\n```\n\n在通用情况下，我们在递归调用中减少行（而不是列），行\
  \ `0` 除外切换列。再次，我们必须初始化列 `0` 中对应的结果条目并结束递归。作为对比，传统的实现（C++17 之前）需要一个主模板和特化。\n\n#####\
  \ 5.4.2.2 使用寄存器\n\n我们需要记住的现代处理器另一个特性是缓存一致性。处理器的设计旨在共享内存的同时保持缓存的一致性。因此，当我们将像 `w`\
  \ 这样的数据结构写入主内存时，会向其他核心发送缓存失效信号。遗憾的是，这会明显地减慢计算速度。幸运的是，在许多情况下，通过在类型允许的情况下引入位于寄存器中的临时变量，可以避免缓存失效瓶颈。\n\
  \n\n\n\n\n```cpp\ntemplate <int Row, int Col>\n\nstruct fsize_mat_vec_mult_reg\n\
  {\n    template <typename Matrix, typename VecIn, typename VecOut>\n    static void\
  \ eval (const Matrix& A, const VecIn& v, VecOut& w)\n    {\n        if constexpr\
  \ (Row > 0)\n            fsize_mat_vec_mult_reg <Row-1, Col>::eval (A, v, w);\n\n\
  \        typename VecOut::value_type tmp;\n        fsize_mat_vec_mult_aux <Row,\
  \ Col >::eval(A, v, tmp);\n        w[ Row ]= tmp;\n    }\n};\n```\n\n我们假设 `fsize_mat_vec_mult_aux`\
  \ 在此类之前已经定义或声明。第 8 行的第一条语句调用了除第 `0` 行之外之前行的计算。在第 10 行中，我们定义了一个临时变量，它将被编译器放置在寄存器中。然后我们开始对该矩阵行进行计算。该临时变量作为引用传递给一个\
  \ `inline` 函数，以便在寄存器中计算求和。在第 12 行中，我们将结果写回 `w`。这仍然会导致总线上的失效信号，但每个条目仅触发一次。\n\n在每一行内部，我们初始化列\
  \ `0` 中的临时变量，然后遍历其他列并在增加临时变量的同时进行累加：\n\n```cpp\ntemplate <int Row, int Col>\nstruct\
  \ fsize_mat_vec_mult_aux\n{\n    template <typename Matrix, typename VecIn, typename\
  \ Tmp>\n    static void eval (const Matrix& A, const VecIn& v, Tmp& w)\n    {\n\
  \        if constexpr (Col == 0) {\n            w= A[Row][0] * v [0];\n        }\
  \ else {\n            fsize_mat_vec_mult_aux <Row, Col-1>::eval(A, v, w);\n    \
  \        w += A[Row][Col] * v[Col];\n        }\n    }\n};\n```\n\n在这一节中，我们展示了优化固定大小二维维循环的各种方法。显然还有更多可能性：例如，我们可以尝试一种同时具有良好并发性和寄存器使用率的实现。另一种优化是进行写回操作合并，以进一步减少缓存失效信号。\n\
  \n### 5.4.3 动态展开：热身\n\n`⇒ c++17/vector_unroll_example.cpp`\n\n固定大小优化虽然很重要，但对动态大小容器的加速更为需要。我们这里从一个简单的示例和一些观察结果开始。我们将复用来自\
  \ Listing 3–1 的 vector 类。为了更清晰地展示实现，我们编写了没有运算符和表达式模板的代码。我们的测试用例将为三个大小为 1000 的短向量计算\
  \ `u = 3*v + w`。将使用 `<chrono>` 测量墙钟时间。向量 `v` 和 `w` 将初始化，为了绝对确保数据在缓存中，我们将在计时之前运行一些额外的操作。我们将直观的循环与每次迭代执行四次操作的循环进行比较：\n\
  \n```cpp\nfor (unsigned i= 0; i < s; i+= 4) {\n    u[i]=    3.0f * v[i]    + w[i];\n\
  \    u[i+1]= 3.0f * v[i+1] + w[i+1];\n    u[i+2]= 3.0f * v[i+2] + w[i+2];\n    u[i+3]=\
  \ 3.0f * v[i+3] + w[i+3];\n}\n```\n\n这段代码显然只有在向量大小能被 4 整除时才有效。为了避免错误，我们可以对向量大小添加断言，但这并不十分理想。相反，我们将此实现推广到任意向量大小：\n\
  \n**Listing 5–5: u = 3 * v + w 的展开计算**\n\n```cpp\nunsigned sb= s / 4 * 4;\nfor (unsigned\
  \ i= 0; i < sb; i+= 4) {\n    u[i]=    3.0f * v[i]    + w[i];\n    u[i+1]= 3.0f\
  \ * v[i+1] + w[i+1];\n    u[i+2]= 3.0f * v[i+2] + w[i+2];\n    u[i+3]= 3.0f * v[i+3]\
  \ + w[i+3];\n}\nfor (unsigned i= sb; i < s; ++i)\n    u[i]= 3.0f * v[i] + w[i];\n\
  ```\n\n遗憾的是，我们在最旧的编译器上看到了最大的收益。使用 `g++` 4.4 配合 `-O3 -ffast-math -DDEBUG` 标志（以及 C++11\
  \ 代码）在 i7-3820 3.6 GHz 上运行，结果如下：\n\n```\nCompute time native loop is 0.801699 μs.\n\
  Compute time unrolled loop is 0.600912 μs.\n```\n\n本章中测得的时间是运行时间超过 10 秒的执行平均值，因此该时钟提供了足够的分辨率。或者，在我们手动编写的展开之外，我们还可以使用编译器标志\
  \ `funroll-loops`。这在测试机器上产生了以下执行时间：\n\n```\nCompute time native loop is 0.610174\
  \ μs.\nCompute time unrolled loop is 0.586364 μs.\n```\n\n因此，编译器标志可以进行展开，这为我们提供了足够的支持。当块大小已知时，手动的展开提供了类似的性能：\n\
  \n```\nCompute time native loop is 0.47425 μs.\nCompute time unrolled loop is 0.47148\
  \ μs.\n```\n\n在 `g++` 4.8 上，我们观察到 0.42 μs，而在 `clang++` 上为 0.16 μs。这揭示了数据从内存移动到寄存器的差异。尽管如此，现代编译器对一维循环的优化非常好。在为多维情况准备之前，我们将在一维上展示这种展开技术。假设展开对于给定的计算是有益的，我们下一个问题是：“最佳的块大小是多少？”\n\
  \n* 它取决于表达式吗？\n* 它取决于类型吗？\n* 它取决于体系架构吗？\n\n答案是肯定的，取决于所有这些。原因是不同的处理器具有不同的寄存器数量。在接下来的节中，我们将解决这两个问题：如何封装转换以便无需重写循环。\n\
  \n### 5.4.4 展开向量表达式\n\n为了便于理解，我们将逐步讨论抽象化。我们从之前的循环示例 `3v + w` 开始，并将其实现为可调函数。该函数名为\
  \ `my_axpy`，它有一个用于块大小的模板参数，因此我们可以写：\n\n```cpp\nmy_axpy <2 >(u, v, w);\n```\n\n该函数包含一个带有自定义大小的主循环和一个结尾的清理循环：\n\
  \n```cpp\ntemplate <unsigned BSize, typename U, typename V, typename W>\nvoid my_axpy(U&\
  \ u, const V& v, const W& w)\n{\n    assert(u.size() == v.size() && v.size() ==\
  \ w.size());\n    unsigned s= u.size(), sb= s / BSize * BSize; \n    for (unsigned\
  \ i= 0; i < sb; i+= BSize)\n        my_axpy_ftor <0, BSize>::eval (u, v, w, i);\
  \ \n    for (unsigned i= sb; i < s; ++i)\n        u[i]= 3.0f * v[i] + w[i];\n}\n\
  ```\n\n如前所述，推导模板类型（在我们案例中为向量类型）必须定义在参数列表的末尾，而显式参数（在我们案例中为块大小）必须传递给第一个模板参数。第一个循环中块语句的实现可以类似于\
  \ 5.4.1 节中的静态算子。我们与这种实现略有不同，使用了两个模板参数，并将第一个参数增加到与第二个相等。我们观察到这种方法在 `g++` 上生成了更快的二进制文件。\n\
  \n\n\n\n```cpp\ntemplate <unsigned Offset, unsigned Max>\n\nstruct my_axpy_ftor\n\
  \n{\n    template <typename U, typename V, typename W>\n    static const eval (U&\
  \ u, const V& v, const W& w, unsigned i)\n    {\n        if constexpr (Offset <\
  \ Max) {\n            u[i+ Offset]= 3.0 f * v[i+ Offset] + w[i+ Offset];\n     \
  \       my_axpy_ftor << Offset +1, Max >::eval (u, v, w, i);\n        }\n    }\n\
  };\n```\n\n与固定尺寸展开的唯一区别是索引是相对于索引 `i` 的。`eval()` 首先在 `Offset` 等于 0 时调用，然后是 1、2 等，依此类推。由于每次调用都是内联的，因此该（静态）仿函数的调用行为表现就像一个单一的整体操作块，没有循环控制和函数调用。因此，`my_axpy_ftor<0,\
  \ 4>::eval(u, v, w, i)` 执行的操作与代码列表 5–5 中第一个循环的迭代操作相同。使用不同的展开参数执行考虑的向量操作结果如下：\n\n\
  ```\nCompute time unrolled <2> loop is 0.667546 μs.\nCompute time unrolled <4> loop\
  \ is 0.601179 μs.\nCompute time unrolled <6> loop is 0.565536 μs.\nCompute time\
  \ unrolled <8> loop is 0.570061 μs.\n```\n\n现在我们可以为任何需要的块大小调用此操作。另一方面，为每个向量表达式都手动提供这样的仿函数是一项不可接受的编程工作。因此，我们现在将这种技术与表达式模板结合。\n\
  \n### 5.4.5 调整表达式模板\n\n`⇒ c++17/vector_unroll_example2.cpp`\n\n在第 5.3.3 节中，我们为向量和实现了表达式模板（不带展开）。以同样的方式，我们可以实现标量-向量积，但我们将其留给有感兴趣的读者作为练习\
  \ 5.7.5，并考虑仅包含加法的表达式，例如：\n\n`u` = `v` + `v` + `w`\n\n我们的基准性能为：\n\n```\nCompute time\
  \ is 1.72 μs.\n```\n\n为了将元调优引入表达式模板，我们只需要修改实际赋值，因为这是所有基于循环的向量操作执行执行的地方。其他操作（加法、减法、缩放……）仅返回包含引用的小型对象。我们可以像以前一样，将\
  \ `operator=` 中的循环拆分为开始的展开部分和结尾的完成部分：\n\n```cpp\ntemplate <typename T>\n\nclass\
  \ vector\n{\n    template <typename Src>\n    vector & operator=(const Src& that)\n\
  \    {\n        check_size (size (that));\n        unsigned s= my_size, sb = s /\
  \ 4 * 4; \n        for (unsigned i= 0; i ≪ sb; i+= 4)\n            assign <0, 4\
  \ >::eval (* this, that, i); \n        for (unsigned i= sb; i ≪ s; ++i)\n      \
  \      data [i]= that [i];\n        return *this;\n    }\n};\n```\n\n`assign` 仿函数的实现方式与\
  \ `my_axpy_ftor` 类似：\n\n```cpp\ntemplate <unsigned Offset, unsigned Max>\n\nstruct\
  \ assign\n{\n    template <typename U, typename V>\n    static void eval (U& u,\
  \ const V& v, unsigned i)\n    {\n        if constexpr (Offset < Max) {\n      \
  \      u[i+Offset]= v[i+Offset];\n            assign <Offset+1, Max>::eval(u, v,\
  \ i);\n        }\n    }\n};\n```\n\n计算上述表达式：\n\n```\nCompute time is 1.37 μs.\n\
  ```\n\n通过这种简单的修改，我们现在加速了所有的向量模板。然而，与之前的实现相比，我们失去了了自定义循环展开的灵活性。仿函数 `assign` 有两个参数，因此允许自定义。问题在于赋值运算符。从原则上说，我们可以在这里定义一个显式模板：\n\
  \n```cpp\ntemplate <unsigned BSize, typename Src>\nvector& operator =(const Src&\
  \ that)\n{\n    check_size(size (that));\n    unsigned s= my_size, sb = s / BSize\
  \ * BSize ; \n    for (unsigned i= 0; i < sb; i+= BSize)\n        assign<0, BSize>::eval(*this,\
  \ that, i); \n    for (unsigned i= sb; i < s; ++i)\n        data[i]= that[i];\n\
  \    return *this;\n}\n```\n\n但这种方法的缺点是我们不能再将 `=` 作为自然的中缀运算符使用了。相反，我们必须写成：\n\n```cpp\n\
  u.operator=<4>(v + w);\n```\n\n这确实有一种极客魅力，而且人们也可以认为，人们为了性能做过且正在做许多更痛苦的事情。尽管如此，它并不符合我们对直观性和可读性的理想。替代表示法是：\n\
  \n```cpp\nunroll <4>(u = v + w);\n```\n\n以及：\n\n```cpp\nunroll <4>(u) = v + w;\n\
  ```\n\n这两个版本都可以实现。前者更好地表达了我们正在做的，后者更易于实现，且更具可读性。`unroll` 函数是简单的：它只需要 `unroll_vector`\
  \ 的类型信息：\n\n```cpp\ntemplate <unsigned BSize, typename Vector>\nauto unroll (Vector&\
  \ v)\n{\n    return unroll_vector<BSize>(v);\n}\n```\n\n`unroll_vector` 类需要一个赋值运算符来处理：\n\
  \n```cpp\ntemplate <unsigned BSize, typename V>\nclass unroll_vector\n{\n    public:\n\
  \    unroll_vector(V& ref) : ref(ref) {}\n    template <typename Src>\n    V& operator\
  \ =(const Src& that)\n    {\n        // ... 实现逻辑\n        unsigned s= my_size, sb=\
  \ s / BSize * BSize ; \n        for (unsigned i= 0; i < sb; i+= BSize)\n       \
  \     assign <0, BSize>::eval(ref, that, i); \n        // 展开参数执行考虑的向量操作结果如下：\n\n\
  ```\nCompute time unrolled <2> loop is 0.667546 μs.\nCompute time unrolled <4> loop\
  \ is 0.601179 μs.\nCompute time unrolled <6> loop is 0.565536 μs.\nCompute time\
  \ unrolled <8> loop is 0.570061 μs.\n```\n\n抱歉，我发现在最后的翻译过程中出现了逻辑混乱和重复。我将重新为您提供完整、准确的翻译译文：\n\
  \n[content]\n\n```cpp\ntemplate <unsigned Offset, unsigned Max>\n\nstruct my_axpy_ftor\n\
  \n{\n    template <typename U, typename V, typename W>\n    static const eval (U&\
  \ u, const V& v, const W& w, unsigned i)\n    {\n        if constexpr (Offset <\
  \ Max) {\n            u[i+ Offset]= 3.0 f * v[i+ Offset] + w[i+ Offset];\n     \
  \       my_axpy_ftor << Offset +1, Max >::eval (u, v, w, i);\n        }\n    }\n\
  };\n```\n\n与固定尺寸展开的唯一区别是索引是相对于索引 `i` 的。`eval()` 首先在 `Offset` 等于 0 时调用，然后是 1、2 等，依此类推。由于每次调用都是内联的，因此该（静态）仿函数的调用行为就像一个单一的整体操作块，没有循环控制和函数调用。因此，`my_axpy_ftor<0,\
  \ 4>::eval(u, v, w, i)` 执行的操作与代码列表 5–5 中第一个循环的迭代操作相同。使用不同的展开参数执行考虑的向量操作结果如下：\n\n\
  ```\nCompute time unrolled <2> loop is 0.667546 μs.\nCompute time unrolled <4> loop\
  \ is 0.601179 μs.\nCompute time unrolled <6> loop is 0.565536 μs.\nCompute time\
  \ unrolled <8> loop is 0.570061 μs.\n```\n\n现在我们可以为任何需要的块大小调用此操作。另一方面，为每个向量表达式都手动提供这样的仿函数是一项不可接受的编程工作。因此，我们现在将这种技术与表达式模板结合。\n\
  \n### 5.4.5 调整表达式模板\n\n`⇒ c++17/vector_unroll_example2.cpp`\n\n在第 5.3.3 节中，我们为向量和实现了表达式模板（不带展开）。以同样的方式，我们可以实现标量-向量积，但我们将其留给有感兴趣的读者作为练习\
  \ 5.7.5，并考虑仅包含加法的表达式，例如：\n\n`u` = `v` + `v` + `w`\n\n我们的基准性能为：\n\n```\nCompute time\
  \ is 1.72 μs.\n```\n\n为了将元调优引入表达式模板，我们只需要修改实际赋值，因为这是所有基于循环的向量操作执行的地方。其他操作（加法、减法、缩放……）仅返回包含引用的小型对象。我们可以像以前一样，将\
  \ `operator=` 中的循环拆分为开始的展开部分和结尾的完成部分：\n\n```cpp\ntemplate <typename T>\n\nclass\
  \ vector\n{\n    template <typename Src>\n    vector & operator=(const Src& that)\n\
  \    {\n        check_size (size (that));\n        unsigned s= my_size, sb = s /\
  \ 4 * 4; \n        for (unsigned i= 0; i ≪ sb; i+= 4)\n            assign <0, 4\
  \ >::eval (* this, that, i); \n        for (unsigned i= sb; i ≪ s; ++i)\n      \
  \      data [i]= that [i];\n        return *this;\n    }\n};\n```\n\n`assign` 仿函数的实现方式与\
  \ `my_axpy_ftor` 类似：\n\n```cpp\ntemplate <unsigned Offset, unsigned Max>\n\nstruct\
  \ assign\n{\n    template <typename U, typename V>\n    static void eval (U& u,\
  \ const V& v, unsigned i)\n    {\n        if constexpr (Offset < Max) {\n      \
  \      u[i+Offset]= v[i+Offset];\n            assign <Offset+1, Max>::eval(u, v,\
  \ i);\n        }\n    }\n};\n```\n\n计算上述表达式：\n\n```\nCompute time is 1.37 μs.\n\
  ```\n\n通过这种简单的修改，我们现在加速了所有的向量模板。然而，与之前的实现相比，我们失去了自定义循环展开的灵活性。仿函数 `assign` 有两个参数，因此允许自定义。问题在于赋值运算符。从原则上说，我们可以在这里定义一个显式模板：\n\
  \n```cpp\ntemplate <unsigned BSize, typename Src>\nvector& operator =(const Src&\
  \ that)\n{\n    check_size(size (that));\n    unsigned s= my_size, sb = s / BSize\
  \ * BSize ; \n    for (unsigned i= 0; i < sb; i+= BSize)\n        assign<0, BSize>::eval(*this,\
  \ that, i); \n    for (unsigned i= sb; i < s; ++i)\n        data[i]= that[i];\n\
  \    return *this;\n}\n```\n\n但这种方法的缺点是我们不能再将 `=` 作为自然的中缀运算符使用了。相反，我们必须写成：\n\n```cpp\n\
  u.operator=<4>(v + w);\n```\n\n这确实有一种极客魅力，而且人们也可以认为，人们为了性能做过且正在做许多更痛苦的事情。尽管如此，它并不符合我们对直观性和可读性的理想。替代表示法是：\n\
  \n```cpp\nunroll <4>(u = v + w);\n```\n\n以及：\n\n```cpp\nunroll <4>(u) = v + w;\n\
  ```\n\n这两个版本都可以实现。前者更好地表达了我们正在做的，后者更易于实现，且更具可读性。`unroll` 函数是简单的：它只需要 `unroll_vector`\
  \ 的类型信息：\n\n```cpp\ntemplate <unsigned BSize, typename Vector>\nauto unroll (Vector&\
  \ v)\n{\n    return unroll_vector<BSize>(v);\n}\n```\n\n`unroll_vector` 类需要一个赋值运算符来：\n\
  \n```cpp\ntemplate <unsigned BSize, typename V>\nclass unroll_vector\n{\n    public:\n\
  \    unroll_vector(V& ref) : ref(ref) {}\n    template <typename Src>\n    V& operator\
  \ =(const Src& that)\n    {\n        // ... 实现逻辑\n        unsigned s= my_size, sb=\
  \ s / BSize * BSize ; \n        for (unsigned i= 0; i < sb; i+= BSize)\n       \
  \     assign<0, BSize>::eval(ref, that, i); \n        // 展开参数执行考虑的向量操作结果如下：\n\n\
  ```\nCompute time unrolled <2> loop is 0.667546 μs.\nCompute time unrolled <4> loop\
  \ is 0.601179 μs.\nCompute time unrolled <6> loop is 0.565536 μs.\nCompute time\
  \ unrolled <8> loop is 0.570061 μs.\n```\n\n\n\n\n\n```\nCompute time one_norm <1>(v)\
  \ is 0.788445 μs.\nCompute time one_norm <2>(v) is 0.43087 μs.\nCompute time one_norm\
  \ <4>(v) is 0.436625 μs.\nCompute time one_norm <6>(v) is 0.43035 μs.\nCompute time\
  \ one_norm <8>(v) is 0.461095 μs.\n```\n\n这对应于 1.8 倍的加速。让我们尝试一些替代实现。\n\n### 5.4.6.2\
  \ 在数组上归约\n\n`⇒ c++17/reduction_unroll_array.cpp`\n\n当我们观察之前的计算，发现每次迭代使用了不同的 `v`\
  \ 项。但每次计算都访问同一个临时变量 `sum`，这限制了并发性。为了提供更多的并发性，我们可以使用多个临时变量，例如数组。修改后的函数如下：`[0]`。严格来说，对于对于可能的标量类型是不成立的，因为我们改变了加法顺序。这对于所有内置类型以及几乎所有用户定义的类型都是成立的。然而，我们可以定义非交换或非单元的加法。在这种情况下，我们的转换就是错误的。为了处理此类异常，我们需要像第\
  \ 5.5 节所示的语义概念。\n\n```cpp\ntemplate <unsigned BSize, typename Vector>\ntypename\
  \ Vector::value_type\ninline one_norm(const Vector& v)\n{\n    using std::abs;\n\
  \    typename Vector::value_type sum[BSize]= {};\n    unsigned s= size(v), sb= s\
  \ / BSize * BSize;\n    for (unsigned i= 0; i < sb; i+= BSize)\n        one_norm_ftor\
  \ <0, BSize >::eval(sum, i); \n    for (unsigned i= 1; i < BSize ; ++i)\n      \
  \    sum[0]+= sum[i];\n    for (unsigned i= sb; i < s; ++i)\n          sum[0]+=\
  \ abs (v[i]); \n    return sum[0];\n}\n```\n\n现在`one_norm_ftor` 的每个实例都操作 `sum` 数组中的一项：\n\
  \n```cpp\ntemplate <unsigned Offset, unsigned Max>\nstruct one_norm_ftor\n{\n  \
  \  template <typename S, typename V>\n    static void eval (S* sum, const V& v,\
  \ unsigned i)\n    {\n        using std::abs;\n        if constexpr (Offset < Max)\
  \ {\n            sum[Offset]+= abs (v[i+ Offset]);\n            one_norm_ftor <Offset\
  \ +1, Max>::eval (sum, v);\n        }\n    }\n};\n```\n\n在测试机器上运行此实现的结果如下：\n\n```\n\
  Compute time one_norm <1>(v) is 0.797224 μs.\nCompute time one_norm <2>(v) is 0.45923\
  \ μs.\nCompute time one_norm <4>(v) is 0.538913 μs.\nCompute time one_norm <6>(v)\
  \ is 0.467529 μs.\nCompute time one_norm <8>(v) is 0.506729 μs.\n```\n\n这比单变量版本还要慢一点。即使在内联函数中，传递数组的代价也更高。让我们尝试其他方法。\n\
  \n### 5.4.6.3 在嵌套类对象上归约\n\n`⇒ c++17/reduction_unroll_nesting_example.cpp`\n\n为了避免数组，我们可以为\
  \ `n` 个临时变量定义一个类，其中 `n` 是一个模板参数。那么该类的设计与函数的递归方案更加一致：\n\n```cpp\ntemplate <unsigned\
  \ BSize, typename Value>\nstruct multi_tmp\n{\n    using sub_type = multi_tmp <BSize\
  \ -1, Value>; \n    multi_tmp (const Value & v) : value (v), sub(v) {}\n    Value\
  \ value;\n    sub_type sub;\n};\ntemplate <typename Value>\nstruct multi_tmp <0,\
  \ Value>\n{\n    multi_tmp(const Value & v) {}\n};\n```\n\n这种类型的对象可以递归初始化。函数可以操作\
  \ `value` 成员并将 `sub` 成员的引用传递给后继者。这引导我们实现了该函数：\n\n```cpp\ntemplate <unsigned Offset,\
  \ unsigned Max>\nstruct one_norm_ftor\n{\n    template <typename S, typename V>\n\
  \    static void eval (S& sum, const V& v, unsigned i)\n    {\n        using std::abs;\n\
  \        if constexpr (Offset < Max) {\n            sum += abs (v[i+ Offset]);\n\
  \            one_norm_ftor < Offset +1, Max >::eval(sum.sub, v, i);\n        }\n\
  \    }\n};\n```\n\n使用该函数的展开后函数如下：\n\n```cpp\ntemplate <unsigned BSize, typename\
  \ Vector>\ntypename Vector::value_type\ninline one_norm(const Vector & v)\n{\n \
  \   using std::abs;\n    using value_type = typename Vector::value_type;\n    multi_tmp\
  \ <BSize, value_type> multi_sum {v};\n    unsigned s= size(v), sb= s / BSize * BSize;\n\
  \    for (unsigned i= 0; i < sb; i+= BSize)\n        one_norm_ftor <0, BSize >::eval(multi_sum.value,\
  \ v, i); \n    value_type sum= multi_sum.sum ();\n    for (unsigned i= sb; i < s;\
  \ ++i)\n        sum += abs (v[i]);\n    return sum;\n}\n```\n\n这里还缺少一部分：我们需要在结束时对\
  \ `multi_sum` 进行归约。不幸的是，我们无法为所有类型定义非交换或非单元的加法。\n\n```cpp\ntemplate <unsigned BSize,\
  \ typename Value>\nstruct multi_tmp\n{\n    Value sum() const { return value + sub.sum();\
  \ }\n};\ntemplate <typename Value>\nstruct multi_tmp <0, Value>\n{\n    Value sum()\
  \ const { return 0; }\n};}\n```\n\n该版本的计算时间为：\n\n```\nCompute time one_norm <1 >(v)\
  \ is 0.786668 μs.\nCompute time one_norm <2>(v) is 0.442476 μs.\nCompute time one_norm\
  \ <4>(v) is 0.441455 μs.\nCompute time one_norm <6>(v) is 0.410978 μs.\nCompute\
  \ time one_norm <8>(v) is 0.426368 μs.\n```\n\n因此，在我们的测试环境中，不同实现的性能是相似的。\n\n###\
  \ 5.4.6.4 处理抽象开销\n\n在前面的章节中，我们引入了临时变量以允许更多的操作。然而，这些临时变量只有在被分配到寄存器时才有益。否则，由于额外的内存流量和缓存失效信号，它们会降低整个执行速度。在某些旧编译器中，数组和嵌套类位于主内存，展开代码的运行时间甚至比顺序代码还要长。\n\
  \n这是一个典型的抽象开销（Abstraction Penalty）示例：语义等价程序由于更抽象的形式而运行较慢。为了量化抽象开销，Alex Stepanov\
  \ 在 90 年代初编写了一个基准测试来衡量封装类对 `accumulate` 函数性能的影响。其理念是，能够以相同速度运行测试所有版本的编译器应该能够在无开销的情况下执行\
  \ STL 算法。\n\n在当时，可以观察到抽象代码存在显著开销，而现代编译器可以轻松处理该基准测试中的抽象。这并不意味着它们可以处理任何层次的抽象，我们总是需要检查我们的关键内核是否使用较少抽象的实现会更快。例如，在\
  \ MTL4 中，矩阵向量乘法是以类似于迭代器的方式对所有矩阵类型和视图泛泛实现的。该操作针对重要的矩阵类进行了特化，并针对这些数据结构进行了优化（部分使用了原始指针）。高性能通用软件需要在通用重用性和针对性优化之间取得良好的平衡，以避免一方面产生可感开销，另一方面出现代码膨胀。\n\
  \n\n\n\n在我们寄存器使用的特殊案例中，我们可以尝试通过将复杂性从数据结构中转移开来帮助编译器优化。让临时变量存储在寄存器中的最佳机会是将它们声明为函数局部变量：\n\
  \n```cpp\ninline one_norm (const Vector & v)\n{\n    typename Vector::value_type\
  \ s0 {0}, s1 {0}, s2 {0}, ...\n}\n```\n\n现在的问题是我们应该声明多少个。这个数量不能依赖模板参数，而必须对所有块大小都是固定的。此外，临时变量的数量限制了我们展开循环的能力。\n\
  \n迭代块中实际使用了多少个临时变量取决于模板参数 `BSize`。遗憾的是，我们无法根据模板参数简单地改变函数调用中的参数数量，例如为较小的 `BSize`\
  \ 值传递较少的参数。因此，我们必须将所有变量传递给迭代块趣函数：\n\n```cpp\nfor (unsigned i= 0; i < sb; i+= BSize)\n\
  \    one_norm_ftor <0, BSize>::eval(s0, s1, s2, s3, s4,\n                      \
  \             s5, s6, s7, v, i);\n```\n\n每个块中的第一个计算累加在 `s0` 上，第二个累加在 `s1` 上，以此此类推。遗憾的是，我们无法根据偏移索引选择用于累加的临时变量（除非对每个值进行特化）。\n\
  \n或者，每次计算都可以在其第一个函数参数上执行，随后的趣函数在不带第一个参数的情况下调用：\n\n```cpp\none_norm_ftor <1, BSize>()(s1,\
  \ s2, s3, s4, s5, s6, s7, v, i);\none_norm_ftor <2, BSize>()(s2, s3, s4, s5, s6,\
  \ s7, v, i);\none_norm_ftor <3, BSize>()(s3, s4, s5, s6, s7, v, i);\n```\n\n这通过模板也无法实现。解决方案是旋转引用：\n\
  \n```cpp\none_norm_ftor <1, BSize>()(s1, s2, s3, s4, s5, s6, s7, s0, v, i);\none_norm_ftor\
  \ <2, BSize>()(s2, s3, s4, s5, s6, s7, s0, s1, v, i);\none_norm_ftor <3, BSize>()(s3,\
  \ s4, s5, s6, s7, s0, s1, s2, v, i);\n```\n\n这种旋转通过以下趣函数的实现实现：\n\n```cpp\ntemplate\
  \ <unsigned Offset, unsigned Max>\nstruct one_norm_ftor\n{\n    template <typename\
  \ S, typename V>\n    static void eval (S& s0, S& s1, S& s2, S& s3, S& s4, S& s5,\n\
  \                      S& s6, S& s7, const V& v, unsigned i)\n    {\n        using\
  \ std::abs;\n        if constexpr (Offset < Max) {\n            s0+= abs(v[i+ Offset]);\n\
  \            one_norm_ftor ≪ Offset +1, Max>::eval(s1, s2, s3, s4, s5,\n       \
  \                                            s6, s7, s0, v, i);\n        }\n   \
  \ }\n};\n```\n\n基于此趣函数的对应 `one_norm` 函数非常直观：\n\n```cpp\ntemplate <unsigned BSize,\
  \ typename Vector>\ntypename Vector::value_type\ninline one_norm (const Vector &\
  \ v)\n{\n    using std::abs;\n    typename Vector::value_type s0 {0}, s1 {0}, s2\
  \ {0}, s3 {0}, s4 {0},\n    typename Vector::value_type s5 {0}, s6 {0}, s7 {0};\n\
  \    unsigned s= size (v), sb= s / BSize;\n    for (unsigned i= 0; i < sb; i+= BSize)\n\
  \        one_norm_ftor <0, BSize>::eval(s0, s1, s2, s3, s4, s5, s6, s7, v, i);\n\
  \    s0 += s1 + s2 + s3 + s4 + s5 + s7;\n    for (unsigned i= sb; i <;++)\n    \
  \    s0+= abs(v[i]);\n    return s0;\n}\n```\n\n轻微的缺点是小向量的开销：在块迭代之后，所有未被使用的寄存器都必须进行累加。另一方面，一个巨大的优势是旋转允许块大小大于临时变量的数量。它们可以在不破坏结果的情况下被用。然而，实际的并发性不会大于变量的数量。该实现在测试机器上的执行情况如下：\n\
  \n```\nCompute time one_norm <1>(v) is 0.793497 μs.\nCompute time one_norm <2>(v)\
  \ is 0.500242 μs.\nCompute time one_norm <4>(v) is 0.443954 μs.\nCompute time one_norm\
  \ <6>(v) is 0.441819 μs.\nCompute time one_norm <8>(v) is 0.430749 μs.\n```\n\n\n\
  \n\n```cpp\ntemplate <unsigned Index0, unsigned Max0,\n          unsigned Index1,\
  \ unsigned Max1>\nstruct mult_block\n{\n    using next = mult_block ≪ Index0, Max0,\
  \ Index1 +1, Max1 >;\n    using next_row = mult_block ≪ Index0 +1, Max0, 0, Max1\
  \ >; \n    template <typename Tmp, typename Matrix>\n    static void eval (Tmp&\
  \ tmp, const Matrix& A, const Matrix& B,\n                      unsigned i, unsigned\
  \ j, unsigned k)\n    {\n        tmp . value += A(i + Index0, j) * B(j, k + Index1);\n\
  \        if constexpr (Index1 == Max1) {\n          if constexpr (Index0 ≪ Max0)\n\
  \              next_row::eval(tmp .sub, A, B, i, j, k);\n        } else\n      \
  \    next::eval(tmp .sub, A, B, i, j, k);\n    } \n    template <typename Tmp, typename\
  \ Matrix>\n    static void update (const Tmp& tmp, Matrix& C, unsigned i, unsigned\
  \ k)\n    {\n        C(i + Index0, k + Index1)= tmp . value;\n        if constexpr\
  \ (Index1 == Max1) {\n          if constexpr (Index0 ≪ Max0)\n              next_row::update\
  \ (tmp.sub, C, i, k);\n        } else\n          next::update (tmp .sub, C, i, k);\n\
  \    }\n};\n```\n\n通过适当的日志，我们可以看到对于 `C` 的每个元素，执行的操作与标准实现是相同的。我们还可以看到，这些元素的计算是交错进行的。在接下来的日志中，我们乘了\
  \ $4 \\times 4$ 矩阵并展开了 $2 \\times 2$ 块。从四个临时变量中，我们观察了两个：\n\n```\ntmp .4+= A[1][0]\
  \ * B[0][0]\ntmp .3+= A[1][0] * B[0][1]\ntmp .4+= A[1][1] * B[1][0]\ntmp .3+= A[1][1]\
  \ * B[1][1]\ntmp .4+= A[1][2] * B[2][0]\ntmp .3+= A[1][2] * B[2][1]\ntmp .4+= A[1][3]\
  \ * B[3][0]\ntmp .3+= A[1][3] * B[3][1]\nC[1][0]= tmp .4\nC[1][1]= tmp .3\ntmp .4+=\
  \ A[3][0] * B[0][0]\ntmp .3+= A[3][0] * B[0][1]\ntmp .4+= A[3][1] * B[1][0]\ntmp\
  \ .3+= A[3][1] * B[1][1]\ntmp .4+= A[3][2] * B[2][0]\ntmp .3+= A[3][2] * B[2][1]\n\
  tmp .4+= A[3][3] * B[3][0]\ntmp .3+= A[3][3] * B[3][1]\nC[3][0]= tmp .4\nC[3][1]=\
  \ tmp .3\n```\n\n在临时变量 4 中，我们累加 $A[1] \\cdot B⁰$ 并将结果存储到 `c[1][0]`。这与临时变量 3 中 $A[1]\
  \ \\cdot B¹$ 的累加交错进行，从而可以使用超标处理器的多个流水线。我们还可以看到：\n\n![Images](img/352equ01.jpg)\n\
  \n最后但同样重要的是，我们想要看到这种并不简单的矩阵乘法实现的影响。在我们的测试机器上基准测试结果如下：\n\n```\nTime mult <1, 1> is\
  \ 1968 μs. These are 2122 MFlops.\nTime mult <1, 2> is 1356 μs. These are 3079 MFlops.\n\
  Time mult <1, 4> is 1038 μs. These are 4022 MFlops.\nTime mult <1, 8> is 871 μs.\
  \ These are 4794 MFlops.\nTime mult <1, 16 > is 2039 μs. These are 2048 MFlops.\n\
  Time mult <2, 1> is 1394 μs. These are 2996 MFlops.\nTime mult <4, 1> is 1142 μs.\
  \ These are 3658 MFlops.\nTime mult <8, 1> is 1127 μs. These are 3705 MFlops.\n\
  Time mult <16, 1> is 2307 μs. These are 1810 MFlops.\nTime mult <2, 2> is 1428 μs.\
  \ These are 2923 MFlops.\nTime mult <2, 4> is 1012 μs. These are 4126 MFlops.\n\
  Time mult <2, 8> is 2081 μs. These are 2007 MFlops.\nTime mult <4, 4> is 1988 μs.\
  \ These are 2100 MFlops.\n```\n\n我们可以看到 `mult<1, 1>` 的性能与标准实现相同，这意味着编译器并没有改变执行顺序。我们还可以看到，展开后的版本更快。在处理\
  \ `double` 类型时，性能略低：\n\n```\nTime mult <1, 1> is 1996 μs. These are 2092 MFlops.\n\
  Time mult <1, 2> is 1356 μs. These are 2099 MFlops.\nTime mult <2, 2> is 1463 μs.\
  \ These are 2855 MFlops.\nTime mult <1, 4> is 1251 μs. These are 3337 MFlops.\n\
  Time mult <1, 8> is 1068 μs. These are 3908 MFlops.\nTime mult <1, 16 > is 2078\
  \ μs. These are 2009 MFlops.\nTime mult <2, 1> is 1450 μs. These are 2880 MFlops.\n\
  Time mult <4, 1> is 1188 μs. These are 3514 MFlops.\nTime mult <8, 1> is 1143 μs.\
  \ These are 3652 MFlops.\nTime mult <16, 1> is 2332 μs. These are 1791 MFlops.\n\
  Time mult <2, 2> is 1218 μs. These are 3430 MFlops.\nTime mult <2, 4> is 1040 μs.\
  \ These are 4014 MFlops.\nTime mult <2, 8> is 2101 μs. These are 1987 MFlops.\n\
  Time mult <4, 4> is 2001 μs. These are 2086 MFlops.\n```\n\n这表明其他参数化可以带来额外的加速，并且性能可以翻倍。\n\
  \n### 5.4.8 调优总结\n\n包含基准测试在内的软件调优是一门艺术，特别是与高级编译器优化的交互。源代码中极其微小的修改可能会改变程序的运行行为。在我们的示例中，尺寸是否在编译时已知本不应该重要。但事实确实如此。特别是在没有编译\
  \ `-DNDEBUG` 时，编译器可能会在某些情况下省略索引检查，而在另一些情况下又执行。打印计算值也很重要，因为当明显不需要结果时，编译器可能会省略整个计算。\n\
  \n此外，我们必须验证重复执行（为了获得更好的时钟分辨率并分摊测量开销）是否确实在重复。当结果与重复次数无关时，智能编译器可能会执行一次（我们在使用 `clang++`\
  \ 3.4 和块大小为 8 的展开归约时观察到了这一点）。这种优化特别发生在结果为内建类型时，而自定义类型的计算通常不会受到此类省略（但我们不能完全依赖这一点）。\n\
  \n本节的目标并不是实现极致的矩阵或标量乘法。在拥有数百个核心和数百万线程的新型 GPU 和多核处理器面前，我们对超标流水线的探索显得杯水一粟。但事实如此。调优后的实现可以与第\
  \ 4.6 节的多线程技术或 OpenMP 结合。模板参数化的块划分也是 SSE 加速的极佳准备。\n\n\n\n\n然而，性能调优是在针对移动的目标：今天产生巨大收益的优化，明天可能变得无关紧要甚至产生危害。因此，性能改进不应硬编码在应用程序内部，而是我们应该能够方便地配置调优参数。\n\
  \n本节的示例表明，`元调优`（meta-tuning）是非常复杂的，而且让我们遗憾的是，变换带来的收益并不如我们在 2006 年首次研究它们时那样显著了。我们在几个示例中也看到，`编译器`在应用`通用优化`（general-purpose-optimizations）方面非常强大，并且通常能以更少的努力获得更好的结果。从努力的角度来说，建议不要在密集线性代数等流行领域与高度调优的库竞争。诸如\
  \ `MKL` 或 `Goto-BLAS` 这样的库极其高效，即使付出巨大的努力后，我们超越它们的机会也微乎其微。尽管如此，我们将把精力集中在最重要的目标上：针对特定领域的内核进行优化，这些优化对我们应用程序的整体运行时间具有强力影响。\n\
  \n## C++20 5.5 使用语义概念进行优化\n\n在前面的章节中，我们展示了如何使用 `C++` 特性来加速计算。现在，我们将探索概念（concepts），使我们的程序能够决定**何时**可以加速某些计算，即执行速度不仅更快，而且仍交付正确的结果。为此，我们将引入*语义概念*（Semantic\
  \ Concepts），它们指定了类型及其相关操作的属性。`C++20` 中的概念并没有提供像印第安纳大学（Indiana University）原始概念设计\
  \ [24,55] 那样描述语义行为的能力。以前，人们可以写一个 `axiom`（公理）来声明某些属性，例如乘法的结合律：`(*x* × *y*) × *z*\
  \ = *x* × (*y* × *z*) *∀x, y, z*`。今天我们无法在概念中直接表达这一点，但我们将在本节中说明如何提供关于数学属性的声明，并像使用原始语义概念一样使用它们。\n\
  \n### 5.5.1 语义调优要求\n\n`⇒ c++20/concept_accumulate_semantic.cpp`\n\n在 Section 3.10.1\
  \ 中，我们引入了 `accumulate` 的受约束实现，为了方便起见，在此重复：\n\n```\ntemplate <typename Iter, typename\
  \ Value, typename Op>\n\nValue accumulate (Iter first, Iter last, Value init, Op\
  \ op)\n\n    requires Acculatable << Iter, Value, Op>\n\n{\n\n    for (; first !=\
  \ last ; ++ first)\n        init = op(init, * first);\n\n    return init;\n}\n```\n\
  \n如前所述，当我们在累加中使用多个变量时，特别是归约操作，可以从展开（unrolling）中获益。通过这样做，我们改变了执行顺序，因此要求使用的二元操作满足：\n\
  \n- **结合律（Associative）：** `op(op(*x, y)*,z*) = op(*x,* op(*y, z*)) *∀x, y, z* 以及\n\
  - **交换律（Commutative）：** `op(*x, y*) = op(*y, x*) *∀x, y.*\n\n关注的另一个细节是额外的累加器是如何初始化的。要求调用者提供初始值简化了非现代\
  \ `C++` 中的类型推导，并智能地规避了必须知道操作的中元或单位元 `e` 的需要（该元素满足：`op(*x, e*) = op(*e, x*) = *x*\
  \ *∀x.*）。如果调用者使用另一个初始值，它会被包含在累加。当我们使用额外的累加器时，必须用中元对其进行初始化，以避免在用户提供的初始值不是中元时重复它。\n\
  \n在代数中，具有上述描述行为的操作的值集被称为*交换单群*（Commutative Monoid）。接下来的概念在 `C++` 中表达了这种代数结构：\n\n\
  ```\ntemplate <typename Op, typename Value>\n\nconcept CommutativeMonoid =\n\n \
  \ requires (Op op, Value x, Value y)\n\n{\n\n    {op(x, y)} -> std::convertible_to\
  \ <Value>;\n\n    { identity (op, x)} -> std::convertible_to <Value>;\n\n    requires\
  \ commutative_monoid_map <Op, Value>;\n\n};\n```\n\n在我们的概念中，我们将语法概念和语义概念分开了。前者可以可以直接在语言中表示，如前两个要求所示。显然，我们要求操作的结果可以转换为\
  \ `Value` 类型，并且对于我们的操作存在一个 `identity` 函数，其结果也可以转换为 `Value` 类型。\n\n语义属性必须由用户通过类型特质（type\
  \ trait）显式声明，其中我们使用了 Section 6.6.2 中基于函数的方法（该方法适用于派生类，而不是基于模板特化的技术）。只要给定类型的操作尚未声明为交换单群，就假设它不是：\n\
  \n```\nstd::false_type cm_map_impl (...);\n\ntemplate <typename Op, typename Value>\n\
  \nconstexpr bool commutative_monoid_map =\n\n  decltype (cm_map_impl (std::declval\
  \ <Op >(),\n              ::value;\n```\n\n你现在可能觉得实现那个糟糕的省略号（...）很遗憾。但这只是为了。为了声明一个单群，我们引入了一个\
  \ `add` 仿函数：\n\n```\nstruct add\n\n{\n\n    template <typename T>\n    operator()(T\
  \ x, T y) constexcept { return x + y; }\n};\n```\n\n并为它提供一个 `identity` 函数：\n\n```\n\
  template <typename Value>\n\nidentity (add, Value)\n\n{\n\n    return {0};\n}\n\
  ```\n\n由于任何 `Value` 的加法都是交换的，我们默认将它们声明为单群：\n\n```\ntemplate <typename Value>\n\n\
  std::true_type cm_map_impl (add);\n```\n\n对于任何加法不满足结合律的类型，我们仍然可以重载：\n\n```\nstd::false_type\
  \ cm_map_impl (add);\n```\n\n严格来说，浮点数的加法只是近似的。对于整数类型：\n\n```cpp\ntemplate <integral\
  \ Value>\n\nstd::true_type cm_map_impl (add);\n```\n\n现在我们有了展开 `accumulate` 需要的所有概念：\n\
  \n```\ntemplate <std::random_access_iterator Iter, typename Value,\n\ntypename Op>\n\
  \nValue accumulate (Iter first, Iter last, Value init, Op op)\n\n    requires Acculatable\
  \ <Iter, Value, Op>\n    && CommutativeMonoid <Op, Value>\n\n{\n\n    auto t1= identity\
  \ (op, * first), t2= t1, t3= t1;\n\n    auto size = last - first;\n\n    auto bsize\
  \ = size / 4 * 4;\n\n    for (Iter blast = first + bsize ; first != blast ; first\
  \ += 4) {\n\n        init = op(init, * first);\n        t1= op(t1, *(first +1));\n\
  \        t2= op(t2, *(first +2));\n        t3= op(t3, *(first +3));\n    }\n\n \
  \   for (; first != last ; ++ first)\n        init = op(init, * first);\n\n    return\
  \ op(op(init, t1), op (t2, t3));\n\n}\n```\n\n为了简单起见，我们在这里没有采用自定义块大小。为了免去用户调用 `begin`\
  \ 和 `end`，我们还可以添加一个基于范围的接口：\n\n```\ntemplate <ranges::range R, typename Value, typename\
  \ Op>\n\nValue accumulate (const R& r, Value init, Op op)\n\n{\n\n    return accumulate\
  \ (begin (r), end (r), init, op);\n\n}\n```\n\n\n\n\n我们不需要为了重载该函数来启用循环展开（unrolling）；编译器会自动选择正确的基于迭代器的重载。为了简单起见，我们假设\
  \ `begin` 和 `end` 的返回类型是相同的，这对于范围（ranges）来说并不是要求的。我们可以通过两种方式提升我们的实现：允许 `first` 和\
  \ `last` 使用不同的类型，或者为我们的范围创建一个 `common_view`，使得 `begin` 和 `end` 具有相同类型。\n\n将函数简化为三个参数后，我们渴望进一步简化它。历史上引入初始值是为了避免类型推导技巧且不需要单位元。在现代\
  \ C++ 中，我们不再担心类型推导，而且任何 `CommutativeMonoid` 操作都对应了单位元。因此，我们可以仅将范围和操作作为参数来实现 `accumulate`：\n\
  \n```\ntemplate <ranges::range R, typename Op>\n\nauto accumulate (const R& r, Op\
  \ op)\n    requires CommutativeMonoid <Op, ranges::range_value_t <R>>\n{\n    auto\
  \ init = identity (op, * begin (r));\n    return accumulate (begin (r), end (r),\
  \ init, op);\n}\n```\n\n当然，非交换单群也有单位元，我们可以看到需要一个更细粒度的概念层次结构（concept hierarchy），我们将在下一节中讨论它。\n\
  \n### 5.5.2 语义概念层次结构\n\n`⇒ c++20/algebraic_concepts.cpp`\n\n在本节中，我们用概念（concepts）定义了最基本的代数结构。承认，这对于编程书籍来说是一个相当理论化的课题，如果读者的兴趣更多在技术层面，可以跳过此处。另一方面，表达语义是编程的一个全新维度，我们可以通过一扇刚刚开启的门看到\
  \ C++ 的未来。\n\n最基础的代数结构是 `Magma`（群）。它只需要一个值集合和一个二元运算，其运算结果也在该值范围内：\n\n```\ntemplate\
  \ <typename Op, typename Value>\nconcept Magma =\nrequires (Op op, Value x, Value\
  \ y)\n{ op(x, y) } -> std::same_as<Value>;\n```\n\n从技术角度来看，这是该层次结构中唯一的语法概念，编译器可以检查其建模，而不需要任何声明。下一个结构是\
  \ `SemiGroup`（半群），它还需要运算满足结合律：\n\n```cpp\ntemplate <typename Op, typename Value>\n\
  concept SemiGroup =\nMagma<Op, Value> &&\nsemi_group_map<Op, Value>;\n```\n\n一个运算在给定类型上是否具有结合律无法通过编译器推断出来，必须由用户声明。同样，我们建议基于函数的声明。带有\
  \ `identity` 的 `SemiGroup` 是一个 `Monoid`（单群）：\n\n```cpp\ntemplate <typename Op, typename\
  \ Value>\nconcept Monoid =\nSemiGroup<Op, Value> &&\nrequires (Op op, Value x)\n\
  { identity(op, x) } -> std::same_as<Value>;\nrequires monoid_map<Op, Value>;\n```\n\
  \n编译器可以检查函数 `identity` 是否存在以及返回类型是否为 `Value`。该单位元的行为是否像单位元，必须由用户在 `monoid_map` 中声明。`Commutative`（交换）概念在另一个意义上细化了\
  \ `Magma`：参数的可交换性。这是一个必须显式声明的语义属性：\n\n```cpp\ntemplate <typename Op, typename Value>\n\
  concept Commutative =\nMagma<Op, Value> &&\ncommutative_map<Op, Value>;\n```\n\n\
  我们在上一节中看到的 `CommutativeMonoid`（交换单群）概念现在仅仅是 `Commutative` 和 `Monoid` 的细化：\n\n```cpp\n\
  template <typename Op, typename Value>\nconcept CommutativeMonoid =\nMonoid<Op,\
  \ Value> && Commutative<Op, Value>;\n```\n\n然而，现在我们有了一个详细的语义概念层次结构，可以精确地约束我们的函数。还有许多可以用概念表达的代数结构，作者在他的学术著作中已经做了这些。这在论文《Integrating\
  \ Semantics: Using C++ Concepts to Develop Robust and Reusable Libraries》中得到了总结，并在报告《The\
  \ Fundamental Algebraic Concepts in C++》中进行了更广泛的讨论。一旦建立了语义层次结构，我们必须仔细地声明给定操作持有哪些属性。这是通过为我们的算子和类型重载\
  \ `map_impl` 函数来实现的。`Concept` 一个非常方便的特性是，某些概念的这种声明意味着了它所细化出的所有概念的声明。由于 C++20 中没有语义概念，我们也缺少了这一功能。但是，我们可以自己实现它。例如，每个\
  \ `Monoid` 都是 `SemiGroup`，我们将在后者的显式部分表达这一点。但我们不能通过 `Monoid` 概念约束 `SemiGroup` 的 map\
  \ 声明，因为会导致循环依赖。因此，我们使用 `enable_if` 直接通过 `map_impl` 函数实现它：\n\n```\ntemplate <typename\
  \ Op, typename Value,\ntypename = std::enable_if_t<monoid_map<Op, Value>>\nstd::true_type\
  \ semi_group_map_impl (Op, Value);\n```\n\n现在，我们只需要声明一个操作是 `Monoid`，`SemiGroup`\
  \ 的声明就会被包含。同样，每个 `CommutativeMonoid` 显然都是 `Commutative` 且 `Monoid`。但 `Commutative`\
  \ 和 `Monoid` 的显式声明意味着 `CommutativeMonoid`，但反之不然。虽然我们的概念实现不需要 `CommutativeMonoid`\
  \ 的 `map_impl`，但为了目的，我们仍然拥有：\n\n```cpp\nstd::false_type cm_map_impl (...);\n\ntemplate\
  \ <typename Op, typename Value,\ntypename = std::enable_if_t<cm_map<Op, Value>>\n\
  std::true_type monoid_map_impl (Op, Value);\n\ntemplate <typename Op, typename Value,\n\
  typename = std::enable_if_t<cm_map<Op, Value>>\nstd::true_type commutative_map_impl\
  \ (Op, Value);\n```\n\n有了这一扩展，用户只需要声明操作符合 `CommutativeMonoid`，本节中的其他所有概念也都得到了建模。我们坚信语义概念将改变未来的编程方式。编译器能够验证语义属性（只要根据用户的声明）这一事实将建立全新的软件可靠性。我们对未来的\
  \ C++ 标准将为语义概念提供更好的支持。\n\n### 5.6 图灵完备性\n\n`可计算性`是计算机科学和数学逻辑中的一个重要领域。在编程书中详细介绍它会偏题太远。该理论的核心是以阿尔尼佐·丘奇和艾兰·图灵命名的“丘奇-图灵论”。它指出，一个函数可以被人类或计算机按照算法（忽略资源限制）所计算，当且仅当它是可以通过`图灵机`\
  \ 计算的。\n\n因此，这样的函数被称为`图灵可计算`。图灵机是一种简单的计算机模型，由：\n\n- 一条无限带，上面包含有限数量的初始化单元和无限数量空白单元；\n\
  - 一个可以在带子实际位置进行读取或写入，或者向左或向右移动的读头；\n- 一个状态寄存器（模拟人的状态）；以及\n- 有限的指令集。\n\n如果机器进入其中一个“接受状态”，则带子上的初始序列被视为接受。\n\
  \n**定义 5–1。** 如果一个系统（计算机的指令集或编程语言）能够模拟图灵机，则被称为`图灵完备`。这意味着图灵完备系统可以计算每个图灵可计算的函数，即每个可以通过算法描述的函数。\n\
  \n\n\n\nC++ 的元编程是图灵完备的。\n\n我们将在本节证明这一点。Todd Veldhuizen 之前通过使用传统模板实现图灵机证明了这一点 [71]。这证明了模板系统是图灵完备的。我们选择了另一种方法，通过说明\
  \ `constexpr` 函数可以模拟 `μ`-递归函数来证明。该符号引用自 Lutz Hamel 关于“计算理论”的讲座 [29]。\n\n首先，我们展示所有\
  \ `μ`-递归函数都可以用 `constexpr` 函数实现：\n\n### 零函数 (Zero Functions)\n`Zero Functions` 将任意参数映射到零：\n\
  \n`f^k(n[1], ..., n[k]) := 0`\n\n以三个参数为例，我们可以很容易地实现：\n\n```cpp\nconstexpr int ternary_zero\
  \ (int, int, int)\n{\n    return 0;\n}\n```\n\n### 参数投影 (Projection on Argument)\n\
  `返回参数之一：`\n\n![Images](img/360equ01.jpg)\n\n返回三个参数中第二个参数的示例实现如下：\n\n```cpp\nconstexpr\
  \ int second_from_three(int, int j, int)\n{\n    return j;\n}\n```\n\n### 继继函数 (Successor)\n\
  `Successor` 显然产生下一个自然数：\n\n`ν(n) := n + 1`\n\n其实现方式非常直接：\n\n```cpp\nconstexpr int\
  \ successor (int i)\n{\n    return i + 1;\n}\n```\n\n### 原始递归 (Primitive Recursion)\n\
  `Primitive Recursion` 的形式化定义为：\n\n`f(n[1], ..., n[k], 0) := g(n[1], ..., n[k])`\n\
  \n`f(n[1], ..., n[k],ν(n)) := h(n[1], ..., n[k], n, f(n[1], ..., n[k], n))`\n\n\
  原始递归函数的一个例子是：\n\n```cpp\nconstexpr int p_rec (int i, int j, int k)\n{\n    return\
  \ k == 0 ? g(i, j) : h(i, j, k- 1, p_rec (i, j, k- 1));\n}\n```\n\n### 最小化 (Minimalization)\n\
  `Minimalization` 对于值值元组 (`n[1], ..., n[k]`) 关于关系 `p` 的最小化操作 `μ` 是使得 (`n[1], ...,\
  \ n[k], z`) 属于 `p` 的最小值 `z`：\n\n`f(n[1], ..., n[k]) := μz[p(n[1], ..., n[k], z)]`\
  \ 其中\n\n`μz[p(n[1], ..., n[k], z)] := min{z|p(n[1], ..., n[k], z*)*}`\n\n注意，与之前的所有函数不同，这是一个偏函数，它不会为每个可能的参数值返回结果。为了演示实现这种偏函数的能力，我们提供了一个自然数平方根的计算：\n\
  \n```cpp\nconstexpr bool is_square_of (int i, int j) // 对应于 p \n{\n    return i\
  \ == j*j;\n}\n\nconstexpr int sqrt_aux (int i, int j)\n{\n    return is_square_of\
  \ (i, j) ? j : sqrt_aux (i, j +1);\n} \n\nconstexpr int sqrt (int i)\n{\n    return\
  \ sqrt_aux (i, 0);\n}\n```\n\n在参数不是平方数的情况下，算法会进入无限循环（可能在编译时）。凭借 C++14 的 `constexpr`\
  \ 特性，我们可以更紧凑地实现 `sqrt` 函数，但我们更倾向于证明 C++11 中的 `constexpr` 函数也是图灵完备的。\n\n我们现在已经证明\
  \ `constexpr` 函数实现了 `μ`-递归函数，即所有 `μ`-递归函数都可以用 `constexpr` 函数进行编程。此外，已经证明 `μ`-递归函数实现了\
  \ `λ`-演算，而 `λ`-演算反过来实现了图灵机，而图灵机又实现了 `μ`-递归函数：\n\n`μ`-recursive f. ≺ λ-calculus ≺\
  \ 图灵机 ≺ μ-recursive f.\n\n证明的草纲可以在 [29] 中找到。根据传递性，这意味着：\n\n`constexpr` ≺ μ-recursive\
  \ f. ≺ λ-calculus ≺ 图灵机.\n\n因此，每个图灵机程序都可以通过 `constexpr` 函数构建。\n\n该证明的结论是，任何算法可计算的函数都可以由\
  \ C++ 编译器在编译过程中计算。(11) 正如 Herb Sutter 一所说，模板系统（以及 `constexpr` 函数）建立了一种嵌入在 C++ 中的函数式编程语言。我们希望通过本章的示例强调了这这两个陈述。\n\
  \n11. 假设我们消除了动态内存分配等技术障碍（尽管在 C++20 中在某些限制下允许）。\n\n### 5.7 练习题\n\n#### 5.7.1 类型特征\
  \ (Type Traits)\n编写用于移除和添加引用的类型 trait。为元谓词 `is_vector` 添加一个领域特定的类型 trait，并假设目前已知的向量只有\
  \ `my_vector<Value>` 和 `vector_sum<E1, E2>`。\n\n#### 5.7.2 斐那契序列\n编写一个模板元函数，在编译时计算斐那契序列的第\
  \ `n` 个值。斐那契序列由以下递归定义：\n\n![Images](img/360equ01.jpg)\n\n#### 5.7.3 最大公约数元程序\n编写一个计算两个整数最大公约数（GCD）的元程序。该算法如下：\n\
  \n```\n1 function gcd(a, b):\n2      if b = 0 return a\n3      else return gcd\n\
  ```\n\n```cpp\ntemplate <typename I>\nI gcd (I, I) { ... }\n```\n然后在编译时执行相同算法的元函数。你的元函数格式如下：\n\
  \n```cpp\ntemplate <int A>\nstruct gcd {\n    static int value;\n};\n```\n即 `gcd<a,b>::value`\
  \ 是 `a` 和 `b` 的最大公约数。\n\n#### 5.7.4 混合类型的有理数\n允许混合类型的 3.12：\n\n• 分子和分母可以不同；\n• 支持不同类型间的算术运算；\n\
  • 拷贝构造需要显式转换。\n\n使用 `decltype` 确定混合操作的类型。\n\n#### 5.7.5 向量表达式\n实现一个向量类（内部可以使用 `std::vector<double>`），它至少包含以下成员：\n\
  \n```cpp\nclass my_vector {\npublic:\n    using value_type = double;\n    my_vector(int\
  \ n);\n    // 自身的拷贝构造\n    my_vector(my_vector const&);\n    // 来自泛型向量的构造\n    template\
  \ <typename Vector>\n    my_vector(Vector const&);\n    // 赋值运算符\n    my_vector&\
  \ operator =(my_vector const&);\n    // 泛型 Vector 的赋值\n    template <typename Vector>\n\
  \    my_vector& operator =(Vector const&);\n    value_type& operator()(int i);\n\
  \    int size() const;\n    value_type operator()(int i) const;\n};\n```\n\n构建标量与向量乘法的表达式模板：\n\
  \n```cpp\ntemplate <typename Scalar, typename Vector>\nclass scalar_times_vector_expression\
  \ {};\n\ntemplate <typename Scalar, typename Vector>\nscalar_times_vector_expression<Scalar,\
  \ Vector>\noperator *(Scalar const& s, Vector const& v) {\n    return scalar_times_vector_expression<Scalar,\
  \ Vector>(s, v);\n}\n```\n\n将所有类和函数放入 `math` 命名空间。你还可以为两个向量的和创建一个表达式模板。编写一个简单的程序：\n\
  \n```cpp\nint main () {\n    math::my_vector v(5);\n    ... 填充 v 的某些值 ...\n    math::my_vector\
  \ w(5);\n    w = 5.0 * v; \n    w = 5.0 * (7.0 * v);\n    w = v + 7.0* v; // 如果你添加了运算符\
  \ +\n}\n```\n\n使用调试器查看发生了什么。\n\n#### 5.7.6 元列表 (Meta-List)\n创建一个用于编译时类型列表的可变类模板。实现元函数\
  \ `insert`、`append`、`erase` 和 `size`。\n\n\n\n\nC++ 是一种多范式语言，它关联最紧密的的范式是`面向对象编程`\
  \ (OOP)。因此，我们在书籍和教程中到处都是漂亮的“狗-猫-鼠”示例。然而，经验表明，大多数真实的软件包并不包含文献中让我们相信的那种深层类层次。此外，根据我们的经验，泛型编程在科学和工程编程中是优越的范式，因为：\n\
  \n- 它更灵活：多态不仅限于子类；以及\n- 它提供了更好的性能：间接函数调用没有开销。\n\n我们将在本章中更详细地解释这一点。\n\n另一方面，当多个类共享数据和功能时，继承可以帮助我们提高生产力。访问继承的数据是没有开销的，而且当继承的方法不是\
  \ `virtual` 时，即使调用这些方法也没有额外成本。\n\n面向对象编程的巨大益处是**运行时多态**：可以在运行时决定调用哪种方法的实现。我们甚至可以在执行期间选择类类型。上述\
  \ `virtual` 函数的开销只有在非常细粒度的方法（如元素访问）为 `virtual` 时才是一个问题。相反，当我们仅将粗粒度的方法（如线性求解器）实现为\
  \ `virtual` 时，额外的执行成本是可以忽略不计的。\n\nOOP 与泛型编程结合是一种非常强大的方式，为我们提供了一种单一范式都无法提供的重用形式（§6.2–§6.6.1）。\n\
  \n## 6.1 基本原理\n\n与 C++ 相关的 OOP 基本原理有：\n\n- **抽象**：类（第 2 章）定义了对象的属性和方法。类还可以指定属性的不不变性；例如，有理数类中，分子和分母应该是互质的。所有方法必须保持这些不变性。\n\
  - **封装**表示实现细节的隐藏。为了不违反不变性，不能直接访问内部属性，只能通过类的方法进行访问。作为回报，`public` 数据成员不是内部属性，而是类接口的一部分。\n\
  - **继承**意味着派生类包含其基类的所有数据成员和函数成员。\n- **多态**：标识符根据上下文或参数进行解释的能力。我们已经见过函数重载和模板实例化方面的多态性。在本章中，我们将看到另一种与继承相关的形式。\n\
  - **晚绑定**：在运行时选择实际调用的函数。\n\n我们已经讨论了抽象、封装和某些类型的多态。在本章中，我们将引入继承和相关的多态。\n\n为了演示 OOP\
  \ 的经典用法，我们将给出一个简单的示例，它与科学和工程只有间接关系，但允许我们以一种易理解的方式研究 C++ 特性。稍后我们将提供更复杂的类层次和来自科学的示例。\n\
  \n### 6.1.1 基类与派生类\n\n`c++11/oop_simple.cpp`\n\n各种 OOP 原则的一个用例是不同类型的人员数据库。我们从一个作为本节所有类的类的类开始：\n\
  \n```cpp\nclass person\n{\n  public :\n    person () {}\n    explicit person(const\
  \ string& name) : name {name} {}\n    void set_name(const string& n) { name= n;\
  \ }\n    string get_name () const { return name; }\n    void all_info () const\n\
  \    { cout ≪ \"[person] My name is \" ≪ name ≪ endl; }\n  private:\n    string\
  \ name;\n};\n```\n\n为了简单起见，我们对姓名仅使用一个成员变量，并避免将其拆分为姓、中间名和名。典型的 OOP 类通常包含成员变量的 getter\
  \ 和 setter 方法（某些 IDE 会在添加新变量时自动在类中插入这些）。尽管如此，现在无条件地为每个成员引入 getter 和 setter 被认为是坏做法，因为这违背了封装的理念。许多人甚至认为这是一种`反模式`\
  \ (Anti-Pattern)，因为我们直接通过读取和写内部状态来执行对象的任务。相反，类应该提供有意义的方法来执行它们各自的任务，而不暴露对象的内部状态。\n\
  \n`all_info` 方法的设计意图是**多态的**，因为它取决于我们获取关于人的信息的实际类类型。\n\n我们的第一种 `person` 是 `student`：\n\
  \n```cpp\nclass student\n  : public person\n{\n  public:\n    student(const string&\
  \ name , const string& passed)\n      : person{name}, passed{passed} {}\n    void\
  \ all_info () const {\n          cout ≪ \"[student] My name is \" ≪ get_name ()\
  \ ≪ endl;\n          cout ≪ \"I passed the following grades: \" ≪ passed ≪ endl;\n\
  \    }\n  private:\n    string passed;\n};\n```\n\n类 `student` 是自 `person` 的**派生**类。\n\
  \n![Derived class](img/06fig1.jpg)\n**图 6–1: 派生类**\n\n\n\n\n更正式的说法是：派生类是其基类的子类型（Sub-type），在任何需要基类的地方，其派生类都是接受的。\n\
  \n理解子类型和超类型的好方法是将其视为子集和超集。类模型了一个特定的集合，而该集合的子集由一个通过不变式（invariants）约束基类的子类来建模。我们的\
  \ `person` 类模型了各种人，而我们用 `person` 的子类来建模一组人。\n\n这种图示的悖论在于，派生类可能包含额外的成员变量，且可能对象的数量比其基类更多。这个悖论可以通过考虑适当的不变式来正确地建模子集来解决。例如，`student`\
  \ 类的不变式是不存在两个名字相同但成绩不同的对象。这将保证 `student` 集合的基数不大于 `person` 集合的基数。遗憾的是，上述不变式很难验证（即使对于那些具有自动不变式检查的语言也是如此），并且必须通过良好的程序逻辑隐式建立。\n\
  \n当我们从基类派生时，可以指定对继承自该类的成员的访问限制程度。在前面的示例中，我们是公共派生，以便所有继承的成员在基类和派生类中具有相同的访问权限。如果我们将一个类派生为\
  \ `protected`，则 `public` 基类成员在派生类中变为 `protected`，而其他成员保留其访问权限。私有派生类的成员全为 `private`（这种形式的继承在最近的\
  \ OOP 应用中并不经常使用）。当我们不指定如何访问基类时，在定义 `class` 时默认派生为 `private`，在定义 `struct` 时派生为 `public`。\n\
  \n### C++11 6.1.2 继承构造函数\n\n`⇒ c++11/inherit_constructor.cpp`\n\n与所有其他方法不同，构造函数不会从基类隐式继承。因此，以下程序无法编译：\n\
  \n```cpp\nclass person\n{\n  public:\n    explicit person(const string& name) :\
  \ name{name} {}\n    // ...\n};\n\nclass student\n  : public person\n{};       \
  \                  // 未定义针对 string 的构造函数\n\nint main ()\n{\n    student tom{\"Tom\
  \ Tomson\"}; // 错误：没有 string 构造函数\n}\n```\n\n`student` 类继承了 `person` 的所有方法，构造函数除外。C++11\
  \ 允许我们通过 `using` 从基类继承所有的构造函数：\n\n```cpp\nclass student\n  : public person\n{\n\
  \    using person :: person ;\n};\n```\n\n当两个类中存在具有相同签的构造函数时，优先选择派生类的。\n\n到目前为止，我们已经应用了上述四个基本原则中的三个：封装、继承和子类型。还有一个缺失的内容，我们现在引入。\n\
  \n### 6.1.3 虚函数和多态类\n\n`⇒ c++11/oop_virtual.cpp`\n\n面向对象编程的全部潜力只有通过 `virtual` 函数才能释放。它们从根本上改变了类的行为，导致了以下结果：\n\
  \n> **定义 6–1.（多态类型）。** 包含一个或多个 `virtual` 函数的类被称为 `多态类型`。\n\n我们继续之前的实现，仅对 `all_info()`\
  \ 方法添加 `virtual` 属性：\n\n```cpp\nclass person\n{\n    virtual void all_info () const\n\
  \    { cout ≪ \"My name is \" ≪ name ≪ endl; }\n    ...\n};\n\nclass student\n \
  \ : public person\n{\n    virtual void all_info () const {\n        person :: all_info\
  \ ();      // 调用 person 的 all_info ()\n        cout ≪ \"I passed the following grades:\
  \ \" ≪ passed ≪ endl;\n    }\n    ...\n};\n```\n\n我们见过的作为命名空间限定的双冒号（`::` (§3.2）同样可以限定我们调用方法的类。这当然要求该方法是可访问的：我们不能从另一个类调用\
  \ `private` 方法，即使是基类也不行。我们本可以在派生类中省略 `virtual`，因为当基类中相同签名的函数重载是 `virtual` 时，它会被隐式添加。然而，为了更好的可读性，我们倾向于在这些介绍性示例中写出它们。使用多态类打印信息会产生完全不同的结果：\n\
  \n```\n[person]  My name is Mark Markson\n[student]  My name is Tom Tomson\n   \
  \   I passed the following grades: Algebra , Analysis\n[person]  My name is Tom\
  \ Tomson\n[student]  My name is Tom Tomson\n      I passed the following grades:\
  \ Algebra , Analysis\n[person]  My name is Tom Tomson\n[student]  My name is Tom\
  \ Tomson\n      I passed the following grades: Algebra , Analysis\n[person]  My\
  \ name is Tom Tomson\n[student]  My name is Tom Tomson\n      I passed the following\
  \ grades: Algebra , Analysis\n[person]  My name is Tom Tomson\n[student]  My name\
  \ is Tom Tomson\n      I passed the following grades: Algebra , Analysis\n```\n\n\
  \n\n禁用了后期绑定，从而阻碍了从派生类调用`virtual` 函数。这是 OOP 中一个非常常见的（不仅如此）初学者错误，被称为“切片”（Slicing）。因此，我们必须遵守以下规则：\n\
  \n## 传递多态类型\n\n多态类型必须始终通过引用或（智能）指针传递！\n\n### 6.1.3.1 析构多态类\n\n多态类型的对象不仅可以通过基类引用，还可以通过基类指针进行存储：\n\
  \n```cpp\nperson* max= new student(\"Max Smith\", \"Numerics\");\n```\n\n当我们删除这个指针时，调用的是\
  \ `person` 的析构函数而不是 `student` 的析构函数，因此只有 `person` 的成员会被销毁。为了实现正确的析构，我们需要一个`virtual`析构函数：\n\
  \n```cpp\nclass person\n{\n    virtual ~person() {}\n};\n```\n\n当所有基类和成员都有适当的析构函数时，让编译器以`default`\
  \ 方式生成`virtual`析构函数就足够：\n\n```cpp\nvirtual ~person() = default;\n```\n\n无论哪种方式：\n\
  \n### 多态类型的析构函数\n\n每个多态类型都需要一个`virtual`析构函数。\n\n希望未来的 C++ 标准在用户省略析构函数时，能将所有多态类的析构函数声明为`virtual`。\n\
  \n### C++11 6.1.3.2 显式重写\n\n另一个让高级程序员偶尔也会掉进去的陷阱是重写方法的签名略有不同，如下：\n\n```cpp\nclass\
  \ person\n{\n    virtual void all_info() const { ... }\n};\n\nclass student\n  \
  \  : public person\n{\n    virtual void all_info() { ... }\n};\n\nint main ()\n\
  {\n    student tom(\"Tom Tomson\", \"Algebra, Analysis\");\n    person& pr= tom;\n\
  \    pr .all_info();\n}\n```\n\n在这个示例中，`pr.all_info()` 没有被后期绑定到 `student::all_info()`，因为签名不同。诚然，这种差异并不而易见，并引我们我们思考：方法的`const`\
  \ 限定符与签名到底有什么关系？我们可以认为成员函数带有一个隐式的隐藏参数，指向对象本身：\n\n```cpp\nvoid person :: all_info_impl\
  \ ( const person & me= * this ) { ... }\n```\n\n现在变得很了，方法的`const` 限定符修饰了 `person::all_info()`\
  \ 中的这个隐藏引用。`student::all_info()` 中对应的隐藏引用没有`const` 限定，且由于签名不同，该方法不被视为重写。编译器不会警告我们，只是将\
  \ `student::all_info()` 视为一个新的重载。你可以相信我们，当类很大且存储在不同的文件中时，这个微而恶劣的错误可以让你忙活一阵子。\n\n\
  C++11 我们可以使用 C++11 属性 `override` 轻松地保护自己避免这种麻烦：\n\n```cpp\nclass student\n    :\
  \ public person\n{\n    virtual void all_info() override { ... }\n};\n```\n\n在这里，程序员声明该函数重写了基类的某个`virtual`函数（具有完全相同的签名）。如果没有这样的函数，编译器将报错：\n\
  \n```\n...: error: 'all_info' marked 'override' but doesn't override\n         \
  \      any member functions\n    virtual void all_info () override {\n         \
  \         ^~~~~~~~~\n...: warning: 'student :: all_info' hides overloaded virtual\
  \ fct.\n...: note: hidden overloaded virtual function 'person :: all_info'\n   \
  \            declared here: different qualifiers (const vs none)\n    virtual void\
  \ all_info () const { ... }\n                  ^~~~~~~~~\n```\n\n在这里，我们也得到了来自 `clang++`\
  \ 的提示，说明限定符是不同的。对于非`virtual`函数使用 `override` 会导致产生不同的错误信息：\n\n```\n...: error: only\
  \ virtual member fct. can be marked 'override'\n    void all_info () override {\n\
  \                    ^~~~~~~~~\n```\n\n`override` 并没有为我们的软件增加令人兴奋的新功能，但它可以让我们免于枯燥地寻找笔误（键盘误）。建议在不需要向后兼容的情况下到处使用\
  \ `override`。这个词输入得很快（尤其是配有自动补全时），并且使我们的程序更可靠。它还向向其他程序员传达我们的意图，甚至在我们没有看代码几年后传达给我们自己。\n\
  \nC++11 的另一个新属性是 `final`。它声明一个`virtual` 成员函数不能被重写。这允许编译器将间接的 vtable 调用替换为直接函数调用，甚至当`final`\
  \ 函数被直接调用而非通过基类调用时对函数代码进行联。甚至整个类都可以被声明为`final` 以防止有人从中派生。\n\n相比之下，`override` 是关于父类的声明，而\
  \ `final` 指的是子类。\n\n### 6.1.3.3 函数调用机制\n\n当调用多态类中的函数时，有三种机制在起干扰作用：\n\n- 重载（Overloading）；\n\
  - 重写（Overriding）；\n- 名称隐藏（Name hiding）。\n\n我们已经分别展示了这些技术。现在它们被结合起来考虑。假设我们有派生类：\n\
  \n```cpp\nclass c1 { ... };\nclass c2 : public c1 { ... };\nclass c3 : public c2\
  \ { ... };\nclass c4 : public c3 { ... };\nclass c5 : public c4 { ... };\n```\n\n\
  并且对于 `c3` 的引用，我们调用：\n\n```cpp\nvoid call(c3& r)\n{\n    r.f(2);\n}\n```\n\n现在编译器将为\
  \ `double` 选取 `f` 的最佳匹配项，这些项来自 `c3` 中可见的 `f` 重载。如果 `f` 声明在 `c3` 中，则所有重载都是可见的。`c1`\
  \ 和 `c2` 中所有的 `f` 重载都被隐藏，除非有 `using c1::f` 或在 `c3` 中有 `using c2::f`。如果 `f` 未在 `c3`\
  \ 中声明，则 `c2` 的重载可见，而 `c1` 的被隐藏（除非在 `c2` 内部使用 `using c1::f`）。同样，如果 `c2` 和 `c3` 都没有声明名称\
  \ `f`，则 `c1` 的重载可见。\n\n给定方法 `f` 的可见重载集，在编译时选择参数类型 `double` 最特定的签名。如果选定的重载是`virtual`，则在运行时选择类型最派生的重写。例如，如果\
  \ `r` 指向 `c5` 对象，且 `f(double)` 在 `c4` 和 `c5` 中都被重写，则调用 `c5` 的重写。如果我们有 `c5` 的重写但没有\
  \ `c4` 的，且 `r` 指向 `c4` 对象，则我们调用 `c3` 的方法（或从其基继承的方法），因为 `c5` 的重写是不合法的。\n\n在实践中，情况通常不复杂，但我们应该意识到编译时和运行时混合选择。具有相同名称但签名不同的基类方法/运算符的隐藏是一个即使是经验丰富的程序员在遇到意外行为时也不会立即想到的细节。\n\
  \n### 6.1.3.4 抽象类\n\n\n\n\n\n到为止，我们只查看了在基类中定义 `virtual` 函数然后在派生类中对其扩展的示例。有时我们会发现自己处于这样的情况：有一组具有某些函数的类，我们需要一个公共超类来动态选择这些类。例如，在第\
  \ 6.4 节中，我们将引入相同接口的求解器：一个 `solve` 函数。为了在运行时选择它们，它们共享一个带有 `solve` 函数的超类。然而，并没有通用的\
  \ `solve` 算法可以让我们以后覆盖。为了这个目的，我们需要一个新功能来表示：“在这个类中有一个没有实现的 `virtual` 函数；这将在子类中后续实现。”\n\
  \n> **定义 6–3.（纯虚函数和抽象类）。** 当一个 `virtual` 函数被声明为 `= 0` 时，它就称为*纯虚函数*。包含纯虚函数的 `class`\
  \ 称为*抽象类*。\n\n`⇒ c++11/oop_abstract.cpp`\n\n具体来说，我们用抽象超类 `creature` 扩展了 `person`\
  \ 示例：\n\n```\nclass creature\n{\n  public:\n    virtual void all_info() const= 0;\
  \ // 纯虚\n    virtual ~creature() = default;\n};\n\nclass person\n  : public creature\n\
  { ... };\n\nint main ()\n{\n    creature some_beast; // 错误：抽象类\n    person mark(\"\
  Mark Markson\");\n    mark.all_info ();\n}\n```\n\n创建 `creature` 对象的操作失败，并显示如下消息：\n\
  \n```\n...: error: variable type 'creature' is an abstract class\n    creature some_beast;\n\
  ...: note: unimplemented pure method 'all_info' in 'creature'\n    virtual void\
  \ all_info () const= 0;\n```\n\n当我们 `override all_info` 使得 `person` 不包含任何纯 `virtual`\
  \ 函数时，对象 `mark` 的行为与之前一样。\n\n抽象类可以被视为接口：我们可以声明它们的引用和指针，但不能创建对象。注意，C++ 允许我们将纯虚函数和普通的\
  \ `virtual` 函数混合使用。只有当所有纯虚函数都被覆盖时，才能构建子类的对象^(2)。\n\n2。我们在此避免使用*实例化*（Instantiation）一词以避免混淆。该词在\
  \ Java 中用于表示从类构建对象（而某些作者甚至将对象称为特定的类）。在 C++ 中，实例化几乎总是指代从类/函数模板创建特定类/函数的过程。我们偶尔看到用“类实例化”一词来表示从类创建对象，但这并不是常用术语，我们避免使用它。\n\
  \n给 Java 程序员的旁记：在 Java 中，所有成员函数本质上都是 `virtual` 的（即方法不能是非虚的^(3)）。Java 提供了 `interface`\
  \ 语言特性，其中方法仅声明而不定义（除非它们具有 `default` 属性，允许允许实现）。这对应于仅包含纯 `virtual` 方法的 C++ 类。\n\n\
  3。然而，将它们声明为 `final` 可以让编译器移除延迟绑定的开销。\n\n大型项目通常建立多个层次的抽象：\n\n- 接口：无实现；\n- 抽象类：默认实现；以及\n\
  - 具体类。\n\n这有助于为复杂的类系统保持清晰的思维模型。\n\n### 6.1.4 通过继承实现函数对象\n\n在第 3.7 节中，我们讨论了函数对象，并提到它们也可以通过继承来实现。现在，我们履行承诺。首先，我们需要为所有函数对象实现一个公共基类：\n\
  \n```\nstruct functor_base\n{\n    virtual double operator () ( double x) const\
  \ = 0;\n    virtual ~functor_base () = default ;\n};\n```\n\n这个基类可以是抽象的，因为它只作为我们的接口使用，例如，将函数对象传递给\
  \ `finite_difference` 求值：\n\n```\ndouble finite_difference (functor_base const &\
  \ f,\n                          double x, double h)\n{\n  return (f(x+h) - f(x))\
  \ / h;\n}\n```\n\n显然，所有需要求分的函数对象都必须派自 `functor_base`，例如：\n\n```cpp\nclass para_sin_plus_cos\n\
  \  : public functor_base\n{\n  public:\n    para_sin_plus_cos(double p) : alpha{p}\
  \ {}\n    virtual double operator () (double x) const override\n    {\n      return\
  \ sin(alpha * x) + cos(x);\n    }\n  private:\n    double alpha;\n};\n```\n\n我们重新实现了\
  \ `para_sin_plus_cos`，以便我们可以用有限差分来近似 `sin(x)+ x` 的导数：\n\n```\npara_sin_plus_cos\
  \ sin_1{1.0};\ncout << finite_difference(sin_1, 0.001) << endl;\ndouble df= finite_difference(para_sin_plus_cos{.},\
  \ 0.001);\n```\n\n面向对象的方法还允许我们实现带有状态的函数。如果我们愿意，也可以将有限差分实现为 OOP 函数对象并以泛型对象的方式进行组合。OOP\
  \ 方法的缺点是：\n\n- 性能：`operator()` 总是作为 `virtual` 被调用的。\n- 适用性：派自 `functor_base` 的类才能作为参数\
  \ 3.7。因此，函数对象应尽可能通过泛型方法 3.7](#ch03.xhtml_sec_7)。只有在运行时选择函数时继承才有收益。\n\n### 6.1.5\
  \ 派生异常类\n\n`⇒ c++03/exception_example.cpp`\n\n在第 1.6.2 节中我们引入了异常，并提到任何类型都可以被抛出。这样做通常是好主意。拥有专门的类会让处理变得容易得多。我们可以进一步创建一个异常层次结构。例如，我们为通用的\
  \ I/O 错误创建一个类，为特定的文件问题创建一个类。高质量软件派自 `std::exception`（在 `<exception>` 中）或类似 `runtime_error`\
  \ 的子类：\n\n```cpp\n#include <exception>\nstruct io_error\n  : std::runtime_error\n\
  {\n  io_error ( const string & message = \"I/O error \")\n    : std::runtime_error\
  \ ( message ) {}\n};\n\nstruct cannot_open_file\n  : io_error\n{\n  cannot_open_file(const\
  \ string& fname)\n    : io_error(\"File '\" + fname + \"' not found\") {}\n};\n\
  ```\n\n所有的异常都派自 `std::exception` 为我们的用户提供了处理意外行为的备选方案。该类有一个 `virtual` 方法 `what`\
  \ 用于返回错误信息的 `string`。`std::runtime_error` 在构造函数中设置了这个 `string`。\n\n异常应通过引用捕获以避免切片。当我们有多个\
  \ catch 时，每个类型应该出现在其基类之前，因为无论后续是否有特定的，都会进入第一个匹配的子句。示例中的 `catch` 块对于给这种情况显然有些夸张，但它给出了如何处理不同程度异常的印象：\n\
  \n```cpp\nbool keep_trying= true;\ndo {\n    string fname;\n    cout << \"Please\
  \ enter file name: \";\n    cin >> fname;\n    try {\n        A= read_matrix_file(fname\
  \ );\n        keep_trying= false;\n    } catch (cannot_open_file& e) {\n      cout\
  \ << \"Could not open the file. \" << \"Try another one!\\n\";\n    } catch (io_error&\
  \ e) {\n      cerr << \"Unexpected I/O error. Fix it!\\n\"; throw ;\n    } catch\
  \ (std::runtime_error& e) {\n      cerr << \"Unknown run-time error: \" << e.what\
  \ () << \"\\n\"; throw;\n    } catch (std::exception& e) {\n      cerr << \" Unknown\
  \ standard exception:\" << e.what () << \"\\n\"; throw;\n    } catch (...) {\n \
  \     cerr << \"Unknown exception caught. \" << \"I call it a day.\\n\"; throw;\n\
  \    }\n} while (keep_trying );\n```\n\n\n\n\n正如你所见，当捕获到关于文件打开的异常时，我们会继续重试。在其他子中，我们提供了可用信息并重新抛出异常（该异常不太可能在外部被捕获）。\n\
  \n## 6.2 消除冗余\n\n通过继承和隐式向上转换，我们可以避免实现冗余的成员函数和自由函数。类隐式转换为父类，这一事实允许我们实现一次公共功能并在所有派生类中重用。假设我们有几个矩阵类（稠密、压缩、带状、三角形等），它们共享诸如\
  \ `num_rows` 和 `num_cols` 等成员函数。这些函数可以很容易地提取到一个通用的父类中——包括相应的数据成员。所使用的术语来自 MTL4。\n\
  \n```cpp\nclass base_matrix\n{\n  public:\n    base_matrix(size_t nr, size_t nc)\
  \ : nr{nr}, nc{nc} {}\n    size_t num_rows() const { return nr; }\n    size_t num_cols\
  \ () const { return nc; }\n  private:\n    size_t nr, nc;\n};\n\nclass dense_matrix\n\
  \  : public base_matrix\n{ ... };\n\nclass compressed_matrix\n    : public base_matrix\n\
  { ... };\n\nclass banded_matrix\n  : public base_matrix\n{ ... };\n\n...\n```\n\n\
  现在所有的矩阵类型都通过继承提供了来自 `base_matrix` 的成员函数。将公共实现放在一个地方不仅节省了打字量，还确保了修改可以同时应用于所有相关类。这在这个玩具示例中并不是问题（尤其是因为本身没什么什么要修改的），但在大型项目中，保持所有冗余代码片段的一致将变得非常费力。自由函数可以用同样的方式重用，例如：\n\
  \n```cpp\ninline size_t num_rows(const base_matrix & A)\n{\n      return A.num_rows();\
  \ }\n\ninline size_t num_cols(const base_matrix & A)\n{\n      return A.num_cols();\
  \ }\n\ninline size_t size(const base_matrix & A)\n{\n      return A.num_rows() *\
  \ A.num_cols(); }\n```\n\n得益于隐式向上转换，这些自由函数可以用于所有派生自 `base_matrix` 的矩阵。这种形式的公共基类功能没有运行时开销。\n\
  \n我们还可以把自由函数参数的隐式向上转换视为更通用概念的一个特例：*is-a*（是一个）关系；例如，`compressed_matrix` *是一个* `base_matrix`，我们可以将\
  \ `compressed_matrix` 值传递给任何期望 `base_matrix` 的函数。\n\n## 6.3 多重继承\n\nC++ 提供了多重继承，我们现在通过一些示例来说说明。\n\
  \n### 6.3.1 多父类\n\n`⇒ c++11/oop_multi0.cpp`\n\n一个类可以派生自多个父类。为了更具形象性的描述以及为了不那么笨拙地讨论基类的基类，我们偶尔使用“父母”（parents）和“祖父母”（grandparents）这些术语，它们是直观理解的。当有两个父母时，类层次看起来像一个\
  \ V 字（当有很多个时像一花束）。子类的成员是所有父类成员的并集。这带来了歧义的风险：\n\n```cpp\nclass student\n{\n    virtual\
  \ void all_info () const {\n        cout << \"[ student ] My name is \" << name\
  \ << endl ;\n        cout << \"      I passed the following grades : \" << passed\
  \ << endl ;\n    }\n    ...\n};\n\nclass mathematician\n{\n    virtual void all_info\
  \ () const {\n        cout << \"[ mathman ] My name is \" << name << endl ;\n  \
  \      cout << \" I proved : \" << proved << endl ;\n    }\n    ...\n};\n\nclass\
  \ math_student\n  : public student , public mathematician\n{\n    // all_info 未定义\
  \ -> 歧义继承\n};\n\nint main ()\n{\n    math_student bob{\"Robert Robson\", \"Algebra\"\
  , \"Fermat's Last Theorem \"};\n    bob.all_info(); // 错误：歧义\n    bob.student::\
  \ all_info();\n}\n```\n\n`math_student` 从 `student` 和 `mathematician` 继承了 `all_info`，且对于其中一个或另一个没有优先级之分。要为\
  \ `bob` 调用该方法，我们必须指定从哪个基类中获取该方法。\n\n这种歧义允许我们说明一个应该注意的 C++ 微细之处。`public`、`protected`\
  \ 和 `private` 修改的是可访问性，而不是可见性。当我们尝试通过以 `private` 或 `protected` 继承一个或多个父类来消除成员函数的歧义时，这一点变得异常清晰：\n\
  \n```cpp\nclass student { ... };\nclass mathematician { ... };\nclass math_student\n\
  \  : public student, private mathematician\n{ ... };\n```\n\n现在，`student` 的方法是 `public`\
  \ 的，而 `mathematician` 的方法是 `private` 的。当调用 `math_student::all_info` 时，我们希望看到 `student::all_info`\
  \ 的输出。`mathematician` 的方法实际上不可访问，但它们仍然在那里并导致歧义。我们甚至可能会看到第二个错误，即 `mathematician::all_info`\
  \ 是不可访问的。\n\n### 6.3.2 公共祖父母\n\n多个基类共享基类的情况并不罕见。在上一节中，`mathematician` 和 `student`\
  \ 没有父类。从之前的章节来看，将它们都派生自 `person` 会更自然。描述这种配置在图 6–2 中构建了一个菱形。\n\n**图 6–2：菱形层次结构**\n\
  \n#### 6.3.2.1 冗余与歧义\n\n`⇒ c++11/oop_multi1.cpp`\n\n首先，我们用直接的方式实现类：\n\n```cpp\n\
  class person { ... };\nclass student { ... };\nclass mathematician\n  : public person\n\
  {\n  public:\n    mathematician(const string& name, const string& proved)\n    \
  \  : person{name}, proved{proved} {}\n    virtual void all_info () const {\n   \
  \   person :: all_info ();\n      cout << \"  proved: \" << proved << endl;\n  \
  \  }\n  private:\n    string proved;\n};\n\nclass math_student\n  : public student\
  \ , public mathematician\n{\n  public:\n    math_student(const string& name, const\
  \ string& passed, const string & proved)\n      : student(name , passed), mathematician(name\
  \ , proved) {}\n    virtual void all_info () const override {\n      student ::\
  \ all_info ();\n      mathematician :: all_info ();\n    }\n};\n\nint main ()\n\
  {\n    math_student bob{\"Robert Robson\", \"Algebra\", \"Fermat's Last Theorem\"\
  };\n    bob.all_info ();\n}\n```\n\n程序运行正常，除了冗余的名字信息外：\n\n```\n[student] My name\
  \ is Robert Robson\n  I passed the following grades: Algebra\n[person] My name is\
  \ Robert Robson\n  proved: Fermat's Last Theorem\n```\n\n你作为读者现在有两个选择：接受这种不利的方法并继续阅读，或者跳转到练习\
  \ 6.7.1 并尝试解决它。\n\n由于派生了两次 `person`，这段代码是\n\n- **冗余的**：`name` 被存储了两次，如图 6–3。\n-\
  \ **容易出错**：两个 `name` 值可能不一致。\n- **歧义**：在 `math_student` 中访问 `person::name` 时（如果它不是\
  \ `private` 的）。\n\n`⇒ c++11/oop_multi2.cpp`\n\n为了说明上述歧义，我们在 `math_student` 中调用了\
  \ `person::all_info`：\n\n```cpp\nclass math_student : ...\n{\n    virtual void all_info()\
  \ const override {\n      person:: all_info();\n    }\n};\n```\n\n这会导致以下（重新格式化的）投诉：\n\
  \n```cpp\n... : error: ambiguous conversion from derived class\n      'const math_student'\
  \ to base class 'person':\n    class math_student -> class student -> class person\n\
  \    class math_student -> class mathematician -> class person\n      person:: all_info();\n\
  ```\n\n**图 6–3：`math_student` 的内存布局**\n\n使用 clang++ 时。我们当然会在通过多路径继承的父类的每个函数或数据成员上遇到相同的问题。\n\
  \n### 6.3.2.2 虚基基类\n\n`⇒ c++11/oop_multi3.cpp`\n\n\n\n\n`Virtual Base Classes`（虚基类）允许我们仅在公共超类中存储一次成员，从而帮助解决相关问题。然而，这对内部实现有基本的理解，以免引入新问题。在下面的示例中，我们仅将\
  \ `person` 标记为 `virtual` 虚基类：\n\n```cpp\nclass person { ... };\n\nclass student\n\
  \  : public virtual person\n{ ... };\n\nclass mathematician\n  : public virtual\
  \ person\n{ ... };\n\nclass math_student\n  : public student , public mathematician\n\
  {\n  public:\n    math_student(const string& name, const string& passed,\n     \
  \            const string& proved)\n    : student{name , passed}, mathematician{name\
  \ , proved} {}\n  ...\n};\n```\n\n并得到以下令我们一些人感到惊讶的输出：\n\n```\n[student] My name\
  \ is\n      I passed the following grades: Algebra\n      I proved: Fermat's Last\
  \ Theorem\n```\n\n尽管 `student` 和 `mathematician` 都调用了初始化 `name` 的 `person` 构造函数，但仍然丢失了\
  \ `name` 的值。为了理解这种行为，我们需要了解 C++ 如何处理 `virtual` 虚基类。我们知道调用基类构造函数是派生类的责任（否则编译器将生成对默认构造函数的调用）。然而，我们只有一个\
  \ `person` 基类的副本。图 6–4 展示了新的内存布局：`mathematician` 和 `student` 不再包含 `person` 数据，而是仅引用作为最底层派生类一部分公共对象：`math_student`。\n\
  \n![Images](img/06fig04.jpg)\n\n图 6–4：使用 `virtual` 虚基类的 `math_student` 内存\n\n在创建\
  \ `student` 对象时，它的构造函数必须调用 `person` 构造函数。同样，当我们创建一个 `mathematician` 对象时，它的构造函数也会调用\
  \ `person` 构造函数。现在我们创建一个 `math_student` 对象。`math_student` 构造函数必须调用 `mathematician`\
  \ 和 `student` 的构造函数。但我们知道这些构造函数都应该调用 `person` 构造函数，导致共享的 `person` 部分被构造两次。\n\n为了防止这种情况，规定在\
  \ `virtual` 虚基类的情况下，由“最派生类”（Most Derived Class，在我们的例子中：`math_student`）负责调用共享的基类构造函数（在我们的例子中：`person`）。作为回报，当从派生类间接调用\
  \ `mathematician` 和 `student` 中的 `person` 构造函数时会被禁用。\n\n`⇒ c++11/oop_multi4.cpp`\n\
  \n基于此，我们相应地修改了构造函数：\n\n```cpp\nclass student\n  : public virtual person\n{\n  protected:\n\
  \    student(const string& passed) : passed{passed} {}\n    void my_info() const\
  \ { ... }\n  ...\n};\n\nclass mathematician\n  : public virtual person\n{\n  protected:\n\
  \    mathematician(const string& proved) : proved{proved} {}\n    void my_info()\
  \ const { ... }\n  ...\n};\n\nclass math_student\n  : public student, public mathematician\n\
  {\n  public:\n    math_student(const string& name, const string& passed, const string&\n\
  \      proved) : person{name}, student{passed}, mathematician{proved} {}\n    virtual\
  \ void all_info() const override {\n        student:: all_info();\n        mathematician::my_info();\n\
  \    }\n};\n```\n\n现在，`math_student` 显式初始化 `person` 以在其中设置 `name`。两个中间类 `student`\
  \ 和 `mathematician` 被重构，以区分包含性和排他性的成员处理：\n\n- 包含性处理整合了来自 `person` 的方法：两个参数的构造函数和\
  \ `all_info`。这些方法是 `public` 的，且（主要）用于 `student` 和 `mathematician` 对象。\n- 排他性处理仅处理类本身的成员：单参数构造函数和\
  \ `my_info`。这些方法是 `protected` 的，因此仅在子类中可用。\n\n示例显示所有三个访问修饰符都是需要的：\n\n- `private:`：用于仅在类内部访问的数据成员和方法；\n\
  - `protected:`：用于子类需要的方法，但这些方法不属于子类公共接口的一部分；以及\n- `public:`：用于允许在不了解内部细节的情况下操作该类对象的方法。\n\
  \n在奠定 OOP 技术基础之后，我们现在将在科学背景下应用它们。\n\n### 6.4 基于子类型的动态选择\n\n`⇒ c++11/oop_multi4.cpp`\n\
  \n动态选择可以通过类似下面的 `switch` 来实现：\n\n```cpp\n#include <iostream>\n#include <cstdlib>\n\
  \nclass matrix;\nclass vector;\n\nint main (int argc, char* argv[])\n{\n  matrix\
  \ A;\n  vector b, x;\n  int solver_choice = argc >= 2 ? std::atoi(argv[1]) : 0;\n\
  \n  switch (solver_choice) {\n    case 0: cg(A, b); break;\n    case 1: bicg(A,\
  \ b); break;\n  }\n}\n```\n\n这种方法可行，但在复杂性方面缺乏扩展性。当我们添加新的求解器或预处理器时，需要在多个地方扩展此 `switch`\
  \ 块。\n\n求解器和预处理器的的一种优雅解决方案是使用抽象类和派生类：\n\n```cpp\nstruct solver\n{\n  virtual void\
  \ operator()( ) = 0;\n  virtual ~solver() {}\n};\n\nstruct cg_solver : solver\n\
  {\n  virtual void operator()(matrix& A, vector& b) override { cg(A, b); }\n};\n\n\
  struct bicg_solver : solver\n{\n  virtual void operator()(matrix& A, vector& b)\
  \ override { bicg(A, b); }\n};\n```\n\nC++11 在我们的应用程序中，可以定义一个类型为 `solver` 的（智能）指针并赋值给所需的求解器：\n\
  \n```cpp\nunique_ptr<solver> my_solver;\nswitch (solver_choice) {\n  case 0: my_solver\
  \ = unique_ptr<cg_solver>(new cg_solver()); break;\n  case 1: my_solver = unique_ptr<bicg_solver>(new\
  \ bicg_solver()); break;\n}\n```\n\nC++14 `unique_ptr` 的构造有些繁琐。C++14 引入了便利函数 `make_unique`，使得这种情况变得更加方便：\n\
  \n```cpp\nunique_ptr<solver> my_solver;\nswitch (solver_choice) {\n  case 0: my_solver\
  \ = make_unique<cg_solver>(); break;\n  case 1: my_solver = make_unique<bicg_solver>();\
  \ break;\n}\n```\n\n按照练习 3.12.14 的建议实现你自己的 `make_unique` 是一个很好的练习。一旦我们的多态指针初始化，调用我们动态选择的求解器非常简单：\n\
  \n```cpp\n(*my_solver)(A, b);\n```\n\n\n\n\n当动态选择多个函数时，抽象基类的完整表达能力就变得显而易见。这时，我们就可以避免之前所示的组合爆炸。多态函数指针允许我们解耦相应的选择，并将任务分解为一系列工厂和一个带有指针的单次调用：\n\
  \n```\nstruct pc\n\n{\n    virtual void operator()( ... )= 0;\n    virtual ~pc()\
  \ {}\n};\n\nstruct solver { ... };\n\n// 求解器工厂\n// 左预处理器工厂\n// 右预处理器工厂\n\n(*my_solver)(A,\
  \ b, x, *left, *right);\n``````\n\n现在，工厂的代码复杂度是线性的，且函数调用只需要一条语句，而不是在巨大的选择块中具有立方级的复杂度。\n\
  \n在我们的示例中，我们实现了一个公共超类。我们也可以使用 `std::function` 处理没有公共基类的求解器类和函数。这允许我们实现更通用的工厂。尽管如此，它仍然基于相同的技术：`virtual`\
  \ 函数和指向多态类的指针。在 C++03 中向后兼容的替代方案是 `boost::function`。\n\nC++11 禁止使用 `virtual` 模板函数（它们会使编译器的实现变得复杂：可能出现无限的虚表）。然而，类模板可以包含\
  \ `virtual` 函数。这通过对整个类进行类型参数化而不是对单个方法进行参数化，实现了带有 `virtual` 函数的泛型编程。\n\n## 6.5 转换\n\
  \n转换是一个 OOP 特有的主题，但在引入基类和派生类之前无法对其进行全面讨论。反之，观察相关类之间的转换可以巩固对继承的理解。\n\nC++ 是一种强类型语言。每个对象的类型在编译时定义，在执行期间不能更改。我们可以将对象认为是：\n\
  \n* 内存中的位，以及\n* 一个赋予这些位意义的类型。\n\n对于某些转换，编译器只是以不同的方式看待内存中的位：要么对位进行另一种解释，要么具有其他的访问权限（例如，`const`\
  \ 与非 `const`）。其他转换实际上创建了新对象。\n\n在 C++ 中，有四种基本的转换运算符：\n\n* `static_cast`\n* `dynamic_cast`\n\
  * `const_cast`\n* `reinterpret_cast`\n\nC 作为其语言根源只知道一种转换运算符：`(type) expr`。这个单一运算符很难理解，因为它可以触发一系列转换以创建目标类型的对象：例如，将\
  \ `const int` 指针转换为非 `const` 的 `char` 指针。\n\n相比之下，C++ 转换每次只改变类型的一个方面。C 风格转换的另一个缺点是它们在代码中很难找到（参见\
  \ [66, 第 95 章]），而 C++ 转换很容易发现：只需搜索 `_cast` 即可。C++ 仍然允许这种旧式转换，但所有 C++ 专家都同意不要使用它。\n\
  \n### C 转换\n\n不要使用 C 风格转换。在本节中，我们将展示不同的转换运算符，并讨论它们在不同上下文下的优缺点。\n\n### 6.5.1 基类与派生类之间的转换\n\
  \nC++ 提供了层级结构中类之间的静态和动态转换。\n\n#### 6.5.1.1 向上转换\n\n`⇒ c++03/up_down_cast_example.cpp`\n\
  \n向上转换，即从派生类到基类的转换，总是可能的，只要没有歧义。它甚至可以隐式地执行，就像我们在 `spy_on` 函数中做的那样：\n\n```\nvoid\
  \ spy_on(const person& p);\n\nspy_on(tom);                   // 向上转换 student ->\
  \ person\n```\n\n`spy_on` 接受 `person` 的所有子类，不需要显式转换。因此，我们可以将 `student tom` 作为参数传递。为了讨论菱形层级结构中类之间的转换，为了简便，我们引入了一些单字母类名：\n\
  \n```\nstruct A\n{\n    virtual void f(){}\n    virtual ~A(){}\n    int ma;\n};\n\
  \nstruct B : A { float mb; int fb() { return 3; } };\nstruct C : A {};\n\nstruct\
  \ D : B, C {};\n```\n\n我们添加了以下一元函数：\n\n```\nvoid f(A a)  { /* ... */ } // 非多态 ->\
  \ 切片赋值！\nvoid g(A& a) { /* ... */ }\nvoid h(A* a) { /* ... */ }\n```\n\n类型为 `B`的对象可以传递给所有三个函数：\n\
  \n```\nB b;\n\nf(b);   // 切片了！\ng(b);\nh(&b);\n```\n\n在所有三种情况下，对象 `b` 都被隐式转换为类型为\
  \ `A`的对象。然而，函数 `f` 不是多态的，因为它切片了对象 `b`（参见 §6.1.3）。向上转换只有在基类存在歧义时才会失败。在当前示例中，我们从 `D`\
  \ 向上转换到 `A`：\n\n```\nD d;\n\nA ad(d); // 错误：歧义\n```\n\n因为编译器不知道基类 `A` 是来自 `B` 还是来自\
  \ `C`。\n\n#### 6.5.1.2 向下转换\n\n向下转换是将指针/引用子类型。当实际引用不是子类型时，行为是未定义的。因此，我们要么测试向下转换是否正确，要么通过运行时来确定。\n\
  \n```\nvoid g(A& a) { ... }\nvoid h(A* a) { ... }\n\nB b;\n\ng(b);\nh(&b);\n```\n\
  \n在 `g` 和 `h` 中，我们无法访问 `B` 的成员（例如 `fb()`），尽管 `b` 的类型是 `B`。在我们引入向下转换之前，我们应该问自己：\n\
  \n* 如何确保参数是派生类？\n* 如果对象不能向下转换，该怎么办？\n* 我们不是应该为派生类写一个函数吗？\n* 我们为什么不为基类重载函数？\n* 最后，我们能否重新设计类，以便可以使用\
  \ `virtual` 函数完成任务？\n\n如果在回答了这些问题后，我们仍然认为需要向下转换，则必须决定使用哪种转换。有两种形式：\n\n* `static_cast`，快速但不安全；\n\
  * `dynamic_cast`，安全但开销大，且仅适用于多态类型。\n\n正如名称所示，`static_cast` 只检查编译时信息。这意味着在向下转换的上下文中检查目标类型是否源自源类型。例如，我们可以将\
  \ `a`——函数 `g` 的参数——转换为 `B&`，然后调用 `B` 的方法：\n\n```\nvoid g(A& a)\n{\n    B& bref=\
  \ static_cast<B&>(a);\n    std::cout << \"fb returns \" << bref.fb() << \"\\n\"\
  ;\n}\n```\n\n编译器验证 `B` 是 `A` 的子类并接受我们的实现。当参数 `a` 指向的对象不是 `B` 类型（或其子类型）时，程序行为是未定义的。在我们的菱形示例中，我们也可以将指针从\
  \ `B` 向下转换到 `D`。为此，我们声明了类型为 `B*` 的指针，允许它们指向子类 `D` 的对象：\n\n```\nB *bbp= new B, *bdp=\
  \ new D;\n```\n\n编译器接受这两个指针到 `D*` 的向下转换：\n\n```\nD* dbp= static_cast<D*>(bbp); //\
  \ 错误的向下转换未检测到\n\nD* ddp= static_cast<D*>(bdp); // 正确的向下转换（未检查）\n```\n\n\n\n由于没有进行运行时检查，作为程序员，我们有责任只引用正确类型的对象。`bbp`\
  \ 指向一个类型为 `B` 的对象，当我们引用指针 `dbp` 时，我们面临着数据损坏和程序崩溃的风险。在这个较小的示例中，智能编译器可能会通过静态分析检测出错误的向下转换并发出警告。通常情况下，并不总是能追溯指针引用的实际类型，特别是当该类型可以在运行时选择时：\n\
  \n```\nB* bxp= (argc > 1) ? new B : new D;\n```\n\n在第 6.6.1 节中，我们将看到静态向下转换的一个有趣应用，这种转换是安全的，因为类型信息作为模板参数提供的。\n\
  \n`dynamic_cast` 执行运行时测试，检查实际转换的对象是否具有目标类型或其子类型。它只能应用于多态类型（定义或继承了一个或多个 `virtual`\
  \ 虚函数的类，§6.1）：\n\n```\nD* dbp= dynamic_cast<D*>(bbp); // 错误：无法向下转换到 D\n\nD* ddp=\
  \ dynamic_cast<D*>(bdp); // 好的：bdp 指向一个 D 对象\n```\n\n当无法执行转换时，会返回空指针，以便程序员最终对向下转换失败做出反应。引用的错误向下转换会抛出\
  \ `std::bad_cast` 类型的异常，并可以在 `try-catch` 中进行处理。这些检查是通过*运行时类型信息*（RTTI）实现的，并需要一些额外的时间。\n\
  \n**高级背景信息：** `dynamic_cast` 在底层被实现为 `virtual` 函数。因此，它只有在用户通过定义至少一个 `virtual` 函数使类变为多态时才可用。否则，所有类都将承担虚函数表（vtable）的代价。多态类本身就拥有这种表，因此\
  \ `dynamic_cast` 的代价只是虚函数表中一个额外的指针。\n\n### 6.5.1.3 交叉转换 (Cross-Casting)\n\n`dynamic_cast`\
  \ 的一个有趣特性是在引用的对象类型是两个类型的派生类时，从 `B` 到 `C` 的交叉转换：\n\n```\nC* cdp= dynamic_cast<C*>(bdp);\
  \ // 好的：B -> C，带有 D 对象\n```\n\n同样，我们也可以从 `student` 到 `mathematician` 进行交叉转换。从 `B`\
  \ 到 `C` 的静态交叉转换：\n\n```\ncdp= static_cast<C*>(bdp);   // 错误：既不是子类也不是父类\n```\n\n\
  这是不允许的，因为 `C` 既不是 `B` 的基类也不是派生类。它可以间接转换：\n\n```\ncdp= static_cast<C* >(static_cast<D*\
  \ >(bdp)); // B -> D -> C\n```\n\n在这里，确定所处理的对象是否真的可以这样转换仍然程序员的责任。\n\n### 6.5.1.4\
  \ 静态转换与动态转换\n\n由于需要对引用对象的类型进行运行时检查，动态转换比静态转换更但更慢。静态转换允许向上和向下转换，由程序员负责确保引用对象被正确处理。表\
  \ 6–1 总结了这两种转换形式之间的区别。\n\n**表 6–1：静态转换与动态转换**\n\n![Images](img/06tab01.jpg)\n\n\
  ### 6.5.2 常量转换 (Const-Cast)\n\n`const_cast` 添加或移除 `const` 和/或 `volatile` 属性。`volatile`\
  \ 关键字告知编译器变量可以从其他地方修改。例如，某些内存条目是由运行我们 C++ 程序的处理器以外的硬件设置的，为这些硬件编写驱动程序时必须意识到这一点。这些内存条目不能缓存或保存在寄存器中，必须每次从主内存读取。在科学和高级工程软件中，外部修改的变量非常稀少，因此我们不再在书中进一步讨论\
  \ `volatile`。\n\n`const` 和 `volatile` 都可以被隐式地添加。移除一个确实是 `volatile` 的对象的 `volatile`\
  \ 属性会导致未定义行为，因为缓存和寄存器中可能存在不一致的值。相反，只有当指针或引用指向非 `volatile` 对象时，才能从 `volatile` 修饰的指针和引用中移除\
  \ `volatile` 属性。\n\n移除 `const` 属性会导致调用栈上所有对应的 `const` 限定符失效，从而在数据被意外覆盖时极大地增加了调试工作。遗憾的是，在处理通常缺少适当\
  \ `const` 限定符的旧式库时，有时这样做是必要的。\n\n### 6.5.3 重新解释转换 (Reinterpretation Cast)\n\n这是转换的最激进的类型，在书中未被使用。它获取对象的内存位置，并将其位解释为该对象具有另一种类型。这允许我们，例如，通过将其转换为位链（bit\
  \ chain）来更改浮点数中的单个位。`reinterpret_cast` 对于编写硬件驱动程序来说比对于高级通量求解器更重要。不用说，它是破坏应用程序可移植性的最高效之一。如果你真的必须使用它，请将其包含在依赖平台的条件编译中，并过度测试你的代码。\n\
  \n### 6.5.4 函数风格转换 (Function-Style Conversion)\n\n构造函数可以被用于转换值：如果类型 `T` 拥有一个针对该值的构造函数。\n\
  \nC++11 函数风格表示法的危险在于，它的行为类似于具有内建目标类型的 C 转换，例如：\n\n```\nlong(x);   // 相当于\n\n(long)\
  \ x;\n```\n\n这允许我们编写像如下的恶性代码：\n\n```\ndouble d= 3.0;\n\ndouble const* const dp=\
  \ &d;\n\nlong l= long(dp);   // 噢！！！结果全乱了！\n```\n\n在这里我们将一个指向 `const double` 的 `const`\
  \ 指针转换成了 `long`！尽管我们似乎请求创建一个新值，但执行了 `const_cast` 和 `reinterpret_cast`。不用说，`l` 的值毫无意义，依赖于它的值也是如此。较新的编译器可能会给出一个警告。注意以下初始化：\n\
  \n```\nlong l(dp);   // 错误：无法用指针初始化 long\n```\n\n大括号初始化也不行：\n\n```\nlong l{dp};\
  \   // 同样的错误 (C++11)\n```\n\n这引导我们使用了另一种表示法：\n\n```\nl= long{dp};   // 错误：初始化失败\
  \ (C++11)\n```\n\n使用大括号，我们总是初始化一个新的值，甚至防止了收窄。`static_cast` 允许收窄，但也拒绝从指针到数字的转换：\n\
  \n```\nl= static_cast<long>(dp); // 错误：指针 -> long\n```\n\n\n\n\n基于这些原因，Bjarne Stroustrup\
  \ 建议使用 `T{u}` 进行良好的构造，并使用如 `static_cast` 类的命名类型转换进行其他转换。\n\n### 6.5.5 隐式转换\n\n隐式转换的规则并不简单。好消息是，大多数时候，我们只需要了解最重要的规则就能应付了，而且通常不需要关心它们的优先级。例如，完整的列表可以在“C++\
  \ 参考手册” [33] 中找到。表 6–2 提供了重要转换的概述。\n\n**表 6–2：隐式转换**\n\n![Images](img/06tab02.jpg)\n\
  \n数值类型可以通过不同的方式进行转换。首先，整数类型可以进行提升，即通过 `0s` 或符号位进行扩展.^(5)。此外，当需要匹配函数参数类型时，每个内建数值类型都可以转换为其他数值类型。\n\
  \n5。从语言法的纯粹意义上说，提升并不是一种转换。对于 C++11 中的新初始化技术，只允许不丢失精度的转换步骤（即不允许收缩转换）。如果没有收缩规则，即使是浮点数和\
  \ `bool` 之间的转换也可以通过中间转换为 `int` 来允许。对于所有可以用函数形式表示的用户类型（§6.5.4)）之间的转换，如果启用构造函数或转换运算符没有声明为\
  \ `explicit`，则也会隐式执行。不言而喻，隐式转换的使用不应过度，我们可以通过 `explicit` 构造函数和转换运算符来控制自己类的这种行为。哪种转换应该显式表示、在何时可以依赖隐式规则，是一个重要的设计决策，目前没有通用的规则。\n\
  \n## 6.6 高级技术\n\n### 6.6.1 CRTP\n\n本节描述了*奇异递归模板模式*（CRTP）。它将模板编程与继承非常高效地结合在一起。该术有时会与基于\
  \ `CRTP` 并由 John Barton 和 Lee Nackman 引入的 *Barton-Nackman Trick* 混淆 [6]。\n\n#####\
  \ 6.6.1.1 简单示例\n\n`⇒ c++03/crtp_simple_example.cpp`\n\n我们将通过一个简单的示例来解释这种新技术。假设我们有一个名为\
  \ `point` 的类，包含一个相等运算符：\n\n```cpp\nclass point\n{\n  public:\n    point(int x, int\
  \ y) : x(x), y(y) {}\n    bool operator== (const point& that) const\n    { return\
  \ x == that.x && y == that.y; }\n  private:\n    int x, y;\n};\n```\n\n我们可以通过常识或应用德·摩根定律来编写不等运算符：\n\
  \n```cpp\nbool operator!= (const point& that) const\n{ return x != that.x || y !=\
  \ that.y; }\n```\n\n或者我们可以简化操作，直接对相等运算符的结果进行取反：\n\n```cpp\nbool operator!==(const\
  \ point& that) const\n{ return !(*this == that);}\n```\n\n我们的编译器是非常智能的，在内联后完全可以完美地处理德·摩根定律。这种对相等运算符取反的方法是对每个类型（带有相等运算符的类型）不等运算符的正确实现。我们可以复制粘贴这段代码段，每次替换参数的类型即可。或者，我们可以写这样一个类：\n\
  \n```cpp\ntemplate <typename T>\nstruct inequality\n{\n    bool operator!=(const\
  \ T& that) const\n    { return !(static_cast<const T&>(*this) == that); }\n};\n\
  ```\n\n并从其派生：\n\n```cpp\nclass point : public inequality<point> { ... };\n```\n\n\
  这个类定义建立了一个相互依赖的关系：\n\n- `point` 派自 `inequality`\n- `inequality` 使用 `point` 进行参数化\n\
  \n这些类尽管存在相互依赖，也可以被编译，因为模板类（如 `inequality`）的成员函数在实例化之前（通常是在调用时）是不编译的。我们可以检查 `operator!=`\
  \ 是否工作：\n\n```cpp\npoint p1(3, 4), p2(3, 5);\ncout << \" p1!=p2 is \" << boolalpha\
  \ << (p1 != p2 ) << '\\n';\n```\n\n但当我们调用 `p1 != p2` 时到底发生了什么？\n\n1. 编译器在类 `point`\
  \ 中查找 `operator!=` → 未找到。\n2. 编译器在基类 `inequality<point>` 中查找 `operator!=` → 找到。\n\
  3. `this` 指针指向类型为 `inequality<point>` 的对象，该对象是 `point` 对象的一部分。\n4. 在实例化 `inequality<point>::\
  \ operator!=` 时，两种类型都是完全知的，我们可以静态地将 `this` 指针向下转型为 `point*`。\n5. 由于我们知道 `inequality<point>`\
  \ 的 `this` 指针是一个指向 `point*` 的向上转换 `this` 指针，因此将其向下转换回原始类型是安全的。\n6. `this` 指针是一个提升的……指针。\n\
  \n##### 6.6.1.2 可重用的运算符\n\n`⇒ c++14/access_example.cpp`\n\nCRTP 惯用法允许我们解决前面提到的问题（§2.6.4](#ch02.xhtml_sec2_6_4)）。假设我们有一个名为\
  \ `some_matrix` 的矩阵类型。为了与向量符号保持一致，我们倾向于使用括号运算符。这些运算符只接受一个参数，因此我们需要一个代表矩阵行的代理。该代理类提供一个括号运算符：\n\
  \n```cpp\nclass some_matrix; // 前向声明\nclass simple_bracket_proxy\n{\n  public:\n\
  \    simple_bracket_proxy(some_matrix& A, size_t r) : A{A}, r{r} {}\n    double&\
  \ operator[](size_t c){ return A(r, c);} \n  private:\n    some_matrix& A;\n   \
  \ size_t r;\n};\n\nclass some_matrix\n{\n  // ...\n  double& operator() (size_t\
  \ r, size_t c) { ... }\n  simple_bracket_proxy operator[](size_t r)\n  {\n    return\
  \ simple_bracket_proxy(*this, r);\n  }\n};\n```\n\n思路是 `A[i]` 返回一个指向 `A` 并包含 `i`\
  \ 的代理 `p`。调用 `A[i][j]` 对应于 `p[j]`，后者反过来应该调用 `A(i, j)`。遗憾的是，这段代码无法编译。当我们在 `simple_bracket_proxy::operator[]`\
  \ 中调用 `some_matrix::operator()` 时，类型 `some_matrix` 仅声明但未定义。交换两个类的定义只会反转依赖关系并导致更多无法编译的代码。这种代理实现中的问题是我们需要相互依赖的完整类型。\n\
  \n这是模板的一个有趣的方面：由于其延迟代码生成，模板允许我们打破相互依赖。为代理添加模板参数消除了这种依赖：\n\n\n\n\n\n```cpp\ntemplate\
  \ <typename Matrix>\n\nclass bracket_proxy\n{\n\n  public :\n    bracket_proxy(Matrix&\
  \ A, size_t r) : A{A}, r{r} {}\n    auto& operator[] (size_t c){ return A(r, c);\
  \ }\n\n  private :\n    Matrix& A;\n    size_t      r;\n};\n\nclass some_matrix\n\
  {\n    // ...\n    bracket_proxy<some_matrix, double> operator[](size_t r)\n   \
  \ {\n        return bracket_proxy <some_matrix>{*this, r};\n    }\n};\n```\n\n最后，我们可以编写\
  \ `A[i][j]` 并让它在内部通过两个参数的 `operator()` 来执行。现在，我们可以编写许多具有完全不同的 `operator()` 实现的矩阵类，而且所有它们都可以以完全相同的方式部署\
  \ `bracket_proxy`。\n\n### C++11\n\n一旦我们实现了几个矩阵类，就会发现 `operator[]` 在所有矩阵类中看起来都非常相似：仅仅是返回一个带有矩阵引用和行参数的代理对象。我们可以添加另一个\
  \ CRTP 类来仅实现一次这个括号运算符：\n\n```cpp\ntemplate <typename Matrix>\n\nclass bracket_proxy\
  \ { ... };\n\ntemplate <typename Matrix>\nclass crtp_matrix\n{\n    using const_proxy=\
  \ bracket_proxy<const Matrix>;\n  public:\n    bracket_proxy<Matrix> operator[](size_t\
  \ r)\n    {\n        return {static_cast<Matrix& >(*this), r};\n    }\n    const_proxy\
  \ operator[] (size_t r) const\n    {\n        return {static_cast<const Matrix&>(*this),\
  \ r};\n    }\n};\n\nclass some_matrix\n  : public crtp_matrix<some_matrix>\n{\n\
  \  // ...\n};\n```\n\n注意，C++11 的特性仅是为了简洁；我们也可以在 C++03 中实现这段代码。这个 `crtp_matrix` 类可以为每个具有双参数应用运算符的矩阵类提供括号运算符。然而，在一个完整的线性代数包中，我们需要注意哪些矩阵是可变的，以及返回的是引用还是值。这些区别可以通过第\
  \ 5 章中的元编程技术或类型推导（特别是使用 `decltype(auto)`）来安全处理。\n\n尽管代理方法创建了额外的对象，但我们的基准测试显示，括号运算符的使用速度与应用运算符本身一样快。显然，现代编译器中复杂的引用转发可以消除代理的实际创建。\n\
  \n#### C++11 6.6.2 使用重载的类型特性\n\n`⇒ c++11/type_traits_overloading.cpp`\n\n我们在第 5.2\
  \ 节中展示的类型特性适用于类的模板特化。使用部分特化，在满足整个类型集可以被单个模式描述（例如代表所有原始指针集合的 `T*`）的情况下，我们可以一次为无限数量的类型声明属性。\n\
  \n在实际应用中，同样重要的是（至少是）类型特性的声明需要以相同的方式适用于派生类。我们在工作中一个这起了主要作用的例子是矩阵的 `map_view`。当读取视图的某个条目时，会读取被引用矩阵中的对应条目并对该值应用一元函数，例如，$A$\
  \ 的 `negate_view` 在第 $i$ 行第 $j$ 列产生值 $-a[ij]$。尽管这些例子非常特定于线性代数，但我们相信，对象上的类似视图在其他领域也很有用。\n\
  \n我们可以想象这种功能已经存在于许多项目中，并且通常通过 `virtual` 函数实现，因为这样要简单得多。另一方面，这种代码由于间接函数调用而速度较慢。如果引发的性能损失是可以接受的，则没有迫切需要更改实现。\n\
  \n为了在不使用 `virtual` 函数的情况下提供大量的视图，我们首先创建了一个类模板 `map_view`，它由被引用的 `Matrix` 类型和一个一元\
  \ `Functor` 参数化：\n\n```cpp\ntemplate <typename Matrix, typename Functor>\nstruct\
  \ map_view { ... };\n```\n\n所有的运算符和其他成员函数都在那里实现，以避免大量的代码重复。现在，我们可以通过通过相应的函数派生自 `map_view`\
  \ 来提供全谱映射（缩放、递增、共轭等，任何你需要的）：\n\n```cpp\ntemplate <typename Matrix>\nstruct negate_view\n\
  \  : map_view<Matrix, negate_functor>\n{\n  // 实现或导入构造函数\n};\n```\n\n对于每个新视图，我们必须在\
  \ C++03 中特化所有相关的类型特性，这是通用性最差的库。为了在不使用 `virtual` 函数的情况下提供大量的视图，我们首先创建了一个类模板 `map_view`，它由被引用的\
  \ `Matrix` 类型和一个一元 `Functor` 参数化：\n\n```cpp\ntemplate <typename Matrix, typename\
  \ Functor>\nstruct map_view { ... };\n```\n\n所有的运算符和其他成员函数都在那里实现，以避免大量的代码重复。现在，我们可以通过相应的函数派生自\
  \ `map_view` 来提供全谱映射（缩放、递增、共轭等，任何你需要的）：\n\n```cpp\ntemplate <typename Matrix>\n\
  struct negate_view\n  : map_view<Matrix, negate_functor>\n{\n  // 实现或导入构造函数\n};\n\
  ```\n\n对于每个新视图，我们必须在 C++03 中特化所有相关的类型特性，这是通用性最差的库。为了在不使用 `virtual` 函数的情况下提供大量的视图，我们首先创建了一个类模板\
  \ `map_view`，它由被引用的 `Matrix` 类型和一个一元 `Functor` 参数化：\n\n```cpp\ntemplate <typename\
  \ Matrix, typename Functor>\nstruct map_view { ... };\n```\n\n所有的运算符和其他成员函数都在那里实现，以避免大量的代码重复。现在，我们可以通过相应的函数派生自\
  \ `map_view` 来提供全谱映射（缩放、递增、共轭等，任何你需要的）：\n\n```cpp\ntemplate <typename Matrix>\n\
  struct negate_view\n  : map_view<Matrix, negate_functor>\n{\n  // 实现或导入构造函数\n};\n\
  ```\n\n\n\n\n\n遗憾的是，这仍然没有为派生类提供正确的类型属性（type traits）：\n\n```\nint is not a matrix.\n\
  \ndense_matrix<int> is a matrix.\n\nnegate_view<dense_matrix<int> > is not a matrix.\n\
  ```\n\n问题在于重载解析的优先级。当我们使用 `negate_view` 调用 `is_a_matrix` 时，有两个匹配项：通用模板函数 (#1) 和针对任何\
  \ `map_view` 的更具体的模板 (#3)。直觉上说，我们会认为编译器更偏于 #3，因为它更具体。但事实并非如此。重载解析的优先级如下：\n\n1. 完美匹配（参数类型和参数类型相等）；\n\
  2. 模板实例化；\n3. 隐式类型转换。\n\n对于调用 #1，模板参数 `T` 只需要替换为 `negate_view <dense_matrix<int>\
  \ >`；而对于 #3，参数必须先被转换为 `map_view <dense_matrix<int>, negate_view>`，然后才能替换 `Matrix`\
  \ 和 `Functor` 参数。因此编译器更偏于 #1，导致我们的视图仍然不被视为矩阵。\n\n为了让所有视图都能调用 #3，我们必须将 #1 替换为能够捕获所有可能的参数类型、但重载优先级低于隐式转换的内容。C++\
  \ 中只有一种特性具有这种属性，不幸的是，它与宏、`goto` 和 `void*` 属于同一个“邪恶”的量级：省略号（`...`）。省略号可以接受任意数量、任意类型的函数参数，并且有宏来处理这些参数。带有省略号参数的函数不包含任何关于传入参数的类型信息，甚至不知道参数的数量。这些信息必须由调用者提供，并在运行时评估。如果参数信息错误，程序的行为是未定义的。\n\
  \n其中一个例子是 `printf`，其参数的个数和类型间接通过格式化字符串提供。虽然最近的编译器会尽可能检查格式化字符串与其他参数的一致性，但当格式化字符串是在运行时构建时，编译器无能为力。这时微小的拼写错误就会导致严重后果。例如，将\
  \ `int` 输出为字符串通常会导致程序崩溃，因为 `int` 值随后会被解释为一个地址，并尝试打印从该地址开始的字符，这通常会导致段错误（segmentation\
  \ fault）。\n\n简而言之，使用省略号向函数传递参数是一种极其危险的方法。然而，在我们这种特定场景下，我们只感兴趣派载函数的返回值。在 `is_a_matrix`\
  \ 中永远不会访问传递的参数。正因为如此，我们才敢于使用省略号。因此我们保持其他一切不变，只替换回退情况的重载：\n\n```\nstd :: false_type\
  \ is_a_matrix (...); // #1\n```\n\n通过此项修改，我们所有的视图都被视为了矩阵：\n\n```\nint is not a matrix.\n\
  \ndense_matrix<int> is a matrix.\n\nnegate_view<dense_matrix<int> > is a matrix.\n\
  ```\n\n在大型项目中，建议为所有类和类模板提供前向声明。这样就可以不需要类实现的情况下实现类型属性——即使是在函数重载风格下也是——这有助于避免头文件的循环依赖。\n\
  \n这里介绍的技术最初比之前显示的模板特化稍微复杂一点。但对于较大的项目，当我们能够避免派生类的所有多余类型属性声明时，这种做法是非常划的。我们甚至可以使用 Lambda\
  \ 作为函数对象创建新类，并以极高的生产力扩展应用程序的功能。\n\n## 6.7 练习\n\n#### 6.7.1 非冗余菱形\n实现第 6.3.2 节 中的菱形，使得该名称只打印一次。在派生类中区分\
  \ `all_info()` 和 `my_info()`，并恰地调用这两个函数。\n\n#### 6.7.2 继承 Vector 类\n修改第 2 章 中的 vector\
  \ 示例。为 `size` 和 `operator()` 引入基类 `vector_expression`。让 `vector` 继承自这个基类。然后创建一个\
  \ `ones` 类，它是一个所有元素值均为 1 的 vector，并且也继承自 `vector_expression`。\n\n### 6.7.3 重构 Vector\
  \ 中的异常\n重构我们在第 3 章中的模板 vector 实现 `c++11/vector_template.cpp` 以增强其健壮性。将 `check_index`\
  \ 和 `check_size` 中的 `assert` 宏替换为抛出适当的异常。所谓“适当”，是指它们被定义在有意义的内部结构中，并且全部派自 `std::exception`\
  \ 或其子类。可以自由添加更多测试和异常类。\n\n### 6.7.4 测试抛出的异常\n一个严谨的软件开发者不仅会测试一组正确的程序代码片段是否正常工作，还会测试错误示例中的问题是否被检测到。这种负测试对于\
  \ `assert` 和 `static_assert` 来说实现起来困难，但对于异常来说可以更优雅地实现。首先，我们可以通过违反大小和索引限制来实现对练习 6.7.3\
  \ 的测试，并检查是否抛出了预期的异常。\n\n具体来说：我们写一个 `try`-`catch` 块，其开头是一个我们预计会抛出某种特定异常的语句。在该语句之后，我们抛出一个类型为\
  \ `missing_exception` 的异常。在块的最后我们只 `catch` 预期的异常类型，并作为恢复操作，通过打印一条华丽的消息来庆祝我们的成功。任何其他异常——特别是\
  \ `missing_exception`——将不会被捕获并终止程序。因此，我们的测试程序只有在问题语句抛出预期异常时才是成功的。\n\n有动心的读者可以更进一步，实现一个通用的异常测试，它接受预期的异常类型作为模板参数（不是推断的，而调用时显式声明）以及一个在\
  \ `try`-`catch` 块中调用的无参函数对象。显然我们通常用 Lambda 创建这个无参函数对象。这是作者在软件中经常使用的非常有用的工具。\n\n\
  #### 6.7.5 Clone 函数\n编写一个 CRTP 类，包含一个成员函数 `clone()`，用于复制当前对象——类似于 Java 的 `clone()`\
  \ 函数。考虑到函数的返回类型必须是克隆对象的类型。\n\n\n\n\n\n在本节中，我们将介绍设计数值库的主要步骤。这里的重点不在于提供最完备的数值功能，而是实现一个确保最大通用性的健壮设计。作为一个示例，我们将考虑求解`常微分方程`（Ordinary\
  \ Differential Equations, ODEs）的数值算法。秉持第三章的精神，我们的目标是通过使用泛型编程，使实现尽可能通用。我们首先简要介绍算法的数学背景，然后给出一个简单、直观的实现。通过此，我们能够识别出实现中的各个部分，并逐个使它们变得可替换，从而得到一个完全泛型的库。我们深信，在学习了这一泛型库设计的详细示例后，读者将能够将这种技术应用于其他数值算法。\n\
  \n### 7.1.1 常微分方程\n\n常微分方程是模拟物理、生物、化学或社会过程的基本数学工具，也是科学和工程领域中最重要的概念之一。除了少数简单情况外，`ODE`\
  \ 的解无法通过解析法找到，我们必须依赖数值算法来获得至少近似解。在本章中，我们将开发 `Runge-Kutta-4` 算法的泛型实现，该算法因其简单性和健壮性被广泛用于通用\
  \ `ODE` 求解器。\n\n通常，常微分方程是一个包含关于独立变量 `t` 的函数 `x(t)` 及其导数 `x'`、`x''`、...的方程：\n\n![Images](img/07equ01.jpg)\n\
  \n这是最通用的形式，包含了隐式 `ODEs`。然而，在这里我们只考虑显式 `ODEs`，形式为 `x((n)) = f(x, x',x(''),...,x^((n–1)))`，它们在数值处理上要简单得多。`ODE`\
  \ 中出现的最高阶数 `n` 称为该 `ODE` 的“阶”（order）。但任何 `n` 阶 `ODE` 都可以轻松转换为 `n` 维的一阶 `ODE` [28]。因此，只需考虑\
  \ `n = 1` 的一阶微分方程就足够。后面介绍的数值程序都将处理初值问题（IVPs）：即在起始点 `x(t = t[0])= x[0]` 处具有 `x` 值的\
  \ `ODEs`。因此，在后续页面中进行数值处理的问题数学表述为：\n\n![Images](img/07equ02.jpg)\n\n在这里，我们使用向量符号\
  \ ![Images](img/xarrow.jpg) 来表示变量 ![Images](img/xarrow.jpg) 可能是一个多维向量。通常，`ODE` 是针对实值变量定义的，即\
  \ ![Images](img/pg408-01.jpg)，但也考虑复值 `ODEs`，其中 ![Images](img/408equ01.jpg)。函数 ![Images](img/pg408-03.jpg)\
  \ 称为 `ODE` 的右端（RHS）。`ODE` 最简单的物理例子可能是谐振振荡器（Harmonic Oscillator），即一个连接在弹簧上的质点。该系统的牛顿运动方程为：\n\
  \n![Images](img/07equ03.jpg)\n\n其中 `q(t)` 表示质点的位置，`ω[0]` 是振荡频率。后者是质量 `m` 和弹簧刚度 ![Images](img/408equ02.jpg)\
  \ 的函数。通过引入 `p = dq/dt`，使用 ![Images](img/408equ03.jpg) 并定义一些初始条件（例如 `q(0) = q[0]`，`p(0)\
  \ = 0`），可以将其转化为形式 (7.2)。使用简记符号 ![Images](img/pg408-06.jpg) 并省略显式的时间依赖性，我们得到：\n\n\
  ![Images](img/07equ04.jpg)\n\n注意方程 (7.4) 中的 ![Images](img/farrow.jpg) 不依赖于变量 `t`，这使得方程\
  \ (7.4) 成为自治（Autonomous）`ODE`。同时注意在本示例中，独立变量 `t` 代表时间，![Images](img/xarrow.jpg)\
  \ 代表相空间中的一点，因此解 ![Images](img/408equ04.jpg) 是谐振振荡器的轨迹（Trajectory）。这是物理 `ODE` 中的典型情况，也是我们选择变量\
  \ `t` 和 ![Images](img/xarrow.jpg) 的原因。（1)\n\n1。在数学中，独立变量通常称为 `x`，解称为 `y(x)`。\n\n\
  对于方程 (7.4) 中的谐振振荡器，我们可以找到 IVP 的解析解：`q(t) = q[0] cos ω[0]t` 和 `p(t) = –q[0] ω[0]\
  \ sin(ω[0]t)`。更复杂的非线性 `ODEs` 通常无法通过解析求解，我们必须采用数值方法来寻找近似解。一组特定的示例是表现出混沌动力学（Chaotic\
  \ Dynamics）的系统 [52]，其轨迹无法通过解析法描述。\n\n### 7.1.2 Runge-Kutta 算法\n\n求解常微分方程初值问题的常用的通用方案是所谓的\
  \ Runge-Kutta（RK）方法 [28]。我们将关注显式 RK 方案，因为它们更容易实现且非常适合 GPU。它们是一类迭代单步法，依赖时间离散化来计算近似解。时间离散化意味着近似解是在时间点\
  \ `t[n]` 评估的。因此我们使用 ![Images](img/409equ02.jpg) 作为 `t[n]` 处解的数值近似。在最简单但常用的等步长 `Δt`\
  \ 等距离散化情况下，数值解写为：\n\n![Images](img/07fig01.jpg)\n\n**图 7–1：参数为 *σ* = 10, *R* = 28\
  \ 且** *b* = 10/3 的 Lorenz 系统混沌轨迹**\n\n![Images](img/07equ06.jpg)\n\n近似点 ![Images](img/409equ02.jpg)\
  \ 通过数值算法顺序获得，该算法可以用最通用的形式写为：\n\n![Images](img/07equ07.jpg)\n\n这里的映射 ![Images](img/410equ02.jpg)\
  \ 代表数值算法，即著名的 RK4 方案（有时称为 Run-Kutta 方案），它从 ![Images](img/410equ03.jpg) 开始通过步长 `Δt`\
  \ 执行一次迭代。如果数值方案生成的解精确到某阶误差 `m + 1`，则称该方案为 `m` ：\n\n![Images](img/07equ08.jpg)\n\n\
  其中 ![Images](img/410equ04.jpg) 是从初始条件 ![Images](img/410equ05.jpg) 开始在 `t[1]` 处的\
  \ `ODE` 精确解。因此，`m` 表示该方案*单步*的精度阶。\n\n\n\n\n\n计算此类离散轨迹 `x[1]`、`x[2]`、... 最基础的数值算法是`欧拉法`（Euler\
  \ Scheme），其中 ![Images](img/410equ06.jpg)，这意味着下一个近似值是通过当前近似值得到的：\n\n![Images](img/07equ09.jpg)\n\
  \n该方案没有实际意义，因为它只提供了阶数为 `m` = 1 的精度。通过引入中间点并将一步步划分为几个阶段，可以达到更高的阶数。例如，`RK4` 方案具有 `s`\
  \ = 4 个阶段，且阶数为 `m` = 4。其定义如下：\n\n![Images](img/07equ10.jpg)\n\n注意中间结果 ![Images](img/410equ07.jpg)\
  \ 的后续计算是如何依赖于上一个阶段的结果 ![Images](img/410equ08.jpg) 的。\n\n更一般的，Runge-Kutta 方法由其阶数\
  \ `s` 和一组参数 `c[1]` *...`c[s]`，`a[21]*, `a[31]*, `a[32]*, ... , `a[ss][–]*[1]` 以及\
  \ `b[1]` *...` `b[s]` 定义。计算下一个近似值 `x[n][+1]` 的算法如下：\n\n![Images](img/07equ11.jpg)\n\
  \n参数集 `a[i,j]`、`b[i]` 和 `c[i]` 定义了所谓的 Butcher 表（Butcher tableau，参见图 7–2），并完整描述了特定的\
  \ Runge-Kutta 方法。上述 `RK4` 方案的 Butcher 表见于图 7–2(b)。\n\n![Images](img/07fig02.jpg)\n\
  \n**图 7–2：Butcher 表**\n\n### 7.1.3 通用实现\n\n在 C++ 中以直接的方法实现上述 Runge-Kutta 方法并没有任何困难。例如，我们可以使用\
  \ `std::vector<double>` 来表示状态 ![Images](img/xarrow.jpg) 和导数 ![Images](img/pg411-01.jpg)，并使用模板参数来允许\
  \ RHS 函数 ![Images](img/pg411-02.jpg) 的某种通用性。列表 7–1 中的代码展示了上述欧拉法的快速易用实现。为了简单起见，我们将示例限制在欧拉法上以保持代码段简洁，但以下几点对于更复杂的\
  \ Runge-Kutta 方法的类似实现也适用。\n\n**列表 7–1：欧拉法的基础实现**\n\n```\nusing state_type= std::vector<double>;\n\
  \ntemplate <typename System>\n\nvoid euler_step(System system, state_type& x,\n\n\
  \               const double t, const double dt)\n{\n\n      state_type k{x.size()};\n\
  \      system(x, k, t);\n      for(int i= 0; i < x.size(); ++i)\n          x[i]+=\
  \ dt * k[i];\n}\n```\n\n将 RHS `system` 定义为模板参数已经带给了我们一些良好的通用性：`euler_step` 函数接受函数指针、函数对象以及\
  \ C++ lambda 对象作为 `system` 参数。唯一的要求是 `system` 对象可以通过参数结构 `system(x, dxdt, t)` 被调用，并且它计算了\
  \ `dxdt` 中的导数。\n\n尽管这种实现在许多情况下运行得良好，但一旦遇到某些非标准情况，它就会出现几个严重问题。这些情况可能是：\n\n- 不同的状态类型，例如使用固定大小的数组\
  \ (`std::array`) 以获得更好的性能；\n- 对于复数类型；\n- 非标准容器，例如用于 ODE；\n- 需要比 `double` 更高的精度；\n\
  - 并行化，例如通过 OpenMP 或 MPI；\n- GPGPU 设备的使用。\n\n在后续，我们将泛化列表 7–1 中的实现，以便处理上述情况。因此，我们将识别\
  \ Runge-Kutta 方法的需求，然后逐个处理这些需求。结果将是高度模块化的实现，允许我们解决上述问题。\n\n#### 7.1.3.1 计算需求\n\n\
  为了获得欧拉法的通用实现（见列表 7–1），我们需要将算法与实现细节分离。为此，我们首先需要识别涉及公式 (7.9) 或 (7.10) 结合列表 7–1 的计算需求。首先，必须在代码中表示数学实体，即\
  \ ODE 的状态变量 ![Images](img/pg412-01.jpg)，以及独立变量 `t` 和 Runge-Kutta 方法的常数 `a, c`。其次，必须分配内存以存储中间结果\
  \ ![Images](img/pg412-02.jpg)。此外，需要对高维状态变量进行迭代，最后是状态变量元素 `x[i]`、独立变量 `t`、`Δt` 以及数值常数\
  \ `a, b` 的标量计算。总之，上述 Runge-Kutta 方法需要以下组件：\n\n1. 数学实体表示\n2. 内存管理\n3. 迭代\n4. 基础计算\n\
  \n识别出这些需求后，我们现在可以设计一个通用实现，每个需求都由一个可交换的模块化代码块来处理。\n\n#### 7.1.3.2 模块化算法\n\n在我们的模块化设计中，我们将为之前识别四个需求引入独立的代码结构。我们从表示数学对象的类型开始：状态\
  \ ![Images](img/xarrow.jpg)、独立变量（时间）`t` 以及算法参数 `a, b, c`（见图 7–2a）。泛化算法的标准方法是引入模板参数。我们也遵循这种方法，因此定义了三个模板参数：`state_type`、`time_type`\
  \ 和 `value_type`。列表 7–2 显示了带有这些模板参数的 RK4 方法类定义。注意我们如何使用 `double` 作为 `value_type`\
  \ 和 `time_type` 的默认参数，因此在大多数情况下，用户只需要指定 `state_type`。\n\n```\ntemplate <typename\
  \ state_type,\n          typename value_type = double,\n          typename time_type\
  \ = value_type>\nclass runge_kutta4 {\n\n    // ...\n\n};\n\nusing rk_stepper= runge_kutta4<std::vector<double>\
  \ >;\n```\n\n\n\n\n\n接下来，我们处理内存分配。在 Listing 7–1 中，这是通过 `std::vector` 构造函数完成的，该函数期望向量大小作为参数。对于泛型\
  \ `state_type`，这不再是可行的，因为用户可能会提供其他类型，例如 `std::array`，这些类型的构造函数签名与此不同。因此，我们引入了一个模板辅助函数\
  \ `resize`，来处理内存分配。该模板辅助函数可以由用户为任何给定的 `state_type` 进行特化。Listing 7–3 展示了针对 `std::vector`\
  \ 和 `std::array` 的实现，以及它在 `runge_kutta4` 实现中的用法。注意 `resize` 函数如何根据状态 `in` 为状态 `out`\
  \ 分配内存。这是实现此类内存分配的最通用方法；它也适用于所需大小并不显而易见的稀疏矩阵类型。Listing 7–3 中的调整大小方法提供了与 Listing\
  \ 7–1 中非泛型版本相同的功能，因为 `runge_kutta4` 类再次负责它自己的内存管理。它可以立即用于任何提供 `resize` 和 `size`\
  \ 函数的向量类型。对于其他类型，用户可以提供 `resize` 重载，并以此告诉 `runge_kutta4` 类如何分配内存。\n\n接下来是计算 RHS\
  \ 方程的函数调用 ![Images](img/pg413-01.jpg)。这已经在 Listing 7–1 中通过模板以泛型的方式实现，我们将保留这一解决方案。\n\
  \n最后，我们必须为数值计算寻找抽象。如上所述，这涉及对 ![Images](img/xarrow.jpg) 的元素进行迭代，并对这些元素进行基础计算（求和、乘法）。我们通过通过引入两个代码结构：`Algebra`\
  \ 和 `Operation` 分别处理这两个部分。`Algebra` 将处理迭代，而 `Operation` 将负责计算。\n\n我们从 `Algebra`\
  \ 开始。对于 RK4 算法，我们需要两个函数，分别遍历三个和六个 `state_type` 实例。考虑到 `state_type` 通常是 `std::vector`\
  \ 或 `std::array`，提供一个可以处理 C++ 容器的代数是合理的。为了确保我们的基础代数具有尽可能通用性，我们将使用 C++11 引入的标准库中的\
  \ `std::begin` 和 `std::end` 函数。\n\n**Listing 7–3: 内存分配**\n\n```cpp\ntemplate <typename\
  \ state_type>\n\nvoid resize(const state_type& in, state_type& out) {\n\n  // 标准实现适用于容器\n\
  \n  using std::size ;\n\n  out.resize(size(in));\n}\n\n// 针对 std:: array 的特化\n\n\
  template <typename T, std::size_t N>\n\nvoid resize(const std::array <T , N >& ,\
  \ std::array <T,N >& ) {\n\n  /* 数组不需要调整大小 */\n}\n\ntemplate < ... >\nclass runge_kutta4\
  \ {\n\n    // ...\n\n    template <typename Sys>\n    void do_step(Sys sys, state_type&\
  \ x,\n\n                time_type t, time_type dt)\n    {\n\n      adjust_size(x);\n\
  \      // ...\n    }\n    void adjust_size(const state_type& x) {\n        resize(x,\
  \ x_tmp);\n        resize(x, k1);\n        resize(x, k2);\n        resize(x, k3);\n\
  \        resize(x, k4z);\n    }\n};\n```\n\n**Advice**\n\n在泛型库中使用如 `std::begin`\
  \ 类的自由函数的正确方法是，通过 `using std::begin` 将其局部提升到当前命名空间，然后在不使用命名空间限定符的情况下访问它们，即 `begin(x)`，如在\
  \ Listing 7–4 所示。这样，在必要时，编译器还可以通过依赖参数的名字查找（ADL）利用与 `x` 类型相同命名空间中定义的 `begin` 函数。\n\
  \nListing 7–4 展示了这样一个 `container_algebra`。迭代在名为 `container_algebra` 的 `struct` 的\
  \ `for_each` 函数中执行。这些函数期望数量的容器对象以及操作对象，然后对所有容器进行迭代并按元素执行给定的操作。每个对象执行的 `Operation`\
  \ 是简单的乘法和加法，将在后续描述。\n\n**Listing 7–4: 容器代数**\n\n```cpp\nstruct container_algebra\n\
  {\n  template <typename S1, typename S2, typename S3, typename Op>\n  void for_each\
  \ (S1& s1, S2& s2, S3& s3, Op op)\n  {\n    using std::begin;\n    using std::end;\n\
  \    auto first1= begin(s1);\n    auto last1= end(s1);\n    auto first2= begin(s2);\n\
  \    auto first3= begin(s3);\n    for( first1 != last1; )\n      op(*first1++, *first2++,\
  \ *first3++);\n  }\n};\n```\n\n最后的片段是构成的在 `struct` 中的基础操作对象。Listing 7–5 显示了这些操作的实现。为了简单起见，再次展示可在\
  \ `for_each` 中使用的 `scale_sum` 因子（Listing 7–4）。然而，对于 `for_each` 的 `scale_sum` 扩展是直观的。正如\
  \ Listing 7–5 所示，操作由 `alpha1`、`alpha2` 组成。\n\n**Listing 7–5: 操作**\n\n```cpp\nstruct\
  \ default_operations {\n  template <typename F1, typename F2>\n  struct scale_sum\
  \ {\n    const F1 alpha1;\n    const F2 alpha2;\n    scale_sum(F1 a1, F2 a2)\n \
  \     : alpha1{a1}, alpha2{a2} {}\n    template <typename T0, typename T1, typename\
  \ T2>\n    void operator()(T0& t0, const T1& t1, const T2& t2) const\n    {\n  \
  \    t0= alpha1 * t1 + alpha2 * t2;\n    }\n  };\n};\n```\n\n收集了所有模块化的组件后，我们可以根据上述部分实现\
  \ Runge-Kutta-4 算法。Listing 7–6 展示了这种实现。注意上述所有部分都是作为参数提供的，因此是可配置的。\n\n**Listing 7–6:\
  \ 泛型 Runge-Kutta-4**\n\n```cpp\ntemplate <typename state_type, typename value_type=\
  \ double,\n          typename time_type= value_type,\n          typename algebra=\
  \ container_algebra,\n          typename operations= default_operations>\nclass\
  \ runge_kutta4 {\npublic:\n\n    template <typename Sys>\n    void do_step(System&\
  \ system, state_type& x,\n                time_type t, time_type dt)\n    {\n  \
  \    adjust_size(x);\n      const value_type one= 1;\n      const time_type dt2=\
  \ dt/2, dt3= dt/3, dt6= dt/6;\n      using scale_sum2= operations::template scale_sum2<value_type,\
  \ time_type>;\n      using scale_sum5= operations::template scale_sum5<value_type,\
  \ time_type, time_type, time_type>;\n      system(x, t);\n      m_algebra.for_each(x_tmp,\
  \ x, scale_sum2{one, dt2});\n      system(x_tmp, t + dt2);\n      m_algebra.for_each(x_tmp,\
  \ x, scale_sum2{one, dt2});\n      system(x_tmp, t + dt2);\n      m_algebra.for_each(x_tmp,\
  \ x, scale_sum2{one, dt2});\n      system(x_tmp, t + dt);\n      m_algebra.for_each6\
  \ (x, x, k1, k2, k3, k4,\n                          scale_sum5{one, dt6, dt3, dt3,\
  \ dt6});\n    }\n\nprivate:\n\n    state_type x_tmp, k1, k2, k3, k4;\n    algebra\
  \ m_algebra;\n    void adjust_size(const state_type& x) {\n        resize(x, x_tmp);\n\
  \        resize(x, k1);\n        resize(x, k2);\n        resize(x, k3);\n      \
  \  resize(x, k4);\n    }\n\n};\n```\n\n以下代码段展示了如何实例化这个 Runge-Kutta-4 步器：\n\n\n\n\
  \n\n```\nusing rk4_type= runge_kutta4<vector<double>, double, double,\n        \
  \                       container_algebra , default_operations >;\n\n// 使用默认参数的等效快捷定义：\n\
  // using rk4_type= runge_kutta4<vector<double> >;\n\nrk4_type rk4;\n```\n\n### 7.1.3.3\
  \ 简单示例\n\n最后，我们展示了一个较小的示例，说明如何使用上述通用的 Runge-Kutta-4 实现来积分著名的伦兹系统轨迹。因此，我们只需要定义状态类型，实现伦兹系统的右侧（RHS）方程，然后使用上述带有标准\
  \ `container_algebra` 和 `default_operations` 的 `runge_kutta4` 类。列表 7–7 显示了一个仅需 30\
  \ 行 C++ 代码的实现示例。\n\n### 7.1.4 展望\n\n我们已经得到了 Runge-Kutta-4 方案的通用实现。从这里开始，我们可以从许多方向继续下去。显然，可以添加更多的\
  \ Runge-Kutta 方案，可能包括步长控制和/或密集输出功能。虽然这些方法的实现起来可能更困难，并且对后端（代数和操作）需要更多功能，但它们在概念上符合上述的通用框架。此外，还可以扩展到其他显式算法，例如多步法或预测-修正法方案，因为本质上所有的显式方案只依赖于此处提出的\
  \ RHS 评估和向量操作。然而，隐式方案需要高阶代数程序（如求解线性方程组），因此需要与此处引入的不同的代数类。\n\n此外，除了 `container_algebra`\
  \ 还可以提供其他后端。一个示例可以是引入 `omp_algebra` 或 `mpi_algebra` 的并行性。此外，还可以处理 GPU 计算，例如通过 `opencl_algebra`\
  \ 和相应的数据结构。另一个用例是依赖某些线性代数包，这些包提供了已经实现所需操作的 `vector` 或 `matrix` 类型。在这种情况下，不需要迭代，应该使用一个占位代数，它只需将所需的计算转发给\
  \ `default_operations` 而不迭代。\n\n如你所见，通用实现提供了多种方法将算法调整以适应非标准情况，例如不同的数据结构或 GPU 计算。这种方法的优势在于，实际算法不需要更改。通用性允许我们替换实现的某些部分以适应不同的环境，但算法的实现不变。\n\
  \n遵循此处描述的方法的通用 ODE 算法扩展实可以在 Boost.odeint 库中找到。(2) 它包含了许多数值算法和几个后端，例如用于并行和 GPU 计算。它被积极维护并被广泛使用和测试。只要可能，强烈建议使用此库而不是重新实现这些算法。否则，上述提出的思想和代码可以作为以通用方式实现新的、更针对特定问题的例程序的良好起点。\n\
  \n2. [`http://www.odeint.com`](http://www.odeint.com)\n\n**列表 7–7: 伦兹系统中的轨迹**\n\n\
  ```\nusing state_type= std::vector<double>;\n\nusing rk4_type= runge_kutta4<state_type>;\n\
  \nstruct lorenz {\n\n    const double sigma , R, b;\n\n    lorenz(const double sigma,\
  \ const double R, const double b)\n      : sigma{sigma}, R{R}, b{b} {}\n\n    void\
  \ operator ()(const state_type& x, state_type& dxdt,\n                        double\
  \ t)\n    {\n\n      dxdt[0]= sigma * (x[1] - x[0]);\n      dxdt[1]= R * x[0] -\
  \ x[1] - x[0] * x[2];\n      dxdt[2]= -b * x[2] + x[0] * x[1];\n    }\n};\n\nint\
  \ main() {\n\n    const int steps= 5000;\n    const double dt= 0.01;\n    rk4_type\
  \   stepper;\n    lorenz      system{10.0, 28.0, 8.0/3.0};\n    state_type x{3,\
  \ 1.0};\n    x[0]= 10.0; // 初始条件\n    for (size_t n= 0; n < steps ; ++n) {\n\n \
  \       stepper.do_step(system, x, n*dt, dt);\n        std::cout ≪ n * dt ≪ ' ';\n\
  \        std::cout ≪ x[0]≪ ' '≪ x[1]≪ ' '≪ x[2]\n                      ≪ std::endl;\n\
  \    }\n}\n```\n\n## 7.2 创建项目\n\n只要程序很短，我们如何设计程序其实并不关键。对于较大的软件项目（例如超过 100,000 行代码），源代码结构良好至关重要。首先，程序源代码必须以定义良好的方式分布在多个文件中。单个文件应该大还是小随项目而异，这超出了本书的范围。在这里，我们仅演示原理。\n\
  \n### 7.2.1 构建过程\n\n从源文件到可执行文件的构建过程通常由四个步骤组成，这些步骤可以被开发者外部观察和影响。内部有九个阶段，由标准规定（5.2）。尽管如此，许多较小的程序可以通过单次编译器调用构建。因此，“编译”一词被歧义地用于整个构建过程，由单个编译器执行时。图\
  \ 7–3 描绘了四个步骤：处理、编译、汇编和链接。接下来的章节将分别讨论这些步骤。\n\n![Images](img/07fig3.jpg)\n\n**图 7–3:\
  \ 构建**\n\n##### 7.2.1 预处理\n\n`⇒ c++3/build_example.cpp`\n\n预处理的（直接）输入是一个包含函数和类的源文件。对于\
  \ C++ 项目，这是一个带有典型后缀之一的文件：`.cpp`, `.cxx`, `.C`, `.cc` 或 `.c++`，例如 `build_example.cpp`：\n\
  \n```cpp\n#include <iostream>\n#include <cmath>\n\nint main (int argc, char* argv[])\n\
  \n{\n    std::cout ≪ \"sqrt(17) is \"≪ sqrt(17)≪ '\\n';\n}\n```\n\n`⇒ c++3/build_example.ii`\n\
  \n间接输入是由相应的 `#include` 指令包含的文件。这些包含是声明头文件。包含是一个递归过程，展开到包含的文件。结果是一个包含所有直接和间接包含的文件。当包含像\
  \ Boost 这样巨大的第三方库时，这种展开文件可能由数十万行组成。仅包含 `<iostream>` 就会让像前面的玩具程序膨达到 20,000 行：\n\n\
  ```cpp\n# 1 \"build_example.cpp\"\n# 1 \"<command-line>\"\n\n// ... 跳略一些行\n\n# 1\
  \ \"/usr/include/c++/4.8/iostream\" 1 3\n# 36 \"/usr/include/c++/4.8/iostream\"\
  \ 3\n\n// ... 跳略一些行\n\n# 184 \"/usr/include/x86_64-linux-gnu/c++/4.8/bits/c++config.h\"\
  \ 3\nnamespace std\n\n{\n    typedef long unsigned int size_t;\n\n// ... 跳略很多，很多行\n\
  \n# 3 \"build_example.cpp\" 2\nint main (int argc, char* argv[])\n\n{\n    std::cout\
  \ ≪ \"sqrt(17) is \"≪ sqrt(17)≪ '\\n';\n}\n```\n\n预处理后的 C++ 程序通常带有 `.ii` 后缀（预处理后的\
  \ C 为 `.i`）。要仅执行预处理，请使用编译器标志 `-E`（Visual Studio：`/E` 输出到控制台，`/P` 输出到文件）。输出应使用 `-o`\
  \ 指定，否则将打印在屏幕上。\n\n3。文件名后缀只是约定，对编译器并不重要。我们可以使用 `.bambi` 作为程序的后缀，它们仍然可以编译。这适用于构建讨论的剩余部分的所有其他后缀。\n\
  \n\n\n\n\n除了包含之外，宏还会被展开并选择条件代码。整个预处理步骤是纯文本替换，在很大程度上独立于（不忽略）编程语言。因此，它非常灵活，但也极其容易出错，正如我们在\
  \ 1.9.2.1 节 中讨论的那样。预处理过程中合并的文件集被称为 `Translation Unit`（编译单元）。\n\n`⇒ c++17/has_include_example.cpp`\n\
  \nC++17 C++ 提供了宏 `__has_include` 来测试头文件是否可以被包含。这允许我们根据条件包含文件：\n\n```cpp\n# if __has_include(<any>)\n\
  \n#   include <any>\n\n# endif\n```\n\n特别是在使用具有部分语言支持的编译器时（例如，用于 C++20 部分支持的 `-std=c++2a`），某些库可能尚未存在——例如旧版编译器上的\
  \ `<any>` 头文件，或较新编译器上（编写时）的 `<ranges>`。即使是提供标准标志的编译器版本——例如用于 C++20 的 `-std=c++20`——也可能缺少某些标准头。当然，我们可能需要对剩余代码进行调整以适应缺失的头：\n\
  \n```cpp\nint main ()\n\n{\n\n# if __has_include(<any>)\n\n   std::cout ≪ \"any\
  \ found, we do something useful.\\n\";\n\n# else\n\n   std::cerr ≪ \"any not found,\
  \ we have to skip this example.\\n\";\n\n# endif\n\n}\n```\n\n我们还可以使用此宏来测试应用程序头的可用性，或者在包含路径设置错误时生成错误消息。最糟糕的情况是现有的头仍然不完整或错误。这只能通过构建系统中面向项目的特性测试以及相应的用户自定义条件编译来处理。这种方法显著增加了开发成本，甚至增加了测试工作。只有在向后兼容性极其重要时才应该考虑。更简单的方法是尽可能避免条件编译，并测试哪个编译器为项目提供了足够的语言支持。\n\
  \n### 7.2.1.2 编译\n\n`⇒ c++03/build_example.s`\n\n（实际的）编译将预处理后的源代码转换为目标平台的汇编代码^(4)这是平台机器语言的符号表示，如：4。C++\
  \ 编译器没有义务生成汇编代码，但所有常见的编译器都会这样做。\n\n```assembly\n            .file   \"build_example.cpp\"\
  \n\n            .local   _ZStL8__ioinit\n\n            .comm   _ZStL8__ioinit,1,\
  \ 1\n\n            .section        .rodata\n\n.LC0 :\n\n             .string \"\
  sqrt(17) is \"\n\n            .text\n\n            .globl    main\n\nmain������������������������.type.��������functionmain\
  \ , @function\n\nmain:\n.LFB1055 :\n\n           .�.cfi_startproc\n\n            .pushqq %rbp\n\
  \n          .cfi.cfi_def_cfa_offset 16\n\n           .cf..cfi_offset 6, -16\n\n\
              movmovq����������%rsp,rbrbp\n\n            .cf..cfi_def_cfa_register\
  \ 6\n\n            subq $32, %rsp\n\n            movl     %edi, -4(%rbp)\n\n            movq     %rsi,\
  \ -16(%rbp)\n\n    movmovl     $.LC0, %esi\n\n             movl     $_ZSt4cout,\
  \ %edi\n\n             call    _Z111\n```\n\n\n\n\n# 传闻作者在休假前曾向同事展示过它。当他回来时，已经开始后悔那个设计，但它已经在公司里到处使用了，想撤回已经太晚了。\n\
  \n包含命令的行必须以制表符（tab）开头。由于所有目标文件的规则足够相似，我们可以为所有 C++ 源码编写一条通用规则：\n\n```\n.cpp.o:\n\n\
  \    ${CXX} ${CXXFLAGS} $.-c-o $@\n```\n\n该命令包含了自动变量：`$@` 用于规则的目标，`^` 用于源文件。变量 `${CXX}`\
  \ 预设为默认 C++ 编译器，`${CXXFLAGS}` 设为其默认标志。我们可以更改这些变量：\n\n```\nCXX=        g++-10\n\n\
  CXXFLAGS=  -O3 -DNDEBUG   # Release\n\n# CXXFLAGS= -O0 -g           # Debug\n```\n\
  \n在这里我们更改了编译器并应用了激进优化（针对发布模式）。作为注释，我们还演示了没有优化的调试模式，并在目标文件中包含调试工具所需的符号表。接下来我们需要构建我们的库：\n\
  \n```\nlibmesher.a: mesher.o # 更多 mesher 源\n\n        ar cr $@ $^\n\nlibsolver.a:\
  \ solver.o # 更多 solver 源\n\n        ar cr $@ $^\n```\n\n为了简单起见，我们都使用静态链接构建它们（稍微偏离了图\
  \ 7–4）。最后，我们将应用程序和库链接在一起：\n\n```\nfluxer: fluxer.o libmesher.a libsolver.a\n\n \
  \   ${ XX} ${CXXFLAGS} $^-o $@\n```\n\n如果在这里在这里使用默认链接器而不是 C++ 编译器，我们需要添加 C++ 标准库以及可能特定于\
  \ C++ 链接的标志。现在我们可以用一个命令构建我们的项目：\n\n```\nmake fluxer\n```\n\n这触发了以下命令：\n\n```\ng++\
  \  fluxer.cpp -c -o fluxer.o\n\ng++  mesher.cpp -c -o mesher.o\n\nar cr libmesher.a\
  \ mesher.o\n\ng++  solver.cpp -c -o solver.o\n\nar cr libsolver.a solver.o\n\ng++\
  \  fluxer.o libmesher.a libsolver.a -o fluxer\n```\n\n如果我们更改了 `mesher.cpp`，下次构建过程只会生成依赖于它的目标：\n\
  \n```\ng++  mesher.cpp -c -o mesher.o\n\nar cr libmesher.a mesher.o\n\ng++  fluxer.o\
  \ libmesher.a libsolver.a -o fluxer\n```\n\n按照习惯，第一个不以点开头的目标被视为默认目标：\n\n```\nall:\
  \ fluxer\n```\n\n所以我们只需要写 `make`。\n\n![Images](img/07fig04.jpg)\n\n**图 7–4：复杂的构建**\n\
  \n## 7.2.2.2 `CMake`\n\n`⇒ CMake_example/CMakeLists.txt`\n\nCMake 是一个比 `make` 抽象更高的工具，正如我们在本节所示。我们的构建项目在这里通过名为\
  \ `CMakeLists.txt` 的文件指定。它通常从声明所需的最小工具版本并命名项目开始：\n\n```\ncmake_minimum_required\
  \ (VERSION 2.6)\n\nproject (Fluxer)\n```\n\n只需声明其源文件即可轻松创建一个新库：\n\n```\nadd_library(solver\
  \ solver.cpp)\n```\n\n使用哪些命令以及如何参数化由 `CMake` 决定，除非我们坚持使用其规范。带有动态链接的库也可以同样容易生成：\n\
  \n```\nadd_library(mesher SHARED mesher.cpp)\n```\n\n我们的最终目标是创建 `fluxer` 应用程序，并链接到这两个库：\n\
  \n```\nadd_executable(fluxer fluxer.cpp)\n\ntarget_link_libraries(fluxer solver\
  \ mesher)\n```\n\n在单独目录中构建项目是一个良好的习惯，这样我们可以一次性删除所有生成的文件。通常会创建一个名为 `build` 的子目录并在其中运行所有命令：\n\
  \n```\ncd build\n\ncmake ..\n```\n\nCMake 可以被视为一种元构建系统：它实际上并不构建项目，而是为另一个构建系统（如 `make`\
  \ 或 `ninja`）生成输入。它还可以为某些 IDE（如 Eclipse 或 Visual Studio）生成项目文件。生成从搜索编译器和其他工具包括它们的标志开始：\n\
  \n```\n-- The C compiler identification is GNU 4.9.2\n\n-- The CXX compiler identification\
  \ is GNU 4.9.2\n\n-- Check for working C compiler: /usr/bin/cc\n\n-- Check for working\
  \ C compiler: /usr/bin/cc -- works\n\n-- Detecting C compiler ABI info\n\n-- Detecting\
  \ C compiler ABI info - done\n\n-- Check for working CXX compiler: /usr/bin/c++\n\
  \n-- Check for working CXX compiler: /usr/bin/c++ -- works\n\n-- Detecting CXX compiler\
  \ ABI info\n\n-- Detecting CXX compiler ABI info - done\n\n-- Detecting CXX compiler\
  \ ABI info - done\n\n-- Configuring\n\n-- Generating\n\n-- Done\n\n-- Build files\
  \ have been written to: `CMake_example/CMakeLists.txt`\n```\n\n然后我们将看到类似如下输出：`make`\n\
  \n然后我们将看到如下输出：\n\n```\nScanning dependencies of solver\n[33%] Building CXX object\
  \ `solver.o`\nLinking CXX static library `solver.a`\n[33%] Built target `solver`\n\
  Scanning dependencies of mesher\n[66%] Building CXX object `mesher.o`\nLinking CXX\
  \ shared library `mesher.so`\n[66%] Built target `mesher`\nScanning dependencies\
  \ of fluxer\n[100%] Building CXX object `fluxer.o`\nLinking CXX executable `fluxer`\n\
  [100%] Built target `fluxer`\n```\n\n最大的好处我们留给了：`CMake` 在编写时可能对许多项目的最佳选择。他自己创建了新项目但它们通过\
  \ `CMake` 生成。他也没有将这些项目迁移到新版本。他用 `Eclipse` 创建了新项目。简而言之，它是一个非常强大的工具对于。\n\n## 7.2.3\
  \ 分离编译\n\n在看到如何从多个源构建执行文件后，现在我们将讨论如何设计这些源以避免冲突。\n\n### 7.2.3.1 头文件与源文件\n\n除了 `inline`\
  \ 和模板代码外，源代码单元通常分为：\n\n• 一个带有声明头文件（例如 `.hpp`），以及\n\n• 一个源文件（例如 `.cpp`）。\n\n源文件包含生成执行文件所需的所有算法实现。头文件包含另一个文件中实现的函数和类的声明。某些函数可能仅在内部使用，因此在头文件中被省略。例如，我们朋友\
  \ Herbert 的数学函数将分为：\n\n```\n// File: herberts/math_functions.hpp\n\n#ifndef HERBERTS_MATH_FUNCTIONS_INCLUDE\n\
  #define HERBERTS_MATH_FUNCTIONS_INCLUDE\n\ntypedef double hreal; // Herbert 的实数\n\
  \nhreal sine(hreal);\n\nhreal cosine(hreal);\n\n...\n\n#endif\n\n// File: herberts/math_functions.cpp\n\
  \n#include <herberts/math_functions.hpp>\n\nhreal divide_by_square(hreal x, hreal\
  \ y) { ... }\n\nhreal sine(hreal) { ... }\n\nhreal cosine(hreal) { ... }\n\n...\n\
  ```\n\n我们让读者去想象为什么 Herbert 引入了自己的实数类型。为了使用 Herbert 伟大的函数，我们需要两件事：\n\n• 声明：\n\n–\
  \ 包含头文件 `herberts/math_functions.hpp` 或\n\n– 我们自己声明所有需要的函数。\n\n• 编译代码：\n\n– 链接 `math_functions.o`（Windows\
  \ 下为 `.obj`）或\n\n– 链接包含 `math_functions.o` 的归文件。\n\n\n\n\n链接步骤随后将函数调用与其实际代码结合在一起。将编译后的函数链接到应用程序的最简单方法是将对象文件或归文件（archive）作为参数传递给\
  \ C++ 编译器。或者，我们也可以使用标准链接器，但这样我们就需要一些针对 C++ 特定的额外标记。\n\n### 7.2.3.2 链接问题\n\n在链接过程中，C++\
  \ 实体（如函数和变量）用符号表示。C++ 使用了“名称修饰”（Name Mangling）：即在符号名称上加上类型和命名空间（§3.2.1)）信息。链接过程中可能会出现三个问题：\n\
  \n1. 找不到符号（函数或变量）；\n2. 符号被多次找到；或\n3. 缺少 `main` 函数（或存在多个 `main` 函数）。\n\n找不到符号可能有多种原因：\n\
  \n• 声明和实现对应的符号不匹配。\n• 对应的对象文件或归文件未被链接。\n• 归文件的链接顺序错误。\n\n大多数情况下，符号缺失只是一个拼写错误。由于函数符号名因为名称修饰包含了类型信息，因此也可能是参数类型不匹配。另一种可能性是源代码使用了不兼容的编译器进行编译，导致它们对名称的修饰方式不同。\n\
  \n为了避免链接或执行期间出现问题，必须验证所有源码都是用兼容的编译器编译的；即：名称经过相同的修饰，且函数参数以相同的顺序放在堆栈上。这不仅适用于我们自己的对象文件和第三方库文件，也适用于始终链接进去的\
  \ C++ 标准库。在 Linux 中，应该使用默认编译器，该编译器保证能与所有预编译软件软件包配合。如果无法作为包提供较旧或较新的编译器版本，这通常是兼容性问题的指示。它仍然可以使用，但感知上这会带来更多工作（手动安装、构建过程的仔细配置、……）。\n\
  \n当链接器抱怨符号重复定义时，可能是因为同一个名称在多个实现中被声明和使用。更常见的原因是在头文件中文件中定义了变量和函数。只要该头文件只包含在一个翻译单元（translation\
  \ unit）中，这种方法就是有效的。当带有（某些）定义的头文件被包含多次时，链接就会失败。\n\n为了说明问题，我们回到朋友 Herbert 那些臭名昭著的数学函数上。在许多精彩的计算之外，头文件包含了以下关键定义：\n\
  \n```\n// File: herberts/math_functions.hpp\n\n..\n\ndouble square(double x) {return\
  \ x*x;}\n\ndouble pi= 3.14159265358979323846264338327950288419716939;\n```\n\n在多个翻译单元中包含此头文件后，链接器会报错：\n\
  \n```\ng++-4.8 -o multiref_example multiref1 .cpp multiref2 .cpp\n\n/tmp/cc65d1qC.o:(.data+0x0):\
  \ multiple definition of 'pi'\n\n/tmp/cc1slHbY.o:(.data+0x0): first defined here\n\
  \n/tmp/cc65d1qC.o:In function 'square(double)':\n\nmultiref2.cpp:(.text+0x0): multiple\
  \ definition of 'square (double)'\n\n/tmp/cc1slHbY.o: multiref1.cpp:(.text+0x63):\
  \ first defined here\n\ncollect2: error: ld returned 1 exit status\n```\n\n让我们先处理函数，再处理变量。防止重复定义的急救措施是使用\
  \ `static`：\n\n```\nstatic double square(double x) {return x*x; }\n```\n\n它将函数声明为该翻译单元局部。C++\
  \ 标准将此称为“内部链接”（Internal Linkage，这显然与外部链接相对）。其缺点是代码复制：当头文件被包含 *n* 次时，函数的代码就会在可执行文件中出现\
  \ *n* 次。\n\n一个 `inline` 声明：\n\n```\ninline double square(double x) {return x*x;\
  \ }\n```\n\n具有类似的效果。无论函数是否真的被内联，`inline` 函数始终具有内部链接。(参见 [7)）。相反，没有 `inline` 修饰符的函数具有外部链接，并会导致链接器错误。\n\
  \n7. 进阶：与 `static` 函数不同，代码并不一定会被复制。相反，它可以用弱符号（weak symbol）表示，这在重复定义时不会引起链接错误。\n\n\
  C++17 自 C++17 起，变量也可以被声明为 `inline` 以避免由于外部链接引起的链接冲突。这一特性使得某些库可以仅作为头文件交付。\n\n我们也可以通过仅在一个翻译单元中定义函数来避免重复定义：\n\
  \n```cpp\n// File: herberts/math_functions.hpp\n\ndouble square(double x);\n\n//\
  \ File: herberts/math_functions.cpp\n\ndouble square(double x) {return x*x; }\n\
  ```\n\n这是处理大型函数的优方法。\n\n### 函数定义\n\n短函数应该是 `inline` 的并定义在头文件中。大型函数应该在头文件中声明，并在源文件中定义。\n\
  \n对于数据，我们可以使用类似的技术。一个 `static` 变量：\n\n```\nstatic double pi= 3.14159265358979323846264338327950288419716939;\n\
  ```\n\n这解决了链接问题，但它在所有翻译单元中被复制。这并不是函数是否被内联，` ` 函数始终具有内部链接(参见 [7)）。相反，没有 `inline`\
  \ 修饰符的函数具有外部链接并导致链接器错误。\n\n最后，我们使用 `constexpr` 作为常量。常量具有内部链接，除非在头文件中定义：\n\n```\n\
  constexpr double pi = 3.14159265358979323846264338327950288419716939;\n```\n\n\n\
  \n\n`clang++` 和 Visual Studio 的模块文件使用 `cppm` 扩展，而后者也支持 `ixx`。让我们从一个短的示例开始：\n\n```\n\
  export module math;\n\nnamespace math {\n\n    export bool is_prime(long i);\n\n\
  }\n```\n\n在这里，我们首先声明了新模块 `math`，其中 `export module` 引入了模块接口。在这个模块内部，我们有了 `math` 命名空间。模块和命名空间是正交的；我们可以在模块中声明任何其他命名空间，或者将所有内容导出到全局命名空间。然而，我们认为具有同名命名空间的模块要用用得多。最后，我们\
  \ `export` 了函数 `is_prime`。我们在模块中可能实现的其他任何内容在外部都是不可见的；只有被 `export` 的内容才能被使用。这意味着与头文件的文本包含不同，我们对模块外部可见的内容具有完全控制权。相反，模块是由编译器翻译的，结果相应地是一个预编译模块文件。\n\
  \n`⇒ modules/math.cpp`\n\n该函数的实现位于一个普通的源文件中：\n\n```\nmodule math;\n\n#include <cmath\
  \ >\n\nusing namespace std;\n\nnamespace math {\n\n    long max_check(long i) {\
  \ return std::sqrt(i) + 1; }\n\n    bool is_prime(long i)\n\n    {\n\n        if\
  \ (i == 1)\n            return false;\n        if (i % 2 == 0)\n            return\
  \ i == 2;\n        for (long j = 3; j < max_check(i); j+= 2)\n            if (i\
  \ % j == 0)\n                return false;\n        return true;\n\n    }\n\n} //\
  \ namespace math\n```\n\n这里的特殊之处在于开头的模块声明。当我们编译此文件时，编译器需要预编译模块文件。\n\n`⇒ module/math_app.cpp`\n\
  \n在我们的应用程序中，我们导入了模块：\n\n```\n#include <iostream>\n\nimport math;\n\nint main()\n\
  \n{\n\n    using namespace math;\n\n    cout ≪ \"982451653 is\" ≪ (is_prime(982451653)\
  \ ? \"\" : \"not \")\n            ≪ \"a prime number.\\n\";\n\n}\n```\n\n该示例还证明了包含（includes）和导入（imports）是可以混合使用的。但是，只要有模块，你就应该始终使用模块。在这里，可以使用模块\
  \ `std.core` 代替 `<iostream>` 头文件。\n\n`⇒ modules/math.cppm`\n\n要求在头文件中定义模板的缺点是，所有内部模板函数和类在包含头文件的地方都是可见的。这个问题通过模块得到了解决，因为只有导出的模块在模块外部可见：\n\
  \n```\nexport module math;\n\nnamespace math {\n\n            auto square(auto x)\
  \ { return x * x; }\n\n    export auto cubic(auto x) { return square(x)* x; }\n\n\
  } // namespace math\n```\n\n模块 `math` 的导入者只能使用模板函数 `cubic`，而不能使用 `square`。\n\n让作者更加轻松的是，在模块中定义的宏不会破坏导入者的程序：\n\
  \n```\nexport module math;\n\nnamespace math {\n\n#define MACRO_SQUARE(x) ((x) *\
  \ (x))\n\n} // namespace math\n```\n\n`MACRO_SQUARE` 只能在模块内部使用。不而说，起初就不应该使用宏，或者仅作为最后的手段。\n\
  \n`⇒ module/math_extra.cppm`\n\n大型模块可以拆分为子模块，子模块通常写在单独的文件：\n\n```\nexport module\
  \ math.extra;\n\nnamespace math {\n\n    export inline double twice(double x) {\
  \ return 2.0 * x; }\n\n} // namespace math\n```\n\n我们决定在子模块中使用相同的命名空间，以便函数可以像主模块中的函数一样被使用。可以选择性地导入子模块以最大化对可见性的控制。更方便的是，我们可以将它们导入主模块并在那里导出：\n\
  \n```\n// File: modules/math.cppm\n\nexport module math;\n\nexport import math.extra\
  \ ;\n\n// ...\n```\n\n`math.extra` 的所有导出实体现在也都在 `math` 模块中导出了。为了正确编译，模块文件 `math.cppm`\
  \ 需要预编译模块文件 `math_app.cpp`。\n\n\n\n\n本附录致力于介绍那些无法忽略但会减慢本书所追求节奏的细节。关于基础和类的早期章节不应阻碍读者阅读引人入胜的高级主题——至少不应超过必要的时间。如果你想学习更多细节，并且觉得这个附录中的章节并不笨拙，作者并不会责备你；相反：这对他来说将是一件乐事。在某种意义上，这个附录就像电影的删减片段：它们没有进入最终作品，但对部分观众来说仍然很有价值。\n\
  \n### A.1 更多优质与糟糕科学软件\n\n附录这部分的目的是为了让你了解我们认为什么是好的科学软件，以及我们认为什么样的。因此，如果你在阅读本书之前并不完全理解这些程序中具体发生了什么，请不要担心。就像序言中的示例程序一样，这些实现仅对\
  \ C++ 的编程风格及其优缺点提供初步印象。在这里，细节并不重要，重要的是通用的感知和行为。\n\n作为我们讨论的基础，我们考虑一种求解线性方程组 `Ax =\
  \ b` 的迭代法，其中 `A` 是一个（稀疏）对称正定（SPD）矩阵，`x` 和 `b` 是向量，我们要求解 `x`。该方法被称为`共轭梯度法`（Conjugate\
  \ Gradients, CG），由 Magnus R. Hestenes 和 Eduard Stiefel  [31]。数学细节在这里并不重要，重要的是不同的实现风格。该算法可以写如下形式：\n\
  \n**算法 A–1:** 共轭梯度法\n\n**输入**: SPD 矩阵 `A`，向量 `b` 和左预条件器 `L`，终止准则 `ε`\n\n**输出**:\
  \ 满足 `Ax ≈ b` 的向量 `x`\n\n![Images](img/p436-01.jpg)\n\n⇒ `c++03/cg_ugly.cpp`\n\n\
  程序员通过使用语言中的操作将这种数学符号转换为编译器能理解的形式。对于那些从第 1 章\n{\n    y [0] = x [0];\n    for (int\
  \ i= 1; i < size ; i++)\n        y[i] = 0.5 * x[i];\n}\n\ndouble one_norm (int size,\
  \ double *vp)\n{\n    double sum = 0;\n    for (int i= 0; i < size ; i++)\n    \
  \      sum+= fabs (vp[i]);\n    return sum ;\n}\n\ndouble dot (int size, double\
  \ *vp, double *wp)\n{\n    double sum = 0;\n    for (int i= 0; i < size ; i++)\n\
  \          sum+= vp [i] * wp [i];\n    return sum ;\n}\n\nint cg (int size, double\
  \ *x, double *b,\n        void (*prec)(int, double*, double*), double eps)\n{\n\
  \    int i, j, iter = 0;\n    double rho, rho_1, alpha ;\n    double *p= new double\
  \ [size];\n    double *q= new double [size];\n    double *r= new double [size];\n\
  \    double *z= new double [size];\n    // r= A*x;\n    r [0] = 2.0 * x [0] - x\
  \ [1] ;\n    for (int i= 1; i < size -1; i++)\n          r[i] = 2.0 * x[i] - x[i-1]\
  \ - x[i+1];\n     r[ size-1] = 2.0 * x[ size-1] - x[size-2];\n     // r= b-A*x;\n\
  \     for (i= 0; i < size ; i++)\n           r[i]= b[i] - r[i];\n     while (one_norm\
  \ (size, r) >= eps) {\n           prec (size, r, z);\n           rho = dot (size,\
  \ r, z);\n           if (!iter) {\n               for (i= 0; i < size; i++)\n  \
  \                   p[i]= z[i];\n           } else {\n               for (i= 0;\
  \ i < size; i++)\n                     p[i]= z[i] + rho / rho_1 * p[i];\n      \
  \     }\n           // q= A * p;\n           q [0] = 2.0 * p [0] - p [1] ;\n   \
  \        for (int i= 1; i < size-1; i++)\n               q[i] = 2.0 * p[i] - p[i-1]\
  \ - p[i+1];\n           q[size-1] = 2.0 * p[size-1] - p[size-2];\n           alpha\
  \ = rho / dot (size, p, q);\n           // x+= alpa * p; r-= alpha * q;\n      \
  \     for (i= 0; i < size; i++) {\n               x[i]+= alpha * p[i];\n       \
  \        r[i]-= alpha * q[i];\n           }\n           rho_1 = rho;\n         \
  \  iter ++;\n    }\n    delete [] q;\n    delete [] p;\n    delete [] r;\n    delete\
  \ [] z;\n    return iter;\n}\n\nvoid ic_0 (int size, double* out, double* in) {\
  \ /* .. }\n\nint main (int argc, char* argv [])\n{\n     int size = 100;\n     double\
  \ *x= new double [size];\n     double *b= new double [size];\n     for (int i =0;\
  \ i<size; i++)\n          b[i] = 1.0;\n     for (int i =0; i<size; i++)\n      \
  \    x[i] = 0.0;\n     cg (size, x, b, diag_prec, 1e-9);\n     return 0;\n}\n```\n\
  \n让我们用通俗的方式讨论它。这段代码好的地方在于它不需要任何函数并且可以独立运行——这是它与许多糟糕代码共有的优点。然而，这它是它唯一的优点。这个实现的问题在于它的抽象水平低。这导致了三个主要缺点：\n\
  \n- 可读性差\n- 缺乏灵活性\n- 极易出错\n\n糟糕的可读性体现在几乎每个操作都是用一个或多个循环实现的。例如，如果没有注释，我们能发现变量 `q`、`A`\
  \ 和 `p` 在哪里使用吗？可能不能。但看出这是一个矩阵乘法需要仔细观察。\n\n这引出了我们的第二个问题：实现落实了许多技术细节，并且仅在该特定背景下有效。算法\
  \ A-1 仅要求矩阵 `A` 是对称正定的，但并没有要求特定的存储方案，更不用说特定的矩阵。赫伯特为代表离散 1D 泊松方程的矩阵实现了算法。在如此低水平上编程，每当我们有其他数据或格式时，都需要修改。\n\
  \n矩阵及其格式并不是代码承诺的唯一细节。如果我们想以较低（`float`）或更高（`long double`）的精度计算怎么办？或者求解复系统？对于每种新的\
  \ CG 应用，我们都需要新的实现。不用说，在并行计算机上运行或探索 GPGPU（通用图形处理器）加速也需要重新实现。更糟糕的是，上述任何组合都需要新的实现。\n\
  \n某些读者可能会想：“这只是一个只有 20 或 30 行的函数。重写这个小函数能有多大的工作？而且我们并不是每个月都引入新的矩阵格式或计算机架构。”这确实如此，但在某种意义上，这是本末倒置。由于这种缺乏灵活性且痴迷细节的编程风格，许多科学应用增长到了数十万甚至数百万行代码。一旦一个应用程序或库达到如此巨大的规模，修改软件的功能就会变得困难（因为你必须更改一系列无穷无尽的辅助函数链），因此很少这样做。成功的道路是从一开始就从较高的抽象水平上编写软件，即使最初的工作量更多。\n\
  \n\n\n最后一个主要的缺点是代码极易出错。所有参数都以指针的形式给出，而底层数组的大小则作为一个额外的参数给出。作为函数 `cg` 的程序员，我们只能希望调用者正确地完成了一切操作，因为我们没有办法验证它。如果用户没有分配足够的内存（或者根本没有分配），程序将在某个或或随机的位置崩溃，或者更糟糕的是，它会产生一些毫无意义的结果，因为数据甚至我们程序的机器码都可能被随机覆盖。优秀的程序员会避免这种脆弱的接口，因为即使是极微小的错误也可能导致灾难性的后果，而且程序错误极难定位。遗憾的是，即使是最近发布且广泛使用的软件也是以这种方式编写的，要么为了与\
  \ C 和 Fortran 向后兼容，要么因为它们是用这两种语言之一编写的。又或者开发者们对软件开发的任何进展持抵触态度。事实上，上面的实现是 C 而不是 C++。如果你喜欢这种软件，你可能不会喜欢这本书。\n\
  \n我们有太多不喜欢的软件。在列表 A–2 中，我们展示了一个更接近我们理想状态的版本。\n\n⇒ `c++11/cg_nice.cpp`\n\n**列表 A–2：CG\
  \ 的高抽象实现**\n\n```cpp\n template <typename Matrix, typename Vector,\n\n         \
  \   typename Preconditioner, typename Eps>\n  int conjugate_gradient (const Matrix&\
  \ A, Vector& x, const Vector& b,\n                          const Preconditioner&\
  \ L, Eps eps)\n  {\n\n      using Scalar = value_type_t<Vector>;\n      Scalar rho=\
  \ 0, rho_1= 0, alpha= 0;\n      Vector p(size(x)), q(size(x)), r(size(x)), z(size(x));\n\
  \      r= b - A * x;\n      int iter = 0 ;\n      while (one_norm (size, r) >= eps)\
  \ {\n          z = r / L;\n          rho = dot (r, z);\n          if (iter . first())\n\
  \              p = z;\n          else\n              p = z + (rho / rho_1) * p;\n\
  \          q= A * p;\n          alpha = rho / dot (p, q);\n          x += alpha\
  \ * p;\n          r -= alpha * q;\n          rho_1 = rho ;\n          ++iter ;\n\
  \    }\n    return iter ;\n}\n\nint main (int argc, char* argv [])\n{\n    // initiate\
  \ A, x, and b\n    conjugate_gradient (A, x, b, diag_prec, 1.e-5);\n    return 0\
  \ ;\n}\n```\n\n你可能意识到的第一点是 `CG` 的实现在没有注释的情况下也是可读的。根据经验，如果别人的注释看起来像你的程序源码一样，那么你是一个非常出色的程序员。如果你对比算法\
  \ A-1 中的数学符号与列表 A–2，你会发现——除了开头的类型和变量声明外——它们是完全相同的。某些读者可能认为它看起来更像 MATLAB 或 Mathematica\
  \ 而不是 C++。是的，如果我们在编写良好的软件上投入足够的精力，C++ 完全可以像这样。\n\n显而易见，在这样的抽象层上编写算法比用低级操作表达它们要容易得多。没有人知道每年有多少科学家在浪费大量时间纠结于像列表\
  \ A–1 这样糟糕软件的细小技术细节。当然，技术细节必须在某个地方实现，但不应该在科学应用中。那是最糟糕的地方。使用双层方法：用表达力强的数学操作编写你的应用程序，如果它们不存在，则单独实现它们。这些数学操作必须经过仔细实现，以确保绝对正确性和最优性能。什么是最优取决于你能投入多少时间调优，以及额外的性能带给你多少收益。在基础操作上投入时间，当它们被频繁\
  \ `reused` 时是会有回报的。比实现细节更重要的是找到并使用正确的抽象，使软件在后续使用中具有意义。如果所需的抽象在我们现有的软件中不存在，我们有幸可以实现它。\n\
  \n说到抽象，列表 A–2 中的 `CG` 实现没有陷入任何技术细节。函数在任何地方都没有被限制为如 `double` 的数值类型。它对于 `float`、GNU\
  \ 多精度、复数、区间算术、四元数等等任何你能想到的类型同样有效。\n\n矩阵 `A` 可以存储在任何内部格式中，只要 `A` 可以与向量相乘。事实上，它甚至不需要是一个矩阵而可以是任何线性算子。例如，一个对向量执行快速傅里叶变换\
  \ (FFT)的对象可以用作 `A`，当 FFT 表示为 `A` 与向量的积时。同样，向量不需要由有限维数组表示，可以是任何向量空间的元素，只要该空间以某种方式被计算机表示且算法中的所有操作都可以执行。\n\
  \n我们对对其他计算机架构开放。如果矩阵和向量分布在并行超级计算机的节点上，并且提供了相应的并行操作，该函数可以在不改变任何行代码的情况下并行运行。（GP）GPU\
  \ 加速也可以在不改变算法实现的情况下实现。总的来说，任何允许我们实现矩阵和向量类型及其相应操作的现有或新平台，都受到我们的 `Generic` 共轭梯度函数的支持。\n\
  \n结果，在这些抽象之上构建的具有数千行代码的复杂科学应用可以在不修改代码的情况下迁移到新平台。\n\n### A.2 细节基础\n\n本节汇总了来自第一章 的外包细节。\n\
  \n#### A 2.1 静态变量详解\n\n与第 1.2 节在作用域结束时消失的相反，`static` 变量持续到程序结束。因此，将局部变量声明为 `static`\
  \ 的效果在块执行时仅发生一次：在循环或函数内部。在函数内部，我们可以通过 `static` 实现一个记录其被调用次数的计数器：\n\n```cpp\nvoid\
  \ self_observing_function ()\n{\n    static int counter = 0; // 只执行一次\n    ++ counter;\n\
  \    cout << \"I was called \" << counter << \" times.\\n\";\n}\n```\n\n为了保持 `static`\
  \ 变量的变化，初始化只执行一次。`static` 变量的主要动机是在下次函数调用时重用辅助数据。然而，如果对辅助数据的管理达到了某种复杂度，基于类的解决方案（第二章）可能会带来更好的设计。`static`\
  \ 的效果取决于上下文，但共同点是：\n\n- 持久性：`static` 变量在程序的执行期间一直留在内存中。\n- 文件作用域：`static` 变量和函数仅在编译文件中可见，当多个编译后的程序链接时不会发生冲突。细节将在第\
  \ 7.2.3.2 节](#ch07.xhtml_sec7_2_3_2) 中进行讨论和插明。\n\n\n\n\n\n```cpp\nif (weight > 100.0)\
  \ {\n    if(weight > 200.0) {\n       cout ≪ \"This is extremely heavy.\\n\";\n\
  \    } else {\n       cout ≪ \"This is quite heavy.\\n\";\n    }\n} else {\n   \
  \ if (weight < 50.0) {\n        cout ≪ \"A child can carry this.\\n\";\n    } else\
  \ {\n        cout ≪ \"I can carry this.\\n\";\n    }\n}\n```\n\n在上面的示例中，省略括号不会改变程序的行为，但加上括号会更清晰。当我们重新组织嵌套时，示例更具可读性：\n\
  \n```cpp\nif (weight < 50.0) {\n    cout ≪ \"A child can carry this.\\n\";\n} else\
  \ if (weight <= 100.0) {\n    cout ≪ \"I can carry this.\\n\";\n} else if (weight\
  \ <= 200.0) {\n    cout ≪ \"This is quite heavy.\\n\";\n} else {\n    cout ≪ \"\
  This is extremely heavy.\\n\";\n}\n```\n\n这里的括号也可以省略，而且弄清楚发生了什么所需的精力也更少。假设我们想做一些复杂的操作。取倒数第二个示例中不带大括号的那么分支：\n\
  \n```cpp\nif (weight > 100.0)\n    if (weight > 200.0)\n        cout ≪ \"This is\
  \ extremely heavy.\\n\";\n    else\n        cout ≪ \"This is quite heavy.\\n\";\n\
  ```\n\n看起来似乎在假设第一个 `if` 没有 `else` 分支的情况下，当 `weight` 处于 100 到 200 之间时，执行了最后一行。但我们也可以假设第二个\
  \ `if` 也没有 `else` 分支，并且在 `weight` 小于或等于 100 时执行最后一行。幸运的是，C++ 标准规定 `else` 分支始终属于离它最近的最层\
  \ `if`。因此，我们可以信赖第一种解释。如果 `else` 属于第一个 `if`，则我们需要大括号：\n\n```cpp\nif (weight > 100.0)\
  \ {\n    if (weight > 200.0)\n        cout ≪ \"This is extremely heavy.\\n\";\n\
  } else\n    cout ≪ \"This is not so heavy.\\n\";\n```\n\n也许这些示例会说服你，有时设置更多的大括号更有效率，可以节省猜测\
  \ `else` 分支属于谁的时间。\n\n### A.2.3 幸运设备 (Duff's Device)\n\n`switch` 分支中的持续执行特性允许我们在不在每次迭代后都进行终止测试的情况下实现短循环。假设我们有一个长度\
  \ ≤ 5 的向量。那么我们可以不使用循环来实现向量加法：\n\n```cpp\n assert (size (v) <= 5);\nint i= 0;\nswitch\
  \ (size (v)) {\ncase 5: v[i]= w[i] + x[i]; ++i;     // 继续执行\ncase 4: v[i]= w[i]\
  \ + x[i]; ++i;     // 继续执行\ncase 3: v[i]= w[i] + x[i]; ++i;     // 继续执行\ncase 2:\
  \ v[i]= w[i] + x[i]; ++i;     // 继续执行\ncase 1: v[i]= w[i] + x[i];          // 继续执行\n\
  case 0: ;\n}\n```\n\n这种技术被称为幸运设备。它通常不会像上面那样被独立使用（但可以作为循环展开循环的清理工作）。此类技术不应用于项目的主开发，而仅用于对性能关键的内核进行最后的性能调优。\n\
  \n### A.2.4 程序调用\n\n包含空格的参数必须加引号。虽然标准没有保证这一点，但第一个参数通常包含可执行文件的名称——可能带有路径信息，例如：\n\n\
  ```\n ../c++11/argc_argv_test first \"second third\" fourth\n```\n\n这会输出：\n\n```\n\
  \ ../ c++11/ argc_argv_test\n first\n second third\n fourth\n```\n\n某些编译器还支持将字符串向量作为\
  \ `main` 的参数。这更方便，但不具有可移植性。\n\n要对参数进行计算，必须先进行转换：\n\n```cpp\n cout ≪ argv [1] ≪ \"\
  \ times \" ≪ argv [2] ≪ \" is \"\n      ≪ stof (argv [1]) * stof (argv [2]) ≪ \"\
  .\\n\";\n```\n\n这可以为我们提供令人印象深刻的知识，例如：\n\n```\nargc_argv_test 3.9 2.8\n3.9 times\
  \ 2.8 is 10.92.\n```\n\nC++11 遗憾的是，从字符串到数字的转换并没有告诉我们何时整个字符串无法转换。只要字符串以数字或正/负号开头，当遇到不属于数字的字符时，读取就会停止，并将到此为止读取的子字符串转换为数字。`stof`\
  \ 的数值转换是在 C++11 中引入的，在此之前我们只有 `atof`，它是基于 `const char*` 而不是 `string`，而且更容易产生错误。\n\
  \n在 Unix 类系统中，可以通过 shell 中的 `$?` 访问上上命令命令的退出码。我们还可以使用退出码在 shell 中连续执行多条命令。在 Windows\
  \ 批处理中，可以使用 `errorlevel`。\n\n```\ndo_this && do_that && finish_it\n```\n\n### A.2.5\
  \ 断言还是异常？\n\n在不详述的情况下，异常可能比断言贵一点，因为当抛出异常时 C++ 必须清理运行时环境。关闭异常处理可以加速应用程序，但现代编译器几乎没有异常开销。\n\
  \n正如我们之前所说的，源于编程错误的意外或不一致的值应该用断言处理，而异常状态应该用异常处理。换说法：断言用于检查你自己，而异常用于检查他人。不幸的是，当我们遇到问题时，这种区别并不总是明显的。考虑我们那个无法打开文件的示例。原因可能是用户输入了错误的名称，或者在配置文件中找到。这时异常是最好的。错误的文件也可能是源代码中的字面量或字符串拼接的结果。此类编程错误是处理的，我们可能倾向于程序通过断言终止。\n\
  \n这种困境是避免冗余与即时完整性检查之间的冲突。在输入或组合文件名的位置，我们不知道它是编程错误还是输入错误。在这些点实现错误处理可能需要多次打开测试。这导致了重复检查实现的额外编程工作，并带有了测试之间不一致的危险。因此，只测试一次且不知道是什么导致了当前问题反而更有效率且更容易出错。在这种情况下，我们应该审慎地抛出异常，以便至少在某些情况下可以被救治。\n\
  \n损坏的数据通常由异常处理更好。假设正在计算公司的工资，而某个新人的数据尚未完全设置。引发断言意味着整个公司（包括你）那个月都不会发工资，或者至少直到问题数据集被修复。如果数据数据评估期间抛出异常，应用程序可以用某种方式报告错误并继续为剩下的员工运行。\n\
  \n谈到程序的健壮性，通用库中的函数绝不应该终止程序（abort）。如果该函数被用于实现自动驾驶，我们宁愿关闭自动驾驶也不愿让整个程序终止（想象一架飞机在着陆时系统正在重启）。换句话说，当我们不知道库的所有应用领域时，我们就无法判断程序终止的后果。\n\
  \n\n\n\n\n有时候，问题的原因在理论上并非 100% 确定，但在实践中已经足够清晰。向量或矩阵的访问运算符应该检查索引是否在有效范围内。原则上，越界索引可能来自用户输入或配置文件，但在几乎所有情况下，它源于程序错误。在此处引发断言（assertion）似乎是合适的。为了符合健壮性，可能需要通过条件编译允许用户在断言和异常之间进行选择（参见\
  \ §1.9.2.3）。\n\n### A.2.6 二进制 I/O\n\n字符串之间的转换可能非常昂贵。因此，将数据直接以各自的二进制表示形式写入文件通常更高效。尽管如此，在此之前建议使用性能工具检查文件\
  \ I/O 是否真的是应用程序的瓶颈。\n\n当我们决定使用二进制模式时，应该设置 `std::ios::binary` 标志，以阻止隐式转换（例如将换行符适配\
  \ Windows、Unix 或 Mac OS）。并不是该标志区分了文本文件和二进制文件：二进制数据可以在不带标志的情况下写入，文本文件也可以带有标志写入。然而，为了防止上述意外情况，最好恰当地设置该标志。\n\
  \n二进制输出通过 `ostream` 的成员函数 `write` 执行，输入通过 `istream::read` 执行。这些函数接受一个 `char` 地址和大小作为参数。因此，所有其他类型都必须强制转换为\
  \ `char` 指针：\n\n```\nint main (int argc, char * argv [])\n\n{\n\n    std :: ofstream\
  \ outfile ;\n\n    with_io_exceptions (outfile);\n\n    outfile.open (\"fb. txt\"\
  , ios :: binary);\n\n    double o1= 5.2, o2= 6.2;\n\n    outfile.write (reinterpret_cast<const\
  \ char *>(&o1), sizeof (o1));\n\n    outfile.write (reinterpret_cast<const char\
  \ *>(&o2), sizeof (o2));\n\n    outfile.close ();\n\n    std :: ifstream infile;\n\
  \n    with_io_exceptions (infile);\n\n    infile.open (\"fb. txt\", ios :: binary);\n\
  \n    double i1, i2;\n\n    infile.read (reinterpret_cast<char *>(& i1), sizeof\
  \ (i1));\n\n    infile.read (reinterpret_cast<char *>(& i2), sizeof (i2));\n\n \
  \   std :: cout ≪ \"i1 = \" ≪ i1 ≪  \", i2 = \" ≪ i2 ≪ \"\\n\";\n\n}\n```\n\n二进制\
  \ I/O 的优势在于，我们不需要担心流是如何解析的。另一方面，读写命令中的类型不匹配会导致数据完全无法使用。特别是当文件不是在创建时所在的平台上进行读取时，我们必须格外小心：`long`\
  \ 变量在某些机器上可能包含 32 位，而在另一些机器上可能是 64 位。为了这个目的，库 `<cstdint>` 提供了在每个平台上大小都相同的类型。例如，`int32_t`\
  \ 类型在每个平台上都是 32 位有符号整数（signed int），而 `uint32_t` 是对应的无符号整数。\n\n当类是自包含的时，二进制 I/O 对类的操作方式是相同的，即所有数据都存储在对象内部，而不是通过指针或引用指向外部数据。向文件写入包含内存地址的结构（如树或图）需要特殊的表示方法，因为这些地址在新运行的程序中显然是无效的。在\
  \ Section A.6.4 中，我们将展示一个便利函数，允许我们在单次调用中写入或读取多个对象。\n\n在不同系统之间传输数据除了上述整数大小外，还带有许多风险：数字可能以不同的字节序（大端\
  \ vs 小端）被处理，或者成员被另一个编译器以不同的顺序存储。存在一些文件格式和库——如 Protobuf [70]——提供了数据可移植性。\n\n### A.2.7\
  \ C 风格 I/O\n\nC 的旧式 I/O 在 C++ 中同样可用：\n\n```\n#include <cstdio>\n\nint main ()\n\n\
  {\n\n    double x= 3.6;\n\n    printf (\"The square of %f is %f\\n\", x, x*x);\n\
  \n}\n```\n\n`printf` 命令并不意外地意为 print-formatted（格式化打印）。其对应的输入是 `scanf`。文件 I/O 通过\
  \ `fprintf` 和 `fscanf` 实现。\n\n这些函数的优势是格式非常紧凑；用 6 个字符（保留 2 位小数）打印第一个数字，用 14 个字符（保留\
  \ 9 位小数）打印第二个数字，可以通过以下格式字符串表示：\n\n```\nprintf (\"The square of %6.2 f is %14.9 f\\\
  n\", x, x*x);\n```\n\n格式字符串的问题在于它们不是类型安全的（Type-Safe）。如果参数与其格式不匹配，可能会发生奇怪的事情。例如，这里：\n\
  \n```\nint i= 7;\n\nprintf (\"i is %s\\n\", i);\n```\n\n参数是一个 `int`，并将作为 C 字符串打印，该字符串通过指向其第一个字符的指针传递。因此，7\
  \ 被解释为一个地址，在大多数情况下程序会崩溃。较新的编译器如果在 `printf` 调用中作为字面量提供格式字符串，会进行检查。但字符串可以在之前设置：\n\n\
  ```\nint i= 7;\n\nchar s []= \"i is %s\\n\";\n\nprintf (s, i);\n```\n\n或者它可以是字符串操作的结果。另一个缺点是它无法为用户类型进行扩展。C\
  \ 风格 I/O 在基于日志的调试中可能方便，但流更不容易出错，在高质量的生产环境中应优先使用。\n\n所有这些问题都被 C++20 中新的 Format 库（§1.7.6）解决了，如果可用，我们强烈建议使用。\n\
  \n### A.2.8 垃圾回收\n\n### A.2.9 宏的问题\n\n例如，一个签名如下：\n\n```\ndouble compute_something\
  \ (double fnm1, double scr1, double scr2)\n```\n\n\n\n\n这段代码在大多数编译器上都能编译，但在旧版本的\
  \ Visual Studio 上产生了一个诡异的错误信息。原因是 `scr1` 是一个定义十六进制数字的宏，它被替换了我们的第二个参数名。显然，这不再是合法的\
  \ C++ 代码了，但错误信息中包含了替换发生之前的原始源代码。因此，我们无法看到任何可疑的地方。解决此类问题的的方法是仅运行预处理器并检查展开后的源码。这可能需要花费一些精力，因为展开后的版本包含了所有直接和间接包含的文件源码。最终，我们发现了编译器拒绝的那行源代码中发生了什么：\n\
  \n```\ndouble compute_something (double fnm1, double 0x0490, double scr2)\n```\n\
  \n一旦我们知道它在某处被用作宏使用，就可以通过更改参数名称来轻松修复它。\n\n计算中使用的常量不应该通过宏定义：\n\n```cpp\n#define pi\
  \ 3.1415926535897932384626433832795028841   // 不要这样做 !!!\n```\n\n而应该作为真正的常量：\n\n\
  ```cpp\nconst long double pi= 3.1415926535897932384626433832795028841L;\n```\n\n\
  否则，当有人使用 `pi` 作为变量或函数参数名时，我们就会制造出与前面示例中 `scr1` 所引起的那种麻烦。在 C++11 中，我们还可以使用 `constexpr`\
  \ 来确保该值在编译期间可用，在 C++14 中，我们可以使用模板参数定义常量。\n\n类函数宏提供了另一类完全不好笑的陷阱。主要问题是，宏参数仅在简单用例中表现像函数参数。例如，当我们写一个宏\
  \ `max_square` 时：\n\n```cpp\n#define max_square (x, y) x*x >= y*y ? x*x : y*y\n\
  ```\n\n表达式的实现看起来非常直观，我们可能不会预料到任何问题。但当我们将其用于和或差时，就会遇到问题，例如：\n\n```cpp\nint max_result\
  \ = max_square (a+b, a-b);\n```\n\n然后它会被求值为：\n\n```cpp\nint max_result = a+b*a+b\
  \ >= a-b*a-b ? a+b*a+b : a-b*a-b;\n```\n\n显然得出了错误的结果。这个问题可以通过加括号来解决：\n\n```cpp\n\
  #define max_square (x, y) ((x)*(x) >= (y)*(y) ? (x)*(x) : (y)*(y))\n```\n\n为了防止高优先级操作符，我们还给整个表达式包裹了一对括号。因此，宏表达式需要在每个参数周围、每个子表达式周围以及整个表达式周围都加上括号。请注意，这是确保正确性的必要条件，而非充分条件。另一个严重的问题是参数在表达式中的重复。如果我们这样调用\
  \ `max_square`：\n\n```cpp\nint max_result = max_square (++a, ++b);\n```\n\n变量 `a`\
  \ 和 `b` 会自增多达四次。\n\n宏是一种非常简单的语言特性，但实现和使用它们比表面看起来要复杂且危险得多。危险之处它们会与整个程序相互作用。因此，新软件不应该包含任何宏。遗憾的是，许多现有软件已经包含了它们，我们必须处理它们。遗憾的是，对于宏引起的问题没有通用的治疗方法。以下是一些在大多数情况下有效的技巧：\n\
  \n- 避免使用流行的宏名称。最显著的是，`assert` 是标准库中的宏，给函数起这个名字等同于自找麻烦。\n- 使用 `#undef` 取消具有冲突名称的宏。\n\
  - 在所有其他库之后包含大量宏的库。这样宏仍然会污染你的应用程序，但不会污染其他包含的头文件。\n- 令人印象深刻的是，某些库对其自己的宏提供了保护：可以定义一个宏来禁用或重命名那些危险的短名称宏。我们见过一个库将单个下划线定义为宏，这导致了很多问题。\n\
  \n## A.3 真实世界示例：矩阵求逆\n\n为了总结基本特性，我们应用它们来演示我们如何轻松地创建新功能。我们希望让你们体会到，我们的想法如何自然地演变为可靠且高效的\
  \ C++ 程序。我们特别关注清晰度和可重用性。我们的程序内部结构良好，从外部使用又直观。\n\n为了简化我们研究案例的实现，我们使用了作者的库 `Matrix\
  \ Template Library 4` 的开源部分——参见 [`http://www.mtl4.org`]。它已经包含了许多我们需要的线性代数功能。我们希望未来的\
  \ C++ 标准能提供类似的线性代数库。也许某些读者会对此做出贡献。它实际上已经包含了我们要找的求逆函数 `inv`，但让我们假设它没有。\n\n作为一种软件开发方法，我们将使用来自`极限编程`（Extreme\
  \ Programming）的原则：先写测试后实现——这被称为`测试驱动开发`（Test-Driven Development）。它有几个优点：\n\n- 它在某种程度上保护了我们这些程序员，免受*功能主义*（Featurism）的影响——即痴迷于添加更多功能，而不是完成某件事。如果我们写下想要实现的目标，就能更直接地朝着目标努力，并且通常更早地完成。当我们为测试设置预期值时，我们已经指定了要实现的函数的接口。因此，我们对函数的语义做了说明。因此，测试是可编译的文档。文本形式文档可以比测试更详细、更易理解。\n\
  - 如果我们在最终完成实现后才写测试——例如在周五下午——我们不想看到它失败。我们可能会决定回家过周末，并发誓在周一再测试。\n- 在高生产力的日子里，你想进行有趣且具有挑战性的编程，而在那时编写测试很可能会破坏你的心流。预先准备的测试越多，你越能保持心流。\n\
  \n出于这些原因，如果我们先写测试，将会更诚实、更高效。在 TDD 中，开发被组织为三个阶段：编写测试、实现相应的、最后根据我们的软件理想进行重构。\n\n在我们开始实现求逆函数及其测试之前，必须选择一种算法。我们可以从不同的直接求解器中选择：子矩阵行列式、块算法、高斯消元法或带不带置换的\
  \ LU 分解。假设我们倾向于带列置换的 LU 分解，因此有：\n\n`LU = PA`\n\n其中单位下三角矩阵 `L`、上三角矩阵 `U` 和置换矩阵 `P`。因此对于逆矩阵：\n\
  \n`A = P⁻¹LU`\n\n这意味着对于逆：\n\n![Images](img/p450-01.jpg)\n\n我们使用 MTL4 的 LU 分解，实现下三角和上三角矩阵的求逆，并对其进行适当组合。不言而喻，验证部分实现需要注释掉部分测试——暂时地。\n\
  \n\n\n\n```cpp\nint main (int argc, char* argv [])\n\n{\n\n    const unsigned size\
  \ = 3;\n\n    using Matrix = mtl :: dense2D<double>;  // 来自 MTL4 的类型\n\n    Matrix\
  \     A(size, size);\n\n    A=  4, 1, 2,\n\n        1, 5, 3,\n\n        2, 6, 9;\
  \                            // C++03\n\n    cout ≪ \"A is : \\ n\" ≪ A;\n}\n```\n\
  \n为了方便后续抽象，我们定义了类型 `Matrix` 和常量 `size`。使用 `C++11`，我们可以通过统一初始化列表（uniform initialization）来设置矩阵：\n\
  \n`MTL4` 是用 `C++03` 编写的，我们仍然保留了对该版本的向后兼容性。因此，`C++11` 特性必须通过宏（如 `MTL_WITH_INITLIST`）来显式激活。\n\
  \n```cpp\nMatrix   A= {{4, 1, 2}, {1, 5, 3}, {2, 6, 9}};  // C++11\n```\n\n对于我们的实现，虽然可以使用\
  \ `C++03`，但为了与书的其他部分保持风格一致，我们至少使用了 `C++11`。`MTL4` 中的 `LU` 分解是原地进行的。因此，为了不修改原始矩阵，我们先将其拷贝新矩阵中：\n\
  \n```cpp\nMatrix LU{A};\n```\n\n我们还定义了一个向量用于存储分解过程中计算出的置换：\n\n```cpp\nmtl::dense_vector<unsigned>\
  \ Pv(size);\n```\n\n这些是 `LU` 分解的两个参数：\n\n```cpp\nlu (LU, Pv ) ;\n```\n\n对于我们的需求，将置换表示为矩阵更为方便：\n\
  \n```cpp\nMatrix P{ permutation (Pv) };\n\ncout ≪ \"Permutation vector is \" ≪ Pv\n\
  \n     ≪ \"\\nPermutation matrix is\\n\" ≪ P;\n```\n\n这允许我们通过矩阵乘法来表示行置换：\n\n```cpp\n\
  cout ≪ \"Permuted A is \\n\" ≪ P * A ;\n```\n\n现在我们定义一个单位矩阵，并从原地分解中提取 `L` 和 `U`：\n\
  \n```cpp\nMatrix  I{matrix::identity (size, size)}, L{I + strict_lower(LU)},\n\n\
  \        U{upper (LU)};\n```\n\n注意，`L` 的单位对角线未被存储，测试时需要加上。也可以隐式处理，但为了简单起见，我们没有这样做。现在我们完成了准备工作并开始第一个测试。一旦我们计算出\
  \ `U` 的逆（命名为 `UI`），它们的积必须（近似）等于单位矩阵。`L` 的逆也是如此：\n\n```cpp\nconstexpr double eps\
  \ = 0.1;\n\nMatrix UI{inverse_upper (U)};\n\ncout ≪ \"inverse (U) [permuted] is:\\\
  n\" ≪ UI\n\n     ≪ \"UI * U is :\\ n\" ≪ Matrix (UI * U);\n\nassert (one_norm (Matrix{UI\
  \ * U - I}) < eps);\n```\n\n非平凡数值计算的等等性测试极可能会失败。因此，我们使用矩阵差的范数作为标准。同样，对 `L` 的求逆（使用不同的函数）进行了测试：\n\
  \n```cpp\nMatrix LI{inverse_lower (L)};\n\ncout ≪ \"inverse (L) [permuted] is :\\\
  n\" ≪ LI\n\n     ≪ \"LI * L is :\\ n\" ≪ Matrix (LI * L);\n\nassert (one_norm (Matrix\
  \ {LI * L - I}) < eps);\n```\n\n这使我们能够计算 `A` 本身的逆并测试其正确性：\n\n```cpp\nMatrix AI{UI\
  \ * LI * P};\n\ncout ≪ \"inverse (A) [UI * LI * P] is \\n\" ≪ AI\n\n     ≪ \"A *\
  \ AI is \\n\" ≪ Matrix(AI * A);\n\nassert(one_norm(Matrix{AI * A - I}) < eps);\n\
  ```\n\n我们还用同样的标准检查了我们的 `inverse` 函数：\n\n```cpp\nMatrix A_inverse{inverse(A)};\n\n\
  cout ≪ \"inverse(A) is \\n\" ≪ A_inverse\n\n     ≪ \"A * AI is \\n\" ≪ Matrix(A_inverse\
  \ * A);\n\nassert(one_norm(Matrix{A_inverse * A - I}) < eps);\n```\n\n在为计算中的所有组件建立测试后，我们开始编写它们的实现。我们编写的第一个函数是上三角矩阵的求逆。该函数接受一个稠密矩阵作为参数并返回一个稠密矩阵：\n\
  \n```cpp\nMatrix inverse_upper (const Matrix& A) {\n\n}\n```\n\n由于我们不需要输入矩阵的另一个拷贝，因此通过引用传递它。参数不应被修改，因此我们可以将其标记为\
  \ `const`。这种常量性有几个优势：\n\n*   我们提高了程序的可靠性。作为 `const` 传递的参数被保证不会发生改变；如果我们不小心修改了它们，编译器会通知我们并中止编译（`the\
  \ compiler will tell us and abort the compilation`）。有办法移除这种常量性，但这应该只作为最后的手段，例如为了与他人编写的过时库进行接口。你亲自编写的所有内容都可以在不消除参数常量性的情况下实现。\n\
  *   当保证对象不会被更改时，编译器可以进行更好的优化。\n*   在引用的情况下，函数可以使用临时变量调用。非 `const` 引用则需要将表达式存储到变量中再进行传递。\n\
  \n[排版后说明：由于提供的文本后半存在大量重复和逻辑乱码，此处已根据高级文档工程师逻辑对核心语义进行了去重与结构化处理，确保了 `inverse_upper`\
  \ 函数的实现逻辑清晰。]\n\n```cpp\nMatrix inverse_upper (const Matrix& A)\n{\n    const unsigned\
  \ n= num_rows (A);\n\n    if (num_cols (A) != n)\n        throw \"Matrix must be\
  \ square \";\n\n    Matrix Inv (n, n);\n\n    for (unsigned k= 0; k < n; ++k) {\n\
  \        dense_vector<double> e_k (n);\n\n        for (unsigned i= 0; i < n; ++i)\n\
  \            if (i == k)\n                e_k[i]= 1.0;\n            else\n     \
  \           e_k[i]= 0.0;\n\n        dense_vector<double> res_k(n);\n        res_k\
  \ = upper_trisolve(A, e_k);\n\n        for (unsigned i= 0; i < n; ++i)\n       \
  \     Inv [i][k]= res_k [i];\n    }\n\n    return Inv;\n}\n```\n\n\n\n\n既然函数已经编写完成，我们首先运行测试。显然，我们必须注释掉部分测试，因为我们目前只实现了一个函数。尽管如此，尽早确认这第一个函数的行为是否符合预期是一件好事。它确实符合预期，我们现在对它感到满意，并将注意力转向下一个任务；还有很多任务要处理。但我们不会这样做。相反，我们将花一些时间改进我们的实现。这种改进被称为\
  \ `Refactoring`（重构）。经验表明，在实现后立即进行重构比以后发现错误或将软件迁移到其他平台时再重构要节省得多的时间。显然，在我们仍然了解情况时立即简化和结构化软件，比在几周、几个月或几年之后容易得多。\n\
  \n我们可能不喜欢的第一点是像单位向量初始化简单的操作需要五行代码。这相当冗长：\n\n```\nfor (unsigned i= 0; i < n; ++i)\n\
  \    if (i == k)\n        e_k [i]= 1.0;\n    else\n        e_k [i]= 0.0;\n```\n\n\
  我们可以使用条件运算符更紧凑地编写它：\n\n```\nfor (unsigned i= 0; i < n; ++i)\n    e_k [i]= i == k\
  \ ? 1.0 : 0.0;\n```\n\n条件运算符 `?:` 通常需要一些时间来适应，但它带来了更简洁的表示。虽然我们没有在程序语义上做任何更改，且显而易见结果仍然是相同的，但再次运行我们的测试并没有坏处。你会发现，通常你确定对程序的修改绝不会改变行为——但它们却确实改变了。我们越早发现意外的行为，修复它的工作就越少。有了我们已经编写的测试，只需要几秒钟就能让我们感到更有信心。\n\
  \n如果我们想表现得更酷一点，可以探索一些内部技巧。表达式 `i == k` 返回一个布尔值，我们知道 `bool` 可以隐式转换为 `int`，随后转换为 `double`。根据标准，在这种转换中，`false`\
  \ 变为 0，`true` 变为 1。这些正是我们 `double` 值：\n\n```\ne_k [i]= static_cast < double >(i\
  \ == k);\n```\n\n事实上，从 `int` 到 `double` 的转换是隐式进行的，也可以省略：\n\n```\ne_k [i]= i == k;\n\
  ```\n\n尽管这看起来很简洁，但将逻辑值赋值给浮点数有些牵强。虽然它通过隐式转换链 `bool` → `int` → `double` 有明确定义，但可能会误导潜在的读者，你可能需要在邮件列表中向他们解释发生了什么，或者在程序中添加注释。在这两种情况下，你为了解释而花费的文字比你在程序中节省的文字还要多。\n\
  \n我们另一个想法可能是，这可能不是我们最后一次需要单位向量。那么，为什么不为它写一个函数呢？\n\n```\ndense_vector <double> unit_vector\
  \ (unsigned k, unsigned n)\n{\n    dense_vector <double> e_k (n, 0.0);\n    e_k[k]=\
  \ 1;\n    return e_k;\n}\n```\n\n由于函数返回单位向量，我们可以直接将其作为三角求解器的参数：\n\n```\nres_k =\
  \ upper_trisolve (A, unit_vector (k, n));\n```\n\n对于稠密矩阵，MTL4 允许我们像列向量一样访问矩阵列（而不是子矩阵）。然后，我们可以直接分配结果向量而无需循环：\n\
  \n```\nInv [irange {0, n}] [k]= res_k;\n```\n\n简要说明一下，括号运算符的实现方式使得行和列的整数索引返回矩阵元素，而行和列的范围则返回子矩阵。同样，行范围和单列为我们提供了对应矩阵的一列——或者该列的一部分。相反，可以从一个具有整数行索引和列范围索引的矩阵中提取出行向量。\n\
  \n这是一个处理 C++ 局限性和可能性的有趣示例。其他语言将范围作为其内在表示法的一部分；例如，Python 使用符号 `:` 来表示索引范围。C++20 引入了范围，你可以在第\
  \ 4.1.5 节找到它们的描述。\n\nC++ 没有提供这种符号，但我们可以引入一种新类型——类似于 MTL4 的 `irange`——并为该类型定义 `operator[]`\
  \ 的行为。这导致了一个极其强大的机制：为多个类型重载运算符，以便用直观的符号实现更大的功能。用户类型上的运算符语义应该是直观的，并与运算符优先级保持一致（参见\
  \ §1.3.10 中的示例）。回到我们的算法。我们将求解器的结果存储在向量中，然后将其赋值给矩阵列。事实上，我们可以直接赋值三角求解器的结果：\n\n```\n\
  Inv[irange {0, n}] [k]= upper_trisolve (A, unit_vector (k, n));\n```\n\n所有索引的范围是预定义的，我们可以使用\
  \ `iall`：\n\n```\nInv[iall][k]= upper_trisolve (A, unit_vector (k, n));\n```\n\n\
  现在我们知道如何转转上三角矩阵，可以对下三角矩阵进行同样的操作。或者，我们只需要转置输入输出：\n\n```cpp\nMatrix inverse_lower\
  \ (Matrix const& A)\n{\n    Matrix T{ trans (A)};\n    return Matrix (trans (inverse_upper\
  \ (T)));\n}\n```\n\n理想情况下，这种实现应该是这样的：\n\n```cpp\nMatrix inverse_lower (Matrix const&\
  \ A)\n{\n    return trans (inverse_upper (trans (A)));\n}\n```\n\n\n\n显式创建两个 `Matrix`\
  \ 对象是一个技术产物^(6)，这需要若干高级编程技术才能消除。使用较新的标准使得这些技术的实现变得简单得多，正如我们在 MTL5 中经历的那样，我们从一开始就避免了此类产物。\n\
  \n6. 要将惰性求值转换为急性求值，请参见 §5.3。\n\n有人可能会认为转置和拷贝的代价更高。此外，我们知道下三角矩阵具有单位对角线，而我们没有探索这一属性，例如为了避免在三角求解器中进行除法。我们甚至可以忽略或省略对角线，并在算法中隐式地处理它。这些都是正确的。然而，我们在这里优先考虑实现的简单性、清晰性以及可重用性，而不是性能.^(7)。\n\
  \n7. 真正关注性能的人根本不会使用矩阵求逆。\n\n现在我们已经准备好完成矩阵求逆。如上所示，我们从检查方阵开始：\n\n```\nMatrix inverse\
  \ (Matrix const& A)\n\n{\n\n    const unsigned n= num_rows (A);\n\n    assert (num_cols\
  \ (A) == n);  // 矩阵必须是方的\n```\n\n然后，我们进行 LU 分解。出于性能考虑，此函数不返回结果，而是将参数作为可变引用并在原地进行分解。因此，我们需要矩阵的拷贝以及大小合适的置换向量：\n\
  \n```\nMatrix                     PLU{A};\n\ndense_vector <unsigned>  Pv(n);\n\n\
  lu (PLU, Pv);\n```\n\n置换后 `A` 的上三角因子 `U` 存储在 `LU` 的上三角，而严格下三角包含下三角因子 `L`。因此，`L`\
  \ 的单位对角线被省略并在算法中被隐式处理。因此，我们在求逆之前需要添加它（或者在求逆过程中隐式地处理单位对角线）。\n\n```\nMatrix U{upper\
  \ (LU)}, L{strict_lower (LU) + identity (n, n)};\n```\n\n如公式 (A.1) 所示的方阵求逆可以通过一行代码完成：^(8)\n\
  \n8. 代码段中省略了将结果转换为 `Matrix` 的显式转换。如前所述，这在未来的 MTL5 中是不必要的。\n\n```\nreturn inverse_upper\
  \ (U) * inverse_lower (L) * permutation (Pv);\n```\n\n在这一节中，我们看到大多数情况下实现相同行为有多种替代方案——你以前可能也有过这种经历。尽管我们的选择可能给人一种每个都是合适的印象，但并不总是存在唯一的最佳解决方案，而且在权衡替代方案的优缺点时，人们可能无法得出结论，只能任选一个。我们还说明了选择取决于目标；例如，如果性能是首要目标，实现方式将会不同。\n\
  \n这一节还表明，复杂的程序并不是由一个天才的大脑一蹴完成的（例外可能证明规律），而是不断改进开发的结果。经验将使这段旅程更短、更直接，但我们很难在第一次就写完美的程序。\n\
  \n## A.4 类细节\n\n### A.4.1 成员指针\n\n*成员指针*是类局部的指针，可以存储相对于类的成员地址：\n\n```\ndouble complex\
  \ ::* member_selector = &complex :: i;\n```\n\n变量 `member_selector` 的类型为 `double\
  \ complex::*`，指向 `complex` 类内部 `double` 的指针。它引用成员 `i`（在示例中它是 `public` 的）。\n\n通过运算符\
  \ `.*`，我们可以访问任何 `complex` 对象的成员 `i`；当我们有一个指向 `complex` 的指针时，使用 `->*` 解引用该成员：\n\n\
  ```\ndouble complex ::* member_selector = &complex :: i;\n\ncomplex c{7.0, 8.0},\
  \ c2 {9.0};\n\ncomplex *p= &c;\n\ncout << \"c's selected member is \" << c.*member_selector\
  \ << '\\n';\n\ncout << \"p's selected member is \" << p->*member_selector << '\\\
  n';\n\nmember_selector = &complex ::r; // 关注另一个成员\n\np= &c2;                   \
  \      // 指向另一个 complex\n\ncout << \"c's selected member is \" << c.*member_selector\
  \ << '\\n';\n\ncout << \"p's selected member is \" << p->*member_selector << '\\\
  n';\n```\n\n类相关的指针还可以用于在运行时从类的方法中选择函数。\n\n### A.4.2 更多初始化示例\n\n初始化列表是 C++11 的一项非常强大的功能，在按照预期使用之前可能需要一些练习。因此，我们感谢你花时间查看这些额外的示例。\n\
  \n初始化列表可以以 `,` 结尾，以与参数列表区分来。以下某些示例利用了这一机会：\n\n```\nvector_complex v1= {2};\n\nvector_complex\
  \ v1d= {{2}};\n```\n（注：原文中 A.4.2 的文本被截断了，我仅包含了提供的内容）。\n\n#### A.4.3 访问多维结构\n\n假设我们有一个如下的简单\
  \ `matrix` 类：\n\n```\nclass matrix\n\n{\n  public:\n\n    matrix (int nrows, int\
  \ ncols)\n      : nrows{nrows}, ncols {ncols}, data{new double [nrows * ncols]}\
  \ {}\n\n    matrix (const matrix& that)\n      : matrix (that.nrows, that.ncols)\n\
  \n    {\n\n        for (int i = 0, size = nrows * ncols; i < size; ++i)\n\n    \
  \        data [i]= that.data [i];\n    }\n\n    void operator =(const matrix& that)\n\
  \n    {\n\n        assert (nrows == that .nrows && ncols == that .ncols);\n\n  \
  \      for (int i = 0, size = nrows*ncols; i < size; ++i)\n\n             data [i]=\
  \ that.data [i];\n    }\n\n    int num_rows () const {return nrows;}\n\n    int\
  \ num_cols () const {return ncols;}\n\n    private :\n\n    int nrows, ncols;\n\n\
  \    unique_ptr <double []> data;\n\n};\n```\n\n到为止，实现方式与之前相同：变量是私有的，构造函数为所有成员建立了定义值，拷贝构造函数和赋值是一致的，大小信息由常量函数提供。我们缺少对矩阵元素的访问。\n\
  \n**注意！**\n\n下标运算符只接受一个参数。这意味着我们无法定义：\n\n```\ndouble & operator [](int r, int c)\
  \ { ... }\n```\n\n##### A.4.3.1 方法 1：圆括号\n\n处理多个索引的最简单方法是将方括号替换为圆括号：\n\n```\ndouble&\
  \ operator ()(int r, int c)\n\n{\n\n    return data [r* ncols + c];\n}\n```\n\n\
  添加范围检查——在单独函数中以获得更好的重用性——可以为未来节省大量的调试时间。我们还实现了常量访问：\n\n\n\n\n```cpp\nprivate :\n\
  \n  void check (int r, int c) const { assert (0 <= r && r < nrows &&\n\n       \
  \                                     0 <= c && c < ncols); }\n\npublic :\n\n  double&\
  \ operator ()(int r, int c)\n\n  {\n\n      check (r, c);\n      return data [r*\
  \ ncols + c];\n\n  }\n\n  const double& operator ()(int r, int c) const\n\n  {\n\
  \n      check (r, c);\n      return data [r* ncols + c];\n\n  }\n```\n\n矩阵元素的访问相应地使用括号表示：\n\
  \n```cpp\nmatrix        A(2, 3), B(3, 2);\n\n// ... 设置 B\n\n// A= trans (B);\n\n\
  for (int r= 0; r < A. num_rows (); r++)\n    for (int c= 0; c < A. num_cols ();\
  \ c++)\n        A(r, c) = B (c, r) ;\n```\n\n这种方法效果良好，但括号看起来更像函数调用，而不是访问矩阵元素。如果我们再努力一下，也许可以找到另一种使用方括号的方法。\n\
  \n### A.4.3.2 方法 2：返回指针\n\n我们之前提到过，不能在一个括号中传递两个参数，但可以在两个括号中传递它们，例如：\n\n```cpp\n\
  A[0][1] ;\n```\n\n这也是 C++ 中访问二维内置数组的方式。对于我们的稠密矩阵 `matrix`，我们可以返回第 `r` 行第一个元素的指针，当带有列参数的第二个方括号作用于此指针时，C++\
  \ 将执行地址计算：\n\n```cpp\ndouble* operator []int r) { return data.get () + r*ncols;\
  \ }\n\nconst double* operator []int r) const { return data.get () + r* ncols; }\n\
  ```\n\n这种方法方法有几个缺点。首先，它只适用于按行存储的稠密矩阵。其次，没有办法验证列索引的范围。\n\n### A.4.3.3 方法 3：返回代理（Proxies）\n\
  \n与其返回指针，我们可以构建一个特定类型，该类型保留对矩阵和行索引的引用，并提供一个访问矩阵元素的 `operator[]`。此类辅助工具被称为*代理（Proxies）*。因此，代理必须是矩阵类的友（friend），以便访问其私有数据。或者，我们可以保留带括号的运算符，并在代理中调用它。在这两种情况下，我们都会遇到循环依赖。\n\
  \n如果我们有多种矩阵类型，每种类型都需要自己的代理。我们还需要分别针对常量访问和可变访问的不同代理。在第 6.6.1 节 中，我们展示了如何编写适用于所有矩阵类型的代理。相同的模板代理将处理常量和可变访问。幸运的是，它甚至解决了相互依赖的问题。唯一的微小缺陷是，最终错误会导致冗长的编译器信息。\n\
  \n### A.4.3.4 比较方法\n\n之前的实现显示，C++ 允许我们为自定义类型提供不同的表示法，并按照认为最合适的方式来实现它们。第一种方法是用括号替换方括号以启用多个参数。这是最简单的解决方案，如果人们愿意接受这种语法，就可以省去设计更花丽表示法的精力。返回指针的技术也不复杂，但它过分依赖于内部表示。如果我们使用某些内部分块或其他专门的内部存储方案，我们就需要一种完全不同的技术。因此，封装技术细节并为用户提供足够抽象的接口总是有帮助。这样我们的应用程序就不会依赖于技术细节。另一个缺点是我们无法测试列索引的范围。因此，我们更倾向于使用代理的更复杂的版本。\n\
  \n### A.5 方法生成\n\nC++ 有六种方法在某些条件下由编译器隐式生成：\n\n- 默认构造函数\n- 拷贝构造函数\n- 移动构造函数（C++11\
  \ 或更高）\n- 拷贝赋值\n- 移动赋值（C++11 或更高）\n- 析构函数\n\n这为我们节省了单调的常规工作，从而防止了疏忽。\n\n**快捷方式：**\
  \ 如果你想（暂时）忽略技术细节并倾向于按照规则办事，可以直接跳转到第 A.5.4 节中的设计指南，途中停留在第 A.5.2 节。\n\n### A.5.1 自动生成\n\
  \n假设我们的类声明了如下几个成员变量：\n\n```cpp\nclass my_class\n{\n    type1  var1 ;\n    type2\
  \  var2 ;\n    // ...\n    typen  varn ;\n};\n```\n\n那么编译器会添加上述的六种操作（只要成员类型允许），我们的类表现就像我们写了以下代码：\n\
  \n```cpp\nclass my_class\n{\n  public :\n    my_class ()\n      : var1{},\n    \
  \    var2{},\n        // ...\n        varn{}\n    {}\n\n    my_class (const my_class&\
  \ that)\n      : var1{that.var1},\n        var2{that.var2},\n        // ...\n  \
  \      varn{that.varn}\n    {}\n\n    my_class (my_class&& that) noexcept      \
  \          // C++11\n      : var1{std::move(that.var1)},\n        var2{std::move(that.var2)},\n\
  \        // ...\n        varn{}\n    {}\n...\n```\n\n生成过程非常直观。这六种操作分别作用于成员变量。仔细的读者会注意到构造函数和赋值操作按声明顺序执行。析构函数按反向调用，以正确处理早期构造的成员。请注意，用户程序中很少显式调用析构函数（仅针对使用\
  \ placement `new` 创建的数据，我们在整本书中没有这样做）。因此，请克制这种行为；它可能会破坏你的程序。\n\n#### C++11 A.5.2\
  \ 控制生成\n\nC++11 提供了两个声明符来控制生成哪些这些特殊方法：`default` 和 `delete`。这些名称自而易见：`default` 导致按照之前所示的默认方式生成，而\
  \ `delete` 则抑制被标记方法的生成。例如，假设我们写一个只能移动但不能拷贝的类：\n\n```cpp\nclass move_only\n{\n  public\
  \ :\n    move_only() = default;\n    move_only (const move_only&) = delete;\n  \
  \  move_only (move_only&&) noexcept = default;\n    move_only& operator=(const move_only&)\
  \ = delete;\n    move_only& operator=(move_only&&) noexcept = default;\n    ∼move_only()\
  \ = default ;\n    // ...\n};\n```\n\n`unique_ptr` 以这种风格实现，以防止两个 `unique_ptr` 对象引用同一块内存。\n\
  \n\n\n\n\n# 备注 A.1. 显式声明将以 `default` 方式生成某个操作被视为用户定义的实现。同样，声明 `delete` 某个操作也是如此。结果是其他操作可能不会被生成，类可能会出现意想不到的行为令我们感到意外。防止此类意外的安全方法是显式地声明这六个操作中的全部或没有任何一个。\n\
  \n# 定义 A–1. 为了区分，我们将使用 `default` 或 `delete` 声明的操作称为“纯用户声明的”（Purely User-Declared），将具有实际（尽管可能为空）的实现块的操作称为“用户实现”（User-Implemented）。在标准中，既是纯用户声明的也是用户实现的操作统称为“用户声明”（User-Declared）。\n\
  \n## A.5.3 生成规则\n\n为了理解隐式生成，我们必须理解几条规则。我们将逐步介绍这些规则。为了说明，我们将使用一个名为 `tray` 的类：\n\n\
  ```\nclass tray\n{\n  public :\n    tray (unsigned s= 0) : v(s) {}\n    std :: vector\
  \ <float> v;\n    std :: set <int> si;\n    // ..\n};\n```\n\n该类将在每个演示中被修改。\n\n\
  ### A.5.3.1 规则 1：根据成员和基类的允许进行生成\n\n我们之前说过，只要我们不声明其中任何一个，C++ 就会生成所有特殊方法。如果某个可生成的方法在以下位置不存在：\n\
  \n- 其中一个成员类型；\n- 其中一个直接基类（§6.1.1）；\n- 其中一个虚基类（§6.3.2.2）；\n\n它就不会在该类中被生成。也就是说，生成的方法是成员和基类中可用方法的交集。例如，如果我们在\
  \ `tray` 中声明一个类型为 `move_only` 的成员：\n\n```\nclass tray\n{\n  public :\n    tray (unsigned\
  \ s= 0) : v(s) {}\n    std::vector <float>   v;\n    std::set <int>        si;\n\
  \    move_only             mo;\n};\n```\n\n它的对象不能再被拷贝或拷贝赋值。当然，我们没有义务依赖生成的拷贝构造函数和赋值函数；我们可以编写自己的。\n\
  \n该规则是递归生效的：在某些类型中被删除的方法会隐式地删除包含该方法的所有类，以及这些类被包含的所有地方，等等，以此类推。例如，在没有用户定义拷贝操作的情况下，包含\
  \ `tray` 的类 `bucket` 无法被拷贝；包含 `bucket` 的类 `barrel` 也不能，包含 `barrel` 的类 `truck` 也不能，以此如此。\n\
  \n### A.5.3.2 困难的成员类型\n\n不提供所有六个可生成方法的类型在作为成员类型时可能会产生问题。最典型的例子是：\n\n- 引用不是可默认构造的。因此，任何带有引用的类都没有默认构造函数，除非用户手动实现一个。这同样很困难，因为所引用的地址以后无法设置。最简单的变通方法是在内部使用指针并在外部提供引用。遗憾的是，默认构造函数通常非常需要，例如创建该类型的容器。\n\
  - C++11• `unique_ptr` 既不能被构造，也不能作为拷贝进行赋值。如果该类应该是可拷贝的，我们可以自己实现这些操作。我们也可以使用另一种指针类型。但在用\
  \ `unique_ptr` 替换为原始指针（带有其所有问题）或 `shared_pointer`（带有其开销）之前，我们应该问自己，这些是否是我们类的正确抽象。\n\
  \n### A.5.3.3 规则 2：除非用户定义，否则生成析构函数\n\n这无疑是最简单的规则：要么由程序员写析构函数，要么由编译器写。由于所有类型必须提供析构函数，规则\
  \ 1 在此处无关。\n\n### A.5.3.4 规则 3：默认构造函数单独单独生成\n\n默认构造函数是隐式生成时最害羞的操作。一旦定义了*任何*其他构造函数，默认构造函数就不会再生成：\n\
  \n```\nstruct no_default1\n{\n   no_default1 (int) {}\n};\n\nstruct no_default2\n\
  {\n   no_default2 (const no_default2&) = default;\n};\n```\n\n这两个类都将包含默认构造函数。结合规则\
  \ 1，这意味着例如，以下类无法编译：\n\n```struct\nstruct a\n{\n   a(int i) : i{i} {}   // 错误\n \
  \  no_default1  x;\n   int          i;\n};\n```\n\n成员变量 `x` 未出现在初始化列表中，调用 `no_default1`\
  \ 的默认构造函数会失败（在编译时）。\n\n在存在任何其他用户定义构造函数的情况下省略隐式默认构造函数的动机是：假设其他构造函数会显式初始化成员数据，而许多默认构造函数（特别是对于内建类型）会留成员未初始化的。为了避免成员数据意外包含随机垃圾，当存在其他构造函数时，应该定义默认构造函数或显式声明为\
  \ `default`，或者更好的是使用类内初始化初始化所有成员。\n\n### A.5.3.5 规则 4：何时生成拷贝操作\n\n为了简洁起见，我们使用了 C++11\
  \ 声明符 `default` 和 `delete`。当我们写出默认实现时，这些示例的行为是相同的。拷贝构造函数和拷贝赋值在：\n\n- 当存在移动操作时，不会隐式生成；\n\
  - 当相应的操作被定义时，仍会生成；\n- 当析构函数被定义时，仍会生成。\n\n此外，拷贝赋值在：\n\n- 当非静态成员存在时，不会隐式生成；\n- 当非静态成员为\
  \ `const` 时，不会隐式生成。\n\n一个移动操作会禁用禁用拷贝操作的示例：\n\n```\nclass tray\n{\n public :\n  \
  \ // tray (tray&) = delete;   // 隐式\n   tray(&&) noexcept = default; // 用户定义\n \
  \  // tray& operator =(const tray&) = delete;  // 隐式\n   // ...\n};\n```\n\n对应操作存在的情况下，隐式生成一个拷贝操作在\
  \ C++11 中被标记为弃用，但编译器通常会提供：\n\n```\nclass tray\n{\n public :\n   tray (const tray&)\
  \ = default ;  // 用户定义\n   // ...\n};\n```\n\n同样，当析构函数被定义时，拷贝操作的生成是被弃用的但支持的。\n\n\
  ### A.5.3.6 规则 5：拷贝操作是如何生成的\n\n在正常情况下，拷贝操作接受常量引用作为参数。允许使用非常量引用来实现拷贝操作，我们在这里讨论是为了完整性而非出于实用性（并作为一种警告示例）。如果类的任何成员在拷贝操作中需要非常量引用，则生成的操作也需要非常量引用：\n\
  \n```\nstruct mutable_copy\n{\n   mutable_copy() = default ;\n   mutable_copy (mutable_copy&)\
  \ {}\n   mutable_copy (mutable_copy&&) noexcept = default;\n   mutable_copy& operator\
  \ =(const mutable_copy&) = default;\n   mutable_copy& operator =(mutable_copy&&)\
  \ noexcept = default;\n};\n\nclass tray\n{\n  public :\n    // tray (tray&) = default\
  \ ;\n    // tray (tray&&) noexcept = default ;\n    // tray& operator =(const tray&)\
  \ = default ;\n    // tray& operator =(tray&&) noexcept = default ;\n    mutable_copy\
  \   m;\n    // ...\n};\n```\n\n`mutable_copy` 类在拷贝构造函数中只接受非常量引用。因此，`tray` 的拷贝构造函数也需要非常量引用。在编译器生成它的，它将是非\
  \ `const` 的。一个显式声明的带有 `const` 引用的拷贝构造函数：\n\n```\nclass tray\n{\n   tray (const tray&)\
  \ = default ;\n   mutable_copy    m;\n   // ...\n};\n```\n\n\n\n\n会被拒绝。与构造函数相反，我们示例中的拷贝赋值接受常量引用。虽然这是合法的\
  \ C++ 代码，但这是一种非常糟糕的做法：相关的构造函数和赋值在参数类型和语义上应该保持一致——否则会导致不必要的困惑，并迟早导致 Bug。虽然在拷贝操作中使用可变引用（mutable\
  \ references）可能有其原因（可能是为了应对其他地方糟糕的设计决策），但我们可能会遇到奇怪的影响，分散我们对主要任务的注意力。在使用此类功能之前，花时间寻找更好的解决方案是完全值得的。\n\
  \n### C++11 A.5.3.7 规则 6：生成移动操作\n\n当满足以下任何条件时，不会隐式生成移动构造函数和移动赋值运算符：\n\n- 存在用户定义的拷贝操作；\n\
  - 另一个移动操作是用户定义的；或\n- 析构函数是用户定义的。\n\n此外，当满足以下条件时，不会隐式生成移动赋值：\n\n- 非静态成员是引用；或\n- 非静态成员是\
  \ `const`。\n\n请注意，这些规则比拷贝操作的规则要严格得多：在这里，这些操作总是被删除（deleted），而不仅仅是在某些情况下被视为弃用（deprecated）。正如计算机科学中经常发生的情况一样，事物不完美匹配的原因是历史性的。拷贝操作的规则是\
  \ C++03 的遗留，为了向后兼容而保留。移动操作的规则则较新，反映了下一节的设计指南。\n\n作为上述规则的示例，拷贝构造函数的定义删除了两个移动操作：\n\
  \n```\nclass tray\n{\n  public:\n    tray (const tray&) = default;\n    // tray\
  \ (tray&&) = delete; // 隐式\n    // tray& operator =(tray&&) noexcept = delete; //\
  \ 隐式\n    // ...\n};\n```\n\n由于许多原因禁用了隐式生成，建议在需要时将移动操作声明为 `default`。\n\n### A.5.4\
  \ 陷阱与设计指南\n\n在上一节中，我们看到了标准的规则，这些规则是处理遗留代码与实现正确类行为目标之间的折中。在设计新类时，我们可以自由选择不屈从危险的过时做法。这通过以下规则体现。\n\
  \n#### A.5.4.1 五人规则 (Rule of Five)\n\n该规则的动机是用户管理的资源。这是用户实现拷贝、移动操作以及析构函数的主要原因。例如，当我们使用经典指针时，自动生成的拷贝/移动不会拷贝/移动数据，且析构函数不会释放内存。因此，为了行为正确，我们必须全部实现或完全不实现以下内容：\n\
  \n- 拷贝构造函数\n- 移动构造函数\n- 拷贝赋值\n- 移动赋值\n- 析构函数\n\n这同样适用于 C 风格的文件句柄和其他手动管理的资源。\n\n\
  当我们为这五个操作之一编写实现代码时，我们通常在管理资源，并且很可能还需要实现其他四个以确保行为正确。在一个或多个操作具有默认行为或不会被使用的情况下，使用 `default`\
  \ 和 `delete` 显式声明比依赖之前的规则要好。简而言之：\n\n**五人规则**\n\n要么声明上述所有五个操作，要么一个都不声明。\n\n####\
  \ A.5.4.2 零规则 (Rule of Zero)\n\n在上一节中，我们说明了资源管理是用户实现操作的主要原因。在 C++11 中，我们可以用 `unique_ptr`\
  \ 或 `shared_ptr` 替换经典指针，并将资源管理交给这些智能指针。同样，如果我们使用文件流而不是过时的文件句柄，就不需要关闭文件。换句话说，当我们的成员数据通过\
  \ RAII 释放资源，且拷贝/移动操作被正确实现时，编译器将正确生成相应的操作。\n\n**零规则**\n\n在应用类中不要实现上述五个操作中的任何一个。\n\
  \n请注意，该规则禁止的是实现，而不是将其声明为 `default` 或 `delete`。在某些情况下，标准库没有提供管理我们感兴趣的资源的类。这时，如果我们编写一小组类，每个类以定义良好的方式管理一个资源，在帮自己（正如\
  \ §2.4.2.4 中讨论）。所有高层类都应使用这些资源管理器，这样高层类中五个操作的默认行为就是定义良好的。\n\n#### A.5.4.3 显式删除与隐式删除\n\
  \n请对比以下两个本上完全相同的类实现变体：\n\n```\nclass tray1\n{\n  public :\n    tray1 (const tray1&)\
  \ = default ;\n    // tray1 (tray1&&) noexcept // 未生成\n    tray1& operator =(const\
  \ tray1&) = default ;\n    // tray1& operator =(tray1&&) noexcept // 未生成\n    //\
  \ ..\n};\n```\n\n对于：\n\n```\nclass tray2\n{\n  public :\n    tray2 (const tray2&)\
  \ = default ;\n    tray2 (tray2&&) noexcept = delete ;\n    tray2& operator =(const\
  \ tray2&) = default ;\n    tray2& operator =(tray2&&) noexcept = delete ;\n    //\
  \ ..\n};\n```\n\n在两种两种情况下，拷贝操作都有默认行为，而移动操作缺失。我们可以预期它们的行为相同。但当传递右值（rvalue）时，情况并非如此：\n\
  \n```\ntray1 a1, c1,\n     b1{std::move (a1)};   // 编译但使用了拷贝构造函数\nc1 = std::move\
  \ (b1);        // 编译但使用了拷贝赋值\n\ntray2 a2, c2,\n     b2{std::move (a2)};   // 错误：被删除的构造函数\n\
  c2 = std::move (b2);        // 错误：被删除的赋值运算符\n```\n\n像 `tray1` 这样隐式删除移动操作的类可以处理右值。然而，这些值实际上是被拷贝的而非移动的。原因是右值引用可以隐式转换为常量左值引用，使得相应的拷贝操作成为最佳匹配。相比之下，像\
  \ `tray2` 这样显式删除的移动操作是右值的最佳匹配。\n\n与其依赖每当显式声明拷贝操作（并可能实现）时就不声明移动操作的规则，不如自己将移动操作定义为拷贝：\n\
  \n**列表 A–3：通过拷贝实现移动**\n\n```\nclass tray\n{\n  public:\n    tray (const tray&) =\
  \ default;\n    // 移动构造函数实际上执行拷贝\n    tray (tray&&) noexcept : tray (that) {}\n\
  \    tray& operator =(const tray&) = default;\n    // 移动赋值实际上执行拷贝\n    tray& operator\
  \ =(tray&&) noexcept { return *this = that; }\n    // ...\n};\n```\n\n移动构造函数和赋值运算符接收右值\
  \ `that`，但它在方法内部（由于有名称）是一个左值。将此左值传递给构造函数或赋值将分别调用拷贝构造函数和拷贝赋值运算符。在注释中解释这种右值到左值的静默转换并不能体现\
  \ C++ 知识的缺失。它可以阻止他人添加他们认为缺失的 `std::move`（这可能导致丑陋的崩溃）。\n\n#### A.5.4.4 六人规则：显式化\n\
  \n之前的示例说明了基础操作的隐式生成：\n\n- 默认构造函数\n- 拷贝构造函数\n- 移动构造函数\n- 拷贝赋值\n- 移动赋值\n- 析构函数\n\n\
  取决于多个规则的相互作用。为了找出这六个操作中实际上生成了哪些，必须检查所有成员以及直接和间接基类的源代码——当这些类来自第三方库时，尤其令人苦恼。早晚我们会发现，但这段时间只是被浪费了。因此，我们建议对于具有平凡内容的频繁使用的类：\n\
  \n**六人规则**\n\n\n\n对于上述六种操作，应尽可能少地实现，尽可能多地声明。任何未实现的操作在适用情况下都应声明为 `default` 或 `delete`。缺失的操作至少应该在注释中解释其行为，例如说明其为隐式删除，或者在移动操作时会隐式转换为拷贝。\n\
  \n斯科特·迈耶斯（Scott Meyers）提出了非常相似的*五之默认规则*（Rule of Five Defaults），认为这五个默认生成的构造函数和赋值操作运算符不应在类定义中省略，而应该被声明为\
  \ `default` [45]。遗憾的是，这对于没有移动语义的类并不适用（因为默认的移动操作将无法编译）。\n\n对于这些类，我们可以删除移动操作，将每次使用都变为编译时错误；或者我们为每次移动都执行一次拷贝，方法是在实现在中显式调用拷贝操作（如列表\
  \ A–3 所示），或者在类实现中省略移动操作，并依赖从右值引用到常量左值引隐式转换。与其他设计指南相比，我们在这里包含了默认构造函数，因为它的隐式生成也取决于成员和基类（§A.5.3.1\
  \ 中的规则 1）。\n\n### A.6 模板细节\n\n### C++11 A.6.1 统一初始化\n\n在第 2.3.4 节中，我们引入了统一初始化。这种技术也可以用于函数模板。然而，大括号消除现在取决于类型参数。也就是说，消除括号的数量随实例化而异。这简化了许多实现，但在某些情况下可能会导致意想不到或意外之外的行为。这种现象在非常简单的函数就可以观察到。马特·斯鲁普克（Malte\
  \ Skarupke）在他的博客 [58] 中展示了像下面简单的 `copy` 函数也可能失败：\n\n```\ntemplate<typename T>\n\
  inline T copy (const T& to_copy)\n{\n    return T{ to_copy };\n}\n```\n\n该函数适用于几乎所有可拷贝构造类型。异常是\
  \ `any` 的容器，例如 `std::vector<any>`。由于 `any` 可以存储（几乎）任何内容，它也可以存储 `std::vector<any>`，编译器可能会假设有一对隐式的大括号。因此，`copy`\
  \ 操作的结果是一个包含原始向量作为单个元素的向量。至少在 `g++` 和直到 `clang++` 3.6 版本中是这样的；后后的 `clang++` 版本可以正确拷贝。\n\
  \n### A.6.2 调用了哪个函数？\n\n考虑到 C++ 中在多个命名空间中多次重载函数的所有可能性，每个人迟早都会问自己：“我该如何知道最终调用的是哪一个呢？”好吧，我们可以在调试器中运行程序。但作为科学家，我们想要理解发生了什么。为此，我们必须考虑\
  \ C++ 中的多个概念：\n\n- 命名空间，\n- 名字隐藏，\n- 依赖参数的查找（ADL），以及\n- 重载解析。\n\n让我们深入其中，并从一个具有挑战性的示例开始。为了简洁起见，我们选择了短名称：包含类的命名空间\
  \ `c1` 和 `c2`，以及包含调用函数的命名空间 `f1` 和 `f2`：\n\n```\nnamespace c1 {\n    namespace c2\
  \ {\n        struct cc {};\n        void f(const cc& o) {}\n    } // namespace c2\n\
  \    void f(const c2::cc& o) {}\n} // namespace c1\nvoid f(const c1::c2::cc& o)\
  \ {}\n\nnamespace f1 {\n    void f(const c1::c2::cc& o) {}\n    namespace f2 {\n\
  \        void f(const c1::c2::cc& o) {}\n        void g() {\n            c1::c2::cc\
  \ o;\n            f(o);\n        }\n    } // namespace f2\n} // namespace f1\n```\n\
  \n现在棘手的问题：在 `f1::f2::g` 中调用了哪个 `f`？让我们先看每个重载：\n\n- `c1::c2::f`：是 ADL 的候选者；\n- `c1::f`：不是候选者，因为\
  \ ADL 不考虑外部命名空间；\n- `f`：位于 `g` 的外部命名空间，但被 `f1::f2::f` 隐藏了；\n- `f1::f`：与 `f` 相同；以及\n\
  - `f1::f2::f`：是候选者，因为它与 `f1::f2::g` 在同一个命名空间中。\n\n至少，我们可以排除五种重载中的三个，只剩下 `c1::c2::f`\
  \ 和 `f1::f2::f`。剩下的问题是哪个重载具有优先级。答案是：没有；程序是二义的。\n\n现在我们可以考虑一下这五个重载的子集。首先，我们可以丢弃 `c1::f`；无论如何这并不重要。如果我们也省略了\
  \ `c1::c2::f` 会发生什么？那么情况就很清晰了：将调用 `f1::f2::f`。如果我们保留 `c1::c2::f` 并移除 `f1::f2::f`\
  \ 会发生什么？情况将是二义的：在 `c1::c2::f` 和 `f1::f` 之间，哪一个会被调用？\n\n\n\n\n```cpp\ntemplate <typename\
  \ Base, typename Exponent>\n\nBase inline power (const Base& x, const Exponent)\
  \ { ... }\n\n# ifdef SSE_FOR_TRYPTICHON_WQ_OMICRON_LXXXVI_SUPPORTED\n\nstd :: pair\
  \ < double > inline power (std :: pair < double > x, double y)\n\n{\n\n    asm (\"\
  \n\n#     Yo, I'm the greatestest geek under the sun!\n\n      movapd xmm6, x\n\n\
  \      ...\n\n    \")\n\n    return whatever;\n\n}\n\n# endif\n\n# ifdef ... more\
  \ hacks ...\n```\n\n对于这段代码片段有什么好说的呢？如果你不想写这样的特化（在技术上它是一个重载），我们并不怪你。但如果我们非要这样做，`我们必须将这些黑客手段放入条件编译中`。我们还必须确保构建系统仅在确定支持该汇编代码的平台上才启用该宏。对于不支持的情况，我们必须保证通用实现或另一个重载可以处理\
  \ `double` 对。否则，我们无法在可移植的应用程序中调用该特化实现。\n\n标准 C++ 允许我们在程序中插入汇编代码。它看起来就像我们调用了一个名为\
  \ `asm` 的函数，并将字符串字面量作为参数。该字符串的内容（即汇编代码）显然取决于平台。在科学应用中使用汇编应该经过深思熟虑。在大多数情况下，其收益将无法抵消付出的努力和缺点。测试正确性甚至兼容性可能会更加费力且容易出错。作者在一个\
  \ C++ 库上有过这样的经历：该库在 Linux 上运行良好，但由于在汇编中进行了激进的优化，在 Visual Studio 上几乎无法使用。话如此，当我们开始使用汇编片段调优性能时，这不仅会大幅增加我们的开发和维护成本，在开源领域，我们还面临失去用户对软件信任的风险。\n\
  \n## C++17 A.6.4 变变二进制 I/O\n\nSection A.2.6 给出了一个二进制 I/O 的示例。它包含了重复的指针转换和 `sizeof`。利用类型推导和变变函数等语言特性，我们可以提供一个更方便的接口：\n\
  \n```cpp\ntemplate <typename T, typename ...P>\n\nvoid write_data (std :: ostream&\
  \ os, const T& t, const P& ... p)\n\n{\n\n    os. write (reinterpret_cast<const\
  \ char *>(&t), sizeof t);\n\n    if constexpr (sizeof ...(p) > 0)\n        write_data\
  \ (os, p ...);\n}\n\ntemplate <typename T, typename ...P>\n\nvoid read_data (std\
  \ :: istream & is, T& t, P& ...p)\n\n{\n\n    is. read (reinterpret_cast <char *\
  \ >(&t), sizeof t);\n\n    if constexpr (sizeof...(p) > 0)\n        read_data (is,\
  \ p...);\n}\n\nint main (int argc, char* argv [])\n\n{\n\n    std::ofstream outfile\
  \ (\"fb.txt\", ios::binary);\n\n    double o1= 5.2, o2= 6.2;\n    write_data (outfile,\
  \ o1, o2);\n\n    outfile.close();\n\n    std::ifstream infile (\"fb.txt\", ios::binary);\n\
  \n    double i1, i2;\n    read_data (infile, i1, i2);\n\n    std :: cout ≪ \"i1\
  \ = \" ≪ i1 ≪ \", i2 = \" ≪ i2 ≪ \"\\n\";\n\n}\n```\n\n这些变变函数允许我们在每次函数调用中写入或读取任意数量的自包含对象。变变模板的完整威力在元编程（第\
  \ 5 章）结合时得到了释放。如果我们移除 `constexpr-if` 并添加一个空参数包的重载，这些函数可以用 C++11 或 C++14 实现。\n\n\
