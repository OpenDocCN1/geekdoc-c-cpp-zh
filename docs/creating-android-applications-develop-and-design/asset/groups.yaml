    \ you must provide implementation.\n\n+   1. **onPreExecute** takes place on the\
    \ main thread and is the first slice of bread. It sets up the task, prepares a\
    \ loading dialog, and warns the user that something is about to happen.\n+   2.\
    \ **doInBackground** is the meat of this little task sandwich. This method is\
    \ guaranteed by Android to run on a separate background thread. This is where\
    \ the majority of your work takes place.\n+   3. **onPostExecute** will be called\
    \ once your work is finished (again, on the main thread), and the results produced\
    \ by the background method will be passed to it. This is the other slice of bread.\n\
    \nThat's the gist of the asynchronous task. There are more-complicated factors\
    \ that I'll touch on in just a minute, but this is one of the fundamental building\
    \ blocks of the Android platform (given that all hard work must be taken off the\
    \ main thread). Take a look at one in action, then we'll go over the specifics\
    \ of it:\n\n```\nprivate class ImageDownloader\nextends AsyncTask<String, Integer,\
    \ Bitmap>{\nprotected void onPreExecute(){\n        //Setup is done here\n   \
    \ }\n    @Override\n    protected Bitmap doInBackground(String... params) {\n\
    \        // TODO Auto-generated method stub\n        try{\n            URL url\
    \ = new URL(params[0]);\n```"
