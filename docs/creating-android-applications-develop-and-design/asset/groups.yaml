    \ This becomes important, because you'll want to change that configuration depending\
    \ on how much space you have.\n\nIf you're planning on coding along with me in\
    \ this chapter, make sure you have a project that is set to version 3.0 or higher\
    \ of the Android SDK (API Level 11 or greater).\n\n### THE LIFECYCLE OF THE FRAGMENT\n\
    \nFragments have fairly complex lifecycles. There are many methods to explore,\
    \ but onCreateView must be implemented for the fragment to appear onscreen. onCreateView\
    \ is your fragment's one chance to create a view to display onscreen. If you fail\
    \ to return a view to the system, your application will crash and burn.\n\nHere\
    \ is the startup lifecycle; the methods are listed in the order the system will\
    \ call them:\n\n- onAttach. This is called when your fragment is attaching to\
    \ an activity.\n- onCreate. This is called when the fragment is being initialized.\
    \ This is a great place to initialize any variables you'll need later.\n- onCreateView.\
    \ This is your opportunity to create and return the fragment's root view. This\
    \ is the first method that will be called if your fragment is returning to the\
    \ screen after having been previously paused.\n- onStart. Similar to the same\
    \ call on the activity, this is called when the fragment is about to be placed\
    \ onscreen.\n- onResume. This is called when the fragment is back onscreen.\n\n\
    At this point, your fragment is frolicking on the screen, receiving touch and\
    \ key events, or just hanging around and looking great. If the user leaves the\
    \ screen or switches to a view that no longer includes the fragment, the following\
    \ shutdown lifecycle will take place:\n\n- onPause. This is called if the fragment\
    \ is removed from the screen or the user presses the home button. This is the\
    \ only part of the shutdown life-cycle you're guaranteed to get (it would be the\
    \ only method you get in the rare situation that your application is put in the\
    \ background and then your process is killed due to resource constraints). onPause\
    \ is the best time for you to save any data or state information that you want\
    \ the user to be able to see when the fragment is resumed later.\n- onStop. Similar\
    \ to the activity's version of this method, onStop is called when your fragment\
    \ has left the screen. It tends to be called in conjunction with the activity's\
    \ onStop method.\n- onDestroyView. This is your last chance to pull data out of\
    \ the views before they go away.\n- onDestroy. This is called when the fragment\
    \ is being removed from the screen and will not return. This is the time to make\
    \ sure all your threads are stopped, loaders are canceled, and any broadcast receivers\
    \ are unregistered.\n- onDetach. Called as the fragment loses its association\
    \ with an activity, onDetach is the last of your methods the system will call\
    \ before the fragment heads to the great garbage collector in the sky.\n\n###\
    \ CREATING A FRAGMENT\n\nTo create a fragment, you’ll need to make a Java class\
    \ that extends the Fragment class. An incredibly simple implementation would look\
    \ something like this:\n\n```\npublic class ContentFragment extends Fragment{\n\
    \    @Override\n    public View onCreateView(LayoutInflater inflater,\n      \
    \  ViewGroup container, Bundle savedInstanceState) {\n        View v = inflater.inflate(R.layout.content_layout,\
    \ null);\n    }\n}\n```\n\nFragments, of course, need their own layouts to show\
    \ anything onscreen. This ContentFragment class will just show a simple text view.\
    \ Here is the content_layout.xml file whose contents will be drawn as the fragment\
    \ itself:\n\n```\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<LinearLayout xmlns:android=\"\
    http://schemas.android.com/apk/res/android\"\n    android:layout_width=\"match_parent\"\
    \n    android:layout_height=\"match_parent\"\n    android:orientation=\"vertical\"\
    \ >\n    <TextView\n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
    match_parent\"\n        android:id=\"@+id/content_text_view\"\n        />\n</LinearLayout>\n\
    ```\n\n```xml\nandroid:layout_height=\"match_parent\"\nandroid:id=\"@+id/list_fragment\"\
    \ />\n</LinearLayout>\n```\n\nThis layout can then be set as the content view\
    \ for a FragmentActivity, like so:\n\n```java\npublic class ContentViewingActivity\
    \ extends FragmentActivity{\n    public void onCreate(Bundle data){\n        super.onCreate(data);\n\
    \        setContentView(R.layout.content_activity_layout);\n    }\n}\n```\n\n\
    Figure 10.1 shows the results of using XML to make the fragment appear onscreen.\n\
    \n### THE FragmentActivity CLASS\n\nThe FragmentActivity is a special class you’ll\
    \ need to use only if you want to work with fragments on versions of Android earlier\
    \ than 3.0. For Honeycomb and Ice Cream Sandwich, a simple activity contains all\
    \ the pieces you need to interact with fragments. You can find the FragmentActivity\
    \ class in the Android compatibility library.\n\n![](img/47ad0ac10bf11125744ef22c945d3099_242_0.png)\n\
    \n### Fragment example project\n\nBauhaus commodo store dith American apparel,\
    \ put a bird on it Austin nostrud eiusmod readymade id aesthetic synth. Portland\
    \ booth quis polaroid butcher celiac sustainable. Banksy keytar chic, PBR deserunt\
    \ caries DIY dreamcatcher mustache aesthetic forage. Helvetica keffiyeh laborum\
    \ biodiesel in dolore. Beard est brunch, viral sartorial twee DIY biodiesel beard\
    \ artisan shoreditch ut sunt American apparel butcher echo. etsy Terry Richardson\
    \ American apparel deserunt ullamco synth ethical sed, Portland non tumbler brunch\
    \ photo booth.\n\nFIGURE 10.1 A fragment with a single text view.\n"
  mdcn: "\n### GeoPoints\n\nGoogle 以其并不怎么无穷的智慧决定：地图视图中的 GeoPoints 不应像 SDK 中其他所有 API\
    \ 那样接受以度为单位的纬度和经度值。相反，它们采用 1e6 值。简单来说，这意味着在交给地图视图之前，你必须把希望在地图视图中引用的任何纬度或经度值乘以\
    \ 1e6。如果忘记这一步，就会出现一些有趣的地图错误。\n\n### 小结\n\n在本章中，我向你展示了查找设备位置并在屏幕上显示地图的最基础知识。如果你想进一步深入这个主题，应该通过\
    \ `OverlayItem` 类探索地图叠加层。叠加层让你可以向用户指出特定位置（地址、商家或猫咪图片）。\n\n一如既往，要非常小心你使用何种定位服务，尤其是当用户不在你的应用中时。没有什么比在后台进行大量位置查询更能快速耗尽用户电量——也更能让用户生气。如果你计划开发一个非常依赖定位的应用，务必在发布前做大量（LOTS）耗电测试。这样你的用户和应用的评分都会满意得多。\n\
    \n## 10 平板电脑、Fragment 和操作栏，天哪\n\n![](img/47ad0ac10bf11125744ef22c945d3099_236_0.png)\n\
    \n随着 Honeycomb 和 Ice Cream Sandwich 的发布，Google 为 Android 生态引入了全新的外形规格。在 Gingerbread\
    \ 及更早版本中，Google 只试图处理小型手机屏幕。借助这些新版本的 Android，你现在必须应对平板电脑大得多的屏幕。\n\nGoogle 引入了\
    \ Fragment 的概念（用于处理额外的屏幕空间，并保持与较小手机尺寸屏幕的兼容性）以及操作栏（用于替代选项菜单）。\n\n从概念上讲，Fragment\
    \ 类似于 Activity，但生命周期稍微复杂一些。如果空间不大，它们可以独占一个屏幕；也可以与其他许多 Fragment 一起放在更大的平板电脑屏幕上。一个\
    \ Activity 可以包含任意数量的 Fragment。通过这种方式，Android SDK 允许你展开和折叠应用中的视图，以利用更多或更少的屏幕空间。有一件事\
    \ Activity 能做而 Fragment 不能——即 Activity 可以在清单中注册 intent；Fragment 依赖其宿主 Activity\
    \ 传递启动信息。此外，实现 Fragment 时重要的是让它们完全不知道其他哪些 Fragment 可见。这一点很重要，因为你会希望根据可用空间大小更改该配置。\n\
    \n如果你打算在本章中跟着我一起编码，请确保你的项目设置为 Android SDK 3.0 或更高版本（API Level 11 或更高）。\n\n###\
    \ Fragment 的生命周期\n\nFragment 的生命周期相当复杂。有许多方法值得探索，但要让 Fragment 显示在屏幕上，必须实现 onCreateView。onCreateView\
    \ 是你的 Fragment 创建要在屏幕上显示的视图的唯一机会。如果你未能向系统返回一个视图，应用就会崩溃。\n\n以下是启动生命周期；这些方法按系统调用它们的顺序列出：\n\
    \n- onAttach。当你的 Fragment 正在附加到 Activity 时调用。\n- onCreate。当 Fragment 正在初始化时调用。这是初始化后续所需变量的绝佳位置。\n\
    - onCreateView。这是你创建并返回 Fragment 根视图的机会。如果你的 Fragment 在之前暂停后返回屏幕，这将是第一个被调用的方法。\n\
    - onStart。类似于 Activity 上的同名调用，当 Fragment 即将被放到屏幕上时调用。\n- onResume。当 Fragment 回到屏幕上时调用。\n\
    \n此时，你的 Fragment 正在屏幕上活跃，接收触摸和按键事件，或者只是待在那里看起来很棒。如果用户离开屏幕或切换到不再包含该 Fragment 的视图，将发生以下关闭生命周期：\n\
    \n- onPause。如果 Fragment 从屏幕上移除或用户按下 Home 键，就会调用。这是关闭生命周期中你保证会收到的唯一部分（在罕见情况下，应用被放到后台，然后进程因资源限制被杀死，这也会是你唯一能收到的方法）。onPause\
    \ 是保存任何你希望用户稍后恢复 Fragment 时能看到的数据或状态信息的最佳时机。\n- onStop。类似于 Activity 中该方法的版本，当你的\
    \ Fragment 离开屏幕时调用 onStop。它往往与 Activity 的 onStop 方法一起调用。\n- onDestroyView。这是在视图消失之前从视图中取出数据的最后机会。\n\
    - onDestroy。当 Fragment 正在从屏幕上移除并且不会返回时调用。此时要确保所有线程都已停止、加载器都已取消，并且任何广播接收器都已注销。\n\
    - onDetach。当 Fragment 失去与 Activity 的关联时调用，onDetach 是系统在 Fragment 前往天上的垃圾回收器之前会调用的最后一个方法。\n\
    \n### 创建 Fragment\n\n要创建 Fragment，你需要创建一个继承 Fragment 类的 Java 类。一个极其简单的实现大致如下：\n\
    \n```\npublic class ContentFragment extends Fragment{\n    @Override\n    public\
    \ View onCreateView(LayoutInflater inflater,\n        ViewGroup container, Bundle\
    \ savedInstanceState) {\n        View v = inflater.inflate(R.layout.content_layout,\
    \ null);\n    }\n}\n```\n\n当然，Fragment 需要自己的布局才能在屏幕上显示任何内容。这个 ContentFragment\
    \ 类只会显示一个简单的文本视图。以下是 content_layout.xml 文件，其内容将作为 Fragment 本身绘制：\n\n```\n<?xml\
    \ version=\"1.0\" encoding=\"utf-8\"?>\n<LinearLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\
    \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
    \n    android:orientation=\"vertical\" >\n    <TextView\n        android:layout_width=\"\
    match_parent\"\n        android:layout_height=\"match_parent\"\n        android:id=\"\
    @+id/content_text_view\"\n        />\n</LinearLayout>\n```\n\n```xml\nandroid:layout_height=\"\
    match_parent\"\nandroid:id=\"@+id/list_fragment\" />\n</LinearLayout>\n```\n\n\
    然后可以将此布局设置为 FragmentActivity 的内容视图，如下所示：\n\n```java\npublic class ContentViewingActivity\
    \ extends FragmentActivity{\n    public void onCreate(Bundle data){\n        super.onCreate(data);\n\
    \        setContentView(R.layout.content_activity_layout);\n    }\n}\n```\n\n\
    图 10.1 展示了使用 XML 让 Fragment 显示在屏幕上的结果。\n\n### FragmentActivity 类\n\nFragmentActivity\
    \ 是一个特殊的类，仅当你希望在低于 3.0 的 Android 版本上使用 Fragment 时才需要使用它。对于 Honeycomb 和 Ice Cream\
    \ Sandwich，一个简单的 Activity 就包含与 Fragment 交互所需的所有组件。你可以在 Android 兼容库中找到 FragmentActivity\
    \ 类。\n\n![](img/47ad0ac10bf11125744ef22c945d3099_242_0.png)\n\n### Fragment 示例项目\n\
    \nBauhaus commodo store dith American apparel, put a bird on it Austin nostrud\
    \ eiusmod readymade id aesthetic synth. Portland booth quis polaroid butcher celiac\
    \ sustainable. Banksy keytar chic, PBR deserunt caries DIY dreamcatcher mustache\
