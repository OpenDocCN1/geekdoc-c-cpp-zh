    Now, when you open a new terminal, typing which android will return the path where
    you installed your shiny new Android SDK. Keep this command in mind—you''ll return
    to it in a minute.


    # INSTALLING THE SDK FOR LINUX USERS


    Linux users should go through nearly the same steps as in “Installing the SDK
    for Mac Users.” The only differences are the instructions for putting the SDK
    on your path and where you may want to put your version of the SDK. I''m going
    to assume that if you''re a Linux user, you''re savvy enough to figure out this
    procedure on your own.


    # INSTALLING THE SDK FOR WINDOWS USERS


    To install the Android SDK for Windows, follow these steps:


    +   1. Start the Android SDK installer.

    +   2. Accept the installer''s default location and Start-menu configuration.

    +   3. Let the installer work its magic.


    This procedure will add an SDK Manager command to your Start menu. This is the
    application you''ll work with to select the correct platforms in the next section.


    # DOWNLOADING A PACKAGE


    All right, you''ve got the SDK downloaded and in the right place. You''re not
    quite there yet.


    +   1. If you are a Mac or Linux user, run sdk_location/tools/android; if you
    are a Windows user, allow the installer to open the AVD (Android Virtual Device)
    Manager software.


    You should see the Android SDK Manager.'
