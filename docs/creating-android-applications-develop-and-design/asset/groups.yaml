    \ tab1.setTabListener(new ExampleTabListener());\n    bar.addTab(tab1);\n```\n\
    \nFor each tab you'd like to add, you must go through the process of requesting\
    \ a new tab from the action bar, setting the listener, and then adding it to the\
    \ action bar. Figure 10.7 shows a great-looking example of a tab bar in the Google\
    \ Calendar application.\n\nEach tab will trigger different events on the fragments\
    \ within an activity. For the Google Calendar application, it will hide and show\
    \ the various ways in which the user could view their calendar.\n\nAs you can\
    \ see, Google has been very busy building new user interface paradigms for tablets\
    \ in Honeycomb. Once they settled on how to make the tablets work, they added\
    \ those new UI methods to the telephone world with Ice Cream Sandwich.\n\nUsing\
    \ the action bar, Google was able to do away with two hard menu buttons (options\
    \ menu and search), while keeping those concepts active in the user experience.\
    \ The options menu button was replaced by icons added to the action bar, and the\
    \ search button was replaced by the ability to add custom action views to that\
    \ very same bar.\n\nWith fragments, Google has enabled us to place more or less\
    \ on the screen as the available real estate shifts between devices. Through fragments,\
    \ we are no longer limited to having one *thing* on the screen at any given time.\
    \ However, if we need to handle smaller screens, fragments make it easy to shift\
    \ back into the one-thing-per-screen layout.\n\nFragments and the action bar are\
    \ very new concepts, and it's clear that Android developers are still trying to\
    \ figure out how best to use them. Please, help us to push the mobile user experience\
    \ forward by implementing your own killer user interfaces using these new toys\
    \ Google has given us.\n\n## 11 PUBLISHING YOUR APPLICATION\n\n![](img/47ad0ac10bf11125744ef22c945d3099_254_0.png)\n\
    \nFor the most part, the Android Market is one of the easiest-to-use application\
    \ stores I've ever encountered. But although you can update an application almost\
    \ instantly without any of the hassles of other app stores, there are still a\
    \ few things you should be aware of before you publish. We'll cover packaging,\
    \ versioning, and creating a release build.\n\nThere are a few key points in your\
    \ manifest that you need to pay attention to before you consider producing a release\
    \ build to go to market. You'll need to make sure your application isn't debuggable\
    \ (not so much an issue with newer versions of the Android client). You'll also\
    \ want to make sure your package name is unique and consistent in each subsequent\
    \ version. Last, there are two fields to pay attention to when upgrading an existing\
    \ application. Let's take a closer look at all three.\n\n### PREVENTING DEBUGGING\n\
    \nShipping your application out the door with debugging enabled will allow anyone\
    \ with a micro USB cable to step through lines of code in your app, look at the\
    \ contents of variables, and do other things that no security-aware engineer would\
    \ like to have happen. The debugging flag is turned off by default, but if you've\
    \ turned it on, it will appear in the application portion of the manifest:\n\n\
    ```xml\n<application\n    android:icon=\"@drawable/ic_launcher\"\n    android:label=\"\
    @string/app_name\"\n    android:debuggable=\"true\">\n```\n\nWhen the application\
    \ ships, make sure that you either remove the line entirely or set the following:\n\
    \n```xml\nandroid:debuggable=\"false\"\n```\n\n### NAMING THE PACKAGE\n\nThe package\
    \ you declare in your manifest can, for the most part, contain almost any string\
    \ you fancy. I've highlighted one from a previous example here:\n\n```xml\n<?xml\
    \ version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
    \n    package=\"com.haseman.layouts\"\n    android:versionCode=\"1\"\n    android:versionName=\"\
    1.0\">\n```\n\nAlthough I named this package to correspond to my layouts example,\
    \ you could just as easily declare a package like\n\n```xml\npackage=\"com.sparkle.pants.fairy.dust.unicorn\"\
    \n```\n\nI wouldn't recommend using the unicorn example (it's somewhat outrageous),\
    \ but the fact remains that you can. However, the package name you choose must\
    \ be different from all other existing packages in the entire Android Market.\
    \ Be sure it's unique and that it's something you can live with for as long as\
    \ you upgrade the application. When you upgrade your app, it absolutely must have\
    \ the same package name as the build that came before it. Typically, the naming\
    \ convention goes something like com.company_name.product_name. But again, the\
    \ package name for your application is entirely up to you.\n\n### VERSIONING\n\
    \nThere are two values to pay attention to when updating an existing application.\
    \ First, you should (but are not required to) increase the value inside the versionName\
    \ field of the manifest declaration. Standard rules for the version number apply:\
    \ Major releases get a new primary number (1.0 to 2.0), while small patches should\
    \ get a secondary bump (1.0 to 1.1). The version name is what shows to the user\
    \ in the Android Market and in your application's details screen. The version\
    \ name is \"1.0\" in the previous example's manifest file.\n\nThe field you *must*\
    \ pay careful attention to is versionCode. This is the value that must change\
    \ every time you do an update for the Android Market. Sending an update to the\
    \ Android Market will be rejected unless you change the versionCode. Typically,\
    \ Android developers will make the version code by taking the periods out of the\
    \ version name and padding each portion of the name to create a two-digit number\
    \ for each section. The number must be unique, but it does not necessarily have\
    \ to be sequential. So version 1.0.1 would become 010001, and 2.3.12 would become\
    \ 020312. This is a pretty basic way to make sure your version names stay tied\
    \ to the version code without much complexity. It's a good idea to make this number\
    \ constantly grow even though, according to the documentation, it isn't technically\
    \ required to. However, adopting a convention of incrementing the numbers ensures\
    \ it will be unique.\n\n### SETTING A MINIMUM SDK VALUE\n\nThe Android Market\
    \ requires that you specify a minimum SDK value for your application. You can\
    \ do this in the manifest by including the uses-sdk field, like so:\n\n```xml\n\
    <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
    \n    package=\"com.haseman.location\"\n    android:versionCode=\"1\"\n    android:versionName=\"\
    1.0\">\n    <uses-sdk android:minSdkVersion=\"7\"/>\n    <!-- The rest of your\
    \ application goes here-->\n</manifest>\n```\n\nThe number in minSdkVersion corresponds\
    \ to the integer value for the SDK. In this case, by declaring version 7, I'm\
    \ not allowing phones earlier than the Android 2.1 update 1 (which is SDK version\
    \ 7) to install my application. Be sure to test your application on the versions\
    \ you support, even if you just test it briefly with an emulator.\n"
  mdcn: "\n至此，你应该已经掌握了创建选项菜单和操作栏图标的基本方法。或者，你也可以将图标声明为 XML 文件，并使用 MenuInflater 将其填充。有关如何在\
    \ /res/menu 中使用 XML 文件以简化流程的完整说明，请查阅文档（[http://developer.android.com/guide/topics/ui/menus.html](http://developer.android.com/guide/topics/ui/menus.html)）。\n\
    \n![](img/47ad0ac10bf11125744ef22c945d3099_250_0.png)\n\n图 10.7 Google Calendar\
    \ 中的标签栏。\n\n### 添加标签页\n\n在操作栏中放置标签页是完全不同的过程。你需要使用 ActionBar 类本身来添加它们。此外，你还需要实现一个\
    \ ActionBar.TabListener（它通过一系列重写方法告诉系统，当用户点击标签页时该做什么）。\n\n实现监听器后，你应将以下代码添加到 Activity\
    \ 的 onCreate 方法中：\n\n```java\n    ActionBar bar = getActionBar();\n    bar.setNavigationMode(ActionBar.NAVIGATION_MODE_TABS);\n\
    \    ActionBar.Tab tab1 = bar.newTab();\n    tab1.setText(\"Tab Text\");\n   \
    \ tab1.setTabListener(new ExampleTabListener());\n    bar.addTab(tab1);\n```\n\
    \n对于每个要添加的标签页，你都必须经历以下过程：从操作栏请求一个新标签页、设置监听器，然后将其添加到操作栏。图 10.7 展示了 Google Calendar\
    \ 应用中一个外观很棒的标签栏示例。\n\n每个标签页都会触发 Activity 内 Fragment 上的不同事件。对于 Google Calendar\
    \ 应用，它会隐藏和显示用户查看日历的各种方式。\n\n如你所见，Google 一直在忙于为 Honeycomb 中的平板电脑构建新的用户界面范式。在确定如何让平板电脑发挥作用后，他们又通过\
    \ Ice Cream Sandwich 将这些新的 UI 方法带到了手机领域。\n\n借助操作栏，Google 得以取消两个实体菜单按钮（选项菜单和搜索），同时仍在用户体验中保留这些概念。选项菜单按钮被添加到操作栏的图标所取代，搜索按钮则被向同一操作栏添加自定义操作视图的能力所取代。\n\
    \n借助 Fragment，Google 使我们能够在设备之间可用屏幕空间发生变化时，在屏幕上放置或多或少的内容。通过 Fragment，我们不再受限于在任意给定时间屏幕上只能有一个\
    \ *事物*。不过，如果我们需要处理较小的屏幕，Fragment 可以轻松切换回每屏一个事物的布局。\n\nFragment 和操作栏是非常新的概念，显然\
    \ Android 开发者仍在努力弄清楚如何最好地使用它们。请通过使用 Google 提供给我们的这些新玩具实现你自己的杀手级用户界面，帮助我们推动移动用户体验向前发展。\n\
    \n## 11 发布你的应用程序\n\n![](img/47ad0ac10bf11125744ef22c945d3099_254_0.png)\n\n在很大程度上，Android\
    \ Market 是我遇到过的最易用的应用商店之一。但是，尽管你可以几乎即时更新应用，而无需像其他应用商店那样麻烦，但在发布之前仍有一些事项需要了解。我们将介绍打包、版本管理以及创建发布版本。\n\
    \n在考虑生成用于上架的发布版本之前，清单文件中有几个关键点需要注意。你需要确保应用程序不可调试（对于较新版本的 Android 客户端来说，这不太成问题）。你还需要确保包名唯一，并且在后续每个版本中保持一致。最后，在升级现有应用程序时有两个字段需要注意。让我们详细看看这三点。\n\
    \n### 防止调试\n\n如果应用程序在启用调试的情况下发布，任何拥有 micro USB 线的人都可以逐行调试你的应用代码、查看变量内容，并做其他任何有安全意识的工程师都不希望发生的事情。调试标志默认关闭，但如果你已将其打开，它会出现在清单文件的\
    \ application 部分：\n\n```xml\n<application\n    android:icon=\"@drawable/ic_launcher\"\
    \n    android:label=\"@string/app_name\"\n    android:debuggable=\"true\">\n```\n\
    \n应用程序发布时，请确保完全删除该行，或将其设置为以下内容：\n\n```xml\nandroid:debuggable=\"false\"\n```\n\
    \n### 命名包\n\n你在清单文件中声明的包，在很大程度上可以包含几乎任何你想要的字符串。我在前面的示例中突出显示了一个：\n\n```xml\n<?xml\
    \ version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
    \n    package=\"com.haseman.layouts\"\n    android:versionCode=\"1\"\n    android:versionName=\"\
    1.0\">\n```\n\n尽管我命名这个包是为了对应我的布局示例，但你也可以同样轻松地声明类似这样的包：\n\n```xml\npackage=\"com.sparkle.pants.fairy.dust.unicorn\"\
    \n```\n\n我不会推荐使用 unicorn 这个示例（它有点离谱），但事实仍然是你可以这么做。不过，你选择的包名必须不同于整个 Android Market\
    \ 中所有其他现有包。确保它唯一，并且在你升级应用程序的整个期间都是你可以接受的。升级应用时，它绝对必须与之前构建的包名相同。通常，命名约定类似于 com.company_name.product_name。但同样，应用程序的包名完全由你决定。\n\
    \n### 版本管理\n\n更新现有应用程序时有两个值需要注意。首先，你应该（但并非必须）增大清单声明中 versionName 字段内的值。版本号的标准规则适用：主要版本会获得新的主版本号（1.0\
    \ 到 2.0），而小型补丁应获得次版本号提升（1.0 到 1.1）。版本名称是向用户显示在 Android Market 和应用程序详情屏幕中的内容。在前面的示例清单文件中，版本名称是“1.0”。\n\
    \n你*必须*密切关注的字段是 versionCode。这是每次为 Android Market 执行更新时都必须更改的值。除非你更改 versionCode，否则向\
    \ Android Market 发送更新将被拒绝。通常，Android 开发者会通过去掉版本名称中的句点，并给名称的每一部分补位以形成每段两位数字，来生成版本代码。该数字必须唯一，但不一定必须连续。因此，版本\
    \ 1.0.1 会变成 010001，2.3.12 会变成 020312。这是一种相当基本的方法，可以确保版本名称与版本代码保持关联，而不会太复杂。让这个数字持续增长是个好主意，尽管根据文档，技术上并不要求这样做。不过，采用递增数字的约定可以确保它唯一。\n\
    \n### 设置最低 SDK 值\n\nAndroid Market 要求你为应用程序指定最低 SDK 值。你可以在清单文件中包含 uses-sdk 字段来完成此操作，如下所示：\n\
    \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
    http://schemas.android.com/apk/res/android\"\n    package=\"com.haseman.location\"\
    \n    android:versionCode=\"1\"\n    android:versionName=\"1.0\">\n    <uses-sdk\
    \ android:minSdkVersion=\"7\"/>\n    <!-- The rest of your application goes here-->\n\
    </manifest>\n```\n\nminSdkVersion 中的数字对应 SDK 的整数值。在本例中，通过声明版本 7，我不允许早于 Android\
    \ 2.1 update 1（即 SDK 版本 7）的手机安装我的应用程序。请务必在你支持的版本上测试应用程序，即使只是用模拟器进行简短测试。\n"
