  - "[PAGE 192]\n\n# ## WHAT CAN YOU DO BEYOND LANDSCAPE?\n\nLots. You can add suffixes\
    \ to layout folders to account for just about everything. Here are a few I use\
    \ on a regular basis.\n\n+   - layout-small, layout-normal, layout-large, layout-xlarge\n\
    +   \n+     The size modifier accounts for the physical size of the screen. Devices\
    \ that would use the small layout folder are typically very old, or very strange\
    \ pieces of hardware, at least until Android powered watches become popular. Most\
    \ modern phones fit the layout-normal category, while many tablets are considered\
    \ xlarge. Google keeps a great breakdown of all the various screen configurations\
    \ at http://developer.android.com/resources/dashboard/screens.html.\n+   \n+ \
    \  - layout-ldpi, layout-mdpi, layout-hdpi, layout-xhdpi\n+   \n+     The dpi,\
    \ or dots per inch, of the device is a measurement of screen *density*. Screens\
    \ with high densities (240 dpi) would pull from the layout folder layout-hdpi.\n\
    +   \n+   - layout-large-hdpi-land\n+   \n+     You can also mix and match the\
    \ suffixes. This suffix would be used for phones that have large screens and high\
    \ resolution and that are in landscape mode. Get creative, but remember that just\
    \ because you can get very specific about screen configurations, it doesn't mean\
    \ you should.\n\n# ## THE FULL SCREEN DEFINE\n\nJust as you can place separate\
    \ layout files to be referenced in `<include>` for different hardware configurations,\
    \ so can you define a completely different screen in the layout-land folder for\
    \ the system to use in landscape mode. This might seem like the best course of\
    \ action at first, but it is less than ideal for several reasons.\n\n+   - It\
    \ involves a lot of typing.\n+   \n+     Instead of defining two small parts that\
    \ change based on the screen configuration, you have to make and test more than\
    \ one entire screen layout."
  - '[PAGE 193]


    +   - Making changes can be painful.


    With many hardware configurations comes a plethora of different screens. Were
    you to fully lay out a screen for every configuration, you''d have a nightmare
    on your hands when your designer wants to remove or add a button. You would have
    to add it separately to each XML file for every single screen configuration.


    Those two things aside, sometimes you really do need a completely separate layout
    for a different hardware or screen configuration. Try to modify small parts when
    you can, but don''t be afraid to crack your knuckles and make a totally new screen
    layout when it''s necessary.


    To make a new layout of the “chocolate” example, you can simply make a second
    `two_buttons.xml` file in `/res/layout-land` and configure the screen in any way
    you like. Then the call to `setContentView` in the `onCreate` method of your activity
    will, like include, find the right resource for the right screen configuration.


    # ## HOW CAN THIS POSSIBLY WORK?


    That''s a great question that I''m glad you asked only at the end of the section.
    Because it separates layout files from activities, Android can have any number
    of different layouts for the myriad of possible screen configurations. You simply
    specify the layout name, and Android goes off in search of the correct XML file
    to show the user. To keep this process running smoothly, keep the following things
    in mind:


    +   - The layouts *must* share the same name.


    Android can only find the layout XML by name. As long as the layout files have
    the exact same filename, it will locate the version in your landscape (or any
    other) folder.


    +   - Make sure that the **IDs** for your individual views are consistent.


    Remember that your activity calls `findViewById` in order to manipulate and interact
    with onscreen objects. The activity shouldn''t care where a view is to register
    a click listener, set an image, or pull data from an `EditText`.'
  - "[PAGE 194]\n\n+   - Try not to move views around in your activity's java code.\n\
    +   \n+     Your activity shouldn't try to change the position of things onscreen.\
    \ While in portrait mode, the button might be at point (330, 120); it will be\
    \ somewhere totally different in landscape mode. In this situation, adding more\
    \ screen layouts will require also adding the corresponding movement code to your\
    \ activity, and this can become time consuming.\n\n# BE CAREFUL\n\nDebugging layout\
    \ issues across many linked layout files can be exhausting (I've done it), so\
    \ keep your layouts as stretchy and dynamic as you possibly can. If your designs\
    \ are done well, they should be able to automatically handle many screen resolutions\
    \ with good use of linear and relative layouts. Fall back on includes and multiple\
    \ layout folders only when dynamic layouts can't do the job. There will be times,\
    \ however, when one layout doesn't do all screens justice. When this happens,\
    \ make your breakouts as small and efficient as possible. Don't hesitate to use\
    \ this amazing layout tool, but be careful not to use it too much."
