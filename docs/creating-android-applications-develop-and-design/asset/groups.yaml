    \ of like this:\n\n```java\nimport android.app.Fragment;\n```\n\n![](img/47ad0ac10bf11125744ef22c945d3099_246_0.png)\n\
    \n**FIGURE 10.3** Installing the compatibility library.\n\nUsing the support library\
    \ will ensure that your application will run correctly on newer and older systems\
    \ alike.\n\nFurther, if you’re planning on using the compatibility library and\
    \ fragments, remember that you’ll need to use a `FragmentActivity` instead of\
    \ a regular `Activity`.\n\nWith the compatibility support and the dynamic nature\
    \ of fragments, it becomes quite possible to create an application with a great\
    \ interaction model that works well on both phones and tablets. I don’t have time\
    \ to spell it all out here, but there is sample code for achieving this in the\
    \ companion source code for this chapter. Remember what you’ve read here, and\
    \ take a look through it.\n\n![](img/47ad0ac10bf11125744ef22c945d3099_247_0.png)\n\
    \n**FIGURE 10.4** A basic action bar.\n\nWith the transition from Android 2.3\
    \ to 3.0, Google has eliminated both the search button and the menu key. From\
    \ personal experience, I can tell you that many new users never find functionality\
    \ that is placed in the options menu. Its removal from the system is, indeed,\
    \ a very good thing.\n\nGoogle, bless their expensive cotton socks, has moved\
    \ the icons that used to reside in the options menu to the action bar. Further,\
    \ you can specify a search view in the action bar (to replace the search button).\
    \ This takes up more screen space, but on a tablet (and on larger phones), there\
    \ is more than enough space to go around.\n\nThe action bar now represents the\
    \ primary way your users will navigate through your Honeycomb or Ice Cream Sandwich\
    \ application. Sadly, this new tool is available only through versions 3.0 (target\
    \ 11) or later. It would require a fair amount of typing, but it’s very possible\
    \ to emulate the action bar on earlier systems by using a simple linear layout\
    \ and a few image views. You are, however, on your own to implement it. There\
    \ is no support for the action bar in the compatibility library.\n\n## SHOWING\
    \ THE ACTION BAR\n\nSince the action bar is supported only in SDK versions 3.0\
    \ and later, your manifest will have to explicitly declare that it supports target\
    \ 11 or greater.\n\n```xml\n<uses-sdk android:minSdkVersion=\"7\"\n          android:targetSdkVersion=\"\
    11\"\n/>\n```\n\nAt this point, when your project is built and run on any Honeycomb\
    \ and later system, you should see a basic version of the action bar containing\
    \ your application's icon and the default title of the activity (Figure 10.4).\n\
    \n## ADDING ELEMENTS TO THE ACTION BAR\n\nIn addition to allowing you to set your\
    \ own title with a call to setTitle, the action bar can handle three different\
    \ types of objects:\n\n- Icons. Both in a drop-down menu on the right-hand side\
    \ and as actionable items in the bar itself.\n- Tabs. Buttons along the top, built\
    \ to manipulate fragments on the screen.\n- Action views. Search boxes and drop-down\
    \ lists (for things like sort orders, account selection, or death-ray intensities).\n\
    \nFurther, Android will always make your application icon (farthest to the left)\
    \ clickable. It is expected that tapping this icon will, by default, return the\
    \ user to your application’s home screen (whatever this means to your application’s\
    \ behavior). You can also visually indicate that the home icon will go one level\
    \ back in the activity stack by calling setDisplayHomeAsUpEnabled(true).\n\nThe\
    \ way you make changes to what’s in the action bar is very similar to how you\
    \ used to interact with the options menu. This is not by accident. Because the\
    \ action bar is supposed to replace the options menu, you call methods and configure\
    \ files similarly to how you used to deal with the menu. This also makes it easy\
    \ to gracefully degrade service to phones on older versions of the Android SDK.\n\
    \n### ADDING AN ICON\n\nIcons are most easily placed in the action bar by extending\
    \ onCreateOptionsMenu and adding the menu icons you’d like. I’ve added a delete\
    \ icon to the action bar with the following code:\n\n```java\n@Override\npublic\
    \ boolean onCreateOptionsMenu(Menu menu){\n    MenuItem item = menu.add(\"delete\"\
    );\n    item.setIcon(android.R.drawable.ic_delete);\n    if(Build.VERSION.SDK_INT\
    \ >= 11){\n        item.setShowAsAction(MenuItem.SHOW_AS_ACTION_IF_ROOM);\n  \
    \  }\n    return true;\n}\n```\n\n![](img/47ad0ac10bf11125744ef22c945d3099_249_0.png)\n\
    \n**FIGURE 10.5** Adding an action icon.\n\n![](img/47ad0ac10bf11125744ef22c945d3099_249_1.png)\n\
    \n**FIGURE 10.6** A non-action icon.\n\nIf the Android SDK is greater than 3.0,\
    \ the system will call this method when the activity is starting (so it can build\
    \ the action bar). You'll notice that I'm calling setShowAsAction only if we're\
    \ running on Honeycomb or later. Figure 10.5 shows what the action bar looks like\
    \ on a handset running Ice Cream Sandwich.\n\nIf you omit the call to setShowAsAction\
    \ on a Honeycomb tablet, you'll see an options menu icon that contains the menu\
    \ item on the right side. On Ice Cream Sandwich, it will move the menu item to\
    \ a more traditional contextual menu. Figure 10.6 shows what it looks like on\
    \ a tablet after I've clicked it.\n\n## REACTING TO ICON CLICKS\n\nWhen the user\
    \ clicks one of your action bar icons, Android will call your implementation of\
    \ the onOptionsItemSelected method. Here's my very simple example method:\n\n\
    ```java\npublic boolean onOptionsItemSelected(MenuItem item){\n    int id = item.getItemId();\n\
    \    if(id == android.R.id.home){\n        //The user clicked the left-hand app\
    \ icon.\n        //As this is the home screen, ignore it.\n        return true;\n\
    \    }\n    else{\n        //Perform the delete action here\n        return true;\n\
    \    }\n}\n```\n"
  mdcn: "\n\n## 使用 FragmentManager\n\n**图 10.2** 同一屏幕上的两个片段。\n\n尽管能在 XML 文件中布局片段很棒，但你还希望能在运行时与屏幕上的片段交互。为此，你将使用\
    \ FragmentManager，它是 Android 用来操作片段的工具。\n\n在 Honeycomb 及更高版本中获取片段管理器需要调用 getFragmentManager。对于更早的设备，需要从\
    \ FragmentActivity 调用 getSupportFragmentManager。\n\n你可以使用以下代码以编程方式向屏幕添加片段：\n\n\
    ```java\nFragmentManager manager = getSupportFragmentManager();\nFragmentTransaction\
    \ ft = manager.beginTransaction();\nft.add(containerViewId, new DemoListFragment());\n\
    ft.commit();\n```\n\n变量 containerViewId 应引用 Activity 布局中已存在的 ViewGroup，新片段将放置到该\
    \ ViewGroup 中。稍后，你还可以通过调用 replace(containerViewId, newFragment); 用另一个片段替换某个片段，其中\
    \ containerViewId 指定当前容纳你要替换的片段的视图容器。你只能替换之前通过 FragmentManager 事务添加的片段；在 XML 布局中静态声明的片段无法替换。\n\
    \n通过使用 XML 或片段管理器来设置和修改视图，你应该能够轻松构建复杂、可扩展且美观的应用程序，并在手机和平板电脑上都能良好呈现。\n\n请记住，所有片段都应独立于其同级片段工作（这与\
    \ Activity 应保持独立的方式非常相似），即使它们可能共享同一屏幕。\n\n鉴于 Android 布局文件夹的强大功能（我们已在第 3 章和第 7\
    \ 章中详细讨论），你应该能看到为平板电脑构建一种布局（其中可能包含多个片段）以及为小屏幕手机构建另一种布局（一次只显示一个片段）的可能性。\n\n如果你在寻找一个简单示例，我强烈建议你看看本章示例代码中的项目。\n\
    \n## 提供向后兼容性\n\n谢天谢地，Android 已将片段捆绑到其兼容性库中。这意味着即使你计划支持 3.0 之前的设备，也可以使用片段。我强烈建议你尽可能使用它。安装它只需单击图\
    \ 10-3 所示的菜单项。\n\n但请注意，如果你的项目针对 3.0 或更高版本构建，同时仍使用兼容性库，可能会变得有点复杂。如果这样做，请确保所有导入都来自支持库，如下所示：\n\
    \n```java\nimport android.support.v4.app.Fragment;\n```\n\n而不是像这样：\n\n```java\n\
    import android.app.Fragment;\n```\n\n![](img/47ad0ac10bf11125744ef22c945d3099_246_0.png)\n\
    \n**图 10.3** 安装兼容性库。\n\n使用支持库将确保你的应用程序在较新和较旧系统上都能正确运行。\n\n此外，如果你计划使用兼容性库和片段，请记住你需要使用\
    \ `FragmentActivity` 而不是常规的 `Activity`。\n\n借助兼容性支持以及片段的动态特性，创建一个具有出色交互模型且能在手机和平板电脑上良好运行的应用程序变得非常可行。我没有时间在这里详细说明，但本章的配套源代码中有实现这一目标的示例代码。记住你在这里读到的内容，并翻阅一下。\n\
    \n![](img/47ad0ac10bf11125744ef22c945d3099_247_0.png)\n\n**图 10.4** 一个基本操作栏。\n\
    \n随着 Android 2.3 向 3.0 的过渡，Google 取消了搜索按钮和菜单键。根据个人经验，我可以告诉你，许多新用户从未找到放在选项菜单中的功能。将其从系统中移除确实是一件非常好的事情。\n\
    \nGoogle——愿他们昂贵的棉袜得到保佑——已将过去位于选项菜单中的图标移到了操作栏。此外，你可以在操作栏中指定搜索视图（以替代搜索按钮）。这会占用更多屏幕空间，但在平板电脑（以及较大的手机）上，空间绰绰有余。\n\
    \n现在，操作栏代表了用户浏览你的 Honeycomb 或 Ice Cream Sandwich 应用程序的主要方式。遗憾的是，这个新工具仅适用于 3.0\
    \ 版本（目标版本 11）或更高版本。在更早的系统上模拟操作栏需要输入相当多的代码，但完全可以通过简单的线性布局和几个图像视图来实现。不过，实现它只能靠你自己。兼容性库不支持操作栏。\n\
    \n## 显示操作栏\n\n由于操作栏仅在 SDK 3.0 及更高版本中受支持，因此你的清单文件必须明确声明其支持目标版本 11 或更高版本。\n\n```xml\n\
    <uses-sdk android:minSdkVersion=\"7\"\n          android:targetSdkVersion=\"11\"\
    \n/>\n```\n\n此时，当你的项目在任何 Honeycomb 及更高版本系统上构建并运行时，你应该会看到一个基本版本的操作栏，其中包含你的应用程序图标和\
    \ Activity 的默认标题（图 10.4）。\n\n## 向操作栏添加元素\n\n除了允许你通过调用 setTitle 设置自己的标题外，操作栏还可以处理三种不同类型的对象：\n\
    \n- 图标。既包括右侧下拉菜单中的图标，也包括栏本身中的可操作项。\n- 标签页。沿顶部排列的按钮，用于操作屏幕上的片段。\n- 操作视图。搜索框和下拉列表（用于排序顺序、账户选择或死光强度之类的内容）。\n\
    \n此外，Android 始终会让你应用程序的图标（最左侧）可点击。默认情况下，点击此图标预计会将用户返回到你的应用程序的主屏幕（无论这对你的应用程序行为意味着什么）。你还可以通过调用\
    \ setDisplayHomeAsUpEnabled(true) 在视觉上表明主屏幕图标将返回 Activity 堆栈中的上一级。\n\n你对操作栏内容进行更改的方式，与你过去与选项菜单交互的方式非常相似。这不是偶然的。因为操作栏本应取代选项菜单，所以你调用方法并配置文件的方式与你过去处理菜单的方式类似。这也使得在较旧版本的\
    \ Android SDK 上向手机优雅降级服务变得容易。\n\n### 添加图标\n\n通过扩展 onCreateOptionsMenu 并添加你想要的菜单图标，可以最轻松地将图标放入操作栏。我使用以下代码向操作栏添加了一个删除图标：\n\
    \n```java\n@Override\npublic boolean onCreateOptionsMenu(Menu menu){\n    MenuItem\
    \ item = menu.add(\"delete\");\n    item.setIcon(android.R.drawable.ic_delete);\n\
    \    if(Build.VERSION.SDK_INT >= 11){\n        item.setShowAsAction(MenuItem.SHOW_AS_ACTION_IF_ROOM);\n\
    \    }\n    return true;\n}\n```\n\n![](img/47ad0ac10bf11125744ef22c945d3099_249_0.png)\n\
    \n**图 10.5** 添加操作图标。\n\n![](img/47ad0ac10bf11125744ef22c945d3099_249_1.png)\n\n\
    **图 10.6** 非操作图标。\n\n如果 Android SDK 高于 3.0，系统会在 Activity 启动时调用此方法（以便它可以构建操作栏）。你会注意到，只有在\
    \ Honeycomb 或更高版本上运行时，我才会调用 setShowAsAction。图 10.5 显示了在运行 Ice Cream Sandwich 的手机上操作栏的样子。\n\
    \n如果在 Honeycomb 平板电脑上省略对 setShowAsAction 的调用，你会看到一个选项菜单图标，其中在右侧包含该菜单项。在 Ice Cream\
    \ Sandwich 上，它会将菜单项移动到更传统的上下文菜单中。图 10.6 显示了我点击后它在平板电脑上的样子。\n\n## 响应图标点击\n\n当用户点击你的某个操作栏图标时，Android\
    \ 会调用你实现的 onOptionsItemSelected 方法。以下是我非常简单的示例方法：\n\n```java\npublic boolean onOptionsItemSelected(MenuItem\
    \ item){\n    int id = item.getItemId();\n    if(id == android.R.id.home){\n \
    \       //The user clicked the left-hand app icon.\n        //As this is the home\
    \ screen, ignore it.\n        return true;\n    }\n    else{\n        //Perform\
    \ the delete action here\n        return true;\n    }\n}\n```\n\n"
