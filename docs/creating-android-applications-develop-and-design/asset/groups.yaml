  - '[PAGE 90]


    The simplest example is a layout folder and a layout-land folder. If you place
    a firstscreen.xml file in both folders, Android will use the one that most closely
    resembles the current screen mode. If you keep the android:id settings consistent,
    you will be able to specify two completely different-looking screens within your
    XML markups and interact with any of them via your Java code. This technique is
    complicated, so let''s look at an example.


    Let''s say you create portrait and landscape layouts for the first screen of your
    application. Both files are called firstscreen.xml, and the portrait version goes
    in the layout folder while the landscape version goes in the layout-land folder.
    You could also put the portrait version in a folder called layout-port. In both
    versions of firstscreen.xml, you provide all the appropriate IDs for the text
    views, buttons, and images.


    If your screen had an OK button, you''d provide the portrait and landscape versions
    of these buttons the same ID: R.id.ok_button. Remember that you gain access to
    views by calling findViewById() and passing in the ID you specified on the android:id="@+id/id_goes_here"
    line. In this case, if you wanted to set a click listener, you''d fetch the OK
    button by calling findViewById(R.id.ok_button); and Android would return the button
    from your portrait screen if you''re in portrait mode and the landscape version
    of the button if you''re in landscape mode. Your code knows what it must do when
    that button is pressed, but it doesn''t know about the dimensions or location
    of the button. Welcome to the happy land of the Model-View-Controller (MVC).


    MVC is your number one friend when handling the diversity in device screen sizes.
    You can lay out your views in any possible configuration and, as long as the IDs
    match, you''ll need to write only a single Activity class to handle all possible
    screen permutations. You can have specific folders, each with its own set of layout
    files for different screen sizes (layout-small to layout-xlarge) and densities
    (layout-ldpi to layout-hdpi), and you can mix and match. For example, layout-large-land
    would specify layouts for large screens (VGA and WVGA) that are in landscape mode.
    For the exact order in which Android defaults through the folders, be sure to
    check the Android SDK documentation.


    I''m only scratching the surface of the possibilities that these layout folders
    put at your disposal. You''ll learn more about this topic in coming chapters on
    dealing with display and hardware diversity.'
  - '[PAGE 91]


    # # DRAWABLE FOLDERS


    For Android, a *drawable* is simply something that can be drawn to the screen.
    Android abstracts away the differences between colors, shapes, and images and
    allows you to deal with a superclass that can represent any number of them: Drawable.

    You keep the definitions for these objects in the drawable folders.

    You should consider using a drawable for two main types of objects:


    +   - Image resources (mostly PNG files)

    +   - XML files describing things you want drawn: shapes, gradients, or colors


    The drawable set of folders works similarly to the layout folders. You can specify
    any mix of screen densities, layouts, or resolutions, provided you specify them
    in the right order.


    # ### MANY RESOURCES, ONE APK


    > > Just because you can have a whole different set of images for each screen
    size or density doesn''t mean you actually should. Keep a close eye on the size
    of your final compiled APK file. If the file grows over a certain size, users
    will complain. To combat this bloat, use 9-patches, which are easily scaled images,
    and use hand-rendered shapes over large PNG graphics where possible. While the
    new marketplace does allow for multiple APKs, it''s a level of complexity you
    should avoid.


    ![](img/47ad0ac10bf11125744ef22c945d3099_91_0.png)


    Referencing a drawable is accomplished in the same way that you reference values
    and layouts. For XML files, use the `@drawable/resource_name`. For example, in
    an `ImageView` (`android:src="@drawable/bridge"`), omit the suffix if you''re
    referring to XML files or images. Also, keep in mind that Android will always
    try to use the drawable folder that is closest to your current configuration.
    If it can''t find a good match, it''ll cascade back to what it can find in the
    default drawable folder.


    **TIP:** Be sure to check the Android SDK documentation for more info on ordering
    your suffixes correctly.'
