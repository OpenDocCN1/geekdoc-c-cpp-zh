    \ time by specifying that the dimension (in the child layout) be 0. This means\
    \ the system doesn't have to figure out the ideal size of the object when it walks\
    \ through your layout to measure your views before drawing. This may not help\
    \ a lot, but if you've got a layout with a lot of views, every little bit counts.\
    \ As you can see in the previous code listing, I've specified the heights be 0\
    \ because the LinearLayout is going to parcel out all the space between them.\
    \ You'll also need to specify a weight for the view, or it might not work.\n\n\
    This XML layout code should look familiar to you, given what you've read in previous\
    \ chapters. It's simply splitting the screen space between the title main menu\
    \ and the list of sub-screens. You can also see the special Android list ID that\
    \ is needed to tell the ListActivity which view it should interact with.\n\n#\
    \ ## MAKING A MENU LIST ITEM\n\nNow you'll create a layout XML file for the individual\
