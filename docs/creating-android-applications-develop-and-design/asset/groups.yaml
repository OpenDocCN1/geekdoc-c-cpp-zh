    \ in a multitude of ways. In previous code examples, I’ve referenced the `R.java`\
    \ file when specifying strings, drawable images, and layouts and mentioned that\
    \ an explanation would be forthcoming. Now is the time to explain Android resource\
    \ management in detail.\n\n## RESOURCE FOLDER OVERVIEW\n\nEvery Android project,\
    \ by default, contains a `res` folder with several subfolders inside it. Each\
    \ subfolder is responsible for a different aspect of your application’s data.\n\
    \nThe drawable folders (`drawable-hdpi`, `drawable-mdpi`, and `drawable-ldpi`)\
    \ hold images and XML files describing drawable objects. You’ll learn much more\
    \ about what you can do with drawable objects in later chapters.\n\nThe values\
    \ folder holds all your textual content, from string literals to menu list value\
    \ arrays to color constants.\n\nLastly, the layout folders contain XML files to\
    \ describe how you want your screens to look.\n\nAt compile time, the Android\
    \ tools take all the folders in your `res` directory and place a corresponding\
    \ ID into an `R.java` file. This file is automatically re-created and placed in\
    \ the project’s `gen` folder. Consequently, you should never directly change this\
    \ `R.java` file, because any changes are removed the next time you compile. The\
    \ IDs in `R.java` can be passed to everything from XML parsers to text and image\
    \ views. When you call `setText` on a `TextView` and pass in `R.string.hello`,\
    \ the view then knows to look for that ID in the string file and display what\
    \ it finds there. When you set the main view of an activity by calling `setContentView`\
    \ and passing in `R.layout.main`, the system knows it needs to inflate and create\
    \ the views found in `res/layout/main.xml` and add them to the active views on\
    \ the screen for the current activity.\n\nHere's what the R.java file looks like\
    \ for a newly created project:\n\n```java\n/* AUTO-GENERATED FILE. DO NOT MODIFY.\n\
    \ *\n * This class was automatically generated by the\n * aapt tool from the resource\
    \ data it found.  It\n * should not be modified by hand.\n */\npackage com.haseman.peachpit;\n\
    public final class R {\n    public static final class attr {\n    }\n    public\
    \ static final class drawable {\n        public static final int icon=0x7f020000;\n\
    \    }\n    public static final class layout {\n        public static final int\
    \ main=0x7f030000;\n    }\n    public static final class string {\n        public\
    \ static final int app_name=0x7f040001;\n        public static final int hello=0x7f040000;\n\
    \    }\n}\n```\n\nWhen Android compiles your XML files, it renders them to a packed\
    \ binary format. The upside of this format is that it loads much faster, so your\
    \ screens can snap into focus more quickly. The downside is that you cannot modify\
    \ any of these files once they've been compiled. So you can't manipulate your\
    \ layout and string files at runtime. You can, however, modify what is rendered\
    \ to the screen by loading and changing strings in the Java representation of\
    \ the views.\n\nAdditionally, if you want to reference various resources from\
    \ other XML files, you'll use the `@folder/object_id` structure. While you may\
    \ not have been aware of it, you've seen this kind of declaration in action already.\
    \ Think back to the initial Hello World layout that the Android tools provide\
    \ for you. In it, you saw a text view with the following line: `android:text=\"\
    @string/hello\"`. This was Android's resource system at work. Instead of specifying\
    \ `R.string.hello`, you'll use the XML's `@string/hello` for XML.\n\nEach type\
    \ of folder (drawable, layout, values, and several more) has special naming conventions\
    \ and tricks you can use to battle the time-consuming problems of device diversity,\
    \ language localization, and differing screen resolutions and densities. Let's\
    \ look at what you can do with each type of file.\n\n### VALUES FOLDER\n\nThe\
    \ prospect of putting all the constant values for your user interface (strings,\
    \ colors, or int/string arrays) in a separate file might sound annoying at first\
    \ (especially when you consider that all text manipulators will take a resource\
    \ ID or a CharSequence). However, it can cut down many days of work when translating\
    \ your application to different languages.\n\nHaving all your strings in an external\
    \ XML file also means that your nontechnical colleagues (product managers, designers,\
    \ or micromanaging bosses) can manipulate the display text in the screens, menus,\
    \ and pop-up dialogs without bothering you. This assumes, of course, that you\
    \ teach them how to compile and run the project; feel free to share the first\
    \ chapter of this book with them.\n\nThe values folder can contain:\n\n- **Strings.**\
    \ All string literals should go into your `strings.xml` file.\n- **Arrays.** There\
    \ is a file for the XML-defined arrays, but string arrays can still go in the\
    \ `strings.xml` file if you don't feel like using a separate file.\n- Colors.\
    \ colors.xml can contain any number of declared color constants for use in everything\
    \ from text fonts to layout backgrounds. Unless you’re planning on doing a lot\
    \ of custom UI drawing, this file will probably not be very large.\n- Dimensions.\
    \ dimens.xml can contain any number of possible size values used elsewhere in\
    \ your layouts. This file is particularly handy if you wish to make a view taller\
    \ or shorter based on the display size of the device your application is being\
    \ displayed on. This might seem like a simple thing to do, but it can be very\
    \ powerful when combined with the layout folders.\n- Styles. styles.xml...yeah...more\
    \ about this later.\n\nYou can create new values folders for each language by\
    \ using the two-letter ISO639-2 suffix for a particular language as a suffix to\
    \ values. You can, for example, create a values-es folder containing a Spanish\
    \ version of the strings.xml file. When a user sets his or her phone to Spanish,\
    \ Android will check automatically for an R.string.hello value defined in the\
    \ strings.xml file within the new values-es folder. If it finds one, it will display\
    \ the values-es version rather than the default. If it doesn’t find a Spanish\
    \ translation, it will default to the value you defined in values/strings.xml.\n\
    \nIn this way, Android provides you with an easy way to localize all the strings\
    \ in your application. It does, however, require you to be vigilant about placing\
    \ your string literals in the strings.xml file rather than just calling setText(\"\
    Text like this\"); or using android:text=\"Text like this\" in your XML.\n\n###\
    \ LAYOUT FOLDERS\n\nI’m going to give you three guesses as to what exactly goes\
    \ into the layout folders. Typically, it’s where you place either layout XML files\
    \ for use in setContentView calls, or sub-layouts that can be included via ViewStubs\
    \ or inherited views (two tools that allow you to reuse views in different layouts).\
    \ Android builds a helpful mechanism into the layout folders. You can have many\
    \ folders, with different suffixes, that describe how you want the application\
    \ to appear under various screen configurations.\n"
