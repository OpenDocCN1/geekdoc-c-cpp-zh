    \ this at least once before, but it's always important to close any cursors you\
    \ request from the content provider. In past cases, I've requested data with a\
    \ query, pulled out the relevant information, and immediately closed the cursor.\
    \ In this case, however, I need to keep the cursor around for when the video change\
    \ has to occur. This does not get me off the hook; I still need to close it down,\
    \ so I'll need to add that code to my activity's onDestroy method:\n\n```\n```java\n\
    @Override\npublic void onDestroy(){\n    if(mediaCursor!=null){\n        mediaCursor.close();\n\
    \    }\n}\n```\n```"
  - '[PAGE 209]


    # THE REST, AS THEY SAY, IS UP TO YOU


    I''ve shown you the very basics of loading and playing video content. Now it''s
    time for

    you to explore it on your own. Think about loading a video from a remote location

    (hint: encoding a URL as a URI) or building a progress bar (hint: getCurrentProgress

    calls on the VideoView).


    Because errors are to media playback as swearing is to sailors, registering for

    an onErrorListener is never a bad idea. Android will, if you pass it a class that

    implements the OnErrorListener interface, tell you if it has hiccups playing your

    media files. As always, check the documentation for more information on playback.'
