    \ 类实现并设置 MediaController。如果你希望在本章之后进一步深入视频播放，这将是一个很好的起点。\n\n## 让媒体开始播放\n\n现在我的视频视图已经准备就绪，我可以开始寻找一些东西让它真正播放了。对于这个简单示例，我会依次播放设备上的每个视频，直到全部播放完毕。为此，我将使用\
    \ Android 的媒体 ContentProvider（通过调用 getContentResolver 访问）。我会先向你展示代码，然后深入探讨一些具体细节。下面是使用新代码获取包含所有媒体对象的\
