    \ and press on!\n\n![](img/47ad0ac10bf11125744ef22c945d3099_229_0.png)\n\n**FIGURE\
    \ 9.1** Although strange, this is how your Android settings should look.\n\nDetermining\
    \ your user's location is one thing, but actually putting those two indecipherable\
    \ numbers (longitude and latitude) into context is where software gets a little\
    \ more complex. Interestingly enough, the configuration needed to get a map onscreen\
    \ is far more complex than the code to manipulate it. So, let's get started. If\
    \ you want to follow along, go ahead and create a new Android project, and we'll\
    \ start from there.\n\n### GETTING THE LIBRARY\n\nThe MapActivity and MapView\
    \ are two classes available only in Google's API superset (APIs) of the Android\
    \ SDK. In order to have access to them, you'll need to declare that your application\
    \ uses the Google APIs library. You'll need to download this super-library (the\
    \ same way you got the Ice Cream Sandwich and Gingerbread SDKs back in Chapter\
    \ 1). Figure 9.1 shows what the settings screen for your project should look like\
    \ if you've got it dialed in correctly.\n\nOnce you've set up your SDK values\
    \ correctly, there are a few things in the manifest I need to talk with you about.\n\
    \n### ADDING TO THE MANIFEST\n\nThere are two critical things that, through the\
    \ manifest, you need to tell the system. The first is that your application uses\
    \ the Google Maps library. The second is that you need permission to access the\
    \ Internet. While you will not have to call anything directly to get online, the\
    \ map view will. Here's what the tail end of your manifest should look like with\
    \ these two additions:\n\n```xml\n<manifest> <!-- Rest of the manifest omitted\
    \ here for brevity. -->\n    <application>\n        <activity>\n        </activity>\n\
    \        <uses-library android:name=\"com.google.android.maps\" />\n    </application>\n\
    \    <uses-permission android:name=\"android.permission.INTERNET\"/>\n</manifest>\n\
    ```\n\nAgain, you’re telling Android that\n\n- You’ll be referencing the Google\
    \ Maps libraries.\n- You need permission to access the Internet.\n\nNow, with\
    \ that out of the way, it’s time to switch your boring Activity to a bigger, sexier\
    \ MapActivity class.\n\n## CREATING THE MAPACTIVITY\n\nSwitching your default\
    \ activity to a map activity requires you to add the appropriate Java include\
    \ path and a required method. When you’re finished, it will look something like\
    \ this:\n\n```java\npublic class MapsExampleProjectActivity extends MapActivity\
    \ {\n    @Override\n    public void onCreate(Bundle savedInstanceState) {\n  \
    \      super.onCreate(savedInstanceState);\n        setContentView(R.layout.main);\n\
    \    }\n\n    @Override\n    protected boolean isRouteDisplayed() {\n        return\
    \ false;\n    }\n}\n```\n\nNow that you have your Activity class switched over\
    \ to the MapActivity class, you can add a MapView to your main.xml layout file.\n\
    \n### CREATING A MAPVIEW\n\nThis is the view into which Android will draw its\
    \ map tiles. It behaves exactly like any other view, with one notable exception:\
    \ You need an API key to access Google Maps.\n\n### PLACING THE MAPVIEW\n\nHere's\
    \ what my simple main.xml file looks like right now:\n\n```xml\n<?xml version=\"\
    1.0\" encoding=\"utf-8\"?>\n<LinearLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\
    \n    android:layout_width=\"fill_parent\"\n    android:layout_height=\"fill_parent\"\
    \n    android:orientation=\"vertical\" >\n    <com.google.android.maps.MapView\n\
    \        android:id=\"@+id/map_view\"\n        android:clickable=\"true\"\n  \
    \      android:layout_width=\"fill_parent\"\n        android:layout_height=\"\
    fill_parent\"\n        android:apiKey=\"your API key goes in this field\"\n  \
    \  />\n</LinearLayout>\n```\n\nAs you can see, I've placed my map view as the\
    \ only one onscreen. You can actually place it anywhere you want, just as you\
    \ would position any other view. Further, it doesn't require, as the ListActivity\
    \ does, a special reserved Android ID. Let me show you where to get the value\
    \ that you'll place in the apiKey field.\n\n### SIGNING UP FOR A MAP KEY\n\nGetting\
    \ a map key is pretty easy. Head over to http://code.google.com/android/maps-api-signup.html\
    \ and run the command they suggest:\n\n```\nkeytool -list -keystore ~/.android/debug.keystore\n\
    ```\n\nFrom the sign-up page, you must agree to their terms (which you should\
    \ probably read first), enter the output from your keytool command, and get your\
    \ API key. Toss that string into the apiKey section (the highlighted line in the\
    \ main.xml code) of the MapView, and you're good to go. Remember, the map key\
    \ is bound to whatever key you signed your .apk with (in this case, the debugging\
    \ one). When you sign your .apk for release, you'll need to remember to generate\
    \ a new key for it.\n\n> **TIP:** If the keytool asks for a password, the default\
    \ is \"android.\"\n\n### RUN, BABY, RUN\n\nYou've configured everything, dotted\
    \ all your i's, and crossed all your t's. It's time to take this map view out\
    \ for a spin. When it comes time to move and render the map, you'll be primarily\
    \ interfacing with the MapController, which you'll actually retrieve from the\
    \ map view itself. The simple work for my example is all done in my sample code's\
    \ onCreate method:\n\n```java\nMapView mv;\n\nMapController controller;\n\n@Override\n\
    public void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
    \    setContentView(R.layout.main);\n    mv = (MapView)findViewById(R.id.map_view);\n\
    \    controller = mv.getController();\n    GeoPoint point = new GeoPoint((int)(40.734641\
    \ * 1e6),\n            (int)(-73.996181 * 1e6));\n    controller.animateTo(point);\n\
    \    controller.setZoom(12);\n}\n```\n\n![](img/47ad0ac10bf11125744ef22c945d3099_232_0.png)\n"
