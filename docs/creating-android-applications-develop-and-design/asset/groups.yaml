    \n## 捕获按键\n\n启动新活动的一种简单方法是让用户按下其设备上的中央键。如果你的手机没有中央键，你可以轻松修改以下代码以接受你喜欢的任意按键。要监听按键事件，你需要扩展原始活动的\
