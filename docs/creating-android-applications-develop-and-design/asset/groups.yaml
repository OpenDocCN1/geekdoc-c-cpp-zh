    \ 对象实例。\n\n## 创建接收器\n\n让我们将运行时 BroadcastReceiver 添加到 MyActivity 类中。你可能已经猜到，BroadcastReceiver\
    \ 是一个具有单个 onReceive 方法的对象。\n\n将 MyActivity 类改为如下所示：\n\n```java\npublic class MyActivity\
