    ![](img/47ad0ac10bf11125744ef22c945d3099_258_0.png)


    So your version number is sorted, your code is tested, and all your resources
    are in place—it''s time to make a release build before submitting.


    There are two ways you can go about producing your final APK: through Apache''s
    ant (which will build your application from the command line in conjunction with
    the build.xml file) or through Eclipse''s Android tools. If you''re comfortable
    with the command line, I''m going to assume you can create a release build on
    your own. In this chapter, I''ll focus on creating your release build through
    Eclipse.


    # ## EXPORTING A SIGNED BUILD


    The Eclipse tools make it very easy to produce an effective release build. Simply
    right-click your project in the Package Explorer, and choose Android Tools > Export
    Signed Application Package (Figure 11.1).'
  - '[PAGE 259]


    # ## REMEMBER TO DISABLE LOGGING


    Before you ship anything, run through your code base and make sure there are no
    extra logging lines that you don’t want anyone with a micro USB cable to see.
    Remember, too, that applications with the right permissions can view log output.
    That said, shipping your application with some logging in place for catastrophic
    errors isn’t that bad an idea (in case there are failures in the field).


    You’ll be asked if you want to use an existing keystore file or create a new one.
    Because this is your first time releasing your product, you’ll need to create
    a new one. Enter a location for the file, or click the Browse button to find one.
    Enter a password, and re-enter it to confirm that it is correctly typed (**Figure
    11.2**). The *keystore* is a file that can contain any number of keys. For your
    purposes, you’ll only really need one key. All your applications can be signed
    with the same one, or you can use different keys—it’s up to you (but I recommend
    using only one, because it’s less to keep track of).


    # ## BACKING UP YOUR KEYSTORE FILE


    I’ll say it again: Back up your keystore file. If I could invent a way to make
    an HTML `<blink>` tag in a printed book, I would do it here. The Android Market
    will not let you upgrade an application if you haven’t signed it with the same
    key. If you lose the keystore file you’ve just created, you’ll never be able to
    upgrade your application. Burn it to a disk, and store the disk somewhere other
    than your house. Save it in the cloud (Amazon S3, Dropbox, your mother’s house)
    in as many safe places as you can.


    Once you’ve created your keystore, Eclipse will ask you to create a key. You aren’t
    required to fill in all the lower fields. If you do, however, you should probably
    take it a little more seriously than I did in **Figure 11.3**.'
  - '[PAGE 260]


    ![](img/47ad0ac10bf11125744ef22c945d3099_260_0.png)


    ![](img/47ad0ac10bf11125744ef22c945d3099_260_1.png)


    **FIGURE 11.2** Creating a keystore file.


    **FIGURE 11.3** Creating a key


    You''ll be creating a key (to place in your new keystore file) that requires an
    alias and its own password.


    Be sure that you make the number you use for the Validity field large enough to
    be valid for a very, very long time. You never know, Android could still be around
    one thousand years from now. It pays to be prepared. Last, you''ll need to fill
    out at least one of the several remaining fields, but I recommend you fill in
    as many as apply.


    Click Next to create your key. You''ll just need to tell Eclipse where to put
    your APK, and you''re finished!


    # ### REMEMBER TO ZIPALIGN


    For you command-line users, one thing that Eclipse is doing for its users is a
    tool called Zipalign (found in the tools/ folder of the SDK). Zipalign decreases
    your application''s load times. If you''re using the Eclipse tools, it''s already
    happening for you automatically. If you aren''t using Eclipse, make sure you take
    this step on the command line after you''ve signed the build. It''s speed for
    free, so make sure you take advantage of it.'
  - '[PAGE 261]


    # SUBMITTING YOUR BUILD


    At this point, it''s time to sign up for a developer account and submit your build.
    Android''s application submission page is fairly self-explanatory, but I should
    point out that it''s important to provide the Market with as many screenshots,
    videos, and graphical assets as you have time to generate. Making the decision
    to purchase an application can, if you can believe it, be a difficult one. Users
    need to be able to trust that your application actually works as advertised, so
    giving them a sneak peek is essential.


    # WATCH YOUR CRASH REPORTS AND FIX THEM


    The marketplace provides a very helpful capability: Users, when they experience
    a crash, have the option of reporting that crash to you. Take advantage of it
    as much as possible. Get in touch with users, and fix absolutely everything you
    can. When you get stuck, go online and use every resource available (your favorite
    search engine, Google Groups, or Stack Overflow, to name a few). If you''re seeing
    a crash you don''t understand, chances are high that other developers have battled
    the same thing; we''re a very helpful bunch.


    # UPDATE FREQUENTLY


    Your application, after you submit it, will show up in the Market within hours.
    This allows you to frequently update in order to add small features, fix bugs,
    and make small tweaks. No other platform allows you this kind of speed from submission
    to availability. Use it. You''ll be amazed by how grateful your users will be
    if you respond to their problems quickly.'
  - '[PAGE 262]


    # # WRAPPING UP


    In parting, I want to give you one more piece of advice: Make a meaningful contribution
    to the Android landscape. While you''ll undoubtedly have questions that this book
    cannot answer, you now have the vocabulary and knowledge that will allow you to
    find answers. This means you have no excuse but to make something amazing. Please—the
    Android Market is, for lack of a better phrase, full of crap. The world doesn''t
    need another flatulence app; we need things that make data more accessible, meaningful,
    fun, useful, and interesting. Do not build apps, build applications.


    Good luck, and happy hacking.'
