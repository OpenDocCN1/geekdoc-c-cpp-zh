    \ ten nested layouts of any kind. In practice, do everything you can to use as\
    \ few layouts as possible, because you’ll start to see slowdowns on older, slower\
    \ phones when your layout depths are greater than seven or eight. If you find\
    \ you’ve gotten in over your head with a stack of LinearLayouts, consider refactoring\
    \ with a single RelativeLayout instead.\n\n![](img/47ad0ac10bf11125744ef22c945d3099_100_0.png)\n\
