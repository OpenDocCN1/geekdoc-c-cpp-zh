  - '[PAGE 46]


    # GETTING INTENTS


    Intents can take a myriad of forms.


    You use them anytime you need to start an activity or service. Further, you''ll
    frequently use intents for system-wide communication. For example, you can receive
    notifications about power system changes by registering for a widely published
    intent. If one of your activities registers for an intent in the manifest (for
    example, com.haseman.peachPit.OhOhPickMe), then any application anywhere on the
    phone can, if you make your activity public, launch directly to your activity
    by calling


    ```

    startActivity(new Intent("com.haseman.peachPit.OhOhPickMe"));

    ```


    # THE LIFE AND TIMES OF AN ACTIVITY


    It''s good to know early on that each activity lives a very short but exciting
    life. It begins when an intent that your activity is registered to receive is
    broadcast to the system. The system calls your activity''s constructor (while
    also starting your application as necessary) before invoking the following methods
    on the activity, in this order:


    +   1. onCreate

    +   2. onStart

    +   3. onResume


    When you implement an activity, it''s your job to extend the methods that make
    up this lifecycle. The only one you are required to extend is onCreate. The others,
    if you declare them, will be called in the lifecycle order.


    Your activity is the top visible application, can draw to the screen, will receive
    key events, and is generally the life of the party. When the user presses the
    Back key from the activity, these corresponding methods are called in the following
    order:


    +   1. onPause

    +   2. onStop

    +   3. onDestroy'
  - '[PAGE 47]


    # THE SHORT, BRUTAL LIFE OF THE ACTIVITY


    An activity''s life is an incredibly short one. They are constantly created and
    destroyed, so it''s very important that you save no data in them that has any
    relevance outside the screen your activity will control.


    The following are all valid actions that will result in the destruction of any
    activity:


    +   1. The user rotated the device from portrait to landscape or vice versa.

    +   2. The activity is no longer visible onscreen or the system is low on resources.

    +   3. It’s Tuesday.

    +   4. The user has pressed the Back or Home buttons and left your application.


    Again, make sure the data members of your activity pertain only to the elements
    on the screen. Further, don’t expect the activity to save any data for you. You’ll
    learn strategies to handle this in later chapters.


    After these methods have executed, your activity is closed down and should be
    ready for garbage collection.


    In order to make sense of the activity’s flow, let’s quickly look over each lifecycle
    method in detail. Remember that you must invoke the superclass call in each of
    these methods (often before you do anything else) or Android will throw exceptions
    at you.


    > **NOTE:** `onCreate` is the only one of the application lifecycle methods that
    you must implement. I’ve found, in most of my work with Android, that I only end
    up implementing one or two of these methods depending on what each activity is
    responsible for.


    ![](img/47ad0ac10bf11125744ef22c945d3099_47_0.png)


    # PUBLIC VOID ONCREATE(BUNDLE ICICLE)


    Android will call your declaration of this method as your activity is starting.
    Remember, however, that during the run of your application you may go through
    several instances of each activity. If, for example, the user changes the screen
    orientation from landscape to portrait, your activity will be destroyed and a
    new instance of the same activity will be created and initialized.'
