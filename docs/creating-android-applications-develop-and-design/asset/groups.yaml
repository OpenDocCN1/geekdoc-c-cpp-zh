    # # INTRODUCTION


    If you''ve got a burning idea for an application that you''re dying to share,
    or if you recognize the power and possibilities of the Android platform, you''ve
    come to the right place. This is a short book on an immense topic.


    I don''t mean to alarm anyone right off the bat here, but let me be honest: Android
    development is hard. Its architecture is dissimilar to that of many existing platforms
    (especially other mobile SDKs), there are many traps for beginners to fall into,
    and the documentation is frequently sparse at best. In exchange for its difficulty,
    however, Google''s Android offers unprecedented power, control, and—yes—responsibility
    to those who are brave enough to develop for it.


    This is where my job comes in. I''m here to make the process of learning to write
    amazing Android software as simple as possible.


    Who am I to ask such things of you? I''ve been writing mobile software in a professional
    capacity for more than eight years, and for three of those years, I''ve been developing
    software for Android. I''ve written code that runs on millions of handsets throughout
    the world. Also, I have a beard. We all know that people with ample facial hair
    appear to be more authoritative on all subjects.


    In return for making this learning process as easy as possible, I ask for a few
    things:


    +   - **You have a computer.** My third-grade teacher taught me never to take
    anything for granted; maybe you *don''t* have a computer. If you don''t already
    have a computer, you''ll need one—preferably a fast one, because the Android emulator
    and Eclipse can use up a fair amount of resources quickly.


    > > **NOTE:** Android is an equal opportunity development platform. While I personally
    develop on a Mac, you can use any of the three major platforms (Mac, PC, or Linux).


    +   - **You''re fluent in Java.** Notice that I say *fluent*, not *expert*. Because
    you''ll be writing usable applications (rather than production libraries, at least
    to start), I expect you to know the differences between classes and interfaces.
    You should be able to handle threads and concurrency without batting an eyelash.
    Further, the more you know about what happens under the hood (in terms of object
    creation and garbage collection), the faster and better your mobile applications
    will be.


    Yes, you can get through the book and even put together rudimentary applications
    without knowing much about the Java programming language.


    ![](img/47ad0ac10bf11125744ef22c945d3099_12_0.png)'
