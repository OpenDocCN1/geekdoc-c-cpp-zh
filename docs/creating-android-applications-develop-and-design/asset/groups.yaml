  - '[PAGE 252]


    As you can see, Google has been very busy building new user interface paradigms
    for tablets in Honeycomb. Once they settled on how to make the tablets work, they
    added those new UI methods to the telephone world with Ice Cream Sandwich.


    Using the action bar, Google was able to do away with two hard menu but-tons (options
    menu and search), while keeping those concepts active in the user experience.
    The options menu button was replaced by icons added to the action bar, and the
    search button was replaced by the ability to add custom action views to that very
    same bar.


    With fragments, Google has enabled us to place more or less on the screen as the
    available real estate shifts between devices. Through fragments, we are no longer
    limited to having one *thing* on the screen at any given time. However, if we
    need to handle smaller screens, fragments make it easy to shift back into the
    one-thing-per-screen layout.


    Fragments and the action bar are very new concepts, and it''s clear that Android
    developers are still trying to figure out how best to use them. Please, help us
    to push the mobile user experience forward by implementing your own killer user
    interfaces using these new toys Google has given us.'
