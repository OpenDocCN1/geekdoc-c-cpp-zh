    \ 3.5).\n\nNot perfect, but a vast improvement over the AbsoluteLayout’s version\
    \ of the landscape screen.\n\n## USING LINEARLAYOUTS\n\nWhen using the LinearLayout,\
    \ the order in which you define your views is the order in which they’re placed\
    \ on the screen. First, take a look at that second LinearLayout:\n\n```xml\n<LinearLayout\n\
    \    android:layout_width=\"match_parent\"\n    android:layout_height=\"wrap_content\"\
    \n    android:orientation=\"horizontal\"\n    android:background=\"#333333\"\n\
    \    android:id=\"@+id/button_bar\"\n>\n```\n\n## ONE VIEW MUST BE IN CHARGE OF\
    \ SIZE\n\nOne view, or layout, must define a height and width value. You cannot\
    \ tell Android that you'd like a layout to wrap its content while, at the same\
    \ time, telling a view that it should match its parent. This will cause a compile\
    \ error because Android has no idea how big to make either the parent view or\
    \ the child layout. Something must define an actual height, even if it's an image\
    \ or a line of text.\n\nBy setting the orientation to horizontal, Android knows\
    \ to place the children in order from left to right across the top of the screen.\
    \ The outer layout is a vertical one, allowing placement of the button bar above\
    \ the image.\n\nBy setting the width to match_parent, I'm making sure the layout\
    \ itself stretches all the way across the parent layout (in this case the entire\
    \ screen). The height is set to wrap_content, so it will be exactly as tall as\
    \ the final measured height of its children.\n\nThe LinearLayout distributes its\
    \ children in the order they're defined. It then measures all the child views\
    \ to see how much space they'd like to take up. It will then divvy up the available\
    \ space in proportion to the ideal size of its children. If there is too little\
