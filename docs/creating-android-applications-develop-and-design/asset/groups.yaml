    \ Windows 用户，请允许安装程序打开 AVD（Android 虚拟设备）管理器软件。\n\n你应该会看到 Android SDK Manager。\n\
    \n![](img/47ad0ac10bf11125744ef22c945d3099_23_0.png)\n\n![](img/47ad0ac10bf11125744ef22c945d3099_23_1.png)\n\
    \n**图 1.2** Eclipse 巧妙隐藏插件安装向导的位置。\n\n**图 1.3** 插件安装向导的全貌，虽然乏善可陈。\n\n幸运的是，在 Windows、Mac\
    \ 和 Linux 上配置 Eclipse 的方式是一致的。启动 Eclipse，并指定你希望工作区所在的位置。理论上，它可以安装在任何地方，但我总是把自己的工作区放在\
    \ Mac 上的 ~/Documents/workspace 下。只要你始终使用同一个目录，就不应遇到任何问题。\n\n## 将 Android 插件添加到\
    \ Eclipse\n\n现在你已经让 Eclipse 运行起来了，接下来需要添加 Android 的 ADT 插件。正是这个神奇组件，将 Eclipse\
    \ 从一个纯粹的 Java 开发工具变成用于制作 Android 应用程序的工具。\n\n1. 从 Eclipse 的 Help 菜单中选择 Install\
    \ New Software（图 1.2）。\n2. 在 Install 弹出窗口的 Work With 字段中输入 https://dl-ssl.google.com/android/eclipse/。你的设置应如图\
    \ 1.3 所示。\n3. 为该站点取一个你选择的名字。我的名字就是简单的“android_stuff”。\n\n    你会看到安装几个软件包的选项。\n\
    \n4. 将它们全部选中，点击 Next，然后再次点击 Next。\n5. 接受 Google 的条款和条件。Eclipse 将下载相应的插件包。\n\n\
    > **注意：** 如果你在安装 Eclipse 插件时遇到问题，请确保网络连接正常。尝试将插件 URL 中的“https”改为“http”。如果仍然不行，请前往\
    \ http://developer.android.com/sdk/eclipse-adt.html#installing，在那里你会找到一些更有帮助的调试步骤。\n\
    \n![](img/47ad0ac10bf11125744ef22c945d3099_24_0.png)\n\n下载完成之前，你可能会收到警告，提示即将安装未签名的代码。这是预期之内的。（别慌。）\n\
    \n6. 接受未签名代码警告，并允许下载继续。\n7. 出现提示时重启 Eclipse。\n\n## 定位 SDK\n\n再完成一步，你就能创建项目了。你需要告诉\
    \ Eclipse 到哪里找到你的 Android SDK。\n\n1. 启动 Eclipse。你应该会看到有用的欢迎屏幕。\n2. 选择 File > Preferences。\n\
    \n    如果到目前为止你做的所有事情都正常，你应该会在左侧列表中看到 Android 选项。\n\n3. 点击 Android。\n\n![](img/47ad0ac10bf11125744ef22c945d3099_26_0.png)\n\
    \n**图 1.5** 配置新的 Android 虚拟设备（AVD）。\n\n这个屏幕应该看起来很熟悉，因为你刚刚用它安装了一两个应用程序平台。现在你又回来创建一个新的虚拟设备。\n\
    \n2. 在 Android SDK Manager 打开的情况下，确保选中 Virtual Devices 选项卡，然后点击 New。将弹出一个新的模拟器对话框。\n\
    3. 在 Name 字段中，为你的模拟器取一个名字；最好取一个有助于与其他模拟器区分开的名字。在发布第一个应用程序之前，你可能会收集好几个模拟器。\n4.\
    \ 从 Target 下拉菜单中，指定你想以哪个 SDK 为目标。目前最简单的是从 Gingerbread (2.3.3) 开始，但一切在 Ice Cream\
    \ Sandwich (4.0) 上仍可正常工作。\n5. 在 SD Card 字段中，选择 Size 单选按钮，并输入一个小尺寸。\n6. 在 Skin\
    \ 部分，选择 Built-In 单选按钮，并从下拉菜单中选择 Default WVGA800。\n\n完成后的屏幕应如图 1.5 所示。\n\n## 目录\n\
    \n- 第一部分：上官仪的诗 1\n- 第二部分：王绩的诗 13\n- 第三部分：寒山子的诗 35\n- 第四部分：王梵志的诗 67\n- 第五部分：卢照邻的诗\
    \ 75\n- 第六部分：骆宾王的诗 103\n- 第七部分：杜审言的诗 123\n- 第八部分：沈佺期的诗 135\n- 第九部分：宋之问的诗 151\n\
    - 第十部分：陈子昂的诗 175\n- 第十一部分：张若虚的诗 191\n- 第十二部分：张说、苏颋的诗 197\n- 第十三部分：孟浩然的诗 215\n\
    - 第十四部分：王昌龄的诗 247\n- 第十五部分：王维的诗 267\n- 第十六部分：高適的诗 299\n- 第十七部分：岑参的诗 315\n- 第十八部分：崔颢的诗\
    \ 337\n- 第十九部分：李白诗选 351\n- 第二十部分：杜甫诗选 443\n- 第二十一部分：刘长卿的诗 539\n- 第二十二部分：韦应物的诗\
    \ 549\n- 第二十三部分：李益的诗 559\n- 第二十四部分：孟郊的诗 567\n- 第二十五部分：韩愈的诗 581\n- 第二十六部分：白居易诗选\
    \ 591\n- 第二十七部分：元稹的诗 633\n- 第二十八部分：贾岛的诗 645\n- 第二十九部分：刘禹锡的诗 653\n- 第三十部分：柳宗元诗选\
    \ 671\n- 第三十一部分：张籍的诗 685\n- 第三十二部分：王建的诗 693\n- 第三十三部分：李贺的诗 705\n- 第三十四部分：杜牧的诗\
    \ 717\n- 第三十五部分：李商隐的诗 729\n- 第三十六部分：温庭筠的诗 741\n- 第三十七部分：皮日休的诗 749\n- 第三十八部分：司空图、罗隐的诗\
    \ 755\n- 第三十九部分：贯休、齐己的诗 765\n- 第四十部分：聂夷中、杜荀鹤的诗 773\n\n## 创建新的 Android 项目\n\n![](img/47ad0ac10bf11125744ef22c945d3099_29_0.png)\n\
    \n![](img/47ad0ac10bf11125744ef22c945d3099_29_1.png)\n\n**图 1.7** 在此处选择项目类型（Android\
    \ Project）。\n\n**图 1.8** 在此处输入项目的所有繁琐细节。\n\nGoogle 提供了几种有用的方法来创建新的 Android 项目。\n\
    \n1. 如果 Eclipse 尚未运行，请启动它。\n2. 选择 File > New > Project。你应该会看到 New Project 屏幕（**图\
    \ 1.7**）。\n3. 点击 Next，Android 友好的项目创建向导就会启动（**图 1.8**）。\n\n我们来逐一看看，在填写每个字段时，它们对你的项目意味着什么。\n\
    \n> **注意：** 如果你没有看到 Android 文件夹，需要确保已正确安装 Android Eclipse 插件。回到“配置 Eclipse”一节，看看哪里可能出了问题。\n\
    \n4. 在 Project Name 字段中输入项目名称。\n\n    这是 Eclipse 跟踪你的项目的方式。此外，它会创建一个使用该名称的文件夹，并将你的所有项目文件放入其中。安装后，项目名称不会显示在\
    \ Android 设备的任何地方。项目名称其实只对 Eclipse 有意义，所以我倾向于为项目选择描述性的名称。\n\n5. 在 Build Target\
    \ 部分，选择你要针对的 Android 版本。\n\n    较新版本的 Android 始终支持通过较旧 SDK 构建的应用程序。它们通过所谓的*兼容模式*来实现这一点。目前，尽量以你能针对的最高级版本为目标。\n\
    \n6. 在 Application Name 字段中，输入应用程序的完整名称。\n\n    安装应用后，这就是应用抽屉中显示的名称。\n\n7. 在 Package\
    \ Name 字段中，输入你将要放置第一个 activity 的 Java 包。\n\n8. 选中 Create Activity 复选框，并在文本框中为新\
    \ activity 输入名称。\n\n    此步骤会创建一个使用该名称的新类，因此适用 Java 类命名约定。在第 2 章中，你将更具体地了解 activity\
    \ 是什么以及它们如何工作。\n\n9. 点击 Finish，你就可以开始大展身手了！\n\n现在你有了一个项目，我们让它运行起来吧。\n\n"
