    # HOW DO THESE OBJECTS INTERACT?


    To understand how the ListView interacts with the Adapter, there are a few constraints
    you must understand. First, lists could scroll on to infinity, at least from the
    point of view of the device. Yet, as you might have guessed, the phone has a limited
    amount of memory. This means that not every single list item can have its own
    entry in the list, because the device would quickly run out of space. Further,
    if the ListView had to lay out every single row right up front, it could be bogged
    down for an unacceptable amount of time.


    What Android does to solve these problems is to recycle list element rows. The
    process looks a little bit like this:


    +   1. Android goes through the entire list, asking each row how large it would
    like to be (this is so it knows how large to draw the scroll indicator).

    +   2. Once it knows roughly how big the entire ListView will be, it then requests
    views for the first screen, plus a buffer (so it won''t have to stop and get more
    when the user starts scrolling). Your adapter will have to create, configure,
    and return those views as the ListView calls getView over and over again.

    +   3. As the user scrolls down and rows fall off the top of the list, Android
    will return them to you when it calls getView. Effectively, it''s asking you to
    reuse a previous view by passing in the convertView object to you.


    While recycling list element rows is great for conserving memory and speeding
    up long lists, it has some interesting side effects.


    +   - All your list views, in order to take advantage of the built-in recycling,
    must always inflate from the same row layout. Android won''t know what type of
    list item you''ll want to create; so if you had, for example, three different
    row layouts, the system would not know which one to pass back to you, and you''d
    have to handle your own pools of unused views.

    +   - Any asynchronous task, such as loading an icon from disk or loading a user''s
    profile icon, must check that the ListView hasn''t recycled the view while it''s
    been downloading or loading the image data. If the row is still showing the same
    data when the task finishes, it''s safe to update the row; otherwise, it needs
    to cache or chuck the data.'
