  mdcn: "\n## 主线程\n\nAndroid 操作系统恰好只有一个受眷顾的线程，被授权修改任何用户将看到的内容。这缓解了原本可能成为并发噩梦的问题，例如一个线程中视图位置和数据发生变化，而另一个线程正试图将它们布局到屏幕上。如果只允许一个线程接触用户界面，Android\
    \ 就能保证在测量视图并将其渲染到屏幕时，关键内容不会被更改。不幸的是，这对你获取和处理数据的方式会产生严重影响。让我从一个简单的例子开始。\n\n## 喂，你，把数据给我取来！\n\
    \n如果我现在让你下载一张图片并显示到屏幕上，你可能会写出很像下面这样的代码：\n\n```java\npublic void onCreate(Bundle\
    \ extra) {\n    try {\n        URL url = new URL(\"http://wanderingoak.net/bridge.png\"\
    );\n        HttpURLConnection httpCon =\n            (HttpURLConnection) url.openConnection();\n\
    \        if (httpCon.getResponseCode() != 200)\n            throw new Exception(\"\
    Failed to connect\");\n        InputStream is = httpCon.getInputStream();\n  \
    \      Bitmap bitmap = BitmapFactory.decodeStream(is);\n        ImageView iv =\
    \ (ImageView) findViewById(R.id.main_image);\n        if (iv != null)\n      \
    \      iv.setImageBitmap(bitmap);\n    } catch (Exception e) {\n        Log.e(\"\
    ImageFetching\", \"Didn't work!\", e);\n    }\n}\n```\n\n![图4.1](img/47ad0ac10bf11125744ef22c945d3099_116_0.png)\n\
    \n图4.1 当你把主线程扣为人质时用户看到的内容。\n\n我最初面对同样的问题时，做的正是这件事。虽然这段代码会获取并显示所需的位图，但代码中潜伏着一个非常险恶的问题——也就是说，代码本身运行在主线程上。为什么这是个问题？想想看，只能有一个主线程，而主线程是唯一能够以任何方式与屏幕交互的线程。这意味着，当示例代码等待网络返回图像数据时，任何内容都无法渲染到屏幕上。这段获取图像的代码会阻止设备上任何地方发生任何操作。如果你把主线程扣为人质，按钮将不会被处理，电话无法接听，而且在你释放它之前，任何内容都无法绘制到屏幕上。\n\
    \n## 看门狗\n\n鉴于一个简单的程序员错误（比如示例代码中的错误）就可能有效瘫痪任何 Android 设备，Google 不遗余力地确保没有任何单个应用能够长时间控制主线程。占用主线程太多时间，会导致这个灾难性的对话框屏幕（图4.1）覆盖在你的应用之上。\n\
    \n## 追踪 ANR 崩溃\n\n每当你看到 ANR 崩溃，Android 都会写一个包含完整堆栈跟踪的文件。你可以使用以下 ADB 命令行访问该文件：`adb\
    \ pull /data/anr/traces.txt`。这应该有助于你找到出问题的那一行。`traces.txt` 文件会显示程序中每个线程的堆栈跟踪。列表中的第一个线程通常是需要仔细查看的线程。有时，长时间运行的阻塞操作会在系统开始写入\
    \ `traces.txt` 之前完成，这会使堆栈跟踪令人困惑。你的长时间运行操作很可能就在 Android 开始因主线程被延迟而恼火之后不久完成了。然而，在显示图像的示例代码中，它可能会显示\
    \ `httpCon.getResponseCode()` 是罪魁祸首。你会知道这一点，因为它会被列为应用线程列表下最顶层的堆栈跟踪。\n\n这个对话框被开发者不客气地称为\
    \ ANR（应用无响应）崩溃。尽管操作会在后台继续，用户也可以按“等待”按钮回到应用中正在进行的任何操作，但这对大多数用户来说是灾难性的，你应不惜一切代价避免它。\n\
    \n## 不要做什么\n\n你应该在主线程上避免哪些类型的事情？\n\n- 任何涉及网络的操作\n- 任何需要从文件系统读取或向文件系统写入的任务\n- 任何类型的繁重处理（例如图像或视频修改）\n\
    - 任何在你等待某件事完成时阻塞线程的任务\n\n排除这份列表，剩下的就不多了，因此，作为一般规则，如果它不涉及用户界面的设置或修改，*不要*在主线程上做。\n\
    \n## 我什么时候在主线程上？\n\n每当系统调用某个方法时（除非明确说明并非如此），你可以确定自己在主线程上。再次强调，作为一般规则，如果你不在自己创建的线程中，那么可以安全地假设你很可能在主线程上，所以要小心。\n\
    \n## 离开主线程\n\n你可以明白为什么在抓取一张金门大桥的傻气图片时把主线程扣为人质是个坏主意。但你可能会想，我怎样才能离开主线程呢？一个有创造力的黑客可能会简单地把所有出问题的代码移到一个单独的线程中。这位想象中的黑客可能会写出类似下面这样的代码：\n\
    \n```java\npublic void onCreate(Bundle extra) {\n    new Thread() {\n        public\
    \ void run() {\n            try {\n                URL url = new URL(\"http://wanderingoak.net/bridge.png\"\
    );\n                HttpURLConnection httpCon = (HttpURLConnection) url.openConnection();\n\
    \                if (httpCon.getResponseCode() != 200)\n                    throw\
    \ new Exception(\"Failed to connect\");\n                InputStream is = httpCon.getInputStream();\n\
    \                Bitmap bt = BitmapFactory.decodeStream(is);\n               \
    \ ImageView iv =\n                    (ImageView) findViewById(R.id.remote_image);\n\
    \                iv.setImageBitmap(bt);\n            } catch (Exception e) {\n\
    \                //handle failure here\n            }\n        }\n    }.start();\n\
    }\n```\n\n“好了，”你那有进取心的黑客朋友可能会说，“我已经修复了你的问题。主线程可以继续运行，不受那些傻气的 PNG 下载代码阻碍。”然而，这段新代码还有另一个问题。如果你在自己的模拟器上运行该方法，你会看到它抛出异常，并且无法在屏幕上显示图像。\n\
    \n你现在可能会问，为什么会出现这个新的失败？嗯，还记得主线程是唯一被允许修改用户界面的线程吗？调用 `setImageBitmap` 恰恰属于这些修改的范畴，因此只能在主线程上完成。\n\
    \n## 回到主线程\n\nAndroid 通过 Activity 类提供了一种回到主线程的方法，只要你能访问一个 activity。让我修正这位黑客的代码，使其正确做到这一点。由于我不想把代码缩进到下一页，我将从创建位图的那一行继续（记住，我们仍然在\
    \ Activity 类中，在 onCreate 方法内，在一个内联线程声明内）（为什么我脑海里响起了《盗梦空间》的音乐？）。\n\n为便于定位，我将从上一个代码清单中创建位图的那一行继续。如果你感到困惑，请查看本章的示例代码。\n\
    \n```java\nfinal Bitmap bt = BitmapFactory.decodeStream(is);\nImageActivity.this.runOnUiThread(new\
    \ Runnable() {\n    public void run() {\n        ImageView iv = (ImageView) findViewById(R.id.remote_image);\n\
    \        iv.setImageBitmap(bt);\n    }\n});\n//All the close brackets omitted\
    \ to save space\n```\n\n记住，我们已经在一个线程中运行，所以仅访问 `this` 会指向该线程本身。另一方面，我需要在这个 activity\
    \ 上调用一个方法。调用 `ImageActivity.this` 会提供一个指向外部 Activity 类的指针，我们正是在这个类中启动了这段临时拼凑的代码，因此可以调用\
    \ `runOnUiThread`。此外，因为我想在不同的线程中访问最近创建的位图，我需要将位图声明设为 `final`，否则编译器会对我们发脾气。\n\n\
    当你调用 `runOnUiThread` 时，Android 会在主线程从其他任务中空闲下来后尽快安排这项工作完成。一旦回到主线程，所有同样的“不要独占”规则再次适用。\n\
    \n## 一定有更好的办法！\n\n如果你看着这段杂乱、令人困惑、无法取消的代码，心里想：“自己：一定有更干净的方法来做这件事，”那你就对了。处理长时间运行的任务有很多方法；我将向你展示我认为最有用的两种。一种是\
    \ AsyncTask，一种在 activity 内执行简单操作的简单方式。另一种是 IntentService，它更复杂，但在处理可能跨越多个 activity\
    \ 的重复性工作方面要好得多。\n\n"
