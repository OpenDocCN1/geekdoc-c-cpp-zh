  mdcn: "\n![](img/47ad0ac10bf11125744ef22c945d3099_258_0.png)\n\n既然版本号已经整理好，代码已经测试过，所有资源也已就位，那么在提交之前就该创建一个发布构建了。\n\
    \n生成最终 APK 有两种方式：通过 Apache 的 ant（它会结合 build.xml 文件从命令行构建你的应用程序），或者通过 Eclipse 的\
    \ Android 工具。如果你习惯使用命令行，我假设你可以自行创建发布构建。在本章中，我将重点介绍如何通过 Eclipse 创建发布构建。\n\n###\
    \ 导出已签名的构建\n\nEclipse 工具让生成有效的发布构建变得非常容易。只需在 Package Explorer 中右键单击你的项目，然后选择 Android\
    \ Tools > Export Signed Application Package（图 11.1）。\n\n### 记得禁用日志记录\n\n在发布任何内容之前，通读你的代码库，确保没有你不想让任何拿着\
    \ Micro USB 数据线的人看到的额外日志行。还要记住，拥有相应权限的应用程序可以查看日志输出。话虽如此，在应用程序中保留一些用于灾难性错误的日志再发布，也不算坏主意（以防在现场出现故障）。\n\
    \n系统会询问你要使用现有的密钥库文件，还是创建一个新的。由于这是你第一次发布产品，你需要创建一个新的。输入文件的位置，或单击 Browse 按钮查找位置。输入密码，并再次输入以确认密码正确（**图\
    \ 11.2**）。*密钥库*是一个可以包含任意数量密钥的文件。就你的目的而言，你实际上只需要一个密钥。你所有的应用程序都可以用同一个密钥签名，也可以使用不同的密钥——这由你决定（但我建议只使用一个，因为这样需要跟踪的内容更少）。\n\
    \n### 备份你的密钥库文件\n\n我再说一遍：备份你的密钥库文件。如果我能发明一种方法，在纸质书里做出 HTML `<blink>` 标签，我会在这里用上。如果你没有用同一个密钥签名，Android\
    \ Market 就不会允许你升级应用程序。如果你丢失了刚刚创建的密钥库文件，你将永远无法升级你的应用程序。把它刻录到光盘，并将光盘存放在你家以外的地方。把它保存在云端（Amazon\
    \ S3、Dropbox、你母亲家），尽可能多地保存在安全的地方。\n\n创建密钥库后，Eclipse 会要求你创建一个密钥。你并不需要填写所有下面的字段。不过，如果你要填写，大概应该比我\
    \ 在**图 11.3** 中更认真一些。\n\n![](img/47ad0ac10bf11125744ef22c945d3099_260_0.png)\n\
    \n![](img/47ad0ac10bf11125744ef22c945d3099_260_1.png)\n\n**图 11.2** 创建密钥库文件。\n\
    \n**图 11.3** 创建密钥\n\n你将创建一个密钥（放入新的密钥库文件），它需要一个别名和它自己的密码。\n\n务必让 Validity 字段中使用的数字足够大，以便在非常非常长的时间内保持有效。你永远不知道，Android\
    \ 可能在一千年后仍然存在。有备无患。最后，你需要至少填写其余几个字段中的一个，但我建议你尽可能多地填写适用的字段。\n\n单击 Next 创建密钥。你只需告诉\
    \ Eclipse 将 APK 放在哪里，就完成了！\n\n### 记得使用 Zipalign\n\n对于命令行用户来说，Eclipse 为用户做的一件事就是使用一个名为\
    \ Zipalign 的工具（位于 SDK 的 tools/ 文件夹中）。Zipalign 可以缩短应用程序的加载时间。如果你使用 Eclipse 工具，它已经自动为你完成这一步。如果你不使用\
    \ Eclipse，请确保在签署构建后，在命令行中执行这一步。这是免费的提速，所以一定要利用它。\n\n## 提交你的构建\n\n此时，该注册开发者账户并提交你的构建了。Android\
    \ 的应用程序提交页面相当不言自明，但我应该指出，重要的是向 Market 提供尽可能多的截图、视频和图形资源，只要你有时间生成它们。信不信由你，决定购买一个应用程序可能很困难。用户需要能够相信你的应用程序确实如宣传的那样工作，因此让他们先睹为快至关重要。\n\
    \n## 关注崩溃报告并修复它们\n\n应用市场提供了一项非常有用的能力：用户在遇到崩溃时，可以选择向你报告该崩溃。尽可能利用这一点。与用户保持联系，并修复你能修复的一切问题。当你遇到困难时，上网并使用所有可用的资源（你最喜欢的搜索引擎、Google\
    \ Groups 或 Stack Overflow，仅举几例）。如果你看到自己不理解的崩溃，其他开发者很可能也遇到过同样的问题；我们是一群非常乐于助人的人。\n\
    \n## 频繁更新\n\n提交后，你的应用程序会在数小时内出现在 Market 中。这让你可以频繁更新，以添加小功能、修复 bug 并进行小调整。没有其他平台能让你从提交到上架拥有这样的速度。利用它吧。如果你快速回应用户的问题，你会惊讶于他们会有多感激。\n\
    \n## 结语\n\n临别之际，我还想给你一条建议：为 Android 生态做出有意义的贡献。虽然你无疑会有这本书无法回答的问题，但你现在已经掌握了能够让你找到答案的词汇和知识。这意味着你没有任何借口不去做出令人惊叹的东西。拜托——用一句不太客气的话说，Android\
    \ Market 里满是垃圾。这个世界不需要又一个放屁应用；我们需要让数据更易获取、更有意义、更有趣、更有用、更引人入胜的东西。不要只做 app，要做出真正的\
    \ application。\n\n祝你好运，编程愉快。\n\n## 索引\n\n- :（冒号），与服务一起使用，161\n\n### A\n\n- AbsoluteLayout，78–82\n\
    \n- action bar\n  - action views，236\n  - 向其添加图标，233–234\n  - 添加标签页，235\n  - 删除图标，233\n\
    \  - 下拉列表 action view，236\n  - 特性，232\n  - 图标点击，234–235\n  - 显示，232\n\n- Activity。另见\
    \ intent\n  - Bundle 对象，35\n  - 冲突，44–45\n  - 为应用程序考虑，49\n  - 构造函数，31\n  - 创建，24–27\n\
    \  - 数据保留方法，35\n  - 销毁，32，36\n  - 获取 intent，31\n  - Intent 类，37\n  - intent，29–31，37\n\
    \  - 按键处理方法，29\n  - 启动，28–30\n  - 监听按键事件，28\n  - 定位，25\n  - NewActivity 类，39\n\
    \  - onCreate 方法，24，31–33\n  - onDestroy 方法，31，34\n  - onKeyDown 方法，28–30，40\n\
    \  - onPause 方法，31，34\n  - onResume 方法，31\n  - onRetainNonConfigurationInstance\
    \ 方法，35\n  - onSaveInstanceState 方法，35–36\n  - onStart 方法，31\n  - onStop 方法，31，34\n\
    \  - public void onCreate(Bundle icicle)，32–33\n  - public void onResume()，33\n\
    \  - public void onStart 方法，33\n  - 接收事件，41\n  - 屏幕布局，27–29\n  - 与布局文件分离，178\n\
