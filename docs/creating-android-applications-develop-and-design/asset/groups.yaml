    \n### VALUES 文件夹\n\n将用户界面的所有常量值（字符串、颜色或 int/string 数组）放到单独文件中，一开始听起来可能很烦（尤其是考虑到所有文本操作器都将接收资源\
    \ ID 或 CharSequence）。但是，在将应用程序翻译成不同语言时，这可以节省许多天的工作量。\n\n将所有字符串放在外部 XML 文件中还意味着，你的非技术同事（产品经理、设计师或事无巨细都要管的上司）可以操作屏幕、菜单和弹出对话框中的显示文本，而不必来打扰你。当然，前提是你教会他们如何编译和运行项目；不妨把本书第一章分享给他们。\n\
