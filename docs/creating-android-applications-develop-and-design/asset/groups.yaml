    \ the rest of the system.\n- **Controls built into headphones.** You'll want your\
    \ service to register to receive headset button intents through your manifest\
    \ (or at runtime when your service is started). At the very least, set your service\
    \ up to pause when the headset control is clicked.\n- **Phone calls.** By watching\
    \ the phone's call state either through the *TelephonyManager* or with the audio\
    \ focus tools, you *absolutely must* watch for incoming phone calls. You must\
    \ stop all audio when the phone rings. Nothing will enrage your users (and hurt\
    \ your ratings) more than not accommodating phone calls.\n- **Missing SD card.**\
    \ You'll want to make sure your app handles a missing or removed SD card correctly.\
    \ Users can mount their external cards as removable drives with the USB cable\
    \ at any point. Android will alert you if you listen for the ACTION_MEDIA_REMOVED\
    \ intent.\n\nThis might seem like a lot of things to look out for (and it is),\
    \ but never fear, the developers at Google have released an open source media\
    \ player (which they ship with the Android source code) that can be a great guide\
    \ for dealing with this stuff. As always, the documentation will have a lot on\
    \ the subject as well.\n\n## WRAPPING UP\n\nIn this chapter, I showed you how\
    \ to\n\n- Play a simple video\n- Play a sound effect when a button is pressed\n\
    - Take a previously created service interface and create a functional media player\
    \ from it\n\nYou should now be comfortable with the essentials for media playback.\
    \ If you’re looking to go further with videos (which I hope you are), you’ll want\
    \ to look into using a controller to modify the state of the video view.\n\nYour\
    \ next step to expand the media playback service is to think about how you’d pass\
    \ arrays of IDs (playlists) and how you’d deal with updating those playlists on\
    \ the fly (as users change them).\n\nAndroid can be a very powerful media platform\
    \ if you’re careful and treat it with care. Go forth and make a crop of better\
    \ music players—if for no other reason than so I can use them myself.\n\n## 9\n\
    \n## DETERMINING LOCATIONS AND USING MAPS\n\n![](img/47ad0ac10bf11125744ef22c945d3099_224_0.png)\n\
    \nOne of the chief benefits of building any mobile application is the ability\
    \ to provide location-aware data to users. Android is no exception. Taking advantage\
    \ of your user’s location to help them make informed decisions should always be\
    \ in the back of your mind. There is, however, a little to know about the basics\
    \ of determining and using the device’s location. I will show you a few tricks\
    \ for speedy acquisition and then quickly show you how to display Android’s built-in\
    \ Google Maps view.\n\n## FINDING A GOOD SUPPLIER\n\nYour first step in using\
    \ the location service, after you've added the permission of course, is finding\
    \ a good supplier. Each device could have several different location services\
    \ beyond the time- and power-consuming GPS system. Android allows you to specify\
    \ criteria for the eventual provider you'll use. You do this by building a list\
    \ of features you'd like and then asking Android for the one that best suits your\
    \ needs. Here's a rather idealistic example I've put together using the getBestProvider\
    \ method:\n\n```java\nprivate String getBestProvider(LocationManager locationManager){\n\
    \    Criteria criteria = new Criteria();\n    criteria.setAccuracy(Criteria.ACCURACY_COARSE);\n\
    \    criteria.setPowerRequirement(Criteria.POWER_LOW);\n    criteria.setCostAllowed(false);\n\
    \    return locationManager.getBestProvider(criteria, true);\n}\n```\n\nBefore\
    \ calling the getBestProvider method, you'll need to obtain a Location Manager\
    \ object, which you can do with the following code:\n\n```java\nlocationManager\
    \ = (LocationManager)getSystemService\n    (Context.LOCATION_SERVICE);\n```\n\n\
    Typically, I'll stash this pointer away somewhere so I never have to find it again.\n\
    \n## GETTING THE GOODS\n\nOnce you've received the string ID for your ideal provider,\
    \ you can register and start receiving location updates from the provider. Here's\
    \ the code to register for updates:\n\n```java\nlocationManager.requestLocationUpdates(provider,\
    \ 60000, 1000, this);\n```\n"
