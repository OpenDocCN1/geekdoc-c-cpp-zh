    0dp\"\n        android:layout_y=\"20dp\"\n        android:gravity=\"center\"\n\
    \        android:id=\"@+id/main_image\"\n        android:src=\"@drawable/bridge\"\
    \n        />\n</AbsoluteLayout>\n```\n\nswitch from, say, the Nexus S to the HTC\
    \ Hero, because they each have a different number of pixels on the screen.\n\n\
    I've included the AbsoluteLayout in this chapter because if I didn't, you might\
    \ find it on your own and wonder at what a gem you'd found. This is a cautionary\
    \ tale. The other layouts can be frustrating and time consuming up front, but\
    \ trust me, they'll pay off in the end.\n\nBottom line: Don't use AbsoluteLayouts\
    \ except for extremely simple cases. I could see it used to lay out a small, sophisticated\
    \ button that could then be dropped into one of the more dynamic layout classes...but\
    \ please, for your own sanity, don't use this layout object unless you absolutely\
    \ cannot avoid it.\n\n## THE LINEARLAYOUT\n\nA LinearLayout is the exact opposite\
    \ of the AbsoluteLayout. Within it, you'll define a series of views, and the system\
    \ will size and place them dynamically on the screen in the order you've specified.\
    \ This layout is, and I cannot emphasize this enough, not very good for putting\
    \ views exactly where you want them. I'm saving the layout class that is best\
    \ at this for last.\n\nHere's how the original picture viewer looks when designed\
    \ to work with a LinearLayout:\n\n```xml\n<LinearLayout\n    xmlns:android=\"\
    http://schemas.android.com/apk/res/android\"\n    android:layout_width=\"match_parent\"\
    \n    android:layout_height=\"match_parent\"\n    android:orientation=\"vertical\"\
    \n    >\n    <LinearLayout\n        android:layout_width=\"match_parent\"\n  \
    \      android:layout_height=\"wrap_content\"\n        android:orientation=\"\
    horizontal\"\n        android:background=\"#333333\"\n        android:id=\"@+id/button_bar\"\
    \n        >\n```\n"
