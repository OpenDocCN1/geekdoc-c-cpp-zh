    \ include。如果你不想在布局层级中额外增加一层布局，而是想从其他 XML 文件引入一系列视图，只需用 `<merge>` 标签包裹它们即可。\n\n\
    ```xml\n<merge xmlns:android=\"http://schemas.android.com/apk/res/android\">\n\
    <!-- views go here -->\n</merge>\n```\n\n这样你就可以在不向视图层级中添加额外布局的情况下引入视图。\n\n## 除了横屏，还能做什么？\n\
    \n很多。你可以为布局文件夹添加后缀，以适应几乎所有的场景。以下是我经常使用的一些后缀。\n\n- layout-small、layout-normal、layout-large、layout-xlarge\n\
    \n  尺寸修饰符对应屏幕的物理大小。使用 small 布局文件夹的设备通常非常老旧，或者是非常特殊的硬件，至少在 Android 手表普及之前是这样。大多数现代手机属于\
    \ layout-normal 类别，而许多平板电脑被视为 xlarge。Google 在 http://developer.android.com/resources/dashboard/screens.html\
    \ 上提供了各种屏幕配置的详细分类。\n\n- layout-ldpi、layout-mdpi、layout-hdpi、layout-xhdpi\n\n \
    \ 设备的 dpi（每英寸点数）是屏幕*密度*的度量。高密度（240 dpi）屏幕会从 layout-hdpi 布局文件夹中获取资源。\n\n- layout-large-hdpi-land\n\
    \n  你也可以混合搭配这些后缀。这个后缀将用于拥有大屏幕、高分辨率且处于横屏模式的手机。尽情发挥创意吧，但请记住，能针对屏幕配置做到非常精细并不代表你应该这么做。\n\
    \n## 完整的屏幕定义\n\n正如你可以放置独立的布局文件，供不同硬件配置下的 `<include>` 引用一样，你也可以在 layout-land 文件夹中为横屏模式定义一个完全不同的屏幕。这乍一看似乎是最佳方案，但从几个方面来看并不理想。\n\
    \n- 需要大量编码工作。\n\n  与其只定义两个随屏幕配置而变的小部分，你需要制作并测试多个完整的屏幕布局。\n\n- 后期修改会非常痛苦。\n\n \
    \ 硬件配置繁多，意味着会有大量不同的屏幕。如果你要为每种配置都完整地布局一个屏幕，那么当设计师要删除或添加一个按钮时，你就得面对一场噩梦。你必须在每个 XML\
    \ 文件中为每一个屏幕配置单独添加该按钮。\n\n撇开这两点不谈，有时候你确实需要为不同的硬件或屏幕配置准备一套完全独立的布局。尽可能修改小的部分，但必要时也不要害怕撸起袖子，创建一个全新的屏幕布局。\n\
    \n以“巧克力”示例为例，要创建新布局，你只需在 `/res/layout-land` 中创建第二个 `two_buttons.xml` 文件，并按任意方式配置屏幕即可。然后，在\
    \ activity 的 `onCreate` 方法中调用 `setContentView` 时，就会像 include 一样，为正确的屏幕配置找到正确的资源。\n\
    \n## 这怎么可能实现？\n\n这是个好问题，我很高兴你直到这一节末尾才问出来。因为 Android 将布局文件与 activity 分离，所以它可以为各种可能的屏幕配置提供任意数量的不同布局。你只需指定布局名称，Android\
    \ 就会自动搜索正确的 XML 文件展示给用户。为了让这个过程顺畅运行，请牢记以下几点：\n\n- 布局文件*必须*共享相同的名称。\n\n  Android\
    \ 只能通过名称查找布局 XML。只要布局文件具有完全相同的文件名，它就会从你的横屏（或其他）文件夹中找到对应版本。\n\n- 确保各个视图的 **ID**\
    \ 保持一致。\n\n  请记住，你的 activity 会调用 `findViewById` 来操作和交互屏幕上的对象。activity 不应该关心视图在哪个位置来注册点击监听器、设置图片或从\
    \ `EditText` 中获取数据。\n\n- 尽量不要在 activity 的 Java 代码中移动视图。\n\n  activity 不应该试图改变屏幕上对象的位置。在竖屏模式下，按钮可能位于点\
    \ (330, 120)；在横屏模式下，它又会处于完全不同的位置。这种情况下，添加更多屏幕布局还意味着需要向 activity 中添加相应的移动代码，这可能会非常耗时。\n\
    \n## 小心谨慎\n\n跨多个关联的布局文件调试布局问题可能非常耗费精力（我深有体会），所以请尽可能让布局保持弹性和动态。如果你的设计得当，充分利用线性布局和相对布局，它们应该能够自动适应许多屏幕分辨率。只有在动态布局无法胜任时，才回退到\
    \ include 和多重布局文件夹。不过，有时单个布局确实无法在所有屏幕上呈现出理想效果。当这种情况发生时，请让你的“拆分”尽可能小而高效。尽管大胆使用这个优秀的布局工具，但也要注意不要过度使用。\n\
    \n"
