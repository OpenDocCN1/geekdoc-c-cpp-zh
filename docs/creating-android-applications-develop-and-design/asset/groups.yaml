    \ full of data. As a last step, here's what you'll need to add to the MainMenuActivity's\
    \ onCreate method:\n\n```java\npublic void onCreate(Bundle bundle){\n    super.onCreate(bundle);\n\
    \    setContentView(R.layout.list_activity);\n    ArrayAdapter<CharSequence> adapter\
    \ =\n        ArrayAdapter.createFromResource(getApplicationContext(),\n      \
    \  R.array.menu_entries, R.layout.list_element);\n    setListAdapter(adapter);\n\
    }\n```\n\nBecause the ListView has the special @android:id/list system ID, the\
    \ List Activity knows where to find the ListView. As a result, you'll only have\
    \ to create the adapter and hand it over to the ListActivity. The ListActivity\
    \ will make sure that it's correctly plugged into the ListView and that everything\
    \ is drawn correctly.\n\n**FIGURE 5.1** A very basic main menu.\n\n![](img/47ad0ac10bf11125744ef22c945d3099_147_0.png)\n\
    \nTo create the ArrayAdapter, I specify the array of strings I defined in the\
    \ section \"Creating the Menu Data\" as well as the `list_element` layout I created\
    \ in \"Making a Menu List Item.\" Assuming that all your Tab A's are correctly\
    \ fitted into your Slot B's, the resulting screen will look something like Figure\
    \ 5.1.\n\nDo a little dance—you've now got a functional (albeit very simple) list!\
    \ Have a smoke, cup of coffee, sip of wine, or dog treat. Whatever you do to reward\
    \ yourself for a job well done, do it now. I'll be here when you get back.\n\n\
    ## REACTING TO CLICK EVENTS\n\nYour code will need to listen for item clicks.\n\
    \nWhat's the point of having a menu if you can't tell when items have been selected?\
    \ Right, there isn't one. Let me show you the final piece to my basic list menu\
    \ example. Add the following method to your MainMenuActivity.java file:\n\n```java\n\
    @Override\npublic void onListItemClick(ListView lv,\n        View clickedView,\n\
    \        int position, long id)\n{\n    super.onListItemClick(lv, clickedView,\
    \ position, id);\n    TextView tv = (TextView)clickedView;\n    Toast.makeText(getApplicationContext(),\n\
    \        \"List Item \"+tv.getText()+\" was clicked!\",\n        Toast.LENGTH_SHORT).show();\n\
    }\n```\n\nThe ListActivity will call this method (if you've defined it) every\
    \ time an element in the list view is clicked (or tapped with a finger). For more-complicated\
    \ lists, you may want to use the ID (especially if you are using SQLite as a backing\
    \ store). For this simple demo, I've just popped up a little dialog showing the\
    \ text of the item that was pressed. If you're implementing your own basic main\
    \ menu, I suggest you use the position of the clicked item to start an activity,\
    \ service, or other action. You can see an example of this if you look at the\
    \ associated source code.\n\nThat's the most basic list view I could possibly\
    \ show you. Now, I'll take you in the opposite direction and show you what a custom\
    \ list backed by a remote data source looks like.\n"
  mdcn: "\n## 创建 ListActivity\n\n现在你需要一个地方来显示列表项。你将创建一个 ListActivity 实例，用来显示最近创建的列表。\n\
    \n每个屏幕都必须有一个 Activity，列表屏幕也不例外。在这种情况下，Android 为你提供了一个专门为简化列表屏幕而构建的辅助类。它叫作 ListActivity，行为与\
    \ Activity 完全一样，只是多了几个让开发更轻松的方法。如果你跟着本章动手编码，就需要创建一个新项目。拿你通常会有的主 Activity，把它修改成如下代码清单所示：\n\
    \n```\npackage com.haseman.lists;\n\nimport android.app.ListActivity;\nimport\
    \ android.os.Bundle;\n\npublic class MainMenuActivity extends ListActivity{\n\t\
    public void onCreate(Bundle bundle){\n\t\tsuper.onCreate(bundle);\n\t\tsetContentView(R.layout.list_activity);\n\
    \t}\n}\n```\n\n不过，这段代码目前无法编译，因为我还没有定义 R.layout.list_activity 是什么样子。猜猜你接下来要做什么？\n\
    \n## 为 ListActivity 定义布局\n\n你需要为列表创建一个 XML 布局文件。这同样类似于你之前完成的其他布局任务，但有一个显著例外：你需要定义一个带有特殊\
    \ ID android:id/list 的 ListView。它告诉系统哪个列表视图是你的新 ListActivity 将要交互的主列表视图。我还在布局中添加了一个\
    \ TextView 作为大标题。我的 XML 文件如下：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
    ?>\n<LinearLayout\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
    \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
    \n    android:orientation=\"vertical\">\n        <TextView\n        android:layout_width=\"\
    match_parent\"\n        android:layout_height=\"0dp\"\n        android:layout_weight=\"\
    1\"\n        android:text=\"@string/main_menu\"\n        android:gravity=\"center\"\
    \n        android:textSize=\"40dp\"/>\n    <ListView\n        android:id=\"@android:id/list\"\
    \n        android:layout_width=\"fill_parent\"\n        android:layout_height=\"\
    0dp\"\n        android:layout_weight=\"1\"\n    android:gravity=\"center\"/>\n\
    </LinearLayout>\n```\n\n> **提示：** 特殊 ID：仅当你使用 ListActivity 内置的便捷方法时，才需要把 ListView\
    \ 的 ID 设为 android:id/list。如果你使用的是普通 Activity，则可以使用任意 ID。这个特殊 ID 将 ListActivity\
    \ 与它将要交互的单个 ListView 连接起来。\n\n### 一个优化技巧\n\n当你依靠 LinearLayout 为视图分配所有可用空间时，可以通过将（子布局中的）尺寸设为\
    \ 0 来节省一点时间。这意味着系统在绘制前遍历布局测量视图时，不必再计算对象的理想大小。这可能帮助不大，但如果你的布局包含大量视图，每一点节省都很重要。如前面的代码清单所示，我把高度设为\
    \ 0，因为 LinearLayout 会在它们之间分配所有空间。你还需要为该视图指定权重，否则它可能无法正常工作。\n\n考虑到你已阅读前面章节，这段 XML\
    \ 布局代码应该看起来很熟悉。它只是把屏幕空间分配给标题主菜单和子屏幕列表。你还可以看到所需的特殊 Android 列表 ID，它用于告诉 ListActivity\
    \ 应该与哪个视图交互。\n\n### 创建菜单列表项\n\n现在你要为单个列表元素创建一个布局 XML 文件。\n\n你需要声明一个单独的布局对象，用于定义每个元素在列表中的外观。我使用的是非常简单的\
    \ ArrayAdapter 版本，因此在此时，布局 XML 文件*必须*只包含一个文本视图。本章后面我们会讨论更复杂的菜单项。\n\n接下来，你需要在 /res/layout/\
    \ 文件夹中创建一个新文件，其中包含一个文本视图。我的项目中的 /res/layout/list_element.xml 如下：\n\n```xml\n<?xml\
    \ version=\"1.0\" encoding=\"utf-8\"?>\n<TextView\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
    \n    android:gravity=\"center\"\n    android:layout_height=\"wrap_content\"\n\
    \    android:layout_width=\"match_parent\"\n    android:textSize=\"20dp\"\n  \
    \  android:padding=\"15dp\"/>\n```\n\n实际上不需要为这个文本视图提供 ID，因为你会以布局对象的形式引用它（在本例中是\
    \ R.layout.list_element）。将 gravity 设置为 center，就是告诉该视图你希望文本位于多余可用空间的中央。将 padding\
    \ 设置为 15dp 还会给视图增加一点额外空间，这样手像我这样的人也能点中正确的那一项。\n\n现在我已经声明了列表元素应有的外观，就可以把它们添加到 ListView\
    \ 本身了。\n\n### 创建并填充 ArrayAdapter\n\n创建并配置一个 ArrayAdapter。ArrayAdapter 会把你的数据传递给\
    \ ListView。它还会按需实例化所需数量的 list_element 布局副本，使 ListView 中充满数据。最后一步，你需要将以下内容添加到 MainMenuActivity\
    \ 的 onCreate 方法中：\n\n```java\npublic void onCreate(Bundle bundle){\n    super.onCreate(bundle);\n\
    \    setContentView(R.layout.list_activity);\n    ArrayAdapter<CharSequence> adapter\
    \ =\n        ArrayAdapter.createFromResource(getApplicationContext(),\n      \
    \  R.array.menu_entries, R.layout.list_element);\n    setListAdapter(adapter);\n\
    }\n```\n\n由于 ListView 具有特殊的系统 ID @android:id/list，ListActivity 知道在哪里找到这个 ListView。因此，你只需创建适配器并将其交给\
    \ ListActivity。ListActivity 会确保它正确接入 ListView，并且所有内容都正确绘制。\n\n**图 5.1** 一个非常基础的主菜单。\n\
    \n![](img/47ad0ac10bf11125744ef22c945d3099_147_0.png)\n\n为了创建 ArrayAdapter，我指定了在“创建菜单数据”一节中定义的字符串数组，以及在“创建菜单列表项”一节中创建的\
    \ `list_element` 布局。假设你的所有 Tab A 都正确插入对应的 Slot B，最终屏幕看起来会像图 5.1 那样。\n\n跳个小舞吧——你现在有一个可用（虽然非常简单）的列表了！抽支烟、喝杯咖啡、抿口葡萄酒，或者来点狗零食。无论你用什么方式奖励自己出色地完成了工作，现在就去做吧。你回来时我还会在这里。\n\
    \n## 响应点击事件\n\n你的代码需要监听列表项点击。\n\n如果无法判断列表项何时被选中，那菜单还有什么意义？没错，毫无意义。让我向你展示基础列表菜单示例的最后一部分。将以下方法添加到\
    \ MainMenuActivity.java 文件中：\n\n```java\n@Override\npublic void onListItemClick(ListView\
    \ lv,\n        View clickedView,\n        int position, long id)\n{\n    super.onListItemClick(lv,\
    \ clickedView, position, id);\n    TextView tv = (TextView)clickedView;\n    Toast.makeText(getApplicationContext(),\n\
    \        \"List Item \"+tv.getText()+\" was clicked!\",\n        Toast.LENGTH_SHORT).show();\n\
    }\n```\n\n每当列表视图中的元素被点击（或用手指轻触）时，ListActivity 都会调用这个方法（如果你定义了它）。对于更复杂的列表，你可能需要使用\
    \ ID（尤其是在使用 SQLite 作为后端存储时）。在这个简单演示中，我只是弹出一个小对话框，显示被按下项的文本。如果你要实现自己的基础主菜单，我建议使用被点击项的位置来启动\
    \ Activity、Service 或其他操作。如果你查看相关源代码，就能看到这样的示例。\n\n这是我能向你展示的最基础的列表视图。现在，我会带你往相反方向走，向你展示由远程数据源支撑的自定义列表是什么样子。\n"
