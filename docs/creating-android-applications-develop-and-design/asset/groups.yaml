  - "[PAGE 56]\n\n# MANY INTENTS, ONE ACTIVITY\n\nOne activity may register to receive\
    \ any number of events. Typically, sending an intent is akin to telling the activity\
    \ “do this one thing!” That “one thing” can be anything from editing a file to\
    \ displaying a list of possible files or actions. Again, as we’ve discussed, it’s\
    \ important to limit the scope of your activity, so registering for only one intent\
    \ is often a good idea. However, because your activity could be registered for\
    \ more than one intent, it’s a good idea to call getIntent inside your onCreate\
    \ method and check why you’re being started so you can take the right action (by\
    \ calling getAction).\n\n# LISTENING FOR INTENTS AT RUNTIME\n\nAnother method\
    \ for receiving events that pertain only to your application or for receiving\
    \ events broadcast by the Android system itself is to listen for the intents at\
    \ runtime.\n\nLet’s say that your activity would like to show a special screen\
    \ or take a custom action when the user enables Airplane mode. To do this, you’ll\
    \ need to create a temporary IntentFilter and an inner BroadcastReceiver object\
    \ instance.\n\n# CREATE A RECEIVER\n\nLet’s add the runtime BroadcastReceiver\
    \ to the MyActivity class. A BroadcastReceiver is, as you can probably guess,\
    \ an object with a single onReceive method.\n\nChange the MyActivity class to\
    \ look like the following:\n\n```\npublic class MyActivity extends Activity {\n\
    \n    private BroadcastReceiver simpleReceiver=new BroadcastReceiver() {\n\n \
    \       public void onReceive(Context context, Intent intent) {\n\n          \
    \  if(intent.getAction().equals(\n\n                Intent.ACTION_AIRPLANE_MODE_CHANGED)){\n\
    \n                    Toast.makeText(context,\n\n                        R.string.airplane_change,\n\
    \n                        Toast.LENGTH_LONG).show();\n\n                }\n\n\
    \            }\n\n        };\n\n    //Rest of the Activity is here.\n\n    }\n\
    ```"
