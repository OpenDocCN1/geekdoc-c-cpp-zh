    \nISBN-13: 978-0-321-78409-4\nISBN-10: 0-321-78409-X\n\n9 8 7 6 5 4 3 2 1\n\n\
    在美国印刷和装订\n\n献给我的妻子 Meghan，她造就了今天的我——身为教师、作家和男人。\n\n## 作者简介\n\nChris Haseman 自\
    \ 2003 年以来一直以各种形式编写移动软件。他参与了多个大型 BREW 项目，从 MMS 消息到 Major League Baseball。最近，他是\
    \ doubleTwist 媒体播放器背后的早期 Android 工程师，现在他是网站 Tumblr 的首席 Android 开发者。他是纽约市 General\
    \ Assembly 的教职成员，在那里教授 Android 开发。他住在布鲁克林，在那里不断争论是否要剃掉胡子。\n\n## 致谢\n\n一如既往，我可以用比本书正文更多的篇幅来感谢人们。以下是几位特别突出的人：\n\
    \nDavid 和 Susanne H. 感谢他们的支持。Ellen Y. 感谢她那么早就相信我能做到。JBL 感谢他修复我的代码。Robyn T. 感谢她的耐心。Cliff\
    \ C. 感谢他找到了我。Scout F. 感谢她容忍我的语法。Sharon H. 感谢她的骚扰即时消息。Dan C. 感谢他的支持。Edwin 和 Susan\
    \ K. 感谢他们的关心。Thomas K. 感谢他微妙而安静的声音。Sparks 感谢他的幽默。Cotton 感谢他“一直在那里”。Lee 感谢他提供写作的地方。Tumblr\
    \ 和 doubleTwist 的团队感谢他们所有的鼓励。Google 的 Android 团队感谢他们所有的辛勤工作。最重要的是，Peachpit 感谢给我为你们写作的机会。\n\
