    \ default XML layout, the Android tools have added a simple TextView contained\
    \ inside a LinearLayout. When displayed onscreen, the contents of the hello string\
    \ will appear by default in the upper-left corner of the screen. I’ll discuss\
    \ how to position visual elements onscreen later in this chapter.\n\nTo display\
