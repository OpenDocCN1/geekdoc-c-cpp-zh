    \    }\n}\n```\n\n当 Android 编译你的 XML 文件时，会将其渲染为打包的二进制格式。这种格式的优点是加载快得多，因此你的屏幕可以更快地清晰呈现。缺点是这些文件一旦编译完成，你就无法修改它们。因此，你无法在运行时操作布局文件和字符串文件。不过，你可以通过加载和更改视图的\
