    \ is your gateway to everything you've defined inside the res folder. For every\
    \ layout, drawable, and identified view—and for a host of other things—Android\
    \ places a subsequent statically defined int into the R file that identifies those\
    \ things. Anytime you add a line to your layout XML defining a new ID (for example,\
    \ android:id=\"@+id/my_new_id\"), you'll find that after the next time you compile\
    \ your project, you'll have an entry in the R.id class. In the previous example,\
    \ this entry would be R.id.my_new_id.\n\n### RETRIEVING A VIEW\n\nGetting the\
    \ existing instance of an Android view is as simple as calling findViewById and\
    \ passing in the ID value found in the R.java file. Given the earlier XML example,\
    \ here's how you would grab an instance of the text view and modify its contents.\n\
    \n```java\npublic void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
    \    setContentView(R.layout.main);\n    TextView tv = (TextView)findViewById(R.id.text_holder);\n\
    \    if(tv!=null)\n        tv.setText(R.string.hello);\n}\n```\n\n## HANDLING\
    \ A FEW COMMON TASKS\n\nSome tasks are more common than others. Let's take a look\
    \ at how you can handle some of the ones that you'll do a few dozen times before\
    \ you finish your first application.\n\n![](img/47ad0ac10bf11125744ef22c945d3099_76_0.png)\n\
    \n### CHANGING THE VISIBILITY OF A VIEW\n\nMost of the time, if you want to define\
    \ your UI in XML, you'll need to add views that will be visible only some of the\
    \ time.\n\n> **TIP:** If you find yourself doing this a lot, be sure to check\
    \ out the ViewStub class.\n\nDepending on how dynamic your application is, views\
    \ come and go fairly regularly. Showing and hiding views is as simple as using\
    \ the ever trusty findViewById and then calling setVisibility on the returned\
    \ object:\n\n```java\nButton button = (Button)findViewById(R.id.sample_button);\n\
    //Cycle through the View Visibility settings\nif(button != null){\n    //Gone\
    \ (no impact on layouts)\n    button.setVisibility(View.GONE);\n    //Invisible\
    \ (holds its space in a layout but is not drawn)\n    button.setVisibility(View.INVISIBLE);\n\
    \    //Visible (duh)\n    button.setVisibility(View.VISIBLE);\n}\n```\n\nThis\
    \ code has three visibility settings. GONE and VISIBLE are the most obvious. You'll\
    \ find yourself using INVISIBLE less often, however, it's great for keeping all\
    \ the other views inside your layouts from moving around when you want to hide\
    \ something.\n\n### SETTING AN ONCLICKLISTENER\n\nSetting up a listener to tell\
    \ you that one of your views has been clicked is one of the most common tasks\
    \ you'll do when working on an Android application. A click can mean the user\
    \ moved focus to your view using the navigation pad or trackball and then clicked\
    \ the select key. A click can also mean pressing on the trackball, if there's\
    \ one of those, or on the key in the center of the four- or eight-way directional\
    \ pad.\n\nYour click listener will also be called if, in touch mode, the user\
    \ taps their finger down on your view and then lifts up with their finger still\
    \ within the bounds of the view. This is an important distinction, as your click\
    \ listener will not be invoked when their finger actually clicks down on the view\
    \ but rather when the user lifts their finger up. This gives the user the chance\
    \ to put a finger down in the wrong place and then correct the position before\
    \ lifting it.\n\nYou can track view clicks in several ways. You can declare that\
    \ your activity itself implements the view's OnClickListener interface, add a\
    \ `public void onClick(View v)` method, and pass a pointer to your activity to\
    \ the view you wish to track. Here's what that looks like in code for theoretical\
    \ buttons with IDs button_one and button_two declared in an imaginary main.xml\
    \ layout file:\n\n```java\npublic class UiDemoActivity extends Activity implements\n\
    \        OnClickListener {\n\n    @Override\n    public void onClick(View selectedView)\
    \ {\n        if(selectedView.getId() == R.id.button_one){\n            //Take\
    \ Button One actions\n        }\n\n        if(selectedView.getId() == R.id.button_two){\n\
    \            //Take Button Two actions\n        }\n    }\n\n    @Override\n  \
    \  public void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
    \        setContentView(R.layout.main);\n```\n"
  mdcn: "\n## 特殊尺寸\n\n在视图层级中，你始终需要为每个视图指定高度和宽度。特别是在这些定义中，你可以使用四种不同的值。它们分别是：\n\n- \
    \  `wrap_content` 会让视图大到足以匹配其包含的内容。对不同的视图来说，这可能意味着不同的东西，但概念始终相同。\n-   `fill_parent`\
    \ 和 `match_parent` 值实际上含义完全相同。也就是说，我希望这个视图的尺寸与我父视图的尺寸相匹配。\n-   `dip` 或 `dp` 表示设备无关像素。这个值可以让你获得一致的间距，而不受设备屏幕密度（每英寸像素数）的影响。在\
    \ Nexus 1 或 Nexus S 上，1 dp ~= 1.5 像素。\n-   `px` 表示像素。有时确实需要精确的像素值。我建议不要用它来声明屏幕位置，但它仍是一种可选方案。\n\
    \n让我们看看 Java 代码中发生了什么。我没有对 R.java 文件中的某个 ID 调用 setContentView，而是传入一个由 buildLayouts\
    \ 方法返回的 LinearLayout 对象实例。在 buildLayouts 方法中，我首先创建一个新的 LinearLayout（传入应用程序的上下文）和一个新的\
    \ LayoutParams 对象。为了与 XML 中的内容匹配，新 LayoutParams 初始化时将宽度和高度都设置为 MATCH_PARENT。如果你以前做过\
    \ Android 开发，应该知道 MATCH_PARENT 与之前使用的 FILL_PARENT 完全相同。\n\n一旦为顶层 LinearLayout\
    \ 初始化好布局参数，我就可以通过调用 setLayoutParams 将它们传给该对象。现在 LinearLayout 已经配置好了，接下来该构建 TextView\
    \ 了。\n\n这是一个简单的文本视图，因此它的布局参数与其父布局的布局参数非常相似。唯一明显的区别是，我在创建布局参数时把高度设置为按 TextView\
    \ 的自然尺寸进行缩放。（关于动态高度和宽度，后面还会有更多内容。）\n\n一旦通过布局参数告诉 TextView 它将如何在父布局中定位，我就告诉它我要显示哪个字符串。这个字符串定义在\
    \ /res/values/strings.xml 中。XML 中的 name 属性决定了系统为了定位你的资源，需要在 R.string 后面出现什么。你将在下一节中了解更多关于资源管理的知识。\n\
    \n最后，我需要把新的 TextView 添加到 LinearLayout 中，然后返回 LinearLayout，以便它可以被设置为该 Activity\
    \ 的主内容视图。完成之后，我就得到了一个用 Java 代码在运行时构建的布局，它与系统以 XML 形式提供的布局完全相同。\n\nJava 代码看起来相当直接，但使用\
    \ XML 来处理布局是更好的主意。使用 XML，你可以利用 Android 的资源管理系统，并让非软件工程师也能修改应用程序的 UI。\n\n## 在运行时更改\
    \ UI\n\n使用 XML 或 Java 来定义构成用户界面的那一堆视图是一回事。但特别是在使用 XML 的情况下，你会希望能够用从网络、用户或任何其他信息源获取的数据来检索并修改视图。Android\
    \ 提供了一种简单的方法来访问当前构成屏幕的视图，即调用 findViewById，这是 Activity 类的一个方法。\n\n### 标识你的视图\n\n\
    在运行时找到某个视图之前，你需要先给它一个 ID。一旦对某个 Activity 调用了 setContentView，你就可以调用 findViewById\
    \ 来检索视图，然后修改它们。这个过程应该看起来至少有点熟悉，因为你在上一章已经见过。它在 XML 中看起来如下：\n\n```xml\n<TextView\n\
    \    android:id=\"@+id/text_holder\"\n    android:layout_width=\"fill_parent\"\
    \n    android:layout_height=\"wrap_content\"\n    android:text=\"@string/hello\"\
    \n    />\n```\n\n在这个例子中，我添加了一行 android:id 来命名 TextView。@+ 表示法告诉 Android：你不是在引用一个视图，而是希望为该视图创建一个\
    \ ID。任何 ID 的第一次引用都必须以 @+id 开头。后续对该 ID 的引用则只需以 @id 开头。\n\nAndroid 保留了自己的 ID 命名空间。例如，如果你要创建一个供\
    \ ListActivity（一种专门用于显示信息列表的 Activity）使用的布局，你会希望把屏幕上主 ListView 的 ID 设置为 `android:id=\"\
    @id/android:list\"`。这些众所周知的 ID 允许 Android 的系统代码正确找到并与你指定的列表视图交互。我将在第 5 章中提供更多关于这个主题的内容，该章涵盖列表的创建和管理。\n\
    \n如果你在运行时创建视图，只需调用 setId 并传入一个整数，之后就能检索到它。\n\n### 使用 Android 查找资源\n\n当 Android\
    \ 编译你的项目时，它会为你的新静态数字 ID 分配一个数值。它把这个新 ID 放到项目中的 R.java 文件里。这个文件是你访问 res 文件夹内定义的所有内容的入口。对于每个布局、drawable\
    \ 和已标识的视图——以及大量其他内容——Android 都会在 R 文件中放入一个随后静态定义的 int，以标识这些内容。每当你在布局 XML 中添加一行定义新\
    \ ID（例如 android:id=\"@+id/my_new_id\"），你会发现下次编译项目后，R.id 类中会有一个条目。在前面的示例中，这个条目会是\
    \ R.id.my_new_id。\n\n### 检索视图\n\n获取 Android 视图的现有实例非常简单，只需调用 findViewById 并传入在\
    \ R.java 文件中找到的 ID 值。根据前面的 XML 示例，下面是你如何获取文本视图的实例并修改其内容。\n\n```java\npublic void\
    \ onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
    \    setContentView(R.layout.main);\n    TextView tv = (TextView)findViewById(R.id.text_holder);\n\
    \    if(tv!=null)\n        tv.setText(R.string.hello);\n}\n```\n\n## 处理一些常见任务\n\
    \n有些任务比其他任务更常见。让我们看看如何处理其中一些任务，在你完成第一个应用程序之前，你可能会做上几十次。\n\n![](img/47ad0ac10bf11125744ef22c945d3099_76_0.png)\n\
    \n### 更改视图的可见性\n\n大多数时候，如果你想用 XML 定义 UI，就需要添加一些只会在某些时候可见的视图。\n\n> **提示：** 如果你发现自己经常这样做，一定要看看\
    \ ViewStub 类。\n\n取决于你的应用程序有多动态，视图会相当频繁地出现和消失。显示和隐藏视图非常简单，只需使用始终可靠的 findViewById，然后对返回的对象调用\
    \ setVisibility：\n\n```java\nButton button = (Button)findViewById(R.id.sample_button);\n\
    //Cycle through the View Visibility settings\nif(button != null){\n    //Gone\
    \ (no impact on layouts)\n    button.setVisibility(View.GONE);\n    //Invisible\
    \ (holds its space in a layout but is not drawn)\n    button.setVisibility(View.INVISIBLE);\n\
    \    //Visible (duh)\n    button.setVisibility(View.VISIBLE);\n}\n```\n\n这段代码有三种可见性设置。GONE\
    \ 和 VISIBLE 是最明显的。你会发现 INVISIBLE 用得较少，不过，当你想要隐藏某些内容时，它非常适合让布局中的所有其他视图保持不动。\n\n\
    ### 设置 OnClickListener\n\n设置一个监听器来告诉你某个视图被点击了，是你在开发 Android 应用程序时最常做的任务之一。点击可能意味着用户使用导航板或轨迹球将焦点移动到你的视图上，然后按下了选择键。点击也可能意味着按下轨迹球（如果有的话），或者按下四向或八向方向板中央的按键。\n\
    \n在触摸模式下，如果用户用手指按在你的视图上，然后在手指仍处于视图边界内时抬起，你的点击监听器也会被调用。这是一个重要的区别，因为点击监听器不会在用户手指实际按到视图上时被调用，而是在用户抬起手指时被调用。这给用户一个机会：如果手指按在了错误的位置，可以在抬起之前纠正位置。\n\
    \n你可以通过几种方式跟踪视图点击。你可以声明你的 Activity 自身实现视图的 OnClickListener 接口，添加一个 `public void\
    \ onClick(View v)` 方法，并将指向你的 Activity 的指针传递给你想要跟踪的视图。对于在虚构的 main.xml 布局文件中声明的、ID\
    \ 为 button_one 和 button_two 的假设按钮，代码看起来如下：\n\n```java\npublic class UiDemoActivity\
    \ extends Activity implements\n        OnClickListener {\n\n    @Override\n  \
    \  public void onClick(View selectedView) {\n        if(selectedView.getId() ==\
    \ R.id.button_one){\n            //Take Button One actions\n        }\n\n    \
    \    if(selectedView.getId() == R.id.button_two){\n            //Take Button Two\
    \ actions\n        }\n    }\n\n    @Override\n    public void onCreate(Bundle\
    \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n       \
    \ setContentView(R.layout.main);\n```\n"
