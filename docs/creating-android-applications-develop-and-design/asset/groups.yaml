  - "[PAGE 226]\n\n# FINDING A GOOD SUPPLIER\n\nYour first step in using the location\
    \ service, after you've added the permission of course, is finding a good supplier.\
    \ Each device could have several different location services beyond the time-\
    \ and power-consuming GPS system. Android allows you to specify criteria for the\
    \ eventual provider you'll use. You do this by building a list of features you'd\
    \ like and then asking Android for the one that best suits your needs. Here's\
    \ a rather idealistic example I've put together using the getBestProvider method:\n\
    \n```\nprivate String getBestProvider(LocationManager locationManager){\n    Criteria\
    \ criteria = new Criteria();\n    criteria.setAccuracy(Criteria.ACCURACY_COARSE);\n\
    \    criteria.setPowerRequirement(Criteria.POWER_LOW);\n    criteria.setCostAllowed(false);\n\
    return locationManager.getBestProvider(criteria, true);\n}\n```\n\nBefore calling\
    \ the getBestProvider method, you'll need to obtain a Location Manager object,\
    \ which you can do with the following code:\n\n```\nlocationManager = (LocationManager)getSystemService\n\
    \    (Context.LOCATION_SERVICE);\n```\n\nTypically, I'll stash this pointer away\
    \ somewhere so I never have to find it again.\n\n# GETTING THE GOODS\n\nOnce you've\
    \ received the string ID for your ideal provider, you can register and start receiving\
    \ location updates from the provider. Here's the code to register for updates:\n\
    \n```\nlocationManager.requestLocationUpdates(provider, 60000, 1000, this);\n\
    ```"
