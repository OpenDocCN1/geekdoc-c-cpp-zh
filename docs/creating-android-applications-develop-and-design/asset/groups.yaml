    \ one intent, it’s a good idea to call getIntent inside your onCreate method and\
    \ check why you’re being started so you can take the right action (by calling\
    \ getAction).\n\n## LISTENING FOR INTENTS AT RUNTIME\n\nAnother method for receiving\
    \ events that pertain only to your application or for receiving events broadcast\
    \ by the Android system itself is to listen for the intents at runtime.\n\nLet’s\
    \ say that your activity would like to show a special screen or take a custom\
    \ action when the user enables Airplane mode. To do this, you’ll need to create\
    \ a temporary IntentFilter and an inner BroadcastReceiver object instance.\n\n\
    ## CREATE A RECEIVER\n\nLet’s add the runtime BroadcastReceiver to the MyActivity\
    \ class. A BroadcastReceiver is, as you can probably guess, an object with a single\
    \ onReceive method.\n\nChange the MyActivity class to look like the following:\n\
    \n```java\npublic class MyActivity extends Activity {\n\n    private BroadcastReceiver\
    \ simpleReceiver = new BroadcastReceiver() {\n\n        public void onReceive(Context\
    \ context, Intent intent) {\n\n            if (intent.getAction().equals(\n  \
    \                  Intent.ACTION_AIRPLANE_MODE_CHANGED)) {\n\n               \
    \ Toast.makeText(context,\n                        R.string.airplane_change,\n\
    \                        Toast.LENGTH_LONG).show();\n\n            }\n\n     \
    \   }\n\n    };\n\n    // Rest of the Activity is here.\n\n}\n```\n\nIn this code,\
    \ you are creating a locally accessible receiver for use within the activity.\
    \ When the system calls onReceive, you’ll need to check what the intent’s action\
    \ is. This is a good idea, as BroadcastReceiver could register for any number\
    \ of different intents.\n\nWhen you receive the event that you’re looking for,\
    \ you’ll use Android’s Toast API to print a simple message on the screen (in this\
    \ case, the contents of the string named airplane_change). In practice, this might\
    \ be the time to show a screen indicating that network connectivity is required\
    \ for the application to run correctly.\n\n## TELL ANDROID WHAT YOU WANT TO HEAR\n\
    \nNow that you’ve created a BroadcastReceiver, you can register it with the system.\
    \ I’ll show you the code first and then go over what’s happening:\n\n```java\n\
    public void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
    \    setContentView(R.layout.main);\n    IntentFilter intentFilter = new IntentFilter();\n\
    \    intentFilter.addAction(Intent.ACTION_AIRPLANE_MODE_CHANGED);\n    registerReceiver(simpleReceiver,\
    \ intentFilter);\n}\n```\n\n> **A TOAST?**\n>\n> A toast is a short message shown\
    \ to the user in a small pop-up along the bottom of the screen. This is a reference,\
    \ as far as I can tell, to the short speech given before glasses are raised, tapped\
    \ together, and then partaken of. As always with toasts, the shorter and simpler\
    \ the better.\n\nAdd the following highlighted code to the onKeyDown listener\
    \ that you've dealt with before:\n\n```java\npublic boolean onKeyDown(int keyCode,\
    \ KeyEvent event) {\n    //...previous keycode code skipped...\n    if (keyCode\
    \ == KeyEvent.KEYCODE_DPAD_DOWN) {\n        Intent actionStartIntent = new Intent(\"\
    com.haseman.PURPLE_PONY_POWER\");\n        actionStartIntent.putExtra(\"newBodyText\"\
    ,\n                \"You Pressed the Down Key!\");\n        startActivity(actionStartIntent);\n\
    \    }\n}\n```\n\nYou're adding a string payload to the intent before using it\
    \ to start an activity. Whoever receives the intent will be able to pull this\
    \ string out (assuming they know it's there) and use it as they see fit. Now that\
    \ you know how to attach the data, let's take a look at an example of retrieving\
    \ and using the string in NewActivity's onCreate method:\n\n```java\npublic void\
    \ onCreate(Bundle icicle) {\n    super.onCreate(icicle);\n    setContentView(R.layout.new_activity);\n\
    \    Intent currentIntent = getIntent();\n    if (currentIntent.hasExtra(\"newBodyText\"\
    )) {\n        String newText = currentIntent.getExtras().getString(\"newBodyText\"\
    );\n        TextView bodyView = (TextView) findViewById(\n                R.id.new_activity_text_view);\n\
    \        bodyView.setText(newText);\n    }\n}\n```\n"
  mdcn: "\n让我们回到最初的应用程序，再次查看清单文件中该 activity 的条目：\n\n```xml\n<activity android:name=\"\
