    - **电话来电。** 通过 *TelephonyManager* 或音频焦点工具监控电话的通话状态，你*绝对必须*留意来电。手机铃声响起时必须停止所有音频。没有什么比不处理电话来电更能激怒你的用户（并损害你的评分）了。\n\
    - **SD 卡缺失。** 你需要确保你的应用能够正确处理 SD 卡缺失或移除的情况。用户可以在任意时间通过 USB 线将外部存储卡挂载为可移动驱动器。如果你监听\
