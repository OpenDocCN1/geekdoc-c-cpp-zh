  mdcn: "\n```xml\n<Button\n    android:id=\"@+id/prev\"\n    android:layout_width=\"\
    wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:paddingLeft=\"\
    5dip\"\n    android:paddingRight=\"5dip\"\n    android:text=\"@string/prev_string\"\
    \n    android:lines=\"1\"\n    android:layout_weight=\"1\"\n    />\n<TextView\n\
    \    android:id=\"@+id/url_view\"\n    android:layout_width=\"wrap_content\"\n\
    \    android:layout_height=\"wrap_content\"\n    android:gravity=\"center_horizontal\"\
    \n    android:layout_weight=\"1\"\n    android:text=\"The Golden Gate Bridge\"\
    \n    />\n<Button\n    android:id=\"@+id/next\"\n    android:layout_width=\"wrap_content\"\
    \n    android:layout_height=\"wrap_content\"\n    android:paddingLeft=\"5dip\"\
    \n    android:paddingRight=\"5dip\"\n    android:text=\"@string/next_string\"\n\
    \    android:lines=\"1\"\n    android:layout_weight=\"1\"/>\n</LinearLayout>\n\
    <ImageView\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
    wrap_content\"\n    android:gravity=\"center_horizontal\"\n    android:id=\"@+id/main_image\"\
    \n    android:src=\"@drawable/bridge\"\n    />\n</LinearLayout>\n```\n\n注意，本示例中有两个\
    \ LinearLayout 在发挥作用。顶层布局包含第二个 LinearLayout 对象和要显示的图像。第二个 LinearLayout 包含两个按钮和标题文本。在这种情况下需要两个布局，因为任何一个\
    \ LinearLayout 只能有一个方向。\n\n## 不要嵌套得太深\n\n> 线性布局只能以两种方向之一来排列其子视图：水平或垂直。如果不小心，这可能会导致屏幕中出现大量嵌套的布局对象。嵌套布局太深，屏幕渲染速度就会像一群乌龟一样慢。Android\
    \ 工程师建议将布局深度保持在十层以内。也就是说，不要创建包含超过十个任意类型嵌套布局的视图层级。在实践中，应尽一切可能少用布局，因为当布局深度超过七层或八层时，在较旧、较慢的手机上就会开始看到性能下降。如果你发现自己被一堆\
    \ LinearLayout 搞得晕头转向，可以考虑改用单个 RelativeLayout 进行重构。\n\n![](img/47ad0ac10bf11125744ef22c945d3099_100_0.png)\n\
    \n![](img/47ad0ac10bf11125744ef22c945d3099_100_1.png)\n\n**图 3.4** 基于 LinearLayout\
    \ 的屏幕（左）。\n\n**图 3.5** 相同布局，但为横向模式（右）。\n\n图 3.4 展示了此示例 XML 在纵向模式下生成的效果。这正是 Android\
    \ 动态布局真正开始大放异彩的地方；看看当用户切换到横向模式时，完全相同的布局代码会是什么样子（图 3.5）。\n\n不算完美，但相比 AbsoluteLayout\
    \ 版本的横向屏幕已是巨大改进。\n\n## 使用 LinearLayout\n\n使用 LinearLayout 时，定义视图的顺序就是它们在屏幕上放置的顺序。首先，看看第二个\
    \ LinearLayout：\n\n```xml\n<LinearLayout\n    android:layout_width=\"match_parent\"\
    \n    android:layout_height=\"wrap_content\"\n    android:orientation=\"horizontal\"\
    \n    android:background=\"#333333\"\n    android:id=\"@+id/button_bar\"\n>\n\
    ```\n\n## 必须有一个视图负责尺寸\n\n必须有一个视图或布局来定义高度和宽度值。你不能同时告诉 Android 希望某个布局包裹其内容，又告诉某个视图应匹配其父级。这会导致编译错误，因为\
    \ Android 不知道应把父视图或子布局设为多大。必须有某个东西定义实际高度，哪怕它是一张图像或一行文本。\n\n通过将方向设置为 horizontal，Android\
    \ 知道要按从左到右的顺序将子视图放置在屏幕顶部。外层布局是垂直布局，因此可以将按钮栏放在图像上方。\n\n通过将宽度设置为 match_parent，我确保布局本身一直延伸到父布局的整个宽度（在本例中为整个屏幕）。高度设置为\
    \ wrap_content，因此它将恰好与其子视图最终测量出的高度一样高。\n\nLinearLayout 按定义顺序分配其子视图。然后它会测量所有子视图，以了解它们希望占用多少空间。接着，它会按子视图理想大小的比例分配可用空间。如果空间太少，无法容纳所有子视图，它会按各子视图测量大小的比例，给每个子视图分配其所需空间的一部分。如果空间足够容纳所有子视图还有剩余，它会根据子视图在\
    \ onMeasure 调用中告诉布局自己想要多大，来分配额外空间。你可以通过每个子视图中的 layout_weight 属性来修改这种按比例分配的方式。\n\
    \n布局实际上更多地发生在子视图的定义中，而不是布局本身的声明中。因此，为了提供一些背景，让我们看看按钮栏布局的各个成员。\n\n下面是 Prev 按钮定义中的第一个子视图：\n\
    \n```xml\n<Button\n    android:id=\"@+id/prev\"\n    android:layout_width=\"wrap_content\"\
    \n    android:layout_height=\"wrap_content\"\n    android:paddingLeft=\"5dip\"\
    \n    android:paddingRight=\"5dip\"\n    android:text=\"@string/prev_string\"\n\
    \    android:lines=\"1\"\n    android:layout_weight=\"1\"\n/>\n```\n\nlayout_weight\
    \ 值可以是 0 到 1 之间的任意小数，它告诉系统：当布局空间过多或过少时，应给该子视图分配多少空间。再看看按钮栏的横向版本（图 3.6）。\n\n**图\
    \ 3.6** 由于 LinearLayout 而变得过大的按钮。\n\n## 线性布局不适合像素完美主义者\n\n我已经说过一次，现在再说第二次：LinearLayout\
    \ 并不适合用来布局像素级完美的屏幕。随着视图按比例变大或变小，很难让它们恰好停留在你希望的位置。当你有一组已知数量的对象必须显示在屏幕上，并且对它们最终的确切位置不太挑剔时，可以使用\
    \ LinearLayout。在空间受限的小场景中，例如小型按钮栏或单个列表菜单项，AbsoluteLayout 可能会更容易用来获得你想要的精确屏幕布局。这可能是我能想到的唯一一种\
    \ AbsoluteLayout 也许有意义的场景。\n\n**图 3.7** 哎呀，太小了！\n\n![](img/47ad0ac10bf11125744ef22c945d3099_103_0.png)\n\
    \n这可能与纵向模式下的屏幕外观非常接近，但还不够接近。随着顶部栏增大，LinearLayout 会按子视图测量大小的比例分配额外像素空间。在本例中，由于所有三个元素（两个按钮和文本标题）的权重相同（均为\
    \ 1），布局会将额外空间平均分配给它们。你可以重新设置按钮的权重，使它们与文本标题按不同比例增长。由于你希望按钮的增长速度慢于文本，可以尝试将其权重设置为\
    \ 0。新的值如下所示（省略其他所有内容）：\n\n```xml\n<LinearLayout\n>\n    <Button\n        android:layout_weight=\"\
    0\"\n        />\n    <TextView\n        android:layout_weight=\"1\"\n        />\n\
    \    <Button\n        android:layout_weight=\"0\"\n        />\n</LinearLayout>\n\
    ```\n\n图 3.7 展示了此更改对按钮栏的影响。嗯，从技术上讲这是正确的，但看起来糟透了。你有两个选择。你可以通过 android:padding 声明精确指定希望两个按钮各有多少额外空间，或者给它们稍微大一点的权重。你可以自己尝试第一个选项，但让我们一起看看权重选项。\n\
    \n![](img/47ad0ac10bf11125744ef22c945d3099_104_0.png)\n\n**图 3.8** 好多了！\n\n![](img/47ad0ac10bf11125744ef22c945d3099_104_1.png)\n\
    \n**图 3.9** 再看看纵向模式\n\n虽然你不希望按钮变得太大，但仍需要给它们比刚好包裹文本稍多一点的空间。让我们试试将权重设为 .25。为简洁起见，我已删去所有非\
    \ layout_weight 的行：\n\n```xml\n<LinearLayout>\n    <Button\n        android:layout_weight=\"\
    .25\"\n        />\n    <TextView\n        android:layout_weight=\"1\"\n      \
    \  />\n    <Button\n        android:layout_weight=\".25\"\n        />\n</LinearLayout>\n\
    ```\n\n图 3.8 展示了它在横向模式下的效果。\n\n结果合理多了。但为了确认，再看看按钮栏在纵向模式下的样子。图 3.9 展示了结果。\n\n也许\
    \ Next 和 Prev 按钮在纵向模式下可以再大一点，但这一结果已经非常可接受了。它们并不巨大，看起来也不拥挤，而且应该大到即使手指较粗也能点中。\n\n\
    最后，在轻松处理不同的动态屏幕尺寸方面，没有什么比 LinearLayout 更胜一筹。你可以随心所欲地把大量内容放进一个 LinearLayout 中，它会尽量容纳所有内容。不过，有两个主要问题需要注意。第一，由于它们只能朝一个方向排列，处理复杂布局时可能最终需要很多个\
    \ LinearLayout，这会显著拖慢绘制性能。第二，要让复杂屏幕完全按照设计师想要的方式渲染，可能是一个费力的过程。对于更复杂或元素更多的屏幕和对象，使用\
    \ RelativeLayout 会好得多。\n\n"
