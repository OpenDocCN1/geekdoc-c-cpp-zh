    # 11


    PUBLISHING YOUR APPLICATION'
  - '[PAGE 254]


    ![](img/47ad0ac10bf11125744ef22c945d3099_254_0.png)


    For the most part, the Android Market is one of the easiest-to-use application
    stores I''ve ever encountered. But although you can update an application almost
    instantly without any of the hassles of other app stores, there are still a few
    things you should be aware of before you publish. We''ll cover packaging, versioning,
    and creating a release build.'
  - "[PAGE 255]\n\nThere are a few key points in your manifest that you need to pay\
    \ attention to before you consider producing a release build to go to market.\
    \ You'll need to make sure your application isn't debuggable (not so much an issue\
    \ with newer versions of the Android client). You'll also want to make sure your\
    \ package name is unique and consistent in each subsequent version. Last, there\
    \ are two fields to pay attention to when upgrading an existing application. Let's\
    \ take a closer look at all three.\n\n# ## PREVENTING DEBUGGING\n\nShipping your\
    \ application out the door with debugging enabled will allow anyone with a micro\
    \ USB cable to step through lines of code in your app, look at the contents of\
    \ variables, and do other things that no security-aware engineer would like to\
    \ have happen. The debugging flag is turned off by default, but if you've turned\
    \ it on, it will appear in the application portion of the manifest:\n\n```\n```xml\n\
    <application\n    android:icon=\"@drawable/ic_launcher\"\n    android:label=\"\
    @string/app_name\"\n    android:debuggable=\"true\">\n```\n```\n\nWhen the application\
    \ ships, make sure that you either remove the line entirely or set the following:\n\
    \n```\n```xml\nandroid:debuggable=\"false\"\n```\n```\n\n# ## NAMING THE PACKAGE\n\
    \nThe package you declare in your manifest can, for the most part, contain almost\
    \ any string you fancy. I've highlighted one from a previous example here:\n\n\
    ```\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
    http://schemas.android.com/apk/res/android\"\n    package=\"com.haseman.layouts\"\
    \n    android:versionCode=\"1\"\n    android:versionName=\"1.0\">\n```\n```"
  - '[PAGE 256]


    Although I named this package to correspond to my layouts example, you could just
    as easily declare a package like


    ```

    package="com.sparkle.pants.fairy.dust.unicorn"

    ```


    I wouldn''t recommend using the unicorn example (it''s somewhat outrageous), but
    the fact remains that you can. However, the package name you choose must be different
    from all other existing packages in the entire Android Market. Be sure it''s unique
    and that it''s something you can live with for as long as you upgrade the application.
    When you upgrade your app, it absolutely must have the same pack-age name as the
    build that came before it. Typically, the naming convention goes something like
    com.company_name.product_name. But again, the package name for your application
    is entirely up to you.


    # # VERSIONING


    There are two values to pay attention to when updating an existing application.
    First, you should (but are not required to) increase the value inside the versionName
    field of the manifest declaration. Standard rules for the version number apply:
    Major releases get a new primary number (1.0 to 2.0), while small patches should
    get a secondary bump (1.0 to 1.1). The version name is what shows to the user
    in the Android Market and in your application''s details screen. The version name
    is "1.0" in the previous example''s manifest file.


    The field you *must* pay careful attention to is versionCode. This is the value
    that must change every time you do an update for the Android Market. Sending an
    update to the Android Market will be rejected unless you change the versionCode.
    Typically, Android developers will make the version code by taking the periods
    out of the version name and padding each portion of the name to create a two-digit
    number for each section. The number must be unique, but it does not necessarily
    have to be sequential. So version 1.0.1 would become 010001, and 2.3.12 would
    become 020312. This is a pretty basic way to make sure your version names stay
    tied to the version code without much complexity. It''s a good idea to make this
    number constantly grow even though, according to the documentation, it isn''t
    technically required to. However, adopting a convention of incrementing the num-bers
    ensures it will be unique.'
  - "[PAGE 257]\n\n# SETTING A MINIMUM SDK VALUE\n\nThe Android Market requires that\
    \ you specify a minimum SDK value for your application. You can do this in the\
    \ manifest by including the uses-sdk field, like so:\n\n```\n<?xml version=\"\
    1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
    \n    package=\"com.haseman.location\"\n    android:versionCode=\"1\"\n    android:versionName=\"\
    1.0\">\n    <uses-sdk android:minSdkVersion=\"7\"/>\n    <!-- The rest of your\
    \ application goes here-->\n</manifest>\n```\n\nThe number in minSdkVersion corresponds\
    \ to the integer value for the SDK. In this case, by declaring version 7, I'm\
    \ not allowing phones earlier than the Android 2.1 update 1 (which is SDK version\
    \ 7) to install my application. Be sure to test your application on the versions\
    \ you support, even if you just test it briefly with an emulator."
