    \ the right-hand side and as actionable items in the bar itself.\n+   - Tabs.\
    \ Buttons along the top, built to manipulate fragments on the screen.\n+   - Action\
    \ views. Search boxes and drop-down lists (for things like sort orders, account\
    \ selection, or death-ray intensities).\n\nFurther, Android will always make your\
    \ application icon (farthest to the left) clickable. It is expected that tapping\
    \ this icon will, by default, return the user to your application’s home screen\
    \ (whatever this means to your application’s behavior). You can also visually\
    \ indicate that the home icon will go one level back in the activity stack by\
    \ calling setDisplayHomeAsUpEnabled(true).\n\nThe way you make changes to what’s\
    \ in the action bar is very similar to how you used to interact with the options\
    \ menu. This is not by accident. Because the action bar is supposed to replace\
    \ the options menu, you call methods and configure files similarly to how you\
    \ used to deal with the menu. This also makes it easy to gracefully degrade service\
    \ to phones on older versions of the Android SDK.\n\n# ### ADDING AN ICON\n\n\
    Icons are most easily placed in the action bar by extending onCreateOptionsMenu\
