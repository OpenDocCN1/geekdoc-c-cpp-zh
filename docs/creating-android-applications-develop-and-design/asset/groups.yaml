    \n## 7 多种**设备**，一个**应用**\n\n![](img/47ad0ac10bf11125744ef22c945d3099_184_0.png)\n\
    \nAndroid 设备有数百种不同的硬件配置，从高级电视到非常基础的手机。编写一个能在整个范围内完美运行的应用程序，似乎是一项艰巨的任务。幸运的是，Android\
    \ 提供了许多工具来处理它所运行的生态系统。在本章中，我将向你展示如何利用 Android 的布局文件夹层级系统、配置你的清单文件以确保你的应用程序仅对能够正确运行它的手机可用，以及处理旧版本的\
    \ Android SDK。Android 的多样性可能是一个挑战，但我会向你展示如何使用现有工具，使它变得可控。本章涵盖 `res/` 文件夹的秘密；通过清单文件剔除设备；以及通过反射兼容旧手机。\n\
    \n### 揭开 RES/ 文件夹的秘密\n\n前面，我给出了 `res/` 文件夹中什么内容放在哪里的基本对应关系。在本节中，我将向你展示它更高级的功能。和往常一样，你可以自己编写代码，也可以参考发布在\
    \ Peachpit.com/androiddevelopanddesign 上的示例代码。\n\n#### 布局文件夹\n\n布局文件夹是你可使用的第一个工具的来源，而且它是最好的工具之一。如果配置正确，Android\
    \ 会从与当前运行硬件配置最接近的文件夹中选择布局文件。使用这个工具，你可以为任意数量的不同硬件配置定义多种屏幕布局。让我们从简单的内容开始：横屏模式。\n\
    \n假设你有一个带有两个按钮的简单屏幕。让我们看看生成这两个按钮的布局 XML。\n\n```xml\n<RelativeLayout>\n<!--Text\
    \ view for question and relative layout params omitted-->\n<Button\n    android:padding=\"\
    15dp\"\n    android:gravity=\"center\"\n    android:id=\"@+id/yes_button\"\n \
    \   android:layout_marginLeft=\"30dp\"\n    android:layout_marginRight=\"30dp\"\
    \n    android:layout_width=\"fill_parent\"\n    android:layout_height=\"wrap_content\"\
    \n    android:layout_above=\"@+id/no_button\"\n    android:text=\"@string/yes_button_text\"\
    \n    />\n<Button\n    android:padding=\"15dp\"\n    android:gravity=\"center\"\
    \n    android:id=\"@+id/no_button\"\n    android:layout_marginLeft=\"30dp\"\n\
    \    android:layout_marginRight=\"30dp\"\n    android:layout_marginBottom=\"60dp\"\
    \n    android:layout_width=\"fill_parent\"\n    android:layout_height=\"wrap_content\"\
    \n    android:text=\"@string/no_button_text\"\n    android:layout_alignParentBottom=\"\
    true\"\n    />\n```\n\n![](img/47ad0ac10bf11125744ef22c945d3099_186_0.png)\n\n\
    ![](img/47ad0ac10bf11125744ef22c945d3099_186_1.png)\n\n**图 7.1** 一个带有两个按钮的简单屏幕。\n\
    \n**图 7.2** 在横屏模式下，按钮太大了。\n\n鉴于你在前面章节中已经接触过 `RelativeLayout`，这段代码清单中的内容应该不会让你感到陌生。我声明了两个按钮，将“否”按钮固定在底部，并将“是”按钮对齐到它上方。在竖屏模式下显示时，这些按钮看起来简单，但效果相当不错（图\
    \ 7.1）。\n\n虽然只有在评委部分失明的情况下，这个设计才能让我赢得设计奖，但它仍然是一个相当美观、简单且实用的屏幕。不过，看看当我把它切换到横屏模式时会发生什么（图\
    \ 7.2）。\n\n找不到更好的词来形容，这就是一场灾难。按钮相对于其文字以及上方“你喜欢巧克力吗？”这个问题来说太宽了。这正是 Android 的布局文件夹可以轻松解决的那类问题。\n\
    \n为了修复这个图形上的混乱，我需要让按钮在横屏模式下并排显示，同时在竖屏模式下仍然堆叠显示。解决这个问题有两种方法：一种稍微笨重的方法是为横屏设置第二个屏幕布局；另一种是用手术刀式的方法，只切除并修复出问题的部分。两种解决方案各有其适用场景。\n\
    \n##### 使用不同的文件夹\n\nAndroid 允许你为各种硬件屏幕配置指定不同的布局文件夹。这个示例通过向你的项目添加一个 `layout-land`\
    \ 文件夹来解决问题。\n\n现在到了神奇的部分。\n\n- 1. 为横屏配置创建一个名为 `layout-land` 的新文件夹，并将其放在 `project/res/`\
    \ 中。\n- 2. 将横屏专用的布局文件放入这个文件夹，当设备处于横屏模式时，Android 会*自动*使用它们。\n\n##### 使用 `<INCLUDE>`\
    \ 进行小改动\n\n`<include>` 标签是一种极好的方式，可以抽出你希望单独调整和布局的屏幕小部分。这就是手术刀式方法。你只切出希望以不同方式渲染的部分，将它们拆分到按文件夹分隔的布局中，然后就完成了。在这个例子中，这正是一种完美的方式，可以切除按钮部分，并让它们根据屏幕方向以不同方式渲染。下面就是具体做法。\n\
    \n- 1. 在 `res/layout-land/` 中创建一个新的 `button_layout.xml` 文件。我们将把横屏专用的布局放入这个文件。\n\
    - 2. 在新的 `button_layout.xml` 文件中添加一个 `LinearLayout` 和两个 `Buttons`，并将它们并排放置在新的水平\
    \ `LinearLayout` 中。下面是我的 `/layout-land/button_layout.xml` 的最终内容。\n"
