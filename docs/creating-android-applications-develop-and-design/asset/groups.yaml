  - "[PAGE 115]\n\n# THE **MAIN THREAD**\n\nThe Android operation system has exactly\
    \ one blessed thread authorized to change anything that will be seen by the user.\
    \ This alleviates what could be a concurrency nightmare, such as view locations\
    \ and data changing in one thread while a different one is trying to lay them\
    \ onscreen. If only one thread is allowed to touch the user interface, Android\
    \ can guarantee that nothing vital is changed while it's measuring views and rendering\
