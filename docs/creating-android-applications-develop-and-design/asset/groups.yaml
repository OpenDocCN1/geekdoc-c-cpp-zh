  - '[PAGE 86]


    Android has many tools to help you manage string literals, images, layouts, and
    more. Moving all this constant data into external files makes life as a programmer
    easier in a multitude of ways. In previous code examples, I’ve referenced the
    `R.java` file when specifying strings, drawable images, and layouts and mentioned
    that an explanation would be forthcoming. Now is the time to explain Android resource
    management in detail.


    # RESOURCE FOLDER OVERVIEW


    Every Android project, by default, contains a `res` folder with several subfolders
    inside it. Each subfolder is responsible for a different aspect of your application’s
    data.


    The drawable folders (`drawable-hdpi`, `drawable-mdpi`, and `drawable-ldpi`) hold
    images and XML files describing drawable objects. You’ll learn much more about
    what you can do with drawable objects in later chapters.


    The values folder holds all your textual content, from string literals to menu
    list value arrays to color constants.


    Lastly, the layout folders contain XML files to describe how you want your screens
    to look.


    At compile time, the Android tools take all the folders in your `res` directory
    and place a corresponding ID into an `R.java` file. This file is automatically
    re-created and placed in the project’s `gen` folder. Consequently, you should
    never directly change this `R.java` file, because any changes are removed the
    next time you compile. The IDs in `R.java` can be passed to everything from XML
    parsers to text and image views. When you call `setText` on a `TextView` and pass
    in `R.string.hello`, the view then knows to look for that ID in the string file
    and display what it finds there. When you set the main view of an activity by
    calling `setContentView` and passing in `R.layout.main`, the system knows it needs
    to inflate and create the views found in `res/layout/main.xml` and add them to
    the active views on the screen for the current activity.'
