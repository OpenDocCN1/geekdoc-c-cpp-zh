    com.haseman.peachPit.OhOhPickMe\"));\n```\n\n## THE LIFE AND TIMES OF AN ACTIVITY\n\
    \nIt's good to know early on that each activity lives a very short but exciting\
    \ life. It begins when an intent that your activity is registered to receive is\
    \ broadcast to the system. The system calls your activity's constructor (while\
    \ also starting your application as necessary) before invoking the following methods\
    \ on the activity, in this order:\n\n- 1. onCreate\n- 2. onStart\n- 3. onResume\n\
    \nWhen you implement an activity, it's your job to extend the methods that make\
    \ up this lifecycle. The only one you are required to extend is onCreate. The\
    \ others, if you declare them, will be called in the lifecycle order.\n\nYour\
    \ activity is the top visible application, can draw to the screen, will receive\
    \ key events, and is generally the life of the party. When the user presses the\
    \ Back key from the activity, these corresponding methods are called in the following\
    \ order:\n\n- 1. onPause\n- 2. onStop\n- 3. onDestroy\n\n## THE SHORT, BRUTAL\
    \ LIFE OF THE ACTIVITY\n\nAn activity's life is an incredibly short one. They\
    \ are constantly created and destroyed, so it's very important that you save no\
    \ data in them that has any relevance outside the screen your activity will control.\n\
    \nThe following are all valid actions that will result in the destruction of any\
    \ activity:\n\n- 1. The user rotated the device from portrait to landscape or\
    \ vice versa.\n- 2. The activity is no longer visible onscreen or the system is\
    \ low on resources.\n- 3. It’s Tuesday.\n- 4. The user has pressed the Back or\
    \ Home buttons and left your application.\n\nAgain, make sure the data members\
    \ of your activity pertain only to the elements on the screen. Further, don’t\
    \ expect the activity to save any data for you. You’ll learn strategies to handle\
    \ this in later chapters.\n\nAfter these methods have executed, your activity\
    \ is closed down and should be ready for garbage collection.\n\nIn order to make\
    \ sense of the activity’s flow, let’s quickly look over each lifecycle method\
    \ in detail. Remember that you must invoke the superclass call in each of these\
    \ methods (often before you do anything else) or Android will throw exceptions\
    \ at you.\n\n> **NOTE:** `onCreate` is the only one of the application lifecycle\
    \ methods that you must implement. I’ve found, in most of my work with Android,\
    \ that I only end up implementing one or two of these methods depending on what\
    \ each activity is responsible for.\n\n![](img/47ad0ac10bf11125744ef22c945d3099_47_0.png)\n\
    \n### PUBLIC VOID ONCREATE(BUNDLE ICICLE)\n\nAndroid will call your declaration\
    \ of this method as your activity is starting. Remember, however, that during\
    \ the run of your application you may go through several instances of each activity.\
    \ If, for example, the user changes the screen orientation from landscape to portrait,\
    \ your activity will be destroyed and a new instance of the same activity will\
    \ be created and initialized.\n"
