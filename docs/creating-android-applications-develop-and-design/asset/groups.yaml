  - "[PAGE 63]\n\nTypically, an Android application is a collection of activities,\
    \ broadcast receivers, services, and content providers. The Application class\
    \ is the glue that binds all these disparate pieces into a singular, unified entity.\
    \ Every time a content provider, activity, service, or intent receiver in your\
    \ manifest is initialized, an Application class is also spun up and available\
    \ to it.\n\n# THE DEFAULT APPLICATION DECLARATION\n\nLooking in the AndroidManifest.xml\
    \ file, you'll see a typical Application declaration that looks like the following:\n\
    \n```\n```xml\n<application android:icon=\"@drawable/icon\"\n    android:label=\"\
    @string/app_name\">\n<!--Activities, Services, Broadcast Receivers, and Content\
    \ Providers -->\n</application>\n```\n```\n\nHere you can see the `<application>`\
    \ tag. This part of the manifest typically contains information relevant to your\
    \ application at large. `android:icon` tells the system what icon to display in\
    \ the main application list. `android:label` in this case refers to another entry\
    \ in the `strings.xml` file you were editing earlier.\n\n# CUSTOMIZING YOUR OWN\
    \ APPLICATION\n\nAdding your own application is very similar to the steps you've\
    \ already gone through to add a new activity.\n\n+   1. Add a name field to the\
    \ existing `AndroidManifest.xml` declaration.\n+   2. Create a new class in your\
    \ package that extends the `Application` class.\n+   3. Profit!\n\nLet's go over\
    \ steps 1 and 2 in depth. You're on your own for step 3.\n\n# THE NAME\n\nWhen\
    \ it comes to the manifest, `android:name` refers not to the name of the object\
    \ being described, but to the location of the class in your Java package. The\
    \ `Application` declaration is no exception. Here's what the opening tag of the\
    \ application should look like with the new declaration:"
