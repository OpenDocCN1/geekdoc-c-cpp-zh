  - "[PAGE 42]\n\n# CREATING A NEW SCREEN LAYOUT\n\nHere’s how you create a new layout.\n\
    \n+   1. Create a new file named **new_activity.xml** inside the **res/layout/**\
    \ folder. It should sit next to the existing **main.xml** file (which is used\
    \ by your existing activity). This **new_activity.xml** file should look almost\
    \ exactly like **main.xml**, except you’ll need to add a reference to the string\
    \ you just created.\n\n+   2. Insert the highlighted line to create a reference\
    \ to the string you just created.\n\n+   3. Give this modified TextView an ID\
    \ so your Java code can reference it (you’ll learn more about TextViews later;\
    \ for now you should know that they’re Android views that show text on the screen):\n\
    \n```\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<LinearLayout xmlns:android=\"\
    http://schemas.android.com/apk/\n    res/android\"\n    android:orientation=\"\
    vertical\"\n    android:layout_width=\"fill_parent\"\n    android:layout_height=\"\
    fill_parent\"\n>\n<TextView\n    android:id=\"@+id/new_activity_text_view\"\n\
    \    android:layout_width=\"fill_parent\"\n    android:layout_height=\"wrap_content\"\
    \n    android:text=\"@string/new_activity_text\"\n/>\n</LinearLayout>\n```\n```\n\
    \nI will devote Chapter 3 to resource management and user interface design, but\
    \ for now just keep in mind that the @ prefix is how you tell Android you want\
    \ to reference an ID, string, or drawable that is defined elsewhere as a resource.\n\
    \nNow that you have a new layout with its shiny new string, you’ll need to tell\
    \ the NewActivity class that you want it to use this particular layout file."
