    \            LayoutParams.WRAP_CONTENT,\n            LayoutParams.MATCH_PARENT);\n\
    \        textView.setLayoutParams(textLayoutParams);\n        textView.setText(R.string.hello);\n\
    \        topView.addView(textView);\n        return topView;\n}\n```\n"
  mdcn: "\n通常，一个 Android 应用程序是 Activity、广播接收器、服务和内容提供器的集合。Application 类是将这些彼此分散的部分粘合为一个单一、统一实体的黏合剂。每当你的清单中的内容提供器、Activity、服务或\
    \ Intent 接收器被初始化时，也会创建 Application 类，并可供其使用。\n\n## 默认应用程序声明\n\n查看 AndroidManifest.xml\
    \ 文件，你会看到一个典型的 Application 声明，如下所示：\n\n```xml\n<application android:icon=\"@drawable/icon\"\
    \n    android:label=\"@string/app_name\">\n<!--Activities, Services, Broadcast\
    \ Receivers, and Content Providers -->\n</application>\n```\n\n在这里你可以看到 `<application>`\
    \ 标签。清单的这一部分通常包含与整个应用程序相关的信息。`android:icon` 告诉系统在主应用程序列表中显示哪个图标。这里的 `android:label`\
    \ 指向你之前编辑过的 `strings.xml` 文件中的另一项条目。\n\n## 自定义你自己的应用程序\n\n添加你自己的应用程序，与你已经执行过的添加新\
    \ Activity 的步骤非常相似。\n\n- 1. 在现有的 `AndroidManifest.xml` 声明中添加一个名称字段。\n- 2. 在你的包中创建一个继承\
    \ `Application` 类的新类。\n- 3. 赚钱！\n\n我们来深入讲解第 1 步和第 2 步。第 3 步就靠你自己了。\n\n## 名称\n\n\
    就清单而言，`android:name` 指的不是所描述对象的名称，而是该类在你的 Java 包中的位置。`Application` 声明也不例外。加入新声明后，应用程序的开始标签应如下所示：\n\
    \n如果你需要一个临时存放可能跨越多个 Activity 的数据的地方，那么作为 Application 一部分的数据成员可以成为方便的存储位置。你必须非常小心地向\
    \ Application 添加数据。清单中声明的任何单个组件，从最简单的 BroadcastReceiver 到最复杂的 Activity，在被系统创建之前，都会先创建你的\
    \ Application 对象。这意味着你必须让 Application 的 onCreate 方法尽可能快地运行。\n\n## 访问应用程序\n\n你的所有广播接收器、服务、Activity\
    \ 和内容提供器都有一个由相应超类提供给它们的、名为 getApplication 的方法。调用时，如果你在清单中指定了 Application 对象，getApplication\
    \ 将返回指向该对象的指针。既然你已经声明并创建了该类，那么访问它就很简单：调用 getApplication，并将返回的对象强制转换为你的指针类型的实例。如下所示：\n\
    \n```\nSampleApplication myApplication = (SampleApplication)\ngetApplication();\n\
    ```\n\n就是这么简单。你可以向自己的 Application 版本添加公共数据成员或上下文相关方法，而只需一次调用，所有组件都将访问同一个对象，如下所示：\n\
    \n```\npublic class SampleApplication extends Application{\n    public String\
    \ username;\n    public void onCreate(){\n        super.onCreate();\n    }\n}\n\
    ```\n\n## View 类\n\n不，这不是一档几个女人争论大众文化价值的电视节目。View 类是 Android 所有显示对象的超类。从简单的 ImageView\
    \ 到强大的 RelativeLayout，每一个用户界面（UI）类都继承自这同一个对象。在本节中，你将学习使用 Java 代码和 XML 创建、添加和修改现有布局的基础知识。你还将学习创建自己的自定义视图。从本质上讲，视图只是一个矩形区域，你可以在其中显示内容。子类有许许多多不同的形式，但它们都只需要一个向用户展示内容的空间。\n\
    \n### 创建视图\n\n创建新视图这件事你已经做过了。在第 1 章中，作为探索如何启动新 Activity 的一部分，你曾向 XML 布局文件中添加过一个视图。当时我说过，我们会深入探讨这些视图是如何创建和修改的具体细节，嗯，现在就是时候了！我们来看看创建新\
    \ Android 项目时自动为你生成的默认视图。\n\n#### XML 中的视图\n\n新项目中的默认 XML 布局如下所示：\n\n```xml\n\
