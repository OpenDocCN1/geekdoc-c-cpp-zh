  - "[PAGE 149]\n\nWhile building a main menu is great and all, there are much more\
    \ complicated uses to which you can put the Adapter and ListView combination.\
    \ In fact, I'm going to show you an example that gets complicated in two ways.\
    \ First, the data source is going to be from a remote URL (a Twitter feed). Second,\
    \ I'm going to add a second text view to the list (you could, if you want to,\
    \ add any number of items to it).\n\n# ### THE 1000-FOOT VIEW\n\nAll right, here's\
    \ the game plan. First, you'll need an AsyncTask to retrieve the feed from Twitter's\
    \ API. Once you have the data, you'll need to parse it into JSON (JavaScript Object\
    \ Notation) objects and feed that data into a custom adapter. Last, you'll need\
    \ to create that custom adapter and the specific ListView layout to hold the two\
    \ pieces of text info. With those things in hand, you can create the custom layout\
    \ object.\n\nIn the end, you'll have a list of Peachpit's 20 most recent Twitter\
    \ messages, along with when they were written. If a message was retweeted, the\
    \ text will display in red. This is by no means the most complex list you could\
    \ build using these tools, but it is a great way to show you how to make your\
    \ own complex custom list views.\n\n# ### CREATING THE MAIN LAYOUT VIEW\n\nThis\
    \ step is very similar to the \"Defining a Layout for Your ListActivity\" section.\
    \ You'll need an XML layout containing a ListView with the android:id/list ID.\
    \ In this case, however, because the data isn't available when the activity launches,\
    \ you'll need the ListView to start out hidden. Here's what my project's XML layout\
    \ looks like:\n\n```\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<LinearLayout\
    \ xmlns:android=\"http://schemas.android.com/apk/\n    res/android\"\n    android:orientation=\"\
    vertical\"\n    android:layout_width=\"match_parent\"\n    android:layout_height=\"\
    match_parent\">\n    <TextView\n    android:id=\"@+id/loading_text\"\n    android:layout_width=\"\
    match_parent\"\n    android:layout_height=\"wrap_content\"\n```\n```"
  - "[PAGE 150]\n\n```\n```xml\nandroid:text=\"@string/loading\"\nandroid:gravity=\"\
    center\"/>\n<ListView\n    android:id=\"@android:id/list\"\n    android:layout_width=\"\
    match_parent\"\n    android:layout_height=\"match_parent\"\n    android:visibility=\"\
    gone\"/>\n</LinearLayout>\n```\n```\n\n# ## CREATING THE LISTACTIVITY\n\nAgain,\
    \ you're going to need a new ListActivity. Since you're already good at getting\
    \ them started, I'll just skip to showing you what my onCreate method looks like:\n\
    \n```\n```java\nprivate TwitterAsyncTask twitterFetcher;\n@Override\npublic void\
    \ onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
    \    setContentView(R.layout.main);\n    Adapter adapter = new TwitterJSONAdapter();\n\
    \    setListAdapter(adapter);\n    twitterFetcher = new TwitterAsyncTask();\n\
    \    twitterFetcher.execute(\"https://api.twitter.com/1/statuses/user_timeline.json?include_entities=false&include_rts=false&screen_name=peachpit&count=20\"\
    );\n}\n```\n```\n\n> > **NOTE:** If the Twitter URL in the earlier code listing\
    \ isn't working, I've stashed a backup copy of the data at http://wanderingoak.net/twitter_backup.json.\
    \ If Twitter changes their API, you can always run the sample code against that\
    \ URL.\n\n![](img/47ad0ac10bf11125744ef22c945d3099_150_0.png)"
  - "[PAGE 151]\n\nThis method call does two things of note. First, it creates a new\
    \ custom Twitter JSONAdapter, which I’ll show you how to create in a minute. Second,\
    \ it creates a TwitterAsyncTask and fires it off.\n\nYou’ll have noticed, if you\
    \ were watching closely, that I created a private data member to contain the Twitter-fetching\
    \ task. You astute readers might be wondering why I chose to stash it aside that\
    \ way. The answer is that because this task isn't happening on the main thread,\
    \ I need to be able to cancel it should the user close down the activity before\
    \ the task finishes. To do this, the onStop method will need to be able to call\
    \ the Twitter-fetching AsyncTask, making it a private data member.\n\n# ## GETTING\
    \ TWITTER DATA\n\nMy first task, at least when it comes to doing work, is to load\
    \ the stream of Twitter messages. You should, thanks to the previous chapter,\
    \ be very familiar with the ins and outs of fetching network data. Thanks to your\
    \ amazing proficiency, I’m going to hide the code required to do a network call\
    \ and read it into a string. If you’re having trouble remembering how to do this,\
    \ feel free to check out the sample code. Without further preamble, here’s what\
    \ my TwitterAsyncTask looks like:\n\n```\n```java\nprivate class TwitterAsyncTask\
    \ extends\n    AsyncTask<String, Integer, JSONArray>{\n    @Override\n    protected\
    \ JSONArray doInBackground(String... params) {\n        String response = getURLContents(params[0]);\n\
    \        try {\n            return new JSONArray(response);\n        } catch (JSONException\
    \ ex) { return null; }\n    }\n}\n```\n```"
  - "[PAGE 152]\n\n```\n```java\n@Override\nprotected void onPostExecute(JSONArray\
    \ response){\n    if(response == null)\n        return;\n    try{\n        ((TwitterJSONAdapter)getListAdapter())\n\
    .setData(response);\n        getListView().setVisibility(View.VISIBLE);\n    \
    \    View loading = findViewById(R.id.loading_text);\n        if(loading!=null)\n\
    \            loading.setVisibility(View.GONE);\n    }catch(Exception e){\n   \
    \     Log.e(\"TwitterFeed\", \"Failed to set Adapter\");\n    }\n}\n```\n```\n\
    \n# # HANDLING EXCEPTIONS\n\nIt's always a good idea to print out the cause of\
    \ any particular exception when it's caught. This is, at its core, just Java best\
    \ practices. If an exception comes through and you're not printing it to Android's\
    \ LogCat tool, things can get very confusing, very fast. When beginners have trouble\
    \ debugging a problem, it's often because they're catching and releasing exceptions\
    \ that contain important information."
  - '[PAGE 153]


    Again, if you’re struggling with how to fetch the data at the end of a URL and
    turn that data into a string full of JSON, check the included sample code for
    the contents of `getTwitterFeed`. Here are the general steps for fetching the
    data:


    +   1. Create a JSON array from the string that was fed back to you in `getTwitterFeed`.
    This will parse the data, which you then return at the end of the `doInBackground`
    method.

    +   2. Once you’re back on the main thread inside the `onPostExecute` method,
    it’s time to pass the JSON array to the custom adapter (which I promise to show
    you in just a second). Updating the data will trigger a redraw of the list view.

    +   3. Hide the initial “Loading…” `TextView` that I defined in the XML layout
    file, and show the list instead.


    > **NOTE:** Any changes to the Adapter’s data must take place on the main thread.
    Modifying the Adapter data counts as changing the UI, as far as Android is concerned.
    As always, all changes to the user interface must be carried out on the main thread.
    Keep this in mind as you create your own adapter, especially if you’re fetching
    data from the network off the main thread.


    ![](img/47ad0ac10bf11125744ef22c945d3099_153_0.png)


    # MAKING A CUSTOM ADAPTER


    All right, now comes the really interesting part. You need to create a custom
    Adapter to feed rows into the ListView.


    Custom Adapters have four methods you are required to override, all of which allow
    the ListView to acquire information about your data set.


    +   - `getCount()` returns the number of rows currently in the set of information.

    +   - `getItem(int position)` returns an object corresponding to a particular
    row position.

    +   - `getItemId(int position)` returns the ID that corresponds to the item at
    a specific position. This is used often with adapters that focus on Cursors (Android’s
    SQLite interfaces).'
  - "[PAGE 154]\n\n+   * getView(int position, View convertView, ViewGroup parent)\
    \ is where most of the Adapter's work will take place. The ListView, in making\
    \ this call, is essentially asking for the view at position. You must, in this\
    \ method, return a correctly configured view for the data at position. More on\
    \ exactly how this works in a minute.\n\nAs you can see by the get prefix on all\
    \ the required methods, all that Android Adapters do is provide row content information\
    \ to the ListView. The ListView, it would seem, is one very needy girlfriend (or\
    \ boyfriend...I'm not sure how to assign gender to Android UI interfaces).\n\n\
    Let me show you the example before I talk about any more theory. Twitter's API\
    \ returns its information in the form of JSON-encoded objects. It doesn't, at\
    \ this point, make sense to translate it to some other data store, so I'll design\
    \ my custom adapter to use a JSONArray object as its data backer. This class is\
    \ declared as an inner class definition in ListActivity.\n\n```\n```java\nprivate\
    \ class TwitterJSONAdapter extends BaseAdapter {\n    JSONArray data;\n    //Must\
    \ be called on the main thread\n    private void setData(JSONArray data){\n  \
    \      this.data = data;\n        this.notifyDataSetChanged();\n    }\n    @Override\n\
    \    public int getCount() {\n        if(data==null)\n            return 0;\n\
    \        else\n            return data.length();\n    }\n}\n```\n```"
