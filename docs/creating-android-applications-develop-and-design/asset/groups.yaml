    # ## BINDER SERVICE COMMUNICATION


    On the very opposite side of the spectrum from intent-based communication is a
    service controlled through a binder interface. This allows cross-process communication
    with any other component that binds itself to your service. More than one process
    or component can bind with any service singleton, but they will, of course, all
    be accessing the same one.


    Binding—and subsequently calling methods directly on the service—requires a few
    steps in order to handle the exchange cleanly and efficiently.


    +   1. Create the interface with an AIDL file.

    +   2. Create a service stub to return as the IBinder object.

    +   3. Implement a ServiceConnection in order to make the connection with the
    service.


