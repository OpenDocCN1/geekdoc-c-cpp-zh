    @id/text_view\"\n    android:gravity=\"center\"\n    android:id=\"@+id/main_image\"\
    \n    android:src=\"@drawable/bridge\"\n/>\n</RelativeLayout>\n```\n\n在这段布局代码中，你看到的视图组件与构成\
    \ LinearLayout 时相同，只不过在相对布局版本中，不需要第二个嵌套布局。RelativeLayout 中每个成员的运作机制可能比它的线性布局表亲更复杂，因此我会尽量逐一拆解这个屏幕的全部四个部分。\n\
    \n`<RelativeLayout>` 声明只包含足以告诉布局填满整个屏幕的信息。有关如何布局屏幕的所有信息都在子元素中。下面是第一个：\n\n```xml\n\
    <Button\n    android:id=\"@+id/prev\"\n    android:layout_width=\"wrap_content\"\
    \n    android:layout_height=\"wrap_content\"\n    android:padding=\"15dip\"\n\
    \    android:text=\"@string/prev_string\"\n    android:layout_alignParentLeft=\"\
    true\"\n    android:layout_alignParentTop=\"true\"\n/>\n```\n\n第一个视图声明了 Prev 按钮，它首先在\
    \ android:id 行中声明其 ID。Prev 按钮需要一个 ID，以便你可以在 Activity 代码中为它分配点击监听器。布局高度和宽度声明只是告诉视图将其做得足够大，以容纳所有内容（在本例中，是\
    \ \"prev\" 文本和一点内边距）。\n\n内边距声明告诉系统将按钮的边界从文本所需的最小空间向外扩展。在本例中，android:padding=\"\
    15dip\" 告诉系统测量 \"prev\" 文本所需的空间，然后向外扩展到视图外边界时再增加 15 个设备独立像素。一般来说，给按钮设置 10 到 20\
    \ dip 的内边距总是好的（具体取决于屏幕和文本大小）。这会给它们多一点空间，使其被识别为按钮，也让手指较大的人有机会真正点中视图。\n\n接下来是告诉系统将按钮放在布局对象内部何处的部分。属性\
    \ android:layout_alignParentLeft=\"true\" 告诉 Android 将视图的左边缘与父容器边界矩形的左边缘对齐。在本例中，就是屏幕的左边缘。android:layout_alignParentTop=\"\
    true\" 属性做同样的事，只是相对于布局对象的顶部（在本例中，是应用程序可用空间的顶部）。\n\n如果你不指定任何布局参数，视图将默认位于布局对象的左上角。这个代码示例声明这些视图是为了说明目的。\n\
    \n现在 Prev 按钮已就位，可以继续了。下面是 Next 按钮相关的 XML：\n\n```xml\n<Button\n    android:id=\"\
    @+id/next\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
    wrap_content\"\n    android:padding=\"15dip\"\n    android:text=\"@string/next_string\"\
    \n    android:layout_alignParentRight=\"true\"\n    android:layout_alignParentTop=\"\
    true\"\n/>\n```\n\n这种将一个视图居中放置在两个对象之间空间中的技巧，是我在 Android 工作中经常使用的，它也是消耗因屏幕尺寸小幅和大幅波动而产生的额外空间的好方法。也就是说，按钮之间的文本会居中浮动，处于你使用比设计时更大的屏幕时可能获得的任何可用屏幕空间中央。\n\
    \n### 添加灰色背景\n\n那么，你可能会问，LinearLayout 示例有灰色背景；如果 RelativeLayout 如此神奇，为什么它没有呢？首先，别对着书提问；你在公共场合会显得有点奇怪。其次，我故意没有添加背景，因为我想向你展示添加它有多容易。我已将添加背景所需的\
    \ XML 放在下面的代码中。花点时间看一下：\n\n```xml\n<!-- This is the top level layout -->\n<RelativeLayout\n\
    \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    android:layout_width=\"\
    match_parent\"\n    android:layout_height=\"match_parent\">\n    <View\n     \
    \   android:layout_width=\"match_parent\"\n        android:layout_height=\"wrap_content\"\
    \n        android:layout_alignParentLeft=\"true\"\n        android:layout_alignParentRight=\"\
    true\"\n        android:layout_alignParentTop=\"true\"\n        android:layout_alignBottom=\"\
    @id/next\"\n        android:background=\"#ff222222\"\n        />\n    <!--Rest\
    \ of the screen goes here -->\n</RelativeLayout>\n```\n\n我希望灰色框绘制在按钮栏后面，所以我将它作为布局中的第一个视图。Android\
    \ 按声明顺序绘制视图栈。因此，如果我把上面列出的 XML 错误地放在按钮和文本声明下面，你就只会看到灰色条覆盖在文本和按钮上。\n\n这样，你就成功添加了灰色背景，并使这个视图的\
    \ RelativeLayout 版本与之前的 LinearLayout 演示达到一致。RelativeLayout 可以处理更复杂的显示，而不需要其他嵌套布局。如果你足够聪明地使用它，它也可以处理屏幕尺寸变化，如通过让图像名称在按钮之间浮动所示——无论按钮相距多远。\n\
    \n### 小结\n\n在本章中，你已经了解了构成 Android UI 的基本构建块。虽然我还没有时间深入展示这些特定类中的任何一个，但我们一起为后续更深入的章节奠定了基础。这样，我就可以深入探讨文本视图（是的，我们会），而不必担心你不知道如何将它们排列在图像旁边，或让它们响应点击事件。\n\
    \n至此，关于向用户显示信息的概述结束。你应该能够自如地通过 Java 和 Android 的 XML 布局系统构建和修改基本用户界面。如果你没有跳过任何章节，你还能扩展现有的内置视图，让\
    \ Android 完全按你的意愿行事。接下来，你将暂时从在屏幕上绘制内容中抽身，了解如何为漂亮的用户界面获取数据。\n\n## 4 获取数据\n\n![](img/47ad0ac10bf11125744ef22c945d3099_114_0.png)\n\
    \n虽然本章的主要目标是教你如何从远程源获取数据，但这其实只是我教你了解 Android 和主线程的一种巧妙方式。为简单起见，本章所有示例都将涉及下载和渲染图像数据。在下一章关于适配器和列表的内容中，我将向你介绍解析复杂数据并将其显示给用户。通常，图像数据更大、更笨重，因此在处理它时你会遇到更有趣、更具说明性的时序问题。\n"
