    # # BIO


    Chris Haseman has been writing mobile software in various forms since 2003. He
    was involved in several large-scale BREW projects, from MMS messaging to Major
    League Baseball. More recently, he was an early Android engineer behind the doubleTwist
    media player, and he is now the lead Android developer for the website Tumblr.
    He''s a faculty member of General Assembly in NYC, where he teaches Android development.
    He lives in Brooklyn, where he constantly debates shaving his beard.'
  - '[PAGE 6]


    # ACKNOWLEDGMENTS


    As always, I could spend more pages thanking people than are in the work itself.
    Here are a few who stand out:


    David and Susanne H. for their support. Ellen Y. for believing so early that I
    could do this. JBL for fixing my code. Robyn T. for her patience. Cliff C. for
    finding me. Scout F. for her tolerance of my grammar. Sharon H. for her harassment
    IMs. Dan C. for his backing. Edwin and Susan K. for their care. Thomas K. for
    his subtle and quiet voice. Sparks for his humor. Cotton for “being there.” Lee
    for the place to write. The teams at both Tumblr and doubleTwist for all their
    encouragement. The Android team at Google for all their hard work. Most of all,
    Peachpit for giving me the opportunity to write for you.'
