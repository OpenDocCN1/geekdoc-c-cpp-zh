    \        <action android:name=\"android.intent.action.MAIN\" />\n        <category\
    \ android:name=\"android.intent.category.LAUNCHER\" />\n    </intent-filter>\n\
    </activity>\n```\n\n`android.intent.action.MAIN` 声明告诉系统，此 activity 是应用程序的主 activity。启动它不需要任何参数。在清单文件中只将一个\
    \ activity 列为 MAIN 是个好主意。这也是当你从 Eclipse 运行应用程序时，adb（Android 调试桥）知道要启动哪个 activity\
    \ 的方式。\n\n`android.intent.category.LAUNCHER` 类别告诉系统，当你在手机主屏幕的应用停靠栏中点击图标时，应启动包含该类别声明的\
    \ activity。此外，它还告诉 Android，你希望该图标出现在应用启动器抽屉中。这是 Android 项目创建工具为你创建的 intent-filter\
    \ 的一个示例。让我们添加一个我们自己的。\n\n## 添加 Intent\n\n如果你跳过了前面关于 Activity 类的部分，现在可能是个好时机回去至少浏览一下代码。在那一部分，我向你展示了如何声明并启动一个简单的新\
    \ activity。然而，我没有向你展示的是，如何通过在清单文件中为它声明一个 `<intent-filter>`，使该 activity 能够被整个系统访问。现在我们就来做这件事。\n\
    \n- 向 NewActivity 声明中添加一个 `intent-filter`：\n\n```xml\n<activity android:name=\"\
    .NewActivity\">\n    <intent-filter>\n        <action android:name=\"com.haseman.PURPLE_PONY_POWER\"\
    />\n        <category android:name=\"android.intent.category.DEFAULT\"/>\n   \
    \ </intent-filter>\n</activity>\n```\n\n在这段代码中，你注册了用于接收包含 com.haseman.PURPLE_PONY_POWER\
    \ action 的 intent，并将 intent-filter 的 category 设置为 default。\n\n现在，免得你以为我是个疯狂的儿童玩具爱好者，我使用了这个相当荒诞主义的\
    \ action 字符串来演示一个要点——即 action 字符串的唯一要求是，它对于你的特定组件而言必须是唯一的。\n\n在上一节中，我向你展示了如何使用以下代码行启动新\
    \ activity：\n\n```java\nIntent startIntent = new Intent(this, NewActivity.class);\n\
    startActivity(startIntent);\n```\n\n这可以工作，但它有一个主要限制：它不能在你自己的应用程序上下文之外启动。这使得 activity-intent\
    \ 模型提供的最强大特性之一变得无用。也就是说，设备上的任何应用程序，只要拥有正确的 intent，就可以使用你应用程序内的组件。\n\n既然你已经将 `<intent-filter>`\
    \ 添加到示例项目的清单文件中，你就可以使用以下代码在任何地方启动这个特定的 activity：\n\n```java\nIntent actionStartIntent\
    \ = new Intent(\"com.haseman.PURPLE_PONY_POWER\");\nstartActivity(actionStartIntent);\n\
    ```\n\n注意这段代码与其上面的代码清单之间有一个非常重要的区别。在这个示例中创建 intent 时，你不需要传入 Context 对象（即与整个系统通信所需的信息包）。这使得任何了解所需\
    \ intent 的应用程序都可以启动 NewActivity 类。\n\n## 多个 Intent，一个 Activity\n\n一个 activity\
