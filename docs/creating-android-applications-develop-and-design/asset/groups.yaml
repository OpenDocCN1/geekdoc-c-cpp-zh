    \ files are called firstscreen.xml, and the portrait version goes in the layout\
    \ folder while the landscape version goes in the layout-land folder. You could\
    \ also put the portrait version in a folder called layout-port. In both versions\
    \ of firstscreen.xml, you provide all the appropriate IDs for the text views,\
    \ buttons, and images.\n\nIf your screen had an OK button, you'd provide the portrait\
    \ and landscape versions of these buttons the same ID: R.id.ok_button. Remember\
    \ that you gain access to views by calling findViewById() and passing in the ID\
    \ you specified on the android:id=\"@+id/id_goes_here\" line. In this case, if\
    \ you wanted to set a click listener, you'd fetch the OK button by calling findViewById(R.id.ok_button);\
    \ and Android would return the button from your portrait screen if you're in portrait\
    \ mode and the landscape version of the button if you're in landscape mode. Your\
    \ code knows what it must do when that button is pressed, but it doesn't know\
    \ about the dimensions or location of the button. Welcome to the happy land of\
    \ the Model-View-Controller (MVC).\n\nMVC is your number one friend when handling\
    \ the diversity in device screen sizes. You can lay out your views in any possible\
    \ configuration and, as long as the IDs match, you'll need to write only a single\
    \ Activity class to handle all possible screen permutations. You can have specific\
    \ folders, each with its own set of layout files for different screen sizes (layout-small\
    \ to layout-xlarge) and densities (layout-ldpi to layout-hdpi), and you can mix\
    \ and match. For example, layout-large-land would specify layouts for large screens\
    \ (VGA and WVGA) that are in landscape mode. For the exact order in which Android\
    \ defaults through the folders, be sure to check the Android SDK documentation.\n\
    \nI'm only scratching the surface of the possibilities that these layout folders\
    \ put at your disposal. You'll learn more about this topic in coming chapters\
    \ on dealing with display and hardware diversity.\n\n## DRAWABLE FOLDERS\n\nFor\
    \ Android, a *drawable* is simply something that can be drawn to the screen. Android\
    \ abstracts away the differences between colors, shapes, and images and allows\
    \ you to deal with a superclass that can represent any number of them: Drawable.\
    \ You keep the definitions for these objects in the drawable folders. You should\
    \ consider using a drawable for two main types of objects:\n\n- Image resources\
    \ (mostly PNG files)\n- XML files describing things you want drawn: shapes, gradients,\
    \ or colors\n\nThe drawable set of folders works similarly to the layout folders.\
    \ You can specify any mix of screen densities, layouts, or resolutions, provided\
    \ you specify them in the right order.\n\n### MANY RESOURCES, ONE APK\n\n> Just\
    \ because you can have a whole different set of images for each screen size or\
    \ density doesn't mean you actually should. Keep a close eye on the size of your\
    \ final compiled APK file. If the file grows over a certain size, users will complain.\
    \ To combat this bloat, use 9-patches, which are easily scaled images, and use\
    \ hand-rendered shapes over large PNG graphics where possible. While the new marketplace\
    \ does allow for multiple APKs, it's a level of complexity you should avoid.\n\
    \n![](img/47ad0ac10bf11125744ef22c945d3099_91_0.png)\n\nReferencing a drawable\
    \ is accomplished in the same way that you reference values and layouts. For XML\
    \ files, use the `@drawable/resource_name`. For example, in an `ImageView` (`android:src=\"\
    @drawable/bridge\"`), omit the suffix if you're referring to XML files or images.\
    \ Also, keep in mind that Android will always try to use the drawable folder that\
    \ is closest to your current configuration. If it can't find a good match, it'll\
    \ cascade back to what it can find in the default drawable folder.\n\n**TIP:**\
    \ Be sure to check the Android SDK documentation for more info on ordering your\
    \ suffixes correctly.\n\n![](img/47ad0ac10bf11125744ef22c945d3099_92_0.png)\n\n\
    **FIGURE 3.1** A taste of what's to come.\n\nLayouts, from the simple to the complex,\
    \ describe how to arrange a complex series of views. This section covers the basics\
    \ of Android's arsenal of layout classes starting with the ViewGroup, moving through\
    \ LinearLayouts, and ending with the king of the Android screen arrangers, the\
    \ RelativeLayout.\n\n## THE VIEWGROUP\n\nEach layout in Android extends what's\
    \ known as the ViewGroup. This is the class of views that by definition can contain\
    \ other views as children.\n\nTo demonstrate how each of the major layouts function,\
    \ I'll be laying out an example picture-viewer screen. While Android provides\
    \ its own snazzy photo viewer, complete with a thumbnail carousel, mine will be\
    \ simple and an excellent vehicle for showing you how the various layouts work.\n\
    \nFigure 3.1 shows the screen that we'll be rendering using the AbsoluteLayout,\
    \ the LinearLayout, and the RelativeLayout.\n\nThese side effects while trying\
    \ to use an AbsoluteLayout. They'll likely try to talk you out of this lunacy.\n\
    \nThe AbsoluteLayout, as you might have guessed, allows you to specify exactly\
    \ where on the screen you want a particular view to go. Each child of an AbsoluteLayout\
    \ should have android:layout_x and android:layout_y values along with the required\
    \ width and height settings.\n\nYou are probably thinking, \"That sounds like\
    \ a great way to make layouts look exactly the way I want them to. Why bother\
    \ learning anything else when I can take my screen designs and convert them directly\
    \ into pixel x/y locations?\"\n\nI thought the same thing...at first.\n\nHere's\
    \ what the AbsoluteLayout layout XML looks like:\n\n```xml\n<?xml version=\"1.0\"\
    \ encoding=\"utf-8\"?>\n\n<AbsoluteLayout\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
    \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
    >\n    <Button\n        android:id=\"@+id/prev\"\n        android:layout_width=\"\
    wrap_content\"\n        android:layout_height=\"wrap_content\"\n        android:layout_x=\"\
    0dp\"\n        android:layout_y=\"0dp\"\n        android:text=\"@string/prev_string\"\
    \n        android:lines=\"1\"\n        android:padding=\"12dp\"\n        />\n\
    \    <TextView\n        android:id=\"@+id/url_view\"\n        android:layout_width=\"\
    wrap_content\"\n        android:layout_height=\"wrap_content\"\n        android:layout_x=\"\
    110dp\"\n        android:layout_y=\"0dp\"\n        android:gravity=\"center_horizontal\"\
    \n        android:text=\"The Golden Gate\"\n        />\n    <Button\n        android:id=\"\
    @+id/next\"\n        android:layout_width=\"wrap_content\"\n        android:layout_height=\"\
    wrap_content\"\n        android:text=\"@string/next_string\"\n        android:layout_x=\"\
    271dp\"\n        android:layout_y=\"0dp\"\n        android:lines=\"1\"\n     \
    \   android:padding=\"12dp\"\n        />\n    <ImageView\n        android:layout_width=\"\
