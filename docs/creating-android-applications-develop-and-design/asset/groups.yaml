    ## 这些对象如何交互？\n\n要理解 ListView 如何与 Adapter 交互，你必须先了解几个限制条件。首先，列表可以无限滚动下去，至少从设备的角度来看是这样。然而，你可能已经猜到，手机的内存是有限的。这意味着并不是每一个列表项都能在列表中拥有自己的条目，否则设备很快就会空间不足。此外，如果\
    \ ListView 必须在开始时就把每一行都布局出来，它可能会陷入长时间的卡顿，令人无法接受。\n\nAndroid 解决这些问题的方式是回收列表元素行。这个过程大致如下：\n\
    \n- 1. Android 会遍历整个列表，询问每一行需要多大空间（这样它才知道滚动指示器该画多大）。\n- 2. 一旦它大致知道整个 ListView\
    \ 有多大，就会为第一屏以及一个缓冲区请求视图（这样当用户开始滚动时，它就不必停下来获取更多视图）。当 ListView 反复调用 `getView` 时，你的\
    \ Adapter 需要创建、配置并返回这些视图。\n- 3. 当用户向下滚动，行从列表顶部消失时，Android 会在调用 `getView` 时把它们返还给你。实际上，它是通过把\
    \ `convertView` 对象传给你，要求你复用之前的视图。\n\n虽然回收列表元素行对节省内存和加速长列表很有好处，但它也有一些有趣的副作用。\n\n\
    - 为了利用内置的回收机制，你的所有列表视图都必须始终从同一个行布局中 inflate。Android 不知道你想创建哪种类型的列表项；因此，如果你有例如三种不同的行布局，系统就不知道该把哪一个传回给你，而你必须自己管理未使用视图的池。\n\
    - 任何异步任务，例如从磁盘加载图标或加载用户的头像，都必须检查 ListView 在下载或加载图像数据期间是否已经回收了该视图。如果任务完成时该行仍然显示同样的数据，就可以安全地更新该行；否则，就需要缓存或丢弃这些数据。\n\
    \n## 总结\n\n本章介绍了简单和自定义 ListView 以及 Adapter 的基础知识。我向你展示了如何创建一个简单的主菜单，并带你完成了一个简单的示例，即构建自定义\
    \ Adapter 来处理更复杂的 ListView。现在你已经掌握了基础知识。\n\n列表仍然是移动开发的基石之一。不过，我建议你尽可能少做单调、图形平淡的列表。虽然这些示例很适合向你展示如何构建自己的列表，但它们绝不是优秀界面设计的典范。你可以在需要时创建列表，而且非常应该这样做，但在不影响性能的前提下，要尽量把它们美化。\n\
    \n如果你还想了解更多，我强烈建议你通读 Android 对 `ListActivity.java` 的实现。因为 Android 是开源的，你可以免费获得构成其\
    \ SDK 的全部代码！请访问 http://source.android.com 获取更多信息。\n\n最后，我为本章编写的代码比这里能解释的要多。我建议你看看与本章相关的示例代码（位于\
    \ Peachpit.com/androiddevelopanddesign），以了解更多关于如何通过菜单点击启动一个屏幕，以及如何使用 `ListFragment`\
    \ 构建类似的主菜单屏幕。\n\n## 6 服务之道\n\n![](img/47ad0ac10bf11125744ef22c945d3099_162_0.png)\n\
    \n服务是 Android 平台中最重要、也往往未得到充分利用的组件之一。对于任何数据或相关性可能跨越多个 Activity 的任务，服务都是必不可少的。它们与\
    \ Activity 一样拥有生命周期（尽管要简单得多），但没有 Activity 那样绘制到屏幕的能力。在实践中，服务分为两大用例：监听器（listener）和任务（task）。监听器是在后台待命、等待某件事情发生从而促使它们采取行动的服务。任务服务类似于我们之前介绍过的图片下载器，因此本章我将重点讨论监听服务。\n\
    \n## 什么是服务？\n\n从最基本的层面来说，Service 是一个具有简单运行时生命周期且无法访问屏幕的类。在第 4 章中，我向你展示了如何使用 `IntentService`\
    \ 获取图片，你已经对它有所接触；但现在我有机会帮助你真正深入了解这个简单而强大的组件。\n\n请记住，虽然服务对你来说可能很重要，但对 Android 而言，它并不比整个设备的流畅运行更重要。这意味着，如果系统认为你的服务运行时间过长、消耗了太多资源，或者恰逢本月第三个星期五又是满月，它随时都可能关闭你的服务。有一种方法可以让系统不要杀掉你，我马上就会展示它是什么样子。\n\
    \n### 服务的生命周期\n\n从本质上讲，服务是一个单例。应用程序中的任何组件都可以通过指定要启动的服务的 Intent 来调用 `startService`。如果服务尚未运行，Android\
    \ 会初始化一个新实例；否则，它只会通知现有实例有一个新的启动命令已发出。以下是服务生命周期的简要说明。\n\n- `onCreate` 在服务启动时于主线程中被调用。这是初始化你在服务运行期间将要依赖的任何数据的好时机。\n\
    - 每次 Activity（或其他任何组件）调用 `startService` 时，都会调用 `onStartCommand`。传入 `startService`\
    \ 的 Intent 将被交给你的 `onStartCommand` 调用。\n- `onBind` 是你向调用方返回一个接口对象的机会，该接口允许直接调用服务上的方法。不过，binder\
    \ 是可选的，只有在与服务进行大量通信时才真正需要。这产生了一种与调用 `Context.startService` 不同的交互方式。与 `startService`\
    \ 类似，`bindService` 接收一个 Intent，如果服务尚未运行，它就会启动该服务。如果你觉得我刚才写的完全不知所云，那也没关系；到本章结束时，你就会明白得多。\n\
    \n在这个生命周期阶段，你的服务现在已经愉快地运行起来了。可以播放音乐、获取数据（记住主线程！），还可以进行录音并处理成语音命令。\n\n"
