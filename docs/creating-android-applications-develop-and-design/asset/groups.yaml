    # DON’T GET IN TOO DEEP


    > Linear layouts can only lay out their children in one of two orientations: horizontal
    or vertical. This can, if you’re not careful, lead to screens with heaping piles
    of nested layout objects. Go too deep into a set of nested layouts and your screen
    will render at the speed of a herd of turtles. Android engineers suggest keeping
    the depth of your layout to less than ten. This is to say, don’t create a view
    hierarchy with more than ten nested layouts of any kind. In practice, do everything
    you can to use as few layouts as possible, because you’ll start to see slowdowns
    on older, slower phones when your layout depths are greater than seven or eight.
    If you find you’ve gotten in over your head with a stack of LinearLayouts, consider
    refactoring with a single RelativeLayout instead.'
