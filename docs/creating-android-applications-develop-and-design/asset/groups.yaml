    \        playNextVideo();\n    }\n}\n```\n\n## Android、媒体和 ContentResolver\n\n\
    在某些条件下，Android 会使用一个名为 MediaScanner 的辅助程序在 SD 卡中搜索新媒体。当发现新媒体时，它会被添加到 Android 的媒体\
    \ ContentProvider 中。使用 MediaStore 类中定义的列，你可以查询手机内置的媒体库以获取内容。MediaScanner 会读取 ID3\
    \ 标签以及它能获取的任何其他元数据，以获取有关设备内容的信息。尽管这个示例和上一章中的照片查找示例都相当简单，但如果使用得当，媒体存储和 Android\
    \ 的 ContentResolver 可以非常强大。请查阅这些类的 SDK 文档以获取更多信息。\n\n如你所见，我仍在获取并缓存视频视图，但现在我向 Android\
