  - "[PAGE 148]\n\n# REACTING TO CLICK EVENTS\n\nYour code will need to listen for\
    \ item clicks.\n\nWhat's the point of having a menu if you can't tell when items\
    \ have been selected? Right, there isn't one. Let me show you the final piece\
    \ to my basic list menu example. Add the following method to your MainMenuActivity.java\
    \ file:\n\n```\n@Override\npublic void onListItemClick(ListView lv,\n        View\
    \ clickedView,\n        int position, long id)\n{\n    super.onListItemClick(lv,\
    \ clickedView, position, id);\n    TextView tv = (TextView)clickedView;\n    Toast.makeText(getApplicationContext(),\n\
    \        \"List Item \"+tv.getText()+\" was clicked!\",\n        Toast.LENGTH_SHORT).show();\n\
    }\n```\n\nThe ListActivity will call this method (if you've defined it) every\
    \ time an element in the list view is clicked (or tapped with a finger). For more-complicated\
    \ lists, you may want to use the ID (especially if you are using SQLite as a backing\
    \ store). For this simple demo, I've just popped up a little dialog showing the\
    \ text of the item that was pressed. If you're implementing your own basic main\
    \ menu, I suggest you use the position of the clicked item to start an activity,\
    \ service, or other action. You can see an example of this if you look at the\
    \ associated source code.\n\nThat's the most basic list view I could possibly\
    \ show you. Now, I'll take you in the opposite direction and show you what a custom\
    \ list backed by a remote data source looks like."
