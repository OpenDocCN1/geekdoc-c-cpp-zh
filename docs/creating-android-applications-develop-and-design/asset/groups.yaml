    There are two main ways to communicate with a service: intent broadcasts and binder
    interfaces. I’m going to show you examples of both and, along the way, let you
    see two practical tasks for a service. There are, in fact, many more ways you
    can communicate with your services. But in my experience, these are the two most
    useful. As always, check the documentation if neither of these approaches feels
    quite right for you.


    # INTENT-BASED COMMUNICATION


    Imagine two workers in different rooms who can only communicate with each other
    by email. These emails can contain attachments and other pieces of data. The two
    workers must get through their day using only this one method of communication.
    As you might imagine, this can be an efficient and functional way to get a multitude
    of things done, as long as they don’t have to say too much to each other.


    This is, in a sense, exactly what *intent-based communication* with services would
    look like translated to real life. The service is started with an intent; when
    it completes its task or something that it’s waiting for occurs, it sends a broadcast
    intent alerting anyone listening that a particular task is finished. You saw one
    example of this in Chapter 4 when I was downloading images using an intent service.
    Let me show you one more.


    The following example is one of the best examples of intent-based communication
    that I can give you in this printed form. I’ll create all the pieces required
    for a new service that runs, with a notification, in the foreground. I use Android’s
    ContentProvider to listen for and acquire the location of new photographs as they
    are taken. This code will alert you when any new picture is snapped, regardless
    of the application used to do it. What you do with the photograph, I’ll leave
    to your boundless imagination.


    # AUTO IMAGE UPLOADING


    One of my favorite features of the Google+ Android app is its ability to automatically
    upload photos in the background. It turns out that with a ContentProvider, Service,
    and ContentObserver, you can do this quite easily in your own app. My sample service
    will launch, place itself in the foreground, and trigger a broadcast intent whenever
    a new photo is taken. You could, in your own code, upload the image or take any
    number of other actions. Using this technique would involve the following general
    steps.'
