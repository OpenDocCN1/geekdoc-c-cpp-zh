    \ XML 文件：形状、渐变或颜色\n\ndrawable 文件夹集的工作方式与 layout 文件夹类似。你可以指定屏幕密度、布局或分辨率的任意组合，前提是按正确顺序指定它们。\n\
    \n### 许多资源，一个 APK\n\n> 你能够为每种屏幕尺寸或密度准备一整套不同的图像，并不意味着你真的应该这样做。请密切关注最终编译后的 APK 文件大小。如果文件增长到超过一定大小，用户就会抱怨。为了对抗这种臃肿，请使用\
