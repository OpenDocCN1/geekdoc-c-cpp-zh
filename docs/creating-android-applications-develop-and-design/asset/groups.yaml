    \ 文件夹\n\n对 Android 来说，*可绘制对象*就是可以绘制到屏幕上的东西。Android 抽象掉了颜色、形状和图像之间的差异，并允许你使用一个可以表示其中任意数量的超类：Drawable。你将这些对象的定义保存在\
