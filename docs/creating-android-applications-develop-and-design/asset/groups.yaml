  mdcn: "\n音乐播放通常围绕 MediaPlayer 类展开。从某种意义上说，这与你刚刚用视频视图完成的工作非常相似（区别在于你不需要一个 View 对象来渲染）。\n\
    \n如果媒体播放器用于播放音乐，就应该放在它们自己的服务中，但有一个明显的例外：游戏和应用程序音效。构建一个音效示例将是一种非常简单的方式，帮助你入门音频播放的基础知识。\n\
    \n## MEDIAPLAYER 与状态\n\n你不能就这样走进魔多。同样，你也不能随随便便到处播放东西。这需要细心、对细节的关注，以及对媒体播放器状态的理解。下面按你最可能遇到它们的顺序列出这些状态：\n\
    \n- 空闲（Idle）。在此状态下，MediaPlayer 什么都不知道，因此实际上什么也做不了。要进入 initialized（已初始化）状态，你需要告诉它将要播放哪个文件。这通过\
    \ setDataSource 方法完成。\n- 已初始化（Initialized）。此时，媒体播放器知道你想让它播放什么，但还没有获取用于播放的数据。在处理从\
    \ URL 播放远程音频时，理解这一点尤其重要。调用 prepare 或 prepareAsync 会将它移动到 prepared（已准备）状态。它还会从文件系统或互联网加载足够的数据，以便准备好播放。\n\
    - 已准备（Prepared）。在调用 prepare 或 prepareAsync（并收到回调）之后，你的媒体播放器就准备好开始播放了！此时，你可以调用\
    \ seek（移动播放头）或 start（开始播放）。\n- 播放中（Playing）。音频在播放，人们在跳舞（好吧，也许并没有），生活很美好。在此状态下，你可以调用\
    \ pause 来暂停音频，或调用 seek 来移动播放位置。调用 stop 结束这场派对，这会将媒体播放器移回 initialized（已初始化）状态。\n\
    \n仅仅因为你已经播放完了媒体，并不意味着播放器会进入 idle（空闲）状态。如果你之后想调用 start（从头重新开始播放音频）或 seek（将播放头移动到特定位置），它会保持当前文件处于已加载状态。只有当你调用\
