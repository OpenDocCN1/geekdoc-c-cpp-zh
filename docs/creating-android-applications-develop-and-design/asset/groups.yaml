    # # THE LOADER


    Loader is a new class that comes both in Honeycomb and in the Android Compatibility
    library. Sadly, there is not enough space in this chapter to cover it in detail,
    but I will say that it''s an excellent tool to explore if you must do heavy lifting
    off the main thread repeatedly. It, like AsyncTask, is usually bound to an activity,
    but it is much better suited to handle situations where a single task must be
    performed many times. It''s great for loading cursors (with the CursorLoader subclass)
