    \    lastUpdateTime = System.currentTimeMillis();\n    setForegroundState(true);\n\
    \    return Service.START_STICKY;\n}\n```\n\nI'm going to record when the service\
    \ started (more on why that's important in just a second). Last, I return `Service.START_STICKY`,\
    \ which tells the system that should the service be terminated for memory or performance\
