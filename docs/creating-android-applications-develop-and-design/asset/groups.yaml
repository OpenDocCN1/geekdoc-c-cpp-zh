    \nNext, you’ll need to put a file there for it to find.\n\n## CREATING THE NEW\
    \ ACTIVITY CLASS\n\nThere are several ways to create a new activity, but here\
    \ is the easiest way to do it in Eclipse.\n\n- 1. Right-click (or Control-click)\
    \ the package name you’ve chosen (mine is com.haseman.peachPit).\n- 2. Select\
    \ New, then select Class.\n- 3. Give the class a name in the dialog.\n\nA name\
    \ is enough to create a new file. The file will be saved in your main package\
    \ under the name you specified. In my demo, it is in my project under src/com/haseman/peachPit/NewActivity.java.\n\
    \nNow that you have a class that extends an object, you’ll need to switch it over\
    \ to extend an activity.\n\n## CREATING A NEW SCREEN LAYOUT\n\nHere’s how you\
    \ create a new layout.\n\n- 1. Create a new file named **new_activity.xml** inside\
    \ the **res/layout/** folder. It should sit next to the existing **main.xml**\
    \ file (which is used by your existing activity). This **new_activity.xml** file\
    \ should look almost exactly like **main.xml**, except you’ll need to add a reference\
    \ to the string you just created.\n- 2. Insert the highlighted line to create\
    \ a reference to the string you just created.\n- 3. Give this modified TextView\
    \ an ID so your Java code can reference it (you’ll learn more about TextViews\
    \ later; for now you should know that they’re Android views that show text on\
    \ the screen):\n\n    ```xml\n    <?xml version=\"1.0\" encoding=\"utf-8\"?>\n\
    \    <LinearLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\
    \n        android:orientation=\"vertical\"\n        android:layout_width=\"fill_parent\"\
    \n        android:layout_height=\"fill_parent\"\n    >\n    <TextView\n      \
    \  android:id=\"@+id/new_activity_text_view\"\n        android:layout_width=\"\
    fill_parent\"\n        android:layout_height=\"wrap_content\"\n        android:text=\"\
    @string/new_activity_text\"\n    />\n    </LinearLayout>\n    ```\n\nI will devote\
    \ Chapter 3 to resource management and user interface design, but for now just\
    \ keep in mind that the @ prefix is how you tell Android you want to reference\
    \ an ID, string, or drawable that is defined elsewhere as a resource.\n\nNow that\
    \ you have a new layout with its shiny new string, you’ll need to tell the NewActivity\
    \ class that you want it to use this particular layout file.\n\n"
  mdcn: "\n\n![](img/47ad0ac10bf11125744ef22c945d3099_34_0.png)\n\n**图 1.9** 你的第一个\
    \ Android 应用程序，正在模拟器上运行！\n\n## 小结\n\n本章涵盖了 Android 应用程序的下载、安装、配置、创建和运行。现在你已经掌握了继续阅读本书所需的最基本工具。如果在后续章节中遇到困难，可以随时根据需要回顾本章。\n\
    \n![](img/47ad0ac10bf11125744ef22c945d3099_36_0.png)\n\n我相信你已经准备好卷起袖子编写更多代码了。不过，还有一些理论和设计领域的话题需要先详细讨论。本章将介绍一些基本构建块的基础知识，包括构成一个简单\
    \ Android 应用程序的文件、部件和术语；控制单个屏幕的 Activity 类；Android 强大的通信类 Intent 类；以及可从所有组件访问的\
    \ Application 单例类。\n\n我建议你打开 Eclipse，跟随我一起了解 Android 应用程序的各个工作部分。我将使用你在第 1 章创建的那个带有主\
    \ Activity（名为 MyActivity）的 Android 项目。\n\n## 文件\n\n任何移动应用程序，就其最基本的形式而言，都由一个屏幕组成，通过点击设备主屏幕上的图标即可启动。\n\
    \n当 SDK 创建一个基本的 Android 项目时，它还会创建若干文件和重要目录。\n\n与任何项目一样，在开始构建结构之前，至少快速浏览一下蓝图是很重要的。以下是构成\
    \ Android 项目结构的文件和文件夹。\n\n- `AndroidManifest.xml`\n- `/res`\n- `/src`\n\n在本章剩余部分，我将提到清单文件和这些文件夹。\n\
    \n## 清单文件\n\nAndroidManifest.xml 文件是你通往手机其余部分的门户。在它里面，你将描述哪些组件应接收哪些事件。你还需要在清单文件中声明你的应用需要获得访问权限的硬件和软件。首先，让我们看一下\
    \ AndroidManifest.xml 文件中的 `<manifest>` 声明：\n\n```xml\n<manifest xmlns:android=\"\
    http://schemas.android.com/apk/res/android\"\n    package=\"com.haseman.peachPit\"\
    \n    android:versionCode=\"1\"\n    android:versionName=\"1.0\">\n```\n\n这段代码中有几个值得注意的地方。包定义告诉\
    \ Android 在哪个 Java 包中查找构成应用程序组件的类文件。接下来的两个变量目前不是特别重要，但一旦你准备好将应用发布到 Android Market，它们就会变得至关重要。versionCode\
    \ 是一个数字，帮助 Market 提醒用户有可用更新。versionName 是一个字符串，应用菜单和 Market 会将其作为应用的当前版本显示给用户。\n\
    \n你的应用程序只能有一个 AndroidManifest.xml 文件。此后，我将把这个文件及其概念简称为清单文件。\n\n## Activity 类\n\
    \n在典型的 Android 应用程序中，Activity 是运行操作的骨干。本质上，它们的用途是控制屏幕上显示的内容。它们在你想显示的数据与负责显示数据的\
    \ UI 布局文件和类之间架起桥梁。如果你熟悉流行的模型-视图-控制器（MVC）架构，那么 Activity 就相当于一个屏幕的控制器。清单文件中的 Activity\
    \ 声明如下所示：\n\n```xml\n<activity android:name=\".MyActivity\"\n    android:label=\"\
    @string/app_name\">\n    <!-- More on how the intent-filter works in the next\
    \ section-->\n    <intent-filter>\n        <action android:name=\"android.intent.action.MAIN\"\
    \ />\n        <category android:name=\"android.intent.category.LAUNCHER\" />\n\
    \    </intent-filter>\n</activity>\n```\n\n`android:name` 标签告诉系统，在你的包（来自清单声明）末尾放置什么内容，以找到你的类定义。例如，在我的示例项目\
    \ `com.haseman.peachPit.MyActivity` 中，类加载器将查找一个继承 Activity 类的类。\n\n为了做到这一点，文件必须位于\
    \ `src/com/haseman/peachPit` 目录下。这是 Android 所用语言的标准操作流程。\n\n### 观察 Activity 的实际运行\n\
    \n如果使用得当，Activity 就是一个专门控制单个屏幕的对象。让我们以现实世界中的 RSS 新闻源阅读器为例，将这个神秘的 Activity 作为案例来讨论，它可以快速解释许多理论页面常常忽略的内容。开发者通常使用一个\
    \ Activity 列出用户订阅的所有新闻源。当用户点击某个新闻源时，开发者使用第二个 Activity 显示该特定新闻源的可用文章列表。最后，当用户点击某篇报道时，开发者使用第三个\
    \ Activity 显示该文章的详细信息。\n\n很容易看出 Activity 如何承担特定角色（订阅列表、文章列表、文章详情）。同时，这些 Activity\
    \ 又是通用的：文章列表应该能够显示来自任何 RSS 新闻源的文章列表，而文章详情 Activity 应该显示通过 RSS 阅读器找到的任何文章的详情。\n\
    \n因此，一旦设置好它，就不能再更改。这就是 Android SDK 强制你为每个屏幕使用一个新 Activity 的方式，因为每次你想更改根内容视图时，都需要一个不同的\
    \ Activity。\n\n## 让 Android 了解你的新 Activity\n\nAndroid 系统需要知道在启动你的新 Activity 时到哪里找到它。\n\
    \n- 1.  在 Eclipse 中打开 AndroidManifest.xml 文件。\n- 2.  在 `<application>` 标签内、紧接上一个声明中\
    \ `</activity>` 结束标签之后添加以下行：\n\n    ```xml\n    <activity android:name=\".NewActivity\"\
    />\n    ```\n\n这一小行告诉系统在应用程序包中的哪里找到新 Activity。在我的演示中，类加载器知道要在 com.haseman.peachPit.NewActivity\
    \ 处查找该 Activity。\n\n接下来，你需要在那里放置一个文件，以便它能够找到。\n\n## 创建新的 Activity 类\n\n创建新 Activity\
    \ 有几种方法，但以下是在 Eclipse 中最简单的方法。\n\n- 1.  右键单击（或按住 Control 键单击）你选择的包名（我的是 com.haseman.peachPit）。\n\
    - 2.  选择 New，然后选择 Class。\n- 3.  在对话框中为类命名。\n\n一个名称就足以创建一个新文件。该文件将按你指定的名称保存在主包中。在我的演示中，它位于项目的\
    \ src/com/haseman/peachPit/NewActivity.java 下。\n\n现在你有一个继承自对象的类，需要将其改为继承 Activity。\n\
    \n## 创建新的屏幕布局\n\n以下是创建新布局的方法。\n\n- 1.  在 **res/layout/** 文件夹中创建一个名为 **new_activity.xml**\
    \ 的新文件。它应该与现有的 **main.xml** 文件（你的现有 Activity 所使用的文件）放在一起。这个 **new_activity.xml**\
    \ 文件应该看起来几乎与 **main.xml** 完全相同，只是你需要添加对刚才创建的字符串的引用。\n- 2.  插入突出显示的行，以创建对刚才创建的字符串的引用。\n\
    - 3.  为这个修改后的 TextView 指定一个 ID，以便你的 Java 代码可以引用它（你将在后面了解更多关于 TextView 的内容；现在你应该知道它们是用于在屏幕上显示文本的\
    \ Android 视图）：\n\n    ```xml\n    <?xml version=\"1.0\" encoding=\"utf-8\"?>\n\
    \    <LinearLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\
    \n        android:orientation=\"vertical\"\n        android:layout_width=\"fill_parent\"\
    \n        android:layout_height=\"fill_parent\"\n    >\n    <TextView\n      \
    \  android:id=\"@+id/new_activity_text_view\"\n        android:layout_width=\"\
    fill_parent\"\n        android:layout_height=\"wrap_content\"\n        android:text=\"\
    @string/new_activity_text\"\n    />\n    </LinearLayout>\n    ```\n\n我将把第 3 章专门用于资源管理和用户界面设计，但就目前而言，请记住：@\
    \ 前缀是你告诉 Android 想要引用在其他地方定义为资源的 ID、字符串或可绘制对象的方式。\n\n现在你已经有了一个带有闪亮新字符串的新布局，你需要告诉\
    \ NewActivity 类你想让它使用这个特定的布局文件。\n\n"
