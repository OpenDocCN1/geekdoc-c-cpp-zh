    # **ONE VIEW MUST BE IN CHARGE OF SIZE**


    One view, or layout, must define a height and width value. You cannot tell Android
    that you''d like a layout to wrap its content while, at the same time, telling
    a view that it should match its parent. This will cause a compile error because
    Android has no idea how big to make either the parent view or the child layout.
    Something must define an actual height, even if it''s an image or a line of text.


    By setting the orientation to horizontal, Android knows to place the children
    in order from left to right across the top of the screen. The outer layout is
    a vertical one, allowing placement of the button bar above the image.


    By setting the width to match_parent, I''m making sure the layout itself stretches
    all the way across the parent layout (in this case the entire screen). The height
    is set to wrap_content, so it will be exactly as tall as the final measured height
    of its children.


    The LinearLayout distributes its children in the order they''re defined. It then
    measures all the child views to see how much space they''d like to take up. It
    will then divvy up the available space in proportion to the ideal size of its
    children. If there is too little space to accommodate all the child views, it''ll
    give each child a part of their required space in proportion to their measured
    size. If there''s more than enough space for all the child views, it''ll pass
    out the extra space based on how large the child''s onMeasure call tells the layout
    it wants to be. You can modify this proportional distribution through the layout_weight
    attribute in each child.


    Layout really happens more in the definition of the children than the declaration
    of the layout itself. So, for a bit of context, let''s take a look at the individual
    members of the button bar layout.'
