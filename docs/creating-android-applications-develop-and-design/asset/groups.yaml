  - '[PAGE 245]


    The variable containerViewId should refer to an existing ViewGroup in your activity’s
    layout where the new fragment should be placed. You can also, at a later time,
    replace one fragment with another by calling replace(containerViewId, newFragment);,
    where containerViewId specifies the view container that currently holds the fragment
    you’d like to replace. You can replace only fragments that were previously added
    using a FragmentManager transaction; fragments declared statically in XML layouts
    cannot be replaced.


    By using either XML or the fragment manager to set up and modify views, you should
    have no trouble building complex, scalable, and beautiful applications that render
    well on both handsets and tablets.


    Remember that all fragments should work independently of their siblings (much
    in the same way that activities should stay independent), even if they might share
    the same screen.


    Given the power of Android’s layout folders (which we covered at length in Chapters
    3 and 7), you should see the possibilities in building one layout for tablets
    (which could have several fragments on it) and building another for small-screened
    phones (which would have only one visible fragment at a time).


    If you’re looking for a simple example, I highly recommend you take a look at
    the project in the sample code for this chapter.


    # ## PROVIDING BACKWARD COMPATIBILITY


    Android has, thankfully, bundled fragments into their compatibility library. This
    means you can work with fragments even if you’re planning on supporting pre-3.0
    devices. I highly recommend that you use it whenever you can. Installing it is
    as simple as clicking the menu item shown in Figure 10-3.


    Take note, however, that building your project against a 3.0 or higher version
    and still using the compatibility libraries at the same time can get a little
    complicated. If you’re doing this, make sure all your imports come from the support
    library like this:


    ```

    ~~~

    import android.support.v4.app.Fragment;

    ~~~

    ```


    instead of like this:


    ```

    ~~~

    import android.app.Fragment;

    ~~~

    ```'
