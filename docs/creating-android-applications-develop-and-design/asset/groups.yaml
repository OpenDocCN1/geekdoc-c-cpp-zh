    \ 调用 execute，它就会下载图片，将其处理为位图，并显示到屏幕上。当然，这假设你的 image_layout.xml 文件中包含一个 ID 为 remote_image\
    \ 的 ImageView。\n\n## 如何让它为你所用\n\nAsyncTask 要求你在声明任务扩展时指定三个泛型类型参数（如果你对 Java 和泛型不太确定，请先搜索了解一下再继续）。\n\
    \n- 将传递给类的参数类型。在这个 AsyncTask 示例代码中，我传入一个字符串作为 URL，但我也可以传入多个。无论传入多少个参数，它们总是以数组形式被引用。注意，我将单个\
    \ URL 字符串引用为 params[0]。\n- 在 doInBackground 方法（非主线程）和 onProgressUpdate 方法（将在主线程上调用）之间传递的对象。在示例中它无关紧要，因为我在演示中没有做任何进度更新，但它很可能是一个整数，表示事务完成的百分比或传输的字节数。\n\
    - 由 doInBackground 方法返回并由 onPostExecute 调用处理的对象。在这个小示例中，它是我们打算下载的位图。\n\n下面这行代码声明了这三个对象：\n\
    \n```java\nprivate class ImageDownloader extends\n    AsyncTask<String, Integer,\
    \ Bitmap>{\n```\n\n在这个例子中，这些就是会传递给你的三个主要方法的类。\n\n### ONPREEXECUTE\n\n```java\n\
    protected void onPreExecute(){\n}\n```\n\nonPreExecute 通常是你想要设置加载对话框或屏幕角落加载指示器（spinner）的时候（我稍后会深入讨论对话框）。请记住，onPreExecute\
    \ 在主线程上调用，所以在这个方法中绝对不要访问文件系统或网络。\n\n### DOINBACKGROUND\n\n```java\nprotected Bitmap\
    \ doInBackground(String... params) {\n}\n```\n\n这是你尽情进行网络连接、文件系统访问或其他耗时操作而不阻塞手机的机会。传递给此方法的对象类，取决于\
    \ AsyncTask 类声明中的第一个泛型对象。虽然在代码示例中我只使用了一个参数，但实际上你可以传递任意数量的参数（只要它们派生自所声明的类），并且在\
    \ doInBackground 被调用时它们都触手可及。一旦长时间运行的任务完成，你需要在函数末尾返回结果。这个最终值会被传递给另一个在主 UI 线程上回调的方法。\n\
    \n### 当心加载对话框\n\n请记住，移动应用与 Web 或桌面应用不同。用户通常是在远离传统电脑时使用手机。这意味着他们通常已经在等待某件事：公交车、那杯昂贵的咖啡、朋友从洗手间回来，或一场无聊的会议结束。因此，非常重要的是，不要让他们在你的应用内再等待任何事情。当你已经在等待别的东西时，还要等待移动应用连接，这可能会令人沮丧。尽你所能减少用户接触全屏加载对话框的机会。它们有时是不可避免的，但要尽可能减少。\n\
    \n### 显示进度\n\nAsyncTask 还有一个你应该了解的方面，虽然我还没有演示它。在 doInBackground 内部，你可以向用户界面发送进度更新。doInBackground\
    \ 不在主线程上，所以如果你想更新进度条或改变屏幕上某个东西的状态，你必须回到主线程才能进行更改。\n\n在 AsyncTask 内部，你可以在 doInBackground\
    \ 方法中调用 publishProgress 并传入任意数量的对象（这些对象派生自 AsyncTask 声明中的第二个类，本示例中是 Integer），从而实现这一点。Android\
    \ 然后会在主线程上调用你声明的 onProgressUpdate 方法，并把你传给 publishProgress 的类交给它。下面是 AsyncTask\
    \ 示例中该方法的代码：\n\n```java\nprotected void onProgressUpdate(Integer... params){\n\
    \    // Update a progress bar here, or ignore it, it's up to you\n}\n```\n\n和往常一样，进行\
    \ UI 更新时要小心，因为如果 Activity 当前不在屏幕上或已被销毁，你可能会遇到一些麻烦。\n\n### ONPOSTEXECUTE\n\n工作已经完成，或者在这个例子中，图片已经下载完毕。是时候用我获得的内容更新屏幕了。在\
    \ doInBackground 的末尾，如果成功，我会向 AsyncTask 返回一个已加载的位图。现在 Android 会切换到主线程，并调用 onPostExecute，把我从\
    \ doInBackground 末尾返回的对象传递给它。下面是该方法的代码：\n\n```java\nprotected void onPostExecute(Bitmap\
    \ img){\n    ImageView iv = (ImageView)findViewById(R.id.remote_image);\n    if(iv!=null\
    \ && img!=null){\n        iv.setImageBitmap(img);\n    }\n}\n```\n\n我获取从网站下载的位图，找到要加载它的图像视图，并将其设置为该视图要渲染的位图。这里有一个我没有正确处理错误情况的地方。花点时间回看原始代码，看看你是否能发现它。\n\
    \n### 一些重要的注意事项\n\n通常，AsyncTask 是在 Activity 中启动的。但是，你必须记住，Activity 的生命周期可能很短。回想一下，默认情况下，每次旋转屏幕时\
    \ Android 都会销毁并重新创建任何 Activity。当用户退出时，Android 也会销毁你的 Activity。你可能会合理地问：“如果我在一个\
    \ Activity 中启动 AsyncTask，然后该 Activity 被销毁，会发生什么？”你猜对了：非常糟糕的事情。试图绘制一个已经从屏幕上移除的\
    \ Activity，可能会造成各种混乱（通常表现为未处理的异常）。\n\n最好跟踪你启动的任何 AsyncTask，当 Activity 的 onDestroy\
    \ 方法被调用时，务必对所有尚未结束的 AsyncTask 调用 cancel。\n\n在以下几种情况下，AsyncTask 非常适合这项工作：\n\n-\
    \ 下载特定于某个 Activity 的小量数据\n- 从外部存储驱动器（通常是 SD 卡）加载文件\n\n"
