    \ on your needs, you can mix and match two techniques. There isn't a huge advantage\
    \ either way, but it's good to know each so you can keep your code in good order.\n\
    \nIn this example, I've added a click listener to two buttons. A click listener\
    \ can be attached to any view that you want users to interact with. This can be\
    \ anything from entire view groups to simple text views.\n\nIt's worth mentioning\
    \ again that by setting a click listener, you're telling the system that the item\
    \ can be selected (touched with a finger) and clicked (highlighted with the trackpad\
    \ and then clicked with the center key or trackball). As a result, whatever default\
    \ selection action is configured for the view will automatically run on a select\
    \ event (either from the directional keypad or the touchscreen). Buttons, for\
    \ example, change colors when a user selects them. Text views, depending on the\
    \ device's default UI style, may also change the active color of the text. In\
    \ the end, you can (and probably should) specify custom display behavior by declaring\
    \ a stateful drawable. I'll show you how to do such things later in the book.\n\
    \n## CREATING CUSTOM VIEWS\n\nThe concept of custom views can really be broken\
    \ out into two sections: extending an existing view and creating an entirely new\
    \ one. I've rarely, in my career as an Android developer, created a completely\
    \ custom view, so we'll skip over it here. The Android SDK documentation has directions\
    \ for the industrious among you who want to roll your very own from scratch. However,\
    \ even if you plan to extend an Android view, you must create a new class that\
    \ extends the existing view. Here's how you'd go about it.\n\n### DECLARING THE\
    \ NEW CLASS\n\nThe first step in declaring a custom view is to create the class.\
    \ Android allows you to subclass any of its existing UI objects simply by extending\
    \ an existing class. The declaration looks like this:\n\n```java\npublic class\
    \ CustomTextView extends TextView{\n    public CustomTextView(Context context)\
    \ {\n        super(context);\n    }\n}\n```\n\nThat's all it takes to create a\
    \ custom text view. However, since there's about as much custom in this custom\
    \ text view as there is beef in fast-food tacos, I'll add something simple to\
    \ set it apart.\n\n### EXTENDING A VIEW\n\nAlthough Android's layouts and views\
    \ are powerful and versatile, there are times when they just won't do exactly\
    \ what you want. Fortunately, their functionality is easy to extend. To demonstrate,\
    \ I've written a custom text view that changes the color of every letter in the\
    \ text to be displayed onscreen. While this isn't the most practical use case,\
    \ it will show how simple it is to implement your own behavior.\n\n### CUSTOMIZING\
    \ AN EXTENDED VIEW\n\nYou'd be amazed at how much code it takes to correctly render\
    \ text to the screen. Android's TextView.java class is nearly 5000 lines of code.\
    \ But thanks to the ability to extend a class, you can use all the complex layout\
    \ code and customize only the part that appeals to you. In this example, I catch\
    \ the text as it changes and add a new ForegroundColorSpan for each letter in\
    \ the new string. First, I declare an array of colors.\n\n```java\npublic class\
    \ CustomTextView extends TextView{\n    int colorArray[] = new int[]{Color.WHITE,\n\
    \            Color.RED,\n            Color.YELLOW,\n            Color.GREEN,\n\
    \            Color.BLUE,\n            Color.MAGENTA,\n            Color.CYAN,\n\
    \            Color.DKGRAY};\n```\n\nNow, each time the text changes, I add a new\
    \ ForegroundColorSpan for each letter.\n\n```java\nprotected void onTextChanged(CharSequence\
    \ text,\n        int start, int before, int after )\n{\n    //Keep the view from\
    \ getting into an infinite loop\n    if(selfChange){\n        selfChange = false;\n\
    \        return;\n    }\n    selfChange=true;\n}\n```\n\nI make sure I don't get\
    \ stuck in an infinite loop (with the change in color triggering another onTextChanged\
    \ call, which changes the color again, which changes the color...you get the idea).\
    \ Next comes the code that changes the colors:\n\n```java\nSpannableStringBuilder\
    \ builder = new SpannableStringBuilder(text);\nbuilder.clearSpans();\nForegroundColorSpan\
    \ colorSpan;\nint color;\nfor(int i=0; i < text.length(); i++){\n    //pick the\
    \ next color\n    color = colorArray[i%colorArray.length];\n    //Create the color\
    \ span\n    colorSpan = new ForegroundColorSpan(color);\n    //Add the color span\
    \ for this one char\n    builder.setSpan(colorSpan,\n            i, i,\n     \
    \       Spannable.SPAN_EXCLUSIVE_EXCLUSIVE);\n}\nsetText(builder);\n```\n\nAgain,\
    \ not very complex, but then neither is extending an existing view class. Also,\
    \ be warned that this code will clear any formatting that may have already been\
    \ set on the text. (At this point, don’t stress too much about what spans and\
    \ SpannableStringBuilders work. In short, they’re blocks of formatting that you\
    \ can drop over strings. Check the Android SDK documentation for more info.) If\
    \ you’re looking for a coding challenge, try creating an array with every possible\
    \ RGB hex color value and cycling through that array.\n\n### USING YOUR EXTENDED\
    \ VIEW\n\nJust as with any other Android view, you can create a new instance of\
    \ it at runtime in your Java code or pre-declare it in your XML layout file. Here’s\
    \ how you can use it in your activity:\n\n```java\npublic void onCreate(Bundle\
    \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    CustomTextView\
    \ customView = new CustomTextView(this);\n    customView.setText(\"Hello There!\"\
    );\n    setContentView(customView);\n}\n```\n\nThere’s nothing you haven't seen\
    \ before going on here. I’m creating a new instance of my view, setting the text\
    \ for it, and then setting it as the main view for my activity. You could also\
    \ put it inside a layout with other views. It’s also possible to add this custom\
    \ view to an XML-described layout. But before you can start declaring your custom\
    \ view in an XML file, you need to create the full suite of View constructors.\
    \ Your custom view should look something like this:\n\n```java\npublic class CustomTextView\
    \ extends TextView{\n    public CustomTextView(Context context,\n            \
    \              AttributeSet attributeSet,\n                          int defStyle)\n\
    \    {\n        super(context, attributeSet, defStyle);\n    }\n\n    public CustomTextView(Context\
    \ context,\n                          AttributeSet attributeSet)\n    {\n    \
    \    super(context, attributeSet);\n    }\n\n    public CustomTextView(Context\
    \ context){\n        super(context);\n    }\n    //Rest of the class omitted for\
    \ brevity\n}\n```\n\nWhen Android parses your XML layout and creates your view,\
    \ it needs to pass an attribute set to the constructor because this contains all\
    \ the layout information, text, and whatever else you've added that starts with\
    \ android. If you forget to add these, everything will compile, but it will show\
    \ the Unexpected Force Close window of doom when you try to draw the screen.\n\
    \nNow that you have the correct constructors, it's possible to create and lay\
    \ out your custom view within XML. In the code to follow, I've added a single\
    \ instance of the rainbow animating custom text display.\n\n```xml\n<?xml version=\"\
    1.0\" encoding=\"utf-8\"?>\n<LinearLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\
    \n    android:orientation=\"vertical\"\n    android:layout_width=\"fill_parent\"\
    \n    android:layout_height=\"fill_parent\"\n    >\n    <com.haseman.ui.CustomTextView\n\
    \        android:layout_width=\"wrap_content\"\n        android:layout_height=\"\
    wrap_content\"\n        android:text=\"See how the colors change!\"\n        />\n\
    ```\n"
