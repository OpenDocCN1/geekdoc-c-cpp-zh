    FIGURE 5.2 The Twitter feed of Peachpit Press. Now in color!\n\n```xml\nandroid:id=\"\
    @+id/text_one\"\n    android:layout_width=\"match_parent\"\n    android:layout_height=\"\
    wrap_content\"\n    android:padding=\"6dp\"/>\n<TextView\n    android:id=\"@+id/text_two\"\
    \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"wrap_content\"\
    \n    android:padding=\"6dp\"/>\n</LinearLayout>\n```\n\nWith this layout, you\
    \ now have all the moving pieces you need to download, parse, and display a Twitter\
    \ feed. Figure 5.2, at last, is what Peachpit’s Twitter feed looks like in ListView\
    \ form.\n\n## HOW DO THESE OBJECTS INTERACT?\n\nTo understand how the ListView\
    \ interacts with the Adapter, there are a few constraints you must understand.\
    \ First, lists could scroll on to infinity, at least from the point of view of\
    \ the device. Yet, as you might have guessed, the phone has a limited amount of\
    \ memory. This means that not every single list item can have its own entry in\
    \ the list, because the device would quickly run out of space. Further, if the\
    \ ListView had to lay out every single row right up front, it could be bogged\
    \ down for an unacceptable amount of time.\n\nWhat Android does to solve these\
    \ problems is to recycle list element rows. The process looks a little bit like\
    \ this:\n\n- 1. Android goes through the entire list, asking each row how large\
    \ it would like to be (this is so it knows how large to draw the scroll indicator).\n\
    - 2. Once it knows roughly how big the entire ListView will be, it then requests\
    \ views for the first screen, plus a buffer (so it won't have to stop and get\
    \ more when the user starts scrolling). Your adapter will have to create, configure,\
    \ and return those views as the ListView calls getView over and over again.\n\
    - 3. As the user scrolls down and rows fall off the top of the list, Android will\
    \ return them to you when it calls getView. Effectively, it's asking you to reuse\
    \ a previous view by passing in the convertView object to you.\n\nWhile recycling\
    \ list element rows is great for conserving memory and speeding up long lists,\
    \ it has some interesting side effects.\n\n- All your list views, in order to\
    \ take advantage of the built-in recycling, must always inflate from the same\
    \ row layout. Android won't know what type of list item you'll want to create;\
    \ so if you had, for example, three different row layouts, the system would not\
    \ know which one to pass back to you, and you'd have to handle your own pools\
    \ of unused views.\n- Any asynchronous task, such as loading an icon from disk\
    \ or loading a user's profile icon, must check that the ListView hasn't recycled\
    \ the view while it's been downloading or loading the image data. If the row is\
    \ still showing the same data when the task finishes, it's safe to update the\
    \ row; otherwise, it needs to cache or chuck the data.\n\n## WRAPPING UP\n\nThis\
    \ chapter covered the basics of both simple and custom ListViews and Adapters.\
    \ I showed you how to create a simple main menu, and I walked you through a simple\
    \ example of building a custom Adapter to handle a more complex ListView. You\
    \ now have a grasp of the basics.\n\nLists are still one of the cornerstones of\
    \ mobile development. I advise you, however, to make as few boring, graphically\
    \ flat lists as you possibly can. While these examples are great for showing you\
    \ how to build lists of your own, they are by no means shining examples of solid\
    \ interface design. You can, and very much should, make lists when needed, but\
    \ dress them up as much as you can without affecting performance.\n\nIf you're\
    \ hungering for more, I highly suggest reading through Android's implementation\
    \ of ListActivity.java. Because Android is open source, you can get all the code\
    \ that makes up its SDK for free! Head over to http://source.android.com for more\
    \ information.\n\nLastly, I wrote more code for this chapter than I had space\
    \ to explain here. I recommend checking out the sample code associated with this\
    \ chapter (at Peachpit.com/androiddevelopanddesign) to learn more about launching\
    \ a screen as the result of a menu click and about how to build a similar main\
    \ menu screen using a ListFragment.\n\n## 6 THE WAY OF THE SERVICE\n\n![](img/47ad0ac10bf11125744ef22c945d3099_162_0.png)\n\
    \nServices are one of the most important, and often under-utilized, components\
    \ of the Android platform. They are essential for accomplishing any task whose\
    \ data or relevance can span more than one activity. They are like activities\
    \ in that they have a lifecycle (albeit a much simpler one), but they do not have\
    \ the activity’s ability to draw to the screen. In practice, services break down\
    \ into two major use cases: the listener and the task. Listeners are services\
    \ that hang out in the background, waiting for something to happen that prompts\
    \ them to take action. Task services are akin to the photo downloader that we\
    \ covered before, so in this chapter I’ll focus on listening services.\n\n## WHAT\
    \ IS A SERVICE?\n\nA Service is, at its most basic level, a class with a simple\
    \ runtime lifecycle and no access to the screen. You had some contact with the\
    \ `IntentService` back in Chapter 4 when I showed you how to retrieve an image\
    \ with it, but I now have the chance to help you really dig into this simple yet\
    \ powerful component.\n\nKeep in mind that while the service might be important\
    \ to you, it is not more important to Android than the smooth running of the overall\
    \ device. This means that at any point the system may shut down your service if\
    \ it determines that it's been running too long, that it's been consuming too\
    \ many resources, or that it's the third Friday of the month and there's a full\
    \ moon. There is a way to tell the system not to kill you off, and I'll show what\
    \ that looks like in just a second.\n\n### THE SERVICE LIFECYCLE\n\nA service\
    \ is, essentially, a singleton. Any component in your application may call `startService`\
    \ with an intent that specifies the service they want to get running. If the service\
    \ isn't running, Android will initialize a new one; otherwise, it will just notify\
    \ the existing one that a new start command has been issued. Here's a brief rundown\
    \ of the service's lifecycle.\n\n- `onCreate` is called on the main thread when\
    \ the service is started up. It's a good time to initialize any data you're going\
    \ to rely on throughout the run of the service.\n- `onStartCommand` will be called\
    \ every time an activity (or any other component) calls `startService`. The intent\
    \ passed into `startService` will be handed off to your `onStartCommand` call.\n\
    - `onBind` is your chance to return, to the caller, an interface object that allows\
    \ direct method calls on the service. The binder, however, is optional and only\
    \ really needed for a heavy level of communication with your service. This results\
    \ in a different method of interaction than calling `Context.startService`. Like\
    \ `startService`, `bindService` takes an intent and will start up the service\
    \ if it's not already running. If absolutely none of what I just wrote makes sense,\
    \ that's fine; it'll make much more sense to you by the end of the chapter.\n\n\
    At this point in the lifecycle, your service is now happily running along. Music\
    \ can be played, data can be acquired (remember the main thread!), and recordings\
    \ can be made and crunched for voice commands.\n"
