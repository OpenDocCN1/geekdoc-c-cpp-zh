    ## 引言


    如果你有一个关于应用的绝妙想法，迫不及待地想分享，或者如果你认识到了 Android 平台的能力与可能性，那么你来对地方了。这是一本关于一个宏大主题的短书。


    我无意一上来就吓到任何人，但让我实话实说：Android 开发很难。它的架构与许多现有平台（尤其是其他移动 SDK）不同，初学者容易掉进许多陷阱，而且文档往好里说也常常很稀疏。然而，作为对其难度的回报，Google
    的 Android 为那些敢于为它开发的人提供了前所未有的强大能力、控制力，以及——没错——责任感。


    这就是我的工作所在。我的任务就是让学习编写出色 Android 软件的过程尽可能简单。


    我有什么资格向你提出这些要求？我已经以专业身份编写移动软件超过八年，其中三年一直在为 Android 开发软件。我编写的代码运行在世界各地数百万部手机上。另外，我留着胡子。我们都知道，面部毛发浓密的人似乎在所有话题上都更有权威。


    为了让这个学习过程尽可能轻松，我有几个要求：


    - **你有一台电脑。** 我三年级的老师教导我，永远不要把任何事视为理所当然；也许你*并没有*电脑。如果你还没有电脑，你会需要一台——最好是一台速度快的电脑，因为
    Android 模拟器和 Eclipse 很快会消耗大量资源。


    > **注意：** Android 是一个机会均等的开发平台。虽然我个人在 Mac 上开发，但你可以使用三大主流平台（Mac、PC 或 Linux）中的任意一个。


    - **你能够流利使用 Java。** 注意，我说的是*流利*，而不是*专家*。因为你将编写可用的应用程序（而不是生产库，至少一开始是这样），所以我期望你了解类和接口之间的区别。你应当能够面不改色地处理线程和并发。此外，你对底层发生的事情（就对象创建和垃圾回收而言）了解得越多，你的移动应用就会越快、越好。


    是的，即使你对 Java 编程语言了解不多，也能读完本书，甚至拼凑出基础应用程序。


    ![](img/47ad0ac10bf11125744ef22c945d3099_12_0.png)


    ## 欢迎使用 Android


    Eclipse 和 Android SDK 是你跟随本书示例时将使用的两大工具。不过，还有几种其他工具你应该了解，它们现在以及你未来从事 Android 工作时都会非常有用。虽然你可能直到准备发布应用时才会用到所有这些工具，但在需要时了解它们会很有帮助。


    ### 工具


    在本书中，你将使用几种工具，它们会让你的 Google Android 开发生活轻松得多。以下工具排名不分先后：


    ![](img/47ad0ac10bf11125744ef22c945d3099_15_0.png)


    #### Eclipse


    Eclipse 是我在本书中全程使用的主要工具。Google 已将其定为 Android 开发的主要 IDE，并发布了辅助插件。一定要安装这些插件，因为它们能让你在创建项目和在设备上逐步调试应用时免去所有痛苦。也欢迎你使用
    Eclipse；或者，如果你是个命令行爱好者，也可以按自己的喜好用 Vim 或 Emacs 跟着做。


    ![](img/47ad0ac10bf11125744ef22c945d3099_15_1.png)


    #### Android SDK


    Android SDK 包含从命令行开发 Android 应用所需的所有工具，以及其他可帮助你查找和诊断问题、精简应用的工具。你可以从 http://developer.android.com/sdk/index.html
    下载 Android SDK。


    ![](img/47ad0ac10bf11125744ef22c945d3099_16_0.png)


    #### Android SDK Manager


    Android SDK Manager（位于 SDK 的 tools/ 目录中）将帮助你下载 SDK 的所有版本，以及大量工具、第三方附加组件和各种 Android
    相关事物。这将是你从位于加利福尼亚州山景城的 Google 总部获取新软件的主要方式。


    ![](img/47ad0ac10bf11125744ef22c945d3099_16_1.png)


    #### Hierarchy Viewer


    当你构建和调试应用时，这个工具将帮助你追踪布局与视图之间的复杂连接。在追踪那些难以理解的布局问题时，这个查看器可能不可或缺。你可以在 SDK 的 tools/
    目录中找到这个名为 hierarchyviewer 的工具。


    ![](img/47ad0ac10bf11125744ef22c945d3099_16_2.png)


    #### DDMS


    DDMS（Dalvik Debug Monitor Server）是你与 Android 设备交互并进行调试的主要方式。你会在 Android SDK 内的
    tools/ 目录中找到它。它能做各种事情，从收集日志、发送模拟文本消息或位置、映射内存分配，到截取屏幕截图。Eclipse 用户有一个透视图，可在 Eclipse
    内复制这个独立应用提供的所有功能。这个工具堪称你 Android 工具包中的瑞士军刀。


    ## 1 开始使用 Android


    首先，你需要下载几个软件工具——即 Android SDK、Eclipse 集成开发环境（IDE）以及适用于 Eclipse 的 Android 插件。开发者制作
    Android 应用还可以使用许多其他工具，但我发现这套配置麻烦最少，能让你用最少的时间上手运行。


    ### Android 软件开发工具包


    请前往 Android Developers 网站：http://developer.android.com。在这个平台上工作时，你会逐渐对这些页面了如指掌。进入网站后，找到标有
    SDK 的部分，然后尽情下载其中提供的文件。在 Windows 上，最好使用提供的安装程序。对于 Mac 和 Linux 用户，你会得到一个 zip 文件。让相应文件开始下载，并在它们完成前继续往下做。


    ### Eclipse


    对于 3.5 以上的 Eclipse 版本，Google 建议你获取该 IDE 的经典版本。一路点击进入 www.eclipse.org/downloads，找到
    Eclipse Classic。（本章截图来自 3.6.1；不过最新版本是 3.7.1。）请确保获取适合你系统的版本：32 位或 64 位。现在，准备好闲转大拇指，等待安装程序下载完成吧。假设你不是通过一条会发出嘶嘶声的电话线连接，你应该只需几分钟就能完成。


    在此期间，我会用一部关于小猫天性的歌剧来娱乐你……等等，不，我不会。在下载所需文件时，欢迎你提前翻阅本书。


    ### Java


    你需要在系统上下载并安装 Java（取决于你之前做过多少开发，你可能已经安装过它）。我假定你在深入本书之前已经熟悉 Java；我还假定你能够自行安装 JDK。


    此时，过程会变得稍微复杂一些，一群猫开始向不同方向游荡。根据你所运行平台的不同，你可能需要不时跳过一些内容。如果标题看起来不适用于你的操作系统（OS），就往后跳到适用的部分。请耐心一点；你很快就能开发你的第一个应用。


    > **注意：** 在本书中，我将假定你会使用 Eclipse IDE 完成大部分开发工作。对于所有重要命令和任务，我会尽量同时提供命令行方法和 Eclipse
    截图，以防你正用 Vim 或 Emacs 玩转终端。


    ![](img/47ad0ac10bf11125744ef22c945d3099_20_0.png)


    #### 安装 Eclipse


    大体上，安装 Eclipse 就像解压你下载的文件，并把该应用放到一个你记得住的位置一样简单。我建议先不要启动 Eclipse。等你把 Android SDK
    配置妥当后再说（见下一节）。你可能还想确保最新的开发工具已经就位。


    #### 安装 Android SDK


    现在 Eclipse 已就位，你离运行自己的 Android 应用只差几步。找到适用于你的操作系统的部分，并按照其中的步骤操作。


    #### 为 Mac 用户安装 SDK


    要安装 SDK，只需解压你从 Android Developers 网站（developer.android.com）下载的压缩文件。虽然你可以将该文件解压到任何位置，但我建议把它放在
    `/Users/yourUserName/Documents/android_sdk/`。


    如果你是命令行用户，应该将两个目录加入你的路径，如下所示：


    - 1. 导航到 `/Users/yourUserName/.profile`。

