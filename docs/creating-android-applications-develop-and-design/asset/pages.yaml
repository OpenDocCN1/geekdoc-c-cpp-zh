- pgno: 104
  md: "![](img/47ad0ac10bf11125744ef22c945d3099_104_0.png)\n\n**FIGURE 3.8** That's\
    \ much better!\n\n![](img/47ad0ac10bf11125744ef22c945d3099_104_1.png)\n\n**FIGURE\
    \ 3.9** Check back in on portrait mode\n\nWhile you don't want the buttons to\
    \ get too large, you still need to give them a bit more space than exactly what\
    \ fits around the text. Let's try .25 for a weight. I've pulled out all non-layout_weight\
    \ lines for brevity:\n\n```\n```xml\n<LinearLayout>\n    <Button\n        android:layout_weight=\"\
    .25\"\n        />\n    <TextView\n        android:layout_weight=\"1\"\n      \
    \  />\n    <Button\n        android:layout_weight=\".25\"\n        />\n</LinearLayout>\n\
    ```\n```\n\nFigure 3.8 shows how that looks in landscape mode.\n\nThe result is\
    \ much more reasonable. But to be sure, check what the bar looks like in portrait\
    \ mode. Figure 3.9 shows the result.\n\nPerhaps the Next and Prev buttons could\
    \ be a little bit larger in portrait mode, but this result is more than acceptable.\
    \ They're not huge, they don't look crowded, and they should be big enough even\
    \ for large fingers to hit.\n\nIn the end, nothing beats the LinearLayouts for\
    \ easily handling different dynamic screen sizes. Throw as much into one as you\
    \ please, and it'll try to accommodate everything. There are, however, two major\
    \ issues to watch out for. First, because they can orient themselves in only one\
    \ direction, you may end up needing a lot of them to handle a complex layout,\
    \ which can slow drawing performance significantly. Second, getting a complex\
    \ screen to render exactly as your designer wants it to can be an intensive process.\
    \ For more complex or busy screens and objects, you're much better off using a\
    \ RelativeLayout."
