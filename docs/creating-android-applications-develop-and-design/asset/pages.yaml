- pgno: 73
  md: "to appear after R. string for the system to locate your resource. You'll learn\
    \ much more about resource management in the next section.\n\nLast, I need to\
    \ add the new TextView into the LinearLayout and then return the LinearLayout\
    \ so it can be set as the main content view for the activity. Once that's finished,\
    \ I have a layout constructed at runtime with Java code, which identically matches\
    \ the layout provided by the system in XML form.\n\nThe Java code looks fairly\
    \ straightforward, but XML is a much better idea for working with the layout.\
    \ Using XML, you can use Android's resource management system and give non-software\
    \ engineers the ability to modify the application UI.\n\n# ALTERING THE UI AT\
    \ RUNTIME\n\nIt's one thing to use XML or Java to define the pile of views that\
    \ compose your user interface. But particularly in the XML case, you'll want to\
    \ be able to retrieve and alter views with data acquired over the network, from\
    \ the user, or from any other information source. Android provides a simple method\
    \ for gaining access to the views that currently compose your screens by calling\
    \ findViewById, which is an Activity class method.\n\n# IDENTIFYING YOUR VIEWS\n\
    \nBefore you can find one of your views at runtime, you'll need to give it an\
    \ ID. Once you've called setContentView on an activity, you can call findViewById\
    \ to retrieve your views and then alter them. This process should look at least\
    \ a little bit familiar, because you saw it in the previous chapter. Here's what\
    \ it looks like in XML:\n\n```\n<TextView\n    android:id=\"@+id/text_holder\"\
    \n    android:layout_width=\"fill_parent\"\n    android:layout_height=\"wrap_content\"\
    \n    android:text=\"@string/hello\"\n    />\n```"
  merge: -1
  img_proc: true
- pgno: 74
  md: "In this case, I've added an android:id line to name the TextView. The @+ notation\
    \ tells Android that rather than referring to a view, you'd like to create an\
    \ ID for the view. The first reference to any ID must start with @+id. Subsequent\
    \ references to that ID will start simply with @id.\n\nAndroid keeps its own reserved\
    \ IDs name-space. For example, if you're creating a layout to be used by ListActivity\
    \ (an activity specifically designed to show lists of information), you'll want\
    \ to set the ID on your main onscreen ListView to \"android:id=\"@id/android:list\"\
    \". These well-known IDs allow Android's system code to correctly find and interact\
    \ with the list view that you specify. I'll provide you with more on this subject\
    \ in Chapter 5, which covers list creation and management.\n\nIf you're creating\
    \ a view at runtime, simply call setId and pass in an integer, and you'll be able\
    \ to retrieve it later.\n\n# FINDING YOUR RESOURCES WITH ANDROID\n\nWhen Android\
    \ compiles your project, it assigns a number value for your new static numeric\
    \ ID. It places this new ID in the R.java file within your project. This file\
    \ is your gateway to everything you've defined inside the res folder. For every\
    \ layout, drawable, and identified view—and for a host of other things—Android\
    \ places a subsequent statically defined int into the R file that identifies those\
    \ things. Anytime you add a line to your layout XML defining a new ID (for example,\
    \ android:id=\"@+id/my_new_id\"), you'll find that after the next time you compile\
    \ your project, you'll have an entry in the R.id class. In the previous example,\
    \ this entry would be R.id.my_new_id.\n\n# RETRIEVING A VIEW\n\nGetting the existing\
    \ instance of an Android view is as simple as calling findViewById and passing\
    \ in the ID value found in the R.java file. Given the earlier XML example, here's\
    \ how you would grab an instance of the text view and modify its contents.\n\n\
    ```\n```java\npublic void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
    \    setContentView(R.layout.main);\n    TextView tv = (TextView)findViewById(R.id.text_holder);\n\
    \    if(tv!=null)\n        tv.setText(R.string.hello);\n}\n```\n```"
