- pgno: 125
  md: "# BEWARE LOADING DIALOGS\n\nRemember that mobile applications are not like\
    \ their web or desktop counterparts. Your users will typically be using their\
    \ phones when they’re away from a conventional computer. This means, usually,\
    \ that they’re already waiting for something: a bus, that cup of expensive coffee,\
    \ their friend to come back from the bathroom, or a boring meeting to end. It’s\
    \ very important, therefore, to keep them from having to wait on anything within\
    \ your application. Waiting for your mobile application to connect while you’re\
    \ already waiting for something else can be a frustrating experience. Do what\
    \ you can to limit users’ exposure to full-screen loading dialogs. They’re unavoidable\
    \ sometimes, but minimize them whenever possible.\n\n# SHOWING YOUR PROGRESS\n\
    \nThere’s another aspect of the AsyncTask that you should be aware of even though\
    \ I haven’t demonstrated it. From within doInBackground, you can send progress\
    \ updates to the user interface. doInBackground isn’t on the main thread, so if\
    \ you’d like to update a progress bar or change the state of something on the\
    \ screen, you’ll have to get back on the main thread to make the change.\n\nWithin\
    \ the AsyncTask, you can do this during the doInBackground method by calling publishProgress\
    \ and passing in any number of objects deriving from the second class in the AsyncTask\
    \ declaration (in the case of this example, an integer). Android will then, on\
    \ the main thread, call your declared onProgressUpdate method and hand over any\
    \ classes you passed to publishProgress. Here’s what the method looks like in\
    \ the AsyncTask example:\n\n```\n```java\nprotected void onProgressUpdate(Integer...\
    \ params){\n    //Update a progress bar here, or ignore it, it's up to you\n}\n\
    ```\n```\n\nAs always, be careful when doing UI updates, because if the activity\
    \ isn’t currently onscreen or has been destroyed, you could run into some trouble."
  merge: -1
  img_proc: true
- pgno: 126
  md: "# ## ONPOSTEXECUTE\n\nThe work has been finished or, in the example, the image\
    \ has been downloaded. It's time to update the screen with what I've acquired.\
    \ At the end of doInBackground, if successful, I return a loaded bitmap to the\
    \ AsyncTask. Now Android will switch to the main thread and call onPostExecute,\
    \ passing the class I returned at the end of doInBackground. Here's what the code\
    \ for that method looks like:\n\n```\n```java\nprotected void onPostExecute(Bitmap\
    \ img){\n    ImageView iv = (ImageView)findViewById(R.id.remote_image);\n    if(iv!=null\
    \ && img!=null){\n        iv.setImageBitmap(img);\n    }\n}\n```\n```\n\nI take\
    \ the bitmap downloaded from the website, retrieve the image view into which it's\
    \ going to be loaded, and set it as that view's bitmap to be rendered. There's\
    \ an error case I haven't correctly handled here. Take a second to look back at\
    \ the original code and see if you can spot it.\n\n# ## A FEW IMPORTANT CAVEATS\n\
    \nTypically, an AsyncTask is started from within an activity. However, you must\
    \ remember that activities can have short life spans. Recall that, by default,\
    \ Android destroys and re-creates any activity each time you rotate the screen.\
    \ Android will also destroy your activity when the user backs out of it. You might\
    \ reasonably ask, “If I start an AsyncTask from within an activity and then that\
    \ activity is destroyed, what happens?” You guessed it: very bad things. Trying\
    \ to draw to an activity that's already been removed from the screen can cause\
    \ all manner of havoc (usually in the form of unhandled exceptions).\n\nIt's a\
    \ good idea to keep track of any AsyncTasks you've started, and when the activity's\
    \ onDestroy method is called, make sure to call cancel on any lingering AsyncTask.\n\
    \nThere are a few cases in which the AsyncTask is perfect for the job:\n\n+  \
    \ - Downloading small amounts of data specific to one particular activity\n+ \
    \  - Loading files from an external storage drive (usually an SD card)"
  merge: -1
  img_proc: true
- pgno: 127
  md: "Make sure, basically, that the data you’re moving with the AsyncTask pertains\
    \ to only one activity, because your task generally shouldn’t span more than one.\
    \ You can pass it between activities if the screen has been rotated, but this\
    \ can be tricky. There are a few cases when it’s not a good idea to use an AsyncTask:\n\
    \n+   - Any acquired data that may pertain to more than one activity shouldn’t\
    \ be acquired through an AsyncTask. Both an image that might be shown on more\
    \ than one screen and a list of messages in a Twitter application, for example,\
    \ would have relevance outside a single activity.\n+   \n+   - Data to be posted\
    \ to a web service is also a bad idea to put on an AsyncTask for the following\
    \ reason: Users will want to fire off a post (posting a photo, blog, tweet, or\
    \ other data) and do something else, rather than waiting for a progress bar to\
    \ clear. By using an AsyncTask, you’re forcing them to wait around for the posting\
    \ activity to finish.\n+   \n+   - Last, be aware that there is some overhead\
    \ for the system in setting up the AsyncTask. This is fine if you use a few of\
    \ them, but it may start to slow down your main thread if you’re firing off hundreds\
    \ of them.\n\nYou might be curious as to exactly what you should use in these\
    \ cases. I’m glad you are, because that’s exactly what I’d like to show you next."
