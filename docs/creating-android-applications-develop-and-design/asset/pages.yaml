- pgno: 153
  md: 'Again, if you’re struggling with how to fetch the data at the end of a URL
    and turn that data into a string full of JSON, check the included sample code
    for the contents of `getTwitterFeed`. Here are the general steps for fetching
    the data:


    +   1. Create a JSON array from the string that was fed back to you in `getTwitterFeed`.
    This will parse the data, which you then return at the end of the `doInBackground`
    method.

    +   2. Once you’re back on the main thread inside the `onPostExecute` method,
    it’s time to pass the JSON array to the custom adapter (which I promise to show
    you in just a second). Updating the data will trigger a redraw of the list view.

    +   3. Hide the initial “Loading…” `TextView` that I defined in the XML layout
    file, and show the list instead.


    > **NOTE:** Any changes to the Adapter’s data must take place on the main thread.
    Modifying the Adapter data counts as changing the UI, as far as Android is concerned.
    As always, all changes to the user interface must be carried out on the main thread.
    Keep this in mind as you create your own adapter, especially if you’re fetching
    data from the network off the main thread.


    ![](img/47ad0ac10bf11125744ef22c945d3099_153_0.png)


    # MAKING A CUSTOM ADAPTER


    All right, now comes the really interesting part. You need to create a custom
    Adapter to feed rows into the ListView.


    Custom Adapters have four methods you are required to override, all of which allow
    the ListView to acquire information about your data set.


    +   - `getCount()` returns the number of rows currently in the set of information.

    +   - `getItem(int position)` returns an object corresponding to a particular
    row position.

    +   - `getItemId(int position)` returns the ID that corresponds to the item at
    a specific position. This is used often with adapters that focus on Cursors (Android’s
    SQLite interfaces).'
  merge: -1
  img_proc: true
- pgno: 154
  md: "+   * getView(int position, View convertView, ViewGroup parent) is where most\
    \ of the Adapter's work will take place. The ListView, in making this call, is\
    \ essentially asking for the view at position. You must, in this method, return\
    \ a correctly configured view for the data at position. More on exactly how this\
    \ works in a minute.\n\nAs you can see by the get prefix on all the required methods,\
    \ all that Android Adapters do is provide row content information to the ListView.\
    \ The ListView, it would seem, is one very needy girlfriend (or boyfriend...I'm\
    \ not sure how to assign gender to Android UI interfaces).\n\nLet me show you\
    \ the example before I talk about any more theory. Twitter's API returns its information\
    \ in the form of JSON-encoded objects. It doesn't, at this point, make sense to\
    \ translate it to some other data store, so I'll design my custom adapter to use\
    \ a JSONArray object as its data backer. This class is declared as an inner class\
    \ definition in ListActivity.\n\n```\n```java\nprivate class TwitterJSONAdapter\
    \ extends BaseAdapter {\n    JSONArray data;\n    //Must be called on the main\
    \ thread\n    private void setData(JSONArray data){\n        this.data = data;\n\
    \        this.notifyDataSetChanged();\n    }\n    @Override\n    public int getCount()\
    \ {\n        if(data==null)\n            return 0;\n        else\n           \
    \ return data.length();\n    }\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 155
  md: "```\n```java\n@Override\npublic Object getItem(int position) {\n    if(data==null)\n\
    \        return null;\n    try{\n        JSONObject element = (JSONObject)data.get(position);\n\
    \        return element;\n    }catch(Exception e){\n        return null;\n   \
    \ }\n}\n@Override\npublic long getItemId(int position) {\n    return position;\n\
