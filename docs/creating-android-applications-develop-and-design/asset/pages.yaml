- pgno: 226
  md: "# FINDING A GOOD SUPPLIER\n\nYour first step in using the location service,\
    \ after you've added the permission of course, is finding a good supplier. Each\
    \ device could have several different location services beyond the time- and power-consuming\
    \ GPS system. Android allows you to specify criteria for the eventual provider\
    \ you'll use. You do this by building a list of features you'd like and then asking\
    \ Android for the one that best suits your needs. Here's a rather idealistic example\
    \ I've put together using the getBestProvider method:\n\n```\nprivate String getBestProvider(LocationManager\
    \ locationManager){\n    Criteria criteria = new Criteria();\n    criteria.setAccuracy(Criteria.ACCURACY_COARSE);\n\
    \    criteria.setPowerRequirement(Criteria.POWER_LOW);\n    criteria.setCostAllowed(false);\n\
    return locationManager.getBestProvider(criteria, true);\n}\n```\n\nBefore calling\
    \ the getBestProvider method, you'll need to obtain a Location Manager object,\
    \ which you can do with the following code:\n\n```\nlocationManager = (LocationManager)getSystemService\n\
    \    (Context.LOCATION_SERVICE);\n```\n\nTypically, I'll stash this pointer away\
    \ somewhere so I never have to find it again.\n\n# GETTING THE GOODS\n\nOnce you've\
    \ received the string ID for your ideal provider, you can register and start receiving\
    \ location updates from the provider. Here's the code to register for updates:\n\
    \n```\nlocationManager.requestLocationUpdates(provider, 60000, 1000, this);\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 227
  md: "Calling this requestLocationUpdates method (which you'll need to define) will\
    \ result in the onLocationChanged method being invoked every time the user's location\
    \ is changed according to the criteria you set. Along with the provider string,\
    \ you'll need to tell the system the minimum time between updates (in my case,\
    \ 60 seconds—the documentation suggests not having it poll any faster than that),\
    \ the minimum distance between intervals (in my case, 1000 meters), and the object\
    \ that implements the LocationListener interface you want to receive callbacks.\
    \ Here are the methods you're required to override:\n\n```\npublic void onLocationChanged(final\
    \ Location location) {}\n@Override\npublic void onProviderDisabled(String provider)\
    \ {}\n@Override\npublic void onProviderEnabled(String provider) {}\n@Override\n\
    public void onStatusChanged(String provider, int status,\n    Bundle extras) {}\n\
    ```\n\nThe method I'm most interested in, in this case, is the onLocationChanged\
    \ method. It will pass me that all-important location object. With that data,\
    \ I can then call getLatitude and getLongitude. And with that, I know—with as\
    \ much accuracy as possible—where in the world the device is.\n\nFurther, the\
    \ LocationManager object contains an important static helper method called distanceBetween\
    \ that will calculate the distance between geographic points. I point out this\
    \ helper because I find myself using it all the time."
  merge: -1
  img_proc: true
- pgno: 228
  md: '# THE SNEAKY SHORTCUT


    It can sometimes take many seconds for the location manager to spit out a user’s
    location. There’s a solution you can take advantage of to at least display an
    old value while the real location is being determined. You can, either before
    or after registering your listener, call getLastKnownLocation on your provider.
    This can provide some interesting results (especially if the device has spent
    a long time aloft in an airplane without an Internet connection), but it can often
    give the user something to look at or laugh at while you find their real location.
    You must, however, have defined the fine location permission to use this trick.


    # THAT’S IT!


    As much as I would like to say that this is an incredibly complex operation, it’s
    about as hard as tying your shoelaces. Given what you’ve been through up to this
    point, getting the location from the LocationManager should be a cakewalk. That
    said, I had my fair share of issues in writing the code for this chapter. If you
    are stumped, check the documentation and press on!'
  merge: -1
  img_proc: true
- pgno: 229
  md: '![](img/47ad0ac10bf11125744ef22c945d3099_229_0.png)


    **FIGURE 9.1** Although strange, this is how your Android settings should look.


    Determining your user''s location is one thing, but actually putting those two
    indecipherable numbers (longitude and latitude) into context is where software
    gets a little more complex. Interestingly enough, the configuration needed to
    get a map onscreen is far more complex than the code to manipulate it. So, let''s
    get started. If you want to follow along, go ahead and create a new Android project,
    and we''ll start from there.


    # ## GETTING THE LIBRARY


    The MapActivity and MapView are two classes available only in Google''s API superset
    (APIs) of the Android SDK. In order to have access to them, you''ll need to declare
    that your application uses the Google APIs library. You''ll need to download this
    super-library (the same way you got the Ice Cream Sandwich and Gingerbread SDKs
    back in Chapter 1). Figure 9.1 shows what the settings screen for your project
    should look like if you''ve got it dialed in correctly.


    Once you''ve set up your SDK values correctly, there are a few things in the manifest
    I need to talk with you about.


    # ## ADDING TO THE MANIFEST


    There are two critical things that, through the manifest, you need to tell the
    system. The first is that your application uses the Google Maps library. The second
    is that you need permission to access the Internet. While you will not have to
    call anything directly to get online, the map view will. Here''s what the tail
    end of your manifest should look like with these two additions:'
  merge: -1
  img_proc: true
