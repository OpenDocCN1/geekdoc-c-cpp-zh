- pgno: 215
  md: "# A NOTE ON LOADERS\n\nAndroid, in version 3.0, added the Loader class to its\
    \ arsenal of helpers. A loader is essentially a simplified version of the AsyncTask\
    \ class. It processes or acquires a piece of data off the main thread and then\
    \ calls your listener on the main thread when the data is ready. In this chapter,\
    \ I’m giving it a query string that, if the user has a lot of media, could take\
    \ a very long time. This is an excellent time to deploy one of Android’s loader\
    \ subclasses: the CursorLoader. You can use this library on versions of Android\
    \ older than 3.0 by including the Android compatibility library in your project.\
    \ To add it, right-click your project and select Android Tools > Add Compatibility\
    \ Library.\n\nWhen the cursor with my data is ready, my activity’s onLoadComplete\
    \ will be called, at which point I can tell my music service what to play:\n\n\
    ```\n```java\n@Override\npublic void onLoadComplete(Loader<Cursor> loader, Cursor\
    \ cursor) {\n    if(!cursor.moveToFirst()){\n        Toast.makeText(getApplicationContext(),\
    \ \"No Music to Play\",\n            Toast.LENGTH_LONG).show();\n        return;\n\
    \    }\n    int idIDX = cursor.getColumnIndex(MediaStore.Audio.Media._ID);\n \
    \   long id = cursor.getLong(idIDX);\n    if(mService == null){\n        Toast.makeText(getApplicationContext(),\n\
    \            \"No Service to play Music!\",\n            Toast.LENGTH_LONG).show();\n\
    \        return;\n    }\n    try{\n        mService.setDataSource(id);\n     \
    \   mService.play();\n```\n```"
