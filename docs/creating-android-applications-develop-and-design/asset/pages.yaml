- pgno: 187
  md: "This is, for lack of a better term, a disaster. The buttons are far too wide\
    \ in proportion to both their text and the “Do You Like Chocolate?” question above\
    \ them. This is exactly the sort of problem that Android’s layout folders make\
    \ easy to solve.\n\nIn order to fix this graphical mess, I need the buttons to\
    \ be side by side in landscape mode while still being stacked in portrait mode.\
    \ There are two approaches to fixing this problem: a slightly heavy-handed method\
    \ involving setting up a second screen layout for landscape, or using a scalpel\
    \ to excise and fix only the parts that are broken. Both solutions have their\
    \ place.\n\n# ### USING DIFFERENT FOLDERS\n\nAndroid allows you to specify different\
    \ layout folders for various hardware screen configurations. This example solves\
    \ the problem by adding a `layout-land` folder to your project.\n\nNow we come\
    \ to the magic part.\n\n+   1. Create a new folder named `layout-land` for the\
    \ landscape configuration, and place it in `project/res/`.\n+   2. Into this folder,\
    \ place landscape-specific layout files that Android will use *automatically*\
    \ when the device is in landscape mode.\n\n# ### USING `<INCLUDE>` FOR SMALL CHANGES\n\
    \nThe `<include>` tag is a fantastic way to pull out small portions of your screen\
    \ that you’d like to tweak and lay out separately. This is the scalpel method.\
    \ You cut out only the portions you want to render differently, you split them\
    \ into folder-separated layouts, and you’re finished. Which, in this case, is\
    \ a perfect way to excise the buttons and have them render differently depending\
    \ on the screen orientation. Here’s how to do exactly that.\n\n+   1. Create a\
    \ new `button_layout.xml` file in `res/layout-land/`.\n+   \n+      This is the\
    \ file into which we’ll put the landscape-specific layout.\n+   2. Add a `LinearLayout`\
    \ and two `Buttons` in the new `button_layout.xml` file, and place them next to\
    \ each other in the new horizontal `LinearLayout`. Here’s the final contents of\
    \ my `/layout-land/button_layout.xml`."
  merge: -1
  img_proc: true
