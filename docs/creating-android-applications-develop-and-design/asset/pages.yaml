- pgno: 42
  md: "# CREATING A NEW SCREEN LAYOUT\n\nHere’s how you create a new layout.\n\n+\
    \   1. Create a new file named **new_activity.xml** inside the **res/layout/**\
    \ folder. It should sit next to the existing **main.xml** file (which is used\
    \ by your existing activity). This **new_activity.xml** file should look almost\
    \ exactly like **main.xml**, except you’ll need to add a reference to the string\
    \ you just created.\n\n+   2. Insert the highlighted line to create a reference\
    \ to the string you just created.\n\n+   3. Give this modified TextView an ID\
    \ so your Java code can reference it (you’ll learn more about TextViews later;\
    \ for now you should know that they’re Android views that show text on the screen):\n\
    \n```\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<LinearLayout xmlns:android=\"\
    http://schemas.android.com/apk/\n    res/android\"\n    android:orientation=\"\
    vertical\"\n    android:layout_width=\"fill_parent\"\n    android:layout_height=\"\
    fill_parent\"\n>\n<TextView\n    android:id=\"@+id/new_activity_text_view\"\n\
    \    android:layout_width=\"fill_parent\"\n    android:layout_height=\"wrap_content\"\
    \n    android:text=\"@string/new_activity_text\"\n/>\n</LinearLayout>\n```\n```\n\
    \nI will devote Chapter 3 to resource management and user interface design, but\
    \ for now just keep in mind that the @ prefix is how you tell Android you want\
    \ to reference an ID, string, or drawable that is defined elsewhere as a resource.\n\
    \nNow that you have a new layout with its shiny new string, you’ll need to tell\
    \ the NewActivity class that you want it to use this particular layout file."
  merge: -1
  img_proc: true
- pgno: 43
  md: "+   4. Add the following highlighted line to the onCreate method of your New\
    \ Activity class:\n\n```\n```java\npublic void onCreate(Bundle icicle){\n    super.onCreate(icicle);\n\
    \    setContentView(R.layout.new_activity);\n}\n```\n```\n\nsetContentView is\
    \ the method in which you tell Android which XML file to display for your new\
    \ activity. Now that you've created a new class, string, and layout file, it's\
    \ time to launch the activity and display your new view on the screen.\n\n# CATCHING\
    \ KEYS\n\nThe simple way to launch your new activity is to have the user press\
    \ the center key on his or her device. If your phone doesn't have a center key,\
    \ you can easily modify the following code to accept any key you like. To listen\
    \ for key events, you'll need to extend the original activity's onKeyDown method.\
    \ Keep in mind that this is a simple example case. Launching a new activity when\
    \ the user presses a single key probably isn't a very common use case in practice,\
    \ but it makes for a good and simple example. Most new activities are started\
    \ when a user selects a list item, presses a button, or takes another action with\
    \ the screen.\n\nHere's what your new version of onKeyDown should look like:\n\
    \n```\n```java\n@Override\npublic boolean onKeyDown(int keyCode, KeyEvent event){\n\
    \    if(keyCode == KeyEvent.KEYCODE_DPAD_CENTER){\n        //Launch new Activity\
    \ here!\n        return true;\n    }\n    return super.onKeyDown(keyCode, event);\n\
    }\n```\n```"
  merge: -1
  img_proc: true
- pgno: 44
  md: "By declaring onKeyDown, you're overriding the default key handler in order\
    \ to take action specific to your own activity. It's always a good idea to pass\
    \ the incoming key to the parent class's version of the method if it's not something\
    \ your activity handles on its own.\n\nNotice that when the keyCode matches the\
    \ center button, you return true. This is how you tell the Android activity and\
    \ views that the key has been correctly handled and shouldn't be passed on to\
    \ anyone else. Otherwise, you allow the activity superclass to handle the key.\
    \ This may not seem like a big deal now, but it will become much more important\
    \ as your Android activities become more complex.\n\n# ## LAUNCHING THE ACTIVITY\n\
    \nFinally, it's time to launch the new activity. This will start your brief foray\
    \ into intents. Each new activity is started as the result of a new intent being\
    \ dispatched into the system (which processes it and takes the appropriate action).\
    \ In order to start the first activity, you'll need a reference of your application\
    \ context and the class object for your new activity. Let's create the new intent\
    \ first.\n\n+   1. Place the following code into your onKeyDown key handling method:\n\
    \n```\n~~~java\nIntent startIntent=new Intent(\n    this.getApplicationContext(),\n\
    \    NewActivity.class);\n~~~\n```\n\nYou're passing the new intent an application\
    \ context and the class object of the activity that you would like to launch.\
    \ This tells Android exactly where to look in the application package. There are\
    \ many ways to create and interact with intents; this is, however, the simplest\
    \ way to start up a new activity. Once the intent is properly constructed, it's\
    \ simply a matter of telling the Android system that you'd like to start the new\
    \ activity.\n\n+   2. Put the following line into your key handling method:\n\n\
    ```\n~~~java\nstartActivity(startIntent);\n~~~\n```"
  merge: -1
  img_proc: true
- pgno: 45
  md: "![](img/47ad0ac10bf11125744ef22c945d3099_45_0.png)\n\nYour onKeyDown handler\
    \ should look like the following:\n\n```\n```java\npublic boolean onKeyDown(int\
    \ keyCode, KeyEvent event){\n    if(keyCode == KeyEvent.KEYCODE_DPAD_CENTER){\n\
    \        Intent startIntent=new Intent(this, NewActivity.class);\n        startActivity(startIntent);\n\
    \        return true;\n    }\n    return super.onKeyDown(keyCode, event);\n}\n\
    ```\n```\n\n> > **NOTE:** Throughout this whole process, the original activity\
    \ has never once had access to the instance of the new activity. Any information\
    \ that might pass between these two activities must go through the intermediary\
    \ intent. You'll learn how this is done in the next section.\n\n# ## TRYING IT\
    \ OUT\n\nIf you're running Eclipse and you've been coding along with me, it should\
    \ now be a simple matter of spinning up the emulator and installing your new activity\
    \ (the steps for which you should remember from Chapter 1). Once your new application\
    \ has launched, press the center key to see the results of all your labor (**Figure\
    \ 2.1**).\n\nNow that you know how to create and launch a new activity, it's time\
    \ to discuss how that process works. You'll need to understand, for the purposes\
    \ of UI layout and data management/retention later, what methods are called each\
    \ time one of your activities makes its way onto, and off of, the screen."
  merge: -1
  img_proc: true
- pgno: 46
  md: '# GETTING INTENTS


    Intents can take a myriad of forms.


    You use them anytime you need to start an activity or service. Further, you''ll
    frequently use intents for system-wide communication. For example, you can receive
    notifications about power system changes by registering for a widely published
    intent. If one of your activities registers for an intent in the manifest (for
    example, com.haseman.peachPit.OhOhPickMe), then any application anywhere on the
    phone can, if you make your activity public, launch directly to your activity
    by calling


    ```

    startActivity(new Intent("com.haseman.peachPit.OhOhPickMe"));

    ```


    # THE LIFE AND TIMES OF AN ACTIVITY


    It''s good to know early on that each activity lives a very short but exciting
    life. It begins when an intent that your activity is registered to receive is
    broadcast to the system. The system calls your activity''s constructor (while
    also starting your application as necessary) before invoking the following methods
    on the activity, in this order:


    +   1. onCreate

    +   2. onStart

    +   3. onResume


    When you implement an activity, it''s your job to extend the methods that make
    up this lifecycle. The only one you are required to extend is onCreate. The others,
    if you declare them, will be called in the lifecycle order.


    Your activity is the top visible application, can draw to the screen, will receive
    key events, and is generally the life of the party. When the user presses the
    Back key from the activity, these corresponding methods are called in the following
    order:


    +   1. onPause

    +   2. onStop

    +   3. onDestroy'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# THE SHORT, BRUTAL LIFE OF THE ACTIVITY


    An activity''s life is an incredibly short one. They are constantly created and
    destroyed, so it''s very important that you save no data in them that has any
    relevance outside the screen your activity will control.


    The following are all valid actions that will result in the destruction of any
    activity:


    +   1. The user rotated the device from portrait to landscape or vice versa.

    +   2. The activity is no longer visible onscreen or the system is low on resources.

    +   3. It’s Tuesday.

    +   4. The user has pressed the Back or Home buttons and left your application.


    Again, make sure the data members of your activity pertain only to the elements
    on the screen. Further, don’t expect the activity to save any data for you. You’ll
    learn strategies to handle this in later chapters.


    After these methods have executed, your activity is closed down and should be
    ready for garbage collection.


    In order to make sense of the activity’s flow, let’s quickly look over each lifecycle
    method in detail. Remember that you must invoke the superclass call in each of
    these methods (often before you do anything else) or Android will throw exceptions
    at you.


    > **NOTE:** `onCreate` is the only one of the application lifecycle methods that
    you must implement. I’ve found, in most of my work with Android, that I only end
    up implementing one or two of these methods depending on what each activity is
    responsible for.


    ![](img/47ad0ac10bf11125744ef22c945d3099_47_0.png)


    # PUBLIC VOID ONCREATE(BUNDLE ICICLE)


    Android will call your declaration of this method as your activity is starting.
    Remember, however, that during the run of your application you may go through
    several instances of each activity. If, for example, the user changes the screen
    orientation from landscape to portrait, your activity will be destroyed and a
    new instance of the same activity will be created and initialized.'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'If the title, say, for your activity is dynamic but will not change after the
    activity is started, this method would be where you''d want to reach into the
    view hierarchy and set up the title. This method is not the place to configure
    data that could change while the app is in the background or when another activity
    is launched on top of it.


    Further, if your app is running in the background and the system is running low
    on resources, your application may be killed. If that happens, the onCreate method
    will be called on a new instance of the same activity when your application returns
    to the foreground.


    The onCreate method is also your one and only chance to call setContentView for
    your activity. This, as you saw earlier, is how you tell the system what layout
    you''d like to use for this screen. You call setContentView once you can begin
    setting data on the UI. This could be anything from setting the contents of lists
    to TextViews or ImageViews.


    ```

    ```

    PUBLIC VOID ONSTART()

    ```

    ```


    When starting up, your onStart method is called immediately after onCreate. If
    your app was put in the background (either by another application launching over
    yours or the user pressing the Home button), onStart will be called as you resume
    but before the activity can interact with the screen. I tend to avoid overriding
    onStart unless there''s something specific I need to check when my application
    is about to begin using the screen.


    ```

    ```

    PUBLIC VOID ONRESUME()

    ```

    ```


    onResume is the last method called in the activity lifecycle as your activity
    is allowed access to the screen. If UI elements have changed while your activity
    was in the background, this method is the place to make sure the UI and phone
    state are in sync.


    When your activity is starting up, this method is called after onCreate and onStart.
    When your activity is coming to the foreground again, regardless of what state
    it was in before, onResume will be called.


    # HOORAY, YOUR ACTIVITY IS NOW RUNNING!


    After all this setup, configuration, and work, your activity is now visible to
    the user. Things are being clicked, data may be parsed and displayed, lists are
    scrolled, and things are happening! At some point, however, the party must end
    (perhaps because the user pressed the Back key) and you''ll need to wind things
    down.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# ### ONPAUSE()


    onPause is the first method called by the system as your application is leaving
    the screen. If you have any processes or loops (animations, for example) that
    should be running only while your activity is onscreen, the onPause method is
    the perfect place to stop them. onPause will be called on your activity if you''ve
    launched another activity over the one you''re currently displaying.


    Keep in mind that if the system needs resources, your process could be killed
    anytime after the onPause method is called. This isn''t a normal occurrence, but
    you need to be aware that it could happen.


    The onPause method is important because it may be the only warning you get that
    your activity (or even your entire application stack) is going away. It is in
    this method that you should save any important information to disk, your database,
    or the preferences.


    Once your activity has actually left the screen, you''ll receive the next call
    in the activity lifecycle.


    # ### ONSTOP()


    When Android calls your onStop method, it indicates that your activity has officially
    left the screen. Further, onStop is called when the user is leaving your activity
    to interact with another one. This doesn''t necessarily mean that your activity
    is shutting down (although it could). You can only assume that the user has left
    your activity for another one. If you''re doing any ongoing process from within
    your activity that should run only while it''s active, this method is your chance
    to be a good citizen and shut it down.


    # ### ONDESTROY()


    onDestroy is your last method call before oblivion. This is your last chance for
    your activity to clean up its affairs before it passes on to the great garbage
    collector in the sky.


    Any background processes that your activity may have been running in the background
    (fetching/parsing data, for example) must be shut down on this method call.


    However, just because onDestroy is called doesn''t mean that your activity will
    be obliterated. So if you have a thread running, it may continue to run and take
    up system resources even after the onDestroy method is called.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# # BONUS ROUND—DATA RETENTION METHODS


    As mentioned earlier, your process can be killed at any point after onPause if
    the system needs resources. The user, however, shouldn''t ever know that this
    culling has occurred. In order to accomplish this, Android gives you two chances
    to save your state data for later use.


    # ## ONSAVEINSTANCESTATE(BUNDLE OUTSTATE)


    This method passes you a bundle object into which you can put any data that you''d
    need to restore your activity to its current state at a later time. You''ll do
    this by calling something like outState.putString or outState.putBoolean. Each
    stored value requires a string key going in, and it requires the same string key
    to come back out. You are responsible for overriding your own onSaveInstanceState
    method. If you''ve declared it, the system will call it; otherwise, you''ve missed
    your chance.


    When your previously killed activity is restored, the system will call your onCreate
    method again and hand back to you the bundle you built with onSaveInstanceState,


    onSaveInstanceState will only be called if the system thinks you may have to restore
    your activity later. It wouldn''t be called if, for example, the user has pressed
    the Back key, as the device clearly has no need to resume this exact activity
    later. As such, this method is not the place for saving user data. Only stash
    temporary information that is important to the UI on this particular instance
    of the screen.


    # ## ONRETAINNONCONFIGURATIONINSTANCE()


    When the user switches between portrait and landscape mode, your activity is destroyed
    and a new instance of it is created (going through the full shut-down-startup
    cycle of method calls). When your activity is destroyed and created specifically
    because of a configuration change (the device rotation being the most common),
    onRetainNonConfigurationInstance gives you a chance to return any object that
    can be reclaimed in your new activity instance by calling getLastNonConfigurationInstance.


    This tactic helps to make screen rotation transitions faster. Keep this in mind
    if it takes your activity a significant amount of time to acquire data that it
    plans on displaying to the screen. Instead, you can get the previously displayed
    data by using getLastNonConfigurationInstance.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# ### KEEP IT SIMPLE, SMARTY


    By now you know that activities can be killed off with very little notice. The
    onSaveInstanceState gives you a chance to save primitives for later use. This
    means, unequivocally, that your entire activity must be able to collapse all its
    important information into a series of primitives. This further reinforces the
    notion that activities must be very simple and *cannot* contain any complex data
    important to the application outside itself. Avoid keeping large Java collections
    filled with data in your activity, as it may be terminated with very little notice.


    You should now have a basic understanding of


    +   - Steps for creating a new activity

    +   - How an activity is started

    +   - The lifecycle of an activity


    You have what you need to keep up as I go over more complex topics in later chapters.
    Fear not, I''ll come back to the activity in no time.'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'An intent is a class. Intents, in the Android platform, make up the major communication
    protocol for moving information between application components. In a well-designed
    Android application, components (activity, content provider, or service) should
    never directly access an instance of any other component. As such, intents are
    how these pieces are able to communicate.


    A good half of this book could be dedicated to the creation, use, and details
    of the Intent class. For the sake of brevity and getting you up and running as
    fast as possible, I''ll cover only a few basics in this chapter. Look for intents
    throughout the rest of this book. They''re probably the most often used class
    in Android as a whole.


    There are two main ways to tell the Android system that you''d like to receive
    intents sent out by the system, by other applications, or even by your own app:


    +   - Registering an `<intent-filter>` in the `AndroidManifest.xml` file

    +   - Registering an `IntentFilter` object at runtime with the system


    In each case, you need to tell the Android system what events you want to listen
    for.


    There are huge heaping numbers of ways to send intents as well. You can broadcast
    them out to the system as a whole, or you can target them to a specific activity
    or service. However, in order to start a service or activity, it must be registered
    in the manifest (you saw an example of this in the previous demonstration on starting
    a new activity).


    Let''s take a look at how to use intents in practice.


    # ## MANIFEST REGISTRATION


    Why not register everything at runtime? If an intent is declared as part of your
    manifest, the system will start your component so that it will receive it. Registration
    at runtime presupposes that you are already running. For this reason, anytime
    you want your application to awaken and take action based on an event, declare
    it in your manifest. If it''s something your application should receive only while
    it''s running, register an IntentFilter (it''s an intent-filter when declared
    in XML, but an IntentFilter in your Java code) once your particular component
    has started.'
  merge: -1
  img_proc: true
- pgno: 53
  md: "Let's go back to the initial application and look again at the activity's entry\
    \ in the manifest:\n\n```\n<activity android:name=\".MyActivity\"\n    android:label=\"\
    @string/app_name\">\n    <intent-filter>\n        <action android:name=\"android.intent.action.MAIN\"\
    \ />\n        <category android:name=\"android.intent.category.LAUNCHER\" />\n\
    \    </intent-filter>\n</activity>\n```\n\nThe `android.intent.action.MAIN` declaration\
    \ tells the system that this activity is the main activity for your application.\
    \ No parameters are needed to start it. It's a good idea to list only one activity\
    \ as MAIN in the manifest. This is also how adb (the Android debug bridge), when\
    \ you run your application from Eclipse, knows which activity to start up.\n\n\
    The `android.intent.category.LAUNCHER` category tells the system that the enclosing\
    \ activity should be launched when your icon is clicked on the main phone's application\
    \ dock. Further, it tells Android that you'd like the icon to appear in the app\
    \ launcher drawer. This is an example of an intent-filter that's created for you\
    \ by Android's project creation tools. Let's add one of our own.\n\n# ADDING AN\
    \ INTENT\n\nIf you skipped the previous section about the Activity class, now\
    \ may be a good time to go back and at least skim over the code. In that section,\
    \ I showed you how to declare and launch a simple new activity. What I didn't\
    \ show you, however, was how to make that activity accessible to the system as\
    \ a whole by declaring an `<intent-filter>` for it within your manifest. Let's\
    \ do that now.\n\n+   1. Add an `intent-filter` to the NewActivity declaration:\n\
    \n```\n<activity android:name=\".NewActivity\">\n    <intent-filter>\n       \
    \ <action android:name=\"com.haseman.PURPLE_PONY_POWER\"/>\n```"
  merge: -1
  img_proc: true
- pgno: 54
  md: "```\n```\n<category android:name=\"android.intent.category.\n    DEFAULT\"\
    />\n</intent-filter>\n</activity>\n```\n```\n\nIn this code, you've registered\
    \ for intents containing the com.haseman.PURPLE_PONY_POWER action and set the\
    \ intent-filter category to default.\n\nNow, lest you think I'm a crazed children's\
    \ toy enthusiast, I've used this rather absurdist action string to demonstrate\
    \ a point—namely, that the only requirement for the action string is that it be\
    \ unique for your particular component.\n\nIn the previous section, I showed you\
    \ how to launch the new activity by using the following lines:\n\n```\n```\nIntent\
    \ startIntent=new Intent(this, NewActivity.class);\nstartActivity(startIntent);\n\
    ```\n```\n\nThis works, but it has one major limitation: It cannot be launched\
    \ outside your own application's context. This renders useless one of the most\
    \ powerful features that the activity-intent model has to offer. Namely, any application\
    \ on the device, with the right intent, can use components within your application.\n\
    \nNow that you've added the <intent-filter> to the sample project manifest, you\
    \ can launch this particular activity anywhere with the following code:\n\n```\n\
    ```\nIntent actionStartIntent= new Intent\n    (\"com.haseman.PURPLE_PONY_POWER\"\
    );\nstartActivity(actionStartIntent);\n```\n```\n\nNotice a very important difference\
    \ between this code and the listing above it. When you create the intent in this\
    \ example, you're not required to pass in a Context object (the bundle of information\
    \ that is required to communicate with the system at large). This allows any application,\
    \ with knowledge of the required intents, to start the NewActivity class."
