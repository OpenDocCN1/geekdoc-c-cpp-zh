- pgno: 15
  md: '# # WELCOME TO ANDROID


    Eclipse and the Android SDK are the two major tools you''ll use to follow along
    with the examples in this book. There are, however, a few others you should be
    aware of that will be very useful now and in your future work with Android. While
    you may not use all of these tools until you''re getting ready to ship an application,
    it will be helpful to know about them when the need arises.


    # ## THE TOOLS


    Over the course of this book, you''ll work with several tools that will make your
    life with Google''s Android much easier. Here they are in no particular order:


    ![](img/47ad0ac10bf11125744ef22c945d3099_15_0.png)


    # ### ECLIPSE


    Eclipse is the primary tool that I''ll be using throughout the book. Google has
    blessed it as the primary IDE for Android development and has released plug-ins
    to help. Make sure you get them, because they take all the pain out of creating
    a project and stepping through your application on the device. You''re welcome
    to use Eclipse as well, or, if you''re some sort of command-line junkie, you can
    follow along with Vim or Emacs if you prefer.


    ![](img/47ad0ac10bf11125744ef22c945d3099_15_1.png)


    # ### ANDROID SDK


    The Android SDK contains all the tools you''ll need to develop Android applications
    from the command line as well as other tools to help you find and diagnose problems
    and streamline your applications. You can download the Android SDK at http://developer.android.com/sdk/index.html.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '![](img/47ad0ac10bf11125744ef22c945d3099_16_0.png)


    # ANDROID SDK MANAGER


    The Android SDK Manager (found within the SDK tools/ directory) will help you
    pull down all versions of the SDK as well as a plethora of tools, third-party
    add-ons, and all things Android. This will be the primary way in which you get
    new software from Google’s headquarters in Mountain View, California.


    ![](img/47ad0ac10bf11125744ef22c945d3099_16_1.png)


    # HIERARCHY VIEWER


    This tool will help you track the complex connections between your layouts and
    views as you build and debug your applications. This viewer can be indispensable
    when tracking down those hard-to-understand layout issues. You can find this tool
    in the SDK tools/ directory as hierarchyviewer.


    ![](img/47ad0ac10bf11125744ef22c945d3099_16_2.png)


    # DDMS


    DDMS (Dalvik Debug Monitor Server) is your primary way to interface with and debug
    Android devices. You’ll find it in the tools/ directory inside the Android SDK.
    It does everything from gathering logs, sending mock text messages or locations,
    and mapping memory allocations to taking screenshots. Eclipse users have a perspective
    that duplicates, within Eclipse, all the functionality that this stand-alone application
    offers. This tool is very much the Swiss Army knife of your Android toolkit.'
  merge: -1
  img_proc: true
