    \ event){\n    //...previous keycode code skipped...\n    if(keyCode == KeyEvent.KEYCODE_DPAD_DOWN){\n\
    \        Intent actionStartIntent= new Intent(\"com.haseman.PURPLE_PONY_POWER\"\
