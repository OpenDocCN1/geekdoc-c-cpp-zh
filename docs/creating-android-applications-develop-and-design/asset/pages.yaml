- pgno: 162
  md: '![](img/47ad0ac10bf11125744ef22c945d3099_162_0.png)


    Services are one of the most important, and often under-utilized, components of
    the Android platform. They are essential for accomplishing any task whose data
    or relevance can span more than one activity. They are like activities in that
    they have a lifecycle (albeit a much simpler one), but they do not have the activity’s
    ability to draw to the screen. In practice, services break down into two major
    use cases: the listener and the task. Listeners are services that hang out in
    the background, waiting for something to happen that prompts them to take action.
    Task services are akin to the photo downloader that we covered before, so in this
    chapter I’ll focus on listening services.'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# # WHAT IS A SERVICE?


    A Service is, at its most basic level, a class with a simple runtime lifecycle
    and no access to the screen. You had some contact with the `IntentService` back
    in Chapter 4 when I showed you how to retrieve an image with it, but I now have
    the chance to help you really dig into this simple yet powerful component.


    Keep in mind that while the service might be important to you, it is not more
    important to Android than the smooth running of the overall device. This means
    that at any point the system may shut down your service if it determines that
    it''s been running too long, that it''s been consuming too many resources, or
    that it''s the third Friday of the month and there''s a full moon. There is a
    way to tell the system not to kill you off, and I''ll show what that looks like
    in just a second.


    # ## THE SERVICE LIFECYCLE


    A service is, essentially, a singleton. Any component in your application may
    call `startService` with an intent that specifies the service they want to get
    running. If the service isn''t running, Android will initialize a new one; otherwise,
    it will just notify the existing one that a new start command has been issued.
    Here''s a brief rundown of the service''s lifecycle.


    +   - `onCreate` is called on the main thread when the service is started up.
    It''s a good time to initialize any data you''re going to rely on throughout the
    run of the service.

    +   - `onStartCommand` will be called every time an activity (or any other component)
    calls `startService`. The intent passed into `startService` will be handed off
    to your `onStartCommand` call.

    +   - `onBind` is your chance to return, to the caller, an interface object that
    allows direct method calls on the service. The binder, however, is optional and
    only really needed for a heavy level of communication with your service. This
    results in a different method of interaction than calling `Context.startService`.
    Like `startService`, `bindService` takes an intent and will start up the service
    if it''s not already running. If absolutely none of what I just wrote makes sense,
    that''s fine; it''ll make much more sense to you by the end of the chapter.


    At this point in the lifecycle, your service is now happily running along. Music
    can be played, data can be acquired (remember the main thread!), and recordings
    can be made and crunched for voice commands.'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# REMEMBER THE MAIN THREAD!


    Just because you’re running in a service doesn’t mean you’re off the main thread!
    The service’s `onCreate` method will be called on the main thread. If you need
    to do any heavy lifting, consider using an `AsyncTask` or a `Handler+Looper` pattern,
    or instead of doing a normal service, use an `IntentService` to process heavy
    data off the main thread. Further, there are certain actions (like recording audio)
    that you can initiate only from the main thread. It’s 10 a.m., do you know where
    your threads are?


    # KEEPING YOUR SERVICE RUNNING


    The `startForeground` method is your chance to strike a clever deal with Android.
    The system agrees that after you call this method and until you call `stopForeground`,
    it will not kill off your service. In exchange, you must provide an icon and view
    to be shown to the user in the top bar by handing it a `Notification` object.
    This contract allows long-running, essential, and intensive services (such as
    music playback or photo uploading) to run without fear of extermination. At the
    same time, the user is aware of why their phone might be a little sluggish.


    # SHUT IT DOWN!


    At some point, the party will end and it’ll be time to clean up. This can happen
    because your service called `stopSelf` or because another component called `Context.stopService`.
    Here’s the teardown portion of the lifecycle:


    +   - `onDestroy` is your chance to cancel any running tasks and put away any
    resource you’ve taken on (for example, media or network tasks). This is also your
    chance to unregister any `BroadcastReceivers` or `ContentObservers` that you’ve
    set up to watch for new media.


    If you were expecting a many-step shutdown process, I’m afraid you’re going to
    be disappointed. Because services have no notion of being on top of the screen,
    there is no need to pause, resume, or do any of the other complex interactions
    that activities must support.'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'There are two main ways to communicate with a service: intent broadcasts and
    binder interfaces. I’m going to show you examples of both and, along the way,
    let you see two practical tasks for a service. There are, in fact, many more ways
    you can communicate with your services. But in my experience, these are the two
    most useful. As always, check the documentation if neither of these approaches
    feels quite right for you.


    # INTENT-BASED COMMUNICATION


    Imagine two workers in different rooms who can only communicate with each other
    by email. These emails can contain attachments and other pieces of data. The two
    workers must get through their day using only this one method of communication.
    As you might imagine, this can be an efficient and functional way to get a multitude
    of things done, as long as they don’t have to say too much to each other.


    This is, in a sense, exactly what *intent-based communication* with services would
    look like translated to real life. The service is started with an intent; when
    it completes its task or something that it’s waiting for occurs, it sends a broadcast
    intent alerting anyone listening that a particular task is finished. You saw one
    example of this in Chapter 4 when I was downloading images using an intent service.
    Let me show you one more.


    The following example is one of the best examples of intent-based communication
    that I can give you in this printed form. I’ll create all the pieces required
    for a new service that runs, with a notification, in the foreground. I use Android’s
    ContentProvider to listen for and acquire the location of new photographs as they
    are taken. This code will alert you when any new picture is snapped, regardless
    of the application used to do it. What you do with the photograph, I’ll leave
    to your boundless imagination.


    # AUTO IMAGE UPLOADING


    One of my favorite features of the Google+ Android app is its ability to automatically
    upload photos in the background. It turns out that with a ContentProvider, Service,
    and ContentObserver, you can do this quite easily in your own app. My sample service
    will launch, place itself in the foreground, and trigger a broadcast intent whenever
    a new photo is taken. You could, in your own code, upload the image or take any
    number of other actions. Using this technique would involve the following general
    steps.'
  merge: -1
  img_proc: true
