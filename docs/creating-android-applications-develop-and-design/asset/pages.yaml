    League Baseball. More recently, he was an early Android engineer behind the doubleTwist
    media player, and he is now the lead Android developer for the website Tumblr.
    He''s a faculty member of General Assembly in NYC, where he teaches Android development.
    He lives in Brooklyn, where he constantly debates shaving his beard.'
