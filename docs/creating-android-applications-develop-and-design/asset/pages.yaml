  md: '![](img/47ad0ac10bf11125744ef22c945d3099_236_0.png)


    With the release of Honeycomb and Ice Cream Sandwich, Google has introduced a
    totally new form factor to the Android landscape. In Gingerbread and earlier,
    Google had sought to handle only small handset screens. With these new versions
    of Android, you now must deal with the much larger screens of tablets.


    Google has introduced the concept of the fragment (to handle the extra screen
    real estate and to maintain compatibility with smaller, phone-sized screens) and
    the action bar (to replace the options menu).'
