  md: "these side effects while trying to use an AbsoluteLayout. They'll likely try\
    \ to talk you out of this lunacy.\n\nThe AbsoluteLayout, as you might have guessed,\
    \ allows you to specify exactly where on the screen you want a particular view\
    \ to go. Each child of an AbsoluteLayout should have android:layout_x and android:layout_y\
    \ values along with the required width and height settings.\n\nYou are probably\
    \ thinking, \"That sounds like a great way to make layouts look exactly the way\
    \ I want them to. Why bother learning anything else when I can take my screen\
    \ designs and convert them directly into pixel x/y locations?\"\n\nI thought the\
    \ same thing...at first.\n\nHere's what the AbsoluteLayout layout XML looks like:\n\
    \n```\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\n<AbsoluteLayout\n\
