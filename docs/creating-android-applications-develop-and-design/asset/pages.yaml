- pgno: 232
  md: "# ## SIGNING UP FOR A MAP KEY\n\nGetting a map key is pretty easy. Head over\
    \ to http://code.google.com/android/maps-api-signup.html and run the command they\
    \ suggest:\n\n```\n```\nkeytool -list -keystore ~/.android/debug.keystore\n```\n\
    ```\n\nFrom the sign-up page, you must agree to their terms (which you should\
    \ probably read first), enter the output from your keytool command, and get your\
    \ API key. Toss that string into the apiKey section (the highlighted line in the\
    \ main.xml code) of the MapView, and you're good to go. Remember, the map key\
    \ is bound to whatever key you signed your .apk with (in this case, the debugging\
    \ one). When you sign your .apk for release, you'll need to remember to generate\
    \ a new key for it.\n\n> > **TIP:** If the keytool asks for a password, the default\
    \ is \"android.\"\n\n# ## RUN, BABY, RUN\n\nYou've configured everything, dotted\
    \ all your i's, and crossed all your t's. It's time to take this map view out\
    \ for a spin. When it comes time to move and render the map, you'll be primarily\
    \ interfacing with the MapController, which you'll actually retrieve from the\
    \ map view itself. The simple work for my example is all done in my sample code's\
    \ onCreate method:\n\n```\n```java\nMapView mv;\n\nMapController controller;\n\
    \n@Override\n    public void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
    \        setContentView(R.layout.main);\n        mv = (MapView)findViewById(R.id.map_view);\n\
    \        controller = mv.getController();\n        GeoPoint point = new GeoPoint((int)(40.734641\
    \ * 1e6),\n                (int)(-73.996181 * 1e6));\n        controller.animateTo(point);\n\
    \        controller.setZoom(12);\n    }\n```\n```\n\n![](img/47ad0ac10bf11125744ef22c945d3099_232_0.png)"
