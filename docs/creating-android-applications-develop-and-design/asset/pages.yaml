- pgno: 145
  md: "# ## AN OPTIMIZATION TRICK\n\nWhen you're depending on a LinearLayout to portion\
    \ up all available space for your views, you can save a tiny bit of time by specifying\
    \ that the dimension (in the child layout) be 0. This means the system doesn't\
    \ have to figure out the ideal size of the object when it walks through your layout\
    \ to measure your views before drawing. This may not help a lot, but if you've\
    \ got a layout with a lot of views, every little bit counts. As you can see in\
    \ the previous code listing, I've specified the heights be 0 because the LinearLayout\
    \ is going to parcel out all the space between them. You'll also need to specify\
    \ a weight for the view, or it might not work.\n\nThis XML layout code should\
    \ look familiar to you, given what you've read in previous chapters. It's simply\
    \ splitting the screen space between the title main menu and the list of sub-screens.\
    \ You can also see the special Android list ID that is needed to tell the ListActivity\
    \ which view it should interact with.\n\n# ## MAKING A MENU LIST ITEM\n\nNow you'll\
    \ create a layout XML file for the individual list element.\n\nYou'll need to\
    \ declare a separate layout object to define how each element will look in the\
    \ list. I'm using a very simple version of the ArrayAdapter, so at this point,\
    \ the layout XML file *must* contain only a single text view. We'll get into more-complex\
    \ menu items later in the chapter.\n\nNext, you'll need to create a new file,\
    \ containing a single text view, in the /res/layout/ folder. Here's what /res/layout/list_element.xml\
    \ looks like in my project:\n\n```\n```xml\n<?xml version=\"1.0\" encoding=\"\
    utf-8\"?>\n<TextView\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
    \n    android:gravity=\"center\"\n    android:layout_height=\"wrap_content\"\n\
    \    android:layout_width=\"match_parent\"\n    android:textSize=\"20dp\"\n  \
    \  android:padding=\"15dp\"/>\n```\n```"
  merge: -1
  img_proc: true
- pgno: 146
  md: "You don't actually need to supply an ID for this text view, because you'll\
    \ be referencing it in its capacity as a layout object (R.layout.list_element,\
    \ in this case). Setting the gravity to center tells the view that you want the\
    \ text to lie in the center of the extra available space. Setting the padding\
    \ to 15dp will also give the views a little bit of extra space, so people with\
    \ hands like mine can hit the correct one.\nNow that I've declared what I want\
    \ the list elements to look like, I can go about adding them to the ListView itself.\n\
    \n# ### CREATING AND POPULATING THE ARRAYADAPTER\n\nCreate and configure an ArrayAdapter.\
    \ The ArrayAdapter will communicate your data to the ListView. It will also inflate\
    \ however many copies of the list_element layout are needed to keep the ListView\
    \ full of data. As a last step, here's what you'll need to add to the MainMenuActivity's\
    \ onCreate method:\n\n```\n```java\npublic void onCreate(Bundle bundle){\n   \
    \ super.onCreate(bundle);\n    setContentView(R.layout.list_activity);\n    ArrayAdapter<CharSequence>\
    \ adapter =\n        ArrayAdapter.createFromResource(getApplicationContext(),\n\
    \        R.array.menu_entries, R.layout.list_element);\n    setListAdapter(adapter);\n\
    }\n```\n```\n\nBecause the ListView has the special @android:id/list system ID,\
    \ the List Activity knows where to find the ListView. As a result, you'll only\
    \ have to create the adapter and hand it over to the ListActivity. The ListActivity\
    \ will make sure that it's correctly plugged into the ListView and that everything\
    \ is drawn correctly."
  merge: -1
  img_proc: true
