  md: "ever access the screen on its own. Instead of modifying the screen, the IntentService\
    \ will send a broadcast intent alerting all listeners that the image download\
    \ is complete. Further, since the service cannot pass the actual image data along\
    \ with that intent, you'll need to save the image to the SD card and include the\
    \ path to that file in the final completion broadcast.\n\n# # THE SETUP\n\nBefore\
    \ you can use the external storage to cache the data, you'll need to create a\
    \ cache folder for your application. A good place to check is when the IntentService's\
    \ onCreate method is called:\n\n```\n~~~java\npublic void onCreate(){\n    super.onCreate();\n\
    \    String tmpLocation =\n        Environment.getExternalStorageDirectory().getPath()\n\
    \        + CACHE_FOLDER;\n    cacheDir = new File(tmpLocation);\n    if(!cacheDir.exists()){\n\
    \        cacheDir.mkdirs();\n    }\n}\n~~~\n```\n\nUsing Android's environment,\
    \ you can determine the correct prefix for the external file system. Once you\
    \ know the path to the eventual cache folder, you can then make sure the directory\
    \ is in place. Yes, I know I told you to avoid file-system contact while on the\
    \ main thread (and onCreate is called on the main thread), but checking and creating\
    \ a directory is a small enough task that it should be all right. I'll leave this\
    \ as an open question for you as you read through the rest of this chapter: Where\
    \ might be a better place to put this code?"
