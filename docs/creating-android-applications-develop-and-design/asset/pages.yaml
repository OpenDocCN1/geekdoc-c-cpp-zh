- pgno: 88
  md: 'When Android compiles your XML files, it renders them to a packed binary format.
    The upside of this format is that it loads much faster, so your screens can snap
    into focus more quickly. The downside is that you cannot modify any of these files
    once they''ve been compiled. So you can''t manipulate your layout and string files
    at runtime. You can, however, modify what is rendered to the screen by loading
    and changing strings in the Java representation of the views.


    Additionally, if you want to reference various resources from other XML files,
    you''ll use the `@folder/object_id` structure. While you may not have been aware
    of it, you''ve seen this kind of declaration in action already. Think back to
    the initial Hello World layout that the Android tools provide for you. In it,
    you saw a text view with the following line: `android:text="@string/hello"`. This
    was Android''s resource system at work. Instead of specifying `R.string.hello`,
    you''ll use the XML''s `@string/hello` for XML.


    Each type of folder (drawable, layout, values, and several more) has special naming
    conventions and tricks you can use to battle the time-consuming problems of device
    diversity, language localization, and differing screen resolutions and densities.
    Let''s look at what you can do with each type of file.


    # ## VALUES FOLDER


    The prospect of putting all the constant values for your user interface (strings,
    colors, or int/string arrays) in a separate file might sound annoying at first
    (especially when you consider that all text manipulators will take a resource
    ID or a CharSequence). However, it can cut down many days of work when translating
    your application to different languages.


    Having all your strings in an external XML file also means that your nontechnical
    colleagues (product managers, designers, or micromanaging bosses) can manipulate
    the display text in the screens, menus, and pop-up dialogs without bothering you.
    This assumes, of course, that you teach them how to compile and run the project;
    feel free to share the first chapter of this book with them.


    The values folder can contain:


    +   - **Strings.** All string literals should go into your `strings.xml` file.

    +   - **Arrays.** There is a file for the XML-defined arrays, but string arrays
    can still go in the `strings.xml` file if you don''t feel like using a separate
    file.'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'Colors. colors.xml can contain any number of declared color constants for use
    in everything from text fonts to layout backgrounds. Unless you’re planning on
    doing a lot of custom UI drawing, this file will probably not be very large.


    Dimensions. dimens.xml can contain any number of possible size values used elsewhere
    in your layouts. This file is particularly handy if you wish to make a view taller
    or shorter based on the display size of the device your application is being displayed
    on. This might seem like a simple thing to do, but it can be very powerful when
    combined with the layout folders.


    Styles. styles.xml...yeah...more about this later.


    You can create new values folders for each language by using the two-letter ISO639-2
    suffix for a particular language as a suffix to values. You can, for example,
    create a values-es folder containing a Spanish version of the strings.xml file.
    When a user sets his or her phone to Spanish, Android will check automatically
    for an R.string.hello value defined in the strings.xml file within the new values-es
    folder. If it finds one, it will display the values-es version rather than the
    default. If it doesn’t find a Spanish translation, it will default to the value
    you defined in values/strings.xml.


    In this way, Android provides you with an easy way to localize all the strings
    in your application. It does, however, require you to be vigilant about placing
    your string literals in the strings.xml file rather than just calling setText("Text
    like this"); or using android:text="Text like this" in your XML.


    # LAYOUT FOLDERS


    I’m going to give you three guesses as to what exactly goes into the layout folders.
    Typically, it’s where you place either layout XML files for use in setContentView
    calls, or sub-layouts that can be included via ViewStubs or inherited views (two
    tools that allow you to reuse views in different layouts). Android builds a helpful
    mechanic into the layout folders. You can have many folders, with different suffixes,
    that describe how you want the application to appear under various screen configurations.'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'The simplest example is a layout folder and a layout-land folder. If you place
    a firstscreen.xml file in both folders, Android will use the one that most closely
    resembles the current screen mode. If you keep the android:id settings consistent,
    you will be able to specify two completely different-looking screens within your
    XML markups and interact with any of them via your Java code. This technique is
    complicated, so let''s look at an example.


    Let''s say you create portrait and landscape layouts for the first screen of your
    application. Both files are called firstscreen.xml, and the portrait version goes
    in the layout folder while the landscape version goes in the layout-land folder.
    You could also put the portrait version in a folder called layout-port. In both
    versions of firstscreen.xml, you provide all the appropriate IDs for the text
    views, buttons, and images.


    If your screen had an OK button, you''d provide the portrait and landscape versions
    of these buttons the same ID: R.id.ok_button. Remember that you gain access to
    views by calling findViewById() and passing in the ID you specified on the android:id="@+id/id_goes_here"
    line. In this case, if you wanted to set a click listener, you''d fetch the OK
    button by calling findViewById(R.id.ok_button); and Android would return the button
    from your portrait screen if you''re in portrait mode and the landscape version
    of the button if you''re in landscape mode. Your code knows what it must do when
    that button is pressed, but it doesn''t know about the dimensions or location
    of the button. Welcome to the happy land of the Model-View-Controller (MVC).


    MVC is your number one friend when handling the diversity in device screen sizes.
    You can lay out your views in any possible configuration and, as long as the IDs
    match, you''ll need to write only a single Activity class to handle all possible
    screen permutations. You can have specific folders, each with its own set of layout
    files for different screen sizes (layout-small to layout-xlarge) and densities
    (layout-ldpi to layout-hdpi), and you can mix and match. For example, layout-large-land
    would specify layouts for large screens (VGA and WVGA) that are in landscape mode.
    For the exact order in which Android defaults through the folders, be sure to
    check the Android SDK documentation.


    I''m only scratching the surface of the possibilities that these layout folders
    put at your disposal. You''ll learn more about this topic in coming chapters on
    dealing with display and hardware diversity.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# # DRAWABLE FOLDERS


    For Android, a *drawable* is simply something that can be drawn to the screen.
    Android abstracts away the differences between colors, shapes, and images and
    allows you to deal with a superclass that can represent any number of them: Drawable.

    You keep the definitions for these objects in the drawable folders.

    You should consider using a drawable for two main types of objects:


    +   - Image resources (mostly PNG files)

    +   - XML files describing things you want drawn: shapes, gradients, or colors


    The drawable set of folders works similarly to the layout folders. You can specify
    any mix of screen densities, layouts, or resolutions, provided you specify them
    in the right order.


    # ### MANY RESOURCES, ONE APK


    > > Just because you can have a whole different set of images for each screen
    size or density doesn''t mean you actually should. Keep a close eye on the size
    of your final compiled APK file. If the file grows over a certain size, users
    will complain. To combat this bloat, use 9-patches, which are easily scaled images,
    and use hand-rendered shapes over large PNG graphics where possible. While the
    new marketplace does allow for multiple APKs, it''s a level of complexity you
    should avoid.


    ![](img/47ad0ac10bf11125744ef22c945d3099_91_0.png)


    Referencing a drawable is accomplished in the same way that you reference values
    and layouts. For XML files, use the `@drawable/resource_name`. For example, in
    an `ImageView` (`android:src="@drawable/bridge"`), omit the suffix if you''re
    referring to XML files or images. Also, keep in mind that Android will always
    try to use the drawable folder that is closest to your current configuration.
    If it can''t find a good match, it''ll cascade back to what it can find in the
    default drawable folder.


    **TIP:** Be sure to check the Android SDK documentation for more info on ordering
    your suffixes correctly.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '![](img/47ad0ac10bf11125744ef22c945d3099_92_0.png)


    **FIGURE 3.1** A taste of what''s to come.


    Layouts, from the simple to the complex, describe how to arrange a complex series
    of views. This section covers the basics of Android''s arsenal of layout classes
    starting with the ViewGroup, moving through LinearLayouts, and ending with the
    king of the Android screen arrangers, the RelativeLayout.


    # THE VIEWGROUP


    Each layout in Android extends what''s known as the ViewGroup. This is the class
    of views that by definition can contain other views as children.


    To demonstrate how each of the major layouts function, I''ll be laying out an
    example picture-viewer screen. While Android provides its own snazzy photo viewer,
    complete with a thumbnail carousel, mine will be simple and an excellent vehicle
    for showing you how the various layouts work.


    Figure 3.1 shows the screen that we''ll be rendering using the AbsoluteLayout,
    the LinearLayout, and the RelativeLayout.'
  merge: -1
