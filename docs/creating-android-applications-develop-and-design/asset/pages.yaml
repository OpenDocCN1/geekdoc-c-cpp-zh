- pgno: 56
  md: "# MANY INTENTS, ONE ACTIVITY\n\nOne activity may register to receive any number\
    \ of events. Typically, sending an intent is akin to telling the activity “do\
    \ this one thing!” That “one thing” can be anything from editing a file to displaying\
    \ a list of possible files or actions. Again, as we’ve discussed, it’s important\
    \ to limit the scope of your activity, so registering for only one intent is often\
    \ a good idea. However, because your activity could be registered for more than\
    \ one intent, it’s a good idea to call getIntent inside your onCreate method and\
    \ check why you’re being started so you can take the right action (by calling\
    \ getAction).\n\n# LISTENING FOR INTENTS AT RUNTIME\n\nAnother method for receiving\
    \ events that pertain only to your application or for receiving events broadcast\
    \ by the Android system itself is to listen for the intents at runtime.\n\nLet’s\
    \ say that your activity would like to show a special screen or take a custom\
    \ action when the user enables Airplane mode. To do this, you’ll need to create\
    \ a temporary IntentFilter and an inner BroadcastReceiver object instance.\n\n\
    # CREATE A RECEIVER\n\nLet’s add the runtime BroadcastReceiver to the MyActivity\
    \ class. A BroadcastReceiver is, as you can probably guess, an object with a single\
    \ onReceive method.\n\nChange the MyActivity class to look like the following:\n\
    \n```\npublic class MyActivity extends Activity {\n\n    private BroadcastReceiver\
    \ simpleReceiver=new BroadcastReceiver() {\n\n        public void onReceive(Context\
    \ context, Intent intent) {\n\n            if(intent.getAction().equals(\n\n \
    \               Intent.ACTION_AIRPLANE_MODE_CHANGED)){\n\n                   \
    \ Toast.makeText(context,\n\n                        R.string.airplane_change,\n\
    \n                        Toast.LENGTH_LONG).show();\n\n                }\n\n\
    \            }\n\n        };\n\n    //Rest of the Activity is here.\n\n    }\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 57
  md: "In this code, you are creating a locally accessible receiver for use within\
    \ the activity. When the system calls onReceive, you’ll need to check what the\
    \ intent’s action is. This is a good idea, as BroadcastReceiver could register\
    \ for any number of different intents.\n\nWhen you receive the event that you’re\
    \ looking for, you’ll use Android’s Toast API to print a simple message on the\
    \ screen (in this case, the contents of the string named airplane_change). In\
    \ practice, this might be the time to show a screen indicating that network connectivity\
    \ is required for the application to run correctly.\n\n# TELL ANDROID WHAT YOU\
    \ WANT TO HEAR\n\nNow that you’ve created a BroadcastReceiver, you can register\
    \ it with the system. I’ll show you the code first and then go over what’s happening:\n\
    \n```\npublic void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
    \    setContentView(R.layout.main);\n    IntentFilter intentFilter = new IntentFilter();\n\
    \    intentFilter.addAction(Intent.ACTION_AIRPLANE_MODE_CHANGED);\n    registerReceiver(simpleReceiver,\
    \ intentFilter);\n}\n```\n\n> > **A TOAST?**\n> >\n> > A toast is a short message\
    \ shown to the user in a small pop-up along the bottom of the screen. This is\
    \ a reference, as far as I can tell, to the short speech given before glasses\
    \ are raised, tapped together, and then partaken of. As always with toasts, the\
    \ shorter and simpler the better."
  merge: -1
  img_proc: true
