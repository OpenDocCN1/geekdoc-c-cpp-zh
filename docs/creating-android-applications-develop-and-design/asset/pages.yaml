- pgno: 76
  md: "# ## HANDLING A FEW COMMON TASKS\n\nSome tasks are more common than others.\
    \ Let's take a look at how you can handle some of the ones that you'll do a few\
    \ dozen times before you finish your first application.\n\n![](img/47ad0ac10bf11125744ef22c945d3099_76_0.png)\n\
    \n# ### CHANGING THE VISIBILITY OF A VIEW\n\nMost of the time, if you want to\
    \ define your UI in XML, you'll need to add views that will be visible only some\
    \ of the time.\n\n> > **TIP:** If you find yourself doing this a lot, be sure\
    \ to check out the ViewStub class.\n\nDepending on how dynamic your application\
    \ is, views come and go fairly regularly. Showing and hiding views is as simple\
    \ as using the ever trusty findViewById and then calling setVisibility on the\
    \ returned object:\n\n```\n```java\nButton button = (Button)findViewById(R.id.sample_button);\n\
    //Cycle through the View Visibility settings\nif(button != null){\n    //Gone\
    \ (no impact on layouts)\n    button.setVisibility(View.GONE);\n    //Invisible\
    \ (holds its space in a layout but is not drawn)\n    button.setVisibility(View.INVISIBLE);\n\
    \    //Visible (duh)\n    button.setVisibility(View.VISIBLE);\n}\n```\n```\n\n\
    This code has three visibility settings. GONE and VISIBLE are the most obvious.\
    \ You'll find yourself using INVISIBLE less often, however it's great for keeping\
    \ all the other views inside your layouts from moving around when you want to\
    \ hide something."
  merge: -1
  img_proc: true
- pgno: 77
  md: "# SETTING AN ONCLICKLISTENER\n\nSetting up a listener to tell you that one\
    \ of your views has been clicked is one of the most common tasks you'll do when\
    \ working on an Android application. A click can mean the user moved focus to\
    \ your view using the navigation pad or trackball and then clicked the select\
    \ key. A click can also mean pressing on the trackball, if there's one of those,\
    \ or on the key in the center of the four- or eight-way directional pad.\n\nYour\
    \ click listener will also be called if, in touch mode, the user taps their finger\
    \ down on your view and then lifts up with their finger still within the bounds\
    \ of the view. This is an important distinction, as your click listener will not\
    \ be invoked when their finger actually clicks down on the view but rather when\
    \ the user lifts their finger up. This gives the user the chance to put a finger\
    \ down in the wrong place and then correct the position before lifting it.\n\n\
    You can track view clicks in several ways. You can declare that your activity\
    \ itself implements the view's OnClickListener interface, add a public void onClick\
    \ (View v) method, and pass a pointer to your activity to the view you wish to\
    \ track. Here's what that looks like in code for theoretical buttons with IDs\
    \ button_one and button_two declared in an imaginary main.xml layout file:\n\n\
    ```\n~~~java\npublic class UiDemoActivity extends Activity implements\n      \
    \  OnClickListener {\n\n    @Override\n    public void onClick(View selectedView)\
    \ {\n        if(selectedView.getId() == R.id.button_one){\n            //Take\
    \ Button One actions\n        }\n\n        if(selectedView.getId() == R.id.button_one){\n\
    \            //Take Button Two actions\n        }\n    }\n\n    @Override\n  \
    \  public void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
    \        setContentView(R.layout.main);\n~~~\n```"
  merge: -1
