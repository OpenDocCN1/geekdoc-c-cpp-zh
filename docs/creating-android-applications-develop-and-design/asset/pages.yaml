- pgno: 101
  md: '# **ONE VIEW MUST BE IN CHARGE OF SIZE**


    One view, or layout, must define a height and width value. You cannot tell Android
    that you''d like a layout to wrap its content while, at the same time, telling
    a view that it should match its parent. This will cause a compile error because
    Android has no idea how big to make either the parent view or the child layout.
    Something must define an actual height, even if it''s an image or a line of text.


    By setting the orientation to horizontal, Android knows to place the children
    in order from left to right across the top of the screen. The outer layout is
    a vertical one, allowing placement of the button bar above the image.


    By setting the width to match_parent, I''m making sure the layout itself stretches
    all the way across the parent layout (in this case the entire screen). The height
    is set to wrap_content, so it will be exactly as tall as the final measured height
    of its children.


    The LinearLayout distributes its children in the order they''re defined. It then
    measures all the child views to see how much space they''d like to take up. It
    will then divvy up the available space in proportion to the ideal size of its
    children. If there is too little space to accommodate all the child views, it''ll
    give each child a part of their required space in proportion to their measured
    size. If there''s more than enough space for all the child views, it''ll pass
    out the extra space based on how large the child''s onMeasure call tells the layout
    it wants to be. You can modify this proportional distribution through the layout_weight
    attribute in each child.


    Layout really happens more in the definition of the children than the declaration
    of the layout itself. So, for a bit of context, let''s take a look at the individual
    members of the button bar layout.'
  merge: -1
  img_proc: true
- pgno: 102
  md: "Here is the first of the child views in the definition for the Prev button:\n\
    \n```\n```xml\n<Button\n    android:id=\"@+id/prev\"\n    android:layout_width=\"\
    wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:paddingLeft=\"\
    5dip\"\n    android:paddingRight=\"5dip\"\n    android:text=\"@string/prev_string\"\
    \n    android:lines=\"1\"\n    android:layout_weight=\"1\"\n/>\n```\n```\n\nThe\
    \ layout_weight value, which can be any decimal number from 0 to 1, tells the\
    \ system how much space to give to the child view when the layout has either too\
    \ much or too little space.\nTake a look at the landscape version of the button\
    \ bar again (Figure 3.6).\n\nFIGURE 3.6 Overly large buttons thanks to the LinearLayout.\n\
    \n# LINEAR LAYOUTS ARE NOT FOR PIXEL PERFECTIONISTS\n\nI've said it once and I'll\
    \ now say it a second time: LinearLayouts are not great for laying out pixel-perfect\
    \ screens. As views get proportionally larger and smaller, it becomes difficult\
    \ to get them to rest exactly where you want them to. Use the LinearLayout when\
    \ you have a known quantity of objects that must get on the screen and you're\
    \ not overly picky about exactly where they end up. In small, space-constrained\
    \ cases, as with small button bars or single list menu entries, AbsoluteLayouts\
    \ can prove to be much easier to use to get exactly the screen layout you're looking\
    \ for. This might be the only case I can think of where an AbsoluteLayout might\
    \ make sense."
  merge: -1
  img_proc: true
- pgno: 103
  md: "FIGURE 3.7 Oops, too small!\n\n![](img/47ad0ac10bf11125744ef22c945d3099_103_0.png)\n\
    \nThis may be very close to the way the screen looks in portrait mode, but not\
    \ close enough. As the top bar grows, the LinearLayout hands out extra pixel space\
    \ in proportion to the measured size of the child view. In this case, because\
    \ all three elements (two buttons and the text title) are weighted the same (1),\
    \ the layout divides the extra space evenly among them. You can re-weight the\
    \ buttons such that they grow in different ratios to the text title. Since you\
    \ want the buttons to grow at a slower rate than the text, you could try setting\
    \ their weights to 0. Here are what the new values look like (with everything\
    \ else omitted):\n\n```\n```xml\n<LinearLayout\n>\n    <Button\n        android:layout_weight=\"\
    0\"\n        />\n    <TextView\n        android:layout_weight=\"1\"\n        />\n\
    \    <Button\n        android:layout_weight=\"0\"\n        />\n</LinearLayout>\n\
    ```\n```\n\nFigure 3.7 shows what this change does to the button bar. Well, technically\
    \ that’s correct, but it looks awful. You have two options. You can declare exactly\
    \ how much extra space you’d like each of the two buttons to have through the\
    \ android:padding declaration, or you can give them a little bit more weight.\
    \ You can fiddle with the first option on your own, but let’s take a look at the\
    \ padding option together."
