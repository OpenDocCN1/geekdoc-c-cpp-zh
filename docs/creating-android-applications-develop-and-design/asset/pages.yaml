  md: '![](img/47ad0ac10bf11125744ef22c945d3099_114_0.png)


    While the prime directive of this chapter is to teach you how to acquire data
    from a remote source, this is really just a sneaky way for me to teach you about
    Android and the main thread. For the sake of simplicity, all the examples in this
    chapter will deal with downloading and rendering image data. In the next chapter,
    on adapters and lists, I’ll introduce you to parsing complex data and displaying
    it to users. Image data, as a general rule, is larger and more cumbersome, so
    you’ll run into more interesting and demonstrative timing issues in dealing with
    it.'
