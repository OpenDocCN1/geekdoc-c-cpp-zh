- pgno: 247
  md: "![](img/47ad0ac10bf11125744ef22c945d3099_247_0.png)\n\n**FIGURE 10.4** A basic\
    \ action bar.\n\nWith the transition from Android 2.3 to 3.0, Google has eliminated\
    \ both the search button and the menu key. From personal experience, I can tell\
    \ you that many new users never find functionality that is placed in the options\
    \ menu. Its removal from the system is, indeed, a very good thing.\n\nGoogle,\
    \ bless their expensive cotton socks, has moved the icons that used to reside\
    \ in the options menu to the action bar. Further, you can specify a search view\
    \ in the action bar (to replace the search button). This takes up more screen\
    \ space, but on a tablet (and on larger phones), there is more than enough space\
    \ to go around.\n\nThe action bar now represents the primary way your users will\
    \ navigate through your Honeycomb or Ice Cream Sandwich application. Sadly, this\
    \ new tool is available only through versions 3.0 (target 11) or later. It would\
    \ require a fair amount of typing, but it’s very possible to emulate the action\
    \ bar on earlier systems by using a simple linear layout and a few image views.\
    \ You are, however, on your own to implement it. There is no support for the action\
    \ bar in the compatibility library.\n\n# SHOWING THE ACTION BAR\n\nSince the action\
    \ bar is supported only in SDK versions 3.0 and later, your manifest will have\
    \ to explicitly declare that it supports target 11 or greater.\n\n```\n```xml\n\
    <uses-sdk android:minSdkVersion=\"7\"\n          android:targetSdkVersion=\"11\"\
    \n/>\n```\n```\n\nAt this point, when your project is built and run on any Honeycomb\
    \ and later system, you should see a basic version of the action bar containing\
    \ your application's icon and the default title of the activity (Figure 10.4)."
  merge: -1
  img_proc: true
- pgno: 248
  md: "# ## ADDING ELEMENTS TO THE ACTION BAR\n\nIn addition to allowing you to set\
    \ your own title with a call to setTitle, the action bar can handle three different\
    \ types of objects:\n\n+   - Icons. Both in a drop-down menu on the right-hand\
    \ side and as actionable items in the bar itself.\n+   - Tabs. Buttons along the\
    \ top, built to manipulate fragments on the screen.\n+   - Action views. Search\
    \ boxes and drop-down lists (for things like sort orders, account selection, or\
    \ death-ray intensities).\n\nFurther, Android will always make your application\
    \ icon (farthest to the left) clickable. It is expected that tapping this icon\
    \ will, by default, return the user to your application’s home screen (whatever\
    \ this means to your application’s behavior). You can also visually indicate that\
    \ the home icon will go one level back in the activity stack by calling setDisplayHomeAsUpEnabled(true).\n\
    \nThe way you make changes to what’s in the action bar is very similar to how\
    \ you used to interact with the options menu. This is not by accident. Because\
    \ the action bar is supposed to replace the options menu, you call methods and\
    \ configure files similarly to how you used to deal with the menu. This also makes\
    \ it easy to gracefully degrade service to phones on older versions of the Android\
    \ SDK.\n\n# ### ADDING AN ICON\n\nIcons are most easily placed in the action bar\
    \ by extending onCreateOptionsMenu and adding the menu icons you’d like. I’ve\
    \ added a delete icon to the action bar with the following code:\n\n```\n```java\n\
    @Override\npublic boolean onCreateOptionsMenu(Menu menu){\n    MenuItem item =\
    \ menu.add(\"delete\");\n    item.setIcon(android.R.drawable.ic_delete);\n   \
    \ if(Build.VERSION.SDK_INT >= 11){\n        item.setShowAsAction(MenuItem.SHOW_AS_ACTION_IF_ROOM);\n\
    \    }\n    return true;\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 249
  md: "![](img/47ad0ac10bf11125744ef22c945d3099_249_0.png)\n\n**FIGURE 10.5** Adding\
    \ an action icon.\n\n![](img/47ad0ac10bf11125744ef22c945d3099_249_1.png)\n\n**FIGURE\
    \ 10.6** A non-action icon.\n\nIf the Android SDK is greater than 3.0, the system\
    \ will call this method when the activity is starting (so it can build the action\
    \ bar). You'll notice that I'm calling setShowAsAction only if we're running on\
    \ Honeycomb or later. Figure 10.5 shows what the action bar looks like on a handset\
    \ running Ice Cream Sandwich.\n\nIf you omit the call to setShowAsAction on a\
    \ Honeycomb tablet, you'll see an options menu icon that contains the menu item\
    \ on the right side. On Ice Cream Sandwich, it will move the menu item to a more\
    \ traditional contextual menu. Figure 10.6 shows what it looks like on a tablet\
    \ after I've clicked it.\n\n# ## REACTING TO ICON CLICKS\n\nWhen the user clicks\
    \ one of your action bar icons, Android will call your implementation of the onOptionsItemSelected\
    \ method. Here's my very simple example method:\n\n```\n```java\npublic boolean\
    \ onOptionsItemSelected(MenuItem item){\n    int id = item.getItemId();\n    if(id\
    \ == android.R.id.home){\n        //The user clicked the left-hand app icon.\n\
    \        //As this is the home screen, ignore it.\n        return true;\n    }\n\
    \    else{\n        //Perform the delete action here\n        return true;\n \
    \   }\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 250
  md: "With that, you should have the basics of creating both options menu and action\
    \ bar icons. Alternatively, you can declare your icons as XML files and inflate\
    \ them using the MenuInflater. Check the documentation ([http://developer.android.com/guide/topics/ui/menus.html](http://developer.android.com/guide/topics/ui/menus.html))\
    \ for a complete rundown on how to use XML files in /res/menu to streamline the\
    \ process.\n\n![](img/47ad0ac10bf11125744ef22c945d3099_250_0.png)\n\nFIGURE 10.7\
    \ A tab bar in Google Calendar.\n\n# ## ADDING A TAB\n\nPlacing a tab in the action\
    \ bar is a totally different process. You'll use the ActionBar class itself to\
    \ add them. Further, you'll need to implement an ActionBar.TabListener (it tells\
    \ the system, through a series of overridden methods, what to do when the tab\
    \ is tapped by the user).\n\nOnce you've implemented your listener, you should\
    \ then add the following code to your activity's onCreate method:\n\n```\n   \
    \ ActionBar bar = getActionBar();\n    bar.setNavigationMode(ActionBar.NAVIGATION_MODE_TABS);\n\
    \    ActionBar.Tab tab1 = bar.newTab();\n    tab1.setText(\"Tab Text\");\n   \
    \ tab1.setTabListener(new ExampleTabListener());\n    bar.addTab(tab1);\n```\n\
    \nFor each tab you'd like to add, you must go through the process of requesting\
    \ a new tab from the action bar, setting the listener, and then adding it to the\
    \ action bar. Figure 10.7 shows a great-looking example of a tab bar in the Google\
    \ Calendar application.\n\nEach tab will trigger different events on the fragments\
    \ within an activity. For the Google Calendar application, it will hide and show\
    \ the various ways in which the user could view their calendar."
  merge: -1
  img_proc: true
