- pgno: 108
  md: "The first view, which declares the Prev button, initially declares its ID in\
    \ the android:id line. The Prev button needs an ID so you can assign a click listener\
    \ to it in the activity code. The layout height and width declarations simply\
    \ tell the view to make it large enough to accommodate all the content (in this\
    \ case, the \"prev\" text and a little padding).\n\nThe padding declaration tells\
    \ the system to push the boundaries for the button out from the smallest required\
    \ space for the text. In this case, android:padding=\"15dip\" tells the system\
    \ to measure the required space for the \"prev\" text and then 15 more device-independent\
    \ pixels to the outer boundary of the view. As a general rule, it's always good\
    \ to pad your buttons between 10 and 20 dip (depending on screen and text size).\
    \ This gives them a little more space to be recognized as buttons, and it also\
    \ gives people with large fingers a chance of actually hitting the view.\n\nNow\
    \ come the parts that tell the system where inside the layout object to place\
    \ the button. The attribute android:layout_alignParentLeft=\"true\" tells Android\
    \ to align the left edge of the view with the left edge of the parent's bounding\
    \ rectangle. In this case, it's the left edge of the screen. The android:layout_alignParentTop=\"\
    true\" attribute does the same thing except with respect to the top of the layout\
    \ object (in this case, the top of the application's available space).\n\nIf you\
    \ don't specify any layout parameters, views will default to the upper-left corner\
    \ of the layout object. This code example declares these views for explanation\
    \ purposes.\n\nNow that the Prev button is in place, you're ready to move on.\
    \ Here's the relevant XML for the Next button:\n\n```\n```xml\n<Button\n    android:id=\"\
    @+id/next\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
    wrap_content\"\n    android:padding=\"15dip\"\n    android:text=\"@string/next_string\"\
    \n    android:layout_alignParentRight=\"true\"\n    android:layout_alignParentTop=\"\
    true\"\n/>\n```\n```"
