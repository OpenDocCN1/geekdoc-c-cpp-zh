- pgno: 237
  md: 'Fragments, conceptually, are like activities with a slightly more complex lifecycle.
    They can be given a screen to themselves if there isn''t much room, or they can
    be placed with many other fragments on a larger tablet screen. An activity can
    contain any number of fragments. In this way, the Android SDK allows you to expand
    and collapse the views in your application to take advantage of more and less
    screen space. There is one thing that the activity can do that the fragment cannot—namely,
    the activity can register for intents in the manifest; fragments rely on their
    host activity to pass on launch information. Further, it''s important to implement
    fragments such that they are totally unaware of what other fragments are visible.
    This becomes important, because you''ll want to change that configuration depending
    on how much space you have.


    If you''re planning on coding along with me in this chapter, make sure you have
    a project that is set to version 3.0 or higher of the Android SDK (API Level 11
    or greater).


    # THE LIFECYCLE OF THE FRAGMENT


    Fragments have fairly complex lifecycles. There are many methods to explore, but
    onCreateView must be implemented for the fragment to appear onscreen. onCreateView
    is your fragment''s one chance to create a view to display onscreen. If you fail
    to return a view to the system, your application will crash and burn.


    Here is the startup lifecycle; the methods are listed in the order the system
    will call them:


    +   - onAttach. This is called when your fragment is attaching to an activity.

    +   - onCreate. This is called when the fragment is being initialized. This is
    a great place to initialize any variables you''ll need later.

    +   - onCreateView. This is your opportunity to create and return the fragment''s
    root view. This is the first method that will be called if your fragment is returning
    to the screen after having been previously paused.

    +   - onStart. Similar to the same call on the activity, this is called when the
    fragment is about to be placed onscreen.

    +   - onResume. This is called when the fragment is back onscreen.'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'At this point, your fragment is frolicking on the screen, receiving touch and
    key events, or just hanging around and looking great. If the user leaves the screen
    or switches to a view that no longer includes the fragment, the following shutdown
    lifecycle will take place:


    +   - onPause. This is called if the fragment is removed from the screen or the
    user presses the home button. This is the only part of the shutdown life-cycle
    you''re guaranteed to get (it would be the only method you get in the rare situation
    that your application is put in the background and then your process is killed
    due to resource constraints). onPause is the best time for you to save any data
    or state information that you want the user to be able to see when the fragment
    is resumed later.

    +   - onStop. Similar to the activity''s version of this method, onStop is called
    when your fragment has left the screen. It tends to be called in conjunction with
    the activity''s onStop method.

    +   - onDestroyView. This is your last chance to pull data out of the views before
    they go away.

    +   - onDestroy. This is called when the fragment is being removed from the screen
    and will not return. This is the time to make sure all your threads are stopped,
    loaders are canceled, and any broadcast receivers are unregistered.

    +   - onDetach. Called as the fragment loses its association with an activity,
    onDetach is the last of your methods the system will call before the fragment
    heads to the great garbage collector in the sky.'
  merge: -1
  img_proc: true
