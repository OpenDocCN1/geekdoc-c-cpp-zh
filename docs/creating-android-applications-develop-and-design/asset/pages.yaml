  md: "# A NOTE ON FILE SYSTEMS\n\n> Relying on a file-system cache has an interesting\
    \ twist with Android. On most phones, the internal storage space (used to install\
    \ applications) is incredibly limited. You should not, under any circumstances,\
    \ store large amounts of data anywhere on the local file system. Always save it\
    \ to a location returned from getExternalStorageDirectory.\n> \n> When you're\
    \ saving files to the SD card, you must also be aware that nearly all pre-2.3\
    \ Android devices can have their SD cards removed (or mounted as a USB drive on\
    \ the user's laptop). This means you'll need to gracefully handle the case where\
    \ the SD card is missing. You'll also need to be able to forge the file-system\
    \ cache on the fly if you want your application to work correctly when the external\
    \ drive is missing. There are a lot of details to be conscious of while implementing\
    \ a persistent storage cache, but the benefits (offline access, faster start-up\
    \ times, fewer app-halting loading dialogs) make it more than worth your effort.\n\
    \nTHE FETCH\n\nNow that you've got a place to save images as you download them,\
    \ it's time to implement the image fetcher. Here's the handleIntent method:\n\n\
    ```\nprotected void onHandleIntent(Intent intent) {\n    String remoteUrl = intent.getExtras().getString(\"\
    url\");\n    String location;\n    String filename =\n            remoteUrl.substring(\n\
    \            remoteUrl.lastIndexOf(File.separator)+1);\n    File tmp = new File(cacheDir.getPath()\n\
    \            + File.separator +filename);\n    if(tmp.exists()){\n           \
    \ location = tmp.getAbsolutePath();\n            notifyFinished(location, remoteUrl);\n\
    ```"
