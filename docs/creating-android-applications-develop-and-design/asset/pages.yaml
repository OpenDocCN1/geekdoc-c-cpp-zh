- pgno: 191
  md: '**FIGURE 7.3** No awards for design, but much better.


    ![](img/47ad0ac10bf11125744ef22c945d3099_191_0.png)


    Now, with this new code, the landscape mode looks much better (Figure 7.3). Are
    there things that could be improved? Sure! Now, however, you know how to specify
    that parts of your user interface should change as the screen''s hardware configuration
    changes.


    # ### MERGING


    You don''t have to wrap your existing views in a new ViewGroup (RelativeLayout
    in the previous example) for them to be included (as I did here). If you don''t
    want to add another layout to the mix but would like to bring in a series of views
    from other XML files, simply wrap them in a `<merge>` tag.


    ```

    ```xml

    <merge xmlns:android="http://schemas.android.com/apk/res/android">

    <!-- views go here -->

    </merge>

    ```

    ```


    This will allow you to include views without adding another layout to your view
    hierarchy.'
