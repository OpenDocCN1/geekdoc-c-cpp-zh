- pgno: 19
  md: 'First, you need to download a few software tools—namely, the Android SDK, the
    Eclipse integrated development environment (IDE), and the Android plug-in for
    Eclipse. There are many other tools a developer could use to make Android applications,
    but I''ve found that this setup has the fewest hassles and will get you up and
    running in the least amount of time.


    # THE ANDROID SOFTWARE DEVELOPMENT KIT


    Head over to the Android Developers website at http://developer.android.com. You''ll
    become intimately familiar with these pages as you work on this platform. Once
    on the site, find the section labeled SDK and download the offered files with
    reckless abandon. On Windows, it''s best if you use the offered installer. For
    you Mac and Linux users, you''ll get a zip file. Set the appropriate files to
    downloading and move on while they finish.


    # ECLIPSE


    For versions of Eclipse newer than 3.5, Google recommends that you get the classic
    version of the IDE. Tap your way to www.eclipse.org/downloads and locate Eclipse
    Classic. (This chapter has screenshots from 3.6.1; the latest is, however, 3.7.1.)
    Make sure you get the right version for your system: 32-bit or 64-bit. Now get
    your twiddling thumbs ready and wait for the installer to come through. Assuming
    that you''re not connecting through a telephone line that makes hissing noises,
    you should be finished in just a few minutes.


    In the meantime, I''ll entertain you with an opera about the nature of kittens…
    wait no, no I won''t. You''re welcome to browse ahead in the book while you download
    the required files.


    # JAVA


    You''ll need to download and install Java on your system (depending on how much
    development you''ve done before, you might already have it installed). I assume
    you were already comfortable with Java before diving into this book; I''m also
    going to assume you''re comfortable installing the JDK yourself.'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'At this point, the process becomes a little more complicated and the herd of
    cats start to wander in different directions. Depending on which platform you''re
    running, you may have to skip ahead from time to time. If the title doesn''t look
    like it applies to your operating system (OS), skip ahead until you find one that
    does. Bear with me; you''ll be working on your first application in no time.


    > > **NOTE:** For the duration of this book, I''m going to assume you''ll be using
    the Eclipse IDE for the majority of your development. I''ll try to include command-line
    methods as well as Eclipse screenshots for all important commands and tasks in
    case you''re rocking the terminal with Vim or Emacs.


    ![](img/47ad0ac10bf11125744ef22c945d3099_20_0.png)


    # ### INSTALLING ECLIPSE


    Installing Eclipse, for the most part, is as simple as decompressing the file
    you''ve downloaded and putting the application somewhere you''ll remember. I recommend
    not launching Eclipse just yet. Wait until you''ve got the Android SDK squared
    away (see the next section). You may want to make sure that you''ve got the latest
    development tools in place.


    # ### INSTALLING THE ANDROID SDK


    With Eclipse now in place, you''re just a few steps away from running your own
    Android application. Find the section that applies to your operating system, and
    follow the steps therein.


    # ### INSTALLING THE SDK FOR MAC USERS


    To install the SDK, simply unzip the compressed file you downloaded from the Android
    Developers site (developer.android.com). Although you can unpack this file anywhere,
    I recommend placing it in `/Users/yourUserName/Documents/android_sdk/`.


    If you are a command-line person, you should put two directories on your path
    as follows:


    +   1. Navigate to `/Users/yourUserName/.profile`.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '+   2. Assuming that you installed the SDK in the location I recommended, add
    the following code all on one line:


    ```

    ```bash

    export PATH="$PATH:/Users/*yourUserName*/Documents/android_sdk/tools:/Users/*yourUserName*/Documents/android_sdk/platform-tools"

    ```

    ```


    Now, when you open a new terminal, typing which android will return the path where
    you installed your shiny new Android SDK. Keep this command in mind—you''ll return
    to it in a minute.


    # INSTALLING THE SDK FOR LINUX USERS


    Linux users should go through nearly the same steps as in “Installing the SDK
    for Mac Users.” The only differences are the instructions for putting the SDK
    on your path and where you may want to put your version of the SDK. I''m going
    to assume that if you''re a Linux user, you''re savvy enough to figure out this
    procedure on your own.


    # INSTALLING THE SDK FOR WINDOWS USERS


    To install the Android SDK for Windows, follow these steps:


    +   1. Start the Android SDK installer.

    +   2. Accept the installer''s default location and Start-menu configuration.

    +   3. Let the installer work its magic.


    This procedure will add an SDK Manager command to your Start menu. This is the
    application you''ll work with to select the correct platforms in the next section.


    # DOWNLOADING A PACKAGE


    All right, you''ve got the SDK downloaded and in the right place. You''re not
    quite there yet.


    +   1. If you are a Mac or Linux user, run sdk_location/tools/android; if you
    are a Windows user, allow the installer to open the AVD (Android Virtual Device)
    Manager software.


    You should see the Android SDK Manager.'
  merge: -1
  img_proc: true
