- pgno: 172
  md: '![](img/47ad0ac10bf11125744ef22c945d3099_172_0.png)


    **FIGURE 6.1** The notification pull-down in action!


    This is the layout that will be inflated and placed into the notification bar.
    You can use only stock Android widgets for these (no custom views), and you''ll
    want to keep it very simple. Mine consists of an icon and a text view. It''s simple
    enough that you can probably imagine exactly what it looks like, but Figure 6.1
    shows what it looks like in action.


    It''s worth noting that you are not actually inflating the view yourself when
    creating a RemoteView. You''re specifying a layout and then giving the system
    instructions on what to do to it when it is eventually inflated (this is the difference
    between a View and a RemoteView). You''ll set this as the notification''s contentView.


    Next, you''ll see me create an intent that is to be fired when the user presses
    on the notification row seen in Figure 6.1. This is a PendingIntent, which, again,
    is really an intent and an instruction about what to do with it when the time
    comes. In this case, I want to launch the activity with the Start and Stop buttons.
    You''ll set the PendingIntent, as I did, to be the notification''s contentIntent.


    With the fully built notification in hand, you can now call startForeground and
    hand it the notification.


    You''ve now met your half of the contract: You''ve told the user who you are and
    why you''re running. The system now will allow you to run uninterrupted until
    such time as the user disables the service by pressing the activity''s Stop button.
    It''s time to start listening for when the content changes.'
