- pgno: 26
  md: '![](img/47ad0ac10bf11125744ef22c945d3099_26_0.png)


    **FIGURE 1.5** Configuring a new Android Virtual Device (AVD).


    This screen should look familiar, because you just used it to install one or two
    application platforms. Now you’re back to make a new virtual device.


    +   2. With the Android SDK Manager open, make sure the Virtual Devices tab is
    selected and click New. A new emulator dialog will pop up.

    +   3. In the Name field, give your emulator a name; it’s best to give it one
    that helps distinguish it from any others. You will have collected several emulators
    before publishing your first application.

    +   4. From the Target drop-down menu, specify which SDK you want to target. It’s
    simplest right now to start with Gingerbread (2.3.3), but everything will still
    work on Ice Cream Sandwich (4.0).

    +   5. In the SD Card field, select the Size radio button and enter a small size.

    +   6. In the Skin section, select the Built-In radio button and choose Default
    WVGA800 from the drop-down menu.


    The completed screen should look like Figure 1.5.'
