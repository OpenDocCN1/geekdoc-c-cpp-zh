- pgno: 140
  md: '![](img/47ad0ac10bf11125744ef22c945d3099_140_0.png)


    Lists, in Android, are one of the most often-used tools to show data to users.
    From the entry menu of a game to a dynamic list of Facebook statuses or Twitter
    messages, lists are everywhere. Android''s system for dealing with them, while
    complicated at first, becomes much easier once you begin using it. In this chapter,
    I''ll run the gamut from simple, static main-menu lists to the dynamic, remote-data-backed
    custom list elements of a Twitter feed. Along the way, I''ll expose you to the
    inner workings of one of Android''s most often-used and complex UI views.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# TWO PIECES TO EACH LIST


    To display lists of ordered data with Android, there are two major components
    you’ll need to deal with.


    # LISTVIEW


    First, you’ll need a ListView in which to display your content. This is the view
    whose job it is to display the information. It can be added to any screen layout,
    or you can use Android’s ListActivity or ListFragment to handle some of the organization
    for you. If your screen is primarily designed to show a collection of data to
    the user in list form, I highly suggest you use ListActivity and its cousin ListFragment.


    # ADAPTER


    The second major class you’ll need to deal with is the Adapter. This is the object
    that will feed the individual views, a little bit at a time, to the ListView.
    It’s also responsible for filling and configuring the individual rows to be populated
    in the ListView. There are many Adapter subclasses as drops of water in the ocean
    (all right, perhaps slightly fewer), and they cover the range of data types—from
    static string lists (ArrayAdapters) to the more dynamic lists (CursorAdapters).
    You can extend your own adapter (which I’ll show you in the second half of this
    chapter). For now, let me show you how to create a simple main menu with a ListView.


    As always, you can either follow along with the sample code I’ve posted at Peachpit.com/androiddevelopment/design
    or open your IDE and do the tasks I’ve outlined.'
  merge: -1
  img_proc: true
- pgno: 142
  md: "# A MAIN MENU\n\nMain menus can take any number of forms. From games to music\
    \ apps, they provide a top-level navigation into the app as a whole.\n\nThey are\
    \ also, as a happy side effect, a great way to introduce you to how lists work.\
    \ I'll be creating an array of strings for the resource manager, feeding it to\
    \ an array adapter, and plugging that array adapter into the list view contained\
    \ by a list activity. Got all that? There are a lot of moving parts to collect\
    \ when dealing with lists, so I'll take it slowly and step by step.\n\n# CREATING\
    \ THE MENU DATA\n\nA menu must have something to display, so you need to create\
    \ a list of strings to be displayed. Remember the chapter where you learned that\
    \ all displayed string constants *should* go into the res/values/strings.xml file?\
    \ String arrays, coincidentally, go into the same file, but with a slightly different\
    \ syntax. I've added the following to my res/values/strings.xml file:\n\n```\n\
    <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources>\n    <!--The rest of the\
    \ app's strings here-->\n    <string name=\"app_name\">List Example</string>\n\
    \    <string name=\"main_menu\">Main Menu</string>\n<string-array name=\"menu_entries\"\
    >\n        <item>Menu Item One</item>\n        <item>Menu Item Two</item>\n  \
    \      <item>Menu Item Three</item>\n    </string-array>\n</resources>\n```\n\n\
    Instead of defining each constant inside a string tag, this time you'll declare\
    \ a string array with a name, and then each element within it can be defined inside\
    \ an item tag. Now that you have data, it's time to create an activity in which\
    \ to house it."
  merge: -1
  img_proc: true
- pgno: 143
  md: "# CREATING A LISTACTIVITY\n\nNow you need a place to display your items. You'll\
    \ create an instance of ListActivity in which to display your recently created\
    \ list.\n\nEvery screen must have an activity, and list screens are no exception.\
    \ In this case, Android provides you a helper class that was built specifically\
    \ to make list screens easier. It's called the ListActivity, and it behaves exactly\
    \ like an activity does except that it has a few extra methods to make life easier.\
    \ If you're coding along with the chapter, you'll need to create a new project.\
    \ Take the main activity you'd normally have, and modify it to look like the following\
    \ listing:\n\n```\npackage com.haseman.lists;\n\nimport android.app.ListActivity;\n\
    import android.os.Bundle;\n\npublic class MainMenuActivity extends ListActivity{\n\
    \tpublic void onCreate(Bundle bundle){\n\t\tsuper.onCreate(bundle);\n\t\tsetContentView(R.layout.list_activity);\n\
    \t}\n}\n```\n\nThis code will not, however, compile at the moment, because I haven't\
    \ yet defined what R.layout.list_activity looks like. Guess what you're going\
    \ to do next?\n\n# DEFINING A LAYOUT FOR YOUR LISTACTIVITY\n\nYou will need to\
    \ create an XML layout file for your list. Again, this is similar to other layout\
    \ tasks you've done, with one notable exception: You need to define a ListView\
    \ with the special ID android:id/list. This is what tells the system which list\
    \ view is the main list view your new ListActivity will interact with. I've also\
    \ added a TextView to the layout as a large title. My XML file looks like the\
    \ following:"
  merge: -1
  img_proc: true
