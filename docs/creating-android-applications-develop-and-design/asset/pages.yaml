    When you call runOnUiThread, Android will schedule this work to be done as soon
    as the main thread is free from other tasks. Once back on the main thread, all
    the same “don’t be a hog” rules again apply.


    # # THERE MUST BE A BETTER WAY!


    If you''re looking at this jumbled, confusing, un-cancelable code and thinking
    to yourself, “Self. There must be a cleaner way to do this,” you’d be right. There
    are many ways to handle long-running tasks; I’ll show you what I think are the
    two most useful. One is the AsyncTask, a simple way to do an easy action within
    an activity. The other, IntentService, is more complicated but much better at
    handling repetitive work that can span multiple activities.'
