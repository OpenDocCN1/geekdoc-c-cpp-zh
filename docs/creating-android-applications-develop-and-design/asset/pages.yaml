    \ extension of the BroadcastReceiver class. This is what you'll need to declare\
    \ inside your activity in order to correctly process events from the IntentService.\
    \ Right now, there are two problems with this code. See if you can recognize them.\n\
    \nFirst, you'll need to extract the file location from the intent. You do this\
    \ by looking for the \"location\" extra. Once you've verified that this is indeed\
    \ a valid file, you'll pass it over to the BitmapFactory, which will create the\
    \ image for you. This bitmap can then be passed off to the ImageView for rendering.\n\
    \nNow, to the things done wrong (stop reading if you haven't found them yet. No\
    \ cheating!). First, the code is not checking to see if the intent service is\
    \ broadcasting a completion intent for exactly the image originally asked for\
    \ (keep in mind that one service can service requests from any number of activities).\n\
    \nSecond, the bitmap is loading from the SD card...on the main thread! Exactly\
    \ one of the things I've been warning you NOT to do.\n\n# CHECKING YOUR WORK\n\
    \nAndroid, in later versions of the SDK tools, has provided a way to check if\
    \ your application is breaking the rules and running slow tasks on the main thread.\
    \ You can, in any activity, call StrictMode.enableDefaults, and this will begin\
    \ to throw warnings when the system spots main thread violations. StrictMode has\
    \ many different configurations and settings, but enabling the defaults and cleaning\
    \ up as many errors as you can will work wonders for the speed of your application."
  merge: -1
  img_proc: true
- pgno: 136
  md: '# # THE LOADER


    Loader is a new class that comes both in Honeycomb and in the Android Compatibility
    library. Sadly, there is not enough space in this chapter to cover it in detail,
    but I will say that it''s an excellent tool to explore if you must do heavy lifting
    off the main thread repeatedly. It, like AsyncTask, is usually bound to an activity,
    but it is much better suited to handle situations where a single task must be
    performed many times. It''s great for loading cursors (with the CursorLoader subclass)
    and for other tasks, like downloading individual list items for a ListView. Check
    the documentation for how best to use this new and powerful class.'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'That about covers us on how to load data. Remember, loading from the SD card,
    network transactions, and longer processing tasks MUST be performed off the main
    thread, or your application, and users, will suffer. You can, as I''ve shown you
    in this chapter, use a simple thread, an AsyncTask, or an IntentService to retrieve
    and process your data. But remember, too, that any action modifying any view or
    object onscreen must be carried out on the main thread (or Android will throw
    angry exceptions at you).


    Further, keep in mind that these three methods are only a few of many possible
    background data fetching patterns. Loaders, Workers, and ThreadPools are all other
    alternatives that might suit your application better than the examples I''ve given.


    Follow the simple rules I''ve outlined here, and your app will be fast, it will
    be responsive to your users, and it will avoid the dreaded App Not Responding
    notification of doom. Correct use and avoidance of the main thread is critical
    to producing a successful application.


    If you''re more interested in building lists out of complex data from remote sources,
    the next chapter should give you exactly what you''re looking for. I''ll be showing
    you how to render a list of Twitter messages to a menu onscreen.


    I''ll leave you with a final challenge: Enable Android''s strict mode and move
    the little file accesses I''ve left in this chapter''s sample code off the main
    thread. It should be a good way to familiarize yourself with the process before
    you undertake it on your own.'
  merge: -1
  img_proc: true
