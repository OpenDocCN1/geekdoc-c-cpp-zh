- pgno: 148
  md: "# REACTING TO CLICK EVENTS\n\nYour code will need to listen for item clicks.\n\
    \nWhat's the point of having a menu if you can't tell when items have been selected?\
    \ Right, there isn't one. Let me show you the final piece to my basic list menu\
    \ example. Add the following method to your MainMenuActivity.java file:\n\n```\n\
    @Override\npublic void onListItemClick(ListView lv,\n        View clickedView,\n\
    \        int position, long id)\n{\n    super.onListItemClick(lv, clickedView,\
    \ position, id);\n    TextView tv = (TextView)clickedView;\n    Toast.makeText(getApplicationContext(),\n\
    \        \"List Item \"+tv.getText()+\" was clicked!\",\n        Toast.LENGTH_SHORT).show();\n\
    }\n```\n\nThe ListActivity will call this method (if you've defined it) every\
    \ time an element in the list view is clicked (or tapped with a finger). For more-complicated\
    \ lists, you may want to use the ID (especially if you are using SQLite as a backing\
    \ store). For this simple demo, I've just popped up a little dialog showing the\
    \ text of the item that was pressed. If you're implementing your own basic main\
    \ menu, I suggest you use the position of the clicked item to start an activity,\
    \ service, or other action. You can see an example of this if you look at the\
    \ associated source code.\n\nThat's the most basic list view I could possibly\
    \ show you. Now, I'll take you in the opposite direction and show you what a custom\
    \ list backed by a remote data source looks like."
  merge: -1
  img_proc: true
- pgno: 149
  md: "While building a main menu is great and all, there are much more complicated\
    \ uses to which you can put the Adapter and ListView combination. In fact, I'm\
    \ going to show you an example that gets complicated in two ways. First, the data\
    \ source is going to be from a remote URL (a Twitter feed). Second, I'm going\
    \ to add a second text view to the list (you could, if you want to, add any number\
    \ of items to it).\n\n# ### THE 1000-FOOT VIEW\n\nAll right, here's the game plan.\
    \ First, you'll need an AsyncTask to retrieve the feed from Twitter's API. Once\
    \ you have the data, you'll need to parse it into JSON (JavaScript Object Notation)\
    \ objects and feed that data into a custom adapter. Last, you'll need to create\
    \ that custom adapter and the specific ListView layout to hold the two pieces\
    \ of text info. With those things in hand, you can create the custom layout object.\n\
    \nIn the end, you'll have a list of Peachpit's 20 most recent Twitter messages,\
    \ along with when they were written. If a message was retweeted, the text will\
    \ display in red. This is by no means the most complex list you could build using\
    \ these tools, but it is a great way to show you how to make your own complex\
    \ custom list views.\n\n# ### CREATING THE MAIN LAYOUT VIEW\n\nThis step is very\
    \ similar to the \"Defining a Layout for Your ListActivity\" section. You'll need\
    \ an XML layout containing a ListView with the android:id/list ID. In this case,\
    \ however, because the data isn't available when the activity launches, you'll\
    \ need the ListView to start out hidden. Here's what my project's XML layout looks\
    \ like:\n\n```\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<LinearLayout\
    \ xmlns:android=\"http://schemas.android.com/apk/\n    res/android\"\n    android:orientation=\"\
    vertical\"\n    android:layout_width=\"match_parent\"\n    android:layout_height=\"\
    match_parent\">\n    <TextView\n    android:id=\"@+id/loading_text\"\n    android:layout_width=\"\
    match_parent\"\n    android:layout_height=\"wrap_content\"\n```\n```"
  merge: -1
  img_proc: true
- pgno: 150
  md: "```\n```xml\nandroid:text=\"@string/loading\"\nandroid:gravity=\"center\"/>\n\
    <ListView\n    android:id=\"@android:id/list\"\n    android:layout_width=\"match_parent\"\
    \n    android:layout_height=\"match_parent\"\n    android:visibility=\"gone\"\
    />\n</LinearLayout>\n```\n```\n\n# ## CREATING THE LISTACTIVITY\n\nAgain, you're\
    \ going to need a new ListActivity. Since you're already good at getting them\
