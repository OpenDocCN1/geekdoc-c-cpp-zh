- pgno: 206
  md: '# # ANDROID, MEDIA, AND THE CONTENTRESOLVER


    Android will, under certain conditions, search your SD card for new media by using
    a helper called the MediaScanner. When new media is found, it''s added to Android''s
    media ContentProvider. Using the columns defined in the MediaStore class, you
    can query the phone''s built-in media library for content. The MediaScanner will
    read ID3 tags and any other metadata it can to acquire information about the device''s
    content. Although this example and the photo lookup example from the previous
    chapter are pretty simple, the media store and Android''s ContentResolver can
    be powerful if used correctly. Check the SDK documentation for these classes to
    get more information.


    As you can see, I''m still fetching and caching the video view, but now I''m issuing
    a query to Android''s ContentProvider for the DATA column of all media rows that
    are videos. Specifically, you can see this in action in the highlighted code.
    That query is fairly simple in that I want all videos on the external drive (SD
    card), and I only care about the data column for all those rows. This column for
    any particular row should always contain the path to the actual media content
    on disk. It''s this path that I''ll eventually hand off to the VideoView for playback.


    Note that it is possible to pass URIs to the video view. The video playback mechanism
    will find the path to the object for you. I would, however, like to show you the
    harder way so that you''ll be more informed. And if you later need to upload or
    manipulate a file directly, you''ll know how to acquire it.


    The Cursor object (a class Android uses to wrap database query responses) can
    be null if the external media card is removed (or mounted into USB storage mode),
    so I''ll need to check for a null cursor or one with no results before moving
    on. Typically in this case, I''d display a message to the user about their SD
    card being unavailable, but I''ll leave that task up to your imagination.


    Last, I''ll get and cache the column index for the data row. This will make it
    easier for my playNextVideo method to interact with the cursor''s results.'
  merge: -1
  img_proc: true
- pgno: 207
  md: "# LOADING AND PLAYING MEDIA\n\nAt this point, you have a video view, a cursor\
    \ full of media to play, and a listener configured to tell you when media playback\
    \ is finished. Let’s put the final piece into the game, the code in playNextVideo:\n\
    \n```\n```java\nprivate void playNextVideo(){\n    mediaCursor.moveToNext();\n\
    \    if(mediaCursor.isAfterLast()){\n        Toast.makeText(getApplicationContext(),\n\
    \            \"End of Line.\", Toast.LENGTH_SHORT).show();\n    }\n    else{\n\
    \        String path = mediaCursor.getString(dataIdx);\n        Toast.makeText(getApplicationContext(),\n\
    \            \"Playing: \"+path, Toast.LENGTH_SHORT).show();\n        videoView.setVideoPath(path);\n\
    \        videoView.start();\n    }\n}\n```\n```\n\n![](img/47ad0ac10bf11125744ef22c945d3099_207_0.png)\n\
    \nMy first task is to move the cursor to the next piece of media and make sure\
    \ we haven't run out of stuff to play. When I know I've got a valid row from the\
    \ cursor, I can tell the video view what it should render next. Video views can\
    \ accept both a path defined as a string as well as the URI for a piece of media\
    \ declared in the content provider. As I mentioned earlier, the data column of\
    \ the cursor contains the file path to the media itself. I'll pull this out of\
    \ the Cursor, hand it off to the video view, and then start playback.\n\n> **TIP:**\
    \ You’re not limited to just file paths—you can hand the video view a URL, and\
    \ it will query and play the media found there."
  merge: -1
  img_proc: true
- pgno: 208
  md: "Recall that earlier I registered my activity as the OnCompletionListener for\
    \ the video so that when a video is finished it will notify me via the OnCompletion\
    \ call. In that method, I just need to call back into my playNextVideo code and\
    \ we're playing!\n\n```\n```java\n@Override\npublic void onCompletion(MediaPlayer\
    \ mp) {\n    playNextVideo();\n}\n```\n```\n\nAt this point, the pieces are in\
    \ place, videos play, and you're almost done!\n\n# CLEANUP\n\nYou've seen me do\
    \ this at least once before, but it's always important to close any cursors you\
    \ request from the content provider. In past cases, I've requested data with a\
    \ query, pulled out the relevant information, and immediately closed the cursor.\
    \ In this case, however, I need to keep the cursor around for when the video change\
    \ has to occur. This does not get me off the hook; I still need to close it down,\
    \ so I'll need to add that code to my activity's onDestroy method:\n\n```\n```java\n\
    @Override\npublic void onDestroy(){\n    if(mediaCursor!=null){\n        mediaCursor.close();\n\
    \    }\n}\n```\n```"
