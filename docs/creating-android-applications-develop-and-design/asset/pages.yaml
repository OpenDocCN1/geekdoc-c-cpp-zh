- pgno: 37
  md: "# THE FILES\n\nAny mobile application, in its most basic form, consists of\
    \ a single screen that launches by clicking an icon on the device’s main screen.\n\
    \nWhen the SDK creates a basic Android project, it also creates several files\
    \ and important directories.\n\nAs with any project, before you start building\
    \ the structure it’s important to at least take a quick look over the blueprints.\
    \ Here are the file and folders that make up your Android project structure.\n\
    \n+   - `AndroidManifest.xml`\n+   - `/res`\n+   - `/src`\n\nThroughout the rest\
    \ of this chapter, I’ll refer to the manifest and these folders.\n\n# THE MANIFEST\n\
    \nThe AndroidManifest.xml file is your portal to the rest of the phone. In it,\
    \ you’ll describe which of your components should receive what events. You’ll\
    \ also declare, in the manifest file, what hardware and software your app will\
    \ need permission to access. First, let’s take a look at the <manifest> declaration\
    \ in the AndroidManifest.xml file:\n\n```\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
    \n    package=\"com.haseman.peachPit\"\n    android:versionCode=\"1\"\n    android:versionName=\"\
    1.0\">\n```\n\nThere are a few noteworthy items in this code. The package definition\
    \ tells Android in which Java package to look for the class files that make up\
    \ the components of your application. The next two variables are not particularly\
    \ important right now, but they will become vital once you’re ready to ship your\
    \ application to the Android Market. The versionCode is the number that helps\
    \ the Market alert users that an update is available. The versionName is a string\
    \ that the application menus and Market display to the user as the current version\
    \ of your app.\n\nYour application can have only one AndroidManifest.xml file.\
    \ Henceforth, I’ll refer to this file and concept simply as the manifest."
  merge: -1
  img_proc: true
- pgno: 38
  md: "# # THE ACTIVITY CLASS\n\nIn a typical Android application, activities are\
    \ the backbone of the operation. Essentially, their purpose is to control what\
    \ is displayed on the screen. They bridge the gap between the data you wish to\
    \ display and the UI layout files and classes that do the work of displaying the\
    \ data. If you’re familiar with the popular Model-View-Controller (MVC) architecture,\
    \ the activity would be the control for a screen. Here’s what the activity declaration\
    \ looks like in the manifest file:\n\n```\n```xml\n<activity android:name=\".MyActivity\"\
    \n    android:label=\"@string/app_name\">\n    <!-- More on how the intent-filter\
    \ works in the next section-->\n    <intent-filter>\n        <action android:name=\"\
    android.intent.action.MAIN\" />\n        <category android:name=\"android.intent.category.LAUNCHER\"\
    \ />\n    </intent-filter>\n</activity>\n```\n```\n\nThe `android:name` tag tells\
    \ the system what to place on the end of your package (from the manifest declaration)\
    \ to find your class definition. For example, in my sample project at `com.haseman.peachPit.MyActivity`,\
    \ the class loader will look to find a class that extends the Activity class.\n\
    \nIn order to do that, the file must reside under the `src/com/haseman/peachPit`\
    \ directory. This is standard operating procedure for the language that Android\
    \ uses.\n\n# ## WATCHING THE ACTIVITY IN ACTION\n\nThe activity, if used correctly,\
    \ is an object that specifically controls a single screen. Let’s talk about this\
    \ mythical activity in terms of a real-world RSS news feed reader as a case study\
    \ that can quickly explain what pages of theory would often miss. A developer\
    \ typically uses one activity to list all feeds to which a user has subscribed.\
    \ When a user taps a feed, the developer uses a second activity to display a list\
    \ of available articles for that particular news feed. Lastly, when a user clicks\
    \ a particular story, the developer uses a third activity to display that article’s\
    \ details.\n\nIt’s easy to see how activities fill a certain role (subscription\
    \ list, article list, article detail). At the same time, the activities are general,\
    \ in that the article list should be able to display a list of articles from any\
    \ RSS feed, and the article details activity should show the details from any\
    \ article found through an RSS reader."
  merge: -1
  img_proc: true
