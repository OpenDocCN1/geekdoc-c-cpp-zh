- pgno: 23
  md: '![](img/47ad0ac10bf11125744ef22c945d3099_23_0.png)


    ![](img/47ad0ac10bf11125744ef22c945d3099_23_1.png)


    **FIGURE 1.2** Where Eclipse has cleverly hidden the plug-in install wizard.


    **FIGURE 1.3** The plug-in install wizard in all its dull glory.


    Fortunately, configuring Eclipse is consistent for Windows, Mac, and Linux. Fire
    up Eclipse and specify where you want to locate your workspace. It can, theoretically,
    be installed anywhere, but I always locate mine under ~/Documents/workspace on
    my Mac. As long as you consistently use the same directory, you shouldn''t encounter
    any problems.


    # ## ADDING THE ANDROID PLUG-IN TO ECLIPSE


    Now that you''ve got Eclipse up and running, you''ll need to add Android''s ADT
    plug-in. This is the magic piece that will change Eclipse from a straight Java
    developer tool into a tool for making Android applications.


    +   1. From the Eclipse Help menu, select Install New Software (Figure 1.2).

    +   2. Enter https://dl-ssl.google.com/android/eclipse/ in the Work With field
    in the Install pop-up. Your settings should look like those in Figure 1.3.'
  merge: -1
  img_proc: true
