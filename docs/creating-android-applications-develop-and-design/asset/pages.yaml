  md: "At this point, the system will construct a new instance of your service, call\
    \ its onCreate method, and then start firing data at the IntentService's handleIntent\
    \ method. The intent service is specifically constructed to handle large amounts\
    \ of work and processing off the main thread. The service's onCreate method will\
    \ be called on the main thread, but subsequent calls to handleIntent are guaranteed\
    \ by Android to be on a background thread (and this is where you should put your\
    \ long-running code in any case).\n\nRight, enough gabbing. Let me introduce you\
    \ to the ImageIntentService. The first thing you'll need to pay attention to is\
    \ the constructor:\n\n```\n```java\npublic class ImageIntentService extends IntentService{\n\
    \    public ImageIntentService() {\n        super(\"ImageIntentService\");\n \
    \   }\n}\n```\n```\n\nNotice that the constructor you must declare has no string\
    \ as a parameter. The parent's constructor that you must call, however, must be\
    \ passed a string. Eclipse will make it seem that you must declare a constructor\
    \ with a string when, in reality, you must declare it without one. This simple\
    \ mistake can cause you several hours of intense face-to-desk debugging.\n\nOnce\
    \ your service exists, and before anything else runs, the system will call your\
    \ onCreate method. onCreate is an excellent time to run any housekeeping chores\
    \ you'll need for the rest of the service's tasks (more on this when I show you\
    \ the image downloader).\n\nAt last, the service can get down to doing some heavy\
    \ lifting. Once it has been constructed and has had its onCreate method called,\
    \ it will then receive a call to handleIntent for each time any other activity\
    \ has called startService.\n\n# ### FETCHING IMAGES\n\nThe main difference between\
    \ fetching images and fetching smaller, manageable data is that larger data sets\
    \ (such as images or larger data retrievals) should not be bundled into a final\
    \ broadcast intent (another major difference to the AsyncTask). Also, keep in\
    \ mind that the service has no direct access to any activity, so it cannot"
