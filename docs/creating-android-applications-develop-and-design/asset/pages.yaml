- pgno: 180
  md: "+   - A flag telling the system how I'd like the service started (in this case,\
    \ not sticky—you can check the SDK documentation for more information about this\
    \ one).\n\nNow, my example code won't compile until I actually add an implements\
    \ ServiceConnection to my activity's class declaration and the required methods\
    \ that it entails. Here, in all their glory, are my activity's new required methods.\n\
    \n```\n```java\nIMusicService mService;\n\n@Override\npublic void onServiceConnected(ComponentName\
    \ name, IBinder service) {\n    mService = IMusicService.Stub.asInterface(service);\n\
    \    try {\n        mService.setDataSource(0);\n    } catch (RemoteException re)\
    \ { Log.e(\"MusicService\", \"\", re)\n}\n\n@Override\npublic void onServiceDisconnected(ComponentName\
    \ name) {\n}\n```\n```\n\nThis code might look a little strange, but the asInterface\
    \ call is converting from the IBinder object to the IMusicService (which I can\
    \ then make direct calls on). However, each call to the remote service requires\
    \ that you catch potential RemoteExceptions that come up.\n\nThat's really all\
    \ there is to it. Once you've received the onServiceConnected call and completed\
    \ the conversion, you can stash that MusicService object for whenever you need\
    \ it.\n\nBut don't forget to unbind from it when your onDestroy method gets called.\n\
    \nCreating an AIDL and binding to a service in this way is actually one of the\
    \ more complicated ways to communicate with a service. If you're not going to\
    \ be building a long-running service in a separate process, this might not be\
    \ the perfect setup for you. Consider checking the SDK documentation for the locally\
    \ bound service or messenger patterns."
