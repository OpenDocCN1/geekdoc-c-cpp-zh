    \n**FIGURE 3.4** The linearLayout-based screen (left).\n\n**FIGURE 3.5** The same\
    \ layout but in landscape (right).\n\nFigure 3.4 shows what this example XML produces\
    \ in portrait mode. This is where Android’s dynamic layouts really start to shine;\
    \ take a look at what the exact same layout code looks like when the user shifts\
    \ into landscape mode (Figure 3.5).\n\nNot perfect, but a vast improvement over\
    \ the AbsoluteLayout’s version of the landscape screen.\n\n# USING LINEARLAYOUTS\n\
    \nWhen using the LinearLayout, the order in which you define your views is the\
    \ order in which they’re placed on the screen. First, take a look at that second\
    \ LinearLayout:\n\n```\n```xml\n<LinearLayout\n    android:layout_width=\"match_parent\"\
    \n    android:layout_height=\"wrap_content\"\n    android:orientation=\"horizontal\"\
