    \ what that looks like in my sample code:\n\n```\n    Cursor cursor = null;\n\
    \    try {\n        cursor = getContentResolver().query(\n                MediaStore.Images.Media.EXTERNAL_CONTENT_URI,\
    \ null,\n                MediaStore.Images.Media.DATE_TAKEN + \" > \"+lastUpdateTime,\n\
    \                null, null);\n    } finally {\n        if(cursor!= null)\n  \
    \          cursor.close();\n    }\n```\n\nIf this looks similar to a SQL query,\
    \ it's meant to. I'm specifying the URI that I want information about (all images).\
    \ The next parameter (to which I pass null) would be my chance to list the specific\
    \ columns I want to receive. By passing null, I've asked for all of them. Next\
    \ is the WHERE clause of the query, where I'm asking for every photo created after\
    \ the lastUpdateTime. Since I don't have any more statements, I'll leave the next\
    \ parameter null. Finally, the default sorting of results will"
