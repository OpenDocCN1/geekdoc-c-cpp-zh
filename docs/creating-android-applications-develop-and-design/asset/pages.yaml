  md: "# ALL GOOD THINGS MUST END ... HOPEFULLY\n\nAt some point, the music has to\
    \ stop—either because it’s run out of songs to play or because the user has killed\
    \ it off. My sample code includes a stop method, but because it looks almost exactly\
    \ like the play method I listed in the last section, it doesn’t bear spelling\
    \ out here. However, because I wanted the service to last beyond the run of my\
    \ activity, I’ll need to have the service close itself down. You can find the\
    \ appropriate time to shut down the service by registering it as an OnCompletionListener\
    \ with the media player. The line of code looks like this:\n\n```\n```java\nmPlayer.setOnCompletionListener(this);\n\
    ```\n```\n\nYou can call it at any point after the player is created. Of course,\
    \ your service will need to implement OnCompletionListener and have the correct\
    \ onCompletion method.\n\n```\n```java\n@Override\npublic void onCompletion(MediaPlayer\
    \ mp) {\n    stopSelf();\n}\n```\n```\n\nThis means that once the media is finished,\
    \ the service will call stop on itself, which, because of the lifecycle of the\
    \ service, will trigger Android to call the service’s onDestroy method—the perfect\
    \ place to clean up. Once the cleanup is finished, the service will be deallocated\
    \ and cease running.\n\n# CLEANUP\n\nCleanup is essential when dealing with cursors\
    \ and media players. If you don’t handle this section correctly, a lot of the\
    \ device’s memory can get lost in the shuffle. Here’s the onDestroy method where\
    \ I clean up both the cursor and the media player:\n\n```\n```java\n@Override\n\
    public void onDestroy(){\n    super.onDestroy();\n    if(mCursor != null)\n```\n\
    ```"
