- pgno: 69
  md: "# # THE VIEW CLASS\n\nNo, this isn't a television show where several women\
    \ debate the merits of common culture. The View class is the superclass for all\
    \ the Android display objects. Each and every user interface (UI) class from the\
    \ simple ImageView to the mighty RelativeLayout all subclass from this same object.\
    \ In this section, you'll learn the basics of creating, adding, and modifying\
    \ your existing layouts using Java code and XML. You'll also learn to create your\
    \ own custom view. A view, at its very core, is simply a rectangle into which\
    \ you can display something. Subclasses take many different forms, but they all\
    \ need, simply, a space to show something to the user.\n\n# ## CREATING A VIEW\n\
    \nCreating a new view is something you've already done. In Chapter 1, you added\
    \ a view to an XML layout file as part of exploring how to launch a new activity.\
    \ At the time, I told you we'd get into the specifics of how these views were\
    \ created and modified, and, well, now's the time! Let's take a look at the default\
    \ views generated for you automatically when you create a new Android project.\n\
    \n# ### VIEWS IN XML\n\nHere's what the default XML layout looks like in a new\
    \ project:\n\n```\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<LinearLayout\
    \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    android:orientation=\"\
    vertical\"\n    android:layout_width=\"fill_parent\"\n    android:layout_height=\"\
    fill_parent\"\n    >\n<TextView\n    android:layout_width=\"fill_parent\"\n  \
    \  android:layout_height=\"wrap_content\"\n    android:text=\"@string/hello\"\n\
    \    />\n</LinearLayout>\n```\n```"
  merge: -1
  img_proc: true
- pgno: 70
  md: "# HEIGHT AND WIDTH ARE REQUIRED\n\nFor now, it’s important to note that every\
    \ single layout must have a value set for both its height and its width. Android\
    \ may not fail to compile if you do not specify these values (as they could be\
    \ updated at runtime), but if it starts to draw your views and the system height\
    \ and width values are missing, then your application will crash.\n\nQuestion:\
    \ Which of the two elements (LinearLayout and TextView) in this default XML layout\
    \ are views?\n\nAnswer: Both.\n\nAll visual objects onscreen subclass from the\
    \ View class. If you go high enough in the inheritance chain, you’ll find an “extends\
    \ View” somewhere.\n\nIn the default XML layout, the Android tools have added\
    \ a simple TextView contained inside a LinearLayout. When displayed onscreen,\
    \ the contents of the hello string will appear by default in the upper-left corner\
    \ of the screen. I’ll discuss how to position visual elements onscreen later in\
    \ this chapter.\n\nTo display the XML layout onscreen, you need to call the setContentView()\
    \ method and pass the name of the layout to the activity.\n\nIn Eclipse, your\
    \ code editor, it should look like this:\n\n```\n```java\n@Override\npublic void\
    \ onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
    \    setContentView(R.layout.main);\n}\n```\n```\n\nIn this code, you’re telling\
    \ the activity that you want it to inflate and render the main layout for this\
    \ activity. By inflating, I mean the conversion from the XML file into a Java\
    \ object that can be told to draw on the screen. You might be thinking, “Is it\
    \ possible to build and display a layout and view within Java alone? Can I skip\
    \ layout in XML entirely and go straight to the source?” Yes, you can, but in\
    \ practice you shouldn’t. Even so, understanding how to build a layout without\
    \ the XML will help you potentially modify any aspect of your layout at runtime."
  merge: -1
  img_proc: true
- pgno: 71
  md: "# VIEWS IN JAVA\n\nAnything you can lay out or build in XML, you can lay out\
    \ and build also within the Java code itself; it’s just more complex. It’s important,\
    \ however, to understand what Android is doing as it inflates and builds your\
    \ layouts.\n\nHere’s what the Java code looks like to build the exact same user\
    \ interface that Android generates for you in XML when you create a new project:\n\
    \n```\npublic void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
    \    setContentView(buildLayouts());\n}\n\npublic View buildLayouts(){\n    LinearLayout\
    \ topView =\n        new LinearLayout(getApplicationContext());\n    LayoutParams\
    \ topLayoutParams =\n        new FrameLayout.LayoutParams\n        (LayoutParams.MATCH_PARENT,\n\
    \        LayoutParams.MATCH_PARENT);\n    topView.setLayoutParams(topLayoutParams);\n\
    \    TextView textView =\n        new TextView(getApplicationContext());\n   \
    \     linearLayout.LayoutParams textLayoutParams =\n            new LinearLayout.LayoutParams(\n\
    \            LayoutParams.WRAP_CONTENT,\n            LayoutParams.MATCH_PARENT);\n\
    \        textView.setLayoutParams(textLayoutParams);\n        textView.setText(R.string.hello);\n\
    \        topView.addView(textView);\n        return topView;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 72
  md: '# # SPECIAL DIMENSIONS


    You are always required to give a height and width for every view in your hierarchy.
    You may use, for these definitions in particular, four different values. They
    are:


    +   - `wrap_content` makes the view big enough to match what it contains. This
    might mean different things to different views, but the concept remains the same.

    +   - `fill_parent` and `match_parent` values actually mean exactly the same thing.
    Namely, I want the dimensions of this view to match the dimensions of my parent
    view.

    +   - `dip` or `dp` stands for device-independent pixels. This is a value that
    will give you a consistent spacing regardless of the screen density (pixels per
    inch) of the device. On the Nexus 1 or Nexus S, 1 dp ~= 1.5 pixels.

    +   - `px` stands for pixels. There are times when exact pixel values are necessary.
    I advise against using this to declare screen locations, but it''s an option.


    Let''s look at what is happening in the java code. Instead of calling setContentView
    on an ID from the R. java file, I''m passing it an instance that the LinearLayout
    object returned from the buildLayouts method. In the buildLayouts method, I''m
    first creating a new LinearLayout (passing in the application''s context) and
    a new LayoutParams object. To match what''s in the XML, the new LayoutParam is
    initialized with both the width and the height set to MATCH_PARENT. If you have
    done Android development before, you should know that MATCH_PARENT is exactly
    the same as the previously used FILL_PARENT.


    Once I have the layout parameters initialized for the top LinearLayout, I can
    pass them to the object with a setLayoutParams call. I''ve now got the LinearLayout
    configured, so it''s time to move on to building the TextView.


    This is a simple text view, so its layout parameters are very similar to those
    of its parent''s layout. The only noticeable difference is that I''m setting the
    height, when creating the layout parameters, to scale to fit the natural size
    of the TextView. (Much more on dynamic heights and widths soon.)


    Once I''ve told the TextView how it will be positioned in its parent layout via
    the layout parameters, I tell it which string I''d like to display. This string
    is defined in /res/values/strings.xml. The name attribute in XML determines what
    needs'
