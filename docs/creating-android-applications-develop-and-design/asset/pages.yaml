- pgno: 224
  md: '![](img/47ad0ac10bf11125744ef22c945d3099_224_0.png)


    One of the chief benefits of building any mobile application is the ability to
    provide location-aware data to users. Android is no exception. Taking advantage
    of your user’s location to help them make informed decisions should always be
    in the back of your mind. There is, however, a little to know about the basics
    of determining and using the device’s location. I will show you a few tricks for
    speedy acquisition and then quickly show you how to display Android’s built-in
    Google Maps view.'
  merge: -1
