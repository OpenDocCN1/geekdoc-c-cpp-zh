- pgno: 151
  md: "This method call does two things of note. First, it creates a new custom Twitter\
    \ JSONAdapter, which I’ll show you how to create in a minute. Second, it creates\
    \ a TwitterAsyncTask and fires it off.\n\nYou’ll have noticed, if you were watching\
    \ closely, that I created a private data member to contain the Twitter-fetching\
    \ task. You astute readers might be wondering why I chose to stash it aside that\
    \ way. The answer is that because this task isn't happening on the main thread,\
    \ I need to be able to cancel it should the user close down the activity before\
    \ the task finishes. To do this, the onStop method will need to be able to call\
    \ the Twitter-fetching AsyncTask, making it a private data member.\n\n# ## GETTING\
    \ TWITTER DATA\n\nMy first task, at least when it comes to doing work, is to load\
    \ the stream of Twitter messages. You should, thanks to the previous chapter,\
    \ be very familiar with the ins and outs of fetching network data. Thanks to your\
    \ amazing proficiency, I’m going to hide the code required to do a network call\
    \ and read it into a string. If you’re having trouble remembering how to do this,\
    \ feel free to check out the sample code. Without further preamble, here’s what\
    \ my TwitterAsyncTask looks like:\n\n```\n```java\nprivate class TwitterAsyncTask\
    \ extends\n    AsyncTask<String, Integer, JSONArray>{\n    @Override\n    protected\
    \ JSONArray doInBackground(String... params) {\n        String response = getURLContents(params[0]);\n\
    \        try {\n            return new JSONArray(response);\n        } catch (JSONException\
    \ ex) { return null; }\n    }\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 152
  md: "```\n```java\n@Override\nprotected void onPostExecute(JSONArray response){\n\
    \    if(response == null)\n        return;\n    try{\n        ((TwitterJSONAdapter)getListAdapter())\n\
    .setData(response);\n        getListView().setVisibility(View.VISIBLE);\n    \
    \    View loading = findViewById(R.id.loading_text);\n        if(loading!=null)\n\
    \            loading.setVisibility(View.GONE);\n    }catch(Exception e){\n   \
    \     Log.e(\"TwitterFeed\", \"Failed to set Adapter\");\n    }\n}\n```\n```\n\
    \n# # HANDLING EXCEPTIONS\n\nIt's always a good idea to print out the cause of\
    \ any particular exception when it's caught. This is, at its core, just Java best\
    \ practices. If an exception comes through and you're not printing it to Android's\
    \ LogCat tool, things can get very confusing, very fast. When beginners have trouble\
    \ debugging a problem, it's often because they're catching and releasing exceptions\
    \ that contain important information."
