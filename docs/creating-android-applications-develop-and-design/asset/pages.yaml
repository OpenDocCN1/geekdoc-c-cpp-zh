    );\n}\n```\n```\n\n> > **NOTE:** If the Twitter URL in the earlier code listing\
    \ isn't working, I've stashed a backup copy of the data at http://wanderingoak.net/twitter_backup.json.\
    \ If Twitter changes their API, you can always run the sample code against that\
    \ URL.\n\n![](img/47ad0ac10bf11125744ef22c945d3099_150_0.png)"
  merge: -1
