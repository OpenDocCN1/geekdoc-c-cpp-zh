  md: "# THE CLEANUP\n\nAt this point, you’ve created the cache file, retrieved it\
    \ from the web, and written it to the aforementioned cache file. It’s time to\
    \ notify anyone who might be listening that the image is available. Here’s the\
    \ contents of the notifyFinished method that will tell the system both that the\
    \ image is finished and where to get it.\n\n```\n```java\npublic static final\
    \ String TRANSACTION_DONE =\n        \"com.haseman.TRANSACTION_DONE\";\n\nprivate\
    \ void notifyFinished(String location, String remoteUrl){\n    Intent i = new\
    \ Intent(TRANSACTION_DONE);\n    i.putExtra(\"location\", location);\n    i.putExtra(\"\
    url\", remoteUrl);\n    ImageIntentService.this.sendBroadcast(i);\n}\n```\n```\n\
    \nAnyone listening for the broadcast intent com.haseman.TRANSACTION_DONE will\
    \ be notified that an image download has finished. They will be able to pull both\
    \ the URL (so they can tell if it was an image it actually requested) and the\
    \ location of the cached file.\n\n# RENDERING THE DOWNLOAD\n\nIn order to interact\
    \ with the downloading service, there are two steps you’ll need to take. You’ll\
    \ need to start the service (with the URL you want it to fetch). Before it starts,\
    \ however, you’ll need to register a listener for the result broadcast. You can\
    \ see these two steps in the following code:\n\n```\n```java\npublic void onCreate(Bundle\
    \ extras){\n    super.onCreate(extras);\n    setContentView(R.layout.image_layout);\n\
    \    IntentFilter intentFilter = new IntentFilter();\n        intentFilter.addAction(ImageIntentService.TRANSACTION_DONE);\n\
    \    registerReceiver(imageReceiver, intentFilter);\n}\n```\n```"
