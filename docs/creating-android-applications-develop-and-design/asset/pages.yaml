- pgno: 184
  md: '![](img/47ad0ac10bf11125744ef22c945d3099_184_0.png)


    Android devices have hundreds of different hardware configurations, from advanced
    TVs to very basic phones. Writing an application that runs perfectly across the
    whole spectrum can seem like a daunting task. Android, fortunately, provides many
    tools to handle the ecosystem on which it runs. In this chapter, I’ll show you
    how to leverage Android’s layout folder hierarchy system, configure your manifest
    to ensure that your application is available only to phones that can run it correctly,
    and handle older versions of the Android SDK. Android’s diversity can be a challenge,
    but I’ll show you how to use the available tools to make it a manageable one.
    This chapter covers the secrets of the res/ folder; weeding out devices with the
    manifest; and accommodating older phones with reflection.'
  merge: -1
  img_proc: true
- pgno: 185
  md: "# UNCOVERING THE SECRETS\nOF THE RES/ FOLDER\n\nEarlier, I gave you a basic\
    \ mapping of what goes where in the res/ folder. In this section, I'll show you\
    \ its more advanced functions. As always, you can either code this yourself or\
    \ follow along from the sample code posted at Peachpit.com/androiddevelopanddesign.\n\
    \n# LAYOUT FOLDERS\n\nThe layout folders are the source of the first tool at your\
    \ disposal, and it's one of the best. Android will, if configured correctly, pick\
    \ layout files from a folder that matches the hardware configuration closest to\
    \ the one it's running on. Using this tool, you can define multiple screen layouts\
    \ for any number of different hardware configurations. Let's start with something\
    \ simple: landscape mode.\n\nLet's say you have a simple screen with two buttons.\
    \ Let's take a look at the layout XML that produced the two buttons.\n\n```\n\
    ~~~xml\n<RelativeLayout>\n<!--Text view for question and relative layout params\
    \ omitted-->\n<Button\n    android:padding=\"15dp\"\n    android:gravity=\"center\"\
    \n    android:id=\"@+id/yes_button\"\n    android:layout_marginLeft=\"30dp\"\n\
    \    android:layout_marginRight=\"30dp\"\n    android:layout_width=\"fill_parent\"\
    \n    android:layout_height=\"wrap_content\"\n    android:layout_above=\"@+id/no_button\"\
    \n    android:text=\"@string/yes_button_text\"\n    />\n<Button\n    android:padding=\"\
    15dp\"\n    android:gravity=\"center\"\n    android:id=\"@+id/no_button\"\n~~~\n\
    ```"
  merge: -1
  img_proc: true
