- pgno: 198
  md: "# # REFLECTING YOUR TROUBLES AWAY\n\nThe solution for this problem, and indeed\
    \ all problems with later declared SDK methods, is to access them using reflection.\
    \ Reflection allows you to use Java methods without explicitly defining or including\
    \ them in your code. It's perfect for handling these kinds of situations.\n\n\
    Ideally, I'd like to call apply if it's available (SDK 9 and higher) but fall\
    \ back to commit if apply is going to cause problems. Here's the new version of\
    \ setUsername to do exactly that:\n\n```\n```java\npublic void setUsername(String\
    \ username){\n    SharedPreferences prefs =\n        PreferenceManager.getDefaultSharedPreferences(this);\n\
    \    Editor ed = prefs.edit();\n    ed.putString(\"username\", username);\n  \
    \  try{\n        Method applyMethod =\n            Editor.class.getDeclaredMethod(\"\
    apply\",\n                new Class[]{});\n        if(applyMethod != null)\n \
    \           applyMethod.invoke(ed, new Object[]{});\n        else\n          \
    \  ed.commit();\n    }catch(Exception error){\n        ed.commit();\n    }\n}\n\
    ```\n```\n\nWhile this method starts the same as the previous one—getting the\
    \ Editor and using it to save the string—it diverges when it comes time to save\
    \ that username."
  merge: -1
  img_proc: true
- pgno: 199
  md: 'Reflection can throw several different errors (the major one to look out for
    is NotFoundException), so the reflection calls will need to be wrapped in a try
    catch block. I''m first requesting the apply method from the Editor class. If
    I get it (and it isn''t null), it doesn''t throw an exception, and the lunar phase
    is exactly right), I''ll then be able to invoke it (again through the reflection
    call) and we''re done. If it isn''t found as part of the SharedPreferences Editor
    class, I''ll fall back on calling commit. Reflection allows me to define and use
    methods that may not be compiled into earlier versions of the SDK.


    # ALWAYS KEEP AN EYE ON API LEVELS


    In the Android documentation, each class and method has a small gray label reading
    "Since: API Level #" on the right-hand side. If that number is higher than the
    system you''d like to support, you may need to re-evaluate using that class or
    method.


    Reflection allows you to have the best of both worlds. You can use these latest
    methods on newer devices that support them, while gracefully degrading on devices
    that don''t.


    Keep in mind, however, that reflection is slow and potentially error prone, so
    use it sparingly and with care. If you''re going to be frequently using a class
    or method that has two different implementations (Contacts, for example), consider
    using conditional class loading instead. That is, write two Adapter classes for
    each version of the class (one for the old, one for the new), and use whichever
    one is supported. You can always find out which SDK your device is running by
    checking android.os.Build.Version.SDK.'
  merge: -1
  img_proc: true
