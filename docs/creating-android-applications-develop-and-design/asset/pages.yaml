- pgno: 210
  md: 'Music playback, in general, revolves around the MediaPlayer class. This is
    in a sense very similar to what you''ve just done with the video view (except
    you don''t need a View object to render into).


    Media players, if used to play music, should end up in their own services, with
    one notable exception: games and application sound effects. Building a sound effect
    example will make for a very simple way to get into the basics of audio playback.


    # MEDIAPLAYER AND STATE


    You do not simply walk into Mordor. Similarly, you do not simply run about playing
    things willy-nilly. It requires care, attention to detail, and an understanding
    of the media player''s states. Here they are, in the order you''re most likely
    to encounter them:


    +   - Idle. In this state, the MediaPlayer doesn''t know anything and, consequently,
    cannot actually do anything. To move on to the initialized state, you''ll need
    to tell it which file it''s going to play. This is done through the setDataSource
    method.

    +   - Initialized. At this point, the media player knows what you''d like it to
    play, but it hasn''t acquired the data to do so. This is particularly important
    to understand when dealing with playing remote audio from a URL. Calling prepare
    or prepareAsync will move it into the prepared state. It will also load enough
    data from either the file system or the Internet to be ready for playback.

    +   - Prepared. After calling prepare or prepareAsync (and getting a callback),
    your media player is ready to rock! At this point, you can call seek (to move
    the playhead) or start (to begin playback).

    +   - Playing. Audio is pumping, people are dancing (OK, maybe not), and life
    is good. In this state, you can call pause to halt the audio or seek to move the
    play position. You end the party by calling stop, which will move the media player
    back to the initialized state.


    Just because you''ve run out of media to play doesn''t mean your player drops
    into the idle state. It will keep the current file loaded if you want to call
    start (which will restart the audio from the beginning) or seek (to move the playhead
    to a particular place). Only when you call stop or reset does the MediaPlayer
    clear its buffers and return to the initialized state, ready for you to call prepare
    again.'
  merge: -1
  img_proc: true
- pgno: 211
  md: "# PLAYING A SOUND\n\nAt its most straightforward, media playback is actually\
    \ quite easy. Android gives you helper methods to shepherd your media player from\
    \ the idle state to the prepared state if you can specify a file or resource id\
    \ right away. In this example case, you can record your own WAV file or use the\
    \ beeeep file that I included in the example project. I’ve added the file to the\
    \ newly created `/res/raw/` folder so the application can load it directly.\n\n\
    Further, I’ve added a button (which you should be a pro at by now) that, when\
    \ pressed, will play the recorded audio. Once the button is defined (id `beep_button`)\
    \ in the `main.xml` layout file and the audio `beeeep.wav` file is placed in the\
    \ `raw/` folder, the following code should work like a charm:\n\n```\nMediaPlayer\
    \ mBeeper;\n\n@Override\n    public void onCreate(Bundle savedInstanceState) {\n\
    \        super.onCreate(savedInstanceState);\n        setContentView(R.layout.main);\n\
    \        Button beep = (Button)findViewById(R.id.beep_button);\n        beep.setOnClickListener(this);\n\
    \        mBeeper =\n        MediaPlayer.create(getApplicationContext(), R.raw.beeep);\n\
    \    }\n```\n\nAs you can see, I’m retrieving the `beep_button` from the `main.xml`\
    \ layout (which I told the activity would be my screen’s layout) and setting my\
    \ activity as the click listener for the button. Last, I use the media player’s\
    \ create helper method to initialize and prepare the media player with the `beeeep.wav`\
    \ file from the `raw/` directory.\n\n# PLAYING A SOUND EFFECT\n\nRemember that\
    \ loading media, even from the `res/` folder, can take some time. With this in\
    \ mind, I’ve added the media player as a private data member to my Activity class.\
    \ This means I can load it once in my onCreate method and then use it every"
  merge: -1
  img_proc: true
- pgno: 212
  md: "time the user presses the button. Speaking of button pressing, here's the code\
    \ to play the sound effect when the button is pressed:\n\n```\n~~~java\n@Override\n\
    public void onClick(View v) {\n    mBeeper.start();\n}\n~~~\n```\n\n# ## CLEANUP\n\
    \nIn order to be a good citizen, there's one more step you need to remember to\
    \ take: releasing your resources! That's right, when your activity closes down,\
    \ you need to tell the media player that you're finished with it, like so:\n\n\
    ```\n~~~java\n@Override\npublic void onDestroy(){\n    if(mBeeper != null){\n\
    \        mBeeper.stop();\n        mBeeper.release();\n        mBeeper = null;\n\
    \    }\n}\n~~~\n```\n\nChecking for null before performing the cleanup is a good\
    \ precaution. If, for whatever reason, there isn't enough memory to load the resource\
    \ or it fails for another reason, you won't have any null pointer exceptions on\
    \ your hands.\n\n# ## IT REALLY IS THAT SIMPLE\n\nThere's nothing complex about\
    \ simple sound effect playback. Once you have a media player in the prepared state,\
    \ you can call start on it as many times as you like to produce the desired effect.\
    \ Just remember to clean it up once you're finished. Your users will thank you\
    \ later. Now let's move on to something a little more tricky."
