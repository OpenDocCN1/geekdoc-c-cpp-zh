  md: "```\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<LinearLayout\n  \
    \  xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    android:layout_width=\"\
    match_parent\"\n    android:layout_height=\"match_parent\"\n    android:orientation=\"\
    vertical\">\n        <TextView\n        android:layout_width=\"match_parent\"\n\
    \        android:layout_height=\"0dp\"\n        android:layout_weight=\"1\"\n\
    \        android:text=\"@string/main_menu\"\n        android:gravity=\"center\"\
    \n        android:textSize=\"40dp\"/>\n    <ListView\n        android:id=\"@android:id/list\"\
    \n        android:layout_width=\"fill_parent\"\n        android:layout_height=\"\
    0dp\"\n        android:layout_weight=\"1\"\n    android:gravity=\"center\"/>\n\
    </LinearLayout>\n```\n```\n\n> **TIP:** Special IDs: You only need to call the\
    \ android:id/list ListView if you're using the built-in convenience methods of\
    \ ListActivity. if you're using a regular activity, you can use any ID you want.\
    \ This special ID is what connects the ListActivity to the single ListView with\
    \ which it is going to interact."
