- pgno: 203
  md: "# MOVIES\n\nMovie playback on an Android device boils down to the VideoView\
    \ class. In this section, I'll use a simple example application that will play\
    \ through every video saved on a phone's SD card. Here is the general process:\n\
    \n+   - I'll use the ContentProvider (something you'll remember from our brief\
    \ discussion in Chapter 6 when we uploaded the most recent photo) to request every\
    \ video saved to the user's external card.\n+   - After loading a Cursor (Android's\
    \ query result data object) with all the device's videos, I'll need a method to\
    \ play the next one.\n+   - I'll set up an activity as a listener so that when\
    \ video playback is complete, I can call my playNextVideo method and move on to\
    \ the next video in the cursor.\n+   - Last, I'll clean up after my cursor when\
    \ the user leaves the playback screen.\n\nBefore I can do any of these things,\
    \ however, I need to place a VideoView on my main layout to work with.\n\n# ADDING\
    \ A VIDEOVIEW\n\nPlacing a VideoView onscreen is as simple as adding it to your\
    \ XML layout. Here's what my main.xml file now looks like:\n\n```\n<?xml version=\"\
    1.0\" encoding=\"utf-8\"?>\n<LinearLayout xmlns:android=\"http://schemas.android.com/\n\
    \    apk/res/android\"\n    android:orientation=\"vertical\"\n    android:layout_width=\"\
    match_parent\"\n    android:layout_height=\"match_parent\"\n    >\n<VideoView\n\
    \    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
    \n    android:id=\"@+id/my_video_view\"\n    />\n</LinearLayout>\n```"
  merge: -1
  img_proc: true
