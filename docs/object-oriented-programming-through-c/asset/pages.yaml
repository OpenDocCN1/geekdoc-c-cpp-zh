    # 4.1. CONSTRUCTORS AND DESTRUCTORS


    When a variable is declared and if not initialized, it contains garbage value.
    C++ provides built-in special member functions called constructor and destructor.
    When an object is created, constructor will be executed automatically with the
    helper of constructor, the member values will be initialized. A constructor will
    have exactly the same name as the class and it does not have any return type at
    all, not even void. The default constructor does not have any parameter.


    The destructor is executed whenever an object of its class goes out of scope or
    whenever the delete expression is applied to a pointer to that of class. It is
    executed at the end of the function. The destructor is called by ~ (tilde) operator.
    Destructor returns neither a value nor can take any parameters. It is useful for
    closing files, deleting the memory etc. Declaring the constructor and destructor
    is optional.


    The constructor and destructor declared as private are called private constructor
    and destructor. The private constructor and destructor are automatically executed
    when an object is created and when an object goes out of scope. They will be called
    explicitly but not implicitly. If the constructor uses recursion, then it is called
    as recursive constructor. We can use dynamic operator new for constructor and
    delete for.


    Example:


    ```

    #include<iostream>

    #include<iostream>

    ```'
