  md: '# OBJECT ORIENTED PROGRAMMING THROUGH C++


    +   - A constructor is a special type of member function within a class. The constructor
    will be executed automatically whenever the object is created. The name of the
    constructor should be the same as the class name.


    +   - A destructor is also a special type of member function within a class. The
    destructor will be executed automatically whenever the object is destroyed. The
    destructor name is also the same as its class name by ~.


    +   - Constructor with the arguments is called parameterized constructor.


    +   - A copy constructor will copy the properties of one object to another object.


    +   - An object without a name is called as anonymous object.


    +   - Overloading allows multiple functions with the same. In C++, function overloading
    and operator overloading are allowed.

    - operator overloading is allowed.


    +   - The function overloading can give multiple forms of a normal function or
    a member function.


    +   - Constructors can be overloaded but destructors cannot be overloaded.


    +   - The operator overloading is allowed with the ''operator'' keyword,


    +   - In C++, both unary and binary operators can be overloaded. To overload a
    unary operator, only argument is sufficient to overload a binary operator, two
    arguments are required.


    +   - In Inheritance, the properties of base class are inherited into derived
    class. There are various types of inheritance, viz., simple, multiple, multilevel,
    hierarchical and hybrid ext.


    +   - The virtual base class will avoid the duplication of properties during inheritance
    process.


    +   - For an abstract class, objects are not created.


    +   - A class inside another class is called as nested class. The outer class
    is called as iterator and inner class is called as nested class.


    +   - This pointer is used to point the current object.


    +   - A class pointer can point to both base class and derived class objects.


    +   - In C++, static and dynamic bindings are allowed. The static binding is supported
    with function and operator overloading. The dynamic binding is supported with
    the virtual functions.


    +   - A virtual function without any definition is called as pure function.


    +   - In C++, the genericity feature is supported with template. A template can
    handle various types of data. The template for a function is called function template
    and the template for a class is called class template.


    +   - Macros are not safe to use, whereas template is safe to use.


    +   - In C++, the exceptions raised at run time can be handled with the try-catch
    block. The try block will raise an exception and the raised exception is handled
    by the catch block. Any exception can also be externally generated by the throw
    keyword.


    +   - Multiple catch blocks are allowed.'
