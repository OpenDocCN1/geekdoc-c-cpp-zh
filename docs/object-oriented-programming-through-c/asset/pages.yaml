    internal details.

    - **Data Encapsulation:** Packing data and functions at a single place.

    - **Data Hiding:** It is operated with access specifiers.

    - **Default constructor:** Constructor with default value arguments.

    - **Delegation:** Supports ''has a'' relationship.

    - **deque:** Similar to vector can perform both sequential read and write operations.

    - **dereferencing operator:** Gets the value of the address pointed by the pointer.

    - **Derived constructor:** Created from various sequence constructors.

    - **Derived type:** Derived from the basic data types.

    - **Destructor:** Automatically executed when an object is deleted.

    - **Dynamic or Late Binding:** Binding at runtime.

    - **Empty class:** Class without any member or function members.

    - **Exceptions:** Problem arises during the execution of the program and can be
    handled.

    - **Friend function:** Can access the private members of a class.

    - **Function Overloading:** Multiple Functions with the same name.

    - **Function template:** Template for the arguments, local variables and arguments
    of a function.

    - **Genericity:** Allows to handle multiple data type values.

    - **Hierarchical inheritance:** Having one base class and derived classes.

    - **High level program:** Program with user-friendly operations.

    - **Hybrid inheritance:** Combination of one or more types of inheritance.

    - **Inheritance:** Deriving properties of one class to another.

    - **Interpreter:** Reads a line of input high level program and converts it into
    machine code.

    - **Iterators:** Connect container and algorithm.

    - **List:** Bidirectional sequence container.

    - **Local class:** A class declared inside a function.

    - **Machine level Program:** Program with only 0s and 1s.

    - **Macro:** A string that the compiler replaces with the defined value.

    - **Member:** Variable declared in a class.

    - **Member Function:** Function declared in a class.

    - **Member function overloading:** Within a class, multiple functions with the
    same name.

    - **Message Passing:** Allows objects to communicate.

    - **Method:** Function declared in a class.

    - **Multilevel inheritance:** Having one base class derived into a class where
    this class properties are derived into another class.

    - **Multiple inheritance:** Having two or more base classes and one derived class.

    - **Namespace:** Groups unique symbols and identifiers.

    - **Nested class:** A class defined within a class.

    - **Object:** Instance of the class.

    - **Object-based Programming Language:** Supports all OOPs principles except inheritance
    and polymorphism.'
