  md: '# Glossary


    +   - Abstract class: Object creation is not allowed.

    - Access Specifier: Defines the scope of all properties of a class.

    - Address operator: Gets the address of the variable.

    - Algorithms: supports sequential, parallel and parallel+ execution policies.

    - Anonymous object: Object without name.

    - Array: Used to store similar type of data in sequential memory.

    - Assembler: Converts the assembly language program to machine code.

    - Assembly level Program: Program with short codes of operation.

    - Associative container: Expanded to get their elements by values.

    - Asynchronous exceptions: Keyboard interrupts.

    - Base class pointer: Can access the properties of both base class and derived
    class.

    - Basic data type: Primitive data types viz., int, char, float etc.

    - Binary operator: Operator with two operands.

    - Binding: Mapping the code to the machine code.

    - Call by pointer: The address of actual arguments is passed from one function
    to another function.

    - Call by Reference: Reference of actual arguments is passed from one function
    to another function.

    - Call by value: Actual arguments are passed from one function to another function.

    - Catch: The raised exception.

    - Class: Logical representation of real time entity.

    - Class template: Template defined for the properties of the class.

    - Compiler: Read the complete high level program and converts it into machine
    code.

    - Const class: Member value will not be changed when moved to new machines or
    compilers.

    - Constant member function: Cannot modify the values.

    - Constructor: Automatically executed when an object is created.

    - Constructor overloading: Multiple constructors within a class.

    - Containers: Represent the collection of various objects or elements.

    - Copy constructor: Copies all the properties of one object to another object.

    - Data Abstraction: Represents only crucial information by suppressing internal
    details.'
