  md: '![](img/1ecdffe422a785b44c35b892c43c7da2_9_0.png)


    Fig. 1.2 Object Oriented Approach.


    One of the popular procedural programming languages is C. Based on this language
    structure, C++ (object oriented) programming language is developed. There are
    several differences between these two languages and are listed in Table 1.1.


    Table 1.1 Differences between C and C++ programming languages.


    | C | C++ |

    |---|---|

    | Procedure-oriented language | Object Oriented language |

    | Follows top down approach | Follows bottom up approach |

    | Functions are primary components | Objects are the primary components |

    | Difficult for data map with functions | Easy for data map with functions |

    | Higher importance is not given to data | Higher importance is given to data
    |

    | Addition of new components is complex | Addition of new components is easy |

    | Modifications are complicated | Modifications are easy |

    | Less secure to data | More secure to data |

    | No virtual functions are present in C | The concept of virtual functions is
    used in C++ |

    | Identification of data is difficult | Identification of data is easy |

    | Polymorphism is not possible | Polymorphism is allowed in C++ |

    | Overloading is not possible | Overloading is possible |

    | Inheritance is not possible | Inheritance is possible |

    | Exception handling is not allowed | Exception handling is allowed |

    | Examples are: C, VB, FORTRAN, Pascal. | Examples are: C++, JAVA, VB.NET, C#.NET.
    |'
