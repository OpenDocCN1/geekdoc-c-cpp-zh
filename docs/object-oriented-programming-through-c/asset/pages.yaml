  md: '# # Introduction to C++ Chapter 1


    This chapter gives the need of Object Oriented approach than the conventional
    approach and overview of the fundamental characteristics of the object oriented
    programming language. In addition, you will be introduced to the steps necessary
    for creating a fully functional C++ program.


    # 1.1. GENERATIONS OF PROGRAMMING LANGUAGES


    A programming language contains set of instructions to be executed by the computer.
    All the programming languages are divided into five generations as listed below:


    +   (i) Machine language is the first generation programming language. In this
    generation, an instruction is written in terms of 0s and 1s computer can directly
    understand the machine code, so the execution speed is high. But for the programmer,
    it is difficult to write the machine code programs and the time to write these
    programs is very high.

    (ii) To overcome the problem of first generation programming languages, the 2nd
    generation programming languages use Assembly language. In this language, an instruction
    contains short codes of the operation code. These codes are called as ‘mnemonics’.
    The mnemonics cannot be directly executed by the computer. For this ‘assembl’
    is required. An assembler will convert the assembly instruction to machine code.
    When compared with the execution of machine language instruction, the assembly
    language instruction will take more time but complexity of writing programs in
    assembly language is reduced. The reduction of the complexity of writing programs
    is required.

    (iii) To reduce the complexity of assembly languages, high level languages are
    introduced in the 3rd generation of programming languages. These can be classified
    as procedural or object oriented. These languages require either compiler or translator
    for converting into machine code. C is the popular procedural programming language;
    C++ and Java are the popular object oriented programming languages.'
  merge: -1
  pgno: 7
- img_proc: true
  md: '# OBJECT ORIENTED PROGRAMMING THROUGH C++


    (iv) The 4th generation languages are called as very high level programming languages.
    These languages are mainly dedicated for specified domains and reduce the execution
    time. These require a learning stage. These are dedicated for software developments
    and statistical analysis. R, SQL, MATLAB, ColdFusion etc. are the popular 4th
    generation programming languages.


    (v) The 5th generation programming languages are also called as natural languages.
    These have human speech-based controlling languages. These are used for designing
    desktop, mobile, web applications, and games.


    From this view, it is clear that the professional software developer should have
    capabilities to develop programs in any generation languages. The book discusses
    about 3rd generation languages and particularly C++, C++ is a prevailing language
    based on C programming language. It becomes popular for designing desktop, mobile,
    web applications, and games.


    # 1.2. DIFFERENCE BETWEEN C AND C++


    The third generation programming languages are further divided into two categories.
    (i) procedural languages (ii) object oriented languages. The procedural language
    consists of a list of instructions. To reduce the size of program, it is divided
    into various functions and modules (also called as structured programming). With
    this approach, the large programs become overcomplex. This happens because of
    poor model and functions with unrestricted access to the global data as shown
    in Fig. 1.1.


    ![](img/1ecdffe422a785b44c35b892c43c7da2_8_0.png)


    Fig. 1.1 Procedure-Oriented Approach.


    In a large program with n sub-functions, if all the functions have access to global
    variables to read and write, then it may not be easy to identify the function
    that modifies the global variable or sometimes, even the updated value is also
    unknown to the functions. To overcome these problems, object oriented programming
    languages are introduced. In object oriented programming languages, real world
    modeling is followed. The principle of object oriented languages is to combine
    both data and the functions that operate on data into a single unit called as
    an object.'
