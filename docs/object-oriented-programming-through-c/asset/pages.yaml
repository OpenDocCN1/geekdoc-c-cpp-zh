  md: '# 6.2.1. Public Inheritance


    When a class is derived publicly, all the public members of the base class can
    be accessed directly in the derived class. When a class is derived privately,
    all the private members of the base class can be accessed only with the public
    member functions of base class.


    # 6.2.2. Private Inheritance


    The object of privately derived class cannot access the public members of the
    base class directly. Hence, member functions are used to access the members.


    # 6.2.3. Protected Data with Private Inheritance


    The protected is same as private but it allows the derived class to access the
    private members directly.


    Table 6.1 Access Specifiers with their scope


    | Base class access mode | Derived class access mode | |

    | --- | --- | --- | --- |

    | Public | Private derivation | Public derivation | Protected derivation |

    | Private | Private | Not inherited | Not inherited | Not inherited |

    | protected | Private | Protected | Protected |


