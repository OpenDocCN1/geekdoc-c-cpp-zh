    # 1.6 KEY CONCEPTS OF OBJECT ORIENTED PROGRAMMING


    # 1.6.1 Objects


    Object is prime concept of object oriented programming. In general, they represent
    real time entities (birds, animals and flowers) or user-defined data (list, vector
    and time etc.) to be handled by the program. In OOPs, more security is provided
    to data with the help of objects. For each object memory is allocated, so one
    object has its own set of data copies. Within a program, communication is allowed
    only between objects.


    Memory is allocated for each object. Every object has its own memory space for
    storing its properties or features. The action of the object depends upon the
    member function defined within its class. When a program is executed, the objects
    interact by sending messages to each other. Representation of object is shown
    Fig.1.5. In this figure, for a program entity, if three objects are created, then
    memory will be allocated for these three copies and the information (also called
    as member value) of each object can be varied.


    ![](img/1ecdffe422a785b44c35b892c43c7da2_12_0.png)


    Fig.1.5 Multiple Objects for a Single Program Entity.


