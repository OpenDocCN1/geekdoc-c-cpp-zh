    # setf()


    It is used to set various flags for formatting output. There are two ways to use
    setf(). They are

    long setf(long) – sets the flags according to those marked in the long long.


    Long setf(long sb, long f) – the bits according to that marked in variable f are
    removed

    and reset to those marked in variable sb.


    # unsetf()


    It is used to remove the flag settings.


    # Bitfields


    The ios class contains setf() member function. The flag indicates the format design.
    The unsetf()

    function is used to clear the flags. The syntax with two flags V1 and V2 are


    ```

    cout.setf(V1,V2);

    ```


    The following table describes the flag and bit field setting that can be used
    with this function.


    | Format | Flag (V1) | Bit Field (V2) |

    | --- | --- | --- |

    | Left Justification | ios::left | ios::adjustfield |

    | Right Justification | ios::right | ios::adjustfield |

    | Padding After Sign & Base | ios::internal | ios::adjustfield |

    | Scientific Notation | ios::scientific | ios::floatfield |

    | Fixed Point Notation | ios::fixed | ios::floatfield |

    | Decimal Base | ios::dec | ios::basefield |

    | Octal Base | ios::oct | ios::basefield |

    | Hexadecimal Base | ios::hex | ios::basefield |'
