  md: '# 5. 4. RULES FOR OVERLOADING OPERATORS


    +   - Overloading of an operator cannot change the natural meaning of operator.

    - The overloaded operator should contain one operand of user-defined data type.
    Overloading operators are only for classes. We can''t overload the operator for
    built-in data types.

    - Overloaded operators have the same syntax as the original operator.

    - There is no higher limit to the no. of overloading for any operator. An operator
    can be overloaded for a number of times if the arguments are different in each
    overloaded operator function.

    - Operator overloading is applicable within the scope in overloading occurs.

    - Only existing operators can be overloaded. We cannot create a new operator.

    - Some operators cannot be overloaded. They are


    | Operator (Non-Overloadable) | Description |

    |--- |--- |

    | * | Member Operator |

    | -- | Pointer to member operator |

    | :: | Scope access operator |

    | ?: | Conditional operator |

    | sizeof() | Size of operator |

    | # and ## | Preprocessor operator |


    In C++, non-overloadable operators with friend function are


    | Operator | Description |

    |--- |--- |

    | () | Function Call delimiter/operator |

    | = | Assignment Operator |

    | [] | Subscribing Operator |

    | → | Class Member Access Operator |


    # 5. 5. OVERLOADING UNARY OPERATOR


    ++, -- and - are called unary operators. These operators have single operand only.
