  md: '# Appendix B - Files in C++


    # B I. INTRODUCTION


    The information transfer in computer world is performed in the form of files.
    The files can be written, read or uploaded depending upon the application. Secondary
    storage devices such as floppy disks, hard disks, etc., are used to store the
    data in the form of files. The file names are unique and are used to identify
    the file. No two files have the same name in the same directory. There are various
    types of files such as text files, program files, data files and executable files,
    etc.... Data communication is performed between program and output devices or
    files. File streams are used to carry the communication among various devices.
    The ‘stream’ indicates a flow of data in sequential bytes. The input stream brings
    data to the program and the output stream collects data from the program. So,
    the input stream extracts data from the file and transfers it to the program while
    the output stream stores data into the file provided by the program.


    | File | Input Stream | C++ Program |

    |---|---|---|

    | | Output Stream | |


    # B.II. FILE STREAM CLASSES


    In C++, the streams are controlled using classes. The file operations are either
    ‘Read’ or ‘Write’. The ios class is the base class for files. All other classes
    are derived from ios class. The streambuf class has low level routines for controlling
    data buffer. The input and ostream classes control input and output functions.
    The functions get(), getline(), read() and >> operator are defined in istream
    class. The functions put(), write() and << operator are defined in ostream class.'
