  md: '# Appendix D -

    Points to Remember in C++


    +   - It is an object oriented programming language. It follows bottom up approach.
    In C++, more security is provided to data.


    +   - C++ supports all concepts of object oriented programming viz., object, class,
    method, data abstraction, data encapsulation, inheritance, polymorphism, dynamic
    binding, genericity etc.


    +   - The object-based programming languages support all concepts of object oriented
    programming except inheritance.


    +   - There are four categories of data types, viz., basic, derived, user- and
    void.


    +   - In C++, reference variable is allowed which is an alias of another memory
    location or variable.


    +   - ‘C’ language control statements, decision-making statements and loops are
    allowed in C++.


    +   - In C++, functions can be called in three different ways, viz., call by value,
    call by address and by value.


    +   - In C++, the structure is allowed to have members and member functions.


    +   - Namespace is used to group unique symbols and identifiers.


    +   - Data encapsulation is achieved with the class. For any class, memory is
    allocated only for its objects.


    +   - Data hiding is supported with three types of access specifiers, viz., public,
    private and protected.


    +   - A friend function to a class can access the private members of that class.


    +   - The constant member functions cannot modify any data in the class.


    +   - The classes without any members or member functions are called empty classes.


    +   - The constant member functions cannot modify any data in the class.


    +   - Member functions can be defined within a class or outside a class.


    +   - The scope resolution operator is used to access the public properties outside
    a class.'
