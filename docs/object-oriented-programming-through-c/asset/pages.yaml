    # 5.3. THE KEYWORD OPERATOR


    The operator overloading is another form of polymorphism. Polymorphism allows
    us to write functions for classes and operators. So, operator overloading is similar
    to function overloading. The keyword ‘operator’ defines a new action or operation
    to the operator. It is used to define a new action or operation to the operator.
    The syntax is


    ```

    returntype operator operator-symbol (parameters)

    //new definition of operator

    ```


    The keyword "operator" followed by an operator symbol, defines a new (overloaded)
    action of the given operator.


    # Example:


    ```

    number operator +(number D)

    {

    number T;

    T.x=x+D.x;

    T.y=y+D.y;

    return T;

    }

    ```


    When an operator is overloaded, the produced symbol is called as the operator
    function name. Operator functions should be either member functions or friend
    functions. A friend function requires one argument for unary operators and two
    arguments for binary operators. A member function requires no arguments for unary
    operators and two for binary operators. When the member function is called, the
    calling object is passed whereas for the friend function, it is essential to pass
    the objects by value or reference. The steps for operator overloading are


    +   (i) Define a class which is to be used with overloading operations.

