  md: '# 1.3. EVOLUTION OF C++


    C++ was developed by Bjarne Stroustrup during 1983-1985 at Bell laboratories.
    C++ is developed based on the ''C'' programming language for the UNIX platform.
    Earlier to C++, ''C with classes'' is introduced. Later, he added object oriented
    features and called as ''ARM C++''. Exceptions and templates are added and called
    ''C++''. Then the namespace, RTTI and STL features are added and called ''ISO
    C++''. With C++, various advantages are provided to allow the readability of the
    code. The development of C++ is shown in Fig. 1.3.


    ![](img/1ecdffe422a785b44c35b892c43c7da2_10_0.png)


    Fig. 1.3 Development of C++.


    # 1.4. THE OBJECT ORIENTED TECHNOLOGY


    Due to unrestricted access of functions to the global variables in the procedure-oriented
    approach, the data is not maintained securely. To overcome this, the Object Oriented
    technology is introduced. The key principle in technology is to combine both the
    data and the functions that operate on the data into a single unit. Such a unit
    is called an object. Data members of an object can be accessed only by using the
    functions of the object. Therefore, the data is hidden and is safe from accidental
    alteration. Data and functions are stored into a single entity. The functions
    of an object are called the member functions. Consider a hospital is having various
    working sections as given below.


    +   * Medical Department

    * Support Department

    * Patient Relations Department

    * Admission Department

    * Human Resources Department

    * Finance Department'
