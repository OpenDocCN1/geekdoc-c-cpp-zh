    +   (i) sets

    (ii) multisets

    (iii) maps

    (iv) multimaps


    Set and multiset are used to store data elements and the variable name is used
    as a key name. Map and Multimap store both key names and values. The values are
    associated with key names or mapped values. Multimap allows all various keys.


