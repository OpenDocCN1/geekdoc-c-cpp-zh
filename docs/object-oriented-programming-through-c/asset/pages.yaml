  md: '# Appendix A -

    Input and Output Streams in C++


    # A.I. INTRODUCTION


    C++ supports all Input and Output functions of C. It also has library functions.
    A library is a set of _obj files which are linked to the program and give additional
    support to its functions. The library is also called as iostream library. A stream
    acts as a bridge between I/O devices and the user. The standard C++ library contains
    the I/O stream functions. Stream represents a flow of sequential data in bytes.
    If the sequential data is received from input devices, then it is called as a
    Input or Destination stream. In C++, there are four types of stream as listed
    below:


    +   (i) cin: is an input stream which transfers the data from the input devices
    to the C++ program. Various predefined member functions of cin stream class are
    get(), getline(), read(), peek(), ignore(), putback(), gcount().


    +   (ii) cout: is an output stream which transfers the data from the C++ program
    to the output device. Various predefined member functions of cout stream class
    are put(), and flush().


    +   (iii) clog: clog is a control stream which transfers the control error messages
    from the buffer to the standard error device.


    +   (iv) cerr: cerr is also a control stream which catches the errors and transfers
    them to the standard error monitor device.


    # A.II. STREAM CLASS


    A stream is used to work with console and file operations. All the stream are
    available in a header file “iostream.h”. The ''iostream'' and ''ostream'' are
    derived classes of base class ''ios''. The ios stream class is derived into three
    sub-classes viz., iostream, ostream and streambuf. Both the iostream and ostream
    classes are further derived into iostream class. The streambuf class is derived
    into filebuffer class. The ios class has an ability to handle formatted and unformatted
    I/O operations. Formatting allows data representation with various settings viz.,
    number format, field width, decimal'
