    # 1.6.4 Data Abstraction


    Abstraction provides a feature to object oriented programming languages to represent
    only crucial information by excluding the internal details. A real life entity
    is a program represented efficiently only when the highlights are given by suppressing
    the background information. With this only, mapping is performed efficiently between
    object and class. Let''s take one life example of a mobile, which you can turn
    on and off, connect and call receive, adjust the volume, and add external components,
    but you do not know its internal details, that is, you do not know how it receives
    wired or wireless signals, how it translates them, and finally displays them on
    the screen. In general, data abstraction is achieved with Abstract Data type (ADT)
    i.e. class.'
