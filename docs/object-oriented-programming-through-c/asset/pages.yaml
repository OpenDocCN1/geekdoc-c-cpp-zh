    # 7.3. POINTER DECLARATION


    Pointers are variables that points to a specific address in the memory pointed
    to by another variable. The syntax for declaring a variable


    ```

    datatype*pointer-name;

    or

    datatype* pointer-name;

    ```


    Example: int *a;

    float* b;


    The ''&'' is called as reference operator and ''*'' is called as dereference operator.
    The reference operator will give the address of any memory location, whereas the
    dereference operator will give the value stored in the memory location.


