  md: 'The ios::adjustfield() is used to arrange padding to the left or right or for
    internal fill. The ios::floatfield() is used to set the floating point notation
    to scientific or fixed. The ios::basefield is used to set the notation to a decimal,
    octal or hexadecimal base. Various flags without field


    | Flag | Working |

    | --- | --- |

    | ios::showbase | Use base indicator on output |

    | ios::showpos | Display preceding positive number |

    | ios::showpoint | Show trailing decimal point and zeroes |

    | ios::skipws | Skip whitespace on input |

    | ios::unitbuf | Flush all streams after insertion |

    | ios::uppercase | Use capital characters for hexadecimal values |

    | ios::stdio | Adjust the stream with the ''C'' standard I/O |

    | ios::boolalpha | Converts bool values to text |


    # Example


    ```

    #include <iostream>


    using namespace std;

    int main()

    {

    // Decimal system

    cout.setf ( ios::dec, ios::basefield );

    cout.setf ( ios::showbase );

    cout << 100 << endl;

    cout.unset ( ios::showbase );

    cout << 100 << endl;

    //hexa decimal system

    cout.setf ( ios::hex, ios::basefield );

    cout.setf ( ios::showbase );

    cout << 100 << endl;

    cout.unset ( ios::showbase );


    cout << 100 << endl;


    return 0;

    }

    ```'
