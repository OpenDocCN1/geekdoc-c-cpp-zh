  md: '# OBJECT ORIENTED PROGRAMMING THROUGH C++


    Object oriented programming language: Follows bottom up approach.


    Operator: Keyword used for operator overloading.


    Operator overloading: Multiple operations for an operator.


    Parameterized constructor: Constructor with arguments.


    Pointer: Used to point to another memory location.


    Polymorphism: Allows multiple forms for the entity.


    Private: Scope of the member is limited to only within the class.


    Procedural language: Follows down approach.


    Protected: Scope of the member is within the class and is limited only to derived
    class.


    Public: Scope of the member includes outside and inside of the class.


    Reference Variable: Alias to another variable or memory location.


    Rethrow: Rethrows the thrown exception.


    Reusability: Allows the classes to reuse the existing code.


    Sequence container: Having one base class and one derived class.


    Single inheritance: Throws only specified exception.


    Specifying exception: Only one of the memory is created.


    Static member function: Can access all static members and functions of the class.


    Static or Early Binding: Binding performed at completion time.


    STL: Standard Template Library.


    Synchronous exceptions: Handled with a termination model.


    Template: Provides genericity feature in C++.


    This pointer: Used to point to the current object.


    throw: Handles the raised exception.


    try: Checks for raise of exception.


    Unary operator: Operator with single operand.


    User-defined data type: Groups different data types.


    Variable: Used to store the data in memory location.


    Vector: Provides more security than array. Elements can be inserted or deleted
    at random locations.


    Virtual class: Avoids the duplication of base class properties into derived classes.


    Virtual destructor: Making the base class destructor as virtual.


    Virtual function: Virtual functions of base classes must be redefined in the derived
    classes.


    Virtual table: Used to perform dynamic polymorphism.


    Void: Empty data type.


    Volatile class: Member value will be changed when the class is moved to new machines
    or compilers.'
