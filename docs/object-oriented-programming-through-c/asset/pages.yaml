    # B.IV. FILE POINTERS AND MANIPULATORS


    All file objects hold two file pointers associated with the file. These two file
    pointers provide two integer values. These values indicate exact position of file
    pointers in number of bytes in the file. These pointers are (i) get pointer (ii)
    put pointer. The get pointer is also called as input pointer and it is used in
    reading the file. The put pointer is also called as output pointer and is used
    for writing data to the file.


    When a file is opened for a reading or writing operation, the get and put pointers
    are set to the beginning of the file. Various modes allowed in C++ are


    # Read Mode


    In this mode, the get pointer is pointed to the beginning of the file. So, it
    is possible to read the file from the first character of file.


    # Write Mode


    In this mode, the put pointer is pointed to the beginning of the file. So, it
    is possible to write the data from the beginning of the file. If the specified
    file already exists, its contents will be deleted.


    # Append Mode


    In this mode, the put pointer is pointed to the end of the file. So, it is possible
    to write the data at the end of the file. If the specified file already exists,
    new file is created and put pointer is set at the beginning of the file.


