  md: '# PointersnChapter 7


    # 7.1. POINTER


    Pointers are powerful features of C++ that differentiates it from other programming
    languages like Java and Python. Pointers are used in C++ program to access the
    memory and manipulate the address. Each variable created in C++ program is assigned
    a location in the computer''s memory. To know where the data is stored, C++ has
    an ''&'' operator. The ''&'' (reference) operator gives the address occupied by
    a variable. Pointers and references are equivalent, except:


    +   A reference is a name constant for an address. Initializing the reference
    during declaration is required. Once a reference is established to a variable,
    you cannot change the reference to another variable.


    +   To get the value pointed to by a pointer, the dereferencing or indirection
    operator ''*'' is required. To assign an address of a variable into a pointer,
    the address of operator ''&'' is required. On the other hand, referencing and
    dereferencing are done on the references implicitly.


    Before dereferencing an uninitialized pointer, it is essential to assign a value
    to the pointer. If an attempt is made to dereference a pointer, it will cause
    runtime error by referencing to any other location in memory. In C++, a pointer
    can be incremented or decremented by any integer. Pointers are useful to allocate
    arrays dynamically.


    # 7.2. FEATURES OF POINTERS


    Pointers save memory space


    Pointers reduce the execution time


    Pointers provide direct access to memory and thus memory can be efficiently accessed.'
