  md: '# 1.6.5 Encapsulation


    Encapsulation allows packing the data and functions into a single entity. The
    encapsulation is achieved with class. A class is used to wrap both the data (member)
    and functions (member functions). In class, data hiding is allowed for providing
    more security to the data. With data hiding, the data access can be restricted
    and with this, the identification of data using function is easier. The data hiding
    is provided with the ‘access specifiers’. For each property of the class (member
    or member function), access specifier should be provided. The access specifier
    used in the class may be private or public. The public class properties are available
    outside the class, whereas the private class properties are available only within
    the class.


    ![](img/1ecdffe422a785b44c35b892c43c7da2_14_0.png)


    Fig. 1.8 Scope of Access Specifier.


    In Fig. 1.8, a class with public and private members is represented. The public
    member is available outside the class but the private member is available only
    within the class.


    # 1.6.6 Inheritance


    The object oriented programming allows deriving the properties of one class to
    another class and is called as inheritance. It is supported by the hierarchical
    classification of real time entities. In inheritance, the base class properties
    are derived into a class called as derived class. The advantage of this feature
    is that code reusability is allowed. With these features, the space complexity
    of the program is greatly reduced and it enhances the efficiency of the program.
    With the code reusability feature, the additional features can be easily added
    to the class and hence modifications are also easily'
