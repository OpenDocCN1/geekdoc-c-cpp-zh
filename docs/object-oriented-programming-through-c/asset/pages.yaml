  md: '# 11.7. ITERATORS


    An iterator provides the platform for communicating algorithms with the containers.
    An iterator can use increment operator for pointing to the next element and dereferencing
    operator is used for accessing the value in the container.


    The Input and Output iterators are used for sequential single-pass input or output
    operations. Forward iterators allow moving in a sequential order from begin to
    end. Bidirectional iterators are all sequential but they allow both directions.
    Random-access iterators do not support sequential, but they offer random directions.
    Various operations of iterators are


    | advance | Advance iterator (function template ) |

    |---|---|n| distance | Return distance between iterators (function template )
    |

    | begin | Iterator to beginning (function template ) |

    | end | Iterator to end (function template ) |

    | prev | Get iterator to previous element (function template ) |

    | next | Get iterator to next element (function template ) |


    # 11.8. VECTORS


    Vector is a dynamically allocated container in STL. It can store any type of data
    in a contiguous block of memory. When compared with arrays, vector provides more
    security to the data. Access of locations beyond the end of the vector will generate
    an exception.


    Various functions available are


    | swap() | Swaps the elements in the two vectors |

    |---|---|n| size() | Provides the number of elements |

    | resize() | Changes the size of the vector |

    | push_back() | Appends an element to the end |

    | pop_back() | Erases the last elements |

    | insert() | Inserts elements into the vector |

    | erase() | Erases given elements |


    # 11.9. LISTS


    List is also a popular container with constant time complexity for both insertion
    and deletion operations. It is internally implemented using doubly-linked lists.
    Links are maintained for each element with its forward and backward data elements.
    The difference between this and the forward list is, list uses doubly-linked list,
    whereas the forward list uses single-linked list. The time complexity of all operations
    of a list is found to be efficient than all the other sequence containers. So,
    list is a popular container for various algorithms such as sorting and searching
    etc. The list and forward list cannot access the element directly with its location.
    The nth element is accessed by moving in a linear fashion from current position.'
