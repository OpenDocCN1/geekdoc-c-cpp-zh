  md: '# # PREFACE


    This book aims to gain the attention of the interested reader to learn the C++
    programming language for enhancing their knowledge on object oriented programming.
    This book will definitely act as a platform for various categories of programmers
    to improve their programming skills. When compared with the procedural programming
    languages, the object oriented programming languages are OOPs are providing more
    security to the data. In OOPs, the bottom-up approach is followed. With this approach,
    the data redundancy is reduced and it is left to focus on data not on functions.


    In this book, the chapters are organized to help the reader from procedural language
    details to advanced concepts of object oriented programming. All the features
    of object oriented programming are arranged in a structured manner such that the
    reader can easily develop programs. For each chapter, sample programs are provided
    to describe the application of each topic. The command over the programming, the
    reader requires a lot of exposure to the development of programs. The Appendix
    allows the reader to gain insight of useful details such as I/O streams, files,
    additional programs and highlights. With this information, the present book becomes
    a well-organized and professional reference guide for C++ programmers.


    # ## Content Organization:


    Chapter-1 gives a detailed discussion on the differences between procedural and
    object oriented features. In this chapter, the concepts of object oriented programming
    are discussed in detail. A brief discussion on compilers for C++ is also done.
    Chapter-2 deals with the data types of C++, viz, basic, derived- and void data
    types. The control statements, loops, decision-making statements, arrays and structure
    concepts in C++ are also discussed. In this chapter, additional concepts in C++
    like namespace and exception handling are also discussed. In C++, Chapter-3 discuss
    about these three object oriented features, viz, class, access specifiers and
    scope. Various ways of defining member functions are also discussed. Among various
    member functions in a class, constructors and destructors are considered special
    functions. In Chapter-4, discussion on constructors and destructors is given.
    In this chapter, creating an object with no name, i.c., anonymous object is also
    discussed. In Chapter-5, overloading is explained in terms of function overloading
    and operator overloading. Function overloading allows multiple definitions for
    a single name of the function whereas operator overloading allows multiple definitions
    for an operator. Chapter-6 gives overview about inheritance. With inheritance,
    properties of one class will be derived into another class. Various types of inheritance
    {simple, multiple, multilevel, hierarchical and hybrid} are discussed with suitable
    examples. While applying inheritance, duplication of base class properties is
    eliminated by the virtual base class concept. So, in this chapter, virtual base
    class, abstract class (not allowing object creation) and nested class (a class'
  merge: -1
  pgno: 3
- img_proc: true
  md: 'within another class) are also discussed. Polymorphism allows multiple forms.
    There are two types of bindings and viz., static and dynamic binding. The static
    binding is implemented with function overloading and operator overloading whereas
    the dynamic binding is implemented with the virtual functions. To discuss in detail
    about virtual functions, pointers should be thoroughly revised. For this, in Chapter-7,
    an introduction to the pointer is explained clearly with its features. This chapter
    also discusses the pointer to a class, pointer to an object, pointer to inheritance
    class [pointer to base class and pointing to derived class]. In this, a special
    pointer called ''this'' pointer is also discussed about to the current object.
    In Chapter-8, implementation of dynamic binding with the virtual functions is
    discussed. Pure virtual function, i.e., a virtual function without definition
    is also discussed. The genericity property of C++ is discussed in Chapter-9. The
    templates for function and class are discussed with various examples and applications.
    Advanced features of C++, viz., exception handling and Standard Template Library
    (STL) are discussed in Chapter-10 and Chapter-11.


    # Additional Features:


    In addition to the topics covered in Chapters 1 to 11, Appendix is provided for
    providing additional information in C++. Details of I/O stream are given in Appendix-A
    and details of file stream are given in Appendix-B. The additional programs are
    given in Appendix-C and finally the points to remember in C++ are given in Appendix-D.


    Authors


