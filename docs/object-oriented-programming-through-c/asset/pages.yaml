  md: '# 1.6.8 Dynamic Binding


    Binding is a procedure to identify the specific function call. There are two types
    of binding: static and dynamic. The static binding allows the binding process
    to be performed at compile time and the dynamic binding allows the process to
    be performed at runtime or execution time. The dynamic binding is associated with
    the inheritance and polymorphism.


    # 1.6.9 Message Passing


    In object oriented programming, communication is allowed between objects. This
    communication is performed with the help of message passing operator. To use the
    message passing operator, an object should be declared for a class. The object
    can communicate with its properties with the help of message operator ((). With
    this operator, an object can communicate with its members and member functions.


    # 1.6.10 Reusability


    Reusability allows the classes to reuse the existing code. This is implemented
    with the inheritance. With the reusability of code, the space complexity of the
    program is greatly reduced. It is for extending the features of a class.


    # 1.6.11 Delegation


    Delegation is similar to the inheritance feature except that the inheritance supports
    ‘kind of’ relationship and delegation supports ‘has a’ relationship. With the
    delegation, the sub-class contains a reference to the superclass.


    # 1.6.12 Genericity


    This is a powerful object oriented feature. With this, variables can be used to
    handle various types of data. The identification of data type for a variable is
    performed at run time.


    # 1.7. ADVANTAGE OF OOP


    +   - Modification of objects is easily performed and hence they can be comfortably
    upgraded.

    - The redundant code is easily eliminated.

    - Reusability of code is allowed.

    - Data can be mapped with functions.

    - Data can be hidden and the access is restricted. So, more security to the data
    is provided.

    - Only the crucial information is revealed by covering the internal details.

    - Allows a single variable to handle multiple types of data.

    - Programs can be extended and reusable parts of programs can be upgraded.

    - It leads to the development of new software within less amount of time.'
