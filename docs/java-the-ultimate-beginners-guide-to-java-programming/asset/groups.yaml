    # Built-in String Method


    - 1. Center (width, fillchar). Along with the original string, this''ll give you
    a space-padded string consuming the total width of the columns.

    - 2. Capitalize(). This basically capitalizes the first letter of the string.

    - 3. Encode (suffix, beg=0, end=len(string)). This runs an encoded version of
    each string.

    - 4. Decode (encoding UTF-8, errors=strict). The code registered for encoding
    will be used for this method, and you''d get a default code.

    - 5. Count (str, beg=0, end=len(string)). This counts the number of times a string
    appears and begins indexing.

    - 6. Find (str, beg=0, end=len(string)). This checks whether str is on string
    or on subsequent string.

    - 7. Expandtabs(tabsize=8). Strings and tabs are then placed in multiple spaces.

    - 8. Decimal(). If Unicode string contains decimal characters, value returns as
    true; false otherwise.

    - 9. Zfill (width). Left-pads original string with zeros.

    - 10. Upper ( ). Turns lowercase letters to uppercase.

    - 11. Translate (table, deletechars=""). Turns string into translation table.

    - 12. Title ( ). Turns string to titlecard version, which means uppercase lowercase
    and vice-versa.

    - 13. Swapcase ( ). All letters in the string are inverted.

    - 14. Strip ((chars)). Performs rstrip() and lstrip() on each string.

    - 15. Startswith (str, beg=0, end=len(string)). Checks whether string is itself
    or subset of string.

    - 16. Splitlines (num=str.count("n")). Returns each of the line with new strings.

    - 17. Split (sep="", num=str.count(sep)). Splits the strings into delimiters.

    - 18. Rjust (width, [,lfill(char)]) This gives space-padded strings.

    - 19. Rindex (str, beg=0, end=len(string)). This is just like index but with backward.

    - 20. Replace (old, new, [max]). This replaces string with max occurrences.

    - 21. Max (str). This returns max character alphabetical string.

    - 22. Join (seq). This merges representations of the strings.


