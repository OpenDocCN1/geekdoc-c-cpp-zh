    When it comes to classes and interfaces, here''s what you''ve got to understand...


    # Filters


    No, this has nothing to do adding filters to your photos to spruce them up. Filters
    give your applications more life—give them some form of body and soul—and allow
    you to code what you want to happen to the app. This you have to use the following
    variables:


    +   1. uppercase. This helps you format a string to uppercase letters.


    +   2. orderBy. This arranges the array based on the expressions used.


    +   3. number. This helps format numbers into strings.


    +   4. lowercase. This then formats the string into lowercase letters.


    +   5. limitTo. This limits strings or arrays into characters or elements that
    have been specified for them.


    +   6. json. This helps format objects into JSON Strings.


    +   7. filter. This helps format dates into formats that you have specified for
    them.


    +   8. date. This helps format dates into formats that you have specified for
    them.


    +   9. currency. This helps you format currency numbers.


    # Expression Filters


    The pipe character | is used to add expressions inside filters. For this, you
    could try the examples below:


    ```

