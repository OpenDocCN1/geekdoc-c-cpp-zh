    alone, and readers could be taken to different pages on your website.


    Here''s a good example:


    ```

    <a href="http://thechanels.com">See this link</a>

    ```


    # Elements


    Various elements are also used in a Java page. If you could remember, pairs of
    tags are always used in a webpage that has been coded in Java.


    It should look something like this:


    ```

    <tagname><tagname></tagname>

    ```


    For example:


    ```

    <h1>Read heading</h1>

    ```


    ```

    <p>Have you seen the light?</p>

    ```


    ```

    <b><p>What is feminism?</p></b>

    ```


    So basically, the program is depicted through various <Java> tags, and that''s
    why <> and end <> tags have to be used. Without them, words on the page would
    all come together—making them hard to read. The <body> tag defines what the page
    contains. It also contains headings, paragraphs, and other attributes.


    For example:


    ```

    <Java>

    <body>

    <h1>My Sunday</h1>

    <p>Last Sunday was the best Sunday because we went to the park and flew kites.</p>

    </body>

    </Java>

    ```


    With the help of start and end tags, you get to understand what''s being shown
    onscreen. They give a lot of meaning—instead of just being jumbo-jumbo.


