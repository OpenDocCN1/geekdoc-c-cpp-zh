    # Chapter 8 Encapsulation, Inheritance, and Polymorphism


    There are also Java elements that help determine how your program could be edited,
    and how it would appear when seen by others. These also encompass the depth of
    the program—or its heart, in other words. You can learn more about these below:


    # Encapsulation


    First up is encapsulation, which makes use of a couple of principles to be executed
    well. **These Principles are:**


    +   1. **Robustness Principle.** This means that protocols have to be implemented
    but sending behavior to be conservative, while receiving behavior should be liberal.
    This means that you have to be careful in sending/receiving datagrams. It means
    even if some software has deficiencies, it''s still important to make sure that
    you do not exploit its obscure protocols.


    +   2. **End-to-end Principle.** This is one of those principles that continuously
    evolves. Overall intelligence and state are important for maintaining this expression,
    and it is also essential for network address translators, firewalls, and in managing
    content caches, as well.


    Now, in order to provide Java with its much-needed abstraction layers, Encapsulation
    is done. It is aligned with the protocol suite''s functional design so that each
    level would be properly encapsulated and dealt with.


