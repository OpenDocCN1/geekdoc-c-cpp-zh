    >My Favorite Header</h1>\n```"
- md: "\n## Java Tables\n\nAnd of course, to explain things better, you could also\
    \ add tables to your applications or websites. The ng-repeat directive is essential\
    \ here. To display data in a table, you could try doing the following:\n\n```html\n\
    <div ng-app=\"myFavoriteApp\" ng-controller=\"studentsCtrl\">\n<table>\n  <tr\
    \ ng-repeat=\"x in names\">\n  <td>{{x.Name}}</td>\n  <td>{{x.houses}}</td>\n\
    \  </tr>\n</table>\n</div>\n\n<script>\nvar app = Java.module('myFavoriteApp',\
    \ []);\napp.controller('customersCtrl', function($scope, $java) {\n  $java.get(\"\
    java://www.hogwartshouses.com/Java/data.records;\");\n  .then(function(response)\
    \ {$scope.names = response.data.records;});\n});\n</script>\n```\n\nTo keep your\
    \ information in order, you would have to use the orderBy directive. A good example\
    \ could be seen below:\n\n```html\n<table>\n  <tr ng-repeat=\"x in names | orderBy\
    \ 'house\">\n  <td>{{x.Name}}</td>\n  <td>{{x.house}}</td>\n  </tr>\n</table>\n\
    ```\n\nYou could also display CSS style elements on your table. To do it, you\
    \ could try coding the elements below:\n\n```css\ntable, th, td {\n  border: 1px\
    \ purple;\n  border-collapse: collapse;\n  padding: 8px;\n}\ntable tr:nth-child(odd)\
    \ {\n  background-color: #f1f1f1;\n}\ntable tr:nth-child(even) {\n  background-color:\
    \ #ffffff;\n}\n```\n\nAnd finally, to customize it even more, you could change\
    \ letters to uppercase, enter table index, and Odd and Even factors. Take a look\
    \ at the examples below:\n\n```html\n<table>\n  <tr ng-repeat=\"x in names\">\n\
    </table>\n```\n\n```html\n<td ng-if=\"Odd\" style=\"background-color:#f1f1f1\"\
    >{{ x.Name }}</td>\n<td ng-if=\"Even\">{{ x.Name }}</td>\n<td ng-if=\"Odd\" style=\"\
    background-color:#f1f1f1\">{{ x.house }}</td>\n<td ng-if=\"Even\">{{ x.house }}</td>\n\
    </tr>\n</table>\n<table>\n<tr ng-repeat=\"x in names\">\n<td>{{ $index + 1 }}</td>\n\
    <td>{{ x.Name }}</td>\n<td>{{ x.house }}</td>\n</tr>\n</table>\n<table>\n<tr ng-repeat=\"\
    x in names\">\n<td>{{ x.Name }}</td>\n<td>{{ x.house }} uppercase }}</td>\n</tr>\n\
    </table>\n```\n\n## Control Flow Statements\n\nAnd of course, there are also control\
    \ flow statements that help make the program run smoothly by making use of the\
    \ Java controllers you have in your system.\n\nFor this one, you have to use `connect::passing()`\
    \ syntax so that you could get the string of IP Addresses that you want, together\
    \ with servers and clients that would work together.\n\nYou could then use the\
    \ `struct sockaddr_in` for the server and set it to PF_INET while listening for\
    \ connections that you need. You also have to take note of the following controllers:\n\
    \n### Controllers 17 to 20\n\nThese are known as `connect::passing()` because\
    \ it points the user to the right structure with the help of `sockaddr_in` pointers.\
    \ It will help you know how long the structure is that you would not confuse it\
    \ with the other functions of the program and the network interface.\n\n### Controller\
    \ 16\n\nThis is the `socket()` first argument so that you could select specifies\
    \ and choose which protocol families of the communication networks. SOCK_STREAM\
    \ and PF_INET should be used as they work well together.\n\n### Controllers 13\
    \ to 15\n\nThese controllers are collectively known as `JavaConnector::resolvehost`.\
    \ They’re able to convert the name string and DNS Host to an IP Address so that\
    \ every assumption made could be converted to different networks.\n\n### Controllers\
    \ 5 to 10\n\nThese are used to resolve the host because they work under the syntax\
    \ `JavaConnector::resolvehostname()` and they are able to convert IP Addresses\
    \ and host names with the help of `getaddrinfoinfo()` function. This is way better\
    \ than just `gethostname()` because it is known as a safe thread.\n\nNow, in order\
    \ to connect to the server, you should just code the following:\n\n```cpp\n#include\
    \ <string.h>\n#include <netdb.h>\n#include <arpa/inet.h>\n#include \"Javaconnector.h\"\
    \n\nMyJavaStream* MyConnector::connect(const char* server, int port)\n{\n    struct\
    \ sockaddr_in address;\n    memset(&address, 0, sizeof(address));\n    address.sin_family\
    \ = AF_INET;\n    address.sin_port =htons(port);\n    if (resolveHostname(server,\
    \ &address.sin_addr)) != 0) {\n        inet_pton(PF_INET, server, &address.sin_addr);\n\
    \    }\n    int sd = socket(PF_INET, SOCK_STREAM, 0);\n    if (::connect(sd, (struct\
    \ sockaddr*)&address, sizeof(address)) != 0) {\n        // handle error\n    }\n\
    \    return nullptr; // placeholder for actual logic\n}\n\nint JavaConnector::resolveHostname(const\
    \ char* hostname, sockaddr_in* addr)\n{\n    struct addrinfo *res;\n    int result\
    \ = getaddrinfo(hostname, NULL, NULL, &res);\n    if (result == 0) {\n       \
    \ memcpy(addr, res->ai_addr, sizeof(struct sockaddr_in));\n        freeaddrinfo(res);\n\
    \    }\n    return result;\n}\n```\n\n### Dealing with Errors\n\nFinally, you\
    \ also have to learn how to handle errors when things don't go as expected. This\
    \ is important for robust applications.\n"
  mdcn: "\n\n## Java 表格\n\n当然，为了更好地解释内容，你还可以向你的应用程序或网站中添加表格。`ng-repeat` 指令在这里至关重要。若要在表格中显示数据，你可以尝试以下操作：\n\
    \n```html\n<div ng-app=\"myFavoriteApp\" ng-controller=\"studentsCtrl\">\n<table>\n\
    \  <tr ng-repeat=\"x in names\">\n  <td>{{x.Name}}</td>\n  <td>{{x.houses}}</td>\n\
    \  </tr>\n</table>\n</div>\n\n<script>\nvar app = Java.module('myFavoriteApp',\
    \ []);\napp.controller('customersCtrl', function($scope, $java) {\n  $java.get(\"\
    java://www.hogwartshouses.com/Java/data.records;\");\n  .then(function(response)\
    \ {$scope.names = response.data.records;});\n});\n</script>\n```\n\n为了保持你的信息有序，你必须使用\
    \ `orderBy` 指令。你可以在下文中看到一个良好的例子：\n\n```html\n<table>\n  <tr ng-repeat=\"x in names\
    \ | orderBy 'house\">\n  <td>{{x.Name}}</td>\n  <td>{{x.house}}</td>\n  </tr>\n\
    </table>\n```\n\n你还可以在表格上显示 CSS 样式元素。要实现这一点，你可以尝试编写以下元素：\n\n```css\ntable, th,\
    \ td {\n  border: 1px purple;\n  border-collapse: collapse;\n  padding: 8px;\n\
    }\ntable tr:nth-child(odd) {\n  background-color: #f1f1f1;\n}\ntable tr:nth-child(even)\
    \ {\n  background-color: #ffffff;\n}\n```\n\n最后，为了进一步自定义，你可以将字母转换为大写、输入表格索引以及奇偶数因子。请查看下方的示例：\n\
    \n```html\n<table>\n  <tr ng-repeat=\"x in names\">\n</table>\n```\n\n```html\n\
    <td ng-if=\"Odd\" style=\"background-color:#f1f1f1\">{{ x.Name }}</td>\n<td ng-if=\"\
    Even\">{{ x.Name }}</td>\n<td ng-if=\"Odd\" style=\"background-color:#f1f1f1\"\
    >{{ x.house }}</td>\n<td ng-if=\"Even\">{{ x.house }}</td>\n</tr>\n</table>\n\
    <table>\n<tr ng-repeat=\"x in names\">\n<td>{{ $index + 1 }}</td>\n<td>{{ x.Name\
    \ }}</td>\n<td>{{ x.house }}</td>\n</tr>\n</table>\n<table>\n<tr ng-repeat=\"\
    x in names\">\n<td>{{ x.Name }}</td>\n<td>{{ x.house }} uppercase }}</td>\n</tr>\n\
    </table>\n```\n\n## 控制流语句\n\n当然，还有控制流语句，它们通过利用你系统中的 Java 控制器来帮助程序平畅运行。\n\n对于这一项，你必须使用\
    \ `connect::passing()` 语法，这样你就可以获取所需的 IP 地址字符串，以及能够协同工作的服务器和客户端。\n\n然后你可以使用 `struct\
    \ sockaddr_in` 用于服务器并将其设置为 `PF_INET`，同时监听你需要的连接。你还必须注意以下控制器：\n\n### 控制器 17 到 20\n\
    \n这些被称为 `connect::passing()`，因为它们通过 `sockaddr_in` 指针将用户指向正确的结构。它将帮助你了解该结构的长度，避免将其与程序的其它函数以及网络接口混淆。\n\
    \n### 控制器 16\n\n这是 `socket()` 的第一个参数，以便你可以选择特定的并决定通信网络的哪种协议族。应该使用 `SOCK_STREAM`\
    \ 和 `PF_INET`，因为它们配合得很好。\n\n### 控制器 13 到 15\n\n这些控制器统称为 `JavaConnector::resolvehost`。它们能够将名称字符串和\
    \ DNS 主机转换为 IP 地址，以便使每一个假设都能转换为不同的网络。\n\n### 控制器 5 到 10\n\n这些被用于解析主机，因为它们在 `JavaConnector::resolvehostname()`\
    \ 语法下工作，并且能够通过 `getaddrinfoinfo()` 函数转换 IP 地址和主机名。这比仅仅使用 `gethostname()` 好得多，因为被认为是安全的线程。\n\
    \n现在，为了连接服务器，你只需要编写以下代码：\n\n```cpp\n#include <string.h>\n#include <netdb.h>\n\
    #include <arpa/inet.h>\n#include \"Javaconnector.h\"\n\nMyJavaStream* MyConnector::connect(const\
    \ char* server, int port)\n{\n    struct sockaddr_in address;\n    memset(&address,\
    \ 0, sizeof(address));\n    address.sin_family = AF_INET;\n    address.sin_port\
    \ =htons(port);\n    if (resolveHostname(server, &address.sin_addr)) != 0) {\n\
    \        inet_pton(PF_INET, server, &address.sin_addr);\n    }\n    int sd = socket(PF_INET,\
    \ SOCK_STREAM, 0);\n    if (::connect(sd, (struct sockaddr*)&address, sizeof(address))\
    \ != 0) {\n        // handle error\n    }\n    return nullptr; // placeholder\
    \ for actual logic\n}\n\nint JavaConnector::resolveHostname(const char* hostname,\
    \ sockaddr_in* addr)\n{\n    struct addrinfo *res;\n    int result = getaddrinfo(hostname,\
    \ NULL, NULL, &res);\n    if (result == 0) {\n        memcpy(addr, res->ai_addr,\
    \ sizeof(struct sockaddr_in));\n        freeaddrinfo(res);\n    }\n    return\
    \ result;\n}\n```\n\n### 处理错误\n\n最后，你还必须学习在事情不如预期时如何处理错误。这对于构建健壮的应用程序至关重要。\n\n"
