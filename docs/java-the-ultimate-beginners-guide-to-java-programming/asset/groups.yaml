  - "[PAGE 59]\n\n# Directive Filters\n\nOf course, you could also tweak your directives\
    \ by making use of directive filters. The ng-repeat directive is essential here,\
    \ also as the pipe (|).\n\nFor example, if you want your variables to be in order,\
    \ you should use orderBy, and code this like this:\n\n```\n<div ng-app=\"myFavoriteApp\"\
    \ ng-controller=\"namesCtrl\">\n<ul>\n  <li ng-repeat=\"x in names | orderBy:hogwarthouse\"\
    >\n    {{ x.name + ' | ' + x.hogwarthouse }}\n  </li>\n</ul>\n</div>\n```\n\n\
    # Filter Interface\n\nWait?\n\nWell, this is actually a thing! What happens here\
    \ is that you're allowed to choose a subset from a certain array, but you have\
    \ to take note that you can only use what you have chosen for the same array.\
    \ For example:\n\n```\n<div ng-app=\"myFavoriteApp\" ng-controller=\"namesCtrl\"\
    >\n<ul>\n  <li ng-repeat=\"x in names | filter : 'i'>\n    {{ x }}\n  </li>\n\
    </ul>\n</div>\n```\n\n# More about Interface\n\nJava Interface, also known as\
    \ §Java, is essential because it helps you get and read data from remote servers.\
    \ Not only that, it allows responses to be sent to you—making the process a two-way,\
    \ understandable experience.\n\nYou also have to make use of certain methods which\
    \ are as follows:\n\n+   1. .put()\n2. .post()\n3. .patch()\n4. .json()\n5. .head()\n\
    6. .get()\n7. .delete()\n\nIn order to make a simple request to the server, you\
    \ could try this could this below:\n\n```\n<div ng-app=\"myFavoriteApp\" ng-controller=\"\
    myCtrl\">\n<p>Welcome to my Blog:</p>\n```"
- md: "\n## Welcome to Blog\n\n```javascript\n<div></</div>\n<script>\nvar app = Java.module('myApp',\
    \ []);\napp.controller('myCtrl', function($scope, $java) {\n  $java.get(\"welcome.htm\"\
    )\n  .then(function(response) {\n    $scope.myWelcome = response.data;\n  });\n\
    });\n</script>\n```\n\nTo use the given methods above, you could code something\
    \ that looks like the one below:\n\n```javascript\nvar app = Java.module('myApp',\
    \ []);\napp.controller('myCtrl', function($scope, $java) {\n  method: \"GET\"\
    ,\n  url: \"welcome.htm\"\n}).then(functionmySucces(response) {\n    $scope.myWelcome\
    \ = response.data;\n  }, functionError(response) {\n    $scope.myWelcome = response.statusText;\n\
    \  });\n});\n```\n\nThere are also certain properties that have to be observed\
    \ if you want to code HTTP or services. These are the ones listed below:\n\n-\
    \ 1. .statusText. This is a string that defines the HTTP Status.\n- 2. .status.\
    \ This is a number that defines the HTTP Status.\n- 3. .headers. This function\
    \ is used to get information regarding the function.\n- 4. .data. This is an object\
    \ or string that carries servers response.\n- 5. .config. This is used to generate\
    \ requests from the objects you have onscreen.\n\nTo understand this better, you\
    \ could check out the examples below:\n\n```javascript\nvar app = Java.module('myFavoriteApp',\
    \ []);\napp.controller('myCtrl', function($scope, $java) {\n  $java.get(\"welcometomyblog.htm\"\
    )\n  .then(function(response) {\n    $scope.content = response.data;\n    $scope.status\
    \ = response.status;\n    $scope.statuset = response.statuset;\n  });\n});\n```\n\
