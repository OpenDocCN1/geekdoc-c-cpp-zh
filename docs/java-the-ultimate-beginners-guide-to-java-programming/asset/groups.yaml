    # # Chapter 1 an Introduction to Java


    More than anything, what you have to understand about Java is that it is a general
    purpose, object-oriented programming language—which means that it is easier to
    understand than other programming languages. It was designed primarily so that
    software developers could just code their programs once, and allow those programs
    to run anywhere, or at least, in most platforms, as long as those platforms allow
    Java code to run in them.


    Java uses some of the same elements as C+ and C++ use, but transforms them into
    much simple, easy to understand versions that could also be modified by the developer''s
    preferences.


    Java has also been created to run with enough runtime support, for both hardware
    and software, by means of representing each byte in a clear and concise manner.
    For example, shiz tous, border collie, and ter are all dogs—therefore, they could
    be classified as dogs, and not a lot of space would be taken up in the system,
    and the system would be able to work in a faster manner. This is the reason why
    Java is one of the world''s most powerful, and used programming languages of all
    time!


    # ## History


    The history of Java dates back to 1991 when programmers Patrick Houghton, Mike
    Sheridan, and James Gosling opted for a programming language that could be best
    for the development of Digital TV. However, it was deemed to be ahead of its own
    time, and they redeveloped it using the C+ and C++ platforms to make it clearer
    and more economical to use.


    With the redevelopment they came the core principles of Java, which are:


    +   1. It has to be portable—or that it should work on as many platforms as possible,
    without any of them working as well as the other.

    2. It should be safe and secure to use—and well encrypted;

    3. People should feel connected to it that are somewhat familiar to them, and
    in as little time as possible, which means that they should be working with that
    have been made, and even when it looks complex at first, sooner or later, have
    to realize that it actually works;

    4. It should be dynamic, work in threads, and could be modified when needed; and;

    5. It should perform with precision.


    As you can see, these core principles give you feeling that the programmers made
    for the people—so they can enjoy more programs without having to buy too many
    devices.


    In 1995, Microsystems finally released Java 1.0—the first public inception of
    Java, which had amazing security, no-runtime costs, and file access restrictions
    across all networks. Over the 7 years, more Java releases have been made, and
    ever since Java became available through GNU, General Public License—meaning it
    is now free, open-source programming language. This stemmed from the public outlet
    that happened when some of its contents were made private and available for a
    fee, which does not resonate with its core principles.


    # ## Runtime and Performance


    At first, Java did not run as fast as it had, mostly because of the fact that
    the first couple of programs created from it required a bit more memory than that
    from C+. However, over the years, its speed improved, and has gained better reputation
    in the industry than its peers.


    Being a virtual machine in itself, Java now works with the so-called "just in
    time compilation" which makes it fairly to work with. Added support has also been
    given, so now, you can start making use of inner classes, arrays, assertions,
    string builders, and the, alongside better optimization, too.'
  - '[PAGE 7]


    # Syntax


    Of course, you would be learning more about this later but what you have to realize
    now is that Java Programming, classes encapsulate all of the codes—so they keep
    coherent with one another, and would be able to co-exist, and all of which would
    be considered as their own data items. However, primitive data types, such as
    characters, Boolean values, integers—which you will be learning in the next chapter—are
    excluded in this as they know how to stand on their own.


    You''ll also notice the signs which be mostly used in the syntax: double slash(//),
    commenting style, or asterisks and slashes (**) (*), and multiple line style,
    or (*/).


    When creating a program, you should save the file as *java*, with child pages
    saved as *.class*. If you want to keep a child page, or class, private, all you
    have to do is save it in the same Java folder, and not in its own folder so others
    won''t have access to it.


    A few lines of Java syntax are as follows:


    ```

    Program HiWoord (

    Public void (

    System out PrintIn.HiWoord

    ))

    ```


    You have to take note, though, that making the class public gives the program
    the capacity to be used in other platforms. So, unless the program is still in
    its development stages, and you do not want it to be accessed yet, it''s best
    to make sure that you make it public just so you test it out, too. After all,
    by using the keywords “void” and “static”, you''d get to male sure that others
    won''t be able to edit or modify the app.


    # Memory


    Another reason why Java works fast is because it makes use of Automatic Memory
    Management, which means that runtime won''t be affected by what the programmer
    chooses to add or subtract from what he''s trying to create.


    Now, what happens is when there are no more references to a certain object, it
    would no longer be considered as part of the program, and won''t be using a lot
    of memory, too—making the program easier to manage altogether.


    It''s now time to learn about Java—read the next chapters, and understand how
    this works!'
