  - "[PAGE 63]\n\n# Chapter 10 Conditional and Control Flow Statements\n\n# Conditional\
    \ Statements\n\nYou know how sometimes, you tend to want to edit you program and\
    \ give it a more personal touch? Well, Conditional Statements certainly help out\
    \ with that.\n\nThe thing about conditional statements is that somehow, they give\
    \ you the capacity to truly make your program work your own, and for that matter,\
    \ there are some of those things that you can do to make the program work you\
    \ want it to.\n\n# Java Forms\n\nOf course there are times when you need to add\
    \ forms to your website or application so you could get information from your\
    \ subscribers, just to make sure that they are not spambots. For this, the following\
    \ input elements are:\n\n+   1. text area elements\n2. button elements\n3. select\
    \ elements\n4. input elements\n\nYou should also take note of the following:\n\
    \n+   1. Ng-click is used to invoke the reset ( ) method directly but but only\
    \ when the user clicks the button.\n2. The reset ( i ) method makes master and\
    \ user objects equals.\n3. The formCTRL controller is all about controlling the\
    \ forms that you have on your application or website.\n4. The ng-model binds two\
    \ user elements together.\n5. The ng-app then defines the main Java application.\n\
    \nTo make this clearer, you could try the example given below:\n\n```\n<div ng-app=\"\
    myApp\" ng-controller=\"formCtrl\">\n  <form novalidate>\n    First Name:<br>\n\
    \    <input type=\"text\" ng-model=\"user.firstName\"><br>\n    Last Name:<br>\n\
    \    <input type=\"text\" ng-model=\"user.lastName\">\br>\n    <button ng-click=\"\
    reset()\">RESET</button>\n  </form>\n  <p>model = {{user}}</p>\n  <p>master =\
    \ {{master}}</p>\n</div>\n<script>\n```"
