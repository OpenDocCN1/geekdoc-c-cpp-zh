    \n由于 Java 是一种面向对象的语言，你可以预计它由于以下原因而工作：\n\n## 单一来源 (One Source of Truth)\n\n通常被称为“单一数据源”，这意味着整个应用存储在一个树对象中，然后放置在单一存储中。通过这种，创建应用变得简单，调试以及内省也变得简单。某些函数——如撤销/重做——变得变得轻而易举。它使用以下代码：\n\
