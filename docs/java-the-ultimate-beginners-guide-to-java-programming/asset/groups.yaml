    这些类型到底是什么？\n\n## 用户数据报协议 (User Datagram Protocol)\n\n它是互联网协议族中的一个重要成员。它提供了无连接的传输，这种方式实际上是不可靠的，并且不会破坏任何方式的网络。它们对于时间敏感的应用是完美的。用户数据报协议包括：\n\
    \n- 1. 能够提供数据报；\n- 2. 面向事务并适用于域名系统；\n- 3. 单向通信，适用于服务发现和广播信息；\n- 4. 适用于实时应用（如 Twitter,\
    \ Snapchat 等），因为它允许延迟。它也适用于 VOIP 应用（如 Skype）以及某些游戏；\n- 5. 适用于大量客户端，且无状态。它适用于流媒体应用，；\n\
    - 6. 对于引导是完美的。\n它也适用于 0 到 4 字节，在某些情况下。\n\n## 传输控制协议 (Transmission Control Protocol)\n\
    \n它提供了错误检查、有序且可靠的字节流，位于各种网络之间。这用于电子邮件以及万维网。它也是无连接的，通过处理已经传输的数据工作。它从 0 到 60 字节包含源端口和目的端口。偏移也是预留的，还有窗口大小、校验和紧急指针。\n\
    \n基本上，你可以记住的是：\n\n- 1. 16 位标识源端口；\n- 2. 16 位标识接收端口；\n- 3. 32 位指定头部；\n- 4. 32 位标识确认号；\n\
    - 5. 32 位标识标志位；\n- 6. 32 位标识未来使用的数据。\n\n使用这种语言定义其他位。\n\n## 互联网控制消息协议 (Internet\
    \ Control Message Protocol)\n\nJAVA 的另一个重要协议，它向路由器发送消息并有自己的数字。区别在于它在 IPv4 中进行错误检查。它也工作在\
    \ 0 到 60 字节，其中：\n\n- 1. 类型 = 控制消息 | 子类型\n- 2. 代码 = 控制消息 | 子类型\n- 3. 头部剩余 = ICMP\
    \ 数据\n- 4. 校验和 = ICMP头部和数据\n\n## 地址解析协议 (Address Resolution Protocol)\n\n正如名称所示，这是一种使通信应用易于工作的电信协议。它用于映射网络地址，使得消息——甚至视频通话成为可能，还用于\
    \ Xerox PARC、DEC Net 等。对于这个，你可以记住：\n\n- 0 –硬件类型 (HTYPE)\n- 2 – 协议类型 (PTYPE)\n\
    - 4 – 硬件地址 (HLEN) | 协议地址 (PLEN)\n- 6 – 操作 (OPER)\n- 8 – 发送硬件地址 (SHA)\n- 10 – 2\
    \ 字节\n- 12 – 2 字节\n- 14 – 发送地址协议 (SAP)\n- 16 – 2 字节\n- 18 – 目标硬件地址 (THA)\n- 20\
    \ – 2 字节\n- 22 – 2 字节\n- 24 – 目标协议地址 (TPA)\n- 26 – 2 字节\n\n## 互联网协议 (Internet\
    \ Protocol)\n\n最后——与 JAVA 密切相关的，互联网协议是关于在网络中提供边界，以及中继互联网到联网的数据报。其结构涉及头部和负载，其中头部被称为主\
    \ IP 地址，并借助某些参数连接接口。路由前缀和网络标识也涉及，还有内部或外部网关协议。可靠性取决于端到端协议，但大多数情况下你可以预期框架是这样的：\n\
    \n| 数据应用 | |\n| :--- | :--- |\n| UDP 头部 | UDP 传输 |\n| IP 头部 | IP 数据互联网 |\n| 帧头部\
