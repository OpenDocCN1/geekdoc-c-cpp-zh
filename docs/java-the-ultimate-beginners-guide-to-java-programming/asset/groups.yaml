    \n现在就开始阅读这本书吧，你将很快学到更多关于 Java 的知识！\n\n再次感谢。\n\n## 历史\n\nJava 的历史追溯到 1991 年，当时\
    \ Patrick Houghton、Mike Sheridan 和 James Gosling 采用了一种语言。在 1995 年，Microsystems\
    \ 最后发布了 Java 1.0，它在通用许可下免费提供。\n\n## 运行时与性能\n\n最初，Java 的运行速度没有 C++ 快，是因为由于所谓的“即时编译”。然而，多年年来，它的速度得到了提升并赢得了声誉。\n\
    \nJava 运行速度快的另一个原因是它利用了虚拟机，这意味着运行时不会受到程序员选择添加或减少其所尝试创建的内容的影响。\n\n## 语法\n\n当然，你以后会学习更多内容，但你现在需要意识到的是\
    \ Java 类封装了所有代码。然而，基本数据类型（如字符、布尔值和整数——你将在下一章学习）在此被排除。\n\n你还会注意到用于语法的符号：\n- //\
    \ 用于单行注释\n- /* ... */ 用于多行注释\n\n在创建程序时，你应该将文件保存为 .java，子页面保存为 .class。如果你想将一个子页面（或类）设为私有，只需要将其保存在相同的\
    \ Java 文件夹中，而不是单独存放，这样其他人无法访问它。\n\n几行 Java 语法如下：\n\n```java\npublic class HelloWorld\
    \ {\n    public static void main(String[] args) {\n        System.out.println(\"\
    Hello World\");\n    }\n}\n```\n\n## 内存\n\nJava 运行速度快的另一个原因是它利用了自动内存管理，这意味着运行时不会受到程序员选择添加或减少其所尝试创建的内容的影响。\n\
    \n现在的情况是当某个对象不再被引用时，它将不再被视为程序的一部分，并且不会占用大量内存——这使得整个程序更容易管理。\n"
