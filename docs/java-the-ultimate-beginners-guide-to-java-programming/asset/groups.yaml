    ## Application Layer


    The Application Layer encapsulates the protocols used by services that provide
    exchanging applications. This also includes configuration protocols, routing services
    and network support services. Examples include File Transfer Protocol (FTP), Hypertext
    Transfer Protocol (HTTP), and Dynamic Host Configuration Protocol (DHCP). This
    way, you would be able to lower data transfer based on the protocols you are using.


    Application layer also treats the Transport Layer as a stable network with black
    boxes that allow communication to happen all throughout the application, while
    making sure that every qualities of part of the application still work as strong
    as they. Whatever happens to the Application Layer does not concern the Transport
    and Internet layers because traffic does not use the said layer. However, it is
    essential for the NAT, or Network Address Translator, to consider the payload
    of the application—and make sure things are running smoothly.


    ## Transport Layer


    The Transport Layer contains the channels of data that are involved in Java, which
    also establishes process-to-process connectivity and end-to-end message transfers
    that provide the information and logistics for any specific purpose in the network.
    This could either be implemented, connectionless, or object-oriented.


    The port is then established with the help of the transport layer where logical
    constructs are around. It means that:


    - 1. Data should be correct—and could only have minimal error;

    - 2. Data should arrive in order;

    - 3. Data should include traffic congestion control;

    - 4. Packets that are discarded or lost have to be resent, and;

    - 5. Duplicate data has to be discarded.


    When happens, you could expect the newest version of the Stream Control Protocol
    to work properly in your network. You don''t have to rely on connectionless datagrams,
