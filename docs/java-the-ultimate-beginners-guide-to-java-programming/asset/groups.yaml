    | FirstHost◊ Router◊ Second Host |

    | Application—Process to Process—Application |

    | Transport — Host to Host — Transport |

    | Internet — Internet — Internet — |

    | Link — Link — Link — Link |

    | Ethernet — Fiber Satellite — Ethernet |


    Take note that whatever is on top of the layer that are closely used in the user
    applications themselves. However, there is no single architectural model that
    has to be followed, especially when you have less-defined models such as the OSI
    model. This is its main difference from other internet protocols, especially the
