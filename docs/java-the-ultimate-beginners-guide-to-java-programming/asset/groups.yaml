  mdcn: "\n\n# 第二章 Java 中的八种基本类型\n\n正如前面提到的，Java 编程中共有八种基本类型（或原始数据类型）。以下是它们以及你应该了解的知识。\n\
    \n# 字符\n\n字符构成了 Java 的第一种基本类型。基本上，这些是在你在创建程序时应该使用的单词。这些还包含了许多内容，它们是……\n\n- 1.\
    \ *If.* 执行代码，并包括 (else 和 elif)\n- 2. *While.* 用于真条件，并执行代码块代码。\n- 3. *For.* 用于附加代码块。\n\
    - 4. *Try.* 由 except 处理，并允许为代码块抛出异常。\n- 5. *With.* 使用块管理器，帮助打开和关闭文件。\n- 6. *Def.*\
    \ 意味着定义了一个方法或函数。\n- 7. *Class.* 执行块代码并用于面向对象编程。\n- 8. *Print/ Print().* 用于打印。\n\
    - 9. *Import.* 用于从其他函数导入模块。\n- 10. *Yield.* 用于生成函数值，也用作运算符。\n- 11. *Assert.* 用于检查本应应用的语句。\n\
    - 12. *Pass.* 用于创建空代码块。\n\n注意，这些关键字不能用作变量！\n\n# 缩进与行\n\n使用的空格和单词数量将决定你的编程是否正确，或者是否会产生错误：\n\
    \n看看下面的两个示例。第一个是正确的，另一个由于最后一行未缩进的 *print* 命令而产生错误。\n\n- 注意\n\n# 示例 1:\n\n```\n\
    if True:\n    print \"True\"\nelse:\n    print \"False\"\n```\n\n# 示例 2:\n\n```\n\
    if True:\n    print \"Answer\"\n    print \"True\"\nelse:\n    print \"Answer\"\
    \n    print \"False\"\n```\n\n# 引号\n\n为了在此程序中创建引号，请注意你可以使用单引号 ('')、双引号 (\"\")\
    \ 或三连引号 (\"\"\"\"\") 来表示字符串和字面量字符串。\n\n例如：\n\n# 多行语句\n\n系统会自动根据命令的结束决定新行的开始，但如果你想继续写自己的行，可以使用反斜杠\
    \ (\\) 来实现，使用括号时除外。\n\n# 示例 1:\n\n```\ntotal = item_one + \\\n    item_two + \\\
    \n    item_three\n```\n\n# 示例 2:\n\n```\ndays = ['Monday', 'Tuesday', 'Wednesday',\n\
    'Thursday', 'Friday']\n```\n\n# 注释\n\n要创建注释，只需使用井号 (#)——这听起来非常适合社交媒体，对吧？例如：\n\n\
    # 示例 1:\n\n```\n#!/usr/bin/java\n```\n\n# 第一条注释\nprint \"Hello, Java!\" # 第二条注释\n\
    \n# 示例 2:\n\n- # 这是一个注释。\n# 这也是一个注释。\n# 这也是一个注释。\n# 我说过。\n\n# 等待用户\n\n当你想要创建一个提示来告诉用户你正在等待他的命令时，你可以尝试：\n\
    !/usr/bin/java\nraw_input(\"\\n\\n按键退出。\")\n\n# 独立语句组\n\n独立语句的组在 Java 语言中称为套件（Suite）。基本上，你必须以关键字开始并以冒号\
    \ (:) 结束，例如：\nif expression:\nsuite\nelif expression:\nsuite\nelse:\nsuite\n\n\
    上述命令将为你提供套件。\n\n# 布尔表达式与逻辑\n\n接下来是布尔逻辑。在其中，值被简化为真（true）或假（false），并用于二进制系统。简而言之，它们帮助程序做出决策。例如：\n\
    >>>sensor_on = True\n>>>sensor_on\nTrue\n\n你需要记住，布尔逻辑决定了确切的结果——你想看到的某些特定内容。例如：\n\
    \n| a | b | a== b | a!= b | A and b | A or b | not b |\n|---|---|---|---|---|---|---|\n\
    | False | False | True | False | False | False | True |\n| False | True | False\
    \ | True | False | True | True |\n| True | False | False | True | False | True\
    \ | False |\n\n|图表的 True True True。\n\n# 逻辑“与” (And)\n\n如你所见，有一个表示 *a* 和 *b* 的表达式。记住，只有当\
    \ *a* 和 *b* 都具有相同的值时才会发生，这意味着在所有其他情况下结果都是假的。\n\n这里有一个例子：\n\n```\na and False ==\
    \ False\nFalse and a == False\nB and a == a and b\nA and True == a\nTrue and a\
    \ == a\nA and a == a\n```\n\n# 逻辑等价\n\n逻辑等价或 a==b 发生在 *a* 和 *b* 都具有相同真值时，且可以是真也可以是假；否则，它们没有相同的内核。\n\
    \n# 逻辑“或” (or)\n\n接下来，你看到一个表示 *a* 或 *b* 的表格。它测试是否都为真，或者是否只有一个变量为真。当两者都为真时，它也是真。例如：\n\
    \n```\n\n and False == False\nFalse and a == False\nB and a == a and b\nA and\
    \ True == a\nTrue and a == a\nA and a == a\n```\n\n 逻辑取反 (Negation)\n\n基本上，逻辑取反会翻转布尔值。如果是真的，它就会变成假的；如果是假的，它就会变成真的。例如：\n\
    \n```\nnot True == False\nnot False == True\n```\n\n"
