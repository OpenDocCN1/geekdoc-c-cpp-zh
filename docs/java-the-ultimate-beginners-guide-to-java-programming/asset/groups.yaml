    # Chapter 11 Dealing with Errors and Exceptions


    Finally, you also have to learn to deal with times when the program just does
    not seem to work the way you want it to. For the most part, prevention is better,
    and that''s what you''ll be learning about here. Just like the chapter before
    this, this one also makes use of controllers so you can tweak them, and correct
    the errors you''ll find.


    Correcting errors always starts by trying to listen or trying to figure out what''s
    wrong with the network hosts, or will be hosting your program. For this, you should
    use the JavaAcceptor::start syntax so you''d be able to see if a socket already
    exists. You''ll see zero (0) appear if it does.


    You should also take note of the following controllers:


    Controllers 28 to 34


    These make use of the listen() function. Basically, you could make Java Requests
