    - Fields\n- Methods\n- Constructors\n- Destructors\n- Getting Peer Information\n\
    - Network I/O Methods\n- Encapsulation\n- Abstraction Layers\n- Inheritance\n\
    - Internet Model\n- Patterns\n- Stream Class\n- Polymorphism\n- Adding Directives\n\
    - Adding Controllers\n- File Polymorphism and Controllers\n- Loading the Library\n\
    - Chapter 9: Abstract Classes and Interfaces\n- Filters\n- Expression Filters\n\
    - Currency Filters\n- Directive Filters\n- Filter Filter\n- More about Interface\n\
    - JSON Object\n- Services\n- Chapter 10: Conditional and Control Flow Statements\n\
    - Conditional Statements\n- Java Forms\n- Control Flow Statements\n- Chapter 11:\
    \ Dealing with Errors and Exceptions\n- Understanding Acceptor Classes\n- Correcting\
    \ Statements and Arguments\n## Debugging and Exception Handling\n\n## Conclusion\n\
    \nBonus: Preview Of ‘SQL The Ultimate Beginners Guide Learn SQL Today’\n\nThank\
    \ you again for downloading this book!\n\n## Introduction\n\nKnown as one of the\
    \ most useful, general purpose, object-oriented languages around, Java is one\
    \ of the best programming languages that you could learn about—and even master,\
    \ even if you're just a beginner!\n\nStart reading this book now and you'll learn\
    \ more about Java in no time!\n\nOnce again, thank you, and enjoy!\n\n## Chapter\
    \ 1: an Introduction to Java\n\nMore than anything, what you have to understand\
    \ about Java is that it is a general purpose, object-oriented programming language—which\
    \ means that it is easier to understand than other programming languages. It was\
    \ designed primarily so that software developers could just code their programs\
    \ once, and allow those programs to run anywhere, or at least, in most platforms,\
    \ as long as those platforms allow Java code to run in them.\n\nJava uses some\
    \ of the same elements as C+ and C++ use, but transforms them into much simple,\
    \ easy to understand versions that could also be modified by the developer's preferences.\n\
    \nJava has also been created to run with enough runtime support, for both hardware\
    \ and software, by means of representing each byte in a clear and concise manner.\
    \ For example, short hairs, border collie, and terrier are all dogs—therefore,\
    \ they could be classified as dogs, and not a lot of space would be taken up in\
    \ the system, and the system would be able to work in a faster manner. This is\
    \ the reason why Java is one of the world's most powerful, and used programming\
    \ languages of all time!\n\n### History\n\nThe history of Java dates back to 1991\
    \ when programmers Patrick Houghton, Mike Sheridan, and James Gosling opted for\
    \ a programming language that could be best for the development of Digital TV.\
    \ However, it was deemed to be ahead of its own time, and they redeveloped it\
    \ using the C+ and C++ platforms to make it clearer and more economical to use.\n\
    \nWith the redevelopment they came the core principles of Java, which are:\n\n\
    1. It has to be portable—or that it should work on as many platforms as possible,\
    \ without any of them working as well as the other.\n2. It should be simple.\n\
    3. It should be secure.\n4. It should be multi-threaded.\n5. It should be interactive.\n\
    \nIn 1995, Microsystems finally released Java 1.0, which was free under the General\
    \ Public License.\n\n### Runtime and Performance\n\nAt first, Java did not run\
    \ as fast as C++ because of the so-called \"just in time compilation\" which makes\
    \ it fast. However, over the years, its speed improved and has gained reputation.\n\
    \nAnother reason why Java works fast is because it makes use of virtual machines,\
    \ which means that runtime won't be affected by what the programmer chooses to\
    \ add or subtract from what he's trying to create.\n\n### Syntax\n\nOf course,\
    \ you would be learning more about this later but what you have to realize now\
    \ is that Java classes encapsulate all the codes. However, primitive data types,\
    \ such as characters, Boolean values, and integers—which you will be learning\
    \ in next chapter—are excluded in this.\n\nYou'll also notice the signs which\
    \ are used used in syntax:\n- // for single line comments\n- /* ... */ for multi-line\
    \ comments\n\nWhen creating a program, you should save the file as .java, with\
    \ child pages saved as .class. If you want to keep a child page, or class, private,\
    \ all you have to do is save it in the same Java folder and not in its own so\
    \ others won't have access to it.\n\nA few lines of Java syntax are as follows:\n\
    \n```java\npublic class HelloWorld {\n    public static void main(String[] args)\
    \ {\n        System.out.println(\"Hello World\");\n    }\n}\n```\n\n### Memory\n\
    \nAnother reason why Java works fast is because it makes use of Automatic Memory\
    \ Management, which means that runtime won't be affected by what the programmer\
    \ chooses to add or subtract from what he's trying to create.\n\nNow, what happens\
    \ is when there are no more references to a certain object, it would no longer\
    \ be considered as part of the program and won't be using a lot of memory—making\
    \ the program easier to manage altogether.\n"
