    \nMeanwhile, if you are trying to accept connections from your clients, these\
    \ controllers will come in\nhandy. For these, the JavaAcceptor::accept syntax\
    \ is extremely useful. This way, you get all the qualified\nfunctions in one thread\
    \ and you won't get confused.\n\nTo starting for connections, try the codes below:\n\
