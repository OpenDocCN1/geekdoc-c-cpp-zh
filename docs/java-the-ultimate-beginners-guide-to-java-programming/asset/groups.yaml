    # # The Headings


    Of course, your pages needs headings. These work like subheadings in books or
    articles so you''d know exactly what goes on in a page—what it''s about, in other
    words.


    Headings range from <h1></h1> to <h6></h6>. Here''s a good example:


    ```

    <h1>Look at my heading</h1>

    <h2>Look at my heading</h2>

    <h3>Look at my heading</h3>

    <h4>Look at my heading</h4>

    <h5>Look at my heading</h5>

    <h6>Look at my heading</h6>

    ```


    # # Paragraphs


    Paragraphs are also used in webpages as as in articles and novels. You''ll know
    that a paragraph is around when the <p> tag is in. This also makes easier for
    you to read what''s on the page.


    Without the use of paragraphs, everything would be cramped in one space along—making
    extremely hard to read. For this, you could try the following:


    ```

    <p>Read this paragraph.</p>

    <p>Read one more paragraph.</p>

    ```


    # # Images


    Images could also be used to spruce up your website. It makes people want to read
    the website because images always makes things easy on the eyes. This means you''d
    have to use the <img> tag for this.


    The attributes of this are as follows:


    +   1. alt (alternate text)

    2. src (image source)

    3. size (width and height)


    For example:


    ```

    <img src="chan1.jpg" alt="chan2" width="104" height="142">

    ```'
