    ## User Datagram Protocol\n\nThis is an important member of Internet Protocol\
    \ Suite. It provides connectionless transmissions in such a way that they could\
    \ actually be reliable, and that would not ruin the protocol of the network in\
    \ any way. They are perfect for time-sensitive applications that easily drop packets.\
    \ User Datagram Protocols are:\n\n- 1. It is capable of providing datagrams to\
    \ the network;\n- 2. It is transaction-oriented and work for both Network Time\
    \ Protocols and Domain Name Systems;\n- 3. It works with unidirectional communication,\
    \ which is suitable for service discoveries and broadcast information;\n- 4. It\
    \ works for real-time applications (such as Twitter, Snapchat, Periscope, etc.)\
    \ because it makes ways of transmission delays. It also works for VOIP applications\
    \ (such as Skype) and for some games, as well;\n- 5. It is suitable for a large\
    \ number of clients, and is stateless. It works for streaming applications, and;\n\
    - 6. It's perfect for bootstrapping because it is simple.\nIt also works for Octets\
    \ 0 to 4, and even 20 to 60 in some cases.\n\n## Transmission Control Protocol\n\
    \nThis provides error-checked, orderly, and reliable stream of octets between\
    \ various networks that it contains. This is used for email, and most of the World\
    \ Wide Web, as well. This is also connectionless, and works by processing data\
    \ that has already been transmitted. It works from octets 0 to 60, containing\
    \ source and destination ports. It also contains sequence numbers, acknowledgment\
    \ numbers.\n\nData Offset is also reserved, together with window size, checksum,\
    \ and urgent pointers.\n\nBasically, what you can keep in mind is:\n\n- 1. 16\
    \ bits identify the source port;\n- 2. 16 bits identify the receiving port;\n\
    - 3. 32 bits specify the header in words;\n- 4. 32 bits identify the acknowledgment\
    \ numbers;\n- 5. 32 bits identify the flags;\n- 6. 32 bits identify data that\
    \ is reserved for future use.\n\nOther bits define options that you could create\
    \ for your app using this language.\n\n## Internet Control Message Protocol\n\n\
    Another important protocol of JAVA, this one sends messages to the router and\
    \ also has its own number. The difference is that it starts in IPv4, where error-checking\
    \ is done. It also works between octets 0 to 60, where:\n\n- 1. Type = Control\
    \ Messages | Subtype\n- 2. Code = Control Messages | Subtype\n- 3. Rest of Header\
    \ = ICMP Data\n- 4. Checksum = ICMP Header and Data\n\n## Address Resolution Protocol\n\
    \nAs the name suggests, this is a telecommunications protocol that makes easy\
    \ communication apps to work. It is used to map network addresses, making messaging—and\
