  mdcn: "\n\n## 欢迎来到博客\n\n```javascript\n<div></</div>\n<script>\nvar app = Java.module('myApp',\
    \ []);\napp.controller('myCtrl', function($scope, $java) {\n  $java.get(\"welcome.htm\"\
    )\n  .then(function(response) {\n    $scope.myWelcome = response.data;\n  });\n\
    });\n</script>\n```\n\n要使用上述方法，你可以编写类似下方的代码：\n\n```javascript\nvar app = Java.module('myApp',\
    \ []);\napp.controller('myCtrl', function($scope, $java) {\n  method: \"GET\"\
    ,\n  url: \"welcome.htm\"\n}).then(functionmySucces(response) {\n    $scope.myWelcome\
    \ = response.data;\n  }, functionError(response) {\n    $scope.myWelcome = response.status;\n\
    \  });\n```\n\n还有某些属性需要观察，如果你想编写 HTTP 或服务。以下是列表：\n\n- 1. `.statusText`：定义 HTTP\
    \ 的字符串。\n- 2. `.status`：定义 HTTP 的数字。\n- 3. `.headers`：用于获取信息的函数。\n- 4. `.data`：携带响应的对象或字符串。\n\
    - 5. `.config`：用于生成屏幕上的请求。\n\n为了更好地理解这一点，你可以查看以下示例：\n\n```javascript\nvar app\
    \ = Java.module('myFavoriteApp', []);\napp.controller('myCtrl', function($scope,\
    \ $java) {\n  $java.get(\"welcomomyblog.htm\")\n  .then(function(response) {\n\
    \    $scope.content = response.data;\n    $scope.status = response.status;\n \
    \   $scope.statuset = response.status;\n  });\n});\n```\n\n```javascript\nvar\
    \ app = Java.module('myFavoriteApp', []);\napp.controller('myCtrl', function($scope,\
    \ $java) {\n  $java.get(\"wrongfilename.htm\").then(function(response) {\n  //\
    \ 第一个函数处理成功\n  $scope.content = response.data;\n  }, function(response) {\n  //\
    \ 第二个函数处理错误\n  $scope.content = \"Something is wrong\";\n  }\n});\n```\n\n## JSON\
    \ 对象\n\n同时，JSON 对象是关于如何从 JavaScript 传输数据，反之亦然。`ng-repeat` 指令应该用于此。例如，你想从 Blog\
    \ 到 WordPress Post 导入，这意味着你正在使用 JSON 对象。你应该注意 `$java.get()` 读取 JSON Data，而 `$java()`\
    \ 是关于 \"FavoriteController\" 的很好的示例：\n\n```html\n<div ng-app=\"ng-repeat\" ng-controller=\"\
    studentsCtrl\">\n  <ul>\n    <li ng-repeat=\"x in myData\">\n      {{ x.Name +\
    \ ', ' + x }}\n    </li>\n  </ul>\n</div>\n```\n\n```javascript\nvar app = Java.module('myApp',\
    \ []);\napp.controller('studentsCtrl', function($scope, $java) {\n  $java.get(\"\
    students.php\").then(function(response) {\n    $scope.myData = response.data;\n\
    \  });\n});\n```\n\n## 服务\n\n使用服务也是同样重要的，因为它们允许你的应用程序继续运行并复制它们，且处理声明。Java 提供许多服务，但最重要的是\
    \ `$Location`。它允许你将对象保存到云端并保持它们安全，即使你的计算机外部故障，数据仍然存在——特别是当你正在处理程序和应用程序时。是一些示例：\n\
    \n```javascript\nvar app = Java.module('myFavoriteApp', []);\napp.controller('studentsCtrl',\
    \ function($scope, $Location) {\n  myUrl = $Location.absUrl();\n});\n```\n\n你还可以使用\
    \ `Timeout` 服务或 `window.setTimeout` 来帮助你创建倒计时——这些主要用于事件、显示和类似。例如：\n\n```javascript\n\
    var app = Java.module('myFavoriteApp', []);\napp.controller('myCtrl', function($scope,\
    \ timeout) {\n  $scope.myHeader = \"Hi People!\";\n  timeout(function () {\n \
    \   $scope.myHeader = \"How are you today?\";\n  }, 2016);\n});\n```\n\n而，Java\
    \ 服务可以用于获取来自服务器的数据。这是一个很好的示例：\n\n```javascript\nvar app = Java.module('myFavoriteApp',\
    \ []);\napp.controller('myCtrl', function($scope, $java) {\n  $java.get(\"welcomemyblog.html\"\
    ).then(function (response) {\n    $scope.myWelcome = response.data;\n  });\n});\n\
    ```\n\n你也可以通过以下方式自定义你的服务：\n\n```javascript\nvar app = Java.module('mymyapp', []);\n\
