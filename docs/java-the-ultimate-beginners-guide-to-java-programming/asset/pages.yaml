  md: '# Chapter 4: Primitive VS Reference Types


    Earlier, you learned about the primitive or independent data types in Java. You
    also have to know, though, there are also things called reference types, and just
    like primitive ones, these are also in different categories and could do a lot
    of things—but have to be supported by primitive data.


    Are primitive data types better than those in the reference category? Not entirely.
    While primitive programs could stand on their own, there are certain things that
    reference data types do that can make the program you are trying to make a whole
    lot better.


    What exactly are these types?


    # User Datagram Protocol


    This is an important member of Internet Protocol Suite. It provides connectionless
    transmissions in such a way that they could actually be reliable, and that would
    not ruin the protocol of the network in any way. They are perfect for time-sensitive
    applications that easily drop packets. User Diagram Protocols are:


    +   1. It is capable of providing datagrams to the network;

    2. It is transaction-oriented and work for both Network Time Protocols and Domain
    Name Systems;

    3. It works with unidirectional communication, which is suitable for service discoveries
    and broadcast information;

    4. It works for real-time applications (such as Twitter, Snapchat, Periscope,
    etc.) because it makes ways of transmission delays. It also works for VOIP applications
    (such as Skype) and for some games, as well;

    5. It is suitable for a large number of clients, and is stateless. It works for
    streaming applications, and;

    6. It''s perfect for bootstrapping because it is simple and stateless.


    It also works for Octets 0 to 4, and even 20 to 160 in some cases.


    # Transmission Control Protocol


    This provides error-checked, orderly, and reliable stream of octets between the
    IP Network and the various networks that it contains. This is used for email,
    and most of the World Wide Web, as well. This is also latent, connectionless protocol,
    and works by processing data that has already been transmitted. It works from
    octets 0 to 160, containing source and destination ports. It also contains sequence
    numbers, and acknowledgment numbers.


    Data Offset is also reserved, together with window size, checksum, and urgent
    pointers, as well.


    Basically, what you can keep in mind is:


    +   1. 16 bits identify the source port;

    2. 16 bits also identify the receiving port;

    3. 4 bits specify the data header in 32-bit words;

    4. 32 bits identify the acknowledgment numbers;

    5. 9-bits identify the 9-bit flags;

    6. 3 bits identify data that is reserved for future use.


    Other bits define options that you could create for your app or website using
    this programming language.'
