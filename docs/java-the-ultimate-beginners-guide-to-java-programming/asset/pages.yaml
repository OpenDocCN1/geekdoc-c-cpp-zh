    # Arithmetic Operators


    Here are the arithmetic operators that you can use:


    +   1. + Addition. Of course, this adds values to your operators (a + b = 15)

    2. -Subtraction. This subtracts the operand on the right from the one on the left.
    (a - b = -10)

    3. /Division. This divides the operand on the left with what''s on the right.
    (b/a = 2)

    4. *Multiplication. Multiples whatever you have. (a * b = 200)

    5. // Floor Division. With this, you get quotient results, especially when decimal
    points removed. (9/2 = 4) (9.0/2.0 = 4.0)

    6. **Exponent. This helps you derive exponential notation. (a**b = 5 to the power
    of 10)

    7. % Modulus. Dividides operand on the left by the right and provides remainder.
    (b% a = 0)


    # Assignment Operators


    +   1. =\ Gives value to what''s on the right side back to the left operand. (c
    = a + b assigns value of a + b into c)

    2. -=Subtract AND. This subtracts the operand on the right from the left operand
    and assigns results to what''s on the left. (c -= a is equivalent to c = c - a)

    3. +=Add AND. This adds the operand to the right to the left and gives left operand
    result. (c += is equivalent to c = c + a)

    4. /=Divide AND. Divides left operand and assigns value to the left. (c /= a is
    equivalent to c = c / a)

    5. *=Multiply AND. Multiplies right operand with left operand and assigns result
    to left operand. (c *= is equivalent to c = c * a)

    6. **=Exponent AND. Derives exponential notation. (c **= is equivalent to c =
    c ** a)

    7. %=Modulus AND. Takes modulus of two operands. (c %= is equivalent to c = c
    % a)

    8. // Floor Division AND. With this, you get quotient results, especially when
    decimal points are removed. (c // is equivalent to c = c // a)


    # Identity Operators'
