    # Comparison Operators


    +   1. **==.** Condition equals true if the operands are equal. ((a==b) is not
    true)


    +   2. **!=.** If values are not equal, condition becomes true. ((a<>b) is true)


    +   3. **!== Condition becomes true if values of two operands are not equal.


    +   4. **<=.** Condition becomes true if left operand value is less than the right
