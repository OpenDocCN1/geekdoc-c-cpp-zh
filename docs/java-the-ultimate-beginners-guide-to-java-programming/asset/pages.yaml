  md: '# Chapter 7: Fields, Methods, and Constructors


    Next, it''s time for you to learn about certain elements that could strengthen
    the program that you are trying to develop, and these are fields, methods, and
    constructors.


    # Fields


    Fields basically are just the scopes that Java encompass. With these fields come
    terms that would help you understand what they''re really about. By knowing these
    terms, it would be easy for you to know what you''re dealing with—and coding wouldn''t
    be a problem.


    For this, you could take note of the following terms:


    +   **Ng-bind.** This means that DOM elements are being set. This means the value
    of the name would be seen inside the span element. Any changes made to the name
    would directly reflect on other elements of the DOM.


    ```

    <span ng-bind="name">/</span>

    ```


    +   **Ng-app.** This derives the root element so that behavior and directives
    would be defined, as well.


    +   **Ng-model-options.** This allows updates for the model to be done by fine
    tuning.


    +   **Ng-model.** This is almost the same as Ng-bind so that there''d be a bond
    between the scope and the view.


    +   **Ng-controller.** This means that HTML expressions are evaluated with the
    help of the JavaScript controller class.


    +   **Ng-class.** This are dynamically-loaded attributes.


    +   **Ng-show and Ng-hide.** This shows or hides the elements, which always depends
    on the Boolean expression formula. This could be achieved by CSS styles.


    +   **Ng-repeat.** This instantiates elements for a collection at least once.


    +   **Ng-view.** This is responsible for handling ON routes for the base directives
    which are also specified by controllers.


    +   **Ng-switch.** This helps you choose provide support for CSS3 Keyframe, CSS3
    Transition, and JavaScript. This also provides enough custom and direct directives,
    together with animation hooks,


    +   **Ng-aria.** This creates common ARIA attributes, and also serves as a mode
    of accessibility and support.


    # Arguments = Scopes


    In Java Programming, Scopes are equivalent to arguments. This happens because
    scopes bind JavaScript and HTML Element, which means that at some point, there
    would be some form of conflict, too.


    Scopes have available methods and abilities, and are available for both controller
    and the view. The view depicts HTML, while controller is JavaScript—which is the
    one responsible for controlling, editing, or deleting data.


    Scopes are also models with Properties and methods available for the user to use.
    It means that when changes are made, both controller and view will be affected—updated.


