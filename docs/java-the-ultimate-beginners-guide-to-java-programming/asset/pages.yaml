    # Membership Operators


    These check whether there is membership or coherence in a sequence.


    +   1. **Is.** Checks whether variables on either side are true. (x is y, here
    is in 1 if id(x) equals id(y)).


    +   2. **Not in.** Checks if a variable is not in a specified sequence and evaluates
    to either true or false. (x is not y, here is not in 1 if x is not a member of
    sequence y.)


    # Bitwise Operators


    These perform bit by bit operation. For example:


    ```

    a = 0011 1100

    b = 0000 1101

    ------------

    a&b = 0000 1100

    a|b = 0011 1101

    a^b = 0011 0001

    ~a = 1100 0011

    ```


