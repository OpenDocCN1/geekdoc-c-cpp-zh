  正如其他章节可能证明的那样，我非常喜欢玩诗人（bards）。我偶然发现了 1985 年发布的《吟游诗人》（The Bard’s Tale），由 Interplay
  Productions 制作（Glenday 2008:156）并由 Michael Cranford 编写。玩家可以在诗人、术术士、猎人、魔法师、僧侣、圣骑士、盗贼和战士职业中进行选择。与《地下城》（Wizardry）一样，术术士和魔法师在满足相应要求的情况下可以进入两个进阶职业，分别是术士和法师。更具革命性的是还可以从《地下城》和《魔法门
  III》（Ultima III）中导入角色。


  《吟游诗人》还为每首歌曲配备了独特的音乐，这些音乐是解决游戏中某些挑战的关键。最后，CRPG 赋予了诗人他们应有的尊重。《吟游诗人》因其施法系统而备受关注，该系统需要根据规则书确定的字母组合；这恰好也是一种软件防盗版措施。就像桌面版的《龙与地下城》一样，《吟游诗人》提供的地图很少，因此玩家必须自力更生。


  《吟游诗人》是首一个在怪物图片上使用动画的 CRPG。它还以图形化方式描述了哪些法术对队伍成员生效。《吟游诗人》引入了召唤怪物加入队伍的能力。它们从能喷吐火焰的攻击性野兽到吸收伤害的活体目标不等。《吟游诗人》是最早使用法术解决谜题的游戏之一。


  1985 年出现了由 Winston Douglas Wood 开发的《幻幻想》（Phantasie），由 Strategic Simulations, Inc.发布。它包含六个角色和多种职业可选：战士、僧侣、牧师、游侠者、盗贼和魔法师。种族包括矮人、精灵、侏精、半人、人类和“其他”（包括非人类种族）。《幻幻想》结合了一系列不同风格的玩法：城镇窗口处理商店部分，地下城和世界地图采用俯视视角视角，而一个独立的窗口则以二维视图表示角色在战斗中的队伍位置（Barton
  2008:103）。


  《幻幻想》的剧情围绕一个邪恶术士和他的黑骑士展开。需要二十卷卷轴来破坏他们强大的夺魂环。我很好地记得《幻幻想》。这是我的角色 Blast 的起源，一个专长将物体炸成碎片的精灵法师。后来，我将该角色转到了桌面角色游戏中，在角色扮演协会的“活动灰鹰”（Living
  Greyhawk）战役中担任塑能术。


  《地牢战士》（Gauntlet）于 1985 年在街机亮相。这部由 Atari 开发的奇主题地下城爬行游戏包含四个经典角色：精灵 Questor、魔法师 Merlin、战士
  Thor 和女武神 Thyra。《地牢战士》使用俯视视角，向玩家角色投掷源源不断的怪物，而玩家角色则通过武器或魔法、在远程或近战中击败。《地牢战士》将《龙与地下城》中最暴力、节奏最快的元素提炼成这种格式，直到《黑破坏客》（Diablo）才在桌面电脑上被复制。


  同样在 1985 年，《巫师冠》（Wizard’s Crown）引入了属性点数系统。最多八个角色可以从以下职业中选择：战士、牧师、游侠和术士。该游戏因其多职业设定而值得关注。《巫师冠》具有快速战斗功能，允许抽象处理多达
  99 名战斗者的战斗，而无需每个回合进行详细分解。《巫师冠》还使用了“距离”（reach）的概念——长柄等非远程武器可以在一定距离外攻击，这一特征在《高级龙与地下城》中引入，并在游戏的第三版中被正式化（Barton
  2008:105）。


  1986 年带来了由 Craigh Roth 和 David Stark 为 Apple II 开发的《春之之碎片》（The Shard of Spring）。它有一个五人组成的队伍，由最多五种族组成：矮人、精灵、侏精、人类和巨魔——但只有两个职业（法师和战士）。


  同样在 1986 年，《黑暗之境》（Realms of Darkness）包含四个种族：矮人、精灵、侏精、人类——以及八个职业：战士、术士、牧师、盗贼和四个声望职业。它还具有一个类似于互动小说的文本解析器。也许游戏中最有趣的方面是分散队伍的能力，这对于处理不同的遭遇或先遣侦察很有用（Barton
  2008:112）。


  1986 年，《魔法与魔法》（Magic and Magic）和《魔法与魔法：内殿之密》（Magic and Magic: The Secret of the
  Inner Sanctum）建立了一个复杂的宇宙，随后延续了另外九部作品，以及一款实时战略游戏《魔法魔法》（Heroes of Might and Magic）。角色可以从弓箭、牧师、骑士、圣骑士、盗贼和术士中选择职业。种族包括矮人、精灵、侏精、半兽人和人类。


  《魔法魔法》是最早引入“休息”（rest）命令的游戏之一，它可以恢复所有生命值和法力值。游荡怪物随时可能，因此玩家必须仔细选择队伍休息的地方。城市的设计是突破性的，特定的周期内商店会出售物品。法术成分系统非常简单，仅使用宝石。


  除了标准法术，《魔法与魔法》的法术提供了其他特殊效果，这些效果后来在桌面版《龙与地下城》中被复制。最具有代表性的是法术“棱光射线”（Prismatic Ray，等同于《龙与地下城》中的棱光射线喷射），它可以使目标中毒、石化、灼伤等。总而言之，《魔法与魔法》系列的区域非常巨大，超过二十个，每个区域都轻易等同于《地下城》的一层。


  J.R.R. 托尔金的《指环王 I》（The Lord of the Rings, Vol. I）也于 1986 年发布。它具有非线性玩法和永久角色。这部 CRPG
  明确将“结社”等同于“队伍”（Barton 2008:203）。


  《地下城大师》（Dungeon Master）于 1987 年由 FTL Games 在 Atari 上发布。它引入了实时三维玩法和多种创新，包括通过鼠标直接操作环境以及第一人视角。此外，角色的技能通过使用直接提高，与传统的《龙与地下城》式“升级”不同。施法需要了解符号以及如何组合它们来施放正确的法术。声音用于指示附近的生物，而生物的亮度取决于房间内的光源。它最终成为了
  Atari ST 历史上最畅销的产品，占了所有 Atari ST 的一半的市场率（Barton 2008:235）。


  作为《春之碎片》的续作，《恶魔之冬》（Demon’s Winter）于 1988 年登场。它增加了更多职业：狂战士、牧师、僧侣、圣骑士、游侠、学者、术士、盗贼、幻视者和法师。《恶魔之冬》还引入了对个人神明的崇拜，这最早在《高级龙与地下城》中引入，并在规则第三版中正式化。


  1988 年，《龙与地下城》终于成为了产生了如此众多模仿者的 CRPG 平台。由 SSI 出版的《光辉池》（Pool of Radiance）包含了标准的半人种族（矮人、精灵、侏精、半精灵、半人）和职业（牧师、战士、法师和盗贼）。然而，它依赖于相同的多职业规则，特别是限制多职业，这一直是一个复杂的平衡问题（Barton
  2008:146）。





  `Heroes of the Lance` 也由 SSI 出版，随之发布。根据玛格丽特·魏（Margaret Weis）和崔蕾·希克曼（Tracey Hickman）的《龙卷》小说，`Heroes
  of the Lance` 是一款使用真实地下与城统计数据的横版游戏。`Heroes of the Lance` 玩起来很有挑战性，因为怪物非常困难且无法保存游戏。然而，这款游戏值得注意的是它是一个真正的移植版——角色的地下与城数据与早些发布的《龙卷》规则书中的完全一致。事实上，版权保护的一部分要求在游戏附带的说明书中公布角色数据，但玩过桌面版的玩家可以通过查阅书籍中的数据来绕过该保护（Barton
  2008:148）。


  `Curse of the Azure Bonds` 是 `Pool of Radiance` 的续作，于 1989 年出版。作为前作的改进，该游戏允许角色达到更高的等级（五级至十级）并战斗更有趣敌人，包括首次在
  CRPG 中出现的黑暗精灵（drow）。它还包含了游侠者、圣骑士以及双职业系统。其他改进还包括陆地旅行的能力以及 `fix` 命令，该命令可以对角色施加治疗法术并为施法者执行法术记忆，加速了桌面机制的操作。


  `Hero’s Quest: So You Want to Be a Hero` 由 Lori Ann Cole 编写并由 Sierra On-line 出版，是一款采用独特游戏方法的单人游戏。自定义的冒险者从三个职业中选择一个：战士、法师或盗贼。虽然三个职业都拥有技能，但游戏会灵活地适应玩家的选择。技能通过使用来提升，而不是通过传统的地下与城等级系统。


  `Hero’s Quest` 脱颖而出之处在于其现实主义程度。它有昼夜循环，就像后来的 `Drakkhen` 一样，但 `Hero’s Quest` 将现实主义又进了一层。角色必须进食、必须休息，并且仅通过使用来增加魔法天赋。它将点点移动、探索与文本解析器结合在一起也值得关注（Barton
  2008:230）。


  由 Origin 出品的 `Tangled Tales` 于 1988 年首次亮相。`Tangled Tales` 在表现统计数据方面值得关注；大多数 CRPG
  与玩家共享游戏系统的底层逻辑，显示统计数字、经验值等，而 `Tangled Tales` 对其四个特质（魅力、智力、速度和力量）使用了形容词。它还引入了现在已广为人知的用于与其他角色交流的交互树。


  `Knights of Legend` 于 1989 年发布，是一款基于回合制的游戏，带有疲劳和远见等统计数据。它提供了超过 30 种角色职业供选择。它还具有一个针对特定身体部位的伤口系统。


  Marc Blank 于 1989 年出版了 `Journey: The Quest Begins`。玩家控制着冒险者队伍（Montfort 2003:145）。该队伍由一名木工、一名治疗师、一名巫师和一个商人组成。这是
  Infocom 在母公司光速互动关闭剑桥办公室之前发布的最后一款游戏，这使该公司缩减仅为一个品牌名。


  1990 年，MicroProse 发布了 `Drakkhen`。`Drakkhen` 的特点是它是首批拥有三维战场的角色游戏之一。它还具有昼夜循环和沙盒风格的玩法。怪物有着怪异的外观和恐怖的音效。四人队伍提供四种职业：战士、魔法师、祭司和侦察兵。`Drakkhen`
  以其充满致命怪物的随机遭遇表而臭名，利用其三维战斗引擎发挥了巨大作用，例如一个影人从地面升起发动攻击，一个巨大的猫头咆哮，或者星座本身活过来并降临战斗。大部分情况下，`Drakkhen`
  令人困惑且沮丧。


  1991 年见证了 `Eye of the Beholder` 的发布，这是一款第一视角的地下城体验。它作为拥有三维战场的角色游戏之一而闻名。它还具有昼夜循环和沙盒风格的玩法。四人队伍提供四种职业：战士、魔法师、祭司和侦察兵。DDrakkhen`（此处原文疑误，根据语境推测应为
  Hero''s Quest）在同样一年发布了 `Eye of the Be Quest`，它通过动画场面讲述故事。Hero''s Quest` 对前作的改进并不很大。


  J.R.R. 特尔金的《魔戒环：第二部：双塔奇兵》也于 1991 年发布。`The Lord of the Rings, Vol. II: The Two Towers`
  是一款基于回合制的游戏，带有疲劳和远见等统计数据。作为前作的改进，该游戏并不足以支持第三部（Barton 2008:205）。


  《遗忘之地》系列的最后一款游戏 `Pools of Darkness` 允许角色达到 40 级。由于沙盒风格，玩家可以专注于“升级”而非被推向目标。这种力量的提升是必要的。这种沙盒风格在现在许多游戏中很常见。


  `Treasures of the Savage Frontier` 跟随 `Gateway to the Savage Frontier`，是 Gold Box
  系列的最后作品。它允许角色达到十二级。某些非玩家角色根据玩家的行为产生情感。它还允许利用盟军（Barton 2008:157）。


  随着 Gold Box 引擎变得老旧，SSI 决定通过创建 `Unlimited Adventures` 来为它画上句号。`Unlimited Adventures`
  基本上是一个角色游戏构建包，汲取了之前所有游戏的精髓。可以创建数百种不同的怪物、触发器和区域，首次将冒险设计的权力引入电脑。


  `Eye of the Beholder` 的成功通过 `Dungeon Hack` 延续，它类似于 `Rogue`——一个随机生成的三维地下城。这款游戏极度成瘾；甚至我妈妈都入迷了！


  地下与城正式进入街机是 1994 年。`Tower of Doom` 是一款由四个不同角色（牧师、矮人、精灵和战士）战斗标志性地下与城怪物的横版游戏。





  幻想角色扮演游戏（CRPG）在 1997 年随着《最终幻想》（`Final Fantasy`）的出现实现了巨大的飞跃。《最终幻想》的影响通过漫画、书籍甚至电影渗透到各个。《最终幻想》的创新包括陆地移动、非玩家角色（`NPC`）互动以及动漫风格的战斗。其他游戏可能先实现了这些点，但《最终幻想》系列做得更好。


  1998 年带来了《地下与城》（`Dungeons & Dragons`）游戏的第二次复兴。BioWare 公司制作了《博德之门》（`Baldur’s Gate`）。《博德之门》采用了第三人角的实时战斗系统。阵倾向通过角色互动决定，角色在队伍中的位置也至关重要。此外，魔法的呈现具有叹为观止的细节。


  2001 年出现了由`Stormfront`开发的《光辉之池：米德纳诺遗迹》（Pool of Radiance: Ruins of Myth Drannor），作为同名“金盒”原作的回归。不同之处在于它使用了《地下与城》第三版规则集。但这并没有救了它。事实上，《光辉之池》是一场灾难，其不可原谅的过失从糟糕的动画和画面到甚至可以擦除硬盘的漏洞应有。Barton
  宣布《光辉之池》为“史上最糟糕的 CRPG”（2008:356）。


  同样在 2001 年，《冰风谷》（`Icewind Dale`）是 Black Isle Studios 的另一部续作。`Infinity engine`像之前的`Gold
  Box engine`一样开始显现老态，但由于开发周期的原因，游戏还是发布了。《冰风谷：寒冬之心》（`Icewind Dale: Heart of Winter`）发生在一个寒冷的地区，被被称为“世界之脊”的山脉与世界其他地方隔离。情节围绕一个复生的古王尸体展开，尸体被某种看不见的力量操控，将野蛮部落聚集成为一支可怕的军队。与各种具有独特动机的`NPC`的互动保持了故事的流畅性。


  游戏允许从零开始自定义六个角色，使用标准的第二版种族和职业组合。进一步的自定义包括武器技能、肖像甚至角色配音的选择。双职业（`Dualclass`）、多职业（`multi-class`）和武器专精（`weapon
  specialization`）都包含在内且效果良好。阵倾向和属性也很重要。具有不同魅力属性和独特阵倾向的角色会获得`NPC`的不同反应，而某些行动则强化了善良角色的本性。


  2002 年，BioWare 发布了《永恒之夜》（`Neverwinter Nights`, `NWN`）（Glenday 2008: 157）。`NWN`既是一个模块创建工具，也是一个冒险游戏。它允许玩家下载其他冒险内容，或者制作冒险并像“真正的”地下城主一样主持它们。它是最接近创建图形`MUD`的东西——而且可能创建一个比大多数`MUD`更大的游戏，一次最多支持
  64 名玩家。冒险引入胜且巨大，利用第三版规则。战役冒险系列对于其类型来说异常地成熟，涉及瘟疫、错误的选择、被谋杀的情人和复仇。战斗系统运行非常出色，甚至贸易系统也运行顺畅。角色是否提供帮助在很大程度上取决于角色的魅力。智力低的角色说话很奇怪（“我强！”）。怪物以三维形式精美渲染，将《怪物手册》（`Monster
  Manual`）中的静态艺术提升到了新的高度。然而，该游戏充满了漏洞。


  下一个时代，即我们现在的游戏时代，被 Barton 称为“现代时代”（`Modern Age`）——由动作、隐藏的游戏机制以及淡化键盘和鼠标使用并为手柄优化控制的主机所主导（2008:365）。


  2003 年带来了《地下与城：英雄》（`Dungeons & Dragons: Heroes`）。我在`Gen Con`看到了这款游戏，并为了玩它买了一台`Xbox`。游戏的玩法像《基础版地下与城》（`Basic
  Dungeons & Dragons`）。没有职业、种族或性别区分，因为角色是预生成的。法师是一个女性精灵，战士是一个男性人类，盗偷是一个女性半人国，牧师是一个男性矮人。角色从六级开始。此外，玩家角色拥有“祖传武器”，使用日式
  RPG 风格的“插槽”技术来增加武器效能。我们将在章后面详细探讨插槽。


  《博德之门 2：暗黑结联盟 II》（`Baldur’s Gate: Dark Alliance II`）是 Black Isle studios 的一部续作的续作，使用了与《地下与城：英雄》相同的引擎。英雄们穿梭各地，根据各种雇主的要求获取某些物品，所有这些雇主最终都联系在一起。《博德之门
  II》是一个平庸的续作，提供了更多相同的内容，只是更容易了。


  2004 年是 Lionhead Studios 的《传说》（`Fable`），这是一款主机机 RPG，它以仅专注于单一角色为荣，并给予玩家巨大的自由来按照自己的意愿培养他。游戏没有实现所有的承诺，但在角色自定义方面迈了巨大跨越。


  2006 年，《卷轴：上古》（`Elder Scrolls: Oblivion`）巩固了沙盒幻想角色扮演游戏的格式。每个角色都有自己的日常，每天都有固定的路线：睡觉、吃饭和工作。尽管情节贯穿整个游戏，但角色完全可以独自世界上游荡，在他们进行日常生活时与他们互动。


  ## 伙伴


  在 CRPG 中描绘冒险队伍的挑战在《巫妖职业》（`Wizardry`）中被体现，该游戏在当时非常受欢迎。与多人地下城不同，像《巫妖职业》这样的游戏允许一名玩家控制整组角色。关于这个主题有两种观点：角色沉浸
  vs. 队伍代表。


  角色沉浸涉及与角色建立联系。对于玩家来说，扮演整个具有不同性别、种族和职业的队伍要困难得多。然而，冒险小组非常符合托尔金的《伙伴》（`Fellowship`）和《地下与城》的精神。它还成倍增加了小组的策略性；更多角色意味着游戏复杂性的倍增。`Tarturian》就是一个例子，它允许多达十个角色的队伍。


  将队伍发展为比玩家棋子之外的东西是罕见的。一个显著的例外是 1992 年 Silmarils 开发的《艾夏：要塞传说》（`Ishar: Legend of the
  Fortress`），它将移除队伍成员的选择交由其他队伍成员投票决定（Barton 2008:241）。


  另一方面，有人扮演一个角色更容易扮演英雄。它还允许对游戏环境进行更多的控制。玩家获得了更多主动权，游戏可以使用“你”作为参考框架，而不会让玩家脱出游戏的沉浸感。目前的趋势似乎指向单一英雄模型（Barton
  2008:73）。


  这两类队伍之间的折中方案是从单一角色开始，但允许他招募其他队伍成员。这些可以是“随从”——与玩家角色相似但受其雇用的角色。也可以是付费雇用的佣兵（在《魔法蜡烛
  III》`Magic Candle III`中形式化）或召唤的怪物。


  ### 叙事


  CRPG 的美学问题在于它们很少讲述好故事。与书籍或电影不同，CRPG 强调设定和系统而非故事。相反，CRPG 实际上是模拟，几乎完全处于认知领域。与交互小说不同，底层的数字决定了幻想
  CRPG 中发生的大事件。


  由于 CRPG 倾向于战斗及其统计框架，战斗为冲突带来了随机性。广泛变量的不同结果确保了每次游戏都是新鲜的。这似乎是沙盒游戏的驱动力，游戏环境被变得尽可能扩张——通过足够的变量组合，游戏会产生自己的叙事（Barton
  2008:28）。





  由于战斗是许多电脑角色扮演游戏（CRPG）的核心，这类冲突的理由并无太大区别。正如 Aarseth 辞藻地描述的，`Diablo` 基本上就是画质更好的 `Rogue`（2004:50）。让游戏迷人的本质不在于它们所讲述的故事，而是我们所经历的世界——这就是为什么一个随机生成的地图或怪物对玩家来说，与人类创作的角色同样令人满足。


  一位《上古卷轴 III：洛山》（`Elder Scrolls III: Morrowind`）的玩家总结了在这类游戏中讲述故事的问题：


  “这是一款非常复杂的游戏，剧情极其复杂。但这并不重要，因为我一边跳来跳去地寻找我的下一个杂技技能点，一边施放随机的破坏系魔法来尝试掌握更强大的法术。如果我看到某个东西，我会用匕首刺它以获得更多经验，然后搜刮它的尸体凑齐足够的金币来学习酷的法术。在这个过程中，我完全错过了故事情节。我确定这一切很有趣——我回去看了它的部分内容。但这有什么意义呢？只是文字而已，对吧？我可以去杀东西了！”[Smith
  2010]。


  CRPG 的叙事可以分为以下几类（Walker 2007）：


  ### 搜索并毁灭

  冒险者负责寻找一个特定的反派并击败他。在微观尺度上，他们的目标是战斗一系列敌人，每一个都比上一个强大。在宏观尺度上，冒险者击败主反派，不像《指环王》（`The
  Lord of the Rings`）中的索隆。考虑到角色扮演游戏的血统，你可能认为最终目标是摧毁戒指，但由于某些原因，这种做法是很流行的（Barton 2008:428）。


  ### 递送

  英雄们收集一个物品并将其送到另一个地方。有时冒险者一开始就拥有该物品，有时他们必须获取它。在任何情况下，物品都有某种价值，因此可能会受到攻击。这种相似性也出现在《指环王》的任务中，戒指必须带到末日山被摧毁。这种方式，递送任务也可以搜索任务的一部分。


  ### 保护

  玩家护送非玩家角色或保护某个区域免受攻击。就像希登（Theoden）的最后之战一样，这种任务根根于《指环王》。


  ### 探索

  英雄必须找到某些东西或某人，通常作为递送任务的前奏。这几乎不可避免地涉及穿越地下城、消灭怪物，并探索大多数人都会避的区域。


  ## 任务与叙事结构

  任务起着重要作用。它们作为如何玩游戏的教程，并鼓励玩家探索。任务还帮助游戏“分块”，以便玩家以一种可以更容易消化的方式处理那些被认为令人生畏的内容（Walker
  2007:30）。


  在计算机处理能力有限的早期，说明书作为游戏体验的一部分，CRPG 的不同部分会参考玩家阅读的说明书。CRPG 结合了游戏书和互动小说元素，同时将处理能力留给画面和战斗。《魔法神庙》（`Temple
  of Apshai`）遵循了这种格式，《魔法大战》也是（Barton 2008:199）。


  由于元游戏导致的叙事中断问题在 CRPG 中存在了几十年。理想情况下，系统是不可见的（Moulthrop 2004:65），随着技术的进步，这一挑战变得越来越容易克服。有一些很有前景的发展。由
  Quantic Dream 开发的《暴雨》（`Heavy Rain`）是一部黑色电影惊悚片，拥有四个不同的角色，每个角色都有自己的视角。游戏没有交互的标准系统——上下文敏感动作随着它们的出现可用。死亡并不是游戏的结束；玩家继续使用剩下的角色。如果他们都死了，故事就结束了（Quantum
  Dreams 2010）。


  ### 个性化

  大多数 CRPG 像玩家拥有规则书一样显示属性——数字、数字、数字。角色创建格式遵循传统的《地下城龙》（`Dungeons & Dragons`）方法，分配给角色随机或静态数字。


  《地下城龙》最初提倡随机属性生成，玩家通过掷骰子来决定角色的属性。这在《高级地下城龙》（`Advanced Dungeons & Dragons`）中产生了重大影响，某些职业只有属性组合正确的角色才能担任。结果是玩家反复生成角色，直到得到他们想要的角色。


  最终，玩家意识到这是一项无意义的练习。CRPGs 努力解决这些问题。玩家可以一直投掷（虚拟的）骰子，直到得到他们想要的角色，就像玩桌面游戏一样。虽然有些玩家将有严重缺陷的角色视为角色扮演的机会，但另一些人从一开始就想玩特定的角色类型，如骑士。


  点数系统以确保玩家对角色属性的完全控制，同时限制角色能变得多强大，这在 CRPG 中很常见，并在《地下城龙》第三版中正式化，这反过来反映在《冰风谷 II》（`Icewind
  Dale II`）和《魔法大战》（`Dragon Wars`）中（Barton 2008:353）。几乎所有的 CRPG 都具有某种属性。最基础的是力量、敏捷和精神属性（通常是智慧或智力）。这三个属性构成了冒险者的核心，并提供了足够的活性来进行地下城探索。随着职业和角色的变得更加先进，属性也是如此。在大多数情况下，它们紧贴《地下城龙》的六项属性（*注：原文为“six
  Dungeons & Dragons statistics”，可能指代其核心属性或存在笔误，此处按原文意译*）。偶尔会添加一些属性，如感知或运气机制，后者在《克苏鲁的呼唤》（`Call
  of Cthhu`）角色扮演游戏中首次登场。《阿卡尼亚领域：命运之刃》（`Realms of Arkania: Blade of Destiny`）具有负面特质（从迷信到暴躁）和正面特质（从勇气到直觉，包括力量、敏捷、智慧和魅力的核心属性），它们相互平衡并影响游戏（Barton
  2008:243）。


  直到《纠缠的故事》（`Tangled Tales`），属性才用形容词而不是分数描述。《最终幻想：化身之路》（`Ultima’s Quest of the Avatar`）更进一步，使用玩家的性格而非角色的性格来决定可能的职业：牧羊人（谦卑）、技师（牺牲）、诗人（慈悲）、德鲁伊（正义）、战士（勇猛）、游侠（灵性）、骑士（荣誉）或魔法师（诚实）。加里特（Garriott）创建这些规则是为了在桌面角色扮演游戏声誉扫地时强化幻想角色扮演游戏可以给玩家的道德教训。1989
  年由 Broderbund Software 制作的《乌库鲁之心》（`The Dark Heart of Uukrul`）采用了多选择问卷的角色创建规则，而不是投掷属性（Barton
  2008:162）。Electronic Zoo 开发的《黑暗要塞》（`Darkspyre`）、U.S. Gold 出版的《上古卷轴：竞技场》（`Elder Scrolls:
  Arena`）以及 SSI 的《暗影预言》（`Prophecy of the Shadow`）都具有类似的机制。


  生命值和护甲等级在 CRPG 中也很常见，尽管某些被实时机制取代，玩家在其中控制角色躲避或击中敌人的能力。生命值尤其被边缘到了背景，被标志性的表示所取代：蜡烛（例如《时光时代》`Times
  of Lore`）、生命之石（例如《魔法大战 III：大地之岛》`Might and Magic III: Isle of Terra`）、药水瓶（例如《最终幻想地下世界：斯提亚深渊》`Ultima
  Underworld: The Stygian Abyss`）。






  除了上述两个战斗属性外，CRPG 领域的创新少得得令人惊讶。`Dragon Wars` 引入了眩直值（stun points），这与第三版《地下城与龙》中的非致命伤害有相似之处。基本上，一个角色在受到足够的眩直伤害后会失去意识，但不会死亡（Barton
  2008:198）。


  ### 技能系统


  技能系统要少见得多。《Advanced Dungeons & Dragons》从“次要技能”（secondary skills）开始——术语意味着角色的职业能力是其“主”技能。后的版本将次要技能重命名为“非武器精通”（non-weapon
  proficiencies），以与用于杀死怪物的技能区分开来。次要技能在`New World`的`Gates to Another World`中正式引入 CRPG
  领域（Barton 2008:188）。`Wizard’s Crown` 是首批拥有独立于等级技能系统的 CRPG 之一。


  《Advanced Dungeons & Dragons》之所以迟久没有引入技能的原因之一是通用技能模糊了职业之间的界限。第三版正式化了技能的使用，使得某些职业可以以更低的价格购买技能，从而在尽管有技能系统的情况下仍能保持每个职业的独特性。较早采用技能系统的
  CRPG 有时会犯一个错误，即让所有职业平等获得技能，例如 `Ascaron Entertainment` 出品的`Sacred`（Barton 2008:332）。


  过了很长时间，技能才表现为不仅仅是屏幕上的数字。盗贼技能是《地下城与龙》中最早最早的量化技能之一，通常是最常模仿的，仅仅是因为它们在屏幕上的呈现很有趣。开锁在`Hillsfar`中变成了一项官方的小游戏，自此以后它在主机机角色游戏中变得流行（例如，`Crusades
  of the Dark Savant`）。


  ### 阵营


  阵营在早期的 CRPG 中很少是一个因素。大多数游戏根本没有阵营系统。`Wizardry IV: The Return of Werdna`（名字是游戏创作者之一
  Andrew 的反写）让玩家扮演邪恶的 `Werdna` 角色，而该角色在第一部游戏中已被击败。随着 CRPG 变得越来越先进，阵营成为了一个更重要的因素，阻止某些角色加入某些职业，并禁止对立的阵营在冒险队伍中混合。


  当阵营开始发挥作用时，它具有简单的机制。杀死一个善良阵营生物会让角色变得邪恶，反之亦然。后来的游戏扩大了影响阵营的可能性。其中包括向特定宗教捐款、执行仁慈或残忍的行为等。`Fable`
  展示了量化道德行为的危险性；玩家只需向相应的邪恶或善良神灵捐款，就可以扭转游戏其他部分所做伦理选择的结果，本质上是“收买神灵”（Barton 2008:381）。


  ### 魔法物品与系统


  `Temple of Apshai` 是具有突破意义的，因为它是一个显式模仿传统桌面版 RPG 游戏风格构建的 CRPG。虽然来自桌面版《地下城与龙》的角色可以导入到游戏中，但种类令人眼花缭乱的魔法物品无法被兼顾。正如手册解释的，“基于微型计算机系统的局限性尚不允许使用从其他游戏中捡到的所有不同类型的魔法物品”（Johnson
  1982:9）。游戏的高层适合最高等级为 3 级的角色，而低层则适合最高 6 级的角色（Barton 2008:57）。


  提到魔法物品，日本角色扮演游戏引入了一项“插槽”功能，这与《地下城与龙》的“+N”系统有关。插槽功能将魔法物品的获取与武器护甲的改进结合起来。这允许不同的改进，例如插在武器或护甲上的绿色宝石可以分别赋予酸伤害或酸性。


  另一个在日语 CRPG 中常见的特性是组合物品的能力，从而创建一个不同的、改进后的物品。这种变体与插槽类似，提供了将普通物品与新结果混合的动力，使每件装备至少有两次使用机会。`Arx
  Fatalis` 就具有这种机制（Barton 2008:315）。


  ### 施法


  施法可能是 CRPG 与《地下城与龙》模板差异最大的地方。正如前面的章节所述，“中土世界”没有可量化的魔法传统，而文西学派（Vancian）并不受许多游戏设计师的青睐。法力点通常是解决方案，它允许更快地恢复法术，这反映了《地下城与龙》早期引入的灵能系统。


  其他施法系统包括组合元素符号、寻找反应剂（`Ultima`）、符文（`Arx Fatalis`）甚至甚至是手势（`The Summoning`）。有趣的是，尽管《Advanced
  Dungeons & Dragons》实施了基于组件的系统（分为语言、、体成分和物质成分），但对每个组件都要求的细致账目，意味着在实践中很少有玩家会追踪它。CRPG
  提供了一种追踪组件的方法，并让玩家对缺失的物品负责，这意味着施法变得更像是一种物品管理的挑战（Barton 2008:266）。


  ### 风险


  与交互式小说不同，CRPG 将玩家的能量集中在一个更窄的角色中，通常是战斗。继承了《地下城与龙》关于微缩规则和复杂性的遗产，这是幻想游戏中定义最清晰的机制。因此，CRPG
  往往比其他任何方面都强调游戏的这方面。


  从纯挑战的角度来看，虽然战斗可能很困难，但在统计上是可以克服的。在 `IF` 游戏中解决谜题可能会导致挫败，因为它是一个非黑即白的命题；玩家要么解开谜题，要么解不开。战斗使用了令人眼花缭乱的变量，是可以赢的。这导致了玩家方面的试错，尝试不同的队伍配置、使用什么魔法以及什么种族组合最好（Barton
  2008:27）。


  战斗怪物的一种变化是增加战斗的难度。在《地下城与龙》中，需要特殊武器来击败某些怪物，这在第三版中正式化。在第三版之前，`Questron` 就先实现了（2008:100）。


  另一个不涉及战斗的选项是谈判。早期版本的《地下城与龙》强调了当玩家角色处于劣势时与怪物谈判的重要性。`Wizard of Zot` 贿赂系统。`Temple of
  Apshai` 以及 `Phantasie` 也具有类似的系统，但在强调战斗的游戏中从未成为一种流行的手段。`Pool of Radiance` 将谈判提升到了新的高度，提供了不同的对话方式：傲慢、狡猾、友好、谦卑或辱骂（2008:146）。1989
  年 Konami 出品的`Bloodwych` 将这种机制进一步扩展到盟友身上，他们的自尊心得到极大满足，从而导致的结果从过度自信的从者到被讨好的商人提供更优惠的。


  游走怪物最好地体现了 CRPG 的战斗核心。角色只需坐着就会遇到怪物，迫使玩家始终保持警惕。对于没有休息机制的 CRPG 来说，这不是一个问题——游走怪物倾向于攻击休息中的角色，而角色则会派出卫兵。`Wizard’s
  Crown` 就具有这样的机制（Barton 2008:107），而 `Bard’s Tale` 会实时攻击队伍，伏击离开键盘的玩家。


  休息与文西学派形式的法术恢复密切相关；法力点系统往往随着时间推移而恢复，从而消除了通过休息来恢复的需求。






  # 早期机制


  早期出现的一种常见机制是为冒险者提供食物。最简易的游戏将食物作为一种治疗形式。从 `Akalabeth` 开始到整个 `Ultima` 系列，食物对生存至关重要。如果玩家角色用完食物，游戏就会结束。`Dungeon
  Campaign` 和 `Wilderness Campaign` 延续了这一趋势，将食物消耗量扩大到更大的群体，其规模类似于微型战争游戏。`Rogue`、`Might
  and Magic` 和 `Dungeon Master` 都引入了这种机制，要么在角色不进食时对其造成伤害，要么阻止其恢复（Barton 2008:236）。


  `Dungeon Campaign` 和 `Wilderness Campaign` 引入了另一个借自《龙与地下城》的复杂机制——负重（encumbrance）。对武器、盔甲和杂物设备的仔细计算是有代价的，特别是对于那些从地下城运出宝物的负重严重的角色来说。由于需要玩家自行计算每个物品的重量，而且超负重会有显著的劣势，很少有桌面游戏玩家能做好负重追踪。CRPG
  则没有这种限制。


  另一种让角色感到不便的方法是通过疲劳系统。疲劳可用于限制移动，使得角色无法轻易逃跑或进行长时间战斗。`Temple of Apshai` 使用了这种机制。此外，`Dungeons
  of Daggorath` 引入了一个在战斗和移动期间会加速的心跳机制。过快地执行过多动作会导致角色昏迷（Barton 2008:81）。


  视野是另一种让角色感到不便的方法。视盲冒险者无法探测到临近的怪物，会掉入陷阱，并难以绘制地下城地图。这种机制最好的例子或许是 `Wizard’s Castle`，它通过文本描述角色在远处能听到的声音，并使用地图上的图标显示他能看到的内容（Barton
  2008:49）。`Sword of Fargoal` 和 `Advanced Dungeons & Dragons: Cloudy Mountain` 也引入了“战争迷雾”机制。


  提到绘图，自动绘图（automapping）在 CRPG 中花费了很长时间。在早期游戏中，人们假设玩家会自己绘制地图，就像《龙与地下城》中指定玩家担任绘图员一样。


  # 保存的挑战


  对于 CRPG 玩家来说，最大的不便或许是一个元游戏挑战：存档。幻想角色扮演游戏往往比其他游戏更复杂、更深入，对连续性的依赖也更高。因此，存档点有时非常稀少且相隔远，因为游戏在保存之前必须考虑大量的变量。早期的
  CRPG 因为这些考虑甚至根本不屑于存档，而是实时运行游戏。其他游戏会在特定时间点保存，例如休息或到达城镇时。


  游戏设计者对存档功能似乎表现出真实的不满情绪（Juul 2004:138）。重新开始的能力意味着玩家可以通过确定游戏中没有长期后果的最优选择，来“玩弄”系统。存档还会将玩家拉出游戏的叙事，创造出一种阻碍主体性（agency）的不协调感，因为玩家每次都会提醒自己他是在玩游戏（Mateas
  2004:27）。开发者通过惩罚玩家来做出反应。某些游戏对存档会收取罚金，例如 `Legend of the Fortress` 会向玩家（及其角色）收取金币（Barton
  2008:242），而 `Blade of Destiny` 则扣除经验值。


  其他 CRPG 则公然不鼓励存档，如 `Elder Scrolls: Daggerfall`，它警告玩家不要滥用存档功能（Barton 2008:301）。最极端的是《龙战士》系列的
  `Shadow Sorcerer`：“如果发生不可避免的干扰，你可以将存档到磁盘。然而，不鼓励重复存档——像个汉一样接受失败吧……”（SSI Staff 1991:3）。


  ## 角色


  `Temple of Apshai` 的说明书将桌面角色扮演描述为一种辛苦的体验，需要一群“经验丰富的玩家”、一位愿意投入“构建功能完幻想世界所需的巨大时间”的知识大师，以及从四到二十小时不等的大段游戏时间。`Temple
  of Apshai` 认为 CRPG 更好——只需要追踪一个角色，“你可以按照喜欢的长短时间玩，并在任何你想玩的时候回来。”本质上，它允许玩家仅凭一个角色进行冒险或进行“单人”（Johnson
  1982:6）。


  ### 创建者角色


  拥有计算机游戏主角的优势是它可以追踪虚拟小队。在桌面上，划分小队要么需要游戏主进行额外的记录，要么需要一名共同游戏主。`Realms of Darkness`、`Crystals
  of Arborea` 和 `The Magic Candle` 都具备这一选项，这是在很久以后才出现的。`The Magic Candle` 进一步划分了小队，允许更偏向制造的角色留在后面赚钱（Barton
  200:124）。


  ## 冒险设计者


  创建游戏引擎是制作盈利游戏的关键。在创建了一个单一统一的游戏引擎后，开发者只需为后续作品制作插件式剧本。当游戏系统开始变得陈旧时，游戏发行商会发布构建集，允许公众创建自己的游戏，从而提高整体普及率。有时，这些工具集的用户制作的内容优于发行商本身提供的内容。


  这些工具集中的第一个是 Electronic Arts 于 1985 年发布的 `Adventure Construction Set`。它利用《阿里巴巴与四十个盗贼》和《赫拉克勒斯的回归》作为工具集，并包含了两个剧本，一个基于《吉尔伽美什》（Barton
  2008:84）。`Bard’s Tale Construction Set` 扩展了极受欢迎的《吟游诗人传奇》系列。`Unlimited Adventures`
  则建立在更广阔的“金盒”游戏之上。这些游戏创建了一种计算机游戏主，创建出其他玩家可以玩的内容。`Unlimited Adventures` 之后是 BioWare
  的 `Neverwinter Nights`（Barton 2008:172）。


  Bullfrog 的 `Dungeon Keeper` 将创建地下城变成了一整部游戏。虽然《龙与地下城》桌面版一直强调地下大师不是玩家唯一的对手，但 `Dungeon
  Keeper` 清楚地将该角色设定为敌人。在 `Dungeon Keeper` 中，地下大师的任务是向他的地下城中填充怪物，指挥他的仆从，并在入侵的冒险者面前让它们吃饱、快乐并存活。


  为其他玩家创建 CRPG 内容的最新创新是 `Neverwinter Nights`。我曾尝试用该工具集创建一个冒险故事，但从未完成。时间投入超出了我的能力范围。


  ## 参与者角色


  在 Wizards of Coast 对玩家的调查中，8% 的玩家玩过或正在玩 CRPG，约 730 万人。在这些人中，有 450 万人（即 5%）每月玩 CRPG。女性占玩家的
  21%。在角色角色游戏玩家中，33% 的人每月玩桌面角色扮演游戏，13% 的人每月玩微型战争游戏（2000）。


  ![[图形]](data/content-029.png)


  视频游戏正日益成为男女的共同领域。Beck and Wade (2004:49) 发现女性参与率正在增加。


  玩家


  游戏世界是深层的、隐含的商业性的（Beck and Wade 2004:61）。它是一种专门的消费体验，以一种自为中心的方式导向玩家。它本质上是一场精心构建的剧场。它是极度自我肯定的，很少有玩家在现实生活中可能遇到的后果。


  角色角色






  CRPG（角色扮演游戏）的一大主要区别在于增加了图形化化身。这些化身的外观对向玩家传达形象具有强大的影响。它们既是沉浸感的核心，也是虚拟社区的基础（Taylor
  2006:110）。


  早期游戏使用瓦片系统来代表角色，这些系统最终演变为肖像。而这些肖像又变得动态，并添加了音频组件，进一步丰富了每个角色的个性。肖像变成了三维角色，通常以俯视图或等轴测视角的形式存在。这种等轴测视角类似于桌面游戏中微缩模型的使用。除了等轴测视角，三维游戏将玩家置于角色的视角，通过他或她的眼睛观察世界。Barton
  将这种桌面微缩模型的游戏与文本描述的游戏区分开来，后者需要玩家在自己的想象力中视觉化场景设定（2008:317）。这种区别既关乎视觉化，也关乎角色扮演。桌面上的微缩模型在角色和玩家之间提供了一种字面上和比上的距离感。相反，第一人称视角的
  CRPG 让玩家置于角色的位置，创造了一种代理感（Pearce 2007:311）。


  ## 性别


  与之前的互动式小说游戏一样，CRPG 通常避免区分性别。但计算机图形需要对性别做出界定，而互动式小说不需要，因此大多数玩家角色始终是男性。拥有女性主角的 CRPG
  极其罕见。后来的游戏提供了选择角色性别的机会，交由玩家决定。


  随着 CRPG 变得越来越先进，性别互动也随之发展。角色可以恋爱、私交，甚至诱惑其他角色。Troika 的《元素恶神殿》（Temple of Elemental
  Evil）是首个允许两个男性角色结婚的游戏（Barton 2008:357）。最近，《神界》（Fable）允许角色结婚，但这一行为对游戏本身的影响很小（Barton
  2008:380）。


  值得注意的是，纸笔角色扮演游戏首先按种族为属性值引入了性别修正符，《光辉之池》（Pool of Radiance）也随其后。《费尔盖尔传奇》（Legend of
  Faerghail）也区分了性别，为女性提供更好的智慧和体质，为男性提供更高的力量（Barton 2008:199）。


  ## 种族


  CRPG 中的种族差异很大。许多游戏沿用了 Gygax 认定的“半人”等传统《地下与城》种族：精灵、矮矮人和霍比特。另一些游戏则分化了出去。毕竟，尽管在后来的《高级地下与城》（Advanced
  Dungeons & Dragons）中表现出疑虑，但《原版地下与城》盒装版允许几乎任何角色进行进阶。


  托尔金对 CRPG 中种族的影响是深远的。正如 Barton 在《地下城与桌面》（Dungeons & Desktops）中所指出的，许多早期 CRPG 紧贴《魔戒环》中的结队模式，包括名为“霍比特”的种族（2008:202）。与《地下与城》一样，种族在外观上主要以白人为主。一个不幸的例外是《血与荣誉》（Blood
  and Honor），它安排了一个非洲裔美国人作为唯一的盗贼角色（Barton 2008:310）。


  《幻想世界》（Phantasie）可能是奇幻种族多样性最好的例子，玩家无法刻意选择获得哪个角色，但仍然可以玩非标准种族，包括食鬼、哥精、狗妖、蜥蜴人、人头怪、魔鬼、兽人、精灵、精灵或巨魔。《魔法魔法：毁灭日》（Might
  and Magic’s Day of the Destroyer）甚至提供了将龙加入队伍的能力。《幻想世界》不仅提供了广泛的种族，还强调了种族属性在游戏中的性，包括与商人的种族关系、某些种族进入特定区域的能力以及不同的年龄增长（Barton
  2008:102）。


  大多数 CRPG 都忽略了种族等级限制，也忽略了多职业限制——这些规则直到后来官方版《高级地下与城》转向桌面平台后首次出现。


  ## 职业


  早期的 CRPG 特色是一个角色，一个全才型人物。这些多才多艺的角色不容易受到《地下与城》职业体系固有缺陷的影响，因为该体系被设计成是相互依赖的。在 CRPG
  中，普通人英雄可以像战士一样熟练地战斗，像盗贼一样安静地潜行，并像法师或牧师一样阅读卷轴或施放法术。总而言，早期的角色更像《地下与城》中的吟游诗人或游侠。


  随着 CRPG 的演变，职业变得更加专业化，具有与早期《地下与城》中相同的职业组合：战士、法师和盗贼。这三个职业存在的原因可能是由于处理每个职业能力所需的系统非常复杂。战士只与核心战斗规则进行交互，而盗贼在与环境（墙、门等）交互方面则稍微复杂。


  另一方面，法师通过他们的法术极大地复杂了游戏。施法者超越了基础的战斗规则。在早期的 CRPG 中，法术系统是简单的事务，无论玩家角色的能力或职业都可以施放。CRPG
  中的施法演变为一种点数购买系统，大多数游戏都放弃了“文西式”（Vancian）魔法风格。法术位（spellslot）系统直到授权的《高级地下与城》游戏亮相后才出现。


  也许由于 CRPG 而变得最受欢迎的职业是吟游诗人。《吟游诗人传奇》（Bard’s Tale）努力让吟游诗人成为一个迷人、魅力的角色。它还包含了一系列吟游诗人歌曲，将该职业的丰富程度远超《地下与城》的原始草案（Barton
  2008:94）。


  ## 参与者


  根据 Wizards 的调查，电脑玩家的平均年龄为 26 岁，主机玩家的平均年龄为 23 岁，两者都玩的玩家平均年龄为 20 岁。在每月的游戏中，72% 的电脑玩家也玩纸笔角色扮演游戏，57%
  同时玩主机和电脑游戏，54% 只玩主机游戏。正如 Dancey 所解释的，玩电子游戏的人仍然会有时间玩纸笔角色扮演游戏。“这两项追求在宏观经济的可支配收入竞争之外似乎是‘互补’的或‘非竞争’的。”






  # 随从


  想要充实队伍的玩家依赖于另一种 NPC，即随从（henchmen）。随从与其他 NPC 的不同在于，尽管他们是盟友，但电脑仍然控制着他们的部分行动。这类似于 `Advanced
  Dungeons & Dragons` 中的随从，它们有自己的士气修正值，以帮助决定它们对危险的反应。这些功能最广为人知的实现或许是《博德之门》，》，在那个游戏中，随从会考虑阵营考量、独特的个性和士气（Barton
  2008:346）。


  计算机操作的随从存在一个老老的问题，即它们的表现不如玩家角色。除了战斗、防御以及以与玩家战术配合的策略方式对抗敌人外，随从最常提到的挑战是寻路（pathfinding）。


  寻路是随从绕过障碍甚至是对手的能力。玩家明白如何绕过桌子、穿过门进入下一个房间。然而，计算机控制的随从可能会在桌子旁停下，或者认为门太麻烦而走出建筑，绕远远远的路线到达其他同伴身边。这在怪物横生的地下城中尤为危险，因为片刻的犹豫就意味着死亡。多位玩家曾因随从由于寻路能力差而走丢且再也没有回来而感到沮丧。


  # 坐骑与驮用动物


  尽管马和驮用动物一直到《指环王》时代都是奇幻世界的标配，但在 CRPG 中，坐骑很少出现。当它们出现时，坐骑主要是作为移动容器，其唯一目的是扩展角色携带更多装备的能力。


  《地下城守战》将驴子作为队伍中的重要成员。驴子是如此关键，以至于它们占据了通常由随从填充的位置。这迫使玩家必须选择他们更看重哪一个：是战斗中多一条手臂，还是驴子相当的装备携带能力（Barton
  2008:335）。《地下城守战 2》扩展了驴子和其他动物伙伴，让它们可以通过投喂不需要的装备来像其他随从一样升级。


  ### 状态


  大多数 CRPG 的等级提升是通过杀杀怪物获得的标准经验值积累来实现的。很少有 CRPG 跳出经验值的“刷肝”范式。《卷轴：3：洛山人》是一个显著的例外，在那个游戏中技能是通过练习来提高的。虽然这在理论上确保了角色只在他们最常用的技能上进步，但在实践中，玩家可以很容易通过不断重复某个特定动作来滥用系统，人为地提高其效率。


  CRPG 中的等级由于其加速的时间周期，使得全天候冒险变得更加可行。《地下城与龙》规则最初是为长时间的中期游戏设计的，现在承受了更快的战斗、冒险和经验获取速率。这导致角色达到了比原桌面游戏创造者预想的高得等级。


  《世界之门》是最早揭示无限等级进度结果的 CRPG 之一，其中数百个敌人和武器加成达到了双位数（Barton 2008:188）。


  《光辉池》是对 `Advanced Dungeons & Dragons` 规则到 CRPG 平台最忠实的改编。种族限制依然存在并带有等级上限，将奇幻角色扮演游戏带回根源，但也代表了其发展的一次倒退。


  CRPG 在多职业组合的可能性上真正推向了边界。多职业系统在《魔法职业》中首次亮相，角色可以选择其他职业的组合。声望职业（《地下城与龙》第三版的一部分）在《魔法职业》、《酒鬼传奇》、《幻影》和《黑暗领域》中就已有预示（Barton
  2008:71）。《酒鬼传奇》更进一步，允许角色结合四个职业以加入第五个声望职业，且没有多职业带来的经验值惩罚。其他允许“声望”职业的游戏还包括 `Sierra
  On-line` 于 1990 年出版的《火之试》（Barton 2008:230）。《博德之门》包含了官方第三版 CRPG 版本的声望职业。在达到 20 级并对自己的过去进行足够的研究（当然需要花费金币）后，角色就可以加入声望职业。


  ## 结论


  CRPG 继续了《地下城与龙》的演化之路，对规则进行了改进和实验，经常将其弯曲到超出其原始意图的程度。在桌面游戏中可能很少使用的规则在 CRPG 中突然变得非常重要。例如，角色的年龄限制在
  `Advanced Dungeons & Dragons` 中存在，但并不是游戏的主要因素——只有少数怪物能让角色提前衰老。但在一个快速点击自身时间线的 CRPG
  中，角色衰老并死亡是完全可能的（Barton 2008:324）。


  其他规则被尝试并最终被丢弃。随着计算机处理能力的提高，从说明书中阅读文本、模仿地下城朗读文本的做法被放弃了。计算机现在通过显示文本、让叙述者朗读文本或简单地显示不需要叙述的详细图形表示来传达叙事。同样，绘制地下城地图——《原始地下城与龙》的核心——随着自动绘图工具变得过时，后者已成为每个
  CRPG 的标准部分。


  CRPG 加速的设计周期在管理种族和职业的规则上最为明显。多职业规则被丢弃，最终允许任何种族玩任何职业。阵营原本是一个让违规玩家与其角色保持一致的工具，现在从一个无关紧要的标签变成了与游戏宇宙交互更为复杂的手段。


  正如《地下城与龙》将重心从模拟转向故事，再到两者的混合，CRPG 的重心也遵循了同样的路径……随着主机游戏的出现，再次回归到模拟重心（Mechner 2007:115）。随着像《暴雨》这样侧重故事的游戏出现，人们希望未来的
  CRPG 能让“角色”重回到角色扮演中。


  # 八大大型多人在线角色扮演游戏


  你可以像玩 `D&D` 游戏一样组建队伍，但你的队伍成员之间只能“某种程度上”合作。这与真正在一个小组中在一起不是一回事 [Dave Arneson, 2004]。


  ## 引言


  大型在线角色扮演游戏（`MMORPGs`）的产生受多种影响。严格来说，它们是图形化的多用户地下城 (`MUDs`)，但那过于简单了。事实上，`ORPGs` 更多是计算机角色扮演游戏
  (`CRPGs`) 和 `MUDs` 的混合。


  大型多人增加了两个新维度，使得这种形式与其前身有所区别并独立出来：图形和规模。在规模方面，大型多人增加了对 `MUDs` 的访问量。队伍规模扩大，以应对更大的挑战，这包括超过十名玩家同时攻击一个敌人。这意味着世界承受了极其大量的流量，从通信频道到怪物，从宝藏到交换系统。这对于
  `MUDs` 的规模扩张证明是一个问题。





  环境是另一个设计挑战。当渲染水元素时，玩家想要学习如何游泳。作为角色扮演游戏的元素，马匹引入了坐骑和负重动物。更好的画质对法术影响尤为；不同形式的施法会有不同的视觉效果。


  受画质影响最大的可能是化身本身了。玩家希望控制自己的身高、体重、纹身和服装。这在女性角色中表现得最为明显，因为她们在外观上被高度恋物化。角色行走、跳跃、鞠躬和坐下的姿态突然以一种以前未曾视觉化的方式变得重要起来。


  画质和尺寸这两个因素的结合，动摇了构建它们的游戏服务器的根基。在大学服务器上曾非常强大的 MUDs（多用户地下城），其规模范围被大幅削减，恰恰是因为网络能力无法胜任处理所有的
  `variables`。大型多人游戏必须应对大量的计算，从天气到地形，到屏幕上每个非玩家角色的伤害状态。这是一项巨大的负载，直到最近，互联网上的分布式服务器才胜任这项任务。


  克里斯·珀金斯（Chris Perkins）在《世界与怪物》（*Wilkes 2008:87*）中解释了第四版是如何受到 MMORPG 影响的。根据珀金斯的说法，天赋树是所有幻想游戏设计的自然演变。D&D
  仅仅是在沿着其他游戏开发者已经走过的道路。然而，他确实承认 D&D 设计团队从 MMO 中“学到了一些东西”。


  ### 历史


  第一个第一人称射击游戏可能是 1974 年的 `Maze War`，由 Dave Lebling 和 Greg Thompson 为 `Imlac PDS-1`
  创建（Glenday 2008:184）。这款支持多达 8 名玩家的三维第一人称游戏允许角色在由矢量图绘制的迷宫中互相射击。


  1977 年，`Moria` 是最早的图形化 MMORPG 之一。它提供了第一人称的三维线框视角的地下城。角色可以分组合作，但一个玩家也可以控制一个大群体。`Moria`
  中只有四项属性：机智、虔诚、勇气和魔法。每种属性与玩家角色可以加入的四个公会相关联：盗者、兄弟会、骑士和魔法师。`Moria` 没有采用生命值，而是采用了活力（vitality），用于战斗和其他动作，并且只有当角色手头食物和水时才能补充。在
  MUDs 正在传播的时代，`Moria` 的画质值得关注，但由于其专有程序，它局限于 `PLATO`（Barton 2008:33）。


  1979 年，布鲁斯·马格（Bruce Maggs）、安德鲁·沙皮拉（Andrew Shapira）和大卫·赛德斯（David Sides）在伊利诺伊大学发布了
  `Avatar`。`Avatar` 支持最多 10 种不同种族，模型更接近《地下城与龙》，包括标准的六属性。`Avatar` 的特点在于允许最多 15 名玩家组成队伍队战斗怪兽（Barton
  2008:34）。


  1985 年，卢卡斯电影公司的兰迪·法默（Randy Farmer）和奇普·早晨星（Chip Morningstar）为 `Commodore 64` 创建了
  `Habitat`。它同时支持超过 16 名玩家。`Habitat` 创造了“avatar（化身）”一词来作为玩家的代表。


  20 世纪 80 年代后期，Sierra On-line 和 Genie 在专有网络上拥有自己的持久世界，但这些世界并未向整个互联网开放。互联网的商业用途受到国家科学基金会网络（`NSFNET`）可接受政策的限制。随着这些限制的放，其他游戏公司开始在互联网上推出游戏。


  在 AOL 上，唐·达格（Don Daglow）和凯瑟琳·马塔加（Cathryn Mataga）发布了《冬日夜》（Neverwinter Nights）。这是首款官方的《地下城与龙》
  MMORPG，一直运行到 1997 年（Archer 2004:86）。它允许最多 500 人在线一起玩。《冬日夜》还见证了玩家公会的兴起。


  1992 年，乔·伊巴拉（Joe Ybarra）的《Shadow of Yserbius》在 `Sierra Network` 发布。


  《The Realm Online》由 Sierra Online 于 1996 年发布，是一个二维图形引擎，其特色是《地下城与龙》风格的角色等级、基础用户界面和回合制战斗。我曾短暂地作为一个押韵的巨魔
  玩过 `Realm`，并对此留有怀念——尤其是杀老鼠的部分。在巅峰时期，`Realm` 达到了 25,000 名订阅者，但随着三维大型多人在线角色扮演游戏的到来，它后来了衰落。截至
  2007 年，它大约有 12,000 名订阅者。


  互联网第一个 MMORPG 是 `Meridian 59`（Glenday 2008:170）。`Meridian 59` 由 3DO 于 1996 年发布，将大量玩家整合到一个持久世界中。是电子艺公司的联合创始人特里普·霍金斯（Trip
  Hawkins）帮助创造了“大型多人（massive multiplayer）”这一术语。


  `Meridian 59` 值得关注，因为它使用了三维图形，这与《毁灭战士》（Doom）等游戏使用的技术相同。由于每个服务器同时有多达 250 人，共有十二个服务器，`Meridian
  59` 是互联网上最大的图形游戏之一。


  `Meridian 59` 建立了固定的月费，而不是订阅服务使用的按小时计划。这是 MMORPG 人口扩大到更大市场的原因之一。将费用规定为按月支付也将成为之后
  MMORPG 的常态。


  道路已经铺就。取决于下一款游戏如何为 MMORPG 世界带来品牌力量。1997 年，情况发生了。Origin Systems 发布了《创世纪时代》（Ultima
  Online），它是理查·加里奥（Richard Garriott，又称 `Ultima series`）的后裔。


  与 `Meridian 59` 不同，《Ultima Online》 采用了俯视视角，这正是 `Ultima`（Glenday 2008:178）。凭借 200,000
  名玩家，《Ultima Online` 证明了 MMORPG 市场是可行的。


  《Ultima Online》在《第三黎明》（Third Dawn）发布后不久达到了 240,000 名订阅者的峰。从那时起，《Ultima Online》 一直稳定下降，降至
  75,000 名订阅者。


  在经历了自己的玩家杀和偷窃经历后，我让免费试用过期了，再也没有回头。


  1996 年，宋杰（Jake Song）通过 `Nexon` 发布了《风之国》（Kingdom of the Winds）。由于《世界二法》阻止了游戏进口，韩国准备好迎接一款可以称之为自己的本土游戏。凭借韩国庞大的游戏人口和对宽带的投资，《风之国》吸引了超过
  100 万订阅者。


  1997 年是 MMORPG 的黄金时代。《Ultima Online》、《EverQuest》和《Asheron’s Call》都表现出不受限制的增长。这些游戏还没有互相争夺流量，因为有足够的玩家供它们使用。估计年增长率为
  152%（Woodcock 2011）。


  NC Soft 在 1998 年发布了宋的下一款游戏《传奇》（Lineage）。这是一款俯视二维游戏，《Lineage》与其说是升级，倒不如说是资源管理。`Lineage`
  考虑了更大的团队，相比之下美国的小组通常要小得多。这使得 `Lineage` 成为了一种社会现象，鼓励了大量玩家同时登录。韩国有超过两百万玩家，台湾有一百万玩家，《Lineage》在全球玩家基数超过四百万。从那时起，《Lineage》的订阅人数有所下降，部分原因是由于《传奇二》和《魔兽》的竞争。到
  2007 年，《Lineage》 只有一百万订阅者，美国仅有六千名。





  不久后，微软于 1999 年发布了《阿瑟召唤》（Asheron’s Call）。《阿瑟召唤》试图摆离对《指环王》的根源，将精灵族替换为奥尔索伊（猫人）和斯拉武（蜥蜴人）。在其巅峰时期，《阿瑟召唤》拥有
  120,000 名订阅用户。扩展包《黑暗主宰》（Dark Majesty）提升了这一数字，但之后就开始下降。截至 2007 年，订阅人数降至 15,000 人（Barton
  2008:408）。


  20 世纪 90 年代后期，MMORPG 类型扩展到了幻想以外的设定，到 2001 年时，MMORPG 似乎已经开发殆尽。科幻 MMORPG《无政府状态》（Anarchy
  Online）在发布时步履维艰。《际界时代 2》（Ultima Online 2）在开发过程中被取消。这是 Bruce Sterling Woodcock（2010）所说的“转型时代”。《阿瑟召唤》和《永恒世纪》（EverQuest）的增长率放缓，《际界时代》的玩家群体开始萎缩。期待加入《际界时代
  2》测试版的《际界时代》客户在取消消息公布后完全退出了游戏。随着《无政府状态》和《剑术时代》（Dark Age of Camelot）进入测试测试阶段，这两款游戏都开始蚕食“三巨”的玩家基础。尽管月费承诺无疑是决定玩家能投入多少游戏的因素之一，但空闲时间可能是最大的流失因素。


  2001 年的《剑术时代》回归了幻想根源，并取得了评测上的成功；它发布时没有重大漏洞，拥有更完善的玩家对（PvP）机制，且升级所需的时间更短。《剑术时代》可能导致了其他三款游戏中大部分的流失。根据
  Woodcock 的说法，《永恒世纪》和《际界时代》损失了近 200,000 名订阅用户，他认为这些用户流向了《剑术时代》。剑术时代》在巅峰时期达到了 250,000
  名订阅用户。Woodcock 估计 2008 年的订阅人数低至 45,000 人。市场正变得饱和。在此期间，MMORPG 的平均年增长率为 55%。


  从 2002 年 5 月开始，被 Woodcock 称为“竞争时代”，竞争变得白热化。许多新生的 MMORPG 在发布前就被取消了。玩家群体萎缩。订阅量的平均年增长率仅为
  37%。然后《魔兽世界》出现了，一切都改变了。


  2004 年，《魔兽世界》爆发出现。它不仅表现优于其他 MMORPG，还在全球创造了新记录，成为北美、欧洲和中国市场份额的领导者。正如《际界时代》在其 IP 的基础上构建一样，《魔兽世界》建立在《魔兽》品牌的基础上，并且发布时比其前作少得多漏洞和故障。这种精益细琢换来了无所未有的订阅量，轻松超越了其最接近的竞争对手《永恒世纪
  2》（EverQuest II）。由于这只“八百磅大猩猩”，其他 MMORPG 变得日益衰落，订阅量平均增长仅为 17%。


  《魔兽世界完善了其他 MMORPG 难以实现的目标，在本文写作时，它继续主宰 MMORPG 领域。截至 2010 年，它拥有超过一千一百万玩家，并占据了大型多人订阅市场大部分份额。


  2005 年 8 月 4 日，中国政府宣布禁止 18 岁以下未成年人玩所有“暴力”游戏。中国官员宣布任何涉及玩家对玩家（Pv）战斗的游戏均为暴力，而这是 MMORPG
  的共同特征。同年 8 月晚些时候，中国政府实施了网游限制，玩家连续游戏不能超过三小时。


  2006 年，Turbine 公司发布了《地下城与地下》（Dungeons & Dragons Online）。《地下城与地下》设定于艾伯伦（Eberron）战役设定中的赛德瑞金大陆。玩家可以创建与桌面游游戏中相似的角色。《地下城与地下》拥有矮人、精灵、半身人、人类以及一种被称为“构装”（Warforged）的新型机器人类人类。在职业方面，玩家可以从野蛮人、吟游、牧师、战士、游侠、盗贼、术士和法师中选择。截至
  2007 年，《地下城与地下》拥有 45,000 名订阅用户。2010 年，《地下城与地下》变为无限免费，不再收取进入游戏的费用。


  2007 年 4 月，《指环王在线》上线。这是第一款以托尔金世界为特色的大型在线角色扮演游戏（Glenday 2008:185）。


  ### 结社


  合成世界的设计与《地下城与地下》拥有相同的哲学——创建一个可以归属的社区（Taylor 2006:32）。人们愿意花钱进入一个需要完全陌生人之间合作的宇宙，这对于当代社会来说并不是什么小的评价（Castronova
  2005:274）。


  大多数 MMORPG 都有一种寻找组队或小组的方法（Taylor 2006:39）。虽然玩家可以通过公会效忠、元游戏关联，或简单地走向另一个玩家角色询问他们是否愿意合作来组队，但也有一些考虑使得这种组队更具可行性。决定组队兼容性的首要因素是角色。与桌面游戏不同（在桌面游戏中，由于相同的玩家参加每次游戏，每个人的角色是确定且稳定的），MMORPG
  玩家具有高度的可变性。如果通过公会或其他结构做出正式承诺，特定玩家可出现的概率将大大增加。如果失败了，玩家可以利用 MMORPG 的人口力量，让系统建议同样在寻找队伍的可用玩家。


  我采访的一位 RetroMUD 玩家觉得在 MUD 上寻找新玩家比在 MMO 上更舒服：


  ```我发现发现在大型大型 MMO 中，对我来说开始与人们聊天更困难。在 MUD 中，较小的玩家群体和更熟悉的脸孔让我感到更自在一点。尽管在人多时我在公共频道上感到不那么自在，当我玩
  WoW 或 RetroMUD 时，我需要那里有社交体验。奇怪的是，较小的玩家群体实际上让我更容易找到人聊天。也许是因为在较小的环境中人们更友好。```


  小队有有自己的系统来支持他们。其中一名玩家（通常是队长）决定整个小组的移动。无论小队名称是什么，所有小队成员都会收到相同的标签（tag）。他们在成员之间获得并共享经验值。每个小队还有有自己的通信频道以方便游戏，就像玩家在桌面游戏中互相聊天一样。通过协调努力，小队可以击败更大的怪物并完成更长的任务，从而强化了这些社交微网络的重要性（Taylor
  2006:40）。





  《魔兽世界》和《地下城与战士》（Dungeons & Dragons Online）都采用了“实例化”地下城，即专为该玩家小组生成的地下城。这里没有遇到其他小组的可能性，确保了在城镇之外不会发生“刷宝”或其他与其他队伍的互动的行为。这意味着一个队伍的冒险体验是独特的；他们的存祸完全取决于自己的运气（Barton
  2008:420）。


  《地下城与战士》的另一个独特之处是其人数多达六人的队伍。团队游戏由一位叙述者辅助，提供了游戏特征的概述，而这些特征是仅通过文本或图形无法表达的。除了游戏引擎处理的视觉和听觉，游戏设计师还可以表达嗅觉和感受。这是通过某种虚拟的“地下城主”（Dungeon
  Master）传递的，某些地下城甚至由已故的加里·盖格克斯（Gary Gygax）叙述。在 DDO 出现之前，叙事性配音结构主要局限于桌面游戏（Douglas
  and Hargadon 2004:201）。


  《地下城与战士》甚至有一种公平分配宝藏的机制，通过分配掉落物，让玩家根据自己的等级获得相应的份额。值得注意的是，杀死怪物并不总是冒险的核心；冒险的完成（而非杀戮本身）提供经验值，这与桌面游戏是一样的。在进入冒险时，队伍成员可以选择他们想要体验的挑战等级（普通、困难、精英），并为没有组队就进入冒险的玩家增加了“单人”难度。每个难度都有最低等级要求，低于要求三级的角色将不被允许。冒险的经验值会根据队伍的整体等级进行调整，同时兼顾了高等级和低等级玩家。


  ### 团队游戏的演变


  除了基础的队伍框架外，很少有大型多人在线角色扮演游戏（MMORPG）能够扩展原始桌面游戏范式的边界。所缺失的是利用大型小组的能力，而这在传统的《地下城与战士》中会变得难以管理。为了应对这一需求，《永恒之境战》（EverQuest）是首批推出“团队战”（raid）功能的
  MMORPG 之一。团队战是指比传统队伍更大的小组（在 D&D Online 中多达 12 人，在《永恒之境战》中多达 200 人），他们共同对抗一个共同的敌人。团队战可以针对一个大型怪物，也可以针对多个敌人，但必须在特定的时间限制内完成（Taylor
  2006:40）。


  ### 公会与社区


  为了支持这些团队战，志同道合的玩家小组应运而生，被称为公会。公会分为两种：社交公会和团队战公会。社交公会是具有共同心态的玩家社区，但并不一定致力于特定的游戏内目标。这些公会的规模往往比游戏本身还要大，其触角遍及各种
  MMORPG。例如，“老顽玩家”（Geezer Gamers）支持那些只想寻找乐趣的成年玩家（2010）。


  与社交公会形成鲜明对比的是团队战公会，他们致力于游戏中的某些成就。团队战公会拥有更严苛的等级制度和高度结构化的游戏方法（Taylor 2006:45）。拥有多个角色并不稀见，而且经过优化的角色会在公会成员之间共享。晋升通常有要求，玩家被要求在被召集时参加团队战，放下手头正在做的任何其他事情。成员还被要求投入更多的时间和精力，以换取游戏奖励的相应增加。


  值得说明的是，公会有一种超越游戏本身的忠诚关系。公会的忠诚是如此强大，以至于他们会成结地从一个 MMORPG 移动到另一个。这充分说明了玩家对游戏的投入程度以及社交网络强大的纽带。以玩家忠诚度为傲的
  MMORPG 往往无法创造足够的让玩家离开的社交成本。公会是一个跨越多个游戏的保障性网络，比任何单一游戏所提供的都要更强大（Taylor 2006:87）。


  ### 个人体验挑战


  我曾非常兴奋能玩《地下城与战士》，并和我许多地理位置上分散的朋友一起加入。最大的挑战是延迟。因为游戏的每个实例都是在每台电脑上单独运行的，与我妻子一起对抗成群的狗头（kobolds）是不可能的，游戏延迟严重到画面看起来像是一张拼贴画。最终，她放弃了游戏，而我独自坚持了下来。


  正如引入单人选项所证明的那样，问题在于很难找到一个愿意组队且人数足够的的队伍，特别是职业组合要合适的队伍。冒险在进行时很有趣，但寻找队伍很困难。作为一名吟游诗人，我尝试胜任多个角色，但角色专业化使得很难找到合适的队伍成员组合。通过强调队伍角色，队伍组合的恰到好处是至关重要的——在其他
  MMORPG 中，这并不是大问题，因为单玩是可能的。通过不鼓励单玩，队伍的优化和连贯性至关重要，但并非总是可行。


  我会说，Turbine 制作的《D&D Online》可能是最接近桌面体验的。它确实尝试让冒险变得更具吸引力，我我为他们的这种尝试表示赞赏，但我认为历史会认为他们的努力在很大程度上未能捕捉到其源头游戏的精神。结果是，这款游戏对
  MMORPG 玩家缺乏吸引力，而对于桌面玩家来说，相比源材料又限制得令人沮丧 [Joseph Tresca 2010]。


  当我的朋友停止玩后，就不再保证能找到队伍了。对于没有朋友的玩家来说，《地下城与战士》变得不切实际。我取消了订阅，再也没有回头。


  ### 叙事


  当桌面角色扮演游戏偏离其基础模拟根源越远时，Greg Costikyan 认为大型多人游戏走向了相反的方向，变得几乎完全缺乏故事（2007:9）。这种缺陷是双倍的。由于玩家人数巨大，定制世界以为所有玩家创建一个连贯故事所需的计算能力是不可行的。而且某种故事已经通过社交网络和互动在叙述；本质上，玩家通过彼此相伴的冒险创造了自己的故事。随着
  MMORPG 变得越来越先进，这种缺陷可能会减少。一位阿瑟隆之召唤（Asheron’s Call, AC）的玩家有不同的体验：


  我发现《阿瑟隆之召唤》与桌面 D&D 最相似，因为它是首批通过开发者的每月更新拥有不断演变的剧情的 MMORPG 之一。这使得游戏没有变得陈陈调，并为玩家提供了参与推进剧情任务的机会。在我看来，开发者非常擅长响应玩家反馈，就像一个好的
  GM（地下城主）引导故事以保持玩家兴趣一样。我在收集奖成就上花费的精力比升级要多 [Jellig 2010]。




  虽然我很喜欢更新后的画面，但我对任务系统感到失望。我觉得有太多的“手手式教学”了，你大部分时间都花在 NPC 之间来回奔波，他们清楚地告诉你是下一步要做什么，让你作为玩家，除了寻找下一个
  NPC 的位置之外，什么都不需要自己去思考 [`Jellig 2010`]。


  对于其他非奇幻类型的 MMORPG 似乎还有未被开发的潜力，然而新的奇幻 MMORPG 却在不断推出。


  正如 Eskelinen (2004:38) 所解释，MMORPG 产生的多视角为每个玩家以及整个群体创造了独特的叙事，这种叙事在其他媒体中是无法复制的。即使是“邪恶玩家”的概念也有其自身的滤镜。邪恶角色几乎都有一个令人同情的故事。这让玩家在扮演邪恶角色的同时，不会让他们变得那么厌恶到至于让玩家自己也普遍认为他们他们。通过存在于善恶二元对立的重要轴心之上，这些邪恶角色扮演了与善良角色同样的角色，强化了伦理选择确实是在虚拟宇宙中做出的观点
  (`Castronova 2005:118`)。


  最终，大型多人游戏的基本教训之一是合作是必要的。玩家被推入一个充满完全陌生人的世界，并被要求与他们朝着共同目标努力，这强化了 MMORPG 中“大型”（massive）和“多人”（multiplayer）的概念。


  ### 个性化


  画面极大地扩展了 MMORPG 根据玩家喜味自定义环境的能力。画面具有多种组件，通过图形化地呈现环境而不解释其是什么，提供了一种有限形式的叙事（diegesis）。玩家通常理解树和石头是什么，并期望它们都留在原处。然而，在交互式小说或
  `MUD` 中，除非游戏告诉他们这些元素存在，否则玩家是不知道这些元素的。


  另一个区别是自定义角色的能力。这种个性化在玩家和角色之间建立了一种此前不存在的个人联系。除了玩家可以通过一组编号的统计数据、成就和获得的装备来自定义角色外，玩家现在还可以给他的角色“上皮肤”（skinning）。这种换肤是这种联系的重要表现。相反，没有任何自定义（即使是光着）的角色是说明该角色对玩家来说并不重要的迹象
  (`Jenkins 2004:128`)。


  ### 风险


  MMORPG 因为涉及大量其他人，因此必须实时进行战斗。结果是，战斗往往是一场快速、混乱的事件，投入了大量的资源来允许玩家快速、有效地做出正确的战术选择。这与
  `CRGs` 有显著区别，后者拥有回合制战斗的奢侈 (`Barton 2008:433`)。


  在 MMORPG 中旅行是一项重大风险。大多数 MMORPG 都有游荡怪物，它们会伏击走得太近的角色。触发了怪物注意的玩家会导致怪物“火车”（trains）追逐他们，危及他们路径上的每个人
  (`Taylor 2006:34`)。有策略的玩家可以利用这一点，这种过程被称为“放风筝”（kiting），即怪物在追逐潜在受害者时被诱入陷阱。


  MMORPG 中的死亡是暂时的，但并非没有风险。例如，在 `EverQuest` 中，角色每次死亡都会丢失经验值，并在游戏中的最后一个存档点重新开始（“respawns”）。角色会在死亡现场留下一具尸体，这意味着新生成的替代者必须找到尸体以取回他的装备。在这方面，`EverQuest`
  与 `MUDs` 有许多共同点 (`Taylor 2006:33`)。


  我参加了为期三个月的 `Ultima Online` 测试，加入了我的游戏开发者同事 Doug Schonenberg 中。我花了大部分时间杀羊，为此我一个接一个地开笑话（“我觉得我很脸颜无耻！”“我是在睡觉还是刚又杀了一只？”“我们有足够的
  `RAM` 来运行这个吗？”等等），但过了一段时间，这些也变得乏味了。我尝试在没有朋友陪伴的情况下玩，结果发现 `Ultima Online` 的系统保护了玩家杀手（player
  killers）。


  玩家杀手是我之前在 `MUD` 章节阐述的抑制理论（disinhibition theory）的阴暗面。他们的目标是击败其他玩家并猎捕他们。通常来说，玩家杀手（或
  `PKers`）并不寻求公平的战斗。他们猎捕其他玩家是因为他们有可图，无论是实际上抢劫虚拟角色，还是仅仅吓跑竞争对手。在 `Ultima Online` 的案例中，我发现待在里是不安全的。我坐进房间里，去吃了一个三明治，回来时发现另一个角色坐在我旁边。事实证明他试图反复偷我的口袋。


  当我报复时，一名守卫立即出现并施放了一个火球，将我的角色炸成了碎片。换句话说，企图盗窃是可以的，但攻击一个成功尝试过盗窃的玩家是不行的。是的，从技术上讲，这意味着只要小偷不被抓到，他就可以肆无忌惮地行盗窃。


  这引发了一个问题：为什么游戏里要有小偷？目的是什么？从根本上说，这是一种反玩家的功能，而且根据骚扰理论（griefing theory），这是由强者猎捕弱者实施的。换句话说，新手通常是受害者。


  这种困境在 `Ultima Online` 历史上的一个传奇时刻得到了进一步证明：英国领主（Lord British）的死亡。在一次测试期间，英国领主在向他的追随者发表演讲时被刺杀。刺客并不知道自己能否杀掉他，但他尝试了一次。





  在像 `WoW` 这样的游戏中，界面要直观得多，因为当你告诉游戏你想做什么时，并不需要对游戏描述得极其精确。当我刚开始玩 `WoW` 时，被它的视觉效果完全震撼了。然而，我实际上同样喜欢
  `RetroMUDs` 的界面，甚至更喜欢。这是因为基于文本的界面不像图形界面那样能立即显示出正确的行动方案。`WoW` 中可以交互的物体要么闪烁要么发光，甚至只是以一种显而易见的方式脱颖而出。此外，与这些对象的交互只需简单的点击。而在
  `RetroMUD` 中，房间内可能存在秘密，需要观察房间内的特定物体并思考如何与它们交互才能发现。因此，人们必须学会如何筛选相关信息，并具备敏锐的问题解决能力
  [Simes 2010]。


  像 D&D 一样，MMORPG 通过为多名玩家提供有限的可量特征列表供选择来模拟人类社会。这两款游戏都吸引了愿意投入大量时间的玩家，每周高达二十小时（Beck
  and Wade 2004:56）。然而，25% 的 `EverQuest` 玩家与其伴侣一起玩，其中 70% 的女性玩家与伴侣一起游戏，而男性玩家仅为六分之一（Yee
  2001）。


  ## 创作者角色


  ### 代码权威


  就像桌面角色扮演游戏的地下主（Game Master）一样，代码权威在大型多人在线角色扮演游戏中扮演着特殊的角色。与 `MUDs` 不同，MMORPG 的人口起初看起来似乎是不可控的。与
  `MUDs` 一样，游戏主的角色被分配给了程序中的人工智能，使得非玩家角色（NPC）在很大程度上（如果不是完全）是一个根据其指令做出反应的程序的领域——没有人类智慧在引导它的每一个动作。


  代码权威是游戏开发者，即创建并据测运行游戏的公司。与 `MUDs` 不同，代码权威与玩家是分离且独立的。他们对非玩家角色的日常活动负责得较少，但仍然承担着许多由游戏主处理的职责；他们充当着负责自然的神、负责正义的国家，以及负责娱乐的小丑角色（Castronova
  2005:204）。


  将这些职责与 Gygax 为游戏主概述的职责进行比较，代码权威负责作为保持游戏趣味的推动力量、负责编写实际角色的创造者、负责修改规则的设计师，以及负责移动棋子的导演（从运气、天气到其他角色）。


  目前所缺的，以及 Castronova 正确指出 MMORPG 中严重缺乏的角色是，是解释规则的**仲裁者**、为长期游戏构建叙事的**监察者**，以及最重要的**裁判**。本质本质讲，这是一种无政府状态（2005:213）。


  某些代码权威确实开发了监察角色，提供改变游戏世界的事件和叙事，但这些非常罕见。通常情况下，游戏以自动化的方式运行，没有其创建者的指令。


  导致这种无政府状态的原因是，代码权威并不倾向于投入比产生利润所需的任何额外精力。客户服务是昂贵且耗时的；游戏主所提供的关注水平超出了大多数代码权威的范围和资源。因此，玩家杀手（PKer）没有受到惩罚，对游戏氛围和伦理的违背被任由发展，游戏就此踉跄前行。只有当大多数开始停止玩游戏并威胁到其盈利能力时，代码权威才会干预（Castronova
  2005:214）。


  例如，`EverQuest` 甚至提供了一个提供更高水平客户服务的服务器，名为 `Stormhammer: The Legends`。玩家对该服务器的存在有意见，他们认为这种服务本应该在所有服务器上提供。索尼于
  2005 年关闭了该服务器。


  过去的代码权威在很大程度上将治理权交给了玩家自己，其含义是在某种“西部荒野”的氛围下，没有任何反派会越界太远，因为存在被比自己更大更残狠的人死的可能。这种想法在实践中行不通，因为文化会退化到最低共同标准——玩家会利用每一个机会杀人灭口（Castronova
  2005:209）。


  这同样适用于角色扮演的沉浸，其中某些玩家将他们的角色视为真实的角色，而其他玩家则将角色仅仅视为自己的延伸。这可能细微到角色拥有像“野蛮人柯莱米”这样不恰当的名字，也直白到在虚拟的中世纪乡村酒馆里讨论现实中的足球比赛。现实与合成世界之间的膜是如此多孔，以至于试图执行任何形式的连续性最终都会失败。代码权威既无能也不愿维护它。


  结果是，吸引玩家进入 MMORPG 的特征要广泛得多。虽然桌面角色扮演玩家可能对奇幻文学感兴趣，战争游戏玩家可能对历史战斗感兴趣，但大型多人玩家的资格仅仅只有一张信用卡。没有“软性”因素引导玩家进入或离开游戏，这些因素在其他形式的游戏中通过性格冲突和游戏风格差异发挥作用。正如
  Vesna 所解释的（2004:259），网络上的社区与电子商务、商场和信用卡系统紧密相连。代码权威只对利润感兴趣，这反映在他们寻求筛选出的唯一类型玩家身上——非付费类型。


  将这一角色延伸到其逻辑结论，对于代码权威来说，利益不在于裁决游戏，而是让玩家回来。因此，人们有一种真正的担忧，游戏的成瘾特质在很大程度上缺乏监管，代码权威以掠夺性的意图吸收玩家，即使这对他们有害。Castronova
  将此称为“**毒性沉浸**”（2005:238），这是一个非常现实的问题。


  我个人在玩 `MUDs` 时经历过毒性沉浸。我的所有朋友都有过，程度不同。因为我一直是个好学生，当我沉迷游戏时，我的成绩反而提高了。我的朋友并不总是那么幸运；其中一人玩得太频繁，以以
  .9 的平均分退学。幸运的是，当大型游戏出现时，我们都克服了成瘾。


  ## 参与者角色


  Nick Yee (2001) 发现 `EverQuest` 的平均年龄为 25.7 岁。Castronova 对 `EverQuest` 人口的调查（2005:60）略偏年轻，平均年龄为
  24.3 岁。事实上，Castronova（2005:61）发现绝大多数 `EverQuest` 玩家每周游戏时间少于 30 小时，少于大多数成年人的每周看电视时间。


  根据 Castronova 的说法，全球虚拟世界的人口将每年增长 8.4%，在 2020 年达到 4000 万，并在 2030 年接近 1 亿（2005:53）。大多数订阅者位于亚洲，中国拥有最多的用户，韩国密度最高。随着高速接入的普及，虚拟游戏参与度也随之增加——这个数字将继续增加。数字软件协会估计，2003
  年有 7300 万在线玩家，其中 38% 是硬核用户，相当于全球有 2700 万硬核玩家。对于美国，在受调查的 1400 万人中，数字软件协会估计有 7% 参与了持久性世界游戏（DFC
  Intelligence 2003）。




  尽管 MMORPG 为角色提供了画面效果，但玩家与化身之间仍然存在着一层匿名性。彼得·诺斯（Peter North）通过《魔兽世界》中的一次实验展示了匿名性的影响。他进行了一项实验来测试化身对同伴压力的反应。匿名玩家在一个房间里把武器与另一个房间里的三把武器进行比较。第二个房间里安排了十个同伙，并指示他们给出相同的错误答案。诺斯发现，尽管面临同伴压力，化身更有可能给出正确答案，这与相似实验中的人类形成对比。然而，玩家对其化身的投入越多，对现实生活中行为的反应就越常态化。


  在另一项实验中，诺斯重建了经济博弈论中传统的“囚徒困境”。在`prisoner’s dilemma`游戏中，两名玩家如果告发对方就能获得较轻的惩罚。最好的集体结果是两名玩家坚持立场且不背叛对方，但他们无法得知竞争玩家的计划。如果进行重复游戏，随着玩家开始预测对方的反应，信任将会得到提高。在《魔兽世界》中，最终结果是，即使在重复游戏中，玩家们仍然互相告发对方。尽管《魔兽世界》的组队系统似乎鼓励合作，但诺斯说：“在虚拟领域内，人们对自己的行为没有同样的后果感或责任感。”‘人与其化身之间存在明确的区别’（Dagger
  2007）。


  ## 性别


  画面的加入以微妙但重要的方式改变了大型多人在线游戏的本质。许多大型多人游戏中的角色在最初创建时，在统计学上是平等的，尽管它们的性别不同，但女性在性特征上是夸张的（Castronova
  2005:117; Taylor 2006:13）。


  由于在线游戏中存在视觉线索，将化身呈现为自己以外的其他形象具有更大的灵活性。这是一种跨性别的活动（Sinha 1999:118）。男孩可能会因为打扮和打理娃娃而受到批评，但两种性别都可以尝试在自己的化身上尝试成千上万种不同的服装和外貌——即使这意味着要用该化身痛打某人（Beck
  and Wade 2004:50）。诺丁汉姆特伦特大学的一项研究发现，MMORPG 中 15% 的玩家经常切换性别（Poole 2003）。


  关于女性玩家的地位存在相反的观点。一方面，如果对在线游戏的广泛定义包含了所有形式的在线游戏，那么女性玩家占美国玩家总数的近 40%。Taylor 认为，空闲时间是女性玩家在幻想
  MMORPG 中较少（占 20% 到 30%）特别是在高力游戏高层的原因之一。由于家庭压力，许多女性可能根本没有时间投入到这种耗费时间的游戏中（2006:73）。一位
  `RetroMUD` 玩家解释了她作为女性玩家成长的经历：


  ```

  成长过程中，我非常努力寻找游戏朋友，因此我的大多数朋友都是男性。似乎我所在的地区缺乏女性玩家。然而，我的几位女性朋友在兴致来时确实会玩主机游戏。但是，我不倾向于称她们为玩家，因为除了少数几个游戏外，她们并没有沉浸在游戏世界中。我成长过程中最亲的一位女性朋友也是玩家。不过，我在这方面比她更勤快，当我们聚在一起时，通常玩单机游戏。她喜欢看我玩《生化危机》和类似的作品，尽管我们之间很少玩多人游戏。我我不确定为什么，因为当我不在时她确实会玩游戏。她现在仍然玩主机游戏，但再远没有以前频繁了
  [Simes 2010]。

  ```


  ## 独行者


  独行者（Soloers）在没有队伍帮助的情况下独自玩游戏。独行者的困境对游戏开发者来说尤为棘手，因为他们基于《地下城与龙》的基本原理构建交互式世界，而这需要团队合作。独行者群体的破坏了许多玩家理所当然的内在社会利益，尤其是帮助新玩家的激励机制。“社交退出”的成本是帮助社区凝聚在一起的——即使他们不喜欢这个游戏，他们也不想离开朋友。一个不友好、自私的社区对新玩家是敌意的，根据定义，新玩家比他们伙伴的高级玩家要弱。共同的虚弱感和脆弱感对于群体凝聚力和组队进展至关重要，而独行则规避了这一点（Taylor
  2006:36）。


  尽管如此，MMORPG 中独行者提到的作为独行原因的最大问题之一是他们无法找到队伍。独行的原因范围可以从选择一个不适合大多数队伍的角色（高度专业化的职业往往因此受苦），到玩家在线的时间段，再到玩家没有必要的社交关系来快速组成队伍。从本质上说，独行者的出现由于现代生活限制所迫使的一种更休闲的玩风格。许多玩家根据情况在独玩和组队之间切换，战斗低级怪物，直到他们能够找到合适的队伍。


  ## 角色职业


  尽管 `EverQuest` 有一个偏好角色扮演的服务器 `Firiona Vie`，但大多数玩家在该服务器之外并并不进行角色扮演（Taylor 2006:30）。事实上，玩家在每个服务器上可以拥有最多八个不同的角色，并且通常与其他共享玩家身份，使得角色易于被其所有者识别（96）。并非所有的
  MMORPG 都是如此。一位来自《地下城与龙》战役的玩家分享了他在《阿舍隆召唤》（AC）中的经历：


  ```

  我在正式版发布一周后开始玩 AC。我的一些 D&D 朋友在测试阶段一直在玩，并说服我加入。我规律地玩了七年，然后休息了两年，在退休前又回来了一年。我创建了一个
  Gharu’ndim 魔法师，尽管游戏是严格基于技能的，而且没有职业区别。你可以创建一个既穿盔甲、持剑又能施放法术的角色。我在 AC 中继续强调角色扮演，选择更符合我想象角色的技能，而不是试图对系统进行“数值优化（min-max）”。在游戏的前几年里，我很少在角色之外说话
  [Jellig 2010]。

  ```


  这位玩家的经历与他在《指环王》（LotR）在线游戏的经历非常不同，后者更关注在测试阶段游戏社区创建早期确立的地位：


  ```

  在我在 LotR 测试阶段期间，我没有像在 AC 中那样发现这么多人对角色扮演感兴趣。我认为这可能由于几个原因：当正式发布来临时，可以保留测试角色的部分进度，因此人们更倾向于升级，以确保在发布时获得最大的利益。老练、更高级的测试玩家与新手之间似乎存在更大的鸿沟。似乎更多既定群体对招募低级玩家加入他们的盟约并不感兴趣。这可能也是测试经历的结果，因为无法保证发布后你的追随者会继续留在盟约中（特别是当额外等级丢失后，大家都处于相对平等的竞争面上时）[Jellig
  2010]。

  ```


  Race





  《永奇传说》（EverQuest）的种族包含了中世界的传统种族：半人、侏精、矮人、几种精灵（高阶精灵、半精灵、黑暗精灵和木精灵）、矮人和人类（Taylor 2006:12）。“野蛮人”是桌面游戏《地下城》中的职业，但在《永奇传说》中却是一个种族——它采取的是外部视角（野蛮人是一群人），而不是内部视角（任何种族都可以被归类为野蛮人）。就像《龙世纪战士》中的机灵矮侏精一样，《永奇传说》中的侏精也与技术相联系（Taylor
  2006:14）。


  在《永奇传说》中，除了蓝色皮肤的黑暗精灵和深褐色的学者族（erudites）外，所有类人角色都是白色或古铜色的。学者族是一类类人类种族，展现了物种与种族之间奇特的差异化——他们不是人类，但似乎代表了肤色较深的人类类比（Taylor
  2006:114）。正如范克（Van Dyke）在《地下城》中所注意到的，这可能是源于源自欧洲神话的幻想框架中固有的偏见。


  ## 职业


  《永奇传说》拥有传统的中世界原型：吟游诗人、游侠者、盗贼、战士和法师。其他职业包括桌面《地下城》的职业：牧师、德鲁伊、僧侣和圣骑士。新职业包括术系师、魔法师、死灵法、影骑士和萨满。它们都继续延续了之前提到的
  MUD（多用户地下城）和桌面 RPG 在探索各种职业的功能。它们的主要区别在于图形特效。


  ### 状态


  与其他大型多人在线角色扮演游戏（MMORPG）不同，《地下城与龙在线》等级较少，实际等级之间有四个台阶。与桌面游戏相比，这分散了所获得的加成。这似乎更多是为了保持两者同步而采取的妥协。由于第四版《地下城与龙》最高等级只到
  30 级，而大多数 MMORPG 的范围达到 100 级，四倍的修正系数大致等同于这两个等级系统。


  MMORPG 强化了西西弗斯式的等级苦练。角色在一种永久的增长弧中提升。这在《地下城与龙》中也是如此，它认为死亡对长期战是有害的；而在大型多人游戏中也是如此，在游戏中死亡仅仅是一种不便。这是一个无限增长的世界，一个有明确指定奖励的世界，一个以力量和机会的增长为标志的升华。从本质上说，它是现实生活经常承诺但未能为中低层阶级提供的药方……一条清晰的向上流动路径（Castronova
  2005:274）。


  在《永奇传说》中，最高等级逐渐从 50 级增加到 70 级（Taylor 2006:28）。在《魔兽世界》中，升级是自动的。付费获得新技能的训练，角色可以在技能树中获得一点积分。


  在《魔兽》中，一旦你升级就无法丢失等级，这是一个很棒的优点。然而，升级后新技能或法术似乎相当稀少，虽然某些等级可以获得大型技能、能力或物品，但许多等级感觉只是通往更重要等级的垫脚石
  [Simes 2010]。


  ## 结论


  MMORPG 从 CRPG（电脑角色扮演）及其像《暗黑破坏神》这样的在线混合体中获益良多。MMORPG 的进展是断断续的，最初由处理能力和网络速度定义。随着宽带接入和更强大的处理出现，这两个因素在决定
  MMORPG 的广度方面变得不再重要。


  幻想游戏的发展似乎很大程度上从 CRPG 转向了 MMORPG，仅仅因为 MMORPG 基于订阅模式，可以持续为游戏公司带来收入。正如 Castronova 所解释的，游戏公司几乎没有动力去促进沉浸于角色——他们主要关心通过让玩家反复回来来收回投资。只要这种情况发生，MMORPG
  就是一个极具吸引力的成功模型。


  另一方面，MMORPG 在很大程度上借鉴了桌面范式，并简单将其扩展到数千名玩家，这导致了一些奇怪的畸变。在《地下城与龙》中，玩家是英雄，是情节的核心。在 MMORPG
  中，世界充斥着英雄。这一点在《创世纪》（Ultima）未能创建一个功能完全的生态系统中表现得为明显。MMORPG 并不模拟正常的生态系统，而是充满了四游的超级掠食者——冒险者。最近的
  MMORPG 并没有真正进化到《魔兽世界》之外。《魔兽世界》做了《永奇传说》做的一切，但做得更好——更好的画面、更少的 Bug 和更明确的世界。


  MMORPG 未来将向何处发展？在很大程度上，MMORPG 仍在努力如何处理其庞大的玩家群体。Taylor 理论认为，较小的游戏世界在不可预见的结构、经济或组织方面可能有优势（2006:160）。在这方面，它们可以向
  MUD 学习，MUD 对玩家有更个性化的关注；也可以向 PBBG（基于浏览器的大型游戏）学习，它们在不需要所有人同时在线的情况下利用群体的力量。公会和家族继续成为游戏体验的正式部分，而不是玩家创建的元游戏手段。


  通过移动 MUD（仅提供文本描述世界）到 MMORPG（提供图形和声音）的媒体丰富度尺度，Castronova 认为在线多人游戏最终将达到一个“稳定状态”，满足实景角色扮演游戏的所有需求，且没有入门门槛。这个世界将同时拥有超过百万的用户，主要由玩家创建的内容组成，将通过语音和手势控制（进一步增加媒体丰富度），并且看起来和地球一模一样（Castronova
  2005:98）。我们在下一章中探索实景角色扮演游戏。


  # 九章


  实景角色扮演游戏 (LARPs)


  ## 引言


  实景角色扮演游戏（LARPs）是玩家身体在场的游戏，他们扮演自己的角色而不仅仅坐在桌子前。图尔库学校将 LARPs 定义为“一种你尝试尽可能具体地做一切事情，并避免任何不属于游戏部分的手段的游戏”（Pohjola
  2003）。与传统的桌面角色扮演游戏不同，LARPs 很少有通用元素。通常会有裁判和玩家角色共同工作形成一个互动性故事，但相似之处仅此此。LARPs 更多地关注叙事而非模拟。为了帮助建立主体性，玩家有时会装扮他们的角色或使用物理道具（Harrigan
  and Wardrip-Fruin 2007:2）。有些游戏还需要花费大量时间。投入到制作和参与 LARP 中的精力使其成为任何幻想游戏形式中最耗时的形式之一（Faidutti
  2007:95）。


  实景角色扮演还涵盖了许多其他模糊了即兴表演与游戏界限的格式。复兴节活动对参与者有自己的规则。这些规则不一定是游戏规则，但扮演非玩家角色（NPC）的演员有特定的行为准则来保持角色。像《真实地下城》（True
  Dungeon）这样的游戏将桌面地下城体验转化为真人，而不需要玩家完全沉浸在角色中。还有交叉活动，例如“派对”（bashes）或“展会”（cons），MMORPG
  玩家会装扮成他们的角色（Taylor 2006:2）。


  ### 历史


  LARPs 一直与我们在一起。任何涉及想象和角色的儿童游戏都可以被归类为第一个实景角色扮演游戏。从扮演神话故事的萨满到儿童表演学校戏剧，LARP 的基础一直是人类体验的一部分。16
  世纪的意大利即兴剧（Commedia dell’Arte）传统是一个特别值得注意的早期实景角色扮演游戏形式。




  1905 年，G.K. 切斯特顿出版了《奇特职业俱乐部》（The Club of Queer Trades），其中一个故事描述了一个为客户组织实景角色扮演（LARP）的机构，这为我们今天所知的游戏媒介奠定了框架。20
  世纪 20 年代，模拟联盟（Model League of Nations）将 LARP 作为一种娱乐消遣。在此期间，雅各布·L·莫雷诺将 LARP 形式用于心理治疗，并称之为心理剧。现代即兴表演始于
  20 世纪 50 年代，维奥拉·斯普林（Viola Spolin）和基思·约翰斯（Keith Johnstone）的戏剧游戏。斯普林利用这些游戏来训练演员，而非纯粹为了娱乐。


  幻想实景角色扮演于 1966 年随着加利福尼亚州伯克利迪安娜·帕克斯森（Diana Paxson）举办的一场派对通过“创意时代协会”（SCA）而兴起。除了著名的奇幻作家波尔·安德森（Poul
  Anderson，《三颗心脏与三头狮》的作者，《地下城与城》中圣骑士和巨魔的灵感来源）外，史夫·佩林（Steve Perrin）和史夫·亨德森（Steve Henderson）随后创作了来自
  Chaosium 公司的《符文王国》（Runequest）（Raymond 1994）。理查·加里奥（Richard Garriot）通过访问“中世纪集市”开始了《创世纪时代
  IV》（Barton 2008:21）。他们都是 SCA 的成员。


  紧随 SCA 之后的是 1969 年成立的马克兰中世纪佣兵团（Markland Medieval Mercenary Militia）。SCA 和马克兰对幻想元素的关注都不如他们关注对中世纪文化和历史的准确呈现。只有在《地下城与城》出版出版后，LARP
  才真正拥有了自己的天地。


  “达戈希户外即兴战斗游戏”（Dagohir Outdoor Improvisational Battle Games）由布莱恩·魏（Bryan Weise）于
  1977 年创立，1980 年在马萨诸理工学院（MIT）创立了“刺客协会”（Assassin’s Guild）。这些游戏涉及实战格模式，目标是刺杀对手。与此同时，瑞典
  LARP 小组“金鹿”（Gyllene Hjorten）也成立了。


  1981 年，“国际幻想游戏协会”（IFGS）成立，其名称灵感来源于拉里·尼文和史蒂芬·巴恩斯的《梦幻园》（Dreampark）小说，它将实战与受《地下城与城》启发的规则相结合。同年，沃尔特·弗雷特加尔（Walter
  Freitag）、迈克·马萨米拉（Mike Massamilla）和里奇·达顿（Rick Dutton）创立了“互动文学协会”。他们在 1983 年的 Boskone
  科会议上举办了第一场现代剧场式实景角色扮演游戏。


  1983 年，“Amtgard”成立。1985 年，实景角色扮演游戏在芬兰盛行。那一年激光标签（Lazer Tag）的发布让我在十三岁时接触了实景角色扮演的世界。与其他形式的实景角色扮演游戏不同`Lazer
  Tag`主要以战斗为导向，尽管官方规则书中也有等级和经验。我们玩的是一种原始形式的 LARP——有些 LARP 会将`Lazer Tag`和其他激光游戏作为战斗结果判定的形式。1985
  年，“Darkon 游戏俱乐部”（Darkon Wargaming Club）成立。


  1988 年，福德·艾维（Ford Ivey）发起了 NERO LARP。1989 年，实景角色扮演游戏在挪威盛行。


  2004 年，杰夫·马丁（Jeff Martin）在 Gen Con Indy 启动了“真实冒险”（True Adventures）。`True Adventures`由两部分组成：`True
  Dungeon`和`True Dungeon Fantasy`奇幻酒馆。`True Dungeon`是 Gen Con 最受欢迎的活动，每年吸引超过 3000
  人参加。


  第一家`MagiQuest`于 2005 年 6 月 15 日中午在南卡罗来纳州的密特尔海滩开业。随后，更多的`MagiQuest`地点在美国及范围内开放或宣布成立。`MagiQuest`是一种连锁商业
  LARP，其模式模仿热门的《哈利·波特》系列。它的互动体验和实景角色扮演非常适合它的受众。


  在北欧国家，被称为“laiv play”的 LARP 有着完全不同的声誉。`laiv play`被视为一种艺术形式，独立并区别于桌面角色扮演游戏，更类似于即兴剧。`laiv
  play`很少有属性或事件判定，玩家使用简短的文字摘要来确定自己的身份和能力。这份摘要涵盖了角色的传记和日常生活。入戏角色扮演至关重要。`laiv play`通常也不包含一个宏大的剧情，允许个人根据角色的经历追求自己的目标（Brenne
  2005）。


  ### 叙事


  在 LARP 中，由于玩家沉浸程度的不同，结果的处理方式也不同。如果玩家必须掷骰子，这是一种游戏产物，会明显地将玩家拉出体验之外。掷骰子是一种大多数 LARP
  倾向于简化的元机制，以保持游戏进行并让玩家留在角色中。不同的判定机制包括剪刀石头布、手势或牌牌。有些 LARP 完全缺乏冲突解决机制，例如谋杀谜游戏，完全专注于社交互动和调查。


  由于 LARP 活动发生在真实时间和物理地点，环境对游戏的影响不亚于玩家的外表表。在其他其他人不知晓游戏存在且因此不是积极参与者的地方进行游戏也是可能的，但这可能被视为干扰并可能存在法律风险。


  与 LARP 不同，`True Dungeon`拥抱其《地下城与城》的根源，使用类似的桌面规则。战斗涉及在滑冰板上滑动武器计数器。滑动碎片必须停在滑冰板的特定区域内才能命中怪物。由于所有攻击在判定命中之前进行，团队成员的武器计数器可能会被击入区域。伤害取决于武器计数器相对于滑冰板伤害指示器的方向。


  `True Dungeon`自豪于将官方的《地下城与城》体验转化为实尺寸的地宫环境。它明确标注自己“不是 LARP”`True Dungeon`专注于问题解决、团队合作和战术，并使用了精彩的场景和互动道具，但不需要扮演特定人格。`True
  Dungeon`的创建者杰夫·马丁解释道：


  > 我们从不要求玩家扮演人格。`True Dungeon`关于的是“你”在挑战性环境中的表现，我们不希望通过要求扮演别人来破坏乐趣。这款游戏的设计是为了让人能够直观且感性地体验
  [Martin 2010]。


  *个性化*





  实景扮演（LARP）与桌面角色扮演游戏在角色描述和结果判定方面存在显著差异。玩家的身体会影响其角色描述。他可以通过服装、道具和妆容来改变外貌，但他就是他本身；与传统的桌面游戏或在线游戏相比，扮演不同的性别或种族要困难得多。某些属性仍然可以处于想象力范围内，使得玩家可以在游戏中展现超能力，或执行他们平时不具备的技能。


  “联盟”实景角色扮演允许玩家扮演精灵、“霍比特人”（hoblings）、矮人，甚至是比亚塔（biata，类狮鹫生物）和萨尔（sarr，猫人）。它包含七种角色职业，包括战士、法师和盗客。


  在达肯（Darkon）中，所有参与者必须一直穿着奇幻装束，包括一件长服式上衣和彩色裤子。明确禁止穿牛仔裤。允许穿着非主题鞋子，但必须遮盖。不同职业有不同的服装选择，必须穿着以识别自己的类型。手机等现代生活物品必须隐藏在视线之外。


  达肯的法术释放系统使用法术值，每个法术都有能量消耗。这些法术值仅在午夜后恢复，而不是像 MUD 和 CRPG 那样持续恢复。为了释放法术，玩家必须从法书或卷轴上阅读完整的法术内容。施法者在施法期间不能移动、说话或战斗（包括被对手击中）。


  法术释放后，施法者可以无限期持有该法术；在此期间，他不能说话，且只能离开原始位置最多五步——这类似于第三版《龙与地下城》中的五英尺步法。如果施法者在持有法术时受到攻击，他将遭受该法术的影响。这意味着悬浮状态的火球将在施法者身上爆炸！


  ### 风险


  与桌面游戏不同，在实景角色扮演中掷骰子的可行性较低，仅仅因为玩家们站立或在活动移动。但这并不意味着不可不可——有些实景角色扮演使用巨大的骰子，就像地板是桌面一样。


  另一种结果判定形式是物理战斗。使用泡沫涂层和 PVC 或玻璃纤维制成的武器用于“软甲”（boffer）战斗。目标不是伤害对手，而是得分，伤害取决于所用武器的类型。施法者向对手投掷软物品（通常是豆袋）并描述效果。


  法术球直径在六到十二英寸之间，填充泡沫或布料，并在所有侧密封。每个法术都有不同颜色的法术球。施法者必须将法术球投向对手。即使只是擦过对手，效果也会降在玩家身上。如果它击中地面或其他物体，法术将在冲击点为中心爆炸。半径内的任何敌人也会受到影响。YouTube
  上有一段这类法术战斗的视频，一名施法者向巨魔投掷法术球，并不断大喊“闪电链！”对于非参与者来说可能看起来奇怪，实际上是游戏的重要部分（Sexdwarf 2005）。


  在软甲战斗中，沟通至关重要。战斗双方使用三个短语：“守备”（On guard）意味着准备战斗，“上”（Lay on）意味着战斗，以及“住手”（Hold），等于暂停或战斗结束的信号。禁止攻击的目标包括手、脚、腹股、颈部和头部。被击者应该承认自己被击中了。


  另一个被称为“真钢战斗系统”（Live Steel Combat System）的系统使用真实的钝器。放弃了软甲系统的泡沫，经过仔细训练的玩家在决斗和其他冲突中使用真实的战斗。


  如果肢体被击中，该肢体将无法使用——因此战士可能会失去武器或盾牌手臂，如果腿部中命中甚至失去移动能力。虽然某些系统使用生命值，但 Amtgard 只使用肢体系统或总共两次命中（防止了无臂战士试图战斗的荒谬场景，类似于《蒙提派恩与圣杯》中的黑骑士）。护甲可以通过增加这些肢体的受击次数来延长玩家的寿命。


  阿普夏寺（Temple of Apshai）模仿创意复古协会（Society for Creative Anachronism）建立了战斗系统，以此作为对“那些系统……最好是乏味的，而且由于它们几乎不可避免地强调此类异常情况，统计学上比简单的系统还不准确”（Johnson
  1982:7）。


  “真地下城”（True Dungeon）有一种不同的战斗形式。它不是掷骰子，而是在滑板上滑动武器计数器。代表不同武器的圆盘必须停在滑板上某些预定义的区域内，才能击中怪物。所有攻击在判定任何命中结果之前完成，这意味着可能会将队友成功的攻击撞出板外，或者让一次偏离的挥击恰命中。伤害由武器计数器相对于滑板上伤害指示器的方向决定，同时也使伤害随机化。为了给战士、游侠和圣骑士职业提供优势，他们可以在进入地下城之前进行练习。


  “真地下城”的另一个支柱是它的谜题，这些谜题通常需要团队协作解决。每个职业为游戏带来了某些能力，使他们能够帮助解决各种谜题。除了谜题外，玩家还面临物理障碍的挑战，这为擅长解决问题的个人提供了大显异的机会。Martin
  解释了谜题的设计哲学：


  > 我想让 TD 很酷，因为它需要一个平衡良好的团队才能在冒险中表现出色。因此，我设计了测试来挑战各种认知和身体能力。这意味着一群门智力天才在身体技能检查（如战斗）中更有可能被屠杀。你不仅需要一些优秀的解谜高手，还需要一些能够在压力下执行精确任务的玩家。这看起来更像经典的《龙与地下城》体验，即你有一群多样化的个人为整个团队的利益贡献（Martin
  2010）。





  在《暗肯》（Darkon）中，被杀死的角色在两分钟内不能移动、说话或执行任何动作，除非获得长老（裁判）的许可。随后，该角色会被放到“冥界”（Hades），在返回游戏之前必须在那里停留一段时间。他将不会记得死前最后五分钟的任何记忆，包括是谁杀了他——这可能是为了防止陷入源不断的复仇杀戮，因为玩家会试图通过报复来攻击杀自己的敌人。如果玩家通过魔法手段复活（死后
  12 分钟内），他将保留所有的记忆。


  冥界是一个被视为游戏之外的指定区域，玩家在其中花费时间修理装备、治愈伤口和恢复生命。冥界区域及周围禁止战斗。一名被称为“冥界长老”（Hades Elder）的裁判会记录玩家进入和离开冥界的名字、时间和原因。死去的玩家将武器举过头顶，以表示他们是正在返回冥界的幽灵，除了通过点头确认死亡外，无法与玩家进行交流。在冥界中的死亡状态持续
  12 分钟（Darkon Wargaming Club 2009:85）。


  ## 角色


  实景角色扮演（LARPs）与桌面角色扮演游戏的区别在于引入了物理现实来构建叙事世界（Montola 2003）。在角色扮演游戏中，当游戏主描述一块石头时，他并不会提供瞬间传达石头物理现实的数百万个细节，他只创造出关于石头的印象。而在实景游戏中，这些石头是一块真实的石头，因此其纹理、大小、物理空间、距离、颜色、气味、重量等都会被立即考虑在内。


  由于物理现实的性超出了任何个人列举其细微之处的能力范围，这可能会产生一些奇特的差异，例如物理世界中的元素不恰当当地侵入游戏。与之形成对比的是大型在线多人角色游戏（MMORPGs）创建的叙事世界，世界中的每个物体和角色都经过分类和索引。


  文艺复兴节是另一种形式的实景游戏，尽管角色和玩家的参与程度因节日而异。角色扮演角色，有些角色的目标可能需要由扮演这些角色的演员或游客本人来完成。


  这种风格的终极被动式实景角色扮演游戏可能是“中世纪时光”（Medieval Times）。我和妻子在新泽西州的“中世纪时光”举行了婚礼。因为我们整个婚礼团都穿着角色服装，游客很难将我们（玩家）与工作人员（舞台工作人员）区分开。有一次，我父亲被问路洗手间在哪里，他用他最标准的英国口音愉快地提供了路线。毫无防备的游客完全不知道其中的区别。


  ## 创作者角色


  ### 非玩家角色 (NPC)


  LARPs 与桌面游戏最大的区别在于对非玩家角色（NPCs）的处理。在 LARP 中，扮演一个角色所需的肢体表演使得单个人手处理多个 NPC 角色变得不切实际。因此，通常有一组角色来兼任其他
  NPC 的角色。与玩家不同，NPC 通常知道游戏的剧情，并对叙事有一定了解（Branney and Leman 20）。


  因此，NPC 是一种“伪玩家”。他们参与游戏，其角色的目标相对有限，但归根结底受到剧情的限制。因为 LARPs 通常是自由形式的，当事件没有按照计划进行时，这些玩家需要指示如何继续推进剧情——这在控制程度较少的环境中是不可避免的。


  ### 裁判


  大多数 LARPs 至少有一个裁判，尽管有些实景游戏由一小部分玩家主持。在《暗肯》中，拥有至少 31 点战斗积分的玩家有资格成为裁判，这种系统类似于 MUD 中的玩家/法师升级系统。《暗肯》的裁判被称为“长老”（Elders）。每个国家必须在每个活动中至少提供一名成员担任长老。每位长老通过一件印有“Elder”字样的纯白色宽袍来识别。长老负责裁决战场事件和战斗，并可以对违规行为进行处罚。


  裁判在替代现实游戏（ARGs）的“傀儡戏师”中有对应物。在 ARGs 中，玩家体验“权力游戏”，即让陌生人聚集在一起，根据傀儡戏师的要求在公共场所执行某些行为。这个称号非常贴切；傀儡戏师通常是匿名的，提出问题、谜题和挑战，而不直接与玩家互动（McGonigal
  2007:252）。


  ### 统帅


  在《暗肯》中，统帅是协助行政事务的志愿者。统帅有各种不同的职责——有一名总统帅和几名助理。统帅的专长包括盔甲、钱币、服装、土地、毒药、药水和卷轴、遗迹、法术和武器。


  ### 舞台工作人员


  由于进行实景角色扮演游戏所需的舞台呈现水平，还有舞台工作人员的角色。这些人不是游戏的活跃参与者，而是协调活动、处理道具并其他确保游戏非互动方面顺利运行所需的支持人员。


  在复杂的 LARPs 中，这些舞台工作人员还是特效人员，负责从烟花表演到化妆造艺术的一切工作。他们可以让人们看起来像受伤了或消除伤口，在适当的时间施放烟雾，或者让能够散发谜语的怪物道具动起来。


  ## 参与者角色


  Matthijs Holter 解释了什么让沉浸式角色扮演变得可行（2007:21）：角色和设定应该是可信且详尽的；故事的节奏应该是良好的，并流畅地融入游戏机制；玩家应该有时间进行视觉化思考和预判，并且对沉浸式游戏有经验。他还列出了可能破坏沉浸感的元素：经常查阅规则、频繁求助于规则、或无法直接转化为游戏世界描述的机制；节奏过快或强迫玩家为角色做出果断决定的游戏；以及玩家讨论游戏之外的话题，或使用元游戏思维来做角色决策。


  我在 ICON 的第一次 LARP 体验中经历了所有这些元素。那是一个科幻设定，房间里的每个人都被视为“入戏”状态，而房间外的一切都被视为“出戏”状态。不同的角色散落在房间各处。为了了解游戏中正在发生的事件，玩家会坐在每张桌子旁，轮流地与角色聊天。


  设定是封闭的，因此要可信得多。它是一个“网络咖啡馆”，紧紧聚焦在宇宙中的一个点。刺激感在于玩家扮演自己的角色——除了角色所说的和所做的之外，几乎没有指示未来设定的道具。甚至没有任何机制。


  在与几个角色互动后，我等到了轮与一位年轻女士说话。当我排在我前面的玩家和她聊完后，我坐下来开始我的对话，试图弄清楚当地空间港发生了什么。令我非常惊讶的是，那个男玩家回来了，打断了我们的对话，向那个女孩约会。我花了一分钟才意识到另一个玩家并没有入戏：他是在约那个女演员，而不是她的角色。


  我从沉浸感中被拉了出来。玩家们正在讨论游戏之外的话题。说“我很震惊”都是轻的说法。那个玩家把她入戏的调情误认为是好感，将她与他角色的互动解读为对他感兴趣的信号。那个女孩显然局促失措，由于她比那个男生想的要年轻得多，情况也变得更加复杂。女玩家扮演的是一个更有自信的角色，这让她看起来比实际年龄要大。




  对我来说，那个时刻被毁了；当现实如此突然地闯入时，我很难扮演一个自信、鲁莽的角色。我无法对局势的转变做出反应，因为从技术上来说，这些并没有在游戏中发生。我感到沮丧和难过离开了游戏，而且并不完全理解为什么。在那之后很长一段时间都没有没有参与实景角色扮演（LARP）。


  当然，角色扮演与现实生活的融合有时会有积极影响；我在“中世纪时代”（Medieval Times）举办的婚礼就是一个很好的例子，而且这绝不是唯一的（Fortugno
  2007:265）。


  ## 玩家


  不同的 LARP 有不同程度的玩家投入。通常情况下，LARP 玩家被要求首先进入角色，其次才发出他们想要说话或做出戏外行为的信号，这与桌面游戏恰恰相反。


  如果没有对 1979 年 4 月 15 日发生的事件进行研究，关于 LARP 角色的讨论将是不完整的。那天，密歇根州立大学的学生詹姆斯·达拉斯·埃格伯特三世（James
  Dallas Egbert III）失踪了（Hatley 1999）。达拉斯（他的常用名）是一个 16 岁的计算机天才，聪明到从 12 岁起就一直在为美国空军维修电脑。他是一个典型的游戏极客，而且聪明到能早早上大学。8
  月 22 日，私家探威廉·C·迪尔（William C. Dear）受达拉斯家族雇佣寻找他。作为一名非常成功的私家探和埃格伯特家族的朋友，迪尔同意接手此案。


  在调查过程中，迪尔理论上认为埃格伯特可能将游戏中的角色与现实生活中的角色混淆了，这是一个不幸的陈述，对《地下城与龙》（Dungeons & Dragons）的影响远超调查本身。失踪事件在媒体上广泛报道，罗娜·杰菲（Rona
  Jaffe）的虚构小说《迷宫与怪物》（Mazes & Monsters）紧踵而至。受埃格伯特案例启发，《迷宫与怪物》讲述了罗比·惠灵（Robbie Wheeling）在格兰特大学的蒸汽隧道中玩类似《地下城与龙》的游戏时精神崩溃的故事（Jaffe
  1981）。这后来被改编成电影，由汤姆·汉克斯主演。


  《迷宫与怪物》所带来的角色扮演沉浸的危险助长了好莱坞丰富的想象力。在公众认知中，《迷宫与怪物》与埃格伯特案混为一谈。伤害已经造成；《地下城与龙》赢得了危险腐蚀儿童的声誉。直到
  1984 年，威廉·迪尔在他的书《地下城主：詹姆斯·达拉斯·埃格伯特三世的失踪》中，事实才大白。


  那么到底发生了什么？达拉斯作为一名 D&D 玩家，他喜欢在密歇根州立大学建筑下方的蒸汽隧道里玩 LARP，媒体未能提到这一点。达拉斯由于抑郁且在学业表现的压力下产生了自杀倾向。


  当迪尔追踪到达拉斯时，他对他所发生的事情提出了几种理论，从自杀到绑架，再到迷失在《地下城与龙》的幻想中。迪尔是一个精明的的调查员，对媒体并不陌生，他担心如果他的绑架假说被公开，而达拉斯真的被绑架了，他会被杀掉。因此，迪尔让“地下城与龙理论”自行发酵：“你们有一个地下城主——他负责设计角色。有人被关进地下城，要出来取决于他，”迪尔解释道，“在某些玩游戏的情况下，你实际上脱离开了自己的身体，进入了神游状态。”


  迪尔工作得非常出色。一个月后，他在路易斯安那州的摩尔根市找到了达拉斯。在母亲的压力和对自身性取向的挣扎下，达拉斯曾试图在密歇根州立大学下方的蒸汽隧道里通过服用胶眠药来自杀。当他第二天晚上醒来时，达拉斯逃往了一个朋友家里，那是一个二十出头的同性恋男性。


  未成年人达拉斯与其成年朋友之间的关系具有法律影响。当故事曝光后，随着每个房主对媒体监视的日益担忧，达拉斯在不同的房子之间穿梭。达拉斯被乘火车送到新奥尔良，在那里他再次尝试自杀。达拉斯找到了一份工作和一个住处，但最终相关人都决定他应该去自首。


  显而易见，《地下城与龙》与达拉斯·埃格伯特的失踪毫无关系。遗憾的是，也很明显，达拉斯的同性恋关系是达拉斯及其相关人员的担忧。迪尔承诺不透露案件细节，以保护达拉斯的弟弟道格（Doug），从而让《地下城与龙》背了黑锅。直到五年后，事实才在迪尔的书中公布。


  对于那些不熟悉游戏文化的人来说，将角色扮演视为削弱玩家身份并不罕见，这暗示玩家难以区分现实与幻想。角色扮演游戏实际上相当健康。益处包括攻击性的升华、对“想象力、创造力、阅读、小组合作、社交互动以及在具有不同种族视角下相互帮助的益处”（Gygax
  1989:150）。


  角色扮演在某种程度上反抗权威的有害信念今天仍然存在（Thomas 2010）。美国第 7 巡回上诉法院近期维持了某监狱限制囚犯玩角色扮演游戏的决定，认为这些游戏助长了“竞争敌意、暴力、成瘾性逃避行为以及可能的赌博”（第七巡回上诉法院
  2010）。


  然而，玩家对这种区别非常清楚，并使用特定的术语和称呼方式来澄清他们何时是在游戏内，何时是在游戏外。这在 LARP 中尤为重要。某些 LARP 会进行“事后生活”（afterlive），即活动结束后召开会议，以解决任何剩余的问题或疑问，并帮助玩家从幻想回到现实（Mortensen
  2007:303）。


  这些技巧也用于出于训练目的的高强度角色扮演环节，其中处于情感情境中的玩家被允许在安全环境中“释放压力”。我曾参加过商业培训课程，在期间我被推入了一次惊喜的角色扮演体验，我几十年的游戏经验让我受益匪浅。我更好地适应框架的切换，从玩家切换到另一个角色。我那些从未经历过这种形式游戏的同事们发现这在情感上是巨大的冲击，以至于其中两人流了泪。培训的结束仔细地划分了角色扮演体验，让玩家庆祝他们通过课程的成功。


  ## 角色职业


  “真地下城”（True Dungeon）的玩家提供挂在脖子上的角色卡。每个角色都包含了《地下城与龙》的典型属性：生命值、护甲等级、等级和六项属性（力量、敏捷、体质、智力、智慧和魅力）。这些都是完整的非玩家角色，包括性别和种族。


  “魔法奇缘”（MagiQuest）中有五个不同的家族（与《地下城与龙》的职业对应）：神圣（牧师）、暗影（盗贼）、捣蛋鬼（吟诗人）、战士（战士）、林地系（德鲁伊）。玩家与数字角色和真人角色互动。这些角色与《哈利·波特》系列中的角色相对应，例如被称为“Z’nort
  任务主”的邓布利多分身，他长得和多比比非常相似。


  ## 性别与种族


  当玩家选择角色时，他们只选择职业。虽然性别和种族有时会被分配，但它们通常不是游戏中的因素。在黑暗之地（Darkon）中，玩家可以选择任何他们喜欢的种族，但没有加成。他们被鼓励装扮成所选择的种族（Darkon
  Staff 2009:34）。在“真地下城”中，“列出的种族和性别并不意味着玩家必须按照该设定扮演，因为游戏真正关乎玩家的能力，而不是角色”（True Dungeon
  Staff 2006:8）。




  在《真·地下城》（True Dungeon）中，每个角色职业都有一项适用于地下城的特定技能。《真·地下城》将其能力的实现分为两类：身体敏捷的微小技巧和记忆术。在每个回合开始时，玩家会有时间练习自己的技能直到准备就绪，随后地下城主（Dungeon
  Master）将他们带领地下城。


  对于物理任务，圣骑士和战士练习在推式冰球桌上滑动圆子。游侠者可以同时滑动两个圆子，代表了他们双武器战斗的技巧。盗客则必须有稳定的手来开锁或拆除陷阱，这是通过让金属笔穿过微小的金属迷宫而不触碰任何侧边来模拟的。


  对于记忆任务，牧师必须能够记忆施放法术或转化不死生物时的最佳专注物品。法师必须记住哪个位面对应哪种法术。吟游诗人必须回忆在地下城中发现的古代符号的含义。


  然而，这并不意味着没有身体层面的惩罚。除了对角色造成的实际伤害外，玩家可能会受到电击、被一股气流冲击或被水喷射。


  ## 吟游诗人 (BARD)

  《真·地下城》中的吟游诗人与第三版的吟游诗人相似。他们可以施放法术，使用各种类型的卷轴，并负责记忆符号，这是对传说中吟游诗人知识的模拟。吟游诗人还能唱歌或押韵，从而为队伍中的所有其他成员带来
  `+1` 的伤害伤害加成——如果吟游诗人拥有正确的乐器，这种能力还会增强。


  我在《真·地下城》中玩了两次冒险，当然，我是吟游诗人。吟游诗人向队友施加加成的要求之一是唱歌。在桌面游戏中，吟游诗人的玩家通常不被要求表演出来。即使在《地下与城在线版》（Dungeons
  & Dragons Online）中，吟游诗人也只弹几曲子。虽然在桌面版《地下与城》中，假设吟游诗人正在唱歌或演奏乐器，但玩家实际唱歌似乎并不受鼓励。


  但这并没有阻止我。当该通过唱歌来鼓励我的队伍战斗怪物时，我唱得口破血哑。想起来，我从没听过另一个吟游诗人唱歌——要么是因为没有其他人玩吟游诗人，要么是因为他们太害羞不敢唱歌。我唱了什么？当然是
  MC Hammer 的 `U Can’t Touch This`。这导致在场的地下城主们“因为我糟糕的歌声”而专门针对我发动怪物攻击。就在我面前，在巨大的二十面骰上，在两个不同的场合，地下城主投出了自然的
  `1`。这不仅是没中，而是完全的落空。确实是“无法触碰”！


  ## 刺客 (ASSASSIN)

  玩家在达肯（Darkon）中可以担任刺客。刺客需要携带一块 12 英寸见方的黑布作为其职业的象征。刺客获得了伪装、爬墙、背刺以及当然，暗杀其他角色的能力。


  暗杀是让一个角色从冒险中离开超过通常 12 分钟的唯一方法。在从刺客公会的三位会会长之一获得暗杀令后，刺客可以自由使用匕首、箭或毒药进行暗杀。攻击必须是致命伤。执行暗杀时，令留给受害者。被暗杀的玩家将离开游戏
  24 小时。在较高等级时，刺客可以折磨其他角色、制作毒药并探测其他角色的伪装。


  ## 牧师 (CLERIC)

  《真·地下城》的牧师与桌面版本有许多相似之处。念珠与美德相关，玩家被要求记忆这些美德以最大化牧师法术的效果。转化不死生物被归类为牧师与其他法术相同的技能。


  达肯的牧师可以使用许多与《地下与城》对应角色相同的法术，包括治疗法术。他们可以在八级时转化不死生物，并在十级时让死的玩家复活。


  ## 战士 (FIGHTER)

  在《真·地下城》中，战士由他们在怪物推式冰球桌上滑动圆子的能力定义——也就是说，衡量的是玩家的技巧，而不是角色的。然而，他们确实有一个游戏内优势：强攻击。使用强攻击，滑动
  `19` 或 `20` 击中怪物将分别增加 `+5` 或 `+10` 的伤害。任何低于此数值的都是无效。通过这种方式，角色的游戏效果增强了玩家滑动圆子的技巧。


  在达肯，战士被允许携带任何武器、使用任何尺寸的盾、穿上任何护甲并穿着任何风格的服装。他们获得了通过在受伤的肢体上系上带红十字的白布来包扎伤口的能力，使其仍可以使用。在较高等级时，他们可以修复被毁的盾和护甲。


  ## 僧侣 (MONK)

  僧侣对于《真·地下城》似乎是一个奇怪的选择，但考虑到在推式冰球桌上使用筒攻击怪物的抽象性，僧侣的攻击只是装备标记的变体。本质上，僧侣仅赤身冒险。在没有装备的情况下，他的护甲等级比伙伴高。他可以同时用两个圆子攻击，代表了第三版僧侣的“连击”能力。他每天可以在命中后眩晕一个目标。回避能力——承受攻击的一半或没有伤害——每次战斗可以使用一次。僧侣甚至每回合可以偏转远程武器。


  在达肯，僧侣能够使用手、脚或武器偏转飞来的非魔法远程武器，这是自《地下与城》的特征。僧侣在偏转时必须大喊“僧侣”。随着等级的提升，他可以假死并自我愈合。他变得对疾病、毒药和幻术免疫，他的皮肤变得更硬，赋予了类似护甲的属性。


  ## 圣骑士 (PALADIN)

  与桌面版本一样，《真·地下城》中的圣骑士在冒险中可以三次探测邪恶，根据“圣手”能力以任何方式治愈一定量的生命值，并可以在冒险期间攻击一次邪恶怪物以造成额外的 `+3`
  伤害。


  达肯没有圣骑士，而是骑士（caval）。只有拥有骑士男爵爵头衔的人才能加入该职业。加入后，骑士男爵将放弃贵族角色获得的所有战斗积分，并从第一级骑士开始——本质上是一个兼职。与圣骑士不同，骑士必须选择一个阵营立场，因此可以是中立、邪恶或善良的。骑士佩戴白色、灰色或黑色腰带来代表他们的立场。骑士还必须遵守骑士道精神，这与《地下与城》第一版《荒野奥术》（Unearthed
  Arcana）中骑士的准则非常相似：死不为辱、战斗即荣誉、荣誉高于地位等。骑士获得各种类似圣骑士的能力，包括对疾病免疫、治疗法术、转化不死生物以及创造圣剑。


  ## 游侠 (RANGER)

  《真·地下城》中的游侠主要通过他们的双武器战斗定义，即同时滑动两个圆子。有趣的是，游侠对不死生物有加成（也许是第三版游侠“宿敌”能力的某种变体）。该游戏中没有与桌面版游侠追踪能力对应的设计，可能是因为在现场环境中还原追踪非常困难。





  另一方面，Darkon 拥有一套复杂的系统来裁定游侠者的能力。他们可以使用追踪技能，该技能的运作方式与桌面游戏中的非常相似，但不需要玩家实际上识别足迹——所有信息都由一名
  `Elder`（长者）决定。游侠者还会获得少量的法术，类似于《高级地下城与与与》中的游侠。在高等级时，游侠者可以侦察一个区域，学习代表其区域共享的关键信息。利用探索能力，游侠者甚至可以在随机怪物遭遇表上掷两次骰，并选择其中更有利的一个。


  ### 游盗者

  `True Dungeon` 中的游盗者拥有偷袭能力，每次遭遇中可造成 `+10` 点伤害。他们还可以通过一种类似于桌游戏 `Operation`（比医生）中使用的插拔机制来解除陷阱和锁。


  在 Darkon 中，盗贼可以像任何其他角色一样出现，但必须身上携带一把 `skeleton key`（万能钥匙）作为其职业象征。所有盗贼都有快速搜刮尸体的能力，向死者角色的玩家展示
  `skeleton key` 并搜索尸体的每个部位。


  在第二阶级，盗贼获得了扒窃的能力，这允许他搜刮活着的角色。这很棘手，因为这种情况的叙事逻辑要求 `Elder` 意识到这一尝试，但玩家不能知情。在告知 `Elder`
  他计划偷什么之后（推测是在目标受害者的听力范围之外），盗贼必须将手放在要偷取的物体上。如果盗贼等级低于十级，必须保持接触 `15` 秒；第十一到第十九级为 `10`
  秒；二十级及以上的盗贼仅需持续 `5` 秒。一旦完成该时间，`Elder` 就会示意任务完成。随后，`Elder` 通知受害者并从他那里取回物品，交给盗贼。


  在第三阶级，Darkon 盗贼可以爬墙。像扒窃一样，这一动作是模拟的。盗贼可以通过在墙十英尺外平躺并向墙爬来爬上任何墙。这消除了玩家对运动能力的要求，但模拟了角色爬墙的过程。假设盗贼到达了墙，他可以通过穿过墙（移除绳子、胶带或任何代表墙的物体）进入结构。在爬墙时被发现的盗贼可能会受到远程武器或长柄武器的攻击。伏地上的人是一个更大的目标，就像正在爬墙的人一样。盗贼在爬墙时被击中会摔倒，导致双腿受轻伤。


  第三阶级的盗贼还可以背刺。他们必须从背后安静地接近受害者，并用匕首攻击其躯干。根据角色的护甲情况，这会造成相当伤害，通常会导致死亡。


  在第四阶级，Darkon 盗贼可以开锁。每个锁都有一个等级（`1` 到 `15`），盗贼将手放在他尝试开启的锁上持续三分钟。每高出盗贼等级一个难度等级，时间就会增加一分钟，最多十分分钟；超过十分分钟意味着该锁超出了盗贼的开启能力。如果盗贼的等级高于锁的等级，则每低一个盗贼等级的难度，开启时间将减少
  `30` 秒。


  伪装允许盗贼伪装成来自另一个国家，但不能伪装成特定的角色。盗贼必须实际上穿着某种伪装的物理表现；通过这样做，他可以突破角色的护甲和盾牌限制。作为交换，在移除护甲或盾牌后的
  `15` 分钟内，他不能使用任何盗贼能力。正如 Darkon 规则书解释过的：“这项技能高度依赖于角色扮演，包括盗贼本人以及周围的其他玩家。通常，玩家会注意到伪装，而角色并不会；鼓励所有参与者表现得好像该盗贼正常地融入了他的环境。”这是一个媒体丰富性在角色扮演中成为障碍的案例，与服装的叙事逻辑冲突；玩家被鼓励表现出无知。相反，十五级的盗贼可以检测伪装，在不暴露其真实身份的情况下判断角色是否正在伪装。在与嫌疑者互动
  `60` 秒后，盗贼宣布自己的阶级并询问玩家是否在伪装；玩家必须诚实回答。询问这一行为是游戏外的，但观察过程必须是游戏内的。


  ### 法师

  在 `True Dungeon` 中，法师像牧师一样，主要通过他们施放的法术以及施放法术时所需的记忆法来定义。通过正确地记住不同的位面及其相互作用，施放法术的法师可以增加其效果。有趣的是，法师的法术是最多样化的。`Continual
  flame`（持续火焰）提供一个发光球，而不是游戏开始时提供的伪闪烁火炬之一。某些攻击法术（`magic missile` 魔法导弹、`ray of frost`
  冰射线）造成直接伤害。然而，`Melf’s Acid Arrow`（米尔的酸箭）需要通过冰壶滑动来击中目标。


  在 Darkon 中，法师被称为 mages。他们穿着及膝的长袍作为服装的一部分，并且使用材料成分来施放法术。他们拥有《地下城与龙》中赋予法师的全系列法术，范围从纯攻击法术到变形（`growth`
  生长、`gaseous form` 气态）以及其他杂项法术（`enchant item` 强化物品、`animate dead` 操纵死尸）。


  `True Dungeon` 中，冒险队伍由八名玩家组成。备用玩家池补充了任何缺少所需八名成员的队伍。通过这种方式，一些小组向新玩家介绍，而另一些小组则是老朋友群体。


  由于 `True Dungeon` 中的许多挑战都需要团队合作，失败的团队是那些合作最不有效的团队。这与 `MMORPGs` 和 `FPS` 类似，它们也将不同背景的玩家聚集在一起。宝物在团队成员之间分配，这总是压力的来源，因为存在优先事项的冲突（贪婪和个人利益对比团队合作）。


  `True Dungeon` 强化分享和合作的一种方式是通过光照。光源仅限于火炬或 `continual flame` 光球，迫使玩家聚集在一起阅读线索或检查符号。小组还必须与时间限制作斗，因为队伍在地下城每个房间的停留时间大约为十分钟。


  `True Dungeon` 冒险队伍的另一个有趣方面是没有职业重复。每个角色职业在游戏中都有其独特的对适用性，这在某种程度上是 `True Dungeon`
  大量规划的需要。


  在 Darkon 中也可以组队，但游戏更进了一步，允许小组形成国家。国家是由至少四名玩家组成的团队，拥有特定的旗帜和外衣。国家可以与其他国家进行贸易，建立联盟，甚至发动战争。每个国家指定两个领导者作为参议员，参加参议员会议并对整个游戏的规则投票。


  ### 状态

  `True Dungeon` 像角色升级一样推进玩家。然而，经验值和等级是与玩家绑定的，而不是角色。这些经验值跨越所有的“True”活动（包括 `True Dungeon`
  和 `True Heroes`）。所有过去和现在的 `True Adventure` 活动获得的经验都会汇总以计算玩家的等级。





  # 游戏机制与玩家进度


  冒险的基础奖励为 650 点经验值，玩家每存活一个房间即可额外获得 50 点。在第一级，玩家可以进入某些特殊活动，如 `True Arena`（真实竞技场）。在第二级，玩家可以在任何一级玩家选择之前获得角色职业的选择权。三级玩家则通过掷骰子决定谁先选择。第四级玩家可以免费进入“酒馆”（Tavern），这是一个由非玩家角色游走的角色扮演舞台区域。通常情况下，玩家只在玩
  `True Dungeon`（真实地下城）之前和之后进入`酒馆`。在第四级，他们可以随心所欲。第五级玩家获得“领”（Lord）或“女士”（Lady）的称号，这让他们在`酒馆`以及可能在
  `True Dungeon` 论坛上获得某些特权。


  参加过五场或以下活动的 `Darkon` 玩家需要参加新玩家演讲，回顾 `Darkon` 规则、长者（Elders）的职责以及安全事项。他们必须先注册为`fighter`（战士），直到参加过五场活动，届时才能切换到其他职业之一。新成员在游戏中的行为也受到限制。在参加过五场活动之前，他们禁止穿护甲和使用任何双手武器。在新玩家参加过十场活动之前，禁止使用弓、弩和标。


  在 `Darkon` 中，角色通过战斗积分来提升。这些战斗积分通过参与各种活动获得。玩家参加全天活动、扮演非玩家角色以及向新成员介绍 `Darkon` 都可以积分。角色每获得五分积分，等级就会提升。`Darkon`
  中的力量超过 2 级，某些职业在二十五级时获得新技能。


  ## 结论


  实景角色扮演（LARPs）是许多其他形式幻想游戏的灵感来源。尽管 LARPs 在《地下与城》（Dungeons & Dragons）出现之前就已经存在，但它们人气在游戏发布后飞速增长。LARPs
  滋养了幻想游戏文化并从中受益匪浅。相反，美国公众对 LARPs 机制的误解最终损害了《地下与城》的声誉。这种污名化在桌面游戏领域持续了数十年，直到今天仍然是一个问题。


  LARPs 还影响了电脑角色扮演游戏（CRPG）的发展，正如《阿普夏神庙》（Temple of Apshai）和《魔法门之旅》（Ultima）系列所示。LARPs
  与其他游戏形式之间的交流仍在继续。MMORPG 的种族多样性在 `Darkon` 中得到了反映。`Darkon` 和 `True Dungeon` 很大程度上归功于《地下与城》的第一版和第三版。从个人投入的角度来看，LARPs
  是最耗时的幻想游戏形式之一。参与者会认为这一切都是值得；沉浸感是无与伦比的，情感和感官体验无可比拟。只要人们还在故事，LARPs 就会与我们共存很久。


  ## 游戏的未来


  那么，我们未来何何方？既然我们已经涵盖了幻想游戏主题的演变及其各种形式，从《指环王》到实景角色扮演游戏，接下来是什么？


  从本质上说，定义角色扮演游戏中“角色”的挣扎关乎媒体的丰富程度，从没有任何物理线索可以区分的完全匿名用户（`MUDs`），到媒体丰富到以至于无意的物理线索会渗透其中的环境（`LARPs`）。我希望这本书已经清楚地说明了每种媒介对游戏玩法都具有重要影响。


  我们还探索了模拟主义与叙事之间的紧张关系。《地下与城》最初是人战战斗的模拟，其本身是桌面战争游戏的后裔。角色扮演方面是后来的，通过游戏主持人（Game Masters）和玩家将游戏扩展到了其战争游戏的根源之外。通过根据玩家的决定调整情况，数百万游戏主持人在他们玩家的想象中创造了一个定制的、媒体丰富的幻想环境。


  从那里开始，两条路径分叉了。互动小说（Interactive fiction）试图通过严格限制玩家的叙事选择，来重新获得游戏主持人构建叙事结构的能力。早期的电脑角色扮演游戏全盘拥抱模拟，专注于战术和升级。另一方面，大型多人游戏牺牲了叙事来换取桌面游戏的社交属性——即其他玩家。曾经那种由少数玩家角色组成的“护卫队”（Fellowship）作为唯一英雄的叙事构想已烟消云散。取而之的是整个英雄社区，他们共同努力以实现目标。


  在较小规模上，`LARPs` 面着同样的挑战。要管理大型群体并填充世界，让每个角色感觉都很真实并不是易事。但有由真人扮演的非玩家角色填补了空白。当你玩 `LARP`
  或任何像 `True Dungeon` 这样媒体丰富的游戏时，你禁禁沉浸在游戏中，因为每种感官都投入了其中。这并不意味着玩家实现了自主性。创造沉浸感是可能的，但这需要所有参与者都持有正确的心态——玩家、非玩家角色、角色距离和环境共同协作工作。


  回顾每种游戏媒介强化了空闲时间真的是多么宝贵。随着现代世界节奏的加快和其他形式的娱乐争夺我们的注意力，需要长期个人投入的游戏人气将继续下降。随着 `PBBGs`（基于浏览多人游戏）和大型多人游戏的日益普及，`IF`（互动小说）和
  `MUDs` 一年不如一年。这些游戏在沉浸感上的缺失在便利性上得到了弥补。互联网为我们提供了最大的游戏桌，有无尽的玩家可以招募。


  最新的游戏媒介将继续演变。随着计算机和主机机处理器能力的增强，大型多人游戏将趋向于 `LARP` 体验，而无需大量的时间投入。`Castronova` 预见到游戏媒介的丰富性融合将变得无缝，`LARPs`
  和 `MMORPGs` 将变得不可区分。损害自主感的控制和过滤将变得更加平缝整合。当你挥剑时，会有一个类似 Wii 的遥控器替你执行。这种物理界面并不适合所有人，但它确实能找回
  `LARPs` 中“实物战斗”风格的真实感。


  创新不仅限于在线社交空间。我从第一人称射击游戏的个人经验中得知，匿名性损害团队凝聚力。凑在一起互不认识的团队很难建立领导或主导地位。陌生人首先考虑自己，其次才是团队。然而，共同工作的公会和战队要有效得多，因为决定我们兼容性的百万个小因素已经慢慢解决了。






  如果说各种形式的幻想游戏中存在一个清晰的模式，那就是“角色/种族/职业”范式并不能完美地转化到其他游戏媒介。`Dungeons & Dragons` 最初是为围坐在桌子旁的小组成玩家创建的。玩家拥有专门的角色，游戏由一位灵活的叙述者/裁判主持，每次持续时间可长达六小时。每当其他游戏媒介打破这种范式时，游戏就会开始崩溃。


  例如，桌面游戏小组的成员彼此认识，并经常一起玩。`MUDs` 和 `MMORPGs` 瞬息变化的本质削弱了这种游戏风格，因为无法保证在正确的时间有正确的角色组合。于是，玩家不得不诉诸单人游戏，以弥补在角色失衡和时间限制方面的不足。


  从叙事角度来看，角色扮演一直关乎无形的限制。尽管游戏主（Game Master）心中确实有一些边界，但这些边界对玩家来说并非立而易见的。交互式小说、游戏书和电脑角色扮演游戏都由于系统的限制，被迫通过一个围墙的世界来人为地限制玩家的进度。目前没有任何游戏系统能够再现人类想象的深度和广度。我们可能永远无法做到。


  这并不是说那种拥有大量数字和属性的模拟主义游戏风格在游戏中没有地位。如果说要说，它定义了游戏。但自 `Dungeons & Dragons` 出现以来，模拟主义游戏的演变却异常细微。多年以后，`MMORPGs`
  才利用其庞大的玩家基础推出了团队副本（raids）。`PBBGs` 也花了同样的时间才填补了那些没多少时间玩的休闲玩家的空白。我们已经走了很远，但还有很长的路要走。


  之前提到的每种游戏媒介永远不会真正消失。爱好者们会让它们长久存在。重要的是他们从彼此身上学到的东西：采纳 `LARPS` 的叙事沉浸感、`MUDs` 的规则裁决、`MMORPGs`
  的大规模群体力量、`IF` 的问题解决能力以及桌面 RPG 的统计框架。


  但仍有希望。随着像 `CRPG` `Heavy Rain` 和实景剧 `True Dungeon` 等创新，规则被适应了叙事，而不是反过来。我们正处于沉浸式游戏新纪元的边缘。


  当然，老游戏永远不会被遗忘。它们存在于我们的爱好、我们的故事和我们的记忆中。在四年级在 `PET` 电脑上第一次遇到它二十年后，我重新发现了了 `Wizard’s
  Castle`。这是一款画面简单的简单游戏，现在正从我的电脑桌面上召唤我。每当我写这本书时都会玩玩它。我还是找不到那个该死的法球。


  # 术语表


  `AC` (armor class，护甲等级)：角色的防御，与其护甲和其他装备有关。这个术语继承自一种海战游戏，其中 `class` 一词被用于不同的语境中以区分船只。它有些过时，因此现代游戏很少使用这个术语。


  `AD&D` (advanced dungeons & dragons)：由 Gary Gygax 主要领导的原版游戏的后期版本。通常指 `AD&D` 的第一版。


  `agency` (代理)：玩家以自然、引入胜的方式与游戏环境交互的能力。


  `BD&D` (basic dungeons & dragons)：原始 `Dungeons & Dragons` 游戏分支，由 J. Eric Holmes
  领导。它拥有简化的职业，种族之间的区别也较小。


  `class` (职业)：一种帮助定义幻想宇宙中角色角色的专业、工作、公会或职业。随着时间的推移，这个术语变得不再流行，因为它在现代口中不再使用。


  `CRPG` (computer role-playing game，电脑角色扮演游戏)：在控制台（如 `Xbox`、`Playstation`、`Wii`）或电脑上运行的图形角色扮演，涉及少数玩家。


  `cyberdrama` (网络戏剧)：一种新的叙事类型，鼓励玩家通过游戏参与故事的塑造。


  `diegesis` (叙事世界)：情境和事件发生的虚构世界。在游戏术语中，`diegesis` 是角色扮演者体验其角色的水平。通常情况下，游戏环境的媒体丰富性越低，发生
  `diegesis` 的概率越小。但减少媒体丰富也有优势，因为它允许匿名参与者处理某个角色。


  `DMG` (`Dungeon Master’s Guide`，地下城手册)：可以指该系列的任何版本，从 `Advanced Dungeons & Dragons`
  版开始。所有版本都以硬装格式出版，基础版和原始规则则是盒装。


  `ergodic literature` (遍历性文学)：动态文本，读者必须执行特定动作来生成序列，该序列会随每次阅读而变化。


  `farming` (刷资源)：在 `MMORPG` 或 `MUD` 中利用游戏机制的重复元素收集有价值的物品。


  `frame` (框架)：根据组织原则构建的情境定义，这些原则管理着事件本身以及参与者对这些事件的体验。


  `gold` (金)：金本从未完美过，在实际的中世纪也没有在国家或全球范围内标准化。`Dungeons & Dragons` 将金币设定为基础汇率。其他硬币在
  `Dungeons & Dragons` 中也有波动，包括 `copper`（铜币）、`silver`（银币）、`electrum`（电金）和 `platinum`（铂币）。有些为了适应设定改变了这些，但大多数游戏坚持金币格式。书中每当提到
  `gold` 时，指的是幻想设定中使用的任何形式的有价值货币，而不一定是指金子。


  `grind` (肝)：重复执行任务以期获得某种优势，无论是更高的等级还是某些物品。


  `group` (组)：`MMORPG` 中的小队。


  `HP` (hit points，生命值)：一种代表角色生存能力以及规避伤害机会的抽象战斗系统。该术语随着时间的推移变为仅代表物理伤害（如其他角色扮演游戏 `Palladium’s
  Megaverse`, `Call of Cthulhu` 等）。


  `IF` (interactive fiction，交互式小说)：通常涉及单个玩家的文本冒险游戏。


  `LARP` (live action role-playing game，实景角色扮演)：玩家亲身扮演角色角色的游戏。道具、环境和服装是可选的。


  `level` (等级)：在幻想游戏中有多种定义。包括代表角色或怪物力量的整体等级；代表所选职业能力的等级；代表角色可以施展的越来越强大的魔法的力量（但不一定代表其施法职业的等级）；甚至是地下城等级。这些混淆的术语逐渐被抛弃，大多指角色的整体等级。


  `PMUD`：以开发者 Lars Pensjö (`LP`) 命名的 MUD 服务器软件。


  `MMORPG` (massive multiplayer online role-playing game，大型在线角色扮演游戏)：能够同时处理数百甚至数千名玩家的图形多人游戏。


  `MUD` (multi-user dungeon，多人地下城)：一种基于文本的多人游戏。虽然我更偏于使用多人维度来涵盖超出地下城的各种 MUD 类型，但 Castronova
  纠正了我：这个缩写指的是 DNGE 交互式小说游戏。通常情况下，`MUDs` 以规模较小和缺乏图形与 `MMORPGs` 区分开来。


  `party` (小队)：一起冒险的角色组。






  # 术语表


  - **PBBG (持久性浏览器游戏)**：一种跨平台的异步角色扮演游戏，使用网页浏览器（在计算机或移动设备上）访问游戏。从技术上讲，其全称应为持久性浏览器角色扮演游戏，但
  `PBBRPG` 似乎是另一个没必要的冗长缩写。本书的语境下，`PBBG` 指幻想角色扮演游戏。


  - **PHB (玩家手册)**：可以指代任何版本的 `Player’s Handbook`，从《高级地下城与地下龙》版开始。所有版本均以硬装本形式出版，基础和原始规则则以盒装形式提供。


  - **主框架 (primary framework)**：现实生活中的外部力量，它们与游戏无关，但会影响游戏，例如上厕所休息和玩家的时间表。


  - **种族 (race)**：角色的有智物种。就像 `class` 一样，这个词在角色游戏之外有完全不同的含义。


  - **角色扮演者 (role-player)**：与角色扮演游戏的主框架、次级框架和三级框架交互的玩家。


  - **角色扮演游戏 (RPG)**：任何玩家控制虚构世界中的角色并在游戏过程中发展该角色的游戏。


  - **掷骰玩家 (roll-player)**：与角色扮演游戏的主框架和次级框架交互的玩家。


  - **次级框架 (secondary framework)**：玩家在其中体验角色扮演游戏规则和数据的框架。


  - **单人游戏 (soloing)**：在没有队伍的情况下玩 MUD（多用户地下城）或 MMORPG（大型在线角色扮演游戏）。


  - **三级框架 (tertiary framework)**：角色扮演者在角色扮演游戏背景下扮演另一个人格的框架。


