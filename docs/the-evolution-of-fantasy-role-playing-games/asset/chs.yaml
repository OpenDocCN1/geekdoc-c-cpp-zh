  ### 生存与叙事


  （此处后续为原文中出现的重复内容，已按要求翻译并保留格式……）





  作为一种自然力量，游戏主（game master）处理所有与野兽或人类无关的事件，从天气到时间的流。作为非玩家角色的化身，游戏主履行了他可能最广为人知的角色——代表虚构世界中所有其他活生生的角色行动。其他的化身还包括外星和凡间的野兽，从巨龙到昆虫再到有意识的岩石。最后，作为一种超力量，游戏主扮演着神灵本身的角色，神灵可能有自己的私小利益（Gygax
  1989:22）。


  与之前的版本不同，第四版 `Dungeons & Dragons` 的叙事有了清晰的定义。这个世界是奇、古老且神秘的——在许多方面，其设定比以往任何时候都更贴近托尔金的中洲。它还恢复了冒险中的危险与奇幻感，并将其描述为“黑暗世界中的光点”。这正是托尔金中洲对人类而言的意义：一个需要英雄的危险之地（Wilkes
  2008:14）。


  第四版设计者的主要目标之一是减少对欧洲的中心化，在这方面脱离了托尔金，并间接脱离了盖格。正如 Matthew Sernett 指出的，叠加在中世纪模板上的奇幻元素会产生奇特的差异，例如一套板甲比一种明显更有用途的治愈药水更贵、更稀有（Wilkes
  2008:15）。


  ### 个性化


  纸笔角色扮演游戏持久的特性之一是想象力没有界限。加里·盖格（Gary Gygax, 1979:6）将 `Dungeons & Dragons` 的“框架”解释为创造一个“宇宙”，类似的战役和平行世界可以被放置其中。虽然游戏主要发生在想象中，但它通过投掷骰子来裁决。


  掷骰子并不是强制要求的，但在大多数角色扮演游戏中通常被建议使用。掷骰结果由游戏主决定。游戏主在合理的情况下行使这种控制权，以保持游戏的流程顺畅和平衡，使玩家角色有合理的生存机会。然而，掷骰子和查阅标准表格创造了一种客观性的氛围，这种氛围并非游戏主所有。正如
  Barton 在 `Dungeons & Desktops` 中所说：“`D&D` 真正聪明的地方在于它能够将‘随心所欲’的幻象与这套实用且正式的规则结合在一起”（2008:27）。


  通过在规则系统中建立统一性，玩家理论上可以在 `Dungeons & Dragons` 战役和小组之间移动。角色种族、职业、属性值、法术和物品之间的相似性有助于玩家在不同游戏之间顺利过渡。这种统一性创造了游戏小组之间的对话，为该游戏的广泛流行奠定了基础。这可能运作得太成功了。大多数基于奇幻的游戏都继承了这同一套规则和语言，几乎没有进行改动（Barton
  2008:23）。


  `Dungeons & Dragons` 中角色的六项属性值在各种游戏媒介上很大程度上保持完整：力量、敏捷、体质、智力、智慧和魅力。力量、敏捷和体质——角色的身体属性——通常被原样保留，只是体质的表述有所不同。智力、智慧和魅力在其他游戏媒介中出现得较少，取决于游戏的风格以及玩家对角色的投入和认同程度。


  `Middle-earth Role Playing Game` 具有几乎直接对应 `Dungeons & Dragons` 的特征：力量、敏捷、体质、智力、直觉和魅力。这种一对一的比例作为两个系统之间转换表的一部分（Coleman
  1993:225）。`Lord of the Rings Roleplaying Game` 拥有力量、灵巧、活力、感知、机智和气质。注意的是，它没有等等的智力属性（Long
  2002:47）。


  力量在 `Advanced Dungeons & Dragons` 中被定义为身体耐力、体力和力量。它假设由于中世纪世界体力劳动的需要，人类成年男性角色状态良好。敏捷代表了从机捷到速度、从精准到反应的一切。体质是角色体格和健身状况的反映（Gygax
  1979:15）。


  智力在理解文字内容之外，还假设了记忆和学习技能。智慧可能是定义最少的特征，代表意志力、诡计、启蒙和直觉。盖格通过一个烟民的例子将智慧与智力区分开：这个烟民知道吸烟有害，但缺乏停止的智慧。在随后的版本中，智慧也代表了感知。最后是魅力，盖格强调强调魅力不仅是外表，也是个人磁力。


  我那个角色扮演小组的成员之一解释了为什么他喜欢扮演像 `Calactyte`（`Cal`）这样一个低智力角色，一个蜥人蛮族：


  ```

  他是头脑压脑的典型。完全的简单和愚蠢。但让他成为一个有趣扮演角色的原因。他高大愚蠢，但也有一颗大心。他总是愿意为队伍的其他成员战斗、防御和保护。如果他更聪明一点，也许他就不知道在队伍明显处于人数劣势时一头冲进战斗了。他解谜的尝试往往非常幽稽，但因为他非常努力，这让人很难不爱他。他总是能因为努力获得一个“E”格。我个人喜欢扮演带有某种弱点的角色的想法。在扮演
  Cal 的时候，我经常不得不停下来问自己：“Cal 会足够聪明说出那种话吗？”或者“Cal 一会那样想吗？”这更有挑战性，但也非常有趣 [Joseph Tresca
  2010]。

  ```


  角色通过经验值获得力量，经验值被定义为所选职业的能力。经验值可以通过击败对手和通过“专业手段”解决问题获得（1978:106）。在 `Dungeons & Dragons`
  的早期版本中，获得宝藏也可以获得经验值。盖格为这种选择辩护道，解释说收集黄金获得的经验值反映了角色的“闲暇”活动，包括学习和训练。“宝藏经验值”规则也从 `Dungeons
  & Dragons` 的奇幻后裔以及该游戏的后续版本中被除了。


  `Dungeons & Dragons` 不出名的规则之一是技能。作为今天角色扮演游戏的主角，技能在 `Original Dungeons & Dragons`
  盒装中是不存在的。辅助技能在 `Advanced Dungeons & Dragons Dungeon Master’s Guide` 中被引入，但它们的描述非常粗略，对于如何使用它们的建议也很少（Gygax
  1979:12）。这让玩家们不太满意，特别是随着其他角色扮演游戏的演变，技能成为丰富角色的标准手段。`Dungeons & Dragons` 在笨拙的术语“非武器精通”上做了一些妥协，用来识别与武器无关的技能。精通最终在游戏的第三版中被技能所取代。


  第四版现在拥有 17 技能以及技能挑战，技能挑战是一种让角色通过一系列成功的技能掷骰来克服障碍的方法，而不是通过战斗。技能检查的使用是游戏主与玩家之间的协商，玩家主张哪种技能适用于特定的情况。大多数玩家会主张他们角色最擅长的技能，从而鼓励角色在技能挑战中发挥长处。由于所有玩家在技能等级上都获得固定加成，因此在例如攻击能力方面的不平衡性比技能检查要小（Smith
  2008）。






  RPG（角色扮演游戏）中一个经常被忽视、但在《地下城与》中与战斗同样重要的方面是装备清单。无论是冒险者生存所需的普通装备，还是能赋予角色优势的无尽魔法物品清单，装备提供了一种人为提升角色力量等级的手段。因此，冒险者们痴迷于记录他们拥有的每一件物品，仅仅为了活命。考虑到随机遭遇和潜在陷阱，一个典型的冒险者会配备应对每种紧急情况的装备：用于触发陷阱的长矛、长途旅行途中食用的口粮、用于求救的镜子和哨子等等。


  另一个在后来的奇幻游戏中被放大的 RPG 常规是根据对命中和伤害的加成来定义魔法物品。魔法甲赋予护甲等级 `+1` 加成，魔法武器提供命中和伤害的 `+1` 加成，以此类推。在《地下城与》的某些版本中，这些加成甚至可以达到
  `+10`。


  所有装备都有副作用。角色必须携带所有这些酷炫的东西。根据我的经验，负重系统在后来的《地下城与》桌面版本中很大程度上被抛弃了——并不是因为游戏规则有缺陷，而是因为玩家们发现跟踪所有角色的装备太麻烦了。然而，计算机和大型多人游戏并没有遇到此类困难，正如我们在随后的章节中将看到那样。


  游戏的通用语言创造了一个兼容的玩家网络，这最终导致了锦标赛的出现，即不同玩家小组在不同时间参加同一个冒险的特别活动（Gygax 1987:39）。锦标赛通过角色扮演游戏协会（`RPGA`）进行裁决。在
  `RPGA` 中，如果大多数玩家决定了某种状况——反派死亡、圣物的获得或遗失、村庄的毁灭——它就会成为游戏宇宙的一部分。`RPGA` 为 MMORPG（大型在线角色扮演游戏）设定了模板；冒险者存在于同一个世界的某种超级宇宙中（Harrigan
  and Wardrip-Fruin 2007:219）。


  Gygax 认为这类锦赛有助于玩家完善他们的游戏。然而，他特意反对地下城主（DM）过度自定义他们的战役，担心这会让游戏失去挑战性，或者“奇怪到已不再是 AD&D”（1979:7）。尽管他鼓励变化，但他希望这种变化保持在整个系统的范围内。对于
  Gygax 来说，玩家能够创建从根本上相互兼容的游戏更为重要（1978:8）。他是正确的。得益于《地下城与》的巨大人气以及生命值、护甲等级、等级和经验值的通用语言，奇幻游戏得以繁荣。


  ### 风险


  Gygax 识别了对所有角色扮演游戏中不可或缺的三个元素：战斗、战役和冲突。“战斗”涉及非致命和致命性种类，“战役”涵盖更大规模的战斗，而“冲突”则像群体之间任何其他形式的非物理竞争。Gygax
  警告说，过度依赖战斗和战役的游戏实际上战争游戏（1987:86）。


  与角色命运被预先定的故事不同，角色扮演环节的主角拥有不确定的命运。他们完全可能因为连续的倒霉运气而丢脸地死去（Czege 2007:67）。在处理那些并非因自身过错而死的角色时，Gygax
  主张采取有利于玩家角色的立场进行裁决。他转而鼓励角色受伤或昏迷。


  Gygax 还强调了连续性（1989:57）的重要性，以及玩家所投入的角色的延续。为了让游戏对玩家保持有意义，他解释了三种继续下去的机制：通过运气机制避免某些死亡的能力（在《地下城与》中通俗地称为“救命骰”）；通过复活、克隆、重生或复制从死亡中恢复的能力；以及用近亲属或同伴替换角色的机会。


  相反，Gygax 认为那些不可触碰且永远没有风险的角色也不好玩。得益于强大的复活魔法，在高等级时死亡并不一定意味着风险。在高级《地下城与》中，复活需要进行系统冲击掷。失败意味着角色永久死亡。


  如果角色在该掷中失败（这应该由他或自己来进行），他就彻底死了。必须有一个最终的死亡，否则不死将接管，游戏将再次变得无聊，因为玩家角色每个将拥有 `9+` 条命！[1979:110]。


  这与角色频繁死亡 MMORPG 形成对比。


  在包括第三版在内的所有《地下城与》版本中，牧师都是任何治疗策略的关键组成部分。虽然德鲁伊等其他职业可以使用治疗法术，但大多数治疗都在牧师角色手中。第三版扩展了通过药水获得治疗的途径，药水可以大量购买。尽管如此，它明确了如果角色需要快速治疗，就需要某些外部力量。这使得牧师既是队伍中不可或缺的补充，也是一个受限的角色，这种角色在如今的
  MMORPG 中仍然存在。第四版改变了这一切。


  第四版引入了“治疗浪潮（healing surges）”。治疗浪潮每个职业在每次战斗中可以使用一次，允许恢复四分之一的生命值。牧师不再仅仅负责维持玩家存活。此外，现在有两个职业可以作为其行动的一部分进行治疗——牧师和军武领——使得他们在战斗期间的功能上不再受到严格限制（Smith
  2008）。


  第四版改变了怪物数量是可变的假设，改为由五名玩家角色组成的队伍面对四个怪物。每个怪物都有一个角色，该角色模仿了玩家职业的角色——野蛮人、士兵、领袖和控制者（Wilkes
  2008:11）。关于怪物协作的规则，与玩家职业协作的规则相同。


  虽然这在游戏中并不是新概念，但对于《地下城与》来说是新的。


  除了怪物之外，陷阱在第四版中也作为队伍的挑战被整合进来。许多陷阱是基于位置的，某些职业技能涉及到在战斗网格或桌面上推拉目标。从本质上说，陷阱之所以重要，是因为玩家角色可能会推入或被推入。


  ## 角色


  在《地下城与》中，成为玩家或地下城主有相应的责任和任务。通过这些任务，玩家和地下城主贡献游戏，塑造结果。传统上，玩家创建并控制自己的角色，从外观到游戏的量化属性。玩家决定角色的行动，并通过掷骰来决定任何不确定性的结果。


  ### 创建者角色


  角色相当于小说中的主角，由地下城主提供叙事。尽管玩家帮助塑造世界，但最终由地下城主决定其宏观范围。地下城主负责世界上每个级别的细节，从玩家之外的每一个角色到地形。地下城主还负责裁决玩家以及他们如何相互互动。他是创造者和叙述者、法官和裁判。





  玩家与地下城主（Dungeon Master）的角色之间存在某种程度的重叠。地下城主的职责包含了每个玩家为其个人角色提供的所有细节。玩《地下城与巨龙》面临的严峻挑战之一是，地下城主是一个“玩家加强版（player
  plus）”，他们需要像玩家一样熟悉所有规则，还要熟悉怪物、世界观设定和叙事的规则。区别在于专业分化；玩家可以专注于单个角色的细节，而地下城主则无法做到这一点。


  ## 游戏主（Game Master）


  “游戏主（game master）”一词最初用于邮寄游戏。它曾出现在 Guidon Games 的规则集《Don’t Give Up the Ship!》中，该规则集将许多属性引入了我们今天所知的角色扮演游戏。Flying
  Buffalo 出版的《Tunnels & Trolls》首次在类角色扮演游戏的语境下使用了这一短语（McGonigal 2007:253）。盖益克斯（Gygax）将游戏主的七项主要功能分解为：推动力量、创造者、设计师、裁决者、监督者、导演和裁判（1989:14）。


  ## 推动力量

  作为推动力量，游戏主负责将玩家聚集在一起。除了运行游戏外，游戏主还必须处理游戏规则范围的外部因素，例如新玩家的加入、玩家缺席或小组的整体意愿。一场成功的游戏是玩家与游戏主之间持续的谈判（Fine
  1983:90）。


  ## 幻象

  Mackay（2001:118）认为，玩家与游戏主之间的区别是幻象的。在角色扮演游戏的体验中，更多的是所有参与者角色在角色扮演表演整体中的组合作用，而不是他们个人的贡献。没有乐于参与的玩家，游戏主就无法成功运行游戏；而没有游戏主，玩家也无法游戏。


  ## 创造者

  作为创造者，游戏主负责游戏发生之宇宙的形成。除了规则本身，游戏主还负责解释这个世界并与玩家分享。在这一方面，游戏主是宇宙的解析器（Hindmarch 2007:55）。这并不是说游戏主可以创造任何他想要的世界。它必须迎合玩家，并且如果要让玩家获得一种有效的参与式体验，就必须通过军事战术、群体关系或人际行为来满足他们的兴趣（Fine
  1983:89）。


  ## 设计师

  当游戏主进入核心规则系统未涵盖的领域时，从某种意义上说，游戏主正在现场设计自己的规则——很少有游戏能如此严格地遵循书面规则，以至于不需要任何解释。在这方面，游戏主在执行规则的同时，也在塑造游戏。


  ## 裁决者

  作为裁决者，游戏主负责解释核心游戏的书面规则。从某种意义上说，游戏主也是经验最丰富的玩家。他的工作是至少在规则的熟悉程度上与其他玩家一样优秀，以便有效地裁决游戏。不熟悉规则可能会导致损害游戏体验的错误。从这个意义上说，游戏主的角色既承担了游戏中所有其他角色的负担，又像是一个规则全书。


  ## 监督者

  作为监督者，游戏主帮助构建长期角色扮演战役（或用盖益克斯喜欢的称呼“环境（milieu）”）的叙事。当他监督世界并控制一切非玩家控制的事物时，有时被认为是神一般的，如果不是的话。没那么戏剧的是，游戏主的角色通常被比作讲故事的人或剧作家。他选择了游戏的叙事和结构（Fine
  1983:72）。这与单次游戏（one-shot games）或锦标赛游戏不同，后者需要更短的时间投入和关注。


  ## 导演

  作为导演，游戏主移动游戏中的非玩家角色。他控制着从舞台调度（天气、运气、经济）到其他演员的一切。同样，游戏主还帮助引导玩家角色，分享信息并引导他们走向一个对所有相关方都有趣的方向。因为游戏主控制着游戏中的“对手”以及盟友，他们充当了某种游戏引擎，这种引擎后来会被计算机和多人在线角色扮演游戏（MMORPGs）模拟（但无法完全复制）。本质上，游戏主是游戏系统固有的一部分。


  ### 裁判

  最后，作为裁判，游戏主管理玩家。他裁决玩家之间、冒险小队之间以及游戏事件之间的争端和冲突，包括忽略或遵循某些骰子掷结果。事实上，在《地下城与巨龙》的第一版中，“裁判（referee）”一词是“游戏主”的前身。


  游戏主的角色让角色扮演游戏脱颖而出，但也限制了它们。《Men & Magic》指出，裁判“承担了这里的全部负担，但如果用心苦思考，回报将远超他的付出”（Gygax
  1974:5）。推测裁判获得的回报是乐趣的；《地下城与巨龙》的一项重大挑战一直在于玩家与游戏主之间的不平衡，游戏主在开始游戏之前需要多得的时间和准备工作。正如《Men
  & Magic》所说，游戏主确实承担了全部负担。


  ## 助理游戏主（Assistant Game Master）


  在大群体中，盖益克斯建议增加一个额外的游戏主，可以帮助处理运行游戏中更繁重的任务（1989:143）。他规定了助理的任务，包括在游戏开始前准备剧本细节、在游戏前和期间协助记录，以及在游戏结束后对玩家进行汇报。


  助理游戏主的角色（以盖益克斯早期的战役为特征，当时他的游戏扩展到二十名参与者）实际上是一个两个阶段的过程。首先选拔一名优秀的玩家担任助理游戏主，处理各种任务。然后他最终成为平等的
  `co–GM`。第一位 `co–GM` 是罗伯·昆茨（Rob Kuntz），他本身就是游戏领域的一个传奇人物（Archer 2004:45）。


  ## 参与者角色


  年龄在游戏中有一个重要区别，因为它微妙地影响了小组的社会阶层。根据 2000 年 Wizards of the Coast 的调查，市场上角色扮演者的年龄分布集中在
  25 到 35 岁之间。


  ![graphic]


  Wizards of the Coast 的调查发现，市场的一半以上年龄大于 19 岁。16 到 18 岁之间的游戏频率大幅下降（2000）。


  早期角色扮演玩家群体本质上是不稳定的。传统的角色玩家通常在 12 或 13 岁（进入高中前）进入这一爱好，并一直玩到 16 岁。这主要是由于流动性的缺乏，体现在是否有车辆上；有车的玩家有更广泛的竞争性娱乐活动可以选择。这种限制在几年后的大学期间再次出现，因为玩家同样受到预算和移动性的限制。根据海特（Hite）的，大多数角色扮演战役最长不会超过四年（2007:38）。





  最终演变为“玩家角色”（player character）或“PC”的短语的合并，在《Men & Magic》一书中被称为“player-character”或“player/
  character”（Gygax 1974:11）。玩家角色的创造是一个重要的区别，它清晰地将角色扮演游戏与战争游戏区分开来。它将玩家与角色紧密地联系在一起，并暗示了在其他游戏形式中未曾显现的一对一控制水平（即：没有所谓的“玩家军队”或“玩家小队”）。这种区别变得非常重要，因为玩家的角色虽然重要，但与游戏主（game
  master）的角色相比，被大大削弱了。


  在《Shared Fantasy》中，Gary Alan Fine (1983:53) 将玩家投入精力和精力进行角色扮演的理由归纳为四个主题：教育成分、逃避社会压力、个人控制感，以及处理人际关系的辅助工具。


  纸笔角色扮演游戏本质上是用于想象力游戏的规则集。游戏中通常有详尽的规则汇、说明书，需要读者付出巨大的努力才能理解如何游戏。学习游戏是桌游游戏的高门槛，过滤掉了那些反感学习复杂规则的玩家。相比之下，计算机角色扮演游戏（CRPGs）和大型在线角色扮演游戏（MMORPGs）缓解大部分学习曲线，更容易上手。


  由于角色扮演游戏中有时包含历史或未来元素，玩家通过玩奇幻模拟来学习更多现实世界的文化。我哥哥举了一个例子，说他如何因为角色扮演的经历在高中课堂上清晰地阐述了中世纪体液学的概念（Tresca
  2010）。同样，像《克苏鲁之谜》这样的游戏鼓励对 20 世纪 20 年代的生活和文化的理解。


  除了教育玩家历史细节或未来理论之外，Fine (1983:62) 还列出了其他源自角色扮演游戏的受推誉的属性，包括综合信息的能力、决策、领导力以及作为一种技能的角色扮演。角色扮演本质上是一种团队活动，团队需要决策和领导力才能获得成功。作为一种技能的角色扮演可以更好地描述为共情，即设身处地的能力以帮助理解他或她。儿童心理学家、成年顾问和商人士都将角色扮演作为教学工具来帮助理解不同的观点，而奇幻角色扮演也能以同样的方式提供帮助。


  角色扮演游戏也是一种心理逃避。游戏玩家有机会承担比他们更聪明、更快、更强壮、更有吸引力的人格。他们可能交替选择一个更胆大或更残暴的角色，夸大他们在日常生活中无法充分发挥的特质。角色扮演还允许玩家在不担心后果的情况下打破常见的社会习俗和禁忌。他们的角色可以随心所欲地变得暴力或和蔼，唯一的后果是由游戏主虚构的。


  尽管角色扮演游戏的流行不如其他更主流的娱乐形式，但角色扮演仍然需要社交互动。这有助于某些可能在社交互动方面遇到困难的玩家，通过找到一个他们可以产生共鸣的同类群体并假装成别人。


  对我来说，角色扮演游戏是我职业发展的重要部分。对着坐在桌旁的一群人自信地发言、对行动方案达成一致并让团队成员使用一套复杂的规则合作工作，都是我在工作中使用的属性。在进入商业世界之前，我已经在不知不觉中领导了数百次商务会议。会议室里缺少的只是一些骰子。


  ## 召集者（Caller）


  在《Men & Magic》中，一个游戏示例包含了被称为“召集者”（caller）的人与裁判（referee）之间的对话。《高级地下城与龙玩家手册》将召集者定义为领导者，负责告诉“裁判队伍将去去哪里以及他们将做什么”
  (1978:106)。从《Men & Magic》中的往返示例可以显易看出，召集者与其他玩家交流，并最终决定了要传给裁判的行动计划。


  考虑到 20 个玩家对应一个裁判的比例预期，这也许是可以理解的。在拥挤的人群中，召集者的必要性比在电子媒介上要高得多（Mona 2007:28）。《地下城与龙》的基础版中也提到了召集者，但加入召集者主要是为了向原版游戏致敬。基础版的作者
  Eric Holmes 认为召集者的角设是多余的。通常大家会同时说话，Holmes 认为这更真实地代表了队伍的动态（Holmes and Moldavy 1981）。该角色在《地下城与龙》的后续版本中被废弃了。


  Fine (1983:172) 更广泛地定义了玩家领导力。领导力可以通过单一召集者、任务分工、群体共识或完全没有表现出来。领导者像裁判一样，面临着协调与其他玩家之间各种冲突利益的独特挑战。最有效的领导者会以一种增加所有人乐趣的方式做到这一点。由于玩家的参与程度不同，这并非易事；某些玩家不可避免地会根据其对游戏的参与程度而主导他人，而其他玩家可能选择“单干”，根据自己的兴趣而非小组的利益来进行其角色的行动。当领导者明确存在于游戏的队伍框架内时，他们有助于和谐地协调这些各种利益。


  ## 角色职责


  《地下城与龙》的定义特征之一是阵营（alignment），这是一种广泛的思维方式，为特定角色应该如何行动提供了准则（Gygax 1979:23）。在规则的早期版本中，甚至有一种与阵营相对应的特殊语言。这种哲学完全取自米克尔·穆科克（Michael
  Moorcock）的《埃里克》系列，对善恶力量、天堂地狱有着深远的影响。


  Gygax 解释说，阵营系统对玩家和游戏主来说都是角色扮演的辅助。然而，扮演一个邪恶的角色并不一定反映玩家的道德：


  按照我们社会的社会文化标准扮演一个坏的、邪的或错误的角色既是不正确的也不应被指责的。指责一个演员扮演反派角色，就像指责一个拥有道德标准不能被称为善的玩家角色的游戏参与者正在进行某种形式的错误一样，毫无道理
  [1987:34]。


  阵营在第四版中被淡化，使最新版本的《地下城与龙》进一步远离了定义托尔金英雄的某些内在高尚理想。正如 Logan Bonner 在《种族与职业》中所解释的那样，游戏主现在拥有创作充满阴谋和欺骗剧情的自由，这些剧情不会被侦测邪术术破坏（Carter
  2007:75）。


  ## 性别


  《地下城与龙》特别值得注意的是，它从未区分性别。在《角色扮演精要》中，Gygax 解释说玩家角色的性别通常不是重要的考虑因素。他更关心角色在游戏宇宙中的作用，以及玩家正确扮演性别的能力（1987:33）。


  种族






  在《高级龙与地下城：地下城主指南》（1979:21）中，“以人类为中心”的设定被确定为游戏的核心，其中半类人（其他可玩的非人类种族）、半人（兽类类人怪物）和类人（兽人、哥布林和其他比兽人更文明的组织化怪物）处于边缘地位。Gygax
  选择以人类为中心的游戏，是因为它为规则系统提供了坚实的基础，提供了一套关于游戏世界的可用假设，以及一种让玩家能够与其角色建立联系的简单方法。


  在《战士与魔法》中，只有四种可玩的种族：矮人、精灵、人类和霍比特。整本书的插画非常稀疏，但尽管画作很少，却似乎与后世对种族的认知奇奇地脱节。一张留着胡须、身材矮矮、持斧头的战士图片被标记为`goblin`。另一一张穿着皮背甲、单手持剑的胡须战士图片被标记为`elf`。


  这四种都可以成为战士，尽管矮人被限制在六级，精灵和霍比特被限制在四级。人类和精灵可以成为施法者，但精灵被限制在八级。只有人类可以成为牧师。由于盗贼直到以后才被引入，霍比特仅限于战士。


  “半类人”等级限制的概念值得讨论，因为 Gygax 坚信半类人种族需要具有内在的局限性，以保持这种以人类为中心的体验。Gygax 反对允许精灵提升到更高等级，因为消除这些限制可能会让游戏变成一种“漫画书超级英雄”的形式（1987:51）——这是一个奇怪的指控，因为《战锤》中就已经将“超级英雄”作为一种英雄的形式（Gygax
  and Perren 1971:30）。


  《龙与地下城》在扮演非类人种族方面曾反复无常。在游戏的原始版本中，玩家可以扮演任何东西，只要该种族在第一级开始是弱的（Gygax 1974:8）。在《高级龙与地下城》中，Gygax
  反对此，理由是越异的种族越无法被妥善扮演（1987:33）。到了第三版时，已经有超过 135 种可能的玩家角色种族（Carter 2007:16）。


  《龙与地下城》对“种族”的定义并非现代口语中的用法。事实上，人类种族的多样性在很一段时间内并不存在。Chris Van Dyke 在《龙与地下城中的种族》中解释道：


  人类是规范种族，考虑到游戏中对人类文化以英语为中心的描绘，人类可以被解释为代表“白人”。他们是“正常的”的，而所有其他种族，无论善恶，在某种程度上都是“异域的”且被他化的
  [2010]。


  这种以欧洲为中心的关注根源于素材，特别是托尔金的作品，他侧重于创造一种欧洲神话（Gehl 2007:258）。种族多样性的缺乏通过插图得到了加强。Van Dyke
  注意到，在第一版和第二版《玩家手册》以及《地下城主指南》中描绘冒险者的数百幅插画中，没有一个非白人冒险者。直到第三版才提到了其他种族。在这两本书总共 80 幅插画和
  982 页中，只描绘了一个黑人女性（僧侣 艾伯）。Matthew Sernett 在《种族与职业》中提到了第四版试图纠正这种种族多样性缺乏的尝试（Carter
  2007:20）。


  第四版旨在消除种族描述中的人类中心偏见。人类没有明显的弱点，因此开发者最终选了“易腐败性”。人类容易受到诱惑、权力的欲望和贪婪的影响。人类可以是高尚的也可以是腐败的，可以是自己最光明的典范也可以是最最糟糕的敌人——换句话说，就是《指王》中归于人类的所有特征。


  ### 龙裔

  在第四版的开发期间，设计者们意识到有几种龙类类人的对应物。为了创造一种反映最新幻想趋势的新独特种族，第四版引入了`Dragonborn`（龙裔）。


  龙裔在《龙域夺战》的龙蜥族（Draconians）中拥有悠久的传统，他们都是邪恶的。他们第一次出现在《高级龙与地下城》的模块《绝望之龙》（1984）中，被称为“龙人”。第二版包含了将龙作为一种种族的规则，但并非没有经过重大的规则变通。正如
  James Wyatt 所指出的（Carter 2007:26），早期的《龙与地下城》名字里有“龙”这个字，但你不能玩龙。


  ![[graphic]](data/content-0020.jpg)


  ### 魔鬼

  半人半魔的后裔是奇幻作品的常客。半魔原型在亚瑟传说中有着很长的历史，特别是梅林，他被认为是一个混血（cambion），淫魔或魅魔之子（Coghlan 1993:176）。威廉·莎士比亚的《暴风雨》中描写了女巫西科克斯之儿子卡利班，也是一个混血（Bevington
  1992:1528）。


  拥有恶魔血统的生物，魔鬼拥有角、尾巴和邪恶的舌头。James Wyatt 将魔鬼描述为终极的坏男孩，与其说是邪恶，不如说是“邪恶的好奇”——在道德界限上行走的反英雄。魔鬼出现在第二版的《魔界域》规则中，随后出现在第三版的《怪物手册》中。在过渡到第四版时，他们的蹄子变成了正常的脚，角也变大了（Carter
  2007:48）。


  我的一位角色扮演战役中的玩家这样描述他的半魔角色：


  塞巴斯蒂安·阿尼尔……是一个半魔法师/术士，他与自己的内在作作斗争。他渴望行善并竭力帮助他人。从简单的爪子和抓握尾巴开始，他最终获得了翅膀并享受这种力量。继续将其用于善，而世界却视他为恶……
  (Webster 2010)。


  ![[graphic]](data/content-0021.jpg)


  ### 非玩家角色

  当《龙与地下城》最初被构思时，它很大程度上是一种抽象模拟，角色拥有一套规则而怪物有另一套。这导致了规则集的差异，这些规则有时会相互冲突，导致根据敌人或魔法伤害玩家的能力产生许多不同的解释。勒息、溺水和由于烟雾导致的窒息都有不同的判定规则，这取决于法术或怪物的攻击。第三版标准化了大多数这些规则，创建了一个将怪物像玩家一样对待的统一系统。正如任何地下城主都能证实的那样，这种模拟视角标准化了游戏，但也增加了复杂性。一个地下城主试图创建一个高等级反派，本质上是在创建一个玩家角色；如果对手中有足够多样化的个性，他可能创建几十个独特的敌人。每个角色的创建都需要时间，这种复杂性在《龙与地下城》早期版本中是不存在的。第四版通过为怪物提供基础规则简化了这项任务，并对其进行分类，帮助地下城主轻松快速地创建对手（Carter
  2007:14）。


  ## 职业

  Gygax 将职业定义为“游戏规则规定的定义的角色类型或专业”。职业为新玩家提供了一种快捷方式；它们融入了寓言和神话中的原型，并为玩家提供了一个立即游戏的框架（Archer
  2004:159）。《龙与地下城》的后续版本引入了几种并非受托尔金作品启发的的新原型。






  在我们深入探讨《地下城与龙》中引入的各种职业之前，多职业（multi-classing）和双职业（dual-classing）值得专门讨论。基础版《地下城与龙》并没有为半人类规定职业。《进阶版地下城与龙》允许不同种族在其他职业中进阶。


  ### 双职业（Dual Classing）

  人类拥有通过加入新职业来获得“双职业”的能力。人类转换职业有某些先决条件：人类角色的原始职业的主属性能力值必须超过 15，而在新职业的主属性上必须超过 17。虽然该角色可以使用原始职业的力量，但这意味着他通过使用这些能力所获得的经验值将化为乌有。句话说，双职业角色必须通过仅使用新职业的力量来投入他的新职业。这种限制一直持续到该角色在新职业中的等级升得足够高，至少比原始职业高出一个等级。与多职业角色不同，双职业角色不能混合他们的力量——`战士/法师`被禁止在穿甲时施法术。


  ### 多职业（Multi-classing）

  另一方面，多职业角色可以同时执行几个不同职业的功能。这一选项仅对半人类可用；一个多职业的精灵战士/法师可以穿护甲并施法术，尽管会有惩罚。事实上，某些半人类可以结合三个职业。经验值被分配在各个职业，因此在所有额外职业中升级需要更长的时间。考虑到《进阶版地下城与龙》对不同职业有不同的经验值速率，因此一个多职业角色可能在他所属的每个职业中拥有不同的等级。原版《地下城与龙》盒装还有另一条规则限制半人类，只允许他们达到某些上限等级。因此，即使他们多职业，半人类在每个职业中能达到的最高等级也受到限制。


  ### 职业的演变（Evolution of Classes）

  在《进阶版地下城与龙》中，不同的职业对角色加入有不同的属性值要求。`骑士`和`僧侣`的加入要求比其他职业严格得多。这些限制导致了我战役中出现了“属性值膨胀”——玩家恰好拥有足够的统计数据来加入该职业，要么通过反复掷属性骰直到获得所需的数值，要么通过点数系统，或者（正如他们后来承认的那样）直接分配分数。


  第三版极地改变了职业，标准化了其能力的几个方面。受影响最大的可能是`盗贼`职业，其专属技能被标准化了，以便其他职业可以执行相同的角色。第三版引入了`声望职业`，它们具有高度限制的要求，但赋予了高度聚焦的能力。在第四版中，声望职业被`传奇路径`（paragon
  paths）和`史诗命运`（epic destinies）取代，它们的功能本质相同，但根据等级经过严格监管（Carter 2007:91）。


  ## 刺客（ASSASSIN）

  《地下城与龙》中的`刺客`是能够一击杀死的阴影人物。`刺客`出现在《魔法与人类》中，作为一种特殊职业（Arneson 1975:1）。他们是伪装和毒药大师，通过执行刺杀任务获得报酬，并被授予源自印度图格教（Thuggee）的称号（第六级称号是`Dacoit`，第七级是`Thug`）。他们是邪恶角色，因此很难想象这些角色能成为冒险小队中完全职职成员。


  “刺客”（assassin）一词于 1531 年通过法语和意大利语创造（Ayto 1990:39）。刺客使用哈什的说法有助于形成“哈什叶人”（hashishiyyin）一词，意为“哈什的使用者”。原始刺客在
  8 世纪到 14 世纪活跃于波斯和叙利亚，是`尼扎里`（Nizaris）成员，这是一个狂热的伊斯玛仪穆斯林教派，通过暗杀反对`阿拔斯哈里发`。刺客的领袖是`Shaik-al-Jibal`（“山老人”）。尽管这两个职业根于不同的文化，但刺客（伊斯玛仪派）和骑士（`十字军团`）实际上在十字军东征期间相遇。


  西方世界关于刺客的知识大多来自`马可·波罗`，他解释了刺客是如何被特殊的药剂下毒的，让他们既无畏，又对充满快乐的后世充满希望。波罗的描述无疑带有偏见，但正是他的描述确立了幻想文学中的刺客原型。


  刺客在第二版中被移除，在第三版中作为声望职业重新引入，并在第四版的`D&D Insider`中恢复为一种专属职业。


  ## 野蛮人（BARBARIAN）

  `野蛮人`首次通过《龙之时代》杂志引入《进阶版地下城与龙》（Gygax 1982:8）。考虑到`盖瑞·盖高克斯`（Gary Gygax）的兴趣，他们从一开始就是游戏的一部分——无疑，对宝物的愤俗获取和残酷的人人搏斗在《地下城与龙》吸收这些主题很久以前就是《柯南》的主要内容。


  “野蛮人”一词源于希腊语“barbarous”，意指外国人或任何不说说本族语言的人。相关的梵语词“barbaras”意为“结结”，表明该术语可能意味着“无法清晰地说话”（Ayto
  1990:52）。


  在第二版和第三版中，野蛮人是一个拥有任何职业中最高生命骰的鲁汉（`d12`）。`野蛮人`是生存者且极其敏捷，能够比其他角色跳得更远、更高，跑得更快，并在户外环境中隐蔽移动。他们还非常敏锐，能够抵抗伏击或从背后攻击，并具有探测幻象和魔法的能力。最有说明性的是，野蛮人避开魔法，并在有机会时破坏它。


  早期版本的野蛮人从各个方面模仿了`柯南`——作为一个`盗贼`、掠夺者、战士和野蛮。然而，野蛮人未能接受魔法物品是该角色长期生存能力的一个致命缺陷。《地下城与龙》的升级系统与其说是通过等级获得个人力量，不如说是获取魔法物品。即使是`柯南`也会使用魔法物品，尽管是不情愿。


  野蛮人在第一版《未开发的奥术》（Unearthed Arcana）中发生了巨大变化，书中详细介绍了职业的限制并改进了其战斗能力。该职业在第三版成为《地下城与龙》的正式部分，将野蛮人的许多能力替换为`狂暴`（rage），这在战场场上有更直接的应用。魔法物品限制消失了。到了第四版，野蛮人再次从核心规则中移除，随后作为可选职业加入《玩家手册》2。


  ![[graphic]](data/content-0022.jpg)


  ## 牧师（CLERIC）

  `牧师`出现在《魔法与人类》中，结合了战斗者和魔法使用者的优点，是能够施放治愈术的两者的混合体（Gygax and Arneson 1974:8）。`盖高克斯`将牧师描述为能够同时使用重型武器和强大魔法的角色（1987:29）。“牧师”（cleric）一词源于圣经引用，出自申命记
  18:2 中对利未人的提到，他们是以色列部落的成员，其成员是圣殿祭司的助手：“因此他们在兄弟中间没有产业，耶和华是他们的产业。”表示“产业”的希腊语是`kleros`，它变为`klerikos`以指代与基督教事有关的事。在教会拉丁语中它变为`clericus`，被借入晚期古英语变为`cleric`（Ayto
  1990:117）。






  牧师的治疗能力源于赋予主教的神圣纽结，以及他们能够施展的神迹。牧师驱逐亡灵的力量根于《德库拉》，该小说不仅创造了“亡灵”这一流行术语，还确立了血鬼猎人通过展示十字架（一种神圣符号）来驱散血鬼的能力。


  龙与地下城中的牧师是一种宗教战士，他们蔑视尖刺武器，穿着盔甲并祈求神迹。牧师的起源于贝庸的奥多主教（Bishop Odo of Bayeux），他在《贝叶织挂画》中被描绘在黑斯廷战役中手持一种类似木棒的长锤。当时的普遍认为，主教挥舞长锤是为了避免流血，因为神职人员曾发过非暴力的誓言。奥多的兄弟威廉公爵被描绘为携带类似的物品，这暗示长锤可能是一种权力的象征（Aeon
  2001）。


  任何形式的长锤都可能导致流血。尽管如此，主教持有武器的观念先有可循。教会历史记载，早在公元四世纪就存在战士主教。在《罗兰骑士之歌》中，图兰大主教同时持有长矛和剑。勒普的阿德马
  主教也参加了第一次十字军东征。


  ### 德鲁伊


  德鲁伊最初在龙与地下城的补充书籍《格瑞霍克》中被引入，被描述为“中立宗教的祭司”，拥有每天三次变身成动物的能力（Gygax and Kuntz 1976:34）。该职业在《奥术魔法》中得到了充分充实，拥有以自然为主题的咒、穿过灌木丛、识别自然元素以及采用动物形态的能力。他们有义务保护自然，尤其是树木（Gygax
  and Blume 1976:2）。在龙与地下城的后期版本中，德鲁伊演变为中立阵的自然与轮回大师，能够交流并控制植物、动物甚至元素本身。


  “德鲁伊”一词源于高尔语的“druids”，它源自古凯尔特语的“derwijes”。关于德鲁伊的含义，来源说法不一。`Derwos`意思是“真实的”，这会让德鲁伊成为真理守护者或预言者。另一种，古凯尔特语词根
  `dru` 的意思是“树”，指的是橡树在德鲁伊仪式中的重要性（Ayto 1990:186）。


  历史上，德鲁伊确实尊树木为自然灵。他们对动物界抱有健康的尊重，因为任何动物都可能是神或另一个以动物形式存在的凯尔特英雄。拟兽化非常普遍，足以证明德鲁伊变成各种动物。但与《龙与地下城》中的描绘不同，德鲁伊并非专属的动物保护者。人类也免不受这种保护。


  龙与地下城中明显缺失的是德鲁伊仪式中祭品的角色。从历史上看，德鲁伊祭献了一切：公牛、狗、鹿、奴隶、罪犯、黄金、白银——他们焚烧、溺水、勒死或检查其内脏。德鲁伊会从背后刺人，并根据他们死时的抽动情况来预测未来。他们迷信弑君，利用传说中由勒死、溺水和长矛刺杀组成的“三重死亡”。如果凯撒的记载可信的话，他们会将装满人的巨大柳条巨像塞进去，并将其焚烧祭祀。


  德鲁伊可以被归类为中立阵营，因为德鲁伊处于道德的两侧。凯尔特故事充满了关于德鲁伊处于双方的描述，他们抵消彼此的咒语，并在令任何角色玩家羡慕的奇幻魔法战斗中作战。但将德鲁伊的阵营定为“绝对中立”简单并不准确；德鲁伊对某种伦理的热情并不比其他人少。


  ### 僧侣


  在龙与地下城中，僧侣是“教派的成员”，他们“在宗教氛围中寻求生理和精神的优越”（Arneson 1975:1）。僧侣之路最初是对牧师开放的，他们对身心都有完全的控制；他们对精神力量免疫，可以模拟死亡，并使用一种名为“震颤掌”（quivering
  palm）的恐怖攻击，仅需触碰即可杀死对手。


  “僧侣”一词源于后期希腊语 `monachos`，意思是孤独的人或隐士。这反又源于希腊语单词 `monos`，意思是“孤独”。它进入拉丁语变为 `monachus`，进入古英语变为
  `munuc`，然后进入英语变为 monk。因此，僧侣独居生活（Ayto 1990:353）。


  僧侣首次出现在补充书籍《人类与魔法》中。拥有正确属性组合的牧师可以成为僧侣——这暗示了僧侣职业的召唤。僧侣是苦行者，限制了对财宝和物品的获取。作为回报，他们可以用赤手击晕对手，模拟死亡，仅靠力量就能自愈，并抵御精神入侵。僧侣力量的巅峰是震颤掌（Arneson
  1975:1）。


  在《东方冒险》的第一版中，Gygax 解释说，布莱恩·布鲁受到虚构武术“辛纳苏”（Sinanju，由《毁灭者》系列小说流行）的启发创造了僧侣职业。辛纳苏赋予了其修行者近乎奇幻的能力，包括爬墙、躲避子弹、跑过汽车等等（Gygax
  1986）。所有这些力量在僧侣职业中都有强烈体现，然而僧侣是少数几个在西方传说中没有根基的职业之一。十字军骑士遇到过刺杀者，但僧侣是一个特别的东方现象。结果，僧侣的根源有时会被混淆，导致一组铅制模型竟然是方济会式的僧侣摆出武术的姿态。


  ### 圣骑士


  圣骑士首次在补充书籍《格瑞霍克》中被引入龙与地下城（Gygax and Kuntz 1976:4）。守序阵营的战士从一开始就可以成为圣骑士，且魅力值至少为 17，这使得圣骑士定位为模范领袖。他们的守序忠诚比其他职业严格得多，圣骑士可以“手疗”（lay
  on hands）来治愈伤口或疾病，抵抗疾病和邪恶魔法，挥舞圣剑并获得一匹忠诚的战马。作为交换，圣骑士被不允许拥有超过四个魔法物品（武器和盔除外），并将财宝捐给慈善或宗教机构。牧师更像是一个治疗者而非战士，而圣骑士则更像是一个战士而非治疗者。


  “Paladin”一词派源于 `palatinus`，在拉丁语中意思是“宫廷的”，因此指宫廷官员。从那以后它变成了意大利语 `paladino`，接着变成法语
  `paladin`，意为战士。该词最终指代在查理曼侍侍的十二骑士之一（Aeon 2002）。


  圣骑士与神性的联系源于天主教教会中的头衔 `judices palatine`（教皇法院法官），以及十二位圣骑士与十二门徒的联系。还有圣殿骑士团和医院骑士，这些是由教会授予参加十字军东征并保护朝圣者的骑士组织。


  圣骑士与圣剑的联系可能源于查理曼的剑杜兰达（Durandal）。但在创造圣骑士原型方面，影响力最大的来源无疑是波尔·安德森的小说《三心三狮》。在书中，霍尔格·卡尔森被投入到一个平行宇宙，在那里变成了一个圣骑士，拥有一匹名为帕皮隆的魔法战马和治疗能力（Anderson
  1961）。


  ![[graphic]](data/content-0023.png)






  在《地下城与龙》创造的所有产物中，“等级”（level）一词可能引起了最严重的困惑。《高级地下城与龙玩家手册》中对“等级”一词给出了不少于四种定义（1978:8）：作为玩家角色实力的指示、作为地下城深度的描述符、作为法术威力的衡量（这与玩家角色等级并不直接相关），以及作为怪物潜在威胁的指标。在所有这些术语中，只有两个在奇幻游戏中被保留了下来：玩家角色和法术威力。怪物等级不再与玩家等级区分来。“地下城等级”一词之所以被废弃，主要是因为奇幻世界已经远远超出了地下城，因此对于大多数奇幻游戏环境来说不再是一个有意义的描述符。


  盖益克斯（Gygax）解释说，他最初想将角色等级称为“阶级”（rank），将法术复杂度称为“威力”（power），将怪物强度称为“秩序”（order），但“由于现有的用法”，等级的四种含义全部被保留了。看来玩家们已经在独立于创作者的情况下，塑造着游戏的语言（1978:8）。


  《地下城与龙》凭借其等级和挑战等级，其结构设计明确是为了为角色提供战斗的机会。地下城层中充满了与较低等级相适应的生物，因为它们是先被遇到的。地下城越深，对手就越强大。同样，魔法物品和其他贵宝的奖励也取决于怪物的困难程度。万物皆有其位，怪物或挑战越困难，奖励越丰厚。


  在《战略评论》（*Strategic Review*）中，盖益克斯批评了让角色升级过快或等级过高的地下城主。他认为应该需要五年才能达到二十级。在游戏进行年后，他的灰色要克（Greyhawk）战役中没有一个角色的等级超过十四级（1976:23）。升级速度在游戏的后期版本中发生了变化，无论等级范围（最高
  30 级）还是升级速度都是如此的。


  盖益克斯将职业和等级的多样性称为《地下城与龙》“唯一显而见的缺点”，以至于参与者忘记了为什么存在这种多样性。等级被明确地与个人力量挂钩，而不是社会地位或社区中的声望。在盖益克斯看来，玩家角色的最终结果是永恒的冒险，或者是退休成为地下城主的工具——非玩家角色（1987:29）。第四版直接面对这个问题，将冒险等级分为不同的阶层。这些阶层包括英雄级（heroic）、化范级（paragon）和史诗级（epic）。


  ### 英雄级（The Heroic Tier）

  英雄级是传统《地下城与龙》中建立的冒险等级，而这又继承自《指环王》和康南式的粗犷通俗小说冒险。这种冒险形式从第一级到第十级，遵循相对平庸的奇幻：地下城和类人敌人，这里的魔法稀有且致命。


  ### 化范级（Paragon Tier）

  化范级涵盖第十一级到二十级。化范者处于甘道夫的水平，直接对抗巴洛魔等位面威胁。他们去大多数凡人做梦都不敢想的地方，包括凡人不被允许进入的领域。


  ### 史诗级（Epic Tier）

  史诗级从二十一级到三十级，踏着神神的脚步。这些是足以撼动神灵的等级，第三版中曾暗示过但从未整合进核心规则中。更重要的是，角色有一个明确的终点，这是《地下城与龙》在其高级基础规则集中才唯一明确定义的。在
  CRPG、MUD 和 MMORPG 中，等级会飙到荒谬的高度，远超 100 级。


  ## 结论

  约翰·泰斯（John Tynes）将《地下城与龙》视为英雄叙事和创造虚构权力结构的工具。他认为这款桌面游戏由于其不可否认的逃避本质而注定变得无关。泰斯提出，如果角色扮演不仅仅是小游戏和浅薄的娱乐，那么就需要一种“参与式”（engagist）的方法。参与式作品拥抱现代世界，并将其作为探索现实问题的机会（Tynes
  2007:222）。


  但存在希望。由于《指环王》和《地下城与龙》，现代文化中产生了一种奇幻速记符号，使得即使非玩家也知道矮人住在地下，精灵长着尖耳朵，巫师会施展法术。如果角色扮演游戏并不热衷于挖掘现实来证明政治观点，未来可能在于其他的奇幻游戏媒介。


  当盖益克斯被问及是否讨厌其他游戏媒介中的《地下城与龙》克隆作品时，他说他感到受宠若惊。盖益克斯在游戏大师》（*Master of the Game*）（1989:155）中说：“事实上，我唯一遗憾的是开发不够充分……对角色扮演中想象、创造和社交方面的接触越多，参与该领域的就越多，从而未来会有更好的前景。”


  # 第四部分：回帖制（Play-By-Post）与基于浏览器的游戏

  人们长期以来邮寄下棋，而且人们（特别是约翰·博德曼 John Boardman）在我 1970 年开始之前就在运行 PBM 版的《外交外交》（Diplomacy）并收取费用。但我喜欢使用“我们创造了邮件游戏行业”这一口号（强调“行业”一词），因为我是第一个将此作为唯一工作全职从事的人。我绝对是第一个为了运行游戏而专门买了自己的台电脑的人！[Loomis
  2009]。


  ## 引言

  游戏一直有一种社交元素，将志同道合的玩家联系在一起，因此随着通信渠道的扩大，游戏也随之发展是自然的。追溯到国际象棋，玩家们通过邮寄进行游戏。随着技术的进步，回帖制游戏也演进，从邮寄演变为电子邮件，从电子邮件演变为网页，从网页演变为持久的基于浏览器的游戏（`PBBGs`）。


  特别感兴趣的是超越了典型双人模式、涵盖更大群体的邮件游戏。这些基于浏览器的游戏是大规模、基于网络且公开的，符合沃伦·萨克（Warren Sack）对大规模对话（`VLSC`）的定义（2004:239）。


  任何粉丝社区的吸引力在于利用共同的语言和兴趣来创造新的、有趣的故事。任何类型的角色扮演游戏都促进了这种共享叙事。互联网让社交角色扮演变得更容易获得。既然你可以接触到数百万志同道合的人，为什么要费尽力寻找一个对小众爱好感兴趣的玩家呢？


  利用这数百万人的挑战在于让游戏具有相关性。研究人员认为，人类的大脑构造并不适合追踪超过 150 个关系或个人，而邓巴数（正如马尔科·格拉德威尔在 Malcolm
  Gladwell 的《临界点》中广为人知的）是人可以维持的稳定社会关系的理论极限。游戏需要如此相互关联的协议、谈判和合作，可能会让这个数字变得更小。考虑到这 150
  包含了所有的关系，包括不玩同一个游戏的家人、朋友和同事，网络会缩小得更小（Vesna 2004:259）。


  MMORPG 的吸引力很大在于其社交网络。持久基于浏览器的游戏（`PBBGs`）剥离了 MMORPG 的图形和交互环境，专门专注于社交方面。`PBBGs`完全围绕社交网络，鼓励金字塔型结构的形成。现有玩家将新玩家引入他们的网络，新玩家又招募更多玩家，所有人受益。玩家人数越多，所有角色就变得越强大。





  PBBGs（基于回合的多人游戏）的准入门槛非常低，并且兼容多种网页浏览器。与 MUDs 和 MMORPGs 不同，它们没有即时感；PBBGs 依赖异步通信来提供游戏体验。这些游戏旨在让玩家在一天中多次访问，玩家在简短的时间内累积积分并执行操作。


  ### 历史


  最早的异步多人游戏起源于信函游戏（play-by-mail games）。玩家通过邮寄将决定或回合发送给对手，对手再回信。只要人类还在寄送信息和下棋，这种游戏形式就一直存在。值得注意的是，约翰·博德曼（John
  Boardman）在 1970 年之前就开始收取费用运行《外交》（`Diplomacy`）信函游戏了。


  Flying Buffalo Games 的创始人里克·卢米斯（Rick Loomis）在 1970 年凭借一款名为《核毁灭》（`Nuclear Destruction`）的信函游戏引领了异步游戏的潮流。他通过
  Avalon Hill 出版的《Wargamer》杂志联系战争游戏玩家，并每回合收取十分美分。1972 年，Flying Buffalo 公司正式成立，以利用信函游戏格式向电子邮件过渡的趋势（Loomis
  2009）。Flying Buffalo 的《地牢与巨魔》（`Tunnels & Trolls`）曾作为名为《英雄幻想》（`Heroic Fantasy`）的信函游戏讨论过，后来在名为
  `TheSource` 的商业网络上数字化（Barton 2008:41），随后变为《哈赞的十字军军》（`Crusaders of Khazan`）。


  BBS 门游戏是电子邮件游戏的直接后代。像 MUD 一样，它们运行在通过调制解调器或公告板系统（BBS）连接的计算机上。其他玩家拨入 `BBS` 进行实时连接，这通常会让拨号方承担高昂的电话费。随着计时器的作答，主机必须尽可能挤入尽可能多的内容。BBS
  门游戏是吸引这些玩家的手段之一。与互动小说类似，它们主要是单人文字游戏。奇幻版本，如塞斯·罗宾逊（Seth Robinson）的《红龙传说》（`Legend of
  the Red Dragon`）相对简单——杀死怪物、收集宝藏和经验，然后重复这一过程，直到你的角色强大到足以杀死巨龙（Barton 2008:268）。


  随着互联网和网页的出现，回帖式 RPG 转向了论坛。回帖的参与人数从两名玩家到几十名不等。角色扮演论坛主要是无自由形式的，规则较少，使用传统的奇幻游戏统计数据来管理冲突和挑战（Hinkley
  2010:7）。


  最近，持久性的 PBBGs 主导了异步游戏媒介。这些游戏在社交网络上蓬勃发展。《地下与地下城》（`Dungeons &Dragons`）第四版通过 PBBG《地下与地下城：小小冒险》（`Dungeons
  & Dragons Tiny Adventures`）在社交媒体上活跃。


  ## 友谊


  PBBGs 中的友谊感很强，每个游戏都采取不同的方式吸引更大的群体。最流行的 PBBGs 运行在 `Twitter` 或 `Facebook` 等社交媒体上。


  在 PBBGs 中，战斗中的优劣势取决于玩家拥有的“粉丝”数量。这些粉丝是与玩家参与同一 PBBG 的社交媒体朋友。“粉丝”也可以被称为队伍、氏族或军队。每个玩家都可以向另一个潜在玩家发送邀请。如果她接受了，就成了他氏族或小组的一员。如果她反过来邀请其他人加入，更大的群体就连接在一起了。邀请更多社交玩家的玩家会迅速扩大其权力基础。他们也有助于对阵竞争玩家的战斗。在
  PBBGs 中，数量很重要。


  还有持续的礼物交换，这有助于增强群体凝聚力。玩家可以分享从加成、属性到完成任务所需的物品的各种礼物。当玩家角色执行任务时，他所有的同事都能实时受益。然而，玩家粉丝的成员必须在特定的时间限制内登录游戏才能接收这种奖励。


  在执行任务或进行战斗时，可以征召粉丝协助。部分冲突是自动处理的（例如，战斗可能会随机决定另一位同事是否加入），而其他请求可以是特定的。玩家可以在同事成员的社交网络页面上发帖，请求其同事协助。与其他
  PBBGs 不同，《Tiny Adventures` 将盟友之间的互动限制在治疗和技能增强上。


  玩家还鼓励经常在自己的社交媒体网络上发布他们在 PBBG 中成就的更新。某些帖子允许玩家通过点击链接返回游戏来获益，从而重新吸引玩家。另一些帖子仅仅是为了炫耀。


  ### 叙事


  与计算机角色扮演游戏（CRPGs）一样，PBBGs 从根本上是一种孤独的体验。角色生活在一个暴力的世界里，杀死怪物和竞争性玩家角色。角色通过任务来实现里程碑，这些里程碑通过文字和图形描述——但内容在很大程度上无关。重要的是任务进度以进度条或完成百分比的形式展示。每个任务可能需要某些物品或成就，这反过来又为完成任务提供奖励（通常是经验值或金币）。每个任务也有自己的成就等级，通常为三一组，随后任务即完成，奖励等级也随之降低，鼓励玩家转向下一个任务。


  `Tiny Adventures` 完善了 PBBGs 的任务循环。每个任务都需要一定的时间才能完成，每隔几分钟发布一个新章节。玩家影响任务的能力有限，需根据特定条件从两种药水中选择使用一种。


  PBBGs 还平衡了即时结果与近未来奖励的激励。当玩家角色的生命值、耐力和能量充满时，他可以进行战斗和执行任务，结果会立即显示。然而，这三个统计数据在耗尽后会缓慢恢复，并以分钟为单位衡量。这种机制防止了玩家一次性体验游戏的所有内容。此外，内容随主题变化，根据开发者的意愿而改变。游戏具有足够的灵活性可以轻松调整，包括在某些情况下才提供的限时物品。


  PBBGs 中几乎没有叙事弧的证据。尽管它们本质上是社交的，但 PBBGs 是层金字塔，权力来自于人气。多数击败少数，使得拥有大型网络的活跃玩家几乎不可战胜。然而，像某些
  MUDs 和大型多人游戏一样，玩家可以通过信用卡购买提供优势的道具来字面上的登顶。


  ### 个性化


  不同 PBBGs 中的玩家角色有各种规则系统，但其核心统计数据相似。大多数角色都有攻击和防御统计数据，与怪物或竞争角色的相应攻击和防御对比。物品、法术和其他情况也会增加攻击和防御数值。


  与桌面角色扮演游戏类似，大多数 PPBGs 拥有功能相同的生命值，只是失去生命值只会阻止角色发起进一步战斗。死亡不是永久的。能量决定了角色执行任务的频率。耐力调节了角色在战斗中可以采取的操作数量。这三项数据都会随时间缓慢恢复。


  每个玩家都有一个头像。有些代表一个角色，而另一些代表多个角色。这些头像通常对游戏没有实际影响，尽管某些 PBBGs 允许角色对彼此的头像进行评分，并可能因此获得小收益。


  每个 PBBG 都有自己的货币形式。在《城堡时代》中，各种类建筑结构花费资金，反过来又产生更多钱。通过这种方式，《城堡时代》类似于《智牌牌》，后者使用土地来产生法力（Aetrox
  2010）。




  PBBG（基于浏览器的大型游戏）中的战斗通常是定局。每位玩家都会通过魔法物品、法术、神的祝福、命运的捉弄或角色自身的技能来积累攻击和防御加成。当与另一玩家发起战斗时，所有这些变量会被汇总并比较，并将攻击和防御相加。然而，玩家并不选择战斗中使用哪些防御元素。相反，发挥作用的强大技能数量取决于玩家追随者的数量。


  问题不在于一方胜负，而在于胜者会赢多少。战斗中的不确定性并非来自随机数生成，而是来自无知，因为 PBBG 主要依靠统计比较来裁定战斗。在这方面，PBBG 与使用力量比较系统解决冲突的多用户共享幻境（MUSHes）以及真人角色扮演（LARPs）有很多共同之处。大胜通常会为玩家角色带来经验以及可能的奖励（如宝藏）。作为交换，玩家会失去体力和生命值。


  理论上，玩家角色可能会在战斗中死亡。与 MMORPG 类似，PBBG 中的死亡最坏情况下只是微小的不便。当生命值降低到足够程度时，角色在没有治疗的情况下将无法战斗。治疗随时间推移，但也可以购买（治疗药水、治疗师的服务或其他手段）。游戏对这些购买的治疗次数有限制，防止角色立即返回战斗。


  在玩家没有活跃玩游戏时，玩家角色之间可能会互相杀死。我曾多次在回到《城堡时代》（Castle Age）时，发现我的角色已经去世了。由于死亡并不可致命，这并不会严重阻碍玩家玩游戏的能力。


  ## 角色

  基于浏览器的游戏有一套有趣的角色设定。存在一种编码权威，我们将在 CRPG 章节中介绍。PBBG 的社交媒体属性显著改变了玩家角色的本质。


  ## 玩家

  在《城堡时代》中，冒险小队被称为“精锐卫队”。精锐卫队可以提高战斗能力并为冒险提供帮助。职业角色根据玩家召唤精锐卫的加入顺序进行 24 小时的分配。精锐卫成员越多，获得任务影响的速度就越快。


  所有标准的幻想职业都是精锐卫队可能的角色，每个职业都为整个小组提供不同的加成。战士、法师和大法师提供攻击加成。牧师、守护者、大祭司、角斗士和圣骑士提供防御加成。盗贼、流氓提供任务和战斗金币的加成。


  《微型冒险》（Tiny Adventures）拥有具有预设属性、种族和职业组合的化身。它包含了《地下与城》中的标准职业（`cleric`、`fighter`、`rogue`、`wizard`）以及从复仇者到萨满等许多其他职业。`swordmage`、`warden`、`invoker`
  和 `avenger` 只有在经过若干“代数”后可用——玩家必须一直玩直到角色达到特定等级，让其退休，然后重新开始。角色的自定义非常有限，主要区别在于他们可以使用的属性和装备。施法类职业只有在达到一定代数后才能解锁法术，这与他们的桌面版
  RPG 对应品不同。


  ### 状态

  与《地下与城》及其同类似，任务和战斗会为玩家角色带来经验。通过积累经验，角色会升级。等级提升提供属性加成，玩家可以以有限的方式进行分配。它们还会立即将玩家的所有点恢复到满，包括能量、体力和生命值。在较高等级时，这是角色快速恢复满状态的唯一方法；否则，玩家需要等待更长时间让各项属性恢复到最大值。


  《微型冒险》允许角色达到 10 级，随后他们会退休。每个退休的角色都构成一代，随后的游戏将为下一个角色带来收益并开启新的角色选项。这鼓励了重复游戏。


  角色的等级对所有人可见，这对于玩家战（PvP）战斗至关重要。当玩家寻找对手时，程序会为玩家提供一份合适的挑战者列表。所谓的合适是角色等级和追随者数量的结合。拥有许多追随者的低级角色可以压制追随者较少的高级角色。玩家可能攻击的目标是随机的，确保每个游戏阶段都会出现不同能力的敌人。然而，有一个因素会鼓励“垃圾话”（trash
  talk）。当一个玩家杀死另一个角色时，某些游戏会询问玩家是否想要吹耀他的击杀绩。


  为了遏制玩家杀手（PK）系统的滥用，某些 PBBG 还实施了“黑名单”。通过对某个角色发布悬赏，你实际上是在付钱让另一个角色受到攻击。其他角色通过攻击身上有悬赏的角色获得积分（或金币）。理论上，更强大的玩家因为担心悬赏而避免猎捕弱者。然而，该系统对影响玩家杀手的效果可能不大。就像其他大型多人游戏中的目标导向型玩家一样，那些喜欢杀死他人的人是无畏的——否则他们不会攻击完全陌生的人。


  在玩《城堡时代》一段时间后，我知道了什么样的等级和追随者组合是容易的目标。因为 PBBG 既关乎游戏的便利性，也关乎即时结果的满足，我会尽可能地攻击多的对手，而不顾他们的状况。事实上，我攻击得如此快，往往没有注意到我的敌人已经“死亡”。换句话说，战斗的非人性化使得在对手中中大肆破坏变得简单。赏金猎人甚至没有进入考虑范围。


  ## 结论

  PBBG 是回帖制（play-by-post）演变的下一步，借鉴了 MMORPG 和交互式小说的传统。当 CRPG 在无止境地追求更快的处理器和更先进的图形时，PBBG
  拥有简单静态的画面。当 MMORPG 构建极其复杂的世界时，PBBG 创建了易访问且叙事极少的世界。像大型多人游戏一样，PBBG 拥抱大型社交群体的力量。在《城堡时代》中，你的朋友字面上面上是你力量的来源。


  另一方面，《微型冒险》是一项活动，偶尔有其他玩家提供帮助的机会。讽刺的是，这种将社交群体与幻想角色扮演密不可分的桌桌游戏，其在 Facebook 上的应用几乎没有任何社交互动。


  《微型冒险》和《城堡时代》的困难并非独有。PBBG 既是艺术也是科学。正如运行时间最长的《龙珠战士》BBG 之一的创建者 Alexander Hinkley 所解释的：


  ```

  由于 PBBG 的性质，它们很容易创建，但很难维护和平衡。任何人都可以创建一个网站或论坛，并描述一个独特的幻想世界来吸引玩家注册，但要创建像战斗系统这样平衡良好的游戏机制是非常困难的。尽管创建一个
  PBBG 对某些人来说可能看起来很容易，但实际上花费了大量的时间、心水和奉献 [Hinkley 2011]。

  ```


  PBBG 表面上看似简单，但对于下一代幻想游戏可以教我们很多东西。对于 PBBG，热门的新趋势可能不是更好的画面或更多的玩家，而可能仅仅是便利性问题。





  交互式小说（IF）的起源于超文本，在超文本中，玩家阅读文字然后会被多个选项来继续剧情。每个链接将玩家带到另一个章节，而该章节又有自己的路径，从而形成了一个网状叙事。尽管“超文本”一词现在已与万维网密不可分，但事实并非总是如此——超文本早于互联网（Costikyan
  2007:7）。


  游戏书（Gamebooks）是超文本小说的早期形式，为单人游戏奠定了基础，这后来在计算机角色扮演游戏（CRPG）中得到了探索。游戏书通常以第二人称编写。在游戏书中，互动是单向的，玩家决定互动的速度但不能决定实际的结果。当玩家做出影响叙事进程的选择时，他便沿着了一条分支路径，每一个决定都通过使用页码进一步改变了故事。危险的结果往往隐藏在错误决定的末尾，导致故事结束（2007:7）。


  游戏书有三种不同的类型。第一种是叙事格式，决策由玩家翻到合适的页面决定，进入故事的下一个分支。第二种是以《奇幻战斗》（Fighting Fantasy）系列为代表的，涉及类似于桌面角色扮演游戏的简单规则来解决冲突。第三种实际上是一种角色扮演游戏的变体，在没有游戏主（Game
  Master）的情况下进行，涉及一套独立的规则，游戏书充当冒险指南。


  交互式小说也被称为冒险游戏，代表了通过计算机进行的更具面向对象的超文本形式。交互式小说具有某种程度的持久性和空间感。玩家可以在房间之间移动、捡起物品，甚至永久地改变游戏宇宙，这是以前的超文本小说无法做到的（2007:8）。


  “交互式小说”一词由罗伯特·拉福（Robert Lafore）首次创造，他为 TSR-80 编写了 BASIC 程序（Montfort 2003:125）。后来，信息时代公司（Infocom）广泛使用该词来指代其经典作品（2003:7）。交互式小说更强调谜题破解，优先演绎和定性思维而非归纳和定量推理（Barton
  2008:6）。


  珍特·穆瑞（Janet Murray）在《从游戏故事到网络戏剧》（*From Game Story to Cyberdrama*，2004:4）中使用了“网络戏剧”（cyberdrama）一词，以说明线性剧情如何在计算机媒介上演变，以适应竞赛和谜题的多种方法。埃斯芬·阿塞斯（Espen
  Aarseth）创造了一个对游戏书和交互式小说可能更具局限性的标题，即“遍历性文学”（ergodic literature），他将其定义为动态文本，读者必须执行特定动作来生成一个每次阅读都可能变化的序列。


  交互式小说最终迈向图形化，但结果不尽人。尽管取得了一些显著成就，但基于文本的媒介的灵活性在很大程度上主导了 IF 领域。令人记忆的例外是《龙穴》（Dragon’s
  Lair），这是一款图形超文本街机游戏，其特色是唐·布鲁斯（Don Bluth）的动画通过摇杆的精确移动来控制。当屏幕上出现某些提示时，玩家引导主角勇敢的迪克（Dirk
  the Daring）。事件总是预设的。迪克是否会因为玩家的操作而生存或死亡没有任何不确定性，只有玩家是否能足够快地根据游戏的提示选择正确的路径。因此，《龙穴》看起来比玩起来要刺激得多（Costikyan
  2007:8）。


  《龙穴》线性的游戏风格是针对 IF 游戏的常见投诉。尽管有完全自由的幻象，但角色实际上受到解析器（parser）的限制。玩家可能会考虑各种解决方案，但只有被解析器过滤器确定的才是可能的选择（Barton
  2008:27）。


  ### 历史


  IF 的前身可以在“文学机器”（literary machines）中找到，这些工具可以以非线性的方式创建文本。这类文学机器的最早例子被用于占卜，《易经》就是一个例子（Montfort
  2003:66）。在西方文化中，炼金术士拉蒙·鲁尔（Ramon Lull）创造了一种产生三字母组合的物理文本生成机器。在历史的大部分里，文学机器很大程度上限于宗教目的，直到
  20 世纪初艺术家们接过了这一接班。


  1958 年，非虚构教程系列 TutorText 的第一卷《计算机算术》（*The Arithmetic of Computers*）印刷（Douglass 2007:134）。1961
  年，马克·萨波塔（Marc Saporta）出版了《1 号作品》（*Composition No.* 1）。这实际上是一个包含 150 页散页的盒子，旨在被打乱并按任何顺序阅读。文本暗示了足够的内容让读者填充空白，从而构建出一个故事。类似的打乱故事在
  1999 年由埃里克·齐默曼（Eric Zimmerman）和南西·诺瓦切克（Nancy Nowacek）创作了《花园中的生活》（*Life in the Garden*）（Zimmerman
  2007:81）。


  胡利奥·科尔塔萨尔（Julio Cortazar）在 1964 年的《游戏》（*Rayuela*）使用了游戏书格式。法国人雷蒙·奎诺肖（Raymond Queneau）发明了几个装置，最著名的是
  1967 年的《随心故事》（*A Story As You Like It*）。Corgi 出版社在 20 世纪 70 年代初英国延续了《追踪者》（Trackers）系列的传统。


  美国读者最熟悉的变体可能是《选择自己的冒险》（Choose Your Own Adventure）系列。该系列由爱德华·帕纳克（Edward Packard）于
  1979 年凭借《时间之洞》（*The Cave of Time*）引入，这是该系列的第一部作品。1985 年，Bantam Software 将其转化为图形冒险游戏（Montfort
  2003:71）。


  计算机角色扮演游戏开发的“黑暗时代”（包括 IF 游戏的激增）始于 20 世纪 70 年代初。马特·巴顿（Matt Barton 2008:28）之所以如此命名，是因为许多游戏都遗失在历史中。


  《猎姆普斯》（Hunt the Wumpus）由格雷高里·约布（Gregory Yob）于 1972 年编写，建立了一个迷宫般的幻想游戏，射手在寻找神秘的姆普斯。该游戏在几个方面都值得注意。它是一个基于地图的游戏，使用了三维空间——一个十二面体，这恰好是《地下与城》中十二骰的维度。


  随后的 IF 作品恰如其地命名为 `DND`（Glenday 2008:166）。它是由盖里·威森亨特（Gary Whisenhunt）和雷·伍德（Ray Wood）使用
  `TUTOR` 语言为 PLATO 系统编写的（Glenday 2008:156）。`DND` 创建于 1974 年，是 PLATO 上第三个此类地下游戏。它包含了自定义角色、经验值和升级、通用商店（Barton
  2008:32）。


  它的第一个继者是鲁迪·鲁瑟福（Rusty Rutherford）的 `Pedit5`。它命名如此晦涩是为了防止被删除，因为这种游戏在鲁瑟福所在的学校是不受欢迎的。与
  `Pedit5` 类似，唐·达洛（Don Daglow，《冬夜之城》之父）为 PDP-10 主机创建了 `DNGEON`。达洛的游戏允许组队、获得经验值和升级（Archer
  2004:86）。





  1975 年，在位于马萨诸塞州剑桥的 Bolt, Beranek and Newman 公司工作的 Crowther，在一台 `DEC PDP-10` 计算机上创建了
  `Adventure`（最初名为 `ADVENT`，因为文件名只能有六个字符）。它受《地下与城》的启发，是第一种在线互动式冒险游戏（IF）。作为一名资洞穴专家，Crowther
  根据他在弗林猛犸洞（Flint Mammoth Cave）系统的经历创作了 `ADVENT`。1976 年，Don Woods 在斯坦福大学的人工智能实验室（`SAIL`）扩展了这款游戏。Woods
  的版本灵感源自托尔尔金，并包含了巨魔和精灵（2003:10）。


  或许更有趣的是 `Adventure` 是如何模拟《地下与城》的，它强调了创造性解决问题的机会，并提供了可以克服的挑战。尽管通过解析器只有一种输入方式，但 `Adventure`
  被构想为一种合作性游戏；Crowther 是为他的两个女儿编写了它，而他与 Woods 的合作正是游戏发展的关键。与《地下与城》不同，`Adventure` 不计分（2003:89）。


  `Zork` 随后的 1977 年出现，并在 ARPANET 上变得极其流行。`Zork` `FORTRAN` 版本的原始传单明确指出，其灵感源自 `Adventure`
  和《地下与城》。当 `Zork` 被更名为 `Dungeon` 时，文本被改为“奇幻与科幻冒险的悠久传统”（2003:100）。大约在此时，Lebling、Marc
  Blank、Tim Anderson 和 Bruce Daniels 开始制作 `Zork`。他们成立了一家名为 `Infocom` 的公司。


  值得注意的是，`Zork` 的灵感来自麻省理工学院（MIT）的一种名为 `Institute Exploring` 或 `Tunnel Tours` 的实景角色扮演。深夜，学生会访问校园内一些偏僻的地下（2003:100）。


  Jon Thackray 和 David Seal 在 1978 年创建了一个名为 `Acheton` 的游戏，拥有超过 400 个地点。它也极其困难，有游走的怪物和许多迷宫（2003:115）。


  我与游戏书的接触是通过 1982 年由 TSR 出版的 `Endless Quest` 系列完成的。从 `Dungeon of Dread` 开始，这些书籍提供了完整的角色和既定的设定，这些都是
  TSR RPG 世界的一部分。《地下与城》、`Top Secret`、``Gamma World` 和 `Star Frontiers` 都通过 `Endless
  Quest` 系列引入。作为一名青少年，我对角色扮演游戏的看法是由这些书籍塑造的。


  `Return to Brookmere` 对我的第一场 `Basic Dungeons & Dragons` 战役产生了重大影响。`Return to Brookmere`
  最值得关注的是一个名为 `Mouth of Mimulus` 的会说话的龙坠。这个会说话的护身符是一个机械天神（deus ex machina），允许作者提供关于如何继续的提示。我在自己的几次《地下与城》游戏中使用过
  `Mimulus` 来帮助玩家保持在正确的轨道上（Estes 1982）。


  游戏书演进的下一步是 Steve Jackson 的 `Fighting Fantasy` 系列，它遵循传统的游戏书格式，但增加了一个战斗系统。玩家完全裁决战斗，为自己的角色以及对手掷骰子，这意味着几乎没有什么能阻止他作弊。但话又回来，你也可以在更传统的游戏书中作弊，通过翻到某页而不是做出正确的决定来到达游戏中的该点。


  1984 年，`Fighting Fantasy` 游戏书以电子格式发布在 `Commodore 64` 和 `ZX Spectrum` 上。1984 年至 1987
  年间出版了六本游戏书。大多数是直接的改编。随后的游戏提供了带有图形插图的解析器（Barton 2008:92）。


  `Fighting Fantasy` 游戏书系列的第一部是 `The Warlock of Firetop Mountain`，于 1982 年出版。由 Jackson
  和 Ian Livingstone 编写，Russ Nicholson 插图，他那富有感染力的黑白画作填充了最初的 `Advanced Dungeons & Dragons`
  `Fiend Folio` 和 `Warhammer Fantasy Roleplay`。《The Warlock of Firetop Mountain` 在几周内就售光了印数。它最终在全球范围内销售了超过百万份。


  我怀怀地记得 `The Warlock of Firetop Mountain`。对于日益陈旧的游戏书格式来说，它是一股清风，因为角色可以与之搏斗，从而为决策过程增加了偶然因素。作为一个重要的脚注，这些书自豪地宣布它们与《地下与城》兼容，这意味着它们对于单人玩家来说，是一个“独玩”其角色的绝佳手段，让他能够独立于游戏小组进行推进（Jackson
  1982）。


  在许多奇幻游戏中成为我名字来源的角色源自一本游戏书。`Talien` 出现在 `Swordquest` 冒险书之一的 `Quest for the Unicorn’s
  Horn` 中。任务涉及一个名为 `Talien` 的年轻 Kuven。`Talien` 在父亲被食魔人杀早死后获得了他的地位，他很快发现权力并没有让他的生活变得更轻松（Fawcett
  1985）。


  游戏书技术通过 Steve Jackson 的电话奇幻互动剧本系统（`FIST`）继续进步。这本质上是一本带有音频的 `Fighting Fantasy` 游戏书；玩家通过电话控制他们的角色。在每个关头，玩家会按一个按钮来决定动作和战斗。专业演员和真实的音效给出结果，角色会被保存，以便玩家可以从离开的地方继续。


  最终，游戏书在 20 世纪 90 年代被视频游戏取代。`Fighting Fantasy` 系列以第 50 本 `Return to Firetop Mountain`
  结束，但它的成功引发了对 `Fighting Fantasy` 背景的需求。结果是又出版了九本，以 1995 年的 `Curse of the Mummy` 结束。


  2002 年，`Wizard Books` 买下了 `Fighting Fantasy` 的权利并重新出版了许多书籍，并进行了一些调整。2005 年，`Wizard`
  发布了 `Eye of the Dragon`，2006 年又制作了两本。


  ## 伙伴关系


  游戏书并没有提供真正的团队，因为通常只有一个玩家。后来的版本允许团队成员和盟友，例如单人冒险游戏书，其中包含了玩家从一开始拥有或在冒险过程中获得的随从。通常来说，扮演角色是一项单人活动，这有助于读者更加沉浸并控制事件的发生。


  Nick Montfort 在个人采访中解释说，尽管互动小说中可能只有一个控制的角色，但人们可以通过共享同一个将会话一起玩、在电脑屏幕前一起玩，或者通过论坛和新闻组、电话或电子邮件与网络进行交流。本质上，玩
  IF 游戏的人可能在游戏上是孤单的，但他们并不孤独（Montfort 2010）。


  ### 叙事


  Gygax 将游戏书定性为“角色假设”而非角色扮演游戏。根据他的定义，角色假设游戏提供的身份是不独特的，而且情况是预设的。选择是有限的，游戏过程是有引导的。他认为角色假设是角色扮演游戏的良好训练，但是另一种不同且较低的游戏形式（1987:85）。


  游戏书在奇幻游戏演进中的贡献是关注的，因为它们实现了从《魔环王》之类的叙事故事到 IF 的过渡。游戏书的故事很大程度上仍由作者引导，规则相对简单，但它为玩家与奇幻世界的互动奠定了框架，无论这种形式如何。





  由于百科全书设计的局限性，增加交互性的唯一方法是编写大量的内容。在游戏书籍（gamebook）格式中，由于书籍明显的物理限制，这在很大程度上是不切行的。在互动小说（IF）中，这一障碍较小，但由于游戏开发的限制，它仍然不是实行的替代方案。折中方案是将玩家的选择限制在明显的路径上，既是为了规避叙事风险，也是为了以逻辑的方式吸引玩家，从而创造代理感（Mateas
  & Stern 2007:188）。这些叙事往往像谜题，玩家在其中“破解”游戏创造者设定的最佳路径。


  ### 个性化


  与后来的计算机角色扮演游戏（CRPGs）一样，游戏书籍中的角色非常有限。《战斗幻想》（Fighting Fantasy）游戏书籍只有三个属性：技能、体力和运气。这套系统在后来被规范化并扩展，形成了一套适合多人一起玩的角色扮演游戏入门系统。尽管如此，原始的游戏书籍在设计之初是一项孤独的活动。


  游戏书籍的格式限制了玩家的行动。玩家做出某些关键选择，这些选择的结果要么导致另一个选择（成功），要么导致游戏结束，通常是角色的死亡或更糟的结果（失败）。这使得游戏书籍具有挑战性，但也需要反复游玩以确定最佳行动方案。更简单的游戏书籍只有一个成功的结局。另一些则多个备选结局，所有这些都可以被视为成功。


  盖格拉克（Gygax）引用这类“分支路径”游戏书籍为新手玩家提供了很有用场景。由于这些严格限制的选择和绝对的后果，简化的游戏书籍格式为这种随机性更小的角色扮演活动提供了基础（1989:106）。


  ### 风险


  与包容度更高的奇幻游戏形式相比，互动小说（IF）对玩家可能是极其严酷的。龙与地下城、微型战争游戏、CRPG 以及大型在线角色扮演游戏（MMORPG）的基础是统计学上的挑战。战斗挑战可以通过周密的计划、策略和一点运气来克服。通过平衡包括种族、职业和魔法在内的令人眼目的的数据，玩家知道，尽管他们并不总是能击败怪物，但至少有一个机会。


  另一方面，互动小说是一个“非此即彼”的命题。虽然失败并不总是导致玩家角色死亡，但它通常不取决于运气。除了《战斗幻想》风格的游戏书籍外，互动小说通常是一系列谜题。游戏书籍涉及选择正确的路径，而互动小说涉及为游戏的解析器（parser）输入正确的关键词。这些带有严重后果的有限选择可能极其沮丧，但也具有平等的意义。正如作者利用谜题来吸引读者一样，互动小说中的选择是对玩家的大脑——而不是角色的大脑——的挑战。没有智力或智慧掷骰来决定角色是否做出了正确的选择，这取决于玩家自己去发现。


  当然，怪物仍然可以被杀死。在互动小说中，巨龙、巨魔和矮人在合适的情况下都可以被击败，即使通过暴力。但冲突绝非仅仅取决于运气。这一切在于做出正确的选择。这种不同形式的冲突虽然具有挑战性，也是互动小说魅力的一部分。玩家与他们的角色之间存在着复杂的关系——一方面，他们希望通过玩家的操作让角色成功；另一方面，艰难的生活会让游戏更有趣。互动小说中角色的一生并不一帆风顺（Newman
  2007:101）。


  ## 角色


  与其他奇幻游戏不同，互动小说与角色的互动非常不同。蒙特福（Montfort）明确指出，普通的交互形式并不适用；不是从游戏意义上，不是从戏剧意义上，亦不是典型的多人角色扮演元素（2007:139）。他将玩家/角色关系称为“交互者”（interactor），它并不是由玩家扮演——而是角色在引导玩家。


  ### 创造者角色


  创造者角色主要局限于作者这一角色。计算机在互动小说中也有话语权，包括解析器和游戏世界本身。


  ### 作者


  在互动小说中，角色的性格甚至对话都会根据情节需要受到限制。作者掌握着控制权，玩家则从有限的选择中挑选一条路径。在《战斗幻想》游戏书籍中，骰子决定结果，这可能与书籍的叙事相矛盾。例如，玩家可能被告知他的角色敏捷地穿过布满陷阱的走廊，因为他根据游戏书籍的成功/失败判定题选择了正确的路径；或者他可能在涉及与其角色属性对比的掷骰测试中失败。在某些游戏书籍中，这可能与结果产生矛盾；一个通过叙述敏捷避开陷阱的角色，稍后可能因为太慢而无法避免单次伤害性攻击。通常来说，由于规则完全由玩家裁决，这并没关系。玩家可以随时“作弊”。


  某些游戏书籍设有“天堂”页面，其唯一目的是当玩家在不遵守规则的情况下翻阅书籍时，提供一个有趣的占位符。书中甚至设有陷阱来捕捉那些跳读并做出在如果正确阅读书籍就不可能可能的决定的玩家。这些陷阱用失败惩罚玩家。游戏书籍作者对于在游戏书籍结构上，玩家是否应该严格遵守条文存在分歧。


  ### 解析器


  蒙特福将互动小说具体拆分为两个部分：解析器和世界。解析器解释自然语言并对其进行过滤，从而影响世界——它是玩家的手脚、眼睛和耳朵。早期互动小说的一个主要因素是视觉的丧失；在`Zork`中，黑暗意味着被“格鲁”（Grue）杀死（Douglass
  2007:131）。


  解析器是玩家与互动小说交互的媒介，但它本身并不是角色。小说中主角、读者和叙述者的传统叙事，以及桌面角色游戏中游戏主持人和玩家的角色，在互动小说中通过玩家、主角和叙述者得到了体现（Montfort
  2003:30）。


  基于文本的解析器让玩家适应了一种特定的游戏风格，这种风格延续到了 MUD：可能是因为`Zork`我实际上尝试了 `RetroMUD`。此外，互动小说在设置上非常相似，帮助我过渡到
  `RetroMUD`。虽然由于通道和不断出现的新，MUD 的文本要大得多，但感觉一样，界面也很熟悉。此外，理解正确语法的重要性对于 IF 和 MUD 来说都是巨大一步。我也喜欢游戏书籍中的解谜，并反复阅读……是的，有一种全有全无的心态，我喜欢谜题，因此这种风格对我来说很有趣。我在某种程度上把它们看作一本可以交互的书，这个想法在许多方面吸引了我（Simes
  2010）。


  这些框架层面通过创造代理感来塑造玩家对游戏的参与——如果互动小说频繁地与玩家而不是主角交流，就会将玩家从奇幻世界的框架中切换出来，提醒他正在玩游戏。因此，解析器虽然实际上不是角色，但充当了玩家与其他框架之间的过滤器。笨拙、无效的解析器会使实现代理变得困难（Mateas
  2004:25）。


  ### 世界


  世界是解析器所影响的虚构宇宙，玩家通过其角色居住其中。解析器越先进，媒体丰富度越高。极其先进的解析器在理论上可以与世界不可分割。






  正如电脑游戏一样，计算机程序充当裁判或游戏主的角色。由于 `IF`（交互式小说）发生的虚拟世界由计算机控制，因此不需要地下主（Dungeon Master）。然而，这并没有阻止开发者在
  `Zork III` 中加入一个地下主作为宿敌（Montfort 2003:132）。


  ## 参与者角色


  我们将在计算机角色扮演游戏章节中更详细地讨论玩家角色。


  ## 玩家

  在游戏书中，玩家扮演读者的角色，对世界的影响能力有限。我们在第一章涵盖了读者角色。在交互式小说中，玩家角色与 `CRPG`（电脑角色扮演游戏）玩家相似，我们将在第
  7 章中介绍这一点。


  ### 角色角色

  在游戏书中，读者和主角往往是同一个人，这使得每个玩家角色对于该读者的体验来说都是完全独特的，因为他们是通过玩家的决定形成的（Newman 2007:100）。


  尽管有些游戏书声称与 `Dungeons & Dragons`（地下与龙）系统兼容（这一说法后来在法庭上受到了挑战），游戏书通常将角色设定在一个特定的职位上，并期望他坚持下去。虽然
  `Fighting Fantasy`（战斗幻想）游戏书理论上可以由随机冒险者玩，但大多数其他变体则不能。这是一种必然，仅仅因为一个拥有魔法等独特能力的角色在单本书的跨度内无法得到体现。


  由 `TSR` 出版的一对一冒险游戏书系列包含两本书作为盒装套装的一部分，专为玩家设计。每个玩家拿一本不同的书并控制不同的角色。它们通常设定在 `Advanced
  Dungeons & Dragons`（高级地下与龙）战役世界中。玩家轮流阅读段落，当他们位于共享游戏世界的同一地点时，偶尔会战斗。除了互相战斗外，参与者经常在角色扮演环节中担任游戏主，控制对手的敌人。这些书籍中没有需要骰子的，因为玩家会随机喊出数字，然后在图表上交叉引用。有些以类似于真人角色扮演（LARPG）的方式使用剪刀石头布。我购买了
  `The Amber Sword of World’s End`（世界尽头的琥珀剑）是为了和我的一个朋友玩，我给他一本（他是 `Uthract`，`野蛮战士`），我留另一本（我是
  `Garth`，北方之主）。不幸的是，我们从未真正玩过。


  `IF` 通常不区分玩家和他所扮演的角色，刻意保持文本线索的模糊。这种玩家表现（或称化身）之所以是匿名的，是因为玩家填补了空白，并大量使用第二人称（Douglass
  2007:129）。在图形化世界中，这种匿名性变得越来越不可行，因为富媒体环境是让玩家作为化身投入的障碍（Castronova 2005:296）。


  ## 性别

  早期 `IF` 游戏中角色的性别在很大程度上是不确定的。这可能是为了让游戏对任何性别都开放，也可能是为了程序员的方便，因为他们必须根据玩家角色性别的差异来容纳更多的描述符。即使在那些允许性别的游戏中，性别本身也不是游戏中的主要因素（Montfort
  2003:156）。


  一个例外是 Montfort 的 `Book and Volume`，它根据玩家输入的名称来解释性别。通过对算法对名称进行加权，游戏随后改变其语言以匹配所解释的性别（2007:144）。


  ## 种族

  通常情况下，角色的种族与角色的性别一样重要。然而，有一种 `IF` 形式脱颖而出：1987 年出版的 `The Knight Orc`（兽人骑士）。玩家扮演名为
  `Grindleguts` 的兽人。与其他交互式小说不同，`The Knight Orc` 特有一群伙伴冒险者，例如典型的匿名、贪婪的玩家角色（Montfort
  2003:186）。


  ### 状态

  尽管 `IF` 具有一个充满怪物和魔法的虚拟世界，但它的运行并非基于构建 `Dungeons & Dragons` 的相同假设。在 Crowther 和 Woods
  的 `Colossal Cave Adventure`（巨型洞穴冒险）中，玩家可以向矮人投斧头杀死他们，但不会获得经验值或进行战斗掷骰。事实上，玩家角色可以用赤手杀死一条龙（Barton
  2008:28），对于一个更基于统计的角色扮演游戏来说，这通常是一个重大的升级成就。在 `IF` 中，这只是叙述的另一个部分。


  ## 结论

  交互式小说在 20 世纪 80 年代初主了商业电脑游戏，但它的遗产强烈影响了如今的 `CRPGs` 和 `MMPORGs`。`IF` 为叙事性游戏带来了解谜和空间关系。“尽管一些游戏玩家甚至一些近期的开发者对
  `IF` 并不了解多少，”Nick Montfort 在一次个人访谈中说，“这些游戏的影响是显而易见的，无论是否被承认”（Montfort 2010）。


  我们将在下一章探索交互式小说对多人游戏的影响。


  ## 六


  ## 多用户地下城 (Multi-User Dungeons)


  根据 Michael Tresca 的论文，互联网的匿名性和缺乏存在感似乎煽动人们发表脏话。这位密歇根州立大学的毕业生表示，“高度匿名的群体表现出煽动性的去抑制”，即当人们认为别人不知道他们是谁时，他们更有可能产生攻击性行为
  [Cukan 2004]。


  ## 引言

  多用户地下城 (`MUDs`) 是基于文本的协作式计算机游戏，允许用户之间相互交互。“多用户地下城”一词通常被认为是为了 `Dungeons & Dragons`
  创造的，这部分是真的。这个缩写词灵感来自 `Zork` 的原型 `DNGEON` (Montfort 2003:224)。


  互联网聊天环境为冒险游戏增加了一个重要的社交元素。随着实时互动的发生，`MUDs` 更好地模拟了典型的桌上角色扮演设定。`MUDs` 也称为 `MUGs`（多用户游戏）、`MUSHes`（多用户共享幻觉）和
  `MOOs`（多对象面向）。


  `MUDs` 通常具有基于等级的魔法、装备和力量，使其具有 `Dungeons & Dragons` 的风格。`MOOs` 和 `MUSHes` 依靠玩家生成的内容和社会契约来进行战斗。这些
  `MUD` 变体没有实际上硬编码机制，而是一系列带有约定结果的描述。这类似于真人角色扮演 (`LARP`) 游戏的体验。


  `MUDs` 可以分为两类：`LP` 来自 Lars Penjat，他开发了各种 `C` 代码允许 `LP MUD` 无需重启即可运行；以及 `DIKU`（命名自
  `Datalogisk Institut, Københavns Universitet`，即哥本哈根大学计算机系），它会将装备从一次重启携带到下一次重启。`DIKU
  MUDs` 倾向于更密切遵循传统的桌面版 `Dungeons & Dragons`，具有六项属性以及标准的职业和种族。


  对比 `MUDs` 如何融入更大的社交游戏框架是有帮助的。Castronova (2005:103) 根据用户群规模、互动方式以及由人工智能控制的非玩家角色 (`NPC`)
  的存在来描述在线世界。


  ![[table]](data/content-0027.png)






  没有人工智能管理游戏的世界主要是“玩家杀戮者”（player-killer）系统。这些在线游戏，如第一人称射击游戏（FPS），其角色的一致性和发展程度较少，转而关注玩家本身。玩家通过扮演角色角色来实现主体代理性（Mateas
  2004:26）。在 `Halo`、`Gears of War` 和 `Modern Warfare` 等在线 FPS 游戏中，语音聊天提供了另一个层面的媒体富丰富度，这可能成为角色扮演的障碍。语音聊天让玩家特别难以扮演他人，让年幼玩家难以隐藏年龄，并让女性难以扮演男性。值得注意的是，很少有玩家在游戏中准确地代表自己。玩家居住在化身中，但化身可以根据角色所处的阵营随意更改（`Modern
  Warfare`）、是匿名的（`Halo`），或者被设定为几个固定的角色，导致所有玩家看起来都一样（`Gears of War`）。这类游戏往往吸引巴特（Bartle）玩家类型定义的“杀手型”游戏风格。


  另一方面，社交世界是玩家杀戮服务器的对面。它们存在是为了促进对话并培养玩家之间的社交网络。媒体丰富度最低的论坛包括聊天室，而更先进的网络（如 `Second Life`）则包含完全实现的化身。此类游戏大多数没有战斗系统。社交者（Socializers）最适合这种风格的游戏。


  最后是是寻求满足这两种类群的在线角色扮演游戏。玩家杀戮或社交在某些服务器上被强调或监管。战斗是游戏不可或缺的一部分，但贸易和角色成长也是如此。这类媒体丰富度较低的游戏包括
  `MUDs`，而更先进的包括 `MMORPGs`。我们将在后面的章节中讨论大型多人游戏。


  ### 历史


  随着《地下城与龙》在校园内广受欢迎，且规则从相对小众的微缩模型战争艺术不断演变，大学生们利用计算机来处理复杂的规则可能是不可避免的。对于那些对统计数据不敏感的玩家来说，这些规则是必要的恶。由于有了计算机完成所有工作，玩家就可以享受游戏中数学性较弱的方面。


  在 `MUD` 开发的早期，个人计算机尚未无处不在。能够接触计算机大型机的一大群体是大学生。最早的计算机角色扮演游戏（`CRPGs`）和 `MUDs` 就诞生于这些系统。学生们试图向那些不想看到大量资源被用于纯粹娱乐目的教职人员隐藏他们的游戏，这引发了一场猫鼠游戏般的元游戏。结果，这些早期游戏中的许多都遗失在历史之中。


  强大的大型机计算机具有几个内置优势，非常有利于游戏，其中最重要的一点大部分玩家都可以访问这台机器。这意味着游戏可以在大学生小组之间进行协作游戏。在互联网和计算能力赶上大型机处理器之前，个人计算机用户无法进行协作游戏。结果，在大型机游戏中首次亮相的几项游戏性进展，后来为了个人电脑进行了“降级处理”（Barton
  2008:30）。


  罗伊·特鲁肖（Roy Trubshaw）和理查德·巴特（Richard Bartle）于 1979 年首次发现了名为 `ADVENT` 的单机游戏。巴特对此产生了浓兴趣，渴望一种类似于《地下城与龙》的更有参与感的体验。大学毕业后，他创建了第一个
  `MUD`（Barton 2008:38）。


  吉姆·施瓦格（Jim Schwaiger）在 `PLATO` 系统上制作了一个名为 `Oubliette` 的极难变体。`Oubliette` 拥有 15 个种族和
  15 个职业，每种职业都有各种属性加成和惩罚，以及护武器精通。为了生存，玩家必须小组合作。它还特色酒馆、公会和“魅魂”——在大型多人在线角色扮演游戏的宠物代码中可以找到对应物的动物伙伴。`Oubliette`
  有一个不寻常特征：女性角色可以诱惑对手，将他们转变为随从，或者在努力中死去。这是该团体在互动虚构环境中首次亮相的一个重要转折点。它将 `MUDs` 从孤独游戏转变为相互依靠的冒险小组。然而，尽管
  `Oubliette` 是一款多人游戏，但它并不是一个持久的游戏世界（Barton 2008:34）。


  `MUD`，或者 `Essex MUD` 或 `MUD1`，运行在埃塞大学网络上。在巴特将 `MUD1` 授权给 `CompuServe` 之后，`Essex
  MUD` 关闭了。这只留下了 `MIST`，一个 `MUD` 衍生品，它一直非常流行直到 1991 年关闭。对 `MUDs` 的痴迷主要是英国现象，直到 20
  世纪 80 年代带有调制调器的个人计算机变得普及。


  艾兰·E·克利茨（Alan E. Klietz）于 1978 年制作了 `Milieu`。明尼苏州各地的中生因教育目的可以使用大型机。克利茨在 1983 年将游戏迁移到
  `IBM XT`，该设备通过调制调器支持同时多 16 名玩家，并将其更名为 `Scepter of Goth`。这是第一个由 `GamBit` 运营的商业 `MUD`。`GamBit`
  的资产卖给了 `InterPlay`，后者最终破产。


  1980 年，`Rogue` 在典型的地下城爬行中加入了简单的角色，后来加入了图形。`Rogue` 彻底改变了“实例化副本”，随机生成地下城和对手（Montfort
  2003:224）。


  1981 年，《指环王》通过由赫尔辛基大学的 Olli J. Paavola 创建的 `Lord` 正式转型互动虚构。两年后，菲利普·米切尔（Phillip Mitchell）的《霍比特人》游戏被
  Melbourne House 收购。这是基于书籍的早期商业作品之一，其灵感源自托尔金的小说。名为“Inglish”的解析器确保了玩家以符合类型的方式与游戏交互（2003:171）。





  1992 年，第一款商业化 MUD 是 `Legends of Future Past`，由 Jon Radoff 和 Angela Bull 设计。它拥有专业的团队来组织在线活动。它一直运行到
  2000 年。


  RetroMUD 是我担任管理员的 MUD，建立于 1994 年，并活跃至今。RetroMUD 由六个不同的世界、六十多个种族以及种类多到令人眼花缭乱的技能和法术组成。每个世界都有自己的主题，从
  Sosel 雾气腾腾的丛林到 Crypt 诡异的死灵洞穴，从奇幻的 Raji 到 Welstar 的传统幻想世界，从 Perdow 的混沌到 Wysoom 的波涌海域。RetroMUD
  的出现早于 `Ultima Online`、`EverQuest` 和 `World of Warcraft`。我在 RetroMUD 当管理员已超过 15 年。


  ## 公会 (Fellowship)


  来到 MUD 并痴迷于升级的玩家，最终会被吸引到其他冒险者的队伍，汇集资源来击败更强大的怪物。随着时间的推移，他们成为了朋友，很快就只在其他玩家在线时才玩游戏。游戏的重心从游戏机制本身转移到游戏内建立的社会纽带，直到这些社会纽带实际上取代了游戏，玩家们作为一个群体集体从一个游戏移动到另一个游戏。Bartle
  将这种游戏体验的演变描述为主干序列（Barton 2008:43）。


  大多数 MUD 通通常将组队人数限制在五到六人。与桌面游戏不同，虚拟宇宙理论上可以拥有与游戏处理连接能力相当的玩家。必须进行某些划分以将队伍划分为易于管理的小组——这并不是为了游戏本身（游戏通常可以处理这种负载），而是因为传统的《龙与地下城》小队制规则在参与人数过多时会失效。


  MUD 中公会的规模可以差异巨大。RetroMUD 起始时允许队伍中有无限数量的玩家，这导致在某一个时刻，整个 MUD 的所有人都都是一个巨型派系的一部分。代码开发人员发现，当投入一支玩家角色军队去进攻时，任何敌人都能被击败，因此代码被修改为限制人数为八人。这种“军队战术”预示了大型协作团体中玩家的力量，而这种力量后来在
  MMORPG 中体现为团队副本（raids）。


  游戏设计师面临的另一个挑战是，尽管多个冒险者居住在持久世界中，但并没有单一的玩家或群体焦点。地下城中的怪物可能会在低级玩家到达之前被高等级队伍消灭，或者低级角色得到高等级角色的帮助。在桌面游戏中，地下城主（DM）监控所有角色的进度并确保他们大致大致平衡，但
  MUD 是一个迎合多个玩家的大型持久环境。玩家角色即使在技术上处于同一一方，也可能背道而驰。解决这个问题的一种方法是“实例化（instancing）”，为每组玩家玩家创建一个独特的地下城。代价是，实例化剥夺了游戏的任何叙事感，正如我们将在下一节中看到的。


  ## 叙事 (Narrative)


  Bartle (1999) 将角色扮演的沉浸分为两类：隐藏深度（hidden depth）和开放深度（open depth）。具有开放深度的游戏会让玩家立即获得极其详尽的游戏信息，而具有隐藏深度的游戏只在玩家角色发现时才揭示信息。开放深度游戏像桌面角色扮演游戏一样预先提供规则，而隐藏深度游戏则像玩家本身是一个角色一样向其揭示信息。由于
  MUD 在很大程度上自动化了实际的规则解析过程，规则可以位于角色扮演之后。


  MUD 通过三个级别的叙事提供沉浸感，包括描述、叙述和历源（ergodics），即读者的选择（Aarseth 1997:94）。描述是关于房间本身的文本传递，叙述是游戏背后的广泛故事，而历源是从玩家的决定中织出的故事。问题在于，这些内容实际上很少是可变的。


  例如，MUD 中的描述并不会真正改变。玩家可能会捡起一个物体或破坏房间的一部分，但游戏最终会将房间重置为原始状态。这为了防止游戏内存被过多的物体过载是必要的。当新玩家进入房间时，房间会从内存中移除并重新加载，重置其原始状态。尽管有这些限制，玩家可以永久地更改某些物体。角色和个人物品、宠物和住所——所有外观都可以被玩家修改并无限保持原样。


  MUD 中的叙事几乎不存在。虽然 MUD 可以提供一个总体的叙事，但在实践中，它等同于战斗某些怪物、在特定职业或公会中获得力量，然后重复一遍。RetroMUD
  花了很大精力在标准 MUD 传统的背景下解释这些陈词。在 RetroMUD 上，“回顾宇宙（Retroverse）”是弹性的，解释了为什么物体在破坏后会重新加载，为什么独特角色在死亡后重新出现且对过去的事件或遇到不同角色没有记忆。玩家是“天选之人（Gifted
  Ones）”，是以不同方式体验宇宙并感知事物不可变本质的个体。


  TVTropes 将此称为借口剧情（Excuse Plot），“一个显然只是为了让游戏玩法或其他形式的华丽、炫耀表现而存在的剧情。简而言之，故事服务于游戏性的需求，仅此而已。它并不假装具有内在价值，只是提供一些闲谈，让你明白为什么紫色单位和非紫色的单位在互相射击”（TVTropes
  2010）。


  缺乏剧情的原因是多人游戏中一个常见的问题。每个玩家都代表了大量可能的历源。为每个玩家的决定改变游戏会让结果随游戏玩家人数呈指数级倍增，使得无法独特地满足每个玩家的需求。


  历源才是让 MUD 和 MMORPG 玩家保持投入的关键。玩家本身就是内容，玩家的数量和多样性提供了无限的排列组合。玩家作为坚实的伙伴帮助个人获得成功，作为权和财富的竞争对手，甚至是玩家杀（PK）游戏中的对手。历源提供了一种不同于其他单机、非交互娱乐形式的叙事水平，使
  MUD 变得独特。


  ## 个性化 (Personalization)


  如果说历源是玩家留在 MUD 中的原因，那么个性化就是吸引他们去的原因。大多数 MUD 与典型的《龙与地下城》范式区别很小，模仿桌面游戏的标准 DIKU 属性证明了这一点。


  RetroMUD 包含敏捷、魅力、体质、灵活、智能、感知、运气、体型、力量和智慧属性。它还有一个三点系统：生命值、法力值和耐力值。RetroMUD 和类 MUD
  预示了后来出现在《龙与地下城》第三版中的许多变化。





  在 RetroMUD 中，力量、敏捷、体质、智力、智慧和魅力的运作方式类似于《地下与城》。敏捷决定了下肢速度并影响移动。感知决定了个人通过感官感知周围环境的能力。感知为负数的角色是盲目的。运气是每天决定的随机修正值，会影响各种掷骰。体型决定了身高和体重——它会影响造成的伤害、生命值以及进入某些房间的能力。它也意味着装备必须具有特定尺寸才能适应角色。


  RetroMUD 中的生命值处理方式与《地下与城》类似，生命值的增加随着角色等级的提升而累积。法力值以相同的方式处理，用于施法法。最后，耐力值负责移动和动作，包括跑步和技能使用。这三项属性都会根据角色种族决定的“心跳”以一定速率再生。例如，巨魔的生命值再生速度比其他种族（这是对《地下与城》中巨魔的致敬，而它的灵感又源自波尔·安德森的《三心与三狮》）。


  也许最大的自定义机会源于众多的种族和职业组合。我们将在“角色”部分中讨论种族和职业组合。


  ### 风险


  角色扮演游戏的挑战之一在于，让角色面临与其应对该风险的能力相称的风险。风险通常以战斗的形式存在。《地下与城》式的生命值系统以抽象的方式处理伤害；角色即使在死亡边缘也能进行有效的战斗。角色不会随着时间的推移而产生损耗。事实上，随着角色实力的增强，他只会变得越来越强大。


  在桌面游戏中，这种力量曲线充当了推动叙事的手段。角色力量增长，面临日益巨大的威胁，并最终退休或死亡，离开游戏。在 MUD 中，由于多个角色在没有约束性叙事结构的情况下升级，高等级角色没有真正的结局。玩家会努力留住辛苦得来的力量，即使在达到游戏允许的最高等级后也会停留。简而言之，《地下与城》的等级曲线在应用于持久性虚拟世界时产生了一种异变：在这个世界里，极其强大的角色并不会伴着夕阳远去，而是永远留在那里，仅仅凭其存在就破坏了初级冒险者的未来叙事。


  MUD 的魅力之一在于升级所带来的力量。玩家通过周密的计划和时间投入获得等级，在最小化风险的同时最大化收益。而典型的桌面游戏受限于所有参与玩家的时间投入，但单人玩家可以在白天或夜晚的任何时候利用
  MUD 作为虚拟地下城主进行独自冒险。


  因此，限制典型《地下与城》桌面战役的时间限制在 MUD 中变得无足要了。玩家可以使用“机器人（bots）”自动处理无聊的任务，并利用现实工作中工作的间隙时间追求游戏中最令人生畏的挑战。杀掉对高等级角色不构成威胁的弱怪物是进步的常见手段。


  尽管许多 MUD 尽量减少了这种不平等冲突的收益，但仍然可以通过纯粹的数量来积累奖励。在一周内杀死一千只每只值 1 点经验值的老鼠是有益的，因为这种活动具有灵活性（不需要长期的精力投入）且涉及的风险较低。相比之下，杀死一只值
  1,000 点经验值的巨型鼠需要时间投入（组建队伍）并面临着巨大风险（角色可能会死亡并丢失经验值）。从长远来看，高等级玩家对低级怪物的捕猎对于愿意付出的努力的玩家来说是有利的。这被称为“刷怪（farming）”。


  刷怪通常是一项孤独活动。独行玩家（Soloers）是指在没有队伍或只有极小队伍的情况下提升角色的玩家。有时这是一种无奈，特别是在虚拟游戏中，在奇特时间或在小型
  MUD 中的玩家很少有伙伴可以玩。其他玩家倾向于快速通过“击杀/掉落/出售/重复”的循环，并发现队伍成员阻碍了他们的进步。


  本质上，玩家习惯于孤独的 CRPG（角色扮演游戏）体验，这种体验又源自游戏书；一个全才型、有很大机会克服每种障碍的角色。这与标准的《地下与城》队伍直接对立，后者鼓励专业化和脆弱性。在《地下与城》的早期版本中，法师是这种专业化最显而易见的例子；低等级时用途有限，高等级时极其强大。独行角色是
  CRPG 审美应用于社交游戏的体现。


  理论上来说，任何事情都可以被“独行”——这完全取决于独行玩家的等级比例。一个足够强大的高等级玩家可以击败甚至一群低级怪物。MUD 程序员对独行玩家处于爱恨交织的状态。正如《地下与城》网络版最终加入了“独行”难度所证明的那样，独行是每个游戏设计师都试图避免的活动，但几乎无法从任何战斗
  MMORPG 或 MUD 中抹除。


  ## 角色


  MUD 上更多的玩家意味着更多的互动机会和最终的生存。理查德·巴特（Richard Bartle）认为，不有趣的 MUD 需要更多的玩家才能繁荣。他甚至描述青少年玩的
  MUD 比三十多成年人玩的 MUD 更具暴力和敌性。性别也是一个因素，性别比例平衡会让 MUD 变成“仅仅是交友网站”（1990）。


  ### 创建者角色


  创建角色包括托管游戏的计算机程序以及在上面编写代码的巫师。


  ### 计算机程序


  在 MUD 中，计算机负责传统的由地下城主处理的角色。最简单的层面是程序化的非玩家角色。它们有时被称为 `ro(bots)` 或 `mobs`（移动物体的缩写）。通常情况下，`mobs`
  是寻求杀死角色的敌对目标。它们是世界上的怪物，是能够杀死冒险者的基本生物。


  卡斯特罗诺瓦（Castronova）将更复杂的机器人区分为“非玩家角色（NPC）”，使用桌面角色扮演游戏的术语来识别更智能的 `mobs`。这些是宇宙中的商人、守卫或其他非敌对生物，创造了生活世界的幻象。它们是工人、无名大众，以及最初由地下城主扮演的角色。


  非玩家角色（NPC）是几种模拟桌面角色扮演游戏地下城主的计算机程序角色之一。这种类型角色的一个子集是导师，他们通过超越游戏内对话解释游戏世界运作的方式向玩家介绍游戏世界。


  还有一些 MUD 角色在桌面《地下与城》中被量化为“随从（henchmen）”。随从被定义为“防御竞争玩家角色阴谋的安全措施[它们]为角色及其据地提供力量，最后在玩家角色无法行动时作为冒险的手段”（1979:34）。随从作为盟友帮助完善队伍。


  “宠物（Pets）”由玩家控制（无论是永久的还是临时的），它们的独特之处在于它们不是被击败的机器人，也不是需要与之交互的非玩家角色。它们本质上是玩家角色的延伸，通常受到限制，不会被视为完整的角色。





  Castronova 量化了最后一个隐形的角色，即运行世界的人工智能。这包含了从门的开启和关闭到火的燃烧等一切。一个被触发的逻辑效应有一个逻辑上的结论。只有当玩家试图影响事件的自然进程时，运行游戏的代码库的隐形角色才会发挥作用。如果我试图扑火，火会熄灭吗？什么决定了我是否有足够的水？如果我尝试关门，我的力量足够关上它吗？如果它太重了呢？


  这些角色在桌面角色扮演游戏中通过两种机制进行裁决：规则书和骰子。规则书提供了适用规则的通用大纲——开门所需的力量、灭火所需的敏捷等等。骰子提供了随机元素，意味着行动可能会、但不一定能产生结果。在
  MUD 上，这些机制是通过代码库控制的，Castronova 将该系统称为“自然”（2005:95）。


  # 法师 (Wizards)


  尽管 MUD 玩家沉浸在他们的角色扮演中，但他们仍然能够向“编码权威”，即游戏的创造者寻求帮助。这些创造者面临着游戏内和游戏外策略的压力，就像桌面角色扮演者试图在游戏过程中影响游戏主（DM）一样。就像不受受欢迎的地下城主，编码权威面临着大规模抗议的风险，在极端情况下，这种倾向会导致玩家离开游戏并阻止他人加入（Castronova
  2005:152）。


  法师是多用户迷城中的编码权威。值得注意的是，法师是从玩家群体中选拔出来的，而且这通常是多用户迷城的目标——换句话说，许多多用户迷城玩家的渴望就是成为编码权威的一员。因此，他们被赋予了超出玩家群体范围的特权，例如长生。法师负责运行游戏、执行规则以及创建新的非玩家角色和冒险。多用户迷城的层级各不相同，但总的来说至少有三个等级：


  *   **管理员 (Administrator)**：拥有访问游戏核心规则权限的编码员。他们还维护游戏的代码库、财务状况，是游戏的最终权威。

  *   **大法师 (Archwizards)**：承担更多责任的编码员，通常是游戏中编码权威中最高且最活跃的存在。大法师负责保持其他编码人员的工作效率，并维持玩家群体的参与度。

  *   **法师 (Wizards)**：初级编码员，这些员工致力于创建新内容，无论是区域、职业、公会、种族、怪物或其他。


  这些层级中的每一个都通过等级来区分，公开的徽章明确标识了谁比谁更强大，并隐含着一种观念：法师比玩家强大，因为他们的等级更高。


  在 `RetroMUD` 上，这种层级制度对我们很有利。法师在刚开始往往效率极高，但最终现实生活中的责任或仅仅是缺乏兴趣会导致他们脱离职位，回到玩家的角色中。大法师是少数将时间投入到游戏中的人，承担着
  `RetroMUD` 宇宙中整个世界的责任。因此，他们负责 Bug 维护、批准法师创建的新区域，并在其他方面维持和平。


  在大法师角色之上是管理员。他们从未多于三个。总的来说，每个管理员都有一个高度专业化的角色。在我的情况下，我是“门面”——与其说是一个编码员（尽管我在 `RetroMUD`
  上编写过几个区域），不如说更多负责游戏的行政和财务事务。因此，管理员投入游戏的时间通常比大法师和法师少。


  `RetroMUD` 有有一百级，但我们并不要求达到百级的人成为法师，也不会向他们提供这一职位。相反，编码职位是提供给那些拥有至少二十级经验的人，其想法是先玩过游戏是很重要的——我们仅凭这一理由就拒绝了潜在的申请者——但完全精通游戏并非关要。等级本身也是衡量精通程度的糟糕指标。高等级角色可以通过非常狭窄但有效的路径获得这种力量。这种狭隘并不能造就优秀的法师，因为该角色需要创造力和想象力，而这些在等级刷中有时缺失。


  一个产生的问题是编码员决定“去法师化”并成为玩家。这些曾经不死的玩家处于羡慕的地位，既拥有代码库知识，拥有高级玩家知识。总的来说，这是不可避免的。如果不了解每个玩家的身份并仔细追踪每个玩家在游戏中的路径，这项任务将是不可能的。


  然而，拥有与玩家紧密交织的编码团队具有重大的文化利益。`RetroMUD` 拥有活跃的 Bug 报告功能以及建议小组，这两者的使用率都很高——远高于游戏中的任何其他通信方面。这与大型多人在线角色扮演游戏形成对比，在后者中客服人员是无面的，编码权威从不干预，玩家的顾虑被忽视。


  # 参与者角色 (Participant Roles)


  在海岸魔法工厂的调查中，51% 的桌面角色扮演游戏表示他们曾在互联网上玩过游戏，28% 的报告他们每月玩一次网络游戏。在受调查的人中，52% 表示他们想要软件帮助管理游戏并加速战斗，37%
  阅读新闻组、邮件列表和网站，42% 使用某种形式的计算机辅助进行游戏，50% 想要在互联网上玩 D&D。样本中四之三的人每周至少使用一次互联网，但只有二之三可以在家里访问（2000）。


  我游戏小组的一位成员进入 MUD 是为了填补桌面游戏留下的空白：


  > 这是我们继续社交互动和在某种程度上继续角色扮演的好方法。从纯游戏的角度来看，这像是一种倒退。世界很小且有时拥挤，任务和战斗很快变得重复。然而，这通过游戏共享的公共聊天系统继续角色扮演是一个绝佳机会。虽然大多数人将其作为游戏来玩，尽可能快地变得强大，但也有少数人喜欢角色扮演。在线游戏的另一个优势是你可以随时随地加入，而不需要等到下周六聚在一起进行下一次
  RPG 环节 [Jellig 2010]。


  理查德·巴特尔创建了 `Bartle 玩家心理测试`，截至 2007 年 7 月已调查了超过 30 万名玩家以确定他们的“巴特尔系数”。巴特尔系数明确了玩家的游戏偏好，这些被分为杀者、探险者、社交者或成就者（Glenday
  2008:184）。这四个类别区分了玩家的类型以及吸引他们的因素。


  ## 杀者 (Killer)


  与其他玩家竞争的成就者，以及寻求与他们交流的社交者不同，杀者寻求击败他们。不是像成就者那样进行抽象竞争，而是通过直接竞争，通常是战斗。这种形式的战斗通常会导致角色的（临时）死亡，被称为玩家杀（PK）。它最初被认为与长期游戏背道而驰，但许多在线游戏游戏现在都有针对这种游戏风格的“对等平等”的区域。像社交者一样，其他玩家是乐意的……他们只是恰好是猎物。


  ## 探险者 (Explorer)






  探索者以内容为生；他们搜寻内容、收集内容、发现内容。因此，丰富的领域对他们极具吸引力。他们是最“渴求代码”的玩家类型，需要海量的内容来保持他们的兴趣。已经被探索过的区域会迅速失去吸引力。T.L.
  Taylor 在《世界之间的游玩》（*Play Between Worlds*）中指出，女性可能更倾向于成为探索者（2006:97）。在现实世界中，性别在安全旅行能力起着重要作用。而在虚拟世界中，这种威胁仍然存在，但在性别之间是平等的。


  任务是探索者所享受内容的很大一部分。遗憾的是，互联网的本质意味着，当探索者社区发现并分享内容时，探索者的兴奋感会很快消退：


  几年后，每个月的更新在补丁发布后的几天内（甚至几小时内）就会被剧透，并有一排玩家等待轮流完成“月度任务”。虽然玩家总是可以选择不访问网站或使用插件作弊，但绝大多数玩家群体通常会选择这样做。这剥夺了一些神秘感，因为你无法避免在游戏中听到关于它的讨论。桌面角色扮演游戏（TRPG）很少会遇到这种问题。虽然你可以随时去买自己的模块/战役副本，但较少有人会通过作弊来剥夺自己体验故事发展过程的机会。在网上，“尽早利用、经常利用”的格言经常出现在玩家试图“赢得”一场本该关于旅程而非终点的游戏的行为中
  [Jellig 2010]。


  ## 社交者 (Socializer)


  相反，社交者将其他玩家视为内容。他们在于游戏世界内建立社交网络时感到最快乐，尽管这并不等同于在游戏内进行角色扮演。社交者最喜欢支持其社交风格的内容，无论是互动社区、在游戏中与其他角色结婚的能力，还是可以组织成公会的结构。


  ## 成就者 (Achiever)


  成就者是等级提升者或刷肝者；他们的目标是赢，或者至少尽可能地积累。成就者也被称为“力量型玩家”（power gamers），被 Taylor 定义为不断从事极度专注的目标设定，范围从升级、获取某些装备到击败某个特定的怪物（2006:75）。


  成就者在依赖他人作为内容的社交者和依赖游戏内容的探索者之间找到了中间点。随着实力的增强，成就者以高速度消耗内容，通常通过“等级刷级”的力量结构来实现。这种力量提升方式的优点是等级易于识别，这通常会转化为一种等级制度。这种等级制度通常由与角色绑定的某个数字（如等级）指定，提供了成就者的另一种满足感——他或与其他相比取得了成就。仅仅达到高等级是不够的；成就者想要自己的等级比所有人高。


  与社交者和探索者不同，成就者和杀手者（Killers）对 MUD（多用户在线地下城）环境是有毒的，特别是在那些仍在建立玩家社区的年轻 MUD 开发早期阶段。RetroMUD
  与其他 MUD 的相似性吸引了来自那些游戏的愤世、愤怒和暴力的玩家。它花费了多年以及代码人员的频繁干预，才创造出一个足够稳定以吸引其他游戏风格玩家的环境。


  尽管如此，杀手者和成就者让游戏变得更好。玩家杀（PK）在受到适当监管的情况下可以非常令人兴奋——它是交互性（ergodics）的终极形式，两个玩家相互对决。成就者测试游戏系统的极限；他们是最好的测试员，并能迅速发现游戏的缺陷。


  最终，所有四种游戏风格都是玩家接触游戏的有效手段，RetroMUD 的管理员也呼应了这种观点：


  我学到的第一点是，玩家也是人。他们有缺点，会成长和改变，有些人会变得成熟。有时他们来到 Retro 是为了逃避问题，有时他们把问题带进游戏。任何人都有可能过好或糟糕的日子，可能会犯错，也可以从中学习
  [Fallah 2010]。


  ## 匿名性 (Anonymity)


  我的硕士论文《匿名性对计算机中介通信中去抑制的影响》（*The Impact of Anonymity on Disinhibition Over Computer-Mediated
  Communication*）在 *Penny Arcade* 的 Jerry Holkins 和 Mike Krahulik 提出自己的假设——“互联网傻瓜理论”（Internet
  Fuckwad Theory）时，在在线游戏世界找到了相关性。该理论本质上说的是相同：当玩家处于匿名状态，没有机会对其行为受到报复时，他们会回到粗俗的行为。我的朋友
  Chris Bibbs 注意到了相似之处，并向 *Penny Arcade* 发送了我的我的论文链接。当 *Penny Arcade* 反过来发布该链接时，我的网站获得的访问量比过去五年的总和还要多。


  由于 *Penny Arcade* 的宣传，全球各地的网站都关注到了这一点，甚至在《华盛顿时报》的“饮水机旁”栏中被引用。该引用将我描述为一个“密歇根州立学者”，并错误地总结了我的论文，认为人们在匿名时倾向于说更多脏话。


  我的论文关注技术如何改变我们感知彼此和自己的方式。例如，计算机中介通信允许我们在几秒钟内联系数千人，而无需实际上站在他们面前。这种匿名性影响了我们如何感知彼此，我们如何与这些对他人的感知进行互动，以及社交环境对我们的限制程度。


  在论文中，我假设许多用户由于缺乏社会背景线索而感到不受抑制和不受约束，因此以侮辱、咒骂和敌对语言的形式表现出更多的去抑制行为（Walther 1993），这比他们与这些人面对面交流要要得多（Siegel,
  Kiesler and McGuire 1984）。社会背景线索的缺乏会导致兴奋不受抑制的交流。


  Singh 将 MUD 的匿名性描述为一把双刃剑。“它让你抛下现实中的自我，在想象中成为你现实中不是的一切事物……由于其他玩家也可以成为他们想要的任何身份、任何形式、形状、性别或大小，你完全不知道现实生活中他们是谁或是什么”（1999:198）。


  我研究的目的是确定计算机中介通信的经验是否会改变用户的行为和感知。具体来说，研究测试了客观匿名性和经验对计算机中介通信中去抑制行为的影响。


  我将计算机中介通信定义为人们利用网络电信系统促进编码、传输和解码来创建、交换和感知信息的同步或异步过程（Kiesler and Sproull 1992）。






  # 通信中的匿名性与交流


  用户感知的匿名性是指在法律和社会层面上，用户对其行为和对话能够在其社会环境中保持不追究责任的能力。用户的个人观点受到视觉外表缺失、与用户正常人格不同的标签的灵活性，以及免物理和社会后果的相对保护的影响。用户往往可能在并非匿名的情况下感知到自己是匿的，可能会对某个标签产生深层次的个人情感依恋，使其成为自己性格的一部分，或者受到的后果保护可能远低于他们所感知的程度。在计算机介的通信中，准确感知自身相对于他人客观匿名性的能力与用户对该媒介的体验直接相关（Orcutt
  and Anderson 1996）。由于无法知道是谁登录了 `MUD` 中的某个特定账户，用户可能没有动力去交流敏感问题。


  ## 去抑制行为


  去抑制行为不仅限于粗鲁或冒犯性的互动。基于文本系统的用户可以表现出信息去抑制，与那些有共同兴趣但在通常情况下互不认识的人建立更紧密的联系（Rice and Love
  1987）。


  在 `MUD` 中，所有初级用户都以匿名身份开始。Aarseth 发现，自我和他人的匿名性促进了 MUD 的产生，在这些平台中，“对匿名的使用、多个昵称、身份实验（例如性别转换）以及普遍的娱乐氛围表明，参与者并不是为了加强他们在社会中的地位，而是为了通过创造一个讽刺性的镜像来暂时逃避社会，这个镜子将允许任何想象中的符号快乐”（1997:144）。


  希望与匿名对应物区分开的用户必须通过创建角色来提供自己的信息，而希望进一步了解交流对象的用户则必须通过进一步的交流积累更多信息。这些形式的匿名性每一种产生不同形式的去抑制。


  ## 自私关注与社交互动


  煽动性去抑制的发生可能是由于缺乏非语言和副语言线索，用户变得更加自私，关注自己多过别人的感受或福利。她不太可能对其他用户形成独立的个体印象，因为她没有足够的信息来区分他们（Kiesler
  and Sproull 1992; Walther 1992）。


  Beck 和 Wade 在 *Got Game* 中将这种自私关注与钢琴课进行了对比。玩游戏和钢琴课都包含复杂的手部动作，并强调重复的价值以及分享经验的困难。成千上万弹钢琴的人并不比普通大众那么孤立。他们的调查清楚地表明：游戏玩家并不是孤立、内向或不善社交的。事实上，游戏一代比不玩游戏的人稍微更注重人。有一种趋势表明，玩家在玩游戏上花费的时间越长，他们就越认为自己越社交（2004:113）。


  受调查的游戏一代成员表示，玩家经常需要与人建立关系。Beck 和 Wade 发现，大约一半的玩家是为了社交体验而玩游戏。`MUDs` 将玩家与陌生人连接，在与他们竞争或协作的同时提升自己的社会地位。


  ## 社交线索的作用


  关于物理外表、权威、地位和发言顺序的非语言线索的缺失，使得用户在 `MUDs` 中的参与比在许多面对面的互动中更加平等。这些线索是灵活的，因为没有用户必须受缚的一致视觉外表。参与者仅使用文字就按照自己的形象重构语境，在运行的对话中添加想象的动作和元描述，这些内容在字体上与直接对话的文字区分开来。他们还对单词的严格定义添加修饰语，指示意图、情绪或其他通常缺乏的语境线索（Froomkin
  1995）。不同的 `MUDs` 允许不同程度的自我描述。某些 `MUDs` 根据角色种族或职业固定在特定的外表上，而另一些则是完全流动的，甚至可以随时。


  一些研究人员（Rice and Love 1987; Walther 1992）假设，基于文本的通信技术比纸质通信更削弱了社交语境线索。不确定性减少需求结合易性和表达的选择性通道允许用户选择自己的自我呈现和关系行为。在这种模式下，用户对评论的计划、思考和编辑比在自发的面对面互动中多得多。用户可以使用去抑制行为表达政治观点而不必担心报复，在不被发现的情况下进行告密，并在已知真实身份被保密的情况下就就尴尬的个人问题寻求建议（Froomkin
  1995）。随着时间的推移，随着用户对媒介的了解增加，她创造理想印象的能力也应该增加。


  ## 极极化与去个体化


  社交语境线索的缺失可能导致更多的去抑制行为和态度极化，对群体成员产生更多负面感知。因为他人只存在于计算机媒介的语境中，用户可以离开 `MUD`，整个虚拟社会便不再影响该用户（Brook
  and Boal 1995）。


  线索的缺乏也会导致信息去抑制。匿名性可以帮助人们克服社交抑制，鼓励跨社交或心理边界的交流，并取消群体行为规范（Kiesler and Sproull 1992）。在
  `MUDs` 中，这种去个体化涉及自我意识的减少和相应的身份丧失。这发生在群体显著性较高时，因为群体的原型形象或理想状态不会因观察其他玩家而污染，这些玩家仅仅通过其外表可能被认为在某些方面偏离了群体规范（Spears,
  Lea, and Lee 1990）。


  线索的缺乏也可能导致……（此处重复，注）。正如 Barton 在 *Dungeons & Desktops* (2008:41) 中解释的，“玩家可能由于害羞而无法参加面对面的会议。”


  社交语境线索的缺失使得人们难以感知和适应社交角色和情境规范，因为静态线索源于界定权力和权威的物品（Kiesler and Sproull 1992）。由于 `MUDs`
  缺乏正常的社交语境线索，权威和地位转移到了等级和装备等物品上。


  最终，我的论文证明了匿名增加了煽动性去抑制，但没有增加信息去抑制。可能是通过计算机介的通信的用户缺乏有助于定义他人首次接触的初始视觉线索。这种对人的定义的缺失使得去抑制的目标变得越来越不像人。用户可能对其他用户少有同理心，因为她没有将其他用户视为个体。


  其次，由于用户无法遭受即时物理伤害，且不对其行为承担法律或社会责任，煽动性去抑制是一种更具吸引力的诉求。对于对其他用户造成的任何损害，除了言语之外没有即时的问责，而且如果用户能够忽略或结束对话，甚至这种损害也是有限的。面对面的通信可能因为一个人在尖叫而另一个人无法听而不继续，但计算机介的通信可以立即结束。某些
  `MUDs` 具有“忽略”功能，允许完全忽略另一个角色，为玩家提供了通信通道提供了更多控制权。






  信息去抑制（Informational disinhibition）可以导致一个紧密的社区，因为玩家分享信息比在类似的面对面场合要亲密且快速得多。RetroMUD
  的社区非常紧密，以至于促成了一些婚姻。至少有三对情侣是因为玩 RetroMUD 相识并随后结婚的。这在 RetroMUD 并非孤例；8.7% 的男性玩家和 23.2%
  的女性玩家举办过游戏婚礼（Glenday 2008: 184）。当然，我也是通过 MUD 认识了我的妻子。网络情景《公会》（The Guild）专门围绕这个主题制作了整整季的网络剧（Day
  2010）。


  ## 玩家


  在 Beck 和 Wade 对玩家的调查（2004:127）中，他们发现经验最丰富的玩家选择一种征求群体意见但最终做出决定的领导风格。这种风格与小队长的相契合，非常适合在敌对环境中生存的各种冒险者。这是一种灵活的方法，让他们既能汲取群体经验，又能迅速做出反应。事实上，这种平衡了群体共识与行动的风格，反映了经验丰富的商业经理的特征。


  事实上，现实因素——即某些游戏中可能缺乏的媒介丰富性——并不一定是沉浸的障碍。根据 Castronova 的说法，“我们感知环境的机制适应了人类进化的环境，”而那个环境是没有媒介的。默认假设是所感知的一切都是真实的。因此，沉浸发生得很快，因为这样做这样做是不切实际的；玩家必须不断地拒绝这种体验（从而停止玩游戏）或屈从于它。


  这种沉浸感通过游戏的人口得到了进一步加强。当大群体相信某事时，和他们一起相信变得更加合群。当一条“龙”“杀死”另一个玩家的角色时，群体表现得就像那个角色死了一样（即使是暂时的）。没有人会耸耸肩说：“那龙不是真实的”（Castronova
  2005:75）。


  ## 角色职业


  RetroMUD 有许多种族以及初级、二级和三级职业，类似于《地下城与龙》的名望职业。


  ## 种族


  RetroMUD 拥有近六十种族，涵盖了令人眼花缭乱的各种角色类型。几乎每种类人生物都有代表，包括一些根本不是类人的生物，比如多眼的阿格斯（argus）。RetroMUD
  包含了其他 CRPG 后来实现的额外属性，包括最大年龄、饮食需求、心跳速度、视力、可用装备槽、优势与劣势、抗性和脆弱性。


  ## 职业


  传统的《地下城与龙》职业在转移到 MUD 时在很大程度上保持了完整性，唯一的例外是：盗贼。在由地下城主描述环境的自由流叙事中，对墙、门或陷阱的一致定义都是可变的。一个与环境交互的盗贼对编码员来说是一个挑战，因为环境必须被编码为以一致的方式做出反应；门必须能被破解，墙必须能攀爬，陷阱必须以连贯的方式被解除。讽刺的是，这种冒险式的解决问题精神正是导致早期互动式文学的动力。


  RetroMUD 允许三级多职业培养：初级公会（20 级）、二级公会（14 级）和三级公会（9 级）。所有公会都提供了恢复加成（针对生命值、法力值和耐力值）、属性、技能和法术加成，以及访问新技能或法术权限。初级公会通常可以自由选择多职业，允许玩家角色在任何一个职业中进阶。然而，少数职业（如骑士/paladin）具有阵营限制。个人的初级公会决定了加入二级公会的资格，而二级公会决定了加入三级公会的资格。三级公会通常需要任务才能加入，并在九级获得一个技能或法术。


  传统的桌面角色一应俱全：坦克（Tank，战士）承受伤害并防御小队。治疗者（Healer，牧师）治疗坦克以便其继续战斗。爆发输出（Nuker）施放强大的攻击法术，从远处造成毁灭性伤害，这一角色传统上由《地下城与龙》风格的法师负责。除了从桌面游戏中借用的标准“小队”角色外，还有几个
  MUD 特有的角色。


  #### DPS 输出者


  `DPSer` 代表“每秒伤害”（damage per second）。与坦克只需要站在那里并在正确的时间出现在错误的位置而受到惩罚不同，`DPSer` 会主动进攻敌人。他频繁地造成伤害，但不一定每秒都是。`DPSer`
  可以是一个弓箭手、一个频繁射击的爆破手（而不是他那个通过大规模爆炸释放火力的 `Nuker` 伴侣），或者一个擅长刺刺的客。RetroMUD 使用`刺客者公会`（assassin
  guild）来实现这一目的。


  #### 控制者


  `Mezer`（控制者）控制对手。他控制敌人的手段各不相同。可以是瘫痪、睡眠、或是消耗属性值……无论效果如何，结果都是一样的：目标受到了损害。传统上，这仅限于有施法敌人的能力的施法者；女巫、可以使用魅惑法术的法师，或可以迷住对手的吟游诗人。RetroMUD
  使用`灵能者公会`（psionicist guild）来填充这一角色。


  #### 宠物大师


  `Petmaster`（宠物大师）拥有代他战斗的宠物。这些宠物可以是任何东西，从随从到杀手猛兽，再从召唤的魔鬼到活尸。与控制者一样，这个角色在桌面 RPG 中的定义并不明确。它在
  3.5 版本通过`德鲁伊自发召唤动物盟友的能力`被正式化。RetroMUD 有多种填充这一角色的公会，包括德鲁伊和邪教徒。


  #### 陷阱大师


  `Trapper`（陷阱大师）异步造成伤害。他的强项在于防御追击敌人的能力，在走动时布置陷阱。这从未是桌面角色扮演游戏的强项，仅仅是因为冲突的英雄主义性质并不擅长将怪物骗进坑里。在怪物会跟随玩家的游戏中，陷阱大师变得可行得多。


  #### 全才者


  最后是 `Jack`，是“全才大师”（jack of all trades）的缩写。该短语的后半部分是“样样通”（master of none），这正是 Jack
  的强项也是弱点。理论上，这让他成为领导者的完美角色。吟游诗人过去一直一直充当这一角色，第四版《地下城与龙》试图通过“军团”（Warlord）将这一角色引入主流。RetroMUD
  使用`吟游诗人公会`（bard guild）来实现这一目的。


  ### 状态


  Castronova (2005:113) 提到了状态和提升是多人在线角色扮演游戏的重要方面。他将力量、等级和经验的积累称为“化身资本”（avatar capital）——“人类资本”的虚拟等效物。


  与提升同样重要、甚至更重要的是状态。两者紧密相连。所有角色在第一级时都处于起点。尽管每位游戏开发者的目标都是创建一个这样一个公平的环境，玩家不可避免地认为某些种族、公会和装备的组合是更快的路径。


  在 MUD 中，状态通常通过等级系统分配。值得注意的是，编码员和程序员有时会给自己提供一个远高于任何玩家的等级，从而在等级制度中建立主导地位。相反，成为 MUD
  的程序员并成为工作人员有时是升级要求的一部分。






  这种等级与进度紧密结合的问题，对于许多使用“MUD 学校”模式来教育新玩家的游戏来说，是一个挑战。这些“新手学校”给人一种印象，即新玩家角色就像孩子——无助的初学者，需要被教导如何玩游戏。新玩家（新手）被交给他一把像尺子一样的武器，然后被要求去战斗老鼠或蝴蝶。RetroMUD
  管理员 Mazyar Fallah 解释了等级与地位之间存在的问题：


  这本质上是等级刻板印象：低等级角色通常被视为小孩在玩耍。这在玩家群体中最为常见，尽管有时代码开发人员也会表现出同样的行为。除了等级之外，下一个社会地位的决定因素是某人玩游戏的时间。无论等级如何，玩的时间越长，社会地位就越高。同样，这意味着对角色背后玩家的看法是老龄化的，按照“尊老传统”的方式，他们存在的时间越长，地位就越高
  [2010]。


  最好的 MUD 学校根本不是学校，而是游戏体验的一部分，帮助新玩家融入游戏，包括在社交上融入玩家群体，以及在个人层面融入游戏的规则和制度。最糟糕的 MUD 学校则是游戏系统的补丁，文档极其匮乏，其存在实际上是为了强化玩家为什么不想加入的原因——这在玩家决定是否想玩这款游戏的关键时刻，会让休闲玩家望而却步（Juul
  2004:139）。


  为了解决这个问题，RetroMUD 而是创建了一个“助手”角色，其工作是为新玩家提供建议、治愈他，并在此其他提供在宇宙中移动的手段。这种指南以符合该世界观的形式出现——它不是一份关于游戏的元指南或流程攻略。它完全在奇幻体验中进行。


  地位和等级的问题在于，它开始塑造游戏的现实；低等级玩家认为自己一无是处，而高等级玩家则认为自己在道德上是优越的。当然，任何基于等级系统的成功首要因素都是时间——时间充裕的玩家能够比那些无法投入更多注意的类似玩家强大得多。与所有高等级玩家相关的声望并不一定名之其实归。一位
  RetroMUD 玩家总结了这个问题：


  啊，等级，又名告诉我们你有多烂以及我有多牛的数字。与创建日期一起，等级决定了人们如何对待你。如果你是一个拥有旧创建日期的低等级，人们会认为你缺乏经验，因为你现在本应该已经升级了。如果你是一个拥有近期创建日期的高等级，人们会认为你是个什么都不懂的新手，只是被喂养并通过各种方式快速升级（powerleveled）而来的。如果你是一个拥有近期创建日期的低等级角色，他们根据自己的身份要么讨厌你要么帮助你；如果你是一个拥有旧创建日期的等级玩家，你基本上就稳了。你现在只需要做的要么是整天挂机，要么肝完最后几个等级，你就能和你的精英玩家们融在一起。实际上情况比这要复杂得多，但总的来说，低等级的人向往更高等级，中间等级的人要么更努力地升级，要么看不到更高等级的吸引力，而获得“高老手（highbie）”地位的人则嘲笑那些不承认当你的角色处于终局阶段时会获得力量的人
  [Smith 2010]。


  游戏开发者努力让游戏对所有等级都具有挑战性，但高等级地位的一个特点是玩家觉得他们不不需要得那么努力。尽管滑动比例可能吸引设计师作为维持西西弗斯式苦作的手段，但高等级玩家可能会因为游戏没有变得更容易而感到沮丧。


  在桌面角色扮演游戏中，这种地位的概念在小群体之外并不存在。玩了很长时间或拥有高等级角色的玩家会被赋予地位，可能是因为某些元游戏（metagame）优势，例如主持游戏或拥有所有的规则书。但他的地位仅限于与他一起玩游戏的其他玩家。遇到另一个玩家并向其展示高等级角色卡可能会引起怀疑——无疑，玩家可能简单地创建一个高等级角色，并声称自己实际上已经通过了所有要求的关卡才获得这种力量。


  然而，MMORPG 和 MUD 拥有一套认可的规则集，即 Castronova 所指的“本质”。因此，存在一个基本的共识，即高等级角色是“应得”了他们的地位。他们可能被指控作弊，但作弊发生在游戏进度结构的框架之内。因此，他们的地位要广泛得得多，因为多人在线游戏往往是规模巨大的，玩家人数通常数以千计。


  RetroMUD 避开了大型玩家的“无限等级”系统，致力于 100 级，并赋予了“转生（remort）”的能力。转生允许达到 100 级的玩家重新开始，并可以使用仅
  100 级角色可有的专属种族。RetroMUD 通过按种族的经验值修正系数来调节等级；越强大的种族获得经验值的速度越慢。


  ## 结论


  从 MUD 踏过的领域有许多可以学习的地方。许多后来引入 MMORPG 和桌面 RPG 的创新都是在 MUD 上经过游戏测试和精炼的。MUD 拥有声望职业，扩展了传统中地球套路之外的可玩种族，并在正式引入桌面游戏之前很早就巩固了关于进食、睡眠、年龄和体型的标准化规则。EverQuest
  的解析器与 DIKU 惊奇地相似。宣誓书证实 EverQuest 并非显式地使用 DIKU 代码构建，但该 MMORPG 显然受到了它的启发（Taylor 2006:144）。






  幻想类 CRPG 大量借鉴了《地下城》（Dungeons & Dragons）的规则，尽管开发者们也自由对其进行修改（2008:23）。这并不是说《地下城》是所有幻想主题
  CRPG 的源。铁皇冠企业（Iron Crown Enterprise）的 `Shadow World`战役设定是在 Simutronic 的 `GemStone`
  游戏中形成的。`Shard of Spring` 则包含了一个受 Steve Jackson 的 `The Fantasy Trip` 启发的等级和训练系统。


  与桌面角色扮演游戏不同，玩 CRPG 所需的规则理解要少得多，因为计算机处理了大部分计算，大大降低了入门门槛。因此，玩家可能在实际上并不理解规则运作的情况下玩电脑
  RPG，并因此以错误的方式玩（Harrigan and Wardrip-Fruin 2007:107）。另一方面，电脑 RPG 可以处理玩家难以计算的复杂机制，特别是在具有多个变量的大规模情况下。电脑游戏还可以通过隐藏变量来让玩家感到惊讶，而这些变量对于深度参与游戏的玩家来说本应该是未知的（Crawford
  2007:169）。


  ### 历史


  个人电脑的出现意味着游戏开发者可以商业化发布他们的游戏。这开启了一个粗糙但大胆的实验时代，Barton 将其称为青铜时代（2008:43）。


  `Wizard’s Castle` 由 Joseph R. Power 在 1979 年为 Exidy 鲜为人知的 `Sorcerer` 平台发布。`Wizard’s
  Castle` 使用 `BASIC` 编写，它的发布是一项成就，因为它发表在计算机杂志上。我记得曾帮助父母从这类杂志上输入一行又一行的代码，结果却因为少了一个逗号导致游戏在百分之五十的时间里无法运行。这种训练——实际上更多是关于毅力而非编码技能——在日后我为
  `MUD` 编写代码时对我受益匪浅。


  `Wizard’s Castle` 允许玩家选择不同的种族（精灵、矮人、人类或霍比特人）、性别，并将点分配给三项属性：`strength`、`intelligence`
  和 `dexterity`。它还具有至关重要的光源功能，根据光源的强度来照亮地图。这一切仅用五千行代码就实现了（Barton 2008:50）。


  同样在 1979 年，Epyx 发布了 `The Temple of Apshai`。与 `Zork` 一样，`Temple of Apshai` 由单角色进入地下城寻宝组成。随着他越走越深，他获得了得了武器和盔甲，变得更加强大。杀死怪物带给他经验并提高他的力量等级，就像在《地下城》中一样。


  就像桌面版的《地下城》一样，`Temple of Apshai` 使用随附手册中的打印描述来解释每个房间里有什么。这类似于桌面版冒险的布局，当玩家到达某个房间时，`Dungeon
  Master`（地下主）会读出房间的情况。在 `Temple of Apshai` 中，玩家是自己阅读描述。


  我经常玩 `Temple of Apshai`。因为属性与传统的《地下城》匹配并且可以很容易调整，我能够转换我的角色。当然，挑战在于 `Apshai` 没有使用职业或种族。你的角色是一个典型的冒险者，能够挥舞武器、从卷轴上阅读法语并使用魔法物品。我认定终极冒险者是游侠/盗贼；游侠可以施法，而盗贼在《高级地下城龙》第一版中可以阅读卷轴。`Temple
  of Apshai` 是当时最允许玩家在没有 `Dungeon Master` 的情况下“单人”玩其桌面角色的类 CRPG。


  1980 年，`Rogue` 发布了。`Rogue` 将 `Temple of Apshai` 推向了新的极端。它具有 `ASCII` 图形，怪物和物品由 `ASCII`
  字符表示，它建立了随机地下城生成器的概念。这个想法已经出现在《高级地下城龙地下城主指南》的桌面版中，随机表可以填充怪物和宝藏。这使得该游戏对于没有图形界面的笨
  终端来说是理想之选。在 `Rogue` 中，角色通过数字键盘移动。每个地下城都有一个三乘三的房间网格以及死胡同。与其他游戏不同，没有杂货店可以交换装备——玩家角色被迫只能使用他能找到的东西。后面的关卡包含了迷宫和角色瓷砖。


  多年后我在 `Atari 520 ST` 上玩了 `Rogue` 的图形版。我走得很远，但从未远到能拿回那传闻中的 `Amulet of Yendor`。即使你拿到了护符，你也必须再次“出来”，这并不是一项简单的任务。`Rogue`
  中最可怕的野兽 ur-viles，我当时并不知道这些生物最初出现在 Stephen R. Donaldson 的小说《不信者托马斯·契约编年史》中。


  1980 年，`The Tarturian` 在 Apple II 上发布。它拥有高达十个角色的大队伍以及各种职业：牧师、精灵、角斗士、魔法师、大力士、盗贼或巫师。它是最早严重依赖小队动态的游戏之一，使得每个小队成员都依赖对方获得成功（Barton
  2008:53）。


  1980 年为 `Apple II` 开发的 `Dungeon Campaign` 和 `Wilderness Campaign` 特色大约 80 名冒险者在一个巨大的群体中游荡——实际上更像是一支军队。这是首批具有负重限制和食物需求的游戏之一（Barton
  2008:54）。





  《奥术玛》（Ultima）拥有六项属性的点数购买系统：`strength`力量、`agility (dexterity)`敏捷、`stamina (constitution)`耐力、`charisma`魅力、`wisdom`智慧和`intelligence`智力。共有四种职业供选择：`fighter`战士、牧师、法师或盗贼；以及种种族，包括霍比特。《奥术玛
  3》允许控制一个由四名冒险者组成的队伍，而不是单个英雄。装备由整个小组共享。最重要的是，《奥术玛》是一个活的世界——人们会上班、回家、然后睡觉（Barton 2008:68）。


  1981 年，Sir-Tech 软件公司发布了《勇者宝窟：疯狂领主的证明场》（Wizardry: Proving Grounds of the Mad Overlord）。它是最早提供彩色画面的《地下城与地下龙》类
  CRPG 之一。正如后来的“金盒”（Gold Box）系列游戏一样，玩家创建一个队伍并在角色升级时在不同游戏之间传输。


  之前的游戏侧重于创建一个单个冒险者，而《勇者宝窟》完善了团队体验。玩家可以从多种种族中选择最多六个角色：`dwarf`矮人、`elf`精灵、`gnome`侏妖、`hobbit`霍比特和`human`人类；以及四种职业：`fighter`战士、`mage`法师、`priest`祭和`thief`盗贼。它包含六项属性：`strength`力量、`I.Q.
  (intelligence)`智力、`piety`虔诚、`vitality (constitution)`活力、`agility (dexterity)`敏捷和`luck`运气。还有四种精英职业，即后来出现在《地下城与地下龙
  3.0》中的声望职业：`bishop`主教、武士、领主和`ninja`忍者。队伍随后进入一个十层的迷宫，每一层都越来越困难。


  《勇者宝窟》使用第一人称视角和辅助文字描述的三维矢量图形。遇到怪物时，迷宫画面会被怪物取代。


  受《高级地下城与地下龙》的启发，《勇者宝窟》非常严酷。它没有地图程序，这意味着玩家必须在游戏进行时自己绘制地图，就像早期的桌面 RPG 一样。队伍可能会被随机传送到实体物体中，导致瞬间死亡——这也是《高级地下城与地下龙》的一个遗留。《勇者宝窟》在接下来的二十年里又出了另外八部作品。


  1982 年，Starpath 公司首次推出了《屠龙者》（Dragonstomper）。《屠龙者》由 Stephen Landrum 创作并利用了`Starpath
  Supercharger`加速器，它是雅达 2600（Atari 2600）唯一的角色扮演游戏（Glenday 2008: 156）。


  《屠龙者》的内容恰如其名涉及杀龙。角色的目标是从龙那里夺回魔法护身符。玩家在乡村间游荡，击杀随机遇到的怪物并获得金币和经验，从而提升他的`strength`力量和`dexterity`敏捷。在尝试集齐足够的钱贿赂守卫或寻找能让他通过的`ID`的过程中，角色探索了充斥着害虫、动物和人类威胁的小屋、教堂和城堡。


  在通过第一个挑战后，角色进入了受压迫的村庄，在那里他可以出售在野外捡到的物品并购买新装备。最多可以贿赂三名卫兵在最后的对决中帮助角色。当他觉得准备就绪时，他进入了`Dragon’s
  Cave`龙洞。


  龙洞是一条布满陷阱的长廊；有毒箭和魔法能量爆发。通过结合魔法和速度，幸存的角色发现自己进入了`Dragon’s Lair`龙穴。在巢穴中，游戏在角色和龙之间替向前移动。卫兵在战斗中充当火力。如果没有
  1983 年的视频游戏崩溃，《屠龙者》可能会成为使用`Starpath Supercharger`的雅达 2600 未来创新游戏的先河。


  同样在 1982 年，Kevin Kenney 为`TI-99/4A`电脑系统发布了《地狱隧道》（Tunnels of Doom）。《地狱隧道》由多达四名玩家组成，在标准的地下城探险中控制四个角色的命运。四人小队可以从`fighter`战士、`rogue`盗贼和`wizard`法师职业中选择。英雄职业仅可用。通过第一个挑战后，角色进入了受压迫的村庄，在那里他可以出售在野外捡到的物品并购买新装备。最多可以贿赂三名卫兵在最后的对决中帮助角色。当他觉得准备就绪时，他进入了`Dragon’s
  Cave`龙洞。


  龙洞是一条布满陷阱的长廊；有毒箭和魔法能量爆发。通过结合魔法和速度，幸存的角色发现自己进入了`Dragon’s Lair`龙穴。在巢穴中，游戏在角色和龙之间替向前移动。卫兵在战斗中充当火力。如果没有
  1983 年的视频游戏崩溃，《屠龙者》可能会成为使用`Starpath Supercharger`的雅达 2600 未来创新游戏的先河。


  同样在 1982 年，Kevin Kenney 为`TI-99/4A`电脑系统发布了《地狱隧道》（Tunnels of Doom）。《地狱隧道》由多达四名玩家组成，在标准的地下城探险中控制四个角色的命运。四人小队可以从`fighter`战士、`rogue`盗贼和`wizard`法师职业中选择。英雄职业仅可用。通过通过第一个挑战后，角色进入了受压迫的村庄，在那里他可以出售在野外捡到的物品并购买新装备。最多可以贿赂三名卫兵在最后的对决中帮助角色。当他觉得准备就绪时，他进入了`Dragon’s
  Cave`龙洞。


  龙洞是一条布满陷阱的长廊；有毒箭和魔法能量爆发。通过结合魔法和速度，幸存的角色发现自己进入了`Dragon’s Lair`龙穴。在巢穴中，游戏在角色和龙之间替向前移动。卫兵在战斗中充当火力。如果没有
