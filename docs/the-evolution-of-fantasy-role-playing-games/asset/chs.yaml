  # 前言


  当我们提交 John Gabriel 的 `Greater Internet Fuckwad Theory`（大互联网傻瓜理论）时，我们并不知道它在高等教育中心已经有了支持者。除非，当他们谈论它时，称之为`计算机中介通信中匿名性对去抑制行为的影响`。其实是一回事，尽管如此
  [Holkins 2004]。


  为什么要再写一本关于角色扮演游戏的书？有许多作者在各种媒介上写过很多关于奇幻游戏的内容，但从未亲身经历过它们的演变。我选择写这本书的原因之一是，我曾身其中。我经历过的游戏媒体种类，比一些创作当今最流行的大型多人在线角色扮演游戏（MMORPGs）的开发者还要广泛。有些学者虽然写过关于
  MMORPG 的书，但他们的游戏经验要少得多。游戏这种媒介并不老老，但游戏的内容远不止 MMORPG。


  我七岁时接触了《地下城与龙》，并玩了二十多年。青少年时代，我还没上大学就溜进大学电脑实验室玩多用户地下城（MUDs）。我玩过几乎所有形式的奇幻游戏。当我进入研究生阶段时，我已经是一个
  MUD 的管理员，并为我喜爱的游戏出版了几本桌面游戏补充资料。


  每年我都会参加长岛的 I-CON 并参加游戏小组讨论。我是随着这个展会长大的，从十二岁起几乎参加了每一次 I-CON。我还参加过 Dragon*Con 和 Bakuretsu
  Con 上关于游戏的讨论小组。


  当我进入密歇根州立大学读研究生时，我是一个带着使命的男人。学者们对男孩在网上玩的奇妙世界啧啧称舌，而我正面对着死亡威胁、与垃圾邮件发送者斗争并与其丑陋的一面作斗争。






  ## 引言


  正如《护环王》帮助塑造了奇幻游戏，它也帮助塑造了玩家聚集在一起游戏的方式。这正是我论文的切入点：匿名性存在不同的阶段，它们影响着人们聚在一起的方式，无论是通过装扮、在桌旁、通过电话还是在互联网上。游戏内角色和游戏外角色对游戏本身有着深远影响，这正是我们书中贯穿全文的主线。


  游戏社区中对历史的认知极度匮乏。桌面角色玩家似乎与产生《地下与城》的微缩游戏社区完全脱节。`MUD` 编写者并不理解《地下与城》主题的规则和假设。`MMORPG`
  开发者几乎单方面地忽略了 `MUD` 成功的因素，犯了 `MUD` 在十年前就犯过的同样错误。最近，真人角色扮演开始正式地将桌面游戏早已实施的“创新”引入到自己的游戏之中。


  简而言之，我们从彼此身上有很多可以学习的。这本书在很大程度上是关于这些不同游戏社区的共同体验，并试图概括奇幻游戏历史。我希望这本书能为作者和开发者提供基础，让他们了解《地下与城》不同版本之间的区别，以及如今各种游戏形式中常见的种族和职业。如果你是一个刚入行的开发者，一个想要怀旧的老兵，或者你只是喜欢游戏……这本书就是为了你准备的。


  《护环使》》将属于你；而行者们将面对那些邪恶的力量。对于你和你的忠实仆人来说，这将是一项任务，也许是劳作的终点。对于其他人，他们将代表这个世界：精灵、矮人和人类。


  通过这些词汇，J.R.R. 托尔金在 1954 年形成了冒险小队的基本结构，这种结构经受了无数奇幻原型和不断变化的媒介。尽管这种组合从精灵、矮人、人类以及霍比特开始，但它已扩展到可以想象的每一种种族。国籍、种族和职业定义了奇幻游戏类型中的每个英雄。你可以成为一个游侠者（如阿拉贡），也可以成为一个法师（如甘达夫），或者一个小偷（如比尔比）。


  然而，游戏体验中的这种组合根本上是人们的聚集。尽管玩家可能只控制一个角色，但这种组合构成了群体游戏的基础。不同背景的角色聚集在一起以实现共同目标，这种组合非常适合新玩家。它独立于角色关系，正如玩家自身一样。


  从这个角度来看，这种组合是游戏体验的框架。本书将探讨奇幻游戏中的原型和概念，以及玩家自身的角色功能。随着奇幻游戏体验的演变，表达它的媒介也在演变，从小说到微缩模型，从文本描述到三维化身，到玩家自身的装扮和表演。


  ## 媒体丰富度


  将 Daft 和 Lengel (1984:191) 的媒体丰富度理论应用于奇幻游戏体验，关于什么是成功且令人满意的游戏有很多。媒体丰富度理论认为，媒介具有消除歧义促进理解的能力。该理论有两个主要假设：人们希望克服交流中的不确定性，以及不同的媒介适用于不同的情况。


  Daft 和 Lengel 的媒体丰富度等级从高到低排序，标准是媒介提供即时反馈的能力、传输肢语言、表情和语调等多种线索的能力、自然语言的使用以及媒介的个人焦点。我们可以将媒体丰富度等级应用于游戏。


  ![graphic](img/content-0008.png)


  如表 1 所示，每种游戏媒介都带来了一种通过玩家传达角色信息的媒体丰富度水平。在光谱的一端是基于文本的游戏体验，除了玩家在键盘上输入的内容外，没有任何社交线索。在另一端是真人角色扮演（LARP），玩家装扮并扮演他们的角色，模糊了两者之间的界限。在这方面，媒体丰富度是承担另一个角色的关键因素。这并不是说总是想要高水平的媒体丰富度。某种程度的匿名有助于游戏过程。歧义性可能会强化特定游戏媒介的角色扮演。像
  `MUD` 和 `IF` 这样的文本游戏可以揭示角色的心理状态，并联系文学传统以及语言的节奏、声音和形状（Montfort 2010）。`MMORPG` 通过头像复制了部分
  LARP 的媒体丰富度，成功正是是因为它们的媒体丰富度：能够在三维空间中表达自我（Castronova 2005:69），这种方式类似于 LARP，但没有任何物理上的限制。


  ## 自我匿名性与他人匿名性


  在确定奇幻游戏如何代表一群玩家时，还有另一个需要考虑的问题：自我匿名性与他人匿名性。


  自我匿名性与代理感（Agency）紧密相关。玩家控制自己的角色、以他们希望的方式代表自己的能力，创造了一种控制感和参与感。通过创造代理感，玩家暂时忘记自己正在玩游戏，而只是在玩。白纸式的角色看起来可能是匿名的，但由于界面笨劣、规则复杂或玩家缺乏可信度，未能提供代理感。当实现代理感时，玩家可能会惊讶地发现他们所扮演的角色有了自己的生命（Sinha
  1993:120）。


  代理感发生在两个层面：局部和全局。在局部层面，玩家通过自己的所为以及环境对他的反应，以一种令人满意且真实的方式参与其中。全局代理发生在更高的层面，即故事的推进方式，使得角色的行动以及世界中的其他角色产生了逻辑后果（Mateas
  & Stern 2007:206）。


  他人匿名性是指玩家对他们所参与的游戏宇宙了解多少，包括他们对世界的理解。这被称为 `diegesis`（Montola 2010）。`diegesis` 是关于宇宙知识的总和，包括对过去、现在和未来的知识。在小说中，这个参考框架是从单一源点——叙述者感知的。在角色扮演中，每位玩家都独特地解读游戏体验——角色体验的重要性，既取决于关于宇宙的共享的信息，也取决于未共享的信息。在一个游戏宇宙中，不同的玩家完全可能拥有不同甚至矛盾的知识（Hindmarch
  2007:51）。






  在某些类型的幻想游戏（如桌面角色扮演和实景角色扮演 LARPs）中，缺乏匿名性改变了人际互动。感官知识的额外层次改变了面对面的互动（Fine 2009）。一个外貌一般的男性玩家完全可能认为自己正在有效地与一个外面的女性玩家互动，尽管他的富媒体线索与他试图呈现的角色之间存在冲突。尽管这个满脸胡渣的玩家可能认为自己有效地代入了角色，但游戏中与他互动的其他玩家可能并不认同。当他人表达不同意见时，这反过来又影响该玩家对自己的看法，而这种特征在单机游戏中是缺失的。不涉及与其他玩家互动的单机游戏只关注如何让角色对玩家来说可信；而多人游戏必须让角色不仅对玩家来说是可居住的，还要允许玩家为他人进入该角色。


  ## 参照框架


  “角色扮演”一词已代表了各种游戏形式。当我提到我玩过 `Dungeons & Dragons` 时，一位同事曾向我解释道：“我赢了那个游戏！”当然，她指的是电脑角色扮演游戏，在那种游戏中确实可以“通关”游戏。“角色扮演”一词现在已扩展到包含任何玩家在游戏世界中控制一个角色并在游戏过程中发展该角色的游戏（Hindmarch
  2007:47）。


  角色扮演游戏通过**共同创造**的行为与其他娱乐形式有所不同。角色扮演者通过个人感受和情感创造自己的体验。他代入一个角色，并以书籍或电影无法直接传递的方式感受角色的经历。通过这种方式，玩家通过一个独特定制的参照框架与游戏进行互动（Mateas
  2004:21）。


  在《共享幻想》中，Gary Alan Fine (1983:188) 将框架定义为“根据同时控制事件本身以及参与者对这些事件体验的组织原则而构建的情境化定义”。他将各种框架拆解为角色扮演游戏体验的不同层次。


  ### 初级框架


  初级框架是游戏玩家通常所说的“现实生活”。它与游戏是分离的，但又是游戏密不可分的一部分。现实生活被理解为在规则之外的，其现实性可能会定义甚至矛盾游戏本身（例如，因为玩家需要上班而必须快速结束游戏）。虚拟世界与现实生活之间的膜变得越来越通透，允许参与者从每种游戏媒介中提取他们最喜欢的元素（Castronova
  2005:158）。


  ### 次级框架


  次级框架是玩家框架。玩家根据他们理解的规则在游戏内运行。他们根据游戏允许范围操作角色，进行属性检查，承受伤害，并以其他方式抽象地与游戏变量进行互动，通常通过随机数生成。


  有些玩家习惯于从纯粹模拟的角度与游戏规则进行互动，完全关注生命值、角色属性等，而不是为他们的角色提供任何叙事结构。许多媒体线索较少的单机游戏提供这些规则作为捷径，以弥补叙事结构的缺失。智力、智慧和魅力属性定义了角色的心理特征，而玩家可能无法从叙事角度提供这些特征。


  ### 三级框架


  三级框架是游戏的角色扮演属性。玩家就是他们的角色，以一种很少有游戏能模仿的方式扮演角色。大多数游戏（如象棋）都缺乏这一点。三级框架是角色扮演游戏脱颖而出的。


  ## 角色对现实的意识


  玩家就是他们的角色，以一种很少有游戏能模仿的方式扮演角色。大多数游戏（如象棋）都缺乏这一点。三级框架是角色扮演游戏脱颖而出的。


  ## 玩家对角色的无知


  正如玩家可以为角色提供他们通常不具备的信息一样，玩家不可避免地缺乏角色应该知道的信息。


  ## 游戏主（境）


  游戏世界是巨大的宇宙，由另一家游戏公司或游戏主构建。因此，每个游戏宇宙的详细程度取决于投入其中的时间和精力的。






  因为角色扮演不仅仅是进入一个角色，更是去演绎它，叙事性沉浸需要与其他人的互动。而且由于并不总是存在确定玩家对其角色的沉浸程度的方法，发现这种程度的唯一方法就是与角色一起角色扮演。这种互动可能会因为沉浸程度的巨大差异而产生违和，因为一个角色扮演者的叙事世界（diegesis）部分是由他与其他玩家的互动定义的，而一个“掷骰子玩家”（roll-player）的角色则由其主观性（agency）定义。角色扮演者需要其他玩家配合他的角色进行表演，而掷骰子玩家则不需要。


  在本文语境下，我们将角色扮演定义为不仅是进入角色，还与他人互动。初看之下，似乎没有必要回顾单机游戏体验，因为它没有反映真正的社交互动；然而，即使是单机游戏也尝试模拟一组角色，由计算机扮演其中一个。计算机模拟这些角色的能力有效决定了游戏内互动的程度。或者换句话说，计算机是玩家的另一种形式。


  ### 时间


  时间是所有形式的幻想游戏共有的货币。体验一个角色需要时间。由于幻想游戏是一种娱乐体验，这种时间投入要求玩家通过选择游戏而非其他活动来做出权衡。


  但乐趣是有代价的。它阻碍我们工作，并可能让我们忽视其他责任。不同形式的游戏在留住和增长用户群方面有不同的考量，其中最重要的一点就是可玩性。幻想游戏的本质是体验一个角色，投入的时间越短，玩家体验主观性的窗口就越小（Juul
  2004:131）。


  实时发生的第一人视角需要大量的投入。对大型多人在线角色扮演（MMORPG）常见的抱怨之一是，它们无法根据玩家的意愿轻松进入和退出。MMORPG 是实时的，因此玩家必须考虑现实生活中的干扰，以防整个冒险小队在如厕休息期间全部阵亡。将这种时间投入与帖制游戏（play-by-post
  games）进行对比，后者从本质上就需要有限的投入和互动（Douglas and Hargadon 2004:203）。


  MMORPG 和 MUD 特别有一种“刷子”（grind），即通过重复执行任务来希望获得某些优势，无论是更高的经验等级还是获得某些物品。玩家花费宝贵的时间刷这些无聊的任务，以获得进入游戏其他部分的权限。即使游戏设计师也承认了这些无聊的部分，通过创建小游戏来在必要的空档时间让玩家有所忙（Taylor
  2006:85）。


  为什么会有人创建一个无聊的游戏呢？因为幻想游戏的始祖《地下与城》（Dungeons & Dragons）原本设计是为了在有限但密集的时间段内进行的。事实上，桌面游戏很大一部分时间被花在了游戏的准备上，正如《地下与城》的创始人之一加里·盖格克斯解释的那样：


  > 最广泛的要求是时间。战团主持人必须有足够的时间来满足玩家的需求，在活动开始之前，他必须花费几个小时来绘制他的“地下城”和上方地形地图 [Gygax 1974:3]。


  在游戏过程中，地下城会跳过无聊的部分并强调动作。早版本的《地下与城》无非是穿插在潜在危险威胁之中的动作。早期的队伍花费大量时间寻找陷阱、绘制地图，并精细地执行一些他人可能认为无聊的任务，但这些任务在游戏语境内是生存的重要斗争。


  通过将《地下与城》的框架应用于拥有数千名玩家和持久世界的游戏，该系统就崩溃了。《地下与城》第四版通过修订每个职业，精确地解决了这一缺陷，使得不再有任何“无聊”的等级。


  乐趣的时间成本对游戏的未来产生了影响。现代经济为劳动者提供了比以往任何时候都更多的灵活性，但由于这种灵活性，空闲时间被分成了更小的增量（Thom 2010）。更容易进入且适应这种新空闲时间结构的游戏很可能作为主流爱好生存下来（Vesna
  2004:250）。


  ### 美国文化


  本书主要从美国文化的视角聚焦于幻想游戏。尽管非西方文化对游戏有影响，但它们超出了本书的范畴。


  将《战锤幻想角色扮演游戏》（Warhammer Fantasy Role-Playing Game Fantasy Flight Games 2010）与《地下与城》进行比较，说明了不同文化之间游戏方法的差异。《地下与城》充满了希望和力量，转角都是金币。《地下与城》的官方战团世界出现缓慢，而是鼓励游戏大师创建自己的世界——这符合美国个人主义。另一方面，受欧洲启发的《战锤》是一个充满丰富且古老历史的世界，在战争的背景下混合着脆弱的贵族和老朽的颓废。《战锤》捕捉了《指环王》许多《地下与城》未涵盖的方面，继承了欧洲国家的遗产，而美国幻想游戏强调通俗动作。


  日本 CRP 也影响了幻想游戏。冒险可以包含“可爱的”（kawaii）元素，即卡通化的角色和愚蠢的任务与严肃且具有威胁性的情境并存。这种对比对美国观众来说可能感到违和，但它完全符合日本文化，日本文化已经从时尚到动画（anime）再到漫画（manga）到角色扮演游戏的一切中接受了可爱文化（Barton
  2008:208）。


  由于没有战争游戏历史像在欧洲和美国那样影响游戏文化，日本 CRP 是可爱、动作、幻想和科幻的混合体。日本 CRP 对现在电子化玩角色扮演游戏的方式贡献了一些重要的改变，但我们主要关注的是欧洲《指环王》的遗产。


  然而，如果《指环王》是欧洲的，为什么它在美国会如此流行？部分原因在于，《地下与城》为幻想类型充当了某种翻译的角色。《战锤》一样，中洲沉浸在一个拥有丰富传说和历史的世界中。《地下与城》为幻想游戏增加了通俗感，这是美国文化的重要组成部分。通俗小说以多才多艺的英雄、不断的动作、异域和邪恶派为特征——它是催生现代漫画产业的类型。


  尽管《地下与城》及其同类产品被定位为仅限于玩家想象力的幻想角色扮演，但它们实际上受到共同原则的约束，使幻想角色扮演具有明显的美国特色。根据 Fine（1983:76）的定义，这些元素是无限的善、一个界分明对立的世界、一个只通过暴力推行其信条的恶，以及努力工作的价值。






  冒险的本质建立在一个扩张时代之上，且不顾这种扩张所带来的后果。冒险者并非殖民征服者，而是他们家园的英雄，无需承受非主导社会所遭受的任何后果。当你从某人手中夺走宝藏时，另一个人必然失去了它，但在
  `Dungeons & Dragons` 中，这通常是指一个不再能主张所有权的古代文化。在 MMORPG 中，无休止的增长近乎于一种讽刺，因为成群的所谓的独特冒险者驻扎在可以产生无限怪物和宝藏的地下城前。这种“刷肝”范式在
  `Progress Quest` 中曾被讽刺，那是一个完全不需要玩家输入就能让角色升级的应用程序（Grumdrig 2008）。


  在 `Dungeons & Dragons` 中，善与恶是公理。玩家有明确的“派系”可以宣忠于某一方，他们的忠诚度会影响自己的角色，从能力到外表如此。在美国，这种“要么听我的，要么走我的路”的哲学已成为一种日益主导的话语形式，在政治和媒体领域表现最为激烈。它已经蔓延到通信渠道本身，不同的电视网络互相指责对方偏见，形成了各自的“阵营”语言。


  `Dungeons & Dragons` 对战斗的关注可以追溯到其战争游戏的根源，拥有大量以冲突为核心的规则。然而，尽管有战斗规则，`Dungeons & Dragons`
  并不专注于无意义的暴力、折磨或堕落。当 Gwendolyn F.M. Kestrel 和 Duncan Scott 编写的《Book of Erotic Fantasy》等作品由第三方出版商出版时，它们引起了
  D&D 所有者 `Wizards of the Coast` 足够的震动，以至于 `Open Game License` 经过修订，以防止其他此类书籍的出版。`Wizards`
  随后出版了《Book of Vile Darkness》，该书涉及了类似的“成人”内容（Cook 2002）。


  通过辛勤劳动换取丰厚报酬的新新教工作伦理在整个美国文化中显而易见。它影响了对社会主义的许多反应，某些人指责社会主义奖励了那些没有“努力”就换取生计的懒汉。升级、获得力量和经验值为幻想游戏提供了一条非常清晰的权力之路，奖励了勤奋。这种伦理在在线角色扮演游戏中被颠覆了，在这些游戏中，英雄们全天候地冒险，并且可能通过反复杀死对玩家角色没有威胁的生物来“刷”出力量。


  ## 玩家


  2000 年，`Wizards of the Coast` 进行了规模最大的角色扮演调查之一，向超过 20,000 个家庭、年龄在 12 到 35 岁之间的 65,000
  多名受访者发送了明信片调查。随后，约 1,000 名来自“筛选”受访者完成了随访调查。在那项研究中，当时 `Dungeons & Dragons` 的品牌经理
  Ryan Dancey 发现，美国 6% 的人口玩桌面角色扮演游戏（约 550 万人），3% 的人每月玩一次（约 225 万人）（2000）。


  角色扮演玩家来自不同的背景，但他们之间有足够的共同点，可以被分为几类不同的类别。根据 Fine (1983:49) 的定义，玩家可以分为以下几类：军事历史/战争游戏、幻想文学知识、现实世界神话知识、通历史/社会科学知识、现实世界物理科学知识，以及像
  `Society for Creative Anachronism` 这样的实景角色扮演小组（SCA Webfolk 2010）。对这七类类别中的任何一类产生兴趣，都会增加一个人对角色扮演感兴趣的可能性。


  得益于 `Games Workshop` 的 `Warhammer` 微缩战争游戏，军事历史/战争游戏现在有了明显的幻想倾向。这一类别可以进一步分为军事历史爱好者和战争游戏玩家。在
  `Wizards of the Coast` 的调查中，该人群的 17% 每月既玩桌面角色扮演游戏玩微缩战争游戏。


  `Dungeons & Dragons` 早已偏离了它最初的战争游戏根源。在 2 世纪 70 年代后期，`Dungeons & Dragons` 仍在努力从其起源的战争游戏文化中独立出来，因此许多玩家是从战争游戏进入角色扮演的。在在
  Dungeons & Dragons` 出现之前，战争游戏通常是对现实历史事件的军事模拟，这吸引了军事爱好者。鉴于 Fine 的《Shared Fantasy》于
  1983 年出版，军事历史爱好者可能不再像以前那样认为角色扮演具有吸引力。


  幻想文学知识的最好例子是《指环王》系列热热的飙升。《指环王》电影将幻想带入了主流视野，并对角色扮演游戏和幻想展会都产生了深远的影响。`Decipher` 出版了在中土背景下的授权角色扮演游戏和收藏牌游戏。在三部《戒环》电影上映期间，参加类型类型展会的女性人数激增。幻想文学知识也可以涵盖恐怖和科幻。作者
  H.P. Lovecraft 作品中的许多元素也是 `Dungeons & Dragons` 的一部分（Jacobs 2004）。


  对神话和替代性宗教的兴趣无疑可以激发人们对游戏的兴趣。与神话相关的替代性宗教，如 `Asatru` 和 `Wicca`，有助于建立游戏中使用的通用语言。`Dungeons
  & Dragons` 的每一个版本中都呈现了丰富的神话。


  通识历史和社会科学知识可能对潜在的游戏主（Game Masters）最有吸引力，他们对细节幻想世界的运作方式有更好的洞察力和控制力。他们可以使用历史作为模板，或者用自己的转折重构历史事件，例如
  `Cthulhu Dark Ages` 或 `Victorian Age Vampire`。


  现实世界物理科学知识与科幻角色扮演游戏更相关。与历史爱好者类似，游戏主可能更有兴趣构建一个运作或扭曲科学原理的详细世界。惊讶的是，并没有哪一款科幻游戏能像 `Dungeons
  & Dragons` 统治幻想领域那样清晰地统治角色扮演领域。


  实景角色扮演（玩家在身体上扮演一个角色）与角色扮演游戏是天然契合的。玩家能够想象他们的幻想，因为他们已经在其他游戏形式中执行过许多此类动作。虽然 Fine 将这种比较限制在
  `Society for Creative Anachronism`，但该定义可以扩展到任何具有现实生活身体经验并在角色扮演游戏中使用该知识的人，包括武术家、退伍军人和即兴表演演员。


  Fine 对玩家的评论中漏掉了 `CRPGs` 和 `MMORPGs`，这些游戏在随后的人气日益增加（Taylor 2006:77）。在 `Wizards of
  the Coast` 的调查中，46% 的桌面角色扮演者每月也玩电脑角色扮演游戏（2000）。


  Dancey 得出结论，那种同时玩桌面角色扮演游戏、`CRPGs` 和微缩战争游戏的虚构“爱好玩家”仅占总市场的“极小、极小的一部分”。极少数玩家玩超过一类爱好游戏，极少的人玩三者。






  然而，当玩家进入桌面游戏世界时，他们都有一个共同点——他们几乎全是男性。Fine（1983:62）估计，在 20 世纪 80 年代初，女性玩家仅占 10%。威之术（Wizards
  of the Coast）的调查显示，仅有 19%的女性玩家每月玩游戏（2000）。


  但事实并非如此。对 12 岁及以下儿童的研究（Child and Child 1973）发现，女孩对想象性游戏的兴趣比男孩大。角色扮演包含了许多其他面向女性青少年游戏中常见的属性，包括通过购物来装备角色、角色设计与定制、拥有和养宠物的能力，以及扮演更有吸引力和更成熟的角色。那么，为什么没有更多的女性参与角色扮演游戏呢？


  答案可能在于游戏的时长。桌面角色扮演需要与一群人坐在桌旁很长时间。男孩的想象性游戏往往比女孩持续得，涉及的人数也更多。正如我 3.5 版`Dungeons &
  Dragons`（地下城）活动中的一位女性玩家所解释的：


  > 我在 16 岁和 26 岁时分别经历过两次传统的 D&D 体验。我喜欢解谜，但在两次经历中，我都发现发现对手优劣点的延迟缺乏视觉化实时战斗的那种兴奋感。因此，在实时视频游戏中，一个可能受上腺素影响的角色反应或陈述会更容易获得。遗憾的是，对我来说，传统的
  RPG（角色扮演）就像从泳池的一端慢跑到另一端一样无味 [Melissa Tresca 2010]。


  当然，这些挑战是可以克服的。然而，其他其他消除了游戏时长限制和长时间坐在桌旁要求的角色扮演形式，似乎更受女性欢迎。例如，`MMORPGs`（大型多人在线角色扮演游戏）专注于角色和物体的定制，不需要与同伴长时间相处。相反，`LARPs`（实景角色扮演）包含了桌面角色扮演游戏中所有的想象性游戏，但更关注个体之间的互动，而不是受限于桌桌的群体。


  还有其他让女性远离游戏的问题，这些问题在任何男性主导的娱乐形式中都存在。男性主导的游戏具有自我强化性质似乎对女性不那么友好，因为有这么多男性在玩。女性在幻想文学中可能被描绘成性对象这并没有帮助；男性玩家的沙文主义——他们玩游戏的明确目的是躲避妻子和女朋友——进一步加强了性别隔阂（Archer
  2004:268）。


  正如 Ryan Dancey 在调查中指出的：“很明显，女性玩家构成了爱好游戏观众的重要组成部分；基本上占了总市场的五分之一。这代表了数百万活跃的女性爱好玩家总人口。然而，作为一个群体，女性在爱好上的花费比男性少”（2000）。


  “女玩家”（girl gamer）一词正慢慢被女性收回，并作为一种自豪的勋章。随着其他形式幻想游戏的发展，许多阻碍女性参与的障碍已经消失。在线游戏是玩家格局最有前景的改变。我们只能希望，一个更加平衡的游戏群体也能继续改变纸笔角色扮演文化。


  ## 我的幻想游戏体验的演变


  幻想游戏的演变在在 971 年取得了巨大飞跃，当时加里·盖格克斯（Gary Gygax）通过`Chainmail`将《指环王》中发生的史诗战争转化成了战争游戏规则。中世纪微缩模型战争无无应有：霍比特人、精灵、巫师和战士。正如《指环王》的种族偏好一样，部队类型主要通过种族识别。然而，并没有建议玩家去扮演他们角色的身份（Mona
  2007:26）。


  直到 1974 年，每个小队的真实细节才被充实。随着纸笔角色扮演游戏`Dungeons & Dragons`（地下城与龙）的出现，玩家可以扮演个体。他们不再是一支没有脸的精灵军队——他们是自己任务中的远结社成员，就像莱格拉斯、吉姆和弗罗多一样。他们的任务主要侧重于地下城探索，这是对穿越莫瑞亚矿坑的致敬，那里是第一个充满了满待杀戮的怪物的冒险地下城，如洞穴巨鬼、兽人、地精和魔洛魔（Balrogs）。由扮演所有对手的人担任地下城主（`DM`）是恰当。这个角色需要相当大的责任和组织能力，因为`DM`处理所有未由其他玩家扮演的角色。


  我在小学就接触了`Dungeons & Dragons`，在熟悉《指环王》之前，我已经玩了一段时间。令我非常惊讶的是，所有的幻想元素都在那里。进一步的研究发现，它们在`Dungeons
  & Dragons`中正式存在，直到托尔金遗产委员会要求`TSR`删除对魔洛魔和霍比特的版权保护名称。《指环王》系列帮助我在初中写了三篇读报告。（当然，《指环王》在技术上并不是一部三部曲——它实际上是分布在三本书中的六卷。）


  我从“红盒”基础套装开始玩`Dungeons & Dragons`。我妈妈帮我玩了第一场游戏。一旦我掌握了门道，我就召集了邻居（Kenny, Kevin 和 George），在我担任`Dungeon
  Master`的角色，我们出发了。


  我姨妈 Vickie 并不理解 Advanced Dungeons & Dragons`（进阶地下城）和`Basic Dungeons & Dragons`（基础地下城）的区别，她给我买了所有的精装书。我带着好奇的心情阅读它们，希望有一天能进步到高级。


  当我小学毕业时，我接触到了更大的玩家群体。人数增加到了四个：两个 Jason、Doug 和 Oren。当我上高中时，规模变得更大：Rob, Jeremy, Kurt,
  Bill 以及其他来来去的人。我们每个周末都玩几个小时，有时周末玩两次，不知道`Dungeons & Dragons`主要深受大学生喜爱。在我高中毕业前，我们玩了两个完整的战，一个使用基础版，另一个使用第一版规则。






  然而，即使是《Zork》也无法捕捉到角色聚会的氛围。在多用户地下城（MUDs）出现之前，文本游戏一次只能处理一名玩家。1978 年，埃塞克斯大学的 Roy Trubshaw
  和 Richard Bartle 创造了第一个 MUD，这是对其前身地下城爬行类游戏的的致敬（Glenday 2008: 170）。MUD 效仿了单机电脑游戏的足迹，允许玩家像“护戒环游团”一样成组一起冒险。其目标是积累足够的积分来像甘达夫一样成为巫师，从而获得凡人所不具备的力量。


  我与 MUD 的缘分始于 `Ivory Towers`（象牙塔）。在 `Ivory Towers` 中，两个立场对立的城市——一个混乱的，一个守序的——在无休止的斗争中相互战斗。我的角色
  `Lamech` 在一个等级森严的混乱祭司阶层中不断晋升。`Lamech` 是一个非战斗人员，在杀戮其他玩家角色是常态的血腥世界里，这堪称新奇。


  值得注意的是，当我玩 `Ivory Towers` 的同时，`Indra Singh` 正在玩竞争对手 MUD `Shades`（1999）。`Shades`
  的玩家在 `Ivory Towers` 中备受敌视，他们会在 `Shades` 宕机时（或他们无聊时）入侵，在一场来得快结束得也快的血腥入侵中大快人心地进行大屠杀。


  最终，我转向了芬兰的 LPMUD `BatMUD`。我在 `BatMUD` 上结识并失去了许多朋友，甚至在那里遇见了我的配偶 `Amber`。在作为一名名为 `Talien
  Radisgad` 的牧神圣骑士度过了一段长而传奇的历史后，我离开了 `BatMUD`，加入了另一个 LPMUD —— `RetroMUD` 的编码团队。


  在 `RetroMUD` 担任管理员十余年的经验促成了我的硕士论文——*匿名性通过计算机介导通信对去抑制行为的影响*。我还担任了 `Gamers.com` MUD
  板块的编辑评审员，这让我有机会在 MUD 鼎盛时期观察其广度与深度。


  鉴于《龙与地下城》在美国校园的流行，我在大学期间却很难找到玩纸笔游戏的玩家，这真是很讽刺。当我搬到密歇根州攻读硕士学位时，我和来自 `RetroMUD` 的玩家们进行了一场简短的第二版战役：`Darren`、`Damien`、`Amber`
  和 `Chris`。


  1980 年，计算机技术已经进步到使得图形可视化成为可能。由 `Michael Toy`、`Glenn Wichman` 和 `Ken Arnold` 创建的
  `Rogue` 弥补了旧文本游戏与新图形之间的鸿沟，用文本符号替换了地下城图标。


  `Rogue` 是一场随机生成障碍的孤独地下城爬行游戏。目标是从地下城的最底层获取 `Yendor 护 amulet` 并带着它逃脱。我在 `Atari 520
  ST` 上大量玩过 `Rogue`，但从未到达过底层。`Ur-viles` 无法避免地出现了，一切化为乌有。


  随着计算机的进步，MUD 也随之进步。当图形细节丰富到可以像 `Chainmail` 使用微缩模型一样表现角色时，MMORPG 变得可行。第一个 MMORPG
  是《冬夜堡垒》（Neverwinter Nights），它于 1991 年在 `America Online` 上首次亮相（Glenday 2008: 156）。它拥有二维图形界面，为玩家提供了俯瞰宇宙的视角。队伍被建立，地下城被探索，“护戒环游团”的丰富传统得以延续。


  20 世纪 90 年代后期，我成为了 *All Game Guide* 的编辑评审员。电脑游戏如此之，难以跟上。这让我领略了 `PC` 平台上丰富的游戏种类。


  到 1997 年，随着《Ultima Online》的出现，MMORPG 领域爆发。由 `Richard Garriot`、`Starr Long`、`Rick
  Delashmit` 以及后的 `Raph Koster` 创建的 `Ultima Online` 承担了在地下城之外创建一个完全现实世界的挑战，该世界可以支撑整个冒险者、村民和怪物群体。`Ultima
  Online` 它的上方四之三视角相比《冬夜堡垒》有所改进。我试用性玩过 `Ultima Online`。


  我是 `MUD-Dev` 邮件列表的活跃成员，MUD 创作者和 MMORPG 合作者在上面平等地交流。在那段时间，MMORPG 编码人员分享了他们面临的挑战，这些挑战是
  MUD 编码人员已经应对多年的挑战。我与一些 MMORPG 的创始人进行过几次建设性的对话，包括 `Koster`（2010）。尽管格式发生了变化，但让人们聚集在一起进行宏大古代奇幻冒险的问题仍然是一样的。


  1999 年，《永恒之地》（EverQuest）提供了一个超越基于格子表示的三维图形环境（Glenday 2008: 170）。角色可以行走、奔跑、跳跃、游泳，后来还可以骑坐坐骑。《永恒之地》之后是
  1999 年的《Asheron’s Call》和 2001 年的《魔洛黑暗时代》（Dark Age of Camelot）。我玩了 `Asheron’s Call`
  的三个月免费试用。


  开放游戏许可（`OGL`）运动于 2000 年到来。`OGL` 是由 `Wizards of the Coast` 发布的一种用于角色游戏的开放内容许可。由 `Ryan
  Dancey` 牵头的 `OGL` 运动让数百家小公司有机会为《龙与地下城》贡献内容（Archer 2004: 273）。在 `OGL` 下，我曾为包括 `Alderac
  Entertainment`, `Goodman Games`, `Malladin’s Gate`, `Otherworld Creations`, `Paradigm
  Concepts`, `Privateer Press`, `Reality Deviant Publications`, `RPG Objects` 和 `Ronin
  Arts` 在内的多家机构撰写过文章，还包括 *Dragon Magazine*、*Pyramid* 和 *RPG Times*。我与《龙与地下城》的持久恋至今仍在；我是
  `RPG.net` 和 `Examiner.com` 的动作专栏作家（Tresca 2010）。





  本书按照幻想灵感的顺序结构而成。从托尔金的作品开始，我们追踪了游戏演变为微缩模型战争的路径，而这反过来又了桌面角色扮演游戏。从那里，分化出了多条路径，如互动小说、回帖制（play-by-post）和
  CRPG。随后是 MUD 和 MMORPG。我们最后以实景角色扮演（LARP）结束，它们已经沿着各自独特的道路不断发展。


  在全文中，我试图追溯一条共同的历史叙事，并将其与个人的经历进行对比。尽管我玩过许多不同的游戏，但我并没有参与书中提到的每一段游戏历史。只要可能，我都请了玩家、设计师和游戏学者来弥补我经验上的空白。每一章分为以下几个部分：历史、伙伴、叙事、个性化、风险、角色和地位。


  ### 历史

  历史部分对每种游戏媒介的历史提供了必不可少的要概述。由于许多原因，游戏界这段模糊的历史充满了矛盾，其中最重要的一点是，对于设计师来说，“抢先”是保护其知识产权的最佳利益。游戏何时发布、其说明书何时出版，以及究竟是谁拥有游戏的哪些知识产权元素，这些出了本书的范围。每个历史章节都绝不是对游戏的定论。其他作者曾专门用著作研究某一种游戏媒介，例如巴顿的《地下城与桌面》（*Dungeons
  & Desktops*）对计算机角色扮演游戏的广泛概述，以及尼克·蒙特福在《扭曲的小径》（*Twisty Little Passages*）对互动小说的探索。我的目标是展示各种游戏媒介之间的共同性。


  ## 伙伴

  伙伴部分涵盖了团队合作如何成为角色扮演游戏的根本组成部分。我们回顾了玩家如何在游戏中找到彼此，他们如何作为一个团队合作，以及每种游戏为团队游戏提供的支持。


  ### 叙事

  叙事侧重于游戏通过游戏内影响和游戏界面传达的整体信息。声称关于故事的游戏可能会因为给玩家无尽的杀怪机会而削弱这一目标。承诺提供沉浸式体验却只提供“+1 火之剑”的角色扮演游戏未能兑现承诺。叙事涵盖了世界观、开发者所列出的的关键概念、他们在现实生活中所继承的文化，以及受到托尔金等早期幻想作家设定的流行俗元素的影响。


  ### 个性化

  个性化部分回顾了游戏在多大程度上为了适应玩家需求而被修改。在小说中这完全不会发生，但在互动游戏中，这是定义特征之一。CRPG 专门为玩家服务，根据其需求对游戏进行个性化。在更动态的尺度上，桌面游戏主持人（DM）会根据其小组提供相应的个性化内容，平衡大量的变量，以在所有参与者之间找到共同点。


  ### 风险

  风险部分提供了角色在世界上存在的动力。它将他们结合在一起并鼓励他们集体工作；为他们提供击败的共同敌人，以及通过连续击败该敌人来前进的手段。我们主要关注英雄幻想，这必然涉及暴力冲突。


  ## 角色

  角色部分涵盖了广泛的话题，包括玩家角色的性别、种族和职业。这些角色可以是严格或松散地定义，由叙事或由玩家决定。它们分为创造者角色、参与者角色和角色角色。角色的深度反映了游戏的情况，也反映了玩家的情况。关于角色信息丰富的角色需要玩家投入更多——而那些提供极少信息的角色几乎完全依赖玩家来填充空白。我还涵盖了玩家自身的人口统计特征，以及他们为了玩游戏而承担的元游戏（meta-game）角色。


  ## 地位

  地位部分还包括等级、社会地位和晋升。升级和力量提升是一个明显的美国概念，我们稍后会进行详细探讨。在多人游戏中，地位与这种力量增长相关，因为它提供了一种等级制度，这种制度被游戏本身公开或微妙地鼓励。


  多年来，游戏发生了一些意想不到的转折。本书的目标是追踪“伙伴”的起源，以及它在文本、图形、在线和真人媒介中对角色和玩家的应用。通过研究幻想游戏如何跨媒介演变，可以学到很多关于我们自己的“伙伴”未来的知识，无论是在幻想世界中还是在餐桌旁。


  # 第一章


  *魔指环王*


  它是如何影响 D&D 游戏的？噢，当然有很多。几乎所有的玩家都是 J.R.R. 托尔金的超级大忠实粉丝，因此他们坚持让我尽可能在游戏中加入尽可能受托尔金影响的内容。任何记得最初版
  D&D 游戏的读者都会知道里面有巴洛格（Balrogs）、树人（Ents）和霍比特人。后来这些被移除了，并被新的、非托尔金元素所取代——巴洛魔神（Balor demons）、树妖（Treants）和半身人（Halflings）[Gygax
  2007]。


  *引言*


  约翰·罗纳德·雷厄尔·托尔金（J.R.R. Tolkien）的伙伴会结构首次在《魔指环王》中建立。伙伴会由九个人组成，包含了精灵、人类、霍比特人、矮人和一种可以被视为天使的生物（甘道夫）。这个数字的选择是为了对抗反对他们的九位戒灵骑士（Ringwraiths）。


  伙伴会的每位成员都代表他们的种族。莱格拉斯（Legolas）体现了精灵典型的弓箭和潜行特质，吉姆利（Gimli）代表了狂暴的矮人战士，而波罗米尔（Boromir）则是人类所有自私与高尚的类比物。这些角色建立了塑造了此后幻想游戏的原型。


  在游戏中，“伙伴”（Fellowship）是一个古老的词。更常见的术语是“队伍”（party），是“冒险小队”（adventuring party）的缩写。“小组”（Group）也常用于大型在线角色扮演游戏（MMORPG）。尽管它们的构成不同，但“队伍”是一个跨游戏媒介的一致的幻想基石。它们所有的根源都源自托尔金的中土世界。


  《霍比特人》和《魔指环王》通过托尔金对细节和世界构建的痴迷塑造了幻想游戏。与典型的“剑与魔法”小说不同，托尔金的作品跨越了史诗般的战斗，融合了现实世界的语言和神话。这并不是要削弱其他作者对幻想游戏的贡献——罗伯特·E·霍华德、迈克尔·摩尔库、弗里茨·李伯和
  H.P. 洛夫拉特都是主要的贡献者——而是为了强调托尔金对后来被称为“高幻”的贡献的重要性 (Barton 2008:18)。


  尽管地下城与地下在很大程度上模仿了中土世界及其人民，但两家游戏公司拥有该世界的明确许可：铁冠公司版的《中土角色扮演游戏》（1997）和 Decipher 出版的《魔指环王角色扮演游戏》（2002）。《中土角色扮演游戏》使用了《角色大师》（Rolemaster）规则的简化版。两者之间，《魔指环王角色扮演游戏》与最新版本的地下城与地下有更多共同点。


  我并不是一位托尔金学者。我对托尔金的知识仅限于读过《霍比特人》、指环王三部曲、多次观看彼得·杰金的电影，以及将托尔金世界融入其系统和背景的角色扮演游戏。本书的目标是建立角色扮演游戏与其自托尔金愿景之间的联系，而不是对其作品进行广泛分析——这项任务留给更有资格的学者。





  尽管孤胆英雄在小说中很受欢迎且简化了剧情，但角色扮演游戏通过合作创造了英雄主义叙事。“护环会”创造了伟大故事要素的基础：一个由不同种族、文化、职业和目标组成的社区，他们为了更大的利益而汇聚在一起。


  如前所述，护环会的人数设定是为了对抗戒戒幽灵的数量。然而，这一经典套路并没有延续到传统的奇幻冒险队伍中。传统的 `Dungeons & Dragons` 建议有二至六个角色（Slavicsek
  2005:12）。`Middleearth Role Playing` 游戏在其示例游戏中选取了四名玩家。`Lord of the Rings Roleplaying
  Game` 在其示例中仅有两个玩家，远少于护环会的九人，但建议拥有独立且独特的角色以避免重叠（Long 2002:76）。


  护环会的九人设定在不同的奇幻流派中并不完全适用。即使是托尔金也将护环会分成了更小、更易管理的小组。早期的 `Dungeons & Dragons` 冒险活动详细描述了多达十名冒险成员作为示例角色，暗示这十个人可能同时被操控。


  `Dungeons & Dragons` 游戏中扮演的角色数量通常受限于可用玩家的数量。找到九个玩家很难，更不用说挤进同一个房间里了。对 `ENWorld` 玩家的一项调查显示，62%的人与五六名玩家一起玩（Lorne
  2007）。人数超过八人的比例不足 2%，这与托尔金的最初愿景相去甚远。相比之下，`World of Warcraft` 将队伍限制为五人（WoWWiki Staff
  2010）。


  ### 叙事


  托尔金在其史诗作品中所取得的成就扩展了标准小说和情节结构的边界。世界本身对于行动来说与其中的角色同样重要。游戏开发者被这种世界构建的形式所吸引，因为它实现了空间叙事，而这又非常契合叙事中的多个切入点——这对于多人游戏来说尤为重要。这些丰富的世界为游戏开发者表演艺术提供了舞台（Jenkins
  2004:122）。


  《指环王》确立了任务的基本轮廓：性格迥异的角色为了共同的敌人聚集在一起，通过获取一个代表其力量的物品来消灭他（Harrigan and Wardrip-Fruin
  2007:3）。这种标准任务在计算机游戏术语中有时被称为“取物”任务。通常会有较弱但同样可怕的小弟守护着邪恶宿敌和他的物品，有时有九个，有时更少。其他任务涉及逐个击败它们，深入地下城或进入愈发危险的区域，直到最后的最后高潮。有时这是一个两步过程：先取物品，然后用它消灭反派（Barton
  2008:32）。


  中土世界的叙事包含了强烈的历史感、对自然的尊重、界限分明的善恶力量，以及对权力、死亡和腐败的恐惧。


  托尔金的世界充满了历史气息。它存在于每一个场景、每一个角色、每一场冲突中。这个设定超越了“古老”；它是一个被居住已久的世界，所有角色都敏锐地感知到自己的血脉以及在其中的地位（Long
  2002:256）。


  中土也与自然紧密接触。它充满了自然且叹为观止的景观，土地本身就像主角一样是一个角色。世界在物理上对道德做出反应：在善存在时绽放，在恶存在时枯萎。


  这种善恶二对立清晰地标记了双方，这一主题贯穿了整个 `Dungeons & Dragons` 阵营系统（Buck 2003）。兽人是精灵的对立面。米纳拉斯·古尔和戒灵对抗米纳拉斯·提利斯和刚铎。甘达夫对抗焰魔兽。


  中土世界有一个明确定义的邪恶力量，只有通过巨大的力量才能击败（Smith 2007:155）。这种浸透在托尔金作品中的传统被《花瓣王座帝国》游戏作者 M.A.R.
  Barker 批评为一种“绅士般的邪恶”。从本质上说，善恶之间的冲突也受公平竞争精神的支配，即力量可以用对等的力量来对抗，且不使用恐怖主义（Fine 1983:78）。


  恶的力量是一种内在特质。一旦有人堕向邪恶，他就变得不可救药地腐败了。中土世界没有好的兽人或友善的龙，这是刻意为之。正如《Lord of the Rings Roleplaying
  Game》所说：“他们并不是被误解的，不是缺乏关爱文化的受害者、底层受压迫和受对待的成员，或类似的情况。”（Long 2002:259）。


  死亡是《指环王》的关键部分，是一个成为人类痴迷的反复主题。孩子的逝去通过父母的悲伤以及对未来的毁灭来体现，是托尔金运用得非常有力的情节手段（Crawford 2007:169）。死亡是一个无处不在的威胁，由角色扮演游戏中随处可见的“不死者”所体现。在《指环王》中，死亡被极大恐惧，这种恐惧驱动了人类许多自私的行为（Fahraeus
  2007:273）。即使是精灵这样的长生生物也看到了自己文明的衰落。相比之下，在某些游戏中，玩家角色的死亡最多只是小麻烦。


  另一个反复主题是命运与自由意志的对比。甘达夫在整个故事中对选择发表了，这最终导致了指环的毁灭，强化了命运之手的重要性。同样，弗罗多和比尔保留或放弃戒指的决定是他们行使自由意志的标志（Long
  2002:50）。


  奇怪的是，托尔金遗产的奇幻后裔中缺乏另一个主要主题：权力的腐败。甘达夫、埃兰隆和凯拉丽尔都拒绝了戒指的力量。很少有奇幻游戏对力量增长进行惩罚；相反，它们给予奖励。拥有强大戒指的玩家会被嫉妒，而不是被视为威胁。


  ### 个性化


  初看之下，《环王》与桌面角色扮演游戏除了精灵、矮人和巫师等奇幻元素外，似乎没有共同之处。正如 Nick Montfort 在 `Twisty Little Passages`
  (2003:75) 中提到的：“地下城与龙受 J.R.R. 托尔金作品的影响程度经常被误解和夸大。”官方上，“D&D 的编写并不是为了重建或以任何集体方式模拟托尔金教授的世界或生物……这套系统处理
  R.E. Howard、Fritz Leiber 以及 L.S. de Camp 和 Fletcher Pratt 的世界比托尔金的要好得多”（Kuntz 1980:22）。





  然而，《地下与城》和《指环王》拥有着共同的传承，这种传承超越了某些幻想种族的属性。尽管盖瑞克斯（Gygax）承认`Dungeons & Dragons`的设计初并未考虑到约瑟夫·坎贝尔的*《千面英雄》，但他他也意识到“单神神话”强烈存在于幻想角色扮演游戏中（国际与区域研究资源办公室
  [ORIAS]）。


  在单神神话中，英雄收到冒险的召唤，通常是在引导者的指示下。冒险的起点发生在特定的环境中，英雄在那里面临艰难的任务。他在超自然的帮助下克服了它。在冒险过程中，他完成了“父之救赎”——通常是对像父亲的人物或政府权威。


  作为回报，英雄获得了英雄主义的象征，可能是金钱也可能是荣誉。他的胜利（或“升华”）是冒险的高潮。英雄回到家休息康复。冒险已经完成，他的英雄主义得到了认可，循环再次开始。所有元素都存在于《指环王》以及广义的幻想文学中（1989:166）。


  ## Risk


  小说和角色扮演游戏共享的不仅仅是幻想文学产物。正如珍妮·穆雷（Janet Murray）在*First Person*(2004:2）中所解释的那样，小说和游戏共享两种结构：竞争与谜题。


  “魔戒大战”为大量的竞争提供了背景。`Dungeons & Dragons`及其后续作品的一个核心要素是强大的战斗元素，以至于新玩家假设这些游戏完全由战斗组成，也是可以被原谅的。


  “谜题”源自古英语单词“raedan”，意为建议、引导或解释（Montfort 2003:4），它是历行叙事文学的前身。通过提出谜题，作者挑战了主人公也挑战了读者。双方都被邀请解决问题，尽管在文学中结果是不可避免的。具体来说，情境谜题——即描述一种情况并挑战听者给出描述的完整背景——也许是与交互式文学最的谜题形式（2003:41）。


  在《指环王》中，托尔金经常使用谜语和预言来为故事提供转折。护指戒上的铭文与其相关的预言是对读者预测故事结局的挑战，并最终由托尔金来解决。托尔金在故事中还包含了其他几个谜语，从“说朋友，你就可以进去”到“没有人能杀死巫王”。


  对于那些要么弱化战斗要么提供战斗替代方案的系统，谜题是各种形式角色扮演游戏中的强有力元素。这在不易传达战斗的系统中最为常见，例如基于文本的交互式文学。例如，`Zork`几乎完全由游戏设计者与玩家之间的谜语和挑战组成，玩家必须弄出成功的“正确”方法。


  小说和交互式文学在“你自己的自己的冒险”类书中交汇，这些书允许玩家阅读通常涉及传统冲突的故事，但通过解决谜题和试错来解决冲突。我们将在后续章节讨论游戏书和交互式文学。


  ## Roles


  “角色”（role）一词最早于 1606 年在英语中记录，根源于古法语单词“rolle”。它指的是羊皮纸卷或卷轴，更具体地指的是演员学习角色的文本。既有“创作者角色”，他们帮助发明了参与者所经历的叙事；也有“参与者角色”，他们接收这种经历并对其探索。


  ### Creator Roles


  在虚构作品中，创作者角色仅限于作者。可能存在其他创作者，但读者对虚构作品的控制越多——本质上成为作品的共同创作者——这本书就越能被归类为交互文学，我们将在后面的章节讨论。


  #### Author


  在*Synthetic Worlds*中，卡斯特龙诺瓦（Castronova）强调了托尔金对世界构建者——神的概念，他们是“亚创造者”，反过来又服从一个总的创作者。他们将此行为视为一种神圣的召唤，创造冲动超越了狭隘的自私。卡斯特龙诺瓦假设，托尔金发明“亚创造者”是作者将其自己的创作框架作为对他唯一真神信仰的渠道（2005:308）。本质上，上帝创造了托尔金，托尔金在他的虚构宇宙中创造了神灵，神灵又创造了其他角色，通过了解这些角色，读者可以从上帝神秘作品的创造谱系中获得更好的洞察。在这方面，作者的角色与游戏主持人（game
  master）的角色相似，因为即使宇宙的神灵也只是游戏主持人人格的延伸。


  ### Participant Roles


  与创作者角色一样，参与者角色被缩减为只有一个：读者。


  #### Reader


  与后来出现的幻想游戏不同，阅读《指环王》是一种孤独的体验。读者是一个观察者。然而，阅读体验仍然符合媒体丰富度量表。它是不可变的；与交互文学不同，文本固定在页面上。麦基（Mackay）认为阅读文本的玩家会被其转化。读者的日常自我通过读者的过滤体验被重构为阅读自我，但根据文本进行调整。因此，阅读自我是读者想象力的体现，通过文本作者设定的一系列指南形成（2001:66）。


  角色扮演和阅读小说的一个重要区别在于不同读者对文本解释之间的共识。阅读是一种极以自我为中心的体验，这种效果在计算机角色扮演游戏中得到了镜像，这些游戏完全专注于迎合玩家。


  角色扮演需要两个或多个参与者之间对愿景、想象力和基础交流的共享。虽然读者可以将自己代入主人公，但在角色扮演游戏中，她遇到其他角色，而这些角色又是玩家的投影。即使角色是以种族和性别的大致特征描述的，也必须有一定的共识才能进行互动。


  ### Character Roles


  与角色扮演游戏和其他形式的幻想游戏不同，虚构作品中的玩家和非玩家角色之间没有区别。只有角色。可能有一个主人公，叙事通过她来讲述她的故事；或者一个全知叙述者可以在角色之间移动，轮流分享每个角色的视角。Montfort（2003:33）将这些角色称为“人物”（persons），因为他们是故事不可或的一部分，但无法与之互动。他们是读者在幻想宇宙中角色的基石。


  Decipher 版的指环王角色扮演游戏将中土英雄的特征量化为慈悲、负责任的自由意志、慷慨、诚实公正、荣誉高尚、克制、自我牺牲、勇敢和智慧（Long 2002:51）。


  《指环王》中对护戒的争夺完全关乎自由意志。戒指有腐蚀佩戴者的能力，只有意志力坚定的人才能拒绝它的诱惑。自由意志是自我牺牲的重要部分，即为了大局而放弃个人需求的能力。弗罗多和波罗米在魔戒大战中牺牲了许多。


  慈悲体现在甘道夫身上，他怜悯咕尔姆，甚至放过了了邪恶的萨鲁曼。英雄们还保持了武器的克制，只在武装战斗中杀死敌人并正面交锋。





  其他特质体现了真正的英雄：诚实守信，言出必行，并且无论地位如何都公正对待他人。慷慨体现在希罗登在危时刻将`Shadowfax`送给`甘达夫`。尽管获得宝藏是《指环王》中反复出现的主题，但英雄们并非出于贪婪追求财富——这与柯南系列形成了鲜明对比，也是与《地下与城》的主要的分歧元素。最后，护环会成员拥有智慧，拥有超越他们认知的理解力——几位强大的生物拒绝对`索洛隆`使用指环，便就是一个典型的例子。


  ## 种族


  与现代的用法不同，游戏中的“种族”（race）代表的是一种物种。种族是幻想文学中定义角色最基础的属性之一。Andrew P. Miller 和 Daniel Clark
  (1998:155) 通过以下列表将幻想种族与幻想生物区分来：


  ![[graphic]](data/content-0010.png)


  《指环王》中对种族原型的简化是可以理解的。通过种族识别护环会成员有助于识别他们的起源，清晰地勾勒出他们的政治和国家效忠。护环会既是一个国际联盟，也是一支冒险小队，致力于实现一个具有深远政治影响的共同目标。他们不仅仅是为了战利品和名声。这些冒险者是为了拯救世界。


  当然，中土世界中存在的种族原型在托尔金的作品之前就存在了。他的巨著为种族的合作提供了一个共同的框架。要研究现代游戏中护环会成员的关系，探索幻想种族在童话、神话和传说中的根源是有。


  ### 矮人


  矮人通常被描绘成矮小、粗壮且体格有力，长着大鼻子、浓密的眉毛、长胡须，穿着复杂的盔甲，总是拿着战锤或战斧。作为人类的类比，矮人代表了中产阶级劳动者，永远在劳作和喝酒。他们是工业时代那些满脸煤灰、身材结实的男人，工作努力，玩得疯狂。“dwarf”一词来自“dweorh”，这源于德曼语的
  `dweraz` 和 `dhwerghwos`，意思是极小的东西。`Dweorgas` 变成了 `dwarrows`，后来改为 dwarfs。难怪矮人总是被描绘成矮矮的（Aeon
  2001）。


  “dwarves”一词之所以流行要感谢托尔金的作品（Tolkien 1937:8; Ayto 1990:189），这种区分在《白雪和七个矮人》中得到了证明。矮人在北欧神话中拥有锻造者和战士的传统，但也是小偷和骗子。这种传统在《霍比特》中得以延续，在那里矮人被刻画成狡诈的恶棍，试图偷走史魔王的宝藏。矮人对酒的热爱在北欧神话中也早已建立（Tolkien
  1937）。


  中土世界的矮人是一个粗旷种族，身材矮胡须长，是石雕师、金属工人和矿工。他们是由矮人的“七位父神”（对应《白雪公主》）创造的，但由于其创造者的傲慢，他们被昏睡了许多时代，以便精灵能先醒来。矮人的寿命比人类长，而且他们也会犯错（Day
  2001:59）。


  在《霍比特》出版的大同时，《白雪和七个矮人》在电影院上映。两种媒体都将矮人描绘成拿着斧头的矿工，是笨拙、相貌平平且永远工作的矮生物。这些特征在现代幻想作品中很大程度上仍然存在。


  用口音描绘矮人无疑受到了波尔·安德森《三颗心三只狮子》的影响，这部小说对《地下与城》（1961）产生了强烈影响。矮人 Hugi 说着苏格兰口音。受欢迎的《指环王》电影三部曲传播了矮人口音的观念，这从此已成为现代幻想作品中矮人描绘的特色。


  虽然托尔金是否真的访问过尼泊尔尚有争议，但他确实知道古尔卡人，这些矮小的山地人用`kukri`（库克里弯月刀，一种凶恶的重刃短刀）来恐吓他们的敌人。矮人的战号
  `“Khazad ai menu!”`（“矮人来了！”）与古尔人的战号 `“Ayo Gurkhali!”`（“古尔卡人来了！”）之间存在相似之处。难怪矮人配备了通常用于伐树的武器——斧头（Brown
  1998）。


  在`Chainmail`中，矮人在对抗特魔、食魔人和巨人的战斗中更好；哥鬼和哥布林是他们的宿敌（Gygax 1978:29）。在《地下与城》中，矮人最初只允许成为战士，等级不能超过第六级。他们精通战锤，对魔法有很强的抵抗力（Gygax
  and Arneson 1974:7）。


  关于该物种女性长胡须的问题在《地下与城》圈子里争论已久，这主要是因为托尔金曾提到，矮人女性与矮人男性如此相似，以至于“其他种族的眼睛和耳朵无法区分它们”（Tolkien
  1955:360）。《地下与城》在第四版中解决了这个问题，将矮人描绘为没有胡须甚至具有吸引力的形象（Carter 2007:33）。


  ### 精灵与半精灵


  精灵在神话和传说中与矮人拥有共同祖先。他们的身高从比人类矮到等高不等。精灵美丽、富有音乐天赋，在魔法和自然方面充满智慧，并且总是留着尖耳朵。托尔金对精灵的传统描绘并不满意，包括莎士比亚普及的将精灵描绘成顽皮的小生物（Lakowski
  2007:61）。作为回应，他创造了作为 Quendi 的精灵。他们是不老长生的，拥有最大的幸福和最深的忧伤。他们的体型大致与人类相当，但精神和肢体更强。随着年龄增长，他们只会变得更加智慧和美丽。当精灵“分裂”时，他们的血脉分为受瓦拉之命前往瓦林诺的精灵拉（Eldar），以及拒绝的阿瓦里（Avari）。精灵拉中产生了《地下与城》中流行的“亚种族”：高精灵（Noldor）、木精灵（Tawarith）和灰精灵（Sindar）（Day
  2001:75）。


  《词源起源字典》将“elf”定义为“德意志民间传说中一种强大的超自然生物种族”（1990:197）。`Ælf` 是可能的起源，反过来源于`albiz`，可能源于`albho`，意思是“白色”。那么，最近的亲戚是
  `alp` 或 `alf`，复数为 `alpar` 或 `alfar`。应该注意的是，阿尔卑斯山脉与该词有共同祖先，这将其指定为精灵的家园。“alp”的意思是“噩梦”，这表示了一个与精灵概念相关的不愉快特征，或者至少与其山地祖先有关。


  ![[graphic]](data/content-0011.jpg)


  在德语形式中，alp 的特征更接近传统的血鬼而非精灵。alp 传统上是男性的，在晚上通过坐在女性受害者的胸口发动攻击，导致可怕的噩梦。alp 的攻击被称为`Alpdrücke`，意思是“挤压”，这可能是呼吸暂停、睡眠瘫痪和夜惊的一种解释。这种形式的夜晚噩梦在《地下与城》中以夜婆（night
  hag）的形式出现，它们的功能非常相似，但被认为受到更多犹太-基督教恶魔的影响（Carton 2008）。




  尽管带有负面含义，但阿尔普（alp）拥有许多奇幻的特质。它们以恶作剧的行径而闻名，从弄坏牛奶变质到恐吓动物无所不包。除了变身术士外，阿尔普从未离开过他的魔帽子
  `Tarnkappe`，这顶帽子可以提供隐身能力，是托尔金精灵斗篷的先驱。也许阿尔普最现代的体现是`弗雷迪·克鲁格`（Freddy Krueger），他热衷于在中折磨年轻人，以其顽劣且致命的机智闻名，且从未见过他没戴帽子的形象（Aeon
  2001）。


  北斯人将精灵分为两种不同的类型：光精灵（`Ljosalfar`）和暗精灵（`Dopkalfar`）。北欧神话对种族及其家园的分类非常严谨，这与托尔金在中海世界中安置种族的方式如出一（Johnston
  2007:200）。`Ljosalfar` 住在 `Alfheim`（精灵之乡），`Dopkalfar` 住在 `Svartalfheim`（黑精灵之乡）。`Ljosalfar`
  的特征现代读者很容易辨认：他们身高与人类相仿，外美丽、强壮，是勇猛的战士，精通艺术，居住在人类无法触及的地方，拥有自己独特的语言，并能与人类杂交生下半血精灵（Korablev
  2003）。相反，`Dopkalfar` 与矮人人和巨魔有更多共同点；他们皮肤像漆一样黑，外貌丑，且会被阳光石化。精灵性格的这两种侧面在其他神话中表现为“善之廷”（Seelie
  courts）和“恶之廷”（Unseelie courts）。


  这类具有这些属性的生物在托尔金的作品中非常突出，包括《霍比特人》（`The Hobbit`）中变成石头的巨魔（Tolkien 1937）。在托尔金之前，影响奇幻文学最现代的精灵描绘是邓斯尼勋爵的小说《精灵王国的女儿》（1924）。这部小说坚定地确立了精灵可以与人类繁衍（更多关于半精灵的回响）、寿命比凡人长、天生是魔法生物，并且具有超自然的吸引力。邓斯尼的作品特别将精灵女性确立为人类男性极度渴望的对象。如果说奇幻艺术作品和大型多人在线游戏（MMORPGs）中半裸精灵女性的数量是一个衡量标准，那么对精灵女性的渴望一直持续今天。


  精灵女性的吸引力和人类/精灵杂交的后果不可避免地导致了半精灵（在托尔金的作品中称为 `peredhil`），他们源自精灵血脉（Lakowski 2007:64）。著名的例子包括《赫尔夫·克拉基史诗》中的丹麦公主
  `Skuld`、《西西德雷克传奇》中的英雄 `Högni`，以及《索尔斯坦·维京斯索纳史诗》中的 `Alfheim` 王室。尽管杜尼丹人（`Dunedain`）、海盗（`Corsairs`）和黑色努美诺尔人拥有精灵血，但他们并不被视为半精灵。根据托尔金的定义，真正的半精灵拥有精灵和人类双亲。半精灵必须决定效忠于哪种种族系。例如，埃尔隆德（`Elrond`）选择了他的精灵遗传并因此永生，而他的兄弟埃尔罗斯（`Elros`）则没有（Coleman
  1993:154）。


  任何关于精灵的描述如果没有提到耳朵都是不完整的。精灵尖耳朵源于托尔金对《词源》（`The Etymologies`）中 `las` 一词的评论（Tolkien
  1996:367），他在书中描述昆迪人的耳朵“比人类更尖、更像叶子”。因此，莱 olas（`Legolas`）的意思是“绿”，以一种现代读者容易辨认的方式区分了精灵与人类。


  精灵与弓的关联追溯到托尔金中海世界之前的时代，一直可以到 16 世纪的“精灵箭”（`elf-shot`）一词，这是对新石器时代燧石箭头的引用。这些箭头在苏格兰与精灵联系在一起，人们认为它们通常只需划伤人，就能让其生病（Hall
  2005）。


  在《链甲》（`Chainmail`）兵棋游戏中，精灵可以作为步兵执行移动和射击动作，并能够隐身。奇怪的是，他们被与仙子归类（Gygax 1978:29）。在《地下城与龙》（`Dungeons
  & Dragons`）中，精灵可以从“战士”或“法师”开始，并在两者之间自由选择兼职。他们可以获得两个职业的益处，但作为战士不能超过第四级，作为法师则不能超过第八级。他们能够说兽魔语和地布林语（这暗示了他们共同的托尔金根源）（1974:8）。


  我初中游戏小组中的的一名玩家分享了他扮演精灵角色的经历：


  ```

  我永远不会忘记我的第一个角色 Kronus，他是 D&D 游戏里的一个精灵。他在游戏开始的前十分钟内因为掉进陷阱被杀死了，但你太友好了，给了我一次重来的（mulligan），让我用一点生命值把他复活，因为我当时还是个新手。他的等级升得算高，但我不记得具体有多高了。我会永远记得他，就像一位多年前去世但一直触动你内心的老朋友
  [Varrone 2010]。

  ```


  正如托尔金描述的那样，精灵对游戏设计师来说变成了一种负担。他们在各方面似乎都比人类更有能力。为此，盖瑞克斯（Gygax）努力抑制他们的力量，通过赋予该种族虚弱的体质，并对他们的等级上限进行限制。这些限制直到《地下城与龙》第三版才被取消。


  第四版将《地下城与龙》中的精灵提升到与人类相当的高度，并取消了他们的低体质。第四版还创造了一个名为“精灵族”（`eladrin`）的独立种族。`Dungeons`
  (Carter 2007:39)。


  GNOMES • 矮人很小，至少和矮人一样小。他们与花园人的形象有很多共同点，通常戴着滑稽的帽子，长着鼻子，卷着胡子。


  ![gnraphic](img/content-0012.png)


  “侏”一词源自文艺复兴拉丁语 `gnomus`，由瑞士炼金术士帕拉塞尔苏（`Paracelsus`）创造。他用这个词指代四元素之一，特指栖息在地的生物，身高十八英寸，非常寡言。


  尽管侏儒并不在托尔金的世界中，但确实存在。这个词在《失落传说之书》（`The Book of Lost Tales`）中被简短地用来描述诺尔多人（`Noldor`）（Burke
  2007:37）。`gnomus` 与智慧（gnosis）有关，这也就是为什么这个词被用来指代精灵，精灵语中的“The”。


  与智慧的联系也许是侏儒后来与技术联系在一起的原因。“工匠侏儒”（`Tinker gnomes`）出现在《龙奇冒险》（`Dragonlance Adventures`,
  1987）中，首次在第一版游戏中引入了这种新的侏儒形式。《魔兽世界》（`World of Warcraft`）后来奠定了侏儒技术者的形象（Carter 2007:51）。


  由于侏儒传统上被认为具有矮人的特征，两者经常被混淆。出于这个原因，托尔金担心读者会混淆而放弃了这个词。然而，其他的民间名称仍然存在，包括“精灵”和“矮人”。


  在《地下城与龙》中，侏儒首次出现在名为集《链甲》（`Chainmail`）的补充书中，与矮人归类（Gygax and Perren 1971:28）。他们作为怪物出现在《布莱穆》（`Blackmoor`）（Arneson
  1975:24）中，被描述为住在通过隧道连接地面的地下城市中。


  侏儒直到《高级地下城与龙》的出现才作为可玩种族出道。盖瑞克斯解释说，加入侏儒是为了扩大种族选择，因为玩家们厌倦了矮人、精灵和半人这些受托尔金启发的原型（Gygax
  2004）。他创造侏儒是为了填补半人和矮人之间的空白——即一种作为精灵的半人类施法替代方案。





  ## 霍比特


  追溯到 1955 年，托尔金在写给 W.H.奥登的信中写道：“地上的洞里住着一个霍比特”（Tolkien 2000）。他并不知道自己为什么要写，但他确实写了。就随着这个随意的念头，霍比特诞生了。


  霍比特是神话中矮人长传统中一种特殊的农村族群。他们矮小、胖乎、脚满长毛，喜欢抽烟斗，当人们考虑冒险伙伴时，霍比特并不是大家首先想到的种族。多亏了《霍比特》和《指环王》，他们现在与幻想文学建立了不可分割的联系（Aeon
  2001）。


  在中地球中，霍比特是一个矮人种，身高在两到四英尺之间。他们手指长，通常体态肥胖，留着卷发，脚很大。他们热爱食物，喜欢丘陵和山谷，并在那里耕作（Day 2001:121）。


  托尔金将“hobbit”从“holbytla”（洞穴建造者）翻译过来，并解释说“hobbit”一词是原词的磨损形式。有趣的是，“hobbit”实际上出现在 19
  世纪晚期民俗学家迈克尔·艾斯拉比的《丹姆论集》中，当时他列出了民俗超自然生物，这远早于托尔金写下《霍比特》（Denham 1967:76–80）。


  “Halflin”（半身人）源自苏格兰语单词“hauflin”，比早于《霍比特》和《龙与地下城》。它被用来描述一个乡村少年，既不是男人也不是男孩，因此兼具两者之长。“halfling”的另一个词是“hobbledehoy”或“hobby”。莎士比亚曾使用“halfling”一词来指代体型男人（Bevington
  1992）。


  如果说精灵是上层阶级，矮人是中产阶级，霍比特就是托尔金担心会被工业进步所淹没的农耕文化。作为田间的农民，霍比特对他们的乡村根源有着深厚的感情和热爱。在《霍比特》中，比尔博矮小的身材也作为读小说小孩子的代指。


  早期版本的《龙与地下城》曾使用“hobbit”一词来描述其矮人种族，直到托尔金遗产委员会提出抗议（Kuntz 1978）。当时《龙与地下城》的出版社战术规则（TSR）切换到了更常用的词“halfling”。这个词在《指环王》中也被指代霍比特，因此这种转变看起来很自然。


  霍比特倾向于偷窃的观念在《霍比特》中已根深蒂固，在那里，格鲁和史魔都指责比尔博偷窃。毕竟，比尔博确实是从某人那里偷取宝藏，即使是从一条龙那里。


  在《链甲虫》中，盖格克斯解释道“这些小家伙在战争游戏中位置很小”，但被收内是为了还原某些战斗（推测是受托尔金中地球启发的战斗）。他们能够融入背景，因此是出色的侦察兵。他们掷石头的距离可以和射箭手的距离一样远（Gygax
  1975:29）。在《龙与地下城》中，半身人被限于第四级的战士职业，拥有魔法抗性和对远程武器的致命准确性（Gygax and Arneson 1974:8）。


  对于扮演半身人的玩家来说，一个特殊的挑战是他们的体。在早期版本中，半身人的体重可能只有 30 磅，设计师们认为这个问题是使他们成为英雄的障碍（Carter 2007:43）。第四版《龙与地下城》将他们的身高增加到平均四英尺，就像梅里和皮宾饮用了“树人灵药”之后。


  ## 兽人与半兽人


  尽管兽人从未是环游队的一部分，但这里提到他们，因为他们已经成为幻想中无面之敌的典型，或作为玩家角色的反英雄。


  兽人通常是反派。他们皮肤黝黑、眼睛黄色、舌头红色，肮脏、卑劣、粗鲁且残暴。《战锤角色扮演》确立了“奥克”（ork）的流行形象，具有明显的猪类特征，长着獠牙或巨大的尖牙（Aeon
  2001）。


  “orc”一词最初的意思是“食魔”（ogre），一种吞噬怪物的怪物，源自意大利语“orco”，而又源自拉丁语“orcus”，意为“地狱”。这个词出现在《贝奥武夫》中，格伦德尔种族被描述为“orcneas”，意为“地狱的尸体”。卢多维科·阿里奥斯特的《疯狂奥兰多》描写了一个被称为“orc”的长牙海兽。托尔金特意将“orc”一词区分为霍比特形式的精灵名称，并与任何“海洋动物”区别开（Tolkien
  1937:8）。


  在中地球，兽人曾是被梅尔科折磨的精灵，变成了一个令人厌恶的扭曲种族。他们矮小丑陋，手臂像猿子一样长，皮肤黑色，参差不齐的獠牙和红眼睛。他们恐惧阳光且繁殖旺盛，这使他们成为优秀的战士（Gehl
  2007:258）。美国演员、作家、导演兼制片人范·迪塞尔将他喜欢的《龙与地下城》角色之一——一个半卓妖巫师猎人——以梅尔科命名（Archer 2004）。


  兽人首次出现在《链甲虫》中，该书建立了与《指环》的联系。


  ## 人类


  如果不对《指环王》中的继承者进行讨论，对环游队的讨论将是不完整的。波罗米尔抵抗魔环的失败以及最终的牺牲充分说明了托尔金对人类的看法。


  在中地球，人类与其他种族相比表现平平（Fahraeus 2007:269）。他们是凡人，寿命短暂，精神和肉体都很虚弱。但他们有两个与众不同的特征；繁殖迅速且固执（Day
  2001:153）。


  在幻想游戏中，人类被视为衡量其他种族的标准。他们拥有无限的可能，而矮人、霍比特和精灵很大程度上遵循刻板印象。对于大多数非人类种族来说，做到不同而不独特似乎很难，但人类恰恰实现了（Aeon
  2001）。


  这里的人类注定继承他们失去的地位。人类的虚弱源于伟大的丧失以及阿拉拉贡随后夺回大爱的挣扎。腐败且缺乏领导，历史的舞台由人类来承担。


  ## 玛雅


  “玛雅”一词在幻想中并不广为人知，但混合血的天使生物形象在民俗中有着很久的历史。他们在托尔金中地球的描述各异。玛雅总是低调甚至愚笨，直到他们选择显现，那时他们真实的存在感是令人敬畏的。


  在中地球，玛雅是艾努（“神圣者”）的一个亚族。玛雅是瓦拉的小者以及他们的仆人。作为瓦拉的仆人和助手，玛雅虽然是较小的生物，但对凡人来说力量并不小。最重要的是，玛雅以伊斯塔（巫师）的形式协助人类的力量，他们披着老人的外壳（Ozment
  2007:187）。他们共有五位：棕甘达拉斯、白萨鲁曼、灰甘达夫、蓝阿拉拉塔和蓝帕兰多（Day 2001:145）。





  在《龙与地下城》第三版之前，并没有与迈拉（Maiar）明确对应的产物。这些既神圣又凡俗的生物最终在“位面”设定中表现为`阿斯瑞`（Aasimar，Baker 1995）。即便如此，阿斯瑞也被认为过于强大，无法作为一个可游玩的种族。


  ## 职业


  护卫队的大多数通过其身份而非其所作为为人知。然而，每个角色的职业确实有助于定义他们。阿拉刚贡被称为一名游侠，甘达夫被称为一名巫师，而一些霍比特（受弗罗多使用独一戒指使其能够隐身的加持）则是行踪诡秘的小偷。解密书籍《指环王角色扮演游戏》将这些职业称为“教派”（Orders）（Long
  2002:77）。


  ### 吟游诗人（BARD）

  “Bard”一词起源于凯尔特语，源自古凯尔特语 `bardo`，进而产生了苏格兰和爱尔兰盖尔语中的“bard”。这个指代的意思是“诗人-歌手”，它作为“流浪艺人”一词进入英语（Ayto
  1990:52）。


  《龙与地下城》中的吟游诗人是至少三种不同类型歌手的混合体：北欧斯考德（skald）、凯尔特吟游人和南欧流浪艺人。凯尔特人拥有更有组织性的结构，其中诗人充当重要的历史学家角色，受德鲁伊训练跟随英雄进入战斗以记录他们的功勋。流浪艺人可能是最为人知的吟游诗人原型，是中世纪意大利和德国贵族的娱乐者。在法国，他们被称为
  `jongleurs`，由此我们得到了“杂耍者（juggler）”一词。斯考德是古老的北欧战士，被赋予历史家的荣誉身份，通过口头传统传传古代战斗和功勋的故事。托尔金在《指环王》三部曲中多次模仿了这种风格，比尔博对航海家埃兰瑞尔的吟唱就是其中一个例子（Schwegman
  1976:11）。


  在《龙与地下城》中，吟游诗人是一个通才型职业士，拥有战士、小偷和法师职业的特征。他还有魅惑怪物的能力，可以有效地使用魔法乐器，并拥有臭名昭著的“吟游传说”（bardic
  lore），这允许吟游诗人挖掘关于几乎任何方面的知识。


  吟游诗人在《龙与地下城》的不同版本中经历了一系列转变。它在《高级龙与地下城》中的正式登场经过修改，使其更像是一个声望职业，要求在加入吟游诗人之前先提升战士和然后是小偷的等级。直到第三版，吟游诗人才恢复为起始角色的可行选择，结果却在第四版的《玩家手册》中被排除。它在《玩家手册》第
  2 版中被恢复了。


  ![[graphic]](data/content-0013.jpg)


  ### 游侠（RANGER）

  “Ranger”一词最早出现在 1388 年，指代护林员（Ayto 1990:431）。它源于单词“range”（范围），即游侠巡逻的地方。“Range”反过来源自古法语单词“rank”。它被直接借用为英语中的“rank”，后来演变为“rang”，由此衍生出动词“rangier”，意为“排成行”。


  在中地球，有伊提利安的游侠，他们穿着绿色衣服，用弓、矛和剑战斗，由刚诺铎的法拉米尔领导。还有北方游侠，这是一个骑士秘密结社，他们穿着绿和灰相间的斗篷，配备剑和矛。他们步行或骑马在整个埃瑞铎地区到处游荡，静静地穿过这片土地（Day
  2001:194）。这些游侠拥有敏锐的感官、与动物的亲缘关系，是坚定的战士，最重要的是他们是出色的追踪者。阿拉刚贡在《指环王》中展示了所有这些才华。


  游侠首次作为乔·菲舍尔在《战略评论》（1975:4）中的一篇文章出现在《龙与地下城》中。在那篇文章中，游侠拥有追踪能力，阵营为守序善良，并且可以施展小型法术。游侠只能保留他能带走的宝物，不能雇佣任何种类的士兵或仆人，且最多不能有两个游侠一起冒险。除了这些规则之外，没有提供更多说明，假设读者熟悉阿拉刚贡。事实上，如果没有对中地球的知识，这些限制和益处几乎毫无意义——游侠们行装轻便，人数稀少，并刻意避免聚集以免引起注意。如果对该职业的灵感有任何怀疑，游侠第二级提供的称号是“漫步者（Strider）”（1975:4）。


  ![[graphic]](data/content-0014.png)


  ### 小偷（THIEF）

  “Thief”一词与立陶宛语单词“tupeti”有关，意为“蹲下”（Ayto 1990:527）。如前提到的，小偷与霍比特和矮人都有强烈的联系。小偷职业呈现了一种冒险的方式，“这种方式基本上是个个人主义的且不被察觉的（这与间接方式不同）”（Gygax
  1987:29）。


  尽管在小说中一直有各种类型的暴徒、土匪、海盗和杀手，但正是小偷被选为一种英雄式的（即使不是英雄的）幻想原型（Aeon 2001）。小偷的吸引力部分在于他的普通人特质，而这种特质也出现在霍比特小偷身上。如果说霍比特是普通的农民，那么小偷就是为了生存而不得不采取绝望手段的饥饿农民。他是我们，是身处困境的我们。


  小偷首次出现在《龙与地下城》中是在《格瑞霍克》扩展集中。他的技能包括开锁、解除陷阱、在关上的门后听声音、安静移动、行窃、在阴影中隐藏以及攀爬陡峭表面。十级时，他能够阅读卷轴，七级或以上的法术可能会反噬（Gygax
  1976:4）。


  ![[graphic]](data/content-0015.png)


  除了托尔金之外，盖克斯还从多个来源汲取了《龙与地下城》风格的小偷。有弗里茨·利伯作品中的冒险者灰色鼠（Grey Mouser），他与野蛮人盟友法夫德一起在《两次冒险》（Two
  Sought Adventure，1957）中登。灰色鼠拥有小偷对短剑的痴迷，以及使用它们对付不备之敌的能力。还有杰克·范斯的“聪明库格尔（Cugel the
  Clever）”以及罗杰·泽拉尼的“影盗（Shadowjack）”。这些施法流氓影响了《龙与地下城》早期版本中小偷阅读卷轴的能力。很显然，小偷原型源于一种更愤俗的、类似小说的幻想设定，这种设定无疑启发了作为范粉丝的盖克斯（Gygax
  2001）。


  小偷在互动文学的创造中了特别重要的作用；帮助创建《迷宫》的两个程序员玩过小偷。他们看重探索和解谜，这些挑战非常适合小偷的角色。当地下城探索成为首选的冒险模式时，地下城通常设有只有小偷利用探测和解除陷阱的能力才能克服的陷阱。


  对小偷职业的痴迷在《迷宫》中持续，创造了由计算机控制的非玩家角色之一——无处不在的小偷，被描述为“一个背着大包、看起来邋遢的人”和“一个出身良好的男人”（Montfort
  2003:112）。这个小偷是一个老练的扒手，会溜进来偷玩家的物品然后离开——这些都是《龙与地下城》小偷的特征。这些特征使得《迷宫》中的小偷成为玩家不断的困扰和一个需要克服的挑战性障碍。


  ### 战士（WARRIOR）

  战士是受过训练的战斗员，精通战术且武器专家（Aeon 2001）。战士是《指环王》中最常见的原型，这理所应当，因为中地球的各国正处于战争之中。从挥舞斧头的矮人到哥洛人大军，战士参与了托尔金宇宙中所有的重大战斗。





  [content]


  然而，并非所有参与战争的人都是战士。《指环王》中的战争是为生存而进行的绝望斗争（Timmons 2007:89）。因此，被征入战斗的未训练士兵与经过训练的战士一样多，这正是两者之间的区别。


  “战士”（warrior）一词源自古北法语的衍生词 `werreieor.`（Ayto 1990:566）。莱格拉斯（Legolas）和吉米（Gimli）可以被归类为战士，尤其是他们热于比较自己杀兽魔的数量。他们都擅长特定的战斗风格；对于精灵来说是弓，对于矮人来说是斧头。其他战士还包括波罗米尔、奥麦、欧洛温、丹登王、游军族人、贝瑞刚德、伊拉希尔王子等许多人。


  战士首次在`Chainmail`中作为“战斗员”（Fighting-Man）出现（Gygax and Perren 1971:6）。该术语通过随后的称号`Fighter`（战士）变得中性化，这一术语一直延续到今天的《龙与地下城》。这个术语似乎在桌面纸笔角色扮演游戏中显得很独特。许多其他奇幻游戏使用“士兵”或“战士”来代替。正如盖益克斯在《角色扮演精要》（1987:29）中所描述的那样，`Fighter`有一种“高度物理化的方法”。


  ![[graphic]](data/content-0016.png)


  ## 法师 (WIZARD)


  法师在传奇中悠悠，可以追溯到奥丁，他是一个留着灰须、戴着软帽和长袍的长者。梅林（Merlin）作为国王和国家的顾问（Coghlan 1993:176），是奥丁的文学后裔。而奥丁反过来影响了甘达夫。


  “巫师”（wizard）一词出现在 1440 年，意思是“哲学家”。它源自中英语的`wys`，意为“智慧的”。因此，巫师拥有巨大的智慧，“wizened”（皱脸的）一词的根源便源于此。“巫师”一词与魔法的联系直到
  1550 年才显现（Ayto 1990:576）。


  托尔金对将甘达夫称为“巫师”感到不情愿，但认为这是对其力量最接近的描述（Tracy）。在中地球，甘达夫是`Istari`（游侠会）的一员，他本身是一个`Maiar`（魔君）。`Maiar`的任务是纠正黑暗君主萨罗隆造成的失衡。因此，`Istari`伪装成老人的形象，力量也受到了限制（Day
  2001:253）。法师并非人类可以成为的身份——魔法是一种与神性专钩的力量。托尔金在他的一封信中提到了这一点：“这个故事中‘魔法’的使用在于，它不是通过‘学识’或咒语获得的；而是一种人类本身并不具备的内在力量”（Tracy
  1998）。托尔金将魔法分为`magia`（自然魔法/法术），使用力量迅速实现目的；以及`goeteia`（巫术），用于创造幻象和附咒（Ozment 2007:185）。


  尽管如此，其他人使用的魔法也有特殊案例，特别是阿拉拉贡（Aragorn），托尔金承认这些可以被视为魔法。这种差异使得《指环王角色扮演游戏》能够创建一个“法师职业”，涵盖了被归为其他种族魔法的力量——精灵之歌和矮人符文（Long
  2002:88）。只有当他们获得更高等级的力量时，才能成为法师，由最初的五位`Istari`指导。


  《中地球角色扮演》通过创造者鲁鲁（Eru）的神圣引导来量化魔法的使用，鲁鲁强调万物的平衡。以未经许可的方式使用魔法是触犯鲁鲁恩典的行为，从而堕入腐败（Coleman
  1993:7）。电脑角色扮演游戏《JRR 托尔金的指环王》第一卷通过在施法时对施法者的生命值造成伤害，强化了同样的限制（Barton 2008:204）。这些传统与后期角色扮演游戏中典型的法师形成了对比，后者的法师乐于用火球术攻击敌人（Ozment
  2007:186）。


  典型的奇幻法师从何而来？《龙与地下城》的法师实际上受到了杰克·范斯《死亡地球》系列中巫师的启发。盖益克斯解释了文学中的四种基本魔法类型：那些需要长时间召唤和大量道具的系统（正如莎士比亚在《麦克白》中和罗伯特·E·霍华德在《柯南》中视觉化那样）；那些需要短口语咒语的（如杰克·范斯的《死亡地球》系列）；德·坎普和普拉特在哈罗德·谢亚故事中典型的强大魔法；以及“通常很弱且效果有限的魔法（如在
  J.R.R. 托尔金的作品中发现的）”。考虑到速度和平衡的需求，盖益克斯选择了最快捷的施法形式——范式魔法（Vancian magic）（1976:3）。


  在盖益克斯的思维中，咒语本身具有魔法性，作为一种携带能量的书面形式，似乎是平衡游戏中法师与其他类型角色的完美方式。盖益克斯在 ProFantasy 写的一篇文章（2001）中说：“记忆咒语需要时间和精力，以便传递不仅是书面内容，还有它的魔法能量。”“当随后施法时——通过言语或其他手段——语言或手势或任何触发咒语魔法力量的因素，会在大脑中之前记忆的咒语所在的地方留下一个空白。”


  在`Chainmail`中，法师可以隐形、在黑暗中观察并提高士气。他能够发射两种弹药；像投石机一样爆炸的火球，或像火炮一样直线发射的闪电（Gygax 1978:30）。正如后来的《龙与地下城》，法师提供了一种间接的、可能是智力的方法——一种火炮科学”（Gygax
  1987:29）。


  在早期的《龙与地下城》版本中，法师被称为笨重的`magic-user`（魔法使用者）。这个术语在《高级龙与地下城》第二版中最终被`mage`（法师）取代。第三版恢复了经典的“wizard”称号。这种源自遗传而非学习的力量概念在《龙与地下城》第三版的`sorcerer`（术士）职业中显而易见，该职业在选择法术方面更有灵活性，但总法术数量较少（Aeon
  2001）。


  值得提到，尽管范式魔法系统已成为《龙与地下城》的经典设定，但灵能（psionics，一种点数魔法系统）也被引入了最初的《龙与地下城》（Eldritch Wizardry
  Gygax and Blume 1976:1）。这种点数系统后来被 MUD 和 CRPG 重新采用。


  在《指环王》中，米瑞、比比和萨姆在开始末日山之之旅时几乎没有冒险经验。但任务结束时，米瑞和比比已成为受推崇的战士，萨姆也成功度过了末日山的危险。阿拉拉贡从游侠升为了国王。甚至甘达夫在故事开始时是以灰袍身份出现的，后来以更强大的白袍身份回归。


  《中地球角色扮演》游戏和《指环王角色扮演游戏》都描述了角色获得经验并升级。《中地球角色扮演》跨越 10 个等级，但提供了多种经验值奖励（生命值、关键点、击杀点、动作点、法术点、点子点、旅行点和杂项）（Coleman
  1993:38）。相比之下，《指环王角色扮演游戏》提供技能、专长、声望、反应、勇气、健康或属性的提升，而非等级（Long 2002:277）。






  故事中的成长提升与游戏中的提升之间的区别有两点。故事中的角色通过他们的冒险进行有机地成长。而在角色扮演游戏中，玩家提升角色的动力源于为了让角色变得更强大。虚构的主角受由于迫迫迫境而去冒险，但在奇幻游戏中，玩家清楚他们通过提升将获得什么奖励。角色对未来的未知性是奇幻叙事的一个基本方面，也是与奇幻游戏的关键区别。奇幻游戏为玩家提供了一条清晰的路径，让他们通过角色投射自己对权力的渴望。


  ## 结论


  归根结底，托尔林的“护环同”正是如此——这是一群同伴、盟友和朋友的聚集。即使在护环同被迫分裂时，山（Sam）也拒绝离开弗罗多（Frodo）。护环同知道他们必须合作才能生存。同样，奇幻游戏中的冒险小队不仅仅是方便之需的群体。让一群人一起玩游戏的方式因媒介而异。它可能涉及一个玩家与电脑控制的非玩家角色互动，也涉及通过电子介质不在同一房间的玩家共同协作，甚至是一种混合系统，部分玩家在物理现场，而其他玩家则不在。


  “值得注意的是，托尔林的项目正如他所有的著作以及他因此闻名的那些作品所展示的那样，是如此宏大，其抱负是如此无限，以至于我们无法想象它的长期后果，”Castronova
  在《合成世界》（2005:298）中说道。“在短期内，在今天，我们看到的仅仅是，几乎每一个创建的合成世界都是以中土世界为模型的。”


  在接下来的章节中，我们将探讨这些后果。


  # 第二部分：集换卡牌游戏与微缩战争游戏


  在所有时代，一种特定的野蛮战争一直都在用锡、铅和木头制成的士兵进行，使用荒野的武器、投石机、弹性圆圈袜带、豌丸枪、橡胶球等——就像家用电器一样——仅仅是人的摆放和推倒。锡制杀戮。文明的进步已将这种粗俗的竞赛完全从游戏室中扫除。我们不再了解它们了[Wells
  2004:2]。


  ## 引言


  对奇幻游戏中的“护环同”概念的任何研究都必须从战争游戏`地下城与勇龙`（Dungeons & Dragons）的根源开始。`地下城与勇龙`第三版和第四版的批评者表示，担心该游戏过于关注微缩模型。然而，正是这种微缩游戏最终催生了`地下城与勇龙`。


  微缩战争游戏涉及在模拟地形上进行规模战斗中使用小型模型。微缩模型的移动和参与受规则限制。与棋盘游戏不同，战争游戏中的棋具有更大的移动自由度。大规模战争游戏使用一个微缩模型代表多支部队，而遭遇战游戏则用一个模型代表单个角色。因为地形是游戏的一个重要部分，因此在制作模型及其环境时，都存在微缩战争的美学元素。


  在本章中，我将集换卡牌游戏与微缩战争游戏归为一类，因为它们促进了彼此的发展。集换卡牌游戏吸收了战争游戏的许多元素并将其融入卡牌游戏中。反之，微缩游戏吸收了卡牌游戏的随机性和收集性，并将其融入微缩游戏之中。


  集换卡牌游戏最早由威世海岸（Wizards of the Coast）的《万智牌》（Magic: The Gathering）推出。集换卡牌游戏的独特元素之一是规则本身分散在整个卡牌收藏中。玩家可以在没有所有卡牌的情况下玩游戏，因此可以在不拥有所有规则的情况下玩。每张卡牌都包含一个自成的规则，该规则又与其他卡牌及其规则相互作用，为每个玩家创造了独特的体验。收集元素通过“包”的稀缺性确保了随机性，因为玩家之间只能购买和交易特定的卡牌。


  在《万智牌》中，这些卡牌对阵另一个被称为“行者”（planeswalker）的玩家。“行者”使用地牌产生法力，每种地牌对应一种不同的颜色和元素（白、蓝、黑、红、绿），召唤生物和效果。生物的排列方式就像微缩模型一样，对着对手的“行者”。可以排出一排与微缩战争游戏设置相当的生物队列。攻击或使用这些生物的力量会使其“横置”（taps），这意味着它们没有资格防御。生物可能会死亡或或其他效果复活（Gottlieb
  2009）。


  集换卡牌游戏与微缩游戏之间的相似性没有被游戏公司忽视。“clix”系统随着《威世智魔法术骑士》（WizKids Mage Knight）集换微缩游戏首次亮相，其中每个预涂色的塑料微缩模型都包含了在其旋转底座上玩所需的规则。为了解决冲突，玩家转动底座上的模型，当生物造成或受到伤害时，显示计数器会点击到位（Barrett
  2003）。像集换卡牌模式一样，集换微缩游戏是以随机包出售的。《魔法术骑士》的出现标志着微缩战争新纪元的到来，大大减少了两个入门门槛：收集金属微缩模型的高昂成本以及绘画它们的耗时任务。


  ### 历史


  第一个战争游戏是“围海”（Wei-Hai），一种更常见的名称是“围棋”（Go）。与围棋相似的是一种来自印度的游戏，名为“陆罗棋”（Chaturanga），这是象棋演变而来的系统。1644
  年，象棋诞生了国王游戏（King’s game），它具有三十枚棋子和十四种兵种类型。尽管发生了变化，它在结构上仍然与象棋非常相似。有趣的是，每个棋子都代表某个人（Fine
  1983:8）。


  第一个脱离象棋范式的游戏是由布鲁三角形公爵的侍从大师赫尔维（Helwig）在 1780 年创造的。赫尔维的游戏将棋盘扩大到一千个格子，每个格子对应不同的移动速度。与之前的游戏不同，赫尔维的版本拥有单位而非单个士兵。乔治·文提努斯（Georg
  Vintinus）在 1795 年生了一个更复杂的迭代。1798 年，他通过使用实际地形地图使游戏变得更加真实。


  现代战争游戏的根源可以追溯到 1811 年，当时雷西维茨（Herr von Reiswitz）和他的儿子将一种名为战争象棋的游戏修改为《以战争游戏形式表现战术的说明》（Instructions
  for the Representation of Tactical Maneuvers under the Guise of a Wargame）（Mackay
  2001:13）。它是为了教军官军事术而明确设计的，因此其起点是一个粗略的模拟。这种用游戏模拟战争的丰富传统延续到了今天的多人在线角色游戏（MMORPG）格式——美国陆军（America’s
  Army），这是一款美国陆军的第一人称射击游戏，也是招募工具。


  雷西维茨的作品给了陆将赫尔穆特·冯·莫尔特（Helmuth von Moltke）留下深刻印象。1828 年，莫尔特建立了一个名为“战争游戏协会”（Kriegspieler
  Verein）的俱乐部。当他在 1837 年成为总谋长时，他推动了战争游戏。朱利斯·亚德里安·弗里德里希·威廉·冯·维迪·杜内瓦（Julius Adrian Friedrich
  Wilhelm von Verdy du Vernois）在 1876 年出版了一本德国战争游戏。与《战争游戏》不同，内瓦消除了掷骰子，并引入了根据自己的战斗经验决定结果的裁判（Gray
  1995）。这种裁判角色后来以《地下城与勇龙》中地下主的的形式再次出现。


  战争游戏的重要性在 1870 年普鲁士民兵军击败法国职业军时成为关注焦点。许多人认为战争游戏是普鲁士成功的关键。突然之间，全世界的军队都在建立自己的战争游戏系统。






  美国陆军威廉·R·利弗农（William R. Livermore）在 1882 年引入了美式战棋（American Kriegspiel）。海军战争学院的创始人威廉·麦卡蒂·利特（William
  McCarty Little）结识了利弗农。多亏利弗农，利特将战争游戏变成了战争学院课程不可缺的一部分。由此，一系列复杂的战争游戏规则应运而生。


  现代战争游戏诞生于 1913 年，归于英国科幻小说作家威尔士。书名不可思议——《小战争：适合十二岁到一百五十岁的男孩，以及喜欢游戏和书籍的更聪明的女孩的游戏。》。威尔斯的贡献不可低估。《小战争》的规则结合后来的塑料玩具兵，将战争游戏推向了军事和贵族之外更广泛的受众。它还建立了大炮弹药爆炸半径的概念，盖瑞克（Gygax）后来将这一特征应用于《地下城与龙》中的火球术（Wells
  2004）。


  第一次世界大战后，《凡尔赛条约》剥夺了德国组建足够进行演习的军队的权利，因此战争游戏取代了实际战斗成为训练工具。战争游戏在第二次世界大战中也发挥了关键作用。海军司令官切斯特·W·尼米兹（Chester
  W. Nimitz）宣布，战争游戏是美国海军击败日本的重要组成部分。


  1953 年，查尔斯·罗伯茨（Charles Roberts）通过 Stackpole 出版社出版了一款名为《战术》（Tactics）的游戏。《战术》的独特之处在于它使用了纸板地图和纸板计数器。这些变化让游戏更容易上手且易于分发。该游戏的成功导致了阿瓦隆山公司（Avalon
  Hill）的成立，该公司成为了纸板战争游戏最卓越的制造商。


  战争游戏在当时很流行，但难以达到其他游戏媒介的影响力。战争游戏的根源主要吸引对历史感兴趣的人。在这一爱好的早期，历史准确性最重要，因为大多数游戏都在复制真实的战斗。


  托尼·巴斯（Tony Bath）在将战争游戏的感知从纯粹的历史性转向基于幻想方面做出了重大贡献。他基于罗伯特·E·霍华德的柯南故事创作的《海波里亚》（Hyboria）战役通常被认为是第一款幻想战争游戏。


  直到 1968 年，戴夫·韦斯利（Dave Wesley）将模型游戏从两种结果二一变为多重结果的零和游戏，其中不同方有不同的目标，并非所有目标都是彻底毁灭敌人（Fine
  1983:13）。韦斯利认为这种多人游戏是失败的，但他的一位玩家有不同的看法。那位玩家是戴夫·阿内森（Dave Arneson），“城堡与十字军协会”的成员，并最终成为《地下城与龙》的共同作者。


  Guidon Games 于 1971 年出版了中世纪模型战争游戏《战链》（Chainmail）。它随后由`TSR, Inc`发行并推出了多个版本，一直流通到
  1979 年。在阿内森的一次游戏中，一位德鲁伊大祭司施了一个咒语，击倒了一头罗马战象。这个咒语的灵感来自电视上播放的《星际迷航》剧集——因此我们第一次窥见到战斗中的法术，这可能是永恒“魔法飞弹”的前身。我们将在下一章讨论《地下城与龙》的历史。


  1972 年，Guidon Games 发布了《不要放弃船只！》（Don’t Give Up the Ship!）。这是加里·盖瑞克与戴夫·阿内森的首次合作，它是护甲等级、生命值和士气等特征的祖先（Raymond
  2010），这些特征后来整合进了《地下城与龙》中。


  桌面模型战争游戏《战锤幻想战役》（Warhammer Fantasy Battle）由 Citadel Miniatures 于 1983 年发布。它将文艺复兴时期的欧洲与中土世界元素相结合，为精灵、矮矮人和兽人等传统幻想种族分配了类地球的国家和文明。《战锤》还借鉴了罗伯特·E·霍华德和迈克尔·穆科克的小说作为灵感。该游戏持续演变了七个，至今仍是最受欢迎的幻想战争游戏（由`Wargames
  Workshop`出版）。


  1985 年，《战链》的继任者《战斗系统》（Battlesystem）发布。它同时与《地下城与龙》的高级版和基础版兼容。与之前的《战链》一样，《战斗系统》与《地下城与龙》合并，为大规模战斗提供了规则。《战斗系统》使用单位；每个模型代表单个英雄或两人、五人或十人的小组。该系统没有为怪物提供基础统计数据，而是使用击败怪物后获得的经验值作为分值。《战斗系统》假设两名玩家之间之间没有地下城主担任裁判。


  《战斗系统》专为 15 毫米和 25 毫米的模型设计。尽管规则可以容纳 15 毫米比例的模型，但后者的比例成为了英雄模型的标准，1989 年修订后的《战斗系统》切换到
  25 毫米为标准。


  Wizards of the Coast 在 1994 年通过《万智牌对战》（Magic: The Gathering）彻底改变了卡牌游戏行业，启动了琳琅满目的收集卡牌游戏。这种收集卡牌游戏创造了几种惯例，包括以包的形式发行游戏分册、相互作用的可变规则系列、近乎无限的定制程度，以及通过在桌上对对手放置卡牌来“横置”（tapping）操作（Lang
  2007:87）。


  《环戒战略战斗游戏》（Lord of the Rings Strategy Battle Game）由 Games Workshop 于 2001 年发布，以配合电影《环王：护戒奇》的上映。它包含了战争游戏爱好中的常见元素：收集和涂装模型以及地形。






  这种有趣的机制让收藏级模型对兵模型游戏玩家的吸引力下降，却对《地下与迷城》玩家更具吸引力。兵模型游戏玩家将模型视为具有点数分配和技能的部队。而《地下与迷城》玩家需要特定的模型是因为某个遭遇战需要它。例如，`stirge`
  是一种吸血的、像蝙一样的怪物，会大量出现。由于 `stirge` 在《地下与迷城》模型游戏中是一种稀有模型，而且因为《地下与迷城》游戏中成群使用 `stirges`，导致
  `stirge` 在二级市场（通常是 `eBay`）上的价值不断上涨。


  在收集了大量此类模型后，我可以肯定地说，这个系统运作得符合预期。我购买模型既是为了获得稀有模型的快感，也是为了在我的游戏中使用它们的额外用途。像许多其他《地下与迷城》玩家一样，我坚持为游戏中的每个角色配备一个完美的模型。


  最终，生产成本、全球经济衰退以及单个模型的后市场竞争，使得随机化成为《地下与迷城》游戏中一种不可行的成本模型。考虑到像我这样有收集癖的地下城主（Dungeon
  Masters），收藏级模型可能还会存在一段时间。


  ### 叙事


  兵模型战争随着每一场活动而改变叙事。开展包含一系列战斗战役是可能的，但这并非常态。正如我游戏小组中的一名玩家所说：


  兵模型游戏带来的故事非常少。然而，兵模型游戏世界的背景设定（fluff）其实相当广阔，而且能够将涉及精美模型和地形的视觉元素融入游戏，使得兵模型战争成为一种令人愉快的体验
  [Webster 2010]。


  尽管幻想和科幻游戏有自己的叙事，但历史战争游戏有不同的看法。从本质上说，历史战争游戏假设历史是可以被改变的，玩家通过他们的行动干预可以改变战斗进程。本质上，玩家的角色不仅是军队的指挥官，而且是一个至少与过去伟大的历史将领平齐的指挥官。有时将领并不那么伟大；在许多场景中，玩家试图纠正过去军事失败的错误。


  最初的 `Chainmail` 规则专注于再现中世纪战争。因此，其目标之一是“引起战争玩家的足够兴趣，让他们开始追求中世纪的历史”。这种研究旨在“至少丰富新历史学家的生活，也许……甚至对历史研究本身做出贡献”（Gygax
  and Perren 1971:8）。这种与历史准确性的联系在当时的兵模型战争中根深蒂固。《地下与迷城》在后续迭代中继承了这一遗产，提供了关于长柄武器和其他中世纪战争方面的细节。


  ### 个性化


  历史兵模型战争超越了规则。寻求再现特定战斗的玩家必须进行自己的研究，以确定合适的部队类型、地形甚至是涂装部队的颜色。再现这些小规模战斗既展示了玩家的艺术技巧，也展示了历史知识。


  除了涂装，一些玩家可以通过“拼装（kitbash）”来组合模型套装，甚至从零开始雕刻自己的模型以创建完全独特的形象。这种个性化可以延伸到模型之外，包括以类似于模型铁路爱好者的方式设计战场地形。


  四个重大进展源于战争游戏，随后被角色扮演游戏，特别是《地下与迷城》所采纳：生命值、护甲值、士气和豁免投掷。生命值，正如 Gygax 在 `Advanced Dungeons
  & Dragons Player’s Handbook` 中描述的那样，代表了角色在死亡前可以承受的伤害量。这是一个令人困惑的术语，因为“命中（hit）”的定义可能不同。生命值可以代表肉罚、运气、技能和其他因素（1978:34）。`Dungeon
  Master’s Guide` 解释说，生命值的增加归功于纯粹的运气、高度发达的第六感，甚至是神圣的保护（1979:82）。


  在兵模型战争中，生命值效果良好，因为部队数量巨大使得这种抽象变得很有必要。单位通常不会通过等级增加力量，因此没有必要增加生命值。部队根据类型和战场状况变得更强或更弱，部队类型的力量水平很大程度上保持静态。


  生命值一直一直是《地下与迷城》中的一个抽象概念。批评者声称它未能准确代表战场状况，特别是当高等级角色能够从千英尺坠落或爆炸中生存时。后来实施了巨伤害规则（具体视游戏版本而异），确保角色有机会在这类可怕事件中死亡。还实施了致命一击（Coup-de-grace）规则，使得一个无助的角色尽管拥有大量的生命值也会死亡。


  如果说“生命值（hit points）”这个短语对于开发角色角色来说似乎是一个奇怪的选择，那么“护甲值（armor class）”更加奇异。护甲值决定了角色被武器击中的容易程度。这个数字不仅限于护甲，还包括生物的大小、敏捷度，甚至是其额外维度的形式（1978:36）。


  护甲值和生命值的可能来源是 Dave Arneson 的海军民用战争游戏规则 `Don’t Give Up the Ship!`（Rausch 2004）。对于关于铁甲舰的内战海军战斗游戏来说，护甲值非常有意义。铁甲舰的装甲是抵抗轰炸的重要因素，而船只的“级”指的是设计相似的船只。尽管护甲值可能受到了
  `Don’t Give Up the Ship!` 中规则的启发，但在游戏规则中并没有这个名字的显式属性（Finarvyn 2007）。更有可能，Arneson
  关于护甲值的家庭规则并没有进入战争游戏的最终出版版本。


  在《地下与迷城》之后的大的角色扮演游戏都放弃了将防御定义为护甲值的观点。就像生命值中的“命中”一词一样，这个短语暗示“装甲”是唯一的防御形式。“等级（class）”一词既过时又被用于其他形式，如角色的职业。现代
  d20 规则集源自《地下与迷城》第三版，完全放弃了护甲值，并用防御（defense）来取代。


  `Advanced Dungeons & Dragons Dungeon Master’s Guide` 将士气定义为战斗意志（Gygax 1979:67）。士气首次出现在
  `Don’t Give Up the Ship!` 中，作为决定登船和船员类型的因素（Finarvyn 2007）。随后它被用作确定随从、雇佣以及玩家角色雇用的所有非玩家角色的规则。






  豁免掷（Saving throws）是处理危险情况的一种额外机制。`Don’t Give Up the Ship!` 将豁免掷设计为决定士气是否下降的掷骰。在
  `Dungeons & Dragons` 的后期版本中，豁免掷变成了复杂的针对特定情况机制，用于确定瘫痪、中毒、死亡魔法、石化、变形术、法杖、权杖、魔杖、法术和吐息武器对玩家角色的影响。`Dungeons
  & Dragons` 第三版将豁免掷简化为体质（影响角色的身体韧性）、敏捷（角色避开攻击的能力）和意志（通过意志力抵抗影响）。第四版进一步简化了豁免掷，使其与战斗系统接轨；体质、敏捷和意志现在成为一种像护甲等级一样的防御形式，而进攻攻击通过“击中”这三项豁免掷来实现。


  ### 风险


  兵棋游戏的侧重点是冲突，无论是通过大规模战斗还是小规模的游击战。游戏中没有规则可以避免战斗，因为那违背了游戏的整个初衷。通常假设在游戏开始之前，战争游戏宇宙中的谈判已经破裂。游戏从战争爆发时开始。


  这些冲突的后果被施加在很大程度上无面的士兵身上。玩家的角色仅限于小组指挥官。然而，这个角色不应被低估；虽然指挥官的身份可能没有玩家本人明确区分，但士兵的特征却然如此（Barton
  2008:8）。在这方面，`Chainmail` 是突破性的；其人与人战斗的规则打破了用一个微缩模型代表游戏中十个、二十个、五十个甚至一百人的传统（Gygax
  1987:20）。事实上，第四版从 `Dungeons & Dragons Miniatures` 游戏中中学了经验，通过为每个玩家和怪物提供随每个回合变化的战斗选项，使战斗对所有参与方来说都变得更有趣（Wilkes
  2008:27）。


  在 `Little Wars` 中，H.G. 威尔士指出，微缩兵棋游戏展示了真实战争的愚蠢和复杂性。“你只需要玩几次 `Little Wars`，就能意识到大战战是一件多么失误的事情”（Wells
  2004:67）。


  ## 角色


  总的来说，大多数兵棋游戏由两个或更多玩家组成，没有裁判。不过，某些情况下存在某种形式的游戏主宰，包括 `Warhammer Fantasy Battle`（Halliwell
  1984:8）。


  ### 创建者角色


  微缩兵棋游戏始于模拟军事战斗，玩家在其中扮演历史角色，代入领导他们的指挥官的角色。这为玩家提供了一个机会，与过去的想象对手斗争，而这些对手反过来也领导着自己的部队。当然，每个模拟复制战斗的能力仅取决于系统允许的准确性。我们将在下一章介绍游戏主角色。


  ### 模型师


  微缩创作的实操方面不应被低估。微缩游戏可能涉及对大量模型和地形进行涂装和模具。因此，在游戏内外创作和展示这些微缩模型具有某种形式的地位。定制模型展示了雕塑技巧；涂装模型同样展示了涂装技巧。近期预涂塑料微缩模型的出现使得微缩兵棋游戏的声望发生了某种转变，从艺术技巧（涂装、建模）转向了购买力。结果，随机模型对微缩兵棋行业产生了重大影响。


  ### 收藏者


  拥有大量微缩模型或卡牌是玩家可支配收入的证明。由于随机性或稀有物品更昂贵的事实，收藏者有自己的形式的声望。模型师可以展示他的艺术技巧，而收藏者则展示了他的财富。微缩模型玩家毫不夸张地将他们在模型上的投入与买一辆新车的投入相比。


  与建模这种需要时间、耐心和奉献的艺术技巧不同，收藏取决于玩家的可支配收入。富裕玩家可以购买军队和卡牌，理论上这使他们在游戏中具有优势。


  ## 参与者角色


  `Wizards of the Coast` 的调查显示，4% 的玩家玩微缩兵棋游戏（约 370 万人），2% 的人每月玩一次（约 180 万人）。在玩家中，21%
  为女性。此外，37% 的人还玩桌面角色扮演游戏，40% 的人玩电脑角色扮演游戏（2000）。


  ## 玩家


  由于设置游戏和通过微缩模型准确代表士兵的成本，兵棋玩家倾向于年龄较大，因此具有更强的购买力。由于成本原因，微缩模型玩家倾向于专业化，专注于特定的游戏时代或军队类型。


  与其他形式的桌面游戏不同，微缩兵棋游戏是一种非常有参与感的体验。这可能是由于运行大规模兵棋游戏需要大量的空间；游戏店和爱好商店比家里空间大。由于兵棋游戏的规模，多个玩家可以参与其中，要么协助游戏，要么在游戏内部扮演较小的角色（如中尉）。


  观看微缩兵棋游戏的运行中有一种美学上的愉悦。凭借正确的地形和模型，兵棋游戏是一种无法被任何其他媒介轻易复制的触觉体验。


  ### 角色角色


  玩家承担的首要人格是指挥将领。


  #### 将军


  兵棋游戏将玩家置于将军或神的角色中，处于行动之上，从远处控制军队（Barton 2008:8）。军事微缩模型游戏“让参与者充当大小不一部队的指挥官，他们即将投入战斗或已陷入战斗之中”（Gygax
  1987:18）。


  我玩过几次 `Battlesystem` 遭遇战，结果各不相同。`Battlesystem` 规则中关于参与并被“摧毁”的单位规定使用了一个表格，在运气糟糕的情况下会导致英雄在战场上消失。`Warhammer
  Fantasy` 第二版甚至允许这些重要角色奇迹般地生存，但带有严重的伤势惩罚（Halliwell 1984:62）。本质上，英雄的独特和重要价值被简化为一次卑劣的掷骰。在该表格上的一次掷骰就说服了我不想经常使用
  `Battlesystem`。自己的，那个矮人指挥官在战斗中生存了下来。


  最后，兵棋游戏并没有与玩家进行一对一的积极互动。虽然玩家认同一方或一支部队，但他们对战场上的个体并没有深层的情感连接。与角色建立的能力是区分角色扮演游戏与兵棋游戏的关键因素（Barton
  2008:8）。


  ### 状态


  与桌面角色扮演游戏不同，角色通过获得等级或新能力来获得力量。相反，玩家通过建立更大的军队来获得力量（Barton 2008:8）。`Chainmail` 为玩家提供了选项：通过从记录中选择两个对立力量、分配点值或创建一个战役情况，让大军在地图上移动直到冲突。最终，双方之间的平衡最好通过经验来决定（Gygax
  and Perren 1971:6）。





  战争游戏的魅力之一在于每个剧本的“重置”。玩家使用点数来在公平的起点开始，但一旦游戏开始，获得战术优势就取决于每位玩家自己了。游戏之间的连续性并不如游戏本身重要。战争游戏玩家之间仍然存在某种形式的地位，但这种地位并不与游戏中的单个单位挂钩。这使得地位的重心从游戏内成就转移到了游戏产物上：游戏中使用兵模型的稀有程度、涂装者或雕塑家的艺术能力，以及玩家收藏卡或微模型收藏的购买力。


  ## 结论


  关于在《地下城与龙》（`Dungeons & Dragons`）中重新引入微模型，已有许多论述，考虑到这其实是一个讽刺的指控，因为角色扮演游戏正是起源于微模型战争游戏。正如
  `Fine`（1983:108）所言，早期的角色扮演游戏在确定角色彼此以及对手之间的物理位置时经常面临挑战。共享现实的一个重要基础是每个角色正在活动的大致描述：站立、坐着、在房间尽头或在附近低语。当空间关系没有被明确定义时，就会产生混乱。在我担任地下主的游戏中，其中一名玩家没有注意到描述中提到一个强大强大的敌人就在他身后。当角色转过背时，他付出了生命的代价。微模型有助于澄清空间关系。


  微战争游戏拥有悠久而自豪的谱系，教授了关于重要战役的宝贵教训，在某些情况下，甚至为那些无法部署正规部队的真实指挥官带来了成功。当《地下城与龙》问世时，历史战争游戏玩家和桌面角色扮演者之间产生了相当的紧张关系。随着预涂色模型的出现，该行业被进一步推向主流，这让更年轻、不富裕的玩家能够收集负担得起的模型，并在无需查阅晦奥秘籍的情况下理解规则。


  然而，并非所有人人都将角色扮演视为这种媒介的成熟演变。正如 `Barton` 在《地下城与桌面》（`Dungeons & Desktops`）中所说：“……路过几个正激烈讨论着格蒂斯堡战役的战争游戏玩家是一回事——即使看到成年人移动涂装微模型的场景在某些人看来可能很幼稚。然而，当人们对巫术和巨龙表现出同样的激情时，更不用说对恶魔和黑暗祭司了，完全是另一回事了”（2008:18）。


  在下一章中，我们将探讨《地下城与龙》如何在第三版中回归其微模型根源，以及它对伙伴关系结构的影响。


  ## 三


  ### 桌面角色扮演游戏


  这是一种幻想 RPG，其前提是人类在很大程度上是由好人组成的。人类在半人盟友的帮助下，是且应该是世界上的主导力量。尽管邪恶的威胁无处不在，他们已经并继续保持着这一地位，这主要由于最英雄的人类和半人的奉献、荣誉和无私——这些角色的角色是由游戏玩家所扮演的
  [Gygax 1987:26]。


  ## 引言


  在数千年的娱乐游戏基本形式中，包括桌上游戏、棋游、卡牌游戏和客厅游戏，角色扮演游戏是近期加入的成员（Gygax 1989:151）。角色扮演游戏由一套规则组成，玩家根据这些规则进行角色扮演。通常有一套核心规则书包含游戏的机制和整体设定，有时分为玩家书和地下主书。设定集通过新的职业或高级规则详细阐述游戏世界。剧本集（有时称为冒险或模块）是地下主用于与玩家一起的故事线（Harrigan
  and Wardrip-Fruin 2007:1）。


  我对《地下城与龙》的早期体验非常困惑。我在数学方面感到很困难——`护甲等级 0 命中值（THAC0）`对我来说完全没有意义，生命值进度表也是如此。我所经历的混乱我的玩伴们也有同感：


  ```

  我记得玩过 D&D。当我们刚开始时，是在你房间里玩，游戏板放在床上，我们在地板板上掷骰子。我是一个牧师。我非常确定在那时完全不知道牧师是什么……那里有要掷的骰子，有我们要遇到的剧本。我想那里有攻击点、魔力点、法术，我通常很困惑。我不确定那时是否领会了其中“角色扮演”的部分。我习惯于那些有明确目标且可以在一小时左右完成目标的游戏
  [Herriman 2010]。

  ```


  《地下城与龙》经历了几个版本，自 1974 年以来已有九多个（Mona 2007:25）。对于我们的目的，我们将主要关注原始《地下城与龙》盒装版（`OD&D`）和《高级地下城与龙》（`AD&D`）版本的影响。遵循这条路径将帮助我们追溯出从中尔大陆到《地下城与龙》再到电脑角色扮演游戏（`CRPGs`）的直接进化路线。


  由于早期版本的《地下城与龙》强调地下主应该创建自己的世界，甚至修改自己的规则，游戏不断被爱好者们进行改进。这种频繁的实验创造了一种交叉融合的水平，影响了此后所有形式的游戏。


  在《地下城与龙》第二版发布后，它对 `CRPGs` 的影响减少了。平衡在后期版本中发生了反转，许多在 `MUDs` 和 `CRPGs` 上引入的完善方案影响了第三版和第四版的《地下城与龙》。我们将在后的章节中提到这些完善方案。


  在本章中，我引用了盖益高（Gygax）和阿内森（Arneson），即《地下城与龙》的创作者。这并不是要暗示他们是幻想游戏的最终权威。他们的观点随着时间而改变，两位创作者都对游戏的某些改进表示反对。虽然
  `Gygax` 和 `Arneson` 绝非游戏开发的最终定论，但他们的贡献是游戏历史的重要部分。


  ### 历史


  1967 年，一种名为《波登堡围战》（`The Siege of Bodenburg`）的 40 毫米微模型模型战争游戏在《策略与战术》杂志上发表。杰夫·佩伦（Jeff
  Perren）开发了自己的规则并与盖益高分享了这些规则。


  1969 年，戴夫·韦斯利（Dave Wesley）在明尼苏达大学主持了一场战争游戏活动，玩家在一个名为“布劳斯坦”（`Braunstein`）的拿破仑剧本中代表个人角色。当时，这种发明晚上战斗剧本的地下主概念实际上受到了《战略学：美国战争游戏》（`Strategos:
  The American Game of War`）。这是由查尔斯·阿迪尔·路易斯·托滕（Charles Adiel Lewis Totten）编写的美国军战争游戏训练手册，由双丛出版公司于
  1880 年出版。`Wesley` 在明尼苏达大学图书馆发现了一本书，并在“布劳斯坦”游戏之前对其进行了改编。`Wesley` 在阅读了肯尼斯·斯威齐（Kenneth
  Swezy）的《完全策略家》（`The Compleat Strategist`）后读到了“n 玩家”策略游戏的概念。


  韦斯利小组通常由八个人组成，其中两人玩，其他六个人观察。为了更具包容性，他为其他玩家开发了通常战争指挥官之外的角色。`Wesley` 发明了市长、银行家、大学校长等角色，每个角色都有自己的目标和愿望。当近二十个人出现时，`Wesley`
  也为他们构思了角色。





  令人深思的是，玩家是在一个独立的房间里接收指令的，韦斯利（Wesley）在那里对他们进行了简报，并且被禁止相互分享信息。本该是一套有序的指令，但当两名玩家——一名是普鲁士军队军官，另一名是亲法激进学生——告诉韦斯利他们约战决斗时，一切陷入混乱。韦斯利再次被迫即兴发挥；他掷了一些骰子，宣布其中一人射中了另一人，获胜者被关禁。游戏一直持续到深夜，此时韦斯利意识到玩家们已经接管了游戏——他精心设计的、最终将决定胜负的规则已不再适用。对韦斯利来说，这场游戏是失败的。


  后来，韦斯利运行了第二个版本的游戏，将玩家置于虚构香蕉共和国的领导人角色。戴夫·阿内森（Dave Arneson）是这两个游戏的参与者。戴夫·阿内森继续运行 `Braunstein`
  的版本并开始发明新的剧本。最终，他将它们扩展，包含了当时流行的《指环王》和《黑暗幻影》（Dark Shadows）中的思想。这最终导致了 `Blackmoor`
  的诞生（Wesley 2006）。


  韦斯利还声称使用了多面骰子，而在那之前，这些骰子一直被教授用作教学工具。四面、八面、十二面和二十面骰子至今仍用于桌面角色扮演游戏。


  ### 《链杀》的演变


  与此同时，盖瑞·盖格克斯（Gary Gygax）创立了“城堡与十字军协会”，作为“国际战争游戏联盟”的一个特殊兴趣小组。1968 年，他与杰夫·佩伦（Jeff
  Perren）出版了《链杀》（（Chainmail），这是一款中世纪战争游戏（Mona 2007:25）。在《链杀》的核心规则中，每个兵模型代表二十个人。部队类型分为轻步兵、重步兵和装甲兵，以及轻骑兵、中骑兵和重骑兵。


  盖格克斯和佩伦在 1971 年为《链杀》增加了一份十五页的“幻想补充手册”，由 `Guidon Games` 出版。它增加了马术、一对一近战，以及最重要的是幻想生物。《链杀》的“幻想补充手册”引入了许多持久的幻想概念，包括元素精、不同颜色的龙，以及现在已成为典型的火球术、闪电术和变形术。这些法术与火炮的力量相当；火球造成的伤害相当于弹石机，而闪电等同于大炮。生物根据阵营分为秩序与混沌，借鉴了穆尔科克（Moorcock）在《埃里克》（Elric）系列中类似的阵营哲学。每个幻想生物都被视为部队类型。霍比特被视为轻步兵，精灵被视为重步兵。单个英雄的力量等于四名重步兵。


  ### 战役游戏的诞生


  是阿内森在他的 `Blackmoor` 战役设定中将“幻想补充手册”应用于地下城探索。与 `Braunstein` 不同，阿内森的 `Blackmoor` 是一个具有无限系列进展的战役（Whetsell
  2006）。当他的玩家们厌倦了标准怪物时，阿内森提供了各种选择。游戏本身并非完全关于战斗。角色可以通过战斗穿越地下城，也可以通过下水道系统潜行。最重要的是，这是合作游戏。只有当小组成功时，玩家才成功。


  1971 年，在威斯康星州湖内瓦的一次会议上，阿内森向盖瑞·盖格克斯展示了他的英雄幻想特种兵袭击计划，后者深受震撼。盖格克斯与阿内森合作，共同制定了一套最初被称为“幻想游戏”（Fantasy
  Game）的规则。由于找不到出版商，他们将游戏重命名为《地下城与龙》（Dungeons & Dragons）（Archer 2004:43）。1973 年，盖格克斯与唐·凯（Don
  Kaye）和布莱恩·布鲁姆（Brian Blume）在一个名为“战术研究规则”（Tactical Studies Rules）的小组中合作。由于凯的意外去世，伙伴关系解散了。该游戏在当年的“复活节会议”（EasterCon）上出现。到
  1973 年底，预售副本已经流传，但《地下城与龙》的首个商业版本于 1974 年 1 月出版（Costikyan 2007:5）。


  ### 商业成功与规则集


  按照当时的战争游戏标准，《地下城与龙》正取得巨大的成功。1974 年底之际，“战术研究规则”已售完所有的 1000 份。当年 11 月，他们又订购了 2000
  份，结果在 1975 年 4 月就售光了。7 月前又售出了 3000 份。显然，《地下城与龙》的吸引力已经超越了战争游戏玩家。粉丝的需求是无止厌的。


  1973 年 11 月 1 日（我恰好在一年前出生），盖格克斯为第一本《地下城与龙》规则书写了序言。《地下城与龙》由三本小册组成：《人类与魔法》（Men & Magic）、《怪物与宝藏》（Monsters
  & Treasure）以及《荒野与地下城冒险》（Wilderness & Dungeon Adventures）。它包含四个种族（人类、矮人、精灵和霍比特）和仅有的三个职业（战士、魔法师和牧师）。它还引入了以前从未存在过的个人属性：力量（Strength）、智能（Intelligence）、智慧（Wisdom）、敏捷（Dexterity）、体质（Constitution）和魅力（Charisma）。这是对过去战争游戏的量子飞跃，因为这些属性描述的是个人，而不是一个单位。


  《人类与魔法》建议“如果玩家有条件且愿意的话”使用兵马模型，但并非强制要求。他们提供了纸板计数器作为替代，“尽管这些纸板碎片本身缺乏多样化且色彩鲜艳的兵马模型那样的视觉吸引力”（Gygax
  and Arneson 1974）。


  由于盖格克斯和阿内森都在使用《地下城与龙》规则运行自己的游戏，他们决定出版介绍各自战役的扩展内容。盖格克斯的游戏《灰要塞》（Greyhawk）引入了圣骑士和盗子职业。阿内森的游戏《Blackmoor》引入了僧侣和刺客职业。最后出版了《神秘巫术》（Eldritch
  Wizardry），它引入了德鲁伊职业以及灵能。下一部是《神灵、半神与英雄》（Gods, Demigods, and Heroes）。它列出了供使用的各种神系，包括《埃里克》（Elric）和柯南（Conan）。


  《剑与魔法》（Swords and Spells）是该系列的最后一部。它在《链杀》的基础上（盖格克斯在引言中将其称为《链杀》的孙子），提供了与《地下城与龙》更兼容的微缩战斗规则。因此，仅仅几年的《地下城与龙》完成了一个圆圈，回到了它的微缩根源。


  粉丝运动继续发展，对于如何改进游戏产生了大量的讨论。这种审查和改进的精神导致了几个《地下城与龙》的竞争产品。在游戏术语中，这些《地下城与龙》变体被称为“幻想破碎者”（Fantasy
  Heartbreakers），这是罗恩·爱德华（Ron Edwards）创造的词。正如爱德华所解释的，“幻想破碎者”在存在和细节上表现出的动力、投入和个人快乐方面令人印象深刻——尽管它们也令人抓狂……它们相对于源头仅只有一步创造性的进步”（Edwards
  2002）。


  简化《地下城与龙》的早期尝试之一是肯·圣·安德烈（Ken St. Andre）的《隧道与地精》（Tunnels &Trolls）（Astinus 1998）。《隧道与地精》于
  1975 年发行，类似的属性、职业和冒险。它确实引入了基于点的魔法系统，专门使用六面骰子，并在整体上提供了更好的规则解释。它也为该类型带来了一种调皮的乐趣。





  1977 年是《龙与地下城》的转折点。这一年诞生了由`J. Eric Holmes`编辑的`Basic Dungeons & Dragons`，它的谱系主要源自原版盒装，但针对年轻玩家进行营销。它也以盒装形式出售，适用于玩具商店销售。一年后，`Advanced
  Dungeons & Dragons`以硬本格式出版，其中包含了`Gygax`为了进一步推进游戏而做的说明。


  这两个游戏之间的区别让许多玩家感到困惑，也包括我在。“高级”（advanced）究竟意味着什么？我母亲在我生日时为我买了`Basic Dungeons & Dragons`盒装版，我在七岁时还在苦苦学习如何玩。第二年，我姨为我买了`Advanced
  Dungeons & Dragons`硬本书，她并不理解这两个游戏之间的区别。令我失望的是，我发现这两个游戏并不完全兼容。


  `Advanced Dungeons & Dragons`的第一硬本版`Monster Manual`于 1977 年发布。`Player’s Handbook`随后于
  1978 年出版，`Dungeon Master’s Guide`则于 1979 年出版。


  我们的游戏小组通过基础规则的主规则集一路升级。主规则集（黑盒）的发布时间与高级规则的`Unearthed Arcana`几乎同时。此时我们必须做一个决定；我拥有所有的硬本规则，并假设当我变得足够“高级”时，我们就会切换。但关于我们是否足够“高级”的共识一直存在分歧，这种切换在我的游戏小组中造成了相当大的分歧。最终，我们都转到了`Advanced
  Dungeons & Dragons`的第一版。


  随着 1979 年密歇根州立大学学生`James Dallas Egbert III`的失踪，《龙与地下城》品牌蒙受了损害。一种类似《龙与地下城》的游戏被指导致了他的失踪。`Jack
  Chick`的传单《Dark Dungeons》以及`Pat Pulling`写的《Bothered About Dungeons & Dragons》（`BADD`）都传播了宣传，将《龙与地下城》与邪教活动紧密联系在一起，他们认为这些活动对全美的青少年构成了威胁。`Pulling`甚至向警察提供小册和指南，并出现在电视节目中传播谣言。作为回应，作者兼游戏设计师`Mike
  Stackpole`在`The Pulling Report`中揭穿了她的努力。`Stackpole`确定`Pulling`歪造了她的身份。在 1990 年报告发布后，她离开了`BADD`（`Stackpole`
  1990）。


  1989 年，`Advanced Dungeons & Dragons`第二版出版。这个版本通过量化命中护甲等级 0 所需的骰点数（`THAC0`）简化了战斗系统。动作的单位从英制改为现实标尺中的英尺，半人种族（精灵、半身人等）被变得更具可行性的角色，引入了暴击规则，并尝试让《龙与地下城》变得“妈妈友好”。恶魔和魔鬼被重新命名（生物本身在很大程度上保持不变），删除了`assassin`职业，游戏专注于扮演英雄化、高尚的角色。


  第二版是我的赖生之本。游戏世界的激增使其成为一个令人兴奋的游戏时代；`Dark Sun`设定在末日后的未来，`Ravenloft`提供了哥特式恐怖，而`Spelljammer`提供了通俗未来主义。我使用了所有这些元素，将我的战役变成了一个外星人、哥特式恐怖和末日后愤世主义的杂烩，这后来影响了`RetroMUD`的创建。


  到 2 世纪 80 年代后期，许多其他游戏系统正在侵蚀`TSR`的统治地位。《万智牌》提供了一种收集卡牌游戏的幻想变体，而角色扮演游戏的重心从高幻转向了恐怖和科幻。到
  1998 年，`TSR`申请破产，随后被《万智牌》的创造者`Wizards of the Coast`收购。


  《龙与地下城》第三版于 2000 年由`Wizards of the Coast`发布。该系统简化了《龙与地下城》，并专注于投掷 20 面骰子。支持方案被称为`d20
  system`。在第二版中以“非武器精通”这种生硬方式引入的技能（Skills）被法典化。引入了专长（Feats），一种针对技能范围之外的英雄行为的规则系统。新系统简化了游戏的某些方面，如移动，并尝试通过“机会攻击”规则来量化其他情况，这一规则一直不受玩家欢迎。引入了声望职业（Prestige
  classes），这通过严格的准入要求进一步实现了角色个性化。术士（`sorcerer`）也被引入并独立于法师（`wizard`），更符合最新的幻想小说，让文西式魔法系统显得过时（`Barton`
  2008:23）。这个被称为`3.5`的系统在 2003 年 7 月再次进行了修订。


  除了`d20 system`，`Ryan Dancey`认为，那些觉得自己可以改进《龙与地下城》的“幻想幻灭者”设计师应该被视为游戏开发社区的一部分。通过开放游戏许可（`OGL`），他的努力为支持游戏公司承担创作冒险的风险成本铺平了道路，同时支持了构成《龙与地下城》的三本核心规则的销量：`Player’s
  Handbook`、`Dungeon Master’s Guide`和`Monster Manual`。通过向小型开发者开放许可，游戏领域爆发了，内容比以往任何时候多。


  这为幻想角色扮演提供了一些有趣的 er 路径。来自`Troll Lord Games`的`Castles & Crusades`简化了开放游戏许可规则，使其更符合原始《龙与地下城》盒装版的精神。`Kenzer
  and Company`创作的`HackMaster`延续了`Advanced Dungeons & Dragons`的一系列兼容规则。这两个例子证明了之前的任何版本从未停止开发，粉丝随着游戏的持续支持每一个分支。也许最重要的分歧是`Paizo
  Publishing`创建的`Pathfinder`规则集，它是`3.5 OGL`的派生，作为《龙与地下城》第四版的替代方案。


  2007 年 8 月，《龙与地下城》第四版在`Gen Con`上公布。核心规则书：`Player’s Handbook`、`Monster Manual`和`Dungeon
  Master’s Guide`于 2008 年 6 月发布。第四版与之前的版本不同，在重新设计《龙与地下城》方面发生了巨大的分歧（`Smith` 2008）。


  *伙伴谊*


  《龙与地下城》的关键要素之一是合作。不像电影等平行娱乐形式，或读书籍等孤独娱乐形式，角色扮演是一种共同的活动（`Gygax` 1987:13）。游戏中的合作是成功的关键，特别是在角色脆弱的低等级时期。





  角色扮演游戏公认的范式经过多年的完善，它假设玩家们会坐在一张桌旁。这一行为本身就有助于塑造游戏中角色的特质。这种设定假设玩家之间的距离足够近，可以进行互动。现场有一位
  `Dungeon Master`（地下城主），他可能坐在小组的中心附近。玩家通过掷骰子来决定结果，这意味着 `Dungeon Master` 和其他玩家都能看到这些结果。


  所有这些因素共同营造了一种团结感。与扑克游戏不同，玩家们都在同一个团队，拥有共同的目标：杀死怪物并夺取它们的战利品（Hite 2007:32）。当然，也有一些角色扮演游戏会积极阻碍这种和谐（例如
  `Paranoia`/幻觉症），但即便如此，人们觉得这都是为了好玩。胜利并没有真正的奖励，因为这是一种协作式的游戏风格。


  由于 `Dungeon Master` 是反派的唯一代表，玩家可以作为一个团队来克服任何障碍。他们感觉自己像一个团队，在桌旁紧密相邻。在商业术语中，这是一种目标导向的会议，旨在克服特定任务（而不仅仅是“赢得”），并且是反复进行的。


  ### 历史演变与规模


  有趣的是，`Dungeons & Dragons` 的原始盒装版列出了一名“裁判”（而非 `Dungeon Master`），并且单场战役可以处理四到五十名玩家。它建议的裁判与玩家的比例约为
  1:20 左右（Gygax 1974:5）。虽然原始的 `Dungeons & Dragons` 是一部更简单的游戏，但处理五十名玩家似乎是一项艰巨的任务。


  Gygax 的游戏在 1972 年开始只有少数玩家，但到 1973 年已扩大到十几。当 `D&D` 游戏出版后，玩家开始出现在 Gygax 家的地下室参加每周活动，有时超过二十人。为了容纳大众，他让
  `Rob Kuntz` 成为共同裁判。他们合并了地下城并合作同时管理大型群体。


  ### 呼叫者的角色


  大量的玩家产生了一个在今天看来不常见的额外角色，即 `Caller`（呼叫者）。在一个大型群体中，多达二十个人个人会让玩家的声音无法被听见。`Caller` 协调玩家的行动并组织他们的努力，以便
  `Dungeon Master` 做出相应回应。我曾同时玩过多达十二名玩家的游戏，发现无法根据现场情况妥善照顾每位玩家；某人（通常是安静的玩家）不可避免地会受到影响。


  在 `Role-Playing Mastery` 中，Gygax 后来澄清道，游戏主可以同时应对四名玩家；在有助手的情况下，可以管理最多八个人而不会过度影响整体游戏水平。他假设，通过多位游戏主和他们自己的助手，`Dungeons
  & Dragons` 可以容纳多达数十玩家（1987:87）。


  ### 团队合作与职业


  `Dungeons & Dragons` 很好地模拟了某些类型的奇幻，特别是冲突时期的团队合作。职业的区分划分了技能组，使得没有一个角色是全能的。因此，这鼓励了小组通过选择角色来相互平衡。随着游戏的演变，这些角色逐渐变得越来越正式化。Gygax
  明确识别了这些职业角色：`fighter`（战士）担任步兵角色，`thief`（盗贼）担任间谍，`cleric`（牧师）担任医生，以及作为 `artillery
  magic-user`（火炮魔法师）（Gygax 2007）。


  第四版正式规范了这些角色。在 `Worlds and Monsters` 中，`Chris Perkins` 解释了 `Dungeons & Dragons`
  第四版如何将队伍角色作为一种机制而非像第三版那样的假设。在第四版中，玩家可以理解每个职业所扮演的角色，以及他们的冒险队伍中有哪些空白（Wilkes 2008）。


  ### 团队工作与职业


  这种设定强调了团队协作的必要性。Gygax 后来澄清道，游戏主可以同时应对最多四名玩家；在有助手的情况下，可以管理最多八个人而不会过度影响整体游戏水平。在商业逻辑上，这是一个为了克服特定任务的目标导向的会议（而不仅仅是“赢得”），并且是反复进行的。
