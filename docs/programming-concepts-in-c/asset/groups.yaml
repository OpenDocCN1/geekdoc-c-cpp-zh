    # 7.5 Four Forms Of The If-Statement


    Several different forms of the if-statement have been presented so far, including
    with and without curly-brace containers. This section summarizes the four different
    ways that you can write such statements:


    # 7.5.1 if With A Curly-Brace Container


    The most common example has a multi-statement code block inside a curly-brace
    container. When the condition in the parentheses of the if-statement evaluates
    to true, the container’s code is not skipped.


    ![](img/80b9ed561fa57ed72adb64b305ef946d_122_0.png)


    Actually, this form can be used even when there is only one statement in the container.
    Some programmers prefer to always use a container, even if there’s just one statement
    in it.


    # 7.5.2 if Without A Curly-Brace Container


    Another common example has a single-statement code block without curly-branes.
    When the condition in the parentheses of the if-statement evaluates to true, the
    statement is not skipped.


    ![](img/80b9ed561fa57ed72adb64b305ef946d_122_1.png)'
  - '[PAGE 123]


    This offers a more condensed way to write code, without doubling the amount of
    vertical space by including curly-braces.


    # 7.5.3 All On One Line


    A single-statement code block can also follow the if on the same line, condensing
    the code even further.


    ```

    One-Line If-Statement

    if (...) statement;

    ```


    This is suitable for very short, single statements.


    # 7.5.4 Beware! With Semicolon


    There is no good reason to use this form, but it is valid, and your program will
    compile if you use it. The semicolon after the condition’s parentheses effectively
    cuts off the if-statement from whatever follows it - indented or not


    ```

    If-Statement With Semicolon

    if (...);

    ```


    The only reason for showing this form is to make you aware of this pitfall. It
    is a difficult programming error to diagnose, because the compiler accepts it
    and it leads to logically incorrect results when the program runs. It’s not uncommon
    for beginners to fall into this trap.


    ```

    An If-Statement THAT DOES NOT WORK AS EXPECTED!!!

    if (grade = ''A'');

    cout << "excellent" << endl;

    ```


    This sends “excellent” to the console screen for any value of grade - not just
    ''A''. The reason is that the semicolon at the end of the if-statement ends! Even
    though it is indented, the output statement does not belong to the if. It is a
    separate statement, as if it was not indented at all.'
