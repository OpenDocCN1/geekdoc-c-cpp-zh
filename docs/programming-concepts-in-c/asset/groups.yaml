    \nint main() {\n    int number = 99;\n    for (int i = 0; i < 16; i++) {\n   \
    \     cout << number; \n        number--; // 变成下一个较数字\n    } // for\n    cout\
    \ << endl;\n} // main\n\noutput: 99 98 97 96 95 94 93 92 91 90 89 88 87 86 85\
    \ 84\n```\n\n## 7.3.4 经典最大/最小值循环\n\n正如上一章介绍的那样，经典的最大/最小值问题是在三个值中找到最大和最小值。在这个变体中，我们使用事件控制循环，在无限数量的值中找到最大和最小值。循环使用“哨兵方法”控制——当用户输入一个预期范围之外的特定值时，它就是退出循环的信号。正如上一章的示例一样，我们使用测试分数，其值预期在\
