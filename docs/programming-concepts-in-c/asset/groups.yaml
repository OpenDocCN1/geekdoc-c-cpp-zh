    # Chapter 7. More Than One Way: Advanced Branching/Looping


    In part 1 of this book we learned to write C++ statements to be processed in sequential
    order, top to bottom. Then in the previous chapter we learned how statements and
    code blocks could be skipped over (using if-statements) or repeated (using while-true
    loops). In this chapter we''ll learn other ways to implement branching and looping
    besides if-statements, if-else, while-true, and if-break. They don''t really add
