    # ROBERT BURNS


    That’s when we get stuck, because we never developed the habit of thinking, understanding,
    and planning *before* coding begins.


    So here’s a compromise: we will not focus on understanding at first, so as not
    to dismiss the concept due to its apparent irrelevance. But later on in this book,
    when the solutions to problems are no longer obvious, the discipline of understanding
    and planning will be reintroduced in the form of “algorithms”.


    # 1.2 Editors


    An “editor” is a program used by programmers to write computer code. Code is a
    set of instructions that tells the computer how collect input, process it, and
    express the results as output. These instructions are not exactly written in English,
    although they do resemble instruction sets you may have seen in cooking (also
    known as “recipes”) or after you buy something that has “some assembly required”.


    Code is written in a “computer language”. Computer languages are *simplified*
    and *strict* versions of English. They are simplified in the sense that they include
    a *very small* subset of words from the English language, such as “if”, “while”,
    “for”, “break”, “continue”, and only a hundred or so others. Computer languages
    are also strict in the sense that you have to say things and punctuate things
    *just right*, or the computer will not understand you. You even have to spell
    precisely, and use uppercase where you are supposed to, and use lowercase where
    you are supposed to, or the computer will not know what you are talking about!
    It takes *intelligence* to understand nuances of language, like accents, mispronunciations,
    incorrect choice of words, and misspellings – and remember that it’s the *humans*
    who have the intelligence here, and not the computers.


    There are three categories of editors that are typically used for programming,
    as explained below: general-purpose text editors, code editors, and IDE editors.'
