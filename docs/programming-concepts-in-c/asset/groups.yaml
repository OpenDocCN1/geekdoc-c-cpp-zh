    The above program uses a text variable scoreFile to store the name of the text
    file. This is an alternative to typing the exact same name twice, in the two file
    opening statements (one for input and another for output). It is good programming
    practice to store a recurring value in a variable and use the variable instead
    of repeating the value.


    Study the above code listing, because there are some subtleties – see if you can
    identify and understand each:


    +   - Blank lines are used to separate blocks of code, making it easier for humans
    to read – it makes no difference to the compiler.

    - Variables are declared just before they are used, instead of putting all of
    them at the top of main – this is by programmer preference, as some programmers
    do put them all together at the top.

    - The .close() statements appear as soon as possibly can. This is not important
    for fout.close() because the program ends after that anyway. But it is important
    that fin.close() appear before attempting to open the file fout, because otherwise
    the file remains exclusively attached to the fin object and the fout would fail.

    - Both cout and fout are used there is output to both the console and a file.

    - The file output statements skip to the next line after sending their output
    to the file – is this important? What would happen if they did not skip to the
    next line?

    - This code listing is rather long and complicated. If there were any typing mistakes,
    what would the compiler errors look like? Try making some errors and see for yourself
    – you could leave out the C++ includes, semicolons, statements, or the C++ c str(),
