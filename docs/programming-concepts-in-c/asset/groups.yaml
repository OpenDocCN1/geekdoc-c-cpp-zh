    www.Xlibris.com

    Orders@Xlibris.com


    # Introduction


    Computers are great! You give them “input” and they produce “output”. Whether
    it’s typing an Internet address and seeing a web page with the latest news, or
    entering tax information and then printing a 1040 form with all supporting documents,
    or using an app on a smartphone to pay for your coffee, computers offer various
    ways for us to specify their input and have a variety of different ways to express
    their output.


    Computers are fast and accurate. Humans, by comparison are slow and, let''s face
    it, we make mistakes. Have you ever added the same list of numbers twice and gotten
    two different totals? But humans have something that computers do not – intelligence.


    Computers did not design the Internet, nor did they devise the tax code. Computers
    did not design how phone touch screens work. It’s the humans who figured out all
    of that. Somewhere along the line, a human must have explained to a computer just
    exactly what to do with the input in order to turn it into output. A human had
    to tell the computer how to decide if a password is valid or not. A human had
    to explain how to calculate amortization. A human had to define the “pinch” motion
    and decide how it should zoom out on a photo. Same for the “shake” motion that
    shuffles songs in an MP3 player.


    So it’s the human computer team that makes all of this work. Using their intelligence,
    the humans have the ideas and figure out “recipes” for converting input into output.
    Using their speed and accuracy, the computers faithfully and reliably perform
    the conversions.


    The humans on such teams are called “programmers”. The purpose of this book is
    to turn you into a programmer.


    # About This Book


    This book is organized into three “parts”, separated by major milestones in gaining
    programming knowledge.


    Part 1 shows how to apply basic concepts of programming. It goes through the details
    of writing programs using freely available “editor” and “compiler” software. It
    shows how to store data in “variables” for use in calculations, and how to produce
    nice-looking output. These chapters teach all that is needed to create simple
    interactive programs that gather “input”, perform calculations based on the input,
    and display “output” using calculated results.


    Part 2 adds elements of logic to the simple programs of part 1. Ways are presented
    for making programs selectively use different sets of instructions, based on circumstances.
    Ways to get a program to repeat itself are also presented, allowing things to
    be done more than once without duplicating the steps. These chapters teach what
    is needed to create more sophisticated programs with “branching” and “looping”
    logic, such as would be required for computer games and almost every other useful
    program.


    Part 3 introduces the powerful concept of single variables that can store multiple
    values all at the same time. “Array” variables can store multiple values of the
    same type, and are suitable for dealing with lists, such as lists of test scores,
    high temperatures, or names of students. “Object” variables can store multiple
    values of related information, and are suitable for dealing with data records,
    such as student accounts with names, IDs, and addresses. Chapters 13-15 introduce
    advanced applications of arrays and objects, for the purpose of first exposure
    to some advanced computer science concepts, but primarily to provide an opportunity
    to apply the language elements learned in parts 1 and 2.


    The Appendix contains excerpts from the C++ “library” with references to all of
    the library elements used in this book. There is also an Index at the end.


    # PROGRAMMING CONCEPTS IN C++

    ## The Second Edition


    Besides correcting typos from the first edition, this second edition replaces
    the Microsoft Visual Studio compiler with an open source C++ compiler. It''s a
    much easier and lighter install, and it allows the command-line compiler commands
    to be consistent between PCs and Macs. It also makes the command-line experience
    nearly the same among systems (PC and Mac) and languages (C++, Java, and Python
    – the languages in this book series) so that the focus can be on concepts instead
    of logistics.


    This new edition is also more Mac friendly; it includes screenshots from both
    PC and Mac. The e-book now provides copy/pasteable code, so students don''t have
    to type every keystroke. Another change is that references to command-line `cl`
    and `g++` are now this feature, but the 1st edition did not.


    ## Unique Features Of This Book


    Unlike many of today''s introductory textbooks, this book does not jump into object-oriented
    programming right away. Instead, the focus is on fundamental concepts of data,
    statements, expressions, and flow of control. These need to be well-understood.


    This book makes a distinction between **expressions and statements**. Expressions
    are the building blocks of statements, and as such, they individually and separately
    resolve to simple values. They are likened to “phases” in the spoken language.
    Language elements that are expressions are specifically pointed out and are specially
    denoted — for example, $x + y$. Full statements, usually ending in a semicolon,
    are likened to “sentences” in the spoken language. They are noted like this: $x
    = 1$;


    This book is available in both **e-book and printed formats**, and supported by
    online publication of coding examples, sample assignments, and instructional how-to
    videos. URLs and links appear at the ends of chapters 1-14, where one might normally
    expect to find review questions and exercises. Go to www.rdb3.com/cpp/ebook for
    tips on navigating the e-book.


    There are code listings throughout this book. Some have larger fonts than others,
    depending on what it takes to fit them on a page. Be sure to use the URLs at the
    ends of each chapter, because they provide access to the full copy/pasteable/zoomable
    version of.


    It may be surprising to see **linked lists, collections, and recursion** addressed
    in the later chapters. But the purpose is *not* to make the student proficient
    in the use or understanding of these concepts. Rather it is to provide a vehicle
    for practicing what was learned about variables, branching, loops, arrays, and
    objects. And in doing so, the student is also introduced to ideas that will reappear
    in future studies in computer science, and be better prepared to learn them at
    that time.


    Command-line compiling makes the student more aware of the files and folders used
    on the host system, and differences among operating systems become not so great.
    Any IDE can be used in following this book, if that is the instructor’s or student’s
    choice. But because an IDE usually combines the editing and compiling into a single
    program, it’s likely that the unique separation of these programming steps will
    be lost. Such as PCs, Macs, and UNIX/Linux.

