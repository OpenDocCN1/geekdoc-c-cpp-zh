    # 7.1 Multiple Choice If-Statements


    Adding `else` after an if-statement, as explained in the previous chapter, simplifies
    writing code for "true-false" comparisons. The same could be accomplished with
    two separate if-statements, but it''s much easier using one if-statement with
    an `else`.


    ```

    ### True-False Logic WITHOUT Else

    if (grade = ''A'' || grade = ''B'' || grade = ''C'')

    out << "You pass" << endl;

    if (grade != ''A'' && grade != ''B'' && grade != ''C'')

    cout << "You do not pass" << endl;

    ```


    ```

    ### True-False Logic With Else - Much Easier!

    if (grade = ''A'' || grade = ''B'' || grade = ''C'')

    out << "You pass" << endl;

    else

    cout << "You do not pass" << endl;

    ```


    Similarly, it''s even more complicated to program "multiple choice" comparisons
    using lots of separate if-statements, so the C++ language does offer another,
