    # 10.2 Text File Output


    Sending output to a text file is a like sending it to the console screen. The
    included library is the same as for text file input. The error handling code is
    the same as for text file input. Also, the name of the output file must be specified,
    as it must for text file input.


    # 10.2.1 The `fout` Object


    As with `fin`, this does not have to be named `fout` – it just has to be any valid
    identifier. Here''s what to insert somewhere in main, before any other reference
    to `fout`:


    ```

    ofstream fout;

    ```


    This creates an object named `fout` to be used for writing one or more text files.


    # 10.2.2 Creating A Text File


    When specifying a filename to receive output, the file may either exist or not.
    If you specify a file that already exists, the file will be discarded and overwritten
    *without* warning. If the file does not already exist, this process creates it.
    In most operating systems it will appear in the file listing as soon as it is
    opened for output,'
