    \ Any fields left out in curly-brace initialization are set to zero – just as\
    \ missing elements are in the curly-brace initialization of arrays.\n\n# 12.5\
    \ Object-Oriented Programming\n\nThere's actually a lot more to objects than has\
    \ been covered in this book. In fact, “object-oriented programming” is a subject\
    \ worthy of a full semester course in itself.\n\nWe've created our own objects\
