    ## 2.3 选择存储文件的文件夹


    为了在 PC 或 Mac 上存储你的 C++ “源文件”并进行编程工作，你应该专门为该目的留出一个文件夹。这被称为你的“工作文件夹”（working folder）。在编写第一个程序之前，先决定此项并准备好。


    你可以将工作文件夹放在硬盘或可移动存储介质（如 U 盘）上。如果你还不熟悉“命令行”模式或文件结构导航，最简单的方法是直接使用 U 盘。此外，文件在 U 盘上可以就可以在家里、教室和实验室之间方便地携带——甚至可以在
    PC 和 Mac 之间切换。本节的其余部分是为使用 U 盘的学生设计的，其他经验丰富的人可以轻松调整这些说明。


    在 PC 上，使用 Windows 资源管理器在 U 盘上创建工作文件夹。在 Mac 上，你的 U 盘图标应该已经出现在桌面上并有一个默认名称，如“NO NAME”。你可以像重命名
    Mac 桌面上的任何文件或文件夹一样对其重命名。最好命名时不带空格——类似于 `programming`，随后它的图标就会出现在桌面上：


    ![](img/80b9ed561fa57ed72adb64b305ef946d_36_0.png)


    现在在你的 U 盘上创建一个工作文件夹，例如命名为 `cpp`。虽然可以将此文件夹放在 U 盘上的其他文件夹内，但本节其余部分的编写假设工作文件夹并不位于任何其他文件夹内部。


    接下来，弄如何在命令行提示符窗口中找到你的工作文件夹。在 PC 上，如之前说明的打开命令提示符。通过输入驱动器字母加冒号然后按回车键来进入你的驱动器。例如，如果你的驱动器编号是“R”，则输入命令
    `r:`。然后使用类似 `cd\cpp` 的命令进入 U 盘上的工作文件夹。


    在 Mac 上，启动终端应用并输入命令例如 `cd /volumes/programming/cpp`。注意是 `cd` 而不是 `cd\`，且使用的是斜杠
    `/` 而不是反斜杠 `\`。不要忘记 `cd` 后的空格。


    或者在 Mac 或 PC 上，输入 `cd`，将你的工作文件夹拖到它上面，然后按回车。那是 `cd` 加空格，而不仅仅是 `cd`。然后你可以通过拖放来完成命令，并按回车。


    ## 2.3.1 如何备份你的文件


    规则很简单：“只备份你不想丢失的文件。”完成源文件编写后，将它们保存到硬盘或 U 盘上，想象一下如果你的驱动器故障会发生什么。你可以使用 Dropbox 或
    Google Drive 等云服务，或者通过电子邮件发送文件。方法有很多种，重要的是要在其他地方存储一份你的工作副本。


    ## 2.4 为编程配置文件夹


    人们倾向于“线性”地打字代码——即从第一行到最后一行，从左到右。但这不是输入代码的最佳方式。括号和花括号贯穿整个代码。最困难的部分是跟踪这些符号，并确保每个左括号都有匹配的右括号。


