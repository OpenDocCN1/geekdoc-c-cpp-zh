    # PROGRAMMING CONCEPTS In C++


    A collection is an object that can contain other objects! The required include
    is `#include <deque>`.


    The use of the data type Student enclosed in “angle brackets” in the declaration
    statement specifies that the list is for values of whole number and floating point
    data types as well as objects, because object struct specifications do not need
    a next-link!


    To add a value to the front or end of a list, use the following:


    ```

    Adding A Value To A Collection

    Student aStudent; // a temporary object

    // set field values for aStudent

    aStudent.name = ...;

    student.push_front(aStudent); // copy to the front

    ... or ...

    student.push_back(aStudent); // copy to the end

    ```


    To retrieve a value from any position in the collection, use the following expression:


    ```

    student[i]

    ```


    i is an index, as in an array, and can be any number in the range Q to student.size()
    - 1, inclusive. To get the value at the front, it''s student[0], and at the end,
    it''s student[student.size() - 1]. It''s just like an array, except that collections
    “know” their own size - student.size()!


    Also, as array elements, the expression student[i] can be used on either side
    of an assignment operator (that is, an equal sign), to retrieve or set the value
    in the collection.


    Here is our example from the previous chapter, using collections:'
