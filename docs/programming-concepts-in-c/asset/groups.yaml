- md: "\nNote that the function parameter list includes a specification for the collection.\
    \ The ampersand symbol & in the deque variable specification is not a typo – it\
    \ tells the program to share the original deque variable with the function instead\
    \ of sharing a copy. This is just like what was done in todTest.cpp at the end\
    \ of chapter 12 for objects as parameters.\n\n## 15.2 Functions That Call Themselves:\
    \ Recursion\n\nRecursion is simply this – it's when the code block of a function\
    \ contains a statement with a call to itself! This actually is a form of a loop,\
    \ which would seem to be infinite. What makes it work is that the function must\
    \ contain logic to decide whether to continue calling itself or not – similar\
    \ to if-break in a while-true loop.\n\nRecursion offers a new way to solve problems.\
    \ If you are not using recursion, you are using “iteration” – it's what we have\
    \ been using all long, but since it was the only thing we used, it really did\
    \ not need a name. Iteration uses loops; recursion uses functions.\n\nRecursion\
    \ is usually an upper-level computer science topic. It is very useful in solving\
    \ some types of problems, and actually simplifies many solutions. So why is it\
    \ at the end of this book, and why is it upper-level? That's because it is difficult\
    \ for most people to understand right away – even people with strong aptitudes\
    \ for computers. This is something that you will have to hear now and believe\
    \ later!\n\nTo apply recursion, you just need to know these things about the problem\
    \ you are solving: (1) how to solve a base case, and (2) how to reduce problem\
    \ complexity towards a base case. Then you need to be able to divide problems\
    \ into two parts: (1) the part you know how to solve, and (2) the part you don't\
    \ know how to solve.\n\n### 15.2.1 Simple Example: Countdown\n\nThis ridiculously\
    \ easy example demonstrates the sequence for developing a recursive solution.\
    \ The problem is NASA has hired you to write a countdown program, starting from\
    \ any nonnegative whole number and ending at zero. (NASA uses this kind of thing\
    \ a lot, and they want to automate it!) You first consider using an iterative\
    \ solution, but you soon conclude that it is just too difficult (work with me\
    \ here...). So you next consider using a recursive solution instead.\n\nThe problem,\
    \ then, and is: count down from the `int` variable n. First, write the part you\
    \ know how to do: say the number stored in `n`. Then write the part you don't\
    \ know how to do: count down from `n` minus one. For example, if `n` is “10”,\
    \ the recursive solution is to say “10”, and then count down from “9”. If you\
    \ wrote a function to do this, and the number to count down from is in the parameter\
    \ list, the body of the function from the parameter list, and then call a function\
    \ that knows how to count down from value minus one. And here's the tricky part\
    \ – the function we would call to do that is the function we are currently writing!\
    \ Seems a bit like the chicken-and-the-egg dilemma, doesn't it.\n\nThe only problem\
    \ that remains is to identify a “base case”, and use that in a logic statement\
    \ to stop the recursion. The base case is this: if we were asked to count down\
    \ from zero, it would be easy – just say “0”! In that case, if the value of the\
    \ variable in the parameter list is zero, no additional call needs to be made.\n\
    \nHere is the full solution (which you are free to copy, modify, and share with\
    \ NASA – you’re welcome):\n\n## PROGRAMMING CONCEPTS IN C++\n\n![](img/80b9ed561fa57ed72adb64b305ef946d_232_0.png)\n\
    \n### 15.2.2 Classic Example: Factorial\n\nThe classic introductory example for\
    \ recursion is factorial. In math class you may have seen a symbol like this:\
    \ **5!**, pronounced “five factorial”. It is the equivalent of 5 x 4 x 3 x 2 x\
    \ 1, or 120. Factorials show up in probability calculations for such things like\
    \ lotteries.\n\nThe problem is this: we want a function to calculate the factorial\
    \ of a non-negative number, **n**. First we consider coming up with an iterative\
    \ solution, and we quickly decide that it is too complicated (again, work with\
    \ me here). So we consider using recursion. First, there is a base case: **0!**\
    \ is defined as 1 – actually, **1!** is also 1 – both base cases. Working towards\
    \ the base case, **n!** is **n** (the part we know how to solve) times **(n-1)!**\
    \ (the part we do not know how to solve). Luckily we have a function to solve\
    \ the latter – the function we are writing! So the recursive solution is **n!\
    \ = n x (n-1)!**:\n\n## The Classic Recursive Factorial [factorial.cpp]\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\n\nint factorial(int n)\n{\n    int\
    \ f;\n    if (n < 2) // detecting a base case\n        f = 1;\n    else\n    \
    \    f = n * factorial(n - 1);\n    return f;\n} // factorial\n\nint main()\n\
    {\n    int n;\n    cout << \"Enter n: \";\n    cin >> n;\n    cin.ignore(1000,\
    \ 10);\n\ncout << factorial(n) << endl;\n} // main\n```\n\n### 15.2.3 A Caution\n\
    \nDo not get too attached to recursion. There is always an iterative solution\
    \ to everything – it’s just that recursion is sometimes simpler to code, once\
    \ you get familiar with it. But recursion is usually less efficient than iteration,\
    \ so use iteration if you can. And sometimes that cost is too much, even for the\
    \ easiest of recursive solutions – counting down from 100000 and see! If that\
    \ works, then try...\n\n## 15.3 Where Do Go From Here?\n\nThis introduction to\
    \ programming using C++ to make real. These concepts, such as variables, code\
    \ blocks, branching and looping logic, subprograms, arrays, and lists, are common\
    \ to all programming languages. What you learned here serves as the introduction\
    \ to the study of any specific language – not just C++. This is where you hopefully\
    \ have a better understanding of how computers work and you will eventually learn\
    \ to develop a solo programmer or member of a team. You may write simulations,\
    \ business databases, or interactive games. Whatever you do, you'll always be\
    \ glad you found your way into it!\n\n## Appendix: The C++ Library\n\nHere is\
