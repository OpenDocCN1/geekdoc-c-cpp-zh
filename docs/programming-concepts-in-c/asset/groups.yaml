    \ study.\n\n# 12.6 Exercises, Sample Code, Videos, And Addendums\n\nGo to www.rdb3.com/cpp/12\
    \ for extended materials pertaining to this chapter.\n\n# Chapter 13. Keeping\
    \ A List: Array-Based Lists\n\nWhat you need to know about array-based lists is\
    \ that they are arrays in which not all of the elements are used, but are available\
    \ for use in case they are needed. A new, separate int is used to track how many\
    \ of the elements are actually in use at any time. Unlike previous chapters, the\
    \ purpose of this chapter is not to train you in the use of this programming feature.\
    \ It is instead an opportunity to introduce concepts that you will run into if\
    \ you go further in your study of computer science, and to provide a way to practice\
    \ the programming features we studied in preceding chapters.\n\nA “list” is a\
    \ collection of values – usually objects, but they can be whole numbers or floating\
    \ points or text. The C++ language allows the data types for these to be different\
    \ from one another, even in the same collection! This concept is that of a “bag”,\
