    # ROBERT Burns


    # ## 1.3 compiler


    A “compiler” is used by programmers to convert human-programmer-readable code
    into computer programs. Code is saved to disk files, just as any other typed document.
    The name of the file (ending in .cpp) identifies the file as containing computer
    code. Programs are also created as disk files. So a compiler is a computer program
    that takes as its input a text file, and produces as its output another file called
    a “program file” or “executable”, typically ending in .exe on PCs and .app on
    Macs.


    And, yes – a programmer wrote the compiler program, which raises the chicken-and-the-egg
    question, but we won’t get into that here.


    Each compiler is designed specifically to work with a certain computer language.
    Hence there are C++ compilers and Java compilers, as well as compilers for every
    other language. So in order for you to compile, you will need to find and install
    a compiler program. Instructions for doing this are included elsewhere in this
    book.


    # ## 1.4 Elements Of Computer Languages


    Before you can type anything useful into an editor and save it to a file to be
    compiled, you need to know some basics about computer languages. There are programming
    concepts that are common to all computer languages, and it would be nice to write
    an introductory book like this at the conceptual level instead of focusing on
    a specific language. But it is impractical to do so. We cannot get very far without
    typing some code, and that means choosing a language in which to work. C++ is
    the language used in this book.


    # ### 1.4.1 Statements And Expressions


    A good way to explain the basic elements of computer languages is to compare them
    to the written English language. Text written in the English language consists
    of *sentences*; computer code consists'
  - '[PAGE 22]


    # PROGRAMMING CONCEPTS IN C++


    statements. While English sentences contain phrases, computer statements contain
    expressions.


    | In English | In C++ |

    |--- |--- |

    | sentence: He is 21 years old. | statement: int age = 21; |

    | phrase: over 30 | expression: age > 30 |


    In English, sentences are “read”. In computer code, statements are “executed”.
    Multiple English sentences follow one another vertically down a page. They are
    read in that order, and the development of thoughts and ideas depends on that
    order being followed. Similarly in computer code, multiple statements follow one
    another vertically down, and the processing of instructions depends on that order
    being followed. Long English sentences wrap to the next line, and if there is
    still space at the end of a sentence, the next sentence starts there. But wrapping
    is not generally used in code statements. And there is no concept of a “page”.
    So statements in code are more like bullet points in English.


    | In English | In C++ |

    |--- |--- |

    | Measure the length. | cin >> length; |

    | Measure the width. | cin >> width; |

    | Multiply length and width, save as area. | int area = length * width; |

    | Tell the area. | cout << "The area is " << area << "; |


    # 1.4.2 Sequential Processing


    What’s most important to understand at this point is the order in which statements
    are carried out. Think about giving someone driving directions – if they get the
    left- and right-turns out of order, they will probably end up lost! In the above
    example, the statement that calculates area *must come after* the statements that
    collect values for length and width. Statements generally are not “learning experiences”
    for the computer. `area = length * width` is not telling the computer how to calculate
    the area of something. Instead it is an instruction'
  - '[PAGE 23]


    that says to take the values currently stored as **length** and as **width**,
    multiply them, and save the result as **area**.


    Below are examples of sequential processing presented as “recipes”, in which numbered
    steps are processed from the top, down. Of course, we don’t use the word “recipe”
    in computer programs – we call them “algorithms” instead:


    | Macaroni And Cheese | Area Of A Room |

    |---|---|

    | 1 Preheat oven broiler. | 1 Write labels "length" and "width" on paper. |

    | 2 Bring a large pot of water to boil. | 2 Measure length of room, in decimal
    feet. |

    | 3 Add pasta to pot and cook 9 minutes. | 3 Write length on paper next to its
    label. |

    | 4 Drain the pot. | 4 Measure width of room, in decimal feet. |

    | 5 Add pasta to a 2 qt dish. | 5 Write width on paper next to its label. |

    | 6 Shred cheese and add to dish. | 6 Using a calculator, enter the length. |

    | 7 Add milk to dish. | 7 On the calculator, press x. |

    | 8 Stir pasta, cheese, and milk dish. | 8 On the calculator, enter the width.
    |

    | 9 Microwave dish for 2 minutes. | 9 On the calculator, press m. |

    | 10 Drain dish for 3 minutes. | 10 Write result on paper, with label "area".
    |


    This concept of sequential processing of statements is a key concept in programming.


    # 1.4.3 Entry Point


    The first statement to execute when a program starts is the “entry point” for
    the program. This seems like an obvious concept and not worthy of mention – isn’t
    the first statement the one that appears on the first line of the code’s file?
    Actually, it’s not that easy. Come to think of it, it’s not so easy in English
    either. In books, doesn’t the first line of first chapter usually come after the
    title page, the copyright page, and the preface and prologue? It’s the same with
    coding. There are titles and prologues that come before the first statement. So
    when we get to actual code examples later, we will have to be aware that there
    will be prologue material, and will have to be a way to identify the “entry point”.


    The next example adds some preparatory information at the top of the previous
    sequential processing example, to illustrate the concept of “entry point”:'
  - '[PAGE 24]


    # Macaroni And Cheese


    # INGREDIENTS


    1 cup elbow macaroni pasta

    1/4 cup milk

    1-1/2 cups cheddar cheese


    # DIRECTIONS


    +   entry point 1 Preheat oven broiler.

    2 Bring a large pot of water to boil.

    3 Add pasta to pot and cook 9 minutes.

    4 Drain the pot.

    5 Add pasta to a 2 qt dish.

    6 Shred cheese and add to dish.

    7 Add milk to dish.

    8 Stir pasta, cheese, and milk in dish.

    9 Microwave dish for 2 minutes.

    10 Broil dish for 3 minutes.


    # 1.4.4 Branching And Looping


    But starting at an entry point and executing every statement in sequential order
    does not provide enough flexibility for most purposes. What if the “width” is
    not entered correctly in the above example? What if the person using the program
    types “ten” instead of “10”? What if they enter a negative number, or a number
    that is higher than is reasonable? There should be a way to skip the calculation
    and provide the user with some... constructive feedback. Or what if the user has
    more than one area calculation to make? Should they have to restart the program
    again and again? Wouldn’t it be better if the program started itself over automatically?


    To accommodate these needs, computer programming includes the concepts of branching
    and looping. Branching enables one set of statements to be executed under some
    conditions, and another set of statements under other conditions. This programming
    feature is illustrated with instructions to skip down (or branch) to a later statement.
    Looping enables a program to repeat itself. This programming feature is illustrated
    with instructions to skip up (or loop back) to a previous statement.'
  - '[PAGE 25]


    Here are some algorithm samples in which numbered steps are processed from the
    top, down:


    Study the examples provided above, and see if you can identify where branching
    is used, and where looping is used. After we gain skill to use sequential processing
    effectively in our programs, we will introduce the concepts of branching and looping.
    Look for this in the first chapter of Part 2.


    # 1.4.5 Subprograms


    For very complex programs it is convenient for the programmer to break down a
    large problem into several smaller problems – kind of a divide-and-conquer approach.
    Computer languages support the concept of subprograms. We do the same in the English
    language, when we provide details in web page links or in book appendices or Post-it
    notes.


    For example, we will learn to write programs that will “validate” the input (that
    is, make sure it is valid) before continuing with their processing. For invalid
    input, these programs will alert the user and offer another chance to enter valid
    input. As you can imagine, this involves a lot of detail – certainly some branching
    and looping will be included somewhere.'
