    In file input, the statement that “reads” an input value also skips to the next
    input value in the file – that is, it reads sequentially. There is no need to
    write any code to advance to the next input value, because this happens automatically.
    There is also no going back or skipping forward – not easily, anyway. The most
    straightforward way to go back to a previous input is to close and reopen the
    text file.


    # 10.1.6 Multiple Inputs on the Same Line


    The purpose of the statement `fin.ignore(1000, 10);` is to skip to the next line
    in the input file. But if you leave this statement out, you can put multiple inputs
    on the same line, separated by one or more spaces. For example:


    ![](img/80b9ed561fa57ed72adb64b305ef946d_164_0.png)


    By removing the first two `ignore` statements, you can do one of two things to
    separate the first three inputs: either put them on the same line separated by
    spaces, or leave them on separate lines. But note that there is *never* an `ignore`
    statement following `getline, getline` automatically reads to the end of a line
    – it has its own `ignore` built in. In the example above, the “M” could *not*
    be moved to the line above, because `getline` reads to the end of that line –
    it would be part of the name read by `getline.


    In case you are wondering if all of this applies to console input using `cin`,
    you are right – it does! By leaving out `ignore`, you can type multiple inputs
    on the *same line* before pressing ENTER. Or you can still press ENTER between
    each input – it becomes the user’s choice.'
