    # 引言


    计算机太棒了！你给它们“输入”，它们就产生“输出”。无论是输入网址地址并查看带有最新新闻的网页，还是输入税务信息然后打印带有所有支持文档的 1040 表格，或是使用智能手机上的
    App 支付咖啡，计算机为我们提供了多种方式来指定输入，并有多种不同的方式来表达输出。


    计算机快速且准确。相比之下，人类很慢，而且让我们面对事实吧，我们会犯错。你是否曾两次添加同一个数字列表却得到了两个不同的总和？但人类拥有计算机不具备的东西——智能。


    计算机没有设计互联网，也没有制定税收法典。计算机没有设计手机触摸屏的工作原理。这些都是人类想出来的。在某个环节，必须有一个人类向计算机精确地解释了如何处理输入将其转换为输出。人类必须告诉计算机如何判断密码是否有效。人类必须解释如何计算摊销。人类必须定义“捏合”动作，并决定它应该如何缩小照片。同样，MP3
    播放器中打乱歌曲的“摇晃”动作也是如此。


    所以是人类计算机团队让这一切运作了起来。利用他们的智能，人类有了想法，并想出了将输入转换为输出的“配方”。利用他们的速度和准确性，计算机忠实可靠地执行这些转换。


    此类团队中的人类被称为“程序员”。本书的目的是将你变成一名程序员。


    # 关于本书


    本书分为三个“部分”，由获取编程知识的重大里程碑隔开。


    第一部分展示了如何应用编程的基本概念。它详细介绍了如何使用免费获取的“编辑器”和“编译器”软件编写程序。它展示了如何将数据存储在“变量”中供计算使用，以及如何生成美观的输出。这些章节教授了创建简单交互式程序的所有知识，这些程序可以收集“输入”、根据输入进行计算，并使用计算结果显示“输出”。


    第二部分在第一部分的简单程序中加入了逻辑元素。书中介绍了如何根据情况选择性地使用不同指令集的方法。还介绍了让程序重复执行的方法，允许在不重复步骤的情况下多次执行任务。这些章节教授了创建具有“分支”和“循环”逻辑的更复杂程序所需的知识，例如计算机游戏和几乎所有其他实用程序所需要的逻辑。


    第三部分引入了强大的“单变量”概念，它可以同时存储多个值。“数组”变量可以存储多个相同类型的值，适用于处理列表，例如测试成绩列表、气温列表或学生姓名列表。“对象”变量可以存储多个相关信息的值，适用于处理数据记录，例如包含姓名、ID
    和地址的学生账户。第 13-15 章引入了数组和对象的高级应用，目的是为了让读者首次接触一些高级的计算机科学概念，但首要目的是提供一个机会来应用第一部分和第二部分中学的语言元素。


    附录包含了来自 C++ “库”的摘录，并引用了书中使用的所有库元素。末尾还有索引。


    # C++ 编程概念

    ## 第二版


    除了修正第一版中的拼写错误外，第二版将 Microsoft Visual Studio 编译器替换为开源 C++ 编译器。它的安装更加简单、轻量化，并且允许
    PC 和 Mac 之间的命令行编译器命令保持一致。它还让不同系统（PC 和 Mac）和不同语言（C++、Java 和 Python——本系列书籍中的语言）之间的命令行体验几乎相同，因此重点可以放在概念上而非琐碎细节上。


    新版也对 Mac 更友好；它包含了来自 PC 和 Mac 的截图。电子书现在提供了可复制/粘贴的代码，因此学生不需要输入每一个击键。另一个变化是，对命令行
    `cl` 和 `g++` 的引用现在是这一新功能，但第一版没有。


    ## 本书的特点


    与当今许多入门类教科书不同，本书并没有立即进入面向对象的编程。相反，重点是数据、语句、表达式和控制流的基础概念。这些需要被良好理解。


    本书区分了**表达式和语句**。表达式是语句的构建块，作为它们，它们可以独立且单独地解析为简单的值。它们被比作口语中的“阶段”。语言元素中的表达式被特别指出并进行特殊标记——例如，$x
    + y$。完整的语句通常以分号结尾，被比作口语中的“句子”。它们的格式如下：$x = 1;$


    本书以**电子书和纸质版两种形式提供**，并由在线发布的代码示例、作业和教学视频支持。URL 和链接出现在第 1-14 章的末尾，通常在那里可以找到复习题和练习。访问
    www.r3.com/cpp/ebook 获取导航电子书的技巧。


    书中到处都是代码列表。某些的字体比其他的大，取决于适应页面的情况。务必使用每章末尾的 URL，因为它们提供了完整的可复制/粘贴/缩放版本。


    在后面的章节中看到**链表、集合和递归**可能会令人惊讶。但其目的*并不是*让学生精通这些概念的使用或理解。相反，它是为了提供一个工具来练习关于变量、分支、循环、数组和对象的知识。通过这样做，学生还接触了未来计算机科学学习中再次出现的思想，并为那时学习它们做好了准备。


    命令行编译让学生对主机系统上使用的文件和文件夹更加熟悉，不同操作系统之间的差异变得不再那么大。根据老师或学生的选择，可以使用任何 IDE 来遵循本书。但由于
    IDE 通常将编辑和编译合并到一个程序中，可能会导致这些编程步骤的独特分离性消失。例如 PC、Mac 和 UNIX/Linux。


    '
