    # # Chapter 10. Interactive Programs: File I/O


    Input can be gathered from a variety of sources. In chapters 3 and 4 we specified
    input values directly in the program listings. Then in chapter 5 we learned how
    to get values from a user via the cin object. In this chapter we learn how to
    get user-typed input from a text file, so a user can stage their input values
    in advance of running the program, and save and edit them in a file. The same
    techniques can be applied to save the scores in computer games – how many wins
    and how many losses!


    # ## 10.1 Text File Input


    Text files are like typing responses to console prompts, but doing so in advance
    and storing them in a file. It’s remarkably easy to convert console input to text
    file input. Actually, you can “mix-and-match” file and console input in the same
    program, so that there can be of each. For example, you could use console input
    for a user to type the name of a text file, and then get the rest of the input
    from that text file.


    But there are two important differences between console input and text file input.
    Prompts are not necessary for text file input – remember, the responses are typed
    in advance and stored in a text file. So the user has to know the program pretty
    well in order to know what to reply before the questions are asked! Another difference
    is that the name of a file has to be specified, and your program has to “open”
    the file.


    You do not have to deal with “error handling” when using console I/O, but you
    do with file I/O things that can go wrong with files that can’t go wrong with
    keyboards. For example, a specified file may not exist, or it may not be complete.
    So we will learn the basics of file error handling – enough to get by.


    The coding requirements for text file input are these: (1) type the proper C++
    include statement, (2) replace cin with its text file equivalent, (3) “open” a
    file, and (4) add error handling.'
