- md: "\n## 4.3.1 Conversion Statements\n\nThe C++ function calls in the above table\
    \ are all *expressions*. They are not stand-alone statements – it’s important\
    \ to understand the difference! They resolve to *new values* – they do not modify\
    \ the original value stored in the variable. In order to change a stored value,\
    \ you need to use an expression in an assignment statement, as in these examples:\n\
    \n| Statement | Explanation |\n|---|---|\n| x = toupper(x); | replaces the char\
    \ stored in x with its uppercase version; no effect if x's value is not in the\
    \ range a-z |\n| x = toulower(x); | replaces the char stored in x with its lowercase\
    \ version; no effect if x's value is not in the range A-Z |\n| x = abs(x); | replaces\
    \ the int stored in x with its absolute value; no effect if x's value already\
    \ non-negative |\n| x = fabs(x); | replaces the double stored in x with its absolute\
    \ value; no effect if x's value already non-negative |\n\nNote that **toupper(x)**\
    \ and **tolower(x)** work only for **char** values and variables. They do *not*\
    \ work for **string** values or variables. A procedure for converting the case\
    \ of a **string** will be presented in a later chapter of this book. Actually,\
    \ some compilers have case conversion functions for **strings**, but they are\
    \ specific to that compiler and are not standard to the C++ language – do not\
    \ expect them to work in other compilers or on other systems!\n\n## 4.3.2 Using\
    \ Multiple #include Statements\n\nMost programs attach more than one library,\
    \ such as **iostream** and **iomanip**. Their order of appearance generally does\
    \ not matter. But a convention is used in this book that makes it easier to deal\
    \ with long lists of such statements.\n\nHere is the convention used in this book\
    \ for placing **#include** statements.\n\n- * Separate the libraries beginning\
    \ with the letter “c” from the others – these are the libraries that C++ inherited\
    \ from the C language, and they do not require `using namespace std;`\n- * Put\
    \ all of the C++ libraries, like `iostream`, above the `using namespace std;`\
    \ statement, (so they are easier to find by someone reading your code).\n- * Put\
    \ all of the C libraries, like `cmath`, below `using namespace std;`, also in\
    \ alphabetical order.\n- * If there are no C++ libraries at all, then exclude\
    \ the `using namespace std;` statement – some compilers do not allow the use of\
    \ that statement when no C++ libraries are included.\n\nFollowing this convention\
    \ makes the libraries easier to track in your C++ files.\n\n## 4.4 Exercises,\
    \ Sample Code, Videos, And Addendums\n\nGo to www.rdb3.com/cpp/4 for extended\
    \ materials pertaining to this chapter.\n\n## Chapter 5. Interactive Programs:\
    \ Console I/O\n\nInput can be gathered from a variety of sources. In chapters\
    \ 3 and 4 we specified input values directly in the program source code. That\
    \ worked fine, but if we wanted to use different input, such as changing the number\
    \ of years in the amortization calculation, the program had to be edited and recompiled.\
    \ That is certainly not the kind of program that you could distribute for non-programmers\
    \ to use!\n\nIt would be nice if the program *prompt* (or ask) the user to type\
    \ input values on the keyboard, and transfer those values into the variables in\
    \ the program. Then we could develop and compile the program only once, and it\
    \ could be applied to a virtually unlimited range of input values.\n\nThis is\
    \ what *interactive* programs do. They are designed for a certain amount of interaction\
    \ to take place between the user and the program. This interaction transfers data\
    \ values into variables, *after* the program has been written and compiled!\n\n\
    ## 5.1 Capturing Values From The Keyboard\n\nCapturing input from the keyboard\
    \ involves three steps, which have to be represented in code:\n\n| 3 Steps For\
    \ Keyboard Input |\n|---|---|\n| 1. Declare a variable in the computer's memory\
    \ to store the input value. |\n| 2. Prompt the user to type an input value and\
    \ press the ENTER key. |\n| 3. Transfer the keyboard entry into the variable declared\
    \ for this use. |\n\nHere is a simple example:\n\n![](img/80b9ed561fa57ed72adb64b305ef946d_73_0.png)\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nint main() {\n    // code\
    \ block to read an int value from the keyboard\n    int age; // step 1\n    cout\
    \ << \"What is your age?\"; // step 2\n    cin >> age; // step 3\n    cin.ignore(1000,\
    \ 10);\n\n    // code block to echo the age of the user\n    cout << \"Your age\
    \ is \" << age << endl;\n}\n```\n\nIt looks pretty complicated, and it’s not as\
    \ bad as it seems. Let’s break it down. First, the program has to be told that\
    \ we we will be using the computer's `console` (that is, the keyboard and the\
    \ display monitor). That's what `#include <iostream>` does in C++. There is one\
    \ `using namespace std;` statement, which should come after the last `include`\
    \ of a C++ library. It turns out that `cin` is an \"object\", the second of which\
    \ we have encountered so far. It is pronounced, \"see in\" and stands for \"console\
    \ input\".\n\nThis next sample program includes code blocks for each of the data\
    \ types we have studied so far. Unlike the previous example, there are no output\
    \ statements to echo the entered values to the console screen:\n\n## PROGRAMMING\
    \ CONCEPTS IN C++\n\n### Transferring Values From The Keyboard [itsAboutYou.cpp]\n\
    \nNote the `include` for using the `string` data type. When there are multiple\
    \ `includes` in this book, their order does not matter, but by convention they\
    \ are arranged alphabetically.\n\nThen there are four separate examples of keyboard\
    \ input in the above code blocks – one for a whole number, one for a floating\
    \ point number, and two for text. They are entirely independent of each other,\
    \ and can be used in any combination to match the needs of your program. Each\
    \ follows the three steps: (1) variable declaration, (2) user prompt, and (3)\
    \ transfer of data from the keyboard to the variable. The variable declaration\
    \ does not have to be immediately before the prompt – it just has to be somewhere\
    \ the transfer statement. The prompt (with `cout <<` alerts the user that the\
    \ computer is waiting for something to be typed on the keyboard and the ENTER\
    \ key pressed. Note that the prompts are enclosed in quotes (it's hard to...\n\
    \n## 5.2 Prompts\n\nThe statements with `cin` cause the program to pause and wait\
    \ for the user to press ENTER. Program execution actually suspends there, waiting\
    \ for the ENTER key. But on the computer screen, the only evidence of the cin\
    \ statement is a symbol – usually a horizontal line or a box. This is not much\
    \ of a clue for the user to know something to do something. The cin is usually\
    \ preceded by a cout with instructions for the user. This is called a prompt.\n\
    \nThe following shows how a program would work without, and with, a prompt.\n\n\
    | With No Prompt: | With A Same-Line Prompt: | With A Previous-Line Prompt: |\n\
    |---|---|---|\n| string name; getline(cin, name); | string name; cout << \"Enter\
    \ name: \"; getline(cin, name); | string name; cout << \"Enter name:\" << endl;\
    \ getline(cin, name); |\n\nThere are two places to place the prompt: either on\
    \ the same line where the user input is to be typed, or on the previous line.\
    \ Both ways are shown above, but the same-line prompt is used in most of the example\
    \ programs in this book. Note that the same-line prompt includes a separating\
    \ space at the end of the prompt message (after the colon): \"Enter name: \" but\
    \ the previous-line prompt does not: \"Enter name:\". Also, it is common to include\
    \ possible responses in the prompt, enclosed in square brackets and separated\
    \ by commas or slashes, like this: \"What is your gender? [M/F]:\", as a guide\
    \ to the user.\n\nUnless you have a very good reason to otherwise, always have\
    \ a prompt for each user-entered value. Every time you expect the user to type\
    \ something and press ENTER, or just press ENTER after a pause, do this: precede\
