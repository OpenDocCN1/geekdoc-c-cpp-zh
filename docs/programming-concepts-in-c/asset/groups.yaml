    \n# 第 6 章。简单逻辑：基础分支/循环\n\n如第 1 章所示，分支和循环是让程序更有趣、更有用的方法，允许它们跳过和跳转语句，而不是按照严格的顺序执行。程序中的决策点允许程序流可以继续顺序执行或跳转到其他地方，这就是“逻辑”——类似于“如果此条件存在，则执行某些操作——否则跳过该操作”。\n\
    \n## 6.1 if 语句\n\n在以下两个示例中，缩进的输出语句只有在用户猜测正确时才会执行。这是用于分支的**“if 语句”——它允许跳过缩进语句进行分支。\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nint main()\n{\n    // 从键盘读取分数（参见\
    \ 5.1）\n    int usersGuess;\n    cout << \"I am thinking of a number between 1-10\"\
    \ << endl;\n    cout << \"Try to guess the number [1-10]: \";\n    cin >> usersGuess;\n\
    \    cin.ignore(1000, 10);\n\n    // 查看猜测是否正确\n    if (usersGuess == 7)\n    \
    \    cout << \"You guessed it!\" << endl;\n}\n```\n\n## 更多分支逻辑 [Rumpelstiltkin.cpp]\n\
    \n```cpp\n#include <iostream>\n#include <string>\nusing namespace std;\n\nint\
    \ main() {\n    // 从键盘读取文本（参见 5.1）\n    string usersGuess;\n    cout << \"Try\
    \ to guess my name: \";\n    getline(cin, usersGuess);\n\n    // 查看猜测是否正确\n  \
    \  if (usersGuess == \"Rumpelstiltkin\")\n        cout << \"Argh!!!\" << endl;\n\
    \    cout << \"GOODBYE\" << endl;\n}\n```\n\nif 语句以小写单词 `if` 开始。在它的括号内，比较值和变量以检查它们是否相等。如果是，则包含下一行，否则不。那个奇怪的两个字符符号是双等于\
