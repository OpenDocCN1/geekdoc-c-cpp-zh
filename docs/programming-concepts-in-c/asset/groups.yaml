    # Chapter 4. Doing The Math: Libraries


    Some problems are too difficult to solve with math operations only – for example,
    simple amortization. If you deposit $100 each month for 10 years, earning 7.5%
    interest per year compounded monthly, how much would you have at the end of those
    10 years? Here''s the formula for this (yikes):


    ```

    $S = D\left(\frac{(1+p)^T-1}{p}\right)$

    ```


    D is the deposit amount of $100 per month, p is the monthly interest rate (0.075
    / 12), T is the number of months in 10 years (10 * 12). All of this we can do
    with simple math operations, except for the part about raising something to the
    power of T. Actually, we could write 120 identical multiplication expressions,
    but there''s got to be a better way! To solve this, we use the built-in math “library”!
    It contains useful expressions, like raise to a power, find the square root, trig,
    and exponentials. For example, to raise “x” to the power of “y”, use this expression:
    pow(x, y), but in C++, x and y must be floating point variables, or values – not
    integer numbers.


    Programmers refer to pow(x, y) as a “function call”. Function names follow the
    same naming rules as variables, which involve the concept of “identifiers”. Since
    identifiers identify both variables and functions, it makes it difficult to tell
    whether an identifier refers to a variable or a function. There is an easy way
    to tell the difference – function calls always have parentheses, even if the parentheses
    are “empty” like they are in s.length(), which we saw in the previous chapter.


    Here are some handy math subprograms that work with floating point values and
    variables:'
  - "[PAGE 62]\n\n# PROGRAMMING CONCEPTS IN C++\n\n| math operation | in C++ |\n|---\
    \ |--- |\n| square root | sqrt(x) |\n| sine | sin(x) |\n| cosine | cos(x) |\n\
    | raise \"e\" to a power | exp(x) |\n| raise \"x\" to the power | pow(x, y) |\n\
    \nBut note that in order to use the library of math functions in C++, you need\
    \ to have a #include <cmath> statement near the top of the source file.\n\n“Libraries”\
    \ add functionality to a computer language – they add features that are not part\
    \ of the base language. Think of them as expansion modules, like you might buy\
    \ for a board game like “Settlers of Catan, Traders and Barbarians Expansion”,\
    \ or for a computer game like the “Halo 4 Multiplayer Map Pack”. A feature to\
    \ raise a number to a power is actually *not* part of the base C++ computer language\
    \ – it’s in the “cmath” expansion library. Libraries are attached to programs\
    \ through the use of #include statements.\n\nSo here’s the amortization calculation\
    \ for an annual interest rate of 7.5% – make sure you understand the conversion\
    \ of annual interest rate as a percent to monthly interest rate in decimal:\n\n\
    ```\n#include <cmath>\n\nint main() {\n    // assignment upon declaration (see\
    \ 3.2.3)\n    double D = 100; // $ $ deposited per month\n    double p = 0.075\
    \ / 12; // monthly rate\n    double T = 10 * 12; // #of months\n\n    // the pow\
    \ function call (new)\n    double S = D * ((pow(1 + p, T) - 1) / p);\n}\n```"
