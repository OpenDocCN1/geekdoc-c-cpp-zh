    # 3.3 Calculations


    Once there are variables with valid values, they can be considered as inputs to
    calculations. Calculations take place in expressions, which usually involve variables,
    numbers, and an operation symbol, like a plus sign. For example, a + b is an expression
    that results in adding the values stored in b variables, named “a” and “b”. Note
    that for this expression to be valid, both a and b must have been declared and
    assigned values before the expression appears.


    In an expression like a + b, the a and b are called “operands”. An Operand in
    a calculation expression can be a variable name, as shown in the examples so far,
    or they can be values. For example, 10 + 17, or 7 + b, are all valid calculation
    expressions, or “math operations”.


    Some other math operations besides addition are subtraction - b, multiplication
    a * b, and division / b. There is also modulus % b which results in the remainder
    of the whole number division problem “b goes into a..., with the remainder...”.
    You know how to use addition, subtraction, multiplication, and division. Here’s
    how some of these work:


    ![](img/80b9ed561fa57ed72adb64b305ef946d_52_0.png)


    ![](img/80b9ed561fa57ed72adb64b305ef946d_52_1.png)


    ![](img/80b9ed561fa57ed72adb64b305ef946d_52_2.png)


    ![](img/80b9ed561fa57ed72adb64b305ef946d_52_3.png)


    So calculation expressions can have numbers as operands as well as variables,
    like a / 3 and 2 + 2. They always involve two values and an operation symbol in
    between.


    # 3.3.1 Using Calculation Expressions In Statements


    Remember that expressions do not stand alone – they have to be used in statements.
    In the same way, words in English do not stand alone – they need to be used in
    sentences in order to be understood'
