    \ endl;\n}\n```\n\n## ROBERT Burns\n\n当然，上述代码有无限种写法，包括变量名的选择以及使用复杂的还是简单的表达式。实际上变量名甚至不符合小字母开头的习惯。这种对习惯的偏离是为了匹配方程变量，并且是可以接受的做法。此外，对于这个没有输出的非常简单的示例，`#include\
    \ <iostream>` 和 `using namespace std;` 是不需要的。对于任何首字母为 c 的库都不需要（有少数例外）。此外，注意示例中使用了\
