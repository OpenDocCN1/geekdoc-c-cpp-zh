    \n实际上，将其写成 `(age1 + age2 + age3) / 3.` 是可以接受的，因为计算机语言处理多个连续加法的方式就像它们被括号括在一起一样。这里有一个使用文本的示例：\n\
    \n```cpp\nExampleLetter.cpp\n\n#include <string>\nusing namespace std;\n\nint\
