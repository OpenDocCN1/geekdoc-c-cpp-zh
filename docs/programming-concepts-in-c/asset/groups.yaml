    \ 10，但数字就会出现两次，那不是良好的编程习惯！如果你想将程序改为 8 年而不是 10 年呢？你必须找到它并修改两次，这会引入输入错误和遗漏错误。\n\n\
    此外注意代码列表顶部的包含文件集。`iostream` 在那里是因为 `cout` 和 `endl`，`iomanip` 在那里是因为 `setprecision`，`math`\
