    ## 9.5 字面量


    直接写入代码中的值称为字面量（literal values）。根据其编写方式，它们具有关联的数据类型。例如，整数的数据类型为 `int`（如 0、100 或
    -1）。浮点数的数据类型为 `double`（如 0.0、3.14159 或 -40.0）。


    字面量通常是“十进制”数字，但整数字面量也可以是八进制（基数为8）或十六进制（基数为16）。要将数字写为八进制，在前面加一个零（例如 `011`），这等同于十进制的
    63 —— 7 个八加 7 个一。注意，`08` 和 `09` 是未定义的，且会导致编译器错误，因为数字 8 和 9 不存在于八进制中。要将数字写为十六进制，在前面加
    `0x` 或 `0ABCD1234`。注意 `A` 到 `F` 是在 `0` 到 `9` 的基础上添加的数字，以便为十六进制系统提供 16 个数字。


    浮点数字面量通过附加大写或小写的 `F` 来写入（例如 `3.14159f` 或 `100.0F`）。长型（Longs）通过附加大写或小写的 `L` 写入。字符（char）字面量以单字符的形式写入，并在前后加上单引号（或撇号）（例如
    `''A''`）。字符串（string）字面量写入任意数量的字符，前后加上双引号（例如 `"Hello"`）。布尔（bool）字面量为 `true` 和 `false`。


    “无符号”（Unsigned）数据类型值通过附加大写或小写的 `U` 来写入，尽管除了此处提到外，书中未涵盖这些内容。


    ## 9.6 类型转换


    计算机语言有多种数据类型，对于程序中的每个变量，你都必须决定使用哪种数据类型。此外，数学运算结果的数据类型取决于运算中值的数据类型。这里有一个问题是：如果你有
    3 个 `int` 值（例如 `a`、`b` 和 `c`）并且你想求它们的平均值，表达式 `(a+b+c) / 3` 将截断（即丢失）结果的小数部分，因为这就是整数除法的规则。这意味着
    `(1+1+2) / 3` 不是一个之一三 —— 是 1！


    这个问题的解决方案是类型转换（type casting）。你可以编写强制转换的代码——这是一种将一种类型的值临时转换为相关类型的方法，例如将 `int` 转换为
    `double`。方法如下：


    | 代码 | 注释 |

    | :--- | :--- |

    | `int a = 100; int b = 17; int c = -29; double average1 = (a + b + c) / 3;` |
    // 丢失了小数部分结果 |

    | `average2 = (double)(a + b + c) / 3;` | // 这样更好 |

    | `average3 = (a + b + c) / 3.0;` | // 这种也行 |


    此外，函数参数列表指定了调用括号内使用的值的数据类型。那么，如果你有一个特定数据类型的变量，并想使用该变量调用函数，但参数列表指定的数据类型不相同怎么办？例如，你有一个
    `int` 值，并想使用编译器的库函数 `sqrt` 获取它的平方根，而该函数的参数列表指定的是 `double`。使用类型转换将一种类型的值转换为相关类型，例如将
    `int` 转换为 `double`，如下所示：


    ```cpp

    Type Casting Of Parameter Values

    int x = 100;

    double y1 = sqrt(x); // 错误

    double y2 = sqrt((double)x); // 这样更好！

    ```


    类型转换也用于截断浮点数值的小数部分，如下：


    ```cpp

    Type Casting

    double x = 456.999;

    int y = (int)x; // 值为 456

    ```


