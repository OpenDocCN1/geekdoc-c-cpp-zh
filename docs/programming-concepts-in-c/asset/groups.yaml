    # PROGRAMMING CONCEPTS IN C++


    ![](img/80b9ed561fa57ed72adb64b305ef946d_34_0.png)


    ```sh

    sh-4.3# null

    sh: null: command not found

    sh-4.3# c++

    c++: fatal error: no input files

    compilation terminated.

    sh-4.3#

    ```


    But if the reply says "not recognized" or "bad command" or something like that,
    without saying "no input files" you’ll need to install a compiler.


    ![](img/80b9ed561fa57ed72adb64b305ef946d_34_1.png)


    ## 2.2.3 Installing MinGW On A Windows PC


    There are many C++ compilers for Windows, including Microsoft’s Visual Studio,
    and just about any one of them will do for following the examples in this book.
    A really easy install with a small footprint is the open source GNU compiler available
    for free from MinGW. A convenient place to find MinGW.org’s compiler is http://tdm-gcc.tdagon.net/download.
    From that page, download tdm-gcc-4.9.2.exe and run it. Follow the prompts, accepting
    all the defaults. After you have installed MinGW, verify that it is properly installed.


    To do so, you need to get a “command prompt” window and enter the command c++.
    It should now say “no input files”. But if it still shows “bad command”, verify
    that you now have a folder named c:\TDM-GCC-32\bin containing a file named c++.exe.
    If so, it''s installed and you''ll need one more step before the c++ command works.
    The command is path=c:\TDM-GCC-32\bin;%path% and you''ll have to enter it every
    time you open a command prompt window for compiling C++.


    ## 2.2.4 Installing Xcode On An OSX Mac


    Search for Xcode in the Apple App Store and choose “GET”. Here’s the sequence:


    ![](img/80b9ed561fa57ed72adb64b305ef946d_35_0.png)


    You will not ever need to launch the Xcode application – you just use Terminal.
    Confirm your installation by starting the Terminal app and entering the c++ compiler
    command. You may be prompted to allow installation of the command line tools for
    Xcode – if so, go ahead with that, and accept any defaults.


    ## 2.2.5 Using Online Compilers


    There are even fully online compilers like the ones at ideone.com, tutorialpoint.com,
    and repl.it that you can use without installing anything. They are not really
    suitable to be your primary compiler, but they do offer handy access to a compiler
    when you need one.


    ## 2.3 Choosing A Folder For Storing Files


    To store your C++ “source files” on a PC or Mac and do your programming work,
    you should have a folder reserved specifically for that purpose. This is called
    your “working folder”. Decide upon this and get it ready before writing your first
    program.


    You can put your working folder on a hard drive or on removable media, like a
    flash drive. If you are not yet comfortable with “command-line” mode or file structure
    navigation, it’s easiest to simply use a flash drive. Also, with your files on
    a flash drive they are readily portable between home and classroom and lab, and
    so on – even between PC and Mac. The rest of this section is organized for students
    using flash drives, as others with more experience can easily adapt the instructions
    for themselves.


    On a PC, use Windows Explorer to create your working folder on your flash drive.
    On a Mac, your flash drive icon should already appear on your desktop with a default
    name, like “NO NAME”. You can rename it as you would any file or folder on your
    Mac desktop. It’s better to name it without spaces – something like programming
    and thereafter its icon will appear on your desktop:


    ![](img/80b9ed561fa57ed72adb64b305ef946d_36_0.png)


    Now create your working folder on your flash drive, named for example, cpp. While
    it’s possible to put this folder inside some other folder on the flash drive,
    the rest of this section is written as though the working folder is not inside
    some other folder.


    Next, figure out how to locate your working folder in command-line prompt window.
    On a PC, open a command prompt as explained previously. Navigate to your flash
    drive by typing the letter designation of the drive, then a colon, and then press
    ENTER. That is, enter the command r: if your drive designation is “R”. Then navigate
    to your working folder on the flash drive using a command like cd\cpp, for example.


    On a Mac, start the Terminal app and enter the command cd /volumes/programming/cpp,
    for example. That’s cd, not cd, and it slashes / not backslash \. And don''t forget
    the space after cd.


    Or on either Mac or PC, type cd, drag and drop your working folder onto it, and
    press ENTER. That’s cd space, not just cd. Then you can drag and drop to complete
    the command, and press ENTER.


    ## 2.3.1 How To Backup Your Files


    The rule is simple: “only backup the files that you do not want to lose.” After
    you finish your source files, save them onto a hard drive or flash drive, imagine
    for a moment what would happen if your drive fails. It is possible to use cloud
    services like Dropbox or Google Drive or email your files. There are many ways
    to do this, and the important thing is to have a copy of your work stored elsewhere.


    ## 2.4 Configuring A Folder For Programming


    The tendency is to type code “linearly” – that is, from the top line to the bottom,
    from left to right. But that is not the best way to type code. Matching parentheses
    and curly-braces appear throughout code. The toughest part is to keep track of
    these and make sure that each open parenthesis has a matching parenthesis.


    ## 2.5 Editing


