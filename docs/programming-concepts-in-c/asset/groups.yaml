    \n在计算机中表示列表有几种方法，我们将在本章及后续章节学习这些方法。一种方法是使用数组，这就是本章的主题。\n\n# 13.1 基于数组的列表\n\n数组在创建时就确定了大小，我们通常认为它们所有的元素都被分配了有效值。“基于数组的列表”取了数组的思想，但认为并非所有元素都在使用。数组被分为两部分：具有赋值值的前部和留作未来使用的占位符的后部。一个独立的\
    \ `int` 用于跟踪任何时候有多少元素是实际使用的。这个变量被称为“list size”，它了正在使用的元素数量，但也充当了赋值元素和未赋值元素之间的界限。\n\
    \n计算机中表示列表有几种方法，我们将在本章及后续章节学习这些。一种方法是使用数组，这就是本章的主题。在之前的章节中，我们将值直接加载到数组中。但使用列表时不同。我们首先将新值存储在一个临时变量中，例如\
    \ `aScore`。然后检查列表是否满，如果未满，我们将临时变量的值放入数组的下一个可用位置。赋值语句的方括号内部是自增运算符 `++`，针对 list\
    \ size 变量。这样做的作用是在赋值后将 list size 加一。语句 `score[nScores++] = aScore;` 等同于两条语句 `score[nScores]\
    \ = aScore; nScores++;` 但它更简洁。此外，作为一条语句，我们避免了编写那两条语句的大括号容器。这没什么，但代码越简洁出错的机会就越少。\n\
    \n以下是对第 11 章早期示例的重写，但在本示例中，文件中的数量不是预先知的，也没有存储在文件的第一行。使用列表，真的不需要预先知道文件的数量，而且程序防止了分数过多（即超过\
    \ 100 个）的情况。\n\n# 13.1.1 向列表添加值\n\n默认情况下，新值被添加到列表末尾。以下是向创建的列表添加值的代码：\n\n```cpp\n\
