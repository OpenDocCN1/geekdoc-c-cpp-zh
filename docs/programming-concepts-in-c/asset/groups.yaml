    each code listing contained herein. Readers of the e-book version

    can simply touch or click a listing to have it appear in a separate

    browser window.


    The language of the book is common English so to keep it

    as approachable for students as possible. That’s while you’ll see

    contractions and exclamation marks!


    # Unique C++ Coding Features


    Looping logic is introduced using just the `while (true)`

    loop with `if (...) break;`, and branching logic with just

    if-else. Once the concepts are fully explained, then other syntax

    like while-condition, do-while, for, and switch gets added,

    present as more convenient and concise ways to write code for

    logic structures.


    A peculiar statement is used in the C++ console and text file

    input. It''s `cin.ignore(1000, 10);`, which follows every

    cin >>...; Likewise, `fin.ignore(1000, 10);`;nfollows every `fin >> ...;` for
    text file input. This forces

    only one value to be entered at a time via the keyboard, or one

    per line in a text file. It is very hard for students to understand

    C++''s way of handling the EOL, which is different between >>

    and `getline(...)`. Students can spend frustrating hours

    with programs that seem to skip over an input prompt, or seem to

    require the user to press ENTER twice sometimes. This consistent

    use of ignore gets around around this problem.


    The 10 in the `ignore(1000, 10)` is the same as "\n". It’s just

    a little easier to tell beginning students to type "10". The 1000 is

    just a large number that is easy to type, and makes both numbers

    easier to remember because of their similarity. 1000''s the number

    of trailing spaces or extra characters to skip in case a "\n" is not

    found, and it’s long enough to reset most keyboard buffer.


    C++ function prototypes are briefly explained, but they are not

    used in the code samples of this book. They are not needed because

    each of the programs in this book involves only one .cpp source'
