  mdcn: "\n\n## 4.3.1 转换语句\n\n上表中的 C++ 函数调用都是*表达式*。它们不是独立的语句——理解这其中的区别非常重要！它们解析为*新值*——而不会修改变量存储的原始值。为了更改存储的值，你需要在赋值语句中使用表达式，如下例所示：\n\
    \n| 语句 | 解释 |\n|---|---|\n| x = toupper(x); | 将存储在 x 中的字符替换为其大写形式的版本；如果 x 的值不在\
    \ a-z 范围内，则没有影响 |\n| x = toulower(x); | 将存储在 x 中的字符替换为其小写形式的版本；如果 x 的值不在 A-Z 范围内，则没有影响\
    \ |\n| x = abs(x); | 将存储在 x 中的整数替换为其绝对值；如果 x 的值已经是非负，则没有影响 |\n| x = fabs(x); |\
    \ 将存储在 x 中的双精度浮点数替换为其绝对值；如果 x 的值已经是非负，则没有影响 |\n\n注意 **toupper(x)** 和 **tolower(x)**\
    \ 仅适用于 **char** 类型的值和变量。它们*不适用于***string** 类型的值或变量。转换**string**大小写的方法将在本书后面的章节中介绍。实际上，某些编译器拥有**strings**\
    \ 的大小写转换函数，但它们特定于该编译器，并不是 C++ 语言的标准——不要指望它们在其他编译器或系统上能够工作！\n\n## 4.3.2 使用多个 #include\
    \ 语句\n\n大多数程序都会挂载多个库，例如 **iostream** 和 **iomanip**。它们的出现顺序通常并不重要。但本书采用了一种约定，以便更容易处理此类长语句列表。\n\
    \n以下是本书用于放置 **#include** 语句的约定。\n\n- * 将以字母“c”开头的库与其他库分开——这些是 C++ 继承自 C 语言的库，它们不需要\
