  - '[PAGE 115]


    # ROBERT Burns


    The `if (aScore == sentinel) break;` statement is easy to understand – it exits
    the loop if sentinel value gets entered. But what about `if (max == sentinel ...)`?
    That''s so that the maximum and/or minimum get set to the first-entered value
    no matter what it is. Remember that the first-entered value will necessarily be
    the maximum *and* the minimum until something else comes along to replace it.


    Try this modification: you can avoid the issue of a sentinel if you first prompt
    the user for the number of scores to be entered. But you still have to figure
    out how to initialize `max` and `min`. An old trick is to initialize `max` to
    a very large negative number, so that no matter what the first entry is, it will
    be larger. Likewise, initialize `min` to a very large positive number, so that
    no matter the first entry is, it will be smaller.


    Here is another feature of the above code blocks that you should notice and learn
    by the example it provides. Note that `sentinel` is created to store `-999`, and
    note that the value `-999` therefore will appear once. It is good programming
    practice to write a value only once, so that if you change it, you only have to
    do so in one place. You''ll see that this requires the “Enter a score” prompt
    to be a bit more complicated than usual, to include `sentinel`.


    # 7.4 Nested Loops


    “Nesting” is when there is a loop *inside* the curly-brace container of another
    loop. In each cycle of the outer-most loop, all cycles of the inner-most loop
    are run. The concept of nesting is not just for for-loops – it’s for loops in
    general, both count-controlled and event-controlled. But the examples that follow
    are all nested for-loops. Nested count-controlled loops need two counters – one
    to remember how many times we’ve been through the the “outer loop” while another
    counts the cycles of the “inner loop”.'
