    the user that the computer is waiting for something to be typed on the keyboard
    and the ENTER key pressed. Note that the prompts are enclosed in quotes (it''s
    hard to have a quote as part of the prompt itself!) Prompts are not required,
    but it''s hard for a user to know what to do without them. It would be like staring
    at someone and waiting for them to answer, without you asking a question!


    The way the transfer statement is written depends on the data type of the variable
    being read. For numbers and single-character text, two statements are used – one
    with `cin >>`...;, followed by `cin.ignore(1000, 10);`. For text of any length,
    a single statement is used: `getline(cin, ...);` (Note that ... stands for a variable
    name.


    Use these code blocks to add keyboard input to your programs by copying and adapting
    the sample code! (To adapt the code, change the variable names and prompts to
    suit your program.)


    There are many ways to write the `cin.ignore` statement other than `cin.ignore(1000,
    10);`. But the 1000 and the 10 are easy to remember and easy to type, so that''s
    what''s used in this book.


    Also, if a program has `cin >>`...; statements and no `getline(cin, ...);`; it''s
    okay to ignore the `cin.ignore` statements – you can leave them out. But if a
    program has one or more of each of these, it is very important to use a `cin.ignore`
    statement after each `cin >>`...!


    # 5.2 Prompts


    The statements with `cin` in them cause the program to pause and wait for the
    user to press the ENTER key before continuing. Program execution actually suspends
    there, waiting for the ENTER key to be pressed. Anything that is typed before
    the ENTER key


