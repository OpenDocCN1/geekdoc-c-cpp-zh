    \n在简单表达式的解决方案中，注意语句 `averageAge = averageAge + age3;`。这是一种赋值语句，它将用新值`overwrite`（覆盖）现有值。记住，存储在内存中的数据在不再需要时是可以被替换的。\n\
    \n括号（在复杂表达式的解决方案中）封装并隔离了一个 2 值操作，使其能够完成并将结果替换到剩余的表达式中。因此，`((age1 + age2) + age3)\
