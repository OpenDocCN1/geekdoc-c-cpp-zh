  - '[PAGE 194]


    # PROGRAMMING CONCEPTS IN C++


    But not be tempted to make variables global! It is possible to do so, and the
    compiler is okay with it, but it is bad programming practice. Why is it okay for
    constants but not for variables? It’s a code maintenance issue. Because constants
    do not change, there is really no problem making them global and using them throughout.
    But a global variable can be reassigned any anywhere, making it hard to track
    in a large program. Plus it may preclude having functions that call themselves,
    which we will see in chapter 15.


    # 11.5.2 Local Variables In Functions


    The result variables that are declared inside the value-returning functions are
    called “local variables”, because they each belong to their own function. They
    are in separate scopes, and therefore separate and distinct variables. They only
    exist while the program is executing the code in their function.


    fin and scoreTotal are also local variables.


    Also note that i is declared separately in every loop. While there are ways to
    share one counter variable among all loops, such as making it a global variable,
    it is better for each loop to have its own. The i’s are local to their loops –
    they are even more limited in their scope than fin and scoreTotal.


    # 11.5.3 Parameter List Variable Names


    The second parameter in countScoresGreater is named x in the parameter list, but
    the call in main has a variable named average in that position. The names do not
    match, and they do not have to. Whether the names refer to copies of values from
    main, or they are aliases for arrays in main, the names are local to their functions.
    In the same way, a person can go by two different names – one at work and another
    at home – array variables can, too. Array variables have aliases across function
    scopes.'
  - '[PAGE 195]


    The reason for using a generic name like x in the function is to make `countScoresGreater`
    more generic. There is really no reason that it cannot be used to count the number
    of scores greater than any value – not just the average. By writing it as generic
    as possible, it is available to be used for other things, such as counting the
    number of A''s (scores greater than 89).


    # 11.5.4 Temporary Variables


    The variable `average` in main is used to store the result of the `getAverage`
    call. It is really needed, though, because `average` could be replaced where it
    appears in the two output statements with `getAverage(score)`. But doing so would
    require that the averaging loop be executed twice, which is a bit of a waste.
    So programmers generally will use an extra “temporary variable” to store the result
    of a call that is used multiple times.


    Note that this was not done with `countScoresGreater` because it is only called
    once.


    # 11.5.5 Pass By Reference


    In `readScores`, array elements are assigned values. Since arrays are passed by
    reference, the function gets the original version of the array, and any changes
    made to it affect main where the array was declared. This would not be so for
    anything that is not an array – `int` and `double` are passed by value, meaning
    that the function has a copy of the original value. Any change made to a copy
    in the array does not affect the original in main.


    # 11.5.6 Array As A Return Type


    The data type for a dynamically-sized array has the star symbol in it, like `int*`.
    It’s okay to create a dynamically-sized array variable to return from a function.
    But it is not okay to create a regular array and return that. It may compile,
    but it definitely will not work!'
- md: "\n# PROGRAMMING CONCEPTS IN C++\n\n| Returning An Array: Right Way | Returning\
    \ An Array: WRONG WAY |\n|---|---|\n| int* getArrayOfInts(int size) | int* getArrayOfTenInts()\
    \ |\n| { | { |\n| int* result = new int[size]; | int result[10]; |\n| ... | ...\
    \ |\n| return result; | return result; // WRONG!!! |\n| } | } |\n| int main()\
    \ | int main() |\n| { | { |\n| int* a = getArrayOfInts(10); | int a[] = getArrayOfTenInts();\
    \ |\n| ... | ... |\n| } | } |\n\n# 11.6 Exercises, Sample Code, Videos, And Addendums\n\
    \nGo to www.rdb3.com/cpp/11 for extended materials pertaining to this chapter.\n\
    \n# Chapter 12. Using Objects\n\nLike an array, an “object” is a variable that\
    \ can store multiple values at the same time. But unlike arrays, the values in\
    \ an object do not have to be all the same thing, like all scores or all temperatures\
    \ or all names. An object can store all the values associated with, for example,\
    \ a student’s school record, like their name as text, their ID as a whole number,\
    \ and their grade-point-average as a floating point – all in one variable called\
    \ object.\n\nObjects can be visualized as database records, which may have multiple\
    \ data items, or “fields”, such as name, address, city, state, and zip code. Such\
    \ data does not lend itself very well to single-value variables, because you’d\
    \ have to use a separate variable for each field. That’s fine, but what if you\
    \ are working with multiple records? Now you need arrays for each field, and you\
    \ have to manage each one. If you want to use functions, you have to list each\
    \ field separately in the parameter list, and if you ever add more fields, you\
    \ have to change all the parameter lists.\n\n# 12.1 Object Specifications\n\n\
    The first thing you have to do in order to use objects is to decide which data\
    \ type to use for each field in the object. For our example, let’s consider a\
    \ student’s school record as an object, with fields for name, student ID, and\
    \ grade point average. We could add a lot to this, but let’s keep it simple for\
    \ the sake of learning.\n\nThe name is text and should be represented with the\
    \ string data type. Student ID is a 7-digit number and could be represented as\
    \ a string or int. No math operations will be done with student IDs, and it can\
    \ be hard to represent leading zeros with an int, so a string is a good choice\
    \ – but let’s go with int for instructional purposes. Grade point average has\
    \ a fractional part, so let’s use float. We could use double, but we will not\
    \ be using the math library and we don’t need 15 digits of accuracy and we’ve\
    \ not used float up to now, so let’s go with float. As you can see, there are\
    \ design considerations that go into the selection of data types for fields –\
    \ it’s not always obvious.\n\nBesides data types, each field needs a \"field name\"\
    . These have to be valid C++ identifiers, like variable names and function names.\
    \ Let's use name, id, and gpa. Also, the whole data set needs an identifier –\
    \ let's use Student. Here is how all of this gets together in code, and what it\
    \ represents conceptually:\n\n![](img/80b9ed561fa57ed72adb64b305ef946d_198_0.png)\n\
    \n```\nstruct Student {\n  string name;\n  int id;\n  float gpa; // Student\n\
    }\n```\n\nRepresentation in C++ code\n\n| name | id | gpa |\n|---|---|---|\n|\
    \ | | |\n| | | |\n| | | |\n| | | |\n| | | |\n\nConceptual representation\n\nConceptually,\
    \ an “object specification” represents an empty data table, with each row able\
    \ to represent one record, and each column representing a field. Note that just\
    \ defining an object is like typing column headers – rows containing values will\
    \ be added later, as the table starts out empty.\n\nThe object specification appears\
    \ inside the curly-brace container headed by the struct keyword. It goes below\
    \ the #include statement(s), and above the constants and functions (if any). It\
    \ actually defines a new data type, which you can now use in the rest of your\
    \ program below its specification, so be careful not to choose an identifier that\
    \ exactly matches any data type of the language (like string).\n\nYou can use\
    \ any previously defined data type for a field in your object specification –\
    \ even one defined by yourself, as long as it appears above.\n\nBut you cannot\
    \ use the struct being defined as a data type for one of its own fields. In other\
    \ words, struct Student cannot have a field Student bestFriend; in it. Also, note\
    \ the semicolon after the closing curly-brace of the struct's curly-brace container\
    \ – it’s required. Leaving it off can result in pages of error messages from the\
    \ compiler – so don't forget it!\n\n# 12.2 Objects\n\nThe whole idea of writing\
    \ a specification for an object is so there can be single variables and arrays\
    \ of variables that can hold all of these data fields for each record individually.\
    \ Once specified, you can use your new data type in the same way you use other\
    \ data types, except for assignment and retrieval of field values, which is a\
    \ new thing. So you can declare them, specify them as return types.\n\n# 12.2.1\
    \ Declarations\n\nConceptually, an “object specification” represents an empty\
    \ data table, with each row able to represent one record, and each column representing\
    \ a field. Note that just defining an object is like typing column headers – rows\
