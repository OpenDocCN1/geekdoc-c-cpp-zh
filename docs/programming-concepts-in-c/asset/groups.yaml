    \ “off” position, and checks each `case` statement from top to bottom until it\
    \ finds a match with the value in its parentheses. (And if) a match is found,\
    \ or if `default` statement is reached, the switch is set to “on”. Then on, all\
    \ other `case` statements are ignored, and any code that appears expires. The\
    \ purpose of `break;` is to prevent sequential processing from going any further,\
    \ and running into over the next `case` – it skips to the end of the switch-statement,\
    \ after its closing-brace.\n\nBut beware the switch-statement! Do not use `switch`\
    \ in place of if-break logic. The reason is that the `break;` statement inside\
    \ a `switch` means something entirely different than what it means in an if-break.\
    \ It exits the `switch.`, and has no effect on any loop that may contain.\n\n\
    ## 7.2 Event-Controlled vs Count-Controlled Loops\n\nThere are two basic loop\
    \ types: “event-controlled” and “count-controlled”. The difference is a conceptual\
    \ one, having to do with knowing `in advance` the number of cycles the loop will\
    \ execute. In event-controlled loops, cycles continue until certain conditions\
    \ are met that allow an if-break to exit the loop. When such conditions are met,\
    \ that’s an “event”. The number of cycles that will be executed before the event\
    \ occurs cannot be determined ahead time. Every loop example in the previous chapter\
    \ was event-controlled.\n\nThe types of event that can cause the end of an event-controlled\
    \ loop include (1) user enters “quit” in response to a prompt, (2) a valid input\
    \ value is entered, (3) the end of a file is reached while reading a file, as\
    \ we'll study in chapter 10, or (4) satisfying any other logical condition that\
    \ should make the loop end.\n\nBy contrast, a count-controlled loop executes a\
    \ predetermined number of cycles. So a loop that prints your name repeatedly until\
    \ the user tells it to stop is event-controlled. And a loop to output your name\
    \ exactly 10 times is count-controlled.\n\nIf the number of cycles of a loop is\
    \ known ahead of time, use a count-controlled loop. It's similar to an event-controlled\
    \ loop, but the “event” is reaching the predetermined number of cycles. Count-controlled\
    \ loops use int to keep track of the number of cycles, and it is the value of\
    \ this “counter” that is compared in an “if-break”.\n\n### Count-Controlled Loop\n\
    ```cpp\nint i; // cycle counter\ni = 0; // zero cycles so far\nwhile (true)\n\
    {\n    if (i == 10) break; // do 10 cycles\n    i = i + 1;\n}\n```\nThe counter\
    \ in count-controlled loops is traditionally declared as i. The last statement\
    \ in the loop “increments” i – that is, it adds one to it. But the logic to control\
    \ this loop is all over the place – before the loops starts, at the top of the\
    \ loop’s curly-brace, and at the bottom. The purpose of this chapter is to introduce\
    \ other ways to do loops in more concise ways. Actually the counter can be incremented\
    \ anywhere in the loop, and it can still work the same. But it's better to perform\
    \ the incrementing at the *end* of the loop for reasons that will become clearer\
    \ as we go.\n\n### 7.2.1 The While-Condition Loop\nIn the next example, the previous\
    \ count-controlled loop is simplified a bit by putting something other than `true`\
    \ inside the `while`'s parentheses:\n```cpp\nint i; // cycle counter\ni = 0; //\
    \ zero cycles so far\nwhile (i != 10) // do exactly 10 cycles\n{\n    i = i +\
    \ 1;\n}\n```\nThe while-condition statement combines the while-true and if-break.\
    \ Instead of breaking when the counter reaches 10, we continue the loop as long\
    \ as the counter is *not* 10. Break if equal, keep going *not equal*. While-condition\
    \ can be used for both event-controlled and count-controlled loops. Remember –\
    \ count-controlled loops are just event-controlled loops where the “event” is\
    \ reaching its limit. Here's the rule for when you can use while-condition instead\
    \ of while-true: if there's an if-break statement as the *first statement* inside\
    \ the loop's curly-brace, you can use while-condition instead. You don't have\
    \ to, but you can.\n\nHere is a full example of a count-controlled loop using\
    \ while-condition. It tracks the height that ball bounces, cutting the height\
    \ by 50% with each bounce. It tracks this for exactly 10 bounces, starting from\
    \ a height of 40 (inches).\n```cpp\n#include <iostream>\nusing namespace std;\n\
    \nint main() {\n    double height = 40;\n\n    int i = 0; // declare AND initialize\
    \ loop counter\n    while (i != 10) {\n        height = height / 2;\n        cout\
    \ << \"location is now: \" << height << \" inches\" << endl;\n        i = i +\
    \ 1;\n    } // while\n} // main\n```\nThe last statement in this count-controlled\
    \ loop increments the counter. Since incrementing i is done often in programming,\
    \ C++ has a shorthand way to write i = i + 1; it's i++. The statement i = i +\
    \ 1 actually consists of two steps: addition and assignment. So it seems useful\
    \ to have a statement that does both in one operation. And yes, there's i--; that\
    \ subtracts 1 from i. But whatever you do, don't ever write i++; anything like\
    \ that – results are unpredictable.\n\n### 7.2.2 The Do-While Loop\nIn a while-condition,\
    \ the if-break at the top of the curly-brace merged with the while. But what if\
    \ there's an if-break at the bottom of the container, as in 7.3's thereYet.cpp?\
    \ In that case you can use a “do-while” instead.\n\nUsing Do-While [thereYet.cpp]\n\
    ```cpp\n#include <iostream>\n#include <string>\nusing namespace std;\n\nint main()\
    \ {\n    do {\n        string answer;\n        cout << \"Are we there yet?\";\n\
    \        getline(cin, answer);\n    } while (answer != \"yes\");\n\n    cout <<\
    \ \"We're home!\" << endl;\n} // main\n```\nAgain, note the reverse logic – break\
    \ if the answer’s “yes”, keep going while the answer’s not “yes”. The do-while\
    \ variation usually applies to event-controlled loop logic.\n\n## 7.3 Introducing\
    \ The For-Loop\n\nCount-controlled loops have three control steps that are each\
    \ done separately but are all required in order for the loop to work right. So\
    \ like most languages, C++ provides a variation called the “for-loop”, which combines\
    \ all three into one statement. Here’s an adaptation of bounce.cpp from above,\
    \ using a for-loop:\n\n![](img/80b9ed561fa57ed72adb64b30ef946d_110_0.png)\n\n\
    ### A Simple Count-Controlled Loop [bounce2.cpp]\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nint main() \n{\n    double height = 40;\n\n    int i;\n\
    \    for (i = 0; i != 10; i = i + 1) {\n        height = height / 2;\n       \
    \ cout << \"location is now: \" << height << \" inches\" << endl;\n    } // for\n\
    } // main\n```\nThe **for** statement has three distinct parts to it, separated\
    \ by two semicolons. The first part has the counter's initialization **i = 0**.\
    \ (Later we'll put its declaration there, too.) The middle part has a reverse-logic\
    \ version of the if-break – with if-break breaks when the counter reaches its\
    \ limit, and with the for-loop it keeps going while the counter is **not** at\
    \ its limit. (Later we will see this common variation: keep going while the counter\
    \ is *less than* its limit.) The last part is the increment segment, **i = i +\
    \ 1**. (Later we'll see this variation: **i++).\n\n### 7.3.1 The Traditional For-Loop\n\
    The loop in **bounce2.cpp** matches the count-controlled while-true-if-break examples\
    \ that preceded it. But if you had jumped into for-loops without first studying\
    \ **while**, you probably would have seen them with the variations referred to\
    \ above. This is the way you'll usually see for-loops written:\n\n```cpp\nfor\
    \ (int i = 0; i < 10; i++) {\n    height = height / 2;\n    cout << \"location\
    \ is now: \" << height << \" inches\" << endl;\n}\n```\n"
