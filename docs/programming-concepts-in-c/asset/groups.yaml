    # 15.2.2 Classic Example: Factorial


    The classic introductory example for recursion is factorial. In math class you
    may have seen a symbol like this: **5!**, pronounced “five factorial”. It is the
    equivalent of 5 x 4 x 3 x 2 x 1, or 120. Factorials show up in probability calculations
    for such things like lotteries.


    The problem is this: we want a function to calculate the factorial of a non-negative
    number, **n**. First we consider coming up with an iterative solution, and we
    quickly decide that it is too complicated (again, work with me here). So we consider
    using recursion. First, there is a base case: **0!** is defined as 1 – actually,
    **1!** is also 1 – both base cases. Working towards the base case, **n!** is **n**
    (the part we know how to solve) times **(n-1)!** (the part we do not know how
    to solve). Luckily we have a function to solve the latter – the function we are
    writing! So the recursive solution is **n! = n x (n-1)!**:


    231'
