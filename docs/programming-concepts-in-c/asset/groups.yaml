    cout << result << \" is not a valid grade. Try again...\" << endl;\n} while\n\n\
    // step 3\nreturn result;\n} // getGrade\nint main()\n{\n    char grade;\n   \
    \ while (true) {\n        grade = getGrade();\n        if (grade == 'X' || grade\
