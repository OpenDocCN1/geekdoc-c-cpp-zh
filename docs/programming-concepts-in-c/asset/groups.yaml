  mdcn: "\n注意，函数参数列表包含了集合的规范。deque 变量规范中的取地址符号 `&` 并不是笔误——它告诉程序与函数共享原始的 deque 变量，而不是共享它的拷贝。这与第\
    \ 12 节末尾 `todTest.cpp` 中将对象作为参数的做法是一样的。\n\n## 15.2 调用调用自身的函数：递归\n\n递归简单来说就是：当一个函数的代码块中包含一个调用其自身的语句时！这实际上是循环的一种形式，看起来似乎是无限的。让它能够工作的原因是，函数必须包含逻辑来决定是否继续调用自己——类似于\
    \ `while-true` 循环中的 `if-break`。\n\n递归提供了一种解决问题的新方法。如果你不使用递归，你就是在使用“迭代”（iteration）——这是我们一直以来使用的方法，但由于它是唯一使用的工具，所以它并不需要一个名字。迭代使用循环；而递归使用函数。\n\
    \n递归通常是一个高级计算机科学课题。它在解决某些类型的问题时非常有用，并且实际上简化了许多解决方案。那么，为什么它出现在本书的最后，为什么它又是高级的呢？因为对于大多数人来说，很难立即理解——即使是那些对计算机有强天赋的人也是如此。这是一个你现在听、以后再相信的事情！\n\
    \n要应用递归，你只需要知道你正在解决的问题的以下几点：(1) 如何解决基础情况（base case），以及 (2) 如何将问题复杂度向基础情况降低。然后你需要能够将问题分为两个部分：(1)\
    \ 你知道如何解决的部分，以及 (2) 你不知道如何解决的部分。\n\n### 15.2.1 简单示例：倒计时\n\n这个极其易懂的例子演示了开发递归解决方案的步骤。问题是\
    \ NASA 雇佣你写一个倒计时程序，从任何非负整数开始，到零结束。（NASA 经常使用这种东西，他们想让它自动化！）你首先考虑使用迭代解决方案，但你很快得出结论认为这太难了（配合我的思路……）。所以你接着考虑改为使用递归解决方案。\n\
    \n那么，问题就是：从 `int` 变量 `n` 开始倒数。首先，写下你已知的部分：比如输出 `n` 中的数字。然后写下你不知道的部分：从 `n` 减 1\
    \ 开始倒数。例如，如果 `n` 是“10”，递归解决方案就是说“10”，然后从“9”开始倒数。如果你写了一个函数来执行此操作，并且倒数的数字在参数列表中，那么函数体将从参数列表开始，然后调用一个已知如何从减1后的值倒数的函数。这里是棘手的部分——我们用来执行该操作的正是我们正在写的这个函数！这看起来有点像鸡生蛋的问题，不是吗。\n\
    \n剩下的问题是识别一个“基础情况”，并在逻辑语句中使用它来停止递归。基础情况是：如果我们被要求从零开始倒数，那就很简单——只需说“0”即可！在这种情况下，如果参数列表中变量的值为零，就不需要进行额外的调用。\n\
    \n这里是完整的解决方案（你可以自由复制、修改并与 NASA 分享——不客气）：\n\n## C++ 中的编程概念\n\n![](img/80b9ed561fa57ed72adb64b305ef946d_232_0.png)\n\
    \n### 15.2.2 经典示例：阶乘\n\n递归的经典入门示例是阶乘。在数学课上，你可能见过这样的符号：**5!**，读作“五阶乘”。它等同于 5 x\
    \ 4 x 3 x 2 x 1，或者 120。阶乘出现在彩票之类的这类概率计算中。\n\n问题是：我们想要一个函数来计算非负整数 **n** 的阶乘。首先我们考虑给出一个迭代解决方案，并很快决定它太复杂了（再次，配合我的思路……）。所以我们考虑使用递归。首先，有一个基础情况：**0!**\
    \ 被定义为 1——实际上，**1!** 也是 1——这两个都是基础情况。向基础情况推进，**n!** 等于 **n**（我们知道如何解决的部分）乘以 **(n-1)!**（我们不知道如何解决的部分）。幸运的是，我们有一个函数来解决后者——即我们正在写的函数！所以递归解决方案是\
    \ **n! = n x (n-1)!**：\n\n## 经典的递归阶乘 [factorial.cpp]\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nint factorial(int n)\n{\n    int f;\n    if (n < 2) //\
    \ 检测基础情况\n        f = 1;\n    else\n        f = n * factorial(n - 1);\n    return\
    \ f;\n} // factorial\n\nint main()\n{\n    int n;\n    cout << \"Enter n: \";\n\
    \    cin >> n;\n    cin.ignore(1000, 10);\n\ncout << factorial(n) << endl;\n}\
    \ // main\n```\n\n### 15.2.3 注意事项\n\n不要过度沉迷于递归。任何事情总有迭代解决方案——只是一旦你熟悉它，递归的代码编写有时会更简单。但递归的效率通常低于迭代，所以如果可能，请使用迭代。而且这种成本有时太高，即使对于最简单的递归解决方案也是如此——从\
    \ 100000倒数试试！如果那行得通，再尝试……\n\n## 15.3 接下来该何做？\n\n这是一个使用 C++ 使编程成为现实的介绍。这些概念，如变量、代码块、分支和循环逻辑、子程序、数组和列表，是所有编程语言通用的。你在这里学到的可以作为学习任何特定语言的入门。\n\
    \n"
