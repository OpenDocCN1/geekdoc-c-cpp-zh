    \ see 6.3\n        cout << \"Very good, but a better answer is 10\" << endl;\n\
    }\n```\n\nLook at the line in the example with four endls in it. It skips four\
    \ lines, just to clear some space on the console screen. Also, note that endl\
    \ does not have to be the last item in a cout statement - it can appear anywhere\
    \ in the sequence.\n\nThe output statements contain leading spaces inside the\
