    ## 3.2.3 声明时的赋值


    现在我们已经有了变量


    要在声明时指定值，请使用如 `int age = 21;` 这样的语句。这条语句同时完成两件事——它为名为 "age" 的整数预留内存，并将值 21 存储其中。注意等号周围有单个空格——编译器并不要求，但放在那里是为了更好的人类可读性。这里是声明时赋值的其他一些示例：


    ## 声明时的赋值示例


    | | |

    | :--- | :--- |

    | int age = 21; | 该数字是一个整数，不可能有小数部分 |

    | double pi = 3.14; | 数字中有一个小数点，允许有小数部分（如果有） |

    | double temperature = 72; | 浮点值没有小数部分是可以的——要么有，要么留空 |

    | char gender = ''M''; | 1 字符 "char" |

    | string name = "Washington"; | 用于任何长度的文本 |


    ### 3.2.4 赋值语句


    要更改变量的值，请使用如 `age = 30;` 这样的语句。它将等号右侧的值存储在左侧的变量中。你可以尽可能多地这样做。这里是一些赋值示例：


    | | |

    | :--- | :--- |

    | age = 30; | age 被赋值为 30 |

    | temperature = 99.7; | temperature 被赋值为 99.7 |

    | grade = ''A''; | grade 被赋值为 ''A'' |

    | name = "Washington"; | name 被赋值为 "Washington" |


    在 C++ 中，你可以在给变量赋值之前在计算或输出中使用它，但它的初始值是不可预测的，某些编译器在使用未初始变量时会产生警告


    ## 3.3 计算


    一旦有了有效值的变量，就可以视为计算的输入。计算发生在表达式中，表达式通常涉及变量、数字和一个运算符。例如，a + b 是一个加上存储在变量“a”和“b”中的表达式。注意，为了这个表达式有效，a
    和 b 必须已经声明并赋值。


    在像 a + b 这样的表达式中，a 和 b 被称为“操作数”。计算中的操作数可以是变量名（如目前所示），也可以是值。例如，10 + 17 或 7 + b
    都是有效的计算表达式。


    除了加法，其他数学运算还有减法 -、乘法 * 和除法 / b。还有模 % b，结果是整数除法的余数“b 除 a 有...余数为...”。你知道如何使用加法、减法、乘法和除法。以下是其中一些的工作原理：


    ![](img/80b9ed561fa57ed72adb64b305ef946d_52_0.png)


    ![](img/80b9ed561fa57ed72adb64b305ef946d_52_1.png)


    ![](img/80b9ed561fa57ed72adb64b305ef946d_52_2.png)


    ![](img/80b9ed561fa57ed72adb64b305ef946d_52_3.png)


    所以计算表达式也可以包含数字作为操作数，如 a / 3 和 2 + 2。它们总是涉及两个值和一个中间的运算符。


    ## 3.3.1 在语句中使用计算表达式


    记住，表达式不是孤立的——它们必须在语句中使用。同样，英语中的单词也不是孤立的——它们需要用在句子中才能被理解


