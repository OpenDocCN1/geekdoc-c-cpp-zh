    # 10.2.3 Appending To A Text File


    By default, any existing text file is discarded and overwritten when you open
    it for output. But it is possible for your program to append, or add to an existing
    file instead of overwriting it. This is useful if you are building a database
    of transactions, for example, where each new transaction gets saved to a file.
    Here is how to open an output text file for appending instead of overwriting:


    ```

    fout.open("data.txt", ios::app);

    ```


    In the above, if the file does not already exist, it is created, as it would have
    been without the specification to append. Here is an example of using a text file
    to append output - it is a program that builds a class roster:'
