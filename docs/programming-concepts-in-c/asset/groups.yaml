    \ 语句之上（这样阅读你代码的人更容易找到它们）。\n- * 将所有的 C 库（如 `cmath`）放在 `using namespace std;` 之下，同样按字母顺序排序。\n\
    - * 如果没有任何 C++ 库，则排除 `using namespace std;` 语句——某些编译器在未包含 C++ 库时不允许使用该语句。\n\n\
    遵循这一约定使得 C++ 文件中的库更易于追踪。\n\n## 4.4 练习、示例代码、视频及附录\n\n访问 www.rdb3.com/cpp/4 获取与本章相关的扩展材料。\n\
    \n## 第 5 章 交互式程序：控制台 I/O\n\n输入可以从各种来源获取。在第 3 和第 4 章中，我们直接在程序源代码中指定输入值。这运行良好，但如果我们想使用不同的输入（例如更改摊销计算中的年数），就必须编辑并重新编译程序。这显然不是你可以分发给非程序员使用的程序类型！\n\
    \n如果程序能够*提示*（或询问）用户在键盘上输入值，并将这些值传输到程序中的变量中就太好了。这样我们只需要开发和编译一次程序，它就可以应用于几乎无限范围输入值。\n\
    \n这就是*交互式*程序所做的。它们的设计是为了让用户和程序之间发生程度的交互。这种交互在程序编写和编译*之后*将数据值传输到变量中！\n\n## 5.1\
    \ 从键盘捕获值\n\n从键盘捕获输入涉及三个步骤，这些步骤必须在代码中表示：\n\n| 键盘输入的三个步骤 |\n|---|---|\n| 1. 在计算机内存中声明一个变量来存储输入值。\
    \ |\n| 2. 提示用户输入值并按回 键。 |\n| 3. 将键盘输入传输到为此处声明的变量中。 |\n\n这是一个简单的示例：\n\n![](img/80b9ed561fa57ed72adb64b305ef946d_73_0.png)\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nint main() {\n    // 从键盘读取\
    \ int 值的代码块\n    int age; // step 1\n    cout << \"What is your age?\"; // step\
    \ 2\n    cin >> age; // step 3\n    cin.ignore(1000, 10);\n\n    // 回显用户年龄的代码块\n\
    \    cout << \"Your age is \" << age << endl;\n}\n```\n\n这看起来相当复杂，但并没有并没有看起来那么糟糕。让我们来拆解它。首先，必须告诉程序我们将使用计算机的\
    \ `console`（即键盘和显示器）。这就是 `#include <iostream>` 在 C++ 中起的作用。这里有一个 `using namespace\
    \ std;` 语句，它应该放在最后一个 C++ 库的 `include` 之后。事实证明 `cin` 是一个“对象”，这是我们到为止遇到的第二个对象。它的读作“see\
    \ in”，代表“控制台输入”。\n\n下一个示例程序包含了我们到为止学过的每种数据类型的代码块。与之前的示例不同，没有输出语句将输入的值回显到控制台屏幕上：\n\
    \n## C++ 编程概念\n\n### 从键盘传输值 [itsAboutYou.cpp]\n\n注意用于使用 `string` 数据类型的 `include`。当本书中出现多个\
    \ `includes` 时，它们的顺序并不重要，但按照约定，它们是字母顺序排列的。\n\n然后，在上面的代码块中有四个独立的键盘输入示例——一个用于整数，一个用于浮点数，以及两个用于文本。它们之间完全独立，可以以任何组合使用以匹配你的程序需求。每个示例都遵循三个步骤：(1)\
    \ 变量声明，(2) 用户提示，以及 (3) 数据从键盘到变量的传输。变量声明不需要紧挨着提示——它只需要在传输语句所在的地方即可。提示（带有 `cout\
    \ <<`）提醒用户计算机正在等待在键盘上输入内容并按下回车键。注意，提示包含在引号中（这很难来……\n\n## 5.2 提示\n\n带有 `cin` 的语句会导致程序暂停并等待用户按回车键。程序执行实际上在该处挂起，等待回车键。但在计算机屏幕上，`cin`\
    \ 语句的唯一证据是一个符号——通常是水平线或框。这对于用户知道要做什么来说并不是什么好的线索。`cin` 之前通常会有一个提示用户的 `cout`。这被称为提示（prompt）。\n\
    \n以下显示了没有提示和有提示的情况下程序将如何工作。\n\n| 无提示： | 同行提示： | 换行提示： |\n|---|---|---|\n| string\
    \ name; getline(cin, name); | string name; cout << \"Enter name: \"; getline(cin,\
    \ name); | string name; cout << \"Enter name:\" << endl; getline(cin, name); |\n\
    \n提示有两个放置位置：要么在用户输入所在的同一行，要么在上一行。这两种方法在上方都有显示，但本书中的大多数示例程序使用了同行提示。注意，同行提示在提示消息末尾有一个分隔空格（冒号之后）：\"\
    Enter name: \"，而换行提示没有：\"Enter name:\"。此外，在提示中包含可能的响应并将其放在方括号内，用逗号或斜杠隔开是常见的做法，例如：“What\
    \ is your gender? [M/F]:”，作为用户的指南。\n\n除非你有非常有理由，否则对每个用户输入值都应该有一个提示。每当你预期用户输入内容并按回车键，或者在暂停后仅按回车键时，请这样做：在其之前添加一个同行或换行提示，以便让用户知道要做什么。如果你可以包含一些引导，例如可能的响应或示例响应，请这样做。\n\
    \n"
