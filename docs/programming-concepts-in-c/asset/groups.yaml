    \ **grade** be declared **above** the validation loop. Otherwise it would not\
    \ be usable below the loop! It is a rule in C++ that variables declared inside\
    \ curly-brace are usable inside that container *only*. If you align your curly-braces\
    \ correctly and indent the statements as explained in this book, the rule is that\
    \ a declared variable is no longer usable after the first closing curly-brace\
    \ *to its left*. This is what's referred to as *scope*.\n\n```cpp\n{\n  int a;\n\
    \  ...\"a\" is usable here...\n  but not here\n}\n```\n\nSo the solution is to\
    \ declare the variable whose value is being input and verified *above* the validation\
    \ statement loop. The validation if-break statement is very lengthy because it\
    \ has so many tests in it. It's okay to have very long lines in most computer\
