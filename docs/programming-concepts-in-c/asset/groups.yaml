    \nint main()\n{\n    int n; // output this many rows\n    cout << \"How many rows\
    \ to output \";\n    cin >> n;\n    cin.ignore(1000, 10);\n\n    for (int i =\
    \ 0; i < n; i++) // outer loop\n    {\n        for (int j = 0; j < (i + 1); j++)\
    \ // inner loop\n            cout << \"*\";\n        cout << endl;\n    } // for\n\
    } // main\n```\n\nLook at the j-loop. It cycles i + 1 times. Since i is zero the\
    \ first time through, i+1 is one, and the j-loop causes 1 star to be sent to output\
    \ before the endl skips to the next line. The next time through, i is one, and\
    \ i+1 is two, so the j-loop causes 2 stars to be sent to output before endl, and\
