    # Chapter 8. Simplifying Complicated Programs: Using Functions


    C++''s subprograms are called “functions”. What you need to know about functions
    is why they are used in programming, the distinction between “void functions”
    and “value-returning functions”, and how “parameter lists” work. You also need
    to know about two kinds of functions – the ones in the compiler’s library, and
    the ones written by you, the programmer. For library functions you need to know
    the correct #include to use in order to have access to any particular function.
    For ones you write, you need to know what are “function definitions” and “function
    calls”, and how to use them.


    Things started to get a bit complicated when we introduced validation loops. What
    used to be a simple set of a few lines of code grew into nearly a dozen lines,
    with a loop and indented statements inside a curly-brace container. All we wanted
    to do was transfer one value from the keyboard. It would have been nice to say
    in one statement: “get a valid value for grade from the keyboard”, but it took
    ten times as many statements with prompts and a loop.


    Programs don’t have to get too much complicated than they already are before the
    code listings get bogged down in detail that it gets hard to follow the logic.
    Imagine itsAboutYou.cpp from chapter 5, if we were to add validation to each of
    its 4 console keyboard inputs – and that program does not even process the inputs
    or produce any output!


    To accommodate this situation, programming languages provide ways to modularize
    code by using “subprograms”, or “functions” in C++. Remember pow(l + p, T) from
    chapter 4’s mort.cpp? That uses a function to remove the detail of raising a number
    to a power from the sequential processing flow. Raising a number to a power is
    so commonly used that the computer language’s compiler already has the function
    in its library, ready for you to use.'
- md: "\n# PROGRAMMING CONCEPTS in C++\n\nBut are not functions in the compiler’s\
    \ library to do all the things we would ever want to do. Certainly there are none\
    \ to validate our example’s grade input. We'll learn in this chapter how to write\
    \ and use our own functions. We'll use them to modularize our programs by removing\
    \ detailed code blocks from the main sequential processing flow of a program,\
    \ placing them into separate functions.\n\n## 8.1 Value-Returning Functions\n\n\
    Let's start with an input validation example that moves the details of input validation\
    \ into a function.\n\nLook for these three main parts *inside* the function, because\
    \ they provide beginning programmers with a formula for success when learning\
    \ to write their own value-returning functions. You can eventually stray from\
    \ this exact formulation, as most programmers do, but not until you know *exactly*\
    \ what you are doing!\n\n| 3 Parts Of A Value-Returning Function |\n| :--- |\n\
    | 1. Declare a named variable result with a default value. |\n| 2. Write code\
    \ to possibly reassign a different value to result, replacing its default value.\
    \ |\n| 3. \"Return\" result |\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nchar getGrade() {\n// step 1\nchar result = 'X'; // the default value\n\
    // step 2\nwhile (true) {\ncout << \"What is your grade? [A, B, C, D, F, or X\
    \ to quit]: \";\ncin >> result;\ncin.ignore(1000, 10);\n\nif (result == 'A' ||\
    \ result == 'B' || result == 'C') break;\nif (result == 'D' || result == 'F')\
    \ break;\nif (result == 'X' || result == 'x') break;\n}\n\ncout << result << \"\
    \ is not a valid grade. Try again...\" << endl;\n} while\n\n// step 3\nreturn\
    \ result;\n} // getGrade\nint main()\n{\n    char grade;\n    while (true) {\n\
    \        grade = getGrade();\n        if (grade == 'X' || grade == 'x') break;\n\
    \        if (grade == 'A' || grade == 'B' || grade == 'C')\n            cout <<\
    \ \" Pass\" << endl;\n    \n}\n\ncout << \"Thanks for checking your grades!\"\
    \ << endl;\n// main\n```\n\nOkay - so it does not look less complicated than it\
    \ is before functions. But if you look at main, you will notice that it is simpler.\
    \ The code for prompting the user and the loop for validating the input are all\
    \ replaced with one statement, `grade = getGrade();`\n\nLet's take the above example\
    \ in order to understand how value-returning functions work.\n\n### 8.1.1 The\
    \ Function Call\n\ngetGrade() is a function call. It is an expression that invokes\
    \ the function, suspending main's sequential processing flow until the function\
    \ finishes. The call resolves to a value, just as if it was a variable name, and\
    \ since it is used in an assignment statement, that value gets stored in the variable\
    \ grade.\n\n`grade = getGrade;` would expect `getGrade` to represent a variable\
    \ (which it does not!)\n\nActually, the same function call can be used in programs\
    \ more than once, if you have the need to do so. A call can be used anywhere that\
    \ you would otherwise use a value, variable, or expression – even inside the body\
    \ of its own “definition” (yikes!) But in our case, we only need it once (whew!)\n\
    \n### 8.1.2 The Function Definition\n\nAfter the `#include` statement(s), we are\
    \ used to seeing `int main()`, but this is not the case in our example. Now, there\
    \ is another structure, very similar to the one for main, which comes above main.\
    \ That is the “function definition” – it has a curly-brace container for the detailed\
    \ code that got removed from main where it was replaced by a call. It runs whenever\
    \ a call is made that references it by its name.\n\nThe first line of a function\
    \ definition is the “function header”. In our example it’s `char getGrade()`.\
    \ A curly-brace container follows the header, with the function’s code block(s).\n\
    \nThe keyword `char` denotes that the function results in a data value of type\
    \ `char`. This is called the “return type” of the function. All other data types\
    \ are valid return types, but there can be only one per function.\n\n`getGrade`\
    \ is the programmer-selected name of the function. It is to be used in expressions\
    \ that call the function from “main”. The empty parentheses are required, indicating\
    \ that the identifier “getGrade” refers to a function instead of a variable.\n\
    \nJust like variables, C++ functions have to be defined before they are used.\
    \ Since getGrade is used in main, its definition comes before main. This would\
    \ not work the other way around, with main written `above` getGrade.\n\n### 8.1.3\
    \ return Statement\n\nA value-returning function should have a return statement\
    \ as the last statement in its definition. Following the keyword \"return\", there\
    \ needs to be a value, variable, or expression that matches the return type. In\
    \ our case, it will usually be `return result;`\n\nActually, main itself is a\
    \ function like any other function. A value-returning function whose return type\
    \ is int. But unlike any other value-returning function, main does not have to\
    \ end with a return statement, nor declare a result. Note that some C++ compilers\
    \ actually allow you to write main as a \"void function\"\n\n## 8.2 Parameter\
    \ Lists\n\nNote that the setting of result to a default value of zero is not really\
    \ necessary. In fact, the body of the function could be written any of these ways:\n\
    \n![](img/80b9ed561fa57ed72adb64b305ef946d_137_0.png)\n\n## 8.3 Void Functions\n\
    \nSometimes functions produce their own output and do not need to return anything\
    \ to main. In this case, the return type can be specified as void to indicate\
    \ that there is no return statement. Here’s a simplified example of what is called\
    \ a “void function”:\n\n```cpp\nA Simple Void Function [name.cpp]\n#include <iostream>\n\
    #include <string>\nusing namespace std;\nvoid outputName(string name)\n{\n   \
    \ cout << name << endl;\n} // outputName\nint main()\n{\n    outputName(\"George\
    \ Washington\");\n} // main\n```\n"
  mdcn: "\n\n# C++ 编程概念\n\n但编译器库中的函数并不是涵盖我们可能想要操作的一切。当然，并没有哪个函数可以验证我们示例中成绩输入的有效性。在本章中，我们将学习如何编写和使用自己的函数。我们将使用它们通过从程序的主顺序处理流中移除详细代码块，并将其放在单独的函数中来实现程序的模块化。\n\
    \n## 8.1 返回值的函数\n\n让我们从一个输入验证示例开始，将输入验证的细节移动到函数中。\n\n在函数*内部*寻找这三个主要部分，因为它们为初学者学习编写自己的返回值的函数提供了一个成功的公式。你最终可能会偏离这种精确的表述（正如大多数程序员做的那样），但在你*确切*知道自己在做什么之前！\n\
    \n| 返回值的函数的三个部分 |\n| :--- |\n| 1. 声明一个带有默认值的命名变量 result。 |\n| 2. 编写代码可能给 result\
    \ 重新赋值一个不同的值，替换其默认值。 |\n| 3. “Return” result |\n\n```cpp\n#include <iostream>\n\
