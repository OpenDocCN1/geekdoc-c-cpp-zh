    \ 2 值操作。将前两个数相加。加上第三个数。最后，除以三。计算器就是这样工作的——对 2 个数进行操作，然后将结果作为下一个 2 值操作的第一个数，依此类推。多步计算可以通过将其拆分为仅涉及两个值的步骤来完成。因此，我们可以用一系列语句来编写它，也可以使用复杂表达式将一系列\
