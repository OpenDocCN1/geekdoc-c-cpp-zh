    \ 直接丢弃或截断任何分数值。它不会四舍五入——而是截断。所以 99/100 的结果是零！\n\n注意在计算中使用数字时，没有小数点的整数被视为整数，而带有小数点的数字被视为浮点数！\n\
    \n编程中的一个经典问题是将温度从摄氏度转换为华氏度。公式是 f=(9/5)*c+32。如果我们将其程序化为 f=(9/5)*c+32；我们会遇到问题，因为\
    \ 9/5 的结果是 1！但如果运算中的两个数字中有一个是浮点数"
