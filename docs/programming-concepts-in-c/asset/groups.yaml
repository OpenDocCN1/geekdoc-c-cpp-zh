    # PROGRAMMING CONCEPTS IN C++


    Also note the if-statements in main all have their associated one-statement code
    blocks at the end, rather indented on the next line. This is okay, and it is done
    here because it is easier to read.


    And like before, the if (additionProblem(rand() % 10, rand() % 10)) score++; statement
    appears five times, each exactly the same – no reason that could not have been
    put into a for-loop!


    ## 9.5 Literal Values


    Values written directly into code are called literal values. Depending on how
    they are written, they have a data type associated with them. For example, whole
    numbers are of data type int (like 0, 100, or -1). Floating point numbers are
    of data type double (like 0.0, 3.14159, or -40.0).


    Literals are usually "base 10" numbers, but whole number literals can also be
    octal (base 8) or hexadecimal (base 16). To write a number as base 8 octal, prepend
    a zero (like 011), which is the same as decimal 63 – 7 eighth plus 7 ones. Note
    that 08 and 09 are undefined and will cause compiler errors, the digits 8 and
    9 do not exist in base 8. To write a number as base 16 hexadecimal, prepend 0x
    or 0ABCD1234. Note that A through F are digits added to the base 10 of 0 through
    9 in order to get 16 digits for the base 16 numbering system.


    Literal float values are written by appending uppercase or lowercase F (like 3.14159f
    or 100.0F). Longs are written by appending uppercase or lowercase L. Literal char
    values are written as single characters, with single-quotes (or apostrophes) before
    and after them (like ''A''). Literal string values are written as any number of
    characters, with quote marks before and after (like "Hello"). Literal bool values
    are true and false.


    "Unsigned" data type values are written by appending uppercase or lowercase U,
    although these are not covered in this book other than this mention.


    ## 9.6 Type Casting


    Computer languages have a variety of data types, and for each variable in your
    program you have to decide which data type to use. Also, the data type for the
    result of a math operation depends on the data types of the values in the operation.
    Here''s the problem: if you have 3 int values (for example, a, b, and c) and you
    want their average, the expression (a+b+c) / 3 will truncate (that is, lose) the
    fractional part of the result, because that is what number division does. That
    means (1+1+2) / 3 is not one and a third – it''s one!


    The solution to this problem is type casting. You can write code that forces casting
    – this is a way to temporarily convert a value of one type into a related type,
    such as an int to a double. Here''s how:


    | Code | Comment |

    | :--- | :--- |

    | `int a = 100; int b = 17; int c = -29; double average1 = (a + b + c) / 3;` |
    // LOSES THE FRACTIONAL RESULT |

    | `average2 = (double)(a + b + c) / 3;` | // that''s better |

    | `average3 = (a + b + c) / 3.0;` | // this works, too |


    Also, a function parameter list specifies the data type for values used in the
    parentheses of a call. So, what if you have a variable of a certain data type,
    and you want to call a function using that variable, but the data type specified
    for the parameter list is not the same? For example, you have an int value and
    you want to take its square root using the compiler''s library function sqrt whose
    parameter list specifies double. Use type casting to convert a value of one type
    into a related type, such as an int to a double, like this:


    ```cpp

    Type Casting Of Parameter Values

    int x = 100;

    double y1 = sqrt(x); // WRONG

    double y2 = sqrt((double)x); // that''s better!

    ```


    Type casting is also used to truncate the fractional part of a floating point
    value, like this:


    ```cpp

    Type Casting

    double x = 456.999;

    int y = (int)x; // value is 456

    ```


    ## 9.7 Exercises, Sample Code, Videos, And Addendums


