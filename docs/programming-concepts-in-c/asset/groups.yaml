    # PROGRAMMING CONCEPTS IN C++


    Note the indenting of the lines containing the declaration statements. Indenting
    is not important to the compiler – it is only for human-readability and organization
    of code. Note also that:


    - Two new lines were added, beginning with "#include" and "using". They are required
    when using the "string" data type in C++.

    - The data type and the identifier are separated by a single space, but it can
    be more than one if desired for alignment

    - Each declaration statement ends with a semicolon.


    As we introduce you to new types of statements in the remainder of this chapter,
    you should consider starting up your editor and your compiler, and experiment
    with typing similar code and seeing if you can compile and run it!


    ## 3.2.3 Assignment Upon Declaration


    Now that we have variables


    To specify a value upon declaration, use a statement like `int age = 21;` This
    statement does two things at once – it reserves memory for whole number named
    "age", and it stores the value 21 in it. Note that there are single spaces surrounding
    the equal sign – they are not required by the compiler, but are put there for
    better human readability. Here are some other examples of assignment upon declaration:


    ## Examples Of Assignment Upon Declaration


    | | |

    | :--- | :--- |

    | int age = 21; | the number is a whole number, with no fractional part possible
    |

    | double pi = 3.14; | the number has a decimal point in it, to allow for a fractional
    part (if any) |

    | double temperature = 72; | it''s okay for a floating point value to have no
    fractional part - either or or leave it off |

    | char gender = ''M''; | 1-character "char" |

    | string name = "Washington"; | for text of any length |


    ### 3.2.4 Assignment Statements


    To change the value of a variable, use an assignment statement like `age = 30;`.
    This takes the value on the right side of the equal sign and stores it in the
    variable on the left. You can do this as many times as you like. Here are some
    examples of assignment:


    | | |

    | :--- | :--- |

    | age = 30; | the value of age is set to 30 |

    | temperature = 99.7; | temperature is set to 99.7 |

    | grade = ''A''; | the grade is set to ''A'' |

    | name = "Washington"; | name is set to "Washington" |


    In C++, you can use a variable in a calculation or output before a value is assigned
    to it, but its uninitialized value is unpredictable and, some compilers produce
    a warning if you use uninitialized variables.


    ## 3.3 Calculations


    Once there are variables with valid values, they can be considered as inputs to
    calculations. Calculations take place in expressions, which usually involve variables,
    numbers, and an operation symbol. For example, a + b is an expression that results
    in adding the values stored in variables, named “a” and “b”. Note that for this
    expression to be valid, both a and b must have been declared and assigned values.


    In an expression like a + b, the a and b are called “operands”. An operand in
    a calculation can be a variable name, as shown so far, or they can be values.
    For example, 10 + 17, or 7 + b, are all valid calculation expressions.


    Some other math operations besides addition are subtraction b -, multiplication
    a *, and division / b. There is also modulus % b which results in the remainder
    of the whole number division problem “b goes into a..., with the remainder...”.
    You know how to use addition, subtraction, multiplication, and division. Here’s
    how some of these work:


