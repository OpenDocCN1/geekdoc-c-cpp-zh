    # PROGRAMMING CONCEPTS IN C++


    Here is an example that a subprogram to manage the details of the area calculation,
    using “jumps” between the main flow of the program and the subprogram, with lines
    and arrows showing the flow of the program:


    ![](img/80b9ed561fa57ed72adb64b305ef946d_26_0.png)


    The code for large programs can be obscured by the endless details of such simple
    operations. So detail is removed to subprograms (called “functions” in C++), and
    represented by a single statement directing the processing temporarily to the
    subprogram for the details of the operation. Look for this in the middle chapters
    of Part 2.


    # 1.5 Exercises, Sample Code, Videos, And Addendums


    Go to www.rdb3/cpp/1 for exercises that are suitable for assignments. They can
    be used exactly as they are, or copied, pasted, and marked up by instructors for
    use in their classes.


    There are also some samples of solutions to other exercises to show students the
    format and detail they should expect to apply in solving the exercises. And there
    are YouTube and other videos, explaining the concepts presented in this chapter.


    You''ll find a similar URL at the end of each chapter of this book with extended
    information on the chapter''s topic. New material gets added from time to time,
    especially in chapters where the details are affected by advances in technology,
    like chapter 2, which is about operating systems and compiler software – technologies
    that change constantly.


    Also, contributors are encouraged to send new materials to the author for possible
    inclusion in the chapter’s extended information.


    # Chapter 2. Editing And Compiling


    Now that the main concepts of programming have been explained, it’s time to actually
    do some programming. In order for you to “edit” and “compile” a program, you’ll
    need a program to type, an editor, and a compiler program. At first, what you
    will type be provided for you – you’ll type exactly what this book tells you to
    type. But as we move forward, you’ll have more and more of an opportunity to write
    parts yourself, and ultimately write programs yourself.


    Nearly all of the instructions for editing and compiling are “system-independent”
    – that is, they don’t depend on whether you are using a Windows PC or a Mac or
    something else. The presentation in this chapter is specific to Microsoft Windows
    on a PC and Apple OSX on a Mac, but it pertains to most UNIX/Linux systems as
    well.


    Here’s a checklist of the things you will need to consider:


    - Choose an editor. Install, if necessary. Configure for your use.

    - Choose a compiler. Install, if necessary. Configure for your use.

    - Choose a folder on your system for storing your files.

    - Configure your PC (if you are using Microsoft Windows)


    Once this checklist is completed, you will be ready to edit and compile your first
    program in C++!


    # 2.1 Choosing An Editor


    The first thing to do is to choose an editor. Our choice for PCs is Notepad, which
    can be found under Start|All Programs|Accessories|Notepad. No installation is
    necessary for Notepad. Our choice for Mac is TextEdit, which can be found in Finder
    under Applications – also no installation.


    # ROBERT Burns


    ![](img/80b9ed561fa57ed72adb64b305ef946d_29_0.png)


    Notepad on a PC


    TextEdit on a Mac


    # 2.1.1 Configuring Notepad On A Windows PC


    Two settings need to be made in Notepad, so that you can see line numbers. The
    first is to turn off “word wrap” – to do so, use the Format menu. Make sure that
    there is no checkbox next to the “Word Wrap” option. If there is, click it to
    make it go away. Then turn on the “status bar”. To do so, use the View menu. If
    there is a checkmark beside “Status Bar”, leave it there. Otherwise, click it.
    The Format and View menus should look like this when you’re done:


    ![](img/80b9ed561fa57ed72adb64b305ef946d_29_1.png)


    ![](img/80b9ed56fafa57ed72adb64b305ef946d_29_2.png)


    On your own computer these settings will persist from session to session. But
    in a computer lab at school, you may have to configure each time you sit at a
    workstation.


    # 2.1.2 Configuring TextEdit On A Mac


    For Mac TextEdit, the default configuration is “rich text”. That will not do for
    programming. So go to the Format menu and click “Make Plain Text”. Thereafter
    the menu will show “Rich Text” and the edit window will look like the one on the
    right.


    ![](img/80b9ed561fa57ed72adb64b305ef946d_30_0.png)


    And this one is really important! Go to TextEdit’s preferences and uncheck “Smart
    quotes” and “Smart dashes”:


    - Smart copy/paste

    - Smart quotes

    - Smart dashes

    - Smart links


    # 2.1.3 Installing Notepad


    **Notepad** editor was written by the author. It is similar to **TextEdit**, except
    that it works on any operating system, including Windows, OSX, and versions of
    Linux. It also contains menu-accessible C++ code blocks that match the examples
    in the book. Also, Notepad is a good choice if you plan to go back and forth between
    a PC and a Mac, because it automatically deals with the extra lines and line breaks
    that happen with files. The Notepad window looks like the one here.


    ![](img/80b9ed561fa57ed72adb64b305ef946d_31_0.png)


    The installation of **Notepad is very easy** – it just involves copying its icon
    from the Internet URL www.notepad.com to your desktop. Users of Mac can start
    using Notepad right away for C++ programming. But for Windows users they first
    need to download and install the “Java SE JRE” or the “Java SE JDK” from the Internet
    URL www.oracle.com/java/downloads/, where the latest version at the time of this
    writing is Java SE 8. If you intend to do any Java compiling, opt for the JDK.
    Otherwise, the JRE is all you need. You can always install a JDK at a later date
    without uninstalling the JRE.


    # 2.2 Choosing A Compiler


    Selection of compiler depends on the chosen language and the system being used.
    Compiler options for C++ on Windows PCs, Macs, and UNIX are presented below. There
    are many different C++ compilers available. Your system may already have a C++
    compiler installed. Linux and UNIX computers often do. To find out if one is installed
    and working on your system, go to a “command prompt” and enter the command `c++`.


    # 2.2.1 What''s A Command Prompt?


    Just about all systems have a command prompt. It’s a solid-color window (usually
    black or white) with a message (or “prompt”) that indicates it’s ready for a user
    to type a command. After a command gets typed, it gets sent to the system when
    the user presses the ENTER (or “return”) key. Before we can talk about compilers
    and compiling, we need to get a command prompt so that we can type commands.


    How you get to a command prompt depends on the system you’re using. On a Mac,
    you simply run the Terminal app that is part of its OSX operating system – it’s
    in the Applications folder. On Linux and UNIX systems, you probably start out
    with a command prompt when the computer boots up.


    In Microsoft Windows there are lots of ways to get to a command prompt, take your
    pick. One way is to use either the “run” or “search” option, and enter the three
    letters `cmd` – that should find a file named “cmd” or “cmd.exe”, which you would
    then choose and run.


    ![](img/80b9ed561fa57ed72adb64b305ef946d_32_0.png)


    Another way is to look for the command prompt icon on the desktop or in the menu
    system, and click it.


    ![](img/80b9ed561fa57ed72adb64b305ef946d_32_1.png)


    If any of this works, you''ll see something similar to this – a command prompt:


    ![](img/80b9ed561fa57ed72adb64b305ef946d_33_0.png)


    You''ll be doing this so often that you may wish to "pin" its icon to the task
    bar.


    ![](img/80b9ed561fa57ed72adb64b305ef946d_33_1.png)


    # 2.2.2 Maybe You Already Have A C++ Compiler


    To see if you already have a C++ compiler ready for C++ compiling, get a command
    prompt and enter the command `c++`. That''s *lowercase* c plus press ENTER. If
    the reply from the computer says "no input files", then you''re all set, like
    these Windows, Mac, and Linux examples:


    ![](img/80b9ed561fa57ed72adb64b305ef946d_33_2.png)

