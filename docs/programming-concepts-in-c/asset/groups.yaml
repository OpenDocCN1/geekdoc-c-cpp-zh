    # PROGRAMMING CONCEPTS IN C++


    `grade = getGrade;` would expect `getGrade` to represent a variable (which it
    does not!)


    Actually, the same function call can be used in programs more than once, if you
    have the need to do so. A call can be used anywhere that you would otherwise use
    a value, variable, or expression – even inside the body of its own “definition”
    (yikes!) But in our case, we only need it once (whew!)


    # 8.1.2 The Function Definition


    After the `#include` statement(s), we are used to seeing `int main()`, but this
    is not the case in our example. Now, there is another structure, very similar
    to the one for main, which comes above main. That is the “function definition”
    – it has a curly-brace container for the detailed code that got removed from main
    where it was replaced by a call. It runs whenever a call is made that references
    it by its name.


    The first line of a function definition is the “function header”. In our example
    it’s `char getGrade()`. A curly-brace container follows the header, with the function’s
    code block(s).


    The keyword `char` denotes that the function results in a data value of type `char`.
    This is called the “return type” of the function. All other data types are valid
    return types, but there can be only one per function.


    `getGrade` is the programmer-selected name of the function. It is to be used in
    expressions that call the function from “main”. The empty parentheses are required,
    indicating that the identifier “getGrade” refers to a function instead of a variable.


    Just like variables, C++ functions have to be defined before they are used. Since
    getGrade is used in main, its definition comes before main. This would not work
    the other way around, with main written `above` getGrade.'
