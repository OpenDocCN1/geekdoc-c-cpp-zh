    \n## 7.7 Advanced Logic Considerations\n\nYou’d think that comparison operators\
    \ as and-logic and or-logic would be all you need for branching and looping, and\
    \ you’re right – mostly! There are a couple of situations that arise frequently,\
    \ that require a bit of thought to figure out. So here are some programming “tricks”\
    \ to help you deal with them\n\n### 7.7.1 Comparing Any-Length Text\n\nIn crossRoad.cpp\
    \ in section 6.7.3, where we figured a way to allow “yes” to be entered as an\
    \ uppercase “Y” or a lowercase “y”? First we were surprised to find that it even\
    \ made a difference! Y is Y, right? Well, not necessarily. Case matters in programming.\
    \ “Y” is not “y”, and it makes a difference when using them in comparison statements.\n\
    \nWe solved that problem in crossTheRoad.cpp, but we totally ignored it in the\
    \ thereYet.cpp program that preceded it. That’s because thereYep used string variable\
    \ instead of a char, complicating the matter. So rather than recognize and deal\
    \ with it, we ignored it. We can ignore it no longer.\n\nIn the following example,\
    \ only the answer “Red” gets checked – that uppercase “R” and lowercase “e” and\
    \ “d”. It’s the only version of the word’s “casing” that we check.\n\n```\nTesting\
    \ Input Text [redGreen.cpp]\n#include <iostream>\n#include <string>\nusing namespace\
