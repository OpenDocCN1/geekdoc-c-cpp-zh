    \ Promises: Function Prototypes\n  - 8.7 Exercises, Sample Code, Videos, And Addendums\n\
    \n- Chapter 9. Counting On Your Fingers: Bits And Bytes\n  - 9.1 Computer Memory:\
    \ Arrays Of On/Off Switches\n  - 9.2 Floating Point Numbers\n  - 9.3 Representing\
    \ Characters\n  - 9.4 The True/False, Yes/No, On/Off, Up/Down, Left/Right Data\
    \ Types\n  - 9.5 Literal Values\n  - 9.6 Type Casting\n  - 9.7 Exercises, Sample\
    \ Code, Videos, And Addendums\n\n- Chapter 10. Interactive Programs: File I/O\n\
    \  - 10.1 Text File Input\n  - 10.2 Text File Output\n  - 10.3 Exercises, Sample\
    \ Code, Videos, And Addendums\n\n# Chapter 6. Simple Logic: Basic Branching/Looping\n\
    \nAs shown in chapter 1, branching and looping are ways to make programs more\
    \ interesting and useful by allowing them to skip and jump around statements,\
    \ rather than follow a strict sequence from top to bottom with options. The decision\
    \ points in programs where the flow of the program can either continue in a sequence\
    \ or skip to somewhere else “logic” – something like, “if this condition exists,\
    \ then do something – otherwise, skip over that something”.\n\n## 6.1 The If-Statement\n\
    \nIn both of the following examples, the indented output statement gets executed\
    \ only if the user’s guess is correct. This is the basic “if-statement” for use\
    \ in branching – it allows branching over the indented statement.\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\n\nint main()\n{\n    // read a score\
    \ from the keyboard (see 5.1)\n    int usersGuess;\n    cout << \"I am thinking\
    \ of a number between 1-10\" << endl;\n    cout << \"Try to guess the number [1-10]:\
    \ \";\n    cin >> usersGuess;\n    cin.ignore(1000, 10);\n\n    // see if the\
    \ guess is right\n    if (usersGuess == 7)\n        cout << \"You guessed it!\"\
    \ << endl;\n}\n```\n\n## More Branching Logic [Rumpelstiltkin.cpp]\n\n```cpp\n\
    #include <iostream>\n#include <string>\nusing namespace std;\n\nint main() {\n\
    \    // read text from the keyboard (see 5.1)\n    string usersGuess;\n    cout\
    \ << \"Try to guess my name: \";\n    getline(cin, usersGuess);\n\n    // see\
    \ if the guess is right\n    if (usersGuess == \"Rumpelstiltkin\")\n        cout\
    \ << \"Argh!!!\" << endl;\n    cout << \"GOODBYE\" << endl;\n}\n```\n\nif-statements\
    \ begin with the lowercase word `if`. Inside its parentheses, values and variables\
    \ are compared to see if they are equal. If so, the next line gets included, otherwise\
    \ not. That odd-looking, two-character symbol is double-equals, `==`. It tells\
    \ the program to compare based on equality. Note that there should be no semicolon\
    \ at the end of `if (...)` statements, like with other statements. Compilers allow\
    \ you to put semicolons there, so you have to remember this for yourself! In the\
    \ second program, GOODBYE gets sent to output no matter what – only one line belongs\
    \ to the if-statement. But as we’ll learn later, it’s not important in C++ – it’s\
    \ something else.\n\n## 6.2 Comparison Operators\n\nAlong with `==`, there are\
    \ six commonly used “operators”. An operator is something that uses values/variables\
    \ next to it and does something with them. The symbols for some of these operators\
    \ consist of two characters. They should be typed without being separated by spaces.\
    \ When an operator is typed with two numbers, variables, or expressions on either\
    \ side of it, the result is a simple logical expression, like `==`. Spaces are\
    \ not required, but are there for readability. Here are some examples of simple\
    \ logical expressions, which could be placed inside the parentheses of an if-statement:\n\
    \n| Examples Of Logical Expressions | Comparison Operators |\n| :--- | :--- |\n\
    | `x < 10` | tests whether the value stored in x is less than 10 (x must be a\
    \ whole number or floating point variable) |\n| `s == \"Hello\"` | tests whether\
    \ the text stored in s is exactly equal to \"Hello\" (s must be a C++ string)\
    \ |\n| `a != b` | tests whether a and b have different values (a and b must be\
    \ variables of the same data type: both numbers, both characters, or both strings\
    \ |\n| `gender == 'f'` | tests whether gender is F (gender must be a single-character\
    \ data type, char) |\n\nIt is important to remember that the test for equality\
