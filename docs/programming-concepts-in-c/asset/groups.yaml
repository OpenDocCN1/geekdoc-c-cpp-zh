- md: "\n# PROGRAMMING CONCEPTS IN C++\n\n## Reading An Unknown Number Of Values Into\
    \ A List [listFile.cpp]\n\n```cpp\n#include <fstream>\n#include <iostream>\nusing\
    \ namespace std;\n\nint main()\n{\n    ifstream fin;\n    fin.open(\"scores.txt\"\
    );\n    if (!fin.good()) throw \"I/O error\";\n\n    // create an empty list\n\
    \    const int MAX_SCORES = 100; // list capacity\n    int nScores = 0; // initially\
    \ empty\n    int score[MAX_SCORES];\n\n    // read and save the scores\n    while\
    \ (fin.good())\n    {\n        // read a score from the file // temporary storage\
    \ for new score\n        int aScore;\n        fin >> aScore;\n        fin.ignore(1000,\
    \ 10);\n\n        // add new score to list, if list is not full\n        if (nScores\
    \ < MAX_SCORES)\n            score[nScores++] = aScore;\n    } // while\n    fin.close();\n\
    \n    // find the average // loop counter\n    int i;\n    int scoreTotal = 0;\n\
    \    for (i = 0; i < nScores; i++)\n        scoreTotal += score[i];\n    double\
    \ average = (double)scoreTotal / nScores;\n    cout << \"The average of \" <<\
    \ nScores << \" numbers is \" << average << endl;\n\n    // count number of scores\
    \ > average\n    int nGreater = 0;\n    for (i = 0; i < nScores; i++)\n      \
    \  if (score[i] > average)\n            nGreater++;\n    cout << nGreater << \"\
    \ scores are greater than the average.\" << endl;\n\n} // main\n```\n\nNote that\
    \ the first loop reads values from the file, until the end of the file is reached.\
    \ The if-statement inside the loop protects against overfilling the array that\
    \ supports the list. There is no error message in this example, in case list capacity\
    \ is exceeded – new values are simply read and ignored. But it would not be difficult\
    \ to add code to either output a message or set a Boolean flag, as modeled in\
    \ section 9.4.\n\n## 13.1.2 Searching And Sorting A List\n\nWith array-based lists,\
    \ the code for searching and sorting is almost the same as it was for the arrays\
    \ we studied in chapter 11. The difference is that the list size is used for the\
    \ end of count-controlled traversal loops instead of the array size (which is\
    \ the same as the list capacity). So the counting search loop counts the number\
    \ of values greater than the average becomes:\n\n```cpp\nA Counting Search Loop\
    \ For A List\nint nGreater = 0;\nfor (i = 0; i < nScores; i++)\n    if (score[i]\
    \ > average) nGreater++;\n```\n\nSimilarly, the Boolean search loop becomes this,\
    \ even if nScores is zero:\n\n```cpp\nTwo Boolean Search Loops For A List\nbool\
    \ hasPerfectScore = false;\nfor (i = 0; i < nScores; i++)\n{\n    if (score[i]\
    \ == 100) {\n        hasPerfectScore = true;\n        break;\n    } // if\n} //\
    \ for\n\n// ...or this\nbool hasPerfectScore = false;\nfor (i = 0; i < nScores;\
    \ i++)\n    if (score[i] == 100)\n        hasPerfectScore = true;\n```\n\nAnd\
    \ for values of nScores other than zero, the min/max value search loops become:\n\
    \n## Finding The Maximum Or Minimum Value Of A List\n\n```cpp\n// find the maximum\n\
    int max = score[0];\nfor (i = 1; i < nScores; i++)\n    if (max < score[i]) max\
