    # Chapter 12. Using Objects


    Like an array, an “object” is a variable that can store multiple values at the
    same time. But unlike arrays, the values in an object do not have to be all the
    same thing, like all scores or all temperatures or all names. An object can store
    all the values associated with, for example, a student’s school record, like their
    name as text, their ID as a whole number, and their grade-point-average as a floating
    point – all in one variable called object.


    Objects can be visualized as database records, which may have multiple data items,
    or “fields”, such as name, address, city, state, and zip code. Such data does
    not lend itself very well to single-value variables, because you’d have to use
    a separate variable for each field. That’s fine, but what if you are working with
    multiple records? Now you need arrays for each field, and you have to manage each
    one. If you want to use functions, you have to list each field separately in the
    parameter list, and if you ever add more fields, you have to change all the parameter
    lists.


    # 12.1 Object Specifications


    The first thing you have to do in order to use objects is to decide which data
    type to use for each field in the object. For our example, let’s consider a student’s
    school record as an object, with fields for name, student ID, and grade point
    average. We could add a lot to this, but let’s keep it simple for the sake of
    learning.


    The name is text and should be represented with the string data type. Student
    ID is a 7-digit number and could be represented as a string or int. No math operations
    will be done with student IDs, and it can be hard to represent leading zeros with
    an int, so a string is a good choice – but let’s go with int for instructional
    purposes. Grade point average has a fractional part, so let’s use float. We could
    use double, but we will not be using the math library and we don’t need 15 digits
    of accuracy and we’ve not used float up to now, so let’s go with float. As you
    can see, there are design considerations that go into the selection of data types
    for fields – it’s not always obvious.'
