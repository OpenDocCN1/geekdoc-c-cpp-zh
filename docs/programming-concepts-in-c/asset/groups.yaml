  mdcn: '


    C++ 的一个之处在于，数据类型名称上的“long”修饰符似乎没有作用。这是因为对于同一种数据类型，不同的编译器和操作系统所使用的字节数各异，而 C++ 仅要求
    `long` int 至少与普通 `int` 一大。你可以通过以下方法找到你的编译器为任何特定数据类型使用了多少字节：例如 `cout << sizeof(int)
    << endl;`。


    因此，我们可以在计算机内存中表示整数，尽管它们受到范围限制且没有无穷的概念。但分数呢？


    ## 9.2 浮点数


    使用字节来表示数字无法解决分数值的问题。有 1 和 2，但 1½ 呢？3.14159265 呢？一种解决方案是修改位计数方法，使得我们不再表示整数，而是表示分数值。也就是说，小指的值是
    ½，无名指是 1，中指是 2，以此此类推——或者我们从小指的 ¼ 或更小值开始。这几乎就是计算机的做法，而为了实现这种机制，需要第二组数据类型——其第一位是分数而不是
    1。（实际上，第一位的值取决于所存储数值的大小——例如，如果存储的数字只有 10，为什么我们停在 ¼？？）


    | 浮点数（典型的 32 位和 64 位 C++ 编译器） |

    | 数据类型 | 使用的内存 | 可能取值范围 | 精度（位数） |

    | :--- | :--- | :--- | :--- |

    | float | 4 字节 | 约 -10³ 到 -10³，0，以及 10³ 到 10³ | 6 或 7 位 |

    | double | 8 字节 | 约 -10⁹ 到 -10⁹，0，以及 10⁹ 到 10⁹ | 15 或 16 位 |

    | long double | 12 字节 | 约 -10³⁰ 到 -10³⁰，0，以及 10³⁰ 到 10³⁰ | 17 或 18 位 |


    关于浮点数的一点在于上面表格的最后一列——精度。如果计算机如此精确，为什么我们还要讨论精度呢？考虑小指值为 ½ 的情况。我们只能表示到最近的半位。尽管浮点表示中的第一位实际上比
    ½ 小一点，但问题仍然存在——计算机的数轴上并没有连续的数字！所以，如果我们将手中的数字 1½ 除以二，我们会得到 3/4——但我们无法将数字分得足够细以显示
    1/4 的值——我们只有 ½ 和 1，这已经是我们接近 3/4 的最大值了。我们最终将真实数字舍入到计算机数字系统中尽可能接近的数字上。请亲自尝试运行以下代码块：


    ```cpp

    // 在 C++ 中尝试此代码

    out.setf(ios::fixed|ios::showpoint);

    out << setprecision(20) << endl;

    double x = 3;

    cout << x << endl;

    cout << (x + 0.0000000000000001) << endl;

    cout << (x + 0.0000000000000002) << endl;

    ```


    如果你将上述代码块写入程序，你应该发现前两个控制台输出语句产生相同的结果，尽管第二个语句给变量增加了一个微小的量。但第三个输出语句*确实*对变量产生了影响。这是因为第二个输出语句中增加的微量低于
    `double` 数据类型的*精度*范围。但第三个输出语句中增加的微量恰好在精度范围内，所以它显示了出来。


    精度是浮点数的问题，但对于整数并不是。这就是为什么我们需要对两者都使用单独的数据类型——这样我们可以牺牲分数能力为代价选择整数的精度，或者牺牲精度为代价选择浮点数的数的能力。这是计算机工作方式的一种老结果，而且*并不是*
    C++ 特有的——这是由于计算机在数它们它们的“手指”。


    ## 9.2.1 输出精度 vs 浮点精度


    等一下——在上一个例子中，我们也能够为 `setprecision(20)` 指定精度！难道不应该让程序员对这个精度问题拥有某些控制吗？从示例结果来看，显然不能。事实证明
    `setprecision(20)` 仅仅是指导按照指定的十位数显示输出。如果数字存储的精度低于输出要求的精度，计算机就会“编造”出它不确切的数字！（这比产生错误并在此时终止程序要好）。


    尝试一下这个——每个循环应该执行 10 次循环。但其中一个实际上会永远持续！


    | 更多的舍入误差 | 这个在应该停止时停止了。 | 这个没有！ |

    | :--- | :--- | :--- |

    | double x; for (x = 0; x != 2.5; x += 0.25) cout << x << x << endl; | double
    x; for (x = 0; x != 1; x += 0.25) cout << x << x << endl; |


    ## 9.3 表示字符


    使用字节表示数字无法解决分数值的问题。有 1 和 2，但 1½ 呢？3.14159265 呢？一种解决方案是修改位计数方法，使得我们不再表示整数，而是表示分数值。也就是说，小指的值是
    ½，无名指是 1，中指是 2，以此此类推——或者我们从小指的 ¼ 或更小值开始。


