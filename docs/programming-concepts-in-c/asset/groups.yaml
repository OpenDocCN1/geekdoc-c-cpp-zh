    # 第 10 章 交互式程序：文件 I/O


    输入可以从各种来源收集。在第3和第4章中，我们直接在程序列表中指定输入值。然后于第5章中，我们学习了如何通过 `cin` 对象从用户获取值。在本章中，我们将学习如何从文本文件中获取用户输入的输入，这样用户可以在运行程序之前准备好输入值，并在文件中保存和编辑。相同的技术也可以应用于保存游戏分数——胜了多少，输了多少！


    ## 10.1 文本文件输入


    文本文件就像向控制台提示输入响应，但是提前这样做并存储在文件中。将控制台输入转换为文本输入非常简单。实际上，你可以“混合使用”文件和文本输入。


    ### 10.1.1 文件库


    要使用文件 I/O，必须在程序顶部包含相应的库：


    ```cpp

    #include <fstream>

    ```


    ### 10.1.2 对象


    要从文件读取内容，你需要声明一个输入流对象。例如：


    ```cpp

    ifstream fin;

    ```


    ### 10.1.3 打开文本文件


    要打开文件，使用 `open` 方法。以下是打开指定文件的方法：


    ```cpp

    fin.open("data.txt");

    ```


    当你完成文件读取后，使用此语句关闭它：


    ```cpp

    fin.close();

    ```


