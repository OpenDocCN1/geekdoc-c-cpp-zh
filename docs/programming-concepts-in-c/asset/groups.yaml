    as might be used to represent someone’s name.


    You might wonder why we would even bother with this. Can’t the fractional or decimal
    part of a value be zero? And can’t a word consist of a single letter? Why have
    special categories for whole numbers and single characters? The reason is that
    there are certain efficiencies in the ways that computers deal with the simpler
    forms of numbers and text. The simplest numbers are whole numbers, and the simplest
    words consist of 1 letter. So in dealing with numeric values, if we can use elements
    of the computer language that are intended for whole numbers, we do so. Otherwise
    we use the more general ways of dealing with numbers that may or not have fractional
    parts. Likewise in dealing with text values, if we can use elements of the computer
    language that are intended for single characters, we do so. Otherwise we use the
    more general ways of dealing with text that may have any number of characters,
    even zero (as would be used to represent a blank).


