    \ 事件控制循环与 计数控制循环\n\n有两种基本的循环类型：“事件控制”和“计数控制”。它们的区别在于概念上的，与是否 `提前` 知道循环将执行的周期次数有关。在事件控制循环中，循环持续进行，直到满足某些条件并允许通过\
