- md: "\n## 8.6 Promises, Promises: Function Prototypes\n\nAt some point you may start\
    \ writing programs that are very complicated, using multiple source files for\
    \ a single program (although it's not covered in this book). In such cases it\
    \ is common practice for C++ programmers to write main above all other functions,\
    \ instead of putting it last as we have just learned to do. This practice requires\
    \ the use of “function prototypes”, which are actually nothing more than promises\
    \ to the compiler that you will write a function definition after the compiler\
    \ sees a reference to the function. Here's a rewrite of the password program,\
    \ using the more common practice of main on top with prototypes:\n\n```cpp\n#include\
    \ <iostream>\n#include <string>\nusing namespace std;\n\nvoid getPassword();\n\
    \nint main()\n{\n    getPassword();\n    // do stuff...\n} // main\n\nvoid getPassword()\n\
    {\n    while (true)\n    {\n        string password;\n        cout << \"Enter\
    \ the password: \";\n        getline(cin, password);\n\n        if (password ==\
    \ \"12345\") break;\n        cout << \"INVALID. \";\n    } // while\n} // getPassword\n\
    ```\n\nThe prototype is the function’s *header*, with a semicolon at the end.\n\
    It tells the compiler “if you see a reference to a function named getPassword\
    \ with an empty parameter list, don’t worry because I will define that function\
    \ later.” Prototypes go where the function definitions would have gone.\n\n##\
    \ 8.7 Exercises, Sample Code, Videos, And Addendums\n\nGo to www.rdb3.com/cpp/8\
    \ for extended materials pertaining to this chapter.\n\n## Chapter 9. Counting\
    \ On Your Fingers: Bits And Bytes\n\nWhat you need to know about computer memory\
    \ is how numbers and text are stored, which will help you understand why numbers\
    \ and text are treated separately in programming. You also need to understand\
    \ why there is a distinction between whole numbers and floating point numbers,\
    \ and to know that there are range limits for numbers and that there is a precision\
    \ issue with floating point variables.\n\nWe know that computers can store values,\
    \ including numbers and text – even audio and video. But just how do they do that,\
    \ anyway? This chapter explains how computers store values, and in doing so, why\
    \ computers make the distinction between whole numbers and floating point numbers.\
    \ And in case you've been thinking about double data type and why we should ever\
    \ use int, this chapter will help you see the value of int.\n\nYou will also learn\
    \ that there are other data types for whole numbers besides int, and why floating\
    \ point numbers can be either float or double. It has all to do with range and\
    \ precision – something you might not have expected of a computer. Aren’t computers\
    \ supposed to be “accurate”? Well, it turns out that there are limitations, and\
    \ all programmers need to be aware of these.\n\n### 9.1 Computer Memory: Vast\
    \ Arrays Of On/Off Switches\n\nIf you study the “memory” of a computer – what’s\
    \ inside those SD cards, memory sticks, and DDRs – you will find that they consist\
    \ of millions or billions of electronic on/off switches. That’s it – nothing more\
    \ than on/off switches. Each switch can store one of two possible values – off\
    \ or on – zero or one.\n\nPROGRAMMING CONCEPTS in C++\n\nA switch is called a\
    \ bit, and it is made out of several electrical components — resistors and transistors\
    \ combined in a circuit. By applying an electrical pulse to the circuit that comprises\
    \ one bit, it can be placed into one of two possible states, which represent \"\
    on\" and \"off\".\n\nSo how can a computer store a number, which has more than\
    \ two possible values? Well, remember when you learned to count on your fingers?\
    \ Each finger can be held up or down to represent or or off. By combining all\
    \ ten fingers of both hands, you could group fingers in various ways to represent\
    \ numbers in the range of 0 to 10. Computers do something like this.\n\n#### 9.1.1\
    \ Bits And Counting\n\nComputers group bits together in order to get past the\
    \ zero-one range limitation. Just like our hands group our fingers in sets of\
    \ five, computers (typically) group bits in sets of eight – a set of 8 bits is\
    \ called a byte.\n\nOn the fingers of one hand you learned to count from zero\
    \ to five, and so you might think that a byte can be used to count from zero to\
    \ eight. But computer designers realized that we were not using our 5 fingers\
    \ very efficiently. Consider this: there are multiple ways to represent the number\
    \ two, depending on which two fingers you hold up or down represent a different\
    \ number? What if every possible combination of fingers held up or down represented\
    \ a different number? There are 32 (that is, 2 x 2 x 2 x 2 x 2) unique combinations,\
    \ ranging from all fingers down to all fingers up. We could actually count from\
    \ 0 to 31 on the fingers of one hand if we assigned a unique number to each unique\
    \ finger configuration. (Pinky-up could be 1, ring-finger-up could be 2, pinky-up\
    \ and index-finger-up could be 9, etc.) Extend this idea to two hands, and we\
    \ can count over 1000 – now that's efficiency!\n\nHere's how to do this: assign\
    \ the value 1 to your pinky, 2 to your ring finger, 4 to your middle finger, 8\
    \ to your index finger, and 16 to your thumb. (The key is to start with 1 and\
    \ double it each time). For any finger held up, add its value to the total. For\
    \ example, pinky and ring finger both up is 3 (that is, 1 + 2).\n\n#### 9.1.2\
    \ Bits And Negative\n\nSo how can a computer store a number, which has more than\
    \ two possible values? Well, remember when you learned to count on your fingers?\
    \ Each finger can be held up or down to represent or or off. By combining all\
    \ ten fingers of both hands, you could group fingers in various ways to represent\
    \ numbers in the range of 0 to 10. Computers do something like this.\n\nWhole\
    \ numbers that exceed the maximum limit wrap to the lower limit. Similarly, values\
    \ that would be below the minimum limit wrap to the upper. (Note that comes are\
    \ not allowed in whole numbers!)\n\n#### 9.1.3 To Infinity And Beyond\n\nRemember\
    \ when you first learned the concept of infinity? You can always add 1 to a number\
    \ and get the next. No matter how many bytes they use, they eventually reach a\
    \ limit.\n\nPROGRAMMING CONCEPTS in C++\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\n\nint main() {\n    // 2 less than the maximum\n    int a =\
    \ 2147483645;\n\n    for (int i = 0; i < 5; i++) {\n        a++;\n        cout\
    \ << a << endl;\n    }\n} // main\n```\n\n#### 9.1.4 Range Limitations For Whole\
    \ Data Types\n\nData type names in C++ can consist of more than one word, indicating\
    \ the number of bytes used, and whether or not the negative range is allowed.\
    \ There are multiple whole number data types – they vary in the number of bytes\
    \ used for a variable.\n\n| Data Type | Memory Used | Range Of Possible Values\
    \ |\n|---|---|---|\n| short int | 2 bytes | -32,768 to 32,767 |\n| int | 4 bytes\
    \ | -2,147,483,648 to 2,147,483,647 |\n| long int | 4 bytes | -2,147,483,648 to\
    \ 2,147,483,647 |\n| long long | 8 bytes | -9,223,372,036,854,775,808 to 9,223,372,036,854,775,807\
    \ |\n| unsigned short int | 2 bytes | 0 to 65,535 |\n| unsigned int | 4 bytes\
    \ | 0 to 4,294,967,295 |\n| unsigned long int | 4 bytes | 0 to 4,294,967,295 |\n\
    | unsigned long long | 8 bytes | 0 to 18,446,744,073,709,551,615 |\n"
  mdcn: "\n\n## 8.6 承诺：函数原型声明（Function Prototypes）\n\n在某个时刻，你可能会开始编写非常复杂的程序，为同一个程序使用多个源文件（尽管本书没有涵盖这部分）。在这种情况下，C++\
    \ 程序员的常见做法是将 `main` 函数写在所有函数上方，而不是像我们刚刚学到的那样样把它放在最后。这种做法要求使用“函数原型声明”，它们实际上只是对编译器的一种承诺，承诺在编译器看到对该函数的引用之后，你将会编写该函数的定义。这里是密码程序的重写，使用了更常见的将\
    \ `main` 置于顶部并配合声明的做法：\n\n```cpp\n#include <iostream>\n#include <string>\nusing\
    \ namespace std;\n\nvoid getPassword();\n\nint main()\n{\n    getPassword();\n\
    \    // do stuff...\n} // main\n\nvoid getPassword()\n{\n    while (true)\n  \
