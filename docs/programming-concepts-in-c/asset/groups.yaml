  - '[PAGE 247]


    Programming Concepts in C++ is one in a series of books that introduce the basic
    concepts of computer programming, using a selected programming language. Other
    books in the series use languages like Java and Python, but all focus on concepts
    and not on any particular language.


    The presentation of the material is the same in each language, and much of the
    text is identical. Code samples are specific to the selected language, and some
    unique language features are unavoidably included, but the presentation is largely
    language-independent.


    A unique feature of the book is that it explains how to acquire, install, and
    use freely available software to edit, compile, and run console programs on just
    about any system, including Windows and Mac. Its examples use command line compiling,
    so that the presentation remains focused on programming concepts and avoids becoming
    a training tool for a specific IDE.


    The three-part organization of material starts with the basics of sequential processing,
    then adds branching and looping logic and subprograms, and ends with arrays and
    objects. It turns a beginner with no programming experience into a programmer,
    prepared to continue their training in C++ or just about any other specific programming
    language.


    ![](img/80b9ed561fa57ed72adb64b305ef946d_247_0.png)


    Robert Burns is a professor of Computer Science at Diablo Valley College in Pleasant
    Hill, California, where he teaches first and second year computer programming
    students, preparing them for further study in computer science, computer engineering,
    and related fields.


    Professor Burns designed the Programming Concepts series for first year programming
    students at the college.


    In addition to teaching, Professor Burns is a contract programmer and web programmer
    with continuous experience dating back to the 1970s.


