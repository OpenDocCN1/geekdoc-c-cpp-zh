    # 3.3.2 Complex Expressions


    Math operations in computer languages involve 2 values. But we often have to solve
    problems with more than 2 values, such as the average of 3 numbers. So how is
    that done using programming languages? First realize that the averaging of 3 numbers
    is really a series of 2-value operations. Add the first and second numbers together.
    Add the third number. Finally, divide by three. Calculators work this way – do
    an operation with 2 numbers, then use that as the first number in the next 2-value
    operation, and so on. Multiple-step calculations can be done by breaking them
    into steps involving only two values. So we can write this in a series of statements,
    or we can use complex expressions to let us combine a series of 2-value expressions
    into a single statement. Here are three ways to find the average of 3 numbers:'
  - '[PAGE 55]


    ![](img/80b9ed561fa57ed72adb64b305ef946d_55_0.png)


    In the simple expressions solution, note the statement `averageAge = averageAge
    + age3;`. This is a kind of assignment statement will `overwrite` an existing
    value with a new value. Remember that data stored in memory can be replaced when
    it is no longer needed.


    The parentheses (in the solution with complex expressions) enclose and isolate
    one 2-value operation, so that it can be completed and the rest substituted into
    the remaining expression. So `((age1 + age2) + age3) / 3` resolves to `((19 +
    21) + age3) / 3` resolves to `(40 + 30) / 3` resolves to `70 / 3`, etc.


    Actually it is acceptable to write this as `(age1 + age2 + age3) / 3.`, because
    computer languages treat multiple successive additions as though they were paired
    in parentheses. But it''s *not* okay to write it as `age1 + age2 + age3 / 3.`,
    because that mixes addition and multiplication. In such cases, the multiplications
    (and divisions) are done first in the order they appear, left to right. Then the
    additions (or subtractions) are done. So `age3 / 3` would be evaluated first,
    then `age1 + age2`, etc.


