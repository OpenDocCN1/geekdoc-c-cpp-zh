    \ s + \" receive one of prizes!\";\n}\n```\n\n上面的程序并没有产生输出，它只是构建了一个文本值。为了让程序产生输出，我们需要引入“输出语句”，然后我们需要输入一个“运行”语句来实际“执行”程序。\n\
    \n## 3.3.4 注意避免使用未初始化的变量\n\n学者经常犯的一个常见错误是——在使用变量之前没有对其初始化。这个问题通常出现在程序员期望新声明的变量被设置为零时。在某些编译器中，它们确实被设置为零！这样的编译器并没有对程序员产生任何好处，因为它们奖励了错误的行为——它们强化了变量默认初始化的错误想法。这一点再强调也不为过——它们并不是所有情况下都会设置为零。\n\
    \n所以问题出在——程序员在一个系统上编写代码，编译并运行，它是可以的，因为该系统的编译器将未初始化的变量设置为零。然后相同的源代码被用于另一个系统，程序不再工作了！\n\
    \n唯一不适用这种情况的情况是任何 `string` 类型的任意长度文本变量，如果没有赋值，它们会自动初始化为空。\n\n## 3.4 输出\n\n到为止我们已经存储数据、执行计算并处理文本。但如果没有输出语句，程序就会把这一切都留给自己！本节将解释如何在控制屏幕上显示输出。\n\
    \nC++ 输出语句是 `cout ...;`，其中任何表达式、变量或数字都可以替换 `...`。事实证明 cout 是 C++ 中的一个“对象”，这是我们遇到的第一个对象。它的读音是“see\
    \ out”。要跳到下一行，使用语句 `cout << endl;`。那是“end-of-el”，而不是“end-one”。\n\n实际上，“cout”语句可以连接，所以你可以像这样做：\n\
    \n```cpp\ncout << \"My name is \" << name << endl;\n```\n\n"
