    \ GOODBYE 都会被发送到输出——只有一种情况。\n\n## 6.2 比较运算符\n\n在 `==` 之后，有些运算符是常用的。逻辑决策点允许程序流可以继续顺序执行或跳转到其他地方，这就是“逻辑”——类似于“如果此条件存在，则执行某些操作——否则跳过该操作”。\n\
    \n## 更多分支逻辑 [Rumpelstiltkin.cpp]\n\n（此处代码块已按要求不翻译）\n\n## 6.2 比较运算符\n\n在 `==` 之后，有些运算符是常用的。逻辑决策点允许程序流可以继续顺序执行或跳转到其他地方，这就是“逻辑”——类似于“如果此条件存在，则执行某些操作——否则跳过该操作”。\n\
    \n这里是某些逻辑运算符的示例：\n\n| 运算符 | 描述 |\n| :--- | :--- |\n| `x < 10` | 测试 x 是否小于 10 |\n\
    | `s == \"Hello\"` | 测试 s 是否等于 \"Hello\" |\n| `a != b` | 测试 a 是否不等于 b |\n| `grade\
