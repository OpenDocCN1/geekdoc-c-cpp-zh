- md: '

    A peculiarity of C++ is that the “long” modifier on the data type name appears
    to have no effect. That is because the number of bytes varies among compilers
    and operating systems for the same data type, and all that C++ requires is a “long”
    int at least as big as a regular int. Here''s how to find out many bytes are used
    by your compiler for any specific data type: `cout << sizeof(int) << endl;` for
    example.


    So we can represent whole numbers in computer memory, even though they are range-limited
    and have no concept of infinity. But what about fractions?


    ## 9.2 Floating Point Numbers


    The use of bytes to represent numbers does not address fractional values. There''s
    a 1 and a 2, but what about 1½? What about 3.14159265? A solution is to modify
    the bit-counting approach so that instead of representing whole numbers, we represent
    fractional values instead. That is, the pinky''s value is ½, ring finger is 1,
    index finger is 2, etc. – or we start with ¼ or less for the pinky. This is almost
    what the computer does, and for this to work, there needs to be a second set of
    data types – whose first bit is a fraction instead of 1. (Actually, the value
    of the first bit varies, depending on the size of the value being stored – for
    example, why we stop at ¼ if the number stored is only 10)?


    | Floating Point Numbers (Typical 32-Bit And 64-Bit C++ Compilers) |

    | Data Type | Memory Used | Range Of Possible Values | Precision (Digits) |

    | :--- | :--- | :--- | :--- |

    | float | 4 bytes | approx. -10³ to -10³, 0, and 10³ to 10³ | 6 or 7 |

    | double | 8 bytes | approx. -10⁹ to -10⁹, 0, and 10⁹ to 10⁹ | 15 or 16 |

    | long double | 12 bytes | approx. -10³⁰ to -10³⁰, 0, and 10³⁰ to 10³⁰ | 17 or
    18 |


    Here’s the important thing about floating point numbers – it’s the last column
    in the table above – precision. If computers are so accurate, why are we talking
    about precision? Consider the case where the pinky value is ½. We can only represent
    values to the nearest half. And even though the first bit in a floating point
    representation is effectively a bit smaller than ½, the problem remains – there
    is no continuum of numbers on the computer’s number line! So if we divide our
    hand-held number of 1½ by two, we get 3/4 – but we cannot divide numbers finely
    enough to show the 1/4 value – we have ½ and 1, and that’s as close as we can
    get to 3/4. We end up rounding off the true number to one that is as close as
    we can get in computer’s numbering system. Try the following code block for yourself:


    ```cpp

    // try this in C++

    out.setf(ios::fixed|ios::showpoint);

    out << setprecision(20) << endl;

    double x = 3;

    cout << x << endl;

    cout << (x + 0.0000000000000001) << endl;

    cout << (x + 0.0000000000000002) << endl;

    ```


    If you write the above code block into a program you should see that the first
    two console output statements yield the same result, even though the second one
    adds a small amount to the variable. But the third output statement *does* show
    an effect on the variable. This is because the small amount added in the second
    output statement is below the *precision* range for the data type double. But
    the small amount added in the third output statement is just inside the precision
    range, so it shows up.


    Precision is an issue for floating point numbers, but not for whole numbers. That
    is why we need separate data types for both – so we can choose the precision of
    whole numbers at the expense of fractional capabilities, or choose the fractional
    capabilities of floating points at the expense of precision. It’s an age-old result
    of the way computers work, and is *not* particular to C++ – it’s due to the fact
    that computers count their “fingers”.


    ## 9.2.1 Output Precision vs Floating Point Precision


    Wait a minute – we were able to specify the precision for `setprecision(20)` in
    the last example as well! Shouldn''t that give the programmer some control over
    this issue of precision? Well, obviously not, judging by the results of the example!
    It turns out that `setprecision(20)` simply directs that the output displayed
    with the number of decimal digits specified. If the number is stored with less
    precision than asked for in the output, the computer “makes up” the digits that
    it does not know exactly! (It’s better than generating an error and terminating
    the program at that point).


    Try this – each loop should perform 10 cycles. But one of them actually goes on
    forever!


    | More Round-Off Error | This Stops When It Should. | This Does Not! |

    | :--- | :--- | :--- |

    | double x; for (x = 0; x != 2.5; x += 0.25) cout << x << x << endl; | double
    x; for (x = 0; x != 1; x += 0.25) cout << x << x << endl; |


    ## 9.3 Representing Characters


    The use of bytes to represent numbers does not address fractional values. There''s
    a 1 and a 2, but what about 1½? What about 3.14159265? A solution is to modify
    the bit-counting approach so that instead of representing whole numbers, we represent
    fractional values instead. That is, the pinky''s value is ½, ring finger is 1,
    index finger is 2, etc. – or we start with ¼ or less for the pinky.

