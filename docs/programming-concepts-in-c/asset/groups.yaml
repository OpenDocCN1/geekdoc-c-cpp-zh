- md: "\n# ROBERT BURNS\n\nThe symbol that joins two (or more) simple logical expressions\
    \ with or-logic is ||. (This is not commonly typed symbol outside of programming\
    \ – it’s usually the SHIFT-BACKSLASH keystroke.) Note the single spaces surrounding\
    \ the symbol – they are not required, but are for readability. Also note that\
    \ there is repetition in the statement – grade is typed three times. You do not\
    \ say “if the grade is A or B or C” in code. You say, “if the grade is A or the\
    \ grade is B or the grade is C” instead.\n\nAgain, computers do not always need\
    \ to evaluate all of the simple logical expressions in or-logic. For example,\
    \ if the grade is A, the “grade is A” part is true, so there is no point in checking\
    \ if the “grade is B” or if the “grade is C”.\n\n## 6.2.3 This And That Or Something\
    \ Else\n\nBe careful – it is possible to join simple logical expressions with\
    \ && and all in the same if-statement. But this is usually a good idea, because\
    \ the exact meaning of the logic can be confusing. It has to do with the order\
    \ in which operations are evaluated, left to right. For example, don’t use score\
    \ >= 0 && score < 80 || score >= 90 && score <= 100 to test for scores that are\
    \ not B. But you can force the order of evaluation of the logical expressions\
    \ using parentheses like: (score >= 0 && score < 80) || (score >= 90 && score\
    \ <= 100)! Inside an if-statement, it would look like this – note the “nested”\
    \ parentheses: if ((score >= 0 && score < 80) || (score >= 90 && score <= 100)).\n\
    \nAlso note that the variable that appears multiple times in complex logical expressions\
    \ does not have to be the same variable in each of the simple logical expressions.\
    \ You can do this, for example: score > 86 && grade == 'B' to test for a high\
    \ B.\n\n## 6.2.4 Handling “Case”\n\nWhat if the prompt for grade tells the user\
    \ to enter an uppercase letter grade, but the user types a lowercase letter instead?\
    \ After all, the letters are shown in uppercase on console keyboard keys! Rather\
    \ than recognize “a” as “A”, you can do one of two things:\n\n# PROGRAMMING CONCEPTS\
    \ IN C++\n\ncheck for either case, or temporarily convert case before checking\
    \ the value. For example:\n\n```\ngrade = 'A' || grade == 'a' or toupper(grade)\
    \ == 'A'\n```\n\n## 6.3 True/False If-Statements\n\nOften it is convenient to\
    \ use logic to switch between two possible code blocks – one if a comparison is\
    \ true, and another if it's false. This is possible using two different if-statements\
    \ with opposite comparison expressions in their parentheses, but an easier way\
    \ is to append else clause to the end of the if-statement, thereby applying “if-else\
    \ logic”. Here's an example:\n\n```\nthe algorithm for if-else logic:\nread a\
    \ grade from the keyboard as a single letter\nif the grade is uppercase A, B,\
    \ or C\noutput \"you pass\"\nelse\noutput \"you don't pass\"\n```\n\n![](img/80b9ed561fa57ed72adb64b305ef946d_86_0.png)\n\
    \nThe else is followed by another output statement to be used if the expression\
    \ in the if-statement’s parentheses evaluates to false. Note that else cannot\
    \ be used in C++ unless it follows an if-statement.\n\n## 6.4 Curly-Brace Containers\n\
    \nUp to now, the if-statements we’ve considered have all been associated with\
    \ single output statements. That is, if the expression in the if-statement’s parentheses\
    \ evaluates to true, then execute the following indented statement. But what if\
    \ you want to execute more than one statement? You could try adding them and indenting\
    \ them, too, but that does not work in C++ like you'd expect. Only the first statement,\
    \ indented or not, belongs to the if-statement. All the others are treated as\
    \ if they were not indented at all.\n\nTo include multiple lines, put them in\
    \ a curly-brace container and put that right below the if-statement (or below\
    \ the else) instead of one indented statement. It’s still a good idea to indent\
    \ all the statements inside the container anyway, but only because it’s easier\
