    ### 3.2.4 Assignment Statements

    To change a value of a variable''s declaration, use a statement like age = 21;
    leaving off the data type specification. This is known as an "assignment statement",
    and it can only be used after age is declared. Remember sequential processing?
    It is okay to reassign values to variables as often you like, whether or not they
    were initialized upon declaration. But you can declare a variable only once, because
    of the uniqueness requirement for identifiers (that is, variable names). Here
    are some other examples of assignment statements:


    | age = 30; | "age" must have already been declared in a preceding statement |

    | temperature = 99.7; | this works fine if "temperature" was already declared
