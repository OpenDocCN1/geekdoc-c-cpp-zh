    # 15.2.1 Simple Example: Countdown


    This ridiculously easy example demonstrates the sequence for developing a recursive
    solution. The problem is NASA has hired you to write a countdown program, starting
    from any nonnegative whole number and ending at zero. (NASA uses this kind of
    thing a lot, and they want to automate it!) You first consider using an iterative
    solution, but you soon conclude that it is just too difficult (work with me here...).
    So you next consider using a recursive solution instead.


    The problem, then, and is: count down from the `int` variable n. First, write
    the part you know how to do: say the number stored in `n`. Then write the part
    you don''t know how to do: count down from `n` minus one. For example, if `n`
    is “10”, the recursive solution is to say “10”, and then count down from “9”.
    If you wrote a function to do this, and the number to count down from is in the
    parameter list, the body of the function from the parameter list, and then call
    a function that knows how to count down from value minus one. And here''s the
    tricky part – the function we would call to do that is the function we are currently
    writing! Seems a bit like the chicken-and-the-egg dilemma, doesn''t it.


    The only problem that remains is to identify a “base case”, and use that in a
    logic statement to stop the recursion. The base case is this: if we were asked
    to count down from zero, it would be easy – just say “0”! In that case, if the
    value of the variable in the parameter list is zero, no additional call needs
    to be made.


    Here is the full solution (which you are free to copy, modify, and share with
    NASA – you’re welcome):'
