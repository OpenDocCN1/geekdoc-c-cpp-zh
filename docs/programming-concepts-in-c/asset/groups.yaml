    \ to cross!\" << endl;\n} // main\n```\n\nIn the sample above, note that we don’t\
    \ check for input “Y” or “y”. What’s going on is this: “Y” is considered yes –\
    \ anything else is considered no. To avoid confusion, it might be better to not\
    \ accept answers other than “Y” or “N”. That’s what validation loops are for.\
    \ \n\n## 6.7.4 Validation Loops\n\nValidation loops are used with console input\
