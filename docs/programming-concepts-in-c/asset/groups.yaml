- md: "\nHere’s another example of a validation loop:\n\n![](img/80b9ed561fa57ed72adb64b305ef946d_98_0.png)\n\
    \nNote the `continue;` statement introduced above. This causes the loop to end\
    \ the current cycle at that point and go directly to the next cycle, thus skipping\
    \ the “Let’s try this again...” prompt in case a user just presses ENTER without\
    \ typing anything else. There’s really no good reason for doing so, other than\
    \ the opportunity this presents to show how `continue;` works.\n\n## 6.8 Classic\
    \ Computer Science Solutions That Use Logic\n\nTwo classic problems are finding\
    \ the lowest (or highest) from a set of values, and sorting a set of value from\
    \ lowest to highest (or the reverse). The solutions involve if-statements. They\
    \ also involve techniques that will be covered in chapters 8 and 11, while we\
    \ cannot develop full solutions here, we can at least show the logical parts of\
    \ the solutions.\n\n### 6.8.1 Classic Min/Max Logic\n\nA classic problem in computer\
    \ science is finding the minimum and/or maximum values from multiple values. For\
