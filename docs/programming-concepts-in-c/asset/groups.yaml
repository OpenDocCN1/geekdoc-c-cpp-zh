    # 3.2.1 Identifiers


    Variables have names, or “identifiers”. On paper, people might write labels or
    other descriptions by the values they write, so they remember what the values
    mean. Computers use “identifiers” to do the same thing. By referring to the name
    of a variable in a computer program, its associated data can be stored or retrieved.
    The memory used by variables is typically recyclable – that is, you can store
    a new value in a variable (after you are finished with the old value, course).
    Similarly, people can cross out or erase previously written values and write new
    ones, like keeping score of a ball game.


    Variable names are chosen by the programmer, who can select just about anything.
    But there are some rules: the name must consist of one or more lowercase letters,
    uppercase letters, digits, and/or underscore symbols – no spaces are allowed!
    Also, the name may not begin with a digit, and it cannot be the same as one of
    the hundred or so words used in the language (called “keywords”), such as “if”
    and “while”. For example, age could be used for a variable that stores a person’s
    age.


    Besides the rules, there are some conventions which most programmers follow: variables
    usually begin with a lowercase letter. Also, identifiers consisting of more than
    one word, since they cannot be separated by spaces, are run together with the
    first character in each word after the first being uppercase. For example, firstName
    could be used for a variable that stores a person’s first name.'
