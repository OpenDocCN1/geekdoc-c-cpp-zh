    # PROGRAMMING CONCEPTS in C++


    The number of variables that a programmer can use in a program is basically limited
    by the amount of memory in the computer. For today’s desktop computers, notebooks,
    tablets, and smart phones, it is practically unlimited.


    ## 3.2.2 Declaration Statements


    So for each item of data to be stored, there needs to be a variable. To create
    a variable in a C++ program, you have to specify two things: a unique identifier
    for the variable, and the *type of data to store* in the variable. This specification
    must be made as a *statement*, and it is called a “declaration statement”. To
    reserve memory to store a numeric value in a variable named “age”, it looks something
    like this:


    ```cpp

    int age;

    ```


    ![](img/80b9ed561fa57ed72adb64b305ef946d_48_0.png)


    Representation in code  Conceptual representation


    Note the semicolon at the end of the statement. Statements usually end in a semicolon.


    You probably expected the part about a declaration statement involving a variable
    name. But there is another part of the declaration statement that you should have
    seen coming as a result of the discussion about values – specification of the
    *data type*. That is, the computer needs to be told what kind of data will be
    stored in the variable being declared, so that it can reserve memory accordingly.
    This is a requirement of the C++ computer language – Java, too. If you programmed
    in Python or Javascript before, this was **not** a requirement of these languages.
    So that’s what the “int” is doing in the above declaration statement.


    “int” is a *keyword* in C++. It means “integer”, which is a whole number, positive
    or negative. Integers have no fractional parts to them. Negative values have a
    minus prepended to them, but positive numbers do *not* have plus signs – numbers
    are positive unless otherwise specified. Another numeric *data type* includes
    “double” for double-precision numbers (with possible fractional parts). There
    are also data types for text: "char" for single-character text and "string" for
    longer (or shorter!) text. "char" is pronounced like the word "care", as the first
    syllable in the word "character".


    | Some Data Types In C++ |

    | :--- | : |

    | int | for storing whole numbers, 12 or 0 or -99 |

    | double | for storing floating point numbers, 1.534 or 100.0 |

    | char | for storing 1-character text, such as ''z'' or ''w'' (true or false),
    or ''a'', ''b'',... (grades), or digits ''0'', ''1'',..., punctuation symbols
    '';'' |

    | string | for storing text of any length, such as... (requires include <string>
    and using namespace std; at the top of the code) |


    Actually, most programming textbooks use the keyword "float" for single-precision
    numbers, instead of "double" as is used here. The reason for using "double" instead
    of "float" is that it is more directly compatible with the math "library", which
    we will learn about in chapter 4.


    So to declare a variable for text you, you could use a statement like `string
    firstName`. Declarations cannot be put just anywhere in the code – they need to
    be placed after the { that immediately follows the line with the word "main",
    and before its matching } – that is, inside main''s curly-brace container.


