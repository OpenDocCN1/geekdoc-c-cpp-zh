    \ so it is necessary to use the ampersand to get this\nsame functionality. Of\
    \ course, we don’t always want our functions\nto change data fields in an object,\
    \ but the efficiency reason is\nreason enough to pass by reference. The following\
    \ example has\nan object with three ints, representing the time-of-day. It has\n\
    a void function to output a variable of type tod in a nicely\nformatted way.\n\
    \n# Time Objects [todTest.cpp]\n\n```cpp\n#include <iomanip>\n#include <iostream>\n\
