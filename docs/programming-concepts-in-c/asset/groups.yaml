    # # Chapter 5. Interactive Programs: Console I/O


    Input can be gathered from a variety of sources. In chapters 3 and 4 we specified
    input values directly in the program source code. That worked fine, but if we
    wanted to use different input, such as changing the number of years in the amortization
    calculation, the program had to be edited and recompiled. That is certainly not
    the kind of program that you could distribute for non-programmers to use!


    It would be nice if the program *prompt* (or ask) the user to type input values
    on the keyboard, and transfer those values into the variables in the program.
    Then we could develop and compile the program only once, and it could be applied
    to a virtually unlimited range of input values.


    This is what *interactive* programs do. They are designed for a certain amount
    of interaction to take place between the user and the program. This interaction
    transfers data values into variables, *after* the program has been written and
    compiled!


    # ## 5.1 Capturing Values From The Keyboard


    Capturing input from the keyboard involves three steps, which have to be represented
    in code:


    | 3 Steps For Keyboard Input |

    | 1. Declare a variable in the computer''s memory to store the input value.

    | 2. Prompt the user to type an input value and press the ENTER key.

    | 3. Transfer the keyboard entry into the variable declared for this use. |'
