    它告诉编译器：“如果你看到一个名为 getPassword 且参数列表为空的函数引用，不要担心，因为我稍会定义该函数。”原型声明放置在原本函数定义所在的位置。\n\
    \n## 8.7 练习、示例代码、视频及附录\n\n访问 www.rdb3.com/cpp/8 获取与本章相关的扩展材料。\n\n## 第 9 章 手指计数：位与字节（Bits\
    \ And Bytes）\n\n关于计算机内存，你需要了解的是数字和文本是如何存储的，这将帮助你理解为什么在编程中数字和文本是分开处理的。你还需要理解为什么整数和浮点数之间存在区别，并知道数字存在范围限制以及浮点变量存在精度问题。\n\
    \n我们知道计算机可以存储值，包括数字和文本——甚至是音频和视频。但它们究竟是如何做到的？本章解释了计算机如何存储值，并在此解释了为什么计算机要在整数和浮点数之间进行区分。如果你一直在思考\
    \ `double` 数据类型以及我们为什么应该使用 `int`，本章将帮助你看到 `int` 的价值。\n\n你还将学到除了 `int` 之外还有其他整数数据类型，以及为什么浮点数可以是\
    \ `float` 或 `double`。这都与范围和精度有关——这可能是你对计算机之外的预期。计算机难道不应该是“准确”的吗？事实证明是存在局限性的，所有的程序员都需要意识到这些限制。\n\
    \n### 9.1 计算机内存：海量的开关数组\n\n如果你研究计算机的“内存”——那些 SD 卡、内存条和 DDR 内部构造——你会发现它们由数百万或数十亿个电子开关组成。仅此而已——无非是开关。每个开关可以存储两个可能值之一——关闭或开启——0\
    \ 或 1。\n\nC++ 编程概念\n\n一个开关被称为一个“位”（bit），它由几个电气元件组成——即在电路中组合的电阻器和晶体管。通过向组成一个位的电路施加电脉冲，可以使其处于两种可能状态之一，代表“开启”和“关闭”。\n\
    \n那么计算机如何存储一个具有超过两个可能值的数字呢？好，记得你学习用手指计数吗？每根手指都可以竖起或放下，表示开启或关闭。通过结合双手的十根手指，你可以用各种方式组合手指来表示\
    \ 0 到 10 之间的数字。计算机就是这样做的。\n\n#### 9.1.1 位与计数\n\n计算机将位组合在一起，以突破零和一的范围限制。就像我们的手将手指分成五一组一样，计算机（通常）将位每八位一组——一组\
    \ 8 位被称为一个“字节”（byte）。\n\n在一只手上，你学了如何从 0 数到 5，所以你可能认为一个字节可以用来从 0 数到 8。但计算机设计者意识到，我们使用这\
    \ 5 根手指并不高效。考虑一下：表示数字二有多种方法，取决于你竖起或放下哪两个手指代表不同的数字？如果每种可能手指竖起放下组合都代表一个不同的数字呢？共有\
    \ 32 种（即 2 x 2 x 2 x 2 x 2）独特组合，范围从所有手指放下到所有手指竖起。如果我们为每种独特手指配置分配一个唯一的数字，我们实际上可以在单只手上从\
    \ 0 数到 31。（小指竖起可以是 1，无名指竖起可以是 2，小指和食指都竖起可以是 9，以此类推。）将这个主意扩展到双手，我们可以数到 1000 多——这才叫效率！\n\
    \n做法如下：给你的小指分配值 1，无名指 2，中指 4，食指 8，大拇指 16。（关键是从 1 开始并每次倍倍）。对于任何竖起的手指，将其值加到总和中。例如，小指和无名指都竖起就是\
    \ 3（即 1 + 2）。\n\n#### 9.1.2 位与负数\n\n那么计算机如何存储一个具有超过两个可能值的数字呢？好，记得你用手指计数吗？每根手指都可以竖起或放下，表示开启或关闭。通过结合双手的十根手指，你可以用各种方式表示\
    \ 0 到 范围内的数字。计算机就是这样做。\n\n超过最大值的整数会回绕到最小值。同样，低于最小的值会回绕到最大值。（注意整数是不允许负的！）\n\n####\
    \ 9.1.3 直到无穷\n\n记得你第一次学习无限的概念吗？你总是可以给一个数字加 1 得到下一个。无论它们使用多少字节，最终都会达到一个限制。\n\n\
    C++ 编程概念\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main() {\n\
    \    // 比最大值少 2\n    int a = 2147483645;\n\n    for (int i = 0; i < 5; i++) {\n\
    \        a++;\n        cout << a << endl;\n    }\n} // main\n```\n\n#### 9.1.4\
    \ 整数类型的范围限制\n\nC++ 中的数据类型名称由多个单词组成，表示使用的字节数以及是否允许负范围。有多种整数数据类型——它们变量使用的字节数各异。\n\
    \n| 数据类型 | 内存占用 | 可能值范围 |\n|---|---|---|\n| short int | 2 字节 | -32,768 到 32,767\
    \ |\n| int | 4 字节 | -2,147,483,648 到 2,147,483,647 |\n| long int | 4 字节 | -2,147,483,648\
    \ 到 2,147,483,647 |\n| long long | 8 字节 | -9,223,372,036,854,775,808 到 9,223,372,036,854,775,807\
