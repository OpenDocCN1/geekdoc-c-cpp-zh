    ## 第1章 编程概念


    程序员以“计算机程序”的形式向计算机发出指令。Internet Explorer、Firefox、Word、愤怒的小鸟、TurboTax、AutoCAD 等都是计算机程序。它们由程序员开发，并供他人使用，将他们打字、触摸、口说、点击和粘贴的输入转换为某些有用或娱乐的输出格式。程序员实际创建计算机程序的活动被称为“编程”。


    编程涉及三个主要步骤：(1) 理解要解决的问题，(2) 使用人类易读的计算机语言编写计算机“代码”，(3) 将代码翻译成计算机可读的形式（如你在科幻电影中看到的
    0 和 1）。第一步是人类智能发挥的地方——在向他人（如计算机）解释某些事情之前，你必须理解它。第二步涉及使用另一个名为“编辑器”的计算机程序来用计算机语言编写，如
    Basic、C、C++、C#、Java、PHP、Python 等。最后一步涉及使用另一个名为“编译器”的计算机程序。在本书中你将学习这三步。


    ## 1.1 第一步，理解


    遗憾，学生倾向于忽略编程中的这一部分（例如“2 加 2”）。因此，我们往往直接跳到第二步，代码编辑。这在持续一段时间内可行，但最终问题会变得有些复杂（例如“计算分数的个数”）。


    ## 1.2 编辑器


    “编辑器”是程序员用来编写计算机语言的程序，如 Basic、C、C++、C#、Java、PHP、Python 等。


    使用计算机语言的词汇和语法，程序员在编辑器中输入指令。任何文本编辑器都可以，包括 Windows 事本、UNIX 或 Linux vi 以及 Apple macOS
    TextEdit。这些都是通用文本编辑器，并非专门为编程设计，但运行良好。


    编程通常有三类编辑器，下文介绍：通用文本编辑器、代码编辑器和 IDE 编辑器。


    ### 1.2.1 文本编辑器


    Word、Pages 以及其他能够“富文本格式化”的编辑器并不适合编程。它们面向页面的，并且会在它们产生的文件嵌入格式信息。虽然可以将这些编辑器配置为文本编辑，但最好避免使用。


    ### 1.2.2 代码编辑器


    代码编辑器是专门为编程创建的特殊用途文本编辑器。代码编辑器可能包含有用功能，如代码模板、行号、语法高亮。许多代码编辑器可以在网上免费下载和安装，或以合理的价格购买。流行的包括
    Notepad++、Bluefish、TextWrangler、Emacs、Crimson、jEdit、JNotePad 等。


    ### 1.2.3 IDE


    最后是那些带有强大的交互式开发环境（简称 IDE）的编辑器。昂贵且功能强大的产品如 Microsoft Visual Studio 销售给 C++ 和 C#
    程序员，Xinos JCreator 销售给 Java 程序员，还有许多竞争的产品。也有免费的 IDE，例如 Code::Blocks、Bloodshed
    Dev-C++ 和 Eclipse。这些具有一些非常实用的功能来帮助程序员，例如可视化拖放开发界面和一键编译运行。


    IDE 是所有编辑器选择中最复杂的，初学者真的应该避免它们。[此处文本似乎有重复或断裂] 使用 IDE 的入门计算机课程可能会过分关注工具本身：编程概念。因此，虽然你在跟随本书时使用任何编辑器都是可以的，但这里显示的示例使用的是
    Windows PC 记事本文本编辑器和 Apple Mac TextEdit，并已配置好编程。


