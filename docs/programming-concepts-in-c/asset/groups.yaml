    \n```cpp\nif (grade = 'A' || grade = 'B') break;\nif (grade = 'C' || grade = 'D')\
    \ break;\nif (grade = 'F' || grade = 'X' || grade = 'x') break;\n```\n"
  mdcn: "\n注意此程序中添加的微小改进——它接受大写或小写的 X 来结束循环。（这被称为“哨兵值”——它标志着一个过程的结束。）程序在结束前还会输出一条感谢信息。\n\
    \n## 6.6.1 右大括号后的注释\n\n同样请注意，在上一个程序示例中，注释标签出现在每个右大括号的末尾。随着我们对大括号容器的使用越来越多，仅仅通过查看一个右大括号就知道它的用途将变得越来越困难。如果你能很好地始终让每个大括号与与其相匹配的左大括号对齐，并对大括号内部的代码块进行缩进，那么通过滚动你的代码，总能找到大括号的匹配项。但有些程序员也喜欢像上面那样，为他们的右大括号加上标签。\n\
    \n记住，附加在任何行末后的双斜杠 `//`（即使是空行）都是告诉编译器忽略该行之后之后任何内容的指示符。你可以使用空格来输入注释，这些注释通常是为了提醒你当时在想什么！我们第一次有机会包含注释代码并用显而易见的内容掩盖它（例如\
    \ `int a; // 将 \"a\" 声明为 int`）。因此，我们谨慎地使用它们。\n\n```\nint a; // declare \"a\" as\
    \ an int\n```\n\n注释还用于在程序文件的顶端包含标识信息，包括程序员的姓名和其他标题及描述。为了节省空间并将注意力在代码上，这些内容在本书的示例代码列表中被省略了。但程序员应该始终在代码列表的顶部使用标识注释。\n\
    \n## 6.7 汇总一切：使用逻辑进行编程\n\n这里是使用 **if** 和 **while** 的一些示例。你可以复制、保存并编译它们。你可以对它们进行修改并观察它们的工作原理。请确保你理解了这些每个示例中的每一个部分。\n\
    \n## 6.7.1 另一个无限循环\n\n这是另一个带有无限循环的程序。注意，提示指示用户按 CTRL-C 停止程序。\n\n```\nAnother Infinite\
    \ Loop [tempConvert.cpp]\n#include <iostream>\n#include <iostream>\nusing namespace\
    \ std;\nint main() \n{\n    double f; // 华氏 F\n    double c; // 摄氏 C\n    cout.set(ios::fixed|ios::showpoint);\
    \ // 应用格式化（见 4.2）\n    cout << setprecision(1); // 保留到十分一位\n    while (true) {\n\
    \        cout << \"Enter temperature in degrees Celsius [CTRL-C to exit]: \";\
    \ // 见 5.1\n        cin >> c;\n        cin.ignore(1000, 10);\n        f = 9.0\
    \ / 5 * c + 32;\n        cout << \"The temperature in degrees F is \" << f <<\
    \ endl; // 见 3.4.1\n    } // while (见 6.5)\n} // main\n```\n\n在上面的示例中，变量 **c**\
    \ 和 **f** 可以在循环*内部*声明，因为它们在循环结束后、程序结束前没有被使用。它还使用了不明智的 CTRL-C 来退出循环——看看你是否能出更好的结束程序的方法！\n\
    \n## 6.7.2 测验程序\n\n下面的示例展示了一个包含一个数学题（8 + 2 = ?）的测验。它还演示了一些格式化代码，使得提示是对齐的，而不是在屏幕边缘完全对齐。\n\
    \n测验程序的算法：\n- 提示用户回答测验问题 -8 + 2\n- 从键盘读取用户的答案\n- 如果答案是 10\n- 输出“correct”（正确）\n\
    - 否则\n- 输出“incorrect”（错误）\n\n## 测验程序 [quiz.cpp]\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nint main()\n{\n    // 使用非常长的提示读取一个 int（见 5.1）\n    int\
    \ answer;\n    cout << endl << endl << endl;\n    cout << \" 8\" << endl;\n  \
    \  cout << \" +2\" << endl;\n    cout << \" --\" << endl;\n    cout << \" \";\n\
    \    cin >> answer;\n    cin.ignore(1000, 10);\n\n    cout << \" \";\n    if (answer\
    \ == 10) // 见 6.1\n        cout << \"Correct!\" << endl;\n    else // 见 6.3\n\
    \        cout << \"Very good, but a better answer is 10\" << endl;\n}\n```\n\n\
    看示例中包含四个 `endl` 的那行。它跳过了四行，仅仅是为了在控制台屏幕上留出空间。此外，注意 `endl` 不一定是 `cout` 语句中的最后一个项——它可以出现在序列中的任何位置。\n\
    \n输出语句在引号内部包含前导空格——这是为了将 \"8\" 和 \"+2\" 从控制窗口的最左边缘移开。空格的排列使得 \"+2\" 中的 \"2\" 对齐于上方的\
    \ \"8\"。同样请注意那句包含两个横线 `--` 的语句，看起来就像如果你在纸上写这道数学题时会画的那样。\n\n## 6.7.3 简单的 While-True-If-Break\
    \ 循环\n\n这里是一些使用 `if-break` 退出循环的程序。由于 `if-break` 是两个程序循环循环中的最后一个语句，它提供了一个应用 `while-true`\
    \ 循环变体的机会，称为“do-while”循环——我们将查看它。\n\n```cpp\n#include <iostream>\n#include <string>\n\
    using namespace std;\n\nint main()\n{\n    while (true)\n    {\n        string\
    \ answer;\n        cout << \"Are we yet? \";\n        getline(cin, answer);\n\n\
    \        if (answer == \"yes\") break;\n    }\n\n    cout << \"We're home!\" <<\
    \ endl;\n}\n```\n\n## 另一个循环 [TheRoad.cpp]\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\n\nint main() {\n    cout << \"Approach the.\" << endl;\n   \
    \ while (true) {\n        char answer;\n        cout << \"Is it clear? \";\n \
    \       cin >> answer;\n        cin.ignore(1000, 10);\n\n        if (answer ==\
    \ 'Y' || answer == 'y') break;\n    }\n    \n    cout << \"It's safe!\" << endl;\n\
    }\n```\n\n在上面的示例中，变量 **grade** 应该在循环*之前*声明。否则它在循环下方是不可用的！C++ 有一条规则，即在大括号内声明的变量仅在容器*内部*是可用的。\n\
    \n## 6.7.4 验证循环\n\n验证循环用于控制输入以确保用户输入有效的。这些循环在检测到无效输入后通常输出消息。这里是成绩的代码块：\n\n## PROGRAMMING\
    \ CONCEPTS IN C++\n\n809ed561fa57ed72abc64305ef94\n\n让我们学习上面的代码，因为它不仅演示了验证循环，还有一种新的变体。最重要的的一点是\
    \ **grade** 必须在验证循环**上方**声明。否则它在循环下方是不可用的！C++ 有一条规则，在大括号内声明的变量在其左侧的第一个右大括号之后就不再可用了。这被称为*作用域*（scope）。\n\
    \n```cpp\n{\n  int a;\n  ...\"a\" 在这里可用...\n  但在这里不可用\n}\n```\n\n所以解决方案是在输入并验证其值的验证语句循环*上方*声明变量。验证\
    \ if-break 语句非常长，因为它包含了许多测试。在大多数计算机语言中，非常长的行是可以的，但这很难阅读。你可以使用文本编辑器的自动换行查看长行，但这并不遵循缩进规则。因此解决方案是将行语句拆分成多行。要拆分行，只需将光标放在你想要拆分的位置并按回车。但不要在单词中间或引号文本内拆分！现在你知道为什么我们需要分号了——它标记了语句的结束，而不是行的结束。\n\
    \n当一个语句拆分为两或多行时，良好的做法是对第二行及后续行进行缩进。在上面的示例中，使用了正常的 2 空格缩进，就像在大括号容器内部或单语句 if 语句之后进行缩进一样。\n\
    \n作为替代方案，长的 if-break 可以被拆分成多个 if-break，如下：\n\n```cpp\nif (grade == 'A' || grade\
    \ == 'B') break;\nif (grade == 'C' || grade == 'D') break;\nif (grade == 'F' ||\
    \ grade == 'X' || grade == 'x') break;\n```\n\n"
