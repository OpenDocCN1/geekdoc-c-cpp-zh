  mdcn: "\n这两种 `for` 循环变体之间唯一的区别在于，当计数器像这样声明在 `for` 语句内部时，它只存在于循环内部。\n\n书中的大多数示例都使用了传统的变体：在\
    \ `for` 内部声明计数器、使用小于逻辑而非不等于逻辑，以及使用 `i++` 增增语句。大多数情况如此如此，但并非全部。\n\n## 7.3.2 变量\
    \ for 循环限制\n\n在上述的 `for` 循环中，限制是用数字表示的—— 10。这意味着循环将恰好运行 10 个周期。限制也可以用一个 `int`\
    \ 变量表示。在下一个示例中，用户通过键盘指定要输出多少个数字（从 1 开始）：\n\n```cpp\nCounting From Zero [countFromZero.cpp]\n\
    \n#include <iostream>\nusing namespace std;\n\nint main()\n{\n    int n; // 输出多少个数字\n\
    \    cout << \"How many numbers to output?\";\n    cin >> n;\n    cin.ignore(1000,\
    \ 10);\n\n    int number = 1;\n    for (int i = 0; i < n; i++)\n    {\n      \
    \  cout << number << ' ' ; // 用于分隔\n        number++; // 变成下一个数字\n    } // for\n\
    \    cout << endl; // 跳到下一行\n} // main\n\noutput: 123456...\n```\n\n## 7.3.3 倒序计数\n\
    \n除非你完全清楚自己在做什么，否则你应该始终编写由计数控制的循环，使其计数器从 0 开始并向前移动。在编写本该倒序计数的循环时，要抵制在 `for` 循环中使用像\
    \ `i--` 这样的表达式的诱惑。并不是说它不起作用（因为它确实可以工作），而是初学者来说很难让它正常运行。\n\n相反，应该按照本章所建议和演示的那样设置计数控制，并使用另一个变量作为反向遍历的值。初始化该变量，并在计数控制循环中对其进行减法。通过这种方式，你将管理循环周期的过程与倒序计数的过程离开了。实际上，7.2.1\
    \ 节中的 `bounce.cpp` 提示了如何实现。\n\n这里有一个向输出发送 16 个数字序列的示例，从 99 开始倒序输出：\n\n```cpp\n\
