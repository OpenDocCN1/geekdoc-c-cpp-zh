    \ f;` 语句和一个 `double c;` 语句，以便它们被正式地介绍给编译器。\n\n## 4.1.2 毫无头绪\n\n你不会认为 `f = 9 /\
    \ 5;` 会将值 1.8 存储到变量 `f` 中吧？毕竟，`f` 被声明为浮点数变量，这应该是编译器知道该做什么的提示。但问题在于——在符号右侧的整个表达式在编译器查看左侧的变量名之前就已经求值了！正如之前所说的，`9\
    \ / 5` 解析为 1。然后该结果被存储在变量中。截断已经发生了。\n\n## 4.1.3 将整数视为浮点数\n\n库中的大多数表达式都需要 `double`\
    \ 类型的浮点数数字。但由于各种原因，我们可能有 `int` 类型的数据并将其用于这些表达式之一。因此，对于整数，如果 `x` 是一个 `int`，请使用\
    \ `sqrt((double)x)`。此函数调用伪装 `x` 是 `double` 类型。（这使用了“类型转换”，它在第 9 章中解释）。非常重要的是记住，这不会改变\
    \ `x`——它仍然是 `int` 类型。\n\n## 4.2 输出格式化\n\n计算机计算是准确的。它们如此精确，以至于计算机觉得显示小数点后的所有数字。考虑\
    \ `10.0 / 3`——结果是 `3.33333....`。计算机喜欢显示它所有的 3，直到达到 C++ 默认的 6 位总数字限制。但你可以强制计算机对数字进行舍入，并按所需的数后位数显示它们。方法如下：\n\
