    此处包含的每一段代码列表。电子书版本的读者可以简单地触碰或点击列表，使其在单独的浏览器窗口中显示。


    本书使用的语言是通用英语，以便让它对学生来说尽可能易于理解。尽管如此，你将会看到缩写和感叹号！


    ## 独特的 C++ 编程特性


    循环逻辑仅通过 `while (true)` 循环配合 `if (...) break;` 来引入，分支逻辑则仅使用 `if-else`。一旦这些概念被充分解释，就会添加其他语法，如带条件的
    `while`（while-condition）、`do-while` `for` 和 `switch`，它们作为编写逻辑结构的更方便、更简洁的方式被引入。


    在 C++ 控制台和文本文件输入中使用了一种特殊的语句。它是 `cin.ignore(1000, 10);`，它跟在每个 `cin >>...;` 之后。同样，对于文本文件输入，`fin.ignore(1000,
    10);` 跟在每个 `fin >> ...;` 之后。这强制每次通过键盘只输入一个值，或者文本文件中每行输入一个。学生们很难理解 C++ 处理行尾符（EOL）的方式，因为
    `>>` 和 `getline(...)` 的处理方式不同。学生可能会在程序上浪费几个小时，因为程序似乎跳过了输入提示，或者有时需要用户按两次回车。这种持续使用
    `ignore` 的方法解决了这个问题。


    `ignore(1000, 10)` 中的 10 等同于 "\n"。这只是为了让初学者输入 "10" 稍微容易一点。1000 只是一个容易输入的大数字，由于它们的相似性，这两个数字都更容易记忆。1000
    是在未找到 "\n" 时跳过的末尾空格或额外字符的数量，它足够长，可以重置大多数缓冲区。


    书中简要解释了 C++ 函数原型，但书中的代码示例中并没有使用它们。它们是不需要的，因为书中的每个程序只涉及一个 `.cpp` 源文件。重点在于编程概念——像
    C++ 这种语言的细节留以后学习。


    在后面的章节中使用了 `new` 关键字使用动态内存来实现变长数组和链表节点。但**没有**使用相应的 `delete` 关键字。在大多数现代桌面系统上，当程序结束时，操作系统会自动修复由于遗漏此内存管理功能而导致的“内存泄漏”。再次，重点在于概念，所以这个细节也留给以后学习。


