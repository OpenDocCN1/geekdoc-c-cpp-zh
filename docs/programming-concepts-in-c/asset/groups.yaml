    \ `age3 / 3` 会先求值，然后是 `age1 + age2`等等。\n\n## 3.3.3 处理文本\n\n到为止，所有的计算都涉及数字，因为那通常是我们使用的内容。但我们也需要处理文本。到为止，所有的计算都涉及数字，因为那通常是我们使用的内容。但我们也需要处理文本。\n\
