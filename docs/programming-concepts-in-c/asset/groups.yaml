    \ i++)\n    if (min > score[i]) min = score[i];\n\n// find the max AND min\nint\
    \ max = score[0];\nint min = score[0];\nfor (i = 1; i < nScores; i++)\n{\n  if\
    \ (max < score[i]) max = score[i];\n  if (min > score[i]) min = score[i];\n} //\
    \ for\n```\n\nTo sort an array-based list, the sort function call is nearly the\
