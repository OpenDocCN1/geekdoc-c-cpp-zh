    # 14.3.1 Adding A Node To A Linked List


    There are 3 steps to adding a node. The first is to create the node. The second
    is to assign values to the node''s data fields – all but its next-link. The last
    is to link the new node into the list.


    Here''s the code for creating and adding a node:


    ![](img/80b9ed561fa57ed72adb64b305ef946d_220_0.png)


    Student* s = new Student; is something we have not seen before. It''s kind of
    like a dynamically sized array declaration, but there are no square brackets and
    no size specification.


    Why didn''t we create the node the same way we create objects, like this: s? It
    has to do with how memory works in C++, and the fact that objects declared inside
    a loop''s curly-brace container are temporary, while nodes need to be more permanent.
    You could actually code it like this, and it would compile, but would lead to
    very nasty memory errors when the program runs.


    And what''s with the “arrow” symbol? We know s.name and s.next, but what''s s->name
    and s->next? Here is a C++ rule: if s is declared with a * use the arrow instead
    of the dot! To type an arrow, it’s “dash” – a 2-character operator symbol.'
  - '[PAGE 221]


    # 14.3.2 Removing Value From A Linked List


    Here’s a simple code-block to remove the last-added value from the list, storing
    its value in a temporary object for processing. Note the use of a “leading star”
    in the first statement – it’s required here in C++.


    ```

    Student aStudent = *start; // remove node

    start = start->next; // relink the linked list

    ```


    # 14.3.3 Start-Links, Next-Links, And Nodes – Oh, My!


    Okay, so the code for linked lists can be given to you as it has above, but what
    does it really mean? Conceptually, arrays are fairly easy to understand. An array
    is like a classroom with students’ desks arranged in orderly rows. An array-based
    list is like filling those desks starting with the left-most one in the front-most
    row, and working to the right until the first row is filled, and then continuing
    to the next row. By keeping track of the number of students already in the room
    (using a list size variable), the instructor can compute the location of the desk
    to assign to the next-arriving student.


    By contrast, a linked list is like a room with desks, tables, displays, and other
    structures scattered about. It starts out with an instructor, but no students,
    because they have not arrived.


    When the first student arrives and chooses a desk, the instructor writes on an
    index card the *desk*''s location in the room – not the student’s name or ID,
    just where the *desk* is. When the second student arrives and chooses desk, the
    instructor hands off the index card to the newly student – it’s now the new student’s
    job to track that. The instructor makes a new index card to track where the new
    arrival is, to replace the one given to the new student. This continues as more
    students arrive.


    The instructor can always find all the students in the room because the instructor’s
    index card notes the last-arriving student is, and that student can direct the
    instructor to another student because it’s written on the index card given to
    them by the instructor when'
