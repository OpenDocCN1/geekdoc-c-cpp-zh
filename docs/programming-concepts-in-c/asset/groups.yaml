    ```\n\n## 13.1.3 Functions And Array-Based Lists\n\nWhen sharing an array-based\
    \ list with a function, remember that there are two values that identify the list\
    \ – the array and the list size. So any function that receives the array in its\
    \ parameter needs the list size. Here is an example:\n\n![](img/80b9ed561fa57ed2adb64b05ef94d_213_0.png)\n\
    \n```cpp\ndouble getAverage(int score[], int n)\n{\n  double result = 0;\n  for\
