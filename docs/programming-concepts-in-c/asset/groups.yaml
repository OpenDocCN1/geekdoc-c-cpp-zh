    \n关于基于数组的列表，你需要知道的是，它们是数组，其中并不是所有元素都被使用，但在需要时是可用的。使用一个新的独立的 `int` 来跟踪任何时候实际上有多少个元素是正在使用的。与之前的章节不同，本章的目的不是训练你使用这项编程特性。相反，它是一个介绍概念的机会，如果你进一步学习计算机科学将会遇到这些概念，并提供一种练习我们在前面章节中学习的编程功能的方法。\n\
    \n“列表”是值的集合——通常是对象，但也可以是整数、浮点数或文本。C++ 语言允许这些数据类型之间相互不同，即使在同一个集合中也是如此！这种概念是“袋子”，它可以包含许多不同的项目。但为了我们本书中的学习目的，我们将只考虑数据类型的集合。\n\
