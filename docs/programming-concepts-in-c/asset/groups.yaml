    \ `cout.setf(ios::fixed|ios::showpoint);`。只需这样做一次，因为一旦它出现在 `cout` 语句中，它对程序的其余部分就是永久性的。最后，使用语句\
    \ `cout << setprecision(2);`，这样在 `setprecision` 之后发送到输出的所有值都将被舍入为小数点后 2 位。你可以通过使用带有另一个数字的\
