    ## 2.5.1 How To Type Code


    In the “World’s Smallest C++ Program” above, and any other program you write,
    you should type the opening curly-brace, then on the next line type the closing
    curly-brace. Consider that as a “curly-brace container”. Fill with it (if any)
    *after* you create the container.


    ```cpp

    int main()

    {

    }

    ```


    Note that as you type the program, there is an indication on the editor about
    the line number that is currently edited. In Notepad this is located in the lower
    right with the abbreviations “Ln” for line number and “Col” for column number.
    (If this does not appear, then revisit section 2.1.1 above.) This is not so important
    for now, but knowing the line number will be important when we get to the compiling
    step, in case the compiler detects and reports typing errors.


    ## 2.5.2 Saving A File


    Save the file as hello.cpp, into the “working folder” you created for storing
    your programming files (r:cpp) on a PC in the examples in this chapter). If you
    use Notepad on a PC, you may have to enclose the filename in quotes, as in the
    sample screen below, or else .txt may be appended to the filename! The saved file
    is called the “source file”, and it contains “source code”.

