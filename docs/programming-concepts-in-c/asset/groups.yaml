    Actually, main itself is a function like any other function. A value-returning
    function whose return type is int. But unlike any other value-returning function,
    main does not have to end with a return statement, nor declare a result. Note
    that some C++ compilers actually allow you to write main as a "void function"
    (which is explained later in this chapter) instead of value-returning, but not
    all C++ compilers support that variation, so you should stick to "int main", but
    with no return statement.


    # 8.2 Parameter Lists


    Note that the parentheses of getGrade are empty in passingGradeFun.cpp. But the
    parentheses of pow are not empty in mort.cpp from chapter 4. A function''s parentheses
    identify it as a function instead of a variable. But they are also a container
    for inputs to the function. This is a way for the call to send values to the function
    for processing. The function call pow(1 + p, T) has two inputs separated by commas.
    This list is called the "parameter list" (also known as "function arguments").


    If a function has empty parentheses, then it has no inputs, like getGrade. The
    number and type of the values in the list of a call must match what the function
    expects them to be. This is specified in the "header". Since the header for getGrade
    has empty parentheses, the call must have empty parentheses, too.


    In the pow calls, the expression 1 + p is resolved first, by retrieving the value
    stored in p and adding 1 to it. Then the value stored in T is retrieved, and these
    two values are "sent" to the function. The following example shows how to write
    and use a function with a non-empty parameter list:'
