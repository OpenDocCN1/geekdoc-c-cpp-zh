    In the previous chapters, we loaded values directly into the array. But it''s
    different with lists. We first store a new value in a temporary variable, like
    `aScore`. Then we check to see if the list is not full, and if it''s not full,
    we copy the temporary variable''s value into the next available position in the
    array.


    Inside the square brackets of each assignment statement is the “post-increment
    operator, ++, on the list size variable. What this does is to add one to the list
    size after the assignment takes place. The statement `score[nScores++] = aScore;`
    is the same as two statements: `score[nScores] = aScore; nScores++;`, but it is
    more concise. Also, as one statement, we avoid having to write a curly-brace container
