    # 4.1 Whole Number Division And Truncation


    The division operation often results in a fractional part in the answer above
    ended in 70/3, which has a fractional part when resolved. But there is an inherent
    inconsistency when using division with whole numbers, because whole numbers cannot
    have fractional parts. To solve this, C++ simply throws away, or truncates any
    fractional value. It does not round to the nearest – it truncates. So 99/100 resolves
    to zero!


    Note that when using numbers in calculations, whole numbers without decimal points
    are treated as whole numbers, and numbers with decimal points are treated as floating
    point numbers!


    A classic problem in programming is the conversion of temperature from Celsius
    to Fahrenheit. The formula is f=(9/5)*c+32. If we were to program this as f=(9/5)*c+32;
    we would have a problem because 9/5 resolves to one! But if either of the 2 numbers
    in an operation is a floating'
