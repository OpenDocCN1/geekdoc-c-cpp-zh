  md: '# PROGRAMMING CONCEPTS in C++


    with if-statements – it is not required, and does not need to end in `break;`


    When using `switch` with whole numbers, use statements like `case 0:`, without
    quote marks around the tested value. But when using `switch` with single-character
    text, use statements like `case ''A'':`, with single quote marks around the tested
    value.


    Switch-statements cannot have ranges or variables in their `case` statements.


    The switch-statement gets its name from the fact that it is like an on/off switch.
    It starts in the “off” position, and checks each `case` statement from top to
    bottom until it finds a match with the value in its parentheses. (And if) a match
    is found, or if `default` statement is reached, the switch is set to “on”. Then
    on, all other `case` statements are ignored, and any code that appears expires.
    The purpose of `break;` is to prevent sequential processing from going any further,
    and running into over the next `case` – it skips to the end of the switch-statement,
    after its closing-brace.


    But beware the switch-statement! Do not use `switch` in place of if-break logic.
    The reason is that the `break;` statement inside a `switch` means something entirely
    different than what it means in an if-break. It exits the `switch.`, and has no
    effect on any loop that may contain.


    # 7.2 Event-Controlled vs Count-Controlled Loops


    There are two basic loop types: “event-controlled” and “count-controlled”. The
    difference is a conceptual one, having to do with knowing `in advance` the number
    of cycles the loop will execute. In event-controlled loops, cycles continue until
    certain conditions are met that allow an if-break to exit the loop. When such
    conditions are met, that’s an “event”. The number of cycles that will be executed
    before the event occurs cannot be determined'
