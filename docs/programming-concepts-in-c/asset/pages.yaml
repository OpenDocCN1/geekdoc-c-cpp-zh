    \ by allowing them to skip and jump around statements, rather than follow a strict\
    \ sequence from top to bottom with options. The decision points in programs where\
    \ the flow of the program can either continue in a sequence or skip to somewhere\
    \ else “logic” – something like, “if this condition exists, then do something\
    \ – otherwise, skip over that something”.\n\n# 6.1 The If-Statement\n\nIn both\
    \ of the following examples, the indented output statement gets executed only\
    \ if the user’s guess is correct. This is the basic “if-statement” for use in\
    \ branching – it allows branching over the indented statement.\n\n```\n#include\
    \ <iostream>\nusing namespace std;\n\nint main()\n{\n    // read a score from\
    \ the keyboard (see 5.1)\n    int usersGuess;\n    cout << \"I am thinking of\
    \ a number between 1-10\" << endl;\n    cout << \"Try to guess the number [1-10]:\
    \ \" << \";\n    cin >> usersGuess;\n    cin.ignore(1000, 10);\n\n    // see if\
