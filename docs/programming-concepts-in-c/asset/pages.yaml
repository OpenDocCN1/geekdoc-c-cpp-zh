    # 9.6 Type Casting


    Computer languages have a variety of data types, and for each variable in your
    program you have to decide which data type to use. Also, the data type for the
    result of a math operation depends on the data types of the values in the operation.
    Here''s the problem: if you have 3 int values (for example, a, b, and c) and you
    want their average, the expression (a+b+c) / 3 will truncate (that is, lose) the
    fractional part of the result, because that is what number division does. That
    means (1+1+2) / 3 is not one and a third – it''s one!


    The solution to this problem is type casting. You can write code that forces casting
    – this is a way to temporarily convert a value of one type into a related type,
    such as an int to a double. Here''s how:


    | int a = 100; int b = 17; int c = -29; double average1 = (a + b + c) / 3; //
    LOSES THE FRACTIONAL RESULT average2 = (double)(a + b + c) / 3; // that''s better
    average3 = (a + b + c) / 3.0; // this works, too |


