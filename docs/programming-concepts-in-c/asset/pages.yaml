    # Finding The Maximum Or Minimum Value


    ```

    // get values for 3 whole numbers

    int a = ...

    int b = ...

    int c = ...


    // find the maximum whole number

    int max = a;

    if (max < b) max = b;

    if (max < c) max = c;


    // find the minimum whole number

    int min = a;

    if (min > b) min = b;

    if (min > c) min = c;

    ```


    You may not have come up with this on your own right away, because it is somewhat
    counter-intuitive. For example, note that there are variables for storing the
    minimum and maximum values, but they are set to the value of the first number!
    It''s as if we know the answer in advance, and the answer is the first number
    – we’d have to be pretty lucky for this to work every time!


    But the situation is that our if-statements can only compare 2 values at a time,
    and we have 3. So here''s the approach: without looking at any of the numbers,
    assume that the first number is what we want. Then look at the second number,
    and if it is better, we change our mind! Then if it is better, we change our mind,
    perhaps again. Get used to the idea, because that''s a very common approach in
    programming – assume the answer, then look at alternatives and change your mind
    when necessary.'
