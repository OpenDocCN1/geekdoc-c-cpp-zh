  md: "# The Classic Recursive Factorial [factorial.cpp]\n\n```\n#include <iostream>\n\
    using namespace std;\n\nint factorial(int n)\n{\n    int f;\n    if (n < 2) //\
    \ detecting a base case\n        f = 1;\n    else\n        f = n * factorial(n\
    \ - 1);\n    return f;\n} // factorial\n\nint main()\n{\n    int n;\n    cout\
    \ << \"Enter n: \";\n    cin >> n;\n    cin.ignore(1000, 10);\n\ncout << factorial(n)\
    \ << endl;\n} // main\n```\n\n# 15.2.3 A Caution...\n\nDo not get too attached\
    \ to recursion. There is always an iterative solution to everything – it’s just\
    \ that recursion is sometimes simpler to code, once you get familiar enough with\
    \ it. But recursion is usually less efficient than iteration, so use iteration\
    \ if you can. Use recursion as a convenience, realizing that there is a cost involved.\
    \ And sometimes that cost is too much, even for the easiest of recursive solutions\
    \ – try counting down from 100000 and see! If that works, then try a million...\n\
