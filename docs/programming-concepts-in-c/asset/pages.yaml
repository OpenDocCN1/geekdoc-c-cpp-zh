  md: 'The reason for using a generic name like x in the function is to make `countScoresGreater`
    more generic. There is really no reason that it cannot be used to count the number
    of scores greater than any value – not just the average. By writing it as generic
    as possible, it is available to be used for other things, such as counting the
    number of A''s (scores greater than 89).


    # 11.5.4 Temporary Variables


    The variable `average` in main is used to store the result of the `getAverage`
    call. It is really needed, though, because `average` could be replaced where it
    appears in the two output statements with `getAverage(score)`. But doing so would
    require that the averaging loop be executed twice, which is a bit of a waste.
    So programmers generally will use an extra “temporary variable” to store the result
    of a call that is used multiple times.


    Note that this was not done with `countScoresGreater` because it is only called
    once.


    # 11.5.5 Pass By Reference


    In `readScores`, array elements are assigned values. Since arrays are passed by
    reference, the function gets the original version of the array, and any changes
    made to it affect main where the array was declared. This would not be so for
    anything that is not an array – `int` and `double` are passed by value, meaning
    that the function has a copy of the original value. Any change made to a copy
    in the array does not affect the original in main.


    # 11.5.6 Array As A Return Type


    The data type for a dynamically-sized array has the star symbol in it, like `int*`.
    It’s okay to create a dynamically-sized array variable to return from a function.
    But it is not okay to create a regular array and return that. It may compile,
    but it definitely will not work!'
