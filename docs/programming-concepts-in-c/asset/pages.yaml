    Here are some examples of simple logical expressions, which could be placed inside
    the parentheses of an if-statement:


    | Examples Of Logical Expressions, Using Comparison Operators |

    |---||

    | x < 10 | tests whether the value stored in x is less than 10 (x must be an already-declared
    whole number or floating point variable) |

    | s == "Hello" | tests whether the text stored in s is exactly equal to "Hello",
    with matching case (s must be a C++ string variable) |

    | a != b | tests whether a and b have different values (a and b must be variables
    of the same data type: both numbers, floating points, both characters, or both
    strings |

    | gender == ''f'' | tests whether gender is F (gender must be a single-character
    data type variable, char) |


    It is important to remember that the test for equality has *two* back-to-back
    equal signs. You may recall that a single equal sign already means something:
    assignment of a value to a variable. A different symbol is needed for the equality
    operator. Be careful, because it is possible to write s = "Hello" (with just one
    equal sign) inside the parentheses of an if-statement, but it means *'
