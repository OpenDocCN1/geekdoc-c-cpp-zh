  md: '# Chapter 14. Lists Of Unlimited Size: Linked Lists


    As in the previous chapter, the purpose of this chapter is *not* to train you
    in the use of linked lists. It is instead an opportunity to introduce concepts
    that you will run into if you go further in your study of computer science, and
    to provide an application of the programming features we studied in preceding
    chapters for the sake of practicing what you''ve just learned. So try to understand
    the “link” concept as you study this chapter, knowing that you will explore it
    in detail in future studies. Focus on the applications of variables, branching,
    loops, objects, and functions.


    There are two problems with array-based lists: (1) they have a limited capacity,
    and (2) if you do not use them to their capacity, you''ve wasted memory. “Linked
    lists” solve the capacity problem. There is no limit specification! A limit was
    inherent in array-based lists, because a number needed to be used in the declaration
    of the array. But not so with linked lists! Also, there are no wasted elements
    in linked lists, because the list only contains values that were specifically
    linked in.


    A drawback of linked lists is that they require their values be *objects*. If
    you want a list of `ints` or `strings`, you have to put the `int` as a field in
    an object specification, which may only have that one field. This may seem like
    a lot of overhead and extra work, but in most applications, linked lists already
    exists used with objects anyway, so the object specification already exists in
    most cases, and all you do is add another field – a “next-link”.


    # 14.1 The Next-Link


    The values contained in linked lists are objects. In order for an object to be
    suitable for use in a linked list, its object specification needs to contain a
    “next-link” to the next object. Mostly, objects do not have links in them – objects
    intended for use in linked lists do. The next-link is normally the *last* field
    in the object specification, and it is usually named “next”.'
  merge: -1
  pgno: 218
- img_proc: true
  md: '![](img/80b9ed561fa57ed72adb64b305ef946d_219_0.png)


    Objects containing a next-link are called “nodes”. Note the next-link field: `Student*
    next`; – it’s required in C++, and explained more fully later in this chapter.


    # 14.2 The Start-Link


    The identifier for a linked list is its “start-link”. Here is how to declare `empty`
    linked list – and note the just like we have with the next-link:


    ```

    Student* start = 0; // the start-link declaration

    ```


    While it is not required, and some programmers and textbooks do not do so, linked
    lists should `always` start out empty. That’s what the `0` does in the declaration
    statement.


    By convention, the identifier for a linked list is named `start`. If you have
    more than one list in the same scope, they obviously cannot have the same identifier,
    so other names of course be used.


    The star symbol means that `start` is a pointer` – “points to” where another variable
    can be found. So the start link “knows” where to find the first node in the list
    that it identifies. A value of zero indicates that the list is `empty`.


    The start-link is also referred to as the “start pointer” or the “head pointer”,
    and the expression `NULL` is often used instead of the zero. But we’ll stick to
    “start”, “link” and zero in this book.'
