    We know that computers can store values, including numbers and text – even audio
    and video. But just how do they do that, anyway? This chapter explains how computers
    store values, and in doing so, why computers make the distinction between whole
    numbers and floating point numbers. And in case you''ve been thinking about double
    data type and why we should ever use int, this chapter will help you see the value
    of int.


    You will also learn that there are other data types for whole numbers besides
    int, and why floating point numbers can be either float or double. It has all
    to do with range and precision – something you might not have expected of a computer.
    Aren’t computers supposed to be “accurate”? Well, it turns out that there are
    limitations, and all programmers need to be aware of these.


    # ## 9.1 Computer Memory: Vast Arrays Of On/Off Switches


    If you study the “memory” of a computer – what’s inside those SD cards, memory
    sticks, and DDRs – you will find that they consist of millions or billions of
    electronic on/off switches. That’s it – nothing more than on/off switches. Each
    switch can store one of two possible values – off or on – zero or one.'
