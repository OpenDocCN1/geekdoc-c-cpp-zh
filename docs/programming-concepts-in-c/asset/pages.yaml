  md: '# PROGRAMMING CONCEPTS IN C++


    gets pressed is captured by the program, and can be stored in a variable. If nothing
    gets typed, the user gets another chance to enter something – anything – before
    pressing ENTER.


    But on the computer screen, the only evidence of the cin statement is a symbol
    – usually a flashing horizontal line or a box. This is not much of a clue for
    the user to know that something is supposed to be typed now, followed by the ENTER
    key. The cin is usually preceded by a cout with instructions for the user. This
    is called a prompt.


    The following shows how a program would work without, and with, a prompt.


    | With No Prompt: | With A Same-Line Prompt: | With A Previous-Line Prompt: |

    | --- | --- | --- |

    | string name; getline(cin, name); | string name; cout << "Enter name: "; getline(cin,
    name); Enter name: | string name; cout << "Enter name:" << endl; getline(cin,
    name); Enter name: |


    There are two places to place the prompt: either on the same line where the user
    input is to be typed, or on the previous line. Both ways are shown above, but
    the same-line prompt is used in most of the example programs in this book. Note
    that the same-line prompt includes a separating space at the end of the prompt
    message (after the colon): "Enter name: " but the previous-line prompt does not:
    "Enter name:". Also, it is common to include possible responses in the prompt,
    enclosed in square brackets and separated by commas or slashes, like this: "What
    is your gender? [M/F]:", as a guide to the user.


    Unless you have a very good reason to otherwise, always have a prompt for each
    user-entered value. Every time you expect the user to type something and press
