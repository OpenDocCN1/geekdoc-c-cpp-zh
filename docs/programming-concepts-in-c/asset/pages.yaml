  md: "# ROBERT Burns\n\nahead time. Every loop example in the previous chapter was\
    \ event-controlled.\n\nThe types of event that can cause the end of an event-controlled\
    \ loop include (1) user enters “quit” in response to a prompt, (2) a valid input\
