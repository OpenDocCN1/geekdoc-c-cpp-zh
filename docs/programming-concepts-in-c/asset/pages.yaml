    # 2.3.1 How To Backup Your Files


    The rule is simple: “only backup the files that you do not want to lose.” After
    you finishing your source files, save them onto a hard drive or flash drive, imagine
    for a moment what would happen if the hard drive fails or you misplace your flash
    drive. It’s a good idea to backup your files by putting a copy of them on the
    Internet. There are several free options, including emailing attachments to yourself,
    and cloud-based file hosting services like Dropbox or Google Drive. If you are
    doing assignments for a computer course you are taking, the course may even offer
    a class website for submitting your files, and you could use that to backup your
    work.


    Decide on your own process for backing up your work, and make it a habit to email
    or upload your files at the end of each work session.


