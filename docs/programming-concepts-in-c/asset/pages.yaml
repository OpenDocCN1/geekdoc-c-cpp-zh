    # 15.2 Functions That Call Themselves: Recursion


    Recursion is simply this – it''s when the code block of a function contains a
    statement with a call to itself! This actually is a form of a loop, which would
    seem to be infinite. What makes it work is that the function must contain logic
    to decide whether to continue calling itself or not – similar to if-break in a
    while-true loop.


    Recursion offers a new way to solve problems. If you are not using recursion,
    you are using “iteration” – it''s what we have been using all along, but since
    it was the only thing we used, it really did not need a name. Iteration uses loops;
    recursion uses functions.


    Recursion is usually an upper-level computer science topic. It is very useful
    in solving some types of problems, and actually simplifies many solutions. So
    why is it at the end of this book, and why is it upper-level? That''s because
    it is difficult for most people to understand right away – even people with strong
    aptitudes for computers. This is something that you will have to hear now and
    believe later!


    To apply recursion, you just need to know these things about the problem you are
    solving: (1) how to solve a base case, and (2) how to reduce problem complexity
    towards a base case. Then you need to be able to divide problems into two parts:
    (1) the part you know how to solve, and (2) the part you don''t know how to solve.'
