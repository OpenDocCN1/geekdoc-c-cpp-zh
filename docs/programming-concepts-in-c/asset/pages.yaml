    C++ provides a “random number generator”. To randomly draw a whole number with
    a value between 0 and 9, inclusive, use this expression, with the % operator explained
    in 3.3’Get the Remainder” sample:


    ```

    rand() % 10

    ```


    Each result is equally probable. Add 1 to the above in order to get numbers in
    the range 1 to 10, inclusive. Here’s how to simulate the roll of a six-sided die:


    ```

    1 + (rand() % 6)

    ```


    Here’s how to simulate the roll of two six-sided dice:


    ```

    (1 + (rand() % 6)) + (1 + (rand() % 6))

    ```


    Use of random numbers in C++ requires two includes: `#include <ctime>` and `#include
    <cstdlib>`. You also need this as the first statement in main: `srand(time(0));


    Here’s something you’ll need to remember – if you use `srand(time(0));`, it should
    *not* appear anywhere else in your program except as the first statement in main,
    so that it is never executed more than once in a run of a program.'
