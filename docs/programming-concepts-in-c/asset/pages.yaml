  md: '# Chapter 15. Some Advanced Topics


    This book is an introduction to the world of computer programming. Its purpose
    was to turn you into a computer programmer, and if you got this far, it probably
    succeeded. On the later topics starting with lists (array-based and linked) only
    some beginning concepts were developed. For example, we did not show how to add
    and remove values anywhere except the end of array-based lists, and did not even
    mention the possibility of expanding list capacity. For linked lists we showed
    how to add and remove nodes at the front of a list, but did not show how to do
    so anywhere else, and did not deal with sorting or function calls. All of these
    are topics for further study in computer programming, and perhaps your study so
    far has inspired you to go on from here.


    Before we complete our introduction, though, we want to expose you to a couple
    of additional programming topics: collections and recursion. They are unrelated
    to each other, except for the fact that they are more advanced topics in computer
    science. Collections, because you should not write array-based and linked list
    code the rest of your programming life. Recursion, because it is a subject that
    you will have to hear about more than once before you believe that it works, so
    we may well start now!


    # 15.1 The Easy Way: Collections


    In modern computer languages, the details of array-based and linked list code
    have already been optimized by professional programmers and put into libraries
    for you to use. The library-defined “deque” object in C++, and others like it,
    has library functions that implement behaviors to create lists and manage values
    — without the programmer having to worry about capacity or start-links and next-links.
    “deque” is pronounced either “deque” or “deck”, and stands for “double-ended queue”.
    To declare an empty list of Student objects, for example, use the following:


    ```

    deque<Student> student;

    ```'
