  md: '# PROGRAMMING CONCEPTS IN C++


    they arrived. This continues until the first-arriving student is found, who has
    no index card.


    The instructor''s index card is the start-link, noting where the last-arriving
    student can be found. Each student is a node, because beside a name, ID, and other
    student-related data, they also have a next-link – the index card with where the
    student who arrived before them can be found. The first-arriving student has no
    index card.


    ![](img/80b9ed561fa57ed72adb64b305ef946d_222_0.png)


    # 14.4 Traversing Linked Lists


    We use a for-loop to traverse arrays and array-based lists. We also use a for-loop
    to traverse linked lists. But the loop looks a bit different:


    ![](img/80b9ed561fa57ed72adb64b305ef946d_222_1.png)


    p is like an erasable index card in our classroom example above. It starts out
    with a copy of what''s on the instructor''s index card, p = start, and the first
    cycle of the loop uses that value – the location of the last-arriving student.
    After that cycle, the value on the p index card is scratched out and overwritten
    with what''s on the last-arriving student''s index card, p = p->next, and cycles
    continue until the cycle for the first-arriving student (without an index card)
    completes.'
