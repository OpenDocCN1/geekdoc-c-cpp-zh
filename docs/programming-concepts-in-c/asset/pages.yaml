  md: '# PROGRAMMING CONCEPTS IN C++


    But not be tempted to make variables global! It is possible to do so, and the
    compiler is okay with it, but it is bad programming practice. Why is it okay for
    constants but not for variables? It’s a code maintenance issue. Because constants
    do not change, there is really no problem making them global and using them throughout.
    But a global variable can be reassigned any anywhere, making it hard to track
    in a large program. Plus it may preclude having functions that call themselves,
    which we will see in chapter 15.


    # 11.5.2 Local Variables In Functions


    The result variables that are declared inside the value-returning functions are
    called “local variables”, because they each belong to their own function. They
    are in separate scopes, and therefore separate and distinct variables. They only
    exist while the program is executing the code in their function.


    fin and scoreTotal are also local variables.


    Also note that i is declared separately in every loop. While there are ways to
    share one counter variable among all loops, such as making it a global variable,
    it is better for each loop to have its own. The i’s are local to their loops –
    they are even more limited in their scope than fin and scoreTotal.


    # 11.5.3 Parameter List Variable Names


    The second parameter in countScoresGreater is named x in the parameter list, but
    the call in main has a variable named average in that position. The names do not
    match, and they do not have to. Whether the names refer to copies of values from
    main, or they are aliases for arrays in main, the names are local to their functions.
    In the same way, a person can go by two different names – one at work and another
    at home – array variables can, too. Array variables have aliases across function
    scopes.'
