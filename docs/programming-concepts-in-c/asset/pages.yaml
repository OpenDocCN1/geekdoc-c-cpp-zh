    # 11.3 Dynamically-Sized Arrays


    When we declared the arrays earlier in this chapter, all were declared with a
    specific size that had to be known by the programmer before the program was compiled.
    The size of 8 for the array of scores read from the text file 8Scores.txt had
    to match the number of scores in the file, or there would be a problem. It would
    be nice if the first line of the file could tell the program how many elements
    to have in its array.


    C++ has another way to declare arrays, which allows the number of elements to
    be specified by a variable. Here is the statement to declare an array of n elements,
    where n is an int variable:


    ```

    int* score = new int[n];

    ```


    Sorry, but this form of array declaration does not allow for curly-brace initialization.


    The peculiar symbol int appears to be a data type, declaring the variable score.
    Actually, this is so! It is a data type called “int star”, and it is used to store
    “memory addresses” – that is, it stores the numeric address of the first byte
    in memory used for the array. The variable score, so declared, is called a “pointer”,
    because it “points to” the place in memory where the array is stored. This may
    seem pretty complicated – that''s okay, because this is an advanced topic of the
    C++ language. We will not study the details of pointers and memory addresses in
    this book, except as we need for arrays.


    For arrays of other data types, replace the two occurrences of int in the declaration
    statement with the data type desired for the array. For example, double* gpa =
    new double[n]; or string* name = new string[n];'
