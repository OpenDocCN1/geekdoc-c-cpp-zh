    \ should make the loop end.\n\nBy contrast, a count-controlled loop executes a\
    \ predetermined number of cycles. So a loop that prints your name repeatedly until\
    \ the user tells it to stop is event-controlled. And a loop to output your name\
    \ exactly 10 times is count-controlled.\n\nIf the number of cycles of a loop is\
    \ known ahead of time, use a count-controlled loop. It's similar to an event-controlled\
    \ loop, but the “event” is reaching the predetermined number of cycles. Count-controlled\
    \ loops use int to keep track of the number of cycles, and it is the value of\
    \ this “counter” that is compared in an “if-break”.\n\nA Count-Controlled Loop\n\
    int i; // cycle counter\ni = 0; // zero cycles so far\nwhile (true)\n{\n    if\
    \ (i == 10) break; // do 10 cycles\n\n    i = i + 1;\n}\n\nThe counter in count-controlled\
    \ loops is traditionally declared as i. The last statement in the loop “increments”\
    \ i – that is, it adds one to it. But the logic to control this loop is all over\
    \ the place – before the loops starts, at the top of the loop’s curly-brace container,\
    \ and at the bottom of the container. The purpose of this chapter is to introduce\
    \ other ways to do such loops in more concise ways."
