  md: '# 3.3.4 Beware Using Uninitialized Variables!


    It is a very common mistake that beginning programmers make – forgetting to initialize
    a variable before using it. The problem usually arises when programmers expect
    newly declared variables to be set to zero automatically. In some compilers, they
    are set to zero! Such compilers do not do the programmer any favors, because they
    actually reward wrong behavior – they reinforce the wrong thinking that variables
    are initialized to zero by default. This cannot be stressed enough – they are
    not set to zero in all situations.


    So the problem is this – a programmer writes code on one system, compiles and
    runs it, and it works, because compiler on that system sets uninitialized variables
    to zero. Then the same source code gets used on some other system where the compiler
    assigns an unpredictable value, and the program no longer works!


    The one case where this does not apply is any-length text variables in of type
    string, which are automatically initialized to blank if not assigned upon declaration.


