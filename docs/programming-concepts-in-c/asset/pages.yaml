    # 4.1.1 Who Are You, Anyway?


    Did you see how f and c just got used in the previous code samples without any
    introduction? You can probably guess that these are variable names. But we know
    C++ compilers are a bit more formal – they require an introduction in the form
    of a declaration statement before they will deal with f and c. So we can presume
    that somewhere before they get used in the conversion calculation there''s a double
    f; statement and a double c; statement, so that they are formally introduced to
    the compiler.


    # 4.1.2 Not A Clue


    Wouldn''t you think that f = 9 / 5; would store the value 1.8 into the variable
    f? After all, f is declared as a floating point variable and should be a clue
    for the compiler to know what to do. But here''s the thing – the whole expression
    to the right of the sign gets evaluated before the compiler even looks at the
    variable name on the left! So as was already said, 9 / 5 resolves to one. Then
    that result gets stored in the variable. Truncation already happened.


    # 4.1.3 Treating Whole Numbers As Floating Point Numbers


    Most of the expressions in the library require numbers of floating point data
    type double. But for various reasons, we may have numbers of data type int that
    we want to use with one of these expressions. So for a whole number, use sqrt((double)x)
    if x is an int. This function calls to pretend that x is of type double. (This
    uses "type casting", which is explained in chapter 9.) It''s really important
    to remember that this does not change x – it is still of type int.'
