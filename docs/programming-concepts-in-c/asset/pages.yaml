    # 2.5.1 How To Type Code


    The tendency is to type code “linearly” – that is, from the top line to the bottom,
    from left to right. But that is not the best way to type code. Matching parentheses
    and curly-braces appear throughout code. The toughest part is to keep track of
    these and make sure that each open parenthesis has a matching closing parenthesis.
    The easiest way to do that is to type opening and closing symbols together, and
    then separate them.


    In the “World’s Smallest C++ Program” above, and any other program you write,
    you should type the opening curly-brace, then on the next line type the closing
    curly-brace. Consider that as a “curly-brace container”. Fill with it (if any)
    *after* you create the container.


    Note that as you type the program, there is an indication on the editor about
    the line number that is currently being edited. In Notepad this is located in
    the lower right with the abbreviations “Ln” for line number and “Col” for column
    number. (If this does not appear, then revisit section 2.1.1 above.) This is not
    so important for now, but knowing the line number will be important when we get
    to the compiling step, in case the compiler detects and reports typing errors.
    Unfortunately the line number does not appear in TextEdit on a Mac – one why Jepad
    may be the better choice for an editor.


