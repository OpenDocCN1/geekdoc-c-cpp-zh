  md: 'Let’s look at this sorting example closely. First, the array is a text array
    with 7 values, initialized to the days of the week in chronological order. Next,
    there is a loop that traverses and outputs the array elements before they are
    sorted. Then there is a code block that uses nested for-loops – one inside the
    code block of another. Since i is already being used as a counter in the first
    (or outer) loop, we cannot use it again in the second (inner) loop without creating
    lots of confusion! So a new counter, j, is introduced. The two loops work together
    to compare two elements of the array, and swap them if they are out of order with
    respect to one another. The three lines of code with the variable temp are what
    calls swap code, because it swaps the contents of two elements of the array.


    Note that the inner loop starts j with the value i + 1 instead of zero. This is
    a critical feature of the sorting code block, and without this would not work
    correctly.


    The nested loops sort the text alphabetically, because of the statement if (day[i]
    > day[j]). To sort in reverse alphabetical order, use < instead of > In comparing
    text, remember that case matters. In the ASCII sequence, uppercase letters come
    before lowercase. So the word “Zebra” actually comes before “aardark”, since Z
    is ASCII code 90, and a is code 97. To make a case independent comparison, you
    could create temporary copies of day[i] and day[j], convert the copies to uppercase,
    and compare the uppercased copies in the if-statement.


    You could also compare based on text length instead of alphabetically. To do so,
    you would change the if-statement like this: if (day[i].length() > day[j].length())
    If you did this for your particular case, note that there are several ties – 4
    days have 6 letters in their names. Since we do not include in the if-statement
    how to handle ties, it’s left to the computer to decide.


    For sorting an array of ints named a, low-to-high, the ifstatement would be: if
    (a[i] > a[j]). Change the > to < for high-to-low. The only other thing that would
    change sorting ints is the data type of the temp variable – it must match the
    data type of the elements in the array.'
