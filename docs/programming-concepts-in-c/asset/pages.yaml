  md: '# Chapter 13. Keeping A List:

    Array-Based Lists


    What you need to know about array-based lists is that they are arrays in which
    not all of the elements are used, but are available for use in case they are needed.
    A new, separate int is used to track how many of the elements are actually in
    use at any time. Unlike previous chapters, the purpose of this chapter is not
    to train you in the use of this programming feature It is instead an opportunity
    to introduce concepts that you will run into if you go further in your study of
    computer science, and to provide a way to practice the programming features we
    studied in preceding chapters.


    A “list” is a collection of values – usually objects, but they can be whole numbers
    or floating points or text. The C++ language allows the data types for these to
    be different from one another, even in the same collection! This concept is that
    of a “bag”, which can contain lots of different items. But for purposes of our
    study in this book, we will consider collections of data types only.


    A list can be “empty” – that is, it can have zero values stored in it. Lists can
    grow in size by adding values, and shrink by taking them away. By contrast, the
    arrays that we studied in chapter 11 were fixed, non-zero size, and each element
    had a value. So there are similarities and differences between arrays and lists.
    For example, with an array or a list, we could store test scores. But with a list
    we could find lowest test score and remove it, or add a new score for a late assignment.


    There are several ways to represent lists in computers, and we will study these
    in this and the remaining chapters. One way is to use arrays, and that’s the subject
    of this chapter.


    # 13.1 Array-Based Lists


    Arrays are sized when they are created, and we normally consider all of their
    elements to be assigned valid values. An “array-based list” takes the idea of
    an array, but considers that the elements'
  merge: -1
