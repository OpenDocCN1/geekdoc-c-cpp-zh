    # 6.5.1 Infinite Loops


    As already mentioned, what we created in the above example is called an infinite
    loop, because it repeats over and over to infinity. There is no way to end the
    program normally. CTRL-C (or control-C) ends it, but ends the program, not just
    the loop. If there were any more code after the loop to be processed, it would
    be skipped upon CTRL-C (or control-C).


    You don’t want your program to get stuck in an infinite loop. You need to design
    a way out of the loop that does not kill the program, and that’s where the “if-break”
    comes in.


