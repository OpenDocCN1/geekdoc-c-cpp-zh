  md: '# 14.3 Building A Linked List


    Nodes can easily be added and removed anywhere in a linked list. But in this book
    we only show how to add and remove nodes at the front of a list, leaving other
    linked list features for future study.


    # 14.3.1 Adding A Node To A Linked List


    There are 3 steps to adding a node. The first is to create the node. The second
    is to assign values to the node''s data fields – all but its next-link. The last
    is to link the new node into the list.


    Here''s the code for creating and adding a node:


    ![](img/80b9ed561fa57ed72adb64b305ef946d_220_0.png)


    Student* s = new Student; is something we have not seen before. It''s kind of
    like a dynamically sized array declaration, but there are no square brackets and
    no size specification.


    Why didn''t we create the node the same way we create objects, like this: s? It
    has to do with how memory works in C++, and the fact that objects declared inside
    a loop''s curly-brace container are temporary, while nodes need to be more permanent.
    You could actually code it like this, and it would compile, but would lead to
    very nasty memory errors when the program runs.


    And what''s with the “arrow” symbol? We know s.name and s.next, but what''s s->name
    and s->next? Here is a C++ rule: if s is declared with a * use the arrow instead
