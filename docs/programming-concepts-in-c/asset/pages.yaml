    # 9.1.2 Bits And Negative Numbers


    So our hand can simulate a byte of computer memory, and store numbers from 0 to
    31 or more, depending on how many hands we use. But what about negative numbers?
    There is one obvious solution – use one finger to track whether the number is
    positive or negative – a “sign bit”. But this idea is just a little bit wasteful,
    because it results in two ways to represent zero – plus zero and minus zero! A
    better solution is to make the largest bit represent the negative of its normal
    value instead of +16. That is, let the thumb in a one-hand number be -16. Then
    all fingers except the thumb represents 15 (that is, 1 + 2 + 4 + 8), thumb only
    represents -16, thumb and pinky is -15, etc.


    If we use two hands, the 16 thumb would go back to +16, and the thumb of the *second*
    hand would go negative (-512, actually).


    Whole numbers are done this way in computers. The whole data type `int` uses 4
    bytes for a total of 32 bits in *most* of today’s C++ compilers. It can represent
    numbers in the range -2,147,483,648 to 2,147,483,647. The reason that computer
    languages have additional data types for whole numbers besides `int` is that the
    other data types use different numbers of bytes, and therefore have different
    ranges!


