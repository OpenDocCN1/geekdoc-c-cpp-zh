  md: '# PROGRAMMING CONCEPTS in C++


    A switch is called a bit, and it is made out of several electrical components
    — resistors and transistors combined in a circuit. By applying an electrical pulse
    to the circuit that comprises one bit, it can be placed into one of two possible
    states, which represent "on" and "off".


    So how can a computer store a number, which has more than two possible values?
    Well, remember when you learned to count on your fingers? Each finger can be held
    up or down to represent or off. By combining all ten fingers of both hands, you
    could group fingers in various ways to represent numbers in the range of 0 to
    10. Computers do something like this.


    # 9.1.1 Bits And Counting


    Computers group bits together in order to get past the zero-one range limitation.
    Just like our hands group our fingers in sets of five, computers (typically) group
    bits in sets of eight – a set of 8 bits is called a byte.


    On the fingers of one hand you learned to count from zero to five, and so you
    might think that a byte can be used to count from zero to eight. But computer
    designers realized that we were not using our 5 fingers very efficiently. Consider
    this: there are multiple ways to represent the number two, depending on which
    two fingers you hold up or down represent a different number? What if every possible
    combination of fingers held up or down represented a different number? There are
    32 (that is, 2 x 2 x 2 x 2 x 2) unique combinations, ranging from all fingers
    down to all fingers up. We could actually count from 0 to 31 on the fingers of
    one hand if we assigned a unique number to each unique finger configuration. (Pinky-up
    could be 1, ring-finger-up could be 2, pinky-up and index-finger-up could be 9,
    etc.) Extend this idea to two hands, and we can count over 1000 – now that''s
    efficiency!


    Here''s how to do this: assign the value 1 to your pinky, 2 to your ring finger,
    4 to your middle finger, 8 to your index finger, and 16 to your thumb. (The key
    is to start with 1 and double it each time). For any finger held up, add its value
    to the total. For example, pinky and ring finger both up is 3 (that is, 1 + 2).
