  md: '# Chapter 1. Programming Concepts


    Programmers give instructions to computers in the form of “computer programs”.
    Internet Explorer, Firefox, Word, Angry Birds, TurboTax, AutoCAD, etc., are all
    computer programs. They were developed by programmers and are used by other people
    to convert their typed, touched, spoken, clicked, and pasted input into some useful
    or entertaining format of output. The activity whereby programmers actually create
    computer programs is called “programming”.


    Programming involves three main steps: (1) understanding the problem to be solved,
    (2) writing computer “code” in a human-friendly computer language, and (3) translating
    the code into computer-readable form (like the 0s and 1s you see in science fiction
    movies). The first step is where human intelligence comes in – you certainly must
    understand something before you can explain it to someone else, like a computer.
    The second step involves using another computer program known as “editor” to write
    in a computer language, like Basic, C, C++, C#, Java, PHP, Python, etc. The last
    step involves using another computer program known as a “compiler”. In this book
    you will learn these three steps.


    # 1.1 The First Step, Understanding


    Alas, this is the part that new programming students tend to minimize and overlook.
    As a result, they end up creating very simple programs after a couple of months
    of study, but are unable to progress beyond that skill level. This happens because
    the first examples of programming and the first assignments are usually very easy
    problems (like “add two and two”), and to spend any time thinking about how such
    problems seems ludicrous. It’s just easier to learn the mechanics of code editing
    and compiling without having to devise solutions to complicated problems. So we
    tend to skip directly to the second step, code editing.


    This works for a while, but eventually the problems get a bit harder (like “count
    the number of test scores that are above the average”).'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# ROBERT BURNS


    That’s when we get stuck, because we never developed the habit of thinking, understanding,
    and planning *before* coding begins.


    So here’s a compromise: we will not focus on understanding at first, so as not
    to dismiss the concept due to its apparent irrelevance. But later on in this book,
    when the solutions to problems are no longer obvious, the discipline of understanding
    and planning will be reintroduced in the form of “algorithms”.


    # 1.2 Editors


    An “editor” is a program used by programmers to write computer code. Code is a
    set of instructions that tells the computer how collect input, process it, and
    express the results as output. These instructions are not exactly written in English,
    although they do resemble instruction sets you may have seen in cooking (also
    known as “recipes”) or after you buy something that has “some assembly required”.


    Code is written in a “computer language”. Computer languages are *simplified*
    and *strict* versions of English. They are simplified in the sense that they include
    a *very small* subset of words from the English language, such as “if”, “while”,
    “for”, “break”, “continue”, and only a hundred or so others. Computer languages
    are also strict in the sense that you have to say things and punctuate things
    *just right*, or the computer will not understand you. You even have to spell
    precisely, and use uppercase where you are supposed to, and use lowercase where
    you are supposed to, or the computer will not know what you are talking about!
    It takes *intelligence* to understand nuances of language, like accents, mispronunciations,
    incorrect choice of words, and misspellings – and remember that it’s the *humans*
    who have the intelligence here, and not the computers.


    There are three categories of editors that are typically used for programming,
    as explained below: general-purpose text editors, code editors, and IDE editors.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# 1.2.1 Text Editors


    Using the vocabulary and grammar of a computer language, programmers type instructions
    in an editor. Any text editor will do, including Windows Notepad, UNIX or Linux
    vi, and Apple macOS TextEdit. These are general-purpose text editors, not specifically
    designed for coding, but they work fine.


    Word, Pages, and other editors capable of “rich text formatting” are not very
    suitable for coding. They are page-oriented, and they embed formatting information
    into the files they produce. While it is possible to configure these editors for
    text editing, it is better to avoid them.


    # 1.2.2 Code Editors


    Code editors are special-purpose text editors created specifically for coding.
    Code editors may include useful features as code templates, line numbers, and
    syntax highlighting. Many code editors are available on the Internet for free
    download and installation, or for a reasonable price. Popular ones include Notepad++,
    Bluefish, TextWrangler, Emacs, Crimson, jEdit, JNotePad, to name a few.


    # 1.2.3 IDEs


    Finally there are the editors that are bundled with high-powered, interactive
    development environments, or “IDEs” for short. Expensive, extensive products such
    as Microsoft Visual Studio is sold to C++ and C# programmers, Xinos JCreator is
    sold to Java programmers, and there are many competing products. There are also
    free IDEs, such as Code::Blocks, Bloodshed Dev-C++, and Eclipse. These have some
    very useful features to help programmers, such as visual drag-and-drop development
    interfaces, and one-button compile-run.


    IDEs are the most complicated of the editor choices, and beginners really should
    avoid them. It’s possible for an introductory computer course using an IDE to
    be too much about the tool of the subject: programming concepts. So while any
    editor choice is acceptable for use you follow this book, the examples shown here
    use the Windows PC Notepad text editor and Apple Mac TextEdit, configured for
    programming.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# ROBERT Burns


    # ## 1.3 compiler


    A “compiler” is used by programmers to convert human-programmer-readable code
    into computer programs. Code is saved to disk files, just as any other typed document.
    The name of the file (ending in .cpp) identifies the file as containing computer
    code. Programs are also created as disk files. So a compiler is a computer program
    that takes as its input a text file, and produces as its output another file called
    a “program file” or “executable”, typically ending in .exe on PCs and .app on
    Macs.


    And, yes – a programmer wrote the compiler program, which raises the chicken-and-the-egg
    question, but we won’t get into that here.


    Each compiler is designed specifically to work with a certain computer language.
    Hence there are C++ compilers and Java compilers, as well as compilers for every
    other language. So in order for you to compile, you will need to find and install
    a compiler program. Instructions for doing this are included elsewhere in this
    book.


    # ## 1.4 Elements Of Computer Languages


    Before you can type anything useful into an editor and save it to a file to be
    compiled, you need to know some basics about computer languages. There are programming
    concepts that are common to all computer languages, and it would be nice to write
    an introductory book like this at the conceptual level instead of focusing on
    a specific language. But it is impractical to do so. We cannot get very far without
    typing some code, and that means choosing a language in which to work. C++ is
    the language used in this book.


    # ### 1.4.1 Statements And Expressions


    A good way to explain the basic elements of computer languages is to compare them
    to the written English language. Text written in the English language consists
    of *sentences*; computer code consists'
