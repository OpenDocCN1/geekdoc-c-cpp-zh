    \ C++ like you'd expect. Only the first statement, indented or not, belongs to\
    \ the if-statement. All the others are treated as if they were not indented at\
    \ all.\n\nTo include multiple lines, put them in a curly-brace container and put\
    \ that right below the if-statement (or below the else) instead of one indented\
    \ statement. It’s still a good idea to indent all the statements inside the container\
    \ anyway, but only because it’s easier for humans to read. Here’s an example:\n\
