  md: '# 4.2 Formatting Output


    Computer calculations are accurate. They are so accurate that computers feel they
    have to show all the digits behind the decimal. Consider 10.0 / 3 – the result
    is 3.33333.... The computer likes to show all the 3''s that it has, up to C++s
    default limit of 6 total digits. But you can force the computer to round off numbers
    and show them with a desired number of digits after the decimal. Here''s how:


    First, use the include statement #include <iomanip> to attach the iomanip expansion
    library. Then use the statement cout.setf(ios::fixed|ios::showpoint); before the
    first rounded-off value appears in a cout statement. Do this just once, because
    once it appears in a cout statement, it is a permanent change for the rest of
    the program. Finally, use the statement cout << setprecision(2); so that all values
    sent to output after setprecision will be rounded to 2 digits after the decimal
    point. You can change this at any time by using another setprecision with another
    digit in the parentheses.


    You can even use formatting to round to the nearest whole number. For that, it''s
    cout.setf(ios::fixed); without showpoint and cout << setprecision(0);


    But note that formatting applies only to the appearance of a number when it appears
    in the output. It does not affect its actual value as stored in the program''s
    memory.


    Here''s the amortization calculation, with formatted output. Normally we do not
    apply formatting to echoes of input values – echo means to send an input value
    to output.'
