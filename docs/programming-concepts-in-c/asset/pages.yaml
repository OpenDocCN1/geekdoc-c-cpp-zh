  md: '# 4.3.1 Conversion Statements


    The C++ function calls in the above table are all *expressions*. They are not
    stand-alone statements – it’s important to understand the difference! They resolve
    to *new values* – they do not modify the original value stored in the variable.
    In order to change a stored value, you need to use an expression in an assignment
    statement, as in these examples:


    | Statement | Explanation |

    |---|---|

    | x = toupper(x); | replaces the char stored in x with its uppercase version;
    no effect if x''s value is not in the range a-z |

    | x = toulower(x); | replaces the char stored in x with its lowercase version;
    no effect if x''s value is not in the range A-Z |

    | x = abs(x); | replaces the int stored in x with its absolute value; no effect
    if x''s value already non-negative |

    | x = fabs(x); | replaces the double stored in x with its absolute value; no effect
    if x''s value already non-negative |


    Note that **toupper(x)** and **tolower(x)** work only for **char** values and
    variables. They do *not* work for **string** values or variables. A procedure
    for converting the case of a **string** will be presented in a later chapter of
