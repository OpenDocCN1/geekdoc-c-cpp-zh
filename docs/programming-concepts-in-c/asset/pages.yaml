  md: '# PROGRAMMING CONCEPTS IN C++


    # The Second Edition


    Besides correcting typos from the first edition, this second edition replaces
    the Microsoft Visual Studio compiler with an open source C++ compiler. it''s a
    much easier and lighter install, and it allows the command-line compiler commands
    to be consistent between PCs and Macs. It also makes the command-line experience
    nearly the same among systems (PC and Mac) and languages (C++, Java, and Python
    – the languages in this book series) so that the focus can be on concepts instead
    of logistics.


    This new edition is also more Mac friendly – it includes screenshots from both
    PC and Mac examples.


    The e-book''s code listings are now hyperlinks to copy/pasteable code, so students
    don''t have to type every keystroke of every sample code listing. The Java and
    Python editions of the e-book had this feature, but the 1st C++ edition did not.


    Another change is that references to the command-line commands `cl` and `g++`
    are both now just `c++`.


    # Unique Features Of This Book


    Unlike many of today''s introductory textbooks, this book does not jump into object-oriented
    programming right away. Objects are introduced and used, particularly for such
    language features as input/output. Objects that encapsulate data are presented
    as variables that store multiple values at the same time. A development of objects
    that encapsulate data and code interact with other objects is specifically avoided.
    Instead, the focus is on the fundamental concepts of data, statements, expressions,
    and flow of control. These need to be well-understood in order to be used in the
    programming of classes and objects anyway, rather than making the student pick
    up both concepts at once, objects are left for another, later level of study.


    Emphas is on command-line compiling instead of IDEs, because it is a lowest common
    denominator of programming. In this way, C++ program development is consistent
    among different systems'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'such as PCs, Macs, and UNIX/Linux. But just about ANY IDE can be used in following
    this book, if that is the instructor’s or student’s choice. But because an IDE
    usually combines the editing and compiling into a single program, it’s likely
    that the unique separation of these programming steps will be lost in the beginning
    student. Command-line compiling makes the student more aware of the files and
    folders used on the host system, and differences among operating systems become
    not so great.


    This book makes a distinction between **expressions and statements**. Expressions
    are the building blocks of statements, and as such, they individually and separately
    resolve to simple values that get be substituted in full statements. They are
    likened to “phases” in the spoken language. Language elements that are expressions
    are specifically pointed out, and are specially denoted — for example, $x + y$.
    Full statements, usually ending in a semicolon, are likened to “sentences” in
    the spoken language. They are noted like this: $x = 1$;


    It may be surprising to see **linked lists, collections, and recursion** addressed
    in the later chapters. But the purpose is *not* to make the student proficient
    in the use or understanding of these concepts. Rather it is to provide a vehicle
    for practicing what was learned about variables, branching, loops, functions,
    arrays, and objects. And in doing so, the student is also introduced to ideas
    that will reappear in future studies in computer science, and be better prepared
    to learn them at that time.


    This book is available in both **e-book and printed formats**, and supported by
    online publication of coding examples, sample assignments, and instructional how-to
    videos. URLs and links appear at the ends of chapters 1-14, where one might normally
    expect to find review questions and exercises. Go to www.rdb3.com/cpp/ebook for
    tips on navigating the e-book.


    There are code listings throughout this book. Some have larger fonts than others,
    depending on what it takes to fit them on a page. Be sure to use the URLs at the
    ends of each chapter, because they provide provide access to the full copy/pasteable/zoomable
    version of'
