  md: "# Identifiers\n\nBoth Visual Basic and C# use a common set of identifier naming\
    \ rules, allowing for a mixture of letters, digits, and underscores, with some\
    \ limitations, such as not starting an identifier with a digit.\n\nIn Visual Basic,\
    \ identifiers are case-insensitive. Two VB identifiers are identical if they are\
    \ the same when converted to all lower-case letters. Identifiers in C# are case-sensitive.\
    \ Two variables customerName and CustomerName in the same method would not conflict\
    \ since the first letter is a different case. It is possible to create an assembly\
    \ in C# with two exposed type or member names that differ only by case. Such naming\
    \ would cause problems when consumed by a Visual Basic project, although VB does\
    \ have rules that attempt to access the most accessible element when there is\
    \ a conflict.\n\nVisual Basic allows you to give the same (case-insensitive) name\
    \ to a type and one of its members.\n\n```\n***** This is valid in Visual Basic.\n\
    Public Class ItemData\n    Public ItemText As String\n    Public ItemData As Long\n\
    End Class\n```\n\nC# does not allow this combination. You must not name a type\
    \ member the same as its enclosing type in C#. If you create a Visual Basic assembly\
    \ that has this shared naming of type and member, a C# project will not be able\
    \ to access the member directly.\n\nBoth languages allow you to create identifiers\
    \ that conflict with reserved language keywords. To use such identifiers, surround\
    \ them with square brackets in Visual Basic, or prefix them with the @ symbol\
    \ in C#.\n\n```\nDim [For] As Long = 0&\nC#nlong @for = 0;\n```\n\nMicrosoft recommends\
    \ that identifier names are either Pascal-cased or camel-cased. In Pascal casing,\
    \ every distinct word within the name has an initial capital, including the start\
    \ of the identifier. Camel casing is similar, but the initial letter is lowercase.\n\
    \n```\nint PascalCaseExample;\n```"
  merge: -1
  pgno: 301
- img_proc: true
  md: "```\nint camelCaseExample;\n```\n\nAs indicated in Visual Studio’s documentation,\
    \ camel casing is recommended for parameter names, local variable names, and protected\
    \ instance fields within types. All other identifiers, including line labels,\
    \ should use Pascal casing.\n\n# If Statement\n\nC#’s if statement closely parallels\
    \ the If statement in Visual Basic.\n\n```\nVISUAL BASIC\nIf (testDate < Now)\
    \ Then\n  era = \"Past\"\nElseIf (testDate = Now) Then\n  era = \"Present\"\n\
    Else\n  era = \"Future\"\nEnd If\n```\n\n```\nC#\nif (testDate < DateTime.Now)\n\
    \  era = \"Past\"\nelse if (testDate == DateTime.Now)\n  era = \"Present\"\nelse\n\
    \  era = \"Future\";\n```\n\nEach condition in C# begins with if or else (two\
    \ words), and appears within a set of parentheses. While Visual Basic needs a\
    \ terminating End If clause, C# has no such ending marker.\n\nVisual Basic’s condensed\
    \ statement, where the Then and Else parts appear in a single logical line, can\
    \ be replicated in C#. However, this is the only case because of C#’s flexibility\
    \ with whitespace, and not due to any special syntax construction.\n\n```\nVISUAL\
    \ BASIC\n------ Simple If with no Else component.\nIf problemOccurred Then ErrorField.Visible\
    \ = True\n\n------ Simple If with Else component.\nIf (IsValid(zipCode) = True)\
    \ Then\n  city = GetZipCity(zipCode) else city = \"Unknown\";\n```\n\n```\nC#\n\
    // Simple if with no else component.\nif (problemOccurred) ErrorField.Visible\
    \ = true;\n\n// Simple if with else component.\nif (IsValid(zipCode) == true)\
    \ city =\n  GetZipCity(zipCode); else city = \"Unknown\";\n```"
