    \ Shared modifier, tying each member to the class itself instead of each specific\
    \ instance.\n\n```\nVISUAL BASIC\nModule UsefulFunctions\n    Public Function\
    \ Reverse(ByVal originalText As String) - \n    As String\n        Dim buffer()\
    \ As Char\n        If (originalText Is Nothing) Then\n            Return \"\"\n\
    \        Else\n            buffer = originalText.ToCharArray()\n            Array.Reverse(buffer)\n\
    \            Return New String(buffer)\n        End If\n    End Function\nEnd\
    \ Module\n```\n\n# C#\n\n```\nstatic class UsefulFunctions\n{\n    public static\
    \ string Reverse(string originalText)\n    {\n        char[] buffer;\n       \
    \ if (originalText == null)\n            return \"\"\n        else{\n        \
    \    buffer = originalText.ToCharArray();\n            Array.Reverse(buffer);\n\
    \            return new string(buffer);\n        }\n    }\n}\n```\n\nAs shown\
    \ in this example, the static modifier must be applied to each member.\n\n# New\
    \ with Visual Studio 2015\n\nWhen using module members in a Visual Basic application,\
    \ \"type promotion\" allows access to those members without including the module\
    \ name as a qualifier. Before its 2015 release, C# did not support such unqualified\
    \ usage;"
