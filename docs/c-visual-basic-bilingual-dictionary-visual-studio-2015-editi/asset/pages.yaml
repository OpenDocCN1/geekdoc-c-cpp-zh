    # Input Method


    Visual Basic''s Input reads content from a file opened with the FileOpen method.
    The method typically retrieves data previously written with the Write and WriteLine
    methods, that are structured, comma-delimited, and qualified with quotation marks
    or similar enveloping characters.


    C# does not have a direct equivalent for the Input statement, or for the entire
    Write and Input file management system. Instead, delimited files must be parsed
    manually by reading in each character and interpreting fields and lines appropriately.
    For sample code on how to read in such files, see the "OpenTextFieldParser Method"
    entry in Chapter 3.


    # InputBox Method


    C# does not include an equivalent for Visual Basic''s InputBox method. Internally,
    the Inputmethod creates a standard Form-derived instance with its own TextBox,
    Label, and Button controls. In C#, you would need to add a Custom Form to your
    project with the relevant controls. The code would have an instantiating routine
    similar to the following.


    ```

    C#

    public string InputBox(string prompt, string title = "",

    string defaultResponse = "", int xPos = -1);

    ```'
