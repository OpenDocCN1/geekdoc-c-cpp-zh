    For Sub methods that do not return a value, Visual Basic also supports the Exit
    Sub statement, which is functionally equivalent to Return, and the same as C#’s
    return statement.


    In Visual Basic Function methods that return a value, you can assign the return
    value to the name of the function instead of using the Return statement. This
    variation is not supported in C#. Instead, use the return statement to indicate
    the return value.


