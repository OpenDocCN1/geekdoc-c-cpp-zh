    Visual Basic

    Dim dateTime = #12/31/1999#

    ```


    ```

    C#nDateTime dateTime = new DateTime(1999, 12, 31);

    ```


    # Type Character

    When attached as a suffix to a numeric literal, Visual Basic’s # type character
    coerces the value to the Double data type. In C#, use the D or d suffix instead
    to coerce the value to the double data type.


    ```

    Visual Basic

    Dim value As Double = 123#

    ```'
