    ```\n\nSee Also\n\n# Query Expressions\n\n# Do Statement\n\nVisual Basic's Do\
    \ statement loop while (or until) a condition is true. The exit condition appears\
    \ as a While or Until clause, either at the top of the loop (after the Do keyword)\
    \ or the bottom (after the Loop keyword).\n\n```\nVISUAL BASIC\n' ----- Example\
    \ using While at bottom of loop\nDo\n    content = ProcessChunkOfContent(content)\n\
    While content.Length > 0\nLoop\n\n' ----- Example using Until at top of loop\n\
    Do Until content.Length = 0\n    content = ProcessChunkOfContent(content)\nLoop\n\
    ```\n\nC# includes two related statements, one with the condition at the top (the\
    \ while statement), and one with the condition at the bottom (the do statement).\
    \ The condition is always associated with the while clause; to emulate a VB Until\
    \ clause, negate the Boolean value of the condition.\n\n```\n// ----- Example\
    \ using condition at bottom of loop\ndo\n    content = ProcessChunkOfContent(content)\n\
    } while (content.Length > 0);\n\n// ----- Example using condition at top of loop\n\
