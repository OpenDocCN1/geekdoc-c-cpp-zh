  md: "operator, the TryCast operator, and .NET Framework features, such as those\
    \ from the System.Convert class.\n\nImplicit Conversions\nConversions from \"\
    smaller\" to \"larger\" data types, including overloaded conversions defined as\
    \ Widening (VB) or implicit (C#), occur automatically in both languages.\n\n#\
    \ Visual Basic\n\n```\nDim smallValue As Integer = 25\nDim largeValue As Long\
    \ = smallValue  ' Widening conversion\n```\n\n# C#\n\n```\nint smallValue = 25;\n\
    long largeValue = smallValue; // Implicit conversion\n```\n\nIn Visual Basic,\
    \ when the Option Strict Off statement is used at the file or project level, explicit\
    \ (narrowing) conversions can also occur automatically in code, although run-time\
    \ errors may result if the source data does not \"fit\" in the target.\n\n# Visual\
    \ Basic\n\n```\n----- At the top of the file.\nOption Strict Off\n```\n\n```\n\
    ----- In a method.\nDim largeValue As Long = 100000\nDim smallValue As Integer\
    \ = largeValue  ' Narrowing\n```\n\nWhen this non-strict mode, Visual Basic also\
    \ performs some string-to-number and number-to-string conversions automatically.\n\
    \n# Visual Basic\n\n```\n----- Assumes: Option Strict Off\nDim trueValue As Integer\
    \ = \"123\"  ' Auto-conversion\nDim trueString As Integer = 123  ' Auto-conversion\n\
    If (trueValue = trueString) Then\n----- VB performs the conversion and comparison\n\
    \  of the two variables automatically.\n  code will reach this conditional block.\n\
    End If\n```\n\nC# supports none of these \"enhanced\" implicit conversions. C#\
    \ has no equivalent for Option Strict Off, and all such non-strict conversions\
    \ must be performed explicitly, as described below.\n\nExplicit Conversions\n\
    For intrinsic values, Visual Basic offers built-in conversion functions, such\
    \ as Cint to convert an expression to an Integer.\n\n# Visual Basic"
