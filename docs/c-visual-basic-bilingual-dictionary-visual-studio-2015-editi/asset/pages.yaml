  md: '# Introduction


    # The Two Languages


    To paraphrase the renowned playwright George Bernard Shaw, C# and Visual Basic
    are two languages separated by a common Framework. As for syntax and target audience,
    Microsoft’s two programming systems seem so distant from each other. Despite that
    separation, they are complete equals when it comes to coding power, computational
    access, and automation of tasks that users need every day.


    VB claims as its grammatical lineage the first edition of BASIC, developed by
    John Kemeny and Thomas Kurtz in 1964 as a means of bringing ease and clarity to
    the software development process. Five years later, Dennis Ritchie began work
    on the C programming language—C#’s own progenitor—crafting a compiler that, according
    to his author, “more convenient and effective for many tasks than supposedly more
    powerful languages."


    In .NET, Microsoft brought together these two computing dialects—the simplicity
    of one software language designed for mortals, and the strength of a second language
    created to solve a large range of coding problems, from device drivers to word
    processors. The descendants of BASIC and C now sit together on the common foundation
    of the .NET Framework. From this shared resource, developers in both C# and Visual
    Basic have access to the same tools, the same platforms, and the same user communities.


    Yet they are not the same. Visual code loathes curly braces, and you have to look
    long and hard to see things spelt completely in C#. The languages share much in
    facilitating Rapid Application Development and harnessing powerful technologies
    such as ADO.NET and XAML. But the way they communicate through source code is
    quite different. That’s where book comes in.


    The C#-Visual Basic Bilingual Dictionary helps unify Visual Basic and C# by providing
    clear, functional equivalents for all syntax and feature differences between the
    two languages. This linking of the two grammars has never been more essential.'
