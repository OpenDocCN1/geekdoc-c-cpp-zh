    Continue Statement\n\nVisual Basic uses one of three distinct forms of its Continue\
    \ statement, depending on the containing loop type.\n\n+   * For and Each loops\
    \ use the Continue For statement.\n* Do loops use the Continue Do statement.\n\
    * While loops use the Continue While statement.\n\n```\nVISUAL BASIC\nFor counter\
    \ = 0 To 9\n  ---- Some code, then...\n  Continue For\n  ---- More code.\n```\n\
    \nNext counter"
