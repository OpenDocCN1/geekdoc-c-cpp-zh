  md: "```\nC# private static List<string> FindFiles(\n    string targetDirectory,\
    \ string searchText,\n    bool ignoreCase, System.IO.SearchOption depthType,\n\
    \    string fileMask = \"*.*\")\n{\n    List<string> results = new List<string>();\n\
    \    bool foundMatch;\n    string content;\n\n    foreach (string oneFile\n  \
    \  in System.IO.Directory.GetFiles(\n        targetDirectory, fileMask, depthType))\n\
    \    {\n        // WARNING: Large files could fill memory.\n        content =\
    \ System.IO.File.ReadAllText(oneFile);\n        if (ignoreCase)\n            foundMatch\
    \ = content.ToUpper().Contains(\n                searchText.ToUpper());\n    \
    \    else\n            foundMatch = content.Contains(searchText);\n        if\
    \ (foundMatch)\n            results.Add(oneFile);\n    }\n    return results;\n\
    }\n```\n\n# Forms Object\n\n+   ◆ My.Forms\n\nProvides access to any form within\
