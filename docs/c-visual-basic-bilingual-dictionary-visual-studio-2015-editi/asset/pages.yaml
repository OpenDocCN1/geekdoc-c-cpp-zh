    # Command Method


    Visual Basic''s Command method returns a single string that includes all command-line
    arguments used to initiate the application. In C#, use the command-line-related
    features of the System.Environment class to obtain the same content.


    ![](img/baa5394648ec27e4a1aa37d09958ab46_231_0.png)


    ```

    C#nstring result = string.Join(" ",nEnvironment.GetCommandLineArgs());

    ```


    The previous C# example strips redundant whitespace between arguments. If you
    need to access the raw command line text, including the program name, use the
    CommandLine property instead.


    ```

    C#nstring result = Environment.CommandLine;

    ```


    # Comments


    In Visual Basic, all comments begin with a comment marker, either the single quote
    symbol ('') or the REM keyword. The comment continues through the end of the physical
    line. C# includes this type of comment, with a pair of slash characters (//) used
    as the comment marker.


    ```

    C#n// This is a full-line comment.

    int counter; // A line-ending comment

    ```


    C# supports an alternate comment syntax that can span multiple lines, or appear
    in the middle of a line, surrounded by valid C# statements. Spans of content appear
    within a set of /* and * symbols.


    ```

    C#n/* ----- Here is a multi-line comment that ends

    when the closing comment symbol appears.

    */

    int /* A comment within a statement. */ counter;

    ```


    As with Visual Basic, C# does not support nested comments.'
