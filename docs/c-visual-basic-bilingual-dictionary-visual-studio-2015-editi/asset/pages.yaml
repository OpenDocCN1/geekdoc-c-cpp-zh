  md: "# XML Documentation Comments\n\nBoth Visual Basic and C# support XML comments\
    \ as a means of documenting code and prompting Visual Studio's IntelliSense to\
    \ display extended information about types and type members. In VB, these comments\
    \ begin with the \" symbol.\n\n```\nVISUAL BASIC\n  /// <summary>\n  /// Tracks\
    \ details about living creatures.\n  /// </summary>\nClass Animal\nEnd Class\n\
    ```\n\nIn C#, use the /// symbol instead.\n\n```\nC#\n/// <summary>\n/// Tracks\
    \ details about living creatures.\n/// </summary>\nclass Animal\n{\nn\n```\n\n\
    Although there is no multi-line comment syntax in Visual Basic, C# does not allow\
    \ XML comments within such blocks. Start the block with the /** symbol.\n\n```\n\
    C#\n/** <summary>\n*/\n```\n\nBoth languages use the same set of recommended XML\
    \ tags for documenting code. See Microsoft's MSDN documentation for information\
    \ on using these tags in your projects.\n\n# XML Literals\n\nThere is no direct\
    \ equivalent for Visual Basic's XML Literals in C#. Instead, you must use the\
    \ various .NET Framework XML-specific classes to manipulate XML content, or process\
    \ content yourself using string and file-access features.\n\n# Xor Exclusive-Or\
    \ Operator\n\nC#'s ^ exclusive-or operator is an exact replacement for Visual\
    \ Basic's Xor operator, both for integer and Boolean operands.\n\n```\nVISUAL\
    \ BASIC\n  currentState = currentState Xor newInput\nC#\n```"
