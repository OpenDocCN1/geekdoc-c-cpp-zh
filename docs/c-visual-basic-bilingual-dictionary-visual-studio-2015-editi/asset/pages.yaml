    \ = Year(oneOrder.OrderDate)\n```\n\n```\nC#nint whichYear = oneOrder.OrderDate.Year;\n\
    ```\n\n# Yield Statement\n\nWhen defining a method iterator or get-accessor iterator\
    \ with the Iterator\nmodifier, Visual Basic's Yield statement identifies the next\
    \ value to emit.\nThe standard Return statement (or the older Exit Function and\
    \ Exit Property\nstatements) aborts an iterator early, before any other logic\
    \ in the iterator code\nan.\n\n```\nVISUAL BASIC\n' Assumes a LimitedEdition value\
    \ defined elsewhere.\nPublic Iterator Function SmallNumbers() As\n  IEnumerable(Of\
    \ Integer)\n  Yield 1\n  Yield 2\n  Yield 3\n  If (LimitedEdition) Then Return\n\
    \  Yield 4\n  Yield 5\nEnd Function\n```\n\nIn#, the yield return statement returns\
    \ the next iterator value, and appears\nin a method or property that returns IEnumerable,\
    \ IEnumerator, or their\ngener variations. C#'s break statement takes the place\
    \ of VB's Return\nstatement within the context of an iterator.\n\n```\nC#\n//\
    \ Assumes a LimitedEdition value defined elsewhere.\npublic IEnumerable<int> SmallNumbers()\n\
    {\n  yield return 1;\n  yield return 2;\n  yield return 3;\n  if (LimitedEdition)\n\
    \    yield break;\n  yield return 4;\n  yield return 5;\n}\n```\n\nVisual Basic\
    \ allows Try statements that contain Yield statements to use both\nCatch and Finally\
    \ clauses. If a yield statement appears in a C# try statement,"
