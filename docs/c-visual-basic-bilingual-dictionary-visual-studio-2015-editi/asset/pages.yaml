  md: '# AssignmentHands Operators


    & Address Operator

    Visual Basic does not include direct support for pointer operations, and therefore
    does not include an operator that establishes a fixed address for an object.


    See Also


    +   * Pointers

    * & Conjunction Operator


    In general, Visual Basic''s And operator is identical to C#''s & operator, both
    for integer (bitwise) and Boolean (logical) operations.


    ```

    C#nbool clapClaps = (happy & knowIt);

    ```


    VISUAL BASIC

    Dim cHands As Boolean = (happy And knowIt)

    When applying Option Strict Off to a Visual Basic project or source file, the
    And operator with one integer operand and one Boolean operand forces the Boolean
    value to an integer (or l1), and then performs a bitwise operation. C# does not
    allow this mixture of operand types.


    Visual Basic does include its own & operator. However, it is used for string concatenation;
    it does not process logical or bitwise operations.


    && Conjunction Operator

    Visual Basic''s AndAlso operator is identical to C#''s && short-circuiting conjunction
    operator.


    ```

    C#nif ((result != null) && (result.Length > 10))

    VISUAL BASIC

    If ((result Is Not Nothing) AndAlso

    (result.Length > 10)) Then

    ```


    &= Assignment Operator

    Visual Basic does not include an equivalent for C#''s &= operator. You must perform
    the conjunction(And) and assignment operations separately in VB.


    ```

    C#nfinalSet &= testFlag;

    VISUAL BASIC

    finalSet = finalSet And TestFlag

    ```'
