    \ counter As Integer\nFor counter = 0 To 9\nNext counter\n\nThe loop counter in\
    \ the VB statement can be integer (Byte, Short, Integer, or Long, or their signed\
    \ and unsigned counterparts), a floating-point variable (Single, Double, Decimal),\
    \ or an enumeration. If you have another type that has overloaded the +, <=, >=;\
