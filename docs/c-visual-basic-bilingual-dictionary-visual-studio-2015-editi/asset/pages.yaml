    # / Division Operator


    Visual Basic''s / division operator returns a floating-point quotient.


    ```

    VISUAL BASIC

    Dim wholeResult1 As Double = 5 / 3    '' 1.666666...

    Dim wholeResult2 As Double = 6 / 3    '' 2.0

    Dim realResult As Single = 5! / 3!    '' 1.666666...

    ```


    In most cases, VB''s division operator returns a type of Double, even with integer
    operands. If one operand is Single and the other is non-Double, the result is
    Single. If one operand is Decimal and the other is anything other than Single
    or Double, the result is Decimal.


    C# also includes a / operator. It handles numeric division for both integer and
    floating-point values (and for other types when used with operator overloading).


    ```

    C#nint wholeResult1 = 5 / 3;      // 1

    int wholeResult2 = 6 / 3;      // 2

    float realResult = 5f / 3f;    // 1.666666...

    ```


    The return type in C# generally follows the type of the operands. The operands
    are coerced into the same type before the division takes place. For integer division,
    floating-point values, rounding always leans toward zero.'
