    \ result =\nSystem.Threading.Thread.CurrentUICulture;\n```\n\n# UnhandledExceptionEvent\n\
    \n◆ My.Application.UnhandledException\nCatches unhandled exceptions within a Windows\
    \ Forms application that\nVB's Windows Forms Application Framework.\n\n```\nVISUAL\
    \ BASIC\nPublic Sub Me_UnhandledException(ByVal sender As Object,\nByVal e As\
    \ UnhandledExceptionEventArgs) -\nHandles Me.UnhandledException\n    '----- Relevant\
    \ error-handling code here.\nEnd Sub\n```\n\nThe UnhandledExceptionEvent is only\
    \ available in VB programs that employ\nthe Windows Forms Application Framework.\
    \ However, you can manage\nunhandled exceptions in any application by adding a\
    \ handler to the\nUnhandledExceptionEvent for the current application domain.\n\
    \n```\nC#nstatic void SurpriseProblem(object sender,\nUnhandledExceptionEventArgs\
    \ e)\n{\n    // ----- Relevant error-handling code here.\n}\n```\n\n```\n// In\
    \ your main routine, before running the core\n// program logic.\nAppDomain.CurrentDomain.UnhandledException\
    \ +=\nSurpriseProblem;\n```\n\nYou can also add a thread-specific handler that\
    \ monitors unhandled\nexceptions in your main (UI) thread.\n\n```\nC#nstatic void\
    \ ThreadProblem(object sender,\nSystem.Threading.ThreadExceptionEventArgs e)\n\
    {\n    // ----- Relevant error-handling code here..\n```"
