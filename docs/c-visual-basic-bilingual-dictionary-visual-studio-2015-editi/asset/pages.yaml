  md: '# Punctuator, Arguments and Parameters


    :: Namespace Alias Qualifier

    C#, the global:: prefix indicates that some fully qualified namespace, type, or
    member name starts at the root of the namespace hierarchy, removing ambiguity
    between similarly named library members.


    ```

    C#

    // ----- Perhaps defined a MyApp.System.Exception

    //      class in your application''s code. This makes

    //      it clear you want NET''s Exception class.

    global::System.Exception theProblem;

    ```


    In Visual Basic, use Global as the first component of the fully qualified type
    member path to make it clear that the path begins at the namespace root.


    ```

    Visual Basic

    Dim theProblem Global.System.Exception

    ```


    In C#, you can define other namespace aliases that can appear in place of “global”.
    This allows your code to reference methods from external assemblies, when used
    in conjunction with the external alias statement. This use of the namespace alias
    qualifier has no equivalent in Visual Basic.


    # ; Statement Termination Character


    Complete C# statements end with the ; statement termination character, allowing
    a single statement to flow across many lines as desired. In Visual Basic, statements
    terminate at the end of a physical line, unless there is some indication that
    the statement must continue onto the next physical line.


    ```

    Visual Basic

    result = DoSomeWork(withThisData) <-- Ends here

    ```


    The traditional VB way to continue a statement onto a subsequent line is to end
    the physical line with the _ line continuation character (with at least one space
    before it).


    ```

    Visual Basic

    result = DoSomeWork(withThisData)

    + SomeExtraWork(withMoreData)

    ```


    Visual Basic 2010 introduced implicit line continuation, where the syntax of the
    statement provides hints as to whether a line will continue onto the next physical
    line. For instance, ending a line with a comma from an argument indicates that
    the remaining arguments are on the next line.


    ```

    Visual Basic

    result = DoAdvancedWork(withThisData,

    evenMoreData)

    ```'
