  md: "# Main Method\n\nIn both Visual Basic and C#, an application uses a Main method\
    \ as the program’s entry point. These routines are always Shared (VB, although\
    \ the Shared modifier is assumed if the method appears in a Module) or static\
    \ (C#), return either no result (Sub or void) or an integer, and can be defined\
    \ with one argument, an array of command line strings. C# allows these methods\
    \ to be private, although this is not allowed in Visual Basic.\n\n```\nVISUAL\
    \ BASIC\n' --- Plain version with no return or arguments.\nShared Friend Sub Main()\n\
    End Sub\n\n' ---- Version with both a return code and arguments.\nShared Friend\
    \ Function Main(\nByVal cmdArgs() As String) As Integer\nEnd Function\n```\n\n\
    ```\nC#\n// ---- Plain version with no return or arguments.\nstatic void Main()\n\
    }\n\n// --- Version with both a return code and arguments.\nstatic int Main(string[]\
    \ args)\n}\n```\n\nIn Visual Basic Windows Forms applications, a form can be defined\
    \ as the startup object, and in the absence of a Main method, the compiler will\
    \ provide one. In C#, you must supply the method yourself, and identify it through\
    \ the Project Properties. In C# Windows Forms applications, the Main method must\
    \ be decorated with the STATThread attribute, something that the Visual Basic\
    \ compiler provides behind the scenes.\n\n```\nC#\n[STATThread] static void Main()\n\
    ```\n\nIn a Windows Forms application in C#, you must display the main form manually\
    \ through the code in the Main method.\n\n```\nC#\nstatic void Main()\n{\n   \
    \ Application.Run(new Form1());\n}\n```\n\nAn application normally exits when\
    \ it reaches the end of the Main method."
