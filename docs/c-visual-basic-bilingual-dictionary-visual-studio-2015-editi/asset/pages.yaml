    # Right Method


    Visual Basic''s Right method returns the rightmost characters of a source string.
    Use the Substring method of C#''s string class to return similar content.


    ```

    VISUAL BASIC

    '' Return last two characters.

    Dim cents As String = Right(dollarsAndCents, 2)

    C#

    // Return last two characters.

    string cents = dollarsAndCents.Length - 2, 2;

    ```


    The Right method will silently return the string if the length requested exceeds
    the full length of the string. In C#, the Substring method will throw an exception
    if the starting position or length requested is too long. Always verify the length
    of the string before using the Substring method.


