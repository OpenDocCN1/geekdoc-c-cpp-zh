    # Unlock Method


    Visual Basic''s Unlock method unlocks a previously locked portion of a file opened
    with the FileOpen method. Optional arguments indicate the starting and ending
    bytes or records to unlock. All positions are 1-based.


    VISUAL BASIC


    ```

    -- Unlock the whole file.

    Unlock(fileNumber)

    ```


    ```

    -- Unlock one byte or record.

    Unlock(fileNumber, targetPosition)

    ```


    ```

    -- Unlock a range of bytes or records.

    Unlock(fileNumber, startPosition, stopPosition)

    ```


    C# does not include the same file-management features included with VB. Instead,
    it is common to work with the System.IO.FileSystem class to read and write files.
    This class includes an Unlock method that is similar to VB''s Unlock method. The
    key differences are that the FileStream''s Unlock method only identifies byte
    positions and not record positions, and its positions are o-based. Also, when
    specifying a range of data to unlock, the final argument to the stream''s method
    indicates the length of the lock, not the final position of the lock.


    ```

    // Unlock the whole file.

    openedStream.Unlock(0, openedStream.Length)

    ```


    ```

    -- Unlock one byte.

    openedStream.Unlock(targetPosition - 1, 1)

    ```


    ```

    -- Unlock a range of bytes.

    openedStream.Unlock(startPosition - 1,

    stopPosition - startPosition + 1)

    ```


