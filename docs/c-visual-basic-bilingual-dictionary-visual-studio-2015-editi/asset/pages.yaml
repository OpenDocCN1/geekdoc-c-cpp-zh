    # Query Expressions (LINQ)


    Both Visual Basic and C# include native support for many features of LINQ. Each
    language includes a set of query operators, and many of them have counterparts
    in the other language. The following table lists the methods supported by LINQ''s
    Queryable class, and indicates the equivalent query operator available within
    each language.


