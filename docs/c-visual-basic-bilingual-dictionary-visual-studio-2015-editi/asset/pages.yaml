  md: '# uint Data Type


    Visual Basic''s intrinsic UInteger data type is identical to C#''s uint data type.
    Both types are aliases for .NET''s System.Uint32 type. For unsigned integer literals,
    C# uses a U or ou suffix after the value; in Visual Basic, use Ui or ui instead.


    ```

    C#nuint counter = 0;


    VisualBasic

    Dim counter As UInteger = OUI '' or OUi

    ```


    # ulong Data Type


    Visual Basic''s intrinsic Ulong data type is identical to C#''s ulong data type.
    Both types are aliases for .NET''s System.Uint64 type. For unsigned long literals,
    C# and Visual Basic use a UL suffix after the value, or some uppercase/lowercase
    variation of UL.


    ```

    C#nulong counter = Oul;


    VisualBasic

    Dim counter As ULong = OUL

    ```


    # unchecked Expression


    C#''s unchecked keyword, whether in its statement-block form or expression form,
    disables run-time integer overflow checking on the contained statements or expression.


    Visual Basic enables integer overflow checking by default on a project-wide basis.
    To enable or disable overflow checking, access the Advanced Compiler Settings
    within the Project Properties, and set the Remove Integer Overflow Checks needed.
    VB does not include the ability to control integer overflow checks at the statement
    or expression level.


    # unsafe Expression


    C#''s unsafe expression, whether in its statement-block or modifier form, indicates
    a section of unsafe (unmanaged) code. Because Visual Basic does not support unsafe
    contexts, it has no equivalent for unsafe.


    # ushort Data Type


    Visual Basic''s intrinsic UShort data type is identical to C#''s ushort data type.
    Both types are aliases for .NET''s System.Uint16 type. For unsigned short literals,
    Visual Basic uses a US suffix after the value, or some'
