  md: "# Identifiers\n\nBoth C# and Visual Basic use a common set of identifier naming\
    \ rules, allowing for a mixture of letters, digits, and underscores, with some\
    \ limitations, such as not starting an identifier with a digit.\n\nIdentifiers\
    \ in C# are case-sensitive. Two variables named customerName and CustomerName\
    \ in the same method would not conflict since the first letter is a different\
    \ case. In Visual Basic, identifiers are case-insensitive. In VB, two identifiers\
    \ are identical if they are the same when converted to all lower-case letters.\
    \ It is possible to create an assembly in C# with two exposed type or member names\
    \ that would cause problems when consumed by a Visual Basic project, although\
    \ VB has rules that attempt to identify the most accessible element when there\
    \ is a conflict.\n\nVisual Basic allows you to give the same (case-insensitive)\
    \ name to a type and one of its members.\n\n# VISUAL BASIC\n\n```\n' ----- This\
    \ is valid in Visual Basic.\nPublic Class ItemData\n    Public ItemText As String\n\
    \    Public ItemData As Long\nEnd Class\n```\n\nC# does not allow this combination.\
    \ name the same as its enclosing type in C#. If you create a Visual Basic assembly\
    \ that has this shared naming of type and member, a C# project will not be able\
    \ to access the member directly.\n\nC# allows identifiers to include Unicode escape\
    \ sequences in the form \\hhhh, where hhhh is a 4 or 8-digit hex value. The hex\
    \ code must still resolve to a character considered valid for identifiers, typically\
    \ variations of the alphanumeric characters.\n\n# C#\n\n```\nstring p00E8e = \"\
    French for 'father\";\nMessageBox.Show(String.Format(\"{0} is {1}\",\nnameof(p00E8e),\
    \ p00E8e));\n// Displays: pére is French for 'father'\n```\n\nVisual Basic does\
    \ not include support for these sequences. You can use a Unicode character within\
    \ an identifier name in VB, but it must be entered as a standard character within\
    \ the code, and not as an escape sequence.\n\n# VISUAL BASIC\n\n```\nDim pére\
    \ As String = \"French for 'father\"\nMessageBox.Show(String.Format(\"{0} is {1}\"\
    ,));\n```"
