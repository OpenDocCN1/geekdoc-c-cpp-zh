  md: '# Floating-Point Literals


    In both languages, floating-point literals are double/Double by default. You can
    also alter this default by appending a type suffix to the literal value. The following
    table lists the suffixes for each floating-point type. Each suffix can be uppercase
    or lowercase.


    | Data Type | C# Suffix | Visual Basic Suffix |

    | Single | F | ! or F |

    | Double | D | # or R |

    | Decimal | M | @ D |


    Both Visual Basic and C# allow numeric literals in exponential format (scientific
    notation). Either the base or the exponent can include a unary + or sign, and
    an optional type character can appear as well.


    ```

    C#

    Value = 9.24E22D; // double


    VISUAL BASIC

    Value = 9.24E+22# '' Double

    ```


    Boolean Literals

    Visual Basic''s True and False literals are exact replacements for C#''s true
    and false literals. See the "bool Data Type" entry in this chapter for information
    on differences between the languages when converting a true value to an integer.


    Hexadecimal and Octal Literals

    C# supports hexadecimal literals using the ox prefix. Visual Basic offers hexadecimal
    and octal literals via the &H &O prefixes.


    ```

    C#ndecimal25 = 0x19;


    VISUAL BASIC

    decimal25 = &H19

    decimal25 = &O31

    ```


    The various type suffixes, listed earlier in this entry, can follow the hexadecimal
    and octal literals to force the expression to a specific type.


    # Date Literals


    # New with Visual Studio 2015


    Visual Basic includes intrinsic support for date and time literals. The text of
    the date or time appears between a set of # symbols. Before the 2015 update'
