    VISUAL BASIC Class CoreSettings

    ```


    NotInheritable class

    When applied to members of a derived class overriding the matching virtual

    member in the base class, C#''s sealed modifier is replaced in Visual Basic

    with the NotOverridable modifier. In both languages, the override (C#) or

    Overrides (VB) modifier must be present.


    ```

    C#nsealed protected override void Refresh()

    VISUAL BASIC

    ProtectedNotOverridable Overrides Sub Refresh()

    ```


    For members, C#''s sealed modifier can apply to methods, properties,

    indexers, and events. In Visual Basic, events cannot be marked with the

    NotOverridable modifier.


    # select Query Expression Operator (LINQ)


    Visual Basic’s Select query expression operator is identical to C#''s select

    operator. When crafting query expressions in VB, the Select clause is optional,

    en in situations where its C counterpart would be required. When Select is

    left out, the member identified in the From, Aggregate , or Group class is

    returned. Additionally, Visual Basic allows more flexibility concerning the

    placement of the Select clause within the query expression.'
