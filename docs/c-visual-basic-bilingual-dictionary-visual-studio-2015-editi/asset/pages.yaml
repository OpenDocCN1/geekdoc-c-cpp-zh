    Visual Basic''s Overridable modifier is equivalent to C#''s virtual modifier.


    # C#


    ```

    public virtual long DetermineImpact()

    ```


    # Visual Basic


    ```

    Public Overridable Function DetermineImpact() As Long

    ```


    C#''s virtual modifier can be used with class methods, properties, indexers, and
    events. In Visual Basic, the Overridable modifier cannot be used with events.


