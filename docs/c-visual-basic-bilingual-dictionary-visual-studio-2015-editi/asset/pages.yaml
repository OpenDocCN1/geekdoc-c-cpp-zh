  md: "```\ngoto default;\ncase DayOfWeek.Tuesday:\n  // Tuesday-specific processing,\
    \ then...\n  break;\ndefault:\n  // General processing.\n```\n\nIn Visual Basic,\
    \ the test value supported by a Case clause can be an integer number, a character\
    \ or string, a Boolean literal, enumeration value, a floating-point number, a\
    \ date, a general Object instance, or Nothing. In C#, the list includes literals\
    \ from a more restricted set of value types: integers, strings, characters, Boolean\
    \ literals, enumeration values, and null. VB Case clauses support value ranges,\
    \ and relative comparisons.\n\n# Visual Basic\n\n```\nCase 1, 2\n  ' Matches one\
    \ of comma-delimited values.\n  tableSize = \"small\"\nCase 3 To 6\n  ' Matches\
    \ inclusive range.\n  tableSize = \"medium\"\nCase TableForSeven()\n  ' Matches\
    \ result of expression or method call.\n  tableSize = \"oddball\"\nCase Is > 7\n\
    \  ' Matches using comparison operator.\n  tableSize = \"large\"\n```\n\nC# supports\
    \ one of these complex test expressions. Instead, each case clause presents exactly\
    \ one value to be compared to the statement's incoming test value. The only flexibility\
    \ beyond this single-value format is that two or more adjacent cases can all share\
    \ the same logic block.\n\n# C#\n\n```\ncase DayOfWeek.Monday:\ncase DayOfWeek.Wednesday:\n\
    \  // Code for both Monday and Wednesday.\n```\n\nSelect Operator C#’s query expression\
    \ operator is identical to Visual Basic’s Select operator. When crafting query\
    \ expressions in VB, the select clause is optional, with the resulting fields\
    \ indicated by the From, Aggregate, or Group clause. In C#, the select clause\
    \ is required in all query types. Additionally, Visual Basic allows some flexibility\
    \ concerning the placement of the Select clause within the query expression. For\
    \ standard queries, C# requires that select be the terminating clause.\n\n# VISUAL\
    \ BASIC"
