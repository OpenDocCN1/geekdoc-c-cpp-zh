    Visual Basic''s WriteOnly modifier is used to create write-only properties. In
    such definitions, the Get portion of the property is left off. C# also leaves
    off the portion, but it does not require that other special modifier be to indicate
    the property''s write-only format.


    ```

    VISUAL BASIC

    Public WriteOnly Property Status As Integer

    Set(ByVal value As Integer)

