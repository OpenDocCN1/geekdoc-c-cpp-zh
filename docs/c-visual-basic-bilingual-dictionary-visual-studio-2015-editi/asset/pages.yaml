    # Statements


    In C#, the semicolon determines the end of a statement. For the purposes of statement
    structure, a block of statements surrounded by a set of curly braces is treated
    as a single statement-terminated statement.


    ```

    C#

    // ----- A simple single-line statement.

    quotient = numerator / denominator;

    ```


    ```

    // ----- An condition, with its subordinate statement.

    if (totalPercent > 100)

    totalPercent = 100;

    ```


    ```

    // ----- An condition with a subordinate block.

    if (totalPercent > 100)

    {

    ```


    ```

    Reportage(totalPercent)

    totalPercent = 100

    }

    ```


    In Visual Basic, the end of a physical line indicates where the statement ends.
    For block statements (such as For Loops), opening, closing, and subordinate portions
    each terminate at the end of a physical line, although multiple statements may
    appear within the subordinate block.


    # VISUAL BASIC


    ```

    '' ----- A simple single-line statement.

    quotient = numerator / denominator

    ```


    ```

    '' ----- An condition, with its subordinate statement.

    If (totalPercent > 100) Then

    totalPercent = 100

    End If

    ```


    ```

    '' ----- An condition with a subordinate block.

    If (totalPercent > 100) Then

    Reportage(totalPercent)

    totalPercent = 100

    End If

    ```'
