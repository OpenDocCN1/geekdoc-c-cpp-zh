    # / Division Operator

    # defines a single operator that handles numeric division for both integer and
    floating-point values (and for other types when used with operator overloading).


    ```

    C#nint wholeResult1 = 5 / 3;   // 1

    int wholeResult2 = 6 / 3;   // 2

    float realResult = 5 / 3f;   // 1.666666...

    ```


    The return type in C# generally follows the type of the operands. The operands
    are coerced into the same type when needed before the division takes place. It
    is true for integer and floating-point values. For integer division, rounding
    leans toward zero.


    Visual Basic also includes a division operator. Unlike C#''s operand-directed
    return type, the / operator in VB always returns a floating-quotient.


    ```

    Visual Basic

    Dim Result1 As Double = 5 / 3   '' 1.666666...

    Dim wholeResult2 As Double = 6 / 3   '' 2.0

    Dim realResult As Single = 5 / 3!   '' 1.666666...

    ```


    In most cases, VB''s division operator returns a result of Double, even with integer
    operands. If one operand is Single and the other is non-Double, the result is
    Single. If one operand is Decimal and the other is anything else than Single or
    Double, the result is Decimal.


    Visual Basic also has a \ division operator. When used in place of /, the result
    is always an integer value, rounding toward zero.


    ```

    Visual Basic

    Dim Result1 As Integer = 5 \ 3   '' 1

    Dim wholeResult2 As Integer = 6 \ 3   '' 2

    Dim realResult As Long = 5 \ 3!   '' 1

    ```


    Floating-point values are coerced to the Long data type before processing, and
    rounded using banker''s rounding (0.5 values are rounded toward the nearest even
    integer). If Option Strict is used, you must manually coerce floating-point values
    to an appropriate integer type (Byte, Short, Integer, or Long).


    Both languages follow the same divide-by-zero rules for the operator, with an
    exception thrown for Decimal operands, and System.Double.NaN returned for other
    data types. For VB\s operator, divide-by-zero always throws an exception.


