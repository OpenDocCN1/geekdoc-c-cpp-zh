  md: "```\nNameOf(père), père));\n' ---- Displays: père is French for 'father'\n\
    ```\n\nBoth languages allow you to create identifiers that conflict with reserved\
    \ language keywords. To use such identifiers, prefix them with the @ symbol in\
    \ C#, or surround them with square brackets in Visual Basic.\n\n```\nC#nlong @for\
    \ = OL;\n```\n\nVisual Basic\nDim [For] As Long = 0&\n\nMicrosoft recommends that\
    \ identifier names be either Pascal-cased or camel-cased. In Pascal casing, every\
    \ distinct word within the name has an initial capital, including the start of\
    \ the identifier. Camel casing is similar, but the initial letter is lowercase.\n\
    \n```\nC#nint PascalCaseExample;\nint camelCaseExample;\n```\n\nAs indicated in\
    \ Visual Studio’s documentation, camel casing is recommended for parameter names,\
    \ local variable names, and protected instance fields within types. All other\
    \ identifiers, including line labels, should use Pascal casing.\n\nif Statement\n\
    \nVisual Basic’s if statement closely parallels the if statement in C#.\n\n```\n\
    C#nif (testDate < DateTime.Now)\n    era = \"Past\"\nelse if (testDate == DateTime.Now)\n\
    \    era = \"Present\"\nelse\n    era = \"Future\";\nVisual Basic\nIf (testDate\
    \ < Now) Then\n    era = \"Past\"\nElseIf (testDate = Now) Then\n    era = \"\
    Present\"\nElse\n    era = \"Future\"\nEnd If\n```\n\nEach condition in VB begins\
    \ with If or ElseIf, and ends with Then moving into the logic for that. The entire\
    \ statement ends with End If. Visual Basic includes a condensed version of the\
    \ statement that puts the Then and Else parts on a single logical line. (This\
    \ syntax works in C# as well,"
