    End Using\n```\n\n```\n---- This compressed format is also supported\nUsing myDB\
    \ As New SqlConnection(dbPath)\nEnd Using\n```\n\n# C#\n\n```\nusing (SqlConnection\
    \ myDB = new SqlConnection(dbPath))\n{\n    // ----- myDB is disposed on exit\
    \ of using block.\n}\n```\n\nBoth languages allow multiple resources to be created\
    \ at once in the same Using or using statement. The compiler converts these to\
    \ nested blocks, which are also permitted in each language. In VB, each variable\
    \ declared within the same Using statement can be of a different type; in C#,\
    \ all such variables share a single data type.\n\n# Visual Basic\n\n```\n-----\
    \ Variables of the same type.\nUsing firstVal As New Type1, secondVal As New Type1\n\
    ```\n\n```\n----- Variables of different types.\nUsing firstVal As New Type2,\
