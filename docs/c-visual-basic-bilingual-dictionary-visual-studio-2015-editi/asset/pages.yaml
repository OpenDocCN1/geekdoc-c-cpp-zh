  md: '# FileOpen Method


    C# has no direct equivalent for Visual Basic''s FileOpen method, or for its numeric
    file identifiers. However, internally this method uses standard System.IO.FileStream
    instances to manage files. You can use this same class in C# to open a file.


    ```

    VISUAL BASIC

    Dim fileID As Integer = FreeFile()

    FileOpen(fileID, "C:\temp\work.txt", OpenMode.Input)

    ```


    ```

    C#

    System.IO.FileStream sourceFile =

    new System.IO.FileStream("C:\temp\work.txt",

    System.IO.FileMode.Open);

    ```


    Both the FileOpen method and the FileStream constructor include overloads and
    optional arguments that let specify mode (input, output, and so on), access (read,
    write, or both), and sharing options. The required mode setting is indicated by
    the OpenMode enumeration in VB, and the System.IO.FileMode enumeration when using
    streams. The following table shows the equivalent values.


    | OpenMode Member | FileMode Member |

    |---|---|

    | Append | Append |

    | Binary | OpenOrCreate |

    | Input | Open |

    | Output | OpenOrCreate |

    | Random | OpenOrCreate |


    By default, files are opened for read and write access in VB. The optional OpenAccess
    enumeration modifies this access if desired. When using streams, the System.IO.FileAccess
    enumeration provides the same options. The following table shows the equivalent
    access values.


    | OpenAccess Member | FileAccess Member |

    |---|---|

    | Default | ReadWrite |

    | Read | Read |

    | ReadWrite | ReadWrite |

    | Write | Write |'
