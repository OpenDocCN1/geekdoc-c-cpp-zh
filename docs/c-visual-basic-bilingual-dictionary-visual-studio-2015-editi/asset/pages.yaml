    \ data type with the void keyword.\n\n# Visual Basic\n\n```\nPublic Sub LogError(ByVal\
    \ errorText As String)\n  ' May optionally include this statement:\n  Return\n\
    ```\n\nEnd Sub\n\n# C#\n\n```\npublic void LogError(string errorText)\n{\n  //\
