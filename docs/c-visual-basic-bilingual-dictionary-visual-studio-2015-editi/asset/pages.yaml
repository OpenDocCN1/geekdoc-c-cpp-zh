  md: "# Sub Statement\n\nSee\nMethods\n\n# Sub Lambda Statement\n\nSee\nLambda Expressions\n\
    \n# Switch Method\n\nVisual Basic's Switch method accepts a parameter array of\
    \ conditions and matching objects, returning the first object whose condition\
    \ is True, or Nothing when no conditions match.\n\n```\nVisual Basic\nDim playerMessage\
    \ As String = Switch(\nplayers < 9, \"Too few players!\",\nplayers > 9, \"Too\
    \ many players!\",\nplayers = 9, \"Play ball!\")\n```\n\nC# lacks a language equivalent\
    \ for the Switch method. Instead, you can use a conditional statement, such as\
    \ the select case or if statement, to achieve the same results.\n\n```\nC#nstring\
    \ playerMessage = null;\nif (players < 9)\n    playerMessage = \"Too few players!\"\
    \nelse if (players > 9)\n    playerMessage = \"Too many players!\"\nelse\n   \
