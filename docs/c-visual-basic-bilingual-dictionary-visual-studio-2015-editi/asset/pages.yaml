  md: '+   • Chapter 3 is an extension of Chapter 2, listing every member of Visual
    Basic’s “My” Namespace. Each entry documents C# code that allows you to perform
    the same task as the member in question.


    # New with Visual Studio 2015


    The book includes full coverage of language features introduced with Visual Studio
    2015 and the “Roslyn” compiler. For developers who have not yet upgraded to the
    latest version, all discussions of new features clearly indicate the functionality
    that existed prior to Visual Studio 2015.


    What’s Not in the Book?


    Although the C#-Visual Basic Bilingual Dictionary includes complete coverage of
    every language keyword and syntactic element in both C# and Visual Basic, it is
    not an exhaustive reference for .NET development. Except as they appear in specific
    coding solutions, the book does not discuss the .NET Base Class Libraries. It
    also excludes other language-neutral .NET technologies, such as ADO.NET and Windows
    Communication Foundation (WCF).


    The name “Visual Basic” refers to the .NET version of the language only, and not
    to those editions that culminated in Visual Basic 6.0. The book does identify
    differences between new language updates released with Visual Studio 2015 (“Roslyn”)
    and those that were in effect in Visual Studio 2013. However, it does not document
    changes introduced in prior releases of the C# and Visual Basic languages. For
    instance, the text assumes that asynchronous programming keywords (the “async”
    and “await” operators) already exist in each language, although these keywords
    were not introduced until Visual Studio 2012.


    Although Chapter 1 includes coverage of the dynamic C# language keyword, the book
    does not discuss the System.Dynamic namespace, nor any Dynamic Language Runtime
    features.


    Acknowledgements


    Reading a reference book from cover to cover is hard work, but several skilled
    developers across the globe agreed to take the challenge, and the book is much
    improved as a result. Eric Moreau and Jan Zárubara provided extensive comments
    on the text. Additional input also came from David Fulop, Marco Meijer, Fanie
    Reynders, and Alex Sorokoletov. Special thanks goes to Lucian Wisch and all of
    the Microsoft language MVPs, authors, and insiders who let me eavesdrop and participate
    in their technical interactions.


    About the Author'
