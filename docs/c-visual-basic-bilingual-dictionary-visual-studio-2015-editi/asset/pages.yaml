  md: 'where Clause In C# generics, conditions can be placed on type parameters with
    the where clause.


    ```

    # // ----- Clause applied to one type parameter.

    class SingleGeneric<T> where T : IEnumerable


    // Constraints applied to two type parameters

    // requires two clauses.

    class DoubleGeneric<T, U>

    where T : IEnumerable

    where U : IDisposable

    ```


    In Visual Basic, the As clause parallels C#''s where clause, and appears immediately
    after the type parameter being constrained.


    ```

    VISUAL BASIC // ----- Clause applied to one type parameter.

    Class SingleGeneric(Of T As IEnumerable)


    '' ----- Constraints applied to two type parameters

    '' requires two As clauses.

    Class DoubleGeneric(Of T As IEnumerable, U As IDisposable)

    ```


    To apply multiple constraints to a single parameter, enclose the comma-delimited
    VB constraints within a set of curly braces.


    ```

    class ComplexGeneric<T> where T : class, IDisposable

    VISUAL BASIC Class ComplexGeneric(Of T As (class, IDisposable))

    ```


    Both languages support the same types of constraints on parameters. The following
    table lists the equivalent constraints.


    | Constraint | C# | Visual Basic |

    |---|---|--|

    | Specific type | Customer | Customer |

    | Specific interface | IEnumerable | IEnumerable |

    | Another type parameter | U | U |

    | Any class | class | Class |

    | Any structure | struct | Structure |

    | Class with default constructor | new() | New |


    See Also'
