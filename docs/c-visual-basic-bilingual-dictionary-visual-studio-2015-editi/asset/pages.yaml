  md: '# Data Types


    C# and Visual Basic share a common set of intrinsic data types, with one exception.
    The following table shows the matching data types, and the underlying .NET data
    type for each intrinsic type is an alias.


    | Visual Basic Type | C# Type | .NET Type |

    |---|---|---|n| Boolean | bool | System.Boolean |

    | Byte | byte | System.Byte |

    | Char | char | System.Char |

    | Date | Not supported | System.DateTime |

    | Decimal | decimal | System.Decimal |

    | Double | double | System.Double |

    | Integer | int | System.Int32 |

    | Long | long | System.Int64 |

    | Object | object | System.Object |

    | SByte | sbyte | System.SByte |

    | Short | short | System.Int16 |

    | Single | float | System.Single |

    | String | string | System.String |

    | UInteger | uint | System.UInt32 |

    | ULong | ulong | System.UInt64 |

    | UShort | ushort | System.UInt16 |


    Visual Basic includes an intrinsic Date type, an alias for the framework’s System.DateTime
    type. C# does not include a parallel date/time type. Instead, you must use System.DateTime
    directly in C#.


    For more information about the intrinsic data types, see their individual entries
    in this chapter.


    # Date Data Type


    C# does not include intrinsic support for Visual Basic’s Date data type.'
