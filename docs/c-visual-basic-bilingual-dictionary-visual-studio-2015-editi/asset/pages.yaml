    \ > 0\n    content = ProcessChunkOfContent(content)\nLoop\n```\n\nA variation\
    \ of this loop uses the Until clause instead of While.\n\n```\nVisual Basic\n\
    Until content.Length = 0\n    content = ProcessChunkOfContent(content)\nLoop\n\
    ```\n\nIn both cases, the parentheses surrounding the condition are optional,"
