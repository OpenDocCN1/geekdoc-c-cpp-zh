  md: '# Project Properties


    Visual Basic and C# offer nearly identical settings through the Project window.
    Visual Studio presents a tabbed presentation of settings, and most of the tabs
    that exist in VB are found in C#, and in an identical configuration. The set of
    available tabs and features on each tab will vary based on the type of project.


    This entry describes a few of the differences you will encounter when moving from
    Visual Basic to C#. To see a list of differences from the perspective of moving
    from C# to Visual Basic, see the "Project Properties" entry in Chapter 1.


    # Application Tab


    In general, C# and Visual Basic offer the same selection of project types. In
    some projects, VB''s Application Type offers "Windows Service" and "Web Control
    Library" options. These appear as distinct project types in C#.


    In Windows Forms applications, Visual Basic offers a selection of startup forms,
    plus any compatible Main methods once the Enable Application Framework field cleared.
    In any C# project that generates an executable, the equivalent Startup Object
    field only displays Main methods, not forms. If you want to use a form as the
    startup object, you must display the form via your C# Main method. See the "Main
    Method" entry in this chapter for a C# example that does this.


    C# has no direct equivalent for the Windows Application Framework or its subordinate
    features. For information about handling Application Framework events in C#, see
    the event-specific entries in Chapter 3. Enabling XP Visual Styles in a C# program
    can be accomplished in code through the following statement.


    ```

    C#nApplication.EnableVisualStyles();

    ```


    To enforce a single-instance application in C#, you must manually check for a
    conflicting mutex or use some other shared-memory functionality. The following
    code demonstrates one possible way of doing this from your Main method.


    ```

    C#nSystem.Threading.Mutex checkApp =

    new System.Threading.Mutex(true, "AppSpecificString");

    if (checkApp.WaitOne(0, false))

    // Allow program to run.

    else

    ```'
