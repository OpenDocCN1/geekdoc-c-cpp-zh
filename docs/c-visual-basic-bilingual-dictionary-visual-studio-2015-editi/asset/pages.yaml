  md: "yield Statement\nWhen defining a method iterator or get-accessor iterator,\
    \ C#s yield statement identifies the next value to emit. The related yield break\
    \ statement aborts an iterator early, before any other logic in the iterator code\
    \ can run.\n\n```\nC#n// Assumes a LimitedEdition value defined elsewhere.\npublic\
    \ IEnumerable<int> SmallNumbers()\n{\n    yield return 1;\n    yield return 2;\n\
    \    yield return 3;\n    if (LimitedEdition)\n        yield break;\n    yield\
    \ return 4;\n    yield return 5;\n}\n```\n\nIn Visual Basic, the Yield statement\
    \ returns the next iterator value, and appears in a function or property that\
    \ includes the Iterator modifier. VB’s standard Return statement (or the older\
    \ Exit Function and Exit Property statements) takes the place of C#s yield break\
    \ statement.\n\n```\nVISUAL BASIC\n' Assumes a LimitedEdition value defined elsewhere.\n\
    Public Iterator Function SmallNumbers() As _\n    IEnumerable(Of Integer)\n  \
    \  Yield 1\n    Yield 2\n    Yield 3\n    If (LimitedEdition) Then Return\n  \
    \      Yield 4\n    Yield 5\nEnd Function\n```\n\nIf a yield statement appears\
    \ in a C# try statement, that statement cannot catch clauses, only a finally clause.\
    \ Visual Basic allows Try statements that contain Yield statements to use both\
    \ Catch and Finally clauses.\n\nSee Also\nIterators"
