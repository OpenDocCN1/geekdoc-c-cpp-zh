  md: 'In VB, opened files are locked to prevent access by other users. To override
    this default, the OpenShare enumeration includes relevant options. The following
    table compares these values to those in the System.IO.FileShare enumeration, which
    is used when working with file streams.


    | OpenShare Member | FileShare Member |

    |---|---|

    | Default | None |

    | LockRead | Write |

    | LockReadWrite | None |

    | LockWrite | Read |

    | Shared | ReadWrite |


    One additional feature of the FileOpen method lets you specify a record length.
    Streams do not include an equivalent for reading and writing data in record blocks.
    Instead, you must position reads and writes within a file using the stream''s
    Seek method or other similar features. When determining locations, the first position
    in a file opened with Visual Basic''s FileOpen is 1 (one). When working with streams,
    the first position is identified as o (zero).


    Another alternative is to open a file for dedicated reading or writing using the
    StreamReader or StreamWriter classes, also found in the System.IO namespace. These
    classes provide more text-friendly access to the files, allowing you to simulate
    fixed-size records by reading or writing data in blocks of a specified size.


    ```

    # C#n// --- Open a file for reading.

    System.IO.TextReader inputFile =

    new System.IO.StreamReader("C:\\\\work.txt");


    // --- Open a file for writing.

    System.IO.TextWriter outputFile =

    new System.IO.StreamWriter("C:\\\\output.txt");

    ```


