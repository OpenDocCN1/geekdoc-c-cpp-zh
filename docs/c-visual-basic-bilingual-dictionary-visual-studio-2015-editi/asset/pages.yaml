    Unlike Visual Basic, C# does not configure a built-in logging environment by default.
    Instead, you can add a Logging Block from the Microsoft Enterprise Library to
    your application. The code needed to set up and use trace logging in your application
    is beyond the scope of this book.


    You can find full information on the Logging Application Block, including sample
    code, on the MSDN web site, mdn.microsoft.com. On that site,'
