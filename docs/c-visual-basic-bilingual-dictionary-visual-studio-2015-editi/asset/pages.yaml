  md: 'C# does not have a direct equivalent for the FilePut method. Instead, data
    can be serialized to a file or any other stream using a stream formatter. The
    .NET Framework includes a binary formatter and an XML formatter, among others.
    Any object decorated with the System.SerializableAttribute can be serialized to
    a stream, and all of the core data types included in C# automatically support
    this attribute.


    # Note


    Files written through .NET serialization methods are not identical to those written
    using the FilePut method. The output format of FilePut is proprietary to Visual
    Basic. You can learn about the specific content written with FilePut by accessing
    http://references.microsoft.com , and searching for "FilePut." A full discussion
    of its output is beyond the scope of this book.


    The following code shows out to serialize some basic data values to a stream in
    a binary format.


    ```

    C#

    // At the top of the file.

    using System.IO;

    using System.Runtime.Serialization;

    using System.Runtime.Serialization.Formatters.Binary;


    // In a method.

    bool booleanData = true;

    int numericData = 123;

    string textData = "Hello, World";


    // Open the output stream.

    IFormatter formatter = new BinaryFormatter();

    Stream outputFile = new FileStream("C:\temp\output.dat", FileMode.Create, FileAccess.Write,
    FileShare.None);


    // Write the data values.

    formatter.Serialize(outputFile, booleanData);

    formatter.Serialize(outputFile, numericData);

    formatter.Serialize(outputFile, textData);

    outputFile.Close();

    ```


    More complex types can also be serialized as long as the type is marked with the
    Serializable attribute.


