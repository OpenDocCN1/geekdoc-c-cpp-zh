    # Print Method


    Visual Basic''s Print method (and the related PrintLine method) outputs content
    to a file opened with the FileOpen method. The output can include columnar data
    via the SPC and TAB methods. PrintLine adds a carriage-return and line-feed pair.


    ```

    VISUAL BASIC

    '' ---- Output a string and a number, like:

    ''    Seattle 84

    PrintLine(lineNumber, cityName, Tab(15), totalMatches)

    ```


    C# does not include the file-management features included in VB. Instead, it is
