    \n```\nPublic Sub New(ByVal empName As String)\n    ' Base class handles person's\
    \ name.\n    MyBase.New(empName)\nEnd Sub\nPublic Sub New(ByVal empName As String,\n\
    \    ByVal salary As Decimal)\n    ' Another constructor handles the name.\n \
