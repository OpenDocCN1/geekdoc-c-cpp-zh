    # Lifetime and Scope


    With one significant difference within method code, C# and Visual Basic generally
    follow the same lifetime and scoping rules for variables.


    Lifetime

    Lifetime indicates how long the value stored within a variable remains available.
    Both languages mostly follow the same rules for managing variable lifetime. Shared
    (VB) and static (C#) fields declared outside of methods have application lifetime,
    as do fields that appear within Visual Basic Module statements. Non-static and
    the instance-level fields have lifetimes that last as long as the instance does.
    Local Static variables in Visual Basic methods have application or instance lifetime,
    depending on whether the containing method is Shared or not, respectively. C#
    does not support local static variables.


    The key difference between the languages appears when using non-static local variables.
    In Visual Basic, all non-static variables, whether declared inside or outside
    of a block, have procedure-lifetime. If you declare a variable within an If statement,
    its value will remain throughout the entire procedure, although scoping rules
    limit access to that variable to just that block. This means that if you reenter
    the block, the variable may retain the value it had the last time you passed through
    that block. Because of this, you should always initialize variables defined within
    a block.


