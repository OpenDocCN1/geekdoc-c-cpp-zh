    # Compiler Constants


    Both C# and Visual Basic include project-level support for the DEBUG and TRACE
    compiler constants. Code throughout the .NET Framework responds to these constants,
    and you can use them in your code. To alter the default settings, set the Define
    DEBUG Constant and Define TRACE Constant fields as needed. In C#, these fields
    appear on the Project Properties Build tab; in VB, they appear in the Advanced
    Compile Options area of the Compile


    Although you can define your own project-specific compiler constants, C# itself
    does not define any other constants by default. Visual Basic defines four (or
    up to nine) additional constants.


    | Constant | Description |

    | --- | --- |

    | CONFIG | The active build configuration, typically "Debug" or "Release." |

    | TARGET | The compiled application type, one of: "winex", "exe", "library," or
    "module." Other custom values are also possible. |

    | VBC_VER | The current version of Visual Basic, in major.minor format. One of
    the following values: 8.0 (VB2005), 9.0 (VB2008 and VB2010), 11.0 (VB2012), 12.0
    (VB2013), or 14.0 (VB2015). |

    | _MYTYPE | The version of the My pseudo-namespace in use. Depending on the value
    of this constant, the compiler may define one or more of the following additional
    constants: _MYAPPLICATIONTYPE, _MYCOMPUTERTYPE, _MYFORMS, _MYUSER, and _MYWEBSERVICES.|


    See MSDN documentation for full information on these constants and how to use
    them in your code.


    # const Statement


    Both Visual Basic and C# support the declaration of constants at the local and
    type levels. The syntax of C# const statement clearly parallels standard variable
    declaration; VB''s syntax naturally follows its own variable declaration, replacing
    Dim with Const.'
