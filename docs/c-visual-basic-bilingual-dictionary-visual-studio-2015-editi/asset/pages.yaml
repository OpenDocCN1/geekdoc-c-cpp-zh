    # FileGet Method


    Visual Basic''s FileGet method reads a piece of data from a file that was previously
    written using C# does not have a direct equivalent for the FileGet method. Instead,
    data can be serialized to a file or any other stream, and then read back in, using
    a stream formatter. The .NET Framework includes a binary formatter and an XML
    formatter, among others. Any object decorated with the System.SerializableAttribute
    can be serialized to a stream for later retrieval, and all of the core data types
    included in C# automatically support this attribute.


