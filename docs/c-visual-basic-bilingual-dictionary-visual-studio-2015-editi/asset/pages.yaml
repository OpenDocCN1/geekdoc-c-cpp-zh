  md: 'As Visual Basic, C#''s conditional statements can include any mix of expressions
    or logical operators, just as long as the result of each expression is a Boolean
    value. You must surround the condition in C# with a set of parentheses; these
    parentheses are optional in VB. C# supports any number of else if clauses, and
    you can nest if statements, just like in Visual Basic.


    # If Operator


    When used with three arguments, Visual Basic''s If operator finds its equal in
    C#''s?: conditional operator, traditionally called the ternary operator.


    ```

    Visual Basic

    Dim result As String = If(amount > 100, "Overflow",

    amamount.ToString())

    ```


    ```

    C#

    string result = amount > 100 ? "Overflow" :

    amamount.ToString();

    ```


    As with the If operator, the ?: includes three expressions, separated by the distinct
    ? and : symbols: (1) a Boolean test condition, (2) the value to return if the
    condition is true, and (3) the value to return if the condition is false. In Visual
    Basic, the ?: short-circuits; either the true or false part is evaluated, but
    not both.


    C#''s conditional operator is right-associative. Consider the following expressions,
    which are all equivalent.


    ```

    Visual Basic

    result1 = If(a, b, If(c, d, e))


    C#

    result1 = a ? b : c ? d : e;

    result2 = a ? b : (c ? d : e);

    ```


    Visual Basic also includes a two-argument version of the If operator, which returns
    the second argument if the first evaluates to Nothing. In C#, the ?? coalescence
    operator performs this same task.


    ```

    Visual Basic

    '' Assumes: Dim suppliedName As String

    Dim customerName As String = If(suppliedName, "Customer")


    C#

    // Assumes: string suppliedName;

    string customerName = suppliedName ?? "Customer";

    ```


    # Iif Method


    Both the Iif method and the If operator return one of two expressions based on
    a Boolean test condition. Visual Basic''s Iif method, retained for historical'
