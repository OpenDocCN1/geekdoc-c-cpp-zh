    # Mid Assignment Statement


    C# does not have an equivalent for Visual Basic''s Mid assignment statement.

    to replace a portion of an existing string in C#, use the string data type''s
    Substring method to extract the surrounding portions, and concatenate back together
    with the new content.


    Visual Basic''s Mid statement is very forgiving about string lengths, and silently
    trims off extra content, and not complain when there isn''t enough text in the
    original string to replace. The Substring method is more strict, and will throw
    an exception if you attempt to access portions of a string that do not exist.
    Before using Substring, verify that all portions exist by checking string lengths.


    # Mid Method


    The Substring method of C#''s string data type provides functionality somewhat
    similar to Visual Basic''s Mid method. Mid uses 1-based positions;

    Substring uses o-based positions.


    ```

    VISUAL BASIC

    ----- Get YYY part of XXXYYYYZZZZZ phone number.

    phoneExchange = Mid(phoneNumber, 4, 3)

    ```'
