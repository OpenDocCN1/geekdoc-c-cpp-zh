    # #Const Directive


    In Visual Basic, preprocessing constants come into being using the #Const directive.
    These constants can be Boolean, integer, floating-point, string, or date values.


    ```

    VISUAL BASIC

    ----- A string preprocessing constant.

    #Const TestVersion = "Beta 0.7"

    ```


    In C#, the #define directive declares preprocessing constants. These constants
    are in essence Boolean, in that they either exist (true-like) or they don''t (false-like).


    ```

    C#

    #define TestVersion

    ```


    To clear a previously declared constant from use in Visual Basic, assign a value
    of Nothing. In C#, use the #undef directive to remove the constant and give it
    a false-like state.


    ```

    VISUAL BASIC

    #Const TestVersion = Nothing

    C#

    #undef TestVersion

    ```


