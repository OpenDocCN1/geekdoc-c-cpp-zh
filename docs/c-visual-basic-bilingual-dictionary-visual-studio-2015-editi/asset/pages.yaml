  md: '# FormatCurrency Method


    Visual Basic''s FormatCurrency method converts a numeric value (or a string representation
    of a number) to the monetary format of the culture. All numbers are coerced to
    the System.Double type before formatting.

    The ToString method of the double type in C# accepts a formatting string. The
    "C" format code outputs a value using the default currency format for the current
    culture.


    Visual Basic


    ```

    Dim result As String = FormatCurrency(moneyValue)

    ```


    ```

    string result = moneyValue.ToString("C");

    ```


    Additional formatting codes provide greater flexibility in the output of the monetary
    content. The ToString method also has overloads that let you specify culture-specific
    options, some of which match the optional arguments of the FormatCurrency method.
    See the .NET documentation for the System.Globalization.NumberFormat class for
    additional information.


    # FormatDateTime Method


    Visual Basic''s FormatDateTime method uses the System.DateTime class'' ToString
    method to output formatted date and time strings. FormatDateTime accepts a formatting
    enumeration value that indicates the output format.


    Visual Basic


    ```

    Dim result As String = =

    DateTime(workDate, DateTime.LongDate)

    ```


    ```

    string result = workDate.ToString("D");

    ```


    The following table shows the ToString argument needed for each DateFormat enumeration
    value.


    | DateFormat Value | ToString Argument |

    | LongDate | "D" |

    | ShortDate | "d" |

    | LongTime | "T" |

    | ShortTime | "HH:mm" |

    | GeneralDate | "T" for times with no dates, "d" for dates with midnight times,
    otherwise "G" |'
