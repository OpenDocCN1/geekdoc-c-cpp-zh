  md: "+   • End With\n\nIn C#, a closing curly brace ends similar statements. When\
    \ certain block statements include only a single subordinate statement, that statement\
    \ by itself is often sufficient to end the block, and curly braces are not required.\n\
    \n```\nc#\n// --- Block statement requiring ending curly brace.\nclass Example\n\
    {\n}\n// --- Block statement with single-line\n//     subordinate statement ==\
    \ =\nif (errorCount == 0)\n    CompleteProcessing();\n```\n\nFor information about\
    \ each End clause and its equivalent within C#, see the associated entry in this\
    \ chapter. For example, to learn about the End Enum statement, see the \"Enum\
    \ Statement\" entry in this chapter.\n\n# End Statement\n\nC# does not include\
    \ a language equivalent for Visual Basic's End statement. Instead, to abort an\
    \ application in C#, you can use one of two .NET Framework methods.\n\nIn Windows\
    \ Forms applications, the Application.Exit method asks each form to close, causing\
    \ control to return to the Main method. This typically causes the application\
    \ to end, although logic within the Main method can delay a standard termination.\n\
    \n```\nc#\nSystem.Windows.Forms.Application.Exit();\n```\n\nA more generic way\
    \ of terminating an application is via the Environment.Exit method. This method\
    \ is more abrupt, aborting the application immediately and returning an exit code\
    \ to the shell that originally invoked the application. Visual Basic's End statement\
    \ calls this method behind the scenes.\n\n```\nc#\nSystem.Environment.Exit(0);\n\
    ```\n\n# Entry Point\n\nSee\n\n# Main Method\n\n# Enum Statement"
