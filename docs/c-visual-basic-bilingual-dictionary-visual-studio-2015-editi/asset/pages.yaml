  md: 'In Visual Basic extension methods always appear in modules, which are akin
    to static classes in C#. The method must be decorated with the Extension attribute
    (from System.Runtime.CompilerServices). Although not marked with any special modifier,
    the first argument to the method is the target of the extension.


    ```

    VISUAL BASIC

    Imports System.Runtime.CompilerServices

    Friend Module LocalExtensions

    <Extension> Public Function DigitsOnly(ByVal originalText As String) As String

    '' Returns a string result.

    End Function

    End Module

    ```


    extern alias Statement

    Visual Basic has no equivalent for C#''s alias statement. The closest alternative
    involves using Reflection to load and access members of an external assembly indirectly,
    a task that is beyond the scope of this book.


    See Also

    :: Namespace Alias Qualifier


    extern Modifier

    When used with the DllImport attribute (from System.Runtime.InteropServices),
    the extern modifier indicates a method sourced from an external file.


    ```

    C#n[DllImport("avifil32.dll")

    private static extern void AVIFilInit();

    ```


    Visual Basic includes support for this same functionality, but requires no specific
    modifier comparable to extern.


    ```

    VISUAL BASIC

    <DllImport("avifil32.dll")

    Private Shared Sub AVIFilInit()

    End Sub

    ```


    Beyond this attribute-centric declaration, Visual Basic’s Declare statement provides
    a more formal syntax for identifying methods from an external source.


    ```

    VISUAL BASIC

    Private Declare Sub InitAVI Lib "avifil32.dll"

    Alias "AVIFilInit" ()

    ```'
