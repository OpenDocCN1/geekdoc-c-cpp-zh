  md: '# ! Dictionary Access Operator


    Visual Basic’s member access operator acts as a shortcut for parentheses-based
    dictionary lookup.


    ```

    Visual Basic

    '' Shortcut syntax using ! operator.

    customerName = CStr(allRecords!FullName)

    ```


    ```

    ''--- Standard dictionary syntax.

    customerName = CStr(allRecords("FullName"))

    ```


    C# uses this full version of the syntax for dictionary lookups, replacing the
    parentheses with square brackets.


    ```

    C#ncustomerName = (string)allRecords["FullName"];

    ```


    # Type Character

    When attached as a suffix to a numeric literal, Visual Basic’s type character
    coerces the value to the Single data type. In C#, use the F or f suffix instead
    to coerce the value to the float data type.


    ```

    Visual Basic

    Dim value As Single = 123!

