  md: "# Literals\n\nC# and Visual Basic both support a wide range of value type literals,\
    \ although there are some significant feature differences between the languages.\n\
    \n# Unicode Sequences\n\nString and character literals in C# support Unicode escape\
    \ sequences, prefixed with the \\U or \\u escape code.\n\n```\nC#n// ----- u00a3\
    \ is the British Pound symbol.\nchar currencySymbol = '\\u00a3';\n```\n\nVisual\
    \ Basic does not support such sequences. You must either embed the character itself\
    \ within the literal, or use VB's ChrW function to obtain a character representation\
    \ of the Unicode value.\n\n# Visual Basic\n\n```\n' ----- Embed the symbol directly.\n\
    Dim currencySymbol As Char = \"&fnc\"\n```\n\n```\n' Use the ChrW function.\n\
    Dim currencySymbol As Char = ChrW(&H00A3)\n```\n\nC#' \\x variable-length hex-character\
    \ escape sequence is also not supported in Visual Basic.\n\n# Character and String\
    \ Literals\n\nC# supports two types of string literals: standard literals with\
    \ support for embedded escape sequences; and verbatim string literals, prefixed\
    \ with the @ symbol. Visual Basic strings are identical to C# verbatim string\
    \ literals, including the method of embedding double-quote symbols.\n\n```\nC#nstring\
    \ notice = @\"This is verbatim\" text.\"\n```\n\n# Visual Basic\n\n```\nDim notice\
    \ As String = \"\"This is verbatim\" text.\" \n```\n\nC#' standard string literals\
    \ have no direct equivalent in Visual Basic. To simulate C#'s escape sequences,\
    \ you must concatenate variations of these special characters into your target\
    \ literal. VB includes some intrinsic literals for these symbols (found in Microsoft.VisualBasicConstants,\
    \ or you can use those provided by the .NET Base Class Libraries (such as System.Environment.NewLine).\
    \ You can also use Visual Basic's Chr or ChrW functions to return a character\
