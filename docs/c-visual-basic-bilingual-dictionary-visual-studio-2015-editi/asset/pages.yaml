  md: '# join Query Expression Operator (LINQ)


    Visual Basic''s Join query expression operator is the same as the join operator
    in C#.


    ```

    var result = from item in Employees

    join dept in Departments

    on item.Department equals dept.ID

    select new {item.FullName, dept.DeptName};

    ```


    ```

    Dim result = From item in Employees

    Join dept In Departments

    On item.Department Equals dept.ID

    Select item.FullName, dept.DeptName

    ```


    As with C#, Visual Basic also supports group joins using the Group Join syntax.
    C# doesn''t include an equivalent "group" keyword, but its clause parallels the
    Into clause used in the VB version.


    ```

    var result = from dept in Employees

    join emp in Employees

    ond dept.ID equals emp.Department into empSets

    select new (dept.DeptName,

    RecentHires = empSets);

    ```


    ```

    Dim result = From dept In Departments

    Group Join emp In Employees

    On dept.ID Equals emp.Department Into Group

    Select dept.DeptName, RecentHires = Group

    ```


    In both languages, you can use multiple "from" and "where" clauses to perform
    joins between different range sources. See the "from Query Expression Operator"
    entry in this chapter for an example that uses this syntax.


    See Also


    Query Expressions'
