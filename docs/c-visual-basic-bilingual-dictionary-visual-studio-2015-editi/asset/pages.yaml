- img_proc: true
  md: "C# uses a single continue statement to begin the next iteration of a loop construct.\
    \ The type of loop is not important; the statement always initiates the next iteration\
    \ of the innermost loop.\n\n```\nC#nfor (counter = 0; counter < 10; counter++)\n\
    {\n    // Some code, then...\n    continue;\n    // More code.\n}\n```\n\nBecause\
    \ Basic lets you identify a specific loop type, it is possible to move to the\
    \ next iteration of a loop containing the innermost loop.\n\n```\nVISUAL BASICnFor\
    \ counter As Integer = 0 To 9\nWhile (content.Length > 0)\n    ' ---- This will\
    \ exit the Do loop, and move\n    ' to the next iteration of the For loop.\nContinue\
    \ For\n```\n\nNext counternC#'s combined continue statement doesn't support this\
    \ level of jumping. Instead, you must use other methods, such as a goto statement,\
    \ to exit the innermost loop.\n\n```\nC#nfor (int counter = 0; counter < 10; counter++)\n\
    {\n    while (content.Length > 0)\n{\n        // ---- This will exit the while\
    \ loop, and move\n        // ---- to the next iteration of the for loop.\n   \
    \     goto NextIteration;\n    }\n    // ---- Any code here will be skipped by\
    \ goto.\n```\n\n```\nNextIteration:\n} // Innermost jump comes here.\n```\n\n\
    Conversion and CastingnVisual Basic supports (1) implicit (widening) casting or\
    \ conversion of data, such as from Integer to Long; (2) enhanced implicit conversions\
    \ of data when Option Strict Off is used; and (3) explicit casting or conversion\
    \ of data through VB's intrinsic conversion operators (such as CInt), the DirectCast"
  merge: -1
