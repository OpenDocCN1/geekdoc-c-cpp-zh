  md: "# Do Statement\n\n# Widening Modifier\n\nVisual Basic's Widening modifier indicates\
    \ that an overloaded conversion from one type to another may be performed implicitly,\
    \ as the destination type is wide enough for all the source type's possible values.\n\
    \n```\nVISUAL BASIC\nclass SmallType\n    Public Shared Widening Operator CType(\n\
    \        ByVal source As SmallType) As BigType\n        Return New BigType(source.GetValue())\n\
    \    End Operator\nEnd Class\n```\n\nThe equivalent C# overload uses the implicit\
    \ modifier to express this same conversion.\n\n```\nC#nclass SmallType\n{\n  \
    \  public static implicit operator BigType(\n        SmallType source)\n    return\
    \ new BigType(source.GetValue());\n}}\n```\n\n# See Also\n\n+   Narrowing Modifier,\
    \ Operator Statement\n\n# With Clause\n\n+   See\n\n+   Initializers\n\n# With\
    \ Statement\n\nC# does not include an equivalent for Visual Basic's With block\
    \ statement.\n\n# WithEvents Modifier\n\nC# does not include an equivalent for\
    \ Visual Basic's WithEvents modifier. You do not need to indicate to the compiler\
    \ that a variable will use event handlers. Instead, you must manually attach events\
    \ within method logic as you do in VB through the AddHandler statement. See the\
    \ “AddHandler Statement” entry in this chapter for information on attaching events\
    \ in C#.\n\n# See Also\n\n+   AddHandler Statement"
