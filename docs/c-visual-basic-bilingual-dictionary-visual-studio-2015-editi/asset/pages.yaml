  md: 'Visual Basic does include its own &= operator. However, it combines string
    concatenation and assignment, and does not process logical or bitwise operations.


    See Also


    +   - Assignment Operators


    +   - Cast Expression


    See


    +   - Conversion and Casting


    +   - Expression Grouping


    When used to group expressions, parentheses in Visual Basic are identical in syntax
    to grouping parentheses in C#. However, there are times when a set of parentheses
    is required around an expression in C#, but is optional when creating the equivalent
    statement in VB. For instance, the condition for an if statement in C# must be
    enclosed in parentheses, but Visual Basic does not have this requirement.


    ```

    C#n// ----- Parentheses required in C#.

    if (totalCount >= 100)


    VISUAL BASIC

    '' ----- Parentheses optional in Visual Basic.

    If totalCount >= 100 Then

    ```


    +   * Dereference Operator


    Visual Basic does not include direct support for pointer operations, and therefore
    does not include a dereferencing operator.


    See Also


    +   - Member Access Operator, Pointers


    +   * Multiplication Operator


    The * multiplication operator in Visual Basic uses the same symbol and syntax
    in C#.


    ```

    C#nresult = originalValue * 5;


    VISUAL BASIC

    result = originalValue * 5

    ```


    +   *= Assignment Operator


    Visual Basic''s *= assignment operator is identical to the one found in C#.'
