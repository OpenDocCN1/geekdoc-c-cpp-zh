    In C#, use the System.Math.Floor method to produce results identical to those
    returned by Visual Basic''s Int method. Integer values always return the original
    value. For decimal inputs, the method returns the integer portion of the number,
    with rounding toward negative infinity.


    ```

    Visual Basic

    result = Int(originalDecimal)

    ```


    ```

    C#

    result = System.Math.Floor(originalDecimal);

    ```


    # Integer Data Type


    C#''s intrinsic data type is identical to Visual Basic''s Integer data type. Both
    types are aliases for .NET''s System.Int32 type. For integer literals, Visual
    Basic uses an I, i, or % suffix after the value; C# does not include such a suffix,
    all integer literals that fit into the range of the int type are automatically
    typed as int.


    ```

    Visual Basic

    Dim counter As Integer = 0% or OI or Oi

    ```


    ```

    C#

    int counter = 0;

    ```


