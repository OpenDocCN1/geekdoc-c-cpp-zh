    # Compiler Constants


    Visual Basic and C# include project-level support for the DEBUG and TRACE compiler
    constants. Code throughout the .NET Framework responds to these constants, and
    you can use them in your own code. To alter the default settings, set the Define
    DEBUG Constant and Define TRACE Constant fields as needed. In VB, these fields
    appear in the Advanced Compile Options area of the Project Properties’ Compile
    tab. In C#, they appear on the Build tab.


    Visual Basic defines four (or up to nine) additional constants.


    | Constant | Description |

    |---|---|

    | CONFIG | The active build configuration, typically "Debug" or "Release." |

    | TARGET | The compiled application type, one of: "winex," "exe," "library," or
    "module." Other custom values are also possible. |

    | VBC_VER | The current version of Visual Basic, in major.minor format. One of
    the following values: 8.0 (VB2005), 9.0 (VB2008 and VB2010), 11.0 (VB2012), 12.0
    (VB2013), or 14.0 (VB2015). |

    | _MYTYPE | The version of the My pseudo-namespace in use. Depending on the value
    of this constant, the compiler may define one or more of the additional constants:
    _MYAPPLICATIONTYPE, _MYCOMPUTYPE, _MYFORMS, _MYUSERTYPE, and _MYWEBSERVICES. |


    C# does not automatically define equivalents for these constants.


    # Const Statement


    Both C# and Visual Basic support the declaration of constants at the local and
    type levels. The syntax of VB’s Const statement closely parallels standard variable
    declaration, replacing Dim with Const. C#’s syntax similarly follows its variable
    declaration, adding const before the core declaration.


    # Visual Basic


    ```

    Const DefaultPort As Integer = 25

    C#nconst int DefaultPort = 25;

    ```


    In both languages, you can string multiple constant declarations together'
  merge: -1
  pgno: 232
- img_proc: true
  md: 'with commas. The two languages also support similar rules on what can be assigned
    to the constant: literals, enumeration values, and other constants, all joined
    with basic operators.


    At the field level, each constant declaration can include an access modifier.


    # Visual Basic


    ```

    Public Const DefaultPort As Integer = 25

    ```


    # C#


    ```

    public const int DefaultPort = 25;

    ```


    If Option Infer On is used, Visual Basic will infer the data type of the expression
    when possible, removing the need for a specific type.


    # VISUAL BASIC


    ```

    Const DefaultPort = 25

    ```


    C# requires a data type be indicated for every constant. Additionally, some constant
    declarations are not permitted in C# due to boxing or other reference issues.


    # C#


    ```

    // This code will not compile

    const object usesBoxing = 10;

    const object implicitReference = "Message";

    ```


    Such declarations are permitted in Visual Basic.


    # Constants Class


    Microsoft.VisualBasic.Constants class contains miscellaneous constants useful
    to Visual Basic developers. Most of these constants are useful only in relation
    to other VB features that are not found in C#. There are a few constants, such
    as vbLf, that have special string-based equivalents in C#. For information on
    these constants, see the “ControlChars Class” entry in this chapter.


