    To see specific examples of these native operators, use the “See Also” block later
    in this chapter to locate query expression entries. When a specific LINQ method
    is not supported natively, each language allows that method to be included directly
    as part of the query expression syntax.


    # Visual Basic


    ```

    Dim allNames = (From set1 in OldCustomers

    Select set1.FullName).Union(

    From set2 in NewCustomers

    Select set2.FullName);

    ```


    # C#


    ```

    var allNames = (from set1 in OldCustomers

    select set1.FullName).Union(

    from set2 in NewCustomers

    select set2.FullName);

    ```


    Both languages support the LINQ providers supplied with Visual Studio: LINQ to
    Objects, LINQ to DataSet, LINQ to Entities, and LINQ to XML. (LINQ to SQL, formerly
    supported in both languages, has been deprecated in favor of LINQ to DataSet and
    LINQ to Entities.) Visual Basic''s interaction with LINQ to XML includes the ability
    to generate new XML content as part of its XML Literals support. C# does not include
    this feature.


    In Visual Basic, the compiler attempts to detect the end of a LINQ statement syntactically.
    However, there may be times when the compiler will not be able to correctly determine
    whether a statement that follows a query expression is part of the query or not.
    In such cases, a blank line must appear between the query expression and the subsequent
    statement. Because all statements in C#, including LINQ statements, end with a
    semicolon, this type of ambiguity is not an issue.'
