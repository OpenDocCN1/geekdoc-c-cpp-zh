  md: '# VBFixedStringAttribute Class


    The VBFixedStringAttribute class is used to indicate that a string field should
    be treated as if it has a fixed length when used with certain file operations.
    For example, VB''s FileGet and FilePut methods use this attribute when reading
    and writing structured data. The attribute itself does not alter its associated
    string, but provides information to code within methods like FileGet via reflection.
    Outside of these specific Visual Basic methods, the attribute has no impact on
    application logic, and is therefore not useful in a C# context.


    # VTypeName Method


    Visual Basic''s VTypeName method accepts input from a set of .NET type names,
    and returns a similar pre-NET VB type name. No direct equivalent exists in C#.
    However, the following table shows the full set of results produced by VTypeName.
    The case of the input term is ignored.


    | Input Value | Output Value |

    | Boolean or System.Boolean | Boolean |

    | Byte or System.Byte | Byte |

    | Char or System.Char | Char |

    | DateTime or System.DateTime | Date |

    | Decimal or System.Decimal | Decimal |

    | Double or System.Double | Double |

    | Short or System.Int16 | Short |

    | Integer or System.Int32 | Integer |

    | Long or System.Int64 | Long |

    | Object or System.Object | Object |

    | Single or System.Single | Single |

    | String or System.String | String |


    All other inputs return Nothing, the equivalent of null in C#.'
