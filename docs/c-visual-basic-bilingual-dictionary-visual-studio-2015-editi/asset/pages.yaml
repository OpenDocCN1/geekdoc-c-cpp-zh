    # EOF Method


    Visual Basic''s EOF method indicates whether the current reading or writing position
    for an open file is the end of that file.


    # VISUAL BASIC


    Dim atEndFile As Boolean = EOF(fileNumber)

    C# does not have the same file-management features included with VB. Instead,
    it is common to work with the System.IO.FileStream class to read and write files.
    This class does not include a direct equivalent for the EOF method. Instead, you
    can compare the length of the file with its current o-position, or you can attempt
    to read data from the file.


    # C#


    ```

    // --- Comparing position to length.

    bool atEndFile = (openedStream.Position >=

    openedStream.Length);

    ```


    ```

    // --- Attempting to read more data.

    int nextByte = openedStream.ReadByte();

    atEndFile = (nextByte == -1);

    ```


    If you opened a file using the System.IO.StreamReader, the TextReader instance
    includes a Peek method that can be used to check for the end of the file.


    # C#


    ```

    atEndFile = (openedReader.Peek() == -1);

    ```


