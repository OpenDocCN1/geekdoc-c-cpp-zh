    In 2015, Visual Basic received a new #Disable preprocessing directive that prevents
    the compiler from reporting specific error conditions. C# uses the #pragma statement
    for this same purpose.


    ```

    VISUAL BASIC

    ----- Turn an error off.

    #Disable Warning BC1234

    C#

    // --- Turn an error off.

    #pragma warning disable CS1234

    ```


    Both languages accept comma-delimited lists of error codes.


