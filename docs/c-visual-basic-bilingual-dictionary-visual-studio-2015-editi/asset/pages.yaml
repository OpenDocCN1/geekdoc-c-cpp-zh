  md: '# UBound Method


    The System.Array class'' GetUBound method returns the same information as Visual
    Basic''s UBound method. For multidimensional arrays, UBound assumes the first
    rank, unless other 1-based rank is specified. The GetUBound method requires a
    o-based rank.


