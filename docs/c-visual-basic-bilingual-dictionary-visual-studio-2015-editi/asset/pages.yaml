  md: '# Who Needs this Book?


    Decades ago, developers who cut their teeth on C and BASIC could build an entire
    career by sticking with just one general-purpose language. Today, software houses
    demand that their programmers be fluent in multiple languages, scripts, data formats,
    and platforms, both mobile and desktop. If you already speak VB, there''s a good
    chance you will require some proficiency with C# as well, and vice versa.


    The C#-Visual Basic Bilingual Dictionary is designed for all Visual Basic and
    C# developers, including those who only use one of those languages. The Internet
    contains a wealth of support content for .NET developers. However, searching online
    for an answer to some thorny Framework issue produce results in “other” language.
    Solving your coding problem may require you to act as a foreign-language translator,
    and having a good dictionary by your side is a must.


    This book is also a good resource for Visual Basic developers who target mobile
    devices with the “VB Core” reduced runtime library. VB programs lack access to
    many features in the Microsoft.VisualBasic and My namespaces. Often, these missing
    features can be replaced with language-agnostic .NET framework features, and in
    ways that happen to be identical to the equivalent C# implementation. If you depend
    on VB Core, locate the missing features in Chapter 2 and Chapter 3 of this text
    to find useful logic.


    This text is a reference work, and not a training manual. While it can teach you
    a lot about Visual Basic and C#, it is not organized in a way that would be convenient
    for those new to .NET programming in general. The book assumes that you are at
    least partially familiar with one of the two languages, or with .NET programming.


    What’s in the Book?

    This reference book exists to make repeated jumps between Visual Basic and C#
    as painless and informative as possible. Nearly 900 dictionary-like entries cover
    every keyword and most grammar concepts found in the two languages. The entries
    appear in three language-specific chapters.


    +   - Chapter 1 includes entries for all C# keywords and features, sorted by name.
    Each entry provides equivalent Visual Basic syntax and usage details for a specific
    C# construct.

    - Chapter 2 reverses the process, supplying C# substitutes and details for each
    entry in a sorted list of Visual Basic keywords and features.'
  merge: -1
