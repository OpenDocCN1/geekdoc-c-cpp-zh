  md: 'Visual Basic’s Return statement is identical in use and syntax to C#''s return
    statement, both for methods with return values and for those without.


    ```

    C#n// ---- For methods with void return type.

    return;


    // ---- For methods with non-void return type

    return someValue;


    VISUAL BASIC

    '' ---- For methods with void return type (Sub)

    Return


    '' ---- For methods with non-void return type (Function)

    Return someValue

    ```


    For methods that do not return a value (Sub methods), Visual Basic also supports
    the Exit Sub statement, which is functionally equivalent to Return. (A related
    Exit Property statement exists for properties.)


    ```

    VISUAL BASIC

    '' ---- For methods with a void return type.

    Exit Sub

    ```


    For methods that return a value in VB (Function methods), that value can be assigned
    to the name of the function, and the Exit Function can be used to exit the method
    early.


    ```

    VISUAL BASIC

    Public Function DetermineValue() As Integer

    Dim theValue As Integer


    '' ---- Calculating logic, then...

    DetermineValue = theValue

    Exit Function


    '' ---- More logic can appear here.

    End Function

    ```


    This variation exists for backward compatibility. The use of the newer syntax
    is recommended.'
