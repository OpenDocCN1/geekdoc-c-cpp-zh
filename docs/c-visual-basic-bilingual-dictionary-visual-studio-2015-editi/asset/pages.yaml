    # Oct Method


    An overload of the Convert.ToString method accepts a target numeric base. Passing
    a base of 8 to this method replicates the output of Visual Basic''s Oct method.


    ```

    VISUAL BASIC

    Dim result As String = Oct(123) '' --> "173"


    C#nstring result = System.Convert.ToString(123, 8);

    ```


    # Of Clause


    Visual Basic uses an Of clause within a set of parentheses to indicate the data
    types in a generic declaration. In C#, this declaration appears in a set of angle
    brackets.


    ```

    VISUAL BASIC

    Dim lookupSet As Dictionary(Of Long, String)


    C#nDictionary<long, string> lookupSet;

    ```


    This syntax extends to class definitions, and anywhere else Visual Basic would
    normally place the Of clause in parentheses.


    See

    Generics


    # On Error Statement


    C# does not include support for unstructured error handling, and therefore it
    has no equivalent for Visual Basic''s On Error statement. Instead, you must use
    structured error handling constructs.


