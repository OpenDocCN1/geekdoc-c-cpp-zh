    In C#, all variables must be assigned an initial value before they are used elsewhere
    in code. In Visual Basic, all variables are initialized automatically to their
    default values: Nothing for reference types; some variation of zero for intrinsic
    value types and enumerations; and an instance with initialized members for structures.


    Inferred variables in C# use the instance type.


    ```

    C#

    // Inferred as string

    var message = "Hello, world.";

    ```


    In Visual Basic, you use the standard Dim statement, but leave off the As clause
    to trigger local type inference. Option Infer On must be used at the project level
    for this work.


    # Visual Basic


    ```

    '' ----- Inferred as string.

    Dim message = "Hello, world.";

    ```


    Locely defined variables in VB can be used as the iteration variable in a For
    loop. In C#, the iteration variable must be defined as part of the foreach loop
    declaration itself.


