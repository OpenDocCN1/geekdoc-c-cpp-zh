  md: '# New with Visual Studio 2015


    In 2015, Visual Basic received a new #Enable preprocessing directive that prompts
    the compiler to once again report specific error conditions. C# uses the #pragma
    warning statement for this same purpose.


    ```

    VISUAL BASIC

    '' ----- Turn an error back on.

    #Enable Warning BC1234

    C#

    // ---- Turn an error back on.

    #pragma warning restore CS1234

    ```


    Both languages accept comma-delimited lists of error codes.


    # #ExternalChecksum Directive


    In generated ASP.NET source files, C#''s #pragma checksum directive serves the
    same purpose as Visual Basic''s #ExternalChecksum directive. Neither statement
    should be used directly within code, except as generated by .NET Framework.


    # #ExternalSource Directive


    There is no equivalent in C# for the #ExternalSource directive. Even in Visual
    Basic it is only used within generated code, and not normally added by developers.


    # #If Directive


    The general syntax of preprocessing conditional statements in C# parallels the
    usage found in Visual Basic, with some minor spelling and casing differences.


    | Visual Basic Term | C# Term |

    |---|---|

    | #If...Then | #if |

    | #Else...Then | #elif |

    | #Else | #else |

    | #End If | #endif |


    The key difference appears in the conditions themselves. In Visual Basic, preprocessor
    values exist as Booleans, integers, floating-point values, strings, or dates,
    and you can apply typical VB operators to those values. Preprocessor values in
    C# act like Booleans; they either exist or they don''t.'
