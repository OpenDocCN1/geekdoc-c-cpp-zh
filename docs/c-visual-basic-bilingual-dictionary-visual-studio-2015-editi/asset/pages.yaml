    # Replace Method


    For basic replacements of all occurrences of one substring with another, the string
    type''s Replace method produces the same results as Visual Basic''s Replace method.


    # Visual Basic


    ```

    sourceString = "I vote yes."

    result = Replace(sourceString, "yes", "no")

    ```


    ```

    C#nsourceString = "I vote yes."

    result = sourceString.Replace("yes", "no");

    ```


    The Replace method accepts additional arguments that indicate the starting 1-based
    position and the number of occurrences to replace. The string type''s Replace
    method lacks these features. Instead, you can use regular expressions to perform
    this replacement. The start position in the C# version is o-based.


    # Visual Basic


    ```

    C#nresult = Replace(sourceString, "A", "Z", startAt, count)

    ```


    ```

    // ---- Assumes: using System.Text.RegularExpressions

    ```


    ```

    // For a case-sensitive replacement.

    Regex replaceEngine = new Regex("A")

    ```


    ```

    // ---- For a case-insensitive replacement.

    Regex replaceEngine = new Regex("A",

    RegexOptions.IgnoreCase);

    ```


    ```

    // ---- Finally, perform the replacement.

    result = replaceEngine.Replace(

    sourceString, "Z", count, startAt - 1);

    ```


    The pattern to match and the replacement may both need to be adjusted using regular
    expression if they contain special characters. See Visual Studio''s documentation
    on regular expressions for more information.


