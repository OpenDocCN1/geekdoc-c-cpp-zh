    Fields

    Fields are variables declared within a class or structure (plus modules in VB),
    outside of any method. The syntax closely parallels that of local variable declaration.
    (See the "Variables" entry in this chapter for more declaration details.)


    ```

    C#n// ---- Field declared with initializer.

    private int MonitoredValue = 0;


    VISUAL BASIC

    '' Field declared with initializer.

    Private MonitoredValue As Integer = 0

    ```


    > '' The "Dim" keyword is optional, but required

    when no access modifier is used.

    Dim AnotherValue As Integer


    Access modifiers are optional in field declarations. When missing, the access
    level defaults to private in C# classes and structures. Within a Visual Basic
    Class or Module, fields are Private by default; they are Public by default when
    used in a Structure.


    Fields support the following modifiers in each language.


    | C# Modifier | Visual Basic Modifier |

    | internal | Friend |

    | new | Shadows |

    | private | Private |

    | protected | Protected |

    | protected internal | Protected Friend |

    | public | Public |

    | readonly | ReadOnly |

    | static | Shared |

    | volatile | Not supported |

    | Not supported | WithEvents |'
