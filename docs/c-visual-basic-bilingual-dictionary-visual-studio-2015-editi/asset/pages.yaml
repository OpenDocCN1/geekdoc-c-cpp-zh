  md: '# MessageBox.Show("App already running");


    Likewise, elements like authentication and splash-screen features must be managed
    through standard code, although specific implementations are beyond the scope
    of this book.


    Visual Basic''s View Windows Settings button adds an app.manifest file to the
    project that can be edited manually. C# includes comparable manifest features
    directly on the Application Tab, plus some other resource options not normally
    accessible in VB.


    # Compile Tab


    Most of the features on the Compile tab appear in Visual Basic''s Build tab, although
    many of the names are altered. In most cases, you should be able to determine
    fairly quickly what the equivalent field is. Both tabs include an Advanced button,
    and some of the fields considered advanced compile options in VB (including settings
    for DEBUG, TRACE, and custom constants) appear on the main Build tab in C#. The
    fields displayed by VB''s Build Events appear on a distinct Build Events tab in
    C#''s project properties.


    C# does not include direct equivalents for the Option settings (such as Option
    Explicit) on VB''s Compile tab. See the specific Option entries in this chapter
    for how to manage these features in C.


    Visual Basic''s Advanced compile options include a Remove Integer Overflow Checks
    option. Because integer operations Overflow/Underflow are checked by default in
    VB, but unchecked by default in C#, selecting these options results in different
    behavior between the languages. If you check the option in Visual Basic, you should
    leave it unchecked in C#, and vice versa.


    # References Tab


    C# does not have a direct equivalent for Visual Basic''s References tab. Instead,
    the list of project references appears in the project''s Solution Explorer view.
    (The list of project references can also be accessed through the Solution Explorer
    in VB, although some editions show the Show All Files feature of that panel be
    activated.) The References branch of the project tree gives you access to included
    references. Right-click on elements of this branch to make changes.


    The Reference Paths button on VB''s References exists in C# as a distinct Reference
    Paths tab. VB''s Imported Namespace region, however, cannot be found in C#''s
    project settings. Instead, you must add using statements'
