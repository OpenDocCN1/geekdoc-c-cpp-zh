    # Project Properties


    C# and Visual Basic offer nearly identical settings through the Project Properties
    window. Visual Studio presents a tabbed collection of settings, and most of the
    tabs that exist in C# are found in VB, and in an identical configuration. The
    set of available tabs and tab features will vary based on the type of project.


    This entry describes a few of the differences you will encounter when moving from
    C# to Visual Basic. To see a list of differences from the perspective of moving
    from Visual Basic to C#, see the “Project Properties” entry in Chapter 2.


    # Application Tab


    Standalone C# applications begin through a Main method. The Application'
