  md: '# var Implicit Type


    C#''s var keyword allows you to create a strongly type variable whose type is
    determined by context. Such values are commonly used as recipients of LINQ queries,
    since those statements return anonymous types.


    ```

    C#

    // --- These two statements create an int and an

    // anonymous type with two members.

    var basicValue = 10;

    var moreComplex = new { ID = 10, Name = "Ten" };

    ```


    In Visual Basic, the standard Dim declaration keyword, when used without An Clause,
    accomplishes this purpose.


    ```

    VISUAL BASIC

    Dim basicValue = 10

    Dim moreComplex = New With { .ID = 10, .Name = "Ten" }

    ```


    To enable this implicit typing, VB requires the Option Infer On statement used,
    either at the top of the relevant source file, or configured for all files through
    the project''s properties.


    # See Also


    +   Query Expressions


    # Variables


    In C#, local variables appear without any special keyword.


    ```

    C#

    int basicValue;        // No initializer

    string greeting = "hi"; // With initializer

    byte[] storage;        // Array

    ```


    In Visual Basic, the Dim statement declares local variables.


    ```

    VISUAL BASIC

    Dim basicValue As Integer      '' No initializer

    Dim greeting As String = "hi" '' With initializer

    Dim storage() As Byte          '' Array

    ```


    Just in C#, VB allows multiple variables to be declared in a single statement,
    using a comma to separate the identifiers.


    ```

    C#

    // --- Both variables typed as DateTime.

    DateTime startTime, endDate;


    // --- Different types require different statements.

    int i1, i2, i3;

    short s4, s5;

    ```'
  merge: -1
