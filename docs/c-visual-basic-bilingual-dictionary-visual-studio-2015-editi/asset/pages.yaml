    # New with Visual Studio 2015


    In 2015, C# added a new using static statement that, when paired with an enumeration,
    allows use of the enumeration’s members without specifying the enumeration name
    in code. Visual Basic allows this through its Imports statement.


    ```

    C#n// Before 2015.

    DoorState frontDoor = DoorState.Closed;


    // Starting in 2015, at the top of the file.

    using static DoorNamespace;

    using static DoorNamespace.DoorState;


    // Later, within a method.

    DoorState backDoor = IsClosed;


    VISUAL BASIC

    '' At the top of the file.

    Imports DoorNamespace

    Imports DoorNamespace.DoorState


    '' Later, within a method.

    Dim frontDoor As DoorState = DoorState.Closed


    '' This will also work thanks to the Imports.

    Dim backDoor As DoorState = IsClosed

    ```


