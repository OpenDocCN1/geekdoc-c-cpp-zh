    # Seek Method


    Visual Basic''s Seek method gets or sets the current read or write position in
    a file opened with the FileOpen method. All positions are 1-based, and can indicate
    a byte, record, or sequential block position based on the open mode of the file.


    ```

    VISUAL BASIC

    '' Return the current 1-based position.

    Dim currentPos As Long = Seek(fileNumber)

    ```


    ```

    '' Set a new 1-based position.

    Seek(fileNumber, targetPosition)

    C# does not include the file-management features included with VB. Instead, it
    is common to work with the System.IO.FileStream class to read and write files.
    This class includes a Position property and a Seek method that together provide
    functionality similar to VB''s Seek method. The key differences are that the FileStream''s
    features only indicate byte positions and not record or block positions, and that
    its positions are o-based.

    ```


