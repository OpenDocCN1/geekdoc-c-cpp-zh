  md: 'In general, C#''s & operator is identical to Visual Basic''s And operator,
    both for integer (bitwise) and Boolean (logical) operations.


    ```

    VISUAL BASIC

    Dim clapHands As Boolean = (happy And knowIt)

    ```


    ```

    C#

    bool clapHands = (happy & knowIt);

    ```


    When applying Option Stric Off to a Visual Basic project or source file, using
    the And operator with one integer operand and one Boolean operand forces the Boolean
    value to an integer (0 or I), and then performs a bitwise operation. C# does not
    allow this mixture of operator types.


    # AndAlso Conjunction Operator

    C#''s & operator is generally identical to Visual Basic''s AndAlso short-circuiting
    conjunction operator.


    ```

    VISUAL BASIC

    If ((result IsNot Nothing) AndAlso

    (result.Length > 10)) Then

    ```


    ```

    C#

    if ((result != null) && (result.Length > 10))

    ```


    # Anonymous Methods

    See

    Lambda Expressions


    Anonymous Types

    Visual Basic uses the New and With operators to define a new anonymous type.


    ```

    VISUAL BASIC

    Dim samplePerson = New With {.Name = "John", .Age = 42}

    ```


    C# uses a similar syntax with its new operator. The period that appears each VB
    field is not included in the C# equivalent.


    ```

    C#

    var samplePerson = new Name { "John", Age = 42 };

    ```


    VB allows you to specify any anonymous type properties "key" properties, those
    that can be used for testing for equivalence between two instances.


    ```

    VISUAL BASIC

    Dim samplePerson = New With {Key.ID = 123,

    .Name = "John", .Age = 42}

    ```'
