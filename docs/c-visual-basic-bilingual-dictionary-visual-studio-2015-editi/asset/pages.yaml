  md: '# Write Method


    Visual Basic''s Write method (and the related WriteLine method) outputs content
    to a file opened with the FileOpen method. Designed for structured data, Write
    inserts commas and quotation marks as needed to delimit each piece of data. WriteLine
    adds a carriage-return and line-feed pair.


    ```

    VISUAL BASIC

    '' Output a string and a number, like:

    '' ''Seattle'', 84

    WriteLine(fileNumber, cityName, totalMatches)

    ```


    C# does not include the same file-management features included in VB. Instead,
    it is common to work with the System.IO.StreamWriter class to output text data.
    This class includes Write and WriteLine methods with overloads for outputting
    different types of data. You must emit the commas and quotation marks manually.


    ```

    C#

    // Output a string and a number, like:

    // "Seattle", 84

    outFile.Write("\"" + cityName + "\"");

    outFile.Write(",");

    outFile.WriteLine(totalMatches);

    ```


    See Also


    +   FileOpen Method


