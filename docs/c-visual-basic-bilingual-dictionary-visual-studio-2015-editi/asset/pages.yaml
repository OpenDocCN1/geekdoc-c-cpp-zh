  md: '# Len Method


    Visual Basic''s Len method returns the length of a string, or the number of bytes
    occupied by a value type. The following table shows the return value for expressions
    of specific Visual Basic data types.


    | Expression Type | C# Data Type | Return Value |

    | Boolean | bool | 2 |

    | Byte | byte | 1 |

    | Char | char | 2 |

    | Char array | char array | expression.Length |

    | Date | Not available | 8 |

    | Decimal | decimal | 8 |

    | Double | double | 8 |

    | Integer | int | 4 |

    | Long | long | 8 |

    | SByte | sbyte | 1 |

    | Short | short | 2 |

    | Single | float | 4 |

    | String | string | expression.Length |

    | UInteger | uint | 4 |

    | ULong | ulong | 8 |

    | UShort | ushort | 2 |

    | structure | structure | Length of structure members, with adjustments |


    The sizeof operator in C# returns results that are similar to VB''s Len method
    when used with basic value types. For the intrinsic value types listed in the
    above table, sizeof returns the same values as Len with two exceptions: (1) sizeof(bool)
    returns 1 instead of the Len(Boolean) value of 2; and (2) sizeof(decimal) returns
    16 instead of the Len(Decimal) value of 8.'
