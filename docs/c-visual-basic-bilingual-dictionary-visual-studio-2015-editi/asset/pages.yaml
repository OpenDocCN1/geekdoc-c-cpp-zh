  md: "# Err Object\n\nVisual Basic's Err object is used to identify error details\
    \ as part of the language's unstructured error handling system. Because C# only\
    \ includes structured error handling, it does not include an equivalent for Err.\
    \ However, because Err uses internally a reference to the active structured Exception,\
    \ converting your unstructured error handling code to the structured equivalent\
    \ will provide you with comparable error access.\n\n```\nVISUAL BASIC\nOn Error\
    \ GoToErrorHandler\n  '----- Later...\nErrorHandler:\n  LogError(Err.Description)\n\
    \  Resume Next\n```\n\n```\nC#ntry {\n  // ----- Error-prone code here.\n}\ncatch\
    \ (System.Exception ex)\n{\n  LogError(ex.Message);\n}\n```\n\nSee Also\n\n+ \
    \  * On Error Statement\n\n# Err Property\n\nVisual Basic's Err property presents\
    \ the most recent error as part of the language's unstructured error handling\
    \ system. C# only includes support for structured error handling. The closest\
