    Both Visual Basic and C# support similar features for working with parameters
    and arguments. By default, all comma-delimited arguments are passed by-value into
    the matching parameters. To change this default in Visual Basic, use the ByRef
    modifier. In C#, use the ref or out pass-by-reference modifiers to provide bidirectional
    and out-only reference content passing, respectively. In VB, the data type for
    each parameter appears in an As clause after the identifier. C# places the data
    type by itself just before the identifier.


    # VISUAL BASIC


    ```

    '' Parameters are:

    '' content: in/out-by-reference

    '' method: by-value

    '' warnings: in/out-by-reference

    ```


    ```

    Public Function CorrectContent(ByRef content As String,

    ByVal method CorrectContent(ref warnings As String)

    ```


    # C#


    ```

    // Parameters are:

    // content: in/out-by-reference

    // method: by-value

    // warnings: out-only-by-reference

    ublic bool CorrectContent(ref string content,

    int method, out string warnings)

    ```


    Normally, you can simply use C#''s ref modifier in place of the Visual Basic ByRef
    modifier. If you know that data will never be passed in through that parameter,
    and will only have sent out, you can use the modifier instead. When passing values
    by reference, the calling code must have already assigned a value to the argument
    being passed. In C#, the calling code applies the out or ref modifier to match
    the one in the parameter list, something not needed in VB.


    # VISUAL BASIC


    ```

    '' userContent must have been assigned a value.

    success = CorrectContent(userContent, 3, warningText)

    ```


    # C#


    ```

    // userContent must have been assigned a value.

    success = CorrectContent(ref userContent, 3,

    out warningText);

    ```


