- img_proc: true
  md: 'The Lib clause indicates the source file, while the optional Alias clause identifies
    the method name in the library for those times when you want to give it a different
    name within your code. Replace Sub with Function to import a method that returns
    data, and update the signature as needed.


    Methods imported with the Declare statement are Public by default. Also, imported
    methods are assumed to work with ANSI character sets. To alter this default, follow
    the Default keyword with the Unicode, Auto, or (to make the default clear) Ansi
    keyword.


