    # #define Directive


    In C#, the #define directive declares preprocessing constants. These constants
    are in essence Boolean, in that they either exist (true-like) or they don''t (false-like).
    The parallel #undef directive removes constants previously declared with #define.


    ```

    C#n#define TestVersion

    ```


    In Visual Basic, preprocessing constants come into using the #Const directive.
    Unlike the Boolean nature of C# preprocessing constants, the parallel constants
    in VB can be Boolean, integer, floating point, string, or date values.


    ```

    VISUAL BASIC

    #Const TestVersion = "Beta 0.7"

    ```


    To clear a previously declared VB constant from use, assign it a value of Nothing.


    ```

    VISUAL BASIC

    #Const TestVersion = Nothing

    ```


    # #error Directive


    There is no equivalent in Visual Basic for the #error directive.


    # #if Directive


    The general syntax of preprocessing conditional statements in Visual Basic parallels
    closely the usage found in C#, with some minor spelling and casing differences.


    | C# Term | Visual Basic Term |

    | --- | --- |

    | #if | #If...Then |

    | #elif | #ElseIf..Then |

    | #else | #Else |

    | #endif | #End If |


    The key difference appears in the conditions themselves. Preprocessor values in
    C# act like Booleans; they either exist or they don''t. In Visual Basic,'
