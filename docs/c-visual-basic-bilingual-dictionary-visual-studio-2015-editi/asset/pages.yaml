    # Split Method


    In C#, the string type''s Split method returns results similar to that of Visual
    Basic''s Split method. VB''s Split method accepts a single string delimiter; The
    string.Split method accepts an array of string or char values, all of which are
    treated as delimiters.


    > VISUAL BASIC

    '' Return all delimited components.

    Dim source As String = "Hello,World"

    Dim delim As String = ","

    Dim result() As String = Split(source, delim)


    > --- Split off only the first delimited component.

    result = Split(source, delim, 1)


    ```

    C#

    // Return all delimited components.

    string source = "Hello,World";nchar[] delim = new char[] {'',''''};

    string[] result = source.Split(delim);

    ```


    > --- Split off only the first delimited component.

    result = Split(delim, 1);


    The Split method includes an option that specifies whether to use text (case-insensitive)
    or binary (case-sensitive) sorting rules for the delimiter. The string type''s
    Split method lacks this option. Instead, it has an additional option that indicates
    whether to omit zero-length strings in the returned array.


    ```

    C#

    result = source.Split(delim,

    StringSplitOptions.RemoveEmptyEntries);

    ```


