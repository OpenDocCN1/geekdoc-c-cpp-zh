    \ syntax, differing primarily in the format of the return statement used to exit\
    \ the method.\n\nThe syntax of functions in C# isn't too different from what appears\
    \ in Visual Basic. Each includes an identifier name followed by a parameter list\
    \ in parentheses. Both languages support a similar complement of declaration modifiers.\
    \ In C#, the return data type declaration moves from the As clause to just before\
    \ the method identifier.\n\n# Visual Basic\n\n```\nPublic Function ParseText(ByVal\
    \ timeText As String,\nByRef hours As Integer, ByRef minutes As Integer) _\nAs\
    \ Boolean\n  ' Core logic, then...\n  Return success\n```\n\nEnd Function\n\n\
    # C#\n\n```\npublic bool ParseText(string timeText,\n  ref int hours, ref int\
    \ minutes)\n{\n  // ---- Core logic, then...\n  return success;\n}\n```\n\nMethods\
    \ that don't return a value–Sub statements in Visual Basic–almost identical to\
