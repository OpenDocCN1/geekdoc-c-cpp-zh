  md: '# FormatNumber Method


    Visual Basic''s FormatNumber method returns a numeric value formatted as a string
    according to the optional arguments passed to the method. In C#, use the ToString
    method attached to the source variable or expression to generate this string,
    passing a formatting template.


    ```

    C#

    deimal sourceValue = 65.4321;

    result = sourceValue.ToString("0.00"); // // 65.43

    ```


    The following table shows some sample formatting templates that relate to the
    optional arguments passed to the FormatNumber method.


    | Feature to Emulate | Formatting Template |

    |---|---|

    | Default formatting style | o |

    | Four digits after decimal | 0.0000 |

    | Exclude leading digit | #.00 |

    | Parentheses around negatives | 0;(0) |

    | Include grouping before decimal | ###0.0 |


    # FormatPercent Method


    Visual Basic''s FormatPercent method returns a numeric value formatted as a string,
    with a trailing % symbol included. In C#, use the ToString method attached to
    the source variable or expression to generate this string, passing a formatting
    template.


    ```

    C#

    deimal sourceValue = 0.853m;

    result = sourceValue.ToString("0.00%"); // // 85.30%

    ```


    The following table shows some sample formatting templates that relate to the
    optional arguments passed to the FormatPercent method.


    | Feature to Emulate | Formatting Template |

    |---|---|

    | Default formatting style | 0.00% |

    | Four digits after decimal | 0.0000% |

    | Exclude leading digit | #.00% |

    | Parentheses around negatives | 0.00%;(0.00%) |'
