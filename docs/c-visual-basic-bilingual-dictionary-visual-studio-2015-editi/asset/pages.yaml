    \ for VB's End statement.\n\n+   * Calling System.Windows.Forms.Application.Exit()\n\
    * Calling System.Environment.Exit(exitCode)\n* Using Visual Basic's End statement\n\
    \nVisual Basic includes its Visual Basic Application Model, activated using the\n\
    Enable Application Framework checkbox in the Project Properties. When\nactivated,\
    \ the model enables features that provide for a more structured\nstartup process,\
    \ plus support for application-wide unhandled error\nmonitoring. C# does not include\
    \ project-level support for these features,\nthough you can emulate it in standard\
    \ code. For more information on\nthese features and how to employ equivalents\
    \ in C#, access the following\nentries in Chapter 3 of this book:\n\n+   * MinimumSplashScreenDisplayTime\
    \ Property\n* NetworkAvailabilityChanged Event (My.Application)\n* SplashScreen\
    \ Property\n* Startup Event\n* StartupNextInstance Event\n* UnhandledException\
    \ Event\n\nMe Instance Expression\nC#'s this expression provides access to members\
    \ of the local type, just like\nVisual Basic's Me expression.\n\n```\nVISUAL BASIC\n\
    Class SimpleAdder\nPublic Value As Integer = 0\n\nPublic Sub Increment()\nMe.Value\
    \ += 1\nEnd Sub\nEnd Class\n```\n\n```\nC#\nclass SimpleAdder\n{\n    public int\
    \ Value = 0;\n\n    public void Increment()\n{\n    this.Value++;\n}\n```"
