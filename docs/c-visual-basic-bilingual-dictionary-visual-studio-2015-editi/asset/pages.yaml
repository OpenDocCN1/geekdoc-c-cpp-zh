    # Format Method


    In general, the string''s Format method is a good replacement for Visual Basic''s
    Format method. Both methods accept a formatting template, and they share some
    of their custom formatting codes in common. The biggest difference between the
    two methods is that VB''s Format method accepts an object or expression to be
    formatted, followed by the template. In the string.Format method, the template
    appears first in the argument list, followed by one or more objects or expressions
    to be formatted according to the template.


    # VISUAL BASIC


    ```

    Dim displayName As String = "Christmas"

    Dim targetDate As Date = New Date(2000, 12, 25)

    Dim result As String = holidayName & \

    " in & & targetDate.Year & " & occurs on " & \

    Format(targetDate,"M/d/yyyy") & "."

    ```


    # C#


    ```

    // Build the string using concatenation, as in VB.

    string holidayName = "Christmas";nDateTime targetDate = new DateTime(2000, 12,
    25);

    string result = holidayName + " in " + targetDate.Year + \

    " occurs on " + String.Format("{0:M/d/yyyy}", \

    targetDate) + " ";


    ```


    ```

    // Build the string using a composite template.

    result = String.Format(

    "{0} in {1:yyyy} occurs on {1:M/d/yyyy}",

    holidayName, targetDate);

    ```


    Placeholders in the string.Format template appear in curly braces, each containing
    the position number of the argument to use, and an optional formatting code. The
    list of available formatting codes varies somewhat between those used in the Format
    method and those used by String.Format. For a full description of the syntax and
    predefined codes used by the latter, see the Visual Studio String.Format method.'
