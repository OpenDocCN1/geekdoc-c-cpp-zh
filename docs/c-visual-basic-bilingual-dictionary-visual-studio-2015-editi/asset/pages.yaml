    # ^ Exponentiation Operator


    C# does not include a dedicated operator to raise a value to a power. Use the
    System.Math.Pow method instead.


    ```

    VISUAL BASIC

    Dim result As Double = base ^ power

    C#ndouble result = Math.Pow(base, power);

    ```


    C# includes a ^ operator, but it is used as that language’s Exclusive-Or operator.


    # = Assignment Operator


    C# does not include a dedicated assignment operator to raise a value to a power.
    Use the System.Math.Pow method instead.


    ```

    VISUAL BASIC

    base ^= power

    C#ndouble base = Math.Pow(base, power);

    ```


    C# includes a = operator, but it is used as that language’s Exclusive-Or assignment
    operator.


    # See Also


    Assignment Operators


    # _ Line Continuation Character


    C# does not require the use of any special character to continue a statement onto
    the next physical line. A single line may break across multiple lines as long
    as the statement terminates with a semicolon.


