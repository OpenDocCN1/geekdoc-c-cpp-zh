  md: "In C#, the += event subscription operator links an object's event to a compatible\
    \ event handler. The -= event unsubscription operator later breaks the association.\n\
    \n```\n```csharp\n// Define the instance.\npublic Button button1 = new Button();\n\
    \n// Define the handler.\nvoid button1_Click(object sender, EventArgs e)\n{\n\
    \    // Event-handling code here.\n}\n```\n```\n\n// Elsewhere...\nbutton1.Click\
    \ += button1_Click;\nVisual Basic, the AddHandler and RemoveHandler statements,\
    \ when used in conjunction with the AddressOf operator, perform the same function\
    \ as C#'s += and -= event operators.\n\n```\n```vb\n' Define the instance.\nPublic\
    \ Button1 As New Button()\n\n' Define the handler.\nSub Button1_Click(ByVal sender\
    \ As Object,\n    ByVal e As EventArgs\n    ' Event-handling code here.\nEnd Sub\n\
    ```\n```\n\n' To connect the event.\nAddHandler Button1.Click, AddressOf Button1_Click\n\
    \n' To disconnect the event.\nRemoveHandler Button1.Click, AddressOf Button1_Click\n\
    Visual Basic also has an alternate syntax that uses WithEvents on the object declaration,\
    \ and exchanges AddHandler and RemoveHandler for the Handles clause on the event\
    \ handler.\n\n```\n```vb\n' Define the instance.\nPublic WithEvents Button1 As\
    \ New Button\n\n' Define the handler.\nSub Button1_Click(ByVal sender As Object,\n\
    \    ByVal e As EventArgs) Handles Button1.Click\nEnd Sub\n```\n```\n\nEvents\
    \ can also use lambda expressions as event handlers."
