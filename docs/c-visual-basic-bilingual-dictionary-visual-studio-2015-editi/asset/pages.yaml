  md: 'starting with its 2015 release.


    # #undef Directive


    To clear a previously declared preprocessor constant in Visual Basic, assign it
    a value of Nothing.


    ```

    C#n#undef TestVersion

    VISUAL BASIC

    #Const TestVersion = Nothing

    ```


    # #warning Directive


    There is no equivalent in Visual Basic for the C# #warning directive.


    # $ Interpolated String Indicator


    # New with Visual Studio 2015


    In 2015, both C# and Visual Basic added string interpolation, a method of generating
    formatted strings using string literals. Both languages share an identical syntax
    for such strings, prefixing them with a $ symbol, and using curly braces to contain
    the interpolated sections.


    ```

    C#nmessage = $"Meet (name) on {meetDate:dddd}"

    VISUAL BASIC

    message = $"Meet (name) on {meetDate:dddd}"

    ```


    # % Modulo Operator


    Visual Basic includes a Mod operator that is identical to C#''s % modulo operator.


    ```

    C#nint penniesNeeded = totalInCents % 5;

    VISUAL BASIC

    Dim penniesNeeded As Integer = totalInCents Mod 5

    ```


    # Assignment Operator


    Visual Basic does not include an equivalent for C#''s % operator. You must perform
    the modulo (Mod) and assignment operations separately in VB.


    ```

    C#nleftOver %= 10;

    VISUAL BASIC

    leftOver = leftOver Mod 10

    ```


    See Also'
