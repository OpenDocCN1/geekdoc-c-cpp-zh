  md: '# Main Method


    In both C# and Visual Basic, an application uses a Main method as the program’s
    entry point. These routines are always static (C#) or Shared (VB), although the
    Shared modifier is assumed if the method appears in a Module), return either no
    result (void or Sub) or an integer, and can be defined with one argument, an array
    of command line argument strings. While C# allows these methods to be private,
    this is not allowed in Visual Basic.


    ```

    C#

    // ----- Plain version with no return or arguments.

    static void Main()

    {

    }

    // ----- Version with both a return code and arguments.

    static int Main(string[] args)

    {\}

    ```


    # Visual Basic


    +   - Plain version with no return or arguments.

    Shared Friend Sub Main()

    End Sub


    +   - ----- Version with both a return code and arguments.

    Shared Friend Function Main(

    ByVal cmdArgs(As String) As Integer

    End Function


    In Visual Basic Windows Forms applications, a form can be defined as the startup
    object. Although you can include your own Main method within the form, the compiler
    will provide the method behind the scenes if one does not exist. In C# Windows
    Forms applications, the Main method is decorated with the STAThread attribute.


    ```

    C#

    [STAThread] static void Main()

    ```


    The Visual Basic compiler attaches this attribute automatically in Windows Forms
    applications, so you don’t need to provide it as an attribute in code.

    In a Windows Forms application, the Main method can be used to run custom code
    before displaying the initial form. This structure is standard in C# applications,
    although it is less common in VB, since that language provides other features
    that simplify the application startup process.


    ```

    C#

    static void Main()

    ```'
