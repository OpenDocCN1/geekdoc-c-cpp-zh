    \ by one (1) each time through the loop. You can change this with the Step clause,\
    \ followed by any positive or negative increment.\n\n# Visual Basic\n\nFor counter\
    \ As Decimal = 10@ To 10@ Step -2.5@\n' Values will be 10, 7.5, 5, and 2.5.\n\n\
    C#s for statement permits even more complex looping scenarios, with support for\
    \ multiple comma-delimited initializers (of the same data type) and iterators,\
    \ and a condition section that supports any type of Boolean expression. None of\
