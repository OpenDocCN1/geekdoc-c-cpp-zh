  md: "# Val Method\n\nC# lacks an equivalent for Visual Basic's Val method. The closest\
    \ option is to use a TryParse method from one or more of the numeric data types.\
    \ For example, consider using double.TryParse to determine if a string contains\
    \ a valid double.\n\n```\nC#ndouble result;\nif (double.TryParse(sourceText, out\
    \ result) == false)\n    // --- sourceText contained an invalid number.\n```\n\
    \nVB's Val method allows much greater flexibility in the format of the incoming\
    \ string. For example, currency symbols found in strings like \"$100\" convert\
    \ appropriately to their non-currency equivalents when using Val, but fail to\
    \ convert when using the various TryParse methods.\n\n# Variables\n\nSee\n\n+\
    \   - () Array Declaration, Const Statement, Dim Statement, Fields, Identifiers,\n\
    Initializers, Lifetime and Scope, Static Modifier\n\n# VarType Method\n\nVisual\
    \ Basic's VarType method returns an enumeration value that indicates the variant\
    \ type of an instance. Variant types are a feature from-.NET versions of Visual\
    \ Basic. Though these types are no longer supported, VarType has retained for\
    \ backward-compatibility reasons.\n\nVarType has no direct equivalent in C#. However,\
    \ the GetType method intrinsic in every .NET provides general functionality that\
    \ is comparable to what VarType provides, albeit returning true .NET types instead\
    \ of an enumerated value.\n\n# VBFixedArrayAttribute Class\n\nThe VBFixedArrayAttribute\
    \ class is used to indicate that an array field should be treated as it has a\
    \ fixed length when used with certain file operations. For example, VB's FileGet\
    \ and FilePut methods use this attribute when reading and writing structured data.\
    \ The attribute itself does not alter its associated array, but provides information\
    \ to code within methods like FileGet via reflection. Outside of these specific\
    \ Visual Basic methods, the attribute has no impact on application logic, and\
    \ is therefore not useful in a C# context."
  merge: -1
  pgno: 425
