  md: 'languages.


    ```

    C#

    // --- Turn an error off.

    #pragma warning disable CS1234


    // --- Turn it back on later.

    #pragma warning restore CS1234

    ```


    ```

    Visual Basic

    '' --- Turn an error off.

    #Disable Warning BC1234


    '' --- Turn it back on later.

    #Enable Warning BC1234

    ```


    Both languages accept comma-delimited lists of error codes. For reasons of backward
    compatibility, C# allows purely numeric error codes. In newer code, these numbers
    include a CS prefix. VB does not permit number-only codes.


    #region Directive


    Visual Basic''s #Region directive is equivalent to C#''s #region directive. The
    descriptive tag follows the keyword is enclosed in double-quotes in VB, but such
    quotes are not used in C#.


    C#


    ```

    #region Utility Functions

    // --- Collapsible code here.

    #endregion

    ```


    ```

    Visual Basic

    #Region "Utility Functions"

    '' --- Collapsible code here.

    #End Region

    ```


    Both languages allow nesting of these regions. In C#, additional text (such as
    the name included with the initial #region directive) may appear after the #endregion
    directive. In Visual Basic, such text can only appear as a trailing comment.


    C#


    #endregion Utility Functions


    ```

    Visual Basic

    #End Region '' Utility Functions

    ```


    # New with Visual Studio 2015


    In C#, regions can appear within method bodies, and a region can even begin in
    one method and end in a later method. Neither of these options was valid in older
    editions of Visual Basic, but they were both added to the language'
