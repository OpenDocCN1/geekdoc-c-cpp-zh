    Problem with customer record.\", ex)\n    Return\nFinally\n    InProcessField.Visible\
    \ = False\nEnd Try\n```\n\n```\nC#\nt{\n    customerRecord = RetrieveCustomer(customerID);\n\
    } catch (System.Expression ex)\n{\n    LogError(\"Problem with customer record.\"\
    , ex);\n    return;\n} finally {\n    InProcessField.Visible = false;\n}\n```\n\
    \nBoth languages share a common set of rules surrounding the use of try/catch\
    \ statements: at least one catch or finally block must appear; nesting is supported;\
    \ jumps into any of the blocks from outside is restricted; multiple catch blocks\
    \ may appear, and are processed in order; and so on.\n\n# New with Visual Studio\
    \ 2015\n\nVisual Basic’s Catch clauses can include conditions that limit access\
    \ to a given exception handler via an additional When clause. C# added this feature\
    \ in 2015 with the introduction of if clauses. In C# applications written before"
