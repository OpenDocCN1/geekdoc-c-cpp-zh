    code for the Logging Application Block, the LogWriter method provides a good substitute
    for VB''s own WriteEntry method. However, the Enterprise Library does not include
    a write method designed for Exception instances. Instead, you must format the
    message yourself, and pass it to the LogWriter.Write method.


