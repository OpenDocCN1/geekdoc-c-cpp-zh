    # New Operator


    C#s new operator is functionally equivalent to Visual Basic’s New operator when
    used to create new type instances. In both languages, the name of the type being
    instantiated and any parentheses-enclosed constructor arguments follow the operator.


    > VISUAL BASIC

    --- Examples with default and custom constructor

    Dim oneManager As Employee = New Employee

    Dim namedManager As Employee = New Employee ("Jones")


    ```

    C#

    // --- Examples with default and custom constructor

    Employee oneManager = new Employee();

    Employee namedManager = new Employee ("Jones")

    ```


    As shown in the previous example, parentheses are always required after the type
    name being instantiated C#, but they are optional in VB when the default constructor
    is used. VB supports a compressed format that combines the type identification
    and assignment of a new instance.


    > VISUAL BASIC

    Dim oneManager As New Employee


    This syntax is not available in C#.

    As Visual Basic, instance creation using the new operator can appear within expressions.


    > VISUAL BASIC

    henticated = (New PasswordDialog).PromptUser()


    ```

    C#

    authenticated = (new PasswordDialog()).PromptUser();

    ```


    Anonymous types in Visual Basic use the New operator followed by With and a list
    of properties in curly braces.


    > VISUAL BASIC

    Dim namedAndNumbered = New With { .ID = 5, .Name = "test" }


    C# employs a similar syntax, but omits both the Keyword and the period before
    each member name.'
