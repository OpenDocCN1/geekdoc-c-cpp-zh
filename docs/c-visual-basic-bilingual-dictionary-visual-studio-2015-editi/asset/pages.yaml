  md: "C#’s statement is equivalent to Visual Basic’s Structure statement. When declaring\
    \ a structure that implements one or more interfaces in C#, a comma-delimited\
    \ list of those interfaces appears after the structure name, separated from the\
    \ name by a colon:\n\n```\nVisual Basic\nStructure Variable\nImplements IDataPart\n\
    ' ----- Members appear here.\nEnd Structure\n```\n\n```\nC#\nstruct Variable :\
    \ IDataPart\n{\n    // ----- Members appear here.\n}\n```\n\nStructures in both\
    \ languages contain the same types of members: constructors, fields, constants,\
    \ properties, methods, operator overloads and user-defined conversions, indexers,\
    \ events, and nested types (including delegates and enumerations). Instance fields\
    \ in structures cannot include an initialization value with the declaration, but\
    \ static (shared) fields.\n\nStructures support the following modifiers in each\
    \ language.\n\n| Visual Basic Modifier | C# Modifier |\n|--- |--- |\n| Friend\
    \ | internal |\n| Partial | partial |\n| Private | private |\n| Protected | protected\
    \ |\n| Protected Friend | protected internal |\n| Public | public |\n| Shadows\
    \ | new |\n\nStructures in Visual Basic are Friend by default, just as structures\
    \ in C# are internal by default. In VB, structure members are Public by default;\
    \ they are private by default in C#. Structure members cannot use the Protected\
    \ (VB) or protected (C#) modifier.\n\nSee Also\n\n+   - Access Modifiers, Constructors"
