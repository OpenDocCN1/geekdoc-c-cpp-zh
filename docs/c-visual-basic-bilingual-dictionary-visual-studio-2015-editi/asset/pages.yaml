    ```


    As in C#, instance creation using the New operator can appear within expressions.


    ```

    C#

    authenticated = (new PasswordDialog()).PromptUser();

    ```


    ```

    VISUAL BASIC

    authenticated = (New PasswordDialog).PromptUser()

    ```


    Anonymous types in C# use the new operator followed by a list of properties in
    curly braces.


    ```

    C#

    var namedAndNumbered = new { ID = 5, Name = "test" };

    ```


    Visual Basic employs a similar syntax, with the inclusion of the keyword. Notice
    that each property is prefixed with a period.


    ```

    VISUAL BASIC

    Dim namedAndNumbered = New With { .ID = 5, .Name = "test" }

    ```


    VB also allows you to specify which anonymous type properties are “key” properties,
    that can be used for equivalence testing between two instances.


