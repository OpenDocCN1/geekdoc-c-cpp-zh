    # Overloading


    In C#, the overloading of methods occurs automatically whenever a type includes
    two methods with the same name, but different signatures.


    ```

    C#

    public Customer RetrieveCustomer(long customerID)

    {

    // ----- Retrieve customer record by numeric ID.

    }

    public Customer RetrieveCustomer(string email)

    {

    // ----- Retrieve customer record by email address.

    }

    ```


    The Visual Basic compiler also handles overloading in this way. However, it also
    provides the optional Overloads keyword that makes the overloading clearer to
    anyone reading the code. You do not need to include the Overloads keyword, but
    if you include it with one of the overloaded methods, you must include it with
    all of them.


    ```

    VISUAL BASIC

    Public Overloads Function RetrieveCustomer(

    ByVal customerID As Long) As Customer

    // ----- Retrieve customer record by numeric ID.

    ```


    ```

    End Function

    Public Overloads Function RetrieveCustomer(

    ByVal email String As Customer

    // ----- Retrieve customer record by email address.

    ```


