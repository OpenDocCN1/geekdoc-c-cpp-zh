  md: "# TAB Method\n\nC# does not include an equivalent for Visual Basic's TAB method.\
    \ When outputting columnar text data, you must manually manage the spacing in\
    \ the result by counting the length of each output value yourself.\n\n# Take Query\
    \ Expression Operator (LINQ)\n\nC# does not include a direct equivalent for Visual\
    \ Basic's Take query expression operator. However, you can use LINQ's Take extension\
    \ method to accomplish the same thing.\n\n```\nVISUAL BASIC\n----- Get top 10\
    \ customers.\nDim topCusts = From cust in customers\n    Order By cust.TotalSales\
    \ Descending\n    Select cust.FullName\n    Take 10\n```\n\n```\nC#\n// Get top\
    \ 10 customers.\nvar topCusto = (from cust in customers\n               orderby\
    \ cust.TotalSales descending\n               select new {cust.FullName}).Take(10);\n\
    ```\n\nSee Also\n\n# Query Expressions\n\n# Take While Query Expression Operator\
    \ (LINQ)\n\nC# does not include a direct equivalent for Visual Basic's Take While\
    \ expression operator. However, you can use LINQ's TakeWhile extension method\
    \ to accomplish the same thing.\n\n```\nVISUAL BASIC\n----- Get top 10 customers.\n\
    Dim topCusts = From cust in customers\n    Order By cust.TotalSales Descending\n\
    \    Select cust.FullName, cust.TotalSales\n    Take While TotalSales >= 10000\n\
    ```\n\n```\nC#\n// Get top 10 customers.\nvar topCusto = (from cust in customers\n\
    \               orderby cust.TotalSales descending\n               select new\
    \ {cust.FullName,\n               cust.TotalSales})\n               .TakeWhile(test\
    \ => test.TotalSales\n               >= 10000);\n```\n\nSee Also\n\n# Query Expressions"
