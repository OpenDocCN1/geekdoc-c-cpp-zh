  md: '# Call Statement


    C# does not include an equivalent to Visual Basic''s Call statement. In general,
    the equivalent C# code parallels the VB version, but without the Call keyword.


    ```

    Visual Basic

    Call New ActionClass().ActionMethod()

    C#

    (new ActionClass()).ActionMethod();

    ```


    # CallByName Method


    Visual Basic''s CallByName method lets you call an instance''s method or property
    accessor by passing the member name as a string, and any arguments as an array.
    C# does not include a direct equivalent for CallByName, but you can use .NET''s
    MethodInfo and PropertyInfo classes (both in the System.Reflection namespace)
    to provide similar functionality.


    ```

    Visual Basic

    ----- Set a property value (Textbox1.Text)

    CallByName(TextBox1, "Text", CallType.Set, "Success")

    ----- Get a property value (Textbox1.Visible)

    Dim isShowing As Boolean = CBool(CallByName(TextBox1, "Visible", CallType.Get))

    ----- Call a method (Textbox1.Clear)

    CallByName(TextBox1, "Clear", CallType.Method)

    C#

    // Set a property value (Textbox1.Text)

    PropertyInfo textProperty = typeof(TextBox).GetProperty("Text")

    textProperty.SetValue(TextBox1, "Success", null)

    // ----- Get a property value (Textbox1.Visible)

    PropertyInfo visibleProperty = typeof(TextBox).GetProperty("Visible")

    bool isShowing = (bool)visibleProperty.GetValue(TextBox1, null)

    // ----- Call a method (Textbox1.Clear)

    MethodInfo clearMethod = typeof(TextBox).GetMethod("Clear")

    clearMethod.Invoke(TextBox1, null);

    ```


    C# also supports traditional late binding through the dynamic type.


    # Case Clause'
