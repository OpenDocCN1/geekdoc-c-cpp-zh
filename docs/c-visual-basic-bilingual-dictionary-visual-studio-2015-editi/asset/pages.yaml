  md: 'Visual Basic''s DatePart method returns one component of a Date instance as
    an integer. For example, the following code returns the year component, and shows
    the equivalent code in C# using the members of a Date instance.


    # VISUAL BASIC


    ```

    Dim whichYear As Integer = DatePart("yyyy", sourceDate)

    int whichYear = sourceDate.Year;

    ```


    The DatePart method accepts, as its first argument, a value that indicates the
    type of information to return. This value can be a string or a member of VB''s
    DateInterval enumeration. The following table shows the available (case-insensitive)
    string and enumeration options, and the member of the DateTime instance that should
    be used in C# to return the equivalent component.


    | Interval (String) | Interval (Enum) | DateTime Member |

    |---|---|--|

    | d | DateInterval.Day | Day |

    | h | DateInterval.Hour | Hour |

    | m | DateInterval.Month | Month |

    | n | DateInterval.Minute | Minute |

    | q | DateInterval.Quarter | See below |

    | s | DateInterval.Second | Second |

    | w | DateInterval.Weekday | See below |

    | ww | DateInterval.OfWeekYear | See below |

    | y | DateInterval.DayOfYear | DayOfYear |

    | yyyy | DateInterval.Year | Year |


    To obtain the quarter in C#, extrapolate it from the month.


    ```

    int quarter = Math.Floor(sourceDate.Month - 1) / 3 + 1;

    ```


    For the day of the week, Visual Basic returns a 1-based position within the week,
    where the first day of the week is the system default, or specified through an
    optional argument. In C#, the DateTime type''s DayOfWeek property always returns
    a DayOfWeek enumeration value. When converted to an integer, this enumeration''s
    values run from 0 (Sunday) to 6 (Saturday).'
