  md: '# New with Visual Studio 2015


    In 2015, both Visual Basic and C# added a set of null conditional operators. In
    general, they are used in exactly the same way between the languages, with slight
    differences in syntax.


    | Usage | Visual Basic Syntax | C# Syntax |

    |---|---|--|

    | Instance Member | A?.B | A?.B |

    | Dictionary Member | A!B | Not supported |

    | Array or Indexed Member | A?(B) | A?[B] |

    | XML Attribute Axis | A?.@B | Not supported |

    | XML Child Axis | A?.<B> | Not supported |

    | XML Descendant Axis | A?...<B> | Not supported |


    @ Type Character attached as a suffix to a numeric literal, Visual Basic’s @ type
    character coerces the value to the Decimal data type. In C#, use the M or m suffix
    instead to coerce the value to the decimal data type.


    ```

    VISUAL BASIC

    Dim value As Decimal = 123@


    #

    decimal value = 123M;

    ```


