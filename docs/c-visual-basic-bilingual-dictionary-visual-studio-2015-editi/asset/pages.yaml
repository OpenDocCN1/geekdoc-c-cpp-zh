  md: '# InStr Method


    In C#, use the string type''s IndexOf method to return results similar to that
    of Visual Basic''s InStr method. IndexOf returns -1 if the sought-after substring
    is not found, while InStr returns 0 when there is no match. Also, InStr''s result
    is 1-based, where a match at the start of a string returns 1. The IndexOf method,
    by contrast, is o-based, returning 0 when a match occurs with the first character
    of the source string. When indicating a starting position with InStr, value is
    also 1-based, while the related index in IndexOf is o-based.


    ```

    VISUAL BASIC

    ----- The results will be 1-based.

    position = InStr(internetUrl, "//://")


    ----- The index is also 1-based.

    afterDomain = InStr(position + 3, internetUrl, "//")

    C#

    // The results will be 0-based.

    position = internetUrl.IndexOf("://");


    // The index is also 0-based.

    afterDomain = internetUrl.IndexOf("/", position + 3);

    ```


    Both methods let you specify binary (case-sensitive) or text (case-insensitive)
    search methods through an optional argument.


    ```

    VISUAL BASIC

    ----- Perform a case-insensitive match.

    position = InStr(originalText, pattern, CompareMethod);

    C#

    // Perform a case-insensitive match.

    position = originalText.IndexOf(pattern, StringComparison.CurrentCultureIgnoreCase);

    ```


    # InStrRev Method


    In C#, use the string type''s LastIndexOf method to return results similar to
    that of Visual Basic''s InStrRev method. LastIndexOf returns -1 if the sought-after
    substring is not found, while InStrRev returns 0 when there is no match. Also,
    InStrRev''s result is 1-based, where a match at the start of a string returns
    1. The LastIndexOf method, by contrast, is o-based, returning 0 when a match occurs
    with the first character of the source string. When indicating a starting position
    with InStrRev, value is also 1-based, while the related index in LastIndexOfOf
    is o-based.


    ```

    VISUAL BASIC

    ```'
