  md: 'VB. C#s case clause becomes Case with no trailing colon; default becomes Case
    Else. In both languages, the first block that matches is used; those that follow,
    even if they match the test value, will be skipped.


    Each case block in C# must be explicitly exited using a break statement or some
    other exiting statement. In Visual Basic, a matched block is automatically exited
    after its last statement; no equivalent for break is needed. You can also exit
    a C# case block using a goto case or goto default


    # C#


    ```

    case DayOfWeek.Monday:

    //----- Day-specific processing, then...

    goto default;

    default:

    //----- General processing.

    ```


    To do the same in Visual Basic, use a standard GoTo statement with a line label
    placed in the target Case block.


    # VISUAL BASIC


    ```

    Case DayOfWeek.Monday:

    ''----- Day-specific processing, then...

    GoTo DoDefault

    Case Else

    DoDefault:

    ''----- General processing.

    ```


    In C#, each case contains a single comparison value: an integer number, a character
    or string, a Boolean literal, enumeration member or null . Visual Basic adds floating-point
    numbers, dates, and general Object instances to the list. In C#, two values can
    trigger the same block of matching code by placing their case clauses next to
    each other.


    # C#


    ```

    case DayOfWeek.Monday:

    case DayOfWeek.Wednesday:

    //----- Day-specific processing.

    ```


    In Visual Basic, both values can appear in a single Case clause, separated by
    commas. Also, VB supports value ranges, expressions, and relative comparisons.


    # VISUAL BASIC


    ```

    Case 1, 2

    ''----- Matches one of the comma-delimited values

    tableSize = "small"

    Case 3 To 6

    ''----- Matches inclusive range.

    tableSize = "medium"

    ```'
