    You can mix any number of comparison alternatives by including them in a single
    comma-delimited list.


    ```

    Visual Basic

    Case 1, 3 To 6, 3 * 12, SpecialValue(), Is >= 100

    ```


    The associated block will execute if any of the comma-delimited values match the
