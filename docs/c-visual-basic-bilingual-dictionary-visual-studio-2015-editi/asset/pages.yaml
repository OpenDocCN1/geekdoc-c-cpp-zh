    # DateAdd Method Visual Basic''s DateAdd method returns a Date instance based
    on adding a date or time component to another date expression. An interval string
    or DateInterval enumeration value indicates the type of component to adjust.


    ```

    VISUAL BASIC

    '' ---- Add three days.

    Dim someLater As Date = DateAdd("d", 3, originalDate)


    '' Or use an enumeration value.

    someTimeLater = DateAdd(DateInterval.Day, 3, originalDate)

    ```


    In C#, various methods of the DateTime type provide similar functionality. The
    following table shows matching DateTime type methods that provide the same functionality
    as the DateAdd method interval values.


    ```

    C#

    // Add three days.

    DateTime someLater = originalDate.Days(3);

    ```


    | DateInterval Member String Interval | DateTime Member |

    |---|---|---|n| Day | d | AddDays |

    | DayOfYear | y | AddDays |

    | Hour | h | AddHours |

    | Minute | n | AddMinutes |

    | Month | m | AddMonths |

    | Quarter | q | 3 * AddMonths |

    | Second | s | AddSeconds |

    | Weekday | w | AddDays |

    | WeekOfYear | ww | 7 * AddDays |

    | Year | yyyy | AddYears |


