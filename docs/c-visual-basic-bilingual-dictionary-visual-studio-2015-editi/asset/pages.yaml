    # Attributes


    Both C# and Visual Basic allow attributes to be attached to types, members, or
    an entire assembly. C# attributes appear in square brackets; VB uses angle brackets.
    In both languages, if the defined attribute name ends in "Attribute," that portion
    can be left off when using the attribute.


    ```

    C#

    [System.Obsolete("Use Creature Class Instead")]

    class Animal

    {}

    ```


    ```

    VISUAL BASIC

    <System.Obsolete("Use Creature Class Instead")>

    Class Animal

    End Class

    ```


    In both languages, multiple attributes can appear in separate sets of brackets,
    or separated by commas within a single set of brackets. When an attribute accepts
    arguments, you can specify name arguments or initializers with an = sign in C#,
    or := Visual Basic.


    ```

    C#

    [AttributeUsage(AttributeTargets.Class,

    AllowMultiple=true)]

    ```


    ```

    VISUAL BASIC

    <AttributeUsage(AttributeTargets.Class,

    AllowMultiple=:True)>

    ```


    Normally, an attribute appears just before the item it modifies. In some cases,
    it may be necessary to specify the target of the attribute. In both languages,
    indicate the target with a prefix immediately after the opening bracket.


    ```

    C#

    // This attribute is for the whole assembly.

    [assembly: AssemblyVersion("1.0.0.0")]

    ```


    ```

    VISUAL BASIC

    '' ---- This attribute is for the whole assembly.

    <Assembly:AssemblyVersion("1.0.0.0")>

    ```


