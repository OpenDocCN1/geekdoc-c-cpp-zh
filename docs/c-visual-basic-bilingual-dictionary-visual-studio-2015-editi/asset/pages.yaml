    \nSee Also\n\n# Query Expressions\n\nwhile statement loops while a condition is\
    \ true, and may not loop at all if the condition is initially false.\n\n```\n\
    C#\nwhile (content.Length > 0)\n{\n    content = ProcessChunkOfContent(content);\n\
    }\n```\n\nIn Visual Basic, the Do statement accomplishes the same thing when the\
