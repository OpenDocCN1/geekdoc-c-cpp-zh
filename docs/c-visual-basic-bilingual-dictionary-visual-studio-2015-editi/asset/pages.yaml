  md: '# Option Compare Statement


    By default, all text comparisons in Visual Basic and C# use binary sorting rules,
    resulting in case-sensitive comparisons. Visual Basic allows the Option Compare
    Text statement to be used within a source file, or set at the project level. C#
    does not include an equivalent for this setting.


    Some .NET features, such as the String data type''s Compare method, let you indicate
    whether case should be taken into account when doing comparison or sorting. Some
    of these features also let you specify the culture used to compare and sort data.
    In C#, you must use such features to enable text comparison rules that are comparable
    to Option Compare Text.


    # Option Explicit Statement


    C# does not include an equivalent for Visual Basic''s Option Explicit statement,
    either at the file or project level. Declaration is required for all variables
    in C#.


    # Option Infer Statement


    C# does not include an equivalent for Visual Basic''s Option Infer statement,
    either at the file or project level. Type inference in C# is done using the var
    statement. See the "Dim Statement" entry in this chapter for details on this C#
    equivalent.


    # Option Strict Statement


    C# does not include an equivalent for Visual Basic''s Option Strict statement,
    either at the file or project level. In general, narrowing conversions in C# must
    be explicitly cast to the appropriate target type.


    Although C# lacks an Option Strict equivalent, it does support late binding through
    its dynamic type keyword. See the "Late Binding" entry in this chapter for information
    on using this feature in C#.


    See Also


    +   - Conversion and Casting, Late Binding


    # Optional Arguments


    See


    +   - Optional Modifier


    # Optional Modifier


    In Visual Basic, parameters that accept optional arguments include the Optional
    modifier, and also require the assignment of a constant expression'
