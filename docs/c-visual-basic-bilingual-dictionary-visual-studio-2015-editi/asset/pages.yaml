  md: "```\n}\n\n// ----- In your Main routine, before running the core\n// program\
    \ logic.\nApplication.Thread += ThreadProblem;\n```\n\n# UploadFile Method\n\n\
    +   - My.Computer.Network.UploadFile\n\nUploads a file from a local computer to\
    \ a network device.\n\n```\nVISUAL BASIC\nMy.Computer.Network.UploadFile(sourceFile,\n\
    \    destinationAddress, userName, password);\n\nC#\nSystem.Net.HttpClient client\
    \ = new System.Net.HttpClient();\nSystem.Uri destinationUri =\n    new System.Uri(destinationAddress);\n\
    \n// ----- Default credentials.\nclient.UseDefaultCredentials = true;\n\n// Or,\
    \ supply specific credentials\nclient.UseDefaultCredentials = false;\nclient.Credentials\
    \ = new System.Net.NetworkCredential(\n    userName, password);\n\n// ----- Synchronous\
    \ copy.\nclient.UploadFile(destinationUri, sourceFile);\n\n// Or, asynchronous\
    \ copy, providing your own\n// custom complete/cancel event handler.\nclient.UploadFileCompleted\
    \ += new\n    UploadFileCompletedEventHandler(CompletedCallback);\nclient.UploadFileAsync(destinationUri,\
    \ sourceFile);\n```\n\nThe WebClient class 'upload methods provide no visual cues\
    \ as to the state of the transfer. You may provide your progress dialog if desired.\n\
    \nTo override the default timeout value, derive a new class from the WebClient\
    \ class, and manually configure the Request's Timeout property. Then use this\
    \ class instead of the standard WebClient class to perform the upload. For a sample\
    \ of this override in C#, see the “DownloadFile Method” entry in this chapter.\n\
    \nSee Also\n\n# DownloadFile Method\n\n# User Object"
