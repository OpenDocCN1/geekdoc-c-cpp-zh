    # char Data Type


    Visual Basic’s intrinsic Char data type is identical to C#’s char data type. Both
    types are aliases for .NET’s System.Char type. For char literals, C# surrounds
    a character with double quotes, in Visual Basic, the character appears in double
    quotes, and is followed by a c suffix.


    ```

    C#nchar digit = ''1'';

    VISUAL BASIC

    Dim digit As Char = "1"c '' Or "1"C

    ```


    # checked Expression


    C#’s checked keyword, whether in its statement-block form or expression form,
    enables run-time integer overflow checking on the contained statements or expression.


    Visual Basic enables integer overflow checking by default on a project-wide basis.
    To enable or disable overflow checking, access the Advanced Compiler Settings
    within the Project Properties, and remove the Integer Overflow Checks field as
    needed. VB does not include the ability to control integer overflow checks at
    the statement or expression level.


    # class Statement


    Visual Basic’s Class statement is equivalent to C#’s class statement. When declaring
    a derived class, VB’s Inherits clause follows the opening of the class declaration
    block. Likewise, when a class implements one or more interfaces, the Implements
    clause lists those interfaces, and appears at the top of the class, just after
    the Inherits clause if present.


    ```

    C#

    ```'
