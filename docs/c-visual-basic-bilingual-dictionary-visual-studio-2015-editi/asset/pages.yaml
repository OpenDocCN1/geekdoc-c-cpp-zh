  md: 'C# allows a single logical line to span physical lines by employing as much
    or as little whitespace as needed, as long as the entire statement ends with a
    semicolon.


    ```

    C#nxppirationDate = string.Format("{0:00}/{1:0000}",

    monthPortion, yearPortion);

    ```


    Traditionally, Visual Basic accomplishes this by adding a line continuation character
    (an underscore preceded by at least one space character) to the end of all lines
    except the last in a logical statement.


    ```

    Visual Basic

    expirationDate = String.Format("{0:00}/{1:0000}",

    monthPortion, yearPortion);

    ```


    Newer editions of Visual Basic do a better job at determining when two physical
    lines constitute a logical statement, even in the absence of the line continuation
    character. In general, when a line ends with a completely incomplete statement—such
    as a set of parentheses being left open—the VB compiler will assume that the line
    continues, even when not explicitly indicated.


    ```

    Visual Basic

    '' A ending in a comma indicates continuation.

    expirationDate = String.Format("{0:00}/{1:0000}",

    monthPortion, yearPortion);

    ```


    # C# allows multiple statements to sit on a single physical line.


    ```

    C#

    // Two simple statements on one line.

    firstName = "John", lastName = "Doe";


    // ---- A block statement can be single-line as well.

    while (status > 0) status = DoMoreWork();

    ```


    To this in Visual Basic, you must connect the statements with the colon character.


    ```

    Visual Basic

    '' Two simple statements on one line.

    firstName = "John" : lastName = "Doe"

    ```


    ```

    '' A block statement can be single-line as well.

    Do While (status > 0) : status = DoMoreWork() : Loop

    ```


    A special case of this statement joining in VB occurs the single-line form of
    the If statement, where linked statements are processed in response to the condition.


    ```

    Visual Basic

    '' Both assignments will occur if true.

    ```'
