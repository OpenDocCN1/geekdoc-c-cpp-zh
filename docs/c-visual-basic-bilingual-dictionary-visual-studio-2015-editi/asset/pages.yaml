  md: "# Garbage Collection\n\nSee\n\n# Destructors\n\n# Generics\n\nBoth C# and Visual\
    \ Basic support generics, also known as “constructed types.” One key difference\
    \ is the syntax used to specify the type placeholders. In C#, these appear within\
    \ angle brackets after the generic type name, while in Visual Basic, they appear\
    \ in parentheses as part of an Of clause.\n\n```\nC#\n// As part of a generic\
    \ declaration.\nclass SpecialList<T>\n{\n    private T InternalList;\n}\n\n//\
    \ As part of a generic instantiation.\nSpecialList<int> trackNumbers = new SpecialList<int>();\n\
    ```\n\n```\nVisual Basic\n' As part of a generic declaration.\nClass SpecialList\
    \ (Of T)\n    Private InternalList As T\nEnd Class\n```\n\n```\n' ---- As part\
    \ of a generic instantiation.\nDim trackNumbers As New SpecialList(Of Integer)\n\
    ```\n\nGeneric constructs can be applied to classes, structures, interfaces, methods,\
    \ and delegates in both languages. Generic methods can appear within generic or\
    \ non-generic types.\n\n```\nC#\nstatic void ReverseItems<T>(ref T firstItem,\
    \ ref T secondItem)\n{\n    T holdingArea = firstItem;\n    firstItem = secondItem;\n\
    \    secondItem = holdingArea;\n}\n```\n\n```\nVisual Basic\nShared Sub ReverseItems\
    \ (Of T) (ByRef firstItem As T,\n    ByRef secondItem As T)\n    Dim holdingArea\
    \ As T = firstItem\n    firstItem = secondItem\n    secondItem = holdingArea\n\
    End Sub\n```"
