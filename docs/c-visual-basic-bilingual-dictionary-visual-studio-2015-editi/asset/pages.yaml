  md: 'tab Startup Object includes a list of all valid Main methods in your application
    that can be used as the program''s entry point. You will find a similar field
    in a Visual Basic project''s Application tab. However, in Windows Forms, the default
    presentation allows you to select a form as the startup object. Even if you add
    a Main method, it will not appear in the Startup Form list by default (although
    if you add a compatible Main method to the startup form, it will be used instead
    of a compiler-generated default Main method). To use a non-form Main method as
    the entry point in a Visual Basic program, clear the Project''s Enable Application
    Framework field on the Project Properties'' Application tab. This will change
    the Startup Form field to a Startup Object field, and will display all eligible
    Main methods.


    C# presents various resource management options on the Application tab, only some
    of which are available in Visual Basic''s Application tab. For the Icon and Manifest
    option, VB has an Icon field that lets you select the default icon. To access
    the project''s "app.manifest" file, click the Windows Settings button on VB''s
    Application tab.


    C# applications that manage resources through a Win32 resource file, the equivalent
    configuration in Visual Basic requires the use of the VB compiler''s /win32Resource
    command line option.


    # Build Tab


    Most of the features on the Build tab appear in Visual Basic''s equivalent Compile
    tab, although many of the names are altered. In most cases, you should be able
    to determine quickly what the equivalent field is. Both tabs include an Advanced
    button, and some of the fields included on the main Build tab in C# (including
    settings for DEBUG, TRACE, and custom constants) appear within the Advanced portion
    of VB''s Compile tab.


    C#''s Advanced build options include a Check for Arithmetic Overflow/Underflow
    option. VB''s Advanced compile options include a similar Remove Integer Overflow
    Checks option. Because integer operations are unchecked by default in C#, but
    checked by default in VB, selecting these options results in different behavior
    between languages. If you choose the option in C#, you should leave it unchecked
    in Visual Basic, and vice versa.


    C#''s Allow Unsafe Code, Warning Level, and Advanced / Language Version build
    options have no equivalent in Visual Basic. The Internal Compiler Error Reporting
    and File Alignment options, both Advanced build options in C#, can only be performed
    in Visual Basic via its command line compiler options. Use the /errorreport and
    /filealign options, respectively.'
