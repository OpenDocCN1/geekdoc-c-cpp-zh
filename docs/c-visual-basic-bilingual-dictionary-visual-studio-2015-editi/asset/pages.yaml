  md: '# XML Documentation Comments


    Both C# and Visual Basic support XML comments as a means of documenting code and
    prompting Visual Studio''s IntelliSense to display extended information about
    types and type members. In C#, these begin with the /// symbol.


    ```

    C#

    /// <summary>

    /// Tracks details about living creatures.

    /// </summary>

    class Animal

    {

    }

    ```


    In Visual Basic, use the "" symbol instead.


    ```

    VISUAL BASIC

    '''''' <summary>

    '''''' Tracks details about living creatures.

    '''''' </summary>

    Class Animal

    End Class

    ```


    C# also allows XML comments within multi-line comment blocks, by starting the
    block with the /** symbol. This variation has no equivalent in Visual Basic.


    ```

    C#

    /** <summary>

    * */

    ```


    Both languages use the same set of recommended XML tags for documenting code.
    See Microsoft’s MSDN documentation for information on using these tags in your
    projects.'
