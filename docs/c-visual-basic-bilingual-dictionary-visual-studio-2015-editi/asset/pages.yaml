  md: '(When working with "null" values in database interactions, use System.Dbnull
    instead of null.) In Visual Basic, the Nothing literal serves a similar purpose.


    ```

    VISUAL BASIC

    Dim oneManager As Employee = Nothing  '' No instance

    Dim optionalNumber As Integer = Nothing  '' No value

    ```


    However, Nothing can also be assigned to a standard (non-nullable) value type,
    in which case it functions like C#''s default operator, assigning the default
    value to the variable.


    ```

    VISUAL BASIC

    Dim requiredNumber As Integer = Nothing  '' Set to zero

    ```


    Assigning null to a non-nullable value type in this manner in C# is invalid.


    ```

    C#n// ----- This will not compile.

    int requiredNumber = null;

    ```


    ```

    // ----- Use this valid syntax instead.

    int requiredNumber = default(int);

    ```


    When comparing variables or expressions to null in C#, use the == and != comparison
    operators.


    ```

    C#nif (customerRecord == null)

    ```


    You cannot use the equivalent comparison operators (= and <>) in Visual Basic
    to check for Nothing. Instead, use VB’s Is and IsNot operators to compare expressions
    with Nothing.


    ```

    VISUAL BASIC

