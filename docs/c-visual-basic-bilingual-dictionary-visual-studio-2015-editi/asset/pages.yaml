    short Data Type

    Visual Basic''s intrinsic Short data type is identical to C#''s short data type.

    Both types are aliases for .NET''s System.Int16 type. For short literals, Visual
    Basic uses an Or s suffix after the value; C# does not include such a suffix.


    ```

    short baseYear = 0;

    ```


    # VISUAL Basic


    ```

    Dim baseYear As Short = 0s '' or 0S

    ```


    sizeof Operator

    Visual Basic does not include a direct equivalent for C#''s sizeof operator. One
    option is to use the System.Runtime.InteropServices.Marshal.SizeOf method, which
    provides similar, not identical, results. Consider the following table, which
    compares the output (in bytes) of both sizeof and Marshal.SizeOf using the same
    data types as arguments. The bool and char types provide different results. Visual
    Basic also includes a Len method that returns similar, but not identical, results
    for intrinsic value types.


    | C# Type | Marshal.SizeOf | Len Method |

    |---|---|---|n| byte, sbyte | 1 | 1 | |

    | short, ushort | 2 | 2 | |

    | int, uint | 4 | 4 | |

    | long, ulong | 8 | 8 | |

    | bool | 1 | 2 | |

    | char | 1 | 2 | |

    | float | 4 | 4 | |

    | double | 8 | 8 | |

    | decimal | 16 | 16 | 8 |


    The sizeof operator also returns sizes for pointers and certain structures in
    unsafe contexts. You can use .NET''s System.IntPtr.Size method in VB to obtain
    the platform-specific size of a pointer or handle. For structures, Marshal.SizeOf
    method will return the total size of the structure passed'
