    # Lifetime and Scope


    With one significant difference within method code, C# and Visual Basic generally
    follow the same lifetime and scoping rules for variables.


    # Lifetime


    Lifetime indicates how long the value stored within a variable remains available.
    Both languages mostly follow the same rules for managing variable lifetime. static
    (C#) and Shared (VB) fields declared outside of methods have application lifetime,
    as fields that appear within Visual Basic Module statements. Non-static and non-shared
    type-level fields have lifetimes that last as long as the instance. Local Static
    variables in Visual Basic methods have application- or instance-lifetime, depending
    on whether the containing method is Shared or not, respectively. C# does not support
    local static variables.


    The key difference between the languages appears when using non-static local variables.
    In Visual Basic, all non-static variables, when declared inside or outside of
    a given block, have procedure-lifetime. If you declare a variable within an If
    statement block, its value will remain throughout the entire procedure, although
    scoping rules limit access to the variable to just that block. This means that
    if you reenter the block, the variable may retain the value it had the last time
    you passed through that block. Because of this, you should initialize variables
    defined within a block.


    In C#, variables have block-level lifetimes. If you declare a variable within
    an If statement block, its lifetime ends upon exiting that block.


    # Scope


    Scope refers to which parts of your source code have access to a specific identifier.
    C# and Visual Basic follow the same scoping rules for type-level, procedure-level,
    and block-level variables.


