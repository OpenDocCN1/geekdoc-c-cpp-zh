  md: "# ! Negation Operator\n\nThe Visual Basic equivalent of C#s! Boolean-centric\
    \ operator is the Not operator.\n\n```\nC#\nbool opposite = !originalValue;\n\
    VISUAL BASIC\nDim opposite As Boolean = Not originalValue\n```\n\nThe Not operator\
    \ is also a bitwise complement operator when used with integer operands. The equivalent\
    \ in C# for that variation is the ~ operator.\n\nSee Also\n\n+   - Bitwise Complement\
    \ Operator\n\n# != Comparison Operator\n\nWhen comparing values, Visual Basic's\
    \ <> inequality operator is identical to C#s!= operator, and appears in the same\
    \ binary-operator position.\n\n```\nC#\nif (teamPlayers != 9)\nVISUAL BASIC\n\
    If (teamPlayers <> 9) Then\n```\n\nFor string comparisons, the <> operator once\
    \ again replicates C#s!== operator. However, VB’s Option Compare statement impacts\
    \ the way that strings compare to each other. By default, both C# and Visual Basic\
    \ perform binary-level comparisons of strings. However, if a VB project or source\
    \ file employs Option Compare Text , the comparison instead uses culture-specific\
    \ sorting rules.\n\nFor reference types other than strings, C#s!= operator tests\
    \ whether the two references being compared to the same underlying instance. This\
    \ syntax is invalid in Visual Basic (at least when Option Strict On is used).\
    \ Instead, VB programs should use the IsNot operator with a second instance, or\
    \ with Nothing.\n\n```\nC#\n// Standard instance comparison.\nif (firstInstance\
    \ != secondInstance)\n\n// Comparisons with null.\nif (anotherInstance != null)\n\
    VISUAL BASIC\n  ----- Standard instance comparison.\n```"
