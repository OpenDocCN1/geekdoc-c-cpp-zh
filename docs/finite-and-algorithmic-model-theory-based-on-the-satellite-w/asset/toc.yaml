  - 引理 3.3.9 假设 $\mathcal{A}$ 是 $T$ 的 $\Phi$-并类，使得所有闭的 $(\Phi, \mathcal{A})$-型是可数的，存在一个可数的
    $L$-结构 $M$，使得：
- - '##'
  - 定义 3.3.10 如果 $M$ 是引理 3.3.9 中的模型，则我们称 $M$ 为 $\mathcal{A}$ 的。
- - '##'
  - 引理 3.3.12 假设 $\Phi$ 封闭且对于 $i < \kappa，$M_i \preceq_{\Phi} M$。如果 $M = \bigcup_{i
    < \kappa} M_i$，则每个 $i < \kappa，$M_i \preceq_{\Phi} M$。
- - '##'
  - 引理 3.3.13 假设每个嵌套的原子公式在 $T$ 下等价于 $\Phi$ 中的公式。令 $\mathcal{A}$ 为 $T$ 的 $\Phi$-并类，对于有限序列
    $\tilde{a} \in M$ 和 $b \in \mathcal{N}$，如果 $|\tilde{a}| = |b|$且 $(M, \tilde{a})
    \equiv_{\Phi} (N, b)$，则存在从 $M$ 到 $N$ 的同构将 $\tilde{a}$ 映射到 $b$。
- - '##'
  - 推论 3.3.14 假设每个嵌套的原子公式在 $T$ 下等价于 $\Phi$ 中的公式。那么 $T$ 的 $\Phi$-并合类 $\mathcal{A}$
    是唯一的。注意如果 $\Phi = L，$n \geq 2$，关系符号的度为 $n$，函数符号的度小于 $n$，每个嵌套的 $L$-公式都属于 $\Phi$，因此引理
    3.3.12 关于 $\Phi$ 的条件被满足了。
- - '##'
  - 定义 14 一个 $L$-结构 $M$ 是 $\Phi$-定的，对于有限序列 $\tilde{a}, \tilde{b} \in M$，如果 $(M, \tilde{a})
    \equiv_{\Phi} (M, \tilde{b})$。
- - '##'
  - 定义 15 一个 $L$-结构 $M$ 是 $\omega$-同构的，对于所有序列 $\tilde{a}, \tilde{b} \in M$，使得 $(M,
    \tilde{a}) \equiv_L (M, \tilde{b})$，且对于每个 $c \in M$，存在 $d \in M$ 使得 $(M, c) \equiv_L
    (M, d)$。
- - '##'
  - 引理 3.3.16 如果 $M$ 是 $T$ 的 $\Phi$-定的模型且有限的或 $\omega$-类的，则存在 $T$ 的 $\Phi$-并合类。
- - '##'
  - 备注 3.3.17 基本事实是 $\omega$-类结构都是 $\omega$-同构的。一个完备理论是 $\omega$-类的当且仅对于该理论的每个模型 $M$
