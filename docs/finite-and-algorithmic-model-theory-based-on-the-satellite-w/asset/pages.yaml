  md: '# Automata-based presentations of infinite structures


    # 1.3.7 Subclasses


    In this section we restrict the complexity of the regular domains in automatic
    presentations to yield some of the most robust subclasses of S-AutStr.


    # Polynomial domain


    The most natural restriction is to consider presentations where the words and
    trees take labels from a unary alphabet $|\Sigma|=1$. Word-automatic presentations
    over a unary alphabet were introduced and studied by Blumensath [20] and Rubin
    [89, 124].


    The density of a language $L \subset \Sigma^*$ is the function $n \mapsto |L \cap
    \Sigma^n|$.


    **Definition 1.3.26** A structure is *unary automatic* if it has an injective-automatic
    presentation in which the domain consists of words from a unary alphabet. A structure
    is *p-automatic* if it has an injective-automatic presentation in which the domain
    has polynomial density. Let 1-AutStr and P-AutStr denote these classes of structures.


    Regular sets of polynomial density were generalised by Szilard et al. [131] as
    being a finite union of the


    ```

    $D = \bigcup_{i-N} u_{i,1}, v_{i,1} \dots u_{i,n}, v_{i,n}, u_{i,n+1} \quad (1.10)$

    ```


    where the degree of the polynomial of the density function is equal to the maximum
    of the $n_i$''s. In [6] it was demonstrated that every finite-word-automatic presentation
    over a domain as in (1.10) can be transformed into an equivalent one (cf. Section
    1.4.4) over a domain that is a regular subset of


    ```

    $a_1^{a_2^{\dots a_n}}}$

    ```


    where $n$ is equal to the maximum of the $n_i$''s. In particular, word-automatic
    presentations over a domain of linear density are unary automatic. This transformation
    yields a kind of normal-form of word-automatic presentations over a polynomially
    growing domain.


    **Theorem 1.3.27** ([6]) A structure $\mathcal{A}$ has an automatic presentation
    over a domain of density $O(n^d)$ if, and only, it has a $d$-dimensional interpretation
    in $\mathfrak{R} := (\mathbb{N}, \{n | (n \pmod d)=0\})$ if, and only, it is finite-subset
    interpretable in $\Delta_1 := (\mathbb{N}, \text{suc})$ with subsets of size at
    most $d$.


    **Corollary 1.3.28** ([113],[20]) A structure $\mathcal{A}$ is unary automatic
    if, and only if, it is first-order definable in $\mathfrak{R}$ if, and only, it
    is MSO-interpretable in $\Delta_1$.'
