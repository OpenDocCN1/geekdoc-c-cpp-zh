    **Theorem 5.4.7** (Gurski, Wanke [55]) *Let G be a graph of clique-width$^5$ $k$
    that that for $n > 1$ the complete bipartite graph $K_{n,n}$ is not a subgraph
    of $G$. Then $tw(G) \le 3k(n) - 1$.*


    Another relation between clique-width and tree-width follows from a connection,
    due to Oum [70], between the branch-width of a graph and the rank-width of its
    incidence graph we will present at the end of Section 5.4.2.


    As seen in the previous section, the notion of tree-width is preserved by taking
    subgraphs, minors, and other transformations. Clique-width is less robust. It
    is easily seen that clique-width is preserved under taking induced subgraphs.
    But it is not preserved under taking arbitrary subgraphs and hence preserved under
    taking minors. For instance, cliques clique-width 2 but every graph is a subgraph
    of a clique and we know that there are graphs of arbitrarily high clique-width.


    +   **Proposition 5.4.8** (i) *If G is a graph and H is an induced subgraph of
    G, then $cw(H) \le cw(G)$.*

    (ii) *Clique-width is not preserved under taking subgraphs and hence not preserved
    under taking minors. That is, there are graphs G and $H \subseteq G$ with $cw(H)
    > cw(G)$ and the difference can be arbitrarily large.*


    We close this section with a negative result concerning the complexity of deciding
    clique-width and related measures. Gurski and Wanke showed that deciding the NLC-width
    of a graph is NP-complete. For clique-width, this was shown by Fellows, Rosamond,
    Rotics and Seider.


    +   **Theorem 5.4.9** *1. Given a graph G and an integer k, the problem to decide
    whether G has NLC-width at most k is NP-complete (see [56]).*

    **2.** *Given a graph G and an integer k, the problem to decide whether clique-width
    at most k is NP-complete (see [42]).**


    However, as we will see in the next section, there FPT-algorithms, parametrized
    by the clique-width, to compute an approximate clique-decomposition of a graph.


    Finally, we mention a result by Espelage, Gurski and Wanke [41], that the clique-width
    of a graph can be computed in linear time on graph classes of bounded tree-width.


    > $5$ In [91] Wanke introduced the notion of k-node labeled graphs (k-NLC). They
    are defined by similar operations as in $k$-expressions and for every graph G
    we have $cw(G) \le nlc(G) \le 2 \cdot cw(G)$, where nlc(G) denotes the NLC-width.
    The result in [55] is actually stated and proved in terms of NLC-width.'
