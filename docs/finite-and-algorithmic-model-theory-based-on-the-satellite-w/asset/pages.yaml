    A graph $H$ is a *minor* of a graph $G$ if $H$ can be obtained from $G$ by deleting
    vertices and edges and contracting edges. We write $H \preceq G$ to denote that
    $H$ is isomorphic to a minor of $G$.


    An alternative definition of minors is in terms of minor maps. A *minor map* from
    $H$ to $G$ is a function $\mu$ that associates with every vertex $v \in V(H)$
    a connected subgraph $\mu(v) \subseteq G$ and with every edge $e \in E(H)$ an
    edge $\mu(e) \in E(G)$ such that


    +   $u, v \in V(H)$ and $u \neq v$ then $\mu(v)$ and $\mu(u)$ are vertex disjoint

    * $e := \{u, v\} \in E(H)$ then $\mu(e) := \{u'', v''\}$ for some $u'' \in V(\mu(u))$
    and $v'' \in V(\mu(u))$.


    The subgraph $G_{\mu} \preceq G$ with


    $V(G_{\mu}) := \bigcup \{V(\mu(v)) : v \in V(H)\}$


    and


    $E(G_{\mu}) := \bigcup \{E(\mu(v)) : v \in V(H)\} \cup \{\mu(e) : e \in E(H)\}$


