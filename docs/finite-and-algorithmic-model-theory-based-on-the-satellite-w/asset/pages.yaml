    # **Theorem 1.5** S$_{[2]}$ is the only word-automatic model of its theory.


    Proof. Assume, for a contradiction, an automatic presentation of a non-standard
    elementary extension of S$_{[2]}$. By ''component'' we mean a maximal set of elements
    connected by successor relations. Every elementary extension of S$_{[2]}$ consists
    of the standard component isomorphic to S$_{[2]}$ (containing the root), and any
    number of non-standard components, that are, as unlabelled graphs, all isomorphic
    to one-another. The non-standard components are distinguished by the infinite
    sequences of 0-1 successors ascending towards the root.


    +   (0) The set of representatives of elements of each component is regular.


    Indeed, the equivalence relation of belonging to the same component is FO + $\exists^\infty$-definable
    in the model (by saying that there is a common ancestor having finite distance
    from both elements), hence regular in the representation.


    +   (1) There is a non-standard element below every standard node.


    This follows from the fact that the formula


    > $$\forall x, x'', y'' : \text{el}(x, x'') \wedge x < y \rightarrow \exists y''
    : \text{el}(y, y'') \wedge x'' < y''$$


    being in S$_{[2]}$ must also hold in every non-standard model.


    Combining observation (0) and Theorem 1.4.26 we may assume that the presentation
    restricted to the standard component is the nature having the identity as naming
    function. The binary $\omega$-sequence naturally associated with an infinite branch
    of the standard component provides a representation of the set of nodes along
    that branch consistent with the assumed presentation of the model. Denote by $\Pi$
    the set of paths with a non-standard element below them.


    +   (2) The set $\Pi$ is $\omega$-regular.


    Indeed, a Büchi-automaton is built to guess a finite word representing a non-standard
    element and to check, using the automata of the assumed presentation, that it
    is a descendant of all finite prefixes of the input path. Given that our model
    is countable, hence is $\Pi$, we have the following consequence of claim (2).'
