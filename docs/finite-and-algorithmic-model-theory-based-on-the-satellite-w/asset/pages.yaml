  md: 'Next we state the crucial result which will give us finite models for every
    complete $L^n$-theory $T$ such that $S_n^n(T)$ is finite and there is a stable
    $L^n$-amalgamation class for $T$.


    **Theorem 3.4.6** (Cherlin, Harrington, Lachlan [4]) If $M$ is $\omega$-categorical
    and $\omega$-stable, $M \models \varphi$ and $A$ is a finite subset of $M$, then
    there exists a finite substructure $N \subseteq M$ such that $N \models \varphi$
    and $A \subseteq N$.


    Recall, that by $T$ 3.2.6, if $T$ is a complete $L^n$-theory such that $S_n^n(T)$
    is finite and $T$ is axiomatized by an $L^n$-sentence. Thus, applying Theorem
    3.4.6 and previous results we get:


    **Theorem 3.4.7** *Suppose that $n$ is greater than the arity of every function
    symbol in the vocabulary of $L$ and greater or equal to the arity of every relation
    symbol in the vocabulary of $L$. If $T$ is a complete $L^n$-theory such that $S_n^n(T)$
    is finite then the following holds:


    +   (i) If $M$ is a model of $T$ which is $\omega$-categorical and $\omega$-stable,
    then for any finite $A \subseteq M$ there is a finite $N \leq_{L^n} M$ such that
    $A \subseteq N$, and consequently $N \models T$.


    +   (ii) Suppose that for every $M \models T$ and $A \subseteq M$, $cl(A) = A$.
    If there is a stable $L^n$-amalgamation class for $T$ such that $A$ contains at
    least one infinite structure then $T$ has arbitrarily large models.


    Observe the assumption in part (ii) of the above theorem that the closure operation
    is trivial. We now turn to the case where ''cl'' is not trivial (i.e. for some
    $A$, $cl(A) \neq A$). An example of such a situation is if $M$ is an infinite
    vector space over a finite field and $T = Th_{L^n}(M)$, for sufficiently large
    $n$. Then there cannot exist a trivial closure operation and a stable $L^n$-amalgamation
    class for $T$, with respect to this closure operation, which contains an infinite
    structure. The reason is that it would imply an infinite vector space, over the
    same field, which is $L^n$-determined and this is impossible. In every infinite
    model of $T$ we can choose $m$ greater than $n$ and on the one hand a linearly
    independent sequence $\vec{a} = (a_1, \dots, a_n)$ and on the other hand a sequence
    $\vec{b} = (b_1, \dots, b_m)$ such that $\vec{b}$ is not linearly independent
    but every proper subset of $\vec{b}$ is linearly independent. With this choice,
    $\vec{a}$ and $\vec{b}$ have the same $L^n$-type but not the same $L$-type, so
    the structure is not $L^n$-determined.


    Motivated by this we would like to find some amalgamation property for complete
    $L^n$-theories $T$ which also holds for the example of vector spaces and which
    implies the existence of an $\omega$-categorical and $\omega$-stable model of
    $T$, so that we are in position to apply Theorem 3.4.6.'
