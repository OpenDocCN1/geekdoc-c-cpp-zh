  md: '# 5.5.4 Computing Excluded Minor Characterisations


    Recall from Section 5.5.1 every minor ideal can be characterised by a finite set
    of excluded minors (Theorem 5.5.2) and for each fixed H it is decidable in cubic
    time whether a graph G contains H as a minor (Theorem 5.5.9). As a consequence
    we obtain Corollary 5.5.3 stating that every minor ideal can be decided in cubic
    time. Note that the result contains a non-constructive element as it does not
    give a way to compute the excluded minors for a minor ideal. For instance, while
    we know that the class of knotlessly embeddable graphs can be decided in cubic
    time, no algorithm for doing so is actually known.


    This naturally raises the question whether this non-constructive element can be
    removed from the proof, i.e. whether characterisations of minor ideals in terms
    of their excluded minors can be computed. Clearly, to state this precisely, we
    have to specify how we want to represent a minor ideal as an input to algorithms
    and also exactly what we want to understand by a characterisation of a minor ideal
    in terms of excluded minors.


    Let C be a minor ideal. A graph H is an obstruction for C if H is excluded from
    C but for all H'' < H with H'' ≠ H we have H'' ∈ C. Hence, obstructions are minimal
    excluded minors. We denote the set of obstructions of C by O(C). It is easily
    seen that for all minor ideals C, O(C) is unique up to isomorphism and it is finite
    by the Graph Minor Theorem. We will therefore take O(C) as the characterisation
    of minor ideals we want to compute.


