  md: '# Vince Bárány, Erich Grädel and Sasha Rubin


    studied model theory since the 1960s. However, from the point of view of algorithmic
    model theory the class of computable structures is problematic. Indeed, one of
    the central issues in algorithmic model theory is the effective evaluation of
    logical formulae, from a suitable logic such as first-order logic (FO), monadic
    second-order logic (MSO), or a fixed point logic LFP or the modal $\mu$-calculus.
    On computable structures, only the quantifier-free formulae generally admit effective
    evaluation, and already the existential fragment of first-order logic is undecidable,
    for instance on the countable structure $(\mathbb{N}, +, \cdot)$.


    This leads to the central requirement that for a suitable $L$ (depending on the
    intended application) the model-checking problem for the class $C$ of finitely
    presented structures should be algorithmically solvable. At the very least, this
    means that the $L$-theory of individual structures in $C$ should be decidable.
    But for most applications something more is required:


    **Effective semantics:** there be an algorithm, given a finite presentation of
    a structure $\mathfrak{A} \in C$ and a formula $\psi(\hat{x}) \in L$, expands
    the given to include the relation $\Psi^\alpha$ defined by $\psi$ on $\alpha$.


    This also implies that the class $C$ should be closed under some basic operations
    (such as logical interpretations). Thus we should be careful to restrict the model
    of computation. Typically, this means using some model of *finite* automata or
    a very restricted form of rewriting.


    In general, the means for representing infinite structures may involve different
    approaches: logical interpretations; finite axiomatisations; rewriting of terms,
    trees, or graphs; equational specifications; the use of synchronous and asynchronous
    automata, etc. The various possibilities can be classified along the following
    lines:


    +   **Internal:** a set of finite or infinite words or trees/terms is used to
    represent the domain of (an isomorphic copy of) the structure. Finite automata/rewriting-rules
    compute the domain and atomic relations (eg. prefix-recognisable graphs, automatic
    structures).


