    # 1.2.1 From context-free graphs to prefix-recognisable structures


    Context-free graphs were introduced in the seminal papers [110, 111, 112] of Muller
    and Schupp. There are several equivalent definitions. The objects of study are
    countable directed edge-labelled, finitely branching graphs. An *end* is a *maximal
    connected* component of the induced subgraph obtained by removing, for some $n$,
    the $n$-neighbourhood of a fixed vertex $v_0$. A vertex of an end is on the boundary
    if it is connected to a vertex in the removed neighbourhood. Two ends are end-isomorphic
    if there is a graph isomorphism (preserving labels as well) between them that
    is also a bijection of their boundaries. A graph is *context-free* if it is connected
    and has finitely *ends* up to end-isomorphism. This notion is independent of the
    $v_0$ chosen.


    A graph is context-free and only if it is isomorphic to the connected component
    of the configuration graph of a pushdown automaton with $\epsilon$-transitions
    induced by the set of configurations that are reachable from the initial configuration
    [112].


    A *context-free group* is a finitely generated group $G$ such that, for set $S$
    of semigroup generators of $G$, the words $w \in S^*$ representing the identity
    element of $G$ forms a context-free language. This is independent of the choice
    of $S$. Moreover, a group is context-free and only if its Cayley graph for some
    (and hence all) $S$ of semigroup generators is a context-free graph. Finally,
    a finitely generated group is context-free and only if it is *virtually free*,
    that is, if it has a free subgroup of index [111].


    Muller and Schupp have further shown that context-free graphs have a decidable
    MSO-theory interpreted in the full binary tree.


