    is no algorithm which, given a Turing-machine deciding a minor ideal C, computes
    the O(C). Later, Courcelle, Fellows and Langston [15] showed that there is no
    algorithm which, given an MSO-sentence defining a minor ideal C, computes O(C).


    On the other hand, it is known that obstructions can be computed for a number
    of natural minor ideals. For instance, for all k ≥ 1 the obstructions can be computed
