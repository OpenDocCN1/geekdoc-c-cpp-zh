  md: "# Fragments of FO and special classes of structures\n\nassociated with structure\
    \ $\\mathfrak{A}$. The $k$-variable fragment $FO^k$ of FO, for instance, exactly\
    \ corresponds to the restriction that only up to $k$ elements of $\\mathfrak{A}$\
    \ are “simultaneously observable” — we just restrict the assignments to size $k$.\
    \ While this is a uniform, purely quantitative restriction, the modal and guarded\
    \ fragments of first-order logic are based on structural, qualitative restrictions.\
    \ In the guarded fragment GF, where the target configuration is restricted by\
    \ the requirement that be guarded, i.e., by some relational guard atom (which\
    \ is explicitly reflected in the syntax of guarded quantification). In the more\
    \ basic modal fragment ML of FO, $\\mathfrak{A}$ itself is the system of observable\
    \ configurations — in this case the transition relations between the (trivial,\
    \ one-point) configurations are the key to the restrictions imposed in modal logic.\
    \ We treat $k$-variable logic, guarded logic and modal logic in this order of\
    \ increasing specialisation, with particular emphasis on modal logic and its comparison\
    \ game, the bisimulation game.\n\n# The $k$-variable fragment $FO^k$ and the $k$-pebble\
    \ game\n\nThe $k$-variable fragment $FO^k \\subseteq FO$ in a relational vocabulary\
    \ $\tau$ consists of all first-order formulae in which only the variables $x_1,\
    \ \\dots, x_k$ occur, bound or free. Assignments over $r$-structures $\\mathfrak{A}$\
    \ can thus be restricted and normalised to be full assignments to these $k$ variables.\
    \ We identify assignments with $k$-tuples.\n\nCorresponding, let $O^k(\\mathfrak{A})$\
    \ be the restriction of $O(\\mathfrak{A})$ to $\\{\\beta : |\\beta| = k\\} = \\\
    mathfrak{A}^k$. It is easy to see that the restriction of both the model checking\
    \ game and that if $O(\\mathfrak{A})$ is consistently replaced with $O^k(\\mathfrak{A})$\
    \ are adequate for the semantics of $FO^k$ and for the induced notions of $k$-variable\
    \ equivalence. The $k$-variable Ehrenfeucht-Fraïssé game is just the $k$-pebble\
    \ game: moves along $E$-edges in $O^k(\\mathfrak{A})$ correspond to the re-positioning\
    \ of the $i$-th pebble on $\\mathfrak{A}$. The correspondence between the different\
    \ levels of the game and of $k$-variable equivalence are the following, for finite\
    \ vocabularies:\n\n```\n$\\equiv_q : FO^k$-equivalence up to quantifier-rank $q$;\\\
    ncaptured by the $q$-round pebble game $G_q^k$.$\\n$\\equiv : FO^k$-equivalence;\\\
    ncaptured by the finite-round pebble game $G_\\omega^k$.\\n$\\equiv_\\infty :\
    \ FO^k$-equivalence;\\ncaptured by the infinite $k$-pebble game $G_\\infty^k$.\n\
    ```\n\nIt is important to note that $O^k(\\mathfrak{A})$ is of finite type for\
    \ each finite $\tau$, and of polynomial size in the size of $\\mathfrak{A}$, for\
