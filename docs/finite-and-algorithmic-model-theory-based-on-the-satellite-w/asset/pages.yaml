    of a spatial dataset can be expressed in transitive-closure logic with stop conditions.
    The task here is, given a spatial dataset $S$ and a number $\varepsilon > 0$,
    to find a $\mathbb{Z}$-linear spatial dataset that is homeomorphic to $S$ (topological
    condition) and that $\varepsilon$-approximates $S$ (metric condition).


    It is not difficult to show that $\varepsilon$-approximations cannot be expressed
    in first-order logic over the reals, for the case of $\mathbb{R}^2$, how a rational
    $\varepsilon$-approximation of a spatial dataset $S$ can be expressed in transitive-closure
    logic with stop conditions.


    First, we find all points where the boundary of $S$ is not smooth and border points
    with a vertical tangent. For these points, we compute their local cone radius
    (conic around points was discussed in Section 2.4) and within these radii locally
    rectify the database. This is all expressible over the reals (Geerts and Kuij,
    1999; Geerts et al., 2006) and illustrated in Figure 2.16.


    Next, we consider the border of $S$ outside the cone radius determined in the
    first step. We then compute the maximal cone radius $r$ of all points on these
    curves in first-order logic. Let Step the relation of pairs of points $(p,q)$
    on these curves that $d(p,q)=r$. In transitive-closure logic, we can compute TC(Step)
    and the termination of this computation is guaranteed. Once this is done, we walk
    over these curves starting from the endpoints and locally rectify them. This is
    illustrated in Figure 2.17. We can also this when the curves are bordering curves
    of the interior.'
