  md: "# Automata-based presentations of infinite structures\n\n# Morphic words\n\n\
    One obtains a definition of *morphic words* by relaxing characterisation (4) of\
    \ the above theorem. Morphic words constitute a generalisation of automatic sequences,\
    \ and their relatives have been extensively studied in the context of formal language\
    \ theory, Lindenmayer systems and combinatorics on words.\n\n**Definition 1.4.34**\
    \ *Morphic words* are those of the form $\\sigma(\tau^w(a))$ for arbitrary homomorphism\
    \ $\tau$ prolongable on $a$ and arbitrary homomorphism $\\sigma : \\Gamma^* \r\
    ightarrow \\Sigma^*$ extended to $w$-words in the obvious way.\n\n**Example 1.4.35**\
    \ Consider $\tau : a \\mapsto ab, b \\mapsto ccb, c \\mapsto c$ and $\\sigma :\
    \ a, b \\mapsto 1, c \\mapsto \\{a, b, c\\}^*$. The fixed point of $\tau$ starting\
    \ with $a$ is the word $abcccbccc$, and its image under $\\sigma$, $1100010^610^8\\\
    dots$, is the characteristic sequence of squares. In $\\mathbb{N}$-rational sequence\
    \ $(s_k)$ the characteristic sequence of the set $\\{s^k_n \\mid n \\in \\mathbb{N}\\\
    }$ is morphic [38]. This result also follows from Proposition 1.4.37.\n\nWhile\
    \ $k$-automatic sequences allow automatic presentations over the set of standard\
    \ base $k$ numerals, the above example suggests that morphic words may need generalised\
    \ numerical systems. Indeed, every morphic word is automatically presentable in\
    \ the sense\n\nConsider a finite alphabet $\\Gamma = \\{a_1 < a_2 < \\dots < a_i\\\
    }$. The induced length-lexicographic order, denoted $<_{lex}$, words over $\\\
    Gamma$ are ordered lexicographically by their length, while words of the same\
    \ length are ordered lexicographically. Thus $(D, <_{lex})$ provides an automatic\
    \ presentation of $(\\mathbb{N}, <_{lex})$ for every infinite regular language\
    \ $D$ over $\\Gamma$. Base $k$ as well as so called generalised numerical systems\
    \ are special cases of this scheme. The following notion generalised Definition\
    \ 1.4.32.\n\n**Definition 1.4.36** We say that an $\\omega$-word $w : \\mathbb{N}\
    \ \rightarrow \\Sigma$ is length-lexicographically presentable if there is an\
    \ automatic presentation $(D, <_{lex})$ of $(\\mathbb{N}, <_{lex})$ with naming\
    \ function $f : D \rightarrow \\mathbb{N}$ such that the $f^{-1}(w^{-1}(a))$ are\
    \ regular for each $a \\in \\Sigma$.\n\nIt is not hard to see that an $\\omega$-word\
    \ is length-lexicographically presentable if and only if it is morphic. There\
    \ is a perfectly natural correspondence between the morphisms generating a word\
    \ and the automaton recognising the set of 'numerals', which, length-lexicographically\
    \ ordered, give an automatic presentation of the morphic word."
