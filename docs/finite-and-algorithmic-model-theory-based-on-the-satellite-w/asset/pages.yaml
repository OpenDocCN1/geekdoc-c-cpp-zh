  md: '# Bart Kuijpers and Jan Van den Bussche


    ![](img/ba8cd3ad09a1969652afbe21bc8dc93b_92_0.png)


    Figure 2.1 This set in the plane is closed, and is semi-algebraic, being defined
    by the formula $x^2/25 + y^2/16 = 1 \vee x^2 + 4x + y^2 - 2y \leq -4 \vee x^2
    - 4x + y^2 - 2y \leq -4 \vee (x^2 + y^2 - 2y = 8 \wedge y \leq -1)$.


    We are still able to capture the first-order topological properties, provided
    we restrict our set to the following:


    +   1. We work in $\mathbb{R}^2$ only, i.e., sets in the real plane.

    2. We consider only *semi-algebraic* sets: sets that are themselves definable
    in $\mathbb{R}$.

    3. Moreover, we consider only *closed* sets (in the standard topological sense).


    Let us call such sets "plain". Figure 2.1 shows an example of a plain set (Bochnak
    et al., 1998).


    Let us see some examples of topological properties of plain sets, expressible
    in first-order logic:


    +   * *The dimension is 0 (or 1, or 2)*.

    * *There is a point where three lines intersect*.

    * *There is a point where two 2-dimensional regions touch*.


    We remark that the expressibility of the third property is not obvious and uses
    the local conical structure of semi-algebraic sets (see later).


    The following topological properties of plain sets are *not* expressible in first-order
    logic:


    +   * *There is a point where an even number of lines intersect*.

    * *The number of points where two 2-dimensional regions touch is even*.

    * *The set is topologically connected*.


    The inexpressibility of the third property above follows from Theorem 2.3 below,
    but was first established in (Grumbach and Su, 1997).


    So, the question is, what are the first-order expressible topological properties
    of plain sets? In order to formulate our answer to this question, we use the notion
    of a *cone* (Coste, 1982).'
