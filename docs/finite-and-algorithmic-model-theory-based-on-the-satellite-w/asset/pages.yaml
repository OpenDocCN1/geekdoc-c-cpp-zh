    **Example 1.2.7** The complete bipartite graph $K_{1,\omega}$ and the full $\omega$-branching
    tree $\Sigma_{\omega}$ (in the signature of graphs) are not context-free, but
    can be generated by the following rules from the initial graph


    ![](img/ba8cd3ad09a1969652afbe21bc8dc93b_25_1.png)


    The HR-algebra of finite and countable graphs corresponding to hyperedge-replacement
    grammars is a many-sorted algebra defined as follows. For each n there a separate
    sort $\mathcal{G}_n$ of graphs with $n$ sources. There are distinguished vertices,
    though not necessarily distinct, $v_1, \dots, v_n$. There are constants of each
    sort $\mathcal{G}_n$; these are hypergraphs having at most one hyperedge, exactly
    $n$ vertices, each vertex a distinct source. The HR-algebra is built on the operations:
    disjoint union $\sqcup$, renaming of sources $rename_{c\to c''}$, and fusion of
    sources $fuse$ according to an equivalence $\sim$ on source names. By convention
    it is understood to automatically shift the source names of its second argument
    by the maximum of the source names used in the first to avoid naming conflict.
    Also $fuse$ assigns the least source name of a class to fused node while dropping
    the others.


    It is intuitively clear how a hyper-replacement step can be expressed using disjoint
    union with the right-hand side of the rule followed by a fusion and renaming of
    sources. Formally, it transforms an HR-graph $\mathcal{G}$ into a system of finitely
    many equations $X_i = t_i(\mathcal{X})$ where variables play the role of non-terminals
    of the grammar and the terms are chosen such that, when variables are interpreted
    as individual hyperedges, $[t_i(\mathcal{X})\|]$ is the right side of the matching
    rule for a hyperedge labelled $X_i$.'
