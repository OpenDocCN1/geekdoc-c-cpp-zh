  md: "52 Vince Bárányny, Erich Grädel and Sasha Rubin\n\n**Theorem 1.4.20** *If a\
    \ countable structure is $\\omega$-word automatic with oracle, then it is also\
    \ finite-word automatic with (the same) oracle.*\n\n# ## 1.4.4 Comparing presentations\n\
    \nWhen we think of an automatic structure we frequently have a particular automatic\
    \ presentation in mind. $(a^*, <_{len})$ is arguably the canonical presentation\
    \ of itself. Some structures have *canonical* presentations. For instance, the\
    \ vertex of $(\\mathbb{N}, <)$ and $(\\{0,1\\}^*, suc_0, suc_1, <_{prefix}, el)$\
    \ is the canonical presentation of itself. Some well-known structures have *natural*\
    \ presentations, none of which can be indisputably called canonical. The base\
    \ $k\\in N$ ($k>1$) presentations of $(\\mathbb{N}, +)$ can be considered equally\
    \ natural; but what about the Fibonacci numeration system? The field of *regular*\
    \ numeration systems, using some different terminology, investigates automatic\
    \ presentations of $(\\mathbb{N}, +)$ and $\\omega$-word automatic presentations\
    \ of $(\\mathbb{R}, +)$. Finally, there are *pathological* presentations that\
    \ are used to pin down the relationship between definability in a structure and\
    \ regularity in its presentations [90].\n\nHow are we to compare automatic presentations\
    \ of the same structure? What are the crucial aspects of a presentation that distinguishes\
    \ it from others?\n\nCanonical representations of context-free graphs were investigated\
    \ by Sénizeregues. In [127] a p-structure for a graph $G$ is a PDA $\\mathcal{A}$\
    \ (having no $\\epsilon$-transitions) with an isomorphism between the configuration\
    \ graph of $\\mathcal{A}$ and $G$. Furthermore, a p-structure of $G$ is *p*-canonical\
    \ if the distance in $G$ between a vertex and the root is equal to the stack height\
    \ of the configuration vertex $v$ (cf. [112])'s notion of canonical automaton\
    \ for a context-free graph; for a fixed graph $G$ Sénizeregues considers two p-structures\
    \ equivalent if there is a rational isomorphism between them, and shows that every\
    \ equivalence class of p-structures contains a P-canonical [127].\n\nAn example\
    \ of the theory of numeration systems is provided by the celebrated Cobham and\
    \ Semenov. Recall that $p$ and $q$ are called *multiplicatively independent* if\
    \ they have no common power (ie. $p^k \neq q^l$ for all $k, l \\ge 1$) and multiplicatively\
    \ dependent otherwise.\n\n**Theorem 1.4.21** (Cobham-Semenov$^{19}$, cf. [26,\
    \ 19, 109])\nThe following dichotomy holds for $p, q \\ge 2$.\n\n$^{19}$Cobham\
    \ proved it for sets; Semenov extended it to arbitrary relations."
