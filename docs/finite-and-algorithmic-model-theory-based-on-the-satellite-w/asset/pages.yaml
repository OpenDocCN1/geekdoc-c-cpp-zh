    structures ℭ that has an interesting model theory and lies somewhere between the
    finite structures (finite model theory) and all structures (classical model theory).


    The richest and oldest class consists of the computable structures – these whose
    domain and atomic relations are computable by Turing machines [70]. In computable
    model theory, a common theme is to take classical results from mathematics and
    model theory and to see to what extent they can be effective. We have two illustrative
    observations:


    +   (i) A computable first-order theory has a computable model. Indeed, Henkin''s
    construction can be seen as an algorithm computing the domain and atomic relations.

    (ii) Two computable presentations of the rational ordering (K, <) are computably
    isomorphic. Again, the standard back-and-forth argument can be seen as an algorithm
    building the isomorphism.


