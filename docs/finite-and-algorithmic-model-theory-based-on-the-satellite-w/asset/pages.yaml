  md: 'Corollary **5.5.19** There is an algorithm which, given a formula $\varphi$
    MSO defining a minor ideal $\mathcal{C}$ and $k \in \mathbb{N}$ such that $tw(H)
    \leq k$ for all $H \in \mathcal{O}(\mathcal{C})$, computes the set $\mathcal{O}(\mathcal{C})$.


    As an application of we show that the obstructions for union $\mathcal{C} \cup
    \mathcal{D}$ of minor ideals $\mathcal{C}, \mathcal{D}$ can be computed from the
    sets $\mathcal{O}(\mathcal{C})$ and $\mathcal{O}(\mathcal{D})$. Hence, we have
    to show that $\mathcal{C} \cup \mathcal{D}$ is MSO-definable and to establish
    an upper bound on the tree-width of its obstructions.


    It is easily seen that for any graph $H$ there is an MSO-formula $\varphi_H$ which
    is true in a graph $G$ if, and only if, $H \preceq G$. This immediately follows
    from the definition of minors in terms of minor maps and images as presented in
    Section 5.5.1. To define $\mathcal{C} \cup \mathcal{D}$ in MSO note that $G \in
    \mathcal{C} \cup \mathcal{D}$ if, and only if, $G$ either excludes a minor from
    $\mathcal{O}(\mathcal{C})$ or a minor from $\mathcal{O}(\mathcal{D})$. As we have
    seen, this is MSO-definable and a corresponding formula can easily be computed.
    It remains to establish a upper bound on the tree-width of the obstructions.


    **Lemma 5.5.20** Let $\mathcal{C}$ and $\mathcal{D}$ be minor ideals and let $u
    := \mathcal{C} \cup \mathcal{D}$. There is an algorithm, given $\mathcal{O}(\mathcal{C})$
    and $\mathcal{O}(\mathcal{D})$ as input, computes a minor $k \in \mathbb{N}$ such
    that $tw(H) \leq k$ for all $H \in \mathcal{O}(u)$.


    *Proof.* Suppose $G \in \mathcal{O}(u)$. Hence, $G \preceq u$ but $G - v \in u$
    for all $v \in V(G)$. It follows that $H \in \mathcal{O}(\mathcal{C})$ and $I
    \in \mathcal{O}(\mathcal{D})$ such that $H \preceq G$ and $I \preceq G$. Let $k
    := \max\{|H|, |I|\} + 1$ and choose $h$ large enough", where the meaning of large
    enough will become clear later.


    By the Trinity Lemma 5.5.7, either a) $tw(G) \leq f(k,h)$ for some computable
    function $f_*$, or b) $K_k \preceq G$ or c) there is a subset $X \subseteq V(G)$
    with $|X| < \binom{k}{2}$, a wall $W$ of $H$ in $G \setminus X$, and a flat layout
    of the $W$ in $G \setminus X$.


    Suppose c) follows from a result by Robertson and Seymour in [78] that if $h$
    is chosen large enough there is a vertex $v$ in the wall $W$ (the middle vertex)
    such that $G - v$ still contains $H$ and $I$ as minors, contradicting the minimality
    of the obstruction $G$. Hence, case $c$) is impossible. The idea to choose the
    middle vertex is as in the proof of Theorem 5.5.8 described


    For b), if $G$ contains a $k$ minor then there is a strict subgraph $G'' \preceq
    G$ containing a $K_{k-1}$ minor. Hence, by the choice of $k$, $G''$ contains $H$
    and $I$ as minors, contradicting the minimality of $G$. Thus, case $b$) is impossible
    as well.


