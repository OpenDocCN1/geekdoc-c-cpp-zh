  md: "# 22 Vince Bárány, Erich Grädel and Sasha Rubin\n\nVR with asynchronous product\
    \ and ground term rewriting\nGround term rewrite systems (GTRS) are a natural\
    \ generalisation of prefix-rewriting to trees. They are term rewrite systems given\
    \ by rewriting rules in which no variables occur. Tree automata are a special\
    \ case of GTRS [see [52]].\n\nExample 1.2.22 The rewrite rule $a \rightarrow f(a)$\
    \ confined to terms of the form $d(f^{(a)}, f^{(m)}(a))$ is a GTRS whose configuration\
    \ graph is isomorphic to the infinite square grid.\n\nWe have noted that prefix-recognizable\
    \ graphs are identical to $\\varepsilon$-closures of pushdown graphs. This correspondence\
    \ is achieved by generalising the simple prefix-rewriting rules of pushdown systems\
    \ of the form $v \rightarrow w$ where $v$ and $w$ are strings to replacement rules\
    \ $V \rightarrow W$ for given regular languages $V, W$. The latter rule allows\
    \ one to rewrite any prefix $v \\in V$ of a string by any word from $W$. Regular\
    \ Ground Term Rewrite Systems (RGTRS) generalise GTRS in the exact same manner:\
    \ simple ground rewrite rules $s \rightarrow t$ with ground terms $s, t$ are labelled\
    \ by 'rule schemes' $S \rightarrow T$ with regular sets of terms on both left\
    \ and right-hand side.\n\nLöding [99, 100] and Colcombet [48] studied transition\
    \ graphs of GTRS and RGTRS from a model-checking point of view. In Löding's work\
    \ vertices of the transition graph are terms reachable from an initial term, whereas\
    \ Colcombet considers all terms of a given type as vertices.\nThe VR-equations\
    \ defining PR graphs (1.3) easily generalise to VRA-equations defining of RGTRS\
    \ using the recursion scheme (1.4):\n\n```\n$X = \\vartheta(\\vartheta_i(\\bullet))\
    \ \\oplus \\vartheta_u(X \\otimes A) \\oplus \\vartheta_t(X \\otimes A) \\quad\
    \ (1.5)$\n```\n\nFor each rule $S_i \rightarrow T_j$ of the RGTRS we simulate\
    \ (frontier to root) tree automata colouring $S_i$ and $T_j$. Vertices of $X$\
    \ represent terms, so we call them vertexterms. A vertex-term is coloured by these\
