  md: '# Preface


    This volume is based on the satellite workshop on Finite and Algorithmic Model
    Theory that took place at the University of Durham, January 9–13, 2006, to inaugurate
    the scientific program Logic and Algorithms held at the Isaac Newton Institute
    for Mathematical Sciences during the first six months of 2006. The goal of the
    workshop was to explore the emerging and potential connections between finite
    and infinite model theory, and their applications to theoretical computer science.
    The primarily tutorial format introduced researchers and graduate students to
    a number of fundamental topics. The excellent quality of the tutorials suggested
    to the program organizers, Anuj Dawar and Moshe Vardi, that a volume based on
    the workshop presentations could serve as a valuable and lasting reference. They
    proposed this to the workshop scientific committee; this volume is the outcome.


    The Logic and Algorithms program focused on the connection between two chief concerns
    of theoretical computer science: (i) how to ensure and verify the correctness
    of computing systems; and (ii) how to measure the resources required for computations
    and ensure their efficiency. The two areas historically have interacted with each
    other, partly because of the divergent mathematical techniques they have employed.
    More recently, areas of research in which model-theoretic methods play a central
    role have reached across both sides of this divide. Results and techniques that
    have been developed found applications to fields such as database theory, complexity
    theory, and verification.


    Some historical remarks help situate the context for this volume. The study of
    the model-theoretic properties of finite structures initially as a branch of classical
    model theory, with its focus primarily on first-order logic. Beginning in the
    late 1980s, however, research concerning logics on finite structures diverged
    sharply from work in classical model theory. Classical model theory, with its
    emphasis on infinite structures, had made dramatic advances'
  merge: -1
  pgno: 7
- img_proc: true
  md: '# Preface


    both theoretically and in applications to other areas of mathematics. Work on
    finite structures focused on connections with discrete complexity theory and verification.
    Indeed, the connections between finite model theory, descriptive complexity theory,
    parameterized complexity, and state machine verification are now so strong that
    boundaries between these two facets are hard to distinguish.


    The methods employed in these facets of model theory grew apart during this period.
    Probabilistic techniques and machine simulations played a prominent role in the
    study of finite structures, and stand in contrast to the geometric, algebraic,
    and analytic methods that pervade classical (infinite) model theory. Although
    both classical and finite model theory with restricted classes of structures,
    the conditions by which such classes are delimited also have been quite different.
    Finite model theory and verification typically concentrate on classes linked to
    particular computing formalisms, or to which decomposition methods from finite
    graph theory can be applied. In contrast, infinite model theory usually places
    restrictions on combinatorial or geometric properties of the defined sets of structures.


    Yet, there are recent indications of a re-convergence of classical model theory
    and logical aspects of computer science. This has resulted both from the interest
    of computer scientists in new computing and specification models that make use
    of infinite structures, and from the development of powerful model-theoretic techniques
    that provide insight into finite structures. If there is an overarching theme,
    it is how various “tameness” hypotheses used to delimit classes of structures
    and logics have deeply impacted the study of those aspects of theoretical computer
    science in which model-theory naturally comes into play. The chapters that comprise
    this volume survey many of the common themes that have emerged and gained attention,
    and point to the significant potential for wider interaction.


    The chapter of Bárány, Grädel, and Rubin, Automata-based presentations of infinite
    structures develops what the authors algorithmic model theory. The authors direct
    their attention to the “tame” class of automatic structures, that have a presentation
    in a precise sense by automata operating on finite or infinite words or trees.
    The goal of this work is to extend algorithmic and logical methods from finite
    structures to presented infinite structures, which has been a focal point for
    research in computer science, combinatorics, and mathematical logic. This point
    of view allows structures to be viewed alternately from both a finite and infinite
    model theoretic perspective. The theory that has emerged use techniques from both
    classical model theory and theoretical computer science, and has found appealing
    applications to several areas, including database theory, complexity theory and
    verification.'
