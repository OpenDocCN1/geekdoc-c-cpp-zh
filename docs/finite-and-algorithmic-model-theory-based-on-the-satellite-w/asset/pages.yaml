  md: '# Definability in classes of finite structures


    **Theorem 4.6.1** (Ryten) *If C is any family of finite simple groups of fixed
    Lie type, then C is an asymptotic class.*


    The structure of asymptotic classes of groups is an attractive area of study.
    For groups in which definability is governed by definability in finite fields,
    or by definable subgroups subgroups of cartesian powers (as in one-based groups),
    one expects good control of definability. It is not clear whether ''asymptotic
    class'' is the optimal model theoretic assumption on a family of finite groups;
    often the same conclusions can be drawn assuming that all ultraproducts have supersimple
    finite rank. This is developed in [24].


    In developing a theory one wants, as far as possible, not to assume the classification
    of finite simple groups (CFSG). It would be wonderful to recover parts of the
    classification just from model hypotheses. As one step in this direction, Hrushovski
    has shown that any family of simple groups uniformly definable in finite fields
    is a family of (possibly twisted) Lie type [36, Theorem 9.2], and the same holds
    for groups uniformly definable in a family of the difference fields $C_{(m,n,p)}$
    (see [37], Theorem 1.8) – the proof is unpublished. In the same spirit, Theorem
    7.5.6 of [18] identifies, by model-theoretic hypotheses, a class of structures
    closely associated with finite simple groups.


    As mentioned in Example 4.3.5, the class of finite cyclic groups is a 1-dimensional
    asymptotic class. It should be feasible to describe all asymmetric classes of
    abelian groups. At higher levels of complexity – but within the class of soluble
    groups – very little is known, though one expects nilpotent and Borel subgroups
    of finite Chevalley groups to fall into asymptotic classes. We also mention the
    following [48, Proposition 3.11]. A pgroup is extraspecial if $G'' = Z(G) = \Phi(G)
    \cong C_p$. In particular, extraspecial groups are nilpotent of class 2.


    **Proposition 4.6.2** *If p is an odd prime, the class of finite extraspecial
    groups of exponent p is a 1-dimensional asymptotic class.*


    In fact, extraspecial groups of odd exponent p are envelopes of a smoothly approximable
    structure, the uniquely infinite extraspecial group of exponent p. This group
    has cyclic center, and the quotient by the center is an elementary abelian p-group,
    equipped with an alternating bilinear map to the center. Its theory is supersimple
    unstable.


