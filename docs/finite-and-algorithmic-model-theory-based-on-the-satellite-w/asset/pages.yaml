    \ = (n_i, n_{i+1})$ by $n:\n\n| $n_i$ | $n$ | $n_{i+1}$ |\n| --- | --- | --- |\n\
    | $< 2^{q-1}$ | $\\geqslant 2^{q-1}$ | one part small/ one large |\n| $n_i$ |\
