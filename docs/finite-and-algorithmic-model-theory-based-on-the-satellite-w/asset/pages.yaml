  md: '# Some connections between finite and infinite model theory 127


    There are natural examples of structures which have the finite submodel property
    but are not smoothly approximable, as such the random (bipartite) graph $G_{rg}$
    [24]. $G_{rg}$ can be defined as the Fraïissé limit of the class of all finite
    graphs, or alternatively one can give an explicit axiomatization of the complete
    theory of $G_{rg}$; see for instance [12, 20] for more about the random bipartite
    graph (which is obtained by considering the class of all finite graphs expanded
    with an equivalence relation with exactly two classes subject to the condition
    that edges may only occur between elements in different classes.) The random bipartite
    graph has the following model theoretic properties: it is $\omega$-categorical
    with elimination of quantifiers, (super)simple (but unstable) with SU-rank 1 and
    has trivial forking; for instance [20] and [32] for these model theoretic and
    stability/simplicity theoretic notions. The fact that $G_{rg}$ has SU-rank 1 implies
    that the algebraic closure operation ''acl'' forms a pregeometry on $G_{rg}$ (see
    [20]).


