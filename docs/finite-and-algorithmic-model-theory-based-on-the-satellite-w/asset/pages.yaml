  md: "# 3.5 Recursive bounds\n\nIn this section we derive results about recursive\
    \ upper bounds of the size of the\nleast model of $L^{\\omega\\omega}\text{-theories.\n\
    \nWe will use the theory of smoothly approximable structures which are pre-\n\
    sented in detail in [3]. Every structure is $\\omega$-categorical and $\\omega$-stable\
    \ is\nsmoothly approximable which essentially follows from [4], but also see [24].\n\
    One of several equivalent ways of defining 'smoothly approximable' is the\nfollowing:\n\
    \n**Definition 3.5.1** An $L$-structure $M$ is smoothly approximable if $M$ is\
    \ $\\omega$-ncategorical and if every $L$-sentence which is true in $M$ is true\
    \ in a finite\nsubstructure $N \\subseteq M$ such that\n\n+   (1) for every $\t\
    heta(\bar{x}) \\in L$ there is $\\chi(\bar{x}) \\in L$ such that\n$$\n\\{\bar{a}\
    \ \\in N : M \\models \theta(\bar{a}) = \\{\bar{a} \\in N : N \\models \\chi(\b\
    ar{a})\\},\n\n+   (2) for all $\bar{a}, \bar{b} \\in N$ of the same finite length\n\
    $$(N, \bar{a}) \\equiv_L (N, \bar{b}) \\iff (M, \bar{a}) \\equiv_L (M, \bar{b}).$$\n\
    \nWe derive our results from the following theorem which does not directly speak\n\
    of smoothly approximable structures.\n\n**Theorem 3.5.2** (Cherlin, Hrushovski\
    \ [3]) *We can effectively decide for a\ngiven sentence and $k < \\omega$ if that\
    \ sentence has a finite model $M$ such that\n|S_k^L(\\emptyset, M)| = k$.*\n\n\
    For purposes we now define a recursive function $f : \\omega^2 \\to \\omega$ as\
    \ follows:\n\nLet $f(n, k) = k$ if $n \\ge 2$ or $k \\ge 0$.\n\n+   \n- if such\
    \ a model of $\\varphi_i$ exists then search until we find $M_i$ and let\n$\\\
    ell_i = |M_i|$; otherwise $\\ell_i = 0$.\n- Then let $f(n, k) = \\max{\\ell_1,\
    \ \\dots, \\ell_m\\}$."
