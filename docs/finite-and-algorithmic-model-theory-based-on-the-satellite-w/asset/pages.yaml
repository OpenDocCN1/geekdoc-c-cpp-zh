  md: '# Automata-based presentations of infinite structures


    Although first-order queries on rational graphs are in general intractable there
    are some decidable subclasses.


    Moran observed that by a result of Eilenberg and Schützenberger, graphs defined
    by rational relations over a commutative monoid have a decidable first-order theory.
    In particular, the unary alphabet monoid structure is isomorphic to (N, +) where
    the rational graphs are first-order definable in (N, +) [105]. Similarly, rational
    graphs over (N, +)d are those having a d-dimensional first-order interpretation
    in (N, +).


    Carayol showed that on rational graphs that happen to be trees (which is an undecidable
    property) first-order logic is decidable [36, 106]. The decision method is based
    on locality of FO as formulated by Gaifman and uses a compositional technique.
    The authors also exhibit a rational graph that is finitely branching tree but
    is not finite-word automatic.


    # 1.3.6 Generalisations


    # Automata with oracle


    Consider an Δ^O of Δ := ([i]^*, suc_0, ..., suc_{i-1}) by a unary predicate O
    ∈ [i]*. MSO formula (with free variables) of the expanded structure corresponds
    to a tree automaton with oracle O. An automaton with oracle is one that, when
    u ∈ [i]*, can decide on its next state using the additional information of whether
    or not u ∈ O. Thus for automata working on infinite words/trees the oracle O is
    simply read as part of the input. In the case of automata working on finite words/trees,
    the oracle is scanned, and so the acceptance condition should be taken appropriately
    (see eg. Muller/Rabin).


    Call a set O decidable if MSO(Δ^O) is decidable, and weakly decidable if wMSO(Δ^O)
    is decidable. Early work on decidable objects used the contraction method to show
    certain automata on the line, such as [n! | n ∈ N], are decidable [67]. This was
    extended to the effectively infinite periodic words [38], which turns out capture
    all the unary predicates on the line [119, 120]. Nonetheless, it is still of interest
    to produce explicit examples of decidable oracles, for instance [38, 74, 75, 7].


