  md: '# Automata-based presentations of infinite structures 51


    # Number of definable subsets


    Various countable structures, such as the random graph, do not have word- or tree-automatic
    presentations [88, 63]. The approach to proving these facts has a model-theoretic
    flavour: for a purported automatic presentation, it involves counting the number
    of definable subsets of elements represented by words of bounded length.


    Consider the usual definition of a set defined by $\varphi$ with parameter $b$
    that remains fixed:


    ```

    $$\varphi(-, b)^{\mathfrak{A}} = \{a \in \mathfrak{A} \mid a \models \varphi(a,
    b)\$

    ```


    A finite set $X \subseteq A$ is *fully shattered* by $\varphi$ if the cardinality
    of the


    ```

    $$\varphi(-, b)^{\mathfrak{A}} \cap X \mid b \in A\$

    ```


    is as large as possible, $2^{|X|}$. For instance, Benedikt et al. [16] observe
    that in $S_{[2]}$ each of the sets $\{0, 0, \dots, 0^n\}$ can be fully shattered
    by the formula $\varphi(x, b) = \exists z(suc <_{prefix} b \wedge \varphi(z, x)).$


    By contrast, in automatic presentation with naming function $f$ and domain $D
    \subseteq \Sigma^*$, the image under $f$ of each $D_{\le n} := D \cap \Sigma^n$
    can only be linearly shattered by definable families.


    **Proposition 1.4.17** [[88, 63]] *In every automatic presentation of a structure
    $\mathfrak{A}$ with naming function $f$ and for every formula $\varphi$:*


    ```

    $|\varphi(-, b)^{\mathfrak{A}} \cap f(D_{\le n}) \mid b \in \mathfrak{A}\| = \O(|f(D_{\le
    n}))|\$

    ```


    As an application recall that the random graph is generalised by the property
    that every partition of a finite set $X$ of vertices into sets $U$ and $V$, there
    is a vertex $b$ connected to all elements of $U$ and to no element of $V$. In
    other words, finite set $X$ of vertices is fully shattered by the edge relation
    as the parameter $b$ is varied. So by Proposition 1.4.17 the random graph has
    no word-automatic presentation. Similar reasoning yields the following:


    **Proposition 1.4.18** [[88, 63]] *The following are not in S-AutStr: the random
    graph, the random partial order, the random $K_n$-free graph.*


    Using Theorem 1.3.25 one can establish non-automaticity of the random graph in
    a far more general sense.


    **Theorem 1.4.9** [[147]] *Neither the random graph nor the free monoid over two
    generators is finite-automatic with any oracle.*


    In fact neither is $\omega$-automatic with any oracle, as witnessed by the following
    theorem which follows from the proof of Theorem 1.3.31.'
