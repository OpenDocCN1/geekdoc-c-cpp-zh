  md: '# Automata-based presentations of infinite structures


    (i) If $p$ and $q$ are multiplicatively dependent then a relation $R \subseteq
    \mathbb{N}''$ is regular when coded in base $p$ iff it is regular when coded in
    base $q$.


    (ii) If $p$ and $q$ are multiplicatively independent then a relation $R \subseteq
