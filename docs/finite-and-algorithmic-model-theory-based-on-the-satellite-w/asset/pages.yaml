    # 3.2.2 Types


    The notion of a ‘type’ plays an important role in model theory. Here we will in
    particular interested in certain types which are restricted to formulas of some
    sublanguage of the first-order language L. We give some definitions with associated
    notation and then then state a few well-known results concerning types.


    **Definition 3.2.4** (i) Let $\Phi \subseteq L$, let $M$ be an $L$-structure and
    let $A \subseteq M$.


    +   (ii)


    > $Th_{\Phi}(M, A) = {\{\varphi(\bar{x}) \in \Phi, \bar{a} \in A, M \models \varphi(\bar{a})\}$


    and let $Th_{\Phi}(M) = Th_{\Phi}(M, \emptyset)$. So $Th_{\Phi}(M)$ is the set
    of sentences in $\Phi$ that are true in $M$.


    +   (iii) For a sequence of variables $\bar{x}$ we define


    > $$\Phi_{\bar{x}}(A) = {{\varphi(\bar{x}, \bar{y}) : \varphi(\bar{x}, \bar{y})
    \in \Phi, \bar{a} \in A\}$


    and $\Phi_{\bar{x}} = \Phi_{\bar{x}}(\emptyset)$.


    +   (iv) A $\Phi$-type over $A$ (with respect to $Th_{\Phi}(M, A)$) in the free
    variables $\bar{x}$ we set $p(\bar{x}) \subseteq \Phi_{\bar{x}}(A)$ such that
    $p(\bar{x}) \cup Th_{\Phi}(M, A)$ is consistent.


    +   (v) A $\Phi$-type over $A$ is a complete $\Phi$-type over $A$ whenever $\varphi(\bar{x},
    \bar{a}) \in \Phi$ then $p(\bar{x}) \in p(\bar{x})$ or $\negvarphi(\bar{x}, \bar{a})
    \in p(\bar{x})$.


    +   (vi) $S_{\Phi}(A)$ is the set of all complete $\Phi$-types over $A$ (with
    respect to $Th_{\Phi}(M, A)$) in the free variables $v_1, \dots, v_m$. If $\Phi
    = L$ then we may omit it.


    +   (vii) We write $S_{\Phi}(A, M)$ instead of $S_{\Phi}(A)$.


    +   (viii) For a complete $L^7$-theory $T$ we define $S_{\Phi}^T(M) = S_{\Phi}^T(\emptyset,
    M)$, where $M$ is any model of $T$ (so $Th_L(M, \emptyset) = T$). By Lemma 1.2
    in [9] this definition does not depend on the choice of the model $M$ of $T$.


