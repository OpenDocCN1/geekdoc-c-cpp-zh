    # 2.11 Deciding termination of transitive-closure logic expressions


    The results in this section can be found in (Geerts and Kuijpers, 2005).


    From the definition in Section 2.8, it is clear that the evaluation of queries
    expressed in transitive-closure logic or without stop conditions may be non-terminating.


    **Some examples** As we have seen before, when we evaluate the transitive closure,
    or the expression $[TC_{cy} S(x,y)](s,t)$, on the spatial dataset $A = \{(x,y)
    \mid y = 2x\}$, we get a growing number of lines (which is illustrated in Figure
    2.15). In other words, this is a non-terminating computation.


    Even if we modify the function $y = 2x$, as shown by the thick line in Figure
    2.19, that is, if we bound its image, the computation of the transitive closure
    remains non-terminating (as illustrated in Figure 2.19).'
