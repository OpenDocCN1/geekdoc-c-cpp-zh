    evaluation problems for logical systems has intensively studied in database theory,
    where first-order logic is the logical foundation of the query language SQL. A
    common assumption in database theory is that the size of the query is relatively
    small compared to the size of the database. Hence, giving the same weight to the
    database and the query may not truthfully reflect the complexity of query evaluation.
    It has become standard to distinguish between three ways of measuring the complexity
    of logical systems:


    +   - **combined complexity**: given a structure $A$ and a formula $\varphi$ as
    input, what is the complexity of deciding $A \models \varphi$ measured in the
    size of the structure and the size of the formula?

    - **data complexity**: fix a formula $\varphi$. Given a structure $A$ as input,
    what is the complexity of deciding $A \models \varphi$ measured in the size of
    the structure only?

    - **expression complexity**: fix a structure $A$. Given a formula $\varphi$ as
    input, what is the complexity of deciding $A \models \varphi$ measured in the
    size of the formula only?


    As seen in Lemma 5.2.8, the combined complexity of first-order logic is PSPACE-complete.
    Furthermore, the proof shows that even the expression complexity is PSPACE-complete,
    as long as we fix a structure with at least two elements. On the other hand, it
    is easily seen that for a fixed formula $\varphi$, whether $A \models \varphi$
    can be done in time $|A|^{O(\varphi)}$. Hence, the data complexity of first-order
    logic is in PRIME.


    Beyond first-order logic, logic fragments of FO have been studied in database
    theory and finite model theory. For instance, the complexity of the existential
    conjunctive fragment of first-order logic – known as conjunctive queries in database
    theory – NP-complete. And if we consider the bounded variable fragment of first-order
    logic, the combined complexity is PTIME [89].


