  md: "Unary automatic structures form a very restricted subclass of VR-equational\
    \ structures and have a decidable MSO-theory. Using pumping arguments we can show\
    \ Presburger arithmetic $(\\mathbb{N}, +)$ has no p-automatic presentation [20,\
    \ 121]. On the other hand, the infinite grid is p-automatic but not unary automatic.\
    \ Thus we have\n\n```\n1-AutStr $\\subseteq$ P-AutStr $\\subseteq$ S-AutStr\n\
    ```\n\nThe expansion of $\\mathbb{M}$ with the successor function `suc` and a\
    \ constant for 0 admits quantifier elimination. Every p-automatic structure can\
    \ be interpreted in $(\\mathbb{N}, 0, \text{suc}, <, [\\equiv_{(\\mod m)}m>1])$\
    \ using quantifier-free formulas.\n\nEvery p-automatic structure inherits the\
    \ PSpace upper-bound on the complexity of its first-order theory from $\\mathbb{M}$.\
    \ This is as low as possible since FO-checking is PSpace-hard for any structure\
    \ with at least two elements. Even the simplest iteration of FO leads to undecidability.\
    \ For every $k$-counter machine it is straightforward to construct a p-automatic\
    \ configuration of its graph where each $(q,n_1,...,n_k)$ is represented by the\
    \ word $qc^{n_1}...c^{n_k}$. It follows that the first-order theory with reachability\
    \ FO[R] of a p-automatic structure is undecidable in general. In comparison, unary\
    \ automatic structures have a decidable MSO-theory, the FO(DTC) theory of $(\\\
    mathbb{N}, \text{succ})$ interprets first-order arithmetic and is therefore highly\
    \ undecidable [20].\n\nObserve, that graphs having rational presentation over\
    \ a finitely generated commutative monoid (cf. Section 1.3.5) can be seen as analogues\
    \ of p-automatic graphs. Indeed, every element is represented by some word $g_1^{r_1}g_2^{r_2}...$\
    \ over the generators.\n\n# Finite-rank tree-automatic presentations\n\nThe analogue\
    \ of p-automatic to tree-automatic structures is restricting to presentations\
    \ involving trees of bounded rank. Intuitively the rank of a tree corresponds\
    \ to its branching degree (which can be measured in terms of the Cantor-Bendixson\
    \ rank).\n\nRecall a $\\Sigma$-labelled tree $T$ is a function from a prefix-closed\
    \ subset of $[n]^*$ to $\\Sigma$. We say that $T$ has rank $k$ if its domain has\
    \ polynomial density of at most $k$.\n\nA finite-tree automatic presentation is\
    \ called of rank $k$ if for some regular language $D$ of polynomial density of\
    \ at most $k$ the domain of every tree in the presentation is a subset of $D$.\
    \ Collectively we speak of bounded-rank tree-automatic presentations. The class\
    \ of structures with rank k presentations is denoted k-T-AutStr.\n\n**Example\
    \ 1.3.29** $\\omega^k$ has a rank $k+1$ tree-automatic presentation."
