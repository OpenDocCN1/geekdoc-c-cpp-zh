  md: '# # 3

    Some connections between finite and infinite model theory


    VERA KOPONEN^a


    # ## 3.1 Introduction


    Most of the work in model theory has, so far, considered infinite structures and
    the methods and results that have been worked out in this context cannot usually
    be transferred to the study of finite structures in an obvious way. In addition,
    some basic results from infinite model theory fail within the context of finite
    models. The theory about finite structures has largely developed in connection
    with theoretical computer science, in particular complexity theory [12]. The question
    arises whether these two “worlds”, the study of infinite structures and the study
    of finite structures, can be woven together in some way and enrich each other.
    In particular, one may ask if it is possible to adapt notions and methods which
    have played an important role in infinite model theory to the context of finite
    structures, and in this we get better understanding of fairly large and sufficiently
    well-behaved classes of finite structures.


    If we are to study structures in relation to some formal language, then the question
    arises which one to choose. Most of infinite model theory considers first-order
    logic. Within finite model theory various restrictions and extensions of first-order
    logic have been considered, since first-order logic may be considered as both
    too strong and too weak (in different senses) for the study of finite structures.
    A reasonable candidate for studying finite structures, with a viewpoint from infinite
    model theory, is the language $L^n$, first-order logic $L$ restricted to formulas
    in which at most $n$ variables occur, whether free or bound. Theories consisting
    of only $L^n$-formulas, even those which are “complete” in $L^n$, may have both
    finite and infinite models, or only finite models. The language $L^n$ has the
    nice properties of being closed under subformulas, quantification and negation.
    Also, there is


