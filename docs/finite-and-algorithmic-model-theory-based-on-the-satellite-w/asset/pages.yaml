    \ i_m\\} \\subseteq \\lambda$,\n\n> $M \\equiv \\varphi(a_1, \\dots, a_m)$ if\
    \ and only if $N \\equiv \\varphi(b_1, \\dots, b_m)$.\n\n+   (ii) function $f\
    \ : A \\to N$, where $A \\subseteq M$, is called a $\\Phi$-elementary embedding\
