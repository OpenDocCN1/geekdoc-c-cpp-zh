  md: "216\n\nStephan Kreitzer\n\n# 5.4.2 Rank-Width\n\nIn this section we define\
    \ an alternative characterisation of graph classes of bounded clique-width – the\
    \ *rank-width* of a graph. Rank-width is a special case of abstract *branch-decompositions*\
    \ of connectivity functions which we present first. Another special case of this\
    \ abstract notion is the *branch-width of graphs*, a notion that is equivalent\
    \ up to a small constant factor to tree-width.\n\n# Branch-Decompositions of Connectivity\
    \ Functions\n\nLet $M$ be a non-empty set and $f : 2^M \\to \\mathbb{R}$ be a\
    \ function. A branch-decomposition of the pair $(M, f)$ is a pair $(T, \beta)$\
    \ consisting of a binary tree $T$ and a bijection $\beta : L(T) \\to M$ from the\
    \ set $L(T)$ of leaves of $T$ to $M$. We inductively define a map $\beta^* : V(T)\
    \ \\to 2^M$ by setting\n\n```\n$$\\beta^*(t) := \\begin{cases} \\beta(t) & \\\
    text{if } t \\text{ is a leaf} \\ \\beta^*(t_1) \\cup \\beta^*(t_2) & \\text{if\
    \ } t \\text{ is an inner node with successors } t_1 \\cup t_2. \\end{cases}$\n\
    ```\n\nThe width of $(T, \beta)$ is defined as $\\max\\{\beta^*(t) : t \\in V(T)\\\
    }$ and the branch-width of $(M, f)$ is defined as the minimum width of any of\
    \ its branch-decompositions. If $M$ is empty, we define the branch-width of $M$\
    \ to be $f(\\varnothing)$. Note that in this case, $(M, f)$ does not have a branch-decomposition,\
    \ as a tree, being connected, cannot be.\n\nOf particular interest are branch-decompositions\
    \ of connectivity functions which are integer valued, symmetric and submodular.\
    \ A function $f : 2^M \\to \\mathbb{R}$ is symmetric if $f(A) = f(M \\setminus\
    \ A)$ for all $A \\subseteq M$ and it is submodular if $f(A) \\geq f(A \\cap B)+f(A\
    \ \\cup B)$ for all $A, B \\subseteq M$. Submodular and symmetric connectivity\
    \ functions are algorithmically well-behaved. Note that if $f$ is symmetric we\
    \ can take the tree $T$ of a branch-decomposition of $(M, f)$ to be undirected\
    \ and cubic (i.e. every vertex has degree 1 or 3). We will occasionally do so,\
    \ for instance in Figure 5.7.\n\nIn [71], Ohm and Seymour showed that optimal\
    \ branch-decompositions of submodular, symmetric, and integer valued connectivity\
    \ functions can be approximated up to a factor of 3 by an fpt-algorithm. Before\
    \ we define how the input to such an algorithm is represented. Let $M$ be a class\
    \ of pairs $(M, f)$, where $f : 2^M \\to \\mathbb{N}$ is symmetric and submodular.\
    \ $M$ is a tractable class of connectivity functions if there is a representation\
    \ of the pairs $(M, f) \\in M$ such that, given the representation of a pair $(M,\
    \ f)$, the values $f(A)$ can be computed in polynomial time for all $A \\subseteq\
    \ M$."
