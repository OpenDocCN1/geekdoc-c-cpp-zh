  md: '# Preface


    ix


    Classical model theory by large concentrates on the analysis of the first-order
    definable sets over a structure, that is, those of n-tuples of the universe whose
    definition is given by a first-order formula. This analysis has predominantly
    taken two forms. The first is based on the "structural complexity" of the formula,
    e.g., the number of alternations of blocks of existential and universal quantifiers
    appearing in prenex normal form. This theme is best illustrated by quantifier
    elimination, in which definable sets over a structure are shown to have quantifier-free
    definitions. The second involves assigning a dimension (with a corresponding notion
    of independence) to the definable sets which is combinatorially, algebraically,
    or geometrically motivated. Stability theory, is perhaps the most widely known
    and longest-studied exemplar, its development traceable to Morley''s seminal work
    in the 1960s and to Shelah''s work more recently, o-minimality, and in particular
    its focus on o-minimal expansions of the ordered field of real numbers, provides
    another important class of examples. The imposition of "tameness" assumptions
    in classical model theory such as stability and o-minimality often verified in
    examples by quantifier elimination make the analysis of structures satisfying
    these hypotheses not only tractable but also amenable to applications outside
    of logic.


    Tarski''s quantifier-elimination for real-fields which equates the first-order
    definable sets over the field of real numbers with the semialgebraic sets, has
    long proved a fertile ground for framing and addressing computational issues.
    Kuijpers and van den Welche, in their chapter, Logical aspects of spatial databases,
    model spatial data via semialgebraic subsets of n-dimensional Euclidean space,
    and investigate the expressive power of several logic-based languages to query
    these databases. They first characterize the topological properties of planar
    spatial databases that are first-order expressible over the usual language for
    the ordered field of real numbers - of interest from the point of view of geographical
    information systems, for example - terms of the language "cone logic". The second
    half of their chapter deals with query languages that extend first-order logic
    over the real field by some form of recursion, including spatial Datalog, and
    first-order logic extended with a while loop or with a transitive closure operator.


    Kpopen, in her chapter, Connections between finite and infinite model theory,
    as well as other properties and techniques from classical model theory such as
    smooth approximation, can be imported successfully into the study of finite structures
    by restricting to bounded variable logic, that is, first-order logic under the
    restriction that is'
