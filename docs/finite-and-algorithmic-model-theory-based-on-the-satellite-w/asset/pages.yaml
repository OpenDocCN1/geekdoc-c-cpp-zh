    efficiently which in general are NP-hard. A key step in designing algorithms is
    to compute a tree-decomposition of the input graph. Unfortunately, Arnberg, Corneil,
    and Proskrowski showed that deciding the tree-width of a graph is NP-complete.


    **Theorem 5.3.16** (Arnborg, Corneil, Proskrowski [3]) The following problem is
    NP-complete.


    | Tree-Width |

    | Input: Graph G, k ∈ N |

    | Problem: tw(G) = k |


    However, the problem becomes intractable if the tree-width is not a part of the
    input, i.e. if we are given a constant over the tree-width of graphs we are dealing
    with.


    A class C of graphs has bounded tree-width, if there is a k ∈ N that bounded tw(G)
    ≤ k for all G ∈ C. In [6] Bodlaender proved that for any class of graphs tree-width
    of bounded tree-width-decompositions of minimal width can be computed in linear
    time.


    **Theorem 5.3.17** (Bodlaender [6]) There is an algorithm, which given a graph
    as input, constructs a tree-decomposition of G of width k := tw(G) in time


    2^{O(k)} |G|


    The algorithm by Bodlaender is primarily of theoretical interest. We will see
    later that many NP-complete problems can be solved efficiently on graph classes
    of bounded tree-width. For these algorithms to work in linear time, it is essential
    to compute tree-decompositions in linear time as well. From a practical point
    of view, however, the cubic dependence on the tree-width in the exponent and the
    complexity of the algorithm itself poses a serious problem. But there are other
    simpler algorithms with quadratic or cubic running time in the order of the graph
    but only exponential dependence on the tree-width which are practically feasible
    for small values of k.


