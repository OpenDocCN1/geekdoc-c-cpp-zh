    as a generalisation of context-free graphs and showed that they are MSO-interpretable
    in the full binary tree and have a decidable MSO-theory [42].


    **Definition 1.2.2** (Prefix-recognisable relations) Let $\Sigma$ be a finite
    alphabet. The set PR($\Sigma$) of prefix-recognisable relations over $\Sigma^*$
    is the smallest set of relations such that


    +   - every regular $L \in \Sigma^*$ is a prefix-recognisable relation;

    - if $R, S \in PR$ ($r$ and $s$) and $\overline{R}$ is regular when $L \cdot (R
