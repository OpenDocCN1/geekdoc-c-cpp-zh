  md: "# Logical aspects of spatial databases 103\n\nThe function of Figure 2.15 is\
    \ not terminating, but the one of Figure 2.20 is. We have the following, for what\
    \ follows, important result.\n\n**Theorem 2.17** *There is a procedure on input\
    \ a continuous semi-algebraic function $f : \\mathbb{R} \to \\mathbb{R}$ decides\
    \ whether it is terminating. Furthermore, this decision procedure is expressible\
    \ in first-order logic over reals.*\n\nTo get this result, we need some terminology\
    \ and lemmas. Let $f : \\mathbb{R} \to \\mathbb{R}$ be a continuous function.\
    \ Let $x \\in \\mathbb{R}$ is a *periodic point* of $f$ if $f^d(x) = x$ for some\
    \ $d \\ge 1$ and the smallest $d$ is the *period* of $x$. Let $Per(f)$ denote\
    \ the set of periodic points of $f$.\n\nWe have the following properties.\n\n\
    **Lemma 2.18** *If $f$ is continuous and terminating, then $Per(f) = f^k(\\mathbb{R})$\
    \ (for some $k$) is non-empty, connected and closed. Furthermore, $Per(f) = \\\
    {x \\in \\mathbb{R} \\mid f^2(x) = x\\}$.*\n\nA result from Sharkovskii's from\
    \ 1964 implies that if $f$ is continuous and terminating, only 1, 2, 4, $\\dots,\
    \ 2^d$ can appear for some integer value $d \\ge 1$. The last part of the lemma\
    \ is more specific.\n\nSo, we can conclude the following.\n\n**Corollary 4** *If\
    \ $f$ is continuous and terminating, then $f$ can only have periodic points with\
    \ periods 1 and 2.*\n\nWe give the following crucial lemma without proof (see\
    \ (Geerts and Kuijpers, 2005) for details).\n\n**Lemma 2.19** *There is an first-order\
    \ sentence that expresses whether a continuous semi-algebraic function $f : \\\
    mathbb{R} \to \\mathbb{R}$ is nilpotent.*\n\nWe remark that the proof of the correctness\
    \ of the first-order sentence of Lemma 2.19, given in (Geerts and Kuijpers, 2005),\
    \ relies on the Bolzano-Weierstrass theorem and therefore does not generalize\
    \ to arbitrary real closed fields.\n\nUsing the above results, we obtain the following\
    \ procedure to decide termination of a function $f:\\mathbb{R}\to\\mathbb{R}$.\n\
    \nIn the following algorithm, $\tilde{f}$ is obtained from $f$ by contracting\
    \ the part of $f$ that consists of points of period 1 or 2, to one point. This\
    \ is illustrated in Figure 2.21."
