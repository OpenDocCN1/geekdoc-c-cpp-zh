    \ 3.4.8** Let $T$ be an $L^n$-theory. $T$ has the strong $L^n$-amalgamation property\
    \ over countable models if, whenever\n\n$M_0 \\models T, M_0 \\equiv_{L^n} M_1$,\
    \ where $M_i$ is countable for $i=1, 2, \tilde{a}_1 \\in M_1, \tilde{a}_2 \\in\
