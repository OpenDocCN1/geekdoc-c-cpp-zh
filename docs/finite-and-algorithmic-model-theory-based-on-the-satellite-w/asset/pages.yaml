  md: '# Algorithmic meta-theorems


    **Conjecture 5.4.21 (Seese''s conjecture)** Every class $\mathcal{C}$ of structures
    with decidable MSO$_1$-theory has bounded clique-width.


    This conjecture can be rephased in terms of MSO-interpretations using the following
    result due to Engelfriet and V. van Oostrom and also Courcelle and Engelfriet.


    **Lemma 5.4.22** ([39, 16]) A class of graphs has bounded clique-width if, and
    only if, it is interpretable in the class of coloured trees for some suitable
    set of colours.


    Note that these papers use so-called MSO-transdu instead of interpretations. An
    MSO-transduction is essentially the same as an interpretation except that the
    formulas are allowed to have free second-order variables, the parameters. A graph
    is then interpreted in a tree if there is an interpretation of the parameters
    by sets of tree-nodes satisfying the formulas in the MSOtransduction. Hence, the
    parameters play exactly the same role as the colours of the trees we use. As the
    colours/parameters in our context are the symbols of k-expressions, we prefer
    to have them as labels of the syntax trees rather than free variables in the interpretation.


    Using the previous line we can rephrase Seese''s conjecture as follows:


    **Conjecture 5.4.23 (Seese''s conjecture)** Every class $\mathcal{C}$ of structures
    with decidable MSO$_1$-theory is MSO-interpretable in the class of coloured trees
    for some set of colours.


    In [20], Courcelle and Oum prove the following weakening of the conjecture. Let
    $C_2$MSO be the extension of MSO by atoms EVEN(X), where $X$ is a monadic second-order
    variable, stating that the interpretation of $X$ has even cardinality. Hence,
    $C_2$MSO extends MSO by counting modulo 2.


    **Theorem 5.4.24** (Courcelle, Oum) Every class of graphs with a decidable $C_2$MSO
    theory has bounded clique-width, i.e. is interpretable in a class of coloured
    trees.


    Note that the theorem is weaker than Seese''s conjecture as there are less classes
    of graphs whose $C_2$MSO is decidable than there are classes of graphs with a
    decidable MSO-theory.


