    We therefore propose a research program which aims at providing a refined analysis
    of the complexity of logical formula evaluation with respect to specific classes
    of structures. More precisely, for the most commonly used logics we aim at identifying
    a property that precisely captures tractability of the logic in the sense that
    the logic is tractable on a class of structures if, and only if, the class has
    this property.


    Such a classification would give completely new insights into the complexity of
    the logics and would provide researchers designing query or specification languages
    based on these logics with valuable information for designing languages tailored
    towards their specific application areas.


    It may not be possible to find such a property that exactly characterizes tractability
    of all classes of structures and we may need to further restrict the admissible
    classes of structures, such as to closed under substructures. For instance, for
    first-order logic we conjecture that model-checking of FO on a class of structures
    under substructures is tractable if, and only if, the class is nowhere dense (see
    below).


    There are two different, and complementary aspects to the results we envisage.
    The first aspect is tractability results as we have presented them in the previous
    sections. The other aspect is intractability results where we show that evaluation
    of formulas is hard whenever a class of structures does not have a particular
    property. In this context, this aspect has virtually not been studied in the literature
    before. We will present some recent and new intractability results in the following
    subsections.


