    **Lemma 5.4.3** Every finite graph can be generated$^4$ by a $k$-expression for
    some $k \in \mathbb{N}$.


    Hence, the following concepts are well defined.


    **Definition 5.4.4** The clique-width $cw(G)$ of a graph $G$ is defined as the
    least $k \in \mathbb{N}$ such that $G$ can be generated by a $k$-expression. A
    class $C$ of graphs has bounded clique-width if there is a $k \in \mathbb{N}$
    such that $cw(G) \leq k$ for all $G \in C$.


    We give a few more examples.


    +   **Example 5.4.5** 1. The class of cliques has clique-width 2. (Clique-width
    2, as the operator requires $i \neq 1$ to avoid self-loops).

    2. The class of all trees has clique-width 3. By induction on the height of the
    trees we show that for each tree $T$ there is a 3-expression generating this tree
    so that the root is coloured by the colour 1 and all other nodes are coloured
    by 0. This is trivial for trees of height 0. Suppose $T$ is a tree of height $n+1$
    with root $r$ and successors $v_1, \dots, v_k$ of $r$. For $1 \leq i \leq k$ let
    $\varphi_i$ be a 3-expression generating the subtree of $T$ rooted at $v_i$. Then
    $T$ is generated by the expression

    $rename_{2\to1}rename_{1\to0}edge_{2\to1}(2 \oplus \varphi_1 \oplus \dots \oplus
    \varphi_k)$.


    +   3. It can be shown that the clique-width of the $(n \times n)$-grid is $\Omega(n)$.
    (This follows, for instance, from Theorem 5.4.7).


    The next theorem by Wanke and Courcelle and Oarius relates clique-width to tree-width.


    **Theorem 5.4.6** ([91, 19]) Every graph of tree-width at most $k$ has clique-width
    at most $2^{k+1}+1$.


    As the examples above show, there is no hope to bound the tree-width of a graph
    in terms of its clique-width. Hence, clique-width is more general than tree-width
    in the sense that more graph classes have bounded clique-width than bounded tree-width.
    Gurski and Wanke [55] established the following relation between clique-width
    and tree-width in terms of bipartite subgraphs.


