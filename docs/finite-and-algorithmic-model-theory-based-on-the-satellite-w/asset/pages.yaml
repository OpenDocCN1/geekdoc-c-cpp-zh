    # 5.8.3 Limits to First-Order Model-Checking


    In this section we will summarise some intractability results for first-order
    logic. As before, ideally we would like to completely classify the classes $C$
    of structures where MC(FO, $C$) is FFT and where it is not. However, with the
    graph properties studied so far, it is unlikely that we can fully explore tractability
    for first-order model-checking as FO-model-checking is preserved under interpretations
    whereas properties such as excluding a minor or bounded tree-width.


    **Lemma 5.8.7** If $C$ is a class of graphs that MC(FO, $C$) is fixed-parameter
    tractable and $\mathcal{D}$ is a class of graphs first-order interpretable in
    $C$ as described in Section 5.2.3, then first-order model-checking is fixed-parameter
    tractable over $\mathcal{D}$.


    Hence, if there is a graph property that precisely describes when model-checking
    is tractable, it has to be closed under edge-complementation or more generally
    under first-order interpretations. Note that the analogous result does not hold
    for MSO$_2$, as in general MSO$_2$ formulas on a class cannot be rewritten to
    work on the complement graph instead.


    In studying further classes of graphs obtained from graph invariants it may be
    beneficial to consider constructions that allow us to construct new classes $C$
    of graphs with tractable model-checking from other known classes of graphs. For
    instance, one could try to generalise the constructions using tree-decompositions
    over classes of graphs. If $C$ is a class of graphs for which the appropriate
    version of Lemma 5.7.13 holds, then first-order model-checking is also tractable
    on the class of graphs that can efficiently be tree-composed over $C$. We refrain
