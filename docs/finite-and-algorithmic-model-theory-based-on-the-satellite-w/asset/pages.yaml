  md: "# Fragments of FO and special classes of structures 289\n\nhand, is static,\
    \ corresponding to an invariant that needs to be maintained indefinitely (this\
    \ is the classical notion of back-and-forth equivalence or partial isomorphism\
    \ in model theory, for instance [30]).\n\n**Example 1: finite linear orderings**\
    \ The first example illustrating the usefulness of the first-order Ehrenfeucht-Fraïss\
    \ game in almost any textbook presentation concerns the limitations of FO in expressing\
    \ finite linear orderings (or discrete linear orderings more generally). We just\
    \ state the following well-known result in order to stress its technical affinity\
    \ based to be considered.\n\n**Lemma 6.2.3** Consider two linear orderings $\\\
    mathcal{A} = (\\mathbb{N}, <)[0, m]$ and $\\mathcal{A}' = (\\mathbb{N}, <)[0,\
    \ m']$ with assignments to tuples\n\n$\beta = (n_0, \\dots, n_k)$ where $n_0 <\
    \ n_1 < \\dots < n_{k-1} < n_k = m$ and\nbeta' = (n'_0, \\dots, n'_k)$ where $n'_0\
    \ < n'_1 < \\dots < n'_{k-1} < n'_k = m'$.\n\nWe write $d_i := n_{i+1} - n_i$\
    \ and $d'_i := n'_{i+1} - n'_i$ for distances between consecutive points in these\
    \ assignments. Then the following are equivalent for any $q \\ge 1$:\n\n+   (i)\
    \ $\\mathcal{A}, \beta = \\mathcal{A}', \beta'$\n(ii) for $0 \\le i < k$: $d_i\
    \ = d'_i$ or $d_i, d'_i \\ge 2^q$.\n\nFor the naked finite linear orderings one\
    \ obtains\n\n$\\mathcal{A} \\equiv \\mathcal{A}' \\longleftrightarrow |\\mathcal{A}|\
    \ = |\\mathcal{A}'|$ or $|\\mathcal{A}'| \\ge 2^q - 1$.\n\nFor (ii) $\\Rightarrow\
    \ (i)$ in the lemma, the first round in a game played from a position satisfying\
    \ the distance constraints (ii) with critical distance $2^q$. It suffices to exhibit\
    \ a strategy for player II to respond to any challenge by player I in such a manner\
    \ that the resulting position satisfies the analogous distance constraints (ii),\
    \ but now with critical distance $2^{q-1}$ instead of $2^q$. W.o.g. we may assume\
    \ that **I extends** the configuration $\\beta$ by some new element $n \\in I_i\
