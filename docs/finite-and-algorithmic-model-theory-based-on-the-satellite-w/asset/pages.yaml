    We begin with the definition of a robust class, and some initial observations,
    working over an arbitrary – and, unless otherwise specified, finite –first-order
    language L. Examples are discussed in the section, and a robust approximation
    to the additive group of rational numbers is established in Section 4.9.


    **Definition 4.7.1** A sequence $C = (M_i : i \in N)$ of finite $L$-structures
    forms a chain of structures if $M_i \subseteq M_{i+1}$ (as a substructure) for
    each $i \in N$. A chain is to be robust if for each $n \in N$ and $L$-formula
    $\varphi(x_1, \dots, x_n)$ there is a function $f = \varphi : N \to N$ such that
    for each $i \in N$ and $a_1, \dots, a_n \in M_i$, and for every $j \geq f(i)$,


    ```

    $M_{f(i)} = \varphi(\tilde{a}) \text{ if and only if } M_j = \varphi(\tilde{a}).$

    ```


    If $C$ is robust and $\tilde{a}$ are as above, we always assume that $C \models
    \varphi(\tilde{a})$ if $M_j = \varphi(\tilde{a})$ for sufficiently large $j$.


    **Remark 4.7.2** (a) In follows, we always assume that $f_{\varphi}$ grows as
    slowly as possible subject to witnessing robustness. Thus, $f_{\varphi}$ is uniquely
    determined by $C$.


