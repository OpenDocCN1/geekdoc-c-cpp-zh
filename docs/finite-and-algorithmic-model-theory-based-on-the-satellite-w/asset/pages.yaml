    # 1.2.4 Introducing products


    There is a connection between the internal presentations of graphs so far and
    the graph operations used in the corresponding equational framework. Pushdown
    stacks are naturally represented as strings. The set of strings over some alphabet
    can be turned into model as an algebra of terms built with unary functions, one
    for each letter of the alphabet. Strings correspond to terms and letters to unary
    functions. In functional programming terminology the abstract data type of, say
    binary strings has the recursive type definition


    > $\mathcal{T} = \perp \mid \ 0(\mathcal{T}) \\mid \ 1(\mathcal{T}) \quad (1.2)$


    Here the letters 0 and 1 are seen as type constructors of type $\mathcal{T}$ and
    the empty string $\perp$ is a constant type constructor. The set of finite strings
    is the least fixed-point solution of this equation.


    Automata operating on terms of type $\mathcal{T}$ can be viewed as functions mapping
    terms to states. Moreover these functions are defined according to structural
    recursion. Analogously, recursion (fix-point equations) in an algebra of graph
    operations transform automata-internal presentations of a graph into equational
    specifications. We can use the recursion scheme associated to the type definition
    (1.2) to define any PR-graph by a VR equation extending the type definition. For
    instance, the graph of the lexicographic order from Example 1.2.3 satisfies the
    following equation


