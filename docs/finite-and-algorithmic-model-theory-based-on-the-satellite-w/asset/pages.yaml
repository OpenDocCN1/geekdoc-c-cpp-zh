    \nWe briefly recall the definition of generalised quantifiers as introduced by\
    \ Lindström.\n\n**Definition 1.4.1** Fix a finite signature $\tau = (R_i)_{i \\\
    leq k}$, where $R_i$ has associated arity $r_i$. A quantifier $Q$ is a class of\
    \ $\tau$-structures under isomorphism. Let $\\sigma$ be another signature. Given\
    \ $\\sigma$-formulas $\\Psi_i(\\vec{x}, \\vec{a})$ with $|\\vec{x}| = r_i$ ($i\
    \ \\leq k$), the syntax $Q\\vec{x}_1, \\dots, \\vec{x}_n(\\Psi_1, \\dots, \\Psi_k)$\
    \ has the following meaning on a $\\sigma$-structure $\\mathcal{A}$:\n\nmathcal{A},\
    \ \bar{a}) \\models Q\bar{x}_1, \\dots, \bar{x}_n(\\Psi_1, \\dots, \\Psi_k) \\\
    text{ iff } \\Psi_1^A(\bar{a}), \\dots, \\Psi_k^A(\\mathcal{a}, \bar{a}) \\in\
    \ Q$,\n\nwhere $\\Psi_i^A(\bar{a})$ is the relation defined in $\\mathcal{A}$\
    \ with parameters $\bar{a}$. The *arity* of a quantifier is the maximum of the\
    \ $r_i$. A quantifier is *n*-ary if its arity is at most $n$.\n\nThe extension\
    \ of first-order logic by a collection $Q$ of generalised quantifiers will be\
    \ denoted $[Q]$.\n\n+   **Examples 1.4.2** (i) The unary quantifier $(A; X) \\\
    mid \\emptyset \neq X \\subset A\\}$ is ‘there exists’.\n(ii) The unary quantifier\
    \ ‘there exist infinitely’, written $\\exists^\\infty$, is the class of structures\
    \ $(A; X)$ where $X$ is an infinite subset of $A$.\n(iii) The unary *modulo quantifier*\
    \ ‘there exist $k$ modulo $m$ many’ (here $0 \\leq k < m$), written $\\exists^{k,m}$,\
    \ is the class of structures $(A; X)$ where $X$ contains $k$ modulo $m$ many elements.\
    \ Write $\\exists^{mod}$ for the collection of modulo quantifiers.\n(iv) The unary\
    \ *Härtig quantifier* is the class of structures $(A; P, Q)$ where $P, Q \\in\
    \ A$ and $|P|=|Q|$.\n(v) Every set $C \\subset (N \\cup \\{\\infty\\})$ induces\
