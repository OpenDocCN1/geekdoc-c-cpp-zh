    \ on a given input database.\n\nWithout stop conditions, we have decidability,\
    \ however.\n\n**Theorem 2.20** It is decidable whether a formula in CF-transitive-closure\
    \ logic (without stop conditions), restricted to binary relations, terminates\
    \ on a given input database. *Moreover*, this decision procedure is expressible\
    \ in this language.\n\nSo, for every formula $[TC_{\tau;xy} \\psi(x, y)](s, t)$\
    \ in CF-transitive-closure logic (without stop conditions), restricted to binary\
    \ relations, there is a formula $\tau_\\psi$ that depends on the input! We call\
    \ $\tau_\\psi$ the termination guard of the given input database (also the formula\
    \ $[TC_{\tau;xy} \\psi(x, y)](s, t)$.\n\nNow, we can define GCF-transitive-closure\
    \ logic, the guarded fragment of CF-transitive-closure logic (without stop conditions),\
    \ restricted to binary relations, in which only transitive-closure expressions\
    \ of the form\n\n```\n$[TC_{\tau;y} \\psi(x, y) \\wedge \\tau_{\\psi}(s, t)]$$\n\
    ```\n\nare allowed.\n\nBy definition, we now have that in GCF-transitive-closure\
