    The chapter of MacPherson and Steinhorn, Definability in classes of finite structures,
    contains two distinct threads that draw their motivation from classical theory.
    The first, inspired by the model theory of finite and pseudofinite fields, connects
    asymptotic classes of finite structures. These are non-elementary classes of finite
    structures whose first-order asymptotically satisfy cardinality constraints that
    permit the assignment of a dimension and measure, and have an intimate connection
    in classical model theory to so-called simple theories. The second theme concerns
    robust classes of finite structures, whose origin lies in attempting to “finite”
    classical model-theoretic conditions, such as o-minimality, that are provably
    excluded in asymptotic classes. Robust classes consist of directed systems of
    finite structures in which the truth value of a formula requires “looking ahead”
    into a larger structure in the system.


    For the model theory of finite structures that has been developed with great success
    within theoretical computer science, “tameness” assumptions do not apply only
    to isolate classes of structures that are well-behaved with respect to a preferred
    logic, such as first-order logic. Research has prospered by stroking a balance
    between appropriate logics or fragments thereof and classes of finite structures:
    that is, logics logics with tame classes. This theme appears in Koponen’s chapter,
    with its emphasis on bounded variable logic combined with classical tameness assumptions,
    and strongly emerges in the chapters of Otto and Kreutzer. As these chapters furthermore
    show, this point of view can furnish significant computational insights.


    Kreutzer’s chapter, Algorithmic meta-theorems, discusses how constraining both
    classes of (finite) structures and logics yields a wealth of algorithmic results.
    An algorithmic meta-theorem has the form that every computational problem can
    be solved efficiently on every class of structures that satisfy certain constraints.
    This is usually accomplished by showing that the model-checking problem for formulas
    in some logic typically first-order or monadic second-order—is what is called
    fixed-parameter tractable for a class of structures, typically based on graphs
