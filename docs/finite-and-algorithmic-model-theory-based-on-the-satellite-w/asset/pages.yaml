    \nFigure 2.21 The contraction $\tilde{f}$ of a function $f$.\n\n**Algorithm**\
    \ TERMINATE($f$):\n\n*Step 1.* Compute the sets $C_1 = \\{x \\mid f(x) = x\\}$\
