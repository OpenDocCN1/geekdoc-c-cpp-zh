    # 5.9 Conclusion


    This paper gives an overview of algorithmic meta-theorems developed in recent
    years. See Figure 5.18 for a diagrammatic summary of the results presented in
    this paper.


    As we have seen, first-order model-checking is fixed-parameter tractable on a
    wide range of graph classes defined by standard graph invariants such as tree-width
    or excluded minors. By localising these invariants we obtained even further tractable
    classes. However, we are still very far from a clear picture of where first-order
    model-checking is tractable and where it is not. Further'
