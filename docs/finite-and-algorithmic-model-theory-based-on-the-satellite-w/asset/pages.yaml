    **Theorem 5.7.1 (Gaifman [48])** Every first-order sentence is equivalent to a
    Boolean combination of basic local sentences. Furthermore, there is an algorithm
    that, given a first-order formula as input, computes an equivalent Boolean combination
    of basic local sentences.


    A first-order formula is in Gaifman Normal Normal Form (GNF), if it is a Boolean
    combination of basic local sentences. Gaifman''s original proof is an explicit
    translation of first-order formulas into formulas in GNF. A proof sketch along
    this lines can also be found in the survey [53]. A different, model-theoretical
    proof can be found in [37, 2.5].


    The translation of formulas into normal form is effective. However, it has recently
    shown [23] that this translation may involve an elementary blow-up in the size
