    **Bisimulation** the bisimulation game has a special status because of its fundamental
    nature as the quintessential back-and-forth game – game equivalence of game graphs
    – to be discussed in the following section.


    In line with the general approach, the positions (between rounds) in $\mathcal{G}^M(\mathfrak{A},
    \mathfrak{A}'')$ are pairs of observable configurations in $\mathcal{O}(\mathfrak{A})
    = \mathfrak{A}$ and $\mathcal{O}(\mathfrak{A}'') = \mathfrak{A}''$, i.e., pairs
    $(a, a'') = A \times A''$. The challenge/response exchange that constitutes a
    single round is:


    +   - I selects a transition relation $E_a$, in $\mathfrak{A}$ or some $E_{a''}$,
    successor $b''$ in $\mathfrak{A}''$.

    - II has to respond by selecting an $E_a$ successor in the opposite structure.


    Overall this results in a successor position $(b, b'')$ for which $(a, b) \in
    E_a^{\mathfrak{A}}$ and $(a'', b'') \in E_{a''}^{\mathfrak{A}''}$. A position
