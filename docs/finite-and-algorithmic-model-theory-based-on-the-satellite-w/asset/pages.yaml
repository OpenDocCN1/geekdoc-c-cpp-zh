    **Theorem 2.10** The above spatial Datalog program correctly tests connectivity
    of semi-linear spatial datasets (i.e., spatial datasets that can be described
    by addition only).


    In fact, this program correctly tests topological connectivity for a wider class
    of spatial datasets, called border-visible (Kuijpers et al., 1996). The program
    does not work for arbitrary semi-algebraic figures in $\mathbb{R}^2$, however.
    For example, when the input is the area between the parabola given by $y = x^2$
    and $y = 2x^2$, then soundness is satisfied for all points except the origin.
    Even when the origin is left out, termination is violated since there is no uniform
    bound on the number of line segments needed to connect two points. The closer
    one point gets to the origin, the more segments are needed.


    **First-order logic extended with a while-loop** Another extension is firstorder
    logic with a while-loop. Basically, in this language first-order definable relations
    can be created using the input spatial dataset and previously created relations.
    Also, a while-loop with a first-order expressive stop-condition is allowed. These
    two constructs are illustrated in the following program to test linear-path connectivity.


    ```

    $Seg := \{(x, x'', y'') \mid \forall\lambda(0 \le \lambda \le 1 \wedge \forall
    u\forall v((u, v) = \lambda(x, y) + (1-\lambda)(x'', y'') \rightarrow S(u, v))$;$\n$Path_1
    := Seg;$\n$Path_2 := \{(x, x'', y'') \mid \exists u\exists v(Path_1(x, y, u) \wedge
    Seg(u, v, x'', y''))};$\n$while$ $Path_1 \neq Path_2$\n do\nt$Path_1 := Path_2;$\nt$Path_2
    := \{(x, x'', y'') \mid \exists u\exists v(Path_1(x, y, u, v) \wedge Seg(u, v,
    x'', y''))};$\nod\n$R_{out} := \{(())\};

    ```


    In the $Seg$ relation, couples of points are collected that can be connected by
    a line segment in $S$. Next, in the while-loop, the transitive closure of this
    relation is computed and the output relation $R_{out}$ reflects whether all pairs
    of points of $S$ are in this transitive closure.


    This example shows that topological connectivity of linear spatial datasets can
    be expressed in this language, but we have the following more powerful result
    (Gyssens et al., 1999).


    **Theorem 2.11** First-order logic extended with a while-loop is a computationally
    complete language on spatial (semi-algebraic) datasets.'
