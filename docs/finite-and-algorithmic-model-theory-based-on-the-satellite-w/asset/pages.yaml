    It is not too hard to see that the rank-width of a graph can be bounded in terms
    of its branch-width and hence its tree-width. The following theorem by Oum gives
    an exact bound.


    **Theorem 5.4.17 (Oum [70])** $rw(G) \leq \max\{1, bw(G)\}$ for all graphs $G$.


    It is easily seen that the rank of a complete graph is 1 (all entries in all matrices
    are 1). Hence, there can be an arbitrarily large difference between the rank-width
    and the branch-width of a graph. On the other hand, Oum [70] proved that $I(K_n)$
    denotes the incidence graph of the $n$-clique $K_n$, then for all $n \geq 3$ with
    $n \equiv 0, 1 \pmod 3$ we have $rw(I(K_n)) = bw(I(K_n)) = \lceil \frac{n}{3}
    \rceil - n$.


    Another example of high tree-degree and high rank-width graphs are $n \times n$-grids,
    whose rank-width has been shown by Jelinek [58] to be $n$.


