    \ $E_i$ for $1 \\le i \\le k$. Further natural restrictions are discussed in section\
    \ 6.2.3 lead to modal and guarded logics.\n\n**The model checking game** The idea\
    \ to associate a two-person game with the semantics of first-order logic goes\
    \ both to Lorenz’s and Lorenzen’s dialogue games [40, 41] between a proponent\
    \ and an opponent of some assertion. The current interest in these games stems\
    \ not from formal issues but more precisely from their conceptual strengths towards\
    \ the design of efficient model checking algorithms, e.g., [22, 50].\n\nWith formula\
    \ $\\varphi$ and $\tau$-structures $\\mathfrak{A}$ we associate a game played\
