    **Model theoretic games** The equivalences and transfer relations between structures
    underlying semantic preservation properties on the one hand, and logical equivalences
    or transfer relations induced by fragments of first-order logic on the other hand,
    are closely linked to model theoretic games or back-and-forth systems. As pointed
    out above, upgrading arguments between these equivalences and suitable finitary
    approximations, which are themselves costly as game equivalences, play a crucial
    role in expressive proofs. The methodological importance of model theoretic games,
    both to understand the semantics and expressive power of logics and to guide the
    desired explicit model constructions or transformations (over restricted classes
    of structures), is being put at the centre of this presentation. We shall here
    discuss various variants of the classical Ehrenfeucht–Fraïssame game and among
    these is given the modal Ehrenfeucht–Fraïssame game, or bisimulation game. In
