  md: '# Definability in classes of finite structures 143


    and a constant. These considerations lead to the following definition of Elwes
    [22] of an N-dimensional asymptotic class of finite structures. For the initially
    considered concept, 1-dimensional asymptotic classes, see [48]. A more extensive
    survey of asymptotic classes provided here, with more emphasis on the infinite
    limits, may be found in [25].


    **Definition 4.2.2 (Elwes, [23])** Let $N \in \mathbb{N}$, and let $C$ be a class
    of finite $L$-structures, where $L$ is a finite language. Then say that $C$ is
    an $N$-dimensional asymptotic class if the following holds:


    +   (i) For every $L$-formula $\varphi(\bar{x}, \bar{y})$ where $l(\bar{x})=n$
    and $l(\bar{y})=m$, there is a finite set of pairs $D \subseteq \{(0, \dots, N)\}
    \times \mathbb{R}^+\cup\{0\}$ and for each $(d,\mu) \in D$ a collection of pairs
    of the form $(M,\bar{a})$ where $M \in C$ and $\bar{a} \in M^m$, such that $\{\Phi_{(d,\mu)}
    : (d,\mu) \in D\}$ is a partition of $\{(M,\bar{a}) : M \in C, \bar{a} \in M^m\}$,


    ```

    $|\varphi(M, \bar{a})\| - |\mu||M|^d = |\alpha(M)|M|^k$

    ```


    as $|M| \to \infty$ and $(M,\bar{a}) \in \Phi_{(d,\mu)}.$


    +   (ii) Each $\Phi_{(d,\mu)}$ is $\varnothing$-definable, is to say that $\{\bar{a}
    \in M^m : \bar{a} \in \Phi_{(d,\mu)}\}$ is uniformly $\varnothing$-definable across
    $C$.


    We may write $\Psi_d$ for the Definition above, and call $\{\Phi_{(d,\mu)} : (d,\mu)
    \in D\}$ a $(d)$-asymptotic type. We define $h(\varphi(M^m,\bar{a}))$ to be the
    pair


    ```

    $Dim(\varphi(M^m, \bar{a})) = Meas(\varphi(M^m, \bar{a}))$,

    ```


    which equals $(d,\mu)$ if $(M,\bar{a}) \in \Phi_{(d,\mu)}$, except that if $d
    = \mu = 0$ we work with the convention that $Dim(\varphi(M^m,\bar{a})) = -1$.


    The o-notation in here means that for every $\varepsilon > 0$ there is $Q \in
    \mathbb{N}$ such that for all $M \in C$ with $|M| > Q$ and all $\bar{a} \in M^m$,
    $(M,\bar{a}) \in \Phi_{(d,\mu)}$, we have


    ```

    $|\varphi(M, \bar{a})\| - |\mu||M|^d < |\varepsilon|M|^k$

    ```


    We call $C$ a weak asymptotic class if $C$ satisfies the asymptotic criterion
    (i) for all $\varphi$, the $\Phi_{(d,\mu)}$ are not assumed to be definable. We
    do not discuss the intermediary condition that the $\Phi_{(d,\mu)}$ are definable
    but not necessarily $\varnothing$-definable.


    It is clear that clause (i) is preserved by reducts; that by the process of restricting
    the class of structures to the reducts in a sublanguage. In fact, by Lemma 3.7
    of Elwes [22], it is preserved by parameter-interpretations which are uniform
    in the sense that the interpreting formulas range over a finite set. However,
    clause (ii) may be lost under interpretations, though it is preserved under parameter-free
    bi-interpretations ([22], Lemma 3.7).'
