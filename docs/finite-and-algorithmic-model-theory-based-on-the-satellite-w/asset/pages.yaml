    **Example 5.7.3** Recall that a dominating set X in a graph G is a set X ⊆ V(G)
    such that for all $v \in V(G), v \in X$ or there is a $u \in X$ and $\{u, v\}
    \in E(G)$. For $k \in \mathbb{N}$, the formula


    ```

    $$\varphi_k := \exists x_1 \dots \exists x_k \left(V \left(x_i = v \vee Ey_i\right)\right)
    1 \leq i \leq k$

    ```


    true in a graph G if, and only if, G has a dominating set of size at most $k$.\nTo
    convert this into an equivalent sentence in Gaifman normal form, we first observe
    that no connected graph of diameter at least $3k+1$ can have a dominating set
    of size at most $k$. The *diameter of a graph* is the *maximum of the distance
    between any two vertices.*


    *Hence, on connected graphs, the formula $\varphi_k$ above is equivalent to the
    conjunction of the basic local sentence*


    ```

    $$\psi := \neg\exists x_1\exists x_2dist(x_1, x_2) > 3k + 1$

    ```


    saying that the diameter of G is greater than $3k+1$, and the basic sentence


    ```

    $$\exists y_1 \in N_{3k+1}(x) \dots \exists y_k \in N_{3k+1}(x) \forall z \in
    N_{3k+1}(x) \left(V \left(y_i = z \vee Ez_i\right)\right) 1 \leq i \leq k$

    ```


    Note that this formula correctly defines the existence of a dominating set of
    size $k$ only in connected graphs, as in graphs with more one component there
    may exist a dominating set of size $k$ even though there are vertices $x_1, x_2$
    of distance greater than $3k+1$. Adapting the formula to this case requires a
    little effort.


    # 5.7.2 First-Order Logic on Graphs of Bounded Degree


    As a first application of use of Gaifman''s locality theorem for algorithmic meta
    theorems we consider graph classes of bounded degree.


    **Definition 5.7.4** A class $C$ of graphs has bounded degree if there is a $d
    \in \mathbb{N}$ such that $\Delta(G) \leq d$ for all $G \in C$.


    In 1996, Seese ([82]) showed that model-checking for a fixed first-order sentence
    can be done in linear time for graph classes of bounded degree.


    **Theorem 5.7.5** (Seese [82]) For any class $C$ of graphs of bounded degree and
    any fixed first-order sentence it can be decided in linear time whether $G \models
    \varphi$ for a graph $G \in C$. In other words, first-order model-checking on
    $C$ is fixed-parameter tractable by a linear fpt algorithm.'
