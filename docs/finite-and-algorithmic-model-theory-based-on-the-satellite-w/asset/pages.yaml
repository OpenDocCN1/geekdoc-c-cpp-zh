    A natural open problem is to go beyond plain sets. What about non-closed sets?
    We can always decompose a set in $\mathbb{R}^n$ in $n+1$ closed sets, as illustrated
    in Figure 2.11. Hence, the more general question is, what about the first-order
    topological properties of ensembles of plain sets, as opposed to single plain
    sets? Grohe and Segoufin have shown that the situation is considerably more complex
    (Grohe and Segoufin, 2002). In particular, looking at cones is not enough anymore,
    and certain global properties as “inside” and “outside” are expressable.


    Another very open question is to move to higher dimensions: capturing the first-order
    topological properties of semi-algebraic sets in $\mathbb{R}^3$.

    And, what about non-semi-algebraic sets? Consider, for example, the property “every
    point in the set has cone (LL)” (i.e., the dataset consists of a number of disjoint
    curves either closed or going to infinity). This is first-order expressive, and
    it is topological over all sets (semi-algebraic sets but it has a very tame topology).
    Can one also find an example of a topological property that is first-order expressive
    over semi-algebraic sets, but not over all sets?


    Last but not least, an obvious question is how much of our results can be generalized
    from semi-algebraic sets to definable sets in $O$-minimal structures (van den
    Dries, 1998).


