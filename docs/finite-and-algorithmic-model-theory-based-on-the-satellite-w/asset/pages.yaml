  md: '# 48 Vince Bárány, Erich Grädel and Sasha Rubin


    The characterisations of the finite-word automatic Boolean algebras and ordinals
    [88, 63] imply the isomorphism problem for each of these classes is decidable.
    Also, noted, the isomorphism problem for equational graphs is decidable 1.2.10.


    Configuration spaces of Turing machines are locally finite and the complexity
    of the isomorphism problem for locally-finite directed graphs in S-AutStr is $\Pi^0_4$-complete
    [124]. However, by massaging the configuration spaces we get that the isomorphism
    problem for automatic graphs is as hard as possible: $\Sigma^1_1$-complete. This
    is done by reducing the isomorphism problem for computable structures, known to
    be $\Sigma^0_1$-complete, to that of automatic structures.


    **Theorem 1.4.10** [124] The complexity of the isomorphism problem for the following
    classes of S-AutStr structures is $\Sigma^0_1$-complete: (i) undirected graphs,
    (ii) directed graphs, (iii) successor trees, and (iv) latices of height 4.


    Problem 1.4.11 What is the exact complexity of the isomorphism problem for the
    following classes:¹⁸


    +   (i) Automatic equivalence structures (easily seen to be $\Pi^0_1$).


    +   (ii) Automatic linear orders.


    # Traces


    Infinite edge-labelled graphs, when viewed as infinite automata, can accept non-regular
    languages. Naturally, context-free graphs form a structurally much richer class
    than they have the same language accepting power as context-free graphs (cf. Theorem
    1.2.11 items (1) and (6)). Graphs in the Caucal \u00e1rchy (arch)) have the same
    accepting power as higher-order pushdown automata (see Theorem 1.2.16) tracing
    graphs on the corresponding levels of the OI-hierarchy of [62]. The traces of
    GTRS-graphs form a language class between the context-free and context-sensitive
    classes of the Chomsky hierarchy [99]. Rational graphs accept precisely the context-sensitive
    languages [108]. All context-sensitive languages in fact can be accepted by word-automatic
    graphs [123], cf. also [35] for a more accessible proof and finer analysis. Meyer
    proved that the traces of tree-automatic graphs are those languages recognisable
    in ETIME, i.e. in $2^{O(n)}$ time [103].


    > ¹⁸ While this work has been in print, Kuske, Lio and Lohrey have greatly contributed
    to settling these and related questions. We refer to their forthcoming paper.'
