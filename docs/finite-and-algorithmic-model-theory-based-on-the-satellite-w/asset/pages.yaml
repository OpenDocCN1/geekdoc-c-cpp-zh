    bound 4 on the derived length is probably not optimal; it should be 2, arising
    from the class of 1-dimensional affine groups $AGL_1(\mathbb{F}_q)$.*


    One ingredient in the proof is the bound of results on so-BFC groups: that is,
    groups with finite bound d on the size of conjugacy classes. If $G$ is a group
    with bound d on the size of conjugacy classes, then there is a bound $B(d) \in
    N$ such that $|G''| \leq B(d)$; Another element is a theorem of Wielgold [63],
    for example, $B(d) = d^{d^{O(d^2)}}$ is obtained. Another element is a theorem
    of Schlichting, developed by Bergman and Lenstra [66]. It asserts that if $G$
