    to the statement that in every infinite class of finite graphs one graph is a
    minor of another. Let $\mathcal{C} := \{H, G_1, G_2, \dots\}$ be an infinite class
    of finite graphs. If $H$ is a minor of some $G_i$, then the class is trivially
    satisfied by $H$. Hence, the only interesting case is when no $G_i \in \mathcal{C}$
    contains $H$ as a minor. For this reason, much of the theory developed by Robertson
    and Seymour deals with graphs not containing another fixed graph $H$ as a minor.
