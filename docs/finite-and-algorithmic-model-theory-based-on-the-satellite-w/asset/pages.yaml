  md: "# Automata-based representations of infinite structures\n\n# 1.4.3 Non-automaticity\
    \ via pumping and counting\n\nIt is usually quite simple to show that a structure\
    \ has an automatic presentation (if indeed it does have one!). On the other hand,\
    \ there are only handful of elementary techniques for showing that a structure\
    \ has no automatic presentation. Most rely on the pumping lemma of automata theory.\n\
    \nSometimes we can provide a full characterisation of classes of automatic structures.\
    \ The first non-trivial characterisation was for the word-automatic ordinals (in\
    \ the signature of order).\n\n# **Theorem 1.4.12** (Delhomné [63])\n\n+   (i)\
    \ An ordinal $\\alpha$ is in S-AutStr, and only if, $\\alpha < \\omega^\\omega$.\n\
    (ii) An ordinal $\\alpha$ is in T-AutStr, and only if, $\\alpha < \\omega^{\\\
    omega^\\omega}$.\n\nA relation $R$ is $(n+m)$ locally finite for every $(x_1,\
    \ \\dots, x_n)$, there are only many $(y_1, \\dots, y_m)$ such that $R(\bar{x},\
    \ \bar{y})$ holds. Obviously, every functional $f(\bar{x}) = y$ is locally finite.\
    \ Other examples of finite relations are equal-length $\\ell$, length $|y| < |x|$,\
    \ and the prefix relation $y <_{prefix} x$. Note that local finiteness depends\
    \ on the partitioning of the variables, e.g. $x <_{prefix} y$ is not locally finite.\n\
    \nA simple pumping argument gives the following important tool.\n\n**Proposition\
    \ 1.4.13** (Elgot and Mezei [66]) $R \\subseteq (\\Sigma^*)^{n+m}$ be a regular\
    \ and locally finite. Then there is a constant $k$ such that for all $\bar{x},\
    \ \bar{y}$ satisfying $R$, $\\max|y_j| \\leq \\max|x_i| + k$. In particular, if\
    \ $f$ is a regular function then there is a constant $k$ such that for every $\b\
    ar{x}$ in its domain we have $|f(\bar{x})| \\leq \\max|x_i| + k$.\n\n# Growth\
    \ of generations\n\nConsider a structure $\\mathcal{A}$ with functions $\\mathcal{F}\
    \ = \\{f_1, \\dots, f_t\\}$ and a sequence $E = \\{e_0, e_1, \\dots, e_m\\}$ of\
    \ elements of $\\mathcal{A}$. The generations of $E$ with respect to $\\mathcal{F}$\
    \ are defined recursively as follows.\n\n```\n$G^0(E) = \\{e_0\\}$\nG^{n+1}(E)\
    \ = G^n(E) \\cup \\{e_{n+1}\\}\ncup \\{f(a) \\mid f \\in \\mathcal{F}, a_i \\\
    in G^n(E) \text{ for } i \\leq |bar{a}|}$\n```\n\nWe are interested in how fast\
    \ $G^n(E)$ grows as a function of $n$.\n\n**Example 1.4.14** (i) Free semigroup\
    \ on $m$ generators: $\\mathcal{F} = \\{e_1\\}$ and $E = \\{e_1, \\dots, e_m\\\
    }$. For $m \\geq 2$, since $G^{2^n}(E) \\supset E$, the set $G^{2^n+n}(E)$ includes\
    \ all strings over $E$ of length at most $2^n$; thus the cardinality of $G^{2^n+n}(E)$\
    \ is at least a double exponential in $n$."
