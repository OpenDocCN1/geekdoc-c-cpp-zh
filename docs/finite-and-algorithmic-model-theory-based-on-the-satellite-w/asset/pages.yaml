    With any logic $\mathcal{L}$, we can naturally associate the following decision
    problem, called the model-checking problem of $\mathcal{L}$.


    | MC($\mathcal{L}$) | |

    | --- | --- |

    | Input: | Structure A and sentence $\varphi \in \mathcal{L}$.\n| Problem: | Decide
    $A \equiv \varphi$. |


    Much of this paper will be devoted to studying the complexity of model-checking
    problems on various classes of graphs, primarily in the parameterized setting
    introduced in the next section.


    Another natural problem associated with any logic is its *satisfiability problem*
    defined as whether a given sentence $\varphi \in \mathcal{L}$ has has a model.
    We will study this problem relative to a graph class $C$ of structures, i.e. the
    $\mathcal{L}$-theory of $C$, class of all formulas $\varphi \in \mathcal{L}$ which
    are true in every structure $A \in C$, is decidable.


    The *rank* of a formula $\varphi$, denoted $qr(\varphi)$, is the maximum number
    of quantifiers in $\varphi$ nested inside each other. If $\varphi \in MSO$ is
    MSO, we can consider first- and second-order quantifiers. For instance, the formula
    in Example 5.2.2 (1) has quantifier rank 3.


    Let A be structure and $v_1, \dots, v_k$ be elements in $V(A)$. For $q \geq 0$,
    the *first-order $q$-type* $tp_q^{FO}(A, \bar{v})$ of $\bar{v}$ is the class of
    all-formulas $\varphi(\bar{v})$ of quantifier-$q$ rank $\leq q$ such that $A \models
    \varphi(\bar{v})$. Monadic *second-order types* $tp_q^{MSO}(A, \bar{v})$ are defined
    analogously.


    By definition, types are infinite. However, it is known that only finitely many
    FO or MSO-formulas of rank $\leq q$ are pairwise not equivalent. Furthermore,
    we can effectively *normalise* formulas in such a way that equivalent formulas
    are normalised syntactically to the same formula. Hence, we can represent types
    by their finite set of normalised formulas.


    This has a number of algorithmic applications. For instance, it is decidable if
    two types are the same and a formula $\varphi$ is contained in a type $\Theta$:
    we simply normalise $\varphi$ to a formula $\psi$ and check whether $\psi \in
    \Theta$. Note, however, it is undecidable whether a set of normalised formulas
    is a type:'
