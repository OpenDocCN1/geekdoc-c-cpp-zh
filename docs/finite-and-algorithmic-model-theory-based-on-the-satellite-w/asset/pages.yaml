  md: '# Automata-based presentations of infinite structures


    decidable in PSPACE. Kuske and Lohrey [101, 95] studied automatic structures Gaifman
    graphs are of bounded degree. Relying on locality of first-order logic they have
    identified the expression complexity of FO model checking on word-automatic and
    tree-automatic structures of bounded degree to be 2ExpSpace-complete and 3ExpTime-complete,
    respectively. The combined complexity remains 2ExpSpace for word-automatic presentations
    and is in 4ExpTime for tree-automatic presentations. For finer results we refer
    to [95].


    # Beyond first-order


    A fundamental problem in verification is deciding reachability: whether there
    is a path between source and target nodes. Since the configuration space of an
    arbitrary Turing machine is finite-automatic, the halting problem can be reduced
    to the reachability problem on the configuration graph of a universal Turing-machine.
    Similar reductions show the undecidability, of (finite-word) automatic structures,
    of connectivity, isomorphism, bisimulation and hamiltonicity [25, 96].


    On the other hand are natural classes of automatic structures for which these
    problems become decidable (see Figure 1.1). For instance, Vational graphs have
    a decidable FO-theory with reachability and are finite-tree automatic. Reachability
    and connectivity in locally-finite unary-automatic graphs are in fact decidable
    in PTIME. Bisimulation equivalence of HR-ational graphs of finite-degree is decidable
    [128] (see section 1.2.2).


    Finally we mention some cases where full MSO is decidable. Prefix structures (which
    include the unary automatic structures) are finite-automatic. A structure of the
    form (N, <, C₁, ..., Ck) is called a colouring of the line. Every known-word automatic
    colouring of the line, and this includes every morphic sequence, has decidable
    MSO-theory (cf. Theorem 1.4.38 and see [7]). Furthermore, every word-automatic
    equivalence relation has a decidable MSO-theory. This follows from the above and
    the observation (Proposition 1.40) that if there are only finitely infinite classes
    then the equivalence relation is FO-definable in some word-automatic colouring
    of the line [7].


    # Isomorphism problem


    A measure of the complexity of a class of structures is the isomorphism problem,
    namely the problem of giving two □-automatic presentations ∂ and ∂'', whether
    or not the structures they present are isomorphic.'
