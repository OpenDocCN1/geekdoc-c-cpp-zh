    logic restricted to well-behaved (non-elementary) classes of structures, particularly
    finite structures. Whereas the model-theoretic compactness theorem plays an essential
    role in the classical setting, paradigmatically in proving expressive completeness
    results such as the Los-Tarski theorem characterizing formulas preserved under
    extensions as the existential formulas, its failure for restricted classes of
    structures, e.g., classes of finite structures, motivates the introduction of
    the methods and techniques that Otto places at the center of the chapter. The
    chapter also surveys how by restricting to classes of finite structures defined
    by tree-width and locality considerations, expressive completeness results that
    fail for the class of finite structures can be regained.


