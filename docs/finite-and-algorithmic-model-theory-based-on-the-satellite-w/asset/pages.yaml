    **Proposition 4.6.3** (i) [48]. *Let C be a supersimple rank I family of finite
    groups. Is there d \in N$ such that each group $G \in C$ has normal subgroups
    $H$ and $N$, with $|G:N| \leq d, |H| \leq d, H \leq Z(N)$, and $N/H$ is abelian.*


    (ii) [24] *Let C be a supersimple rank 2 family of finite groups. Then there is
