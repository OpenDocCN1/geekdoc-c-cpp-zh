    over the reals have been proposed to allow the expression of toplological connectivity
    of spatial datasets. In this section, we briefly discuss two such extensions:
    spatial Dalog and first-order logic extended with a while-loop. In the next section,
    we will discuss in more detail extensions of first-order logic with different
