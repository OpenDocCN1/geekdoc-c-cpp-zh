    \overline{S}\ \in PR$;

    - if $R \in PR$ of $m > 1$ and $\{i_1, ..., i_m\} = \{1, ..., m\}$, then $R^{(0)}
    = \{u_{i_1}, ..., u_{i_m}} \mid (u_1, ..., u_m) \in R \} \in PR$;

    - if $R, S \in PR$ are of the same sense, then $R \cup S \in PR$.


