    \ an \"amalgamation class\" of models of $T$ and all models in the amalgamation\
    \ class are \"stable\". The definition of an amalgamation class is given in this\
    \ section (Definition 3.3.5) and the notion of 'stability' is treated in Section\
    \ 3.4.\n\nDefinition 3.3.1 $\\Phi \\subseteq L$ and let $M$ and $N$ be $L$-structures.\n\
    \n+   (i) If $a_i \\in M, b_i \\in N$, for $i < \\lambda$, then we have\n\n> $(M,\
    \ (a_i : i < \\lambda)) \\equiv \\Phi (N, (b_i : i < \\lambda))$\n\nif for $m\
