  md: '# Fragments of FO and special classes of structures 337


    is one aspect of Rossman''s approach that may deserve to be highlighted in connection
    with the leading themes of this survey. That is the manner in which the new argument
    is based on explicit model construction (as opposed to an abstract model existence
    argument), and can be viewed as an upgrading (not of an equivalence, but a unidirectional
    transfer relationship) to approximate first-order equivalence, which is orthogonal
    to the classical argument. This is an interesting parallel with the observations
    in section 6.3.2. While a traditional proof of the Lyndon-Tarski Theorem can be
    based on the upgrading indicated in the left-hand diagram, Rossman''s proof amounts
    to the upgrading indicated in the right-hand diagram. In the traditional picture,
    transfer w.r.t. the full existential positive fragment of FO is upgraded, in a
    classical saturation argument based on compactness, to yield a homomorphism between
    structures that are elementarily equivalent to the original. In the ''explicit''
    construction of Rossman''s, on the other hand, a specific finite level of transfer
    (existential positive of quantifier rank up to r) is upgraded to a specific finite
    level of first-order equivalence that preserves the given sentence $\varphi$.


    ![](img/ba8cd3ad09a1969652afbe21bc8dc93b_349_0.png)


    Moreover, Rossman''s proof has a classical variant, in the chain construction
    is extended to an infinite limit, that yields a completely new, alternative proof
    of the classical Lyndon-Tarski result with added value. In fact, Rossman shows
    that existential positive FO is expressive complete for first-order sentences
    preserved under homomorphisms, level-by-level w.r.t. quantifier-rank. In the classical
    model theory version of his proof, Ross realises the above upgrading for $r=q$,
    while in the finite model theory version there is no elementary bound on $r$ in
    terms of $q$.


