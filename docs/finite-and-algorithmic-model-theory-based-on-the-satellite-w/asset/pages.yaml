  md: '# Algorithmic meta-theorems


    We say that $H$ is a *minor* at *depth* $r$ of $G$ (and write $H \preccureq_r
    G$) if $H$ is a minor of $G$ and this is witnessed by a minor map $\mu$ of $H$
    into $G$ so that every vertex $v \in V(H)$ maps to a subgraph $\mu(v) \subseteq
    G$ which induces a graph of radius at most $r$. That is, for each $v \in V(H)$,
    there is a $w \in V(\mu(v))$ such that $\mu(v) \subseteq N^r(w)$.


    **Definition 5.8.10** [[68]] *A class of graphs $C$ is said to be nowhere dense
    if every $r \geq 0$ there is a graph $H$, such that $H_r \neq G$ for all $G \in
    C$.*


    Conversely, if a class $C$ of graphs is nowhere dense then there is a radius $r$
    such that every graph $H$ is a depth $r$ minor of some graph $G_H \in C$. If furthermore,
    $C$ is closed under taking subgraphs, then the $d$-depth image $I_H$ of $H$ in
    $G_H$ is itself a graph in $C$. Note that the size of $I_H$ is polynomially bounded
    in $H$ (for fixed $r$). Classes which are not nowhere dense are somewhere dense
    [68]. Let us call a class effectively dense if, given a graph $H$, a d-depth image
    $I_H \in C$ of $H$ in a graph $G_H \in C$ can be computed in polynomial time.


    As the following theorem shows, in terms of sparse classes of graphs, nowhere
    dense are the natural border for tractability of first-order logic.


    **Theorem 5.8.11** *If $C$ is effectively somewhere dense and closed under taking
    subgraphs, then MC(FO, $C$) is not fixed-parameter tractable unless FPT = AW[*].*


    The proof relies on the fact that we can interpret the class of all graphs in
    any effectively dense class of graphs which is closed under subgraphs, as every
    graph occurs as a depth $d$ minor of a member of $C$ and the $d$-depth image of
    this is itself a graph in $C$. Sub-divisions of a fixed length can be defined
    in first-order logic and model checking for first-order logic on the class of
    all graphs can be reduced to FO-model checking on any effectively somewhere dense
    class of graphs which is closed under subgraphs.


    Furthermore, it seems likely that on every nowhere dense class of graphs, first-order
    model checking is fixed-parameter tractable.


    **Conjecture 5.8.12** *If $C$ is nowhere dense then MC(FO, $C$) = FPT.*


    If this conjecture could be proven on subgraph closed classes of graphs, the property
    of being nowhere dense would exactly characterise the tractable cases.'
