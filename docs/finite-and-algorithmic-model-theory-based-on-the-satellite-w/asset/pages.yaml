    # 5.3 Monadic Second-Order Logic on Tree-Like Structures


    It is a well-known fact, based on the close relation between monadic second-order
    logic and finite tree-automata (e.g. [9, 31, 85, 86, 10, 63]), that model-checking
    and satisfiability for very expressive logics such as MSO become tractable on
    the class of finite trees. At the core of these results is the observation that
    the validity of an MSO sentence at the root of a tree can be inferred from the
    label of the root and the MSO-types realised by its successors. There are various
    ways in which this idea can be turned into a proof or algorithm: we can use effective
    versions of Feferman-Vaught style theorems (e.g. [64]) or we can convert formulas
    into tree-automata and let them run on the trees. The aim of the following sections
    is to extend the results for MSO and FO from trees to more general classes of
    graphs. The aforementioned composition methods in most provide the key to obtaining
    these stronger results.'
