    denotes the $k \times k$-grid.


    > Theorem 5.5.4 (Excluded Grid Theorem [74]) There is a computable function $f
    : \mathbb{N} \to \mathbb{N}$ such that every graph of tree-width at least $f(k)$
    contains $G_{k \times k}$ as a minor.


    We refer to [30] for a proof of this theorem. As every planar graph is a minor
