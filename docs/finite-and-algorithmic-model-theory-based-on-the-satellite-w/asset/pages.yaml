    For Gaifman''s theorem, we want to establish that position (a, a'') in $\mathbb{G}_q(\mathfrak{A};
    \mathfrak{A}'')$ is a winning position for **II**, i.e., $\mathbf{a} \equiv_q
    \mathbf{a}''$, $\mathbf{a}''$, on the basis of


    +   - suitable global conditions on $\mathfrak{A}$ and $\mathfrak{A}''$ (without
    reference to $\mathbf{a}$ and $\mathbf{a}''$), and


    +   - purely local conditions on these parameters within their structures of the
    form


    ```

    $\mathfrak{A}N^\ell(\mathbf{a}), \mathbf{a} \equiv_\ell \mathfrak{A}''N^\ell(\mathbf{a}''),
    \mathbf{a}''$

    ```


    for values of $\ell$ and $r$ are recursively determined as functions of $q$. Towards
    an understanding of the nature of the global requirement, and for a graduation
    of both the local and global equivalences involved, we need the following definition.


    # Definition 6.2.11


    +   (i) For any $\varphi(x)$ we write $\varphi^\ell(x)$ for its relativisation
    to the (FO-definable) $\ell$-neighbour of its free variables, $\varphi^q(x) :=
    [\varphi^{N^q}(x)]$. If $q = qr(y)$, we refer to $\varphi^q$ as a **local formula**
    of Gaifman rank $(\ell, q)$.


    +   (ii) A basic $\ell$-local sentence is one of the form

    $\exists x_1 \dots \exists x_m \bigwedge_{i<j} d(x_i, x_j) > \ell \ \wedge \psi^\ell(x_i)$,


    asserting of the $\ell$-scattered $m$-tuple whose components satisfy the $\ell$-local
    formula $\psi^\ell(x)$. If $q = qr$, we regard the above basic local sentence
    as one of Gaifman rank $(\ell, m)$.


    # Definition 6.2.12


    The configurations $\mathfrak{A}$ and $\mathfrak{A}''$ are $(\ell, q, m)$-Gaifman-equivalent,
    denoted as $\mathfrak{A}, \mathbf{a} \equiv_{q,m}^\ell \mathfrak{A}'', \mathbf{a}''$,
    if:


    +   (i) $\mathfrak{A}N^\ell(\mathbf{a}), \mathbf{a} \equiv_{q,m}^\ell \mathfrak{A}''N^\ell(\mathbf{a}'')$,
    and $\mathbf{a}$ and $\mathbf{a}''$ satisfy the same $\ell$-local formula


    +   $\varphi^q$ for $q \le q''$ (local condition).


    +   (ii) $\mathfrak{A}$ and $\mathfrak{A}''$ satisfy the same basic sentences
    of ranks $(\ell, q, m'')$ for $\ell \le \ell''$ and $q \le q''$ and $m \le m''$
    (global condition).


    For fixed relational vocabulary and arity of the tuples $\mathbf{a}$, each $\mathbf{a}_{q,m}^\ell$
    has finite index, and respects $\equiv$. Also $\mathbf{a}_{q,m}^\ell$ is monotone
    w.r.t. the ranks $(\ell, q, m)$. Gaifman''s theorem says that $\mathbf{a} \equiv_{q,m}^\ell$
    approximates full first-order equivalence = $\equiv$, well, in the sense that
    $\equiv$ is the coarse refinement of all levels = $\equiv_{q,m}^\ell$.


    # Theorem 6.2.13


    (Gaifman) Any FO-formula is preserved under $\equiv_{q,m}^\ell$ for suitable $(\ell,
    q, m)$. Equivalently: any formula of FO is logically equivalent to a boolean combination
    of local formulae and basic local sentences.'
