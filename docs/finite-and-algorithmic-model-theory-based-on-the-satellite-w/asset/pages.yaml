    of pushdown graphs, the state is no positioned at the left of the string but at
    the location of the head. Consequently, rewriting is not confined to prefixes,
    but rather occurs around the state symbols: transitions are of the form $\alphauw\beta
    \mapsto au''q''w\beta''$ for adequate $u, w, u'', w''$ and $q, q''$ as determined
    by the transition function of $\mathcal{M}$. The fact that TM graphs are presentable
    using $infix$ rewriting has the profound consequence that reachability questions
    in infix-rewriting systems are generally undecidable, as opposed to graphs of
    $prefix$-rewriting systems, whose monadic second-order theory is decidable (cf.
    Theorem 1.2.4).


