    **Theorem 5.8.1** (Garey, Johnson, Stockmeyer [49]) *3-colourability is NP-complete
    on the class of planar graphs of degree at most 4.*


    However, the class of planar graphs is a very specific class and this result does
    not rule out Courcelle''s theorem could possibly be extended to classes of unbounded
    but slowly growing tree-width. To show intractability results for MSO$_2$-model
    checking on classes of graphs of unbounded tree-width we first need to classify
    the degree of "unboundedness".


    **Definition 5.8.2** *Let $f : \mathbb{N} \to \mathbb{N}$ be a non-decreasing
    function. A class $C$ of graphs has $f$-bounded tree width $tw(G) \leq f(|G|)$
    for all $G \in C$.*


    Courcelle''s theorem applies to $f$-bounded classes of graphs for constant functions
    $f$. We will particularly be interested in classes of graphs whose tree width
    grows logarithmically in the size of the graphs and aim at proving that if the
    tree width $C$ is not bounded logarithmically then MSO$_2$-checking is not tractable
    on $C$. A first step towards this direction appeared in $[59, 60]$ where such
    a result was proved for classes of coloured which we define next.


    Let $\Sigma := \{B_1, \dots, B_k, C_1, \dots, C_l\}$ be a set of colours, where
    the $B_i$ are colours of edges and the $C_i$ are colours of vertices. A $\Sigma$-coloured
    graph, or simply $\Sigma$-graph, is an undirected graph $G$ where edges may be
    coloured by $B_1, \dots, B_k$ and vertices may be coloured by $C_1, \dots, C_l$.
    We do not require any additional conditions such as having endpoints coloured
    in different ways, we do not require the colouring to be *proper* in the graph
    theoretical sense. To obtain logical structures, we let $\sigma := [E, B_1, \dots,
    B_k, C_1, \dots, C_l]$ be the signature containing binary relations $E, B_1, \dots,
    B_k$ for edges and their uncolours $C_1, \dots, C_l$, for vertices.


    **Definition 5.8.3** *A class $C$ of $\Sigma$-graphs is said to be closed under
    $\sigma$-colourings if whenever $G \in C$ and $G''$ is obtained from $G$ by recolouring,
    i.e. the underlying un-coloured graphs are isomorphic, $G'' \in C$.*


    A class $C$ of $\sigma$-structures is closed under colourings if there is a class
    $C''$ of (uncoloured) graphs such that $C$ is the class of all $\sigma$-structures
    whose Gaman-graphs are in $C''$.


    We aim at showing that if $\mathcal{C}$ is a class of graphs closed under colourings
    whose tree width is not bounded by a log-function then MSO$_2$-model checking
    is fixed-parameter intractable on $\mathcal{C}$. The proof of this relies on a
