  md: '(3) Every path in $\Pi$ is ultimately periodic with a period of bounded length.


    To close the circle, for each $n \in \mathbb{N}$ the sentence


    $\forall x \exists y |y| > |x| z^01 \preceq_{prefix} y \wedge (\forall z <prefix
    y)end(z) \rightarrow z^01 \preceq_{prefix} y$


    where $end1(z)$ is shorthand for saying that the last letter of $z$ is 1. This
    sentence expresses that for every length $|x|$ there is a longer word $y$ with
    as many initial prefixes in $(0^01)^* \text{*}$ as possible. In particular this
    sentence holds for non-standard elements $x$. Consequently,


    (4) for every $n \in \mathbb{N}$ there is an infinite branch of the standard component
    with label $(0^01)^\omega$ and having non-standard elements below it.


    This contradicts observation (3).


    Therefore, by Theorem 1.4.20, there are no countable $\omega$-word automatic non-standard
    models either. Furthermore, using Theorem 1.4.29 in place of Theorem 1.4.26 in
    the argument shows there are no non-standard finite-tree automatic models of $\mathcal{S}_{[2]}$.
    To prove that there are no uncountable $\omega$-word automatic non-standard models
    of $\mathcal{S}_{[2]}$ one tightens (4) and exploits that all automatic presentations
    of non-standard components are equivalent.'
