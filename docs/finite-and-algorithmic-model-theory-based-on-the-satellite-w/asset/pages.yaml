  md: 'The equivalence of the first and the third item is a direct consequence of
    the classical correspondence of automata on words and monadic second-order logic
    of one successor and was already stated in Theorem 1.3.18. Nevertheless, this
    can also be inferred from the fact that the solution term obtained by unfolding
    (1.8) is (essentially) a periodic linear VRS-term that evaluates, via a finite-subset
