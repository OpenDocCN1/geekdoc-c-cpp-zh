  md: "# Logical aspects of spatial databases\n\nA general question, for any fixed\
    \ $G$, is: What are the $G$-geometric properties expressible in first-order logic?\
    \ Can we enumerate and characterise them in some effective way?\n\nThis can be\
    \ done when an injection $p: G \to \\mathbb{R}^\\ell$ for some $\\ell$ such that\
    \ the set\n\n```\n\\{(p(g), \\bar{y}) \\mid g \\in G \\text{ and } \\bar{y} =\
    \ g(x)\\}\n```\n\nis first-order definable in $\\mathbb{R}$.\n\nFor the examples,\
    \ in $\\mathbb{R}^2$ are first-order parameterised. Indeed, each affinity $g$\
    \ corresponds to some 6-tuple $p(g) = (a, b, c, d, e, f)$ with\n\nand we have\
    \ $(y_1, y_2) = g(x_1, x_2)$ iff\n\n```\n\\begin{pmatrix} y_1 \\ y_2 \\end{pmatrix}\
    \ = \\left( \\begin{matrix} a & b \\ c & d \\end{matrix} \\right) \\cdot \\left(\
    \ \\begin{pmatrix} x_1 \\ x_2 \\end{pmatrix} \\right) + \\begin{pmatrix} e \\\
    \ f \\end{pmatrix}\n```\n\nso that is all first-order definable.\n\nThe following\
    \ theorem (Gyssens et al., 1999) provides an effective characterisation of the\
    \ $G$-geometric first-order properties, in $G$ is first-order parameterisable\
    \ (by the injection $p$):\n\n**Theorem 2.1** $\\Pi$ of sets $S \\subseteq \\mathbb{R}^n$,\
    \ for some fixed $n$, is first-order expressible and $G$-geometric if and only\
    \ if $\\Pi(S)$ can be expressed by a first-order sentence of the form\n\n```\n\
    \\phi \\wedge \\forall p(g) \\in p(G)[\\phi(S) \\leftrightarrow \\phi(g(S))]\n\
    ```\n\nwith $\\phi$ an arbitrary sentence over $(\\mathbb{R}, \\mathcal{S}$).\n\
    \nNote that the first-order parameterisability of $G$ guarantees that the special\
    \ form of sentence in the above theorem is indeed a first-order sentence.\n\n\
    # 2.4 First-order topological properties of plain sets\n\nWhen doing topology,\
    \ we are only interested in properties that are invariant under “continuous transformations”.\
    \ More precisely, in this paper we define a property of sets in $\\mathbb{R}^n$\
    \ to be **topological** if it is invariant under all *isotopies* of $\\mathbb{R}^n$.\n\
    \nClearly, the isotopies are not first-order parameterisable, so the easy technique\
    \ from the previous section do not apply."
