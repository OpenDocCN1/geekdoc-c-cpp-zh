  md: 'development and ramification of finite model theory. Finiteness is the only
    constraint, which often entails ''negative'' results, may not be the best choice
    for many reasons.


    It can be that the class of all finite structure is still not just a good match
    for the natural domain of reasoning for certain application areas; some theoretic
    answers – ''positive'' or ''negative'' – may still be ''too easy'' over the class
    of all finite structures. In modular reasoning, for instance, connectedness or
    connectivity constraints are arguably essential in the intuitive modelling. More
    generally, the ''generic finite structure that we mean'' may have more specific
    structural properties than an ''arbitrary finite structure''.


    It can also be that the class of all finite structures is too liberal a setting
    for structural insights into certain issues. Definability and expressive completeness
    results, for instance, fail over the class of all finite structures may not just
    be recovered but also clarified overall through a better understanding of the
    structural conditions that support them. In this sense there is not just finite
    model theory, but there may be many adequate domains of structures for individual
    issues.


    I think both aspects are important from the modelling point of view (i.e., in
    relation to applications), also clearly from an algorithmic point of view, but
    also from the point of view classical in model theory. Sophisticated adaptations
    of classical techniques, like the analysis of types and the use of chain constructions
    in Rossman''s result, enrich finite model theory but also cast fresh light on
    long-standing classical results. In this context the contextual aspect of explicit
    model constructions or model transformations – in contrast with smooth abstract
    existence proofs in classical model theory – is an important methodological contribution.


    It seems that the modularity in game-oriented arguments and model constructions,
    as illustrated by the power of an analysis in terms of Gaifman locality, had comparatively
    little impact on traditional classical model theory. The great potential of another
    aspect of modularity, viz. decomposition techniques, has apparently been realised
    more fully. The combination of such aspects may lead to a better model theoretic
    view of more hierarchical decompositions in particular for finite structures;
    there may be more flavours of structural regularity, smoothness or tameness in
    finite structures to be discovered.'
