    introduced k-NLC graphs, a notion that is equivalent to Courcelle et.''s definition
    up to a factor of 2. The term clique-width was introduced in [19]. Clique-decompositions
    (or k-expressions when they are called) are useful for the design of algorithms,
    as they again provide a tree-structure along which algorithms can work. However,
    until recently algorithms using clique-decompositions had to be given the decomposition
    as input, as no fixed-parameter algorithms were known to compute the decomposition.


    In 2006, Oum and Seymour [71] introduced the notion of rank-width and corresponding
    rank-decompositions, a notion that is broadly equivalent to clique-width in the
    sense that for every class of graphs, one is bounded if, and only if, the other
    is bounded. Rank-decompositions can be computed by fpt-algorithms parameterized
    by the width and from a rank-decomposition clique-decomposition can be generated.
    In this way, the requirement of algorithms being given the decomposition as input
    has removed. But rank-decompositions are also in many other ways the more elegant
    notion.


    We first recall the definition of clique-width in Section 5.4.1. In Section 5.4.2,
    we then introduce general rank-decompositions of submodular functions, of which
    the rank-width of a graph is a special case. As a side effect, we also obtain
    the notion of branch-width, which is another elegant characterisation of tre-width.
    Model-checking algorithms for MSO on graph classes of bounded rankwidth are presented
    in Section 5.4.3, where we also consider the satisfiability problem for MSO and
    a conjecture by Seese.


    # 5.4.1 Clique-Width


    **Definition 5.4.1 (k-expression)** Let $k \in \mathbb{N}$ be fixed. The set of
    k-expressions is inductively defined as follows:


    +   (i) $i$ is a k-expression for all $i \in [k]$.

    (ii) $i \neq j \in [k]$ and $\varphi$ is a k-expression, then so are $edge_{-j}(\varphi)$
    and $rename_{-j}(\varphi)$.

    (iii) $\varphi_1, \varphi_2$ are k-expressions, then so is $(\varphi_1 \oplus
    \varphi_2)$.


    A k-expression $\varphi$ generates a graph $G(\varphi)$ coloured by colours from
    $[k]$ as follows: the k-expression generates a graph with one vertex coloured
    by the $i$ colour and no edges.


    The expression $edge_{-j}$ is used to add edges. If $\varphi$ is a k-expression
    generator the coloured graph $G := G(\varphi)$ then $edge_{-j}(\varphi)$ defines
    the graph $H$ with $V(H) := V(G)$ and


    $E(H) := E(G) \cup \{u, v\} : u \text{ has colour } i \text{ and } v \text{ has
    colour } j\}$.'
