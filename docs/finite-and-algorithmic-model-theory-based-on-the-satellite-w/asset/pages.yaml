    ilde{a}_2))$\n\nthen\n\nthere are $M$ and $L^n$-elementary embeddings $f_i: M_i\
    \ \to M$, $i=1, 2$, such that $f_1(\tilde{a}_1) = f_2(\tilde{a}_2)$ and $f$ is\
    \ the identity on $M_0$ for $i=1, 2$.\n\n**Remark 3.4.9** Suppose that $M$ is\
    \ a vector space over a finite field and $T = Th_L(M)$, for $n$ larger than the\
    \ number of elements in the field. Using the elementary theory of vector spaces\
    \ is easy to verify that $T$ has the strong $L^n$-amalgamation property over countable\
    \ models. One can also easily verify if $cl$ is linear closure then there is a\
    \ stable $L^n$-amalgamation class for $T$ with respect to this closure operation.\n\
    \n**Theorem 3.4.10** (Baldwin, Lessmann [2]) Suppose that $T$ is a complete $L^n$-theory\
    \ such that $S_n^n(T)$ is finite and $T$ has the strong $L^n$-amalgamation property\
    \ over countable models.\n\n+   (i) If $M \\equiv T$ and $M$ is stable and $L^n$-determined\
    \ then $M$ is $\\omega$-stable.\n(ii) If $A$ is a stable $L^n$-amalgamation class\
    \ for $T$ that $A$ contains at least one infinite structure then $T$ has arbitrarily\
    \ large finite models; these can be taken as $L^n$-elementary substructures of\
    \ the limit of $A$.\n\n*Proof.* (ii) follows from (i) and earlier results. Concerning\
    \ (i): the assumptions that $S_n^n(T)$ is finite, $M$ is stable and $L^n$-determined\
    \ (so $M$ is $\\omega$-categorical), namely, via Shelah's \"unstable formula theorem\"\
    \ [31], that for any countable $A \\subseteq M' \\equiv M$. The useful consequence\
    \ of the $L^n$-amalgamation property over countable models is that if $N \\equiv\
    \ N'$, where $N$ is countable, and $\tilde{b} \\in N'$ are finite sequences\n\n\
    $$(N', cl(\tilde{a})) \\equiv_{L^n} (N', cl(\tilde{b}))$\n\nimplies\n\n$$(N',\
    \ cl(\tilde{a})) \\equiv_{L^s} (N', cl(\tilde{b}))$.\n\nThis property together\
    \ with the assumption that $M$ is $L^n$-determined (which by the $\\omega$-categoricity\
    \ of $M$ implies that any $N \\equiv_L M$ is $L^n$-determined) shows that $M$\
    \ is $\\omega$-stable, by a counting types argument."
