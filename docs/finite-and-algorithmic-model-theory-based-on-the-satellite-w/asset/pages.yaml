  md: '# Logical aspects of spatial databases


    # 81


    ![](img/ba8cd3ad09a1969652afbe21bc8dc93b_93_0.png)


    Figure 2.2 The cone of the central point of the figure is (LLLR).


    Around any point on the boundary of any plain set, we will always see a circular
    list of lines (L''s) and regions (R''s): this list is called the *cone* of the
    point. An illustration is given in Figure 2.2.


    In any plain set, there be infinitely many boundary points with cone (LL) (these
    are the points that lie on a line), or with cone (R) (these are the points on
    the boundary of a region). With the exception of these, however, there are only
    finitely boundary points; this is because semi-algebraic sets have a very simple
    topology (Bochnak et al., 1998). In particular, there are only finitely many points
    with a cone different from (LL) and (R); these points are called the singular
    points of the set. It can be argued (Benedikt et al., 2006) and, without loss
    of generality, we can focus on the singular points, and we will do so now on.


    We are now ready to introduce a propositional logic, called *Cone Logic* or CL
    for short, designed to express properties of plain sets.


    +   Atomic formulas are of the form


    ```

    |e| \ge n

    ```


    with $n$ some natural number and $e$ a star-free regular expression over $\Sigma$
    {L, R}.


    The meaning of such formula is that there are at least $n$ singular points whose
    cone satisfies $e$. (For background on star-free regular expressions and their
    connection to first-order definability on strings, see (McNaughton and Papert,
    1971) and (Thomas, 1997).)


    +   A CL-sentence is a boolean combination of atomic formulas.


    Let us see some examples of properties expressed by CL formulas:


    +   “The dimension is 0”


    ```

    |L\Sigma^*| = 0 \wedge |R\Sigma^*| = 0

    ```'
