    # 6.3 Special classes of transition systems


    Up to bisimulation, every transition system is equivalent to a tree via bisimulation
    unfolding, just as every game graph can be replaced by the associated game tree,
    typically making the representation structurally simpler though less succinct.
    Correspondingly, bisimulation invariant logic (logic whose formulae are preserved
    by bisimulation equivalence) has the tree property. Because cycles are unfolded
    into infinite paths, bisimulation tree models may necessarily be infinite even
    though the original model was finite. So bisimilar unfoldings into tree models
    are typically unavailable within classes of finite models. In the investigation
    of the relational relationship between bisimulation invariant fragments of FO
    with FO itself, Gaifman locality can be used to replace acyclicity by local acyclicity
    in key arguments. We briefly review the classical construction of bisimilar unfoldings
    into tree models and then review a construction of locally acyclic bisimilar companion
    structures from [42]. These are used to establish variants of the classical model
    theoretic characterisations of model in terms of bisimulation preservation (van
    Bent’s theorem). Corollary 6.3.5 below over natural, restricted classes of transition
    systems in section 6.3.2.


