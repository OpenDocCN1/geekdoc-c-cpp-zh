    systematically in terms of the game and its observable configurations as discussed
    above.


    # 6.2.5 Locality and modularity of the first-order game


    Games and the Ehrenfeucht–Fraïissé method are well suited to the exploration of
    the expressive power of FO not just classically but equally over restricted classes
    of structures, and also to understanding the nature of fragments within FO. Such
    explorations typically depend on the availability of suitable structures over
    which the game can be fully analysed. In order to facilitate the analysis, and
    equally importantly also as an indication of where to look for the right candidate
    structures, one can use the modularity of the game w.r.t. Gaifman locality. We
    saw a glimpse of that aspect in Lemma 6.2.4 above.'
