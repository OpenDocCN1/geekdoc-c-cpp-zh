    This result cannot be much further. Examples of [139] show that ‘regular reachability’,
    i.e. the problem whether there exists a path in a given VRA-equational graph between
    two given nodes and such that the labeling of the paths to a regular language
    over the set of colours, is undecidable. In [100] Löding identified a maximal
    fragment of CTL that is decidable on every GTRS graph (with vertices restricted
