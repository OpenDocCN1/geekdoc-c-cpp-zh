    Figure 1.1 Relationship of graph classes and logical decidability boundaries.


    # 1.2 A hierarchy of finitely presentable structures


    This section provides an overview of some of the prominent classes of graphs and
    their various finite presentations.


    These developments are the product of over two decades of research in diverse
    fields. We begin our exposition with the seminal work of Muller and Schupp on
    context-free graphs, we mention prefix-recognisable structures, survey hyperge-replacement
    and vertex-replacement grammars and their corresponding algebraic frameworks leading
    up to equational graphs in algebras with asynchronous or synchronous product operation.
    These latter structures are better known in the literature by their automatic
    presentations, and constitute the topic of the rest of this survey.


    As a unifying approach we discuss how graphs belonging to individual classes can
    be characterised as least fixed-point solutions of finite systems of equations
    in a corresponding algebra of graphs. We illustrate examples how to go from graph
    grammars through equational presentations and interpretations to internal presentations
    and vice versa.


    We briefly summarise key results on Caucal''s pushdown hierarchy and more recent
    developments on simply-typed recursion schemes and collapsible pushdown automata.


    Figure 1.1 provides a summary of some of the graph classes discussed in this section
    together with the boundaries of decidability for relevant logics.'
