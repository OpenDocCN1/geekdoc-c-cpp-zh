    simple with finite SU-rank and there is a notion of measure on the definable subsets
    of models of $T$, that $T$ is not necessarily smoothly approximable. See

    [15] for a survey of the topic.


    In this article an overview is given of a line of research which considers $L^n$-ntheories
    with infinite models and try to isolate conditions for when these have arbitrarily
    large finite models and when least upper bounds for the smallest model is recursive
    in terms of the number of $L^n$-types in free variables. Although some results
    are stated within a more general context, considering some arbitrary fraction
    of first-order logic which is closed under subfamilies, and some results could
    be in a somewhat more general way, we mostly stick to the language $L^n$ for the
    sake of simplicity. Moreover, when working with $L^n$ we usually consider $L^n$-theory
    $T$ such that $T$ is finitely axiomatizable in $L^n$ and complete within $(L^n)$
    in the sense that for every $\varphi \in L^n$, $T \models \varphi$ or $T \models
    \neg\varphi$. The motivation is to find conditions for $T$ which imply that $T$
    has a finite model, and facts 3.2.6 and 3.2.7 below imply the following: if $T$
    is an $L^n$-theory and no complete $T'' \subseteq T$ exists such that $T''$ is
    finitely axiomatizable, then $T$ has no finite model.


    The basic idea is to isolate conditions for a finitely axiomatizable complete
    $L^n$-theory $T$ which guarantee the existence of a model $M$ of $T$ which is
    smoothly approximable, since such an $M$ has the property that every sentence
    which is true in $M$ is true in arbitrarily large finite subsets of $M$. Moreover,
    in this situation the theory of smoothly approximable structures implies that
    a recursive upper bound, in terms of the number of $L^*$-types in free variables,
    of the smallest models exists (contr to the general situation, as proved in [17]).


    Sections 1–7 of this article try to unify, as much as possible, the approaches
    of [9], [8] and [2]. Hytönen''s paper [22] on canonical diagrams and quantifier
    elimination is highly recommended since it develops, in a more general context,
    part of the theory and several of the results. Here I have chosen to explore the
    subject via a more "down-to-earth”-approach focused on $L^n$-theories, although
    some generality is lost.


    Sections 3.6 and 3.7 discuss infinite structures which have the finite model property
    but are not necessarily smoothly approximable (the random bipartite graph is an
    example [24]). This may be useful for understanding other classes of L-theories
    than those treated in earlier sections. The last section contains a list of questions
    and problems.


