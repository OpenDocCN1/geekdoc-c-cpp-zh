    # Algorithms and Complexity


    The notion of tree-width has been introduced by Robertson and Seymour as part
    of their proof of the graph minor theorem. Even before, the notion of partial
    k-trees, broadly equivalent to tree-width, had been studied in the algorithms
    community. The relevance of tree-width for algorithm designs comes from the fact
    that tree-structure inherent in tree-decompositions can be used to design bottom-up
    algorithms on graphs of small tree-width to solve problems'
