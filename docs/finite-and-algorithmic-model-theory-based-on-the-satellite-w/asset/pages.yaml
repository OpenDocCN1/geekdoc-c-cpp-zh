  md: '# Definability in classes of finite structures 141


    form $\mu|F|^k$, where $k$ represents the dimension and $\mu$ the measure of the
    size of the set defined by $\varphi$. Asymptotic classes are, roughly speaking,
    classes of finite structures with a strong uniformity on the cardinality of definable
    sets that mirrors precisely that for finite fields ([22], [25], or [48]). Indeed,
    finite fields, as developed in [13], provides a key example, and there are many
    others. Ryten [52] has shown that difference fields, and any family of simple
    groups with fixed rank, fit into this framework, and Elwes [23] has established
    that every smoothly approximable structure admits a class of (finite) elements
    which forms an asymptotic class that witnesses smooth approximability. The uniformity
    properties of asymptotic classes feed through ultraproducts of the members of
    any such class: they are supersimple of finite rank, with an additional ingredient,
    still mysterious, called measure.


    The second topic, *robust* classes of finite structures, has its origins in an
    attempt to bring an appropriate version of o-minimality to finite structures.
    Obstacles quickly present themselves: for example, no class of totally ordered
    structures is an asymptotic class – see [25] or [48]. In fact, every o-minimal
    structure elementary to an ultraproduct of totally ordered finite structures must
    be discrete, and thus carry very limited structure [51]. A robust class is a directed
    system of finite structures with *embeddings*, such that any formula, interpreted
    in a class that is sufficiently large relative to the parameters in the formula,
    assumes a constant value. In this setting, a non-trivial notion of o-minimality
    may be defined. For example, the group $(\mathbb{Q}, +, <)$, with $+$ interpreted
    as a ternary relation, is the direct limit of an o-minimal robust class of finite
    structures. The initial theory of robust classes has been developed by the authors,
    and in the Ph.D. thesis of Macpherson''s student, R. Marshall [49]. It is our
    hope that connections eventually emerge between the two topics of this survey
    and robust classes; here Ehrenfelt-Fraïss classes intervene, locality can play
    a role, and there are very natural, if still rudimentary, notions of complexity.


    The organization of this paper is as follows. Asymptotic classes are introduced
    in Section 4.2, and are the examples of Sections 4.3, 4.4 and 4.6. Smoothly approximable
    structures, which provide important examples for both asymptotic classes and robust
    classes, give a brief overview in Section 4.4. Section 4.5 links asymptotic classes
    with contemporary infinite model theory, in particular simple theories, and introduces
    the notion of a measurable structure. Asymptotic classes of groups, with connections
    to simple theories, are treated in Section 4.6. Robust classes are introduced
    in Section 4.7 and Section 4.8 is devoted to examples. In the final section of
    the paper, Section 4.9, an ''o-minimal'' robust approximation of the ordered group
    of rational numbers'
