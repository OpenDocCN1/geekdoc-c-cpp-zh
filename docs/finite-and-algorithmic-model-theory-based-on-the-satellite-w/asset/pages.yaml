    # Automatic groups


    Thurston (1986) motivated by work of Cannon on hyperbolic groups introduced\hent
    notion of automatic groups. A finitely generated group $G$ is automatic in

    this sense if some set of semigroup generators $S$ and associated canonical

    homomorphism $f : S^* \to G$


    +   (i) there is a regular language $W \subset S^*$ so that $f$ restricted to
    $W$ is surjective,

    (ii) for every $s$ a generator from $S$ or the group identity, the following binary

    relation over $W$ is:


    > ${(u, v) \| f(u) = f(v)s\}$


    This is in fact an algebraic notice: it does not depend on the particular choice

    of generators. From the automata presenting the group, and a quadratic-time algorithm
    deciding the word

    problem.


    **Proposition 1.4.30** (k-fellow traveler property) A group $G$ with semigroup

    genators $S = \{s_1, \dots, s_r\}$ is automatic if, and only if, there exists
    a regular

    set $W \subset S^*$ and $k \in \mathbb{N}$ such that $f \mid_W$ is surjective
    and $W$ satisfies the $k$-fellow

    traveler property.


    $\forall u, v \in W \text{ with } d(u, v) \le 1 \forall i \le \max\{|u|, |v|}
    : d(u_1 \dots u_i, v_1 \dots v_i) \le k$


    where $d(u, v)$ denotes the length of the shortest path between $u$ and $v$ in
    the

    Cayley graph of $G$ with generators $S$.


    Virtually Abelian groups and Gromov''s word hyperbolic groups constitute

    important examples of automatic groups in this sense. Major results of this

    programme are presented in [31] (see also the introductions by Farb [71] and

    by Choffrut [46]).'
