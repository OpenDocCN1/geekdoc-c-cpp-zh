    **Corollary 5.5.21** ([1]) *For all minor ideals $C, D$ the set $O(C \cup D)$
    is computable from the sets $O(C)$ and $O(D)$.*


    Using a similar approach it was shown in [1] that obstructions can be computed
    for other natural minor ideals. In particular, if $C$ is a minor ideal whose obstructions
    are known, the obstructions can be computed for the class $C_{apex}$ of apex graphs
    over $C$, defined as


    ```

    $C_{apex} := \{G : \text{there is } v \in V(G) \text{ such that } G - v \in C\}$.

    ```


    However, there remain interesting problems.


    +   **Open Problem 5.5.22** 1. *Is there an algorithm, given $\lambda \geq 0$,
    computes the obstructions of $\mathcal{L}(\lambda)$? See Section 5.5.3 for a definition
    of $\mathcal{L}(\lambda)$ and $\mathcal{L}(\lambda, \mu)$.* Note, by using the
    computability of $\mathcal{O}(C_{apex})$ from $\mathcal{O}(C)$, the set $\mathcal{D}(\lambda,
    \mu)$ can be computed from $\mathcal{O}(\mathcal{L}(\lambda))$,n2. If $C$ is a
    minor ideal whose obstructions are given, can we compute the obstructions of the
    class $\mathcal{D}(C)$ of graphs tree-decomposable over $C$?


    A solution for both open problems would be particularly interesting as every minor
    ideal is a subclass of a class $\mathcal{D}(\lambda, \mu)$ for some $\lambda,
    \mu \geq 0$.


    # 5.6 Monadic Second-Order Logic Revisited


    Recall from Section 5.3.5 that for each $k$, the $MSO_2$-theory of the class $\mathcalT}_k$
    of graphs of tree-width at most $k$ is decidable. The aim of this section is to
    prove a kind converse, also due to Seese.


    **Theorem 5.6.1** (Seese [81]) *If $C$ is a class of graphs with decidable $MSO_2$-theory,
    then $C$ has bounded tree-width.*


    The proof of the theorem crucially relies on the excluded grid theorem (Theorem
    5.5.4) and the fact that the $MSO$-theory of grids is undecidable. The latter
    can be easily established using tiling systems or by a direct encoding of the
    Turing-machines using MSO-formulas (see e.g. [8]).


    Suppose $C$ has a decidable $MSO_2$-theory but unbounded tree-width. Then, by
    the excluded grid theorem, for all $n \geq 1$, there is a graph $G_{n \times n}
    \in C$ containing as a minor. The key to the theorem is to show that grid minors
    can be defined in $MSO_2$. Hence, the (undecidable) $MSO$-theory of grids can
    be reduced to the $MSO$-theory of $C$ contradicting the assumption that the latter
    is decidable.'
