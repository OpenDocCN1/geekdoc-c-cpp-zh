    It may seem to be a mere technicality how we encode a graph as a structure. However,
    the precise encoding has a significant impact on the expressive power of logics
    on graphs. For instance, the following $MSO[\sigma_{inc}]$-formula defines that
    a graph contains a Hamilton-cycle using the incidence encoding, a property that
    is not definable in MSO on the standard encoding (e.g. [37], Corollary 6.3.5).


    > $\exists U \subseteq P_V \forall v \text{has degree 2 in } G[U] \ \wedge \varphi_{conn}(U)$


    where $\varphi_{conn}$ is a formula saying that the subgraph $G[U]$ induced by
    $U$ is connected. Clearly, it is MSO-definable that a vertex $v$ is incident to
    exactly two edges in $U$, i.e. it has degree 2 in $G[U]$. The formula says that
    there is a set $U$ of edges so that $G[U]$ is connected and every vertex in $G[U]$
    has degree 2. This means that $U$ is a simple cycle $P$ in $G$. Further, as all
    vertices of $G$ occur in $P$, this cycle is Hamiltonian.


    Hence, MSO is more expressive over incidence graphs than the standard encoding
    of graphs. It is clear that MSO interpreted over incidence graphs is the same
    as the extension of MSO quantification over sets of edges (rather than just sets
    of vertices) on the standard encoding. This logic is sometimes referred to as
    $MSO_2$ in the literature. A more general framework is $MSO_2$ guarded logics,
    which allow quantification only over tuples that occur in some relation in the
    structure. On graphs, *guarded second-order logic* (GSO) is just $MSO_2$. As we
    will not be dealing with general structures in the rest of this survey, we refrain
    from introducing guarded logics familiarly and refer to [2, 51] and therein intact.


