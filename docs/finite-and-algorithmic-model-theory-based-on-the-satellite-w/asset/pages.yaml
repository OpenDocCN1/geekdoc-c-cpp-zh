  md: "# Dugald Macpherson and Charles Steinhorn\n\nis presented. Notation throughout\
    \ is standard; any uncommon terminology or notation is defined where it arises.\n\
    \n# 4.2 Asymptotic class\n\nThe starting point here is the following theorem of\
    \ Chatzidakis, van Dries, and Macintyre. One considers, uniformly across finite\
    \ fields, families of sets defined by formulas $\\phi(\\tilde{x}, \\tilde{y})$,\
    \ where the $\tilde{y}$ are parameter-variables.\n\n**Theorem 4.2.1 ([13])** Let\
    \ $\\phi(\\tilde{x}, \\tilde{y})$ be a formula in the language $L_{rings} = (+,\
    \ \\times, 0, 1)$ for rings, with $\tilde{x} = (x_1, \\dots, x_n)$ and $\tilde{y}\
    \ = (y_1, \\dots, y_m)$. Then there is a positive constant $C$, and a set $D$\
    \ of tuples $(d, \\mu)$ with $d \\in \\{0, \\dots, n\\}$ and $\\mu$ a non-negative\
    \ rational number, such that for each finite field $\\mathbb{F}_q$ and $\\tilde{a}\
    \ \\in \\mathbb{F}_q^d$,\n\n```\n$|\\phi(\\mathbb{F}_q^d, \\tilde{a})| - \\mu^d|\
    \ \\leq C q^{d-(1/2)}$\n```\n\nfor $(d, \\mu) \\in D$.\nFurthermore, for each\
    \ $(d, \\mu) \\in D$, there is a formula $\\phi_{(d,\\mu)}(\\tilde{x})$ which\
    \ defines in each finite field $\\mathbb{F}_q$ the set of tuples $\tilde{a}$ such\
    \ that $(\\*)$ holds.\n\nEach pair $(d, \\mu)$ may be understood as providing\
    \ a finite combinatorial representation of the *dimension* $d$ and measure $\\\
    mu$ of definable sets to which the pair corresponds. For formulas which define\
    \ absolutely irreducible varieties - without the $\\mu$ - this is the result of\
    \ Lang-Weil [45]. A 'near complete-ness' result of Keefe [40], coming out of As's\
    \ work [4], asserts that every formula $\\phi(\\tilde{x})$ is uniform, across\
    \ finite fields, a boolean combination of formulas $\\exists g(\\tilde{x}, Y)=0$\
    \ where $g(\\tilde{x}, Y) \\in \\mathbb{Z}[Y]$. This suggests that the above theorem\
    \ should follow: one can reduce definable sets to sets built from finite-to-one\
    \ projections of varieties. The details are intricate.\n\nTheorem 4.2.1 suggests\
    \ one might consider arbitrary classes of finite fields satisfying asymptotic\
    \ uniformities in the spirit of the theorem. There are possible natural weakenings\
    \ of the conditions. First, one could weaken the term $Cd^{-(1/2)}$. There also\
    \ perhaps no reason to require $\\mu$ to be rational. And, most importantly, the\
    \ class of finite fields is in a sense 1-dimensional: uniformly picking an arbitrarily\
    \ large subset of the field (in affine 1-space) picks up a positive fraction of\
    \ the field. Thus, for example, Theorem 4.2.1 answers a question of Felger (in\
    \ fact inspired the paper), that $\\mathbb{F}_q$ is not uniformly definable in\
    \ $\\mathbb{F}_q^2$. One could easily consider the universe $F$ of a structure\
    \ to be $N$-dimensional if all definable subsets of $F$ are roughly of size $\\\
    mu|F|^{d/N}$ for $d \\in \\{0, 1, \\dots, N\\}$"
