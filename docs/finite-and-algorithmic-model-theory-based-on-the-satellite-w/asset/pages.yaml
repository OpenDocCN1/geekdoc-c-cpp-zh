    Moreover, if the collection [Xi : i ∈ I] is invariant under the group K of definable
    automorphisms of G, then H can be chosen to be K-invariant.


    Consequences of Theorem 4.6.4 include the next results. If C is a family of groups,
    we say that the subsets X members of C are uniformly definable if just finitely
    many formulas φ(x, y) are required to define the sets X as G ranges through C.


    Proposition 4.6.5 (from [36, Corollary 7.4]) If C is a supersimple rank family
    of groups with no definable proper non-trivial normal subgroups, then all finitely
    many of the groups in C are simple.


    Proposition 4.6.6 (from [36, Corollary 7.1]) If C is a supersimple rank family
    of finite groups, then the derived subgroups of members of C are uniformly definable.


    Recall the soluble radical R(G) of a finite group G is its largest soluble normal
    subgroup.


    Proposition 4.6.7 [24, Theorem 1.1] If C is a supersimple rank family of finite
    groups, then the radicals R(G) of the groups G ∈ C are uniformly definable.


    Proposition 4.6.7 has further structural consequences. For a group G we denote
    its soc, the direct product of its minimal subgroups, by Soc(G). It follows easily
    from Proposition 4.6.7 that if C is a supersimple rank class, then the groups
    Soc(G/R(G)) are uniformly interpretable in G as ranges through C, and are a direct
    product of a bounded number of finite simple groups of bounded Lie rank.


    There are also the beginnings of a model theory for families of permutation groups.
    We view a permutation group model-theoretically as a pair (X, G), with a definable
    group structure on G and a definable action of G on X. By the Orbit-Stabilizer
    Theorem, if G is transitive on X, we may parse (X, G) as a pair (G, H), where
    H is a subgroup of G, the stabilizer of x ∈ X.


    Recall that a permutation group (X, G) is primitive if there is no non-trivial
    G-invariant equivalence relation — that is, G-congruence on X, equivalently, if
    all point stabilizers Gx for x ∈ X are maximal subgroups of G. We say that the
    family C of finite permutation groups (X, G) is definably primitive if, for each
    non-principal ultraproduct (X*, G*), there is no definable proper non-trivial
    G*-congruence on X*.'
