  md: "# Fragments of FO and special classes of structures 283\n\naccount of the algorithmic\
    \ content of this game, and its complexity analysis, compare [22].\n\nLet $\\\
    Phi[\tau]$ be a set of negation normal formulae that is closed under subformula\
    \ (negation normal form restricts the occurrence of negation to atoms). Let $S(\\\
    Phi)$ be the transition system whose universe is $\\Phi$, with transition relations\
    \ $E_v, E_{\\lambda}, E_{\\exists}$, and $E_{\\forall_i}$ ($i \\ge 1$) interpreted\
    \ as follows.\n\n$E_v$ contains the pairs $(\\varphi, \\varphi_1)$ and $(\\varphi,\
    \ \\varphi_2)$ for $\\varphi = \\varphi_1 \\vee \\varphi_2 \\in \\Phi$; similarly\
    \ for $E_{\\lambda}$;\nE_{\\exists}$ consists of all pairs $(\\varphi, \\psi)$\
    \ for $\\varphi = \\exists \\psi \\in \\Phi$; similarly for $E_{\\forall_i}$.\n\
    \nThe game $G := \\mathfrak{G}(\\mathfrak{A}, \\Phi)$ is the model checking game\
    \ over $\\mathfrak{A}$ which may be interpreted in a subsystem of the product\
    \ system\nO(\\mathfrak{A}) \times S(\\Phi)$.\n\nMore specifically, the universe\
    \ of $\\mathfrak{G}(\\mathfrak{A}, \\Phi)$ is the set of all syntactically appropriate\
    \ assignment/formulae $(\beta, \\varphi) : \text{free}(\\varphi) \\in \text{dom}(\b\
    eta)$. The relevant transition relations of $\\mathfrak{G}(\\mathfrak{A}, \\Phi)$\
    \ are\n\n| $\\mathfrak{G}(\\mathfrak{A}, \\Phi)$ | $O(\\mathfrak{A})$ | $S(\\\
    Phi)$ | |\n| $E_v := id$ | $\times$ | $E_v$ | (disjunctive moves) |\n| $E_{\\\
    lambda} := id$ | $\times$ | $E_{\\lambda}$ | (conjunctive moves) |\n| $E_{\\exists}\
    \ := E_i$ | $\times$ | $E_{\\exists}$ | (existential moves) |\n| $E_{\\forall_i}\
    \ := E_i$ | $\times$ | $E_{\\forall_i}$ | (universal moves) |\n\nAs atomic predicates\
    \ we use $P_V$ and $P_F$, which partition the universe of $\\mathfrak{G}(\\mathfrak{A},\
    \ \\Phi)$ according to:\n\n> $p_V^G = \\{(\beta, \\varphi) : \\varphi = \\varphi_1\
    \ \\vee \\varphi_2 \\text{ or } \\varphi = \\forall x_i \\psi\\} \\cup \\{(\b\
    eta, \\varphi) : \\varphi \\text{ is atomic or not atomic, } \\mathfrak{A} \\\
    models \\varphi\\}$,$\n$p_F^G = \\{(\beta, \\varphi) : \\varphi = \\varphi_1 \\\
    text{ or } \\varphi = \\exists x_i \\psi\\} \\cup \\{(\beta, \\varphi) : \\varphi\
    \ \\text{ is atomic or not atomic, } \\mathfrak{A} \\not\\models \\varphi\\}$.\n\
    \nThe rules of the game are simply the following, according to which the players\
    \ move a pebble in the game graph $\\mathfrak{G}$:\n\n+   - Positions in $P_V$\
    \ require a move by $V$:\n- $V$ moves along any $E_{v^-}$ or $E_{i,\\exists}$-edge\
    \ (as in current position);\n- $V$ loses when stuck for a move.\n- Positions in\
    \ $P_F$ require a move by $F$:\n- $F$ moves along any $E_{\\lambda^-}$ or $E_{i,\\\
    forall}$-edge (as in current position);\n- $F$ loses when stuck for a move."
