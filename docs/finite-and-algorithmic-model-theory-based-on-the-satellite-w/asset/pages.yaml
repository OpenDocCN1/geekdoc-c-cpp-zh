    **Expressiveness and expressive completeness** Our leading theoretic theme in
    results is that of expressive completeness. We regard expressive completeness
    results as classical hallmarks in the study of expressiveness of fragments of
    first-order logic. Think of a classical example like the Łś–Tarski existential
    preservation theorem (cf. Theorem 6.5.2) that a first-order formula is preserved
    under extensions if, and only if, it is logically equivalent to an existential
    formula. The preservation claim in this statement – that existential formulae
    are preserved under extensions – is a trivial exercise in syntactic induction,
    and its truth carries over any restricted class of structures. The expressive
    completeness statement – that first-order, the existential fragment is expressively
    complete for properties preserved under extensions – requires model theoretic
    proof. The classical proof in [11] uses elementary extensions, whose availability
    hinges on the use of the compactness theorem for first-order logic. So that proof
    does not relate to arbitrary classes, and in relation to the class of all finite
    structures is a typical example of a ‘failure in finite model theory’ (due to
    Tait and Gurevich, see for instance [15]). Preservation of a first-order property
    under extensions among finite structures does not imply expressiveness in existential
    first-order logic over finite structures. Some instances of classical preservation
    theorems, like Łś–Tarski, fail in restriction to the class of all finite structures,
    but are true – with totally new proofs – in interesting restricted classes of
    finite structures (cf. Theorem 6.5.9 for results pertaining to extension preservation,
    from [3]). Other instances, like Benthem’s theorem concerning preservation over
    bisimulation (cf. Corollary 6.3.5), or, more classically, the Lyndon–Tarski theorem
    (cf. Theorem 6.5.3), which associates preservation under homomorphisms with the
    existential positive fragment, do have literals in restriction to the class of
    all finite structures as well as some other restricted classes of structures of
    interest (cf. sections 6.3.2 and 6.5.2) – with new proofs that do not draw on
    the classical proofs but shedding new light on the classical results as well.
    And in some instances we know of expressive completeness results over restricted
    classes of (finite) structures that require more expressive fragments than the
    classical analogue; a recent example concerning bisimulation is discussed in section
    6.3.


