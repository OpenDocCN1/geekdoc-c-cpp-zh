    DUGALD MACPHERSON^a AND CHARLES STEINHORN^b


    # 4.1 Introduction


    This paper provides an overview of recent work by the authors and others on two
    topics in the model theory of finite structures. The point of view here differs
    from that usually asserted with the term ‘finite model theory’, as presented for
    example in [21] or [46], in which the emphasis and motivation come primarily from
    computer science. Instead, the inspiration for this work has its origins in contemporary
    (infinite) model theoretic themes such as dimension, independence, and various
    measures of the complexity of definable sets. Each of the topics deals with classes
    of finite structures for first-order logic that are isolated by conditions that
    are drawn from these model-theoretic considerations. Moreover, in both cases,
    connections to areas in infinite model theory such as stability and simplicity
    theory, and o-minimality by mathematical logicians and computer scientists whose
    work focuses on logical aspects of the subject.


    The first concerns asymptotic classes of finite structures. This subject has its
    origins in the model theory of finite fields, via the work of Chatzidakis, van
    Den Dries and Macintyre [13] (see Theorem 4.2.1) and the earlier model theory
    of finite fields defined by Ax [4], and ultimately rests on the Lang-Weil bounds
    for the number of points in a finite field of an irreducible variety defined over
    that. Given a first-order formula φ in the language of rings, the analysis in
    [13] provides estimates for the cardinality of the set defined by this formula
    in all finite fields in terms of two parameters, dimension and measure. Denoting
    the universe of a finite field by F, the cardinality estimate has


