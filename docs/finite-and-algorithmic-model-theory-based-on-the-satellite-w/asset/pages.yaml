    More generally, let VRS− denote the extension of VR with unary operations $X \to
    G_0 \_S X$ where $G_0$ is any finite graph. Moreover let us call a chain interpretation
    a subset interpretation in a tree where of the subsets presenting an element is
    linearly ordered by the ancestor relation of the tree. It is not hard to say that
    solutions of finite systems of VRS−equations are finite-chain interpretable in
    a regular tree and that these in turn are automatic [50].


    # 1.3.5 Rational graphs


    If we allow the more general asynchronous automata in the definition of an automatic
    presentation of a graph we get the notion of a rational graph. This vertices are
    labelled with finite words of rational language over some finite alphabet $\Sigma$,
    and the edge relations are required to be rational subsets of $\Sigma^* \times
    \Sigma^*$.


    With no aim for completeness we list some results on rational graphs (asynchronous)
    in comparison with automatic graphs (synchronous). For a comprehensive treatment
    the reader is referred to [105].


    The class of rational graphs strictly includes that of finite-word automatic graphs.
    In their seminal paper [87] Koussainov and Nerode introduced asynchronous automatic
    structures. As an example they gave an automatic presentation of $a^*$, which
    is not in $S$-$AutStr$ (see Theorem 1.4.12). Asynchronous automatic presentations
    of Cayley-graphs of finitely generated groups have also been considered generalisations
    of ''automatic graphs'' [31].


    The price of increasing expressiveness is loss of tractability: in general, rational
    graphs do not have a decidable first-order theory. This rational graphs useless
    for representing data, let alone programs. However, in the context of formal language
    theory rational graphs seem to fill a gap. Considering rational graphs as infinite
    automata, i.e. as acceptors of languages, Morvan and Stirling have shown that
    they trace exactly the context-sensitive languages [108, 107] (see also [34] for
    a simplified approach). Rispal and [123, 107, 34] have subsequently observed that
    this holds true for automatic graphs as well.'
