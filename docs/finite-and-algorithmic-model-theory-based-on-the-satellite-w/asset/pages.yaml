    A finer analysis of first-order-checking can be obtained by studying the problem
    in the framework of parameterized complexity (see [36, 46, 69]). The idea is to
    isolate the dependence of the running time on a certain part of the input, called
    the *parameter*, from the dependence on rest. We will treat parameterized complexity
    formally in Section 5.2.4. The parameterized first-order evaluation problem is
    the problem, given a structure A and a sentence $\varphi$ in FO, to decide whether
    $A \models \varphi$. The parameter is $|varphi|$, the length of the formula. It
    is fixed parameter tractable (FPT) if it can be solved in $f(|varphi|) \cdot |A|^c$,
    for some fixed $c$ and a computable function $f:\mathbb{N} \to \mathbb{N}$. While
    first-order model-checking is unlikely to be parameterized tractable in general
    (unless unexpected results in parameterized complexity), Courcelle''s theorem
    shows that even the more expressive monadic second-order logic becomes FPT on
    graphs of bounded tree-width. Hence, algorithmic metatheorems give us a much better
    insight into the structure of model-checking problems asking structural information
    into.


    In this paper we give an overview of algorithmic meta-theorems obtained so far
    and the main methods used in their proofs. As mentioned before, these theorems
    usually have a logical and a structural component. As for the logic, we will primarily
    consider first-order and monadic second-order logic (Section 5.2). For the structural
    component, most meta-theorems have been proved relative to some structure classes
    based graph theory, in particular on minor theory, such as classes of graphs of
    bounded tree-width, planar graphs, or H-minor graphs. We will therefore present
    the relevant parts of graph structure theory needed for the proofs of the theorems
    presented here.


