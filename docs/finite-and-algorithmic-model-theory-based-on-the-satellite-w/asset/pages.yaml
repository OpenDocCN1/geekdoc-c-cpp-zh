  md: "# 144 Dugald MacPherson and Charles Steinhorn\n\nIn infinite model theory,\
    \ the definition of o-minimality (see e.g., [20]) places a restriction on the\
    \ definable sets in one variable: a totally ordered structure is o-minimal if\
    \ every definable set is a finite union of open intervals and points. The Cell\
    \ Decomposition Theorem in this context yields topological and logical finiteness\
    \ properties for n-variable sets. By the following theorem, which might be viewed\
    \ as a combinatorial cell decomposition theorem, the story is essentially the\
    \ same for asymptotic classes, which we have chosen to have here to the focus\
    \ on the n-variable coordinate. The proof makes heavy use of (ii).\n\n**Theorem\
    \ 4.2.3** (Lemma 2.1.2 of [23]; Theorem 2.1 of [48]) Suppose that C is a class\
    \ of finite structures that satisfies Definition 4.2.2 (clauses (i) and (iii))\
    \ for n = 1, i.e. for definable sets in one variable. Then C is an N-dimensional\
    \ asymptotic class.\n\nIts proof, an induction on n, is analogous to that of the\
    \ Cell Decomposition arguments for o-minimal structures, For a definable subset\
    \ $X$ of $M^{n+1}$ let $\\pi : M^{n+1} \rightarrow M$ denote onto the first coordinate.\
    \ Then apply the definition to $\\pi(X)$ and the inductive hypothesis to the fibers\
    \ $X_a$ for $a \\in \\pi(X)$. For every pair $(d, \\mu)$ that $[a \\in M \\mid\
    \ h(X_a) = (d, \\mu)]$ is an $\theta$-definable subset of $M$, by clause (ii),\
    \ it has a specified dimension and measure.\n\nThe next section provides many\
    \ examples of asymptotic classes. A paradigmatic non-example—see Remark 4.5.2\
    \ (d)—observe that the collection of all finite total orders is not an asymptotic\
    \ class: if $\\varphi(x, y)$ is the formula $x < y$, as $a$ ranges through a totally\
    \ ordered structure $M$, $\\varphi(M, a)$ is a subset of $M$ of arbitrary size.\n\
    \n# 4.3 Examples of asymptotic classes\n\nThe most interesting of the examples\
    \ below are associated with finite fields. We see it as an area of significant\
    \ interest to find new classes of examples with no connection to finite fields.\n\
    \n**Example 4.3.1** The class of all finite fields forms a 1-dimensional asymptotic\
    \ class, by the main theorem of [13].\n\n**Example 4.3.2** A difference field\
    \ is a pair $(F, \\sigma)$ where $F$ is a field and $\\sigma$ is an automorphism\
    \ of $F$. Fix a prime $p$, and positive integers $m, n$ with $m \\geq 1, n > 1$,\
    \ and $(m, n) = 1$. Let $C_{(m,n,p)}$ be the collection of difference fields $(\\\
    mathbb{F}_{p^n}, \text{Frob}^k)$ where $k > 0$ and Frob denotes the Frobenius\
    \ automorphism"
