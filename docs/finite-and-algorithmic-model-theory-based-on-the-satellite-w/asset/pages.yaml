    \nA closer analysis of the Ehrenreucht-Fraïss game and notions of guarded equivalence\
    \ resulting from the two different formalisations would show that there is no\
    \ loss of expressiveness as far as properties of (strictly) guarded tuples are.\
    \ The only restriction concerns expressiveness at the quantifier-free level and\
    \ in boolean combinations, and this is inessential for many purposes. The difference\
    \ arises, trivially, because GF does not impose any restrictions on boolean combinations.\
    \ Analysis of the game shows, that any formula of GF (in the liberal format) is\
    \ logically equivalent to a boolean combination of quantifier-free formulae and\
