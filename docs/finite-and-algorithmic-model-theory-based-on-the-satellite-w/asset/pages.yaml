  md: '# Definability in classes of finite structures


    A basic local sentence has the form


    $$\exists x_1 \dots x_n \bigwedge_{1 \leq i < j \leq n} d(x_i, x_j) > 2r \, \
    \varphi^{S(x_i)}(x_j)$


    Gaifman''s Theorem asserts that every first-order $L$-sentence is logically equivalent
    to a combination of basic local sentences.


    Since $M_{n+1}$ includes some connected components whose union $U_n$ is isomorphic
    to $M_n$, it is clear that if $\sigma$ is a basic local sentence and $M_n \equiv
    \sigma$, then $M_{n+1} \equiv \sigma$; the witnesses of the existential quantifiers
    of $\sigma$ in $M_n$ have copies in $U_n$ that witness $\sigma$ in $M_{n+1}$.
    Thus, every basic local sentence is eventually true or false in $C$. The completeness
    of $T_C^{as}$ follows.


    It remains to verify near model completeness. An extension of Gaifman''s Theorem
    (see [28]) asserts that every formula $\varphi(x)$ is logically equivalent to
    a boolean combination of local formulas and basic local sentences. A local formula
    $\varphi^{(S,)}$ is a boolean combination of formulas which describe atomic diagrams
    of $S(x)$. Since there is a fixed upper bound on valency in substructures of $M$,
    the formula $\varphi^{(S,)}$ can itself be argued as a boolean combination of
    existential formulas. This yields near model completeness.


    Note that if $M$ has valency $d$, then it can be checked that $|M_{n+1}| \leq
    (d+2)|M_n|$ for all $n$. It follows that $|M_n| \leq (d+2)^n$ for each $n$. In
    particular, $C$ has exponential growth. We have not attempted to minimize growth
    and chain complexity for a chain with limit $M$.


    # 4.9 A robust approximation of $(\mathbb{Q}, <, +)$


    Our aim is to show that an o-minimal class can support some algebraic structure,
    the discreteness of finite total orders, and approximate an infinite o-minimal
    structure on which at least one algebraic operation is defined. The goal is to
    construct an o-minimal class whose direct limit is $(\mathbb{Q}, <, +)$. The dense
    ordering can easily be constructed by dovetailing embeddings as in 4.8.6; the
    difficulty lies in incorporating the group operation. Since ordered groups are
    torsion-free, hence not locally finite, the group operation must be given by a
    ternary relation symbol.


    **Theorem 4.9.1** *Let $L=\{<, 0, -, R\}$ is a unary function, and $R$ is a ternary
    relation. Then there is an o-minimal class $C$ such that $T_C^{as}$ is near model
    complete, and $T_C^{lim}$ is the theory of the divisible ordered abelian groups,
    with the addition function parsed as a ternary relation $R$.*'
