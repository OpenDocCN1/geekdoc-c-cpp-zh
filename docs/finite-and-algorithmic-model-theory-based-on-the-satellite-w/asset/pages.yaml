    (see [22]).


    Algorithmic meta-theorems lie somewhere between computational logic and algorithm
    or complexity theory and in some form a bridge between the two areas. In algorithm
    theory, an active research area is to find efficient solutions to otherwise intractable
    problems by restricting the class of admissible inputs. For instance, while the
    dominating set problem is NP-complete in general, it can be solved in polynomial
    time on any class of bounded tree-width.


    In this line of research, algorithmic meta-theorems provide a simple and easy
    way to show that a certain problem is tractable on a class of structures. Formalising
    a problem in M yields a proof for its tractability on classes of bounded tree-width,
    avoiding the task of working out the details of a solution using dynamic programming
    that is not always trivial to do often solved by hand-wavy arguments as “using
    standard techniques from dynamic programming ....


    Another distinguishing feature of logic based meta-theorems is the observation
    that for a wide range of problems, such as covering or colouring problems, their
    precise mathematical formulation can easily be translated into monadic second-order
    logic. Hence, ideally, instead of designing an explicit algorithm for solving
    a problem on bounded tree-width graphs, one can read off tractability directly
    from the problem description.


    Finally, algorithmic meta-theorems yield tractability results for a whole class
    of problems providing valuable insight into how certain algorithmic techniques
    range. On the other hand, in their negative form of intractability results, they
    also exhibit some limits to applications of certain algorithmic techniques.


    In logic, one of the core tasks is the evaluation of logical formulas in structures
    – a task underlying in a wide variety of areas in computer science from database
    theory, artificial intelligence to verification and finite model theory.


    Among the important logics studied in this context is first-order logic and its
    various fragments, such as its existential fragment known as conjunctive queries
    in database theory. Where first-order model-checking is PSPACE-complete in general,
    even on input structures with only two elements, it becomes polynomial time for
    every fixed formula. So what we possibly


