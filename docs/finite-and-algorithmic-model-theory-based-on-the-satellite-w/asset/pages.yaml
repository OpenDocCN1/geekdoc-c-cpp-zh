    pebble game which distinguishes whether two structures stably exactly the same
    $L^n$-sentences or not [23] and implicitly in [29].


    The notion of a type plays an important role in infinite model theory. In finite
    model theory the notion of an $L^n$-type, i.e. a type restricted to $L^n$-formulas,
    has been used; the number of different $L^n$-types of an $L^n$-theory can be seen
    as a measure of the complexity of the theory. Dawar observed [5] that for every
    $L^n$-type $T$ with finite models there is an upper bound, depending only on the
    number of $L^n$-types ($n$ free variables) of $T$, the size of the smallest model.
    Later Grohe proved that this upper bound is not recursive [17]. The language $L^n$
    has also been considered in the context of (only) infinite models by the work
    of Hedman [19] where complete theories (within full first-order logic) which are
    axiomatic by $L^n$-sentences are studied. For a general overview about interactions
    (and differences) between finite and infinite model theory, see [30]. For a survey
    about the use of finite variables in infinite model theory, see [16].


    Within infinite model theory the area of stability has had great influence. It
    studies quite a large class of "manageable"infinite) structures and their complete
    first-order theories. In the work of developing the basics of a stability theory
    for finite structures was first carried out by Hytten [21]. From a different viewpoint,
    the author developed some results, inspired by stability theory, at understanding
    when an $L^n$-theory with infinite models must also have arbitrarily large models
    [9, 8]. Further developments in this direction were made by Baldwin and Lessmann
    [2] and by Hyttinen [22]. For an overview, with a historical perspective, of finite
    and infinite model theory and recent interactions between them, see [1].


    Another approach to understanding finite and countable structures culminates with
    the work of smoothly approximable structures in [3]. This line of research started
    with Lachlan''s work on stable finitely homogeneous structures (surveyed in [27])
    and Zilber''s work on uncountable categorical structures [33]. It continued with
    work by Cherlin, Harrington and Lachlan on $\omega$-categorical $\omega$-stable
    structures [4] and then with the work of Kantor, Lieber and Macpherson [24], to
    reach its current state in [3]. Smoothly approximable structures are infinite
    but can be approximated by "nicely embedded" finite structures "regular". The
    theory of smoothly approximable structures can also be seen as a study of finite
    structures with few types.


    More recently, a direction of research initiated by Macpherson and Steinhorn [28]
    and continued by Elwes [13, 14] and Ry classes of finite structures in which definable
