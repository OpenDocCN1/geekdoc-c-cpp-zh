    # 1.5.1 Model theory restricted to the class of word-automatic structures


    Blumens shows that, as expected, certain notions of model theory fail when restricted
    to the class of automatic structures.


    **Proposition 1.5.1** (i) *It is undecidable whether an FO-formula has a word-automatic
    model.*


    (ii) *The following properties fail on the class of word automatic structures:
    compactness, Beth, Interpolation, and Ł-Tarski.*


    The proofs are based on the observation that there is a FO formula which has automatic
    models of every finite cardinality but no infinite automatic models.


    # Löwenheim-Skolem


    An automatic version of the Downward Löwenheim-Skolem Theorem would say that every
    $\omega$-automatic structure has a countable substructure that is also $\omega$-automatic.
    Unfortunately this is false since there is a first-order theory with an $\omega$-automatic
    model but no $\omega$-automatic model. Indeed, consider the first-order theory
    of Boolean Algebras. Kuseh and Lohrey [94] have observed that there is an uncountable
    $\omega$-automatic model (namely the from Example 1.3.12.iv). However, Khoussainov
    et al. [88] show that the countable Boolean algebra is not automatic and so, by
    Theorem 1.4.20, not $\omega$-automatic either.


    Here we close to get an automatic Downward Löwenheim-Skolem Theorem for $\omega$-automatic
    structures.


