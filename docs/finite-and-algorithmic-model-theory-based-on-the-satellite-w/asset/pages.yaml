  md: '# Some connections between finite and infinite model theory


    If we allowed function symbols in the language $L_k$ appearing in the definition
    of $f$, then we would have infinitely many formulas of rank at most $n \leq k+n$
    (even quantifier free formulas) that are non-equivalent. When we compute $f$ we
    find that (with the stated definition) there are only finitely many non-equivalent
    $L_k$-formulas with quantifier rank at most $k+n$.


    **Definition 3.5.3** $T$ be a complete $L^n$-theory. In the previous sections
    we associate a uniformly finite closure operation $cl$ over models of $T$. We
    define a complete function $cl^n: \omega \to \omega$ as follows:


    ```

    $cl^n(n) = \max|cl(A)| : A \leq M \equiv T, |A| \leq n$.

    ```


    **Corollary 3.5.4** $T$ be a complete $L^n$-theory such that $S_n^n(T)$ is finite
    and let cl be the closure operation associated with models of $T$. Assume that
    $n \geq cl^*(4)$ and that the vocabulary of $L$ contains no function symbols and
    that the arity of every relation symbol is at most $m$. If $M \equiv T$, $M$ is
    smoothly approximable and $|S_m^*(\emptyset, M)| = |S_{cl^*(4)}(\emptyset, M)|$,
    then $\varphi$ has a finite model of cardinality at most $f(n, |S_n^n(\emptyset,
    M)|)$ where $S_n^n(\emptyset, M) = S_n^n(T)$.


    *Proof.* Suppose, $T$ and $M$ satisfies the premises of the corollary. By renaming
    symbols if necessary we may assume, without loss of generality, that $L \subseteq
    L_k$ where $L_k$ is the language occurs in the definition of $f$, with $k = |S_n^n(T)|$.
    By Fact 3.2, $T$ is axiomatized by an $L^n$-sentence with quantifier rank at most
    $|S_n^n(T)| + n = k+n$. Since $M$ is smoothly approximable it follows that $M$
    has a finite substructure $N$ such that $N \equiv T$ and $|S_4^*(\emptyset, N)|
    \leq |S_4^*(\emptyset, M)| \leq |S_{cl^*(4)}(\emptyset, M)| \leq |S_{cl^*(4)}(\emptyset,
    M)| \leq |S_n^n(\emptyset, M)| = k$. From the assumptions that $n \geq cl^*(4)$
    and $|S_{cl^*(4)}(\emptyset, M)| = |S_{cl^*(4)}(\emptyset, M)$ it follows that


    $S_4(\emptyset, N)| \leq |S_4(\emptyset, M)| \leq |S_{cl^*(4)}(\emptyset, M)|
    \leq |S_{cl^*(4)}(\emptyset, M)| \leq |S_n^n(\emptyset, M)| = k$.


    By the definition of $f$, there is a model of $T$ with cardinality at most $f(n,
    |S_n^n(\emptyset, M)|)$.


    **Corollary 3.5.5** $n \geq 4$ and let $L$ be a language with finite vocabulary
    which contains no function symbols and in which all relation symbols have arity
    at most $m$. If $T$ is a complete $L^n$-theory that


    +   * $S_n^n(T)$ is finite,

    * $n \geq cl^*(4)$,

    * for every $M \equiv T$ and every $A \leq M, cl(A) = A$, or $T$ has the strong
    $L^n$-amalgamation property over countable models, and

    * there is a stable $L^n$-amalgamation class for $T$ (with respect to cl)


    then $T$ has a model of cardinality at most $f(n, |S_n^n(T)|)$.'
