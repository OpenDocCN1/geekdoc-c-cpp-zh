  md: '# Locally acyclic bisimilar covers


    Recall that a transition is *simple* if it does not have loops or multiple edges
    (not even in opposite directions); it is called $\ell$-acyclic if every $\ell$-neighbourhood
    in the Gaifman graph is acyclic (this forbids undirected cycles of lengths up
    to $2\ell + 1$).


    **Definition 6.3.6** A bisimilar cover $\pi : \mathfrak{A} \to \mathfrak{A}''$
    is a homomorphism $\pi$ whose graph is a global two-way bisimulation: $\mathfrak{a},
    \mathfrak{a}'' \approx \mathfrak{a}''$ for all $\mathfrak{a} \in \mathfrak{A}$.
    We call $\pi$ *faithful* if it preserves in- and out-degrees w.r.t. every individual
    relation $E_a \in \tau$.


    A (faithful) simple $\ell$-acyclic cover of $\mathfrak{A}$ is a (faithful) bisimilar
    cover $\pi : \mathfrak{A} \to \mathfrak{A}''$ as a simple $\ell$-acyclic $\tau$-structure.


    **Lemma 6.3.7** *Every $\tau$ transition admits, for every $\ell$, a finite simple
    $\ell$-acyclic cover.*


    The construction in [42] uses for $\mathfrak{A}''$ a product with a finite group
    $G$ which has a generator $g$ for every edge $e \in \E_{\mathfrak{A}}^u$ and such
    that the Cayley graph of $G$ w.r.t. this set of generators has greater than $2\ell
    + 1$ (compare [1] for such groups) — as the unfolding could be described in terms
    of a product with the infinite free group of this set of generators. The Cartesian
    product $A \times G$ puts an edge precisely from $(a, h)$ to $(b, k)$ if $e =
    (a, b) \in \E_{\mathfrak{A}}^u$ and $k = h \circ e$. In this fashion, any cycle
    in the product projects to a cycle in the Cayley graph of $G$, and hence its length
    is bounded by the growth of that graph.


    The following is a simple auxiliary observation towards an $\ell$-local upgrading
    of $\ell$-bisimulation equivalence to $\equiv_{\ell}$. A natural strategy for
    II will be based on maintaining full isomorphism of the substructures generated
    by the paths connecting the elements of the current graphs to the roots [14].


    **Observation 6.3.8** Let $\mathfrak{a} \sim_{\ell} \mathfrak{a}''$, be two $\tau$-trees
    of depths $\ell$ with roots $\mathfrak{a}$ and $\mathfrak{a}''$, where every node
    part of the root is one of at least $q$ bisimilar siblings. Then, $\mathfrak{a}
    \equiv_{\ell} \mathfrak{a}''$. The same holds w.r.t. two-way $\ell$-bisimulation
    equivalence in acyclic $\ell$-neighbourhoods $\mathfrak{N}^\ell(\mathfrak{a})$
    and $\mathfrak{N}^\ell(\mathfrak{a}'')$ with at least $q$ equivalent siblings
    to choose from every node.


    Structures that have at least $q$ equivalent successors/predecessors in every
    node are easily obtained by taking products with $\{1, \dots, q\}$ in the natural
    manner. We write $a \mapsto a \mathbin{\otimes} q$ for this transformation, and
    identify a distinguished element $a$ with $(a, 1)$ in the new structure be appropriate.'
