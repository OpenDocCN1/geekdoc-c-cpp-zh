    lemma.


    **Lemma 5.8.9** For $k \in \mathbb{N}$ let $\mathcal{AD}_k$ be the class of graphs
    of maximum average degree at most $k$, where the maximum average degree of a graph
    $G$ is the maximum of the average degree of all subgraphs of $G$. For $k \geq
    4$, MC(FO, $\mathcal{AD}_k$) is AW[*]-hard, i.e. fixed-parameter intractable.


    *Proof.* Recall from Section 5.2.4 that MC(FO, Graph), the model-checking problem
    for FO on the class of all finite graphs, is AW[*]-complete. Further, FO model-checking
    on the class of all graphs $G$ can easily be reduced to FO-checking on the class
    of incidence graphs $I(G)$. Incidence graphs have maximum average degree at most
    4, the result follows immediately.


    Hence, graph classes of bounded maximum average degree provide a non-trivial upper
    bound for parameterized tractability of FO model-checking.


    Towards another graph property that may yield fixed-parameter algorithms for first-order
    logic, consider again the proof of the previous lemma. Essentially, given a graph
    $G$ subdivide every edge once to obtain the incidence graph. For first-order logic,
    this does not pose much of a problem as we can easily rewrite the graph by a path
    of length $k$, i.e. subdivide bounded number of times, then again we obtain small
    maximum average degree but we can easily rewrite first-order formulas to deal
    with these paths of fixed length.


    Note that we replace every vertex, e.g. in the case of $k=3$ we replace every
    vertex by a star. Hence, if we are interested in paramameterized tractability,
    we should require our graphs to have bounded maximum average degree even after
    we contract neighbourhoods of a fixed radius. This idea is formal in the notion
    of bounded expansion introduced by Nešetřil and Ossona de Mendez [65, 66, 67].


    An even more general concept of graphs is the concept of graph classes which are
    *dense*, introduced by Nešetřil and Ossona de Mendez in [68].'
