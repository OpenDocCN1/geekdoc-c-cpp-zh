  md: '# 1

    Automata-based presentations of infinite structures


    VINCE BÁRÁNY¹, ERICH GRÄDEL² AND SASHA RUBIN³


    #  1.1 Finite presentations of infinite structures


    The model theory of finite structures is intimately connected to various fields
    in computer science, including complexity theory, databases, and verification.
    In particular, there is a close relationship between complexity classes and the
    expressive power of logical languages, as witnessed by the fundamental theorems
    of descriptive complexity theory, such as Fagin’s Theorem and the Immerman-Vardi
    Theorem (see [78, Chapter 3] for a survey).


    However, for many applications, the strict limitation to finite structures has
    turned out to be too restrictive, and there have been considered efforts to extend
    the relevant logical and algorithmic methodologies from finite structures to suitable
    classes of infinite ones. In particular this is for cases and verification where
    infinite structures are of crucial importance [130]. Algebraic model aims to extend
    in a systematic fashion the approach and methods of finite model theory, and its
    interactions with computer science, from finite structures to finitely-presentable
    ones.


    There are many possibilities to present infinite structures in a finite manner.
    A classical approach in model theory concerns the class of computable structures,
    these are countable structures, on the nature of natural numbers, with a finite
    collection of functions and relations. Such structures can be finitely presented
    by a collection of algorithms, and they have been intensively


