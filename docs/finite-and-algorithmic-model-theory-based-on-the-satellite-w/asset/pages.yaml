    We can now state the following theorem (Benedikt et al., 2006):


    **Theorem 2.2** *The first-order topological properties of plain sets are precisely
    those expressible in CL.*


    This theorem can be proven in six steps:


    +   1. Characterize when plain sets $A$ and $B$ are topologically elementary equivalent
    in terms of codes;

    2. Define flower datasets as a normal form with respect to topological elementary
    equivalence;

    3. Apply collapse theorems over finite structures over the reals;

    4. Encode the topological content of flower datasets by abstract finite structures,
    called *codes*;

    5. Translate topological sentences about spatial datasets into sentences about
    codes;

    6. Establish invariance arguments over over. codes.


    Let us go into these six steps in some more detail. For the full proof, we refer
    to the paper (Benedikt et al., 2006).


    **Topological elementary equivalence** For plain sets $A$ and $B$, write $A \equiv
    B$ if $A$ and $B$ are indistinguishable by topological first-order sentences.


    We have the following theorem (Kuijpers et al., 2000), which plays a crucial role
    in the proof of Theorem 2.2:


    **Theorem 2.3** $A \equiv B$ if and only if $A$ and $B$ have precisely the same
    codes, with the same multiplicities.


    An illustration of this theorem is given in Figure 2.3.

