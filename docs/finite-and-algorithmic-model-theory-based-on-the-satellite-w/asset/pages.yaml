  md: "# Definability in classes of finite structures 173\n\nWe now finish the proof\
    \ of the theorem. First we assert that $T^{as}$ is near model complete. By Claim\
    \ 4.9.2, it follows for all $\bar{a} \\in M \\models T^{as}$ and substructures\
    \ $A$ of $M$ that $\text{tp}(\bar{a}/A)$ is determined by the collection of formulas\
    \ which describe the quantifier-free type of $\bar{a}$ over $hull(A)$. Such formulas\
    \ are boolean combinations of existential formulas over A. From this and Proposition\
    \ 4.7.4, it follows that $C_S$ is robust. As $C_S$ is totally ordered, we also\
    \ see that $T_S^{as}$ is complete.\nIt remains only to check that $C_S$ is o-minimal.\
    \ Let $G := C_S$, with $x+y=z$ parsed as $R(x, y, z)$. It is evident that $G$\
    \ is isomorphic to $(\\mathbb{Q}, <, +)$, and hence is o-minimal. The optimality\
    \ of $C_S$ then follows immediately from the near model completeness of $T_S^{as}$\
    \ and Proposition 4.7.7.\n\n**Remark 4.9.3** By varying the embeddings, we may\
    \ find, for any $S \\in S$ other robust classes $C'$ with the same asymptotic\
    \ theory $T^{as}$ but different limit theories. For example, we may realize the\
    \ infinite cyclic group $\\mathbb{Z}$ as $\\lim C'$, by putting $C' = C$, equipped\
    \ with the identity embeddings.\n\nWe expect a variation of this argument should\
    \ allow us to construct $(\\mathbb{Q}, +)$ as the limit of a strongly minimal\
    \ robust class. It is an open problem to construct an o-minimal robust class whose\
    \ limit is a real closed field."
