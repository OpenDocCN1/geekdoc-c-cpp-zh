    \ logic\n\nIn most general terms, a *spatial dataset* is any set $S \\subset \\\
    mathbb{R}^n$ for some $n$. Equivalently, we can view such a set as an $n$-ary\
    \ relation $S$ over $\\mathbb{R}$ (using Cartesian coordinates). Viewing $\\mathbb{R}$\
    \ as a structure $\\mathbb{R} = (\\mathbb{R}, 0, 1, +, -, <)$ over the language\
    \ of ordered fields, we can then use first-order logic to express properties of\
    \ spatial datasets.\n\nFor example, the sentence\n\n```\n$\\exists a \\exists\
    \ x \\forall y (S(x, y) \rightarrow y = a \\cdot x + b)$\n```\n\nexpresses that\
    \ $S \\subset \\mathbb{R}$ lies on a straight line.\n\nSince the structure on\
    \ $\\mathbb{R}$ in this paper remains the same, we abbreviate $(\\mathbb{R}, S)\
    \ \\equiv \\phi$ as $S \\equiv \\phi$.\n\n# 2.3 Capturing first-order geometric\
    \ properties\n\nAccording to Felix Klein's Erlangen Programm, a geometric theory\
    \ can be characterized by the group of transformations that preserve the fundamental\
    \ geometric properties of the theory. Some examples:\n\n| geometry | group of\
    \ transformations |\n|---|---|\n| Euclidean | similarity |\n| affine | affinity\
    \ |\n| topology | continuous |\n\nFix such a group $G$ of transformations of $\\\
    mathbb{R}^n$, and consider some property $\\phi$ of datasets in $\\mathbb{R}^n$.\
    \ We naturally define $\\phi$ to be $G$-geometric if it is invariant under $G$,\
    \ or formally:\n\n```\n$\\forall g \\in G : S \\equiv \\phi \\leftrightarrow g(S)\
    \ \\equiv \\phi$\n```\n\nLet us see some examples:\n\n+   * “$S lies on a circle”\
    \ is Euclidean, but not affine.\n* “$S lies on a straight line” is affine, but\
    \ not topological.\n* “$S has dimension two” is topological."
