    # Equational graphs and hyperedge-replacement grammars


    Hyperedge-replacement (HR) grammars are a very natural generalisation of

    context-free grammars from formal language theory. HR-grammar

    defines a ''language'' of finite graphs just as context-free grammars define-

    uages of finite vertices. The class of graph languages defined by HR-graphs

    possesses many structural properties akin to those well-known for context-free\languages.
    The interested reader is referred to the monograph [80].


    An HR-graph is given as a finite collection of rules that allow the replace-

    ment of any hypergraph bearing a non-terminal label by the

    right side of a matching rule, which is a given finite hypergraph with

    a number of distinguished vertices equals to the arity of the hypergraph to be

    replaced. A copy of the right-hand side of a matching rule is then glued to the

    original hypergraph precisely at these distinguished vertices and correspond-

    ing ends of the hypergraph being replaced. Derivation begins with

    distinguished non-terminal.


    As outlined at the start of section 1.2.2, each deterministic HR-grammar

    determines a unique countable graph constructed from the initial graph by

    complete rewriting in the course of every non-terminal hypergraph is

    event replaced by the right-hand side of the unique matching rule. A\countable
    graph is HR-equational, or simply equational, if it is generated

    by a deterministic HR grammar [55]. The class of equational graphs is

    denoted by HR. Equational graphs constitute a proper extension of the class of

    context-free graphs [41].


    Proposition 1.2.5 A connected graph is context-free if, and only if, it is

    equational and of finite degree.


