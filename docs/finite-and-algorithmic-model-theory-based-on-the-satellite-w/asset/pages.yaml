    Smoothly approximable structures which are not $\omega$-stable are all unstable.
    Indeed, any $\omega$-categorical structure which is not $\omega$-stable interprets
    a pseudoplane [43], and by [18], Corollary 5.5.5) a pseudoplane cannot be interpreted
    in any smoothly approximable structure. However, smoothly approximable structures
    are a simple theory—see Remark 4.5.2(c) for basic facts about simple theories,
    and [62] for a general source – and in fact they are supersimple of finite rank
    (see Remark 4.5.2). Indeed, crucial ideas in simplicity theory, such as the Independence
    Theorem, first appeared in [18] (see e.g. Section 5.1 and Proposition 8.4.3 of
    [18]). They are 1-based (see Section 4.5 for the definition; that they may be
    found in [18]), and thus in particular, no infinite field is definable. Although
    finite fields play a key role in any family of finite approximating structures,
    any field remains fixed throughout the family.


    All groups in a smoothly approximable structure are finite-abelian-by-finite (see
    [18]). As noted in Section 4.6 (see Proposition 4.6.2 ff), extras $p$-groups of
    exponent $p$ are smoothly approximable and finite-by-abelian, but not abelian-by-finite.


    Cherlin and Hrushovski define the notion of a *Lie coordinizable structure*. which
    is, roughly speaking, coordinatable by a tree of finite height Lie geometries.
    A key fact proved in [18] is that the Lie coordinizable structures are exactly
    the smoothly approximable structures. Arguments by induction on the height of
    the coordinating tree are then often used.


    Smoothly approximable structures are also *quasi-finitely axiomatizable*. This
    means that the theory is axiomatized by a single sentence together with a schema
    of axioms where each ‘orthogonality class’ of Lie geometries (again, see [18])
    is infinite dimensional. In particular, if the smoothly approximable structure
    is unidimensional, that is, any two interpretable Lie geometries are non-orthogonal,
    then the theory is axiomatized by a single sentence together with, for each $n$,
    a sentence which has size at least $n$. This generalizes a result of Hrushovski
    [32], itself extending the work of Ahlbrandt and Ziegler [11], that all categorical
    structures are quasi-finitely axiomatized in this last sense.


    Built into coordinizability is a theory of the *envelopes* — that is, the finite
    approximating substructures of smoothly approximable structures. There are precise
