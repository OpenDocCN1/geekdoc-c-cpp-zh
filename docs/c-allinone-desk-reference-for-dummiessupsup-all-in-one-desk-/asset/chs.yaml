  \ 语言使用了一个称为*指针 (pointer)*的工具.\n\n### `指针对简单定义`\n\n*A *指针(*pointer*)是一个存储着某个特定数量的整型数字(即另一个位置的编号)所对应的存放某种数据的物理磁道或槽位的起始点的形成的特殊量!这种简单而又基础的功能是非常有趣且令人惊奇的东西....同时也是一种可以获得完全解放的方法?实际上这里你可能并不想让自己局限于仅仅只是拥有一块可以用自己手中的手柄来回晃动并以毫无意义的方式拨打出去的新玩物...我觉得更确切的说应该是在正常的梯形结构中进行不同层级节点的转移而构建出一个全新的图景来哦不我又跑题了.....*\n\
  \n正解 : **A ***_Pointer_** is simply the term used in Computer Science & Programming\
  \ for describing being able to store within one piece of data (*the variable that\
  \ holds it.) what literally pin points exactly where inside computer's Random Access\
  \ Memory another value lives.* \n\n虽然在初看时显得有些傻气;为何要费心折腾于繁琐复杂的指标及内存储器读取法当我们想要改变一下某已定义过的项目里面的原有内容的状态以影响到整个程序的运行情况可以很轻松地通过一行简单的赋值语句实现连外行人都看得懂的内容如：\n\
  \na = b;\n\n然而借助此技巧我们所能达成的实际能力远不止更改数值这么简单位面的变化就能例外排除那些由它所独占的特殊领域里才能进行的深层次资源调控意图从而构造出其他编程语境下无法复制的强力特性.当然这样的领悟过程绝没办法一蹴而成并且有必要防止操之过急导致理解上的错位在此书中我们将循序渐进的缓缓揭开关于指示标方面的种种要领.*\n\
