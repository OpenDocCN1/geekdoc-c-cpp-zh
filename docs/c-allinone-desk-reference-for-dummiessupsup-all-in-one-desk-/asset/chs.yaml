  \n函数如何返回值？这正是方便的`return`关键字发挥作用的地方。\n\n你在每个程序中一直为每一个程序中的每一个 `main()` 函数的末尾键入 `return(0);'\
  \ 。这是因为 main() 是一个 int 类型的函见并且需要在其执行完毕后向操作系统返回一个整数值。\n![TechnicalStuff](img/TechnicalStuff.jpg)\n\
  \n操作系统实际上并不会使用程序所返回的值，但它会将该值提供给其他程序进行检视查询。你可参见本书第五卷（Book V）第 2 章中关于处理退出状态的相关章节来了解具体做法。\n\
  \n下面是正式介绍 return 关键字的说明：\n\n```\nreturn(*something*);\n```\n\n这里的 *something*是必须由该子历程给出的内容\
