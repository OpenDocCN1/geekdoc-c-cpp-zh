  \ equal to）与“赋值”（equals）\n\n当你使用逻辑运算符编写复杂的、多次比较的代码时，你很容易忘记 `==` 的意思是“等于”（is equal\
  \ to），而 `=` 的意思是“赋值”（equals）。你必须记住这种区别，因为编译器*确实*会将单个 `=` 符号评估为一个 TRUE 比较。\n\n例如，为了检查两个值是否相等，会进行如下比较：\n\
  \n```\na==b\n```\n\n这一行是一个比较。它的意思是“如果变量 `a` *等于* 变量 `b`。”结果是 TRUE 或 FALSE。现在考虑这个例子：\n\
  \n```\na=b\n```\n\n这一行是一个赋值语句。它的意思是“变量 `a` 的值等于（或赋值为）变量 `b` 的值”。该操作的结果是变量 `b` 的值：当\
  \ `b` 非零时，结果被视为 TRUE；当 `b` 为零时，结果为 FALSE。无论如何，该结果都不是比较。\n\n你某天可能会在代码中遇到一个由细微错误导致的疯狂\
  \ bug，例如忘记使用 `==` 或用 `=` 代替了 `==`。请记住这种区别！\n\n### 练习 1.10.2\n\n编写另一个版本的 `CHILLY.C`\
