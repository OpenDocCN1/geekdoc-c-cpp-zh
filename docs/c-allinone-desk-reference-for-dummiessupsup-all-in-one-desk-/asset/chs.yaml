  \n## 更多的比较！\n\n下面的程序使用 `if` 来进行小于比较。看看你是否能看出它与本章之前展示的其他 `if` 程序有何不同：\n\n```c\n#include\
  \ <stdio.h>\n\nint main()\n{\n    float temp;\n    printf(\"What is the temperature\
  \ outside?\");\n    scanf(\"%f\",&temp);\n    if(temp < 65)\n        printf(\"My\
  \ but it’s a bit chilly out!\\n\");\n    return(0);\n}\n```\n\n漏掉了什么吗？是的！在 `if`\
  \ 语句后面没有出现大括号。这没关系；当只有一条语句属于 `if` 时，大括号是可选的。该语句仍然以分号结束，这使其成为属于 `if` 的最后一个（也是唯一的）语句。\n\
  \n注意，在 във一个例子中，属于 `if` 的语句是缩进的。这纯粹是为了可读性；编译器并不在乎代码如何缩进。事实上，你也可以将语句写在一行，如：\n\n```c\n\
  if(temp < 65) printf(\"My but it’s a bit chilly out!\\n\");\n```\n\n将此代码保存到磁盘上 `CHILLY.C`。编译并运行。尝试几个温度来让程序展示它的魔术。\n\
