  \n\n\n\n\n\n\n在 C 语言中，链表比固定数组更好。因为数组无法调整大小，而链表可以根据需要（或内存允许）变得非常大或非常小。\n\n链表的实现依赖于指针：会创建一个结构体大小的新内存块，然后通过一系列指针帮助填写、引用和组织链表。从之前的章节您可能已经认识到这些指针：\n\
  \n- `first` 始终指向列表中的第一个元素\n- `current` 始终指向当前元素  \n- `current->next` 表示下一个元素的地址；若为最后一个节点则为\
  \ NULL \n- `new` ：要添加到链接表的新结构的生成方法 \n\n> **注意**:不能再将 C++保留了名字空间——“New”成为唯一关键字变量名？实际上需避开常用词来命名四种标准连接的四个关键数据类型的名称更为合理\n\
