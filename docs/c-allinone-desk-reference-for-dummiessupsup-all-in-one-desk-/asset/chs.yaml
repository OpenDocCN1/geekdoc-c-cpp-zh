  \n\n\n我不得不一吐为快：目录只是一种幻象。所谓*目录*，不过是磁盘上一个列出其他文件信息的小型数据库文件而已。这个数据库中保存着文件的名称、日期、时间、大小、权限、属性以及其他琐碎信息。它也包含操作系统在磁盘上其他地方定位该文件数据所需的信息。\n\
  \n当操作系统向你报告磁盘上的内容时，它仅仅是在汇报存储在\"目录或数据库\"中的信息罢了（译注）。它不会把所有细节都列出来——不过对人类而言也没必要了解全部——但展示出来的已经足够了。（原文此处为英文翻译后保留）\n\
  \n子目录只是位于磁盘其他位置的另一个数据库文件而已——就像普通文件一样拥有一个条目,但实际上仅仅是引用另一份别处的数据而已.\n\nC 语言提供了一些工具让您可以访问这个“文件夹列表(database)”。您可以使用这些工具来查找特定文件名,列举盤上可用的所有项目或者搜集具体技术资料；接下来的章节将详细介绍相关内容：\n\
