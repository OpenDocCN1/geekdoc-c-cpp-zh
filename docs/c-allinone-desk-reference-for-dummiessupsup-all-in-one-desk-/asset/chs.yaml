  \n## 做出决策\n\n偶尔，程序根据超过两个可能的结果做出决策。例如，考虑 `CHILLY.C` 程序的修改版，当温度高于 80 时也显示 `My but\
  \ hot out`。如何实现？\n\n## else if 救星！\n\n向 `else if` 组合问好。通过使用 `else if`，你可以将多个 `if`\
  \ 语句堆叠在一起，将复杂的决策树缩小为各种结果：\n\n```c\n#include <stdio.h>\n\nint main()\n{\n    float\
  \ temp;\n    printf(\"What is the temperature outside?\");\n    scanf(\"%f\",&temp);\n\
  \    if(temp < 65)\n    {\n        printf(\"My but it’s a bit chilly out!\\n\");\n\
  \    }\n    else if(temp >= 80)\n    {\n        printf(\"My but it’s hot out!\"\
  );\n    }\n    else\n    {\n        printf(\"My how pleasant!\");\n    }\n    return(0);\n\
  }\n```\n\n修改你的 `CHILLY.C` 源代码使其类似于这种结构。这是在 C 中处理多种条件的方法。\n\n第一个比较是由第 9 行的 `if` 进行的。如果变量\
  \ `temp` 的值小于 65，则执行属于 `if` 的语句；构造的其余（第 13 到 20 行）将被跳过。\n\n当第一个比较为假时，由第 13 行的 `else\
  \ if` 进行比较。如果该比较为真，则执行 `else if` 的语句；第 17 到 20 行将被跳过。\n\n最后，当 `if` 和 `else if` 比较都为假时，执行属于\
  \ `else` 的语句（第 17 行）。\n\n将这个“怪物”保存到磁盘。编译。运行三次，每次都输入一个高、中、低温度。计算机看起来可能很聪明，但它只是在进行比较并控制程序流。\n\
