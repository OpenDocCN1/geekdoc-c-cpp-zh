  \n\n\n除了定义所有标准 I/O 函数（例如`printf`、`gets`、`fopen`和 `getchar`) 之外，STDIO.H 还定义了**stdin**、**stdout**和\
  \ **stderr**,允许你在程序中使用它们进行输入、输出和错误输出。\n\n## 标准 I/O 演示\n\n因为你很可能是在图形操作系统而非命令提示符系统中成长的，本节的教程应帮助你理解文件和标准\
  \ I/O。首先是一些示例代码：\n\n```c\n#include <stdio.h>\n\nint main()\n{\n    char ch;\n  \
  \  while((ch = fgetc(stdin)) != EOF)\n        fputc(ch, stdout);\n    return(0);\n\
  }\n```\n\n将这段源代码键入你的编辑器并保存为磁盘上的文件名 IO.C 。编译该程序并将输出的可执行文件命名为 **IO**.暂时不要运行它。\n\n\
  此段介绍了两个新功能：*字符读取自文件的*fgetC()以及 *字符写入到文件的*fputC()`；它们是 getChar（）与 putChAr 方法在操作“特定设备”（如硬盘等存储介质）时相对应的处理版本——作用原理基本相同:逐个字节地从一处获取/存放信息至另一位置以使用这两个方法来完成任务即可大致完成预期目的.核心区别就在于前者针对的源往往是静态存在的实际载体而后者则可能是动态变化的抽象形式.\n\
  \n这条消息解释道 `<%@ page import=\"java.util.*\" %>`\n\n\n\n以下源代码创建了一个简单的 `rot13` 过滤器。该程序使用\
  \ `stdin` 从标准输入设备（键盘）读取数据，然后通过将字母字符旋转 13 位来修改文本，最后利用 `fputc()` 函数将结果发送到标准输出设备 `stdout`：\n\
  \n```c\n#include <stdio.h>\n#include <ctype.h>\n\nint main()\n{\n    char ch;\n\
  \    while( (ch = fgetc(stdin)) != EOF)\n    {\n        if(isalpha(ch))\n      \
  \  {\n            if(toupper(ch) >= 'A' && toupper(ch) <= 'M')\n               \
  \ ch += 13;\n            else\n                ch -= 13;\n        }\n        fputc(ch,\
  \ stdout);\n    }\n    return(0);\n}\n```\n\n将源代码保存到磁盘上路径为 `/path.to/ROT13.C`。编译它。如有必要修正错误并重新编译。\n\
