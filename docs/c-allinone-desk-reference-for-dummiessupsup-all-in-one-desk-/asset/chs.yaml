  );\n        puts(\"解决方案：搬家.\");\n    }\n    else if(code == 2)\n    {\n        puts(\"\
  非法操作\");\n        puts(\"解决方案：找另一个医生.\");\n    }\n    else if(code == 3)\n    {\n\
