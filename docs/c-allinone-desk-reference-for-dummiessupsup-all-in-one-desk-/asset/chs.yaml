  \n\n\n\n将此源代码输入你的编辑器中。将其保存到磁盘并命名为 `BASES.C`。（我知道，它应该命名为 `PODS.C`，但这个程序并不是关于豆人接管世界，尽管这是不可避免的。）编译并运行：\n\
  \n十进制：\n\n我向旧金山运送了 50 个胶囊。\n\n## 二进制，Base 2\n\n计算机不是人类。它们是非人性的！因此，它们不以十进制（base 10）计数。计算机没有\
  \ 10 根手指。不，它们只有自己可以用来计数，所以它们只使用 `0` 和 `1` —— 这两个数字 —— 这两个构成了二进制计数系统。\n\n在计算机内部，当你指定\
  \ 50 个胶囊时，这个数字看起来像这样：\n\n```\n110010\n```\n\n这就是 50 在二进制下的样子。你不需要在这里深入研究二进制；`printf()`\
  \ 函数缺乏一种显示二进制的方法——可能是因为很少程序需要二进制输出，而且很少有人知道该如何处理它。不，目前，让二进制留存在计算机内部吧。\n\n（C 语言确实有各种工具来处理二进制位，或\
  \ `bits`。第三本书第 4 章涵盖了 C 中的二进制信息。）\n\n## 六进制，Base 16\n\nBase 16 计数被称为十六进制系统。`hex`\
  \ 这个词来自希腊语 `hexe`，意思是“巫术”或某物的 16 个。在十六进制中，你像这样计数：\n\n1, 2, 3, 4, 5, 6, 7, 8, 9,\
  \ A, B, C, D, E, F, 10, 11, 12, 13, 14 . . .\n\n字母 A 到 F 用于表示值 10 到 15。十六进制值 10\
  \ 是 16，11 是 17，以此此类推。\n\n你可以很容易地识别出一个十六进制数，因为它通常包含一个字母，如 `C800`。尽管如此，为了避免将十六进制数与十进制混淆，数字以\
  \ `0` 和 `x` 作为前缀，例如：\n\n```\n0xC800\n0x10\n0xFFFF\n```\n\n在计算机世界中，十六进制程序员为二进制值使用巧妙的快捷方法。正如你以后可能发现的，计算机中到处都是二进制值，这使得十六进制快捷方法变得更加有用。\n\
  \n通常，二进制值被分成四位（二进制数字）一组，以便于阅读。这个示例：\n\n```\n1011101000111100\n```\n\n变为：\n\n```\n\
  1011 1010 0011 1100\n```\n\n然而，程序员更倾向于十六进制，它可以很容易地替换任何 4 位二进制块，因为二进制值 `0000` (0)\
  \ 到 `1111` (15) 与十六进制值 `0x0` (0) 到 `0xF` (15) 完美对应，如表 2-1 所示。\n\n![表 2-1](img/570692_bk02Table-1.jpg)\n\
  \n所以，二进制值\n\n```\n1011 1010 0011 1100\n```\n\n在十六进制中变为这个数字：\n\n```\n0xBA3C\n```\n\
  \n1011 是 B。\n\n1010 是 A。\n\n0011 是 3。\n\n1100 是 C。\n\n值 `0xBA3C` 是多少？为什么不让计算机告诉你：\n\
  \n```c\n#include <stdio.h>\n\n#define PODS 50\n\n#define LOCATIONS 0xBA3C\n\nint\
  \ main()\n{\n    puts(\"Base 10:\");\n    printf(\"I must deliver %d pods to %d\
  \ locations.\\n\",PODS, LOCATIONS);\n    return(0);\n}\n```\n\n修改源代码 `BASES.C`，使其看起来此处所示。你正在添加一个新常量\
  \ `LOCATIONS`，定义为十六进制值 `0xBA3C`。第 9 行的 `printf()` 语句使用 `%d` 显示十六进制值，这会十进制显示值。（记住，内部，所有值都是二进制的；`printf()`\
  \ 根据你使用的占位符选择输出格式。）\n\n将更改保存到磁盘。编译并运行：\n\n十进制：\n\n我向 47676 个地点运送了 50 个胶囊。\n\n最好带个午餐袋。\n\
  \n## 使用 `printf()` 显示十六进制值\n\n正如我在书中多次提到的那样，值以二进制形式存储在计算机内部，并通过在 `printf()` 中使用正确的转换字符（占位符）以你选择的任何方式显示。在本章的早些部分，你使用了\
  \ `%d` 占位符来以十进制显示十六进制值 `0xBA3C`。同样，`printf()` 有 `%x` 占位符，用于以十六进制形式显示任何值。这里有一个示例：\n\
  \n```c\n#include <stdio.h>\n\n#define PODS 50\n\n#define LOCATIONS 0xBA3C\n\nint\
  \ main()\n{\n    puts(\"Base 10:\");\n    printf(\"I must deliver %d pods to %d\
  \ locations.\\n\",PODS, LOCATIONS);\n    puts(\"Base 16:\");\n    printf(\"I must\
  \ deliver %x pods to %x locations.\\n\",PODS, LOCATIONS);\n    return(0);\n}\n```\n\
  \n对你的 `BASES.C` 源代码进行必要的更改。修改源代码 `BASES.C` 使其看起来像此处所示。你添加了一个新常量 `LOCATIONS`，定义为十六进制值\
  \ `0xBA3C`。第 9 行的 `printf()` 语句使用 `%d` 显示十六进制值，这会十进制显示值。（记住，内部，所有值都是二进制的；`printf()`\
