  \ `inches` 的整型字段。\n\n注意其总大小仅与所有成员中最大者相同，只占用对应数量的系统 RAM。因此不论哪个占据最大空间都消耗足够字节；其余较小的共享同一块地址区域、运行时根据最后一次赋值而彼此覆盖重叠风险需谨慎对待！\n\
