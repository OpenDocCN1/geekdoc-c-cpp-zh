  \n还记得亚当·威斯特吗？他是电视剧里的蝙蝠侠（而且在我看来是唯一能演好蝙蝠侠的人）。可怜的亚当。他演得太好了以至于其他公司只愿意雇佣他扮演“蝙蝠侠”之类的角色。由于`typecasting`（注：此处为双关语，“定型角色”与下文技术术语“类型转换”同词），他的余生注定只能在晚餐剧院那些不会欣赏他的观众面前重复演出《爱之船》式的剧目。\n\
