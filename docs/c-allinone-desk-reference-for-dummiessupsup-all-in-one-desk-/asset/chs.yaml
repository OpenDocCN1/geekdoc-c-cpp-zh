  你对了！\n数字是 11\n\n有关 `break` 关键字的更多信息，请参考第一本书第 7 章。\n\n### 练习 2.5.3\n\n修改 `GUESS.C`\
  \ 的源代码。这一次，让用户只有少于六次的机会找到正确数字。如果用户在六次以内没有猜中数字，计算机将停止游戏并显示该数值。\n\n## 持续循环\n\nC 语言充满了对称性，其中一些对称仅仅是为了对称而存在。例如，`signed`\
  \ 关键字平衡了 `unsigned` ——尽管没有人使用 `signed`。我猜，为了与 `break` 关键字保持对称，C 语言有了 `continue`\
  \ 关键字。\n\n`continue` 关键字用于循环内部，以便立即跳转到顶部并重复循环；循环中 `continue` 之后的任何语句都会被跳过。\n\n是的，这看起来很奇怪。这就是为什么它很少被使用。这里有一个呆呆的程序示例：\n\
  \n```c\n#include <stdio.h>\n\nint main()\n{\n    int count = 0;\n    while(count<100)\n\
  \    {\n        count++;\n        if(count%5 == 0)\n            continue;\n    \
  \    printf(\"%d\\t\",count);\n    }\n    return(0);\n}\n```\n\n在你的键盘上敲击这段代码并将其输入编辑器。将源代码保存到磁盘上的\
  \ `CONT.C`。\n\n编译。运行。\n\n输出显示了 1 到 99 的数字，欢快地跳过了任何 5 的倍数。是的，真傻的。我可以给你看其他例子，但它们往往更长、更无聊。足以说明，`continue`\
  \ 语句是有用武之地的。\n\n### 练习 2.5.4\n\n重写 `CONT.C` 的源码，使其在不使用 `continue` 语句的情况下实现相同的功能。通过更改原始源代码中的一个字符并删除一行来实现。\n\
  \n## 嵌套的 while 循环\n\n像 `for` 循环一样，`while` 循环也可以嵌套——尽管我承认这种做法没有嵌套 `for` 循环那么常见。我认为大多数程序员发现，嵌套\
  \ `for` 循环在视觉上看起来更好，因为控制 `for` 循环的所有项都列在 `for` 语句中。对于 `while` 循环，要发现嵌套是如何工作的要困难得多。但这是可以：\n\
  \n```c\n#include <stdio.h>\n\nint main()\n{\n    int x = 1;\n    char a;\n    while(x\
  \ < 10)\n    {\n        a = 'A';\n        while(a < 'J')\n        {\n          \
  \  printf(\"%dc\\t\",x,a);\n            a++;\n        }\n        putchar('\\n');\n\
  \        x++;\n    }\n    return(0);\n}\n```\n\n将此源代码保存到磁盘上的 `GRID.C`。编译并运行。另一个网格程序。真行。为了好玩，将\
  \ `GRID.C` 源码与第一本书第 7 章中的 `for` 循环版本进行比较。你会发现为什么更喜欢嵌套 `for` 循环。\n\n## 第 6 章：更多的决策\n\
  \n### 本章\n\n- 使用 `switch-case`\n- 治愈 `if-else-if-else` 综合症\n- 使用 `break` 防止穿透（fall-through）\n\
  - 避免 `?:` 结构\n- 玩骰子\n\n`if` 语句并不是 C 语言决策的终点。在 C 中有两种做决策的方法。一种是解决无尽 `if-else` 问题的有效方案，另一种可能是你见过的最奇异、最晦涩的\
  \ C 语言特性。本章涵盖了它们。\n\n### 古老的 Switch 技巧\n\n当我想到 `switch case` 时，我必须想起经典的喜剧电影《What’s\
  \ Up?》——这部电影基于几个完全相同的案件的设定，所有的案件都被切换到了梅尔·布鲁克斯（Mel Brooks）电影中最疯狂的一侧。是那部电影教会了我 `igneous`（火岩的）这个词。\n\
  \nC 语言缺乏 `igneous` 关键字。但它确实有两个来自《What’s Up?》剧情的实用用词：`switch` 和 `case`。它们被结合在一起来实现相同的功能。这不是一个循环。这是一个\
  \ `switch-case` 结构。它是让你的程序处理单一事件多种结果的方便方法。\n\n### else-if else-if else-if 疾病\n\n\
  随着错误代码变得复杂，某些程序需要让你解读各种数字并帮助理解它们到底意味着什么。以下是这样一个程序：\n\n```c\n#include <stdio.h>\n\
  int main()\n{\n    int code;\n    printf(\"输入错误代码\\n\");\n    printf(\"范围 1 到 5:\
