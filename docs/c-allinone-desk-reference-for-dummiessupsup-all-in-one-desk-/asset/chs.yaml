  \n### “全局”还是“外部”？\n\n我称它们为全局变量，这在其他编程语言中很常见。但在 C 语言中，它们通常被称为*外部*变量或*外部存储类*。因此有一个\
  \ C 语言关键字用于引用这些变量。\n\n`extern` 关键字常常被包含在一个函数中来标识一个全局变量。例如，在附近的源代码文件 MODLINE.C 中，函数\
  \ `dashes()` 可以这样声明 `linelen` 这个变：\n\n```\nextern int linelen\n```\n\n这告诉编译器：该语句表明它位于各函数的定义之间然而没必要；这是因为代码中是先定义了再用的与原型类似只要在使用之前定义一个量就不需劳驾去用原始的重声明方式了其中例来说明一下情况但是自从我们第一次就把他们在整体设计流程以及最后还要完善的架构里都在系统一开始就将其置于主调用前的位置所以是的这样就够了将这一方法贯彻到底——无需再次费力使用那个特殊的关键字或者通过那种方式来重复地重新申明同一已有既定实体这一步操作的确就这么简单那么现在最重要的一点是什么呢让后面的过程变得更清晰吧而原则上对于进阶工程来说当我们要构建更大规模的程序设计时会遇到跨越不同源文件的开发模式这时想访问存在于别的模块中的那些东西就需要借助此工具\
