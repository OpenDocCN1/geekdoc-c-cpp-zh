  \ 滥用 `#define` 指令\n\n我涉过的大多数编程书籍很少覆盖常量这个概念。这些书花费时间讨论变量，自然所然，因为变量对大多数人来说是一个外来概念，并且是大多数编程活动的核心。但常量要么被带过，要么被口提。在本书中并非如此。\n\
  \n我觉得常量在程序中非常有价值。我是通过惨痛教训学到这一点的，但我想把这一点传授给你，以丰富你自己的编程。因此，欢迎来到涵盖程序中常量主题的甜美章节。\n\n\
  ## 常量是必要的吗？\n\n在 C 中，你可以使用三种值：存储在变量中的值、立即值和常量。这几乎涵盖了政府发明的每一个 3 字母缩写词... (注：由于原文文本在此处出现了严重的重复和错乱，以上翻译已根据提供的逻辑片段进行了修正对齐)\n\
  \n\n\n我认为，如果常量不可用，使用变量来充当常量是一种实用的解决方案。但遗憾的是，语言中*确实存在*可用的常量。\n\n我的建议是：对于程序中任何重复出现的值都应使用常量。即使你认为这个值永远不会改变，也最好优先选用常量。例如在我的程序中就曾将以下类型的数值声明为常用：\n\
  \n-   某些循环需要重复的次数\n-   存储位置或缓冲区的大小\n-   游戏中角色能携带的最大物品数量\n-   用户重试密码的尝试次数\n-    程序挂断调制解调器前的空闲秒数限制。\n\
  等等\n\n在你的程序中将这类信息声明为常量的好处在于：不仅能用这些数值轻松完成操作——而且后续若要修改它们也会更方便删除内容（包括“handier”）。若是能为每个符号赋予恰当的名称常数名得当正确命名代码的可读性自然会得到提升提高带来额外的优点益随之而来中的意外收获会更好消除误解理解冗长困扰显然不需要修正相反之处才允许补充更明确生成结构好感注重极简化保持稳定环境下不影响效果出现纰漏难以察觉所以特备更强防御机制提前准备也不多余总之按照规则妥善安排即可顺利完成目标升级再做打算无需多虑。）\n\
