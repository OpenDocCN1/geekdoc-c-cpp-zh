  \n# 第 5 章：循环之道 (While Going Loopy)\n\n### 本章内容\n\n- 理解 while 循环\n- 减少代码中的行数\n- 享受\
  \ `while(!done)` 循环\n- 使用 `do while` 循环\n- 创建无限 while 循环\n- 引入 `continue` 关键字\n\
  - 嵌套 while 循环\n\n解决问题的方法有很多种。你很清楚。你可能不知道为什么要“剥猫皮”。没有人真的吃小猫——至少我不知道有哪个异国他乡把 *catus*（猫科动物）视为美味。我能想象到的剥猫皮的唯一理由就是纯粹的残忍。然而，我们继续使用这个谚语来证明你可以使用不止一种方法来完成某些任务。（至少我*希望*是这个意思。）\n\
  \n在 C 语言中，编写循环的方法不止一种——不需要剥皮。`for` 循环是循环类型中最古老、最传统的。更现代的是 `while` 循环。它与 `for` 循环相似，都有三个部分；但与\
  \ `for` 语句不同（所有内容都可以出现在一个地方），`while` 循环的风格更加随性、*悠闲自得*。\n\n## while 循环\n\n`while`\
  \ 循环是 C 语言中第二个个主要的循环命令，紧随 `for` 之后。我个人觉得 `while` 看起来更容易，设置起来也简单一点。不过，如果你不记录状态，`while`\
  \ 更有产生无限循环的潜力。\n\n## 构建基础的 while 循环\n\n所有循环都有三个部分：\n\n- 设置或初始化\n- 循环部分——重复执行的语句\n\
  - 循环结束的条件\n\n在 `for` 循环中，这三个部分几乎都包含 `for` 语句本身。在 `while` 循环中，只有循环结束的条件包含在 `while`\
  \ 语句中。循环的其他部分必须在程序的其他地方发生。如下：\n\n```c\nsome sort of setup;\n\nwhile(condition==true)\n\
  {\n    statement;\n    statement;\n    /* more statements... */\n    something\n\
  }\n```\n\n只有循环结束的条件包含在 `while` 语句中。循环的其他部分必须在程序的其他地方发生。如下：\n\n```c\nsome sort of\
  \ setup;\n\nwhile(condition==true)\n{\n    statement;\n    statement;\n    /* more\
  \ statements... */\n    something\n}\n```\n\n（此处由于原文中存在大量重复的段落，已根据工程师逻辑进行去重，保留核心逻辑结构）\n\
  \n```c\nsome sort of setup;\n\nwhile(condition==true)\n{\n    statement;\n    statement;\n\
  \    /* more statements... */\n    something\n}\n```\n\n\n\n\n该程序的工作原理与原始 `TYPING.C`\
  \ 程序相同。这是因为——正如我反复强调的那样——C 语言是从内向外工作的。首先，`getchar()` 函数生成一个值。在这个示例中，这是一个即时字符值，它将与\
  \ `~` 波浪线字符进行比较。只要字符不匹配，循环就会旋转。单个分号就是 `while` 循环的“语句”。\n\n## 流行的 `while(!done)`\
  \ 循环\n\n你经常看到并使用的 `while` 循环类型是我所称的 `while(!done)` 或“当未完成时”循环。这个循环不断旋转，直到满足某个未知的条件或多个条件。因此，在某种意义上，它像是一个无限循环，但有一个简单的逃出口。\n\
  \n例如，创建了一个名为 `done` 或 `finished` 的变量。它被设置为 `0` 或 `FALSE`。随后，`while(!done)` 循环被解释为\
  \ `while(TRUE)`，然后 `while` 循环不断旋转。\n\n最终，循环内部的某个条件被满足。此时，`done` 变量被设置为 `TRUE`。因此，`while(!done)`\
  \ 等同于 `while(FALSE)`，循环停止。\n\n你可能会想——尤其是如果你有思考能力的话——这种循环是愚蠢的。毕竟，C 语言的 `break` 命令也可以在旋转过程中停止循环。但与\
  \ `break` 不同，你可以在循环内部重置 `done` 的值，而循环的其余语句将继续运行。这可能是重要的，而且通常是必要的，正如这段源代码所示：\n\n\
  ```c\n#include <stdio.h>\n#include <stdlib.h>\n#include <time.h>\n\n#define FALSE\
  \ 0\n#define TRUE !FALSE\n#define OMEGA ('Z' - 'A')\n\nint main()\n{\n    int done;\n\
  \    long int r;\n    char alpha;\n    srandom((unsigned)time(NULL));\n    done=FALSE;\n\
  \    while(!done)\n    {\n        r = random() % OMEGA;\n        alpha = 'A' + (char)r;\n\
  \        if(alpha=='Q') done=TRUE;\n        putchar(alpha);\n    }\n    putchar('\\\
  n');\n    return(0);\n}\n```\n\n将此源代码仔细地输入你的编辑器中。以下是重点说明和解释：\n\n- 第 5 行和第 6 行定义了\
  \ `TRUE` 和 `FALSE`。编译器将 `FALSE` 解析为 `0`。`TRUE` 的值仅定义为 `!FALSE`（非假），这总是正确的。（通俗地说，编译器将非零值视为\
  \ `TRUE`，而 `!0` 对编译器来说结果是一个非零值。）\n- 第 7 行用于计算字母表中的字母数量，而无需你费费脑力。从字符 `Z` 减去字符 `A`\
  \ 的 ASCII 值，以便稍后生成字母表的随机字母。\n\n![TechnicalStuff](img/TechnicalStuff.jpg)\n\n- `'Z'-'A'`\
  \ 的值为 `25`。这在程序后面之所以有效，是因为 C 语言从 `0` 开始计数。如果你仅仅将值设置为 `26`（字母表中有 26 个字母），程序将无法工作。这就是为什么使用\
  \ `'Z'-'A'` 结构。\n\n- 第 15 行为随机数生成器种子。更多信息请参考第二卷第 4 章。\n\n![Remember](img/Remember.jpg)\n\
  \n- 如果你的 `gcc` 版本缺少 `srandom()` 函数，请在第 15 行使用 `srand()`。第 20 行也如此：使用 `rand()` 函数而不是\
  \ `random()`。\n\n- 如果你这样读，第 17 行就很容易理解：循环结束了吗？答案是：`FALSE`！\n- 第 18 行确保只要 `done`\
  \ 变量的值为 `FALSE`，循环就会继续运行。但它读起来确实的意思是“当未完成时”，这很有用。\n- 第 20 行使用 `random()` 或 `rand()`\
  \ 函数生成随机数。该数字对 25 取模，使得变量 `r` 的值在 `0` 到 `25` 的范围内。（第 2 卷 4 章涵盖了这一操作。）\n- 字符变量 `alpha`\
  \ 被赋值为字母表中的随机字母。在 `random()` 函数返回的任何结果上加上 `'A'` 的值。注意，变量 `r` 被类型转换为 `char`，以保持该行上的所有变量都是字符变量。\n\
  - 程序生成的所有随机单词都以 `Q` 结尾，因此第 22 行确保了这一点。它的意思是：如果生成的字母是 `Q`，循环结束：`done=TRUE`。\n- 在第\
  \ 23 行，显示生成的字符。\n- 第 25 行用换行符结束输出。\n\n将此源代码保存为 `BABELON.C` —— 这是一个生成独特且难读单词的程序，所有单词都以字母\
  \ `Q` 结尾。编译并运行：`LEFNWFC`。再次运行：`IYJSPTODYVBGYPSCTFGGM`。现在你知道微软的密钥是从哪里来的了！如果将 `done=TRUE`\
  \ 替换为 `break` 会怎样？在这种情况下，第 23 行将不会执行，`Q` 也不会显示——这可能是你想要的。在更复杂的程序中，让 `while(!done)`\
  \ 循环中的剩余语句继续执行，然后在 `done=TRUE` 时停止循环是有用的。\n\n### 练习 2.5\n修改 `BABELON.C`，使输出变为小写。\n\
  \n## do-while 循环\n\n你看到并频繁使用的 `while` 循环类型是我所称的 `while(!done)` 或“当未完成时”循环。这个循环不断旋转，直到满足某个未知的条件或多个条件。因此，在某种意义上，它像是一个无限循环，但有一个简单的逃出口。\n\
  \n例如，创建了一个名为 `done` 或 `finished` 的变量。它被设置为 `0` 或 `FALSE`。随后，`while(!done)` 循环被解释为\
  \ `while(TRUE)`，然后 `while` 循环不断旋转。\n\n最终，循环内部的某个条件被满足。此时，`done` 变量被设置为 `TRUE`。因此，`while(!done)`\
  \ 等同于 `while(FALSE)`，循环停止。\n\n你可能会想——尤其是如果你有思考能力的话——这种循环是愚蠢的。毕竟，C 语言的 `break` 命令也可以在旋转过程中停止循环。但与\
  \ `break` 不同，你可以在循环内部重置 `done` 的值，而循环的其余语句将继续运行。这可能是重要的，而且通常是必要的，正如这段源代码所示：\n\n\
  （此处代码块已在上方翻译过）\n\n将此源代码仔细地输入你的编辑器中。以下是重点说明和解释：\n\n（此处列表项已在上方翻译过）\n\n将此源代码保存为磁盘为\
  \ `BABELON.C` —— 这是一个生成独特且难读单词的程序，所有单词都以字母 `Q` 结尾。编译并运行：`LEFNWFC`。再次运行：`IYJSPTODYVBGYOGPSCTFGGM`。现在你知道微软的密钥是从哪里来的了！如果将\
  \ `done=TRUE` 替换为 `break` 会怎样？在这种情况下，第 23 行将不会执行，`Q` 也不会显示——这可能是你想要的。在更复杂的程序中，让\
  \ `while(!done)` 循环中的剩余语句继续执行，然后在 `done=TRUE` 时停止循环是有用的。\n\n### 练习 2.5\n修改 `BABELON.C`，使输出变为小写。\n\
  \n## do-while 循环 \n\n`do-while` 循环本质上是一个倒置的 `while` 循环。它看起来像这样：\n\n```c\ndo {\n\
  \    语句;\n    语句;\n    更多语句 */\n} while(条件);\n```\n\n`while` 循环与这种循环之间存在细微差别。主要的区别在于\
  \ `do-while` 循环至少执行一次。与 `while` 循环不同，`条件` 是在循环*之后*查看的。由于 `do` 循环会旋转一次，`条件` 并不一定需要满足（但通常是）。注意\
  \ `while` 语句以分号结尾。\n\n我喜欢实现 `do-while` 循环的一种方式是确认输入：\n\n```c\n#include <stdio.h>\n\
  int main()\n{\n    int value;\n    do {\n        printf(\"输入大于 20 的数值：\");\n   \
  \     scanf(\"%d\", &value);\n    } while(value <= 20);\n    printf(\"感谢。你输入了%d\\\
  n\", value);\n    return(0);\n}\n```\n\n将此源代码保存为 `YORN.C`。编译并运行。\n\n### do-while\
  \ 的格式变化\n你可能会看到 `do-while` 循环这样写：\n\n```c\ndo {\n    语句;\n} while(条件);\n```\n\n\
  结束循环的 `while` 语句放置在结束循环语句的大括号的同一行。这在较大的程序中是这样做，以防止单行的 `while` 被误认为是新循环的开始。为了保持一致，在本书中我将\
  \ `while` 语句单独放在一行。但请注意前面的替代方案以及使用的原因。（记住，源代码格式是为了人类眼睛；编译器并不关心它在屏幕或页面上看起来如何。）\n\n\
  操控循环\n\n你可以对 `while` 循环进行有趣、奇怪且有用的操作，就像对 C 语言中的其他循环这样做一样。本节强调了一些实用的操作。\n\n## 无限\
  \ while 循环\n\n`while` 循环很容易变成无限循环。如果没有退出条件，循环就会不断旋转，像一个由醉酒管理员控制的摩天轮一样疯狂运行。\n\n有时，无限循环是必要的。例如，如果你不知道循环需要重复多少次，你就必须构建一个无限循环以防万一。你只需要提供一种跳出的方法——理想情况下是使用\
  \ `break` 关键字：\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n#include <time.h>\n\
  #define RANGE 100\n\nint main()\n{\n    int guess,number;\n    srandom((unsigned)time(NULL));\n\
  \    puts(\"猜测游戏！\");\n    number=random() % RANGE + 1;  /* 1 到 RANGE 之间的值 */\n\
  \    printf(\"我正在想一个 1 到%d 之间的数字。\\n\",RANGE);\n    printf(\"你能猜到它是几吗？\\n\");\n\
  \    while(1)\n    {\n        printf(\"输入猜测: \");\n        scanf(\"%d\",&guess);\n\
  \        if(guess == number)\n        {\n            puts(\"你猜对了！\");\n        \
  \    break;\n        }\n        else if(guess < number)\n            puts(\"太低了！\"\
  );\n        else\n```\n\n\n\n\n```c\n    puts(\"Too high!\");\n\n    }\n\n    printf(\"\
  The number was %d\\n\",number);\n\n    return(0);\n}\n```\n\n仔细输入这段源代码。请注意 `while(1)`\
  \ 建立了一个无限循环。只有猜中正确的数字，`break` 语句才会结束循环。\n\n将源代码保存到磁盘上的 `GUESS.C`。编译并运行。\n\n这里是一个示例运行：\n\
  \n猜数字游戏！\n\n我正在想一个 1 到 100 之间的数字。\n\n你能猜到它是几吗？\n\n输入猜测: 50\n太高了！\n\n输入猜测: 25\n太高了！\n\
