  \nThe answer is 5\n\n真的吗！再运行一遍以防无：\n\nThe answer is still 5!\n\n（开玩笑的！文本显示的仍然是 The\
  \ answer is 5。）\n\n## 我亲爱的 Sally 阿姨\n\n阅读英语的人类倾向于从左到右处理事情。因此，当面对诸如 `4 + 5 - 2 *\
  \ 6 / 3` 这样的问题时，人们倾向于从左到右计算：`4+5` 是 9。减去 2 是 7。乘以 6 是 42。除以 3 是 14。\n\n如果是那些从右到左计算题目的文化又呢？在这种情况下，6\
  \ 除以 3 是 2。乘以 2 是 4。减去 5 是 –1。加 4 是 3。\n\n甚至是这种：4 加 5 是 9。6 除以 3 是 2。9 减去 2 是 7，乘以\
  \ 2 是 14（再次）。\n\n但在计算机中，事情是按照优先级顺序执行的。也就是说，计算机扫描一个长方程式并决定先执行某些操作。在基础数学中，顺序是：\n\n\
  1. 乘法\n2. 除法\n3. 加法\n4. 减法\n\n这个序列的记忆法是 MDAS，或者叫我亲爱的 Sally 阿姨（My Dear Aunt Sally）。它告诉你是计算机如何计算的。当你将\
  \ MDAS 应用这个等式时：\n\n`4 + 5 - 2 * 6 / 3`\n\n你得到的是：首先，2 乘以 6 等于 12；其次，12 除以 3 等于 4；第三，4\
  \ 加 5 等于 9；最后，也是最终，9 减 4 等于 5。图 9-1 也说明了这种顺序是如何工作的。\n\n| **图 9-1:** 优先级如何影响数学方程式。\
  \ | ![Figure 9-1: How the order of precedence affects a mathematical equation.](img/570692%20fg010901.jpg)\
  \ |\n\n### 练习 1.9.1\n\n选取这些数字：\n\n`7 4 3 2 8`\n\n以及这些运算符：\n\n`/ / + -`\n\n并编写一个类似于\
