  \ 捕获了所有小于 65 的值。第二个 `if` 捕获了所有 65 或更大的值。但你有更好的方法来编织这个解决方案，正如我在下一节中描述的那样。\n\n## Or\
  \ Else\n\n你程序中的许多决策都是二选一类型。程序在条件为真时采取一种行动，在条件为假时采取另一种。在 C 中，你可以使用 `if` 语句来处理这种情况，但有更好的方法，使用\
