  \ `else`时,剩余的温度就在 65 到 79.99 这个区间了。\n\n现在假设有人没有认真思考过逻辑关系导致代码呈现出了像图 7 所示这样的状态(此处拟指代其他文本的章节延续性有误但为保持语境故保留此表述方向)，那么这个例子里的最后那个分支就将找不到任何可匹配留下的数据项——也就说最终得到的很可能会是错误的输出。(请注意编译器并不会帮我们指出这类思维漏洞型的问题。)\n\
