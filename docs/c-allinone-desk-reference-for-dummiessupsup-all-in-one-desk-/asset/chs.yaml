  \n\n\n\n\n在一种情况下，`goto` 可能很有用：从嵌套循环的中间跳出。通常使用 `break` 语句来退出循环，但 `break` 只会停止它所在的那一层循环；如果是嵌套循环，外层循环会继续执行。在这种情况下，只有\
  \ `goto`\n才能让你从嵌套层的深处直接脱身。\n\n诚然，这种情况极为罕见。事实上除非你预见到会发生彻底的灾难否则一个好做法是简单地设置一个特定变量并在嵌套循完成环后检查它例如\n\
  \n```c\n#include <stdio.h>\n\nint main()\n{\n    int x = 1;\n    char a;\n\n   \
  \ while(x < 10)\n    {\n        a = 'A';\n        while(a < 'J')\n        {\n  \
  \          printf(\"%d%c\\t\",x,a);\n            if (x==5 && a=='E') goto rescue;\n\
  \            a++;\n        }\n        putchar('\\n');\n        x++;\n\t}\nrescue:\n\
  \   return(0);\n}\n```\n\n这段源代码是对《C For Dummies》第 II 册第 5 章中“GRID.C”代码的一个修改版本【注意文本提到的是第二册第五章】我添加了一个条件当匹配到\
