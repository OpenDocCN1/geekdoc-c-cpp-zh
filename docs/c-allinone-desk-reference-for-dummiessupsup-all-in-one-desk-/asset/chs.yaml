  \ 1 到 4 章向你展示了如何向屏幕输出文本。在本章中，得益于 `char` 变量存储字符的能力，你现在可以从键盘读取输入了。\n\n## 老实的 `char`\
  \ 变量\n\n无论你把它读成“car”还是“care”（但绝不是“char”），`char` 变量类型在 C 语言中用于为一个微小的字符定义存储空间。这看起来可能很傻，但你确实是一个字母一个字母地学习的。就像现实生活中一样，计算机中的小东西被用来构建更大的东西。如果你计划使用一个处理单词或语言的程序，`char`\
  \ 变量早晚会成为你的朋友。\n\n## 显示单个字符\n\n单个字符在 C 中是一个非常强大的家伙。与现实生活不同——在现实中，单身人士被迫通过尴尬的介绍、相亲或网络交友系统上以前瘦时的旧照片来相识，而计算机内部的单个字符可以非常受欢迎。\n\
  \n在本书的其他地方，你可以看到由双引号定义的文本字符串，例如：\n\n```\nputs(\"I am a string of text, la-di-da.\"\
  );\n```\n\n另一方面，单个字符被单引号包裹：\n\n```\n‘A’\n```\n\n这里指定了单字符 `A`。或者，考虑这个：\n\n```\n‘\\\
  n’\n```\n\n转义序列 `\\n` 被指定为一个单个字符。这是换行的转义序列，等同于回车键。（`\\n` 可用于某些程序中检查是否按了回车键。）\n\n\
  但是，就像双引号中的文本字符串一样，字符必须被用在某处；例如：\n\n```c\n#include <stdio.h>\n\nint main()\n{\n \
  \   printf(\"This program is sponsored by the letter %c\\n\",'P');\n    return(0);\n\
  }\n```\n\n将此源代码输入你的编辑器。将其保存为 `SPONSOR.C`。编译并运行。\n\n`This program is sponsored by\
  \ the letter P`\n\n`printf()` 语句使用 `%c` —— c 代表 `char` —— 来显示单个字符 `P`（或者，正式地说，显示*立即字符值*\
  \ `P`）。\n\n注意，尽管 `P` 被包含在单引号中，但这些单引号不会出现在输出中。这是因为 `printf()` 语句的格式字符串部分没有包含它们。\n\
  \n### 练习 1.5.1\n\n修复 `SPONSOR.C` 源代码，使输出在字母 `P` 周显示单引号。\n\n## 单引号也是神圣的\n\n双引号用于包裹字符串，而单引号用于包裹单个字符。正如双引号字符在字符串内部是特殊的一样，单引号字符作为单个字符时也是特殊的；例如：\n\
  \n```c\nprintf(\"Song, \\\"Under the Sea.\\\\n\");\n```\n\n转义序列 `\\\"` 用于在字符串中间放置一个双引号字符。同样，如果你想使用单引号字符，你可以将其指定为：\n\
  \n```\n‘\\’’\n```\n\n这是单引号内的转义序列 `\\'`。对 `SPONSOR.C` 程序的这种修改演示了：\n\n```c\n#include\
  \ <stdio.h>\n\nint main()\n{\n    printf(\"This program is sponsored by the letter\
  \ %c%c%c\\n\",‘\\'’,’P’,’\\’’);\n    return(0);\n}\n```\n\n不要让看起来晦涩的 `printf()`\
  \ 语句干扰你。这个示例显示了三个单个字符，并连续使用三个 `%c` 占位符来显示它们。每个单个字符都用单引号指定，并用一个逗号分隔。\n\n![Warning(bomb)](img/Warning(bomb).jpg)\n\
  \n我在几个版本的 VIM 编辑器中注意到，序列 `\\'’` 没有被正确着色，尽管序列 `'''` 是的。忽略这个错误。如果你使用 `'''` 来表示单引号字符，编译器会对你生气。\n\
  \n将修改后的 `SPONSOR.C` 程序保存到磁盘。编译并运行：\n\n`This program is sponsored by the letter ‘P’`\n\
  \n查看附录 F 获取转义序列的完整列表以及它们代表的字符。注意，任何一个都可以在单引号中指定以表示你程序中的特殊字符。\n\n## 这里有 `char`，那里有\
  \ `char`，到处都是 `char` `char`\n\n在 C 语言中通过 `char` 关键字为单个字符留出空间，就像 `int` 为整数值留出空间、`float`\
  \ 为浮点值留出空间一样。下面的程序演示了如何创建和使用 `char` 变量：\n\n```c\n#include <stdio.h>\n\nint main()\n\
  {\n    char oz;\n    oz = ‘O’;\n    printf(\"This program is sponsored by the letter\
  \ %c\\n\",oz);\n    oz = ‘Z’;\n    printf(\"%c\\n\",oz);\n    return(0);\n}\n```\n\
  \n\n\n字符 `B` 的代码为 `66`。\n\n字符 `C` 的代码为 `67`。\n\n`char` 变量 `alpha` 在每个 `printf()`\
  \ 语句中使用了两次。第一次，它的值使用 `%c`（字符）显示。第二次，它的值使用 `%d`（整数）显示。同样，在计算机内部，计算机只使用值来跟踪变量。重要的是\
  \ `char` 变量是如何被显示的的。\n\n为了更深入地说明这一点，请对 `ALPHA.C` 的源码进行如下修改：\n\n```c\n#include <stdio.h>\n\
  \nint main()\n{\n    char alpha = 'A';\n    printf(\"Character %c has code %d.\\\
  n\",alpha,alpha);\n    alpha = alpha + 1;\n    printf(\"Character %c has code %d.\\\
  n\",alpha,alpha);\n    alpha = alpha + 1;\n    printf(\"Character %c has code %d.\\\
  n\",alpha,alpha);\n    return(0);\n}\n```\n\n唯一的变化在第 8 行和第 10 行。在那里，变量 `alpha` 仅仅增加了\
  \ 1：首先，`alpha + 1` 将 `alpha` 的值加 1。然后，将这个新值赋值给变量 `alpha`。随后的 `printf()` 语句以字符和值的形式显示结果。\n\
  \n将更改保存到磁盘。编译并运行。输出是相同的。\n\n![Remember](img/Remember.jpg)\n\n虽然你可以直接将值存储在 `char`\
  \ 变量中，但请记住它有大小限制。你可以在 `char` 中存储的值范围仅为从 –127 到 128。如果你需要存储比这些值更大的值，请使用普通的 `int`。（关于整数大小范围的信息在先前的侧边栏“整数先生有一个真名”中提供。）\n\
  \n请注意，尽管这种技巧对 `char` 变量有效，但我并不建议尝试将字符存储在 `int` 或 `float` 变量中，也不应该尝试使用它们通过 `%c` 来显示字符。这种技巧是\
  \ `char` 变量特有的。\n\n### 整数先生有一个真名\n\n尽管第 4 章引入了 `int` 变量类型并简要讨论了它的用法，但遗漏了一个重要的事实：就像汽车、行星、洗衣液盒和人一样，整数变量有不同的大小。\n\
  \nC 语言中的整数可以是两种大小之一：短（short）或长（long）。从技术上说，这些大小指的是存储整数值使用的位数；具体来说：\n\n- 短整数使用 16\
  \ 位存储从 –32,768 到 32,767 的值。\n- 长整数使用 32 位存储从 –2,147,483,648 到 2,147,483,647 的值。\n\
  \n在现代计算机上，当你声明一个 `int` 变量时，它通常是 `long` 类型。在较旧的计算机上（1993 年左右之前的 PC），`int` 变量是 `short`\
  \ 类型。如果你想指定得明确，可以在变量声明中使用 `short` 或 `long`；例如：\n\n```c\nshort int age;\n```\n\n\
  这个示例创建了一个短整数变量。下一个示例创建了一个长整数变量：\n\n```c\nlong int lotto_prize;\n```\n\n有些来源说，在需要时特意地声明\
  \ `short` 整数可以节省空间或提高程序效率。但话如此，我听说在计算机内存内部，所有的 `short` 整数都是使用四个字节而不是两个字节存储的，所以那可能只是胡说。我的建议仅仅是使用\
  \ `int`。\n\n（参见第二卷第 1 章获取有关有符号和无符号整数值的更多信息。附录 E 列出了所有 C 语言变量类型及其存储容量。）\n\n### 练习\
  \ 1.5.3\n\n从第一卷第 4 章中找出 `AGE.C` 程序。修改它，使 `age` 变量声明为 `char` 而不是 `int`。编译并运行。\n\n\
  ## 从键盘获取输入\n\n计算机的核心就是传统的 I/O，即输入和输出。到为止你已经看到了很多输出；因此，是时候发现输入了。在现代 PC 上，你通过键盘来实现，键盘也被称为*标准输入设备*。（显示器是*标准输出设备*。）\n\
  \nC 语言有几个实用的函数可以从键盘读取文本。本章的前半部分介绍了 `char` 变量，如果你计划存储从键盘读取的信息，那么它非常重要。本节将揭示细节。\n\n\
  ## 逐个按键读取键盘\n\n在 C 中，`getchar()` 函数一次从键盘读取一个按键的字符。这是合乎逻辑的：毕竟，你一次只输入一个字符（除非你生气并开始用拳头敲键盘）。而且，如果你读完了本章的前半部分，你可能识别出\
  \ `getchar()` 是 `putchar()` 函数在语法上的兄弟。我敢说 C 语言开始变得有意义了吗？\n\n将此代码输入你的编辑器中：\n\n```c\n\
  #include <stdio.h>\n\nint main()\n{\n    char t;\n    printf(\"Please type a character:\"\
  );\n    t = getchar();\n    printf(\"Thank you for typing the %c.\\n\",t);\n   \
  \ return(0);\n}\n```\n\n第 8 行的 `getchar()` 函数从键盘读取一个键。该键的值存储在变量 `t` 中，然后在 `printf()`\
  \ 语句中显示该字符。将此代码保存为 `TYPECHAR.C`。编译并运行。\n\n```text\nPlease type a character:\nPress\
  \ a key, such as Y, and then Enter:\nThank you for typing the Y.\n\n\n## getchar\
  \ 的问题\n\n我不太满意 `getchar()`。它并不是真的从键盘读取一个字符；它是从流中读取下一个字符。为了看到它是如何工作的，考虑这个程序：\n\n\
  ```c\n#include <stdio.h>\n\nint main()\n{\n    char t;\n    printf(\"Please type\
  \ a character:\");\n    t = getchar();\n    printf(\"Thank you for typing the %c.\\\
  n\",t);\n    t = getchar();\n    printf(\"Thank you for typing the %c.\\n\",t);\n\
  \    t = getchar();\n    printf(\"Thank you for typing the %c.\\n\",t);\n    t =\
  \ getchar();\n    printf(\"Thank you for typing the %c.\\n\",t);\n    return(0);\n\
  }\n```\n\n我修改了 `TYPECHAR.C` 的源码以重复第 8 行和第 9 行。它们是一样的，但这样你可以看到 `getchar()` 如何响应输入流。将更改保存到\
  \ `TYPECHAR.C`，然后运行生成的程序：\n\n```text\nPlease type a character:\nType Bob and then\
