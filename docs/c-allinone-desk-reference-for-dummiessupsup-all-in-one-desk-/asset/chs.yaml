  \n\n(好吧开个玩笑~马上进入正题:)\n\n\n\n\n\n\n- 了解何时使用 `float` 变量\n- 声明多个变量\n- 立即为变量赋值\n- 数学运算符总结\n\
  \n电脑将桌面计算器作为其祖先之一，因此计算机编程的主要方面之一必须处理数字。这并不可怕；就像计算器一样，电脑会算出结果。你只需要提供数字和正确的方程，让计算机完成它的工作即可。作为一名数学学生，我可以向你保证，在计算机上做数学并不是一种苦差。\n\
  \nC 语言编程确实涉及使用数字。为了让计算机更容易工作，C 使用不同类型的数字，知道它们之间的区别很重要但并不困难。除了数字之外，还会使用被称为 `variables`\
  \ 的东西，它们是未知值的存储位置。与数字一样，根据存储内容的不同会使用不同类型的变量。本章将介绍数字和变量的基本概念。\n\n## 被数字搞头晕\n\n数字有大有小。如果你幸运，你可能还记得高中数学课上的术语，如整数、分数和小数部分。如果你在学校后期阶段还保持清醒，你甚至可能记得有理数、无理数，甚至是虚数。幸运的是，在这里你可以完全忽略所有这些东西。\n\
  \n在 C 语言中，你只使用两种类型的数字：整数和浮点数。\n\n## 整数的乐趣\n\n`Integers` 是整数字。它们没有分数或小数部分。在数学课上，这些被称为整整数，但在电脑上，整数可以是负数、正数或零。\n\
  \n在你的编辑器中输入这段源代码。将其保存到磁盘上的 `INTEGER.C`。编译并运行：\n\n```c\n#include <stdio.h>\n\nint\
  \ main()\n{\n    printf(\"Here’s your integer value %d.\\n\",123);\n    return(0);\n\
  }\n```\n\n输出如下：\n`Here’s your integer value 123.`\n\n`printf()` 函数显示了整数值 `123`。你可以这样写：\n\
  \n```c\nprintf(\"Here’s your integer value 123.\\n\");\n```\n\n在这里，`123` 是文本字符串的一部分——而不是值。在\
  \ C 语言中，这是是有区别的。要让 `123` 成为值，必须在不加双引号的情况下指定。编译器随后会将 `123` 识别为 `immediate`（立即值），或者一个为了方便而直接使用的数字。\n\
  \n`printf()` 语句字符串中的 `%d` 是一个 `integer placeholder`（整数占位符）。这让我们看到了 `printf()` 的威力；`%d`\
  \ 被稍后在 `printf()` 括号指定的整数值替换。例如：\n\n```c\nprintf(\"formatting string with %d in\
  \ it\",value_for_%d);\n```\n\n(注：由于原文中存在大量重复段落，此处已根据要求翻译核心内容并保持格式。)\n\n\n\n我离火葬场有一半路，6.750000\
  \ 英里。\n\n请注意，无论你除任意两个数字（无论是整数还是浮点数），结果通常都是浮点数。\n\n### 整数和浮点数之间的真实区别（以及何时使用其中一种）\n\
  \n如果一个浮点值也可以是一个整数，为什么还要费力在程序中使用整数呢？原因在于，计算机内部对浮点值和整数的字节方式是不同的。\n\n整数在计算机内部以真正的二进制值形式存在。例如，值\
  \ `123` 在现代计算机中被存储为一个 32 位的值：\n\n符号位决定了该值是正是负（0 为正，1 为负）。其余的 31 位被用于表示该值。\n\n然而，浮点数无法直接存在于使用二进制（1\
  \ 和 0）的计算机中。别傻了！所以，浮点数是被巧妙地“伪造”的。使用相同的 32 位，浮点值 `13.5` 的可能看起来像这样：\n\n首先是符号位：1 表示负，0\
  \ 表示正。指数部分和尾数以一种复杂而神秘的方式结合在一起，在二进制中伪造出浮点值。（如果你好奇，可以在互联网上搜索 `floating-point binary`，找到一些优秀的教程，它们或许能帮你解释清楚。）\n\
  \n底线是，计算机解决二进制问题所花费的工作比处理整数要多得多。因此，在可能的情况下，请使用整数值，只在必要时才使用浮点数。\n\n（在 C 语言的早期，如果你的程序使用了浮点值，通常需要链接一个特殊的浮点库。现在大多数编译器都可以在无需此额外步骤的情况下处理浮点数。）\n\
  \n### 练习 1.4.2\n\n为了处理流感季节后的过载问题，他们他们在镇的另一边建立了一座新的火葬场。它离这里 19.2 英里。编写一个程序，计算新火葬场比旧火葬场远多少。\n\
  \n## 变量简介\n\n计算机可以进行算术运算并不意外。本章前面的简单例子在某种程度上证明了这一点。但在现实世界中，程序很少直接使用立即值。相反，程序员使用变量来存储数学运算的结果。这种技术有助于增加程序的灵活性，还能提高源代码的可读性。\n\
  \n## 创建变量\n\n`variable`（变量）是内存中的一个存储位置。它像一个可以存放值的小格间。该值留在小格子里，可以随时使用，值也可以被另一个值替换。由于值可以变化，因此这个存储位置被称为变量。在\
  \ C 语言中创建变量，你必须告诉编译器分配一段内存用于存储。具体来说，你必须告诉编译器将存储什么类型的值，然后就会专门为该类型的值创建一个存储空间。\n\n\
  假设你的程序需要存储你的年龄（岁）。因为你的年龄是一个整数——一种整数类型的值——你需要一个整数变量来存储该值。在 C 语言中，你通过 `int` 命令来实现：\n\
  \n```c\nint age;\n```\n\n这条语句指示编译器为一个整数变量分配存储空间并将其命名为 `age`。该行以分号结尾，因为它是一条完整的 C\
  \ 语言语句。\n\n```c\nfloat distance;\n```\n\n这条语句指示编译器为一个浮点值分配存储空间。变量名为 `distance`。\n\
  \n变量通常在源代码的开头声明。这并非必须，但你必须在使用变量*之前*对其进行声明。程序员犯的最常见错误之一是使用了变量后却忘记声明它：\n\n```c\n#include\
  \ <stdio.h>\n\nint main()\n{\n    int age;\n    float distance;\n    printf(\"The\
  \ alien is %d years old and\\n\",age);\n    printf(\"comes from a planet %f microns\
  \ away.\\n\",distance);\n    return(0);\n}\n```\n\n这段源代码声明了两个变量：`age` 和 `distance`。然后并在\
  \ `printf()` 语句中使用它们来显示它们的值。这个例子的作用与本章前面的例子一样——只不过不是使用立即值，而是使用了变量的内容。\n\n将此文件保存到磁盘并将\
  \ `ALIEN.C`。编译并运行。结果会让你惊讶的！\n\n## 给变量赋值\n\n与其他某些编程语言不同，当 C 编译器为变量分配存储空间时，它并不会*初始化*该存储空间。你需要在使用变量之前为它分配一个值。否则，变量将包含编译器分配存储空间时内存中原本存在的任何随机垃圾数据。前一节演示了这一点。\n\
  \n在上一节的 `ALIEN.C` 程序中，变量 `age` 和 `distance` 被声明了，但从未被初始化或赋值。由于由于原因，其值使用了随机数据或垃圾值。显然，这并不是你想要写的程序。\n\
  \n在 C 语言中，使用等号给变量赋值，例如：\n\n```c\nage = 27;\n```\n\n在这一行中，值 `27` 被赋值给整数变量 `age`。值\
  \ `31.25` 被赋值给浮点变量：\n\n```c\ndistance = 31.25;\n```\n\n编辑 `ALIEN.C` 的源代码使其看起来像这样：\n\
  \n```c\n#include <stdio.h>\n\nint main()\n{\n    int age;\n    float distance;\n\
  \    age = 27;\n    distance = 31.25;\n    printf(\"The alien is %d years old and\\\
  n\",age);\n    printf(\"comes from a planet %f microns away.\\n\",distance);\n \
  \   return(0);\n}\n```\n\n在此代码中，增加了两条语句（第 8 行和第 9 行）为变量赋值。将其保存到磁盘。遗憾在这个例子中，使用变量和值的区别不大。\n\
  \n## 使用 int 变量\n\n你可以利用计算机的力量计算五年后你将多大。看看这个：\n\n```c\n#include <stdio.h>\n\nint\
  \ main()\n{\n    int age;\n    age = 43\n    printf(\"You are %d years old.\\n\"\
  ,age);\n    printf(\"In five years you’ll be %d years old!\\n\",age+5);\n    printf(\"\
  But today you’re still %d years old.\\n\",age);\n    return(0);\n}\n```\n\n将此源代码复制到编辑器中。确保在第\
  \ 7 行输入你的年龄。将文件存为 `AGE.C`。编译并运行。我看到：\n\n你 43 岁。\n年后你会 48 岁！\n但今天你还是 43 岁。\n\n注意，在第二个\
  \ `printf()` 函数末加上 5 不会影响存储在 `age` 中的值。第三条 `printf()` 语句证明了 `age` 没有改变。\n\n## 修改变量的内容\n\
  \n变量是变量！它们的内容可以改变。为了证明这一点，请考虑以下源代码，它是上一节 `AGE.C` 的修改版：\n\n```c\n#include <stdio.h>\n\
  \nint main()\n{\n    int age;\n    age = 43;\n    printf(\"You are %d years old.\\\
  n\",age);\n    age = age + 5;\n    printf(\"In five years you’ll be %d years old!\\\
  n\",age);\n    return(0);\n}\n```\n\n在这个例子中，变量 `age` 的值在第 9 行增加了 5。首先是数学计算：计算机将\
  \ 5 加到 `age` 中的值上（`age+5`）。在例子中，计算结果为 `48`。然后该值被存储在变量 `age` 中。因为计算机先计算等号右侧的数学表达式，所以什么都没有发生。\n\
  \n\n\n\n无论是否爆炸，重点是变量可以被反复使用，它们的值可以在整个程序运行过程中发生变化。\n\n### 练习 1.4.3\n\n编写一个程序，从你的体重减去\
  \ 20 磅，并幽默地显示结果。\n\n## 使用 `float` 变量\n\n假设月球现在距离地球 378,921.46 公里。（根据我见过的月球人的，月球的真实距离是变化的）。如果你的汽车行驶速度为每小时\
  \ 140 公里，行驶这段距离需要多长时间？\n\n管它呢！让计算机来计算吧：\n\n```c\n#include <stdio.h>\n\nint main()\n\
  {\n    float duration;\n    duration = 378921.46 / 140;\n    printf(\"It would take\
  \ %f hours to drive to the moon.\\n\",duration);\n    return(0);\n}\n```\n\n![Warning(bomb)](img/Warning(bomb).jpg)\n\
  \n注意，你在输入值 `378,921.46` 时不要加逗号。记住这一点！在你的源代码中，数字是不带逗号的！如果你忘记了并将它们加进去，编译器就会“作呕”。\n\
  \n将源代码保存到磁盘为 `MOON.C`。编译并运行。\n\n行驶到月球需要 2706.581787 小时。\n\n最好带上零食。\n\n## 使用多个变量\n\
  \n与其在 `MOON.C` 中使用立即值，你只需要指定变量。尽管这些立即值不会改变，但使用变量确实让代码更具可读性；例如：\n\n```c\nfloat duration;\n\
  float distance;\nfloat speed;\ndistance = 378921.46;\nspeed = 140;\nduration = distance\
  \ / speed;\n```\n\n在这个示例中，创建了两个新的 `float` 变量 `distance` 和 `speed`，并为它们赋值。最后，使用这些新变量来计算\
  \ `duration` 的值，这有助于提高程序的可读性。但并不是课程的全部。\n\n正如你经常发现的那样，C 语言充满了快捷方法。在这里，你可以将所有的 `float`\
  \ 变量声明写在同一行来节省几行代码，如下：\n\n```c\nfloat duration,distance,speed;\n```\n\n此声明告诉编译器为三个名为\
  \ `duration`、`distance` 和 `speed` 的 `float` 变量留出空间。（多个 `int` 变量也可以这样这样声明。）\n\n这里是修改后的程序：\n\
  \n```c\n#include <stdio.h>\n\nint main()\n{\n    float duration,distance,speed;\n\
  \    distance = 378921.46;\n    speed = 140;\n    duration = distance / speed;\n\
  \    printf(\"It would take %f hours to drive to the moon.\\n\",duration);\n   \
  \ return(0);\n}\n```\n\n源代码现在在一行中声明了三个变量；此外，通过使用命名良好的变量而不是立即值，你让方程（第 10 行）更具可读性：`duration\
  \ = distance / speed`。\n\n重新编辑 `MOON.C` 的源代码并进行上述修改。保存到磁盘，然后编译并运行：\n\n行驶到月球需要 2706.582031\
  \ 小时。\n\n### 讨论精度的时\n\n你可能注意到，使用第一个版本的 `MOON.C` 行驶到月球需要 2,706.581787 小时，而由于某种原因，第二个版本需要\
  \ 2,706.582031 小时。为什么会有两个值？\n\n答案是精度。如果你读过本章之前的侧边栏“整数和浮点数之间的真实区别”，你应该记得计算机必须使用二进制来跟踪浮点值。这种技术的准确性是的。数字的精度被认为只有六或七位数字。任何浮点运算的结果精确到只有六或七位数字。结果的其他部分都是无意义的垃圾。\n\
  \n例如，在 `MOON` 程序中，数字只有 `2706.58`（六位数字）是正确的。其余都是计算机编造的胡话。通常来说，这是可以的。`Float` 变量精确到六或七位，这通常足够了。如果你需要更多，可以使用其他变量类型，我会在书中后面介绍。现在，六位足够了。\n\
  \n顺便说一下，程序产生两个不同的结果是因为处理距离值的方式。首先，它被当作立即值使用。其次，它被存储在变量中然后使用。这种细微的差别足以改变浮点结果末尾出现的“噪声”。\n\
  \n## 立即声明变量的值\n\n在 C 中，你可以享受到单条语句中完成几事的权利。你已经在本章前面看到这种技巧了：\n\n`printf(\"Here’s your\
  \ integer value %d.\\n\",123+543);`\n\n你可以使用变量 `total` 来编写这一行，如下：\n\n```c\nint total;\n\
  total = 123+543;\nprintf(\"Here’s your integer value %d.\\n\",total);\n```\n\n相反，使用了立即值。结果是相同的，但它展示了\
  \ C 如何组合语句来节省空间。\n\n实现此事的另一种方法是在声明时赋值；例如：\n\n```c\nfloat duration;\nfloat distance\
  \ = 378921.46;\nfloat speed = 140;\n```\n\n与其分开逐行声明（如前所述），变量在声明时被赋值。这种细微的差别足以减少步骤。这个改进后的\
  \ `MOON.C` 源代码如下所示：\n\n```c\n#include <stdio.h>\n\nint main()\n{\n    float duration,distance,speed;\n\
  \    distance = 378921.46;\n    speed = 140;\n    duration = distance / speed;\n\
  \    printf(\"It would take %f hours to drive to the moon.\\n\",duration);\n   \
  \ return(0);\n}\n```\n\n重新编辑 `MOON.C` 的源代码并进行上述修改。保存到磁盘，然后编译并运行：\n\n行驶到月球需要 2706.582031\
  \ 小时。距离是 378921.46 公里。你可能注意到，使用第一个版本的 `MOON.C` 行驶到月球需要 2,706.581787 小时，而由于某种原因，第二个版本需要\
  \ 2,706.582031 小时。为什么值不同？\n\n答案是精度。如果你读过本章之前的侧边栏“整数和浮点数之间的真实区别”，你应该记得计算机必须使用二进制来跟踪浮点值。这种技术的准确性是有限的。数字的精度被认为只有六或七位数字。任何浮点运算的结果精确到只有六或七位数字。结果的其他部分都是无意义的垃圾。\n\
