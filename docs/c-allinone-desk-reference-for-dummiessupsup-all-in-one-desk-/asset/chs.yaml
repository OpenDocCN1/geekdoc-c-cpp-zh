  \ IDE 及选择最适合你的那个所需的基础知识。\n\n## How it works\n\n创建多模块程序的关键是要知道：尽管代码存在于不同的文件中，但整个程序仍然是一个整体.`MODULEA.C`中的代码可以轻松调用\
  \ `MODULEB.C`中使用的函数 。同样地通过使用 `extern`关键字可在多个模组之间共享全局变量只要你能调用函数(并向其传递值并从返回值 )并且能访问到那些公开定义的量那自然就说得通啦~)\n\
  \n当编译一个模式的时候你会用到 gcc 指令的一种变形形式:\n```\ngcc -c module.c\n```\n\nGCC 编译器对源代码文件 forming\
  \ modul c 作处理以便生成后缀是.o (抑或是 .obj)所谓目标码并非一次性产出可运行的执行档 ;每一个独立分组都用类似手段进行单独管控直至最后链接环节降临才整合\
  \ 。\n在此之后若想将它们完全衔接起来请遵循下方命令行:\n\n```bash \ng moda o mdb oc odd o\n```\n\n一旦看到来自\
  \ GCC 出现诸多带.os 扩展名的东东便意味即将启动仅做连接任务而综合产物默认叫 a.out 又或者 exe；如果想要自定成品称呼就用这种格式：\n\n```shell\
  \ script   \ngc cod ob db cd od –o prog    \n ```\n\n如上所述系统就会把所有四个对象拼合在一起形成新产物叫做\
