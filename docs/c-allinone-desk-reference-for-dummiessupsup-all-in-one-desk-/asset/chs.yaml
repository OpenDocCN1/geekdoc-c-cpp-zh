  \ 是 5。\n\n![Remember](img/Remember.jpg)\n\n官方优先级顺序是乘法和除法优先（从左到右），然后是加法和减法（从左到右）。\n\
  \n## 使用括号欺骗老 Sally\n\n你可以，有时也必须，覆盖优先级。例如，如果你尝试计算三倍利润，你会想要使用像这样的程序：\n\n```c\n#include\
  \ <stdio.h>\n\nint main()\n{\n    int profits,profits3;\n    int income = 20;\n\
  \    int expenses = 7;\n    profits = income - expenses;\n    profits3 = income\
  \ - expenses * 3;\n    printf(\"Sale profits were $%d.\\n\",profits);\n    printf(\"\
  Triple profits would have been $%d.\\n\",profits3);\n    return(0);\n}\n```\n\n\
  将此源代码保存到磁盘为 `PROFITS.C`。编译并运行：\n\nSale profits were $13\nTriple profits would have\
  \ been $9\n\n在优先级顺序中，`expenses * 3` 先被计算，使费用增加了三倍，而不是利润。秘密是使用括号告诉编译器该做什么。\n\n重新编辑\
  \ `PROFITS.C` 的源代码。修改第 10 行为：\n\n`profits3 = (income - expenses) * 3;`\n\n\n\n`++`\
  \ 运算符告诉计算机将 `count` 的值加 1。点点点！或者，加加加！或者，加加加！无论 `count` 原本的值是多少，多亏了 `++`，它现在都大了 1。这是一个演示程序：\n\
  \n```c\n#include <stdio.h>\n\nint main()\n{\n    int age;\n    printf(\"Enter your\
  \ age in years:\");\n    scanf(\"%d\",&age);\n    printf(\"You are %d years old.\\\
  n\",age);\n    age++;\n    printf(\"In one year you’ll be %d.\\n\",age);\n    return(0);\n\
  }\n```\n\n噢，天哪。又是一个“你多大了？”的程序。请耐心一下，把它输入到你的编辑器中。将源代码保存到磁盘并命名为 `YEAROLD.C`。编译并运行。\n\
  \n输入你的年龄（岁）：\n\n现在还谁会按月来输入年龄呢？按闰年来算怎么样？反正，我输入了 24，梦想着我 24 岁时的那天：\n\n你今年 24 岁。\n\n\
  一年后你就 25 岁了。\n\n耶哈！变量 `age` 的值通过 `age++` 改变了。之后，值增加了 1。这就是递增！\n\n### C++ 的奥秘\n\n\
  `++` 运算符意味着对它前面的任何内容“加 1”。当轮到为 Bjarne Stoustroup 在 1983 年开发的 C 语言变体命名时，他选择将其命名为\
  \ `C++`，意为“在 C 的基础上再加一个”。这些人类真聪明。\n\n另一方面，当微软对太阳微系统（Sun Microsystems）的 Java 语言进行实现时，他们选择将其命名为\
  \ `C#`，或者读作“C sharp”。这是一个音乐术语；`#` 与 C 编程语言没有任何关系——许多 C# 的反对者指出，`C#` 与 C 编程语言也几乎没有关系。\n\
  \n### 练习 1.9.3\n\n现在你已经了解了 `++` 运算符，请修复第 7 章中的程序 `BIGEARS.C`。修改 `for` 语句以使用 `++`\
  \ 运算符。\n\n## 从中减去 1\n\n为了保持世界的和谐平衡，C 中的 `--` 运算符与 `++` 运算符相对应。你可以称它为“减减”，但我叫它“dec\
  \ dec”，因为它的作用是对它修改的变量进行递减，或减去 1。例如：\n\n```c\ncount--;\n```\n\n这条语句从变量 `count` 的值减去\
  \ 1。它等同于\n\n`count = count - 1;`\n\n### 练习 1.9.4\n\n修改练习 1.7.2（第一卷，第 7 章）中的源代码 `BLASTOFF.C`。将\
  \ `for` 语句改为使用 `--` 运算符来修改变量 `countdown`。\n\n## 前递增和后递增\n\n这是一个谜题。如果变量 `alpha` 等于\
  \ 5，执行该语句后变量 `beta` 的值是多少：\n\n`beta = alpha++;`\n\n答案是 5。原因是 `++` 是一个后递增运算符。它在变量被使用*之后*增加变量的值。这是证明这一点的代码：\n\
  \n```c\n#include <stdio.h>\n\nint main()\n{\n    int alpha,beta;\n    alpha=5;\n\
  \    beta = alpha++;\n    printf(\"Alpha = %d\\n\",alpha);\n    printf(\"Beta =\
  \ %d\\n\",beta);\n    return(0);\n}\n```\n\n将源代码命名为 `PREPOST.C`。编译并运行：\n\nAlpha\
  \ = 6\nBeta = 5\n\n如果你觉得这个例子很奇怪并让你不舒服，请记住你始终可以将第 8 行拆分为两行：\n\n```c\nalpha++;\nbeta\
  \ = alpha;\n```\n\n或者，你可以利用 `++` 运算符可以位于变量任意一边的特性。当 `++` 出现在变量名之前时（如 `++alpha`），它是对\
  \ `alpha` 的值进行前增。\n\n修改 `PREPOST.C` 的源代码，将第 8 行改为：\n\n`beta = ++alpha;`\n\n保存到磁盘。重新编译并运行。观察输出：\n\
  \nAlpha = 6\nBeta = 6\n\n`alpha` 的值*先*增加了，然后将它的值赋值给变量 `beta`。\n\n你可以对 `--` 运算符执行同样的操作。如果它出现在变量之后，变量会在在使用后递减。该修改在第\
  \ 8 行如下所示：\n\n`beta = alpha--;`\n\n或者，如果 `--` 运算符出现在变量名之前，值会先递减后被使用：\n\n`beta =\
  \ --alpha;`\n\n注意这种构造是不允许的：\n\n```c\n++alpha++;\n```\n\n这不是“双重递增”。事实上，如果你尝试这样做，编译器会生你的气。\n\
  \n### 练习 1.9.5\n\n再次修改 `PREPOST.C` 的源代码。通过仅修改第 8 行，让结果 `alpha` 等于 4 且 `beta` 等于\
  \ 5。\n\n## 其他晦涩简写\n\n涉及到晦涩简写时，C 充满了这类简写！你可能会认为 `++` 和 `--` 就足够了。但不！必须更多。毕竟，更多类型的方程类似于以下：\n\
