  \ `a` 变量，输出变得稍微清晰了点。与其如此，看看第 7 行的 `for` 语句：\n\n`for(a=1,b=2;b<=20;a=a+1,b=b+2)`\n\
  \n初始化了两个变量：\n\n`a=1`\n`b=2`\n\n“as long as”部分保持不变：`b<=20`。但代码有两个 *“do this\"* 执行部分：\n\
  \n`a=a+1`\n`b=b+2`\n\n每一个部分都在循环完成时执行。通过将所有内容压缩到循环中，你使源代码变得更短，尽管是以牺牲可读性为代价。下面的示例是在不大量使用\
  \ `for` 语句的情况下对源代码进行的重写：\n\n```c\n#include <stdio.h>\n\nint main()\n{\n    int a,b;\n\
  \    printf(\"Here is your two’s table:\\n\\n\");\n    a=1;\n    for(b=2;b<=20;b=b+2)\n\
  \    {\n        printf(\"2 * %d = %d\\n\",a,b);\n        a=a+1;\n    }\n    return(0);\n\
  }\n```\n\n你不需要输入这段源代码；它仅仅说明了如何在不改动 `for` 语句的情况下完成同样的事情。\n\n## 第 8 章：使用常量\n\n###\
  \ 本章内容\n\n- ![bullet](img/check.png) 理解常量\n- ![bullet](img/check.png) 处理立即值的变化\n\
