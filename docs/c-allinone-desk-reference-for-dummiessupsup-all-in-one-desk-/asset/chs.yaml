  \n将修改后的 `SPONSOR.C` 程序保存到磁盘。编译并运行：\n\n`This program is sponsored by the letter ‘P’`\n\
  \n查看附录 F 获取转义序列的完整列表以及它们代表的字符。注意，任何一个都可以在单引号中指定以表示你程序中的特殊字符。\n\n## 这里有 `char`，那里有\
