  \ successful\n\nString is:\n\"Now we have wrinkles on our face, but pruney has them\
  \ everyplace.\"\nMemory has been released\nString is:\n\"p7=\"  \n```\n\n最后那个包含输出的语句仅用作演示目的。由于已经释放了相关内存区域（本无字符可输出），随机结果大致验证了这一观点。\n\
