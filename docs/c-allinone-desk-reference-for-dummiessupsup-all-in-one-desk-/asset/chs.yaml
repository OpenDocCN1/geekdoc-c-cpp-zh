  \n\n\n\n本章开始探讨许多人认为 C 语言中最别扭的部分：指针。除了它古怪的名称外，指针之所以被误解，是因为许多教授 C 语言的人自己也没完全理解指针。因此，这是关于指针的几章中的第一章，旨在让你一步步轻松地掌握这个概念。\n\
  \n![记住](img/Remember.jpg)\n\n你应该将为本书这部分内容创建的源代码和程序保存到计算机硬盘上的`advanced`文件夹或目录中。\n\
  \n## 基本且枯燥的计算机内存知识\n\n在理解指针之前,你需要了解计算机内部的内存相关知识.\n\n你可能已经知道,内存也被称为 RAM(随机存取存储器).\"\
