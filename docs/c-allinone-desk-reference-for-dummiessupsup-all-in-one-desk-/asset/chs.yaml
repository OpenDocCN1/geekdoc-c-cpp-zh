  \ 循环\n\n我对能悄无声息且高效地遍历链表的 `for` 循环深感折服。不，这并非我的杜撰（绝非如此！），但我由衷钦佩它的精妙。\n\n以下是通用链表语言中的这个循环：\n\
  \n```c\nfor(current = first; current != NULL; current=current->next)\n```\n\n该循环的第一部分初始化了指针列表，将“当前”指针设置为指向此列表的首条记录。这只是用于设置。\n\
  接下来是——毫不夸张地说！接着是什么？这不是让人混淆的\"while true\"标准术语：实际上我们在“While True”段落中看到的*特指仅当在每次迭代条件检查后、执行后续语句之前使用的场景*,它检测变量是否等于空值——所以更简单的解释是作为**终止条件校验**。最后还有‘do-this’这一步:每一步重复执行,沿着链条前进一个节点并持续直到抵达终点。\n\
