  ```\np = primes;\nc = cent;\n```\n\n**3.** 使用星号表示法来代表一个数组成员：\n```\n*p\n*c\n```\n\
  \n**4.** **递增**指针对应到下一个元素的地址上。\n```\np++;\nc++;\n```\n\n如果你想走捷径怎么办？对于下面这种在《CENT.C》程序中出现的语句该如何理解？\n\
  \n``` \nprintf(“cent[%d] = %d\\n”,x,*c++);\n````\n\n究竟什么是“*C ++”，它有什么作用？\n您对此类结构不应感到完全陌生。你应该能识别出“\
  \ \\*C ”是一个指针，这意味着 C”包含着一个内存地址。\n\n你还应该认识用于递增值的运算符\" + \" 。所以问题实际上是：“被增加的是什么？”是内存地址改变了还是该址中的值发生了改变呢?\n\
  \n哦麻烦死了！为什么不让计算机亲口告诉你答案呢?\n打开名为 “Primess.c”  的程序源码然后将循环修改成以下的样式:\nfor(x=0;x<10;x++)\n\
  \     printf( \"% d\\ n \",*\\ p )\n正在所做的操作其实就是把紧随其后的命令句柄部分与前面的内容合并到一起执行：将它们两个同放在一起就像是被放进台钳里夹住一样形成这样的表达形式\
  \ .因此实际操作过程就等价于 (\\*) (++) 。\n\n保持改动后保存文件并重新编译运行一下看看效果吧！\n程序的输出结果并未发生变化，“(*)(+)”这个表达式所进行的操作为更新当前所指代的存储单元的位置编号并非是对已存在的数值本身加以变动更改——究其原因是因为符号‘加加’相对于运算对象‘P\
  \ ’有着更强的绑定关系优先级别高于那个取成员指示符而产生的现象罢了；在此特意提起此话题是由于其在Ｃ语言中处理数据的遍历扫描过程中会经常用到这类运算法则的缘故哟！\n\
