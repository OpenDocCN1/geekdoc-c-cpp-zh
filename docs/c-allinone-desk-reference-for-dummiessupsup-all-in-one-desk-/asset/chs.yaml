  ## 介绍逻辑或\n\n当你用逻辑或连接两个比较时，只要其中一个条件为真，整个语句就为真。这里有一个示例程序：\n\n```c\n#include <stdio.h>\n\
  \nint main()\n{\n    int age;\n    printf(\"Please enter your age in years:\");\n\
  \    scanf(\"%d\",&age);\n    if(age<=18 || age>=65)\n        puts(\"Enjoy life\
  \ while you can!\");\n    else\n        puts(\"Get back to work!\");\n    return(0);\n\
  }\n```\n\n将此代码输入你的编辑器。保存到磁盘为 `LIFE.C`。编译。运行程序三次，尝试三个不同的年龄：小于 18 岁的、大于 65 岁的以及中间的。\n\
  \n第 9 行 `if` 语句进行了两次比较。第一个是 `age<=18`，第二个是 `age>=65`。只要其中一个为真，`||`（逻辑或）会让整个语句为真。只有当两个都不真时，`||`\
  \ 才会失败并执行 `else` 语句。\n\n表 10-2 解释了逻辑或如何评估比较。\n\n![表 10-2](img/570692_bk01Table10-2.jpg)\n\
