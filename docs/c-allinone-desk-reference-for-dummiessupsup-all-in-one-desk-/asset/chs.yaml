  \ ——正如库定义中的 char *string 那样——但事实并非如此。\n\n在库的定义中，“char *string”指向内存中的一个字符串（字符数组）。而你的变量*t\
  \ 则是单个字符、数组的一个元素——而不是整个字符串。《编译器刚告诉过我们》单独一个变量和一个数组之间存在“巨大”差异）。\n\n为了改正这一点请把程序的第 12\
