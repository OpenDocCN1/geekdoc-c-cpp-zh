    # # CHAPTER 4

    ( Control Statements (Looping) )


    # ## Introduction-


    Sometimes we want some part of our code to be executed more than once. We can
    either repeat the code in our program or use loops instead. It is obvious that
    if for example we need to execute some part of code for a hundred or more times
    it is not practical to repeat the code. Alternatively we can use our repeating
    code inside a loop.


    ```

    ```c

    while(not a hundred times)

    {

    code

    }

    ```

    ```


    The loop repeat the some portionof the program until a specified number of time
    or until a particular condition is being satisfied. **Or** In other words you
    can say, The Looping is a process of repeating a single statement or a group of
    statements until some condition for termination of the loop is satisfied.


    There are a few kinds of loop commands in C programming language. We will see
    these commands in next sections.


    **There are four Parts of a loop -**


    +   1. **Initialization.**'
