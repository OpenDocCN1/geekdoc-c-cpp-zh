    # 4. Debugging Tools-


    Many methods of debugging a program compare the program''s behavior with the correct
    behavior in great detail. Usually the normal output of the program does not show
    the detail needed. Debugging tools allow you to examine the behavior of the in
    more detail.


    # 4.1 The assert Macro-


    The assert macro is a quick and easy way to put debugging tests into a C/C++ program.
    To use this macro, you must include the assert.h header file near the top of your
    source file. Using assert is simple. The format is:


    ```

    assert(boolean (or int) expression);

    ```


    If the boolean expression evaluates to true (i.e., not zero), the assert does
    nothing. However, if it evaluates to false (zero), assert prints an error message
    and aborts the program. As an example, consider the following assert:


    ```

    assert( x != 0 );

    ```


    If x is zero, the following will be displayed: Assertion failed: x != 0, file
    err.c, line 6 Abnormal program termination And the program will abort. Notice
    that the actual assertion, the name of the file and the line number in the file
    are displayed. The assert macro is very useful for putting sanity checks into
    programs. These are conditions that should always be true if the program is working
    correctly. It should not be used for user error checking (such as when the file
    a user requested to read does not exist). Normal if statements should be used
    for these runtime errors. Of course, in a commercial program, an assertion failure
    is not particular helpful'
