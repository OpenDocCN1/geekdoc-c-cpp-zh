  md: 'As a result, user doesn’t have to spend long periods of times mastering a new
    program.Every program occupies a window-a rectangle area on the computer screen,
    a window is Identified by its personal title bar.


    Most programs functions are initiated throughThe program''s menu. If info. Is
    large then use of scroll bars, dialog boxes for Entering Some user info. Once
    u know how to use one window program, then u can easily understand Another. Keyboard
    and mouse interfacing.


    # 4.Hardware Independent Programming:


    As I tell u that a window program can easily call windows API Function. thus an
    application can easily communicate with operating system, how windows easily communicate
    with hardware ?


    suppose we have a written program that contains a menu item, which on selection
    is suppose to display a string "wel come to eve reserch labs India" in the window.
    the menu item can be selected by keyboard or using the mouse. on executing this
    program it will perform initialization and then wait for the user input.


    After input by user any key or click the mouse to select the menu item. the key-press
    or mouse-click is known as an ''event'' as u know Visual Basic programming.the
    occurrence of this event is sensed by the keyboard or mouse driver. the device
    driver would now informed windows about it.


    Windows would in turn notify the application about the occurrence of this event
    of this particular event. this notification known as "message". thus the o.s has
    communicated with application.


    When than application receive the message, it communicated back with the o.s by
    the calling a windows API function to display the string "wel come to EVC reserch
    labs India" in this API function in turn communicates with the **device driver
    of the graphics card** that drives the screen, to display the string. thus there
    is a two-way communication between the o.s and the application.


    # 5.Event Driven Programming model.


    When a user intract with windows program a lot of events occur.for each event
    a message is sent to the program and the program reacts to it.since the order
    in which the user would interact with the user-interface elements of the program
    can not be predicted the order of occurrence of events.'
  merge: -1
  img_proc: true
- pgno: 400
  md: 'And hence the order of the messages,also became unpredictable.as the result,the
    order of calling the functions in the program (that react to different messages)
    is dicatated by the order of occurrence of events. Hence this programming model
    is called “Event Driven Programming Model”.


    There can be hundreds of the ways in which the user may interact with an application.
    In addition to this , some events may occur without any user user interaction.
    For example, events occur when we create a window, when the window contant are
    to be drawn,etc.


    Thus ,literally hundereds of the messages may be sent to an application thereby
    creating a chaos. Naturally a question comes- in which order would thease messages
    get processed by the application. Order is brought to this chaos by putting all
    the messages that reach the application into a “Queue”. The messages in the queue
    are processed in first in first out (FIFO) Algorithm order.


    In fact the o.s maintains several such queues. There is one queue, which is common
    for all application. This queue is known as “system Message Queue”. In addition,
    there is one queue per application. Such queues are called “Application Message
    Queue”. Let understand the need for maintaining so many queues. When we click
    a mouse and an event occurs the device driver posts a message into the system
    message queue. The OS retrives this message finds out with regard to which application
    the message has been sent. Next it posts a message into the Application Message
    Queue of the application in which the mouse was clicked.


    Thus really all that is there to event-driven programming. Your job is to anticipate
    what user are likely to do with ur Application’s user interface objects and have
    a function waiting,Ready to execute at the appropriate time.just when that time
    is, no one except the user really wanna to say.


    You need to understand this first that the difference of simple software programming
    and window o.s development programming, the window programming model is in the
    “MACRO” level, let us dig futher and see some obvious issues that will need while
    u developing programming for the window o.s enviornment.


    # There are following issues:-


    +   (A) SIZE OF POINTERS.

    +   (B) SIZE OF INTEGERS.'
