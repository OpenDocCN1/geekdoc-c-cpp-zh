    \tp2->inches = t;\n}\n```\n\n# Union -\n\nUnion are also derived data types. They\
    \ are also used to group together a number of variables. But the difference is\
    \ that all the members of the union share the same memory location, therefore\
    \ only one member of the union is can store valid value at one time. A union is\
    \ a variable that is used to store data of different types at different times.\n\
    \nThe union is much like a structure. The different variables defined in the union\
    \ are called members of the union. They need not be of the same data type. If\
    \ one member contains a value and another member is assigned a value then the\
    \ first value will be overlapped by the second value. The compiler allocates enough\
    \ memory to hold the largest member of the union. Since the memory space is shared,\
    \ this is a way to save the memory.\n\n# Syntax:\n\n```\nunion <union type name>\n\
    {\n\t<type> <variable names> ;\n}\n```"
