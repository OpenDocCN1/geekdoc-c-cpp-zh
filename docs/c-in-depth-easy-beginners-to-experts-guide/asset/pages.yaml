    # 4.2 Print Statements-


    This time honored method of debugging involves inserting debugging print statements
    liberally in your program. The print statements should be designed to show both
    what code the program is executing and what values critical variables have.


    # 4.3 Debuggers-


    The previous method of debugging by adding print statements has two disadvantages:


    +   1. When new print statements are added, program must be recompiled.

    +   2. Information output is fixed and cannot be changed as program is running.


    Source-level debuggers provide a much easier way to trace the execution of programs.
    They allow one to:


    +   1. Look at the value of any variable as the program is running.

    +   2. Pause execution when program reaches any desired statement. (This position
    in the program is called a breakpoint).

    +   3. Single step statement by statement through a program.


