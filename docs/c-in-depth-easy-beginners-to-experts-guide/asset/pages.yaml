- pgno: 422
  md: 'double x = sqrt(2);


    will not work correctly if a prototype:


    double sqrt(double);


    Does not appear above it. Why? Without a prototype, the C compiler assumes that
    sqrt() returns an int. Since the returned value is stored in a double variable,
    the compiler inserts code to convert the value to a double. This conversion is
    not needed and will result in the wrong value.


    The solution to this problem is to include the correct C header file that contains
    the sqrt() prototype. For functions you write, you either place the prototype
    at the top of the source file or create a header file and include it.


    # 2.8 Not initializing pointers-


    Anytime you use a pointer, you should be able to answer the question: What variable
    does this point to? If you cannot answer this question, it is likely it doesn''t
    point to any variable.


    This type of error will often result in a Segmentation fault/core dump error on
    UNIX/Linux or a general protection fault under Windows. (Under good old DOS anything
    could happen!)


    Here''s an example of this type of error.


    ```

    ```c

    #include <string.h>

    int main()

    {

    char *st; /* defines a pointer to a char or char array */

    strcpy(st, "abc"); /* what char array does st point to?? */

    return 0;

    }

    ```

    ```


    How to do this correctly? Either use an array or dynamically allocate an array.


    ```

    ```c

    #include <string.h>

    int main()

    {

    char st[20]; /* defines an char array */

    strcpy(st, "abc"); /* st points to char array */

    return 0;

    }

    ```

    ```'
