- pgno: 12
  md: '> > *The purpose of a computer program is to make the computer do something.*


    The object of programming is to “make it happen.” The C language is only a tool
    for communicating with the PC.


    As the programmer, it’s your job to translate the intentions of the computer user
    into something the computer understands and then give users what they want. And
    if you can’t give them what they want, at least make it close enough so that they
    don’t constantly complain or — worse — want their money back.


    The tool you have chosen to make it happen is the C programming language. That’s
    the code you use to communicate with the PC. The following sections describe how
    the process works. After all, you can just pick up the mouse and say “Hello, computer!”


    +   - Programming is what TV network executives do. Computer programmers Code.

    +   - You use a programming language to communicate with the computer, telling
    it exactly what to do.


    # The source code - (Text file)


    Because the computer can’t understand speech and, well, whacking the computer
    — no matter how emotionally validating that is for you does little to the PC,
    your best line of communications is to write the computer a note a file on disk.


    To create a PC epistle, you use a program called a text editor. This program is
    a primitive version of a word processor minus all the fancy formatting and printing
    controls. The text editor lets you type text — that’s about all.


    Using your text editor, you create what’s called a source code file. The only
    special thing about this file is that it contains instructions that tell the computer
    what to do.


    And although it would be nice to write instructions like “Make a funny noise,”
    the truth is that you must write instructions in a tongue the computer understands.
    In this case, the instructions are written in the C language.


    +   - The source code file is a text file on disk. The file contains instructions
    for the computer that are written in the C programming language.'
