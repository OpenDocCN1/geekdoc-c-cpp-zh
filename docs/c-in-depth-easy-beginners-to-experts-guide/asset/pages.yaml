  md: 'Variable declared outside all the functions have external storage class. Extern
    storage class should be used for only those variables which are being used by
    all the functions in the programs, Now there is no need to pass a variable in
    all the functions.


    But it is also not advisable to store all the variables as extern because it will
    remain active through out the life of the program thus wasting a lot of memory
    unnecessarily. The external variables are declared as extern int c; It is also
    used when the variables of one program have to be used in some other programs
    also for example:-


    | File1.c | File2.c |

    |---------|---------|

    | #include "File2.c"

    int a; /*Variable definition */

    main()

    {

    a = 5;

    func();

    printf("%d",a);

    } | extern int a; /*Variable declaration*/

    void func()

    {

    a=10;

    } |


