    # **Bit Fields -**


    If in a program a variable is to store only two values1 or 0, we need only one
    bit to store it. Similarly if the variable is to store values from 0 to 3, then
    only two bits are required because the binary of all the numbers from 0 to 3 is
    of two bits. And if the values vary from 0 to 7, then four bits are required.


    But if we store an integer then 2 bytes will be used, thus wasting a lot of memory
    because there is no data type which deals with the bits. However when there are
    several variable having values which can be packed into a single memory location,
    we can use ‘bit fields’.


    Suppose we want to store the following data about an member of a club. Each member
    can have following data:


    +   1. Male or Female.

    +   2. Married or Un Married or Widow or Divorce.

    +   3. Have any one of the eight hobbies (Cricket, Football etc.).

    +   4. Can choose from any of the sixteen schemes (Yearly scheme, monthly scheme,
    etc.)


    If we store 0 or 1 in gender in place of Male, Female then this will save some
    bytes. In the same way the other values can be converted in numbers.


    This means we need one bit to store gender, two bits to store, marital status,
    three bits to store hobby, four bits to store the schemes. Thus in together we
    need 10 bits altogether, so we can pack all this above information in two bytes.'
