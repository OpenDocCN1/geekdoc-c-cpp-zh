    # **Operators:-**


    The preprocessor also includes two special operators: defined #, and ##.


    # **Stringizing operator (#):-**


    It allows a formal argument within a macro definition to be converted to a string.
    If a formal argument in a macro definition is precede by this operator , the corresponding
    actual argument will automatically be enclosed in double quotes.


    # **Token pasing operator (##):-**


    It causes individual items within a macro definition to be concatenated thus forming
    a single item.


    # **Example:**


    ```

    ```c

    #define display(i) printf("x" #i "=%f\n",x##i)

    ```

    ```


    Suppose this macro is accessed by writing    display(3);


    The result will be:     printf("x3=%f\n", x3);


    Thus the expression x##i becomes the variables x3, since 3 is the current value
    of the argument i.


