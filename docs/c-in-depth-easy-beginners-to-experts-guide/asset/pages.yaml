- pgno: 421
  md: '# 2.5 Integer division


    Unlike Pascal, C uses the / operator for both real and integer division. It is
    important to understand how C determines which it will do. If both operands are
    of an integral type, integer division is used, else real division is used. For
    example:


    ```

    double half = 1/2;

    ```


    This code sets half to 0 not 0.5! Why? Because 1 and 2 are integer constants.
    To fix this, change at least one of them to a real constant.


    ```

    double half = 1.0/2;

    ```


    If both operands are integer variables and real division is desired, cast one
    of the variables to double (or float).


    ```

    int x = 5, y = 2;

    double d = ((double) x)/y;

    ```


    # 2.6 Loop errors –


    In C, a loop repeats the very next statement after the loop statement. The code:


    ```

    int x = 5;

    while( x > 0 );

    x--;

    ```


    Is an infinite loop. Why? The semicolon after the while defines the statement
    to repeat as the null statement (which does nothing). Remove the semicolon and
    the loop works as expected.


    Another common loop error is to iterate one too many times or one too few. Check
    loop conditions carefully!


    # 2.7 Not using prototypes -


    Prototypes tell the compiler important features of a function: the return type
    and the parameters of the function. If no prototype is given, the compiler assumes
    that the function returns an int and can take any number of parameters of any
    type.


    One important reason to use prototypes is to let the compiler check for errors
    in the argument lists of function calls. However, a prototype must be used if
    the function does not return an int. For example, the sqrt() function returns
    a double, not an int.


