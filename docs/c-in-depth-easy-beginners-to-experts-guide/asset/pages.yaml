  md: '# Answers:


    1. False 2. False 3. False 4. True 5. True


    # 1. If a[i]=i++ is undefined, then by the same reson i=i+1 should also be undefined.
    But it is not so. Why?


    Answer: If an object is to be modified within an expression then all accesses
    to it within the same expression must be for computing the value to be stored
    in the object. The expression a[i]=i++ is disallowed because one of the accesses
    of i ( the one in a[i]) has nothing to do with the value that ends up being stored
    in i.


    In this case the compiler may not know whether the access should take place before
    or after the incremented value is stored.


    The expression i=i+1 is allowed because I is accessed to determine i''s final
    value.


    # 2. Does mentioning the array name gives the base address in all context?


    Answer: No, it is said that the array name has its base address in it. But the
    array does not give its base address in two situations:


    +   1. When array name is used with sizeof operator.

    +   2. When the array name is an operand of the & operator.


    # 3. Are the expressions a and &a for an array of 10 integers?


    Answer: No, Even though both the expressions give the same result in the above
    question they mean two different things. a gives the address of the first int,
    whereas &a gives the address of array of ints. Since these happen to be same the
    results of the expressions are same.


