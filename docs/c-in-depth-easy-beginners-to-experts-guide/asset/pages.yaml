    the function so it is called as external variable and its scope is global. It
    can also be used in another file File2.c. variable a used in both files is same.
    But when we compile the File2.c we have to inform the compiler that variable a
    will come from outside so we have declared a as extern int a;(no memory allocation
    at this time), but if we declare it as int a; then compiler will treat it as a
    new variable.


    # Register:-


    There are only 14 CPU registers to available and even lesser than that can be
    used by us as the microprocessor is using it. But the CPU registers are accessed
    by the computer very fast and so the program is executed very fast. So, it will
    be best used for loop counters which have to be used a number of times. However
    if a register is not free, auto storage class is used and the execution is carried
    on. The CPU registers are 2 bytes long. So their maximum range is equal to that
    of int. float values can not be stored in register. Even if we say register float
    x, auto is assumed for x. The variable for this class are declared as,


    ```

    register int d;

