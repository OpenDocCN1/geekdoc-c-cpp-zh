  md: '**Drill Note –** Continue statement can be used in loops. Like break command
    "continue" changes flow of a program. It does not terminate the loop however.
    It just skips the rest of current iteration of the loop and returns to starting
    point of the loop.


    # Example -


    ```

    #include<stdio.h>

    main()

    {

    while((ch=getchar())!=''\n'')

    {

    if(ch==''.'')

    continue;

    putchar(ch);

    }

    system("pause");

    }

    ```


    In above example, program accepts all input but omits the ''.'' character from
    it. The text will be echoed as you enter it but the main output will be printed
    after you press the enter key (which is equal to inserting a "\n" character) is
    pressed. As we told earlier this is because getchar() function is a buffered input
    function.


    Whereas break forces an immediate exit from the nearest enclosing loop the continue
    keyword causes the next iteration of the loop.


    In the case of while and do while loops, it jumps straight to the condition and
    re-evaluates it. In the case of the for loop, it jumps onto the update part of
    the loop, executes that, then re-evaluates the condition.


    # continue is Really Goto-


    Statements applying to the use of break similarly apply to continue. It is just
    another form of goto and should be used with care.


    Excessive use of continue can lead to spaghetti instead of code. In fact the loop
    above could just as easily be written as:


    ```

    for(j = 1; j <= 10; j++)

    if(j % 3 != 0)

    printf("%i\n", j);

    ```


