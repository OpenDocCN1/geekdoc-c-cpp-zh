    # Prevention-


    The software industry has put much effort into finding methods for preventing
    programmers from inadvertently introducing bugs while writing software.


    # These include:


    # Programming style-


    While typos in the program code are often caught by the compiler, a bug usually
    appears when the programmer makes a logic error. Various innovations in programming
    style and defensive programming are designed to make these bugs less likely, or
    easier to spot.


    In some programming languages, so-called typos, especially of symbols or logical/mathematical
    operators, actually represent logic errors, since the mistyped constructs are
    accepted by the compiler with a meaning other than that which the programmer intended.


    # Programming techniques-


    Bugs often create inconsistencies in the internal data of a running program. Programs
    can be written to check the consistency of their own internal data while running.
    If an inconsistency is encountered, the program can immediately halt, so that
    the bug can be located and fixed. Alternatively, the program can simply inform
    the user, attempt to correct the inconsistency, and continue running.


