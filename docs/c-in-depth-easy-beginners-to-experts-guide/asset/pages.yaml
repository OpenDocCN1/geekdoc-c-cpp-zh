  md: '# Altering the size of block -


    It is likely that we discover later, that the previously allocated memory is not
    sufficient and additional space would be required or the allocated memory is quite
    large than that needed.


    In both these cases the size of the block has to be altered this can be achieved
    by using function realloc (reallocating memory). The general syntax of realloc
    is:


    ```

    P= realloc(P, new size);

    ```


    # Mind Wash Drill –


    The new size can be larger or smaller than the previous one. Now let us see an
    e.g. suppose the block for storing 10 integers was allocated using the malloc
    as :


    ```

    P=(int*)malloc (10 * sizeof(int));

    ```


    Now to alter the size so that 5 more numbers can be stored the statement would
    be:


    ```

    P= realloc(P, 15);

    ```


    The function allocates a new memory space of size 15 to the pointer P and returns
    a pointer to the first byte of the new block.


    # Mind Wash Drill –


    Also remember that the new memory block may or may not begin at the same place
    as the old one.


    In such a case it creates a new memory space at some other place, copies all the
    old data there and returns the block address to the pointer.


