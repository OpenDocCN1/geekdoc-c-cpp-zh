  md: '# CHAPTER 13

    (Miscellaneous Topics)






    We already know that # define statement can be used to define symbolic constants.
    Thus constants provide a form of shorthand notation. Define statement can be used
    to define macros, i.e. they can be used to replace the expressions, complete statements
    or a group of statements.


    Program to find the maximum of two numbers using macro:


    ```

    #define max(a,b) a>b?a:b /*declaration of macro*/

    main()

    {

    int a,b,ans;

    printf("Enter two numbers");

    scanf("%d %d",&a,&b);

    ans = max(a,b);

    printf("max = %d",ans);

    getch();

    }

    ```


    The program contains a macro max, which represents the expression a>b?a:b. when
    the program is compiled, the expression a>b?a:b will replaces the identifier max.


    Macro definitions are customarily placed at the beginning of a file, ahead of
    the first file function definition. The scope of a macro is global.


    A multi-line macro can also be defined by placing a backward slash at the end
    of each line except the last. This feature permits a single macro to be represented
    as compound statement.'
