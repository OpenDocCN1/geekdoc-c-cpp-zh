    # CHAPTER


    # ∞ 3 ∞


    # (Control Statements-Conditions)


    # Introduction-


    Programs are much more useful if they can make decisions about what tasks need
    to be performed. Making a decision in a C program usually involves testing the
    value of one or more variables,


    for example, ''if X is greater than Y then carry out task 1,


    else carry out task 2''.


    C programs can use a range of tests to satisfy many different circumstances. The
    example given above uses the if-else construct and is just about the most simple
    test that a C program can perform.


    However, it is not too difficult to imagine that, having made this decision, task
    1 or task 2 may also be an ifelse type of test, leading to the execution of other,
    more specialized, tasks (perhaps including more tests). This can be achieved in
    C by using as many nested if-else constructs as required.'
