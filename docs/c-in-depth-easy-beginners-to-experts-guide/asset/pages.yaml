  md: 'An enumerated data type is a data type with user specified constant values.
    The syntax is similar to that of structure or union: It is used to define constants.
    The keyword is enum. It is followed by enumerator type. A list of names that are
    permissible values for this data type. The values are enclosed in braces and separated
    by commas.


    # Examples –


    ```

    enum bool{FALSE ,TRUE};

    /*false and true are constants with values 0 & 1. this numbering is done automatically*/

    ```


    ```

    enum bool b1,b2;

    /*objects of enum bool*/

    b1=FALSE;

    or

    b1=TRUE;

    ```


    ```

    enum dow {SUN,MON,TUE=5,WED,THU,FRI,SAT};

    /*automatic numbers will be SUN=0,MON=1,TUE=5,WED=6 & so on*/

    ```


    ```

    /*enum declaration*/

    enum color {blue, green, red, yellow};

    enum color c1,c2;

    ```


    ```

    /*assigning values*/

    c1 = red;

    c2 = green;

    ```


    ```

    /*enum declaration*/

    enum color {blue, green, red, yellow} c1,c2;


    /*assigning values*/

    c1 = red;

    c2 = green;

    ```'
