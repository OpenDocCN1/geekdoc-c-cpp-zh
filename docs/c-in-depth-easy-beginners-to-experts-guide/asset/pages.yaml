- pgno: 116
  md: 'marks of a single student.


    (ii) Use a single variable which can store the marks of all students.


    Obviously the second option looks better because it is easier to handle them.
    A single variable which can store more than one value at a time is called an Array.


    # Drill Note-


    It is a collection of homogeneous data elements stored continuously under a single
    name. Array declaration:-


    ```

    int a[6];

    ```


    Here a is the name of the array, int is the data type of values which the array
    will store, 6 is the size of array and [] are called as subscript operator. The
    size of array must be a constant. The most important thing is that all the values
    in the array should be of the same type.


    ![](img/3a2b6e5e90a58a56458b0539952c0cd2_116_0.png)


    10, 20, 30, 40, 50 are the elements of the array. To use the elements of the array
    we refer to the index. The array index starts from 0 i.e. if the size of the array
    is 6, so the indices of the array will be from 0 to 5.


    In the definition we also said that the elements of the array are stored continuously,
    i.e. if the element at 0 index has address 100 then the next elements will have
    addresses 102, 104, 106, 108, 110 if the array is an integer array because an
    integer occupies only 2 bytes. But if it was a float array the addresses will
    have been 100, 104, 108, 112, 116, 120 since a float number occupies 4 bytes.


    If there are more than one array of the same size are to be used in a program
    then another type of declaration can be used.


    # For Example,


    If the percentage of the students of a class is to be calculated and the marks
    of all the students is input in arrays. Then all the arrays should be of same
    size.'
