  md: 'It is the simplest of all the loops. This loop is used as follows:


    ```

    initialize;

    while(condition)

    {

    statement;

    increment or decrement;

    }

    ```


    while loop is an entry control loop. The condition is evaluated and if it is true
    the statement of the loop is executed. After the execution of statement and increment
    or decrement, the loop condition is tested again. This process of repeated execution
    of statement, increment or decrement and testing of condition continuous till
    the condition finally becomes false and the control of the loop is transferred
    to the next statement.


    # Syntax:


    ```

    initialization;

    while(condition)

    {

    statement;

    incrementation or decrementation;

    }

    ```


    # Free syntax:


    ```

    while( condition )

    command;

    while( condition )

    {

    block of commands

    }

    ```


    Loop condition is a boolean expression. A boolean expression is a logical statement
    which is either correct or incorrect. It has a value of 1 if the logical statement
    is valid and its value is 0 if it is not. Example the Boolean statement (3>4)
    is invalid and therefore has a value of 0. While the statement

    (10==10) is a valid logical statement and therefore its value is 1.'
