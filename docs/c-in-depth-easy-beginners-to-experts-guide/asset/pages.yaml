  md: '# Semicolon Warning! -


    Avoid Semicolons After while. We have already seen that problems can arise if
    a semicolon is placed after an if statement. A similar problem exists with loops,
    although it is more serious. With if the no op statement is potentially executed
    only once. With a loop it may be executed an infinite number of times.


    # Example -


    ```

    #include<stdio.h>

    main()

    {

    int i=0;

    while( i<100 )

    {

    printf("\ni=%d",i);

    i=i+1;

    }

    system("pause");

    }

    ```


    In above example i=i+1 means: add 1 to i and then assign it to i or simply increase
    its value. As we saw earlier, there is a special operator in C programming language
    that does the same thing. We can use the


    expression i++ instead of i=i+1.


    # Type Conversion -


    From time to time you will need to convert type of a value or variable to assign
    it to a variable from another type. This type of conversions may be useful in
    different situations, for example when you want to convert type of a variable
    to become compatible with a function with different type of arguments.


    Some rules are implemented in C programming language for this purpose. Automatic
    type conversion takes place in some cases. Char is automatically converted to
    int. Unsigned int will be automatically converted to int.'
