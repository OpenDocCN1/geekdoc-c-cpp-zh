  md: 'Thus dynamic memory can be described as the process of allocating memory at
    run time. C does not inherently have this facility but they can be included in
    the program using the header file alloc.h


    | Functions | Task |

    |---|---|

    | malloc() | Allocates the requested number of bytes and returns the starting
    address to a pointer. |

    | calloc() | Allocates the requested number of bytes, initializes them with zero
    and returns the starting address to a pointer.It allocates the non continous memory.
    |

    | realloc() | Reallocates the size by increasing or decreasing the no. of bytes
    and returns the starting address to a pointer. |

    | free() | Frees previously allocated space. |


    # Allocating a block of memory(malloc) -


    A block of memory may be allocated using the function malloc. The malloc function
    reserves a block of memory of specified size and returns a pointer of type void.
    This means we can assign the base address of the block to any type of pointer.
    The general syntax of malloc is:


    ```

    P= (cast type*) malloc(byte size);

    ```


    Now let us see an e.g.:


    ```

    P=(int*)malloc (10 * sizeof(int));

    ```


    Here the function malloc returns an integer type pointer p to an area of memory
    which has the capacity to store 10 integer numbers. Similarly, the statement


    ```

    P=(char*)malloc(10*sizeof(char));

    Or

    P=(char*)malloc(10); /*remember each charcter uses one byte*/

    ```'
