    # # CHAPTER ∞ 8 ∞


    (Your Brain On Functions)




    Function is a small program which take some input and give us some output. Function
    allow a large program to be broken down into a number of smaller self contained
    components, each of which has a definite purpose. It avoids rewriting the code
    over & over. Breaking down of logic into separate functions make the entire process
    of writing & debugging easier.


    Or another hand you can say Function is a self contained block of statements that
    is used to perform some task. A function is assigned some work once and can be
    called upon for the task any number of times. Every C program uses some functions,
    the commonly used functions are printf, scanf, main, etc.


    Functions can be library functions or user defined functions. Library functions
    are those functions which come along with the compiler and are present in the
    disk. The user defined functions are those which the programmer makes by himself
    to make his program easier to debug, trace.




    printf (), scanf(), exit(), pow0 are library functions. Every library function'
