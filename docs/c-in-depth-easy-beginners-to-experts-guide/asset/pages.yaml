  md: "```\n```\nint data;\nNODEPTR link;\n}*NODEPTR;\n```\n```\n\nAnswer: A typedef\
    \ defines a new name for a type, in this case however the error is that a typedef\
    \ cannot be used until it is defined. in the given code fragment the typedef declaration\
    \ is not yet defined at the point where the link field is declared.\n\nQuestion:\
    \ How will you eliminate the above problem?\n\nAnswer: To fix this problem, first\
    \ a name (\"struct node\") must be given to the structure. Then declare the link\
    \ field as a simple struct node * as shown below:\n\n```\n```\ntypedef struct\
    \ node\n{\n\tint data;\n\tNODEPTR link;\n}*NODEPTR;\n```\n```\n\nAnother way to\
    \ eliminate the problem is to disentangle the typedef declaration from the structure\
    \ definition shown below:\n\n```\n```\nstruct node\n{\n\tint data;\n\tNODEPTR\
    \ link;\n};\n\ntypedef struct node *NODEPTR;\n```\n```\n\nYet another way to eliminate\
    \ the problem is to precede the structure declaration with a typedef, in which\
    \ case you should use the NODEPTR typedef when declaring the link field as shown\
    \ below:\n\n```\n```\ntypedef struct node *NODEPTR;\nstruct node\n{\n\tint data;\n\
    \tNODEPTR link;\n};\n```\n```"
