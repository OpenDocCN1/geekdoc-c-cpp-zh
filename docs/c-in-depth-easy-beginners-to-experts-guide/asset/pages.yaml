    # Debugging-


    Debugging is a methodical process of finding and reducing the number of bugs,
    or defects, (Errors) in a computer program, thus making it behave as expected.
    Finding and fixing bugs, or "debugging", has always been a major part of computer
    programming.


    Maurice Wilkes, an early computing pioneer, described his realization in the late
    1940s that much of the rest of his life would be spent finding mistakes in his
    own programs. As computer programs grow more complex, bugs become more common
    and difficult to fix.


    Often programmers spend more time and effort finding and fixing bugs than writing
    new code. Software testers are professionals whose primary task is to find bugs,
    or write code to support testing. On some projects, more resources can be spent
    on testing than in developing the program.


