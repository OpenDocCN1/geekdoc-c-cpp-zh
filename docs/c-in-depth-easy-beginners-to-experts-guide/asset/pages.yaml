  md: 'Array are stored in row order, thus the expression mat[0] represents the first
    row of 5 values, mat[1] represents second row, mat[2] represents third row, and
    so on.


    Similarly the expression mat[0][0] refers to the upper left value in the matrix,
    mat[2][3] represents the fourth value in third row.


