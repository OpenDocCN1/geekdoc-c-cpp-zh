  md: '# **Declaration of a variable as a constant:-**


    We may like that the value of certain variable must not change during the execution
    of the program. This can be done by declaring the variable with a keyword const
    at the time of initialization.


    ```

    const float PI = 3.14;

    ```


    This declaration tells the compiler that the value of the variable pi must not
    change during the execution of the program.


    # **Declaring a variable as volatile:-**


    ANSI standard defines another qualifier volatile that could be used to tell explicitly
    the compiler that a variable’s value may be changed at any time by some external
    sources (from outside the program).


    ```

    volatile int date;

    ```


    The value of data may be altered by some external factors even if it does not
    appear on the left hand side of an assignment statement.


    When we declare a variable as volatile, the compiler will examine the value of
    the variable each time it is encountered to see whether any external alteration
    has changed the value.


    # **Mind Drill Note-**


    Remember that the value of a variable declared as volatile can be modified by
    its own program as well.


    If we wish that the value must not be modified by the program while it may be
    altered by some other process, then we may declare the variable as both const
    and volatile as (volatile const int = 150;).


    # **Defining Symbolic Constants:-**


    We often use some constants in our program. These constants may appear in the
    program a number of times. For e.g. the value of pi should always be 3.14. Thus
    it'
