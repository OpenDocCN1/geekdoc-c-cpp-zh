    +   4. static int mat[4][3];


    Drill Note - int mat[ ][ ] is invalid because dimensions are not specified.


    Drill Note - int mat[ ][ ]={1,2,3,4,5,6} is invalid because it is not possible
    to decide the row & column of the matrix.


    Drill Note - int mat[ ][3]={1,2,3,4,5,6} is valid


    Drill Note - int mat[2][ ]={1,2,3,4,5,6} is invalid as column is compulsory in
    matrix declaration.


