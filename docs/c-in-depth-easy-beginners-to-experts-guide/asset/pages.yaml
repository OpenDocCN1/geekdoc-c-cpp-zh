- pgno: 398
  md: '(5) Event-Driven programming model


    (6) Dos model.


    # 1. Powerful API Functions.


    windows provide functions within itself which can be called by other user define
    or library functions.thease windows functions called API. Application Programming
    Functions. there are literally hundreds of very rich functions available.


    They help an application perform not only the simple task like creating window,
    drawing a line, performing file i/o but also complicated tasks like connecting
    to ports, interfacing to the networks, modifying the bitmap, playing a mp3 file.
    etc.the key to windows-programming is to udrst d these API functions and use them
    effectively to create rich applications with effortless ease.


    # 2. Sharing of functions.


    During the Execution windows program calls several API functions. Imagine how
    much disk space would have been watage had each of these functions became part
    of the .Exe file of the each program. to avoid this, the API, Functions are defined
    in special files that have a special extension .DLL,the .DLL stand for Dynamic
    Link Liberary.


    Thaese are binary files.the functions presented in .dll files can be linked during
    the Execution or installing time.these all functions can share for calling each
    other when several programs running under windows.


    These functions linking with each other is done dynamically.(during execution)
    the functions do not became part of the executable file.as a result the size of
    the Exe files doesn’t go out of the hand. it is also possible to create your own
    DLLs. because of the two reasons u need to do this.


    +   (a) sharing common code between different executable files.

    +   (b) Breaking the Applications in to components parts known as segments.


    *Provide the way to easily upgrade Application''s Components.*


    # 3.Look and feel Consistent:


    This means that each program offers a consistent and semi liar user interface.'
  merge: -1
  img_proc: true
