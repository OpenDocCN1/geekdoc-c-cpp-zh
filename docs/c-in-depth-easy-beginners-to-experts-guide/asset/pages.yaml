  md: '+   - Writing data to a file.

    +   - Closing a file.


    # Let us see some of the functions of file


    | Function name | Operation |

    |---|---|

    | fopen() | Creates a new file

    Or opens an existing file for use. |

    | fclose() | Closes a file. |

    | fgetc() | Reads a character from file. |

    | fputc() | Writes a character from file. |

    | fprintf() | Writes a data from file. |

    | fscanf() | Reads a data from file. |

    | fgetw() | Reads an integer . |

    | fputw() | Writes an integer. |

    | fseek() | Sets a position to a desired points in the file. |

    | ftell() | Gives the current position in the file(i.e number of bytes from the
    beginning). |

    | rewind() | Sets the position to the beginning of the file. |

    | fwrite() | Writes data to a file. |

    | fread() | Reads data from a file. |

    | feof() | Tests if end-of-file has been reached. |

    | fflush() | Flushes a stream. |

    | Remove() | Deletes the specified file. |

    | Rename() | Changes the name or path of file. |

    | ferror() | Tests if an error has occurred in the file. |


    # Opening a file-


    Before we can read or write information from or to a file on the hard disk we
    must open the file.


    To open the file function fopen( ) is used and a mode which tells the compiler
    that we would write, read or modify the file. This fopen( ) function performs
    three tasks:


    +   - Searches the file on the disk.'
  merge: -1
  img_proc: true
- pgno: 256
  md: '+   - Then it loads the file from the disk into the place in memory called
    buffer.

    +   - It sets a character pointer which will point the first character in the
    buffer.


    # Need of buffer:


    The buffer is the temporary area in the memory of the computer where a file is
    kept for sometime so that it can be accessed quickly to read or write characters.
    It would be rather inefficient to every time go to the hard disk and read a character
    print it on the screen, then again go to the hard disk again to access next character.


    Here the buffer comes to use, whenever we open a file the contents of the file
    get copied to this temporary area and then read character by character from the
    buffer rather than from the disk and similarly to write characters of the file
    one at a time on the disk would also be a wastage of time so buffer is used to
    write the characters and then they are transferred to the disk.


    The fopen() gathers information like file name, size of file and the mode to open
    the file then returns the address of this file to a file pointer called fp. This
    can be explained as:


    ```

    FILE *fp;

    fp=fopen("file_name","mode");

    ```


    here FILE is a constant defined in the header file stdio.h so it is compulsory
    to use #include<stdio.h>


    # Reading a file:


    The function fgetc( ) is used to read the contents of the file which has been
    brought to the buffer(partly or wholly) from the hard disk. fgetc( ) is used as:


    ```

    ch= fgetc(fp);

    ```


    fgetc( ) is used to read the character from the current position of the pointer.
    The pointer now moves one place ahead so that it points the next character. The
    character which was read by the fgetc( ) is assigned to variable ch.


    We use this fgetc( )within an infinite while loop, but then the loop has to break
    at the end of the file. This is done using a special character which is placed
    at the end of a file. The ASCII of this character is 26. This character is not
    returned but a marco is returned called EOF. This EOF is also defined in the stdio.h.
    The fgetc( ) can also be replaced with getc( ).'
