- pgno: 81
  md: '+   2. **Conditions**

    +   3. **Statements**

    +   4. **Incrementation or Decrementation.**


    ***Don’t forget,***Looping is a process of repeating a single statement or a group
    of statements until some condition for termination of the loop is satisfied.


    # **Type of loops -**


    ***Entry control loops:*** Those loops in which condition is checked before the
    execution of the statement. Thus if the condition is false in the beginning the
    loop will not run even once.


    **e.g.** for loop, while loop.


    ***Exit control loops:*** Those loops in which the condition is checked after
    the execution of the statement. Thus if the condition is false in the beginning
    the loop will run at least once.


    **e.g.** do while loop


    # **while loop –**


    C has three loops, `while` is the simplest of them all. It is given a condition
    (in parentheses, just like with the `if` statement) which it evaluates. If the
    condition evaluates to true (non zero, as seen before) the body of the loop is
    executed. The condition is evaluated again, if still true, the body of the loop
    is executed again. This continues until the condition finally evaluates to false.
    Then execution jumps to the first statement that follows on after the loop


    while loop is constructed of a condition and a single command or a block of commands
    that must run in a loop. As we have told earlier a block of commands is a series
    of commands enclosed in two opening and closing braces.


    In the while loop, the condition is evaluated and if it is true the statement
    of the loop is executed. After the execution of statement and increment or decrement,
    the loop condition is tested again. This process of repeated execution of statement,
    increment or decrement and testing of condition continuous till the condition
    finally becomes false and the control of the loop is transferred to the next statement.


    Once again if more than one statement is required in the body of the loop, begin
    and end braces must be used.'
