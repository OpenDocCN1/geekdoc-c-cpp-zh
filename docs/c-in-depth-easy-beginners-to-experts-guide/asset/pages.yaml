- pgno: 19
  md: '# # Explanation: Compiler Vs Interpreter


    Just understand the concept of the compiler and interpreter -


    +   1. We give complete program as input to the compiler. Our program is in the
    human readable format.

    +   2. Human readable format undergoes many passes and phases of compiler and
    finally it is converted into the machine readable format.

    +   3. However interpreter takes single line of code as input at a time and executes
    that line. It will terminate the execution of the code as soon as it finds the
    error.

    +   4. Memory requirement is less in Case of interpreter because no object code
    is created in case of interpreter.




    A Compiler and Interpreter both carry out the same purpose – convert a high level
    language (like C, Java) instructions into the binary form which is understandable
    by computer hardware.


    They are the software used to execute the high level programs and codes to perform
    various tasks. Specific compilers/interpreters are designed for different high
    level languages.


    However both compiler and interpreter have the same objective but they differ
    in the way they accomplish their task i.e. convert high level language into machine
    language. Look seriously below-




    A compiler is a piece of code that translates the high level language into machine
    language. When a user writes a code in a high level language such as Java and
    wants it to execute, a specific compiler which is designed for Java is used before
    it will be executed. The compiler scans the entire program first and then translates
    it into machine code which will be executed by the computer processor and the
    corresponding tasks will be performed.'
  merge: -1
  img_proc: true
