  md: '# 2. Writing code in an unstructured manner.


    Let''s take these in order


    # 1.1 Thinking about Programming.-


    When a real programmer (or programming team) is given a problem to solve, they
    do not immediately sit down at a terminal and start typing in code! They first
    design the program by thinking about the numerous ways the problem''s solution
    may be found.


    One of the biggest myths of programming is that: The sooner I start coding the
    sooner a working program will be produced. This is NOT true!! A program that is
    planned before coding will become a working program before an unplanned program.


    Yes, an unplanned program will be typed in and maybe compiled faster, but these
    are just the first steps of creating a working program! Next comes the debugging
    stage.


    This is where the benefits of a planned program will appear. In the vast majority
    of the time, a planned program will have fewer bugs than an unplanned program.
    In addition, planned programs are generally more structured than unplanned programs.
    Thus, finding the bugs will be easier in the planned program.


    So how does one design a program before coding? There are several different techniques.
    One of the most common is called top-down design. Here an outline of the program
    is first created. (Essentially, one first looks at the general form of the main()
    function and then recursively works down to the lowest level functions.) There
    are many references on how to write programs in this manner.


    Top-down design divides the program into sub-tasks. Each sub-task is a smaller
    problem that must be solved. Problems are solved by using an algorithm.


    Functions (and data) in the program implement the algorithm. Before writing the
    actual code, take a very small problem and trace by hand how the chosen algorithm
    would solve it.


    This serves several purposes:


    +   1. It checks out the algorithm to see if will actually work on the given problem.
    (If it does not work, you can immediately start looking for another algorithm.
    Note that if you had immediately starting coding you would probably not discover
    the algorithm would not work until many lines'
  merge: -1
  img_proc: true
- pgno: 407
  md: 'of code had been entered!)


    +   2. Makes sure that you understand how the algorithm actually works! (If you
    cannot trace the algorithm by hand, you will not be able to write a program to
    do it!)


    +   3. Gives you the detail workings of a short, simple run of the algorithm that
    can be used later when debugging the code.


    Only when you are confident that you understand how the entire program will look
    in code.


    # 1.2 Structured Programming.-


    When a program is structured, it is divided into sub-units that may be tested
    separately. This is a great advantage when debugging! Code in a sub-unit may be
    debugged separately from the rest of the program code. I find it useful to debug
    each sub-unit as it is written. If no debugging is performed until the entire
    program is written, debugging is much harder.


    The entire source of the program must be searched for bugs. If sub-units are debugged
    separately, the source code that must be searched for bugs is much smaller! Storing
    the sub-units of a program into separate source files can make it easier to debug
    them separately.


    The ADT and OOP paradigms also divide programs into sub-units. Often with these
    methods, the sub-units are even more independent than with normal structured code.
    This has two main advantages:


    +   1. Sub-units are even easier to debug separately.


    +   2. Sub-units can often be reused in other programs. (Thus, a new program can
    use a previously debugged sub-unit from an earlier program)


    Sub-units are generally debugged separately by writing a small driver program.
    Driver programs set up data for the sub-task that the sub-unit is supposed to
    solve, calls the sub-unit to perform his sub-task, and then displays the results
    so that they can be checked.


    Of course, all the following debugging methods can be used to debug a sub-unit,
    just as they can be used to debug the entire program. Again, the advantages of
    sub-units are that they are only part of the program and so are easier to debug
    than the entire program at once!


    # 2. Compiling Programs-'
