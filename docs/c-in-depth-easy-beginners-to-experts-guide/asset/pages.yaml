  md: 'definitions in other object files. The linker uses the name (often the term
    symbol is used) of the function or global variable to perform the match.


    The most common type of linker error is an unresolved symbol or name. This error
    occurs when a function or global variable is used, but the linker cannot find
    a match for the name. For example, on an IBM AIX system, the error message looks
    like this: 0706-317 ERROR: Unresolved or undefined symbols detected:


    Symbols in error (followed by references) are dumped to the load map. The -bloadmap:<filename>
    option will create a load map..fun


    This message means that a function (or global variable) named fun (ignore the
    period) was referenced in the program, but never defined. There are two common
    causes of these errors:


    # Misspelling the name of the function-


    In the example, above there was a function named func. This is not a compiler
    error. Code in one source file can use functions defined in another. The compiler
    assumes that any function referenced, but not defined in the file that references
    it, will be defined in another file and linked.


    It is only at the link stage that this assumption can be checked. (Note that C++
    compilers will usually generate compiler errors for this, since C++ requires prototypes
    for all referenced functions!)


    # The correct libraries or object files where not linked


    The linker must know what libraries and object files are needed to form the executable
    program. The standard C libraries are automatically linked. UNIX systems, like
    the AIX system, do not automatically link in the standard C math library! To link
    in the math library on the AIX system, use the -lm flag on the compile command.
    For example, to compile a C program that uses sqrt, type: cc prog.c -lm Remember
    that the #include statement only inserts text into source files. It is a common
    myth that it also links in the appropriate library! The linker never sees this
    statement! There are also bugs related to the linker. One difficult bug to uncover
    occurs when there are two definitions of a function or global variable. The linker
    will pick the first definition it finds and ignores the other. Some linkers will
    display a warning message when this occurs (The AIX linker does not!)'
