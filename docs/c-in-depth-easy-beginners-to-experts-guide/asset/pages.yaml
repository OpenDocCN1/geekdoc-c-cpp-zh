  md: "# (i) Call by value -\n\nWhen arguments are passed by value then the copy of\
    \ the actual parameters is transferred from calling function to the called function\
    \ definition in formal parameters.\n\nNow any changes made in the formal parameters\
    \ in called function definition will not be reflected in actual parameters of\
    \ calling function. Like in the above function to calculate the sum of two numbers\
    \ the calling statement was written as:\n\n```\nans = sum(a, b);\n```\n\nHere\
    \ the values of variables a, b are passed from the main function to the calling\
    \ function's definition.\n\nIn the definition variables x, y accept the values\
    \ of a, b respectively. Here, the variables a, b are called the actual arguments\
    \ while x, y will be called the formal arguments.\n\nThe scope of the actual and\
    \ formal arguments is different so any change made in the formal arguments will\
    \ not be seen in the actual arguments.\n\ne.g:\n\n```\nvoid swap(int, int);\n\
    main()\n{\n    int a,b;\n    printf(\"Enter 2 numbers\");\n    scanf(\"%o%d%o\"\
    ,&a,&b);\n    swap(a,b);      /*In this call statement a,b are the actual parameters*/\n\
    \n    printf(\"%o%d\\t%o%d\"a,b);\n}\nvoid swap(int x,int y)  /*In this function\
    \ definition x & y are the formal parameters */\n{\n    int t;\n    t=x; x=y;\
    \ y=t;\n```"
  merge: -1
  img_proc: true
