  md: "cnt++;\n\nThe return value of fgetc(fp) is cast to char to store the result\
    \ into ch. Then the value of ch must be cast back to an int to compare it with\
    \ EOF. So what?\n\nCasting an int value to a char and then back to an int may\
    \ not give back the original int value. This means in the example above that if\
    \ fgetc() returns back the EOF value, the casting may change the value so that\
    \ the comparison later with EOF would be false.\n\nWhat is the solution? Make\
    \ the ch variable an int as below:\n\n```\nint count_line_size( FILE * fp )\n\
    {\n    int ch;\n    int cnt = 0;\n    while( (ch = fgetc(fp)) != EOF && ch !=\
    \ '\\n')\n        cnt++;\n    return cnt;\n}\n```\n\nNow the only hidden cast\
    \ is in the second comparison.\n\n```\nwhile( (ch = fgetc(fp)) != EOF && ch !=\
    \ (int) '\\n' )\n    cnt++;\n```\n\nThis cast has no harmful effects at all! So,\
    \ the moral of all this is: always use an int variable to store the result of\
    \ the fgetc(), getc() and getchar().\n\n# 4.2 Using feof() incorrectly-\n\nThere\
