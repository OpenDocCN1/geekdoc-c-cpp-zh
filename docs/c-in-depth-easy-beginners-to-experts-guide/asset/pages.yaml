  md: '# The Format of C -


    +   - Statements are terminated with semicolons.

    +   - Indentation is ignored by the compiler.

    +   - C is case sensitive - all keywords and Standard.

    +   - Library functions are lowercase.

    +   - Strings are placed in double quotes.

    +   - Newlines are handled via \n

    +   - Programs are capable of flagging success or error, those forgetting to do
    so have one or other chosen randomly!


    # The Format of C -


    # Semicolons –


    Semicolons are very important in C. They form a statement terminator they tell
    the compiler where one statement ends and the next one begins. If you fail to
    place one after each statement, you will get compilation errors.


    # Free Format -


    C is a free format language. This is the up-side of having to use semicolons everywhere.
    There is no problem breaking a statement over two lines - all you need do is not
    place a semicolon in the middle of it (where you wouldn’t have anyway).


    The spaces and tabs that were so carefully placed in the example program are ignored
    by the compiler. Indentation is entirely optional, but should be used to make
    the program more readable.


    # Case Sensitivity -


    C is a case sensitive language. Although int compiles, “Int”, “INT” or any other
    variation will not. All of the 40 or so C keywords are lowercase. All of the several
    hundred functions in the Standard Library are lowercase.


    # Random Behavior –


    Having stated that main is to return an integer to the operating system, forgetting
    to do so (either by saying return only or by omitting the return entirely) would
    cause a random integer to be returned to the operating system.'
