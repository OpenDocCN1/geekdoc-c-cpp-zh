  md: "Suppose we want to calculate the factorial of an integer. As we know, the factorial\
    \ of a number is the product of all the integers between 1 and that number. Factorial\
    \ of 4 can be expressed as 4! = 4 * 3! Where ! stands for factorial. Thus the\
    \ factorial of a number can be expressed in the form of itself. Hence this can\
    \ be programmed using recursion.\n\ne.g.:\n\n```\n```c\nint fact(int);       \
    \         /*function definition */\nmain()\n{\nint n,ans;\nprintf(\"Enter a number:\
    \ \");\nscanf(\"%d\",&n);\nans = fact(n);                 /*function call */\n\
    printf(\"factorial = %d\",ans);\ngetch();\n}\nint fact(int n)\n{\n    if(n==0)\
    \                    /*terminating condition*/\n    return (1);\n    return (n*fact(n-1));\
    \       /*recursive statement*/\n}\n```\n```\n\n# Now let us evaluate this program:\n\
    \nAssuming the value of n is 3 when the control of the program is passed from\
    \ the main() function the function fact. Since n is not equal to 0 so the condition\
    \ is false and the recursive statement is executed.\n\n3*fact(2)\n\nnow fact(2)\
    \ is the calling function and thus the control of the program again reaches the\
    \ beginning of the definition. Still the terminating condition is false so the\
    \ recursive statement is executed.\n\n2*fact(1)\nAgain fact(1) is the calling\
    \ function and thus the control of the program again reaches the beginning of\
    \ the definition. Still the terminating condition is false so the"
  merge: -1
  img_proc: true
- pgno: 167
  md: "recursive statement is executed.\n\n```\n1 * fact(0)\n```\n\nNow the condition\
    \ is true so the answer to the calling function(fact(0)) will be 1 and so on.\
    \ Thus the sequence of acts will be:\n\n```\nfact(3)=3 * fact(2)\nfact(2)=2 *\
    \ fact(1)\nfact(1)=1 * fact(0)\n```\n\nWhen we use a recursive program a stack\
    \ is used to organize the data. Stack is a Last In First Out (LIFO) data structure.\
    \ This means that the last item to be stored (push operation) in the stack will\
    \ be the first one to come (pop operation) out.\n\nIn the above program when the\
    \ fact(2) is called the value 3 will be stored in the stack. Similarly when fact(1)\
    \ is called the value 2 will be stored at the top of 3 on the stack.\n\nNow when\
    \ the fact(0) returns 1. it will be multiplied to the first value in the stack\
    \ i.e.\n\n+   1. This result will be multiplied to the second waiting value of\
    \ the stack i.e. 2 and so on.\n\nWhen a function in its definition calls another\
    \ function it is called chaining. Recursion is a special type of chaining where\
    \ a function calls itself.\n\ne.g.:\n\n```\nmain()\n{\n    printf(\"Harry\\n\"\
    );\n    main();\n}\n```\n\nwhen executed the program will give the output as :\n\
    Harry\nHarry\nHarry"
