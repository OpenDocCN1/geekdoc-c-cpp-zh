  md: '# # CHAPTER ∞ 7 ∞


    (String (Character array))




    A string is an array of characters. Any group of characters (except double quotes)
    enclosed between double quotes is called a string constant.


    A string is a one-dimensional array of characters terminated by null ( 0 ).


    ```

    ```

    char s[10] = {''s'',''h'',''i'',''v'',''a'',''m'',''\0'',''p'',''o'',''h''};

    ```

    ```


    ![](img/3a2b6e5e90a58a56458b0539952c0cd2_143_0.png)


    Each character in the array occupies one byte of memory and the last character
    is always a ''0''. This ''0'' is called a null. It defines the end of the string.
    Because of the presence of this character the various functions working on the
    string are able to know the end of the string.


    Thus it can be said that the input given to the string gets terminated at null''0''.
    And the remaining array contains garbage values.


    Drill Note: the null ''0'' looks as if two characters are typed but the compiler
    treats it as a single character. It is an escape sequence.'
