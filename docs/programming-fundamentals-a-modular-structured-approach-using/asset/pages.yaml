  md: '# 11.3 Relational Operators


    # 11.3.1 Overview of the Relational Operators


    The relational operators are often used to create a test expression that controls
    program flow. This type of expression is also known as a Boolean expression because
    they create a Boolean answer or value when evaluated. There are six common relational
    operators that give a Boolean value by comparing (showing the relationship) between
    two operands. If the operands are of different types, implicit promotion occurs
    to convert the operands to the same data type.


    > Definition 11.5: relational operator

    Operator that gives a Boolean value by evaluating the relationship between two
    operands.


    Operator symbols and/or names vary with different programming languages. The C++
    programming language operators with their meanings are:


    | C++ Operator | Meaning |

    |---|---|

    | < | less than |

    | > | greater than |

    | <= | less than or equal to |

    | >= | greater than or equal to |

    | == | equality (to) |

    | != | inequality (not equal to) |


    Table 11.2


