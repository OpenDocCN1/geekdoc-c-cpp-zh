    As you start the Practice module you will wisely encounter:


    +   - Learning Objectives

    - Memory Building Activities aka MBAs Link – These could consist of any of the
    following types of interactive activities: flash card, crossword puzzle, seek
    a word, drag n drop, ordering or sorting. When the materials are used as a textbook
    for a course, it is imperative that students do a variety of repetitive activities
    in order to memorize basic course material. Besides, have fun learning.

    - Exercises – In addition to any exercises within the study modules you completed
    before the practice module, there will be at least one exercise for students to
    complete.

    - Miscellaneous Items – This will exist for some of the chapters.

    - Lab Assignment – Usually, completed on one''s own efforts. Review the instructions/restrictions
    from your professor/teacher if you attend a high school or college course

    - Problems – The intent of this activity is for students to formulate their answers.
    Thus, solutions will not be provided. When the materials are used as a textbook
    for a course, the professor/teacher may assign students to a Study Group to discuss
    their solutions with each other. If you are using for a high school or college
    course, verify that you may work as solving the problems. This type of approved
    activity is called "authorized collision" and is not a violation of Academic or
    Scholastic Dishonesty" rules.


    A professor using this textbook/course will most likely have additional lab assignments,
    quizzes and exams that would be used in calculating your grade.


    # # Connexions Module Reading List


    The modules in this textbook have had content reviewed and are believed to be
    sufficient, **no additional textbook is required**. However, some students desire
    additional references or reading. The author has used several textbooks over the
    years for teaching "CC1436 – Programming Fundamentals I" course of Houston College.
    A reading reference list has been prepared and includes for the following:


    +   1. Starting Out with C++ Early Objects, by Tony Gaddis et al., 6th Edition,
    ISBN: 0-321-5238-3

    2. Starting Out with C++ Early Objects, by Tony Gaddis et al., 5th Edition, ISBN:
    0-321-38348-6

    3. Computer Science – A Structured Approach using C++, by Behrou Forouzan et al.,
    2nd Edition, ISBN: 0-534-37480-8


    These textbooks are typically available in the used textbook market at a reasonable
    price. You may use any one of the three books. If you acquire one of the **optional**
    traditional textbooks, you may want to download and store the file to your storage
    device (disk drive or flash drive) in an appropriate folder.


    Download from Connexions: Connexions_Module_Reading_List_col10621.pdf


