  md: "# 10.1.1.1 Introduction to Selection Control Structures\n\nThe basic attribute\
    \ of a selection control structure is to be able to select between two or more\
    \ alternate paths. This is designed as either two-way selection or stairway selection.\
    \ A question using Boolean concepts usually controls which path is selected. All\
    \ of the paths from a selection control structure join back at the end of the\
    \ control structure, moving on to the next lines of code in a program.\n\nWe have\
    \ mentioned that the if then else control structure belongs to the selection category\
    \ and is a two-way selection.\n\nExample 10.1: if then else control structure\n\
    \n```\nif (age > 17)\n{\n    out << \"You can vote.\";\n}\nelelse{\n    cout <<\
    \ \"You can't vote.\";\n}\n```\n\n# 10.1.1.2 Introduction to Iteration Control\
    \ Structures\n\nThe basic attribute of an iteration control structure is to be\
    \ repeat some lines of code. The visual display of iteration creates a circular\
    \ loop pattern when flowcharted, thus the word \"loop\" is associated with iteration\
    \ control structures. Iteration can be accomplished with test before loops, counting\
    \ loops, and test after loops. A question using Boolean concepts usually controls\
    \ how long the loop will execute.\n\nWe have mentioned that the while control\
    \ structure belongs to the iteration category and is a test before loop.\n\nExample\
    \ 10.2: while control structure\n\n```\ncounter = 0;\nwhile (counter < 5)\n{\n\
    \    cout << \"\\nI love computers!\";\n    counter++;\n}\n```\n\n# 10.1.2 Definitions\n\
    \n**Definition 10.1:** control structures\nMechanisms that allow us to control\
    \ the flow of execution within a program.\n\n**Definition 10.2:** sequence\nA\
    \ control structure where you do the items in the sequence listed."
  merge: -1
