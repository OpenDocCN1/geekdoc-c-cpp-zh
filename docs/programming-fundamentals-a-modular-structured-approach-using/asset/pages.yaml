  md: '# Example 17.3: conditional = option 2


    ```

    cout << (age > 17 ? "You can vote." : "You can''t vote.");

    ```


    NOTE: The use of parentheses is needed because of the precedence of operators.
    The conditional expression is of lower precedence than the insertion (writing)
    operator.


    The first operand is a test expression similar to those that control program flow
    in control structures. This type of expression is also known as a Boolean expression
    because they create a Boolean answer of true or false. If the test is true the
    second operand becomes the value of the expression. If false, the third operand
    becomes the value of the expression. The operators of the question mark and colon
    separate the operands.


    # Example 17.4: general format


    ```

    test expression ? expression true : expression false

    ```


