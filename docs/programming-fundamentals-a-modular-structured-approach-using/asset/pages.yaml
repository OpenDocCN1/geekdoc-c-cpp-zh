    expression. The Boolean data type has two values – true and false. Let''s rewrite
    the structure to consider this:


    +   - some statements or action

    - some statements or action

    - some statements or action

    - update the flag

    - while expression is true


    Within the do while control structure are three attributes of a properly working
    loop. They are:


