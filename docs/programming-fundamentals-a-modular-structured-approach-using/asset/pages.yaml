    | C++ Reserved Word | Size |

    | float | 4 bytes |

    | double | 8 bytes |

    | long double | 10 to 12 bytes (varies by machine) |


    Table 4.4


    The domain of each of the above data type options varies with the compiler being
    used and the computer. The domains vary because the size allocated to the data
    varies with the compiler and computer. This effect is known as being machine dependent.


    These variations of the floating-point family of data types are an annoyance in
    C++ for a beginning programmer. For a beginning programmer it is more important
    to understand the general attributes of the floating-point family that apply to
    many programming languages.


    # 4.2.2 Definitions


    Definition 4.2: double

    The most often used floating-point family data type used in C++.


    Definition 4.3: precision

    The effect on the domain of floating-point values gives a larger or smaller storage
    area in bytes.


    Definition 4.4: mantissa exponent

    The two integer parts of a floating-point value.


