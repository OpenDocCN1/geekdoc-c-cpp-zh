  md: '# Chapter 8


    # 8. Standard Libraries


    # 8.1 Standard Libraries''


    Many common or standard functions, whose definitions have been written, are ready
    to be used in any program. They are organized into a group of functions (think
    of them as several books) and are collectively called a Standard Library There
    are many functions organized into several libraries. For example, within C++ many
    math functions exist and have been coded (and placed into libraries). These functions
    were written by programmers and tested to insure that they work properly. In most
    cases the functions were reviewed by several people to double and triple check
    to insure they did what was expected. We have the advantage of using these functions
    with confidence that they will work properly in our programs, thus saving time
    and money.


    A main program must establish the existence of functions used in that program.
    Depending on the programming language, there is a formal way to:


    +   1. define a function

    2. declare a function (a prototype is a declaration to a compiler)

    3. call a function


    When we create functions in our program, we usually see them in the following
    order in our source code listing:


    +   1. declare the function (prototype)

    2. call the function

    3. define the function


