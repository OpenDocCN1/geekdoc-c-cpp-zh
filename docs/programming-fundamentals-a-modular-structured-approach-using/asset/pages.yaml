  md: '# CHAPTER 19. 19. I/O AND ARRAY FUNCTIONS


    This variable will be used to store the token that the operating system assigns
    to the file being opened. Opening a file uses a class member function you can
    call like:

    inData.open("C:\myfiles\cosc_1436\Lab_05.txt", ios::in);


    The two parameters passed to the function are the filespec and the method you
    want to use the file (in this example out). The function returns a returning value
    of a device token from the operating system and is stored in the variable named
    inData.


    It is considered good programming to determine if the file was opened properly.
    The device token is a non-zero value; the system gives you the value of zero if
    it was not able to open the file. The reason is usually the file is wrong (misspelled
    or not typed case in some operating systems) or the file is not stored in the
    location specified. We test the device token by using an then control structure
    with the action of stopping the program if it is true that you got the zero. The
    first line of the then structure looks like this:


    ```

    if (!inData)

    ```


    Don''t be misled by the operator. This reads "if it is true that the token stored
    in inData is zero". If inData is zero, noting inData is 1 or true.


    Read - Moving data from a device that has been opened into a memory location in
    your program. When reading data that integer or floating-point characters, the
    operating system converts the symbols to binary number. The operation used is
    extraction or read. An example of reading is:


    ```

    inData >> next_number

    cin >> next_number

    ```


    This expression is similar to reading from the standard input device (the keyboard):


    The "cin" is a predefined device associated with the Standard Input and Output
    devices. For our file example you may write, "Go to the device by the token stored
    in the inData variable and read in the value storing it in the next_number variable
    within your program",


    Write - Moving data from a memory location to a device that has been opened. When
    writing integer or floating-point types, the operating system converts the binary
    number into the text symbols. An example of writing is:


    ```

    outData << "Total is: " << inData << endl;

    ```


    This expression is similar to writing to the standard output device (the monitor):


    The "cout" is a predefined device token with the Standard Input and Output devices.
    For our file example you may write, "Go to the device by the token stored in the
    outData variable and write the items (the string constant then the value stored
    in my program variable named total then the endl or return the character #)"


    Close - Your program requesting the operating system to release a file that was
    previously opened. There are two reasons to close: First, it releases the file
    and frees up the operating system resources. Second, if closing a file that was
    for output; it will clear the operating system''s buffer and ensure that all of
    the data is properly stored in the file. Some examples of closing files:


    ```

    inData.close();

    outData.close();

    ```


