  md: '# CHAPTER 2. PROGRAM PLANNING & DESIGN


    There are several methods or tools for planning the logic of a program. They include:
    flowcharting, hierarchy or structure charts, pseudocode, HIPO, Nassi-Schneiderman
    charts, Warnier-Orr diagrams, etc. Programmers are expected to be able to understand
    and do flowchart and pseudocode. These methods of developing the model of a program
    are usually taught in most computer courses. Various standards for flowcharting
    and pseudocode are most similar to each other. However, most companies have their
    own documentation standards and styles. Programmers are expected to be able to
    quickly adapt to flowcharting or pseudocode standards for the company where they
    work. The other methods that require some time are usually produced by an employer
    that chooses to use. Later in your programming career, you will learn about using
    applications software that helps to create an information system/or programs.
    This type of software is called Computer-aided Software Engineering. Understanding
    the logic and planning the algorithm before you start to code is very important
    concept. Many students develop poor habits and skipping this is one of them.


    # 2.1.4 Develop Test Data


    Test data consists of the user providing some input values and predicting the
    outputs. This can be true for a simple program and the test data can be used to
    check the model if it produces the correct results.


    # 2.1.5 Definitions


    +   Definition 2.1: IPO

    Inputs - Processing - Outputs


    +   Definition 2.2: pseudocode

    English-like statements used to convey the steps of an algorithm or function.


    +   Definition 2.3: test data

    Providing input values and predicting the outputs.


    # 2.2 Pseudocode


    # 2.2.1 Overview


    Pseudocode is one method of designing or planning a program. Pseudo means false,
    thus pseudocode means false code. A better translation would be the word fake
    or imitation. Pseudocode is fake (not the real thing). It looks like (imitates)
    real code. It uses English statements to describe what a program is to accomplish.
    It is false because no compiler exists that will translate the pseudocode to any
    machine language. Pseudocode is used for documenting the program or module design
    (also known as the algorithm).


    The following outline of a simple program illustrates pseudocode. We want to be
    able to enter the ages of two people and have the computer calculate their average
    age and display the answer.


    Example 2.1: Outline using Pseudocode


    ```

    Input

    display a message asking the user to enter the first age

    get first age from the keyboard

    display a message asking the user to enter the second age

    get the second age from the keyboard

    ```


    > This content is available online at <http://cnx.org/content/m18648/1.10/>.'
