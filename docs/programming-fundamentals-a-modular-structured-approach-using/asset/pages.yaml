  md: "Within the for control structure there are four attributes to a properly working\
    \ loop. They are:\n\n+   * Initializing the flag – done once\n* Text expression\n\
    * Action or actions\n* Update of the flag\n\nThe initialization of the flag is\
    \ not technically part of the while control structure, but it is usually part\
    \ of the control structure. The English phrasing is, \"For x is 1; x less than\
    \ 3; do the following actions; increment x; loop back to the test expression\"\
    . This is doing the action on the true. When the expression is false, you stop\
    \ the loop and go on the next item in the program. Notice, because this is a test\
    \ before the action might not happen. It is called a test before loop because\
    \ the test comes before the action. It is also called a pre-test loop, meaning\
    \ the test is (or Latin for before) the action and update.\n\n# ## 15.1.2 The\
    \ Structure within C++\n\n# ### 15.1.2.1 Syntax\n\nThe syntax for the while control\
    \ structure within the C++ programming language is:\n\n```\nfor (initializations;\
    \ expression; updates)\n{\n  statement;\n  statement;\n  statement;\n}\n```\n\n\
    > NOTE: The initializations, test expression and updates are within the parentheses\
    \ (each separated by a semi-colon), but this is not a function call. The parentheses\
    \ are part of the control structure. Additionally, there is not a semicolon after\
    \ the parenthesis following the expression.\n\n# ## 15.1.2.2 An Example\n\nExample\
    \ 15.1: C++ source code for:\n\n```\nfor (counter = 0; counter < 5; counter++)\n\
    {\n  cout << \"\\nI love ice cream\";\n}\n```\n\nThe four attributes of a test\
    \ before loop are present. The initialization of the flag. The test is less than\
    \ relational comparison of the value in the flag variable to the constant value\
    \ of 5. The action part consists of the 1 line of output. The update of the flag\
    \ is done with the increment operator.\nUsing indentation with the alignment of\
    \ the loop actions is normal industry within the C++ community."
