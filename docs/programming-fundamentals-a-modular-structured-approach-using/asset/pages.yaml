    # Bloodshed Dev-C++ 5 Compiler/IDE


    This open source compiler/IDE (Integrated Development Environment) was used to
    develop the demonstration source code files provided within the modules of this
    textbook/collection. The compiler,IDE is presented to the student in the second
    module of Chapter 1, with instructions for downloading, installing and using the
    compiler/IDE. A more complete explanation of the IDE with demonstration source
    code listings is presented in first module of Chapter 5. All of the source code
    files provided in this textbook/collection contain only ANSI C++ code and should
    work on any standard C++ compiler like Microsoft Visual Studio (which includes
    C++), Microsoft Visual C++ Express or Borland C++ Builder.


