    # 2.3.2 Creating Test Data and Model Checking


    Test data is used to verify the inputs, processing and outputs are working correctly.
    As test is initially developed it can verify that the developed algorithm (pseudocode
    in the example we are doing) is correct. It helps us understand and visualize
    the inputs, processing and outputs of the program.

    Input: My building is 100 feet by 40 wide and 10 feet in height I selected paint
    cost $28.49 per gallon that will cover 250 square feet per gallon. We should verify
    that the pseudocode is prompting the user for this data.


    Processing: Using solar power hand calculator, I can calculate (or predict) the
    total area would be: (100 x 10 x 2 + 40 x 10) = 2800 sq ft. The total gallons
    of paint would be: (2800 / 250) or 11.2 gallons. Rounded up, I would need 12 (gallons
    of paint). The total cost would be: (28.49 times) or 341.88. We should verify
    that the pseudocode is performing the correct calculations.

    Output: Only the significant information (number of gallons to buy and the total
    cost) are displayed for the user to see. We should verify that the appropriate
    information is displayed.


    # 2.3.3 Testing the Coded Program – Code Checking


    The test data is developed and used to test the algorithm that is documented (in
    our pseudocode) during the program design phase. Once the program is coded with
    compiler and linker errors removed, the programmers get to show the test data
    developed. When you run your program, how will you know it is working properly?
    Did you properly plan your logic to accomplish your purpose? If your plan was
    correct, did it get converted (code) into the chosen program language (in our
    case C#?) The answer (or solution) to all of these questions is our test data.


    By developing test data we are predicting what the results should be, thus we
    can verify that our program is working properly. When we run the program we enter
    the input values used in our test data. If not our problem could be any of the
    following:


    +   1. The plan (IPO or other item) could be wrong

    2. The conversion of the plan to code might be wrong

    3. The test data results were calculated


    Resolving problems of this nature is the most difficult problems a programmer
    encounters. You must review each of the above to determine where the error is
    lies. Fix and re-test your program.'
