  md: "254\n\nCHAPTER 22. 22. POINTERS\n\n# Definition 22.2: pointer\n\nA variable\
    \ that holds an address as its value.\n\n# 22.2 Parameter Passing by Reference³\n\
    \n# 22.2.1 Overview\n\nWhen we need parameters to functions we usually pass by\
    \ value; that the calling function provides several values to the called function\
    \ as needed. The called function takes these values which have local scope and\
    \ store them on the stack using as needed for whatever processing accomplishes.\
    \ The preferred method is when calling user defined specific tasks. The calling\
    \ function passes back a single value as the return item if needed. This has the\
    \ advantage of a closed communications model with everything neatly pasted in\
    \ values and any needed item returned as a parameter.\nBy necessity there are\
    \ two exceptions to this closed communications model:\n\n+   1. When we need more\
    \ than one item of information returned by the function\n2. When a copy of an\
    \ argument cannot reasonably or correctly be made (example: file stream objects).\n\
    \nThese exceptions are handled by parameter passing by reference instead of passing\
    \ a value. The item passed is called a reference variable and it represents a\
    \ concept of an alias for the variable. Any change made to the reference variable\
    \ is actually performed on the variable that it represents. The symbol of the\
    \ ampersand is used to designate the reference variable (and it is associated\
