  md: '# Chapter 15


    # 15. Counting Loops


    # 15.1 For Loop¹


    # 15.1.11 Introduction to Test Before Loops


    There are two commonly used test before loops in the iteration (or repetition)
    category of control structures. They are: while and for. This module covers the
    for:


    # 15.1.1.1 Understanding Iteration in General – for


    In most programming languages the loop is used exclusively for counting; that
    is to repeat a loop action as it counts up or counts down. There is a starting
    value and a stopping value. The question that controls the loop is a test expression
    that compares the starting value to the stopping value. This expression is a Boolean
    expression and is usually using the relational operators of either less than (for
    counting up) or greater than (for counting down). The term loop comes from the
    circular looping motion that occurs when using flowcharting. The basic form of
    the for loop (counting up) is as:


    for


    ```

    initialization of the starting value

    starting value is less than the stopping value

    some statements or action

    some statements or action

    some statements or action

    increment the starting value

    ```


    It might be best to understand the for loop by understanding a while loop like
    a counting loop. Let''s consider:


    ```

    initialization of the starting value

    while the starting value is less than the stopping value

    some statements or action

    some statements or action

    some statements or action

    increment the starting value

    ```


    > ¹This content is available online at <http://cnx.org/content/m20600/1.3/>.'
