    Figure 5.5: CPU – Input/Output Devices


    Our program now located in the memory has basically two areas:


    +   - Machine instructions – our instructions for what we want done

    - Data storage – our variables that we use in our program


    Often our program contains instructions to interact with the input/output devices.
    We need to move data into (read) and/or out of (write) the memory data area. A
    device is a piece of equipment that is electronically connected to the memory
    so that data can be transferred between the memory and the device. Historically
    this was done with punched cards and printouts. Tape drives were used for electronic
    storage. With time we migrated to using disk drives for storage with keyboards
    and monitors (with monitor output called soft copy) replacing punched cards and
    printouts called inkjet copies.

    Most computer operating systems and by extension programming languages have identified
    the keyboard as the standard input device and the monitor as the standard output
    device. Often the keyboard and monitor are treated as the default device when
    no other specific device is indicated.'
