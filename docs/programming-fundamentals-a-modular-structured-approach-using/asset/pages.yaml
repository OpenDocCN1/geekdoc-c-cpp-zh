  md: '# Chapter 23


    # 23. More Arrays & Compiler Directives


    # 23.1 Multidimensional Arrays¹


    # 23.1.1 Overview


    An array is a sequenced collection of elements of the same data type with a single
    identifier name. As such, the array data type belongs to the "Complex" category
    or family of data types. Arrays can have multiple axes (more than one axis). Each
    axis is a dimension. Thus a single dimension array is also known as a list. A
    two dimension array is commonly known as a table (a spreadsheet like Excel is
    a two dimension array). In real life there are occasions to have data organized
    into multiple dimensioned arrays. Consider a theater ticket with section, row
    and seat (three dimensions).


    We refer to individual values as members (or elements) of the array. Programming
    languages implement the details of arrays differently. Because there is only one
    identifier assigned to the array, we have operators that allow us to access the
    individual members of an array.


    The operator constantly associates with referencing an array member is the index
    operator. It is important to learn how to define array and initialize its members.
    The index operator is a set of square brackets with an integer value that represents
    the offset from the front of the array. A table which has two dimensions would
    use sets of square brackets to define the array variable and two sets of square
    brackets for the index operators to access the members of the array.


