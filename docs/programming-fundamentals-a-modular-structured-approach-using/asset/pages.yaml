  md: '# 3.2 Identifier Names³


    # 3.2.1 Overview


    Within programming a variety of items are given descriptive names to make the
    code more meaningful to us as humans. These names are called "Identifier Names".
    Constants, variables, type definitions, functions, etc. when declared or defined
    by a name. These names follow a set of rules that are imposed by:


    +   - Use Identifier language''s technical limitations

    - good programming practices

    - common industry standards for the language


    # 3.2.2 Technical to Language


    +   - Use only allowable characters (for C++ the first character alphabetic or
    underscore, can with alphanumeric or underscore)

    - Can''t use reserved words

    - Length limit


    These attributes vary from one programming language to another. The allowable
    characters and reserved words will be different. The length limit refers to how
    many characters are allowed in an identifier name and is compiler defined and
    may vary from compiler to compiler for the same language. However, all programming
    languages have these three technical rules.


    # 3.2.3 Good Programming Techniques


    +   - Meaningful

    - Be case sensitive


    Identifier names make your code easier to understand. After all what does "p"
    mean? Is it pi, price, pennies, or etc? Do not use cryptic (like it in the dictionary)
    identifier names.

    Some programming languages treat upper and lower case letters used in identifier
    names as the same. Thus: pig and Pig are treated as the same identifier. Unknown
    to the programmer, the compiler usually forces all identifier names to upper case.
    Thus: pig and Pig both changed to PIG. However not all programming languages act
    this way. Some treat upper and lower case letters as being different things. Thus:
    pig and Pig are two different names. If you declare it as pig and then reference
    it in your code as Pig - you get a compiler error. To avoid the problem altogether,
    we teach students to be case consistent. Use an identifier name only once and
    spell it (upper and lower case) the same way within your program.


    # 3.2.4 Industry Rules


    +   - Do not use underscore (used for technical programming)

    - variables in all lower case

    - CONSTANTS IN UPPER CASE


    These rules are decided by the industry (who are using the programming language).
    The above rules are commonly used within the "C" programming language and have
    large degree carried over to C++.


