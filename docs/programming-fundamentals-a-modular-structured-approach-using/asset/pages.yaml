  md: '# 16.2 Unary Positive and Negative Operators³


    # 16.2.1 General Discussion


    Unary positive also known as plus and unary negative known as minus are unique
    operators. The plus and minus when used with a constant value represent the concept
    that the values are either positive or negative. Let''s consider:


    ```

    +5 + -2

    ```


    We have three operators in this order: unary positive, addition, and unary negative.
    The answer to this expression is positive 3. As you can see, one must differentiate
    between the plus sign means unary positive and when it means addition. Unary negative
    and subtraction have the same problem. Let''s consider:


    ```

    -2 + +5

    ```


    The expression evaluates to 7. Let''s consider:


    ```

    7 - -2

    ```


    First counts that do not have a minus in front of them are assumed (the default)
    to be positive. When you subtract a negative number it is like adding, thus the
    expression evaluates to 9.


    # 16.2.2 C++ Code Examples


    The above examples work within the C++ programming language. What happens if we
    put a unary positive or negative in front of a variable or a named constant?


    # 16.2.2.1 Negative – Unary Negative


    The concept of negative is to take a value and change its sign, that is: flip
    it. If it positive make it positive and if it negative make it negative. Mathematically,
    it is the following C++ code example, given that money is an integer variable
    with a value of 6:


    ```

    money * -1

    ```


    The above expressions evaluate to the same value. In the first line, the value
    in the variable money is fetched and then it''s negated to a 6. In the second
    line, the value in the variable money is fetched and then it''s multiplied by
    1 making a negative number 6,


    # 16.2.2.2 Unary Positive – Worthless


    Simply to syntax, the unary positive was added to the C++ programming language
    as an operator. However, it is totally worthless or useless operator and is rarely
    used. However don''t be confused the following expression is completely valid:


    ```

    6 + +5

    ```


    The second + sign is interpreted as unary positive. The first + sign is interpreted
    as addition.


    ```

    money

    -money

    money * +1

    ```


    For all three lines, if the value stored in money is 6 the value of the expression
    is 6. Even if the value in money was negative 77 the value of the expression would
    be negative 77. The operator does nothing, because multiplying by 1 does not change
    its value.


