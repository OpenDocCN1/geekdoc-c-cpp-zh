  md: "# 15.4 Nested For Loops\n\n# 15.4.1 General Discussion\n\n# 15.4.1.1 Nested\
    \ Control Structures\n\nWe are going to first introduce the concept of nested\
    \ control structures. Nesting is a concept that places one item inside another.\
    \ Consider:\n\n```\nif expression\n  true action\nelse\n  false action\n```\n\n\
    This is the basic form of the if then else control structure. Now consider:\n\n\
    ```\nif age is less than 18\n  you can't vote\n  if age is less than 16\n    you\
    \ can't drive\n  else\n    you can drive\nelse\n  you can vote\n  if age is less\
    \ than 21\n    you can't drink\n  else\n    you can drink\n```\n\nAs you can see\
    \ simply included as part of the \"true action\" a statement and another if else\
    \ control structure. We did the same (nested another if else) for the \"false\
    \ action\". In our example we nested if then else control structures. Nesting\
    \ could have an if then else within a loop. Thus, the concept of nesting allows\
    \ the mixing of different categories of control structures.\nMany logic problems\
