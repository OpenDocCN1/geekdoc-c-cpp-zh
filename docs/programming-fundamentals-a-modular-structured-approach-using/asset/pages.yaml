    # 5.3 Compiler Directives


    # 5.3.1 General Discussion


    A compiler directive is an instruction to the compiler to complete a task before
    formally starting to compile the program, during the preprocessor step the compiler
    is looking for compiler directives and processes Among other items, the preprocessor
    processes them as they are encountered. After completing the tasks as directed,
    the compiler proceeds to its second step where it checks for syntax errors (of
    the rules of the language) and converts the source code into an object code that
    contains language instructions, a data area, and a list of items to be resolved
    when he object file is linked to other files.


    In C++ the pound symbol or # as the first character of a line indicates that the
    next word is a directive (or command word) to be evaluated. The most common compiler
    directives are:


    +   1. include with the item following being the name of a file that is to be
    inserted at place in the file. The files are often called "Header Files" because
    the include directive is normally inserted toward the top of the file (at the
    head) as one of the first items.

    2. define with the item followed by an identifier name and a value. This identifier
    name and value is stored by the compiler and when it encounters the identifier
    name in the program it substitutes the value for the identifier name.


    In the following example the include directive is inserting a file that contains
    code for the Input-Output Stream library. This file contains necessary code to
    use cout and cin for sending data to the monitor or


    ```

    #include <iostream>

    ```


    In the next example the define directive is being used to handle a constant (called
    a defined constant).


    # Example 5.2: Substituting PI


    ```

    #define PI 3.14159

    ...Later on the program when it encounters PI

    ...it will replace or substitute PI with the value 3.14159

    ...For example:

    area_circle = radius * PI;

    would become:

    area_circle = radius * radius * 3.14159;

    ```


