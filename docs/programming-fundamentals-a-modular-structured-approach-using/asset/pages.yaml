  md: '# Chapter 7


    # 7. Specific Task Functions


    # 7.1 Specific Task Functions¹


    # 7.1.1 Prerequisite Material


    Critical to this module is the review of two Connexions modules:


    +   1. m_18861 – Titled: Modularization and C++ Program Layout

    2. m_19145 – Titled: Program Control Functions


    You should review these materials before proceeding. If you are viewing this module
    on-line, links to these items might have a user "Links" box to your right.


    # 7.1.2 General Concept


    Program Control functions which might have similar identifier names usually perform
    different tasks in one program to another. Looking at the organizational chart
    or hierarchy chart for two companies, both might have a vice president of production,
    producing automobiles is different than producing ice cream. Similar but different.
    As you go down into an organization you might find the job title of security guard.
    Notice the fact that the security guard at the automobile plant and the security
    guard at the ice cream plant have exactly the same job, they are most interchangeable.
    Within programming when a task gets itself might be usable in several programs.
    The calculation of year is a good example. Needed for the verification of dates,
    is there or is not a 29th of February for this example. it is not a leap year
    (false). Needed in hundreds of programs.


    # 7.1.3 Specific Task Functions


    To create good Task Functions you need to do all communication via parameter passing.
    Thus all programs that will use the function will communicate in the same way.
    In our leap example, you would communicate into the year and the function would
    return the communication of true or false; meaning it is a leap year there is
    a 29th of February or it is not a leap year (false).


    The ability to modify our program into specific task functions means that we can
    write the specific task function once it works correctly, then reuse it over and
    again in many programs. As you can guess there is a balance. Most programs will
    have some program control functions and some specific task functions. The key
    to deciding if the function should be a specific task function is rooted in the
    uniqueness of the task so that it can be used in many programs. Specific task
    functions once created are usually placed into a user library shared with others
    for use in many programs.


    > ¹This content is available online at <http://cnx.org/content/m19146/l4/>.'
