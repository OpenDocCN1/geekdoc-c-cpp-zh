  md: '# Chapter 21


    # 21. More on Typedef


    # 21.1 Versatile Code with Typedef


    # 21.1.1 Overview


    Everyone seeks of ways to be more efficient in what they do. A farmer uses a tractor
    instead of a horse. A construction worker uses an aired nail gun instead of a
    hammer. Programmers are no different than others, in that they are constantly
    improving their ability to produce correctly working programs. Some aspect of
    this is the use of modular/structured programming, proper documentation and following
    industry rules for a specific programming language. One example of efficient coding
    is letting the computer count the number of elements in an array. If we define
    an array:


    ```

    int ages[] = {33,32,10,3};

    ```


    We can use the following expression to calculate the number of members in the
    array:


    ```

    size_t ages = sizeof(ages);

    ```


    This use of flexible coding allows us to change the members of the array by adding
    or subtracting a value, like this:


    ```

    int ages[] = {57,33,32,3,1};

    ```


    Thus, we don''t have to modify our code that use the expression that calculates
    the number of member in the array.

    One of the use is to allow us to write code that can be quickly changed to handle
    different data types. There are several integer and floating-point data types
    that can store number values with different domains. If we use some typedef, then
    our code becomes versatile. if we only use typedef commands, our code can be used
    to process data of a different data type. This is demonstrated within the demo
    file provided, then you need to study this material in conjunction with the demo
    program.


