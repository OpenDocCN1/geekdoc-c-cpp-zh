    # 20.2 Sorting an Array^5


    # 20.2.1 Overview


    Sorting is the process through which data are arranged in ascending or descending
    values. There are several sorting algorithms or methods that can be used to sort
    data. Some include:


    +   1. Bubble

    2. Selection

    3. Insertion


    We will not be choosing the selection or insertion sort methods in this module.
    If an array is sorted in ascending order, it means the values in the array are
    stored from lowest to highest. In descending order, it means they are stored from
    highest to lowest. Bubble sort works by comparing each element with its neighbor
    and swapping them if they are not in the desired order.^6


    There are different methods of bubble sorting that are more efficient than others.
    Use a pair of nested loops or iteration control structures. One method sets a
    flag that indicates that the array is sorted, then does a pass if any elements
    are exchanged (switched); it sets the flag to indicate that the array is not sorted
    until a pass where nothing is exchanged.


    > ^3See the file at <http://cnx.org/content/m21267/latest/Demo_FindingArrayMember.cpp>

    ^4See the file at <http://cnx.org/content/m21267/latest/Demo_Farm_Acres_Input.txt>


    > ^5This content is available online at <http://cnx.org/content/m21268/Demo_Farm_Acres_Input.txt>.

    ^6Tony Gaddin, Judy Walters and Godfrey Muganda, Starting Out with C++ Early Objects
    Sixth Edition (United States of America: Pearson– Addison Wesley, 2008) 569.'
