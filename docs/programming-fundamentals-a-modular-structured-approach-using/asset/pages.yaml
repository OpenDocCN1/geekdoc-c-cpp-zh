    # ## 12.2.3 Examples


    I call this example of why I hate "and" and love "or".


    Everyday as I came home from school on Monday through when Thursday; I would ask
    my mother, "May I go outside and play? She answered, "If your room is clean and
    your homework is done then you may go outside and play." I learned to hate the
    word "and." I could manage to get one of the tasks done and some time to play
    before dinner, but both of them... well, I hated."


    On Friday my mother took a more relaxed view point and when asked if I could go
    outside and she responded, "If your room is clean or your homework is done then
    you may go outside and play." I learned to clean my room quickly on Friday afternoon.
    Well needless to say, I loved "or".'
