    # 19.4 Math Statistics with Arrays9


    # 19.4.1 Overview


    Arrays are an important complex type used in all programming. We continue to concentrate
    on one simple dimension arrays also called a list. Most programmers develop a
    series of **user defined specific task functions** that can be used with an array
    for processing. These functions are usually passed the array along with the number
    of elements within the array. Some of functions also provide piece of data needed
    for particular calculations.


    This module covers the totaling of the members of an integer array. The Latin
    name for totaling is sometimes shortened to the **word sum**. The **array function**
    is often called "sum" and it does some parameter passing. It passes the function
    common two items of the array: its name along with the number of elements; but
    it returns a value representing sum or of the values in the array. You need to
    study this module in conjunction with the demo file provided.


    Other mathematical functions often associated with statistics such as: average,
    count, minimum, maximum, deviation, etc. are often developed for processing arrays.


