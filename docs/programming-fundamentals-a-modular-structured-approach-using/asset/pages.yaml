  md: '# 26.6 Successful Learning Skills¹³


    # 26.6.1 Realize The Time Commitment


    Computer courses are often listed in the catalog of courses with both lecture
    and lab hours. But unlike the natural and biological sciences (chemistry, physics
    and biology) that must meet in a specific lab room designed for those courses,
    students can usually complete their lab portions at a variety of locations (the
    college''s computer lab, home, work, public library, friend''s house, etc.).


    The normal rule of thumb is 1 to 5 hours out of class for every hour in class
    and for computer courses this normally means both the lecture and lab hours. Students
    with learning disabilities or whose primary language is not English will plan
    for more study time and use a larger ratio. Thus, you should calculate the number
    of commitment needed for a course depending on your circumstances.


    Example: If a student is taking 4 credit hour course the catalog says contains
    6 of hours (adding your lecture and lab hours) during a 16 week semester; the
    classroom and study time for that course would be 12 to 15 hours a week.


    But many students take courses at a faster pace taking course between semesters
    in a concentrated mode, starting a course after the start of semester or during
    the summer. The weekly study time you will need to calculate the total regular
    semester instruction time and divide by number of weeks for faster delivery. Example:


    Our 4 credit hour course would be taken during a summer that has 9 weeks of instruction
    time. The total regular semester time would be 15 times the normal semester commitment
    (180 to 225 hours). Dividing it by 9 would mean 20 to 25 hours per week.


    # 26.6.2 Understand Your Capacity to Concentrate


    You cannot expect to spend long periods of time working on course materials. After
    3 to 4 hours of working on course materials, your ability to learn drops significantly
    (and for most to near zero). This problem is compounded by the nature of the material
    which is cumulative. This means that you must understand an item before you try
    to learn item b. All of the math and sciences courses of study are of this nature.


    # 26.6.3 Plan Regular Study Times


    The combination of the time commitment and your ability to concentrate leads to
    the conclusion that you cannot cram your study into a week-end of concentrated
    study. You must break up your study into 3 to 4 hour periods by doing only one
    study period per day. You must establish a regular routine for each week. Students
    taking a regular semester on-campus will count their class (lecture and lab) time
    and plan 2 to 3 additional study periods.


    If you take a course via distance education, students need to plan for all of
    the course time, then, during a regular semester, our 4 credit hour course would
    require 3 to 4 study periods with 3 to 4 hours for each study period per day.
    If the course takes faster pace (9 week summer term) you will need to schedule
    more time maybe a 3 to 4 hour study daily for 6 days a week (with only one day
    off as a day of rest).


    You need to stay on top of a course to successfully complete it. Pairing with
    multiple study times allows for effective learning. Students who procrastinate
    until close to an exam and then by trying through course materials are rarely
    “A” students.


    > ¹³This content is available online at <http://cnx.org/content/m18101/1.10/>.'
  merge: -1
  pgno: 299
- img_proc: true
  md: '# 26.6.4 Requires Variety and Repetition


    Variety comes in many forms and includes lecture, lab assignments, studying textbooks,
    multi-media materials, quizzes, learning activities such as group discussions,
    crossword puzzles, flash cards, etc. This variety actually helps our brain to
    understand and build memory. In addition to variety, repetition (exposure over
    multiple study periods) is essential for our brains to be able to learn and recall
    the course materials. Again, this understanding and recall are essential to ensure
    that cumulative learning (you must understand item a before you can learn b).


    Textbooks and professors break-up course materials into chapters or learning modules
    with objectives first and review items at the end of each unit. Each chapter or
    module might have any of the mentioned items. But doing things and study are different.
    You can''t just show up to class and listen, you can''t just read stuff, need
    to study a variety of activities. Ask yourself:


    +   * Do you understand each learning activity?

    * Can you explain or formulate an answer for each learning activity?

    * If you did not understand the reading materials, did you re-read it?

    * Do the review items (especially questions).

    * Take notes.

    * Do lecture notes or assignments give you a better understanding of the textbook?

    * Often the problems or are studied in conjunction and reinforce the study materials.
    Have you tried to understand the problems or lab assignments?

    * Are there any learning activities available and if, did you do them.

    * Did you consider using 3x5 cards to study definitions and vocabulary?

    * Did you review the learning objectives before taking any quizzes?

    * If the quizzes are computerized, did you study your quiz results?

    * After reviewing quiz results and re-study, did you retry the quiz again if available?


    All of this requires time and effort for the student in any course (distance education
    or campus). You need several study periods a week to learn the materials in any
    course. The purpose of a quiz is for you to self assess your understanding of
    the materials. If your learning is not complete, change or modifying your habits.


    # 26.6.5 Interact with the Other Students


    In a normal classroom students interact with each other. They often form study
    groups with other students and meet regularly to help each other study materials.
    These interactions in most cases are essential to the learning process. If your
    only interaction is by private conversation or private email with the instructor,
    you are not fully participating in the course. For distance education students,
    most learning systems (such as Blackboard) provide several tools to create this
    interaction. They typically include announcements, discussion list, and chat tools.


    # 26.6.6 Dont Procrastinate and Don''t Get Behind


    What would you do if you get behind? Plan regular study periods. The lack of regular
    study periods is most likely the reason for why you got behind. Plan when you
    will do extra study periods in order to catch up.


    # 26.6.7 Attend Class and Take Notes


    Taking lecture notes and being able to review those later when you are studying
    provides variety that is needed to learn material. Writing the notes down more
    actively engages the brain, because you are listening and writing. But you need
    to arrange with at least two classmates that you will all take notes'
