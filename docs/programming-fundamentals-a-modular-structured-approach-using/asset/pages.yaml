    # 6.2 Hierarchy or Structure Chart


    # 6.2.1 Overview


    The hierarchy chart (also known as a structure chart) shows the relationship of
    various units. Its name comes from its general use in showing the organization
    (or structure) of a business. The President at the top, then vice presidents on
    the next level, etc. Within the context of a computer program it shows the relationship
    between modules (or functions). Detail logic of the program is not presented.
    It does represent the organization of the function and within the program showing
    which functions are calling on a subordinate function. Those above calling those
    on the next level down.

    Hierarchy charts are created by the programmers to help document a program. They
    convey the big picture of the modules (or structures) used in a program.


