  md: '# Chapter 5


    # 5. Integrated Development Environment


    # 5.1 Integrated Development Environment


    # 5.1.1 IDE Overview


    High-level language programs are usually written (coded) as ASCII text into a
    source code file. A unique file extension (Examples: .asm .cob for .pas .cpp)
    is used to identify it as a source file. As you can guess for our examples – COBOL,
    FORTRAN, Pascal, "C" and "C++" however, they are just ASCII text files (other
    text files use the extension of .txt). The source code produced by the programmer
    must be converted to an executable machine code file specifically for the computer''s
    CPU (usually an Intel or Intel CPU within today''s world of micro computers).
    There are several steps in getting a program from its source code to running the
    program on your computer. Historically, we had to use several software programs
    (a text editor, a compiler, a linker and operating system commands) to make the
    conversion and run our program. Today those software programs with their associated
    tasks have been integrated into one program. However, this one compiler program
    is really many software items that create an Integrated Development Environment
    used by programmers to develop software. Thus the name: Integrated Development
    Environment or IDE.


    The following figure shows the progress of activity in an IDE as a programmer
    enters the source code and then directs the IDE to compile and run the program.


    > ¹This content is available online at <http://cnx.org/content/m18920/1.9/>.'
  merge: -1
  pgno: 76
- img_proc: true
  md: '# Files Created


    # IDE Software Used


    pgm_name.cpp


    Text Editor


    Monitor showing source code


    Library headers


    Compiler 1st Step


    Translation Unit


    Compiler 2nd Step


    pgm_name.obj


    Library objects


    Incorrect Outputs


    Linker


    pgm_name.exe


    Loader


    CPU


    Monitor running the program


    Figure 5.1: Integrated Development Environment or IDE


    Upon starting the IDE software the programmer usually indicates he wants to open
    a file for editing as source code. As they make changes they might either do a
    "save as" or "save". When they finished entering the source code, they directly
    direct the IDE to "compile & run" the program. The IDE does the following steps:


    +   1. If there are any unused changes to the source code file it has the editor
    saves the changes.

    2. The compiler compiles the source code file and does its first step which is
    executing the pre-processor compiler directives and other steps needed to get
    the file ready for the second step. The #include will insert header files into
    the code to compile. If it encounters an error, it stops and returns the error
    to the user to the source code within the file with an error message. If no problems
    encountered it saves the code to a file called a translator unit.

    3. The compiler translates the unit file and does its second step which is converting
    the programming language to machine instructions for the CPU, a data area and
    a list of items to be resolved by the linker. Any problems encountered (usually
    a syntax or violation of the programming language rules) stops the process and
    returns the user to the source code file within the text editor with an error
    message. If no problems encountered it saves the machine instructions, data area
    and linker resolution list as an object file.'
