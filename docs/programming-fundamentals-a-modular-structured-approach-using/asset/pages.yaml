  md: '# 270


    # CHAPTER 24. OOP & HPC


    Often not understood by many today, the first computer base 10 arithmetic in the
    electronics and was a parallel processing machine by using several accumulators
    to improve the speed. However, this was not last for long. During its construction:


    > "The First Draft of a Report (commonly shortened to First Draft) on the EDAC
    – Electronic Discrete Variable Automatic Computer was an incomplete 101 page document
    written by John von Neumann and distributed June 30, 1945 by Herman Goldman, security
    officer on the ENIAC project. It contains the first published description of the
    logical design of a computer using the stored-program concept, which came to be
    known as the Neumann architecture." (First Draft of a Report on the EDAC from
    Wikipedia)


    > "The Neumann architecture is a design model for a stored-program digital computer
    that uses a [central] unit and single storage storage to hold both instructions
    and data. It was made after the mathematician and early scientist John von Neumann.
    Computers implement a universal Turing machine and a sequential architecture."
    (von Neumann architecture from Wikipedia)


    Von Neumann also proposed using a binary (base 2) numbering system for the electronics.
    One of the characteristics of the Neumann architecture was the trade-off of limiting
    multiple processors to a single central processor. To compare out our example,
    the idea was to use one real fast ant versus 10 slow ants. If one real ant do
    1000 tasks in an hour; it would be more powerful (to do more tasks) than 10 ants
    doing 10 tasks an hour or the equivalent of 100 tasks per hour:


    The rest is history – for the first forty years (1951 to 1991) followed the Neumann
    architecture. The electronic engineers kept building more reliable and faster
    electronics. From vacuum tube, to integrated circuit what we now call "chip" technology.
    This transformation made computers break down less ( ( more reliable), significantly
    smaller, needing less power and faster. Personal computers were introduced in
    the late 1970s and within ten years became more commonly used and.


    One short coming was that many programming efforts towards improving the linear
    (or sequential) way of thinking or solving a problem. After all, the computer
    engineers were making a faster computer next year. Everyone understood that the
    computer had one central processing unit (CPU). Right?


    # 24.2.2.3 The Need for Power


    Well, wrong. Computer scientists and electronic engineers had been experimenting
    with multi-processor computers with parallel programming since 1946. But it''s
    not until the 1980s that we saw the first parallel processors (by Cray and other
    companies) being sold as commercial computer bits. It''s time another example.


    # Example 24.4


    The circus traveling from one city to the next has an elephant that has teeth.
    They decide to toss the elephant ant (the train) on them for chasing the city
    side), but short a "super" ant (faster than most real ants) does the project.
    The project is much larger than your tossed chicken bone. One "super" ant could
    do the task (bite off a piece of the elephant) and transport it to the city, one
    bite at a time); might take one year. After all this requires more than a chicken
    bone. But what if he gets help? He gets some and being a large colony of "super"
    ants allocate a total of 2,190 ants to do the task. Wow, look after the elephant''s
    nose.


    This elephant is exactly where the computer scientists arrived. The electronic
    engineers were going to make improvements in the speed of a single central processing
    unit, but not soon enough to satisfy the "need for power" to be able to solve
    tasks requiring immense computing power. Some of the tasks that require immense
    computer power include the human genome project, searching for oil and gas by
    creating 3 dimensional images of geological formations and the study of gravitational
    forces in the universe; just to mention a few. The solution: parallel processing
    to the'
