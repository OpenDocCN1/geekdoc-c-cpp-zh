    # 6. Program Control Functions


    # 6.1 Pseudocode Examples for Functions¹


    No standard for pseudocode syntax exists. However, there are some commonly followed
    conventions to help make pseudocode written by one programmer easily understood
    by another programmer. The following describes a method for using pseudocode for
    functions that would be understood by programmers. Five concepts are:


    +   - Use a beginning phrase word to start the function

    - Use a communication phrase word to identify the items being passed into the
    function

    - Use indentation to show the action part of the function

    - Use a communication phrase word to identify the items being passed out of the
    function

    - Use an ending phrase word to end the function

    - Use a calling phrase word to direct your program to use a function


    The following is a suggested outline of pseudocode function words:


    | Item/Purpose | Starting Phrase Word | Ending Phrase Word |

    |---|---|--|

    | Beginning | Function | N/A |

    | Communication In | Pass In: | none |

    | Action | N/A | N/A |

    | Communication Out | Pass Out: | none |

    | Ending | N/A | Endfunction |

    | Calling a Function | Call: | none |


    Table 6.1


