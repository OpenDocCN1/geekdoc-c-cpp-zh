  md: '# 24.2.3.3 Upper Under-Graduate College Students


    The challenge is to try parallel programming, not just talk about it.

    During the week of May 21st to 26th in 2006, this author attended a workshop on
    Parallel and Distributed Computing. The workshop was given by the National Computational
    Science Institute and introduced parallel programming using multiple computers
    (a group of micro computers grouped or clustered into a super-computer). The conference
    emphasized several important points to the industry:


    +   1. During the past few years super-computers have become more powerful and
    more available.

    2. Top desk computers are starting to be built with multiple processors (or cores)
    and we will have multiple (10 to 30) core processors within a few years.

    3. Use of super-computing power is wide and growing in all areas: scientific research,
    engineering applications, 3D animation for computer games and education, etc.

    4. There is a shortage of educators, scientific researchers, and computer professionals
    who know how to manage and utilize this developing resource. Computer professionals
    needed: Technicians who know to create and maintain a super-computer and Programmers
    who know how to create applications using parallel programming concepts.


    Last item was emphasized to those of you beginning a career in computer programming
    that will progress you in your education, you should be aware of the changing
    nature of computer programming as a profession. Within a few years all professional
    programmers will be familiar with parallel programming.


    During the conference this author wrote a program that sorts an array of 150,000
    items using two approaches. The first way was without parallel programming. When
    it was compiled and executed using a single machine, it took 120.323 seconds to
    run (2 minutes). The second way was to redesign the program so it could run on
    several processors at the same time. When it was compiled and executed using 11
    machines in a cluster of micro-computers, it took 20.974 seconds to run. That''s
    approximately 6 times faster. Thus, parallel programming will become a necessity
    to be able to utilize the multi-processor hardware of the future.


    A distributed computing environment was set up in a normal computer lab using
    a Linux operating system on a CD. After booting several computers with the CD,
    the computers can communicate with each other with the support of "Message Passing"
    or MPI commands. This model is known as the Booster CD (BCD) is available from:


    The source code files we used were modified to version 8, as 8 is is in the filename.
    The non-parallel processing, "super" code was named: non8.cpp with the parallel
    processing "super" code named: super8.cpp (Note the parallel processing contains
    some comments that part the code being "SERVER_NODE" with a part of the code being
    run by the 10 other machines (the client machines communicate critical information
    to the server node using "Message Passing" or MPI commands.


