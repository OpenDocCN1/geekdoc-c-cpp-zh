  md: '# 202


    # CHAPTER 15. 15. COUNTING LOOPS


    should work for the Boolean data type as well; but in most programming languages
    it does not for various

    technical reasons.


    "In mathematics, modular arithmetic (sometimes called clock arithmetic) is a system
    of arithmetic for

    integers where numbers "wrap around" after they reach a certain value — the modulus.
    .


    A familiar use of modular arithmetic is its in the 12 hour clock arithmetic of
    time-keeping in

    which the day is divided into 12 hour periods. If the time is 7:00, then 8 hours
    later it will be

    3:00. Usual addition would suggest that the later time should be 7+8 = 15, but
    this is not the answer

    because clock "wraps around" every 12 hours; there is no "15 o''clock". Likewise,
    if the clock starts at

    12:00 (noon) and 21 hours later, then the time will be 9th day, rather than 33:00.
    Since the hour

    number starts over when it reaches 12, this is modular arithmetic 12.


    ![](img/3f11fdc2542c12fc98cf70f265c57440_209_0.png)


    Figure 15.3


    Time-keeping on a clock gives an example of modular arithmetic. (Modular arithmetic
    from Wikipedia)

    The use of the modulus operator in integer division is tied to the concepts used
    in modular arithmetic.


    # 15.2.2 Implications When Executing Loops


    If a programmer sets up a loop incorrectly, usually one of three things happens:


    +   - Infinite loop — usually caused by missing update attribute.

    - Loop never over — usually the expression is wrong with the direction of the
    less than greater

    relationship to be switched.

    - Loop executes more times than desired — not properly handled. Usually the direction
    of counting

    (increment or decrement) need to be switched.


    Let''s give an example of the loop executing for what appears to be for infinity
    (the third item on our list).


    Example 15.4: C++ source code


    ```

    for (int x = 0; x < 10; --x)

    cout << x << endl;

    }

    ```


    The above code accidentally decrements the value of x goes in a negative value
    towards -2147483648 (the largest negative value in a normal four byte signed integer
    data type). It might take a while (thus it might appear to be in an infinite loop)
    for it to reach the negative 2 billion plus value, before finally decrementing
    to positive 2147483647 which would, incidentally, stop the loop execution.'
