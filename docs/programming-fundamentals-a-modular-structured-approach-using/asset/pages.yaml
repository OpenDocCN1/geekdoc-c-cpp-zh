  md: '# Programming Fundamentals - A Modular Structured Approach using C++


    Programming Fundamentals - A Modular Structured Approach using C++ is written
    by Kenneth Leroy Busbee, a faculty member at Houston Community College in Houston,
    Texas. The materials used in this textbook/collection were developed by the author
    and others as independent modules for publication within the Connexions environment.
    Programming fundamentals are often divided into three college courses: Modular/Structured,
    Object Oriented and Data Structures. This textbook/collection covers the first
    of three.


    # About Connexions


    Since 1999, Connexions has been pioneering a global system where anyone can create
    course materials and make them fully accessible and easily reusable free of charge.
    We are a Web-based authoring, teaching and learning environment open to anyone
    interested in education, including students, teachers, professors and lifelong
    learners. We connect ideas and facilitate educational communities.


    Connexions'' modular, interactive courses are in use worldwide by universities,
    community colleges, K-12 schools, distance learners, and lifelong learners. Connexions
    materials in many languages, including English, Chinese, Japanese, Italian, Vietnamese,
    French, Portuguese, and Thai. Connexions is part of an exciting new information
    distribution system that allows for Print on Demand Books. Connexions has partnered
    with innovative on-demand publisher QOOP to accelerate the delivery of printed
    course materials and textbooks into classrooms worldwide at lower prices than
    traditional academic publishers.'
