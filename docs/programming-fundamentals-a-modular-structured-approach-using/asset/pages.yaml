    \ does not exist and the programmer must handle that possibility within the logic\
    \ of his algorithm. Two specific searches can be made for the maximum (largest)\
    \ values in the array or the minimum (smallest) value in the array. Maximum and\
    \ minimum are also know as max and min.\nThere are two basic ways of searching\
    \ for a specific value:\n\n+    1. Linear search\n 2. Binary search\n\n\"The linear\
    \ search is a very simple algorithm. Sometimes called a sequential search, it\
    \ uses a loop to sequentially step through an array, starting with the first element.\
    \ It compares each element with the value being search for, and stops when the\
    \ value is found or the end of the array is encountered. If the value being searched\
