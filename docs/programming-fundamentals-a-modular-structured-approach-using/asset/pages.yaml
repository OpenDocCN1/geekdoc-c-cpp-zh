    # 3.3.1 Understanding Constants


    Various textbooks describe constants using different terminology. Added to the
    complexity the explanations from various industry professionals will vary greatly.
    Let''s see if we can clear it up.


    A **constant** is a data item whose value cannot change during the program''s
    execution. Thus, as its name implies their value is constant.


    A **variable** is a data item whose value can change during the program''s execution.
    Thus, as its name implies their value can vary.


    Constants are used in three ways within C++. They are:


    +   1. literal constant

    2. defined constant

    3. memory constant


    A **literal constant** is a **value** you type in your program whenever it is
    needed. Examples include the constants used for initializing a variable and constants
    used in lines of code:


    **Example 3.1:** Literal Constants


    ```

    int age = 21;

    char grade = ''A'';

    float money = 12.34;

    bool rich = false;


    cout << "Students love computers";

    age = 57;

    ```


    Additionally, we have learned to recognize the data types of literal constants.
    Single quotes for char, double quotes for string, number without a decimal point
    belongs to the floating-point family, and Boolean can use the words true or false
    value.


    In addition to literals, most text books refer to either symbolic or named constants
    but these two refer to the same concept. A symbolic constant is represented by
    a name similar to how we make name variables. Within C++ identifier names have
    some rules. One of the rules using names should be meaningful. Another rule about
    using ALL CAPS FOR CONSTANTS is an industry rule. There are two ways to create
    symbolic or named constants:


    ```

    #define PI 3.14159

    // Called a **defined constant** because it uses a textual substitution controlled
    by the compiler

    // pre-processor word "define".

    const double PI = 3.14159;

    ```


