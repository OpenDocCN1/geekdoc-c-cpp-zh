  md: '# 15.3.2.2 Handling Floating-point Data Type


    It is nice to have your output displayed so humans can read it (most humans are
    not use to scientific notation). There are three lines often inserted near the
    start of your code (first items in the main function) that can be used to direct
    the formatting of floating-point data. They are:

    cout.set(ios::fixed);

    cout.set(ios::shoppoint);

    cout.precision(n);

    They do the following for the rest of your program:


    +   - fixed – Do not use scientific but show floating-point values like integer
    values (numerical digits of 0 to 9 – no exponent notation).

    - showpoint – Always show a decimal point for floating-point values if there is
    no fractional part.

    - precision – Always show this number of digits (change n to a number like 2)
    to the right of the decimal point.


    # 15.3.2.3 Setting the Width for Numbers


    Setting the width for integer and floating-point data types must be done for the
    output of each value. Assume in the following example that age is an integer data
    and money is a floating-point data type.

    cout << setw(4) << endl;

    cout << setw(8) << money << endl;

    Note that each value has its own setw(n) where n is an integer telling you how
    many positions to use for the output. The iomanip header file (immediately shown)
    will need to be included in your program,

    #include<iomanip> // needed for the setw


