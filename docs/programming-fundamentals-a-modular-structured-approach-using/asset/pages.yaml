  md: '# Processing


    calculate the answer by adding the two ages together and dividing by two

    Output


    ```

    display the answer on the screen

    pause so the user can see the answer

    ```


    After developing the program design, we use the pseudocode to write code in a
    language (like Pascal, COBOL, FORTRAN, "C", C++, etc.) where you must follow the
    rules of the language (syntax) in order to code the logic or algorithm presented
    in the pseudocode. Pseudocode does not include other items produced during programming
    design such as identifier lists for variables or test data.


    There are other methods for planning and documenting the logic for a program.
    One method is HIPO. It stands for Hierarchy plus Input Output and was developed
    by IBM in the 1960s. It involved a hierarchy (or structure) chart to show the
    relationship of the sub-routines (or functions) in a program. Each sub-routine
    had an IPO/task was simple, so we did not need to use multiple sub-routines, thus
    we did not produce a hierarchy chart. We did incorporate the IPO part of the concept
    for the pseudocode outline.


    # 2.2.2 Definitions


    Definition 2.4: pseudo

    Means false and includes the concepts of fake or imitation.


    # 2.3 Test Data³


    # 2.3.1 Overview


    Test data consists of the user providing some input values and predicting the
    outputs. This can be quite easy for a simple program and the test data can be
    twice.


    +   1. to check the model to see if it produces the correct results (model checking)

    2. to check the coded program to see if it produces the correct results (code
    checking)


    Test data is developed by using the algorithm of the program. This is usually
    documented during the program design with either flowchart or pseudocode. Here
    is the pseudocode in outline form describing the inputs, processing and outputs
    for a program used for painting rectangular buildings.


    Example 2.2: Pseudocode using an IPO Outline for Painting a Rectangular Building


    ```

    Input

    display a message asking user for the length of the building

    get the length from the keyboard

    display a message asking for the width of the building

    get the width from the keyboard

    display a message asking user for the height of the building

    get the height from the keyboard

    display a message asking user for the price per gallon of paint

    get the price per gallon of paint from the keyboard

    display a message asking user for the sq coverage of a gallon of paint

    get the sq coverage of a gallon of paint from the keyboard

    ```


    > ³This content is available online at <http://cnx.org/content/m18781/L4/>.'
