    # 26.5 Academic or Scholastic Dishonesty¹²


    # 26.5.1 Introduction


    The relationship between faculty and students has always been one of open and
    honest communication.

    The faculty member carries the responsibility of presenting course materials via
    reading assignments, lectures,

    labs, etc. The student is to learn and understand these materials. Additionally,
    the faculty members employ\various methods to assess the student''s mastery of
    the course materials. Frequently this is done via quizzes,

    tests, writing assignments, the completion of lab materials, etc. Academic dishonesty
    (sometimes called

    “Scholastic Dishonesty”) is the violation of that.

    Cheating on tests and plagiarism is well understood by students before arriving

    at the collegiate level of education. Most colleges explain cheating on plagiarism.
    Academic dishonesty often carries

    st penalty. Usually, the student receives a grade of “F” from the professor in
    the course in which he is

    enrolled. The student might be expelled from their classes for they are currently
    enrolled (“F”

    in all of your classes) and expelled from the institution (may not register for
    classes in the future). Sounds

    harsh, but it is a violation of the bond between the student and the academic
    institution.


    # 26.5.2 Collusion


    Another category of academic dishonesty is collusion which is the unauthorized
    collaboration with another

    person in performing work (including lab assignments) offered for credit (counting
    towards your

    grade calculation). To better understand, students need to realize that as part
    of the learning

    and evaluation of learning, many professors use projects; a directed or authorized
    collaboration.


