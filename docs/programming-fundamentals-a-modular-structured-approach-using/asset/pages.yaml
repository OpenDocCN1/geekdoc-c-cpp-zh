  md: '# Chapter 2


    # 2. Program Planning & Design


    # 2.1 Program Design¹


    # 2.1.1 Program Introduction


    Program Design consists of the steps a programmer should do before they start
    coding the program in a specific language. These steps when properly documented
    will make the completed program easier for programmers to maintain in the future.
    There are three broad areas of activity:


    +   - Understanding the Program

    - Using Design Tools to Create a Model

    - Develop Test Data


    # 2.1.2 Understanding the Program


    If you are working on a project as a one of many programmers, the system analyst
    may have created a variety of documentation items that will help you understand
    what the program is to. These could include screen layouts, narrative descriptions,
    documentation showing the processing steps, etc. If you are not on a project and
    you are creating a simple program you might be given only a simple description
    of the purpose of the program. Understanding the purpose of a program usually
    involves understanding it''s:


    +   - Inputs

    - Processing

    - Outputs


    This IPO approach works very well for beginning programmers. Sometimes, it might
    help to visualize the programming running on the computer. You can imagine what
    the monitor will look like, what the user must enter on the keyboard and what
    processing or manipulations will be done.


    # 2.1.3 Using Design Tools to Create a Model


    At first you will not need a hierarchy because your programs will not be complex.
    But as they grow and become complex, you will divide your program into several
    modules (or functions).

    The first modeling tool you will utilize learn is pseudocode. You will document
    the logic or algorithm of each function in your program. At first, you will have
    only one function, and thus your pseudocode will follow closely the IPO approach.


    > ¹This content is available online at <http://cnx.org/content/m18866/1.5/>.'
  merge: -1
