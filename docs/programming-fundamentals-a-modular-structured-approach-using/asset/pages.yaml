  md: '# 7.1.4 Definitions


    Definition 7.1: user defined library


    A file containing specific task functions created by individuals to be used in
    many programs.


    # 7.2 Global vs Local Data Storage


    # 7.2.1 General Discussion


    The concept of global and local data storage is usually tied to the concept of
    scope. Scope is the area of the program where an item (be it variable, constant,
    function, etc.) that has an identifier is recognized. In our discussion we will
    use a variable and the place within a program where the variable is defined determines
    its scope.


    **Global scope** (by extension global data storage) occurs when a variable is
    defined "outside of a **data area as part of the object code**. The object code
    has a machine code, data area and linker resolution instructions. Because the
    variable has global scope, technically it is available to all of the functions
    within your source code. You can even however we forget that explanation now.
    A key wording change should be learned at this point. Although the variable has
    global scope, technically it is available only from the **point of definition
    to the end of the program source code** before functions. This way it is available
    to all of the functions it is defined. **Local scope** (and by extension data
    storage) occurs when a variable is defined "inside of a function". When compiling,
    the compiler creates locations that will direct the creation of storage locations
    on an area known as **stack which is part of the computer''s memory**. These locations
    exist until the function completes its calling function. In this language we talk
    about items being pushed onto the stack and popped when the function terminates.
    Thus the stack is a reusable area of memory used by all functions and released
    as functions. Although the variable has local scope, technically it is available
    only from the **point of definition to the end of the function**. The parameter
    data of a function establishes local variables. Additionally, any other variables
    or constants needed by the function usually occur near the top of the function
    so they are available during the entire execution of the function''s code. Scope
    is important to modularization. **Program Control** functions usually use global
    scope for variables and constants placing them near the top of the program before
    any functions. **Specific Tasks** use only local scope by passing data as needed
    into the function with parameter passing and creating local variables as needed.
    Any information that needs to be communicated back to the calling function is
    again done via parameter passing. This **closed communications model** passes
    all data into and out of a function creates an important predecessor concept for
    encapsulation which is used in oriented programming.


    # 7.2.2 Definitions


    Definition 7.2: global scope


    Data storage defined outside of a function.


    Definition 7.3: local scope


    Data defined inside of a function.


    Definition 7.4: data area


    A part of object code used for storage of data.'
