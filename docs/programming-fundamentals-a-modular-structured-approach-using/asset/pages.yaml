    # 6.3.2 Concept of Modularization


    The concept is everywhere present in the real world around us. Simply put it is
    to take a large problem and divide it into smaller manageable pieces. The hierarchy
    chart of any large organization (government unit, company, university, hospital,
    etc.) will show levels of people with titles that indicate their area responsibility.
    Each person is a small piece of the overall workings of the organization. Each
    person can concentrate on their unique talent or task to make sure works properly.
    Collectively they accomplish the goals of the organization.


    Additionally, the concept has been around for a long time. A village of 300 years
    ago had farmers, tailors, blacksmiths, etc. Manufacturing is a prime example of
    not just work but modularized the product itself is viewed in terms of modules
    or systems (Example of a automobile: engine, brakes, etc.).


    The world of computers, both hardware (equipment) and software (computer programs),
    also uses this modular concept. Thus, the concept migrates to a single computer
    program; allowing us to modularize the program into manageable tasks called.


    # 6.3 Program Control Functions


    Program Control functions normally do not communicate with each other but to use
    a common area for variable storage. The rules for how data is communicated in
    and out of a function vary by programming language, but the concept is the same.
    The data items passed (or communicated) are called parameters. The wording: parameter
    passing. However, with program functions we use the data communication option
    of no communication - with no communication out. Our data variables and constants
    are placed in a common area available to all functions (called global scope).

    The identifier for program control functions usually imply a task to be accomplished,
    such as get-data, process-data or show-results. As you learn to write more complicated
    programs the number of lines of code will increase. Prudence dictates that it
    would be beneficial to divide the program into functions that perform unique tasks.
    The larger the program the need for modularization or creating of program control
    functions.


    Depending on the programming language, a formal way to:


    +   1. define a function (it''s definition or the code it will execute)

    2. call a function

    3. declare a function (a prototype is to declare a compiler)


    One of the easiest ways to understand program control function is to view an example.
    Even if you don''t know the C++ programming language, you can study the methods
    to help understand the modularization process.


