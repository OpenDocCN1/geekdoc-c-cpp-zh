  md: '186 CHAPTER 14. TEST BEFORE LOOPS


    subtract 1 from the value of whatever was in the variable being decremented. The
    precedence of increment and decrement depends on if the operator is attached to
    the right of the operand (postfix) or to the left of the operand (prefix). Within
    C++ postfix and prefix do not have the same precedence.


    # 14.1.2.2 Postfix Increment


    Postfix increment to use my existing value when you are done with the other operators;
    increment me. An example:


    ```

    int oldest = 44; // variable set up with initialization

    then later in the code

    age = oldest++;

    ```


    The first use of the oldest variable is an Rvalue where the existing value of
    44 is pulled or fetched and assigned to the variable age; then the oldest is incremented
    with its value changing from 44 to 45. This seems to be a violation of precedence
    because increment is higher precedence than assignment. But that postfix increment
    works within the C++ programming language.


    # 14.1.2.3 Prefix Increment


    Prefix increment to increment me now and use my new value in calculation. An example:


    ```

    int oldest = 44; // variable set up with initialization

    then later in the code

    age = ++oldest;

    ```


    The variable is incremented with the new value changing it from 44 to 45; then
    the new value is assigned to age.

    In postfix being 44 in prefix is assigned 45. One way to help remember the difference
    is to think of postfix being polite (use my existing value and return to increment
    me after the other operators are done) where prefix has an ego (I am important
    to first me and use my new value for the rest of the evaluation).


    # 14.1.2.4 Allowable Data Types


    Within some programming languages, increment and decrement can be used only on
    the integer data type. C++ however, expands this not to all of the integer family
    but also to the floating-point family (float and double). Incrementing 3.87 will
    change the value to 4.87. Decrement ''C'' will change the value to ''B''. Remember
    the ASCII character values are really byte unsigned integers (domain from 0 to
    255).


