  md: '# 15.2 Circular Nature of the Integer Data Type Family


    # 15.2.1 General Discussion


    There are times when integer and data types are lumped together because they both
    act the same (often the integer family). Maybe we should say they act differently
    than the floating-point data types. The integer family values jump from one value
    to another. There is nothing between 6 and 7 between ''A'' and ''B''. First, some
    things in the real world are not fractional. A dog, even with only 3 legs, is
    still one dog not three fourths of a dog. Second, the integer data type is often
    used to control program flow by counting (loops). The integer family has a circular
    wrap around feature. Using a two byte integer, the next number bigger than 32767
    is -32768 (character acts the same going from 255 to 0. We could also reverse
    that to be the next smaller negative -32768. This can be shown by using a normal
    math line, limiting the domain and then connecting the two ends to form a circle.


    # Math Number Line


