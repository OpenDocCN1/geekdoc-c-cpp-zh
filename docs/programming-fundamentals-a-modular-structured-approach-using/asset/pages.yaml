    # 6.5.1.5 Block Markers on Lines by Themselves


    Within many languages there is a method to identify a group of programming statements
    as a unit. With C++ the uses a set of symbols, the braces {}, to identify a block
    of code, sometimes referred to as a compound statement. Braces are used in other
    aspects of programs, but for now we will look at this simple example. These have
    a tendency to cause problems, especially when they don''t have a proper opening
    brace with a proper closing brace. To solve that many programmers simply put a
    brace on a line by itself and make the opening brace and closing brace are in
    the same vertical column.


    # 6.5.1.6Indent Block Markers


    A block of code associated with a function or with control structure is indented
    two or three spaces. When blocks of code are nested each nesting is indented two
    or three spaces. In our example above the blocks of code for the function definitions
    are indented two spaces.


    # 6.5.1.7 Meaningful Identifier Names Consistently Typed


    As the name implies "identifier names" should clearly identify (or what) you are
    talking about. Calling you you "Snooky" may be meaningful to only you. Others
    might need to see her full name (Jane Smith) to appropriately identify who you
    are talking about. The same concept in programming is true. Variables, constants,
    functions, typedefes and other items should use meaningful identifier names. Additionally,
    those names should be typed consistently in terms of upper and lower case as they
    are used in the program. Don''t define a variable: Pig and then it later in your
    program: pig.


    # 6.5.1.8 Appropriate use of Typedef


    Many programming languages have a command that allows for the creation of an identifier
    name that represents a data type. This feature is not demonstrated in the code
    above and is often a confusing concept. It is a powerful way to help document
    a program so that it is meaningful, is often used by more experienced programmers.


