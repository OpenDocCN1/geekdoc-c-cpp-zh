    7. 9 != 13

    8. 9 < 15


    The answers to Boolean expressions within the C++ programming language are a value
    of 1 for true or 0 for false.


    Be careful. In math you are familiar with this symbol: = to mean equal and ≠ to
    mean equal. In the C++ programming language the ≠ is not used and the = symbol
