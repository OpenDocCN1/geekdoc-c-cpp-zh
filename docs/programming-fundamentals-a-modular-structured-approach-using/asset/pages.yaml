  md: 'or of code. After our program is compiled and running, the lines of code in
    the function main executed and when it gets to the calling of the code pause,
    the control of the program moves to the pause function and starts executing the
    lines of code in the pause. When it''s done with the lines of code, it return
    to the place in the program it called (in our example main) and continue with
    the code in that function.


    Once we know how to define a function and how to call a function, we will usually
    need to know how to declare it to the compiler (a prototype). Because of normal
    computer programming standards, programmers usually list the function main with
    others defined after it. Then somewhere in the function, we will call a function.
    When we convert our source code to an executable version for running on our computer,
    the first step of the process is compiling. The compiler demands to know what
    the communication will be between two functions when a function is called. It
    will know the communication (what is going in out as parameters) if the function
    has been defined. But, we have not defined that function yet; it is defined after
    the function. To solve this problem, we show the compiler a prototype of the function
    what will look like (at least the communication featured of the function)


    ```

    void pause(void);

    ```


    This line of code looks exactly like the first line in our function definition
    with one important addition of a semi-colon. Prototypes (or declarations to the
    compiler of the communications of a function not yet defined) are placed near
    the top of the program before the function main. **Summary concept: If you call
    a function it is defined you must prototype it before it is called.** Looking
    at out of the list three things we need to do before the function main. In the
