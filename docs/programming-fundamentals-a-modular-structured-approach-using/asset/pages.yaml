    # 9.4 Sequence Operator*


    # 9.4.1 General Discussion


    The sequence (or comma) operator is used to separate items. It has several uses,
    four of which are listed then demonstrated:


    +   1. To separate identifier names when declaring variables or constants

    2. To separate several parameters being passed into a function

    3. To separate several initialization items or update items in a for loop

    4. To separate values during the initialization of an array


    This example is often seen in textbooks, but this method of declaring variables
    is not preferred. It is difficult to quickly read the identifier names.

    int pig, dog, cat, rat;

    The following vertical method of declaring variables or constants is preferred.


    > Example 9.4: Preferred Vertical Method of Defining Variables


    ```

    int pig;

    int dog;

    int cat;

    int rat;

    ```


    The data types and identifier names (known as parameters) are separated from each
    other. This example is a function prototype.

    double area_trapezoid(double base, double height, double top);

    in the syntax of a for loop which have three parts assigned by a semi-colon: The
    first is the initialization area which could have more than one initialization.
    The last is the update area which could have more than one update. Multiple initializations
    or updates use the comma to separate them. This example is the first line of a
    for loop.


    ```

    for (x = 1; x < 15; x++, y++)

    The variable ages is an array of integers. Initial values are assigned using block
