  md: '# 11.2 Boolean Data Type*


    # 11.2.1 Discussion


    The **Boolean** data type is also known as the logical data type and represents
    the concepts of true and false. The name "Boolean" comes from the mathematician
    George Boole; who in 1854 published: An Investigation of Laws of Thought. Boolean
    algebra is the area of mathematics that deals with the logical representation
    of true and false using numbers 0 and 1. The importance of the Boolean data type
    within programming is that it is used to control programming structures (if then,
    else, loops, etc.) that allow us to implement "choice" into our algorithms.


    The Boolean data type has the same attributes and acts or behaves similarly in
    all programming languages. The rules within the C++ programming language are:


    | C++ Reserved Word | bool |

    |---|---|n| Represent | Logical concepts of true and false |

    | Size | Usually 1 byte |

    | Normal Signage | Unsigned |

    | Domain (Values Allowed) | 0 meaning false, and 1 meaning true |

    | C++ syntax rule | true and false are reserved words that can be used as in expressions
    |

    | C++ concept/rule | Any value from any data type can be demoted into a Boolean
    data type with zero representing false and all non-zero values representing true
    |


    Table 11.1


    Most control structures use a **test expression** that executes either selection
    (as in the: if then else) or iteration (as in the: while or for loops) based on
    the truthfulness or falseness of the expression. Thus, we often talk about the
    **Boolean expression** that is controlling the structure. Within many programming
    languages, this must be a Boolean expression and is governed by a tight set of
    rules. However, in C++, every data type can be used as a Boolean expression because
    the value of any data type within C++ can be demoted into a Boolean value.


    Within many languages, expressions that yield Boolean data types are divided into
    two groups. One group uses the relational operators within expressions and the
    other group use logical operators within their expressions.


    Within the C++ programming language the Boolean data type is one of the standard
    or basic data types and is a member of the integer family.


    # 11.2.2 Definitions


    **Definition 11.3: Boolean**

    A data type representing the concepts of true and false.


    **Definition 11.4: test expression**

    an expression used to control programming structures.


    > *2This content is available online at <http://cnx.org/content/m19544/1.5/>.*'
