    # Definition 7.6: scope


    The area of a source code file where an identifier name is recognized.


    # 7.3 Using a Header File for User Defined Specific Task Functions³


    # 7.3.1 Concept: User Defined Specific Task Functions


    Most companies have certain tasks that are unique to their company. Collectively
    the programming staff may decide to build several functions and organize them
    into one or more user libraries. Specific task functions are often built using
    a testing shell program. The sole purpose of the testing shell program is to create
    the specific task functions and to test them to insure that they are working properly.
    Think of a clam, its shell surrounds the important part, the pearl. A testing
    shell program surrounds the specific task function (the important part). Usually
    the testing shell program will be used to create several functions that will be
    placed into a user defined library. The process flows as follows:


    +   1. The **testing shell** program with the specific task functions is built
    and thoroughly tested.

    2. A copy of the **testing shell** source code is saved as the **header file**
    that once modified will be placed in the user library. You delete the main part
    of the program leaving a comments area, any needed include references and the
    specific task functions.


