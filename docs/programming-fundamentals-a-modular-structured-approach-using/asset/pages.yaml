  md: '# 6.5.1.1 Documentation


    Documentation is usually placed at the top of the program using several comment
    lines. The amount of information would vary based on the requirements or standards
    of the company who is paying its employees or independent contractors to write
    the code. Notice the indication of revision dates.


    # 6.5.1.2 Vertical Alignment


    You see this within the documentation area. All of the items are aligned up within
    the same column. This vertical alignment occurs again when the variables are defined.
    When declaring variable or constants many textbooks put several items on one line;
    like:


    # Example 6.5: Common Textbook Defining of Variables


    ```

    float length, width, height, price_gal_paint, total_area, total_cost;

    int coverage_gal_paint, total_gal_paint;

    ```


    However common is in this textbooks, it would generally not be acceptable to standards
    used in many companies. You should declare each item on its own line; like this:


    # Example 6.6: Proper Defining of Variables with Vertical Alignment


    ```

    float length;

    float width;

    float height;

    float price_gal_paint;

    int coverage_gal_paint;

    float total_area;

    int total_gal_paint;

    float total_cost;

    ```


    This method of using one item per line is more readable by humans. It is quicker
    to find an identifier name, because you can read the list vertically faster than
    searching horizontally. Some programmers list them in alphabetical order, especially
    when the number of variables exceeds about twenty.


    The lines of code inside each function are also aligned vertically and indented
    two spaces from the left. The indentation helps set the block off visually.


    # 6.5.1.3 Appropriate use of Comments


    You can see through the source code short little comments that describe an area
    or section. Note the use of input, processing and output which are part of the
    IPO concept within the program design.


    # 6.5.1.4 Banners for Functions


    The use of comments in the form of a banner before each function.


    # Example 6.7: Comments as a Banner'
