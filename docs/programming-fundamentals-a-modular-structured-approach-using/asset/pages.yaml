- img_proc: true
  md: '146

    CHAPTER 11. TWO WAY SELECTION


    ```

    if expression

    action true

    else

    action false

    ```


    The above four forms of the control structure are saying the same thing. The else
    word is often not used in our English speaking today. However, consider the following
    conversation between a mother and her child. Child asks, "Mommy, may I go out
    and play?"

    Mother answers, "If your room is clean then you may go outside and play or you
    may go sit on a chair for five minutes as punishment for making the question when
    you know your room was dirty."

    Let''s note that all of the elements are present to determine the action (or flow)
    that the child will be doing. Because the question (your room is clean) has only
    two possible answers (true or false) the actions are mutually exclusive. Either
    the child (1) goes outside and plays or (2) sits on a chair for five minutes.
    One of the actions is executed; neither both of the actions.


    # 11.1.1 One Choice – Implied Two Way Selection


    Often the programmer will want to do something only if the expression is true,
    that is with no false action. The lack of a false action is also referred to as
    a "null else" and would be written as:


    ```

    if expression

    action true

    else

    do nothing

    ```


    Because the "else do nothing" is implied, it is usually written in short form
    like:


    ```

    if expression

    action true

    ```


    # 11.1.2 Two Way Selection within C++


    The syntax for the if else control structure within the C++ programming language
    is:


    ```

    if (expression)

    statement;

    else

    statement;

    ```


    > Note: The test expression is within the parentheses, but this is not a function
    call. The parentheses are part of the control structure. Additionally, there is
    no semicolon after the parenthesis following the expression.


    # 11.1.3 Definitions


    +   Definition 11.1: if then else

    A two way selection control structure.


    +   Definition 11.2: mutually exclusive

    Items that do not overlap. Example: true and false.'
