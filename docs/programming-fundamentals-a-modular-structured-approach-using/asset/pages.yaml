  md: '# 24.2 Introduction to High Performance Computing


    Grouping multiple computers or multiple computer processors to accomplish a task
    quicker is referred to as High Performance Computing (HPC). We want to explain
    how this is accomplished using parallel programming algorithms or concepts.


    # 24.2.2.1 The Shift from a Single Processor to Parallel


    We are going to start our explanation by giving two simple examples.


    # Example 24.1


    After eating you, you can toss the leg bone of the car window (shame on you for
    trashing the highway), but in short order an ant finds its tossed chicken bone.
    One single ant could bite off the left over on bone and transport it to the colony,
    one bite at a time; but, it might take him 1 whole day (24 hours) of work. What
    if he gets hungry? He signals buddies and being small colony of ants they allocate
    10 ants to do the task. Ten workers tone the ten ants do the task in 2 hours and
    24 minutes.


    I toss another bone out. An ant finds and the colony allocates 50 ants to do the
    task of picking the bone clean. In less than 30 minutes (28.8 to be exact) the
    50 ants working in parallel completes the task.


    # Example 24.2


    One painter might take 8 hours to paint the exterior of an average size house.
    But, if he could a crew of 10 painters working simultaneously (or in other words)
    it only takes 4 minutes. What about a crew of 50 assuming that they do work and
    not get in the way of each other; how well less than 10 minutes (9 to 6 to be).


    Now let''s make sure that the amount of work was done in the example. The work
    was only completed in a shorter amount of time because we use more workers on
    the task. Not all tasks can be divided in this way, but when it can be divided
    between multiple workers, we can take advantage of the workers doing their sub
    part of the task in parallel. Let''s look at another example.


    # Example 24.3


    I want to drive from Houston, Texas to Dallas; a distance of about 250 miles.
    For calculations let''s say I travel 50 miles in 1 hour. It would take me 5 hours.
    Well, I could divide the task between 5 cars and have each car 50 miles and arrive
    in Dallas in 1 hour. Right?


    Well, wrong. The task of driving from Houston to Dallas cannot be divided into
    tasks that can be done in parallel. The task cannot be done by one person in a
    line from Houston to Dallas in 5 hours. We use the "line" because it connects
    us to the word: linear. A linear task cannot be broken up into smaller tasks to
    be done in parallel by multiple workers. Within the computer world, the word associated
    with linear is sequential. I must drive one mile at a time in sequence to get
    to Dallas.


    Our natural tendency is to share the work that is in parallel whenever possible.
    As a group we can accomplish many tasks that can be done in parallel in less time.


    # 24.2.2.2 The Birth of Computers – A "Parallel" to Central Processing Unit (CPU)
    Story


    ENIAC, for Electronic Numerical Integrator And, was the first general-purpose
    electronic computer (July 1946). It was the first-complete, digital computer capable
    of being reprogrammed to a full range of computing problems. ENIAC had twenty-ten
    signed accumulators used ten''s complement representation and could perform 5,000
    simple addition or subtraction operations between any of them and a source (e.g.,
    another accumulator, or a constant transmitter) every second. It was possible
    to connect accumulators to run simultaneously, so the peak of operation was potentially
    much higher due to parallel operation.\ (ENIAC from Wikipedia)'
