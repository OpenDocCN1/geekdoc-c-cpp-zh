    # About Connexions


    # Connexions Modular Content


    The Connexions Project http://cnx.org/ is part of the Open Educational Resources
    (OER) movement dedicated to providing high quality free materials online, in free
    PDF format, and at low cost in volumes print-on-demand publishing. This textbook
    is one of many collections available to Connexions users. Each collection is composed
    of a number of re-usable modules written in the Connexions XML markup language.
    Each module may also be re-used (or ''re-purposed'') as part of other collections
    and may be used outside of Connexions.


    # Re-use and Customization


    The Creative Commons (CC) Attribution license applies to all Connexions modules.
    Any Connexions module may be used or modified for any purpose as long as proper
    attribution to the original(s) is maintained. Connexions'' authorizing tools make
    re-use (or re-purposing) easy. There, instructors are permitted to create customized
    versions of this textbook by editing modules, deleting modules, and adding their
    own supplementary modules. Connexions'' authorizing tools keep track of these
    changes and maintain the CC license''s required attribution to the original authors.
    This process creates a new collection that can be viewed online, downloaded as
    a single PDF file, or ordered by any instructors and students as a low-cost printed
    textbook.


