    # 26.2 C++ Reserved Keywords


    All programming languages have "reserved words". There are usually less than 50
    of these reserved words in any given programming language. They are reserved because
    they have been pre-assigned a specific meaning within that programming language,
    thus the compiler recognizes words to mean a specific thing or action. In C++
    the reserved words are also known as "keywords".


    Programmers use identifier names for a variety of items, to include: functions,
    variables, named constants, aliases names, etc. But, they can''t use identifier
    names words that are "reserved to the language".


    > This content is available online at <http://cns.org/content/m18181/l/6>.'
