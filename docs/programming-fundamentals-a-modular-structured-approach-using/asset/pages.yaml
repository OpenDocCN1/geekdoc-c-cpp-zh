  md: '# Chapter 1


    # 1. Introduction to Programming


    # 1.1 Systems Development Life Cycle¹


    # 1.1.1 Discussion


    The **Systems Development Life Cycle** is the big picture of creating an information
    system that handles a major task (referred to as an application). The **applications**
    usually consist of many programs. An example would be the Department of Defense
    supply system, the customer system used at your local bank, there are thousands
    of applications that use an information system created just to help solve a business
    problem.


    Another example of an information system would be the "TI Computer Games" software
    you might buy at any of several retail stores. This is an entertainment application,
    that is we are applying the computer to do a task (entertain you). The software
    actually consists of many different programs (checkers, chess, tic tac toe, etc.)
    that were most likely written by several different programmers.


    Computer professionals that are in charge of creating applications often have
    the job title of **System Analyst**. The major steps in creating an application
    include the following and start at **Planning** step.


    > ¹This content is available online at <http://cnx.org/content/m18684/1.6/>.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '![](img/3f11fdc2542c12fc98cf70f265c57440_29_0.png)


    Figure 1.1: Systems Development Life Cycle


    During the Design phase the System Analyst will document the inputs, processing
    and outputs of each program within the application. During the Implementation
    phase programmers would be assigned to write the specific programs using a programming
    language decided by the System Analyst. Once the system of programs is tested
    the new application is installed for people to use. As time goes by; changes and
    a specific part or program might need repair. During the Maintenance phase, it
    goes through a mini planning, analysis, design and implementation. The programs
    that need modification are identified and programmers change or repair those programs.
    After several years of use, the system usually becomes obsolete. At this point
    a major revision of the application is done. Thus the cycle repeats itself.


    # 1.1.2 Definitions


    +   **Definition 1.1: system analyst**nComputer professional in charge of creating
    applications.


    +   **Definition 1.2: applications**nAn information system or collection of programs
    that handles a major task.


    +   **Definition 1.3: life cycle**

    Systems Development Life Cycle: Planning - Analysis - Design - Implementation
    - Maintenance'
