    # 11.4.2 Other Uses of a Compound Statement


    A compound statement is a unit of coding of zero or more statements. It is also
    known as a block. The compound statement consist of statements to become one entry.
    You used a compound statement in your first program when you formed the body of
    the function main. All C++ functions contain a compound statement as the function
    body.


    A compound statement consists of an opening brace, optional declarations, definitions,
    and statements, followed by a closing brace. Although all three are optional,
    one should be present.\⁶


    # 11.4.3 Definitions


    **Definition 11.6:** compound statement

    A unit of code consisting of zero or more statements.


    **Definition 11.7:** block

    Another name for a compound statement.


