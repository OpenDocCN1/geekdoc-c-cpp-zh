  md: '4. The **linker** opens the program object file and links it with the library
    object files as needed. Unless all linker items are resolved, the process stops
    and returns the user to the source code file in the text editor with an error
    message. If no problems encountered it saves the linked objects as an executable
    file.


    5. The IDE directs the operating system''s program called the **loader** to load
    the executable file into the computer''s memory and the Central Processing Unit
    (CPU) start processing the instructions. The user interacts with the program,
    entering his test data, he might discover that the outputs are not correct. These
    types of errors are called logic errors and would require him to return to the
    source code to change the algorithm.


    # 5.1.2 Resolving Errors


    Despite our best efforts at becoming perfect programmers, we will create errors.
    Solving these errors is known as **debugging** your program. The three types of
    errors in the order that they occur are:


    +   1. Compiler

    2. Linker

    3. Logic


    There are two types of compiler errors; pre-processor (1st step) and conversion
    (2nd step). A review of Figure 1 shows the four arrows returning to the source
    code so that the programmer can correct the mistake.


    During the conversion (2nd step) the compiler might give a **warning** message
    which in some cases may not be a problem to worry about. For example: Data type
    demotion may be exactly what you want your program to do, but most compilers give
    a warning message. Warnings don''t stop the compiling process as their name implies,
