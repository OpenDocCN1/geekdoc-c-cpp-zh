    \ adds up to:\";\n  cout << (age_user + age_friend);\n  cout << \"nDo do you want\
    \ to do it? or n \\;\n  cin >> loop_response;\n}\nwhile (loop_response == 'y');\n\
    ```\n\nThe three attributes of a test after loop are present. The action part\
    \ consists of the 6 lines that prompt for data and then displays the total of\
    \ the two ages. The update of the flag is the displaying the question and getting\
