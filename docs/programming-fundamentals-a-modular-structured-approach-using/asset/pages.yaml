  md: '# Chapter 18


    # 18. Introduction to Arrays


    # 18.1 Array Data Type*


    # 18.1.1 Overview


    An array is a sequenced collection of elements of the same data type with a single
    identifier name. As such, the array data type belongs to the "Complex" category
    of data types. Arrays can have multiple axes (more than one axis). Each axis is
    a dimension. Thus a single dimension array is also known as a list. A two dimension
    array is commonly known as a table (a spreadsheet like Excel is a two dimension
    array). In real life there are occasions to have data organized into multidimensional
    arrays. We have a theater ticket with section, row and seat (three dimensions).
    This module will only cover the single dimension array. Most simple arrays are
    visualized vertically and are often called a list.


    Most programmers are familiar with a special type of array called string. Strings
    are basically a single dimension array of characters. Unlike other dimension arrays,
    we usually envision a string as a horizontal string of characters and not vertically
    as a list. In C++, the string data type is a length-controlled array and is a
    predefined class.


    We refer to the individual values as members (or elements) of the array. Programming
    languages implement the details of arrays differently. Because there is only one
    identifier assigned to the array, we have operators that allow us to reference
    or access the members of the array. The operator commonly associated with referencing
    arrays is the index operator. It is important to learn how to define an array
    and initialize its members. Additionally, the sizeof operator is often used to
    calculate the number of members in an array.


    # 18.1.2 Defining an Array in C++


    Example:


    ```

    int ages[5] = {49,48,26,19,16};

    ```


    This is the defining of storage space. The square brackets [ left and right ]
    are used to create the array with five integer values and the identifier name
    of age. The assignment with braces (that is a block) establishes the initial values
    assigned to the members of the array. Note the use of the sequence or comma operator.
    We have done it with:


    ```

    int ages[] = {49,48,26,19,16};

    ```


    By leaving out the five and initial values assigned, the compiler will know to
    create the array with five storage because because there are five values listed.
    This is preferred because we can easily add members to remove members from the
    array by changing the items inside of the braces. We could have also done this:


