  md: '# 5.2.2 Standard I/O within C++


    The developers of the C++ programming language decided to provide some of the
    technical code needed to interact with the operating system and the I/O devices.
    In the following example the include directive inserts a file that contains code
    from the **Input-Output Stream**. This file contains necessary code to use **cout**
    and **cin** for sending data to the monitor or getting data from the keyboard.

    #include <iostream>


    You should think of **cout** and **cin** as being locations that you can send
    to or receive data from; similar in concept to any other storage location within
    the data area of our program. The C++ programming language has two operators to
    use in conjunction with I/O devices.


    | Action | C++ operator symbol | Used with |

    | insertion operator (write) | << (a pair of less symbols) | cout |

    | extraction operator (read) | >> (a pair of greater symbols) | cin |


    Table 5.1


    Consider the following:


    Example 5.1: Insertion and Extraction


    ```

    int age; // variable set up

    then later in our program

    cout << "nEnter the age of the first person -->: ";

    cin >> age;

    ```


    Using the cout programmer displays (or inserts) a prompting message on the monitor
    for the user to see. Using the cin types an integer value and hits enter the computer
    extracts the value from the keyboard and stores it into the variable named age.
    Within the computer all data are stored as numbers and thus part of the technical
    code provided by the developers of the C++ programming language is that **Input-Output
    Stream** library converts data from numbers to symbols we use by seeing them as
    human view. For example: If the user entered the digits 57 and hit the enter -
    the extraction operator would convert 57 into a binary number and move the number
    into the integer storage place.


    The cout standard output device does not format the output into a Graphical User
    Interface (GUI) where you have to use a mouse. A modern operating system GUI opens
    a black screen output box that would be similar to how the monitor was used when
    first developed in the 1960s. The default of how cout is normally implemented
    by most compilers.

    The output has a unique item mentioning. At the very front of the message is a
    backslash followed by the letter n. They do not get printed on the monitor. It
    is a special code (called a printer **escape code**) telling the printer to go
    to a new line. Printer! I thought we were using a monitor? But are the code is
    a left over from the early days of printer output. The backslash tells the printer
    or monitor that the next line is a command. The letter n is used for telling the
    printer or monitor to go to the front of a new line.


