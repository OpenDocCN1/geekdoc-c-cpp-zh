  md: '# CHAPTER 1. 1. INTRODUCTION TO PROGRAMMING


    # 1.3 Modularization and C++ Program Layout⁶


    # 1.3.1 Concept of Modularization


    One of the most important concepts of programming is the ability to group some
    lines of code into a unit that can be included in our program. The original wording
    for this was a sub-program. Other names include: macro, sub-routine, procedure,
    module and function. We are going to use the term **function** for what they are
    called in the two predominant programming languages of today: C++ and Java. Functions
    are important because they allow us to take large programs and divide them into
    smaller manageable pieces. Because the function is a smaller piece of the overall
    program, we can concentrate on what we want to do and test to make sure it works
    properly. Generally functions fall into two categories:


    +   1. **Program Control** - Functions used to simply divide and control the program.
    These functions are unique to the program written. Other programs may use similar
    functions even functions with the same name, but the content of the functions
    are almost very different.

    2. **Specific Task** - Functions designed to be used with several programs. These
    functions perform a specific task thus thus usable in many different programs
    because the other programs also need to do the specific task. Specific tasks are
    sometimes referred to as building blocks. Because they are already coded and tested,
    we can use them with confidence to more efficiently write a large program.


    The main program must establish the existence of functions used in that program.
    Depending on the programming language, there is a formal way to:


    +   1. define a function (it''s **definition** or the code it will execute)

    2. **call** a function

    3. declare a function (a **prototype** is a declaration to a compiler)


    Program controls normally do not communicate information to each other but can
    use a common area for variable storage. Specific Task functions are constructed
    so that data can be communicated between the calling program piece and the function
    being called. This ability to communicate data allows us to use a specific task
    function that may be used in many programs. The rules for how the data is communicated
    in and out of a function vary greatly by programming language, but the concept
    is the same. The data items passed (or communicated) are called parameters. Thus
    the four communication methods include:


    +   1. no communication in no communication out

    2. some communication in no communication out

    3. some communication in some communication out

    4. no communication in with some communication out


