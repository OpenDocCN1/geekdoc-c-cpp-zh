    The first thing you should note is that the C++ programming language does not
    formally have a case control structure. It does a switch control structure but
    it acts differently than the traditional case control structure. We use a break
    (which is a branching control structure) with the switch to make it act like the
    traditional case structure. This is one of the few allowable ways to use the switch
    with break within the C++ programming language to simulate the traditional case
    structure. All other uses of the switch or break are to be avoided if you want
    to stay within the bounds of good structured programming techniques.


    The value in the age is compared to the first "case" (note: case is one of the
    C++ reserved words) which is the value 18 (also called the listed value) using
    an equality comparison or is "equal to 18". If it is true, the cout is executed
    which displays "You can vote." and the next line of code (the break) is done which
    jumps us to the end of the control structure). If it is false, it moves to the
    next case for comparison.


    Most programming languages, including C++, require the listed values for the case
    control structure be of the integer data types. This basically means either an
    integer or character data type. Consider this example that uses character data
    (choice is a character variable):


    # Example 12.5: C++ source code - case structure with characters


    ```

    switch (choice)

    {

    case ''A'': cout << "\nYou are an A student.";

    break;

    case ''B'': cout << "\nYou are a B student.";

    break;

    case ''C'': cout << "\nYou are a C student.";

    break;

    default: cout << "\nMaybe you should study harder.";

    }

    ```


