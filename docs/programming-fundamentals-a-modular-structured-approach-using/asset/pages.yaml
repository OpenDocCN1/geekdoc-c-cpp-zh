  md: '# CHAPTER 16. 16. STRING CLASS, UNARY POSITIVE AND NEGATIVE


    # 16.2.2.3 Possible Confusion


    Do confuse the unary negative operator with decrement. Decrement changes the value
    in the variable and thus is an Lvalue count. Unary negative does not change the
    value of a variable, but uses it in an R context. It fetches the value and negates
    that value. The original value in the variable does not change.


    Because there is no changing of the value associated with the identifier name,
    the identifier name represent a variable or named constant.


