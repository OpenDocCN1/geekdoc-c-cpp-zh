  md: 'In this example the integer value 55 is converted to a floating-point value
    (most likely double) of 55.0. It was promoted.


    # Example 3.6: Implicit Demotion


    ```

    int money;      // variable set up

    then later in the program

    money = 23.16;

    ```


    In this example the variable money is an integer. We are trying to move a floating-point
    value 23.16 into an integer storage location. This is demotion and the floating-point
    value usually gets truncated to 23.


    # 3.7. Promotion


    Promotion is never a problem because the lower data type (smaller range of allowable
    values) is sub set of the higher data type. Promotion occurs with three of the
    standard data types: character, integer and floating-point. The allowable values
    (or domains) progress from one to another. It is that the character type is a
    sub set of integer values and integer are a sub set of floating-point values;
    and within the floating-point values: float values are a sub set of double. Even
    though character data represent the alphabetic letters, numeral digits (0 to 9)
    and symbols ($, comma etc.), their bit pattern also represent integer values from
    0 to 255. This progression allows us to promote them out the chain from integer
    to float to double.


    # 3.4 Demotion


    Demotion represents a problem with truncation or unpredictable results often occurring.
    How do you fit an integer value of 456 into a character value? How do you fit
    the floating-point value of 45656.453 into an integer? Most compilers give a warning
    if it detects demotion happening. A compiler warning does not stop the compilation
    process. It warns the programmer to check if the demotion is reasonable.


    If I calculate the number of cans to buy based on the number of people I am serving
    (say 8) and the servings per can (say 2.3), I would need 18.4 cans. I would want
    to demote the 18.4 into an integer. I would truncate the 18.4 to 18 and believe
    the value 18 within the domain of an integer data type, it is demoted with the
    truncation side effect.


    If tried demoting a double that contained the number of stars in the Milky Galaxy
    into an integer, I might have got an unpredictable result (assuming the number
    of stars is larger than allowable values within the domain).


    # 3.7.5 Explicit Type Conversion


    Most languages have a method for the programmer to change or cast a value from
    one data type to another; called explicit type conversion. Within C++ the cast
    operator is a unary operator; it has only one operand and it is to the right of
    the operator. The operator is a of parentheses surrounding the new data type.


    # Example 3.7: Explicit Demotion with Truncation


    ```

    (int) 4.234

    ```


    This expression would evaluate to: 4.'
