    operator &. The address of a memory location is called a pointer.^6 The **pointer
    data type** allows us to designate a variable to hold an address or a pointer.
    The connect of an address and a pointer are one in the same. A pointer points
    to the location in memory because the value of a pointer is the address the data
    item resides in. Given an integer variable named:


