  md: '# Preface''


    # About this Textbook/Collection


    # Programming Fundamentals – A Modular Structured Approach using C++


    Programming Fundamentals – A Modular Structured Approach using C++ is written
    by Kenneth Leroy Busbee, a faculty member at Houston Community College in Houston,
    Texas. The materials used in this textbook/collection were developed by the author
    and others as independent modules for publication within the Connexions environment.
    Programming fundamentals are often divided into three college courses: Modular/Structured,
    Object Oriented and Data Structures. This textbook/collection covers the first
    of those three courses.


    # Connexions Learning Modules


    The learning modules of this textbook/collection will find them as standalone
    modules. Students using a collection of modules as a textbook will usually view
    it contents by reading the modules sequentially as presented by the author.

    However, the majority of these modules find them as a result of an Internet search.
    The Connexions Project allows the author of a module to create web links to other
    Connexions and Internet locations. These links are shown when viewing materials
    on-line and are categorized into three types: Prerequisite and Supplemental. The
    importance of each link is numbered from 1 to 3 by the author. When viewing the
    module each link shows a strongly related link. As the yellow decreases the importance
    decreases. All yellow means it is a strongly related link.

    Students using this collection for college course should note that all of the
    Prerequisite links within the modules will be modules that student have already
    read and most of the Supplemental links will be modules that the student read
    shortly. Thus, students should use Prerequisite links for review needed and not
    be concerned all of the Supplemental links at the first reading of this textbook/collection.


    # Conceptual Approach


    The learning modules of this textbook/collection were, for the most part, written
    without consideration of a specific programming language. In many cases the C++
    language is discussed as part of the explanation of the concept. The examples
    used for C++ are exactly the same for the Java programming language. However,
    some modules were written specifically for the C++ programming language. This
    could not be avoided as the C++ language is used in conjunction with this textbook/collection
    by the author in teaching college courses.


    > ¹This content is available online at <http://cnx.org/content/m19049/1.16/>.'
