  md: 'cout << "The size of an integer is: " << sizeof (int);

    The compiler would determine the byte size of an integer on the specific machine
    and in essence replaces the sizeof operator with a value. Integers are usually
    4 bytes long, thus the line of code would be changed to:


    cout << "The size of an integer is: " << 4;

    If you place an identifier name that represents a data storage area (variable
    or memory constant), it looks at the definition for the identifier name. NOTE:
    the parentheses are not needed and often not included for an identifier name.


    Example 9.1: sizeof with a Variable


    ```

    double money; // variable set up with initialization

    then later on in the program

    cout << "The size of money is: " << sizeof money;

    ```


    The compiler would determine the byte size of money by looking at the definition
    where it indicates that the data type is. The double data type on the specific
    machine (usually 8 bytes) would replace the code and it would become:


    ```

    cout << "The size of money is: " << 8;

    ```


