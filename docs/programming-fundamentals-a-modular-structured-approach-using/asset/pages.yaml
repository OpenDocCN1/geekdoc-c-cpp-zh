    # 9.2 Sizeof Operator³


    # 9.2.1 Overview


    Every item, constants and variables, not only a data type, but the data types
    determine how many bytes the item will use in the memory of the computer. The
    size of each data type varies with the compiler being used and the computer. This
    effect is known as **machine dependent**. Additionally, there have been some changes
    upgrades to the language. In "C" the int type was allocated 2 bytes of memory
    storage on an Intel compatible central processing unit (cpu) machine. In "C++"
    an int is allocated 4 bytes.


    There is an operator named "sizeof (...)" that is a unary operator, that has only
    one operand. The operand is to the right of the operator and is placed within
    the parentheses if it is a data type. The operand may be any type (including those
    typedef). If an identifier name does not need to go inside of the parentheses.
    It works for both variable and constant identifier names. This operator is unique
    in it does its calculation at compile time for global scoped items and at runtime
    for local scoped items. Examples.


