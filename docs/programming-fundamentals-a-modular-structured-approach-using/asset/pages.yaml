  md: '# CHAPTER 26. APPENDIX


    Often students are encouraged to join study groups to help discuss the course
    materials improving the learning process. These authorized and sometimes directed
    activities are not collusion.


    The following discussion is to help the student understand collusion (unauthorized
    collaboration) with specific reference to courses that use computers. This is
    not an inclusive list, but will cover the common situations that faculty have
    encountered over the years. Unless your specific professor informs you differently,
    you are to assume that the following items discussed are collusion.


    # 26.5.3 Type it Yourself


    Lab assignments are to be your own personal typing efforts. That is to type them
    or make the modifications yourself to the files (documents, spreadsheets, databases,
    programming source code, etc.) If your course is a programming project, you are
    to run the source code on your compiler, making corrections as needed to complete
    the lab assignment. If the directions for an assignment include starting a new
    file then don''t use an existing file and modify the assignment. Unless specifically
    authorized by your professor, students should not complete course work as a team
    or group and share the final result.


    Students have said that they worked as a team or group and that all he participated
    and learned the materials. Don''t try this excuse because professors don''t buy
    it. Here is the problem: Part of the learning process is in you doing it. Example:
    I asked two students to make pancakes (one from each) for my breakfast. The professor
    really does not want to eat two plates of pancakes (or 50 to 100 plates of pancakes,
    depending on how many students they are teaching), but part of your directed learning
    activity for the course is to demonstrate that you can make pancakes (not watch
    others make pancakes or participate as a group to make pancakes).


    # 26.5.4 Control Access to Your Files


    Controlling the files you create (or are directed to modify) means that others
    will not have access to copy your work. Don''t share your work files.


    Students have said that they shared the file so the other student could see the
    course assignment should. Don''t try this excuse because professors don''t buy
    it. Here is the problem: When you share the file your typing efforts (your original
    work or your efforts to create that original work). Back to our pancake example:
    "I only gave the other student a plate of pancakes, so he could see what the end
    product should." All the other student adds some blue berries and whip turns turns
    his name at into his work - you will be held in the charge of academic dishonesty.
    Unless specifically authorized by your professor, don''t share the files that
    you create or modify with another student - ever, now and in the future.


    Here are two suggestions for controlling your use


    When using a course software product or learning system, such as Blackboard Vista,
    don''t allow another person your work. With the password, you will have access
    to your submitted assignments including the files that you created. Don''t leave
    your files on a machine where others may have access to them. If multiple students
    are using the same machine (often happens with students living in the same household/husband/wife,
    siblings or roommates) or in an on-campus course where many students will have
    access to the machine - store your files on a flash drive. Physically control
    who gets access to your flash drive.


    # 26.5.5 Ask for a Clarification of the Collaboration


    If you have any question about an activity that might be construed as unauthorized
    collaboration, ask your professor. They will provide clarification and direction
    to you about the activity.


    Students have said that they did not understand or think that it was unauthorized
    collaboration. Don''t try this excuse because professors don''t buy it. Here is
    the problem: We can''t, and won''t list every minor'
  merge: -1
  pgno: 297
- img_proc: true
  md: '291


    way in which students collude. The burden is for you to ask for any clarification
    for the specific course from your professor. Don''t assume that what another instructor
    allowed in another course will be allowed by this professor in this course.


    # 26.5.6 Detecting Academic Dishonesty


    Professors werent born yesterday. The faculty members of most institutions have
    individually years and collectively thousands of years at understanding academic
    dishonesty. Checking on tests, plagiarism and collusion are not new to us. We
    share our expertise with each other detecting academic dishonesty. Additionally,
    the years of technical experience of professors who teach using computers in labs
    is often daunting.


    Students have said that they did not think they could be detected or that academic
    dishonesty could not be proved. Don''t try this approach because professors believe
    that they are slightly smarter. Actually, we know we are a lot smarter. It amuses
    us that student dont realize that professors are a formidable force. Many gamble
    that you can beat us at the “Academic Dishonesty Game”. Please don''t take this
    as a challenge and do it as an excuse to see if you can be academically dishonest
    and not get caught. We are warning you, not challenging you.


    # 26.5.7 Serious Consequences


    The consequences will vary from instructor to instructor and from institution
    to institution. They range from a simple slap on the hand (don''t do it again)
    to complete expulsion from the institution (expelled from all of your courses).
    Because the bond of trust is broken, many instructors will simply expel you from
    the course you are taking. As an example: Within the BCIS1405 course at Houston
    Community College, we expelled 8 students (along with giving them grade of “F”)
    from Distance Educations sections during the Spring 2006 term for Academic Dishonesty.


    Be ready for what ever the consequences your instructor will deliver if you are
    dishonest.


    # 26.5.8 Summary


    +   - The ethics of academic honesty; there is a bond of trust that whatever the
    student does in relationship to the evaluation process are their own work and
    efforts.


    +   - Collusion is the unauthorized collaboration of students on work submitted
    for evaluation.


    +   - First directive: Type if yourself


    +   - Second directive: Don''t share your files


    +   - Seek clarification from your professor if you have any doubt that the collaborative
    activity might be considered collusion.


    +   - Professors are very capable of detecting academic dishonesty.


    +   - There are usually consequences to your dishonest behavior.'
