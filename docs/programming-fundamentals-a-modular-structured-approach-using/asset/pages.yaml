  md: 'rescue. Basically the way to get this immense computer power was implement
    parallel processing techniques. From the late 1970s and again early 1980s the
    scientists saw the need to explore the parallel processing paradigm more fully
    and the birth of High Performance national and international conferences started
    during the 1980s were able to further the cause of High Performance Computing.
    For example in November 2008 the "SC08" supercomputing conference celebrated their
    20th anniversary.


    The predicting of the weather is a good example for the need of High Performance
    Computing. Using the fastest central processing unit might take a year to predict
    tomorrow''s weather. The information would be correct but 365 days late. Using
    parallel processing and a powerful "high performance computer", we might be able
    to predict tomorrow''s weather in 6 hours. Not only correct, but to be useful.


    # 24.2.2.4 Measuring Computing Power


    Most people are familiar with the gertz h (billions of instructions per second)
    to describe how fast a single CPU is running. Microcomputers of today are around
    3 GHz or 3 billion instructions a second. Although billions sound fast, many of
    these instructions are simple operations.


    Supercomputing uses a measurement involving floating point calculations as the
    benchmark for comparing power. "In computing, FLOPS (flops or flop/s) is an acronym
    Floating point Operations Per Second. On May 25, 2008, an American supercomputer
    built by IBM, named "Roadrunner", reached the milestone of one petflop by processing
    more than 1.026 quadrillion calculations per second." (FLOPS from Wikipedia) For
    those of us not familiar


    # Example 24.5: Getting a Sense of Power


    | 3 billion or 3 GHz | 3,000,000,000 |

    | quadrillion or 1 petaflop | 1,000,000,000,000 |


    You should also realize that your personal computer is not 6 gigaflop worth of
    calculations, something slower when using the FLOPS measurement.


    # 24.2.2.5 High Performance Computing Made Personal


    It took several years (about 30) to get computers to a personal level (1951 to
    1981). It took about twenty years (1980''s to 2009) to get multi-processor computers
    to the personal level. Currently available to the general public are computers
    with "dual core" and "quad core". In the near future, micro computers will have
    8 to 16 cores. People ask, "Why would I need that much computer power?" There
    are dozens of applications, but I can''t think to talk to my computer. Your mouse,
    your keyboard, or your touch pad - talk to it.


    Again, one short thing is that most programming efforts have been teaching and
    learning the sequential processing of thinking or solving a problem. Educators
    will need to teach and programmers will need to develop skills in programming
    parallel concepts and algorithms.


    # 24.2.2.6 Summary


    We have bounced back and forth between sequential and parallel concepts. But with
    the birth of computers the parallel concepts were set to the side and the computer
    industry implemented a single processor approach (sequential). We explained the
    limitations of sequential processing and the need for computing power. Thus, the
    birth of High Performance Computing. Parallel processing computers are migrating
    into our homes. With that migration, there is a great need to educate the existing
    generation and develop the next generation of scientists and programmers to be
    able to take advantage of High Performance Computing.'
