  md: '# Chapter 11


    # 11. Two Way Selection


    # 11.1 If Then Else¹


    # 11.1.1.1 Traditional Two Way Selection


    We are going to introduce the control structure from the selection category that
    is available in high level language. It is called the **if else** structure. Asking
    a question that has a true or false answer controls the if then else structure.
    It looks like this:


    ```

    if the answer to the question true

    then do this

    else because it''s false

    do this

    ```


    In many languages the value (called a **test expression**) is a **Boolean expression**.
    The Boolean has two values – true and false. Let''s rewrite the structure to consider
    this:


    ```

    if expression is true

    then do this

    else because it''s false

    do this

    ```


    Some languages use reserved words of: "if", "then" and "else". Many eliminate
    the "then". Additionally the "do this" can be tied to true and false. You might
    see it as:


    ```

    if expression is true

    action true

    else

    action false

    ```


    And most languages infer the "is true" you might see it as:


    > ¹This content is available online at <http://cnx.org/content/m19679/1.4/>.'
  merge: -1
