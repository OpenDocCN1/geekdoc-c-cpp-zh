  md: '# Chapter 24


    # 24. OOP & HPC


    # 24.1 Object Oriented Programming


    # 24.1.1 Discussion


    "In procedural programming, the programmer constructs procedures (or functions,
    as they are called in C++). The procedures are collections of programming statements
    that commonly share variables with other procedures. Procedural programming is
    centered on the procedure or function."2 For decades (1950s to the 1980s) most
    programming was taught as procedural programming. Coupled with the imposition
    of using standardized control structures in the late 1960s, we have learned what
    is typically called modular structured programming.


    Another, valid approach to object-oriented programming or OOP. The first languages
    to introduce OOP to the masses were C and Java. After their introduction, there
    were American National Standards Institute (ANSI) standards established for those
    languages. Today, C++ and Java are widely used.


    > "The primary differences between the two approaches are their use of data. In
    a procedural program, the design centers around the rules or procedures for processing
    the data. The data, implemented as functions in C++, are the focus of the design.
    The data objects are passed as parameters. The key question is how the functions
    receive the data for either storage or further processing. Procedural programming
    has been the mainstay of computer science since its beginning and is still used
    today."3


    In an object-oriented program, abbreviated OOP, the design centers around objects
    that contain (encapsulate) the data and the necessary functions to process the
    data. In OOP, the objects own the functions that process the data.\4


    > "Object-oriented programming... is centered on the object. An object is a programming
    element that contains data and the procedures that operate on the data. The objects
    contain, within themselves, both information and the ability to manipulate the
    information."5


    To help clarify the picture, the C++ programming language can be used (and is)
    to write either a procedural (modular structured) or an object-oriented program.
    Some items used by writing procedural programs in C++ are in fact objects. Examples
    include:


