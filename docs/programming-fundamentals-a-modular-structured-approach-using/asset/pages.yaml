  md: '# Chapter 16


    # 16. String Class, Unary Positive and Negative


    # 16.1 String Class Discussion within C++


    # 16.1.1 General Discussion


    In most programming languages a string is typically a string of characters (string
    them along a series). The rules for handling strings vary from language to language.
    Technically, there is no string data type in the C++ programming language. However,
    the concept of a string data type makes it easy to handle strings of character
    data. Associated with object oriented programming the string class has been added
    to C++ as a standard part of the programming.


    Most data is more complex than just one character, integer, etc. Programming languages
    develop other methods to represent and store data that are more complex. A complex
    data type of array is first students encounter. An array is a sequenced collection
    of elements of the same data type with a single identifier name. This definition
    perfectly describes our data type concept. The simplest array is called a one-dimensional
    array; also known as a list because we usually list the members or elements vertically.
    Strings are viewed as a one-dimensional array as visualize listed horizontally.
    Strings are an array of character.


    In the "C++" programming language all strings are handled as array of characters
    that end in an ASCII null character (the value 0 or the first character in the
    ASCII character code set). This changed with the implementation of the string
    class within C++ where strings are stored as a length controlled with a maximum
    length of 255 characters. This string class implementation also allowed programmers
    to use the reserved word string as if it were a data type. Commonly used operators
    and some alternatives for the string class are summarized in the following table:


    | C++ Operator | Operator Name | String Class Implementation |

    | --- | --- | --- |

    | = | assignment | Same as for standard data types |

    | <, >, <=, >=, ==, != | six relational | Same as for standard data types |


    > This content is available online at <http://cnx.org/content/m20792/1.6/>.'
