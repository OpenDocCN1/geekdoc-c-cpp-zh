    # 19.2.3 Definitions


    # Definition 19.9: array function


    A user defined specific task function designed to process an array.


    # 19.3 Loading an Array from a File^6


    # 19.3.1 Conceptual Overview


    Loading an array from a file presents an interesting dilemma. The problem resolves
    around how many elements you should plan for in the array. Let''s say 100, but
    what if the file has fewer or more than 100 values. How can the program handle
    it correctly?

    The solution involves some simple steps:


    +   1. We can read the file once to get the element count. Thus, we will know
    how many members (elements) we will need.

    2. We can create an array using dynamic memory allocation by defining the array
    within a function so it has local scope. Local variable variables are created
    during the execution of the program and use the stack location of instance area.
    If you define the array outside of a function (global scope also known as static
    memory allocation) it stores it in the data area and know how many members will
    be on the input file when you write the source code. Since defining an array with
    global scope will not work, we can then determine exactly how many members we
    need for the array by having our program count them (step 1) so that we can then
    define the array with local scope to the precise size needed.

    3. We can then load the array by reading the file a second time and storing the
    values read into the array just created.


    This method is demonstrated in the demo file provided, then you need to study
    this material in conjunction with the demo program.


    > ^See the file at <http://cnx.org/content/m21624/latest/Demo_Array_Display_Function.cpp>

    6This content is available online at <http://cnx.org/content/m21625/1.2/>.'
