    # # 19. File I/O and Array Functions


    # ## 19.1 File Input and Output


    # ### 19.1.1 Overview of File I/O in C++


    We need to understand how to open, read, write and close text files. The following
    File Input/Output terms

    are explained:


    +   **Text File** - A file consisting of characters from the ASCII character set.
    Text files (also known as ASCII files) contain character data. When we create
    a text file we usually think of it consisting of a series of lines. On each line
    are several characters (including spaces, punctuation, etc.) and we generally
    end the new line with a return (a character within the ASCII character set). The
    return is also returned in C+: most likely already familiar with the escape code
    `\n` which is used in C++.

    A text file can be edited using any text editor (like Notepad) or word processing
    programs (Microsoft Word). When using a word processor you must manually specify
    the output file as (.txt) when saving it. Most **source code** files are ASCII
    text files with a unique file extension: such as C++ using .cpp, Pascal using,
    Cobol using, etc. Thus, most compiler/Integrated Development Software packages
    (like the Blood Dev-C++ compiler) can be used to create ASCII text files.

    **Filename** - The name and extension. Most operating systems have restrictions
    on which characters be used in filenames. Example for MS-DOS and Windows: Lab_05

    Because some operating systems do not allow spaces, we suggest that you use the
    **underscore** where needed in a filename.

    **Filespec** - The location of a file along its extension. It is short for specification.
    Most operating systems have a set of rules on how to specify the drive and directory
    (or path through several directories) levels with the filename. Example for MS-DOS
    and Windows: C:\myfiles\c_1436/Lab_05

    Because some operating systems do not allow spaces, we suggest that you use the
    **underscore** where needed when creating folders or sub-directories.

    **Output** - Your program needs the operating system to let it access to an existing
    file or to open a new file. In C++ this is accomplished by including the header
    file: `<fstream>` File Input/Output is handled in C++ by a pre-defined class of
    data objects, similar to the string data type is handled. This class of objects
    has both data type names and functions built to specifically opening and closing
    a file.Within your program you can create a local storage variable with the data
    type of fstream like:


    ```

    fstream inData;

    ```


    > ¹This content is available online at <http://cnx.org/content/m21623/1/>.'
