    # 23.2 Conditional Compilation³


    # 23.2.1 Overview


    As you proceed in your programming career, the problems/tasks that need solving
    become more complex. The documentation of the algorithm in pseudo code (or some
    other method) will still need to be converted into a programming solution. Inevitably,
    when writing source code will be made. When learning the syntax of a new programming
    language, programmers automatically think in their native language, and make mistakes
    that are sometimes hard to detect.


    The concept of using a flag to either activate or remain certain lines of code
    designed soley to help with the debugging of a program has existed since the beginning
    of modern computer programming (1950s). One of the debugging tools available in
    C++ is conditional compilation. For our code we have defined a constant like:


    ```

    #define DEBUG 1

    ```


    Then using another compiler directive, the #if and #endif, we have the compiler
    during the preprocessor either include or not include one or more lines of code.


    ```

    #if DEBUG

    cout << "\n***** Hi mom!";

    #endif

    ```


    Of saying, “Hi mom!” is not very useful for debugging your code. However, you
    can test data with conditional compilation. A series of input values and a series
    of output predictors can be placed in the program. You can then use the debug
    feature or turn off with your debugging flag.

    You should consider the demonstration program in conjunction with this method.


    > ²See the file at <http://cnx.org/content/m22203/latest/Demo_Multidimensional_Arrays.cpp>

    ³This content is available online at <http://cnx.org/content/m22204/1.5/>.'
