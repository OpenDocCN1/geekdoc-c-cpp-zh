  md: "# Chapter 17\n\n# 17. Conditional Operator and Recursion\n\n# 17.1 Conditional\
    \ Operator†\n\nThe conditional operator is unique in that it has three operands\
    \ separated by two unconnected operator symbols. All other C++ operators are either\
    \ unary (one operator and one operand) or binary (one operator and two operands).\
    \ On the \"Abbreviated Precedence Chart for C++ Operators\" the conditional operator\
    \ has the word \"trinary\" in the comments column. This prefix \"tri\" means three,\
    \ three operands.\n\n| C++ Operator | Meaning | Comments |\n| ? | conditional\
    \ | ternary – three operands with two operators |\n\nTable 17.1\n\nAs an operator\
    \ it produces a value for the expression. An easy way to explain the conditional\
    \ operator is to convert an \"if then else\" control structure to an expression\
    \ using the conditional operator.\n\nExample 17.1: if then else\n\n```\nif (age\
    \ > 17)\n{\n    cout << \"You can vote.\";\n}else\n{\n    cout << \"You can't\
    \ vote.\";\n}\n```\n\nExample 17.2: conditional = option 1\n\nage > 17 ? cout\
    \ << \"You can vote.\" : cout << \"You can't vote.\";\n\n> This content is available\
    \ online at <http://cnx.org/content/m20811/1.7/>."
