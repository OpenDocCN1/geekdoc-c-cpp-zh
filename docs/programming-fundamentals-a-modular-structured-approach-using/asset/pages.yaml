    This program has two functions, one from each of our categories. The technical
    layout of functions are the same, it our distinction creates the two categories
    based on how a function is being implemented.


    # 1.3.2.1 Control Function


    The main piece in C++ program is a special function with the identifier name of
    main. The special or uniqueness of main as a function that is where the program
    starts executing code and this is where it usually stops code. It is usually the
    first function defined in a program and appears after the area used for includes,
    other technical items, declaration of prototypes, the listing of global constants
    and variables and any other items generally needed by the program. The code to
    define the main function is provided; however, it is not prototyped or used like
    other functions within a program. In this simple example, there are no other program
    control functions.


    # 1.3.2 Specific Task Function


    We have the need to perform a specific task that might be used in many programs.
    In the ComTest.cpp source code we have such a task that is used to stop the execution
    of the code until the user hits the key. The functions name is: pause. This function
    is not communicating any information between the calling function and itself,
    thus with the use of the data type void.


    # Example 1.2: general layout of a function


    ```

    <return value data type> function identifier name(<data type> identifier name
    for input value>

    {

    lines of code;

    return <value>;

    }

    ```


    There is no semi-colon after the first function. Semi-colons are used at the end
    of a statement in C++, but not on the first line when defining a function. Functions
    have a set of braces {} used for identifying a group or block of statements or
    lines of code. There are normally several lines of code within a function. Lines
    of code containing the instructions end in a semi-colon. You can identify the
    definition of the pause function in the above example! The pause definition is
    after the main function. Not technically required the program lists all functions
    (program control or specific task) after the function main.


    Let''s identify the location where the pause function is called. The calling function
    is the main function and it towards the end of the function. The line looks like:

    pause();


    When you call a function you use its identifier name and a set of parentheses.
    You place any data items you are passing inside the parentheses, and in our example
    there are none. A semi-colon ends the statement'
