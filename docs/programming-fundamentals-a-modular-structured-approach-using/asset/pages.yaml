    # 3.7 Data Type Conversions


    # 3.7.1 Overview


    Changing a data type of a value is referred to as "type conversion". There are
    two ways to do this:


    +   1. Implicit – the change is implied

    2. Explicit – the change is explicitly done with the cast operator


    The value being changed may be:


    +   1. Promotion – going from a smaller domain to a larger domain

    2. Demotion – going from a larger domain to a smaller domain


    # 3.7.2 Implicit Type Conversion


    Automatic conversion of a value from one data type to another by a programming
    language, without the programmer specifically doing so, is called implicit conversion.
    It happens when ever a binary operator has two operands of different types. Depending
    on the operator, one of the operands is going to be converted to the data type
    of the other. It could be promoted or demoted depending on the operator.


