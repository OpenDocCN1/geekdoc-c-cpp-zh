  md: '# Chapter 10


    # # 10. Introduction to Structured Programming


    # ## 10.1 Structured Programming¹


    # ### 10.1.1 Introduction


    One of the most important concepts of programming is the ability to control a
    program so that different lines of code are executed or that some lines of code
    are executed many times. The mechanisms that allow us to control the flow of execution
    are called **control structures**. Flowcharting is a method of documenting (charting)
    the flow (or paths) that a program would execute. There are four main categories
    of control structures:


    +   - **Sequence** – Very boring. Simply do one instruction the next and the next.
    Just do them in a given sequence or order listed. Most lists of code are this.


    +   - **Selection** – This is when you select or choose between two or more flows.
    The choice is decided by asking some sort of question. The answer determines the
    path (or which lines of code) will be executed.


    +   - **Iteration** – Also known as repetition, it allows some code (one too many
    lines) to be executed (or repeated) several times. The code might not be executed
    at all (repeat zero times), executed a fixed number of times or executed indefinitely
    until some condition has been met. Also known as looping because the flowchart
    shows the looping back to repeat the task.


    +   - **Branching** – Another structure that allows the flow of execution to jump
    to a different part of the program. This category is widely used in modular structured
    programming.


    All high-level programming languages have control structures. All have the first
    three categories of control structures (sequence, selection, and iteration). Most
    have the **if else** structure (which belongs to the selection category) and the
    **while** structure (which belongs to the iteration category). After these two
    basic structures there are language variations.


    The concept of **structured programming** started in the late 1960s with an article
    by Eds Dijkstra. He proposed a “go to less” method of programming logic that eliminated
    the branching category of control structures. The topic was debated for about
    20 years. But ultimately – By the end of the 20th century nearly all scientists
    were convinced it is useful to learn and apply the concepts of structured programming.


    > ¹This content is available online at <http://cnx.org/content/m19628/1.7/>.


    > ²Structured programming from Wikipedia'
  merge: -1
  pgno: 130
