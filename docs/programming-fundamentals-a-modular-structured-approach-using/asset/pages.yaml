  md: '# Author Acknowledgements⁵


    I wish to acknowledge the many people who have helped me and have encouraged me
    in this project.


    +   1. Mr. Abass Alamneh, who is a fellow faculty member at Houston Community
    College. He has encouraged the use of Connectionous as an "open source" publishing
    concept. His comments on several modules have led directly to the improvement
    of the materials in this textbook/collection.

    2. The hundreds (most likely a thousand plus) students that I have taken programming
    courses that I have taught since 1984. The languages include: COBOL, main frame
    IBM assembly, Intel assembly, Pascal, "C" and "C++". They have often suggested
    that I write my own book because they thought I was explaining the subject matter
    better than the author of the textbook that we were using. Little did my students
    understand that directly or indirectly they aided in the improvement of the manner
    from which I started writing.

    3. To my future students and all those that will use this textbook/collection.
    They will provide suggestions for improvement as well as being the thousand eyes
    identifying the hard to find typos, etc.

    4. My wife, Carol, who supports me in all that I do. She has tolerated the many
    hours that I have spent in concentration on developing the modules that comprise
    this work. Without her support, this work would not have happened.


