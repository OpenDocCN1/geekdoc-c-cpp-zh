  md: '# Orientation and Syllabus⁶


    # Orientation


    # Textbook/Collection Layout


    The approach of this course will be to take the student through a progression
    of materials that will allow the student to develop the skills of programming.
    The basic unit of study is a Connexions module. Several modules are collected
    into a chapter. The chapters are divided into five groups.


    | Group Title | Chapters | Modules |

    | Pre-Chapter Items | N/A | 6 |

    | Foundation Topics | 1-5 | 27 |

    | Modular Programming | 6-9 | 17 |

    | Structured Programming | 10-16 | 30 |

    | Intermediate Topics | 17-21 | 17 |

    | Advanced Topics | 22-24 | 11 |

    | Review Materials | N/A | 5 |

    | Appendix | N/A | 7 |

    | Total Modules | N/A | 120 |


    Table 1


    Some professors using this textbook/collection might decide to eliminate certain
    modules or chapters. Some may eliminate the Advanced Topics group. Other professors
    may choose to add additional study materials. The advantage of this textbook/collection
    is that it may be adapted by professors to suit the needs of their students.


    # Chapter Layout


    Each chapter will usually flow from:


    +   - One or more Connexions modules built for independent delivery.

    - A Connexions Practice module built specifically for this textbook/collection.


    As you proceed with the Connexions modules that compose a chapter, you should:


    +   - Complete any tasks/demos that require downloading items.


    > ⁶This content is available online at <http://cnx.org/content/m19684/1.10/>.'
