    # 12.3.3 Good Structured Programming Methods


    Most text book authors confirm that good structured programming techniques and
    habits are more important than concentrating on the technical possibilities and
    capabilities of the language that you are using to learn programming skills. Remember,
    this module is concentrating on programming fundamentals and concepts and it uses
    the C++ programming language to build our initial programming skills. It is not
    created with the intent to cover the C++ programming language in detail, despite
    the fact that at times we have to cover C++ language mechanics.


    # 12.3.4 Definitions


    **Definition 12.5: case**


    A control structure that does multiselection.


    **Definition 12.6: switch**


    A control structure that can be made to act like a control structure.


    # 12.4 Branching Control Structures⁵


    # 12.4.1 Discussion


    The branching control structures allow the flow of execution to jump to a different
    part of the program. The three common branching control structures are: break,
    continue and goto. These are rarely used in modular programming with one exception.
    Exception is in relation to creating the case within the selection of control
    structures. There is one other branching control structure that is often not viewed
    as branching control structure. It is: return. Additionally, we will add to our
    list of branching items a pre-defined function commonly used in the C++ programming
    language of: exit that is part of the C standard library (cstlib). Some definitions:


    # 12.4.1 Definitions


    **Definition 12.7: branching control structures**


    Allow the flow of execution to jump to a different part of the program.


    **Definition 12.8: break**


    A control structure that terminates the existing structure.


    **Definition 12.9: continue**


    A control structure that causes a loop to stop its current iteration and begin
    the one.


    **Definition 12.10: goto**


    A control structure that causes the logic jump to a different place in the program.


    **Definition 12.11: return**


    A control structure that causes a function to jump back to the function it called.


    **Definition 12.12: exit**


    A pre-defined function used to prematurely stop a program and jump to the operating
    system.


    > ⁵This content is available online at <http://cnx.org/content/m19947/1.3/>.'
