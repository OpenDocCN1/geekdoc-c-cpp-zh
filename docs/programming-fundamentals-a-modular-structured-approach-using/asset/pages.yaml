    # 26.3 ASCII Character Set


    ASCII stands for Standard Code for Information Interchange (pronounced "ask-key").
    Computers can only understand numbers, so an ASCII code is a numerical representation
    of a character such as ''a'' or ''@'' or an action of sort. ASCII was developed
    a long time ago and now the non-printing characters are rarely used for their
    original purpose. The first 32 values (0 to 31) and the last value (127) are the
    non-printing characters.


    Several software products can be used to create an ASCII text file.


