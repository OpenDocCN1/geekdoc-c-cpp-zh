  md: "# CHAPTER 12. 12. MULTIWAY SELECTION\n\n![](img/3f11fdc2542c12fc98cf70f265c57440_169_0.png)\n\
    \nFigure 12.1\n\nThis flowchart is of the case control structure and is used for\
    \ multiway selection. The decision box holds the variable age. The logic of the\
    \ case is one of equality where the value in the variable age is compared to the\
    \ listed values in order from left to right. Thus, the value stored in age is\
