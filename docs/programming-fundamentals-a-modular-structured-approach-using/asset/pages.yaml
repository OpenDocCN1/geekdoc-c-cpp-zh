  md: '# Chapter 12


    # 12. Multiway Selection


    # 12.1 Nested If Then Else''


    # 12.1.1 Introduction to Mulitway Selection


    # 12.1.1.1 Nested Control Structures


    We are going to first introduce the concept of nested control structures. Nesting
    is a concept that places one item inside of another. Consider:


    ```

    if expression

    true action

    else

    false action

    ```


    This is the basic form of the if else control structure. Now consider:


    ```

    if age is less than 18

    you can''t vote

    if age is less than 16

    you can''t drive

    else

    you can drive

    else

    you can vote

    if age is less than 21

    you can''t drink

    else

    you can drink

    ```


    As you can see we simply included as part of the "true action" a statement and
    another if then control structure. We did the same (nested another if else) for
    the "false action". In our example we nested if then else control structures.
    Nesting could have an if then else inside a while loop. Thus, the concept of nesting
    allows the mixing of the different categories of control structures.


    ¹This content is available online at <http://cnx.org/content/m19951/1.6/>.'
