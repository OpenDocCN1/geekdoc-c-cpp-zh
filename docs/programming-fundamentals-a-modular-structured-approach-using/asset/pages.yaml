  md: "# CHAPTER 13. 13. TEST AFTER LOOPS\n\n+   - Test expression\n\nThe English\
    \ phrasing, \"You do the action while the expression is true\". This is looping\
    \ on the true. When the test expression is false, you stop the loop and go on\
    \ with the next item in the program. Notice, because this is a test after loop\
    \ the action will always happen at least once. It is called a test after loop\
    \ because the test comes after the action. It is also called a post-test loop,\
    \ meaning the test is post (or Latin) for the action and update.\n\n# 13.1.2 The\
    \ while Structure within C++\n\n# 13.1.2.1 Syntax\n\nThe syntax for the do while\
    \ control structure in the C++ programming language is:\n\n```\ndo {\n  statement;\n\
    \  statement;\n  statement;\n  statement; // This statement updates the flag;\n\
    }\nwhile (expression);\n```\n\n> NOTE: The test expression is within the parentheses,\
    \ but this is not a function call. The parentheses are part of the control structure.\
    \ Additionally, there is a semicolon in the parenthesis following the expression.\n\
    \n# 13.1.2.2 An Example\n\nExample 13.1: C++ source code: do while loop\n\n```\n\
    do {\n  cout << \"what is your age?\";\n  cin >> age_user;\n  cout << \"what is\
