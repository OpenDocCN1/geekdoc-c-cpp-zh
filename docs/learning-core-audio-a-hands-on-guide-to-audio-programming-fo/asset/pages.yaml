    # Example: Figuring Out Formats


    As you see, the Core Audio represents audio data isn''t as simple as saying "an
    MP3" or "an audio book." There''s a big difference between a file format and the
    audio data inside that file, or the data that describes audio data, which could
    involve separate descriptors: the AudioStreamBasicDescription needed for all audio
    streams, the magic cookie of certain compressed formats, and the AudioStreamPacketDescription
    needed for every packet of compressed format.


    A lot of what we use the various formats might seem arbitrary, Audio File provides
    services to tell you what can and can''t go into a given file. An interesting
    function kAudioFileGetGlobalInfo gives information about an individual file, but
    Core Audio''s handling of audio files in general. Look up this function in the
    documentation and follow the link to "Audio File Global Properties"; you''ll see
    a number of interesting-looking properties to inspect. In this example, you use
    a property kAudioFileGlobalInfo_AvailableStreamDescriptionsFormat to get Core
    Audio to spill the beans about what can and cannot get into your audio files.


    Specifically, here''s the documentation for kAudioFileGlobalInfo_AvailableStreamDescriptionsFormat
    promises to give you:


    An array of audio basic description structures, which contain all the formats
    for a particular file type and format ID.

