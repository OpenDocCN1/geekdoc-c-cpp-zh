- img_proc: true
  md: '# Core MIDI


    MIDI data. An electronic piano keyboard is a good example of a synthesizer. An
    example of a controller be a foot pedal or control surface, a device that does
    not emit any sound.


    +   - **Sequencer**: A sequencer performs playback (and recording) of MIDI events.
    Sequencers can be software (GarageBand) or dedicated hardware devices.


    +   - **Events**: A MIDI event, sometimes referred to as a message, is a variable-length
    collection of bytes that compose a MIDI command. Each event correlates to a musical
    action and can have additional attributes. Typical MIDI events are On Note, Off,
    Pitch Bend, and Aftertouch.


    +   - **Channel**: MIDI contains a total of 16 channels that events can travel.
    For example, channel 2 could carry information about a piano keyboard to receive
    on channel 2 in the sequencer, and channel 5 could carry information about a different
    instrument. Playing more than 16 simultaneous instruments requires the use of
    banks (multiple MIDI interfaces).


    The Core MIDI framework provides a single set of MIDI system services. It offers
    high-performance access to MIDI hardware devices from your application and abstractions
    for interacting with MIDI devices on a MIDI network.


    Core MIDI utilizes a MIDI server that handles all the MIDI communications and
    allows for all MIDI devices and endpoints to be shared system wide simultaneously
    among all applications. However, you do not automatically start receiving and
    transmitting by default; your application must opt in to the services you want
    from the MIDI server.


    # Core MIDI Architecture


    At the kernel level of the Core MIDI implementation is IOKit, where all the actual
    I/O happens over the transport in use (USB, FireWire, Serial, and so on). Above
    the kernel in user space is the Core MIDI server subprocess that loads MIDI devices
    and processes MIDI requests. At the topmost level is the Core MIDI framework that
    your application links against. This arrangement is shown in Figure 11.1. MIDI
    services for your applications are communicated with the Core MIDI server via
    Mach IPC.


    # Core MIDI Terminology


    In Core MIDI, a device is represented by three basic objects: MIDIDeviceRef, MIDIEntityRef,
    and MIDIEndpointRef. All are typedefed d to a parent, ObjectIDRef. These objects
    are layered together in a hierarchy so that devices contain entities, and entities
    contain endpoints. Figure 11.2 illustrates this hierarchy.'
