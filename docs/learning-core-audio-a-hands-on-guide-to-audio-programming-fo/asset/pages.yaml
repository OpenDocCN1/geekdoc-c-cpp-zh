  md: '# Positional Sound


    "And now for something completely different..."


    We’re not kidding. The OpenAL library, which is included with both Mac OS X and
    iOS, is a completely different audio framework from Core Audio’s pull-based world
    of audio units. It is different in part because it comes from a third party. It
    also solves different problems—namely, placing audio in a 3D sound field. Its
    primary purpose is to deliver audio for games, but you can use it as a general-purpose
    audio engine because of its interesting traits that you can bring to your own
    applications.


    In this chapter, you dive into the design and architecture of OpenAL and look
    at how it represents positional sound as a C API. After you’re introduced to its
    core concepts, you’ll build three sample applications to get a feel for coding
    with OpenAL. First, you’ll build a simple application to load sound into memory
    and fly it around the listener. In the second example, you’ll learn to work with
    files of any length, using OpenAL’s streaming APIs. You will also look at how
    to integrate Core Audio and OpenAL in the same program.


    # Sound in Space


    OpenAL was originally developed by a company called Loki Software to help port
    Windows games to Linux. However, the company went bust and the open-source community
    tended to favor the project until it was substantially taken over by sound Creative
    Technologies, a company that develops OpenAL with contribution from Apple and
    others. The specification, developer’s guide, and other documentation are hosted
    on Creative’s website:Visit http://openal.org/, and you will be redirected (currently
    to http://connect.creativables.com/openal/default.aspx).


    Because of its heritage as a technology for games, OpenAL has traits that are
    carefully useful for game development that differs from Core Audio’s audio professionals.
    In many ways, its API is deliberately similar to OpenGL, the popular 3D graphics
    library. The appeal is obvious: it is hugely advantageous to think of your audio
    environment in the same terms as your visual. Being game oriented, OpenAL also
    affords extremely low latency—you wouldn’t want your action game’s sounds to lag
    behind the onscreen action.'
