  md: '# Processing Audio with Audio Units


    Core Audio uses audio converters to convert data between formats and codecs to
    translate data in various compression schemes. Simpler frameworks, as Audio Queue
    Services, use these tools behind the scenes to convert whatever a data file contains
    into a canonical format. When you''re supplying samples directly to the audio
    engines (Audio Units and OpenAL) directly, it''s advantageous to use the canonical
    formats, if you can; you''ll save yourself some data conversions and, therefore,
    have more CPU cycles to use elsewhere.


    # Processing Audio with Audio Units


    This entire chapter has considered Core Audio''s concepts of how audio data is
    represented. Now it turns to the idea of how that data is processed.


    As discussed in Chapter 1, "Overview of Core Audio," Core Audio does most of its
    work at the Audio Units level; the Audio Queue and OpenAL engines are implemented
    atop audio units.


    Each audio unit processes a buffer of samples in some specific way: One captures
    audio from a mic, the next downstream performs on those samples, and the maybe
    next mixes it with another. This arrangement is analogous to the patch architecture
    common in the sound industry. Audio units are connected by audio streams the audio
    equipment is patched together with cables.


    Just as professional audio has jacks that you plug cables into, audio units have
    elements, which may have input scope or output scope to indicate that they accept
    or produce data, respectively. To connect two units, you set property connecting
    an input element of one to the output unit of another.


    Mac OS provides several types of audio units, which can be connected into a workflow
    called audio processing. As packets of audio data are streamed through the graph,
    each audio unit does its work, in order. You''re most likely to encounter these
    types of units:


    +   - **Effect.** Perform digital processing—that is, they change the audio data
    in some way. They are analogous to hardware effects boxes and outbound processors.


    +   - **Instrument.** Generate audio data representing musical notes, typically
    from MIDI input, which can itself come from a musical instrument or a software
    synthesizer.


    +   - **Generator.** Also generate audio data, but not from a MIDI source. Some
    units simply generate a signal programmatically, whereas others load data from
    a network stream or audio file.


    +   - **I/O units.** Provide interfaces to input or output hardware, such as a
    microphone or a speaker. These are typically implemented on the Hardware Abstraction
    Layer (HAL), the “demilitarized zone” between Core Audio and I/O Kit and the drivers.'
  merge: -1
  pgno: 71
- img_proc: true
  md: '+   - Converter units. Reformat audio data back and forth between the canonical
    formats and other formats. These can also merge and split streams, and alter timing
    and pitch.


    +   - Mixer units. Combine audio tracks. There are splitter units that provide
    multiple outputs from a single input.


    +   - Panner units. Use stereo mixing to create panning effects.


    +   - Offline effect. Perform operations on audio data that cannot be done in
    real time.


    Because it runs on mobile devices with less capable CPUs and embodies an acute
    awareness of power management, iOS provides only a subset of these units. In fact,
    iOS 4 doesn''t include any instrument, generator, or panner units.


    To understand how units and their connections work, consider a hypothetical application
    that captures from an input device, such as a microphone, and audio with some
    other source, such as playback from a file. For example, this could be a Karaoke
    application that lets the user sing with favorite songs.


    This arrangement consists of four units, as illustrated in Figure 3.2. You start
    with a generator to play audio from a file or the network, along with an I/O unit
    to get audio from the hardware. You make connections from the output scope elements
    of these units to the input scope of a mixer unit. Then you connect the output
    scope element of the mixer unit to the input scope element of an I/O unit to get
    the mixed audio out to the hardware, such as speakers or headphones. In reality,
    the process is more involved, as you''ll see in Chapters 7,“Audio Units: Generators,
    Effects, and Rendering,” and 8,“Audio Units: Input and Mixing,” but that''s the
    basic flow.


    ![](img/3aee65cd19773a73ede853c5237a1e08_72_0.png)


    Figure 3.2 Audio unit graph to mix captured and generated sound


    On Mac OS X, you can write your own audio units and deploy them in your application.You
    can also provide GUIs to the settings of your custom units and make'
  merge: -1
  pgno: 72
- img_proc: true
  md: 'them available to other applications. This isn''t possible on iOS, where applications
    are “sandboxed” and you can''t provide functionality for other apps to call into.
    Chapter 7 talks more about audio units.


    # # The Pull Model


    But if you have a bunch of units, how do they work together? Do you just create
    a bunch of units and push data into them? In Core Audio''s pull architecture,
    it works the opposite way.


    With a pull architecture, the framework tells the programmer, “Don’t call us—we’ll
    call you.” If you have a bunch of audio units, the last one (which is probably
    the I/O unit that will send audio to the speakers or headphones) pulls from the
    units connected to its input elements, in effect, “Give me something to play.”
    These units call you upstream from them, and so on. You can get into this arrangement
    by writing your own units or having a unit call into your code with a callback
    when it needs data.


    Callbacks are called *procs* within Core Audio. In the Audio File Services API,
    a callback is called when data is received *a proc*, and a callback that produces
    data is called a write proc. Other parts of Core Audio use different terminology:
    For example, when an audio unit calls into your code for a buffer of samples,
    it’s called a *render callback*. They’re different terms but the same. Although
    easily, implementing callbacks can be tricky. You’ll create your first callback
    in the next chapter, in which you will create an Audio Queue that calls you when
    it captures data for you to process. Interestingly, callbacks often follow Core
    Audio’s property-oriented design pattern: Instead of calling a “set audio unit
    callback” function to set up a callback, you set a callback on the audio unit.


    Core Audio’s extensive use of callbacks can be convenient. For example, many APIs
    enable you to register functions as property listeners. When the property changes,
    the watched API calls the registered function. On the iPhone, for example, a property
    represents the path that the audio follows to the current output device: the speakers,
    headphones, or earphone. If the user pulls out the headphones, this property changes
    and the application gives a callback, which gives the code an opportunity to take
    action, such as playing back or recording.


    # # Summary


    This chapter built on the theoretical foundation of Chapter 2,“Story of Sound,”
    to help you understand how the ideas of digital audio are represented in Core
    Audio’s essential data types. Of all the possible digital audio formats you might
    encounter, you can represent them with AudioStreamBasicDescriptions, AudioStreamPacketDescriptions,
    and magic cookies that tell Core Audio how to make sense of each buffer of audio
    data. You also got a sense of just how far Core Audio’s built-in format support
    goes by using the Audio File Services to inspect the'
  merge: -1
  pgno: 73
- img_proc: true
  md: 'supported audio file types and tell you what kind of data you could put into
    them. Finally, you looked at the processing side by learning about audio units
    and their connections and delving into how Core Audio pulls audio through the
    units.


    With this material and Chapter 1''s discussion of the common idioms of Core Audio
    programming—properties, four-character codes, and so on—you''re now ready to dig
