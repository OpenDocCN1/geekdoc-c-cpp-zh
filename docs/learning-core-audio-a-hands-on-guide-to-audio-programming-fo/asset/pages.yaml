    For this example, you''ll write one of the simplest waves, the square wave. The
    samples for this trial are: For the first half of the wavelength, you provide
    a maximum value, and for the rest of the wavelength, you use a minimum value.
    So only two possible sample values use: one high and one low. For the 16-bit signed
    integers, use the C constants that represent the maximum and minimum values, SHRT_MAX
    and SHRT_MIN.


    You declared the audio format as big-endian integers in the AudioStreamBasicDescription,
    so you have to be careful to keep the 2-byte samples in format. Mac run on little-endian
    Intel CPUs, and the iPhone''s ARM processor is also little-endian, so you need
    to swap bytes from the CPU''s representation to big-endian. The Core Foundation
    CFSwapHostToBig() does this for you. This also works on a big-endian CPU, such
    as the PowerPC on mac, because it would realize that the host''s format is big-endian
    and it would not do.


    Having calculated your sample, you write it to the AudioFileWriteBytes(). This
    call takes five parameters: the AudioFileID to write to, a caching flag, the offset
    in the audio data you are writing to, the number of bytes you are writing, and
    a pointer to the bytes to be written. You get to use this function because you
    have constant bit rate data; in more general cases, such as when writing compressed
    formats, you must use the more complex AudioFileWritePackets().


