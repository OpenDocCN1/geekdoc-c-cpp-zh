    an A on a piano). With you have enough info to set up a loop and calculate sine
    values. Each time you generate a 32-bit sine value, you copy it to the buffer
    provided by the ioBufferList, using the frame counter to figure out the offset
    in the buffer to write. Notice that, by default, you have two channels into the
    output unit, so you write a sample to the second channel as well. If you wanted
    only mono, you would need to explicitly set an AudioStreamBasicDescription on
    the output unit and specify that you would be sending only one channel.


    At the bottom of the loop, the offset count is incremented and reset to 0 if you
    have exceeded the frame count of a wavelength. When the loop exits, offset is
    stored back to your struct as startingFrameCount so you know to continue the wave
    over your next callback.


