    The output—and there''s a lot of it—looks something like this:


    ```

    SineWaveRendererProc 512 frames at 30451832.158135

    SineWaveRendererProc 512 frames at 30451832.169738

    SineWaveRendererProc 512 frames at 30451832.181346

    SineWaveRendererProc 512 frames at 30451832.192959

