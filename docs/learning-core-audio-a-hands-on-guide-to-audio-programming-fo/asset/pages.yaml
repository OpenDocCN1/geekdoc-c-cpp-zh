    29


    ![](img/3aee65cd19773a73ede853c5237a1e08_47_0.png)


    Figure 2.2(c) A sound wave approximated by several sample rates


    This explains the value of 44.1 kHz chosen for CD-quality audio. Half of that
    is 22.05 kHz, which is beyond the range of most human hearing. The ability to
    perceive high frequencies deteriorates with age.Young people can hear up to about
    20 kHz, but a middle-age person might hear up to around 14 or 15 kHz. By sampling
    at 44.1 kHz, you might lose some information, but not enough to matter—what''s
    important is the listener''s ability to perceive the vibration frequencies in
    the audio signal.


    Each sample represents the amplitude of the wave, or the displacement of the membrane,
    as a percentage of the maximum possible value. The advantage of using percentages
    is hardware independence. Half is half, regardless of what you''re hearing.


    Unlike integers, in larger numbers require more digits to express, fractions writing
    100 takes more digits than writing 10, but writing [1/10] takes more digits than
    writing [1/10]. A sample''s bit depth is the number of digits it has. If the difference
    between two sounds is smaller (a percentage of the maximum possible displacement)
    than sample has to express, that difference is lost.


    The bit depth (measured in bits per sample) multiplied by the sample rate (measured
    in samples per second) results in the bit rate (measured in bits per second).
    That is the number of bits required to describe 1 second of audio. A higher bit
    rate gives a higher-quality recording also means more bits for the hardware to
    store and process.'
