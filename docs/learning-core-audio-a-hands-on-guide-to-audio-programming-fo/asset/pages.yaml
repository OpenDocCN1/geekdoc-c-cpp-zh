  md: '# 98 Chapter 6 Conversion


    If output_file is not specified


    General options:


    [...]


    The text is quite long and doesn''t even describe all the various supported formats.
    To see those, you need to use the --help-formats or the -hf flags. When

    You ask for them, you''ll see each file described by its name, its recognized

    filename extensions, and the possible data formats. The data formats are four-character
    codes or all-capital-letter strings that describe an PCM format by its endianness,
    value type, and sample size in bits (in a format described in afconvert''s help
    text). For example, consider the WAVE format:


    ```

    WAVE (.wav)

    data_formats: UI8 LEI16 LEI24 LEI32 LEF32 LEF64 ''ulaw''

    ''alaw''

    ```


    This format can work with six PCM formats (unsigned 8-bit samples and little-endian
    ints and floats at various bits), along with the very old μ-law and α-law encodings.
    Compare this to the MP3 file format, which can contain only MP3 data:


    ```

    MP3'' = .mp3, .jpeg, .mpa

    data_formats: ''.mp3''

    ```


    On the other hand, the Core Audio Format (.caf) is a more or less universal container,
    capable of holding any format that Core Audio itself supports. Look at all the
    formats supported:


    ```

    ''caff = APPLE CAF (.caf)

    data_formats: ''.mp1'', ''.mp2'', ''.mp3'' ''QDM2'' ''QDMC'' ''Qclp''

    ''Qclc'', ''aac'' ''aach'' ''aacl'' ''alac'' ''alaw''

    dvi8'' ''libc'' ''ima4'' I8 BEI16 BEI24 BEI32

    BE32 BEF64 LEI16 LEI24 LEI32 LEF32 LEF64

    ''ms\x00\x02'' ''ms\x00\x11'' ''ms\x00\x01'' ''samr''

    ''ulaw''

    ```


    If you want to try afconvert, go into Terminal and use the cd command to change
    to a directory with a file you want convert, such as an album directory in iTunes'
