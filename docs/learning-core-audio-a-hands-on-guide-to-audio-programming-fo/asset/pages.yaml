    # A CheckError() Function


    Let''s start with a convenience function to give you better information when you
    get a badStatus return value. In the first few chapters, you used an assert()
    to check that value was equal to noErr, even if you didn''t inspect the value
    if it wasn''t. The return codes vary from var to call and error to error; even
    if you want the app to quit, you''ll feel yourself immersed by actually inspecting
    the value.


    However, the value you get from Core Audio are somewhat unpredictable. Some are
    four-character codes that are easy enough to puzzle out from a message, but others
    are just constant integer values. It would be nice to have a logging function
    that could tell the difference.


    For the first convenience function (shown in Listing 4.2), you''ll write just
    that. Look at the bytes of the error code. If all of them are characters, treat
    them as a C string; otherwise, log the code as an integer. Here''s the function,
    which you can place after #pragma markup utility functions in Listing 4.1.


    # Listing 4.2 Logging OSStatus Error Codes


    ```

    static void CheckError(OSStatus error, const char *operation)


    if (error == noErr) return;


    char errorString[20];

    // See if it is a 4-char-code

    *(UInt32 *)error = CFSwapInt32HostToBig(error);

    if (isprint(errorString[1]) && isprint(errorString[2]) &&

    isprint(errorString[3]) && isprint(errorString[4])) {

    errorString[0] = errorString[5] = ''\'''';

    errorString[6] = ''\0'';

    }

    else

    ```'
