    # ## Setting Up a File-Playing Audio Queue


    As is usually the case with Core Audio''s callback patterns, you get a single
    user pointer to pass back to your callback function. You usually want to define
    a custom struct for this so that your callback reads from an audio file and passes
    packets to the queue. As such, struct needs to keep track of the file to read
    and where you are in the file. It also needs to keep track of whether you should
    still be playing (that is, whether you''ve reached the end of the file). Also,
    as we developed the example, we found that we also needed the struct to have a
    reference to the array of packets read from the file and written to the queue
    because this is set up in main() but used in the callback. Listing 5.2 gives the
    user info struct.


    # Listing 5.2 User Info Struct for Playback Audio Queue Callbacks


    ```

    #pragma mark user info struct

    typed struct MyPlayer {

    AudioFrameID playbackFile;

    Int64 packetPosition;

    Uint32 numPacketsToRead;

    AudioStreamPacketDescription *packetDescs;

    Boolean isDone;

    } MyPlayer;

    ```'
