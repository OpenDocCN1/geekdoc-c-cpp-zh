  md: 'The Audio Queue provides a lot for you that isn''t immediately obvious, such
    as handling decompression from encoded formats like AAC to the PCM stream actually
    needed at Core Audio''s lower levels. It also eliminates concerns that will become
    apparent in later chapters: By default, your callbacks are performed on one of
    the queue''s internal threads instead of Core Audio''s real-time threads that
    prohibit blocking calls. Put another way, it''s okay for a queue callback to perform
    a potentially'
