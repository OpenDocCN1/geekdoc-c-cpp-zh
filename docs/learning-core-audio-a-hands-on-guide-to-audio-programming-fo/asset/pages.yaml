  md: '# Recording


    The first three chapters explored the nature of digital audio and how it is represented
    by Core Audio. The next step is processing—actually doing something with the audio.
    In the next chapter, we''ll start moving samples through Core Audio''s recording
    and playback engines.


    To do this, you''ll use Audio Queue Services, the highest-level playback and recording
    API in Core Audio. By the end of the chapter, you might think we need to call
    a C-based, callback-driven API "high level," but audio queues provide some conveniences
    that the lower-level APIs don''t.


    +   - Unlike OpenAL and Audio Units, you can use encoded formats such as AAC and
    MP3 with audio queues.


    +   - By default, Audio Queues call you back on their thread, which isolates you
    from some timing challenges with Audio Units.


    In this chapter, you''ll use Audio Queue Services to record audio from your computer''s
    default input. (You''ll move on playback in the next chapter.) In real life, playing
    audio is much more common scenario than recording audio. But it''s easier to learn
    how to record audio first. The basic process of moving buffers of packets to and
    from audio hardware is the tricky business of format discovery. Recording makes
    it easier to get into topics such as file formats and avoids the tricky business.
    It also gives you a way to create audio files in the next chapter.


    # All About Audio Queues


    Audio Queue Services uses a fairly simple model to get an audio capture or play-out
    job without miring you in the complexities of the audio data, the underlying hardare,
    or the codecs necessary to put them together.


    An audio queue is a simple software interface to a piece of audio hardware. The
    business of the hardware is a transducer, such as a speaker or a microphone.'
