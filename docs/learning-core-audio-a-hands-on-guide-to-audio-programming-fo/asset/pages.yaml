    the PCM counts it supports; it gets by just a few constants and a sample rate
    instead of the many options provided by the AudioStreamBasicDescription.The supported
    constants are AL_FORMAT_MONO8, AL_FORMAT_MONO16, AL_FORMAT_STEREO, and AL_FORMAT_STEREO.
