    |

    | AL_MIN_GAIN | Minimum gain for this source (float). |

    | AL_MAX_GAIN | Maximum gain for this source (float). |

    | AL_CONE_OUTER_ANGLE | Outer angle of the cone, which affects how sound propagates
    from the source, as int or float degrees. Default 360. |

    | AL_CONE_INNER_ANGLE | Inner angle of the sound, as int or float degrees. |

    | AL_CONE_OUTER_GAIN | The gain factor for listeners produced by the source, as
    a float. Inside the cone, the gain is AL_GAIN, and a linear interpolation is used
    for points in between. |

    | AL_SOURCE_TYPE | An enumerated int to indicate the source type (either AL_UNDETERMINED,
    AL_STATIC, or AL_STREAMING), determined by which functions you used to attach
