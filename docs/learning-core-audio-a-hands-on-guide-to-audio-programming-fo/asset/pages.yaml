  md: '# Chapter 2 The Story of Sound


    The fundamental problem of digital fidelity lies in making the best approximations,
    given the limits of the hardware. Every different format is a different set of
    compromises to solve this problem. This is true not only in digital audio, but
    generally. Digital photography, for example, has the same sorts of problems, with
    the same alphabet soup of formats, each offering its own solution.


    In a digital image, the sample rate translates into the number of pixels, whereas
    the bit depth translates into the number of colors per pixel. Each additional
    bit yields an increase of a power of two. The difference between the two adjacent
    images in Figure 2.3 is a single bit.


    ![](img/3aee65cd19773a73ede853c5237a1e08_48_0.png)


    Figure 2.3 Bit depth and sample rate in digital photography


    One niggling implementation detail is that this metaphor works only with a grayscale
    image. Computers can''t actually display color pixels the way humans see. Each
    color pixel consists of red, green, and blue lights. Each requires its own set
    of data, called a channel. Most image formats combine one sample from each channel
    into a bundle representing a single pixel.'
  merge: -1
