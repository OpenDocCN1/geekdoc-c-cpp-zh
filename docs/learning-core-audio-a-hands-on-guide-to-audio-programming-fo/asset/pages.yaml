  md: '# Chapter 10 Core Audio on iOS


    have some fun at the unit level, you''ll perform our own audio effect on the captured
    audio, even though you don''t have effect units to rely on.


    So how do you perform an effect? Let''s step back a minute and think about how
    a pass-through works with one I/O unit doing both input and output. As you learned
    in Chapter 8, you collected samples from bus 1 of an I/O unit''s output scope
    and provide samples to be played to bus 0 of an I/O unit''s input. If the same
    unit will provide both input and output, the trick is connect bus 1''s output
    to bus 2''s input, as in Figure 10.2.


    ![](img/3aee65cd19773a73ede853c5237a1e08_258_0.png)


    Figure 10.2 Connecting RemoteIO Audio Unit to its own play-out


    You do this in a few straightforward ways:


    +   Set the kAudioUnitPropertyMakeConnection property on bus 0/input scope, providing
    an AudioUnitConnection struct that refers to the unit''s bus 1/output scope.


    +   Create an AUGraph with a node for the RemoteIO unit as its only member. Then
    call AUGraphConnectNodeInput to connect bus 1/output scope to bus 0/input scope.


    +   Create a render callback function and set it the kAudioUnitPropertySetRenderCallback
    property on bus 0/input scope. The callback function, call AudioUnitRender ()
    to manually pull the most recent of captured samples. This works only because
    input and output are coming from the same hardware and are wrapped by the same
    I/O unit.


    You''ll use the third option here, though it means writing more code, because
    it offers a nice opportunity to mess with the samples as they pass through the
    callback function. Figure 10.3 shows this arrangement.'
