    wrote an input callback to store these samples.

    - You built an AUGraph with a single node, the default output unit, and you gave
    it a render callback that reads from the ring buffer.

    - You started the input unit and graph, which causes both of them to connect to
    the audio hardware and start calling your callbacks.


    At this point, you''ve accounted for everything and you can build an application.
    Take a look at your selected input and output devices in the Sound pane of the
    System Preferences application; these are the devices that the application will
    use. When you''ve got that device, such as an A/V device playing into a line-in
    connection or your voice speaking into microphone, run the application and listen
    for the result on the default output device (probably your speakers or headphones).
    Because you''re not processing or doing anything else with the sound, it would
    sound pretty good. When done, you can click Stop in Xcode or press any key in
    the Console to exit the application.

    You did a lot of work to provide some pretty functionality in this example. You''d
    be right to think that this is a grueling amount of work for something as simple
    as play-through. If all you want is play-through, you could do this application
