  md: '# Chapter 9 Positional Sound


    setting global state, as the speed of sound or the model by which sounds fade
    with distance, as well as functions to check the error state of previous OpenAL
    calls.


    All the OpenAL functions are documented in the OpenAL Programmer''s Guide (available
    at the OpenAL website), or you can just look in the al.h and alc.h header files.
    You''ll need #include or #import in both of these header files; alc.h functions
    and constants for working with the OpenAL context and devices, and al.h has the
    relations to readers, listeners, and containers, as well as typedefs, ALfloat
    and Aluint for floating-point and unsigned integer values, respectively. The website
    also has an "OpenAL 1.1 Specification" that defines the semantics of the API,
    as how sounds are interpolated and attenuated, given the source and listener properties
    you set.


    Beware Gears OpenAL Gifts


    Searching the Web for OpenAL sample code often leaves you disappointed on the
    Mac and especially on iOS. A collection of utilities, alut.h, are not part of
    the OpenAL spec, were effectively deprecated by 2005, and are therefore not included
    with Apple''s implementations of OpenAL(for more information, see Apple''s "Technical
    QA QA1504: The Header File "alut.h is Missing from the OpenAL Framework")


    The big problem is that a lot of sample code you found on the Web that these utilities
    are available. Every OpenAL Programmer''s Guide makes use of a loadWAVFile() function
    that is defined in alut.h and, therefore, doesn''t exist on Mac or iOS. Later
    in this chapter, you will see how to use Core Audio, specifically ExtAudioFile,
    as a much capable replacement for loadWAVFile().


    # Putting a Sound in Space


    To exercise OpenAL, you''ll develop a simple application to put a sound in space
    and move it around. You''ll use all three dimensions, even though your speakers
    or headphones are one-dimensional, the meaning will ultimately be rendered as
    a left-to-right stereo mix.


    How do you move a source in the OpenAL space? You repeated it AL_POSITION. For
    the first example, we load a sound into a buffer, attach it to a source and set
    AL_LOOPING (so the buffer plays over and over), and then "orbit" the sound around
    the listener''s default position of (0, 0, 0). Leaving the listener at the origin
    makes


