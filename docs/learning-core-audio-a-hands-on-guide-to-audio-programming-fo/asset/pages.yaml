  md: '# 12


    # Coda


    You''ve reached the end of the book, hopefully your journey with Core Audio just
    beginning.You have lots more to learn, lots more to play, and lots more to do
    with Core Audio that will not fit in this book—or any other book. Furthermore,
    the field of digital audio is much larger than any programming framework. The
    more you learn how to work with audio, the more value you''ll get from Core Audio.


    This chapter discusses what might interest you in the OS X and iOS audio APIs
    and where you might want to go from here.


    # Still More Core Audio


    All authors have to make decisions about what to include and what to leave out
    in a book. Although we''ve done much than just scratch the surface of Core Audio,
    skimming the documentation reveals that there''s much more to work with: more
    system-provided audio units, dozens of OpenAI-properties, and more.


    Within Core Audio, this book leaves out one major API: AudioFileStream.h,enables
    you to create apps as as clients for the stream formats that OS X and iOS support.
    They enable you to send in buffers of raw data—which you presumably from the network,
    although it also works for reading files—and receive callbacks with packets of
    audio parsed from the stream. You then decompress these packets with Audio Converter
    functions, send them to an Audio Queue, and so on. The catch is that you''re limited
    to the codecs and the stream formats that Core Audio supports, although this helps
    you play MP3 from an HTTP stream (Shoutcast-style web radio), it doesn''t necessarily
    handle a lot of other stream formats. Still, because it follows the conventions
    of the other Core Audio APIs—heavy on the properties and callbacks—this isn''t
    difficult if you make it all the way to point.


    Another topic that this book doesn''t cover is the capability to create your own
    audio units. In Chapters 7,"Audio Units: Generators, Effects, and Rendering,"
    and 8,"Audio Units: Input and Mixing,"you saw how to add your own processing by
    way of render callbacks, which you could encapsulate inside a reusable audio unit.You
    can also create a'
  merge: -1
  pgno: 297
- img_proc: true
  md: 'Coco-based UI for your unit so that users can configure it directly. This is
    mostly of interest if you''re in the business of selling your audio unit as a
    third-party add-on, where it can be called from Graph-based applications such
    as GarageBand, Logic, and Final Cut Pro. The process of rolling your own audio
    unit involves a little programming and lot of testing and packaging. If you''re
    one of the few who needs to do this (and isn''t doing so already), you can find
    a full walkthrough in Apple''s Audio Unit Programming Guide.


    Third-party audio units are available only on Mac OS X. They don''t make sense
    on iOS, where third parties can''t share code to be between applications. Phone
    OS 3 added an API for encapsulating audio units for your app''s use, AUPlugin.h,
    which supposedly enabled you to register a new audio unit and add it to AUGraphs
    as the system units. However, we have on high authority that this never worked,
    and AUPlugin.h was removed in iOS 4.0.


    # Next Steps


    Now that you know all these APIs, what are you going to do with them? In many
    ways, the greatest power of Core Audio lies not in the APIs themselves, but in
    what you bring to the table in terms of working with the audio as it passes through
    the system. This book has talked about "doing stuff" with render callbacks or
    before buffers to OpenAL, but what does really involve?


    # Digital Signal Processing


    A whole science is involved in working with audio signals in a computer, or digital
    processing. Let''s return to the science of sound and the waves of pressure moving
    through the air. In analog systems, you commonly use the amplitude of an electrical
    signal to represent sound. In digital, you sample this signal thousands of times,
    to get a numeric representation of the signal that practical to store on disk,
    transmit over networks, and in a CPU.


    You can process signal with various mathematical techniques. For example, the
    famous Fourier Transform enables you to convert a time-based function—that''s
    all the audio signal is, a function of amplitude at a given time—to a frequency-based
    function. This capability to find frequencies in time-based signals facilitates
    all kinds of useful applications, from effects that speed playback without changing
    pitch, to frequency decoders that use both: The double-speed playback available
    in the iOS Music app to get through spoken podcasts and audiobooks faster, and
    the latter is used by apps that identify sounds and by music-performance games
    such as Karaoke Revolution and Rock Band.


    The topic of digital processing merits its own book. In fact, Pearson (who publishes
    this book) has a number of titles on the topic, including Digital Signal Processing,
    4th Edition, by John G. Proakis and Dimitris K Manolakis; Discrete-Time Signal
    Processing, by'
  merge: -1
  pgno: 298
- img_proc: true
  md: 'Alan V. Oppenheim and Ronald W. Schafer; and Notes on Digital Signal Processing:
    Practical Recipes for Design, Analysis and Implementation, by C. Britton Orabaugh.


    You can also find some free resources on the Web for learning about DSP."The DSP
    Dimension" is a series of tutorials at www.dspdimension.com that covers topics
    such as the Fourier transform and time-stretching/pitch-shifting functions. The
    Music-DSP Source Code Archive, at www.musicdsp.org, offers a free bag of DSP analysis,
    filter, and synthesis recipes in a number of languages (some C and C++, others
    MATLAB). A handful of iTunes U-courses offers a college-level introduction to
    DSP. If you can handle the method, Stanford’s "The Fourier Transform and Its Applications"
    offers a deep dive into the theory behind this most useful technique.


    Speaking of the Fourier transform, you should be aware of one more Apple framework.
    The Accelerate framework in OS X and iOS provides highly optimized and sometimes
    hardware-accelerated mathematical functions. The vDSP portion of Accelerate is
    particularly applicable to digital signal processing code, providing functions
    for vector and matrix arithmetic as well as the Fourier transform (FFT).


    # Lion and iOS 5


    Mac OS X 10.7 (Lion) and iOS 5 are new as this book is being released, and add
    APIs to Core Audio and the related media frameworks.


    Among lights, you can now inspect and use hardware encoding and decoding via the
    AudioFormat.h property AudioProperty_HardwareCodec Capabilities and a set of "prefer"
    and "only" properties in AudioQueue.h. Among other changes, AudioFile introduces
    new property for album art. Some new audio units are also available, brought to
    the Mac from iOS, including AudioProcessingIO (for echo cancellation in voice-over-IP
    apps) and AudioPodEQ (an equalizer that uses presets such as Bass Booster and
    Spoken Word).


    # AUSampler


    Probably the most new audio unit in Lion is the AUSampler, kAudioUnitSubType_Sampler,
    an instrument unit that enables you to pitch-shift an arbitrary waveform to turn
    it into a musical instrument. It works like any other instrument unit, with the
    kAudioUnitSubType_DLSynth in Chapter 11,"Core MIDI," and can be controlled via
    MIDIEvent(). The difference is that, by providing your own waveforms, you can
    make any kind of real-world instrument, or even a voice and pitch-shift into a
    sort of virtual singing.


    For the final example, copy the MIDIGraph example from Chapter 11 into a new command-line
    project. Because this is new for Lion, you should use Mac OS X 10.7 the Base SDK
    in the project settings. Link in the Audio Toolbox, Audio Unit, and Core MIDI
    frameworks as before.


    The first change is trivial. In setupGraph(), replace the line that sets up the
    instrument audio unit, as shown in Listing 12.1.'
