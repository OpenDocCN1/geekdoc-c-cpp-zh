  md: '# The OpenAL API


    A source is an object in this space that produces sound. There can be, and usually
    are, many sources, and they can all produce the same sound or different sounds.
    You attach buffers to sources. A buffer is just what it says: a memory buffer
    of audio data. A given buffer can be attached to one or many sources. In a game
    with a lot of objects that sound more or less the same (like a racing game, in
    which each car''s engine produces the same sound), you would just attach the buffer
    to many sources. And in cases where each source has a distinct sound, you use
    different buffers for different sources. The third object in OpenAPI is the listener,
    which represents the single listener in this space. OpenAL takes the data in buffers;
    it figures out how the listener would hear that sound, given the relative position
    and orientation of the listener and all the sources; and plays resulting mix out
    to the audio hardware.


    # The OpenAL API


    OpenAL represents sources, listeners, and buffers primarily through a property-style
    interface. After a listener, buffer, or source has been created, you work with
    it by setting or getting its properties. In the fact, the OpenAL API consists
    of functions that get or set various argument lists: alSource() sets a property
    with an integer value, alGetBuffer3() gets a property from three floats, and so
    on. Get functions all have Get in their names; functions without Get setters.

    Depending on the property you are working with, you get or set a single int or
    float, or get three discrete values (for coordinates), or set or get a “vector,”
    which is a C array containing three or six values, depending on the property.

    When you get the hit of it, naming is pretty predictable: getters are functions
    alGetSource(), alGetSource31(), alGetConfigSource(), and so on; these functions
    return one int, two ints, and three, respectively. Meanwhile, setters for the
    listener include allListener(), allListener31(), allListener(), and so on.

    But what can you set? Tables 9.1, 9.2, and 9.3 provide a quick summary of the
    properties (and their types) that can be set on buffers, listeners, and sources,
    respectively. Don''t worry if you don''t understand them all; some are esoteric,
    most have sensible defaults, and you generally need to set or get only a handful
    of properties specific to your current needs. The OpenAPI spec reveals the math
    behind the advanced sound-


    > 1 This is the exact opposite of the Objective-C convention, in which you explicitly
    use the word “set” for setters but omit “get” in getters.


    > 2 Any OpenAL property that contains of a single value can be accessed with either
    a single-member vector as well.'
