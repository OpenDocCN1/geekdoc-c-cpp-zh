  md: '# Chapter 10 Core Audio on iOS


    All APIs exist more or less unchanged on iOS. Where differences exist, they''re
    generally in the small details, not in the functions themselves or the big picture
    of how to use them. The differences generally come from what can reasonably be
    expected from small devices and what''s appropriate for the more tightly controlled
    environment of third-party app development for iOS.


    This chapter looks at the diff, to focus on what''s unique to Core Audio on iOS.
    Fundamentally, two underlying differences make things on iOS:


    +   Applications run in a managed environment. On Mac OS, applications (or other
    processes) have substantial access to system resources and operate with a high
    degree of independence. On iOS, third-party applications run in a rigidly defined
    and controlled environment. Apps can only be—they cannot be daemons, drivers,
    command-line executables, and so—running as a UIApplication imposes rules on iOS
    in terms of how they share system resources, access to the audio system. This
    also means there is no sharing of resources between applications, which has profound
    implications for Audio Units:You can''t make a third-party plug-in that other
    apps can see, so there is no asmarket for Audio Units as there is on OS X.


    +   The audio hardware is simpler. Your Mac could potentially have many audio
    devices, such as audio cards and I/O devices, all of which have different timing
    and performance characteristics. iOS has exactly one audio device. This greatly
    simplifies some of the APIs and eliminates others: It''s easier to get an I/O
    audio unit when you don''t have to specify a device. As a result, the Audio Hardware
    functions (Chapter 4, “Recording,” touched) are completely absent.


    The differences in iOS manifest themselves in two ways:


    +   A set of APIs, Audio Services, manage your use of audio system resources and
    provides access to information about the audio hardware.

    Audio Units are more limited in what they can do. Part because of the simplicity
    of the hardware and the need to conserve resources, iOS provides a much smaller
    collection of Audio Units, and the nature of “sandboxed” applications don''t allow
    for third-party AU development. On the other hand, having only a single audio
    device means that audio input and output with audio units and AUGraphs is a lot
    easier.


    This chapter looks at these traits separately. You''ll develop two sample apps
    to exercise both the Audio Session API and Audio Units as they exist on iOS.


    # Playing Nicely with Others:

    Audio Session Services


    Let''s start looking at the Audio Session Services. This set of APIs in the Audio
    Toolbox provides a handful of services that relate to an audio session, this greatly'
  merge: -1
