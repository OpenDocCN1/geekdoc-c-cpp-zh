  md: 'This is a problem for AUGraphs as you currently understand them because you
    need the output unit to pull from somewhere. It can''t pull directly from the
    input unit, which is running on a separate timing cycle and might or not be able
    to provide samples at a given time. To make things work, the input unit is going
    to providing samples when it''s good and ready, regardless of the state of the
    output unit or the AUGraph. So when it wants to provide samples to our program,
    what do we do with them?


    # Ring Buffers to the Rescue


    You need some place for the input unit to leave its samples for the output unit
    to collect from them. An ideal tool for this is a ring buffer which acts like
    an infinitely long read/write buffer. The input unit writes samples to whenever
    it needs to, and the output unit reads from the buffer as necessary. It called
    it a ring buffer because it wraps around memory: When you want to read or write
    the last address in the buffer, the call wraps around the beginning.


    Many possible implementations exist, but for simple purposes, you can imagine
    a buffer with two pointers into it: a reader pointer and a writer pointer. Consider
    Figure 8.2 which shows the state of a ring buffer at several points. At ① the
    buffer is empty; the writer pointer points to the first address of the buffer,
    and the reader pointer is invalid because there is no data in the buffer to read.
    Write some data to the buffer, and the reader pointer ② now points to the beginning
    of the buffer, and the writer pointer points to the free address in the buffer.
    Write again, and in step ③, the writer pointer is further into the buffer. At
    this point, you could safely read (writePoint) - bytes from the buffer. Imagine
    that you read through the first write, which puts you in step ④, with the reader
    pointer still trailing the write pointer. You could read all the way to the writer
    pointer, but not further, obviously. For a final step, you write a third block
    of data to the buffer. In this diagram, the address of the writer pointer plus
    the length of the new data is the end of the ring buffer. So, as illustrated in
    ⑤, the first part of the block is written to the end of the ring buffer, and the
    rest of it is written back at the beginning. In terms of memory addresses, it
    seems like the writer pointer is behind the read buffer, but this is illusory:
    Future advances the reader pointer until it reaches the end of the buffer, at
    which point it wraps around, just as the writer pointer


    Obviously, for this to work, the reading and writing needs to be coordinated.
    If you tried to read when there''s no data available, you get nothing; if you
    keep writing to the buffer and fill it up (if the ring buffer catches up to the
    reader pointer), the reader loses data. A ring buffer is appropriate only when
    the data in the buffer will be produced and consumed at pretty much the same rate.
    Picking an appropriate size can be tricky; Bigger buffers make collisions less
    likely, but after a point, you can end wasting memory.'
