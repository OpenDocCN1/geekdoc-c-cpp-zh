    # Your AUGraph


    At this point, the example is done. All you need to do now is how hook up instruments
    and play them. That assumes you have suitable instruments. By far the most popular
    way to connect MIDI devices to Macs is with MIDI-to-USB adapters. They’re commonly
    found in electronics and music stores, with prices ranging from less than US$10
    to US$100, depending on features, number of ports, and so on.


    And if you don''t want a MIDI keyboard ... well, we may have an alternative for
    the next section.


    For now, lets take stock of what you''ve learned. You used Core MIDI to discover
    the MIDI devices connected to your Mac, opened an input port and connected to
    their sources, and processed incoming MIDI messages from those sources. When the
    MIDI messages WERE NOTE ON or NOTE OFF, you used MIDIDeviceEvent to send the notes
    on a synthesized piano. Keep in mind that the last step of this process takes
    you back to the Audio Units you’re already familiar with, you you perform down-stream
    effects on the synthesized sound via effect units or combine multiple synthesizers
    and other units (such as an I/O unit for captured audio from a mic) in a mixer
    unit, and get a whole band going. The musical possibilities are compelling.


