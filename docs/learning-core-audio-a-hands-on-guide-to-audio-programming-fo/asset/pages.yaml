    \n![](img/3aee65cd19773a73ede853c5237a1e08_155_0.png)\n\nFigure 7.2 Mixing two\
    \ buses down to one with a mixer unit\n\nThe input/output units have a special\
    \ convention for busses: Bus 0 represents device, and bus 1 represents device\
    \ input. In this case, you connect bus 0 (the only one) of the file player unit\
