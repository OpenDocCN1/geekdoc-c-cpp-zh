  md: '# Foreword


    When you know the basics of Core Audio,you''ll want to apply your skills by learning
    the parlor tracks of recording and playback with Chapters 4, "Recording," and
    5, "Playback," using the high-level Audio Queue architecture.


    Of course, "high-level" is a misnomer, especially if you''re coming from an object-oriented
    background such as Cocoa. Setting the comforting warmth of Objective-C to take
    the reins of C can be scary, but with a little understanding, you''ll come to
    see how much Cocoa C framework can be, as familiar friends, key-value pairs, in
    unfamiliar clothes.


    When you understand Audio Queues, you''ll be a master of audio formats—almost.
    First you must complete your journey by learning to convert formats and to understand
    the relevance of canonical forms.


    Then it''s time to say goodbye to high-level shores as you strap your diving suit
    and descend into the depths of Core Audio, the modular Audio Units that implement
    the magic Chapters 7,"Audio Units: Generators, Effects, and Rendering," and 8,"Audio
    Units: Input and Mixing" will make or break you as an audio programmer, for here
    you can craft end-to-end solutions that are not possible "the easy way."


    Once time is your playing, it''s time to tackle scale. In Chapter 9,"Positional
    Sound,"you enter another dimension as you learn to change sounds by positioning
    audio in space using OpenAL, the 3D audio framework.


    Core Audio has roots in the Mac but has evolved with Apple''s features. In Chapter
    10,"Core Audio on iOS,"you focus on iOS the challenges and changes brought by
    the post-PC world of ultraportable hardware running ultra-efficient software.


    Mobile hardware is not the only way to take audio beyond the computer. In Chapter
    11,"Core MIDI,"you gain the means to connect the computer to musical instruments
    and other hardware using Core Audio''s implementation of the industry-standard
    Musical Instrument Digital Interface, Core MIDI.


    With that, you''ll be at the end of your quest, but your journey will just begun.
    In Chapter 12,"Coda,"you look to the future, to the once inexplicable concepts
    you are now equipped to tackle, such as digital signal processing and sampling.


    If you want to be a master of the arcane arts, you have a long road ahead of you.
    There''s no sense saturating it; this is going to be hard. But don''t worry—you''re
    in good hands. Your authors have used plain language and plenty of sample code
    to banish the demos and show you what the underlying logic will make these concepts
    yours.


    Core Audio is the most powerful system for audio programming has yet met; its
    power has largely merged out of the hands of most app makers and locked in the
    brains of nerds like Kevin. Chris has done what nobody else managed and may never
    manage to do again: Explain Core Audio in another way people can understand.


    This book has been years in the making, and it took an incredible amount of work
    and the best editor in the industry, the legendary Chuck Toporek, and his talented
    colleagues at Pearson to finally bring it into existence. The people into whose
    waiting


    xii'
