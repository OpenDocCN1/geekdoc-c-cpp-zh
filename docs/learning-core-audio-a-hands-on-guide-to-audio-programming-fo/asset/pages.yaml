  md: '# Chapter 9 Positional Sound


    Table 9.1 Property Constants for OpenAL Buffer Functions


    | Property Constant | Description |

    | --- | --- |

    | AL_DATA | The original location in memory that the buffer''s data was copied
    from. This is useless if the caller subsequently free()''d that memory, but in
    some cases (like using the optional static buffering-API), it''s viable. |

    | AL_FREQUENCY | Sample rate of the audio data (Hz), as an int. |

    | AL_BITS | Bit depth of the buffer (such as 8 or 16), as an int. |

    | AL_CHANNELS | Number of channels in each sample, as an int. Must be 1 to get
    positional sound (stereo sounds play with their existing left-right mix). |

    | AL_SIZE | Size of the buffer in bytes, as an int. |


    Table 9.2 Property Constants for OpenAL Listener Functions


    Table 9.3 Property Constants for OpenAL Source Functions


    | Property Constant | Description |

    | --- | --- |

    | AL_POSITION | Position of the source in space, as (x, y, z) floats. |

    | AL_VELOCITY | Source''s velocity, as an int or float vector. This doesn''t change
    the AL_POSITION; it just applies a Doppler effect, increasing the pitch if the
    source is moving towards the listener and decreasing if it is moving away. |

    | AL_DIRECTION | A vector (of three ints or floats, or a vector of ints and floats)
    describing which direction the source is pointing. |

    | AL_SOURCE_RELATIVE | Flag to indicate whether source positions are relative
    to the listener or absolute. The default for this value is AL_FALSE. |

    | AL_PITCH | A pitch multiplier, enabling you to change the pitch of a sound.
    Must be a positive float. |

    | AL_GAIN | Gain (volume boost or attenuation) for the source (float). |'
