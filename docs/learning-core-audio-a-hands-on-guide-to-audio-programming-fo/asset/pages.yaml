    One other point you might want to investigate is how often you''re being called
    back, and how many frames are being requested. This is a product of the sampling
    rate and the size of the buffers: A faster rate or smaller buffers result in more
    frequent callbacks. As an experiment (Listing 7.35), you could add a log statement
    to the top of the callback to see how many frames are being requested, along with
    the current time.


