  md: '# Summary


    41


    # Note


    Describing audio and storing audio to the file system are entirely different problems.
    Data formats solve the first problem; file formats solve the latter.


    Thinking of an audio file as a container that holds audio data. Some file formats
    are customized for specific data formats, such as MP3; an .mp3 file can''t contain
    PCM or Windows Media data—as noted. AIFF files handle PCM audio data, but only
    if it''s big-endian. Conversely, PCM in WAV files has to be little-endian. Other
    file formats are more agnostic and deal with several data formats. For example,
    the MP4 file format can contain any data formats, including AAC, PCM, and AC3.


    The most content-agnostic file format Core Audio supports is its own Core Format,
    abbreviated as CAF and indicated by the file extension .caf. A CAF file contains
    any audio format supported by Core Audio: MP3, AAC, Lossless, and you make it
    internal to your application, as background music or sound effects.


    CAF also employs a number of tricks to improve performance. For example, consider
    MP3 audio: it has a variable rate, jumping to any point in an .mp3 file requires
    decompressing all the data from the playback position until it reaches the time
    you want to.You have no other way to know what of the file represents the target
    time. This requires significant I/O and CPU costs and often takes time to sample,
    so it can make the jump immediately.


    # Note


    The internal structure of the various container formats is beyond the scope of
    this book. Formats are frequently proprietary and widely variable. Core Audio
    handles this implementation detail by abstracting them away.


    In the example, you could replace the file format kAudioFileAIFFType with kAudioFileM4Type
    or kAudioFileCAFType, change the filename to a suitable extension, and not have
    to change anything else in your code. Core Audio would take responsibility for
    figuring out to put your PCM data into the specified format, as long as the audio
    format and file format are compatible.


    # Summary


    You''ve come a long way in this chapter!You started in the real world, talking
    about how natural sounds generate sound, how sound moves through the air as waves,
    and how your ears pick up that sound. Then you saw to model this in a digital
    representation with numeric representations of sound waves, which are more amenable
    to being processed by computers, stored on digital media, and across networks.
    To concretize these concepts, you wrote your own sound waves, sample to files
    on'
