  md: '# Buffers


    You have noticed that writing all the samples to your file took a few seconds.


    A 5-second run time for generating 5 seconds of audio is not very performant!


    Reading or writing one sample at a time is highly inefficient. If you think back
    to the AudioFileWriteBytes, you might remember that the last two parameters were
    the number of bytes to write to the file and a pointer to the sample. Instead
    of writing one sample at a time to the file, racking up the overhead of a function
    call more than 200,000 times for this simple example, you could have created a
    memory buffer to hold a bunch of samples and then written those samples en masse
    to the file.


    This isn''t just a problem with writing files. It''s also a problem when you generate
    sound at runtime. In a nutshell, the different parts of the computer don''t operate
    at the same speed. The time it takes for the audio hardware to produce or consume
    a packet of audio is much less than the time it takes to make the packets in and
    out of memory. This slowdown is called von Neumann bottleneck.


    When the audio hardware runs out of things to do, it makes terrible noises and
    ruins the magic. To prevent this from happening, you can use buffers to shuttle
    audio packets back and forth. A lot of bit buffers means any hiccups in the slow
    parts of the computer can be fixed before the fast parts of the computer notice:
    By the time one buffer of audio data has been exhausted, another has (hopefully)
    arrived.


    Aside from further increasing the complexity of the subject, buffering has the
    unpleasant effect of making it harder to get the hardware''s attention when you
    actually think. If it is data-level bureaucracy—some of it is necessary, but too
    much of it makes everything too long.


    The technical term is latency, the delay between initiating an action and seeing
    the result of that action. For example, the hardware latency of the iPhone and
    iPad Touch is about 5 to 30 milliseconds, depending on model. When you push a
    buffer of samples from your code to one of the audio engines mentioned in this
    chapter, a few milliseconds elapse before the first sample of sound starts out
    of the speaker or headphones.


    Buffers and latency are a delicate balancing act: Big buffers makes for higher
    latency, if you push your luck in lower latency, you risk exhausting your buffers
    and hearing silence (dropouts) or noise.


    # Audio Formats


    In the example, you use an AudioStreamBasicDescription to describe the format
    of the audio stream you generated: 16-bit integers, one channel, one sample rate
    of 44,100, and so on. But this isn''t the whole story. You then put audio into
    an AIFF file, and as you might know from owning your own iTunes collection, many
    different file formats exist: AIFF, WAV, MP3, M4A, and so on.'
