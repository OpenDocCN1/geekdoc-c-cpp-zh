  md: '# Chapter 6 Conversion


    ![](img/3aee65cd19773a73ede853c5237a1e08_130_0.png)


    Figure 6.2 Location of output.aif as written by CH06_AudioConverter program


    # Converting with Extended Audio File Services


    You might be discouraged by having to do so much with buffer wrangling and callbacks
    to convert audio from one format to another. You might even be tempted to just
    call `/usr/bin/afconvert with NST if you ever need to do a conversion from within
    Cocoa application.


    Part of the problem comes from the fact that you''re operating at a fairly low
    level—and Core Audio''s very modular APIs, at that. The Audio Converter is meant
    to work with any source, such as files, network audio, or even synthesized audio
    that''s created entirely within your code. As a result, the common interface for
    exchanging data has to be buffers, and can mean a lot of buffer wrangling.


    Still, the most common case for audio format conversion involves files on at least
    one end, and Core Audio does have an API to make this easier. The Extended Audio
    File Services combine the Audio File Services and Audio Converter Services into
    a simplified API. Specifically, they combine I/O and format conversion into a
    single action. You read from a compressed file and get buffers of uncompressed
    PCM. Going in the other direction, you send PCM to a write function, and compressed
    audio is written to the filesystem.


    Let''s by making a copy of the example program so you can simplify it by using
    an Extended Audio File. Create a new command-tool and add AudioToolbox.framework
    to the target, as always.


    Listing 6.22 shows an outline of the revised program. Notice that there''s stubbed-out
    callback function. With Extended Audio Files, you don''t need one.'
