  md: '# Chapter 10 Core Audio on iOS


    +   - kAudioSessionProperty_AudioCategory


    Defines how the app interacts with the rest of the audio system on the device.


    The Audio category has a set of semantic values that describe how you want your
    app to behave in terms of sharing access to the rest of the audio system: whether
    it mixes with other audio (such from the Music app) or it wants to own the output,
    whether it wants to capture audio, whether it should honor the iPhone''s ring/silent
    switch, and so on. The possible values are defined semantically, in terms of your
    intent instead as a set of specific behaviors. For iOS 4.0, the following values
    are provided:


    +   - kAudioSessionCategory_AmbientSound


    Background audio is not necessarily critical to the application''s activity. It
    mixes with the Music app and can be silenced with ring/silent switch. It does
    not allow capture and cannot play when the app is in the background.


    +   - kAudioSessionCategory_SoloAmbientSound


    Background audio does not mix with audio from other apps. It honors the ring/silent
    switch and does not allow capture or playing in the background. This is the default
    category if you select not to set one.


    +   - kAudioSessionCategory_MediaPlayback


    Foreground audio (that is, audio is point of the application) that cannot be turned
    off by the ring/silent switch. It allows your app to keep playing when in the
    background. It does not mix with other apps'' audio, although you can override
    this by setting the property kAudioSessionProperty_OverrideCategoryMixWithOthers.
    It does not allow recording.


    +   - kAudioSessionCategory_RecordAudio


    Allows audio capture for apps that perform only capture and do not produce or
    play audio (which makes mixing and ring/silent considerations moot). It can continue
    recording when the app is in the background, although this turns the status bar
    and shows the name of the application, to warn the user that he or she is being
    recorded.


    +   - kAudioSessionCategory_PlayAndRecord


    Apps that both capture and produce audio, possibly simultaneously. It does not
    honor the ring/silent switch and typically does not mix with other apps (although
    you can override this with a property, as noted earlier). It can record and play
    in the background, with the previous two categories.


    > 2 We have omitted deprecated values.'
