    displacing the units vertically to drive home the point that this is no longer
    a synchronous pull through a graph. Instead, the input and output units are exchanging
    samples asynchronously, through the ring buffer.


    The Core Audio SDK provides a ring buffer, but not where you might expect to find
    it. The CARingBuffer is a C++ class, found in Core Audio''s Public Utility folder,
    at'
