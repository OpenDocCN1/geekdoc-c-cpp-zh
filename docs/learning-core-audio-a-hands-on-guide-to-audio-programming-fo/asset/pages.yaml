  md: '# Chapter 8 Audio Units: Input and Mixing


    Note


    The AUSplitter, a subtype of converter units, does the opposite of mixing: It
    takes a single input stream and splits it into multiple, identical streams.


    With mixer units, you can get some of the real payoff of AUGraphs: the capability
    to have many streams of audio from many sources, performing effects on individual
    streams and mixing them before sending them to the audio hardware.

    In this example, you would be pretty natural to use the file player audio source
    and mix it with the captured audio through code to create a Karaoke-style single-application.
    But because setting up the file player was a bit of a hassle, we leave that as
