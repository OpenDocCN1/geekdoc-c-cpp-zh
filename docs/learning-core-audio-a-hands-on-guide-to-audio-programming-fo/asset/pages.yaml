  md: 'Core MIDI 259


    ![](img/3aee65cd19773a73ede853c5237a1e08_277_0.png)


    Figure 11.1 Core MIDI architecture


    The bottom-level object is a MIDIEndpointRef, which is a simple MIDI source or
    destination, meaning a single 16-channel MIDI stream. The actual MIDI events are
    transmitted/received over an endpoint.

    The next-higher-level object is the MIDIEntityRef. It is simply groups related
    and logical endpoints together. For example, if your program wants to communicate
    bidirectionally with a device, you know which endpoints represent a pair, as well
    as associating sources and destinations.

    Finally, at the top is a MIDIDeviceRef. This object represents a physical device.


    ![](img/3aee65cd19773a73ede853c5237a1e08_277_1.png)


    Figure 11.2 MIDI device hierarchy overview'
