  md: '# iOS Hardware Hazards


    A few low-level hazards might catch you by surprise, depending on how demanding
    your app is.


    Compressed formats use hardware-accelerated encoding and decoding, which saves
    CPU and battery life, but whether you get it depends on a number of factors. Chief
    among these is that one instance of a given codec can be decoded in hardware at
    a given time. If the Music application is playing an AAC file from your iTunes
    collection, and your app starts playing an AAC file with an Audio Queue, your
    app will perform its decoding in software. You can inspect the availability of
    hardware decoding using AudioFormatGetProperty(); the Apple document “Technical
    Q&A QA1663: Determining the Availability of the AAC Hardware Encoder at Runtime,”
    details on how to get the needed properties and interpret the results.


    Not every codec is supported by hardware. AAC, Apple Lossless (ALAC), and MP3
    are all formats decoded by both hardware and software. Formats such as PCM, IMA4,
    μ-law, and α-law are uncompressed and don''t benefit from hardware decoding. iBC
    (Low Bitrate Codec), useful for VoIP apps, is software-only. On the other hand,
    High-Efficiency AAC (HE-AAC) does not have a software decoder in iOS 4 and, therefore,
    can be decoded in hardware; this means an iOS device can only play one AAC stream.


    Audio apps that use an AUGraph in the background keep running a different hardware
    to worry about. When the screen locks, the size of the data being rendered from
    1,024 samples (22 milliseconds at 44.1 kHz) to 4,096 samples (88 milliseconds).
    This is a power-saving optimization that the system doesn''t need to run at a
    screen-based refresh rate when the screen is off. An output-only AUGraph can glitch,
    in this case, because units are not typically prepared to produce this audio.
    The fix, as explained in Apple Q&A 606, is to set the kAudioUnitPropertyMaximumFramesPerSlice
    property to 4,096 on every node in your graph. Again, this affects only apps that
    use output-only AUGraphs and expect to keep running after the screen locks.


    # Summary


    This chapter covered a lot of material—but really, you brought a lot of it with
    you. The use of Audio Queues and Audio Units here is not much different from the
    material from Mac OS X in earlier chapters, and most of the code in these examples
    repeats and combines earlier examples. The syntax of these APIs is identical to
    what you covered before: What’s different is the semantics the ideas of application
    “backgrounding” and the single I/O device are unique to iOS. Even where this chapter
    dealt'
