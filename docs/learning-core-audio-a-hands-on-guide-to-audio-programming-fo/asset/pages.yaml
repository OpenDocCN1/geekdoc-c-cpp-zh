  md: '# An Audio Session Example


    +   - kAudioSessionCategory_AudioProcessing


    Used for apps that process audio (say, through an AUGraph) without actually recording
    or playing. It can continue processing in the background.


    # An Audio Session Example


    A lot of what makes iOS Audio programming unique is how you coordinate the rest
    of the system. A simple example exercises these traits. In fact, it''s so simple
    that it generates a sine wave, drawing on the Audio Queue player from Chapter
    5, "Playback," and the sine generator from Chapter 7, "Audio Units: Generators,
    Effects, and Rendering." But what''s different is that the app changes tone when
    it is sent to the background. This means you can do several things that are unique
    to iOS:


    +   - You need to negotiate with Audio Session Services for access to the hardware.

    - You need to adjust your app''s settings to inform iOS that you need to keep
    running in the background.

    - You need to react to messages that tell you the app has been foregrounded or
    grounded

    - You need to react to interruptions that take the audio system away from you,
    by incoming calls.


    # Setting Up the App


    There''s no thing like a command-line executable on iOS. To do the next thing
    and keep the example as simple as possible, you''ll use Xcode 4.2 calls an "Empty
    Application," which contains just an UIApplicationDelegate and a UI³.In the sample
    code, this is called CH10_iOSBackgroundTone, which means Xcode creates the Objective-C
    CH10_iOSBackgroundToneAppDelegate for you, with a header (.h) and implementation
    file (.m).


    You have a full-blown object, so that instead of a struct to pass state around:
    You can pass the app delegate object as the userInfo pointer to anything that''s
    going to drive callbacks; in the callback, you cast the pointer back to the app
    delegate and get its members as properties. Edit the header file (.h) as shown
    in Listing 10.1.


    ³ We assume you have a passing knowledge of IOS programming to read this chapter.
    If you need to get up to speed, we recommend IOS Programming: The Big Nerd Ranch
    Guide, from the good folks at, well, The Big Nerd Ranch (www.bneranch.com).'
