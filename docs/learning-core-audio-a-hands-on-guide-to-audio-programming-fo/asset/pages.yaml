  md: 'taking on all this responsibility, you give yourself the ability to do cool
    stuff. In the last section, you''ll build on this unit to get a taste of what''s
    possible down here in the dark depths of audio units.²


    # Mixing


    In the current play-through, your code actually sees the captured audio data twice:
    once in InputRenderProc() and again in GraphRenderProc(). If you wanted to perform
    some sort of DSP on the samples, you could do this in those functions (with the
    earlier prior before you have to complete your work fast enough not to block the
    real-time callback thread).


    Another option is to run those samples through audio units. For example, you could
    put the AUMatrixReverb effect that you applied to the synthesizer earlier at the
    front of the graph, to echo the captured audio.You do this by connecting the put
    unit to the effect and setting the render callback on the effect unit. When the
    graph runs, the callback gets the captured audio from the ring buffer and supplies
    it to the reverb unit, which performs its reverb and sends the modified samples
    to the output unit for play-out to the audio hardware. With an AUGraph at your
    disposal, it would be straightforward to apply any number of effects, from practical
    to silly, to the captured audio before its play-out through the output unit.


    So, far the graphs have been straight-line affairs. All the audio takes the same
    path through a sequence of nodes until it gets to the output unit. But that''s
    not the story of AUGraphs for your audio.You do this with an important type of
    audio unit: mixer units. In the abstract, these units combine multiple input streams
    of audio in some way and produce one or more streams of audio. Often mixer units
    take input buses and produce a single bus of output, or for noninterleaved stereo.
    Mac OS X supplies three standard mixers:


    +   - AUMixer: Mixes an arbitrary number of mono or stereo inputs and produces
    an arbitrary output.

    - AUMatrixMixer: Mixes an arbitrary number of inputs and produces an arbitrary
    number of outputs.

    - AUMatrix3D: Mixes an arbitrary number of sources and makes them sound as if
    they are positioned in a 3D sound field, relative to the listener. This unit is
    the basis of Core Audio''s implementation of OpenAL, which you''ll study in the
    next chapter.


    ² We tried to keep our example as simple as possible: Even with the next section''s
    bells and whistles, it''s for a more thorough example of these techniques, take
    a look at 500 lines of code. For Apple''s CAPThrough example (in your documentation
    bundle or on the Apple website), which is more than twice as long.'
