  md: '# 156 Chapter 7 Audio Units: Generators, Effects, and Rendering


    The callback function receives six parameters:


    +   - inRefCon:Your context (aka, user info) pointer.

    - ioActionFlags:A bit describing the purpose of the call. It''s often blank (0),
    and you can look up the possible values as the AudioUnitRenderActionFlags'' in
    the documentation or AUComponent.h.

    - inTimeStamp:AnAudioTimeStamp structure that indicates the timing of this call
    relative to other calls to your render callback.

    - inNumberFrames:Which bus (aka, element) of the Audio Unit is requesting audio
    data.

    - inNumberFrames:The number of frames to be rendered. Notice that this variable
    is prefixed with "in" instead of "io".That indicates this isn''t a case when you
    can render fewer frames and that situation by passing back the number of frames
    actually rendered. Your callback must provide exactly the requested number of
    frames.

    - ioData:AnAudioBufferList to be filled with data. You write your samples into
    the members of AudioBuffers contained in this struct. The list has a count of
    how many AudioBuffers are present, and each AudioBuffer has members for its channel
    count and byte size. Combined with inNumberFrames, you can figure out how much
    data can be safely written to these buffers.


    The function returns an OSStatus, which you can use to signal errors. One rule
    of the render callback is that you are expected to perform your work quickly.
    Audio cores call your callback on a real-time thread with a hard deadline; if
    you miss this deadline, you get silence.This also means that you cannot perform
    any action on a render callback that is known to take a long time or can take
    an indeterminate time. Particularly bad for render callback actions include:


    +   - File I/O

    - Network I/O

    - Large memory allocations or copies

    - Heavy use of Objective-C messaging

    - Format conversion (except between flavors of PCM)

    - Blocking threads


    > Author Chris puzzled for hours over a render callback that looked right but
    generated no sound. The problem was that each call generated hundreds of NSLog()
    messages, and the expense of the logging caused the callback to miss the deadline.
    As soon as he commented out the NSLog(), the program started working.'
