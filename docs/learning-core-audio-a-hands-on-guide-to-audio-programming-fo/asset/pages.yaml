  md: '# 7


    # Audio Units: Generators, Effects, and Rendering


    Chapter 1,"Overview of Core Audio," roughly divvied up Core Audio’s frameworks
    into two general groupings: "engine" APIs that process streams of audio through
    the system, and "helper" APIs that work with audio in different ways, as as performing
    conversions or doing file I/O. In Chapters 4, "Recording," and 5, "Playback,"
    you worked with the Audio Queue, a higher-level audio engine API, and in Chapter
    9, "Positional Sound," you’ll look at OpenAL, which is also a high-level engine.
    Audio Queues and OpenAL are both implemented atop Audio Units, the code that is
    arguably the heart of Core Audio Units are close to the most developers will ever
    need to get, and they afford opportunities to work with raw audio that are simply
    not practical at higher levels of abstraction.


    These two chapters dig deep into Audio Units by showing the many ways you can
    work with audio at this level. You’ll be able to synthesize audio, perform effects
    on audio streams, capture from the mic, mix multiple streams, and combine all
    these abilities. You’ll also see how working at this level shares many commonalities
    with higher-level Core Audio programming, but introduces some new responsibilities
    for handling memory and latency that you will need to keep in mind as you unleash
    newfound powers.


    # Where the Magic Happens


    Welcome to the lowest level of functionality Core Audio application developers
    need: the Audio Units API. The only levels lower than this on OS X are primarily
    of interest to programmers creating audio drivers. On iOS, it is not even possible
    to go lower than Audio Units.


    With Audio Units, we get very close to the metal, particularly if your original
    point of reference before this book was passing a file URL to SSound or AVAudioPlayer
    and forgetting about it. Here at the audio unit level, you work with callbacks
    that are called dozens or even hundreds of times a second, with raw samples'
  merge: -1
  pgno: 141
- img_proc: true
  md: '# Chapter 7 Audio Units: Generators, Effects, and Rendering


    can that be inspected and manipulated on the fly, with latencies that are so short
    they might be as instantaneous.


    Here at the heart of Core Audio, you can do things that are not practical, or
    simply not, with the higher-level abstractions. For example, if you wanted to
    mix two sounds and play them simultaneously, there is no straightforward way to
    do so with Audio Queues—you would have to use two queues, and even then, the API
    offers little control over their mutual synchronization. If you wanted to perform
    an effect on sound going through a queue, you would have to decompress PCM first
    (because encoded formats are not receptive to the kind of mathematical trickery
    used in creating audio effects), perform your effect, and then stuff the result
    into the queue—and even then, it wouldn''t be easy to chain multiple effects that
    share or your work with others.


    With the power of Audio Units comes a lot of challenge. Most readers will likely
    find these hardest chapters of the book and find Audio Units the hardest API to
    put to work successfully because the nature of Audio Units requires your code
    to take on so much responsibility. That''s why we take our time: We have prepared
    four example projects to execute a lot of different features of Audio Units.


    # How Audio Units Work


    You got an overview of Audio Units in Chapter 3


    An audio unit is a software object that performs sort of work on a stream of audio.
    For example, some units create stream of audio, others perform effects (such as
    echoes and rever), and a few special units interface with the audio hardware to
    capture audio from input devices or play it to devices such as headphones or speakers.
    Use Audio Units, create and set up the units you need, create connections between
    them, and tell them to start processing.


    This arrangement is to audio hardware in the real world. For example, imagine
    you have an electric guitar, a distortion box, and an amplifier. None of these
    does much by itself. But you could connect the guitar (a sound generator) via
    a cable to the input of the distortion box (which performs audio effects) and
    then connect it to the output of the amp (an output device). Flip on the power,
    strum a G major, and suddenly it''s "Hello, Heaven!


    Notice the purpose of each piece of hardware in this example. As with these devices,
    audio units are grouped into types that describe their purpose. Core Audio provides
    the following types of audio units:


    +   - Generator units: Create a stream of audio from some source, such as files,
    the network, or memory.


    +   - Instrument units: Similar to generator units, produce a stream of synthesized
    audio from MIDI data.'
  merge: -1
  pgno: 142
- img_proc: true
  md: '# How Audio Units Work


    +   - Mixer units: Combine multiple streams into one or more streams. The mix
    can be performed in two dimensions (for stereo panning) or in a simulated three-dimensional
    sound field.


    +   - Effect units: Perform some sort of digital signal processing on a stream,
    usually producing an audible effect such as a reverb, a pitch change, noise filtering,
    and so on.


    +   - Converter units: Perform transformations that are generally not meant to
    deliver user-audible effects. These include units to convert between different
    flavors of PCM (to change sample rate or for depth), adjust playback speed, and
    so on.


    +   - Output units: Interface with audio input and/or output hardware, enabling
    you to capture audio from input devices and play it to output devices. The name
    is somewhat of a misnomer because these are potentially input/output units.


    The last of these, the output units, are critical because they make all the other
    units do their work. As mentioned Chapter 3, Core Audio units with a pull model:
    Software objects that need audio samples pull from other objects. You saw this
    model with Audio Queues: When you start the queue, it starts pulling data from
    your code by means of callbacks. In Audio Units, an output unit pulls from another
    unit or by making a callback into your code.


    Consider the earlier analogy, with a guitar, distortion box, and amplifier represented
    as respectively. In the Core Audio model, the amplifier pulls from the effects
    box—you can''t pull sound from the guitar strings—but what if the guitar had a
    tiny buffer of the last few milliseconds of audio produced? In the case, the guitar
    could provide those samples to the effects box on demand, which would allow its
    distortion effect and hand the changed samples to the amplifier, which would start
    blasting them out. As the amp used up its samples, it would pull another buffer
    from the effects box, which would pull from the guitar, and so on.


    From here, you can see the possibilities. Imagine that you have not just a guitar,
    but a whole band—but still only one unit. In this case, you would need a mixer
    box with one output going into the amp. Into its first input, you could put the
    original distortion box and guitar chain; then you could put the singer''s mic
    into another input, the keyboard in another input, and so on. When the amp needed
    audio, it would pull from the mixer box, which would then pull from all of its
    inputs and mix them together, providing the resulting samples to the amp.


    Now that you introduce more units into this arrangement makes sense, such as putting
    an effect unit after the singer''s microphone or putting mics on multiple backup
    singers, using a second mixer unit to mix their streams into one and delivering
    that stream to the final mix. The possibilities really are endless.'
