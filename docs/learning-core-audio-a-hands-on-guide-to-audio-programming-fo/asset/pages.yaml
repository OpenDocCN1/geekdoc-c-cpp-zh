    own generator or effect? Fortunately, Core Audio lets you do that. In fact, there
    are several options: you can set render callbacks into your own code, or create
    your own units. The first option is much easier, whereas creating your units is
    going to be of interest to developers who intend to sell them to users, who in
    turn may require licensing and legal agreements with Apple. For this book, let''s
    stick to the approach that involves more code and less lawyers.


    # The Audio Unit Render Cycle


    So far, the effect and output units have needed input audio, you''ve supplied
