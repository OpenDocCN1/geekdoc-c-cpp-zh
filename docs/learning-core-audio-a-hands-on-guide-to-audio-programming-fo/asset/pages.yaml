    # Other iOS Audio Tricks


    Knowing your way around Audio Session and the specific behavior of RemoteIO unit
    records represent most of what is unique to the iOS platform. However, you need
    to be aware of a other interesting features—and a few hazards.


    # Remote Control on iOS


    iOS devices have optional hardware accessories that are meant to control audio
    playback applications. Examples include the default headset, which you can click
    to produce play, pause, next, and previous track events. Bluetooth and keyboards
    also allow play/pause, next, and previous buttons. Even without these accessories,
    you can generate these events by double-clicking the home button and swiping on
    the dock, which exposes soft/play, next, and previous buttons, as well as the
    icon of the active audio app.


    All inputs are UIEvents of type UIEventRemoteControl, with variety of subclasses
    that you include UIEventSubTypeRemoteControl,UIEventRemoteControlNextTrack, and
    so on.


    To opt in to for example, if you had a member of your responder chain—view, view
    controller, or even a custom subclass of UIApplication—be able to become the first
    responder by overriding canBecomeFirstResponder to return YES. Before becoming
    the first responder, your event-handling class needs to call [UIApplication beginReceivingRemoteControlEvents]
    to start receiving these events. The events are received in the callback method
    - UIResponder remoteControlReceivedWithEvent:], which passes in a UIEvent that
    you can play app, you might need to call UIEventRemoteControlPause by calling
    AudioQueuePause().


    Most of these devices have the capability to control volume, volume up and down
    buttons or a slider in the dock controls. The master gain volume of the device
    is not delivered to you as an event, nor are you able to call itmatically. The
    Media Player framework provides an MPVolumeView that you can add to a UIKit GUI
    and is bound to the system volume:Adjusting its sliders or lowers the system volume,
    and changing the volume via remote controls is reflected in the slider. If one
    or more Apple TV or other AirPlay device is in range of the device, this view
    also shows a route button that enables the user to send audio (and video) to a
    selected device.


    Bluetooth creates another complication. Bluetooth headsets are not used for your
    audio input. However, if you set your Audio Session category to allow recording,
    you can use a paired Bluetooth headset by calling AudioSessionSetProperty() to
    set the kAudioSessionProperty_OverrideCategoryEnableBluetoothInput property with
    a value of 1.'
