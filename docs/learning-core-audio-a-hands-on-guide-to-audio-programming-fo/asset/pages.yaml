  md: '# Chapter 9 Positional Sound


    That gives you a first taste of OpenAL. Time to recall what you''ve covered:


    +   - You converted an OpenAL file to a memory buffer of PCM samples.

    - You created an OpenAL source and a buffer, loaded the sample data into the buffer,
    and set properties on the source, buffer, and listener.

    - You started the source and updated its AL_POSITION to provide the illusion of
    a sound orbiting around the listener.


    Now you''ve covered these basics of OpenAL, you''re going to change how you deliver
    samples to the source, to open up a lot of new possibilities.


    # Streaming Audio in OpenAL


    Short sounds are fine for one-off sound effects or loops from sources that more
    or less indefinitely make the same sound. But that doesn''t account for the variety
    of sounds you might need to produce in OpenAL. What do you do for a sound that
    constantly changes, such as a synthesized sound, a song playing from a file, or
    a voice that might be received over a network connection? And what do you do if
    you don''t want to have to load the entire sound into memory and keep it? OpenAL
    sounds have to be PCM, so they consume a lot of space, even though they only mono.


    Well, you have a way to deal with this. Instead of supplying one block of data
    to a buffer and forgetting about it, you can stream audio to a source. The arrangement
    is a lot like the Audio Queues you worked with in Chapters 4, "Recording," and
    5, "Playback": You put data into OpenAL buffers and queue them up on a source.
    The source consumes, and when a buffer is used, you retrieve it and fill it with
    more data.


    OpenAL''s streaming API is different from what you''re already used. Pretty everything
    except your source, listener, buffer remains the same. The difference is, instead
    of setting a source''s AL_BUFFER property and forgetting about it, you call alSourceQueueBuffers()
    to queue one or more buffers on the source. The source plays these buffers in
    the order they were queued.


    That description sound a lot like "priming" the queue, as you did before with
    Audio Toolbox. The difference is in the refill cycle. In OpenAL you don''t register
    for callbacks with empty buffers to refill, with Apple''s API, you have to poll
    the source for consumed buffers, retrieve them yourself, and requue them on the
    source.You might complain that the timing of queue retrieve is not optimized;
    either you poll frequently and waste cycles, or you poll not frequently enough
    and get dropouts. Still, you are free to push in at any time whatever size data
    buffer fits instead of filling an exact number of samples for a callback.


