  md: '# 2


    # # The Story of Sound


    In the previous chapter, you got your first taste of the Core Audio API: what
    it offers, how to add it to a project, and how to call its functions. Now it''s
    time to take a step back and look at the bigger picture: the problems that Core
    Audio addresses in the first place.


    This chapter introduces the basic science of sound, what it is and how it works.
    As it turns out, the digital nature of computers makes them not well suited to
    processing continuous analog signals. This leads to the idea of sampling a signal,
    or chopping the smooth sound waves into discrete values frequently enough that
    the human ear can notice the difference. This chapter covers how samples are represented
    and arranged in digital form.


    It''s one thing to talk about samples and another to actually handle them, so
    the example project writes waves to a file, one sample at a time.


    Finally, you''ll wrap up with some of the issues that always arise with digital
    audio: buffers (and their inherent latency concerns) and the various kinds of
    digital audio formats.


    # ## Making Waves


    If you shove someone on the sidewalk, that person moves. But if you shove someone
    in a crowded place, such as at a concert, he bounces off the person in front of
    him and returns to his original position. This triggers a chain reaction as the
    force of your shove travels through the crowd, eventually hitting your your friend
    via a couple dozen annoyed proxies.


    In scientific terms, a bunch of objects close to bounce off each other is called
    a medium because the energy can travel through it. The movement of the person
    you shoved—first forward, then back—is called a cycle. The time it takes to complete
    a cycle is its period. If you pushed the person repeatedly, the pattern of people
    bouncing off each other would be a compression wave.


    This wave has two attributes. The strength with which you push is the wave''s
    amplitude. The speed with which you push is the wave''s frequency. The more frequently'
  merge: -1
  pgno: 43
- img_proc: true
  md: 'push, the higher frequency of the wave created as a result. If you varied the
    amplitude and frequency of your pushing, your friend would feel those changes.
    You would no longer be making waves; you''d be transmitting data over a medium.


    When you talk to someone, your vocal cords move back and forth, or vibrate, pushing
    molecules in the air. Those molecules bounce off each other like people at a concert
    until they hit your friend''s ear drums. Speakers and microphones are just machines
    that do the same thing. Sound is nothing but energy shoving its way through a
    medium.


    To record a sound, all you have to do is describe the way the sound makes a membrane
    vibrate. To play back the sound, you vibrate a membrane as described. One way
    to describe sound is to graph the position of the membrane over time, as shown
    in Figure 2.1.


    ![](img/3aee65cd19773a73ede853c5237a1e08_44_0.png)


    Figure 2.1 A sound wave as it relates to the position of a vibrating membrane


    The middle of the graph represents the resting state of the membrane. The top
    and bottom of the graph represent the maximum displacement of the membrane. As
    time moves'
