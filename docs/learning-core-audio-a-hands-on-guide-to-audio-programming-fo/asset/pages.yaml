  md: '# Working with I/O Input


    Now consider that any Mac can gain additional input and/or output devices via
    serial port connections. A user might plug in a FireWireSight (input-only device)
    or a USB headset (which does input and output). Other software devices also exist,
    such as the Soundflower driver that provides system audio capture to applications
    like Audio Hijack Pro by providing a virtual output device that copies offgoing
    audio to other applications before sending it to hardware. Ultimately, you cant
    make any assumptions about audio capabilities based on Mac model. The safer is
    to use the Audio Object API to either detect the default input or output device
    or iterate over all the devices with


    kAudioHardwarePropertyDevices property.

    One consideration to keep in mind is that an individual device can be capable
    of input, output, or both. USB headsets and most other devices (such as the Griffin
    Mic) are examples of the latter. Another technical difference arises, that a single
    device has one clock servicing its needs, input, output, or both. If discovered
    and used a device that does both input and output, you wouldnt need to take the
    asynchronous approach in this chapter because an output unit for this device could
    safely AudioUnitRender() on its corresponding output unit. This isnt''t a safety
    assumption on Mac OS, but iOS devices always have a single input/output device,
    which makes playthrough applications much easier to manage, as you will see in
    Chapter 10, "Core Audio on iOS."


    When you have the AudioDeviceID, you set it as the AUHAL kAudioUnitOutputUnitProperty_CurrentDevice,
    as shown in Listing 8.7. This associates the input unit with a specific audio
    device.


