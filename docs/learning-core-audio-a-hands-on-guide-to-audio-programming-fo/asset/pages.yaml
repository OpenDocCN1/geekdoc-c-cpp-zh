    \    \"AudioUnitSetProperty(kaudioUnitProperty_ScheduledFileIDs) failed\";\n```\n\
    \nNotice that AudioUnitSetProperty has similar semantics to the property setters\
    \ in previous chapters, such as those for audio files and audio queues. The first\
    \ two parameters are the unit you’re working with and the ID of the property to\
    \ set, and the last two are a void* to the property value and the size of the\
    \ value. In there are two unique fields: scope and bus. The scope identifies which\
    \ part of the audio property applies to: input (the unit), output (from the unit),\
    \ or global. The bus (technically called an element, but almost always in a bus\
    \ practice) refers to a numbered stream flowing into or out of it. In some cases,\
    \ the scope and/or bus might not matter. For the scheduled ID, the scope is global\
    \ and the bus is meaningless, so you use kAudioUnitScope_Global and 0, respectively.\n\
    \nNext, you schedule a region of the file to play (see Listing 7.15). The stealth\
