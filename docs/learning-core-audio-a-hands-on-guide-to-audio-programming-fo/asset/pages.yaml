  md: '# Summary


    The streaming example used a flat file as its source, but you can use any technique
    to provide data to the buffers, such as synthesized sounds, in which you write
    samples on the fly, or network sources, in which you get data over the network.
    In the latter case, imagine a virtual world where the radios play streaming web
    radio but you hear them differently as your onscreen avatar moves around them.


    OpenAL also has the distinction of being very low latency. It has to be, after
    all, to be of any use for gaming. In fact, OpenAL is implemented atop a 3D mixer
    audio unit, meaning that it''s a little easier to work with; you don''t have to
    deal with threading, callback timeouts, or ring buffers as you did in Chapters
    7,"Audio Units: Generators, Effects, and Rendering," and 8,"Audio Units: Input
    and Mixing." It wouldn''t be completely unreasonable to use OpenAL for general-purpose
    streaming audio in your application; it''s both performant and easy to port to
    and from other platforms.'
