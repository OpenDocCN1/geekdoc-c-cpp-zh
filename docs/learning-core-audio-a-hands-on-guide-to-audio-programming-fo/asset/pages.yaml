  md: '# Instrument Units


    261


    The status byte indicates the command, data1 and data2 deliver data specific to
    the semantics of the command. The simplest and most common events, channel voice
    messages, use the high nibble of the status to indicate a command and the low
    nibble to specify which of the 16 MIDI channels is effected. Assuming $n$ to represent
    the channel (0-F), these are some of the common messages:


    +   - 0x8n NOTE OFF: Stops playing a note

    - 0x9n NOTE ON: Starts playing a note

    - 0x8n POLYPHONIC AFTERTOUCH: Applies additional pressure to a note previously
    pressed

    - 0xCn PROGRAM AFTERTOUCH: Changes the patch number

    - 0x9n CHANNEL AFTERTOUCH: Indicates that several previously pressed keys have
    the greatest pressure

    - 0xEn PITCH WHEEL CHANGE: Applies variable pitch change


    data1 and data2 for these events depend on the particular status message. The
    NOTE ON and OFF messages, the bottom 7 bits of data1 are the specific note (where
    decimal 60 is middle C), and the bottom 7 bits of data2 are a velocity that indicates
    how quickly the key was struck or released (the high bit of data1 and data2 is
    always 1 for these messages).


    Many more messages exist, including more elaborate chords that can be sent with
    multiple messages. You can look them up at www.midi.org/techspecs/midimessages.php
    and through other formal and informal references.


    # Instrument Units


    It''s great to get send events via MIDI, but the initial purpose of the standard
    was to communicate musical data. When do you go to the music part? Core MIDI handles
    only the signaling; to make sound, you need to look elsewhere.


    You might recall Chapter 7, "Audio Units: Generators, Effects, and Rendering,"
    covered instrument units, an audio unit that can produce sound (similar to generator
    such as the AUFileplayer). The key to instrument units is that they respond to
    MIDI commands, so you can take incoming events and use instrument units to create
    sounds in response to those commands. This is another place where the advantages
    of audio units come into play. Low latency is crucial in performance to generate
    sound more or less immediately to an event that represents a musician''s press
    of a digital piano key or on a drum head.


    The glue that connects units is the Music Device API, which consists of just four
    functions in the MusicDevice.h header file (and, of Code 4.2, is not part of the
    OS X or iOS documentation bundle).MusicDeviceMIDIEvent function takes an instrument
    unit and the 3 bytes of a MIDI message, and makes the instrument act on the command:
    if its status is NOTE ON, it starts playing the note specified by data1 with the
    velocity in data2; if it''s NOTE OFF, it stops.'
