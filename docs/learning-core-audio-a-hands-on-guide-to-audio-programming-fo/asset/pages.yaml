    # Audio Hardware Devices


    We''ve repeatedly talked about having multiple audio "devices," and you might
    think that this doesn''t really apply to you. After all, if you have a MacBook,
    you don''t have a bunch of different devices, right? Wrong. Even a stock MacBook
    has two input devices: the built-in internal microphone and a built-in line-in
    jack. There''s also a built-in output, which plays over internal speakers unless
