- img_proc: true
  md: '# Digital Audio


    Digital audio shares these issues. A monural sound wave is a grayscale image,
    by many systems have multiple speakers. Just as a pixel requires channels for
    red, blue, and green, stereo sound requires channels for left and right. Surround
    sound adds extra channels. A 5.1 surround-sound signal has six channels: left
    and right channels for the front and rear, a center channel, and a nondirectional
    channel for low-frequency effects, known to aficionados simply as bass.


    As their graphical deathen, audio formats typically combining one sample per channel
    into a bundle, called a frame. Whereas a pixel represents all colors in one space,
    a frame represents all audio channels at one moment in time. For mono sound, a
    frame has one sample; for stereo, it has two. If you put multiple channels of
    one sound, you have the channels interleaved. This is common for playback: Because
    you want to read all the channels at the same time, it makes sense to arrange
    the data to do this easily. However, when processing audio (as when adding effects
    or do some other processing), you might want noninterleaved audio so that you
    can focus on each channel in isolation.


    Some audio combine multiple frames as packets. This concept is entirely of a given
    audio format and represents an individual unit within that format. PCM uses packets,
    but compressed audio formats use techniques often be predicted to some degree
    by around it, compressed formats can use groups of samples, arranged in frames,
    to produce a similar (if not identical) wave from much less data than the uncompressed
    PCM format.


    We mentioned the bit rate early, the amount of data over a given period of time
    to represent audio in format. For PCM, the bit rate is constant: CD-quality audio
    has a bit rate of 1,411,200 bits per second, or 1,411 kbps, it has 2 channels
    × 16 bits × 44,100 samples per second. PCM is to have a constant bit rate because
    this data rate never changes for a combination of channel count, bit depth, and
    sample rate. Compressed formats use a variable bit rate, meaning that the amount
    of data needed to compress any particular part of the data changes. Core Audio
    supports variable frame rate:The amount of data for any frame may vary, the packets
    remain the same size. Core Audio also supports variable packet rate, in when even
    the packet may change. currently no variable packet rate in widespread use.


    One reason to care about this difference is that constant bit rate (CBR) data
    employs simple API calls than variable bit rate (VBR). For example, when you read
    audio data from a file or stream,VBR data supplies that help you figure out what
    samples go with what times. For CBR, this is unnecessary; the amount of data for
    every frame is constant, so you can find a given sample''s time by multiplying
    the frame size by the time.'
