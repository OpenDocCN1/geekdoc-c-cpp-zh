  md: 'If the user leaves the app to take a call, the interruption results in a stopped
    audio queue; its access to the audio session is cut off. To get the tone going
    again when you come to the foreground, you need to reassert yourself to the audio
    session. Instead of initializing the audio session again, it''s just enough to
    say "I''m active" via the AudioSessionSetActive() call. Then you can use AudioQueueStart()
    to get the queue going and reset the frequency. Calling AudioSessionSetActive()
    and AudioQueueStart() if you weren''t stopped by an interruption is harmless,
    so you can call them any time you enter the foreground, even if the user has been
    switching apps and never interrupted you.


    With these methods written, the example is ready to go. Run it on your device
    with Xcode, and try backgrounding and foregrounding the app to hear the tone change.
    If you''re on an iPhone, you can try the interruption by calling yourself from
    another phone. Another way to run an interruption is to run app whose audio session
    categories exclude access to audio output—games are often a good example of this.


    # Audio Units on iOS


    Aside from with Audio Sessions, the other big change on iOS is how Audio Units
    work. Not that the API is any different—it''s exactly the same as you studied
    in Chapters 7 and 8—but what you can do with audio units. Several of the major
    types of units, such as generators, are completely absent; others have only a
    few units available. For example, Mac OS X offered, whereas a large set of effects
    units (including the reverb unit that you played in Chapter 7), iOS 4 has only
    one.⁵


    The bad news: iOS has far fewer system-provided audio units. Here''s a list of
    the seven—yes, just seven—audio units you get on iOS 4:


    +   * Remote I/O: The iOS equivalent of AUHAL, providing capture and playback;
    with one audio device, however, it doesn''t need the HAL abstraction. You''ll
    be using this later in the chapter.

    * Voice Processing I/O: Similar to Remote I/O, with addition of echo cancellation
    filters that make it ideal for voice-over-IP applications.

    * Generic I/O: Just as OS X, this is an output unit that''s not connected to hardware.
    You can put it at the end of an AUGraph and pull samples through the graph with
    AudioUnitRender().


    +   * iPod: Performs the same audio equalization as the built-in Music or iPod
    app, enabling the user to choose from a set of canner equalizer settings, such
    as Bass Booster and Spoken Word.


    ⁵ The situation is significantly better in iOS 5, as you''ll see in the final
    chapter.'
