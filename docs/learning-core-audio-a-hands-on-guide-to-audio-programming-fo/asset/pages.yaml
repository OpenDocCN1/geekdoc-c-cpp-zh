  md: '# Audio Units: Input and Mixing


    In the previous chapter, you took on Core Audio''s ultimate level of responsibility
    by employing Audio Units in your program. Audio Units are ultimately responsible
    for all Core Audio''s audio-processing abilities: low-latency capture and play-out,
    audio synthesis, effects, and so on. It is the most difficult form of Core Audio
    programming, both conceptually and in terms of specifics: managing unit scopes
    and busses to handling the real-time demands of render callbacks, there are lots
    of new and frustrating ways for your code to fail.


    By the end of this chapter, we hope you will find that the powerful stuff is worth
    it. In your chapter, you continue your study of audio units with new capabilities.
    First, you will use output units to capture audio from input devices as microphones
    and audio-cameras. To do this, you''ll also get a glimpse of the APIs that provide
    a consistent Core Audio interface to many kinds of I/O technologies. You''ll also
    get to push your luck with asynchronicity as you process input and output on different
    callback threads—and still get the samples from one unit to the another. We will
    wrap up by employing mixer units, which combine multiple streams of audio and
    enable you to mix your audio into sources that can be played out a pair of speakers
    or headphones.


    > Note

    If you thought the chapters leading up to this one were tough, you haven''t seen
    anything yet. This tests your will. For this one, we''ve had to bring in threading
    concerns, hardware APIs, and even some C++. Super gross! It''s okay if you want
    to not read it for the big picture, then again for the nifty-gritty details. And
    you might not be able to put these techniques to use yourself until you actually
    worked through our big example, because little details and gotchas abound.


