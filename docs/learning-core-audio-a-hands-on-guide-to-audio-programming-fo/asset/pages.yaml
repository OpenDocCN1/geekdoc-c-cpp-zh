  md: 'In C, you don''t have classes, object orientation, implementation hiding, or
    many of the other language traits that most developers have depended on for years.
    Core Audio, like Apple''s C-based frameworks, does provide a measure of these
    modern traits, even within the C idiom.


    Apple''s Core framework is Foundation, which underlies Foundation, the essential
    Objective-C framework that nearly all Mac and iPhone applications use. You''ll
    recognize Foundation by classes using NSString, NSURL, NSDate, and NSObject. In
    many cases, the Object-C classes enable their functionality by calling Core Foundation,
    which provides opaque types (pointers to data structures members are hidden) and
    functions that work on these objects. For example, NSString is literally the same
    as a NSStringRef (you can freely cast between the two), and its length method
    is moving equivalent to the function NSStringLength(), which takes a NSStringRef
    as input. By combining these opaque types with consistent naming conventions for
    functions, Core Foundation provides a highly manageable C API with a clarity similar
    to what you''d use in Cocoa.


    Core Audio is highly similar in its design. Many of its most important objects
    (such as audio and queue files) are treated as opaque objects that you handle
    by named functions, such as AudioQueueStart() or AudioFileOpen(). It''s not explicitly
    built atop Foundation—an AudioQueueRef is not a CF opaque type; however, it does
    make use of CFs'' most important objects, such as CFString and CFURLRef, which
    can be trivially cast to and from NSStrings and NSURLs in Cocoa code.


