  md: '# Foreword


    Reflect for a minute on your craft. Think of those in ages past who shared the
    same experiences. Think of the painters who drove themselves mad trying to gather
    the forces within to produce something of meaning. Think of the industrialists,
    who believed they were standing at the dawn of a new age, one that they finally
    access the magic tricks. Think that they themselves were capable of building.


    Think of the ancient acolytes of magic, seeking to unlock the power in arcane
    knowledge. Think of that moment when, having learned street tricks such as flow
    control and data structures, you finally gained access to the API libraries. In
    a room of musty books.


    It''s one of those key moments in any programmer''s career, crashing until footh
    to see the mountain before. It is the daunting realization that programming is
    a lifelong journey of learning. Many would-magicians simply turn around and head
    out the door, leaving that world behind to pursue a more normal life of pursuits.


    That you have found here suggests you are part of the other group, a select few
    blessed with some geometric predisposition to solving hard problems. They are
    the ones who cross the threshold and enter that world, losing themselves to learning
    new spells and exploring new kinds of magic.


    For what is programming magic? Wield secret words to command powerful forces you
    just barely understand, calling forth the spirits of bygone spell casters to ease
    your burdens, simplify your workflows, and grant you the ability to sunrise and
    delight the masses.


    As you pore over each technique, practicing new forms of magic, you start combining
    them with things you learned before creating spells, unlocking new possibilities.
    Every you learns to learn new tricks, to new roads into other roads, until one
    day you run into a dead end.


    Many of the ancient texts refer to dark arts as audio programming but do not deal
    with them directly. As Core Audio, there seem to be no books on the subject, no
    scrolls of spells or sample code to practice. There are plenty of cases for audio
    programming, but black magic, the only materials you can find about it are terse
    and confusing.


    Chris Adamson tracked a practitioner of the audio arts Kevin Avila, a graying
    wizard well versed in C. Through a combination of bribery and honest inquiry,
    he established himself as a protégé. The rabbit hole he entered goes on forever,
    and as his'
