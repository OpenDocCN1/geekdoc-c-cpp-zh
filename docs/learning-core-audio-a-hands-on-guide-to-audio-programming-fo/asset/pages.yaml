  md: '# 11


    # Core MIDI


    Music is one of the primary reasons to even have audio frameworks on Mac and iOS.
    Many APIs will be of great use to musicians, Audio Units and Augraphs enable you
    to mix audio and add effects, Audio Conversion lets you export your sound to formats
    users can enjoy on their devices, and Open AL can put you in a virtual concert
    environment.


    That said, one thing musicians really want from an audio platform is the capability
    to connect their instruments to the system that their keyboards, drum kits, and
    other devices can play into or even played by the computer. For decades, the way
    to do this has been through MIDI, a widely adopted standard for adapting musical
    performance as digital events. MIDI does not record or play sounds; it signals
    events that represent the music itself. And it''s really good at what it does.


    OS X and iOS both implement Core MIDI, which enables your software to interact
    with MIDI devices. This chapter shows how Core MIDI works and how it ties into
    the rest of Core Audio to create a complete software platform for music apps.


    # MIDI Concepts


    MIDI (pronounced "mid-e") is an acronym for Musical Instrument Digital Interface.
    It is an industry-standard digital communications protocol that enables musical
    instruments (synthesizers, drum machines, control surfaces, and so on), computers,
    and software to exchange information and control signals.


    It''s important to understand that MIDI isn''t music and does not contain any
    audio sounds. It''s nothing more than a set of events, or instructions, that tell
    a device how to perform an action. For example, a Note On message indicates that
    a note from an instrument has been played. Likewise, the corresponding Note Off
    message indicates that the note is not playing.


    To start, you need to be familiar with the common terms of MIDI. Here are the
    main ones:


    +   * Synthesizers and controllers: These are the basic types of devices that
    generate MIDI data. The primary difference between them is that synthesizers generate
    both MIDI data and audible sound, whereas controllers generate only'
  merge: -1
