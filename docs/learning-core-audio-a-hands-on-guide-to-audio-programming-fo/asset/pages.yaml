  md: '# Chapter 4 Recording


    Because audio data travels in a constant stream, a queue is the perfect data structure
    to represent it.


    The software end of an audio queue is the normative queue of buffers. Each buffer
    is a block of memory that holds the actual data and bookkeeping information about
    the buffer and its contents.


    Figure 4.1 illustrates the Audio Queue architecture. Buffers move from the queue
    into the audio queue. The buffer is filled with data from the audio hardware and
    then passed into your callback function. Your callback function sends the audio
    data “elsewhere” and puts the buffer at the back of the audio queue.


    ![](img/3aee65cd19773a73ede853c5237a1e08_78_0.png)


    Figure 4.1 The Audio Queue architecture


    In Figure 4.1,"Elsewhere” could be functions or methods in your application, in
    another application, or wherever. For the sake of this example, you’re wrapping
    the data in an audio file and sending it to the filesystem. In your application,
    the filesystem not necessarily be involved:You use the received buffers to perform
    some kind of analysis(such as a frequency analyzer or a Karaoke game) or send
    them over the network to a VoIP peers.


    # Building a Recorder


    It’s important to see an audio queue for what it is in the grand scheme of things.
    It’s not an API for playing and recording—it’s one level lower than that. It’s
    the interface that players and recorders use. Using an audio queue is not like
    using a recorder—it’s like building a recorder.'
