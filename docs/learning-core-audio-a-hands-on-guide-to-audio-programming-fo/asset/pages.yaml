  md: '# Playing Nicely with Others: Audio Session Services 225


    represents the app''s access to use of the device''s audio system. The functions
    enable you to do the following:


    +   - Initialize the audio session

    - Set whether the session is active (producing and/or receiving audio)

    - Get and set property values


    That''s pretty much it, but as with the other Core Audio APIs, getting and setting
    of properties provides a great deal of functionality. These are some of the most
    important properties:


    +   - kAudioSessionProperty_AudioInputAvailable

    ifies whether the device is capable of audio capture. Many iOS devices with built-in
    microphones (including all iPhones and iPads), but on early iPod touch models,
    audio input is available only if you attach a headset with a microphone or some
    external device.


    +   - kAudioSessionProperty_CurrentHardwareSampleRate

    kAudioSessionProperty_CurrentHardwareInputNumberChannels

    kAudioSessionProperty_CurrentHardwareOutputNumberChannels

    kAudioSessionProperty_CurrentHardwareOutputVolume

    kAudioSessionProperty_CurrentHardwareInputLatency

    kAudioSessionProperty_CurrentHardwareOutputLatency

    kAudioSessionProperty_CurrentHardwareIOBufferDuration

    Read-only properties that report various details about the audio hardware.


    +   - kAudioSessionProperty_PreferredHardwareSampleRate

    kAudioSessionProperty_PreferredHardwareIOBufferDuration

    Settable properties for adjusting audio hardware properties.


    +   - kAudioSessionProperty_AudioRoute

    The current output (and possibly input) route as a read-only CFString ("Headphone",
    "Speaker", "HeadsetInOut")


    +   - kAudioSessionProperty_OverrideAudioRoute

    A write-only property that enables you to change the audio route to either kAudioSessionProperty_OverrideAudioRoute_Speaker
    or kAudioSessionPropertyOverrideAudioRoute_None (which means using the normal
    audio route for the current hardware).


    In Chapter 4, the hardware sampling rate property comes from the Audio Object
    API, and we noted that iOS had an alternative approach for that. These properties
    are alternative.'
