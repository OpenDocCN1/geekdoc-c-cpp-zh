    \ to a local variable called appDelegate and call its fillBuffer method, which\
    \ you wrote back in Listing 10.10. With the buffer filled, you give it back to\
    \ the queue with AudioQueueEnqueueBuffer().\n\nSo far, this app could run back\
    \ on Mac OS X, as you started with a Cocoa application template, skipped the ios-specific\
    \ Audio session, and dealt with the difference in same formats (for instance,\
    \ you declared an AudioStreamBasicDescription that used signed ints, or you rewrote\
    \ fillBuffer to use floats). The higher-level APIs as Audio Queue really are the\
    \ same on both platforms.\n\nNow let's get into ios nitty-gritty.\n\n# Handling\
    \ iOS Interruptions\n\nWhen we created the audio session, we provided a function\
    \ pointer to MyInterruption Listener (). This function is typedefed as AudioSessionInterruptionListener;\
    \ it takes a user-info pointer and a UInt32 inInterruptionState and returns void.\
    \ The interruption state indicates whether an interruption is beginning or ending.\
    \ The idea is that an event such as an incoming phone call might cause your app\
    \ to access the audio system, so it plays the ring tone and you dont worry about\
    \ your app wants. However, it doesn't kill the app outright, because the user\
    \ might choose to decline the call. In this case, the interruption ends and you\
    \ get a second callback.\nThe start of an interruption automatically stops playback\
    \ engines as OpenAL or your Audio Queue, so you don't have to do anything special\
    \ in that case. Elaborate audio apps might have some teardown or state maintenance\
    \ to perform, however. If and\nwhen the interruption ends, you need to restart\
    \ the audio queue. Listing 10.13 shows\nsimpleple handling of these cases.\n\n\
    Listing 10.13 Handling Audio Interruptions\n\n```\nvoid MyInterruptionListener(void\
    \ *userData,\n\tUInt32 inInterruptionState) {\n\tprintf(\"Interrupted:%d\\n\"\
    , inInterruptionState);\n\tCH10_iOSBackgroundToneAppDelegate *appDelegate =\n\t\
    (CH10_iOSBackgroundToneAppDelegate)*userData;\n\tswitch (inInterruptionState)\
    \ {\n\tcase kAudioSessionBeginInterruption:\n\t\tbreak;\n\tcase kAudioSessionEndInterruption:\n\
    \t\tCheckError(AudioQueueStart(appDelegate.audioQueue, 0),\n\t\tprintf(\"Couldn't\
    \ restart the audio queue\\\");\n\t\tbreak;\n\tdefault:\n\t\tbreak;\n\t}\n};\n\
    ```"
