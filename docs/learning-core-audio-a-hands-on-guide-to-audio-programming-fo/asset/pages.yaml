  md: '# Chapter 8 Audio Units: Input and Mixing


    callback. Another important way to get sound into an Audio Unit or AUGraph is
    to perform capture from an input device. That''s what you''ll spend most of this
    chapter doing.


    You might think capture devices are considered generator units, but combing through
    the list of system-supplied units reveals they''re not there. Then you might say
    "Okay, we have output units to go out to speakers or headphones, so there must
    be input units, too." But there aren''t. In an unfortunate bit of naming, from
    input devices are actually supplied by output units. For this reason, there''s
    an informal tendency to refer to them as I/O units, even though their unit type
    is kAudioType_Output.


    In this example, you start with a simple graph that captures from the user''s
    default device and is connected to the generic output unit as usual. Figure 8.1
    shows this arrangement.


    ![](img/3aee65cd19773a73ede853c5237a1e08_180_0.png)


    Figure 8.1 Conceptual AUGraph for play-through of captured audio


    Notice that the input audio is called AUHAL. The Hardware Abstraction Layer (HAL)
    is an abstraction over the underlying I/O details of audio hardware devices. Your
    input and output devices might include various I/O technologies—a USB microphone,
