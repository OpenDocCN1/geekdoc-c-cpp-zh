  md: "# ## Writing the Play-Through App’s Render Callback\n\nThe task for the render\
    \ callback is simple:When the output unit needs some samples to play, you retrieve\
    \ a suitably large set from the CARingBuffer, where the input callback has written\
    \ them.\n\nThe first task to do in Listing 8.21 is to perform the same calculation\
    \ that you did in Listing 8.16. As a reminder, the reason for this is that the\
    \ timestamps used by the input and output units might be different. Because the\
    \ input callback is storing samples into the ring buffer with the time stamps\
    \ it gets from the input unit, the output unit might need to adjust the time stamps\
    \ it requests from the ring buffer.\n\n# Listing 8.21 Adjusting Time Stamp Offsets\
    \ in Render Callback\n\n```\nOSStatus GraphRenderProc(void *inCon,\n\tAudioUnitRenderFlags\
    \ *ioActionFlags,\n\tconst AudioTimeStamp *inTimeStamp,\n\tUInt32 inNumber,\n\t\
    UInt32 inNumberFrames,\n\tAudioBufferList *ioData)\n\nMyAudioPlayer *player =\
    \ (MyAudioPlayer*)inCon;\n\n// Have we ever logged output timing? (for offset\
    \ calculation)\nif (player->firstOutputSampleTime < 0.0) {\n\tplayer->firstOutputSampleTime\
    \ = inTimeStamp->mSampleTime;\n\tif (player->firstInputSampleTime > 0.0) {\n\t\
    player->inOutSampleTimeOffset =\n\t\tplayer->firstInputSampleTime - player->firstOutputSampleTime;\n\
    \\}\n```\n\nAside, this offset calculation needs to run only once, the first time\
    \ in either callback that both firstInputSampleTime and firstOutputSampleTime\
    \ have values other than the -1 flag you initialized them with.\n\nAside from\
    \ the possible offset calculation, the real work of this callback is to fetch\
    \ samples from the ring buffer. This is a one-line call to the CARingBuffer’s\
    \ Fetch() method, as shown in Listing N.22.\n\n# Note\n\nThe three-argument version\
    \ of Fetch() is the one provided by the corrected version of CARingBuffer, as\
