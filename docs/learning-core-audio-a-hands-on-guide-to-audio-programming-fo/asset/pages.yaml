  md: '# Overview of Core Audio


    Core Audio is the engine behind any sound played on a Mac or iPhone OS. Its procedural
    API is exposed in C, which makes it directly available in Objective-C and C++,
    and usable from any other language that can call C functions such as Java with
    the Native Interface, or by RubyInline. From an audio standpoint, Core Audio is
    high level because it is highly atomic. It abstracts away the implementation details
    of the hardware and the details of individual audio formats.


    To an application developer, Core Audio is suspiciously low. If you''re coding
    in C, you''re doing something wrong, or so the saying goes. The problem is, with
    very little use cases above Core Audio. Audio turns out to be a difficult problem,
    and all the trivial cases require more decision making than the quickest Objective-C
    framework. The good news is, the times you don''t need Core Audio are easy enough
    to spot, and the tasks you can do without Core Audio are pretty simple (see sidebar
    "When Not to Use Core Audio")


    When you use Core Audio, you''ll likely find it a different experience from nearly
    anything else you''ve ever called in other C-based Apple frameworks, such as Quartz
    or Core Foundation, you''ll likely be surprised by Core Audio''s style and conventions.


    This chapter looks at what''s in Core Audio and where to find it. It broadly surveys
    some of its most distinctive conventions, which you''ll get a taste for by writing
    a simple application to exercise Core Audio''s capability to work with audio metadata
    in files. This will give you your first taste of properties, which enable you
    to do a lot of the work through the book.


    # When Not to Use Core Audio


    The primary scenario for not using Core Audio is simply playing back from a file:
    On a Mac, you can use AppKit''s NSSound, and on iOS, you can use the AVAudioPlayer
    from the AV framework. iOS also provides the AVAudioRecorder for recording to
    a file. The Mac has no equivalent Objective-C API for recording, although it does
    have QuickTime and''; you could treat your audio as QTMovie and pick up some playback,
    recording, and mixing functionality. However, QuickTime''s video orientation and
    its'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# Chapter 1 Overview of Core Audio


    philosophy of being an editing API for multimedia documents makes it a poor fit
    for purely audio tasks. The same can be said of AV Foundation''s AVPlayer and
    AVCaptureSession which debuted in iOS 4 and became the heir apparent to QuickTime
    on Mac in 10.7 (Lion).


    Beyond the simplest playback and recording cases—and, in particular, if you want
    to do anything with the audio, such as mixing, changing formats, applying effects,
    or working directly with the audio data—you''ll need to adopt Core Audio.


    # The Core Audio Frameworks


    Core Audio is a collection of frameworks for working with digital audio. Broadly
    speaking, you can split these frameworks into two groups: engine APIs, which process
    streams of audio, and helper APIs, which facilitate getting audio data into or
    out of these engines or working with them in other ways.


    Both the Mac and the iPhone have three low-level APIs:


    +   - Audio Units. Core Audio does most of its work in this low-level API Each
    unit receives a buffer of audio data from somewhere (the hardware, another audio
    unit, a callback to your code, and so), performs work on it (such as applying
    an effect), and passes it to another unit. A unit can potentially have many inputs
    and outputs, which makes it possible to multiple audio streams into one output.
    Chapter 7, "Audio Units: Generators, Effects, and Rendering," talks more about
    Audio Units.

    - Audio Queues. This is an abstraction audio units that make it easier to record
    audio without having to worry about some of the threading challenges that arise
    when working with the time-constrained I/O audio unit. With an audio queue, you
    record by setting up a callback function to receive buffers of data from the device
    every new data is available; you play back by filling buffers with audio data
    and handing them to the audio queue. You will do both of these in Chapter 4, "Recording."

    - OpenAL. This API is an industry standard for creating positional, 3D audio (in
    other words, surround sound) and is designed to resemble the OpenGL graphics standard.
    As a result, it''s ideally suited for game development. On the Mac and the iPhone,
    its actual implementation sets atop audio units, working exclusively with the
    OpenAL API gets surprisingly far. Chapter 9, "Positional Sound," covers this in
    more detail.


    To get in and out of these engines, Core Audio provides various helper APIs, which
    are used through the book:


    +   - Audio File Services. This framework away the details of various container
    formats for audio files. As a result, you won''t have to write code that addresses
    the idiosyncrasies of AIFFs, WAVs, MP3s, or any other format. It enables your
    program to open an audio file, or set the format of the audio data it contains,
    and start reading or writing.'
  merge: -1
  pgno: 32
