    As you can see, there''s an extraordinary amount of audio processing power just
    in the Apple-powered units. Also keep in mind that applications as Logic and Garage
    Band and third-party developers can provide additional audio units to further
    extend Core Audio''s capabilities.


    Some of the features provided by audio units are quite advanced and used for specific
    audio needs. For now, we''ll take slow and add complexity (more units) as we go.


    # # Your First Audio Units


    Let''s begin with a fairly basic exercise to get started with Audio Units. You''ll
    use one generator unit and one output unit: one to create sound and another to
    deliver it to the user.


    For this example, we want an output unit and a generator unit. For output, Table
    7.7 shows a DefaultOutputUnit that sends samples to the output device specified
    in the "Sound" system preference. That is what we need. For generators, Table
    7.1 offers AVAudioFilePlayer, described as "a unit that obtains and plays audio
    data from a file" Let''s use that one.


    Figure 7.1 shows the units and their relationships graphically.

    Drawing a graph of units in this way leads to an important helper API: Audio Processing
    Graph, often you use AUGraph. Although you can work with individual audio units,
    you need to coordinate the activity of groups of units and their relationships.
    An AUGraph provides exactly these features. This makes it easy to create connections
    between audio units—which are wrapped in AUNodes in the graph—and start and stop
    the entire collection of units at time. You''ll use AUGraphs throughout this chapter,
    but keep in mind that its use is just a convenience: the calls to the graph and
    its nodes always have equivalent operations that work on individual units.


    Note that most of Apple''s "standard" units are not available on iOS. Chapter
    10 looks at Audio Units on iOS.'
