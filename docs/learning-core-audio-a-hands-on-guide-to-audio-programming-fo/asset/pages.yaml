    The interval between those time stamps is a pretty constant 0.0116 milliseconds,
    meaning that you''re being called back every 11.6 milliseconds or so. Keep this
    in mind when you write your callbacks; the time involved in render callbacks are
    several orders of magnitude smaller than what''s required by operations such as
    opening an Internet connection or spinning a stopped hard drive. On the other
    hand, enjoy the fact that this frequency is on the same order of magnitude as
    your screen refresh rate. Virtually no latency is involved in working with audio
    units, which means no delay between rendering samples and getting them to the
    user''s ears. For some kinds of applications, that critically important; musicians
    couldn''t work with tools or virtual instruments that have a noticeable lag between
    performing actions and hearing sound, and gamers would hate having sounds out
