  md: '# 10


    # Core Audio on iOS


    Although it started on Mac OS X, Core Audio is at least as important—and maybe
    more so—on iOS, where its low latency and extreme efficiency are a phenomenally
    good fit for the limited environment that exists on mobile devices such as the
    iPhone, iPod touch, and iPad. It was the first media API available when Apple
    opened the iPhone''s SDK, and for a lot of apps, it''s still the right choice.


    This chapter looks at how you can immediately put to use on iOS everything you''ve
    already learned.Then it moves to the traits that are specific to iOS, including
    its simplified hardware abstraction, its strengths and limits, and how you collaborate
    with other apps to share the device audio system.


    # Is That Core Audio in Your Pocket?


    If you think of yourself primarily as an iOS developer, you might feel as if you''ve
    been toughing out for the first nine chapters of this book, enduring all this
    “Mac stuff” as you worked through command-line based examples. The iPhone doesn''t
    have a command-line,ferryninoutloud!


    We''d like to thank you for your patience. You''ve finally arrived at the iOS
    chapter. We''d also like to congratulate you. If you worked through the first
    nine chapters, you now know most of Core Audio on iOS already.


    Core Audio on iOS is really similar to its original form on OS X—really, really
    similar. Consider the following APIs:


    +   - Audio File Services

    - Audio Conversion

    - Extended Audio File Services

    - Audio Queue Services

    - Audio Units

    - Audio Unit Graphs

    - OpenAL'
