  md: '# Core Audio Conventions


    +   * Audio File Stream Services. If your audio is coming from the network, this
    framework can help you figure out the format of the audio in the network stream.
    This enables you to provide it to one of the playback engines or process it in
    other ways.


    +   * Audio Converter Services. Audio can exist in many formats. By the time it
    reaches the audio engine, it needs to be in an uncompressed playable format (LPCM),
    discussed in Chapter 2, “The Story of Sound”. Audio Converter Services helps you
    convert encoded formats such as AAC or MP3 and the uncompressed raw samples that
    actually go through the audio units.


    +   * Extended Audio File Services. A combination of Audio Converter Services
    and Audio File Services, the enables you to read or write to audio files and do
    a conversion at the same time. For example, instead of reading AAC data from a
    file and then converting to uncompressed PCM in memory, you can do both in one
    using Extended Audio File Services.


    +   * Core MIDI. Most of Core Audio frameworks are involved with processing sampled
    audio you have received from other sources or captured from an input device. With
    the Mac-only Core MIDI framework, you synthesize audio on the fly by describing
    musical notes and how they are to be played out—example, whether they sound like
    they are coming from a grand piano or a ukulele. You’ll try out MIDI in Chapter
    11,“Core MIDI.”


    A few Audio frameworks are platform specific:


    +   * Audio Session Services. This iOS-only framework enables your app to coordinate
    with its use of resources with the system. For example, you use this API to declare
    an audio “category”, which determines whether iPod audio can continue to play
    your apps and which the ring/silent switch silences your app. You’ll use this
    in Chapter 10,“Core Audio on iOS.”


    As you develop your application, you will combine these APIs in interesting ways.
    For example, you could use Audio File Stream Services to get the audio data from
    a net stream and use OpenAL to put that audio in a specific location in a 3D environment.


    # Core Audio Conventions


    The Core Audio frameworks are exposed as C function calls. This makes broadly
    available to Cocoa, Cocoa Touch, and Carbon apps, which you have to be ready to
    deal with all the usual issues of procedural C, such as pointers, manual memory
    management, structs, and enums. Modern developers have cut their teeth on object-oriented
    languages like Objective-C, C++, and Python, so it’s no longer a given that professional
    programmers are comfortable with procedural C.'
