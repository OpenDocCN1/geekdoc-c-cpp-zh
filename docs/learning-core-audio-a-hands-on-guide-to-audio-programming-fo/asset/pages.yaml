  md: '# Playback


    In the previous chapter, you learned how to record audio with an Audio Queue,
    the highest level of Core Audio''s engine APIs. An audio queue uses a queue of
    buffers to process a stream of audio: Your application sets up the queue by providing
    it with these buffers, and the queue sends a buffer to a callback function in
    your code when it''s time for you to act on it.


    All this applies to recording, but it also applies to playback, which is the other
    use of an audio queue. The difference is one of responsibility: Instead of the
    recording queue delivering buffers of newly captured audio, a playback queue gives
    you empty buffers that you are expected to fill with audio to be played out.


    In this chapter, you''ll learn how to use playback audio queues by building an
    application that reads audio from any Core Audio-supported file and plays it through
    a queue. You''ll find some of the same challenges as in the last chapter, such
    as estimating buffer sizes and managing magic cookies, along with some new concerns
    unique to playback, such as having to take responsibility for the AudioPacketDescriptions
    that describe buffers of compressed audio.


    # Defining the Playback Application


    As with the recording example, you can prepare for writing a playback application
    by sizing up the relevant APIs in the documentation. To create a playback queue,
    you use the function AudioQueueNewOutput(). This function takes almost the same
    list of parameters as the input used in the last chapter:


    +   * An AudioStreamBasicDescription, describing the audio format being provided
    to the queue

    * AudioQueueOutputCallback function pointer to a callback function you will write

    * A user data pointer to provide to the callback

    * A Core Foundation run loop on which to call the callback

    * A Core Foundation run loop mode for the callback'
