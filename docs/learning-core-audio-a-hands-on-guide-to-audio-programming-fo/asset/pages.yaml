    functions that have a one-to-one correspondence to generic-style functions called
    earlier. You use alDeleteSources() and alDeleteBuffers() to clean up buffers and
    sources (the listener is implicit and is neither generated nor deleted), alcDestroyContext()
    to unload the OpenAL context, and alcCloseDevice() to finish using the audio device.


