    so on), you can manually call the AudioUnitRender(). Among various units, you
    supply an AudioBufferList, which is a struct that wraps a variable number of AudioBuffers.
    The AudioBuffer is a struct with a channel count, a buffer size, and a pointer
    to a buffer called mData. If mData is not NULL, the unit places its output into
    this pointer. If mData is NULL, the unit can provide its own buffers. This design
    enables you to use units in isolation if you need to:You can apply an effect to
