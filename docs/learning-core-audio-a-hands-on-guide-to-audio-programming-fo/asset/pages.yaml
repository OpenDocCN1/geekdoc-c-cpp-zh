    \ you'll implement a simple and very popular audio filter called a ring modulator.\
    \ This effect consists of multiplying two signals: a source signal and a modulator\
    \ signal. Mathematically, this means for a given time, t:\n\n```\nR(t) = C(t)\
    \ × M(t)\n```\n\nHere, C is the source signal, M the modulator function, and R\
    \ is the resulting signal. It might sound obscure, but this is an effect that\
    \ you've probably heard before; it one of the first really effects that could\
    \ be created with analog signal processing. In fact, the name ring modulator comes\
    \ from the ring of diodes originally used to produce the effect on analog equipment.\
    \ One of its most common uses is creating \"robotic\" voices; the BBC Radioph\
    \ Workshop famously used it in the early 1960s to create the voices of the Daleks\
    \ on TV's Doctor Who.6\n\nYou can create a ring modulator by multiplying your\
