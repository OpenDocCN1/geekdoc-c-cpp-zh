  md: '# Introduction


    Mac are great media computers, and the iPhone is the best iPod ever made—but did
    they get that way? How did some of the first iOS applications turn the iPhone
    into a virtual instrument, yet developers on other mobile platforms remain happy
    enough to reskin another simple MP3 player? Why is the Mac the choice of so many
    digital media professionals, and what makes applications such as Bias Peak, Logic,
    and Soundtrack Pro possible?


    Core Audio, that''s.


    Core Audio is the low-level API Apple provides for working with digital audio
    on Mac X and iOS. It provides APIs for simultaneously processing many streams
    of multichannel digital audio and interfaces to the audio hardware for capture
    (microphones) and output (speakers and headphones). Core Audio lets you write
    applications that work directly with the uncompressed audio data captured from
    a microphone, perform effects on it, mix it with other audio, and either play
    the result out to the speakers or convert it to a compressed format for file system
    or network. If you''re not developing full applications, Core Audio lets you write
    just the custom effect and wrap it in a plug-in called an audio unit, which lets
    users add their effect to their Core Audio-based applications.


    Apple debuted Core Audio in Mac X 10.0, where it eventually displaced the SoundManager
    that was once. Because Core Audio is a C-based API, it can be used with Cocoa
    applications written in Objective-C and Carbon applications written in C++. You
    can skip these application frameworks and call into Core Audio from a plain-C
    POSIX command-line executable (in fact, most of this book''s examples are written
    today). Since it is in C and called with C, Core Audio is extremely high-performance,
    which is crucial when you''re dealing with processing hundreds of thousands of
    audio samples every second.


    Core Audio is based on the idea of "streams" of audio, meaning a continuous series
    of data that represents an audio signal. Because the sound changes over time,
    so does the data. Throughout Core Audio, your primary means of interacting with
    the audio is by working with these streams: getting them from files or input devices,
    mixing them, converting them to different formats, sending them to output devices,
    and so on. In this world, your code makes calls to Core Audio or gets callbacks
    from Core Audio every time a stream has more data to process. This is a different
    metaphor than you might have seen in other media APIs. Simple media players such
    as the HTML5 <audio> tag or the AVAudioAudioPlayer treat an audio source (such
    as a file or URL) as an opaque box of'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Introduction


    audio: You can usually play, pause, and stop it, and maybe skip ahead or back
    to different parts of the audio, but you can''t really inspect the contents of
    the box or do anything with the data. Makes Core Audio cool is that it''s all
    about doing stuff with the data.

    If it were not that easy.


    Core Audio has a well-earned reputation as one of the hardest frameworks to deal
    with Mac OS and iPhone. This is because choosing to operate at this level means
    dealing with a lot of challenges: working with samples in their native form, working
    with Core Audio''s highly asynchronous programming models, and keeping things
    fast enough you don''t starve Core Audio when it needs data to send to the speakers
    or headphones. If it didn''t help, in iPhone OS 2.0, the first to stop third-party
    applications, developers who wanted to play a file had to go all the way down
    to the stream to process samples by hand. It''s great if you need to work at that
