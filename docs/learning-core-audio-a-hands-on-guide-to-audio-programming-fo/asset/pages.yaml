  md: '# Audio Units on iOS 239


    +   - Mixers


    +   - Multichannel Mixer: A mixer that takes an arbitrary number of input busses
    and mixes them down to a stereo output.


    +   - 3D Mixer: A mixer that can render sounds based on their properties in a
    3D space. It''s used by the OpenAL implementation but can be used in your own
    UGraphs (although this is rare).


    +   - Converter


    +   - Format converter: Same as on OS X; converts between different flavors of
    PCM.


    So that''s the bad. The new news is that it''s not even possible to extend the
    collection of audio units. Whereas OS X has an entire industry of third-party
    audio units, this with plug-in is not possible with the "sandbox" model of iOS
    applications.


    > Note

    In fact, iPhone OS 3 added the capability to build your own audio units to be
    used only in your app, based on the CFPlugin API. However, we have no good authority
    that capability actually worked, and was removed in iOS 4.


    Now that you''ve lowered your expectations, here''s some good news:Working with
    the I/O units is easier in iOS. Think back to Chapter 8, where you grabbed input
    from the microphone and ran it through an AUGraph. You had to use AUHAL units
    for the input and the output because they were potentially devices serviced by
    different I/O threads. That meant you had to use a ring buffer to transfer samples
    between the input and the output the two units. On iOS, this never happens:There''s
    only one audio device, providing both input and output, as shown in Figure 10.1.
    With this arrangement, the awful threading headaches go away:You use a single
    RemoteIO unit for input or output, and if you''re doing both, you use the one
    unit for both.


    ![](img/3aee65cd19773a73ede853c5237a1e08_257_0.png)


