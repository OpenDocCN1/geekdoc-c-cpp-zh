    \ it should sound more or less like your original sample (subject to some attenuation,\
    \ depending on how hard you strike the key and thus, with the MIDI velocity).\
    \ Progressively higher or lower keys pitch-shifts the sample up or down accordingly.\n\
    \nIt's just new unit, but the potential of the AUSampler is significant:With carefully\
    \ recorded samples and thoughtful adjustment of the .aureset zones, you can offer\
    \ deep support for realistic-sounding virtual instruments.\n\n# Core Audio on\
    \ iOS 5\n\niOS 5 represents a major advantage in the usefulness of Audio Units\
    \ on iOS. It includes effects units to the mobile platform that previously had\
    \ only the single AudioPodEQ effect. iOS 5 adds distortion, high- and low-pass\
    \ filters, high-shelf filters, a parametric EQ that allows you to perform EQ in\
    \ specific frequency bands by offering justified values of the AudioUnit. The\
    \ effect units tend to default to floating-point stream formats (first on iOS\
    \ 5); you often need to adjust the rate of your AUGraphs to use the formats the\
    \ effect units need or to add Converter units to invert PCM to format.\n\niOS\
    \ 5 adds the AUFilePlayer, which you used in Chapter 7, Audio Units: Generators,\
    \ Effects, and Rendering,, to greatly simplify the process of getting file-based\
    \ audio into an AUGraph.\n\nAs in Lion, iOS 5 adds AUSampler, which is the first\
    \ instrument unit available on the iOS platform. This means that MIDI API can\
    \ play notes via the AUSampler. For this, the Music Device API also comes to life\
    \ in iOS in version 5, so you can play the MIDI events into the AUSampler with\
    \ MusicDeviceMIDIEvent().\n\nIn the AUSampler section, you might have wondered\
    \ about the use of hard-coded paths. Of course, you could have stored the .auampler\
    \ file in the application bundle and read it from there, the preset file itself\
    \ refers to another file on the development"
