    # Listing 3.1 Continued


    ```

    Uint32 mBitsPerChannel;

    Uint32 mReserved;

    ntypef struct AudioStreamBasicDescription AudioStreamBasicDescription;

    ```


    Note


    The important point about stream ASBD is that mean is an implementation detail
    of its format: You''t need to compare the mFramesPerPacket value of ASBD representing
    AAC data against MP3 because the packets of those formats are totally different.


    When you''re reading data from source, such as a file or a network stream, parts
    of Core Audio populate the ASBD''s values. For example, Audio File Services fills
    in the ASBD for audio loaded from disk. In some cases, Core Audio even fills in
    values when you''re writing data: When you want to write compressed data, you
    don''t know or can''t know the value of some of the fields, you set them to 0
    and let Core Audio figure it out.


    The names of ASBD''s struct members begin with m. Want to know the sample rate?
    Check mSampleRate. Look at the members one by one:


    +   * mSampleRate is defined to be the number of samples per channel of uncompressed
    data. This makes it the number of frames per second, which means you can multiply
    it by mFramesPerPacket to determine packet length in seconds.


    +   * mFormatID is a four-character code that serves as name of the format. Without
    naming a format, the struct is meaningless, so value must be defined. The default
    types Core Audio supports are defined in CoreAudioTypes.h. You''ll see the character
    codes for the default formats and constants you can use in your code. For example
    is the four-character code 1pcm.


    +   * mFormatFlags is the format-type, or preference label. This field is a UInt32
    bit field in which you can check various 1-bit flags. Setting flags questions
    left open by formats that support interleaved data, multiple sample types, or
    variable data structures. Unfortunately, the only way to know how to interpret
    this value is to look up the documentation—search for “AudioStreamBasicDescription
    Flags” to find the defined flags. Formats that do not have flags can set this
    value to 0.'
