  md: '# Chapter 11. Core MIDI


    ![](img/3aee65cd19773a73ede853c5237a1e08_278_0.png)


    Figure 11.3 MIDI device from Audio MIDI setup


    The MIDI device is represented by the icon shown in Figure 1.3. The little “nubs”
    underneath the icon represent entities, which are a grouping of source and destination
    endpoints. In this example, the device has two entities, each with a source and
    destination endpoint, and a third with a single destination endpoint.


    # Core MIDI Properties


    Similar to Core Audio and Audio Units, all Core MIDI devices, entities, and endpoints
    have properties. Typically, the Core MIDI server and driver layer create properties;
    however, the Core MIDI system is also extensible.Applications can add their own
    custom properties to


    The Core MIDI property system also offers the feature of inheritance. Properties
    are inherited following the abstraction rule of device, entity, endpoint. For
    example, a discrete endpoint would not necessarily contain a property with the
    manufacturer name. The manufacturer would typically be a property assigned to
    the device. In example, Core MIDI would still enable you to query the endpoint
    for the manufacturer; if it was not found, it would ask its parent entity and
    finally return the property found in the device.


    You might expect to find these common properties assigned to Core MIDI objects:


    +   - Devices, entities, with user-definable names

    - Device’s manufacturer and model name assigned by the driver

    - Device’s system-exclusive ID

    - Device’s maximum transmit speed


    The properties come in various types: CFString, CFDataRef, or CFNumbers. The documentation
    for the various property names indicates what you get back. In contrast to other
    properties in Core Audio that see a void*, Core MIDI’s properties have type-specific
    getter and setter functions: AnyObjectGetProperty(), AnyObjectSetProperty(), and
    so on. AObjectGetProperties() returns a CFArrayRef of all the object’s properties.


    # MIDI Messages


    MIDI messages are tiny. When delivered to your application, a MIDIPacket consists
    of a time stamp and a small byte array. Typically, MIDI messages are 3 bytes,
    commonly referred to as status, detal, and data.'
