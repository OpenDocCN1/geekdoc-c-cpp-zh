    Look again at that call, because it''s a little confusing to see "output" and
    "input" in adjacent parameters. You address the output scope of the audio unit,
    meaning the data coming out of the unit. However, you use inputBus (which is 1)
    to indicate that you want to stream the I/O units for capture data. The difference
    is that the scope is input and output from the unit, whereas the bus represents
    input and output from the device (which is only for I/O units). Table 8.1 summarizes
    the possible combinations of scope and gives their meaning.


    # Table 8.1 Scope/Use in I/O Units


    | Scope | Bus | Semantics | Property Access |

    |---|---|---|--|

    | Input | 1 | Input from hardware to I/O unit | Read-only |

    | Output | 1 | Output from I/O unit to program or other units | Read/write |

    | Input | 0 | Input to I/O unit from program or other units | Read/write |

    | Output | 0 | Output from I/O unit to hardware | Read-only |


    In fact, you need make use of this distinction. The input hardware might be running
    at a different sample rate than the default sample rate of 44,100 Hz, the built-in
    line on a Mac Pro might run at 88,200. You have different ways to deal with this,
    but one simple option is to use the input hardware rate throughout your program,
    as shown in Listing 8.9. After all, however, avoids resampling and loss of quality.
    So you''ll get the ASBD that''s going into the AUHAL, its copy value over the
