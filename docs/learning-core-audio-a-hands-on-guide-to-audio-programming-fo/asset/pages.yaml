  md: '# Chapter 3 Audio Processing with Core Audio


    maximum fidelity, you can use Appleless, which reproduces its source audio perfectly.
    On the other end of the bandwidth scale, the iBC (Internet Low-Bandwidth Codec)
    is optimized for speech over potentially unreliable Internet connections, making
    it well suited for VoIP or in-game chat purposes. None are appropriate for editing,
    where you''re better served by the CPU overhead and losslessness of PCM, provided
    you have enough RAM and disk space.


    That said, every platform has a format that''s most efficient for a given task.
    In Core Audio, we call this format canonical, in that it forms the baseline from
    which other audio formats differ. Any value not explicitly set by the AudioStreamBasicDescription
    defaults to the value of the canonical format.


    In Core Audio''s engines, all audio conversions are one-way, in that they convert
    (to) the canonical format. Converting between two other formats requires converting
    from the input format into the canonical format and then converting from the canonical
    to the output format.


    Each platform actually has two canonical formats, the AudioSampleType, which is
    used for I/O operations, and the AudioUnitSampleType, introduced in Snow Leopard
    and iOS, which is used in audio units and for digital signal processing.

    On OS X, the AudioSubType is a 32-bit float. The AudioUnitSubType is also a 32-bit
    float, which must be noninterleaved. You can find the mFormatFlags definitions
    in the CoreAudioTypes.h header file in the CoreAudio.framework.


    ```

    kAudioFormatFlagsCanonical = kAudioFormatIsFloat

    kAudioFormatFlagsNativeEndian | kAudioFormatFlagsIsPacked

    kAudioFormatFlagsAudioUnitCanonical = kAudioFormatIsFloat

    kAudioFormatFlagsNativeEndian | kAudioFormatFlagsIsPacked

    kAudioFormatFlagsIsNonInterleaved

    ```


    On iOS, the AudioSampleType is 16-bit integer. An 8.24-bit fixed-point number,
    with 8 bits to the left of the radix point and 24 bits to the right. Here''s what
    that looks like in the CoreAudio.h file in the iPhone SDK frameworks:


    ```

    kAudioFormatFlagsCanonical = kAudioFormatFlagsSignedInteger

    kAudioFormatFlagsNativeEndian | kAudioFormatFlagsIsPacked

    kAudioFormatFlagsAudioUnitCanonical = kAudioFormatFlagsSignedInteger

    kAudioFormatFlagsNativeEndian | kAudioFormatFlagsIsPacked

    kAudioFormatFlagsIsNonInterleaved | (kAudioUnitSampleFractionBits << kLinearPCMFormatFlagsSampleFractionShift)

    ```


    > ¹ The decimal point applies only binary in base 10. The generic term is radix
    point.'
