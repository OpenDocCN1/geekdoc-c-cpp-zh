  md: "# An Audio Session Example\n\nAn incoming call isn't the only event that causes\
    \ an interruption: Notifications, alarms, and other asynchronous events are delivered\
    \ to the app as interruptions.\n\nWe also said the app was going to change the\
    \ tone frequency when it goes between background and foreground. You need to do\
    \ a few things to make that work. First, you have to use a special flag introduced\
    \ in iOS 4.0 to tell the system that the app needs to keep running in the background\
    \ and state. In the app.plist file, create a new key with the name \"Required\
    \ background modes\" (if you look at the .plist file with an XML editor, this\
    \ is really called UIBackgroundModes). This key takes an array as its value: add\
    \ one item, with the canned value \"App plays audio\". Setting this in the Info.plist\
    \ allows the app to keep running when you send it to the background with the Home\
    \ button.\n\nWhen the app moves between foreground and background, the app delegate\
    \ notifies you via its callback methods: applicationWillEnterForeground and applicationDidEnterBackground:\
    \ When you background, all you need to do is change the frequency value, as in\
    \ Listing 10.14.\n\n# Listing 10.14 Handling Background on iOS\n\n```\n(void)applicationDidEnterBackground:\
    \ (UIApplication *)application{\n    self.currentFrequency = BACKGROUND_FREQUENCY;\n\
    }\n```\n\nThe audio queue keeps going in the background, the next call to fillBuffer\
    \ picks up this new value. Of course, with three buffers of 0.5 seconds each,\
    \ there will be an audible lag in doing so.\n\nThe foreground case is similar\
    \ but involves a little more work, as Listing 10.15 shows.\n\n# Listing 10.15\
    \ Handling Foreground on iOS\n\n```\n(void)applicationWillEnterForeground: (UIApplication\
    \ *)application{\n    CheckError(AudioSessionSetActive(true),\n        \"Couldn't\
    \ re-set audio session active*\");\n    CheckError(AudioQueueStart(self.audioQueue,\
    \ 0),\n        \"Couldn't restart audio queue*\");\n    self.currentFrequency\
    \ = FOREGROUND_FREQUENCY;\n}\n```\n\n4 The Xcode 4.1 iOS Simulator doesn't keep\
    \ the audio going in the background; it only works on the device."
