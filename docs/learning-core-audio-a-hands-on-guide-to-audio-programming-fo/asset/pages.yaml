  md: '# Conversion


    Chapter 2, “The Story of Sound,” discussed the difference between audio file formats
    (.mp3, .aif, .caf, and so on) and stream formats (LPCM, AAC, and so on). The last
    few chapters focused on the stream formats of the audio that you either recorded
    or played back. Audio Queue was a big help here because it handled the conversion
    from LPCM to encodings such as AAC.


    But what happens when you''re interested only in conversion? If you wanted to
    compress some LPCM data to AAC, you wouldn''t have to play it through an audio
    queue. You should rightly expect that there are APIs for doing these kinds of
    conversions directly.


    Core Audio provides several approaches for converting between formats. This chapter
    starts by looking at Core Audio''s command-line utility, aconvert, which provides
    a convenient converter utility and gives you idea of the scope of Core Audio''s
    support for many file formats and codecs. Next, you''ll look at Audio Converter,
    an API in the Audio Toolbox that converts audio between encodings in memory. The
    example converts an encoded file to an LPCM equivalent. To do this, you would
    read from a source file, convert, and write to the target file. Because you often
    use conversion services in concert with file I/O, the chapter concludes by rewriting
    the example with Extended Audio File Services, which combines file and audio conversion
    into a single.


    # The aconvert Utility


    Core Audio provides /usr/bin/aconvert, a command-line utility for converting file
    formats and audio encodings. You can get help on its basic use with the --help
    flag:


    ```

    $ aconvert --help

    Usage:

    aconvert [option...] input_file [output_file]

    Options may appear before or after the direct arguments.

    ```'
