  md: '# Using Audio Converter Services


    What if you want to include audio conversion in your application? For that, you
    need to make your calls to Audio Converter Services. Following Core Audio conventions,
    this C API groups its functions with a common prefix. If you type "AudioConverter"
    in the Xcode documentation search field, you should see about ten matching functions
    and a handful of structs. Among these, you may be able to pick out some functions
    for creating and destroying converters, including AudioConverterNew(), AudioConverterReset(),
    and AudioConverterDispose(). You might also find property setters and two functions
    that perform conversions, including AudioConverterBuffer() and AudioConverterFillComplexBuffer().
    A look at the former shows that it is appropriate only for PCM conversions. To
    convert to or compressed formats, you will want to understand AudioConverterFillComplexBuffer().


    Looking at the documentation for AudioConverterFillComplexBuffer(), you will need
    to provide several parameters:


    +   - A previously created AudioConverterRef, which is the converter "object"
    itself

    - A callback function that conforms to AudioConverterComplexInputDataProc and
    provides the input data for the conversion

    - A user data pointer

    - The maximum size of the output buffer, by a packet count

    - A pointer to an output buffer, where the converted data is received

    - A pointer to an array of packet descriptions, if needed for the output buffer
    (including converting to a variable bit rate format)


    Some of this should seem familiar after the audio queue chapters, particularly
    the array of packet descriptions that go hand-in-hand with the buffer of audio
    data that the converter produces. What''s surprising for a callback: Instead of
    passing the data to convert, you pass in a callback function pointer, which is
    called repeatedly to provide data until the converter is full. Take a look at
    the AudioConverterComplexInputDataProc that defines the callback, and you will
    find that it takes the following:


    +   - A reference to the AudioConverterRef that is requesting data to convert

    - The minimum number of packets the converter wants

    - A pointer to a buffer to fill with input data

    - A pointer to populate with an array of AudioStreamPacketDescriptions, needed
    by the format

    - A user-data pointer'
