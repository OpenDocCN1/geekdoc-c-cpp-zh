  md: '# 3

    Audio Processing

    with Core Audio


    The last chapter introduced some essential concepts of digital audio. So how does
    Core Audio handle them? Chapter 1, "Overview of Core Audio," gave you an overview
    of the major areas of interest in Core Audio. This chapter digs down to a more
    detailed level to see how Core Audio models and processes digital audio data.

    We''ll start with the issue of representing sample data and formats in Core Audio''s
    various data structures, and turn our attention to the APIs that can do interesting
    stuff with those structures.


    # Audio Data Formats


    Core Audio views audio data as streams of packets. The contents of a stream''s
    packets are described by its AudioStreamBasicDescription, which we introduced
    briefly in the last chapter. The ASBD is critically important to just about any
    Core Audio program, let''s take a deeper look at it.

    As shown in Listing 3.1, this C structure contains metadata describing the data
    layout: the sample rate, the number of bytes in a channel, the number of channels
    in a frame, and so on. It doesn''t contain the data; it simply describes the data.


    Listing 3.1 The AudioStreamBasicDescription Structure


    ```

    struct AudioStreamBasicDescription {

    Float64 mSampleRate;

    Uint32 mFormatID;

    Uint32 mFormatFlags;

    Uint32 mBytesPerPacket;

    Uint32 mFramesPerPacket;

    Uint32 mBytesPerFrame;

    Uint32 mChannelsPerFrame;

    ```'
