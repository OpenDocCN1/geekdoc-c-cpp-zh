    how the queue works. In the recording case, the queue fills these buffers with
    captured audio and sends them to the callback function. However, you''re responsible
    for creating these buffers and providing them to the queue before you start. And
    begins with an interesting question: How are the buffers supposed to be? With
    constant bit rate encoding, as PCM, you could multiply the bit rate by a buffer
    size. For example, 44,100 samples/second × 2 channels × 2 bytes/channel × 1 second
    would mean you''d need 176,400 bytes to hold a buffer of 16-bit stereo PCM at
    44.1 kHz. For a compressed format as AAC, however, you don''t know how the compression
    will be. Therefore, you don''t know how big a buffer to allocate.


