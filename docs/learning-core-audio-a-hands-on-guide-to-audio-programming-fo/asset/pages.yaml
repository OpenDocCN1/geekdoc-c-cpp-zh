    last section to a file insert of outputting it to the speakers? You could replace
    the default output unit at the end of the graph with a generic unit, identified
    by the subtype kAudioUnitSubType_GenericOutput. This output unit is not connected
    to audio hardware and does not anything by itself. Instead, it gives you access
    to the result of an AUGraph: you can just call AudioUnitRender() on the generic
    unit and supply your own buffer. When the function returns, the buffer will contain
    frames of audio as processed by the graph. You could then write this buffer to
    a file with File Services or Extended Audio File Services. Because these renders
