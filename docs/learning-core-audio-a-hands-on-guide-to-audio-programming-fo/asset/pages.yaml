  md: '# Summary: MIDI Mastery ... but Mobility?


    program, is rendered as synthesized PCM audio inside an AUGGraph, and comes out
    your speakers as audible sound.


    That’s a lot of technology behind your hand-held rendition of “Chopsticks,” isn’t
    it?


    # Summary: MIDI Mastery ... but Mobility?


    Obviously, you can do a lot more with MIDI: A look at the list of MIDI messages
    shows a lot of different events you can work with and support for different kinds
    of musical messages. With instrument units and the Music Device API bridging the
    world of MIDI and Core Audio, you can bring support for all these devices—including
    virtual devices that you create yourself on Mac or iOS—Core Audio and literally
    mix it with the other audio frameworks on the platform.


    One danger we addressed is MIDI event input into iOS devices. This was enabled
    in iOS 4.2, which brought Core MIDI to Apple’s mobile devices. You can use the
    same techniques as in the first half of this chapter to handle events from MIDI
    devices connected to an iOS device. However, there are a few catches. The iPad
    obviously doesn’t have a MIDI port or even a USB port. One answer to this objection
    is that third parties can develop MIDI-compliant devices that connect via the
    dock port.


    The other option is to use the iPad Camera Connection Kit, which offers a USB
    port. Apple generally warns that this is neither supported as a generic USB connection,
    but it is known to many MIDI-to-USB adapters; Apple even discussed and demonstrated
    this in a WWDC 2011 session. The trick is that the iOS devices deliver a tiny
    amount of power over the dock connector, not enough to power many adapters. Another
    problem is that some adapters need power to work, and iOS doesn’t support third-party
    devices. However, the USB spec defines standards for MIDI devices, so a “class-compliant”
    or “driverless” device that doesn’t draw power (or is plugged in) can work on
    an iOS device. The “iOS MIDI” site has a page at iosmidi.com/devices/ that lists
    devices known to work (and others not to work) with the iPad. It also offers a
    Monitor app that uses Core MIDI to log incoming events from a connected device.


    The other problem with handling MIDI events in iOS is what to do with them after
    they arrive. iOS 4 doesn’t provide the DLS Synthesizer or any other instrument
    units for the platform, so a straight port of CH11_MIDTOFrom OS X to iOS doesn’t
    work. You could handle the incoming events by synthesizing your own sound in a
    render callback or playing files via APIs Audio Queue or OpenAI. In the final
    chapter, as part of a look to the future, you’ll see what iOS 5 offers to make
    MIDI on the mobile device more practical.'
