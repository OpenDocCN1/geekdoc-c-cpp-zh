  md: 'filesystem; reference breaks when running in iOS (as it does on Mac OS X, barring
    some installation-time wizardry to put the audio files in their expected locations).


    The way around this is to edit the .aupreset manually—it’s a property list, so
    you can edit in Xcode or your favorite text editor. The key named file-reference
    has a dictionary as its value that has as the absolute paths to the .caf files.
    The AuSampler as a set of rules it uses to search for audio files along known
    paths. It splits any paths under Sounds, Sampler files, or Loops and searches
    for those subpaths in the application bundle and other directories, such as the
    Documents directory. TN2283 has all the details, but the practical upshot is that
    if you include a folder (not a group) named Sounds in your Xcode project, you
    can put your sounds there and have the AuSampler find them, possibly with a little
    hand-editing of the .aupreset to put Sounds at the front of the path. The downloadable
    code has an iOS version of the AuSampler app from earlier in this chapter, so
    you can check that to see how we bundled the preset and the .caf references.


    # The Core Audio Community


    When you’re working with all this and get lost, where do you go? Online, of course.
    incredibly helpful and cooperative Core Audio community is generous with its time
    and knowledge.


    If you Google for Core Audio topics, you’ll likely find a trivial number of hits,
    often back to the official Apple documentation you already have. You can find
    some amount of on Stack Overflow (www://stackoverflow.com) using the core-audio
    tag, although many developers (particularly newcomers to iOS) and thus, don’t
    even know the names and responsibilities of the various media APIs and, don’t
    tag their questions correctly. Still, a lot of common questions about Core Audio
    have been answered on Stack Overflow (and if you use the user name, someone writing
    this chapter).


    There’s a higher signal-to-noise ratio, if you will, on the Apple Developer Forums,
    at http://devforums.apple.com. You will find Core Audio forums on both the Mac
    X and iOS sections. Note that you need to be a member of Apple’s developer programs
    to log into these.


    If you’re on IRC, check the small channel of Core Audio developers hanging out
    at #coreaudio on irc.freenode.net, 6667.


    The longest-lived Core Audio community is the coreaudio-api mailing list, hosted
    at http://lists.com. For years, this has been the line hangout for the most experienced
    Core Audio developers, the ones whose products depend on CA. Apple Audio engineers
    have also been extremely generous with their time on the coreaudio-api list and
    answered many questions related to the coding and writing of this book. You’ll
    pick up a lot about Core Audio, including what it can do and where it gets tricky,
    by subscribing to this list and reading the daily posts.'
  merge: -1
  pgno: 304
- img_proc: true
  md: '# Summary: Sounds Good


    The OS X and iOS platforms make the deepest commitment to media of any operating
    systems in history. Seriously, go look at the competition. Windows at least takes
    media seriously with its off-rearchitected frameworks (DirectShow, Media Foundation,
    and so on). Linux''s dueling frameworks (OSS and ALSA) are no match for Core Audio''s
    breadth and depth, and Android has no low-level media libraries. Android''s media
    support consists of the android.media classes, which, according to their own documentation,
    "are used to play and, in some cases, record media files."No effects, no real-time
    processing, no MIDI, no OpenAL. Feel free to be overwhelmed.


    If you''ve read this whole book, you probably came in knowing that Apple platforms
    take media seriously and do it right. With Core Audio, they put together a low-level
    framework that enables application developers to handle sound in real time or
    offline; to capture, playback, and synthesize; to add effects, filters, splitters,
    and mixers; to support low-latency audio for games and musical performance; and
    to deliver world-class quality audio for media professionals.


    Now these tools are yours to use as you see fit.


    Rock on.'
  merge: -1
