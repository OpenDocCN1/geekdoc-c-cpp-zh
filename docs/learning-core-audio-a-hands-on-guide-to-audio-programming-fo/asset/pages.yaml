  md: '# The afconvert Utility 99


    Music folder.¹ Let''s assume you have a music file encoded with AAC or MP3 and
    you want to decompress it to PCM. To use afconvert, you need to provide a source
    file, conversion settings, and an output file. To keep things simple, we''ll just
    convert the data format to 16-bit little-endian ints. You specify the data format
    with the -d argument, and the command will look like this:


    ```

    $ afconvert "My Song Name.m4a" -d LEI6 output.caf

    ```


    This command creates output.caf, you can then play with QuickTime Player or iTunes,
    or preview by selecting it in the Finder and pressing the spacebar. With QuickTime
    or iTunes, you should be able to do a Get Info (⌘-I) to inspect the data format
    and verify that you acquired 16-bit little-endian integer PCM in your output file,
    as in Figure 6.1. Notice also that the use of the CAF format was inferred by the
    filename extension of the target file; if you had specified output.aif then afconvert
    would have created an AIFF file instead.


    ![](img/3aee65cd19773a73ede853c5237a1e08_117_0.png)


    Figure 6.1 Inspecting the output.caf file created by afconvert


    A number of other options described by the --help output enable you to change
    various properties, including these:


    +   * The number of channels in your output file (when converting stereo to mono,
    for example)

    * The sample rate or overall bit rate

    * The quality or other properties on encoders that support them


    Because afconvert is a command-line utility, it is highly useful for converting
    multiple files, often as part of a shell script, makefile, or other automated
    process.


    > ¹ You can speed up this process by typing cd<> in Terminal and using the Finder
    to locate the folder you want to navigate to and drag it to the Terminal window.
    The full path to the folder appears in your command line--for example, cd /Users/cadadamson/Music/iTunes/\
    Music/Podcasts/MacBreak\ Weekly.'
