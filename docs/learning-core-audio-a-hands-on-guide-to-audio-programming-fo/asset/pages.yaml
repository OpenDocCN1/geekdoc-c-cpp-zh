    Now you''ve had your first experience with audio units, you might be a little
    skeptical. After all, you''ve finished accomplishing anything that you couldn''t
    already do with a playback audio queue (as in Chapter 5), although the two approaches
    have different complexities: Using the code you made for the file in callbacks,
    whereas the player unit is totally fire-and-forget but involves some drudgery
    in setting up playback. Still, it''s fair to ask, "Where''s the win? What''s so
    much better about operating at the audio level"


    In this example, there''s not much advantage over using Audio Queues (or NSSound
    or AVAudioAudioPlayer), but you''re only getting started. In the next example,
    you''ll start doing things that aren''t possible in the higher-level APIs.


    # Speech and Effects with Audio Units


    A few more-supplied audio units exist than the ones in the Core Audio Overview
    document and Tables 7.1 through 7.7. One that''s particularly interesting is a
    speech synthesis audio unit that ships as part of the Speech Synthesis Manager.
    Ordinarily, you use this framework by calling functions such as SpeakCString(),
    or even use the Cocoa NSSynthesizer class without worrying about how the sound
    gets out to the speakers. But by getting the speech synthesizer audio unit and
    putting into your own AUGraph, you gain the capability to manipulate the sound
    at will.'
