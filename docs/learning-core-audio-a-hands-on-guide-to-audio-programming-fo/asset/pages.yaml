  md: '# Digital Audio 27


    from left to right, the position of the membrane moves up and down. The y-axis,
    represents amplitude as a percentage of maximum, the frequency with which the
    values move between positive and negative represents the sound''s frequency.


    One way to represent this wave is to carve a picture of it into some physical
    object. The advantage of this technique is analog recording, that it produces
    a very accurate reproduction. The disadvantage is that the recording is nuanced
    and inexact as the sound wave it describes. This inexactness comes into play when
    making copies. It''s also incompatible with computers, which require things to
    be described in exact terms.


    # Digital Audio


    For computers, you need to represent the wave numerically.You can approximate
    the wave by plotting some (x,y) points along its path. If you provide enough points,
    you will have a good-enough representation. The standard for this is pulse code
    modulation (PCM), which works by recording x at regular intervals of time, meaning
    x is implicit. Its most common form, linear pulse code modulation, assigns a value
    that represents a proportion of the maximum value of y. For example, if a graph
    represents values between 0 and 1, and a given point has a y value''s half of
    the maximum, you assign the value 0.5. This process of assigning values at regular
    intervals is called sampling. Each value is itself a sample.


    CD-quality audio has a sample rate of 44.1 kHz, or 44,100 samples per second.
    One way of looking at it is to realize that every second of CD-quality audio has
    44,100 gaps of just under 23 microseconds. For these gaps, no data exists. Anything
    that happens to the sound wave during that time is lost. Figure 2.2 illustrates
    the effect of sample rate on the data''s capacity to accurately approximate the
    curves of the wave. All images in Figure 2.2 represent the same wave as in Figure
    2.1, but at decreasing sample rates. As you see, the representation of the wave
    gets less accurate as you use fewer samples. In particular, the peak at t = 2.5
    and the values at t = 2.1 and t = 4.4 are completely lost in the rightmost image.


    You could make better approximations by taking more samples, but it would be helpful
    to know if there''s some granularity that''s "good enough." The key to finding
    a good approximation is that you do not hear individual samples, but instead you
    hear waves of sound pulsing through the air. What you hear are frequencies, repeated
    patterns of vibration, whether by a guitar chord or a larynx.You need to figure
    out how often to sample in order to produce these frequencies.


    You actually get this from the Nyquist-Shannon Sampling Theorem, which says if
    you have a function with frequencies greater than B Hz (cycles per second), you
    can sample it accurately by using points spaced 1/(2B) seconds apart. For audio
    purposes, this means that to reproduce any frequency, you need to sample the signal
    at double that frequency or more.'
