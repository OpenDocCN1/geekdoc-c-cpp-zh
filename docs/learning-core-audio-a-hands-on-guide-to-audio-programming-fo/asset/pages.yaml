  md: '# Summary


    lengthly call such as reading from a file, even though that''s not okay in an
    audio unit callback (see Chapters 7,“Audio Units: Generators, Effects, and Rendering,”
    and 8,“Audio Units: Input and Mixing”).


    But as Audio Queue gives, Audio Queue also taketh away. Think about the fact that
    the program uses three buffers of 0.5 seconds each. This means the program has
    a maximum latency of at least 1.5 seconds. When an audio sample is read from the
    drive, the user won''t wait until all the buffers already in the queue and all
    the current buffer played out. You can mitigate this by using smaller buffers
    (try changing the buffer size from 0.5 to a smaller value), but the penalty is
    more frequent callbacks. Still, the nature of using a queue of buffers introduces
    latency. For many applications, that''s fine:The user doesn''t know when the samples
    came off the hard drive or over the network. But if you''re creating an application
    in which sound is created in direct response to user actions, as is the case with
    games and virtual instruments, you might want to opt for the lower latencies offered
    by audio units (Chapters 7 and 8) or OpenAL (Chapter 9,“Positional Sound”).


    # Summary


    So that playback with an audio queue. You allocate some buffers, enqueue them,
    and receive them back in a callback function when it''s time for you to do something
    with. But as you worked through the example, you saw that the playback case is
    different in lot of ways, most significantly in the degree to which you''re responsible
    for managing the memory needed for the array of packet descriptions that the audio
    file reads into. Another difference is that you can stop the recording buffer
    immediately when you''re done with it, but for playback, you must delay for a
    few seconds to let any audio currently in the queue''s buffers play out.


    As mentioned in the last section, an Audio Queue takes care of encoding and decoding
    compressed formats. For example, in the last chapter, you indicated that you wanted
    to record into AAC, and that you got in your callbacks, when then you wrote to
    the file. But if not the microphone picked up data in AAC; the queue must have
    done the compression for you. Similarly, in this chapter, you can read a file
    encoded with codec that Core Audio understands, handles the bytes to Audio Queue,
    and the audio played out. As input from the mic, output to the speakers can only
    be PCM, so you''re picking up a compressed-PCM decoding for free by using the
    queue.


    Now, if you had audio in an encoded format and you wanted to work with its PCM
    representation in some way (say, to run the raw samples through some kind of analysis),
    but you didn''t necessarily want to play it? Or if you wanted to convert a file
    from one to another? You wouldn''t want to have to create an audio queue just
    to pick up the bonus of the decoding. Fortunately, you don''t have to. Audio conversion
    has its own distinct API. In the next chapter, you''ll see how to use it to do
    your own format conversions.'
