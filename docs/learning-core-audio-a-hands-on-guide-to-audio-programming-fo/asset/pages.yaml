  md: '# 192 Chapter 9 Positional Sound


    # Note


    When we talk about sound in a 3D space, you might wonder whether this is the same
    as "surround sound," which you''d get from Dolby Digital or DTS when you play
    a DVD or BluRay disc. It isn''t, really. First, in OpenAL, we are concerned with
    the modeling of a 3D soundscape leaving it to the library and hardware to actually
    produce sound. And when it comes to that step, there isn''t a widely used standard
    for real-time 3D audio as there is for stereo PCM. Dolby Digital and DTS are compressed
    formats, which is easy enough to create in an A/V codec when you''re mastering
    a disc but much less practical to do on the fly. Although OpenAL models sound
    in three dimensions, it ultimately renders it in one dimension: a left-to-right
    stereo mix. That is, if Macs ever get sound cards that you plug in two speakers,
    and if Apple supports them in their OpenAL drivers, your code wouldn''t need any
    updates to support more dimensions.


    OpenAL works with a 3D Cartesian coordinate space, which just means positions
    within this space are indicated by x, y, and z coordinates. The axes of this space
    follow a "right hand rule," which you can imagine by holding up your right hand,
    making an "L" shape with your thumb and index finger, and bending your middle
    finger toward you, as shown in Figure 9.1. If you imagine the approximate middle
    of your hand is the origin of this coordinate system, the direction your fingers
    point indicate which direction is positive for each axis, where your thumb is
    the x-axis, your index finger is the y-axis, and your middle finger is the z-axis.
    So, x values increase as they go right, y values increase as they go up, and z
    values increase as they go toward.


    ![](img/3aee65cd19773a73ede853c5237a1e08_210_0.png)


    Figure 9.1 "Right hand rule" for visualizing 3D coordinate space'
