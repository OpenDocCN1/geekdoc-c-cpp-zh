  md: '# # Acknowledgments


    # ## From Chris Adamson


    This book wouldn''t exist without Kevin Avila and Mike Lee, who found a publisher
    who not only wasn''t scared off by the thought of a difficult niche Mac and iOS
    title, but actually realised the challenge of bringing this beast to market. They
    knew there was a crowd out there that has been aching for years to get Core Audio
    presented in a practical form that lets normal programmers draw out their ferocious
    power. Behind the scenes, Chuck Toporek championed this book, pulled me in when
    it got stuck, and saw it through to the finish. More anyone else, he''s the one
    to thank for finally getting a Core Audio book published.


    We wouldn''t been able to do it all without the generous support of the Core Audio
    developer community, particularly the membership of the coreaudio-api mailing
    list. Core Audio founder William Stewart and Apple''s Doug Wyatt have been generous
    with their time and attention to questions posted to the list and got us stuck
    on a number of occasions.


    We''re also grateful to our many tech reviewers and readers of the “Rough Cuts”
    edition who reported errors and provided feedback as this book worked through
    its long road to completion.


    At home, thanks to my wife, Kelly, and our kids, Keegan and Quinn, for cutting
    me enough to get this thing done and not completely freaking out when the example
    code went wrong and horrible bubbles blasted from Dad''s office in the basement.


    Obligatory end-of-book tune check: This time we were Are The City, ... And You
    Will Know Us by the Trail of Dead, Daft Punk, Dr. Dog, Fun, and (fittingly) Hatsune
    Mika.¹


