  md: '# Core Audio Properties


    The Core Audio calls in this example were all about getting properties from the
    audio file object. The routine of preparing for and executing property-setter
    and property-getter calls is essential in Core Audio.

    Because that Core Audio is a property-driven API. Properties are key-value pairs,
    with the keys being enumerated integers. The values can be of whatever type the
    API defines. Each API in Core Audio communicates its capabilities and state via
    its list of properties. For example, if you look up the AudioFileProperty() function
    in this example, you will find a link to a list of AudioFile Properties in the
    documentation. The list, you can also find by looking in Core Audio''s AudioFile
    header, looks looks like this:


    +   - kAudioFilePropertyFormat = ''ffmt''

    - kAudioFileDataFormat = ''dfmt''

    - kAudioFilePropertyOptimized = ''optm''

    - kAudioFilePropertyMagicCookie = ''magic''

    - kAudioFileAudioDataCount = ''bcnt''


    These are 32-bit integer values that you can read in the documentation and header
    file as four character codes. As you can see from this, the four-character codes
    take advantage of the fact that you can use single quotes to represent literals
    in C and spell out every mnemonic. Assume that fmt is for "format", and you can
    figure out that of is the code for "file format" and dfmt means "data format".
    Codes are used throughout Core Audio, as property keys and sometimes as error
    statuses. If you attempt to write a file Core Audio that Core Audio doesn''t understand,
    you''ll get the response?, which is kAudioFileUnsupportedDataFormat.

    Because Core Audio makes many use of properties, you''ll see common patterns throughout
    its API for setting and getting properties. You''ve already seen AudioFileGetPropertyInfo()
    and AudioFileGetProperty(), so it probably won''t surprise you to encounter AudioQueueGetProperty(),
    AudioUnitProperty(), AudioConverterGetProperty(), and so on. Some APIs provide
    property listeners that you can register a callback for when a property changes.
    Using callbacks to respond to asynchronous events is a common pattern in Core
    Audio.

    The values that you get with these APIs depend on the property being set. You
    retrieved the kAudioFilePropertyInfo dictionary, which returned a pointer to a
    CFDictionaryRef, but if you had asked for a kAudioFilePropertyEstimatedDuration,
    you''d need to prepare a pointer to an NsTimeInterval (which is really just a
    double). This is tremendously powerful because a small number of functions can
    support a potentially infinite set of properties. However, setting up such calls
    involves extra work because you typically have to use the "get property info"
    call to allocate some memory to retrieve the property value or to inspect whether
    the property is writable.'
