    \ a simple, easy to remember, and meaningful value that is very commonly used.\n\
    \n> NOTE You can put a React container anywhere inside the body element of a web\
    \ page.\n\n6. Go to https://reactjs.org/docs/cdn-links.html in your browser and\
    \ find the script tags for including React and ReactDOM from a content delivery\
    \ network (CDN), as shown in Figure 1-1.\n\n7. Copy both script tags and paste\
    \ them right before the \\lt;/body&gt; tag in index.html.\n\n> NOTE The reason\
