  md: '+   The reminder status (completed or not completed).


    +   The selected filter.


    +   The filtered list of tasks.


    Think for a moment about which pieces of data should or not be state. Here''s
    what I''ve come up with:


    +   The user''s current input is certainly state, since it changes as the user
    types.


    +   The selected due date, likewise, is state.


    +   The list of reminders changes as new tasks are added, so it is state.


    +   The individual tasks within the list are unchanging, and are not state.


    +   The completed status of each task is state, since the user can change it.


    +   The selected filter is state.


    +   The filtered list is not state.


    In the next section, I''ll explain why some of these items should not be state.
    Oftimes, your initial judgment about what needs to be state changes as you code
    app. It''s important to stay flexible and look for opportunities to reduce the
    size of your state object. The more data in your app can be moved out of state
    and into props, the simpler (and perhaps faster and more efficient) your app will
    be.


    # What Not to Put in State


    Another way to think about what state is is to follow a few rules for determining
    what isn''t state:


    +   If''s passed from a parent component to a child component, it''s not state.


    +   If it remains unchanged throughout its life, it''s not state.


    +   If it can be computed on other values, it''s not state.


    Generally speaking, individual tasks should not be kept in state. My reasoning
    for this is that these tasks, once created, are unchanging. Also, as you''ll learn,
    the tasks are going to be stored in the parent component and passed down to the
    individual tasks using props.


    The filtered list of displays when you select a time period from the dropdown
    list should not be stored in state. This is because list will be computed on the
    due dates. Because it can be computed and displayed by other props, it''s not
    state itself.


    # Where to Put State


    Once you''ve determined what is and what isn''t, the next step in the development
    of a React interface is to figure out where each piece of state should be located.
    In other words, which component should initialize the state inside of either using
    the class-based component method of this.state, or by using the useState hook.'
