  md: "# LISTING 4-37: ReactDOM.render renders a single element in the DOM\n\n```\n\
    ReactDOM.render(\n  <React.StrictMode>\n    <App/>\n  </React.StrictMode>\n  document.getElementById('root')\n\
    );\n```\n\nThe beauty of ReactDOM.render is that it performs an incredible number\
    \ of calculations and DOM manipulations, controls the timing of DOM updates, manages\
    \ the virtual DOM, and more—but as far as you, the programmer, are concerned,\
    \ it is a black box. All you need to do is feed it a valid React component and\
    \ a DOM node where you want that component to be rendered and ReactDOM.render\
    \ takes it from there.\n\nIf you examine the code in Listing 4-37, you'll see\
    \ that, in this case, we are calling ReactDOM.render to render the App component\
    \ (you can ignore the StrictMode wrapper) inside the HTML element node that has\
    \ an id attribute with a value.\n\nEvery React application designed for rendering\
    \ to web browsers will have a single HTML file that imports the React and ReactDOM\
    \ libraries, plus all the rest of the JavaScript that the application needs. In\
    \ the case of a Create React App application, this file is public/index.html.\
    \ Listing 4-38 shows a version of Create React App's index.html file (with the\
    \ HTML comments and important meta tags removed to save space). When a JavaScript\
    \ application lives within a single HTML file like this, we call it a single page\
    \ app.\n\n# LISTING 4-38: Create React App's index.html file\n\n```\n<!DOCTYPE\
    \ html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\" />\n  <link rel=\"\
    icon\" href=\"%PUBLIC_URL%/favicon.ico\" />\n  ..\n  <meta name=\"viewport\" content=\"\
    width=device-width, initial-scale=1\" />\n\n  <title>React App</title>\n</head>\n\
    <body>\n  <noscript>You need to enable JavaScript to run this app.</noscript>\n\
    \  <div id=\"root\"></div>\n  ..\n</body>\n</html>\n```"
