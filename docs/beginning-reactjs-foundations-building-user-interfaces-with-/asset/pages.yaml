  md: "Using the onChange event listener, you can detect this event and use the target.value\
    \ property of the Event object to update the state property, which can be assigned\
    \ to the value attribute of the input.\n\nThe process for controlling a controlled\
    \ input is the same in function and class components, but the JavaScript code\
    \ you need to write in each differs somewhat.\n\n# Controlling an Input in a Function\
    \ Component\n\nListing 8-3 shows a controlled input text that updates using one-way\
    \ data flow in a function component.\n\nLISTING 8-3: Updating an input element\
    \ with one-way data flow\n\n```\nimport {useState} from 'react';\n\nfunction SignUp(props)\
    \ {\n  const [emailAddress, setEmailAddress] = useState('');\n  const handleChange\
    \ = (e) =>{\n    setEmailAddress(e.target.value);\n  };\n  return (\n    <form>\n\
    \      <label>Enter your email address:\n        <input value={emailAddress} onChange={handleChange}\
    \ type=\"text\" />\n      </label>\n      <p>Your email address: {emailAddress}</p>\n\
    \    </form>\n  );\n}\n\nexport default SignUp;\n```\n\nWhen you run this component\
    \ in a browser, typing into the input updates the value of the emailAddress state\
    \ variable, which is used as the value of the input and is also output in the\
    \ paragraph below the input. The input behaves like a normal HTML input, the component\
    \ also has access to the value of the input.\n\n# Controlling an Input in a Class\
    \ Component\n\nIn a class component, controlling an input works the same way,\
    \ but the JavaScript is slightly different and a bit more verbose because of the\
    \ need to write and bind the event handler and to correctly address the state\
