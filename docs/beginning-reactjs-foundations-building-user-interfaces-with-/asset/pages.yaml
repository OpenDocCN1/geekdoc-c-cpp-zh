  md: '# SUMMARY


    One-way data flow is a large part of what makes React user interfaces able to
    handle updates efficiently and reliably. Although some of the patterns and techniques
    used to implement one-way data flow may be unfamiliar to many JavaScript programmers,
    they are just JavaScript, and they become second nature as you work with React.
    Especially since the introduction of React Hooks, the `useState` hook in particular,
    basic state management in React has become simpler while also remaining compatible
    with previous methods of writing React components.


    In this chapter, you learned:


    +   * One-way data flow works.

    * How to pass data to child components with props.

    * How to initialize state.

    * How to change state variables in class components and function components.

    * How to work with the asynchronous nature of `setState`.

    * What immutability is.

    * The importance of shallow copies.

    * How to validate props using `PropTypes`.

    * How to set default props values using `defaultProps`.

    * How to use the spread operators.

    * The steps to build an app from mockup to reactivity.

    * How to “lift state up.”

    * How to convert between function components and class components.


    In the next chapter, we''ll go into more depth about how events, event listening,
    and event handling work in React.'
