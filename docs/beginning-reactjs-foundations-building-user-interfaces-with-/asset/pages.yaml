  md: '# PEOPLE TO FOLLOW


    Given how active the React community is and how popular React is, it''s important
    to stay on top of the latest developments. A great place to find out about the
    latest React news and trends in the React community is on Twitter. The following
    is a list of React and JavaScript developers and organizations you may want to
    follow:


    +   - React News (@ReactExpo): React and React Native news, templates, and jobs.

    - Reactflux (@reactflux): A chat community of over 147,000 React and React Native
    developers.

    - Andrew Clark (@acdlite): ReactJS developer at Facebook. Co-creator of Redux.

    - ReactJS News (@ReactNews): The latest ReactJS news and articles.

    - React (@reactjs): The official ReactJS Twitter account.

    - React Newsletter (@newsletter): The free, weekly newsletter of the latest React
    news, tutorials, resources, and more.

    - Becca Bailey (@beccaiz): Engineering manager at Formidable.

    - MadeWithReact (@madewithreact): A collection of projects with React.

    - Jessica Carter: Freelance software engineer who frequently tweets about React.

    - Dan Abramov (@dan_abramov): Software engineer at Facebook. Co-creator of Redux
    and Create React App.

    - Mark Dalgleish (@markdalgleish): React developer and co-creator of CSS Modules.

    - John-David Dalton (@javascript): JavaScript developer and creator of the Lodash
    library.

    - Sean Larkin (@TheLarkin): Webpack developer.


    # USEFUL LINKS AND RESOURCES


    When you need help or have questions about how to do something in React, chances
    are good that someone else has a similar problem and the solution can be found
    with a quick search. If you run into a new problem, finding help is usually a
    problem and your question may help others who are having the same issue. The open
    source community thrives because of users helping each other, and as you gain
    more experience, you may be able to solve others'' problems. Here are some of
    the best places to give and find help with React programming:


    +   - Stack Overflow: Stack Overflow is the first place to check, and where you''re
    most likely to find an answer. You can find questions tagged with reactjs at https://stack-overflow.com/questions/tagged/reactjs.

    - Reddit''s Community: You''re less likely to find answers to specific questions
    on Reddit, but you can find interesting discussions or projects posted at https://www.reddit.com/r/reactjs/'
