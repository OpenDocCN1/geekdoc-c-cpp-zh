  md: "JavaScript itself is rarely the issue—JavaScript is fast and usually only gets\
    \ bogged down by the developer who made a mistake (such as creating an infinite\
    \ loop or a memory leak). One reason why JavaScript is so fast and the reason\
    \ that handling asynchronous code correctly is so important is that JavaScript\
    \ doesn't wait for anything.\n\n# JAVASCRIPT NEVER SLEEPS\n\nJavaScript doesn't\
    \ have a sleep or wait command. Instead, a JavaScript engine (such as the V8 engine\
    \ built into Chrome browser or Node.js) starts at the beginning of your script\
    \ and runs the code as fast as it can, using a single thread. Because JavaScript\
    \ is single-threaded, it must complete the previous statement before moving to\
    \ the next.\n\nThe call stack in a JavaScript engine is where commands waiting\
    \ to be executed sit until they can be executed in First In Last Out (FIFO) order.\n\
    \nYou might be asking yourself at this point how it's possible to do asynchronous\
    \ tasks (like network requests and caching data) in JavaScript with only one thread.\
    \ The answer is that although JavaScript is single-threaded,the environment in\
    \ which it runs (your browser or Node.js) is multithreaded.\n\nAsynchronous tasks\
    \ (like network requests) are handled by parts of the browser that are outside\
    \ of the JavaScript engine, such as the Web APIs, in conjunction with two other\
    \ parts of the runtime environment of JavaScript: the event loop and the callback\
    \ queue.\n\nConsider the following:\n\n```\nconsole.log(\"get ready...\");\nsetTimeout(()\
    \ => {\n  console.log(\"here it is!\");\n}, 1000);\nconsole.log(\"end of the code.\"\
    );\n```\n\nThe result of running this code in a browser console is shown in Figure\
    \ 16-1.\n\nWhat's going on when this program starts up, three function calls are\
    \ added to the call stack to be executed. After the first statement is executed\
    \ and removed from the call stack, JavaScript sees the setTimeout() function,\
    \ which creates an event that is indirectly managed by JavaScript. It hands it\
    \ off to the browser to execute, and removes it from the call stack. JavaScript\
    \ can then move on to the third statement.\n\nThe Web API, in the meantime, waits\
    \ for one second (for the 1,000-millisecond time length passed to) and then adds\
    \ its callback function to the browser's callback queue. The event loop (which\
    \ is in charge of listening for and registering event listeners in the JavaScript\
    \ environment) picks up the function from the callback queue and adds it to JavaScript's\
    \ call stack to be executed.\n\nFigure 16-2 shows a diagram of the whole process.\n\
    \nCallback functions, which get executed upon completion of an asynchronous task,\
    \ are how JavaScript programmers can create code that depends on the result of\
    \ that task. If you want to have multiple asynchronous tasks that happen in a\
    \ particular order, you can put them inside the callback functions from other\
    \ asynchronous tasks, as shown in Listing 16-1."
