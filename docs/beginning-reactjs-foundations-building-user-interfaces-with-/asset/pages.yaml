  md: '# INTRODUCTION


    SINCE ITS CREATION BY FACEBOOK IN 2013, REACTJS has become one of the most popular
    and widely used front-end user interface libraries on the web. With the creation
    of React Native in 2015, ReactJS has become one of the most widely used libraries
    for mobile app development as well.


    ReactJS has always been one of a moving target. It has gone through several major
    changes over the years, but through it all, the core principles of React have
    remained the same.


    If you want to develop next-generation cross-platform web and mobile apps using
    the latest syntax and tools, you''ve come to the right place. My goal with this
    book is to save you from the countless hours of trial and error that were my experience
    with trying to piece together bits of old and new information from the web and
    books.


    Whether you''re coming to React as a mobile developer, a web developer, or as
    any other kind of software developer, this book is for you. If you have experience
    with ReactJS as it existed in the earlier days (before version 16), this book
    is for you too!


    In this book, I''ve attempted not only to give the most up-to-date syntax and
    patterns for developing ReactJS applications, but also to give enough background
    and timeless information for it to remain relevant for years to come.


    So, welcome to ReactJS.


    # WHY THIS BOOK?


    Thank you for choosing to begin, or continue, your React journey with me. My aim
    with this book is to provide an up-to-date and thorough explanation of React and
    the React ecosystem along with hands-on code that will prepare you to quickly
    start React reactively in the real world.


    I''m thrilled to be writing this book at this time for a number of reasons:


    +   1. I have the experience and knowledge to do it right.


    +   2. React is one of the most popular JavaScript libraries today.


    +   3. I believe React will be even more popular in the future.


    +   4. Existing online resources and books too often give incomplete and/or outdated
    information about how to program with React.


    Let''s take a quick look at each of these points, starting with a little bit about
    who I am and how I came to React and this book.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# INTRODUCTION


    # About Me


    I''ve been a web developer since 1997, and I''ve been programming in JavaScript
    since 1998. I''ve built or managed the building of web applications for some of
    the world''s largest companies over the years. As a web developer, writer, and
    teacher, I''ve had to learn and use plenty of languages and JavaScript frameworks.
    There''s a difference between learning something and applying it, and I''ve been
    working on projects with React and doing Consulting for several years now.


    I''ve teaching web development and JavaScript online and in person since 2000,
    in the years that I''ve been teaching React, I''ve written three longterm courses
    designed for in-person delivery, numerous short video courses, and two longer
    video courses. I''ve taught React on current ones, and my students have been developers,
    Java and C programmers, COBOL programmers, database administrators, network administrators,
    project managers, graphic designers, and college students.


    As I''m writing, the global COVID-19 pandemic has decimated the in-person training
    industry. While this situation has given me more time at home with the pets, it
    also given me time to think deeply about React and about the React book I wished
    today. This book is the result of all at the top React books, looking at the current
    state of how React is being used, and looking at what React is likely to look
    like in the future.


    # React Is Popular


    React is a JavaScript library that was born out of Facebook''s need to create
    scalable and fast user interfaces. Ever since Facebook released it to the world
    as an open source project, it has one of the most widely used ways to build dynamic
    web and mobile applications.


    One popular game among JavaScript developers is to think of a noun, add "js",
    and search GitHub to find the JavaScript framework with that name. In a time new
    JavaScript frameworks and libraries pop up and die off with shocking regularity,
    React is one of libraries released since 2010 that have stuck around and gained
    the kind of developer usage that will guarantee they will be supported and in
    widespread for a long time to come.


    # React Is Both Progressive and Conservative


    React has been able to stick around and so many users because it''s always been
    a forward-looking framework that is not afraid to make big changes to adapt to
    new features in JavaScript, many ways of writing user interfaces, and feedback
    from developers. Over the years, React has gone through several major changes
    in how the basic unit of a React application, the component, is written. But,
    amidst all this change, React has stuck to a certain paradigm and each major change
    to React has maintained compatibility with previous versions.


    # Don''t Believe Everything on the Internet


    While the end result of all this change is that React has gotten easier to write
    and more robust over the years, it also caused a pileup of outdated and often
    wrong example code and tutorials on the'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# INTRODUCTION


    internet in books. If you''ve done any research on React prior to buying this
    book, you''ve surely noticed this, and you''ve likely been confused by it. Perhaps
    you bought this book after a frustrating experience with learning React online
    only to learn that you learned an old version of it.


    This book aims to be a solid and complete guide to all the most important (and
    less important) features, concepts, and syntaxes used in React.


    # WHAT''S COVERED IN THIS BOOK?


    This book covers everything you need to know to write high-quality React code.
    You''ll learn about React components using the functional method of writing them
    as well as the class method. You''ll learn about managing the state of your application
    using several methods, including React Hooks and the setState method. You''ll
    learn how to put components together to make complete and dynamic user interfaces.
    You''ll learn how to fetch data from an external data source and use it in your
    application. And, you''ll learn how to store data in the user''s web browser to
    improve the performance and usability of your application. Speaking of usability,
    you''ll learn about best practices for making your application work on mobile
    devices as well as on the desktop, and you''ll learn how to make sure that your
    application will be accessible.


    Because React takes advantage of many of the latest and greatest improvements
    and enhancements to the underlying JavaScript language, I''ll give you JavaScript
    lessons throughout the book. Some of the new JavaScript syntax can be a little
    confusing to those of us who first learned the language in its early days, but
    I''ll provide plenty of simple and real-world examples to explain each new bit
    of syntax or shortcut.


    # WHAT''S NOT COVERED?


    Although React is a JavaScript library, this is not a book for newcomers to JavaScript
    or to programming. If you''ve had at least some experience with JavaScript, you''re
    not familiar with the latest additions and revisions to JavaScript, that''s not
    a problem. But, if you''re new to JavaScript or to programming in general, I recommend
    that you learn the basics of programming with JavaScript before you tackle React.


    Similarly, this is not a web design book. I assume that you''re familiar with
    HTML and CSS and feel comfortable writing both. I also assume a basic knowledge
    of how browsers work and how they are rendered in browsers.


    Finally, this book is intended to teach the fundamentals of React to anyone who
    wants to gain the ability to write React applications. Although it covers many
