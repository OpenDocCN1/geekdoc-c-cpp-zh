  md: '# componentDidUpdate


    This method runs immediately after a component updates. It''s useful for performing
    network requests from new props passed to the component, or for performing operations
    that depend on the snapshot of the DOM created during the getSnapShotBeforeUpdate
    method.


    If you have a shouldComponentUpdate method that returns false, the component won''t
    update and this method won''t run.


    # Unmounting


    The process of removing a component from the DOM is called unmounting. Only one
    method, componentWillUnmount, happens during this process.


    # componentWillUnmount


    As its name implies, componentWillUnmount is invoked right before a component
    is removed from the DOM. If you need to do any cleanup in your application relation
    to the component that will be unmounted, this is the place to do it. Examples
    of tasks that are commonly in the componentWillUnmount method include:


    +   - Stopping any network requests that are in progress.


    +   - Stopping timers.


    +   - Removing event listeners created in componentDidMount.


    # Error Handling


    The fourth type of lifecycle methods are the ones that only run when something
    goes wrong with your component. These lifecycle methods getDerivedStateFromError
    and componentDidCatch. I''ll talk about both of these methods further in Chapter
    13, but I want to introduce them to you.


    # getDerivedStateFromError


    If an error occurs in a descendant''s components, the component will run the getDerivedStateFromError
    method. This lifecycle receives the error that occurred and should return an object
    that will be used to update the state.


    # componentDidCatch


    The componentDidCatch lifecycle method runs after a descendant component throws
    an error. Because componentDidCatch doesn''t run during the render phase of the
    lifecycle, it''s useful for performing tasks such as error logging.


    # Improving Performance and Avoiding Errors


    Lifecycle methods can be used to improve the performance of your React application
    and to prevent errors. In the following sections I''ll talk about a few tools
    and techniques you can use to make your components the best they can be.'
