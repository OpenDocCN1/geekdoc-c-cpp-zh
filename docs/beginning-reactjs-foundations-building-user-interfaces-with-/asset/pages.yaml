  md: "# LISTING 12-12: RedirectingRouter from one location to another\n\n```\nimport\
    \ { BrowserRouter as Router, Redirect, Route, Switch, Link, useNavigate }\nfrom\
    \ \"react-router-dom\";\n```\n\n```\nfunction Header(props) {\n  return(<Link\
    \ to=\"users\">View a list of users</Link>);\n}\n```\n\n```\nfunction UsersList(props)\
    \ {\n  const location = useNavigate();\n  return(\n    <h1>User List</h1>\n  \
    \  path: {location.pathname}\n  );\n}\n```\n\n```\nfunction NoMatch(props) {\n\
    \  const location = useNavigate();\n  return(<h1>{location.pathname} is not a\
    \ matching path</h1>);\n}\n```\n\n```\nfunction App(props) {\n  return(\n    <Router>\n\
    \      <Header />\n      <Switch>\n        <Route path=\"/users/list\">\n    \
    \      <UsersList />\n        </Route>\n\n        <Redirect from=\"/users\" to=\"\
    /users/list\" />\n\n        <Route>\n          <NoMatch />\n        </Route>\n\
    \      </Switch>\n    </Router>\n  );\n}\n\nexport default App;\n```\n\nThe App\
    \ component in the previous example will redirect a link to /users. When that's\
    \ clicked the Redirect component will change the location to /users/list and render\
    \ the appropriate Route child component.\n\n# Behind the Scenes: location, history,\
    \ and match\n\nRouting depends on uses three related objects: the history object,\
    \ the location object, and the match object. By manipulating or reading values\
    \ from these objects, you can gain greater control over how routing works in your\
    \ app."
