    In this chapter, you''ll learn:


    +   * About testing and popular testing libraries.

    * What server-side rendering is.

    * How GraphQL works.

    * How to use GraphQL with Apollo.

    * What Flux and Redux are.

    * What Next.js and Gatsby are and how they’re used.

    * What organizations and people to follow to keep up on date on React.


    # TESTING


    The testing of React components and user interfaces is similar to the process
    for testing any JavaScript application, and there are many automated testing tools
    to choose from. If you''re using Create React App, the most straightforward choice
    is simple—Create React App installs and configures Facebook''s testing framework
    for you.


    Although Jest is popular and quite good, other tools and libraries may offer features
    or a way of working that you prefer. You might choose to use some of these tools
    together with Jest or in place of similar functionality that''s provided by Jest.
    Here are a few of the most popular testing tools for React besides Jest.'
