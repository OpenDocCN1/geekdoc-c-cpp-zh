  md: '# What to Put in State


    Whether you use components or function components, changes to state data are what
    initiate changes to your user interface. If you think of the data in your React
    user interface as a river, state is the melting snow in the mountains that sets
    everything off.


    One of the first steps in designing any React user interface is to figure out
    what the state of your application is. While it may not be immediately obvious
    at first, as you become more comfortable with React, a piece of data changes over
    time will get you better at identifying the state.


    As a rule, if a piece of data changes over time in response to data coming in
    from an external source it is likely state.


    # Building the Reminders App


    Let''s take a look at a demo application and determine what its state is, and
    then implement it. Before we can implement state, however, we need to take a brief
    detour to build the structure of the application.


    Figure 6-14 shows a mockup of a user interface for a simple reminders app. The
    user can enter a task into the form and set a due date. The app will show a list
    of tasks and the user can filter tasks by entering a dropdown menu and mark tasks
    as completed.


    Typically, once you''ve created a mockup of an app, the next step in the development
    of a React interface is to figure out what components make up the app and then
    make a "static" version of the app. A static version simply passes props from
    parents to children and doesn''t have any interactivity.


    Before I get with building the app, I''ll set up the development environment using
    Create React App. If you plan to follow along, open your terminal in VS Code and
    create a new project by entering the following command:


    ```

    npx create-react-app reminders-app

    ```


    After React App finishes its work, you''ll see the new project in the file explorer
    in VS Code. Open the src inside the reminders-app directory, and delete everything
    from there for the following files:


    +   - index.js

    - index.css

    - reportWebVitals.js


    Now we''re ready to get started.


    From my initial evaluation of the mockup in Figure 6-14, I''ve determined that
    the Reminders app should have the following components:


    +   - An entry form and submit button component.

    - A filter select dropdown component.'
