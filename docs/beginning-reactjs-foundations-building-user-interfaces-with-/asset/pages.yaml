  md: "# Using Web Storage | 379\n\nconfiguration object. The convenience methods\
    \ include:\n\n+   - axios.get\n- axios.post\n- axios.delete\n- axios.put\n\nUsing\
    \ one of these methods can be as easy as passing it the URL for the request, like\
    \ this:\naxios.get('/user/1');\n\nBoth GET and DELETE calls are frequently made\
    \ without passing any additional data, all of the data required to perform their\
    \ actions on the server are contained in the URL. The POST and PUT methods require\
    \ a payload. That can be specified using the data property in the config object.\n\
    \nFor example, to post data from a signup form using Axios, you may use the following:\n\
    axios.post('/user/', {\n  firstName: 'Frank',\n  lastName: 'Columbo',\n  email:\
    \ 'f.columbladonline.org'\n});\n\n# USING WEB STORAGE\n\nWeb applications, by\
    \ default, do not persist data between sessions. What this means for React user\
    \ interfaces is if a user visits your application and returns later, or refreshes\
    \ the browser, the state data returns to the initial state.\n\nOne solution to\
    \ persisting data between sessions is to save data on the server and associate\
    \ it with the user's login info or a unique key stored in a browser cookie. When\
    \ the user visits the app again, they can log in or use the cookie to read and\
    \ the data can be downloaded from the server.\n\nDownloading from the server is\
    \ slow and inefficient, and if you want to store data locally, you will improve\
    \ the performance of a user interface. The Web Storage API, which is supported\
    \ by all modern browsers, is an easy way to store string data key/values in a\
    \ user's browser.\n\n# Two Types of Web Storage\n\nWeb Storage includes two objects,\
    \ window.sessionStorage and window.localStorage. Both properties work the same:\
    \ they access a Storage object that stores data associated with the current application,\
    \ as identified by its origin. A web application's origin is made up of the protocol\
    \ (HTTP or HTTPS), host domain, and Web Storage provides at least 5MB of storage\
    \ per origin.\n\nThe difference between sessionStorage and localStorage is that\
    \ sessionStorage only lasts as long as the current tab is open, while localStorage\
    \ persists between tabs and sessions. Because localStorage gives you all the benefits\
    \ of sessionStorage plus persistence between sessions, it's more commonly used."
