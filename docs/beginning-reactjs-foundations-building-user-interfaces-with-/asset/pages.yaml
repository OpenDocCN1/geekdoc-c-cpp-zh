  md: "# Virtual DOM\n\nAfter the root component has mounted, the job of ReactDOM.render\
    \ is to monitor changes to the rendered element coming from React and figure out\
    \ the most efficient way to update the DOM to match the newly rendered application\
    \ through a process reconciliation.\n\nAs a programmer, you can think of rendering\
    \ a UI as a continual process of replacing a previous tree of elements with a\
    \ new one: this is what React is doing. But, when a new tree of elements gets\
    \ to ReactDOM.render's reconciliation process, it looks for the minimal set of\
    \ changes and just makes those.\n\nFor example, compare the element shown in Listing\
    \ 4-39 with the element in Listing 4-40. The second listing could be the element\
    \ that results from the user clicking the \"About Us\" link.\n\n# LISTING 4-39:\
    \ The initial element tree\n\n```\n<nav>\n  <ul>\n    <li><a href=\"/\" className=\"\
    navlink\">Home</a></li>\n    <li><a href=\"/about\" className=\"navlink\">About\
    \ Us</a></li>\n  </ul>\n</nav>\n```\n\n# LISTING 4-40: The element tree after\
    \ the user clicks a link\n\n```\n<nav>\n  <ul>\n    <li><a href=\"/\" className=\"\
    navlink\">Home</a></li>\n    <li><a href=\"/about\" className=\"active navlink\"\
    >About Us</a></li>\n  </ul>\n</nav>\n```\n\nThe difference between these two elements\
    \ is that one has the active class. ReactDOM.render will find this difference\
    \ during reconciliation and will remove active from the first link's class element\
    \ and add it to the second link's class element without modifying anything else.\n\
    \nThis process of rendering the new UI in memory and then comparing it with the\
    \ previous UI and figuring out minimal set of changes that can be applied to the\
    \ browser DOM to match the previous state is what we call the Virtual DOM.\n\n\
    One important thing to know about how reconciliation works is that updates to\
    \ the browser DOM aren't always in the same order as they were rendered in the\
    \ Virtual DOM. This is because ReactDOM.render may batch changes if it creates\
    \ more efficiency.\n\nOnce again, the Virtual DOM's inner workings happen without\
    \ your intervention, and you won't need to know exactly what's happening in the\
    \ reconciliation process (except perhaps very rare cases). Knowing that it exists\
    \ is important, however."
  merge: -1
  pgno: 144
- img_proc: true
  md: "If you'd like to learn more about reconciliation works, you can read about\
    \ it in more detail at https://reactjs.org/docs/reconciliation.html.\n\n# # Other\
    \ Rendering Engines\n\nReact doesn't care whether the elements it outputs is in\
    \ a web browser, a billboard, a mobile app, in a terminal application, or in any\
    \ other user interface device.\n\nAlthough ReactDOM is the most commonly used\
    \ rendering engine, and thus the one that most books and tutorials on React focus\
    \ on, other rendering engines can and do. The following sections explore one of\
    \ the most common ones.\n\n# # React Native\n\nReact Native converts React elements\
    \ into native mobile applications. React Native has a set of built-in elements\
    \ that, when rendered, result in the creation of commonly used native components\
    \ such as View, Text, ScrollView, and Image.\n\nAfter React renders a tree of\
    \ React Native elements, the React Native rendering engine compiles elements into\
    \ platform-specific code for different mobile operating systems (such as Android\
    \ or iOS).\n\nListing 4-41 shows a \"Hello, World\" component written with React\
    \ Native.\n\n> LISTING 4-41: Your first React Native component\n\n```\nimport\
    \ React from 'react';\nimport { Text, View } from 'react-native';\n\nconst YourApp\
    \ = () => {\n  return (\n    <View style={{ flex: 1, justifyContent: \"center\"\
    , alignItems: \"center\" }}>>\n      <Text>\n        Hello, World!\n      </Text>\n\
    \    </View>\n  );\n};\n\nexport default YourApp;\n```\n\nEverything here is standard\
    \ React and JavaScript, and everything you're learning about React also applies\
    \ to React Native. The only difference is that React Native has a library of components\
    \ that are relevant to native mobile apps, and React Native components are compiled\
    \ into native mobile apps rather than web browsers.\n\nAfter you write your React\
    \ Native, it needs to be compiled to generate platform-specific code that you\
    \ can deploy on mobile devices or app stores. You can compile React Native components\
    \ using Node.js program called Expo CLI (CLI stands for \"command-line interface\"\
    ), or by using the React Native CLI."
