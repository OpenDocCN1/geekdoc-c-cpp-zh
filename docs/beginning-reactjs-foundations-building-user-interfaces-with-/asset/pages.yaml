  md: "# Avoiding Memory Leaks\n\nTo demonstrate the use of several lifecycle methods,\
    \ we can look at a common problem in React applications—a memory leak—and how\
    \ to fix it.\n\nA memory leak is a fault in a computer program where memory is\
    \ allocated unnecessarily. This can happen when a component is unmounted without\
    \ removing timers or network requests involving the component continue to happen\
    \ after the unmounting.\n\nBecause a memory leak is a wasted use of resources,\
    \ having a memory leak in your program can lead to reduced performance and unexpected\
    \ behaviors. Memory leaks have a tendency to build up the longer a program is\
    \ running, and so you may not notice them at first but things start to get weird\
    \ as they accumulate. So, it's best to take action to avoid them.\n\nTo avoid\
    \ memory leaks, you should always make sure to properly clean up after your components\
    \ using the componentWillUnmount() method.\n\nListing 4-31 shows a component that\
    \ uses the JavaScript setInterval function to increment a counter.\n\nLISTING\
    \ 4-31: A React component with a potential memory leak\n\n```\nimport {Component}\
    \ from 'react';\nclass Counter extends Component {\n  constructor() {\n    super();\n\
    \    this.state = {count: 0};\n    this.incrementCount = this.incrementCount.bind(this);\n\
    \  }\n\n  incrementCount() {\n    this.setState({count: this.state.count + 1});\n\
    \    console.log(this.state.count);\n  }\n\n  componentDidMount() {\n    this.interval\
    \ = setInterval(()=>{\n      this.incrementCount();\n    },1000);\n  }\n\n  render()\
    \ {\n    return (<p>The current count is: {this.state.count}</p>);\n  }\n} export\
    \ default Counter;\n```\n\nThe component's parent has a method, invoked using\
    \ a button, that toggles whether the Counter component is rendered or not, as\
    \ shown in Listing 4-32."
  merge: -1
