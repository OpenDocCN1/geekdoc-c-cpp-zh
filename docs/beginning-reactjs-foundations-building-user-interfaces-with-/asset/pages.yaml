  md: "# GETTING DATA WITH FETCH\n\nwindow.fetch is a method built into all modern\
    \ browsers that allows you to perform HTTP requests from JavaScript without loading\
    \ a separate library. Listing 16-4 shows an example of using the Fetch API to\
    \ fetch data and log it to the console in a React component.\n\nLISTING 16-4:\
    \ Using Fetch in response to events\n\n```\nimport {useState} from 'react';\n\n\
    function Restful() {\n  const [repos, setRepos] = useState([]);\n  const [status,\
    \ setStatus] = useState();\n\n  const getRepos = function() {\n    fetch('https://api.github.com/users/facebook/repos')\n\
    \      .then(response => response.json())\n      .then(data => {\n        setRepos(data);\n\
    \      })\n      .then(setStatus(\"fetched\"))\n      .catch(error => console.error(error));\n\
    \  }\n\n  const logRepos = function() {\n    console.log(repos);\n  }\n\n  return\
    \ (\n    <\n      <button onClick={getRepos}>{status?\"Fetched\":\"\"Fetch Repos\"\
    }</button>\n      <button onClick={logRepos}>Log Repos</button>\n    </>\n  );\n\
    }\n\nexport default Restful();\n```\n\n# GETTING DATA WITH AXIOS\n\nAxios is a\
    \ popular AJAX library that you can use instead of the browser's native Fetch\
    \ API. Axios has advantages over window.fetch in terms of ease of use and capabilities,\
    \ but using it does require you to load a separate library.\n\nTo install Axios,\
    \ use the following command:\n\n```\nnpm install axios\n```"
