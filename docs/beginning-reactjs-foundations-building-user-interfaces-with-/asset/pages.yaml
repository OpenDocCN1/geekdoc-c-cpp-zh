  md: '# 19


    # # Accessibility in React


    Accessibility (also known as a11y, because all those letters between the a and
    the y are too hard to type) means that websites and web applications are designed
    and built in such a way that people with disabilities can use them. The qualities
    that make a user interface built with React accessible are no different from those
    that make any user interface accessible, but the way in which accessibility is
    implemented differs in some instances.


    In this chapter, you''ll learn:


    +   - What makes a web application accessible.

    - Special considerations for making single page applications accessible.

    - What ARIA is.

    - How and how to use semantic HTML.

    - The importance of proper labeling of form elements.

    - How to use media queries in React components.


    # WHY IS ACCESSIBILITY IMPORTANT?


    According to the World Health Organization, about 15 percent of the global population
    has some form of disability. Accessibility studies have found that between 6 and
    10 percent of people over 15 years old have a sight or hearing impairment. For
    people over 65, that number is over 20 percent. Eight percent of people over 65
    have difficulty grasping objects—including a computer mouse.


    With the average age increasing worldwide, the number of people who require some
    sort of alternative device or assistive technology to use the web is in the tens
    of millions, even by conservative estimates.'
  merge: -1
  pgno: 452
- img_proc: true
  md: '# 414 | CHAPTER 19 ACCESSIBILITY IN REACT


    Implementing web accessibility is not just the right thing to do or good for business,
    it''s increasingly required by law. Public sector websites in many countries (including
    the U.S., Canada, and the E.U.) have been required to meet certain accessibility
    standards for years, and private-sector websites in many countries will be required
    by law to meet accessibility standards in the coming years.


    # ACCESSIBILITY BASICS


    Most of the techniques you use for making web applications accessible are just
    good practices in general, and they make your application better and easier to
    use for all users, not just those with disabilities.


    A short list of the considerations to keep in mind when designing your app for
    accessibility includes:


    +   - Use valid HTML.

    - Make sure all images have alt attributes.

    - Add alternative content for all audio and video content.

    - Your app should be navigable without a mouse.

    - Form elements should be properly labeled.

    - The application should be usable by people with color blindness.


    # Web Content Accessibility Guidelines (WCAG)


    The World Wide Web Consortium (W3C) has developed and maintains a collection of
    documents that explain how to make websites accessible, which are collectively
    known as the Web Content Accessibility Guidelines, or WCAG. WCAG is the standard
    used by governments for laws that require accessibility.


    The WCAG has four main principles:


    +   - Perceivable. All user interface elements must be presentable to users in
    a way that they can receive it. For example, images must have text alternatives
    that can be read by screen readers for the blind. Perceibility also encompasses
    techniques such as responsive design, which ensures that content can be presented
    in different ways without losing information or structure. For example, a user
    interface should respond to changes in orientation of a mobile device (from portrait
    to landscape) and to different screens.

    - Operable. Users should be able to operate the user interface. For example, it
    should be possible for all content and navigation and components to be used by
    a keyboard instead of a mouse.

    - Understandable. How the user interface works must be understandable. This principle
    includes making sure the language of the content is specified in the code, providing
    proper labels to user interface controls, and providing help to the user.'
  merge: -1
  pgno: 453
- img_proc: true
  md: '# Implementing Accessibility in React Components


    +   - Robust. Content must be usable by a wide variety of devices and user agents,
    assisting assistive technologies. The most important factor in determining whether
    web content is robust is whether it complies with the HTML standard. For example,
    a visual web browser may be able to render something that just fine from faulty
    markup, it is much more difficult, or impossible, for an assistive device such
    as a screen reader to parse HTML that has duplicate attributes or missing ending
    tags.


    A complete guide to implementing WCAG is beyond the scope of this book, but you
    can find the complete document, as well as a quick reference to the latest version
    of the standard, at https://www.w3.org/WAI/.


    # Web Accessibility Initiative - Accessible Rich Internet Applications (WAI-ARIA)


    The Web Accessibility Initiative - Accessible Rich Internet Applications (WAI-ARIA)
    document, published by the W3C, defines techniques for making web applications
    accessible to people who use assistive technologies, including people who use
    screen readers and people who cannot use a mouse.


    ARIA provides standard HTML attributes that can be used to identify user interaction
    features and specify how they relate to each other as their current state:


    +   - ARIA''s `role` attribute can be added to elements to point out landmarks
    as nav, search, tab, and so forth to screen readers.


    +   - The `aria-live` attribute can be used to tell screen readers that particular
    content is updated. This is particularly important in dynamic single page applications.


    +   - The `tabindex` attribute allows you to make the order of tabbing between
    user interface elements explicit. This is useful when the position of the elements
    in the document and in which you want them to be accessed is different.


    +   - Attributes as `aria-label` and `aria-required` can be used to give more
    information about form controls to screen readers.


    To find out about ARIA, visit the WAI-ARIA overview at https://www.w3.org/WAI/standards-guidelines/aria/.


    # IMPLEMENTING ACCESSIBILITY IN REACT COMPONENTS


    Because the result of compiling a React application is a standard HTML, CSS, and
    JavaScript web page, implementing accessibility in user interfaces built with
    React is largely done using the same standards and techniques that you use with
    a static HTML document.


    However, because you wrote of React components using JavaScript and JSX rather
    than HTML, there are some differences that you should be aware of.


    The main things to consider when implementing accessibility with React are:


    +   - ARIA attributes.


    +   - Semantic HTML.'
