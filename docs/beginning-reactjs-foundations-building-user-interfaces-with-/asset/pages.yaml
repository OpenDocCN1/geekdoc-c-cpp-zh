  md: "You might be wondering how React Knows that the state object has changed. Actually\
    \ it doesn't. The reason that changes to update components is that all changes\
    \ to state must be done using a function provided for that purpose. This function\
    \ updates the state and then triggers a re-render of the component.\n\nThe method\
    \ that you use for updating a component's state depends on whether you're using\
    \ a class component or a function component.\n\n# Updating a Class Component's\
    \ state with setState\n\nIn class components, the setState method is the only\
    \ way to modify the state once it's been initialized. You can use the setState\
    \ method inside any method in a class component except the constructor.\n\nThe\
    \ setState method takes an object or a function as its argument and uses this\
    \ argument to schedule an update of the component's state object.\n\n# Passing\
    \ an Object to setState\n\nListing 6-25 shows a simple example of a class component\
    \ that initializes a state object and then updates it using setState each time\
    \ a button is clicked.\n\n> LISTING 6-25: Using setState\n\n```\nimport {Component}\
    \ from 'react';\n\nclass CounterClass extends Component {\n  constructor(props)\
    \ {\n    super(props);\n    this.state = {count:0};\n    this.increment = this.increment.bind(this);\n\
    \  }\n\n  increment() {\n    this.setState({count: this.state.count + 1});\n \
    \ }\n\n  render() {\n    return(\n      <button onClick={this.increment}>{this.state.count}</button>\n\
    \    );\n  }\n}\n export default CounterClass;\n```\n\nThis simple example demonstrates\
    \ a basic usage of setState. In the increment function, I passed a new object\
    \ containing a new value for the count property. If you run this component, you'll\
    \ see that it works as follows:\n\n+   - Clicking the button triggers the increment\
    \ method in the component.\n\n+   - The increment method calls the setState function,\
    \ passing in a new value for this.state.count."
