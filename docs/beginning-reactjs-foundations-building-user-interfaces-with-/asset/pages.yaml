  md: "# THE EVENT OBJECT\n\nWhen an event happens in React, it triggers an event\
    \ in the DOM. This, in turn, creates an instance of the Event object, which triggers\
    \ the creation of a SyntheticEvent object in React. This is what we mean by SyntheticEvent\
    \ being a wrapper around native DOM events.\n\nThe Event object contains the properties\
    \ and methods that are common to all events. The most important of these base\
    \ Event properties and methods are the following:\n\n+   - Event.target represents\
    \ the object onto which the event was originally dispatched (such as an element\
    \ that was clicked or a form that was typed into).\n\n+   - Event.type contains\
    \ the name of the event, such as click, change, load, mouseover, and so forth.\n\
    \n+   - Event.preventDefault cancels an event if it's cancelable.\n\nListing 7-4\
    \ is a React component that listens for a click event on a button and prints out\
    \ the properties of the dispatched SyntheticBaseEvent object to the console.\n\
    \nLISTING 7-4: Viewing the properties of the Event object\n\n```\nfunction EventProps()\
    \ {\n  const logClick=(e)=>{\n    console.dir(e);\n  }\n  return(\n    <button\
    \ onClick={logClick}>Click Me</button>\n  )\n}\n\nexport default EventProps;\n\
    ```\n\nWith modifications, this basic function can be used to view the properties\
    \ of the SyntheticBaseEvent object for any event. Figure 7-1 shows the object\
    \ that's output to the console when you click the button in this component."
  merge: -1
  pgno: 247
