  md: '# When to Use Web Storage


    Web Storage can be used to remember where the user was in an application the last
    time they visited. For example, if your application includes a lengthy form, the
    user''s input into that form can be saved to Web Storage so that something happens
    (such as a browser crash) while they are filling it out, they can return to the
    form and continue where they left off. One simple and common use for Web Storage
    is to remember a user''s login name between sessions, such as in the user interface
    shown in Figure 16-3.


    ![](img/532a93636824efa5dbcdf73782c1fac9_421_0.png)


    FIGURE 16-3: Remembering a user with Web Storage


    # When Not to Use Web Storage


    Web Storage cannot save data between browsers, different computers, or different
    origins and it will be erased if you clear their browser''s cache. For these reasons,
    it''s not a replacement for storing data on a server that can be downloaded to
    any device with internet access. Instead, Web Storage should be used like a temporary
    cache of data entered by the user or downloaded from the server.


    Web Storage should also never be used for storing sensitive data, such as credit
    card info or passwords. Although the same-origin policy provides some security
    from other sites being able to read data stored in an application''s Web Storage,
    it''s not much protection. If the hundreds of modules that make up a JavaScript
    application were to be compromised, code could be inserted into it to access and
    transmit stolen Web Data to a remote server.


    # Web Storage Is Synchronous


    Although Web Storage is useful for improving the performance of your application,
    it can cause performance problems if overused. Unlike APIs for retrieving data
    from servers (such as Fetch) and even other local storage APIs (such as indexedDB),
    Web Storage is synchronous. Each call to read or write from Web Storage blocks
    the execution of your app until the operation is complete.


    That said, Web Storage is very fast. In most cases, using Web Storage to avoid
    making an HTTP request will improve the performance of your user interface. But,
    be careful not to overuse it.'
