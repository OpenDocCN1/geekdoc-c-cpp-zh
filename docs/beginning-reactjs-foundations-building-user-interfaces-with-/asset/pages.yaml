  md: '# Eliminating Browser Incompatibilities


    Using transpilation does away the age-old problem of browser incompatibilities
    and having to wait until every browser supports a new JavaScript language feature
    before using it. Rather than developers having to write special code and multiple
    if/then branches to accommodate older browsers, Babel makes it possible for developers
    to just write JSX using the latest syntax and transpile that new JavaScript into
    a common denominator that will run in any web browser''s likely to access the
    app.


    # SYNTAX BASICS OF JSX


    As I have mentioned (and I''ll mention again, because it''s a really important
    point), JSX is not HTML. Because it''s not HTML, you can''t write JSX in the same
    loose-goosy way that you be used to writing HTML.


    # JSX Is JavaScript XML


    The first thing to know about JSX is that it is an XML. So, if you know a little
    bit about XML (or you''ve used XHTML), the rules of writing JSX should sound familiar.
    Namely:


    +   - All elements must be closed.


    +   - Elements that cannot have nodes (so-called "empty" elements) must be closed
    with a slash. The most commonly used empty elements in HTML are br, img, input,
    and link.


    +   - Attributes that are strings must have quotes around them.


    +   - HTML elements in JSX must be written in lowercase letters.


    # Beware of Reserved Words


    Because JSX compiles to JavaScript, there is the potential that an element name
    or attribute name that you use in your JSX code can cause errors in your compiled
    code. To guard against this, certain HTML attribute names that are also reserved
    words in JavaScript have to be renamed, as follows:


    +   - The class attribute becomes className.


    +   - The for attribute becomes camelCase


    # JSX Uses camelCase


    Attribute names in HTML that contain more than one word are camel-cased in JSX.
    For example:


    +   - The onclick attribute becomes onClick.


    +   - The tabindex attribute becomes tabIndex.'
