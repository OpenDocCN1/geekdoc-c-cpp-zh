  md: "418 | CHAPTER 19 ACCESSIBILITY IN REACT\n\n# LISTING 19-4: An accessible form,\
    \ written using JSX\n\n```\n<form onSubmit={handleSubmit}>\n  <label htmlFor=\"\
    firstName\">First Name</label>\n  <input id=\"firstName\" type=\"text\" />\n\n\
    \  <label htmlFor=\"lastName\">Last Name</label>\n  <input id=\"lastName\" type=\"\
    text\" />\n\n  <label htmlFor=\"emailAddress\">Email Address</label>\n  <input\
    \ id=\"emailAddress\" type=\"email\" />\n\n  <button type=\"submit\">Submit</button>\n\
    </form>\n```\n\n# Focus Control in React\n\nYour web application should be fully\
    \ accessible and usable with only the keyboard. One important aspect of making\
    \ an application usable with only the keyboard is to properly focus.\n\n# Skip\
