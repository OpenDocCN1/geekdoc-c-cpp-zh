  md: '# The Philosophy of React | 19


    Angular has a steeper learning curve than React. In addition to the learning curve
    required to use the framework itself, Angular requires the use of Microsoft''s
    TypeScript, which is a superset of JavaScript''s designed for the development
    of large applications. It''s possible to use TypeScript to write React as well,
    but with Angular it''s a requirement.


    Unlike React, Angular operates on the real DOM, rather than a Virtual DOM, and
    it optimizes changes to the DOM by using an approach it calls Change Detection.
    When an event causes changes in Angular, the framework checks each component and
    updates it as needed. You may recognize this approach as a more imperative approach
    (as compared to React''s declarative approach) to DOM manipulation.


    React and Angular also differ in how data flows. What this means is that every
    that happens in the browser starts out as a one-way change in the data model.
    This differs from both Angular and Vue, which both feature two-way data binding,
    which changes in the browser can affect the data model directly and changes to
    the model can affect the view.


    # React vs. Vue


    Vue.js is a relative newcomer to the universe of JavaScript frameworks, but it
    has been growing in popularity and is now considered one of the top three, with
    React and Angular.


    Like React and Angular, Vue is open source. Unlike React and Angular, however,
    Vue isn''t backed or controlled by a large corporation. Instead, it''s the work
    of many programmers and companies donating their skills to maintain and support
    it. This can be seen as either a plus or a minus, depending on your view of giant
    internet companies.


    Vue takes a middle ground between the bare-bones approach of React and the smorgasbord
    approach of Angular. Like React, it has built-in functionality for state management,
    routing, and managing CSS. But, like React, it''s a small library (smaller than
    React in total kilobytes that that must be downloaded to the browser) and how
    you use it is highly customizable.


    Of the three libraries, Vue is probably the easiest to learn.


    # What React Is Not


    It''s important to keep in mind not only what React is, but what it isn''t. Beyond
    the often repeated (and largely semantic) argument about whether React is a library
    or a framework are the more important distinctions between front-end libraries,
    back-end libraries, and the development environment.


    React, as it''s used most, is a front-end library. This means that everything
    React happens in the web browser. It can''t directly control or access remote
    databases (except through the web), and it doesn''t serve web pages.


    When I''m asked about the differences between front-end, back-end, and development
    environments in my classes, I like to draw something like the diagram in Figure
    2-4.'
