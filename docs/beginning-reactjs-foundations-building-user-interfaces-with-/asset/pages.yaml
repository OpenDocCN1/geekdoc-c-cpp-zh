  md: "# replace\n\nNormally, when a Link element is clicked, React Router adds a\
    \ new location entry to the browser history stack. If you want to return to the\
    \ route you were previously at, you can use the browser back button or change\
    \ the router's position in the history stack. The replace attribute replaces the\
    \ current entry in the history stack rather than adding a new one:\n\n```\n<Link\
    \ to=\"/sompath\" replace>Go to the new location</Link>\n```\n\n# component\n\n\
    The component attribute takes a custom component as its value. You can use the\
    \ component attribute to supply the name of the component you'd like to use in\
    \ place of the Link component. To create a custom navigation component that you\
    \ want to use for the link and pass the prop from the Link component through it,\
    \ do this:\n\n```\nconst SpecialLink = (props) =>{\n  <a {...props}>***Special\
    \ Link{props.children}</a>\n);\n```\n\n<Link to=\"/sompath\">Click the special\
    \ link</Link>\n\n# pass-through props\n\nIf you want to attach additional props\
    \ to the element that results from the Link, you can specify them as well. Examples\
    \ include className, id, and title.\n\n# Internal Navigation with NavLink\n\n\
    Navigation links are a subset of internal links within an app. They're used for\
    \ changing modes, tabs, or pages within a web application. Examples of navigation\
    \ links include the links in a navigation bar or mobile site menu.\n\nNavigation\
    \ links function the same as any other link in a web application, but it's good\
    \ user interface design to indicate which link is currently active, as shown in\
    \ Figure 12-5.\n\n![](img/532a93636824efa5dbcdf73782c1fac9_340_0.png)\n\nFIGURE\
    \ 12-5: Navigation links indicate the current position"
  merge: -1
