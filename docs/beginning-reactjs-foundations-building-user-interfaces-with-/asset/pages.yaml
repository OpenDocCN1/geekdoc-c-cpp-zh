    # Searching for Components


    There are two ways to search for components. One is using the Search input box.
    The other is using regular expressions.


    # Using the Search Input Box


    In a large tree of components, the Search input box above the component tree view
    can be very helpful for locating specific components. The search box can accept
    either a string or a regular expression that will be matched against the component
    names.


    # Using Regular Expressions


    Regular expressions are a way to search for text based on a pattern. To distinguish
    regular expressions from ordinary text, React DevTools uses slashes before and
    after the expression. For example, if you wanted to find all of the components
    that contain the word "Product," you could do so using the following regular expression:


    ```

    /Product/

    ```


    Right now, this regular expression will highlight the exact same line of components
    as if you just searched for the word "product" without the slashes before and
    after it.


    Where regular expressions come in handy for more complex searches than can be
    done with ordinary text searches. For example, if you wanted to select all of
    the Product components, but not the ProductList component, you could use a regular
    expression such as this one:


    ```

    /Product$$

    ```'
