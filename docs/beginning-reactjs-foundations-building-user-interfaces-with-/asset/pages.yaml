    \ WelcomeDialog(props) {\n  return(\n    <Dialog message=\"Welcome to our app!\"\
    \ />\n  )\n}\n```\n\n# # React Is Declarative\n\nOne way to describe the difference\
    \ in approach between programming with React and programming with other JavaScript\
    \ libraries is to say that React is declarative while many other libraries are\
    \ imperative.\n\nSo, what is declarative programming? Traditionally, the job of\
    \ a programmer has to break down complex processes into steps that a computer\
    \ can perform. For example, if you want to program a robot to make a sandwich,\
    \ you might start by figuring out the high-level steps involved in the process:\n\
    \n+   1. Get two slices of bread.\n2. Find a knife.\n3. Get the peanut butter.\n\
    4. Use the knife to spread the peanut butter.\n5. Assemble the sandwich.\n\nOf\
    \ course, these steps are far too high-level for a robot to perform, so you need\
    \ to break down each one into smaller steps:\n\n+   1. Get two slices of bread.\n\
    \   1a. Use visual sensors to locate bread.\n      1aa. If bread is found, move\
    \ toward it.\n      1ab. If bread is not found, return to step 1.\n   1b. Use\
    \ grabber arm to attempt opening of bread package.\n\nYou get the idea. By breaking\
    \ down a complex process into small steps, a task eventually becomes simple enough\
    \ for a computer to perform. We call this step-by-step style of programming imperative\
    \ programming. The imperative approach is the way that most DOM manipulation libraries\
    \ worked prior to React."
