  md: '# CHAPTER 12 ROUTING


    ![](img/532a93636824efa5dbcdf73782c1fac9_332_0.png)


    FIGURE 12-1: How the web works


    The problem with loading a new page each time a user clicks a link is that it
    doesn''t create a smooth experience for the user, and it doesn''t allow for refreshing
    data dynamically. The whole web page is downloaded and rendered each time a new
    URL is loaded.


    AJAX (which stands for Asynchronous JavaScript and XML) was created to solve this
    problem. With AJAX, JavaScript dynamically loads data into a web page without
    loading a new HTML page. AJAX made dynamic web user interfaces possible, and JavaScript
    libraries and frameworks made building them easier. This is what was referred
    to as Web 2.0.


    Now instead of the browser refreshing new pages from a web server, the browser
    only loads the first page containing the JavaScript code and the JavaScript virtual
    machine takes over there and dynamically loads data and updates the browser using
    the DOM API.


    JavaScript user interface libraries hijack the original request/response model
    that the web was built on. This works, but it means that the browser is displaying
    the same HTML page. This is what we call a single page application (SPA). Having
    a website or web application that only consists of one web page makes it impossible
    for other sites to link to specific data within your app or using a URL, and it
    makes it more difficult for search engines to index the data on your site or in
    your app.


    The solution is to have the JavaScript that runs your web simulation the browser''s
    built-in ability to load web pages that correspond to unique URLs, as shown in
    Figure 12-2.


    This mapping of URLs to things happening inside a JavaScript application is what
    we call routing._'
