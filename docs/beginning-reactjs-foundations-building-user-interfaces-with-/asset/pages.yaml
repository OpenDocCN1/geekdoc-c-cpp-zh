    \ the script tag in your HTML file, you can create individual modules in other\
    \ files by RequireJS's define function, like:\n\nModules you then be loaded into\
    \ main.js using the requirejs function, where individual functions from the module\
    \ can be assigned to variables and used, like:\n\n```\nrequire(['messages'], function\
    \ (messages) {\n  // module usage here\n});\n```\n\nThis function is called when\
    \ scripts/messages.js is loaded. If messages.js calls define, this function is\
    \ not fired until messages's dependencies are loaded, and the messages argument\
    \ will hold the module value.\n\n# CommonJS\n\nWhile RequireJS created a way to\
    \ have modules in the web browser, browsers aren't the only place where JavaScript\
    \ code runs. Prior to 2009, there was no agreed-upon standard to modularize JavaScript\
    \ code running outside the browser.\n\nThis changed when CommonJS (also known\
    \ as CJS) was created. CommonJS was built into Node.js and quickly became the\
    \ most widely modularization library for server-side JavaScript.\n\nWith CommonJS,\
    \ you can export variables, functions, or objects from a file by using the exports\
    \ function, like:\n\n```\n// mathhelpers.js\nexports.getSum = function(num1,num2)\
    \ { return num1 + num2; }\n```"
