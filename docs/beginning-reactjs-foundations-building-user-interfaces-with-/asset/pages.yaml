    Although it seems logical, the organization of the state in our app has some serious
    problems that become apparent as you think about how it will actually function.
    Here are a few of the bigger issues:


    +   1. In the preceding outline, each reminder keeps track of its completed status.
    If we wanted the RemindersList component to only include the completed tasks,
    or only the completed ones, RemindersList would first need to query each Reminder
    and find its status.


    +   2. The Filter and RemindersList components are siblings. If you recall that
    data always flows down in a React app, you''ll have some problem. If Filter maintains
    its own state about which filter is currently selected, there''s no way to get
    that information from the RemindersList component so that the correct Reminder
    components can be displayed.


    +   3. InputForm is also a sibling of RemindersList. Since the goal of the user
    input is to add a new item to the list of reminders, we need the current user
    input to be passed to the RemindersList component. With these components being
    siblings, there''s no easy way to do this.


    It seems that our little app is getting pretty complicated. We''ll need to figure
    out how the RemindersList will query all of the Reminders for their status, we''ll
    need to figure out how to get around this problem with data sharing between components,
    and we will have all this state spread throughout our app that we''re going to
    need to remember and keep track of. There must be a simpler way, you say.


    There is, and it is lifting state up.


    # Lifting State Up


    Having a lot of components that independently maintain their own state can very
    quickly increase the complexity of your app, and therefore the chances of something
    breaking. A good rule of thumb, is that the majority of your components should
    be stateless functions.


    A pure function, as you''ll recall from Chapter 4, is one in which the output
    of is is solely a result of the input to it. In other words, a pure function will
    always produce the same output given the same input.


    To turn state into stateless components, React developers use a technique called
    "lifting state up." This means that, instead of a component controlling its own
    state, you can have a component at a higher level in the hierarchy of your user
    interface control the state. This state can be passed down as props to the components
    that need it.


    Lifting state up gives you the benefit of having fewer components that can possibly
    cause your interface to change, it makes components more easily reusable, and
    it makes your app easier to test.


    To determine where to lift your state up, think about where each piece of state
    in your application is needed, and then find a parent common to all of the components
    that use each piece of state.'
