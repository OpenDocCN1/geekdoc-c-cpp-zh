  md: "Here’s an example of a function component created using a function expression:\n\
    \n```\nconst Foo = function(props) {\n  return <h1>Welcome</h1>;\n}\n```\n\nComponents\
    \ created using function expressions can also be written using JavaScript arrow\
    \ function syntax, which saves several characters. For example:\n\n```\nconst\
    \ Foo = (props) => {\n  return <h1>Welcome</h1>;\n}\n```\n\nexport default Foo;\n\
    \nThe difference in performance or actual bytes of data between using the function\
    \ keyword and using an arrow function is negligible. Many React developers opt\
    \ for the arrow syntax because it allows additional shortcuts (as described in\
    \ the following section), and because arrow functions are generally more convenient\
    \ to use internally inside components, why not use them everywhere and consistent?\
    \ Also, arrow functions look kind of cool.\n\nWhether you choose to use function\
    \ expressions or function declarations for your component, it’s a good practice\
    \ (and looks cleaner) if you stick to one or the other for every function component\
    \ you write.\n\n# Optimizations and Function Component Shortcuts\n\nOne of the\
    \ challenges in writing any type of code is to balance readability with conciseness.\
    \ JavaScript offers many ways to minimize the number of characters and lines of\
    \ code required to perform tasks, and React developers, in particular, are fond\
    \ of using the syntax whenever whenever.\n\nFor example, the following is a perfectly\
    \ valid function component:\n\n```\nexport const Foo = props => <h1>Hello, World!</h1>;\n\
    ```\n\nThat’s the whole thing! The preceding code snippet takes advantage of the\
    \ following rules of arrow functions:\n\n+   1. The parentheses around the parameter\
    \ list are optional when a function only takes one parameter.\n\n+   2. The return\
    \ keyword is optional when an arrow function doesn’t do anything except return\
    \ data.\n\n+   3. The curly braces around the function body are optional if you\
    \ skip the return keyword."
