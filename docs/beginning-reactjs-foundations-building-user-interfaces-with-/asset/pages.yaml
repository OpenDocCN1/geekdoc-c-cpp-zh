  md: 'Once the initial HTML for the application is rendered on the server and served
    to a web browser, the regular ReactDOM renderer takes over and handles updates.
    This technique is referred to as “Isomorphic-React” or "Universal React."


    # React Konsul


    React Konsul renders React components to the browser console. It includes a handful
    of built-in components, including `container, text, image, button, and group`,
    that allow developers to create interactive views inside the JavaScript console
    of a browser.


    The cases for React Konsul are rarer limited, but it can render interactive elements,
    buttons, and styled text instead of the simple text console log messages that
    JavaScript outputs by default.


    # react-pdf


    With react-pdf, you can use React components to render PDF files. The built-in
    components for assembling PDFs include `Document, Page, View`. Once you''ve composed
    your PDF document using these components, you can render them in the browser using
    `ReactDOM.render`, or you can save them as PDF documents using `ReactPDF.render`.


    # COMPONENT TERMINOLOGY


    Components and elements are the building blocks of React. If you understand components
    and JavaScript, you''re more than halfway to being a React developer. React components
    come with a lot of terminology. To help you keep everything straight, here''s
    a handy overview of some of the commonly used lingo in React component development:


    +   -Class component:** A class component is a React component created by extending
    `React.Component` or `React.PureComponent`.

    - **Function component:** A functional component is a JavaScript function that
    returns JSX code.

    - **State:** State is the data in a React user interface that changes when updates
    happen.

    - **Props:** Props are the data that are passed from a parent component to a child
    component. In JSX, props are created using attributes.

    - **Stateful component:** A state component has internal state, stored in either
    the state object (in the case of class components) or using hooks (in the case
    of function components).

    - **Stateless component:** A stateless component is one that doesn''t have its
    own state. Stateless components are also known as “dumb” components or “presentational”
    components.

    - **Pure component:** A pure component is one that always returns the same output
    when given the input.

    - **Root component:** The root component is the single component that contains
    all the components in your React application. Rendering the root component (using
    `ReactDOM`) causes the entire component tree to be rendered.'
