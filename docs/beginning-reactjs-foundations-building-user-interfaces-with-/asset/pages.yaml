  md: '# Caching Computed Values with useMemo


    The `useMemo` hook memoizes (caches) values between renderings of a function component.
    It works the same way as `useCallback`, except that it can cache any value, not
    just functions.


    As with `useCallback`, there are two reason to use `useMemo:`


    +   * To solve problems with unnecessary renders.

    * To solve performance problems related to computationally expensive calculations.


    # Solving Unnecessary Renders


    I covered the first case in the “Memoized Callbacks with useCallback” section.
    The issue comes when you use an object, array, or function serve as a dependency
    for a function that should only run when its dependencies change.


    In JavaScript, when you create two objects (or functions, or arrays) with exactly
    the same properties, the two objects are not equal to each other. You can test
    this by opening your browser’s JavaScript console and executing the following
    expressions:


    ```

    ```javascript

    {} === {}

    () => {} === () => {}

    // false

    ```

    ```


    In each case, the result will be `false`, as shown in Figure 11-7.


    ![](img/532a93636824efa5dbcdf73782c1fac9_320_0.png)


    FIGURE 11-7: Testing referential equality'
