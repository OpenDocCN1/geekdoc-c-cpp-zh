    # PUTTING IT ON THE WEB


    React apps can be published to the web in a variety of different ways. Which way
    you choose will depend on the amount of traffic you expect the app to get, whether
    you want to integrate deploy-ment with your version control system, and your budget
    for hosting.


    # Web Server Hosting


    The easiest way to publish a React app on the web is to upload the build directory
    to any HTTP server, such as Apache or NGINX. Publishing a React app in this way
    is not much different from publishing any static website using HTML, CSS, and
    JavaScript.


    If you sign up with any standard web host that allows FTP upload or upload of
    files using a browser-based file explorer, the steps for publishing your app to
    the web will be similar to the following:


    +   1. Create or use your FTP login credentials, or find out if your host has
    a web-based file uploader.


    +   2. Use FTP (the web-based file uploader) to connect to your site and upload
    everything inside the build directory to your web directory (which should be named
    something like httpdocs).


    +   3. Test that your app works and that you uploaded it correctly by navigating
    to the root of your website (for example, www.example.com) in a web browser.'
