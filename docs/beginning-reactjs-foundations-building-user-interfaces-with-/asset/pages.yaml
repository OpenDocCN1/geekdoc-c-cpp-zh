- img_proc: true
  md: "In this example, notice the style object, which is written as an object literal\
    \ (using curly brackets) must be surrounded by curly brackets to indicate that\
    \ it is to be treated as literal JavaScript rather than JSX, which is why there\
    \ are double brackets around the style properties.\n\n# JavaScript Style Syntax\n\
    \nThe properties that you access and manipulate using JavaScript mirror the CSS\
    \ properties, and you can do anything with JavaScript styles that you can do with\
    \ CSS. Because of the differences between JavaScript and CSS, JavaScript styles\
    \ are written differently.\n\nThe first difference is that a CSS ruleset does\
    \ not follow the rules of JavaScript object literals, although it does resemble\
    \ one. In particular, CSS style rules do not have quotes around the values, while\
    \ in JavaScript style objects, quotes are required around strings.\n\nThe second\
    \ difference between CSS rule-sets and JavaScript objects is that the individual\
    \ rules in CSS are separated by semicolons, while in JavaScript objects, properties\
    \ are separated by commas.\n\nThe third difference is that CSS property names\
    \ containing more than one word have hyphens between the words. In JavaScript,\
    \ this would result in an error, so JavaScript style properties use camelCase\
    \ for multi-word names.\n\nFinally, CSS has the concept of selectors, how styles\
    \ can be selectively applied to only elements. A rule-set attached to a class\
    \ selector (which is indicated by a . before the name of the rule-set) will apply\
    \ to elements that have that class (or className) in JSX.\n\nIn JavaScript, style\
    \ objects that aren't inline styles must be assigned to a variable and that variable\
    \ can be used as the value of a DOM element's style attribute.\n\nListing 10-5\
    \ shows a CSS rule-set, followed by a JavaScript style object that accomplishes\
    \ the same thing.\n\nLISTING 10-5: CSS rule-sets vs. JavaScript style objects\n\
    \n```\n/* CSS rule-set */\n.headingStyle{\n  background-color: #999999;\n  color:\
    \ #eee;\n  border: 1px solid black;\n  border-radius: 4px;\n  width: 50%;\n}\n\
    \n//JavaScript style object\nconst headingStyle = {\n  backgroundColor: '#999999',\n\
    \  color: '#eee',\n  border: '1px solid black',\n  borderRadius: '4px',\n  width:\
