    An action in a JavaScript object that has a type and an optional payload. For
    example, in a Redux counter app, clicking an "Increment" button doesn''t call
    a setState function. It triggers the reducer dispatcher (which handles the state
    of the object) and passes an action object:


    ```

    <button onClick={() => store.dispatch({ type: ''INCREMENT'' })})}>

    </button>

    <button onClick={() => store.dispatch({ type: ''DECREMENT'' })})}>

    </button>

    ```


    The store''s reducer receives the action and uses its type property to decide
    how to change the store. Changing the state causes the application to re-render.

