    # Managing Keyboard Focus with Modals


    Modal dialogs, such as tooltips, help dialogs, and modal forms, can make a user
    interface more usable. They also have the potential to confuse users if they aren''t
    implemented correctly. One particularly important consideration with modal dialogs
    is to properly manage keyboard focus when entering a modal.


    For example, a sign up or application form may use of modal windows for entering
    detailed information and viewing help content, as shown in Figure 18-7.


    When a user clicks a link to open a modal and interacts with the content of that
    modal (even just to click a “close” button), focus leaves the main content of
    the form. When the modal closes, the user will be forced to click in or tab to
    the next form field again to fill it out. At the least, this is inconvenient.
    At worst, it''s an accessibility issue for users who rely on screen readers.


    To properly set focus when returning from a modal, use the `useEffect` hook along
    with a ref to check whether the value of `isModalOpen` has changed to `false`
    and set the focus, as shown in Listing 18-7.'
