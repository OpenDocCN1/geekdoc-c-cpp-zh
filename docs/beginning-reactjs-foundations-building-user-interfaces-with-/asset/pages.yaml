  md: "CSS modules can be written like normal CSS files, and then imported into your\
    \ components as if they were JavaScript. In fact, what happens during the compilation\
    \ of your components is that CSS modules are converted into JavaScript objects.\
    \ This gives CSS modules some special powers, which we'll talk about in a moment.\
    \ Listing 10-9 shows a basic CSS module.\n\n# LISTING 10-9: A CSS Module\n\n```\n\
    /* my-component.module.css */\n.bigText {\n  font-size: 4em;\n}\n\n.redText {\n\
    \  color: #FF0000;\n}\n```\n\nTo import the preceding CSS module into a component,\
    \ make sure to save the file with .module.css at the end and use the following\
    \ import statement:\n\nimport styles from './my-component.module.css';\n\nWhen\
    \ your component is compiled, the classes in the CSS module will be rewritten\
    \ in a format called ICSS, which stands for Interoperable CSS.\n\nYou can access\
    \ the imported styles using dot notation and pass them into the className attribute,\
    \ as shown in Listing 10-10.\n\n# LISTING 10-10: Using a CSS Module\n\n```\nimport\
    \ styles from './my-component.module.css';\n\nfunction DisplayMessage(props) {\n\
    \  return <p className={styles.redText}>This text is red.</p>;\n}\n\\export default\
    \ DisplayMessage;\n```\n\nCSS Modules are not specific to React. A separate specification,\
    \ which can be used with any frontend library. However, support for it is built\
    \ into Create React, so to use it in React applications built with Create App,\
    \ you don't need to do anything special to start using it.\n\n# Naming CSS Module\
    \ Files\n\nAlthough CSS modules resemble ordinary CSS files, when you use them\
    \ inside of Create App, their filenames must end with .module.css to indicate\
    \ to the compiler that they need to be processed as CSS modules."
