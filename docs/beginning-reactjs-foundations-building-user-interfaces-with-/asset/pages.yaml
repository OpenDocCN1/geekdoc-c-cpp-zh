  md: '# Props | 131


    ![](img/532a93636824efa5dbcdf73782c1fac9_175_0.png)


    FIGURE 6-6: Passing the wrong prop type


    With the PropType specified for `firstName`, when WelcomeMessage receives a value
    of `firstName` that isn''t a string, a warning message will be displayed in the
    console, as shown in Figure 6-7.


    Use of PropTypes in React is optional, and whether you use it or not, it won''t
    fix errors by itself. It also won''t save your application to not compile if a
    prop fails its checks. It''s purely a development tool. However, it''s a great
    way to catch bugs in your components and to document your components. Getting
    into the habit of using PropTypes will improve your React components and make
    it easier for other programmers who use your component in the future to know what
    data it requires.


    # Getting Started with PropTypes


    PropTypes is not part of the core React library. To use it, you first have to
    install it. If you bootstrapped your app with Create React App, it''s already
    installed for you. Otherwise, you can install it by running the following command
    from the root of your project:


    ```

    npm install prop-types --save

    ```


    Once PropTypes is installed, you''ll need to include the PropTypes library into
    each component you use it. At the beginning of the file containing your component,
    use the following import:


    ```

    import PropTypes from ''prop-types'';

    ```


    Once imported, PropTypes works the same with both function and class components,
    but where you place the PropTypes may differ.'
