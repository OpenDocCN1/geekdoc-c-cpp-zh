  md: 'The dollar sign at the end indicates that you''re only looking for component
    names that end with the word “Product."


    If you want to find components that match the name Cart or the name ProductList,
    you can use the OR operator, which is a vertical bar in regular expressions, like
    this:


    ```

    /Cart($ends|ProductList)/

    ```


    In addition to the "ends" with ($), regular expressions also have a "begins" with
    operator, which is the caret (^). For example, the following regular expression
    search will find any component with a "c" in its name:


