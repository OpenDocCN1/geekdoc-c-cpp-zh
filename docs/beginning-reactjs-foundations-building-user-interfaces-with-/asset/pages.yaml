  md: "# LISTING 4-44: Using shouldComponentUpdate and shallowCompare\n\n```\nimport\
    \ React from 'react';\nimport shallowCompare from 'react-addons-shallow-compare';\n\
    class ShallowComponent extends React.Component {\n\n  shouldComponentUpdate(nextProps,\
    \ nextState) {\n    return shallowCompare(this, nextProps, nextState);\n  }\n\n\
    \  render() {\n    return <div>foo</div>;\n  }\n\nexport default ShallowComponent;\n\
    ```\n\nAnother way to accomplish this is the same as the code in Listing 4-34\
    \ is to write your class component by extending React.PureComponent instead of\
    \ React.Component, as shown in Listing 4-35.\n\n# LISTING 4-35: Extending React.PureComponent\n\
    \n```\nimport React from 'react';\n\nclass PureComponentExample extends React.PureComponent\
    \ {\n  render() {\n    return <div>foo</div>;\n  }\n}\n\nexport default PureComponentExample;\n\
    ```\n\n# React.memo\n\nFunction can also be pure components, but because they\
    \ can't use lifecycle methods or extend React.PureComponent, a different method\
    \ is required to optimize them.\n\nReact.memo() is a higher-order function, meaning\
    \ that it wraps around another function and adds its functionality to that function.\
    \ When you wrap your component in React.memo(), it performs a comparison of the\
    \ previous and next props and skip rendering if they're the same.\n\nThe name\
    \ of React.memo() refers to memoization, which is the caching of the results of\
    \ a function and using cached result if the function has the same input as when\
    \ the cache was created.\n\nListing 4-36 shows how to use React.memo()."
  merge: -1
