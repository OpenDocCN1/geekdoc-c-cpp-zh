  md: '# Flux


    Flux is a pattern for how to manage data within an application. With the Flux
    pattern, data is kept in stores that can be subscribed to user interface components.
    When a store that a component is subscribed to changes, the user interface component
    (also known as the view) fetches the new data and uses it to update.


    Changing the data in a store is done using actions, which are dispatched in response
    to events in the view. All data in a Flux application flows in a single direction.
    Figure 20-1 shows the basic pattern.


    ![](img/532a93636824efa5dbcdf73782c1fac9_468_0.png)


    FIGURE 20-1: The Flux pattern


    # Redux


    As your user interface gets larger, it can be helpful to central some or all of
    the data used in it, rather than having stateful variables spread throughout your
    components.


    Redux is a library for managing state in a React application that implements the
    Flux pattern. Redux centralizes the state data in an application into a single
    state tree. This state tree is modified from within components by dispatching
    “actions.” These actions, in turn, trigger function reducers, which update the
    Redux state tree. Figure 20-2 shows how data flows in a Redux application.


    ![](img/532a93636824efa5dbcdf73782c1fac9_468_1.png)


    FIGURE 20-2: Data flow in a Redux application


    A React application that uses Redux has a single object that contains all of its
    data. This object is called the redux store. A store is created using the createStore
    method. The createStore method takes a function parameter, called a reducer, as
    its argument. The reducer contains all the methods that can be used to work with
    the data in the store.


    The following is an example of a reducer function for a simple counter application:


    ```

    const counterReducer = (state = 0, action) => {

    switch (action.type) {

