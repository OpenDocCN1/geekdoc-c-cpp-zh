  md: '# React Adds Several Attributes


    React attributes that are available for React’s built-in HTML components don''t
    exist in HTML. Chances are good that you''ll never need to use any of these special
    attributes, but I''m including them for completeness.


    +   - dangerouslySetInnerHTML, which allows you to set the innerHTML property
    of an element from React. As you can tell by the name of the attribute, this is
    not a recommended practice.

    - suppressContentEditableWarning, which suppresses a warning that React will give
    you if you use the contentEditable attribute on an element that has children.

    - suppressHydrationWarning. No, it''s not a way to tell React to stop nagging
    you to drink more water. It will suppress a warning when you content generated
    by server-side React and client-side produce content.


    # Some React Attributes Behave Differently


    Several attributes behave differently in React than they do in standard HTML:


    +   - checked and defaultChecked. The checked attribute is used to dynamically
    set and unset the status of a radio button or checkbox. The defaultChecked attribute
    sets whether a radio button or checkbox is checked when the component is first
    mounted in the browser.

    - selected. In HTML, when you want to make an option in a dropdown be the currently
    selected option, in React, you use the value attribute of the containing select
    element instead.

    - style. React’s style attribute accepts a JavaScript object containing style
    properties and values, rather than CSS, which is how the style attribute in HTML
    works.


    # React Supports Many HTML Attributes


    The following list contains the standard HTML attributes used by React’s built-in
    HTML components:


    accept acceptCharset accessKey allowFullScreen allowTransparency async autoComplete
    autoPlay capture cellPadding charset challenge classID contentEditable contentMenu
    controls controls col col span origin data date dateTime dir disabled download
    draggable encType form action formEncType method validate formTarget border headers
    hide high reframe htmlFor http icon input modeKey keyIndex label loop marginRight
    marginWidth maxWidth maxLength mediaGroup min minLength multiple nameValidate
    optimum pattern placeholder preloader radioGroup deOnly required rows rowSpan
    sandbox scoped scrolling seamless shaped size sizes span spellCheck srcDoc srcSet
    step style summary tabIndex title type useMap width wmode'
