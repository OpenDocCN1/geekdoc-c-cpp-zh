  md: '# Supported Events | 205


    ![](img/532a93636824efa5dbcdf73782c1fac9_249_0.png)


    Figure 7-2: The NativeEvent properties


    Many DOM events are defined in official specifications, and others are defined
    and used by specific browsers. These events can be detected using the HTML DOM
    and responded to using JavaScript running in the browser.


    React supports listening for the *Event* object, handling many of the standard
    DOM events. Many of these events add properties to the *Event* object, which you
    can use to find out more about the event. For example, the keyboard events include
    properties that tell which key was pressed.


    Table 7-1 lists the events that are currently supported within React, with a brief
    description of each. To view the properties added to the *Event* object, you can
    log the *Event* object to the console, as shown in Listing 7-4, or visit the excellent
    Event API documentation available at https://developer.mozilla.org/en-US/docs/Web/API/Event.'
  merge: -1
