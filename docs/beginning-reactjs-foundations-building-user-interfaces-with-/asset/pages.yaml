    \n```\nInputForm.defaultProps = {\n  userInput:\n  reminderText: \"\"\n  dueDate:formattedDate\n\
    }\n```\n\n```\nexport default InputForm;\n```\n\nThis basic method can be applied\
    \ to the other components to convert them to class components. However, there\
    \ is one important gotta to be aware of. In the InputForm and RemindersList functions,\
    \ we defined the event handler functions using the function keyword. When you\
    \ define functions using the function keyword and then reference this inside of\
    \ them, this refers to the function, not to the object which is part of. The result\
    \ is that the following function will result in an error:\n\n```\nfunction handleChange(e)\
    \ {\n  this.props.setSelectedFilter(e.target.value);\n}\n```\n\nThe easiest solution\
    \ (but not the only) is to simply redefine the function as an arrow function.\
    \ This keyword inside an arrow function references the object that the function\
    \ is a part of:\n\n```\nconst handleChange = (e) => {\n  this.props.setSelectedFilter(e.target.value);\n\
    }\n```\n\nIf you're really set on using the function keyword, another solution\
    \ is to use the bind function to specify that the function should run in the context\
    \ of the current object. You can bind the function in the constructor (as you\
    \ viewed previously) or in the onChange event listener attribute, like this:\n\
    \n```\n<select id=\"filterReminders\"\nvalue={this.props.selectedFilter}\nonChange={this.handleChange.bind(this)}>\n\
    ```"
