- img_proc: true
  md: "React Router's NavLink component creates navigation links. The difference between\
    \ a NavLink and a Link component is that the NavLink allows it to be styled when\
    \ the value of its attribute matches the browser's current location.\n\nYou can\
    \ style a NavLink component using either the activeClassName attribute, which\
    \ accepts a CSS class name, or the activeStyle attribute, which accepts a style\
    \ object:\n\n```\n<NavLink to=\"home\" activeClassName=\"active\">Home</NavLink>\n\
    ```\n\nDepending on how your app is designed, there are options to consider when\
    \ deciding when a NavLink will display in its \"active\" style. For example, in\
    \ the navigation menu shown in Figure 12-6, should the \"Home\" and \"About Us\"\
    \ be highlighted when the \"Meet the Team\" sub-link is active?\n\nListing 12-2\
    \ shows the JSX to build the navigation menu in Figure 12-6.\n\n![](img/532a93636824efa5dbcdf73782c1fac9_341_0.png)\n\
    \nFIGURE 12-6: A navigation menu with sub-items\n\nLISTING 12-2: A list of NavLinks\
    \ with sub-items\n\n```\n<ul>\n  <li><NavLink to=\"/\" activeClassName=\"active\"\
    >Home</NavLink></li>\n  <li><NavLink to=\"aboutUs\" activeClassName=\"active\"\
    >About Us</NavLink>\n    <ul>\n      <li>\n        <NavLink to=\"aboutUs/team\"\
    \ activeClassName=\"active\">\n```\n\ncontinues"
