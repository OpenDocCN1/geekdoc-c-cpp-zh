  md: 'ReactDOM is what it makes possible for user interfaces built in React to handle
    the quantity of screen changes required by modern web applications so efficiently.
    It does this through the use of a Virtual DOM.


    # VIRTUAL DOM


    The Document Object Model, or DOM, is a web browser''s internal representation
    of a web page. It converts HTML, styles, and content into nodes that can be operated
    using JavaScript.


    If you ever use the getElementById function or the innerHTML of an element, you''ve
    interacted with the DOM using JavaScript. Changes to the DOM cause changes what
    you see in your web browser, and updates made in the web browser (as you enter
    data into a form) change the DOM.


    Compared to other kinds of JavaScript code, DOM manipulation is slow and inefficient.
    This is because whenever the DOM changes, the browser has to check whether the
    change will require the page to be redrawn and then the redrawing has to happen.


    Adding to the difficulty of DOM manipulation is that the DOM''s functions aren''t
    always easy to use and some of them have excessively long names like Document.getElementsByClassName.
    For both of these reasons, many different JavaScript DOM manipulation libraries
    have created. The most popular and widely used DOM manipulation library of time
    is jQuery. It gave developers easy way to make updates to the DOM, and changed
    the way we build user interfaces on the web.


    Although jQuery made DOM manipulation easier, it left it to programmers to program
    specifically when and how the DOM would happen. The result was often inefficient
    users their use of jQuery were slower to download and respond to user interactions
    because of their use of jQuery. As a result, jQuery got a reputation for being
    slow.


    When the engineers at Facebook designed React, they decided to take the details
    of how and when the DOM is modified out of the hands of programmers. To do this,
    they created a layer between the code that the programmer writes and the DOM.
    They called this intermediary layer the Virtual DOM.


    Here''s how:


    +   1. A programmer writes React code to render a user interface, which results
    in a React element returned.


    +   2. ReactDOM''s render method creates a lightweight and simplified representation
    of the React element in memory (this is the Virtual DOM).


    +   3. React listens for events that require changes to the web page.


    +   4. The ReactDOM.render method creates a new-memory representation of the web
    page.'
  merge: -1
  pgno: 57
- img_proc: true
  md: '+   5. The ReactDOM library compares the new Virtual DOM representation of
    the web page to the previous Virtual DOM representation and calculates the difference
    between the two. This process is called reconciliation.


    +   6. ReactDOM applies just the minimal set of changes to the browser DOM in
    the most efficient way that can and using the most efficient batching and timing
    of changes.


    By taking the programmer out of the process of actually making updates to the
    browser DOM, ReactDOM can decide on optimal timing and the optimal method for
    making required updates. This greatly improves the efficiency of making updates
    to a browser view.


    Figure 2-3 is a diagram showing how the Virtual DOM works.


    ![](img/532a93636824efa5dbcdf73782c1fac9_58_0.png)


    FIGURE 2-3: How the Virtual DOM works


    # THE PHILOSOPHY OF REACT


    If you''ve used other JavaScript libraries, you may find React to be quite a bit
    different from your past experience with programming dynamic user interfaces.
    By understanding the thinking why React is like it, you''ll have a better understanding
    and appreciation of it.'
