  md: "# EVENT HANDLER FUNCTIONS\n\nOnce your React component has detected an event,\
    \ you can write a function that will take some action in response to the event.\
    \ This function is called an event handler function.\n\n# Writing Inline Event\
    \ Handlers\n\nInline event handler is an anonymous function's that as the value\
    \ of an event listener attribute. Inline event handlers are often used as wrappers\
    \ for calling another function that defined outside of the return statement. They\
    \ may also be used for performing simple tasks that perhaps don't warrant the\
    \ creation of a full event handler.\n\nListing 7-5 shows an example of an inline\
    \ event handler.\n\n> LISTING 7-5: Using an inline event handler to show an alert\n\
    \n```\nfunction WarningButton() {\n\nreturn (\n  <button onClick={()}>alert('Are\
    \ you sure?');}}>Don't Click Here</button>\n);\n\nexport default WarningButton;\n\
    ```\n\nIt is possible to call multiple functions or execute a block of code from\
    \ inside an inline event handler, but there are several reasons for not using\
    \ inline event handlers for complex code:\n\n+   1. Inline event handlers aren\
    \ reusable.\n2. Inline event handlers are difficult to read and they reduce the\
    \ organization of your code.\n\n| CATEGORY | EVENT LISTENER | DESCRIPTION |\n\
    | --- | --- | --- |\n| Animation Events | onAnimationStart | The animationstart\
    \ event fires when an animation starts. |\n| | onAnimationEnd | The animationend\
    \ event fires when an animation stops. |\n| | onAnimationIteration | The animationiteration\
    \ event fires when iteration of an animation ends and another starts. |\n| Transition\
    \ Events | onTransitionEnd | The transition event fires when a CSS transition\
    \ completes. |\n| Other Events | onToggle | The toggle event fires when the state\
    \ of a details element (open or closed) is toggled. |"
  merge: -1
  pgno: 255
- img_proc: true
  md: "3. Inline event handlers are re-created every time the component re-renders.\
    \ In function components, this is what happens to all inner functions. But in\
    \ classes, inline event handlers may affect performance, although the effect is\
    \ not likely to be noticeable, and prematurely optimizing your code for this kind\
    \ of problem before you will cause you more problems (in terms of wasted alone)\
    \ than it solves.\n\n> NOTE I'll talk about how to use React Hooks to cache event\
    \ handler functions in function components in Chapter 11.\n\nInline event handlers\
    \ are also used when the result of some user interaction should be simply update\
    \ the state in some way. In a class component, this means that setState is called,\
    \ or in a function component, when the state setter is called. Listing 7-6 shows\
    \ an example of using an inline event handler to call setState.\n\n# LISTING 7-6:\
    \ Using an inline event handler to call setState\n\n```\nimport (Component) from\
    \ 'react';\n\nclass ScreenDoor extends Component {\n  constructor(props) {\n \
    \   super(props);\n    this.state={\n      isOpen:true\n    }\n  }\n  render()\
    \ {\n    return(\n      <button onClick={()=>this.setState({isOpen:!this.state.isOpen})>\n\
    \        {this.state.isOpen?'Close the Door':'Open the Door'}\n      </button>\n\
    \    )\n  }\n}\n\nexport default ScreenDoor;\n```\n\n# Writing Event Handlers\
    \ in Function Components\n\nAn event handler inside a function component is written\
    \ as an inner function, using either arrow syntax or the function keyword.\n\n\
    If you're comfortable with the class method of writing components, you can think\
    \ of function components as being the render method from a class component. The\
    \ event handlers in a function component only exist for a single render, unlike\
    \ in class components where they're methods of the class and persist between renders."
  merge: -1
  pgno: 256
- img_proc: true
  md: "Function components don't have the this keyword, and so there's no need to\
    \ bind event handlers declared inside of functions.\n\nWriting functions inside\
    \ function components is as simple as writing a function anywhere else. Once you've\
    \ written an event handler function, you can assign it to a event listener by\
    \ passing the name of the function as the value of an event listener attribute,\
    \ as shown in Listing 7-7.\n\n# LISTING 7-7: Using an event handler function in\
    \ a function component\n\n```\nimport (useState) from 'react';\n\nfunction Search(props)\
    \ {\n  const [term, setTerm] = useState('');\n  const updateTerm = (searchTerm)=>{\n\
    \    setTerm(searchTerm);\n  };\n  return(\n    <>\n      <input type=\"text\"\
    \ value={term} onChange={(e)=>{updateTerm(e.target.value)} />\n      You're searching\
    \ for: {term}\n    </>\n  );\n}\n\nexport default Search;\n```\n\n# Writing Event\
    \ Handlers in Class Components\n\nEvent handlers in class components are methods\
    \ of the class. They are written outside of the render method and must be bound\
    \ to the specific instance of the class.\n\nListing 7-8 shows one way to write\
    \ and bind an event handler method in a class component.\n\n# LISTING 7-8: Writing\
    \ and binding an event handler method in a class\n\n```\nimport {Component} from\
    \ 'react';\n\nclass CoffeeMachine extends Component {\n  constructor(props) {\n\
    \    super(props);\n    this.state={\n      brewing:false\n    }\n    this.toggleBrewing\
    \ = this.toggleBrewing.bind(this);\n}\n```"
  merge: -1
