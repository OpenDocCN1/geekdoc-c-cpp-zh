    # # Validating Incoming Props with PropTypes


    When you invoke a JavaScript function and pass in arguments, the function doesn''t
    care what type of data arguments are, whether they''re passed in at all, or whether
    more or fewer arguments are passed than the function defines. The same things
    are true with props that you pass from a parent to a child component.


    For programs to operate correctly, it is often important that the props that are
    passed to a component are the same type of data that the component is expecting.
    For example, if your component expects a prop called `itemId` to be a number,
    an error may occur if a parent component passes `item` as an object.


    React programmers (and programmers in general) must account for the possibility
    of incorrect data types being passed to any function that receives arguments.
    But, it''s not always easy to figure out and detect possible data problems with
    a dynamically typed language such as JavaScript.


    To help with keeping track of a component''s expected input and finding possible
    problems, we can use a tool called `PropTypes`.'
