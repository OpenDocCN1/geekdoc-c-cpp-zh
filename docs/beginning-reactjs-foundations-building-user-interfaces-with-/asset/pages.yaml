    \  height: \"200px\",\n      borderRadius: \"50%\",\n      backgroundColor:this.state.currentColor\n\
    \    };\n    return (\n      <>\n        <div style={wheelStyle}></div>\n    \
    \    <input onChange={this.changeColor.bind(this)} value={this.state.currentColor}\
    \ />\n      </>\n    );\n  }\n}\n\nexport default ColorWheel;\n```\n\nWhile the\
    \ inline method may be more convenient in some cases, it has the drawback of living\
    \ inside the render method, which means that it will re-run every time the component\
    \ renders. Also, it may result in duplication of effort if you use the same event\
    \ handler function more than once in a class.\nBecause the constructor only runs\
    \ once, binding in the constructor has the benefit of being efficient as well\
    \ as keeping your code tidy.\n\n# Using Arrow Functions\n\nArrow functions use\
    \ lexical binding. What this means is that they are automatically bound to the\
    \ scope in which they are created. As a result, if you define your event handlers\
    \ using arrow functions, or write your event handlers as inline arrow functions,\
    \ they don't need to be bound."
