    # # Development Server and Hot Reloading


    Hot reloading, in a development environment, is the ability to make changes to
    an app and then see those changes reflected automatically without needing to compile
    a command. To enable hot reloading with Webpack, you can use the Webpack Dev Server.


    You already installed Webpack Dev Server in an earlier step. To use it, enter
    npx webpack serve into the terminal. Instead of compiling to the dist directory,
    Webpack will serve your app at localhost:8080 (by default).


    With your app served by Webpack, try making and saving a change to App.js. Your
    changes will be reflected immediately in the browser window. When you''re finished
    and want to stop the dev server, press Ctrl+C in the terminal window.


    # # Testing Tools


    We''ll talk about testing in Chapter 20. Although a detailed explanation of how
    to test React apps is beyond the scope of this chapter, automated testing is a
    critical part of any professional development environment. A good tooling will
    include at least two testing-related components:


    +   - A static code analysis tool (also known as a linter).

    - An automated unit testing tool.


    # # Installing and Configuring ESLint


    The job of a static code analysis tool is to check the code for syntax errors
    and code style. This process is called linting. The tool that''s currently most
    used for linting JavaScript code is ESLint.


    ESLint is highly configurable. It can be used for checking your code for syntax
    errors, or it can check syntax, practices, and code style. It can even fix some
    kinds of problems for you.


    To get started with ESLint, install it into your project:


    ```

    npm install eslint --save-dev

    ```


    Once installed, ESLint includes an initialization script that will ask you questions
    about how you want to use it and create a configuration file based on your answers.
    Follow these steps to configure ESLint:


    +   1. Type the following command to run the initialization script:


    ```

    npx eslint --init

    ```


    The configuration wizard will start and ask you an initial question about how
    you want to use ESLint, as shown in Figure 15-4.'
