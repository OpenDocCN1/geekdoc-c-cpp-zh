  md: '# JSX Is Not HTML | 25


    ![](img/532a93636824efa5dbcdf73782c1fac9_69_0.png)


    # THE HISTORY OF JAVASCRIPT MODULES


    JavaScript started its life as a scripting language for web browsers. In its early
    days, scripts written in JavaScript were small. Because it was seen as less than
    a “real” programming language, no thought was given to including a way to create
    modules in JavaScript. Instead, programmers would just write their JavaScript
    in a single file and import it into HTML files using the script element, or write
    all of their JavaScript directly into the script element.


    As JavaScript became a more powerful language, and as the number of things people
    were doing with JavaScript began to grow, so too did the complexity and size of
    JavaScript files.


    # The Rise of the JavaScript Module


    Because JavaScript couldn''t do modules natively, when the need for benefits of
    breaking up JavaScript programs into smaller pieces became apparent, JavaScript
    developers did what they dared and created new libraries that could be used to
    add modularization into JavaScript.


    # RequireJS


    The library that became the most popular way to modularize JavaScript in the web
    browser was RequireJS. The method used by RequireJS to load modules is called
    Asynchronous Module Definition (AMD).


    As the name implies, AMD modules are loaded asynchronously, meaning that all of
    the imports in a module run prior to any of those modules being executed.


    continues'
