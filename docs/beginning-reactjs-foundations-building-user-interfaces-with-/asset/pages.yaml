  md: "# CHAPTER 4 ALL ABOUT COMPONENTS\n\n# LISTING 4-32: Toggling the rendering\
    \ of the Counter\n\n```\nimport {useState} from 'react';\nimport {Counter} from\
    \ './Counter';\nfunction CounterController() {\n  const [displayCounter, setDisplayCounter]\
    \ = useState(true);\n\nfunction toggleCounter() {\n  setDisplayCounter(!displayCounter);\n\
    }\n\n  return (\n    <div className=\"App\">\n      {displayCounter ? <Counter\
    \ /> : null}\n      <button onClick={toggleCounter}>Toggle Count</button>\n  \
