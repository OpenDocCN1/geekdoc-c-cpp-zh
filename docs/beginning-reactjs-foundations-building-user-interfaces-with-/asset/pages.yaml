  md: "Note in this example, we've changed the export from a default export to a named\
    \ export. To import this component into another component, you'll need to surround\
    \ the name of the component with curly braces, like this:\n\n```\nimport {ToDoFunction}\
    \ from './ToDoFunction';\n```\n\nNow that you've seen how much more functional\
    \ components can be than class components, let's look at how to write them and\
    \ what their limitations are.\n\n# What Are Function Components?\n\nFunction components\
    \ are JavaScript functions that return React elements.\n\nStateless functional\
    \ components simply accept props from their parent and return a piece of the user\
    \ interface. They don't perform additional operations, such as fetching and posting\
    \ data, and they have their own internal state.\n\nIn version 16.8, however, a\
    \ new feature was added to React called hooks. Hooks allow function components\
    \ to do most of the things that class components can do, such as interacting with\
    \ data and using state. The result is that functional components now become the\
    \ primary way that most React components are written.\n\nReact's official documentation\
    \ states that class components will continue to be supported for the foreseeable\
    \ future. At this point, no one can foresee how longer they will be necessary.\
    \ If you're currently writing class components, there's no need to convert them\
    \ to function components. If you're coming to React from a background working\
    \ with object-oriented languages, you may feel more comfortable working with class\
    \ components than function components and that's fine too.\n\nWith function components\
    \ being so much simpler to work with, you may very well want to use them exclusively,\
    \ and that's great! Be aware, however, that fully function components weren't\
    \ introduced into React until after it became one of the most popular UI libraries,\
    \ you're going to come into contact with a lot of class components. As long as\
    \ you understand them and how to convert them to function components (which we'll\
    \ cover in detail in Chapter 11), you may never need to write another class component.\n\
    \n# How to Write Function Components\n\nSince a function component is simply a\
    \ JavaScript function, it works the same way as any other function—either a function\
    \ expression or a function declaration. The choice of whether to use an expression\
    \ or a declaration is a matter of style and personal choice.\n\nHere's an example\
    \ of a function component created using a function declaration:\n\n```\nfunction\
    \ Foo(props) {\n  return <h1>Welcome</h1>;\n}\n```\n\n```\nexport default Foo;\n\
    ```"
