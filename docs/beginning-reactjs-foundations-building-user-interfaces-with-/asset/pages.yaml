  md: "# Why to Use Inline Styles\n\nInline styles make it easy to see how a component\
    \ will be styled. If you're only applying a couple of style properties to an element,\
    \ and you're not going to reuse that particular combination of properties in another\
    \ component, writing them as inline styles is easy and fast. Using inline styles\
    \ also increases the portability of a component, since the styles are part of\
    \ the component file and don't rely on an external module being present.\n\n#\
    \ Why Not to Use Inline Styles\n\nIn a React application with many different components,\
    \ using inline styles can become maintenance nightmare. It's simply a good user\
    \ interface practice to reuse certain styles, including how headings are styled,\
    \ colors and sizes of buttons, sizes and types of different types of text, and\
    \ so forth.\n\nIf you were to write the same style object, containing the same\
    \ style properties, each time you styled a block of text, you'd come to the realization\
    \ that writing inline style objects is a waste of effort. At that point, logically,\
    \ the thing to do is create variables to store your style objects.\n\n# Improving\
    \ Inline Styles with Style Modules\n\nRather than writing your styles directly\
    \ in the style attribute of each element, you can create variables to hold the\
    \ styles, as shown in Listing 10-6.\n\n> LISTING 10-6: Using variables to hold\
    \ style objects\n\n```\nfunction WarningMessage(props) {\n  const warningStyle\
    \ = {color:\"red\",padding:\"6px\",backgroundColor:\"#000000\"};\n\n  return (\n\
    \    <p style={warningStyle}>\n      {props.warningMessage}\n    </p>\n  )\n}\n\
    \nexport default WarningMessage;\n```\n\nVariables created to hold style objects\
    \ can be kept inside the component, as shown in Listing 10-6, or you can put them\
    \ into separate files and export them using either named exports (if you want\
    \ to create a style library containing the styles for multiple components) or\
    \ a default export.\n\nListing 10-7 shows an example of a style object library\
    \ containing styles for multiple different components."
