    ```\nreceiveHamburger\n  .then(eatHamburger)\n  .then(payForHamburger)\n  .catch((err)\
    \ => // handle the error }\n```\n\nasync/await\n\nPromises are great, but they\
    \ still require the use of callbacks. A of the best improvements to how asynchronous\
    \ code is written are the async and await statements. With async and wait, you\
