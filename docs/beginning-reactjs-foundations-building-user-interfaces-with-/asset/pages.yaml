  md: '# 17


    # Context API


    The primary way to pass data from parent components to child components in React
    is through props. However, in some cases props can be tedious to use and can lead
    to code that''s more difficult to read and maintain. The Context API was created
    for these cases.


    In this chapter, you''ll learn:


    +   * Prop drilling is.

    * When the right time is to use Context.

    * When to make a Provider.

    * How to use Context in class components.

    * How to use Context in function components.

    * Best practices and conventions for Context.


    # WHAT IS PROP DRILLING?


    React props making data from parent components to child components simple and
    intuitive. If you have a piece of data in a component and you want to make it
    available to subcomponents, just add an attribute to the child component''s element
    and the value will be available in the child. If you have data in a component
    that you want to use in a grandchild component, you can pass the data through
    the child component and then into the grandchild.


    This process of passing data through multiple levels of the component tree is
    called *prop drilling*. In a tree of components, you may have multiple levels
    of components that don''t use a particular piece of data but just pass it along
    to their descendants using props, as shown in Listing 17-1.'
  merge: -1
  pgno: 427
- img_proc: true
  md: "# LISTING 17-1: Using prop drilling\n\n```\nconst Grandpa = (props) => {\n\
    \  return (<Dad story = {props.story} />);\\n}\n```\n\n```\nconst Dad = (props)\
    \ => {\n  return (<Son story = {props.story} />);\\n}\n```\n\n```\nconst Son =\
    \ (props) => {\n  return (<Grandson story = {props.story} />);\n}\n```\n\n```\n\
    const Grandson = (props) => {\n  return (<p>Here's story that was passed down\
    \ to the Grandson component;\n  {props.story}</p>);\n}\n```\n\n```\nexport default\
    \ Grandpa;\n```\n\n# HOW CONTEXT API SOLVES THE PROBLEM\n\nProp drilling isn't\
    \ necessarily a problem. In many cases, it's exactly what you should do. However,\
    \ if you have data or functions in your app that could be considered \"global\"\
    \ (or global to a particular tree of components), Context lets you avoid prop\
    \ drilling.\n\nHere's how Context works:\n\n+   1. You create a Context object,\
    \ which includes the Provider and Consumer components and properties.\n2. You\
    \ create a Provider for the Context, which will publish a value to its descendants.\n\
    3. Any of the Provider's descendants can subscribe to the Provider.\n4. Components\
    \ that subscribe to a Provider will update when the Provider's data changes.\n\
    \n# Creating a Context\n\nTo create a Context, use React.createContext(defaultValue);\n\
    \n```\nconst MyContext = React.createContext(defaultValue);\n```\n\nThe createContext\
    \ method returns a Context object. The defaultValue argument that you pass into\
    \ createContext is the data that will be available to its descendants if there\
    \ isn't a matching Provider. Since the default value most likely won't ever get\
    \ used, many developers leave the default value as undefined or set it to some\
    \ sample object.\n\nFor example, in Listing 17-2, I created a Context for user\
    \ preferences, which passes default values for the lang and timezone properties."
