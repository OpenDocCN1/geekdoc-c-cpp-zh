  md: '# JAVASCRIPT LESSON: VARIABLES


    With the ES2015 version of JavaScript, we gained two new keywords for declaring
    variables: const and let. We also gained some new ways to work with variables,
    including the destructuring assignment syntax.


    If it''s been a while since you''ve written any JavaScript, the new keywords and
    ways to work with variables will be new to you. They are widely used and relied
    upon by most React apps, however, so it''s important that you understand when,
    why, and how to use these new tools.


    # Goodbye to var


    In the original JavaScript syntax, and up until 2015, the way to create a variable
    was with the var keyword. The var keyword is still present in JavaScript, and
    it always will be. The simplest form of using var looks like this:


    ```

    var x;

    ```


    When you want to assign a value to x or change the value of x, you can simply
    use the assignment operator:


    ```

    x=10;

    ```


    You can also initialize a variable created var at the same time as you declare
    it:


    ```

    var x=10;

    ```


    JavaScript evaluates declarations first within their scope through a process called
    hoisting. When you use the var keyword to declare a variable, JavaScript also
    initializes the variable with a value of undefined during the hoisting. What this
    means in practice is that it is possible to use a variable created with var before
    it''s declared, as in the following example:


    ```

    x = 10;

    console.log(x);

    var x;

    ```


    The previous example, when compiled by a JavaScript interpreter, is exactly the
    same:


    ```

    var x;

    x = 10;

    console.log(x);

    ```


    ```

    var x=10;

    console.log(x);

    ```


    Variables created using var have function scope. What this means is if you declare
    a variable inside a function, you can use that variable anywhere in the function.'
  merge: -1
