- img_proc: true
  md: "This type of URL usually indicates that the number represents a unique identifier\
    \ for a user, rather than a component named “5455” (which isn't a valid component\
    \ name).\n\nA Route component to match this path would look for the /user/ path\
    \ and then indicate that the characters after the path are a parameter that should\
    \ be available inside the child component, as shown in Listing 12-5.\n\n# LISTING\
    \ 12-5: Using URL as Router, Route from 'react-router-dom';\n\n```\nimport { BrowserRouter\
    \ } from 'react-router-dom';\n\nfunction HomeScreen(props) {\n  return (\n   \
    \ <Router>\n      <Route exact path=\"\">\n        <Home />\n      </Route>\n\
    \      <Route exact path=\"/login\">\n        <Login />\n      </Route>\n    \
    \  <Route path=\"/user/:id\">\n        <UserProfile />\n      </Route>\n    </Router>\n\
    \  );\n}\n\nexport default HomeScreen;\n```\n\nInside the rendered component,\
    \ you can access URL parameters using the useParams hook, as shown in Listing\
    \ 12-6.\n\n# LISTING 12-6: Using the useParams hook\n\n```\nfunction UserProfile()\
    \ {\n  let { id } = useParams();\n\n  return (\n    <div>\n      <h3>User ID:\
    \ {id}</h3>\n    </div>\n  );\n}\n```\n\n# ## The component Prop\n\nInstead of\
    \ specifying the component to be rendered by a matching route using children of\
    \ the Route component, you can use the component attribute, as shown in Listing\
    \ 12-7."
