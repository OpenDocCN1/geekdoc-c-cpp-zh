  md: "> NOTE Event bubbling refers to the upward propagation of an event from a lower\
    \ level in the element hierarchy to a higher one. Event capture is the opposite.\
    \ In event bubbling, an event that happens on a button (such as a click) is dispatched\
    \ by the button before the form element that contains the button dispatches.\n\
    \nThese historic and major differences between how web browsers handle events\
    \ have largely been ironed out, the real value of having a cross-browser wrapper\
    \ for events is that it can provide additional and consistent properties across\
    \ every browser.\n\nSyntheticEvent also shifts developers from the implementation\
    \ details of exactly how events in React are translated to DOM events in the browser.\
    \ The React documentation is intentionally vague about how SyntheticEvents map\
    \ to native events (although it is possible to find this out, as you'll see).\
    \ In rare cases, these details won't matter to a React developer, because these\
    \ details are not part of the official React documentation, they are subject to\
    \ change at any time.\n\n# USING LISTENER ATTRIBUTES\n\nTo create an event listener\
    \ in React, use one of the supported event listener attributes on a built-in HTML\
    \ DOM element. If the HTML event that will be created by a React component supports\
    \ a certain event, it should also be supported by the React component, except\
    \ in a few cases where things work differently in React.\n\nUsing an event listener\
    \ attribute in an element created by a custom component won't have any effect\
    \ on the custom component except to create a prop inside of it with the same name\
    \ as the event listener attribute. For example, a prop named onClick: will be\
    \ created:\n\n```\n<Button onClick={handleEvent} />\n```\n\nThe preceding onClick\
    \ attribute is not an event listener attribute. It's common to use the names of\
    \ event listener attributes to pass events between custom components, but doing\
    \ so doesn't actually add the event listener to the resulting browser DOM.\n\n\
    In order for the Button component to actually be handle events, you must have\
    \ an HTML DOM element inside the Button component that has an event listener attribute.\
    \ For example, here's what the return statement of the Button component might\
    \ look like:\n\n```\nreturn (\n  <button onClick={props.onClick}>Click Me</button>\n\
    );\n```"
  merge: -1
