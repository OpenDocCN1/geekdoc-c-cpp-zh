  md: '# 4


    # All About Components


    Up until now, we''ve mostly been talking about the tools that make React development
    possible, including your development environment, Node.js, ReactDOM, JavaScript
    modules, and JSX. Now it''s time to dig deeply into the heart of what makes React
    tick: the component. In this chapter, you''ll learn:


    +   - The relationship between components and elements.

    - How to use React''s HTML elements.

    - How to pass data between components with props.

    - How to write class components.

    - How to write function components.

    - How to bind functions in JavaScript.

    - How to manage React state.


    # WHAT IS A COMPONENT?


    Components are the building blocks of React applications. A React component is
    a function or JavaScript class that optionally accepts data and returns a React
    element that describes some piece of the user interface. A user interface is made
    up of a hierarchy of components that build up to a single component (called the
    root component) that is rendered in the web browser.


    Figure 4-1 shows an example of a React component tree.


    It''s possible to create a React application with only a single component, but
    for all but the smallest apps, breaking your app up into multiple components makes
    development and management of the code easier.'
