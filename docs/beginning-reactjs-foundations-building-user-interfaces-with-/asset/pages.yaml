  md: "# CHAPTER 13 ERROR BOUNDARIES\n\nComponentDidCatch receives two parameters:\
    \ the error that was thrown, and an info object containing information about which\
    \ component threw the error. Listing 13-4 adds the ComponentDidCatch method to\
    \ the ErrorBoundary we created. In this version, ComponentDidCatch just logs the\
    \ values of the error and info parameters to the browser console.\n\nLISTING 13-4:\
    \ Logging the error and the info object to the console\n\n```\nimport {Component}\
    \ from 'react';\n\nclass ErrorBoundary extends Component {\n  constructor(props)\
    \ {\n    super(props);\n    this.state = {hasError: false};\n  }\n\n  static getDerivedStateFromError(error)\
    \ {\n    return { hasError: true };\n  }\n\n  componentDidCatch(error, info) {\n\
    \    console.log(`error: ${error}`);\n    console.log(`info: ${info}`);\n  }\n\
    \n  render() {\n    if (this.state.hasError) {\n      return <h1>Oops! There's\
    \ been an error.</h1>\n    }\n\n    return this.props.children;\n  }\n}\n export\
    \ default ErrorBoundary;\n```\n\nWith this change to ErrorBoundary, you can now\
    \ mount the BadComponent component and open the console to see the parameters\
    \ passed to ComponentDidCatch, as shown in Figure 13-6.\n\n# Using a Logging Service\n\
    \nLogging errors to the console is fine during development, but if your app is\
    \ in the wild and being used by other people, all of those log messages that show\
    \ up in the console window stay in the user's console window and don't do anyone\
    \ any good.\n\nTo find out what errors are happening for real users, either they\
    \ need to tell you about them (which is unlikely unless the error is very bad)\
    \ or you need to implement a system that logs errors outside of the user's browser\
    \ automatically."
