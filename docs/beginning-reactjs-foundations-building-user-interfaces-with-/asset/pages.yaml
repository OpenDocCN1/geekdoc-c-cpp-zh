  md: "# Restricting Path Matching\n\nYou can use the exact attribute with Route to\
    \ restrict path matching to exact matches. Figure 12-10 shows the result of adding\
    \ exact to both of the Routes from the previous example and visiting the /login\
    \ path.\n\n![](img/532a93636824efa5dbcdf73782c1fac9_346_0.png)\n\nFIGURE 12-10:\
    \ Add the exact attribute to Routes to restrict matching\n\nIf you want to enforce\
    \ the ending slash in path matching, use the strict attribute:\n\n```\n<Route\
    \ strict path=\"/user/\">\n  <UserProfile />\n</Route>\n```\n\n# Using URL Parameters\n\
    \nURLs frequently contain dynamic data that need to be available inside of child\
    \ components. For example, in the following path, the directory name user is followed\
    \ by a slash and then a number: /user/5455"
  merge: -1
