  md: '# Expect


    Expect is commonly used for Behavior Driven Development (BDD). It uses a chain
    of functions to produce an assertion that resembles how you would describe a test
    in English. An example of using expect is shown in Listing 20-4.


    LISTING 20-4: Using Chai''s expect method


    ```

    const assert = require(''chai'').assert;

    let foo = ''bar'';

    const beverages = { tea: [''chai'', ''matcha'', ''olong''] };


    expect(foo).to.be(''string'');

    expect(foo).to.equal(''bar'');

    expect(foo).to.have.lengthOf(3);

    expect(beverages).to.have.property(''tea'').withLengthOf(3);

    ```


    # Should


    The should method extend each object with a property that starts a chain similar
    to the chains used by expect. Listing 20-5 shows examples of assertions written
    with should.


    LISTING 20-5: Using Chai''s should method


    ```

    const should = require(''chai'').should(); //actually call the function

    let foo = ''bar'';

    const beverages = { tea: [''chai'', ''matcha'', ''olong''] };


    foo.should.be(''string'');

    foo.should.equal(''bar'');

    foo.should.have.lengthOf(3);

    beverages.should.have.property(''tea'').withLengthOf(3);

    ```


    # Karma


    Jest and Mocha both run in Node.js and can test your code using a simulated browser.
    Even the best simulated browser isn''t the same as a real one, and there''s a
    possibility that your React code may not run exactly the same in Firefox as it
    does in Chrome running on an Android device.


    Karma is a tool for testing JavaScript in real browsers. It works by launching
    an HTTP server and loading your tests (with which you prefer) into each of a list
    of browsers you specify. Karma returns the result of running each test in each
    browser.


    # Nightwatch.js


    Nightwatch is an end-to-end testing tool. The idea of end-to-end testing is to
    test scenarios as from the eyes of the user. Nightwatch controls web browsers
    to simulate user actions.'
