- img_proc: true
  md: 'of your app along with their original filenames. This file doesn''t affect
    the rendering of your app, but rather, it can be used by tools to find out what
    assets your app uses without having to parse the index.html file.


    # # What’s in a Name?


    The filenames generated by Create React App include unique strings between the
    original name of the file and the extension, as you can see:


    ```

    /static/js/main.ee531687.chunk.js

    ```


    This string of random letters and numbers is a hash string. A hash string is a
    string of text calculated based the contents of the file. As a result of the build
    process inserting hash strings into files, whenever you change your React components
    and rebuild your app, the built filenames will change. This enables your application''s
    files to be cached by servers and browsers and automatically updated when you
    modify the app.


    Files may also be split into multiple “chunks” to optimize downloading and loading
    of the files. One is automatically created during the build process.


    # # HOW IS A DEPLOYED APP DIFFERENT?


    When you use Create React App''s start command, it creates the build directory
    in memory and serves it using a development server. When you use the build command,
    it creates the build directory on disk so that it can be served as a static file
    server. Other than where it was created and served, the biggest difference between
    the version of your app that you''ve been working on and testing using npm start
    and the version that created when you use build is that the version created in
    the build directory uses the production version of React.


    # # DEVELOPMENT MODE VS. PRODUCTION


    The production version of React is a minified version of the library with all
    the helpful warning messages and other tools for debugging your components stripped
    out. Minification and removal of unnecessary code makes a big difference in the
    file sizes of React and ReactDOM. The total file size for React and ReactDOM libraries
    in the development version is currently 1045Kb, while the production version is
    just 132Kb.


    You can tell whether a React app is running in development mode or production
    by clicking the icon in the Chrome extensions menu. The icon will be red for an
    app running in development mode and blue for an app running in production mode,
    as shown in Figure 14-4.'
