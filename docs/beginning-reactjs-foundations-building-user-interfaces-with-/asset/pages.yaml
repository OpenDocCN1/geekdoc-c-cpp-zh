  md: "# Setting the Initial State\n\nTo set the initial state of a stateful variable\
    \ using useState, pass the initial value into useState. The useState hook accepts\
    \ a single argument, which can be any of JavaScript's data types (or an expression\
    \ that evaluates to a single value) or a function.\n\nIf you don't pass an argument\
    \ into useState, the resulting stateful variable will be created with an initial\
    \ value of undefined.\n\nIf the initial state is an expression, it will still\
    \ run on the first render. For this reason, if your initial state is the result\
    \ of an expensive calculation (for example, it requires a network request), pass\
    \ a function that returns the initial value to useState, as shown here:\n\n```\n\
    const [mailingList,setMailingList] = useState(() =>{\n  const initialMailingList\
    \ = loadMailingList(props);\n  return initialMailingList;\n});\n```\n\nThe function\
    \ will be only run on the first render of the component. React calls this lazy\
    \ initial state.\n\n# Using the Setter Function\n\nLike the setState function\
    \ in a class component, the setter returned by useState will trigger a render.\
    \ If you pass a setter function down to a child component and call it from that\
    \ child component, it will still operate on the original variable it was created\
    \ with, as demonstrated by Listing 11-2.\n\n> LISTING 11-2: Setter functions are\
    \ bound to their creator components\n\n```\nimport { useState } from 'react';\n\
    \nfunction ButtonContainer() {\n  const [count,setCount] = useState(0);\n\n  return\
    \ (\n    <>\n      <MyButton count={count} setCount={setCount} /><br />\n    \
    \  count value: {count}\n    </>\n  );\n}\n\nfunction MyButton(props) {\n  return\
    \ (\n    <button onClick={ ()=>props.setCount(props.count+1)}>\n      Add 1 to\
    \ the Count\n    </button>\n  );\n}\n\nexport default ButtonContainer;\n```"
