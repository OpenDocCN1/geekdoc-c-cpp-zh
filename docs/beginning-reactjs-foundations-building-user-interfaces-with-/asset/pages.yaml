    \n# axios-hooks\n\nThe useAxios hook (https://www.npmjs.com/package/axios-hooks)\
    \ executes HTTP requests using the popular Axios library. It takes a URL and an\
    \ options object as parameters and returns an object containing data, the loading\
    \ status, and any error message that was returned by the URL. It also returns\
    \ a function that you can manually execute the HTTP request.\n\nListing 11-20:\
    \ Simple example of using the useAxios hook.\n\n> LISTING 11-20: Using useAxios\n\
    \n```\nimport { useState } from 'react';\nimport useAxios from 'axios-hooks';\n\
    import { API_KEY } from './config';\n\nfunction WeatherWidget() {\n  const [city,setCity]\
