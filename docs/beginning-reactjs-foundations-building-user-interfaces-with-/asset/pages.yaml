  md: "# Thinking in Components\n\nReact is a library for creating and putting together\
    \ (or composing) components to build user interfaces. React components are independent\
    \ pieces that can be reused and can pass data to each other.\n\nA component can\
    \ be something as simple as a button or it can be more complex, as a navigation\
    \ bar that's made up of a collection of buttons and dropdowns.\n\nAs the programmer,\
    \ it's your job to decide how big or small each component in your application\
    \ should be, a good rule of thumb to think about the idea of simple responsibility.\n\
    \nThe single responsibility principle, in programming, is the idea that a component\
    \ should have responsibility for a single part of a program's functionality. Robert\
    \ C. Martin, also known as \"Uncle Bob,\" is one of the most important thinkers\
    \ and writers on software design. He described the single responsibility principle\
    \ this way:\n\n> Single Responsibility means that a class [or what we call a \"\
    component\" in React] should have only one reason to change.\n\n# Composition\
    \ versus Inheritance\n\nIn object-oriented programming (OOP), it's common to create\
    \ variations of classes that inherit properties from a parent. For example, a\
    \ program might have a class Button, which might have a child class called SubmitButton.\
    \ SubmitButton would inherit all of the properties of Button, and then override\
    \ or extend them to create its functionality and look.\n\nRather than using inheritance\
    \ to create more specific components to deal with specific cases (such as a submit\
    \ button), React encourages the creation of a single component that is more robust\
    \ but can be configured by passing data into it and then combining it with other\
    \ components to handle more specific cases.\n\nFor example, in the case of a submit\
    \ button, you might simply pass a parameter to a component called label and another\
    \ parameter called handleClick that contains the action to be performed by the\
    \ button. This generalized button then serve multiple purposes, depending on the\
    \ values of label and handleClick that are passed to it. Listing 2-1 shows what\
    \ this component might look like.\n\nLISTING 2-1: Creating configurable components\n\
    \n```\nfunction Button (props) {\n  return(\n    <button onClick={props.handleClick}>{props.label}</button>\n\
    \  );\n}\n```\n\nOnce you've created a configurable component, you can create\
    \ more specific components by combining more generalized ones. This technique\
    \ is called composition. Listing 2-2 shows how you can create a specific WelcomeDialog\
    \ component from a general Dialog using composition."
