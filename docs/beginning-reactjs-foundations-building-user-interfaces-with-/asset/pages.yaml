- img_proc: true
  md: "In interfaces written using JavaScript, you don't want the form element to\
    \ submit data to a URL at all. Instead, the data should be handled by JavaScript.\
    \ The reason for this is that default action of a form reloads the form or loads\
    \ a different URL, which has the effect of reloading the underlying JavaScript\
    \ library and erasing the state of the user interface.\n\nReact doesn't have its\
    \ own method for preventing default actions. It just uses the `preventDefault`\
    \ method of the Event object. Any time you write an event handler to respond to\
    \ a submit, you must include a call to `preventDefault`, as shown in Listing 8-14.\n\
    \n# LISTING 8-14: Using preventDefault\n\n```\nfunction SignUpForm(props) {\n\
    \  const handleSubmit = (e)=>{\n    e.preventDefault();\n    props.commitFormData();\n\
    \  };\n\n  return(\n    <form onSubmit={handleSubmit}>\n      <input type=\"email\"\
    \ value={props.email} onChange={props.setEmail} />\n      <button>Sign Up!</button>\n\
    \    </form>\n  );\n}\n\nexport default SignUpForm;\n```\n\n# SUMMARY\n\nBecause\
    \ of one-way data flow, using forms and inputs in React is somewhat different\
    \ from using them in native HTML or in other frameworks and libraries. Controlled\
    \ inputs give your application complete access to user input and maintain the\
    \ fundamental React pattern of data flowing down and events flowing up.\n\nHowever,\
    \ there may be times when it's better to give up control. For this, React provides\
    \ refs and the ability to have uncontrolled inputs.\n\nIn this chapter, you learned:\n\
    \n+   * The difference between controlled and uncontrolled inputs.\n\n+   * How\
    \ to use events to get data from a controlled input.\n\n+   * How to use refs\
    \ to get data from an uncontrolled input.\n\n+   * How to use different types\
    \ of input elements.\n\n+   * How to prevent a form's default action.\n\nIn the\
    \ next chapter, you'll learn about refs, which when used wisely, can do much more\
    \ than just getting data from uncontrolled inputs."
  merge: -1
  pgno: 275
- img_proc: true
  md: '# Refs


    Refs are one of the most-often debated and controversial topics in React. Hundreds
    of blog posts and articles on the web will caution you to avoid refs. The official
    documentation for React even says (several times, in fact) that you should avoid
    using them, except in particular situations.


    Knowing exactly when it''s okay to use refs and when using them is one of the
    things you''ll pick up with more experience, but my aim in this chapter is to
    give you a head start on understanding why refs are such a hot-button issue, and
    some practical advice on how to use them correctly.


    In this chapter, you''ll learn:


    +   - How to use refs in class components.

    - How to use refs in function components.

    - When you should use refs.

    - When you shouldn''t use refs.

    - How to maintain the correct focus in a form.


    # WHAT REFS ARE


    Nothing is perfect, and that includes React. There are rare, but unavoidable,
    times when one-way data flow and the declarative way of only modifying children
    via props break down. In these cases, which I''ll demonstrate in more detail and
    with plenty of examples in this chapter, a React developer needs to be able to
    imperatively get into a child component or a DOM node to make changes or access
    some property directly. For these cases, React provides an "escape hatch" called
    refs.


    A ref reference to a child component allows you to modify a child component or
    DOM node from the parent component, rather than by using the standard method of
    modifying children by only passing props into them.'
  merge: -1
  pgno: 276
- img_proc: true
  md: "# HOW TO CREATE A REF IN A CLASS COMPONENT\n\nIn a class component, refs are\
    \ created using React.createRef. Once you have a ref, you can assign it to a child\
    \ component by passing it as the value of the ref attribute. Listing 9-1 shows\
    \ how to create a ref to a textarea element from a component called TextReader.\n\
    \n+   LISTING 9-1: Creating a ref in a class component\n\n```\nimport React, {Component}\
    \ from 'react';\n\nclass TextReader extends Component {\n  constructor(props)\
    \ {\n    super(props);\n    this.textView = React.createRef();\n  }\n  render()\
    \ {\n    return (\n      <textarea ref={this.textView} value={this.props.bookText}\
    \ />\n    );\n  }\n}\n```\n\n# HOW TO CREATE A REF IN A FUNCTION COMPONENT\n\n\
    In a function component, you can use the useRef hook to create a ref, as shown\
    \ in Listing 9-2.\n\n+   LISTING 9-2: Creating a ref with useRef()\n\n```\nimport\
    \ {useRef} from 'react';\n\nfunction TextReader(props) {\n  const textView = useRef(null);\n\
    \n  return (\n    <textarea ref={textView} value={props.bookText} />\n  );\n}\n\
    \nexport default TextReader;\n```\n\n# USING REFS\n\nOnce you have a ref and you\
    \ have assigned it to a child element, you can access the properties of that child\
    \ element by using a property of the ref called current. When you create a ref\
    \ to a DOM element, current contains the properties of the DOM node (meaning what\
    \ it's rendered in the browser)."
  merge: -1
  pgno: 277
- img_proc: true
  md: "When you create a ref to a custom element, current receives the mounted instance\
    \ of the component.\n\nRefs can only be passed to class components and DOM elements.\
    \ Although they can be created inside function components, refs can't be passed\
    \ to function components. The reason why you can't create a ref to a function\
    \ component is that functions don't have an instance.\n\nIf you need to pass a\
    \ ref to a component that's currently a function component, the easiest way to\
    \ do it is by converting the function component to a class component.\n\n> NOTE\
    \ Remember: Function components and class components can co-exist within the same\
    \ React UI. There's no need to choose one over the other. Use what you're comfortable\
    \ with or what works best for your component.\n\nWith access to the properties\
    \ and methods of the child, the parent component can pretty much do whatever it\
    \ wants. You could think of creating a ref as like implanting a chip into your\
    \ child that will allow you to remotely control them, but no one would actually\
    \ do that or want.\n\nListing 9-3 shows how to call the DOM focus on a textarea\
    \ from its parent component. The reason to do this is to make sure that the textarea\
    \ containing the text will focus when it mounts so you can scroll through using\
    \ arrow keys without having to click on first.\n\n# LISTING 9-3: Calling a DOM\
    \ method on a child using a ref\n\n```\nimport React, {Component} from 'react';\n\
    \nclass TextReader extends Component {\n  constructor(props) {\n    super(props);\n\
    \    this.textView = React.createRef();\n  }\n\n  componentDidMount() {\n    this.textView.focus();\n\
    \  }\n\n  render() {\n    return (\n      <textarea style={{width:'380px',height:'400px'}}\
    \ ref={this.textView}}>{this.props.bookText}</textarea>\n    );\n  }\n}\n\nexport\
    \ default TextReader;\n```"
  merge: -1
  pgno: 278
- img_proc: true
  md: '# 236 | CHAPTER 9 REFS


    Figure 9-1 shows what the TextReader component looks like rendered in a browser.
    Notice the highlight around the text area, which indicates it has focus.


    ![](img/532a93636824efa5dbcdf73782c1fac9_279_0.png)


    FIGURE 9-1: The TextReader component


    # CREATING A CALLBACK REFS


    A third way to create a ref is with callback ref. A callback ref doesn''t use
    the createRef function. Instead, it is a function that you pass to the ref attribute,
    which receives the React component instance or the HTML element as its argument.


    Using a callback rather than createRef or useRef is useful when you''re attaching
    the ref to something dynamic. The function you pass to ref attribute will be called
    (with the instance or element passed into it) then it will be called with null
    when the component unmounts.


    Listing 9-4 shows an example of creating a callback ref. Notice the use of the
    condition in the focusTextView method, which allows you to avoid calling the focus
    method on the ref if the element is unmounted.'
  merge: -1
  pgno: 279
- img_proc: true
  md: "# LISTING 9-4: Creating a callback ref\n\n```\nimport {Component} from 'react';\n\
    \nclass TextReaderCallback extends Component {\n\n  constructor(props) {\n   \
    \ super(props);\n    this.textView = null;\n  }\n\n  this.setTextView = element\
    \ => {\n    this.textView = element;\n  };\n\n  this.focusText = () => {\n   \
    \ if (this.textView) this.textView.focus();\n  };\n\n  componentDidMount() {\n\
    \    this.focusText();\n  }\n\n  render() {\n    return (\n      <textarea style={{width:'380px',height:'400px}}\n\
    \        ref={this.setTextView}\n        value={this.props.bookText} />\n    );\n\
    \  }\n}\n\nexport default TextReaderCallback;\n```\n\nRef callbacks are often\
    \ passed to child components as inline functions, as shown in Listing 9-5.\n\n\
    # LISTING 9-5: Passing a ref callback as an inline function\n\n```\nimport {Component}\
    \ from 'react';\n\nclass TextReaderCallback extends Component {\n\n  constructor(props)\
    \ {\n    super(props);\n    this.textView = null;\n  }\n\n  this.focusText = ()\
    \ => {\n    if (this.textView) this.textView.focus();\n  };\n\n  componentDidMount()\
    \ {\n```"
  merge: -1
  pgno: 280
- img_proc: true
  md: "```\nthis.focusTextView();\n}\n\nrender() {\n  return (\n    <textarea style={{width:'380px',height:'400px'}}\n\
    \      ref={(e)=>this.textView = e}\n      value={this.props.bookText} />\n  );\n\
    }\n\n```\n\nOne caveat to using the inline ref callback syntax is that it will\
    \ cause the ref callback to be executed twice when the component first mounts—with\
    \ null, and again with the element passed into it. This is not a major concern,\
    \ but if you want to avoid this extra execution of the callback-you can simply\
    \ define the callback in the constructor.\n\n# WHEN TO USE REFS\n\nAlthough they\
    \ allow you to directly manipulate React components and DOM elements from parent\
    \ components, refs are a powerful tool. Certain important tasks in a web application\
    \ are perfect jobs for refs. These include:\n\n+   - Managing focus\n- Automatically\
    \ selecting text within a child element\n- Controlling media playback\n- Setting\
    \ scroll position on a child element\n- Triggering imperative animations\n- Integrating\
    \ with third-party libraries (such as jQuery, for example)\n\nAlthough you may\
    \ not need to perform any of these tasks very often, when you do need them, they’re\
    \ impossible or nearly impossible to do simply by passing props.\n\n# WHEN NOT\
    \ TO USE REFS\n\nWith great power comes responsibility. In theory, you could use\
    \ refs to bypass all the features of React and just change the contents of elements,\
    \ change methods of components, change element styles, and anything else you need\
    \ to do in your application in an imperative way. But, this would defeat the purpose\
    \ of using React."
  merge: -1
  pgno: 281
- img_proc: true
  md: "As a rule, if there's a way to do something by passing props to children (what\
    \ we call the “React Way”) that’s what you should do. Breaking out of the fundamental\
    \ pattern that makes React work so well will make your app more complicated, harder\
    \ to debug, and likely less performant.\n\n# EXAMPLES\n\nFinding working examples\
    \ of some of the use cases for refs can be difficult. So, for the rest of this\
    \ chapter, I'll provide some code that you can study and try out to better understand\
    \ the appropriate uses for refs.\n\n# Managing Focus\n\nProperly managing focus,\
    \ especially in a web form, is an important part of user interface usability and\
    \ accessibility.\n\nThe most basic use case for managing focus is shown in Listing\
    \ 9-3. The same technique is commonly used to automatically place the cursor into\
    \ the first field in a login form when it loads.\n\nAnother common use for managing\
    \ focus is to return a user to the same field they were editing before a modal\
    \ window was opened or after they saved their input into a form and return to\
    \ it at a later time.\n\n# Automatically Selecting Text\n\nSelecting in a child\
    \ element can be useful for making components that display text and provide a\
    \ button for copying the text. This is often done in applications that generate\
    \ some kind of code or key. Listing 9-6 shows an example of a text input with\
    \ a button for copying contents.\n\nThis example also demonstrates how to display\
    \ a temporary notification in a React component. After you code, the component\
    \ updates a state variable message to display a success message. This state change\
    \ triggers the componentDidUpdate lifecycle hook, which uses JavaScript’s setTimeout\
    \ to wait three seconds and then set message back to an empty string, removing\
    \ the success message.\n\n> LISTING 9-6: Selecting and copying text with a ref\n\
    \n```\nimport React,{Component} from 'react';\n\nclass CodeDisplay extends Component\
    \ {\n\n  constructor(props) {\n    super(props);\n    this.state={message:''};\n\
    \n    this.codeField = React.createRef();\n    this.codeCopy = this.codeCopy.bind(this);\n\
    \  }\n```\n\ncontinues"
  merge: -1
  pgno: 282
