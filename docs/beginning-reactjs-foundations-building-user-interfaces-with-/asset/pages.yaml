- img_proc: true
  md: 'continued

    If you declare a variable outside of a function, it will have global scope, meaning
    that you can use it anywhere in your program.


    In reality, a global is what you want (and if you''re not using "strict" mode)
    you didn''t even need to use the var keyword, because if you just assigned a value
    to a name, the result will be a global variable, no matter where in program you
    do the assignment. Another way to think about what happens when you create a variable
    without declaring it is that new property is created on the global object (window
    in the case of a browser). This "feature" of loose-mode JavaScript is called implicit
    globals, and it can be very dangerous, which is why strict mode disallows it.


    In JavaScript, variables created using the var keyword are considered to be dangerous,
    and their use is discouraged. The reason is that function scope is almost always
    unnecessary and makes it too easy to accidentally overwrite or redeclare a variable.


    Most developers and experts now recommend using the new const and let-keywords
    explicitly.


    # Using const


    The const keyword creates a variable that can only have one value during its lifetime,
    which we call a constant. To create a constant, just use the const keyword followed
    by a val name:


    ```

    const x;

    ```


    However, because you cannot change a constant, and declaring a variable automatically
    assigns it a value of undefined, if you want to have a value other than undefined,
    you must initialize it at the same time as the declaration:


    ```

    const x = 10;

    ```


    Attempting to change the value of a const will result in an error in JavaScript.
    Note, however, if you assign an object or an array to a constant, you can still
    change the properties of that object or the items within. You would not be able
    to reassign the variable with a completely new object or array, however.


    # Block Scoped Variables with let


    The other way to declare variables is with the let keyword, which creates a block-scoped
    variable. This is also known as lexical variable scoping. In JavaScript, a block
    is created by a pair of curly braces. Since loops and conditional statements as
    well as function blocks, let makes it possible to have variables that are function-scoped
    (by declaring them at the top level of a function), but it enables you to create
    variables that have more limited scope, such as inside of a loop.


    Variables created using const also have block scope.'
