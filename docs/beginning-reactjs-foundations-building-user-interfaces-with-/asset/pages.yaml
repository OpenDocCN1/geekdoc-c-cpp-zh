  md: "# Memoized Callbacks with useCallback\n\nFunctions that define in components\
    \ are normally re-created with each render. This is not usually a problem. However,\
    \ sometimes you need to (or should for performance reasons) return a memoized\
    \ version of the function to keep it alive between renderings. This is where useCallback\
    \ comes in.\n\nListing 11-12 shows the most common use case for useCallback. In\
