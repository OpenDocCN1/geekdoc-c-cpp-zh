    the application) and for production (which is when the application is deployed
    and available to end users).


    The production version of React uses minified component names, and most of the
    debugging functionality is removed in order to increase performance and decrease
    the size of the download required for the browser to run React.


    Spend a few minutes clicking around the Components tab and exploring the different
    components. Click the inspector icon in the upper left of the window and remember
    the icon for the Chrome DevTools element inspector you saw.


    The React Developer Tools'' element inspector works similarly to the Chrome DevTools''
    element inspector (and to the Firefox inspector too, for that matter). The difference
    between these two tools is essential to understand, however. Whereas the browser
    inspector can be used to highlight and view the HTML and styles that are in the
    browser''s DOM, the React element inspector allows you to highlight and view the
    React components that were rendered on the page. You can think of the Components
    tab as a higher-level view.


    The React components you can inspect through the React Developer Tools eventually
    produce the DOM nodes (which represent HTML and styles) that you can browse using
    the browser''s element inspector.


    The Profiler gives you information about the performance of your React application.
    Profiling is disabled in the production version of React, so this tab won''t do
    much when you view a public page that uses React. We''ll explore and use the Profiler
    to show how it can be used to debug and tune your React applications in Chapter
    5.


    # Intro Create React App


    The most common way to get started with React is to use a package called Create
    React App. Create React App is an officially supported tool that installs a toolchain
    for React development and configures a boilerplate React application that you
    can use as a starting point for your projects.


    To install and run Create React App, you can use a command that comes as part
    of the npm package manager called npx. npx is a package runner. Earlier in this
    Introduction, you used the npm command to install a node package. Once a package
    is installed, you can run it by using the npm start command. npx is similar to
    a combination of npm install and npm start. If the package is already installed
    globally on your computer when you issue a command to run it with npx, the alreadyinstalled
    package will be run. If it''s not installed, running it with npx will cause it
    to be downloaded, temporarily installed locally, and run.'
