  md: '# # THE COMPONENT LIFECYCLE


    During the time when a React application is running, components become active,
    do their thing, and are destroyed. At each stage in the life of a component, certain
    events are fired and methods are invoked. These events and methods make up the
    component lifecycle.


    The stages of a component''s life are:


    +   * **Mounting:** Mounting is where a component is constructed using the props
    passed into it and the default state, and the JSX returned is re-rendered.

    * **Updating:** Updating happens when the state of the component changes and the
    component is re-rendered.

    * **Unmounting:** Unmounting is the end of the component lifecycle, when the component
    is removed from the active application.

    * **Error handling:** The error handling methods run when an error happens during
    a component''s lifecycle.


    In class components, you can override the lifecycle methods to run your code in
    response to lifecycle events. Function components can simulate lifecycle methods
    using a hook called useEffect, which I''ll cover in detail in Chapter 11.


    Understanding the main events in the lifecycle of a component is key to understanding
    how React works. Figure 4-5 shows the component lifecycle as a flowchart.


    ![](img/532a93636824efa5dbcdf73782c1fac9_133_0.png)


    FIGURE 4-5: The component lifecycle'
  merge: -1
  pgno: 133
- img_proc: true
  md: 'The following sections will examine the four stages of the component lifecycle
    and then explore how you can avoid errors and improve performance with the lifecycle
    as well.


    # # Mounting


    The mounting stage includes everything when a component is first constructed until
    it is inserted into the DOM. During the mounting lifecycle stage, the following
    methods run, in this order:


    +   * constructor

    * staticDerivedStateFromProps

    * render

    * componentDidMount


    # # constructor()


    You''ve already learned about the constructor. This is the method that automatically
    runs in an instance of a class when it''s created. In a React component, it may
    include a call to the super method, initialization of the component''s state object,
    and binding of event handlers.


    # # static getDerivedStateFromProps


    This is a static method, meaning that it doesn''t have access to the this keyword.
    The purpose of getDerivedStateFromProps is to check whether the props has changed
    and use the new props to update the state. This method runs both during the mounting
    stage as well as during the updating stage.


    # # render


    Like getDerivedStateFromProps, the render method also runs once during the mounting
    stage. After mounting, render runs every time the component updates. This is the
    method that generates the JSX output of your component, and it''s the only required
    method in a class component.


    # # componentDidMount()


    The componentDidMount runs when the component has finished mounting and has been
    inserted in the browser DOM. This is the point at which it is safe to do things
    that depend on DOM nodes, or to fetch remote data.


    # # Updating


    After your component has mounted, the updating lifecycle methods start running.
    React components update their data and re-render in response to changes to the
    state object made using the setState function. Every time a component updates,
    the following methods run, in this order:


    +   * static getDerivedStateFromProps

    * shouldComponentUpdate'
  merge: -1
  pgno: 134
- img_proc: true
  md: "+   - > render\n\n+   - > getSnapshotBeforeUpdate\n\n+   - > componentDidUpdate\n\
    \nThe getDerivedStateProps and render methods serve the same purposes in the updating\
    \ stage during the mounting stage. let's take a look at the three lifecycle methods\
    \ that are unique to the updating stage.\n\n# shouldComponentUpdate\n\nThe default\
    \ behavior of a React component is to update every time the state changes. There\
    \ are times, however, when you might want to React that a change to the state\
    \ doesn't affect a component and it's not necessary to go through the updating\
    \ process.\n\nThis method, when it's present, may return true or false. If you\
    \ have a component that you will never need to be updated, you can prevent it\
    \ from updating using this code:\n\n```\nshouldComponentUpdate() {\n  return false;\n\
    }\n```\n\nMore often, the way shouldComponentUpdate is used to compare the previous\
    \ props and state with the new props and state and to decide whether to update\
    \ the component. This is possible because React passes the props and state that\
    \ will be used for the upcoming rendering into shouldComponentUpdate. In Listing\
    \ 4-30, the value of a prop is compared with the value of that in the nextProp\
    \ object to determine whether to re-render.\n\nLISTING 4-30: Comparing previous\
    \ and next props in shouldComponentUpdate\n\n```\nclass TodoItem extends Component\
    \ {\n  shouldComponentUpdate(nextProps, nextState) {\n    return nextProps.isChecked\
    \ !== this.props.isChecked;\n  }\n}\n```\n\n# getSnapshotBeforeUpdate\n\nThis\
    \ lifecycle method happens right after the rendered output from the component\
    \ is made active in the DOM. The purpose of this method is to allow you to capture\
    \ information about the state of the browser (or other output device) prior to\
    \ it.\n\nAlthough it's rare that you'll have need to use this lifecycle method,\
    \ one example for it is to maintain the scroll position of an element (such as\
    \ a text) between renders. If an update to the browser DOM would affect the user\
    \ is currently viewing in the browser, getSnapshotBeforeUpdate can be used to\
    \ find out the relevant information about the browser DOM so that it can be restored\
    \ after the update happens."
