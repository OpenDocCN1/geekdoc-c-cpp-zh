  md: '# 32 | CHAPTER 3 JSX


    > NOTE prior to version 17, the JSX Transform converted JSX into React.createElement()
    statements. With React 17, the JSX Transform was rewritten so it transforms JSX
    into browser-readable code without using React.createElement(). The result is
    developers no longer need to import React into every component in order to use
    JSX.


    It is interesting sometimes to see how Babel converts JSX into JavaScript, and
    you can do this by either viewing the source code for React/repl or pasting your
    JSX code into the web-based version of Babel at babel.io/repl, as shown in Figure
    3-1.


    ![](img/532a93636824efa5dbcdf73782c1fac9_76_0.png)


    FIGURE 3-1: Trying out Babel on the web


    Babel does more than just convert JSX into JavaScript. It also takes projects''
    programmers using new and experimental syntax that might not be supported by all
    of your target web browsers and converts it into JavaScript that can be understood
    and run in any browser that expects to access your React interface.'
