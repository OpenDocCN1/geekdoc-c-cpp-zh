  md: "# What Is state?\n\nIn a React component, state is an object containing a set\
    \ of properties that may change over the lifetime of the component. Changes to\
    \ the properties in the state object control the behavior and updating of the\
    \ component.\n\n# Initializing state\n\nInitializing state is the process of defining\
    \ the properties of the state object and setting its initial values. The initial\
    \ values are the values that will be used for the first rendering of a component.\n\
    \n# Initializing state in Class Components\n\nPrior to the introduction of React\
    \ Hooks, class components were the only place where you could use state. Hooks\
    \ made it possible to use state in function components, but if you want to take\
    \ advantage of the full power of React, including all of the lifecycle methods,\
    \ classes are still the best (in some cases only) way to go.\n\nThere are a few\
    \ important rules about initializing the state of a class component:\n\n+   1.\
    \ The state object of a class component can have as many or as few properties\
    \ as you need.\n2. Not all components need to have state.\n3. If your component\
    \ does use of state, you must initialize it.\n4. The constructor function is the\
    \ only place where you can change state directly.\n\nIn a class component, the\
    \ most common way to initialize the state object is in the constructor function,\
    \ as shown in Listing 6-21.\n\n> LISTING 6-21: Initializing state in a class component\n\
    \n```\nimport {Component} from 'react'\n\nclass NewsFeed extends Component {\n\
    \  constructor(props) {\n    super(props);\n    this.state = {\n      date: new\
    \ Date(),\n      headlines: []\n    }\n  }\n  render() {\n    return (\n     \
    \ <h1>Headlines for {this.state.date.toLocaleDateString()}</h1>\n      ...)\n\
    \  }\n}\n```"
