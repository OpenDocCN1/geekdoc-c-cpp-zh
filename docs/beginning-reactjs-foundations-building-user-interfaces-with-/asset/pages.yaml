  md: "# Working with localStorage\n\nTo demonstrate how to use localStorage, we'll\
    \ start with a simple app that doesn't use localStorage. Listing 16-6 shows a\
    \ simple counter web application that could be used on a mobile device by someone\
    \ at a retail store, for example. Every time the button is clicked, it increments\
    \ a counter.\n\nLISTING 16-6: A Clicker app\n\n```\nimport {useState} from 'react';\n\
    import './style.css';\n\nfunction Clicker() {\n  const [count, setCount] = useState(0);\n\
    \n  const incrementCount = () => {\n    setCount (prev)->prev+1);\n  };\n\n  return(\n\
    \    <div className=\"container\">\n      <h1 className=\"current-count\">{count}</h1>\n\
    \      <button className=\"increment-button\" onClick={incrementCount}>++</button>\n\
    \    </div>\n  );\n}\n\nexport default Clicker;\n```\n\nThe idea of the Clicker\
    \ app is that the staff can use to keep track of how many people visit the store\
    \ during a day. But, as it's written now, the data is erased each time you leave\
    \ the page and return. To fix it, we can cache it locally.\n\n# Storing Data with\
    \ localStorage\n\nTo store a key/pair in localStorage, use the getItem method.\
    \ This method takes two arguments—the key and the value:\n\n```\nlocalStorage.setItem('zipcode',\
    \ '97103');\n```\n\nKeep in mind that Web Storage can only store string data.\
    \ If you want to store another data type in Web Storage, you'll need to convert\
    \ it to a string and then back when you read it.\n\nBecause storing data in localStorage\
    \ is a side effect, the best place to put a call to getItem is inside the useEffect\
    \ hook (in a function component) or in a lifecycle method (in a class component).\
    \ You can use the second parameter of useEffect to specify that the effect should\
    \ run each time the state value you want to store changes, as shown in Listing\
    \ 16-7."
