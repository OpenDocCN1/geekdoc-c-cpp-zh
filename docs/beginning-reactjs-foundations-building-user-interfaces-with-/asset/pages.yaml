  md: "An expression is any valid unit of code that resolves to a value. Here are\
    \ some examples of valid JavaScript expressions:\n\n+   Arithmetic: 1+1\n\n+ \
    \  String: \"Hello,\" + \"World!\"\n\n+   Logical: this === that\n\n+   Basic\
    \ keywords and general expressions: This includes certain keywords (such as this,\
    \ null, true, and false) as well as variable references and function calls.\n\n\
    Examples of structures in JavaScript that do not return a value for loops and\
    \ if statements, as well as function declarations (using the function keyword).\
    \ You can still use these in React components, of course, but you'll need to use\
    \ them outside of the return statement, as we did in Listing 3-9.\n\nFunctions\
    \ can be included in JX, provided that they are invoked immediately and that they\
    \ return a value that can be parsed by JX, or that they are passed as values for\
    \ an attribute. The component in Listing 3-12 has a return statement that includes\
