  md: 'As you''ll see, just having the ability to accomplish the same thing with less
    code, hooks also give you the ability to split your components into smaller parts
    by creating custom hooks.


    Now that you understand the motivation for hooks, let''s take a look at the specifics.


    # RULES OF HOOKS


    Although different hooks accomplish different things, all of them have two important
    rules which must be followed:


    +   1. Hooks can only be used in function components.

    2. Hooks must be called at the top level of your function components—meaning inside
    the function, but not inside of a statement or inner function. Because hooks need
    to run once every time your function runs, they can''t be called from inside of
    conditional statements, loops, or nested functions.


    # THE BUILT-IN HOOKS


    React has 10 built-in hooks that you can use without needing to install anything
    else. These built-in hooks are:


    +   - useState

    - useEffect

    - useContext

    - useReducer

    - useCallback

    - useMemo

    - useRef

    - useImperativeHandle

    - useLayoutEffect

    - useDebugValue


    The first three hooks—useState, useEffect, and useContext—are the basic hooks.
    They''re use most often and are therefore the most important ones to understand.


    The other seven hooks are called "Additional Hooks" in the React documentation.
    These are hooks that you may use occasionally (or never) or which are variations
    on the three basic hooks. There are some really useful things (and a couple that
    are essential, in my opinion) in this set of hooks, however, so I''m going to
    spend some time covering them and showing examples of how to use them as well.'
