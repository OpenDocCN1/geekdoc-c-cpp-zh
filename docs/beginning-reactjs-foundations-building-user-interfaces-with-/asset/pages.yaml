  md: '# INTRODUCTION


    If you have an older version of npm installed, it can cause some of the commands
    we''ll run in this Introduction and the book''s chapters to not work correctly.
    If you use MacOS, you can upgrade npm by entering the following command in the
    Terminal:


    ```

    sudo npm install -g npm

    ```


    After you type this command in the Terminal and press Enter, you''ll be asked
    for a password. This is the password that you use to log in to your computer.


    If you use Windows, you can upgrade npm by entering the following command:


    ```

    npm install -g npm

    ```


    Note that you must have administrative access to your computer to run this command.


    The npm install command is how you can download and install Node.js packages to
    your computer so you can run them or other programs can make use of them. When
    a computer program needs another npm program in order to run, we call the program
    it requires a dependency. Because Node.js programs are made up of small packages
    that individually have reusable and limited functionality, it is not uncommon
    for a Node.js package to have hundreds of dependencies.


    When you run npm install followed by the name of a Node.js package, npm looks
    for that package in the npm repository, downloads it (along with all of its dependencies),
    and installs it. Packages may be installed globally, which makes them available
    to any program on your computer, by specifying the -g flag after the install command.
    So, when we say npm install-g npm, what happens is that the npm package installs
    the latest version of itself. In other words, it upgrades.


    In addition to being able to install packages globally, npm can also install packages
    locally, which makes them available only to the current project.


    > Whenever possible, it''s a good practice to only install packages locally in
    order reduce the potential for version conflicts and to make your programs more
    reusable and easily shared.


    Follow these instructions to see the npm install command in action:


    +   1. Open Visual Studio Code and click the File Explorer icon on the left toolbar.

    2. Click Open Folder and use the file browser that it opens to create a new folder
    chapter-0 in your computer''s Documents folder and open that.

    3. Open the Integrated application in Visual Studio Code. It will open a command-line
    interface and set the current directory to the folder that you have open.

    4. Type npm init -y. Running npm init creates a new file called package.json,
    whose purpose is to track dependencies and other meta information about your node
    package.'
