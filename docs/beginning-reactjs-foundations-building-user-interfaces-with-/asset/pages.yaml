    \ and the componentDid() lifecycle methods in a class component. However, there\
    \ is an important difference between these lifecycle methods and how useEffect\
    \ works. Namely, the timing of when a class component's lifecycle methods run\
    \ and useEffect runs are different. Most of the time this isn't an issue, but\
