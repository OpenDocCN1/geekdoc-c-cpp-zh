    HTTP or HTTPS.


    # The static Directory


    The static directory build holds the compiled JavaScript and CSS files and sourcemap
    files. The compiled JavaScript files are built from the React and ReactDOM libraries,
    other packages from the node_modules folder, and the source code you wrote. All
    of these are combined, transpired to be compatible with your target browsers,
    minified, and output as static files. The same happens with the CSS files.


    The sourcemap files (which end in .map) provide mappings between the minified
    static files and the original formatted code. Sourcemap files can be read by web
    browsers to allow you to view and debug readable code in the browser developer
    tools.


    # asset-manifest.json


    As part of the build process, a file named asset-manifest.json will be created.
    This file functions much like the .map files, for filenames. It lists the files
    that were generated during compilation'
  merge: -1
