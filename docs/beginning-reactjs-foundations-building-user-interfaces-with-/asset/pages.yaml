    # SUMMARY


    The ability to consume Context from function components with the useContext Hook
    makes React Context easy and convenient. But, React Context is a tool that should
    be used sparsely or not at all in most apps. When you need it, however, it''s
    invaluable as a way to manage small pieces of global data.


    In this chapter, you learned:


    +   * What prop drilling is and how React Context can eliminate it.

    * When to use React Context.

    * When not to use React Context.

    * How to use composition as an alternative to Context.


    In the next chapter, you’ll learn about using React Portals to break out of the
    confines of a React app’s root DOM node.'
