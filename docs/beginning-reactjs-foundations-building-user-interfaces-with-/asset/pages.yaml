  md: '# Back End


    # Front End


    ![](img/532a93636824efa5dbcdf73782c1fac9_64_0.png)


    FIGURE 2-4: How the web works


    You know already that React is a front-end JavaScript library. As you can see
    from the preceding-diagram, there are many other pieces of the web ecosystem.
    Here are a few of the things that React is *not*.


    # React Is Not a Web Server


    A web server, also known as an HTTP server, has as its primary job to accept requests
    for web pages from web browsers and return those pages to the browser along with
    all of their linked interfaces, CSS files, and JavaScript files.


    The React library and the user interfaces you create React are among the linked
    JavaScript files that a web server sends to a web browser, and React itself has
    no ability to handle requests from web browsers, although it can interact with
    the browser, just as any JavaScript code can, through the browser''s application
    programming interfaces (APIs).


    # React Is Not a Programming Language


    React is a JavaScript library, which means that it is just a collection of JavaScript
    functions that programmers can make use of. The idea of a library is to simplify
    common tasks that programmers do frequently so that they can just focus on writing
    the code that makes a program unique.'
  merge: -1
  pgno: 64
- img_proc: true
  md: 'If you had enough time and knowledge, you could rewrite every bit of the React
    library yourself using JavaScript—but, of course, there''s no reason to do that,
    because the React developers have done it for you.


    # React Is Not a Database Server


    React doesn''t have any abilities to store data in a secure way or in a permanent
    way. Instead, React user interfaces (like every web and mobile web interface)
    communicate with server-side-bases over the internet to store and receive data
    such as login information, ecommerce transaction data, news feeds, and so forth.


    The data that React uses to make user interfaces dynamic


    # React Is Not a Development Environment


    As you saw in the book''s Introduction, you''ll use plenty of different tools
    to program with React. Collectively, these are the most commonly used tools (and,
    in some cases, just your own preferences), but there''s nothing about React that
    requires you to use these specific tools. In many cases, there are alternatives
    available, and you might discover that you prefer others than I (or, you may discover
    a better tool that I''m not aware of). It''s possible to write perfect React code
    using any tools you want, or using tools at all (other than a text editor).


    # React Is Not the Perfect Solution to Every Problem


    React works well for many types of applications, but it''s not always the best
    solution. This is true of any JavaScript library, and it''s probably true of every
    single tool ever invented. It''s important to know about a wide variety of different
    languages and libraries so that you can make good choices and know when the tools
    you prefer to use or that you know are the best and when they might not be the
    best.


    # SUMMARY


    Because React is a different way of writing user interfaces for the web, it has
    concepts and foundational ideas that are important to understand before you can
    work with it effectively. In the end, however, writing React user interfaces is
    straightforward:


    +   1. You write components to describe how the user interface should look and
    act.

    2. React renders your components to create a tree of nodes.

    3. A React renderer figures out the differences between the latest rendered component
    tree and the previous one and updates the user interface accordingly.'
