  md: "# What Is PropTypes?\n\nPropTypes is a tool for type checking and documenting\
    \ props in React components. For each prop in your component, you can specify\
    \ rules the value coming into the prop will be tested against. If the prop value\
    \ doesn't pass those rules, a message will be displayed in the JavaScript console\
    \ in your browser.\n\nPropTypes only displays warning messages when you're using\
    \ the development version of React. Once your app is deployed and using the production\
    \ version of React, PropTypes is silent.\n\nFor example, the WelcomeMessage component\
    \ in Listing 6-2 uses a prop called firstName to display a customized header message.\
    \ You can tell from looking at the code in this component that the value of the\
    \ firstName prop should be a string.\n\n+   LISTING 6-2: A component that uses\
    \ a string prop (props)\n\n```\nfunction WelcomeMessage(props) {\n  return (<p>Welcome\
    \ back, {props.firstName}!</p>);\n}\n\nexport default WelcomeMessage;\n```\n\n\
    Now, you should be able to guess what the output of this component will be when\
    \ you pass a prop name into it through an element like the following:\n\n```\n\
    <WelcomeMessage firstName = \"Grover\" />\n```\n\nBut, what happens if you pass\
    \ something that's not a string into the firstName prop? The following element\
    \ passes an array into the firstName prop:\n\n```\n<WelcomeMessage firstName =\
    \ {{['Jimmy', 'Joe']}} />\n```\n\nThe result may not be what you'd expect, as\
    \ shown in Figure 6-6.\nReact doesn't consider this case to be an error, so it\
    \ may not be obvious at first what the cause of the unexpected output is. This\
    \ is especially true in components that make use of many different props.\nListing\
    \ 6-3 shows how you can use PropTypes to validate this prop.\n\n+   LISTING 6-3:\
    \ Validating that a prop is a string 'prop-types'\n\n```\nimport PropTypes from\
    \ 'prop-types';\n\nfunction WelcomeMessage(props) {\n  return (<p>Welcome back,\
    \ {props.firstName}!</p>);\n}\n\nWelcomeMessage.propTypes = {\n  firstName: PropTypes.string\n\
    }\n\nexport default WelcomeMessage;\n```"
  merge: -1
