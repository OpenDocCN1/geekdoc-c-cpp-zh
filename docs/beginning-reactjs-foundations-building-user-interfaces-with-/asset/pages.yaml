  md: 'Before we get to how that works, let''s look briefly at Why React uses one-way
    data flow and the benefits of it.


    # Why One-Way Data Flow?


    Two-way data flow, also known as bidirectional data flow, where a component''s
    data can be modified by its parent and changes within the component can directly
    affect data in the parent, is convenient. However, it also increases the complexity
    of a user interface, and, in turn, increases the potential for errors.


    Figure 6-2 shows an example of a user interface that makes use of two-way data
    flow. Notice that there are multiple ways for data in the model to be changed,
    and the controller is required in order to manage changes.


    ![](img/532a93636824efa5dbcdf73782c1fac9_169_0.png)


    FIGURE 6-2: Bidirectional data flow


    In bidirectional data flow, it''s not possible to tell whether the view was updated
    by interacting with the view or by the data in the model changing.


    Figure 6-3 shows a diagram of one-way data flow in a user interface. The only
    way that a view (what''s displayed in the browser) can be changed is by changing
    the data in the model (which is the state object in React).


    ![](img/532a93636824efa5dbcdf73782c1fac9_169_1.png)


    FIGURE 6-3: Data flowing in one direction'
