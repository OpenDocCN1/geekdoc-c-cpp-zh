  md: '# Setting Initial State with useState


    The first time a function component calls useState, the returned variable will
    be assigned the value you pass into useState. This parameter is optional. If you
    call useState without passing an initial value, the variable will be assigned
    a value of undefined.


    The initial state can be of any JavaScript data type, but it should be of the
    same data type as you will be setting the variable inside your component. For
    example, if you create a state variable to hold an array of products that will
    be loaded from an API, the initial value of products should be an empty array
    ([]).


    If you pass a function to the useState hook, the function will be invoked and
    its return value will be used as the initial state.


    # Why use const with useState?


    It may seem weird to use const for a stateful variable, since the whole purpose
    of a stateful variable is to be changed and the purpose of const is to prevent
    a variable from being changed. Nevertheless, I recommend that you use const with
    useState, and it actually makes sense when you think about how functions (and
    therefore function components) work.


    Consider the example of a stateful variable named counter and a setter function
    setCounter. Calling setCount and passing it a new value sets the value of a property
    in React''s state object and then re-renders the component. Unlike classes, where
    the render method can be called and use the same properties of the class each
    time, a function starts its life every time it''s invoked.


    When React re-renders a function, the function calls useState again, and useState
    returns a new variable with the latest state value. So, the setter doesn''t actually
    modify the variable in all—the function creates a new const each time it''s invoked.


    Because the whole point of a stateful variable is to trigger a re-render, the
    only way a stateful variable should be updated is with the setter function returned
    by useState.


    # The Setter Function Replaces the State


    The function returned by useState hook replaces the current value of the stateful
    variable with the value you pass into it. This makes working with stateful variables
    in functions simpler, but it also introduces some complexity, especially when
    working with more complex state.


    State in function components is immutable. That is, you cannot change it; you
    can only replace it with a new state. If the new state of a function depends on
    the previous state, this creates some interesting problems and coding patterns—especially
    when the stateful variable''s value is an object or array.


    To set a state variable that''s a primitive data, simply pass the new value to
    the function:


    ```

    setCounter(4);

    ```


    If the new value depends on the previous value, you should use a function to access
    the previous state and return the new value:


    ```

    setCounter((prevState)=>{return prevState+1});

    ```'
