    # # Why Not Just Render Multiple Component Trees?


    Another way to render React components into multiple DOM nodes is to use multiple
    calls to ReactDOM.render. If the two DOM nodes don''t sync and you use separate
    data, this works fine.


    The benefit of using React Portals is that Portal behaves like any other child
    in a React application. This means that Portals are both inside and outside of
    the React user interface. They mount and unmount outside of the root DOM node,
    but they behave the same as if they were normal React children—they accept props,
    can listen for and handle events, and so forth.


    # # COMMON USE CASES


    Portals are useful for any situation in you need to display and interact with
    DOM nodes outside of the root node of your application. Common uses for Portals
    include:


    +   - Rendering child elements elsewhere in the browser window.

    - Modal dialogs.

    - Tooltips.

    - Hovercards.'
  merge: -1
  pgno: 443
