    \ {\n  const [count, setCount] = useState(0);\n  return (\n    <div>\n      <button\
    \ onClick={()=>setCount(count+1)}>Add One</button>\n      {count}\n    </div>\n\
    \  );\n}\n\nexport default Count;\n```\n\nListing 3-13 shows an example of using\
    \ a function that is immediately invoked and that's valid in JSX.\n\n# LISTING\
