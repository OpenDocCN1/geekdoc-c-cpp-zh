  md: "Listing 7-3 shows how to set an event listener in a React component to listen\
    \ for a form’s\nsubmit event.\n\n# LISTING 7-3: Setting an event listener in a\
    \ React component\n\n```\nfunction MyForm(props) {\n  return (\n    <form onSubmit={props.handleSubmit}>\n\
    \      <input type=\"text\" id=\"fullName\" />\n      <input type=\"text\" id=\"\
    phoneNumber\" />\n      <button>Submit</button>\n    </form>\n  );\n}\n export\
    \ default MyForm;\n```\n\nAs you'll frequently see in React, it would seem that\
    \ the use of an event attribute would\nolate the separation of concerns rule that\
    \ dictates the use of event attributes in HTML\nbe avoided. However, keep in mind\
    \ that JSX is, essentially, JavaScript. So, in reality, it's\nthat you're using\
    \ HTML to trigger JavaScript, but you're using JavaScript to write HTML and to\n\
    \ an event listener to the form element created using JavaScript.\n\nThe two biggest\
    \ classes of what's really going on when you write events in JSX are:\n\n+   1.\
    \ As with the DOM addEventListener method, React event attributes take a function,\n\
    rather than a string containing a function call, as their value. The value of\
    \ a React\nattribute must be in braces and should not have the pair of parentheses\
    \ after the\nfunction name.\n\n+   2. React events use JavaScript-style camelCase,\
    \ rather than the HTML-style\nlowercase attribute used by HTML event attributes.\n\
    \nReact events are actually a wrapper around native HTML DOM events, which take\
    \ the same names\nas the native events (albeit with different capitalization).\
    \ These wrapped events are instances of\nReact class called SyntheticEvent.\n\n\
    # WHAT IS SYNTHETICEVENT?\n\nSyntheticEvent is a cross-browser wrapper around\
    \ the browser's native events. Historically, we\nbrows have all slightly different\
    \ ways of handling events. Most famously, in Microsoft's\nnow defunct Internet\
    \ Explorer browser, the event object was a global property of the browser's\n\
    window object, whereas in Chrome and Firefox, was a property passed to event handlers\
    \ (as is the\ncase with SyntheticEvent). Another important difference between\
    \ how browsers handle events is at\nwhat point in the propagation of events the\
    \ event listeners handle them. Today, every modern\nbrowser handles events during\
    \ the event “bubbling” phase, but in the earlier days of web browsers,\nInternet\
    \ Explorer handled events during the “capture” phase."
