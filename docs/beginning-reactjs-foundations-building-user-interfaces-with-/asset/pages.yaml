    - How and why to define default props.

    - New JavaScript syntax for working with props and state.

    - How to convert between function and class components.


    # ## ONE-WAY DATA FLOW


    One of the defining characteristics of React that distinguishes it from most other
    front-end UI libraries is its use of **one-way data flow**, also known as unidirectional
    data flow. Data flow means that all of the data in a React application flows from
    parent to child components. Another common way to describe the flow of data in
    React is “Data flows down (or downstream), and events flow up (or upstream"'
  merge: -1
  pgno: 167
- img_proc: true
  md: '# 124 | CHAPTER 6 REACT DATA FLOW


    One-way data flow eliminates a common cause of complexity and errors in user interfaces,
    it can also create confusion and frustration unless you fully understand the ins
    and outs of using it to your advantage. In this chapter, I''ll take a step-by-step
    and thorough approach, with plenty of example code, to covering everything you
    need to know about data flow within React, using both class components and function
    components.


    # Understanding One-Way Data Flow


    Figure 6-1 illustrates how unidirectional data flow works.


    ![](img/532a93636824efa5dbcdf73782c1fac9_168_0.png)


    FIGURE 6-1: Unidirectional data flow


    Unidirectional data flow does not mean that children can''t send data to parent
    components. Sending data from child components (for example, an input form) to
    parent components (for example, the form containing the input) is a critical part
    of interactivity. However, one-way data flow does mean the way you send data from
    a child component to a parent component or between siblings is different from
    how you pass data from a parent to a child.


    To understand one-way data flow, it''s helpful to look at an example of two-way
    data flow-way binding in Angular, you can use a combination of brackets, like
    this:


    ```

    <search-form [term]=\''searchTerm"></search-form>

    ```


    Assuming that the preceding code uses a search term to be rendered, the combination
    of square brackets and parentheses indicate that the searchVariable should be
    passed into the component represented by the search-form element (downstream data
    flow) and when the value of the search term changes the component represented
    by the search-form element, the value of the searchTerm variable should be updated
    (upstream data flow).


    In React, passing data downstream is done using props, like:


    ```

    <SearchForm term={searchTerm} />

    ```


    However, because of unidirectional data flow, updating the value of the searchTerm
    variable within the SearchForm component requires an event to be triggered. In
    function components, the event that allows you to pass data upstream is created
    when you use the useState hook.'
