  md: 'Once react-router-dom is installed, you can import components, functions, and
    hooks from the library into any of your components that will use routing. For
    most uses of React Router, you''ll need three parts:


    +   - A router component.

    - A linking component.

    - A route component.


    # The Router Component


    A router component is the top-level component that makes routing possible. It
    handles the changing of the window.location property and it provides React Router
    props to components below it.


    # Selecting a Router


    React Router contains five different router components:


    +   - BrowserRouter

    - HashRouter

    - MemoryRouter

    - StaticRouter

    - NativeRouter


    No matter which router you choose, it''s a convention to import the router component
    using the name Router, like this:

    ```javascript

    import {BrowserRouter as Router} from ''react-router-dom'';

    ```


    Importing the router as Router also simplifies things later if you want to change
    the router.


    > NOTE The five router components listed here are the "high-level" routers. React
    Router also has a component named Router, which is the "low-level" router. The
    low-level Router component is used for synchronizing routes with state management
    libraries (such as Redux). Unless you have a good reason to use the low-level
    Router, you can safely ignore it.


    # BrowserRouter


    BrowserRouter is the Router component that you''ll use most, if not all, of the
    time. It uses the HTML5 history API to change the browser''s window.location.href
    property. Using BrowserRouter allows your React UI to simulate the familiar way
    of navigating the web using URL paths.'
  merge: -1
  pgno: 336
- img_proc: true
  md: '# HashRouter


    HashRouter uses the part of the URL after the hash symbol (#) to synchronize the
    location and the displayed components. HashRouter relies on the fact that anything
    after a # in a URL won''t cause a browser to load a new page by default. For,
    the following two addresses both use the same HTML page:


    https://www.example.com/


    https://www.example.com/#/aboutUs


    The second URL passes a path after a #, which can be read using JavaScript and
    to change the displayed components.


    Prior to the widespread availability of the HTML5 history API in browsers, which
    allows JavaScript to change the address without loading new pages, hash routing
    was mostly JavaScript always worked. Today, HashRouter is mostly still around
    for backwards compatibility with older apps and browsers.


    # MemoryRouter


    MemoryRouter doesn''t update or read the browser''s window.location property at
    all. Instead, it keeps the routing in memory. MemoryRouter is useful for non-browser
    environments such as React Native, and for in-memory tests of your user interface.


    # StaticRouter


    StaticRouter creates a router that never changes. It''s useful for server-side
    rendering of React, where the web server passes a path to the server and React
    generates static code to serve to the user.


    # NativeRouter


    NativeRouter is used for creating navigation in iOS and Android apps built using
    React Native. Keep in mind that React apps can be rendered to many different types
    of user interface devices (as you saw in Chapter 4). Native handle routing differently
    from web browsers, and the NativeRouter component translates the lower-level React
    Router components to routing commands that work with your mobile operating system.


    # Using the Router Component


    Whichever router component you choose, it needs to wrap around the other Router
    components. One common way to make sure that the router is available to your entire
    app is by rendering it around your root component in the ReactDOM.render method.


    This is one of the few times that you have a need to modify index.js after you
    create it. If you recall from Chapter 2, the ReactDOM.render method is used once
    in a React UI and takes a component (called the root component) and a DOM node
    where that component should be rendered as arguments.'
  merge: -1
  pgno: 337
- img_proc: true
  md: "For example, the default Create React App ReactRouter.render method looks like\
    \ this:\n\n```\nReactDOM.render(\n  <React.StrictMode>\n    <App />\n  </React.StrictMode>\n\
    \  document.getElementById('root')\n);\n```\n\nThe React.StrictMode component\
    \ is optional in the preceding example and may or not be depending on how and\
    \ when you bootstrapped your app with Create React App. But, just as React.StrictMode\
    \ wraps around the root component, App, you can wrap a router component around\
    \ App to provide routing capabilities to your entire app.\n\nAfter you've imported\
    \ your router component, enclose the root component in a router like this:\n\n\
    ```\nimport React from 'react';\nimport ReactDOM from 'react-dom';\nimport (BrowserRouter\
    \ as Router) from 'react-router-dom';\n\nReactDOM.render(\n  <React.StrictMode>\n\
    \    <Router>\n      <App />\n    </Router>\n  </React.StrictMode>\n  document.getElementById('root')\n\
    );\n```\n\nWith the router in place, you can move on to creating links and routes.\n\
    \n# # Linking to Routes\n\nReact Router has three different linking components:\n\
    \n+   - Link\n- NavLink\n- Redirect\n\nThe first two linking components are essentially\
    \ wrappers around the HTML element with some additional features and capabilities\
    \ added. The Redirect component changes the current URL without out user interaction.\n\
    \n# # Internal Linking with Link\n\nBecause React Router overrides the default\
    \ behavior of links in a browser, you can't simply link between routes using the\
    \ element as you normally would in a website. The Link element is the basic linking\
    \ element in React Router. All it requires is a path to link, which can be provided\
    \ using the to attribute, and a single child node, as in the following example:\n\
    \n```\n<Link to=\"/user/login\">Log in</Link>\n```"
  merge: -1
