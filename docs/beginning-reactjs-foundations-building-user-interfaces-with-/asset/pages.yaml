    # # React Data Flow


    Data, and moving data between the different parts of an application, is a critical
    piece of any interactive user interface. In this chapter, you''ll learn:


    +   - What one-way data flow means.

    - The benefits of one-way data flow.

    - How to initialize state in a React user interface.

    - How to decide where the state should "live."

