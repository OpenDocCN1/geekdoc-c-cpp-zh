  md: 'Using the spread operator makes this operation even easier. You simply use
    square brackets to create a new array, and then populate it with each element
    in the old array by prefacing the name of the old array with the spread operator:


    ```

    numbersCopy = [...numbers];

    ```


    # Changing an Array with Spread


    JavaScript has several different methods for modifying, adding, and removing elements
    from arrays. For example, if you want to add an element to an array, you can use
    the Array.push method:


    ```

    numbersCopy.push(4);

    setNumbers(numbersCopy);

    ```


    Other array methods include:


    +   - Array.pop(): Removes an element from the end of an array.

    - Array.shift(): Adds an element to the beginning of an array.

    - Array.unshift(): Removes an element from the beginning of an array.


    Each of these array methods actually modifies, or *mutates*, however. To work
    with immutable data, such as React state, the spread operator can be used to accomplish
    each of these tasks. For example, if you want to copy an array and add an element
    to the end of it, you can do that like:


    ```

    numbersCopy = [...numbers, 14];

    ```


    If you want to change the value of a certain element in an array, you need to
    know the index of that element, then you can use what I refer to as the "sandwich"two
    slices and spread:


    ```

    const newArray = [...oldArray.slice(0, indexToChange),

    updatedValue,

    ...oldArray.slice(slideToChange+1)];

    ```


    Although it may look strange and confusing at first, this method of modifying
    an element in an array is actually quite simple, and it''s widely used in React
    programming. If you know the index of the element in the array you want to modify,
    you make a shallow copy of the original array from the first element in the array
    (0) up to the element you want to change. Then, you insert the new value into
    the new array. Finally, you insert the rest of the elements in the new array by
    passing just the number of the next element in the original array into slice.


    # Copying Object with Spread


    The spread operator can also be used to create a shallow copy of an object. A
    shallow copy of an object is a copy that only includes the properties, and not
    the prototype:


    ```

    let obj1 = { foo: ''bar'', x: 0 };

    let clonedObj = { ...obj1 };

    ```'
