  md: '# How to Fix Errors


    When ESLint reports errors, you have at least two ways to resolve the problem.
    The first way is by modifying your source code to eliminate the error or fix the
    bug. The second way, which is quite common when you''re first configuring ESLint,
    is to change ESLint''s configuration so that it doesn''t count the source of the
    error as an error.


    For example, if your ESLint configuration uses double quotes as an error, this
    may cause problems and errors that you don''t care about when ESLint checks configuration
    files, such as webpack.config.js.


    Some of the ways you can tell ESLint not to report an error are:


    +   Add files that you don''t want to check a file .eslintignore in the root of
    your project.


    +   Change the rule in question to a lower-level error or disable it.


    +   Disable a single rule for file by adding a block comment with an eslint-disable
    instruction to the file. For example, disable the no-console rule for a file,
    add the following- to the top of the file:

    n/* eslint-disable no-console */


    Depending on the error, you may have a few ways to fix it: let ESLint do it. After
    it finishes running, npm may report that some of the errors are potentially fixable
    by ESLint, as shown in Figure 15.


    ![](img/532a93636824efa5dbcdf73782c1fac9_404_0.png)


    FIGURE 15: Automatically fix errors or warnings


    When this happens, you can have ESLint try to fix the errors by adding --fix to
    your ESLint command and running it again. If ESLint is able to fix the problems,
    it will just do so when it finds them.'
