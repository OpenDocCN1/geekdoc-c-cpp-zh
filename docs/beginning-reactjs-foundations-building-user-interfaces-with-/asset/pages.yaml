  md: "# CHAPTER 12 ROUTING\n\nLISTING 12-7: Using the component attribute\n\n```\n\
    import React from \"react\";\nimport {\n  BrowserRouter as Router,\n  Route,\n\
    \  Link\n} from \"react-router-dom\";\n\nfunction ComponentProp(props){\n  const\
    \ OrderDetails = (props)=>{\n    return (\n      <h1>Details for order #{props.match.params.orderid}</h1>\n\
    \    );\n  }\n  return (\n    <Router>\n      <Link to=\"/orders/4\">Order #4</Link>\n\
    \      <Route path=\"/orders/:orderid\" component={OrderDetails} />\n    </Router>\n\
    \  );\n}\n\nexport default ComponentProp;\n```\n\nReact Router will use the component\
    \ passed to the component attribute to create and render a new element. Using\
    \ the component attribute results in the component being unmounted and rendered\
    \ with every render.\n\n# Render Props\n\nAnother option for rendering components\
    \ when route matches is to specify a function inside the render attribute. When\
    \ the route matches, this function will be called. Using the render attribute\
    \ doesn't require Router to create an element, it avoids the unmounting and mounting\
    \ on each render using the component attribute does.\n\nListing 12-8 shows an\
    \ example of using the render attribute.\n\nLISTING 12-8: Using the render attribute\n\
    \n```\nimport React from \"react\";\nimport {\n  BrowserRouter as Router,\n  Route,\n\
    \  Link\n} from \"react-router-dom\";\n```"
