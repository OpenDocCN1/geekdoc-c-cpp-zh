  md: '# Other Fun Hooks


    Going beyond the basic tasks that are used in modern user interfaces, other custom
    hooks encapsulate functionality that''s more specialized or even for fun. Here
    are a few custom hooks that fall into this category:


    +   - The useGeolocation hook (https://github.com/streamich/react-use) tracks
    a user’s geographic location.

    - The useNetworkStatus hook (https://github.com/rehooks/network-status) returns
    information about a user''s current network status.

    - The useKonomiCode hook (https://stackblitz.com/edit/use-konomi-code) is an easy
    egg hook for detecting when a user has entered the famous Konomi Code (↑ ↑ ↓ ←
    ← → A), which is used as a code in many video games.


    # Lists of Hooks


    Finding custom hooks for just any purpose is becoming easier thanks to some lists
    of hooks being maintained and updated by the React community. Here are a few of
    the lists of hooks that are currently available:


    +   - Hooks.guide (https://hooks-guide.netlify.app/). A curated and categorized
    list of hooks.

    - Collection of React Hooks (https://nikgraf.github.io/react-hooks/). A searchable
    collection of hooks that anyone can add to.

    - Use Hooks (https://use-hooks.org/). Provides a tool for scaffolding React hooks
    and a list of hooks created using the scaffolding.


    # SUMMARY


    Hooks aren''t just a new and better way of doing something in React; they dramatically
    improve the entire React development experience, they make learning React easier,
    and they solve the problem of creating a standard and simple way to share code
    between components.


    In this chapter, you learned:


    +   - What React Hooks are.

    - Why React Hooks were created.

    - How to use each of the built-in hooks.

    - How to use and create custom hooks.

    - How to find pre-built custom hooks.


    In the next chapter you''ll learn how to manage complex user interfaces and applications
    by associating URLs with components and layouts using React Router.'
