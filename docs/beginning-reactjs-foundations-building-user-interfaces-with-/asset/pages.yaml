  md: "Only class components have a this keyword, binding only applies in class components.\
    \ Plus, as you'll see, binding only applies in class components to methods using\
    \ function or method definition syntax.\n\n# Using bind\n\nIf you're still not\
    \ clear on how this bind work in JavaScript classes, go back and review the JavaScript\
    \ lesson from Chapter 4. Or, just remember this rule:\n\nIn class components,\
    \ if a function defined using method definition syntax or the function keyword\
    \ will be passed as a prop, bind it.\n\nFunctions can be bound in one of two ways.\
    \ The first is the method you've seen most often so far: the constructor. In this\
    \ method, you overwrite the value of the unbound function with a new function\
    \ that includes the context of the class, as shown in Listing 7-9.\n\nLISTING\
    \ 7-9: Binding a function in the constructor\n\n```\nimport {Component} from 'react';\n\
    \nclass ColorWheel extends Component {\n\n  constructor(props) {\n    super(props);\n\
    \    this.state = {\n      currentColor: '#ff0000'\n    }\n    this.changeColor\
    \ = this.changeColor.bind(this);\n  }\n\n  changeColor(e) {\n    this.setState({currentColor:e.target.value});\n\
    \  }\n\n  render() {\n    const style = {\n      width: \"200px\",\n      height:\
    \ \"200px\",\n      borderRadius: \"50%\",\n      backgroundColor:this.state.currentColor\n\
    \    }\n    return(\n      <div style={style}></div>\n      <input onChange={this.changeColor}\
    \ value={this.state.currentColor} />\n    )\n  }\n}\n\nexport default ColorWheel;\n\
    ```"
