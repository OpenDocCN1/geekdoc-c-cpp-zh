    # Function Binding with call


    The JavaScript call function binds a function with an object and invokes the function.
    It accepts the name of the object you want to bind to the function, followed by
    a list of individual arguments to pass into the function. To invoke the write
    function within the context of the author object and pass in the number 500, you
    can use this statement:


    ```

    write.call(author, 500);

    ```


    # Function Binding with apply


    The apply function also binds a function with an object and invokes the function.
    It accepts the name of the object you want to bind to the function, followed by
    an array that will be passed into the function. To invoke the write function within
    the context of the author object and pass in an array you can use this statement:


    ```

    write.apply(author, [500]);

    ```


    # Function Binding with bind


    The bind function works the same as call, but instead of invoking a function,
    it returns a new function that''s bound to the specified object. To create a new
    function that will invoke the write function within the context of the author
    object and pass in 500 each time it is invoked, you can use this statement:


    ```

    let write500Words = write.bind(author, 500);

    write500Words();

    ```


    The second argument to bind is optional. In React, it''s most common to see bind
    used with only the first argument.


    Function binding is important in React components, because it allows you to define
    a function in one component and pass it as a variable into other components, while
    still operating on the component where the function was initially defined.


