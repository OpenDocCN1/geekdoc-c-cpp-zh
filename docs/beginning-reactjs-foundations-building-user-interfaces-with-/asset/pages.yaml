  md: "# WAYS TO FETCH\n\nOnce you know how and where to run asynchronous code in\
    \ React components, the rest is just a matter of knowing the properties and methods\
    \ of the tool you want to use and knowing the structure of the data source.\n\n\
    Most single page applications access data sources using web APIs based on the\
    \ REST architecture. Data sent and received between a user interface and a RESTful\
    \ API is usually in the JSON format.\n\n# JAVASCRIPT LESSON: REST\n\nRepresentational\
    \ State Transfer, REST, is an architectural style for application programming\
    \ interfaces (APIs). RESTful APIs use HTTP requests to get, add, update, and delete\
    \ data using URLs. RESTful APIs rely on the fact that HTTP is built into different\
    \ methods for accessing resources. REST maps these methods to operations that\
    \ can be performed using the API:\n\n+   * To fetch data, use the HTTP GET method.\n\
    * To add data, use the HTTP POST method.\n* To update data, use the HTTP PUT method.\n\
    * To delete data, use the HTTP DELETE method.\n\nFor example, to get data about\
    \ a user with an ID of 23 using a RESTful API, you might make an HTTP GET request\
    \ to the following URL:\n`https://www.example.com/user/23/`\n\nTo delete the user\
    \ with the ID of 23, you would use the HTTP DELETE method to access that same\
    \ URL.\nTo try a RESTful API, open a browser window and enter the following URL\
    \ into the address bar:\n`https://api.github.com/users/facebook/repos`\n\nThis\
    \ will do an HTTP GET to retrieve a list of Facebook's repositories on GitHub\
    \ and display the returned JSON in the browser window.\nTo fetch and return the\
    \ data from that same URL in a JavaScript program, you can use the Fetch API along\
    \ with Promises:\n\n```\nfetch('https://api.github.com/users/facebook/repos',\
    \ {\n  method: 'GET',\n  headers: {\n    'Content-Type': 'application/json'\n\
    \  }\n})\n.then(response => response.json())\n.then(data => {\n  console.log('Success:',\
    \ data);\n})\n```"
