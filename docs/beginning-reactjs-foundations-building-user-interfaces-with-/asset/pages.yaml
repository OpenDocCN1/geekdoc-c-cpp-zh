  md: "# The history Object\n\nThe history object refers to the history package, which\
    \ is separate from React Router, but which React Router depends upon. The history\
    \ object's job is to keep a record of the locations navigated in the current session\
    \ and to changing the location position. The concept of session history is device-independent,\
    \ but is implemented in several different ways for different environments (which\
    \ correspond to the router components in React Router):\n\n+   - Browser history.\n\
    - Hash history.\n- Memory history.\n\nYou can gain access to the history object\
    \ in your React code by using the useRouter hook or using the useRouter higher-order\
    \ function.\n\nListing 12-13 shows how to use withRouter to gain access to the\
    \ history.push method and use it to create a link.\n\nLISTING 12-13: Using useRouter\n\
    \n```\nimport React from \"react\";\nimport {\n  withRouter\n} from \"react-router-dom\"\
    ;\n\nfunction NavMenu(props) {\n  function handleClick() {\n    props.history.push(\"\
    /home\");\n  }\n\n  return (\n    <button type=\"button\" onClick={handleClick}>\n\
    \      Go home\n    </button>\n  );\n}\n\nexport default withRouter(NavMenu);\n\
    ```\n\nThe useRouter is the newer, and slightly simpler, way of gaining access\
    \ to the history object, as shown in Listing 12-14.\n\nLISTING 12-14: Using useRouter\n\
    \n```\nimport React from \"react\";\nimport {\n  useHistory\n} from \"react-router-dom\"\
    ;\n```"
  merge: -1
  pgno: 352
- img_proc: true
  md: "```\nfunction NavMenu(props) {\n  const history = useRouter();\n\n  function\
    \ handleClick() {\n    history.push(\"/home\");\n  }\n\n  return (\n    <button\
    \ type=\"button\" onClick={handleClick}>\n      Go home\n    </button>\n  );\n\
    }\n\nexport default NavMenu;\n```\n\n# JAVASCRIPT LESSON: HIGHER-ORDER FUNCTIONS\n\
    \nHigher-order functions and higher-order components are tools for abstracting\
    \ and reusing code. They can be confusing at first, however, I will explain them\
    \ with simple examples.\n\nHigher-Order Functions\n\nA higher-order function is\
    \ a function that operates on another function. Higher-order functions are not\
    \ specific to React or JavaScript. Rather, they're a common technique in mathematics\
    \ and computer science. Higher-order functions take a function as a parameter\
    \ and return a function.\n\nFor example, consider this function, which just adds\
    \ one to a number and returns the result:\n\n```\nconst addOne = (a)=>a+1;\n```\n\
    \nThis function is called a first-order function.\n\nThe following higher-order\
    \ function takes a function as a parameter and returns the result of that with\
    \ some text appended to it:\n\n```\nconst addText = f => x => f(x) + ' is the\
    \ result.';\n```\n\nA new function can be defined using the addText function with\
    \ addOne as a parameter:\n\n```\nconst addText = addText(addOne);\n```\n\nThe\
    \ addText function can then be called, like this:\n\n```\naddText(8);\n```\n\n\
    The result will be that the string \"9 is the result\" will be returned. You can\
