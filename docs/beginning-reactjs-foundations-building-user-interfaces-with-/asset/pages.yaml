  md: "Webpack can bundle together files that use any of several different module\
    \ formats, including JavaScript's import statement, CommonJS, AMD Modules, @import\
    \ statements in CSS, and HTML <img> elements.\n\n# # Loaders\n\nLoaders tell Webpack\
    \ how to process and bundle file types that doesn't natively support. Many loaders\
    \ have been written, including CSS loaders, HTML loaders, file loaders, and more.\n\
    \nLoaders can be configured in webpack.config.js by specifying a test property\
    \ and a use property. The test property is a regular expression that tells which\
    \ files should be affected by a loader, and the use property tells which loader\
    \ to use for the files matching the test. You can also use an optional property\
    \ named exclude, which tells what files shouldn't be affected by the loader.\n\
    \nFor example, in our project, we configured a loader with the following settings:\n\
    \n```\nrules: {\n  test: /\\.js$/,n  exclude: /node_modules/,\n  use: [\"babel-loader\"\
    ]\n}\n```\n\nThis rule says to use the babel-loader to transform any file that\
    \ ends with .js, but to ignore files inside node_modules.\n\n# # Plugins\n\nPlugins\
    \ extend the capabilities of Webpack. Examples of plugins include:\n\n+   - HtmlWebpackPlugin:\
    \ Creates HTML files to serve the bundle.\n- NpmInstallWebpackPlugin: Automatically\
    \ installs missing dependencies during bundling.\n- ImageminWebpackPlugin: Minifies\
    \ images in your project during bundling.\n\nPlugins can be configured in the\
    \ plugins array in webpack.config.js.\n\n# # AUTOMATING YOUR BUILD PROCESS\n\n\
    Now that you've gone from writing React code, to compiling it, to deploying it—in\
    \ a very basic way—let's automate the process and make our development and build\
    \ toolchain a bit more functional."
