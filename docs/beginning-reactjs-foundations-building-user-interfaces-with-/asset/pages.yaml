    \      .assert.containsText('.main-results', 'Nightwatch.js')\n      .end();\n\
    \  }\n}\n```\n\n# SERVER-SIDE RENDERING\n\nMost of the time, React runs in a browser\
    \ and manages rendering and updating of components by manipulating the DOM. Because\
    \ React components are just JavaScript functions, they can also run inside any\
    \ other JavaScript engine. Server-side React components to generate static files\
    \ that can be sent to a web browser when a React interface is first requested.\
    \ The result is that the initial rendering of the page is faster, because it doesn't\
    \ have to happen in the user's browser.\n\nServer-side rendering works by having\
    \ an instance of the ReactDOMServer library available (typically in a Node.js\
    \ server) and using one of its methods to generate static HTML. ReactDOMServer\
    \ has four methods you can choose from, depending on your needs:\n\n+   * `renderToString`:\
    \ Renders the app to a static HTML string. Inside the browser, this HTML string\
    \ can be turned into a functioning React interface using the ReactDOM.hydrate\
    \ method.\n\n+   * `renderToStaticMarkup`: Renders the app to static HTML, without\
    \ the attributes that React normally adds to HTML. The result is a smaller file,\
    \ but one that can be interactive using ReactDOM. You can use `renderToStaticMarkup`\
    \ to create a static file server.\n\n+   * `renderToNodeStream`: Returns the same\
    \ HTML as `renderToString` but encoded as a Node Stream rather than a string.\n\
    \n+   * `renderToNodeStream`: Returns the same HTML as `renderToStaticMarkup`,\
    \ but formatted as a Node Stream."
