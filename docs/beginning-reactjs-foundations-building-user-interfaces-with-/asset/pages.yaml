  md: "# LISTING 13-1: An ErrorBoundary component\n\n```\nimport {Component} from\
    \ 'react';\n\nclass ErrorBoundary extends Component {\n  constructor(props) {\n\
    \    super(props);\n    this.state = {hasError: false};\n  }\n\n  static getDerivedStateFromError(error)\
    \ {\n    return { hasError: true };\n  }\n\n  render() {\n    if (this.state.hasError)\
    \ {\n      return <h1>Oops! There's been an error.</h1>\n    }\n\n    return this.props.children;\n\
    \  }\n}\n\nexport default ErrorBoundary;\n```\n\nTo understand what's happening\
    \ in this ErrorBoundary component, you need to know a couple of things about the\
    \ getDerivedStateFromErrors lifecycle method.\n\n# getDerivedStateFromErrors Is\
    \ a Static Method\n\nThe getDerivedStateFromErrors lifecycle method is a static\
    \ method. Static methods are commonly used to define functionality that belongs\
    \ to the class as a whole, such as utilities. In React, the getDerivedStateFromErrors\
    \ and getDerivedStateFromProps lifecycle methods are defined as static to make\
    \ it more difficult to have side effects.\n\nIn other words, because these methods\
    \ are static, they belong to the component but they don't have access to the properties\
    \ of an instance of a component (like this.props, this.state, and so forth). By\
    \ limiting what the method has access, React is limiting your ability to write\
    \ anything but pure functions, which makes sure that this lifecycle method cannot\
    \ cause unpredictable results in the render method.\n\n> JAVASCRIPT LESSON: STATIC\
    \ METHODS\n\nStatic methods are methods that are defined on a class and can't\
    \ be called on instances of the class. For example, the following class, Cashier,\
    \ has a static method makeChange. The makeChange method doesn't need to access\
    \ the unique data in an instance of Cashier. It just takes a total and an amountTendered\
    \ returns the change:"
