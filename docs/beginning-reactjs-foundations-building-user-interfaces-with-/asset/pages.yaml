- img_proc: true
  md: "+   - PropTypes.bool\n\n+   - PropTypes.func\n\n+   - PropTypes.number\n\n\
    +   - PropTypes.object\n\n+   - PropTypes.string\n\n+   - PropTypes.symbol\n\n\
    The purpose of each of these should be self-evident, but note that a couple of\
    \ the validators, bool and func, have names that are different from the names\
    \ of the JavaScript data types.\n\nWhen you use one of these data types by itself,\
    \ PropTypes will treat the prop as optional. In other words, a missing prop will\
    \ not trigger a PropType warning message by default.\n\n# Validating Required\
    \ Props\n\nIf a component requires a prop to be passed, you can indicate to PropTypes\
    \ that a prop is required by appending the isRequired validator to the data type\
    \ validator, as shown in Listing 6-7.\n\nLISTING 6-7: Appending the isRequired\
    \ validator\n\n```\nMyComponent.propTypes = {\n  firstName: PropTypes.string.isRequired,\n\
    \  middleName: PropTypes.string,\n  lastName: PropTypes.string.isRequired\n}\n\
    ```\n\n# Validating Nodes\n\nThe node validator checks whether the prop's value\
    \ is something that can be rendered. React calls anything that can be rendered\
    \ in a component node. The things that can be rendered in a component are numbers,\
    \ strings, elements, and arrays containing numbers, strings, or elements:\n\n\
    ```\nuserMessage: PropTypes.node\n```\n\nThe node validator is useful in cases\
    \ where you might not care whether the value of the prop is a string or number,\
    \ but you do care that it can be rendered.\n\nIf one of your components tries\
    \ to render a prop that is not a node, it will cause your program to crash and\
    \ display an error in the browser or in the console if you're not using PropTypes.\
    \ You can view this default error message by trying to render a prop that isn't\
    \ a number, string, element, or an array of renderable data. For example, the\
    \ component in Listing 6-8 renders the values passed into the url and linkName\
    \ props."
