- img_proc: true
  md: "designed. It can often be useful to be able to apply styles to a tree of elements\
    \ and to make use of the CSS cascade to apply styles, but more often it creates\
    \ confusion and errors in components that have access to far more styles than\
    \ they actually use.\n\nOne way to use CSS is to use only the class selector.\
    \ This is an approach used by many CSS libraries, including Bootstrap. By only\
    \ applying styles using the class selector (which is created using the \" in CSS\
    \ stylesheets and matches the value of the className attribute you eliminate the\
    \ problem of styles that are applied to IDs overriding styles that are applied\
    \ to classes, and styles applied to elements overriding classes and IDs, and styles\
    \ marked as !important overriding everything.\n\nBut, no matter what you do, CSS\
    \ is not a programming language, and it doesn't have scope as programmers understand\
    \ or it of the conveniences of programming languages. This is why many developers\
    \ use CSS directly in their components or HTML file use a CSS preprocessor, such\
    \ as SASS.\n\n> A discussion of CSS preprocessors is beyond the scope of this\
    \ book, if you want to learn more, visit sass-lang.com.\n\nHowever, React has\
    \ built into it another way to style components that gives you all of the capabilities\
    \ of a CSS preprocessor, without having to learn the language used by the CSS\
    \ preprocessor: you can simply use JavaScript to apply style to components.\n\n\
    # WRITING INLINE STYLES\n\nReact's built in DOM elements have a style attribute\
    \ that accepts a style object as its value. When you pass DOM style properties\
    \ into this attribute, those properties will be applied to the resulting HTML\
    \ element.\n\nTo demonstrate a basic use of the style attribute, Listing 10-4\
    \ shows a React component that returns a styled paragraph of text.\n\nLISTING\
    \ 10-4: Using inline styles in React\n\n```\nfunction WarningMessage(props) {\n\
    \  return (\n    <p style={{color:\"red\",padding:\"6px\", backgroundColor:\"\
    #000000\"}}\n      {props.warningMessage}\n    </p>\n  );\n}\n\nexport default\
    \ WarningMessage;\n```"
