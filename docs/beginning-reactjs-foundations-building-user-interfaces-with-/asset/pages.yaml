  md: '# 13


    # # Error Boundaries


    Even if it were possible to write perfect code, the nature of interactive web
    applications guarantees that once in a while something is going to break. Error
    boundaries will help you ensure that when something goes wrong, it won''t result
    in the user seeing a crashed user interface.


    In this chapter, you''ll learn:


    +   * What error boundaries.


    +   * What kinds of errors can be caught with error boundaries.


    +   * How to log catch errors.


    +   * What errors can''t be caught with error boundaries.


    +   * How to use JavaScript/try/catch.


    # # THE BEST LAID PLANS


    Any kind of software development involves balancing money, time, and quality.
    Too often, money and time are the limiting factors, especially on the web. Add
    to this the number of dependencies involved in a typical JavaScript application
    and other factors that are completely out of your control (such as network availability),
    and it''s guaranteed that at some point or another React user interface is not
    going to function as you intended.


    By default, when React encounters an error inside one of the components in a UI,
    it will emit an error on the next render that will fill the screen with either
    a big red message (in development mode) or a “white screen of death” (in production)
    that is not very helpful to anyone, as shown in Figure 13-1.


    Crashed interfaces and critical error messages are especially not helpful to end
    users. Usually, the only way to recover an app from a crashed UI is to restart
    it by refreshing the browser window, without resetting the state of the application.
    In the worst-case scenario, an error message intended to be used by developers
    can reveal details of the internal workings of your application that could give
    someone with malicious intent the information they need to hack your application.'
