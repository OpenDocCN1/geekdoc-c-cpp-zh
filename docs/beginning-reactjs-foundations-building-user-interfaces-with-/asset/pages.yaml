  md: "Examples of when Context is helpful:\n\n+   - Theming an app (light mode or\
    \ dark mode, for example).\n\n+   - User preferences.\n\n+   - Language preference.\n\
    \n+   - User authorization and roles.\n\n# WHEN NOT TO USE CONTEXT\n\nWhen a component\
    \ uses React Context, it becomes dependent on the global state, which makes the\
    \ component less reusable.\n\nIf it's likely that a component will be reused,\
    \ it's best to avoid coupling it with the global state using Context. In many\
    \ cases, there are alternatives to prop drilling and Context that accomplish the\
    \ same thing but maintain the standard React way of passing data from parents\
    \ to children. One such alternative is the composition pattern.\n\n# COMPOSITION\
    \ AS AN ALTERATIVE TO CONTEXT\n\nA good alternative to Context and prop drilling\
    \ is composition. In React composition, you create a component that renders its\
    \ children and adds something to the process.\n\nTo understand how Context can\
    \ be a better alternative than prop drilling, consider the example app in Listing\
    \ 17-7. This app has a login button that, when clicked, passes the username variable\
    \ and the setUsername function into the Dashboard component. The username and\
    \ its setter function are passed through two levels of components that don't use\
    \ them but they're used by the WelcomeMessage and Logout components.\n\nLISTING\
    \ 17-7: Getting data to a deeply nested component with prop drilling\n\n```\n\
    import { useState } from 'react';\n\nconst App = () => {\n  const [username,setUsername]\
    \ = useState();\n  if (username) {\n    return <Dashboard setUsername={setUsername}\
