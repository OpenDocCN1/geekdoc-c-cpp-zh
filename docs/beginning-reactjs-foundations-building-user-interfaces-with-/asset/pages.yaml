  md: "# LISTING 4-33: Fixing a memory leak\n\n```\nimport {Component} from 'react';\n\
    \nclass Counter extends Component{\n  constructor() {\n    super();\n    this.state\
    \ = {count: 0};\n    this.incrementCount = this.incrementCount.bind(this);\n \
    \ }\n\n  incrementCount() {\n    this.setState({count: this.state.count + 1});\n\
    \    console.log(this.state.count);\n  }\n\n  componentDidMount() {\n    this.interval\
    \ = setInterval(() =>{\n      this.incrementCount();\n    }, 1000);\n  }\n\n \
    \ componentWillUnmount() {\n    clearInterval(this.interval);\n  }\n\n  render()\
    \ {\n    return (<p>The current count is: {this.state.count}</p>);\n  }\n}\nexport\
    \ default Counter;\n```\n\nNow Counter will be properly unmounted and the timer\
    \ will be cleared when it's removed from the browser. If you click the Toggle\
    \ button again, the counter will start over as you would expect it to, because\
    \ a new timer will be created.\n\n# React.PureComponent\n\nIf you have a component\
    \ that only accepts props and returns JSX, without modifying state or anything\
    \ outside of itself, this is known as a “pure component.” It gets its name from\
    \ the concept of a pure function.\n\nA key characteristic of a pure function is\
    \ that it always returns the same result when given the same input.\n\nPure components\
    \ are opportunities to improve the performance of your React user interface. Because\
    \ their output depends on props passed to them, a simple comparison of the previous\
    \ props and the new props will tell you the component will change when re-rendered.\n\
    \nOne way to do this comparison is by using the shouldComponentUpdate lifecycle\
    \ method with React’s shallowCompare function, as shown in Listing 4-34."
  merge: -1
