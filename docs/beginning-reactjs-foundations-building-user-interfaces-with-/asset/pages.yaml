  md: "# Mocha\n\nMocha, like Jest, is an automated testing framework. Mocha is more\
    \ configurable than Jest, and as a result, may require more initial configuration.\
    \ Mocha tests run sequentially, unlike Jest, which runs tests in parallel. Also\
    \ unlike Jest, Mocha doesn't include its own assertion library. Instead, it's\
    \ commonly used along with the Chai assertion library, which you will learn about\
    \ in the next section.\n\nTest suites in Mocha look very similar to those created\
    \ with Jest. You use a function `describe()` to create a test suite, and a function\
    \ `it` to define assertions (aka tests). Listing 20-1 shows a simple test suite\
    \ created with Mocha and the Assert library.\n\nLISTING 20-1: A test suite created\
    \ with Mocha\n\n```\nconst assert = require('assert');\ndescribe('Array', function()\
    \ {\n  describe('#indexOf()', function() {\n    it('should return -1 when the\
    \ value is not present', function() {\n      assert.equal([1, 2, 3].indexOf(4),\
    \ -1);\n    });\n  });\n});\n```\n\n# Enzyme\n\nEnzyme is a testing utility for\
    \ React that you saw in Chapter 15. Enzyme's interface for selecting and working\
    \ with nodes in the output of components is similar to how jQuery works with the\
    \ DOM. With Enzyme, you can use various CSS selectors to locate the nodes you\
    \ want to test. Enzyme makes it easier to traverse and inspect the elements from\
    \ your React components, which is an essential part of unit testing a React application.\n\
    \nTo use Enzyme, you first render a component using one of its three render methods:\n\
    \n+   * shallow: Renders a single component. The shallow method is most often\
    \ used for unit testing, in which it is important to be sure that you're not indirectly\
    \ testing the behavior of child components.\n\n+   * mount: Renders a component\
    \ and its children in the DOM. The mount method is typically used with a browser\
    \ simulator such as jsdom. Jsdom is a \"headless\" browser that runs completely\
    \ in JavaScript. Use mount for testing higher-order components and components\
    \ that interact with the DOM.\n\n+   * render: Renders static HTML from your component.\
    \ You can use the render method to test the structure of the HTML returned by\
    \ a component.\n\nAmong the functions included with Enzyme is the find method,\
    \ which is a simple way to locate and select elements in a component. The find\
    \ method takes the place of several functions that are included with ReactDOM's\
    \ testing utilities, findRenderedDOMComponentWithClass, and findRenderedComponentWithType."
