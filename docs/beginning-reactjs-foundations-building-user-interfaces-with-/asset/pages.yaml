  md: "Listing 4-9 shows how to write the component from Listing 4-8 using a class\
    \ that extends React.Component.\n\n# LISTING 4-9: Creating a component using a\
    \ class\n\n```\nimport React from 'react';\n\nclass UserProfile extends React.Component\
    \ {\n  constructor(props) {\n    super(props);\n  }\n\n  render() {\n    return\
    \ (\n      <h1>User Profile</h1>\n    );\n  }\n}\nnexport default UserProfile;\n\
    ```\n\n# JAVASCRIPT LESSON: CLASSES\n\nClasses in JavaScript resemble classes\
    \ in traditional object-oriented languages, such as Java or C, but with some fundamental\
    \ differences.\n\nTraditional classes are blueprints for creating objects. In\
    \ JavaScript, classes are objects themselves that serve as a template for objects.\
    \ In other words, JavaScript has prototypes, not true classes.\n\nYou may see\
    \ the term \"syntactic sugar\" used to describe classes and some other features\
    \ of JavaScript that were introduced in ES2015 and more recent versions of JavaScript.\
    \ Syntactic sugar refers to a simplified or abstracted way of writing something\
    \ that makes it easier to write or understand, but doesn't actually do anything\
    \ that you couldn't previously do. It helps the medicine go down, you might say.\n\
    \nMore specifically, the class syntax in JavaScript is just a new way to use function\
    \ constructors and prototypical inheritance. So, to understand classes, you first\
    \ need to understand the basics of function constructors and prototypical inheritance."
