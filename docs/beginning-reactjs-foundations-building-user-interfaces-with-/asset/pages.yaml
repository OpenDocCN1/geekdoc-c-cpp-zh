    \ bean known and tested based on how the state changes in the stateful component.\n\
    \n# USING UNCONTROLLED INPUTS\n\nUsing controlled inputs ensures that your user\
    \ interface strictly adheres to the pattern of one-way data binding, and it enables\
    \ you to easily work with the current values of your input fields. However, it\
    \ creates a lot of overhead that may be unnecessary.\n\nFor example, a \"Contact\
    \ Us\" form within a user interface doesn't need to store the data entered into\
    \ it or do anything with the data as it is being entered. Essentially, such a\
    \ form isn't really part of the larger application, and there may be no Reason\
    \ for React to track and run an event handler for every keystroke that someone\
    \ enters into a textarea input. Binding each input of a large form can be tedious\
    \ and the additional processing that it needs to listen for and respond to a large\
    \ number of form inputs can create performance issues.\n\nIn cases where you don't\
    \ need to track the user's input as they're typing and you don't need to store\
    \ the input in state, it may be a better choice to use uncontrolled inputs and\
