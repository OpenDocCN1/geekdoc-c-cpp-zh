  md: '# HOW ROUTING WORKS IN REACT


    In React, routing has two purposes:


    1. To change the `window.location` property of the browser (when used with a web
    browser).

    2. To detect the current location and use it to show or hide different components
    or combina- tions of components.


    The browser''s `window.location.href` property is what indicates the current URL
    of the web page. By setting `window.location.href` without making a server request,
    a JavaScript routing program can simulate the native way that browsers change
    the rendered view. What this means is that user or search engine can navigate
    to or link to a specific URL, such as `www.example.com/aboutUs`.


    Once the value of `window.location.href` changes, this property can be read by
    JavaScript and different URLs can be associated with different components. This
    association is called a *route*.


    Listing 12-1 shows a simple use of React Router to create two routes, as you might
    do in a con- figuration utility, a survey, or a text-adventure game.


    > LISTING 12-1: A simple routing component


    ```

    import React from "react";

    import (LessTraveledPath,MoreTraveledPath) from ''./PathOptions'';

    import

    BrowserRouter,

    Switch,

    Route,

    Link

    } from "react-router-dom";

    ```


    ![](img/532a93636824efa5dbcdf73782c1fac9_333_0.png)


    FIGURE 12-2: JavaScript routing'
