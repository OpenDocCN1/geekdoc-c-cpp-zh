  md: '# 1


    # # Hello, World!


    Since the beginning of time, the first program anyone learns to build in any new
    programming language is a program that displays the words "Hello, World." Of course,
    the words here aren’t important, and I would encourage you to choose any words
    you like to replace this cliché phrase. The point of this chapter is to quickly
    build up your understanding of how React works by using a simple and inconsequential
    program. But, don''t be deceived—the foundational tools and techniques that you
    learn about in this chapter are essential to learning React. If you only read
    one chapter of this book, this would be the one. In this chapter, you’ll learn:


    +   - How to use React without a toolchain.

    - How to write your first React application.

    - How to make and modify a React application built with Create App.


    # ## REACT WITHOUT A BUILD TOOLCHAIN


    Most React application development uses a build toolchain (like the one created
    by Create App) as its foundation. It is possible, however, to include React in
    an existing website or to build a website that uses React by importing a couple
    of scripts into a web page. You can use React code alongside JavaScript code written
    using another library or framework.


    Follow these steps to make an HTML page and add React to it:


    +   1. Create a new folder in your Documents folder

    2. Open the Command Palette (Command+Shift+P on macOS or Control+Shift+P on Windows)
    and run the File: New File command, or select File ⌘ New File from the top menu.

    3. Save your new file as index.html.'
