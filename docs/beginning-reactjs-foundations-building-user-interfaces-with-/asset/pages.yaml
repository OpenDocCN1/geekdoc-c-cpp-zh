  md: 'You can only have one default export per file. When you have a default export,
    you can import the module specified with the default export by using the import
    statement without the curly braces, like this:


    ```

    import calculateShippingCharge from

    ./modules/calculateShippingCharge.js'';

    ```


    React components are usually created using default exports, unless you''re creating
    a library of components.


    Note: you''ll often see the path to a module specified without the .js at the
    end. For example:


    ```

    import calculateShippingCharge from

    ./modules/calculateShippingCharge'';

    ```


    When you omit .js at the end of a filename, the import will work exactly as if
    you had specifically written it. Also notice that the path to the module file
    starts with ''./''. This is the UNIX way to start with the current directory and
    create a relative path from it. ES Modules require that the path to a module is
    a relative path, so it will always start with ./ (the current directory) or ../
    (indicating the parent directory). Oftentimes, you may need to have more than
    one ../, if the module you want to load is higher up in the file hierarchy.


    So, in the previous case, the modules folder is a subdirectory of the directory
    containing the file you are importing with ./


    If you''ve installed Node.js packages using npm, as as the React library itself,
    you don''t need to use ./ or to specify the path to the Node.js library when you
    import it. For example, components that use the React library''s functions have
    an import statement that imports React. This usually looks like this:


    ```

    import React from ''react'';

    ```


    Although you may also see individual objects from the React library imported separately,
    like this:


    ```

    import React, {Component} from ''react'';

    ```


    # Some Important ES2015 Module Rules


    There are just a few more important rules for how to use import and export:


    +   Both import and export statements need to be at the top level of your JavaScript
    file—that is, not inside of a function or any other statement.


    +   Imports must be done before any other statements in a module.


    +   import and export can only be used inside modules (not inside of ordinary
    JavaScript files).'
