  md: '# 13 ERROR BOUNDARIES


    ![](img/532a93636824efa5dbcdf73782c1fac9_362_0.png)


    FIGURE 13-1: A Crashed React app


    Error boundaries catch many kinds of errors in a user interface and display a
    user-friendly alternative user interface. They also allow the parts of the application
    that were unaffected by the error to continue to function.


    # WHAT IS AN ERROR BOUNDARY?


    An error boundary is a component that catches errors in its children components.
    Once an error is caught, the error boundary can provide a fallback UI and log
    the error, as well as provide the user with a way to recover the use of the UI
    without refreshing the browser window. Think of it like a firewall that keeps
    an explosion inside a child component tree from blowing up your whole app.


    For an example of why error boundaries are necessary, take a look at the diagram
    of a typical React interface shown in Figure 13-2.'
