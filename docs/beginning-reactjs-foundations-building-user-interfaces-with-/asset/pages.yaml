  md: "Listing 4-21 shows a functional component that uses useState to create and\
    \ update a counter.\n\n# LISTING 4-21: Using state in functional components\n\n\
    ```\nimport {useState} from 'react';\n\nfunction Counter() {\n  const [count,\
    \ setCount] = useState(0);\n\n  return (\n    <div>\n      <p>The current count\
    \ is: {count}.</p>\n      <button onClick={()=>setCount(count+1)}>\n        Add\
    \ 1\n      </button>\n    </div>\n  );\n}\n\nexport default Counter;\n```\n\n\
    I'll cover hooks in detail in Chapter 11.\n\n# Differences between Function and\
    \ Class Components\n\nTable 4-2 summarizes the main differences between function\
    \ components and class components.\n\n# TABLE 4-2: Functions vs. Classes\n\n|\
    \ FUNCTION COMPONENTS | CLASS COMPONENTS |\n|---|---|\n| Accepts props as arguments\
    \ and returns a React element | Extends React.Component |\n| No render method\
    \ | Requires a render method |\n| No internal state (can be simulated using hooks)\
    \ | Has internal state |\n| Can use hooks | Cannot use hooks |\n| Cannot use lifecycle\
    \ methods (can be simulated using hooks) | Can use lifecycle methods |\n\n# REACT\
    \ COMPONENT CHILDREN\n\nComponents that are rendered inside other components are\
    \ called *children*, and the component they are rendered inside is called its\
    \ *parent*. In the physical world, being a child doesn't prevent a component from\
    \ being a parent to some other child, and all except for the root component are\
    \ also children.\n\nA React UI of any complexity will have many components nested\
    \ within other components and the parent/child terminology is how their relationships\
    \ are described."
