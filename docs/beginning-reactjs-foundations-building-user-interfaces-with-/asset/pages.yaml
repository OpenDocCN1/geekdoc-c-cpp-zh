    import Login from './Login';\n\nfunction Welcome({loggedIn}){\n  return (\n  \
    \  <div>\n      {loggedIn ? <Header /> : <Login />}\n    </div>\n  );\n}\n\nexport\
    \ default Welcome;\n```\n\nIn this example, the expression to the left of the\
