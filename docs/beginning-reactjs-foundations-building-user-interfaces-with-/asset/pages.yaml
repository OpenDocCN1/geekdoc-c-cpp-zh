  md: '# 10


    # Styling React


    How to style React components, and React user interfaces in general, can be a
    polarizing topic. There are many ways to handle style in React, and you''re likely
    to see several of them used side-by-side on most React projects.


    In this chapter, you''ll learn:


    +   * How to include and use CSS files in React.

    * How to write inline styles in React.

    * How to use CSS Modules.

    * How to use CSS-in-JS.


    # THE IMPORTANCE OF STYLES


    Style in web applications determines how individual elements look, including typefaces,
    weight of text, colors, backgrounds, width, and height, for example. It also determines
    how elements relate to each other and to the HTML document or browser window—their
    borders, margins, alignment, and position. Certain CSS styles create animations.
    Still others affect how elements behave and how they look when they''re in different
    states, such as hovered over, clicked, focused, and so on.


    Even if you don''t add any style to all your user interface, it''s still affected
    by the browser''s default styles, which are rarely ideal. Styles also determine
    how your user interface will look on different sized devices, when printed, and
    how it will sound when read by a text-to-speech reader.


    With styles determining so much of what the end user''s experience with your application
    will be, it''s essential for a developer or a development team to give more than
    a little thought to how style will be managed and implemented in a user interface.'
  merge: -1
  pgno: 286
- img_proc: true
  md: "Because React is just JavaScript and everything in your React user interface\
    \ will start its life as JavaScript, you have more options for how to implement\
    \ style with React than if you were developing an application using plain HTML\
    \ and CSS files.\n\nUsing ordinary CSS with React is an option, however, it's\
    \ the one we'll talk about first.\n\n# IMPORTING CSS INTO THE HTML FILE\n\nThe\
    \ most basic way to style a React user interface is by importing one or more CSS\
    \ files into the HTML file that loads React. This can be done by simply opening\
    \ index.html, which lives in the public folder in a Create App project, and adding\
    \ an HTML link element between the <head> and </head> tags, as shown in Listing\
    \ 10-1.\n\nLISTING 10-1: Adding an HTML link to the HTML file\n\n```\n<!DOCTYPE\
    \ html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\" />\n  <link rel=\"\
    icon\" href=\"%PUBLIC_URL%/favicon.ico\" />\n  <meta name=\"viewport\" content=\"\
    width=device-width, initial-scale=1\" />\n  <meta name=\"theme-color\" content=\"\
    #000000\" />\n  <meta\n    name=\"description\"\n    content=\"Web site created\
    \ using create-react-app\">\n  <link rel=\"stylesheet\" href=\"%PUBLIC_URL%/css/style.css\"\
    \ />\n  <link rel=\"apple-touch-icon\" href=\"%PUBLIC_URL%/logo92.png\" />\n \
    \ <link rel=\"manifest\" href=\"%PUBLIC_URL%/manifest.json\" />\n</head>\n<body>\n\
    \  <noscript>You need to enable JavaScript to run this app.</noscript>\n  <div\
    \ id=\"root\"></div>\n</body>\n</html>\n```\n\nIn React App projects, the index.html\
    \ file is a template, which gets compiled when you run npm start or npm build.\
    \ The variables in the template are surrounded by the $ character. So, the CSS\
    \ link added in Listing 10-1, the %PUBLIC_URL% will be replaced with the actual\
    \ URL where the application is being served.\n\nTo use this method of styling\
    \ React, just put a CSS file in the right place inside the public directory or\
    \ point the link to an external URL (such as a hosted or a stylesheet library\
    \ like Bootstrap).\n\nThis method of styling React is useful for providing an\
    \ overall style to the user interface, or a theme. However, it should be used\
    \ carefully, since the styles included in the HTML file will affect every"
  merge: -1
  pgno: 287
- img_proc: true
  md: "component in your application, and it's easy to accidentally cause problems\
    \ lower in the component tree or create unnecessary complexity by adding styles\
    \ at this level.\n\n# USING PLAIN CSS IN COMPONENTS\n\nCreate React App has built\
    \ into the ability to load and bundle ordinary CSS files into your user interface.\
    \ If you're familiar with CSS and how to use CSS selectors to apply styles to\
    \ elements, classes, and IDs, you'll find using CSS in React comfortable and familiar.\
    \ Listing 10-2 shows how to include a CSS file into a React component and then\
    \ use the CSS classes.\n\n+   LISTING 10-2: Including CSS in a component\n\n```\n\
    import styles.css;\n\nfunction ArticleLink(props) {\n  return (\n    <div className=\"\
    article-link\">\n      <h1 className=\"title\">{props.title}</h1>\n      <p className=\"\
    firstPara\">{props.firstParagraph}</p>\n      <p><a className=\"articleLink\"\
    \ href={props.link}>read more</a></p>\n    </div>\n  );\n}\n\nexport default ArticleLink;\n\
    ```\n\nImporting a stylesheet into a React component has the benefit of being\
    \ a familiar way to work, and it also allows you to use existing stylesheets that\
    \ you may have.\n\nAs with styles into the HTML file, CSS imported into the components\
    \ cascades to the component's children. For example, Listing 10-3 shows a stylesheet,\
    \ a parent component, and a child component rendered by the parent component.\
    \ But the class and element styles defined in the stylesheet are only used in\
    \ the child.\n\n+   LISTING 10-3: Cascading styles in components\n\n```\n/* style.css\
    \ */\np{\n  font-size: 80px;\n}\n\n.red {\n  color: red;\n}\n```\n\ncontinues"
  merge: -1
  pgno: 288
- img_proc: true
  md: "# LISTING 10-3 (continued)\n\n```\n// StyledParent.js\nimport StyledChild from\
    \ './StyledChild';\n\nimport './style.css';\n\nfunction StyledParent(props) {\n\
    \    return (<StyledChild />)\n}\n\nexport default StyledParent;\n\n// StyledChild.js\n\
    function StyledChild(props) {\n    return (<p className=\"red\">This is testing\
    \ whether styles cascade.</p>)\n}\n\nexport default StyledChild;\n```\n\nThe result\
    \ of rendering StyledParent in your browser is shown in Figure 10-1.\n\n![](img/532a93636824efa5dbcdf73782c1fac9_289_0.png)\n\
    \nFIGURE 10-1: Cascading styles from parent to child\n\ntrickling down of styles\
    \ from parent elements to the complex series of steps that a browser goes through\
    \ to determine the priority of different styles is the way that CSS was"
  merge: -1
