  md: 'For a simple app that doesn''t use routing, the preceding process will work.
    If your app uses routing, you''ll need to do an additional configuration to redirect
    any requests for subdirectories of the site back to index.html so they can be
    properly handled by React Router.


    For an Apache server, create a file .htaccess containing the following code:


    ```

    Options -MultiViews

    RewriteEngine On

    RewriteCond %{REQUEST_FILENAME} !-f

    RewriteRule ^ index.html [QSA,L]

    ```


    Add this to your public directory, and then upload it from the build directory
    with the rest of your app.


    # Node Hosting


    If your server has Node.js installed, you can deploy your React app by installing
    the serve package and running it.


    Run the following command to install serve globally:


    ```

    npm install -g serve

    ```


    To start up serve and use it to a particular React app, run the following command
    in the root of your project:


    ```

    serve -s build

    ```


    The server will start up and your site will be available at your server''s domain
    name at port 5000. If you wish to modify the port, you can do so by using -listen
    (or -l for short) in the serve build command, like so:


    ```

    serve -s build -l 5050

    ```


    # Deploying Netlify


    Modern web apps are increasingly hosted on cloud and backend as a service (BaaS)
    platforms that offer one-step deployment and continuous integration and continuous
    deployment (CI/CD), CD means when you commit changes to a version control system,
    those changes can be pushed to your live production environment automatically.


    One popular target for deploying React applications is Netlify.


    To get started with hosting your React app on Netlify, first go to https://netlify.com
    and sign up for a free account. Because Netlify pushes directly from a Git server,
    you should first sign up with a Git repository such as GitHub, GitLab, Bitbucket
    and push your code to one of these services, if you haven''t already.


    The first step in setting up hosting at Netlify is to click the New site from
    Git on the Overview page, as shown in Figure 14-5.


    The next screen will ask you to choose your Git provider. Click the one that you
    use, as shown in Figure 14-6.'
