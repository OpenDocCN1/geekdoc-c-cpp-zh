  md: '# HIGHER-ORDER COMPONENTS


    In functional programming, a higher-order function is a function that takes another
    function as an argument and whose return value is a function. In React, a higher-order
    component is one that takes a component as input and returns another component.


    The reason for writing a component that accepts a component and returns a component
    is it is a convenient way to add functionality to components using the concept
    of composition.


    Often in React, we refer to the component that is passed to a higher-order component
    as the "wrapped" component. If you think of a higher-order component as like wrapping
    paper, you''ll understand the idea. When you wrap a box with gift wrapping paper,
    the result is a new thing that we can call a "present," which includes both the
    box and the wrapping of a box like this in JavaScript code:


    ```

    const Present = wrappingPaper(Box);

    ```


    Higher-order components are not a feature of React, but rather a pattern for using
    React.


    You''ll see more examples of higher-order components in future chapters, including
    Chapter 12, where we''ll talk about how to give a component the ability to have
    React applications respond to the browser URL with React Router.


    The filter feature in the settings dialog allows you to filter components based
    on the location, name, type, and whatever components are higher-order components.


    # Selecting Components


    In addition to finding components using the Search input box, you can also select
    components just by clicking on them in the tree view, or by using the Select tool,
    which is shown in Figure 5-10.


    No matter how you select a component, once you do, the inner workings of that
    component will show up in the pane on the right side of the Components window.
    If multiple components are selected, the details for the first selected component
    will be shown.


    # EDITING COMPONENT DATA IN DEVTOOLS


    The right side of the Components window in React DevTools displays information
    about the currently selected component, including its state and props data, hooks
    used by the component, the ancestors of the component, and the location of the
    component''s source code, as shown in Figure 5-11.'
