  md: "In most cases, a component with a function is much simpler and requires less\
    \ code and detailed knowledge of the inner workings of JavaScript than the class\
    \ method. However, both methods are widely used, and it's important to have a\
    \ good understanding of how to write components using classes as well as using\
    \ functions.\n\n> NOTE Having a knowledge of JavaScript classes and class components\
    \ is necessary in order to get a complete picture of how React works, but it is\
    \ possible to write complete React applications without using classes. An explanation\
    \ of classes can get pretty dense and theoretical, but don't let it bog you down.\
    \ If this chapter's \"Class Components\" confuses you, feel free to skip ahead\
    \ or skim for now and go straight to the \"Function Components\" section, which\
    \ is what we'll be working with for most of the rest of the book. You can come\
    \ back and learn all about class components and JavaScript classes when you need\
    \ to.\n\n# Class Components\n\nClasses were new to JavaScript when React was first\
    \ released. The early versions of the React library had a function called React.createClass,\
    \ which was the only way to create components. To use React.createClass, you could\
    \ pass an object containing the component's properties as a parameter to the function\
    \ and the result would be a React component.\n\nIn one of the bigger changes made\
    \ to React in its lifetime so far, React.createClass was deprecated as of React\
    \ 15.5.\n\nYou can still use createClass if you need to installing the create-react-class\
    \ package. List-ing 4-8 shows the code for a component created using createClass.\n\
    \nLISTING 4-8: Creating a component with React.createClass\n\n```\nimport React\
    \ from 'react';\nimport createClass from 'create-react-class';\n\nconstProfile\
    \ = createClass({\n  render() {\n    return (\n      <h1>User Profile</h1>\n \
    \   );\n  }\n});\n\nexport default UserProfile;\n```\n\nBeginning with React 15.5,\
    \ the preferred way of writing classes was by extending the React .Component base\
    \ class directly."
