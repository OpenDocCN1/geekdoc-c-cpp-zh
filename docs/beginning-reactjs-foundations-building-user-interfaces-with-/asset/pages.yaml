    \ it, and then pass the copy of the array into the setter function.\n\nThe copy\
    \ you make of an object or array can't be just any. It needs to be a shallow copy.\
    \ One of the easiest ways to make a shallow copy, which is widely used in React,\
    \ by using the spread operator (...).\n\n# JAVASCRIPT LESSON: SHALL COPIES AND\
    \ THE SPREAD OPERATOR\n\nOne of the most useful tools in JavaScript is the spread\
    \ operator. The spread operator is made up of three periods (...) and its job\
    \ is to expand (or spread) the value of a string, array, or object into separate\
    \ parts.\n\nTo see how the spread operator works, we'll start with a very simple\
    \ example. The following function accepts numbers and returns the sum of the numbers:\n\
    \n```\nfunction sum(x,y,z) {\n  return x+y+z;\n}\n```\n\nIf you have an array\
    \ of three numbers that you want to find out the sum of, you could invoke the\
    \ sum function and pass in each element of the array separately:\n\n```\nsum(myNumbers[0],myNumbers[1],myNumbers[2]);\n\
    ```\n\nOr you could spread the array into its component parts, which accomplishes\
    \ the same thing:\n\n```\nsum(...myNumbers)\n```\n\nThe spread operator is useful\
    \ in cases where you want to include all the elements of an array or object in\
    \ a new object or array, such as when you're creating a new array or object that's\
    \ partially made of an existing one.\n\nIn React, the spread operator is commonly\
    \ used to work with immutable state variables, especially in function components.\n\
    \nWhen you're working with mutable data in JavaScript and you have an array and\
    \ want to add an element to it, use the Array.push function, like this:\n\n```\n\
    let temperatures = [31,29,35];ntemperatures.push(32);\n```\n\nThe result of these\
    \ statements is that the temperatures array will look like this:\n\n```\n[31,29,35,32]\n\
    ```\n\nBecause state is immutable and can only be changed using the useState function\
    \ or the function returned by useState, if you want to change the value of an\
    \ array or object inside the state, you need to make a new array or object rather\
    \ than mutating the existing one."
