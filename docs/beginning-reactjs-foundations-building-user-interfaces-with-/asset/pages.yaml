  md: "# Preface Custom Attributes of DOM Elements with data-\n\nPrior to version\
    \ 16, if you needed to add an attribute to a DOM element that doesn't exist in\
    \ the HTML or SVG specification for the element, you had to preface it with data-,\
    \ or else React would ignore it. Listing 3-3 shows JSX HTML equivalent with a\
    \ custom attribute.\n\nLISTING 3-3: Custom attributes in HTML must start with\
    \ data-\n\n```\n<div data-size=\"XL\"\n  data-color=\"black\"\n  data-description=\"\
    awesome\">\n  My Favorite T-Shirt\n</div>\n```\n\nStarting with React 16, however,\
    \ you can use any custom attribute name with built-in DOM elements. Custom attributes\
    \ in DOM elements can be useful for including arbitrary data with your markup\
    \ that doesn' have any special meaning or affect the presentation of the HTML\
    \ in the browser. Although it is possible to use custom attributes for DOM elements,\
    \ this is not generally considered a good practice.\n\nUser-defined elements,\
    \ on the other hand, can have custom attributes with any name, as shown in Listing\
    \ 3-4.\n\nLISTING 3-4: User-defined elements can have any attributes\n\n```\n\
    import FancyWidget from './FancyWidget';\n\nfunction MyFancyComponent(props) {\n\
    \  return(\n    <FancyWidget\n      widgetSize=\"huge\"\n      numberOfColumns=\"\
    3\"\n      title=\"Welcome to My Widget\" />\n  )\n}\n\nexport default MyFancyComponent;\n\
    ```\n\nUsing custom attributes with user-defined elements is the primary way that\
    \ React passes data between components, as you'll see in Chapter 4.\n\n# JSX Boolean\
    \ Attributes\n\nIn HTML and in JSX, certain attributes don't require values, because\
    \ their presence is interpreted as setting their value to a Boolean true. For\
    \ example, in HTML, the disabled attribute of input elements causes an input to\
    \ not be changeable by the user:\n\n```\n<input type=\"text\" name=\"username\"\
    \ disabled>\n```"
