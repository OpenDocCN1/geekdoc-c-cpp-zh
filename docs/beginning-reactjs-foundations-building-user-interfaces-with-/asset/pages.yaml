    **FIGURE 11-2**: Passing a setter function as a prop


    The setter function returned by useState can be used in two different ways: by
    passing it a function or by passing it a single value.


    # Passing a Value to a Setter


    When you pass a value (or an expression that evaluates to a single value) into
    a useState setter function, the state variable attached to that useState will
    be set to the new value you pass it:


    ```

    const [guess, setGuess] = useState(''''); // guess === =

    setGuess(''?''); // guess === ''7''

    setGuess(''3''); // guess === ''3''

    ```


    Unlike when you use useState in a class component, useState''s setter functions
    do not merge objects. If you pass an object into a useState setter function, the
    variable connected to that useStateFunction will be set to exactly that object.


    # Passing a Function to a Setter


    The other way to use useState setter functions is to pass them a function. This
    is the method that should be used when the new state of the variable is based
    on the previous state of the variable. Passing a function ensures that the setter
