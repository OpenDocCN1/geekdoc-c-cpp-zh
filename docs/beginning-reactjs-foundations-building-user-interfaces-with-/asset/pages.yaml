  md: "# LISTING 4-36: Using React.memo\n\n```\nimport React from 'react';\n\nfunction\
    \ ExampleComponent(props){\n  return <p>Hi, {props.firstName}</p>. This component\
    \ returns the same thing when ngiven the same props.</p>\n}\n\nexport default\
    \ React.memo(ExampleComponent);\n```\n\n# React.StrictMode\n\nReact.StrictMode\
    \ is a component that you can wrap around your components to activate additional\
    \ checks of your code and provide warning messages that can be helpful during\
    \ development.\nThe default Create App applications wrap the root component with\
    \ a <StrictMode> element to turn on strict mode for the entire component tree.\
    \ But, you can also use <StrictMode> on parts of your application by applying\
    \ it more selectively.\n\n# RENDERING COMPONENTS\n\nThe end of the mounting and\
    \ updating stages of the lifecycle in React is a single rendered component, called\
    \ the root component. Remember that by “rendered” we mean all of the JSX for the\
    \ root component and its subcomponents has been parsed and the resulting tree\
    \ of components has been created.\nOnce React’s work has done and the tree of\
    \ components has been created, it’s the job of a separate node to render the component\
    \ in a way that it can be seen and used by people.\n\n# Rendering with ReactDOM\n\
    \nThe most common place for a tree of React elements to end up is in a web browser.\
    \ The library responsible for converting a React component into HTML and inserting\
    \ it into the DOM and then managing updates is ReactDOM.\nReactDOM includes several\
    \ methods that you can use to interact with the DOM, but the one that’s absolutely\
    \ necessary for every React application designed for the browser to use is ReactDOM.render.\n\
    If you look at the index.js file at the root of the src folder in a React project\
    \ created using Create React App, you will see where ReactDOM.render is invoked\
    \ and a single React element (which may be optionally wrapped with a React.StrictMode\
    \ component) is passed in, as shown in Listing 4-37."
