  md: "# CONTROLLED INPUTS VS. UNCONTROLLED INPUTS\n\nThe default behavior of an input\
    \ element is to allow the user to change its value directly. In one-way data flow,\
    \ on the other hand, every interaction with the user interface results in an event,\
    \ which handled, updates the state. Changes to state update the user interface.\n\
    React calls a form input that can be directly manipulated by the user an uncontrolled\
    \ input, and one that can only be changed through changes to the state object\
    \ a controlled input.\n\nFigure 8-1 illustrates the difference between controlled\
    \ and uncontrolled inputs.\n\n# Uncontrolled\n\n# Controlled\n\n```\n<input type=\"\
    text\" />\n```\n\n```\n<input type=\"text\" value=\"Strawberry\" />\n```\n\n```\n\
    Strawberry\n```\n\n```\nStrawberry\n```\n\nFIGURE 8-1: Controlled and uncontrolled\
    \ inputs\n\nTo create an uncontrolled input, omit the value attribute from the\
    \ JSX code for that input, as shown in Listing 8-1.\n\n> LISTING 8-1: Omitting\
    \ the value attribute creates an uncontrolled input\n\n```\nfunction SignUp(props)\
    \ {\n  return (\n    <form>\n      <input type=\"text\" name=\"emailAddress\"\
    \ />\n      <button>Sign up for our newsletter</button>\n    </form>\n  );\n}\n\
    \nexport default SignUp;\n```\n\nFigure 8-2 shows the result of rendering the\
    \ preceding component and typing into the input. This is exactly the behavior\
    \ you'd expect with an HTML form."
