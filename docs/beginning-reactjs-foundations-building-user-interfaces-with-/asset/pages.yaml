  md: '# Non-Standard Attributes


    In addition to the standard HTML attributes, React also supports several non-standard
    attributes that have specific purposes in some browsers and meta-data languages,
    including:


    +   - autoCapitalize and autoCorrect, which are supported by Mobile Safari.


    +   - property is used for Open Graph tags.


    +   - itemProp, itemScope, itemType, itemRef, and itemID for HTML5 microdata.


    +   - unselectable for Internet Explorer.


    +   - results and autoSave are supported by browsers built using the WebKit or
    Blink browser engines (including Chrome, Safari, Opera, and Edge).


    # Custom Attributes


    As of version 16, React will pass any custom attributes that you use with HTML
    components through the generated HTML, provided that the custom attributes are
    written using only lower case letters.


    # USER-DEFINED COMPONENTS


    Have you ever thought that it would be awesome if you weren''t limited to the
    standard set of HTML elements? What if you could, for example, make an element
    called `PrintPageButton` that you could use anywhere that you need to display
    a functional button in your app? Or what if you had an element called `Tax` that
    would calculate and display the taxes in your online store''s shopping cart?


    Essentially, this is what React components enable through custom components. Custom
    components, also known as the components you make by putting together built-in
    components and other custom components.


    The possibilities for custom components are infinite. Even better, if you design
    your components to be reusable, you can reuse components not only inside a single
    React application, but across any number of React applications. There are hundreds
    of source library of custom components created by other developers that you can
    repurpose inside your apps.


    Writing useful and reusable React components can sometimes require considerable
    work up front, but the benefits of writing them the right are that you can reduce
    work for yourself overall and make apps that are sturdier and more dependable.


    In the rest of this chapter, you''ll learn about writing custom components and
    putting them together to build robust user interfaces.


    # TYPES OF COMPONENTS


    React components can be written in two different ways: using JavaScript classes
    or by using JavaScript functions.'
