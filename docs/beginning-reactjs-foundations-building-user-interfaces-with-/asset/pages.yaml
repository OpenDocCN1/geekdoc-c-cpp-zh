    >Order #4</Link>\n    <Route path=\"/orders/:orderid\" render={props => (\n  \
    \    <h1>Details for order # {props.params.orderid}</h1>\n    )} />\n  </Route>\n\
    );\n}\n```\n\nUse of Route's render attribute is an example of an advanced technique\
    \ in React known as *render props*. A render prop is a function provided to a\
    \ component using props that the component calls instead of using its own render\
    \ method.\n\nRender props can be used to share functionality between components\
    \ and to dynamically determine what the component will render. Inside of a component\
    \ that accepts a render prop (such as Route in this case), the component will\
    \ call the provided function. Listing 12-9 shows a simplified version of what\
    \ happens inside the Route component when you use the render prop.\n\n# LISTING\
    \ 12-9: Rendering a render prop\n\n```\nfunction Route(props) {\n  return (\n\
    \    <>\n      {props.render({})}\n    </>\n  );\n}\n\nexport default Route;\n\
    ```\n\n# Switching Routes\n\nThe Switch component causes only the first matching\
    \ Route to be rendered. This is useful in cases where you don't want to render\
    \ multiple routes. To use Switch, wrap the routes that you want to choose the\
