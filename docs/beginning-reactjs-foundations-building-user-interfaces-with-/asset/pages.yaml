  md: "A view in unidirectional data flow can be expressed as a simple function:\n\
    \n```\nV = function(data)\n```\n\nIf you want to test whether a piece of data\
    \ in unidirectional data flow is being properly updated, or test that the change\
    \ to a variable in unidirectional data flow has the intended consequences, there's\
    \ only one thing to test: whether changing the state of the application modifies\
    \ the view as expected.\n\n# PROPS\n\nProps in React are the primary way that\
    \ data is shared between parent components and child components. To create a prop,\
    \ simply give a React element an attribute, using the name=value format. If the\
    \ component instance created by that element, the attribute will become a property\
    \ of the props object.\n\nHere are some key points about props:\n\n+   - A component\
    \ can receive any number of props.\n- A prop's value can be of any type of JavaScript\
    \ data or an expression that evaluates to a value or function.\n- Props are read-only.\n\
    \nLet's take a look at each of these points in more detail.\n\n# Components Receive\
    \ Props\n\nWhen you write a JSX element in React, the attributes that you give\
    \ an element are passed to the component as properties in an object. For example,\
    \ consider this JSX element:\n\n```\n<Taco meat=\"chicken\" produce={[cabbage,\
    \ radish, cilantroantro]} sauce=\"hot\" />\n```\n\nIf Taco is a function, this\
    \ element is the same as the following JavaScript function call:\n\n```\nTaco(meat=\"\
    chicken\", produce={[cabbage, radish, cilantro]}, sauce=\"hot\\});\n```\n\nInside\
    \ the Taco function, the object passed to the function gives the prop names, which\
    \ is how you can access it inside the function:\n\n```\nfunction Taco(props) {\n\
    \  return (<p>{props.sauce} {props.meat} taco will be ready shortly.</p>);\n}\n\
    export default Taco;\n```\n\nBecause props is a JavaScript object, you can have\
    \ as many or as few properties in the prop object as you need, and there's no\
    \ requirement that each prop be passed each time you use a component.\n\n# Props\
    \ Can Be Any Data Type\n\nThe props you pass to a component can be any type of\
    \ JavaScript data, including any of the six primitive data types (undefined, Boolean,\
    \ Number, String, BigInt, and Symbol) as well as objects, functions, arrays, and\
    \ even null."
