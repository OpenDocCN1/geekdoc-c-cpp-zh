  md: '# 2


    # # The Foundation of React


    React is a JavaScript library for creating interactive user interfaces using components.
    It was created by Facebook in 2011 for use on Facebook''s newsfeed and on Instagram.
    In 2013, the first version of React was released to the public as open source
    software. Today, many of the largest websites and mobile apps, including Facebook,
    Instagram, Netflix, Reddit, Dropbox, Airbnb, and thousands of others.


    User interfaces with React requires a bit of a shift in how you think about web
    applications. You need to understand what React is, how it works at a higher level,
    and the computer science ideas and patterns that it''s based on. In this chapter,
    you''ll learn:


    +   - Why it is called React.


    +   - What a Virtual DOM does.


    +   - The difference between composition and inheritance.


    +   - The difference between declarative and imperative programming.


    +   - The meaning of "idiomatic" with respect to React.


    # # WHAT''S IN A NAME?


    Let''s start with the name "React." Facebook designed React in response to its
    need to be able to efficiently update websites in response to events. Events that
    can trigger updates in websites using user input, new data coming into the application
    from other websites and data sources, and data coming into the application from
    sensors (such as location data from GPS chips).


    Traditionally, the way that web applications have dealt with data that changes
    over time is to refresh themselves so often, checking for new data in the process.
    Facebook wanted to create a way to more easily build applications that respond,
    or react to new data, rather than'
  merge: -1
  pgno: 55
- img_proc: true
  md: 'simply refreshing pages whether the underlying data has changed or not. You
    can think of the difference in approaches as pull (which is the traditional way
    of updating websites) vs. push (which is the reactive way to build websites).


    This method of updating a user interface in response to data changes is called
    reactive programming.


    # UI LAYER


    Web applications typically are built and described using the Model-View-Controller
    (MVC) pattern. The Model in MVC is the data layer, the Controller facilitates
    communication with the data layer, and the View is what the user sees and interacts
    with. In an MVC application, the View sends input to the Controller, which passes
    data between the layer and the View. React is only concerned with the V in MVC.
    It takes data as input and presents it to the user in some form.


    Figure 2-1 shows a diagram of an MVC pattern.


    ![](img/532a93636824efa5dbcdf73782c1fac9_56_0.png)


    FIGURE 2-1: The MVC pattern


    React itself doesn''t care whether the user is using a mobile phone, a tablet,
    a desktop web browser, a screen reader, a command-line interface, or any other
    kind of device or interface that may be invented in the future. React just renders
    components. How those components get presented to the user is to a separate library.


    The library that has methods of rendering React components in web browsers is
    called ReactDOM. If you want to render React elements to mobile apps, you use
    React Native. If you want to render React components to static HTML, you can use
    ReactDOMServer.


    ReactDOM has a number of functions for interfacing with React and web browsers,
    but the one that every React application makes is of called ReactDOM.render. Figure
    2-2 illustrates the relationship between React, ReactDOM, and a web browser.


    ![](img/532a93636824efa5dbcdf73782c1fac9_56_1.png)


    FIGURE 2-2: React and ReactDOM'
  merge: -1
  pgno: 56
