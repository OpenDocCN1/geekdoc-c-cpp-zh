  md: "# CHAPTER 6 REACT DATA FLOW\n\n![](img/532a93636824efa5dbcdf73782c1fac9_176_0.png)\n\
    \n**Figure 6-7:** PropTypes displaying a warning\n\nTo use PropTypes, you just\
    \ need to add a property propTypes props to the component. Note that the PropTypes\
    \ library, which contains different ways of validating props, starts with a capital\
    \ P. The property that you add to the component to cause it to do type checking\
    \ starts with a lowercase p.\n\nThe PropTypes property is a static property, meaning\
    \ it operates at the component level, not the instance level. In classes this\
    \ means that you can use the static keyword to put your PropTypes property in\
    \ your class, as shown in Listing 6-4.\n\n# LISTING 6-4: PropTypes inside a component's\
    \ body\n\n```\nimport PropTypes from 'prop-types';\nimport {Component} from 'react';\n\
    \nclass WelcomeMessage extends Component {\n\n  static propTypes = {\n    firstName:\
    \ PropTypes.string\n  }\n\n  render(){\n    return(<h1>Welcome, {this.props.firstName}!</h1>);\n\
    \  }\n}\n\nexport default WelcomeMessage;\n```"
