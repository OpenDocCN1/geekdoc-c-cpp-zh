  md: "# WHAT IS JSX?\n\nJSX is an XML-based syntax extension to JavaScript. In plain\
    \ English, it's a way to write JavaScript code using XML. Although it's not specific\
    \ to React, and it's not even required in order to write React components, JSX\
    \ is an integral part of every React developer writes components because it makes\
    \ writing components so much easier and has no negative impact in terms of performance\
    \ or functionality.\n\n# How JSX Works\n\nReact uses JSX elements to represent\
    \ custom components (which are also known as user-defined components). If you\
    \ create a component named SearchInput you can use that of component in other\
    \ components by using a JSX element SearchInput, as shown in Listing 3-2.\n\n\
    LISTING 3-2: Using a user-defined React component in JSX\n\n```\nimport useState\
    \ from 'react';\nimport SearchInput from './SearchInput';\nimport SearchResults\
    \ from './SearchResults';\n\nfunction SearchBox() {\n  const [searchTerm, setSearchTerm]\
    \ = useState('');\n\n  return (\n    <div id=\"search-box\">\n      <SearchInput\
    \ term={searchTerm} onChange={setSearchTerm}/>\n      <SearchResults term={searchTerm}/>\n\
    \    </div>\n  );\n}\n\nexport default SearchBox;\n```\n\nIn the same way, React\
    \ has components built into it for each of the elements in HTML5, and you can\
    \ use any HTML5 element name when you write your React components and the result\
    \ will be that React will output the rendering of the piece of HTML markup:\n\n\
    ```\n<label class=\"inputLabel\">Search:\n  <input type=\"text\" id=\"searchInput\"\
    />\n</label>\n```\n\nThe JSX code for letting your React component output HTML\
    \ would look like this:\n\n```\n<label className=\"inputLabel\">Search:\n  <input\
    \ type=\"text\" id=\"searchInput\"/>\n</label>\n```\n\nIf you study both of the\
    \ preceding snippets closely, you'll find a couple of differences. The difference\
    \ between them, and the fact that JSX is not HTML, are of vital importance to\
    \ understanding what JSX is really doing."
  merge: -1
