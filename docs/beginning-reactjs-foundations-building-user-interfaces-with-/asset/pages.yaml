  md: "# About the key Prop\n\nAny time you make a list of components, as we do in\
    \ the RemindersList component, each element in the list must have a prop named\
    \ key. The value of key must be unique to each item in the list. Since the index\
    \ position of an element in an array is a unique value, this makes a convenient\
    \ value for the key prop.\n\nThe key prop is used by React to facilitate updating\
    \ of items in the list. The value of key is not available as part of the props\
    \ object inside the component. You'll notice that RemindersList passes the same\
    \ value (the index position of the reminder in the array) to both the key and\
    \ a prop called id. This is necessary so we can make use of this value to update\
    \ the reminders, and you'll see when we start coding the functionality of the\
    \ app.\n\n> In this example, I use the index of the reminders array as the key.\
    \ In a real-world application, it would be a better practice to use a separate,\
    \ ID property for each reminder and use that as the key. The reason is that the\
    \ key is used by React to identify elements in the array. If your application\
    \ changes the order of elements in the array or removes elements from inside the\
    \ array (none of which currently does), React will assume that the same keys represent\
    \ the same DOM elements. The result can be that data will be displayed or your\
    \ app break. For a more detailed explanation of the problems with using the index\
    \ as the key, see Robin Pokorný's blog post at https://robinpokorny.medium.com/index-as-a-key-is-an-anti-pattern-0e349aece318.\n\
    \nNow let's look at the FilterSelect component. FilterSelect also receives two\
    \ props: selected-Filter and setSelectedFilter. I'll set selectedFilter to all\
    \ by default and validate the types for both, as shown in Listing 6-45.\n\n# LISTING\
    \ 6-45: Validating and setting defaults for FilterSelect\n\n```\nimport PropTypes\
    \ from 'prop-types';\nfunction FilterSelect(props) {\n  return(\n    <label htmlFor=\"\
    FilterReminders\">Show tasks due:\n      <select id=\"FilterReminders\" value={props.selectedFilter}>\n\
    \        <option value=\"2day\">within 2 days</option>\n        <option value=\"\
    1week\">within 1 Week</option>\n        <option value=\"30days\">within 30 days</option>\n\
    \        <option value=\"all\">any time</option>\n      </select>\n    </label>\n\
    \  );\n}\n```\n\ncontinues"
