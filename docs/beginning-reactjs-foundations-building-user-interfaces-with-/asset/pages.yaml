  md: "(continued)\n\nWith RequireJS, you can create modules using the define function,\
    \ and then modules can be included into other JavaScript code using the require()\
    \ function. All you have to do to use RequireJS is to include the RequireJS script\
    \ into your HTML file using a script tag, like:\n\n```\n<script data-main=\"scripts/main\"\
    \ src=\"scripts/require.js\"></script>\n```\n\nThe preceding script tag tags the\
