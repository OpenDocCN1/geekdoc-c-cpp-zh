  md: "In order to properly handle a case where an object value may be passed into\
    \ a prop that will be rendered, you can use error boundaries, which you'll learn\
    \ about in Chapter 13.\n\n# Validating React Elements\n\nIf you want to make sure\
    \ a prop is a React element, you can use PropTypes.element. You might use the\
    \ element validator to test whether the prop contains an element, as shown in\
    \ Listing 6-10.\n\n# LISTING 6-10: Validating React elements\n\n```\nimport PropTypes\
    \ from 'prop-types';\n\nfunction BorderBox(props) {\n  return(\n    <div style={{border:\"\
    1px solid black\"}>{props.children}</div>\n  );\n}\n\nBorderBox.propTypes = {\n\
    \  children: PropTypes.element.isRequired\n}\n\nexport default BorderBox;\n```\n\
    \nHere's an example of a use of the BorderBox element defined in Listing 6-10\
    \ that will cause the PropType.element validation to fail:\n\n```\n<BorderBox>\n\
    \  <p>The first paragraph</p>\n  <p>The second paragraph</p>\n</BorderBox>\n```\n\
    \nFigure 6-10 shows the warning message that will be displayed in the preceding\
    \ case.\n\n# Element Type Validation\n\nIf you want to test whether the prop value\
    \ is a React element type, you can use elementType, as shown in Listing 6-11.\n\
    \n# LISTING 6-11: Using the elementType validator\n\n```\nFamilyTree.propTypes\
    \ = {\n  pet: PropTypes.element\n}\n```\n\nThe difference between the element\
    \ validator and the elementType validator is that the element validator checks\
    \ for a rendered element (for example, <MyComponent />), while the elementType\
    \ validator checks for an unrendered element (for example, MyComponent)."
