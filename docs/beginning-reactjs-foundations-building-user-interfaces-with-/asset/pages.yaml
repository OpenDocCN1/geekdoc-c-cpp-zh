  md: "# Resetting the State\n\nIf the error that triggers an error boundary is a\
    \ temporary one, as can happen when a network service is unavailable, providing\
    \ a way for the user to try again can improve the user experience.\n\nSince our\
    \ ErrorBoundary component determines whether to render the fallback UI or its\
    \ children based on the hasError state value, resetting the value of hasError\
    \ will cause it to try to render the children again.\n\nTo demonstrate resetting\
    \ the state, let's first make a component that doesn't always return an error.\
    \ The component in Listing 13-7 will randomly return an error when you click a\
    \ button.\n\n# LISTING 13-7: A component that sometimes errors\n\n```\nimport\
    \ ErrorBoundary from './ErrorBoundary';\nimport { useState } from 'react';\n\n\
    function SometimesBad() {\n  const [message, setMessage] = useState();\n\n  const\
    \ handleClick = () => {\n    const randomNumber = Math.floor(Math.random() * 2);\n\
    \    if (randomNumber === 1) {\n      setMessage({error:\"there has been an error\"\
    });\n    } else {\n      setMessage(\"great!\");\n    }\n  };\n  return (\n  \
    \  <div>\n      <button onClick={handleClick}>Mystery Button</button>\n      {message}\n\
    \    </div>\n  );\n}\n\nexport default SometimesBad;\n```\n\nIf you use one of\
    \ the ErrorBoundary components you've seen so far in this chapter, it will prevent\
    \ the user from seeing a blank screen and will leave the rest of the app intact.\
    \ However, because this error isn't necessarily fatal, you can give the user an\
    \ option to try their luck again. To do so, provide a way for the value of hasError\
    \ to be reset to false, as shown in Listing 13-8."
