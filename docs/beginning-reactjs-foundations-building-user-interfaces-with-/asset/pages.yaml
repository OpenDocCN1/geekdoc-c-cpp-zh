- img_proc: true
  md: "# Consuming a Context\n\nThe Provider component can be used as many times as\
    \ you need, and it can be nested. Components that use a Context will access the\
    \ closest Provider ancestor or use the Context's default value if there isn't\
    \ a Provider ancestor.\n\nOnce you have a Context and a Provider, descendant components\
    \ can become Consumers of the Context. Context Consumers will be re-rendered when\
    \ the Provider's value changes.\n\n# Using Context in a Class Component\n\nThere\
    \ are two ways to consume Context in a class component:\n\n+   - Set the contextType\
    \ property on the class.\n- Use the Context.Consumer component.\n\nIf you only\
    \ need to use one Context in a class, setting the contextType property is the\
    \ easiest method. Because contextType is a class property, you can set it using\
    \ public class fields syntax, as shown in Listing 17-4.\n\n> LISTING 17-4: Consuming\
    \ a Context in a class component\n\n```\nimport React from 'react';\nimport {PrefsContext}\
    \ from './contexts/UserPrefs';\nclass TimeDisplay extends React {\n  static contextType\
    \ = PrefsContext;\n\n  render() {\n    return (\n      <>\n        Your language\
    \ preference is {this.context.lang}.<br />\n        Your timezone is {this.context.timezone}.\n\
    \      </>\n    );\n  }\n}\n\nexport default TimeDisplay;\n```\n\nIf your component\
    \ needs to use multiple Context objects, you can use the Context.Consumer component.\
    \ It requires a function as its child, and the value of the Context is passed\
    \ as an argument to that function, as shown in Listing 17-5.\n\n> LISTING 17-5:\
    \ Using the Context.Consumer component\n\n```\nimport React from 'react';\nimport\
    \ {PrefsContext} from './contexts/UserPrefs';\n```"
  merge: -1
  pgno: 430
- img_proc: true
  md: "```\nclass TimeDisplay extends React.Component {\n  render() {\n    <PrefsContext.Consumer>\n\
    \      {userPrefs => (\n        Your language preference is {userPrefs.lang}.<br\
    \ />\n        Your timezone is {userPrefs.timezone};\n      )}\n    </PrefsContext.Consumer>\n\
    \  }\n}\n\nexport default TimeDisplay;\n```\n\n# Using Context in a Function Component\n\
    \nYou can consume a Context in a function component by using the Context.consumer\
    \ component or by using the useContext hook.\n\nTo use useContext, import the\
    \ Context and pass it to useContext, which will return the value from the Provider.\
    \ Listing 17-6 shows a function component that uses useContext to get user preferences.\n\
    \n> LISTING 17-6: Consuming a Context in a function component\n\n```\nimport {useContext}\
    \ from 'react';\nimport {PrefsContext} from './contexts/UserPrefs';\n\nfunction\
    \ TimeDisplay(props) {\n  const userPrefs = useContext(PrefsContext);\n\n  return\
    \ (\n    <\n      Your language preference is {userPrefs.timezone}.<br />\n  \
    \    Your timezone is {userPrefs.timezone};\n    </>\n  );\n}\n\nexport default\
    \ TimeDisplay;\n```\n\n# COMMON USE CASES FOR CONTEXT\n\nContext is most useful\
    \ for managing global data. What fits the description of global data is a judgment,\
    \ but if some piece of data needs to be accessed by multiple components at different\
    \ nesting levels, it may be a candidate for using Context."
