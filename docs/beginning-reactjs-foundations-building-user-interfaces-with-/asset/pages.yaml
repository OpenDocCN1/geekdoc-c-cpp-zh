  md: "```\ntoggleBrewing = function(){\n  this.setState({brewing:!this.state.brewing});\n\
    }\n\nrender() {\n  return(\n    <>\n      The Coffee Maker is {this.state.brewing?'on':'off'}<br\
    \ />\n      <button onClick={this.toggleBrewing}>toggle brewing state</button>\n\
    \    </>\n  );\n}\n\nexport default CoffeeMachine;\n```\n\n# JAVASCRIPT LESSON:\
    \ METHOD DEFINITION SYNTAX\n\nIn JavaScript classes, functions in the class (also\
    \ known as methods) can be created using method definition syntax, which is a\
    \ shorthand for assigning a function to a method name.\n\nFor example, you can\
    \ define a method by assigning a function to a property, like this:\n\n```\ntoggleBrewing\
    \ = function(){\n  this.setState({brewing:!this.state.brewing});\n}\n```\n\nOr\
    \ you can use method definition syntax, like this:\n\n```\ntoggleBrewing() {\n\
    \  this.setState({brewing:!this.state.brewing});\n}\n```\n\n# Binding Event Handler\
    \ Functions\n\nTo be useful, event handler functions need to be passed as values\
    \ to React's built-in components that support event listener attributes. For example,\
    \ the built-in input element represents an input component that can receive an\
    \ onChange event handler prop and will call an associated callback when it receives\
    \ a change event.\n\nBecause handler functions are passed to child components\
    \ via props, they need to be bound to the context in which they were created so\
