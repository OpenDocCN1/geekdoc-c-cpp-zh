  md: "You can also add the propTypes object into your class component by putting\
    \ it outside of the class body, as shown in Listing 6-5.\n\n# LISTING 6-5: Putting\
    \ propTypes outside the class body\n\n```\nimport PropTypes from 'prop-types';\n\
    import { Component } from 'react';\n\nclass WelcomeMessage extends Component {\n\
    \  render() {\n    return (<h1>Welcome, {this.props.firstName}</h1>);\n  }\n}\n\
    nnWelcomeMessage.propTypes = {\n  firstName: PropTypes.string\n}\n\nexport default\
    \ WelcomeMessage;\n```\n\nIn function components, the propTypes object always\
    \ goes outside of the function body, as shown in Listing 6-6.\n\n# LISTING 6-6:\
    \ Using propTypes with a function component\n\n```\nimport PropTypes from 'prop-types';\n\
    \nfunction MyComponent(props) {\n  return <p>The value is {props.itemValue}</p>;\n\
    }\n\nMyComponent.propTypes = {\n  itemValue: PropTypes.number\n}\n\nexport default\
    \ MyComponent;\n```\n\n# What Can PropTypes Validate?\n\nPropTypes can perform\
    \ a variety of checks on a component's props, including the data type (as you've\
    \ seen), whether required props are passed, the shape of properties passed as\
    \ objects, and more. In this section, I'll explain and demonstrate all of the\
    \ different validation rules contained in PropTypes.\n\n# Validating Data Type\n\
    \nYou've already seen how to check whether a prop is one of JavaScript's data\
    \ types. The validators for JavaScript types are:\n\n+   - PropTypes.array"
  merge: -1
