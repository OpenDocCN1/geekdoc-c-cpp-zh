    +   * Module bundling: A typical website can make use of hundreds of individual
    JavaScript programs. If a web browser had to download each of these different
    programs individually, it would significantly slow down web pages due to the overhead
    involved in requesting files from web servers. The main job of a module bundler
    is to combine (or "bundle") the JavaScript and other code involved in a web application
