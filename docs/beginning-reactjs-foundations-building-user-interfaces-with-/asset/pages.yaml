  md: "+   - Form accessibility.\n- Managing focus.\n- How to use media queries.\n\
    \n# ARIA Attributes in React\n\nJSX supports all the ARIA attributes. Unlike other\
    \ attributes that you write in JSX, ARIA attributes with multiple words, such\
    \ as `aria-label`, are written the same as in HTML, using a hyphen between words\
    \ rather than camelCase.\n\nFor example, the following JSX code tells a screen\
    \ reader that an input is required and specifies the control's label:\n\n```\n\
    <input\n  type=\"text\"\n  aria-label={labelText}\n  aria-required=\"true\"\n\
    \  onChange={handleChange}\n  value={inputValue}\n  name=\"name\"\n/>\n```\n\n\
    # Semantic HTML\n\nSemantic HTML refers to HTML elements that indicate the purpose,\
    \ or role, of an element in the document. For example, a page's navigation should\
    \ be written using the `nav` element, and the `address` element should be used\
    \ to mark up contact information.\n\nWhen you use semantic elements, the ARIA\
    \ role of an element is implied, meaning there's no need to explicitly define\
    \ the ARIA role attribute. Writing semantic and valid HTML is the most important\
    \ thing you can do to make a page or application using assistive technologies.\n\
    \nBecause each React component must return a single element, there's a tendency\
    \ when writing React to wrap the return value of a component in an unnecessary\
    \ `div` element, such as the component shown in Listing 19-1.\n\n> LISTING 19-1:\
    \ Using unnecessary elements to group elements\n\n```\nfunction ListItem({ item\
    \ }) {\n  return (\n    <div>\n      <dt>{item.term}</dt>\n      <dd>{item.description}</dd>\n\
    \    </div>\n  );\n}\n```\n\nThese unnecessary elements can confuse screen readers,\
    \ especially when they’re used inside lists. For example, the component shown\
    \ in Listing 19-2 makes the `ListItem` component to generate a definition list."
  merge: -1
  pgno: 455
- img_proc: true
  md: "# LISTING 19-2: Using unnecessary grouping elements can result in invalid HTML\n\
    \n```\nfunction Glossary(props) {\n  return (\n    <dl>\n      {props.items.map(item\
    \ => (\n        <ListItem item={item.id} key={item.id} />\n      ))}\n    </dl>\n\
    \  );\n}\n```\n\nThe returned HTML from Listing 19-2 will have a div element around\
    \ each group of terms and descriptions. The result is a definition list that does\
    \ not comply with the HTML standard way to make definition lists.\n\nThe solution\
    \ to this problem is to use React.Fragment (or its shorthand element) to group\
    \ elements in cases where there shouldn't be a resulting HTML element from the\
    \ necessary JSX grouping, as shown in Listing 19-3.\n\n# LISTING 19-3: Using React.Fragment\
    \ to eliminate unnecessary HTML elements\n\n```\nfunction ListItem({ item }) {\n\
    \  return (\n    <dt>{item.term}</dt>\n    <dd>{item.description}</dd>\n  );\n\
    }\n```\n\n# Form Accessibility\n\nForm inputs need to have labels that are readable\
    \ by screen readers and that are specifically associated with the inputs. It's\
    \ not enough, for example, to have a label that visually appears above or next\
    \ to an input, like this:\n\n```\n<form>\n  first name: <input type=\"text\" />\n\
    </form>\n```\n\nAn accessible form is one that uses a label element and/or an\
    \ aria-label attribute to label each input field. The label element in JSX works\
    \ the same as the HTML label element, except that the for attribute in the HTML\
    \ label element becomes the htmlFor attribute in JSX.\n\nThe value of htmlFor\
    \ should be the value of the id attribute in the associated form control. Listing\
    \ 19-4 shows an accessible form written in JSX."
