  md: "When a promise becomes fulfilled, it can be chained to additional promises\
    \ using the thhen method, as in the following example:\n\n```\nreceiveHamburger\n\
    \  .then(eatHamburger)\n  .then(payForHamburger)\n```\n\nIn order for the preceding\
    \ code to work, each of the functions must return a Promise object. for here’s\
    \ what the receiveHamburger function might look like:\n\n```\nconst receiveHamburger\
