  md: "# isValidElement\n\nThe isValidElement function takes an object as an argument\
    \ and returns true or false depending on whether the object is a React element.\n\
    \n# cloneElement\n\nThe cloneElement function creates a copy of an element passed\
    \ into it. Here's the basic syntax for cloneElement:\n\n```\nconst NewElement\
    \ = React.cloneElement(element, [props], [children]);\n```\n\nWith cloneElement,\
    \ you can create new elements from a component's child elements, and modify them\
    \ in the process. For example, you have a Navbar component that has NavItem children.\
    \ You can render them in your App component, as shown in Listing 4-25.\n\n> LISTING\
    \ 4-25: Rendering a Navbar inside of App\n\n```\nimport Navbar from './Navbar';\n\
    import NavItem from './NavItem';\n\nfunction App(props) {\n  return (\n    <Navbar>\n\
    \      <NavItem />\n      <NavItem />\n      <NavItem />\n    </Navbar>\n  );\n\
    }\n\nexport default App;\n```\n\nThe Navbar component in this example could use\
    \ props.children to render all of the NavItems that are children, as shown in\
    \ Listing 4-26.\n\n> LISTING 4-26: Rendering the children using props.children\n\
    \n```\nfunction Navbar(props) {\n  return (\n    <div>\n      {props.children}\n\
    \    </div>\n  );\n}\n\nexport default Navbar;\n```\n\nHowever, if you want to\
    \ add an onClick attribute to each NavItem from within the Navbar component? Because\
    \ props.children isn't actually the children (it's a descriptor of the children),\
    \ you can't modify the children by using props.children."
