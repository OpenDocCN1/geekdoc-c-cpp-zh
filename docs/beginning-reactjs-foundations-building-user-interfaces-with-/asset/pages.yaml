  md: "If you need an even more strict matching of paths, the strict attribute can\
    \ be used with NavLink components to also take into account the trailing slash\
    \ in a URL path:\n\n```\n<li><NavLink strict to=\"/aboutUs\" className=\"active\"\
    >About Us</NavLink></li>\n```\n\nIn the preceding link, the active style will\
    \ be applied if the location is /aboutUs, but not if it's /aboutUs/.\n\n# Automatic\
    \ Linking with Redirect\n\nThe Redirect component changes the current URL by replacing\
    \ the current location in the history stack when it renders. Like the Link and\
    \ NavLink components, Redirect takes an attribute named to, which can be a string\
    \ or object. Unlike Link and NavLink, Redirect doesn't have children.\n\nRedirect\
    \ is often used to change the URL in the result of a conditional statement, as\
    \ in the following example:\n\n```\n<loginSuccess?<Redirect to=\"members\" /><Redirect\
    \ to=\"forgotPassword\" />\n```\n\nIf you want to add a new location to the history\
    \ stack, rather than replacing the current one, use the push attribute:\n\n```\n\
    <Redirect push=\"pageNotFound\" />\n```\n\nThe Redirect component can also take\
    \ an attribute called from, which causes it to function as a routing component.\
    \ I'll discuss the from attribute in the next section, \"Creating Routes.\"\n\n\
    # Creating Routes\n\nThe Route component is the one that actually creates routes.\
    \ In its simplest form, Route takes an attribute named path, which it compares\
    \ with the current location. If there's a match, Route will render its children:\n\
    \n```\n<Route path=\"/\\\">\n  <LoginForm />\n</Route>\"\n```\n\nBy default, the\
    \ path only needs to match part of the location. For example, if the current browser\
    \ location is /login, the component in Listing 12-4 will render both the Home\
    \ component and the Login component.\n\n> LISTING 12-4: Multiple routes in a component\
    \ may have matches\n\n```\nimport { BrowserRouter as Router, Route } from 'react-router-dom';\n\
    \nfunction HomeScreen(props) {\n  return (\n    <Router>\n      <Route path=\"\
    /\">\n        <Home />\n      </Route>\n```"
