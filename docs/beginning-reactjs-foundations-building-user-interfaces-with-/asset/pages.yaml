    +   6. Introduce an error into App.js. For example, deleting an ending tag in
    the return statement.


    +   7. Run ESLint again to confirm that it produces an error.


    # ESLint Configuration


    The easiest way to configure ESLint is to run the initialization script. But,
    ESLint has far more options than the ones the script asks you. The primary way
    to configure ESLint is through rules in the configuration file.


    If your configuration file has a property named extends, it''s bringing in the
    rules from the configuration or plugins listed there. You can override them or
    add additional rules to the rules property.


    ESLint rules determine what will produce output when you run ESLint, and the severity
    (called "error level") of the output. For example, if you like to use single quotes
    around strings in JavaScript, you can tell ESLint to show a warning when it doubles
    quotes with the following rule:

    "quotes": ["warn", "single"]


    The error level can be one of three values:


    +   0 or "off": Disables the rule.

    1 or "warn": Displays a warning message.

    2 or "error": Displays an error and sets the exit code to 1, which will cause
    your automated build script to fail, as you''ll see later in this chapter.


    You can find a complete list of ESLint''s rules at https://eslint.org/docs/rules/'
