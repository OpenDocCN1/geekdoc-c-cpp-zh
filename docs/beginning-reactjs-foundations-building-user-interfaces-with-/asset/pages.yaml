  md: "# Using useMediaQuery\n\nThe useMediaQuery hook is part of the react-responsive\
    \ library. To use it, you first need to install it npm install react-responsive\
    \ and import it into your component. Once you've imported, you can use either\
    \ the MediaQuery component or the useMediaQuery hook.\n\nTo use useMediaQuery\
    \ hook, pass a query to it as a parameter. The result will be a Boolean value\
    \ that you can use to conditionally render JSX. Listing 19-8 shows an example\
    \ of using useMediaQuery to conditionally render one of four different components\
    \ based on the size of the viewport.\n\n# LISTING 19-8: Conditionally rendering\
    \ children based on a media query\n\n```\nimport { useMediaQuery } from 'react-responsive'\n\
    \nconst Desktop = ({ children }) => {\n  const isDesktop = useMediaQuery({ minWidth:\
    \ 992 })\n  return isDesktop ? children : null\n}\n\nconst Tablet = ({ children\
    \ }) => {\n  const isTablet = useMediaQuery({ min: 768, maxWidth: 991 })\n  return\
    \ isTablet ? children : null\n}\n\nconst Mobile = ({ children }) => {\n  const\
    \ isMobile = useMediaQuery({ maxWidth: 767 })\n  return isMobile ? children :\
    \ null\n}\n\nconst Default = ({ children }) => {\n  const isNotMobile = useMediaQuery({\
    \ minWidth: 768 })\n  return isNotMobile ? children : null\n}\n\nconst Example\
    \ = () => (\n  <div>\n    <Desktop>Desktop or laptop</Desktop>\n    <Tablet>Tablet</Tablet>\n\
    \    <Mobile>Mobile</Mobile>\n    <Default>Not mobile (desktop or laptop)</Default>\n\
    \  </div>\n)\n\nexport default Example;\n```\n\n# SUMMARY\n\nAccessibility is\
    \ an essential element in the design and implementation of any user interface.\
    \ It helps to ensure that the largest possible number of users will be able to\
    \ access and make use of your application. The techniques for implementing accessibility\
    \ in React are largely the same as with any web UI, but with some important technical\
    \ differences."
