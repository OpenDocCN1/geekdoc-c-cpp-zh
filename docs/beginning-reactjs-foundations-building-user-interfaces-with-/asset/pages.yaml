  md: "# JavaScript Class Validation\n\nPropTypes.instanceof tests that the supplied\
    \ prop is an instance of a particular JavaScript class (meaning that it has this\
    \ class in its prototype chain). To use it, you can use the instanceof validator,\
    \ as shown in Figure 6-12. The instanceof validator uses the JavaScript instanceof\
    \ operator.\n\n+   LISTING 6-12: Validating that a prop is an instance of a class\n\
    \n```\nimport {Component} from 'react';\nimport {PropTypes} from 'prop-types';\n\
    import Person from './Person';\n\nclass FamilyTree extends Component {\n  render()\
    \ {\n    return (\n      <p>{this.props.father.firstName}</p>\n    );\n  }\n}\n\
    \nFamilyTree.propTypes = {\n  father: PropTypes.instanceOf(Person)\n}\n\nexport\
    \ default FamilyTree;\n```\n\n![](img/532a93636824efa5dbcdf73782c1fac9_182_0.png)\n\
    \nFigure 6-10: Failing PropTypes.element validation"
