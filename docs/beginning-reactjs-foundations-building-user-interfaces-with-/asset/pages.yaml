  md: 'It''s fully possible to create React components without JSX by using the React.createElement
    method. Here''s what the code to output the previous HTML markup looks like when
    you write it using React.createElement.


    ```

    React.createElement("label", {className:inputLabel"}, "Search:"

    React.createElement("input", {type: "text", id: "searchInput"));

    ```


    If you examine this JavaScript code closely, you should be able to figure out
    how basically it works. The React.createElement method accepts an element name,
    any attributes of the HTML element, the element''s content("Search:" in this example)
    and its child element. In this case, the label element has pretty much all one
    child input.


    That''s pretty much all there is to React.createElement. If you''re interested
    in learning the exact syntax of React.createElement, you can read more about it
    here:


    https://reactjs.org/docs/react-without-jsx.html


    In reality, very few developers ever have to think about React.createElement,
    because we use a transpiler as part of our development environment.


    # # Transpiler... Huh?


    Before you run a React application that uses JSX and modules, it must be first
    compiled. During compile (also known as "build") process, all of the modules are
    joined together and the JSX code is converted into pure JavaScript.


    # ## Compilation vs. Transp


    Compilation of React applications is somewhat different from how programmers of
    truly "compiled" languages (like C++ or Java) understand compilation. In compiled
    languages, the code that you write is converted into low-level code that can be
    understood by the computer''s software interpreter. Low-level code is called bytecode.


    When React applications are compiled, on the other hand, they''re converted from
    one version of JavaScript to another version of JavaScript. Because the React
    compilation process doesn''t actually create bytecode, a more technically correct
    word for what happens is transpiration.


    # ## JSX Transform


    One of the steps in the transpilation of React code is the JSX Transform. The
    JSX Transform is a process in which takes JSX code (which isn''t understood by
    web browsers) and converts it into plain JavaScript (which is natively understood
    by web browsers).


    # ## Introducing Babel


    The tool we use for transpilation in JavaScript is called Babel. Babel is integrated
    into Create React and is an automatic process of compiling a React app built with
    Create React App.'
  merge: -1
