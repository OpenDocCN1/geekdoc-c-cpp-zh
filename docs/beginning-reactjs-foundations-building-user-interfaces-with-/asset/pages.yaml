    # HOW WEBPACK WORKS


    Webpack''s primary function is to combine the modules in modern JavaScript development
    into optimized output files for use in a browser. Webpack does its magic by starting
    with an entry point (which is src/index.js by default) and building a dependency
    graph. A dependency graph is a list of every module linked from the entry point
    and what the dependencies of each module are. By using the dependency graph, Webpack
    can bundle all of these files together.'
