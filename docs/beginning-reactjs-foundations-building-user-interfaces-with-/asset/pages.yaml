  md: '# The Philosophy of React


    To change a paragraph of text in the browser using jQuery, for example, you would
    do something like this:


    ```

    $(''#paral'').html(''<p>This is the new paragraph.</p>'');

    ```


    This code looks for a paragraph with the id attribute equal to paral and changes
    its HTML content to the new content that''s specified in the parentheses.


    React takes a different approach, which we call declarative programming. In declarative
    programming, the computer (or the computer language interpreter, rather) has some
    intelligence about the types of tasks that it can perform, and the programmer
    only needs to tell it what to do, rather than how to do.


    In declarative programming, our sandwich-making robot would know the steps for
    making sandwiches, and programming would involve the programmer saying "make me
    a sandwich that looks like this."


    Applied to DOM manipulation, the declarative approach that React takes is to allow
    the programmer to say, "Make the page look like this." React then compares the
    new way that the page should look with what it currently looks and figures out
    what needs to change and how to do it.


    Building and updating a React user interface, from the programmer''s perspective,
    is just a matter of specifying what the user interface should look like and telling
    React to render it.


    # React Idiomatic


    React itself is a small library with limited functionality compared to other JavaScript
    libraries. Except for a handful of concepts and methods that are unique to React,
    React components are just JavaScript. If the structure and code of a React component
    looks foreign to you, it''s likely because it uses a style of JavaScript programming
    that you''re not familiar with, or because it makes use of a new feature in JavaScript
    that you''re not familiar with. The good news is that by getting better at JavaScript,
    you''ll get better at programming with React.


    You may hear the term "idiomatic JavaScript" used to describe React. What this
    means is that code is easily understandable to people who know JavaScript. The
    reverse is also true: if you know JavaScript, understanding how to write React
    is not too much of a stretch.


    # Why Learn React?


    If you made it this far in the book, you already have your own reasons for learning
    React. You already know that you''re in good company—React''s popularity has been
    growing from day one of its release into the world. Surveys of developers have
    consistently shown that it''s at the top, or near the top, of their preferred
    libraries, and the list of companies that have already migrated to React or that
    are in the process of migrating to React is impressive, to say the least.


    React is going to be around for a long time to, and there''s never a better time
    to learn it.'
  merge: -1
