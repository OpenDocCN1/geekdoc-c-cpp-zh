  md: '# 264 | CHAPTER 11 INTRODUCING HOOKS


    The function you pass to a setter function will receive the previous value of
    the stateful variable as an argument, and it is common to name it prev or the
    name of the variable with prev before it:


    ```

    const [score,setScore] = useState(0); // score === 0

    setScore((prevScore) =>prevScore+1); // score === 1

    ```


    # Setter Function Value Comparison


    If the value you pass into a setter function is the same as the current value
    of the state variable, the setter function will “bail out” without re-rendering
    the component’s children.


    # Hooking into the Lifecycle with useEffect


    The useEffect hooks an effect, which will run after each render of the function
    component by default. The useEffect hook can be used to simulate the componentDidMount(),
    componentDidUpdate(), and componentWillUnmount() lifecycle methods in components.


    The purpose of useEffect is to allow you to run imperative code that may have
    side effects inside a function component, such as network requests, setting timers,
    and manipulating the DOM directly. The reason these types of operations aren’t
    otherwise possible in function components, is that the render method is the only
    function components that is essentially the render method of a component. Side
    effects shouldn’t be done in the render method, even in classes, because the render
    method is likely to overwrite the results of any side effects. Instead, side effects
    should be performed after the render method has run and the DOM has been updated.


    This is why side effects are handled inside of lifecycle methods, such as constructor(),
    componentDidDidMount(), and componentDidUpdate() in classes.


    # JAVASCRIPT LESSON: SIDE EFFECTS


    The term “side effects” comes up in React, but it’s not a React-specific term.
    In computer science, a side effect is a result of an impure function. When you
    recall, a pure function is one whose return value is always the same when given
    the same arguments, and do not do anything that lasts past the running of the
    function except return a value.


    Anything that a function does has an effect outside of the function, other than
    producing a return value, is a side effect.


    Side effects in a browser-based application can include:


    +   - Modifying global variables.

    - Making a network request.

    - Changing the DOM.

    - Writing to a database or a file.

    - Modifying an argument.'
