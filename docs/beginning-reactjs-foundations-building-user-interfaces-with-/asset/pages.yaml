  md: "The standard naming convention for CSS module files is to lowercase and hyphenate\
    \ the component name that will be used in, and then follow with .module.css.\n\
    \nSo, if your React component is named NavBar, the CSS module file for the NavBar\
    \ would be named nav-bar.module.css. You can import the styles in the CSS module\
    \ file any name you want, and it's normal to import it as an object name styles,\
    \ like this:\n\nBecause each component has its own styles object, you can write\
    \ the CSS for any component without having to worry that a class name you use\
    \ for one component's styles will interfere with a style having the same name\
    \ in another component.\n\nThe styles inside a CSS module file should use camelCase\
    \ when you use them inside your JSX, you can access them using dot notation.\n\
    \n# Advanced CSS Modules Functionality\n\nCSS module files can be plain CSS, but\
    \ they also have some additional capabilities that can make them more powerful\
    \ than plain old CSS.\n\n# Global Classes\n\nBy default, the rules you create\
    \ in CSS module files are scoped locally to the component you import the styles\
    \ into. If you want to create a global rule, you can do so by prefixing the name\
    \ of the class with :global, like this:\n\n```\n:global .header1 {\n  font-size:\
    \ 2rem;\n  font-weight: bold;\n}\n```\n\nIn this example, the header1 class will\
    \ be available to all of your components.\n\n# Class Composition\n\nClass composition\
    \ lets you create new classes in CSS modules by extending existing ones. For example,\
    \ you might have a class named bodyText that determines what standard text in\
    \ your component should display. With class composition, different types of text\
    \ can extend the base bodyText class to create variations. Class composition in\
    \ CSS modules uses a special property called composes, which takes as value any\
    \ number of classes that should be the starting point for the current class.\n\
    \nListing 10-11 shows an example of class composition to create a firstParagraph\
    \ class based on bodyText.\n\nLISTING 10-11: Using class composition\n\n```\n\
    .bodyText {\n  font-size: 12px;\n  font-family: Georgia serif;\n  color: #333;\n\
    ```"
