  md: "Because of this, using an object, array, or function in a dependency array\
    \ will result in the function running on every render of the function component.\
    \ Just as useCallback is the solution for callback functions, useMemo is the solution\
    \ to unnecessary renders due to object or array dependencies.\n\n# Solving Performance\
    \ Problems\n\nNormally, JavaScript (and therefore calculations in React) is very\
    \ fast. However, in rare cases, when you encounter a performance problem due to\
    \ a computationally expensive operation, useMemo can be used to solve.\n\nFor\
    \ example, the component in Listing 11-14 generates a chart from a large set of\
    \ data. By using useMemo to cache the chart, you can prevent it from being regenerated\
    \ each time the component renders. Instead, it will only be generated when the\
    \ data is supplied to it.\n\n> LISTING 11-14: Solving performance problems with\
