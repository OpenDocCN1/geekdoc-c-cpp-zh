    FIGURE 7-1: Viewing the properties of a SyntheticEvent


    The SyntheticBase object has a property called NativeEvent, which is an object
    that contains all the properties of the native Event object that SyntheticBaseEvent
    wraps around. Compare the properties in this NativeEvent object, shown in Figure
    7-2, with the properties in the SyntheticEvent shown in Figure 7-1.


    # SUPPORTED EVENTS


    All interactivity in a web browser happens as a result of events. Events are an
    emitted (or "fired") by software in reaction to interactions or significant things
    (including automated processes) happening in the browser. For example, when a
    user clicks a button while the pointer is hovered over a button, that causes the
    button element to emit a click event. The movement of the mouse pointer within
    the browser window and the mouse pointer hovering over an element trigger additional
    events.'
