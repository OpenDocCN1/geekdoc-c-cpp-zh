  md: "# LISTING 20-9 (continued)\n\n```\nconst client = new ApolloClient({\n  url:\
    \ 'https://my.graphql.server',\n  cache: new InMemoryCache()\n});\n\nfunction\
    \ App() {\n  return (\n    <div>\n      <h2>My first Apollo app</h2>\n    </div>\n\
    \  );\n}\n\nrender(\n  <Apollo client={client}>\n    <App/>\n  </Apollo>\n  document.getElementById('root')\n\
    );\n```\n\n# React Native\n\nReact Native is a framework for creating native mobile\
    \ apps using React. React Native works the same as React: components are JavaScript\
    \ functions or classes that return JSX. The difference between React and React\
    \ Native is that React Native does not manipulate the HTML DOM. Instead, React\
    \ Native components return JSX elements that map to mobile user interface blocks\
    \ as Text, View, and Image. React Native was explored further in Chapter 4.\n\n\
    # Next.js\n\nNext.js a React development web framework, similar to Create React\
    \ App. Like React App, Next.js helps you get started with your React app quickly\
    \ and provides tools that you'll use throughout the development and building of\
    \ your application.\n\nIn terms of features, the two main differences between\
    \ Next.js and Create React App are:\n\n+   - Next.js is more configurable than\
    \ Create React App.\n- Next.js supports server-side rendering. Create React App\
    \ can be configured to support server-side rendering, but it doesn't support it.\n\
    \n# Gatsby\n\nGatsby is a static generator. It pre-renders React interfaces and\
    \ pre-fetches data on the server, which makes rendering of the site happen faster\
    \ on the client. Beside speed, another benefit to serving static pages is they\
    \ may be more easily accessible by search engines, which can mean that static\
    \ sites receive higher search engine placement. Since static sites don't interact\
    \ with the server or a database from the browser, they are also more secure and\
    \ provide less opportunity for a malicious script or user to access or modify\
    \ data they're not authorized to access."
