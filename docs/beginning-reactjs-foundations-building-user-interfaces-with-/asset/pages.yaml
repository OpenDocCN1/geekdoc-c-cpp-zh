  md: '# 14


    # Deploying React


    Now that you know how to build a React UI, implement routing, catch and log errors,
    and several methods for fixing performance problems, you''re ready to move beyond
    the confines of your local development machine and make your app available to
    its audience. In software and web development, we call this step deployment.


    In this chapter, you''ll learn:


    +   - The differences between the development and production versions of React.

    - How to build your app for deployment.

    - Different options for hosting a React UI.

    - How to enable continuous integration with Git.


    # WHAT IS DEPLOYMENT?


    Software deployment is the process of making software available for use. For web
    apps, this means putting an app on the web. For mobile apps, it usually means
    putting an app in an app store.


    Deployment of a web app generally involves running the code through several steps
    to prepare it for the web, followed by actually transferring the processed files
    to a server where they''ll become accessible through a non-local URL.


    # BUILDING AN APP


    Building, or compiling, an app is the process of transforming your development,
    or source, files into a standalone app. In the case of a React project, this means
    your app must go through several steps, including the following:


    +   - Linking to the optimized production version of the React and ReactDOM libraries.

    - Bundling other linked libraries that are required for your app to run on a server
    (such as React Router).'
  merge: -1
  pgno: 381
- img_proc: true
  md: '+   Transpiling your source files to a lowest-common-denominator version of
    JavaScript will run in all of your target browsers.


    +   Combining your source files into bundles for efficient transfer over the web.


    +   Minifying your source files to reduce the bandwidth for the end user to load
    the app.


    +   Moving static files (such as HTML, CSS, the compiled JavaScript, and images)
    into a distribution directory.


    Documents


    Building a React app is a complex process involving several tools and scripts
    working together to process the hundreds of files that make your React project.
    Fortunately, Create App makes building an app simple. When you''re ready to compile
    your React app that was bootstrapped with Create React App for deployment, you
    only need to know one simple command: `npm run build`.


    # Running the build Script


    When you''re ready to deploy your app (or any time you want to try out, really)
    you can create a production version of your app by using the terminal and typing
    `npm run build`.


    What happens next is that Create React App will go through a similar process to
    do what it does when you run `npm start`, instead of opening the compiled app
    in a browser, it will save the compiled files in a directory named `build`.


    # Examining the build Directory


    Figure 14-1 shows the files in the resulting build directory after running `npm
    run build` in the React Bookstore project from Chapter 5.


    ![](img/532a93636824efa5dbcdf73782c1fac9_382_0.png)


    FIGURE 14-1: The build directory'
