  md: '# SUMMARY


    You''ve come to the end of this book, and hopefully you''ve gained a good understanding
    of the foundations of ReactJs. There''s always more to learn, and the brief summaries
    in this chapter should give you some good jumping off points.


    In this chapter, you learned:


    +   - Several popular testing libraries and frameworks.


    +   - What server-side rendering is.


    +   - What GraphQL and Apollo are.


    +   - About Next.js and how it compares to Create React App.


    +   - About using Gatsby for static site generation.


    +   - Who to follow on Twitter.


    +   - Resources to use for getting help with React.


    Every React developer benefits from the amazing React community. Now that you
    have a solid foundation of React knowledge, one of the best ways to continue to
    learn and to ensure that React will continue to thrive is by giving back. Ways
    to give back include answering React questions on Stack Overflow and elsewhere,
    contributing to an open source project, or teaching React to someone else or writing
    a book. Best wishes!'
