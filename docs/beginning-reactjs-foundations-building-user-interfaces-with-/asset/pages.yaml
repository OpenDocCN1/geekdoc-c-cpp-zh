  md: '# 7


    # Events


    Events, and the functions that run in response to events, are what make React
    reactive. In this chapter, you''ll learn:


    +   - How and where to use event listeners.

    - The difference between native events and SyntheticEvents.

    - How to write event handlers in class and function components.

    - How to use the Event object.

    - How to bind functions to class components.

    - How to pass data to event handlers.

    - How to use arrow functions for inline event handlers.

    - How passing functions to child components works.


    # HOW EVENTS WORK IN REACT


    To put it simply, listening for events in a React component and handling events
    is done similarly to how HTML event attributes triggers in a browser.


    In HTML, it''s possible to use event attributes to call JavaScript functions.
    This event attributes have names starting with "on" and they take a function call
    as their value. For example, the HTML onsubmit attribute can be used with the
    <form> element to invoke a function when the form is submitted. Listing 7-1 shows
    an example of using the HTML onsubmit attribute. This example assumes that a JavaScript
    function named validate() has been defined or imported elsewhere in the HTML file.'
  merge: -1
  pgno: 243
- img_proc: true
  md: "# LISTING 7-1: Using an event attribute in HTML\n\n```\n<form id=\"signup-form\"\
    \ onsubmit=\"validate()\">\n  <input type=\"text\" id=\"email\">\n  <input type=\"\
    text\" id=\"fullname\">\n  <input type=\"submit\">\n</form>\n```\n\nBecause HTML\
    \ events violate the \"separation of concerns\" rule that says markup and scripts\
    \ should be separate, it's generally not a good practice to tie them too heavily\
    \ in web apps. Instead, JavaScript programmers use the addEventListener DOM method\
    \ to attach event listeners to HTML elements, as shown in Listing 7-2.\n\n# LISTING\
    \ 7-2: Using addEventListener\n\n```\n<html>\n<head>\n  <script>\n    function\
    \ validate(e) {\n      //do something here\n    }\n  </script>\n</head>\n<body>\n\
    \  <form id=\"signup-form\">\n    <input type=\"text\" id=\"email\">\n    <input\
    \ type=\"text\" id=\"fullname\">\n    <input type=\"submit\">\n  </form>\n  <script>\n\
    \    document.getElementById(\"signup-form\").addEventListener(\"submit\", validate);\n\
    \  </script>\n</body>\n</html>\n```\n\n> NOTE In Listing 7-2, the event listener\
    \ is registered at the end of the body of the document, the form element will\
    \ be loaded beforehand. Another way to accomplish the same thing is to add another\
    \ event listener to the document that waits until the entire page (the HTML document)\
    \ is loaded before registering listeners.\n\nIn React, setting event listeners\
    \ is a hybrid between the two approaches for doing so in HTML. The syntax in the\
    \ JSX code looks very similar to an HTML event attribute, but because it's JSX,\
    \ it actually compiles to something more closely resembles addEventListener."
  merge: -1
