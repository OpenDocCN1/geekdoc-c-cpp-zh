    #  USING REACT ROUTER


    React Router can be used for routing in web applications or in mobile apps. Because
    of the fundamental differences in routing in a browser versus routing in a native
    mobile app, there are two versions of React Router:


    +   - react-router-dom is the version of React Router for the web.

    - react-router-native is the version of React Router for native apps.


    Since this book is primarily about creating user interfaces for the web, we''ll
    use react-router-dom. However, the basic process that you''ll use to create routes
    and links in React Router applies for either version.


    # Installing and Importing react-router-dom


    React Router isn''t installed with Create React App by default, so you''ll need
    to install it before you can start using it. Once you have a React application
    built with Create React App, you can install react-router-dom using npm by entering
    the following command into the terminal:


    ```

    npm install react-router-dom@5.3.0

    ```'
