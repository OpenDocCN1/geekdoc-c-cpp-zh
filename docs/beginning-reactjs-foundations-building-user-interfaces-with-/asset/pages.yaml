  md: '# React vs....


    The job of being a software developer today, especially one working with JavaScript
    and the web, requires some knowledge of a staggering large and growing number
    of libraries, frameworks, protocols, standards, best practices, and patterns.
    A great programmer not only knows how to apply whatever language and framework
    they are working in at any time, but also how to quickly learn languages and frameworks.


    One good way to learn a new language is by comparing it to what you already know,
    and the question "how does React compare to (x)" is one of the most common questions
    that my students ask me. In the following sections, I will look at how React stacks
    up against its closest rivals: Angular and Vue. While I don''t like to take sides,
    I know enough about each to give some facts and impressions.


    # React vs. Angular


    Angular (angular.io) was created by Google, and it''s around longer than React
    in one form or another. Let''s start with the similarities:


    +   1. Purpose. Both Angular and React can create scalable and dynamic user interfaces.


    +   2. Stability. Both Angular and React were created by one of the largest companies
    on the internet and they have high numbers of developers and enthusiasts.


    +   3. Robustness. A major concern with any JavaScript library or framework is
    how safe, secure, and generally acceptable it is for enterprise development. Both
    Angular and React are popular and widely used in corporate software development.


    Angular has gone through some major changes in the years since React came onto
    the scene. Prior to what we now call "Angular" it was AngularJS, which was replaced
    in 2016 with Angular 2.0. Angular 2.0 was a major shift and was not compatible
    with AngularJS. Its introduction led to many developers deciding to learn React
    instead of rewriting Angular.


    Angular is considered to be a "framework," while React calls itself "library."
    The difference between a library and a framework is that a framework is usually
    an all-encompassing way of doing something, while a library is generally seen
    as a tool for a more specific purpose.


    The React library itself is a tool for making user interfaces out of components.
    Angular, on the other hand, is a complete system for building front-end web applications.
    By assembling components and libraries, React can do everything that Angular can
    do. But, if you need something smaller, such as to generate some HTML, React can
    do that as well.'
  merge: -1
