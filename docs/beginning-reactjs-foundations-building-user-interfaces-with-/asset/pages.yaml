  md: "# Destructuring Assignment\n\nDestructuring assignment syntax lets you create\
    \ variables by unpacking the elements in an array or the properties of an object.\
    \ For example, say you have the follow-object:\n\n```\nconst User = {\n  firstName:\
    \ 'Lesley',\n  lastName: 'Altenwerth',\n  username: 'roosevelt86',\n  address:\
    \ '81592 Daniel Underpass',\n  city: 'Haileeshire',\n  birthday: '1963-10-12'\n\
    };\n```\n\nIf you want to create individual variables from the properties in this\
    \ object, one way to do it is to declare and assign individual variables, like\
    \ this:\n\n```\nconst firstName = User.firstName;\nconst lastName = User.lastName;\n\
    const username = User.username;\n...\n```\n\nUsing destructuring syntax, you can\
    \ do all in one statement:\nconst {firstName,lastName,username,address,city,birthday}\
    \ = User;\nTo use destructuring with arrays, use square brackets:\nconst [firstName,lastName]\
    \ = ['Lesley', 'Altenwerth'];\n\n# Managing State in Function Components\n\nEach\
    \ time a JavaScript function runs, variables are initialized. Because functional\
    \ components are merely JavaScript functions, it's not possible for them to have\
    \ persistent local variables.\n\nReact hooks allow functional components to create\
    \ and access data that persists from one invocation of a functional component\
    \ to the next (aka 'state').\n\nHooks are functions that let you 'hook' into functionality\
    \ of class components without writing a class. React has built-in hooks and even\
    \ you write your own hooks. The hook that lets you persist data with functional\
    \ components is useState.\n\nThe first step is using useState to import it from\
    \ the React library, like this:\n\nOnce imported, you can invoke useState inside\
    \ your functional component as many times as you need. The useState function returns\
    \ an array containing a stateful variable and a function for updating that variable.\
    \ Using destructuring, you can extract this array into two variables:\n\n```\n\
    const [todos, setTodos] = useState([{item: 'Learn About Hooks'}});\n```"
