  md: "# Controlling Media Playback\n\nHTML5 audio and video elements can be controlled\
    \ using several DOM methods, including play, pause, and load. You can attach refs\
    \ to media elements to use these methods, as shown in Listing 9-7.\n\nLISTING\
    \ 9-7: A React audio player\n\n```\nimport React, {Component} from 'react';\n\n\
    class AudioPlayer extends Component {\n  constructor(props) {\n    super(props);\n\
    \    this.mediaFile = React.createRef();\n    this.playToggle = this.playToggle.bind(this);\n\
    \  }\n\n  playToggle() {\n    if (this.mediaFile.current.paused) {\n      this.mediaFile.current.play();\n\
    \    } else {\n      this.mediaFile.current.pause();\n    }\n  }\n\n  render()\
    \ {\n    return (\n      <audio ref={this.mediaFile}>\n        <source src=\"\
    music/thebestever.mp3\" type=\"audio/mpeg\" />\n      </audio>\n      <button\
    \ onClick={this.playToggle}>Play/Pause</button>\n    );\n  }\n}\n\nexport default\
    \ AudioPlayer;\n```\n\n# Setting Scroll Position\n\nThe DOM window.scrollTo method\
    \ takes coordinates in a document (specified as x and y pixel values) and scrolls\
    \ the window to those coordinates. One way to use this is to find the position\
    \ of a certain element in a document (using the offsetTop property) and then scroll\
    \ the window to that element.\n\nThis can be useful for navigating long documents,\
    \ or for remembering a user’s position between sessions."
  merge: -1
  pgno: 284
