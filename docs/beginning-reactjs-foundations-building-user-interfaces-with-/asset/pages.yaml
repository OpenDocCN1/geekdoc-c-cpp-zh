  md: "# Media Queries in Included CSS\n\nIf your React toolchain is configured to\
    \ allow the importing of CSS files (as is the case if you use Create React App),\
    \ you can use media queries in React the same way that you'd use in any web application.\n\
    \nListing 19-7 shows how to use media queries in CSS to format a web application\
    \ differently at different viewport widths. Each width at which the styles change\
    \ in responsive design is called a \"breakpoint.\"\n\n# HOW MANY BREAKPOINTS SHOULD\
    \ YOU HAVE?\n\nAt the very least, a responsive web application should have a separate\
    \ design for mobile devices and desktop devices. While a mobile layout may work\
    \ fine on a desktop-top, mobile-specific user interface controls (especially those\
    \ touching events) may not work correctly on desktop computers.\n\nThe breakpoints\
    \ specified in the sample CSS shown in Listing 19-7 are more granular, and you\
    \ can refine your breakpoints further to customize the CSS for devices that may\
    \ fall between these standard ones.\n\nMany websites and organizations have created\
    \ sample media queries that you can copy and paste into your applications. The\
    \ ones in Listing 19-7 come from https://responsivedesign.is.\n\n# LISTING 19-7:\
    \ Responsive media queries in a CSS file\n\n```\n/* Smartphones (portrait and\
    \ landscape) */\n@media only screen and (min-device-width : 320px) and (max-device-width\
    \ : 480px) {\n  * Styles */\n}\n\n/* iPads (portrait and landscape) */\n@media\
    \ only screen and (min-device-width : 768px) and (max-device-width : 1024px) {\n\
    \  * Styles */\n}\n\n/* Desktops and laptops */\n@media only screen and (min-width\
    \ : 1224px) {\n  * Styles */\n}\n\n/* Large screens */\n@media only screen and\
    \ (min-width : 1824px) {\n  * Styles */\n}\n```"
