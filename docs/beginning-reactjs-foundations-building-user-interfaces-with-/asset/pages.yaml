    # IMPLEMENTING AN ERROR BOUNDARY


    An error boundary isn''t a specific function or component in React. Instead, it''s
    any component that you create that defines a static getDerivedStateFromError or
    componentDidDidCatch lifecycle method (or both). Because error boundaries make
    use of lifecycle methods, they must be class components. Once you define an ErrorBoundary
    component, you can reuse it as many times as you need—or reuse it in multiple
    React apps. So, if you want, an ErrorBoundary may be the only component you need
    to write.


    # Building Your Own ErrorBoundary Component


    One way to get an ErrorBoundary component is to build your own. Listing 13-1 shows
    a simple example of an ErrorBoundary, which uses static getDerivedStateFromError
    to show a fallback when an error occurs.'
