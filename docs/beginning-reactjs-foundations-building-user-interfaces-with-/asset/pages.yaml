    # # Naming Your React App


    The name you choose for your new app is up to you, as long as it conforms to the
    rules of Node.js package names. These rules are:


    +   - It must be less than 214 characters.

    - The name can''t start with a dot or underscore.

    - The name can''t have uppercase letters.

    - It cannot contain any characters that aren''t allowed in URLs (such as ampersands
    and signs) or are "unsafe" in URLs (such as the percent symbol and spaces).


    In addition to these rules, there are several common conventions for how Node.js
    packages and thereafter apps using Create React App, are named:


    +   - Keep it simple and short as possible.

    - Use only lowercase letters.

    - Use dashes in place of spaces.

    - Don''t use the same name as a common Node.js package.


    # # Making Your First React App


    Follow these steps to use Create React App to make your first react app:


    +   1. Make or open a new folder in Visual Studio Code.


    +   2. Open the Terminal and make your new folder the working directory. You can
    do this by right-clicking the folder name and choosing Open in Integrated Terminal,
    or by opening the Terminal and using the Unix cd (for change directory) command
    to change the working directory to the one you want to make the new app. Note
    that if you''re using Windows, the integrated terminal is the Windows Command
    Prompt, in which case the command to change the working directory is dir.


    +   3. Use npx to run create-react-app and give your new application name. For
    example: npx create-react-app my-test-app


    +   4. Press Enter to start the installation of create-react-app and the configuration
    of your new app. You''ll see a series of messages and progress bars in the Terminal.
    You may also see some errors and warnings, but often these aren''t anything to
    be concerned about.'
