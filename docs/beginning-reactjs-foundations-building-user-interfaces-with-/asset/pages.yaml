  md: "# REACT ROUTER HOOKS\n\nAs you've seen in the previous examples, React Router\
    \ includes several hooks that give you access to the state of the Router. These\
    \ hooks are:\n\n+   - useHistory: Gives you access to the history object.\n- useLocation:\
    \ Gives you access to the current location object.\n- useParams: Returns an object\
    \ containing the current URL parameters.\n- useRouteMatch: Attempts to match the\
    \ current URL. The useRouteMatch component matches URLs, but it can do so without\
    \ rendering Route.\n\n# useHistory\n\nTo use the useHistory, assign the return\
    \ value of the useHistory hook to a new variable. The properties and methods of\
    \ the history object then become available through the new object:\n\n```\nconst\
    \ history = useHistory();\n```\n\n# useLocation\n\nThe useLocation hook works\
    \ the same as the useHistory hook. Create a new object from the returned value\
    \ of useLocation to gain access to the properties of the location object:\n\n\
    ```\nconst location = useLocation();\n```\n\n# useParams\n\nThe useParams hook\
    \ returns an object containing key/value pairs for each of the Route's params.\
    \ You can destruct the object to use individual params:\n\n```\nconst {orderNumber,size,color}\
    \ = useParams();\n```\n\n# useRouteMatch\n\nThe useRouteMatch hook attempts to\
    \ match the current URL in the same way that a Route component works, without\
    \ rendering anything. For example, if you have the following Route with a render\
    \ prop:\n\n```\n<Route\n  path=\"/order/:orderId\"\n  render={({ match }) => (\n\
    \    return <{match.path} />\n  )}\n/>\n```\n\nyou could gain access to the same\
    \ match object without rendering anything like this:\n\n```\nlet match = useRouteMatch(\"\
    //order/:orderId\");\n```"
