  md: "# LISTING 17-2: A Context for user preferences\n\n```\nconst PrefsContext =\
    \ React.createContext({lang: 'English',timezone: 'Pacific Time'});\n```\n\nYou'll\
    \ need to import the Context (PrefsContext in this case) into components where\
    \ you want to use it, it's common to put the createContext in its own module,\
    \ or in a module containing a Provider.\n\n# Creating a Provider\n\nA Context\
    \ Provider is a component that publishes changes to data to its descendant components.\
    \ The Provider takes an attribute named value, which overrides the default value\
    \ you set in React.create:\n\n```\n<MyContext value={some value here*}/>\n```\n\
    \nThe process for using a Provider is the same in function components and class\
    \ components. To use a Provider, wrap it around the component or components that\
    \ need access to it. To simplify your code and make reuse of a Provider easier,\
    \ it's common to create a higher-order component that renders a Provider and its\
    \ children, as shown in Listing 17-3.\n\n# LISTING 17-3: Using a Provider component\n\
    \n```\nimport React, {useState} from 'react';\nimport {PrefsContext} from './contexts/UserPrefs';\n\
    \nconst UserPrefsProvider = (( children )) => {\n  const [lang, setLang] = useState(\"\
    English\");\n  const [timezone, setTimezone] = useState(\"UTC\");\n  return (\n\
    \    <PrefsContext.Provider value={{ lang, timezone }}>\n      {children}\n  \
    \  </PrefsContext.Provider>\n  );\n};\n\nfunction App() {\n  return (\n    <UserPrefsProvider>\n\
    \      <Header />\n      <Main />\n      <Footer />\n    </UserPrefsProvider>\n\
    \  );\n}\n\nexport default App;\n```"
  merge: -1
