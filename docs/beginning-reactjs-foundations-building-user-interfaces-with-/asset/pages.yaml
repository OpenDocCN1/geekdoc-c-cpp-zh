    # BUILT-IN COMPONENTS


    React has built-components for the most used HTML elements and their attributes.
    There are also built-in components for Scalable Vector Graphics (SVG) elements
    and attributes. The built-in components produce output in the DOM and are the
    base for your custom components.


    # HTML Element Components


    React''s built-in HTML element components have the same names as elements from
    HTML5. Using them in your React app uses the equivalent HTML element to be rendered.


    Many React (and web application developers) tend to use the div element for every
    type of content in their user interfaces. While this is convenient, it''s not
    always recommended. HTML is a rich and descriptive language when used correctly,
    and using meaningful (aka semantic) HTML elements to mark your content more accessible
    for search engines and people well.


    Table 4-1 shows all the elements that React supports, along with a brief explanation
    of each element. If an element that you want to use in your user interface isn''t
    on this list, try to use it if it''s been added since this list was compiled.
    If it isn''t, you can submit a request to Facebook have the element added to React
    by filing an issue in the React github.com repository at https://github.com/facebook/react/issues/new.


