  md: "Listing 9-8 demonstrates how to use a ref to get the position of an element\
    \ and scroll to that element. Previous examples have used class components, so\
    \ I'll use a function component for this one.\n\n# LISTING 9-8: Scrolling to an\
    \ element with a ref\n\n```\nimport {useRef} from 'react';\nconst ScrollToElement\
    \ = ({ref})=>{window.scrollTo(0, ref.current.offsetTop)};\n\nfunction ScrollToDemo()\
    \ {\n  const bookStart = useRef();\n\n  return (\n    <h1 ref={bookStart}>CHAPTER\
    \ 1. Loomings.</h1>\n    <div style={{width:'300px}}><p>...</p></div>\n    <button\
    \ onClick={() => ScrollToElement(bookStart)}>\n      Scroll to the Beginning\n\
    \    </button>\n  );\n}\n\nexport default ScrollToDemo;\n```\n\n# SUMMARY\n\n\
    +   * What refs are and why they exist.\n* How to create refs in both function\
    \ and class components.\n* How to use refs to access component and DOM elements\
    \ from a parent.\n* What callback refs are and how to use them.\n* How to implement\
    \ basic versions of several of ref's use cases.\n\nIn the next chapter, you'll\
    \ learn about another highly debated and sometimes controversial aspect of React,\
    \ namely, how to apply style to React components."
