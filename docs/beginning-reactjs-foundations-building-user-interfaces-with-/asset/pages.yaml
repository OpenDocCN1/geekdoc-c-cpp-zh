  md: "# LISTING 12-10: Switching between multiple routes\n\n```\n<Switch>\n<Route\
    \ path=\"/\">\n  <p>home</p>\n</Route>\n<Route path=\"/aboutUs\">\n  <p>about\
    \ us</p>\n</Route>\n<Route path=\"/aboutUs/team\">\n  <p>meet the team</p>\n</Route>\n\
    </Switch>\n```\n\nIn this example, if the current URL is /aboutUs/team, only that\
    \ route will be rendered.\n\n# Rendering a Default Route\n\nSwitch can also be\
    \ used to render a default route when no other routes match. The default route\
    \ should be the last one, and a Route with no path can be used so that it matches\
    \ any location, as shown in Listing 12-11.\n\n# LISTING 12-11: Rendering a default\
    \ route\n\n```\n<Switch>\n<Route path=\"/\">\n  <p>home</p>\n</Route>\n<Route\
    \ path=\"/aboutUs\">\n  <p>about us</p>\n</Route>\n<Route path=\"/aboutUs/team\"\
    >\n  <p>meet the team</p>\n</Route>\n<Route>\n  <PageNotFound />\n</Route>\n</Switch>\n\
    ```\n\n# Routing with Redirect\n\nThe Redirect component can take a parameter\
    \ from that will be compared with the current URL and automatically redirect to\
    \ a new location if it matches. Any matched parameters specified by the from attribute\
    \ can be received by the to attribute by specifying them in both places. A Redirect\
    \ with a from attribute can only be used inside a Switch component.\n\nOne use\
    \ for a Redirect with a from attribute is in cases where more than one location\
    \ should match the same URL, or where the URL has changed. For example, in Listing\
    \ 12-12, the /users route will redirect to /user/list."
