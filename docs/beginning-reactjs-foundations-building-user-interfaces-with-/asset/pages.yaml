  md: 'When you click the Toggle Count button, the Counter component will disappear.
    However, the timer created by the setInterval function in the Counter component
    is never cleared, and so it continues to run after the component is removed.


    After the component is unmounted, React will log a message to a browser console
    to tell you that you''re attempting to call setState on an unmounted component,
    as shown in Figure 4-7.


    ![](img/532a93636824efa5dbcdf73782c1fac9_139_0.png)


    FIGURE 4-7: The result of attempting to call setState on an unmounted component


    Trying to call setState on an unmounted component won''t do anything, since an
    unmounted component doesn''t have state. But as React''s error message points
    out, it''s indicative of a memory leak.


    To fix this problem, you can use the componentWillUnmount method in the Counter
    component to call clearInterval, which will stop the timer before the Counter
    component is unmounted, as shown in Listing 4-33.'
  merge: -1
