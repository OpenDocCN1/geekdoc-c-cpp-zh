  md: "# Copying an Array with Spread\n\nJavaScript arrays are reference values. When\
    \ you use the = operator to make a copy of an array, the new array still has a\
    \ reference to the old one. Follow these steps to see the consequences of this:\n\
    \n+   1. Open the JavaScript console in Chrome.\n\n+   2. Create a new array,\
    \ such as the following:\n```let arr = ['red','green','blue'];```\n\n+   3. Use\
    \ the = operator to make a new array from the original one:\n`let newArr = arr;`\n\
    \n+   4. Add an element to the new array:\n`newArr.push('orange');`\n\n+   5.\
    \ Write out the value of the original array to the console:\n`arr`\n\nThe following\
    \ image shows the result, which is that adding new element to the copy created\
    \ using the = operator also changes the original array.\n\n![](img/532a93636824efa5dbcdf73782c1fac9_202_0.png)\n\
    \nAnother method to copy an array that doesn't reference the original one, is\
    \ to copy each element in the original array into a new array. The new array created\
    \ in this way is called a shallow copy. As everything in JavaScript, there are\
    \ several ways to make a shallow copy of an array. One way is by using a loop,\
    \ like this:\n\n```\nlet numbers = [1, 2, 3];\nlet numbersCopy = [];\n```\n\n\
    ```\nfor (let i = 0; i < numbers.length; i++) {\n  numbersCopy[i] = numbers[i];\n\
    }\n```\n\nAnother is to use the slice function. slice returns a shallow copy of\
    \ an array based on the start and end indexes you provide. If you call slice on\
    \ an array without passing any arguments in, it returns a shallow copy of the\
    \ whole array:\n\n```\nnumbersCopy = numbers.slice();\n```"
