  md: "continued\n\n# Higher-Order Components\n\nIn React, a higher-order component\
    \ is a function that takes a component and returns a new component. In the process,\
    \ it enhances the original component in some way. For example, in React Router,\
    \ the withRouter function returns a new component that has access to the history\
    \ object.\n\nTo use a higher-order function, you can define a normal component,\
    \ and then use the higher-order component to enhance that original component,\
    \ as shown in this example:\n\n```\nimport React from \"react\";\nimport { withRouter\
    \ } from \"react-router\";\n\nclass ShowLocation extends React.Component {\n\n\
    \  render() {\n    const { match, location, history } = this.props;\n\n    return\
    \ <div>You are now at {location.pathname}</div>;\n  }\n}\nconst ShowLocationWithRouter\
    \ = withRouter(ShowLocation);\nexport default ShowLocationWithRouter;\n```\n\n\
    In the preceding example, when you render a ShowLocationWithRouter component,\
    \ it will have access to the match, location, and history props from React Router.\n\
    \nTable 12-1 shows all the properties and methods of the history object.\n\n**TABLE\
    \ 12-1:** Properties and Methods of history\n\n| PROPERTIES AND METHODS | DESCRIPTION\
    \ |\n|--- |--- |\n| length | The number of location items in the history stack.\
    \ |\n| action | The current action (such as PUSH or REPLACE). |\n| location |\
    \ The current location. |\n| push() | Adds a new item to the history stack. |\n\
    | replace() | Replaces the current location on the history stack. |\n| go() |\
    \ Moves the pointer by the passed-in number of entries in the history stack. |\n\
    | goBack() | Go back one entry in the history stack. |\n| goForward() | Go forward\
    \ one entry in the history stack. |\n| block() | Prevents navigation. For example,\
    \ if the user clicks the Back button, block can be used to interrupt the navigation\
    \ to display a message or confirmation dialog. |"
