- img_proc: true
  md: 'The value of the to attribute can be a string (or an expression that evaluates
    to a string) or an object. If the to is specified as an object, the properties
    of the object are concatenated to create the destination location.


    # Linking with a String


    If you pass a string to the to attribute, it can be any valid path that you would
    normally use as the value of the href attribute of the HTML element. Any path
    you pass to the Link component will be used to update the browser location relative
    to the path of the app. Because using Link updates the URL relative to the app,
    the following example won''t work as you might expect:


    ```

    <Link to="https://chrisminnick.com">Link to my website</Link>

    ```


    Figure 12-4 shows what happens in the address bar when you click the preceding
    link in a React Router.


    ![](img/532a93636824efa5dbcdf73782c1fac9_339_0.png)


    FIGURE 12-4: React Router can''t be used for external linking


    If you want to link to an external site from a React app, just use the element.


    # Linking with an Object


    To use an object as the value of the to attribute, specify a combination of the
    allowed properties:


    +   - pathname: A string containing the path to link to.


    +   - search: A string containing query parameters (the question mark followed
    by the name=value pairs that form an HTML querystring).


    +   - hash: A string containing the hash symbol (#) followed by any values you
    want to provide to the destination route in the hash portion of the URL.


    +   - state: An object containing state that you want to persist in the destination
    state.


    For example, the Link component, when followed, will pass a path and querystring
    to the destination Route component:


    ```

    <Link to={{path: ''/orders'', search: ''?filterBy=new''}}

    View Orders

    </Link>

    ```


    # Additional Link Props


    The Link component can receive several optional props. These include replace,
    component, and pass-through props, which are discussed next.'
