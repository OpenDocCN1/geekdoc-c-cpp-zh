  md: "# Limiting Props to Certain Values or Types\n\nPropTypes.oneOf is a function\
    \ that tests whether the value of a prop is one of the specific items in a list.\
    \ To use it, pass an array of possible values into the之一 function, as shown in\
    \ Listing 6-13.\n\nLISTING 6-13: Using PropTypes.oneOf\n\n```\nimport PropTypes\
    \ from 'prop-types';\n\nfunction DisplayPrimaryColor(props) {\n  return(\n   \
    \ <p>you picked: {props.primaryColor}</p>\n  )\n}\n\nDisplayPrimaryColor.propTypes\
    \ = {\n  primaryColor: PropTypes.oneOf(['red', 'yellow', 'blue'])\n}\n\nexport\
    \ DisplayPrimaryColor;\n```\n\nWith the oneOf validator, you can check whether\
    \ the value of a prop is one of a list of data types. To use it, pass an array\
    \ containing the allowed data types, using names of PropTypes's data validators:\n\
    \n```\nComponent.propTypes = {\n  myProp:PropTypes.oneOf(\n    PropTypes.bool,\n\
    \    PropTypes.string,\n    PropTypes.number\n  )\n}\n```\n\n# Additional Validators\n\
    \nPropTypes.arrayOf tests that the prop is an array in which each of the elements\
    \ matches a prop-type:\n\n```\nMyComponent.propTypes = {\n  students: PropTypes.arrayOf(\n\
    \    PropTypes.instanceOf(Person)\n  )\n}\n```\n\nPropTypes.objectOf tests that\
    \ the prop is an object in which each of the properties of the object match a\
    \ provided type:\n\n```\nMyComponent.propTypes = {\n  scores: PropTypes.objectOf(\n\
    \    PropTypes.number\n  )\n}\n```"
  merge: -1
  pgno: 183
- img_proc: true
  md: "PropTypes.shape tests whether a prop is an object containing specific properties:\n\
    \n```\nMyComponent.propTypes.shape = {\n  userData: PropTypes.shape({\n    id:\
    \ PropTypes.number,\n    fullname: PropTypes.string,\n    birthdate: PropTypes.instanceOf(Date),\n\
    \    isAdmin: PropTypes.bool\n  });\n```\n\nPropTypes.exact performs a strict\
    \ match on the prop, meaning that it must include only the specified properties,\
    \ each of which must pass its validation:\n\n```\nMyComponent.propTypes = {\n\
    \  toDate: PropTypes.exact({\n    description: PropTypes.string,\n    isFinished:\
    \ PropTypes.bool\n  });\n```\n\n# Creating Custom PropTypes\n\nIf you want to\
    \ validate it is not covered by any of the built-in validators, you can create\
    \ your own. A custom validator is a function that will automatically receive three\
    \ arguments when it's used:\n\n+   - An object containing all of the props received\
    \ by the component.\n- The prop being tested.\n- The name of the component.\n\n\
    In a custom prop, you can write the Error object that is returned when the validation\
    \ fails. For example, you might write a custom validator to check whether a prop\
    \ is a 10-digit phone number, as shown in Listing 6-14.\n\n> LISTING 6-14: Using\
    \ a custom validator to test for a phone number\n\n```\nimport PropTypes from\
    \ 'prop-types';\n\nfunction Contact(props) {\n  return(\n    <li>{props.fullname}:\
    \ {props.phone}</li>\n  );\n}\n\nconst isPhoneNumber = function (props, propName,\
    \ componentName) {\n  const regex = /^(\\d|1[2-9])\\(?\\d{3}\\)?[[-.]\\d{3}[-.]\\\
    d{4}$/;\n\n  if (!regex.test(props[propName])) {\n    return new Error(`Invalid\
    \ prop ${propName} passed to ${componentName}.`);\n  }\n  Expected a phone number.;\n\
