    \ you bind the function inside the value of the event listener attribute, as shown\
    \ in Listing 7-10.\n\n# LISTING 7-10: Binding an event handler inline\n\n```\n\
    import (Component) from 'react';\nclass ColorWheel extends Component {\n  constructor(props)\
    \ {\n    super(props);\n    this.state = {\n      currentColor: '#ff0000'\n  \
    \  }\n  }\n\n  changeColor(e) {\n    this.setState({currentColor:e.target.value});\n\
