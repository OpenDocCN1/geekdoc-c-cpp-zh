  md: "# Controlling a Select Element\n\nA select element in HTML creates a dropdown\
    \ list, with any number of option element children forming the items in the dropdown\
    \ list. In HTML, each option element has a Boolean attribute named selected, which\
    \ determines the current value of the select element, as shown in Listing 8-12.\n\
    \nListing 8-12: A select element in HTML\n\n```\n<select name=\"pizza-type\">\n\
    \  <option value=\"thin\">Thin Crust</option>\n  <option value=\"thick\">Thick\
    \ Crust</option>\n  <option value=\"deep\">Deep Dish</option>\n  <option value=\"\
    detroit\" selected>Detroit-style</option>\n  <option value=\"chicago\">Chicago-style</option>\n\
    </select>\n```\n\nIn React, the select element has a value attribute that determines\
    \ which option is currently selected, and the onChange attribute on the select\
    \ input is used to detect and handle changes to the currently selected option,\
    \ as shown in Listing 8-13.\n\nListing 8-13: Using a select input in React\n\n\
    ```\nfunction SizeSelect(props) {\n  return (\n    <select name=\"size\" value={props.size}\
    \ onChange={props.changeSize}>\n      <option value=\"xs\">Small</option>\n  \
    \    <option value=\"sm\">Small</option>\n      <option value=\"md\">Medium</option>\n\
    \      <option value=\"lg\">Large</option>\n      <option value=\"xl\">Extra Large</option>\n\
    \    </select>\n  );\n}\n\nexport default SizeSelect;\n```\n\n# PREVENTING DEFAULT\
    \ ACTIONS\n\nWhen you submit a form in a browser window, the default action that\
    \ the browser will take is to reload the current page, passing the values from\
    \ the form as a querystring appended to the URL. You can change the default action\
    \ of the form element by using the action and method attributes of the form element.\
    \ The action attribute changes the URL that the form will submit to, and the method\
    \ changes the HTTP method used to submit the form (either HTTP GET or HTTP POST)."
