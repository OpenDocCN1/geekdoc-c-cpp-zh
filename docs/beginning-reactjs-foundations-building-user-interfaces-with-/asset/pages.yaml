    memoization.


    > setState IS NOT setState

    Another important point to keep in mind (which we''ll discuss in more detail shortly)

    is that the function returned by useState (which I named setState in Listing 6-24)

    does''t work as a class component''s setState function. In short:

    setState in a class member merges objects, while the setState function

    returned by useState replaces the value of the stateful variable.


    # The Difference between state and props


    Props and state look similar at first glance:


    +   * They are both JavaScript objects.

    * Changes to each of them cause components to update.

    * Both are data that are used by a component to generate HTML output of the component.


    The differences between props and state are in their roles.

    The basic difference is that the props object is passed to a component by its
    parent, while state is managed within a component.


    To put it another way, props is similar to a function parameter, while state is
    similar to a local (private) variable defined inside the function. You can pass
    values from the state of a parent component to a child component (where they become
    part of the props object), but a component cannot modify the state of its children.


    TABLE 6-1: Comparing props and state


    | PROPS | STATE |

    |---|---||

    | Is it passed from the parent? | Yes | No |

    | Can it change inside a component? | No | Yes |

    | Can it be changed by the parent? | Yes | No |

    | Can it be passed to child components? | Yes | Yes |


    # Updating state


    Once the initial state of a component has been set and the component has been
    rendered, updates to the component (and to its children, if it has any) happen
    when the state changes.'
