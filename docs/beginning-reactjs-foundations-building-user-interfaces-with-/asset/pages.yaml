  md: "# Using Children in JSX\n\nThe return statement in a React component can only\
    \ return one. This one thing can be a string, a number, an array, a Boolean, or\
    \ a single JSX element. Keep in mind, however, that a single JSX element can have\
    \ many children as you like. As long you start and end your return statement with\
    \ a matching opening tag and closing tag, everything in between (provided that\
    \ it's valid JSX or a JavaScript expression) is fine.\n\nHere's an example of\
    \ an invalid JSX return value:\n\n```\nreturn(\n  <MyComponent />\n  <OtherComponent\
    \ />\n);\n```\n\nOne way to make this valid JSX return value is to wrap two elements\
    \ with another element, like this:\n\n```\nreturn(\n  <div>\n    <MyComponent\
    \ />\n    <OtherComponent />\n  </div>\n);\n```\n\nWith the div element wrapping\
    \ the two user-defined elements, we now have a single element being returned.\n\
    \n# React Fragments\n\nAlthough it's common to see multiple elements wrapped with\
    \ a div element or another element for the purpose of returning a single JSX element,\
    \ adding div elements just for the sake of eliminating errors in your code, rather\
    \ to add necessary meaning or structure to your code, create code bloat and decreases\
    \ the accessibility of your code.\n\nTo prevent the introduction of unnecessary\
    \ elements, you can use the built-in React.Fragment component. React.Fragment\
    \ wraps your JSX into a single JSX element, but doesn't return any HTML.\n\nYou\
    \ can use the React.Fragment component in one of three ways:\n\n+   1. By using\
    \ dot notation: <React.Fragment></React.Fragment>\n2. By importing Fragment from\
    \ the react library using curly braces\n3. By using its short syntax, which is\
    \ just a nameless element: </>\n\nListing 3-14 shows how to use React.Fragment\
    \ in a component.\n\n```\nimport {Fragment} from 'react';\n\nfunction MyComponent()\
    \ {\n```"
