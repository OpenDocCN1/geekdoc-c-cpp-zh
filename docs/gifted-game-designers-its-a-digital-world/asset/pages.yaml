  md: '# GLOSSARY


    **animation**–a process involving a projected series of drawings that appear to
    move due to slight changes in each drawing.


    **arcade**–an amusement center where people play coin-operated games.


    **augmented**–made greater, larger, or more complete.


    **available**–able to be had or used.


    **cartridge**–a case or container that you put into a machine to make it work.


    **code**–a set of instructions for a computer. Writing code is called coding.


    **craze**–something that is very popular, often for a short time.


    **dialogue**–a written conversation between two or more characters.


    **download**–to transfer data from a computer network to a single computer or
    device.


    **environment**–surroundings.


    **graphic**–of or relating to visual arts such as painting and photography.


    **graphics**–pictures or images on the screen of a computer, smartphone, or other
    device.


    **hardware**–the physical parts of a computer.


    **insert**–to put in or into.


    **market**–to advertise or promote something so people will want to buy it.


    **missile**–a weapon that is thrown or projected to hit a target.


    **mobile**–capable of moving or being moved.'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'online –connected to the internet.


    rotary–turning around a central point like a wheel.


    script–the written words and directions used to put on a play, movie, or television
    show. A person who writes scripts is a scriptwriter.


    software–the written programs used to operate a computer.


    specialize–to pursue one type of work, called a specialty.


    subscribe–to agree to receive a publication and pay for it if it is not offered
    for free.


    technology (tehk-NAH-luh-jee)–machinery and equipment developed for practical
    purposes using scientific principles and engineering. Something related to technology
    is technical.


    template–a computer document that has the basic format of something and that can
    be used many different times.


    3-D–three-dimensional. Having three dimensions, such as length, width, and height.
    Something that is three-dimensional appears to have depth.


    version–a different form or type of an original.'
  merge: -1
  img_proc: true
