- - '##'
  - 常见公式错误
- - '###'
  - '#NAME - 最常见的错误之一是 #NAME。Excel 无法找到你尝试使用的函数。很可能发生是你拼写错了函数名。也许你打成了 `CONUTIF` 而不是
    `COUNTIF`。或者你在其他地方有语法错误。另一个出现此错误的原因是你引用了旧版本的高级函数。'
- - '###'
  - '#DIV/0 - 尽管你有此，Excel 也除以零。在某处有两个单元格除法（听起来像生物），发现这个错误快的方法是寻找除号，然后分母。'
- - '###'
  - '#VALUE - 你的参数有问题。函数期望逻辑操作，而你输入了一个字符串。或者你在函数中漏了必要的参数。'
- - '###'
  - '#NUM - 这通常很容易。公式期望数字，但得到的是文本。'
- - '###'
  - '#REF - 这很烦人。Excel 尝试寻找一个不存在的单元格。'
- - '###'
  - '#N/A - 这是所有中最讨厌的，是一个“通用”错误，没有任何意义。你可能查找左侧的一列。'
