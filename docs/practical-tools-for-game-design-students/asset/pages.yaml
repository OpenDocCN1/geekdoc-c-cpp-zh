  md: '# Chapter 13 - Probability Tools - 173


    It is one of the things we checked to make sure our probability tree was solid
    above.


    Say you are playing an MMORPG like World of Warcraft and you want some Super Loot
    Drop that the Ugly Monster drops. This item drops 20% of the time. If you kill
    the Ugly Monster five times, what are the odds that you still won''t have the
    Super Loot Drop?


    There is little we can do with the 20% as if. If we multiply 20% together five
    times, we would be getting the probability of dropping all five times. The naive
    user would say 0.2 * 5 = 1 so we are guaranteed to drop the loot! But since we
    know the trick, we change this formula around:


    P(Not Dropping on Kill 1 and Not Dropping on Kill 2 and Not Dropping on Kill 3
    and Not Dropping on Kill 4 and Not Dropping on Kill 5).


    These are all independent. Whether or not the loot drops does not factor in whether
    the user got the loot in a previous kill. We know the probability of loot not
    dropping thanks to our trick: 1 - 0.2 = 0.8.


    P(Not Dropping All Five Times) = 0.8 * 0.8 * 0.8 * 0.8 * 0.8 = 0.3276 or 32.76%.


    A designer who wants it to be likely to have dropped the loot after five battles
    will need to raise the drop percentage!


    # More on Statistics


    There are a number of topics in probability and statistics that are valuable for
    designers to know. Variance, normal distributions, power law distributions, and
    statistical inference are just four topics that the aware designer should understand.
    Here''s the super high-level overview of each to whet your appetite to go off
    and learn more:


    Variance can be used to describe the spread of a variable. Say you are rolling
    five six sided dice versus rolling thirty sided die (yes, they have those!) Much
    like the bar charts above, the 30-sided will have a flat distribution. There will
    be as many as 3s as there will be 15s (the average result). With the handful of
    six-sided dice, the 15 result will be much more likely than a 3 (try it!). Thus,
    we say that the one result has higher variance or spread. If a designer wants
    to group a value around some range, he or she needs to use a method that has a
    low variance.'
