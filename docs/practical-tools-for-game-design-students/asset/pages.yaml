- img_proc: true
  md: '# Chapter 11 - Excel Crash Course - 123


    default behavior. If you want to change it so that functions calculate only when
    you say to, go to Excel’s preferences and look for the Calculation options where
    you can switch this to “Manual”. In that case, it will only recalculate when you
    hit F9 (or Cmd+= on).


    So you have a very precise decimal, but that is not often useful. Random numbers
    are great for generating die rolls, but when you roll a die, you don''t get 0.20351
    as a result. You get some integer between 1 and 6. There are two ways to fix this.
    In most programming languages, you must multiply the random 0-1 number by the
    largest number in your range and add one. Then you truncate the result. In Excel,
    I have already gone over the tools to do this. A die roll from 1 to 6 would look
    like this:


    ```

    =TRUNC(6*RAND()+1)

    ```


    That''s ugly though, so Excel gives you a function to simplify the process called
    RANDBETWEEN. It requires two arguments, a lower bound and an upper bound. Your
    1 to 6 die roll becomes:


    ```

    =RANDBETWEEN(1,6)

    ```


    Much easier.


    # =CONCATENATE(Cells)


    Concatenate is what is called a string function because it evaluates text which
    programmers call “strings”. Concatenate takes two strings (bits of text) and shoves
    them together. If you have last names in column A and first names in column B
    and want to put them together in column C with a space between, you would do this:


    ```

    =CONCATENATE(A1," \ , B1)

    ```


    Concatenate can take as many strings as you wish to supply it. You may be wondering
    what the second argument is. It is telling Excel to put a single space between
    the first and last name. If you only did =CONCATENATE(A1,A2), you would get results
    like JohnDoe, JaneDoe instead of John Doe, Jane Doe.


    return 1.'
