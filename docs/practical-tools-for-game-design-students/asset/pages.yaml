    played games from other genres. How will you know about features that may eventually
    creep into your genre without exposure? What is going on in matchmaking for leagues
    in sports games may become relevant for real-time-strategy games.


    I have often said that the best examples for growth in being a designer is to
    play bad games and endeavor to understand why they are bad. By identifying features,that
