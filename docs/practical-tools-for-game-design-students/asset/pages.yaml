    To delete a column, hover over the top border of the column you are looking to
    remove. Your cursor will change to a downward facing arrow. Right click and select
    the “Delete Column” menu item. You can delete multiple columns by dragging with
    the cursor changes and selecting multiple columns.


    # Formatting


    Table cells can be formatted like any other piece of text in Word. You have your
    choice of coloring, font size, whatever. In a game design document, it is recommended
    to stick with a single sans serif font (unless you are writing code within a game
    design document for some reason, in which case use a mono-spaced font). Use color
    sparsely and only to highlight important information. Too much color can be distracting
    when your goal is clarity.'
