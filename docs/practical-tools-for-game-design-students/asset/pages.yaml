    # Pacism


    One of the things that Powerpoint and Keynote make it so easy to do is to create
    a text box and litter it with bullet points. The default template on both assumes
    this is what you will do. The problem with bullet points is if you summarize your
    argument on screen your audience won''t listen to the full explanation. They will
    just file away the bullets as the argument. Try to avoid using bullet points.
    Instead use evocative images to accompany your points with relative facts in your
    speaker notes. In the above slide about power usage, I show a particularly egregious
    electricity user. This frames the discussion when I start talking about how much
    the average user uses in a neighborhood versus the energy “hogs”. The average
    presenter would just put the argument on the screen, leaving little reason to
    have the presentation at all.


    Lists are perfectly fine without bullets. Just create text boxes without the telltale
    circles. Separate text boxes also allow you to use appear transitions to show
    one at a time (which we will cover later) in a method similar to the'
  merge: -1
  pgno: 257
- img_proc: true
  md: 'bulleted list.


    # Links


    To add a hyperlink, select text in a text box or an image and either press Control+K
    or select Hyperlink from the Insert menu. This is fairly straightforward. Use
    of links is really only recommended if you are presenting about the features of
    a website and want to interrupt the presentation to jump to that website to show
    functionality. Links as a bibliography are useless if the slides won''t be distributed.


    Additionally, you can use links to direct to a file on your hard drive. This is
    useful if you are directing to a file for an external program that cannot be directly
    embedded in the presentation. For instance, I have done this for Flash SWF files.


    Usually it looks better to create an image and attach the hyperlink to that versus
    doing the same to text.


    # Video


    It is quite popular in the video games industry to provide embedded video in presentations.
    This is helpful if you are talking about a feature or competitor and want a moving
    image of the topic going on behind you.


    First, be well aware that this will not embed the file itself into the Powerpoint
    presentation as it does with fonts (see Fonts below), you should keep the video
    files in the same folder as the presentation or some versions Powerpoint may have
    trouble seeing it.


    You insert video by (oddly enough!) going to the Insert tab and selecting “Video".'
  merge: -1
