  md: '# Microsoft Visio


    Microsoft has a specialized program designed from the start with diagramming in
    mind. That software is called Visio. Unfortunately Visio is not free and not included
    in the standard Office distribution, but it is a very popular piece of software
    you may find preinstalled on many work computers. I show an alternative in a later
    section.


    Visio is popular largely due to its versatility and ease of use. Elements of your
    diagrams can be moved around and connecting arrows stay attached and position
    themselves automatically. Visio supports a number of complicated use cases: data
    links, macros, browser operability, et cetera. Designers rarely have use for these
    advanced features. Most often, we want to construct an attractive and useful diagram.


    # Flow Diagram


    One of the most common diagrams designers are tasked with making is the flow diagram.
    A flow diagram describes visually the behavior of system. Perhaps your UI engineers
    want to understand the designer''s vision for the "front end" or the menu system
    that players first see. This could be described in a big wall of text or a designer
    can create a flow diagram.


    Which is more readable?


    > First, the user is presented with the Nintendo boot screen. This lasts three
    seconds. Then the publisher''s splash screen is shown for five seconds with the
    standard animation. Then, the licensor''s legal screen is shown for three seconds
    with the ESRB logo. Next, we show the Press Start screen that leads to the main
    menu, which has five options: New Game, Continue Game, Online Game, Settings and
    Credits. Pressing New Game leads the user to the Character Select screen... (I
    can go on, but the image below will encapsulate this and more in a much smaller
    space.)'
