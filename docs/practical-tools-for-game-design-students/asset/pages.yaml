  md: '# Preface


    Game design is an esoteric field. Whereas most members of a more traditional field
    (say electrical engineering) take the same classes in school, follow the same
    career paths and generally have the same skill sets, game designers are a much
    more mixed breed. We have degrees in: English, Cognitive Science, Art, Digital
    Media, Film, Philosophy, Math, Statistics and, (of course) Computer Science and
    many others. My undergraduate degree was in Information Systems. Only recently
    has game design itself been deemed a worthy field of study and as such you are
    seeing more and more game design programs popping up all across the world.


    The reason for this divergence is the nature of the field itself. Game design
    can encompass elements of all those fields listed above and more. Designers may
    use art skills to craft level geometry, English skills to write a document or
    script dialogue, statistics to calculate probabilities and computer science to
    describe a behavior all in the day. They use psychology to understand how players
    will make decisions and economics to understand how these decisions will affect
    a system. Modern game designers need to be renaissance men and women.


    But each of these disciplines in the present day also carry with it a number of
    software packages that assist the designer in pulling that entera into a final
    product. Some of you may already be familiar with; very few students lack at basic
    experience with a word processor. Some you may have seen in passing; slide presentation
    software is becoming more and more prevalent in secondary education. Some I would
    be very surprised to hear wide use of at the student level; students do not often
    use mind mapping software and bug trackers. In this book we will cover a variety
    of tools that the modern designer will use in industry.


    This book is primarily for students entering game design programs or for those
    looking for a broad exposure to tools used by game designers. When I say “game
    designer” in this book I generally refer to folks making digital games in a corporate
    environment. Of course, this is not the only kind of game designer. As I write
    these board games I am enjoying a popular resurgence thanks to the fertile European
    market for advanced board games. I would be remiss to note that many developers
    of digital games are independent coders/artists/designers who do not work in a
    corporate environment at all. Hopefully, this book holds something of use for
    these'
  merge: -1
