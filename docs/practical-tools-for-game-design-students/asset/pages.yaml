  md: '# Tables


    In our multitask-driven society, we no longer read from the start of an article
    to the end. Even you, in reading this book, probably dart around from topic to
    topic, image to image, looking to skip information you know and direct yourself
    towards information that is new. This is partially why our first design document
    (the Chili Cookoff) was broken up into sections with headers. Perhaps one developer
    will be doing the pre-event side while another will be doing the event itself.


    We have a nice start to a game design document, but right now it is just a wall
    of text. We are going to break up the text with some tables.


    Tables are extremely common methods to cordon off data from instructions. Why
    would you want to do that? Are not both instructions and data important? Yes,
    they are. But data changes quite oftenen and is a cut-and-paste job while instructions
    require unique bits of code. Developers generally like to see code separated from
    content because the content can be anything as long as the code works.


    In the Chili Cookoff GDD, there are two sections that jump right out as interspersing
    code with content: the scoring system and the rewards system.


    # Page Break


    First, add a page break to separate the sections of the document. To do this,
    just position your cursor at the spot you want the page break and press Control+Enter.
    Breaking up your sections into their own individual pages helps up the feel of
    the "wall of text". It makes your document physically longer, but if you are printing
    out the GDD then you are ignoring the iterative nature of the GDD. It changes
    all the time! Don''t print out your GDDs!


    # Plan Your Table


    Before you go dropping tables in willy-nilly, think ahead to what you want to
    do. In the table that explains scoring, we will want a row for each element that
    is scored (looking on the GDD, we see three of these). We will want a column for
    the title of each and a column for the value. In some tables you will want to
    budget an additional row for a header, but that is not needed in our small table.'
