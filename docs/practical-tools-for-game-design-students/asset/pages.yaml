  md: '272 - Practical Tools for Game Design Students


    # # Printing Presentations / Handouts


    Many presenters will put everything they want to say on their slides. Presenters
    who see themselves as more savvy will put what they the want to say in their notes
    and hand the slides and notes out to their audience beforehand. Unfortunately,
    this is just as bad as reading your slides aloud.


    Never just print your slides and give them to your audience.


    Again, remember: your audience can read faster than you can talk. If you think
    there is value to what you are presenting, then you are going against your purpose
    by handing out slides or notes beforehand. The audience will spend their time
    flipping ahead in the notes instead of hearing your pitch.


    But often handouts are expected. There are three ways to handle this:


    +   1. Buck the trend.


    +   Abain from giving out handouts at all. This is risky. Do you have a message
    that you want your audience to take home with them? By not giving handouts, you
    put a lot of pressure on delivering a message that sticks in their warm, mushy
    brains. You will only have that one chance to convey your message.


    +   2. Give the standard handouts, but give them after your talk.


    +   In your print settings, you can direct Powerpoint to print out “handouts”
    that consist of your slides and notes. But this too has껏. If you are part of a
    string of presenters, you may not have the audience''s attention when you try
    to give your handouts. Since your slides are useless without your narration and
    your notes are for you personally, this presentation format will likely be hard
    to comprehend.


    +   3. Create a separate handout document.


    +   This I consider to be the best solution in cases where handouts are expected.
    Create a document that effectively gives your argument without you present. Include
    supporting charts and/or pictures. Write this as if it were a magazine article.
    It needs to be concerned with flow just like your'
  merge: -1
  pgno: 273
- img_proc: true
  md: 'presentation proper because it needs to sell your ideas just as hard as your
    presentation. Try your best to fit your argument and support on one page if possible.
    Include your contact information if your audience has questions or wants to connect.
    The only major caveat to this system is that it takes more time to create three
    sets of supporting materials: your slides, your notes and their handouts.


    But by going the extra mile with your preparation, you will not only be ensuring
    that your audience leaves with your idea firmly understood, but also that you
    will be fully prepared having gone through the idea''s presentation in two wholly
    different ways. Once you finish the handout, you should know your argument inside
    and out.


    Imagine the audience''s relief; they have just sat through a presentation that
    takes forever, they''ve paged through the speaker''s handout five times, checked
    their phones nine times and are watching the speaker struggle with reading his
    slides aloud and making his text animations trigger properly. Then you come on
    stage! Your message is clear and concise and you don''t waste the audience''s
    time. Your ideas are presented in a novel way and the key points are enumerated
    on an attractive handout. Given the same quality of ideas, which one will your
    audience be more excited about?'
  merge: -1
