  md: '# Chapter 9 - Adobe Photoshop / 2D Image Manipulation - 97


    Select the “Magic Wand” tool from the toolbar.


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_98_0.png)


    The Magic Wand will select a range of pixels that, to the best of its knowledge,
    are connected. Any drastic change of color serves as a boundary. This allows you
    to select large contiguous pieces irregular in shape without the difficulty posed
    by cutting them out with the Lasso tool.


    At the top of the screen, you should see a text box indicating “Tolerance”. A
    higher tolerance will select more of the image, ignoring smaller changes in color.
    A low tolerance will exclude any color that is not extremely close to where the
    magic wand tool first selected. For each image, you will likely have to experiment
    with the tolerance number to get your desired results.


    For this example, we are using a tolerance of 4. This means the magic wand will
    only create a border at sharp changes of color from the original selection. When
    each section you want to delete is selected, hit the Delete key or go to Clear
    in the Edit menu.


    The guesses of the Magic Wand are not perfect. Often, you will need to touch up
    a selection by using the Eraser tool afterwards to eliminate some spaces that
    were not selected by the Magic Wand.'
