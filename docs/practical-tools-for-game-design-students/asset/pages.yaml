  md: '# Aside: More Ways To Connect


    Obviously, there are more ways to connect with other aspiring developers and employers
    than what I can enumerate in this book, but here are some more:


    # IGDA


    The International Game Developers Association is the largest advocacy group in
    the world for game developers. It consists of a board of directors and special
    interest groups at the global level and hundreds of distinct chapters at the local
    level. IGDA local chapter meetings can be a good way of finding out what is going
    on in the employment market in your particular area and is a cheap alternative
    to schmooing at a conference.


    # Game Jams


    The Global Game Jam was an initiative of the IGDA started in 2008. The idea is
    to bring together game developers of all walks of life into impromptu teams, present
    them with a prompt and have them feverishly work to create a game in forty-eight
    hours. The jams foster creativity, allow students and developers to practice their
    skills and serve as a way to meet fellow enthusiasts and professionals. Tens of
    thousands of jammers have participated since the start of the program yielding
    over a thousand finished games.


    It is easier to participate in the Global Game Jam if you live in an area with
    a lot of students or developers, but jammers can even participate remotely in
    many cases. For more information, go to the Global Game Jam site at globalgamejam.org


    # Contests


    Much like the idea behind the Global Game Jam, contests can be a great way to
    create real material that can be shown to potential employers. Finding contests
    can take a little more work. The Independent Game Source'
  merge: -1
