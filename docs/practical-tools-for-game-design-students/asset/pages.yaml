    I haven''t seen one out in the wild, but I have heard about many instances of
    these. If you are putting a game on your card, then let be: 1) fantastic in design,
    2) playable in time at all with no extra effort or materials, and 3) memorable.
    Just putting a game on your card is of no use unless it is spectacular, otherwise
    you are showing people that you don''t know how to design games. An at-least-we-tried
    is not particularly wowing.


    I am sure there is a memorable business game card out there somewhere, but I have
    never seen it. How about just putting a link to your game''s on the web that is
    already awesome?


    # The Printed on Your Home Ink-Jet Printer Card: “I''m not doing so well.”


    My parents have instilled in me very powerful lessons on saving money for the
    lean times. Nonetheless, there have been times when I have been broke as a joke.
    You may desire to print some cards on whatever thick paper you have in the department.
    Stop. These cards generally bend and crease fall apart in people''s pockets. There
    are usually coupons for Overnightprints.com or Vistaprint where you can get professional
    weight cards for very little cost. (Don''t get the free Vistaprint ones.) If you
    go the cheap route, you end up looking kind of pathetic, even if you are kind
    of pathetic (and we have all been there).


    # Too Much Text: “My design documents will be impossible to parse.”


    If you have no negative space on your card, if you try to cram as much info as
    possible into those few square inches, I am just assuming that you put five hundred
    words on each Powerpoint slide and fill your design'
