  md: '# Chapter 22 - The Many “Don’ts” Of Powerpoint - 231


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_232_0.png)


    Figure 22.4 - Which is more readable?


    As a bonus, things that stand out from a list are easier to remember as well.
    It is called the von Restorff effect. Be careful when using this, however. If
    everything stands out, then nothing does. Use contrast for emphasis.


    # 7. Don’t Use Transitions


    Transitions are really slick looking. You can make it look like your slides are
    all on a cube and then the cube rotates when you advance! Unfortunately, this
    is all style and no substance. Not only does it artificially stretch the length
    of your presentation while you wait for the spinning text to settle into place,
    it provides no information. Using the transitions that come with slideware is
    a surefire way to get eyes roll in your audience. I feel confident saying that
    no one in this millennium has ever said: “Did you see those rotating text bits
    in his presentation? That presenter knows what he/she’s talking about!”


    There is one exception where I find transitions wonderfully useful. The appear/disappear
    transition used on text and images can save time and space when used properly.
    I talk more about that in the section about transitions later.


    # 8. Don’t Use Sound Effects


    Unless your presentation is literally about sound, there is no reason to use sound
    effects in your presentation. Some see it as witty and cute, but most will see
    it as attempting to focus on shine instead of substance.


    Other than that, focus on the message not on multimedia tricks. We will discuss
    sound and video later.'
