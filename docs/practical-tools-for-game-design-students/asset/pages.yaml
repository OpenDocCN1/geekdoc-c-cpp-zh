  md: '# Chapter 7 - Wikis - 83


    # Chapter 7 - Wikis


    Wikis are becoming a larger force in game design creation for a simple reason.
    Where word processors are built around the single-writer-leads-to-printed-page
    paradigm, wiki software has been built around the idea of multiple users with
    constantly changing documents in a digitally literate realm. Multiple users, changing
    documentation, digital literacy... sounds a lot like game development.


    If you''ve used Wikipedia, you used a wiki. Wikipedia is powered by the open-source
    MediaWiki software. MediaWiki can be installed on any server that has PHP and
    a compatible database backend. Editing wikis is as easy as browsing a website,
    making a wiki-based design document system significantly cheaper than a system
    where every user needs to have Microsoft Word.


    Wikis are vastly different from the current Word hegemony that exists in industry


    # Benefits of Wikis


    Internal Version Control - Wikis easily allow users to compare previous versions
    of a document. As you can see from kludgy suggestion I gave in the Comments and
    Tracking section, easy viewing of changes is a significant boon. Need to roll
    back to the version before the Big Design Change? That''s just a few clicks.'
