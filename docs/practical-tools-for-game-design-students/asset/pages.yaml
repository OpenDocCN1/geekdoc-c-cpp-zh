    (10 * 2/3) inches from left vertically and 2.08 inches (6.25 * 1/3) and 4.16 (6.25
    * 2/3) inches vertically from the top.


    If your cursor changes inches from the left when you drag your guides, you can
    skip to the next paragraph. If your number is inches from center, then you need
    to do a little more math. The 0 on your cursor is actually at the 5-inch mark
    (10 / 2). So we need to change the above numbers to compensate. 3.33 – 5 = -1.67
    or 1.67 inches left of the 0. 6.67 – 5 = 1.67 inches right of center. The horizontal
    guide is also counting from the middle, so it sits at 3.125 inches (6.25 / 2).
    Thus our guides need to be 2.08 – 3.125 or –1.04 or 1.04 inches above center.
    The other guide will be at 1.04 inches below center.


    | General 16:10 | On 10" x 6.25" |

    | --- | --- |

    | Left Guide | -Width/6 | -1.67 |

    | Right Guide | +Width/6 | +1.67 |

    | Top Guide | -Width/6 | -1.04" |

    | Bottom Guide | +Width/6 | +1.04" |'
  merge: -1
