    # Adobe Flash


    Of course, everyone has played Adobe Flash-based games on the web and thus Flash''s
    near-universal support on the web and devices (iOS notwithstanding) makes it one
    of the more recognized development environments.


    But Flash''s industry use doesn''t stop at Kongregate.com or Facebook “social”
    games. Flash is used extensively for prototyping purposes in the AAA section of
    the industry and is even used in shipped titles for user interface. EA Sports''
    titles have used an interpreted version of Flash for many years. Other studios
    still use Flash for HUD and UI elements. With the ascendancy of Autodesk''s Scaleform,
    Flash''s hegemony in this area is waning.


    Flash was originally developed as an vector-based animation tool. The default
    view shows a “timeline” with “frames” and much of the nomenclature supports that.
    Flash ships with a proprietary scripting language called ActionScript that was
    originally a barebones way to script animation sequences. This has since evolved
    into a full gaming-caliber scripting language capable of texture mapping, GPU
    rendering and other cutting-edge features. With ActionScript 3.0, even basic users
    never have to touch the timeline and can code a game completely from script.'
