  md: '# Chapter 21 - Pitching Ideas - 221


    # Plan Ahead


    Preparing a presentation is not about throwing some junk into a slide-making program
    and reading it off. To be successful you must prepare.


    # 1. Design Your Flow


    Most presenters put words and images into slides in the order they think of them
    and then present that way. Maybe they follow someone else''s template. Both these
    methods are insufficient. Later, we will look at the Slide Sorter in Powerpoint
    as a tool to visualize the flow of your talk. It should have a beginning, middle
    and end. It should reiterate your point and illustrate the gap between what-is
    and what-could-be.


    # 2. Anticipate Objections and Deflate Them


    Maybe you will be lucky and you will present to a smiling, attentive audience
    who loves your ideas at face value. It has never happened to me. Imagine your
    harshest critic sitting in the corner, interrupting you on every point. That man
    or woman might be there. Prepare yourself.


    > Thriller author Barry Eisler says: "All effective personal protection, all effective
    security, all true self-defense, is based on the ability and willingness to think
    like the opposition."


    Know the weak points of your argument and address them before the objections come
    up. Most people do not do this because they are either so tied up in your argument
    that they cannot see the other side or are too afraid of pointing out problems
    that they think will be helping to damn their cause. As long as your responses
    to these objections are sound, you will look highly prepared (because you will
    be) and the rest of your presentation will take on additional gravitas.


    This is a hard thing to do on your own, so share your presentation with coworkers
    who will be creative and honest players of Devil''s Advocate. Tell them to be
    brutal. It can only make your arguments stronger.


    Few things feel better in presenting than having someone object and bring up a
    point and then you say: "Funny you say that", advance the slide and there is the
    data supporting your በሚ large as life.'
