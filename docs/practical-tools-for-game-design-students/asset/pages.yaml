    There are numerous models that fit games of all shapes and sizes. For instance,
    MMOs have a unique delivery and payment mechanism.


    # Other Entities


    There are also some other groups that don''t fit neatly into any particular above.


    **Entertainment Software Ratings Board** - This is an independent entity that
    rates and labels video games. While funded by publishers, they are wholly independent.
    Developers and publishers who want a rating submit a tape and/or final code to
    the ESRB. Often console groups, licensors or retailers will require specific ratings
    in order for the game to be sold. The ESRB only has jurisdiction in North America.
    Europe has a similar board called PEGI (Pan-European Game Information). Germany
    itself has a much stricter board called the USK (abbreviated from the much more
    verbose Unterhaltungssoftware Selbstkontrolle).


    **The International Game Developer''s Association** - The IGDA serves as an advocacy
    group for game developers worldwide. It has over ten thousand members and serves
    such diverse functions as organizing local get-togethers'
