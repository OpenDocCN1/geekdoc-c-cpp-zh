  md: '# # Chapter 5 - GDD Creation Process


    Now we will go through an example together of creating a short, concise design
    document. Assume we are on a small team putting together a Fantasy RPG for Facebook.
    The lead designer comes to you and says you need to design a crafting system for
    the game. How would you go about creating the documentation?


    # ## Step One - Determine Purpose, Desired Scope, Locate Connected Systems


    Designers usually have lead designers or creative directors above them. From one
    of these folks, you must clearly determine the goals of the designs. You must
    find out:


    +   - the purpose of the design,

    - the scope of the design,

    - and the systems that will necessarily connect with the design.


    The purpose of the design: Without knowing the purpose of the system, all you
    can do is copy a similar crafting system from another game. Your lead designer
    says: "We need a system to use the items that players receive via gifts from other
    players. We want it to encourage creativity and social connections." That is a
    start. Interview. Ask probing questions. Really understand the motivations behind
    the assignment before you begin writing or prototyping.


    The scope of the design: Designers have an awful tendency to over-design. What
    this means is that given an assignment, designers will come up with nuanced, complex
    systems. In isolation this is not a problem. But in aggregate, no project can
    sustain complexity in every system and still expect to ship on time and be understood
    by users. Great designers know which systems benefit from complexity and benefit
    from simplicity. By identifying the scope of the feature, designers get an idea
    as to the depth of the system to create.'
