  md: 'Chapter 27 - Broadcasting via Blogging - 309


    # Chapter 27 - Broadcasting via Blogging


    Thomas Jefferson, John Milton, John Locke, and Jonathan Swift would have been
    bloggers. They kept a journal of sorts where each recorded aphorisms, quotes and
    notes they wanted to remember. These were called commonplace books. The parallel
    to modern blogs is not perfect, but there are similarities. In their commonplace
    books, these great men recorded the things they did not to forget and many times
    included comments to remind themselves of these important notes.


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_310_0.png)


    Figure 27.1 - Jefferson''s Literary Commonplace Book. Quotes and context from
    Euripides.


    You become a better game designer by designing games. This is true. But remember
    that design is about communication. This is why we have spent so much time using
    Word for design documents with a focus on how those documents communicate their
    message and not on the content. It is why we have spent time on pitching and removing
    obstacles to communication. Design in an interpersonal environment is about communication
    and that is something you can practice.


    One thing that I recommend to all aspiring designers is to start a blog and to
    take it seriously. Give yourself a posting quota (say, three times a week) and
    stick to it. Like the commonplace books of old, your blog can be used to store
    interesting ideas that you want to reflect on in the future. But unlike'
  merge: -1
  pgno: 310
- img_proc: true
  md: '# 310 – Practical Tools for Game Design Students


    the commonplace book, your blog can be public. Your blog will become an extension
    of your personal brand.


    Now “personal brand” is the kind of business hacks throws out there as if it had
    innate meaning but I think it is something to consider. If someone Googles my
    name, my blog is the first result. Anyone who clicks on it will see my latest
    post and will instantly form their opinion of me from that post. This makes every
    single blog post my first impression to anyone looking me up for the first time.
    Talk about persone!


    More importantly, blogs get you to practice writing. No matter how well you think
    you are overestimating your abilities. Writing every day or other day to a public
    audience will vastly improve your ability to communicate. And since blogs allow
    public comments, you can get instant feedback.


    When I was working in the industry, I would start my day by perusing the blogs
    and news sites to which I subscribed. Most likely would elicit some sort of response:
    interest, skepticism, anger, something. I would use that as the seed for a manner
    blog post. It would take no more than a half hour at the most. By the time I had
    published the post, I was in “writing mode” and could tackle my professional design
    documents at full speed. It worked!


    When I look back at my posts from years and ago, I can see a distinct change in
    the quality and maturity of my writing. These things happen in baby steps, but
    they don''t happen unless you work at it.


    Unlike the commonplace book that was only record keeping, these blogs, journals
    and diaries can spark comments and discussion. One of their most powerful strengths
    is their openness and accessibility. I have met numerous people who talk to my
    blog and it has even lead to some unforeseen opportunities.


    When I was laid off from EA in the recession that hit in 2009. I blogged about
    it. Little did I know my blog was followed by a reporter for the Orlando Sentinel
    newspaper, who contacted me for some comments for a story he was writing about
    technology and the recession. Shortly after that was published, I received an
    email from a producer of the CBS Evening News. They too were doing a story on
    how the recession was hitting tech workers. They flew a reporter down and had
    a two-hour interview with me...that they cut into the most triste six seconds
    they could find.'
  merge: -1
