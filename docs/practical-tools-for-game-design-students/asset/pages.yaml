  md: '# Chapter 29 - Networking


    It is usually assumed that the best way to go about getting a job is to scour
    listings on web sites and send out a forest''s worth of resumes. While that may
    work sometimes, most jobs are found through connections and that means you need
    to spend a significant amount of time establishing and maintaining your professional
    social network.


    # Strong vs. Weak Ties in Employment


    In the study of social networks52², there is a concept of interpersonal relationships
    that classifies them as either strong, weak or absent.


    A strong tie is a relationship that has significant value in your life. These
    are the folks that you invite to your wedding, that you know everything about,
    that truly matter in your life.


    A weak tie is someone whom you are acquainted. You know the person, maybe you
    are friendly with them and you may come into contact from time to time. But you
    are not really in their social circle. These are the friends-of-friends, people
    you don''t necessarily count on but still people you know.


    In 1970, a Harvard study attempted to analyze the influence of strong and weak
    ties on employment opportunities. Surely, since strong ties you know better, they
    must be the best way to leverage your friends to get jobs?


    Actually, Subjects in the study who found jobs through connections used people
    they saw "rarely" or "occasionally" almost five times as much as they did for
    connections they saw "frequently".


    What this means is that you are much more likely to land a job via the guy you
    used to play softball with versus via your best friend.


    > ⁵² Not the services like Twitter and Facebook, but the actual social relationships
    between humans.'
  merge: -1
  pgno: 322
- img_proc: true
  md: '![](img/b19cafc6b56054e8f5f6f1c412d479b7_323_0.png)


    Figure 29.1 - The Weak Tie Hypothesis


    It is theorized that this happens because of the distance from one member of the
    network to another. People tend to know each other (B-C) if they share a strong
    tie with a third party (A). This is called the **weak tie hypothesis**. For instance,
    if I am a strong tie with my friend Mark and a strong tie with my friend Erin,
    it is reasonable to assume that the two would have met at least a few times and
    established at least a weak tie.


    To put it another way, your strong ties all likely know each other. The weak ties
    tries truly expand your network’s reach. You don’t gain exposure to many new individuals
    (people who have the connections to help you) through strong ties.


    Take a look at a portion of my social network as represented by the business social
    network LinkedIn:


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_323_1.png)


