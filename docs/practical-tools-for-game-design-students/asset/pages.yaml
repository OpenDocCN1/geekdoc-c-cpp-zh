- img_proc: true
  md: '# Resolution


    One of the most important things to consider is the original resolution of your
    image. This is a pair of numbers that describes the width and height of the image
    in pixels. If you stretch the image, you can increase the resolution but any program
    you use to stretch the image will have to guess on how to fill in the new pixels.
    Often this causes an image to look pixelated and low quality.


    If you want your image to cover the whole slide, you need the original resolution
    of the images you find to be larger than the size of your slide. Remember in the
    preparation of your presentation how you selected a 16:10 resolution? What is
    the resolution of your projector?


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_251_0.png)


    Figures 23.22 - Low-Res Image Stretched To Fit A Slide. Ick.'
  merge: -1
  pgno: 251
- img_proc: true
  md: '![](img/b19cafc6b56054e8f5f6f1c412d479b7_252_0.png)


    Whatever that resolution is, your full screen images should not be much smaller
    than that. You may stretch a little, but I recommend not stretching by more than
    ten percent. For instance, if your screen is 1280 x 800 then your minimum image
    size for full-screen should be 1152 x 720.


    If you have the perfect image for your slideshow but can only find it in a smaller
    resolution, consider surrounding it with white space if you believe it will still
    be visible at that size at the back of the room. Never ever crowd a slide with
    smaller images just to “fit everything in”.'
