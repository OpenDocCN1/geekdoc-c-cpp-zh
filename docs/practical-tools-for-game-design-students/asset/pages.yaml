  md: '# Chapter 16 - Analog Prototyping - 193


    # Chapter 16 - Analog Prototyping


    So you have a great idea, the Next Big Thing. Of course you do! Everyone has their
    own ideas (which are to them overwhelmingly great) and there is no why to tell
    a priori ones which are the greatest.


    In fact, this gluttony of ideas can make a preproduction stage of development
    into a real hell as designers and other stakeholders battle for who has the "best-ideas."
    But these are futile arguments. We can only guess as to what will be a good idea.


    Prototyping is the solution to this roadblock. Prototyping is the act of quickly
    creating something that has the same feel as what you are aiming to gain a more
    intuitive understanding of the pros and cons of building it for real.


    There are many ways to prototype but I will split them into two divisions:


    Digital Prototyping is the most common. We will talk about more thoroughly in
    a further section. in digital prototyping for video games, literally build the
    feature in the quickest and cheapest way possible. It is chosen because it yields
    a result that it is closest to the final product. More on this later.


    Relatively ignored is its brother Analog Prototyping. In analog prototyping, we
    use what are essentially board game bits: dice, pawns, coins, and other physical
    objects to attempt to create the dynamics of the system that we are interested
    in testing.


    Analog Prototyping is extremely cheap compared to the digital alternative. Programmer
    time needs to be spent so that a digital prototype is robust enough to crash and
    handle all reasonable inputs without assistance. But a board game only needs designers
    to tend to the game to anticipate and handle edge cases. Most can be thrown together
    in a day or less and iterated on instantly.


    There''s a bit of a stigma to it though. In a multibillion-dollar company like
    the biggest developers, who would stoop to using chips and dice?'
  merge: -1
  pgno: 194
- img_proc: true
  md: '![](img/b19cafc6b56054e8f5f6f1c412d479b7_195_0.png)


    Figure 16.1 - A Professional


    Well, EA did. That handsome gentleman up there is me in 2005 working on a Nintendo
    DS game. The game contained a multiplayer mode that was rigorously playtested
    in that very room by analog methods. When our game shipped, the part we spent
    hours and hours mocking up with post-it notes, playing cards, dice and little
    candies ended up being the strongest and most coherent part of the game.


    # So How Do You Do It?


    There is no easy way to teach someone how to do analog prototyping as there is
    no step-by-step formula on how to make a game. There is a bit of mystery as to
    how creativity works. I will try my best to abstract out the bits to to focus
    on.


    Worry First About the Dynamics of the System - I am going to explain dynamics
    more thoroughly in a moment. What this means at a glance that foremost in your
    mind will be how the players will act in the prototype and what decisions they
    will make. For instance, if you were prototyping a cover system, your focus would
    be: where the cover is, how it protects, how long it takes to get there and how
    it affects offensive power. You wouldn’t particularly care about aiming or grenade
    tossing distance or other bits that well may be important to your final game.'
