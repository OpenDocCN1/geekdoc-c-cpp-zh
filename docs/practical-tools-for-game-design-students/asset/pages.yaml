  md: '# Transparent Images


    Often when you find an image online that you want to use in a presentation, you
    copy it and paste it into Word or Powerpoint only to find that the white background
    is hard-coded into the image and looks awful in your document or on your slide
    background. How can we fix that?


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_97_0.png)


    Open the image in Photoshop. The image needs to be in a format that has is called
    an alpha channel. Alpha represents transparency. Some popular file formats like
    JPEG do not support alpha channels. Formats like GIF and PNG do.


    Copy the image to the clipboard. It can be helpful to start with a new image that
    has an alpha channel. Go to File, then New and create a new image but be sure
    to set the Background Color as transparent. Since your old image is on the clipboard,
    Photoshop will helpfully fill in the correct dimensions.


    Paste your image into the new canvas. Now behind the image will be the alpha channel,
    which is represented by a grey checkerboard pattern. What we want to do is remove
    the white parts around our image to make the checkerboard shine through.'
  merge: -1
