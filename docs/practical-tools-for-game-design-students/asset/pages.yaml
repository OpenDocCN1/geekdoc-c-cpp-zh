  md: '# Chapter 18 - Digital Prototyping


    Digital Prototyping is the method more commonly used in industry when any prototyping
    method is used at all. In digital prototyping, the goal is to make a playable
    version of your idea in digital form as quickly as possible. Unlike a normal production,
    a digital prototype may use placeholder art, may break down outside the area being
    tested and may ignore other aesthetic concerns that would need to be addressed
    in a full public version.


    Often prototypes are considered “throw-away” meaning that the code used in the
    prototype is done. The reason you would want to throw out work is that the speed-driven
    nature of the exercise can lead to shoddy code and art that would never be used
    in production. Sometimes prototypes are converted into production versions, but
    this intent should be clear from the start.


    Most professional studios will prototype in whatever tools they use for their
    production games. If they make games in UDK, their prototypes will be in UDK.
    If they use a proprietary engine, their prototypes will be in the proprietary
    engine. It makes sense. Since the goal is speed, why relearn a new tool? And if
    it turns out that code and art are robust enough by sheer luck to be included
    in the production model, so be it.


    Since digital prototyping methods are so dependent on the tools and engine used
    to create the prototype, little can be said about commonalities. Actually, many
    of the tips from the analog prototyping section carry over nicely here with one
    addition that I will mention at the end:


    **Worry About the Dynamics of the System** - When faced with an empty Visual Studio
    window, anyone with coding experience starts thinking about code and what methods
    it will take to get something quickly up and running. While it is good to focus
    on “quick”, you must also focus on how you want your prototyped system to function
    to the players not how it will function under the hood. This slows down most prototyping
    projects when the how becomes more important than the what.


    **Get the First Version Running as Quickly as Possible** - Digital prototyping
    is generally slower to get a first version playable than its analog cousin unless
    the functionality is extremely similar to something you already have'
