  md: '# Chapter 12 - Simple Simulation


    Now that you are familiar with the functions and uses of Excel, you can wield
    this mighty weapon and force it to your will. Or you can use it to do some simple
    simulation. Whatever.


    What are some ways you can apply Excel to model a game situation? Here we will
    go through a long example first and then a simpler one.


    # The Long One


    What if I asked you the odds were of landing on Boardwalk in the first pass around
    a Monopoly board assuming no "Advance to.." or "Go back..." cards are drawn, no
    triple-doubles penalty or you don''t hit "Go to Jail"¹? How would you do it?


    Well, there are 40 spaces on a Monopoly board and Boardwalk is 39th. You would
    assume that the odds of landing on any particular space is 1/40, thus the expected
    value would be 40 rolls. But you cannot assume that because you cannot reach Boardwalk
    until your fourth roll (12+12+12+3). You need to know how easy it is after an
    uncertain number of rolls that you sum up to 39.


    The file for this is on the book''s website (http://www.hiwiller.com/designtools)
    so you can download it and follow along.


    First, I created a table that related a space number to a name. This is not necessary,
    but is helpful for readability. Here is the table:'
  merge: -1
  pgno: 160
- img_proc: true
  md: '# 160 – Practical Tools for Game Design Students


    | A | B |

    |---|---|

    | 1 | 0 Go |

    | 2 | 1 Mediteranean |

    | 3 | 2 Community Chest |

    | 4 | 3 Baltic |

    | 5 | 4 Income Tax |

    | 6 | 5 Reading RR |

    | 7 | 6 Oriental |

    | 8 | 7 Chance |

    | 9 | 8 Vermont |

    | 10 | 9 Connecticut |

    | 11 | 10 Just Visiting |

    | 12 | 11 St. Charles |

    | 13 | 12 Electric Company |

    | 14 | 13 States |

    | 15 | 14 Virginia |


    Figure 12.1 - Space-Name Table


    Next, I created a trial game that has three hundred rolls¹¹⁵ I have six columns
    here: Roll # (which is just the number of the roll), the roll itself (remember
    that you are rolling two six sided dice so this should be the sum of two RANDBETWEEN(1,6)
    statements¹¹⁶), the sum of all rolls up to now and the modulus of the sum of all
    rolls.


    > ¹⁵ It is quite likely that someone can lap the board 20 times without hitting
    boardwalk. Always provide more rolls than you think is normal because you want
    to support the edge cases like the trial where Boardwalk keeps getting missed.
    300 rolls is a lot, but it does not guarantee a user will ever hit Boardwalk.


    > ¹⁶ You cannot put RANDBETWEEN(2,12) here because it is more likely to roll a
    7 than it is a 2 or 12. We will cover this later.'
  merge: -1
  pgno: 161
- img_proc: true
  md: '# Chapter 12 - Simple Simulation - 161


    | Trial # | Sum. Modulus | Lap | Location | Boardwalk Hit? |

    |---| 1 | 8 | 8 | 1 Vermont | |

    | 2 | 4 | 12 | 1 Electric Company | I |

    | 3 | 6 | 18 | 1 Tennessee | |

    | 4 | 5 | 23 | 1 Indiana | |

    | 5 | 5 | 28 | 1 Water Works | |

    | 6 | 6 | 34 | 1 Pennsylvania | |

    | 7 | 5 | 39 | 1 Boardwalk | 7 |

    | 8 | 10 | 49 | 2 Connecticut | 7 |

    | 9 | 4 | 53 | 2 States | 7 |

    | 10 | 6 | 19 | 2 New York | 7 |

    | 11 | 9 | 68 | 2 Water Works | 7 |

    | 12 | 7 | 75 | 2 Short Line RR | 7 |

    | 13 | 7 | 82 | 3 Community Ches | 7 |

    | 14 | 6 | 88 | 3 Vermont | 7 |

    | 15 | 4 | 92 | 3 Electric Company | 7 |

    | 16 | 5 | 97 | 3 Community Ches | 7 |


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_162_0.png)


    The modulus is just a fancy way to say “remainder”. When you lap the board once
    reach Mediterranean, you are on space 41. But unless we want our Space-Name table
    to repeat dozens of times to handle space #500, we can do a bit of math to figure
    out space from 0-39 corresponds to. When you do =MOD(Sum of All Rolls, 40), Excel
    will keep subtracting 40 from the sum of all rolls until it gets to a number that
    is between 0-39. In the case of space 41, Excel will subtract 40. The result is
    1, which is Mediterranean Avenue on our lookup chart. If the player is on space
    222, Excel will keep subtracting 40 until 222 become 22, which is in our lookup
    table.


    In the next column I have the lap (which is not necessary for this analysis, but
    might be helpful if you want to do additional analysis on this data. Finally,
    I have the name of the space landed on, which is a VLOOKUP statement on our Space-Name
    in Columns A and B.


    Now I have a column that specifically tells me if Boardwalk has been hit. First,
    it looks to see if the cell says Boardwalk has been hit. If it, it repeats the
    number that is in the above cell. If not, it looks to see if Boardwalk was this
    roll. If it was, the cell''s value is the roll number. This causes the first row
    number where Boardwalk is hit to be repeated down to the bottom.


    To the right, I added a data table. Data tables are a feature I didn''t cover
    in the Crash Course chapter for a number of reasons. They can be counterintuitive
    and complicated, so it is best to take your time with them.'
  merge: -1
  pgno: 162
- img_proc: true
  md: '# 162 - Practical Tools for Game Design Students


    If you are interested in them, there are a number of tutorials available online.
    Search for one that matches your version of Excel specifically. To sum up what
    the data table function does is that it runs trial (of three-hundred rolls) one
    hundred times and lists the result of each trial.


    Excel might slow down at this point. Every time you change a cell, Excel will
    recalculate trials (of three hundred rolls each). You can change the recalculation
    rules to only recalculate when you hit a specific key. This is in Options or Preferences
    under Calculation.


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_163_0.png)


    | | |

    |---|-|

    | 1 | 40 |

    | 2 | 31 |

    | 3 | 6 |

    | 4 | 40 |

    | 5 | 18 |

    | 6 | 74 |

    | 7 | 12 |

    | 8 | 33 |

    | 9 | 17 |

    | 10 | 32 |

    | 11 | 48 |

    | 12 | 74 |

    | 13 | 41 |

    | 14 | 22 |

    | 15 | 11 |

    | 16 | 24 |


    Figure 12.3 - Data Table


    In the newest versions of Excel for Windows, you can generate histograms automatically.
    In older versions and versions for the Mac, you must “roll your own” histograms.
    I will briefly show you how to just be sure.


    In the next few columns, I create the “bins” for the histogram. Each bin will
    hold some range of results like “less than ten”, “ten to twenty”, “twenty to thirty”
    and so on. In this example, I use bins of 5 up to 150. In the next column, I run
    a COUNTIF for each range to count the number of results for each bin. Then I can
    create a column graph when this is complete.'
