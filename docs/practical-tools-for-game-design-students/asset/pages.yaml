  md: '# Chapter 22 - The Many “Don’ts” Of Powerpoint - 233


    refuse to do the presentation because even my subtle lack of enthusiasm was enough
    to sink the idea.


    # 11. Don’t Waste Ink


    Edward Tufte, probably the leading expert on data presentations coined the concept
    of the data-ink ratio in his legendary book The Visual Display of Quantitative
    Information. In a presentation, data-ink is ink that cannot be erased from the
    image without erasing information; ink that if removed would change at least some
    of the meaning of the chart or graph shown. A good chart or graph, Tufte argues,
    is that which maximizes data-ink and minimizes non-data-ink. No aspect of the
    image should be superfluous. Take these two versions of the same data:


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_234_0.png)


    Figure 22.5 – Data-Ink Comparison


    The first graph wastes spaces and makes the decrease in failure rate harder to
    understand. The second graph uses less “ink” and gets the point across in a much
    clearer manner. It would be clearer still!


    Research has shown” that completely eliminating non-data-ink is often preferred
    less when compared to a minimal data-ink alternative. Focus not on eliminating
    non-data-ink, but instead on making the point of the slide as clear as possible.


    Remember: you do not speak to the slide’s point, the slides speak to yours.


    > ¹⁹ Inbar, Tractinsky and Meyer, Minimalism in information visualization: attitudes
    towards maximizing the data-ink ratio., http://portal.acm.org/citation.cfm?id=1362587'
