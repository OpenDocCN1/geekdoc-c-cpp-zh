  md: '46 – Practical Tools for Game Design Students


    # Step Three: Brainstorm


    We are going to discuss brainstorming and its uses in a later chapter in depth.
    A brainstorm is a creative meeting where an individual or a group tries to create
    a quantity of solutions to a problem. Based on the research you completed in Step
    Two, you should be well equipped to envision a number of possible solutions. See
    the Idea generation chapter for the how-to of using this technique.


    # Step Four: Reduction


    You will have a lot of possible directions to pursue after your brainstorming.
    It is best to sleep on them to have adequate time to think them over. When this
    is done, come back to the list of possible ideas. In Brainstorming, you don''t
    discriminate against ideas. In the Reduction step, discrimination is all you do.


    Eliminate ideas that are:


    +   - Not in line with the chosen scope

    - Impossible to create

    - Not effective in researched titles

    - Don''t meet the purpose of the design

    - Conflicts with another design in the project


