  md: '326 – Practical Tools for Game Design Students


    Here is the alternative: be interesting. Strike up genuine heartfelt conversations
    with people. At the very least you will have fun and learn something. Exchange
    cards. Then, weeks later, you can email him/her and thank them for your talk at
