    # Footnotes and Appendices


    Keep it simple.


    Easy to scan.


    Easy to read.


    These are the rules you want to live by when creating GDDs. But what is too simple?
    Is it not possible to leave too much?


    Usually when you ask that, the answer is: no, it is not possible. Cut it it.


    Sometimes you truly want to keep in that blob of backstory or a note of reminder
    to provide some of anthropological reasoning to the feature.'
