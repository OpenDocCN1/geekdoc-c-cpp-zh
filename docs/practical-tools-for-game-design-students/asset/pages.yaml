- img_proc: true
  md: '# 258 – Practical Tools for Game Design Students


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_259_0.png)


    Figure 23.30 - Insert Video


    Video from File picks a file from your hard drive. Video files must be in the
    AVI or WMV formats on Windows. QuickTime MOV files are available on Macs. Movies
    saved from YouTube are in the Flash Video (FLV) format and will need to be converted
    before they can be embedded.


    Video from Web Site is supposed to allow you to embed clips from sites like YouTube
    and Vimeo straight into the presentation. The trouble with this is that these
    sites change so frequently that I have pretty much never been able to get this
    feature to work without a hitch.


    Clip Art Video is awful and should never be used.


    Once inserted, you can change it so that the video is started on a user click
    or started automatically by selecting the video and accessing the Video Tools
    Playback tab.


    # How to best Convert


    One of the best ways to ensure that a video will actually play is to strip it
    from YouTube, Vimeo or wherever and keep it on your hard drive. Generally, sites
    discourage this practice, but these safeguards are easily circumvented.


    There are plugins for your browser of choice that will allow you to download from
    YouTube and other sites: “Easy YouTube Video Downloader” for Firefox, “YouTube
    Downloader” for Chrome. In Safari, you can press Command+Option+A and double-click
    on the largest file in'
  merge: -1
  pgno: 259
- img_proc: true
  md: 'the list. KeepVid.com is a site that allows you to save videos from any modern
    browser.


    Once you have the FLV video file, you still have some work to do. Powerpoint doesn''t
    recognize FLV files natively. You must convert these files to something Powerpoint
    will read like AVI. There are many proprietary pieces of software that will do
    this like Handbrake or AVS Video Converter. Free implementations like FLVtoAVI
    vary in usefulness. Some websites even try to convert video on the fly, but your
    mileage may vary. Since there is no standard here, I will leave this as an exercise
    to the reader to find the best converter for your uses.


    # Copyright Warning for YouTube Files


    Video is no different than pictures or music you find on the web. It is likely
    that unless unspecified you do not have the license to exploit the work for commercial
    uses. Creative Commons license for video are few and far between at the time of
    this writing, so unless you hold full copyright over the video, don''t use video
    in public for commercial purposes.'
  merge: -1
