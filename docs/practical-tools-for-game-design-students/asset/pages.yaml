  md: '# Chapter 23 - Powerpoint - 267


    that you test the room in which you are presenting beforehand to ensure that the
    equipment works and the volume levels are appropriate. Test early enough that
    you can find help if things are broken or have the time to move your presentation
    as a last resort.


    Here is how you attach sounds in Powerpoint 2010⁴⁴.


    At the far right of the Insert tab is the Audio option. You are given three options:
    Audio from File, Clip Art Audio and Record Audio.


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_268_0.png)


    Figure 23.38 - Audio Options


    “Audio from File” is the one you generally want to use. “Clip Art Audio” should
    never be used. “Record Audio” is useful in specific situations where you do not
    already have a recording to use. If you are presenting live, whatever audio you
    can record at home probably be better done live at the presentation if possible.


    Select the file you wish to add and a speaker icon will appear on your presentation.
    Once the speaker is selected, you can click over to the Audio Tools Playback tab
    to find a number of useful options including whether to start with the slide (Automatically),
    or on clicking the speaker icon (On Click). Additionally, you can loop the sound
    to play continuously. Your audio clip will appear in the Animation Pane if you
    want to fine-tune it when the sound starts.


    If you only want to use part of your audio file, you can right-click on the speaker
    icon and select “Trim Audio” or select “Trim Audio” from the Audio Tools Playback
    tab. This is recommended to cut down on the file size of the presentation.


    > ⁴⁴ As always, these instructions are for the listed version of Powerpoint. In
    older versions, sound was easier to find. In older versions, the Sound menu is
    found under Insert, then "Movies and Sounds", then "From File".'
