    # Planning, Flow and Slide Sorter


    Before you start typing away in Powerpoint you should have some semblance of a
    plan as to the content of your presentation and the relative order of that content.
    This requires planning beforehand and can be done either inside or outside of
    Powerpoint.


    Planning inside of Powerpoint is easily done. Add a bunch of blank slides and
    then either drop in notes as to what your content will be in a temporary text
    box (see Text Boxes, later) or in the speaker notes (see Speaker Notes, later).


    Many presenters like to plan outside of Powerpoint. They do either this digitally
    by typing notes in Notepad or physically by sketching out ideas on paper or note
    cards. There is no one way to do this. Organize your thoughts in a way that it
    is easy to move them around and visually understand the flow of your presentation.


    Flow is an ephemeral quality that is nearly impossible to measure directly. Its
    absence is always noticeable. You want your presentation to have logical transitions^40
    so that one topic becomes another without glaring shifting moments. The more brusque
    the transition, the more it jars the audience. Sometimes that is the point - to
    shock the audience into noticing, but it also gives the audience a chance to be
    distracted.


    Once the rough draft of your presentation is created, use the slide sorter feature
    to get a grasp of how your presentation flows by topic. What is the cadence? Do
    you have one Big Idea per slide or three? Do some slides contain a lot more information
    than others? Will this be jarring to your audience?


    > ^40 Not slide transitions! More on these evil things later!'
