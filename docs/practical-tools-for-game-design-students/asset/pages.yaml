    # Pigs and Chickens


    +   - From an old fable:

    - Chickens are “involved"

    - Pigs are “committed"

    - Very much like Scrum:

    - Some, chickens, are Involved (Producers)

    - Some, pigs, are committed (Coders, Designers).


    Figure 22.2 – Compare and Contrast Image vs. Text


    Most of my slides have no text or only a phrase. An exception is made when you
    are showing a quote.


    # 4. Don’t Meander - Have a Theme


    The human brain is remarkable, but very limited. We can only hold about seven
    pieces of information in working memory for less than thirty seconds¹⁸. Long-term
    storage through working memory gains additional retention when repeated. By repeating
    the most salient elements of your presentation, you increase the chances that
    your audience will remember your points.


    For instance, if I was to tell you right here to never ever ever read your slides
    aloud, then it might be sinking in for you since I mentioned it in the points
    above.


    While brevity is important, it is not wholly effective for message retention.
    By returning to the same points but presenting them in different configurations,
    you help to reinforce your message.


    # 5. Don’t Use Clip Art


    Want to make a terrible impression? Use the clip art provided in Powerpoint. Everyone
    has seen the lo-res guy-in-front-of-a-chart or stick-figure-scratching-his-head
    clip art a thousand times. Subconsciously (or


