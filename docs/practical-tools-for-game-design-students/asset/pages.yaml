    # Cropping/Transforming


    One of the most basic tasks a designer will use Photoshop for is to format images
    in a specific way for presentation in documents or slides. Learning some of these
    basic techniques will go a long way in improving how you use images in your documents.


    # Cropping Using the Crop Tool


    Cropping is the act of cutting away unnecessary portions of an image to help focus
    on an important part of an image or to change the aspect ratio of the image. Cropping
    removes information and reduces the pixel size of your image. To retain the original
    pixel resolution and aspect ratio, you will have to stretch your image (see Free
    Transform below).'
  merge: -1
  pgno: 100
- img_proc: true
  md: 'One of the methods of cropping is to use the Crop tool in the standard tool
    bar. Select the Crop Tool and then drag the area you want to keep. The rest of
    the image will darken. You can then drag the corners or sides of the image to
    adjust the crop area. When you are satisfied with your selection, hit Enter and
    the darkened area will vanish.


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_101_0.png)


    Figure 9.6 - Crop Tool Icon


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_101_1.png)


    Figure 9.7 - Crop Tool in Action


    # Cropping Using the Rectangular Selection Tool


    A quicker way of cropping involved using the Rectangular Marquee tool. Just select
    the area you want to keep and then select Crop from the image menu. This is the
    method I tend to use since it is so much faster.'
