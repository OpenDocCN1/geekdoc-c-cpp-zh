  md: '# # The Hideous Realm of Transitions and Sound Effects


    "Talking out of turn? That''s a paddin''. Lookin'' out the window? That''s a paddin''.
    Staring at my sandals? That''s a paddin''. Paddin'' the school canoe? Oh, you
    better believe that''s a paddin''. - Jasper


    If a lot of this chapter seems like just your humble author telling you about
    features of Powerpoint are for Forbidden Knowledge never-to-be-used, then you
    are absolutely right. But don''t take my word for it:


    Despite the lush graphics effects so easily produced through modern presentation
    applications, most contemporary presentations should return to formats nearly
    as spare as the old overhead transparencies. It is not necessary to copy their
    specific limitations (there''s no need to go back to, say, a single-size typewriter-style
    font or total lack of color in charts and graphs), but the equivalent level of
    disregard for extraneous decoration would be helpful, for the sake of both presenter
    focus and audience comprehension.


    Who do you think made that quote? Some surly marketing won or curmudgeonly professor-type?
    No, that''s actually Robert Gaskins, the man who (jointly) invented PowerPoint.
    If you are looking for an expert, it is hard to find someone with more gravitas.


    For some reason, the feature that tempts the most is the use of transitions. A
    slide transition is a special kind of transition animation that ties two slides
    together.'
  merge: -1
  pgno: 261
- img_proc: true
  md: '![](img/b19cafc6b56054e8f5f6f1c412d479b7_262_0.png)


    # Figure 23.31 - Unnecessary 3D Slide Transition


    But transitions are not limited to just slides, oh no! Text boxes and figures
    can have animations tied to them. They can spin into place, dissolve or explode
    onto screen. You can even define motion paths to animate your text or still image
    over an invisible path. Why this would help cement your audience''s knowledge
    is anyone''s guess.


    Why are transitions so bad? The question should not be that, but instead the burden
    of proof should be shifted: why are transitions good? They create unnecessary
    pauses in your presentation, they do not add content and often they can be seen
    as pedestrian and juvenile. Few see transitions and stare mouths agape in wonder
    and awe. Why add something with no upside?'
  merge: -1
  pgno: 262
- img_proc: true
  md: '# The One Transition You Can (and Should) Use


    There is, however, one transition (really two if you are technical) that has great
    utility and this I will show you how to use it. It is called “Appear” in Powerpoint.
    Its cousin is “Disappear” for those who want to separate the two.) Appear/Disappear
    cause an element to appear or disappear on a slide when you hit the “Next Slide”
    button. This allows you to hide information until you want to use it.


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_263_0.png)


    The slide above begins only with the “Ideation” box-on screen. Each time I click,
    an arrow appears followed by the next box in the waterfall. Eventually, I have
    all five on screen. This is much better than having all five on the screen at
    the start, which would be a very crowded and confusing out of context.


    Counterintuitively, object transitions are not found in the Transitions tab, but
    in the Animations tab. In the Advanced Animation section, turn on the Animation
    Pane. The Animation Pane shows the order of all animations on the slide.'
  merge: -1
  pgno: 263
- img_proc: true
  md: '# Chapter 23 - Powerpoint - 263


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_264_0.png)


    An animation has one of three trigger states: On Click, With Previous or After
    Previous. Each time the mouse is clicked, Powerpoint will trigger the next animation
    on the Animation Pane list labeled as “On Click”. Any animation listed as “With
    Previous” will also play. After that animation is done, any animation listed as
    “After Previous” plays. The animations stop when the next “On Click” is hit on
    the list. Powerpoint then waits for the next click to trigger.


    The figures after the names in the animation pane are a timeline of sorts. If
    the animation takes a long time, this effect is much more noticeable, but since
    we are using instant appears and disappears, you will not be able to easily notice
    this.


    Now we will create a slide with a number of animation transitions to show this
    effect. It will look like this:'
