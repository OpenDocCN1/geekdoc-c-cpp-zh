  md: '# Chapter 20 - Quality Assurance - 213


    # Bug Tracking


    Any project of nontrivial size will track their bugs using some sort of database.
    Numerous third-party companies supply bug tracking software. Mozilla''s BugZilla
    database tools are very popular as is the closed-source DevTrack bug management
    tool. QA testers or QA leads often enter bugs directly into a database after checking
    to make sure the bug is not already entered. A producer then looks at bugs as
    they come in and will recategorize them; reject them or assign them to a team
    member’s “bin”. Team members then check their bins regularly to see if any bugs
    have been assigned to them and on what they should work.


    # Bug Classifications


    Bugs can be classified in many different ways, but generally they are all given
    two attributes: a severity and a status.


    The severity of a bug is how critical it is to the project''s health. Severities
    are often classified by letter grades. A-level bugs are “showstoppers”. They are
    bugs that are so severe that the game cannot ship or, in some cases, even tested
    without the bug being eliminated. A-level bugs are crashes, impossible levels
    or legal issues such as displaying a licensor’s logo incorrectly.


    Bugs then decrease in severity by letter grades. A B-level bug is serious and
    will usually be fixed, but not blocking anyone’s progress. These are usually features
    not working as intended or features that just look bad. A C-level bug is your
    average bug. It may not appear in every playthrough and may not cause a huge effect
    on the game experience. A C-level bug may be a line of dialogue cutting off early
    or a texture being misapplied. D-level bugs are tough to reproduce and of little
    consequence. An object having poor clipping that is in a difficult-to-reach portion
    of the map is still a bug, but affords the lowest severity.


    Producers then prioritize their bugs by their severity and attempt to direct the
    team to fix the worst offending bugs first so that when the team runs out of time
    only minor issues remain.


    The status of a bug indicates where it is in the project’s workflow.'
