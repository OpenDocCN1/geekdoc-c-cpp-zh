  md: '# Chapter 25 - Other Documents - 279


    # Chapter 25 - Other Documents


    # Feature Overviews


    We have spent time on creating GCDs that are crafted for the most important folks:
    those actually making the game. Another group of stakeholders rank up there: the
    folks holding the purse strings. These are your executive producers, your studio
    managers, your publishers, your licensors and so forth. They often ask for design
    documents when they really want are design overviews.


    The distinction is simple: design overviews are meant to be read as a one would
    read an article where design documents are meant to be read as a to-list. You
    can supply both to the non-hands-on stakeholders, but they will generally find
    a design overview more useful.


    Why put this in the section about pitching and not in the section about Word?
    Because you structure a design overview the same way you would structure a verbal
    pitch, which is often why these are called feature overviews.


    In a feature overview, you are selling the story of each individual feature or
    idea. Give the explanation for each feature as you would conversationally. Treat
    it as if it were a description given in a detailed game review rather than the
    stark scannable design document.


    For instance, take a GDD from an earlier section. For Chili Cookoff, we would
    not necessarily have the bulleted list of features. A feature overview or design
    overview might look like this.


    Chili Cookoff - This event is part of the design of making multiplayer active
    events available to all classes. (Previous event proposals clearly favored warriors
    and wizards.) In this case, the event clearly favors herbalists, clerics and cooks.


    From 3-5 players start the event and add a number of ingredients that they found
    on their journeys to a Chili Recipe. Each event will have a different makeup of
    NPC judges that favor a particular class of ingredient. By tasting the chili during
    preparation, the user can deduce if he is going in a correct direction. This adds
    a puzzle-solving element to the event along'
  merge: -1
  pgno: 280
- img_proc: true
  md: 'with an exploration element where users will hold onto interesting ingredients
    for their future chili cookoffs.


    Winners will receive gold and experience bonuses. These events are watchable by
    spectators, who can learn what techniques can help them win.


    Notice immediate differences between this and the GDD:


    +   - The feature overview does not go into specifics. An engineer could not implement
    from this. How much does a player win? What screens will he/she see? But someone
    cares about the overall scope and goals of the feature (producers, publishers,
    licensors) will have their questions answered.


    +   - The feature overview is written in a manner that captures goals and reasoning.
    Engineers don''t necessarily care about this, but external groups do. Remember
    to always write for your audience.


    +   - The feature overview does not answer every question, but lets the readers
    fill in the blanks. This is important. Go into too much detail and external groups
    will quarrel with you over values and specifics. These arguments are rarely helpful
    because by the time the feature is implemented, playtesting will have negated
    your original guesses of numbers that you placed in the original GDD. Give only
    enough arguments to satisfy and anticipate them, no more.


    +   - The feature overview identifies the what-is, what-could-be-gap when applicable.
    In this example, the game didn''t have events for herbalists. This gives herbalists
    a chance to participate in something directly related to their skills.


    Given these differences, you can see why feature overviews are more informational
    for groups that do not care about the miniae of the design but do care about the
    overall system.


    Crafting a careful design overview can save a lot of time wasted by either having
    to explain a well-crafted GDD to an external stakeholder or having to explain
    a superfluous feature overview to an engineer that just wants a GDD. If you have
    external groups that check in often, both need to be vigilantly maintained.'
  merge: -1
  pgno: 281
- img_proc: true
  md: '# Pitch Documents


    We have covered the game design document and the best practices that help it it
    be be created. But we haven''t discussed a document that is often called a “game
    design document” but shares little with what we have been discussing: the “pitch
    document".


    The pitch document is larger than a feature overview. The pitch document is a
    summary of what the game is about as a whole and is used to show the basics of
    a game idea to an external group or is just used to have the internal team reach
    agreement on a direction. It is sometimes called the “high concept”. It is not
    the game design document because it doesn''t tell anyone exactly what to design,
    only a description of what it will look like when it is done. It is the difference
    between the blueprints to a Camaro and a brochure for the Camaro.


    Generally, the pitch document will briefly cover some standard points. Don''t
    use this as a template, however. Tell the story of your game''s targeted development
    in a way that is natural for you and the audience. Here are some of the standard
    points covered in many pitch documents:


    **Setting/Genre:** What type of game is this? What kind of world is the game set
    in? This is more of a game mechanics focused question than a story question. If
    your game is a shooter, is it a military shooter like *Call of Duty*, a simulator
    like *Arma*, or an arcade shooter like *Bulletstorm*


    **Story:** In very broad strokes, what does the player do in this game? How is
    he/she part of the world?


    **Characters:** Who/what do you play as? Who else is in the world?


    **Hook:** What is the unique selling proposition for the game? Is it mechanics?
    Story? Tech? **There has to be a hook.** This section is not optional. This needs
    to be in the pitch early and often. Remember when we talked about theme of a presentation?
    This should be your theme. “We are going to be better than our competitors” is
    a meaningless theme. That''s every team''s goal and is not a unique selling proposition.


    **Major Features:** Take your best Feature Overviews and show them in the pitch.
    Features are what make the game!'
  merge: -1
  pgno: 282
- img_proc: true
  md: '# 282 – Practical Tools for Game Design Students


    Play Example: This is a short walkthrough of what the player will experience.
    Teams with the resources often do this in the form of a video. It is important
    to know what the player will actually do.


    Comparison to Competitors: This is usually needed when talking to business folk
    at the studio or publisher level. What games will your game be compared to? How
    did these games sell? Were they received critically? How will we exploit their
    successes and mitigate their mistakes?


    Development Risks: Don''t be a Pollyanna; every project has risks. Be upfront
    about them. A design has never been tried before? Are you going up against a behemoth
    in your industry? Do you have a team inexperienced with the genre or platform?
    Identify the risks and how your team will handle them. This is the same as in
    our pitching instructions. Anticipate your enemies and defeat their arguments
    before they are raised. Your risk management plan must stand up to scrutiny and
    be realistic. Have Plan Bs at the ready. Even if you are doing an indie project
    or a game for a class, these questions are important to answer so that you can
    plan for unforeseen events. Student projects have risks too: risks of scope, of,
    of technical events, of life events. How will your team handle them?


    Timeline: How long will this project take? When consumers be able to buy it? What
    are the major milestones? What is the QA plan? When will extra hiring take place?
    Anyone interested in the financial side will demand this. You may not be able
    to answer, so team up with folks that can answer these questions.


    A pitch document is different for every team. For instance, characters and setting
    are irrelevant in sports simulations. But external stakeholders are similar wherever
    you go. Be able to answer all the questions posed above thoroughly in a pitch
    document and you will be more prepared than most teams who jump in without looking.'
  merge: -1
  pgno: 283
- img_proc: true
  md: '# Exercises


    +   1. Go to TED.com and watch some of the presentations there that touch on topics
    that interest you. Focus on the presentation style. How is the presenter interacting
    with the audience? What do his or her slides look like, if any? How does he or
    her presentation flow?


    +   2. Create a presentation on any element of your life story to this point.
    You may write no more than two words on any one slide and no more than ten in
    the whole presentation.. Record this presentation. What slides did you choose?
    Where did you stumble? Why did you structure the presentation the way you did?
    Does it have a beginning, middle and end? Does it tell a story? What features
    of Powerpoint did you use to help better tell the story?


    +   3. Create a Pecha Kucha presentation on any topic you wish. Deliver it with
    the principles outlined in this book. Review it when finished. Did you create
    something engaging? If not, go back and try and deliver it again or start over
    with a new topic. Practice makes perfect.


    # Summary


    +   - Pitching is about delivering a message to your audience in the most effective
    means possible.


    +   - If you are spending more time on the flash of your presentation than on
    the organization of the message of your presentation, you are doing it wrong.


    +   - Limit the number of words you put on screen when presenting.


    +   - Don''t read your presentation to your audience.


    +   - You are the focal point, not your slides. The slides are there to augment
    your presentation not to give it.


    +   - Your slides are not speaker notes.


    +   - Assume that you should never use bullet points, clip art, slide transitions,
    sound or video in your presentation unless there is no alternative.'
  merge: -1
