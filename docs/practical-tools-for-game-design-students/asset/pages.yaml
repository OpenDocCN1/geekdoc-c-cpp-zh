    # Alternatives


    At the risk of using a double negative, Photoshop is not inexpensive. Legit copies
    can cost hundreds of dollars. While Photoshop serves its niche well, there are
    other image generation areas it does not cover at all. There is a market for alternatives.
    Here are some of the most popular:


    Google Docs Drawing Tool is a function of the Google Drive suite. It is free and
    easy to share and store your work, but it is relatively light on features.


    GIMP is an open-source image-editing program that attempts to mimic many of the
    main features of Photoshop. While it has suffered in the past from serious usability
    issues, newer releases have been more palatable. GIMP''s main benefit when comparing
    to Photoshop is that it is free. Additionally, if you are part of the subset that
    uses Linux, it is one of your only options. Support for GIMP is also burgeoning.
    There are a number of books on GIMP available.


    Illustrator is another software package from Adobe that focuses on vector-based
    drawings. Like Photoshop, it is not inexpensive, but is extremely popular for
    those who want to draw rather than edit already created images.


    Paint.NET is another free image editing package similar to GIMP. It is not completely
    open-source, but is perpetually free-of-cost. It is only supported on Windows
    as it was originally designed to be a replacement for the default'
