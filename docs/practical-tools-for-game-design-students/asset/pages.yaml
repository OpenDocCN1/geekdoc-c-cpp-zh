  md: '# Chapter 14 - Game Theory


    Game Theory is unfortunately named for our purposes. It is the area of mathematics
    that deals with the examination of the decisions of players where one''s decisions
    affect another. This field was pioneered by John von Neumann, the mathematician
    behind dozens of fields and theories that are helpful to modern game designers.
    (In addition to game theory, von Neumann had significant contributions to behavioral
    economics and computer science.) You may also have heard of game theory if you
    watched the 2001 film Beautiful Mind that profiled one of the most prominent minds
    in game theory—John Nash.


    # The Prisoner’s Dilemma


    The standard example of game theory is the Prisoner’s Dilemma. Here’s the setup:


    You and a co-conspirator are accused of committing a crime. You are kept separate
    and cannot communicate with each other. If you snitch on your friend and he remains
    silent, you will go free and he will get ten years in prison. Likewise if he snitches
    on you and you remain silent, he will go free and you will get the ten years.
    If both snitch on each other, you will receive five years for cooperating. If
    both are silent, you can each get nabbed for a misdemeanor charge and have to
    pay a fine. What should you do?


    | | He Snitches | He is Silent |

    |---|---|---|

    | You Snitch | (5, 5) | (0, 10) |

    | You are Silent | (10, 0) | (0.1, 0.1) |


    Figure 14.1 - The Prisoner’s Dilemma


    The standard way of looking at this is with a table. The first number is the punishment
    for you and the second number is the punishment for him. What we try to look for
    in these situations is dominance or one choice that is clearly better than another
    no matter what your opponent does.


    For instance, assume that your partner snitches. The only choice you have control
    over is your own. If your partner snitches, your best option is to'
  merge: -1
  pgno: 178
- img_proc: true
  md: '# 178 - Practical Tools for Game Design Students


    snitch as well, cutting your hard time in half from ten years to five. Now assume
    he is trustworthy and silent. Looking at your options, your best option is to
    snitch since you will get no time at all. Thus, it doesn''t matter what your partner
    does, you should snitch. He is, if rational, facing the same reasoning and thus
    he will snitch as well. Well and your co-conspirator will rationally choose a
    result that is the worst for you both.


    Look at another example. Say you have a big slice of pie or cake and a friend
    to share it equally. Now you could let your friend cut and then choose which piece
    is his, but what is to stop him from making a cut that gives him 55% and you 45%?
    You each as much of the cake as possible. So you go with the rule that one person
    cuts and one person chooses slice to take. Why? Look at it from a game theory
    perspective:


    | He Chooses Left Piece | He Chooses Right Piece |

    |---|---||

    | You Cut 50/50 | You: 50 Him: 50 | You: 50 Him: 50 |

    | You Cut 51/49 | You: 49 Him: 51 | You: 51 Him: 49 |

    | : | : | : |

    | : | : | : |

    | You Cut 99/1 | You: 1 Him: 99 | You: 99 Him: 1 |

    | You Cut 100/0 | You: 0 Him: 100 | You: 100 Him: 0 |


    Figure 14.2 - Game Theory of Cake Cutting


    This is a game with a solvable equilibrium. Given your cut (a row), your friend
    will always take the bigger piece. This means he will always choose the left column.
    So since you know he will always take the left column, you can make a cut that
    maximizes your piece size, which would be the 50/50 cut. The 50/50 cell is the
    dominant result.


    Many games are not so straightforward. In fact, this is an area of mathematics
    that has been rigorously studied in the past few decades.'
  merge: -1
  pgno: 179
- img_proc: true
  md: '# Chapter 14 - Game Theory - 179


    As game designers, it is important to look for situations of dominance like the
    prisoner’s dilemma or the cake-cutting dilemma. Look at a table for rock, paper,
    scissors where a 1 is a win, 0 is a tie and a -1 is a loss:


    | He: Rock | He: Paper | He: Scissors |

    |---|---|--|

    | You: Rock | (0, 0) | (-1, 1) | (1, -1) |

    | You: Paper | (1, -1) | (0, 0) | (-1, 1) |

    | You: Scissors | (-1, 1) | (1, -1) | (0, 0) |


    Figure 14.3 - Game Theory of Paper-Scissors-Rock


    This game is different and doesn’t have a pure strategy equilibrium like the prisoner’s
    dilemma. If you expect the opponent to pick Rock, your best bet is to pick Paper.
    If he picks Paper, you pick Scissors. If you expect Scissors, pick Rock. There
    is no dominance.


    These “mixed strategy” situations make for the best games that are played as entertainment
    because the decisions are more interesting than in solvable games. This is a very
    deep discussion that we do not have the scope to cover here.


    # The Zero-Sum Game and Virtual Economies


    One special type of game is worth mentioning: the zero-sum game. The zero-sum
    game is one in which resources are transferred among players but resources are
    not created or destroyed. A good example of a zero-sum game is poker²⁰ For every
    player who wins, another player has lost one. An example of a non-zero-sum game
    is Monopoly. As players round the board, they get more and more money from the
    bank²¹. The total money in the game increases until it is all in the hands of
    one player.


    It is important to take heed of which interactions in your games are zero-sum
    and which are not. An imbalance of non-zero-sum mechanics drains money from the
    system will impoverish a game’s economy. An


    +   ²⁰ That is, when the house doesn’t take a share of a money called rake.

    ²¹ You may not simultaneously complain the Monopoly is boring and also play with
    bonus money for landing on Free Park. The free money unbalances the game and helps
    to draw it out. This is a house rule along with skipping auctions for unbought
    properties that helps destroy the game dynamic. It is a personal crusade of mine
    to stop people from playing this way.'
