  md: '# Chapter 3 - Software Development Life Cycle


    Software development can be a complex endeavor. In many cases it requires the
    coordinated effort of dozens of distinct egos that have to work together to fit
    moving parts together seamlessly. Needless to say, this can take a lot of organization.


    We use models like the software development life cycle to wrap our heads around
    the various processes that go into creating a complex software process. We use
    the metaphor of the life cycle. This is a model of order; when we do so things
    and what steps follow others?


    There are many different formulations of the software development life cycle as
    the needs for various industries differ. I''ll be talking about two models that
    most studios follow.


    # Waterfall Development


    The simplest software development model is the waterfall method. Even though it
    is generally cited as a poor way to organize your software project, its simplicity,
    predictability and the fact that many publishers draw their contracts up based
    on this model lead many studios to still employ this method. It was first mentioned
    in the 1950s and takes its name from a waterfall in that it is nature''s one-way
    street: water flows down and never up.'
  merge: -1
