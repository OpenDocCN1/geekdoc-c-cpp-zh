  md: '# Chapter 11 - Excel Crash Course


    # Chapter 11 - Excel Crash Course


    Excel provides a solution to ordering and manipulating data. Most of the features
    we talk about in this chapter will allow you to enter or perform functions on
    data. Thus, appropriate applications of Excel are items with changing data that
    has have some computational analysis provided with it. Schedules for instance
    are often done in Excel to do operations on people and tasks such as calculating
    productivity and assigning subteams. Excel is used to run simulations of simple
    data, like an experiment as to how much time it will take a player to defeat some
    number of players or how often certain complicated dice rolls a specific result.
    We will first discuss the features of Excel and then use them to create some dynamic
    applications.


    Consider your Excel Crash Course.


    # Entering Values and Filling Series


    Each rectangle in Excel is a "cell" and each cell holds a discrete piece of data
    like a name or a number. By placing cells next to each other, we can relate cells
    together. Generally, a row of cells describes some instance (such as task, customer,
    or feature) and columns describe elements of that instance. We are creating an
    Excel table of customers. One row is a customer. Each column is a feature of that
    customer.


    | LastName FirstName Address City OrderTotal |

    | Doe Alphonse 123 Fake Street Springfield $21.13 |


    *Figure 11.1 - Describing a Single Customer*


    Often, we don''t have a unique identifier for every row, like we do in the above
    example. Sometimes we have to supply that for ourselves. In database language,
    this is called a primary key. It is an identifier for every row that is unique.
    For instance, names are considered not to be candidates for primary keys because
    two people can have the same name (e.g., which John Smith did you mean?) so it
    is common to give a unique number to every row.'
  merge: -1
