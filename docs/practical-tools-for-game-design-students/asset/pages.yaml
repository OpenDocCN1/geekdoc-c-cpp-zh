    # Cutting and Copying


    Standard word processing functions like cut, copy and paste are available to you
    in Excel, but there are some notes to make regarding how cell references act when
    you try this.


    When you cut a cell and then paste it somewhere else, the cell reference should
    stay exactly the same. Say I cut a cell containing =B10 from E1 to E2. It should
    still paste as B10. But if you copy the cell, Excel will attempt to move the cell
    references as if you were dragging the file. In this case, it is not desirable,
    you would want to stick to the anchoring methods listed above.


    Other behaviors regarding pasting with Excel are that Excel likes to preserve
    formatting and Excel assumes spaces in the text such as the separation between
    first and last name should really a cell break.


    To avoid pasting cells into a space and then having to redo the formatting, you
    can use the Paste Special command in the clipboard section of the Home tab. Click
    on the Paste button downward arrow and'
  merge: -1
  pgno: 131
- img_proc: true
  md: '# Chapter 11 - Excel Crash Course - 131


    then on Paste Special. When you use this, you get a dialog box and can choose
    from there to only paste the values, keeping the style of the cells unchanged.


