  md: '# 334 – Practical Tools for Game Design Students


    # Step 1 - Contact Info


    Your name and contact info go at the top of the resume. This includes your full
    given name (no nicknames), address, telephone number, email address and website.
    Simple enough.


    # Step 2 - (Optional) Summary


    Next you may put a very short summary. Only do this if you think it is is important
    to framing yourself early. Maybe you are a level designer first and foremost and
    you want to frame that with something like “Level Designer with Over Over 12 Level
    Design Contest Awards”. This is fine. “Dedicated Hard Worker” or “Enthusiastic
    About Games” is generic and avoidable.


    # Steps 3/4 - Work Experience and Education


    If you have any industry work experience, put it here first. If your work experience
    is entirely outside the industry, start with your education.


    For education, put the name of the institution, degree and concentration (if applicable).
    If your degree is in progress, put a projected graduation date, otherwise put
    your graduation date. Include your GPA if it is excellent. Include any significant
    honors you you have received. If you took any classes particularly relevant to
    the jobs you are applying for, make a note of them. You may include your high
    school in this list, if you think it is important to mention⁵³ .


    For work experience, include only what is a) interesting and/or b) relevant to
    industry. Dog walking, babysitting, selling hot dogs at the fair may be your most
    recent work experience, but if it is not applicable to industry, then why should
    an employer care? Write a short description of your responsibilities under each
    role. List your roles in reverse chronological order. This is the most important
    section of the resume, so be impressive.


    > ⁵³ Especially if you were valedictorian/salutarian and can make a note of that.'
  merge: -1
