  md: 'Chapter 22 - The Many “Don’ts” Of Powerpoint - 225


    # # Chapter 22 - The Many “Don’ts” Of Powerpoint


    In 2007, I had the opportunity to pitch a game idea my group was working on senior
    staff at EA Tiburon. I had given many presentations since I started working there.
    I enjoy presenting ideas - most designers do. I had studied the art of giving
    presentations long before it was part of my career. The things I have learned
    up this section of the book. I stayed late the previous nights before the pitch
    polishing the flow of the presentation and practicing it in my head so I wouldn’t
    have to refer to notes too often. I knew the senior staff from previous work,
    but still I had butterflies.


    The day of the presentation came and I went to the conference room early. I had
    a backup of the slides (“the deck”) on a thumb drive in my pocket in case the
    network was down. I made sure my videos were working as intended. I tested my
    wireless remote. All was well.


    The staff made it to the meeting late, as usual, talking still about whatever
    was the topic of their previous meeting. When they were settled, my boss introduced
    me and I started. I was about thirty seconds into the presentation when the executive
    producer’s Blackberry came out. He started checking his mail. Was I boring him?
    Okay, I’ll get to the meat of the presentation. I won’t screw around.


    Five minutes in, I’m really rolling. I’m telling a story about the heart of the
    game and the executive producer looks up and stops me.


    “Zack, hold up.”


    I stop.


    “This slide is just an image.”


    I look back at the screen for the first time.


    “Yes, it is.”


    “Where’s the content?”


    I pause. “I’m telling you about the content. The slide is just a mockup of the
    idea I’m talking about.”


    He grimaces.'
