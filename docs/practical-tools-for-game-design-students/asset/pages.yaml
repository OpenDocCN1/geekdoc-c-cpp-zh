- img_proc: true
  md: '# Chapter 27 - Broadcasting via Blogging - 311


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_312_0.png)


    Figure 27.2 - © CBS News


    "Unemployed Game Designer". Great. From that I made contact with people from all
    over the world. All from a simple blog post. I am not saying that will happen
    to you, but unforeseen connections happen to those who put themselves out there.
    I''ll mention another time my blog “blew up” for me a little later.


    # What to Write About


    Okay, so I have convinced you. You want to write a blog. Since you are reading
    this book, I assume you are interested in the games industry. There are a lot
    of armchair game reviewers out there - people who are interested in playing games
    and comment on whether certain games are good or not and why. We don''t need more
    of those. Everyone who plays games forms opinions on what they like and do not.
    Making posts that are reducible to “I like this” or “I don''t like this” does
    nothing to differentiate you from hundreds of thousands of other blogs.


    One of differentiating yourself is to write why things work for you or not. What
    design decisions in games worked for you? Why do you think the team made those
    decisions? What kind of commentary does such-and-say about the industry as a whole?
    This provides a more nuanced insight as to who you are as a designer and is much
    more interesting to read than a review.'
