  md: '# Chapter 3 - Software Development Life Cycle - 33


    and often and can evaluate them for fun. Incrementally, on every loop the team
    gets closer and closer and better and better.


    There are different practices for agile development and one of the most popular
    is called “Scrum”. Teaching Scrum fully is beyond the scope of the book. It involves
    setting up specific roles for various people including the “ScrumMaster” and the
    “Product Owner” and puts a focus on solving problems that are endemic to the software
    development process such as marathon meetings and outside interference.


    One of the great metaphors in the Scrum literature is the story of the pigs and
    the chickens. The story goes thus: a pig and a chicken get together and decide
    to open a restaurant. The chicken suggests ham and eggs, but the pig barks. He
    says that the chicken is only *involved*, but the pig would be *committed*. The
    fable is a parallel to the two types of people involved in a project. Chickens
    are involved in the project and provide input or consultation but ultimately it
    is the pigs that need to make the big decisions because they are the ones fully
    committed. Keeping the metaphor alive puts the power of the project in the hands
    of those most instrumental to the project’s success or failure. For example, the
    development team be “pigs” (if they aren’t too offended by the nomenclature) while
    the external stakeholders like licensors would be the “chickens”.


    Agile development is best for user testing as it results in testable versions
    of your software after every sprint or loop. Even with a set deadline, it can
    provide better implementations of software than waterfall simply due to the iteration
    of product when you inevitably meet successes and failures. For more information
    on the method, Schwaber and Beadle’s “Agile Software Development with Scrum” is
    the primary literature.'
