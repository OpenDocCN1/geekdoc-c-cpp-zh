- img_proc: true
  md: '# Chapter 15 - Generating Ideas - 187


    even subconsciously, will hold back and “test the waters” to see what kind of
    ideas are being received appropriately. Then they will use that as a guide for
    the risk-level of further ideas, essentially turning off the “wild idea” center
    for fear of being judged if the idea is not of high quality. Simple body language
    cues such as frowns or raised eyebrows can turn us off and make us feel uncomfortable
    delivering ideas. The research has shown that this affects even folks without
    a conscious level of social anxiety.


    Social Loafing - When I lived in New York City, my fiancée (at the time) and I
    loved enjoying nice days in Central Park. One day, I rented a tandem bike and
    took a couple laps around the park:


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_188_0.png)


    If you’ve ever ridden a tandem bike, the person in front can pedal, steer and
    brake. The person in back can only pedal and pray. When you go up hills, you share
    the work. You can split the work and each pedal equally hard or you can enjoy
    the breeze and let your partner do all the work. If your feet are moving around
    the pedals but not pushing, to any outside observer, it looks like you are working
    just as hard.


    This is the concept of social loafing. In a brainstorm, you will usually find
    that a couple people will provide the lion’s share of ideas. Sometimes these are
    Type-A personalities that compulsion have to dominate every meeting. Sometimes
    these are just naturally prolific idea-people. In practice, everyone else in the
    meeting sits back and these people take the helm. Maybe they do not want to break
    the “flow” of ideas. Maybe folks just want to be polite. In any case, they reduce
    the output ideas by not pedaling as hard as other members.'
  merge: -1
  pgno: 188
- img_proc: true
  md: 'Interestingly, in studies of social loafing, when the researchers would conduct
    exit interviews, the "loafers" always compared themselves to the least member
    of the group, in effect saying: "Well, I didn''t do the least" or "I did almost
    as much as that guy" rather than comparing themselves to the highest producers
    of the group.


    Production Blocking - This is an unfortunate side effect of the human attention
    span. When we sit in a room together and generate ideas, we have to wait for everyone
    else in the room to be silent before we chime in and have our ideas heard. This
    pause is, in essence, limiting individuals from contributing as much as they could.
    In an individual brainstorm, ideas are recorded as fast as they are generated;
    there is no pause.


    We can take these three problems and turn them on their heads to formulate rules
    for a better brainstorm.


    # Electronic Brainstorming


    Many studios use no wikis or other shared software for recording their brainstorms
    because it fixes the aforementioned problems.


    The anonymity of digital systems fixes the evaluation apprehension problem. In
    a digital environment, your contributions can be made anonymously depending on
    the software. Who cares if you throw something dumb into the mix if it cannot
    be traced back to you? If it is impossible to be punished for bad ideas, then
    apprehension should diminish.


    Additionally, digital systems allow for parallelization. This fixes the production-blocking
    problem since multiple participants can contribute simultaneously.


    The downside of electronic brainstorming is that it does nothing to promote team
    camaraderie and can actually exacerbate the social loafing problem since there
    is no accountability for nonparticipants. These negatives have to be weighed according
    to the composition and methods of your team.'
