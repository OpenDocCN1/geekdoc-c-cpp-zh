  md: '# 130 - Practical Tools for Game Design Students


    Putting a dollar sign before either the row, the column name or both will anchor
    them in place to never move when the cell containing the formula moves. In our
    case above, here is the correct way to write the formula: =F($F1*$E5)+F4. This
    anchors the row number of F1 in place. No matter where we drag the cell, the row
    number referenced here will be 1. If we want a little more security, we can anchor
    the column too: =($F1*$E5)+F4. Now that cell reference will always be F1.


    Remove the incorrect entries, add the fix above and drag down the formula. Success!
    Toy with the fudge factor to see how it affects the total.


