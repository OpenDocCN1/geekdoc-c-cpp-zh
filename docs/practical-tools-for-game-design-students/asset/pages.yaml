  md: '# Don''t Read Slides to People


    +   - Don''t read slides to people.

    - They can read faster than you can talk.

    - You probably already read this far.

    - Additionally, when you crowd a slide with text, your salient points get lost
    in a wall of text.

    - Your slides are there to augment your points, not detract from them.


    Figure 22.1 - Yeah. Don''t


    Your slides cannot exist without your narration to guide them.


    # 2. Don''t Make Your Points Through Slides, Have Slides Reinforce Your Points


    If this seems like a reiteration of point one, it is because it is. DON''T READ
    YOUR SLIDES ALOUD. If you must use slide, use it to show supporting facts or figures
    or, in lieu of that, short-text phrases or images that support your ideas.


    The point of giving an oral presentation is not to serve as narrator for your
    slides. It is to convey information in a group environment. Your slides are there
    to support your argument. You are not there to support your slides.


    # 3. Don''t Use Text


    The average Powerpoint slide has forty words³⁵. This is FAR too many. Seth Godin
    puts a cap at six words⁶. Guy Kawasaki at ten⁷. I am not in favor of an artificial
    cap because it limits creativity. My rule is to use as little text as possible
    while still feeling natural.


    > ¹⁵ John Medina, "Brain Rules".

    ⁶ http://setgodin.typepad.com/seths_blog/2007/01/really_bad_powe.html

    ⁷ He also states that a business model should be explainable in ten words.'
