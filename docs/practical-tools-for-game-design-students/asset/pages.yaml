  md: '# Possible Scope Levels of a Design:


    | | | |

    |---|---|---|n| Present (Level 4) | The design is as bare bones as it can be while
    still satisfying the purpose of the design. | Example: Driving in Alan Wake |

    | Market-Standard (Level 3) | The design is at the level that is expected from
    other titles in the market. | Example: Multiplayer Ranking in Uncharted 2 |

    | Market-Leading (Level 2) | The design is at the level of top example of other
    titles of the market. | Example: Cover in Gears of War |

    | Innovative (Level 1) | The design is beyond the level of other titles in the
    market and is something that has never been tried before. | Example: Creature
    Creator in Spore |


    In our example, the lead designer says: “We have a lot of art time for this, so
    you can make it broad, but the entire game is pretty casual so keep the complexity
    low.” In this instance, I would probably choose to go with the “Market Standard”
    complexity. We will deal with the implications of this choice below.


    The systems that will connect: Clearly, from the original proposal, this system
    will be interacting with the gifting system. In addition there may be an inventory
    system. Perhaps you will make salable items? What designer is in charge of the
    economy so you don''t flood your game''s market with free goods? Who do you need
    to contact?


    Assure that none of these statements are contradictory. For instance, if the purpose
    of the design is to have a fully customizable character generator while the scope
    of the design is to be simple, then you will need to meet with your lead designer
    to find out what must give.


