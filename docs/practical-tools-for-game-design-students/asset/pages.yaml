  md: '292 – Practical Tools for Game Design Students


    # Inform / Twine


    If you are younger, you may not be acutely aware of the text adventure games that
    dominated the video game landscape in the 1980s. A text adventure strips down
    the interface to a written description and a prompt where a user can type text
    instructions to move the game along. The seminal text adventure, Zork, from 1981
    starts thusly:


    +   West of House

    You are "standing in an open field west of a white house, with a boarded front
    door.

    There is a small mailbox here.


    The player is then presented with a bracket ">" as a prompt to type. He can type
    anything, but the interpreter will only understand certain commands. These commands
    generally are not enumerated for the user.


    For instance, jump was recognized but in most cases did nothing:


    ```

    >jump

    Are you enjoying yourself?

    ```


    Other verbs confound the engine and throw errors:


    ```

    >contemplate philosophy

    I don''t know the word "contemplate".

    ```


    Figuring what to do was the main player challenge in these games.


    Text adventure games won in popularity when personal computers got powerful and
    cheap enough to display different genres of games that were more visually appealing
    (although the "why" of the decline of text adventures is disputed). But in the
    90s and early 2000s, independent developers rekindled the love of text adventures
    with free and open development of text adventure engines. Competitions and communities
    have burgeed development and the adventures coming out today have fantastic depth
    and are cutting-edge examples of storytelling in games.'
