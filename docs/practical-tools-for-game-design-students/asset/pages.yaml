  md: '# 324 – Practical Tools for Game Design Students


    # Conferences


    One of the single best ways to meet people in the game industry is through conferences.
    Here you can get your business cards into the hands of employers, hobnob with
    developers and students and generally have a good time and learn a bunch. Here
    are some of the the recommended ones:


    # Game Developers Conference - San Francisco, CA


    The Game Developers Conference and GDC is the `Mecca` for game developers. Everyone
    goes, companies spend boatloads to control the press and have the best parts.
    Many of the developers give talks and are generally accessible and in the mood
    to share. There is, frankly, too much to do at a GDC so you will likely miss a
    lot. Year after year, it is the place to be for both aspiring and established
    designers.


    Every year there is a career expo where potential employers collect reams of resumes.
    You can go with the drop-your-resume-off route, but I would recommend going there
    with a laptop with something playable you made on it. Be interesting.


    The first two days of GDC are generally filled with summits and workshops. Some
    very gifted and friendly designers run the Game Design Workshop annually. Many
    years ago, I attended one of these workshops and came out with great new friends
    and renewed vigor for the craft. There’s always something to learn.


    It can be expensive to go to GDC, especially if you are not on the west coast
    of the USA. The ticket to the show is also extremely pricey. One of the ways students
    (and many developers) skirt paying the expensive fee is to be a CA. CAs are volunteer
    conference staff that help with mundane conference jobs like crowd control and
    gophering. CAs get a pass to explore GDC when they are not scheduled to work.


    GDC is generally held in the late winter/early spring.


    # Electronic Entertainment Expo - Los Angeles, CA


    E3 at one time was the center of the gaming universe calendar. Nearly every big
    announcement in the industry was made during the week of E3. But in order to be
    heard in the din of announcements that week, you had to be bigger, gaudier and
    louder than everyone else. This lead to a publisher'
