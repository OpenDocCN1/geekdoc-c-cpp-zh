  md: '# Solver


    This can be really useful rather than doing the guessing and checking on

    y own, what if you need to answer a question that is a little more

    complicated? Solver is an optimization tool used to find maximums or

    minimums under constraints. If you''ve taken an introduction to calculus

    course, you may be familiar with some of the math behind it.


    Solver is an add-on. It doesn''t come enabled with every distribution of

    Excel. It needs to be installed. In earlier versions of Excel, the add-ins dialog

    can be accessed through the Tools menu. In Excel 2010, you access it by

    going to the File tab and selecting Options (for some reason). Then select

    "Add-Ins". Here select Solver Add-In and then "Go". Then click the

    checkmark beside Solver Add-In and hit OK.


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_155_0.png)


    Figure 11.40 - Options/Add-Ins


    In Excel 2010, Solver will be located in the Data tab under the

    Analysis section. Go ahead and find it and you will see this dialog.'
  merge: -1
  pgno: 155
- img_proc: true
  md: '# Chapter 11 - Excel Crash Course - 155


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_156_0.png)


    Figure 11.41 - Solver


    In Solver, you first select the cell that you are looking to maximize or minimize.$12$
    Then you select the cells you wish to change and the constraints you wish to be
    under. Unless you''ve done some basic calculus, this can be hard to see in an
    abstract way, so let us try an example.


    Say you have a number of sources of money in your game and each takes a certain
    amount of time. That is reflected in the spreadsheet below.


    A player can spend time hunting and selling skins, which gives a weak 15 gold
    per hour. Or a player can go to the archery game. That starts out being lucrative,
    but then drops as the player gets tired of the game, he/she start losing money.
    He/she makes 20 gold the first hour, 40 the second, 20 the third, breaks even
    the fourth and 20 the fifth. Or the player can do the quest, which results in
    a treasure chest. He/she gets 50 gold and takes one hour but the player can only
    do it once. How much can a player make in five hours?'
  merge: -1
  pgno: 156
- img_proc: true
  md: '# 156 - Practical Tools for Game Design Students


    How do we model this in Solver?


    First we create a 3x3 table. The first column is labels, the second is hour spent
    and the third is how much gold that yielded.


    | | Hunting & Selling | Hours | Gold |

    |---|---|---|---|

    | 1 | Activity | 0 | 0 |

    | 2 | Hunting & Selling | 0 | 0 |

    | 3 | Archery Game | 0 | 0 |

    | 4 | Treasure Hunting | 0 | 0 |

    | 5 | Total | | | |


    Figure 11.42 - Solver Table


    For the Hunting/Selling gold cell (C2), the formula is simple: 25 * hours. For
    the Treasure Chest gold cell (C4), this is also simple: 50 * hours. Our archery
    game gold cell (C3) will be a little trickier. Get out your algebra/statistics
    skills to model this or just create a long nested if statement along the lines
    of IF(Hours < 3, Hours*20, 20*(Hours-3)). Do you see why that is?¹¹³


    At the bottom of the table, add a cell that sums all of the hours (B5). Also add
    a cell that sums all of the gold (C5).


    Now run Solver from the Data menu.


    The cell that is objective is our total gold (C5). Set the objective to that cell.
    The variable cells we want to change are the number of hours, so select range
    (B2:B5).


    Now the constraints. Constraints will tell Excel what numbers are valid for this
    calculation. First, the total number of hours spent must be between 0 and 5. Select
    our hours summation cell and add that constraint. Also remember that you can only
    do the Treasure Hunt task once, so limit that to one hour.


    > ¹²"Value of" is similar to Goal Seek except that it uses the constraints listed
    below.


    > ¹³We split up the winnings into two parts: the winnings when they are increasing
    (hours one and two) and the winnings when they are decreasing.'
  merge: -1
  pgno: 157
- img_proc: true
  md: '# Chapter 11 - Excel Crash Course - 157


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_158_0.png)


    Figure 11.43 - Sample Constraint


    Also, none of our tasks can be done for less than zero hours and for the sake
    of our example, all of them must be integers. Here are all the constraints (pehew!):


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_158_1.png)


    Figure 11.44 - Constraints Finalized


    Look at our constraints. Do you understand why they are all there? Now hit the
    magic Solve button.'
