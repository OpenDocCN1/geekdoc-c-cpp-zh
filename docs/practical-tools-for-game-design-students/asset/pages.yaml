- img_proc: true
  md: '# Chapter 27 - Broadcasting via Blogging - 313


    I was a big fan of the Splinter Cell series of games, but found problems with
    the fifth installment of the series, Conviction, and wrote a post about dynamic
    differences in it versus earlier games in the series. Nearly a year later, I found
    myself interviewing a high-ranking member of a studio who had worked on Conviction.
    This could have gone very poorly because I was measured in what I had to say and
    back it up with examples, I kept the conversation at a high level of respect and
    I learned quite a bit about their design decisions. Imagine if I had posted something
    like "Conviction sucks and their designers have no clue what they are doing!


    **Lesson Learned:** Prepared to back up anything you say. If being negative, always
    treat it as if you were talking directly to the creator.


    In 2010, I crafted my most widely spread post. It was a series of images showing
    how silly Mario Brothers would be if it used the tropes of 2010: long tutorials,
    achievements, Facebook sharing. The post went viral between my site and the cross
    posting at Kotaku and other sites, the post itself had over a million hits. Even
    a year later, I get a large portion of my traffic from links to that post.


    The post was inspired by design battles I was having at the time, but was not
    a commentary on any specific person or team as it was just meant to be a joke
    and I mentioned as in the post.


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_314_0.png)


    Figure 27.3 - The Go-To Site'
  merge: -1
  pgno: 314
- img_proc: true
  md: '# 314 – Practical Tools for Game Design Students


    Almost immediately when it hit the viral channels (it was #1 on Digg and was all
    over Reddit, Metafilter and other sites) I got people coming up to my desk asking
    if that was my post. I said yes. They would lean in and whisper, “That was awesome,
    but you are going to get fired!” Fired? Why? I checked with HR when I was hired
    and the post was not anything about the company. I didn''t even mention I worked
    there on the blog⁴⁵. Even though I was in the right, I felt nervous.


    The lesson above applies—anything that can be implied as criticism will be. But
    I didn''t expect all the fear I heard from nearly everyone I worked with that
    has since been echoed at other places I have worked.


    **Lesson Learned:** Speak loudly and stand behind what you say. Most people are
    too afraid to do either because they have nothing to say or because they are too
    afraid to be truthful about how they feel. Most people are are boring. Those “you''ll
    be fired” designers are terminally boring. Don''t be boring.


    One final lesson on this topic is that it is a bit of an aside. Because of modern
    culture, we are often given opportunity to comment on wide-ranging topics. While
    nearly everyone claims humility on topics like astronomy or medicine, nearly no
    one expresses humility on two topics that can destroy you professionally: politics
    and religion. Both can make you inspired or angry, but neither should be broadcast
    on your blog or (by extension) your social networks. People have insane prejudices
    when it comes to these topics. Liberals, conservatives, atheists and believers
    have these caricatures of each other. You will immediately disqualify yourself
    from the running of a lot of jobs if you are loud about these topics because people
    will see you as a caricature. Don''t be pigeonholed! Stay away from broadcasting
    your politics or religion. Nothing good comes of it.


    > ⁴⁵ Fun fact: Three months later, I''d be gone from the company. I''ll never
    know if the blog post had anything to do with it. Before that post I already knew
    I wasn''t staying at that studio long so the avenues its wide exposure gave me
    was well worth the stress it caused.'
