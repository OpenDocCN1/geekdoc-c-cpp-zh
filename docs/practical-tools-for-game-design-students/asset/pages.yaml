- img_proc: true
  md: '# 3. Control the Environment


    You spend hours and hours agonizing over your slides, but do not forget the importance
    of the venue itself. Arrive early and test the equipment if you can. Are the screens
    bright enough? Does the Internet connection work? Can the farthest row back read
    your text? These are all things to try.


    First impressions are everything. Research shows we make value judgments of arguments
    before the argument is made based on the likability of the presenter. Shine your
    shoes, shave, do what you have to do to make yourself presentable. That goes without
    saying. But we have all been to a presentation where the speaker spent forever
    just trying to get the projector to warm up, the slides to download or the sound
    to work (God forbid). Be that person. Do not be late. If you are late, you have
    already lost. You will have electors; don''t give them extra ammunition.


    Objectors are not necessarily curmudgeonly people to destroy you and your ideas.
    Sometimes these electors are passive. Their mind wanders. Their Blackberries buzz.
    Heaven help you if you are scheduled to present in the post-lunch food coma period.


    One of the things you can do to help this passive objection is to create an environment
    that helps your argument. Arrange the seating to where you can walk by and engage
    with your audience. Don''t ever present from behind a podium if you do not have
    to. If you control the lights, don''t dim them. This puts people to sleep and
    makes it very difficult for you to judge how you are doing by making eye contact.


    # 4. Have Fun


    While this is not necessarily a planning point, it speaks to something broader.
    Many people are deathly afraid of public speaking. I have my irrational fears,
    but this was never one of them. Think about your message, your purpose and your
    delivery. You practiced, right? You spent a lot of time on this presentation,
    right? Why? What''s your purpose?


    In my pitching design days, my purpose was to create marketable ideas for the
    companies I worked for. Everything else is and was inconsequential. In Dune, Frank
    Herbert has his protagonist repeat the mantra: "Fear is the mind-killer."'
