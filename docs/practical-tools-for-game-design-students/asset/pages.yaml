  md: '# 66 – Practical Tools for Game Design Students


    dangerous that a programmer might see. Appendices in documents are like appendices
    in the human body: easily ignorable unless you have a problem.


    Appendices appear at the end of the document on a separate page and sometimes
    take the form of an FAQ. Appendices can answer questions longer than a footnote
    would afford. Often they serve as helpful reminders of discussions past (“Why
    did we limit the amount players can carry?” or “Why do we make objects disappear
    after they’ve been abandoned for 60 seconds?” Think about the questions the other
    stakeholders who are not actually implementing the system would ask. Place those
    in the appendix. You can do this in a more conversational style than the utilitarian
    method of the GDD proper.


    One of the benefits of using wikis (see later chapter) versus a standard word
    processor is that every page comes with a “Talk” page. If you are familiar with
    wikis already, treat appendices as your “Talk” page.


    # Images


    Pictures are generally a more effective delivery mechanism of information than
    text. As we will discuss further in our Powerpoint section, pictures beat the
    pants off of text when it comes to image retention. In “Brain Rules”, John Medina
    lists off results from a number of studies that suggest the superiority of images.
    In one, adrling images to an oral presentation increased retention sixfold.


    It works just as well in game designs.


    > “Okay, smart guy,” you say. “If images are so great, why does this book have
    so many words?”


    Remember the capital rule: brevity. Which is better at quickly communicating an
    idea: a text description or an image? An image may, in fact, contain too much
    distracting information. It may not be concise at the point you are trying to
    drive home.


    You are describing a level and you want to focus that it is crowded. If you put
    this image in the GDD to show that you want the level to feel like a crowded Asian
    marketplace:'
