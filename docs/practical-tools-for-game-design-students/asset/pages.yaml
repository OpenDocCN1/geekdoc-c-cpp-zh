- img_proc: true
  md: '# Chapter 29 - Networking - 325


    arms race where everyone was spending their entire marketing budget trying to
    outspend everyone else at E3. This lead to a armistice between publishers that
    briefly shut down the show to only retail buyers and other connected individuals.


    E3 has since relaunched and grown to share the spotlight with GDC. For students
    who can get passes (see your school for a vouch letter), it can be an opportunity
    to meet with some members of the industry. When I worked in the last “big” E3
    in 2005, I was always more than happy to discuss life with the few students who
    trickled in our booth rather than the tired media and skeptical competition to
    whom I had to repeat the company line again and again.


    Be sure who you are talking to is is on the development team and not a hired marketing
    figure or part-time contractor hired for the show as many of the people on the
    show floor are not involved in the actual making of the games at all!


    Of course there are tons of other conferences worth your time like PAX, Gamescom
    and DICE. Keep an eye on Gamasutra and other industry sites for the latest.


    # The One Rule of Conference Going (For Students)


    If you are a student, I must address the One Rule:


    > Do Not Ask For A Job.


    That seems counterproductive, doesn’t it? You need a job. They might have a job.
    Why not? (Oh! By the way, this doesn’t apply to HR people you meet. These folks
    are asked to field these questions.)


    The answer is: it puts the developer in an awkward situation. He/she doesn’t know
    you personally. He/she may not even know what job positions are open or if they
    are currently being filled. He/she cannot promise anything and cannot stick to
    you since he/she does not know you. The most awkward situations have happened
    when students have asked me straight on to get them a job like I owed them something.
    Developers you do not know do not owe you a thing.'
