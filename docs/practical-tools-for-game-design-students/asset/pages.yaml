  md: '# 72 – Practical Tools for Game Design Students


    # Comments and Change Tracking


    Most game development happens in a team setting. Often these teams can get huge
    (as we covered earlier). As such, you will need to keep track of the comments,
    notes and suggestions of numerous stakeholders on your documentation. Since the
    purpose of the document is to explain features with brevity, you don''t want a
    bunch of suggestions crowding up the text. We can markup the text avoiding these
    problems with the Comments feature in Word. Comments are a lot like footnotes
    in that they are an inline reference to external text.


    # Adding Comments


    Inserting a comment in Word is amazingly simple. Place your cursor at or highlight
    the area where you wish to make the comment. Click on the Review tab and then
    “New Comment"


    | References | Mailings | Review | View |

    |---|---|---|---|

    | | Delete | | Final: Show Markup |

    | | Previous | Show Markup |

    | New Comment | Track | Changes | Reviewing Pane |

    | Next Comment | | | Tracking |


    # 6.32 - The Review Tab and New Comment Button


    A comment balloon will appear in the side margin. Type away. Click outside the
    comment balloon or press Esc when you are done.


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_73_0.png)


    # 6.33 - A Comment


    It can be very helpful to use the commenting tool to point out areas that need
    clarification or just don''t make sense. For broader concerns about a feature
    or document, it is best to place have these highlighted at the start or end of
    a document or raise these concerns personally outside the document.'
