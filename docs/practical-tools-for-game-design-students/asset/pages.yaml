    # Moving/Deleting Footnotes


    Even though footnotes are reference to specific points, you can still move them
    or cut and paste them like any other element of your document. The footnote text
    will follow, placing itself at the bottom of whatever page has the reference.


    Deleting a footnote is as easy as deleting the inline reference number. Delete
    the little ‘1’ in your main document and all the text attached to it ‘1’ goes
    flying into the void with it.


    # Appendices


    Footnotes are nice, but they are largely more relevant for notes that belong inline
    but result a cluttered look if left in the document proper. Game design is a messy
    field with a lot of opinion and arguing. Often squabbles end up with both sides
    claiming partial victories and demanding something of theirs be placed in the
    GDD. Appendices allow you to say “Oh, yeah, I put that in the GDD!” without actually
    putting that idea somewhere'
