    # Formatting Data


    Strange spreadsheets can be a confusing place. It is almost assured that in your
    first days in the industry you will be emailed or linked to a spreadsheet with
    thousands of rows and dozens of columns. In my experience these awful, nasty spreadsheets
    mostly they don''t have to be eye-gougingly awful if you format your data in a
    pleasing way.


    There are many different kinds of data that Excel can handle. There are standard
    numbers, percentages, currencies, dates and strings, among others. One of the
    first techniques you need to know is how to let Excel what kind of data it is
    looking at so it can format it appropriately.


    Here is a bunch of ugly looking data. It is ugly because the number of digits
    after the decimal point varies and is mostly more than we need to see. At least
    I gave the data bold headings! Often you won''t even get that.'
