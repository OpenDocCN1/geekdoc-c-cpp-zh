    also use a similar dynamic system.

    11. Join a game jam like the Global Jam or Ludum Dare. (See Game Jams at the end
    of Chapter 33)


    # Summary


    +   * The way to become a designer is to design. It is a necessary but not sufficient
    condition.

    * The only way to become a good designer is to make things.

