  md: '# Part Five – Get Your Hands Dirty


    # Chapter 26 – On Being Done


    In the opening chapter of Art of Game Design, Jesse Schell claims it is easy to
    become a game designer. He advises to simply say “I am a game designer” and then
    let yourself create games. Both aspects are essential.


    Many “game designers” I know no longer make games. They talk about games, they
    manage game projects, they play games but they don’t make them. They have been
    game designers in the past but no longer make games. It is a problem I deal with
    now that I am an educator as a matter of self-identity.


    Some self-styled game designers rarely make games. I ran into a few in my time
    at EA, but they are in every big company. They make some game-related decisions,
    but they are really producers, making decisions about teams and feature priority
    and so forth. They don’t make stuff, they make decisions about stuff.


    You cannot be a game designer that doesn’t actually make stuff.


    Some folks are on the other end. They make games all the time, but don’t call
    themselves game designers. Nearly every engineer I have worked with has been a
    game designer, but refuses to call him or herself one. They make decisions about
    how the game will play, run and feel. How are they not game designers? They just
    do not believe that they are.


    By reading this book, you are likely okay with calling yourself a game designer.
    Part one is complete.


    Part two is the rub.


    Go make games.


    In this section, I’ll point you to some ways you can get your hands dirty by exploring
    some tools that let you directly make games. Some require no programming knowledge.
    Others require a pinch of scripting. Some are so extensible that a few developers
    have tackled all the intricacies of the platform.'
