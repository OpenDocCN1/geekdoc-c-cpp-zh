  md: 'imbalance towards creating wealth can flood a game economy with resources and
    cause inflation²².


    You need forces on both the wealth creation side and the wealth destruction side
    to avoid runaway economies. Take a sample MMO for example:


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_181_0.png)


    Figure 14.4 - Inflationary and Deflationary Features


    If you have a number of techniques both adding and removing wealth from your game,
    you can turn any number of dials to adjust in-game inflation or deflation. For
    instance, if it is becoming too easy to buy fixed-price goods or if auctions are
    slowly creeping in average price, a designer can increase the impact of some of
    the “Cash Out” features. Perhaps raise the gold cost to resurrect a character?
    Increase the rake of the in-game auction house? Increase the rate at which equipment
    wears so players have to spend money on equipment?


    The popular MMO Eve Online has an economist on staff just to deal with the complex
    dynamics of virtual economies. You don’t need to be as advanced, but you should
    understand the sources of potential problems with both single player and multiplayer
    economies.


    ²² More on this: Money Supply Impacts on an online economy (2003):

    http://www.flyingscythemonkey.com/Money_Supply_White_Paper.htm

    Also: http://www.mine-control.com/zack/uoecon/uoecon.html'
