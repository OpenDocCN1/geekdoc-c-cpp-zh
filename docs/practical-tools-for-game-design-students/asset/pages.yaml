  md: 'Chapter 9 - Adobe Photoshop / 2D Image Manipulation - 101


    # Using Content-Aware Fill


    Sometimes you will have an image and there will be something right smack in the
    middle of it that makes it inconvenient. Say you have this picture that you want
    to use for a slide:


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_102_0.png)


    Figure 9.8 - Before Content-Aware Fill


    And say you want to remove the legs from it. You could go in and erase the woman
    out, but there would be a large hole where you erased her. You could then try
    to paint over the area in a reasonable way, but that would take a lot of time.
    If you have a copy of Photoshop CS4 or newer, there is a feature that will pretty
    much look like black magic to you the first time you use it. It is the Content-Aware
    Fill.


    Select the woman using the rectangular marquee and then go to “Edit” and then
    “Fill”. In the “Contents” section of the Fill dialog box, select “Content Aware”.
    Hit Enter. Photoshop will likely think for a moment or two as this is a processor-heavy
    operation. What Photoshop will do is take samples from all around the selection
    and make best guesses as to what should be in the selection based on its surroundings.
    It is really quite clever.'
