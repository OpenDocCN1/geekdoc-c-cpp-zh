  md: '226 – Practical Tools for Game Design Students


    “Where are the bullet points? How am I supposed to know what I’m looking at?”


    I''m pretty sure I start sweating at this point. “I... just spent the last minute
    and a half describing it..."


    The executive smiles and puts his Blackberry down on the polished maple conference
    room desk.


    “Your job is to present the slides. I''m not going to listen to you. I''m going
    to read the slides.”


    I have always had a problem with keeping my mouth shut. The following I do not
    recommend to future undergraduates in the corporate world, but one of my main
    strengths is that I will always tell you what I believe unadulterated.


    “Oh,” I said, “Well, I can just make a short document describing this and email
    it to everyone. Then we won''t have to waste everyone’s time finding a meeting
    time and place where we are all free and it will be a lot quicker to just read
    the document than the document read to you.”


    The executive looked impatient. “Just finish the presentation.” He picked up his
    Blackberry and didn’t listen to another word. I was told by the other senior staff
    that attended that the presentation was great and one of the most interesting
    they had seen.


    But the executive producer didn’t come to listen to a presentation; he was used
    to a workflow that suited him: look up, read the wall of text on the slide, then
    spend the next two minutes while the presenter read the slide aloud to check his
    email or play Tetris on his phone. Emailing a pitch document or summary would
    have saved him and everyone else there a load of time and delivered the information
    just as well, but he was so used to bad presenters wasting his time that he set
    up defenses against it.


    This was a disheartening encounter.


    I had a choice after that meeting: I could continue to present in ways that research
    has suggested to be more effective (and honestly, this is way more fun), or I
    could do what everyone does: make slide documents, read them aloud and put my
    audience to sleep in the hopes that it gets through to some people who are used
    to the status quo.


    I chose the former.'
