    # 9. Don’t Create Slide Slide Handouts


    Sitting down for a presentation, the supposedly prepared presenter hands you a
    freshly printed set of handouts, six slides to a page, which shows all of the
    slides the presentation will cover. You look at the front page and you patiently
    follow along in their presentation, right?


    No, of course not. You read ahead, flipping through the pages looking for interesting
    bits. Remember, we process images and text way faster than we can deliver information
    orally. And, in business, we are incredibly impatient. If you want folks to pay
    attention, don’t give them slide handouts beforehand.


    What about afterwards? Because you are designing slides to augment your talk,
    not to give your talk, the slides by themselves wont be useful. Why print it at
    all? Instead create a summary handout that you can give to your audience afterwards
    that contains one or two page version of your points and supporting data. This
    can be designed in a normal word processor, giving you better information density
    and control over your presentation.


    Do not give this beforehand either or it will be read ahead just the same. If
    the handout is not a better way to present the information, why give the presentation
    at all? Just give folks the handout and save everyone’s time!


    # 10. Don’t Act Neutral


    Most presenters try to deliver in a detached way as if they were supposed to be
    neutral and feel nothing about the content. You worked so hard to create this
    presentation/story/argument, own it! Present enthusiastically. Content is important,
    but so is delivery. How do you expect someone to be excited about your idea if
    you don’t appear to be?


    The worst possible presentation style is to appear falsely or unevenly enthusiastic.
    Once I gave a presentation for an idea I thought was not very good (it was not
    my idea, but I was the “presentation guy” on the team). I tried to sell it, but
    when objections came up of which I agreed, I was clearly not at the level of convincing
    enthusiasm established in my other presentations. It was obvious. The best thing
    I could have done was to'
