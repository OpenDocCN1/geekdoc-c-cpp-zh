  md: '# Goal Seek


    Sometimes you want Excel to solve something for you rather than evaluating a statement.
    For these times, the built-in Goal Seek function is very useful. For more complicated
    scenarios, the Excel Add-In called lap Solver is necessary.


    Goal Seek is an automated "guess and check" system. You choose one cell to change
    and one cell with a target value. Excel will then keep guessing and checking until
    your target cell reaches the target value.


    For a simple example, say that you had a set of lap times from some playtesters
    for a racing game. As the designer for that track, you may have a target time
    in mind. Say that you want the average lap time for the average player on their
    first try to be 2:00.


    Here are the results of nine playtests: 1:59, 2:11, 1:58, 1:50, 2:20, 2:04, 1:45,
    2:05, 2:33. What does the tenth playtest time need to be to average 2:00? If this
    sounds like a trivial SAT-style problem, that''s because it is. But if you can
    set up the spreadsheet for this, you can always know what result you would need
    no matter how times you run the playtest.


    Enter the times in column B. Below, I entered the times in seconds because it
    is easier to read and it is more difficult to make simple math errors this way.


    | Run # | Time |

    |---||

    | 1 | 119 |

    | 2 | 131 |

    | 3 | 118 |

    | 4 | 110 |

    | 5 | 140 |

    | 6 | 124 |

    | 7 | 105 |

    | 8 | 125 |

    | 9 | 153 |


    Figure 11.37 - Times'
  merge: -1
  pgno: 153
- img_proc: true
  md: '# Chapter 11 - Excel Crash Course - 153


    Now in cell D2, create a formula that averages everything in column B, and the
    cell below it. Here my formula is =AVERAGE(B2:B1000,D3). The D3 is the hypothetical
    run that Goal Seek will change to find the correct answer.


    Now under the Data tab, find the What-If Analysis button and go to Goal Seek.


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_154_0.png)


    Figure 11.38 - What-If Analysis


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_154_1.png)


    Figure 11.39 - Goal Seek


    Goal Seek consists of three values. First, the “Set Value” needs to point to the
    cell that you want to reach a specific value. “To Value” is the value you want
    the first cell to be. “By Changing Cell” is pretty obvious; this is the cell we
    will be changing to try to get the “Set Value” to the “To Value”. In our above
    example, we want the three fields to D2, 120¹¹, D3.


    Hit OK and watch Excel do its instant magic. 75 seconds is your answer. As long
    as the next tester does the lap in 75 seconds or less, the average be two minutes.
    You can now run Goal Seek a number of times with either the same observations
    or new ones. Say, you don''t want the lap times to go above 2:10. Run a new Goal
    Seek and find the new answer is 165 seconds or 2:45.


    > ¹¹ Remember: we are using seconds as our units.'
  merge: -1
  pgno: 154
