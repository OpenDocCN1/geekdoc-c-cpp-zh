  md: '# 286 – Practical Tools for Game Design Students


    Don''t expect to knock it out of the park on your first pitch. You''ll make some
    embarrassingly bad games. Most designers have the insight to see that a game will
    be bad at some point before the game is finished. What do they do when they reach
    this point?


    Usually, they quit and start something new.


    That''s one of the biggest mistakes you can make. You have to write a novel to
    be a novelist. You are not a novelist if you''ve written a few sentences. You
    are a sentence-ist or a chapter-ist at best. If you haven''t finished a game,
    how can you be a game designer?


    “Nobody tells this to people who are beginners, I wish someone told me. All of
    us who do creative work, we get into it because we have good taste. But there
    is this gap. For the first couple years you make stuff, it''s just not good. It''s
    trying to be good, it has potential, but it''s not. But your taste, the thing
    that you got into the game, is still killer. And your taste is what your work
    disappoints. A lot of people never get past this phase, they quit.\ - Ira Glass


    **Finish what you start.** This will teach you things that no book on design can
    ever teach you. Release these bad games to the wild. Trust me. You can take them
    down later if you get famous.⁴⁶ In the meanwhile, get comments from friends and
    strangers. You will grow as a designer.


    And when you are at a party and someone asks what you do, you can say you are
    a game designer. And when they follow that by asking what you''ve designed, you
    can give them titles (it doesn''t matter that they will never have heard of them)
    instead of sping and saying you''ve never actually finished anything.


    It is very easy to talk about games - what makes them fun, not fun, frustrating,
    memorable, placid, jovial, stuttering, important, trivial, whatever. It is a whole
    other level actually making them.


    Go forth and create.


    > ⁴⁶ Although nothing is ever truly deleted from the Internet, the amount of useful
    feedback you can get on these early games is worth potential future embarrassment.
    After all, if you don''t get better now, you can''t be a superstar later!'
