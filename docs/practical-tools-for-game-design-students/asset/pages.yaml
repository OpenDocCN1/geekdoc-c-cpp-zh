  md: '# 6 – Practical Tools for Game Design Students


    kinds of designers as well. The tools covered in this book will have applicability
    even some of the “application” sections are not particularly appropriate for the
    indie workflow.


    The philosophy of this book comes from the Design Tools class I created at Full
    Sail University. The purpose of the class is to give students exposure to a wide
    variety of tools used in industry such as word processors, spreadsheets, mind
    mapping applications and with special focus on how these tools are used specifically
    by professional game designers.


    In order to cover all the tools I cover in my class, I would need for the students
    to buy something like ten books while only covering a tenth of each. Instead,
    in this book readers get an introduction to all of these tools in one place. But
    more importantly, readers get insight regarding how these tools are used in the
    game industry—something I have found in no other book.


    The goal of many books that cover the technical is to be as deep as the format
    allows. Thus you use thousand-page Word references that cover every possible function
    in depth. This book will not that. Instead, this book will highlight some of the
    most used and most useful functions in these software packages and what use they
    have to someone looking to develop games.


    Why cover a large number of tools at all? Is not human history just a timeline
    of specialization? Perhaps Counterintuitively, the purpose of this book is not
    to teach the tools themselves, but to cultivate designers who know how to learn
    tools quickly and skillfully. Any reference book of this type will become out-of-date
    quickly.


    A designer “on the front lines” may be required to pick up a proprietary tool
    at a moment’s notice. Say a level designer has to take leave of absence. A designer
    familiar with the Unreal Development Kit and familiar with picking up new and
    strange tools will be much more valuable than a designer who has to have his or
    her hand held.


    A designer’s education is never complete. Every year there are new techniques
    to learn, new software packages to familiarize with, new languages to learn, new
    games to play, new mistakes to make, and new genres and titles to experience.
    Every conference I go to—be it the spectacle of the annual Game Developer’s Conference
    in San Francisco'
  merge: -1
  pgno: 7
- img_proc: true
  md: 'Preface - 7


    the intensive workshop at Project Horseshoe in Texas—great designers gather and
    clamor to learn from each other.


    Professional designers know that our learning is never and can be never truly
    complete. It is only by constant study and hard work that we can grow. Imagine
    the differences between the designers of a game from the 1980s - say, the adventure
    phenomenon Zork - versus a designer of one of today''s massive MMOs or Facebook
    games. The world changes fast. Designers love to learn by nature. If you are familiar
    with education of a designer: the elation that comes with breaking new ground.
    If you think everyone else knows everything and you are just a poseur, congratulations!
    You echo the feelings of just about every designer humble enough to know their
    place.


    This book is just a stepping-stone. The real education comes with practice. Only
    by actually designing you can learn design. When you are done with this book,
    put it away for a while and pick up something else will bring your skills closer
    to where you want to be. Then make some games. Fail. Learn. Build. Fail again.
    Learn more. Build more. The cycle never ends and it is glorious. I wouldn''t have
    it any other way.


    Let''s get out our tools.'
