    # Chapter 13 - Probability Tools


    Designers need to have a fundamental understanding of how probability works. Probability
    doesn''t just enter games in cases of rolling random numbers, but also in aggregate
    decision making: what''s the probability of a baseball player getting a hit? What''s
    the probability that there will be greater than X players in such-and-such area?


    Space doesn''t allow for proper examination of probability and statistics for
    game designers, so here is the incredibly condensed version.


    # Basic Probability


    Many non-technical people are afraid of probability because it is math and math
    scares them. But probability is not integral calculus. It is counting. And you
    can count, right? Thought so. Most of the time, probability is about counting
    things that happen and things that do not happen and dividing the two.


    You want to know what the odds are that you will draw an ace from a normal deck
    of cards. This is a simple matter of counting the aces (4) and counting all of
    the cards (52). Divide the two: 4/52 = 7.7%. We represent the probability of an
    event by writing P(Event) and this value ranges between 0 and 1 (or 0.00% and
    100.00%). So we can write the probability of rolling a six on a six-sided die
    as P(Rolling a Six) = 1/6.


    The above example is trivial. Probability gets interesting when you combine events
    together. What is the probability of rolling a 7 when rolling two-sided dice like
    in a game of Monopoly?


    Many people when posed this question would say that 7 is just one value out of
    12 the answer must be 1/12. Some would point out that you couldn''t roll a one
    when you roll two dice, so the answer must be 1/11. But use the tool of counting
    and you will see that...'
  merge: -1
