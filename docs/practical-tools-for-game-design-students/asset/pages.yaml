  md: '# Chapter 14 - Game Theory - 181


    # Exercises


    1. In Excel, generate 1000 random numbers between 1 and 100. Take the average
    and standard deviation of this list. Does the answer make sense? How can you create
    a list of random numbers with the same average but a larger standard deviation?


    2. Say you have a Facebook farming game. Your player gets one farm square per
    level. Every hour, the player can click it and get a random number of experience
    points from 10-20. The player “levels up” at 100, 200, 400, 800 and 1600 points.
    If the player plays optimally, how long will it take the player to reach 2000
    points? What is the distribution? Simulate this in Excel.


    3. How many flips will it take to have a fair coin come up heads four times in
    a row? What is the distribution?


    4. A player has a 1% chance of his or her sword breaking during a battle. What
    is the probability that the sword lasts 100 battles?


    5. You are on a game show with another contestant. Each of you has a choice. You
    can take $1,000 or you can take what is in the box. If you both choose the box,
    neither of you get it. But if only one player chooses, he or she can keep it.
    You cannot communicate with each other and you only play once. If $2,000 is in
    the box, what should you do? If $1,001 is in the box, what should you do? If $1
    million is in the box what should you do?


    # Summary


    +   - Excel is a powerful calculation tool, not just a way to format tables or
    make graphs.


    +   - Using the RAND, IF and COUNTIF functions, you can simulate complex interactions.


    +   - A mastery of the basics of probability can take you a long way in being
    able to analyze game situations.


    +   - Game theory can help us to understand the decisions of our players when
    they are put in the competitive space.'
