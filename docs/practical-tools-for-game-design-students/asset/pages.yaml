  md: '# Pecha Kucha and Practicing


    Pecha Kucha (pronounced peh-CHAK-cha) is an interesting method of presentation
    developed in Japan in 2003. In what is called a Pecha Kucha night, twelve presenters
    present on twelve topics. They are accompanied by a slide presentation of twenty
    slides set to automatically advance every twenty seconds⁴⁵. Every presentation
    is designed to last exactly six minutes and forty seconds (although some go over
    slightly).


    The format is specifically designed to keep presenters brief and on point without
    the crunch of Powerpoint safety. It is certainly not for presentations on deep
    topics. But the constraint is actually quite liberating. Presenters will focus
    more on their unique point and selling versus the libraries of ancillary information.


    When you first set out to try a presentation like this, it will be very difficult.
    "How will I sync the words to my slides if they automatically switch?" "How will
    I fit everything I need to say in without sounding like a rambling spoon?" And
    admitted, it is difficult, which is partially why it is a worthwhile exercise.
    After you give your first successful Pecha Kucha, you will start to see all of
    your longer form presentations in a similar light. You will, perhaps subconsciously,
    get used to editing your content down to only the important bits.


    In short, you will become a better presenter.


    And if it seems like I repeat mantras over and over again, there is one particular
    one that is a universal truth for designers: practice makes perfect. Pecha Kucha
    is one of the most interesting and entertaining ways to practice the art of presentation
    preparation and delivery. As of this writing there were Pecha Kucha events in
    over 400 cities worldwide. You can find a nearby event and volunteer to participate
    by going to http://www.pecha-kucha.org.


    ⁴⁵ For a great introduction to this format, see Daniel Pink''s Pecha Kucha presentation
    on signage: http://www.youtube.com/watch?v=9NZOtO6BkhUg'
  merge: -1
  pgno: 271
- img_proc: true
  md: '# Setting Up Auto Advance


    In Powerpoint, setting your slideshow to automatically advance for a Pecha Kucha
    presentation is easy. First, select all of your slides so that these changes apply
    to every slide:


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_272_0.png)


    Next, on the Transitions tab, locate the Timing section on the far right. Here,
    click the checkbox next to “After” and change the time to twenty seconds or whatever
    your limitation is. If you deselect the checkbox next to “On Mouse Click” you
    won''t accidentally click forward in your presentation, but you also won''t be
    able to skip ahead without using the arrow keys.


    | Sound: [No Sound] | Advance Slide |

    |---|---|

    | Duration: 02.00 | On Mouse Click |

    | Apply To All | After: 00:20.00 |


    That''s it. Test your slides before you present to make sure that the timings
    are correct.'
