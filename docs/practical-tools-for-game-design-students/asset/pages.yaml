- img_proc: true
  md: '122 – Practical Tools for Game Design Students


    # =ROUND(Number), =TRUNC(Number)


    Often Excel will return a function with too much precision for what you are looking
    for. Go back to the grade example. Perhaps your institution only accepts integer
    grades. A 69.9 should be reported as a 70. But you don''t want to go through and
    manually nudge all of the results to their proper place. You can use the ROUND
    function to round to the nearest integer or TRUNC to truncate the number (removing
    the decimal place part).


    Another element that makes Excel statements so powerful is the ability to nest
    statements together. This means that in one cell, we can put multiple statements
    and functions inside each other.


    Take the PERCENTRANK from the previous example. It will give a number between
    0 and 1 as to the student''s class rank. Say we wanted in this in integer form.
    Perhaps the class is curved and the worst performing student gets a zero and the
    best gets a 100. First, we would have to multiply the PERCENTRANK by 100 to get
    the number to fall in the 0 to 100 range. But then we are left with pesky decimal
    places, so we can wrap a function around the PERCENTRANK function. Functions are
    evaluated from inside to outside so the PERCENTRANK happens first. Here''s what
    it would look like:


    ```

    =ROUND(100*PERCENTRANK(B2:B101,B2))

    ```


    Both functions need opening and closing parentheses. This is why the statement
    ends with two end parentheses.


    # =RAND(), =RANDBETWEEN(Bound, Bound)


    You are starting to get good at functions, so I''ll introduce the pièce de résistance,
    the central functions that underlay all of simulation in Excel: the random number
    generator.


    RAND takes no arguments. (It won''t get an argument from me, har har). It returns
    a random number between 0 and 1.


    There''s an important note about Excel to bring up at this point. Every time you
    change a cell, Excel recalculates all the functions in every cell. This means
    that every time you change a cell, Excel will generate a different random number
    for each randomizer function in your workbook. This is the


    > 15 RAND returns in the range [0,1) which means it can return 0 to 0.9999 repeating
    but cannot'
