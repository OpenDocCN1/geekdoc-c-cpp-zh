- img_proc: true
  md: '# 172 - Practical Tools for Game Design Students


    listed with them. All probabilities leaving a box must add up to 1. This is how
    you know know you are covering all events.


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_173_0.png)


    Figure 13.6 - A Decision Tree


    After the first draw, there are nine balls left in the bag, but there may be one
    or two red balls left in the bag depending on whether or not the first pick was
    a red ball. We draw two more boxes for each of the boxes we drew for the first
    pick, determining the red/not red event of the second pick. The tough part is
    defining the probabilities, but again this is only counting. If you get a red
    ball on the first pick, then there is only one left in the bag of nine. If not,
    then there are two red balls in the bag of nine.


    We can multiply all the probabilities from left to right with our rule (because
    the first probability is P(A) and the second is P(B given A)) to get the final
    probability of any particular node. That is shown on the image above. From that
    we can see that the answer to our original question of the probability of drawing
    both red balls on two pulls is 2.22%. Using diagrams like the above can help visualize
    these complex chains of events.


    # One Minus P


    There''s a trick you can use if you are stuck on a probability problem. If you
    know the probability of something you know the probability of that something not
    happening:


    P(A) + P(Not A) = 1'
