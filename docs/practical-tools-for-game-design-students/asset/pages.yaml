  md: '# Headers, Footers and Tables of Contents


    There is one section of GDD writing that doesn’t seem to eschew the artifacts
    of the printed word and that is the inclusion of headers and footers.


    Creating a header or footer is easy: double click on the top or bottom margin
    to create a header or footer respectively.


    Finding something meaningful to place in a header or footer is another issue.
    Many studios like to put their logo, the document title, the page number, the
    word “CONFIDENTIAL” and other ephemera on every page. This is easy to do, but
    hardly effective and counter to the purpose of the GDD. It adds visual clutter
    for the engineer to sift through to find his or her information.


    While it is generally advised not to print out game design documents due to their
    always-changing nature, I have found that adding a page number is helpful in larger
    documents to help track down the location of certain items.


