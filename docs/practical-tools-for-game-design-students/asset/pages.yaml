    # Free Transform


    The last technique I want to mention is the Free Transform. Free Transform allows
    you to move, stretch, skew or rotate any selected image. Highlight the section
    or image you want to select with the Marquee Tool and then press Control and T
    select Free Transform from the Edit menu. You can change the scale of the selection
    by dragging the corners. The cursor changes to a rounded arrow when you hover
    near the corners, clicking and dragging will cause the image to rotate.


    Scaling, moving and rotating are the three most useful Transform methods. You
    can select others (such as Distort) by going to the Edit menu and selecting Transform.


    # Actions & Batch Editing


    I had used Photoshop for a number of years before coming upon this great feature
    that likely would have saved me man-days of labor had I known about sooner.


    Often you will find yourself faced with a monumentally repetitive image task.
    Perhaps you need to resize all of the portraits in your game from 320x240 to 160x120.
    Maybe you need to put a border around all of your images or change them all to
    grayscale or save them all as PNGs instead of GIFs. If you have a lot of images,
    this can be extremely time-consuming.


    Luckily, Photoshop allows you to automate actions and save the workflow for later.
    An action set is a list of commands that can be recorded and played back like
    a tape. First, open the actions palette by either pressing F9 or going to the
    Windows menu and selecting Actions. There will be a bunch of default actions that
    come shipped with Photoshop. I have cleared them all. .


    The action set we are going to create will put a small black border around your
    images and resize them all to a standard 200 pixel width.'
