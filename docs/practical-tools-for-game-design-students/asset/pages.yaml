  md: '# Chapter 1 - Digital Games Industry Overview - 15


    # Chapter 1 - Digital Games Industry Overview


    How does a console game get from an idea to a final product in front of millions
    of gamers worldwide? And why are they so damn expensive? And how do other genres
    such as MMOs or Facebook games differ? To answer these questions, you have to
    be aware of the long chain of stakeholders that deals with the game idea from
    inception to completion.


    In the list below, you will see repeated uses of the words "many", "often" or
    "sometimes". Models of development vary wildly from place to place so here we
    are trying to comment on common structures.


    Many games start with a developer. A developer is a group of creators: designers,
    engineers, producers, artists, sound folks and so on that work to make the actual
    code and art of the game. Examples of developers are: EA Tiburon, Sony Santa Monica,
    Naughty Dog, or Valve.


    Developers often needs to team up with a larger entity to get their game further
    through the process. These entities are called publishers. They serve as a point
    of contact and generally will handle the financing and marketing. Examples of
    publishers are: Electronic Arts, Activision-Blizzard, and Nexon. Sometimes publishers
    will own developers as in the case of Electronic Arts and EA Tiburon or Sony or
    Santa Monica.


    One of the elements that a publisher can help with getting the attention of and
    financing the agreement with licensors. A licensor is any external person or group
    that owns a piece of intellectual property that a developer would like to use
    in a game.


    One example of licensors involves sports games. Most sports games license the
    use of real players, teams and stadiums. Since the leagues and teams these elements,
    developers need permission to use these, usually need to pay large sums of money
    and must abide by certain rules. Licensors are not just the mayor logos on the
    front but can be any element in the game. Games like Forza Motorsport license
    every real-life car found in the game. Games like Grand Theft Auto 4 license music.
    In the NCAA series the Heisman Trophy needs to be licensed every year from the
    Downtown Athletic Club. Publishers have legal and business staff members experienced
    in drawing up the contracts that make these relationships possible.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '![](img/b19cafc6b56054e8f5f6f1c412d479b7_17_0.png)


    Figure 1.1 - Publishers, Licensors and Developers


    If you understand all the different relationships the licensor needs to handle,
    you will also understand why many licensors choose to limit their intellectual
    property to one particular trusted partner.


    Additionally, if you want to create a game on a console like the Playstation 3
    or you need the platform manufacturer''s seal of approval before doing so. Developers
    and publishers do this by interfacing with what is called a console group.


    Why are these necessary? In the late 1970s, the industry was pretty homogenous.
    The hardware markers for home consoles also made all the games. A group of disgruntled
    Atari programmers broke off and formed Activision. Atari sued Activision claiming
    that it was illegal for them to develop games for Atari''s system.


    Once the legal suits were settled, anyone could reverse-engineer a cartridge and
    produce for an Atari system and many did. Even food companies like Purina were
    quickly throwing together games (Chase the Chuck Wagon) that flooded the market
    with poor titles. This, among other factors, almost destroyed the fledgling home
    console market in the early 1980s.'
  merge: -1
  pgno: 17
