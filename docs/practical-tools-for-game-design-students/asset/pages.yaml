  md: '120 – Practical Tools for Game Design Students


    # Formula Operator


    Take the simplest possible formula: one that echoes the value of a cell. In cell
    A1 type the number 14. In cell B1 type =A1. The equals sign is the flag that tells
    Excel this is a formula. What follows the equals sign is what is be evaluated.
    In this example, we tell Excel: “In this cell, put whatever is in cell A1. When
    you hit it enter, you will see that B1 is also 14. Change A1 and B1 will reflect
    that.


    # Basic Math


    Clear all the cells. Type three numbers in A1, A2 and A3. In cell A4, type =A1+A2+A3.
    When you hit it enter, Excel will evaluate the function, adding all three together.
    You can even chain these together. Change A3 to =A1+A2. A4 will still sum all
    of the cells above it! This chaining is part of what makes simulating in Excel
    so simple and powerful.


    # =SUM(Range), =PRODUCT(Range)


    You can use any of the basic operators in functions: + - / ^. You can use parentheses
    to control the order of operations. If however, you have a list of items you want
    to add or multiply that is very large, you won''t want to spend the time typing
    =A1+A2+A3+A4+A5... Instead you can use the SUM function over a range.


    A range is a collection of adjacent cells and is defined by a starting point followed
    by a colon followed by the ending point. If I wanted to sum cells A1, A2, A3 down
    to A100, I could type =SUM(A1:A100). Easy.


    Likewise if I wanted to multiply these cells, I just change the function name:
    =PRODUCT(A1:A100).


    # =MAX(Range), =MIN(Range)


    There are other operations that are particularly useful when discussing ranges.
    The MAX function returns the largest number in a range. The MIN function returns
    the smallest number in a range. Say you have a spreadsheet with 100 student grades
    in cells B2 to B101. To find the best grade, you would type =MAX(B2:B101). To
    find the worst: =MIN(B2:B101).'
