  md: '# The Out-Of-Date Disclaimer


    This book covers a lot of current software, referencing specific methods to achieve
    certain results. Since software is constantly changing with upgrades moving or
    changing functionality, examples in this book may be out-of-date. Copy editing
    a book of a single piece of software is an endeavor enough, but one that features
    a dozen different software packages is a fool’s errand Errata will be kept on
    the book’s website at http://www.hiwiller.com/designtools but if you do not see
    a problem addressed, please let me know via email (zack@hiwiller.com) and I will
    attempt to remedy the situation in the next edition.


    # The Personal Pronoun Disclaimer


    Throughout this book, I endeavor to use a gender neutral “he or she” when using
    a third-person singular. At times, I may slip and use a “he”. Normally, I am not
    one to make an issue out of this. But the game industry has a homogeneity problem
    and it can even be seen in game education. There are vastly more men getting into
    this field than women. In creative fields, we need differing viewpoints and backgrounds.
    I am using this space to make a clear statement that any use of ‘he’ alone is
    not meant to be gender-exclusive but is done out of error or for brevity.'
  merge: -1
