    # Speaker Notes


    Most Powerpoint presenters use their slides as their speaker notes, looking up
    and reading a line to know what to say next. This is absolutely the wrong way
    to present for reasons we have already covered. But in lieu of memorizing your
    presentation (most people, myself included, do not have the skill for that), how
    do you guide yourself through the presentation without broadcasting your info
    to the audience before you say it?


    The speaker notes field in Powerpoint provides a popular way of leaving yourself
    presenting notes. This field attaches a text box that the audience will not see
    to each slide.


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_248_0.png)


    Figure 23.19 - Speaker Notes on an Ugly Slide


    When you present, you will likely be presenting from a laptop hooked up to a projector.
    When Powerpoint notices you have two displays, it makes one display the slides
    and the other display shows things that are useful to the presenter. This display
    can look different on various versions of Powerpoint or Keynote.'
  merge: -1
  pgno: 248
- img_proc: true
  md: '248 – Practical Tools for Game Design Students


    Here''s the look on Office 2008 Mac:


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_249_0.png)


    Figure 23.20 - Office 2008 Mac Presenter View


    It shows the current slide (so you never have to look behind you and talk to the
    wall), the upcoming slide and large-print speaker notes. Other versions⁴² have
    additional features like a Pen button to draw on your slides in real-time, timers
    to note your progress (See Pecha Kucha later) or a slide navigator⁴¹.


    Some presenters eschew speaker notes entirely. On-screen notes require you to
    be behind the podium or screen and stay put, sometimes squinting at notes. One
    alternative is to use old-fashioned index cards. Each card represents a slide
    and is wholly portable so you can walk around and make dynamic contact with your
    audience. You can even use these cards as a proto-slide sorter to best organize
    your presentation by laying your note cards out on a table.


    Physical cards also show a level (perhaps subconsciously) that you have prepared
    for this presentation. Another benefit I have found is that if you fidget card
    like I do, cards allow you to shuffle something without being wholly annoying
    on stage.


    ⁴² For some reason, this feature seems to change drastically with every major
    revision and from Powerpoint to Keynote. Practice with a particular version to
    be familiar.

    ⁴¹ For emergencies: If the projector is showing the audience your notes and the
    slides are being shown on your laptop screen, press X to switch them.'
  merge: -1
