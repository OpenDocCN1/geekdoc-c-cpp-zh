- img_proc: true
  md: '![](img/b19cafc6b56054e8f5f6f1c412d479b7_250_0.png)


    In any case, notes are essential to ease the human tendency to forget. Your notes
    should contain key phrases or facts that help you connect points together. Your
    note cards should not be full sentences or so jam-packed that it is tough to pick
    up information at a short glance. Reading directly from your note cards is only
    slightly less nefarious as reading your slides aloud. Your note cards are a safety
    facts, not a crutch.


    An additional help is to put facts on your cards that support your arguments but
    are not necessarily going to be presented in the presentation proper. I remember
    doing this once for a game pitch. I referenced an obscure game being used at the
    end, someone tried to trip me up saying that the game I cited was a critical success
    but a commercial failure. Luckily, I had the worldwide sales for that title in
    my notes and was able to correct him. worldwide sales for that title in my notes
    and was able to correct him. Everyone looked at me like I was some kind of powerful
    wizard for having information that was not listed on the slides. That kind of
    information is extremely persuasive and makes you look supremely read-up on your
    subject matter.


    # Finding Images


    It is fine to say that you should fill your slides with appropriate and evocative
    images. But how do you do that? There are many sources of high-quality images
    across the Internet that you can use in your presentations.'
