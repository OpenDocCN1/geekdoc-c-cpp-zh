    Figure 15.1 - The Blank Page


    We start with a simple center node from which all of our ideas will be connected.
    From here, we come up with some categories so we can order our ideas. We never
    have to lift our hands off the keyboard. Type what you want and hit enter. A new
    branch will appear. Type and hit enter. A new'
