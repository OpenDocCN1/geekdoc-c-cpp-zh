  md: '# 330 – Practical Tools for Game Design Students


    application that allows you to monitor hashtags. In a standalone viewer like Tweetdeck,
    you can specify columns to return specific hashtags, making a separate feed relating
    only to that topic.


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_331_0.png)


    Figure 30.2 - Hashtag Search in TweetDeck


    Much like retweets in the early days, hashtags are not actually an internally
    supported feature of Twitter, but with continued use they may be some day.


    # Volume


    Now a short comment on form. The rules we talked about blogging hold true for
    Twitter and other social networking sites. But something else needs mentioning
    regarding Twitter.


    A blog has a very “pull” model of readership. Users who want to read your contact
    at this moment make an effort to get it. Twitter, on the other hand follows a
    “push” model—whether users want to hear from you or not at this particular moment,
    your tweets will show up over their feed.


    Some people tweet like a fire hose, twenty or more times a day with whatever comes
    to mind. These tweets push out the tweets of people who post less often with more
    meaningful content. Consider a party where one person screams over every conversation.
    This is the problem.'
