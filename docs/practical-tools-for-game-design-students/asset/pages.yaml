  md: '# Chapter 20 - Quality Assurance


    Quality Assurance positions are popular entry points to those who would get into
    the industry at way they can. QA, as it is commonly abbreviated, is a job role
    that is absolutely critical to the development of a successful title but is often
    characterized by a high turnover workforce with little training and long hours.


    Popularly, QA positions are seen as playtesting positions, yet two could hardly
    be further apart. A QA tester generally does not have carte blanche to breezy
    pausing only to find bugs. Testers are asked to replacing the same systems over
    and over again in attempts to break the game and generate bug reports.


    A bug² is generally a defect with the game. Either a feature doesn''t work in
    the way that the feature is described in the GDD and test cases or an unlisted
    feature breaks down in a noticeable way. For instance, there is generally no GDD
    that says “The game should not crash” but a crash is so obvious and overreaching
    that it must be a bug.


    Bugs have to be compared to some design-based document to evaluate whether the
    behavior the game is producing a bug or a feature. Perhaps the AI''s pathfinding
    is not optimal: it always uses the same route to track down the player. If the
    player knows this, they can break the system. This is a bug! Only the design team
    knows for sure. Maybe it was designed to be breakable!


    > ² Use of “bug” as an engineering term dates back to the 19th century, but is
    popularly misattributed to Grace Hopper and the Harvard Computation Library who
    found an actual moth in a relay causing system errors in the 1940s.'
