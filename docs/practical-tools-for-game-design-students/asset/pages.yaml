  md: '# Chapter 22 - The Many "Don''t"s Of Powerpoint - 227


    The next time (“I presented to that particular executive, we had a joke about
    my style ("Oh, if you didn''t like me having two words on a slide? I''m sorry,
    I''ll use 50% less this time.”) But he was more attentive. He knew what he was
    getting into.


    If you haven''t had a lot of exposure to Powerpoint presentations, consider yourself
    lucky and blessed. Most of them are awful because they are not planned well and
    don''t suit the format. Most presentations don''t need slides, but we are expected
    now to have them, so we take the path of least resistance. We use the default
    Powerpoint template: title, bullets, clip art. And we don''t think about it.


    But there is a better way. Simple tweaks can amplify your message. In this chapter,
    I''ll highlight many of the don''ts of Powerpoint and other slide-making software
    (coined "slideware" by Edward Tufte) and will conversely highlight the ways to
    fix the problem and make your presentations beautiful and effective.


    # 1. Don''t Read Your Slides Aloud


    It is only natural. There''s a bunch of text on the screen and you don''t know
    what to say next. Just read your point aloud to reinforce it, right? No! Research
    has shown that it is more difficult to process information when it is being spoken
    to an audience and presented as text. The reason is simple: we read much faster
    than we talk. We can finish reading the slide in a few seconds while the presenter
    lags behind with his monologue. The two don''t sync up and it causes interference.


    If you have a quote in a slide, it is far better to pause to let the audience
    read it than to read it for them.'
