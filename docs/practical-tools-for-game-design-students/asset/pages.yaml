  md: '# Part Six - Personal Promotion


    As you know, getting into the industry is notoriously tough. In some cases, there
    will be a hundred or more applicants for a single entry-level job. How do you
    make yourself stand out? That is the focus of this section.


    First, unless you live in an enclave of developers like in Silicon Valley or Montreal,
    it can be tough to get to know actual developers. Luckily, we have the tools that
    can get you noticed no matter where you are.


    Your resume will be the first look a human resources department will have as to
    who you are as a person. How can we get that resume moved into the interview pile
    instead of into the shredder?


    We will also discuss a number of ways to get more involved in the industry that
    have the bonus impact of helping you to develop your skills.


    Unfortunately, we are not in an industry where you can get by on just your resume
    alone. It requires work to build and maintain an outward-facing persona that shows
    how truly interesting and special you are. In fact your personal promotion abilities
    may even be even more important than the quality of your work when it comes to
    the complex task of getting hired.'
