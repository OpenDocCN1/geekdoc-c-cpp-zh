- img_proc: true
  md: '# Chapter 11 - Excel Crash Course - 125


    # =IF(Condition, Return a bit True, Return False)


    I have buried this bit under the scads of other functions, but IF is the most
    important function of all. It is a logical function, which means it can evaluate
    between true and false statements. We use it in simulation to evaluate random
    results and we use it in conditionals like scheduling to make sure elements are
    scheduled efficiently.


    The form of the IF statement is simple and contains three parts. The first part
    is the logical test itself, which must always return true or false. What are you
    evaluating? Perhaps you want to know if the cell is greater than the cell below.
    In this case your logical test would be something like A2>B2. If the logical test
    returns true, the whole IF function returns the second argument. If it returns
    false, it returns the third argument. These arguments can just be text strings
    like:


    ```

    =IF(A2>B2,"Greater","Not Greater")

    ```


    Thus if A2 is greater than B2, this cell will have the word "Greater" as its data.
    Otherwise, it will have "Not Greater" as its data. Until you experiment with this,
    and we will later in the section, you may not realize how powerful the function
    actually is:


    # =COUNTIF(Range, Condition),

    =SUMIF(Range, Condition)


    COUNTIF is a clever function that counts the number of cells that meet a logical
    test. For instance, in our game reviews database, how many of the reviews are
    above 70%?


    ```

    =COUNTIF(F2:F5027,">70%")

    ```


    This returns 3,497.


    Note that the logical operation is only the second half of the equation. COUNTIF
    will fill in the left side of the equation of each cell in the range with the
    cell reference, so you only need to supply the comparison. You must include the
    quotation marks.


    As a bonus, let me tell you about the COUNT function, which is limited in that
    it returns the number of cells that have numbers in them. (COUNTA is the name
    of the function that counts anything is in the cell.) But when we'
  merge: -1
  pgno: 126
- img_proc: true
  md: '126 — Practical Tools for Game Design Students


    combine it with COUNTIF or other functions, it becomes useful. Knowing

    that 3,497 reviews are about 70% doesn''t help us. Out of how many is?

    =COUNTIF(F2:F5027,">70%")/COUNT(F2:F5027)


    This returns 69.57%. This means that approximately 70% of games are a

    7.0 (70%) or higher. If we were to create gaps in the data, deleting rows at

    will, this statement would still reflect the right proportion even with the

    gaps.


    There is also a COUNTIFS function that allows you to chain COUNTIFS

    together in a single function.


    SUMIF is similar to COUNTIF except instead of identifying cells, it

    takes over whatever is in that cell and adds it to every other cell it identifies.


    Say we wanted to count the number of reviews in that database for each

    individual system. The platform is in column D and the number of reviews

    is in column G. If we wanted to count the number of reviews for the PS2:


    ```

    =SUMIF(D2:D5027,"PS2",G2:G5027)

    ```


    The first argument is the range we are checking, the second argument is the

    criteria we are checking and the third argument is what we are looking to

    sum if the second argument is true. You can leave this third argument out if

    the first and third arguments will be the same.


