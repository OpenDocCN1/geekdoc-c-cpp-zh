  md: '# Chapter 17a - Aside: MDA Framework


    This book is centered around the tools that designers use in the field and thus
    tries to stay away from theory to focus more on practice. I am going to go against
    that general trend in order discuss a theoretical tool that can assist you when
    designing and is particularly helpful when dealing with designing prototypes.


    In 1994, veteran designer Greg Costikyan penned an article in a British role-playing
    journal titled (in homage to sci-fi writer Harlan Ellison) “I Have No Words and
    I Must Design” which lamented the lack of formal definitions in the field of game
    design and attempted to start an examination of possible definitions.


    Years later, in 1999, Doug Church (of System Shock and Thief fame) penned an article
    for Gamasutra called “Formal Abstract Design Tools” which also attempted to answer
    the question of how we explain this magical experience one getting gaming. Inspired
    by the work in that article, a “framework” called MDA was developed with the work
    of designers Marc LeBlanc, Robin Hunicke and Rob Zubek.


    | Rules | System | "Fun" |


    Figure 17a.1 - The Less-Formal! Version


    Let us look at a board game as an example. All that you are presented with when
    you buy a board game are the pieces and the rules. A consumer reads the rules
    and plays the game by exercising those rules. When he or she does, those rules
    become a system. We see holes in rules solely by examining them, but by how they
    play out to become a system. And then that system elicits some sort of response
    from the player. In many cases, we just aim for “fun”. But that is too vague.
    Sometimes we aim for tension or horror or drama or to make a societal or political
    point.


    This three-tiered system is the MDA framework. Except instead of the above we
    have these three more expensive words:'
