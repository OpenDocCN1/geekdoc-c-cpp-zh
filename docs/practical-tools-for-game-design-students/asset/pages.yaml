  md: 'It is tempting to tweet too much since it is so easy to do, but do try to gauge
    the “tempo” of your follows and match accordingly. I won''t give a hard and fast
    rule for number of “broadcast” tweets per day, but if you notice less and less
    people following you, this could be the reason. Lower the volume.


    # Facebook


    It is likely that you already have Facebook. Facebook is not as useful for meeting
    industry folks because because it requires confirmation to be connected. Thus,
    Facebook is a great tool for staying connected with people you already know while
    Twitter is great for learning new things from new people.


    Of course, one realm where Facebook excels is in embedded games. Zynga and others
    make a multi-billion dollar business on games hosted on Facebook. If you are not
    familiar with them, you should register a Facebook account just to see what the
    fuss is about. If you are considering developing Facebook games, these generally
    require PHP or other server-side scripting experience and use a Flash front-end.
    The Facebook API is free to access and use.


    Since Facebook is more private, it tends to lead users into a false sense of security
