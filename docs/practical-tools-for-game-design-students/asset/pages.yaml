    You will find out that this is incredibly useful when using formulas.


    # Formulas


    Formulas are the most powerful aspect of Excel. Formulas allow you to ask Excel
    to evaluate a statement: what''s the average of all these items? How many times
    does this statement show up? What is a random number between one and one hundred?


    Most formulas refer to a name. For instance, the top-leftmost cell is A1. Columns
    to the right are alphabetic, while rows below are numeric. So the second row and
    the second column meet at cell B2. This is elementary, to understand when talking
    about cells.'
