  md: '# 174 – Practical Tools for Game Design Students


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_175_0.png)


    The normal distribution is the granddaddy of statistical distributions. A variable
    that is normally distributed fits in a type of bell curve like this:


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_175_1.png)


    The normal distribution is important because it happens so often in nature. Additionally,
    it is important because of what statisticians call the central limit theorem which
    underlays a lot of the assumptions in statistics and is just all-around handy.
    The normal is often applicable to games. For instance, the location of a bullet
    shot in an FPS is generally normally distributed around the crosshairs. The bullet
    is most likely to hit where'
