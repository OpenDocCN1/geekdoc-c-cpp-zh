  md: '# Board Games


    Perhaps you were taken aback by this section header? Here we are talking about
    IDEs with development costs in the millions and yet I bring up board games?


    Indeed I do.


    Many games are about decision-making, about analysis, about math, statistics,
    flow, psychology, participation.


    Good games incorporate many of these elements.


    As we talked about the analog prototyping chapter, the bonus to making board games
    is speed. Without having to learn a new development environment and language,
    I can use some dice, markers and paper to create an idea for a multiplayer environment
    in a few minutes versus a few days in digital form. If I want make changes, I
    just scratch out some rules instead of having to re-code and track bugs.


    The drawbacks of board games (or analog games) is of course, the lack of scalability
    and the lack of immersion. Board games need to be physically published to get
    them into the hands of many, whereas a Flash game can be put on a server and enjoyed
    by millions overnight. Board games require player imagination whereas digital
    games can often be quite literal in showing the player what is happening.


    Many digital proponents scoff at analog games for being niche partial fulfillments
    that video games can perform. They downplay their importance. To them I have two
    words: Dungeons and Dragons.


    Rare is the game that does cite Dungeons and Dragons among its influences either
    in feel or in mechanics. We have covered the d20 system earlier, but what is your
    modern shooter but a twitch-based version of a ranged Dungeons and Dragons battle?
    What is your modern RPG but a DM-less module? Dungeons and Dragons did not require
    million-dollar voice actors or teraflop-processing multi-core CPUs. It required
    pen, paper, people and books.'
  merge: -1
  pgno: 299
- img_proc: true
  md: '# Chapter 26 – On Being Done - 299


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_300_0.png)


    We can thank Klaus Teuber for the innovation in modern board gaming that in recent
    years has extended to the digital medium. In 1995, his Settlers of Catan instantly
    sparked an international interest in strategic board games with rich dynamic systems.


    The explosion of the Internet and board game designer communities allowed for
    what was largely a European phenomenon to gain traction in the United States and
    other parts of the world. The central locus of the board gaming world is still
    in Essen, Germany at the Spiel festival where nearly every European game is launched
    and where hundreds of hopeful designers come to have their game picked up by a
    publisher.


    # Features of Eurogames


    Why are the so-called "eurogames" so popular?


    **No Player Elimination** - Unlike Monopoly, Risk and other traditional board
    games, Eurogames do not feature player elimination, keeping players engaged with
    the game until the end. This shows in a focus towards eliminating positive feedback
    loops that even trailing players stay interested.


    **Minimized Levels of Luck** - The hardest of the hardcore eurogames abhor randomness
    in all forms, opting to determine victory by strategic and tactical excellence
    on its own. Most eurogames take a more measured stance but generally attempt to
    award victory on the player’s'
  merge: -1
  pgno: 300
- img_proc: true
  md: '# 300 – Practical Tools for Game Design Students


    decisions rather than the luck of the card draw or the luck of the die roll. Some
    games have a high luck element that can be ameliorated by skilled play. This gives
    games a sense of learning and progression lost in truly lucky-based games.


    **Systems Thinking** - Eurogames often contain a number of interconnected systems.
    For instance, in Power Grid the supply and demand of fuel types affects the bids
    for power plants in the auction phase. This leads to highly emergent play, where
    decisions are important enough to have ripple effects across the entire game.
    Balance is a coveted feature as these games are meant to be highly replayable
    and not traditionally solvable.


    **Reverence Towards Design** - Designers names are usually on the box of eurogames.
    Hobbyists can identify the feel of a game based on its designer just as film enthusiasts
    know what a Quentin Tarantino or Michael Bay movie will feel like. This shows
    a focus on craftsmanship and that the idea of the game is something personal and
    important.


    # But Why?


    Most importantly, though. Why are these kinds of games helpful in becoming better
    designers?


    **Force Playtesting** - In aiming to achieve balance, creating a board game requires
    the testing of multiple kinds of players. This testing is sometimes ignored in
    the solo or indie project realm but can mean the difference between an elegant
    collection of systems and a broken idea that was almost there.


    **Force Decision Making** - In digital games, we can often hide the mechanics
    behind pretty assets, cool character design, or impressive sound effects. In board
    games the systems are front and center and there is no hiding behind a pretty
    facade. This forces designers to make tough choices about game dynamics that could
    otherwise be ignored by stuffing them into some milieu that distracts from the
    game’s faults.


    **Remove Affordances of Platform** - When the Wii first came out and low-quality
    shovelware was selling like hotcakes, many designers were confused. Why was such
    dreck selling so well? The shovelware was not any better than anything else on
    the platform!'
