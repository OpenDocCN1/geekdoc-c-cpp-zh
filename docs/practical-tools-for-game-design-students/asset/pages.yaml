- img_proc: true
  md: '# Chapter 13 - Probability Tools - 175


    crosshairs aim, but can diverge to the left or the right, periodically being off
    mark.


    A power law distribution is less often seen but no less important. Power law distributions
    explain many economic systems such as how much wealth is generated per individual
    or how much users will spend in an unconstrained transaction type like buying
    virtual goods in a Facebook game or spending in a casino. A common stating of
    a power law distribution is “the 80-20 rule” or the “Pareto principle.” This was
    developed by the Italian economist Vilfredò Pareto in 1906 who observed that 80%
    of the land in Italy was owned by 20% of the people. Businesses notice that 80%
    of their revenues come from 20% of customers. Games see 80% of their traffic from
    20% of users. There is nothing special about the numbers 80 and 20, and yet proportions
    can work. Another interesting facet of a power law distribution is that it even
    works when you zoom in. Say your Facebook game gains 80% of its users. If you
    look at those 20% “whales” contribute 80% of what all “whales” contribute if they
    follow a power law distribution! Handy!


    Statistical inference is a deep topic. It concerns taking a sample of statistical
    data and using it to make some judgment at some level of confidence about the
    world as a whole. Say you want to know about the playing habits of your players:
    how often they play, what areas they stay in, et cetera. If you don’t have the
    ability to generate this information for all of your players, you can generate
    these numbers from a sample subset of your users¹¹ and then use techniques of
    statistical inference to make guesses about the population of players as a whole.
    This topic is significantly complicated but so enlightening that it is worth the
    study.


    ¹¹ Sampling only a hundred users can provide great detail about the whole population.'
