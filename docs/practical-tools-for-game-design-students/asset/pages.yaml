    # Unions (OR), Intersections (AND) and Independence


    When two events are **disjoint**, meaning that they are mutually exclusive or
    that both cannot simultaneously occur, you can add the probabilities together.
    Say you you are making an RPG and you want to know what the probability is that
    a player is an offensive class. If you can only have one class at a time you can
    just add the offensive class probabilities together:


    P(Warrior or Thief or Barbarian) = P(Warriors) + P(Thieves) + P(Barbarians)


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_170_1.png)


    Figure 13.4 - Disjoint Sets'
  merge: -1
