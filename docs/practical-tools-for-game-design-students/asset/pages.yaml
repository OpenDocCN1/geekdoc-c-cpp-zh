  md: '# 20 – Practical Tools for Game Design Students


    (the local groups are called “chapters”) to publishing white papers and research.
    Chapter groups vary in activity, so it is best to check the group’s website for
    local events. Certain cities like Boston and San Francisco have extremely active
    chapters. The cost is inexpensive for both students and professionals.


    **Middleware Companies** - Middleware companies sell ready-packaged tools for
    developers to use so they can spend their time on elements unique to their game.
    Middleware is available for physics (Havok), engines (Unreal, Unity), bug-tracking
    (DevTrack), and even foliage generation (SpeedTree). Using middleware can save
    a large amount of time and money, but often has a steep learning curve and high
    initial investment.


    # Developer Types and Funding Types


    Certain terms are thrown about with such frequency that it can often be neglected
    that everyone may not know the definitions. In the final section of this chapter,
    I would like to just highlight a few.


    **First Party Developers** are development studios (see the developer boxes above)
    that are wholly owned by a console group and whose games are all published internally.
    The developer, publisher and console group are all three divisions of the same
    company. Examples of this are Nintendo’s HAL Labs or Sony’s Santa Monica studio.


    **Third Party Developers** are the most common. These are different entities than
    the console manufacturers and may develop multiple systems. These may or may not
    be owned by a publishing group. EA Tiburon is a third party developer who is owned
    by a publisher. Double Fine is a third party developer who publishes their titles
    through an external publisher.


    **Second Party Developer** - I do this out of order because this term is almost
    never used. It technically refers to a developer who is not wholly owned by a
    console group but who develops exclusively for a particular manufacturer’s platforms.


    Additionally, there can be stark differences in how a company is run based on
    how the company was funded.'
