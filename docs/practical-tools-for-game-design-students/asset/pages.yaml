  md: '# Part One – The Digital Games Industry


    Any game design student would be remiss to not know at least an overview of the
    industry he or she is trying to break into. Surely you’ve heard the tales of how
    difficult it is to get your first “game job” but game-job-where? What will you
    do?


    Often students have fixed this notion of what the industry is, that designers
    spit out ideas and someone does something mumble mumble and then a game is on
    the shelf. The digital games industry is not only a massively complex organism,
    but also its structure changes greatly from firm to firm. We will try to remove
    the mystery of the beast by going through how a game gets from idea to execution
    to final product and the different people that make that possible.


    We will also discuss the software development life cycle. Creating software is
    a complicated endeavor and there are many competing theories on how to manage
    complexity. We will discuss the two most popular methodologies that you will see
    in games and how that affects the final product.


    The industry changes by leaps and bounds every year. It was only recently that
    the iPhone changed mobile development and a whole new genre and delivery system
    dropped with Facebook games. Five years from now the landscape will change again.
    Being able to understand how shifts affect the development cycle will keep you
    ready to take on the jobs of the future.'
  merge: -1
