    # # Think Aloud and Removing Prejudices


    The reason you use external playtesters and not people familiar with your game
    is that these people are prejudiced. They have a pre-judgment on the state of
    your game. You are the most prejudiced of them all! Your playtesters must come
    to the game as purely as possible to get the best results.


    A simple comment can unravel this purity. A game where the interface was poor
    and players would not know where to go. In a playtest, the tester struggles and
    the observer leans over and says, “Go up where that statue is.” The tester gets
    it and finishes the level. He rates it well! Unless you are planning on shipping
    yourself free with every copy, you cannot give any help or opinions. The only
    times when a playtest has completely stalled. In that case, something is catastrophically
    wrong and should be identified.


    It can be very difficult to shut up when people are struggling with what is plainly
    obvious to you. Researchers have come up with various user-testing protocols to
    handle what an observer and tester should do. My personal favorite when it comes
    to games is called the Think Aloud Protocol first published by an IBM researcher
    in the 1980s.


    In “Think Alouds” as they are sometimes called, the observer sits with the tester
    and prompts them like such:


    > > “In this test you will be playing a level from suchandsuch. I want to go ahead
    and play the level as if you were playing at home. While you are playing, I want
    you to say everything you are thinking about what you are doing. For instance,
    if you are jumping say, ‘I’m jumping so I can get onto that platform because it
    looks like there might be something interesting up there’. Or if you are fighting
    with a bad guy say ‘I’m hiding behind this rock because I think he’ll walk by
    and I can ambush him’. Never stop talking. Always be talking.”'
