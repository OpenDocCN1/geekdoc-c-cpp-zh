  md: '# Chapter 13 - Probability Tools - 171


    as if they had some sort of memory or effect on other events. The wheel does not
    know what it spun before. A coin does not know what is flipped before. A patient''s
    height and weight are not affected by the person who saw the doctor last.


    We call events independent when one event does not make another or less likely.
    Rolling a die is considered the prototypical independent behavior.


    When we have independent events we can find the probability of all of the events
    happening by multiplying their probabilities. For instance, if there is a 50%
    chance of rain tomorrow and a 10% chance the first number drawn tomorrow in the
    state lottery will be a 1, then the probability of it raining AND a being drawn
    is .5 * .1 or 0.05 or 5%. The weather does not affect the lottery picks.


    # Probability Trees


    Much like the addition rule''s dependence on mutual exclusivity, the multiplication
    rule is dependent on independence. But like the more general rule given for OR
    probabilities that always works, there is a more general rule for deriving AND
    probabilities that rock solid.


    P(A and B) = P(A) * P(B given A)


    What does this new term mean? The probability of B given A means: “what is the
    probability of B if A is already decided?”


    Think about drawing balls from a bag. There are two red balls, four green balls
    and four purple balls in the bag. What is the probability of removing two red
    balls in two choices? If draws were independent events, you would say the answer
    is simple: 2/10 + 2/10 = 4/10. But this is not a situation where you can add probabilities
    the first draw changes the number of red balls in the bag.


    We can model this with what is called a probability tree. We split the exercise
    into two discrete events. On the first draw, there are two red balls in the bag
    and eight non-red balls. So we draw boxes for each of our outcomes and arrows
    pointing to them with the probabilities of that event'
  merge: -1
