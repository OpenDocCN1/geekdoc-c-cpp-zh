    # Anchors


    Say you have a table in a spreadsheet like the following:


    | A | B | C | D | E | F |

    |---|---|---|---|---|---||

    | | | Points Given | Fudge Factor | Cumulative Point Time for Action | Time Elapsed
    |

    | User Clicks a Cow | | | 1 | 1 | 0:01 | 0:01 |

    | User Invites a User | | | 100 | | | |

    | User Opens a Treasure Ch | | | 23 | | 0:54 | |

    | User Stops a Monster | | | 17 | | 0:32 | |

    | User Scores a Touchdown | | | 7 | | 1:29 | |

    | User Clicks Another Cow | | | 1 | | 0:02 | |


    Figure 11.5 - A Time Journal


    You have a list of tasks the player will do in a run-through with experience points
    gained from each action. This is an extremely simplified version of the kind of
    analysis commonly done to determine when a player will hit certain game states.


    You could go through each of the cells in the cumulative experience column and
    put the formula = Above Cell + Left Cell in each, but there is an easier way.
    Much like how you can drag a series and have Excel fill in the blanks, you can
    do this with formulas as well. And Excel is smart enough to know that when the
    cell moves down one row to change the formulas so that the inputs go down one
    row.


    Create the first cell at D5 and fill it with the formula =D4+C5. This will add
    whatever is it above it (the cumulative before this row) to. Now highlight the
    lower-right corner of D4 and drag down to D9 or just double-click the bottom of
    D9. Notice how Excel does the work for you! This is very nice with large spreadsheets
    with tons of rows or columns.'
