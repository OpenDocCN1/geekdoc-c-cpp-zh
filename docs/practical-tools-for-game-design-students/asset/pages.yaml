    # Diagrams and Drawings in Word/Powerpoint


    If you are using Paint, you can use the rectangular selector to copy your drawing
    and paste it into a Word document with little fuss. If you want to draw directly
    in Word, there''s a method for that as well. It is called the Drawing Canvas.


    From the Insert tab, click on Shapes. You can drop in a predefined shape from
    here. Or you can go to the bottom and click on “New Drawing Canvas.” The drawing
    canvas gives you a defined space in which to draw your sketch.


    I am personally not a fan of Word''s built-in drawing tools. I find formatting
    within Word to be particularly cumbersome versus cutting and pasting sketches
    and drawings from other programs. You know when you cut and paste from an external
    program that your drawing will always look like what you created. Within Word,
    it can be difficult to keep objects sized and aligned appropriately, since Word
    likes to be “helpful” with its own formatting.


    Of course, sketching is not the only means to quickly generate pictures. Sometimes
    some boxes and arrows are enough. In Powerpoint, it is simple to layout an image.
    Powerpoint contains all of the pre-baked shape types that you see in the Shapes
    menu in Word. By creating your image layout in Powerpoint and then cutting and
    pasting into Paint and then cutting and pasting into Word, you create a round
    trip that locks your image elements into place in a single bitmap while taking
    advantage of Office''s shape tools.'
