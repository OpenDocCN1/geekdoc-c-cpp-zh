  md: '# 198 – Practical Tools for Game Design Students


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_199_0.png)


    Figure 17a.2 - MDA


    **Mechanics** refers to the rules and building blocks of the game,²⁴ **Dynamics**
    refers to how game plays out as a system and **aesthetics** (while a loaded term
    philosophically) refers to the subjective qualities that players experience.


    When designing a game, the only “knob” that you can turn in this machine is the
    mechanics knob. You can affect the rules of the system⁵ and see how that affects
    the dynamics. You do this primarily by playtesting, which we will discuss later.
    Further down the line, you are aiming for some sort of aesthetic response.


    If you are making a survival horror game, you cannot add more “scary”, but you
    can build monster closets (rules as where monsters spawn, mechanics) to create
    situations where the player is trapped having a monster between him/her and safety
    (dynamics), which can in affect “scary” (aesthetics).


    Realizing this is the only knob you are able to turn is a great discovery when
    prototyping. It allows you to examine strictly the effect of mechanics changes
    on the systemic results instead of sort of firing blind in a guess-and-check manner.


    When you are crafting your analog prototypes, you can focus on the dynamic events
    that want to replicate in your final target. Since the mechanics will be different
    by necessity⁶, you must focus on recreating the chosen dynamics.


    If you don''t grasp this right away, that is okay. It can be heady stuff and generally
    has to be learned through experience. Let me take you through a few more examples
    that may help you understand. Notice that the mechanics are the only things the
    designers can directly touch.


    ²⁴ In my interpretation of MDA, I like to include the ‘Milieu’ of the game is
    in addition to the formal mechanics. This is both the art and sound of the game
    as well as the cultural setting and assumptions of the game. These all can lead
    to wildly different dynamic and aesthetic results.


    ⁵ Of parts of the milieu, from above.


    ⁶ In a paper prototype you may move spaces on a piece of paper, in the computerized
    version you may count space by pixels or world-feet.'
