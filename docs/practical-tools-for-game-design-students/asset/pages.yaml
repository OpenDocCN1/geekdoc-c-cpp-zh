  md: '# Chapter 15 - Generating Ideas - 189


    # Mind Maps


    A mind map is a freeform diagram used to record ideas. Mind maps start from a
    center node that then branches out to further related topics. While this is mathematically
    equivalent to a hierarchical list, the radial presentation affords a more non-linear
    approach to its creation and is thus why it is a favored method for recording
    brainstorms.


    Mind mapping software is diverse. The most popular specialist mind mapping software
    on Windows is probably MindManager by MindJet. It is fully featured and easy to
    use but is unfortunately not free. FreeMind is an open-source alternative for
    Windows. On Mac, I like to use the free software MindNode. MindNode has a pro
    version that adds useful functionality, but the free version should be enough
    for experimentation.


    Now it is time to make a mind map. My examples here will be in MindNode but MindManager
    and other software acts similarly.


    Say we are writing an article about the best games of all time and wanted to do
    a brainstorm to shout out and collect ideas and then use the mind map to cull
    the original output down into a more ordered list.


