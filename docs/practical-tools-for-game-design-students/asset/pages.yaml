  md: '# Chapter 28 - Wordpress


    Setting up a blog requires almost no technical skill and is something a student
    can do long before he or she has created his or her first technical project.


    Wordpress is my blog software of choice. It has an incredibly easy setup and is
    extremely flexible.


    There are two methods to start a Wordpress blog. If you have your own web hosting
    service, you can download the Wordpress software and install it yourself. The
    online guides that Wordpress provides to walk you through this process are excellent
    and change with the newest versions, so rather than detail it here, just go to
    the Wordpress Codex⁴⁹ to view the latest instructions.


    If you don''t have your own hosting solution, Wordpress still has you covered.
    Instead of going to wordpress.org, try wordpress.com where they have a wholly
    integrated solution for your blog. Again, they have excellent (brilliant, even)
    tutorials posted for those even a bit petrified by technology at learn.wordpress.com.


    The best way to learn this process is to do it. Before continuing, go ahead and
    get yourself a blog. The rest of this chapter will be based on the wordpress.org
    installation, but the interface should be similar to wordpress.com users and users
    of other blogging packages like Tumblr or Posterous will have similar features.


    # Themes


    Part of the ease of use of Wordpress can be attributed to its wide variety of
    themes and the simplicity of applying and modifying themes. Most blogging packages
    have the ability to theme the look and feel of the blog.


    To find themes, use the Wordpress Free Directory⁵⁰ where hundreds of users have
    uploaded thousands of themes that the community can use. Another popular method
    of finding themes is to look at the footer of a site that you know uses Wordpress.
    Most sites will credit the theme maker in'
