  md: '# Part Four - Generating, Testing & Presenting Ideas


    Open up fandango.com and look at the movies there. Garbage, right? Hollywood must
    be out of ideas, we say. It is a common excuse. It is as if some people think
    that Hollywood can''t come up with an original idea. There wouldn''t be so many
    struggling screenwriters out there if that were true.


    Hollywood is not out of ideas -they have an idea surplus. What Hollywood lacks
    is decision makers who can turn ideas into quality final products that convince
    investors that the new idea is low-risk.


    The same is true in the game industry. Ask any burnt-out designer and they will
    tell you their One Great Idea for a game. Ask a producer, they will tell you their
    epic RPG game. As an artist, they will tell you about their anime-inspired beat-em-up
    surely-million-seller. Here they are, in the industry, but still powerless to
    turn their ideas into products.


    People think designers just sit around, come up with ideas, and kick their feet
    up while the worker bees make it. Not true at all! That initial idea has to be
    communicated and sold to a chain of decision makers. And here is where rigid or
    poorly thought-out ideas die and mediocre vague ideas flourish until they become
    the next Sci-Fi Space Marine Shooter or Michael Bay movie.


    This is a section about ideas: how ideas are generated in the industry, how they
    are tested and how they are sent up (or down) the chain to be sold to decision
    makers and teams. Those that think this process is simple, that the best ideas
    bubble up and objective viewers will find the quality, will be the one grumbling
    in a few years that none of their ideas have sold and that no one appreciates
    their genius.


    You must respect that while ideas do indeed have internal quality, it is the presentation,
    evaluation and execution of those ideas that put them over the top.'
