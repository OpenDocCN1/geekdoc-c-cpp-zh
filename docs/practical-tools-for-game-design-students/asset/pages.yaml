  md: '# Chapter 19 - Playtesting


    It is extremely difficult to look at any of your game creations objectively. After
    all, you were there when they were just sketches. You''ve sat through the bug
    fixing. You''ve followed a plan to the T. Many observers throw out the term "polished".
    But how do you know what to polish? How do you know when something is objectively
    good, not just good in comparison to where it was?


    This is the goal of playtesting. Playtesting answers questions that you are incapable
    of answering yourself. You are too neck-deep in the process to be objective anymore.


    Playtesting is the simple act of setting down an external user or player and letting
    them experience your work and give feedback. Sometimes this will be helpful. Sometimes
    it will be frustrating, painful, obvious, oblivious and dull. Playtesting can
    be excruciating. But it is good for you. It is a like exercise: everyone knows
    they have to do it, but everyone makes excuses as to why they cannot. When our
    games are fat and bloated we pass the blame on others.


    Playtesting is different than quality assurance, which will be covered later.


    First, you and your team will want to cover the scope of the playtesting. Generally,
    playtests are not used to spot bugs per se, but focus on a specific feature or
    features for fun, understandability, length or other metrics. Deciding what questions
    you are not ready to answer allows you to not waste time with levels that are
    not already identified. You will want to a) independently validate design concerns
    and b) become aware of problems of unknown design problems. It is not the role
    of playtesting to come up with solutions to these problems, only identify them.


    There are two methods you can choose: guided or ad hoc. Guided playtests take
    users through specific features to get their feedback. Ad hoc playtests just put
    the user in the game to see what happens with little or no prompting. Generally,
    guided playtests are more useful because they can be done while the game is still
    in progress without playtesters being distracted by bugs and unfinished sections.


    It can be difficult to find useful playtesters. You want to find people who are
    the target market for the game, who understand what they like and not'
