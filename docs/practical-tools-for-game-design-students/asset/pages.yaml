    Embed all characters (best for editing by other people)


    Figure 23.40 - Save Options


    # The Black Slide Button


    At least once in your presenting career you will reach a point where you are

    on a roll, riffing on ideas and generally producing very valuable content.

    But you look out on your audience and everyone has their eyes fixed on a

    slide as if it was a jack-in-the-box ready to pop.


    “Hi? Eyes up here? I''m saying cool stuff!” You may want to scream out

    loud. But that would make you look egotical. You don''t really want them

    to focus on you, but on your message. If they are not paying attention, there

    is a built-in tool in Powerpoint that can get your audience to snap back to

    with limited jarring. I use it often.


    This is the Black/White Slide Button. Press B or W (respectively) and the

    Current slide switches to all black or all white. Your audience then goes all-eyes-on-you
    because their visual obsession has been removed. It works

    wonders! Then, when you are ready to move on, press B or W again to

    toggle back to the slide you were on or space or right arrow to advance the

    slide as normal.'
