  md: '# Unreal Development Kit


    The juggernaut kit in engines at the time of this writing is Epic’s Unreal Development
    Kit (UDK). UDK is based on the Unreal Engine that is used in dozens of AAA titles
    such as the Gears of War series, Bulletstorm, Infinity Blade, and the Tom Clancy’s
    Rainbow Six: Vegas series, the Mass Effect series, and the Batman: Arkham series.


    At first it can seem a bit daunting that these incredibly complex games are created
    with UDK. After all, you are just one person without years of complex training
    behind you (yet). UDK is a deep and complicated tool. But if you want to jump
    into something that will make your resume stand out, something that is of direct
    use to industry, UDK is your best bet. The tradeoff comes in the learning curve
    and the resources needed to complete a full game.


    One of the most innovative aspects of UDK is the Kismet visual scripting tool.
    Elements and behaviors can be tied together visually to create complicated interactions.
    While other engines have elements that are drag-and-drop (GameMaker, Unity, &.,)
    none are as deeply integrated without the use of code as Kismet. Many other engines
    are attempting to make integrated (not plug-in) visual scripting editors that
    are as easy-to-use and comprehensive as Kismet, but time will tell if they meet
    the high bar set by Epic.


    Due to the depth of features, (UDK has detailed animation, physics, terrain, networking,
    rendering systems and much, much much more) Unreal can be a tough nut to crack.
    Where most open engines and languages have a library of books written about them,
    Unreal Engine / UDK literature is fairly sparse. Luckily, the online communities
    do a yeoman’s job of providing help and materials, but it does require moderate
    searching.


    UDK is a free download on Epic’s site and an active community supports new users
    with tutorials and forums (see resources below).


    If you are not overwhelmed by the possibilities, UDK is the most professional
    tool available to students.


    # Resources


    UDK Download - http://www.udk.com/download'
