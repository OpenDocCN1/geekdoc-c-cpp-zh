    maybe I want to know what the highest rated game is. If I were to just do =MAX(F2:F5027),
    this would only tell me the highest rated, not which game rating belonged to.
    With lookup functions, we can find out more.


    VLOOKUP and its brother HLOOKUP are a little complicated, so we will break them
    down step by step.


    The first argument VLOOKUP needs the value it is looking for. Remember that we
    can nest functions meaning put functions inside of functions. So in our above
    example we are looking for the max value cell. The first argument will be a function
    in itself. One common error to note here is that the lookup value must be the
    leftmost column in the table array. You may have to do some reconfiguring of how
    your table is formatted to get this to work. In this example, I am copying the
    scores into the A column.


    The next argument tells VLOOKUP where it is looking. Here you have to put the
    top left-most cell and the bottom-right most cell to let the function know the
    bounds of where it should search.


    The next to last argument tells VLOOKUP what you want to return. In here, we put
    a column number. In the table given to the function in the last argument, which
    column do you want back? In our previous example, we want to return the fourth
    column, the name.


    The last argument is whether or not you want an approximate or exact match. Since
    we want an exact match, we set this to FALSE.


    The form of a VLOOKUP(Value, Range, Column, Approximate) statement is:


    ```

    =VLOOKUP(Value, Range, Column, Approximate)

    ```


    Putting these together we:


    ```

    =VLOOKUP(MAX(A2:S5027), A2:G5027, 4, FALSE)

    ```


    And it returns “The Legend of Zelda: Ocarina of Time”.


    HLOOKUP works the same only it searches rows for a value instead of columns and
    returns values from the column instead of the row.'
  merge: -1
