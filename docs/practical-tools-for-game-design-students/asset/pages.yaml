    95% of the unwanted messages.


    Finding and installing plugins uses a very similar workflow for finding and installing
    themes. Wordpress keeps a plugin directory⁵⁵¹ with thousands of plugins. You can
    search the directory by keyword or tag. When you find one you want to install,
    you unzip the folder into your WordPress installation''s plugins directory and
    then go to the Plugins page on your dashboard. Each plugin that exists in the
    right directory will be listed. Each plugin then has been activated to be used
    on your site.


    There are hundreds of useful plugins, so I will only highlight a few:


    **Google Analytics** allows you to easily tie a Google Analytics account to your
    blog. Google''s tool shows detailed data and information about your users: where
    do they come from, what pages do they view, how long they stay and what search
    terms people use to find your site.


    **WP Super Cache** is a plugin that I only learned about after my site became
    hammered by traffic in the wake of my aforementioned "Mario in 2010" post. WordPress
    has a lot of overhead in it connects to databases to retrieve your posts. If you
    get hammered by a deluge of traffic, it is likely that your server won''t be able
    to handle the simultaneous connections and lapse into a catatonic state. Using
    WP Super Cache takes your popular posts and converts them to a static page that
    is served instead of the high-overhead dynamic version. If you use a hosted solution
    like wordpress.com this is not needed, but if you host on your own, this can be
    crucial.


