  md: '# 312 – Practical Tools for Game Design Students


    Whatever you do, follow the cardinal-rule of personal promotion as often as possible:
    Don’t Be Boring.


    # Temptation


    There’s a temptation to fight whenever you are providing commentary to a faceless
    audience. It is astoundingly easy to see what is going on in the world, point
    fingers and be negative. It is easy to trash games, say they suck, and say that
    the developers are clearly stupid and subhuman. Why not? You’ve never met them.


    Not only is this potential dangerous for your career, but it is boring to read.
    You want to increase your readership in the hopes of making connections. Don’t
    be boring. People don’t care about whether something sucks. They care about insights
    and seeing things in different ways. This, of course, is not true for all blogs.
    For instance, Ben “Yahtzee” Croshaw has made a living slagging games, but he does
    it in a non-boring way and certainly is not in it to make friends and connections.


    Many companies don’t know exactly what to do with bloggers. There’s this line
    between the personal and the professional that is quite blurry. It is important
    to check with the blogging policy of wherever you are applying. You don’t want
    to step on any toes.


    But even then, you can run into problems.


    I’ll try to obfuscate this as much as possible. I got into hot water with one
    of my former employers by writing a blog post on the balancing act of adjusting
    player attributes and making it worthwhile. I mentioned it in light of a feature
    just announced for one of the company’s games at another studio. It didn’t rip
    on it, but the conclusions of the post hinted at skepticism.


    Apparently, a vice-president of the company was searching for links with his name
    (I used a quote of his), found my blog and set it down the chain that I should
    be punished. Besides being shocked at the narcissism of it all, I was beside myself
    at how just citing an article in a blog post could get me in trouble, but it did.
    I removed the post, of course.


    **Lesson Learned:** Anything that can be implied as criticism will be. Don’t criticize
    those you hope to impress.'
  merge: -1
