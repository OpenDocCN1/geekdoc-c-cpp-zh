- img_proc: true
  md: '# 302 – Practical Tools for Game Design Students


    Mentioned earlier, Settlers has all of the hallmarks of the eurogame industry.
    Players race to control the resources of an island in an attempt to build the
    most settlements and cities. Trading is a key aspect of Settlers and leads to
    a number of tactical decisions - should I build somewhere where I can get wood
    or should I just count on one of my opponents trading wood? Repeated games can
    get dull as some decisions can be made on autopilot, but expansions help avoid
    falling into the same ruts.


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_303_0.png)


    Figure 26.3 - Settlers of Catan is © Catan GmbH. Photo by Flickr user “Randy Son
    of Robert”


    Ticket to Ride, Alan Moon, 2004, Days of Wonder


    While some games require a heavy dose of tactical know-how, Ticket to Ride is
    at its surface board gamers call “light”. There is little math to the game and
    little in the ways of negotiation and espionage. Players race to lay their colored
    trains in a line across the board connecting cities listed on their secret tickets.
    Only a limited number of trains can be laid on any track, blocking opponents from
    getting to where they need to go can be a calculated risk. I received this for
    Christmas one year and my parents (who cannot be called gamers by any stretch)
    asked to play it again and again. To use more board gamer nomenclature, Ticket
    to Ride is an excellent “gateway game”.


    Le Havre, Uwe Rosenberg, 2009, Lookout Games'
  merge: -1
  pgno: 303
- img_proc: true
  md: '# Chapter 26 – On Being Done - 303


    Rosenberg is known chiefly for his heavy and complex game about 17th Century farming
    called Agricola. I find his most recent game about a shipping harbor, Le Havre,
    much more compelling. In Le Havre, players each represent a shipping concern and
    can choose between using buildings near the harbor or procuring resources from
    incoming ships. Players take from a number of different resources that can be
    shipped and use them to build buildings or ships or they can convert into other
    goods or money. An interesting facet of the game is that once the game has started,
    there are no random elements. Much like in Chess, your success lies in better
    utilizing the board''s state than over your opponents. But the biggest success
    in the game is the feeling of abundance. In Le Havre, even players who do not
    grasp the strategies can still be successful at building and shipping meaning
    that no one player has the monopoly on fun47.


    There are literally dozens more I could cover and gush about in this space, but
    if it is a development area that interests you, I will leave it as an exercise
    for you to discover the innovation going on in cardboard and paper.


