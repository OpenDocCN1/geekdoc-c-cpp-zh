    more powerful the comparison.


    The form itself requires only a change in thinking, but probably what holds back
    its widespread adoption is identifying the what-is can often require research
    and work. If the presentation is important enough to give, it is important to
    spend the time gathering the data you need.


    Say you are pitching a user interface re-haul. The team is justifiably worried
    about it: deadlines loom, a working version is in the game and it seems like more
    work than its worth.


    You can do the standard approach that most take: state that the transition from
    in-game to quitting the game takes too long and propose a solution.


    But why simply state the what-is? Take a video of the twelve steps it takes to
    get from game to where they want to go. Superimpose a timer using a standard video
    program. Then contrast it to a mockup of a three-step version. I guarantee this
    latter version will be better received. Without directly stating it, you’ve shown
    the what-is and the what-could-be. The audience’s mind fills in the gaps. They
    get excited about the possibilities.


    ³ http://blog.duarte.com/2011/03/nancy’s-talk-from-tedxeast-you-can-change-the-world/"


    ⁴ http://www.americanhetoric.com/speeches/mikihaveadream.htm'
