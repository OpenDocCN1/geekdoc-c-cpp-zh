  md: '# A Warning Regarding Copy and Paste


    Word does its best to preserve the formatting of things pasted into Word documents.
    If you paste an Excel spreadsheet into a Word document, Word will treat it exactly
    as an Excel spreadsheet. Sometimes, however, this results in more overhead than
    you need. Sometimes you need text or numbers or other data without embellishment


    One example of this is copying and pasting images from Adobe Photoshop. If you
    attempt to do this, or insert a picture that is a Photoshop specific format, when
    you try to format the image in many versions of Word, the program tries to take
    you to Photoshop to edit the image instead of using the internal formatting tools
    we talked about in this chapter. An image that cannot be resized without resizing
    the source material can be a pain.


    One simple solution to this problem is to paste said image into a program of which
    Word doesn''t have compatibility problems. When I am using Windows, that program
    is Microsoft Paint. The workflow is this:


    +   1. Select Part of an Image in Photoshop


    +   2. Copy the Selection


    +   3. Paste into Paint


    +   4. Select All in Paint


    +   5. Copy


    +   6. Paste into Word


    This gives the desired results. Alternatively you can save the file in Photoshop
    as a JPG, BMP or some other cross-platform format and then use the Insert function
    in Word. Often these images are not of high enough consequence to keep around
    outside the document, so I paste the bitmap version from Paint. If you care about
    the file size of your document, this may result in a ballooning file size.'
  merge: -1
