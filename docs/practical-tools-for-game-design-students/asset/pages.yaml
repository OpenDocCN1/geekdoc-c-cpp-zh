  md: '# Versioning / Comparing Documents


    Every studio has a different way of tracking versions of documents. Some use dedicated
    versioning software like Subversion. Some use more manual methods. A method I
    always used is to save multiple versions of the document. For instance, my first
    version of ChiliCook would be called ChiliCookook_01.docx. When I know I need
    to make changes, perhaps I have gone through an entire round of comments, I make
    the changes and save a new version called ChiliCookook_02.docx.


    This is an old-fashioned method of version control and can have some issues, but
    it is one of the simplest methods. Perhaps you use this method and you need to
    figure out what changes exactly you made between ChiliCook_03 and ChiliCookook_04.
    Word can help you in this.


    To compare documents, you''ll go to the Review pane and then click on “Compare”.
    You''ll see a dialog box that prompts you for the two files to compare. Choose
    the two documents (in our example, this would be ChiliCookook_03.docx and ChiliCookook_04.docx)
    and then below, choose the types of changes you want to track. Having all of these
    checked can be overwhelming.


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_76_0.png)


    6.36 - Delete All Comments


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_76_1.png)


    6.37 - Compare in Review Pane'
