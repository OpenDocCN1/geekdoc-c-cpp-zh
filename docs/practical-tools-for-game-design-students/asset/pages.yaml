  md: '# Change design documents


    Many design documents are truly collaborative efforts where multiple designers
    are in charge of making changes. In these situations, it can be very helpful to
    see what has been changed in a particular version. On the Review tab in the ribbon
    is the “Track Changes” button. When this is engaged, Word will keep track of all
    additions, modifications and deletions. The default mode when tracking changes
    is “Final: Show Markup”. Switching the dropdown next to “Final: Show Markup” to
    “Final” will remove the annotations of tracked changes and show what it would
    look like to someone printing the document (not that you would ever print the
    document) or to folks not enabling tracking. “Original Show Markup” and “Original”
    will show the document before the changes were made.


    In areas where the text has been changed, word will add a black vertical line
    to the left margin to note that this was a changed area. This line will be removed
    in Final markup.


    A nice feature Word includes is that each unique user will have a different color
    associated with their changes.


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_74_0.png)'
