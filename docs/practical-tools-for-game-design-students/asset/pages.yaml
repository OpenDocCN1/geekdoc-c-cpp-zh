  md: '![](img/b19cafc6b56054e8f5f6f1c412d479b7_146_0.png)


    Your choices are:


    **Column Charts** - Good for comparing aggregate data. The histogram add-in for
    Excel also helps in making column charts. Histograms will be covered a bit more
    later.


    **Line Charts** - Good for comparing data over time.


    **Pie Charts** - Good for comparing delicious percentages of a whole.


    **Bar Charts** - Similar to column charts.


    **Area Charts** - Rarely used due to the low data-ink ratio.


    **Scatter Charts** - Good for tracking individual data points that are order-independent
    over two dimensions.


    **Other Charts** - There is nothing in this category that I would recommend using.


    For our above data of player classes and their attributes, we would choose to
    compare the data using a simple column chart. Highlight the Class and Strength
    columns and click on Column and then the first 2-D column. Excel will generate
    a standard chart.'
