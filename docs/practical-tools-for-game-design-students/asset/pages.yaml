  md: '# Chapter 17b - Aside: The d20 System


    Here I will take an aside to tell you about a system of game mechanics that may
    help you in making prototypes.


    Many of the mechanics in the games you play derive from the grandfather of “game
    designer” games Dungeons and Dragons. In 2000, Wizards of the Coast, the owners
    of the Dungeons & Dragons franchise, released what is called the “d20” system
    under a license that allows other games to use elements of their system. Of course,
    video games have been using concepts from Dungeons & Dragons informally since
    the 1980s.


    The basic concept of d20 is used to compare two game components that may or not
    be equal in a random manner. In Dungeons and Dragons, this covers many events
    that it is called the “Core Mechanic”. Examples of this could be: a player attempting
    to pick a lock, an enemy attempting to strike a player’s armor, or a player finding
    out whether he survived ingesting poison.


    Here is how it works. A player has some sort of modifier (or modifiers). We use
    the example of a player fighting a goblin. Say he is using a “+1” sword and has
    a “+2 strength” modifier, meaning his modifier for this is +3. He/she rolls a
    20-sided dice (hence the name d20) and gets a 19. He/she compares this result
    with the object’s difficulty. Perhaps that Goblin is wearing armor that has a
    difficulty of 15. Since 22 > 15, the attack is a success!


    In short: If (Roll + Modifiers) > Difficulty, then the action is a success.


    How does this apply to you? Take a game as popular as Madden for instance. How
    does the game decide if a player catches a pass when they are covered? The answer
    is a strikingly similar manner to the d20 system. The receiver’s “catch” rating
    is modified and compared with a random roll and a defender’s “pass defense” rating.


    In your prototypes, you can use this system. Use it when you have to compare any
    two (possibly unequal) forces with uncertainty. It is not applicable to every
    situation but it can be used for prototypes where the CPU will math behind the
    scenes and where the encounter needs to be randomly determined.'
  merge: -1
  pgno: 202
- img_proc: true
  md: 'The math savvy will notice that the probability of winning is zero if the difference
    between the difficulty and the modifiers is greater than twenty. Likewise, the
    probability of winning is 1 (assured) if the modifiers are greater than the difficulty.
    In every other case:


    (Difficulty - Modifiers) / 20 = Probability of Losing^28


    And, of course, the probability of winning is 1 - the probability of losing.


    You can use the math to help you choose the difficulties and modifiers. Do you
    want a particular encounter to be difficult or easy? How much so? The “tweakability”
    and simplicity of this system has made it valuable for numerous prototyping designers.


    ^28 This is constrained between 0 and 1. Obviously, you cannot have a probability
    of 360%. Values above one become one. Values below zero become zero.'
