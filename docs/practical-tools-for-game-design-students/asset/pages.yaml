    # The Other Rule of Conference-Going


    I lied. There is another rule. But it is so often broken that it doesn''t get
    as much respect as the one rule. It is this:


    > Respect Everyone.


    At a conference, there will be throngs pushing up to meet whoever made the hot
    game that year. In 2008, it was Ken Levine (Bioshock). In 2011, it was Notch (Minecraft).
    Their shows will be dominated by people telling them how awesome they are. Not
    to be selfish, but what does that get you?


