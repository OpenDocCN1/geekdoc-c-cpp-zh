  md: '# Chapter 18 - Digital Prototyping - 205


    # Scope


    One final issue is much more of a concern in digital prototyping than in analog
    and plagues student and professional projects of all kinds. That is the issue
    of scope.


    A popular software development mantra is “Good, Fast, Cheap: Pick two.\ The implication
    is that you can have something of high quality and on schedule, but it will be
    very expensive. Or that you can have something on budget and on schedule, but
    it will be of poor quality. Or that you can have something on budget and high
    quality, but it will take forever.


    In games this is particularly true: silverware games are fast and plentiful. High
    quality titles are either pushed back constantly or tied to studios that go bankrupt.


    In student projects, one of these variables is fixed: schedule. You likely have
    a due date that is immutable. This is often true in business as well. This leaves
    two inversely changing variables: quality and scope. You choose to make a very
    small feature set at high quality or a very large feature set at middling quality.
    Framed like this, most independent observers would choose to make something of
    high quality. Yet when this truth is not identified, teams try to have all three:
    a high quality game, on schedule with a sprawling scope. This leads to massive
    failure as one or more of these variables spiral out of control.


    The best thing a student can do in one of their projects is to manage scope effectively
    so that he or she will have time to make it of the highest quality possible. This
    is hard to do. “Wouldn''t it be neat if...” is a common stray thought that gets
    everyone in trouble. Yes, it would be neat, but you will have to sacrifice other
    features or quality to implement it. When it is phrased as a trade-off the decision
    is often put the proper perspective. Prototyping helps define vague or out of
    scope features quickly.'
