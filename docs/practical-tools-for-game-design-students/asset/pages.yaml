    have ten or twenty.


    Right-click on the X-axis and select “Format Axis”. Under Axis Type, it is likely
    that it says “Automatically select based on data.” In a text axis, Excel just
    weights every value equally. But in a date axis, Excel will spread out the values
    to compensate for different lengths between the values. Think of each boss as
    a “day”. In the later levels, we waited ten or twenty “days” before taking another
    experience observation.


