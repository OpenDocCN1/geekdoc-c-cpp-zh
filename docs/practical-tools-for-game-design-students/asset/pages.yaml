  md: '# 204 – Practical Tools for Game Design Students


    made$^{29}$.$. That said, the focus is on getting something playable as quickly
    as possible. Only playtesting can gauge whether the idea is fun or not which is
    the whole reason you are prototyping in the first place.


    **Evaluate It As You Go, Making Changes as Necessary** - Prototyping is an iterative
    exercise. You create. You evaluate. You change. You repeat. Sometimes this evaluation
    step happens during the creation step. This can be an "ah ha" moment as the idea
    burns in your subconscious while your conscious mind is trying to understand why
    the code doesn''t compile. Embrace the change!


    **Do Not Make Design Decisions Based on What Is Easy To Make** - Be mindful that
    you are not changing just because an alternative might be easier to implement.
    The point of the prototype is to find fun (hopefully created quickly) not to create
    quickly (hopefully finding fun). If prototyping in a team environment, try not
    to make changes that are not easily reversible without buy-in from the other team
    members.


    **When It Is Fun, Move On** - It is tempting when a design is working to continue
    to refine it until it is perfect, but this can backfire. The refinements can happen
    in the production stage. Once it is fun either move onto another idea that needs
    to be prototyped and let your brain relax on the particular idea or move into
    production mode and make the idea in earnest.


    **Be Creative** - Prototyping is designed to minimize the effect of failures.
    Go wild! Test the boundaries of your creativity. You may fail, but at least you
    didn''t fail in an expensive production environment. That is, make calculated
    risks that have large potential upside. You are likely in this field to be creative.
    Prototyping is the most acceptable arena for creativity!


