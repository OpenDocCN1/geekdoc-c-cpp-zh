    Of course, your research is not just limited to games.


    | Present (Level 4) | Play games that implement similar features and try to find
    what is common between all of them. Can anything else taken away while still preserving
    the purpose of the feature? This requires design by subtraction. |

    | Market-Standard (Level 3) | Play games that implement similar features. Which
    are the worst implementations? What can we do to avoid pitfalls? |

    | Market-Leading (Level 2) | Play games that implement similar features. Which
    are they the best? How can we adapt our system to our game''s requirements? |

