    # Floating Headers


    When you have a large amount of rows or columns, it can sometimes be helpful to
    always be looking at the column headers no matter how far down in the chart you
    scroll. This can be done with a feature called “floating headers” or “frozen panes".


    To select the row you wish to float (this will usually be the top row or rows)
    and click over to the View tab. Select “Freeze Panes” from the Window section.
    You can either freeze your selected rows or freeze the top row. Now when you scroll,
    the top row will always be shown!


