  md: 'Consider slowing down a minute and using the six-step process listed earlier
    to craft some design documentation, not because you need to show it to a producer,
    licensor, or teacher because it will save you time in the long run. Yes, it will
    take you a little longer before you can open up that editor and hack, but what
    is your goal: having fun hacking or creating a final product you can be proud
    of?


    # Exercises


    +   1. Add the table for post-event rewards in the appropriate section of the
    Chili Cookoff GDD.


    +   2. Go to Wikipedia and find a large table. Use the above process to recreate
    that table with simple formatting in Word.


    +   3. Describe a feature of one of your favorite games in the form of a design
    document. That feature should have both "instructional" bits and "content" bits.
    Put the content bits in a table.


    +   4. Take a review of a popular game from a website that focuses heavily on
    the mechanics of the game being reviewed. Separate the review into “code bits”
    that are instructional and “discussion bits”.


    +   5. Trade GDDs from Exercise 4 with another student. Use the comments feature
    to add comments to areas that you find confusing. Use the comments you receive
    to make a GDD that makes more sense.


    +   6. Create a table of contents for your GDD. Include page numbers in the header
    or footer of your document.


    +   7. Use a diagram creation tool like Visio or Cacao to diagram the startup
    sequence of a video game you own. Include which screens require user input and
    which do not and directional arrows to flow.


    +   8. Use a diagram creation tool like Visio or Cacao to diagram a user’s behavior
    when buying an item from an online store. Choose any wish. Map the possible choices
    from the product’s page until the user completes’ the process.'
