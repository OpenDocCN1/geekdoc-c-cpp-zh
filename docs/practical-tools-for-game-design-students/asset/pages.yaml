  md: '# Conclusion - Life As a Designer


    I saved this for the end of the book. I pose this question to you:


    Why do you want to be a designer?


    The answer I hear all the time is: “because I have grown up playing games and
    I don’t know what to do with my life so games sound cool.”


    I have grown up eating burgers, but I don’t want to be a cowboy.


    The industry is not an easy place to be. Jobs are limited. Often, you are stuck
    on poorly managed projects that force you to work sixty, eighty, one hundred hour
    weeks for months on end. Ideas are tied to your identity and to some, their self-worth.
    These ideas are evcerated regularly and it is easy to take that personally. The
    stress level is high. The pay is low compared to similar fields. You may need
    to move every few years as studios are born and die with ‘seasonal rolloffs’ becoming
    accepted practice. And you are competing with everyone else out there for the
    small handful of positions.


    So again, I ask: why do you want to be a designer?


    You have the opportunity to say something, to have ideas that matter. To craft
    the pastime and culture of a new generation.


    If you are in it because you like to play games, quit. Find something else to
    do. Make room for the people who want to change the world.


    If you are in it to change the world, prove it. As a student you have a choice
    to make. You can be ordinary. You can pitch the types of ideas as everyone else:
    rip-offs on Star Wars or Halo or Blade Runner. Or you can use this time to really
    spread your wings and be interesting. Make something that is not what everyone
    else is doing. Take risks. If you fail now, it is not on a multimillion-dollar
    project. The time is now.


    Are you ready to change the world?'
  merge: -1
