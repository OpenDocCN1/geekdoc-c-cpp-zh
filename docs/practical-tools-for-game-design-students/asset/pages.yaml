  md: '# Planning Your Diagram


    A large diagram can easily become unreadable as a wall of text if it is not planned
    appropriately. The ease of moving elements in Visio or its alternatives allows
    diagram creators to crowd their screen with elements leaving spaghetti trails
    of arrows sweeping around the screen.


    Instead, have a plan when creating diagrams. In the diagram above, I had a section
    for the boot sequence (the top left) and then I expanded the diagram to the right
    so that the diagram fanned out for the main menu there would be plenty of room.
    If my diagram was of larger scope, I would have to create more room. “Online Lobby”
    for instance may contain a dozen screens that would have to be crammed in had
    I not allocated space.


    Only by planning ahead you can save yourself the choice of spending the time to
    move many sets of screen elements around or have a visually cluttered and unreachable
    diagram.


    # Alternatives


    Visio and PowerPoint are popular software packages for making diagrams, but recently
    new completely free competitors have threatened their domination. Cacao is a diagramming
    application from Nulab that is particularly slick. Cacao (a take on the Japanese
    word for ‘draw’) rises head and shoulders above for game designers because of
    its ease of use and because it allows real-time collaboration within teams. Invited
    team members can view, chat, draw, and add text to diagrams. This can be incredibly
    helpful in remote development situations where the entire design team is not present.
    This feature can be more helpful when we get to brainstorming later, but in initial
    document creation it can be helpful as well. Many of the diagrams in this book
    were created with Cacao.'
