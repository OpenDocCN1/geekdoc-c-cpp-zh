  md: '# 32 – Practical Tools for Game Design Students


    The waterfall method is very predictable. It can be broken down to tiny measurable
    tasks. The financiers can know exactly when the cycle will end and can plan the
    massive multimillion-dollar campaign around that release date.


    But the drawback is that games are not straightforward. Regular software has an
    easy end state: did my document print? Did my source compile? Did my effect get
    applied? If yes, you are done. Games are different. Games involve challenge, mystery
    and learning. When you start making a game, you have no idea if your implementation
    will be fun until it is made. If you have no qualms about releasing an unfinished
    game, then maybe the waterfall method is for you.


    # Agile Development


    Agile takes the waterfall method and transforms it into an iterative process.
    Instead of being tied to the lockstep of stage after stage, the process constantly
    repeats teams to learn from mistakes and adjust to the uncertain process of game
    creation. If you''ve ever heard the phrase “find the fun”, it is usually in reference
    to an agile development model.


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_33_0.png)


    Figure 3.4 - The Agile Model


    In the agile model you can repeat this loop twice, a dozen times or once a day.
    It is up to the team. If you want to go back to re-specifying a feature, the loop
    will begin again shortly. Teams will have builds to play with early'
