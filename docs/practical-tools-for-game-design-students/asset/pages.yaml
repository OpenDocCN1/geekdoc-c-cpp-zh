  md: '# Chapter 4 - The Game Design Document - 39


    A game design document is any method of documentation that gives instructions
    for building a game or feature. It is important to note that from team to team
    and studio to studio, game design documents can take wildly different forms and
    be constructed from wildly different methods. There are also common misconceptions
    about the form and purpose of a game design document.


    # Common Misconceptions


    Common Misconception #1: The Game Design Document is a repository of all information
    about a game or feature.


    Game design documents are to serve a primary purpose: to inform team members as
    to what they are to build. To this end, there are a number of stakeholders:


    +   - Programmers. Because they need to build the thing.

    - Artists. Because they need context to know what they are creating.

    - Producers. Because they need to be able to gauge how long a feature will take.

    - QA. Because they need to know what a feature looks like when it is working.

    - Other designers. Because their systems need to work with the feature.

    - Licensors. Because they need to ok use of their intellectual property.


    To look like they are producing a lot of content, many designers fill a GDD with
    explanations of all of influences behind a system, backstory, design discussions
    or other ephemer. Here''s the rule of thumb: Unless it directly instructs a programmer
    or artist what exactly to make, leave out of the GDD proper. You may relegate
    it to an appendix (see below) or to another document.


    In some cases, it is necessary to keep a second pseudo-GDD. In cases where you
    have external licensors or overly involved executives, they will want to get their
    hands in what the team is making. In these cases, the GDD'
