  md: '# Guides & The Rule of Thirds


    Photographers have a heuristic called “The Rule of Thirds”. The idea is that if
    you split an image into a 3x3 grid, placing your focal images along one of these
    grid lines results in a more aesthetically pleasing image than the standard “centered
    image” composition.


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_238_0.png)'
  merge: -1
