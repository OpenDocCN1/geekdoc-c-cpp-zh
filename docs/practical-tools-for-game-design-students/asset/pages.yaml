  md: '# Embedding Fonts


    A Princeton study published in the journal Cognition recently found that retention
    is enhanced when text is presented using non-standard typefaces. This suggests
    that using simple easily-legible fonts (like the one used for this book) actually
    act against cognition because they allow the eyes to read too quickly whereas
    more non-standard fonts make the brain slow down and process what it is reading.


    I am not wholly convinced, but there is much to be said about using interesting
    typefaces in your slide presentations. An attractive and unusual font can draw
    plenty of attention:


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_269_0.png)


    Figure 23.39 - A Slide with a Non-Standard Font


    However, when you move your Powerpoint file around to a presentation computer,
    you cannot be certain that the presentation computer has the same fonts. You may
    be surprised to find your text transformed from your perfect typeface to plain
    and boring Arial!


    You can avoid this in Powerpoint by embedding your fonts into the Powerpoint file.
    What this does is save the font file with the presentation. Only certain types
    of fonts (TrueType fonts with proper licensing) can be'
  merge: -1
