  md: '# Chapter 30 - Twitter - 327


    # Chapter 30 - Twitter


    Sean Duncan teaches a class in game studies at Miami University in Ohio. As an
    experiment, he posted this on Twitter on April 5th, 2011:


    Hey, if you work in games, can you tweet hi to my class (#ims211)? I wanna make
    a point about Twitter and the game dev world.


    The response was nearly instantaneous. Twenty-four hours and thousands of tweets
    later, the hashtag (the name for the “ims211” marker put on every post) boasted
    tweets from some games’ most notable folks: George Broussard, Clint Hocking, Jane
    McGonigal and many, many others.


    The points Dr. Duncan was trying to make are that the game industry is tightly
    connected, small, and most members of the social network Twitter. The success
    of the #ims211 conversation quickly proved all three of these assertions.


    The key to Twitter is not that it allows for 140 characters at a time in a post
    (although that is a very nice feature enforcing brevity) but that you do not need
    permission to follow someone. As such, with a little searching and effort, you
    can connect with message hundreds of movers and shakers in the industry for free.


    Look at the positives of Twitter:


    +   Know what the industry is up to, what games devs are playing, what their pet
    issues are. Think: on an interview you will already know the cultural zeitgeist
    of developers. You can use that to tap into what they find interesting.


    +   Ask questions directly to the creators. A direct line to people in the industry
    was before too tough to nab.


    +   Be connected. Dr. Duncan didn''t have to personally ask every developer he
    knew. He didn''t even have to follow every developer. All he had to do was create
    a message and ask politely for it to be replicated. Three degrees of separation
    later and the entire industry had seen it. If you have a need, just ask and ask
    for your followers to retweet your request. Maybe your followers can help you,
    but'
