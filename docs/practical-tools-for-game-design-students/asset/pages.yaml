  md: '9. Use Microsoft Paint or an alternative to create a sketch of a screen''s
    HUD elements (health bar, experience bar, weapon selected, etc.) from a popular
    game. There should be at least ten elements to your sketch. How long did the sketch
    take you? How long would the sketch taken you had you attempted to create it in
    a higher fidelity?


    # Summary


    +   - A game design document is not a "bible" of everything game related, but
    a focused set of instructions to help the team create the game.

    - Like everything else in the game, the design process is iterative. It cannot
    be written and forgotten, but must be kept up-to-date with the current designs.

    - Word can be used to streamline the time between a developer opening your document
    and finding what he/she needs. Add tables of contents and separate instruction
    from content to help developers find what they need quickly.

    - Images can be more helpful than text if done correctly. It doesn''t matter that
    you are not an artist. A simple diagram or sketch can do wonders versus a wall
    of text.

    - Wikis are a new alternative to word processors for crafting and maintaining
    design documents. There are pros and cons for wikis, but either can be used effectively.'
