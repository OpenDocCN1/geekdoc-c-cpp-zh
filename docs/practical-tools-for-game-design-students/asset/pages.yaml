  md: '# Chapter 2 - Industry Roles - 23


    # Chapter 2 - Industry Roles


    You want to be a game designer and you want to work at a development studio. But
    what does that mean? There are many roles one can fill in the industry.


    If you break it down, there are three groups that are essential to game development:
    designers, artists and engineers. In every studio, you will see these three groups.


    The primary misunderstanding new folks in the industry (and especially designers)
    make is that groups are well defined and have a distinct set of responsibilities.
    The popular notion is that designers, artists make assets and engineers write
    the code. In practice, this is usually not the case. The truth is that everyone
    is a designer. For the people “designer” on their business cards, their job is
    to be caretaker of the design and communicate that design amongst the team.


    Designers are in charge of mechanics. They figure out how the rules work, how
    the edge cases are affected, how players participate with the game.


    Artists are in charge of interface. They affect how players interact with the
    game. Interface is any time the game meets the player. This ranges from the explicit
    user interface of the game (the menus, the heads-up display, the iconography)
    to the environments the game is played in to the sounds and other sensations produced
    directly by the game.


    Engineers are in charge of implementation. All the elements in the game that make
    up the mechanics and the interface need to be put together in a way that the players
    can use. In video games, this is writing and compiling code.


    It is important to note that these three roles don’t have to be shared by three
