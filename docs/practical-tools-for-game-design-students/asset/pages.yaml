  md: '# Chapter 32 - Business Cards


    Business cards have an awkward name as they aren''t just for hurried businessmen
    and women. Students and unemployed developers need business cards even more than
    developers with steady jobs. A business card is an advertisement, one that potential
    connections and employers will readily accept.


    I''ll give you a simple formula for making a business card:


    +   - It should have your name and an email address.

    - It should have something that defines you, even vaguely.

    - It should have links to find out more.

    - It should be creative in some way.


    That''s it. Let''s discuss each in detail (except for the first one, because...
    come on):


    It should have something that defines you. What are you most interested in? Story?
    Put "Storytelling Designer" on your card. Levels? Social? What defines you? Enthusiasm?
    Curiosity? Mine says "Professional Game Designer" to insist that I have experience
    and credibility. No one is really going to take your card''s word for it, but
    plant that idea early and often.


    It should have links to find out more. You should have a website by now. Put the
    address on your card. Make sure your work is visible if you have a portfolio.
    I put links to my personal blog and Twitter account on my card because show what
    kind of person I am and how I think. When I see a card without a website link,
    I pretty much assume there''s not much to know about the guy/girl.


    It should be creative in some way. There are two ways this can go wrong. On one
    end of the spectrum, you can have the most boring card in the world that no one
    remembers. On the other end, your card can be so wacky and out-there that it outshines
    your message.


    The point of having a business card is communication. And what do you know? The
    main skill of game design is communication. Like it or not many'
