  md: 'Chapter 23 - Powerpoint - 235


    # Chapter 23 - Powerpoint


    Powerpoint has the ability to be your best friend or your worst enemy. We have
    already had a whole section on how not to use Powerpoint. It is dangerous to put
    that section before the section that teaches you how to use the software, but
    I will trust that you will go back and read “The Many Don’ts” section before preparing
    your next presentation.


    Powerpoint is ubiquitous. You will see it in nearly every studio or publisher
    you visit. Powerpoint has some fully featured alternatives like Prezi and Apple’s
    Keynote, but it is rare to find an office not dominated by Microsoft’s presentation
    behemoth.


    Now we dive into the software itself and see what features can be used to create
    a simple pitch presentation.


    # Setting Up The Presentation


    Before you start adding images and text to the presentation, you will want to
    set up the environment to make creating a great presentation easier.


    # Aspect Ratio


    The first thing to notice is that if you fire up the default presentation, it
    will look like this:


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_236_0.png)'
