  md: '# Chapter 6 - Word Processors


    Modern computing is dominated by the word processor. No other tool has been more
    influential in mass adoption of personal computing. Unfortunately for us, word
    processors are generally designed using the printed page as a metaphor. Game designers
    are not interested in creating printed pages; they are concerned with communication.
    But the ubiquity of word processors like Microsoft Word keeps us shoehorned into
    an old way.


    In this section, we will look at Microsoft Word 2010 for Windows, but the lessons
    should be applicable to many other word processing tools. Only the location of
    the features should change. OpenOffice is a suite of free office software that
    is in popular use and looks to recreate some of the functionality of the Word
    juggernaut. Other alternatives are AbiWord, Apple’s Pages application and the
    massively popular (and free) Google Docs. The fastest growing alternative to Word
    is not a word processor at all—we we will talk about wikis in the following chapter.


    To create a GDD, Word is still the top dog. Next, we will look at some tips and
    tricks to make the most of the software.


    For these hands-on sections, it helps to follow along with the steps. If the exercise
    doesn''t start with a blank document, the file you need will be on the book’s
    website.'
