  md: '# Common Formula Errors


    There are a number of common mistakes made when using formulas in Excel. Unfortunately,
    Excel is not particularly helpful with its error messages.


    #NAME - One of the most common errors is #NAME. Excel cannot find the function
    you are trying to use. What likely happened is that you misspelled the function
    name. Maybe you typed CONUTIF instead of COUNTIF. Or you have a syntax, error
    somewhere else. A? Another reason this can show up is if you are referring to
    an advanced function that is not loaded in your version of Excel. This happens
    with older versions of Excel and functions from Add-In packs.


    #DIV/0 - Despite your desires, Excel will not divide by zero. Somewhere you have
    two cells dividing (sounds like Biology) and one of them can be a zero. The quickest
    way to sniff this out is to look for division symbols and then find the denominator
    cells. Then try to figure out what conditions those be zeros.


    #VALUE - Something is wrong with your arguments. A function expects a logical
    operation and you put a string. Or it expects numbers and you put strings. Or
    perhaps you''ve left out a required argument in a function.


    #NUM - This is usually an easy fix. A formula expects a number but is getting
    text that is not a number. Or you are returning a number that is larger than Excel
    can handle. If you are using a function like IRR that guesses and checks, you
    will get this error if the function goes too long without finding an answer. To
    fix that particular problem, check to make sure your problem has answer and provide
    a better starting guess.


    #REF - This is annoying. Excel is trying to find a cell that does not exist.


    #N/A - This is the most annoying of all because it is a "catch-all" error message
    that doesn''t mean anything. It is likely you are using a function in the wrong
    way, supplying bad arguments or violating some assumption of function (like VLOOKUP
    assumes the lookup column is the left-most column.) It is also returned when you
    are using a searching function that cannot zero in on a value.'
  merge: -1
