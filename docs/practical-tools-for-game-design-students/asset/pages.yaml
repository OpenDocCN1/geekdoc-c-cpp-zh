  md: '# Chapter 31 - Resumes


    You would like to think that when you apply for a job, a knowledgeable and qualified
    team will look at your resume, weigh your pros and cons and then decide to proceed
    from there. Unfortunately, it does not always work like that. Human resources
    teams get hundreds of resumes from all over the world for every job. From those
    hundreds, they are tasked with selecting only a few to follow up on, spending
    only a few seconds on each resume.


    The job of your resume is to get past that first cull.


    Being a student means that you likely do not have any employment experience of
    note, so you have to be a bit creative in how you present yourself.


    First, you want everything on your resume to be either a) **something that stands
    out** or b) **relevant to the industry**. Bonus points if you have both. For everything
    on your resume, keep those two points in mind.


    Many resume help tell you to start with a summary paragraph that explains your
    strengths and weaknesses. These are almost never read. If you must include one,
    limit it to two or three lines.


    My scolding about brevity even makes it into this chapter. A resume should be
    one page only. You would be surprised how many people violate this. A multi-page
    resume doesn''t make you seem qualified, it makes you seem loquacious. And if
    you are padding your resume with fluff for length, that just makes you look naive.


    Never, ever, ever lie on a resume. If it is important enough to lie about, it
    is important enough for an interviewer to ask about. If the interviewer asks about
    it and sniffs out the lie, not only will you be disqualified for that position
    but since the game industry is small, it is likely that your reputation will be
    besmirched farther than just the one company.


    I am going to assume you have no resume and walk through step by step on how to
    draft one. The embellishments you make on this are your own responsibility as
    there is really no formula to an effective resume.'
  merge: -1
