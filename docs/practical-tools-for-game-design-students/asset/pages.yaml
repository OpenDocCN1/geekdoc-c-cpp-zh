  md: '# Chapter 15 - Generating Ideas


    # Brainstorming


    “where do ideas come from” question that opens most texts about brainstorming
    is naive. We have no problem tracking down where ideas come from; they happen
    all around us. When we sit in traffic, at the computer, in the''shower, right
    before falling asleep² - if you are anything like me and many other designers,
    you do not worry about coming up with ideas. Ideas are easy! If you are interested
    in being a designer, you are likely more concerned with how ideas are organized
    and shepherded in the industry. That is what we will cover.


    The most popular cudgel for generating ideas in the corporate setting is the “brainstorm”.
    In your classic brainstorm, members from one or many disciplines that are stakeholders
    in the project get together in a conference room. It may include just designers
    or it may include QA, programmers, artists, producers and executives. The brainstorm
    tends to have a theme or purpose; there is some kind of problem the brainstorm
    session is trying to solve. Someone moderates the meeting and all the members
    just out out while someone else records the proceedings.


    Alex Osborn presented this technique in the 1950s in his book “Applied Imagination”.
    In this book, he coined the term “brainstorming” and its cardinal rules. The rules
    he created mostly carry over to properly-run brainstorming meetings today:


    +   - Quantity, Not Quality - Worry about “good” ideas later. In brainstorms,
    just try to come up with as many ideas as possible.

    - Build on Ideas - The reason the brainstorm is a communal activity is that you
    use other people''s ideas to spur the creation of new ideas from different perspectives.

    - Encourage “Crazy” Ideas - Anyone can come up with the obvious ideas. If the
    obvious ideas worked, you wouldn’t be having the problem causing the brainstorm
    session in the first place! Even if


    ²“The eye sees a thing more clearly in dreams than the imagination awake.” - Leonardo
    da Vinci'
  merge: -1
  pgno: 186
- img_proc: true
  md: 'the ideas you come up with are ridiculous, maybe a kernel of that idea will
    inspire some other, better and more feasible idea.


    +   No Criticism - Here is the one that is most violated. Not only do we self-censor,
    but also when we hear ideas, our critical evaluation centers go active and we
    try to evaluate why the idea won''t work. In corporate environments, there is
    also often a political motive to stamp out other''s ideas to develop one''s own
    standing. This is counter to the brainstorm''s goals.


    Osborn found that when these rules were followed, that idea generation was more
    productive than in a normal meeting situation.


    Unfortunately, research on brainstorming versus other techniques in the corporate
    environment has not been so kind. In fact, research has shown that using the brainstorming
    rules in an individual setting provides more (and higher quality) ideas per person
    than the traditional group brainstorming setting.


    What this means is that if you take five individuals and have them brainstorm
    on a topic, they may average six ideas each. A group of five with the same makeup
    who brainstorms in the group setting may come up with twenty or less ideas less
    than the individuals combined even when adjusting for duplicates. The group brainstorms
    do create more ideas than any one brainstormer can create on his/her own which
    is why brainstorming is so popular: it looks like it is effective in isolation.
    But when the group brainstorm is compared with the collected whole of individual
    brainstorms, the numbers do not add up.


    # Problems with Group Brainstorming


    So the rules themselves were good, but something else was holding them back in
    the group setting. Researchers took a look at this problem and came up with some
    reasons for the discrepancy:


    Evaluation Apprehension - Anyone with any sort of social anxiety understands this
    at heart. One of the rules of brainstorming is that quality does not matter. Yet
    in the corporate environment, we are constantly being judged on the quality of
    our work. If you are a designer, your very livelihood is the quality of the presentation
    of your ideas! As a result many,'
