  md: '# 64 – Practical Tools for Game Design Students


    But you don''t want to put these optional bits in-line or it will make the document
    harder to read and may be unnecessary for some readers. In these cases, you have
    two techniques: footnotes/endnotes and appendices.


    In most viewing modes, footnotes appear in small text under a separator at the
    bottom of the page by a small superscript number where text belongs- in-line.
    Endnotes are the cousin of footnotes. They look the same as footnotes except instead
    of appearing at the end of the page, endnotes occur at the end of the document.


    The use of footnotes rarely occurs in the first draft. Instead, after the draft
    is completed and passed around, points of contention or confusion will cause the
    designer to add special case notes to the design.


    Let us go back to the “Chili Cookook” GDD. You sent the design around for approval
    and the location line was seen as too vague. Now in this GDD adding information
    to the location section inline is not a problem as the document is already sparse,
    but say we wanted to add detail about the location, but not alter the flow of
    the document. Here we can place a footnote.


    First, position your cursor where you want the footnote to appear. Generally,
    these appear at the end of sentences to which the footnote refers. Put your cursor
    at the end of the sentence.


    ```

    examplename.com)


    vent located in the Swamps of Bitterdale region |

    ```


    # 6.22 – Place Your Cursor Here


    There are two ways to go about the next step. Either you can go to the Reference
    tab in the ribbon and then select “Insert Footnote” or you can use the keyboard
    command Ctrl+Alt+F.'
