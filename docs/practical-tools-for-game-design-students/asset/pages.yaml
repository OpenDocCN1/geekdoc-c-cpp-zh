  md: '# Chapter 16 - Analog Prototyping - 195


    **Approximate the Mechanics with Rules** - Now you know what decisions you need
    your players to make, craft the rules with those decisions in mind. In the above
    example, we talk about cover. Create a map with varying types of cover at varying
    distances. Then write some rules governing how pieces that the players move and
    deal damage.


    **Get the First Version Running as Quickly as Possible** - The benefits of analog
    prototyping are that it is very quick to get a first version up and running compared
    to coding something from scratch and that it is nearly effortless to make changes
    as you go. Use this benefit to get your first versions running as soon as possible.


    **Evaluate It You Go, Making Changes as Necessary** - When you are playing it
    (and remember that you can make yourself all of the players, including the AI)
    always be evaluating whether the prototype has the same feel as you desire in
    the final version.


    **Do Not Make Design Decisions Based on What Is Easy To Make** - What is easy
    to make in board game may simplify things for you, but will it be the best decision
    for when it is coded and made final? Sometimes a particular mechanic will need
    to be rough in board game form just due to the lack of AI crunching numbers at
    light speed. This is okay. Remember your final product won''t (likely) be a board
    game, so don''t design with the goal of making a fun board game. Instead design
    to inform how your mechanics interact with each other.


    **When It Is Fun, Move On** - It is tempting when a paper design is working to
    continue to refine it until it is perfect, but can backfire. The digital version
    that you eventually make will nature have significant differences to your analog
    prototype. The key is to make sure that the important parts are the same. If you
    spend all your time making your whole game in analog form, when it comes to make
    the final digital version there will have to be spent on converting mechanics
    that don''t make sense in the final digital version and all of that balance time
    you spent on the analog version will be lost.


    **Be Creative** - Too many analog prototypes are of the roll-and-move variety.
    This means there is a pawn and players roll a die to see what he does or where
    he moves. But in your digital game, this is how the player will make decisions?
    Randomly? Instead encourage the same decision making processes that the players
    and AI will make behind the scenes in your final version. This means you may have
    to use odd materials or methods. I once'
