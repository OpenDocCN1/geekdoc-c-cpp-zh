  md: '# 214 – Practical Tools for Game Design Students


    An **open** or **pending** bug has just been entered but has not been examined
    by a team member to be fixed. Once a producer assigns the bug to a team member,
    it becomes **in progress**. If the bug is a **duplicate**, it is marked as such
    and **closed out** removed from the open list. Other ways to close a bug are to
    mark them as **designed** (meaning the behavior the tester thought was a bug was
    intentional) or **cannot reproduce** (when the team cannot get the behavior that
    caused the bug to happen again). Bugs that are too minor to be added are marked
    as **known issue**. This often happens to minor bugs at the end of the project
    when the team knows they will not have the time to address the problem.


    When an engineer, artist or designer thinks he or she has fixed the bug, or marks
    it as **claimed fixed** and sends it back to QA. The bug is not closed out unless
    QA has to verify that the fix actually worked. This is called running a **regression**.
    While the bug is in this process the bug is marked **pending regression**. The
    testers try to reproduce the bug on the new post-fix build. If they cannot reproduce
    it, the bug is closed out. If they can, the bug is marked **fix failed** and returned
    to the team.


    Using these severities and statues the QA team can produce reports that show the
    status of the quality of the project. Using the database software, QA or production
    can ask questions like: “How many severe bugs (A or B) do we have open and unassigned?”
    Or: “Which engineers are producing the most failed fixes?”


    # Anatomy of a Good Bug Report


    Of course the severity and the status is just the tip of the bug report iceberg.
    QA testers who communicate well and write well-formed bug reports are almost the
    ones who see promotions and get put on the most valuable tasks.


    A good bug report clearly and concisely (remember: engineers hate reading lots
    of text!) describes the steps leading to the bug so that the bug can be tracked
    down and the behavior analyzed.


    Here''s an example of a bad bug report:


    “Level 3 has some graphical glitches around the midpoint.”'
