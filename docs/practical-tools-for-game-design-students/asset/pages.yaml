  md: 'Chapter 8 - Diagram Creation


    # Chapter 8 - Diagram Creation


    In this book, you will see me reiterate time and again the power of pictures.
    There is a simple reason for that: they work! Our brains are naturally wired to
    interpret pictures. In fact, the cognitive process of us reading text is essentially
    breaking down letters into individual pictures and then reassembling them to generate
    meaning.


    Dan Roam’s popular book “The Back of the Napkin” champions the use of sketches
    to communicate ideas. His thesis is that not only can you present ideas better
    with sketches, but also that you can solve problems better when you draw pictures.


    Yet so often we stick with text: in emails, in design documents, in pitches. These
    are places that simple diagrams and sketches can help.


    # But I’m Not an Artist!


    The most cited reason people use to avoid using sketches is a perceived lack of
    artistic talent. This makes no sense. Most people are Hemingway either, but that
    doesn’t stop them from using text. Fear is not a requisite talent for designers.


    Lose your fear that you will be judged on account of your chicken scratch. Some
    of the best designers I know are the worst artists. Your job is not to create
    art for the game necessarily—your job is to communicate ideas. Every tool at your
    disposal.


    Some designers think that they have to be as detailed as their artists for their
    image to have any measure of respectability. This is backwards. Simple drawings
    are more useful for communicating ideas. Respected comics writer Scott McCloud
    calls this “amplification through simplification”.


    Simple diagrams and pictures allow audiences to “fill in the blanks.. A sketch
    of the Mona Lisa does not adequately communicate its beauty because that idea
    needs to be communicated at high fidelity. Since your ideas are flexible and will
    change before they get to be a final product, the'
  merge: -1
