- img_proc: true
  md: '# 336 – Practical Tools for Game Design Students


    reason to include your picture and it makes HR offices uncomfortable, so don’t.


    Do not be cheeky or cute. Some resume writers like to stand out by using crazy
    fonts or odd forms like writing their resume as a dialogue. The form should not
    stand out; the content should. Remember the HR folks have to go through hundreds
    of resumes. If yours is hard to read for any reason, they will likely pass it
    over.


    # Step 9 - Cull to One Page


    Now you have all this great stuff on your resume and you can start cutting off
    the weakest bits until you get to one page. Resist the urge to mess with the margins
    to fit more on a page. That makes your resume look cluttered. White space is okay.
    Remember that it is likely that your resume will be printed at some point if you
    make the first pass. Make sure it is something that can be read when printed (meaning
    reasonable margins and black-and-white with no watermarks).


    # Step 10 - Review


    Have someone review it like a teacher or friend. They will likely see mistakes
    that you have missed or phrases that don’t make sense. Everyone who has gotten
    a job pretty considers themselves a resume expert. You do not have to do all of
    their suggestions, but consider every one. You might have the same reaction an
    HR person would, even if the reaction is unfounded.


    Now that you have a beautiful resume, you can send it out to every company that
    may take you. Don’t be discouraged. Even for developers with loads of experience,
    sending out fifty resumes and only hearing back from three companies (even if
    they say ‘no’) is quite common. Follow-ups are important. But most applications
    will just disappear into the aether. You can’t fret over them. Instead move onto
    the next. Be confident! You are working hard on your skills, making games in any
    spare time you can find, you don’t have time to fret!'
