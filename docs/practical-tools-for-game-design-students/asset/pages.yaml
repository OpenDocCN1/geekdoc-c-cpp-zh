    # Why Sound Is (Almost) Never a Good Idea


    Sound offers a lot of opportunities to sink your presentation.


    What happens often is that the presenter did not test the speakers beforehand
    and the sound blares at 130dB. The audience flinches, the presenter scrambles
    to figure out how to mute, eventually forwarding the slide and everyone takes
    a sigh of relief like they just missed a car crash. It will take a few minutes
    for the audience to recover and start paying attention again.


    Or the speakers do not work at all and the presenter fumbles and goes back and
    forth trying to get the sound to play, wasting the audience’s time.


    Or the presenter succeeds and stands there with a cheesy grin on his or her face.


    None are really helpful.


    In presentations about music, or where sounds must be heard to convey the instructional
    or emotional content, then by all means use sounds that are not part of the standard
    sounds shipped with Powerpoint. But make sure'
  merge: -1
