  md: '# 30 – Practical Tools for Game Design Students


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_31_0.png)


    Figure 3.1 - The Waterfall Method


    The waterfall method starts with **ideation**. This is literally the generation
    of ideas. We will discuss idea generation in a later chapter. This is where the
    brainstorming, concept art and sometimes prototyping come together and the team
    gets an idea of what they are about to build.


    In **specification**, the team gets down to specifics as to what they will build.
    Designers write game design documents (or GDDs), engineers write technical design
    documents (TDDs) and artists start creating assets or media design documents (MDDs).
    These first two steps together are generally called **preproduction**.


    Next, the team enters what is usually the longest phase: **production**. In this
    phase, the team actually constructs the things they laid out in their design documentation.
    The key aspect of the waterfall method is that work only flows in one direction.
    This means at this point, the team is strictly making what is on the design documents
    not revising and changing the'
