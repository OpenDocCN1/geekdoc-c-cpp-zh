  md: '# Chapter 23 - Powerpoint - 265


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_266_0.png)


    Figure 23.35 - A Gluttony of Options


    Now that all eight of your boxes have animation, it is time to change these animations
    trigger. For each box from one to eight, select it and then go to where it says
