  md: '# Overview of Topics


    By its very nature a book of game design tools must be incomplete. Not only are
    there too many tools to realistically put in a single book or even in a single
    collection of books, but the the tools change so rapidly and so drastically that
    any book of its nature that aimed to be completely authoritative would be obsolete
    as it was being typed.


    That said, there are evergreen topics that are of great importance to all designers,
    especially fledgling designers looking for their first formalized design work.
    This is what I endeavor to cover in this book.


    First, I give a broad overview of who “the industry” is and what kinds of roles
    are available in the many diverse types of organizations. We will also cover the
    software development life cycle, since knowing how software is actually made is
    a prerequisite for understanding the best ways to make game software.


    Next, we will talk about written communication. The game design document is foremost
    in this discussion as it is the industry standard artifact used by designers to
    communicate within teams and externally. We will cover what a game design document
    is, whom it is for and best practices for how it is made.


    We will cover Microsoft Word and some useful functions with regards to writing
    clear and concise game documentation. Wikis are growing in popularity as a design
    tool and will be briefly covered. We will also cover some secondary tools to assist
    your communication via charts and images, notably Microsoft Visio, Cacao, and
    Adobe Photoshop.


    The third section is about number crunching. Spreadsheets are the most underrated
    software tool that designers have. We will discuss how Excel can be used for organizing
    data like schedules but also its flexible use as a simulation device. We will
    dive into the features that help you get the most of Excel as a game designer,
    along with some discussion of the theoretical base that will help you think abstract
    to apply Excel simulations to real world examples.


    Fourth, we will talk ideas. Ideas are the trade of designers. We will cover how
    designers pitch their ideas along with the most dangerous software tool out there:
    slide programs like Microsoft Powerpoint. This section is a safety'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'class, teaching you how not to hurt yourself with this sharpest of tools. We
    will cover some of the most important functions of Powerpoint, along with some
    ties to written documentation that goes hand-in-glove with the pitch: notably,
    pitch documents and feature overviews.


    Next, we will discuss ways to get your hands dirty. Every year the number of books
    on game design grows. But no book can truly teach you how to design. You must
    make games to become a designer. And yes, at first they will be terrible. But
    there is no substitute for production and failure. In this section of the book,
    I will detail some of the tools out there to dive into making games.


    Finally, we will talk about personal promotion. Game design is a hard field to
    break into and an impossible field to master. We will talk about ways to improve
    your skills and increase your visibility in the field. Game design is a field
    of constant study and improvement. There are software tools out there that can
    help you connect to be discovered and land that important first job.'
