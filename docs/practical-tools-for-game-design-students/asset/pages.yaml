  md: 'Generally, books about software packages try to enumerate all the features
    without filtering out the most useful. Generally, books about game design try
    to stay as high-level as possible, leaving discussing the actual techniques and
    artifacts in industry applications of game design to on-the-job training. In Practical
    Tools for Game Design Students, game designer and educator Zack Hiwiller tries
    to straddle that fence—teaching real applications of both theoretic and software
    tools with practical applications to life as a professional game designer.


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_359_0.png)'
