    # Ren''Py


    If you would like to get a little more visual than text adventures, but still
    stay in a simple and heavily narrative form, perhaps you should check out the
    awkwardly named Ren''Py Visual Novel Engine. The “Ren” part come from Ren''ai,
    the Japanese term for the dating simulation genre and the “Py” part comes from
    Python, the common scripting language usable in engine.


    Dating simulation is a popular genre in Japan where you choose what to say to
    a number of suitors in the hopes of gaining dates. There’s an entire subculture
    based on these games that I suggest you do not Google. Ren''Py has deeper roots
    than just this genre and is able (with the help of some Python scripting) to do
    more in-depth simulation than a standard choose-your-own adventure.


    Ren''Py excels at dialogue-heavy games. The main ease of use comes from the simplicity
    of displaying images and dialogue choices. Look at this simple scene from a Ren''Py
    script:


    ```

    label sceneatstore:

    scene bg store

    with dissolve

    show zack confused

    "I can’t find a game I like."

    clerk “Well, that sounds like a problem of taste, doesn’t it?”

