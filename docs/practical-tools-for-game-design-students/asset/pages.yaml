  md: '# Chapter 23 - Powerpoint - 269


    saved, so it is best to test your embedding attempt on another computer (or

    best: the presentation computer) before entrusting that your fonts will look

    correct.


    Note that each font you embed will increase the size of the presentation\and can
    do so drastically if done carelessly. If you plan on emailing your

    slides, this is a concern you will have to consider.


    To embed your fonts, go into Options from the File tab and select the Save

    Options dialog. Here you can choose to embed the whole font or only the

