- img_proc: true
  md: '# 170 - Practical Tools for Game Design Students


    But when you are examining areas where groups may overlap or areas where one group
    affects another, you cannot simply add together. If there is any overlap, then
    you must subtract that out overlap.


    Say you run an online game service like Steam or Xbox Live and you are interested
    in the proportion of users who were banned. Say also that you only ban for two
    offenses: hacking and being offensive jerks. These are not mutually exclusive:
    being a jerk doesn''t mean you are or are not a hacker. Some are both, some are
    one, and some are neither:


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_171_0.png)


    Figure 13.5 - Non-disjoint Sets


    If 1% of your users are hackers and 5% are jerks, that doesn''t mean that 6% of
    your users have been banned. If you count people who were banned for multiple
    offenses for each category, you will end up double-counting users. So here is
    a more formal probability statement:


    P(A or B) = P(A) + P(B) - P(A and B)


    In cases where A and B are mutually exclusive (or disjoint), that last term is
    zero. In our above case, say that 0.5% were hackers AND jerks. The probability
    of being a hacker OR a jerk would be 5.5%. Do you see why?¹⁸


    Have you ever played Roulette? In the game you can bet on red or black numbers
    to come up on a spin wheel. In many places, the last few spin results are placed
    on a board. A gambler comes in and sees that red has been spun four times in a
    row and says, “Looks like black is due!\”. This is called the gambler’s fallacy.
    It is the mistake of treating independent events


    > ¹⁸ P(Hacker or Jerk) = 5% + 1% - 0.5% = 5.5%'
