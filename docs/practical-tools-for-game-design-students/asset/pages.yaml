  md: '# 48 – Practical Tools for Game Design Students


    hyperlink. In the above example, I could have spelt out all the races, the designs,
    attributes and locations in the character creation design, but is it relevant?
    And what happens when one of these things needs to change? Would you rather change
    it in one place or have to track it down and change it in 10 places? What happens
    if you miss one?


    # Appendices


    What if there is some background information that is necessary or helpful to include?
    We don’t throw that out, right? Absolutely. Jesse Schell points out in The Art
    of Game Design that game documentation is a cure for the frailty of human knowledge.
    But since the programmers won’t be using that background information in scheming
    up on how to create the feature, we don’t want cluttering the design document
    proper. Therefore, all the “bonus” material should be put at the end of the document
    in a footnote section or in a linked “FAQ” document. Here you have little restrictions
    on brevity. Anything that needs to be remembered (design battles, reasoning for
    certain choices, sketches, etc.) can be added to the appendix section/document.
    If you find it painful to be brief in the design document, you can let loose in
    this section.


    # Step Six: Edit and Find Edge Cases


    You’ve written down the most salient feature idea and condensed that down to a
    logical list form. Great! Now there are two things you must do and it helps to
    do them simultaneously. Send the design out to your fellow designers and folks
    implementing the feature. Ask them: is this clear? Are there mistakes? Where does
    it break down?


    An edge case is a problem that occurs only under extreme conditions. While others
    are reviewing your documentation, try to find edge cases in your own design. Test
    the extremes to see if it breaks down.


    For instance, here’s a simple design:


    > The player’s jumping height is equal to his strength divided by the weight of
    items in his/her backpack."'
