  md: '# Chapter 26 – On Being Done - 301


    What they missed was the novelty of the platform itself. It was fun to use the
    Wii controller whatever game was played. Even if the attached game was bad, if
    it leveraged affordances made the Wii itself fun, it could succeed. Phone games
    for the longest time were crap, but because of the novelty of playing something
    on your phone, companies could sell millions of dollars in crummy poker and bowling
    games. Board games can''t hide behind the novelty of platform. Their success must
    hinge on the power of the system itself.


    If this sounds hard, it is! Despite record-breaking sales year after year, it
    is very hard to get a board game to market unless you finance yourself. This requires
    your game ideas to be executed flawlessly. The leg up you have on competition
    is that you can test your ideas quickly and inexpensively where they will have
    to struggle with code and technical bugaboos.


    # Where Do I Start?


    Many gamers simply do not know this niche of the hobby was out there. In order
    to get a good start, it can be helpful to know what some of the successes are.
    Unlike dealing with Unreal or Unity, there is no comprehensive tutorial to learn
    how to make board games. You can all do look at other''s successes and brainstorm
    from there. It can be expensive to procure these games as they come in small print
    runs compared to Monopoly and Operation.


    Here is a short list of my favorite titles to get you started:


    +   *Dominion*, Donald X. Vaccarino, 2009, Rio Grande Games


    If you have ever played Magic: the Gathering before, you will be familiar with
    some of the structure before Dominion. Whereas in Magic, you build a deck before
    the game, in Dominion the deck building is the game. Players all start with the
    same deck of money and victory cards and use them to buy new cards from a common
    pool to build synergies in their decks that allow them to continually buy bigger
    and better things. There are a number of clever mechanics in foremost of which
    is the cards needed to win the game (victory point cards) are mostly useless during
    the game, leading players to determine when to slow growth in exchange for gaining
    points.


    +   *Settlers of Catan*, Klaus Teuber, 1995, Kosmos'
  merge: -1
