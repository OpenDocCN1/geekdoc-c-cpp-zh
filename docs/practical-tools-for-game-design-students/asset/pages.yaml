  md: '# Chapter 3 - Software Development Life Cycle - 31


    requirements to adapt to new issues. Production is generally split into self-contained
    milestones where individual features are completed and then not touched again.
    This allows the team to schedule with a great amount of specificity.


    The last two steps can be troublesome. In test, the team works together to eliminate
    any bugs and rough edges generated during production. This can be a laborious
    process since the nature of the waterfall method does not allow the team to go
    back and make changes that may result in fewer bugs and technical challenges.
    When the system is sufficiently bug-free, the product is released and the team
    starts over with a new project.


    You may see various terms thrown about in game news like alpha, beta and gold.
    All of these terms are explanations of the portion of the test phase. Alpha is
    the state of the project when all the features have been completed and the testing
    stage begins. Beta is the state where the bug count has reduced to zero, but bugs
    are still coming. Gold is where the publisher or team decides the game is sufficiently
    bug free and is sent to the manufacturer (or released to partners) to be printed/distributed.
    These terms can vary from place to place. For instance, Google likes to label
    their products as Beta long after they''ve been released.


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_32_0.png)


    Figure 3.3 – An Example of Bug Counts


    In the above diagram, the number of bugs in the project increases until the features
    are all complete. In alpha, the team tackles the bugs decreasing them (while some
    bugs are still being added as mistakes are made). In beta, the team bounces above
    zero as new bugs are added and tackled.'
