- img_proc: true
  md: 'There are two jobs for the observer: One: internalize and record what happens
    in the playtest. Where does the tester stumble? What decisions does he make? Two:
    constantly prod the tester to keep talking. Generally, test subjects will remember
    to keep talking for about ten or fifteen seconds and then they will get sucked
    into the task at hand and will quiet up. It is the observer''s job to remind them
    to keep talking.


    An observer can record by taking notes, but often a playtest session contains
    so much usable data that one cannot write fast enough to catch everything accurately.
    A more useful technique is to both take notes and record the session.


    Advanced playtesting suites are being developed at many major publishers that
    record video of the tester''s facial expressions, hands, and screen outputs in
    addition to play metrics. It is a wealth of data of which you would be lucky to
    gain access. Often publishers and large studios playtesting without the designers
    present or involved. I find this to be a huge mistake. The design and playtest
    teams need to be in constant communication to understand what needs testing and
    what questions need to be answered.


    # What Now?


    When you think you are done playtesting, playtest more. I have yet to have heard
    from a team that has ever complained that they did too much playtesting. I have
    heard many examples where teams did a little playtesting and then either ignored
    it or simply quit and released to confused masses.


    When you stop getting useful feedback, it doesn''t necessarily mean you are playtesting.
    It does mean that you should try harder to get different viewpoints. Ask different
    questions or find new sources of playtesters.


    Take problems (not solutions) presented in playtests and prioritize them by their
    frequency/or severity. Then decide which you want to tackle and how. This should
    be integrated with your bug tracking and fixing procedures.


    It is important to return to problematic issues in playtests after they have been
    resolved. An unfortunately common occurrence is to have a problem come up in a
    playtest, ("Players are unsure which door is the exit")'
