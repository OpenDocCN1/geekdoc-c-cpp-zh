    # Locations


    There are a few go-to locations for images online. My first stop is always stock.xchang
    at http://www.sxc.hu. This is a repository of high-quality free, royalty-free
    stock images owned by Getty Images. They provide this service in hopes that you
    will upgrade to their iStockPhoto site that has paid stock photography. Stock.xchang
    doesn''t have great images on all topics, but for generic searches like note cards
    (used above!) and game pawns, it is a wonderful resource. Morguefile.com and Dreamstime.com
    are also reasonably stocked sites.


    The next location to search is Google Images. Google offers the largest database
    of available image files, but there are many caveats. First, since these images
    are pulled directly from the websites Google crawls, they are in the resolutions
    native to that site. Most sites do not publish their images at a resolution high
    enough to be full-slide images. To search only large resolution images, use Google''s
    advanced search options located below the search bar.'
