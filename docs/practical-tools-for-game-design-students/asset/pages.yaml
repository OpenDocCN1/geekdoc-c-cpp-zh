  md: '# Charts


    People love visualizing data. Remember how we emphasized the use of pictures in
    our chapter on written communication? The same lesson holds true whether you are
    talking about writing a feature specification or trying to summarize thousands
    of rows of data. Charts work.


    There is a danger when you first begin to understand the flexibility of charts
    in Excel. That danger is you are wasting your time making flashy charts instead
    of using the power of charts to make simple, effective information out of obtuse
    data.


    Famous information theorist and statistics professor Edward Tufte coined the concept
    of the data-ink ratio in The Visual Display of Quantitative Information. Data-ink,
    to Tufte, is ink if removed would remove information from the chart or graph.
    Non-data-ink, likewise, is decoration or ink that can be removed without affecting
    the information presented in the chart or graph.


    Tufte''s directive was for chart makers to maximize the data-ink to non-data-ink
    ratio.


    For instance, here is a chart with a low data-ink ratio that you might see in
    an Excel or Powerpoint file in industry:


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_144_0.png)


    And here is a high data-ink version of the same exact data:'
  merge: -1
  pgno: 144
- img_proc: true
  md: '![](img/b19cafc6b56054e8f5f6f1c412d479b7_145_0.png)


    The data is the same, but the high data-ink version is easier to read and understand.
    How can I compare 2007''s numbers to 2008 or 2011 in the low data-ink version?
    The perspective makes it difficult. Charts with non-linear height per data value
    also violate the principal of maximizing data-ink.


    # Charts in Excel


    It is easy to insert a chart into Excel. Highlight the-data and select from the
    type of chart in the Charts section of the Insert tab.


    | Class | Strength | Dexterity | Intelligence |

    | --- | --- | --- | --- |

    | Warrior | 18 | 10 | 6 |

    | Rogue | 10 | 18 | 10 |

    | Wizard | 8 | 12 | 10 |

    | Priest | 12 | 8 | 10 |

    | Farmer | 14 | 10 | 8 |

    | Droid | 19 | 3 | 19 |

    | Samurai | 10 | 19 | 12 |

    | Professor | 8 | 8 | 19 |

    | Cheese | 2 | 2 | 2 |'
