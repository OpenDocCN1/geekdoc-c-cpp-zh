  md: '234 – Practical Tools for Game Design Students


    # 12. Don’t Repeat Boring Information


    I have lost count of the number of team-based presentations I have seen in my
    life where the team of four splits twenty slides into four equal parts. At the
    end of every every fifth slide, the presenter goes “And now I will hand it off
    to Steve, who will talk about the demographics.” She hands the clicker to Steve
    and he begins: “Hi, I’m Steve and I’m the market research analyst for Soandso
    Games and I will be talking about the demographics.” He then clicks to a slide
    that says “Demographics”.


    What a waste of time!


    If I see you handing off the slide advancer, I won’t go “Whoa, what’s happening?!
    Did she quit?” All audience members understand that different people can present.
    You don’t have to have an introduction and conclusion to every few slides. If
    you introduce everyone at the beginning, that is more sufficient. How many times
    above did “Demographics” need to be said? The answer is zero. Once the slide is
    enough. The first speaker should conclude her section, hand off and Steve should
    start going into his spiel. It should be like a NASCAR pit crew: change the tires
    and speed off.


    # Okay!


    You have heard about what not to do, now it is time to go into PowerPoint and
    look at the features you can use to create a presentation. Naturally, before you
    even got to this point you would have brainstormed ideas, created a flow of how
    you want to present your theme and prepared the best way to present for your audience.
    In the following examples we will be working through an imaginary presentation,
    so we will focus more on the features of the program and less on creating a cogently
    flowing presentation. Naturally in your presentations you will have have to worry
    about these things, but for the examples in this book it is necessary to gloss
    over that part in order to show the features in isolation.


    Forward!'
