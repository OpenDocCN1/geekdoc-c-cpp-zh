  md: '# Step 5 - Any Interesting Game Projects


    Shortly list and describe any game projects you''ve been a part of as a hobbyist
    or student. In any other industry, making Halo Forge levels is not particularly
    demeaning something you would want to include on your resume, but here it is recommended
    especially if your resume is lacking professional experience.


    # Step 6 - Technical Skills


    Do you know any programming languages? What software are you familiar with? With
    the tools in this book, you should be able to fill out this section nicely. Few
    things make a student candidate more impressive than a wide variety of tools listed.
    It shows he/she is willing to learn and experiment. But by being willing to answer
    questions in an interview about whatever you list!


    # Step 7 - Something Interesting


    Mention something about you that makes interesting and stand out beyond what you
    do in work and school. In my resume, I mention my blog and writing (over a million
    hits) and the fact that I officiate varsity high school football games. While
    these things are not necessarily relevant to industry, it sticks with readers
    so they remember "Oh, that''s the referee guy" or whatever your interesting factoid
    is.


    # Step 8 - What to Leave Off


    For an entire generation, putting "References: Available Upon Request" was standard.
    It is now generally frowned upon because of course your references are available
    upon request. Why wouldn''t they be? The statement is pretty much a waste of space
    that could be filled with something interesting. If you read a resume guide that
    tells you to include that, ignore it.


    Do not include a picture of yourself. In many jurisdictions this raises legal
    issues since there could be a possibility of discrimination based on gender or
    race, even if these are patently obvious from your name. There is no'
