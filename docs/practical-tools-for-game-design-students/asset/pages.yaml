  md: '# Chapter 15 - Generating Ideas - 191


    out ideas. Mind maps make recording easy and since since the point of the game
    is speed, every keystroke counts.


    When the brainstorm is done, the mindmap can be exported as an image or (in some
    packages) a hierarchical text list (good for combining brainstorms). From this
    list, you can start whittling the list down to good and/or feasible ideas to be
    more thoroughly investigated.


    # Beyond Brainstorming


    While brainstorming is one of the most popular idea generation techniques, it
    still doesn''t beat good old-fashioned inspiration for quality and innovation.
    Unfortunately, inspiration cannot be scheduled, managed, coerced or predicted
    and is thus unpopular for a business to rely upon revenue. It is also highly personal
    and thus not reducible to a task.


    You must build a mind that is ready to produce inspiration. This requires a wide
    experience and immersion in books, movies, music, culture, science, and human
    affairs. It is a prerequisite to idea generation that is rarely touched because,
    simply put, it takes a long time. Some stick to their comfort areas and never
    branch out to the unfamiliar or challenging. It is like expecting to run a three-hour
    marathon based on expert tips and ignoring the fact that you need to be in excellent
    shape.


    Like much of design, idea generation is exercised by practice. Make games or write
    all of the time and you will find the process less mysterious.'
