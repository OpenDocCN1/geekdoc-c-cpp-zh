  md: '# More Conditional Formatting


    The newest versions of Excel offer some very attractive new ways of drawing attention
    to particular data. One is Color Scales that automatically put a heat value based
    on the minimum and maximum values in your data. This is applied by highlighting
    your data and clicking the Conditional Formatting dropdown, selecting "Color Scales"
    and then selecting the color scales or rules you wish to use. In the image below,
    a 100% is the darkest green, while the lowest score is the darkest red. Of course,
    in this grayscale image the range is hard to see. Values in the middle go from
    red to orange to yellow green.


    Newer versions of Excel also let you put icons in cells based on the value contained
    in the cell. You put the reception bars in the cells in the image below based
    on the number of reviews. This is not particularly helpful in the below example,
    but you can see what it would look like. You can also choose "Data Bars" to fill
    the cell a percentage based on the value in the cell.


