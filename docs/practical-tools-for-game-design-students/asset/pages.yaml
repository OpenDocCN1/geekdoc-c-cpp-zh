  md: '# Chapter 11 - Excel Crash Course - 141


    # Worksheets


    A single Excel file can contain multiple spreadsheets. This can be helpful when
    you want to only look at certain data at a time (like having each sheet a year''s
    worth of data) or you want to compare different sets of data that have different
    parameters (comparing the features of different lists of automobiles: one worksheet
    for engine specs, another for interior specs, &c.,)


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_142_0.png)


    Figure 11.25 - Worksheet Tabs


    In the lower left, find the tabs that stick out below the spreadsheet''s cells.
    Each of these tabs is a separate worksheet. Excel defaults to each .XLS or .XLSX
    file having three worksheets when created in most versions. Of course, you can
    add or delete worksheets as you see fit.


    You can rename a worksheet from its default "SheetN" name by clicking on the name
    while that tab is selected or by right clicking and selecting "Rename". Proper
    labeling of your worksheets avoids confusion. The small icon to the right of your
    worksheets will add a new worksheet to the end of the list. Worksheets can be
    reordered by dragging them into place.


    Formulas can refer to data in other worksheets of the same file. Say you want
    to refer to cell B3 in a worksheet called ''OldData''. If you were referring to
    that cell from within OldData, you could simply use =B3 as your formula. But from
    another worksheet, you can refer to cell B3 by using:


    ```

    =OldData!B3

    ```


    You can also refer to a range in the same way:


    ```

    =OldData!B3:B13

    ```'
  merge: -1
