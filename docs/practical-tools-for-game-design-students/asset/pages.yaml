  md: '# 348 – Practical Tools for Game Design Students


    forums at TIGsource.com often run contests for independent game developers.


    Often engine and toolmakers sponsor contests. Epic previously ran the “Make Something
    Unreal” contest, which asked developers to create a full game mod in the Unreal
    Engine 3 for a million dollar prize.


    The Interactive Fiction Competition has been running for seventeen years and provides
    great competition. The XYZZY awards is another venerable competition for interactive
    fiction having run since 1996.


    Kongregate.com runs a weekly and monthly contest to encourage developers to submit
    their games to the service.


    Since contests come and go, any list here is impossible. Be on the lookout as
    these can provide real incentives to finish projects.


    # Exercises


    +   1. Join Twitter. Follow @zhiwiller.


    +   2. Set up a blog on a popular blogging site such as Posterous, Wordpress.com,
    or Tumblr. Every weekday for a month, look through the gaming-related sites you
    like to peruse and find an article you either disagree with or on which you feel
    you can elaborate. Make a blog post about your comments. At the end of the month,
    you will have twenty posts with insights as to how you think as a designer. If
    you keep up with it, you can promote your blog and use it to connect with others
    in the industry.


    +   3. Many schools and professional development centers offer resume writing
    and interviewing seminars. Some will even record your mock interviews so you can
    see how you unconsciously act. Search for these opportunities. If you cannot find
    a mock interview opportunity near you, use your webcam and record yourself for
    three minutes explaining who you are and your qualifications. When you watch it
    back, notice any cues in body language that may look bad to an interviewer: lack
    of eye contact, slouching, ticks. Have someone who has interviewed before review
    it. Like anything, practice makes perfect.'
  merge: -1
  pgno: 349
- img_proc: true
  md: '4. Search to find your local IGDA chapter. Attend their next meeting. If your
    local chapter is the Orlando chapter, find me and say ''hi''.


    # Summary


    +   - Blogging is a simple way to create a voice that can serve as your personal
    identity in a sea of applicants. But be careful as what you say reflect either
    positively or poorly on how employers may view you.

    - Weak ties are the key to extending your network for the purpose of finding new
    opportunities.

    - Thanks to Twitter, your favorite developers are easier than ever to ask questions.

    - The standard resume and business cards will make you seem standard. Given the
    high degree of competition for entry-level game industry jobs, you have to better
    than standard. While not enough on their own, a solid website, resume and business
    card can only help in the pursuit of an entry job.

    - Once you land an interview, you''ve survived the hard part of the process. But
    the odds are still stacked against you. Be interesting and try to rise to the
    top.'
