  md: '# Chapter 33 - Interviewing


    You have found a position in which you are interested. You have submitted your
    resume and passed the eye test. You have survived the first cull. You are in the
    top ten percent. Congrats! Now you face the next step: the interview.


    Having on both ends of the process, both being interviewed and being the interviewer,
    I can tell you a number of things that may help you vault over that brick wall
    and get you deeper into the hiring process.


    # Pre-Interview


    Your work starts long before the call or on-site.


    The very first thing most interviewers will tell you is a disqualifying attribute
    for the interviewee to know nothing about the company or the position. Sometimes
    it is tough—maybe the studio is new or maybe the position is inadequately defined.
    Know what the studio makes. Know what platforms they service. Know what type of
    job is at the very least. It helps to have played their games. If you are on a
    short schedule, at least read the reviews of their games and know where they succeeded
    and where they failed.


    Interviews are two-way streets. Think of questions you can ask them. If you know
    the name of the person you are interviewing, find out on what titles he or she
    worked. Have questions prepared. These should be honest questions—things you are
    really curious about. Interviewers can see through the veneer of falsely looking
    interested.


    If there is anything on Facebook, Twitter, MySpace or whatever would embarrass
    you, get rid of it. Most interviewers will do a casual Internet search of their
    candidates.


    Work on your introduction. The most way interviews open is with the interviewer
    saying, “Tell me about yourself”. Have a good overview that is about thirty seconds
    long that is not just a rehash of your resume. They’ve seen the resume. They know
    what is on it. That’s why you got this far.


    At the very least have answers to these questions:


    +   - Why do you want to work at XYZ?'
  merge: -1
  pgno: 344
- img_proc: true
  md: '+   - What makes you more interesting than all the other people we will interview?


    +   - What are your weaknesses? (Be honest. “I work too hard” can be smelt out
    as a non-answer a million miles away.)


    +   - Talk about your biggest success.


    +   - Talk about your biggest failure.


    # The Interview


    Even though we live in the future, cell phones still drop calls. If you cannot
    find a landline to have the phone interview, be sure to let them know and get
    a callback number in case the call drops.


    If you are doing an on-site, fifteen minutes early. Any earlier and you will impose
    on them to see sooner than they had wished. Any later and you run the risk of
    being tardy. If you show up late, count yourself out. Your interviewer''s time
    is more important than your own no matter if they are an HR drone or the head
    of the company.


    If you are on-site, turn your phone off. Even on vibrate it be distracting. On
    a phone interview, make sure you will be in a place with few distractions. Dogs
    decide to bark at the wind at the most inopportune times. Landscapers start up
    their m when you need peace and quiet. Find a room insulated from those distractions.
    If you are a pacer (I am), find a place where you can walk around untethered but
    still without disruption.


    Speak slowly. However slowly you think you speak, you likely run your words together
    when in the excitement of an interview. If you must, learn relaxation techniques.
    You should be relaxed during an interview. It shouldn''t be a stressful event.


    Most people over-present. They ramble on after answering the question. But at
    the same time there is the danger of saying too little. If you are introverted,
    be mindful that you are doing more than just giving simple yes or nos.


    Focus on how you will fit for the position. If they mention something in which
    you are interested, tell them so. “Oh, it''s interesting you have narrative designers
    on your team because I have always been interested in'
  merge: -1
  pgno: 345
- img_proc: true
  md: '# Chapter 33 - Interviewing - 345


    how story and mechanics are joined.” But be honest. Interviewers can see fake
    a mile away.


    If you have previous experience, the interviewer will ask you about it. You could
    have the baddest blood of all for a previous employer, but do not bad-mouth them.
    It makes you look petty and you risk the danger of bad-mouthing a friend of the
    interviewer.


    If you are on-site, dress comfortably but professionally. The games industry is
    sort of unique in that dressing formally paints you as a boring stuffed shirt.
    Most game developers have an extremely liberal dress code, but you will still
    want to dress on the more professional end of that scale. it best to ask HR what
    is appropriate for that studio.


    If you are on-site, make eye contact when you give answers and ask questions.
    It shows confidence. Even if you are not confident, forcing yourself to do this
    will fail it perfectly well.


    This may be TMI for some people, but eating too soon before your interview. Do
    not eat too much and do not eat anything that will make your breath smelly bad.
    Some people, when nervous, will pass gas. You want to be focusing on the questions,
    not straining to hold back the urge to fart. Silly, yes, but important.


    Most: be yourself. You do not want to get a job for which you are a bad fit. It
    will be bad for them and bad for you. Every interview in the future will ask:
    “I see on your resume that you were only at your first job for four months. Tell
    us that.” Is that a question you want to answer for the rest of your days?


    Never ever ask about the remunerative aspects of the job such as salary, benefits
    or vacation during the interview. There will be a time for that, but the interview
    is not the time.


    At the end of the interview, always ask what the next steps are. Ask who you should
    contact for the follow-up. Thank each and every interviewer. In a week, follow
    up with your contact. It shows you are committed.'
  merge: -1
  pgno: 346
- img_proc: true
  md: '# The Wait


    Then comes the interminable waiting period. Keep busy. Don''t stress over how
    the interview went as it is in the past. Don''t bug the interviewer or your HR
    contact. Give it some time. It is likely that they will be interviewing other
    candidates and will not make a decision until they have interviewed everyone.
    If you start bugging them before they are ready to make a decision, it will reflect
    poorly on you.


    If you have waited a week or two and heard nothing, give them a call and ask them
    what your status is. If they say they are still evaluating, find out when would
    be appropriate to call back.


    Find something to fill your time. Maybe you have other places to send resumes?
    Maybe you are working on a project? Maybe you should just go see a movie?


    You may get called for a second interview. In that case, there was something in
    the first interview that they didn''t get answered. Try and figure out that as
    is. Are they asking a lot about a certain area of your experience? Maybe they
    want to know about your programming experience. Be honest but sell yourself to
    whatever they are asking. They wouldn''t be giving a follow-up if they were not
    interested.


    Sometimes you will get the standard “We''re sorry but you don''t fit what we are
    looking for at this time.” Be gracious in defeat. Do not ask them why you are
    not being hired. They cannot tell you without the possibility of being open to
    litigation, so you will almost always receive a stock answer. Thank them for their
    time and move on.


    Sometimes it is as simple as not being a good fit for the position. But if you
    keep in contact and keep a positive relationship,, when the right opportunity
    comes by, they will think of you. In the end, that is better for the both of you.'
  merge: -1
