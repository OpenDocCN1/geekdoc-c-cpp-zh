  md: '# Part Three - Number Crunching


    Computers are capable of amazing things. Frankly, just being able to move a mouse
    around on a screen and interact with different objects requires the complexity
    of dozens of different systems. Yet somehow we still resort to heuristics to guess
    at problems when we have perfectly good number crunching machines in front of
    us.


    Microsoft''s Excel is one of the most powerful pieces of software routinely ignored
    by designers across the globe. Not only does it allow for easy compartmentalization
    of data, but also its internal function language makes simple simulation something
    you don''t need to write a program to accomplish.


    In this section, we will examine how to use Excel for the forces of good when
    it comes to the black magic realm of simple simulation. Much like in our section
    on word processors, there are other tools that can be used for this purpose. When
    it comes to Excel, OpenOffice Calc, Google Spreadsheets and Apple''s Numbers are
    all similar to Excel. In this book, we will examine Excel 2010 but other alternatives
    should behave similarly.


    If you have never used a spreadsheet program before, Excel can be a bit intimidating.
    With a program like Word, at least you have familiarity with the printed page.
    How we will tackle this is by jumping right in and discussing features and follow
    it up with practical applications.


    After our brief tour of Excel, we will talk about ways to use it in the industry
    along with some theoretical tools that will help you visualize complex topics.'
