  md: '# Chapter 10 - GDDs for Indies, Students and Solo Teams


    In this book I have written for a particular audience: students who want to land
    design jobs in the corporate world on medium to large teams where you are not
    always communicating with folks you know and are at your caste level.


    But there is a whole realm of development: smaller, more independent teams. "garage"
    developers and hobbyists don’t generally need the overhead of complex communication
    tools and persuasive imagery. This is true. But that does not mean that designers
    on smaller teams need to give up GDDs and documentation altogether.


    Jesse Schell, in Art of Game Design describes two major uses for design documentation.
    One, communication, what we focused on almost solely to this point. The other
    main function is organizational memory. We are simply awful at remembering things.
    Documentation helps us not make the same mistakes over and again while preserving
    good ideas that we haven''t had time to implement.


    Many students and small independent developers use this workflow:


    +   1. Open up a code editor


    +   2. Code editor


    +   3. Throw out what doesn’t work


    +   4. Return to step two


    They do this because it is fun to make things and this workflow is the quickest
    route to the "making things" step.


    While that is a wonderful iterative process, it often contains more iterations
    than necessary due to lack of planning. Design documentation can help you figure
    out your edge cases and "holes" in design before you fire up your editor. Design
    documentation allows you a way of testing before building. You can put your design
    documentation in front of trusted teammates in order to suss out edge-cases. This
    is something you cannot do if you code-first.'
  merge: -1
