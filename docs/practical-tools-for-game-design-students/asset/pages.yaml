    # GameMaker


    GameMaker, created by Mark Overmars and now sold by YoyoGames is an interesting
    and popular platform for burgeoning game designers due to its ability to make
    playable and executable games without requiring a single line of code and without
    the need for the player to download an interpreter of some sort to run the created
    game.


    While requiring code, GameMaker includes a powerful scripting language called
    (quite simply) GML or the Game Maker Language. Most games created with GameMaker
    are 2D in presentation, but GameMaker does support DirectX/OpenGL in-engine for
    3D games to be created.


    Decided not flashy, GameMaker is one of the most polished and well-supported low-cost
    development engines in existence at the time of this writing. Additionally, it
    has both low economic and technical barriers to entry. since it was made originally
    to teach game making, effort is focused on workflows that make sense to new developers
    without sacrificing power and flexibility for advanced users.'
