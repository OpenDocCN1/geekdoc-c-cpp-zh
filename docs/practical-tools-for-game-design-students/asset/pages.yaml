  md: '# Chapter 32 - Business Cards - 341


    documents with meandering asides. There’s a place for additional information.
    That would be your website.


    # Doesn''t Have a Website: “I’m All Talk and Have Nothing to Contribute”


    If you don’t have a website that has some sort of content that gives me an idea
    of who you are as a person and/or as a designer, then what do I have to go on?
    If you are a student, the link to your portfolio should be up front and highlighted.


    My cards contain in: my email address (where you can ask public questions), (longer-form
    writing and other content), Twitter (where we can talk publicly and you can see
    my personality). If your information is easy to find or if you tell everyone within
    earshot of your website that is easily Googleable, then maybe you can leave that
    out. Err on the side of caution. The back of the card is plain and white so people
    can write notes if they wish.


    These snap judgments I listed leads you to a very simple card: name, sparse but
    evocative presentation and links to additional information/communication channels.
    Every other statement you make about yourself should be in the conversation you
    have with the guy or lady you are giving your card to! Be memorable there! How
    much time are you spending designing your card versus actually being interesting
    so people will want to keep your information?


    ![](img/b19cafc6b56054e8f5f6f1c412d479b7_342_0.png)


