    # Sorting


    Getting data to be readable is often about presenting it in a way that makes the
    salient data be the most visible. There are two ways of doing that and we will
    cover both now. The first is to present the most important data first and Excel
    makes this easy to do. Select *both* columns from the previous example. If you
    only select the grades, you will only sort the grades and the names those grades
    are attached to will scatter.


    Then look in the upper right on the Home tab to see the Sort & Filter button.
    If we were alphabetical data, the Sort A to Z or (strangely) Sort Z to A buttons
    are right there. Our process is slightly more complicated, so select the Custom
    Sort option.'
