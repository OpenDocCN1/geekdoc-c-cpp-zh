  md: '# Chapter 11 - Excel Crash Course - 121


    ```

    =AVERAGE(Range), =MEDIAN(Range),

    =MODE(Range)

    ```


    Statistical functions are available. If I wanted the average grade in the aforementioned
    list, I would type =AVERAGE(B2:B101). These are very simple. MEDIAN provides the
    middle element when the list is sorted numerically. MODE provides the most common
    element in the list.


    ```

    =RANK(Cell, Range),

    =PERCENTRANK(Range, Cell),

    =PERCENTILE(Range, Number)

    ```


    Now we are getting into the more interesting functions. In each cell next to a
    student''s grade, I wanted to put that student''s rank in the class. In this case
    I am going to need supply two arguments to the function separated by the comma.
    The first is the number I am examining. In the above example, when I am in C2,
    the number I am examining is in B2. The second argument is the array of numbers
    I am using to calculate my rank. To get the rank then, I would type:RANK(B2,B2:B101).
    I would get returned a number from 1 to 100 where cell B2 tells if. If it was
    the highest grade, the function would return 1.


    Absolute ranking is sometimes useful, but if you want to see a cell''s rank as
    a percentage of the population, use PERCENTRANK. For some reason, PERCENTRANK
    wants the array first and then the number being examined, completely reversed
    from the RANK function. =PERCENTRANK(B2:B101,B2) would give a number 0 to 1 where
    the cell ranked as a percentage. If the cell fell right in the middle, the function
    would return 0.5. By using the formatting tools (explained in a later section)
    you can format this as a proper percentage.


    PERCENTILE is the inverse of PERCENTRANK. You can give you a number and it will
    tell you where it would fall as a PERCENTRANK in that array. For instance, say
    that B2:B502 was a list of all SAT scores for a particular school. You want to
    know where a 1400 would rank among all of the students. =PERCENTILE(B2:B502,1400)
    would tell you that.'
