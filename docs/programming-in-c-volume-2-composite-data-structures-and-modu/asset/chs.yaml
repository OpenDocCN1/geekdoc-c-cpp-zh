  \n图 4.108：局部变量和全局变量的规则。\n\n### 4.6.5 函数的作用域\n\n在“共享资源”示例中，我们提到函数也具有“可用性”属性。如果一个源文件中定义的函数只能被同文件的函数调用，则它被称为内部函数；如果其他文件的函数也可以调用它，则它被称为外部函数。\n\
  \n为了标识内部函数和外部函数，我们使用两个存储类关键字：`static` 和 `extern`。当用于此类目的时，它们仅仅是标识符，不再是存储类的指示符。\n\
  \n\n\n\n\n使用内部函数的优点是，当不同人员编写程序的函数时，人们无需担心他/她的函数是否与他人编写的函数重名，因为在这种情况下这无关紧要。例如，布朗先生大学的建筑是用字母表命名的。他的朋友在另一所大学工作，那里的建筑也是用字母命名的。然而，布朗先生大学的老师学生永远不会将自己的建筑与其他大学的建筑混淆。\n\
  \n![](img/b_9783110692303-004_fig_109.png)\n\n图 4.109：内部和外部函数的语法。\n\n#### 示例 4.17\
  \ 带有多个文件的程序\n\n假设一个 C 程序由三个源文件组成，即测试文件 1 `1.cpp`、测试文件 2 `2.cpp` 和测试文件 3 `3.cpp`，分别如图\
  \ 4.110–图 4.112 所示。`main` 函数位于测试文件 `1.cpp` 中。这些图包含了函数定义、关于外部声明的注释以及全局变量的注释。请参考附录\
