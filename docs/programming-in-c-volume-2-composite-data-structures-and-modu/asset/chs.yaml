  \ 1。\n\n![](img/b_9783110692303-004_fig_111.png)\n\n图 4.111：带有多个文件的程序 2。\n\n声明与定义之间的区别：当声明函数或变量时，不会分配物理内存。声明的目的是确保编译器可以编译程序。当定义函数或变量时，它会被存储在物理内存空间中。一个函数或变量可以声明多次，但只能定义一次。\n\
  \n我们如何在多个文件中引用全局变量？假设我们在一个文件中定义了一个全局变量，我们需要在该文件中使用 `extern` 关键字，使其在其他文件中可访问。相反，如果我们定义了一个静态全局变量，它只在该文件中可访问，而不是其他文件。\n\
  \n![](img/b_9783110692303-004_fig_112.png)\n\n图 4.112：带有多个文件的程序 3。\n\n### 4.6.6\
  \ 掩饰机制 3：对共享数据的限制\n\n我们在之前的示例中已经看到，数据通常在函数之间是共享的。函数可以在不同阶段以不同的方式访问相同对象。有时，无意的操作可能会改变数据，这并不是我们希望看到的。\n\
  \n我们的目标是让多个函数可以访问数据，并确保它们不会被任意修改。为了实现这一点，可以使用 `const` 关键字将参数中的数据定义为常量。`const` 是\
  \ C 语言的关键字，用于防止变量被修改。使用 `const` 可以部分增强程序的安全性和健壮性。\n\n#### 示例 4.18 使用 const 防止数组被修改\n\
  \n```\n 1    //const 示例\n2    #include <stdio.h>\n3    #define SIZE 3\n4    void\
  \ modify( const int a[] ); //函数原型\n5    int b[SIZE]; //用于存储更新数组的全局变量\n6\n7    //程序从\
  \ main 开始\n8    int main(void)\n9    {\n10      int a[SIZE] = { 3, 2, 1 }; //初始化\n\
  11      int i; //计数器\n12\n13      modify(a); //调用函数\n14      printf( \"\\n Array\
  \ a after calling modify:\" );\n15      for( i = 0 ; i < SIZE ; i++ )\n16      {\n\
  17         printf( \"%3d\", a[i] ); //函数调用后打印数组\n18      }\n19\n20      printf(\
  \ \"\\n Array b after calling modify:\" );\n21      for( i = 0 ; i < SIZE ; i++\
  \ ) // 打印更新后的数组\n22      {\n23         printf( \"%3d\",  b[i] );\n24      }\n25\
  \      return 0;\n26     }\n27\n28    //从数组 a 获取值，处理它们并将并将结果存储在数组 b 中\n29    void\
  \ modify(const int a[])\n30    {\n31        int i; //计数器\n32        for(i=0;i<SIZE;i++)\n\
  33        {\n34      //a[i]=a[i]*2; 如果尝试修改 a，会导致编译错误\n35           b[i]=a[i]*2;\n\
  36       }\n37    }\n程序结果：\nArray a after calling modify: 3  2  1\nArray b after\
  \ calling modify: 6  4  2\n```\n\n## 4.7 递归\n\n迭代是人性，递归是神性。– L. Peter Deutsch\n\n\
  #### 4.7.1 案例\n\n上周末，布朗先生带着丹尼尔参加了一个家庭聚会。由于丹尼尔从未参加过聚会，布朗先生向他介绍了房间里的另外四个孩子。五个孩子随后坐在一起。当布朗先生询问他们的年龄时，第一个孩子\
  \ A 说：“我比左边的 B 大 2 岁。”B 决定也这样做可以说：“我也比左边的 C 大 2 岁。”C 模仿道：“我比左边的 D 大 2 岁。”D 说：“我比丹尼尔大\
  \ 2 岁。”轮到丹尼尔时，他诚实地回答自己 10 岁。\n\n布朗先生大笑起来问：“这很有趣。你们打算怎么解决这个问题？”\n\n“我 10 岁，所以 D 是\
  \ 10+2=12 岁，C 是 12+2=14 岁，B 是 14+2=16 岁，A 是 16+2=18 岁。”丹尼尔快速回答道。“做得好！”布朗先生说，“你们中有人能总结出一个公式吗？”B\
  \ 认为这是一个递归关系。一直在学习编程的 A 说这可以通过循环轻松实现，如图 4.113 所示。\n\n“只有这种方法吗？”布朗先生问。\n\n![](img/b_9783110692303-004_fig_113.png)\n\
  \n图 4.113：年龄计算方案 1。\n\nA 思考了一会儿说：“我们可以用另一种方式写公式，来模拟布朗先生询问我们年龄的过程。”他将 `age[n+1] =\
  \ age[n]+2` 改为 `age[n] = age[n–1]+2`。参见图 4.114。\n\n![](img/b_9783110692303-004_fig_114.png)\n\
  \n图 4.114：年龄计算方案 2。\n\n\n\n\n\n根据此图，我们可以写出如图 4.117 所示的代码。\n\n在第 5 行，我们可以看到`age()`\
  \ 函数正在调用它自己，但传入了较小的参数。\n\n“这就像是在照镜子。”A 说道，“站在两面镜子之间，你可以看到很多自己的影像，每一个影像都比上一个小。”请看图\
  \ 4.118 以了解该比喻的说明。\n\n![](img/b_9783110692303-004_fig_117.png)\n\n图 4.117：年龄计算方案\
  \ 2 的代码实现。\n\n![](img/b_9783110692303-004_fig_118.jpg)\n\n图 4.118：镜中镜中的猫。\n\n当一个计算过程直接（或间接地）调用自己时，我们称之为递归过程。如果一个对象的描述包含了自身，或者它定义了自身，我们就称这样的对象为递归对象。\n\
  \n递归过程是一个往返过程。随着问题规模变得越来越小，会达到一个规模无法再减小的终点。然后，我们从终点开始，沿着原始路径返回起点。\n\n### 4.7.2 递归的概念\n\
  \n我们在年龄示例中粗略讨论了递归。现在我们将正正式地定义递归。\n\n#### 4.7.2.1 递归的定义\n\n**术语解释** 递归\n\n*在数学和计算机科学中，递归指的是一个在定义中使用了自身的函数。*\n\
  \n递归的基本思想是将大规模问题转换为规模较小的相似子问题。因为我们使用同一个函数来解决不同规模的相似问题，该函数可能需要调用自身。此外，函数必须有一个终止条件以获得结果。否则，它将无限地调用自身。因此，递归过程必须包含两个关键元素：\n\
  \n*   基础情况（Base case）：问题最直接的实例，不需要递归即可解决。\n*   递归情况（Recursive case）：可以通过解决更直接的实例来解决的问题实例。\n\
  \n#### 4.7.2.2 递归的类型\n\n如果函数中的语句再次（无论是直接或间接）调用该函数，我们称之为函数的递归调用。图 4.119\n\n图 4.119：直接递归调用。\n\
  \n![](img/b_9783110692303-004_fig_120.png)\n\n图 4.120：间接递归调用。\n\n与嵌套函数调用相比，递归调用是嵌套调用的特殊情况：被调用的函数正是调用者本身。直接和间接递归调用会导致函数调循环。如果没有基础情况，程序将陷入类似于无限循环的状况。\n\
  \n#### 4.7.2.3 递归与迭代的比较\n\n递归和迭代基于程序控制结构：迭代使用循环结构，而递归使用分支结构。两者都涉及循环：迭代显式地使用循环，而递归通过重复函数调用来使用循环。递归和迭代都需要终止条件：迭代在循环条件评估为假时终止，而递归在遇到基础情况时停止。\n\
  \n### 4.7.3 递归示例\n\n**示例 4.19** 使用递归计算阶乘\n\n$\\left\\{ \\begin{matrix} {\\!\\!\\\
  !\\!\\!\\!\\!\\!\\!\\!\\!\\!\\!\\! 1,} & {n = o} \\\\ {n \\cdot (n - 1)!,} & {n\\\
  , > \\, 0} \\end{matrix} \\right.$\n\n**分析**\n\n1. 算法描述\n\n计算阶乘的过程如下：\n\n*   $n!$\
  \ 可以通过 $n * (n-1)!$ 计算，因此只需要计算 $(n-1)!$；\n*   同样地，只需要计算 $(n-2)!$ 即可得到 $(n-1)!$；\n\
  *   通过这种方式，$n$ 变得越来越小。当 $n$ = 1 时，$1!$ 是我们已经知道的；\n*   然后我们回溯计算 $2!$；\n*   以及 $3!$；\n\
  *   最后，我们回溯计算。\n\n2. 代码实现\n\n```c\nint factorial(int n) {\n  if (n <= 1) return\
  \ 1;\n  return n * factorial(n - 1);\n}\n```\n\n\n\n\n\n### 3. 元素 3：输出决定函数类型。\n\n\
  #### 1. 函数间数据传输的三种方式：返回语句、参数和全局变量。\n\n1. `return statement`：只能将一个值从被调用函数传递给调用者。\n\
  2. `argument`：调用者通过地址或值将参数传递给函数。\n3. `global variables`：所有函数均可访问。\n\n图 4.122 显示了本章的主要内容及其关系。\n\
  \n![](img/b_9783110692303-004_fig_122.png)\n\n图 4.122：与函数相关的概念及其关系。\n\n* 我们可以将大规模问题划分为独立的模块，每个模块由一个子函数实现，\n\
  * 重复的任务也可以实现为代码段。\n* 厂家定义函数的实现方式，\n* 而用户通过调用函数来完成任务。\n* 输入、输出和功能定义了函数的结构，\n* 函数名描述了功能，\n\
  * 需要处理的数据放入参数列表中，\n* 输出类型决定了函数的类型。\n* 子函数需要与调用者通信，\n* 调用者通过函数调用使用它们，\n* 实际数据作为参数传递，\n\
  * 我们对单个数据使用值传递，对组数据使用引用传递，\n* 返回、参数和全局变量用于反向传递，\n* 我们应该根据要解决的问题来选择其中一种。\n* 我们使用存储类来标识变量的生命周期。\n\
  * 变量和函数的作用域可能不同。\n* 局部变量局限于函数内部，\n* 而全局变量对所有人可见。\n\n## 4.9 练习\n\n### 4.9.1 单选题\n\
