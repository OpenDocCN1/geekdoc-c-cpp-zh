  \n### 5.9.3 编程练习\n\n**1. 读/写格式化文件**\n假设文本文件 `20083.txt` 和文本文件 `20084.txt` 的内容都是格式为“xx.x.”的实数。请编写一个程序将这些文件的数据合并并保存到文件\
  \ `20085.txt` 中（`20083.txt` 数据在前，`20084.txt` 数据在后）。\n\n**2. 在文件中读写数据块**\n`score.txt`中有\
  \ 10 个学生的数据（包括学生 ID、姓名和三门课程的成绩）。请编写一个程序，将通过至少一门课程的学生数据存储到 `bhg.txt`，通过所有课程的学生数据存储到\
  \ `hg.txt`。\n\n**3. 从文件中读取字符**\n编写一个程序打开指定的文件（如果存在），以 128 字节为块读取数据，并以十六进制形式和 ASCII\
  \ 值形式在屏幕上打印每个数据块。\n\n\n\n\n```c\n /*该程序包含 3 个文件，main 函数在 test file 1 中*/\n01  #include\
  \ <stdio.h>\n02  extern int reset(void);    /*将 reset 声明为外部函数* /\n03  extern int\
  \ next(void);      /* 将 next 声明为外部函数 */\n04  extern int last(void);      /* 将 last\
  \ 声明为外部函数 */\n05  extern int news(int i);     /* 将 news 声明为外部函数 */\n06\n07  int\
  \ i=1;                                 /*定义全局变量 i*/\n08  int main()\n09  {\n10 \
  \       int i, j;                         /*定义局部变量 i 和 j*/\n11        i=reset();\n\
  12        for (j=1; j<4; j++)\n13        {\n14             printf(\"%d\\t%d\\t\"\
  ,i,j);\n15             printf(\"%d\\t\",next());\n16             printf(\"%d\\t\"\
  ,last());\n17             printf(\"%d\\n\",news(i+j));\n18         }\n19       \
  \ return 0;\n20  }\n```\n\n`testfile2.cpp`:\n\n```cpp\n 01  extern int i;      \
  \                  /*声明全局变量 i*/\n02\n03  int next(void)\n04  {\n05     return (\
  \ i+=1);\n06  }\n07\n08  int last(void)\n09  {\n10     return ( i+=1);\n11  }\n\
  12\n13  int news( int i)                  /*定义参数 i，它是一个局部变量*/\n14  {\n15     static\
  \ int j=5;                 /*定义静态变量 j*/\n16     return ( j+=i);\n17  }\n```\n\n\
  `testfile3.cpp`:\n\n```cpp\n 01  extern int i;                      /*声明全局变量 i*/\n\
  02  int reset(void)\n03  {\n04     return ( i );\n05  }\n```\n\n## 术语\n\n- **内部函数\
  \ (Internal function)**：内部函数只能被同一文件中的函数访问。我们使用关键字 `static` 来定义内部函数。它们也被称为静态函数。\n\
  \n- **外部函数 (External function)**：如果我们使用关键字 `extern` 定义一个函数，那么该函数就是外部函数。例如：\n\n```\n\
  \ extern int reset(void);\n```\n\n其他文件可以调用函数 `reset`。如果我们在函数定义中省略了 `extern`，那么该函数默认是外部的。\n\
  \n在调用外部函数的文件中，我们应该使用 `extern` 来指示该函数是外部的。\n\n### 声明与定义的区别\n当一个函数或变量被声明时，不会为它分配物理内存。声明确保我们的程序可以被编译。当一个函数或变量被定义时，它会占用内存物理空间。一个函数或变量可以被声明多次，但只能定义一次。\n\
  \n### 当有多个文件时，如何访问全局变量？\n\n如果我们在一个文件中定义了一个全局变量并在其他文件中访问它，我们必须使用关键字 `extern` 声明该全局变量。然而，如果全局变量是使用\
  \ `static` 定义的，那么它只能在同一个文件中访问，而不能被其他文件访问。\n\n### 向项目添加多个文件，我们应该遵循以下步骤：\n\n1. 在 IDE\
  \ 中创建一个新项目（假设名为 `test`），如图 A.1 所示。\n\n![](img/b_9783110692303-006_fig_001.jpg)\n\
  \n图 A.1：创建一个新项目。\n\n2. 在项目 `test` 中创建一个新文件 `testfile1.cpp`，如图 A.2 所示。\n\n![](img/b_9783110692303-006_fig_002.jpg)\
  \ ![](img/b_9783110692303-006_fig_003.jpg)\n\n图 A.2：创建一个新文件 `testfile1.cpp`。\n\n\
  3. 在项目 `test` 中创建一个新文件 `testfile2.cpp`，如图 A.3 所示。\n\n![](img/b_9783110692303-006_fig_004.jpg)\
  \ ![](img/b_9783110692303-006_fig_005.jpg)\n\n图 A.3：创建一个新文件 `testfile2.cpp`。\n\n\
  4. 在项目 `test` 中创建一个新文件 `testfile3.cpp`，如图 A.4 所示。\n\n## 附录 B 式\n\n- **内部函数**：内部函数只能被同一文件中的函数访问。我们使用关键字\
  \ `static` 来定义内部函数。它们也被称为静态函数。\n\n- **外部函数**：如果我们使用关键字 `extern` 定义一个函数，那么该函数就是外部函数。例如：\n\
  \n```\n extern int reset(void);\n```\n\n其他文件可以调用函数 `reset`。如果我们在函数定义中省略了 `extern`，那么该函数默认是外部的。\n\
  \n在调用外部函数的文件中，我们应该使用 `extern` 来指示该函数是外部的。\n\n\n\n\n在日常生活中有很多“面向过程”的例子。例如，“去大学医院门诊部”的过程包含几个步骤，如图图\
  \ B.2 所示。每个步骤都可以被看作是一个独立的程序。换句话说，我们一次只做一件事。这种步骤在编程中被称为“模块”。（注意：假设我们在完成流程后一次性付费。）\n\
  \n![](img/b_9783110692303-007_fig_002.png)\n\n图 B.2：“去大学医院门诊部”的第一个过程。\n\n*   **模块**：模块是语句的集合，它有自己的名称，并可以独立地完成特定任务。模块的内部实现从外部来看是不可见的。模块通过信息接口与外部通信。\n\
  *   **信息接口**：信息接口描述了其他模块和程序如何使用该模块。接口中的信息包括输入/输出信息。\n\n在之前的例子中，“处方”和“化验结果”就是接口信息。处方被多个模块使用。我们将所有模块可用的数据称为“全局变量”。\n\
  \n过程化语言是添加了子程序的命令式语言。由于所有现代命令式语言都具有这一特征，我们经常交叉使用这两个术语。在编程中，“过程”、“子程序”、“函数”和“模块”等术语指的是同一种东西。\n\
  \n“面向过程”是一种关注模块的编程范式。在面向过程的编程中，我们使用自顶向下的逐步细化开发方法，将一个复杂系统划若干个独立的子模块。然后我们确定这些模块是如何组合的，以及它们是如何相互作用的（即它们如何相互调用）。在设计完这些子模块后，我们将它们组合在一起得到最终系统。每个模块都通过顺序结构、分支结构和循环结构等基本结构来实现。\n\
  \n面向过程范式的思想源于计算机指令的序列。它将解决方案转化为概念化的步骤，然后将这些步骤翻译成程序指令集，其中指令按特定顺序列出。\n\n过程化程序由三个部分组成，如图图\
  \ B.3 所示。模块的调用规则描述了模块的执行顺序。在程序的单词运行中，控制会在调用程序和被调用程序之间交换，如图图 B.4 所示。\n\n![](img/b_9783110692303-007_fig_003.png)\n\
  \n图 B.3：过程化程序的结构。\n\n函数调用将程序的执行（通常是子程序）移交给其他模块，并保留调用程序的上下文。在被调用程序结束后，它会返回到保存的上下文中。\n\
  \n面向过程编程的本质是将问题划分为模块。它根据计算机解决问题的特点来解决实际问题。多模块系统按照预定的规程进行模块调用。\n\n当这样一个系统的规模很大时，如果我们以后有不同的需求，就很难修改它。在上面的医院例子中，如果我们想把“化验”放在“缴费”之后，必须更新流程的许多组件。如果系统非常广泛，将难以维护。此外，如果我们对全局数据不加任何限制，它们中的错误将影响系统的其他组件。“处方”就是医院例子中的全局数据。如果药房没有处方上列出的药物，许多模块中就会发生异常。面向过程编程中关键问题的总结见图图\
  \ B.5。\n\n![](img/b_9783110692303-007_fig_004.png)\n\n图 B.4：过程调用的流控制。\n\n![](img/b_9783110692303-007_fig_005.png)\n\
  \n图 B.5：面向过程编程中的关键问题。\n\n## B.2 面向对象编程\n\n让我们来看一个关于人类和动物的故事。有一个笼子，如图图 B.6 所示。我们最多可以在笼子里放入一个动物。如果笼子是空的，猎人可能会放一只猴子进去并通知动物园；农民可能会放一只猪进去并通知餐厅；动物园想买猴子，而餐厅想买猪。我们能用程序模拟这个过程吗？我们会发现我们永远不知道谁会先行动。\n\
  \n![](img/b_9783110692303-007_fig_006.png)\n\n图 B.6：人类与动物的故事。\n\n在过程范式中，模块按照预定的顺序执行。一个模块的改变可能需要相关模块的改变。因此，模块执行的结构是由事件驱动的。“获取或放入动物”是事件，而“通知”是一条消息。图\
  \ B.7 展示了该例子的抽象。过程化在这样的事件驱动问题不起不起，因此人们寻找其他的编程范式。因此，面向对象编程诞生了。\n\n如果我们使用事件驱动的方法描述医院例子，我们会发现系统中模块的性质发生了变化。在图\
  \ B.8，最初由患者执行的步骤现在变成了部门通过信息交换完成。从问题中提取的功能不再是核心。相反，焦点变成了部门等实体。这里的事件是特定的证书，如医保卡、挂号单和处方。患者必须有医保卡和钱才能挂号。没有缴费证明的化验单就无法开处方。这些驱动了实体之间的操作和信息交换。\n\
  \n![](img/b_9783110692303-007_fig_007.png)\n\n图 B.7：面向过程与面向对象。\n\n![](img/b_9783110692303-007_fig_008.png)\n\
  \n图 B.8：“去大学医院门诊部”的第二个过程。\n\n实体具有属性（数据）和行为（功能）。为了让对象工作，我们需要相应的证书。在面向对象编程中，这些实体变成了对象。对象包含数据及其对应的操作。证书变成了消息（或事件）。对象的通信和控制通过发送和接收消息来实现，如图图\
  \ B.9 所示。\n\n![](img/b_9783110692303-007_fig_009.png)\n\n图 B.9：实践中面向对象概念的抽象。\n\n\
  \n\n\n面向对象的系统建立在对象之间的交互之上。模块的执行由事件或消息驱动。改变一个模块产生的影响通常局限于该模块本身。在医院的示例中，如果我们把“付款（payment）”之后加上“检验（assay）”，只需要向收银员发送“检验单（assay\
  \ sheet）”消息而不是实验室，然后将“带有付款证明的检验单”发送给实验室。图 B.8 中的虚线表示了这种变化。\n\n医院中的实体可以并行工作。然而，在具有单个\
  \ CPU 的计算机上，模块是按顺序执行的。我们如何在计算机上执行这些并行操作呢？解决方案是将消息存储在队列中并按顺序处理，如图 B.10 所示。一个事件产生一个消息，系统接收该消息。事件调度器从消息队列中获取消息并触发相应的过程。由于\
  \ CPU 运行速度很快，机器似乎在同时进行多项工作。\n\n![](img/b_9783110692303-007_fig_010.png)\n\n图 B.10：计算机中的事件驱动机制。\n\
  \n在 Windows 系统中，消息是基础的通信方法。事件是消息的主要来源。事件的发生是通过消息获知的。每当用户触发事件时（例如鼠标移动或击键），系统就会将其转换为消息并存储在相应程序的消息队列中。程序使用\
  \ `GetMessage` 获取消息，使用 `TranslateMessage` 进行预处理，并最终使用 `DispatchMessage` 将它们发送到窗口过程\
  \ `WndProc`。\n\n图 B.11 对比了面向过程的编程与面向对象的编程，并总结了主要差异。\n\n![](img/b_9783110692303-007_fig_011.png)\n\
  \n图 B.11：面向过程编程与面向对象编程的比较。\n\n“面向对象”是一种关注实体的思想。数据及其对它们的操作被封装到单一实体中：即对象。我们在类（class）中总结了相似对象的共同特征。类的大部分数据必须使用同类中的方法进行处理。类通过接口与外部世界交互。对象之间通过消息相互通信。用户决定程序的执行顺序。\n\
  \n引入“面向对象”的初衷是将“接口”与“实现”分离，以便低层级的改变不会影响高层的功能。面向对象的语言描述系统更加自然。使用这些语言可以更容易地复用代码并更新我们的应用程序。面向对象语言的主要特征包括：\n\
  \n1. 可识别性：系统中的基本组件可以被识别为离散的对象；\n2. 可分类性：具有相同数据结构和行为的对象可以形成它们自己的类；\n3. 多态性：对象具有唯一的静态类型和多个可能的动态类型；\n\
  4. 继承：数据和操作可以在不同层级的类之间共享。\n\n前三个是基本特征，而最后一种使得面向对象的语言与其他语言有所不同。它们（有时也带有动态绑定）使得强大的表达能力成为。面向对象程序中的组件是对象，每个对象都有自己的属性和行为。计算通过创建新对象和对象之间的通信完成。\n\
  \n## B.3 函数式编程\n\n函数式编程是一种数学思想，将计算描述为函数。\n\n在函数式编程中，程序是一个数学函数，它是将输入映射到输出的黑盒，如图 B.12\
  \ 所示。我们称之为黑盒，因为我们不知道它的实现。\n\n![](img/b_9783110692303-007_fig_012.png)\n\n图 B.12：函数式编程中的函数。\n\
  \n函数式编程中的“函数”一词不再是计算机中的子程序。相反，它指的是数学函数，即定义域内变量的映射。\n\n函数式语言具有以下特征：\n\n* 函数式语言应该为程序员定义一系列原语（原子）函数供其使用；\n\
  * 函数式语言应该允许程序员使用原语函数构建新函数。\n\n函数式语言的主要用例是数学推导和并行计算。它们适用于解决有限规模的数学问题。\n\n### 函数式编程示例\
  \ 1\n\n数学表达式：`(1+2)*3−4` 可能会翻译成以下过程化语言代码：\n\n```\nvar a = 1 + 2;\nvar b = a * 3;\n\
  var c = b - 4;\n```\n\n函数式语言要求我们使用函数。我们可以将计算中的不同操作定义为函数，并将过程重写如下：\n\n```\nvar result\
  \ = subtract(multiply(add(1,2),3), 4);\n```\n\n### 函数式编程示例 2\n\nScheme 定义了一系列原语函数。函数名和输入在括号内，结果如下：\n\
  \n```\ncar 2 3 7 8 11 17 20 -> 2\ncdr 2 3 7 8 11 17 20 -> 3 7 8 11 17 20\n```\n\n\
  我们可以组合它们获取列表的第三个元素：`(car (cdr (cdr list)))`。如果列表的结果是 `7`。\n\n## B.4 逻辑编程\n\n逻辑编程是一种范式，指导我们根据大脑中的逻辑推导和计算编写代码：算法\
  \ = 逻辑 + 控制\n\n逻辑描述描述并为它们制定规则。事实指的是对象和属性之间的关系。规则描述事实之间的关系。程序的执行是基于规则的过程。逻辑编程与其他范式完全不同。\n\
  \n逻辑编程使用逻辑语言，并将计算视为受控制的技术。用户只需要编写程序的逻辑，控制部分留给系统的解释器。总之，编程过程可以用此公式表示：`facts+rules=results`。\n\
  \n1972 年，Alain Comerauer 小组发明了第一种逻辑编程语言 Prolog。Prolog 适用于人工智能程序，包括专家系统（使用复杂模型生成建议或答案）、自然语言处理、定理证明（作为现有理论扩展的新理论）以及一些智能游戏。Prolog\
  \ 通常与其他语言一起使用，其中逻辑操作在 Prolog 中完成，计算和用户界面等组件在其他语言中实现。\n\n### 逻辑编程示例\n\n事实和规则在 Prolog\
  \ 中构建程序。例如，关于人类的两个事实如下：\n\n```\nhuman(John).\nmortal(human).\n```\n\n用户可以检查：\n\n\
  ```\n?-mortal(John).\n```\n\n程序将回答 yes。\n\n现在我们可能对图 B.13 中的编程范式进行总结。\n\n![](img/b_9783110692303-007_fig_013.png)\n\
  \n图 B.13：编程范式的总结。\n\n# 附录 C void type\n\nC 语言中有很多 “void type” 的用法。在不同情况下，void type\
  \ 有不同的含义。\n\n## 1. void type\n\n\n\n\n类型指示符为 `void`。`void` 类型不指代特定的数据类型。相反，它用于函数没有返回值的情况，或者表示通用指针。\n\
  \n## 2. void 类型函数\n\n当函数被调用时，它通常会向调用者返回一个值。该值必须具有数据类型，并应在函数的定义和声明中指定。然而，某些函数不向调用者返回任何值。这些函数可以定义为“void\
  \ 类型”。\n\n## 3. void 类型指针和空指针\n\n### 3.1 void 类型指针\n\nvoid 指针也称为通用指针或无关联类型的指针。void\
  \ 指针指向的内存块中存储的数据可以是 C 语言中提供的任何类型。\n\n为什么我们需要 void 指针？因为有时我们不知道要在 void 指针指向的内存块中存储什么数据。因此，需要一种特殊的机制。例如，`malloc`\
  \ 在程序执行期间动态请求一块连续的内存。`malloc` 的返回值是指向该区域的指针。`malloc` 的设计者不知道用户将在分配的内存中存储什么，因此他/她必须将返回值设置为\
  \ void 指针以适应所有情况。\n\n某些语言为指针有专门的类型。这样做的好处是无论在分配的内存块中存储什么数据都没有关系。\n\n除非强制将其转换为类型指针，否则我们无法使用\
  \ void 指针来访问数据。\n\n### 3.2 空指针\n\n注意，空指针不是 void 指针。空指针的值为 `NULL`。它不指向任何内存地址。在 `malloc`\
  \ 示例中，如果内存分配失败，将返回 `NULL` 作为异常的指示。\n\n# 索引\n\n- 数组\n    - –数组元素\n    - –数组名\n  \
