  \n[content]\n### 示例 3.9 投票计数器\n\n在选举中有三位候选人，如图 3.31 所示。请编写一个程序来统计每个候选人的票数。使用键盘输入模拟计数过程。每位投票者必须从三位候选人中选择一个。假设总共有\
  \ `N` 票。\n\n#### 分析\n\n**1. 数据结构设计**\n投票统计中有两种类型的数据，因此最好使用结构体来存储它们。该结构体应包含两个成员：候选人姓名和票数。\n\
  \n```c\nstruct person vote[3] ={\"Zhang\",0, \"Tong\",0, \"Wang\",0};\n```\n\n**2.\
  \ 投票统计表设计**\n有三位候选人，因此我们使用一个大小为 3 的数组。每个元素都用候选人姓名和 0 票初始化。\n\n**3. 算法设计和代码实现**\n\
  （见图 3.32）\n\n\n\n\n```c\n//投票计数\n#include <stdio.h>\n#include <string.h>\n#define\
  \ N 50                      //选票数\nstruct person\n{  char name[20];          //候选人姓名\n\
  int sum;                     //总票数\n};\nint main(void)\n{\n   struct person  vote[3]\n\
  \     ={\"Zhang\",0, \"Tong\",0, \"Wang\",0};\n   int i,j;\n   char in_name[20];\n\
  \   for(i=0;i<N;i++)                            //N 票\n     {\n     scanf(\"%s\"\
  ,in_name);        //输入候选人姓名\n     for(j=0;j<3;j++)               //给对应的 sum 加 1\n\
  \     if (strcmp(in_name, vote[j].name)==0)\n     {\n     vote[j].sum++;\n     }\n\
  \   }\n   for (i=0;i<3;i++)            //输出结果\n   {\n   printf(\"%s,%d\\n\",vote[i].name,vote[i].sum);\n\
  \   }\n   return 0;\n}\n```\n\n# 程序阅读练习：寻找年龄最大的人\n\n以下程序使用结构体来存储多个人的姓名和年龄，以找到年龄最大的人并输出结果：\n\
  \n```c\n #define N 4\n#include \"stdio.h\"\nstatic struct man\n{\n        char name[8];\n\
  \        int age;\n}   person[N]= {\"li\",18,\"wang\",19,\"zhang\",20,\"sun\",22};\n\
  int main(void)\n{\n       struct man *q,*p;\n       int i,m=0;\n       p=person;\n\
  \       for (i=0; i<N; i++)\n      {\n         if (m < p->age) q=p++;\n        \
  \        m=q->age;\n      }\n   printf(\"%s,%d\",(*q).name,(*q).age);\n   return\
  \ 0;\n}\n```\n\n## 3.4 用体 (Union)\n\n### 3.4.1 引言\n\nBrown 先生所在的大学有一个实验室。该实验室供所有相关研究小组的成员使用。在使用之前应该预约实验室。然而，不同小组的研究人员不能共同使用实验室。我们可以如下列出有权使用实验室的研究小组和人员：\n\
  \n```\n 公共实验室\n{\n        研究小组 1:   人员 1；\n        研究小组 2:   人员 2；\n        …\n\
  \        研究小组 n:   人员 n；\n}\n```\n\n为了节省内存空间，计算机也使用了这种内存共享策略。我们可以将无法同时访问的变量存储在一个内存单元中。这种数据结构被称为“用体”（union）。当我们有多个变量且每次只使用其中一个时，可以使用用体将它们存储在同一个内存单元中。\n\
  \n### 3.4.2 用体的内存布局\n\n与结构体类似，类型定义、变量定义和成员访问也是用体的关键问题。\n\n#### 3.4.2.1 用体类型定义\n\n\
  图 3.33 阐了用体类型定义的语法。\n\n![](img/b_9783110692303-003_fig_033.png)\n\n图 3.33：用体类型定义的语法。\n\
  \n与结构体类型定义类似，用体类型定义仅声明类型。在此阶段不分配内存空间。\n\n#### 3.4.2.2 用体变量定义\n\n图 3.34 显示了定义用体变量语法，这与结构体变量相似。\n\
  \n![](img/b_9783110692303-003_fig_034.png)\n\n图 3.34：定义用体变量语法。\n\n#### 3.4.2.3 用体成员引用\n\
  \n图 3.35 显示了如何引用用体成员。我们在结构体中也见过类似的语法。\n\n![](img/b_9783110692303-003_fig_035.png)\n\
  \n图 3.35：引用用体成员的语法。\n\n**示例 3.10** 用体成员的内存布局\n\n假设我们有一个如图 3.36 所示所示用体。与结构体成员不同，`x`、`ch`\
  \ 和 `y` 具有相同的地址。分配的内存长度由尺寸最大的成员决定。\n\n![](img/b_9783110692303-003_fig_036.png)\n\
  \n图 3.36：用体成员共享地址。\n\n#### 3.4.2.4 用体与结构体的比较\n\n用体和结构体有许多共同特征。图 3.37 展示了这两种数据结构的比较。\n\
  \n![](img/b_97831003_fig_037.png)\n\n图 3.37：用体与结构体的比较。\n\n**示例 3.11** 使用用体的简单程序\n\
  \n请在调试器中检查用体的内存布局。\n\n1. **测试程序**\n以下测试程序定义了一个用体并按照定义顺序对其成员赋值。运行程序后，可以检查内存布局。\n\n\
  ```c\n #define N 4\n#include \"stdio.h\"\nstatic struct man\n{\n        char name[8];\n\
  \        int age;\n}   person[N]= {\"li\",18,\"wang\",19,\"zhang\",20,\"sun\",22};\n\
  int main(void)\n{\n       struct man *q,*p;\n       int i,m=0;\n       p=person;\n\
  \       for (i=0; i<N; i++)\n      {\n         if (m < p->age) q=p++;\n        \
  \        m=q->age;\n      }\n   printf(\"%s,%d\",(*q).name,(*q).age);\n   return\
  \ 0;\n}\n```\n\n2. **调试**\n图 3.38 显示成员都存储在相同的地址[图 3.39]。特别是，它显示了将 `a` 赋值给 `ch` 之后的内存布局。\n\
  \n![](img/b_97831103_fig_038.png)\n\n图 3.38：用体数据。\n\n图 3.40 显示 `ch` 的值为 `0x61`，这是\
  \ `a` 的 ASCII 码。\n\n![](img/b_97831103_fig_039.png)\n\n图 3.39：用体的检查。\n\n3. **显示格式**\n\
  根据 IEEE754 标准，如果存储为 32 位浮点数，float 变量的值为 `0x40000000`。这就是 `y` 显示为 `2`。\n\n![](img/b_97831103_fig_040.png)\n\
  \n图 3.40：实数的存储格式。\n\n**用体的操作**\n\n假设我们有来自多个老师的数据，如图 3.42 所示。数据包括他们的 ID、姓名、职称、教授的课程数量（如果是讲师）或发表的论文数量（如果是教授）。请编写一个程序打印这些数据并计算论文的总数。\n\
  \n```c\n 1 //用体的操作\n2  #include <stdio.h>\n3  #define  N 5 //老师人数\n4\n5  union work\n\
  6  { char  course[10]; //课程名\n7   int   num; // 课程或论文数量\n8  };\n9\n10 struct  teachers\n\
  11 {  int   number; //ID\n12    char  name[8]; //姓名\n13    char  position; // 职称\n\
  14    union  work  x; // 课程或论文数量\n15 } teach[N];\n1\n17 int main(void)\n18 {\n19\
  \     struct teachers teach[N]\n20     ={ {1, \"Zhao\",'L',\"program\"},\n21   \
  \   {2, \"Qian\",'P',3},\n22      {3, \"Sun\",'P',5},\n23      {4, \"Li\",'L',\"\
  English\"},\n24      {5, \"Zhou\",'P',4},\n25      };\n26     int sum=0;\n27\n28\
  \     for(int i=0; i<N; i++)\n29     {\n30      printf ( \" %3d %5s %c \",teach[i].number,\n\
  31           teach[i].name,  teach[i].position);\n32      if (teach[i].position\
  \ =='L')\n33      {\n34       printf (\"%s\\n\", teach[i].x.course);\n35      }\n\
  36      else if ( teach[i].position =='P' )\n37      {\n38    printf (\"%d\\n\"\
  , teach[i].x.num);\n39       sum=sum+teach[i].x.num;\n40      }\n41     }\n42  \
  \   printf (\"paper total is %d\\n\", sum);\n43     return 0;\n44 }\n```\n\n\n\n\
  \n\n```\n 1  Zhao L program\n2  Qian P 3\n3  Sun P 5\n4  Li L English\n5  Zhou P\
  \ 4\npaper total is 12\n```\n\n## 3.5 枚举\n\n### 3.5.1 引言\n\n当 Daniel 开始学习水彩画时，他被不同颜色混合成新颜色的过程震惊了。他不断向\
  \ Brown 先生提问，例如“红色和蓝色混合的结果是什么？”或“如果我混合黄色和红色会怎样？”这让 Brown 先生精疲力竭。因此，Brown 先生决定写一个程序，根据他儿子的输入来回答这些问题。\n\
  \n图 3.43 显示了三种原色中混合两种颜色的结果。\n\n![](img/b_9783110692303-003_fig_043.png)\n\n图 3.43：调色器。\n\
  \n在编写代码之前，Brown 先生需要设计一种数据结构。他在图 3.43 中使用了指针数组来存储颜色名称：`char *ColorName[] = {“red\"\
  ,\"yellow\",\"blue\",\"orange\",\"purple\",\"green”};`\n\n图 3.43 中的二维数组应该用数组 `ColorName`\
  \ 中颜色的索引来初始化，而不是实际名称字符串，因为索引占用的内存更少且更容易处理。\n\n```\nint ColorTab[3][3]={{0,3,4},{3,1,5},{4,5,2}};\n\
  ```\n\n在初始化过程中，Brown 先生发现很难记住颜色对应的数字。如果颜色更多，将它们记住并正确初始化数组将变得更加困难。这是因为颜色的名称比抽象的数字更直观。为了解决这个问题，Brown\
  \ 先生尝试为每种颜色定义宏，这样他就可以直接在程序中使用这些直观的名称。\n\n```\nint int ColorTab[3][3]={{red,orange,purple},{orange,yellow,green},{purple,\
  \ green,blue}};\n```\n\n完整的程序如下：\n\n```\n01 #include \"string.h\"\n02 #include \"\
  stdio.h\"\n03 #define red 0\n04 #define yellow 1\n05 #define blue 2\n06 #define\
  \ orange 3\n07 #define purple 4\n08 #define green 5\n09\n10 //定义调色器\n11    int ColorTab[3][3]={{red,orange,purple},{orange,yellow,green},{purple,\
  \ green,blue}};\n12\n13 int main(void)\n14\n{\n15     char color1[8]; //读取输入 1\n\
  16     char color2[8]; //读取输入 2\n17     char *ColorName[]= {\"red\",\"yellow\",\"\
  blue\",\"orange\",\"purple\",\"green\"};\n18     int i=0,j=0;\n19\n20     printf(\"\
  请输入任意两种红色、黄色或蓝色：\\n\");\n21     gets(color1);\n22     gets(color2);\n23     while\
  \ (0!=strcmp(color1,ColorName[i])) i++;\n      // 查找第一个输入的索引 i\n24     while (0!=strcmp(color2,ColorName[j]))\
  \ j++;\n      // 查找第二个输入的索引 j\n25     // 在调色器中使用 i 和 j 查找混合结果\n26     printf(\"\
  %s+%s=%s\\n\",ColorName[i],ColorName[j],ColorName[ColorTab[i][j]]);\n27\n28    \
  \ return 0;\n29 }\n```\n\n然而，Brown 先生需要为三种原色的混合结果定义 6 个宏。如果有更多基础颜色，为每种可能的结果定义宏将非常繁琐。\n\
  \n我们经常在程序中使用数字表示状态，但正如我们在颜色示例中所看到的，数字没有状态名称那么直观，也不易读。如果我们能在程序中使用具有意义的单词来表示状态，那么它们将更容易被阅读和理解。\n\
  \n### 3.5.2 枚举的概念和语法\n\n事实上，C 和其他一些语言确实提供了一种使用自然语言单词表示变量可能值的方法。这种方法就是枚举（`enum`）。\n\
  \n在 C 语言中，枚举是由标识符表示的整数常量集合。枚举变量的值必须是该集合的成员。值得注意的是，如果给枚举变量赋值了超出枚举范围的值，系统不会报错。\n\n\
  枚举的语法与结构体（struct）和联合体（union）相似，如图 3.44 所示。\n\n\n\n\n注意：这是因为增加可能会破坏第一条规则。在这个示例中，`Weekday`\
  \ 被赋值为枚举成员的最后一个值，因此增加将使该值无效。\n\n## 3.6 类型定义\n\n### 3.6.1 引言\n\n#### 3.6.1.1 音乐文件的移植\n\
  \n丹尼尔收到了一个音乐播放器作为生日礼物，他花了大量时间用它听音乐。一天，他问父亲：“这些歌曲存储在计算机里，它们是如何‘放进’这个小盒子的呢？”“哈哈，这是一个很好的问题，”布朗先生回答道。\n\
  \n我们现在可以在各种设备上播放音乐，但音乐文件是如何存储在它们中的呢？我们知道数据以二进制形式存储在计算机中，音乐文件也是如此。`WAV`（波形音频文件格式）是\
  \ PC 上常用的多媒体音频文件格式之一。它是一种用于存储音频波形的数字音频格式，由微软和 IBM 设计。它于 1991 年首次引入 Windows 3.1 中。经过多次修订，它可以用于许多操作系统，包括\
  \ Windows、Macintosh 和 Linux。\n\n一个 `WAV` 文件有一个文件头，其中包含文件的元信息，随后是实际的音乐数据。图 3.45 显示了头中的元信息，它由多个数据条目组成。每个条目的的大小是固定的，不会随平台而改变。\n\
  \n我们之前提到过，基本类型的大小取决于平台。因此，程序员在将代码移植到其他平台时需要非常小心。当在不同不同 `int` 类型大小的平台上使用代码处理 `WAV`\
  \ 文件时，我们必须修改每个整数定义，以确保头中数据条目的长度与标准一致。这使得代码移植变得困难。\n\n![](img/b_9783110692303-003_fig_045.png)\n\
  \n图 3.45：`WAV` 文件头的格式。\n\n在这种情况下，如果我们将 32 位和 16 位的 `int` 类型重命名为 `UIN32` 和 `UIN16`，我们就可以将\
  \ `WAV` 文件头定义如下结构。在移植代码时，只需将 `UIN32` 和 `UIN16` 替换为目标平台的对应类型即可：\n\n```\nstruct tagWaveFormat\n\
  {\n      char cRiffFlag[4];\n      UIN32 nFileLen;\n      char cWaveFlag[4];\n \
  \     char cFmtFlag[4];\n      char cTransition[4];\n      UIN16 nFormatTag ;\n\
  \      UIN16 nChannels;\n      UIN16 nSamplesPerSec;\n      UIN32 nAvgBytesperSec;\n\
  \      UIN16 nBlockAlign;\n      UIN16 nBitNumPerSample;\n      char cDataFlag[4];\n\
  \      UIN16 nAudioLength;\n} ;\n```\n\n可以使用宏完成替换。\n\n#### 3.6.1.2 宏不够用的情况\n\n让我们来看一个特殊情况。我们本想通过以下代码的前两行将\
  \ `a` 和 `b` 定义为整数指针。然而，事实 `b` 并不是指针，如第 3 行所示。这是由于宏替换的规则：\n\n```\n01  #define PTR\
  \ int*\n02  PTR a, b;\n03  int *a, b;\n```\n\n在语法上，第 2 行类似于变量定义。人们可能会想象，如果 `PTR`\
  \ 是等同于 `int*` 的数据类型，那么这个问题就可以解决。因此，我们需要一种在 C 中定义类型别名的方法。\n\n#### 3.6.1.3 为类型定义别名\n\
  \nC 中定义别名的关键字是 `typedef`（type + define）。我们可以使用 `typedef` 重写前面提到的那两行：\n\n```\n01\
  \  typedef (int *) PTR\n02  PTR a, b;\n03  int *a, *b;\n```\n\n使用 `typedef` 的目的是解决宏引起的问题并使代码更具可读性。在实践中，`typedef`\
  \ 经常出现在类型大小至关重要的网络代码和驱动程序中。为了适应不同的编译器，我们最好定义并使用自己的类型。因此，在将代码移植到新平台时，只需更新几个头文件即可。`typedef`\
  \ 可以隐藏复杂的结构或依赖平台的数据类型，使程序更容易移植和维护。\n\n下一节将介绍 `typedef` 的语法和应用。\n\n### 3.6.2 typedef\
  \ 的语法和应用\n\n图 3.46 显示了如何使用 `typedef` 定义新类型。从本质上说，`typedef` 为现有数据类型创建别名。\n\n![](img/b_9783110692303-003_fig_046.png)\n\
  \n图 3.46：`typedef` 的语法。\n\n除了创建直观易记的别名外，`typedef` 的另一个用例是简化复杂的类型声明。图 3.47 显示了头中的元信息，它由多个数据条目组成。\n\
  \n（注：原文后续部分存在重复和混乱，此处已根据提供的逻辑进行清理处理）。\n\n\n\n\n\n```c\nstruct sT\n{\n    int x;\n\
  \    struct sT *y;\n} *p;\nstruct sT a[4]={20,a+1,15,a+2,30,a+3,17,a };\nint main(void)\n\
  {\n    int i;\n    p=a;\n    for(i=1; i<=2; i++) {\n        printf(\"%d,\", p->x);\n\
  \        p=p->y;\n    }\n    return 0;\n}\n```\n\n上述程序的输出结果是（）\n\nA) 20,30,\n\n\
  B) 30,17\n\nC) 15,30,\n\nD) 20,15,\n\n### 3. [数组元素：使用变量引用] 下列程序的输出是（ )）\n\n```c\n\
