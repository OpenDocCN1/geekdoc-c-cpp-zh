  ### 1. 代码实现\n\n如图 4.71 所示，`main` 函数在一个表达式中多次调用 `factorial`。\n\n![](img/b_9783110692303-004_fig_071.png)\n\
  \n图 4.71：阶乘函数的多次调用。\n\n### 示例 4.5 调用多个函数\n\n有一个有序数组。请编写一个程序，将一个输入数字插入数组中，使得结果数组仍然是有序的。\n\
  \n要求：使用二分查找找到插入位置，然后使用 `move` 函数将元素向后移动。有序数组和输入在 `main` 函数中给出。\n\n#### 1. 算法设计\n\
  \n无论是否使用二分查找函数查找关键字，`mid` 值将是插入新数字的位置索引。找到此索引后，我们可以使用 `move` 函数将数组元素向后移动，并将数字插入到位置\
  \ `mid`。\n\n#### 1. 代码实现\n\n```c\n /*===============================================\n\
  功能: 二分查找\n输入: 数组地址、数组长度、要查找的关键字值\n输出: 最后搜索的位置\n===============================================*/\n\
  int BinarySearch  (int a[], int n, int key)\n{\n  int low=0, high=n-1;\n  int mid;\n\
  \  while (low<=high)\n  {\n    mid = (low+high+1)/2;\n    if (a[mid]== key) break;\
  \ //搜索成功\n    else\n    {\n      if (a[mid]> key)  high = mid-1; // 在低范围搜索\n   \
  \   else low = mid+1; // 在高范围搜索\n    }\n  }\n  return mid;\n}\n/*===============================================\n\
  功能: 移动数组元素\n输入: 数组地址、数组长度、从开始移动的位置\n输出: 无\n===============================================*/\n\
  void move(int a[],int n,int subscript)\n{\n  int i;\n  for(i=n;i>subscript;i--)\n\
  \  {\n    a[i]=a[i-1];\n  }\n}\n#include <stdio.h>\n#define N 11\nint main(void)\n\
  {\n  int array[N]={5,10,19,21,31,37,42,48,50,55};\n  int number;          //要插入的数字\n\
  \  int insert_sub; //插入位置\n  printf(\"The original array:\\n\");\n  for(i=0;i<N;i++)\
  \ printf(\"%d \",array[i]);\n  printf(\"\\n\");\n  printf(\"Please insert a new\
  \ number:\");\n  scanf(\"%d\",&number);\n  insert_sub=BinarySearch (array,N-1,number);\
  \ //计算插入位置\n  move(array,N-1,insert_sub+1); //将插入位置之后的元素后移\n  array[insert_sub+1]=number;\
  \ //插入数字\n  printf(\"The array after insertion:\\n\");\n  for(i=0;i<N;i++) printf(\"\
  %d \",array[i]);\n  printf(\"\\n\");\n  return 0;\n}\n```\n\n### 示例 4.6 嵌套函数调用\n\
