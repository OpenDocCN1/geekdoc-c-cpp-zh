  \ 文件：对外部数据的操作\n\n## 主要内容\n\n* 文件的概念\n* 使用程序操作文件的基本步骤\n* 文件操作库函数的分类与功能\n* 文件操作库函数的示例\n\
  \n## 学习目标\n\n* 理解文件存储的目的\n* 能创建、读取、写入和更新文件\n* 了解文件的顺序访问\n* 了解随机访问\n\n## 5.1 引言\n\
  \nA 一直在学习 C 语言并觉得很有趣。他渴望用所学到的知识解决一些实际问题。\n\n一天，班长请他计算同学们在期中考试中平均成绩的排名。他利用自己的编程知识很快就完成了任务。他的程序要求用户输入班级每个学生的成绩信息，然后将排序后的平均分打印在屏幕上。\n\
  \n然而，班长在尝试程序后向 A 抱怨道：“我给了你成绩的电子版本，但你没有用。相反，你的程序让我通过键盘输入每一个成绩。那太乏味了。而且，你的程序只是把结果打印在屏幕上，我关闭它后什么都没了。我们学校要求提交电子记录。你的程序不够用户友好，我没法用。”\n\
  \n班长的抱怨让 A 无话可言。“程序如何读取成绩的电子记录呢？我们只学过读取键盘输入。此外，我如何将结果保存到数据文件中呢？”他心里想。\n\n总结来说，A\
  \ 的问题是：我们应该如何通过程序自动从持久存储中获取数据并将结果保存其中？\n\n众所周知，编程的目的是根据需要处理数据以完成特定任务。数据处理流程包括数据输入、数据处理和结果输出。程序的执行和测试也涉及数据输入和输出。因此，数据输入/输出是编程的关键部分。通过分析数据输入/输出过程，我们知道以下点：\n\
  \n1. 要处理的数据是由程序员在程序中创建的（在这种情况下，程序只能处理这些数据），或者是在程序执行期间输入的（用户在每次执行程序时都需要重新输入数据）。\n\
  2. 程序的结果输出到屏幕，而不是永久保存。\n\n正是正常数据输入/输出的这两个特性使得 A 的程序不用户友好。在实践中，我们对数据处理有以下需求：\n\n\
  1. 输入：数据量很大；输入数据总是相同的。\n2. 输出：我们需要经常检查结果；输出太多，无法在不滚动的情况下显示。\n\n在这些情况下，我们可以保存这些数据以便检查或重复使用。为了在计算机中永久保存数据，将其存储在外部内存中。操作系统以文件的形式管理外部内存中的数据。因此，有必要学习文件操作以快速、灵活地完成编程任务。\n\
  \n## 5.2 文件的概念\n\n文件是相关数据的有序集合。文件的名称称为文件名。我们在前面的章节中多次遇到文件。例如，我们提到过源文件、对象文件、可执行文件和库文件（头文件）。文件是数据的持久形式，使数据共享成为可能。\n\
  \n根据数据存储方式，C 语言中的文件可以分为二进制文件和文本文件。\n\n### 5.2.1 二进制文件\n\n二进制文件顾如名，以二进制代码存储数据。例如，整数\
  \ `5678` 被存储为 `00010110 00101110`，在内存中占用 2 字节（`5678` 的十六进制形式为 `0x162E`）。\n\n虽然我们可以在屏幕上查看二进制文件，但它们的内容通常是乱码，因为它们大部分是非文本字符。\n\
  \n### 5.2.2 文本文件\n\n文本文件也称为 ASCII 文件。此类文件中的每个字符在磁盘上以 1 字节 ASCII 码存储。例如，图 5.1 显示了数字\
  \ `5678` 的存储格式。\n\n![](img/b_9783110692303-005_fig_001.png)\n图 5.1：文本文件中的字符表示。\n\
  \n文本文件也称为 ASCII 文件。此类文件中的每个字符在磁盘上以 1 字节 ASCII 码存储。例如，图 5.1 显示了数字 `5678` 的存储格式。\n\
  \n![](img/b_9783110692303-005_fig_001.png)\n图 5.1：文本文件中的字符表示。\n\n文本文件也称为 ASCII 文件。此类文件中的每个字符在磁盘上以\
  \ 1 字节 ASCII 码存储。例如，图 5.1 显示了数字 `5678` 的存储格式。\n\n![](img/b_9783110692303-005_fig_001.png)\n\
  图 5.1：文本文件中的字符表示。\n\n文本文件也称为 ASCII 文件。此类文件中的每个字符在磁盘上以 1 字节 ASCII 码存储。例如，图 5.1 显示了数字\
  \ `5678` 的存储格式。\n\n![](img/b_9783110692303-005_fig_001.png)\n图 5.1：文本文件中的字符表示。\n\
  \n文本文件也称为 ASCII 文件。此类文件中的每个字符在磁盘上以 1 字节 ASCII 码存储。例如，图 5.1 显示了数字 `5678` 的存储格式。\n\
  \n![](img/b_9783110692303-005_fig_001.png)\n图 5.1：文本文件中的字符表示。\n\n文本文件也称为 ASCII 文件。此类文件中的每个字符在磁盘上以\
  \ 1 字节 ASCII 码存储。例如，图 5.1 显示了数字 `5678` 的存储格式。\n\n![](img/b_9783110692303-005_fig_001.png)\n\
  图 5.1：文本文件中的字符表示。\n\n虽然我们可以在屏幕上查看二进制文件，但它们的内容通常是乱码，因为它们大部分是非文本字符。\n\n文本文件也称为 ASCII\
  \ 文件。此类文件中的每个字符在磁盘上以 1 字节 ASCII 码存储。例如，图 5.1 显示了数字 `5678` 的存储格式。\n\n![](img/b_9783110692303-005_fig_001.png)\n\
  图 5.1：文本文件中的字符表示。\n\n### 5.2.3 文件结束标记和文件结束检查\n\n1. 文件结束 (EOF) 是一个文件结束标记。EOF 是在头文件\
  \ `<stdio.h>` 中定义的符号常量，其值通常为 -1。值得注意的是，EOF 仅用于文本文件，因为 -1 在二进制文件中也是有效字符。\n2. `feof()`\
  \ 是标准库中的一个函数，用于判断是否到达文件结束。它适用于二进制文件和文本文件。\n\n## 关于 EOF 的知识\n\n使用常量 EOF 代替 -1 增加了程序的移植性。ANSI\
  \ C 强调 EOF 必须是一个负整数（但不一定是 -1）。结果，EOF 的值在不同系统中不同。EOF 的输入方法取决于我们使用的是哪种系统，如图 5.2。\n\
  \n![](img/b_9783110692303-005_fig_002.png)\n图 5.2：不同系统的 EOF 输入方法。\n\n文件被视为 C 语言中的数据流。还有一个文件结束标记和一个判断是否到达结束的函数。在实践中，当用户用程序打开文件时，文件的内部指针指向流的开头。当用户执行操作时，指针可以移动到流的其他位置。最后，我们检查指针是否指向文件的结尾，以确保我们读取了整个文件。\n\
  \n## 5.3 文件操作流程\n\n\n\n到这里，我们应该对文件有一个基本的认识了。在实践中，我们是如何操作文件的呢？文件通常存储在外部介质（如磁盘）中，并在需要时被带入内部内存。我们将数据从磁盘移动到内存的过程称为“读”，将数据从内存移动到磁盘的过程称为“写”。\n\
  \n在操作系统中，每个文件都通过唯一的文件名来标识。计算机使用文件名来读取和写入文件。\n\n当我们自己在磁盘上的文件中查找数据时，必须使用其名称找到文件，从中读取数据并将其关闭。我们使用程序操作文件时也遵循相同的步骤。用程序访问文件的三个基本步骤是：\n\
  \n1. 打开文件\n2. 处理文件\n3. 关闭文件\n\n程序中可用的文件操作如下：\n\n1. 在磁盘上创建并保存新文件\n2. 打开已存在的文件\n3.\
  \ 对文件进行读写\n\n我们知道 `C` 语言没有输入输出语句。数据的输入输出是通过调用库函数完成的。从更广泛上说，操作系统将连接到计算机的所有输入输出设备都视为文件。因此，输入和输出就类似于从磁盘文件读取和写入。我们通常将显示器定义为标准输出文件。在屏幕上显示信息就是输出到标准输出文件。`printf`\
  \ 和 `putchar` 等函数都属于这一类。键盘通常被视为标准输入文件。通过键盘输入信息就是从标准输入文件输入数据。`scanf` 和 `getchar`\
  \ 等函数就是此类输入的示例。\n\n`ANSI` 定义了标准输入输出函数，并使用它们来读写文件。读者可以参考第一卷附录 C 了解这些函数的细节。我们将在后续章节中分析一些最常用的库函数。\n\
  \n## 5.4 内部内存与外部内存之间的通信\n\n如第 5.3 节介绍的文件操作流程所示，内部内存和外部内存必须相互通信以实现文件的读写操作。理想情况下，我们希望这种通信是同时完成的。然而，现实是残酷的。计算机的不同组件速度不同，因此任务往往在不同的时间完成。为了解决这个问题，我们在内部内存和外部内存之间的通信中引入了缓冲区系统。如图图\
  \ 5.3 所示。\n\n![](img/b_9783110692303-005_fig_003.png)\n\n图 5.3：缓冲区系统。\n\n### 知识\
  \ ABC 缓冲区\n\n由于 CPU 和 RAM 工作速度很快，而外部内存（如磁盘或 CD）工作速度较慢，计算机必须在等待外部内存后才能继续后续工作。这种速度不匹配严重影响了\
  \ CPU 的性能。因此，引入了“缓冲区”技术来解决这个问题，如图所示。\n\n缓冲区是内部内存中的一块存储空间，由系统在打开文件时进行分配和管理。缓冲区的大小取决于\
  \ `C` 的的版本。它通常是 512 字节的倍数。\n\n向外部内存中的文件写入数据时，我们并不直接写入外部内存，而是写入缓冲区。当缓冲区满或文件关闭时，其中的数据会自动写入外部内存。从文件读取时也是如此。起初，只将一个数据块读入缓冲区。当我们读取数据时，首先在缓冲区中查找。如果存在，我们直接从缓冲区中获取。否则，我们在外部内存中搜索。在找到想要的数据后，我们读取缓冲区中它们所在的数据块。缓冲区可以有效减少外部内存的访问。\n\
  \n使用缓冲区进行读写可以更好地利用磁盘。标准 `C` 也使用了缓冲区系统。\n\n使用缓冲区系统时，系统会为每个打开的文件创建一个缓冲区。随后，对文件的操作就变成了对缓冲区的操作。\n\
  \n为了方便程序员使用，`ANSI C` 定义了一个与文件缓冲区相关的信息的结构体（例如与缓冲区文件名、允许对文件进行的操作、缓冲区的大小以及正在访问的数据在缓冲区中的位置）。我们可以通过访问该结构体变量获取有关文件缓冲区的信息。该结构体的类型为\
  \ `FILE`，定义在 `stdio.h` 中（注意：根据我们对头文件的了解，在使用 `FILE` 操作文件时，必须包含此头文件）。\n\n`FILE` 类型包含的信息如下：\n\
  \n```\n typedef struct _iobuf\n{\n   char* _ptr;    // 指向缓冲区中第一个未读的字符\n   int _cnt;\
  \    // 剩余未读字符的数\n   char* _base;    // 指向字符数组，即该文件的缓冲区\n   int _flag;    // 文件某些属性的标志位\n\
  \   int _file;    // 用于获取文件描述。我们可以使用 fileno 函数获取文件的描述符\n   int _charbuf;    // 单字节缓冲区。如果缓冲区是单字节，则\
  \ _base 无效\n   int _bufsiz;    // 缓冲区的大小\n   char* _tmpfname;    // 临时文件名\n} FILE;\n\
  ```\n\n每当文件成功打开时，操作系统都会为该文件创建一个 `FILE` 变量，分配内存并返回其指针。系统将有关文件和缓冲区的信息存储在这个 `FILE`\
  \ 变量中。我们的程序可以使用该指针来获取文件信息并访问文件，如图图 5.4 所示。\n\n![](img/b_9783110692303-005_fig_004.png)\n\
  \n图 5.4：文件操作。\n\n文件关闭后，变量会被释放。只要我们有了这个文件指针，就可以使用系统提供的文件操作函数来操作文件，无需了解缓冲区的细节。这样文件操作代码就变得更容易编写了。现在我们将学习如何操作文件。\n\
  \n## 5.5 程序操作文件\n\n我们在第 5.3 节中介绍过程序操作文件的三个步骤：打开文件、读取文件和关闭文件。`ANSI C` 为这些步骤提供了对应的库函数。我们将在后续分析这些函数。\n\
  \n### 5.5.1 打开文件\n\n打开文件的库函数是 `fopen`，其详细信息如下：\n\n – 原型：`FILE fopen (char *filename,\
  \ char *mode)`\n\n – 功能：在内存中为文件分配缓冲区。\n\n – 参数：\n`filename`包含文件路径的字符串\n`mode`指示打开模式的字符串\n\
  \n – 返回：文件指针（NULL 表示由于发生异常未打开）\n\n注意：初学者在编程时经常忽略异常。他们通常认为调用 `fopen` 函数后文件就打开了，并直接使用返回的指针。这是问题的。`fopen`\
  \ 不一定打开成功。无效的文件名或权限不足会导致 `fopen` 发生异常。建议在调用 `fopen` 后检查文件是否成功打开。\n\n\n\n\n如图 5.5\
  \ 所示，模式 `w` 总是先检查文件是否存在，无论该文件是文本文件还是二进制文件。如果文件存在，该函数会删除现有文件并创建一个新文件。因此，我们在使用它时应该格外小心。如果我们想保留文件中的原始内容，则不应该使用模式\
  \ `w`，因为它会在不带任何警告的情况下删除所有内容。\n\n虽然这在语法上没有错误，但使用错误的文件打开模式可能会导致逻辑执行错误。例如，当我们使用写入模式\
  \ `w` 打开文件而不是使用更新模式 `r+` 时，文件内容将被删除。结论是，我们在访问文件之前必须确定正确的文件打开模式。\n\n## 知识点 ABC 文件路径\n\
  \n路径是我们在磁盘上搜索文件时需要访问的目录序列。路径分为绝对路径和相对路径。绝对路径从驱动器号开始，它是对文件位置的完整描述。相对路径是相对于目标位置的路径，它从当前目录开始。\n\
  \n可以唯一标识磁盘文件的字符串是：\n\n```\n Drive letter:\\Path\\Filename.Extension\n```\n\n例 1：我们正在寻找文件\
  \ `c:\\windows\\system\\config`。如果我们当前位于 `c:\\windows\\` 目录下，那么相对路径是 `system\\config`，绝对路径是\
  \ `c:\\windows\\system\\config`。\n\n例 2：\n\n```\n fp=fopen(\"a1.txt\",\"r\");\n\
  ```\n\n这是一个不包含路径信息的相对路径。在这种情况下，文件 `a1.txt` 位于当前目录（注意：当前目录是指包含此程序的项目目录）。\n\n```\n\
  \ fp=fopen(\"d:\\\\qyc\\\\a1.txt\",\"r\");\n```\n\n这是一个绝对路径，文件 `a1.txt` 位于 D 盘的\
  \ `qyc` 目录下。\n\n注意：我们使用 `\\\\` 而不是 `\\`，因为 `\\` 在字符串中需要被转义。\n\n### 5.5.2 读取和写入\n\
  \n与打开文件不同，读和写操作的情况非常多，因此人们为这些操作创建了一系列库函数，如图 5.6 和 5.7 所示。\n\n注意：我们从文件的当前位置进行读写操作。当前位置是数据读/写指针当前指向的位置。当文件被打开时，指针指向文件的开头；在我们成功读取或写入一个字节后，指针会自动向前移动（移动到下一个字节）。\n\
  \n现在我们将通过示例来介绍这些函数。\n\n![](img/b_9783110692303-005_fig_006.png)\n\n图 5.6：文件读写函数\
  \ 1。\n\n![](img/b_9783110692303-005_fig_007.png)\n\n图 5.7：文件读写函数 2。\n\n#### 例 5.1\
  \ 文件示例 1\n\n读取并显示文件 `file.txt` 中的字符。\n\n**分析**\n\n```\n 1     //从文件中逐个读取字符\n2  \
  \   #include <stdio.h>\n3     #include <stdlib.h>\n4\n5     int main(void)\n6  \
  \   {\n7       char ch;\n8       FILE *fp;    //定义一个 FILE 指针 fp\n9       fp=fopen(\"\
  file.txt\",\"r\");    //以只读模式打开文本文件 file.txt\n10     if (fp==NULL)    //打开文件失败的\n\
  11     {\n12       printf(\"cannot open this file\\n\");\n13       exit(0);    //调用库函数\
  \ exit 终止程序\n14     }\n15     ch=fgetc(fp);    //读取一个字符并赋值给 ch\n16     while(ch!=EOF)\
  \    //检查是否到达末尾，在此情况下等于\n        (!feof(fp)) in this case\n17    {\n18       putchar(ch);\
  \    //输出字符\n19       ch=fgetc(fp);    //读取一个字符并赋值给 ch\n20    }\n21    fclose(fp);\
  \    //关闭文件\n22    return 0;\n23  }\n```\n\n注意：我们在第 16 行使用 `while(ch!=EOF)` 来判断是否已到达文件末尾。该语句仅适用于以文本文件模式打开的文件。如果我们以二进制模式打开文件，则应该使用\
  \ `!feof(fp)`。否则，我们可能会在看到值“–1”时错误地认为文件已完全读取。\n\n**术语解释**\n\n`exit` 函数：`exit` 定义在\
  \ `<stdlib.h>` 中。它用于强制终止程序。当发生输入错误或程序无法打开文件时，使用 `exit` 来终止程序。\n\n**知识点 ABC** `exit()`\
  \ 和 `return` 有什么区别？\n\n`exit` 定义在 `<stdlib.h>` 中。它用于强制终止程序。当发生输入错误或程序无法打开文件时，使用\
  \ `exit` 来终止程序。`exit(0)` 表示程序正常退出。相比之下，`exit(1)` 表示异常。\n\n#### 例 5.2 文件示例 2\n\n\
  将指定的字符串写入文件，并将该字符串从文件中读取到数组中。\n\n**分析**\n\n```\n 1    //将指定的字符串写入文件\n2    #include\
  \ <stdio.h>\n3    char *s=\"I am a student\";//指定要写入的字符串\n4    int main(void)\n\
  5    {\n6      char a[100];\n7      FILE *fp;    //定义文件指针 fp\n8      int n=strlen(s);\
  \    //计算 s 的长度\n9\n10   //以写入模式打开文本文件 f1.txt\n11   if ((fp=fopen(\"f1.txt\",\"\
  w\"))!=NULL)\n12   {\n13     fputs(s,fp);    //将 s 指向的字符串写入 fp 文件\n14   }\n15  \
  \ fclose(fp);    //关闭文件\n16\n17   //以只读模式打开文本文件 f1.txt\n18   fp = fopen(\"f1.txt\"\
  ,\"r\");\n19   fgets(a, n+1, fp);    //从 fp 指向的文件读取内容到数组 a\n20   printf(\"%s\\n\"\
  ,a);    //打印 a\n21   fclose(fp);    //关闭文件\n22   return 0;\n23 }\n```\n\n注意：第 19\
  \ 行的 `fgets(a, n+1, fp)` 读取一个字符串并将其存储在数组 `a` 中。`a` 是之前定义的字符数组。`n+1` 指示程序从 `fp` 指向的文件读取\
  \ `n` 个字符并存入 `a`。这 `n` 个字符正是字符串 `s`。由于字符串必须以 `\\0` 终止，因此我们使用 `n+1` 而不是 `n`。\n\n\
  **思考与讨论** 是否有检查打开函数的返回值？\n\n**讨论:**良好的程序员在编程时会尽可能考虑所有可能的错误情况。在本例中，为了方便演示我们使用了短字符串\
  \ `s`，所以这样做是安全的。但在实践中，字符串 `s` 可能会非常长。在这种情况下，我们必须考虑 `a` 是否足够存储该字符串，以避免越界错误。此外，我们在以只读模式打开文件时没有检查\
  \ `fopen` 的结果，这在程序中是一个风险。\n\n\n\n\n\n```c\n 1    //将数据块写入文件\n2    #include \"stdio.h\"\
  \n3    #include \"stdlib.h\"\n4\n5    struct student    //定义结构体\n6    {\n7     \
  \ char name[15];\n8      char num[6];\n9      float score[2];\n10  } stu;\n11  int\
  \ main(void)\n12  {\n13    FILE *fp1;\n14    int i;\n15\n16    fp1=fopen(\"test.txt\"\
  ,\"wb\");\n17    if( fp1 == NULL)    //以二进制只写模式打开文件\n18    {\n19      printf(\"\
  cannot open file\");\n20      exit(0);\n21    }\n22    printf(\"input data:\\n\"\
  );\n23    for( i=0;i<2;i++)\n24    {\n25    //输入一行记录\n26      scanf(\"%s%s%f%f\"\
  ,\n27      stu.name,stu.num,&stu.score[0],&stu.score[1]);\n28  //将数据块写入文件，一次写行\n\
  29      fwrite(&stu,sizeof(stu),1,fp1);\n30    }\n31    fclose(fp1);\n32\n33  //以二进制只读模式再次打开文件\n\
  34    if((fp1=fopen(\"test.txt\",\"rb\"))==NULL)\n35    {\n36       printf(\"cannot\
  \ open file\");\n37       exit(0);\n38    }\n39    printf(\"output from file:\\\
  n\");\n40    for (i=0;i<2;i++)\n41    {\n42      fread(&stu,sizeof(stu),1,fp1);\
  \    //从文件中读取块\n43      printf(\"%s %s %7.2f %7.2f\\n\",    //显示在屏幕上\n44      stu.name,stu.num,stu.score[0],stu.score[1]);\n\
  45    }\n46    fclose(fp1);\n47    return 0;\n48  }\n```\n\n程序结果：\n\n```\n input\
  \ data:\nxiaowang   j001 87.5 98.4\nxiaoli       j002 99.5 89.6\noutput from file:\n\
  xiaowang   j001 87.50 98.40\nxiaoli       j002 99.50 89.60\n```\n\n## 错误\n\n在向文件中写入内容后，我们可能以后需要读取该文件。有时，我们会在文件中看到乱码字符。这是由于我们写入文件时使用的格式与文件操作函数的格式之间不一致导致的。在上面的示例中，如果我们将第\
  \ 29 行改为 `fprintf`，将会产生输出错误。\n\n### 5.5.3 关闭文件\n\n有一句古话说：“有借有还，下次才容易。”我们应该尽快归还从那里借的东西。如果我们的信誉良好，那么当我们下一次需要时，人们很可能会帮助我们。在程序中，动态分配的资源也应该遵循这一规则。否则，可能会发生内存泄漏。在坏的情况下，它将导致超出预期的结果。文件操作中的\
  \ `FILE` 指针也是一种资源。我们通过成功调用 `fopen` 获取它。因此，我们必须在使用文件后返回该资源。读者可能注意到，我们在完成文件操作后总是调用\
  \ `fclose`。`fclose` 是我们用于关闭文件的函数。它的定义如下：\n\n- 原型：`int fclose(FILE *fp)`\n- 功能：它关闭由\
  \ `fp` 指向的文件，处理缓冲区中的数据并释放缓冲区。\n- 输出：如果发生异常，函数返回非零值；否则返回 0。\n\n注意：我们应该在使用完文件后及时关闭它。否则，数据可能会丢失。数据只有在缓冲区满时才会被写入文件。如果在缓冲区未满时终止程序，缓冲区中的数据将被丢弃。\n\
  \n### 示例 5.4 文件示例 4\n\n#### 分析\n\n```c\n 1    //将 10 条记录写入 data.txt\n2    #include\
  \ <stdio.h>\n3    int main(void)\n4    {\n5      FILE *fp; //FILE 是文件类型\n6     \
  \ int i;\n7      int x;\n8\n9    fp=fopen(\"data.txt\",\"w\"); //以文本模式‘w’打开 data.txt\n\
  10    for(i=1;i<=10; i++)\n11    {\n12      scanf(\"%d\",&x);\n13      fprintf(fp,\"\
  %d\",x); //将 x 输出到 fp 指向的文件\n14    }\n15    fclose(fp); //关闭文件\n16    return 0;\n\
  17 }\n```\n\n程序结果：程序终止后，我们可以在项目目录下找到新创建的 `data.txt`。我们将看到里面有 10 条从键盘输入读取的记录。\n\n\
  ### 5.5.4 随机访问\n\n我们在之前的示例中引入了文件操作的三个步骤。读者可能注意到，我们只能从头到尾一个接一个读取文件。这在实践中总是可以接受的吗？\n\
  \n显然，这种僵化的方法在现实生活中并不适用。假设我们有一个学生信息文件，记录按顺序存储。我们希望通过索引快速定位某一行。顺序访问无法满足这一需求，C 语言提供了\
  \ `fseek` 来重定位文件指针。它的定义如下：\n\n- 原型：`int fseek(FILE *pointer, long offset, int location)`\n\
  - 功能：重定位文件指针。它根据 `location` 移动 `offset` 字节（`location` 的值：文件开头由 `SEEK_SET` 表示，值为\
  \ 0；当前位置由 `SEEK_CUR` 表示，值为 1；文件末尾由 `SEEK_END` 表示，值为 2）。\n- 返回值：成功返回 0，失败返回 -1。\n\
  \n### 示例 5.5 文件示例 5\n\n我们在 `stu_list.txt` 文件中有学生记录。编写一个程序读取第二个学生的数据。\n\n#### 分析\n\
  \n代码实现：\n\n```c\n 1    //从文件的指定位置读取：文件的随机访问\n2    #include \"stdio.h\"\n3    #include\
  \ \"stdlib.h\"\n4\n5    struct stu         //学生信息的结构体\n6    {\n7      char name[10];\n\
  8      int num;\n9      int age;\n10    char addr[15];\n11  } boy,*qPtr;       \
  \  定义结构体变量 boy 和结构体指针 qPtr\n12\n13  int main(void)\n14  {\n15    FILE *fp;\n16 \
  \   char ch;\n17    int i=1;         //跳过前 i 行\n18    qPtr = &boy; //qPtr 指向 boy\
  \ 的地址\n19\n20    if ((fp=fopen(\"stu_list.txt\",\"rb\"))==NULL)\n21    {\n22   \
  \    printf(\"Cannot open file!\");\n23       exit(0);\n24    }\n25  //重定位指针到文件开头\n\
  26    rewind(fp);\n27  //移动 i*结构体大小字节\n28    fseek(fp,i*sizeof(struct stu),0);\n\
  29  //从文件中读取当前行并存储到 qPtr 指向的地址\n30    fread(qPtr, sizeof(struct stu),1,fp);\n31\
  \    printf(\"%st%5d %7d %sn\", qPtr->name,\n32    qPtr->num, qPtr->age, qPtr->addr);\n\
  33    fclose(fp);\n34    return 0;\n35  }\n```\n\n注意：为了让程序运行，文件必须以二进制模式写入和打开。例如，我们在第\
  \ 20 行使用了 `fopen(\"stu_list.txt\",\"rb\")`。只有在这种情况下，文件内容才会以二进制数据顺序存储。此外，如果以二进制模式访问文件，我们无法在第\
  \ 28 行使用 `fseek(fp,i*sizeof(struct stu),0)` 移动指针。\n\n\n\n\n```c\n//文件读写\n#include\
  \ <stdio.h>\n#include <stdlib.h>\n\nint main(void)\n{\n  FILE *fp;    //FILE 是文件类型\n\
  \  int i;\n  int x;\n  int b=0;\n  char ch;\n  fp=fopen(\"data.txt\",\"wb\");  \
  \  //以“wb” 模式打开 data.txt\n\n  if (fp==NULL)                              // 打开失败\n\
  \  {\n    printf(\"1:cannot open this file\\n\");\n    exit(0);    // 使用 exit 终止程序\n\
  \  }\n  //***使用 fprintf 写入数据****\n  for( i=1; i< 7; i++ )\n  {\n    scanf(\"%d\"\
  ,&x);\n    fprintf( fp,\"%d\",x );    //将 x 到 fp 指向的文件\n  }\n  fclose(fp);   //关闭文件\n\
  \n  fp=fopen(\"data.txt\",\"rb\");    //以只读模式打开文本文件 data.txt\n  if (fp==NULL)  \
  \                           // 打开失败\n  {\n    printf(\"2:cannot open this file\\\
  n\");\n    exit(0);    // 使用 exit 终止程序\n  }\n\n  //******* 使用 fscanf 读取数据 ********\n\
  \  fscanf(fp,\"%d\",&x);    //将一个 int 值读入 x\n  while (!feof(fp) )    //检查文件是否结束\n\
  \  {\n    printf(\"%d  \",x);\n    fscanf(fp,\"%d\",&x);\n  }\n  fclose(fp);   //关闭文件\n\
  \  return 0;\n}\n```\n\n程序结果：\n\n```\n Input: 2 3 4 5 6 7\nOutput: 2  3  4  5  6\
  \  7\n```\n\n如果我们手动打开 `data.txt`，我们会发现内容是 `234567`，可以正常显示。如果我们使用像 `EditPlus` 这样的编辑器以十六进制模式打开文件，我们会发现字节为\
  \ ASCII 值值“32 0A 33 0A 34 0A 35 0A 36 0A 37 0A。”\n\n### 5.6.2 情况 2：fwrite 和 fread\n\
  \n在这种情况下，我们以二进制模式读取文件 `data.txt`，使用 `fwrite` 写入数据并使用 `fread` 从中读取数据。代码实现可以通过将情况\
  \ 1 中方框内的代码段替换为以下代码段获得：\n\n```c\n//***使用 fwrite 写入数据 ****\nfor( i=1; i<7; i++ )\
  \ //向文件写入 6 个 int 值\n{\n  scanf(\"%d\",&x);\n  fwrite(&x,sizeof(int),1,fp); //将\
  \ x 输出 fp 指向的文件\n}\n//*** 使用 fscanf 读取数据 ****\nfor( i=1; i<7; i++ )\n{\n  fread(&b,sizeof(int),1,fp);\n\
  \  printf(\"b=%x\\n\",b);\n}\n```\n\n程序结果：\n\n```\n Input:\n2 3 4 5 6 7\nOutput:\n\
  b=2\nb=3\nb=4\nb=5\nb=6\nb=7\n```\n\n如果我们在操作系统中手动打开 `data.txt`，我们会发现里面有乱码。以十六进制模式打开文件，我们将看到字节“02\
  \ 00 00 00 03 00 00 00 04 00 00 00 05 00 00 0006 00 00 00 07 00 00 00。”这些字节正是整数\
  \ `2` 到 `7` 的二进制字节流，其中每个整数占用 4 个字节。它们之所以显示为乱码是因为它们不是以 ASCII 值存储的。然而，在上面的程序中，数字可以被正确读取，因为\
  \ `fread` 函数确实是将它们作为二进制整数数据进行读取的。\n\n### 5.6.3 情况 3：fprintf 和 fscanf\n\n在这种情况下，我们以二进制模式读取文件\
  \ `data.txt`，使用 `fprintf` 写入数据，并使用 `fscanf` 从中读取数据。代码实现与第一种情况相同，第二个方框中的代码被替换为以下语句：\n\
  \n```c\n//***Using fread 读取数据****\nfor( i=1; i<7; i++ )\n{\n  fread(&b,sizeof(int),1,fp);\n\
  \  printf(\"b=%x\\n\",b);\n}\n```\n\n程序结果：\n\n```\n Input:\n2 3 4 5 6 7\nOutput:\n\
  b=0a330a32\nb=0a350a34\nb=0a370a36\nb=0a370a36\nb=0a370a36\nb=0a370a36\n```\n\n\
  如果我们手动打开 `data.txt`，我们将看到正确显示的数字 `234567`。\n\n### 5.6.4 情况 4：fwrite 和 fscanf\n\n\
  在这种情况下，我们以二进制模式读取文件 `data.txt`，使用 `fprintf` 写入数据并使用 `fscanf` 从中读取数据。代码实现与第一种情况相同，只是第二个方框中的代码被替换为以下语句：\n\
  \n```c\n//***Using fwrite 写入数据\nfor( i=1; i<7; i++ )\n{\n  scanf(\"%d\",&x);\n \
  \ fwrite(&x,sizeof(int),1,fp); // 输出到 fp 指向的文件\n}\n```\n\n等等，让我们仔细重新阅读 5.6.4 提供的文本。原文在结尾处有些混乱。\n\
  \n### 5.6.4 情况 4：fwrite 和 fscanf\n\n在这种情况下，我们以二进制模式读取文件 `data.txt`，使用 `fprintf`\
  \ 写入数据并使用 `fscanf` 从中读取数据。代码实现与第一种情况相同，只是第二个方框中的代码被替换为以下语句：\n\n```c\n//*** 使用 fwrite\
  \ 写入数据\nfor( i=1; i<7; i++ )\n{\n  scanf(\"%d\",&x);\n  fwrite(&x,sizeof(int),1,fp);\
  \ // 输出到 fp 指向的文件\n}\n```\n\n### 5.7 调试 I/O\n\n在设计代码后，我们需要使用输入和输出进行测试。有两个代码模板：\n\
  \n#### 5.7.1 模板 1 使用 fscanf 和 fprintf\n\n```c\n#include <stdio.h>\nint main(void)\n\
  {\n  FILE *fp1, *fp2;\n  fp1=fopen(\"data.in\",\"r\"); // 只读模式打开文件 data.in\n  fp2=fopen(\"\
  data.out\",\"w\"); // 只写模式打开文件 data.out\n  // 我们在这里处理数据。注意应该使用 fscanf 读取并 fprintf\
  \ 输出\n  fclose(fp1);\n  fclose(fp2);\n}\n```\n\n#### 5.7.2 使用 freopen 函数\n\n原型：`FILE\
  \ *freopen(const char*path,const char *mode,FILE *stream)`\n\n参数：\n- `path`：用于存储的文件名；\n\
  - `mode`：打开模式，与 `fopen` 相同；\n- `stream`：文件，通常标准流。\n\n功能：将标准流重定向到 `path` 指定的文件。\n\
  \n返回值：成功时返回指向文件的指针；否则返回 `NULL`。\n\n#### ABC 标准流文件\n\n当我们运行 C 程序时，操作系统打开三个文件并为程序提供指针。这三个文件指针是\
  \ `stdin`、`stdout` 和 `stderr`。\n\n- `stdin`：标准输入流。默认输出到屏幕。\n- `stdout`：标准输出流。默认输出到屏幕。\n\
  - `stderr`：标准错误流。默认输出到屏幕。\n\n\n\n\n```c\n #include <stdio.h>\nint main(void)\n{\n\
  \  freopen(\"data.in\", \"r\", stdin);//将输入从键盘重定向到 data.in\n  freopen(\"data.out\"\
  , \"w\", stdout);\n//将输出从屏幕重定向到 data.out\n// 数据处理代码保持不变\n\n  fclose(stdin);\n  fclose(stdout);\n\
  \  return 0;\n}\n```\n\n使用 `freopen` 和使用 `fprintf` 和 `fscanf` 一一样。此外，我们不需要修改代码，因为我们使用了输入输出重定向，这比第一个模板更方便。这里有一个重定向示例。\n\
  \n**示例 5.6** 调试计算 a+b 的程序\n\n(1) 键盘输入情况。\n\n```c\n 1     #include <stdio.h>\n2 \
  \    int main(void)\n3     {\n4       int a,b;\n5\n6       while(scanf(\"%d %d\"\
  ,&a,&b)!= EOF)\n7       {\n8         printf(\"%d\\n\",a+b);\n9       }\n10     return\
  \ 0;\n11  }\n```\n\n程序结果：\n\n```\n 5 6\n11\n^Z\n```\n\n(2) 从 `in.txt` 读取数据并将结果写入\
  \ `out.txt`。\n\n```c\n 1     #include <stdio.h>\n2     int main(void)\n3     {\n\
  4     int a,b;\n5     //重定向输入，从当前项目 Debug 目录下的 in.txt 读取数据\n6     // 当前项目\n7   \
  \  freopen(\"debug\\\\in.txt\",\"r\",stdin);\n8     //重定向输出，将数据写入当前项目 Debug 目录下的\
  \ out.txt\n9     // 当前项目\n10     freopen(\"debug\\\\out.txt\",\"w\",stdout);\n11\
  \     while (scanf(\"%d %d\",&a,&b)!= EOF)\n12     {\n13       printf(\"%d\\n\"\
  ,a+b);\n14     }\n15     fclose(stdin); //关闭文件\n16     fclose(stdout); //关闭文件\n\
  17     return 0;\n18  }\n```\n\n注意：\n\n1. 我们从当前项目 Debug 目录下的 `in.txt` 读取输入数据。在运行程序之前，我们需要在\
  \ `in.txt` 中保存数据“5 6”（注意 5 和 6 之间的空格。虽然省略空格程序仍然有效，但结果将不是我们预期的。感兴趣的读者可以尝试不带空格运行程序，检查结果并利用我们所学的知识分析结果为何不同）。\n\
  \n2. 我们将输出数据保存到当前项目 Debug 目录下的 `out.txt`。运行程序后，我们会在 Debug 目录下发现一个 `out.txt` 文件，其中包含数字“11”。\n\
  \n## 5.8 总结\n\n图 5.8 显示了本章的主要内容及其之间的关系。\n\n![](img/b_9783110692303-005_fig_008.png)\n\
  \n图 5.8：与文件相关的基本概念之间的关系。\n\n文件是数据的持久化形式，\n\n我们可以以二进制形式或文本形式保存数据。\n\n程序遵循三个步骤操作文件：即打开、读/写和关闭。\n\
  \n要打开一个文件，我们需要它的路径和文件名；\n\n要操作一个文件，我们使用库函数；\n\n在操作文件后，我们必须将其关闭。\n\n## 5.9 练习题\n\n\
