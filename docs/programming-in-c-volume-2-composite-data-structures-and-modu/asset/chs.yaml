  \n图 4.75：指针作为返回值的程序调试步骤 3。\n\n在图 4.76 中，`main` 函数中的 `stuPtr` 用于存储局部变量 `str` 的值。局部变量是定义在函数内部的变量。\n\
  \n![](img/b_9783110692303-004_fig_076.jpg)\n\n图 4.76：指针作为返回值的程序调试步骤 4。\n\n注意：不建议返回局部变量的地址。因为系统在函数返回后会回收局部变量的内存空间，因此与局部变量的信息不再保证是正确的。\n\
  \n**示例 4.10** 作为返回值的空指针\n\n请定义一个动态数组来存储 `n` 个学生的成绩，并计算平均分。学生人数和成绩从键盘输入读取。\n\n####\
  \ 分析\n\n1. 背景知识\n\n在“数组”章节中介绍的数组定义方法是静态分配内存。换句话说，在程序执行期间，数组的大小及其存储地址不会改变。假设我们想在程序执行期间向数组插入新数据，但分配的数组空间已满。是否有扩展数组空间的方法？C\
  \ 语言中有一种称为“动态内存分配”的内存分配方法：如果程序执行期间需要额外的存储空间，它可以“请求”特定大小的内存空间。当程序不再需要该空间时，可以将其返回系统。相关的库函数包括\
  \ `malloc()`、`calloc()`、`free()` 和 `realloc()`。使用这些函数必须包含头文件 `stdlib.h` 或 `malloc.h`。\n\
  \n2. 内存分配函数 `malloc()`\n\n原型：`void *malloc(unsigned size);`\n\n功能：分配一个大小为 `size`\
  \ 字节的内存块。\n\n参数：`size` 是一个无符号整数，表示请求的内存空间的大小。\n\n返回值：返回新分配内存的地址。如果没有可用内存，应返回 `NULL`。\n\
  \n注意：\n\n1. 当 `size` 为 0 时，返回 `NULL`。\n2. `void*` 是一种无类型指针，可以指向任何类型的内存单元。在经过强制类型转换后，无类型指针可以赋值给其他类型的指针。\n\
  \n3. 内存释放函数 `free()`\n\n原型：`void free(void *block);`\n\n功能：释放释放使用 `calloc()`、`malloc()`\
  \ 和 `realloc()` 分配的内存空间。参数：`block` 是一个指向要回收内存的 `void` 指针。返回值：没有返回值。用法：`void free(void\
  \ *p);` 上述语句释放了由 `p` 指向的动态内存空间中的内存，该内存是 `malloc()` 返回的值。`Free` 函数没有返回值。\n\n4. 代码实现\n\
  \n```\n#include <stdio.h>\n#include <malloc.h>\n\nint *DefineArray(int n);   /*定义大小为\
  \ n 的动态数组*/\nvoid FreeArray(int *p);    /*释放 p 指向的内存*/\nint main()\n{\n  int *p,\
  \ i;\n  int nCount;    /*人数*/\n  float fSum=0;    /*总分*/\n  /*输入人数*/\n  printf(\"\
  \\nPlease input the count of students: \");\n  scanf(\"%d\",& nCount);\n  /*定义动态数组\
  \ p*/\n  p= DefineArray(nCount);\n  if (p==NULL) return 1;    /*异常处理*/\n  /*输入每个学生的成绩*/\n\
  \  printf(\"Please input the scores of students: \");\n  for( i=0; i< nCount; i++\
  \ )\n  {\n    scanf(\"%d\", &p[i]);\n  }\n  /*计算总分*/\n  for(i=0;i< nCount;i++)\n\
  \  {\n    fSum+=p[i];\n  }\n  /*打印平均分*/\n  printf(\"\\nAverage score of the students:\
  \ %.1f\",fSum/nCount);\n  /*释放动态数组*/\n  FreeArray(p);\n  return 0;\n}\n\nint *DefineArray(int\
  \ n)\n{\n  /*动态请求大小为 n*sizeof(int)的内存空间，用于 int 数组*/\n  return (int *) malloc( n*sizeof(int)\
  \ );\n}\n\nvoid FreeArray(int *p)\n{\n/*释放 malloc 分配的内存*/\n  free(p);\n}\n```\n\n\
  程序结果：\n\n```\nPlease input the count of students: 5\nPlease input the scores of\
  \ students: 87 97 77 68 98\nAverage score of the students: 85.4\n```\n\n注意：函数 `DefineArray`\
  \ 的输入参数 `n` 是数组中的元素个数。该函数使用 `malloc` 分配所需的内存。\n\n#### 内存泄漏\n\n应用程序通常使用 `malloc`\
  \ 或 `realloc` 从堆中获取内存块。当不再需要内存时，必须调用 `free` 释放这些内存块；否则它们无法再次使用。在这种情况下，我们认为这些内存被“泄漏”。\n\
  \n内存泄漏通过减少可用内存来影响计算机性能。在现代操作系统中，应用程序使用的标准内会在终止时被释放。也就是说，寿命短的程序很少发生泄漏。\n\n更严重的泄漏包括：\n\
  \n1. 程序运行时间长且随时间增加内存消耗，例如服务器上的后台任务，特别是长时间运行的嵌入式设备；\n2. 频繁为一次任务分配新内存，例如渲染游戏帧或动画视频；\n\
  3. 程序请求的内存（如共享内存）即使在程序终止时也不释放；\n4. 发生在操作系统内部；\n5. 设备驱动程序导致泄漏；\n6. 内存有限，例如嵌入式系统或便携式设备；\n\
  7. 在不自动释放内存的操作系统（如 AmigaOS）上运行，必须重启系统回收内存。\n\n#### 程序练习\n\n阅读并分析程序，然后填充表格。\n\n```\n\
  #include \"stdio.h\"\n#include \"string.h\"\nvoid i_s(char in[], char out[]);\n\
  void i_s( char in[], char out[])\n{\n  int i, j;\n  int l=strlen( in);\n  for(i=j=0;\
  \  i<l;  i++, j++)\n  {\n    out[j]= in[i]; //步骤 1\n    out[++j] = '__'; //步骤 2\n\
  \    in[i] += 1; //步骤 3\n  }\n  out[j-1]= '\\0';\n}\nint main(void )\n{\n  char\
  \ s[] = \"1234\";\n  char g[20];\n  i_s( s,  g );\n  printf(\"%s\\n\", g);\n  return\
  \ 0;\n}\n```\n\n学习了函数间信息传递的规则后，读者可以尝试自己分析这个程序。图 4.77 列出了每个步骤的中间结果。\n\n\n\n\n我们之前提到过，布朗先生为他的儿子丹尼尔写了一个算术题程序。该程序可以生成随机算术题并判断丹尼尔的答案是否正确。丹尼尔在上面花费了大量时间并乐在其中，所以布朗先生想把程序推荐给住在另一个城市的侄女安妮。布朗先生知道安妮的父母不擅长安装程序，所以他只通过邮件发送了一个\
  \ `.exe` 文件。该可执行文件不需要 C 编译环境，因此安妮可以直接从文件资源管理器运行该程序。然而，当他测试可执行文件时，他发现程序启动后控制台窗口弹出来，然后在他等得及看到结果之前就迅速消失了。\n\
  \n“我该怎么办？”布朗先生心想。他想起了以前在图形用户界面发明之前使用的一种方法。在那个时代，DOS 是主导性的操作系统。在 DOS 中，所有命令都是通过键盘输入发送给计算机的，包括应用程序的执行。命令输入的界面全是黑色的。我们在\
  \ VC6.0 IDE 中执行程序后显示结果的弹出窗口正是控制台。控制台也被称为命令行界面，用户在命令行环境中为应用程序输入命令。程序结果也显示在命令行界面中。\n\
  \n然而，图形用户界面现在已经是事实上的标准。是否有办法可以回到“控制台”呢？Windows 系统确实保留了这个功能。我们可以通过在 Windows 运行窗口中输入\
  \ `cmd` 来进入命令行界面，如图 4.78.\n\n图 4.78：Windows 中的“运行”。\n\n### 4.5.4.2 main 函数的参数\n\n\
  我们已经见过以下这种不带参数的 main 函数形式：\n\n```\n int main( void ) \n{ \n  … \n  return 0; \n\
  }\n```\n\nmain 函数的返回类型是 `int`，这与程序末尾的返回语句保持一致。`0` 是 main 函数的返回值。那么，它返回到了哪里呢？在 main\
  \ 函数终止后，返回值会被发送回操作系统，表示程序正常终止。\n\n我们可以在普通函数中使用参数，但在 main 函数中也可以这样做吗？如果一个函数有参数，那么在调用它时必须传递参数。然而，没有函数可以向\
  \ main 函数传递参数，因为它不能被任何函数调用。因此，参数必须从外部提供。我们如何做到这一点？\n\n一个 C 程序在编译和链接后会变成扩展名为 `.exe`\
  \ 的可执行文件。可执行文件可以在操作系统直接执行。换句话说，是系统在运行该文件。由于其他函数无法调用或向 main 函数传递参数，必须由系统来完成。在 C 程序中，我们可以通过在命令行界面中输入参数为\
  \ main 函数传递参数。\n\n让我们来看带参数的 main 函数的语法：\n\n```\n int main(int argc, char *argv[])\n\
  {\n  …\n  return 0;\n}\n```\n\n命令行参数也被称为位置参数。它们可以传递给程序。`argc`（参数计数）的值等于位置参数的总数（包括程序名）。`argv`（参数值）是一个指针数组，其中程序名存储在\
  \ `argv[0]` 中，第 `i` 个位置参数存储在 `argv[i]` 中，直到 `argv[argc-1]`。通过这种方式，我们可以在不使用输入语句的情况下将命令行传递到\
  \ C 程序中。\n\n### 4.5.4.3 带参数的 main 函数示例\n\n**示例 4.11** 使用命令行输入计算矩形面积\n\n**分析**\n\n\
  代码实现见图 4.79。\n\n在第 13 行，`sscanf` 函数也是一个输入函数，与 `scanf` 类似。我们已经学习过 `scanf` 使用键盘输入（`stdin`）。另一方面，`sscanf`\
  \ 使用固定字符串作为输入。读者可以参考第一卷附录 C 了解更多关于输入函数的信息。`sscanf` 从字符串按照指定的格式读取数据。在这里，它从 `argv[1]`\
  \ 读取数据并将其放入变量 `w` 中。\n\n![](img/b_9783110692303-004_fig_079.png)\n\n图 4.79：带参数的\
  \ main 函数示例。\n\n在第 11 行，`exit()` 是一个库函数，其头文件为 `stdlib.h` 或 `windows.h`。它关闭所有文件并终止当前进程。在\
  \ `exit(x)` 语句中，`x` 的值代表退出状态并返回给操作系统。如果 `x` 为 `0`，则程序正常退出；否则，异常退出。\n\n图 4.80\n\n\
  #### exit() 和 return 的区别\n\n根据 ANSI C，它们在第一次调用 main() 时是等价的。\n\n注意我们使用了“第一次调用”这个术语。如果\
  \ main() 位于递归程序中，那么 exit() 仍然会终止程序；另一方面，`return` 语句返回到上一层递归。只有在递归的最顶层，`return` 语句才会终止程序。\n\
  \n#### main 函数的格式\n\n在最新的 C99 标准中，只有以下两种 main() 定义是正确的（参见 ISO/IEC 9899:1999 (E)\
  \ 5.1.2 程序启动）：\n\n```\n int main( void ) // 不带参数\n{\n  …\n  return 0;\n} \nint main(\
  \ int argc, char *argv[] ) // 带参数\n{ \n  … \n  return 0;\n}\n```\n\n`int` 表示 main()\
  \ 的返回类型。传递给函数的信息通常写在函数名后的括号内。`void` 表示不向 main() 传递参数。然而，我们在遗留 C 代码中经常发现以下 main()\
  \ 的形式：\n\n(1) `main()`\n\n这在 C90 标准中是被允许的，但在 C99 不允许。因此，即使在你的编译器中它是有效的也不要这样写。\n\n\
  (2) `void main()`\n\n这在某些编译器中是有效的，但没有标准认为接受它。C++ 的创始人比雅纳·斯特鲁斯特普在其网站的 FAQ 部分中明确表示：`void\
  \ main()` 在 C++ 或 C 中从未存在过。因此，编译器可能会拒绝这种代码。事实上，它在许多编译器中都是无效的。\n\n\n\n\n当用程序解决实际问题时，随着问题的复杂性增加，程序的规模也会随之增大。这在程序实践中导致了许多问题。为了应对这些问题，我们引入了模块化的概念。具体来说，我们在\
  \ `C` 语言中引入了函数。图 4.81 显示了一些与函数相关的问题，这些问题我们在之前的章节中见过。\n\n![](img/b_9783110692303-004_fig_081.png)\n\
  \n图 4.81：与函数设计相关的问题。\n\n### 4.6.1 引言\n\n#### 4.6.1.1 团队合作中的协作问题\n\nBrown 先生的研究小组获得了一个新项目的资金。为了提高效率，该项目被分为多个模块，每个模块分配给小组中的一名老师或学生。\n\
  \n然而，他们意识到在开始编写代码之前，有一些协作问题需要解决。\n\n一名学生说：“在我以前写过的小程序中，子函数和 `main function` 都在同一个文件中。但在团队合作的情况下，这样做会很不方便！我认为我们应该为每个模块使用独立的文件。”另一名学生说：“我倾向于使用\
  \ `i`、`j` 和 `k` 作为循环控制变量。如果 Brown 教授也使用它们，我还能使用吗？我们应该在定义变量之前互相讨论吗？”\n\n一位老师思考了一会儿回答道：“从整体工作流的角度来看，我们应该自己创建程序文件，但如果没有\
  \ `main function`，程序无法运行。然而从程序执行的角度来看，我们正在写一个大程序，它应该包含一个 `main function`。我们应该如何做呢？”\n\
  \nBrown 先生总结了大家的问题，如图 4.82](#9783110692297_007959.xhtml_b_9783110692303-004_fig_082)所示。然后他说：“为了回答这些问题，我们需要在编程语言中引入新规则。你们能想象团队协作的最佳机制是什么吗？我认为我们应该在不同的文件中工作。不同文件中的变量可以有相同的名称。一个程序应该只有一个\
  \ `main function`。”大家都点了点头。\n\n![](img/b_9783110692303-004_fig_082.png)\n\n图 4.82：大规模程序中的问题。\n\
  \n他进一步问道：“在这种情况下，需要什么样的程序执行机制才能使我刚才说的话成为可能？”我想我们可以为变量附加作用域和生命周期，使它们在文件或函数中是隔离的。这可以防止它们乱搞，”另一位老师回答道。大家都同意他的观点。\n\
  \n正如他们想象的那样，`C` 语言的规则是：一个 `C` 程序可以由多个文件组成，每个文件可以有多个函数，如图 4.83](#9783110692297_007959.xhtml_b_9783110692303-004_fig_083)所示。不同文件中的变量可以有相同的名称。一个\
  \ `C` 程序必须有且仅有一个 `main function`。\n\n![](img/b_9783110692303-004_fig_083.png)\n\n\
  图 4.83：C 程序的结构。\n\n#### 4.6.1.2 流程中的外包项目\n\n在讲台楼流程中，某些工作被外包了。每个服务提供者可以被视为完成特定任务的子函数。与一个服务提供者相关的信息（材料、尺寸或价格）不需要也不应该暴露给其他服务提供者。这就是信息的作用域。这种作用域策略也用于程序的模块化。\n\
  \n#### 4.6.1.3 资源共享问题\n\nBrown 先生所在的大学拥有如礼堂、图书馆、食堂和医务室等设施。还有提供特定服务的职部门。根据政府和大学的政策，礼堂和图书馆向公众开放。机构和个人可以按照某些流程使用它们。另一方面，食堂和医务室仅供学生和大学员工使用。根据可用性，资源可以分为内部资源共享资源。\n\
  \n代码也是资源。如果一个程序由多个源文件组成，程序设计人员应该根据要解决问题的性质，确定某个函数是否可以被其他文件中的函数调用。换句话说，“可用性”属性对于函数也是必要的。根据可用性，`C`\
  \ 语言中的函数可以分为内部函数和外部函数。\n\n从大学图书馆借书，个人应该出示大学证。这些证在其他设施（如食堂和医务室）中也是需要的。但在许多情况下，某个设施中使用的\
  \ ID 数据仅该设施的管理部门可用。部门之间很少共享数据。总而言之，某些数据对所有部门可用，而某些数据仅限于某些部门。\n\n将一个部门想象成一个函数。那么函数处理的信息有两种类型。所有函数都可用的数据称为全局数据，而只在函数内部可用的数据称为局部数据。\n\
  \n### 4.6.2 隐藏机制\n\n回顾模块化的思想：目标是从外部隐藏内部实现和数据。为了设计这种机制，我们应该从哪里开始？\n\n#### 4.6.2.1\
  \ 隔离\n\n通过隐藏内部数据，我们防止它们被其他函数访问。问题如图 4.84](#9783110692297_007959.xhtml_b_9783110692303-004_fig_084)所示。\n\
  \n![](img/b_9783110692303-004_fig_084.png)\n\n图 4.84：与隐藏相关的问题。\n\n#### 4.6.2.2 隐藏\n\
  \n根据“可用性”，`C` 语言中的函数分为两类：内部函数和外部函数。它们通过特殊符号标识，如图 4.85](#9783110692297_007959.xhtml_b_9783110692303-004_fig_085)所示。\n\
  \n![](img/b_9783110692303-004_fig_085.png)\n\n图 4.85：函数的共享机制。\n\n### 4.6.3 内存段和存储类\n\
  \n在实践中，我们通过对数据分类来隔离数据，并根据数据的可用性对其进行不同的管理。我们在计算机中使用相同的策略来管理数据和代码。图 4.85](#9783110692297_007959.xhtml_b_9783110692303-004_fig_085)显示了\
  \ `C` 程序的内存布局。代码段包含函数的二进制代码；常量段包含字符串字面量和其他常量；动态段用于存储函数的内部数据，即局部变量。静态段存储函数间共享的数据，即全局变量。\n\
  \n![](img/b_9783110692303-004_fig_086.png)\n\n图 4.86：内存布局。\n\n#### 4.6.3.2 变量的存储类\n\
  \n为了区分存储不同段中的变量，`C` 为它们附加了另一个属性，即存储类。它还指示了变量在内存中的生命周期（图 4.86](#9783110692297_007959.xhtml_b_9783110692303-004_fig_086)）和在程序中的作用域，如图\
  \ 4.87](#9783110692297_007959.xhtml_b_9783110692303-004_fig_087)所示。\n\n![](img/b_9783110692303-004_fig_087.png)\n\
  \n图 4.87：变量的存储类。\n\n\n\n\n寄存器是 CPU 内部的快速存储位置。它们提供了访问数据的快速方式，甚至超过了 RAM。然而，寄存器的大小是有限的。现在的程序员很少亲自使用\
  \ `register` 类，因为编译器会处理它。`Register` 类通常用于被频繁访问的变量，例如循环变量。\n\n在函数中定义的变量默认属于 `auto`\
  \ 类，除非另有指定。`auto` 变量的值在函数终止时消失。从本质上讲，这是因为系统需要回收 `auto` 变量的存储单元。`static` 变量的值在函数结束后仍会被保留。换句话说，系统不会回收其内存单元。因此，当函数再次被调用时，该值仍然可用。\n\
  \n### 4.6.4 机制：变量的生命周期和作用域\n\n#### 4.6.4.1 作用域概念\n在多模块结构中，每个子函数拥有不需要其他子函数访问的内部数据。在\
  \ C 语言中，程序中变量的可见性被称为“作用域”。图 4.88 显示了作用域的定义及其规则。\n\n![](img/b_978311062303-004_fig088.png)\n\
  \n4 4.88: 规则。\n\n#### 4.6.4.2 变量的属性\n由于在某些情况下需要向其他函数隐藏信息，我们需要为作为信息载体的变量添加属性。因此，变量的属性包括\
  \ `data type` 和 `storage class`。`data type` 描述变量的大小。`storage class` 表示变量在内存中的生命周期及其作用域。图\
  \ 4.89 显示了变量声明的完整语法，它在 `data type` 之前添加了“storage class”。\n\n![](img/b_978311062303-004_fig089.png)\n\
  \n4 4.89: 属性与声明。\n\n#### 示例 4.12 局部静态变量的使用\n在图 4.90 中，我们可以看到子函数 `var()` 中存在 `auto`\
  \ 类局部变量和 `static` 类局部变量。多次调用 `var()` 后，我们可以根据执行结果得出以下结论：`auto` 类局部变量的值在函数返回后消失，而\
  \ `static` 类局部变量的值在函数返回后被保留。\n\n![](img/b_978311062303-004_fig090.png)\n\n4 4.90:\
  \ 属性与声明语法。\n\n#### 4.6.4.3 局部变量与全局变量\n根据定义的位置，变量分为局部变量和全局变量。图 4.91 显示了它们的定义。变量和函数前面可以添加关键字\
  \ `extern`，表示它们的定义位于其他文件中。编译器在看到 `extern` 时会在其他模块中查找定义。\n\n#### 示例 4.13 计算平均分\n\
  在比赛中，选手的得分是 `N` 个评分截截平均值。舍弃最高分和最低分，然后剩余部分的平均值作为选手的最终得分。\n\n![](img/b_978311062303-004_fig091.png)\n\
  \n4 4.91: 局部变量与全局变量。\n\n#### 分析\n\n1. 数据结构设计\n将分数存储在数组 `data[N]` 中。由于我们在所有处理步骤中都需要访问，可以将其设为全局变量。为了方便测试，我们可以在程序中使用初始值对其进行初始化，如图\
  \ 4.92 所示。\n\n![](img/b_978311062303-004_fig092.png)\n\n4 4.92: 平均分：数据结构设计。\n\n\
  2. 算法设计\n根据问题描述，我们可以使用图 4.93 所示的算法来解决问题。\n\n![](img/b_978311062303-004_fig093.png)\n\
  \n4 4.93: 平均分：算法设计。\n\n3. 函数结构设计\n由于分数数组 `data` 是全局的，也就是说可以被所有函数访问，因此我们的函数不需要通过参数读取数据或返回更新后的数据，如图\
  \ 4.94 所示。\n\n![](img/b_978311062303-004_fig094.png)\n\n4 4.94: 平均分：函数设计。\n\n4.\
  \ 代码实现\n图 4.95 展示了每个子函数的实现。这些函数中定义的局部变量的存储类被省略了，因此它们默认是 `auto`。为了舍弃 `data` 中的最低分，我们将\
