  \ 值为 48。假设数组的第 0 个元素存储在低字节，且 `sizeof(int)` 为 4 字节。以下程序的输出是什么？（）\n\n```c\nunion\n\
  {\n    int i[2];\n    long k;\n    char c[4];\n} var, *s=&var;\ns->i[0]=0x39;\n\
  s->i[1]=0x38;\nprintf(\"%c\\n\", s->c[0]);\n```\n\nA) 39\n\nB) 9\n\nC) 38\n\nD)\
  \ 8\n\n### 3.8.2 填表\n\n#### 1. [结构体成员的操作]\n\n假设我们有如下结构定义。在执行以下程序后，确定图 3.51 中所示结构体成员的值：\n\
  \n```c\n#include <stdio.h>\n#define N 5\n#define M 4\nstruct person\n{\n   int Id;\n\
  \   char Name[10];\n   int Score[M];//分数\n   int total;//总分\n};\nint main(void)\n\
  {\n   struct person allone[N]\n   ={{ 1,\"mark\", { 9,6,8,7 },0 },\n   { 2,\"bob\"\
  ,    { 8,6,8,5 },0 },\n   { 3,\"alice\", { 5,9,7,8 },0 },\n   { 4,\"william\",{\
  \ 8,9,9,9 },0 },\n   { 5,\"eric\",   { 8,9,6,9 },0 } };\n   struct person temp;\n\
  \   int i, j;\n   for ( i = 0; i < N; i++) // ①\n   {\n      allone[i].total = 0;\n\
  \      for ( j = 0; j < M; j++)\n      {\n         allone[i].total += allone[i].Score[j];\n\
  \      }\n   }\n   for(i = 1; i < N; i++) // ②\n   {\n      for(j = 0; j < N-i;\
  \ j++)\n      {\n         if (allone[j].total < allone[j+1].total)\n         {\n\
  \            temp = allone[j];\n            allone[j + 1] = temp;\n         }\n\
  \      }\n   }\n   return 0;\n}\n```\n\n### 3.8.3 编程练习\n\n1. 假设我们有如下结构体：\n\n```c\n\
  struct person\n{\n    char lastName[15];\n    char firstName[15];\n    char age[4];\n\
  }\n```\n请编写代码从键盘读取 10 个人的 `lastName`、`firstName` 和 `age`。\n\n2. 请定义一个 `union` 来表示一维空间、二维或三维空间中的点。该\
  \ `union` 应该包含一个维度指示器和坐标。\n\n3. 假设我们有如下的枚举：`enum day{Sunday,Monday,Friday,Saturday}`。求出以下表达式的值。\n\
  \n1. `today`\n2. `today`\n3. `today`\n4. `today`\n5. `today`\n6. `today`\n7. `today`\n\
  \n### 4. 函数\n\n**主要内容**\n* 为什么需要函数。\n* 函数之间的关系。\n* 函数的声明、定义和调用。\n* 函数设计的示例。\n* 调试技巧。\n\
  * 函数间的信息传递。\n\n**学习目标**\n* 理解程序中的模块化。\n* 理解信息的传递机制。\n* 了解递归的概念。\n\n\n\n\n\n对于个人来说，工作量是巨大的，但对于团队来说却很小。个人要完成所有工作需要多种技能，而团队中的成员只需要一项技能即可完成分配给他的任务。如果由一个人完成工作，则不需要通信；但在团队合作中，通信具有重要意义，因为上一步的输出往往是下一步的输入。\n\
  \n\n\n#### 4.1.2.2 程序模块化中的协调问题\n\n同样，程序模块化中存在哪些问题？\n\n**思考与讨论** 程序的模块化问题\n\n1. 使用一段代码与使用多段代码来解决问题之间有什么区别？\n\
  2. 使用多个子程序完成某项任务的关键是什么？\n\n**讨论：** 这两种方法在工作量或复杂性上没有区别。然而，使用多个子程序需要信息传递，而这恰恰是我们正在寻找的关键。因此，编程语言必须提供这种机制。\n\
  \n#### 4.1.2.3 模块概念\n\n基于上述讨论，我们可以总结出独立代码模块所必需的要素。\n\n在编程中，我们将具有独立名称并能独立完成特定任务的语句集合称为“模块”，如图图\
  \ 4.6 所示。模块由实现部分和接口组成。接口创建是为了从模块外部隐藏模块的实现数据。与外部对象的通信必须通过信息接口进行。模块的接口描述了其他模块或程序应该如何使用它。输入/输出信息也是接口的一部分。\n\
  \n还有其他与模块相关的概念，例如模块重用和多模块结构。\n\n![](img/b_9783110692303-004_fig_006.png)\n\n图 4.6：与模块相关的概念。\n\
  \n“模块”一词有很多别名，例如函数或子程序。C 语言使用“函数”来描述模块，如图图 4.7 所示。我们在结构化分析和设计中使用“模块”一词；在面向对象的分析和设计中它变为“类”；在组件化开发中使用的术语是“组件”。\n\
  \n![](img/b_9783110692303-004_fig_007.png)\n\n图 4.7：模块的别名。\n\n模块化的程序设计具有以下特征：\n\n\
  1. 模块之间相互独立。每个模块都有自己的功能。使用模块的程序逻辑清晰，更容易编写和维护。\n2. 程序更容易设计，因此缩短了开发周期。\n3. 模块更具健性。\n\
  4. 程序员不再需要重复轮子。\n5. 维护现有代码和编写新代码变得更容易。\n\n## 4.2 函数形式设计\n\n### 4.2.1 模块间的通信方法\n\n\
  布先生所在的大学将举行毕业典礼。主席台将由后勤部门建造。图 4.8 显示了建造过程的步骤。某些步骤可以外包给专业公司（如广告公司或景观公司），以加速进程并保证质量。\n\
  \n![](img/b_9783110692303-004_fig_008.png)\n\n图 4.8：毕业典礼主席台的建造过程。\n\n**思考与讨论** 外包项目中的协调方法\n\
  \n**讨论：** 外包项目中有两种通信方法，如图图 4.9 所示。\n\n1. 外包方在各个服务提供者之间进行协调（例如，主席台的建造过程）。\n2. 服务提供者之间相互通信（例如，奖学金申请过程）。\n\
  \n两种方法在程序设计模式中都是可行的。如果模块按顺序执行，则程序是面向过程的；如果模块在某些事件发生前不执行，则程序是面向对象的。读者可以参考附录 B 获取更多关于此主题的细节。C\
  \ 语言中的函数使用了前面提到的第一方法，即“外包方在服务提供者之间进行协调”。\n\n![](img/b_9783110692303-004_fig_009.png)\n\
  \n图 4.9：模块间的通信方法。\n\n### 4.2.2 函数形式设计\n\n#### 4.2.2.1 外包结构分析\n\n让我们以广告公司为例分析外包结构。\n\
  \n在背景制作”项目中，广告公司是服务提供者，大学是外包方，如图图 4.10 所示。广告公司需要对他们能做什么做出说明，这种说明可以被视为生产。换句话说，是外包方驱动了生产。\n\
  \n![](img/b_9783110692303-004_fig_010.png)\n\n图 4.10：外包结构。\n\n#### 4.2.2.2 外包结构的抽象\n\
  \n图 4.11 展示了外包结构的进一步抽象。我们可以将外包考虑为“制造”过程。制造中有三个关键要素：输入、输出和处理。输入是过程中使用的材料。输出是最终产品。处理指的是制造中的步骤。为了开始制造，用户需要提供制造商所需的材料。在程序中，这些材料就是数据。\n\
  \n![](img/b_9783110692303-004_fig_011.png)\n\n图 4.11：外包结构的抽象。\n\n#### 4.2.2.3 函数形式设计\n\
  \n函数作为独立的代码段类似于外包项目，如图图 4.12 所示。编写函数的过程定义了它的功能，包括输入、输出和处理。编程语言中函数的用户被称为“调用者”。调用者为函数提供实际数据，以便其完成特定任务。\n\
  \n![](img/b_9783110692303-004_fig_012.png)\n\n图 4.12：函数形式设计。\n\n#### 4.2.2.4 信息传输机制设计\n\
  \n在实践中，我们可以通过快递或互联网将原材料交付给制造商。制造完成后，制造商可以以适合用户的方式发送产品。但在程序中，数据处理完全在计算机中完成。因此，信息传输机制需要符合计算机的特征。\n\
  \n图 4.13。在设计函数机制时，我们需要确定调用者如何将数据发送给函数，以及函数如何将结果传回调用者。\n\n![](img/b_9783110692303-004_fig_013.png)\n\
  \n图 4.13：信息传输机制设计。\n\n\n\n\n\n模块之间信息传输的方法之一是使用软件接口，如图 4.14 所示。对于“生产者”（即定义函数的人），他们应该考虑以下问题：接收信息的接口、代码实现以及结果提交的方式。为了描述制造项目，我们需要为它确定一个名称，即函数名。对于“外包者”（即函数调用者），他们需要考虑以下问题：提交信息的接口和接收结果的方式。\n\
  \n![](img/b_9783110692303-004_fig_014.png)\n\n图 4.14：函数中的信息传输设计。\n\n#### 4.2.2.5\
  \ 与函数相关的三种语法\n\nC 语言提供了三种与函数相关的语法：函数定义（“生产者”）、函数调用（“外包者”）和函数声明（或函数原型），后者简要描述了函数的情况。图\
  \ 4.15 显示了这些语法。\n\n在函数定义中，信息接口通过“参数列表”实现，实现通过大括号之间的声明和语句完成。函数结果的类型由“函数类型”决定。在函数调用中，提交信息的接口通过“参数列表”实现。C\
  \ 语言提供了两种“结果提交方式”：一种是通过信息接口提交，另一种是使用 `return` 语句。函数调用语法没有显式显示调用者如何接收结果。我们将在以后详细介绍结果的提交和接收。\n\
  \n![](img/b_9783110692303-004_fig_015.png)\n\n图 4.15：与函数相关的三种语法。\n\n### 知识 ABC 函数声明及其位置\n\
  \nC 是一门老语言，因此其语法一直在不断修订。过去对函数声明、定义和调用的顺序以及声明的必要性限制很少。不同的编译器对这些也遵循不同的规则。然而，最新的 C\
  \ 标准（如 C99 和 C11）要求函数在调用之前必须进行声明。这一要求有助于编译器发现函数调用中参数类型和数量的错误。在大多数情况下，函数声明应该写在代码开头（通常在预处理指令之后）并位于函数定义之外。与一样，新标准对函数定义和函数调用的位置没有限制。\n\
  \n## 4.3 函数间信息传输机制的设计\n\n### 4.3.1 函数间信息传输的特点\n\n#### 4.3.1.1 函数间传输数据的分类\n\n我们在函数介绍中已经得出结论：使用多个子程序完成任务的关键在于它们之间的信息通信。编程语言应该为这种通信提供机制。\n\
  \n在奖学金示例中，需要协作的基础步骤包括计算总和、分类和申请替换。我们可以在三个函数中实现它们，其中涉及加法、排序、分类、搜索、删除和插入等操作。\n\n图\
  \ 4.16 列出了这些步骤所需的输入/输出信息。这些数据要么是单个数据项，要么是一组关联数据。`sum` 函数读取原始数据表并输出带有一个额外总分列的数据表。分类函数读取原始数据表和分类参数，输出每个等级的学生人数及其姓名。\n\
  \n![](img/b_9783110692303-004_fig_016.png)\n\n图 4.16：奖学金申请过程中关键步骤中的数据分析。\n\n**思考与讨论**\
  \ 在通过接口向函数传输数据的过程中，数据的特征是什么？它们是如何传输的？\n\n**讨论：** 如图 4.17 所示，与数据传输相关的问题是数据类型数据大小。由于类型的本质是所用内存空间的大小，因此类型问题本质上大小问题。我们将在下文中讨论这一点。\n\
  \n![](img/b_9783110692303-004_fig_017.png)\n\n图 4.17：函数间传输信息的特点。\n\n在现实生活中，我们可以直接或间接地向他人寄送物品。例如，邮递员可以直接将包裹寄给收件者，也可以将其放在自助快递柜中。\n\
  \n我们可以在函数间的信息传输中也使用这些方法。在程序中，少量数据直接传递给函数。相比之下，大量数据通常通过提供数据的起始地址间接地传递给函数，以便函数可以自行获取它们。\n\
  \n#### 4.3.1.2 函数间传输数据的表达\n\n如果我们从不同的角度考虑，待处理的数据有不同的名称。从函数调用者（外包者）的角度来看，待处理的数据在\
  \ C 中被称为 `arguments`（实）；从函数定义（生产者）的角度来看，它接收的数据被称为 `parameters`（形参），如图 4.18 所示。至于最终产品如何传输，我们将在后文中介绍。\n\
  \n![](img/b_9783110692303-004_fig_018.png)\n\n图 4.18：函数中使用的数据术语。\n\n### 4.3.2 函数间信息传输：数据的提交与接收\n\
  \n正如我们之前讨论过的，C 语言根据传递给函数的大小以不同的方式处理数据。\n\n#### 4.3.2.1 小量数据的提交\n\n我们将从少量数据开始。\n\n\
  为函数调用者需要处理的实际值分配的内存空间称为 `argument space`（参数空间）。系统复制实际数据并发送到调用的函数，如图 4.19。换言之，函数接收的是实际值的副本。我们可以将此过程想象为将资产副本发送广告公司进行打印。为这些副本分配的内存空间称为\
  \ `parameter space`（形参空间）。\n\n![](img/b_9783110692303-004_fig_019.png)\n\n图 4.19：少量数据：直接传递。\n\
  \n`argument space` 独立于 `parameter space`。因此，对 `parameter space` 中数据的更新不会改变 `argument\
  \ space` 中的数据。这种信息传输是单向的。因为传输的是值，我们将此称为 `pass by value`（值传递）。这种函数调用方式称为 `call by\
  \ value`（值调用）。\n\n#### 4.3.2.2 大量数据的提交\n\n现在我们研究大量数据的情况。\n\n如果数据很大，传递副本的代价也很大，这将影响通信效率。在这种情况下，函数调用者可以将数据的起始地址传递给“生产者”，因为大量数据通常连续存储在内存中。然后如图\
  \ 4.20 所示，“生产者”随后从指定的地址获取数据。\n\n![](img/b_9783110692303-004_fig_020.png)\n\n图 4.20：大量数据：提交数据的地址。\n\
  \n注意，传递的信息是 `address of actual data` 的副本。这类似于库服务器的数据维护：只要服务商知道 IP 地址和密码，就可以远程操作服务器。\n\
  \n\n\n\n服务提供者也可以在现场进行维护。同样，“制造商”也可以直接前往数据地址并进行处理，如图 4.21 所示。这相当于 C 语言中的“按引用传递”。函数调用者可以将数据的起始地址传给“制造商”，这样它就可以直接在地址上处理数据。\n\
  \n注意，在“按引用传递”中，参数空间和参数空间是相同的。\n\n![](img/b_9783110692303-004_fig_021.png)\n\n图 4.21：大量数据：在现场处理。\n\
  \n我们刚刚看到函数调用者可以通过值传递或引用传递将数据传递给函数。事实上，函数结果的接收方式与数据的提交方式有关。\n\n### 4.3.3 函数结果的接收\n\
  \n#### 4.3.31 按值传递时接收函数结果\n\n在按值传递的情况下，C 提供了两种提交结果的方法，如图 4.22 所示。第一种是使用 `return`\
  \ 语句传递单个结果。第二种方法适用于地址参数。函数调用者可以在该地址找到结果。在这种情况下，可以传递多个结果。\n\n#### 4.3.3.2 按引用传递时接收函数结果\n\
  \n在按引用传递的情况下，函数调用者可以在共享的数据空间中获取多个结果，如图 4.23 所示。\n\n![](img/b_9783110692303-004_fig_022.png)\n\
  \n图 4.22：按值传递时的结果提交与接收。\n\n![](img/b_9783110692303-004_fig_023.png)\n\n图 4.23：按引用传递时的结果提交与接收。\n\
  \n## 4.4 函数整体设计\n\n### 4.4.1 函数设计的关键元素\n\n#### 4.4.1.1 函数的关键元素\n\n在关于函数形式设计和信息传递机制设计的讨论中，我们将函数模块比作现实中的“制造商”。图\
  \ 4.24 总结了我们在比较中发现的关系。函数有三个关键元素：输入、输出和处理。\n\n![](img/b_9783110692303-004_fig_024.png)\n\
  \n图 4.24：函数设计的关键元素。\n\n函数名简要描述了处理过程，而函数体实现了处理过程。\n\n函数的接收接收和结果提交是通过信息接口完成的。输入信息接口实现为参数列表。传递的信息可以是值，也可以是地址。结果可以通过两种方式输出：使用\
  \ `return` 语句或将它们放在指定的地址上供调用者访问。同样，结果可以是值也可以是地址。\n\n#### 4.4.1.2 函数语法与函数设计关键元素之间的关系\n\
  \n如图 4.25 所示，输入信息决定了参数列表，而输出信息决定了函数类型。\n\nC 语言中的函数由函数头和函数体组成。函数头描述了函数的结构，而函数体实现了它的功能。因此，函数的输入、输出和处理决定了它的结构。\n\
  \n![](img/b_9783110692303-004_fig_025.png)\n\n图 4.25：函数设计的关键元素及其表达式。\n\n### 4.4.2\
  \ 函数间信息传递的总结\n\n#### 4.4.2.1 方向 1：从调用者到函数\n\n在 C 程序中，信息通过两种方式从实参（用户数据）传递到形（制造商数据）：按值传递和按引用传递，如图\
  \ 4.26 所示。在按值传递的情况下，实参和形存储在单独的空间，而在按引用传递的情况下，它们共享同一个空间。C 语言中还有另一种方法称为模拟按引用传递，通过指针传递数据。\n\
  \n![](img/b_9783110692303-004_fig_026.png)\n\n图 4.26：从调用者到函数。\n\n#### 4.4.2.2 方向\
  \ 2：从函数到调用者\n\n图 4.27 展示了结果传递的方式。\n\n![](img/b_9783110692303-004_fig_027.png)\n\n\
  图 4.27：从函数到调用者。\n\n## 4.4.3 函数调用\n\n#### 4.4.3.1 函数的执行与顺序\n\n图 4.28 列出了这些步骤。\n\n\
  ![](img/b_9783110692303-004_fig_028.png)\n\n图 4.28：函数的执行顺序。\n\n执行始终从主函数开始。当调用子函数时，程序进入子函数，并在子函数结束后返回。[图\
  \ 4.29] 说明了整个过程。\n\n![](img/b_9783110692303-004_fig_029.png)\n\n图 4.29：函数的执行顺序。\n\
  \n#### 4.4.3.2 函数的嵌套调用\n\n期中考试后，布老师想知道最高分、最低分以及两者之间的差值，因此他让班长 A 计算这些值。\n\nA 完成任务并向他汇报了结果。然后布老师问：“如果我们用程序模拟这个过程并要求你实现子函数，你该怎么做？”\n\
  \nA 回答道：“很简单，写两个函数。max 函数计算最高分，min 函数计算最低分。主函数通过调用它们获取最高最低分，然后计算差值。”\n\n布老师微笑问：“这是一个完整的模拟吗？”A\
  \ 思考了一会儿回答道：“不，我应该再写一个计算差值的函数。把这个函数命名为 dif [[图 4.30]。我们学习过嵌套 if 和嵌套循环，可以称这为‘嵌套函数调用’吗？”“当然，”布老师表扬道，“我们在\
  \ C 语言中确实使用这个术语。”\n\n在 C 程序中，一个函数可以调用另一个函数，而被调用的函数可以进一步调用其他函数，产生嵌套函数调用。我们可以通过任意层级的嵌套调用完成复杂的任务。\n\
  \n所有的 C 程序都是由函数构建的，每个函数都是独立定义的。也就是说，不能在一个函数的定义中定义另一个函数。\n\n\n\n\n待接收的信息定义在函数定义的的参数列表中。在调用此函数时，需要将要处理的数据放入实参列表中。参数列表包含变量的定义，而实参列表包含变量的引用，如图\
  \ 4.31 所示。\n\n使用函数时，应始终使用正确的语法。初学者常犯的错误之一是使用了错误的参数。带有此类错误的程序无法编译。此外，他们往往很难发现这些错误。\n\
  \n1. **参数列表**：在函数定义中，参数的定义列在参数列表中。\n2. **实参列表**：在函数调用中，参数的引用在实参列表中；对于数组，我们直接在实参列表中使用数组名。\n\
  \n### 4.4.3.4 函数调用的语法\n\n根据是否存在计算结果，C 语言中的函数可以分为返回值函数和非返回值函数。返回值函数具有计算结果，并使用其类型作为函数类型；非返回值函数处理数据时没有显式的计算结果。例如，排序函数对数据进行排序但不计算结果。\n\
  \n![](img/b_9783110692303-004_fig_031.png)\n\n图 4.31：参数与参数的对应关系。\n\n需要一个变量来存储返回值函数返回的结果，而非返回值函数不需要。图\
  \ 4.32 显示了调用两种函数的语法。\n\n![](img/b_9783110692303-004_fig_032.png)\n\n图 4.32：函数调用的语法。\n\
  \n## 4.5 函数设计示例\n\n在之前的章节中，我们已经介绍了函数的概念、函数之间的信息传递机制以及函数设计的关键要素。现在我们将学习一些函数设计的示例。\n\
  \n### 4.5.1 按值调用\n\n**示例 4.1** 找出三个数中的最大值\n\n### 1. 函数结构设计\n\n在函数结构设计中，我们从问题描述中提取输入、输出和处理过程。这个示例要求我们使用函数\
  \ `max` 求最大值。该函数的输入是三个整数，这决定了参数列表。函数的输出是计算出的最大值，是一个整数，因此函数类型也应为 `int`。图 4.33 总结了函数的关键要素。\n\
  \n![](img/b_9783110692303-004_fig_033.png)\n\n图 4.33：函数 `max` 的关键要素。\n\n#### 2.\
  \ 使用 main 函数与使用子函数的比较\n\n我们将在 `main` 函数和子函数分别实现寻找最大值的代码，然后对这些实现进行比较，如图 4.34 所示。`main`\
  \ 函数中 `a`、`b` 和 `c` 的值从键盘输入，而在子函数中，它们通过接口（即参数列表）获取。`main` 函数中找到的最大值直接显示在屏幕上，而子函数的结果则通过\
  \ `return` 语句返回给调用者。\n\n通过比较，我们可以得出：尽管两种实现在输入和输出上不同，但用于寻找最大值的语句是完全相同的。\n\n![](img/b_9783110692303-004_fig_034.png)\n\
  \n图 4.34：`max` 函数的不同实现。\n\n#### 3. 调用子函数\n\n必须调用子函数才能完成其功能。调用者可以是 `main` 函数或其他子函数。图\
  \ 4.35 显示了使用子函数寻找最大值的程序。注意子函数是如何声明、定义和调用的，以及这三个构造在程序中出现的顺序。与变量类似，函数在被调用之前必须声明或定义。\n\
  \n第 2 行声明了子函数 `max`。该行也称为函数 `max` 的头。\n\n`max` 的定义位于第 6 行和第 12 行之间。\n\n第 16 行在 `main`\
  \ 函数中从键盘读取了三个输入。\n\n第 17 行调用了 `max` 函数。因为 `max` 是返回值函数，结果存储在整数变量 `x` 中。\n\n![](img/b_9783110692303-004_fig_035.png)\n\
  \n图 4.35：`max` 与 `main` 的关系。\n\n### 4. 调试\n\n我们可以研究子函数是如何调用的。在调试之前，我们需要确定想要检查的内容。图\
  \ 4.36。\n\n![](img/b_9783110692303-004_fig_036.png)\n\n图 4.36：最大值的调试计划。\n\n显然，参数\
  \ `a`、`b` 和 `c` 的地址与参数 `a`、`b` 和 `c` 的地址不同。这表明它们存储在不同的空间中。虽然程序中的参数和参数名称相同，但它们存储在不同的地址。在调试时使用相同的名称很容易困扰程序员，因此建议使用不同的名称。\n\
  \n![](img/b_9783110692303-004_fig_038.png)\n\n图 4.38：使用相同名称寻找最大值的调试过程。\n\n我们将参数重命名为\
  \ `d`、`e` 和 `f`，并重复调试过程。\n\n#### 5. 调试新的实现\n\n图 4.39 显示了程序首次进入 `main` 函数和 `max`\
  \ 函数时使用的参数值。读者可能注意到变量 `d`、`e` 和 `f` 的值：\n\n```\nCXX0069: Error: variable needs stack\
  \ frame\n```\n\n此错误的发生是因为没有为这些变量分配栈内存空间。请参阅“程序执行”章节了解栈的概念。\n\n![](img/b_9783110692303-004_fig_039.png)\n\
  \n图 4.39：寻找最大值的调试过程 1。\n\n**知识 ABC** 栈帧\n\n栈帧也称为“激活记录”。它是编译器用于实现函数调用的数据结构。逻辑上，栈帧是执行函数时的环境。它包含了与函数调用相关的所有数据：参数、局部变量、返回地址、需要恢复的寄存器值副本等。在调用函数时，栈帧被推入栈中；在函数终止后，栈帧从栈中弹出。\n\
  \n\n\n\n\n如果我们从 `main` 函数中向下步进，`main` 函数中的变量将获得内存空间和地址，如图 4.40 所示。此时，它们的值仍然是随机数。子函数\
  \ `max` 中的变量值此时为“未找到”。这是由于模块的屏蔽机制，它防止了函数访问其他函数内部的数据。\n\n图 4.41 显示了执行 `scanf` 之后和调用\
  \ `max` 之前的状态。现在 `d`、`e` 和 `f` 的值分别为 2、3 和 6。`x` 的值仍然是一个随机数。\n\n![](img/b_9783110692303-004_fig_040.jpg)\n\
  \n图 4.40：寻找最大值的调试过程 2。\n\n通过按下 `F11`，我们步入子函数 `max`。如图 4.42 所示，`main` 函数中的变量现在变得不可见，而\
  \ `max` 中的变量变得可见。我们可以看到参数 `a`、`b` 和 `c` 已经获得了参数 `d`、`e` 和 `f` 的值，但它们的地址与 `d`、`e`\
  \ 和 `f` 的地址不同。此时 `m` 的值是一个随机数。\n\n在 `max` 函数结束后，结果 `6` 被存储在 `m` 中，如图 4.43 所示。\n\n\
  程序随后跳出 `max` 并返回 `main`，如图 4.44 所示。我们可以看到 `x` 的值已经变成了 `6`。\n\n![](img/b_9783110692303-004_fig_041.jpg)\n\
  \n图 4.41：寻找最大值的调试过程 3。\n\n![](img/b_9783110692303-004_fig_042.jpg)\n\n图 4.42：寻找最大值的调试过程\
  \ 4。\n\n![](img/b_9783110692303-004_fig_043.jpg)\n\n图 4.43：寻找最大值的调试过程 5。\n\n![](img/b_9783110692303-004_fig_044.jpg)\n\
  \n图 4.44：寻找最大值的调试过程 6。\n\n### 示例 4.2 结构体变量作为参数\n\n### 1. 问题描述\n使用调试器分析将结构体变量作为参数传递时的特征。\n\
  \n#### 2. 代码实现\n```c\n#include <stdio.h>\nstruct student\n{\n   int num;\n   float\
  \ grade;\n};\nstruct student func1(struct student stu) // 结构体变量作为参数\n{\n   stu.num=101;\n\
  \   stu.grade=86;\n   return (stu); // 返回结构体变量\n}\nint main(void)\n{\n   struct\
  \ student x={0, 0};\n   struct student y;\n   y = func1(x); // 结构体变量 as 参数\n   return\
  \ 0;\n}\n```\n\n#### 3. 调试\n在图 4.45 中，注意结构体参数 `x` 的地址为 `0x12ff78`。\n\n在图 4.46 中，注意参数\
  \ `stu` 的地址为 `0x12ff14`，与 `x` 的地址不同。结论是，参数的值被复制到了参数中。\n\n![](img/b_9783110692303-004_fig_045.jpg)\n\
  \n图 4.45：结构体变量作为参数的调试步骤 1。\n\n![](img/b_9783110692303-004_fig_046.jpg)\n\n图 4.46：结构体变量作为参数的调试步骤\
  \ 2。\n\n在图 4.47 中，子函数 `func1` 中结构体 `stu` 的成员被修改了。\n\n在图 4.48 中，`main` 函数中的结构体 `y`\
  \ 用于存储 `func1` 返回的结构体变量。\n\n![](img/b_9783110692303-004_fig_047.jpg)\n\n图 4.47：结构体变量作为参数的调试步骤\
  \ 3。\n\n![](img/b_9783110692303-004_fig_048.jpg)\n\n图 4.48：结构体变量作为参数的调试步骤 4。注意：`x`、`y`\
  \ 和 `stu` 有不同的地址。`x` 的值未修改。\n\n#### 关于值传递的结论\n1. 参数分开存储；\n2. 在函数调用期间，参数的值被复制到参数；\n\
  3. 子函数使用参数。参数的更新不会影响参数。从本质上说，值传递将参数复制到参数。因此，子函数中的参数更新不会影响调用函数的变量。\n\n## 4.5.2 引用传递\n\
  \n### 示例 4.3 计算数组和\n计算整数数组 `score` 中索引 `m` 到 `n` 之间的元素和。请参见图 4.49 示意图。`main` 函数读取\
  \ `m` 和 `n` 的值并输出结果。和应由子函数 `func` 完成。\n\n#### 分析\n在这个问题中，参数有多种传递方式。我们将使用三种参数传递方式来实现程序。\n\
  \n![](img/b_9783110692303-004_fig_049.png)\n\n图 4.49：计算数组的和。\n\n### 方案 1\n#### 1.\
  \ 函数设计\n图 4.50 分析了子函数的输入和输出。\n\n![](img/b_9783110692303-004_fig_050.png)\n\n图 4.50：方案\
  \ 1 的关键元素。输入需要数组 `score` 的信息以及索引 `m` 和 `n` 的值。`score` 有多个元素。`m` 和 `n` 都是单一变量。因此，我们将通过地址传递\
  \ `score`，并通过值传递 `m` 和 `n`。输出是索引 `m` 到 `n` 之间的元素和。因为是一个单一值，我们可以使用 `return` 语句返回。返回类型为\
  \ `int`。\n\n### 2. 函数实现设计\n根据关键元素，我们可以写函数头。作为函数体，我们可以使用 `for` 循环将索引 `m` 到 `n` 之间的元素相加到变量\
  \ `sum` 中，并使用 `return` 语句返回和，如图 4.51 所示。\n\n![](img/b_9783110692303-004_fig_051.png)\n\
  \n图 4.51：方案 1 的函数设计。\n\n### 3. 代码实现\n代码实现在图 4.52。在第 5 行到第 15 行之间是子函数，其余部分是 `main`\
  \ 函数。\n\n![](img/b_9783110692303-004_fig_052.png)\n\n图 4.52：方案 1 的代码实现。第 22–27 行打印指定范围内元素的值，以便稍后调试。在第\
  \ 28 行，用参数 `array a` 和索引 `p`、`q` 调用函数 `func`。注意我们在参数列表中是如何使用数组名的。\n\n#### 1. 调试\n\
  在调试之前，我们应该列出想要调查的问题，包括与地址传递相关以及我们想要检查的变量。图 4.53 显示了这些变量在调试器监视（Watch）窗口和内存（Memory）窗口中的值。在调试期间，可以使用表格来记录变量的值以便进一步分析。\n\
