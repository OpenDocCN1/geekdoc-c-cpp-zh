  \  };\n  output(stu);\n  return 0;\n}\n```\n\n### 示例 4.9 指针作为返回值\n\n#### 分析\n\n\
  **1. 代码实现**\n\n```c\n#include <stdio.h>\nstruct student\n{\n  int  num;\n  float\
