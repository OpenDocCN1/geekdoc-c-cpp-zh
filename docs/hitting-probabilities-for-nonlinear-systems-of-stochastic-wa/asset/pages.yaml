  md: '# 1. INTRODUCTION


    where $\sigma_1(t)$ denotes the uniform measure on the sphere centered at zero
    and with radius $t$, with total mass $4\pi t^2$. For any dimension $k \in \mathbb{N}^*$,
    the Fourier transform of $G(t)$ is given by


    $$(1.10) \quad \mathcal{F}G(\xi) = |xi|^{-1} \sin(t|xi|)$$


    We refer the reader to [21] for these formulas.


    Throughout the article, we use the notation $T_0$ for a generic interval $[t_1,
    t_2]$, with $0 < t_1 < t_2 \leq T < \infty$, $\mathcal{O}$ for a compact subset
    of $\mathbb{R}^d$ and $K$ for a compact subset of $\mathbb{R}^k$.


    We end this introduction by providing several motivations for studying systems
    of stochastic wave equations. Recall that the deterministic wave equation is one
    of the three fundamental second order PDEs [20, Chapter 2]. It arises, via Newton''s
    equations of motion, as a generic model for the propagation of waves (which can
    be acoustic, electromagnetic, etc.) in a homogeneous elastic medium. For instance,
    a system of three wave equations can be used to describe the motion in three dimensional
    space of an elastic string. If this string is "floating" in a fluid, then it will
    be subject to (random) molecular excitation, and a system of wave equations driven
    by random noise provides a more detailed description of the string''s motion (here,
    $d=3$ and $k=1$); [8, Section 1] for a more detailed description of the problem,
    [22] for biological motivation, and [42] for some mathematical results on this
    problem. Of course, describing the motion of a family of $N$ DNA molecules would
    involve a system of $N$ equations!


    There are several situations in signal transmission [3] and oceanography [1, 28]
    where spatially coherent random noise is used. This type of random noise is also
    important in the mathematical literature [9, 19, 24]. The wave equation in the
    case $d=1, k=2$, arises if one is interested in the surface waves produced by
    raindrops falling on the water. The case $d=1, k=3$, arises [14] if one is interested
    in the propagation into the depths of the water of the sound waves produced by
    these raindrops: listening devices located under water would want to filter out
    this noise, and for this, a model that describes such sound propagation is useful.


    A last example concerns the study of wave propagation through the interior of
    the sum. This would be the case $d=1, k=3$, with noise that is "sphically homogeneous"
    rather than spatially homogeneous: [8] for a more detailed description of this
    problem, and [13] for some mathematical results in this direction.


    Finally, it is interesting to consider the damped wave operator, and systems of
    equations with the wave operator $$a\frac{\partial^2}{\partial t^2}+b\frac{\partial}{\partial
    t}-c\Delta$$ replaced by


    Here, the parameters $a, b and c$ have a physical interpretation, such as the
    mass per unit length, a friction coefficient, or an elasticity coefficient. In
    various limiting cases, such as $a\downarrow0$, or $b\downarrow0$, which correspond
    to the zero mass limit and the frictionless limit, one obtains obtains either
    the heat operator or the wave operator ([4] and the references therein for convergence
    of the solutions of the corresponding equations, and several motivations for this
    study). Thus, the study of systems of wave equations such as (1.1) can be viewed
    as an important step towards the study of more general classes of systems of SPDEs.'
