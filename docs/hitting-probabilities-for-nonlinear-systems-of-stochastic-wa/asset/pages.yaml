    \ with the classical Riemann-Lebesgue theorem. In [11], the space $\\mathcal{H}$\
    \ (related to the covariance of the spatially homogeneous noise) is replaced by\
    \ $L^2([0,1])$. Finally, our main result on lower bounds is stated in Theorem\
    \ 4.3.\n\nAppendix A gathers a collection of auxiliary estimates that are used\
    \ in the previous chapters. These are of different types. Lemmas A.4, A.5, A.7,\
    \ A.8, A.9 concern integrated increments of the covariance function. They extend\
    \ results proved in [17] by explicitly the dependence on the length of the domain\
    \ of integration in the time variable. Lemmas A.1 and A.11 establish upper and\
    \ lower bounds on integrals in $\\mathcal{H}$-norms of the fundamental solution\
    \ $G$ to the wave equation. Propositions A.3 and A.6 provide upper bounds for\
    \ $L^p$-measures of integrals, on a domain of size $\\epsilon$, of $\\mathcal{H}$-norms\
    \ of stochastic processes which are a product of increments of the solution $G$\
    \ and an $L^p$-bounded process. Lemma A.12 has already been mentioned.\n\nWe end\
    \ the description of the discrepancy between the results of this paper with a\
