  md: "# # Abstract\n\nWe consider a $d$-dimensional random field $u = \\{u(t,x)\\\
    }$ that solves a nonlinear system of stochastic wave equations in spatial dimensions\
    \ $k \\in \\{1, 2, 3\\}$, driven by a spatially homogeneous Gaussian noise that\
    \ is white in time. We mainly consider the case where the spatial covariance is\
    \ given by a Riesz kernel with exponent $\beta$. Using Malliavin calculus, we\
    \ establish upper and lower bounds on the probabilities that the random field\
    \ visits a deterministic subset of $\\mathbb{R}^d$, in terms, respectively, of\
    \ the Hausdorff measure is close to investigational, and Newtonian capacity of\
    \ this set. The dimension that appears to be optimal, and shows when $d(2-\beta)\
    \ > 2(k+1)$, points are polar for $u$. Conversely, in low dimensions $d$, points\
    \ are not polar. There is however an interval in which the question of polarity\
    \ of points remains open.\n\nReceived by the editor May 8, 2012 and in revised\
    \ form, September 2013.\nArticle electronically published on January 22, 2015.\n\
    DOI: http://dx.doi.org/10.1090/memo/1120\n2010 Mathematics Subject Classification.\
    \ Primary 60H15, 60J45; Secondary 60G15, 60H07, 60G60.\n\n**Key words and phrases.**\
    \ Hitting probabilities, systems of stochastic wave equations, spatially homogeneous\
    \ Gaussian noise, capacity, Hausdorff measure.\n\nThe first author was supported\
    \ by the Swiss National Foundation for Scientific Research.\nThe second author\
    \ was supported by the grants MTM-FEDER 2009-0723 and MTM-2012-31192 from *Direccion\
    \ General de Investigacion, Ministerio de Ciencia e Innovacion*, Spain, and by\
    \ BE 2-0033, Generalitat de Catalunya.\n\nRobert C. Dalang, Institut de Matématiques,\
    \ Ecole Fédérale de Lausanne, Station CH-1015 Lausanne, Switzerland. E-mail: robert.dalang@epfl.ch.\n\
    Marta Sanz-Solé, Facultat de Matematiques, Universitat de Barcelona, Gran Via\
    \ de les Corts 585, 08007 Barcelona, Spain. E-mail: marta.sanz@ub.edu."
