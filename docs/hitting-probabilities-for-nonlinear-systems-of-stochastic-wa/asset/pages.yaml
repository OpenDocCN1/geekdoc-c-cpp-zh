    \ A.1. With direct computations, we obtain\n\n```\n$$\\int_{0}^{\\varepsilon}\
    \ dr |G(s+r, x-*)|_{\\mathcal{H}}^{\\varepsilon} = c \\left( \\frac{(s+\\varepsilon)^{3-\\\
    beta}-s^{3-\\beta}}{3-\\beta} \\right)$$\n$$= c\\varepsilon \\int_{0}^{1} (\\\
    nu\\varepsilon)^{2-\\beta} d\\nu$$\n$$\\ge c\\int_{0}^{1} (\\nu\\varepsilon)^{2-\\\
    beta} d\\nu = \\frac{c}{3-\\beta}\\varepsilon^{3-\\beta}$.$\n```\n\nSince the\
    \ last expression does not depend on $s$, we obtain the result with the constant\
    \ $C = \\frac{\\varepsilon}{3-\\beta}$.\n\nLEMMA A.12. Let $k \\in \\{1, 2, 3\\\
    }$. For $\\varepsilon > 0$ and $0 < h < \\varepsilon$,\n\n```\n$$\\int_{0}^{h}\
    \ dr (G(r, y-*), G(h+r, x-*))_{\\mathcal{H}} \\le C\\varepsilon^{3-\\beta} \\\
    left( \\frac{x-y}{\\varepsilon} \\right)^{\\beta$\n```\n\nwhere\n\n```\n$$\\lim_{\\\
    lambda\\to+\\infty} \\varphi(z, \\lambda) = 0$\n```\n\nuniformly in $\\lambda\
    \ \\in [0, 1]$.\n\nPROOF. Consider the first case $k=1$. In this case $\\beta\
    \ \\in [0, 1]$. Using (1.8), we have\n\n```\n$$\\int_{0}^{\\varepsilon} dr (G(r,\
    \ y-*), G(h+r, x-*))_{\\mathcal{H}} = \\int_{y-r}^{y+r} d\\xi \\int_{x}^{x+h}\
    \ d\\eta \\frac{1}{|\\xi-\\eta|^{\\beta}}$$\n```\n\nConsider the change of variables\
    \ $r \\mapsto \\frac{\\xi}{\\varepsilon}, \\xi \\mapsto \\frac{\\eta}{\\varepsilon}$\
    \ to see that this is equal\n\n```\n$$\\int_{0}^{\\varepsilon^3} dr \\int_{-r}^{0}\
