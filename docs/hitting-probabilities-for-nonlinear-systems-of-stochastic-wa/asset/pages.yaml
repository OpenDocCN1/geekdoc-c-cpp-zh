  md: 'Next, establish upper bounds for the integral above. For this, we proceed in
    the proof of [17], Lemma 6.4 (see the analysis of the terms denoted $\nu_{2}^{\alpha,2,1,1}$
    in that proof).


    We first consider the domain $|w| \le 3$, in which we split the absolute value
    in (A.20) into separate terms. Following the calculations just mentioned in the
    proof of [17, Lemma 6.4] and using (A.7), we find that


    ```

    $ \int_{s-\varepsilon}^{s} dr \int_{\mathbb{R}^k \times \mathbb{R}^k} dw G(s-r,du)G(t-r,dv)\n\times
    \int_{|w| \le 4} dw \kappa_{\alpha+\beta}((t-s)w-(v-u))\kappa_{-\alpha}\left(\frac{u}{s-r}-w\right)\n\le
    \int_{|w| \le 4}\frac{dw}{|w|^{k-\alpha}} \int_{s-\varepsilon}^{s} dr \int_{\mathbb{R}^k}
    d\xi \frac{|FG(t-r)(\xi)|^2}{|\xi|^{k-(\alpha+\beta)}}$

    ```


    We are assuming $\alpha+\beta \in[0,2]$. Applying Lemma A.1 with $\beta:=\alpha+\beta$,
    we see that this expression is bounded


    ```

    $C \int_{|w| \le 4}\frac{dw}{|w|^{k-\alpha}} \left[(t-s+\varepsilon)^{3-(\alpha+\beta)}-(t-s)^{3-(\alpha+\beta)}\right]\n\le
    C(t-s+\varepsilon)^{2-(\alpha+\beta)}.$

    ```


    Similarly,


    ```

    $ \int_{|w| \le 4} dr \int_{\mathbb{R}^k \times \mathbb{R}^k} dw G(s-r,du)\n\times
    \int_{|w| \le 4} dw \kappa_{\alpha+\beta}((t-s)w-(v-u))\kappa_{-\alpha}(w)\n\le
    \int_{|w| \le 4}\frac{dw}{|w|^{k-\alpha}} \int_{s-\varepsilon}^{s} dr \int_{\mathbb{R}^k}
    d\xi \frac{|FG(s-r)(\xi)|||FG(t-r)(\xi)|}{|\xi|^{k-(\alpha+\beta)}}$

    ```


    By applying the Cauchy-Schwarz inequality to the $d\xi$-integral, and using Lemma
    A.1, we find that


    ```

    $(A.22) \int_{\mathbb{R}^k} d\xi \frac{|FG(s-r)(\xi)|||FG(t-r)(\xi)|}{|\xi|^{k-(\alpha+\beta)}}
    \le C(s-r)^{1-\frac{\alpha+\beta}{2}}(t-r)^{1-\frac{\alpha+\beta}{2}}.$

    ```


    Hence (A.21) is bounded


    ```

    $C \int_{|w| \le 4}\frac{dw}{|w|^{k-\alpha}} \int_{s-\varepsilon}^{s} dr (s-r)^{1-\frac{\alpha+\beta}{2}}(t-r)^{1-\frac{\alpha+\beta}{2}}\n\le
    C \int_{|w| \le 4}\frac{dw}{|w|^{k-\alpha}} \left(\varepsilon^{2-\frac{\alpha+\beta}{2}}(t-s+\varepsilon)^{1-\frac{\alpha+\beta}{2}}\right)..$

    ```


    In order to finish the estimate of $\nu_{2}^{\alpha}(t,\varepsilon)$, we consider
    now the domain $|w|>3$ (see [17], page 59). For, we use the inequality


    ```

    $(A.23) |D\kappa_{-\alpha}\left(w,\frac{u}{s-r}\right)| \le C \int_{0}^{u} d\lambda
    \kappa_{k+1-\\alpha}\left(w-\lambda-\frac{u}{s-r}\right),.$

    ```'
