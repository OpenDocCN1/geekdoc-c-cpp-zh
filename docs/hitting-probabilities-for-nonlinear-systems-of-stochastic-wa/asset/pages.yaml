  md: '# 1. INTRODUCTION


    been considered. By a rotation of forty-five degrees, the system is transformed
    into one new consisting of gaussian equations in spatial dimension $k=1$ driven
    by a space-time white noise. References [10, 11] are concerned with systems of
    heat equations in spatial dimension $k=1$ driven by space-time white noise. Systems
    of nonlinear heat equations with $k \geq 1$ driven by a Gaussian noise of the
    type described, with covariance measure $\Gamma(dx)=|x|^{-\beta}$, $\beta \in
    [0,2 \wedge k]$ are considered in [12] (and with some ideas developed here). In
    contrast with [18] and [2], in non Gaussian cases, the existence, expression and
    properties of densities are obtained using Malliavin Calculus. For this, we will
    use this tool. For this, we consider the following conditions of the system (1.4):


    +   (P1) The functions $\sigma_{i,j}$ and $b_i$, $1 \leq i,j \leq d$ are infinitely
    de-ferentiable, with bounded partial derivatives of any positive order. Moreover,
    the $\sigma_{i,j}$, $1 \leq i,j \leq d$, are bounded.


    +   (P2) The matrix-valued function $\sigma$ is uniformly elliptic. This implies
    that for any $v \in \mathbb{R}^d$ with $\|v\|=1$


    ```

    (1.7) \inf_{x \in \mathbb{R}^d} v^T \sigma(x)v \geq \rho_0 > 0.

    ```


    Chapter 2 is devoted to establishing the upper bound in terms of Hausdorff measure.
    From [18, Theorem 2.4], it suffices to prove the existence of a density $p_{u,x}(z)$
    for any variable $u(t,x)$, $(t,x) \in [0,T] \times \mathbb{R}^k$, and that this
    density is uniformly bounded (in these three variables) over compact set. We must
    bound from above the $L^m$-moments of increments $u(t,x)-u(s,y)$ in terms of a
    power of the distance $|t-s|+|x-y|$, for any $q \in [1, \infty[$ (see the statements
    (R1) and (R2) in Chapter 2).


    The existence of smoothness in the $z$-variable of the random variables $u(t,x)$,
    $(t,x) \in [0,T] \times \mathbb{R}^k$, solution to a stochastic wave equation
    with $k=2$ and $k=3$ (with $d=1$) has been proven in [30] and [38], respectively.
    However, to the best of our knowledge, no proof exists for $k=1$ and spatially
    homogeneous noise, and the existence of uniform boundedness has not been addressed
    either. The main ingredients for proving this are uniform bounds in $(t,x)$ over
    compact sets for the $L^m$-moments of the determinant of the Malliavin matrix
    $\gamma_{u(t,x)}$. This is proved in Proposition 2.3 with an approach that is
    independent of the dimension $k \in{1, 2, 3\}$.


    As the analysis of $L^m$-moments of increments $u(t,x)-u(s,y)$, we consider different
    types of assumptions on the covariance measure $\Gamma$. The two cases—additive
    and multiplicative noise—are handled separately. With the latter, the former admits
    more general covariances and the estimates are sharper. For multiplicative noise,
    we rely on known results for $k=2$ [29,30] and $k=3$ [17], but not aware of any
    regularity, we give a complete proof for $k=1$. Finally, our result on upper bounds
    is stated in Theorem 2.1.


    The main part of this paper is devoted to establishing lower bounds on the hitting
    probabilities in terms of the Bessel-Riesz capacity of the set $A$. For this,
    we assume that $\Gamma(dx)=|x|^{-\beta}$, with $\beta \in[0,2 \wedge k]$. This
    hypothesis (C1) in Chapter 2, which is more restrictive than the other conditions
    (C1''), (C2), (C3) listed there.'
