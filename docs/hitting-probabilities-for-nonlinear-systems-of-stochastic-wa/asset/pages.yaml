    \ case). The upper bound (2.1) is **almost optimal**. In fact, by taking $\\Gamma(\\\
    delta) = |x|^{-\\beta}$, with $\\beta \\in [0, 2]$, the dependence of the Hausdorff\
    \ measure on the right-hand side of (2.1) is strictly less than $d - \\frac{2(k-1)}{2-\\\
    \beta}$. The same phenomenon appears in [11] in comparison with [10]. Considering\
    \ the lower bound, according to (3.7), if the parameter $\\rho$ in (3.5) were\
    \ equal to $2-\\beta+\\delta$, for $\\delta$ arbitrarily close to zero, then the\
    \ dependence of the capacity in (3.7) would be $d - \\frac{2(k-1)}{2-\\\beta}\
    \ + \\eta$, with $\\eta$ arbitrarily close to zero, and therefore arbitrarily\
