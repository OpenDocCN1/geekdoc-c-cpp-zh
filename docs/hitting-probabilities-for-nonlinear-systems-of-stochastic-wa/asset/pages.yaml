  md: "# 1. INTRODUCTION\n\nLower bounds on hitting probabilities are obtained by\
    \ using modification of Theorem 2.1 in [18], as follows. When applied to the random\
    \ solution to the system (1.4), the two hypotheses of that theorem are\n\n+  \
    \ (a) a Gaussian-type upper bound for the joint density of $u(s,y), u(t,x)$, for\
    \ $(s,y) \neq (t,x), (s,y), (t,x) \\in [0, T] \times \\mathbb{R}^k$;\n(b) strict\
    \ positivity of the density $p_{t,x}$ on $\\mathbb{R}^d$.\n\nProperty (b) has\
    \ been recently established in [35]. As the upper bound in (a), we show here that\
    \ this hypothesis can be significantly weakened. Indeed, the exponential factor\
    \ in the Gaussian-type can be replaced by a monomial (see the proof of Theorem\
    \ 3.5 and also Remark 3.1(b)), and this still leads to the same lower bounds on\
    \ hitting probabilities as the Gaussian-type estimate.\n\nAs in [11], the main\
    \ technical effort of the paper is to establish such an upper bound on the joint\
    \ density. We follow the same general approach as in ref., though the difficulties\
    \ that we encounter and the way they are solved present significant differences.\
    \ Let $Z = (u(s,y), u(t,x)-u(s,y))$ and denote by $\\gamma_Z$ the Malliavin matrix\
    \ of $Z$. The hard core of our analysis consists of estimating the rate of degeneracy\
    \ in terms of negative powers of $|t-s|$ of $L^p$-moments of the inverses of the\
    \ eigenvalues of $\\gamma_Z$. As noticed in [11], this is necessary only for the\
    \ 'small' values. For the 'large' eigenvalues, it suffices to prove that these\
    \ have $L^p$-bounded moments.\n\nIn Chapter 3, we highlight this fact. Indeed,\
    \ Theorem 3.1 provides lower bounds for the hitting probabilities, assuming that\
    \ the conditions mentioned before the small and large eigenvalues (see (3.5)-(3.6))\
    \ are satisfied. Although the proof of Theorem 3.1 uses arguments from [11], we\
    \ would like to stress two novel points. First, the remark on condition (a) mentioned\
    \ above. Indeed, in the examples previously analyzed in the literature, the exponential\
    \ factor is obtained by applying the exponential martingale inequality. This is\
    \ not possible by eliminating the drift term no version of that theorem exists\
    \ for $k > 1$. Fortunately, the monomial factor can be obtained that we have $L^p$-estimates\
    \ of $u(t,x)-u(s,y)$ in terms of powers of $|t-s|+|x-y|$. This question appears\
    \ naturally in relation to the analysis of sample regularity through Kolmogorov's\
    \ continuity. The second point is that this theorem explains the relationship\
    \ between the rate of degeneracy of the eigenvalues that we alluded to, described\
    \ by some positive parameter $\rho$ (see (3.5)) and the dimension of the Bessel-Riesz\
    \ capacity in the lower bound on hitting probabilities (see (3.5)). In particular,\
    \ we observe from Theorem 3.1 that obtaining an optimal result for the lower bound\
    \ requires an optimal result on the rate of degeneracy among the small eigenvalues!\n\
    \nChapter 4 is devoted to the analysis of the eigenvalues of the Malliavin matrix\
    \ $\\gamma_Z$, in order to check the validity of assumptions (3.5)-(3.6), for\
    \ some rate parameter $\rho$. The main task of carrying out this is [11, Proposition\
    \ 3.5]. However, we will obtain in Theorem 4.1 a value of $\rho$ reasonably close\
    \ to $3-\beta$, whereas the optimal value should be $2-\beta$.\n\nTheorem to establish\
    \ the bound (3.6) on the large eigenvalues. The proof of an analogous result in\
    \ [11] relies on the semigroup property of the heat kernel and its properties,\
    \ and uses repeatedly [11, Proposition 3.5]. We also use this tool, but the overall\
    \ structure of the proof is quite different. Given the absence of semigroup property,\
