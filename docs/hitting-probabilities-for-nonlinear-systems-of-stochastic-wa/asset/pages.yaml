  md: '# A.2. INTEGRATED INCREMENTS OF THE COVARIANCE FUNCTION


    LEMMA A.8. For any $0 \le s < t \le T$ and $\epsilon \in [0, s]$, let


    $\nu_2(s,t,\epsilon) = \int_{s-\epsilon}^s dr \int_{\mathbb{R}^k \times \mathbb{R}^k}
    G(s-r,du)G(s-r,dv)$$

    $$

    times \left[ f\left(\frac{t-r}{s-r}\right)f\left((v-u)\right) - f\left(\frac{t-r}{s-r}\right)f\left((v-u)\right)\right]$$


    Then, for any $\alpha \in [0, 1]$ such that $\alpha+\beta \in [0, 2]$


    $\nu_2(s,t,\epsilon) \le C|\epsilon|^{t-s+\epsilon|^{1-\beta}\beta_1[0,|\epsilon||+|epsilon|^{2-\beta}\beta_1[1,2]}$$

    $\n+|\epsilon|^{t-s+\epsilon|^{2-(\alpha+\beta)}}+\epsilon|^{2-\frac{2\beta}{3}}|t-s|\alpha|^t|\epsilon|^{1-\frac{2\beta}{3}}}$


    PROOF. We follow the scheme of Lemma 6.4 in [17]. Here $\nu_2^*(s,t,\epsilon)$
    is defined in the same way as $\nu_2(s,t,\epsilon)$ but with the expression in
    in absolute values replaced by


    $\left(f\left(\frac{t-r}{s-r}\right)^2 - f\left(\frac{t-r}{s-r}\right)f\left((v-u)\right)\right)$


    and


    $\left[f\left(\frac{t-r}{s-r}\right)f\left((v-u)\right) - f\left(\frac{t-r}{s-r}\right)f\left((v-u)\right)\right]$


    respectively. The change of variables, $(u,v) \to \frac{sr}{s-r}(u,v)$, (A.7)
    and (A.1) yield


    $\nu_2^*(s,t,\epsilon) = |t-s| \int_{s-\epsilon}^s dr \int_{\mathbb{R}^k \times
    \mathbb{R}^k} G(t-r,du)G(t-r,dv)f(v-u)$


    $\le C|t-s| \int_{s-\epsilon}^s \frac{dr}{t-r} |t-r|^{2-\beta}$$

    $\n$\le C|t-s|((t-s+\epsilon)^{2-\beta}-(t-s)^{2-\beta})$


    By the Intermediate Value Theorem,


    $(A.18) \quad (t-s+\epsilon)^{2-\beta}-(t-s)^{2-\beta} \le \begin{cases} C\epsilon(t-s+\epsilon)^{1-\beta},
    & \text{if } \beta < 1, \ C\epsilon(t-s)^{1-\beta}, & \text{if } \beta \ge 1.\end{cases}$


    Thus, $\nu_2^*(s,t,\epsilon) \le C|t-s||t-s+\epsilon|^{1-\beta}\beta_1[0,|\epsilon||+|t-s|^{2-\beta}\beta_1[1,2]]$.


    Consider the change of variables $(u,v) \to \frac{sr}{s-r}(u,v)$. Then


    $\nu_2^*(s,t,\epsilon) = \int_s^s dr \int_{\mathbb{R}^k \times \mathbb{R}^k} G(s-r,du)G(t-r,dv)|f\left(v-\frac{t-s}{s-r}\right)|$.


    Let $\alpha > 0$ such that $\alpha+\beta \in [0, 2]$. We write $f(u) = \kappa_beta(u)=|u|^{-\beta},
    \beta \in [0, 2]$. By applying [17, Lemma 2.6(a)] with $d:=\alpha, b:=\alpha,
    a:=(\alpha+\beta), c:=t-s, u:=v-u, x:\dots$, we obtain


    $\nu_2^*(s,t,\epsilon) \le C|t-s|^{\alpha} \int_{s-\epsilon}^s dr \int_{\mathbb{R}^k
    \times \mathbb{R}^k} G(s-r,du)G(t-r,dv)$$

    $\n\times \int_{s-\epsilon}^s dw K_{\alpha+\beta}((t-s)w-(v-u))D_{k-\alpha}\left(w,\frac{u}{s-r}\right)$.'
