    ## 4.1. STUDY OF THE SMALL EIGENVALUES


    Using again that $t-s < \varepsilon$, Lemma A.2 also yields


    $E\left(|U_{\varepsilon}^t(s;x,y)|^p\right) \leq C\varepsilon^c(t-s+\varepsilon)^{(5-2\beta)p}
    \leq C\varepsilon^{(3-\beta)p}$


    With this, the proof of (4.13) is complete.


    Our next goal is to establish the lower bound


    $(4.14) $L_{\varepsilon}(s;x,y) \geq c\varepsilon^{3-\beta}$


    for some constant $c$. For this, the change of variable $r \to s-r$ and the inequality
    $||a+b||^2 \geq ||a||+||b||-2|(a,b)|$, valid in any Hilbert space. Property (P2)
    implies that


    $L_{\varepsilon}(s;x,y) \geq \rho_0^2 |\lambda-\chi|^2 \int_{-\varepsilon}^0 dr
    ||G(r,y-*)|_{\mathcal{H}}^2 + |\chi|^2 \int_{-\varepsilon}^0 dr ||G(t-s+r,x-*)|_{\mathcal{H}}^2
    -2\int_{s-\varepsilon}^s dr \langle (\lambda-\chi)^T\sigma(u(s,y))G(s-r,y-*),
    \chi^T\sigma(u(s,x))G(t-r,x,*) \rangle_{\mathcal{H}_d}$


    Set


    $T_{\varepsilon}(s,t;x,y)=2\int_{s-\varepsilon}^s dr \langle (\lambda-\chi)^T\sigma(u(s,y))G(s-r,y-*),
    \mu^T\sigma(u(s,x))G(t-r,x,*) \rangle_{\mathcal{H}_d}$


    Remember $|\lambda|^2+|\chi|^2=1$. Consequently, $|\lambda-\chi|^2+|\chi|^2 \geq
    c$, for some positive constant $c$. This fact, along with Lemma A.11 below, implies
    that


    $L_{\varepsilon}(s;x,y) \geq \tilde{c}\varepsilon^{3-\beta}-T_{\varepsilon}(s,t;x,y)$.


    Our next aim is to prove that


    $(4.15) $T_{\varepsilon}(s,t;x,y) = \tilde{c}\varepsilon^{3-\beta}\Psi(\varepsilon;x,y;s,t)$,


    where


    $(4.16) \lim_{|x-y|/\varepsilon \to+\infty} \Psi(\varepsilon;x,y;s,t)=0$,


    uniformly for $\frac{t-s}{\varepsilon} \in [0,1]$.


    By developing the inner product in the definition of $T_{\varepsilon}(s,t;x,y)$,
    we easily obtain


    $T_{\varepsilon}(s,t;x,y) \leq C \int_0^s dr (G(r,y-*),G(t-s+r,x-*))_{\mathcal{H}_d}$,


    with a constant $C$ depending on $|\lambda|, |\chi|, ||\sigma||_{\infty}$. Statements
    (4.15)-(4.16) now follow from Lemma A.12.


    Property (4.6) implies the existence of a $\delta_0 > 0$ such that, for any $\varepsilon
    > 0$ satisfying


    $\frac{|x-y|}{\varepsilon} > \delta_0$, $|\Psi(\varepsilon;x,y;s,t)| < \frac{\tilde{c}}{2\varepsilon}$.


    ## 4. STUDY OF MALGIAVIN MATRIX EIGENVALUES AND LOWER BOUNDS


    This yields


    $L_\varepsilon(s;x,y) \geq \tilde{C}\varepsilon^{3-\beta} - T_\varepsilon(t;x,y)
    \geq \frac{\tilde{C}}{2}\varepsilon^{3-\beta}$.


    Thus, for any $\varepsilon < \frac{|x-y|}{\delta_0}$, we have proved that


    (4.17) $$\inf_{|\xi|=1} \xi^T \gamma_Z \xi \geq C\varepsilon^{3-\beta} - Y_{3,\varepsilon},$$


    with $Y_{3,\varepsilon}$ satisfying (4.13).


    **Subcase 2.2:** $0 \leq \varepsilon \leq t-s$. We apply the results obtained
    in **Case 1** to conclude that


    $$\inf_{|\xi|=1} \xi^T \gamma_Z \xi \geq \min(C\varepsilon^{\theta_1(3-\beta)}
    - Y_{1,\varepsilon}, C\varepsilon^{\nu+\theta_2(3-\beta)} - Y_{2,\varepsilon}),$$


    with $Y_{1,\varepsilon}$ and $Y_{2,\varepsilon}$ satisfying (4.5), (4.6), respectively.


    Combining the results proved so far, we see that


    $$\inf_{|\xi|=1} \xi^T \gamma_Z \xi \geq \min(C\varepsilon^{\theta_1(3-\beta)}
    - Y_{1,\varepsilon}\mathbf{1}_{\varepsilon \leq t-s}}, C\varepsilon^{\max(\nu,\theta_2(3-\beta))}
    - Y_{2,\varepsilon}\mathbf{1}_{\varepsilon > t-s}}),$$


    - (a) $\theta_1 + \nu > \theta_1(3-\beta)$,

    - (b) $5-2\beta > \nu + 3-\beta$,

    - (c) $5-2\beta > 3-\beta$.


    Since $\beta \in [0,2]$, it is clearly satisfied, and (a) and (b) are equivalent
    to


    $$\theta_1(2-\beta) < \nu < 2-\beta.$$$$


    Consider $0 < \theta_1 < 1$ and choose $\nu \in [\theta_1(2-\beta), 2-\beta]$.
    According to Proposition 3.5 in [11], we obtain


    (4.18) $$\E\left[ \left( \inf_{|\xi|=1} \xi^T \gamma_Z \xi \right)^{-p} \right]
    \leq C|x-y|^{-p(\nu+3-\beta)}.$$


    Since $\theta_1$ can be chosen arbitrarily, this yields (4.18) with $\nu$ replaced
    by any $\delta$ arbitrary close to zero.


    Finally, (4.1) is obtained by combining the results proved in **Case 1** (see
    4.12) and **Case 2**. This proves Theorem 4.1. $\square$


    ## 4.2. Study of the largest eigenvalues of $\gamma_Z$.


    Our next result concerns the contribution of the largest eigenvalues of $\gamma_Z$.


    **THEOREM 4.2.** We assume (P1), (P2) and (C1). For any $p \in [1, \infty]$, there
    exists a constant $C$ depending on $p$, $I$ and $K$ such that, for any $(t,x)
    \neq (s,y)$ with $a \leq t \leq b$ and $x,y \in K$,


    (4.19) $$\E \left[ 1_{A_k} \left(\prod_{i \in K} \xi^T \gamma_Z \right)^{-p} \right]
    \leq C,$$


    with $A_k$ defined in (3.4).


    ## 4.2. STUDY OF LARGE EIGENVALUES


    PROOF. Fix $i_0 \in \{1, \dots, d\}$ such that $\alpha_{i_0} \geq \alpha_0$. In
    the sequel, we will write $\alpha$ instead of $\alpha_0$ and $\xi$ instead of
    $\xi_0$. By Hölder''s inequality, it suffices to prove


    (4.20) $$E\left[(\xi^T G_\varepsilon \xi)^{-p}\right] \leq C,$$


    for any $p \in [1, \infty)$. Fix $\theta \in [0, 1]$, and $\theta_1 < \theta(1/2)$.
    In the following arguments, we choose $\varepsilon \in (0, a^{\theta_1})$.


    **Case 1:** In the proof of Theorem 4.1, we write $\xi = (\lambda, \chi)$. There
    exists $\alpha \in [0, 1]$ and vectors $\hat{\lambda}, \hat{\chi} \in \mathbb{R}^d$
    such that $|\hat{\lambda}|=|\hat{\chi}|=1$. For any $\eta > 0$ we have


    $$\xi^T G_\varepsilon \xi = \min\left(\inf_{\alpha_0 \leq \alpha \leq \sqrt{1-\varepsilon}}
    (\xi^T G_\varepsilon), \inf_{\sqrt{1-\alpha^2} < \alpha < 1} (\xi^T G_\varepsilon)\right).$$


    $\alpha_0 \leq \alpha \leq \sqrt{1-\varepsilon}$. By using (4.2-4), we write


    $$\xi^T G_\varepsilon \xi \geq J_2^\varepsilon \geq G_{1,\varepsilon},$$


    where


    $$G_{1,\varepsilon} = \int_{t-\varepsilon}^t dr \left|\sum_{i=1}^d \sqrt{1-\alpha^2}
    \hat{\chi}_i G(t-r,x-*) \sigma_i(u(t,x))\right|_{\mathcal{H}^2}$$


    and $G_{1,\varepsilon} = \widetilde{G}_{11,\varepsilon} + \widetilde{G}_{12,\varepsilon}$,


    $$\widetilde{G}_{11,\varepsilon} = \int_{t-\varepsilon}^t dr \left|\sum_{i=1}^d
    \sqrt{1-\alpha^2} \hat{\chi}_i G(t-r,x-*) [\sigma_i(u(t,x))\right|_{\mathcal{H}^2}$$


    $G_{12}$ By Lemma A.1 and hypothesis (P2), since $1-\alpha^2 \geq \varepsilon^\eta$,
    we have


    (4.21) $$G_{1,\varepsilon} \geq C\varepsilon^{\eta(3-\beta)}.$$


    Similarly as (4.10), we have


    $$E\left((\widetilde{G}_{11,\varepsilon})^p\right) \leq C\varepsilon^{\theta(5-2\beta)}.$$


    Lemma A.2 with $s=t$ tells us that


    $$E\left((\widetilde{G}_{12,\varepsilon})^p\right) \leq C\varepsilon^{\theta(3-\beta)2p}.$$


    Both estimates above hold for any $p \in [1, \infty)$. Consequently, for any $p
    \in [1, \infty]$,


    (4.22) $$E\left((\widetilde{G}_{1,\varepsilon})^p\right) \leq C\varepsilon^{\theta(5-2\beta)}.$$


    Let us now show that $\sqrt{1-\varepsilon} \leq \alpha \leq 1$. In this case,
    we use (4.2), (4.3) and we consider the lower bound


    where


