    |FG(t-r)|}{|\xi|^{k-\beta}} \le \int_{s-\varepsilon}^{s+\varepsilon} dr \int_{\mathbb{R}^k}
    d\xi \frac{|FG(s-r)|^2}{|\xi|^{k-\beta}}\left(\int_{s-\varepsilon}^{s+\varepsilon}
    dr \int_{\mathbb{R}^k} d\xi \frac{|FG(t-r)|^2}{|\xi|^{k-\beta}}\right)^{1/2}

