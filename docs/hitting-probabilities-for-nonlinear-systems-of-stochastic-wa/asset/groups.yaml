    # A. TECHNICAL ESTIMATES


    The term $\int_{|w|\ge5} \frac{dw}{|w|^{k+3-\alpha}}$ is finite for any $\alpha
    \in [0,2]$. Moreover, for $\tilde{\alpha} + \beta \in [0,2] \wedge k$,


    ```

    \int_{s-\epsilon}^s \frac{t-r}{s-r} dr \int_{\mathbb{R}^k} \frac{|FG(s-r)(\xi)|^2}{\|\xi|^{k-(\tilde{\alpha}+\beta)}}
    \le C\epsilon^{2-(\tilde{\alpha}+\beta)}|t-s+\epsilon|.

    ```


    Thus,


    (A.36) \quad I_5(s, t, \epsilon) \le C\epsilon^{2-(\tilde{\alpha}+\beta)}|t-s+\epsilon|$.


    The estimates (A.35) and (A.36) yield


    $\tilde{v}_3(s, t, \epsilon) \le C|t-s|^\alpha$


    (A.37) $\times [\epsilon^{2-(\tilde{\alpha}+\beta)}|t-s+\epsilon| + \epsilon^{2-\frac{\tilde{\alpha}+\beta}{2}}
    |t-s+\epsilon| + \epsilon^2|t-s+\epsilon|^{1-(\tilde{\alpha}+\beta)}]$.


    By considering, (A.30), and (A.37), we obtain the conclusion of the lemma for
    $\beta \in [0,1], \alpha \in [0,1] (k-\beta)$ and $\tilde{\alpha} \in [0,2], (2\wedge
    k)-\beta$.


    This finishes the proof of Lemma A.9.


    # A.3. Further bounds on Malliavin norms and inner-products


    As a consequence of Propositions A.3 and A.6, we obtain the following,


    COROLARY A.10. Let $k \in\{1,2,3\}$ and let $Z=\{Z(t,x), (t,x) \in[0,T]\times\mathbb{R}^k$
    be a stochastic process satisfying the hypotheses of Proposition A.3. Fix a compact
    $K \in\mathbb{R}^k$ and $p \in[1,\infty]$. Then there exists a constant $C>0$
    such that for any $0\le s\le t$ and $\epsilon \in[0,s]$,


    ```

    \sup_{\substack{x,y\in K \ 0\le\epsilon\le t}} E \left( \int_{s-\epsilon}^s dr
    ||G(t-r,x^*) - G(s-r,y^*) * Z(r,*)||^2_{\mathcal{H}}^p \right) \le C\epsilon^{\theta(1-\beta)}_{\beta_1\in[0,1]}}+\epsilon^{p(2-\beta)}_{\beta_1\in[1,2]}}.

    ```


    PROOF. By using the properties of the parameters $\alpha_i$ in Proposition A.3
    and $\alpha_i, i=1,2,3$ in Proposition A.6, arbitrarily close to zero, and by
    bounding $|x-y|$ and $|t-s|$ we obtain a constant. Note that for $\alpha_3=0^+$
    and $\beta \in[0,1]$,


    ```

    (s-\epsilon)^{2-(\alpha_3+\beta)}(t-s)^{2-(\alpha_3+\beta)} \le C|t-s+\epsilon|^{1-(\alpha_3+\beta)}).

    ```


    This completes the proof.


    In the proof of Theorem 4.2, we give an upper bound for the term $E\((G_{3,3,\epsilon})^*)$
    by using Propositions A.3 and A.6 (see (4.27)). In that case, $Z(r,x):=\sigma_{i,j}(u(r,x)),
    \rho :==\frac{2-\beta}{2}, \epsilon :=\epsilon^2$, and it is assumed that $|x-y|\le\delta_0\epsilon,
    |t-s|\le\epsilon^0$.


    Consider first the case $k=1$ and $\beta \in[0,1]$. By choosing $\tilde{\alpha}=(1-\beta)$,
    from Proposition A.3


    ```

    E \left( \int_{s-\epsilon^2}^s dr ||G(t-r,x^*) - G(s-r,y^*) * \sigma_{i,j}(u(r,*))||^2_{\mathcal{H}}^p
    \right) \le C\epsilon^{\theta(2-\beta)+\theta_2} + \epsilon^{p(\theta+2-\theta_2)}.

    ```


    # A.3. FURTHER BOUNDS ON MALLIAVIN NOR AND INNER-PRODUCTS


    In the same context, and the choice of parameters $\alpha_1 = \alpha_4 = (1-\beta)^+,
    \alpha_3 = 0^+$, $\theta \geq \theta_2$, after tedious checking, Proposition A.6
    yields


    ```

    $E\left(\int_{s-\theta_2}^s ||[G(t-r, x-*) - G(s-r, x*)]||^p \sigma_{i,j}(u(r,*))||_{\mathcal{H}}^p\right)\leq
    C\left(\varepsilon^{0(2-\beta)^2} + \theta_2^0 + \theta_0(2-\beta) + \varepsilon^{0(1-\beta)^2}
    + \varepsilon^{2(1-\beta)}\right).

    ```


    Consequently, from (A.38), (A.39) we obtain


    ```

    $E\left(\int_{s-\theta_2}^s dr ||[G(t-r, x^*) - G(s-r, y^*)]||^p \sigma_{i,j}(u(r,*))||_{\mathcal{H}}^p\right)\leq
    C\left(\varepsilon^{0(2-\beta)^2} + \theta_2^0 + \theta_0(2-\beta) + \varepsilon^{0(1-\beta)^2}
    + \varepsilon^{2(1-\beta)}\right).

    ```


    For $k \in \{2,3\}$, by choosing $\bar{\alpha} := (2-\beta)^+$ and then $\alpha
    := 1$ if $\beta \in [0,1]$, and $\alpha := (2-\beta)^+$ if $\beta$, from A.3 we
    obtain


    ```

    $E\left(\int_{s-\theta_2}^s dr ||[G(t-r, x^*) - G(s-r, y^*)]||^p \sigma_{i,j}(u(r,*))||_{\mathcal{H}}^p\right)\leq
    C\left(\varepsilon^{0(2-\beta)^+}\right).

    ```


    In the same context of (A.27), for $\beta \in [0,1]$ and the choice of parameters
    $\alpha_1 := 1^-$, $\alpha_3 := 0^+$, $\alpha_4 := 1^-$, $\theta \geq \theta_2$,
    after tedious verification, Proposition A.6 yields


    ```

    $E\left(\int_{s-\theta_2}^s dr ||[G(t-r, x^*) - G(s-r, y^*)]||^p \sigma_{i,j}(u(r,*))||_{\mathcal{H}}^p\right)\leq
    C\left(\varepsilon^{0(2-\beta)^2} + \varepsilon^{2\theta_0(1-\beta)} + \varepsilon^{0(2-\beta)}\theta_2^{2-\beta}\right).

    ```


    Consequently, from (A.41), we deduce


    ```

    $E\left(\int_{s-\theta_2}^s dr ||[G(t-r, x^*) - G(s-r, y^*)]||^p \sigma_{i,j}(u(r,*))||_{\mathcal{H}}^p\right)\leq
    C\left(\varepsilon^{0(2-\beta)^2} + \varepsilon^{2\theta_0(1-\beta)} + \varepsilon^{0(2-\beta)}\theta_2^{2-\beta}\right).

    ```


    For $\beta \in [0,1]$ let us now consider the case $\beta \in [1,2]$. By applying
    Proposition A.6 with $\alpha := (2-\beta)^+$ and $\alpha := \frac{2-\beta}{\beta}$,
    and assuming that $\theta \geq \theta_2$, obtain


    ```

    $E\left(\int_{s-\theta_2}^s dr ||[G(t-r, x^*) - G(s-r, y^*)]||^p \sigma_{i,j}(u(r,*))||_{\mathcal{H}}^p\right)\leq
    C\left(\varepsilon^{0(2-\beta)^2} + \varepsilon^{2\theta_0(2-\beta)} + \varepsilon^{2\frac{2-\beta}{\beta}}\theta_0^{\frac{2-\beta}{\beta}}\right).

    ```


    Along with (A.41), this yields


    ```

    $E\left(\int_{s-\theta_2}^s dr ||[G(t-r, x^*) - G(s-r, y^*)]||^p \sigma_{i,j}(u(r,*))||_{\mathcal{H}}^p\right)\leq
    C\left(\varepsilon^{0(2-\beta)^2} + \varepsilon^{2\theta_0(2-\beta)} + \varepsilon^{2\frac{2-\beta}{\beta}}\theta_0^{\frac{2-\beta}{\beta}}\right).

    ```


    LEMMA 11. For any $\varepsilon > 0$ and $x \in \mathbb{R}^k$,


    ```

    $\inf_{s \in [0,T]} \int_0^s dr ||G(t-r, x^*)||^2_{\mathcal{H}} \geq C\varepsilon^{3-\beta}$.

    ```


    # A. TECHNICAL ESTIMATES


    PROOF. Let $c$ be the constant defined in Lemma A.1. With direct computations,
    we obtain


    ```

    $$\int_{0}^{\varepsilon} dr |G(s+r, x^*)|_{\mathcal{H}}^{\varepsilon} = c \left(
    \frac{(s+\varepsilon)^{3-\beta}-s^{3-\beta}}{3-\beta} \right)$$

    $$= c\varepsilon \int_{0}^{1} (\nu\varepsilon)^{2-\beta} d\nu$$

    $$\ge c\int_{0}^{1} (\nu\varepsilon)^{2-\beta} d\nu = \frac{c}{3-\beta}\varepsilon^{3-\beta}.$$

    ```


    Since the last expression does not depend on $s$, we obtain the result with the
    constant $C = \frac{\varepsilon}{3-\beta}$.


    LEMMA A.12. Let $k \in \{1, 2, 3\}$. For $\varepsilon > 0$ and $0 < h < \varepsilon$,


    ```

    \int_{0}^{h} dr ||G(t-r, x^*) - G(s-r, y^*)]||_{\mathcal{H}} \le C\varepsilon^{3-\beta}
    \left( \frac{x-y}{\varepsilon} \right)^{\beta}

    ```


    where


    ```

    \lim_{\lambda\to\infty} \varphi(z, \lambda) = 0

    ```


    uniformly in $\lambda \in [0, 1]$.


    PROOF. Consider the first case $k=1$. In this case $\beta \in [0, 1]$. Using (8),
    we have


    ```

    \int_{0}^{\epsilon} dr ||G(t-r, x^*) - G(s-r, y^*)]||_{\mathcal{H}} = \int_{y-r}^{y+r}
    d\xi \int_{x}^{x+h} d\eta \frac{1}{|\xi-\eta|^{\beta}}.

    ```


    Consider the change of variables $r \mapsto \frac{\xi}{\varepsilon}, \xi \mapsto
    \frac{\eta}{\varepsilon}$ to see that this is equal


    ```

    \int_{0}^{\varepsilon} dr \int_{-r}^{0} du \int_{-r}^{\frac{h}{r}} dv \frac{1}{\dots}

    ```


    or even to


    ```

    \int_{0}^{\varepsilon^{3-\beta}} dr ... ||[G(t-r, x^*) - G(s-r, y^*)]||_{\mathcal{H}}

    ```


    # A.3. FURTHER BOUNDS ON MALLIAVIN NORMS AND INNER-PRODUCTS


    Use the trigonometric identity $a \sin b = \frac{1}{2}(\cos(a-b) - \cos(a+b))$
    and integrate the obtained expression with respect to $dr$. This gives


    ```

    $I = \frac{1}{2} \int_{R^k} \frac{d\xi}{\|\xi\|^{k-\beta+2}} e^{\langle\xi,x-y\rangle}
    \times [\cos(|\xi|h) - (\frac{\sin((h+\varepsilon\xi))}{2|\xi|}) - \frac{\sin(|\xi|)}{2|\xi|}].

    ```


    Next, we use the identity $a - \sin b = 2 \sin(\frac{a-b}{2}) \cos(\frac{a+b}{2})$
    and apply the change of variable $\xi \to \varepsilon$, which is


    ```

    $I = \frac{1}{2} \int_{R^k} \frac{d\xi}{\|\xi\|^{k-\beta+2}} e^{\langle\xi,x-y\rangle}
    \times [\cos(|\xi|h) - \frac{\sin(|\xi|)\cos((h+\varepsilon\xi))}{\varepsilon\xi}]
    = \frac{\varepsilon^{3-\beta}}{2} \int_{R^k} \frac{d\xi}{\|\xi\|^{k-\beta+2}}
    e^{\langle\xi,z\rangle} \times [\cos(|\xi|(\frac{h}{\varepsilon}) - \frac{\sin(|\xi|)\cos(|\xi|/\varepsilon)}{|\xi|})]
    = \frac{\varepsilon^{3-\beta}}{2} \varphi(\frac{x-y}{\varepsilon}, \varepsilon),$

    ```


    where


    ```

    $\varphi(z,\lambda) = \int_{R^k} \frac{d\xi}{\|\xi\|^{k-\beta+2}} e^{\langle\xi,z\rangle}
    \times [\cos(|\xi|)\cos((\lambda+1)|\xi|)/|\xi|]$.$

    ```


    Let


    ```

    $f_0(r) = r^{\beta-k-2} [\cos(\lambda r) - \frac{\sin(r)\cos((\lambda+1)r)}{r}],$

    ```


    $r \in \mathbb{R}$, and $f(\xi) = f_0(\xi)$. According to [23, p.429].


    ```

    $\varphi(z,\lambda) = \mathcal{F}f(z) = \int_0^{\infty} \frac{2\pi}{\|z\|^{k-\beta+2}}
    f_0(r)J_{\frac{1}{2}}(2\pi r|z|)r^2 dr.

    ```


    where $J_{\frac{1}{2}}$ denotes the Bessel function of order $\frac{1}{2} - 1$
    (see also in [23, p.425]).


    Using the trigonometric formula $\cos(a+b) = \cos a \cos b - \sin a \sin b$, one
    can easily obtain


    ```

    $[\cos(|\lambda r|) \frac{\sin(r)\cos((\lambda+1)r)}{r}] \leq C(r^2 \wedge 1)].

    ```


    where $C$ does not depend on $\lambda \in [0, 1]$.


    Consequently,


    ```

    $\varphi(z,\lambda) = \int_{-1}^{1} du \int_{-\lambda}^{\lambda+2} dv \frac{1}{|z+u-v}}$

    ```


    notice that for $\lambda \in [0, 1]$,


    ```

    $\varphi(z, \lambda) \le \int_{-1}^{1} du \int_{-2}^{2} dv \frac{1}{|z+u-v}}$

    ```


    which tends to zero as $|z| \to +\infty$.


    Next, we consider the case $k \in \{2, 3\}$. By the definition of inner product
    on $\mathcal{H}$,


    ```

    $I := \int_{0}^{\varepsilon} dr ||G(t-r, x^*) - G(s-r, y^*)||^2_{\mathcal{H}}
    = \int_{0}^{\varepsilon} dr \int_{\mathbb{R}^k} d\xi \frac{1}{|\xi|^{\beta+2}}
    e^{\varepsilon(\xi-\nu)} \sin(|r|)\sin(|h+r)|.

    ```

