    ## A. 变量 $r \rightarrow |z|$ 的技术估算


    其中我们将变量替换为 $r \rightarrow |z|$。设定：


    ```

    $I(z) := |z|^{2-\beta} \int_{0}^{\infty} u^{\beta-\frac{3}{2}} \left(\frac{u^2}{\|z|^2}\right)^{\frac{|z|}{2}}
    J_{\frac{|z|}{2}}(2\pi u) du$

    ```


    我们想要研究 $|z| \to \infty$ 时 $I(z)$ 的极限。为此，我们写 $I(z) = I_1(z) + I_2(z)$，其中：


    ```

    $I_1(z) = |z|^{2-\beta} \int_{0}^{|z|} u^{\beta-\frac{3}{2}} J_{\frac{|z|}{2}-1}(2\pi
    u) du,\n$I_2(z) = |z|^{2-\beta} \int_{|z|}^{\infty} u^{\beta-\frac{3}{2}} J_{\frac{|z|}{2}-1}(2\pi
    u) du$.

    ```


    我们考虑两种情况。


    **情况 1：** $k=2$ 且 $\beta < 3$，或 $k=3$ 且 $\beta < 1$。对于较小的 $u > 0$ 值，


    ```

    $|J_{\frac{|z|}{2}-1}(2\pi u)| \leq Cu^{-\frac{k}{2}}$

    ```


    而对于大的 $u$，$J_{\frac{|z|}{2}-1}(2\pi u)| \leq Cu^{-\frac{k}{2}}$（参见 **[23]** 第
    430–433 页）。因此，对于所有的 $z \in \mathbb{R}^k$，$I_1(z) < +\infty$，根据 $k$ 和 $\beta$ 的上述限制，我们得到：


    ```

    $\lim_{|z|\to\infty} \int_{0}^{\infty} u^{\beta-\frac{3}{2}} |J_{\frac{|z|}{2}-1}(2\pi
    u)| du = C < \infty$.

    ```


    因此，


    ```

    $\lim_{|z|\to\infty} I_1(z) = 0$.

    ```


    (A.46)


    **情况 2：** $k=2$ 且 $\beta \geq \frac{3}{2}$或 $k=3$ 且 $\beta \geq 1$。那么，使用 **[23]，附录
    B/8** 开头给出的 $J_u(r)$ 表达式，我们看到：


    ```

    $\lim_{|z|\to\infty} \int_{0}^{\infty} u^{\beta-\frac{3}{2}} |J_{\frac{|z|}{2}-1}(2\pi
    u)| du = \infty$.

    ```


    因此，(A.46) 根据 Bernoulli-Hopital 法则得出。再次使用 Bernoulli-Hopital 法，我们也可以检查对于 $k \in
    \{2,3\}$，


    ```

    $\lim_{|z|\to\infty} I_2(z) = 0$.

    ```


    引理的证明现在完成。


