    ## A. TECHNICAL ESTIMATES of variable $r \rightarrow |z|$


    where we have changed the variable of $r \rightarrow |z|$. Set


    ```

    $I(z) := |z|^{2-\beta} \int_{0}^{\infty} u^{\beta-\frac{3}{2}} \left(\frac{u^2}{\|z|^2}\right)^{\frac{|z|}{2}}
    J_{\frac{|z|}{2}}(2\pi u) du$

    ```


    We want to study the limit as $|z| \to \infty$ of $I(z)$. For this, we write $I(z)
    = I_1(z) + I_2(z)$, with


    ```

    $I_1(z) = |z|^{2-\beta} \int_{0}^{|z|} u^{\beta-\frac{3}{2}} J_{\frac{|z|}{2}-1}(2\pi
    u) du,\n$I_2(z) = |z|^{2-\beta} \int_{|z|}^{\infty} u^{\beta-\frac{3}{2}} J_{\frac{|z|}{2}-1}(2\pi
    u) du$.

    ```


    We consider two cases.


    **Case 1:** $k=2$ and $\beta < 3$ or $k=3$ and $\beta < 1$. For small values of
    $u > 0$,


    ```

    $|J_{\frac{|z|}{2}-1}(2\pi u)| \leq Cu^{-\frac{k}{2}}$

    ```


    while for large $u$, $|J_{\frac{|z|}{2}-1}(2\pi u)| \leq Cu^{-\frac{k}{2}}$ (see
    **[23]** pp. 430–433). Hence, $I_1(z) < +\infty$ for all $z \in \mathbb{R}^k$,
    and with the indicated constraints on $k$ and $\beta$, we obtain


    ```

    $\lim_{|z|\to\infty} \int_{0}^{\infty} u^{\beta-\frac{3}{2}} |J_{\frac{|z|}{2}-1}(2\pi
    u)| du = C < \infty$.

    ```


    Therefore,


    ```

    $\lim_{|z|\to\infty} I_1(z) = 0$.

    ```


    (A.46)


    **Case 2:** $k=2$ and $\beta \geq \frac{3}{2}$ or $k=3$ and $\beta \geq 1$. Then,
    using the expression for $J_u(r)$ given at the beginning of **[23], Appendix B/8**,
    we see that


    ```

    $\lim_{|z|\to\infty} \int_{0}^{\infty} u^{\beta-\frac{3}{2}} |J_{\frac{|z|}{2}-1}(2\pi
    u)| du = \infty$.

    ```


    Therefore, (A.46) follows from the Bernoulli-LHopital rule. Using again the Bernoulli-LHopital
    rule, we can also check that for $k \in \{2,3\}$,


    ```

    $\lim_{|z|\to\infty} I_2(z) = 0$.

    ```


    The proof of the lemma is now complete.


