    最后一个例子涉及波在总和内部的传播。这将是 $d=1, k=3$ 的情况，噪声是“球面平稳”的而非空间平稳的：[8] 对该问题提供了更详细的描述，[13]
    是该方向的一些数学结果。


    最后，考虑阻尼波算子，以及将波算子 $a\frac{\partial^2}{\partial t^2}+b\frac{\partial}{\partial
    t}-c\Delta$ 替换为


    ```


    在这里，参数 $a, b$ 和 $c$ 具有物理意义，例如单位质量、摩擦系数或弹性系数。在各种极限情况下，例如 $a\downarrow0$ 或 $b\downarrow0$，分别对应零质量极限和无摩擦极限，可以得到热算子或波算子（[4]
