    要在《Memoirs》上发表，论文必须是正确的、新颖的、非平庸的且具有重要意义的。此外，它必须编写良好，并对大量数学家具有吸引。碎片化的结果，例如迈向未证明定理的某一步一步，或对已知结果的细微变动，通常是不接受发表的。


