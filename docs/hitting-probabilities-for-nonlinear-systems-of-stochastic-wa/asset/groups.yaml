    \ Malliavin norms ... 47\nA.2. Integrated increments of the covariance function\
    \ ... 56\nA.3. Further bounds on Malliavin norms and inner-products ... 68\n-\
    \ Bibliography ... 73\n\n# Abstract\n\nWe consider a $d$-dimensional random field\
    \ $u = \\{u(t,x)\\}$ that solves a nonlinear system of stochastic wave equations\
    \ in spatial dimensions $k \\in \\{1, 2, 3\\}$, driven by a spatially homogeneous\
    \ Gaussian noise that is white in time. We mainly consider the case where the\
    \ spatial covariance is given by a Riesz kernel with exponent $\\beta$. Using\
    \ Malliavin calculus, we establish upper and lower bounds on the probabilities\
    \ that the random field visits a deterministic subset of $\\mathbb{R}^d$, in terms,\
    \ respectively, of the Hausdorff measure and Newtonian capacity of this set. The\
    \ dimension that appears to be optimal, and shows when $d(2-\\beta) > 2(k+1)$,\
    \ points are polar for $u$. Conversely, in low dimensions $d$, points are not\
    \ polar. There is however an interval in which the question of polarity of points\
    \ remains open.\n\nReceived by the editor May 8, 2012 and in revised form, September\
    \ 2013.\nArticle electronically published on January 22, 2015.\nDOI: http://dx.doi.org/10.1090/memo/1120\n\
    2010 Mathematics Subject Classification. Primary 60H15, 60J45; Secondary 60G15,\
    \ 60H07, 60G60.\n\n**Key words and phrases.** Hitting probabilities, systems of\
    \ stochastic wave equations, spatially homogeneous Gaussian noise, capacity, Hausdorff\
    \ measure.\n\nThe first author was supported by the Swiss National Foundation\
    \ for Scientific Research.\nThe second author was supported by the grants de la\
    \ Generalitat de Catalunya, Ministerio de Ciencia e Innovacion. Robert C. Dalang,\
    \ Institut de Mathématiques, Ecole Fédérale de Lausanne, Switzerland. \nMarta\
    \ Sanz-Solé, Facultat de Matematiques, Universitat de Barcelona. E-mail: marta.sanz@ub.edu.\n\
    \n# 1. Introduction\n\nIn this paper, we consider a $d$-dimensional random field\
    \ $u = (u_1(t,x), \\dots, u_d(t,x))$ that is a solution of $d$-dimensional system\
    \ of stochastic wave equations\n$$(\\frac{\\partial^2}{\\partial t^2} - \\Delta)\
    \ u_i(t,x) = \\sum_{j=1}^d \\int_0^t \\int_{\\mathbb{R}^k} G(t-s,y) \\sigma_{i,j}(u(s,y))\
    \ M^j(ds,dy) + \\int_0^t \\int_{\\mathbb{R}^k} G(t-s,y) b_i(u(s,y)) ds,$$\n$i=1,\\\
    dots,d; (t,x) \\in [0,T] \\times \\mathbb{R}^k, k \\in \\{1, 2, 3\\}$, and $\\\
    Delta$ denotes Laplacian on $\\mathbb{R}^k$. We give several motivations for studying\
    \ this system, a a complete probability space $(\\Omega, \\mathcal{F}, P)$ and\
    \ for any $j \\in \\{1,\\dots,d\\}$, we consider a family of centered Gaussian\
    \ variables $M^j = \\{M^j(\\varphi)\\, \\varphi \\in C_0^{\\infty}(\\mathbb{R}^{1})\\\
    }$. The $M^j$ are independent and the covariance function of each $M^j$ is by\n\
    $$(1.2) \\quad E(M^i(\\varphi)M^j(\\psi)) = \\int_{\\mathbb{R}_+} \\int \\Gamma(dx)\
    \ (\\varphi(s) \\star \\dot{\\psi}(s)) (x),$$\n“\\star” denotes the convolution\
    \ operator in the spatial argument and $\\dot{\\psi}(t,x) = \\psi(t,x)$.\n\nAs\
    \ in [7], formula (1.2) can also be written as\n$$(1.3) \\quad E(M^i(\\varphi)M^j(\\\
    psi)) = \\int_0^{\\infty} \\int \\mu(d\\xi) \\mathcal{F}\\varphi(\\xi) \\mathcal{F}\\\
    psi(\\xi),$$\nwhere $\\mu$ denotes the spectral measure ($\\mu = \\mathcal{F}^{-1}$)\
    \ and $\\mathcal{F}$ denotes the Fourier transform operator on $\\mathbb{R}^k$.\n\
    \nThe system (1.1) is rigorously interpreted as follows:\n$$u_i(t,x) = \\sum_{j=1}^d\
    \ \\int_0^t \\int_{\\mathbb{R}^k} G(t-s,y) \\sigma_{i,j}(u(s,y)) M^j(ds,dy),$$\n\
    $$(1.4) \\quad + \\int_0^t \\int_{\\mathbb{R}^k} G(t-s,y) b_i(u(s,y)) ds,$$\n"
