  - "[PAGE 78]\n\n# A. TECHNICAL ESTIMATES of variable $r \\rightarrow |z|$\n\nwhere\
    \ we have changed the variable of $r \\rightarrow |z|$. Set\n\n```\n$I(z) := |z|^{2-\\\
    beta} \\int_{0}^{\\infty} u^{\beta-\\frac{3}{2}} \\left(\\frac{u^2}{\\|z|^2}\\\
    right)^{\\frac{|z|}{2}} J_{\\frac{|z|}{2}}(2\\pi u) du$\n```\n\nWe want to study\
    \ the limit as $|z| \\to \\infty$ of $I(z)$. For this, we write $I(z) = I_1(z)\
    \ + I_2(z)$, with\n\n```\n$I_1(z) = |z|^{2-\\beta} \\int_{0}^{|z|} u^{\\beta-\\\
    frac{3}{2}} J_{\\frac{|z|}{2}-1}(2\\pi u) du,\\n$I_2(z) = |z|^{2-\\beta} \\int_{|z|}^{\\\
    infty} u^{\\beta-\\frac{3}{2}} J_{\\frac{|z|}{2}-1}(2\\pi u) du$.\n```\n\nWe consider\
    \ two cases.\n**Case 1:** $k=2$ and $\\beta < 3$ or $k=3$ and $\\beta < 1$. For\
    \ small values of $u > 0$,\n\n```\n$|J_{\\frac{|z|}{2}-1}(2\\pi u)| \\leq Cu^{-\\\
    frac{k}{2}}$\n```\n\nwhile for large $u$, $|J_{\\frac{|z|}{2}-1}(2\\pi u)| \\\
    leq Cu^{-\\frac{k}{2}}$ (see **[23]** pp. 430–433). Hence, $I_1(z) < +\\infty$\
    \ for all $z \\in \\mathbb{R}^k$, and with the indicated constraints on $k$ and\
    \ $\\beta$, we obtain\n\n```\n$\\lim_{|z|\\to\\infty} \\int_{0}^{\\infty} u^{\\\
    beta-\\frac{3}{2}} |J_{\\frac{|z|}{2}-1}(2\\pi u)| du = C < \\infty$.\n```\n\n\
    Therefore,\n\n```\n$\\lim_{|z|\\to\\infty} I_1(z) = 0$.\n```\n\n(A.46)\n**Case\
    \ 2:** $k=2$ and $\\beta \\geq \\frac{3}{2}$ or $k=3$ and $\\beta \\geq 1$. Then,\
    \ using the expression for $J_\nu(r)$ given at the beginning of **[23], Appendix\
    \ B/8**, we see that\n\n```\n$\\lim_{|z|\\to\\infty} \\int_{0}^{\\infty} u^{\\\
    beta-\\frac{3}{2}} |J_{\\frac{|z|}{2}-1}(2\\pi u)| du = \\infty$.\n```\n\nTherefore,\
    \ (A.46) follows from the Bernoulli-LHospital rule.\nUsing again the the Bernoulli-LHospital\
    \ rule, we can also check that for $k \\in \\2,3\\}$,\n\n```\n$\\lim_{|z|\\to\\\
    infty} I_2(z) = 0$.\n```\n\nThe proof of the lemma is now complete.\n\nACKNOWLEDGEMENTS.\
    \ The authors are indebted to the *Isaac Newton Institute for Mathematical Sciences*\
    \ for the hospitality and financial support during their visits in Spring 2010,\
    \ on the occasion of the scientific program *Stochastic Partial Differential Equations*.\
    \ The first author is pleased to thank the *University of Barcelona*, and the\
    \ second author thank the *Ecole Polytechnique Fédérale de Lausanne* and their\
    \ *Centre Interfaculaire Bernoulli*, for their hospital-tity and financial support\
    \ during mutual visits during Bernoulli which of part of this work was carried\
    \ out.\n\nRobert C. Dalang, Institut de Mathématiques, Ecole Polytechnique Fédérale,\
    \ Lausanne, CH-1015 Lausanne, Switzerland.\nE-mail: robert.dalang@epfl.ch\nMarta\
    \ Sanz-Solé, Facultat de Matemàtiques, Universitat de Barcelona, Gran Via de les\
    \ Cort Catalanes 585, 08007 Barcelona, Spain.\nE-mail: marta.sanz@ub.edu"
