    We end this introduction by providing several motivations for studying systems
    of wave equations. Recall that the deterministic wave equation is one of the fundamental
    second order PDEs [20]. It arises, via Newton''s equations of motion, as a generic
    model for the propagation of waves (which can be acoustic, electromagnetic, etc.)
    in a homogeneous elastic medium. For instance, a system of three wave equations
    can be used to describe the motion in three dimensional space of an elastic string.
    If this string is "floating" in a fluid, then it will be subject to (random) molecular
