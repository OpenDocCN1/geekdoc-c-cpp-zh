  - '[PAGE 83]


    To be published in the Memoirs, a paper must be correct, new, nontrivial, and
    significant. Further, it must be well written and of interest to a substantial
    number of mathematicians. Piecemeal results, such as an inclusive step toward
    an unproved theorem or a minor variation on a known result, are in general not
    acceptable for publication.


    Papers appearing in Memoirs are generally at least 80 and not more than 200 pages
    in length. Papers less than 80 or more than 200 published pages require the approval
    of the Managing Editor of the Transactions/Memoirs Editorial Board. Published
    pages are the same size as those generated in the style files using AMS-LaTeX
    or AMS-TeX.


    Information on the backlog for this journal can be found on the AMS website from
    http://www.ams.org/memo.


    A Consent to Publish is required before we begin processing your paper. After
    a paper is accepted for the Providence office will send a Consent and Copyright
    Agreement to all authors of the paper. By submitting a paper to the Memoirs, authors
    certify that the results have not been submitted to nor are under consideration
    by another author, conference proceedings, or similar publication.


    # Information for Authors


    Memoirs is an author-prepared publication. Once formatted for print and on-line
    publication, articles will be published as is with the addition of AMS-prepared
    format and matter. Articles are not copyrighted; however, confirmation copy will
    be sent to the authors.


    **Initial submission.** AMS uses Centralized Manuscript Processing for initial
    submissions. Authors should submit a PDF file using the Initial Manuscript Submission
    form from www.ams.org/submission/memo, or send one copy of the manuscript to the
    following: Centralized Manuscript Processing, MEMIRS OF THE AMS, 201 Charles Street,
    Providence RI 02904-2294 USA. If a paper is being copied over the AMS, it indicates
    that it is for USA and include the name of the corresponding author, contact information
    such as email or mailing address, and the name of the appropriate editor to review
    the paper (Editor below).


    The paper must contain a title and an abstract that summarizes the article in
    language suitable for the general field (algebra, analysis, etc.). The title should
    be clear, but informative; useless or vague phrases such as "some remarks" or
    "concerning" should be avoided. The abstract should be at least one complete,
    and no more than 300 words. With included in paper should be the 2010 Mathematics
    Subject Classification the primary and secondary subjects of the article. The
    classifications are accessible at www.ams.org/msc/. The Mathematics Subject Classification
    format describes the subject matter of the article and it. Abbreviations used
    in bibliographies are listed in the Mathematical Reviews annual index. The series
    are also available at www.ams.org/msnhlt/serials.pdf. For help in preparing and
    verifying references, the AMS offers MR Lookup, a Reference Tool at www.ams.org/mrlookup.


    **Electronically prepared manuscripts.** The AMS encourages electronically prepared
    manuscripts, with a strong preference for AMS-LaTeX. To this, the Society has
    prepared AMS-LaTeX packages for each AMS publication. Author packages include
    instructions for preparing electronic manuscripts, samples, and a style file that
    generates the particular design specifications of publication. Through is the
    highly preferred format of LaTeX, author packages are also available in AMS-LaTeX.


    Authors may require an author package for Memoirs of the AMS from www.ams.org/journals/memo/memoauthorpac.html
    or via FTP to ftp.ams.org (login as anonymous, enter your complete email address
    as password, and type cd pub/author-info).'
  - '[PAGE 84]


    AMS Author Handbook and the Instruction Manual are available in PDF format from
    the author package link. The author package can also be obtained free of charge
    by sending email to tech-support@ams.org or from the Publication Division, American
    Mathematical Society, 201 Charles St., Providence, RI 02904-2294, USA. When requesting
    an author package, please ensure that AMSLaTeX and the publication in your paper
    will accept. Please be sure to include your mailing address.


    **After acceptance.** The source files for the final version of the electronic
    manuscript should be sent to the Providence office immediately after the paper
    has been accepted for publication. The author should submit a PDF of the final
    version of the paper to the editor, who will forward a copy to the Providence
    office.


    Accepted electronically prepared files can be submitted via the web at www.ams.org/submit-book-journal/,
    via FTP, or on CD to the Electronic Prepress Department, American Mathematical
    Society, 201 Charles Street, Providence, RI 02904-2294-USA. TEXT source files
    and graphics files can be sent over the Internet by FTP to the Internet node ftp@ams.org
    (13100). When sending a manuscript electronically by CD, please be sure to include
    a message indicating that the paper is for the *Memoirs*.


    **Electronic graphics.** Comprehensive instructions on preparing graphics are
    available at www.ams.org/authors/journals.html. A few of major requirements are
    given here:


    Submit files for graphics (EPS Encapsulated Postscript). This includes graphics
    originated via a graphics application as well as scanned photographs or other
    computer-generated images. If this is not possible, TIFF files are acceptable
    as they can be opened in Adobe Photoshop or Illustrator.


    Authors using graphics packages for the creation of electronic art should avoid
    the use of any lines thinner than 0.5 points in width. Many graphics packages
    allow the user to use a typical laser printer. However, what look acceptable when
    produced on a high-resolution laser typesetter, become nearly invisible and will
    be lost entirely in the final printing.


    Screens should be set to values between 15% and 85%. Screens which fall outside
    of this range are too light or too dark to print correctly. Variations of screens
    within a graphic should be no less than 10%.


    Any graphics in color will be rendered in grayscale for the printed version unless
    color printing is authorized by the Managing Editor and the Publisher. In general,
    color graphics will appear in color in the online version.


    **Inquiries.** Any inquiries concerning a paper that has been accepted for publication
    should be sent to memo-query@ams.org or to the Electronic Prepress Department,
    American Mathematical Society, 201 Charles St., Providence, RI 02904-2294 USA.'
