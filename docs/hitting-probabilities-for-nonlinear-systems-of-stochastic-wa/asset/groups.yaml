    Marta Sanz-Solé，巴塞罗纳大学数学学院。电子邮箱：marta.sanz@ub.edu。


    # 1. 引言


    在本文中，我们考虑 $d$ 维随机场 $u=(u_1(t,x), \dots, u_d(t,x))$，它是 $d$ 维随机波方程组的解：

    $$(\frac{\partial^2}{\partial t^2} - \Delta) u_i(t,x) = \sum_{j=1}^d \int_0^t
    \int_{\mathbb{R}^k} G(t-s,y) \sigma_{i,j}(u(s,y)) M^j(ds,dy) + \int_0^t \int_{\mathbb{R}^k}
    G(t-s,y) b_i(u(s,y)) ds,$$

    $i=1,\dots,d; (t,x) \in [0,T] \times \mathbb{R}^k, k \in \{1, 2, 3\}$，其中 $\Delta$
    表示 $\mathbb{R}^k$ 上的普拉斯拉斯。我们给出研究该系统的动机：一个完全概率空间 $(\Omega, \mathcal{F}, P)$，对于任意
    $j \in \{1,\dots,d\}$，我们考虑一个中心高斯变量族 $M^j = \{M^j(\varphi)\, \varphi \in C_0^{\infty}(\mathbb{R}^{1})\}$。$M^j$
    是独立的，且每个 $M^j$ 的协方函数为：

    $$(1.2) \quad E(M^i(\varphi)M^j(\psi)) = \int_{\mathbb{R}_+} \int \Gamma(dx) (\varphi(s)
    \star \dot{\psi}(s)) (x),$$

    “\star”表示空间参数上的卷积算子，$\dot{\psi}(t,x) = \psi(t,x)$。


    如[7]所示，公式(1.2) 也可以写为：

    $$(1.3) \quad E(M^i(\varphi)M^j(\psi)) = \int_0^{\infty} \int \mu(d\xi) \mathcal{F}\varphi(\xi)
    \mathcal{F}\psi(\xi),$$

    其中 $\mu$ 表示谱测 ($\mu = \mathcal{F}^{-1}$)，$\mathcal{F}$ 表示 $\mathbb{R}^k$ 上的傅叶变换算子。


    方程组1.1) 的严格解释如下：

    $$u_i(t,x) = \sum_{j=1}^d \int_0^t \int_{\mathbb{R}^k} G(t-s,y) \sigma_{i,j}(u(s,y))
    M^j(ds,dy),$$

    $$(1.4) \quad + \int_0^t \int_{\mathbb{R}^k} G(t-s,y) b_i(u(s,y)) ds,$$


