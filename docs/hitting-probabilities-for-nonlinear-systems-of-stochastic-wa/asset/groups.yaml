    # 摘要


    我们考虑一个 $d$ 维随机场 $u=\{u(t,x)\}$，它在空间维度 $k\in\{1,2,3\}$ 上满足非线性随机波方程，由时间白空间均匀噪声驱动。我们主要考虑空间协方差由指数
    $\beta$ 的 Riesz 核给出的情况。利用马尔可夫微积分，我们建立了随机场访问确定子集 $\mathbb{R}^d$ 的概率，分别相对于豪斯多夫测度和牛顿容量。该维度是最优的，并表明当
    $d(2-\beta) > 2(k+1)$ 时，点对于 $u$ 是极点。相反，在低维 $d$ 下，点不是极点。然而，点的极性问题存在一个未解决的区间。


