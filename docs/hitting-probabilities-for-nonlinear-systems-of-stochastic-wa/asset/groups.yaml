    ## CHAPTER 2

    ## Upper bounds on hitting probabilities


    We assume that the covariance measure $\Gamma$ of the Gaussian process governing
    the system (1.4) is absolutely continuous with respect to Lebesgue measure on
    $\mathbb{R}^k$, and we will consider the following set of hypotheses on its density
    $f$:


    - (C1) The covariance measure is of the form $\Gamma(dx) = f(|x|)dx$, where $f(x)
    = |x|^{-\beta}$ with $\beta \in [0, 2 \wedge k]$.

    - (C2) The covariance measure is of the form $\Gamma(dx) = f(|x|)dx$, where $f:
    \mathbb{R}_+ \to \mathbb{R}_+$ satisfies $\int_{0}^{\infty} r^{\eta-1}f(r)dr <
    \infty$, for some $\eta \in [0,1]$.

    - (C3) The spectral measure of the noise satisfies

    $$\int_{\mathbb{R}^k} \frac{\mu(d\xi)}{(1+|xi|^2)^\alpha} < \infty$$

    for some $\alpha \in [0, 1]$.

    - (C3) The covariance measure is of the form $\Gamma(dx)=f(|x|)dx$, where $f(x)=\varphi(x)|x|^{-\beta}$
    if $x \neq 0$, with $\beta \in[0,\wedge k]$ and $\varphi$ is a bounded and positive
    function belonging to $C^\varphi[\mathbb{R}^k]$ (the space of bounded and Hölder-continuous
    functions with exponent $\mu \in[0,1]$).


    Notice that (C1) is satisfied when $\Gamma(dx)=|x|^{-\beta}$, with $\beta \in[0,\wedge
    k]$ and $\alpha \in[\beta/2,1]$. Also, (C2) is satisfied when $f: \mathbb{R}_+
    \to \mathbb{R}_+$ is defined by $f(r)=r^{-\beta}$, with $\beta \in[0,\wedge k]$
    with $\eta < 2-\beta$.


    We have devised to establish the following result:


    THEOREM 2.1. Let $u(t,x), \in [0,T] \times \mathbb{R}^k$ be the stochastic process
    given by the system (1.4) of SPDEs with $k \in\{1,2,3\}$. Let $I$ and $K$ be compact
    subsets of $[0,T]$ and $\mathbb{R}^k$, respectively, with positive Lebesgue measure.


    Consider the following cases:


    - (1) Additive noise: the matrix $\sigma=(\sigma_{ij})_{1\le i,j\le d}$ has constant
    entries and $\sigma \neq 0$; the functions $b_i,1\le i \le d$ are bounded, infinitely
    differentiable with bounded partial derivatives of any order. The covariance measure
    satisfies (C1) or (C1'').

    - (2) Multiplicative noise: the coefficients $\sigma_{ij}$ and $b_i,1\le i,j \le
    d$ satisfy the assumptions (P1) and (P2). For $k=2$, we assume that the covariance
    measure satisfies (C2). For $k \in\{1,3\}$, we assume (C3).


    Fix $\zeta \in[0,d]$. Then there exists a positive constant $c=c(I,K,\Gamma,k,d,\zeta)$
    such that, for any Borel set $A \in \mathbb{R}^d$,


    - (2.1) $P\{u(I \times K) \cap A \neq \emptyset\} \le c cH_{d-\zeta-\frac{k}{2}}(A),
    \quad i=1,2$.


    with the following values of $\delta_i$. In Case (1), under (C1), $\delta_1 =
    \frac{2-\beta}{2}$, and (C1''), $\delta_1 = 1-\alpha$. In Case (2), for $k=1$,
    $\delta_2 = \frac{2-\beta}{2}$, for $k=2$, $\delta_2 = \frac{2}{2}$; and for $k=3$,
    $\delta_2 = \frac{2-\beta}{2} \wedge \frac{1+\mu}{2}$.


    According to Theorem 2.4 of [18], in order to prove Theorem 2.1, we must prove
    two facts.


    - (R1) For any $(t,x) \in \mathcal{T}_0 \times K$, the random vector $u(t,x)$
    has a density $p_{t,x}$, and

    $$(2.2) \sup_{t \in \mathcal{T}_0, (t,x) \in \mathcal{T}_0 \times K} p_{t,x} \le
    C$$

    - (R2) There exists $u \in [0,1]$ and a constant $C$ such that for any $q \in
    [1, \infty$, $s, t \in \mathcal{T}_0$ and $y \in K$.

    $$(2.3) |u(t,x) - u(s,y)|^q \le C(|t-s| + |x-y|)^q.$$


    These two facts imply (2.1) with $\delta_i$ replaced by $\delta$. We note that
    $\zeta$ is arbitrarily small, we will obtain (2.1) with $\delta_i$, provided we
    establish (2.3) for any $\delta < \delta_i$.


    ## 2.1. Bounds on increments


    In this section, we shall prove (R2). The reader will notice that the functions
    $\sigma_{ij}, b_i, 1 \le i, j \le d$ are merely continuous, instead of supposing
    strong assumptions (P1) and (P2).


    ### Case (1): additive noise


    PROPOSITION 2.2. Let $\{u(t,x), (t,x) \in [0,T] \times \mathbb{R}^k\}$, $k \in\{1,2,3\}$,
    be the solution of system of SPDEs defined by (1.4). Under Assumption (C1) (respectively
    (C'')), property (R2) holds with $\delta = \frac{2-\beta}{2}$ (respectively $\delta
    < 1-\alpha$) and therefore, we omit the index $i$.


    PROOF. Without loss of generality, we may assume in this proof that $d=1$ and
    $v(t,x) = \int_0^t \int_{\mathbb{R}^k} G(t-r, x-z)dz$. Fix $q \in [1, \infty)$
    and consider $x \in [0,T]$ and $h > 0$ such that $t+h \in [0,T]$. Then

    $$(2.4) E(u(t,x) - u(t+h,x+y))^q \le C(q)(T_1+T_2),$$

    with

    $$T_1 = E(|v(t,x) - v(t+h,y)|^q),$$

    $$T_2 = E\left(|\int_0^t \int_{\mathbb{R}^k} G(t-r, x-z)b(u(r)) - \int_0^{t+h}
    \int_{\mathbb{R}^k} G(t+h-r, y-z)b(u(r))dz\right).$$


    Since the process $\{v(t,x), (t,x) \in [0,T] \times \mathbb{R}^k\}$ is Gaussian,

    $$T_1 = C(q)E[|v(t,x) - v(t+h,y)|^2]^{q/2}.$$


    Then, by Proposition 4.1 of [18], under (C1), obtain

    $$(2.5) T_1 = C(q)(h + |y|)^{\delta}, \quad \text{with } \delta = \frac{2-\beta}{2},$$

