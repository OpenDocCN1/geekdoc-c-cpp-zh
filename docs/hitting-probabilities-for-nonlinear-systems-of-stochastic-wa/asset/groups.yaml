    \right\}$.

    ```


    Bessel-Riesz 核定义为：


    ```

    $K_\gamma(r) = \begin{cases} r^{\gamma} & \text{if } \gamma > 0, \log(\frac{1}{r})
    & \text{if } \gamma = 0, \frac{1}{r^{\gamma}} & \text{if } \gamma < 0.\end{cases}$

    ```


    其中 $c$ 为正数。对于每一个博尔集 $A \subset \mathbb{R}^d$，令 $\mathcal{P}(A)$ 为 $A$ 上的概率测集。对于
    $\mu \in \mathcal{P}(A)$，我们设定：


    ```

    $\mathcal{E}_\gamma(\mu) = \int_A \int_A K_\gamma(|x - y|) \mu(dx)\mu(dy)$.

    ```


    博尔集 $A \subset \mathbb{R}^d$ 的 Bessel-Riesz 容量定义如下：$Cap_{\gamma}(A) = [\inf_{\mu
    \in \mathcal{P}(A)} \mathcal{E}_\gamma(\mu)]^{-1}$，规定 $1/\infty = 0$。存在一个与空间协方差相关的希尔伯特空间（参见
    (1.3)）。事实上，令 $\mathcal{H}$ 为赋予以下内积的实值测试函数 Schwartz空间 $S(\mathbb{R}^k)$ 的完备：


    ```

    $\langle \varphi, \psi\rangle = \int_{\mathbb{R}^k} \varphi(\xi)\overline{\psi(\xi)}
    d\xi.$

    ```


    我们定义 $\mathcal{H}^d = \{h = (h^1, \dots, h^d) : h^i \in \mathcal{H}, i=1, \dots,
    d\}$,$\mathcal{H}_t = L^2([0,t]; \mathcal{H})$, $t \in [0,t]$。假设 $\varphi \in
    \mathcal{H}$ 是有限变分的符号测度。假设 $\Gamma(x) = |x|^{-\beta}$，其中 $\beta \in [0, 2]$，因此
    $\mu(\xi) = c|\xi|^{-\beta}$（参见 [7]）。那么通过对 $\varphi$ 的正负部分应用 [2] 中的极化方法：


    ```

    $\|\varphi\|_{\mathcal{H}}^2 = \int_{\mathbb{R}^k} |\varphi(\xi)|^2 \frac{d\xi}{|\xi|^{\beta}}$.

    ```


    这一基本等式将出现多次。我们回顾空间维 $k \in \{1, 2, 3\}$ 下波方程基本解的表达式：


    ```

    k=1: G(t,x) = \frac{1}{2}|t-|x|$

    k=2: G(t,x) = \frac{1}{2\pi}(t^2 - |x|^2)^{+\frac{1}{2}},

    k=3: G(t,x) = \frac{1}{4\pi}\sigma_t(dx),$

    ```


    其中 $\sigma_t(dx)$ 表示以原点为中心、半径为 $t$ 的球面上的均匀分布，总质量为 $4\pi t^2$。对于任意维 $k \in \mathbb{N}^*$，$G(t)$
    的傅里叶变换给出：


    $(1.10) \quad \mathcal{F}G(\xi) = |\xi|^{-1} \sin(t|\xi|)$


    读者可以参考 [21] 获取这些公式。在全文中，我们使用符号 $T$ 表示一般的区间 $[t_1, t_2]$，其中 $0 < t_1 < t_2 \leq
    T < \infty$，$O$ 表示 $\mathbb{R}^d$ 的紧子集，$K$ 表示 $\mathbb{R}^k$ 的紧子集。


    我们通过提供研究波方程组的几个动机来结束本引言。记得，确定性波方程是基础二阶偏微分方程之一 [20]。它通过牛顿运动方程，作为均匀弹性介质中波传播（可以是声波、电磁波等）的通用模型而出现。例如，三个波方程组可以用于描述弹性弦在三维空间中的运动。如果这条弦“浮”在流体中，它将受到（随机）分子激发的，由随机噪声驱动的波方程组为弦的运动提供了更详细的描述（这里，$d=3$
