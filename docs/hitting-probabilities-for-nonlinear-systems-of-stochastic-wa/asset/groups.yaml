    ## CHAPTER 3: Conditions on Malliavin eigenvalues for lower bounds


    In this chapter, we consider the system of equations given in (1.4). We restrict
    ourselves to a covariance measure $\Gamma(dx) = |x|^{-\eta}dx, \eta \in [0, 2
    \wedge k]$ (hypothesis C1), $k \in \{1, 2, 3\}$. We recall the definition of (2.11)
    satisfied by the Malliavin derivative of the components $u_i(t,x), i=1, \dots,
    d$, of the random field $u(t,x)$:


    ```

    (3.1) \quad D_{r,j}^k u_i(t,x) = G(t-r,x-z)\sigma_{i,j}(r,z) + a_{i,j}(r,z;t,x)

    ```


    with


    ```

    $$\sum_{l=1}^d \int_{\mathbb{R}^k} G(t-s,x-y)\nabla\sigma_{i,j}(u(s,y)) \cdot
    D_{r,j}^k u(s,y)(ds,dy) + \int_0^t ds \int_{\mathbb{R}^k} dy G(t-s,x-y)\nabla
    b(u(s,y)) \cdot D_{r,j}^k u(s,y).

    ```


    The Malliavin covariance matrix of


    ```

    (3.3) \quad Z := (u_1(s,y), \dots, u_d(s,y), u_1(t,x)-u_1(s,y), \dots, u_d(t,x)-u_d(s,y)),

    ```


    is defined by


    ```

    $$\gamma_Z = \langle DZ, DZ \rangle_{\mathcal{H}^k}.$$

    ```


    As has been proved in [11, Lemma 6.8], there exist least $d$ orthonormal eigenvectors
    $\xi_1, \dots, \xi_d$ of $\gamma_Z$, with corresponding eigenvalues $\alpha_1,
    \dots, \alpha_d \geq \alpha_0$, with $\alpha_0$ strictly positive and deterministic.
    We fix a set $K \subset \{1, \dots, 2d\}$ with card $K=d$ and set


    ```

    (3.4) \quad A_K = \bigcap_{i \in K} \{\alpha_i \geq \alpha_0\}.

    ```


    We term large eigenvalues $\alpha_i$ with $i \in K$.


