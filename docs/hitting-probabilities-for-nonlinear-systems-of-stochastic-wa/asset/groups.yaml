    在开始开始处理您的论文之前，需要一份《出版同意书》。论文被接受后，普罗维登斯办公室将向论文的所有作者发送一份《同意与版权协议》。通过向《Memoirs》提交论文，作者证明这些结果未提交给其他作者、会议论文或类似的出版物，且未在考虑之中。


    **作者须知**


    《Memoirs》是一份由作者准备的出版物。一旦完成打印和在线出版的格式化，文章将按原文发布，并增加由 AMS 准备的内容；然而，确认副本将发送给作者。


    **初次投稿。** AMS 使用集中稿件处理进行初次投稿。作者应使用 www.ams.org/submission/memo 上的初次投稿表单提交 PDF
    文件，或将一份稿件发送至此处：MEMIRS OF THE AMS, 201 Charles Street, Providence, RI 02904-2294
    USA。如果论文被复制，AMS 指明其用途并包含通讯作者的姓名、联系方式（如电子邮件或邮寄地址）以及审阅该论文的相应编辑姓名（见下文）。


    论文必须包含一个标题和一个摘要，摘要用适合通用领域（代数、分析等）的语言总结文章。标题应当清晰且具有信息量；应避免使用诸如“一些备注”或“关于”之类的模糊短语。摘要应至少包含一个完整的句子，且不超过
    300 字。数学学科分类描述了文章的主题和次要主题，可以在 www.ams.org/msc/ 获取。参考文献中使用的缩写词列在《数学评论》年度索引中。如需准备和验证参考文献的帮助，AMS
    在 www.ams.org/mrlookup 提供了参考工具。


    **电子制版稿件。** AMS 鼓励使用电子制版稿件，并强烈优先使用 AMS-LaTeX。为此，学会为每种出版物准备了 AMS-LaTeX 软件包。作者包包含了准备电子稿件的说明、示例以及生成出版物特定设计的样式文件。作者可以从
    www.ams.org/journals/memo 或通过 FTP 到 ftp.ams.org 获取《Memoirs of the AMS》作者包（以匿名登录，输入您的完整电子邮件地址作为密码，并输入
    cd/author-info）。


    AMS 作者手册和操作说明书可以通过作者链接以 PDF 格式获取。作者包也可以通过向 tech-support@ams.org 发送电子邮件免费获取，或从美国数学学会出版部（201
    Charles St., Providence, RI 02904-2294）获取。在请求作者包时，请确保 AMS-LaTeX 和您论文中的出版物是能够被接受的。


    **接受后。** 论文被接受出版后，电子稿件最终版本的源文件应立即发送至普罗维登斯办公室。作者应向编辑提交论文最终版本的 PDF，编辑将把副本转发给普罗维登斯办公室。


    接受的电子制版文件可以通过网站 www.ams.org/submit-journal/、通过 FTP 或通过光盘 提交给美国数学学会电子预印部门（201 Charles
    Street, Providence, RI 02904-2294-USA）。TEXT 源文件和图形文件可以通过互联网通过 FTP 发送到互联网节点 ftp@ams.org
    (13100)。通过光盘发送电子稿件时，请务必包含一条消息，表明论文是用于 *Memoirs* 的。


    **电子图形。** 关于准备图形的详细说明可以在 www.ams.org/authors/journals.html 获取。这里给出几个主要要求：


    - 提交图形文件（EPS 封装式后脚本）。这包括通过图形应用程序生成的图形，以及扫描的照片或其他计算机生成的图像。如果无法实现，TIFF 文件也是接受的，因为它们可以在
    Adobe Photoshop 或 Illustrator 中打开。


    - 使用图形包创建电子艺术作品的作者应避免使用任何宽度小于 0.5 点的线条。许多图形包允许用户使用典型的激光打印机。然而，在高分辨率激光排字机上看起来尚可接受的内容，在最终打印时将变得几乎不可见并完全丢失。


    - 灰网点应设置为在 15% 到 85% 之间的值。超出此范围的网点太亮或太暗，无法正确打印。图形内部网点的变化不应小于 10%。


    - 任何彩色图形在印刷版中将渲染为灰度模式，除非执行编辑和出版者授权彩色打印。通常情况下，彩色图形将在在线版本中彩色显示。

