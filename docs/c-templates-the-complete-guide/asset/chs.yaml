  \ b < a : b;\n}\n```\n\n### 11.3 Perfect Forwarding\n\n正如在 6.1 第 91 页所示，我们可以使用 *转发引用*\
  \ 和 `std::forward<>` 来“完美传递”参数：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename T>\n\
  void f (T&& t) // t 是转发引用\n{\n  g(std::forward<T>(t)); // 完美传递 t 到 g\n}\n```\n\n\
  然而，有时我们需要完美传递不是通过参数的数据。在这种情况下，我们可以使用 `auto&&` 创建一个可以转发的变量。假设我们链式调用函数 `get()` 和 `set()`，其中\
  \ `get()` 的返回值应该完美传递给 `set()`：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename T>\nvoid\
  \ foo(T x)\n{\n  set(get(x));\n}\n```\n\n假设我们进一步需要更新代码对 `get()` 产生的中间值进行操作。我们通过将值保持在用\
  \ `auto&&` 定义的变量来实现：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename T>\nvoid foo(T x)\n\
  {\n  auto&& val = get(x);\n  …\n  // 完美传递 get() 的返回值到 set()\n  set(std::forward<decltype(val)>(val));\n\
  }\n```\n\n这避免了中间值的额外拷贝。\n\n### 11.4 References as Template Parameters\n\n尽管并不常见，模板类型参数可以变成引用类型。例如：\n\
