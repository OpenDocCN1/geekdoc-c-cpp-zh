  \ 等同于\n\n点击此处查看代码图像\n\n```cpp\nfor (std::size_t idx = 0; idx<y.size(); ++idx) {\n\
  \    x[idx] = (1.2*x[idx]) + (x[idx]);\n}\n```\n\n（注：由于用户提供的输入文本存在严重的物理重复，此处仅翻译不重复的核心逻辑部分以符合指令要求。）\n\
  \n\n\n表达式模板（Expression templates）是由 Todd Veldhuizen 和 David Vandevoorde 独立开发的（该术语由\
  \ Todd 提出的），当时成员模板还不是 C++ 编程语言的一部分（而且在当时看来，它们似乎永远不会被添加到 C++ 中）。这在实现赋值运算符时导致了一些问题：赋值运算符无法为表达式模板进行参数化。解决这一问题的一种技术是在表达式模板中引入一个转换运算符，转换为一个\
  \ `Copier` 类，该类对表达式模板进行参数化，但继承自一个仅对元素类型参数化的基类。该基类随后提供了一个（虚的）`copy_to` 接口，赋值运算符可以引用该接口。\n\
  \n以下是该机制的草图（使用了本章中的模板名称）：\n\n点击此处查看代码图片\n\n```cpp\ntemplate<typename T>\nclass CopierInterface\
  \ {\n  public:\n    virtual void copy_to(Array<T, SArray<T>>&) const;\n};\n\ntemplate<typename\
  \ T, typename X>\nclass Copier : public CopierInterface<T> {\n  public:\n    Copier(X\
  \ const& x) : expr(x) {\n    }\n    virtual void copy_to(Array<T, SArray<T>>&) const\
  \ {\n        // implementation of assignment loop*\n        …\n    }\n  private:\n\
  \    X const& expr;\n};  \n\ntemplate<typename T, typename Rep = SArray<T>>\nclass\
  \ Array {\n  public:\n    // delegated assignment operator*\n    Array<T, Rep>&\
  \ operator=(CopierInterface<T> const& b) {\n        b.copy_to(rep);\n    };\n  \
  \  …\n};\n\ntemplate<typename T, typename A1, typename A2>\nclass A_mult {\n  public:\n\
  \    operator Copier<T, A_Mult<T, A1, A2>>();\n    …\n};\n```\n\n这为表达式模板增加了另一层复杂度以及一些额外的运行时开销，但尽管如此，其产生的性能收益在当时是非常令人印象深刻的。\n\
  \nC++ 标准库包含一个类模板 `valarray`，旨在用于那些能够证明本章所开发的 `Array` 模板所用技术价值的应用程序。`valarray` 的一个前身的设计初衷是，让针对科学计算市场的编译器识别出数组类型，并使用高度优化的内部代码来执行操作。此类编译器将在某种意义上“理解”这些类型。然而，这种情况从未发生过（部分原因是相关市场相对较小，另一部分原因是随着\
  \ `valarray` 变成模板，问题的复杂性随之增加）。在表达式模板技术被发现后的一段时间，我们其中一人（Vandevoorde）向 C++ 委员会提交了一项提案，将\
  \ `valarray` 本质上转变为我们开发的 `Array` 模板（带有许多受现有 `valarray` 功能启发的额外特性）。该提案代表了 `Rep` 参数概念首次记录于文档。在此之前，具有实际存储的数组和表达式模板伪数组是不同的模板。当客户端代码引入一个接受数组的函数\
  \ `foo()` 时——例如：\n\n点击此处查看代码图片\n\n```cpp\ndouble foo(Array<double> const&);\n```\n\
  \n调用 `foo(1.2*x)` 会迫使表达式模板转换为具有实际存储的数组，即使应用于该参数的操作并不需要临时变量。通过将表达式模板嵌入 `Rep` 参数中，反而可以声明：\n\
  \n点击此处查看代码图片\n\n```cpp\ntemplate<typename Rep>\ndouble foo(Array<double, Rep> const&);\n\
  ```\n\n并且除非实际上需要，否则不会发生任何转换。\n\n`valarray` 提案在 C++ 标准化过程的后期提交，并几乎重写了标准中所有关于 `valarray`\
  \ 的文本。结果是它被拒绝了，取而代之的是现有文本中添加了一些微调，以允许基于表达式模板的实现。然而，对这种许可的利用仍然比这里讨论的要困难得多。在写作此时，尚不清楚此类实现，且通常而言，标准的\
  \ `valarray` 在执行其设计目标的操作时效率非常低。\n\n最后，在这里值得注意的是，本章介绍的许多先驱技术，以及后来广为人知的 STL，^(2)最初都是在同一个编译器上实现的：Borland\
  \ C++ 编译器的 4 版本。这也许是第一个让模板编程在 C++ 编程社区广泛普及的编译器。\n\n表达式模板最初主要应用于数组类类型的操作。然而，几年后，人们发现了新的应用。其中最具突破性的\
  \ Jaakko Järvi 和 Gary Powell 的 Boost.Lambda 库，它在 lambda 表达式成为核心功能之前就提供了可用的 lambdaset；以及\
  \ Eric Niebler 的 Boost.Proto 库，这是一个用于表达式模板进行元编程的库，目标是在 C++ 中创建*嵌入式领域特定语言*。其他 Boost\
  \ 库，如 Boost.Fusion 和 Boost.Hana，也对表达式模板进行了高级使用。\n\n\n\n\n当发生模板错误时，问题通常在长长的实例化链之后才被发现，导致冗长的错误信息，正如第\
  \ 9.4 节第 143 页（见脚注 1）所讨论的那样。为了说明这一点，考虑以下略为刻意的代码：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename\
  \ T>\nvoid clear (T& p)\n{\n  *p = 0;  // 假设 T 是指针类的类型\n}\n\ntemplate<typename T>\n\
  void core (T& p)\n{\n  clear(p);\n}\n\ntemplate<typename T>\nvoid middle (typename\
  \ T::Index p)\n{\n  core(p);\n}\n\ntemplate<typename T>\nvoid shell (T const& env)\n\
  {\n  typename T::Index i;\n  middle<T>(i);\n}\n```\n\n这个示例说明了软件开发的典型分层结构：高层函数模板（如\
  \ `shell()`）依赖于 `middle()` 等组件，而这些组件又使用了像 `core()` 这样的基础。当我们实例化 `shell()` 时，它底下的所有层也都需要被实例化。在这个示例中，最深层揭示了一个问题：`core()`\
  \ 使用 `int` 类型进行实例化（因为在 `middle()` 中使用了 `Client::Index`），并尝试对该类型的值进行解引用，这是一个错误。\n\
  \n该错误只有在实例化时才能检测到。例如：\n\n点击此处查看代码图像\n\n```cpp\nclass Client\n{\n  public:\n    using\
  \ Index = int;\n};\n\nint main()\n{\n  Client mainClient;\n  shell(mainClient);\n\
  }\n```\n\n一个良好的通用诊断应该包含导致问题的所有层级的追踪，但我们观察到，这么多信息可能会显得非常臃肿。\n\n关于围绕这一问题的核心思想的精彩讨论，可以在\
  \ [*StroustrupDnE*] 中找到，其中 Bjarne Stroustrup 识别了两种更早判断模板参数是否满足一组约束的方法：通过语言扩展或通过更早使用参数。我们在第\
  \ 17.8 节第 361 页和 附录 E 中涵盖了前者。后一种方案是强制触发浅层实例化中的任何错误。这通过插入未使用的代码来实现，这些代码唯一的目的是是：当使用不满足深层模板要求的模板参数对其进行实例化时，触发错误。\n\
  \n在我们之前的示例中，我们可以在 `shell()` 中添加代码，尝试对 `T::Index` 类型的值进行解引用。例如：\n\n点击此处查看代码图像\n\n\
  ```cpp\ntemplate<typename T>\nvoid ignore(T const&)\n{\n}\n\ntemplate<typename T>\n\
  void shell (T const& env)\n{\n  class ShallowChecks\n  {\n    void deref(typename\
  \ T::Index ptr) {\n      ignore(*ptr);\n    }\n  };\n  typename T::Index i;\n  middle(i);\n\
  }\n```\n\n如果 `T` 是一个使得 `T::Index` 无法解引用的类型，现在会在局部类 `ShallowChecks` 上诊断出错误。注意，由于局部类并没有被实际使用，添加的代码不会影响\
  \ `shell()` 函数的运行时间。遗憾的是，许多编译器会警告 `ShallowChecks` 未被使用（其成员也是如此）。可以使用使用 `ignore()`\
  \ 模板等技巧来抑制此类警告，但它们增加了代码的复杂性。\n\n### 概念检查\n\n显然，我们示例中虚位代码的开发可能会变得与实现模板实际功能的代码一样复杂。为了控制这种复杂性，尝试在某种库中收集各种虚位代码片段是自然而。例如，这样的库可以包含宏，这些宏在模板参数替换违反了该特定参数的基础的概念时，展开为触发相应错误的代码。最流行的此类库是\
  \ *Concept Check Library*（概念检查库），它是 Boost 分发的一部分（参见 [*BCCL*]）。\n\n遗憾的是，这种技术并不特别可移植（诊断错误的方法在不同编译器之间差异很大），而且有时会掩盖在更高层次无法捕捉的问题。\n\
  \n一旦我们在 C++ 中拥有了*概念*（见见 附录 E），我们就有其他方法来支持需求和预期行为定义。\n\n### 28.2 静态断言\n\n`assert()`\
  \ 宏经常用于 C++ 代码，以检查程序执行过程中某一点特定条件是否成立。如果断言失败，程序将（带有噪音地）停止，以便程序员可以修复问题。\n\nC++ `static_assert`\
  \ 关键字随 C++11 引入，具有相同的目的，但在编译时求值：如果条件（必须是常量表达式）求值为 `false`，编译器将发布一个错误。该错误信息将包含一个字符串，告知程序员发生了什么错误。例如，下面的静态断言确保我们是在\
  \ 64 位系统上编译的：\n\n[content]\n```cpp\nstatic_assert(sizeof(void*) == 64, \"Not64-bit\"\
  );\n```\n\n静态断言可以在模板参数不满足模板约束时提供有用的错误信息。例如，使用第 19.4 节第 416 页描述的技巧，我们可以创建一个判断类型是否可解引用的类型特征：\n\
  \n[content]\n```cpp\n#include <utility>\n#include <type_traits>\n\ntemplate<typename\
  \ T>\nclass HasDereference {\n  private:\n    template<typename U> struct Identity;\n\
  \    template<typename U> static std::true_type test(std::declval<U>()());\n   \
  \ template<typename U> static std::false_type test(...);\n  public:\n    static\
  \ constexpr bool value = decltype(test<T>(nullptr))::value;\n};\n```\n\n现在我们可以在\
  \ `shell()` 中引入静态断言，当 `shell()` 模板用不可引用的类型实例化时提供更好的诊断：\n\n[content]\n```cpp\ntemplate<typename\
  \ T>\nvoid shell (T const& env)\n{\n  static_assert(HasDereference<T>::value, \"\
  T is not dereferable\");\n  typename T::Index i;\n  middle(i);\n}\n```\n\n通过这一更改，编译器会产生一个显著更简洁的诊断，指示类型\
  \ `T` 不可解引用。\n\n静态断言可以提高在使用模板库时的体验，使错误信息更短、更直接。\n\n注意，你也可以将它们应用于类模板，并使用 附录 D 中讨论的所有类型特征：\n\
  \n[content]\n```cpp\ntemplate<typename T>\nclass C {\n  static_assert(HasDereference<T>::value,\
  \ \"T is not dereferable\");\n  static_assert(std::is_default_constructible<T>::value,\
  \ \"T is not default constructible\");\n  …\n};\n```\n\n### 28.3 原型\n\n在编写模板时，要确保模板定义对于任何满足指定约束的模板参数都是通过的具有挑战。考虑一个简单的在数组内查找值的\
  \ `find()` 算法，以及其文档化的约束：\n\n```cpp\n// T 必须是相等可比较的（EqualityComparable），\n// 即两个类型\
  \ T 的对象可以使用 == 进行比较，并且结果可以转换为 bool\ntemplate<typename T>\nint find(T const* array,\
  \ int n, T const& value);\n```\n\n我们可以想象该函数模板的以下直观实现：\n\n\n\n\n\n点击此处查看代码图像\n\n\
  ```cpp\ntemplate<typename T>\n\nint find(T const* array, int n, T const& value)\
  \ {\n  int i = 0;\n  while(i != n && array[i] != value)\n    ++i;\n  return i;\n\
  }\n```\n\n这个模板定义存在两个问题，当给定某些*技术上*满足模板要求、但行为与模板作者预期略有不同的模板参数时，这两个问题都将表现为编译错误。我们将使用“*原型*（*archetypes*）的概念来测试我们的实现中对模板参数的使用是否符合\
  \ `find()` 模板所指定的规范。\n\n原型是用户定义的类，可以作为模板参数使用，用以测试模板定义是否遵循了其对相应模板参数所施加的约束。原型是经过专门设计的，旨在以尽可能简单的方式满足模板的要求，而不提供任何多余的操作。如果使用原型作为模板参数实例化模板定义能够成功，那么我们就知道该模板定义没有尝试使用任何模板未显式要求的操作。\n\
  \n例如，这里有一个原型旨在满足我们 `find()` 算法文档描述的 `EqualityComparable` 概念的要求：\n\n点击此处查看代码图像\n\n\
  ```cpp\nclass EqualityComparableArchetype\n{\n\n};\n\nclass ConvertibleToBoolArchetype\n\
  {\n  public:\n    operator bool() const;\n};\n\nConvertibleToBoolArchetype\noperator==(EqualityComparableArchetype\
  \ const&,\n            EqualityComparableArchetype const&);\n```\n\n`EqualityComparableArchetype`\
  \ 没有成员函数或数据，提供的唯一操作是重载的 `operator==`，以满足 `find()` 的等性要求。该 `operator==` 本身也非常简单，返回另一个原型\
  \ `ConvertibleToBoolArchetype`，该原型唯一定义的操作是用户定义的转换到 `bool`。\n\n`EqualityComparableArchetype`\
  \ 显然满足 `find()` 模板陈述的要求，因此我们可以尝试用 `EqualityComparableArchetype` 实例化 `find()`，检查\
  \ `find()` 的实现是否履行了它的合约：\n\n点击此处查看代码图像\n\n```cpp\ntemplate int find(EqualityComparableArchetype\
  \ const*, int,\n                  EqualityComparableArchetype const&);\n```\n\n\
  实例化 `find<EqualityComparableArchetype>` 将失败，这表明我们发现了第一个问题：`EqualityComparable` 的描述只需要\
  \ `==`，但 `find()` 的实现依赖于使用 `!=` 比较 `T` 对象。我们的实现对于大多数成对实现 `==` 和 `!=` 的用户定义类型来说可以工作，但实际上是错误的。原型的目的是在模板库开发的早期阶段发现此类问题。\n\
  \n将 `find()` 的实现更改为使用等性而非不等性解决了这第一个问题，并且 `find()` 模板将与该原型成功编译：^(2)\n\n点击此处查看代码图像\n\
  \n```cpp\ntemplate<typename T>\n\nint find(T const* array, int n, T const& value)\
  \ {\n  int i = 0;\n  while(i != n && !(array[i] == value))\n    ++i;\n  return i;\n\
  }\n```\n\n使用原型发现 `find()` 中的第二个问题需要更多的技巧。请注意，新的 `find()` 定义现在直接将 `!` 运算符作用于 `==`\
  \ 的结果。在我们的原型情况下，这依赖于用户定义的到 `bool` 的转换以及内置的逻辑取反运算符 `operator!`。对 `ConvertibleToBoolArchetype`\
  \ 进行更仔细的实现可以“投毒” `operator!`，使其无法被不当使用：\n\n点击此处查看代码图像\n\n```cpp\nclass ConvertibleToBoolArchetype\n\
  {\n  public:\n    operator bool() const;\n    bool operator!() = delete; // 逻辑取反并非显式要求\n\
  };\n```\n\n我们可以进一步扩展这个原型，使用已删除的函数^(3) 来同样“投毒”运算符 `&&` 和 `||`，以帮助发现其他模板定义中的问题。通常情况下，模板实现者会为模板库中识别的每个概念开发一个原型，然后使用这些原型测试每个模板定义是否符合其陈述的要求。\n\
  \n### 28.4 追踪器（Tracers）\n\n到目前，我们讨论了包含模板的程序在编译或链接时出现的错误。然而，确保程序在运行时行为正确的最挑战性任务往往在成功构建*之后*出现。模板有时会让这项任务稍微困难，因为由模板表示的通用代码的行为取决于该模板的客户端（这比普通类和函数复杂得多）。追踪器是一种软件设备，可以通过在开发早期检测问题来缓解这方面的调试工作。\n\
  \n追踪器是一个用户定义的类，可以作为模板的参数进行测试。通常，追踪器也是一种原型，仅为了满足模板的要求而编写。更重要的是，追踪器应该生成调用在其上的操作的*轨迹*（*trace*）。这允许我们验证算法的效率以及操作顺序。\n\
  \n这是一个可能用于测试排序算法的追踪器示例：^(4) 点击此处查看代码图像\n\n```cpp\n#include <iostream>\nclass SortTracer\
  \ {\n  private: \n    int value; // 要排序的值\n    int generation; // 此追踪器的代数\n    inline\
  \ static long n_created = 0; // 构造函数调用次数\n    inline static long n_destroyed = 0;\
  \ // 析构函数调用次数\n    inline static long n_assigned = 0; // 赋值次数\n    inline static\
  \ long n_compared = 0; // 比较次数\n    inline static long n_max_live = 0; // 最大现有对象数量\n\
  \    // 重新计算现有对象的数量\n    static void update_max_live() {\n      if (n_created-n_destroyed\
  \ > n_max_live) {\n        n_max_live = n_created-n_destroyed;\n      }\n    }\n\
  \  public:\n    static long creations() {\n      return n_created;\n    }\n    static\
  \ long destructions() {\n      return n_destroyed;\n    }\n    static long assignments()\
  \ {\n      return n_assigned;\n    }\n    static long comparisons() {\n      return\
  \ n_compared;\n    }\n    static long max_live() {\n      return n_max_live;\n \
  \   }  \n  public:\n    // 构造函数\n    SortTracer (int v = 0) : value(v), generation(1)\
  \ {\n      ++n_created;\n      update_max_live();\n      std::cerr << \"SortTracer\
  \ #\" << n_created\n              << \", created generation \" << generation\n \
  \             << \" (total: \" << n_created - n_destroyed\n              << \")\\\
  n\";\n    }\n    // 拷贝构造函数\n    SortTracer (SortTracer const& b)\n      : value(b.value),\
  \ generation(b.generation+1) {\n      ++n_created;\n      update_max_live();\n \
  \     std::cerr << \"SortTracer #\" << n_created\n              << \", copied as\
  \ generation \" << generation\n              << \" (total: \" << n_created - n_destroyed\n\
  \              << \")\\n\";\n    }\n    // 析构函数\n    ~SortTracer() {\n      ++n_destroyed;\n\
  \      update_max_live();\n      std::cerr << \"SortTracer generation \" << generation\n\
  \              << \" destroyed (total: \" << n_created - n_destroyed\n         \
  \     << \")\\n\";\n    }\n    // 赋值\n    SortTracer& operator= (SortTracer const&\
  \ b) {\n      ++n_assigned;\n    }\n};\n```\n\n\n\n\n\n```cpp\n        std::cerr\
  \ << \"SortTracer assignment #\" << n_assigned\n                  << \" (generation\
  \ \" << generation\n                  << \" = \" << b.generation\n             \
  \     << \")\\n\";\n        value = b.value;\n        return *this;\n    }\n\n \
  \   // comparison\n    friend bool operator < (SortTracer const& a,\n          \
  \                  SortTracer const& b) {\n        ++n_compared;\n        std::cerr\
  \ << \"SortTracer comparison #\" << n_compared\n                  << \" (generation\
  \ \" << a.generation\n                  << \" < \" << b.generation\n           \
  \       << \")\\n\";\n        return a.value < b.value;\n    }\n\n    int val()\
  \ const {\n        return value;\n    }\n};\n```\n\n除了用于排序的数值 `value` 之外，追踪器还提供了几个成员来追踪实际的排序过程：对于每个对象，`generation`\
  \ 追踪它距离原始对象经过了次拷贝操作。也就是说，原始对象的 `generation == 1`，原始对象的直接拷贝 `generation == 2`，拷贝的拷贝则\
  \ `generation == 3`，以此类推。其他静态成员则追踪创建次数（构造函数调用）、销毁次数、赋值比较次数以及曾经存在过的对象数量。\n\n这种特定的追踪器允许我们跟踪实体创建和销毁的模式，以及给定模板执行的赋值和比较操作。下面的测试程序演示了如何应用于\
  \ C++ 标准库的 `std::sort()` 算法：\n\n点击此处查看代码图像\n\n`debugging/tracertest.cpp`\n\n```cpp\n\
  #include <iostream>\n#include <algorithm>\n#include \"tracer.hpp\"\n\nint main()\n\
  {\n    // 准备示例输入:\n    SortTracer input[] = { 7, 3, 5, 6, 4, 2, 0, 1, 9, 8 };\n\
  \    // 打印初始值:\n    for (int i=0; i<10; ++i) {\n        std::cerr << input[i].val()\
  \ << ' ';\n    }\n    std::cerr << '\\n';\n    // 记录初始状态:\n    long created_at_start\
  \ = SortTracer::creations();\n    long max_live_at_start = SortTracer::max_live();\n\
  \    long assigned_at_start = SortTracer::assignments();\n    long compared_at_start\
  \ = SortTracer::comparisons();\n    // 执行算法:\n    std::cerr << \"---[ Start std::sort()\
  \ ]--------------------\\n\";\n    std::sort<>(&input[0], &input[9]+1);\n    std::cerr\
  \ << \"---[ End std::sort() ]----------------------\\n\";\n    // 验证结果:\n    for\
  \ (int i=0; i<10; ++i) {\n        std::cerr << input[i].val() << ' ';\n    }\n \
  \   std::cerr << \"\\n\";\n    // 最终报告:\n    std::cerr << \"std::sort() of 10 SortTracer’s\"\
  \n              << \" was performed by:\\n\"\n              << SortTracer::creations()\
  \ - created_at_start << \" temporary tracers\\n\"\n              << \"up to \" <<\
  \ SortTracer::max_live() - max_live_at_start << \" tracers at the same time (\"\
  \ << max_live_at_start << \" before)\\n\"\n              << SortTracer::assignments()\
  \ - assigned_at_start << \" assignments\\n\"\n              << SortTracer::comparisons()\
  \ - compared_at_start << \" comparisons\\n\";\n}\n```\n\n运行此程序会产生大量的输出，但从最终报告中可以得出许多结论。对于\
  \ `std::sort()` 函数的一种实现，我们发现了以下结果：点击此处查看代码图像\n\nstd::sort() of 10 SortTracer’s was\
  \ performed by:\n9 temporary tracers\nup to 11 tracers at the same time (10 before)\n\
  33 assignments\n27 comparisons\n\n例如，我们看到尽管在程序中创建了 `9` 个临时追踪器，但在任何时刻最多只有两个额外的追踪器存在。\n\
  \n因此，我们的追踪器承担了两个角色：它证明了标准的 `sort()` 算法的功能并不比我们的追踪器多（例如，不需要 `==` 和 `>`），并且让我们对算法的代价有了直观感受。然而，它并没有关于排序模板的正确性提供太多信息。\n\
  \n### 28.5 预言 (Oracles)\n\n追踪器相对简单有效，但它们仅允许我们针对特定的输入数据和相关功能的特定行为来追踪模板的执行。我们可能会想，为了让排序算法有意义（或正确），比较运算符必须满足什么条件，但在我们的示例中，我们只测试了一个行为与整数小于号完全一致的比较运算符。\n\
  \n追踪器的扩展形式在某些领域被称为 `oracles`（预言，或称运行时分析预言）。它们是连接到 `inference engine`（推理引擎）的追踪器——该程序可以记住断言以及关于的理由，以推断出某些结论。\n\
  \n在某些情况下，预言允许我们动态地验证模板算法，而无需完全指定替换的模板参数（预言即参数）或输入数据（当推理引擎卡住时，它可能会请求某种输入假设）。然而，可以通过这种方式分析的算法复杂性仍然有限（受推理引擎的限制），而且工作量巨大。由于这些原因，我们没有深入探讨预言的发展，但感兴趣的读者应该查看后记中提到的文献及其包含的参考文献。\n\
  \n### 28.6 后记\n\n通过在高级模板中添加哑代码来改进 C++ 编译器诊断的一种相当系统的尝试，可以在 Jeremy Siek 的 `Concept\
  \ Check Library`（参见 `BCCL`）。它是 Boost 库的一部分（参见 `Boost`）。\n\nRobert Klarer 和 John\
  \ Maddock 提出了 `static_assert` 特性以帮助程序员在编译时检查条件。它是后来 C++11 加入的早期特性之一。在此之前，它通常通过库或宏来实现，方法类似于第\
  \ 28.1 节第 652 页描述的技术。Boost.StaticAssert 库就是这样一种实现。\n\n`MELAS` 系统为 C++ 标准库的某些提供了预言，允许对其某些算法进行验证。该系统在\
  \ `MusserWangDynaVeri`.⁵ 中有所讨论。\n\n¹ 既然你已经读到了这本书的这里，无疑遇到过让那个初始示例看起来非常温和的错误信息！\n\n\
  ²\n⁵\n\n\n\n\n\n在实践中，我们通过向文件中填充“代码”来编写 C++ 程序。然而，在 ODR（单一定义规则）的背景下，由文件设定的边界并不重要。相反，重要的是*翻译单元*（translation\
  \ units）。本质上，一个翻译单元是对传递给编译器的文件应用预处理器后的结果。预处理器会丢弃未被条件编译指令（如 `#if`、`#ifdef` 等）选中的代码段，删除注释，递归地插入\
  \ `#include` 的文件，并展开宏。\n\n因此，从 ODR 而言，拥有以下两个文件\n\n点击此处查看代码图像\n\n```cpp\n//* ══ header.hpp:\n\
  \n#ifdef DO_DEBUG\n\n  #define debug(x) std::cout << x << ’\\n’\n\n#else\n\n  #define\
  \ debug(x)\n#endif\n\nvoid debugInit();\n```\n\n```cpp\n// ══ myprog.cpp:\n\n#include\
  \ \"header.hpp\"\n\nint main()\n{\n    debugInit();\n    debug(\"main()\");\n}\n\
  ```\n\n等同于以下单个文件：\n\n```cpp\n// ══ myprog.cpp:\n\nvoid debugInit();\n\nint main()\n\
  {\n    debugInit();\n}\n```\n\n跨越翻译单元边界的连接是通过在两个翻译单元中具有外部链接（external linkage）的对应声明建立的（例如，全局函数\
  \ `debugInit()` 的两个声明）。\n\n注意，翻译单元的概念比简单的“预处理后的文件”要抽象一点。例如，如果我们向编译器重复传递两次预处理后的文件以形成单个程序，它将会在程序中引入两个不同的翻译单元（尽管这样做没有意义）。\n\
  \n### A.2 声明与定义\n\n在常见的“程序员术语”中，*声明*（declaration）和*定义*（definition）这两个词经常通用。然而，在\
  \ ODR 的背景下，这些词的准确含义非常重要。(1)\n\n声明是一种 C++ 构造结构，它（通常）在程序中引入或重新引入一个名称。声明也可以是定义，取决于它引入了什么实体以及如何引入的：\n\
  \n- **命名空间和命名空间别名：** 命名空间及其别名的声明始终同时也是定义，尽管在这种语境下使用*定义*一词并不寻常，因为命名空间的成员列表可以在以后进行“扩展”（这与类和枚举类型不同）。\n\
  - **类、类模板、函数、函数模板、成员函数和成员函数模板：** 且且仅当声明包含了与该名称相关的大括号体时，声明才是定义。此规则包括联合体、运算符、成员运算符、静态成员函数、构造函数和析构函数，以及此类内容的模板版本的显式特化（即任何类类的或函数类的实体）。\n\
  - **枚举：** 且且仅当它包含大括号括的枚举值列表时，声明才是定义。\n- **局部变量和非静态数据成员：** 这些实体始终可以被视为定义，尽管这种区别并不重要。注意，函数定义中函数参数的声明本身是一个定义，因为它表示了一个局部变量；但在非定义的函数声明中，函数参数则不是定义。\n\
  - **全局变量：** 如果声明没有直接紧跟在关键字 `extern` 之后，或者它具有初始化值，则全局变量的声明也是该变量的定义。否则，它不是定义。\n- **静态数据成员：**\
  \ 且且仅当它出现在其所属的类或类模板之外，或者它在类或类模板中被声明为 `inline` 或 `constexpr` 时，声明才是定义。\n- **显式和部分特化：**\
  \ 且且仅当 `template<>` 或 `template<`…`>` 之后的声明本身是定义时，声明才是定义；静态数据成员或静态数据成员模板的显式特化仅在包含初始化值时才是定义。\n\
  \n其他声明不是定义。这包括类型别名（使用 `typedef` 或 `using`）、使用声明、using 指令、模板参数声明、显式实例化指令、`static_assert`\
  \ 声明等。\n\n### A.3 单一定义规则详解\n\n正如我们在本附言介绍中所暗示的，实际 ODR 包含许多细节。我们根据作用域对规则的约束进行分类。\n\
  \n#### A.3.1 每个程序一个的约束\n\n每个程序中以下项目最多只能有一个定义：\n\n- 非内联函数和非内联成员函数（包括函数模板的全特化）\n-\
  \ 非内联变量（本质上是指在命名空间作用域或全局作用域中声明、且没有 `static` 饰符的变量）\n- 非内联静态数据成员\n\n例如，由以下两个翻译单元组成的\
  \ C++ 程序是无效的：\n\n点击此处查看代码图像\n\n```cpp\n// ══ translation unit 1:\n\nint counter;\n\
  ```\n\n```cpp\n// ══ translation unit 2:\n\nint counter;      // ：定义两次 (ODR 违反)\n\
  ```\n\n此规则不适用于具有*内部链接*（internal linkage）的实体（本质上是指在全局作用域或命名空间作用域中使用 `static` 饰符声明的实体），因为即使两个此类实体具有相同的名称，它们也被视为不同的。同样，在匿名命名空间中声明的实体，如果出现在不同的翻译单元中，则被认为是不同的；在\
  \ C++11 及更高版本中，此类实体默认具有内部链接，但在 C++11 之前，它们默认具有外部链接。例如，以下两个翻译单元可以组合成有效的 C++ 程序：\n\
  \n点击此处查看代码图像\n\n```cpp\n// ══ translation unit 1:\n\nstatic int counter = 2;  //\
  \ 与其他翻译单元无关\nnamespace {\n    void unique()      // 与其他翻译单元无关\n    {\n    }\n}\n\
  ```\n\n```cpp\n// ══ translation unit 1:\n\nstatic int counter = 0;  // 与其他翻译单元无关\n\
  namespace {\n    void unique()      // 与其他翻译单元无关\n    {\n        ++counter;\n  \
  \  }\n}\n\nint main()\n{\n    unique();\n}\n```\n\n此外，如果上述项目在 constexpr *if* 语句的丢弃分支之外的语文中被*使用*（used），则在程序中必须*恰好有一个*（该功能仅在\
  \ C++17 中可用；请参见第 263 页的第 14.6 节）。在此语境下，“使用”一词有精确的含义。它表示程序中的某处存在对该实体的引用，导致在进行简单的代码生成时需要该实体。(3)\
  \ 这种引用可以是变量值的访问、对函数的调用或对该实体地址的引用。这种引用在源码中可以是显式的，也可以是隐式的。例如，`new` 表达式可能会对关联的 `delete`\
  \ 运算符产生隐式调用，以处理构造函数抛出异常并需要清理未使用（但已分配）内存的情况。另一个例子是拷贝构造函数，即使它们最终被优化掉，也必须定义（除非语言要求将其优化掉，这在\
  \ C++17 中很常见）。虚函数也会被隐式使用（通过实现虚函数调用的内部结构），除非它们是纯虚函数。还有其他几种隐式使用，但为了简洁起见我们省略了它们。\n\n\
  \n\n\n\n某些引用*并不*构成前述意义上的“使用”：那些出现在*未求值的操作数*中的引用（例如 `sizeof` 或 `decltype` 运算符的操作数）。`typeid`\
  \ 运算符的操作数（参见第 138 页第 9.1.1 节）在某些情况下是*未求值*的。具体来说，如果引用作为 `typeid` 运算符的一部分出现，它并不是前述意义上的“使用”，除非\
  \ `typeid` 运算符的参数最终指向一个多态对象（具有——可能是继承的虚函数的对象）。例如，考虑以下单文件程序：\n\n点击此处查看代码图像\n\n```cpp\n\
  #include <typeinfo>\n\nclass Decider {\n\n#if defined(DYNAMIC)\n    virtual ~Decider()\
  \ {\n\n    }\n#endif\n};\n\nextern Decider d;\n\nint main()\n{\n    char const*\
  \ name = typeid(d).name();\n    return (int)sizeof(d);\n}\n```\n\n当且仅当预处理器符号 `DYNAMIC`\
  \ 未定义时，该程序是有效的。事实上，变量 `d` 未被定义，但 `sizeof(d)` 中对 `d` 的引用并不构成“使用”，而 `typeid(d)` 中的引用仅当\
  \ `d` 是一个多态类型的对象时才构成“使用”（因为在通常情况下，并不总是能够在运行时间之前确定多态 `typeid` 结果的结果）。\n\n根据 C++ 标准，本节描述的约束并不要求\
  \ C++ 实现对此给出诊断信息。在实践中，它们通常由链接器报告为重复定义或缺失定义。\n\n### A.3.2 每个翻译单元仅定义一次的约束\n\n一个实体在一个翻译单元中不能被定义超过一次。因此，以下示例是无效的\
  \ C++：\n\n点击此处查看代码图像\n\n```cpp\ninline void f() {}\ninline void f() {}  // 错误：重复定义\n\
  ```\n\n这是在头文件中的代码周围使用*保护符（guards）*的主要原因之一：\n\n```cpp\n/* ══ ***guarddemo.hpp:***\n\
  #ifndef GUARDDEMO_HPP\n#define GUARDDEMO_HPP\n\n…\n\n#endif  // GUARDDEMO_HPP*\n\
  ```\n\n此类保护符确保了当头文件第二次被 `#include` 时，其内容会被丢弃，从而避免其可能包含的类、内联实体、模板等的重复定义。\n\nODR（定义规则）还规定，在某些情况下，某些实体*必须*被定义。这适用于类类型、内联函数和内联变量。在接下来的几段中，我们将回顾详细规则。\n\
  \n类类型 `X`（包括 `struct` 和 `union`）在翻译单元中*必须*在以下任何类型的使用*之前*定义：\n\n*   创建类型为 `X` 的对象（例如，作为变量声明或通过\
  \ `new` 表达式）。创建可以是间接的，例如，当创建一个本身包含类型为 `X` 对象的对象。\n*   声明类型为 `X` 的数据成员。\n*   对类型为\
  \ `X` 的对象应用 `sizeof` 或 `typeid` 运算符。\n*   显式或隐式地访问类型为 `X` 的成员。\n*   使用任何转换将表达式转换为类型\
  \ `X` 或从类型 `X` 转换，或者使用隐式转换、`static_cast` 或 `dynamic_cast` 将表达式转换为或从 `X` 的指针或引用（`void*`\
  \ 除外）。\n*   为类型为 `X` 的对象赋值。\n*   定义或调用参数或返回类型为类型 `X` 的函数。然而，仅仅声明此类函数不需要该类型被定义。\n\
  \n类型规则也适用于从类模板生成的类型 `X`，这意味着在必须定义此类类型 `X` 的情况下，相应的模板也必须定义。这些情况产生了*实例化点*（points of\
  \ instantiation，简称 *POI*）（参见第 250 页第 14.3.2 节）。\n\n内联函数必须在使用它的每个翻译单元（即调用它或获取其地址的单元）中定义。然而，与类类型不同，它们的定义可以跟在使用点之后：\n\
  \n```cpp\ninline int notSoFast();\n\nint main()\n{\n    notSoFast();\n}\n\ninline\
  \ int notSoFast()\n{\n}\n```\n\n虽然这是有效的 C++，但某些基于旧技术的编译器实际上并不会“内联”对尚未看到体的函数的调用；因此，预期的效果可能无法实现。\n\
  \n与类模板一样，使用参数化函数声明（函数模板或成员函数模板，或类模板的成员函数）生成的函数会创建一个实例化点。然而，与类模板不同，相应的定义可以出现在实例化点之后。\n\
  \n本节解释的 ODR 方面通常可以被 C++ 编译器容易地验证；因此，C++ 标准要求编译器在违反这些规则之一时发出某些诊断信息。一个例外是函数缺少定义。这种情况通常不会被诊断。\n\
  \n### A.3.3 翻译单元等价性约束\n\n在多个翻译单元中定义某些实体的能力带来了新类型的错误：不匹配的重复定义。不幸的是，这种错误对于一次处理一个翻译单元的编译器难以检测。因此，C++\
  \ 标准并不*强制*检测重复定义中的差异（当然，它*允许*这样做）。然而，如果违反了这一翻译单元约束，C++ 标准将其归为未定义行为，这意味着可能会发生任何情况。通常，未诊断的错误可能导致程序崩溃或结果错误，但原则上它们还可能导致更直接的损害（例如文件损坏）。4\n\
  \n翻译单元约束规定，当实体定义在两个地方时，这两个地方必须由完全相同的标记组成（预处理后的关键字、运算符、标识符等）。此外，这些标记在各自的上下文中必须含义相同（例如，标识符可能需要引用同一个变量）。\n\
  \n考虑以下示例：\n\n```cpp\n/* ══ ***翻译单元 1:***\nstatic int counter = 0;\n\ninline void\
  \ increaseCounter()\n{\n    ++counter;\n}\n\nint main()\n{\n}\n\n/* ══ ***翻译单元 2:***\n\
  static int counter = 0;\n\ninline void increaseCounter()\n{\n    ++counter;\n}\n\
  ```\n\n该示例是错误的，尽管两个翻译单元中内联函数 `increaseCounter()` 的标记看起来相同，但它们包含指向两个不同实体的标记 `counter`。事实上，由于两个名为\
  \ `counter` 的变量具有内部链接（`static` 修饰符），尽管名称相同，它们也是无关的。注意，尽管这两个内联函数都没有被实际使用，这仍然错误。\n\
  \n将可以在多个翻译单元中定义的实体的定义放在头文件中，并在需要定义时 `#include` 它们，可以确保在大多数情况下标记序列是相同的。通过这种方法，相同标记引用不同事物的情况变得非常罕见，但当这种情况发生时，产生的错误通常是诡异且难以追踪的。5\n\
  \n翻译单元约束不仅适用于可以在多个地方定义的实体，还适用于声明中的默认参数参数。换句话说，以下程序具有未定义行为：\n\n```cpp\n/* ══ ***翻译单元\
  \ 1:***\nvoid unused(int = 3);\n\nint main()\n{\n}\n\n/* ══ ***翻译单元 2:***\nvoid\
  \ unused(int = 4);\n```\n\n\n\n\n\n我们在这里应该注意，标记流的等价性有时会涉及微妙的隐含影响。以下示例是从 C++ 标准中摘取的（经过了略微修改）：\n\
  \n点击此处查看代码图像\n\n```cpp\n// ══ translation unit 1: \n\nclass X {\n  public:\n   \
  \ X(int, int);\n    X(int, int, int);\n};\n\nX::X(int, int = 0)\n{\n\n}\n\nclass\
  \ D {\n  X x = 0;\n};\n\nD d1; // D() 调用了 X(int, int)\n```\n\n```cpp\n// ══ translation\
  \ unit 2: \n\nclass X {\n  public:\n    X(int, int);\n    X(int, int, int);\n};\n\
  \nX::X(int, int = 0, int = 0)\n{\n}\n\nclass D : public X {\n  X x = 0;\n};\n\n\
  D d2; // D() 调用了 X(int, int, int)\n```\n\n在这个示例中，问题的出现是因为类 `D` 隐式生成的默认构造函数在两个编译单元是不同的。一个调用了接受两个参数的\
  \ `X` 构造函数，另一个调用了接受三个参数的 `X` 构造函数。如果可以说，这个例子是一个额外的理由，将默认参数限制在程序中的一处（如果可能，该位置应该在头文件中）。幸运的是，将默认参数放在类外定义中是一种罕见的做法。\n\
  \n对于“相同标记必须引用相同实体”这一规则也存在例外。如果相同的标记引用具有相同值的无关常量，且结果表达式的地址没有被使用（即使不是通过绑定到产生常量的引用来隐式使用），则这些标记被认为是等价的。这一异常允许出现如下的程序结构：\n\
  \n```cpp\n// ══ header.hpp: \n\n#ifndef HEADER_HPP\n#define HEADER_HPP\n\nint const\
  \ length = 10;\n\nclass MiniBuffer {\n  char buf[length];\n…\n\n};\n\n#endif //\
  \ HEADER_HPP\n```\n\n原则上，当此头文件被包含在两个不同的编译单元时，会创建两个名为 `length` 的不同常量变量，因为在这种语境下 `const`\
  \ 意味着 `static`。然而，此类常量变量通常是为了定义编译时常量值，而不是运行时的某个特定存储位置。因此，如果我们不强制要求该存储位置存在（通过引用变量的地址），那么两个常量具有相同的值就足够了。\n\
  \n最后，关于模板的说明。模板中的名称分两个阶段绑定。非依赖性名称在模板定义点绑定。对于这些名称，等价性规则的句方式与其他非模板定义类似。对于在实例化点绑定的名称，等价性规则必须在点点应用，且绑定必须是等价的。\n\
  \n^(1) 我们也认为，在交流 C 和 C++ 观点时，仔细处理术语是一个好习惯。我们在整书中都是这样做的。\n\n^(2) 某些构造结构（如 `static_assert`）并不引入任何名称，但在语法上被视为声明。\n\
  \n^(3) 各种优化技术可能导致需要移除它们，但语言并不假设此类优化。\n\n^(4) gcc 编译器的版本 1 实际上开玩笑地这样做过，在某些情况下启动了\
  \ Rogue 游戏。\n\n^(5) 偶尔，条件编译指令在不同的编译单元中求值结果不同。请谨慎使用此类指令。也可能存在其他差异，但它们更为罕见。\n\n##\
  \ 附录 B\n\n## 值类别 (Value Categories)\n\n表达式是 C++ 语言的基石，提供了表达式计算的主要机制。每个表达式都有一个类型，该类型描述了其计算产生的值的静态类型。表达式\
  \ `7` 的类型是 `int`，表达式 `5 + 2`如此，如果 `x` 是 `int` 类型的变量，表达式 `x` 也是如此。每个表达式还有一个值类别，它描述了关于值如何形成的信息并影响表达式的行为。\n\
  \n### B.1 传统的左值 (Lvalues) 和右值 (Rvalues)\n\n从历史角度看，只有两种值类别：左值和右值。左值是指存储在内存或机器寄存器中的实际值的表达式，例如表达式\
  \ `x`（其中 `x` 是变量名）。这些表达式可能是可修改的，允许人们更新存储的值。例如，如果 `x` 是 `int` 类型的变量，以下赋值将 `x` 的值替换为\
  \ `7`：\n\n```cpp\nx = 7;\n```\n\n左值一术语源于这些表达式在赋值中可能扮演的角色：字母 “l”代表“左侧”（left-hand\
  \ side），因为（在历史上的 C 语言中）只有左值可以出现在赋值的左侧。相反，右值（其中 “r”代表“右侧”right-hand side）只能出现在赋值表达式的右侧。\n\
  \n然而，当 C 在在 1989 年被标准化时，情况发生了变化：虽然 `int const` 是存储在内存中的值，但它不能出现在赋值的左侧：点击此处查看代码图像\n\
  \n```cpp\nint const x;\nx = 7; // 错误：左侧需要可修改的左值\n```\n\n由于所有这些变化，左值一术现在有时被代表“本地值”（local\
  \ value）。引用变量的表达式不是唯一的左值类型。另一类左值表达式包括指针解引用操作（例如 `*p`），它们引用指针所指地址处存储的值，以及引用类对象成员的表达式（例如\
  \ `p->data`）。即使是调用返回用 `&` 声明的“传统”左值引用返回值的函数也是左值。例如（详情请参见第 679 页的 B.4 节）：\n\n点击此处查看代码图像\n\
  \n```cpp\nstd::vector<int> v;\nv.front(); // 返回一个左值，因为返回类型是左值引用\n```\n\n可能令人惊讶的是，字符串字量也是（不可修改的）左值。\n\
  \n右值是纯数学值（例如 `7` 或字符 `'a’`），它们并不一定有任何存储；它们为了计算而存在，但一旦被使用就无法再次被引用。特别是，除字符串字面量外的任何字面量值（例如\
  \ `7`、`’a’`、`true`、`nullptr`）都是右值，许多内置算术计算的结果（例如整数类型 `x` 的 `x + 5`）以及按值返回结果调用也是。也就是说，所有临时值都是右值。（但不适用于引用它们的命名引用。）\n\
  \n#### B.1.1 左值到右值的转换 (Lvalue-to-Rvalue Conversions)\n\n由于其瞬时性，右值被限制在（“简单”）赋值的右侧：赋值\
  \ `7 = 8` 没有意义的，因为数学上的 `7` 不允许被重新定义。另一方面，左值似乎没有同样的限制：当 `x` 和 `y` 是兼容类型的变量时，完全可以计算赋值\
  \ `x = y`，即使表达式 `x` 和 `y` 都是左值。\n\n\n\n\n赋值操作 `x = y` 之所以工作，是因为右侧表达式 `y` 经历了一种名为\
  \ `lvalue-to-rvalue conversion` 的隐式转换。如其名称所示，`lvalue-to-rvalue conversion` 接收一个\
  \ `lvalue` 并通过从与 `lvalue` 关联的存储区或寄存器读取，产生一个相同类型的 `rvalue`。因此，这种转换完成了两个任务：第一，它确保\
  \ `lvalue` 可以在任何需要 `rvalue` 的地方使用（例如，作为赋值的右侧或如 `x + y` 的数学表达式中）；第二，它识别了编译器（在优化之前）可能在程序的何处发射“加载”（load）指令从内存中读取值。\n\
  \n## B.2 C++11 之后的值类别\n\n当 C++11 引入右值值引用（rvalue references）以支持移动语义时，将表达式划分为左值（lvalues）和右值的传统划分已不足以描述所有的\
  \ C++11 语言行为。因此，C++ 标准委员会根据三个核心类别和两个复合类别重新设计了值类别系统（参见图 B.1）。核心类别是：`lvalue`、`prvalue`（“纯右值”）和\
  \ `xvalue`。复合类别是：`glvalue`（泛义左值，是 `lvalue` 和 `xvalue` 的并集）和 `rvalue`（`xvalue` 和\
  \ `prvalue` 的并集）。\n\n注意，所有表达式仍然是 `lvalues` 或 `rvalues`，但 `rvalues` 类别现在被细分。\n\n\
  点击查看代码图像\n\n*图 B.1. C++11 之后的值类别*\n\n这种 C++11 的分类方法一直有效，但在 C++17 中，这些类别的特征被重新表述如下：\n\
  \n- `glvalue` 是一个表达式，其求值决定了对象、位域或函数的标识（即具有存储区域的实体）。\n- `prvalue` 是一个表达式，其求值初始化一个对象或位域，或计算运算符操作数的值。\n\
  - `xvalue` 是一个 glvalue，指定一个资源可以重用的对象或位域（通常是因为它即将“过期”——`xvalue` 中的 “x” 原本来自“eXpiring\
  \ value”）。\n- `lvalue` 是不是 `xvalue` 的 glvalue。\n- `rvalue` 是一个既可能是 `prvalue` 也是\
  \ `xvalue` 的表达式。\n\n注意在 C++17 中（在某种程度上在 C++11 和 C++14 中也是），`glvalue` 与 `prvalue`\
  \ 的二分法认为比传统的 `lvalue` 与 `rvalue` 区别更具基础。\n\n尽管这描述的是 C++17 引入的特征，但这些描述也适用于 C++11\
  \ 和 C++14（之前的描述是等价的但更难推理）。\n\n除了位域外，glvalues 产生具有地址的实体。该地址可以是较大封装对象的子对象的地址。在基类子对象的情况下，glvalue（表达式）的类型称为其\
  \ `static type`（静态类型），而该基类所属的最派生对象的类型称为 glvalue 的 `dynamic type`（动态类型）。如果 glvalue\
  \ 没有产生基类子对象，则其静态和动态类型是相同的（即表达式的类型）。\n\n`lvalues` 的示例有：\n- 指定变量或函数的表达式\n- 内置 `*`\
  \ 运算符（“指针间接寻址”）的应用\n- 仅为字符串字面量的表达式\n- 返回类型为左值引用的函数调用\n\n`prvalues` 的示例有：\n- 由非字符串字面量或用户定义字面量字面量组成的表达式\n\
  - 内置一元运算符 `&` 应用（即获取表达式的地址）\n- 内置算术运算符的应用\n- 返回类型为 `not` 引用类型的函数调用\n- Lambda 表达式\n\
  \n`xvalues` 的示例有：\n- 返回类型为对象类型右值引用的函数调用（例如 `std::move()`）\n- 转换为对象类型右值引用的强制转换\n\n\
  注意，函数类型的右值引用产生的是 lvalues，而不是 xvalues。值得强调的是，glvalues、prvalues、xvalues 等是 `expressions`（表达式），而不是值或实体。例如，变量本身不是一个\
  \ lvalue，尽管表示变量的表达式是一个 lvalue：\n\n```cpp\nint x = 3; // x 是一个变量，不是 lvalue。3 是初始化它的\
  \ prvalue。\ny = x; // x 是一个 lvalue。该 lvalue 的求值并不产生值 3，而是一个包含值 3 的对象的标识。该 lvalue\
  \ 随后被转换为 prvalue，从而初始化 y。\n```\n\n### B.2.1 临时实体化 (Temporary Materialization)\n\n\
  我们之前提到过 lvalues 经常经历 `lvalue-to-rvalue conversion`，因为 prvalues 是初始化对象（或为大多数内置运算符提供操作数）的表达式。在\
  \ C++17 中，这种转换有一个对偶，被称为 `temporary materialization`（临时实体化，但完全可以被称为 `prvalue-to-xvalue\
  \ conversion`）：每当 prvalue 在 glvalue（包括 xvalue）需要的地方有效出现时，就会创建一个由 prvalue 初始临时对象（记住\
  \ prvalues 主要是“初始化值”），并且该 prvalue 被替换为指向临时对象的 `xvalue`。例如：\n\n```cpp\nint f(int\
  \ const&);\nint r = f(3);\n```\n\n由于示例中的 `f()` 有引用参数，它期望一个 glvalue。然而表达式 `3` 是一个\
  \ prvalue。因此，“临时实体化”规则生效，表达式 `3` 被“转换为”指向由值 3 化的临时对象的 xvalue。\n\n更一般地说，在以下情况下，临时对象会根据\
  \ prvalue 进行实体化：\n- prvalue 绑定到引用（例如上面的 `f(3)`）。\n- 访问类 prvalue 的成员。\n- 对数组 prvalue\
  \ 进行下标操作。\n- 数组 prvalue 转换为其第一个元素的指针（即数组退化）。\n- prvalue 出现在初始化列表中，对于某种类型 `X`，它初始化\
  \ `std::initializer_list<X>` 对象。\n- `sizeof` 或 `typeid` 运算符作用于 prvalue。\n- prvalue\
  \ 是形式为 `expr;` 的语句中的顶级表达式，或表达式强制转换为 `void`。\n\n因此，在 C++17 中，由 prvalue 初始化的对象由上下文决定，结果只有在真正需要时才会创建临时对象。在\
  \ C++17 之前，prvalues（特别是类类型）总是意味着一个临时对象。这些临时对象的拷贝以后可以可选地被消除，但编译器仍然必须执行拷贝操作的大部分语义约束（例如，拷贝构造函数可能需要是可以用的）。下面的示例显示了\
  \ C++17 规则修订的后果：\n\n```cpp\nclass N {\npublic:\n  N();\n  N(N const&) = delete;\
  \ // 此类不可拷贝\n  N(N&&) = delete;      // …也不可移动\n};\n\nN make_N() {\n  return N{};\
  \ // 在 C++17 之前总是创建一个概念临时对象。\n}\n\nauto n = make_N(); // C++17 之前是错误，因为 prvalue\
  \ 需要一个概念上的拷贝。C++17 之后正常，因为 n 直接从 prvalue 初始化。\n```\n\n\n\n\n在 C++17 之前，prvalue `N`*{}`\
  \ 会产生一个类型为 `N` 的临时对象，但编译器允许省略该临时对象的拷贝和移动（在实践中，它们总是这样做的）。在这种情况下，这意味着调用 `make_N()`\
  \ 产生的临时结果可以直接构造在 `n` 的存储空间中；不需要任何拷贝或移动操作。遗憾的是，C++17 之前的编译器仍然必须检查*可以*进行拷贝或移动操作，而在本示例中这将是不可能的，因为\
  \ `N` 的拷贝构造函数被删除了（且没有生成移动构造函数）。因此，C++11 和 C++14 编译器必须对此示例报告错误。\n\n在 C++17 中，prvalue\
  \ `N` 本身不会产生临时对象。相反，它会初始化由上下文决定的对象：在我们的示例中，该对象就是 `n` 所代表的对象。永远不会考虑拷贝或移动操作（这不是优化，而是一种语言保证），因此该代码是有效的\
  \ C++17 代码。\n\n我们通过一个展示各种值类别情况的示例作为结束：\n\n点击此处查看代码图片\n\n```cpp\nclass X {\n\n};\n\
  \nX v;\n\nX const c;\n\nvoid f(X const&);   // 接受任何值类别的表达式\nvoid f(X&&);       //\
  \ 仅接受 prvalues 和 xvalues，但对于这些值\n                   // 它比之前的声明匹配匹配\nf(v);      \
  \        // 将一个可修改的 lvalue 传递给第一个 f\nf(c);              // 将一个不可修改的 lvalue 传递给第一个\
  \ f()\nf(X());            // 将一个 prvalue（在 C++17 中具体化为 xvalue）传递给第二个 f()\nf(std::move(v));\
  \   // 将一个 xvalue 传递给第二个 f()\n```\n\n### B.3 使用 `decltype` 检查值类别\n\n使用 `decltype`\
  \ 关键字（由 C++11 引入），可以检查任何 C++ 表达式的值类别。对于任何表达式 `x`，`decltype((x))`（注意双括号）产生：\n\n•\
  \ 如果 `x` 是 prvalue，则产生 `type`\n- 如果 `x` 是 lvalue，则产生 `type&`\n- 如果 `x` 是 xvalue，则产生\
  \ `type&&`\n\n`decltype((x))` 中的双括号是为了避免在表达式 `x` 确实命名了一个实体时，产生该具名实体的声明类型（在其他情况下，括号没有影响）。例如，如果表达式\
  \ `x` 仅仅命名一个变量 `v`，那么不带括号的构造将变为 `decltype(v)`，它产生变量 `v` 的类型，而不是一个反映引用该变量的表达式 `x`\
  \ 值类别的类型。\n\n因此，使用类型特性（type traits）对于任何表达式 `e`，我们可以如下检查其值类别：\n\n点击此处查看代码图片\n\n```cpp\n\
  if constexpr (std::is_lvalue_reference<decltype((*e))>::value) {\n  std::cout <<\
  \ \"expression is lvalue\\n\";\n}\nelse if constexpr (std::is_rvalue_reference<decltype((*e))>::value)\
  \ {\n  std::cout << \"expression is xvalue\\n\";\n}\nelse {\n  std::cout << \"expression\
  \ is prvalue\\n\";\n}\n```\n\n详情请参见第 298 页第 15.10.2 节。\n\n### B.4 引用类型\n\nC++ 中的引用类型——例如\
  \ `int&`——以两种重要方式与值类别交互。第一是引用可能会限制其可以绑定的表达式的值类别。例如，类型为 `int&` 的非 `const` lvalue\
  \ 只能用类型为 `int` 的 lvalue 进行初始化。同样，类型为 `int&&` 的 rvalue 只能用类型为 `int` 的 rvalue 进行初始化。\n\
  \n值类别与引用交互的第二方式是通过函数的返回类型，将引用类型作为返回类型会影响该函数调用的值类别。特别是：\n\n• 返回类型为 lvalue 引用的函数调用产生一个\
  \ lvalue。\n• 返回类型为对象类型 rvalue 引用的函数调用产生一个 xvalue（对函数类型的 rvalue 引用始终产生 lvalue）。\n\
  • 返回非引用类型的函数调用产生一个 prvalue。\n\n我们通过以下示例说明了引用类型与值类别之间的交互：\n\n```cpp\nint get_lvalue()\
  \ { static int x; return x; }\nint&& get_xvalue() { static int x; return std::move(x);\
  \ }\nint get_prvalue() { return 42; }\n\n// 使用示例：\nint& lref = get_lvalue();\nint&&\
  \ xref = get_xvalue();\nint pref = get_prvalue();\n```\n\n\n\n\n重载解析是函数调用完整处理过程中的一部分。事实上，它并不是每个函数调用的一部分。首先，通过函数指针的调用以及通过指向成员函数的指针的调用不涉及重载解析，因为要调用的函数完全（在运行时）由指针决定。其次，函数形式的宏不能被重载，因此也不涉及重载解析。\n\
  \n在非常高层面上，对命名函数的调用可以按以下方式处理：\n\n- 查找该名称以形成初始的`重载集合`（overload set）。\n- 如果需要，会以各种方式调整该集合（例如，发生模板参数推导和替换，这可能导致某些函数模板候选被丢弃）。\n\
  - 任何完全不匹配调用的候选（即使在考虑隐式转换和默认参数后）都会从重载集合中消除。这将产生一组`可行函数候选`（viable function candidates）。\n\
  - 执行重载解析以找到一个`最佳` 候选者。如果存在，则选择它；否则，调用具有具义性。\n- 检查选定的候选者。例如，如果它是一个被删除函数（即用 `= delete`\
  \ 定义的函数）或不可访问的私有成员函数，则会发出诊断信息。\n\n这些步骤中的每一步都有其微妙之处，但重载解析无疑是最复杂的。幸运的是，几个简单的原理解释了大部分情况。我们接下来检查这些原理。\n\
  \n### C.2 简化的重载解析\n\n重载解析通过比较调用中的每个参数与候选函数对应参数的匹配程度，对可行候选函数进行排序。一个候选者被认为优于另一个，前提是较优的候选者没有任何参数的匹配程度比另一个候选者的对应参数更差。下面的示例说明了这一点：\n\
  \n点击此处查看代码图像\n\n```cpp\nvoid combine(int, double);\n\nvoid combine(long, int);\n\
  \nint main()\n{\n    combine(1, 2);     // 歧义！\n}\n```\n\n在这个示例中，对`combine()` 的调用具有歧义，因为第一个候选者匹配第一个参数（类型为\
  \ `int` 的字面量 `1`）为`最佳`，而第二个候选者匹配第二个参数为`最佳`。我们可以认为 `int` 在某种意义上比 `double` 更接近 `long`（这支持选择第二个候选者），但\
  \ C++ 尝试定义一种涉及多个调用参数的接近度标准。\n\n基于第一个原理，我们只需要指定给定参数与可行候选对应参数的匹配程度。作为第一近似，我们可以按如下顺序对可能的匹配进行排序（从最好到最差）：\n\
  \n1. **完美匹配**（Perfect match）。参数的类型为表达式的类型，或者其类型是表达式类型的引用（可能带有额外的 `const` 和/或 `volatile`\
  \ 修饰符）。\n2. **带微调的匹配**（Match with minor adjustments）。这包括数组变量退化为指向其第一个元素的指针，或者添加\
  \ `const` 以匹配类型为 `int**` 的参数与类型为 `int const* const*` 的参数。\n3. **带提升匹配**（Match with\
  \ promotion）。提升是一种隐式转换，包括将小型整数类型（如 `bool`、`char`、`short`，有时包括枚举）转换为 `int`、`unsigned\
  \ int`、`long` 或 `unsigned long`，以及将 `float` 转换为 `double`。\n4. **仅带标准转换的匹配**（Match\
  \ with standard conversions only）。这包括任何类型的标准转换（如 `int` 到 `float`）或从派生类到其公共、无歧义基类的转换，但排除了对转换运算符或转换构造函数的隐式调用。\n\
  5. **带用户定义转换的匹配**（Match with user-defined conversions）。这允许任何隐式转换。\n6. **带省略号 (`…`)的匹配**（Match\
  \ with ellipsis）。省略号参数可以匹配几乎任何类型。然而，有一个例外：具有非平凡拷贝构造函数的类类型可能有效也可能无效（实现可以自由地允许或禁止这一点）。\n\
  \n下面的构造示例说明了其中一些匹配：\n\n点击此处查看代码图像\n\n```cpp\nint f1(int);    // #1\nint f1(double);\
  \ // #2\nf1(4);          // 调用 #1: 完美匹配 (#2 需要标准转换)\n\nint f2(int);    // #3\nint\
  \ f2(char);   // #4\nf2(\"true\");     // 调用 #3: 带提升匹配 (#4 需要更强的标准转换)\n\nclass X\
  \ {\npublic:\n    X(int);\n};\n\nint f3(X);      // #5\nint f3(...);    // #6\n\
  f3(4);         // 调用 #5: 带用户定义转换匹配\nf3(7);          // 调用 #6: 需要省略号\n```\n\n\n\n\
  \n```cpp\nBadString(char const*);\n\n    …\n\n    // 通过下标访问访问字符：\n    char& operator[]\
  \ (std::size_t);               // #1\n    char const& operator[] (std::size_t) const;\n\
  \n    // 隐式转换为空终止字节字符串：\n    operator char* ();                           // #2\n\
  \    operator char const* ();\n\n    …\n};\n\nint main()\n{\n    BadString str(\"\
  correkt\");\n    str[5] = 'c'; // 可能存在重载解析歧义！\n}\n```\n\n起，表达式 `str[5]` 看起来没有任何歧义。`#1`\
  \ 处的下标运算符似乎是一个完美的匹配。然而，它并不完美，因为参数 `5` 的类型是 `int`，而运算符期望的是无符号整数类型（`size_t` 和 `std::size_t`\
  \ 通常为 `unsigned int` 或 `unsigned long` 类型，但绝不是 `int` 类型）。尽管如此，简单的标准整数转换使得 `#1` 变得可行。但是，还有另一个可行的候选者：内置的下标运算符。事实上，如果我们对\
  \ `str`（隐式成员函数参数）应用隐式转换运算符，将得到指针类型，现在内置的下标运算符被应用。这个内置运算符接收类型为 `ptrdiff_t` 的参数，在许多平台上等同于\
  \ `int`，因此与参数 `5` 完美匹配。所以，尽管内置下标运算符对于隐含参数（通过用户定义转换）来说匹配程度较差，但对于实际的下标来说，它比 `#1` 处定义的运算符匹配得更好！因此产生了潜在的歧义。为了可移植性地解决这类问题，你可以声明一个带有\
  \ `ptrdiff_t` 参数的 `operator [ ]`，或者可以使用显式转换来替换到 `char*` 的隐式类型转换（这通常也是被推荐的）。\n\n\
  一组可行的候选者可能同时包含静态成员和非静态成员。在比较静态成员和非静态成员时，隐式参数的匹配质量会被忽略（只有非静态成员具有隐式的 `*this` 参数）。\n\
  \n默认情况下，非静态成员函数有一个隐式的 `*this` 参数，其类型为左值引用（lvalue reference），但 C++11 引入了语法使其成为右值引用（rvalue\
  \ reference）。例如：\n\n```cpp\nstruct S {\n    void f1();      // 隐式 this 参数是左值引用（见下文）\n\
  \    void f2() &&;  // 隐式 this 参数是右值引用\n    void f3() &;   // 隐式 this 参数是左值引用\n\
  };\n```\n\n从这个示例可以看出，不仅可以将隐式参数变为右值引用（使用 `&&` 后缀），还可以确认左值引用的情况（使用 `&` 后缀）。有趣的是，指定\
  \ `&` 后缀并不完全等同于省略它：一个旧的特殊情况允许当该引用是传统的隐式 `*this` 参数时，将右值绑定到非-`const` 类型的左值引用，但如果显式请求了左值引用处理，这个（某种程度上危险的）特殊情况就不再适用。因此，根据上述定义的\
  \ `S`：\n\n```cpp\nint main()\n{\n    S().f1();   // OK：旧规则允许右值 S() 匹配隐含的 this 左值引用类型\n\
  \    S().f2();   // OK：右值 S() 匹配 this 的右值引用类型\n    S().f3();   // ERROR：右值 S() 无法匹配\
  \ this 的左值引用类型\n}\n```\n\n### 2.2 完善完美匹配\n\n对于类型为 `X` 的参数，有四种常见类型构成完美匹配：`X`、`X&`、`X\
  \ const&`（`X&&` 也是精确匹配，但很少使用）。然而，在两种类型的引用上重载函数是非常常见的。在 C++1 之前，这意味着像如下所示的情况：\n\n\
  ```cpp\nvoid report(int&);\nvoid report(int const&);\nint main()\n{\n    for (int\
  \ k = 0; k<10; ++k) {\n        report(k); // 调用 #1\n    }\n    report(42); // 调用\
  \ #2\n}\n```\n\n在这里，对于左值，不带额外 `const` 的版本被优选，而只有带有 `const` 的版本可以匹配右值。\n\n随着 C++11\
  \ 引入右值引用，以下示例说明了另一个需要区分两个完美匹配的常见情况：\n\n```cpp\nstruct Value {\n    …\n};\nvoid pass(Value\
  \ const&); // #1\nvoid pass(Value&&);     // #2\nvoid g(X&& x)\n{\n    pass(x);\
  \           // 调用 #1，因为 x 是左值\n    pass(X());         // 调用 #2，因为 X() 是右值（实际上是 prvalue）\n\
  \    pass(std::move(x)); // 调用 #2，因为 std::move(x) 是右值（实际上是 xvalue）\n}\n```\n\n这次，接收右值引用的版本被认为认为是对右值的更好匹配，但它不能匹配左值。\n\
  \n注意，这同样适用于成员函数调用的隐式参数：\n\n```cpp\nclass Wonder {\n  public:\n    void tick(); \
  \       // #1\n    void tick() const;  // #2\n    void tack() const;  // #3\n};\n\
  \nvoid run(Wonder& device)\n{\n    device.tick(); // 调用 #1\n    device.tack(); //\
  \ 调用 #3，因为没有 tack() 的非 const 版本\n}\n```\n\n最后，对我们早期示例的以下修改说明，如果你在带引用和不带引用的情况下进行重载，也会产生歧义：\n\
  \n```cpp\nvoid report(int);       // #1\nvoid report(int&);      // #2\nvoid report(int\
  \ const&); // #3\nint main()\n{\n    for (int k = 0; k<10; ++k) {\n        report(k);\
  \ // 歧义：#1 和 #2 匹配相等\n    }\n    report(42); // 歧义：#1 和 #3 匹配相等\n}\n```\n\n### C.\
  \ 重载细节\n\n前面的章节涵盖了日常 C++ 编程中遇到的大多数重载情况。遗憾的是，还有许多规则以及这些规则的例外——多到不适合在真正关于函数重载的书中进行全部介绍。尽管如此，我们在这里讨论其中一些规则，部分是因为它们的应用比其他规则频繁，部分是为了让人对细节的深度有某种感受。\n\
  \n#### C.3.1 优选非模板或特特化模板\n\n当重载解析的所有其他方面都相等时，非模板函数优于模板实例（无论该实例是从通用模板定义生成的，还是作为显式特化提供的）。例如：\n\
  \n```cpp\ntemplate<typename T> int f(T); // #1\nvoid f(int);                   \
  \ // #2\n\nint main()\n{\n    return f(7); // ERROR：选择了 #2，它没有返回值\n}\n```\n\n这个示例也清楚地说明了，重载解析通常不涉及所选函数的返回类型。\n\
  \n\n\n\n\n然而，当重载解析的其他方面略有不同时（例如具有不同的 `const` 和引用限定符），首先应用重载解析的通用规则。当定义的与拷贝或移动构造函数接受相同参数的成员函数时，这种效应很容易意外地导致意料之外的行为。详情请参见第\
  \ 333 页第 16.2.4 节。\n\n如果在两个模板之间进行选择，则优先选择更特化的模板（前提是其中一个确实比另一个更特化）。关于这一概念的彻底解释，请参见第\
  \ 330 页第 16.2.2 节。这种区别的一个特殊情况发生在当两个模板的区别仅在于其中一个添加了尾部参数包：不带包的模板被认为更特化，因此如果它匹配调用，则会被优先考虑。第\
  \ 57 页第 4.1.2 节讨论了这种情况的一个示例。\n\n### C.3.2 转换序列\n\n隐式转换通常是一系列基本转换的序列。考虑以下代码示例：\n\n\
  点击此处查看代码图像\n\n```cpp\nclass Base {\n  public:\n    operator short() const;\n};\n\
  \nclass Derived : public Base {\n};\n\nvoid count(int);\n\nvoid process(Derived\
  \ const& object)\n{\n    count(object);   // 匹配用户定义的转换*\n}\n```\n\n调用 `count(object)`\
  \ 能够工作是因为 `object` 可以隐式地转换为 `int`。然而，这种转换需要几个步骤：\n\n1. 将 `object` 从 `Derived const`\
  \ 转换为 `Base const`（这是一个左值引用转换；它保留了对象的标识性）\n2. 将生成的 `Base const` 对象转换为类型 `short`\
  \ 的用户定义转换\n3. 将 `short` 提升为 `int`\n\n这是最通用的转换序列类型：标准转换（在本例中是从派生类到基类的转换），随后是用户定义转换，然后是另一个标准转换。虽然一个转换序列中最多只有一个用户定义转换，但也可能只有标准转换。\n\
  \n重载解析的一个重要原则是，作为另一个转换序列的子序列的转换序列优于后一个序列。如果示例中存在另一个候选函数：\n\n```cpp\nvoid count(short);\n\
  ```\n\n那么对于对 `count(object)` 的调用，该函数将是优先的，因为它不需要转换序列中的第三步（提升）。\n\n### C.3.3 指针转换\n\
  \n指针和指向成员的指针经历各种特殊的标准转换，包括：\n\n- 转换为 `bool` 类型\n- 从任意指针类型转换为 `void*`\n- 指针的派生类到基类指针转换\n\
  - 成员指针的基类到派生类指针转换\n\n尽管所有这些转换都可能导致“仅与标准转换匹配”，但它们的排名并不是平等的。\n\n首先，到 `bool` 类型的转换（包括从普通指针和从成员指针）被认为比任何其他类型的标准转换都差。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\nvoid check(void*);   // #1\nvoid check(bool);    // #2\n\
  \nvoid rearrange (Matrix* m)\n{\n    check(m);      // 调用 #1\n    …\n}\n```\n\n\
  在普通指针转换的类别中，到 `void*` 类型的转换被认为比从派生类指针到基类指针的转换差。此外，如果存在到通过继承关系相关的不同类的转换，则到最派生类的转换是优先的。这里是另一个简短示例：\n\
  \n点击此处查看代码图像\n\n```cpp\nclass Interface {\n    ...\n};\n\nclass CommonProcesses\
  \ : public Interface {\n    ...\n};\n\nclass Machine : public CommonProcesses {\n\
  \    ...\n};\n\nchar* serialize(Interface*);      // #1\nchar* serialize(CommonProcesses*);\
  \  // #2\nvoid dump (Machine* machine)\n{\n    char* buffer = serialize(machine);\
  \  // 调用 #2\n    …\n}\n```\n\n从 `Machine*` 到 `CommonProcesses*` 的转换优于到 `Interface*`\
  \ 的转换，这是非常直观的。非常相似的规则也适用于指向成员的指针：在两个相关的成员指针类型转换之间，继承图中的“最接近基类”是优先的。\n\n### C.3.4\
  \ 初始化列表\n\n初始化列表参数（使用大括号传递的）可以转换为几种不同的类型：`initializer_lists`、具有 `initializer_list`\
  \ 构造函数的类类型，或者其成员可以通过列表元素进行初始化的聚合体类型。以下程序说明了这些情况：点击此处查看代码图像\n\n```cpp\n#include <initializer_list>\n\
  #include <string>\n#include <vector>\n#include <complex>\n#include <iostream>\n\n\
  void f(std::initializer_list<int>) {\n    std::cout << \"#1\";\n}\n\nvoid f(std::initializer_list<std::string>)\
  \ {\n    std::cout << \"#2\";\n}\n\nvoid g(std::vector<int> const) {\n    std::cout\
  \ << \"#3\";\n}\n\nvoid h(std::complex<double> const) {\n    std::cout << \"#4\"\
  ;\n}\n\nstruct Point {\n    int x, y;\n};\n\nvoid i(Point const) {\n    std::cout\
  \ << \"#5\";\n}\n\nint main()\n{\n    f({1, 2, 3});      // 输出 #1\n    f({\"hello\"\
  , \"list\"}); // 输出 #2\n    g({1, 2, 3});      // 输出 #3\n    h({1.5, 2.5});    \
  \ // 输出 #4\n    i({1, 2});         // 输出 #5\n}\n```\n\n在两次调用 `f()` 时，初始化列表参数被转换为\
  \ `initializer_list` 值，这涉及将列表中的每个元素转换为列表元素类型。在第一次调用中，所有元素都是 `int` 类型，因此不需要额外的转换。在第二次调用中，初始化列表中的每个字符串字面量通过调用\
  \ `string(char const*)` 构造函数转换为 `std::string`。第三次调用（到 `g()`）执行了使用 `vector(initializer_list<int>)`\
  \ 构造函数的用户定义转换。下一次调用触发了 `complex(double, double)` 构造函数，就像写了 `std::complex<double>(1.5,\
  \ 2.5)` 一样。最后一次调用执行聚合初始化，通过元素初始化 `Point` 实例的成员。\n\n初始化列表有一些有趣的案例。当将初始化列表转换为 `initializer_list`\
  \ 时（如上述示例的前两次调用），整体转换的排名与初始化列表中任何给定元素转换为列表元素类型的最差转换排名相同（即 `initializer_list<T>`\
  \ 中的 `T`）。这可能会导致一些意料之外的结果，如下所示：\n\n点击此处查看代码图像\n\n```cpp\n#include <initializer_list>\n\
  #include <iostream>\n\nvoid ovl(std::initializer_list<char>) {\n    std::cout <<\
  \ \"#1\";\n}\n\nvoid ovl(std::initializer_list<int>) {\n    std::cout << \"#2\"\
  ;\n}\n\nint main()\n{\n    ovl({'h', 'e', 'l', 'l', 'o', '\\0'}); // 输出 #1\n   \
  \ ovl({'h', 'e', 'l', 'l', 'o', 0});   // 输出 #2\n}\n```\n\n\n\n\n\n在第一次调用 `ovl()`\
  \ 时，初始化列表中的每个元素都是 `char`。对于第一个 `ovl()` 函数，这些元素完全不需要任何转换。对于第二个 `ovl()` 函数，这些元素需要提升（promotion）为\
  \ `int`。因为完美匹配（perfect match）优于提升，因此第一次调用 `ovl()` 调用了 `#1`。\n\n在第二次调用 `ovl()` 时，前五个元素的类型为\
  \ `char`，而最后一个元素的类型为 `int`。对于第一个 `ovl()` 函数，`char` 元素是完美匹配，但 `int` 元素需要一次标准转换（standard\
  \ conversion），因此整体转换被归类为标准转换。对于第二个 `ovl()` 函数，`char` 元素需要提升为 `int`，而末尾的 `int` 元素是完美匹配。第二个\
  \ `ovl()` 函数的整体转换被归类为提升，这使得它成为比第一个 `ovl()` 更好的候选者，尽管只有一个元素的转换结果更好。\n\n当使用初始化列表初始化类类型对象时（例如我们原始示例中对\
  \ `g()` 和 `h()` 的调用），重载解析分两个阶段进行：\n\n1. 第一阶段仅考虑`初始化列表构造函数`（initializer-list constructors），即那些唯一的非默认参数类型为某种类型\
  \ `T` 的 `std::initializer_list<T>` 的构造函数（在移除顶层引用和 `const`/volatile` 修饰符后）。\n\n2.\
  \ 如果没有找到这样的可行构造函数，则第二阶段考虑所有其他构造函数。该规则有一个例外：如果初始化列表为空且该类具有默认构造函数，则跳过第一阶段，以便调用默认构造函数。\n\
  \n该规则的效果是：任何初始化列表构造函数都比任何非初始化列表构造函数是更好的匹配，如下例所示：\n\n点击此处查看代码图像\n\n`overload/initlistctor.cpp`\n\
  \n```cpp\n#include <initializer_list>\n#include <string>\n#include <iostream>\n\n\
  template<typename T>\nstruct Array {\n  Array(std::initializer_list<T>) {\n    std::cout\
  \ << \"#1\\n\";\n  }\n  Array(unsigned n, T const&) {\n    std::cout << \"#2\\n\"\
  ;\n  }\n};\n\nvoid arr1(Array<int>) {\n}\nvoid arr2(Array<std::string>) {\n}\nint\
  \ main()\n{\n  arr1({1, 2, 3, 4, 5}); // prints #1\n  arr1({1, 2});           //\
  \ prints #1\n  arr1({10u, 5});         // prints #1\n  arr2({\"hello\", \"initializer\"\
  , \"list\"}); // prints #1\n  arr2({10, \"hello\"});    // prints #2\n}\n```\n\n\
  注意，接收 `unsigned` 和一个 `T const&` 的第二个构造函数在从初始化列表初始化 `Array<int>` 对象时不会被调用，因为它的初始化列表构造函数总是比其非初始化列表构造函数更匹配。然而，对于\
  \ `Array<string>`，当初始化列表构造函数不可用时，非初始化列表构造函数会被调用，如对 `arr2()` 的第二次调用所示。\n\n#### C.3.5\
  \ 函数和代理函数\n\n我们之前提到过，在查找函数名以创建初始重载集后，该集合会以各种方式进行微调。当调用表达式引用类类型对象而不是函数时，会出现一种有趣的情况。在这种情况下，重载集有两个潜在的添加。\n\
  \n第一个添加是直接的：任何成员运算符 `()`（函数调用运算符）都会添加到集合中。具有此类运算符的对象通常称为`函数对象`（functors 或 function\
  \ objects，参见第 [157] 页的第 11.1_page_157) 节）。\n\n当类类型对象包含一个转换为指向函数类型指针（或函数类型引用）的隐式转换运算符时，会发生不那么明显的添加。在这种情况下，重载集会添加一个伪（或\
  \ `surrogate`）函数。该代理函数候选者被认为除了对应转换函数中类型的参数外， true 一个转换函数类型的隐含参数。一个例子让这变得清晰得多：\n\n\
  点击此处查看代码图像\n\n```cpp\nusing FuncType = void (double, int);\nclass IndirectFunctor\
  \ {\n  public:\n    operator()(double) const;\n    operator FuncType() const;\n\
  };\n\nvoid activate(IndirectFunctor& funcObj) {\n  funcObj(3, 5); // ERROR: ambiguous\n\
  }\n```\n\n调用 `funcObj(3, 5)` 被视为带有三个参数的调用：`funcObj`、`3` 和 `5`。可行的候选者包括成员函数和代理函数。代理在参数上的匹配较差；因此这两个候选者无法排序。\n\
  \n#### C.3.6 其他上下文\n\n到为止，我们讨论了在确定应该调用哪个函数的上下文下的重载。然而，在其他几个上下文中必须进行类似的选择。第一个上下文发生在需要函数地址时。考虑以下示例：\n\
  \n点击此处查看代码图像\n\n```cpp\nclass BigNum {\n  public:\n    BigNum(long);\n    BigNum(double);\n\
  \    BigNum(std::string const&);\n    …\n    operator double();\n    operator long();\n\
  \    …\n};\n\nvoid initDemo() {\n  BigNum bn1(103); // selects #1\n  BigNum bn2(\"\
  7057103224.09764\"); // selects #3\n  int in = bn1; // selects #5\n}\n```\n\n在这个示例中，需要重载解析来选择合适的构造函数或转换运算符。具体来说，`bn1`\
  \ 的初始化调用了第一个构造函数，`bn2` 调用了第三个构造函数，而 `in` 则调用了 `operator long()`。在大多数情况下，重载规则产生直观的结果。然而，这些规则的细节非常复杂，某些应用程序依赖于该领域一些较为晦涩的角落。\n\
  \n\n\n\n聚合初始化（Aggregate initialization）仅适用于 C++ 中的 `aggregate` 类型，这些类型是数组或简单的、类\
  \ C 风格的类，它们没有用户提供的构造函数、没有私有或保护的非静态数据成员、没有基类且没有虚函数。在 C++14 之前，它们还不能有默认成员初始化器。从 C++17\
  \ 开始，允许使用公共基类。\n\n转换操作符也必须是适用的，例如，非 `const` 操作符不认为适用于 `const` 对象。\n\n## 附录 D\n\n\
  ## 标准类型工具\n\nC++ 标准库很大程度上由模板组成，其中许多模板依赖于本书中介绍和讨论的各种技术。因此，有一些技术在某种意义上被“标准化”了，即标准库定义了几个模板来用泛型代码实现库。这些类型工具（类型\
  \ traits 和其他助手）在本章中列出并解释。\n\n请注意，某些类型 traits 需要编译器的支持，而另一些可以使用现有的语言特性在库中实现（我们在第\
  \ 19 章中讨论了其中一些）。\n\n### D.1 使用类型 traits\n\n在使用类型 traits 时，通常你需要包含头文件 `<type_traits>`：\n\
  \n```cpp\n#include <type_traits>\n```\n\n然后，用法取决于 trait 产生的是一个类型还是一个值：\n\n- 对于产生类型的\
  \ traits，你可以按照如下方式访问类型：\n\n点击此处查看代码图片\n\n```cpp\ntypename std::trait<…>::type\n\
  std::trait_t<…>                  // 自 C++14\n```\n\n- 对于产生值的 traits，你可以按照如下方式访问该值：\n\
  \n点击此处查看代码图片\n\n```cpp\nstd::trait<…>::value\nstd::trait<…>()                 //\
  \ 隐式转换为其类型\nstd::trait_v<…>                  // 自 C++17\n```\n\n例如：\n\n点击此处查看代码图片\n\
  \n`utils/traits1.cpp`\n\n```cpp\n#include <type_traits>\n#include <iostream>\n\n\
  int main()\n{\n    int i = 42;\n    std::add_const<int>::type c = i;      // c 是\
  \ int const\n    std::add_const_t<int> c14 = i;       // 自 C++14\n    static_assert(std::is_const<decltype(c)>::value,\
  \ \"c should be const\");\n    std::cout << std::boolalpha;\n    std::cout << std::is_same<decltype(c),\
  \ int const>::value  // true\n              <<'\\n';\n    std::cout << std::is_same_v<decltype(c),\
  \ int const>      // 自 C++17\n              << '\\n';\n    if (std::is_same<decltype(c),\
  \ int const>{}) {  // 隐式转换为 bool\n      std::cout << \"same \\n\";\n    }\n}\n```\n\
  \n请参见第 40 页 的第 2.8 节，了解 `_t` 版本 traits 的定义。请参见第 83 页 的第 5.6 节，了解 `_v` 版本 traits\
  \ 的定义。\n\n#### D.1.1 std::integral_constant 和 std::bool_constant\n\n所有产生值的标准类型 traits\
  \ 都派生自助手类模板 `std::integral_constant` 的实例：\n\n点击此处查看代码图片\n\n```cpp\nnamespace std\
  \ {\n  template<typename T, T val>\n  struct integral_constant {\n    static constexpr\
  \ T value = val;      // trait 的值\n    using value_type = T;               // 值的类型\n\
  \    using type = integral_constant<T,val>;\n    constexpr operator value_type()\
  \ const noexcept {\n      return value;\n    }\n    constexpr value_type operator()\
  \ () const noexcept {  // 自 C++14\n      return value;\n    }\n  };\n}\n```\n\n\
  也就是说：\n\n- 我们可以使用 `value_type` 成员查询结果的类型。由于许多产生值的 traits 是谓词，`value_type` 通常是 `bool`。\n\
  - traits 类型的对象可以隐式转换为 trait 产生的值。\n- 在 C++14（及更高版本）中，traits 类型的对象也是函数对象（仿函数），通过“函数调用”产生它们的值。\n\
  - `type` 成员产生底层的 `integral_constant` 实例。\n\n如果 traits 产生布尔值，它们也可以使用：\n\n```cpp\n\
  namespace std {\n  template<bool B>\n  using bool_constant = integral_constant<bool,\
  \ B>; // 自 C++17\n  using true_type = bool_constant<true>;\n  using false_type =\
  \ bool_constant<false>;\n}\n```\n\n这样，如果特定属性适用，布尔 traits 就会继承自 `std::true_type`，如果不适用则继承自\
  \ `std::false_type`。这意味着它们的 `value` 成员等于 `true` 或 `false`。为结果值 `true` 和 `false`\
  \ 提供不同的类型，允许我们根据类型 traits 的结果进行标签分发（tag-dispatch），参见第 [41 页]的第 19.3.3 节 和第 [467\
  \ 页]的第 20.2 节。\n\n例如：\n\n点击此处查看代码图片\n\n`utils/traits2.cpp`\n\n```cpp\n#include <type_traits>\n\
  #include <iostream>\n\nint main()\n{\n  using namespace std;\n  cout << boolalpha;\n\
  \  using MyType = int;\n  cout << is_const<MyType>::value << '\\n'; // false\n \
  \ using VT = is_const<MyType>::value_type;  // bool\n  using T = is_const<MyType>::type;\
  \      // integral_constant<bool>\n  cout << is_same<VT, bool>::value << '\\n';\
  \ // true\n  cout << is_same<T, integral_constant<bool, false>>::value << '\\n';\
  \ // true\n  cout << is_same<T, bool_constant<false>>::value << '\\n'; // true (C++17\
  \ 之前无效)\n  auto ic = is_const<MyType>();  // trait 类型对象\n  cout << is_same<decltype(ic),\
  \ is_const<int>>::value << '\\n'; // true\n  cout << ic() << '\\n'; // 函数调用（打印 false）\n\
  \  static constexpr auto mytypeIsConst = is_const<MyType>{};\n  if constexpr(mytypeIsConst)\
  \ {  // 自 C++17 起的编译时检查 => false\n    …  // 丢弃语句\n  }\n  static_assert(!std::is_const<MyType>{},\
  \ \"MyType should not be const\");\n}\n```\n\n为非布尔 `integral_constant` 特化版本提供不同的类型，在各种元编程上下文中也有用。请参见第\
  \ [566 页]的第 24.3 节 对类似类型 `CTValue` 的讨论，以及第 [599 页]的第 25.6 节 中用于元组元素的访问。\n\n####\
  \ D.1.2 使用 traits 时应该知道的事\n\n在使用 traits 时有几点需要注意：\n\n- 类型 traits 直接应用于类型，但 `decltype`\
  \ 允许我们测试表达式、变量和函数的属性。然而，请记住，只有当实体没有额外的括号时，`decltype` 才会产生变量或函数的类型；对于任何其他表达式，它会产生一个反映表达式值类的类型。例如：\n\
  \n点击此处查看代码图片\n\n```cpp\nvoid foo (std::string&& s)\n{\n  // 检查 s 的类型\n  std::is_lvalue_reference<decltype(s)>::value\
  \  // false\n  std::is_rvalue_reference<decltype(s)>::value  // true, 按声明\n  //\
  \ 检查作为表达式的 s 值类别\n  std::is_lvalue_reference<decltype((s))::value  // true, s 被用作左值\n\
  \  std::is_rvalue_reference<decltype((s))::value  // false\n}\n```\n\n详情请参见第 [298\
  \ 页]的第 15.10.2 节。\n\n\n\n\n- 某些 trait 对于初级程序员来说可能具有非直觉的行为。示例请参见第 164 页的第 11.2.1\
  \ 节。\n- 某些 trait 有特定的要求或前提条件。违反这些前提条件会导致未定义行为。某些示例请参见第 164 页的第 11.2.1 节。\n- 许多 trait\
  \ 需要完整类型（参见第 154 页的第 10.3.1 节）。为了能够对不完整类型使用它们，我们有时可以引入模板来推迟它们的求值（详情请参见第 171 页的第\
  \ 11.5 节）。\n- 有时逻辑运算符 `&&`、`||` 和 `!` 不能用于基于其他 trait 定义新的类型 trait。此外，处理可能失败的 trait\
  \ 可能会变成问题，或至少会导致某些缺点。因此，我们提供了一些特殊的 trait，允许我们在逻辑上组合布尔 trait。详情请参见第 734 页的第 D.6 节。\n\
  - 虽然标准别名模板（以 `_t` 或 `_v` 结尾）通常很方便，但它们也有缺点，导致它们在某些元编程上下文中无法使用。详情请参见第 446 页的第 19.7.3\
  \ 节。\n\n## D.2 基础与复合类型分类\n\n我们从测试基础和复合类型分类的标准 trait 开始（参见 图 D.1）。通常，每个类型恰好属于一个基础类型分类（图\
  \ D.1 中的白色元素）。复合类型分类随后将基础类型分类合并为更高层次的概念。\n\n![Image](img/00017.jpeg)\n\n*图 D.1 基础与复合类型分类*\n\
  \n### D.2.1 测试基础类型分类\n\n本节描述了测试给定类型的基础类型分类的类型工具。对于任何给定的类型，基础类型分类中恰好有一个静态 `value`\
  \ 成员的求值结果为 `true`。该结果独立于类型是否带有 `const` 和/或 `volatile` 饰符（cv 限定）。\n\n注意，对于类型 `std::size_t`\
  \ 和 `std::ptrdiff_t`，`is_integral<>` 产生 `true`。对于类型 `std::max_align_t`，其中哪一个基础类型分类产生\
  \ `true` 是一个实现细节（因此，它可能是整数类型、浮点类型或类类型）。语言规定 lambda 表达式的类型是一种类类型（参见第 310 页的第 15.10.6\
  \ 节）。因此，对该类型应用 `is_class` 会产生 `true`。\n\n| Trait | 效果 |\n| --- | --- |\n| `is_void<T>`\
  \ | 类型 `void` |\n| `is_integral<T>` | 整数类型（包括 `bool`, `char`, `char16_t`, `char32_t`,\
  \ `wchar_t`） |\n| `is_floating_point<T>` | 浮点类型（`float`, `double`, `long double`）\
  \ |\n| `is_array<T>` | 普通数组类型（非 `std::array` 类型） |\n| `is_pointer<T>` | 指针类型（包括函数指针但不指向非静态成员的指针）\
  \ |\n| `is_null_pointer<T>` | `nullptr` 的类型（自 C++14） |\n| `is_member_object_pointer<T>`\
  \ | 指向非静态数据的指针 |\n| `is_member_function_pointer<T>` | 指向非静态成员函数的指针 |\n| `is_lvalue_reference<T>`\
  \ | 左值引用 |\n| `is_rvalue_reference<T>` | 右值引用 |\n| `is_enum<T>` | 枚举类型 |\n| `is_class<T>`\
  \ | 类/结构体或 lambda 类型，但不是 union 类型 |\n| `is_union<T>` | 联合类型 |\n| `is_function<T>`\
  \ | 函数类型 |\n\n*表 D.1 检测基础类型分类的 trait*\n\n`std::is_void<T>::value`\n- 如果类型 `T` 是（cv\
  \ 限定的）`void`，则产生 `true`。\n- 例如：点击此处查看代码图像\n```\nis_void_v<void> // true\nis_void_v<void\
  \ const> // true\nis_void_v<int> // false\nvoid f();\nis_void_v<decltype(f)> //\
  \ false (f 是函数类型)\nis_void_v<decltype(f())> // true (f 的返回类型为 void)\n```\n\n`std::is_integral<T>::value`\n\
  - 如果类型 `T` 是以下（cv 限定的）类型之一，则产生 `true`：\n    - `bool`\n    - 字符类型（`char`, `signed\
  \ char`, `unsigned char`, `char16_t`, `char32_t`, 或 `wchar_t`）\n    - 整数类型（`short`,\
  \ `int`, `long`, `long long` 的符号或无符号变体；这包含了 `std::size_t` 和 `std::ptrdiff_t`）\n\n\
  `std::is_floating_point<T>::value`\n- 如果类型 `T` 是（cv 限定的）`float`, `double` 或 `long\
  \ double`，则产生 `true`。\n\n`std::is_array<T>::value`\n- 如果类型 `T` 是（cv 限定的）数组，则产生 `true`。\n\
  - 回想一下声明为数组的参数具有指针类型。注意 `std::array<>` 不是数组类型，而是类类型。\n- 例如：点击此处查看代码图像\n```\nis_array_v<int[]>\
  \ // true\nis_array_v<int[5]> // true\nis_array_v<int*> // false\nvoid foo(int a[],\
  \ int b[5], int* c)\nis_array_v<decltype(a)> // false (a 的类型为 int**)\nis_array_v<decltype(b)>\
  \ // false (b 的类型为 int**)\nis_array_v<decltype(c)> // false (c 的类型为 int**)\n```\n\
  参见第 453 页的第 19.8.2 节。\n\n`std::is_pointer<T>::value`\n- 如果类型 `T` 是（cv 限定的）指针，则产生\
  \ `true`。\n- 这包括：\n    - 指向静态/全局（成员）函数的指针\n    - 声明为数组的参数（带或不带长度）\n- 不包括：\n    -\
  \ 成员指针类型（例如 `X::m` 的类型，其中 `X` 是类类型且 `m` 是非静态成员函数或非静态数据成员）\n    - `nullptr` 的类型，`std::nullptr_t`\n\
  - 例如：点击此处查看代码图像\n```\nis_pointer_v<int> // false\nis_pointer_v<int*> // true\nis_pointer_v<int*\
  \ const> // true\nis_pointer_v<int*&> // false\nis_pointer_v<decltype(nullptr)>\
  \ // false\nint* foo(int a[5], void(f)())\nis_pointer_v<decltype(a)> // true (a\
  \ 的类型为 int**)\nis_pointer_v<decltype(f)> // true (f 的类型为 void(*)()) \nis_pointer_v<decltype(foo)>\
  \ // false\nis_pointer_v<decltype(&foo)> // true\nis_pointer_v<decltype(foo(a,f))>\
  \ // true (返回类型 int**)\n```\n\n`std::is_null_pointer<T>::value`\n- 如果类型 `T` 是（cv\
  \ 限定的）`std::nullptr_t`，即 `nullptr` 的类型，则产生 `true`。\n- 例如：点击此处查看代码图像\n```\nis_null_pointer_v<decltype(nullptr)>\
  \ // true\nvoid* p = nullptr;\nis_null_pointer_v<decltype(p)> // false (p 类型不是 std::nullptr_t)\n\
  ```\n自 C++14 起。\n\n`std::is_member_object_pointer<T>::value`\n- 如果类型 `T` 是（cv 限定的）成员指针类型（例如对于类类型\
  \ `X` 的 `int X::*` 或 `int (X::*)()`）。\n\n`std::is_member_function_pointer<T>::value`\n\
  - 如果类型 `T` 是（cv 限定的）成员指针类型。\n\n`std::is_lvalue_reference<T>::value`\n- 如果类型 `T`\
  \ 是（cv 限定的）左值引用类型，则产生 `true`。\n\n`std::is_rvalue_reference<T>::value`\n- 如果类型 `T`\
  \ 是（cv 限定的）右值引用类型，则产生 `true`。\n\n\n\n\n\n- 例如：\n\n点击此处查看代码图像\n\n```cpp\nis_lvalue_reference_v<int>\
  \      // yields false\nis_lvalue_reference_v<int&>      // yields true\nis_lvalue_reference_v<int&&>\
  \     // yields false\nis_lvalue_reference_v<void>      // yields false\nis_rvalue_reference_v<int>\
  \      // yields false\nis_rvalue_reference_v<int&>      // yields false\nis_rvalue_reference_v<int&&>\
  \     // yields true\nis_rvalue_reference_v<void>      // yields false\n```\n\n\
  - 实现细节请参见第 452 页第 19.8.2 节。\n\n`std::is_enum<T>::value`\n\n- 如果类型 `T` 是（带 cv 限定符的）枚举类型，则返回\
  \ `true`。这同时适用于作用域枚举和非作用域枚举。\n\n- 实现细节请参见第 457 页第 19.8.5 节。\n\n`std::is_class<T>::value`\n\
  \n- 如果类型 `T` 是用 `class` 或 `struct` 声明的（带 cv 限定符的）类类型，则返回 `true`，包括实例化类模板生成的此类类型。注意，语言保证\
  \ lambda 表达式的类型是一个类类型（参见第 310 页第 15.10.6 节）。\n\n- 对于联合（union）、作用域枚举类型（尽管是用 `enum\
  \ class` 声明的）、`std::nullptr_t` 以及任何其他类型，均返回 `false`。\n\n- 例如：\n\n点击此处查看代码图像\n\n\
  ```cpp\nis_class_v<int>                  // yields false\nis_class_v<std::string>\
  \          // yields true\nis_class_v<std::string const>    // yields true\nis_class_v<std::string&>\
  \         // yields false\n\nauto l1 = []{};\nis_class_v<decltype(l1)>        //\
  \ yields true (lambda 是一个类对象)\n```\n\n- 实现细节请参见第 456 页第 19.8.4 节。\n\n`std::is_union<T>::value`\n\
  \n- 如果类型 `T` 是（带 cv 限定符的）`union`，包括由类模板模板生成的 union，则返回 `true`。\n\n`std::is_function<T>::value`\n\
  \n- 如果类型 `T` 是（带 cv 限定符的）函数类型，则返回 `true`。对于函数指针类型、lambda 表达式类型以及任何其他类型，返回 `false`。\n\
  \n- 回忆，根据语言规则声明为函数类型的参数具有指针类型。\n\n- 例如：\n\n点击此处查看代码图像\n\n```cpp\nvoid foo(void(f))()\n\
  \    is_function_v<decltype(f)> // yields false (有类型)\n    is_function_v<decltype(foo)>\
  \   // yields true\n    is_function_v<decltype(&foo)>  // yields false\n    is_function_v<decltype(foo(f))>\
  \ yields false (对于返回类型)\n}\n```\n\n- 实现细节请参见第 454 页第 19.8.3 节。\n\n### D.2. 复合分类测试\n\
  \n以下类型工具用于判断一个类型是否属于由某些基本类型并而成的更通用类别。复合类别并不构成严格的划分：一个类型可能属于多个复合类别（例如，指针类型既是标量类型也是复合类型）。在分类类型时，cv\
  \ 限定符（`const` 和 `volatile`）并不重要。\n\n`std::is_reference<T>::value`\n\n- 如果类型 `T`\
  \ 是引用类型，则返回 `true`。\n- 等于：`is_lvalue_reference_v<T> || is_rvalue_reference_v<T>`\n\
  - 实现细节请参见第 452 页第 19.8.2 节。\n\n| 特性 | 效果 |\n| :--- | :--- |\n| `is_reference<T>`\
  \ | 左值引用或右值引用 |\n| `is_member_pointer<T>` | 静态成员的指针 |\n| `is_arithmetic<T>` | 整数类型（包括\
  \ `bool` 和字符）或浮点类型 |\n| `is_fundamental<T>` | `void`、整数类型（包括 `bool` 和字符）、浮点类型或 `std::nullptr_t`\
  \ |\n| `is_scalar<T>` | 整数类型（包括 `bool` 和字符）、浮点类型、指针、成员指针以及 `std::nullptr_t` |\n\
  | `is_object<T>` | 除 `void`、函数或引用之外的任何类型 |\n| `is_compound<T>` | `is_fundamental<T>`\
  \ 的反面：数组、联合、类、函数、指针或成员指针 |\n\n#### 转换为复合类别的特性\n\n`std::is_member_pointer<T>::value`\n\
  \n- 如果类型 `T` 是任何成员指针，则返回 `true`。\n- 等于：`!(is_object_pointer_v<T> || is_function_pointer_v<T>)`\n\
  \n`std::is_arithmetic<T>::value`\n\n- 如果类型 `T` 是整数类型或浮点类型，则返回 `true`。\n\n`std::is_fundamental<T>::value`\n\
  \n- 如果类型 `T` 是基本类型、`void`或 `std::nullptr_t`，则返回 `true`。\n- 等于：`is_arithmetic<T>\
  \ || is_void<T> || is_nullptr_t<T>`\n- 实现细节请参见第 452 页第 19.8.2 节。\n\n`std::is_scalar<T>::value`\n\
  \n- 如果类型 `T` 是整数类型、浮点类型、指针、成员指针或 `std::nullptr_t`，则返回 `true`。\n\n`std::is_object<T>::value`\n\
  \n- 如果类型 `T` 不是 `void`、函数或引用，则返回 `true`。\n- 等于：`is_scalar<T> || is_array<T> || is_union<T>\
  \ || is_class<T>`\n\n`std::is_compound<T>::value`\n\n- 如果类型 `T` 是数组、联合、类、函数、指针或成员指针，则返回\
  \ `true`。\n- 等于：`!is_fundamental<T>`\n\n### D.3. 类型属性与操作\n\n下一组特性测试了类型的其他属性以及适用于它们的操作（例如值交换）。\n\
  \n#### D.3.1 其他类型属性\n\n`std::is_signed<T>::value`\n\n- 如果类型 `T` 是有符号算术类型（即包含负数的算术类型，如\
  \ `int`、`float`），则返回 `true`。\n- 对于 `bool`，返回 `false`。\n- 对于 `char`，返回 `true` 还是\
  \ `false` 取决实现。\n- 对于所有非算术类型（枚举类型），`is_signed` 返回 `false`。\n\n`std::is_unsigned<T>::value`\n\
  \n- 如果类型 `T` 是无符号算术类型（即不包含负数的算术类型，如 `unsigned int` 和 `bool`），则返回 `true`。\n- 对于 `char`，返回\
  \ `true` 还是 `false` 取决实现。\n- 对于所有非算术类型（枚举类型），`is_unsigned` 返回 `false`。\n\n`std::is_const<T>::value`\n\
  \n- 如果类型带有 `const` 限定符，则返回 `true`。\n- 注意，`const` 指针具有 `const` 限定类型，而非 `const` 指针或\
  \ `const` 类型的引用不是 `const` 限定类型。例如：\n\n点击此处查看代码图像\n\n```cpp\nis_const<int* const>\
  \ // yields true\nis_const<int const*>  // yields false\nis_const<int const&> //\
  \ yields false\n```\n\n字体 语言规定，如果元素类型是 `const`，则数组也是 `const` 限定的。参见 5）。例如：\n\n点击此处查看代码图像\n\
  \n```cpp\nis_const<int[3]>      // yields false\nis_const<int const[3]> // yields\
  \ true\n```\n\n\n\n\n\n`is_const<int[]>::value` // false\n`is_const<int const[]>::value`\
  \ // true\n\n| 特性 | 效果 |\n| --- | --- |\n| `is_signed<T>` | 有符号算术类型 |\n| `is_unsigned<T>`\
  \ | 无符号算术类型 |\n| `is_const<T>` | `const` 限定符\n| `is_volatile<T>` | `volatile` 限定符\
  \ |\n| `is_aggregate<T>` | 聚合类型（自 C++17 起） |\n| `is_trivial<T>` | 标量类型、平凡类或此类类型的数组\
  \ |\n| `is_trivially_copyable<T>` | 标量类型、平凡可拷贝的类或此类类型的数组 |\n| `is_standard_layout<T>`\
  \ | 标量类型、标准布局类或此类类型的数组 |\n| `is_pod<T>` | 简单旧数据类型（可以使用 `memcpy()` 复制对象的类型） |\n|\
  \ `is_literal_type<T>` | 标量类型、引用、类或此类类型的数组（自 C++17 起弃用） |\n| `is_empty<T>` | 没有成员、虚成员函数或虚基类的的类\
  \ |\n| `is_polymorphic<T>` | 拥有（派生的）虚成员函数的类 |\n| `is_abstract<T>` | 抽象类（至少有一个纯虚函数）\
  \ |\n| `is_final<T>` | 最终类（自 C++14 起不允许被派生的类） |\n| `has_virtual_destructor<T>` |\
  \ 拥有虚析构函数的类 |\n| `has_unique_object_representations<T>` | 任何两个具有相同值的对象在内存中的表示相同（自\
  \ C++17 起） |\n| `alignment_of<T>` | 等于 `alignof(T)` |\n| `rank<T>` | 数组类型的维度数量（或\
  \ `0`） |\n| `extent<T, I=0>` | 维度 `I` 的范围（或 `0`） |\n| `underlying_type<T>` | 枚举类型的底层类型\
  \ |\n| `is_invocable<T, Args...>` | 可作为 `Args...` 的调用对象使用（自 C++17 起） |\n| `is_nothrow_invocable<T,\
  \ Args...>` | 可在不抛异常的情况下作为 `Args...` 的调用对象使用（自 C++17 起） |\n| `is_invocable_r<RT,\
  \ T, Args...>` | 可作为返回 `RT` 的 `Args...` 调用对象使用（自 C++17 起） |\n| `is_nothrow_invocable_r<RT,\
  \ T, Args...>` | 可在不抛异常的情况下作为返回 `RT` 的 `Args...` 调用对象使用（自 C++17 起） |\n| `invoke_result<T,\
  \ Args...>` | 作为 `Args...` 调用时的结果类型（自 C++17 起） |\n| `result_of<F, ArgTypes>` | 使用参数类型\
  \ `ArgTypes` 调用 `F` 的结果类型（自 C++17 起弃用） |\n\n### 表 D.3 测试简单类型特性的特性\n\n#### `std::is_volatile<T>::value`\n\
  \n- 如果类型具有 `volatile` 限定符，则返回 `true`。\n- 注意，`volatile` 指针具有 `volatile` 限定类型，而非 `volatile`\
  \ 指针或指向 `volatile` 类型的引用并非 `volatile` 限定类型。例如：\n\n```cpp\nis_volatile<int* volatile>::value\
  \ // true\nis_volatile<int volatile*>::value // false\nis_volatile<int volatile&>::value\
  \ // false\n```\n\n- 语言规定如果元素类型具有 `volatile` 限定符，则数组也具有 `volatile` 限定符。例如：\n\n```cpp\n\
  is_volatile<int[3]>::value // false\nis_volatile<int volatile[3]>::value // true\n\
  is_volatile<int[]>::value // false\nis_volatile<int volatile[]>::value // true\n\
  ```\n\n#### `std::is_aggregate<T>::value`\n\n- 如果 `T` 是一个聚合类型（无论是数组，还是没有用户定义、显式或继承构造函数、没有私有或保护非静态成员、没有虚函数且没有虚基类的类/结构体/联合体），则返回\
  \ `true`。\n- 有助于判断是否需要列表初始化。例如：\n\n```cpp\ntemplate<typename Coll, typename... T>\n\
  void insert(Coll& coll, T&&... val) {\n    if constexpr(!std::is_aggregate_v<typename\
  \ Coll::value_type>) {\n        coll.emplace_back(std::forward<T>(val));\n    }\
  \ else {\n        coll.emplace_back(typename Coll::value_type{std::forward<T>(val)});\n\
  \    }\n}\n```\n\n- 要求给定的类型是完整的或 `cv` 限定的 `void`。自 C++17 起可用。\n\n#### `std::is_trivial<T>::value`\n\
  \n- 如果该类型是“平凡”类型，则返回 `true`：\n    - 标量类型（整数、浮点数、枚举、指针）\n    - 平凡类（没有虚函数、没有虚基类、没有（间接）用户定义的默认构造函数、拷贝/移动构造函数、拷贝/移动赋值运算符或析构函数、没有非静态数据成员的初始化器、没有\
  \ `volatile` 成员且没有非平凡成员的类）\n    - 此类类型的数组\n    - 以及这些类型的 `cv` 限定版本\n- 如果 `is_trivially_copyable_v<T>`\
  \ 返回 `true` 且存在平凡默认构造函数，则返回 `true`。\n- 要求给定的类型是完整的或 `cv` 限定的 `void`。\n\n#### `std::is_trivially_copyable<T>::value`\n\
  \n- 如果该类型是“平凡可拷贝”类型，则返回 `true`：\n    - 标量类型（整数、浮点数、枚举、指针）\n    - 平凡类（没有虚函数、没有虚基类、没有（间接）用户定义的默认构造函数、拷贝/移动构造函数、拷贝/移动赋值运算符或析构函数、没有非静态数据成员的初始化器、没有\
  \ `volatile` 成员且没有非平凡成员的类）\n    - 此类类型的数组\n    - 以及这些类型的 `cv` 限定版本\n- 与 `is_trivial_v<T>`\
  \ 相同，不同在于它可以为没有平凡默认构造函数的类类型产生 `true`。\n- 与 `is_standard_layout<>` 不同，它允许 `volatile`\
  \ 成员，允许引用，成员可能有不同的访问权限，且成员可能分布在不同的（基）类中。\n- 要求给定的类型是完整的或 `cv` 限定的 `void`。\n\n####\
  \ `std::is_standard_layout<T>::value`\n\n- 如果该类型具有标准布局，则返回 `true`。例如，这使得更容易与其他语言交换此类型的值：\n\
  \    - 标量类型（整数、浮点数、枚举、指针）\n    - 标准布局类类型（没有虚函数、没有虚基类、没有非静态引用成员、所有非静态成员都在用以相同访问权限定义的同一个（基）类中，且所有成员也是标准布局类型）\n\
  \    - 此类类型的数组\n    - 以及这些类型的 `cv` 限定版本\n- 与 `is_trivial<>` 不同，允许 `volatile` 成员，不允许引用，成员可能有不同的访问权限，且成员可能分布在不同的（基）类中。\n\
  - 要求给定的类型（对于数组，为基本类型）是完整的或 `cv` 限定的 `void`。\n\n#### `std::is_pod<T>::value`\n\n\
  - 如果 `T` 是简单旧数据类型 (POD)，则返回 `true`。\n- 此类类型的对象可以通过拷贝底层存储来复制（例如，使用 `memcpy()`）。\n\
  - 等同于：`is_trivial_t<T> && is_standard_layout_v<T>`\n- 对于以下情况返回 `false`：\n    - 没有平凡默认构造函数、拷贝/移动构造函数、拷贝/移动赋值或析构函数的类\n\
  \    - 拥有虚成员或虚基类的类\n    - 拥有 `volatile` 或引用成员的类\n    - 成员在不同（基）类中或具有不同访问权限的类\n \
  \   - lambda 表达式的类型（称为*闭包类型*）\n    - 函数\n    - `void`\n    - 由这些类型组成的类型\n\n\n\n\n\
  \n- 要求给定的类型是完整的（参见第 154 页的第 10.3.1 节）或（带有 cv 限定符的）`void`。\n\n`std::is_literal_type<T>::value`\n\
  \n- 如果给定的类型是 `constexpr` 函数的有效返回类型（这显著排除了任何需要非平凡析构函数的类型），则返回 `true`。\n- 如果 `T` 是字面量类型，则返回\
  \ `true`：\n    - 标量类型（整数、浮点数、枚举、指针；参见第 707 页的 `is_scalar()`）\n    - 引用\n    - 类类型，其具有至少一个\
  \ `constexpr` 构造函数，且该构造函数在每个（基）类中都不是拷贝/移动构造函数；在任何（基）类或成员中都没有用户定义或虚析构函数，并且每个非静态数据成员的初始化都是常量表达式\n\
  \    - 此类类型的数组\n- 要求给定的类型是完整的（参见第 154 页的第 10.3.1 节）或（带有 cv 限定符的）`void`。\n- 注意，该性质自\
  \ C++17 起被弃用，因为“它太弱了，无法在泛型代码中有意义地使用。真正我们需要知道特定构造会产生常量初始的能力。”\n\n`std::is_empty<T>::value`\n\
  \n- 如果 `T` 是类类型但不是联合类型，且其对象不包含数据，则返回 `true`。\n- 如果 `T` 定义为 `class` 或 `struct` 且满足以下条件，则返回\
  \ `true`：\n    - 除了长度为 0 的位域外没有非静态数据成员\n    - 没有虚成员函数\n    - 没有虚基类\n    - 没有非空基类\n\
  - 如果 `T` 是 `class`/`struct`，则要求给定的类型是完整的（参见第 154 页的第 10.3.1 节）（不完整的 `union` 是允许的）。\n\
  \n`std::is_polymorphic<T>::value`\n\n- 如果 `T` 是多态类类型（声明或继承了虚函数的类），则返回 `true`。\n\
  - 要求给定的类型是完整的（参见第 154 页的第 10.3.1 节）或既不是 `class` 也不是 `struct`。\n\n`std::is_abstract<T>::value`\n\
  \n- 如果 `T` 是抽象类类型（由于具有至少一个纯虚成员函数而无法创建对象的类），则返回 `true`。\n- 如果 `T` 是 `class`/`struct`，则要求给定的类型是完整的（参见第\
  \ 154 页的第 10.3.1 节）（不完整的 `union` 是允许的）。\n\n`std::is_final<T>::value`\n\n- 如果 `T`\
  \ 是最终类类型（由于被声明为 `final` 而不能作为基类的类或联合），则返回 `true`。\n- 对于所有非类/联合类型（如 `int`），返回 `false`（因此，这与\
  \ `is derivable` 等操作不同）。\n- 要求给定的类型 `T` 是完整的（参见第 154 页的第 10.3.1 节）或既不是 `class`/`struct`\
  \ 也 `union`。\n- 自 C++14 起。\n\n`std::has_virtual_destructor<T>::value`\n\n- 如果类型\
  \ `T` 具有虚析构函数，则返回 `true`。\n- 如果 `T` 是 `class`/`struct`，则要求给定的类型是完整的（参见第 154 页的第\
  \ 10.3.1 节）（不完整的 `union` 是允许的）。\n\n`std::has_unique_object_representations<T>::value`\n\
  \n- 如果类型 `T` 的任意两个对象在内存中具有相同的对象表示，则返回 `true`。也就是说，两个相同的值始终使用相同的字节序列表示。\n- 具有此属性的对象可以通过哈希相关的字节序列来产生可靠的哈希值（不存在某些不参与对象值的位在不同情况下可能存在不同的风险）。\n\
  - 要求给定的类型是平易拷贝的（参见第 712 页的第 D.3.1 节）并且是完整的（参见第 154 页的第 10.3.1 节）或（带有 cv 限定符的）`void`\
  \ 或未知边界的数组。\n- 自 C++17 起。\n\n`std::alignment_of<T>::value`\n\n- 返回类型 `T` 对象的对齐值，类型为\
  \ `size_t`（对于数组为元素类型；对于引用为被引类型）。\n- 与 `alignof(T)` 相同。\n- 该性质在 C++11 中 `alignof()`\
  \ 构造之前引入。然而，它仍然很有用，因为该性质可以作为类类型传递，这对于元编程非常有用。\n- 要求 `alignof(T)` 是有效表达式。\n- 使用 `aligned_union<>`\
  \ 获取多个类型的公共对齐方式（参见第 733 页的第 D.5 节）。\n\n`std::rank<T>::value`\n\n- 返回类型 `T` 数组的维度，类型为\
  \ `size_t`。\n- 对于所有其他类型返回 `0`。\n- 指针没有任何维度。数组类型中的未指定边界会指定一个维度。按照惯例，数组类型的函数参数没有实际类型，且\
  \ `std::array` 不是数组类型。\n\n例如：\n```cpp\nint a2[5][7];\nrank_v<decltype(a2)>; // 返回\
  \ 2\nrank_v<int*>; // 返回 0（无数组）\nextern int p1[];\nrank_v<decltype(p1)>; // 返回 1\n\
  ```\n\n`std::extent<T>::value`\n`std::extent<T, IDX>::value`\n\n- 返回类型 `T` 数组的第一维或第\
  \ `IDX` 维的大小，类型为 `size_t`。\n- 如果 `T` 不是数组、维度不存在或该维度的大小未知，则返回 `0`。\n- 实现细节请参见第 453\
  \ 页的第 19.8.2 节。\n\n例如：\n```cpp\nint a2[5][7];\nextent_v<decltype(a2)>; // 返回 5\n\
  extent_v<decltype(a2),1>; // 返回 7\nextent_v<decltype(a2),2>; // 返回 0\nextent_v<int*>;\
  \ // 返回 0\nextern int p1[];\nextent_v<decltype(p1)>; // 返回 0\n```\n\n`std::underlying_type<T>::type`\n\
  \n- 返回枚举类型 `T` 的底层类型。\n- 要求给定的类型是完整的（参见第 154 页的第 10.3.1 节）枚举类型。对于所有其他类型，行为未定义。\n\
  \n`std::is_invocable<T, Args...>::value`\n`std::is_nothrow_invocable<T, Args...>::value`\n\
  \n- 如果 `T` 可以作为 `Args...` 的调用者（保证不抛出异常），则返回 `true`。\n- 也就是说，我们可以使用这些性质来测试是否可以调用或\
  \ `invoke()` 给定的调用者 `T` 并传入 `Args...`。（关于调用者和 `invoke()` 的细节请参见第 157 页的第 11.1 节。）\n\
  - 要求所有给定类型都是完整的（参见第 154 页的第 10.3.1 节）或（带有 cv 限定符的）`void` 或未知边界的数组。\n- 例如：\n```cpp\n\
  struct C {\n  bool operator() (int) const {\n    return true;\n  }\n};\nstd::is_invocable<C>::value;\
  \ // false\nstd::is_invocable<C,int>::value; // true\nstd::is_invocable<int*>::value;\
  \ // false\nstd::is_invocable<int(*)()>::value; // true\n```\n- 自 C++17 起。\n\n`std::is_invocable_r<RET_T,\
  \ T, Args...>::value`\n`std::is_nothrow_invocable_r<RET_T, T, Args...>::value`\n\
  \n- 如果 `T` 可以作为 `Args...` 的调用者（保证不抛出异常），并返回一个可转换为类型 `RET_T` 的值，则返回 `true`。\n\n\n\
  \n\n\n-   也就是说，我们可以使用这些属性来测试是否可以对于 `Args…` 调用或 `std::invoke()` 传入的可调用对象 `T`，并将返回值作为\
  \ `RET_T`。（有关可调用对象和 `std::invoke()` 的细节，请参阅第 [157] 页的 11.1 节。）\n\n-   要求所有传入的类型都是完整类型（请参阅第\
  \ [154] 页的 10.3.1 节），或（经过 cv 限定的）`void` 或未知边界的数组。\n\n-   例如：\n\n点击此处查看代码图片\n\n```cpp\n\
  struct C {\n  bool operator() (int) const {\n    return true;\n  }\n};\n\nstd::is_invocable_r<bool,C,int>::value\
  \              //true\nstd::is_invocable_r<int,C,long>::value              //true\n\
  std::is_invocable_r<void,C,int>::value              //true\nstd::is_invocable_r<char*,C,int>::value\
  \            //false\nstd::is_invocable_r<long,int(*)(int)>::value        //false\n\
  std::is_invocable_r<long,int(*)(int),int>::value    //true\nstd::is_invocable_r<long,int(*)(int),double>::value\
