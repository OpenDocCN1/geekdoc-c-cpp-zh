  \ for the call to:\n\n点击此处查看代码图片\n\n```cpp\nconst main()::MyCustomerHash (const\
  \ Customer&)\n```\n\nin the instantiation of:\n\n点击此处查看代码图片\n\n```cpp\nnoexcept(declval<const\
  \ _Hash&>()(declval<const _Key&>()))>\n         ~~~~~~~~~~~~~~~~~~~~~~~^~~~~~~~~~~~~~~~~~~~~~~~\n\
  ```\n\n(`declval<const _Hash&>()` is an expression of type `main()::MyCustomerHash`).\
  \ A possible “near match” candidate is:\n\n点击此处查看代码图片\n\n```cpp\nstd::size_t main()::MyCustomerHash::operator()(const\
  \ Customer&)\n```\n\nwhich is declared as:\n\n点击此处查看代码图片\n\n```cpp\nstd::size_t\
  \ operator() (const Customer& c) {\n    ^~~~~~~~\n```\n\nand the last note says\
  \ something about the problem:\n\n点击此处查看代码图片\n\n```text\npassing ’const main()::MyCustomerHash*’\
  \ as ’this’ argument discards qualifiers\n```\n\nCan you see what the problem is?\
  \ This implementation of the `std::unordered_set` class template requires that the\
  \ function call operator for the hash object be a `const` member function (see also\
  \ Section 11.1.1 on page 159). When that’s not the case, an error arises deep in\
  \ the guts of the algorithm.\n\nAll other error messages cascade from the first\
  \ and go away when a `const` qualifier is simply added to the hash function operator:\n\
  \n点击此处查看代码图片\n\n```cpp\nstd::size_t operator() (const Customer& c) const {\n…\n\
  }\n```\n\nClang 3.9 gives the slightly better hint at the end of the first error\
  \ message that `operator()` of the hash functor is not marked `const`:\n\n点击此处查看代码图片\n\
  \n```text\nerrornovel2.cpp:28:47: note: in instantiation of template class ’std::unordered_set<Customer\n\
  , MyCustomerHash, std::equal_to<Customer>, std::allocator<Customer> >’ requested\
  \ here\n  std::unordered_set<Customer,MyCustomerHash> coll;\n                  \
  \                             \n```\n\n\n\n\n在 C++ 中，结构体（struct）、类（class）和联合体（union）统称为\
  \ `class types`（类类型）。在没有额外说明的情况下，文本中的“类”一词是指通过 `class` 关键字或 `struct` 关键字引入的类类型。特别注意，“类类型”包含联合体，但“类”不包含。\n\
  \n关于作为模板的类如何称呼存在一些混淆：\n\n- `class template`（类模板）术语表示该类是一个模板。也就是说，它对一组类进行的参数化描述。\n\
  - 另一方面，`template class` 术语已被用于：\n    - 作为 `class template` 的同义词。\n    - 指代从模板生成的类。\n\
  \    - 指代名称为 `template-id` 的类（即模板名后跟 `<` 和 `>` 之间指定的模板参数）。\n\n第二种和第三种含义之间的区别有些微妙，且对于本文的后续内容并不重要。\n\
  \n由于这种不精确性，我们在书中避免使用 `template class` 术语。\n\n类似地，我们使用 `function template`（函数模板）、`member\
  \ template`（成员模板）、`member function template`（成员函数模板）和 `variable template`（变量模板），但避免使用\
  \ `template function`、`template member`、`template member function` 和 `template variable`。\n\
  \n### 10.2 替换、实例化与特化\n\n在处理使用模板的源代码时，C++ 编译器必须在各种时候 `substitute`（替换）具体的模板参数以替换模板中的模板参数。有时，这种替换只是尝试性的：编译器可能需要检查替换是否有效（参见参见第\
  \ 129 页的 8.4 节和第 284 页的 15.7 节）。\n\n通过用具体参数替换模板参数，从而为普通类、类型别名、函数、成员函数或变量实际创建一个 `definition`（定义）的过程被称为\
  \ `template instantiation`（模板实例化）。\n\n令人惊讶的是，目前还没有标准或公认的术语来表示这种通过模板参数替换创建非定义 `declaration`（声明）的过程。我们见过某些团队使用\
  \ `partial instantiation`（部分实例化）或 `instantiation of a declaration`（声明的实例化）等短语，但这些并非通用。也许一个更直观的术语是\
  \ `incomplete instantiation`（不实例化，在类模板的情况下，它会产生一个不完整的类）。\n\n由实例化或不实例化产生的实体（即类、函数、成员函数或变量）通统称为\
  \ `specialization`（特化）。\n\n然而，在 C++ 中，实例化过程并不是产生特化的唯一方法。替代机制允许程序员显式指定一个与模板参数的特殊替换绑定的声明。正如我们在第\
  \ 31 页的 2.5 节所示的，这种特化是用 `template<>` 前缀引入的：\n\n```cpp\ntemplate<typename T1, typename\
  \ T2> // 主类模板\nclass MyClass {\n};\n\ntemplate<> // 显式特化\nclass MyClass<string,\
  \ float> {\n};\n```\n\n```\n严格来说，这被称为 `explicit specialization`（显式特化，相对于 `instantiated`\
  \ 或 `generated specialization` 特化）。正如第 33 页的 2.6 节所述，仍然具有模板参数的特化被称为 `partial specializations`（部分特化）：\n\
  \n```cpp\ntemplate<typename T> // 部分特化\nMyClass<T, T> {\n};\n\ntemplate<typename\
  \ T> // 部分特化\nMyClass<bool, T> {\n};\n```\n\n在谈论（显式或部分）特化时，通用模板也被称为 `primary template`（主模板）。\n\
  \n### 10.3 声明与定义\n\n到目前为止，`declaration`（声明）和 `definition`（定义）这两个词在书中仅使用了几次。然而，这些词在\
  \ C++ 中带有精确的含义，而这正是我们使用的含义。\n\n`declaration` 是一种 C++ 结构，用于在 C++ 作用域引入或重新引入一个名称。这种引入总是包含对该名称的部分分类，但不需要详细信息来形成有效的声明。例如：\n\
  \n```cpp\nclass C; // 声明 C 为类\nvoid f(int p); // 声明 f() 为函数，p 为命名参数\nextern int\
  \ v; // 声明 v 为变量\n```\n\n注意，尽管它们有“名称”，但宏定义和 `goto` 标签在 C++ 中不被视为声明。\n\n当结构的细节变得为人知时，或者在变量的情况下必须分配存储空间时，声明就变成了\
  \ `definitions`（定义）。对于类类型定义，这意味着必须提供一个大括号包围的体。对于函数定义，这意味着必须提供一个大括号包围的体（通常情况下），或者函数必须被指定为\
  \ `= default` 或 `= delete`。对于变量，初始化或缺少 `extern` 限定符会导致声明变成定义。以下是补充上述非定义声明的示例：\n\n\
  ```cpp\nclass C {}; // 类 C 的定义（及声明）\nvoid f(int p) { // 函数 f() 的定义（及声明）\n    std::cout\
  \ << p << '\\n';\n}\nextern int v = 1; // 初始化器使其成为 v 的定义\nint w; // 前面没有 extern\
  \ 的全局变量声明也是定义\n```\n\n以此此类推，类模板或函数模板的声明如果具有体，则被称为定义。因此，\n\n```cpp\ntemplate<typename\
  \ T>\nvoid func (T); // 是非定义的声明\n```\n\n而\n\n```cpp\ntemplate<typename T>\nclass\
  \ S {}; // 实际上是一个定义\n```\n\n#### 10.3.1 完整类型与不完整类型\n\n类型可以是 `complete`（完整的）或 `incomplete`（不完整的），这是一个与\
  \ `declaration` 和 `definition` 区别密切的概念。某些语言结构需要 `complete types`，而其他结构对 `incomplete\
  \ types` 也有效。\n\n不完整类型是以下之一：\n- 已声明但未定义的类型。\n- 边界未数组类型。\n- 元素类型不完整的数组类型。\n- `void`\n\
  - 只要未定义底层类型或枚举值的枚举类型。\n- 应用于上述任何类型的 `const` 或 `volatile`。\n\n所有其他类型都是 `complete`。例如：\n\
  \n```cpp\nclass C; // C 是不完整类型\nC const* cp; // cp 是指向不完整类型的指针\nextern C elems[10];\
  \ // elems 是不完整类型\nextern int arr[]; // arr 是不完整类型\n...\nclass C { }; // C 现在是完整类型（因此\
  \ cp 和 elems 不再引用不完整类型）\nint arr[10]; // arr 现在具有完整类型\n```\n\n有关如何在模板中处理不完整类型的提示，请参见第\
  \ 171 页的 11.5 节。\n\n### 10.4 单一定义规则\n\n\n\n\n[content]\n\nC++ 语言定义对各种实体的重新定义施加了一些限制。这些限制的总称为“单一定义规则”（`one-definition\
  \ rule`，简称 `ODR`）。该规则的细节相当复杂，涵盖了大量情况。后续章节将阐述在每个适用语文中产生的各种方面，你可以在附录 A 中找到 ODR 的完整描述。目前，记住以下\
  \ ODR 基础知识就足够：\n\n• 普通（即非模板的）非内联（noninline）函数和成员函数，以及（非内联的）全局变量和静态数据成员在整个 `program`（程序）中只能定义一次。^(3)\n\
  \n• 类类型（包括结构体和联合体）、模板（包括部分特化但不包括完全特化）以及内联函数和变量在每个 `translation unit`（编译单元）中最多定义一次，且所有这些定义应该是相同的。\n\
  \n`translation unit` 是源文件经过预处理后的结果；也就是说，它包含了由 `#include` 指令命名的内容以及宏展开产生的内容。\n\n\
  在本书的剩余部分中，`linkable entity`（可链接实体）指的是以下任何一项：函数或成员函数、全局变量或静态数据成员，包括从模板生成的任何此类实体，且这些实体对链接器可见的。\n\
  \n### 10.5 模板参数与模板参数\n\n比较以下类模板：\n\n点击此处查看代码图片\n\n```cpp\ntemplate<typename T, int\
  \ N>\nclass ArrayInClass {\n  public:\n    T array[N];\n};\n```\n\n与一个类似的普通类进行比较：\n\
  \n点击此处查看代码图片\n\n```cpp\nclass DoubleArrayInClass {\n  public:\n    double array[10];\n\
  };\n```\n\n如果我们将参数 `T` 和 `N` 分别替换为 `double` 和 `10`，后者本质上就等同于前者。在 C++ 中，这种替换的名称表示为\
  \ `ArrayInClass<double,10>`。\n\n注意模板名称后面跟着尖括号中的 `template arguments`（模板参数）。\n\n\
  无论这些参数本身是否依赖于模板参数，模板名称加上尖括号中的参数的组合被称为 `template-id`（模板标识符）。\n\n该名称可以像使用相应的非模板实体一样使用。例如：\n\
  \n点击此处查看代码图片\n\n```cpp\nint main()\n{\n    ArrayInClass<double,10> ad; ad.array[0]\
  \ = 1.0;\n}\n```\n\n区分 `template parameters`（模板参数）和 `template arguments`（模板实参数）至关重要的。简而言之，你可以说“参数是由参数初始化的”。^(4)\
  \ 或者更准确地说：\n\n• `template parameters` 是在模板声明或定义中关键字 `template` 之后列出的名称（我们示例中的 `T`\
  \ 和 `N`）。\n\n• `template arguments` 是替换模板参数的项（我们示例中的 `double` 和 `10`）。与模板参数不同，模板实参数不仅仅是“名称”。\n\
  \n当使用 `template-id` 指明时，用模板实参数替换模板参数是显式的，但在各种情况下，这种替换是隐式的（例如，如果模板参数被它们的默认参数替换）。\n\
  \n一个基本原则是，任何模板实参数必须是一个可以在编译时确定的数量或值。正如后文将变得清晰，这一要求为模板实体的运行时成本带来了巨大的收益。由于模板参数最终会被编译时值替换，它们本身可以用于形成编译时表达式。这在\
  \ `ArrayInClass` 模板中被利用，用于确定成员数组 `array` 的大小。数组的大小必须是一个 `constant-expression`（常量表达式），而模板参数\
  \ `N` 正符合这一要求。\n\n我们可以将这一推理进一步推向：由于模板参数是编译时实体，它们也可以被用于创建有效的模板实参数。这是一个例子：\n\n点击此处查看代码图片\n\
  \n```cpp\ntemplate<typename T>\nclass Dozen {\n  public:\n    ArrayInClass<T,12>\
  \ contents;\n};\n```\n\n注意在这个示例中，名称 `T` 既是模板参数又是模板实参数。因此，存在一种机制能够从更简单的模板构建更复杂的模板。当然，这与允许我们组合类型和函数的机制在本质上没有区别。\n\
  \n### 10.6 总结\n\n• 分别使用 `class template`、`function template` 和 `variable template`\
  \ 处理模板类型的类、函数和变量。\n\n• `template instantiation`（模板实例化）是通过用具体的 `arguments` 替换模板 `parameters`\
  \ 来创建普通类或函数的过程。生成的实体是一个 `specialization`（特化化版本）。\n\n• 类型可以是完整的，也可以是不完整的。\n\n• 根据单一定义规则\
  \ (ODR)，非内联函数、成员函数、全局变量和静态数据成员在整个程序中只能定义一次。\n\n^(1) 在 C++ 中，`class` 和 `struct` 之间的唯一区别是\
  \ `class` 的默认访问权限是 `private`，而 `struct` 的默认访问权限是 `public`。然而，我们倾向于对使用新 C++ 特性的类型使用\
  \ `class`，而对可以作为“纯旧数据”（POD）的普通数据结构使用 `struct`。\n\n^(2) 默认函数是由编译器提供默认实现的特殊成员函数，例如默认构造函数。\n\
  \n^(3) 全局和静态变量及成员从 C++17 开始可以定义为 `inline`。这消除了在一个编译单元中定义一次的要求。\n\n^(4) 在学术界中，`arguments`\
  \ 有时被称为实参数，而 `parameters` 称为形式参数。\n\n# 第 11 章 通用库\n\n到目前为止，我们对模板的讨论集中在它们的特定功能、能力和限制，并以这些任务和应用为目标（我们作为应用程序程序员遇到的类型类型）。然而，模板在编写通用库和框架时最为有效，此时我们的设计必须考虑广泛不受限制的潜在用途。虽然书中的几乎所有内容都适用于此类设计，但在编写旨在用于尚未定义类型的可移植组件时，你应该考虑以下一些通用问题。\n\
  \n### 11.1 可调用实体\n\n许多库包含了接口，客户端代码向其传递必须被“调用”的实体。示例包括必须在另一个线程执行的操作、描述如何哈希值以将其存储在哈希表中的函数、描述集合中元素排序的对象，以及提供某些默认参数值的通用包装器。标准库在这并不例外：它定义了许多接受此类可调用实体的组件。\n\
  \n在这种背景下使用的术语之一是 `callback`（回调）。传统上该术语被留给作为函数调用参数传递的实体（而不是，例如模板参数），我们保持了这一传统。\n\n\
  [/content]\n\n\n\n在 C++ 中，有几种类型非常适合作为回调函数，因为它们既可以作为函数参数传递，也可以直接通过 `f(`…`)` 的语法进行调用：\n\
  \n- 函数指针类型\n- 重载了 `operator()` 的类类型（有时称为函数对象，`functors`），包括 lambda 表达式\n- 具有产生函数指针或函数引用的转换函数的类类型\n\
  \n这些类型统称为`函数对象类型`（function object types），该类型的值被称为`函数对象`（function object）。157\n\n\
  C++ 标准库引入了概念稍微宽泛一点的`可调用类型`（callable type），它可以是函数对象类型或成员指针。可调用类型的对象是一个`可调用对象`（callable\
  \ object），为了方便起见，我们称之为`可调用对象`（callable）。\n\n泛型代码通常受益于接受任何类型的可调用对象，而模板使得这成为可能。\n\n\
  #### 11.1.1 支持函数对象\n\n让我们看看标准库中的`for_each()`算法是如何实现的（我们使用自己的名称 `foreach` 以避免命名冲突，并为了简单起见跳过了返回值）：\n\
  \n点击此处查看代码图片\n\n*basics/foreach.hpp*\n\n```cpp\ntemplate<typename Iter, typename\
  \ Callable>\nvoid foreach (Iter current, Iter end, Callable op)\n{\n    while (current\
  \ != end) {\n        // 只要没有到达末尾\n        op(*current);             // 为当前元素调用传递的运算符\n\
  \        ++current;               //并将迭代器移动到下一个元素\n    }\n}\n```\n\n下面的程序演示了该模板与各种函数对象配合使用：\n\
  \n点击此处查看代码图片\n\n*basics/foreach.cpp*\n\n```cpp\n#include <iostream>\n#include <vector>\n\
  #include \"foreach.hpp\"\n\n// 一个可以调用的函数：\nvoid func(int i)\n{ \n    std::cout <<\
  \ \"func() called for:  \" << i << '\\n';\n}\n\n// 一个函数对象类型（可以作为函数使用的对象）：\nclass\
  \ FuncObj {\n  public:\n    void operator() (int i) const { // 注意：const 成员函数\n \
  \       std::cout << \"FuncObj::op() called for:      \" << i << '\\n';\n    }\n\
  };\n\nint main()\n{\n    std::vector<int> primes = { 2, 3, 5, 7, 11, 13, 17, 19\
  \ };\n    foreach(primes.begin(), primes.end(),           // 范围\n            func);\
  \                               // 函数作为可调用对象（退化为指针）\n    foreach(primes.begin(),\
  \ primes.end(),           // 范围\n            &func);                           \
  \   // 函数指针作为可调用对象\n    foreach(primes.begin(), primes.end(),           // 范围\n\
  \            FuncObj());                         // 函数对象作为可调用对象\n    foreach(primes.begin(),\
  \ primes.end(),           // 范围\n            [] (int i) {                      \
  \   // lambda 作为可调用对象\n                std::cout << \"lambda called for:  \" <<\
  \ i << '\\n';\n            });\n}\n```\n\n让我们详细观察每情况：\n\n- 当我们将函数名作为参数传递时，我们并没有真正传递函数本身，而是传递它的指针或引用。与数组一样（见\
  \ 115 页的 7.4 节），函数参数在按值传递时会退化为指针；在参数类型为模板的情况下，将推导出函数指针类型。就像数组一样，函数也可以按引用传递而不发生退化。然而，函数类型实际上无法真正用\
  \ `const` 进行限定。如果我们将 `foreach()` 的最后一个参数声明为类型 `Callable const`，那么 `const` 将被直接忽略。（通常来说，函数引用在主流代码中很少使用。）\n\
  - 我们的第二次调用通过传递函数地址显式地获取了函数指针。这与第一次调用（函数名退化为指针）等效，但可能稍微清晰一点。\n- 当传递函数对象（functor）时，我们将类类型对象作为可调用对象传递。通过类类型进行调用通常等同于调用它的\
  \ `operator()`。因此，调用 `op(*current);` 通常会被转换为 `op.operator()(*current);` // 使用参数\
  \ current 为 op 调用 operator() 注意在定义 `operator()` 时，通常应该将其定义为常量成员函数。否则，当框架或库期望此调用不会改变对象状态时，可能会发生微妙的错误信息（见\
  \ 146 页的 9.4 节）。\n类类型对象也可能隐式转换为指向代理函数的指针或引用（在 694 页的 C.3.5 节中讨论）。在这种情况下，调用 `op(*current);`\
  \ 将转换为 `(op.operatorF()(*current);`，其中 `F` 是类类型对象可以转换成的函数指针或函数引用类型。这相对不常见。\n- Lambda\
  \ 表达式产生函数对象（称为闭包，closures），因此这种情况与函数对象的情况没有区别。然而，lambda 是引入函数对象的非常简洁的表示法，因此自 C++11\
  \ 以来它们在 C++ 代码中非常常见。有趣的是，以 `[]` 开头的（无捕获）lambda 会产生一个到函数指针的转换运算符。然而，它永远不会被选为代理函数，因为它比闭包的普通\
  \ `operator()` 匹配得差。\n\n#### 11.1.2 处理成员函数和额外参数\n\n一种可能的待调用实体在之前的示例中没有用到：成员函数。这是因为调用非静态成员函数通常需要指定应用其上的对象，使用类似\
  \ `object.memfunc()` 或 `ptr->memfunc()` 的语法，这不符合通常的模式。\n\n幸运的是，从 C++17 开始，C++ 标准库提供了一个工具\
  \ `std::invoke()`，它可以方便地将这种情况与普通的调用情况统一起来。以下 `foreach()` 模板的实现使用了 `std::invoke()`：\n\
  \n点击此处查看代码图片\n\n*basics/foreachinvoke.hpp*\n\n```cpp\n#include <utility>\n#include\
  \ <functional>\ntemplate<typename Iter, typename Callable, typename… Args>\nvoid\
  \ foreach (Iter current, Iter end, Callable op, Args const&... args)\n{\n    while\
  \ (current != end) {\n        // 只要没有到达元素的末尾\n        std::invoke(op,          \
  \   // 调用传递的可调用对象\n                    args...,         // 额外的参数\n             \
  \       current);        // 以及当前元素\n        ++current;\n    }\n}\n```\n\n在这里，除了我们还接受了任意数量的额外参数。`foreach()`\
  \ 模板随后使用 `std::invoke()` 调用给定的可调用对象以及额外的参数和引用元素。`std::invoke()` 处理方式如下：\n\n- 如果可调用对象是成员指针，它将第一个额外参数作为\
  \ `this` 对象。所有剩余的额外参数作为参数传递给可调用对象。\n- 否则，所有额外参数都作为参数传递给可调用对象。\n\n注意，我们在这里不能对可调用对象或额外参数使用完美转发（perfect\
  \ forwarding）：第一次调用可能会“窃取”它们的值，导致在后续迭代调用 `op` 时出现意外行为。\n\n通过这种实现，我们仍然可以编译上面的原始 `foreach()`\
  \ 调用。现在，此外，我们还可以为可调用对象传递额外参数，并且可调用对象可以是成员函数。\n\n\n\n\n点击此处查看代码图像\n\n`basics/foreachinvoke.cpp`\n\
  \n```cpp\n#include <iostream>\n#include <vector>\n#include <string>\n#include \"\
  foreachinvoke.hpp\"\n\n// 一个包含将被调用的成员函数的类\nclass MyClass {\n  public:\n    void\
  \ memfunc(int i) const {\n      std::cout << \"MyClass::memfunc() called for: \"\
  \ << i << '\\n';  \n    }\n};\n\nint main()\n{\n  std::vector<int> primes = { 2,\
  \ 3, 5, 7, 11, 13, 17, 19 };\n  // 将 lambda 作为可调用对象并传递额外的参数：\n  foreach(primes.begin(),\
  \ primes.end(),             // 作为 lambda 第二参数的元素\n          [](std::string const&\
  \ prefix, int i) { // 要调用的 lambda\n              std::cout << prefix << i << '\\\
  n';\n          },\n          \"- value:\");                            // lambda\
  \ 的第一个参数\n  // 针对 primes 中的每个元素调用 obj.memfunc() 并将其作为参数传递\n  MyClass obj;\n  foreach(primes.begin(),\
  \ primes.end(),   // 作为参数的元素\n          &MyClass::memfunc,                   //\
  \ 要调用的成员函数\n          obj);                                // 用于调用 memfunc() 的对象\n\
  }\n```\n\n`foreach()` 的第一次调用将其第四个参数（字符串字面量 `\"- value: \"`）传递给 lambda 的第一个参数，而 vector\
  \ 中的当前元素则绑定到 lambda 的第二个参数。第二次调用将成员函数 `memfunc()` 作为第三参数传递，并为第四个参数传递的 `obj` 调用。\n\
  \n请参考第 716 页的第 D.3.1 节关于判断*可调用对象*是否可以被 `std::invoke()` 使用的类型特征。\n\n#### 11.1.3 封装函数调用\n\
  \n`std::invoke()` 的常见应用是封装单个函数调用（例如：记录调用、测量其持续时间或为它们准备某些上下文，如为它们启动新线程）。现在，我们可以通过对可调用对象和所有传递参数进行完美转发来支持移动语义：\n\
  \n点击此处查看代码图像\n\n`basics/invoke.hpp`\n\n```cpp\n#include <utility>             //\
  \ 用于 std::invoke()\n#include <functional>          // 用于 std::forward()\n\ntemplate<typename\
  \ Callable, typename… Args>\ndecltype(auto) call(Callable&& op, Args&&… args)\n\
  {\n  return std::invoke(std::forward<Callable>(op),         // 传递的可调用对象\n      \
  \                std::forward<Args>(args)...);   // 任何额外的参数\n}\n```\n\n另一个有趣的方面是如何处理被调用函数的返回值，以便将其“完美地转发”回给调用者。为了支持返回引用（例如\
  \ `std::ostream&`），你必须使用 `decltype(auto)` 而不仅仅是 `auto`：\n\n点击此处查看代码图像\n\n```cpp\n\
  template<typename Callable, typename… Args>\ndecltype(auto) call(Callable&& op,\
  \ Args&&… args)\n```\n\n`decltype(auto)`（自 C++14 起可用）是一个占位类型，它根据关联的表达式（初始化器、返回值）确定变量、返回类型或模板参数的类型。如果你想将\
  \ `std::invoke()` 返回的值临时存储在变量中，以便在执行某些操作后返回（例如：处理返回值或记录调用），你也必须用 `decltype(auto)`\
  \ 声明该临时变量：\n\n```cpp\ndecltype(auto) ret{std::invoke(std::forward<Callable>(op),\
  \ std::forward<Args>(args)...};\nreturn ret;\n```\n\n注意，使用 `auto&&` 声明 `ret` 是错误的。作为引用，`auto&&`\
  \ 会扩展返回值的生命周期直到其作用域结束（参见第 167 页的第 1.3 节），但不会跨越 `return` 语句返回给调用者。\n\n然而，`decltype(auto)`\
  \ 也存在一个问题：如果可调用对象的返回类型为 `void`，则不允许将 `ret` 初始化为 `decltype(auto)`，因为 `void` 是不完全类型。你有以下选项：\n\
  \n- 在该语句之前的行声明一个对象，其析构函数执行你想要实现的观测行为。例如（见 2）：\n\n```cpp\nstruct cleanup {\n  ~cleanup()\
  \ { // 返回时执行的代码 }\n} dummy;\nreturn std::invoke(std::forward<Callable>(op), std::forward<Args>(args)...);\n\
  ```\n\n- 分别实现 `void` 和非 `void` 情况：\n\n点击此处查看代码图像\n\n`basics/invokeret.hpp`\n\n```cpp\n\
  #include <utility>    // 用于 std::invoke()\n#include <functional>  // 用于 std::forward()\n\
  #include <type_traits>  // 用于 is_same 和 invoke_result\n\ntemplate<typename Callable,\
  \ typename… Args>\ndecltype(auto) call(Callable&& op, Args&&… args)\n{\n  if constexpr(is_same_v<invoke_result_t<Callable,\
  \ Args…>, void>) {\n    // 返回类型为 void：\n    std::invoke(std::forward<Callable>(op),\
  \ std::forward<Args>(args)...);\n    return;\n  }\n  else {\n    // 返回类型非 void：\n\
  \    decltype(auto) ret{std::invoke(std::forward<Callable>(op), std::forward<Args>(args)...};\n\
  \    return ret;\n  }\n}\n```\n\n通过点击此处查看代码图像`if constexpr(is_same_v<invoke_result_t<Callable,\
  \ Args…>, void>)` 在编译时测试 `callable` 带 `Args` 的返回类型是否为 `void`。关于 `std::invoke()`\
  \ 的更多细节，请参见第 716 页的第 D.3.1 节。\n\n### 1.2 实现泛型的其他工具\n\n`std::invoke()` 只是标准库提供的有用工具之一。在下文中，我们将概览其他工具。\n\
  \n#### 1.2.1 类型特征\n\n标准库提供了各种称为“类型特征”（type traits）的工具，允许我们评估和修改类型。这支持了泛型代码需要根据其实例化类型进行适应或反应的各种情况。例如：\n\
  \n```cpp\n#include <type_traits>\ntemplate<typename T>\nclass C {\n  // 确保 T 不是\
  \ void（忽略 const 或 volatile）：\n  static_assert(!std::is_same_v<std::remove_cv_t<T>,void>,\
  \ \"不支持 void 类型实例化类 C\");\npublic:\n    template<typename V>\n    void f(V&& v)\
  \ {\n      if constexpr(std::is_reference_v<T>) {\n        // 如果 T 是引用类型则执行特殊代码\n\
  \      }\n      if constexpr(std::is_convertible_v<std::decay_t<V>,T>) {\n     \
  \   // 如果 V 可以转换为 T 则执行特殊代码\n      }\n      if constexpr(std::has_virtual_destructor_v<V>)\
  \ {\n        // 如果 V 有虚析构函数则执行特殊代码\n      }\n    }\n};\n```\n\n正如示例所示，通过检查某些条件，我们可以在不同的模板实现之间选择。在这里，我们使用了编译时\
  \ `if` 特性（自 C++17 起可用，参见第 134 页的第 8.5 节），但我们也可以使用 `std::enable_if`、偏特化或 SFINAE 来启用或禁用辅助模板（详情参见第\
  \ 8 章）。\n\n\n\n\n然而，请注意在使用类型 trait（type traits）时必须格外小心：它们的行为可能与（天真的）程序员所预期的不同。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\nstd::remove_const_t<int const&>    // 生成 int const&\n```\n\
  \n在这里，因为引用不是 `const`（尽管你不能修改它），该调用没有效果并返回了传入的类型。\n\n因此，移除引用和 `const` 的顺序非常重要：\n\n\
  点击此处查看代码图像\n\n```cpp\nstd::remove_const_t<std::remove_reference_t<int const&>> \
  \     // int std::remove_reference_t<std::remove_const_t<int const&>>      // int\
  \ const\n```\n\n相反，你可能只需要调用：\n\n点击此处查看代码图像\n\n```cpp\nstd::decay_t<\"int const\"\
  >&>    // 生成 int\n```\n\n然而，这会将原始数组和函数转换为相应的指针类型。\n\n此外，某些类型 trait 有特定的要求。不满足这些要求会导致未定义行为^(4)。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\nmake_unsigned_t<int>            // unsigned int\nmake_unsigned_t<int\
  \ const&>  // 未定义行为（希望是错误）\n```\n\n有时结果可能会出乎意料。例如：\n\n点击此处查看代码图像\n\n```cpp\nadd_rvalue_reference_t<int>\
  \            // int&&\nadd_rvalue_reference_t<int const>  // int const&&\nadd_rvalue_reference_t<int\
  \ const&>  // int const& *(左值引用保持为左值引用)*\n```\n\n在这里，我们可能期望 `add_rvalue_reference`\
  \ 始终产生一个右值引用，但 C++ 的引用折叠规则（参见第 277 页的第 15.6.1 ）会导致左值引用和右值引用的组合产生左值引用。\n\n另一个例子：\n\
  \n点击此处查看代码图像\n\n```cpp\nis_copy_assignable_v<int>    // 生成 true *(通常，你可以将一个 int\
  \ 赋值给 int*)\nis_assignable_v<int,int>    // 生成 false *(不能调用 42 = 42*)\n```\n\n虽然\
  \ `is_copy_assignable` 泛泛检查是否可以将 `int` 赋值给另一个 `int`（检查左值的操作），但 `is_assignable` 考虑了值类别（参见\
  \ 附录 B）（此处检查是否可以将一个 prvalue 赋值一个 prvalue）。也就是说，第一个表达式等同于：\n\n点击此处查看代码图像\n\n```cpp\n\
  is_assignable_v<\"int\",&,\"int>&    // 生成 true\n```\n\n出于相同的原因：\n\n点击此处查看代码图像\n\
  \n```cpp\nis_swappable_v<int>            // 生成 true *(假设为左值)*\nis_swappable_v<int&,int&>\
  \  // 生成 true *(等同于之前的检查)*\nis_swappable_with_v<int,int>  // 生成 false *(考虑了值类别)*\n\
  ```\n\n由于所有这些原因，请仔细注意类型 trait 的准确定义。我们在 附录 D 中详细描述了标准的类型 trait。\n\n### 1.2.2 `std::addressof()`\n\
  \n`std::addressof<>()` 模板产生对象或函数的实际地址。即使该对象类型重载了 `&`，它也能工作。尽管后者很罕见，但可能会发生（例如在智能指针中）。因此，如果你需要任意类型对象的地址，建议使用\
  \ `addressof()`：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename T>\nvoid f (T&& x)\n\
  {\n  auto p = &x; // 可能因为重载的运算符 & 而失败\n  auto q = std::addressof(x); // 使用重载运算符\
  \ & 也能工作\n…\n}\n```\n\n### 1.2.3 `std::declval()`\n\n`std::declval<>()` 模板可以作为特定类型对象引用的占位符。该函数没有定义，因此不能被调用（也不会创建对象）。因此，它只能用于不求值的操作数中（例如\
  \ `decltype` 和 `sizeof` 的操作数）。所以，与其尝试创建一个对象，不如假设你已经有了一个对应类型的对象。\n\n例如，以下声明从传入的参数\
  \ `T1` 和 `T2` 推导出了默认返回类型 `RT`：\n\n点击此处查看代码图像\n\n```cpp\nbasics/maxdeclval.hpp\n\
  #include <utility>\ntemplate<typename T1, typename T2,\n    typename RT = std::decay_t<decltype(true\
  \ ? std::declval<T1>() : std::declval<T2>())>>\nRT max (T1 a, T2 b)\n{\n  return\
  \ b < a : b;\n}\n```\n\n为了避免我们必须为 `T1` 和 `T2` 调用（默认）构造函数以便在表达式中调用运算符 `?:` 来初始化，我们可以假设你已经有一个对应类型的对象。\n\
  \n有时，结果可能会令人惊讶。例如：\n\n点击此处查看代码图像\n\n```cpp\nadd_rvalue_reference_t<int>        \
  \    // int&&\nadd_rvalue_reference_t<int const>  // int const&&\nadd_rvalue_reference_t<int\
  \ const&>  // int const& *(左值引用保持为左值引用)*\n```\n\n在这里，我们可能期望 `add_rvalue_reference`\
  \ 始终产生右值引用，但 C++ 的引用折叠规则（参见第 277 页的第 15.6.1）会导致左值引用和右值引用的组合产生左值引用。\n\n另一个例子：\n\n\
  点击此处查看代码图像\n\n```cpp\nis_copy_assignable_v<int>    // 生成 true *(通常，你可以将一个 int 赋值给一个\
  \ int*)\nis_assignable_v<int,int>    // 生成 false *(不能调用 42 = 42*)\n```\n\n虽然 `is_copy_assignable`\
  \ 泛泛检查是否可以将 `int` 赋值给另一个 `int`（检查左值的操作），但 `is_assignable` 考虑了值类别（参见 附录 B）（此处检查是否可以将一个\
  \ prvalue 赋值一个 prvalue）。也就是说，第一个表达式等同于：\n\n点击此处查看代码图像\n\n```cpp\nis_assignable_v<\"\
  int\",&,\"int>&    // 生成 true\n```\n\n出于相同的原因：\n\n点击此处查看代码图像\n\n```cpp\nis_swappable_v<int>\
  \            // 生成 true *(假设为左值)*\nis_swappable_v<int&,int&>  // 生成 true *(等同于之前的检查)*\n\
  is_swappable_with_v<int,int>  // 生成 false *(考虑了值类别)*\n```\n\n由于所有这些原因，请仔细注意类型 trait\
  \ 的准确定义。我们在 附录 D 中详细描述了标准的类型 trait。\n\n### 1.2.2 `std::addressof()`\n\n`std::addressof<>()`\
  \ 函数模板产生对象或函数的实际地址。即使该对象类型重载了 `&`，它也能工作。尽管后者很罕见，但可能会发生（例如在智能指针中）。因此，如果你需要任意类型对象的地址，建议使用\
  \ `addressof()`：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename T>\nvoid f (T&& x)\n\
  {\n  auto p = &x; // 可能因为重载的运算符 & 而失败\n  auto q = std::addressof(x); // 使用重载运算符\
  \ & 也能工作\n…\n}\n```\n\n### 1.2.3 `std::declval()`\n\n`std::declval<>()` 函数模板可以作为特定类型对象引用的占位符。该函数没有定义，因此不能被调用（也不会创建对象）。因此，它只能用于不求值的操作数中（例如\
  \ `decltype` 和 `sizeof` 的操作数）。所以，与其尝试创建一个对象，不如假设你已经有一个对应类型的对象。\n\n例如，以下声明从传入的参数\
  \ `T1` 和 `T2` 推导出了默认返回类型 `RT`：\n\n点击此处查看代码图像\n\n```cpp\nbasics/maxdeclval.hpp\n\
  #include <utility>\ntemplate<typename T1, typename T2,\n    typename RT = std::decay_t<decltype(true\
  \ ? std::declval<T1>() : std::declval<T2>())>>\nRT max (T1 a, T2 b)\n{\n  return\
  \ b < a : b;\n}\n```\n\n为了避免我们必须为 `T1` 和 `T2` 调用（默认）构造函数以便在表达式中调用运算符 `?:` 来初始化，我们可以假设你已经有一个对应类型的对象。\n\
  \n有时，结果可能会令人惊讶。例如：\n\n点击此处查看代码图像\n\n```cpp\nadd_rvalue_reference_t<int>        \
  \    // int&&\nadd_rvalue_reference_t<int const>  // int const&&\nadd_rvalue_reference_t<int\
  \ const&>  // int const& *(左值引用保持为左值引用)*\n```\n\n在这里，我们可能期望 `add_rvalue_reference`\
  \ 始终产生一个右值引用，但 C++ 的引用折叠规则（参见第 277 页的第 15.6.1）会导致左值引用和右值引用的组合产生左值引用。\n\n另一个例子：\n\
  \n点击此处查看代码图像\n\n```cpp\nis_copy_assignable_v<int>    // 生成 true *(通常，你可以将一个 int\
  \ 赋值给一个 int*)\nis_assignable_v<int,int>    // 生成 false *(不能调用 42 = 42*)\n```\n\n\
  虽然 `is_copy_assignable` 泛泛检查是否可以将 `int` 赋值给另一个 `int`（检查左值的操作），但 `is_assignable`\
  \ 考虑了值类别（参见 附录 B）（此处检查是否可以将一个 prvalue 赋值一个 prvalue）。也就是说，第一个表达式等同于：\n\n点击此处查看代码图像\n\
  \n```cpp\nis_assignable_v<\"int\",&,\"int>&    // 生成 true\n```\n\n出于相同的原因：\n\n点击此处查看代码图像\n\
  \n```cpp\nis_swappable_v<int>            // 生成 true *(假设为左值)*\nis_swappable_v<int&,int&>\
  \  // 生成 true *(等同于之前的检查)*\nis_swappable_with_v<int,int>  // 生成 false *(考虑了值类别)*\n\
  ```\n\n由于所有这些原因，请仔细注意类型 trait 的准确定义。我们在 附录 D 中详细描述了标准的类型 trait。\n\n### 1.2.2 `std::addressof()`\n\
  \n`std::addressof<>()` 函数模板产生对象或函数的实际地址。即使该对象类型重载了 `&`，它也能工作。尽管后者很罕见，但可能会发生（例如在智能指针中）。因此，如果你需要任意类型对象的地址，建议使用\
  \ `addressof()`：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename T>\nvoid f (T&& x)\n\
