  \ size 值在容器感知不到的情况下发生变化（即 size 值可能会失效）。因此，使用 size 的操作（如 `print()` 成员）将绑定到未定义行为（导致程序崩溃或更严重）：\n\
  \n点击此处查看代码图像\n\n```cpp\nint size = 10;\nArr<int,size> x;               // 使用 10\
