  \n*basics/referror1.cpp*\n\n```cpp\ntemplate<typename T, T Z = T{}>\nclass RefMem\
  \ {\n  private:\n    T zero;\n  public:\n    RefMem() : zero{Z} {\n    }\n};\nint\
  \ null = 0;\nint main()\n{\n    RefMem<int> rm1, rm2;\n    rm1 = rm2;          \
  \    // OK\n    RefMem<int&> rm3;       // ERROR: invalid default value for N\n\
  \    RefMem<int&, 0> rm4;   // ERROR: invalid default value for N\n    extern int\
  \ null;\n    RefMem<int&,null> rm5, rm6;\n    rm5 = rm6;              // ERROR:\
