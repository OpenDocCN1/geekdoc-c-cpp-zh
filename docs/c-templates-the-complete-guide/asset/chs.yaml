  \ of optional<T>\");\n};\n```\n\n通常情况下，引用类型与其他类型不同，遵循许多独特的规则。这影响了调用参数的声明（参见第 105\
  \ 页）以及我们定义类型特性的方式（参见第 19.6.1 节第 432 页）。\n\n### 11.5 延迟求值\n\n在实现模板时，有时会出现代码是否可以处理不完整类型的问题（参见第\
  \ 10.3.1 节第 154 页）。考虑以下类模板：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename T>\nclass\
  \ Cont {\n  private:\n    T* elems;\n  public:\n    ...\n};\n```\n\n到目前，该类可以与不完整类型一起使用。这对于引用自身类型的类非常有用，例如：\n\
  \n点击此处查看代码图像\n\n```cpp\nstruct Node {\n  std::string value;\n  Cont<Node> next;\
  \ // 只有当 Cont 接受不完整类型时才可行\n};\n```\n\n然而，例如，仅通过使用某些特性，你可能会失去处理不完整类型的能力。例如：\n\n点击此处查看代码图像\n\
  \n```cpp\ntemplate<typename T>\nclass Cont {\n  private:\n    T* elems;\n  public:\n\
  \    ...\n    typename std::conditional<std::is_move_constructible<T>::value,\n\
  \                             T&&,\n                             T&>::type;\n  \
  \  foo();\n};\n```\n\n\n\n\n\n在这里，我们使用 trait `std::conditional`（参见第 732 页的节 D.5）来决定成员函数\
  \ `foo()` 的返回类型是 `T&&` 还是 `T&`。该决策取决于模板参数类型 `T` 是否支持移动语义。\n\n问题在于 trait `std::is_move_constructible`\
  \ 要求其参数必须是一个完整类型（且不是 `void` 或未知边界的数组；参见第 721 页的节 D.3.2）。因此，通过这种对 `foo()` 的声明，`struct\
  \ node` 的声明会失败。6。\n\n我们可以通过将 `foo()` 替换为成员模板来解决这个问题，这样 `std::is_move_constructible`\
  \ 的求值就会延迟到 `foo()` 实例化：\n\n点击此处查看代码图片\n\n```cpp\ntemplate<typename T>\nclass Cont\
  \ {\n  private:\n    T* elems;\n  public:\n    template<typename D = T>\n    typename\
  \ std::conditional<std::is_move_constructible<D>::value,\n                     \
  \         T&&,\n                              T&>::type\n    foo();\n};\n```\n\n\
  现在，trait 取决于模板参数 `D`（默认为 `T`，这正是我们想要的值），编译器必须等到 `foo()` 被诸如 `Node` 的具体类型调用时才能求值该\
  \ trait（此时 `Node` 是一个完整类型）。\n\n### 11.6 编写泛型库时需要考虑的事项\n\n让我们列出实现库时需要记住的一些事项（注意其中某些可能会之后引入）：\n\
  \n- 使用转发引用（forwarding references）在模板中转发值（参见第 91 页的节 6.1）。如果值不依赖于模板参数，使用 `auto&&`（参见第\
  \ 167 页的节 11.3）。\n- 当参数声明为转发引用时，要准备好在传递左值时模板参数具有引用类型的情况（参见第 279 页的节 15.6.2）。\n-\
  \ 当你需要依赖于模板参数的对象的地址时，使用 `std::addressof()`，以避免在绑定到重载了 `operator&` 的类型时出现意外（参见第 166\
  \ 页的节 11.2.2）。\n- 对于成员函数模板，确保它们的匹配程度优于预定义的拷贝/移动构造函数或赋值运算符（参见第 99 页的节 6.4）。\n- 当模板参数可能是字符串字面量且未按值传递时，考虑使用\
  \ `std::decay`（参见第 116 页的节 7.4 和第 731 页的节 D.4）。\n- 如果你有依赖于模板参数的 `out` 或 `inout`\
  \ 参数，要准备好处理可能指定 `const` 模板参数的情况（例如，参见第 110 页的节 7.2.2）。\n- 准备好处理模板参数作为引用带来的副作用（详情参见第\
  \ 167 页的节 11.4，示例参见第 432 页的节 19.6.1）。特别地，你可能希望确保返回类型不会变成引用（参见第 117 页的节 7.5）。\n-\
  \ 准备好支持不完整类型以支持例如递归数据结构（参见第 171 页的节 11.5）。\n- 为所有数组类型进行重载，而不仅仅是 `T[SZ]`（参见第 71 页的节\
  \ 5.4）。\n\n### 11.7 总结\n\n- 模板允许你将函数、函数指针、函数对象、算子和 lambda 作为可调用对象（callables）。\n\
  - 在定义重载了 `operator()` 的类时，将其声明为 `const`（除非调用改变了状态）。\n- 通过 `std::invoke()`，你可以实现处理所有可调用对象（包括成员函数）的代码。\n\
  - 使用 `decltype(auto)` 来完美转发返回值。\n- 类型 trait 是检查类型属性和能力的类型函数。\n- 当在模板中需要对象的地址时，使用\
  \ `std::addressof()`。\n- 在未求值的表达式中使用 `std::declval()` 创建特定类型的值。\n- 在泛型代码中，如果对象的类型不依赖于模板参数，使用\
  \ `auto&&` 来完美转发对象。\n- 准备好处理模板参数作为引用带来的副作用。\n\n\n\n\nC++ 目前支持四种基本的模板：类模板、函数模板、变量模板和别名模板。这些每种模板都可以出现在命名空间作用域内，也可以出现在类作用域内。在类作用域中，它们变为嵌套类模板、成员函数模板、静态数据成员模板和成员别名模板。这些模板的声明方式与普通类、函数、变量和类型别名（或其类成员对应项）非常，不同在于它们是由形式如下的`参数化句`引入的：\n\
  \n```cpp\ntemplate<parameters here*>\n```\n\n请注意，C++17 引入了另一个通过此类参数化句引入的构造结构：`推导引导`（参见第\
  \ 42 页的第 2.9 节和第 314 页的第 15.12.1 节）。在本书中它们不被称为`模板`（例如，它们没有被实例化），但选择这种语法是为了让人联想到函数模板。\n\
  \n我们将在后面的章节回到实际的模板参数声明。首先，一些示例说明了这四种模板。它们可以如下所示出现在`命名空间作用域`（全局或命名空间内）：\n\n点击此处查看代码图像\n\
  \n`details/definitions1.hpp`\n\n```cpp\ntemplate<typename T>              // 命名空间作用域内的类模板\n\
  class Data {\n  public:\n    static constexpr bool copyable = true;\n    …\n};\n\
  \ntemplate<typename T>              // 命名空间作用域内的函数模板\nvoid log (T x) {\n    ...\n\
  }\n\ntemplate<typename T>              // 命名空间作用域内的变量模板（自 C++14 起）\nT zero = 0;\n\
  \ntemplate<typename T>              // 命名空间作用域内的变量模板（自 C++14 起）\nbool dataCopyable\
  \ = Data<T>::copyable;\n\ntemplate<typename T>              // 命名空间作用域内的别名模板\nusing\
  \ DataList = Data<T*>;\n```\n\n注意，在这个示例中，静态数据成员 `Data<T>::copyable` `并不是`变量模板，尽管它通过类模板\
  \ `Data` 的参数化间接地参数化。然而，变量模板可以出现在类作用域中（如下一个示例所示），在这种情况下，它是静态数据成员模板。\n\n接下来的示例展示了在父类内部定义的类成员的四种模板：\n\
  \n点击此处查看代码图像\n\n`details/definitions2.hpp`\n\n```cpp\nclass Collection {\n  public:\n\
  \    template<typename T>          // 类内成员类模板定义\n    class Node {\n        …\n \
  \   };\n\n    template<typename T>          // 类内（因此是隐式内联的）\n    T* alloc() {  \
  \              // 成员函数模板定义\n        …\n    }\n\n    template<typename T>       \
  \   // 成员变量模板（自 C++14 起）\n    static T zero = 0;\n\n    template<typename T>   \
  \       // 成员别名模板\n    using NodePtr = Node<T>*;\n};\n```\n\n注意，在 C++17 中，变量（包括静态数据成员）和变量模板可以是“内联”的，这意味着它们的定义可以在多个编译单元中重复。对于变量模板来说这是多余的，因为它们始终可以在多个编译单元中定义。然而，与成员函数不同，在在其所属类中定义静态数据成员并使其成为内联：在所有情况下都必须指定\
  \ `inline` 关键字。\n\n最后，以下代码演示了如何在类外定义非别名模板的成员模板：\n\n点击此处查看代码图像\n\n`details/definitions3.hpp`\n\
  \n```cpp\ntemplate<typename T>              // 命名空间作用域内的类模板\nclass List {\n  public:\n\
  \    List() = default;             // 因为定义了模板构造函数\n    template<typename U>    \
  \      // 另一个成员类模板，\n      class Handle;               // 无定义\n    template<typename\
  \ U>          // 成员函数模板\n      List (List<U> const&);      // （构造函数）\n    template<typename\
  \ U>          // 变量模板（自 C++14 起）\n    static U zero;\n};\n\ntemplate<typename T>\
  \              // 类外类模板定义\ntemplate<typename U>\nclass List<T>::Handle {\n    …\n\
  };\n\ntemplate<typename T>              // 类外函数模板定义\ntemplate<typename T2>\nList<T>::List\
  \ (List<T2> const& b)\n{\n    …\n}\n\ntemplate<typename T>              // 类外数据成员模板\n\
  template<typename U>\nList<T>::zero = 0;\n```\n\n在所属所属类之外定义的成员模板需要多个 `template<>`\
  \ 子句：每个类模板需要一个，每个成员模板需要一个。这些子句从最外层的模板开始列出。还要注意，构造函数（一种特殊的成员模板）会禁用默认构造函数的隐式声明（因为只有在没有声明其他构造函数时，它才被声明）。添加一个默认的\
  \ `List() = default;` 确保了 `List<T>` 的实例具有默认构造的语义。\n\n### 联合模板\n\n`联合模板` 是可能的（它们被视为类模板的一种）：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<typename T>\nunion AllocChunk {\n    T object;\n\
  \    unsigned char bytes[sizeof(T)];\n};\n```\n\n### 默认调用参数\n\n函数模板可以像普通函数一样有默认调用：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<typename T>\nvoid report_top (Stack<T> const&,\
  \ int number = 10);\n\ntemplate<typename T>\nvoid fill (Array<T>&, T const& = {});\
  \ // 显示了默认调用参数可以依赖模板参数。它也可以被定义（C++11 之前唯一的方法，参见第 68 页的第 5.2 节）：\n\n点击此处查看代码图像\n\n\
  ```cpp\ntemplate<typename T>\nvoid fill (Array<T>&, T const& = T()); // 对于内置类型有效\n\
  ```\n\n当调用 `fill()` 函数时，如果提供了第二个函数调用参数，则不会实例化默认参数。这确保了如果默认调用参数对于特定的 `T` 无法实例化也不会报错。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\nclass Value {\n  public:\n    explicit Value(int); // 没有默认构造函数\n\
  };\n\nvoid init (Array<Value>& array)\n{\n    Value zero(0);\n    fill(array, zero);\
  \ // OK：未使用默认构造函数\n    fill(array);       // 错误：使用了未定义的默认构造函数\n}\n```\n\n### 类模板的非模板成员\n\
  \n除了类内部定义的四种基本模板外，你还可以拥有通过作为类的一部分参数化的普通类成员。它们有时也被（错误地）称为`成员模板`。尽管它们可以参数化，但此类定义并不是真正的第一类模板。它们的参数完全由所属的模板决定。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<int I>\nclass CupBoard\n{\n    class Shelf;   \
  \            // 类模板中的普通类\n    void open();                // 类模板中的普通函数\n    enum\
  \ Wood : unsigned char; // 类模板中的普通枚举类型\n    static double totalWeight; // 类模板中的普通静态数据成员\n\
  };\n```\n\n\n\n相应的定义仅为父类模板指定了参数化子，但没有为成员本身指定，因为成员不是模板（即在最后一个 `::` 之后出现的名称没有关联参数化子）：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<int I>           // 类模板中普通类的定义\nclass CupBoard<I>::Shelf\
  \ {\n    …\n};\n\ntemplate<int I>           // 类模板中普通函数的定义\nvoid CupBoard<I>::open()\n\
  {\n    …\n}\n\ntemplate<int I>           // 类模板中普通枚举类型的定义\nenum CupBoard<I>::Wood\
  \ {\n    Maple, Cherry, Oak\n};\n\ntemplate<int I>           // 类模板中普通静态成员的定义\n\
  double CupBoard<I>::totalWeight = 0.0;\n```\n\n自 C++17 起，静态成员 `totalWeight` 成员可以使用\
  \ `inline` 在类模板内部进行初始化：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<int I>\nclass CupBoard\n\
  \    …\n    inline static double totalWeight = 0.0;\n};\n```\n\n虽然此类参数化定义通常被称为 `templates`（模板），但该术语并不完全适用于它们。偶尔为这些实体建议的术语是\
  \ `temploid`（模板实体）。自 C++17 起，C++ 标准确实定义了 `templated entity`（模板化实体）的概念，它包含了模板和 `temploid`，以及递归地涵盖了任何在模板化实体中定义或创建的实体（例如，在类模板内部定义的友元函数（参见第\
  \ 30 页的第 2.4 节，此处 `2.4` 节）或在模板中出现的 lambda 表达式的闭包类型）。到为止，`temploid` 或 `templated\
  \ entity` 还没有获得广泛关注，但它们可能是未来更精确地进行 C++ 模板通信的有用术语。\n\n### 12.1.1 虚成员函数\n\n成员函数模板不能声明为虚函数。施加这一限制是因为虚函数调用机制的通常实现使用一个固定大小的表，每个虚函数对应一个条目。然而，成员函数模板的实例化数量在整个程序翻译完成之前是不固定的。因此，支持虚成员函数模板需要\
  \ C++ 编译器和链接器支持一种完全全新的机制。\n\n相比之下，类模板的普通成员可以是虚的，因为当类类被实例化时，它们的数量就已经固定了：\n\n点击此处查看代码图像\n\
  \n```cpp\ntemplate<typename T>\nclass Dynamic {\npublic:\n    virtual ~Dynamic();\
  \ // OK：每个 Dynamic<T> 实例有一个析构函数\n    template<typename T2>\n    virtual void copy\
  \ (T2 const); // 错误：对于 Dynamic<T> 实例，copy() 的实例数量未知\n};\n```\n\n### 12.1.2 模板的链接（Linkage）\n\
  \n每个模板都必须有一个名称，且该名称在它的作用域内必须唯一的，但函数模板可以被重载（参见第 16 章）。特别注意，与类类型不同，类模板不能与不同类型的实体共享相同的名称：\n\
  \n点击此处查看代码图像\n\n```cpp\nint C;\nclass C; // OK：类名和非类名处于不同的“空间”\nint X;\ntemplate<typename\
  \ T>\nclass X; // 错误：与变量 X 冲突\nstruct S;\ntemplate<typename T>\nclass S; // 错误：与\
  \ struct S 冲突\n```\n\n模板名称具有链接属性，但它们不能具有 `C` 链接。非标准链接具有取决于实现的具体意义（尽管我们不知道有哪种实现支持模板的非标准链接）：\n\
  \n点击此处查看代码图像\n\n```cpp\nextern \"C++\" template<typename T>\nnormal(); // 这是默认值：可以省略链接规范\n\
  extern \"C\" template<typename T>\ninvalid(); // 错误：模板不能具有 C 链接\nextern \"Java\"\
  \ template<typename T>\njavaLink(); // 非标准，但也许某些编译器有一天支持与 Java 泛型兼容的链接\n```\n\n\
  模板通常具有外部链接。唯一的例外是：带有 `static` 修饰符的命名空间作用域函数模板、匿名命名空间的直接或间接成员的模板（它们具有内部链接），以及匿名类的成员模板（它们没有链接）。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<typename T>\nvoid external(); // 指向另一个文件中相同名称（及作用域）的声明的同一个实体\n\
  template<typename T>\nstatic void internal(); // 与文件中同名的模板无关\ntemplate<typename\
  \ T>\nstatic void internal(); // 对前一个声明的重复声明\nnamespace {\n    template<typename>\n\
  \    void otherInternal(); // 同样与文件中同名的模板无关\n} // 匿名命名空间\nstruct {\n    template<typename\
  \ T> void f(T) {} // 注意：由于后面的成员模板没有链接，它必须在类内部定义\n} x; // 注意：由于该成员模板没有链接，无法在类外定义\n\
  \n目前模板不能在函数作用域或局部类作用域中声明，但泛型 lambda（参见第 309 页的第 15.10.6 节）可以出现在局部作用域，这实际上意味着了一种局部成员函数模板。\n\
  \n模板实例的链接取决于模板本身的链接。例如，从上述模板 `internal` 实例化的 `internal<void>()` 内部链接。这在变量模板的情况下产生了一个有趣的后果。事实上，考虑以下示例：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<typename T> T zero = T{};\n```\n\n`zero` 的所有实例化都具有外部链接，即使是像\
  \ `zero<int const>` 这样的。考虑到 `int const zero_int = int{};` 因为其被声明为 `const` 类型而具有内部链接，这可能是反直觉的。同样，该模板的所有实例化\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<typename T> int const max_volume = 11;\n```\n\n\
  都具有外部链接，尽管这些实例化也具有 `int const`。\n\n### 12.1.3 主模板（Primary Templates）\n\n模板的普通声明定义了\
  \ `primary templates`（主模板）。此类模板声明在模板名称后没有在角括号中添加模板参数：\n\n点击此处查看代码图像\n\n```cpp\n\
  template<typename T> class Box; // OK：主模板\ntemplate<typename T> class Box<T>; //\
  \ 错误：未特化\ntemplate<typename T> void translate(T); // OK：主模板\ntemplate<typename T>\
  \ void translate<T>(T); // 错误：函数不允许\ntemplate<typename T> constexpr T zero = T{};\
  \ // OK：主模板\ntemplate<typename T> constexpr T zero<T> = T{}; // 错误：未特化\n```\n\n\n\
  \n\n在声明类模板或变量模板的`部分特化`时，会产生非主模板。这些内容在第 16 章中进行了讨论。函数模板必须始终是主模板（关于潜在未来语言变化的讨论，请参见第\
  \ 356 页的第 17.3 节)此类声明并不一定需要命名：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename, int>\n\
  class X;    /* X<> 通过一个类型和一个整数进行参数化*/\n```\n\n当然，如果参数在模板稍后被引用，则需要一个参数名称。请注意，模板参数名称可以在随后的参数声明中被引用（但在之前不能）：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<typename T,              //第一个参数在后续*\n        \
  \   T Root,               //在第二个参数的声明中使用并且*\n           template<T> class Buf> //在第三个参数的声明中使用*\n\
  class Structure;\n```\n\n### 12.2.1 类型参数\n\n类型参数通过`typename`关键字或`class`关键字引入：两者是完全等价的。^(2)关键字后必须紧跟一个简单标识符，该标识符后必须跟着一个逗号以表示下一个参数声明的开始，一个右角括号（`>`）以表示参数化句的结束，或一个等号（`=`）以表示默认模板参数的开始。\n\
  \n在模板声明内部，类型参数的作用非常类似于`type alias`（类型别名）（参见第 38 页的第 2.8 节）。例如，当`T`是一个模板参数时，无法使用`class\
  \ T`形式的详式名称，即使`T`被替换为类类型：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename Allocator>\n\
  class List {\n    class Allocator allocptr;    // 错误：使用 \"*Allocator allocptr*\"\
  \n    friend class Allocator;      // 错误：使用 \"*friend Allocator*\"\n    …\n};\n\
  ```\n\n### 12.2.2 非类型参数\n\n非类型模板参数代表可以在编译或链接时确定的常量值。^(3)此类参数的类型（换句话说，它所代表的值的类型）必须是以下之一：\n\
  \n* 整数类型或枚举类型\n* 指针类型^(4)\n* 成员指针类型\n* 左值引用类型（对象的引用和函数的的引用都是接受的）\n* `std::nullptr_t`\n\
  * 包含`auto` 或 `decltype(auto)`的类型（自 C++17 起；参见第 296 页的第 15.10.1 节）\n\n目前所有其他类型目前均被排除在外（尽管未来可能会添加浮点类型；参见第\
  \ 356 页的第 17.2 节）。\n\n或许令人惊讶，非类型模板参数的声明在某些情况下也可以以`typename`关键字开头：\n\n点击此处查看代码图像\n\
  \n```cpp\ntemplate<typename T,               //一个类型参数\n         typename T::Allocator*\
  \ Allocator> //一个非类型参数\nclass List;\n```\n\n或者以`class`关键字：\n\n点击此处查看代码图像\n\n```cpp\n\
  template<class X*>                 //一个指针类型的非类型参数\nclass Y;\n```\n\n这两种情况很容易区分，因为前者后面跟的是一个简单标识符，然后是一小组标记中的一个（`=`\
  \ 用于默认参数，`,` 表示后面还有另一个模板参数，或用右 `>` 结束模板参数列表）。第 67 页的第 5 节讨论了为什么在 229 页的第 13.3 节中需要`typename`；第\
  \ 22 页的第 5 节讨论了为什么在 13 页的第 13.2 节中，非类型参数。在 13 页的第 5 节中，数组类型可以指定。\n\n最后，非引用非类型参数在表达式中始终是右值。不能取地址，也不能被赋值。相反，左值类型的非类型参数可以表示左值：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<int& Counter>\nstruct LocalIncrement {\n    LocalIncrement()\
  \ { Counter = 1; } // OK：整数的引用\n    ~LocalIncrement() { Counter = Counter - 1; }\n\
  };\n```\n\n### 12.2.3 模板模板参数\n\n模板模板参数是类或别名模板的占位符。它们的声明方式类似于类模板，但不能使用`struct`和`union`：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<template<typename X> class C; // OK\nvoid f(C<int>*\
  \ p);\n\ntemplate<template<typename X> struct C; // 错误：struct 无效\nvoid f(C<int>*\
  \ p);\n\ntemplate<template<typename X> union C; // 错误：union 无效\nvoid f(C<int>* p);\n\
  ```\n\nC++17 允许使用`typename`代替`class`：这是模板模板参数不仅可以被类模板替换，还可以被别名模板替换（实例化为任意类型）。因此，在\
  \ C++17 中，我们上面的示例可以写为：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<template<typename X> typename\
  \ C; // 自 C++17 起 OK\nvoid f(C<int>* p);\n```\n\n在声明的作用范围内，模板模板参数的使用方式与其他类或别名模板一样。\n\
  \n模板模板参数的参数可以有默认模板参数。当在使用模板模板参数时未指定相应的参数时，这些默认参数将生效：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<template<typename\
  \ T,\n         typename A = MyAllocator> class Container\n\nclass Adaptation {\n\
  \    Container<int> storage; // 隐式等于 Container<int,MyAllocator>\n    …\n};\n```\n\
  \n\n\n\n\n`T` 和 `A` 是模板模板参数 `Container` 的模板参数的名称。这些名称仅可用于该模板模板参数中其他参数的声明中。下面的构造性模板说明了这一概念：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<template<typename T, T*> class Buf>  // OK*\n\n\
  class Lexer {\n    static T* storage;  // ERROR: 模板模板参数不能在此处使用*\n    …\n};\n```\n\
  \n通常情况下，模板模板参数的模板参数的名称在其他模板参数的声明中是不需要的，因此通常完全不进行命名。例如，我们早前的 `Adaptation` 模板可以声明如下所示：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<template<typename,\n                  typename\
  \ = MyAllocator> class Container>\nclass Adaptation {\n    Container<int> storage;\
  \ *// 隐式等于* Container<int,MyAllocator>\n    …\n};\n```\n\n### 12.2.4 模板参数包\n\n自\
  \ C++11 起，任何类型的模板参数都可以通过在模板参数名称之前引入省略号（`…`），或者在模板参数未命名时位于模板参数名称应出现的位置，将其转换为模板参数包：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<typename… Types>   // 声明了一个名为* Types 的模板参数包\nclass\
  \ Tuple;\n```\n\n模板参数包的行为与其底层的模板参数相似，但有一个关键区别：普通模板参数精确匹配一个模板参数，而模板参数包可以匹配*任意数量的*\
  \ 模板参数。这意味着上述声明的 `Tuple` 类模板接受任意数量的（可能不同的）类型作为模板参数：\n\n点击此处查看代码图像\n\n```cpp\nusing\
  \ IntTuple = Tuple<int>;               // OK: 一个模板参数*\nusing IntCharTuple = Tuple<int,\
  \ char>;     // OK: 两个模板参数*\nusing IntTriple = Tuple<int, int, int>;   // OK: 三个模板参数*\n\
  using EmptyTuple = Tuple<>;                // OK: 零个模板参数*\n```\n\n同样，非类型模板参数包和模板模板参数包可以分别接受任意数量的非类型参数或模板模板的参数：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<typename T, unsigned… Dimensions>\nclass MultiArray;\
  \      // OK: 声明了一个非类型模板参数包*\nusing TransformMatrix = MultiArray<double, 3, 3>;\
  \   // OK: 3x3 矩阵*\n\ntemplate<typename T, template<typename,typename>… Containers>\n\
  void testContainers();  // OK: 声明了一个模板模板参数参数包*\n```\n\n`MultiArray` 示例要求所有非类型模板参数都具有相同的类型\
  \ `unsigned`。C++17 引入了推导非类型模板参数的可能性，这允许我们在某种程度上绕过该限制——详情参见第 298 页的 15.10.1 节。\n\n\
  主类模板、变量模板和别名模板最多有一个模板参数包，如果存在，该模板参数包必须是最后一个模板参数。函数模板的限制较小：允许存在多个模板参数包，只要模板参数包之后的每个模板参数要么具有默认值（见下一节），要么可以被推导（参见第\
  \ 15 章）：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename… Types, typename Last>\nclass\
  \ LastType;  // ERROR: 模板参数包不是最后一个模板参数*\n\ntemplate<typename… TestTypes, typename\
  \ T>\nvoid runTests(T value);  // OK: 模板参数包后面紧跟着\n                        //   \
  \   一个可推导的模板参数*\n\ntemplate<unsigned…> struct Tensor;\ntemplate<unsigned… Dims1,\
  \ unsigned… Dims2>\nauto compose(Tensor<Dims1…>, Tensor<Dims2…>); // OK: 张量维度可以被推导\n\
  ```\n\n最后一个示例是具有推导返回类型的函数声明——这是 C++14 的特性。另见第 296 页的 15.10.1 节。\n\n类模板和变量模板的特特化声明（参见第\
  \ 16 章）与其主模板不同，它们拥有多个参数包。这是因为部分特化是通过推导过程选择的，该过程与用于函数模板的过程几乎相同。\n\n点击此处查看代码图像\n\n\
  ```cpp\ntemplate<typename…> Typelist;\ntemplate<typename X, typename Y> struct Zip;\n\
  template<typename… Xs, typename Y>\nstruct Zip<Typelist<Xs…>, Ys…>; // OK: 使用推导确定\
  \ Xs 和 Ys\n```\n\n出乎意料的是，类型参数包不能在其自身的子句中展开。例如：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename…\
  \ Ts> struct StaticValues; // ERROR: Ts 不能在其自身的参数列表中展开\n```\n\n然而，嵌套模板可以创建类似的情况：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<typename… Ts> struct ArgList {\n    template<Ts…>\
  \ struct Vals {};\n};\nArgList<int, char>:: char;\n```\n\n包含模板参数包的模板被称为变长模板，因为它接受任意数量的模板参数。第\
  \ 4 章 和第 200 页的 12.4 节描述了变长模板的使用。\n\n### 12.2.5 默认模板参数\n\n任何不是模板参数包的模板参数都可以配备默认参数，尽管它必须匹配对应的类型（例如，类型参数不能具有非类型默认参数）。默认参数不能依赖于自身的参数，因为该参数名称在默认参数之后才进入作用域。然而，它可以依赖于之前的参数：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<typename T, typename Allocator = allocator<T>>\n\
  class List;\n```\n\n类模板、变量模板或别名模板的模板参数只有在后续参数也提供了默认参数的情况下，才能具有默认模板参数。（默认参数也存在类似的限制）。后续默认值通常在同一个模板声明中提供，但它们也可以在模板的先先声明中定义。下面的示例说明了这一点：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<typename T1, typename T2, typename T3,\n      \
  \    typename T4 = char, typename T5 = char>\nclass Quintuple;  // OK*\n\ntemplate<typename\
  \ T1, typename T2, typename T3 = char,\n          typename T4, typename T5>\nclass\
  \ Quintuple;  // OK: T4 和 T5 已经有了默认值\n\ntemplate<typename T1 = char, typename T2,\
  \ typename T3,\n          typename T4, typename T5>\nclass Quintuple;  // ERROR:\
  \ T1 不能具有默认参数，因为 T2 没有默认参数*\n```\n\n函数模板模板参数的默认模板参数不需要后续模板参数具有默认模板参数：^(6)\n\n点击此处查看代码图像\n\
  \n```cpp\ntemplate<typename R = void, typename T>\n```\n\n\n\n\n\n```cpp\nR* addressof(T&\
  \ value); // OK: 如果没有显式指定，R 将为 void\n```\n\n默认模板参数不能重复：\n\n点击此处查看代码\n\n```cpp\n\
  template<typename T = void>\nclass Value;\n\ntemplate<typename T = void>\nclass\
  \ Value; // ERROR: 重复的默认参数\n```\n\n在某些上下文中不允许使用默认模板参数：\n\n-   部分特化：\n\n点击此处查看代码\n\
  \n```cpp\ntemplate<typename T>\nclass C;\n\n…\n\ntemplate<typename T = int>\nclass\
  \ C<T*>; // ERROR\n```\n\n-   参数包（Parameter packs）：\n\n点击此处查看代码\n\n```cpp\ntemplate<typename…\
  \ Ts = int> struct X; // ERROR\n```\n\n-   类模板成员的类外定义：\n\n点击此处查看代码\n\n```cpp\ntemplate<typename\
  \ T> struct X\n{\n  T f();\n};\n\ntemplate<typename T = int> T X<T>::f() { // ERROR\n\
  \  …\n}\n```\n\n-   友元类模板声明：\n\n点击此处查看代码\n\n```cpp\nstruct S {\n  template<typename\
  \ = void> friend struct F;\n};\n```\n\n-   友元函数模板声明，除非它是定义且在翻译单元的任何地方都没有出现过它的声明：\n\
  \n点击此处查看代码\n\n```cpp\nstruct S {\n  template<typename = void> friend void f(); //\
  \ ERROR: 不是定义\n  template<typename = void> friend void g() { // 目前为止 OK\n  }\n};\n\
  \ntemplate<typename> void g(); // ERROR: g() 在定义时给出了默认模板参数；此处不允许存在任何其他声明\n```\n\n\
  ### 12.3 模板参数\n\n在实例化模板时，模板参数会被模板参数所替换。这些参数可以通过几种不同的机制确定：\n\n-   **显式模板参数**：模板名称后面可以跟上括在角括号中的显式模板参数。生成的名称称为\
  \ `template-id`（模板标识符）。\n-   **注入类名（Injected class name）**：在具有模板参数 `P1`, `P2`, …\
  \ , , 的类模板 `X` 的范围内，该模板的名字（`X`）可以等同于模板标识符 `X<P1, P2,` … `>`。详细信息请参阅第 221 页的第 13.2.3\
  \ 节。\n-   **默认模板参数**：如果存在默认模板参数，则可以在模板实例中省略显式模板参数。然而，对于类模板或别名模板，即使所有模板参数都有默认值，也必须提供（可能是空的）角括号。\n\
  -   **参数推导**：未显式指定的函数模板参数可以根据调用中函数参数的类型进行推导。这在第 15 章 中有详细描述。推导也可能在其他几种情况下进行。如果所有模板参数都可以被推导，则不需要在函数模板名称后指定角括号。C++17\
  \ 还引入了从变量声明的初始化器或函数表示法类型转换中推导类模板参数的能力；讨论请参阅第 313 页的第 15.12 节。\n\n#### 12.3.1 函数模板参数\n\
  \n函数模板的模板参数可以被显式指定、根据模板的使用方式进行推导，或者作为默认模板参数提供。例如：\n\n点击此处查看代码\n\n`details/max.cpp`\n\
  \n```cpp\ntemplate<typename T>\nT max (T a, T b)\n{\n  return b < a : b;\n}\n\n\
  int main()\n{\n  ::max<double>(1.0, -3.0); // 显式指定模板参数\n  ::max(1.0, -3.0); // 模板参数隐含推导为\
  \ double\n  ::max<int>(1.0, 3.0); // 显式的 <int> 抑制了推导；因此结果类型为 int\n}\n```\n\n某些模板参数永远无法被推导，因为它们对应的模板参数没有出现在函数类型中，或者由于其他原因（参阅第\
  \ 271 页的第 15.2 节）。相应的参数通常放在模板参数列表的开头，以便可以被显式指定，同时允许其他参数被推导。例如：\n\n点击此处查看代码\n\n`details/implicit.cpp`\n\
  \n```cpp\ntemplate<typename DstT, typename SrcT>\nDstT implicit_cast (SrcT x) //\
  \ SrcT 可以推导但 DstT 不能\n{\n  return x;\n}\n\nint main()\n{\n  double value = implicit_cast(-1);\n\
  }\n```\n\n如果我们反转了示例中模板参数的顺序（也就是说如果我们写成 `template<typename SrcT, typename DstT>`），则\
  \ `implicit_cast` 的调用必须指定模板参数。此外，这种参数不能放在模板包之后，因为无法指定或推导。\n\n点击此处查看代码\n\n```cpp\n\
  template<typename Ts, int N>\nvoid f(…); // 因为 无法推导\n```\n\n由于函数模板可以重载，显式提供所有的模板参数可能不足以识别单个函数：在某些情况下，它识别的是一组函数。以下示例说明了这一观察结果：\n\
  \n点击此处查看代码\n\n```cpp\ntemplate<typename Func, typename T>\nvoid apply(Func funcPtr,\
  \ T x)\n{\n  funcPtr(x);\n}\n\ntemplate<typename T> void single(T);\ntemplate<typename\
  \ T> void multi(T);\ntemplate<typename T> void multi(T*);\n\nint main()\n{\n  apply(&single<int>,\
  \ 3); // OK\n  apply(&multi<int>, 7); // ERROR: 没有 single<int>\n}\n```\n\n在示例中，第一个\
  \ `apply()` 调用有效，因为表达式 `&single<int>` 的类型是唯一的。因此，可以推导出模板参数值。然而，在第二次调用中，`&multi<int>`\
  \ 可能是两种类型，因此在这种情况下无法推导 `Func`。\n\n此外，替换模板参数可能会导致尝试构造无效的 C++ 类型。考虑以下重载函数模板（`RT1`\
  \ 和 `RT2` 是未指定的类型）：\n\n点击此处查看代码\n\n```cpp\ntemplate<typename T> RT1 test(typename\
  \ T::X const*);\ntemplate<typename T> RT2 test(…);\n```\n\n`test<int>` 对于两个函数模板中的第一个没有意义，因为类型\
  \ `int` 没有成员类型 `X`。然而，第二个模板没有此类问题。因此，表达式 `&test<int>` 识别了单个函数的地址。第一个模板替换失败并没有导致表达式无效。这种\
  \ SFINAE（替换失败不是错误）原则是使函数模板重载变得实的重要要素，并在第 129 页的第 8.4 节以及第 284 页的第 15.7 节中进行了讨论。\n\
  \n#### 12.3.2 类型参数\n\n模板类型参数是为模板类型参数指定的“值”。一般情况下，任何类型（包括 `void`、函数类型、引用类型等）都可以用作模板参数，但它们对模板参数的替换必须产生有效的结构：\n\
  \n\n\n\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename T>\n\nvoid clear (T p)\n{\n  \
  \  *p = 0;    // 要求一元运算符 * 适用于 T\n}\n\nint main()\n{\n    int a;\n    clear(a);\
  \  // 错误：int * 不支持一元运算符 *\n}\n```\n\n### 12.3.3 非类型参数 (Nontype Arguments)\n\n非类型模板参数是用于替换非类型参数的值。此类值必须是以下内容之一：\n\
  \n- 另一个类型正确的非类型模板参数。\n- 整数（或枚举）类型的的编译期常量值。只有当相应的参数类型与该值的类型匹配，或者该值可以隐式转换为匹配且不发生缩窄的类型时，才是允许的。例如，可以为\
  \ `int` 参数提供一个 `char` 值，但对于 8 位 `char` 参数，`500` 是无效的。\n- 外部变量或函数名，前面带有内置一元运算符 `&`（“取地址”）。对于函数和数组变量，可以省略\
  \ `&`。此类模板参数匹配指针类型的非类型参数。C++17 放宽了这一要求，允许任何产生函数或变量指针的常量表达式。\n- 前述种类的参数，但没有前导的 `&`\
  \ 运算符，它是引用类型非类型参数的有效参数。在这里，C++17 也放宽了限制，允许任何产生函数或变量的常量表达式左值引用（glvalue）。\n- 成员指针常量；换句话说，形式为\
  \ `&C::m` 的表达式，其中 `C` 是类类型，且 `m` 是一个非静态成员（数据或函数）。它仅匹配成员指针类型的非类型参数。同样，在 C++17 中，实际的语法形式不再受限制：允许任何求值为与之匹配的成员指针常量的常量表达式。\n\
  - 空指针常量是指针或成员指针类型非类型参数的有效参数。\n\n对于整型非类型参数——这可能是最常见的非类型参数类型——会考虑向参数类型的隐式转换。随着 C++11\
  \ 中引入了 `constexpr` 转换函数，这意味着在转换之前的参数可以具有类类型。\n\n在 C++17 之前，当将参数与指针或引用的参数匹配时，不会考虑用户定义的转换（单参数构造函数和转换运算符）以及从派生类到基类的转换，尽管在其他情况下它们是有效的隐式转换。使参数更具\
  \ `const` 和/或更具 `volatile` 的隐式转换是允许的。\n\n以下是一些非类型模板参数的有效示例：\n\n点击此处查看代码图像\n\n```cpp\n\
  template<typename T, T nontypeParam>\nclass C;\n\nC<int, 33>* c1;       // 整数类型*\n\
  int a;\n\nC<int*, &a>* c2;      // 外部变量的地址*\nvoid f();\nvoid f(int);\n\nC<void (*)(int),\
  \ f>* c3;  // 函数名：重载解析选择了\n                          // 在此情况下是 f(int)；这里的* & * 是隐含的\n\
  \ntemplate<typename T> void templ_func();\n\nC<void(), &templ_func<double>>* c4;\
  \  // 函数模板的实例化是函数*\nstruct X {\n    static bool b;\n    int n;\n    constexpr operator\
  \ int() const { return 42; }\n};\n\nC<bool&, X::b>* c5;    // 静态类成员是可以接受的变量/函数名*\n\
  C<int X::*, &X::n>* c6;  // 成员指针常量的示例*\nC<long, X{}>* c7;      // 正确：*X 首先通过 constexpr\
  \ 转换函数\n                       // 转换为 int， 然后通过标准整数转换转换为 long*\n```\n\n模板参数的一个通用限制是，编译器或链接器在程序构建时必须能够表示它们的值。在程序运行时才未知的值（例如，局部变量的地址）与模板在程序构建时进行实例化的概念是不兼容的。\n\
  \n尽管如此，某些常量值出乎意料地是无效的：\n\n- 浮点数\n- 字符串字面量（在 C++11 之前，不允许空指针常量。）\n\n字符串字面量的一个问题是两个相同的字面量可能存储在两个不同的地址。表示模板的另一种（但很麻烦）方法是引入一个额外的变量来存储字符串：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<char* str>\nclass Message {\n};\n\nextern char\
  \ const hello[] = \"Hello World!\";\nchar const hello1[] = \"Hello World!\";\nvoid\
  \ foo()\n{\n    static char hello17[] = \"Hello World!\";\n    Message<hello> msg03;\
  \   // 在所有版本中均有效*\n    Message<hello1> msg1;   // 从 C++1 起有效*\n    Message<hello17>\
  \ msg17; // 从 C++17 起有效*\n}\n```\n\n要求是非类型参数声明为指针或引用的在所有 C++ 版本中具有外部链接，自 C++11 起具有内部链接。\n\
  \n请参见 17.2 第 354 页关于该领域的讨论。\n\n关于该领域的其他一些（不那么意外的）无效示例：\n\n点击此处查看代码图像\n\n```cpp\n\
  template<typename T, T nontypeParam>\nclass C;\nstruct Base {\n    int i;\n} base;\n\
  struct Derived : public Base {\n} derived;\n\nC<Base*, &derived>* err1; // 错误：不考虑派生到基类的转换*\n\
  C<int&, base.i>* err2;   // 错误：字段被视为变量*\nint a[10];\nC<int*, &a[0]> err3;      //\
  \ 错误：数组元素的地址*\n```\n\n### 12.3.4 模板模板参数\n\n模板参数通常必须类模板或别名模板，其参数与模板的参数精确匹配。在 C++17\
  \ 之前，模板参数的默认模板参数会被忽略（但如果模板模板参数有默认参数，则会考虑）。C++17 放宽了匹配规则，仅要求模板模板参数至少特化为（参见 16.2 第\
  \ 330 页）相应的模板参数。\n\n这使得以下示例在 C++17 之前是的：\n\n点击此处查看代码图像\n\n```cpp\n#include <list>\n\
  namespace std {\n    template<typename T, typename Allocator = allocator<T>>\n \
  \   class list;\n}\n\ntemplate<typename T1, typename T2,\n    template<typename>\
  \ class Cont> // Cont 期望一个参数\nclass Rel {\n    …\n};\n\nRel<int, double, std::list>\
  \ rel; // C++17 之前错误：std::list 有多个模板参数*\n```\n\n此示例中的问题是标准库中的 `std::list` 有多个参数。第二个参数（描述分配器）有一个默认值，但在\
  \ C++17 之前，在匹配 `Cont` 参数时不会考虑它。\n\n可变模板模板参数是上述 C++17 之前“精确匹配”规则的例外，并为这种局限性提供了解决方案：它们允许对模板参数进行更通用的匹配。模板模板参数包可以匹配模板模板参数中的零或多个相同种类的模板参数：\n\
  \n点击此处查看代码图像\n\n```cpp\n#include <list>\ntemplate<typename T1, typename T2,\n  \
  \  template<typename… > class Cont> // Cont 期望任意数量的\n```\n\n\n\n\n\n```cpp\nclass\
  \ Rel {\n    // type parameters\n    …\n};\n```\n\n`Rel<int, double, std::list>\
  \ rel;` // OK: `std::list` 有两个模板参数\n                                // 但可以使用一个参数使用\n\
  \n模板参数包（Template parameter packs）只能匹配相同类型的模板参数。例如，以下类模板可以用任何仅包含模板类型参数的类模板或别名模板实例化，因为作为\
  \ `TT` 传递的模板类型参数包可以匹配零或多个模板类型参数：\n\n点击此处查看代码图像\n\n```cpp\n#include <list>\n#include\
  \ <map>\n// 在 std 命名空间中声明：\n// template<typename Key, typename T,\n//          \
  \ typename Compare = less<Key>,\n//           typename Allocator = allocator<pair<Key\
  \ const, T>>>\n// class map;\n\n#include <array>\n// 在 std 命名空间中声明：\n// template<typename\
  \ T, size_t N>\n// class array;\n```\n\n```cpp\ntemplate<template<typename… > class\
  \ TT>\nclass AlmostAnyTmpl {\n};\n```\n\n`AlmostAnyTmpl<std::vector> withVector;`\
  \ // 类型参数\n`AlmostAnyTmpl<std::map> withMap;` // 四个类型参数\n`AlmostAnyTmpl<std::array>\
  \ withArray;` // 错误：模板参数包\n                                // 不匹配非类型模板参数\n\n在 C++17\
  \ 之前，只能使用 `class` 关键字声明模板模板参数，这一事实并不意味着只有用 `class` 关键字声明的类模板可以作为替换参数。事实上，`struct`、`union`\
  \ 和别名模板都是模板模板参数的有效参数（别名模板自 C++11 引入以来如此）。这与以下观察相似：任何类型都可以作为用 `class` 关键字声明的模板类型参数的参数。\n\
  \n### 12.3.5 等价性 (Equivalence)\n\n当两组模板参数的值一一对应且相等时，这两组模板参数就是等价的。对于类型参数，类型别名并不重要：比较的是类型别名声明的底层类型。对于整数非类型参数，比较的是参数的值；该值的表达方式并不重要。以下示例说明了这一概念：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<typename T, int I>\nclass Mix;\nusing Int = int;\n\
  \nMix<int, 3*3>* p1;\nMix<Int, 4+5>* p2; // p2 的类型与 p1 相同\n```\n\n（从这个示例可以看出，不需要模板定义来建立模板参数列表的等价性。）\n\
  \n然而，在模板依赖环境中，模板参数的“值”并不总是确定的，等价性规则变得稍微复杂。考虑以下示例：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<int\
  \ N> struct I {};\n\ntemplate<int M, int N> void f(I<M+N>); // #1\ntemplate<int\
  \ N, int M> void f(I<N+M>); // #2\ntemplate<int M, int N> void f(I<N+M>); // #3\
  \ 错误\n```\n\n仔细研究声明 #1 和 #2，你会发现通过将 `M` 和 `N` 分别重命名为 `N` 和 `M`，你得到了相同的声明：两者是相同的。#1\
  \ 和 #2 是致的。表达式 `M+N` 和 `N+M` 在功能上是等价的。#3 是不同的，因为顺序是……（此处原文存在重复错误）。\n\n*（注：提供的文本后半部分在原始源中似乎包含严重的损坏重复和逻辑循环。）*\n\
  \n### 12.4 变参模板 (Variadic Templates)\n\n变参模板在第 12.4 节中引入，是包含至少一个参数包的模板。当模板的行为可以泛化为任意数量的参数时，它们非常有用。第\
  \ 12.2 节引入的 `Tuple` 就是这种类型，因为它可以拥有任意数量的元素。\n\n当为变参模板确定模板参数时，每个参数包将匹配零或多个模板参数序列。我们将这一模板参数序列称为*参数包*（argument\
  \ pack）。以下示例说明了参数包 `Types` 如何匹配为 `Tuple` 提供的不同参数包：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename…\
  \ Types>\nclass Tuple {\n    // 对 Types 中的类型列表提供操作\n};\n\nint main() {\n    Tuple<>\
  \ t0; // Types 包含空列表\n    Tuple<int> t1; // Types 包含 int\n    Tuple<int, float>\
  \ t2; // Types 包含 int 和 float\n}\n```\n\n由于模板参数包代表的是模板参数的列表而不是单个模板参数，因此它必须在同一种语言结构适用于包中所有参数的语文中使用。其中一种结构是\
  \ `sizeof…` 操作，它用于计算参数包中参数的数量：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename… Types>\n\
  class Tuple {\npublic:\n    static constexpr std::size_t length = sizeof…(Types);\n\
  };\n\nint a1[Tuple<int>::length]; // 长度为 1 的数组\nint a3[Tuple<short, int, long>::length];\
  \ // 长度为 3 的数组\n```\n\n#### 12.4.1 包展开 (Pack Expansions)\n\n\n\n\n`sizeof…` 表达式是*包展开*（pack\
  \ expansion）的一个示例。包展开是一种将参数包展开为多个独立参数的构造结构。虽然 `sizeof…` 执行此展开仅仅是为了计算独立参数的数量，但参数包的其他形式——即那些出现在\
  \ C++ 期望出现列表位置的参数包——可以展开为该该列表中的多个元素。此类包展开通过列表元素右侧的省略号（`…`）来标识。这里有一个简单的示例，我们创建了一个新的类模板\
  \ `MyTuple`，它继承自 `Tuple` 并传递了它的参数：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename… Types>\n\
  \nclass MyTuple : public Tuple<Types…> {\n  // 仅为 MyTuple 提供的操作\n};\n\nMyTuple<int,\
  \ float> t2; // 继承自 Tuple<int, float>\n```\n\n模板参数 `Types…` 是一个包展开，它产生一个模板参数序列，为替换了\
  \ `Types` 的参数包中的每个参数生成一个模板参数。如示例所示，类型 `MyTuple<int, float>` 的实例化将参数包 `int`, `float`\
  \ 替换了模板类型参数包 `Types`。当这在包展开 `Types…` 中发生时，我们得到了一个针对 `int` 的模板参数和一个针对 `float` 的模板参数，因此\
  \ `MyTuple<int, float>` 继承自 `Tuple<int, float>`。\n\n理解包展开的一种直观方法是将其视为语法展开，其中模板参数包被替换为恰好数量的（非包）模板参数，且包展开被写为独立的参数，为每个非包模板参数写一次。例如，如果为两个参数对\
  \ `MyTuple` 进行展开，它看起来会是这样：^(9)\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename T1, typename\
  \ T2>\n\nclass MyTuple : public Tuple<T1, T2> {\n  // 仅为 MyTuple 提供的操作\n};\n```\n\
  \n以及针对三个参数的情况：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename T1, typename T2, typename\
  \ T3>\n\nclass MyTuple : public Tuple<T1, T2, T3> {\n  // 仅为 MyTuple 提供的操作\n};\n\
  ```\n\n然而，请注意，你不能通过名称直接访问参数包的单个元素，因为像 `T1`、`T2` 等名称在变长模板中并没有定义。如果你需要这些类型，你唯一能做的事情就是将它们（递归地）传递给另一个类或函数。\n\
  \n每个包展开都有一个*模式*（pattern），该模式是为参数包中的每个参数重复执行的类型或表达式，并且通常位于表示包展开的省略号之前。我们之前的示例中只有微不足道的模式——参数包的名字——但模式可以是任意复杂的。例如，我们可以定义一个新类型\
  \ `PtrTuple`，它继承自一个由其参数类型的指针构成的 `Tuple`：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename…\
  \ Types>\n\nclass PtrTuple : public Tuple<Types*…> {\n  // 仅为 PtrTuple 提供的操作\n};\n\
  \nPtrTuple<int, float> t3; // 继承自 Tuple<int*, float*>\n```\n\n示例中包展开 `Types*…` 的模式是\
  \ `Types*`。在该模式中进行重复替换会产生一个模板类型参数序列，所有这些都是替换了 `Types` 的参数包中类型的指针。根据包展开的语法解释，如果为三个参数对\
  \ `PtrTuple` 进行展开，它看起来会是这样：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename T1, typename\
  \ T2, typename T3>\n\nclass PtrTuple : public Tuple<T1*, T2*, T3*> {\n  // 仅为 PtrTuple\
  \ 提供的操作\n};\n```\n\n### 12.4.2 包展开可以在哪里发生？\n\n我们到目前为止的示例主要关注如何使用包展开来产生模板参数序列。事实上，包展开基本上可以用在语言中任何语法提供逗号分隔列表的地方，包括：\n\
  \n-   在基类列表中。\n-   在构造函数的基类初始化列表中。\n-   在调用参数列表中（模式是参数表达式）。\n-   在初始化列表中（例如，在括号初始化列表中）。\n\
  -   在类、函数或别名模板的模板参数列表中。\n-   在函数可能抛出的异常列表中（在 C++11 和 C++14 中已弃用，且在 C++17 中被禁止）。\n\
  -   在属性（attribute）内部，前提是该属性本身支持包展开（尽管 C++ 标准没有定义此类属性）。\n-   在指定声明对齐方式时。\n-   在指定\
  \ lambda 的捕获列表时。\n-   在函数的参数列表中。\n-   在 `using` 声明中（自 C++17 起）。\n\n我们已经提到 `sizeof…`\
  \ 是一个实际上并不产生列表的包展开。C++17 增加了*折叠表达式*（fold expressions），这是另一种不产生逗号分隔列表的机制。一些包展开上下文仅仅是为了完整性而包含的，我们将关注那些在实践中有用的部分。\n\
  \n此类展开可以通过混入（mixins）聚合外部提供的数据，混入是旨在“混合”进类中的。例如，以下 `Point` 类在多个上下文中使用了包展开：^(10)\n\
  \n```cpp\ntemplate<typename… Mixins>\nclass Point : public Mixins… { // 基类展开\n \
  \ double x, y, z;\npublic:\n  Point() : Mixins()… { // 基类初始化包展开\n\n  template<typename\
  \ Visitor>\n  void visitMixins(Visitor visitor) {\n    visitor(static_cast<Mixins&>(*this));\
  \ // 调用参数包展开\n  }\n};\n\nstruct Color { char red, green, blue; };\nstruct Label\
  \ { std::string name; };\n\nPoint<Color, Label> p; // 继承自 Color 和 Label\n```\n\n\
  `Point` 类使用包展开将每个混入展开为基类。`Point` 的默认构造函数在基类列表中应用包展开，为通过混入机制引入的每个基类进行值初始化。成员函数模板\
  \ `visitMixins` 最有趣的地方在于它将包展开的结果作为调用参数。通过将 `*this` 强制转换为每个混入类型，包展开产生了引用与混入对应的每个基类的调用参数。实际上编写一个用于\
  \ `visitMixins` 的访问者（它可以使用任意数量的函数调用参数），将在 12.4.3 第 204 页介绍。\n\n包展开也可以用于在模板参数列表中创建非类型包或模板参数包：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<typename… Ts>\nstruct Values {\n  template<Ts…\
  \ Vs>\n  struct Holder {\n  };\n};\n\nint i;\nValues<char, int, int*>::Holder<’a’,\
  \ 17, &i> valueHolder;\n```\n\n\n\n请注意，一旦指定了 `Values<…>` 的类型参数，`Values<…>::Holder`\
  \ 的非类型参数列表长度就是固定的；因此参数包 `Vs` **不是**一个变长参数包。\n\n`Values` 是一个非类型模板参数包，其中每个实际模板参数可以具有不同的类型，由模板类型参数包\
  \ `Types` 提供的类型指定。注意 `Values` 声明中的省略号具有双重作用：它既声明模板参数为模板参数包，又将该模板参数包的类型声明为包展开。虽然这种模板参数包在实践中很少见，但同样的原理适用于更通用的语境：函数参数。\n\
  \n### 12.4.3 函数参数包\n\n`函数参数包`（function parameter pack）是一个匹配零或多个函数调用参数的函数参数。与模板参数包一样，函数参数包在使用函数参数名称之前（或在其位置）使用省略号（`…`）来引入，并且和模板参数包一样，函数参数包在每次使用时必须通过包展开进行展开。模板参数包和函数参数包统称为`参数包`（parameter\
  \ packs）。\n\n与模板参数包不同，函数参数包总是包展开，因此它们的声明类型必须包含一个参数包。在下面的示例中，我们引入了一个新的 `Point` 构造函数，它从提供的构造函数参数拷贝初始化每个混入（mixin）：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<typename… Mixins>\nclass Point : public Mixins…\n\
  {\n  double x, y, z;\n  public:\n  // 省略默认构造函数、访问者函数等\n  Point(Mixins… mixins) \
  \   // mixins 是一个函数参数包\n    : Mixins(mixins)… {  // 使用提供的 mixin 值初始化每个基类\n};\n\n\
  struct Color { char red, green, blue; };\nstruct Label { std::string name; };\n\n\
  Point<Color, Label> p({0x7F, 0, 0x7F}, {\"center\"});\n```\n\n函数模板的函数参数包可以依赖于模板中声明的模板参数包，这允许函数模板接受任意数量的调用参数而不会丢失类型信息：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<typename… Types>\nvoid print(Types… values);\n\n\
  int main\n{\n  std::string welcome(\"Welcome to \");\n  print(welcome, \"C++\",\
  \ 2011, ’\\n’); // 调用 print<std::string, char const*, int, char>\n}\n```\n\n当带有若干参数调用函数模板\
  \ `print()` 时，这些参数的类型将被放入参数包中，以替换模板类型参数包 `Types`，而实际的参数值将放入参数包中，以替换函数参数包 `values`。从调用确定参数的过程在第\
  \ 15 章中有详细描述。目前，只需注意 `Types` 中的第 `i` 个类型是 `Values` 中第 `i` 个值的类型，且这两个参数包在函数模板 `print()`\
  \ 的体体内部都是可用的。\n\n`print()` 的实际实现使用了递归模板实例化，这是一种模板元编程技术，见第 123 页的第 8.1 节和第 23 章节。\n\
  \n在出现在参数列表末尾的无名函数参数包与 C 风格的“可变长度”参数之间存在语法歧义。例如：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename\
  \ T> void c_style(int, T…);\ntemplate<typename… T> void pack(int, T…);\n```\n\n\
  在第一种情况下，`T…` 被视为 `T, …`：一个类型为 `T` 的无名参数，后跟一个 C 风格的可变长度参数。在第二种情况下，`T…` 结构被视为函数参数包，因为\
  \ `T` 是一个有效的展开模式。可以通过在省略号前添加逗号（这确保省略号被视为 C 风格的可变长度参数）或在 `…` 后面跟随一个标识符（使其成为具名函数参数包）来强制消除歧义。注意在泛型\
  \ lambda 表达式中，末尾的 `…` 如果紧随其前的类型（中间没有逗号），将被视为表示一个参数包。\n\n### 12.4.4 多重和嵌套包展开\n\n\
  包展开可能是复杂的，并可能包含多个不同的参数包。在实例化包时，所有参数包的长度必须相同。下例示例说明了涉及多个参数包的包展开，其中使用了 `Types` 和 `values`：\n\
  \n```cpp\ntemplate<typename… Types>\nvoid print(Types… values);\n```\n\n包展开也可以是嵌套。在这种情况下：\n\
  \n```cpp\ntemplate<typename… OuterTypes>\nclass Nested {\n  template<typename… InnerTypes>\n\
  \  void f(InnerTypes const… values) {\n    g(OuterTypes(InnerTypes)…);\n  }\n};\n\
  ```\n\n点击此处查看代码图像\n\n在调用 `g()` 时，模式为 `InnerTypes(values)` 的包展开是最内层的包展开，它展开 `InnerTypes`\
  \ 和 `values`，并为初始化 `OuterTypes` 对象产生一系列调用参数。外层包展开的模式包含了内部包展开，从而为函数创建一组调用参数。\n\n\
  包展开本身也可以嵌套。在这种情况下，每个包的出现都由其最近的包包展开展开（且仅由该包展开展开）。下面的示例说明了涉及三个参数包的嵌套包展开：\n\n点击此处查看代码图像\n\
  \n```cpp\ntemplate<typename O1, typename O2>\nclass Nested {\n  template<typename\
  \ I1, typename I2, typename I3>\n  void f(I1 const& iv1, I2 const& iv2, I3 const&\
  \ iv3) {\n    g(O1(I1(iv1), I2(iv2), I3(iv3)),\n       O2(I1(iv1), I2(iv2), I3(iv3)),\n\
  \       O3(I1(iv1), I2(iv2), I3(iv3)));\n  }\n};\n```\n\n\n\n\n包展开（pack expansions）的句法解释可以是理解变长模板的实例化在处理不同数量参数时如何行为的有用工具。然而，在存在零长度参数包时，句法解释往往会失效。为了说明这一点，请考虑第\
  \ 12.4.2 节第 202 页的 `Point` 类模板，在句法上将其替换为零个参数：\n\n```cpp\ntemplate<>\nclass Point\
  \ : {\n  Point() : { }\n};\n```\n\n上述编写的代码是不符合规范的，因为模板参数列表现在为空，且空基类和基类初始化列表各有一个多余的冒号字符。\n\
  \n包展开实际上是语义结构，任何大小的参数包的替换都不会影响包展开（或其包含的变长模板）的解析方式。相反，当包展开展开为一个空列表时，程序的行为（在语义上）就像该列表不存在一样。实例化\
  \ `Point<>` 最终没有任何基类，它的默认构造函数没有基类初始化器，但在其他方面是良好格式的。即使零长度包展开的句法解释对于定义良好（但不同）的代码，这一语义规则依然成立。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<typename T, typename… Types>\nvoid g(Types… values)\
  \ {\n  T v(values…);\n}\n```\n\n变长函数模板 `g()` 创建了一个值 `v`，该值通过给定的值序列进行直接初始化。如果该值序列为空，`v`\
  \ 的声明在句法上看起来像一个函数声明 `T v()`。然而，由于对包展开的替换是语义性的，且不能影响解析产生的实体类型，`v` 使用零个参数进行初始化，即值初始化。^(11)\n\
  \n### 12.4.6 折叠表达式（Fold Expressions）\n\n编程中一种反复出现的模式是对值序列进行操作的折叠。例如，对序列 `x[1], x[2],\
  \ …, x[n-1], x[n]` 执行函数 `fn` 的右折叠由 `fn(x[1], fn(x[2], fn(…, fn(x[n-1], x[n])…))\
  \ )` 给出。在探索新语言特性时，C++ 委员会遇到了需要处理此类结构的情况，特别是逻辑二元运算符（即 `&&` 或 `||`）应用于包展开的特殊情况。如果没有额外的功能，我们可能会编写以下代码来实现\
  \ `&&` 运算符的逻辑：\n\n点击此处查看代码图像\n\n```cpp\nbool and_all() { return true; }\n\ntemplate<typename\
  \ T>\nbool and_all(T cond) { return cond; }\n\ntemplate<typename T, typename… Ts>\n\
  bool and_all(T cond, Ts… conds) {\n  return cond && and_all(conds…);\n}\n```\n\n\
  在 C++17 中，增加了一种名为折叠表达式的新特性（介绍参见第 58 节）。它适用于除 `.`、`->` 和 `[]` 之外的所有二元运算符。\n\n给定一个未展开的表达式模式包和一个非模式表达式值，C++17\
  \ 允许我们为任何此类运算符 `op` 编写：\n\n`(*pack op` … `op value)` 用于运算符的右折叠（称为二元右折叠），或\n\n`(*value\
  \ op` … `op pack*)` 用于左折叠（称为二元左折叠）。注意这里需要括号。基本示例请参见第 58 页的第 4.2 节。\n\n折叠操作适用于展开包后生成的序列，并将\
  \ `value` 作为序列的最后一个元素（对于右折叠）或第一个元素（对于左折叠）。\n\n有了这一特性后，如下代码：\n\n点击此处查看代码图像\n\n```cpp\n\
  template<typename… T> bool g() {\n  return and_all(trait<T>()…);\n}\n```\n\n（其中\
  \ `and_all` 如上定义），可以被写为：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename… T> bool g()\
  \ {\n  return (trait<T>() && … && true);\n}\n```\n\n正如你所料，折叠表达式是包展开。注意，如果包为空，折叠表达式的类型仍然可以从非包操作数（上述形式中的\
  \ `value`）确定。\n\n然而，该特性的设计者还希望提供一种省略 `value` 操作数的选项。因此，C++17 中还有另外两种形式：一元右折叠 `(*pack\
  \ op` …)` 和一元左折叠 `(op `op pack*)`。同样，这里需要括号。显然，这对于空展开会产生问题：我们如何确定它们的类型？例如：\n\n-\
  \ `&&` 的空展开产生 `true`。\n- `||` 的空展开产生 `false`。\n- `,` 的空展开产生 `void`。\n\n注意，如果你以异常的方式重载这些运算符将会产生惊喜。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\nstruct BooleanSymbol {};\n\nBooleanSymbol operator||(BooleanSymbol);\n\
  \ntemplate<typename… Ts>\nvoid symbolic(BTs) {\n```\n\n假设我们用派自 `BooleanSymbol` 的类型调用\
  \ `symbolic`。对于所有展开，结果将是 `BooleanSymbol`。^(12) 我们因此通常建议使用一元表达式（对于空展开）。\n\n### 12.5\
  \ 友元（Friends）\n\n友元声明的基本思想很简单：标识与类具有特权连接的类或函数。然而，两个事实使得情况变得复杂：\n\n1. 友元声明可以是实体的唯一声明。\n\
  2. 友元函数可以是定义。\n\n#### 12.5.1 类模板的友元类\n\n友元类声明不能是定义，因此很少产生问题。在模板上下文中，友元声明的新方面是能够将类模板的特定实例化作为友元：\n\
  \n```cpp\ntemplate<typename T>\nclass Node;\n\ntemplate<typename T>\nclass Tree\
  \ {\n  friend Node<T>;\n};\n```\n\n注意，在将其作为类的友元时，类模板必须是可见的。对于普通类，没有这种要求：\n\n点击此处查看代码图像\n\
  \n```cpp\ntemplate<typename T>\nclass Tree {\n  friend class Factory; // 即使是声明\n\
  \  friend class Node<T>; // 如果 Node 不是\n};\n```\n\n第 13.2.2 节第 220 页对此更多说明。\n\n\
  一种应用引入自第 75 页的第 5.5 节，是声明其他类模板实例化为友元：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename\
  \ T>\nclass Stack {\npublic:\n  ...\n  // 分配类型 T2 元素的栈\n  template<typename T2>\n\
  \  Stack<T>& operator= (Stack<T2> const&);\n  // 为了获取任何类型 T2 的 Stack<T2> 的私有成员\n\
  \  template<typename> friend class Stack;\n  ...\n};\n```\n\nC++11 还增加了将模板参数变为友元的语法：\n\
  \n```cpp\ntemplate<typename T>\nclass Wrap {\n  friend T;\n  ...\n};\n```\n\n对于任何类型\
  \ `T`都是有效的，但如果 `T` 实际上不是类类型，则会被忽略。^(13)\n\n\n\n\n\n### 12.5.2 类模板的友元函数\n\n通过确保友元函数的名称后紧跟角括号，可以使函数模板的实例成为友元。角括号可以包含模板参数，但如果参数可以推导，则角括号可以留空：\n\
  \n点击此处查看代码图片\n\n```cpp\ntemplate<typename T1, typename T2>\nvoid combine(T1, T2);\n\
  \nclass Mixer {\n    friend void combine<>(int&, int&);                        \
  \        // OK: T1 = int&*,* T2 = int&\n    friend void combine<int, int>(int, int);\
  \                         // OK: T1 = int*,* T2 = int\n    friend void combine<char>(char,\
  \ int);                             // OK: T1 = char, T2 = int\n    friend void\
  \ combine<char>(char&, int);                           // ERROR: 不匹配 combine() 模板\n\
  \    friend void combine<>(long, long) { … }                         // ERROR: 不允许定义！\n\
  };\n```\n\n注意，我们不能定义模板实例（至多，我们可以定义特化版本），因此命名实例的友元声明不能是定义。\n\n如果名称后没有紧跟角括号，则有两种可能：\n\
  \n1.  如果名称未经过限定的（换句话说，它不包含 `::`），则它永远不会引用模板实例。如果在友元声明处没有可见的匹配的非模板函数，则该友元声明是该函数的首次声明。该声明也可以是定义。\n\
  \n2.  如果名称经过了限定（它包含 `::`），则该名称必须引用一个之前声明过的函数或函数模板。匹配的函数优于匹配的函数模板。然而，这种友元声明不能是定义。通过一个示例可能有助于阐明各种可能性：\n\
  \n点击此处查看代码图片\n\n```cpp\nvoid multiply(void*);    // 普通函数\n\ntemplate<typename T>\n\
  void multiply(T);                                     // 函数模板\n\nclass Comrades\
  \ {\n    friend void multiply(int) { }                    // 定义了一个新函数 ::multiply(int)\n\
  \    friend void ::multiply(void*);                      // 引用上面的普通函数，\n       \
  \                                                 //而不是 multiply<void*> 实例\n   \
  \ friend void ::multiply(int);                        // 引用模板的实例\n    friend void\
  \ ::multiply<double*>(double*);         // 限定名称也可以有角括号，\n                      \
  \                                  // 但模板必须是可见\n    friend void ::error() { }  \
  \                         // ERROR: 限定的友元不能是定义\n};\n```\n\n在之前的示例中，我们在普通类中声明了友元函数。当我们在类模板中声明它们时，相同的规则仍然适用，但模板参数可以参与标识要成为友元的函数：\n\
  \n点击此处查看代码图片\n\n```cpp\ntemplate<typename T>\nclass Node {\n    Node<T>* allocate();\n\
  \    …\n};\n\ntemplate<typename T>\nclass List {\n    friend Node<T>::allocate();\n\
  \    …\n};\n```\n\n友元函数也可以定义在类模板内部，在这种情况下，它会在被使用时实例化。这通常要求友元函数使用类模板本身，这使得在类模板上表达函数就像它们在命名空间中可见一样简单：\n\
  \n点击此处查看代码图片\n\n```cpp\ntemplate<typename T>\nclass Creator {\n    friend void feed(Creator<T>)\
  \ {       // T 实例化了一个不同的函数 ::feed()\n    …\n};\n\nint main() {\n    Creator<void>\
  \ one;\n    feed(one);                          // 实例化 feed<void>\n    Creator<double>\
  \ two;\n    feed(two);                          // 实例化 feed<double>\n}\n```\n\n\
  在这个示例中，`Creator` 的每次实例化都会生成一个不同的函数。注意，尽管这些函数是作为模板实例化的一部分生成的，但函数本身是普通函数，而不是模板的实例（参见第\
  \ 181 页的第 12.1 节），并且它们的定义仅在使用时才被实例化。还要注意，由于这些函数的体定义在类内部，因此它们是隐式内联（inline）。因此，在两个编译单元中生成相同的函数并不是错误。第\
  \ 220 页的第 13.2.2 节和第 497 页的第 21.2.1 节对这个主题有更多描述。\n\n### 12.5.3 友元模板\n\n通常在声明函数模板或类模板实例的友元时，我们可以精确表达哪个实体将成为友元。尽管如此，表达模板的所有实例都是类的友元有时是有用的。这需要友元模板。例如：\n\
  \n点击此处查看代码图片\n\n```cpp\nclass Manager {\n    template<typename T>\n    friend class\
  \ Task;\n    template<typename T>\n    friend void Schedule<T>::dispatch(Task<T>*);\n\
  \    template<typename T>\n    friend int ticket() {\n        return ++Manager::counter;\n\
  \    }\n    static int counter;\n};\n```\n\n与普通友元声明一样，友元模板只有在命名一个后跟没有角括号的非限定名称时才能是定义。\n\
  \n友元模板只能声明主模板以及主模板的成员。与主模板相关的任何部分特化和显式特化也被自动视为友元。\n\n### 12.6 后记\n\nC++ 模板的基本概念和语法自\
  \ 20 世纪 80 年代后期以来一直保持相对稳定。类模板和函数模板是初始模板的一部分。类型参数和非类型参数也是如此。\n\n然而，原始设计也有一些重大补充，主要由\
  \ C++ 标准库的需求驱动。成员模板可能是这些补充中是最基础的之一。有趣的是，只有成员函数模板被正式投票通过 C++ 标准。成员类模板是通过编辑疏忽进入标准的。\n\
  \n\n\n\n别名模板（Alias templates）作为 2011 标准的一部分被引入。别名模板满足了经常被请求的“typedef 模板”功能的需求，它能够轻松编写仅仅是现有类模板的另一种拼写方式的模板。进入标准的规范（`N2258`）由\
  \ Gabriel Dos Reis 和 Bjarne Stroustrup 编写；Mat Marcus 也对该提案的某些早期草案做出了贡献。Gaby 还制定了\
  \ C++14 `variable template` 提案（`N3651`）的细节。最初，该提案仅打算支持 `constexpr` 变量，但在被草案标准采用时，这一限制被消除了。\n\
  \n变变模板（Variadic templates）的推动是由 C++11 标准库和 Boost 库的需求驱动（参见 [*Boost*），在这些库中，C++ 模板库正在使用日益先进（且复杂）的技术来提供接受任意数量模板参数的模板。Doug\
  \ Gregor、Jaakko Järvi、Gary Powell、Jens Maurer 和 Jason Merrill 标准的初始规范（`N2242`）。在规范制定期间，Doug\
  \ 还开发了该功能的原始实现（在 GNU 的 `GCC` 中），这很大地帮助了标准库使用该功能的能力。\n\n折叠表达式（Fold expressions）是\
  \ Andrew Sutton 和 Richard Smith 的工作：它们通过他们的论文 `N4191` 被添加到 C++17 中。\n\n1. 自 C++14\
  \ 起的一个异常是泛型 lambda 的隐式模板类型参数；参见第 309 页的章节 [15.10.6]。\n\n2. 关键字 `class` *并不*意味着替换参数应该是类类型。它可以是任何可访问类型。\n\
  \n3. 模板模板参数（Template template parameters）也不表示类型；然而，它们区别于*非类型*（nontype）参数。这种现象是历史性的模板模板参数是在类型参数和非类型参数之后添加到语言中的。\n\
  \n4. 在编写此时，仅允许“指向对象的指针”和“指向函数的指针”类型，这排除了 `void*` 等类型。然而，所有编译器似乎也接受 `void*`。\n\n\
  5. 参见 [附录 B] 关于值类别（如右值和左值）的讨论。\n\n6. 后续模板参数的模板参数仍然可以通过模板参数推导确定；参见 [第 15 章]。\n\n\
  7. 然而，构造函数模板可以是默认构造函数。\n\n8. *变长*（variadic）一词借自 C 语言的变长函数，该函数接受可数量的函数参数。变长模板也从 C\
  \ 使用了使用省略号（...）来表示零或多个参数，并旨在作为某些应用中 C 变长函数的类型安全替代品。\n\n9. 这种对包展开（pack expansions）的语法理解是一个实用的工具，但当模板参数包长度为零时，它就会失效。第\
  \ 207 页的章节 [12.4.5] 提供了关于零长度包展开解释的更多细节。\n\n10. 混合（Mixins）在第 508 页的章节 [21.3] 中进行了更详细的讨论。\n\
  \n11. 类模板成员和类模板中的嵌套类也有类似的限制：如果声明成员时使用的类型看起来不是函数类型，但在实例化后该成员的类型变成了函数类型，则程序将是非良的，因为该成员的语义解释已从数据成员变为成员函数。\n\
  \n12. 因为重载这三个特殊运算符是不寻常的，幸运的是这个问题很罕见（但很微妙）。折叠表达式的原始提案包含了更常用运算符（如 `+` 和 `*`）的空展开值，这本会导致更严重的问题。\n\
  \n13. 得益于 William M. “Mike” Miller 的一个提案，这是添加到 C++11 的第一个扩展。\n\n## 第 13 章\n\n##\
  \ 模板中的名称\n\n名称是大多数编程语言中的基本概念。名称是程序员引用之前构造的实体的手段。当 C++ 编译器遇到名称时，它必须进行“查找”以识别所引用的实体。从实现者的角度来看，C++\
  \ 在这方面是一种复杂的语言。考虑 C++ 语句 `x*y`。\n\n### 13.1 命名分类法\n\nC++ 以多种方式对名称进行分类。为了应对这些丰富的术语，我们提供了\
  \ [13.1] 和 [13.2]，它们描述了这些分类：\n\n1. 如果一个名称所属的作用域使用作用解析运算符（`::`）或成员访问运算符（`..` 或 `->`）显式指定，则该名称是*限定名*（qualified\
  \ name）。例如，`this->count` 是限定名，但 `count` 不是。\n\n2. 如果一个名称以某种方式依赖于模板参数，则该名称是*依赖名*（dependent\
  \ name）。例如，如果 `T` 是模板参数，`std::vector<T>::iterator` 通常是依赖名，但如果 `T` 是已知的类型别名（例如来自\
  \ `using T = int` 的 `T`），它是一个非依赖名。\n\n| **分类** | **说明与注释** |\n| --- | --- |\n| 标识符\
  \ (Identifier) | 仅由连续的字母、下划线（`_`）和数字组成的名称。它不能以数字开头，某些标识符是为实现预留的：你不应该在程序中引入它们（作为经验法则，避免使用开头的下划线和双下划线）。“字母”的概念应该宽泛地理解，包括编码非字母语言字形的*通用字符名称*（*UCNs*）。\
  \ |\n| 运算符-函数-标识 (Operator-function-id) | 关键字 `operator` 后跟运算符的符号——例如，`operator\
  \ new` 和 `operator [ ]`。¹ |\n| 转换-函数-标识 (Conversion-function-id) | 用于表示自定义隐式转换运算符——例如，`operator\
  \ int&`，它也可以被混淆为 `operator int bitand`。 |\n| 字面量运算符-标识 (Literal-operator-id) | 用于表示自定义字面量运算符——例如，`operator\
  \ \"\"_km`，它将在编写诸如 `100_km` 的字面量时使用（C++11 引入）。 |\n| 模板标识 (Template-id) | 模板的名称后跟尖括号括内的模板参数；例如，`List<T,\
  \ int, 0>`。模板标识也可以是运算符-函数-标识或字面量运算符-标识，后跟尖括号括内的模板参数；例如，`operator+<X<int>>`。 |\n\n\
  \n\n\n\n| Unqualified-id | 标识符的泛化。它可以是上述任何一种类型（标识符、运算符-函数-id、转换函数-id、字面量运算符-id 或模板-id）或“析构函数名”（例如，如\
  \ `~Data` 或 `~List<T, T, N>` 等符号）。 |\n| Qualified-id | 一个通过类、枚举或命名空间名称限定，或仅通过全局作用域解析符限定的\
  \ `unqualified-id`。请注意，此类名称本身也可以是被限定的。示例有 `::X`、`S::x`、`Array<T>::y` 和 `::N::A<T>::z`。\
  \ |\n| Qualified name | 该术在标准中并未定义，但我们用它来指经过*限定查找*（qualified lookup）的名称。具体而言，它是一个\
  \ `qualifiedid` 或在显式成员访问操作符（`..` 或 `->`）之后使用的 `unqualified-id`。例如 `S::x`、`this->f`\
  \ 和 `p->A::m`。然而，在隐式等同于 `this->class_mem` 的语文中，`class_mem` 并不是限定名称：成员访问必须是显式的。 |\n\
  | Unqualified name | 不是限定名称的 `unqualified-id`。这不是一个标准术语，但对应于标准中称为*未限定查找*（unqualified\
  \ lookup）的名称。 |\n| Name | 限定的名称或未限定的名称。 |\n\n*表 13.1. 名称分类法（部分 1）*\n\n| 分类 | 说明与备注\
  \ |\n| --- | --- |\n| Dependent name | 在某种程度上依赖于模板参数的名称。通常情况下，显式包含模板参数的限定或未限定名称都是依赖名称。此外，如果一个通过成员访问操作符（`.`\
  \ 或 `->`）限定的限定名称，其访问操作符左侧表达式的类型是*依赖类型的*（type-dependent），则它通常是依赖名称，该概念在第 13.3.6 节第\
  \ 233 页有讨论。特别是，`this->b` 中的 `b` 在出现在模板中时通常是一个依赖名称。最后，如果一个受参数依赖查找（ADL，描述在第 13.2 节，第\
  \ 217 页）影响的名称，例如形式 `ident(x, y)` 调用中的 `ident` 或表达式 `x + y` 中的 `+`，当且仅当任何参数表达式是依赖类型时，它就是依赖名称。\
  \ |\n| Nondependent name | 根据上述描述不是依赖名称的名称。 |\n\n*表 13.2. 名称分类法（部分 2）*\n\n阅读这些表格以熟悉某些有时用于描述\
  \ C++ 模板问题的术语是有用的，但记住每个术语的确切含义并不是必不可少的。如果有需要，可以很容易在索引中找到它们。\n\n### 13.2 查找名称\n\n\
  在 C++ 中查找名称有许多小的细节，但我们将只关注几个主要概念。这些细节的目的是为了确保 (1) 常规情况被直觉处理，且 (2) 标准以某种方式涵盖了异常情况。\n\
  \n限定名称是在限定构造结构所暗示的作用域中查找的。如果该作用域是一个类，则可能还会搜索基类。然而，在查找限定名称时不考虑闭包作用域。以下说明了这一基本原理：\n\
  \n点击此处查看代码图像\n\n```cpp\nint x;\n\nclass B {\n  public:\n    int i;\n};\n\nclass\
  \ D : public B {\n};\n\nvoid f(D* pd)\n{\n    pd->i = 3;  // 找到 B::i\n    D::x =\
  \ 2;   // 错误：未在闭包作用域中找到 ::x\n}\n```\n\n相比之下，未限定名称通常在逐层闭包的作用域中查找（但在成员函数定义中，在查找任何其他闭包作用域之前，会搜索类及其基类的作用域）。这被称为*普通查找*（ordinary\
  \ lookup）。这里有一个基础示例展示了普通查找的核心思想：\n\n点击此处查看代码图像\n\n```cpp\nextern int count;    \
  \           // #1\n\nint lookup_example(int count)   // #2\n{\n    if (count < 0)\
  \ {\n        int count = 1;          // #3\n        lookup_example(count);  // 未限定\
  \ count 指的是 #3\n    }\n    return count + count;        // 未限定 count 指的是 #2\n}\n\
  ```\n\n名称查找的一个较新变化是——除了普通查找之外，它们还可能经历*参数依赖查找*（ADL，#part0022.html_ch13_lev2）。这里的问题是\
  \ `max()` 模板并不知道 `Math` 命名空间，但普通查找找不到适用于 `type` 值的 `<`。如果没有某些特殊规则，这将极大地减少模板在存在 C++\
  \ 命名空间时的模板的适用性。\n\n#### 13.2.1 参数依赖查找\n\nADL 主要适用于那些看起来是在函数调用或运算符重载中命名非成员函数的未限定名称。如果普通查找找到了以下内容，则\
  \ ADL 不会发生：\n\n- 成员函数的名称，\n- 变量的名称，\n- 类型的名称，\n- 块作用域函数声明的名称。\n\n如果被调用的函数名称包含在括号中，ADL\
  \ 也会被抑制。否则，如果名称后跟着一组包含在括号内的参数表达式列表，ADL 将通过在与参数类型“关联”的命名空间和类中查找该名称来执行。这些*关联命名空间*和*关联类*的精确定义将在稍后给出，但直觉上，它们可以被认为是所有与给定类型有相当直接连接的命名空间和类。例如，如果类型是类\
  \ `X` 的指针，那么关联类和命名空间将包括 `X` 以及 `X` 所属的任何命名空间或类。\n\n针对给定类型的*关联命名空间*集合和*关联类*集合的精确定义由以下规则决定：\n\
  \n- 对于内置类型，这是一个空集。\n- 对于指针和数组类型，关联命名空间和类的集合是其底层类型的集合。\n- 对于枚举类型，关联命名空间是声明该枚举的命名空间。\n\
  - 对于类成员，闭包类是关联类。\n- 对于类类型（包括联合类型），关联类的集合是类型本身、闭包类以及任何直接和间接基类。关联命名空间的集合是声明这些关联类的命名空间。如果该类是类模板的实例，则模板类型参数的类型以及声明模板模板参数的类和命名空间也被包含在内。\n\
  - 对于函数类型，关联命名空间和类的集合包含了与所有参数类型相关的命名空间和类，以及与返回类型相关的命名空间和类。\n\n\n\n\n\n-   对于指向类 `X`\
  \ 成员的指针类型，相关的命名空间和类的集合除了与成员类型相关的命名空间外，还包括与 `X` 相关的命名空间。（如果它是指向成员函数的指针类型，那么参数类型和返回类型也可以做出贡献。）ADL（参数依赖查找）会在所有相关的命名空间中查找该名称，就好像该名称依次用这些命名空间进行了限定限定的一样，不同在于它忽略了\
  \ `using` 指令。以下示例说明了这一点：\n\n点击此处查看代码图像\n\n`details/adl.cpp`\n\n```cpp\n#include\
  \ <iostream>\n\nnamespace X {\n    template<typename T> void f(T);\n}\n\nnamespace\
  \ N {\n    using namespace X;\n    enum E { e1 };\n    void f(E) {\n        std::cout\
  \ << \"N::f(N::E) called\\n\";\n    }\n}\n\nvoid f(int)\n{\n    std::cout << \"\
  ::f(int) called\\n\";\n}\n\nint main()\n{\n    ::f(N::e1);  // 限定函数名：无 ADL\n   \
  \ f(N::e1);    // 普通查找找到了 ::f()，ADL 找到了 N::f()\n}               // 后者被优先考虑\n```\n\
  \n注意，在此示例中，执行 ADL 时，命名空间 `N` 中的 `using` 指令被忽略了。因此 `X::f()` 甚至从不是 `main()` 调用中的候选者。\n\
  \n### 13.2.2 友元声明的参数依赖查找\n\n友元函数声明可以是被指定函数的第一个声明。如果是这种情况，则假设该函数声明在包含该友元声明的类的最近命名空间作用域（可能是全局作用域）中。然而，这种友元声明在该作用域内并非直接可见。考虑以下示例：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<typename T>\nclass C {\n    …\n    friend void\
  \ f();\n    friend void f(C<T> const&);\n    …\n};\n\nvoid g (C<int>* p)\n{ \n \
  \   f();    // f() 在这里可见吗？\n    f(*p);  // f(C<int> const&) 在这里可见吗？\n}\n```\n\n\
  如果友元声明在包含它的命名空间中可见的，那么实例化类模板可能会使普通函数的声明可见。这将导致意料之外的行为：除非程序早些发生过类 `C` 的实例化，否则调用 `f()`\
  \ 将导致编译错误！\n\n另一方面，仅在友元声明中声明（并定义）一个函数是有用的（参见第 [497] 页的第 21.2.1 节，关于一种依赖于此行为的技术）。这种仅在友元声明中声明的函数，当其作为该函数的友元的类位于\
  \ ADL 所考虑的关联类之中时，就可以找到该函数。\n\n重新考虑我们的上一个示例。调用 `f()` 没有关联类或命名空间，因为没有参数：在我们的示例中这是一个无效调用。然而，调用\
  \ `f(*p)` 确实有关联类 `C<int>`（因为这是 `*p` 的类型），而且全局命名空间也是关联的（因为这是 `*p` 类型声明所在的命名空间）。因此，只要在调用之前类\
  \ `C<int>` 实际上已完全实例化，第二个友元函数声明就可以被找到。为了确保这一点，假设任何涉及对关联类进行友元查找的调用实际上会导致该类的实例化（如果尚未实例化的话）。([3)\n\
  \n参数依赖查找查找友元声明和定义的能力有时被称为*友元名注入*（*friend name injection*）。然而，这个术语带有某种误导性，因为这是一个前标准\
  \ C++ 特性的名称，该特性实际上确实将友元声明的名称“注入”到了外层作用域中，使其对普通名称查找可见。在上面的示例中，这意味着这两个调用都是合法的。本章的附后记进一步详细说明了友元名注入的历史。\n\
  \n#### 13.2.3 注入的类名\n\n类的名称被注入到该类本身的作用域内，因此在该作用域内可以作为未限定名称访问。（然而，它不能作为限定名称访问，因为这是用于表示构造函数的符号。）例如：\n\
  \n点击此处查看代码图像\n\n`details/inject.cpp`\n\n```cpp\n#include <iostream>\nint C;\nclass\
  \ C {\n    private:\n        int i[2];\n    public:\n        static int f() {\n\
  \            return sizeof(C);\n        }\n};\n\nint f()\n{\n    return sizeof(C);\n\
  }\n\nint main()\n{\n    std::cout << \"C::f() = \" << C::f() << '\\n';\n    std::cout\
  \ << \"f() = \" << f() << '\\n';\n}\n```\n\n`C::f()` 返回 `int` 的大小，而 `f()` 返回 `C`\
  \ 的大小。\n\n类模板也有注入的类名。然而，它们比普通类名更奇异：它们后面可以跟模板参数（在这种情况下是注入的类名），但如果它们后面没有跟模板参数，则在需要模板时它们代表该模板。这解释了以下情况：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<typename>> class TT {\n};\n\ntemplate<typename\
  \ T> class C {\n};\n\nclass X {\n    C* a;      // OK：等同于 \"C<T>* a;\"\n    C<void>&\
  \ b; // OK\n    X<C> c;     // OK，C 代表模板\n    X<::C> d;   // OK，::C 代表模板\n};\n```\n\
  \n注意未限定名称指向注入名称，在不跟随列表时不被视为模板名。为了补偿，我们可以通过文件作用域 `::` 来强制使用模板名。\n\n变长模板的注入类名还有一个特殊之处：如果注入类名直接使用变长模板的模板参数作为模板参数形成，那么注入类名将包含未展开的模板参数包（包展开的细节参见第\
  \ 12.4.1 节）。因此，在形成变长模板的注入类名时，对应模板包的模板参数模式为该模板参数包：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<int\
  \ I, typename… T> class V {\n    V* a; // OK：等同于 \"V<I, T…>* a;\"\n    V<0, void>\
  \ b; // OK\n};\n```\n\n#### 13.2.4 当前实例化\n\n类或类模板的注入类名实质上是所定义类型的别名。对于非模板类，这一属性是显而易见的，因为该类本身就是该作用域内具有该名称的唯一类型。然而，在类模板或类模板的嵌套类内部，每个模板实例化都会产生不同的类型。这一属性在那种语文中特别有趣，因为这意味着注入类名指向类模板的同一个实例化，而不是该类模板的其他特化版本（对于类模板的嵌套类也是如此）。\n\
  \n\n\n\n在类模板内部，注入的类名或任何与注入类名等价类型（包括通过类型别名声明查找）的任何包含类或类模板，被称为引用一个 `current instantiation`（当前实例化）。依赖于模板参数的类型（即\
  \ `dependent types`）但不引用当前实例化的类型被称为引用一个 `unknown specialization`（未知特化），它可能从同一个类模板实例化，也可以从某个完全不同的类模板实例化。下面的示例说明了这种区别：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<typename T> class Node {\n  using Type = T;\n \
  \ Node* next;            /* Node 指向当前实例化 */\n  Node<Type>* previous;  /* Node<Type>\
  \ 指向当前实例化 */\n  Node<T*>* parent;      /* Node<T*> 指向未知特化版本 */\n};\n```\n\n在存在嵌套类和类模板的情况下，识别一个类型是否引用当前实例化可能会令人困惑。`enclosing`（包含）类和类模板的注入类名（或与其等价的类型）确实引用当前实例化，而其他嵌套类或类模板的名字则不是：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<typename T> class C {\n  using Type = T;\n  struct\
  \ I {\n    C* c;               /* C 指向当前实例化 */\n    C<Type>* c2;        /* C<Type>\
  \ 指向当前实例化 */\n    I* i;               /* I 指向当前实例化 */\n  };\n  struct J {\n    C*\
  \ c;               /* C 指向当前实例化 */\n    C<Type>* c2;        /* C<Type> 指向当前实例化 */\n\
  \    I* i;               /* I 指向未知特化版本，\n                        /* 因为 I 并不包含 */\n\
  \    JJ* j;             /* J 指向当前实例化 */\n  };\n};\n```\n\n当一个类型引用当前实例化时，该实例化类的内容保证是从当前正在定义的类模板或其嵌套类实例化的。这对于解析模板时的名称查找（我们下一节的主题）具有影响，但它导致了一种替代的、更像游戏规则的方法来确定类模板定义内的类型\
  \ `X` 是引用当前实例化还是未知特化版本：如果另一个程序员可以编写一个显式特化（在第 16 章中详细描述），使得 `X` 引用该特化版本，那么 `X` 就引用一个未知特化版本。例如，考虑上述示例文中类型\
  \ `C<int>::J` 的实例化：我们知道用于实例化具体类型的 `C<T>::J` 的定义（因为那是我们正在实例化的类型）。此外，因为显式特化在不特化所有包含的模板或成员的情况下无法特化模板或模板成员，因此\
  \ `C<int>` 将从包含类定义实例化。因此，`J` 内部对 `J` 和 `C<int>`（其中 `Type` 为 `int`）的引用指向当前实例化。相反，可以为\
  \ `C<int>::I` 写如下的显式特化：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<> struct C<int>::I {\n\
  \  /* 特化的定义 */\n};\n```\n\n在这里，`C<int>::I` 的特化提供了一个与 `C<T>::J` 定义中可见的完全不同的定义，因此\
  \ `C<T>::J` 定义内部的 `I` 引用一个未知特化。\n\n### 13.3 解析模板\n\n大多数语言编译器的两个基本活动是词法分析（tokenization，也称为扫描）和解析（parsing）。例如，如果编译器看到\
  \ `int p = 0;`；词法分析器生成 `int`、`p`、`=`、`0` 和 `;`。解析器处理这些标记以理解结构。\n\n#### 13.3.1 非模板中的上下文敏感性\n\
  \n如你所知，词法分析比解析容易。幸运的是，许多语言不是上下文无关的。然而 C++ 是。这种形式的上下文敏感性是选择角括号来分隔模板参数列表的一个遗憾后果。这里是另一个后果：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<bool B>\nclass Invert {\n  public:\n    static\
  \ bool const result = !B;\n};\n\nvoid g()\n{\n  bool test = Invert<(1>0)>::result;\
  \ // 必须使用括号！\n}\n```\n\n如果省略 `Invert<(1>0)>` 中的括号，大于符号将被误认为是模板参数列表的结束。这将导致代码无效，因为编译器将其读取为等同于\
  \ `((Invert<1>))0>::result`。\n\n词法分析器也无法避免角括号表示法的问题。例如，在\n\n点击此处查看代码图像\n\n```cpp\n\
  List<List<int>> a; /* 右角括号之间没有空格 */\n```\n\n两个 `>` 字符会组合成右移标记 `>>`，因此在*词法分析器*中永远不会被视为两个独立的标记。这是*最大匹配（*maximum\
  \ munch*）词法分析原则的结果：C++ 实现必须尽可能地收集多个连续字符组合成一个标记。\n\n\n\n\n如第 28 页第 2.2 节所述，从 C++11\
  \ 开始，C++ 标准特别指出了这种情况——即嵌套模板 ID 被右移运算符 `>>` 闭——在解析器内部，它会将右移处理等同于两个独立的右尖括号 `>` 和 `>`，从而同时关闭两个模板\
  \ ID^(6)。有趣的是，这一变化静默地改变了某些（诚然是刻意设计的）程序的含义。考虑以下示例：\n\n点击此处查看代码图像\n\n`names/anglebrackethack.cpp`\n\
  \n```cpp\n#include <iostream>\n\ntemplate<int I> struct X {\n  static int const\
  \ c = 2;\n};\n\ntemplate<> struct X<0> {\n  typedef int c;\n};\n\ntemplate<typename\
  \ T> struct Y {\n  static int const c = 3;\n};\n\nstatic int const c = 4;\n\nint\
  \ main()\n{\n  std::cout << (Y<X<1> >::c >::c>::c) << ’ ’;\n  std::cout << (Y<X<\
  \ 1>>::c >::c>::c) << ’\\n’;\n}\n```\n\n这是一个有效的 C++98 程序，输出为 `0 3`。它也是一个有效的 C++11\
  \ 程序，但那里尖括号技巧（angle bracket hack）使得两个括号表达式变得等价，输出为 `0 0`^(7)。\n\n由于存在 `<:` 作为源字符\
  \ `` 的替代方案（在某些传统键盘上不可用），也存在类似的问题。考虑以下示例：\n\n[点击此处查看代码图像\n\n```cpp\ntemplate<typename\
  \ T> struct G {};\nstruct S;\nG<::S> gs; // 自 C++11 起有效，在此之前是错误\n```\n\n在 C++11\
  \ 之前，最后一行代码等同于 `G:S> gs;`，这显然是无效的。为了解决这个问题，增加了另一种“词法技巧”：当编译器看到字符 `<::` 后没有紧跟 `:`\
  \ 或 `>` 时，前面的字符对 `<:` 不被视为等同于 `[` 的字形标记^([8)。这种*字形技巧*会导致之前有效（但有些复杂的）程序变得无效：^(9)。\n\
  \n点击此处查看代码图像\n\n```cpp\n#define F(X) X ## :\n\nint a[] = { 1, 2, 3 }, i = 1;\nint\
  \ n = a F(<::)i]; // 在 C++98/C++03 中有效，但在 C++11 中无效\n```\n\n要理解这一点，请注意“字形技巧”适用于*预处理标记*（即预处理器可以接受的标记类型，在预处理完成后可能不再被接受），并且它们在宏展开完成之前就已经确定了。考虑到这一点，C++98/C++03\
  \ 无条件地将宏调用 `F(<::)` 中的 `<:` 转换为 `[`，并将 `n` 的定义展开为：\n\n```cpp\nint n = a [ :: i];\n\
  ```\n\n这是完全没有问题的。然而，C++11 不执行字形转换，因为在宏展开之前，序列 `<::` 后面不是 `:` 或 `>`，而是 `)`。如果没有字形转换，连接运算符\
  \ `##` 必须尝试将 `::` 和 `:` 连接成一个新的预处理标记，但这是行不通的，因为 `:::` 不是有效的连接标记。该标准使这种行为为未定义，允许编译器进行任何操作。某些编译器会诊断此问题，而另一些不会，将保持两个预处理标记分离，这将会导致错误，因为导致\
  \ `n` 的定义展开为：\n\n```cpp\nint n = a < :: : i];\n```\n\n### 13.3.2 类型的依赖名称（Dependent\
  \ Names）\n\n模板中名称的问题在于它们并不总是能被充分分类。特别是，一个模板不能查看另一个模板，因为另一个模板的内容可能通过显式特化而变得无效。以下刻意设计的示例说明了这一点：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<typename T>\nclass Trap {\n  public:\n    enum\
  \ { x }; // #1* x 在此处不是类型\n};\n\ntemplate<typename T>\nclass Victim {\n  public:\n\
  \    int y;\n    void poof() {\n      Trap<T>::x; // 依赖名称\n    }\n};\n\ntemplate<>\n\
  class Trap<void> {\n  public:\n  using x = int;\n};\n\nvoid boom(Victim<void>&)\
  \ {\n  // ...\n}\n```\n\n当编译器解析时，它必须决定 `Trap<T>::x` 是否为类型。这个决定取决于 `Trap<T>::x` 是否为类型。人们可能会诱惑去查看\
  \ `Trap` 并发现 `Trap<T>::x` 不是类型，因为 `Trap<T>::x` 是一个依赖名称。然而，如示例所示，指向未知特化的名称仍然是一个问题。语言通过规定解决了这一点：通常情况下，除非带有\
  \ `typename`，否则依赖名称*不*表示类型。在这种情况下，`Trap<T>::x` 是一个依赖类型。\n\n当名称满足以下所有条件时，*需要* `typename`\
  \ 前缀：\n\n1. 它是限定的且后面没有 `::` 来形成更限定的名称。\n2. 它不是*扩展类型说明符*（elaborated-type-specifier）（即以\
  \ `class`、`struct`、`union` 或 `enum` 开头的类型名称）。\n3. 它未用于基类列表或构造函数的成员初始化列表。\n4. 它依赖于模板参数。\n\
  5. 它是*特化的成员*，意味着限定符指向一个未知特化。\n\n此外，除非至少两个两个两个，否则*不允许*使用 `typename` 前缀。为了说明这一点，考虑以下错误示例：^(12)\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<typename T>\nstruct S : typename X<T>::Base {\n\
  \  S() : typename X<T>::Base(typename X<T>::Base(0)) {\n  }\n  typename X<T> f()\
  \ {\n    typename X<T>::C * p; // 声明指针 p\n    X<T>::D * q; // 乘法！\n  }\n  typename\
  \ X<int>::C * s;\n  using Type = T;\n  using OtherType = typename S<T>::Type;\n\
  };\n```\n\n\n\n\n每个 `typename` 的出现——无论正确与否——都带有一个下标编号以便于引用。第一个 `typename`[1] 表示一个模板参数。之前的规则不适用于第一次使用。第二个和第三个\
  \ `typename` 被前述规则中的第二项所禁止。在这两个语境中，基类的名称前面不能有 `typename` 修饰。然而，`typename`[4] 是必须的。在这里，基类的名称并非用于表示正在初始化的内容或从其派生出的内容。相反，该名称是表达式的一部分，用于从其参数\
  \ `0` 构建一个临时的 `X<T>::Base`（姑可以看作是一种转换）。第五个 `typename` 是被禁止的，因为紧随其后的名称 `X<T>` 不是一个限定名。如果该语句要声明一个指针，则第六次出现是强制的。下一行省略了\
  \ `typename` 关键字，因此被编译器解释为乘法操作。第七个 `typename` 是可选的，因为它满足了前两个规则，但没有满足后两条。第八个 `typename`\
  \ 也是可选的，因为它引用的是当前实例的成员（因此不满足最后一条规则）。\n\n确定是否需要 `typename` 前缀的最后一条规则有时难以评估，因为它取决于确定一个类型是引用当前实例还是未知特化形式的规则。在这些情况下，最安全的方法是直接添加\
  \ `typename` 关键字，表示你意图让随后的限定名成为类型。`typename` 关键字即使是可选的，也能为你的意图提供文档说明。\n\n#### 13.3.3\
  \ 模板的依赖名称 (Dependent Names of Templates)\n\n当模板名称是依赖的时，会发生一个与上一节遇到的非常相似的问题。通常情况下，C++\
  \ 编译器需要将模板名称后的 `<` 视为模板参数列表的开始；否则，它就是一个小于运算符。与类型名一样，除非程序员使用 `template` 关键字提供额外信息，否则编译器必须假设依赖名称不引用模板：\n\
  \n点击此处查看代码图片\n\n```cpp\ntemplate<typename T>\nclass Shell {\n  public:\n    template<int\
  \ N>\n    class In {\n      public:\n        template<int M>\n        class Deep\
  \ {\n          public:\n            virtual void f();\n        };\n    };\n};\n\n\
  template<typename T, int N>\nclass Weird {\n  public:\n    void case1 (\n      \
  \        typename Shell<T>::template In<N>::template Deep<N>* p) {\n      p->template\
  \ Deep<N>::f(); // 阻止虚函数调用\n    }\n    void case2 (\n              typename Shell<T>::template\
  \ In<N>::template Deep<N>& p) {\n      p.template Deep<N>::f(); // 阻止虚函数调用\n   \
  \ }\n};\n```\n\n这个复杂的示例展示了所有可以限定名称的运算符（`::`、`->` 和 `.`）可能都需要后跟 `template` 关键字。具体来说，每当限定运算符之前的名称或表达式的类型依赖于模板参数并引用未知的特化形式，且运算符后的名称是一个模板标识（换句话说，一个模板名称后跟着尖括号中的模板参数）时，情况如此。例如，在表达式\n\
  \n`p.template Deep<N>::f()` 中\n\n`p` 的类型依赖于模板参数 `T`。因此，C++ 编译器无法查找 `Deep` 以查看它是否是一个模板，我们必须通过插入\
  \ `template` 前缀显式指示 `Deep` 是一个模板的名称。如果没有这个前缀，`p.Deep<N>::f()` 被解析为 `((p.Deep)<N)>f()`。注意，这在一个限定名内部可能需要发生多次，因为限定符本身可能被依赖限定符所限定。（这可以通过上一个示例中\
  \ `case1` 和 `case2` 的参数声明得到说明。）\n\n如果在在此类情况下省略了 `template` 关键字，左、右尖角括号将被解析为小于和大于运算符。与\
  \ `typename` 关键字一样，可以安全地添加 `template` 前缀来表示随后的名称是一个 `template-id`，即使 `template`\
  \ 前缀并非严格需要。\n\n#### 13.3.4 Using 声明中的依赖名称 (Dependent Names in Using Declarations)\n\
  \n`using` 声明可以从两个地方引入名称：命名空间和类。命名空间的情况在本文语文中并不相关，因为不存在所谓的命名空间模板。另一方面，从类引入名称的 `using`\
  \ 声明只能从基类引入到派生类。此类 `using` 声明在派生类中表现类似于指向基类的“符号链接”或“快捷方式”，允许派生类的成员像该名称是派生类中的成员一样访问被指定的名称。一个简短的非模板示例比纯文字能更好地说明这一观点：\n\
  \n```cpp\nclass BX {\n  public:\n    void f(int);\n    void f(char const);\n   \
  \ void g();\n};\nclass DX : private BX {\n  public:\n    using BX::f;\n};\n```\n\
  \n之前的 `using` 声明将基类 `BX` 的名称 `f` 引入到派生类 `DX` 中。在这种情况下，该名称与两个不同的声明相关，从而强调了我们处理的是名称而不是此类名称的单独声明。注意，这种\
  \ `using` 声明可以使不可访问的成员变得可访问。基类 `BX`（及其成员）对于类 `DX` 来说是私有的，除非通过 `using` 引入。上述 `using`\
  \ 声明将基类 `BX` 的名称 `f` 引入到派生类 `DX` 中。\n\n现在你可能已经感知到了当 `using` 声明从类中引入名称时，如果该类是依赖的会产生的问题。尽管我们知道该名称，但不知道它是类型名、模板还是其他东西（由于它来自依赖类）：\n\
  \n点击此处查看代码图片\n\n```cpp\ntemplate<typename T>\nclass BXT {\n  public:\n    using\
  \ Mystery = T;\n    template<typename U>\n    struct Magic;\n};\ntemplate<typename\
  \ T>\nclass DXTT : private BXT<T> {\n  public:\n    using BXT<T>::Mystery;\n   \
  \ Mystery* p; // 没有 typename 将是语法错误\n};\n```\n\n再次，如果我们想通过 `using` 声明引入依赖名称以表示类型，我们必须通过插入\
  \ `typename` 关键字来显式说明。奇怪的是，C++ 标准没有提供类似的机制来标记此类依赖名称为模板。以下代码片段说明了问题：\n\n点击此处查看代码图片\n\
  \n```cpp\ntemplate<typename T>\nclass DXTM : private BXT<T> {\n  public:\n    using\
  \ BXT<T>::template Magic; // 错误：不标准\n    Magic<T>* plink; // 语法错误：Magic 不是已知模板\n\
  };\n```\n\n标准化委员会一直倾向于解决这个问题。然而，C++11 的别名模板提供部分的解决方案：\n\n点击此处查看代码图片\n\n```cpp\n\
  template<typename T>\nclass DXTM : private BXT<T> {\n  public:\n    template<typename\
  \ U>\n      using Magic = typename BXT<T>::template Magic<T>; // 别名模板\n    Magic<T>*\
  \ plink; // OK\n};\n```\n\n这有些笨拙，但在类模板的情况下实现了预期效果。遗憾的是，函数模板的情况（较少见）尚未解决。\n\n###\
  \ 13.3.5 ADL 与显式模板参数 (ADL and Explicit Template Arguments)\n\n考虑以下示例：\n\n点击此处查看代码图片\n\
  \n```cpp\nnamespace N {\n  class X {\n    …\n  };\n  template<int I> void select(X*);\n\
  }\nvoid g (N::X* xp)\n{\n  select<3>(xp); // 错误：没有 ADL！\n}\n```\n\n\n\n在这个示例中，我们可能期望在调用\
  \ `select<3>(xp)` 时通过 ADL 找到模板 `select()`。然而，事实并非如此，因为编译器在确定 `<3>` 是一个模板参数列表之前，无法判断\
  \ `xp` 是一个函数调用参数。此外，编译器在发现 `select()` 是一个模板之前，无法判断 `<3>` 是模板参数列表。由于这个“先有鸡还是有蛋”的问题无法解决，表达式被解析为\
  \ `(select<3)>(xp)`，这是没有意义的。\n\n这个示例可能会给人一种 ADL 对模板 ID（template-ids）禁用的印象，但事实并非如此。通过引入一个在调用处可见的名为\
  \ `select` 的函数模板可以修复代码：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename T> void select();\n\
  ```\n\n尽管对于调用 `select<3>(xp)` 来说没有任何意义，但该函数模板的存在确保了 `select<3>` 会被解析为模板 ID。随后，ADL\
  \ 将找到函数模板 `N::select`，调用将成功。\n\n#### 13.3.6 依赖表达式\n\n与标识符一样，表达式本身也可以依赖于模板参数。依赖于模板参数的表达式在不同的实例化之间其行为可能有所不同——例如，选择不同的重载函数，或者产生不同的类型或常量值。相比之下，不依赖于模板参数的表达式在所有实例化中都提供相同的行为。\n\
  \n表达式可以通过几种不同的方式依赖于模板参数。依赖表达式最常见的形式是*类型依赖表达式*（type-dependent expression），其中表达式本身的类型可以从一个实例化转变为另一个——例如，引用函数参数的表达式，而该参数的类型是模板参数的类型：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<typename T> void typeDependent1(T x)\n{\n  x; //\
  \ 表达式是类型依赖的，因为 x 的类型可能会变化\n}\n```\n\n具有类型依赖子表达式的表达式通常本身本身也是类型依赖的——例如，使用参数 `x` 调用函数\
  \ `f()`：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename T> void typeDependent2(T x)\n\
  {\n  f(x); // 表达式是类型依赖的，因为 x 是类型依赖的\n}\n```\n\n在这里，注意 `f(x)` 的类型可能会从一个实例化转变为另一个，原因一是因为\
  \ `f` 可能解析为一个其结果类型取决于参数类型的模板，原因二是因为两阶段查找（详见第 14.3.1 节，第 249 页）可能会在不同的实例化中找到完全不同的名为\
  \ `f` 的函数。\n\n并不是所有涉及模板参数的表达式都是类型依赖的。例如，涉及模板参数的表达式可以在不同的实例化之间产生不同的常量*值*。此类表达式被称为*值依赖表达式*（value-dependent\
  \ expressions），其中最简单的是引用非依赖类型的非类型类型模板参数的表达式。例如：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<int\
  \ N> void valueDependent1()\n{\n  N; // 表达式是值依赖的而非类型依赖的，\n      // 因为 N 有固定的类型，但常量值会变化\n\
  }\n```\n\n与类型依赖表达式一样，如果一个表达式是由其他值依赖表达式组成的，那么它通常也是值依赖的，因此 `N + N` 或 `f(N)` 也是值依赖表达式。\n\
  \n有趣的是，某些操作（如 `sizeof`）具有已知的结果类型，因此它们可以将一个类型依赖的操作数转换为一个不是类型依赖的值依赖表达式。例如：\n\n点击此处查看代码图像\n\
  \n```cpp\ntemplate<typename T> void valueDependent2(T x)\n{\n  sizeof(x); // 表达式是值依赖的但不是类型依赖的\n\
  }\n```\n\n无论输入是什么，`sizeof` 操作始终产生一个 `std::size_t` 类型的值，因此 `sizeof` 表达式永远不是类型依赖的，即使——在本例中——它的子表达式是类型依赖的。然而，结果常量值会从一个实例化转变为另一个，因此\
  \ `sizeof(x)` 是一个值依赖表达式。\n\n如果我们对值依赖表达式应用 `sizeof` 会怎样？\n\n点击此处查看代码图像\n\n```cpp\n\
  template<typename T> void maybeDependent(T const& x)\n{\n  sizeof(sizeof(x));\n\
  }\n```\n\n在这里，如上所述，内层的 `sizeof` 表达式是值依赖的。然而，外层的 `sizeof` 表达式始终计算 `std::size_t` 的大小，因此它的类型和常量值在模板的所有实例化中都是一致的，尽管最内层的表达式（`x`）是类型依赖的。任何涉及模板参数的表达式都是实例化依赖的，即使其类型和常量值在所有实例化中都是不变的。然而，在这种情况下，用不类型实例化\
  \ `maybeDependent()` 将触发错误。\n\n类型依赖、值依赖和实例化依赖可以被视为表达式的一系列递进分类。任何类型从一个实例化转变为另一个的表达式都是值依赖的。同样，其值从一个实例化转变为另一个的表达式以某种方式依赖于模板参数。这种包含关系如图\
  \ 13.1\n\n*图 13.1 类型依赖、值依赖和实例化依赖表达式之间的包含关系*\n\n从最内层上下文（类型依赖表达式）到最外层上下文，模板的行为在模板解析时就越确定，因此不会从一个实例化转变为另一个。例如，考虑调用\
  \ `f(x)`：如果 `x` 是类型依赖的，那么 `f` 是一个受两阶段查找（详见第 14.3.1 节，第 249 页）影响的依赖标识；而如果 `x` 是值依赖但不是类型依赖的，`f`\
  \ 是一个非依赖标识，其名称查找可以在模板解析时完全确定。\n\n#### 13.3.7 编译器错误\n\n当模板的所有实例化都会产生某个错误时，C++ 编译器被允许（但不是要求！）在解析模板时诊断该错误。让我们扩展上一一节中的\
  \ `f(x)` 示例以进一步探讨：\n\n点击此处查看代码图像\n\n```cpp\nvoid f() { }\n\ntemplate<int x> void\
  \ nondependentCall()\n{\n  f(x); // x 是值依赖的，所以 f()是非依赖的；\n      // 此调用永远不会成功\n}\n\
  ```\n\n在这里，`f(x)` 在每次实例化中都会产生错误，因为 `f` 是一个非依赖标识，且唯一可见的 `f` 接受零参数而不是一个。C++ 编译器可以在解析模板时产生错误，也可能等到第一次模板实例化：常用的编译器甚至在这样一个简单的示例上也存在差异。我们可以使用实例化依赖但非值依赖的表达式来构造类似的示例：\n\
  \n点击此处查看代码图像\n\n\n\n\n```cpp\ntemplate<int N> void instantiationDependentBound()\n\
  {\n  constexpr int x = sizeof(N);\n  constexpr int y = sizeof(N) + 1;\n  int array[x\
  \ - y];  // 在所有实例化中，array 的大小都为负\n}\n```\n\n### 13.4 继承与类模板\n\n类模板可以继承自，也可以被继承。对于许多目的而言，模板场景和非模板场景之间没有显著区别。然而，当从由依赖名称（dependent\
  \ name）引用的基类派生类模板时，存在一个重要的微妙之处。让我们先看稍微简单一点是非依赖基类的情况。\n\n#### 13.4.1 非依赖基类\n\n在类模板中，非依赖基类是指一种具有完整类型的基类，该类型可以在不知道模板参数的情况下被确定。换句话说，该基类的名称使用非依赖名称表示。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<typename X>\nclass Base {\n  public:\n    int basefield;\n\
  \    using T = int;\n};\nclass D1: public Base<Base<void>> {  //其实并不是一个模板情况\n  public:\n\
  \    void f() { basefield = 3; }      //对继承成员的常规访问\n};\n\ntemplate<typename T>\n\
  class D2 : public Base<double> {      //非依赖\n  public:\n    void f() { basefield\
  \ = 7; }        //对继承成员的常规访问\n    T strange;         // T 是 Base<double>::T，而不是模板参数！\n\
  };\n```\n\n模板中的非依赖基类的行为与普通非模板类中的基类非常相似，但有一个略微令人意料的惊喜：当在模板派生类中查找未限定名称（unqualified\
  \ name）时，非依赖基类会在模板参数列表之前被考虑。这意味着在之前的示例中，类模板 `D2` 的成员 `strange` 始终具有对应于 `Base<double>::T`\
  \ 的类型 `T`（换句话说，即 `int`）。例如，以下函数不是有效的 C++（假设之前的声明存在）：\n\n点击此处查看代码图像\n\n```cpp\nvoid\
  \ g (D2<int*>& d2, int* p)\n{\n    d2.strange = p;     // 错误：类型不匹配！\n}\n```\n\n\
  这是违反直觉的，要求派生模板的编写者意识到其派生的非依赖基类中的名称——即使这种派生是间接的或名称是私有的。将模板参数放在它们所“模板化”的实体的作用范围内可能会更好。\n\
  \n#### 13.4.2 依赖基类\n\n在之前的示例中，基类是完全确定的。它不依赖于模板参数。这意味着 C++ 编译器一看到模板定义，就可以查找这些基类中的非依赖名称。另一种替代方案（C++\
  \ 标准不允许）是将此类名称的查找延迟到模板实例化时。这种替代方案的缺点是，它也会将任何由于符号缺失导致的错误信息延迟到实例化。因此，C++ 标准规定，出现在模板中的非依赖名称在遇到它时立即进行查找。记住这一点，考虑以下示例：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<typename T>\nclass DD : public Base<T> {      //依赖基类\n\
  \  public:\n    void f() { basefield = 0; }  // #1 问题……\n};\n\ntemplate<>  // 显式特化\n\
  class Base<bool> {\n  public:\n    enum { basefield = 42 };      // #2 棘！\n};\n\n\
  void g (DD<bool>& d)\n{\n    d.f();                          // #3 哎？\n}\n```\n\n\
  在点 #1 处，我们找到了对非依赖名称 `basefield` 的引用：它必须立即查找。假设我们在模板 `Base` 中查找它并将其绑定到我们在其中找到的 `int`\
  \ 成员。然而，不久之后，我们用显式特化覆盖了 `Base` 的通用定义。恰恰，这个特化改变了我们已经提交的 `basefield` 成员的含义！因此，当我们在点\
  \ #3 处实例化 `DD::f` 的定义时，我们发现我们太操急地绑定了点 #1 处的非依赖名称。在 `DD<bool>` 中没有在点 #2 处特化的可修改的\
  \ `basefield`，本应该发布错误信息。\n\n为了规避这个问题，标准 C++ 说非依赖名称*不会*在依赖基类中被查找（但它们仍然在遇到时立即被查找）。因此，标准的\
  \ C++ 编译器会在点 #1 处发出诊断信息。要纠正代码，只需使名称 `basefield` 变为依赖的，因为依赖名称只有在实例化时才能查找，而在那时将知道必须被探索的具体基类实例。例如，在点\
  \ #3 处，编译器将知道 `DD<bool>` 的基类是 `Base<bool>`，并且它已经被程序员显式特化了。在这种情况下，我们倾向的使名称依赖的方法是：\n\
  \n点击此处查看代码图像\n\n```cpp\n// 变体 1\ntemplate<typename T>\nclass DD1 : public Base<T>\
  \ {\n  public:\n    void f() { this->basefield = 0; }\n};\n```\n\n点击此处查看代码图像\n\n\
  ```cpp\n// 变体 2\ntemplate<typename T>\nclass DD2 : public Base<T> {\n  public:\n\
  \    void f() { Base<T>::basefield = 0; }\n};\n```\n\n在使用这种解决方案必须小心，因为如果使用未限定名称来形成虚调用，将抑制该机制。尽管如此，在某些情况下方案是合适的：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<typename T>\nclass B {\n  public:\n    enum { e1\
  \ = 6, e2 = 28, e3 = 49 };\n    virtual void zero(E e);\n    virtual void one(E&);\n\
  };\n\ntemplate<typename T>\nclass D : public B<T> {\n  public:\n    void f() {\n\
  \      typename D<T>::E e; // this->E 将无效\n      this->zero();       // D<T>::zero()\
  \ 将抑制虚函数\n      one(e);             // one 是依赖的，因为调用的一个参数类型是依赖的\n    }\n};\n```\n\
  \n注意我们在示例中使用了 `D<T>::E` 而不是 `B<T>::E`。在这种情况下，两者都有效。但在多重继承的情况下，我们可能不知道哪个基类提供了所需的成员（在这种情况下使用派生类限定是有效的），或者多个基类声明了相同的名称（在这种情况下我们可能需要使用特定的基类来消除歧义）。\n\
  \n注意调用 `one(e)` 中的名称 `one` 依赖于模板参数，仅仅因为其显式参数的类型。隐式使用的依赖模板参数的默认参数是不算的，因为编译器在已经决定查找之前无法验证这一点——这是一个鸡生蛋还是蛋的问题。为了避免微妙性，我们倾向于在所有允许的情况下使用\
  \ `this->` 前缀——即使对于非模板代码。\n\n如果你发现重复的限定弄乱了代码，你可以在派生类中一次性地从依赖基类中引入一个名称：\n\n点击此处查看代码图像\n\
  \n```cpp\n// 变体 3\ntemplate<typename T>\nclass DD3 : public Base<T> {\n  public:\n\
  \    using Base<T>::basefield; // #1 依赖名称现在在作用范围内\n    void f() { basefield = 0;\
  \ } // #2 正常\n};\n```\n\n\n\n点 `#2` 处的查找成功，并找到了 `#1` 处的 `using declaration`（使用声明）。然而，`using\
  \ declaration` 直到实例化时才会被验证，而我们的目标已经实现。这种方案存在一些细微的局限性。例如，如果派生自多个基类，程序员必须精确选择哪一个基类包含了所需要的成员。\n\
  \n在当前实例化中搜索限定限定名（qualified name）时，C++ 标准规定查找首先在当前实例化和所有非依赖基类（nondependent bases）中搜索，这与对该名称进行非限定名查找的方式类似。如果找到了任何名称，则该限定名指向当前实例化中的成员，并且不会是依赖名称（dependent\
  \ name）。如果未找到此类名称，且该类具有任何依赖基类，则该限定名指向一个未知特化的成员。例如：\n\n点击此处查看代码图像\n\n```cpp\nclass\
  \ NonDep {\n public:\n  using Type = int;\n};\n\ntemplate<typename T>\nclass Dep\
  \ {\n public:\n  using OtherType = T;\n};\n\ntemplate<typename T>\nclass DepBase\
  \ : public NonDep, public Dep<T> {\n public:\n  void f() {\n    typename DepBase<T>::Type\
  \ t; // 找到 NonDep::Type; // typename 关键字可选\n    typename DepBase<T>::OtherType ot;\
  \ // 什么都没找到; DepBase<T>::OtherType\n                                       // 是未知特化的成员\n\
  \  }\n};\n```\n\n### 13.5 后记\n\n第一个真正解析模板定义的编译器是由名为 Taligent 的公司在 20 世纪 90 年代开发的。在此之前——甚至在之后的几年里——大多数编译器将模板视为标记标记序列，在实例化时通过解析器回放。因此，没有进行解析，除了为了找到模板定义结束所需的极少解析外。在本文写作时，Microsoft\
  \ Visual C++ 编译器仍然以这种方式工作。Edison Design Group (EDG) 的编译器前端使用了一种混合技术，模板在内部被处理为带注释的标记序列，但在所需的模式下会执行“泛型解析”以验证语法（EDG\
  \ 的产品模拟了其他多个编译器；特别是，它可以紧密模拟微软编译器的行为）。\n\nBill Gibbons 是 Taligent 在 C++ 委员会的代表，也是使模板具有无歧解析性的主要倡导者。Taligent\
  \ 的努力直到编译器被惠尔惠口碑（HP）收购并完成成为 HP 编译器后才发布。在它的竞争优势中，HP 编译器因其高质量的诊断而迅速获得认可。模板诊断并不总是延迟到实例化时，这一事实无疑贡献了这种感知。\n\
  \n在模板开发的相对早期，为 Meta 工作的广受认可的解析专家 Tom Pennello 注意到了与角括号有关的问题。Stroustrup 也对该话题发表了评论，并认为人类倾向于使用括号而不是圆括号。然而，存在其他可能性，Pennello\
  \ 在 1991 年的 C++ 标准会议上专门提议使用大括号（例如 `{X}`）。在当时，问题的范围更为有限，因为模板内部的模板（称为成员模板）是不有效的，因此对第\
  \ `13.3` 节的讨论很大程度上无关。结果，委员会拒绝了替换角括号的建议。\n\n第 `13.4.2` 节描述的针对非依赖名称和依赖基类的名称查找规则在 1993\
  \ 年被引入 C++ 标准。它在 Bjarne Stroustrup 1994 年的著作中向“普通公众”进行了描述。然而，该规则的第一个通用实现直到 1997\
  \ 年初才出现，当时 HP 将其整合到他们的编译器中，而那时已经有了大量派生自依赖基类的代码。事实上，当 HP 工程师开始测试他们的实现时，他们发现大多数以非平凡方式使用模板的程序不再能够编译。特别是，标准模板库\
  \ (`STL`) 的所有实现在数百个（有时是数千个）地方处都违反了该规则。为了方便客户的过渡过程，HP 如下软化了与假设非依赖名称可以在依赖类中找到的代码相关的诊断，方式如下：当在类模板作用域内使用的非依赖名称无法通过标准规则找到时，HP\
  \ 会窥视依赖基类内部。如果仍然未找到该名称，则会发出硬错误（hard error）并编译失败。但是，如果在依赖基类中找到了名称，则会发出警告，并将该名称标记为类似于依赖名称，以便在实例化时重新尝试查找。\n\
  \n这种导致非依赖基类中的名称隐藏同名模板的查找规则（第 `13.4.1` 节）是一个疏忽，但更改规则的建议尚未获得 C++ 标准委员会的支持。最好避免使用同时在非依赖基类中使用的模板参数名称。良好的命名规范对此类问题很有帮助。\n\
  \n友元注入（Friend name injection）被认为是有害的，因为它使得程序的有效性对实例化顺序更加敏感。Bill Gibbons（当时正在开发 Taligent\
  \ 编译器）是解决该问题最大声的支持者之一，因为消除实例化依赖能够实现新的且有趣的 C++ 开发环境（据传 Taligent 正在开发此类环境）。然而，Barton-Nackman\
  \ 技巧（第 `21.2.1` 节）需要某种形式的友元注入，正是这种特定技术导致它以目前的（基于 ADL 的弱化）形式保留在语言中。\n\nAndrew Koenig\
  \ 最初仅针对运算符函数提了 ADL（这就是为什么 ADL 有时被称为 Koenig 查找）。其动机主要是美学：显式用包含的命名空间限定运算符名称最好也很奇怪（例如，与其写\
  \ `a+b`，我们可能需要写 `N::operator+(a, b)`），而且为每个运算符编写使用声明会导致代码臃肿。因此，决定在与参数相关的命名空间中查找运算符。ADL\
  \ 后来被扩展到普通函数名，以适应有限的友元注入，并支持模板及其实例化的两阶段查找模型。广义 ADL 规则也称为扩展 Koenig 查找。\n\n角括号黑科技（angle\
  \ bracket hack）的规范由 David Vandevoorde 通过其论文 N1757 添加到 C++11。他还通过解决核心问题 1104 添加了字形组合黑科技（digraph\
  \ hack），以响应美国对 C++11 标准草案的审查请求。在 C++98/C++03 中，这也称为 Koenig 查找（或扩展 Koenig 查找），Andrew\
  \ Koenig 首次提了这种机制的变体。尽管这显然是 C++ 标准编写者的意图，但在标准中并没有明确说明。\n\n\n\n\n\n注意使用双括号，以避免将 `(Invert<1>)0`\
  \ 解析为类型转换操作——这是语法歧义的另一个来源。\n\n此节引入了特定的异常来解决本节描述的标记化问题。\n\n1998 年和 2003 年版本的 C++\
  \ 标准不支持这种“角括号黑魔法（angle bracket hack）”。然而，在两个连续的右角括号之间引入空格的需求对于初级模板用户来说是一个非常常见的障碍，因此委员会决定在\
  \ 2011 标准中将这种黑魔法规范化。\n\n某些提供 C++98 或 C++03 模式的编译器在这些模式下保留了 C++11 的行为，因此在正式编译 C++98/C++03\
  \ 代码时也会打印 `0 0`。\n\n因此，这是上述*最大程度匹配（maximum munch*）*原则的一个特例。\n\n感谢 Richard Smith\
  \ 指出这一点。\n\n注意，C++20 可能会在大多数情况下消除对 `typename` 的需求（详见第 354 页第 17.1 节）。\n\n在语法上，这些上下文中仅允许使用类型名，因此始终假设限定名指向一个类型。\n\
  \n改编自 *VandevoordeSolutions*，彻底证明了 C++ 促进了代码重用。\n\n*类型依赖表达式（type-dependent expression）*和*值依赖表达式（value-dependent\
  \ expression）*在 C++ 标准中用于描述模板的语义，它们对模板实例化的多个方面都有影响（第 14 章）。另一方面，*实例化依赖表达式（instantiation-dependent\
  \ expression）*术语主要由 C++ 编译器的作者使用。我们对实例化依赖表达式的定义来自 Itanium C++ ABI *ItaniumABI*，它为许多不同\
  \ C++ 编译器之间的二进制交互性提供了基础。\n\n这是*两阶段查找（two-phase lookup）*规则的一部分，该规则区分了首次看到模板定义时的第一阶段，以及实例化模板时的第二阶段（见第\
  \ 249 页第 14.3.1 节）。\n\n尽管如此，当模板被实例化时，查找仍然会重复，如果在该上下文中产生了不同的结果，则程序是非良法的（ill-formed）。大括号也不是完全没有问题。具体来说，模板特化的语法将需要调整。\n\
  \n幸运的是，他们在发布新功能之前发现了这些。讽刺的是，这些实现中的第一个也是由 HP 开发的。\n\n# 第 14 章 实例化\n\n模板实例化是从泛型模板定义生成类型、函数和变量的过程。C++\
  \ 模板实例化的概念是基础性的，但也十分复杂。这种复杂性的根本原因之一是，模板生成的定义不再局限于源代码中的单个位置。模板所在的位置、使用模板的位置以及定义模板参数的位置都对该实体的含义起着作用。\n\
  \n在本章中，我们解释了如何组织源代码以启用模板的使用。此外，我们还调查了最流行的 C++ 编译器用于处理实例化的各种方法。尽管所有这些方法在语义上应当是等效的，但理解编译器策略的基本原理是有用的。每种机制在构建现实软件时都有一套自己的特性，反之，它们也影响了\
  \ C++ 的最终规范。\n\n## 14.1 按需实例化\n\n当 C++ 编译器遇到模板的使用使用时，它将通过为模板参数替换所需的参数来创建该特化。这是自动完成的，不需要客户端代码（或者模板定义本身）的指导。这种按需特性将\
  \ C++ 模板与其他编译型语言中的类似设施（如 Ada 或 Eiffel；其中一些语言需要显式实例化指令，而另一些语言使用运行时机制来避免实例化过程）区分开来。它有时被称为*隐式*或*自动*实例化。\n\
  \n按需实例化意味着编译器通常在使用点访问模板的完整定义（换句话说，不仅仅是声明）以及其某些成员。考虑以下微小的源文件：\n\n```cpp\ntemplate<typename\
  \ T> class C; // #1 仅声明\nC<int>* p = 0; // #2 正常，不需要 C<int> 的定义\n\ntemplate<typename\
  \ T>\nclass C {\n public:\n   void f(); // #3 成员声明\n}; // #4 类定义完成\n\nvoid g (C<int>&\
  \ c) // #5 仅使用类模板\n{\n   c.f(); // #6 使用类模板；// 需要 C::f 的定义\n}\n\ntemplate<typename\
  \ T>\nvoid C<T>::f() // 由于 #6 需要定义\n{\n}\n```\n\n在源代码的 #1 点，只有模板的声明，没有定义（这种声明有时称为*前向声明（forward\
  \ declaration）*）。与普通类一样，声明该类型的指针或引用不需要看到类模板的定义，正如 #2 点所做的那样。例如，函数 `g()` 参数的类型不需要模板\
  \ `C` 的完整定义。一旦一旦组件需要特化版本的大小或访问此类特化版本的成员，则要求整个类模板定义必须可见。这解释了为什么在源代码的 #6 点，必须看到类模板定义；否则编译器无法验证该成员是否存在以及是否可访问（非私有或保护）。此外，成员函数的定义也是需要的，因为\
  \ #6 点的调用需要 `C<int>::f()` 存在。\n\n`C<void>* p = new C<void>;`\n\n在这种情况下，实例化是必要的，以便编译器确定\
  \ `C<void>` 的大小，`new` 表达式需要它来确定分配多少内存。你可能会发现，对于这个特定的模板，替换 `T` 的参数 `X` 的类型不会影响模板的大小，因为在任何情况下\
  \ `C<X>` 都是空类。但编译器并不要求通过分析模板定义来避免实例化（而且在实践中，所有编译器都执行了实例化）。\n\n\n\n\n访问类模板成员的需求在源代码中并不总是非常显式可见的。例如，C++\
  \ 的重载解析需要对候选函数参数的类类型可见可见：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename T>\nclass C\
  \ {\n  public:\n    C(int);       // 一个可以用单个参数调用的构造函数\n};               // 可能被用于隐式转换\n\
  void candidate(C<double>); // #1\nvoid candidate(int) { } // #2\nint main()\n{\n\
  \    candidate(42);  // 之前的两个函数声明都可以被调用\n}\n```\n\n调用 `candidate(42)` 将解析到点 `#2`\
  \ 处的重载声明。然而，点 `#1` 处的声明也可以被实例化，以检查它是否是该调用的可行候选者（在这种情况下它是可行的，因为单参数构造函数可以将 `42` 隐式转换为类型为\
  \ `C<double>` 的右值）。请注意，如果编译器可以在不进行实例化的情况下解析调用（在本例中是可能的，因为隐式转换不会被优于精确匹配），则它被允许（但不是要求）执行此实例化。同样注意，`C<double>`\
  \ 的实例化可能会触发错误，这可能会令人惊讶。\n\n### 14.2 延迟实例化\n\n到为止的示例说明了这些与使用非模板类时的要求在本质上没有区别。许多用法需要类类型是*完整的*的（参见第\
  \ 154 页的节 10.3.1）。对于模板情况，编译器将根据类模板定义生成这个完整的定义。\n\n现在出现了一个相关的问题：模板会被多少？模糊答案是：只有真正需要的部分。换句话说，编译器在实例化模板时应该是“懒惰”的。让我们具体看看这种懒惰到底包含什么。\n\
  \n### 14.2.1 部分实例化与完全实例化\n\n正如我们所看到的，编译器有时不需要替换类或函数模板的完整定义。例如：\n\n点击此处查看代码图像\n\n\
  ```cpp\ntemplate<typename T> T f (T p) { return 2*p; }\ndecltype(f(2)) x = 2;\n\
  ```\n\n在这个示例中，`decltype(f(2))` 指出的类型不需要函数模板 `f()` 的完全实例化。因此，编译器仅允许替换 `f()` 的声明，而不替换它的“函数体”。这有时被称为*部分实例化*。\n\
  \n同样，如果引用一个类模板实例而不需要该实例是一个完整类型，则编译器不应该对该类模板实例执行完全实例化。考虑以下示例：\n\n点击此处查看代码图像\n\n```cpp\n\
  template<typename T> class Q {\n  using Type = typename T::Type;\n};\nQ<int>* p\
  \ = 0;      // OK: Q<int> 的体没有被替换\n```\n\n在这里，`Q<int>` 的完全实例化将触发错误，因为当 `T` 为 `int`\
  \ 时，`T::Type` 是没有意义的。但由于在这个示例中 `Q<int>` 并不是完整的，因此没有执行完全实例化，代码是好的（尽管看起来很可疑）。\n\n\
  变量模板也有“完全”与“部分”实例化的区别。下面的示例说明了这一点：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename T>\
  \ T v = T::default_value();\ndecltype(v<int>) s;  // OK: v<int> 的初始化器没有被实例化\n```\n\
  \n`v<int>` 的完全实例化会引发错误，但如果我们只需要变量模板实例的类型，则是不需要的。\n\n有趣的是，别名模板（alias templates）没有这种区别：它们没有两种替换方式。\n\
  \n在 C++ 中，当谈论“模板实例化”而不特指完全实例化或部分实例化时，指的是前者。也就是说，默认情况下实例化是完全实例化。\n\n### 14.2.2 实例化的组件\n\
  \n当类模板被隐式（完全）实例化时，其成员的每个声明也会被实例化，但相应的定义不会（即成员是部分实例化的）。对此有几个例外。首先，如果类模板包含一个匿名联合（union），则该联合定义的成员也会被实例化。(3)\
  \ 另一个异常发生在虚成员函数上。它们的定义可能因为实例化类模板而被实例化，也可能不会。事实上，许多实现会实例化定义，因为虚调用需要虚函数存在。在实例化时，默认参数是被单独考虑的。异常规范和默认初始化器不会被实例化。\n\
  \n让我们结合起一些示例来说明一些原则：\n\n点击此处查看代码图像\n\n```cpp\n// details/lazy.hpp\ntemplate<typename\
  \ T>\nclass Safe { };\n\ntemplate<int N>\nclass Danger {\n  int arr[N];\n};\n\n\
  template<typename T, int N>\nclass Tricky {\n  public:\n    Safe<T> = 3; // OK 直到使用默认导致错误\n\
  \    void inclass() {\n      Danger<N> noBody; // OK 直到在 N<=0 时使用\n    }\n    struct\
  \ Nested {\n      Danger<N> pfew; // OK 直到在 N<=0 时使用\n    };\n    union {\n    \
  \  Danger<N> anonymous; // 由于匿名联合\n      int align;\n    };\n    void unsafe(T (*p)[N]);\
  \ // OK 直到以 N<=0 实例化\n    void error() {\n      Danger<-1> boom; // 始终错误（但编译器不检测）\n\
  \    }\n};\n```\n\n标准 C++ 编译器将检查这些模板定义以检查语法和一般的语义约束。在此过程中，在检查涉及模板参数的约束时，它会“假设最好的”。例如，成员\
  \ `Danger::arr` 中的参数 `N` 可能是 0 或负数（这是无效的），但假设这种情况并非如此。(4) 因此，`inclass()`、`struct\
  \ Nested` 和匿名联合的定义没有问题。\n\n出于同样的原因，只要 `N` 是一个未替换的模板参数，成员 `unsafe(T (*p)[N])` 的声明就没有问题。\n\
  \n\n\n\n成员函数 `noBodyHere()` 声明中的默认参数规范（`= 3`）是可疑的，因为模板 `Safe<>` 无法用整数初始化，但假设是，要么默认参数在\
  \ `Safe<T>` 的泛型定义中实际上并不需要，要么 `Safe<T>` 将被特化（参见第 16 章）以允许使用整数值初始化。然而，成员函数 `error()`\
  \ 的定义即使在模板未实例化时也是一个错误，因为使用 `Danger<-1>` 需要类 `Danger<-1>` 的完整定义，而生成该类会遇到尝试定义一个大小为负数的数组的问题。有趣的是，虽然标准明确规定这段代码是无效的，但它也允许编译器在模板实例未被实际使用时不诊断出该错误。也就是说，由于\
  \ `Tricky<T,N>::error()` 未用于任何具体的 `T` 和 `N`，编译器并不要求在这种情况下发布错误。例如，在撰本文本文时，`GCC` 和\
  \ `Visual C++` 都没有诊断此错误。\n\n现在让我们分析一下添加以下定义时会发生什么：\n\n```\nTricky<int, -1> inst;\n\
  ```\n\n这会导致编译器通过在模板 `Tricky<>` 的定义中用 `int` 替换 `T` 并用 `-1` 替换 `N` 来（完全）实例化 `Tricky<int,\
  \ -1>`。并不是所有的成员定义都需要，但默认构造函数和析构函数（在这种情况下都是隐式声明的）肯定会被调用，因此它们的定义必须以某种方式可用（在我们的示例中如此，因为它们是隐式生成的）。如上所示，`Tricky<int,\
  \ -1>` 的成员是部分实例化的（即它们的 `declarations` 被替换了）：该过程可能会导致错误。例如，`unsafe(T (*p)[N])` 的声明创建了一个元素数量为负数的数组类型，这是一个错误。同样，成员\
  \ `anonymous` 现在触发了错误，因为类型 `Danger<-1>` 无法完成。相比之下，成员 `inclass()` 和结构体 `Nested` 的定义尚未实例化，因此不会因为它们需要完整类型\
  \ `Danger<-1>`（正如我们之前讨论的，它包含一个无效的数组定义）而发生错误。\n\n按照目前的写法，在实例化模板时，实践上还应该提供虚拟成员的定义。否则，可能会发生链接错误。例如：\n\
  \n点击此处查看代码图像\n\n`details/lazy2.cpp`\n\n```cpp\ntemplate<typename T>\nclass VirtualClass\
  \ {\n  public:\n    virtual ~VirtualClass() {}\n    virtual T vmem();  // 如果在没有定义的情况下实例化可能会报错*\n\
  };\n\nint main()\n{\n    VirtualClass<int> inst;\n}\n```\n\n最后，关于 `operator->` 的说明。考虑：\n\
  \n```cpp\ntemplate<typename T>\nclass C {\n  public:\n    T operator-> ();\n};\n\
  ```\n\n通常，`operator->` 必须返回指针类型或另一个适用于 `operator->` 的类类型。这似乎表明 `C<int>` 的完成会触发错误，因为它为\
  \ `operator->` 声明了 `int` 作为返回类型。然而，由于某些模板定义触发了这些定义，语言规则更加灵活。用户定义的 `operator->` 只有在当运算符实际上被重载解析选中时，才要求返回一个适用于\
  \ `operator->` 的类型。这在模板外部也是如此（尽管这种松化的行为用处较小）。因此，这里的声明即使返回类型被替换为 `int` 也不会报错。\n\n\
  ### 14.3 C++ 实例化模型\n\n模板实例化是通过适当替换模板参数，从模板获取常规类型、函数或变量的过程。这听起来可能很简单，但在实践中，需要确定许多细节。\n\
  \n#### 14.3.1 两阶段查找\n\n在第 13 章中，我们看到在解析模板时无法解析依赖名称。相反，它们在实例化点被再次查找。然而，非依赖名称在早期就会被查找，以便在第一次看到模板时就能诊断出错误。这引入了两阶段查找的概念：第一阶段是模板的解析，第二阶段是它的实例化：\n\
  \n1.  在第一阶段，在解析模板期间，使用普通查找以及（如果适用）参数依赖性查找（`ADL`）规则来查找非依赖名称。未限定的依赖名称（它们是依赖的，因为它们看起来像带有依赖参数的函数调用名）使用普通查找进行查找，但在在第二阶段（当模板实例化时）执行额外查找之前，查找结果是不完整的。\n\
  2.  在第二阶段，在实例化点（`POI`）实例化模板时，会查找依赖名称（将模板参数替换为该特定实例的模板参数），并对在第一阶段中查找过的未限定依赖名称执行额外的\
  \ `ADL`。\n\n对于未限定的依赖名称，初始查找（虽然不完整）被用于判断该名称是否为模板。考虑以下示例：\n\n点击此处查看代码图像\n\n```cpp\n\
  namespace N {\n  template<typename> void g() {}\n  enum E { e };\n}\n\ntemplate<typename>\
  \ void f() {}\ntemplate<typename T> void h(T P) {\n  f<int>(p); // #1\n  g<int>(p);\
  \ // #2\n}\n\nint main() {\n  h(N::e); // T = E 时调用 h\n}\n```\n\n在 `#1` 行，当看到 `f`\
  \ 跟着 `<` 时，编译器必须决定 `<` 是尖括号还是小于号。这取决于 `f` 是否被已知为模板名；在这种情况下，普通查找找到了 `f` 的声明，它确实是一个模板，因此尖括号解析成功。\n\
  \n`#2` 行产生错误，因为通过普通查找找不到模板 `g`；因此 `<` 被视为小于号，这在示例中是一个语法错误。如果我们能解决这个问题，在为 `T = E`\
  \ 实例化 `h` 时，最终将通过 `ADL` 找到模板 `N::g`（因为 `N` 是 `E` 相关的命名空间），但在解析 `h` 的泛型定义之前无法无法。\n\
  \n#### 14.3.2 实例化点\n\n我们已经说明了模板客户端的源代码中存在 C++ 编译器必须访问模板实体声明或定义的地方。当代码结构以某种方式引用模板实例化，导致需要实例化相应的模板定义来创建该实例化时，就会创建一个实例化点（`POI`）。`POI`\
  \ 是源代码中可以插入替换模板的地方。例如：\n\n点击此处查看代码图像\n\n```cpp\nclass MyInt {\n  public:\n    MyInt(int\
  \ i);\n};\nMyInt operator - (MyInt const&);\nbool operator > (MyInt const&, MyInt\
  \ const&);\nusing Int = MyInt;\n\ntemplate<typename T>\nvoid f(T i)\n{\n  if (i>0)\
  \ {\n    g(-i);\n  }\n} // #1\n\nvoid g(Int)\n{\n  // #2\n  f<Int>(42); // 调用点 #3\n\
  } // #4\n```\n\n\n\n\n当 C++ 编译器看到调用 `f<Int>(42)` 时，它知道模板 `f` 需要在 `T` 替换为 `MyInt`\
  \ 的情况下进行实例化：此时产生了一个 POI（Point of Instantiation）。点 *#2* 和点 *#3* 非常紧邻调用点，但它们不能是 POI，因为\
  \ C++ 不允许我们在该处插入 `::f<Int>(Int)` 的定义。点 *#1* 和点 *#4* 之间的本质区别在于，在点 *#4* 处函数 `g(Int)`\
  \ 是可见的，因此模板依赖调用 `g(-i)` 可以被解析。然而，如果点 *#1* 是 POI，那么该调用将无法解析，因为 `g(Int)` 此时尚不可见。幸运的是，C++\
  \ 定义函数模板特化引用的 POI 为紧邻包含该引用的最近命名空间作用域声明或定义。在我们的示例中，这就是点 *#4*。\n\n你可能会疑惑为什么这个示例涉及类型\
  \ `MyInt` 而不是简单的 `int`。答案在于，在 POI 处进行的第二次查找仅仅是 ADL（参数依赖查找）。因为 `int` 没有关联的命名空间，因此\
  \ POI 查找将不会发生，也就找不到函数 `g`。因此，如果我们认为 `Int` 的类型别名声明替换为\n\n```cppusing Int = int;\n\
  ```\n\n之前的示例将不再通过编译。接下来的示例也存在类似的问题：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename T>\n\
  void f1(T x)\n{\n    g1(x);  /* *#1 */\n}\n\nvoid g1(int)\n{\n}\n\nint main()\n\
  {\n    f1(7);  // ERROR: g1 not found!\n}\n```\n\n*#2* *f1<int>(int) 的* *POI*\n\n\
  调用 `f1(7)` 在 `main()` 外部的点 *#2* 处为 `f1<int>(int)` 创建了一个 POI。在这次实例化中，关键问题是 Find 函数\
  \ `g1` 的查找。当第一次遇到模板 `f1` 的定义时，会注意到无限定名 `g1` 是依赖的，因为它是一个带有依赖参数的函数调用中的函数名（参数 `x` 的类型取决于模板参数\
  \ `T`）。因此，在点 *#1* 处使用普通查找规则查找 `g1`；然而，在该点并无可见的 `g1`。在点 *#2*，即 POI 处，再次在关联的命名空间和类中查找该函数，但唯一的参数类型是\
  \ `int`，它没有关联的命名空间和类。因此，即使在 POI 处通过普通查找可以找到 `g1`，`g1` 实际上也从未被找到。\n\n变量模板的实例化点处理方式与函数模板类似。(7\
  \ 这里的链接仅为原文保留)。对于类模板特化，情况有所不同，如下示例所示：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename\
  \ T>\nclass S {\n  public:\n    T m;\n};\n\n/* *#1 */\nunsigned long h()\n{\n  /*\
  \ *#2 */\n  return (unsigned long)sizeof(S<int>);\n  /* *#3 */\n}\n\n/* *#4 */\n\
  ```\n\n再次，函数作用域点 *#2* 和点 *#3* 不能是 POI，因为命名空间作用域类 `S<int>` 的定义不能出现在那里（且模板通常不能出现在函数作用域^8）。如果我们遵循函数模板实例的规则，POI\
  \ 将位于点 *#4*，但此时表达式 `sizeof(S<int>)` 是无效的，因为在到达点 *#4* 之前无法确定 `S<int>` 的大小。因此，生成的类实例引用的\
  \ POI 定义为紧邻包含该实例引用的最近命名空间作用域声明或定义点。在我们的示例中，这就是点 *#1*。\n\n当模板被实际实例化时，可能会出现额外实例化的需求。考虑一个短示例：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<typename T>\nclass S {\n  public:\n    using I\
  \ = int;\n};\n\n/* *#1 */\ntemplate<typename T>\nvoid f()\n{\n    S<char>::I var1\
  \ = 41;\n    typename S<T>::I var2 = 42;\n}\n\nint main()\n{\n    f<double>();\n\
  }\n```\n\n*#2* *:* *#2a**,* *#2b*\n\n我们之前的讨论已经确了 `f<double>()` 的 POI 位于点 *#2*。在这次实例化中，关键问题是函数\
  \ `g1` 的查找。当第一次遇到模板 `f1` 的定义时，会注意到无限定名 `g1` 是依赖的，因为它是一个带有依赖参数的函数调用中的函数名（参数 `x` 的类型取决于模板参数\
  \ `T`）。因此，在点 *#1* 处使用普通查找规则查找 `g1`；然而，在该点并无可见的 `g1`。在点 *#2*，即 POI 处，再次在关联的命名空间和类中查找该函数，但唯一的参数类型是\
  \ `int`，它没有关联的命名空间和类。因此，即使在 POI 处通过普通查找可以找到 `g1`，`g1` 实际上也从未被找到。（等待，提供的文本在此重复了一些逻辑，我将保持提供的文本结构）。\n\
  \n我们之前的讨论已经确认了 `f<double>()` 的 POI 位于点 *#2*。 ...（后续文本逻辑如下）。\n\n#### 14.3.3 包含模型（The\
  \ Inclusion Model）\n\n每当遇到 POI 时，相应模板的定义必须是可用的。对于类特化，这意味着类模板定义必须在翻译单元之前之前可见。对于函数模板和变量模板（以及类模板的成员函数和静态数据成员）的\
  \ POI，这也是需要的，通常模板定义只是简单地被 `#include` 进翻译单元的头文件中，即使它们是非类型模板。这种用于模板定义的源模型被称为*包含模型*，它是当前\
  \ C++ 标准支持的唯一模板自动源模型。(10)\n\n\n\n\n\n尽管包含模型（inclusion model）鼓励程序员将所有模板定义都放置在头文件中，以便能够满足任何可能出现的实例化点（POIs），但也可以使用`显式实例化声明`（explicit\
  \ instantiation declarations）和`显式实例化定义`（explicit instantiation definitions）来显式管理实例化（参见第\
  \ 260 页的第 14.5 节）。这样做在操作上并非易事，大多数情况下，程序员更倾向于依赖自动实例化机制。自动方案的一个挑战是处理在不同编译单元中，针对同一个函数或变量模板的特化（或类模板实例的同一个成员函数或静态数据成员）存在多个实例化点的情况。接下来我们将讨论此的方法。\n\
  \n## 14.4 实现方案\n\n在本节中，我们将回顾 C++ 实现支持包含模型的方法。所有这些实现都依赖两个经典组件：`编译器`（compiler）和`链接器`（linker）。`编译器`将源代码翻译为对象文件，对象文件包含带有符号注释（交叉引用其他对象文件和库）的机器码。`链接器`通过组合对象文件并解决它们包含的符号交叉引用来创建可执行程序或库。在下文中，我们假设这种模型，尽管以其他方式实现\
  \ C++ 是完全可能的（但并不流行）。例如，人们可能会想象一个 C++ 解释器。\n\n当类模板特化在多个编译单元中使用时，`编译器`会在每个编译单元中重复实例化过程。这产生极少的问题，因为类定义不会直接创建底层代码。它们仅在\
  \ C++ 实现内部用于验证和解释各种其他表达式和声明。在这方面，类定义的多次实例化与在多个编译单元中多次包含类定义（通常通过头文件包含）在实质上没有区别。\n\
  \n然而，如果你实例化了一个（非内联的）函数模板，情况可能会有所不同。如果你提供了普通非内联函数的多个定义，你将违反 ODR（单定义规则）。假设例如，你编译并链接了一个由以下两个文件组成的程序：\n\
  \n```cpp\n// ==== a.cpp:\nint main()\n{\n}\n```\n\n```cpp\n// ==== b.cpp:\nint main()\n\
  {\n}\n```\n\n`C++ 编译器`会分别编译每个模块而不会出现问题，因为它们确实是有效的 C++ 编译单元。然而，如果你尝试将它们链接在一起，你的`链接器`极可能会报错：不允许存在重复定义。\n\
  \n相比之下，考虑模板的情况：\n\n点击此处查看代码图像\n\n```cpp\n// ==== t.hpp:\n// 通用头文件（包含模型）\ntemplate<typename\
  \ T>\nclass S {\n  public:\n    void f();\n};\n\ntemplate<typename T>\nvoid S::f()\
  \    //成员定义\n{\n}\n\nvoid helper(S<int>*);\n```\n\n```cpp\n// ==== a.cpp:\n#include\
  \ \"t.hpp\"\nvoid helper(S<int>* s)\n{\n    s->f();   // #1 S::f 的第一个实例化点\n}\n```\n\
  \n```cpp\n// ==== b.cpp:\n#include \"t.hpp\"\nint main()\n{\n    S<int> s;\n   \
  \ helper(&s);\n    s.f();    // #2 S::f 的第二个实例化点\n}\n```\n\n如果`链接器`处理类模板实例化的成员函数就像处理普通函数或成员函数一样，那么`编译器`需要确保它只在两个实例化点中的一个生成代码：即点\
  \ #1 或 #2，而不是两者。为了实现这一点，`编译器`必须将信息从一个编译单元传递到另一个编译单元，这在引入模板之前，C++ 编译器从未被要求这样做过。在下文中，我们将讨论\
  \ C++ 实现者所使用的三类解决方案。\n\n请注意，模板实例化产生的所有可链接实体都存在相同的问题：实例化的函数模板和成员函数模板，以及实例化的静态数据成员和实例化的变量模板。\n\
  \n### 14.4.1 贪婪实例化（Greedy Instantiation）\n\n首批普及贪婪实例化的 `C++ 编译器`由一家名为 Borland 的公司生产。它已成为各种\
  \ C++ 系统中最常用的技术。\n\n贪婪实例化假设`链接器`意识到某些实体（特别是可链接的模板实例化）实际上可能在不同的对象文件和库中重复出现。`编译器`通常会以特殊方式标记这些实体。当`链接器`发现多个实例时，它保留一个并丢弃所有其他实例。仅此而已。\n\
  \n在理论上，贪婪实例化有一些严重的缺点：\n\n-   `编译器`可能在生成和优化 `N` 个实例化上浪费时间，其中只有一个会被保留。\n-   `链接器`通常不检查两个实例化是否相同，因为对于一个模板特化的多个实例，生成的代码中可能会合法地出现一些无关紧道的差异。这些细微差异不应导致`链接器`失败。（这些差异可能源于实例化时`编译器`状态的细微差异。）然而，这通常也会导致`链接器`没有注意到更具实质性的差异，例如，当一个实例化使用严格的浮点数学规则编译，而另一个使用松散的、更高性能的浮点数学规则编译时。([11)）\n\
  - 所有对象文件的总和可能比替代方案大得多，因为相同的代码被重复多次。\n\n在实践中，这些缺点似乎没有导致重大问题。也许这是因为贪婪实例化在一个重要方面与替代方案相比非常有优势：传统的源-对象依赖被保留了。特别是，一个编译单元生成一个对象文件，并且每个对象文件都包含对应文件中所有的可链接定义（包括实例化的定义）。另一个重要优势是，所有函数模板实例都是内联的候选，而无需诉诸昂贵的“链接时”优化机制（在实践中，函数模板实例通常是受益于内联的小函数）。其他实例化机制对`inline`函数模板实例进行特殊处理以确保它们可以被内联。然而，贪婪实例化允许即使是非内联函数模板实例也可以内联。\n\
  \n最后，值得注意的是，允许可链接实体重复定义的`链接器`机制通常也用于处理重复的`溢出内联函数`（(12)）和`虚函数分发表`（(13)）。如果没有这种机制，替代方案通常是让这些项具有内部链接，但以生成更多代码为代价。内联函数具有单一地址的要求使得以标准方法实现该替代方案变得困难。\n\
  \n### 14.4.2 查询实例化（Queried Instantiation）\n\n\n\n\n\n在 20 世纪 90 年代中期，一家名为 `Sun Microsystems`\
  \ 的公司发布了其 C++编译器的重新实现（4.0 版本），针对实例化问题提供了一种新而有趣的解决方案，我们称之为`查询实例化`（queried instantiation）。`查询实例化`在概念上非常简单且优雅，但从时间顺序来看，它是我们在此回顾的最新一类实例化方案。在这种方案中，会维护一个由参与程序的所有编译单元编译时共享的数据库。该数据库跟踪哪些特化版本已经实例化，以及它们依赖于哪些源代码。生成的特化版本本身通常与这些信息一起存储在数据库中。每遇到可链接实体的实例化点时，可能会发生三种情况之一：\n\
  \n1. 没有可用特化版本：在这种情况下，发生实例化，并将生成的特化版本存入数据库。\n2. 有可用特化版本，但由于自生成以来源代码发生了变化，它已过时。在这里，同样发生实例化，但生成的特化版本将替换之前存储在数据库中的版本。\n\
  3. 数据库中有最新的特化版本。无需任何操作。\n\n尽管概念上简单，但这种设计面临着一些实现上的挑战：\n\n* 很难正确地维护数据库内容相对于源代码状态的依赖关系。虽然将第三种情况误认为第二种情况并不算错误，但这样做会增加编译器执行的工作量（从而增加整体编译/构建时间）。\n\
  * 并发编译多个源文件是非常常见的。因此，工业级的实现需要在数据库中提供恰当的并发控制。\n\n尽管存在这些挑战，该方案仍然可以非常高效地实现。此外，没有明显的病态用例会导致该解决方案的扩展性变差；相比之下，例如贪婪实例化（greedy\
  \ instantiation）可能会导致大量的无效工作。\n\n遗憾的是，使用数据库也可能给程序员带来一些问题。这些问题大部分的根源源于这样一个事实：从大多数\
  \ C 编译器中继承的传统编译模型不再适用：单个编译单元不再产生单个独立的对象文件。假设，例如，你想要链接你的最终程序。该链接操作不仅需要与你的各种编译单元相关的每个对象文件的内容，还需要存储在数据库中的对象文件。同样，如果你创建一个二进制库，你需要确保创建该库的工具（通常是链接器或归档器）能够感知到数据库的内容。更通地说，任何操作对象文件的工具都可能需要被告知数据库的内容。这些问题中的许多可以通过不将实例化存储在数据库中来缓解，而是通过在最初导致实例化的对象文件中输出目标代码来解决。\n\
  \n库引入了另一个挑战。许多生成的特化版本可能被封装在一个库中。当库被添加到另一个项目时，该项目的数据库可能需要感知到已经可用的实例化。如果不是，且该项目为库中存在的特化版本创建了某些实例化点，则可能会发生重复实例化。处理此类情况的一种可能策略是使用与贪婪实例化相同的链接器技术：让链接器感知生成的特化版本，并让它剔除重复项（尽管如此，这种情况发生的频率应比贪婪实例化时低得多）。源代码、对象文件和库的各种其他细微安排可能会导致令人沮的问题，例如缺失实例化，因为包含所需实例化的目标代码没有链接到最终的可执行程序中。\n\
  \n最终，查询实例化并没有在市场上生存下来，即使是 Sun 的编译器现在也使用贪婪实例化。\n\n### 14.4.3 迭代实例化 (Iterated Instantiation)\n\
  \n第一个支持 C++模板的编译器是 `Cfront 3.0`——它是 Bjarne Stroustrup 为开发该语言而编写的编译器的直接后代。`Cfront`\
  \ 的一个不灵活的限制是它必须在平台之间具有很强的可移植性，这意味着它 (1) 使用 C 语言作为所有目标平台的通用目标表示，并且 (2) 使用本地目标链接器。特别是，这意味着链接器并并感知模板。事实上，`Cfront`\
  \ 将模板实例化作为普通的 C 函数输出，因此它必须避免重复实例化。尽管 `Cfront` 的源码模型不同于标准的包含模型（inclusion model），但它的实例化策略可以被调整以适应包含模型。因此，它也值得被认为是迭代实例化的首次化身。`Cfront`\
  \ 的迭代可以描述如下：\n\n1. 编译源代码，但不实例化任何所需的可链接的特化版本。\n2. 使用 `prelinker`（预链接器）链接对象文件。\n3.\
  \ `prelinker` 调用链接器并解析其错误信息，以确定某些错误是否是由缺失实例化导致的。如果是，`prelinker` 在包含所需模板定义的源码上调用编译器，并带有生成缺失实例化的选项。\n\
  4. 如果生成了任何定义，则重复步骤 3。\n\n对迭代步骤 3 的需求源于这样一种观察：一个可链接实体的实例化可能会导致需要另一个尚未实例化的此类实体。最终，迭代将“收敛”，链接器将成功构建一个完整的程序。\n\
  \n原始 `Cfront` 方案的缺点非常严重：\n\n* 感知的的链接时间不仅增加了预链接器的开销，还增加了每次必要的重新编译和重新链接的成本。某些基于 `Cfront`\
  \ 系统的用户报告说，与之前报道的替代方案的“大约一小时”相比，他们的链接时间长达“几天”。\n* 诊断信息（错误、警告）被延迟到链接阶段。当链接变得昂贵，且开发者必须等待几个小时才能发现模板定义中的一个拼写错误时，这尤为令人痛苦。\n\
  * 必须特别注意记住特定定义所在的位置（步骤 1）。`Cfront` 特别使用了一个中心仓库，它必须处理查询实例化方法中中心数据库的一些挑战。特别是，原始的 `Cfront`\
  \ 实现并未支持并发编译。\n\n迭代原理随后通过 Edison Design Group (EDG) 的实现以及 HP 的 `aC++` 进行了完善，消除了原始\
  \ `Cfront` 实现的某些缺点。在实践中，这些实现运行得良好，尽管从零开始构建的时间通常比替代方案更耗时，但随后的构建时间是非常有竞争力的。尽管如此，很少有\
  \ C++编译器继续使用迭代实例化。\n\n### 14.5 显式实例化 (Explicit Instantiation)\n\n可以显式地为模板特化创建一个实例化点。实现此点的构造被称为显式实例化指令（explicit\
  \ instantiation directive）。语法上，它由 `template` 关键字加上要实例化的特化的声明组成。例如：\n\n```cpp\ntemplate<typename\
  \ T>\nvoid f(T)\n{\n}\n\n// 四个有效的显式实例化：\ntemplate void f<int>(int);\ntemplate void\
  \ f<>(float);\ntemplate void f(long);\n```\n\n\n\n\n\n```cpp\ntemplate void f(char);\n\
  ```\n\n注意，每一个实例化指令都是有效的。模板参数可以被推导（请参见第 15 章）。\n\n类模板的成员也可以通过这种方式进行显式实例化：\n\n点击查看代码图片\n\
  \n```cpp\ntemplate<typename T>\nclass S {\n  public:\n    void f() {\n\n    }\n\
  };\n```\n\n```cpp\ntemplate void S<int>::f();\n\ntemplate class S<void>;\n```\n\n\
  此外，类模板特化的所有成员都可以通过显式实例化该类模板特化来显式实例化。由于这些显式实例化指令确保了命名的模板特化（或其成员）定义的创建，因此上述显式实例化指令更准确地称为**显式实例化定义**。被显式实例化的模板特化不应被显式特化，反之亦然，因为这将意味着两个定义可能是不同的（从而违反了\
  \ ODR）。\n\n#### 14.5.1 手动实例化\n\n许多 C++ 程序员已经观察到自动模板实例化对编译时间产生了显著的负面影响。这对于实现贪婪实例化的编译器来说尤其如此（参见第\
  \ 256 页 的 14.4.1 节），因为相同的模板特化可能会许多不同的翻译单元中被实例化和优化。\n\n提高编译时间的技术是在单个位置手动实例化程序所需的那些模板特化，并抑制所有其他翻译单元中的实例化。确保这种抑制的一种可移植方法是：除了显式实例化的翻译单元外，不提供模板定义^(17)。例如：\n\
  \n点击查看代码图片\n\n```cpp\n// ===== 翻译单元 1: //\ntemplate<typename T> void f(); // 无定义：防止在此翻译单元\n\
  \                                // 中实例化\nvoid g()\n{\n    f<int>();\n}\n\n// =====\
  \ 翻译单元 2: //\ntemplate<typename T> void f()\n{\n  // 实现\n}\n\ntemplate void f<int>();\
  \         // 手动实例化\nvoid g();\nint main()\n{\n    g();\n}\n```\n\n在第一个翻译单元中，编译器看不到函数模板\
  \ `f` 的定义，因此它不会（也无法）产生 `f<int>` 的实例化。第二个翻译单元通过显式实例化定义提供了 `f<int>` 的定义；如果没有它，程序将无法通过链接。\n\
  \n手动实例化有一个明显的缺点：我们必须细致地跟踪需要实例化哪些实体。对于大型项目，这很快就会变成一种沉重的负担；因此，我们不建议使用它。我们参与过几个项目，这些项目最初低估了这种负担，随着代码的成熟，我们对自己的决定感到后悔。\n\
  \n然而，手动实例化也有一些优点，因为实例化可以根据程序需求进行调整。显然，这避免了大型头文件的开销，也避免了在多个翻译单元中使用相同参数重复实例化相同模板的开销。此外，模板定义的源代码可以隐藏，但这样客户端程序就无法创建额外的实例化。\n\
  \n通过将模板定义放在第三个源文件中（传统上使用 `.tpp` 后缀），可以减轻手动实例化的部分负担。对于我们的函数 `f`，这可以分解为：\n\n点击查看代码图片\n\
  \n```cpp\n// ===== f.hpp: //\ntemplate<typename T> void f(); // 无定义：防止实例化\n\n//\
  \ ===== t.hpp: //\n#include \"f.hpp\"\ntemplate<typename T> void f()  // 定义\n{\n\
  \  // 实现\n}\n\n// ===== f.cpp: //\n#include \"f.tpp\"\ntemplate void f<int>(); \
  \        // 手动实例化\n```\n\n这种结构提供了一些灵活性。人们可以只包含 `f.hpp` 来获取 `f` 的声明，而没有自动实例化。可以根据需要向\
  \ `f.cpp` 中手动添加显式实例化。或者，如果手动实例化变得过于繁琐，也可以包含 `f.tpp` 来启用自动实例化。\n\n#### 14.5.2 显式实例化声明\n\
  \n消除冗余自动实例化的更具针对性的方法是使用**显式实例化声明**，它是带有关键字 `extern` 前缀的显式实例化指令。显式实例化声明*通常*会抑制所命名模板特化的自动实例化，因为它声明了命名的模板特化将在程序的某个地方（通过显式实例化定义）定义。我们说*通常*是因为这里有很多例外：\n\
  \n- 内联函数仍然可以为了展开的目的进行实例化（但不会生成单独的对象）。\n- 具有 `auto` 或 `decltype(auto)` 变量以及具有推导返回类型的函数仍然可以实例化以确定它们的类型。\n\
  - 值可以作为常量表达式使用的变量仍然可以实例化，以便评估其值。\n- 引用类型的变量仍然可以实例化，以便解析它们所引用的实体。\n- 类模板和别名模板仍然可以实例化以检查结果的类型。\n\
  \n使用显式实例化声明，我们可以在头文件 (`t.hpp`) 中提供 `f` 的模板定义，然后抑制常用特化的自动实例化，如下：\n\n点击查看代码图片\n\n\
  ```cpp\n// ===== t.hpp: //\ntemplate<typename T> void f()\n{\n}\nextern void f<int>();\
  \ // 声明未定义\nextern void f<float>(); // 声明未定义\n\n// ===== t.cpp: //\ntemplate void\
  \ f<int>();  // 定义\ntemplate void f<float>(); // 定义\n```\n\n每个显式实例化声明必须与对应的显式实例化定义配对，定义必须位于声明之后。省略定义会导致链接错误。\n\
  \n当某些特化在许多不同的翻译单元中使用时，可以使用显式实例化声明来提高编译或链接速度。与手动需要在需要新特化时手动更新显式实例化定义列表不同，显式实例化声明可以在任何点引入优化。然而，编译时间的收益可能没有手动实例化那样显著，这既是因为可能会发生冗余实例化^(18)，也是因为模板定义仍然作为头文件的一部分。\n\
  \n#### 14.6 编译期 if 语句\n\n正如第 134 页 的 [8.5 节]所示，C++17 引入了一种语句类型，它在编写模板时被证明非常有用：编译期\
  \ `if`。它在实例化过程中也引入了一个新的转折。\n\n下面的示例展示了它的基本操作：\n\n点击查看代码图片\n\n```cpp\ntemplate<typename\
  \ T> bool f(T p) {\n  if constexpr (sizeof(T) <= sizeof(long long)) {\n    return\
  \ p>0;\n  } else {\n    return p.compare(0) > 0;\n  }\n}\n\nbool g(int n) {\n  \
  \  return f(n); // OK\n}\n```\n\n\n\n\n\n编译时 `if` 是一个 `if` 语句，其中 `if` 关键字后面紧跟 `constexpr`\
  \ 关键字（如本例所示）^(19。随后的括号条件必须具有常量布尔值（包括到 `bool` 的隐式转换也在考虑范围之内）。因此，编译器知道哪个分支会被选中；另一个分支被称为“丢弃分支”（discarded\
  \ branch）。特别值得关注的是，在实例化模板（包括泛型 lambda 表达式）期间，丢弃分支**不会**被实例化。这对于我们的示例有效至关重要：我们正在用\
  \ `T = int` 实例化 `f(T)`，这意味着 `else` 分支被丢弃了。如果没有被丢弃，它将被实例化，并且我们会在表达式 `p.compare(0)`\
  \ 上遇到错误（当 `p` 是简单整数时，该表达式是非的）。\n\n在 C++17 及其 `constexpr if` 语句出现之前，避免此类错误需要显式的模板特化或函数重载（参见第\
  \ 16 章）来达到类似效果。\n\n上面的示例在 C++14 中可能实现如下所示：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<bool\
  \ b> struct Dispatch {  //仅在 b 为 false 时实例化\n\n  static bool f(T p) {          \
  \   //(由于后续对 true 的特化)*\n\n    return p.compare(0) > 0;\n  }\n};\n\ntemplate<> struct\
  \ Dispatch<true> {\n  static bool f(T p) {\n    return p > 0;\n  }\n};\n\ntemplate<typename\
  \ T> bool f(T p) {\n  return Dispatch<sizeof(T) <= sizeof(long long)>::f(p);\n}\n\
  \nbool g(int n) {\n  return f(n);  // OK\n}\n```\n\n显然，`constexpr if` 替代方案更清晰、更简洁地表达了我们的意图。然而，它要求实现能够细化实例化单元：以前函数定义总是作为一个整体进行实例化，而现在必须能够抑制其部分内容的实例化。\n\
  \n另一个非常实用的 `constexpr if` 用法是处理函数参数包所需的递归。为了泛化第 134 页 的第 8.5 节 中所示引入的示例：\n\n点击此处查看代码图像\n\
  \n```cpp\ntemplate<typename Head, typename… Remainder>\nvoid f(Head&& h, Remainder&&…\
  \ r) {\n  doSomething(std::forward<Head>(h));\n  if constexpr (sizeof…(r) != 0)\
  \ {\n    // 递归处理剩余部分（完美转发参数）：\n    f(std::forward<Remainder>(r)…);\n  }\n}\n```\n\
  \n如果没有 `constexpr if` 语句，这需要为 `f()` 模板提供额外的重载，以确保递归终止。\n\n即使在非模板上下文中，`constexpr\
  \ if` 语句也具有某种独特的效果：\n\n点击此处查看代码图像\n\n```cpp\nvoid h();\n\nvoid g() {\n  if constexpr\
  \ (sizeof(int) == 1) {\n    h();\n  }\n}\n```\n\n在大多数平台上，`g()` 中的条件为 `false`，因此对\
  \ `h()` 的调用被丢弃。结果是，`h()` 不一定需要定义（当然，除非它在其他地方被使用）。如果在这个示例中省略了 `constexpr` 关键字，那么缺少\
  \ `h()` 的定义通常会在链接时引发错误。^(20)\n\n### 14.7 标准库\n\nC++ 标准库包含了许多模板，这些模板通常只与少数基本类型一起使用。例如，`std::basic_string`\
  \ 类模板最常用的类型是 `char`（因为 `std::string` 是 `std::basic_string<char>` 的类型别名）或 `wchar_t`，尽管可以使用其他字符类类型来实例化。因此，标准库的实现通常会为这些常见情况引入显式实例化声明。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\nnamespace std {\n  template<typename charT, typename traits\
  \ = char_traits<charT>,\n              typename Allocator = allocator<charT>>\n\
  \  class basic_string {\n    …\n  };\n  extern template basic_string<char>;\n  extern\
  \ template basic_string<wchar_t>;\n}\n```\n\n### 14.8 后记\n\n本章涉及两个相关但不同的问题：`编译模型`（compilation\
  \ model）和`实例化机制 _instantiation mechanisms）。\n\n`编译模型`决定了模板在翻译各个阶段的含义。标准 C++ 仅支持单一的编译模型。然而，1998\
  \ 年和 2003 年的标准还支持`分离模型`separation model），它允许模板定义写在与其实例化不同的翻译单元中。\n\n`实例化机制`是允许 C++\
  \ 实现创建实例化的外部机制。这些机制受到链接器和其他软件工具的限制。虽然实例化机制在不同实现之间存在差异，但它们通常对 C++ 的日常编程没有产生显著影响。\n\
  \n在 C++11 完成后，Walter Bright、Herb Sutter 和 Andrei Alexandrescu 提出了一种与 `constexpr\
  \ if` 类似的“静态 if”特性（通过论文 N3329）。然而，这是一个更通用的特性，甚至可以出现在函数定义之外。（Walter Bright 是 D 语言的主要设计者和实现者，该语言具有类似的功能。）例如：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<unsigned long N>\nstruct Fact {\n  static if (N\
  \ <= 1) {\n    constexpr long long value = 1;\n  } else {\n    constexpr long long\
  \ value = N*Fact<N-1>::value;\n  }\n};\n```\n\n注意示例中类作用域内的声明是如何变为条件的。然而，这种强大的能力引起了争议，一些委员会成员担心它被滥用，另一些人则不喜欢该提案的某些技术方面（例如大括号没有引入作用域，且丢弃分支完全没有被解析）。\n\
  \n几年后，Ville Voutilainen 回归了一项提案（P0128），其大部分就是后来变成 `constexpr if` 语句。它经历了一些细微的设计迭代（涉及假设性关键字\
  \ `static_if` 和 `constexpr_if`），并在 Jens Maurer 的帮助下，Ville 最终将提案推入了语言（通过论文 P0292r2）。\n\
  \n\n\n\n\n# `instantiation`（实例化）有时也用于指代从类型创建对象。在本书中，它始终指的是`template`实例化。\n\n# `specialization`（特化）一词用于泛指作为模板特定实例的实体（参见第\
  \ 10 章）。它不是指第 16 章描述的`explicit specialization`（显式特化）机制。\n\n# 匿名联合体在这方面总是特殊的：它们的成员可以被视为外层类的成员。匿名联合体主要表示某些类成员共享相同的存储区域结构。\n\
  \n# 某些编译器（如 `GCC`）允许零长度数组作为扩展，因此即使 `N` 最终为 `0`，它们也可能接受这段代码。\n\n# 典型的例子是`smart pointer`模板（例如标准的\
