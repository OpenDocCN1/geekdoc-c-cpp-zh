- "# C++ Templates：完全指南\n\n\n\n![](img/cover.jpeg)\n\n\n\n\n![Image](img/00001.jpeg)\n\
  \n\n\n\n\n\n\n\n\n\n\n\n致 Alessandra & Cassandra\n—David\n\n致所有关心他人和人类的人\n—Nico\n\
  \n致 Amy, Tessa & Molly\n—Doug\n\n\n\n\n\n\n\n\n自 C++17 起，你甚至可以为聚合定义推导指南：\n\n点击此处查看代码图片\n\
  \n```cpp\nValueComment(char const*, char const*) -> ValueComment<std::string>;\n\
  ValueComment vc2 = {\"hello\", \"initial value\"};\n```\n\n如果没有推导指南，这种初始化是不可能的，因为\
  \ `ValueComment` 没有构造函数来进行推导。\n    return v * VAT;\n}\n\ntemplate<std::string name>\
  \     // 错误：类类型对象不允许\nclass MyClass {               // 允许作为模板参数\n    …\n};\n```\n\
  \n在向指针或引用传递模板参数时，这些对象不能是字符串面字量、临时对象、以及数据成员或其他子对象。由于这些限制在 C++17 之前的每一个 C++ 版本中都得到了放宽，因此还存在以下额外的约束：\n\
  \n- 在 C++11 中，对象还必须具有外部链接。\n- 在 C++14 中，对象还必须具有外部或内部链接。\n\n因此，以下操作是不可能的：\n\n点击此处查看代码图像\n\
  \n```cpp\ntemplate<char const* name>\nclass MyClass {\n  …\n};\n\nMyClass<\"hello\"\
  > x; // 错误：不允许字符串面字量 \"hello\"\n```\n\n然而存在通通方法（再次取决于具体的 C++ 版本）：\n\n点击此处查看代码图像\n\
  \n```cpp\nextern char const s03[] = \"hi\";   // 外部链接\nchar const s11[] = \"hi\"\
  ;         // 内部链接\nint main()\n{\n    Message<s03> m03;           // OK（所有版本）\n\
  \    Message<s11> m11;           // 从 C++11 起 OK\n    static char const s17[] =\
  \ \"hi\"; // 无链接\n    Message<s17> m17;           // 从 C++17 起 OK\n}\n```\n\n在所有三种情况下，常量字符数组都通过\
  \ `\"hello\"` 初始化，并且该对象被用作为 `char const*` 的模板参数。如果该对象具有外部链接（`s03`），则在所有 C++ 版本中都是有效的；在\
  \ C++11 和 C++14 中，如果它具有内部链接（`s11`）也有效；从 C++17 起，如果它完全没有链接也有效。\n\n详细讨论请参见第 194 页的节\
  \ 12.3.3，关于该领域未来可能变化的讨论请参见第 354 页的节 17.2。\n\n## 避免无效表达式\n\n非类型模板参数的参数可以是任何编译时表达式。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<int I, bool B>\nclass C;\n…\nC<sizeof(int) + 4,\
  \ sizeof(int)> c;\n```\n\n注意，如果表达式中使用了 `operator>`，你必须将整个表达式放在括号中，以便确保 `>` 结束参数列表：\n\
  \n点击此处查看代码图像\n\n```cpp\nC<4, sizeof(int) > 4> c; // 错误：第一个 > 结束了模板列表\nC<4, (sizeof(int)\
  \ > 4)> c; // OK\n```\n\n## 模板参数 auto\n\n从 C++17 开始，你可以定义一个非类型模板参数，以泛型方式接受任何允许作为类型参数的类型。使用这一功能，我们可以提供一个具有固定大小的泛型栈：\n\
  \n点击此处查看代码图像\n\n```cpp\n// basics/stack.hpp\n#include <array>\n#include <cassert>\n\
  \ntemplate<typename T, auto sizesize>\nclass Stack {\npublic:\n    using size_type\
  \ = decltype(sizesize);\nprivate:\n    std::array<T, sizesize> elems;\n    size_type\
  \ numElems;\n\npublic:\n    Stack() : numElems(0); // 构造函数\n    void push(const\
  \ T& elem) { // push\n        assert(numElems < sizesize);\n        elems[numElems]\
  \ = elem;\n        ++numElems;\n    }\n    void pop() { // pop\n        assert(numElems\
  \ > 0);\n        --numElems;\n    }\n    const T& top() const { // top\n       \
  \ assert(numElems > 0);\n        return elems[numElems - 1];\n    }\n    bool empty()\
  \ const { // 是否为空\n        return numElems == 0;\n    }\n    size_type size() const\
  \ { // size\n        return numElems;\n    }\n};\n```\n\n```cpp\n// basics/stackauto.cpp\n\
  #include <iostream>\n#include <string>\n#include \"stackauto.hpp\"\n\nint main()\n\
  {\n    Stack<int,20u> int20Stack; // 容量为 20 的 int \n    Stack<std::string,40> stringStack;\
  \ // 容量为 40 的 string \n    // 操作容量为 20 的栈\n    int20Stack.push(7);\n    std::cout\
  \ << int20Stack.top() << \"\\n\";\n    auto size1 = int20Stack.size();\n    // 操作容量为\
  \ 40 的栈\n    stringStack.push(\"hello\");\n    std::cout << stringStack.top() <<\
  \ \"\\n\";\n    auto size2 = stringStack.size();\n    if (!std::is_same_v<decltype(size1),\
  \ decltype(size2)>) {\n        std::cout << \"size types differ\" << \"\\n\";\n\
  \    }\n}\n```\n\n通过使用占位符 `auto`，你定义 `sizesize` 为任何允许作为非类型参数的类型。内部你可以使用指定的值以及它未指定的类型。\n\
  \n\n\n\n\n```cpp\nStack<int,20u> int20Stack; // 最多包含 20 个 int 的栈\n```\n内部大小类型为 `unsigned\
  \ int`，因为传递了 `20u`。\n\n如果是：\n\n```cpp\nStack<std::string,40> stringStack; // 最多包含\
  \ 40 个 string 的栈\n```\n内部大小类型为 `int`，因为传递了 `40`。\n\n这两个栈的 `size()` 将具有不同的返回类型，因此在：\n\
  \n```cpp\nauto size1 = int20Stack.size();\n…\nauto size2 = stringStack.size();\n\
  ```\n\n`size1` 和 `size2` 的类型不同。通过使用标准类型特 trait `std::is_same`（参见第 726 页第 D.3.3 节）和\
  \ `decltype`，我们可以检查到：\n\n```cpp\nif (!std::is_same<decltype(size1), decltype(size2)>::value)\
  \ {\n  std::cout << \"size types differ\" << '\\n';\n}\n```\n\n因此，输出将是：\nsize types\
  \ differ\n\n自 C++17 起，对于返回值的特 trait，你还可以使用后缀 `_v` 并跳过 `::value`（详情请参见第 83 页第 5.6\
  \ 节）：\n\n```cpp\nif (!std::is_same_v<decltype(size1), decltype(size2)>) {\n  std::cout\
  \ << \"size types differ\" << '\\n';\n}\n```\n\n注意，对非类型模板参数（nontype template parameters）类型的其他限制仍然有效。特别是关于第\
  \ 49 页第 3.3 节中讨论的关于非类型模板参数可能的类型的限制仍然适用。例如：\n\n```cpp\nStack<int,3.14> sd; // 错误：浮点数非类型参数\n\
  ```\n\n而且，由于你也可以将字符串作为常量数组传递（自 C++17 起甚至支持静态局部声明；详参见第 49 页第 3.3 节），以下是可能的：\n\n`basics/message.cpp`\n\
  \n```cpp\n#include <iostream>\n\ntemplate<auto T> // 获取任何可能的非类型参数的值（自 C++17 起）\n\
  class Message {\n  public:\n    void print() {\n      std::cout << T << '\\n';\n\
  \    }\n};\n\nint main()\n{\n  Message<42> msg1;\n  msg1.print(); // 使用 int 42 初始化并打印该值\n\
  \  static char const s[] = \"hello\";\n  Message<s> msg2; // 使用 char const[6] \"\
  hello\" 初始化\n  msg2.print(); // 并打印该值\n}\n```\n\n同样注意，即使是 `template<decltype(auto)\
  \ N>` 也是可能的，这允许将 `N` 实例化为引用：\n\n```cpp\ntemplate<decltype(auto) N>\nclass C {\n\
  \  …\n};\n\nint i;\nC<(i)> x; // N 是 int&\n```\n\n详情请参见第 296 页第 15.10.1 节。\n\n###\
  \ 3.5 总结\n- 模板可以拥有值而非类型的模板参数。\n- 你不能使用浮点数或类对象作为非类型模板参数的参数。对于字符串字面量的指针/引用、临时变量和子对象，存在相应的限制。\n\
  - 使用 `auto` 允许模板拥有泛型类型值的非类型模板参数。\n\n# 第 4 章 变参模板\n\n自 C++11 起，模板可以拥有接受可数量参数的参数。这一特性允许在必须传递任意数量任意类型参数的地方使用模板。一个典型的应用是通过类传递任意数量的参数。另一个应用是提供通用代码来处理任意数量的任意类型的参数。\n\
  \n### 4.1 变参模板\n-模板参数可以定义为接受无限制数量参数。具有这种能力的模板被称为*变参模板*。\n\n#### 4.1.1 示例说明变参模板\n\
  例如，你可以使用以下代码为不同类型的可数量参数调用 `print()`：\n\n`basics/varprint.hpp`\n\n```cpp\n#include\
  \ <iostream>\n\nvoid print () {\n}\n\ntemplate<typename T, typename… Types>\nvoid\
  \ print (T firstArg, Types… args) {\n  std::cout << firstArg << '\\n'; // 打印第一个参数\n\
  \  print(args…); // 为剩余参数调用 print()\n}\n```\n\n如果传递了一个或多个参数，则将使用函数模板，它通过单独指定第一个参数，允许在递归调用\
  \ `print()` 处理剩余参数之前先打印第一个参数。这些剩余参数命名为 `args`，是一个函数包（function pack）：\n\n```cpp\n\
  template<typename T, typename… Types>\nvoid print (T firstArg, Types… args) // 使用模板包指定的\
  \ \"Types\"\n```\n\n为了结束递归，提供了 `print()` 的非模板重载版本，它在参数包为空时触发：\n\n```cpp\ntemplate<typename\
  \ T, typename… Types>\nvoid print ()\n```\n\n例如，如下调用\n\n```cpp\nstd::string s(\"\
  world\");\nprint (7.5, \"hello\", s);\n```\n\n将输出：\n7.5\nhello\nworld\n\n原因是该调用首先展开为：\n\
  \n```cpp\nprint<double, char const*, std::string> (7.5, \"hello\", s);\n```\n\n\
  其中 `firstArg` 值为 `7.5`，使得 `T` 为 `double`，且 `args` 为类型为 `char const*` 的 `\"hello\"\
  ` 和类型为 `std::string` 的 `\"world\"`。\n\n在打印 `7.5` 作为 `firstArg` 后，它再次调用 `print()`\
  \ 处理剩余参数，随后展开为：\n\n```cpp\nprint<char const*, std::string> (\"hello\", s);\n```\n\
  \n其中 `firstArg` 值为 `\"hello\"`，使得 `T` 为 `char const*`，且 `args` 为类型为 `std::string`\
  \ 的变参模板参数。\n\n在打印 `\"hello\"` 作为 `firstArg` 后，它再次调用 `print()` 处理剩余参数，随后展开为：\n\n\
  ```cpp\nprint<std::string> (s);\n```\n\n其中 `firstArg` 值为 `\"world\"`，使得 `T` 为 `std::string`，且\
  \ `args` 为一个空值的变参模板参数。\n\n因此，在打印 `\"world\"` 作为 `firstArg` 后，我们无带参数地调用 `print()`，这导致了\
  \ `print()` 的非模板重载（没有任何操作）。\n\n#### 4.1.2 重载变参与非变参模板\n注意，你也可以如下实现上述示例：\n\n`basics/varprint2.hpp`\n\
  \n```cpp\n#include <iostream>\n\ntemplate<typename T>\nvoid print (T arg) {\n  std::cout\
  \ << arg << '\\n'; // 打印传递的参数\n}\n\ntemplate<typename T, typename… Types>\nvoid\
  \ print (T firstArg, Types… args) {\n  print(firstArg); // 为第一个参数调用 print\n  print(args…);\
  \ // 为剩余参数调用 print\n}\n```\n\n也就是说，如果两个函数模板仅区别于结尾参数包，则不包含结尾参数包的函数模板会被优先选择。^(1) 第\
  \ 688 页第 C.3.1 节解释了适用于此处的更通用重载解析规则。\n\n#### 4.1.3 运算符 **sizeof…**\n\n\n\n\nC++11\
  \ 还为变长参数模板引入了一种新形式的 `sizeof` 运算符：`sizeof…`。它展开为参数包（parameter pack）包含的元素个数。因此，\n\n\
  点击此处查看代码图片\n\n```cpp\ntemplate<typename T, typename… Types>\nvoid print (T firstArg,\
  \ Types… args)\n{\n  std::cout << sizeof…(Types) << '\\n';  //打印剩余类型的数量\n  std::cout\
  \ << sizeof…(args) << '\\n';   //打印剩余参数的数量\n  …\n}\n```\n\n`twice` 打印了传递给 `print()`\
  \ 的第一个参数后剩余的参数个数。如你所见，你可以对模板参数包调用也可以对函数参数包调用 `sizeof…`。\n\n这可能会让我们认为，可以通过在没有更多参数时不再调用函数，来跳过递归末尾的函数：\n\
  \n点击此处查看代码图片\n\n```cpp\ntemplate<typename T, typename… Types>\nvoid print (T firstArg,\
  \ Types… args)\n{\n  std::cout << firstArg << '\\n';\n  if (sizeof…(args) > 0) {\
  \      //如果 sizeof…(args)==0 则报错\n    print(args…);             // 并且在没有无参数时不声明\
  \ print()\n  }\n}\n```\n\n然而，这种方法并行的，因为通常情况下，函数模板中所有 `if` 语句的两个分支都会被实例化。实例化代码是否有用是一个`运行时`（run-time）决策，而调用的实例化是一个`编译时`（compile-time）决策。由于这个原因，如果你为一个（最后一个）参数调用\
  \ `print()` 函数模板，带有 `print(args…)` 用的语句仍然会为无参数进行实例化，如果没有提供针对无参数的函数 `print()`，则这是一个错误。\n\
  \n然而，请注意，自 C++17 起，可以使用编译时 `if`，它以略不同的语法实现了此处预期的效果。这将在第 134 页的第 8.5 节讨论。\n\n###\
  \ 4.2 折叠表达式 (Fold Expressions)\n\n自 C++17 起，有一种特性可以使用二元运算符对参数包中的*所有*参数（带有可选的初始值）计算结果。\n\
  \n例如，以下函数返回所有传递的参数的和：\n\n点击此处查看代码图片\n\n```cpp\ntemplate<typename… T>\nauto foldSum\
  \ (T… s) {\n  return (… + s);   // ((s1 + s2) + s3) …\n}\n```\n\n如果参数包为空，该表达式通常是格式错误的（例外对于运算符\
  \ `&&` 其值为 `true`，对于运算符 `||` 其值为 `false`，而对于逗号运算符，空参数包的值为 `void()`）。\n\n表 4.1 列出了可能的折叠表达式。\n\
  \n| 折叠表达式 | 求值方式 |\n| --- | --- |\n| `( …` *op pack* `)` | `(((` *pack1 op pack2*\
  \ `)` *op pack3* `)` … *op packN* `)` |\n| `(` *pack op* `… )` | `(` *pack1 op*\
  \ `(` … `(` *packN-1 op packN* `)))` |\n| `(` *init op* `…` *op pack* `)` | `(((`\
  \ *init op pack1* `)` *op pack2* `)` … *op packN* `)` |\n| `(` *pack op* `…` *op\
  \ init* `)` | `(` *pack1 op* `(` … `(` *packN op init* `)))` |\n\n*表 4.1. 折叠表达式（自\
  \ C++17 起）*\n\n你可以将几乎所有的二元运算符用于折叠表达式（详情请参见第 208 页的第 12.4.6 节）。例如，你可以使用折叠表达式通过运算符\
  \ `->*` 遍历二叉树中的路径：\n\n点击此处查看代码图片\n\n`basics/foldtraverse.cpp`\n\n```cpp\n// 定义二叉树结构和遍历辅助：\n\
  struct Node {\n  int value;\n  Node* left;\n  Node* right;\n  Node(int i=0) : value(i),\
  \ left(nullptr), right(nullptr) {\n  }\n  …\n};\n\nauto left = &Node::left;\nauto\
  \ right = &Node::right;\n// 使用折叠表达式遍历树：\ntemplate<typename T, typename… TP>\nNode*\
  \ traverse (T np, TP… paths) {\n  return (np -> … -> paths); // np paths1 -> paths2\n\
  }\nint main()\n{\n  // 初始化二叉结构：\n  Node* root = new Node{0};\n  root->left = new\
  \ Node{1};\n  root->right = new Node{2};\n}\n```\n\n\n\n\n点击此处查看代码图片\n\n```cpp\n\
  //* args are copies with decayed types:*\ntemplate<typename… Args> void foo (Args…\
  \ args);\n```\n\n```cpp\n//* args are nondecayed references to passed objects:*\n\
  template<typename… Args> void bar (Args const&… args);\n```\n\n### 4.4 变参类模板与变参表达式\n\
  \n除了上面的示例外，参数包（parameter packs）还可以出现在其他地方，例如表达式、类模板、使用声明（using declarations）甚至推导指南（deduction\
  \ guides）。第 202 页第 12.4.2 节有一个完整的列表。\n\n#### 4.4.1 变参表达式\n\n你可以做的不仅仅是转发所有参数。你还可以对它们进行计算，这意味着对参数包中的所有参数进行计算。\n\
  \n例如，以下函数将参数包 `args` 中的每个参数翻倍，并将每个翻倍后的参数传递给 `print()`：\n\n点击此处查看代码图片\n\n```cpp\n\
  template<typename… T>\nvoid printDoubled (T const&… args)\n{\n  print (args + args…);\n\
  }\n```\n\n例如，如果你调用：\n\n点击此处查看代码图片\n\n`printDoubled(7.5, std::string(\"hello\"),\
  \ std::complex<float>(4,2));`\n\n该函数将产生以下效果（任何构造函数产生的侧影响除外）：\n\n点击此处查看代码图片\n\n```cpp\n\
  print(7.5 + 7.5,\n      std::string(\"hello\") + std::string(\"hello\"),\n     \
  \ std::complex<float>(4,2) + std::complex<float>(4,2);\n```\n\n如果你只是想给每个参数加 1，请注意省略号的点可能不能直接跟在数字字面量：\n\
  \n点击此处查看代码图片\n\n```cpp\ntemplate<typename… T>\nvoid addOne (T const&… args)\n{\n\
  \  print (args + 1…);     // : 1… 是带有过多小数点的字面量\n  print (args + 1 …);   // OK\n\
  \  print ((args + 1)…);  // OK\n}\n```\n\n编译时表达式也可以同样的方式包含模板参数包。例如，以下函数模板返回了所有参数的类型是否相同：\n\
  \n点击此处查看代码图片\n\n```cpp\ntemplate<typename T1, typename… TN>\nconstexpr bool isHomogeneous\
  \ (T1, TN...)\n{\n  return (std::is_same<T1,TN>::value && …); // 自 C++17 起\n}\n\
  ```\n\n这是折叠表达式（fold expressions）的应用（参见第 58 页第 4.2 节）：对于：\n\n点击此处查看代码图片\n\n`isHomogeneous(43,\
  \ -1, \"hello\")`\n\n返回值的表达式展开为\n\n点击此处查看代码图片\n\n`std::is_same<int,int>::value &&\
  \ std::is_same<int,char const*>::value`\n\n并产生 `false`，而：\n\n点击此处查看代码图片\n\n`isHomogeneous(\"\
  hello\", \"\", \"world\", \"!\")`\n\n产生 `true`，因为所有传递的参数都被推导为 `char const*`（注意参数类型发生了退化，因为调用参数是按值传递的）。\n\
  \n#### 4.4.2 变参索引\n\n作为另一个示例，以下函数使用变参索引列表来访问传递的第一个参数对应的元素：\n\n点击此处查看代码图片\n\n```cpp\n\
  template<typename C, typename… Idx>\nvoid printElems (C const& coll, Idx… idx)\n\
  {\n  print (coll[idx]…);\n}\n```\n\n也就是说，当调用：\n\n点击此处查看代码图片\n\n`std::vector<std::string>\
  \ coll = {\"good\", \"times\", \"say\", \"bye\"}; printElems(coll,2,0,3);`\n\n效果是调用了\n\
  \n点击此处查看代码图片\n\n`print (coll[2], coll[0], coll[3]);`\n\n你也可以将模板参数声明为参数包。例如：\n\n\
  点击此处查看代码图片\n\n```cpp\ntemplate<std::size_t… Idx, typename C>\nvoid printIdx (C const&\
  \ coll)\n{\n  print(coll[Idx]…);\n}\n```\n\n这允许你调用：\n\n点击此处查看代码图片\n\n`std::vector<std::string>\
  \ coll = {\"good\", \"times\", \"say\", \"bye\"}; printIdx<2,0,3>(coll);`\n\n其效果与之前的示例相同。\n\
  \n#### 4.4.3 变参类\n\n一个重要的示例是用任意数量的模板参数指定成员类型的类：\n\n点击此处查看代码图片\n\n```cpp\ntemplate<typename…\
  \ Elements>\nclass Tuple;\nTuple<int, std::string, char> t;\n```\n\n`t` 可以持有整数、字符串和字符。这将在第\
  \ 25 章讨论。\n\n另一个示例是能够指定可能对象的类型：\n\n点击此处查看代码图片\n\n```cpp\ntemplate<typename… Types>\n\
  class Variant;\nVariant<int, std::string, char> v;\n```\n\n`v` 可以持有整数、字符串或字符。这将在第\
  \ 26 章讨论。\n\n你还可以定义一个表示索引列表的类：\n\n点击此处查看代码图片\n\n```cpp\n// 用于任意数量索引的类型：\ntemplate<std::size_t…>\n\
  struct Indices {\n};\n```\n\n它可以定义一个函数，使用编译时访问 `get()` 为 `std::array` 或 `std::tuple`\
  \ 的元素调用 `print()`：\n\n点击此处查看代码图片\n\n```cpp\ntemplate<typename T, std::size_t… Idx>\n\
  void printByIdx(T t, Indices<Idx…>)\n{\n  print(std::get<Idx>(t));\n}\n```\n\n该模板可以这样使用：\n\
  \n点击此处查看代码图片\n\n`std::array<std::string, 5> arr = {\"Hello\", \"my\", \"new\", \"\
  !\", \"World\"}; printByIdx(arr, Indices<0, 4, 3>());`\n\n或者如下所示：\n\n点击此处查看代码图片\n\
  \n`auto t = std::make_tuple(12, \"monkeys\", 2.0); printByIdx(t, Indices<0, 1, 2>());`\n\
  \n这是迈元编程的第一步，将在第 123 页第 8.1 节以及第 23 章讨论。\n\n#### 4.4.4 变参推导指南\n\n甚至是推导指南（参见第 42\
  \ 页第 2.9 节）也可以变参的。例如，C++ 标准库为 `std::array` 定义了以下推导指南：\n\n点击此处查看代码图片\n\n```cpp\n\
  namespace std {\n  template<typename T, typename… U> array(T, U...)\n    -> array<enable_if_t<(is_same_v<T,\
  \ U> && …), T>,\n             (1 + sizeof…(U))>;\n}\n```\n\n类似 `std::array a{42,45,77};`\
  \ 初始化会将指南中的 `T` 推导为元素类型，并将各种 `U…` 类型推导为后续元素的类型。因此，元素的总数为 `1 + sizeof…(U)`：\n\n点击此处查看代码图片\n\
  \n`std::array<int, 3> a{42,45,77};`\n\n用于第一个 `array` 参数的 `std::enable_if<>`表达式是一个折叠表达式（它在第\
  \ 62 页第 4.4.1 节引入），展开为：\n\n点击此处查看代码图片\n\n`is_same_v<T, U1> && is_same_v<T, U2> &&\
  \ is_same_v<T, U3> …`\n\n如果结果不是 `true`（即并非所有元素类型都相同），则该推导指南将被丢弃，整个推导失败。通过这种方式，标准库确保了所有元素必须具有相同的类型，推导才能成功。\n\
  \n#### 4.4.5 变参基类与 using\n\n最后，考虑以下示例：\n\n\n\n\n\n点击此处查看代码图像\n\n`basics/varusing.cpp`\n\
  \n```cpp\n#include <string>\n\n#include <unordered_set>\n\nclass Customer\n{\n \
  \ private:\n    std::string name;\n  public:\n    Customer(std::string const& n)\
  \ : name(n) { }\n    std::string getName() const { return name; }\n};\n\nstruct\
  \ CustomerEq {\n    bool operator() (Customer const& c1, Customer const& c2) const\
  \ {\n      return c1.getName() == c2.getName();\n    }\n};\n\nstruct CustomerHash\
  \ {\n    std::size_t operator() (Customer const& c) const {\n      return std::hash<std::string>()(c.getName());\n\
  \    }\n};\n\n// 定义一个结合了变参数基类 operator() 的类：\ntemplate<typename… Bases>\nstruct\
  \ Overloader : Bases…\n{\n    using Bases::operator()…;  // C++17 起可用\n};\n\nint\
  \ main()\n{\n  // 在一个类型中结合哈希器和等性比较：\n  using CustomerOP = Overloader<CustomerHash,CustomerEq>;\n\
  \  std::unordered_set<Customer,CustomerHash,CustomerEq> coll1;\n  std::unordered_set<Customer,CustomerOP,CustomerOP>\
  \ coll2;\n  …\n}\n```\n\n在这里，我们首先定义了一个 `Customer` 类以及用于哈希和比较 `Customer` 对象的独立函数对象。通过\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<typename… Bases>\nstruct Overloader : Bases…\n\
  {\n    using Bases::operator()…;  // C++17 起可用\n};\n```\n\n我们可以定义一个派生自变数量基类的类，该类引入了每个基类中的\
  \ `operator()` 声明。通过\n\n点击此处查看代码图像\n\n```cpp\nusing CustomerOP = Overloader<CustomerHash,CustomerEq>;\n\
  ```\n\n我们利用这一特性从 `CustomerHash` 和 `CustomerEq` 派生出 `CustomerOP`，并在派生类中启用两种 `operator()`\
  \ 的实现。\n\n参见第 611 页第 26.4 节关于该技术的另一种应用。\n\n### 4.5 总结\n\n- 通过使用参数包（parameter packs），可以为任意数量、任意类型的模板参数定义模板。\n\
  - 为了处理参数，你需要递归和/或匹配的非变参数函数。\n- 运算符 `sizeof…` 返回参数包提供的参数个数。\n- 变参数模板的一个典型应用是转发任意数量、任意类型的参数。\n\
  - 通过使用折叠表达式（fold expressions），你可以对参数包中的所有参数应用运算符。\n\n^(1) 最初，在 C++11 和 C++14 中这存在一个歧义，但后来得到了修复（参阅\
  \ [*CoreIssue1395*]），但所有编译器在所有版本中都按这种方式处理。\n\n## 第 5 章\n\n## 复杂的的基础\n\n本章涵盖了模板的某些与实际使用相关的进阶基础方面：`typename`\
  \ 关键字的额外用法、将成员函数和嵌套类定义为模板、模板模板参数、零初始化，以及关于使用字符串字面量作为函数模板参数的一些细节。这些方面有时会棘手，但每个每天工作的程序员都应该听过它们。\n\
  \n### 5.1 关键字 `typename`\n\n`typename` 关键字是在 C++ 标准化引入的，用于明确模板内部的标识符是一个类型。考虑以下示例：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<typename T>\nclass MyClass {\n  public:\n    …\n\
  \    void foo() {\n      typename T::SubType* ptr;\n    }\n};\n```\n\n在这里，第二个 `typename`\
  \ 用于明确 `SubType` 是在类 `T` 内部定义的类型。因此，`ptr` 是指向类型 `T::SubType` 的指针。\n\n如果没有 `typename`，`SubType`\
  \ 将被假设为非类型成员（例如，静态数据成员或枚举常量）。结果是，表达式 `T::SubType* ptr` 将变为类 `T` 的静态 `SubType` 成员与\
  \ `ptr` 的乘法，这并不是错误，因为对于 `MyClass<>` 的某些实例化，这可能是有效代码。\n\n通常，每当依赖模板参数的名称是一个类型时，必须使用\
  \ `typename`。这在第 228 页第 13.3.2 节中详细讨论。\n\n`typename` 的一个应用是在泛型代码中声明标准容器的迭代器：\n\n\
  点击此处查看代码图像\n\n`basics/printcoll.hpp`\n\n```cpp\n#include <iostream>\n// 打印 STL 容器元素\n\
  template<typename T>\nvoid printcoll (T const& coll)\n{\n  typename T::const_iterator\
  \ pos; // 用于迭代的迭代器\n  typename T::const_iterator end(coll.end()); // 结束\n  for (pos=coll.begin();\
  \ pos!=end; ++pos) {\n    std::cout << *pos;\n  }\n  std::cout << '\\n';\n}\n```\n\
  \n在这个函数模板中，调用参数是类型为 `T` 的标准容器。为了遍历容器的所有元素，使用了容器的迭代器类型，该迭代器在每个标准容器内部被声明为 `const_iterator`：\n\
  \n点击此处查看代码图像\n\n```cpp\nclass stlcontainer {\n  public:\n    using iterator = …;\
  \ // 用于读写访问的迭代器\n    using const_iterator = …; // 用于读访问的迭代器\n…\n};\n```\n\n因此，为了访问模板类型\
  \ `T` 的类型 `const_iterator`，你必须在前面加上 `typename` 限定符：\n\n点击此处查看代码图像\n\n```cpp\ntypename\
  \ T::const_iterator pos;\n```\n\n参阅第 228 页第 13.3.2 节获取关于 `typename` 的更多信息。注意 C++20\
  \ 可能会在许多常见情况下消除对 `typename` 的需求（参见 17.1 第 354 页）。\n\n### 5.2 零初始化\n\n对于 `int`、`double`\
  \ 或指针类型等基本类型，没有将其初始化为有用值的默认构造函数。相反，任何未初始化的变量都是未定义的：\n\n点击此处查看代码图像\n\n```cpp\nvoid\
  \ foo()\n{\n  int x; // x 是未定义的\n  int* ptr; // ptr 指向任意（而不是空）\n}\n```\n\n现在如果你编写模板并希望让模板类型由默认值初始化，你会遇到简单定义对基本类型无法这样做的问题：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<typename T>\nvoid foo()\n{\n  T x; // 如果 T 是基本类型，x\
  \ 是未定义的\n}\n```\n\n由于这个原因，可以显式地调用基本类型的默认构造函数将其初始化为零（对于 `bool` 为 `false`，对于指针为 `nullptr`）。因此，你可以通过编写以下代码确保基本类型得到正确初始化：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<typename T>\nvoid foo()\n{\n  T x{}; // 如果 T 是基本类型，x\
  \ 为零\n}\n```\n\n这种初始化方式被称为值初始化（value initialization），意味着调用提供的构造函数或对对象零初始化。即使构造函数是\
  \ `explicit` 的，这种方法也有效。\n\n在 C++11 之前，确保正确初始化的语法是\n\n点击此处查看代码图像\n\n```cpp\nT x =\
  \ T(); // 如果 T 是基本类型，x 为零\n```\n\n在 C++17 之前，这种机制（仍然支持）仅当为拷贝初始化选择的构造函数不是 `explicit`\
  \ 时才有效。在 C++17 中，强制拷贝消除避免了这一局限，任何一种语法都可以工作，但大括号初始化符号在没有默认构造函数的情况下可以使用初始化列表构造函数^(1)。\n\
  \n\n\n\n为了确保类模板中类型参数化的成员得到初始化，你可以定义一个使用花括号初始化（braced initializer）来初始化该成员的默认构造函数：\n\
  \n点击此处查看代码图片\n\n```cpp\ntemplate<typename T>\nclass MyClass {\n  private:\n    T\
  \ x;\n  public:\n    MyClass() : x{} { // 即使对于内置类型，x 也会被初始化\n    }\n    …\n};\n\
  ```\n\n#### C++11 之前的语法\n\n点击此处查看代码图片\n\n```cpp\nMyClass() : x() { // 即使对于内置类型，x\
  \ 也会被初始化\n}\n```\n同样有效。\n\n从 C++11 开始，你还可以为非静态成员提供默认初始化，因此以下操作也是可行的：\n\n点击此处查看代码图片\n\
  \n```cpp\ntemplate<typename T>\nclass MyClass {\n  private:\n    T x{}; // 除非另有指定，否则零初始化\
  \ x\n    …\n};\n```\n\n然而，注意默认参数不能使用该语法。例如，\n\n点击此处查看代码图片\n\n```cpp\ntemplate<typename\
  \ T>\nvoid foo(T p{}) { // 错误\n    …\n}\n```\n\n相反，我们必须写成：\n\n点击此处查看代码图片\n\n```cpp\n\
  template<typename T>\nvoid foo(T p = T{}) { // OK（C++11 之前必须使用 T()）\n    …\n}\n\
  ```\n\n### 5.3 使用 `this->`\n\n对于带有依赖模板参数的基类的类模板，直接使用名称 `x` 并不总是等同于 `this->x`，即使继承了成员\
  \ `x`。例如：\n\n点击此处查看代码图片\n\n```cpp\ntemplate<typename T>\nclass Base {\n  public:\n\
  \    void bar();\n};\n\ntemplate<typename T>\nclass Derived : Base<T> {\n  public:\n\
  \    void foo() {\n        bar(); // 调用外部 bar() 或报错\n    }\n};\n```\n\n在这个示例中，为了在\
  \ `foo()` 内部解析符号 `bar`，永远不会考虑在 `Base` 中定义的 `bar()`。因此，要么得到错误，要么调用了另一个 `bar()`（例如全局\
  \ `bar()`）。\n\n我们在第 237 页的第 13.4.2 节中讨论了这个问题。目前，作为经验法则，我们建议对任何以某种方式依赖于模板参数的基类中声明的符号，始终使用\
  \ `this->` 或 `Base<T>::` 进行限定限定。\n\n### 5.4 针对原始数组和字符串字面量的模板\n\n在向模板传递原始数组或字符串字面量时，需要格外小心。首先，如果模板参数声明为引用，则参数将不会退化（decay）。也就是说，传递参数\
  \ `\"hello\"` 类型为 `char const[6]`。如果传递了长度不同的原始数组或字符串参数，这可能会成为问题，因为类型不同。只有当按值传递参数时，类型才会退化，使得字符串字面量转换为\
  \ `char const*` 类型。这在第 7 章 中进行了详细讨论。\n\n注意，你也可以提供专门处理原始数组或字符串字面量的模板。例如：\n\n点击此处查看代码图片\n\
  \n`basics/lessarray.hpp`\n\n```cpp\ntemplate<typename T,\nint N,\nint M> bool less\
  \ (T(&a)[N], T(&b)[M])\n{\n    for (int i = 0; i<N && i<M; ++i)\n{\n    if (a[i]<b[i])\
  \ return true; if (b[i]<a[i]) return false; return N < M;\n}\n```\n在这里，当调用\n\n点击此处查看代码图片\n\
  \n```cpp\nint x[] = {1, 2, 3};\nint y[] = {1, 2, 3, 4, 5};\nstd::cout << less(x,y);\n\
  ```\n`less<>()` 实例化时 `T` 为 `int`，`N` 为 `3`，`M` 为 `5`。你也可以将此模板用于字符串字面量：\n\n点击此处查看代码图片\n\
  \n```cpp\nstd::cout << less(\"abc\");\n```\n`less<>()` 实例化时 `T` 为 `char const`，`N`\
  \ 为 `3`，`M` 为 `4`。如果你只想为字符串字面量（以及 `char` 数组）提供函数模板，可以如下如下操作：\n\n点击此处查看代码图片\n\n```cpp\n\
  basics/less.hpp\ntemplate<int N, int M>\nbool less (char const(&a)[N], char const(&b)[M])\n\
  {\n    for (int i = 0; i<N && i<M; ++i) {\n    if (a[i]<b[i]) return true;\n   \
  \ if (b[i]<a[i]) return false;\n    }\n    return N < M;\n}\n```\n注意，你可以且有时必须对未知边界的数组进行重载或部分特化。以下程序说明了数组所有可能的重载：\n\
  \n点击此处查看代码图片\n\n```cpp\nbasics/arrays.hpp\n#include <iostream>\n\ntemplate<typename\
  \ T>\nstruct MyClass; // 主模板\ntemplate<typename T, std::size_t SZ>\nstruct MyClass<T[SZ]>\
  \ // 针对已知边界数组的特化\n{\n    static void print() { std::cout << \"print() for T[\" <<\
  \ SZ << \"]\\n\"; }\n};\ntemplate<typename T, std::size_t SZ>\nstruct MyClass<T(&)[SZ]>\
  \ // 针对已知边界数组引用的特化\n{\n    static void print() { std::cout << \"print() for T(&)[\"\
  \ << SZ << \"]\\n\"; }\n};\ntemplate<typename T>\nstruct MyClass<T[]> // 针对未知边界数组的特化\n\
  {\n    static void print() { std::cout << \"print() for T[]\\n\"; }\n};\ntemplate<typename\
  \ T>\nstruct MyClass<T*> // 针对指针的特化\n{\n    static void print() { std::cout << \"\
  print() for T*\\n\"; }\n};\n```\n在这里，类模板 `MyClass` 为各种类型进行了实例化：已知和未知边界的数组、已知和未知边界的数组引用以及指针。每种情况在使用数组时都是不同且可能发生的：\n\
  \n点击此处查看代码图片\n\n```cpp\nbasics/arrays.cpp\n#include \"arrays.hpp\"\n\ntemplate<typename\
  \ T1, typename T2, typename T3>\nvoid foo(int a1[7], int a2[], // 根据语言规则指针\n   \
  \ int (&a3)[42], // 已知边界数组引用\n    int (&x0)[], // 未知边界数组引用\n    T1 x1, // 按值传递退化\n\
  \    T2& x2, T3&& x3) // 按引用传递\n{\n    MyClass<decltype(a1)>::print();\n    MyClass<decltype(a2)>::print();\n\
  \    MyClass<decltype(a3)>::print();\n    MyClass<decltype(x0)>::print();\n    MyClass<decltype(x1)>::print();\n\
  \    MyClass<decltype(x2)>::print();\n    MyClass<decltype(x3)>::print();\n}\n\n\
  int main()\n{\n    int a[42];\n    MyClass<decltype(a)>::print();\n    extern int\
  \ x[]; // 前向声明数组\n    MyClass<decltype(x)>::print();\n    foo(a, a, a, x, x, x,\
  \ x);\n}\n\nint x[] = {0, 8, 15}; // 定义前向声明的数组\n```\n\n\n\n\n类成员也可以是模板。这对于嵌套类和成员函数来说都是可能的。这种能力的应用和优势再次可以通过\
  \ `Stack<>` 类模板来演示。通常，只有当两个栈具有相同类型时你才能相互赋值，这意味着它们的元素具有相同的类型。然而，你不能将具有任何其他元素的栈进行赋值，即使为定义的元素类型存在隐式类型转换：\n\
  \n点击此处查看代码图片\n\n```cpp\nStack<int> intStack1, intStack2;  // 用于 int 的栈\nStack<float>\
  \ floatStack;         // 用于 float 的栈\n…\nintStack1 = intStack2;              //\
  \ OK: 栈类型相同\nfloatStack = intStack1;             // ERROR: 栈类型不同\n```\n\n默认的赋值运算符要求赋值运算符的两端具有相同类型，如果栈具有不同的元素类型，则不符合这一点。\n\
  \n然而，通过将赋值运算符定义为模板，你可以允许对定义了适当类型转换元素的栈进行赋值。要做到这一点，你需要如下声明 `Stack<>`：\n\n点击此处查看代码图片\n\
  \n`basics/stack5decl.hpp`\n\n```cpp\ntemplate<typename T>\nclass Stack {\n  private:\n\
  \    std::deque<T> elems;       // 元素\n  public:\n    void push(T const&);     \
  \   // 推入元素\n    void pop();                 // 弹出元素\n    T const& top() const;\
  \      // 返回顶部元素\n    bool empty() const {        // 返回栈是否为空\n        return elems.empty();\n\
  \    }\n    // 赋值类型为 T2 的元素的栈\n    template<typename T2>\n    Stack& operator= (Stack<T2>\
  \ const&);\n};\n```\n\n进行了以下两处更改：\n\n1. 我们为具有另一种类型 `T2` 元素的栈添加了赋值运算符声明。\n2. 栈现在使用\
  \ `std::deque<>` 作为元素的内部容器。同样，这是新赋值运算符实现的结果。\n\n新赋值运算符的实现如下：^(3)\n\n点击此处查看代码图片\n\
  \n`basics/stack5assign.hpp`\n\n```cpp\ntemplate<typename T>\ntemplate<typename T2>\n\
  Stack<T>& Stack<T>::operator= (Stack<T2> const& op2)\n{\n    Stack<T2> tmp(op2);\
  \           // 创建赋值栈的副本\n    elems.clear();               // 移除现有元素\n    while (!tmp.empty())\
  \ {      // 拷贝所有元素\n        elems.push_front(tmp.top());\n        tmp.pop();\n \
  \   }\n    return *this;\n}\n```\n\n首先让我们看看定义成员模板的语法。在带有模板参数 `T` 的模板内部定义了一个带有模板参数\
  \ `T2` 的内部模板：\n\n点击此处查看代码图片\n\n```cpp\ntemplate<typename T>\n  template<typename\
  \ T2>\n…\n```\n\n在成员函数内部，你可能认为只需要访问赋值栈 `op2` 的所有数据。然而，此栈具有不同的类型（如果你为两个不同的参数类型实例化类模板，你将得到两个类类型），因此你受限于公共接口。因此，访问元素的唯一方法是调用\
  \ `top()`。但是，每个元素都必须变成顶部元素。因此，必须先制作 `op2` 的副本，然后通过调用 `pop()` 从该副本中获取元素。由于 `top()`\
  \ 返回最后推入栈的元素，我们可能更倾向于使用支持在容器另一端插入元素的容器。出于这个原因，我们使用 `std::deque<>`，它提供了 `push_front()`\
  \ 来将元素放在集合的另一侧。\n\n要访问 `op2` 的所有成员，你可以声明所有其他实例为友元：\n\n点击此处查看代码图片\n\n`basics/stack6decl.hpp`\n\
  \n```cpp\ntemplate<typename T>\nclass Stack {\n  private:\n    std::deque<T> elems;\
  \       // 元素\n  public:\n    void push(T const&);        // 推入元素\n    void pop();\
  \                 // 弹出元素\n    T const& top() const;      // 返回顶部元素\n    bool empty()\
  \ const {        // 返回栈是否为空\n        return elems.empty();\n    }\n    // 赋值类型为\
  \ T2 的元素的栈\n    template<typename T2>\n    Stack& operator= (Stack<T2> const&);\
  \ // 为任何类型 T2 获取 Stack<T2> 的私有成员\n    template<typename> friend Stack;\n};\n```\n\
  \n如你所见，因为模板参数的名字没有被使用，你可以省略它：\n\n点击此处查看代码图片\n\n```cpp\ntemplate<typename> friend\
  \ Stack;\n```\n\n现在，以下模板实现是可能的：\n\n点击此处查看代码图片\n\n`basics/stack6assign.hpp`\n\n```cpp\n\
  template<typename T>\ntemplate<typename T2>\nStack<T>& Stack<T>::operator= (Stack<T2>\
  \ const& op2)\n{\n    elems.clear();               // 移除现有元素\n    elems.insert(elems.begin(),\
  \  // 在开头插入\n                 op2.elems.begin(), // 来自 op2 的元素\n               \
  \  op2.elems.end());\n    return *this;\n}\n```\n\n有了这个成员模板，你现在可以将 `int` 元素的栈赋值给\
  \ `float` 元素的栈：\n\n点击此处查看代码图片\n\n```cpp\nStack<int> intStack;      // 用于 int 的栈\n\
  Stack<float> floatStack;  // 用于 float 的栈\n…\nfloatStack = intStack;    // OK: int\
  \ 转换为 float\n```\n\n当然，这种赋值不会改变栈及其元素的类型。赋值后，`floatStack` 的元素仍然是 `float`，因此 `top()`\
  \ 仍然返回 `float`。\n\n这似乎该函数会禁用类型检查，使得你可以分配任何类型元素的栈，但事实并非如此。必要的类型检查发生在将（副本的）元素移动到目标栈时：\n\
  \n```cpp\nelems.push_front(tmp.top());\n```\n\n例如，如果将字符串元素的栈赋值给 `float` 栈，该行的编译将导致错误，说明\
  \ `top()` 返回的字符串无法作为 `elems.push_front()` 的参数（信息取决于编译器，但大致如下）：\n\n```cpp\nStack<std::string>\
  \ stringStack; // 字符串栈\nStack<float> floatStack;        // float 栈\nfloatStack =\
  \ stringStack;        // ERROR: std::string 无法转换为 float\n```\n\n再次，你可以更改实现以参数化内部容器：\n\
  \n点击此处查看代码图片\n\n`basics/stack7decl.hpp`\n\n```cpp\ntemplate<typename T, typename\
  \ Cont = std::deque<T>>\nclass Stack {\n  private:\n    Cont elems;            \
  \     // 元素\n  public:\n    void push(T const&);        // 推入元素\n    void pop();\
  \                 // 弹出元素\n    T const& top() const;      // 返回顶部元素\n    bool empty()\
  \ const {        // 返回栈是否为空\n        return elems.empty();\n    }\n    // 赋值类型为\
  \ T2 的元素的栈\n    template<typename T2, typename Cont2>\n    Stack& operator= (Stack<T2,Cont2>\
  \ const&); // 为任何类型 T2 获取 Stack<T2,Cont2> 的私有成员\n    template<typename, typename>\
  \ friend class Stack;\n};\n```\n\n那么模板赋值运算符的实现如下：\n\n点击此处查看代码图片\n\n\n\n\n\n### `basics/stack7assign.hpp`\n\
  \n```cpp\ntemplate<typename T, typename Cont>\ntemplate<typename T2, typename Cont2>\n\
  Stack<T,Cont>& Stack<T,Cont>::operator= (Stack<T2,Cont2> const& op2)\n{\n    elems.clear();\
  \ // 移除现有元素\n    elems.insert(elems.begin(), // 在开头插入\n                  op2.elems.begin(),\
  \ // 来自 op2 的所有元素\n                  op2.elems.end());\n    return *this;\n}\n```\n\
  \n请记住，对于类模板，只有被调用的成员函数会被实例化。因此，如果你避免将带有不同类型元素的栈进行赋值，你甚至可以使用 `vector` 作为内部容器：\n\n\
  点击此处查看代码图像\n\n```cpp\n// 使用 vector 作为内部容器的整数栈\nStack<int,std::vector<int>> vStack;\n\
  …\n\nvStack.push(42); vStack.push(7);\nstd::cout << vStack.top() << '\\n';\n```\n\
  \n由于赋值运算符模板并不是必须的，因此不会发生缺少成员函数 `push_front()` 的错误信息，程序运行正常。\n\n关于上一个示例的完整实现，请参见\
  \ `basics` 子目录下所有以 `stack7` 开头的文件。\n\n#### 成员函数模板的特化\n\n成员函数模板也可以进行部分特化或完全特化。例如，对于以下类：\n\
  \n点击此处查看代码图像\n\n`basics/boolstring.hpp`\n\n```cpp\nclass BoolString {\n  private:\n\
  \    std::string value;\n  public:\n    BoolString (std::string const& s)\n    \
  \  : value(s) {\n    }\n    template<typename T = std::string>\n    T get() const\
  \ { // 获取值（转换为 T）\n      return value;\n    }\n};\n```\n\n你可以如下方式为成员函数模板提供一个完全特化：\n\
  \n点击此处查看代码图像\n\n`basics/boolstringgetbool.hpp`\n\n```cpp\n// 针对 bool 的 BoolString::get<>()\
  \ 完全特化\ntemplate<>\ninline bool BoolString::get<bool>() const {\n  return value\
  \ == \"true\" || value == \"1\" || value == \"on\";\n}\n```\n\n注意，你不需要也无法声明这些特化；你只需要定义它们。由于这是完全特化且位于头文件中，你必须使用\
  \ `inline` 声明它，以避免当定义被不同的翻译单元包含时出现错误。\n\n你可以如下所示使用该类和完全特化：\n\n点击此处查看代码图像\n\n```cpp\n\
  std::cout << std::boolalpha;\nBoolString s1(\"hello\");\nstd::cout << s1.get() <<\
  \ '\\n'; // 打印 hello\nstd::cout << s1.get<bool>() << '\\n'; // 打印 false\nBoolString\
  \ s2(\"on\");\nstd::cout << s2.get<bool>() << '\\n'; // 打印 true\n```\n\n#### 特殊成员函数模板\n\
  \n模板成员函数可以在任何特殊成员函数允许拷贝或移动对象的地方使用。与上面定义的赋值运算符类似，它们也可以是构造函数。但请注意，模板构造函数或模板赋值运算符不会替换预定义的构造函数或赋值运算符。成员模板不被视为拷贝或移动对象的特殊成员函数。在这个示例中，对于相同类型栈的赋值，默认赋值运算符仍然会被调用。\n\
  \n这种影响可能有有利也有坏处：\n\n- 可能会出现模板构造函数或赋值运算符比预定义的拷贝/移动构造函数或赋值运算符更匹配的情况，尽管模板版本仅用于初始化其他类型。详情请参阅第\
  \ 95 页的第 6.2 节。\n- 要“模板化”一个拷贝/移动构造函数并不容易，例如为了限制其存在。详情请参阅第 102 页的第 6.4 节。\n\n#####\
  \ 5.5.1 .template 构造\n\n有时，在调用成员模板时，需要显式限定模板参数。在这种情况下，你必须使用 `template` 关键字来确保 `<`\
  \ 是模板参数列表的开头。考虑以下使用标准 `bitset` 类型的示例：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<unsigned\
  \ long N>\nvoid printBitset (std::bitset<N> const& bs) {\n  std::cout << bs.template\
  \ to_string<char, std::char_traits<char>>;\n}\n```\n\n对于 `bitset`，我们在调用成员函数 `to_string()`\
  \ 的同时显式指定了类型。如果没有 `.template`，编译器就不知道随后的 `<` 不是小于号，而是模板参数列表的开头。这取决于一个参数。只有当依赖于参数时才使用\
  \ `.template` 符号。参见第 13.3 节。\n\n##### 5.5.2 泛型 Lambda 与成员模板\n\n注意 C++14 引入的泛型 Lambda\
  \ 是成员模板的快捷方式。计算两个参数和的简单 Lambda：\n\n```cpp\n[] (auto x, auto y) {\n  return x + y;\n\
  }\n```\n\n可以通过以下方式调用：\n\n点击此处查看代码图像\n\n```cpp\nclass SomeName {\n  public:\n   \
  \ template<typename T1, typename T2>\n    auto operator() (T1 x, T2 y) const {\n\
  \      return x + y;\n    }\n};\n```\n\n参见第 15.10 节。\n\n### 5.6 变量模板\n\n从 C++14\
  \ 开始，变量也可以参数化。这种情况被称为变量模板。例如，以下代码在定义值的同时定义了类型：\n\n```cpp\ntemplate<typename T>\n\
  constexpr T pi{3.14159265358979325};\n```\n\n注意，与模板一样，这种声明不能发生在函数或块作用域内。使用变量模板时，必须指定其类型。例如，以下代码使用了声明了\
  \ `pi<>`：\n\n点击此处查看代码图像\n\n```cpp\nstd::cout << pi<double> << '\\n';\nstd::cout\
  \ << pi<float> << '\\n';\n```\n\n你还可以定义在不同翻译单元使用的变量模板：\n\n点击此处查看代码图像\n\n```cpp\n\
  // header.hpp\ntemplate<typename T> T val{}; // 值\n```\n\n```cpp\n// 翻译单元 1\n#include\
  \ \"header.hpp\"\nint main() {\n  val<long> = 42;\n  print();\n}\n```\n\n```cpp\n\
  // 翻译单元 2\n#include \"header.hpp\"\nvoid print() {\n  std::cout << val<long> <<\
  \ '\\n'; // OK：打印 42\n}\n```\n\n变量模板也可以有默认模板参数：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename\
  \ T = long double>\nconstexpr T pi = T{3.14159265358979325};\n```\n\n你可以使用默认或任何其他类型：\n\
  \n点击此处查看代码图像\n\n```cpp\nstd::cout << pi<> << '\\n'; // 输出 long double\nstd::cout\
  \ << pi<float> << '\\n'; // 输出 float\n```\n\n但是，注意你总是必须指定角括号。直接使用 `pi` 是错误的。\n\n\
  \n\n\n\n点击此处查看代码图像\n\n```cpp\nstd::cout << pi << ’\\n’; //*ERROR*\n```\n\n变量模板也可以通过非类型参数（nontype\
  \ parameters）进行参数化，这些参数也可以用于参数化初始化。例如：\n\n点击此处查看代码图像\n\n```cpp\n#include <iostream>\n\
  #include <array>\n\ntemplate<int N>\n  std::array<int,N> arr{}; // 具有 N 个元素的数组，零初始化\n\
  \ntemplate<auto N>\n  constexpr decltype(N) dval = N; // dval 的类型取决于传入的值\n\nint\
  \ main()\n{\n  std::cout << dval<’c’> << ’\\n’; // N 的值为 char 类型的 ’c’\n  arr<10>[0]\
  \ = 42; // 设置全局变量 arr 的第一个元素\n  for (std::size_t i=0; i<arr<10>.size(); ++i) { //\
  \ 使用 arr 中设置的值\n    std::cout << arr<10>[i] << ’\\n’;\n  }\n}\n```\n\n再次注意，即使 `arr`\
  \ 的初始化和迭代发生在不同的编译单元（translation units）中，全局作用域内的相同变量 `std::array<int,10> arr` 仍然在使用。\n\
  \n### 用于数据成员的变量模板\n\n变量模板的一个有用应用是定义表示类模板成员的变量。例如，如果一个类模板定义如下：\n\n点击此处查看代码图像\n\n\
  ```cpp\ntemplate<typename T>\nclass MyClass {\n  public:\n    static constexpr int\
  \ max = 1000;\n};\n```\n\n这允许你为 `MyClass<>` 的不同特化定义不同的值，那么你可以定义：\n\n点击此处查看代码图像\n\
  \n```cpp\ntemplate<typename T>\nint myMax = MyClass<T>::max;\n```\n\n这样应用程序程序员就可以编写：\n\
  \n点击此处查看代码图像\n\n```cpp\nauto i = myMax<std::string>;\n```\n\n而不是：\n\n点击此处查看代码图像\n\
  \n```cpp\nauto i = MyClass<std::string>::max;\n```\n\n这意味着，对于一个标准类，例如：\n\n点击此处查看代码图像\n\
  \n```cpp\nnamespace std {\n  template<typename T> class numeric_limits {\n    public:\n\
  \      …\n      static constexpr bool is_signed = false;\n      …\n  };\n}\n```\n\
  \n你可以定义：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename T>\nconstexpr bool isSigned\
  \ = std::numeric_limits<T>::is_signed;\n```\n\n以便能够编写：\n\n`isSigned<char>`\n\n而不是：\n\
  \n点击此处查看代码图像\n\n```cpp\nstd::numeric_limits<char>::is_signed\n```\n\n### 类型特性的后缀\
  \ `_v`\n\n从 C++17 开始，标准库使用变量模板技术来为标准库中所有产生（布尔）值的类型特性（type traits）定义快捷方式。例如，为了能够写出：\n\
  \n点击此处查看代码图像\n\n```cpp\nstd::is_const_v<T> // 自 C++17 起\n```\n\n而不是：\n\n点击此处查看代码图像\n\
  \n```cpp\nstd::is_const<T>::value // 自 C++11 起\n```\n\n标准库定义了：\n\n点击此处查看代码图像\n\n\
  ```cpp\nnamespace std {\n  template<typename T> constexpr bool is_const_v = is_const<T>::value;\n\
  }\n```\n\n### 5.7 模板模板参数（Template Template Parameters）\n\n允许模板参数本身是一个类模板可能是很有用的。再次，以我们的\
  \ `stack` 类模板作为示例。为了给栈使用不同的容器，应用程序程序员必须指定两次元素。因此，为了指定内部容器的类型，你必须再次传递容器类型及其元素的类型：\n\
  \n点击此处查看代码图像\n\n```cpp\nStack<int, std::vector<int>> vStack; // 整数栈使用 vector\n```\n\
  \n使用模板模板参数允许你通过指定容器的类型来声明 `Stack` 类，而无需重复元素的类型：\n\n点击此处查看代码图像\n\n```cpp\nStack<int,\
  \ std::vector>; // 整数栈使用 vector\n```\n\n要这样做，你必须将第二个模板参数指定为模板参数。通常情况下，它看起来如下：\n\n\
  点击此处查看代码图像\n\n```cpp\n// basics/stack.hpp\ntemplate<typename T,\n  template<typename>\
  \ class Cont = std::deque>\nclass Stack {\n  private:\n    Cont<T> elems; // 元素\n\
  \  public:\n    void push (T const&); // 推入\n    void pop(); // 弹出\n    T const&\
  \ top() const; // 栈\n    bool empty() const { // 是否为空\n      return elems.empty();\n\
  \    }\n};\n```\n\n使用模板模板参数允许你通过指定容器的类型来声明 `Stack` 类，而不需要元素的类型：\n\n点击此处查看代码图像\n\n\
  ```cpp\ntemplate<typename> class Cont\n```\n\n要这样做，你必须将第二个模板参数指定为模板参数。通常情况下，它看起来如下：\n\
  \n```cpp\ntemplate<typename T,\n  template<typename> class Cont = std::deque>\n\
  class Stack {\n  private:\n    Cont<T> elems; // 元素\n  public:\n    void push (T\
  \ const&); // 推入\n    void pop(); // 弹出\n    T const& top() const; // 栈\n    bool\
  \ empty() const { // 是否为空\n      return elems.empty();\n    }\n};\n```\n\n这种用法是第二个模板参数是类模板。通常，你可以使用\
  \ `class` 代替 `typename` 来声明模板参数。\n\n成员函数必须相应地进行修改。因此，你必须将第二个模板参数指定为模板模板参数。这同样适用于成员函数的实现。例如，`push()`\
  \ 成员函数的实现如下：\n\n```cpp\ntemplate<typename T, template<typename> class Cont>\nvoid\
  \ Stack<T,Cont>::push (T const& elem)\n{\n  elems.push_back(elem); // 添加传入的 elem\
  \ 的拷贝\n}\n```\n\n注意，虽然模板模板参数是类或别名模板的占位符，但没有对应函数或变量模板的占位符。\n\n#### 模板模板参数匹配\n\n\n\
  \n\n如果你尝试使用新版本的 `Stack`，你可能会收到一条错误信息，说明默认值 `std::deque` 与模板模板参数 `Cont` 不兼容。问题在于，在\
  \ C++17 之前，模板模板参数必须是一个模板，且其参数必须与它所替换的模板模板参数的参数*完全*匹配，但某些与变长模板参数相关的例外除外（请参阅第 197\
  \ 页的第 12.3.4 节）。在 C++17 之前，模板模板参数的默认模板参数是不被考虑在内的，因此无法通过省略具有默认值的参数来完成匹配（在 C++17 中，默认参数*确实会*被考虑在内）。\n\
  \n此示例中在 C++17 之前的问题是，标准库中的 `std::deque` 模板有多个参数：第二个参数（描述*分配器*）有一个默认值，但在 C++17 之前，在将\
  \ `std::deque` 匹配到 `Cont` 参数时，该参数并未被考虑。\n\n然而，有一个通变方法。我们可以重写类声明，使 `Cont` 参数期望具有两个模板参数的容器：\n\
  \n点击此处查看代码图片\n\n```cpp\ntemplate<typename T,\n         template<typename Elem,\n\
  \                 typename Alloc = std::allocator<Elem>>\n         class Cont =\
  \ std::deque>\nclass Stack {\n  private:\n    Cont<T> elems;           // elements\n\
  \    …\n};\n```\n\n同样，我们可以省略 `Alloc`因为它没有被使用。\n\n我们 `Stack` 模板的最终版本（包括用于不同元素类型栈赋值的成员模板）现在看起来如下：\n\
  \n点击此处查看代码图片\n\n`basics/stack9.hpp`\n```cpp\n#include <deque>\n#include <cassert>\n\
  #include <memory>\n\ntemplate<typename T,\n         template<typename Elem,\n  \
  \               typename = std::allocator<Elem>>\n         class Cont = std::deque>\n\
  class Stack {\n  private:\n    Cont<T> elems;           // elements\n  public:\n\
  \    void push(T const&);      // push element\n    void pop();               //\
  \ pop element\n    T const& top() const;    // return top element\n    bool empty()\
  \ const {      // return whether the stack is empty\n        return elems.empty();\n\
  \    }\n    // 为类型为 T2 的元素的栈\n    template<typename T2,\n             template<typename\
  \ Elem2,\n                     typename = std::allocator<Elem2>\n              \
  \       >class Cont2>\n    Stack<T,Cont>& operator= (Stack<T2,Cont2> const&);\n\
  \    // 以访问任何元素类型为 T2 的 Stack 的私有成员：\n    template<typename, template<typename,\
  \ typename>class>\n    friend class Stack;\n};\n\ntemplate<typename T, template<typename,typename>\
  \ class Cont>\nvoid Stack<T,Cont>::push (T const& elem)\n{\n    elems.push_back(elem);\
  \   // append copy of elem\n}\ntemplate<typename T, template<typename,typename>\
  \ class Cont>\nvoid Stack<T,Cont>::pop ()\n{\n    assert(!elems.empty());\n    elems.pop_back();\
  \         // remove last element\n}\ntemplate<typename T, template<typename,typename>\
  \ class Cont>\nT const& Stack<T,Cont>::top () const\n{\n    assert(!elems.empty());\n\
  \    return elems.back();      // return copy of last element\n}\ntemplate<typename\
  \ T, template<typename,typename> class Cont>\ntemplate<typename T2, template<typename,typename>\
  \ class Cont2>\nStack<T,Cont>& Stack<T,Cont>::operator= (Stack<T2,Cont2> const&\
  \ op2)\n{\n    elems.clear();            // remove existing elements\n    elems.insert(elems.begin(),\
  \ op2.begin(), op2.end()); // 从 op2 插入到开头\n    return *this;\n}\n```\n\n再次注意，为了访问\
  \ `op2` 的所有成员，我们声明所有其他栈实例为友元（省略模板参数名称）：\n\n```cpp\ntemplate<typename, template<typename,\
  \ typename>class\nfriend class Stack;\n```\n\n尽管如此，并不是所有的标准模板都能用于 `Cont`。例如，`std::array`\
  \ 将无法工作，因为它包含一个数组长度的非类型模板参数，这在我们的模板参数声明中没有匹配。\n\n以下程序使用了该最终版本的所有功能：\n\n点击此处查看代码图片\n\
  \n`basics/stack9test.cpp`\n```cpp\n#include \"stack9.hpp\"\n#include <iostream>\n\
  #include <vector>\n\nint main()\n{\n    Stack<int> iStack;        // int 型栈\n  \
  \  Stack<float> fStack;      // 浮点型栈\n    // 操作 int 栈\n    iStack.push(1);\n   \
  \ iStack.push(2);\n    std::cout << \"iStack.top(): \" << iStack.top() << '\\n';\n\
  \    // 操作浮点型栈：\n    fStack.push(3.3);\n    std::cout << \"fStack.top(): \" << fStack.top()\
  \ << '\\n';\n    // 赋值不同类型的栈\n    fStack = iStack;\n    fStack.push(4.4);\n    std::cout\
  \ << \"fStack.top(): \" << fStack.top() << '\\n';\n    // 使用 vector 作为内部容器的 double\
  \ 栈\n    Stack<double, std::vector> vStack;\n    vStack.push(5.5);\n    vStack.push(6.6);\n\
  \    std::cout << \"vStack.top(): \" << vStack.top() << '\\n';\n    vStack = fStack;\n\
  \    std::cout << \"vStack: \";\n    while (! vStack.empty()) {\n        std::cout\
  \ << vStack.top() << ' ';\n        vStack.pop();\n    }\n    std::cout << '\\n';\n\
  }\n```\n\n该程序的输出如下：\n\n点击此处查看代码图片\n```\niStack.top(): 2\nfStack.top(): 3.3\nfStack.top():\
  \ 4.4\nvStack.top(): 6.6\nvStack: 4.4 2\n```\n\n关于模板模板参数的进一步讨论和示例，请参阅第 187 页的第 12.2.3\
  \ 节、第 12.3.4 节以及第 398 页的第 19.2.2 节。\n\n### 5.8 总结\n\n- 要访问依赖于模板参数的类型名称，必须使用 `typename`。\n\
  - 要访问依赖于模板参数的基类成员，必须通过 `this->` 或类名进行限定。\n- 嵌套类和成员函数也可以是模板。一种应用是实现带类型转换的通用操作。\n\
  - 构造函数或赋值运算符的模板版本并不会替换预定义的构造函数或赋值运算符。\n- 通过列表初始化或显式调用默认构造函数，可以确保当模板与内置类型实例化时，变量和成员会被初始化为默认值。\n\
  - 你可以定义*变量模板*（从 C++14 开始）。\n- 你还可以将类模板作为模板参数，即*模板模板参数*。\n- 模板模板参数通常必须与其参数精确匹配。\n\
  \    - 例如，一个带有类型为 `std::initializer_list<X>` 参数的构造函数（对于某种类型 `X`）。\n    - 类型为 `X\
  \ (&)[]` 的参数（对于任意类型 `X`）仅在 C++17 中变得有效，这是通过 Core issue 393 解决的。\n\n\n\n是的，我们有一些非常相似的术语对应完全不同的东西：`variable\
  \ template`（变量模板）是一个模板变量（`variable` 在这里是名词）。`variadic template`（变参模板）是一个用于变数量模板参数的模板（`variadic`\
  \ 在这里是形容词）。\n\n在 C++17 之前，这个版本存在一个问题，我们稍后会解释。然而，这只影响默认值 `std::deque`。因此，在讨论如何在 C++17\
  \ 之前处理它之前，我们可以先通过这个默认值来说明模板模板参数的一般特征。\n\n![](img/7478678.jpg)\n\n# 第 6 章\n\n## 移动语义与\
  \ `enable_if<>`\n\nC++11 引入的最显著的特征之一是移动语义（move semantics）。你可以使用它通过移动（即“偷取”）从源对象的内部资源到目标对象，而不是复制这些内容，来优化拷贝和赋值。只要源对象不再需要其内部值或状态（因为它即将被丢弃），就可以这样做。\n\
  \n移动语义对模板的设计有很大影响，并且引入了特殊规则来在泛型代码中支持移动语义。本章将介绍这些特征。\n\n### 6.1 完美转发 (Perfect Forwarding)\n\
  \n假设你想编写一种泛型代码，来转发传递参数的基本属性：\n\n- 可修改对象应该被转发，以便它们仍然可以被修改。\n- 常量对象应该作为只读对象被转发。\n\
  - 可移动对象（我们由于它们即将过期可以“偷取”的对象）应该作为可移动对象被转发。\n\n为了在不使用模板的情况下实现此功能，我们必须编写所有三种情况。例如，将\
  \ `f()` 的调用转发到相应的函数 `g()`：\n\n点击此处查看代码图像\n\n```cpp\n//basics/move1.cpp\n#include\
  \ <utility>\n#include <iostream>\n\nclass X {\n  …\n};\n\nvoid g (X&) {\n  std::cout\
  \ << \"g() for variable\\n\";\n}\n\nvoid g (X const&) {\n  std::cout << \"g() for\
  \ constant\\n\";\n}\n\nvoid g (X&&) {\n  std::cout << \"g() for movable object\\\
  n\";\n}\n\n// 让 f() 转发参数 val 到 g():\nvoid f (X& val) {\n  g(val);              //\
  \ val 是非常量左值 => 调用 g(X&)\n}\n\nvoid f (X const& val) {\n  g(val);              //\
  \ val 是常量左值 => 调用 g(X const&)\n}\n\nvoid f (X&& val) {\n  g(std::move(val));   //\
  \ val 是非常量左值 => 需要 std::move() 来调用 g(X&&)\n}\n\nint main()\n{\n  X v;          \
  \      // 创建变量\n  X const c;          // 创建常量\n  f(v);               // 用于非常量对象的\
  \ f() 调用 f(X&) => 调用 g(X&)\n  f(c);               // 用于常量对象的 f() 调用 f(X const&)\
  \ => 调用 g(X const&)\n  f(X());            // 用于临时对象的 f() 调用 f(X&&) => 调用 g(X&&)\n\
  \  f(std::move(v));    // 用于可移动变量的 f() 调用 f(X&&) => 调用 g(X&&)\n}\n```\n\n在这里，我们看到了\
  \ `f()` 将其参数转发到 `g()` 的三种不同实现：\n\n点击此处查看代码图像\n\n```cpp\nvoid f (X& val) {\n  g(val);\
  \              // val 是非常量左值 => 调用 g(X&)\n}\n\nvoid f (X const& val) {\n  g(val);\
  \              // val 是常量左值 => 调用 g(X const&)\n}\n\nvoid f (X&& val) {\n  g(std::move(val));\
  \   // val 是非常量左值 => 需要 std::move() 来调用 g(X&&)\n}\n```\n\n注意，可移动对象（通过右值引用）的代码与其它代码不同：它需要\
  \ `std::move()`，因为根据语言规则，移动语义不会被传递。第三个 `f()` 中的 `val` 被声明为右值引用，其作为表达式使用时的值类别是非常量左值，行为与第一个\
  \ `f()` 中的 `val` 相同。如果没有 `move()`，则会调用非常量左值的 `g(X&)`。\n\n如果我们想在泛型代码中结合所有三种情况，我们就面临一个问题：\n\
  \n```cpp\ntemplate<typename T>\nvoid f (T val) {\n  g(T);\n}\n```\n\n这对于前两种情况有效，但对于传递可移动对象的第三种情况无效。C++11\
  \ 出于此为完美转发参数引入了特殊规则。实现此点的惯用代码如下：\n\n```cpp\ntemplate<typename T>\nvoid f (T&& val)\
  \ {\n  g(std::forward<T>(val));\n}\n```\n\n注意，`std::move()` 没有模板参数，并“触发”了传递参数的移动语义，而\
  \ `std::forward<>` 则根据传递的模板参数“转发”潜在的语义。不要假设模板参数 `T` 的 `T&&` 行为等同于特定类型 `X` 的 `X&&`。适用不同的规则！然而，在语法上它们看起来是相同的：\n\
  \n- 特定类型 `X` 的 `X&&` 声明参数为右值引用。它只能绑定到右值。\n- 模板参数 `T` 的 `T&&` 被称为转发引用（也称为通用引用）。它可以绑定到左值、常量左值或右值。在函数定义内部，它可以是可变的、不可变的或可移动的，你可以“偷取”其内部资源。\n\
  \n注意 `T` 必须是模板参数的名字。依赖模板参数是不够的。因此，完美转发参数的整个程序如下：\n\n```cpp\n//basics/move2.cpp\n\
  #include <utility>\n#include <iostream>\n\nclass X {\n  …\n};\n\nvoid g (X&) {\n\
  \  std::cout << \"g() for variable\\n\";\n}\n\nvoid g (X const&) {\n  std::cout\
  \ << \"g() for constant\\n\";\n}\n\nvoid g (X&&) {\n  std::cout << \"g() for movable\
  \ object\\n\";\n}\n\n// 让 f() 完美转发参数到 g():\ntemplate<typename T>\nvoid f (T&& val)\
  \ {\n  g(std::forward<T>(val)); // 为任何传递参数调用正确的 g()\n}\n\nint main()\n{\n  X v;\
  \                // 创建变量\n  X const c;          // 创建常量\n  f(v);               //\
  \ 用于变量的 f() 调用 f(X&) => 调用 g(X&)\n  f(c);               // 用于常量的 f() 调用 f(X const&)\
  \ => 调用 g(X const&)\n  f(X());            // 用于临时对象的 f() 调用 f(X&&) => 调用 g(X&&)\n\
  \  f(std::move(v));    // 用于可移动变量的 f() 调用 f(X&&) => 调用 g(X&&)\n}\n```\n\n当然，完美转发也可以与变参模板结合使用（参见第\
  \ 4.3 节的示例）。详情见节 15.6.3。\n\n### 6.2 特殊成员函数模板\n\n成员函数模板也可以作为特殊成员函数，包括构造函数，这可能会导致意外的行为。\n\
  \n考虑以下示例：\n\n点击此处查看代码图像\n\n```cpp\n//basics/specialmemtmpl1.cpp\n#include <utility>\n\
  #include <string>\n#include <iostream>\n\nclass Person\n{\n  private:\n    std::string\
  \ name;\n  public:\n    // 用于传递的初始名称的构造函数：\n    explicit Person(std::string const&\
  \ n) : name(n) {\n      std::cout << \"copying string-CONSTR for ’\" << name <<\
  \ \"’\\n\";\n    }\n\n    explicit Person(std::string&& n) : name(std::move(n))\
  \ {\n      std::cout << \"moving string-CONSTR for ’\" << name << \"’\\n\";\n  \
  \  }\n};\n```\n\n\n\n\n```cpp\n// copy and move constructor:\nPerson (Person const&\
  \ p) : name(p.name) {\n    std::cout << \"COPY-CONSTR Person ’\" << name << \"’\\\
  n\";\n}\nPerson (Person&& p) : name(std::move(p.name)) {\n    std::cout << \"MOVE-CONSTR\
  \ Person ’\" << name << \"’\\n\";\n}\n\nint main()\n{\n    std::string s = \"sname\"\
  ;\n    Person p1(s);              // init with string object => calls copying string-CONSTR\n\
  \    Person p2(\"tmp\");          // init with string literal => calls moving string-CONSTR\n\
  \    Person p3(p1);             // copy Person => calls COPY-CONSTR\n    Person\
  \ p4(std::move(p1));  // move Person => calls MOVE-CONST\n}\n```\n\n在这里，我们有一个 `Person`\
  \ 类，它包含一个字符串成员 `name`，我们为其提供了初始化构造函数。为了支持移动语义，我们重载了接受 `std::string` 的构造函数：\n\n*\
  \   我们提供了一个用于调用者仍然需要的字符串对象的版本，其中 `name` 通过对传入参数的拷贝来初始化：\n\n点击此处查看代码图像\n\n```cpp\n\
  Person(std::string const& n) : name(n) {\n    std::cout << \"copying string-CONSTR\
  \ for ’\" << name << \"’\\n\";\n}\n```\n\n*   我们提供了一个用于可移动字符串对象的版本，其中我们调用 `std::move()`\
  \ 来“偷取”它的值：\n\n点击此处查看代码图像\n\n```cpp\nPerson(std::string&& n) : name(std::move(n))\
  \ {\n    std::cout << \"moving string-CONSTR for ’\" << name << \"’\\n\";\n}\n```\n\
  \n如预期的那样，第一个构造函数用于正在使用的字符串对象（左值），而后者则用于可移动对象（右值）：\n\n点击此处查看代码图像\n\n```cpp\nstd::string\
  \ s = \"sname\";\nPerson p1(s);              // init with string object => calls\
  \ copying string-CONSTR\nPerson p2(\"tmp\");          // init with string literal\
  \ => calls moving string-CONSTR\n```\n\n除了这些构造函数外，示例还为拷贝构造函数和移动构造函数提供了特定的实现，以便观察整个\
  \ `Person` 对象何时被拷贝/移动的：\n\n点击此处查看代码图像\n\n```cpp\nPerson p3(p1);             // copy\
  \ Person => calls COPY-CONSTR\nPerson p4(std::move(p1));  // move Person => calls\
  \ MOVE-CONSTR\n```\n\n现在，让我们用一个通用的构造函数替换这两个字符串构造函数，该构造函数将完美转发（perfect forwarding）传入的参数到成员\
  \ `name`：\n\n点击此处查看代码图像\n\n`basics/specialmemtmpl2.hpp`\n\n```cpp\n#include <utility>\n\
  #include <string>\n#include <iostream>\n\nclass Person\n{\n  private:\n    std::string\
  \ name;\n  public:\n    // 用于传入初始名称的通用构造函数:\n    template<typename STR>\n    explicit\
  \ Person(STR&& n) : name(std::forward<STR>(n)) {\n        std::cout << \"TMPL-CONSTR\
  \ for ’\" << name << \"’\\n\";\n    }\n    // 拷贝和移动构造函数:\n    Person (Person const&\
  \ p) : name(p.name) {\n        std::cout << \"COPY-CONSTR Person ’\" << name <<\
  \ \"’\\n\";\n    }\n    Person (Person&& p) : name(std::move(p.name)) {\n      \
  \  std::cout << \"MOVE-CONSTR Person ’\" << name << \"’\\n\";\n    }\n};\n```\n\n\
  使用传入的字符串进行构造工作正常，符合预期：\n\n点击此处查看代码图像\n\n```cpp\nstd::string s = \"sname\";\nPerson\
  \ p1(s);              // init with string object => calls TMPL-CONSTR\nPerson p2(\"\
  tmp\");          // init with string literal => calls TMPL-CONSTR\n```\n\n注意在在这种情况下，`p2`\
  \ 的构造并没有创建一个临时字符串：`STR` 被推导为 `const char[4]`，`std::forward<STR>(n)` 将 `const char[4]`\
  \ 传递给 `std::string` 构造函数，这是高效的。\n\n点击此处查看代码图像\n\n### 6.3 使用 `enable_if` 禁用模板\n\n\
  从 C++11 开始，C++ 标准库提供了一个辅助模板 `enable_if` 来在某些条件下禁用模板。例如，如果函数模板 `foo()` 定义如下：\n\n\
  ```cpp\ntemplate<typename T>\ntypename std::enable_if<sizeof(T) > 4>::type\nfoo()\
  \ {}\n```\n\n如果 `sizeof(T) > 4` 为假，该定义将被忽略。也就是说，`enable_if` 是一个类型特质，它评估作为其（第一个）模板参数的给定表达式，行为如下：\n\
  \n*   如果表达式为 `true`，其成员 `type` 返回一个类型：\n    *   如果没有传递模板参数，该类型为 `void`。\n    * \
  \  否则，该类型为第二个模板参数。\n*   如果表达式为 `false`，则成员 `type` 未定义。\n\n对于自 C++14 起产生类型的特质，有一个对应的别名模板\
  \ `std::enable_if_t`，它允许你跳过 `typename` 和 `::type`。因此，自 C++14 你可以写：\n\n```cpp\ntemplate<typename\
  \ T>\nstd::enable_if_t<sizeof(T) > 4>\nfoo() {}\n```\n\n如果向 `std::enable_if` 或 `std::enable_if_t`\
  \ 传递了第二个参数：\n\n```cpp\ntemplate<typename T>\nstd::enable_if_t<sizeof(T) > 4, T>\n\
  foo() {\n    return T();\n}\n```\n\n当表达式为 `true` 时，`enable_if` 构造会展开为第二个参数。因此，如果\
  \ `MyType` 是传入或推导出的具体类型 `T`，且其大小大于 4，结果是\n\n```cpp\nMyType foo();\n```\n\n注意在声明中间使用\
  \ `enable_if` 表达式非常笨拙。出于这个原因，使用 `std::enable_if<>` 的常用方法是使用一个带有默认值的额外函数模板参数：\n\n\
  \n\n\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename T,\n         typename = std::enable_if_t<(sizeof(T)\
  \ > 4)>>\nvoid foo() {\n\n}\n```\n\n这展开为：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename\
  \ T,\n         typename = void>\nvoid foo() {\n\n}\n```\n\n如果 `sizeof(T) > 4`。\n\
  \n如果这种方法仍然太笨拙，并且你想让需求/约束更加显式，你可以使用别名模板（alias template）为它定义你自己的名称：^(5)\n\n点击此处查看代码图像\n\
  \n```cpp\ntemplate<typename T>\nusing EnableIfSizeGreater4 = std::enable_if_t<(sizeof(T)\
  \ > 4)>;\n\ntemplate<typename T,\n         typename = EnableIfSizeGreater4<T>>\n\
  void foo() {\n\n}\n```\n\n请参阅第 469 页第 20.3 节关于 `std::enable_if` 如何实现的讨论。\n\n###\
  \ 6.4 使用 `enable_if<>`\n\n我们可以使用 `enable_if<>` 来解决在第 95 页第 6.2 节中引入的构造函数模板问题。\n\n\
  我们需要解决的问题是禁用模板构造函数的声明：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename STR>\nPerson(STR&&\
  \ n);\n```\n\n如果传递的参数 `STR` 具有正确的类型（即为 `std::string` 或可转换为 `std::string` 的类型）。\n\
  \n为了这一点，我们使用另一个标准类型特性 `std::is_convertible<FROM, TO>`。在 C++17 中，相应的声明如下：\n\n点击此处查看代码图像\n\
  \n```cpp\ntemplate<typename STR,\n         typename = std::enable_if_t<\n      \
  \                       std::is_convertible_v<STR, std::string>>>\nPerson(STR&&\
  \ n);\n```\n\n如果类型 `STR` 可转换为类型 `std::string`，则整个声明将展开为：\n\n点击此处查看代码图像\n\n```cpp\n\
  template<typename STR,\n         typename = void>\nPerson(STR&& n);\n```\n\n如果类型\
  \ `STR` 不可转换为类型 `std::string`，则整个函数模板将被忽略。^(6)\n\n同样，我们可以通过别名模板为约束定义我们自己的名称：\n\n\
  点击此处查看代码图像\n\n```cpp\ntemplate<typename T>\nusing EnableIfString = std::enable_if_t<\n\
  \                                 std::is_convertible_v<T, std::string>>;\n\n…\n\
  \ntemplate<typename STR, typename = EnableIfString<STR>>\nPerson(STR&& n);\n```\n\
  \n因此，整个 `Person` 类应该如下所示：\n\n点击此处查看代码图像\n\n`basics/specialmemtmpl3.hpp`\n\n```cpp\n\
  #include <utility>\n#include <string>\n#include <iostream>\n#include <type_traits>\n\
  \ntemplate<typename T>\nusing EnableIfString = std::enable_if_t<\n             \
  \                    std::is_convertible_v<T,std::string>>;\n\nclass Person\n{\n\
  \  private:\n    std::string name;\n  public:\n    // 针对传递的初始名称的通用构造函数：\n    template<typename\
  \ STR, typename = EnableIfString<STR>>\n    explicit Person(STR&& n)\n    : name(std::forward<STR>(n))\
  \ {\n      std::cout << \"TMP-CONSTR for \" << name << \"\\n\";\n    }\n    // 拷贝和移动构造函数：\n\
  \    Person (Person& p) : name(p.name) {\n      std::cout << \"COPY-CONSTR \" <<\
  \ name << \"\\n\";\n    }\n    Person (Person&& p) : name(std::move(p)) {\n    \
  \  std::cout << \"MOVE-CONSTR \" << name << \"\\n\";\n    }\n};\n```\n\n现在，所有的调用都符合预期：\n\
  \n点击此处查看代码图像\n\n`basics/specialmemtmpl.cpp`\n\n```cpp\n#include \"specialmemtmpl.hpp\"\
  \nint main()\n{\n  std::string s = \"s\";\n```\n\n```cpp\nstd::string s = \"s\"\
  ;\nint main()\n{\n  std::string s = \"s\";\n  Person p1(s); // 使用字符串初始化，调用 TMP-CONSTR\n\
  \  Person p2(\"\"); // 使用字面量初始化，调用 TMP-CONSTR\n  Person p3(p1); // 拷贝，调用 COPY-CONSTR\n\
  \  Person p4(std::move(p1)); // 移动，调用 MOVE-CONSTR\n}\n```\n\n注意，在 C++14 中，我们必须如下声明别名模板，因为对于某些特性\
  \ `_t` 版本是定义的：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename T>\nusing EnableIfString\
  \ = std::enable_if_t<typename std::is_convertible<T, std::string>::value>;\n```\n\
  \n而在 C++11 中，我们必须如下声明别名模板，因为对于某些特性 `value` 版本是定义的：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename\
  \ T>\nusing EnableIfString = std::enable_if_t<std::is_convertible<T, std::string>::value>;\n\
  ```\n\n此外，在 C++17 中，我们必须如下声明别名模板，因为 `_v` 版本是定义的：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename\
  \ T>\nusing EnableIfString = std::enable_if_t<std::is_convertible_v<T, std::string>>;\n\
  ```\n\n但是，在这种情况下 `std::enable_if` 的 `_t` 版本是定义的：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename\
  \ T>\nusing EnableIfString = std::enable_if_t<typename std::is_convertible<T, std::string>::value>;\n\
  ```\n\n请参阅第 719 页第 D.2 节关于 `std::constructible` 的细节。\n\n请参阅第 727 页第 D.3 节关于 `std::copyconstructible`\
  \ 的细节。\n\n请参阅第 734 页第 D.6 节关于 `std::moveconstructible` 的细节。\n\n### 禁用特殊函数\n\n注意，通常我们不能使用\
  \ `enable_if<>` 来禁用定义的拷贝/移动构造函数或赋值运算符。这是因为成员模板在需要特殊函数时会被忽略。因此，通过以下这种声明：\n\n点击此处查看代码图像\n\
  \n```cpp\nclass C {\n  public:\n    template<typename T>\n    C (T const&) {\n \
  \     std::cout << \"tmpl copy constructor\\n\";\n    }\n    …\n};\n```\n\n当请求 `C`\
  \ 的拷贝时，仍然使用定义的拷贝构造函数：\n\n点击此处查看代码图像\n\n```cpp\nC x;\nC y{x}; // 仍然使用拷贝构造函数（而不是成员模板）\n\
  ```\n\n（我们实际上无法使用成员模板，因为无法指定或推导出其模板参数 T。）\n\n删除拷贝构造函数并不是解决方案，因为这样拷贝 C 会导致错误。\n\n\
  不过有一个棘手的解决方案：^(7) 我们可以为 `const volatile` 参数声明一个构造函数并将其标记为“已删除”（即使用 `= delete`）。这样做可以防止另一个构造函数的隐式声明。在这样的基础上，我们可以定义一个对于非\
  \ volatile 类型优于（已删除）拷贝构造函数的构造模板：\n\n点击此处查看代码图像\n\n```cpp\nclass C\n{\n  public:\n\
  \    …\n    // 用户定义将定义的拷贝构造函数为删除\n    //（通过转换为 volatile 来启用更好的匹配）\n    C(C const\
  \ volatile&) = delete;\n    // 实现具有更好匹配的拷贝构造模板：\n    template<typename T>\n    C\
  \ (T const&) {\n      std::cout << \"tmpl copy constructor\\n\";\n    }\n    …\n\
  };\n```\n\n现在，即使对于“正常”拷贝也会使用模板构造函数：\n\n\n\n\n在这样的模板构造函数中，我们可以通过 `enable_if<>` 应用额外的约束。例如，为了防止在模板参数为整数类型时允许拷贝模板类\
  \ `C<>` 的对象，我们可以实现以下代码：\n\n点击此处查看代码图片\n\n```cpp\ntemplate<typename T>\nclass C\n\
  {\n  public:\n    //…\n    // 用户定义将预定义的拷贝构造函数标记为删除（deleted）\n    //（通过转换为 volatile\
  \ 以实现更好的匹配）\n    C(C const volatile&) = delete;\n    // 如果 T 不是整数类型，则提供匹配更好的的拷贝构造函数模板：\n\
  \    template<typename U,\n             typename = std::enable_if_t<!std::is_integral<U>::value>>\n\
  \    C (C<U> const&) {\n        …\n    }\n    //…\n};\n```\n\n### 6.5 使用 Concepts\
  \ 简化 `enable_if<>` 表达式\n\n即使使用别名模板，`enable_if` 的语法仍然相当笨拙，因为它使用了一种变通方法：为了达到所需效果，我们添加了一个额外的模板参数，并“滥用”该参数来为函数模板的可用提供特定的要求。这样的代码很难阅读，并且使得函数模板的其他部分难以理解。\n\
  \n原则上，我们只需要一种语言功能，允许我们以某种方式对函数制定要求或约束，使得在不满足要求/约束时函数被忽略。\n\n这是对期待已久的语言特性 *concepts*（概念）的应用，它允许我们使用自己的简单语法为模板制定要求/条件。遗憾的是，尽管经过了长期讨论，concepts\
  \ 仍然没有成为 C++17 标准的一部分。不过，某些编译器为此类功能提供了实验性支持，concepts 可能会成为 C++17 之后的下一个标准的一部分。\n\
  \n按照建议的 concepts 用，我们只需要编写以下内容：\n\n点击此处查看代码图片\n\n```cpp\ntemplate<typename STR>\n\
  requires std::is_convertible_v<STR,std::string>\nPerson(STR&& n) : name(std::forward<STR>(n))\
  \ {\n    …\n}\n```\n\n我们甚至可以将要求指定为一个通用的概念：\n\n点击此处查看代码图片\n\n```cpp\ntemplate<typename\
  \ T>\nconcept ConvertibleToString = std::is_convertible_v<T,std::string>;\n```\n\
  \n并将此概念表述为要求：\n\n点击此处查看代码图片\n\n```cpp\ntemplate<typename STR>\nrequires ConvertibleToString<STR>\n\
  Person(STR&& n) : name(std::forward<STR>(n)) {\n    …\n}\n```\n\n这也可以如下进行表述：\n\n\
  点击此处查看代码图片\n\n```cpp\ntemplate<ConvertibleToString STR>\nPerson(STR&& n) : name(std::forward<STR>(n))\
  \ {\n    …\n}\n```\n\n请参见 附录 E 获取关于 C++ concepts 的详细讨论。\n\n### 6.6 总结\n\n- 在模板中，你可以通过将参数声明为\
  \ *转发引用*（forwarding references，声明为由模板参数名后跟 `&&` 组成的类型）并并在转发调用中使用 `std::forward<>()`\
  \ 来“完美”地转发参数。\n- 使用完美转发的成员函数模板时，它们可能比预定义的用于拷贝或移动对象的特殊成员函数匹配得更好。\n- 通过 `std::enable_if<>`你可以在编译时条件为假时禁用函数模板（一旦该条件被确定，该模板就会被忽略）。\n\
  - 通过使用 `std::enable_if<>`，当可以为单个参数调用的构造函数模板或赋值运算符模板比隐式生成的特殊成员函数具有更好的匹配度时，你可以避免相关问题。\n\
  - 你可以通过删除针对 `const volatile` 的预定义特殊成员函数，对特殊成员函数进行模板化（templify）并应用 `enable_if<>`。\n\
  - Concepts 将允许我们使用更直观的语法来处理对函数模板的要求。\n\n^(1) 移动语义不会自动传递是刻意为且重要的。如果不是这样，我们第一次在函数中使用可移动对象时就会丢失该对象的值。\n\
  ^(2) 像 `X const&&` 这样的类型是有效的，但在实践中没有常见的语义，因为“窃取”移动对象的内部表示需要修改该对象。然而，它可能被用于强制只传递临时对象或标记为\
  \ `std::move()` 的对象，而无法对其进行修改。\n^(3) *universal reference*（通用引用）一词是由 Scott Meyers\
  \ 提出的，作为一个可以结果为“左值引用”或“右值引用”的通用术语。由于“通用”这个词确实，太通用了，C++17 标准引入了 *forwarding reference*（转发引用）一词，因为使用此类引用的主要原因是转发对象。然而，请注意它不会自动转发。该术语描述的不是是什么，而是它的用途。\n\
  ^(4) 不要忘记将其放在括号中，否则将结束参数列表。\n^(5) 感谢 Stephen C. Dewhurst 指出。\n^(6) 如果你奇怪为什么我们不直接检查\
  \ `STR` 是否可转换，请注意：这取决于是否可转换。\n^(7) 感谢 Peter Dimov 指出这种技术。\n\n# 第 7 章 按值还是引用？\n\n\
  自诞生以来，C++ 就提供了按值传递和按引用传递，选择哪种并不总是很容易：通常引用传递开销更小但更复杂。C++11 引入了移动语义，这意味着现在有了不同的引用方式：^(1)\n\
  \n1. `X const&`（常量左值引用）：参数指向传递的对象，没有修改能力。\n2. `X&`（非常量左值引用）：参数指向传递的对象，具有修改能力。\n\
  3. `X&&`（右值引用）：参数指向传递的对象，具有移动语义，这意味着你可以修改或“窃取”其值。\n\n为已知具体类型决定如何声明参数已经够复杂了。在模板中，类型是未知的，因此决定何种传递机制变得更加困难。\n\
  \n尽管如此，在第 [20] 页的 1.6.1 节中，我们确实建议按值传递函数模板参数，除非有充分的理由，例如：\n\n- 不可拷贝.^(2)\n- 参数用于返回数据。\n\
  - 模板只是将参数转发到其他地方并原始参数的所有属性。\n- 有显著的性能提升。\n\n本章讨论了在模板中声明参数的不同方法，说明了按值传递的通用建议，并提供了不这样做的理由。它还讨论了在处理字符串字面量和其他原始数组时会遇到的棘手问题。\n\
  \n阅读本章时，熟悉值类别术语（*lvalue*、*rvalue*、*prvalue*、*xvalue* 等）会有帮助，这些术语在 附录 B 中有解释。\n\n\
  ### 7.1 按值传递\n\n\n\n当按值传递参数时，原则上每个参数都必须被拷贝。因此，每个参数都变成所传参数的拷贝。对于类来说，作为拷贝创建的对象通常由拷贝构造函数初始化。\n\
  \n调用拷贝构造函数的代价可能是高昂的。然而，即使在按值传递参数时，也有多种方法可以避免昂贵的拷贝：事实上，编译器可能会优化掉复制对象的拷贝操作，并且通过使用移动语义（move\
  \ semantics），即使对于复杂对象也可以也可以变得廉价。\n\n例如，让我们来看一个简单的函数模板，其参数是通过按值传递的：\n\n点击此处查看代码图像\n\
  \n```cpp\ntemplate<typename T>\n\nvoid printV (T arg) {\n  …\n}\n```\n\n当对整数调用此函数模板时，生成的代码是：\n\
  \n点击此处查看代码图像\n\n```cpp\nvoid printV (int arg) {\n  …\n}\n```\n\n参数 `arg` 成为任何传入参数的拷贝，无论它是一个对象、字面量还是由函数返回的值。\n\
  \n如果我们定义一个 `std::string` 并对它调用我们的函数模板：\n\n```cpp\nstd::string s = \"hi\";\n\nprintV(s);\n\
  ```\n\n则模板参数 `T` 被实例化为 `std::string`，因此我们得到了：\n\n点击此处查看代码图像\n\n```cpp\nvoid printV\
  \ (std::string arg)\n{\n  …\n}\n```\n\n同样，在传递字符串时，`arg` 变成了 `s` 的拷贝。这次拷贝是由字符串类的拷贝构造函数创建的，这是一个可能昂贵的操作，因为在原则上，这种拷贝操作创建了一个完整或“深”拷贝，使得拷贝在内部分配了自己的内存来存储该值。(3)\n\
  \n然而，潜在的拷贝构造函数并不总是被调用。考虑以下情况：\n\n点击此处查看代码图像\n\n```cpp\nstd::string returnString();\n\
  \nstd::string s = \"hi\";\n\nprintV(s);                *拷贝构造函数*\n\nprintV(std::string(\"\
  hi\"));  *拷贝通常被优化掉（如果没有，则使用移动构造函数)*\n\nprintV(returnString());    *拷贝通常被优化掉（如果没有，则使用移动构造函数)*\n\
  \nprintV(std::move(s));      *移动构造函数*\n```\n\n在第一次调用中，我们传递了一个*左值*（lvalue），这意味着使用了拷贝构造函数。但在第二和第三次调用中，当直接针对*右值*（prvalues，临时创建或由另一个函数返回的对象；参见附录\
  \ B` 获取的现有非常量对象）时，我们通过信号表明不再需要 `s` 的值来强制调用移动构造函数。\n\n因此，调用一个声明参数为按值传递的 `printV()`\
  \ 实现，通常只有在我们传递一个*左值*（即我们在之前创建的且通常在之后仍在使用的对象，因为我们没有使用 `std::move()` 来传递它）时才是昂贵的。遗憾的是，这是一个非常常见的情况。原因之一是提前创建对象以便稍后（经过某些修改）传递给其他函数是非常常见的。\n\
  \n#### 按值传递的退化\n\n我们必须提到按值传递的另一个属性：当按值传递参数到一个参数时，类型会发生*退化*（decay）。这意味着原始数组会被转换为指针，并且像\
  \ `const` 和 `volatile` 等修饰符会被移除（就像使用该值作为用 `auto` 声明的对象的初始化值一样）：^(4)\n\n点击此处查看代码图像\n\
  \n```cpp\ntemplate<typename T>\n\nvoid printV (T arg) {\n  …\n}\n```\n\n点击此处查看代码图像\n\
  \n```cpp\nstd::string const c = \"hi\";\n\nprintV(c);                //c 退化使得 arg\
  \ 类型为 std::string\n\nprintV(\"hi\");             //退化为指针，使得 arg 类型为 char const*\n\
  \nint arr[4];\n\nprintV(arr);              //退化为指针，使得 arg 类型为 char const*\n```\n\
  \n因此，当传递字符串字面量 `\"hi\"` 时，其类型 `char const[3]` 退化为 `char const*`，从而使得 `T` 的推导类型。因此，模板实例化如下：\n\
  \n点击此处查看代码图像\n\n```cpp\nvoid printV (char const* arg)\n{\n  …\n}\n```\n\n这种行为源自\
  \ C 语言，并有其优缺点。它通常简化了对传递的字符串字面量的处理，但缺点是在 `printV()` 内部我们无法区分是指针还是原始数组。由于这个原因，我们将在第\
  \ 7.4 节讨论如何处理字符串字面量和原始数组。[15 页]。\n\n### 7.2 引用传递\n\n现在让我们讨论引用传递的不同形式。在所有情况下，引用传递都不会发生退化。然而，有时传递是不可能的，且参数可能会导致问题。\n\
  \n#### 7.2.1 常量引用\n\n为了避免任何（必要的）拷贝，在传递临时对象时，我们可以使用常量引用。例如：\n\n点击此处查看代码图像\n\n```cpp\n\
  template<typename T>\n\nvoid printR (T const& arg) {\n  …\n}\n```\n\n这种声明使得传递参数不会创建拷贝（无论拷贝是否廉价）：\n\
  \n点击此处查看代码图像\n\n```cpp\nstd::string returnString();\n\nstd::string s = \"hi\";\n\
  \nprintR(s);\n\nprintR(std::string(\"hi\"));\n\nprintR(returnString());\n\nprintR(std::move(s));\n\
  ```\n\n即使是 `int` 也是通过引用传递，这有点适得其反，但影响并不大。因此：\n\n点击此处查看代码图像\n\n```cpp\nint i = 42;\n\
  \nprintR(i);\n```\n\n结果是 `printR()` 被实例化为：\n\n点击此处查看代码图像\n\n```cpp\nvoid printR\
  \ (int const& arg) {\n  …\n}\n```\n\n在底层，引用传递是通过传递参数的地址来实现的。地址编码紧凑，因此从调用者到被者传递地址本身是高效的。然而，当编译器编译调用者代码时，传递地址可能会产生不确定性：调用者用地址做了什么？从理论上说，调用者可以更改该地址可达的所有值。这意味着编译器必须假设调用后，它可能缓存的所有值（通常在机器寄存器中）都是无效的。重新加载所有值可能是相当昂贵的。\n\
  \n这种坏消息被内联（inlining）所缓解：如果编译器可以*内联*展开调用，就可以对调用者和被者共同进行推理，并在许多情况下“看到”该地址除了用于传递底层值之外没有其他用途。\n\
  \n\n\n\n当通过引用传递参数给参数时，它们不会发生*退化**decay*）。这意味着原始数组不会转换为指针，且如 `const` 和 `volatile`\
  \ 等限定符不会被移除。然而，由于*调用*参数被声明为 `T const` `&`，*模板*参数 `T` 本身不会被推导为 `const`。例如：\n\n点击此处查看代码图像\n\
  \n```cpp\ntemplate<typename T>\nvoid printR (T const& arg) {\n  …\n}\n\nstd::string\
  \ const c = \"hi\";\nprintR(c);              // T 推导为 std::string, arg 是 std::string\
  \ const&\nprintR(\"hi\");           // T 推导为 char[3], arg 是 char const(&)[3]\nint\
  \ arr[4];\nprintR(arr);            // T 推导为 int[4], arg 是 int const(&)[4]\n```\n\
  \n因此，在 `printR()` 中用类型 `T` 声明的局部对象不是常量。\n\n#### 7.2.2 非常量引用传递\n\n当你想要通过传递的参数返回值时（即，当你想要使用*输出*或*输入输出*参数时），你必须使用非常量引用（除非你倾向于通过指针传递）。同样，这意味着在传递参数时，不会创建拷贝。被调用的函数模板的参数可以直接访问传递的参数。\n\
  \n考虑以下内容：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename T>\nvoid outR (T& arg) {\n\
  \  …\n}\n```\n\n注意，对临时值（prvalue）或通过 `std::move()` 传递的现有对象（xvalue）调用 `outR()` 通常是不被允许的：\n\
  \n点击此处查看代码图像\n\n```cpp\nstd::string returnString();\nstd::string s = \"hi\";\noutR(s);\
  \                // OK: T 推导为 std::string, arg 是 std::string&\noutR(std::string(\"\
  hi\")); // ERROR: 不允许传递临时值 (prvalue)\noutR(returnString());   // ERROR: 不允许传递临时值\
  \ (prvalue)\noutR(std::move(s));     // ERROR: 不允许传递 xvalue\n```\n\n你可以传递非常量类型的原始数组，这些数组同样不会发生退化：\n\
  \n点击此处查看代码图像\n\n```cpp\nint arr[4];\noutR(arr);              // OK: T 推导为 int[4],\
  \ arg 是 int(&)[4]\n```\n\n因此，你可以修改元素，例如，处理数组的大小。例如：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename\
  \ T>\nvoid outR (T& arg) {\n  if (std::is_array<T>::value) {\n    std::cout << \"\
  got array of \" << std::extent<T>::value << \" elems\\n\";\n  }\n  …\n}\n```\n\n\
  然而，模板在此处稍微有点复杂。如果你传递一个 `const` 参数，推导可能会导致 `arg` 变成一个常量引用的声明，这意味着突然允许传递右值（rvalue），而此处期望的是左值（lvalue）：\n\
  \n点击此处查看代码图像\n\n```cpp\nstd::string const c = \"hi\";\noutR(c);                //\
  \ OK: T 推导为 std::string const\noutR(returnConstString()); // OK: 如果 returnConstString()\
  \ 返回 const string 则相同\noutR(std::move(c));     // OK: T 推导为 std::string const^(6)\n\
  outR(\"hi\");             // OK: T 推导为 char[3]\n```\n\n当然，在函数模板内部尝试修改传递的参数将是一个错误。在调用表达式中传递\
  \ `const` 对象是可能的，但当函数完全实例化（这可能在稍后发生）时，任何修改尝试都将触发错误（然而，这可能发生在被调用的模板内部；参见第 9.4 节，第\
  \ 143 页）。\n\n如果你想禁用向非常量引用传递常量对象，可以执行以下操作：\n\n- 使用 `static assertion` 触发编译时错误：\n\
  点击此处查看代码图像\n\n```cpp\ntemplate<typename T>\nvoid outR (T& arg) {\n  static_assert(!std::is_const<T>::value,\
  \ \"out parameter of foo<T>(&) is const\");\n  …\n}\n```\n\n- 使用 `std::enable_if`\
  \ 禁用此情况下的模板（参见第 6.3 节，第 98 页）：\n点击此处查看代码图像\n\n```cpp\ntemplate<typename T>\nvoid\
  \ outR (T& arg) {\n  static_assert(!std::is_const<T>::value, \"out parameter of\
  \ foo<T>(&) is const\");\n  …\n}\n```\n\n- 或者一旦支持概念后（参见第 6.1 节，第 91 页）：\n```cpp\n\
  template<typename T, typename = typename std::enable_if<!std::is_const<T>::value>::type\
  \ = void>\nvoid outR (T& arg) {\n  …\n}\n```\n\n\n\n\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename\
  \ T>\nvoid printT (T arg) {\n  …\n}\n```\n\n```cpp\nstd::string s = \"hello\";\n\
  printT(s);               //通过引用传递 s\nprintT(std::cref(s));    // “仿佛通过引用”地传递 s\n\
  ```\n\n然而，请注意 `std::cref()` 并没有改变模板中参数的处理方式。相反，它使用了一个技巧：它将被传递的参数 `s` 包装在一个行为类似于引用的对象中。事实上，它创建了一个类型为\
  \ `std::reference_wrapper<>` 的对象，该对象引用原始参数，并按值传递该对象。该包装器大体或小只支持一种操作：转换回原始类型的隐式类型转换，产生原始对象。^(7)\
  \ 因此，只要你为传递的对象有一个有效的运算符，你就可以使用引用包装器。例如：\n\n点击此处查看代码图像\n\n`basics/cref.cpp`\n\n```cpp\n\
  #include <functional>  // 用于 std::cref()\n#include <string>\n#include <iostream>\n\
  \nvoid printString(std::string const& s)\n{\n  std::cout << s << '\\n’;\n}\n\ntemplate<typename\
  \ T>\nvoid printT (T arg)\n{\n  printString(arg);      //可能会将 arg 转换回 std::string\n\
  }\n\nint main()\n{\n  std::string s = \"hello\";\n  printT(s);               //按值打印\
  \ s\n  printT(std::cref(s));    // “仿佛通过引用”地打印 s\n}\n```\n\n最后一次调用将一个类型为 `std::reference_wrapper<string\
  \ const>` 的对象按值传递给参数 `arg`，然后它将其传递并转换回其底层类型 `std::string`。\n\n注意，编译器必须知道有必要转换回原始类型的隐式转换。由于这个原因，只有当你通过泛型代码传递对象时，`std::ref()`\
  \ 和 `std::cref()` 通常才能正常工作。例如，直接尝试输出传递的泛型类型 `T` 的对象将失败，因为为 `std::reference_wrapper<>`\
  \ 没有定义输出运算符：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename T>\nvoid printV (T arg)\
  \ {\n  std::cout << arg << '\\n’;\n}\n…\n```\n\n```cpp\nstd::string s = \"hello\"\
  ;\nprintV(s);               //OK\nprintV(std::cref(s));    // 错误：引用包装器未定义 operator\
  \ <<\n```\n\n此外，以下操作也会失败，因为你无法将引用包装器与 `char const*` 或 `std::string` 进行比较：\n\n点击此处查看代码图像\n\
  \n```cpp\ntemplate<typename T1, typename T2>\nbool isless(T1 arg1, T2 arg2)\n{\n\
  \  return arg1 < arg2;\n}\n…\n```\n\n```cpp\nstd::string s = \"hello\";\nif (isless(std::cref(s)\
  \ < \"world\")) …    //错误\nif (isless(std::cref(s) < std::string(\"world\"))) …\
  \  //错误\n```\n\n给 `arg1` 和 `arg2` 一个共同类型 `T` 也没有帮助的：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename\
  \ T>\nbool isless(T arg1, T arg2)\n{\n  return arg1 < arg2;\n}\n```\n\n因为这样编译器在尝试推导\
  \ `arg1` 和 `arg2` 的 `T` 时会得到冲突类型。\n\n因此，`std::reference_wrapper<>` 类的作用是能够将引用作为“一类对象”使用，你可以复制它并因此按值传递给函数模板。你也可以在类中使用它，例如持有指向容器中对象的引用。但你最终总是需要转换回底层类型。\n\
  \n### 7.4 处理字符串字面量和原始数组\n\n到目前为止，我们已经看到了在使用字符串字面量和原始数组时对模板的不同影响：\n\n- 按值调用会退化（decay），使其变成指向元素的指针。\n\
  - 任何形式的按引用调用都不会退化，因此参数仍然指向数组。\n\n这两者有利有坏。当将数组退化为指针时，你失去了区分来自传递的数组的指针的能力。另一方面，在处理可能传递字符串字面量的参数时，不退化可能会变成问题，因为不同大小的字符串字面量具有不同的类型。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<typename T>\nvoid foo (T const& arg1, T const&\
  \ arg2)\n{\n  …\n}\nfoo(\"hi\", \"guy\"); // 错误\n```\n\n在这里，`foo(\"hi\",\"guy\"\
  )` 无法编译，因为 `\"hi\"` 的类型是 `char[3]`，而 `\"guy\"` 的类型是 `char[4]`（由于 `T` 相同导致匹配失败，实际上是字符串字面量的大小不同导致了类型冲突）。在处理可能传递字符串字面量的参数时，不退化可能会变成问题，因为不同的字符串字面量具有不同的类型。例如：上面的\
  \ `foo(\"hi\",\"guy\")` 无法编译，因为 `\"hi\"` 的类型是 `char[3]`，而 `\"guy\"` 的类型是 `char[4]`（由于\
  \ `T` 相同导致匹配失败，实际上是字符串字面量的大小导致导致导致不问题）。）。只有只有只有只有面面面，，，，，，，，，，，，，，，，，  。。例如：\n\n\
  点击此处查看代码图像\n\n```cpp\ntemplate<typename T>\nvoid foo (11, arg2)\n{\n  …\n}\nfoo(\"\
  hi\", \"guy\"); // 编译\n```\n\n``````，，(\"(\"hi(\"guy\")` 编译失败，因为 `\"hi\"` 的类型是 `char[3]`，而\
  \ `guy\"` 的 ` `charchar44]`。只有当字符串字面量具有相同的长度时，模板才能工作。例如：\n\n点击此处查看代码图像\n\n```\n\n\
  （修正翻译逻辑：）\n上面的 `foo(\"hi\", \"guy\")` 无法编译，因为 `\"hi\"` 的类型是 `char[3]`，而 `\"guy\"\
  ` 的类型是 `char[4]`。只有当字符串字面量具有相同的长度时，模板才能工作。例如：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename\
  \ T>\nvoid foo (arg1, arg2)\n{\n  if (arg1 == arg2) {\n    …\n  }\n}\nfoo(\"hi\"\
  , \"guy\"); // 编译\n```\n\n（注：由于原文文本存在大量重复和乱码，已根据语义 进行了清理和逻辑翻译）\n\n\n\n\n由于这些特殊处理，通常以不同方式处理数组的最佳方法就是简单地使用不同的函数名。当然，更好的方法是确保模板的调用者使用\
  \ `std::vector` 或 `std::array`。但只要字符串面字量是原始数组，我们就必须将它们考虑进来。\n\n### 7.5 处理返回值\n\n\
  对于返回值，你也可以决定按值返回还是按引用返回。然而，返回引用是一个潜在的麻烦根源，因为你引用的可能是一个你无法控制的变量。在以下几种情况下，返回引用是常见的编程惯例：\n\
  \n- 返回容器或字符串的元素（例如，通过 `operator[]` 或 `front()`）\n- 赋予类成员写访问权限\n- 返回对象以实现链式调用（用于流的\
  \ `operator<<` 和 `operator>>`，以及通常用于类对象的 `operator=`）\n\n此外，通过返回 `const` 引用来赋予成员的读权限也是很常见的。\n\
  \n请注意，如果使用不当，所有这些情况都可能导致问题。例如：\n\n点击此处查看代码图\n\n```cpp\nstd::string* s = new std::string(\"\
  whatever\");\nauto& c = (*s)[0];\ndelete s;\nstd::cout << c;   //运行时错误\n```\n\n\
  在这里，我们获取了一个字符串元素的引用，但当我们使用该引用时，底层的字符串已经不再存在（即我们创建了一个悬空引用），这导致了未定义行为。这个例子有些是刻意为之（经验丰富的程序员可能一眼就能看出问题），但情况很容易变得不那么明显。例如：\n\
  \n点击此处查看代码图\n\n```cpp\nauto s = std::make_shared<std::string>(\"whatever\");\nauto&\
  \ c = (*s)[0];\ns.reset();\nstd::cout << c;   //运行时错误\n```\n\n因此，我们应该确保函数模板按值返回其结果。然而，正如本章讨论的，使用模板参数\
  \ `T` 并不能保证它不是引用，因为 `T` 有时会被隐式推导为引用：\n\n点击此处查看代码图\n\n```cpp\ntemplate<typename T>\n\
  T retR(T&& p)   // p *是一个转发引用\n{\n  return T{…};   // 错误：当为左值调用时，按引用返回\n}\n```\n\
  \n即使 `T` 是从按值调用推导出的模板参数，当显式指定模板参数为引用时，它也可能变成引用类型：\n\n点击此处查看代码图\n\n```cpp\ntemplate<typename\
  \ T>\nT retV(T p)     //注意：T *可能会变成引用\n{\n  return T{…};   // 错误：如果 T *是引用，则按引用返回\n\
  }\n\nint x;\nretV<int&>(x);     // retT() *针对* T *作为* int& *实例化*\n```\n\n为了安全起见，你有两个选择：\n\
  \n- 使用类型特性符 `std::remove_reference<>`（参见第 729 页的 D.4 节）将类型 `T` 转换为非引用类型：\n\n点击此处查看代码图\n\
  \n```cpp\ntemplate<typename T>\ntypename std::remove_reference<T>::type retV(T p)\n\
  {\n  return T{…}; // 按值返回\n}\n```\n\n- 其他特性符，例如 `std::decay<>`（参见 D.4 节），在这里也有用，因为它们也会移除引用。\n\
  \n- 通过让编译器推导返回类型，使用 `auto`（自 C++14 起），因为它会自动退化：\n\n点击此处查看代码图\n\n```cpp\ntemplate<typename\
  \ T>\nauto retV(T p) // 返回类型由编译器推导\n按值返回\n{\n  return T{…}; // 按值返回\n}\n```\n\n\
  ### 7.6 推荐的模板参数声明\n\n正如我们在前面的节中学到的，根据模板参数有多种方式声明参数：\n\n- 按值声明参数：这种方法简单，它会退化字符串面量和原始数组，但没有提供灵活性。\n\
  \n- 按引用声明参数：这种方法对于大型对象通常更好。\n\n#### 通用建议\n\n考虑到这些选项，我们对函数模板建议如下：\n\n1. 默认情况下，将参数声明为值。这简单且对小型类型有效。\n\
  2. 如果有充分理由，可以这样做：\n   - 如果需要修改参数，使用引用。\n   - 如果需要转发参数，使用转发引用。\n   - 如果性能是关键，使用常量引用。\n\
  3. 如果你有更好的主意，不要遵循这些建议。但要进行测试！\n\n#### 不要过度泛化\n\n请注意，在实践中，函数模板往往不是用于任意类型的参数。相反，存在某些限制。例如，你可能知道只会传入某种类型的\
  \ vector。在这种情况下，最好不要将此类函数声明得过于泛化。\n\n### **`std::make_pair()`** 示例\n\n`std::make_pair<>()`\
  \ 是演示参数传递机制陷阱的一个很好的例子。它是 C++ 标准库中的一个方便模板函数，用于类型推导创建 `std::pair<>` 对象。\n\n\n\n\n\n\
  - 在第一个 C++ 标准 C++98 中，`make_pair<>()` 被声明在 `std` 命名空间内，并使用引用传递（call-by-reference）以避免不必要的拷贝：\n\
  \n点击此处查看代码图片\n\n```cpp\ntemplate<typename T1, typename T2>\npair<T1,T2> make_pair\
  \ (T1 const& a, T2 const& b)\n{\n  return pair<T1,T2>(a,b);\n}\n```\n\n然而，在使用不同大小的字符串字面量或原始数组时，这几乎立即导致了严重问题。(8)\n\
  \n- 因此，在 C++03 中，该函数的定义被改为使用值传递（call-by-value）：\n\n点击此处查看代码图片\n\n```cpp\ntemplate<typename\
  \ T1, typename T2>\npair<T1,T2> make_pair (T1 a, T2 b)\n{\n  return pair<T1,T2>(a,b);\n\
  }\n```\n\n正如你在该问题解决方案的理由中所读的，“看起来与另外两个建议相比，这对标准的更改要小得多，而且对效率的担忧完全被解决方案带来的优势所抵消了。”\n\
  \n- 然而，在 C++11 中，`make_pair()` 必须支持移动语义（move semantics），因此参数必须变成转发引用（forwarding\
  \ references）。由于这个原因，定义再次发生了如下变化：\n\n点击此处查看代码图片\n\n```cpp\ntemplate<typename T1,\
  \ typename T2>\nconstexpr pair<typename decay<T1>::type, typename decay<T2>::type>\n\
  make_pair (T1&& a, T2&& b)\n{\n  return pair<typename decay<T1>::type,\n       \
  \      typename decay<T2>::type>(forward<T1>(a), forward<T2>(b));\n}\n```\n\n完整的实现甚至更加复杂：为了支持\
  \ `std::ref()` 和 `std::cref()`，函数还将将 `std::reference_wrapper` 实例解包为真正的引用。\n\nC++\
  \ 标准库现在在许多地方以类似的方式完美地转发传递的参数，通常与 `std::decay<>` 结合。\n\n### 7.7 总结\n\n- 测试模板时，使用不同长度的字符串字面量。\n\
  - 按值传递的模板参数会发生退化（decay），而按引用传递则不会退化。\n- 类型特质 `std::decay<>` 允许你对按引用传递的模板参数进行退化。\n\
  - 在某些情况下，`std::cref()` 和 `std::ref()` 允许你在函数模板声明为按值传递时按引用传递参数。\n- 按值传递模板参数虽然虽然简单，但可能无法获得最佳性能。\n\
  - 除非有充分理由，否则请按值将参数传递给函数模板。\n- 确保返回值通常是按值传递（这可能意味着模板参数不能直接指定为返回类型）。\n- 在重要时，务必测量性能。不要依赖直觉；直觉可能是错误的。\n\
  \n^(1) 常量右值引用 `X const&&` 也是可能的，但它没有建立的语义含义。\n^(2) 注意，从 C++17 开始，即使没有可用的拷贝或移动构造函数，也可以按值传递临时实体（右值）（参见第\
  \ 676 页的 B.2.1 ）。因此，从 C++17 开始，额外的限制是左值无法进行拷贝的。\n^(3) 字符串类的实现本身可能包含某些优化以使拷贝更廉。其中一种是小字符串优化（SSO），直接在对象内部使用一些内存来存储值，只要值不过长，就不分配内存。另一个是写时拷贝（copy-on-write）优化，只要源和副本未被修改，就会使用与源相同的内存创建副本。然而，写时拷贝优化在多线程代码中有显著缺点。由于这个原因，从\
  \ C++11 开始，标准字符串被禁止使用。\n^(4) “decay”（decay）一词源自 C，也适用于函数到函数指针的类型转换（参见第 159 页的 11.1.1\
  \ ）。\n^(5) 使用 `const_cast` 是另一种更显式的修改所引用对象的方法。\n^(6) 当传递 `std::move(c)` 时，`std::move()`\
  \ 先将 `c` 转换为 `std::reference_wrapper`。\n^(7) 常量右值引用 `X const&&` 也是可能的，但它没有建立的语义含义。\n\
  ^(8) 详情见 18\n\n# 第 8 章 编译时编程\n\nC++ 一直包含了一些在编译时计算的方法。模板极大地增加了这方面的可能性，进一步的演变丰富了这个工具箱。事实上，C++\
  \ 拥有多种特性：\n\n- 在 C++98 之前，模板提供了在编译时计算的能力（然而，有些人认为这是对模板的“滥用”）\n- 通过偏特化，我们可以在编译时选择。\n\
  - 通过 SFINAE 原则，我们可以允许选择。\n- 在 C++11 和 C++14 中，`constexpr` 越来越支持 `for` 循环。\n- C++17\
  \ 引入了基于约束的编译时 `if`。\n\n本章介绍了这些特性，重点关注模板的作用和上下文。\n\n### 8.1 模板元编程\n\n模板在编译时实例化（与动态语言不同，后者的泛型是在运行时处理的）。C++\
  \ 的某些特性可以与实例化过程相结合，产生一种原始的内部“编程语言”。(1) 由于这个原因，模板可以用于“计算程序”。第 23 章 将涵盖整个故事和所有特性，但这里有一个简单的示例展示了什么是可能的\n\
  \n以下代码在编译时找出给定的数字是否为素数：\n\n点击此处查看代码图片\n\n`basics/isprime.hpp`*\n\n```cpp\ntemplate<unsigned\
  \ p, unsigned d> // p: 被检查数字， d: 当前除数\nstruct IsPrime {\n  static constexpr bool\
  \ value = (p%d != 0) && DoIsPrime<p,d-1>::value;\n};\n\ntemplate<unsigned p> //\
  \ 当除数为 2 时结束递归\nstruct DoIsPrime<p,2> {\n  static constexpr bool value = (p%2 !=\
  \ 0);\n};\n\ntemplate<unsigned p> // 主模板\nstruct IsPrime {\n  // 从 p/2 开始递归\n  static\
  \ constexpr bool value = DoIsPrime<p,p/2>::value;\n};\n\n// 特殊情况（以避免模板实例化时的无限递归）：\n\
  template<>\nstruct IsPrime<0> { static constexpr bool value = false; };\n\ntemplate<>\n\
  struct IsPrime<1> { static constexpr bool value = false; };\n\ntemplate<>\nstruct\
  \ IsPrime<2> { static constexpr bool value = true; };\n\ntemplate<>\nstruct IsPrime<3>\
  \ { static constexpr bool value = true; };\n```\n\n\n\n\n`IsPrime<>` 模板通过成员 `value`\
  \ 返回传递的模板参数 `p` 是否为质数。为了实现这一点，它实例化了 `DoIsPrime<>`，该模板会递归展开为一个表达式，用于检查在 `p/2` 和 `2`\
  \ 之间的每个除数 `d` 是否能整除 `p` 而不有余数。\n\n例如，表达式\n\n```\nIsPrime<9>::value\n```\n\n展开为\n\
  \n```\nDoIsPrime<9,4>::value\n```\n\n再次展开为\n\n点击此处查看代码图片\n\n```\n9%4!=0 && DoIsPrime<9,3>::value\n\
  ```\n\n再次展开为\n\n点击此处查看代码图片\n\n```\n9%4!=0 && 9%3!=0 && DoIsPrime<9,2>::value\n```\n\
  \n再次展开为\n\n点击此处查看代码图片\n\n```\n9%4!=0 && 9%3!=0 && 9%2!=0\n```\n\n计算结果为 `false`，因为\
  \ `9%3` 等于 `0`。\n\n正如这一系列实例化链所示：\n\n- 我们使用 `DoIsPrime<>` 的递归展开来迭代从 `p/2` 直到 `2`\
  \ 的所有除数，以找出这些除数中是否存在能精确除尽给定整数（即无余数）。\n- `DoIsPrime<>` 针对 `d` 等于 `2` 的部分特化作为结束递归的判定。\n\
  \n注意，所有这些操作都在编译时完成。也就是说，\n\n```\nIsPrime<9>::value\n```\n\n在编译时展开为 `false`。\n\n\
  这种模板语法可能相当笨拙，但类似的代码自 C++98（以及更早版本）以来就是有效的，并证明在许多库中非常有用用([2)）。\n\n详情请参阅第 23 章。\n\n\
  ### 8.2 使用 constexpr 计算\n\nC++11 引入了一项新特性 `constexpr`，它极大地简化了各种形式的编译时计算。特别是，在输入适当的情况下，`constexpr`\
  \ 函数可以在编译时求值。虽然在 C++11 中 `constexpr` 函数的引入带有严格的限制（例如，每个 `constexpr` 函数定义本质上被限制只能包含\
  \ `return` 语句），但这些限制大部分在 C++14 中被移除了。当然，成功求值 `constexpr` 函数仍然要求所有计算步骤在编译时都是可行且有效的：目前，这排除了堆分配或抛出异常等操作。\n\
  \n我们测试一个数字是否为质数的示例可以在 C++11 中如下实现：\n\n点击此处查看代码图片\n\n`basics/isprime11.hpp`\n\n```cpp\n\
  constexpr bool\ndoIsPrime (unsigned p, unsigned d)  // p: 检查的数字, d: 当前除数*\n{\n \
  \ return d!=2 ? (p%d!=0) && doIsPrime(p,d-1) // 检查此及更小的除数*\n               : (p%2!=0);\
  \               // 如果除数为 2 则结束递归*\n}\n\nconstexpr bool isPrime (unsigned p)\n{\n\
  \  return p < 4 ? !(p<2)              // 处理特殊情况*\n               : doIsPrime(p,p/2);\
  \      // 从 p/2 开始使用除数递归*\n}\n```\n\n由于只能使用一条语句的限制，我们只能使用条件运算符作为选择机制，并且仍然需要递归来迭代元素。但这种语法是普通的\
  \ C++ 函数代码，使其比我们依赖模板实例化的第一个版本更容易理解。\n\n有了 C++14，`constexpr` 函数可以使用通用 C++ 代码中可用的绝大多数控制结构。因此，我们现在只需要使用一个简单的\
  \ `for` 循环，而不是编写笨拙的模板代码或有些晦涩的单行代码：\n\n点击此处查看代码图片\n\n`basics/isprime14.hpp`\n\n```cpp\n\
  constexpr bool isPrime (unsigned int p)\n{\n  for (unsigned int d=2; d<=p/2; ++d)\
  \ {\n    if (p % d == 0) {\n      return false;  // 找到无余数的除数*\n    }\n  }\n  return\
  \ p > 1;   // 未找到无余数的除数*\n}\n```\n\n通过 C++11 和 C++14 版本的 `constexpr isPrime()` 实现，我们可以简单地调用\
  \ `isPrime(9)` 来判断 `9` 是否为质数。注意，它可以在编译时完成，但并不一定这样做。在需要编译时值的语文中（例如数组长度），编译器将尝试在编译时对\
  \ `constexpr` 函数的调用进行求值，如果不可行则会报错。在其他语文中，编译器可能会或可能不会尝试在编译时求值，但如果此类求值失败，则不会发布错误，调用将保留为运行时调用。\n\
  \n例如：\n\n点击此处查看代码图片\n\n`bool b1 = isPrime(9);` 这种调用可以在编译时完成，但并不一定这样做。在需要编译时值的语文中（例如数组长度），编译器将尝试在编译时对\
  \ `constexpr` 函数的调用进行求值，如果不可行则会报错。在其他语文中，编译器可能会或可能不会尝试在编译时求值，但如果此类求值失败，则不会发布错误，调用将保留为运行时调用。\n\
  \n点击此处查看代码图片\n\n`const bool b2 = isPrime(9);` 这种调用可以在编译时完成，但并不一定这样做。在需要编译时值的语文中（例如数组长度），编译器将尝试在编译时对\
  \ `constexpr` 函数的调用进行求值，如果不可行则会报错。在其他语文中，编译器可能会或可能不会尝试在编译时求值，但如果此类求值失败，则不会发布错误，调用将保留为运行时调用。\n\
  \n点击此处查看代码图片\n\n`int x;` 这种调用可以在编译时完成，但并不一定这样做。在需要编译时值的语文中（例如数组长度），编译器将尝试在编译时对 `constexpr`\
  \ 函数的调用进行求值，如果不可行则会报错。在其他语文中，编译器可能会或可能不会尝试在编译时求值，但如果此类求值失败，则不会发布错误，调用将保留为运行时调用。\n\
  \n### 8.3 使用部分特化选择执行路径\n\n`isPrime()` 这种编译时测试的一个有趣应用是使用部分特化在编译时选择不同的实现方案。例如，我们可以根据模板参数是否为质数来选择不同的实现：\n\
  \n点击此处查看代码图片\n\n```cpp\n// 主模板：\ntemplate<int SZ, bool = isPrime(SZ)>\nstruct Helper;\n\
  \n// 如果 SZ 不是质数的实现：\ntemplate<int SZ>\nstruct Helper<SZ, false>\n{\n  ...\n};\n\n\
  // 如果 SZ 是质数的实现：\ntemplate<int SZ>\nstruct Helper<SZ, true>\n{\n  ...\n};\n\n```\n\
  \n在这里，根据 `std::array` 参数的大小是否为质数，我们使用了 `Helper<>` 的两种不同实现。这种部分特化的应用广泛适用于根据调用时的属性来选择函数模板的不同实现。\n\
  \n上面我们两个部分特化来实现两种可能的方案。相反，我们也可以使用主模板作为其中一种方案（默认）情况，并使用部分特化处理任何其他特殊情况：\n\n点击此处查看代码图片\n\
  \n```cpp\n// 主辅助模板（当没有特化匹配时使用）：\ntemplate<int SZ, bool = isPrime(SZ)>\nstruct Helper\n\
  {\n  ...\n};\n\n// 如果 SZ 是质数的特殊实现：\ntemplate<int SZ>\nstruct Helper<SZ, true>\n\
  {\n  ...\n};\n```\n\n\n\n\n第 20 章 讨论了根据约束条件选择函数实现的技术。\n\n### 8.4 SFINAE (替换失败不是错误)\n\
  \n在 C++ 中，为了适应各种参数类型，对函数进行重载常见。因此，当编译器看到对重载函数的调用时，它必须单独考虑每个候选者，评估调用的参数并选择最匹配的候选者（有关此过程的细节，请参阅附录\
  \ C）。\n\n当调用的候选者集合包含函数模板时，编译器必须首先确定该候选者应该使用哪些模板参数，然后将这些参数替换到函数参数列表和返回类型中，最后评估它们的匹配程度（就像处理普通函数一样）。然而，替换过程可能会遇到问题：`It`\
  \ 可能会产生没有意义的构造结构。语言规则并没有判定此类无意义的替换会导致错误，而是规定具有此类替换问题的候选者将直接被忽略。\n\n我们把这一原则称为为 `SFINAE`（读音类似于\
  \ *sfee-nay*），它的意思是“替换失败不是错误”。\n\n请注意，此处描述的替换过程与按需实例化过程不同（参见第 27 页的第 2.2 节）：即使对于可能需要的潜在实例化也可以进行替换（这样编译器就可以评估它们是否真的不需要）。它是对直接出现在函数声明（而非函数体）中的构造结构的替换。\n\
  \n考虑以下示例：\n\n点击此处查看代码图像\n\n```cpp\n// basics/len1.hpp\n\n// 原始数组中的元素个数：\ntemplate<typename\
  \ T, unsigned N>\nstd::size_t len (T(&)[N])\n{\n  return N;\n}\n\n// 具有 size_type\
  \ 的类型的元素个数：\ntemplate<typename T>\ntypename T::size_type len (T const& t)\n{\n \
  \ return t.size();\n}\n```\n\n在这里，我们定义了两个接受一个泛型参数的函数模板 `len()`：^(5)\n\n1. 第一个函数模板将参数声明为\
  \ `T(&)[N]`，这意味着参数必须是一个包含 `N` 个 `T` 类型元素的数组。\n2. 第二个函数模板仅将参数声明为 `T`，这对参数没有施加任何限制，但返回类型\
  \ `T::size_type`，这要求传递的参数类型具有相应的成员 `size_type`。\n\n当传递原始数组或字符串字面量时，只有针对原始数组的函数模板匹配：\n\
  \n点击此处查看代码图像\n\n```cpp\nint a[10];\nstd::cout << len(a);      // OK: 仅匹配数组的 len()\n\
  std::cout << len(\"tmp\");   //OK: 仅匹配数组的 len()\n```\n\n根据其签名，第二个函数模板在分别用 `int[10]`\
  \ 和 `char const[4]` 替换 `T` 时也会匹配，但这些替换会导致返回类型 `T::size_type` 出现潜在的错误。因此，在这些调用中，第二个模板被忽略了。\n\
  \n当传递 `std::vector<>` 时，只有第二个函数模板匹配：\n\n点击此处查看代码图像\n\n```cpp\nstd::vector<int> v;\n\
  std::cout << len(v);  // OK: 仅匹配具有 size_type 的类型的 len()\n```\n\n当传递原始指针时，两个模板都不匹配（不产生失败）。结果是编译器将报错未找到匹配的\
  \ `len()` 函数：\n\n点击此处查看代码图像\n\n```cpp\nint* p;\nstd::cout << len(p);  // ERROR:\
  \ 未找到匹配的 len() 函数\n```\n\n请注意，这与传递具有 `size_type` 成员但没有 `size()` 成员函数的类型的对象不同，例如\
  \ `std::allocator<>` 的情况：\n\n点击此处查看代码图像\n\n```cpp\nstd::allocator<int> x;\nstd::cout\
  \ << len(x);  // ERROR: 找到了 len() 函数，但无法 size()\n```\n\n当传递此类类型的对象时，编译器发现第二个函数模板是匹配的函数模板。因此，并不是报错未找到匹配的\
  \ `len()` 函数，而是会导致编译时错误，说明为 `std::allocator<int>` 调用 `size()` 是无效的。这次，第二个函数模板没有被忽略。\n\
  \n在替换返回类型时忽略某个候选者是没有意义的，这会导致编译器选择另一个参数匹配更差的候选者。例如：\n\n点击此处查看代码图像\n\n```cpp\n// basics/len2.hpp\n\
  \n// 原始数组中的元素个数：\ntemplate<typename T, unsigned N>\nstd::size_t len (T(&)[N])\n\
  {\n  return N;\n}\n\n// 具有 size_type 的类型的元素个数：\ntemplate<typename T>\ntypename T::size_type\
  \ len (T const& t)\n{\n  return t.size();\n}\n\n// 其他所有类型的备选：\nstd::size_t len (...)\n\
  {\n  return 0;\n}\n```\n\n在这里，我们还提供了一个始终匹配的通用 `len()` 函数，但它的匹配是最差（重载解析中的省略号 `…`，参见第\
  \ 682 页的第 C.2 节）。\n\n对于原始数组和 vector，有两个匹配，其中特定的匹配更好。对于指针，只有备选匹配，因此编译器不再抱怨缺少 `len()`。但对于分配，第二个和第三个模板匹配。\n\
  \n#### SFINAE 与重载解析\n\n随着时间的推移，SFINAE 原则对于模板设计者来说变得如此重要且通用，以至于这个缩写变成了一个动词。当我们说“*SFINAE\
  \ out* 一个函数”时，我们的意思是应用 SFINAE 机制来确保函数模板在某些约束条件下被忽略，通过对模板代码进行处理，使其产生无效代码。每当你在 C++\
  \ 标准中读到函数模板“不参与重载解析，除非……”时，意味着使用 SFINAE 在某些情况下“SFINAE out”该函数模板。\n\n例如，`std::thread`\
  \ 类声明了一个构造函数：\n\n点击此处查看代码图像\n\n```cpp\nnamespace std {\n  class thread {\n    public:\n\
  \      …\n      template<typename F, typename… Args>\n      explicit thread(F&&\
  \ f, Args&&… args);\n    …\n  };\n}\n```\n\n*备注：* 如果 `decay_t<F>` 类型与 `std::thread`\
  \ 类型相同，则该构造函数不参与重载解析。\n\n\n\n\n\n这意味着，如果使用 `std::thread` 作为第一个且唯一的参数调用模板构造函数，则该构造函数将被忽略。原因是，否则像这这样的成员模板有时可能会比任何预定义的拷贝或移动构造函数更匹配（详细信息请参见第\
  \ 95 页的第 6.2 节和第 333 页的第 16.2.4 节）。通过在为线程调用时通过 `SFINAE` **排除**（SFINAEing out）该构造函数模板，我们确保了当从另一个线程构造线程时，始终会使用预定义的拷贝或移动构造函数^(7)。\n\
  \n逐个案例应用这种技术可能会非常繁琐。幸运的是，标准库提供了更易禁用模板的工具。最为人知的特性是 `std::enable_if<>`，它在第 98 页的第\
  \ 6.3 节中引入。它允许我们通过将一个类型替换为包含禁用条件的构造结构来禁用模板。\n\n因此，`std::thread` 的实际声明通常如下：\n\n点击此处查看代码图像\n\
  \n```cpp\nnamespace std {\n  class thread {\n    public:\n      …\n      template<typename\
  \ F, typename… Args,\n               typename = std::enable_if_t<!std::is_same_v<std::decay_t<F>,\n\
  \                                            thread>>>\n      explicit thread(F&&\
  \ f, Args&&… args);\n      …\n  };\n}\n```\n\n关于 `std::enable_if<>` 如何使用部分特化和 SFINAE\
  \ 实现的详细信息，请参阅第 469 页的第 20.3 节。\n\n#### 8.4.1 使用 `decltype` 的表达式 SFINAE\n\n对于某些条件，要找到并编写出正确的表达式来对函数模板\
  \ `SFINAE out` 并不总是容易的。\n\n例如，假设我们希望确保函数模板 `len()` 对于具有 `size_type` 成员但没有 `size()`\
  \ 成员函数的类型的参数被忽略。在函数声明中如果如果没有对 `size()` 成员函数进行任何形式的约束要求，该函数模板会被选中，其最终的实例化将导致错误：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<typename T>\ntypename T::size_type len (T const&\
  \ t)\n{\n  return t.size();\n}\n\nstd::allocator<int> x;\nstd::cout << len(x) <<\
  \ '\\n'; //错误：选择了 len()，但 x 没有 size()\n```\n\n处理此类情况有一种常见的模式或惯用法：\n\n- 使用 `尾随返回类型语法`（在前面使用\
  \ `auto`，在结尾返回类型前使用 `->`）。\n- 使用 `decltype` 和逗号运算符定义返回类型。\n- 构造所有在逗号运算符开始时必须有效的表达式（在逗号运算符被重载的情况下，会被转换为\
  \ `void`）。\n- 在逗号运算符末尾定义一个实际返回类型的对象。\n\n例如：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename\
  \ T>\nauto len (T const& t) -> decltype( (void)(t.size()), T::size_type() )\n{\n\
  \  return t.size();\n}\n```\n\n这里的返回类型由：\n\n点击此处查看代码图像\n\n```cpp\ndecltype( (void)(t.size)(),\
  \ T::size_type() )\n```\n\n`decltype` 构造结构的操作数是一个由逗号分隔的表达式列表，因此最后一个表达式 `T::size_type()`\
  \ 产生所需返回类型的值（`decltype` 使用其将其转换为返回类型）。在（最后一个）逗号之前，我们有了必须有效的表达式，在 particular 例中是\
  \ `t.size()`。将表达式转换为 `void` 是为了避免表达式出现用户定义的逗号运算符的可能性。注意，`decltype` 的参数是一个**未求值的操作数**（unevaluated\
  \ operand），这意味着例如，你可以在不调用构造函数的情况下创建“虚拟对象”，这在第 166 页的第 1.2.3 节中讨论过。\n\n### 8.5 编译期\
