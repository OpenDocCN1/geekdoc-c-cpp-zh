  \ 并不能解决这个问题，因为 `size` 仍然是可以修改的。可以说，这个例子有些牵强。但在更复杂的情况下，此类问题确实会发生。此外，在 C++17 中，非类型参数是可以推导的；例如：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<typename T, decltype(auto) SZ\n```\n```\n\n使用 `decltype(auto)`\
