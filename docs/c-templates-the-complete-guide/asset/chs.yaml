  \ `struct` 相同。基于这种类比，自然会好奇对于联合体（union），对应的类型是什么：它将包含一个单值，但该值的类型是从一组可能的类型中选选的。例如，一个数据库字段可能包含一个整数、浮点数。\n\
  \n重要的是，它提供了一个为异构集合编写算法的框架，使用了与 C++ 标准库本身相同的抽象和术语（例如迭代器、序列和容器）。\n\n在本章中，我们开发一个 `Variant`\
  \ 类，它类似于 C++17 标准库的 `std::variant`。`Variant` 是一个判别 union，意味着它知道当前哪种可能的类型是激活的。`Variant`\
  \ 本身是一个模板，可以存储 `int`, `double` 或 `string`，但在任何时刻只能存储这些值中的一个。(1) 以下程序演示了 `Variant`\
  \ 的行为：\n\nClick here to view image\n\n```cpp\n// variant.cpp\n#include \"variant.hpp\"\
  \n#include <iostream>\n#include <string>\n\nint main()\n{\n    Variant<int, double,\
  \ string> field(17);\n    if (field.is<int>()) {\n        std::cout << \"Field stores\
  \ the integer \" << field.get<int>() << '\\n';\n    }\n    field = 42; // assign\
  \ value of same type\n    field = \"hello\"; //assign value of different type\n\
  \    std::cout << \"Field now stores the string \" << field.get<std::string>() <<\
  \ \"\\n\";\n}\n```\n\n它产生了以下输出：\n\nClick here to view image\n\nField stores the\
  \ integer 17\nField now stores the string \"hello\"\n\n变体可以被赋值为它的任意类型。我们可以使用成员函数\
  \ `is<T>()` 测试变体是否包含类型 `T` 的值，然后使用成员函数 `get<T>()` 提取该存储值。\n\n### 26.1 存储\n\n`Variant`\
  \ 类型第一个主要的设计方面是如何管理激活值的存储，即当前存储在变体中的值。不同的类型可能有不同的大小和对齐需要考虑。此外，变体需要存储一个判别器（discriminator），以指示哪种可能的类型是激活类型。一种简单的（尽管效率较低）的存储机制直接使用了元组（见第\
  \ 25 章）：\n\nClick here to view image\n\n```cpp\n// variantstorageastuple.hpp\ntemplate<typename…\
  \ Types>\nclass Variant {\npublic:\n    Tuple<Types…> storage;\n    unsigned char\
  \ discriminator;\n};\n```\n\n在这里，判别器作为元组的动态索引。静态索引等于当前判别器值的元组元素具有有效值，因此当 `discriminator`\
  \ 为 0 时，`get<0>(storage)` 提供对激活值的访问；当 `discriminator` 为 1 时，`get<1>(storage)` 提供对激活值的访问，以此此类推。\n\
  \n\n\n\n\n我们可以在元组（tuple）的基础上构建核心变体操作 `is<T>()` 和 `get<T>()`。然而，这样做非常低效，因为变体本身现在所需的存储空间等于所有可能的值类型大小之和，尽管同一时间只有一个类型是激活的。更好的方法是让每个可能的类型的存储空间重叠。我们可以通过递归地将变体展开为头部（head）和尾部（tail）来实现这一点，就像我们在第\
  \ 576 页第 25.1.1 节对元组操作的那样，但使用的是联合体（union）而不是类（class）：\n\n点击此处查看代码图像\n\n`variant/variantstorageasunion.hpp`\n\
  \n```cpp\ntemplate<typename… Types>\nunion VariantStorage;\n\ntemplate<typename\
  \ Head, typename… Tail>\nunion VariantStorage<Head, Tail…> {\n  Head head;\n  VariantStorage<Tail…>\
  \ tail;\n};\n\ntemplate<>\nunion VariantStorage<> {\n};\n```\n\n在这里，联合体保证了足够的尺寸和对齐方式，允许\
  \ `Types` 中的任何一个类型在任何给定时间被存储。遗憾的是，这个联合体本身很难处理，因为我们实现 `Variant` 时将使用的大多数技术都会使用继承，而联合体是不允许使用继承的。\n\
  \n相反，我们选择了变体存储的低级表示：一个足够容纳任何类型且对任何类型都具有适当对齐方式的字符数组，我们将其用作存储激活值的缓冲区。`VariantStorage`\
  \ 类模板实现了这个缓冲区以及带一个判别器（discriminator）：\n\n点击此处查看代码图像\n\n`variant/variantstorage.hpp`\n\
  \n```cpp\n#include <new> // 用于 std::launder()\n\ntemplate<typename… Types>\nclass\
  \ VariantStorage {\n  using LargestT = LargestType<Typelist<Types…>>;\n  alignas(Types…)\
  \ unsigned char buffer[sizeof(LargestT)];\n  unsigned char discriminator = 0;\n\n\
  public:\n  unsigned char getDiscriminator() const { return discriminator; }\n  void\
  \ setDiscriminator(unsigned char d) { discriminator = d; }\n  void* getRawBuffer()\
  \ { return buffer; }\n  const void* getRawBuffer() const { return buffer; }\n  template<typename\
  \ T>\n    T* getBufferAs() { return std::launder(reinterpret_cast<T*>(buffer));\
  \ }\n  template<typename T>\n    T const* getBufferAs() const {\n      return std::launder(reinterpret_cast<T\
  \ const*>(buffer));\n    }\n};\n```\n\n在这里，我们使用了在第 552 页第 24.2.2 节中开发的 `LargestType`\
  \ 元编程来计算缓冲区的大小，确保它足够容纳任何值类型。同样，`alignas` 的包展开确保缓冲区将具有适用于任何值类型的对齐方式。我们计算的缓冲区本质上是上面联合体的机器表示。我们可以通过\
  \ `getBuffer()` 获取缓冲区的指针，并通过显式类型转换、放置 new（创建新值）和显式析构（销毁我们创建的值）来操作存储。如果你不熟悉 `getBufferAs()`\
  \ 中使用的 `std::launder()`，目前只需要知道它返回未修改的参数即可；我们将在讨论我们的 `Variant` 模板的赋值运算符时再解释它的作用（参见第\
  \ 617 页第 26.4.3 节）。\n\n## 26.2 设计\n\n现在我们已经有了变体存储问题的解决方案，现在来设计 `Variant` 类型本身。与\
  \ `Tuple` 类型一样，我们使用继承为 `Types` 列表中每个类型提供行为。然而，与 `Tuple` 不同，这些基类不包含存储。相反，每个基类都使用了第\
  \ 495 页第 21.2 节中讨论的*奇异递归模板模式*（CRTP），通过最派生类型来访问共享的变体存储。\n\n下面定义的 `VariantChoice`\
  \ 类模板提供了当变体的激活值为（或将是）类型 `T` 时，对缓冲区进行操作所需的核心操作：\n\n点击此处查看代码图像\n\n`variant/variantchoice.hpp`\n\
  \n```cpp\n#include \"findindexof.hpp\"\ntemplate<typename T, typename… Types>\n\
  class VariantChoice {\n  using Derived = Variant<Types…>;\n  Derived& getDerived()\
  \ { return *static_cast<Derived*>(this); }\n  Derived const& getDerived() const\
  \ {\n    return *static_cast<Derived const*>(this);\n  }\nprotected:\n  // 计算用于此类型的判别器\n\
  \  constexpr static unsigned Discriminator =\n    FindIndexOfT<Typelist<Types…>,\
  \ T>::value;\npublic:\n  VariantChoice() { }\n  VariantChoice(T const&); // 参见 variantinit.hpp\n\
  \  VariantChoice(T&&); // 参见 variantinit.hpp\n  bool destroy(); // 参见 variantdestroy.hpp\n\
  \  Derived& operator=(T const&); // 参见 variantassign.hpp\n  Derived& operator=(T&&);\
  \ // 参见 variantassign.hpp\n};\n```\n\n模板参数 `Types` 将包含 `Variant` 中的所有类型。它允许我们形成\
  \ `Derived` 类型（用于 CRTP），并提供 `getDerived()` 操作。`Types` 的另一个有趣用法是在 `Types` 列表中查找特定类型\
  \ `T` 的位置，我们通过元函数 `FindIndexOfT` 实现这一点：\n\n点击此处查看代码图像\n\n`variant/findof.hpp`\n\n\
  ```cpp\ntemplate<typename List, typename T, unsigned N = 0,\n  bool Empty = Empty<List>::value>\n\
  struct FindIndexOfT;\n\n// 递归情况\ntemplate<typename List, typename T, unsigned N>\n\
  struct FindIndexOfT<List, T, N, false>\n  : public IfThenElse<std::is_same<Front<List>,\
  \ T>::value,\n    std::integral_constant<unsigned, N>,\n    FindIndexOfT<PopFront<List>,\
  \ T, N+1>> {};\n\n// 基础情况\ntemplate<typename List, typename T, unsigned N>\nstruct\
  \ FindIndexOfT<List, T, N, true> {};\n```\n\n该索引值用于计算对应于 `T` 的判别器值；稍后我们将返回特定的判别器值。\n\
  \n`Variant` 的骨架如下，展示了 `Variant`、`VariantStorage` 和 `VariantChoice` 之间的关系：\n\n点击此处查看代码图像\n\
  \n`variant/variant-skel.hpp`\n\n```cpp\ntemplate<typename… Types>\nclass Variant\n\
  \  : private VariantStorage<Types…>,\n   private VariantChoice<Types, Types…>\n\
  {\n  template<typename T>\n  friend class VariantChoice;\n  …\n};\n```\n\n如前所述，每个\
  \ `Variant` 只有一个共享的 `VariantStorage` 基类。此外，它还有若干 `VariantChoice` 基类，这些基类是由以下嵌套展开产生的（参见第\
  \ 205 页第 [12.4.4]节）：\n\n点击此处查看代码图像\n\n`VariantChoice<Types, Types……`\n\n在此例中我们有两个展开：外部展开通过展开对\
  \ `Types` 的引用，为 `Types` 中的每个类型 `T` 生成一个 `VariantChoice` 基类。内部展开（展开 `Types` 的第二次出现）还将\
  \ `Types` 中的所有类型传递给每个 `VariantChoice` 基类。对于一个\n\n点击此处查看代码图像\n\n`Variant<int, double,\
  \ std::string>`\n\n这产生了以下 `VariantChoice` 基类集合：\n\n点击此处查看代码图像\n\n`VariantChoice<int,\
  \ int, double, std::string>,`\n\n`VariantChoice<double, int, double, std::string>,`\n\
  \n`VariantChoice<std::string, int, double, std::string>`\n\n\n\n\n这三个基类的判别符值分别为\
  \ 1、2 和 3。当变体存储器中的 `discriminator` 成员与特定 `VariantChoice` 基类的判别符匹配时，由该基类负责管理活动值。\n\
  \n判别符值 0 预留给变体不包含任何值的情况，这是一个异常状态，只有在赋值过程中抛出异常时才会被观察到。在 `Variant` 的整个讨论中，我们会小心处理判别符值为\
  \ 0 的情况（并在适当时设置它），但关于这种情况的讨论留在了第 613 页的第 26.4.3 节。\n\n`Variant` 的完整定义列在下一页上。接下来的章节将描述\
  \ `Variant` 中每个成员的实现。\n\n点击此处查看代码图像\n\n点击此处查看代码图像\n\n`variant/variant.hpp`\n\n```cpp\n\
  template<typename… Types>\nclass Variant\n  : private VariantStorage<Types…>,\n\
  \   private VariantChoice<Types, Types…>…\n{\n  template<typename T, typename… OtherTypes>\n\
  \    friend class VariantChoice;\n  public:\n  template<typename T> bool is() const;\
  \           // 查看 variantis.hpp\n  template<typename T> T& get() &;            \
  \    // 查看 variantget.hpp\n  template<typename T> T const& get() const&;      //\
  \ 查看 variantget.hpp\n  template<typename T> T&& get() &&;              // 查看 variantget.hpp\n\
  \  // 查看 variantvisit.hpp:\n  template<typename R = ComputedResultType, typename\
  \ Visitor>\n    VisitResult<R, Visitor, Types&…> visit(Visitor&& vis) &;\n  template<typename\
  \ R = ComputedResultType, typename Visitor>\n    VisitResult<R, Visitor, Types const&…>\
  \ visit(Visitor&& vis) const&;\n  template<typename R = ComputedResultType, typename\
  \ Visitor>\n    VisitResult<R, Visitor, Types&&…> visit(Visitor&& vis) &&;\n  using\
  \ VariantChoice<Types, Types…>::VariantChoice…;\n  Variant();                  \
  \                    // 查看 variantdefaultctor.hpp\n  Variant(Variant const& source);\
  \                 // 查看 variantcopyctor.hpp\n  Variant(Variant&& source);      \
  \                // 查看 variantmovector.hpp\n  template<typename… SourceTypes>\n\
  \    Variant(Variant<SourceTypes…> const& source);  // variantcopyctortmpl.hpp\n\
  \  template<typename… SourceTypes>\n    Variant(Variant<SourceTypes…>&& source);\n\
  \  using VariantChoice<Types, Types…>::operator=…;\n  Variant& operator= (Variant\
  \ const& source);      // 查看 variantcopyassign.hpp\n  Variant& operator= (Variant&&\
  \ source);\n  template<typename… SourceTypes>\n    Variant& operator= (Variant<SourceTypes…>\
  \ const& source);\n  template<typename… SourceTypes>\n    Variant& operator= (Variant<SourceTypes…>&&\
  \ source);\n  bool empty() const;\n  ~Variant() { destroy(); }\n  void destroy();\
  \                                 // 查看 variantdestroy.hpp\n};\n```\n\n### 26.3\
  \ 值查询与提取\n\n对 `Variant` 类型最基础的查询是询问其活动值是否为特定类型 `T`，以及在类型已知时访问该活动值。下面定义的 `is()` 成员函数用于判断变体当前是否存储类型为\
  \ `T` 的值：\n\n点击此处查看代码图像\n\n`variant/variantis.hpp`\n\n```cpp\ntemplate<typename…\
  \ Types>\ntemplate<typename T>\nbool Variant<Types…>::is() const\n{\n  return this->getDiscriminator()\
  \ == VariantChoice<T, Types…>::Discriminator;\n}\n```\n\n给定一个变体 `v`，`v.is<int>()`\
  \ 将确定 `v` 的活动值是否为 `int` 类型。该检查是直观的，通过将变体存储器中的 `discrimin` 与相应的 `VariantChoice` 基类的\
  \ `Discriminator` 值进行比较。如果我们要查找的类型 (`T`) 不在列表中，`VariantChoice` 基类将无法实例化，因为 `FindIndexOfT`\
  \ 不包含 `value` 成员，导致 `is<T>()` 发生（故意的）编译失败。这防止了用户错误，即用户请求一个变体中不可能存储的类型。\n\n`get()`\
  \ 成员函数提取对所存储值的引用。它必须提供要提取的类型（例如 `v.get<int>()`），并且仅在变体的活动值是该类型时才有效：\n\n点击此处查看代码图像\n\
  \n`variant/variantget.hpp`\n\n```cpp\n#include <exception>\nclass EmptyVariant :\
  \ public std::exception {\n};\n\ntemplate<typename… Types>\ntemplate<typename T>\n\
  T& Variant<Types…>::get() & {\n  if (empty()) {\n    throw EmptyVariant();\n  }\n\
  \  assert(is<T>());\n  return *this->get();\n}\n```\n\n当变体不存储值时，`get()` 会抛出 `EmptyVariant`\
  \ 异常。关于判别符为 0 的情况，请参见第 613 页的第 26.4.3 节。\n\n### 26.4 元素的、赋值与析构\n\n每个 `VariantChoice`\
  \ 基类负责处理当活动值为类型 `T` 时的初始化、赋值和析构。\n\n#### 26.4.1 初始化\n\n我们从变体之一的类型的值开始初始化。例如，从 `double`\
  \ 初始化 `Variant<int, double, string>`。这是通过接受类型 `T` 值的 `VariantChoice` 构造函数实现的：\n\n\
  点击此处查看代码图像\n\n`variant/variantinit.hpp`\n\n```cpp\n#include <utility> // 用于 std::move()\n\
  template<typename T, typename… Types>\nVariantChoice<T, Types…>::VariantChoice(T\
  \ const& value) {\n  // 将值放入缓冲区并设置类型判别符：\n  new(getDerived().getRawBuffer()) T(value);\n\
  \  getDerived().setDiscriminator(Discriminator);\n}\n\ntemplate<typename T, typename…\
  \ Types>\nVariantChoice<T, Types…>::VariantChoice(T&& value) {\n  // 将移动的值放入缓冲区并设置类型判别符：\n\
  \  new(getDerived().getRawBuffer()) T(std::move(value));\n  getDerived().setDiscriminator(Discriminator);\n\
  }\n```\n\n在每情况下，构造函数使用 CRTP 操作 `getDerived()` 访问共享缓冲区，然后执行放置 `new` 以一个类型为 `T` 的新值。第一个构造函数构造传入的值，而第二个构造函数移动构造传入的值。之后，构造函数设置判别符值以指示变体存储器的（动态）类型。\n\
  \n我们的最终目标是能够从其任何类型的值初始化变体，即使考虑到隐式转换。例如：\n\n点击此处查看代码图像\n\n```cpp\nVariant<int, double,\
  \ string> v(\"hello\"); // 隐式转换为 string\n```\n\n为了实现这一点，我们通过引入使用 声明将 `VariantChoice`\
  \ 构造函数继承到 `Variant` 自身：\n\n点击此处查看代码图像\n\n```cpp\nusing VariantChoice<Types, Types…>::VariantChoice…;\n\
  ```\n\n实际上，此使用 声明产生了了从 `Types` 中每个类型 `T` 拷贝或移动的 `Variant` 构造函数。对于 `Variant<int,\
  \ double, string>`，构造函数实际上为：\n\nVariant(int const&);\n\nVariant(int&&);\n\nVariant(double\
  \ const&);\n\nVariant(double&&);\n\nVariant(string const&);\n\nVariant(string&&);\n\
  \n#### 26.4.2 析构\n\n\n\n\n\n当 `Variant` 初始化时，一个值会被构造到它的缓冲区中。`destroy` 操作负责处理该值的销毁：\n\
  \n点击此处查看代码图片\n\n`variant/variantchoicedestroy.hpp`\n\n```cpp\ntemplate<typename\
  \ T, typename… Types>\nbool VariantChoice<T, Types…>::destroy() {\n  if (getDerived().getDiscriminator()\
  \ == Discriminator) {\n    // 如果类型匹配，调用定位析构：\n    getDerived().template getBufferAs<T>()->~T();\n\
  \    return true;\n  }\n  return false;\n}\n```\n\n当判别符（discriminator）匹配时，我们通过调用相应的析构函数\
  \ `->~T()` 来显式地销毁缓冲区的内容。\n\n`VariantChoice::destroy()` 操作仅在判别符匹配时才有用。然而，我们通常希望不考虑当前激活的类型而销毁\
  \ variant 中存储的值。因此，`Variant::destroy()` 会调用其基类中*所有* `VariantChoice::destroy()` 操作：\n\
  \n点击此处查看代码图片\n\n`variant/variantdestroy.hpp`\n\n```cpp\ntemplate<typename… Types>\n\
  void Variant<Types…>::destroy() {\n  // 在每个 VariantChoice 基类上调用 destroy()；最多有一个调用会成功：\n\
  \  bool results[] = {\n    VariantChoice<Types, Types…>::destroy().().\n  };\n \
  \ // 表明 variant 不存储任何值\n  this->setDiscriminator(0);\n}\n```\n\n`results` 初始化器中的包展开（pack\
  \ expansion）确保了在每个 `VariantChoice` 基类上都调用 `destroy`。这些调用中最多有一个会实际成功（即匹配判别符的那一个），使\
  \ variant 变为空。通过将判别符值设置为 0 来指示空状态。\n\n数组 `results` 本身仅用于提供使用初始化列表的上下文；其实际值被忽略了。在\
  \ C++17 中，我们可以使用折叠表达式（在第 [207] 页的第 12.4.6 节讨论）来消除对这个额外变量的需求：\n\n点击此处查看代码图片\n\n`variant/variantdestroy17.hpp`\n\
  \n```cpp\ntemplate<typename… Types>\nvoid Variant<Types…>::destroy()\n{\n  // 在每个\
  \ VariantChoice 基类上调用 destroy()；最多有一个调用会成功：\n  (VariantChoice<Types, Types…>::destroy()\
  \ , …);\n  // 表明 variant 不存储任何值\n  this->setDiscriminator(0);\n}\n```\n\n### 26.4.3\
  \ 赋值\n\n赋值建立在初始化和销毁的基础上，正如赋值运算符所示：\n\n点击此处查看代码图片\n\n`variant/variantchoiceassign.hpp`\n\
  \n```cpp\ntemplate<typename T, typename… Types>\nauto VariantChoice<T, Types…>::operator=\
  \ (T const& value) -> Derived& {\n  if (getDerived().getDiscriminator() == Discriminator)\
  \ {\n    // 赋值相同类型的新值：\n    getDerived().template getBufferAs<T>() = value;\n  }\n\
  \  else {\n    // 赋值不同类型的新值：\n    getDerived().destroy();             // 对所有类型尝试\
  \ destroy()\n    new(getDerived().getRawBuffer()) T(value); // 放置新值\n    getDerived().setDiscriminator(Discriminator);\n\
  \  }\n  return getDerived();\n}\n\ntemplate<typename T, typename… Types>\nauto VariantChoice<T,\
  \ Types…>::operator= (T&& value) -> Derived& {\n  if (getDerived().getDiscriminator()\
  \ == Discriminator) {\n    // 赋值相同类型的新值：\n    getDerived().template getBufferAs<T>()\
  \ = std::move(value);\n  }\n  else {\n    // 赋值不同类型的新值：\n    getDerived().destroy();\
  \             // 对所有类型尝试 destroy()\n    new(getDerived().getRawBuffer()) T(value);\
  \ // 放置新值\n    getDerived().setDiscriminator(Discriminator);\n  }\n  return getDerived();\n\
  }\n```\n\n\n\nC++ 编译器的通常旨在生成高性能代码，而提高生成代码性能的首要机制可能是避免反复从内存到寄存器之间拷贝数据。为了良好地实现这一点，编译器必须做出一些假设，其中一个假设是某些类型的数据在它们的生命周期内是不可变的。这包括\
  \ `const` 数据、引用（可以初始化，但之后不能修改）以及存储在多态对象中的某些簿记数据，这些数据被用于派发虚函数、定位虚基类，以及处理 `typeid`\
  \ 和 `dynamic_cast` 算符。\n\n我们上述两步走赋值程序的问题在于，它会悄不知不觉地在同一位置结束一个对象的生命周期并启动另一个对象的生命周期，而这种方式编译器可能无法识别。因此，编译器可能会假设它从\
  \ `Variant` 对象之前的状态获取的值仍然有效，但实际上，通过放置新构造（`placement new`）进行的初始化已使其失效。如果不进行缓解，最终结果将是使用带有不可变数据成员的\
  \ `Variant` 的程序在为了获得性能而编译时，可能会产生无效结果。此类 bug 通常非常难以追踪（部分是因为它们发生频率极低，部分是因为它们在源代码中并不可直观）。\n\
  \n自 C++17 以来，解决此问题的方案是通过 `std::launder()` 访问新对象的地址，它仅仅返回其参数，但它会导致编译器识别出结果地址指向的对象可能与编译器假设传递给\
  \ `std::launder()` 的参数所不同。然而，请注意，`std::launder()` 仅修复它返回的地址，而不是传递给 `std::launder()`\
  \ 的参数，因为编译器是基于表达式进行推理的，而不是实际地址（因为这些地址在运行时之前不存在）。因此，在用放置新构造构建新值后，我们必须确保随后的每次访问都使用经过“清洗（laundered）”的数据。这就是为什么我们总是对\
  \ `Variant` 缓冲区的指针进行“清洗”。有些方法可以做得更好一点（例如添加一个额外的指针成员来引用缓冲区，并在每次使用放置新构造赋值新值后获取“清洗过的”地址），但这些方法会使代码变得难以维护。只要我们通过\
  \ `getBufferAs()` 成员独占地访问缓冲区，我们的方法就是简单且正确的。\n\n`std::launder()` 的情况并不完全如意：它非常微妙，难以察觉（例如，直到书即将印刷前我们才注意到它），而且难以缓解（即\
  \ `std::launder()` 并不易于使用）。因此，委员会的几位成员要求投入更多工作来寻找更满意的解决方案。请参见 [*JosuttisLaunder*]\
  \ 获取关于该问题的详细描述。\n\n## 26.5 Visitors（访问）\n\n`is()` 和 `get()` 成员函数允许我们检查活动值是否为特定类型，并访问该类型的值。然而，检查\
  \ variant 中所有可能的类型会迅速退化为冗长的 `if` 语句链。例如，以下代码打印了名为 `v` 的 `Variant<int, double, string>`\
  \ 的值：\n\n```cpp\nif (v.is<int>()) {\n    std::cout << v.get<int>();\n}\nelse if\
  \ (v.is<double>()) {\n    std::cout << v.get<double>();\n}\nelse {\n    std::cout\
  \ << v.get<string>();\n}\n```\n\n将此泛化以打印任意 variant 中存储的值，需要一个递归实例化的函数模板以及一个辅助工具。例如：\n\
  \n```cpp\nvariant/printrec.cpp\n#include \"variant.hpp\"\n#include <iostream>\n\n\
  template<typename V, typename Head, typename… Tail>\nvoid printImpl(V const& v)\n\
  {\n  if (v.template is<Head>()) {\n    std::cout << v.template get<Head>();\n  }\n\
  \  else if constexpr (sizeof…(Tail) > 0) {\n    printImpl<V, Tail…>(v);\n  }\n}\n\
  \ntemplate<typename… Types>\nvoid print(Variant<Types…> const& v)\n{\n  printImpl<Variant<Types…>,\
  \ Types…>(v);\n}\n\nint main() {\n  Variant<int, short, float, double> v(1.5);\n\
  \  print(v);\n}\n```\n\n对于一个相对简单的操作来说，这已经是大量的代码了。为了简化这一点，我们通过为 `Variant` 扩展一个 `visit()`\
  \ 操作来反过来解决问题。客户端随后传入一个访问者函数对象，其 `operator()` 将被活动值调用。由于活动值可以是 variant 的任何潜在类型之一，因此该\
  \ `operator()` 可能是重载的，或者本身是一个函数模板。例如，一个泛型 lambda 提供了一个模板化的 `operator()`，允许我们简洁地表示对\
  \ variant `v` 的打印操作：\n\n```cpp\nv.visit([](auto& value) {\n    std::cout << value;\n\
  });\n```\n\n这个泛型 lambda 大约等同于以下对象，对于尚未支持 lambda 的编译器可能很有用：\n\n```cpp\nclass Printer\
  \ {\npublic:\n    template<typename T>\n    void operator()(T& value) const {\n\
  \        std::cout << value;\n    }\n};\n```\n\n`visit()` 的核心与 `print` 操作类似：它遍历\
  \ `Variant` 的类型，检查值是否具有该类型，然后在找到它后执行操作。\n\n```cpp\nvariant/visit.hpp\ntemplate<typename\
  \ R, typename V, typename Head, typename… Tail>\nR variantImpl(V&& variant, Visitor&&\
  \ vis, Typelist<Head, Tail...>) {\n  if (variant.template is<Head>()) {\n    return\
  \ static_cast<R>(std::forward<Visitor>(vis)(std::forward<V>(variant).template get<Head>()));\n\
  \  }\n  else if constexpr (sizeof…(Tail) > 0) {\n    return variantImpl<R>(std::forward<V>(variant),\
  \ std::forward(vis), Typelist<Tail...>());\n  }\n  else {\n    throw EmptyVariant();\n\
  \  }\n}\n```\n\n`variantImpl()` 是一个非成员函数模板，具有多个模板参数。模板参数 `R` 描述了访问的结果类型，我们将返回它。`V`\
  \ 是 variant 的类型，`Visitor` 是访问者的类型。`Head` 和 `Tail` 用于分解类型以实现递归。\n\n第一个 `if` 执行（运行时）检查以确定活动值是否为\
  \ `Head` 类型：如果是，则通过 `get<Head>()` 从 variant 中提取值并传递给访问者，从而结束递归。第二个 `if` 在还有更多类型需要考虑时执行递归。如果没有匹配的类型，则\
  \ variant 不包含值，此时实现抛出 `EmptyVariant` 异常。\n\n除了 `VisitResult` 提供的结果计算外（将在下一节中讨论），`visit()`\
  \ 的实现非常直观：\n\n```cpp\nvariant/variantvisit.hpp\ntemplate<typename… Types>\ntemplate<typename\
  \ R, typename Visitor>\nVisitResult<R, Visitor, Types&...>\nVariant<Types…>::visit(Visitor&&\
  \ vis)& {\n  using Result = VisitResult<R, Visitor, Types&...>;\n  return variantImpl<Result>(*this,\
  \ std::forward<Visitor>(vis), Typelist<Types...>());\n}\n```\n\n\n\n\n\n```cpp\n\
  VisitResult<R, Visitor, Types const&…>\n\nVariant<Types…>::visit(Visitor&& vis)\
  \ const& {\n  using Result = VisitResult<R, Visitor, Types const &…>;\n  return\
  \ variantVisitImpl<Result>(*this, std::forward<Visitor>(vis),\n                \
  \                  Typelist<Types…>());\n}\n\ntemplate<typename… Types>\ntemplate<typename\
  \ R, typename Visitor>\nVisitResult<R, Visitor, Types&&…>\nVariant<Types…>::visit(Visitor&&\
  \ vis) && {\n  using Result = VisitResult<R, Visitor, Types&&…>;\n  return variantVisitImpl<Result>(std::move(*this),\n\
  \                                   std::forward<Visitor>(vis),\n              \
  \                     Typelist<Types…>());\n}\n```\n\n这些实现直接委托给 `variantVisitImpl`，传递变体本身、转发访问者（visitor），并提供完整的类型列表。这三种实现之间的唯一区别在于它们是将变体本身作为\
  \ `Variant&`、`Variant const&` 还是 `Variant&&` 进行传递。\n\n### 26.5.1 访问结果类型 (Visit Result\
  \ Type)\n\n`visit()` 的结果类型仍然是一个谜题。给定的访问者可能具有不同的 `operator()` 重载，从而产生不同的结果类型；或者是一个结果类型取决于其参数类型的模板化\
  \ `operator()`，亦或是这两者的组合。例如，考虑以下泛型 lambda 表达式：\n\n```cpp\n[](auto const& value)\
  \ {\n  return value + 1;\n}\n```\n\n此 lambda 表达式的结果类型取决于输入类型：给定一个 `int`，它将产生 `int`；但给定一个\
  \ `double`，它将产生 `double`。如果将这个泛型 lambda 表达式传递给 `Variant<int, double>` 的 `visit()`\
  \ 操作，结果应该是什么？\n\n没有唯一的标准答案，因此我们的 `visit()` 操作允许显式提供结果类型。例如，人们可能希望将结果捕获到另一个 `Variant<int,\
  \ double>` 中。可以通过作为第一个模板参数显式地为 `visit()` 指定结果类型：\n\n点击此处查看代码图片\n\n```cpp\nv.visit<Variant<int,\
  \ double>>([](auto const& value) {\n  return value + 1;\n});\n```\n\n当没有通用的解决方案时，显式指定结果类型的能力至关重要。然而，在所有情况下都要求显式指定结果类型可能会非常冗长。因此，`visit()`\
  \ 通过默认模板参数和简单元编程的结合提供了这两种选项。回想 `visit()` 的声明：\n\n点击此处查看代码图片\n\n```cpp\ntemplate<typename\
  \ R = ComputedResultType, typename Visitor>\n  VisitResult<R, Visitor, Types&…>\
  \ visit(Visitor&& vis) &;\n```\n\n模板参数 `R`（我们在上面的示例中显式指定的）也有一个默认参数，因此它不需要总是显式指定。该默认参数是一个不完全的哨兵类型（sentinel\
  \ type）`ComputedResultType`：\n\n```cpp\nclass ComputedResultType;\n```\n\n为了计算其结果类型，`visit`\
  \ 将所有的模板参数传递给 `VisitResult`，`VisitResult` 是一个别名模板，提供了访问一个新的类型特性（type trait） `VisitResultT`\
  \ 的接口：\n\n点击此处查看代码图片\n\n*variant/variantvisitresult.hpp*\n\n// 一个显式提供的访问者结果类型：\n\
  \n```cpp\ntemplate<typename R, typename Visitor, typename… ElementTypes>\nclass\
  \ VisitResultT\n{\n  public:\n  using Type = R;\n};\n\ntemplate<typename R, typename\
  \ Visitor, typename… ElementTypes>\nusing VisitResult =\n  typename VisitResultT<R,\
  \ Visitor, ElementTypes…>::Type;\n```\n\n`VisitResultT` 的主定义处理 `R` 的参数已被显式指定的情况，此时\
  \ `Type` 被定义为 `R`。当 `R` 接收到其默认参数 `ComputedResultType` 时，应用一个单独的部分特化：\n\n点击此处查看代码图片\n\
  \n```cpp\ntemplate<typename R, typename Visitor, typename… ElementTypes>\nclass\
  \ VisitResultT<ComputedResultType, Visitor, ElementTypes>\n```\n\n该部分特化负责处理这种情况，并且是下一节的主题。\n\
  \n### 26.5.2 共同结果 (Common Result)\n\n当调用一个可能为每种类型产生不同类型的访问者时，我们如何将这些类型合并为一个单一结果？存在一些明显的情况——如果访问者对每个元素返回相同的类型，那么该类型应为结果类型。例如，如果\
  \ `x` 的类型为 `int` 而 `y` 的类型为 `double`，则共同类型是 `double`，因为 `int` 会提升为 `double`。\n\n\
  点击此处查看代码图片\n\n*variant/variantype.hpp*\n\n```cpp\ntemplate<typename T, typename\
  \ U>\nclass CommonType\n{\n  public:\n  using Type = decltype(declval()());\n};\n\
  \ntemplate<typename T, typename U>\nusing CommonType = typename CommonType<T, U>::Type;\n\
  ```\n\n公共类型的概念扩展到集合：共同类型是一个集合中所有元素都可以转换的类型，或者如果类型不兼容则为错误。对于我们的变体，我们想要计算结果类型的共同类型。\n\
  \n点击此处查看代码图片\n\n*variant/variantresult.hpp*\n\n```cpp\n#include \"accumulate.hpp\"\
  \n#include \"variantype.hpp\"\n\n// 使用 T 值调用 visitor 生成的结果类型\ntemplate<typename\
  \ Visitor, typename T>\nusing VisitResult = decltype(declval<Visitor>()());\n```\n\
  \n`VisitResult` 的计算分为两个阶段。首先，`VisitResult` 计算使用 T 值调用访问者产生的结果类型。此元函数应用于给定的每个类型以确定所有的结果类型，并将结果捕获在类型列表\
  \ `ResultTypes` 中。\n\n接下来，计算使用第 24.2.6 节（第 560 页）描述的 `Accumulate` 算法应用于结果类型。其初始值（`Accumulate`\
  \ 的第三个参数）是第一个结果类型，随后通过 `CommonTypeT` 与 `ResultTypes` 类型列表的后续值进行合并。最终结果是所有结果类型都可以转换的共同类型，如果结果类型不兼容则为错误。\n\
  \n从 C++11 开始，标准库提供了一个相应的类型特性 `std::common_type<>`，它使用这种方法产生任意数量通过类型的共同类型（见第 D.5\
  \ 节，第 732 页），有效地结合了 `CommonTypeT` 和 `Accumulate`。\n\n点击此处查看代码图片\n\n*variant/variantvisitstd.hpp*\n\
  \n```cpp\ntemplate<typename Visitor, typename… ElementTypes>\nclass VisitResultT<ComputedResultType,\
  \ Visitor, ElementTypes…>\n{\n  public:\n  using Type = std::common_type_t<VisitElementResult<Visitor,\
  \ ElementTypes>…>;\n};\n```\n\n\n\n以下示例程序打印通过传入泛型 lambda 表达式产生的类型，该 lambda 表达式对其获取的值加\
  \ `1`：\n\n点击此处查看代码图片\n\n`variant/visit.cpp`\n\n```cpp\n#include \"variant.hpp\"\n\
  \n#include <iostream>\n\n#include <typeinfo>\n\nint main()\n{\n  Variant<int, short,\
  \ double, float> v(1.5);\n  auto result = v.visit([](auto const& value) {\n    \
  \                          return value + 1;\n                        });\n  std::cout\
  \ << typeid(result).name() <<’\\n’;\n}\n```\n\n该程序的输出将是 `double` 的 `type_info` 名称，因为这是所有结果类型都可以转换到的类型。\n\
  \n## 26.6 Variant 的初始化与赋值\n\nVariant 可以通过多种方式进行初始化和赋值，包括默认构造、拷贝构造、移动构造，以及拷贝赋值和移动赋值。本节详细介绍了这些\
  \ `Variant` 操作。\n\n#### 默认初始化\n\nVariant 是否应该提供默认构造函数？如果没有提供，Variant 可能会变得非常难以使用，因为将始终构造出一个初始值（即使该值在程序逻辑上没有意义）。如果它提供了默认构造函数，其语义应该是怎样的呢？\n\
  \n一种可能的语义是让默认初始化没有值，由判别符 0 表示。然而，这种空 Variant 通常没有用处（例如，无法对它们进行访问或找到任何值），且将此设为默认初始化会将空\
  \ Variant 的异常状态（在第 63 页的第 26.4 节描述）提升为常见状态。\n\n或者，默认构造函数可以构造某种类型的值。对于我们的 variant，我们遵循\
  \ C++17 中 `std::variant` 的语义，并默认构造类型列表中第一个类型的值：\n\n`variant/defaultctor.hpp`\n\n\
  ```cpp\ntemplate<typename… Types>\nVariant<Types…>::Variant() {\n*this = Front<Typelist<Types>>();\n\
  }\n```\n\n这种方法简单且可预测，并避免了在大多数用例中引入空 Variant。这种行为可以通过此程序看到：\n\n`variant/defaultctor.cpp`\n\
  \n```cpp\n#include \"variant.hpp\"\n#include <iostream>\n\nint main()\n{\n  Variant<int,\
  \ double> v;\n  if (v.is<int>()) {\n    std::cout << \"Default-constructed v stores\
  \ the int \" << v.get<int>() <<’\\n’;\n  }\n  Variant<double, int> v2;\n  if (v2.is<double>())\
  \ {\n    std::cout << \"Default-constructed v2 stores the double \" << v2.get<double>()\
  \ <<’\\n’;\n  }\n}\n```\n\n产生以下输出：\n\nDefault-constructed v stores the int 0\nDefault-constructed\
  \ v2 stores the double 0\n\n#### 拷贝/移动初始化\n\n拷贝和移动初始化更有趣。为了拷贝源 variant，我们需要确定它当前存储的类型，将该值拷贝构造到缓冲区，并设置该判别符。幸运的是，`visit()`\
  \ 处理了源 variant 活动值的解码，而继承自 `VariantChoice` 的拷贝赋值运算符会将值拷贝构造到缓冲区，从而实现了紧凑的实现：\n\n`variant/variantcopyctor.hpp`\n\
  \n```cpp\ntemplate<typename… Types>\nVariant<Types…>::Variant(Variant const& source)\
  \ {\n  if (!source.empty()) {\n    source.visit([](auto const& value) {\n      *this\
  \ = value;\n    });\n  }\n}\n```\n\n移动构造函数也类似，区别仅在于访问源 variant 时使用了 `std::move`\
  \ 并从源值进行移动赋值：\n\n`variant/variantmovector.hpp`\n\n```cpp\ntemplate<typename… Types>\n\
  Variant<Types…>::Variant(Variant&& source) {\n  if (!source.empty()) {\n    std::move(source).visit([](auto&&\
  \ value) {\n      *this = std::move(value);\n    });\n  }\n}\n```\n\n基于访问器的实现中一个特别有趣的点是，它也适用于拷贝和移动操作的模板形式。例如，模板拷贝构造函数可以定义如下：\n\
  \n`variant/variantcopyctmpl.hpp`\n\n```cpp\ntemplate<typename… Types>\ntemplate<typename…\
  \ SourceTypes>\nVariant<Types…>::Variant(Variant<SourceTypes> const& source) {\n\
  \  if (!source.empty()) {\n    source.visit([](auto const& value) {\n      *this\
  \ = value;\n    });\n  }\n}\n```\n\n由于这段代码访问了源，对 `*this` 的赋值将发生在每种类型上。此赋值的重载解析将为每个源找到最合适的类型，并在需要执行隐式转换。以下示例说明了从不同类型的构造和赋值：\n\
  \n`variant/promote.cpp`\n\n```cpp\n#include \"variant.hpp\"\n#include <iostream>\n\
  #include <string>\n\nint main()\n{\n  Variant<short, float, char*> v1((short)123);\n\
  \  Variant<int, std::string, double> v2(v1);\n  std::cout << \"v2 contains the integer\
  \ \" << v2.get<int>() <<’\\n’;\n  v1 = 3.14f;\n  Variant<double, int, std::string>\
  \ v3(std::move(v1));\n  std::cout << \"v3 contains the double \" << v3.get<double>()\
  \ <<’\\n’;\n  v1 = \"hello\";\n  Variant<double, int, std::string> v4(std::move(v1));\n\
  \  std::cout << \"v4 contains the string \" << v4.get<std::string>() <<’\\n’;\n\
  }\n```\n\n从 `v1` 构造或赋值到 `v2` 或 `v3` 涉及整数提升（`short` 到 `int`）、浮点数提升（`float` 到 `double`）以及用户转换（`char*`\
  \ 到 `std::string`）。该程序的输出如下：\n\nv2 contains the integer 123\nv3 contains the double\
  \ 3.14\nv4 contains the string\n\n#### 赋值\n\n`Variant` 赋值运算符与上述拷贝和移动构造函数类似。这里仅演示拷贝赋值运算符：\n\
  \n`variant/variantcopyassign.hpp`\n\n```cpp\ntemplate<typename… Types>\nVariant<Types…>&\
  \ Variant<Types…>::operator= (Variant const& source) {\n  if (!source.empty()) {\n\
  \    source.visit([](auto const& value) {\n      *this = value;\n    });\n  }\n\
  \  else {\n    destroy();\n  }\n  return *this;\n}\n```\n\n唯一的有趣之处在于 `else` 分支：当源\
  \ variant 不包含值（由判别符 0 表示）时，我们销毁目标对象的值，隐式地将其判别符设为 0。\n\n\n\n\nAndrei Alexandrescu\
  \ 在系列文章 [`AlexandrescuDiscriminatedUnions`] 中详细探讨了判别联合（discriminated unions）。我们对\
  \ `Variant` 的处理依赖于一些相同的技术，例如用于原地存储的对齐缓冲区和用于提取值的访问（visitation）。某些差异源于基础语言：Andrei\
  \ 当时使用的是 C++98，因此例如，他无法使用变长模板或继承构造函数。Andrei 还花费了大量时间在计算对齐上，而 C++11 通过引入 `alignas`\
  \ 使这一操作变得轻而易举。最有趣的设计差异在于对区分符（discriminator）的处理：我们选择使用整型区分符来指示当前 variant 中存储的是哪种类型，而\
  \ Andrei 采用了一种“静态 vtable”方法，使用函数指针来构造、拷贝、查询和销毁底层元素类型。有趣的是，这种静态 vtable 方法作为开放式判别联合的优化技术更具影响力，例如\
  \ `FunctionPtr` 模板（在第 [519] 页的第 22.2 节中开发），并且它是 `std::function` 实现中消除虚函数使用的常用优化手段。Boost\
  \ 的 `any` 类型 [`BoostAny`] 是另一种开放式判别联合类型，它在 C++17 被标准库采纳为 `std::any`。\n\n随后，Boost\
  \ 库 [`Boost`] 引入了多种判别联合类型，包括一个影响了本章所开发的类型的 `variant` 类型 [`BoostVariant]`。Boost.Variant\
  \ [`BoostVariant`] 的设计文档包含了对 variant 赋值中异常安全性问题（称为“非空保证”）的引人入胜的讨论，以及解决该问题的各种并不完全完美的方案。当它在\
  \ C++17 被标准库采纳为 `std::variant` 时，非空保证被放弃了：通过允许 `std::variant` 状态在为其分配新值抛出异常时变为 `valueless_by_exception`，从而消除了为备份分配堆存储的需求，这种行为我们通过我们的空\
  \ variant 进行了建模。\n\n与我们的 `Variant` 模板不同，`std::variant` 允许多个相同的模板参数（例如 `std::variant<int,\
  \ int>`）。在 `Variant` 中启用该功能将需要我们的设计发生重大变化，包括添加一种方法来区分 `VariantChoice` 基类，以及一种用于替代第\
  \ [608] 页的第 26.2 节中描述的嵌套包展开的替代方案。\n\n本章描述的 variant `visit()` 操作在结构上与 Andrei Alexandrescu\
  \ 在 [`AlexandrescuAdHocVisitor`] 中描述的即时访问者模式（ad hoc visitor pattern）是一致的。Alexandrescu\
  \ 的即时访问者旨在简化检查指向某些公共基类的指针是否与一组已知的派生类（描述为类型列表，typel）相匹配的过程。该实现使用 `dynamic_cast` 来测试指针与类型列表中的每个派生类是否匹配，当找到匹配项时，使用该派生类指针调用访问者。\n\
  \n^(1) 注意，潜在类型列表在声明 `Variant` 的时候就是固定的，这意味着 `Variant` 是一个*闭式*判别联合。一个*开放式*判别联合允许存储在创建判别联合时尚未知的额外类型的值。第\
  \ 22 章 中讨论的 `FunctionPtr` 类可以被看作开放式判别联合的一种。\n\n^(2) 这种方法还有许多其他问题，例如隐含要求 `Types`\
  \ 中的所有类型都具有默认构造函数。\n\n^(3) 虽然我们没有选择，但我们本可以使用模板元编程来计算最大对齐，而不是使用 `alignas` 的包展开。无论哪种方式结果都是相同的，上述公式将对齐计算工作移到了编译器中。\n\
  \n^(4) 基类是 `private` 的，因为它们的存在不是公共接口的一部分。需要友元模板（friend template）来允许 `VariantChoice`\
  \ 中的 `asDerived()` 函数执行到 `Variant` 的向下类型转换。\n\n^(5) 仅通过类型 `T` 区分给定 `Variant` 的 `VariantChoice`\
  \ 基类的一个有趣效果是它防止了重复类型。`Variant<double, int, double>` 将产生编译错误，指示一个类不能直接继承自同一个基类（在这种情况下，是两次继承\
  \ `VariantChoice<double, double, int, double>`）。\n\n^(6) 此处构造的使用防止了我们的 `Variant`\
  \ 设计使用引用类型。这一局限性可以通过将引用封装在 `std::reference_wrapper` 等类中来解决。\n\n^(7) 在 `using` 声明中使用包展开（第\
  \ [65] 页的第 4.4.5 节）是在 C++17 中引入的。在 C++17 之前，需要继承这些构造函数。\n\n^(8) 情况在第 [613] 页的第 26.4\
  \ 节中详细讨论。\n\n^(9) 尽管在 lambda 中使用了赋值运算符（=`），但 `VariantChoice` 的实际实现将执行拷贝构造，因为 variant\
  \ 最初不存储任何值。\n\n# ## 表达式模板\n\n在本章中，我们探索了一种名为表达式模板（expression templates）的模板编程技术。它最初是为了支持数值数组类而发明的，这也是引入它的背景。\n\
  \n数值数组类支持对整个数组对象的数值操作。例如，可以将两个数组相加，结果中的元素是参数数组对应值之和。同样，整个数组可以与标量相乘，这意味着数组的每个元素都经过缩放。自然地，保留对内置标量类型非常熟悉的运算符符号是理想的：\n\
  \n```\nArray<double> x(1000), y(1000);\nx = 1.2*x + x*y;\n```\n\n对于严肃的数值计算人员来说，确保这些表达式以代码运行平台预期的效率执行至关重要。要通过本例中的紧凑运算符符号来实现这一点并非易事，但表达式模板将为我们提供帮助。\n\
  \n### 27.1 临时变量与拆分循环\n\n为了给表达式模板提供动机，让我们从一种直接（或可能是素的）实现实现数值数组操作的模板方法开始。一个基础数组模板可能如下（`SArray`\
  \ 代表 *简单数组*）：\n\n\n\n\n\n`exprtmpl/sarray1.hpp`\n\n```cpp\n#include <cstddef>\n\n\
  #include <cassert>\n\ntemplate<typename T>\nclass SArray {\n  public:\n    // 使用初始大小创建数组\n\
  \    explicit SArray (std::size_t s)\n     : storage(new T[s]), storage_size(s)\n\
  \        { init();\n    }\n    // 拷贝构造函数\n    SArray (SArray<T> const& orig)\n \
  \    : storage(new T[orig.size()]), storage_size(orig.size()) {\n        copy(orig);\n\
  \    }\n    // 析构函数：释放内存\n    ~SArray() {\n        delete[] storage;\n    }\n  \
  \  // 赋值运算符\n    SArray<T>& operator= (SArray<T> const& orig) {\n      if (&orig!=this)\
  \ {\n          copy(orig);\n      } return *this;\n    }\n    // 返回大小\n    std::size_t\
  \ size() const {\n      return storage_size;\n    }\n    // 常量和变量的下标运算符\n    T const&\
  \ operator[] (std::size_t idx) const {\n      return storage[idx];\n    }\n    T&\
  \ operator[] (std::size_t idx) {\n      return storage[idx];\n    }\n\n  protected:\n\
  \    // 使用默认构造函数初始化值\n    void init() {\n      for (std::size_t idx = 0; idx<size();\
  \ ++idx) {\n          storage[idx] = T();\n      }\n    }\n    // 拷贝另一个数组的值\n  \
  \  void copy (SArray<T> const& orig) {\n      assert(size()==orig.size());\n   \
  \   for (std::size_t idx = 0; idx<size(); ++idx) {\n          storage[idx] = orig.storage[idx];\n\
  \      }\n    }\n  private:\n    T*      storage;      // 元素的存储\n    std::size_t\
  \ storage_size; // 元素数量\n};\n```\n\n数值运算符可以如下编写：\n\n点击此处查看代码图片\n\n`exprtmpl/sarrayops1.hpp`\n\
  \n```cpp\n// 两个 SArray 的相加\ntemplate<typename T>\nSArray<T> operator+ (SArray<T>\
  \ const& a, SArray<T> const& b)\n{\n    assert(a.size()==b.size());\n    SArray<T>\
  \ result(a.size());\n    for (std::size_t k = 0; k<a.size(); ++k) {\n        result[k]\
  \ = a[k]+b[k];\n    }\n    return result;\n}\n// 两个 SArray 的乘法\ntemplate<typename\
  \ T>\nSArray<T> operator* (SArray<T> const& a, SArray<T> const& b)\n{\n    assert(a.size()==b.size());\n\
  \    SArray<T> result(a.size());\n    for (std::size_t k = 0; k<a.size(); ++k) {\n\
  \        result[k] = a[k]*b[k];\n    }\n    return result;\n}\n// 标量与 SArray 的乘法\n\
  template<typename T>\nSArray<T> operator* (T const& s, SArray<T> const& a)\n{\n\
  \    SArray<T> result(a.size());\n    for (std::size_t k = 0; k<a.size(); ++k) {\n\
  \        result[k] = s*a[k];\n    }\n    return result;\n}\n// SArray 与标量的乘法\n//\
  \ 标量与 SArray 的相加\n// SArray 与标量的相加 ...\n```\n\n可以编写这些以及其他运算符的许多其他版本，但这些版本已足够支持我们的示例：\n\
  \n点击此处查看代码图片\n\n`exprtmpl/sarray1.cpp`\n\n```cpp\n#include \"sarray1.hpp\"\n#include\
  \ \"sarrayops1.hpp\"\nint main()\n{\n    SArray<double> x(1000), y(1000);\n    …\n\
  \    x = 1.2*x + x*y;\n}\n```\n\n这种实现证明在两个方面是低效的：\n1. 每次运算符的应用（赋值除外）至少会创建一个临时数组（即在我们的示例中，至少创建了三个大小为\
  \ 1,000 的临时数组，假设编译器执行了所有临时变量消除）。\n2. 每次运算符的应用都需要对参数和结果进行额外的遍历（在我们的示例中，大约读取了 6,000\
  \ 个 `double`，并大约写入了 4,000 个 `double`，假设生成了三个临时 `SArray` 对象）。\n\n具体发生的情况是一是一系列对临时变量进行操作的循环：\n\
  \n点击此处查看代码图片\n\n```\ntmp1 = 1.2*x;  // 1000 次操作循环\n              // 加上 tmp1 的创建和销毁\n\
  tmp2 = x*y;    // 1000 次操作循环\n              // 加上 tmp2 的创建和销毁\ntmp3 = tmp1+tmp2;\
  \ // 1000 次操作循环\n              // 加上 tmp3 的创建和销毁\nx = tmp3;  // 1000 次写入操作\n```\n\
  \n临时变量的创建通常占据了小型数组操作的时间（除非使用了快速分配器。对于大型数组，这是不可接受的，因为没有内存来存储它们）。早期的数值数组库面临这个问题，并鼓励用户使用复合赋值（如\
  \ `+=`、`*=` 等）。这些赋值操作的优势在于参数和目标都是由调用者提供的，因此不需要临时变量。我们可以这样添加 `SArray` 成员：\n\n点击此处查看代码图片\n\
  \n`exprtmpl/sarrayops2.hpp`\n\n```cpp\n// SArray 的加法赋值\ntemplate<typename T>\nSArray<T>&\
  \ SArray<T>::operator+= (SArray<T> const& b)\n{\n    assert(orig.size()); // 注意：orig\
  \ 可能是源码中的误，应为 b\n    for (std::size_t k = 0; k<size(); ++k) {\n        (*this)[k]\
  \ += b[k];\n    }\n    return *this;\n}\n// SArray 的乘法赋值\ntemplate<typename T>\n\
  SArray<T>& SArray<T>::operator*= (SArray<T> const& b)\n{\n    assert(size()==b.size());\n\
  \    for (std::size_t k = 0; k<size(); ++k) {\n        (*this)[k] *= b[k];\n   \
  \ }\n    return *this;\n}\n// 标量的乘法赋值\ntemplate<typename T>\nSArray<T>& SArray<T>::operator*=\
  \ (T const& s)\n{\n    for (std::size_t k = 0; k<size(); ++k) {\n        (*this)[k]\
  \ *= s;\n    }\n    return *this;\n}\n```\n\n有了这样的运算符，我们的示例可以重写为：\n\n`exprtmpl/sarray2.cpp`\n\
  \n```cpp\n#include \"sarray1.hpp\"\n#include \"sarrayops1.hpp\"\n#include \"sarrayops2.hpp\"\
  \nint main()\n{\n    SArray<double> x(1000), y(1000);\n    …\n    // 处理 x = 1.2*x\
  \ + x*y\n    SArray<double> tmp(x);\n    tmp *= y;\n    x *= 1.2;\n    x += tmp;\n\
  }\n```\n\n\n\n\n解决我们问题的关键在于，在看到整个表达式之前，不要尝试评估表达式的一部分（在我们的示例中，即直到赋值运算符被调用）。因此，在评估之前，我们必须记录哪些操作被应用于哪些对象。这些操作是在编译时确定的，因此可以编码在模板参数中。\n\
  \n对于我们的示例表达式：\n\n`1.2*x + x*y;`\n\n这意味着 `1.2*x` 的结果不是一个新数组，而是一个代表*x 的每个值乘以* 1.2\
  \ 的对象。同样，`x*y` 必须产生*x 的每个元素乘以 y 的每个对应元素* 的结果。最后，当我们我们需要结果数组的值时，我们才执行之前存储的用于稍后评估的计算。\n\
  \n让我们设计一个具体的实现。我们的实现将表达式 `1.2*x + x*y;` 评估为一个具有以下类型的对象：\n\n点击此处查看代码图片\n\n```cpp\n\
  A_Add<A_Mult<A_Scalar<double>,Array<double>>,\n      A_Mult<Array<double>,Array<double>>>\n\
  ```\n\n我们将一个新的基础 `Array` 类模板与类模板 `A_Scalar`、`A_Add` 和 `A_Mult` 结合起来。你可能识别出与此表达式对应的语法树的前缀表示法（参见图\
  \ 27.1）。这个嵌套的模板 ID 表示了涉及的操作以及这些操作应应用于的对象的类型。`A_Scalar` 将在稍后介绍，但它本质上只是数组表达式中标量的占位符。\n\
  \n*图 27.1 表达式* `1.2*x+x*y` 的树表示*\n\n### 27.2.1 表达式模板的操作数\n\n为了完成表达式的表示，我们必须在每个 `A_Add`\
  \ 和 `A_Mult` 对象中存储参数的引用，并在 `A_Scalar` 对象中记录标量的值（或其引用）。以下是对应操作数的可能定义：\n\n点击此处查看代码图片\n\
  \n*exprtmpl/exprops1.hpp*\n\n```cpp\n#include <cstddef>\n#include <cassert>\n\n\
  // 包含辅助类特性的模板，用于选择通过值还是通过引用\n// 引用表达式模板节点\n#include \"exprops1a.hpp\"\n\n// 用于表示两个操作数相加的类\n\
  template<typename T, typename OP1, typename OP2>\nclass A_Add {\n  private:\n  \
  \  typename A_Traits<OP1>::ExprRef op1;    // 第一操作数\n    typename A_Traits<OP2>::ExprRef\
  \ op2;    // 第二操作数\n  public:\n    // 构造函数初始化操作数的引用\n    A_Add (OP1 const& a, OP2\
  \ const& b)\n      : op1(a), op2(b) {\n    }\n    // 在请求值时计算和\n    T operator[]\
  \ (std::size_t idx) const {\n        return op1[idx] + op2[idx];\n    }\n    //\
  \ size 为最大尺寸\n    std::size_t size() const {\n        assert (op1.size()==0 || op2.size()==0\n\
  \                || op1.size()==op2.size());\n        return op1.size()!=0 ? op1.size()\
  \ : op2.size();\n    }\n};\n\n// 用于表示两个操作数相乘的类\ntemplate<typename T, typename OP1,\
  \ typename OP2>\nclass A_Mult {\n  private:\n    typename A_Traits<OP1>::ExprRef\
  \ op1;    // 第一操作数\n    typename A_Traits<OP2>::ExprRef op2;    // 第二操作数\n  public:\n\
  \    // 构造函数初始化操作数的引用\n    A_Mult (OP1 const& a, OP2 const& b)\n      : op1(a),\
  \ op2(b) {\n    }\n    // 在请求值时计算乘积\n    T operator[] (std::size_t idx) const {\n\
  \        return op1[idx] * op2[idx];\n    }\n    // size 为最大尺寸\n    std::size_t\
  \ size() const {\n        assert (op1.size()==0 || op2.size()==0\n             \
  \   || op1.size()==op2.size());\n        return op1.size()!=0 ? op1.size() : op2.size();\n\
  \    }\n};\n```\n\n正如你看到的，我们添加了下标和尺寸查询操作，这允许我们计算由子树所表示的操作所产生的数组的大小和元素值。\n\n\n\n\
  凭借我们使用轻量级表达式模板对表达式进行编码的能力，现在必须创建一个 `Array` 类型，它负责控制实际存储并感知表达式模板。然而，从工程角度来看，让具有存储的真实数组的接口与产生数组的表达式表示的接口尽可能相似也是有用的。为此，我们按照如下所示的方式声明了\
  \ `Array` 模板：\n\n点击此处查看代码图像\n\n```\ntemplate<typename T, typename Rep = SArray<T>>\n\
  class Array;\n```\n\n如果 `Array` 是一个真实的存储数组，则类型 `Rep` 可以是 `SArray`；它也可以是嵌套的模板 ID，例如\
  \ `A_Add` 或 `A_Mult`，它们用于编码一个表达式。无论何种情况，我们处理的 `Array` 的实例化，这极大地简化了我们后的操作。事实上，即使是\
  \ `Array` 模板的定义特殊特化来区分这两种情况，尽管某些成员无法为替代 `Rep` 的 `A_Mult` 等类型实例化。\n\n以下是定义。其功能大致局限于我们\
  \ `SArray` 模板提供的功能，尽管一旦理解了代码，增加这些功能并不困难：\n\n点击此处查看代码图像\n\n```cpp\n#include <cstddef>\n\
  #include <cassert>\n#include \"sarray1.hpp\"\n\ntemplate<typename T, typename Rep\
  \ = SArray<T>>\nclass Array {\n  private:\n    Rep expr_rep; // (访问)数组的数据\n  public:\n\
  \    // 创建带有初始大小的数组\n    explicit Array (std::size_t s)\n      : expr_rep(s) {\n\
  \    }\n    // 从可能的表示创建数组\n    Array (Rep const& rb)\n      : expr_rep(rb) {\n \
  \   }\n    // 同一类型的赋值运算符\n    Array& operator= (Array const& b) {\n        assert(size()==b.size());\n\
  \        for (std::size_t idx = 0; idx<b.size(); ++idx) {\n            expr_rep[idx]\
  \ = b[idx];\n        }\n        return *this;\n    }\n    // 不同类型数组的赋值运算符\n    template<typename\
  \ T2, typename Rep2>\n    Array& operator= (Array<T2, Rep2> const& b) {\n      \
  \  assert(size()==b.size());\n        for (std::size_t idx = 0; idx<b.size(); ++idx)\
  \ {\n            expr_rep[idx] = b[idx];\n        }\n        return *this;\n   \
  \ }\n    // size 是所表示数据的大小\n    std::size_t size() const {\n        return expr_rep.size();\n\
  \    }\n    // 常和变量的下标运算符\n    decltype(auto) operator[] (std::size_t idx) const\
  \ {\n        assert(idx<size());\n        return expr_rep[idx];\n    }\n    T& operator[]\
  \ (std::size_t idx) {\n        assert(idx<size());\n        return expr_rep[idx];\n\
  \    }\n    // 返回数组当前表示的内容\n    Rep const& rep() const {\n        return expr_rep;\n\
  \    }\n    Rep& rep() {\n        return expr_rep;\n    }\n};\n```\n\n如你所示，许多操作简单地转发给了\
  \ `Rep` 对象。然而，在拷贝另一个数组时，我们必须考虑到另一个数组实际上是构建在表达式上的。因此，我们根据 `Rep` 表示对这些拷贝操作进行了参数化。\n\
  \n下标运算符值得稍微讨论。注意，该运算符的 `const` 版本使用了推导的返回类型，而不是传统的 `T const&`。我们这样做是因为，如果 `Rep`\
  \ 代表 `A_Mult` 或 `A_Add`，它的下标运算符将返回一个临时值（即 prvalue），该值无法通过引用返回（且 `decltype(auto)`\
  \ 将推导出非引用类型）。另一方面，如果 `Rep` 是 `SArray<T>`，则下标运算符会产生一个 `const` 左值，推导出的返回类型在该情况下将匹配\
  \ `const` 引用。\n\n### 27.2.3 运算符\n\n我们已经拥有了大部分机制来为我们的 `Array` 模板提供高效的运算符，除了运算符本身。正如之前暗示的，这些运算符只是组装表达式模板——它们并不会实际评估结果数组。对于每个普通的二元运算符，我们必须实现三个版本：数组-数组、数组-标量和标量-数组。为了能够计算我们的初始值，例如我们需要以下运算符：\n\
  \n点击此处查看代码图像\n\n```cpp\nexprprops.hpp\n// 两个 Array 相加：\ntemplate<typename T, typename\
  \ R1, typename R2>\nArray<T,A_Add<T,R1,R2>>\noperator+ (Array<T,R1> const& a, Array<T,R2>\
  \ const& b) {\n    return Array<T,A_Add<T,R1,R2>>(a.rep(),b.rep());\n}\n\n// 两个\
  \ Array 相乘：\ntemplate<typename T, typename R1, typename R2>\nArray<T,A_Mult<T,R1,R2>>\n\
  operator* (Array<T,R1> const& a, Array<T,R2> const& b) {\n    return Array<T,A_Mult<T,R1,R2>>(a.rep(),b.rep());\n\
  }\n\n// 标量乘以数组：\ntemplate<typename T, typename R2>\nArray<T, A_Mult<T,A_Scalar<T>,R2>>\n\
  operator* (T const& s, Array<T,R2> const& b) {\n    return Array<T,A_Mult<T,A_Scalar<T>,R2>>(A_Scalar<T>(s),\
  \ b.rep()));\n}\n\n// 数组乘以标量：\ntemplate<typename T, typename R1>\nArray<T, A_Mult<T,A_Scalar<T>,R1>>\n\
  operator* (Array<T,R1> const& a, T const& s) {\n    return Array<T,A_Mult<T,A_Scalar<T>,R1>>(a.rep(),\
  \ A_Scalar<T>(s));\n}\n\n// 标量相加\n这些运算符的声明\n繁琐（如这些示例所示），\n//\n\n\n\n\n\n\n\n\n\n\
  \n\n，这些本身并没有做做`。例如，两个 `Array` 相加，\n首先创建一个 `A_Add` 对象，\n并将此对象封装在 `Array` 对象中，以便我们可以使用它作为结果的任何对象。\n\
  对于标量相乘，我们使用 `A_Scalar` 模板来创建 `A_Mult` 对象\n并再次包装：\n\n其他非成员二元运算符非常相似，可以使用宏来覆盖大多数运算符。另一个（较小的）宏可以用于非成员一元运算符。\n\
  \n### 27.2.4 回顾\n\n初次发现表达式模板时，各种声明和定义之间的交互可能是令人畏的。因此，对我们的示例进行自上而下的回顾有助于理解。我们将分析的代码如下（你可以在\
  \ `meta/exprmain.cpp` 中找到它）：点击此处查看代码图像\n\n```cpp\nint main()\n{\n    Array<double>\
  \ x(1000), y(1000);\n    …\n    x = 1.2*x + x*y;\n}\n```\n\n由于定义 `x` 和 `y` 时省略了\
  \ `Rep` 参数，它被设置为默认值，即 `SArray<double>`。因此，`x` 和 `y` 是具有“真实”存储的数组，而不仅仅的操作记录。\n\n\
  在解析表达式 `1.2*x + x*y` 时，编译器首先应用左侧的 `*` 操作，这是一个标量-数组运算符。因此，重载解析选择了 `operator*` 的标量-数组形式：点击此处查看代码图像\n\
  \n```cpp\ntemplate<typename T, typename R2>\nArray<T, A_Mult<T,A_Scalar<T>,R2>>\n\
  operator* (T const& s, Array<T,R2> const& b) {\n    return Array<T,A_Mult<T,A_Scalar<T>,R2>>(A_Scalar<T>(s),\
  \ b.rep()));\n}\n```\n\n操作数类型为 `double` 和 `Array<double, SArray<double>>`。因此，结果的类型是点击此处查看代码图像\n\
  \n\n\n\n\n`Array<double, A_Mult<double, A_Scalar<double>, SArray<double>>>`\n\n\
  结果值被构造为引用一个 `A_Scalar<double>` 对象，该对象由 `double` 值 `1.2` 和对象 `x` 的 `SArray<double>`\
  \ 表示构造而成。\n\n接下来，评估第二次乘法：这是一个数组-数组操作 `x*y`。这次我们使用了适当 `operator*`：\n\n点击此处查看代码图像\n\
  \n```cpp\ntemplate<typename T, typename R1, typename R2>\nArray<T, A_Mult<T,R1,R2>>\n\
  operator* (Array<T,R1> const& a, Array<T,R2> const& b) {\n    return Array<T,A_Mult<T,R1,R2>>\n\
  \             (A_Mult<T,R1,R2>(a.rep(), b.rep()));\n}\n```\n\n操作数类型均为 `Array<double,\
  \ SArray<double>>`，因此结果类型为\n\n点击此处查看代码图像\n\n`Array<double, A_Mult<double, SArray<double>,\
  \ SArray<double>>>`\n\n这一次，封装的 `A_Mult` 对象引用了两个 `SArray<double>` 表示：`x` 的和 `y` 的。\n\
  \n最后，评估 `+` 操作。这再次是一个数组-数组操作，操作数类型就是我们刚刚推导出的结果类型。因此，我们调用数组-数组运算符 `+`：\n\n点击此处查看代码图像\n\
  \n```cpp\ntemplate<typename T, typename R1, typename R2>\nArray<T,A_Add<T,R1,R2>>\n\
  operator+ (Array<T,R1> const& a, Array<T,R2> const& b) {\n    return Array<T,A_Add<T,R1,R2>>\n\
  \             (A_Add<T,R1,R2>(a.rep(),b.rep()));\n}\n```\n\n`T` 被替换为 `double`，而\
  \ `R1` 被替换为\n\n点击此处查看代码图像\n\n`A_Mult<double, A_Scalar<double>, SArray<double>>`\n\
  \n而 `R2` 被替换为\n\n点击此处查看代码图像\n\n`A_Mult<double, SArray<double>, SArray<double>>`\n\
  \n因此，赋值符号右侧表达式的类型为\n\n点击此处查看代码图像\n\n```cpp\nArray<double,\n    A_Add<double,\n \
  \       A_Mult<double, A_Scalar<double>, SArray<double>>,\n        A_Mult<double,\
  \ SArray<double>, SArray<double>>>>\n```\n\n该类型与 `Array` 模板的赋值运算符模板匹配：\n\n点击此处查看代码图像\n\
  \n```cpp\ntemplate<typename T, typename Rep = SArray<T>>\nclass Array {\n  public:\n\
  \    …\n    *// 用于不同类型数组的赋值运算符*\n    template<typename T2, typename Rep2>\n    Array&\
  \ operator= (Array<T2, Rep2> const& b) {\n        assert(size()==b.size());\n  \
  \      for (std::size_t idx = 0; idx<b.size(); ++idx) {\n            expr_rep[idx]\
  \ = b[idx];\n        }\n        return *this;\n    }\n    …\n};\n```\n\n赋值运算符通过对右侧的表示应用下标运算符，来计算目标\
  \ `x` 的每个元素，其类型为\n\n点击此处查看代码图像\n\n```cpp\nA_Add<double,\n    A_Mult<double, A_Scalar<double>,\
  \ SArray<double>>,\n    A_Mult<double, SArray<double>, SArray<double>>>>\n```\n\n\
  仔细追踪此下标运算符可以看出，对于给定的下标 `idx`，它计算出\n\n点击此处查看代码图像\n\n`(1.2*x[idx]) + (x[idx])`，这正是我们想要的。\n\
  \n#### 27.2.5 表达式赋值\n\n对于数组实例化带有 `Rep` 参数的写操作是不可能的，如果该参数是基于我们示例中的 `A_Mult` 和 `A_Add`\
