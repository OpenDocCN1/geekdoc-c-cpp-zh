  \ 类代码深处的错误，因为它无法用引用作为元素进行实例化：\n\n点击此处查看代码图像\n\n```cpp\nArr<int&,size> y;       \
  \        // 在 std::vector<> 代码深处发生编译错误\n```\n\n该错误通常会导致第 9.4 节第 143 页描述的“错误新小说（error\
