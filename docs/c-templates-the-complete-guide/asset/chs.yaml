  \n### [StroustrupCPL]\nBjarne Stroustrup\n*C++ 编程语言（特别版）*\nAddison-Wesley, 波士顿，马萨诸州，2000\n\
  \n### [StroustrupDnE]\nBjarne Stroustrup\n*C++ 的设计与演变*\nAddison-Wesley, 波士顿，马萨诸州，1994\n\
  \n### [StroustrupGlossary]\nBjarne Stroustrup\n*Bjarne Stroustrup 的 C++ 术语表*\n[`http://www.stroustrup.com/glossary.html`](http://www.stroustrup.com/glossary.html)\n\
  \n### [SutterExceptional]\nHerb Sutter\n*异常 C++* – *47 个工程难题、编程问题与解决方案*\nAddison-Wesley,\
  \ 波士顿，马萨诸州，2000\n\n### [SutterMoreExceptional]\nHerb Sutter\n*更异常的 C++* – *40 个新的工程难题、编程问题与解决方案*\n\
  Addison-Wesley, 波士顿，马萨诸州，2001\n\n### [UnruhPrimeOrig]\nErwin Unruh\n*用于质数计算的原始元程序*\n\
  [`http://www.erwin-unruh.de/primorig.html`](http://www.erwin-unruh.de/primorig.html)\n\
  \n### [VandevoordeJosuttisTemplates1st]\nDavid Vandevoorde 和 Nicolai M. Josuttis\n\
  *C++ 模板：完整指南*\nAddison-Wesley, 波士顿，马萨诸州，2003\n\n### [VandevoordeSolutions]\nDavid\
  \ Vandevoorde\n*C++ 解决方案*\nAddison-Wesley, 波士顿，马萨诸州，1998\n\n### [VeldhuizenMeta95]\n\
  Todd Veldhuizen\n*使用 C++ 模板元编程*\nC++ Report, 1995 年 5 月\n\n## 术语表\n\n本术语表是书中使用的最重要的技术术语的汇编。有关\
  \ C++ 程序员使用的全面、通用术语表，请参见 [StroustrupGlossary]。\n\n**abstract class**\n\n无法创建具体对象（*实例*）的类。抽象类可以将不同类的共同属性收集到一个类型中，或者定义一个多态接口。由于抽象类作为基类使用，有时使用缩写\
  \ *ABC* 来代表*抽象基类*。\n\n**ADL**\n\n\n\n\n\n`argument-dependent lookup`（参数依赖查找）的缩写。ADL\
  \ 是一种过程，它在与出现该函数（或运算符名）的函数调用参数以某种方式相关的命名空间和类中查找该函数（或运算符）的名字。由于历史原因，它有时被称为 `extended\
  \ Koenig lookup` 或直接称为 `Koenig lookup`（后者也用于仅运算符的 `ADL`）。\n\n### alias template（别名模板）\n\
  一种表示一组类型别名的构造结构。它指定了一个模式，通过将模板参数替换为特定的实体，可以生成实际的类型别名。别名模板可以是类成员。\n\n### angle bracket\
  \ hack（尖括号黑科技）\n一种 C++ 特性，要求编译器接受两个连续的 `>` 字符作为两个闭合的尖括号。例如，angle bracket hack 导致\
  \ `vector<list<int>>` 处理得与 `vector<list<int> >` 相同。它被称为一种（词法上的）`hack`，因为它不完全符合 C++\
  \ 的正式规范（特别是 `grammar`），也不符合典型编译器的通用架构。另一个类似的黑科技处理意外的二合字符形成（参见 `digraph`）。\n\n###\
  \ angle brackets（尖括号）\n当 `<` 和 `>` 用作定界符而不是小于和大于运算符时使用的字符。\n\n### ANSI\n`American\
  \ National Standard Institute`（美国国家标准协会）的缩写，这是一个私人非营利组织，负责协调各种标准规范的制定。参见 INCITS。\n\
  \n### argument（参数）\n（广义上）替换程序实体中 `parameter` 的值。例如，在函数调用 `abs(-3)` 中，参数是 `-3`。在某些编程社区中，`arguments`\
  \ 被称为实参参数（而 `parameters` 被称为形式参数）。另请参见 `template argument`。\n\n### argument-dependent\
  \ lookup（参数依赖查找）\n参见 `ADL`。\n\n### class（类）\n对对象对象的描述。类为该类型的任何对象定义了一组特征。这些特征包括数据（`attributes`、`data\
  \ members`）以及其操作（`methods`、成员函数）。在 C++ 中，类是具有成员的结构，成员也可以是函数，并且受到访问限制。它们使用关键字 `class`\
  \ 或 `struct` 进行声明。\n\n### class template（类模板）\n一种表示一组类的构造结构。它指定了一个模式，通过将模板参数替换为特定的实体，可以生成实际的类。类模板有时被称为\
  \ `parameterized classes`。\n\n### class type（类类型）\n用 `class`、`struct` 或 `union`\
  \ 声明的 C++ 类型。\n\n### collection class（集合类）\n用于管理一组对象的类。在 C++ 中，集合类也被称为 `containers`（容器）。\n\
  \n### compiler（编译器）\n将编译单元中的源代码转换为目标代码（带有符号注释的机器码，允许链接器解析跨编译单元的引用）的程序或库组件。\n\n###\
  \ complete type（完整类型）\n不是 `incomplete` 的类型：定义的类、元素完整且大小已数组、具有定义底层类型的枚举类型，以及除 `void`\
  \ 之外的任何基本数据类型（可选带有 `const` 和/或 `volatile`）。\n\n### concept（概念）\n可以应用于一个或多个模板参数的命名约束集。参见\
  \ Appendix E。\n\n### constant-expression（常量表达式）\n值可以在编译时由编译器计算的表达式。我们有时称之为 `true\
  \ constant`（真常量），以避免与 `constant expression`（不带连字符）混淆。后者包含了是常量但并不总是由编译器在编译时计算的表达式。\n\
  \n### const member function（常量成员函数）\n可以为常量和临时对象调用的成员函数，因为它通常不修改 `*this` 对象的成员。\n\
  \n### container（容器）\n参见 `collection class`。\n\n### conversion function（转换函数）\n定义对象如何隐式地（或显式地）转换为另一种类型对象的特殊成员函数。它使用\
  \ `operator` type`()` 的形式声明。\n\n### conversion operator（转换运算符）\n`conversion function`\
  \ 的同义词。后者是标准术语，但前者也常用。\n\n### CPP 文件\n包含变量和非内联函数 `definitions` 的。程序大部分的可执行代码（相对于声明性代码）通常放在\
  \ CPP 文件中。它们被命名为 `CPP` 文件，是因为它们的后缀通常为 `.cpp`。但由于历史原因，后缀也可能是 `.C`、`.c`、`.cc` 或 `.cxx`。另参见\
  \ `header file` 和 `translation unit`。\n\n### CRTP\n`curiously recurring template\
  \ pattern`（奇异递归模板模式）的缩写。这指的是一种代码模式，类 `X` 派生自一个以 `X` 作为模板参数的基类。\n\n### curiously\
  \ recurring template pattern（奇异递归模板模式）\n参见 `CRTP`。\n\n### decay（退化）\n数组或函数向指针的隐式转换。例如，字符串字量\
  \ `\"Hello\"` 的类型为 `char const[6]`，但在许多 C++ 上文中，它被隐式转换为 `char const*` own 指针（指向字符串的第一个字符）。\n\
  \n### declaration（声明）\n一种在 C++ 作用域中引入或重新引入名称的 C++ 构造。参见 `definition`。\n\n### deduction（推导）\n\
  从模板使用的上下文隐含确定模板参数的过程。全称是 `template argument deduction`。\n\n### definition（定义）\n\
  一种使声明实体的细节化的 `declaration`，或者在变量的情况下，强制为声明实体留留存储空间。对于类类型和函数定义，这等同于包含大括号主体的声明。对于外部变量声明，这意味着要么是没有\
  \ `extern` 关键字的声明，要么是带有初始化器的声明。\n\n### dependent base class（依赖基类）\n依赖于模板参数的基类。访问依赖基类的成员时必须特别小心。另参见\
  \ `two-phase lookup`。\n\n### dependent name（依赖名称）\n含义依赖于模板参数的名字。例如，当 `A` 或 `T` 是模板参数时，`A<T>::x`\
  \ 是一个依赖名称。如果函数调用中的任何参数的类型依赖于模板参数，那么函数调用中的函数名也是依赖的。例如，如果 `T` 是模板参数，则 `f((T*)0)` 中的\
  \ `f` 是依赖的。然而，模板参数的名字不被认为是依赖的。参见 `two-phase lookup`。\n\n### digraph（二合字符）\nC++ 代码中两个连续字符的组合，等于另一个单个字符。二合字符的目的是允许使用缺少某些字符的键盘输入\
  \ C++ 源代码。虽然使用频率较低，但当左 `angle bracket` 后面跟着作用域运算符（`::`）且中间没有所需的 `whitespace` 时，有时会意外形成复合字符\
  \ `<:`。C++11 引入了一种词法技巧，在这些情况下禁用二合字符的解释。\n\n### EBCO\n`empty base class optimization`（空基类优化）的缩写。大多数现代编译器执行的一种优化，使得“空”基类子对象不占用任何存储空间。\n\
  \n### empty base class optimization（空基类优化）\n参见 `EBCO`。\n\n### explicit instantiation\
  \ directive（显式实例化指令）\n一种唯一目的是创建 `point of instantiation` (POI)的 C++ 构造。\n\n### explicit\
  \ specialization（显式实例化）\n一种为替换后的模板声明或定义另一种定义的构造结构。原始（泛型）模板被称为 `primary template`。如果另一种定义仍然依赖于一个或多个模板参数，则称为\
  \ `partial specialization`（部分特化）。否则，它是 `full specialization`（完全实例化）。\n\n### expression\
  \ template（表达式模板）\n用于表示表达式一部分的类模板。模板本身代表特定类型的操作。模板参数代表操作所属的操作数类型。\n\n\n\n\n## 转发引用\
  \ (forwarding reference)\n形式为 `T&&` 的右值引用的术语之一，其中 `T` 是可推导的模板参数。它适用于与普通右值引用不同的特殊规则（参见第\
  \ 91 页第 6.1 节）。该术语由 C++17 引入以替代*通用引用*（universal reference），因为引用的主要用途是转发对象。但请注意，它不会自动转发。也就是说，该术语描述的不是它“是什么”，而是它通常的用途。\n\
  \n## 友元名注入 (friend name injection)\n当函数的唯一声明是友元声明时，使函数名变为可见的过程。\n\n## 全特化 (full\
  \ specialization)\n参见*显式特化*（explicit specialization）。\n\n## 函数对象 (function object)\n\
  可以使用*函数调用语法*调用的对象。在 C++ 中，这些对象是函数指针、重载了 `operator()` 的类（参见*函数函数*/functor），以及具有返回函数指针或函数引用的转换函数的类。\n\
  \n## 函数模板 (function template)\n一种表示一组函数的构造结构。它指定了一个模式，通过用特定实体替换模板参数来生成实际的函数。注意，函数模板是一个模板而不是一个函数。函数模板有时称为*参数化函数*（parameterized\
  \ functions）。\n\n## 函数对象 (functor)\n重载了 `operator()` 的类类型对象，可以使用*函数调用语法*进行调用。这包括\
  \ lambda 表达式的闭包类型。\n\n## glvalue (glvalue)\n一种产生存储值位置位置的表达式类别（广义可定位值）。glvalue 可以是*左值*（lvalue）或*异值*（xvalue）。参见*值类别*（value\
  \ category）和第 674 页第 B.2 节。\n\n## 头文件 (header file)\n旨在通过 `#include` 指令成为编译单元一部分的文件。此类文件通常包含被多个编译单元引用的变量和函数的*声明*，以及类型、内联函数、模板、常量和宏的*定义*。它们通常以\
  \ `.hpp`、`.h`、`.H`、`.hh` 或 `.hxx` 后缀命名。它们也被称为*包含文件*。参见*CPP 文件*和*编译单元*。\n\n## INCITS\n\
  *信息技术标准国际委员会（InterNational Committee for Information Technology Standards）的缩写，是一个由\
  \ ANSI 认证的美国标准开发组织（以前称为 X3）。名为 J16 的子委员会是 C++ 标准化的推动力量。它与国际标准化组织（ISO）保持密切合作。\n\n\
  ## 包含文件 (include file)\n参见*头文件*。\n\n## 不完全类型 (incomplete type)\n已声明但未定义的类、元素类型不完全或大小未知的数组、未定义底层类型的枚举类型或\
  \ `void`（可选带有 `const` 和/或 `volatile`）。\n\n## 间接调用 (indirect call)\n一种在调用实际发生（在运行时）之前不知道被调用函数的函数调用。\n\
  \n## 初始化器 (initializer)\n一种指定如何初始化对象的构造结构。例如，在 `std::complex<float> z1 = 1.0, z2(0.0,\
  \ 1.0);` 中，初始化器为 `= 1.0` 和 `(0.0, 1.0)`。\n\n## 初始化列表 (initializer list)\n用大括号括起来的逗号分隔的表达式列表，用于初始化对象和引用。初始化列表通常用于初始化变量，同时也用于在构造定义中初始化成员和基类。这种初始化可能直接发生，也通过中间的\
  \ `std::initializer_list` 对象进行。\n\n## 注入类名 (injected class name)\n类在其自身的定义作用域内可见的类名。对于类模板，如果名称后面没有跟随模板参数列表，则模板名称在模板作用域内被视为类名。\n\
  \n## 实例 (instance)\n*实例*一词在 C++ 编程中有两个含义：源自对象的术语的含义是*类的实例*（在 C++ 中，`std::cout` 是\
  \ `ostream` 的实例）。另一个含义（书中通常指的含义）是通过特定值替换模板参数生成的*类或函数*。这种实例化有时被称为*模板特化*（specialization）。\n\
  \n## 实例化 (instantiation)\n用特定值替换模板参数以创建具体实体（函数或类）。如果只替换模板的声明而非定义，则称为*模板实例化*（template\
  \ instantiation）。参见*特化*。\n\n## ISO\n国际标准化组织（International Organization for Standardization）的缩写。一个名为\
  \ WG21 的小组是 C++ 标准化的推动力量。\n\n## 迭代器 (iterator)\n知道如何遍历序列的对象。这些元素通常属于集合（参见*集合*/collection）。\n\
  \n## 可链接实体 (linkable entity)\n以下任何内容：函数或成员函数、全局变量或静态成员、从模板生成的任何内容。\n\n## 链接器 (linker)\n\
  连接编译单元并解析可链接实体的程序或操作系统服务。\n\n## 左值 (lvalue)\n一种产生存储值位置的表达式类别，假设可移动（即*异值*/xvalues）。典型的示例是命名对象（变量）和字符串字面量。参见*值类别*和第\
  \ 673 页第 B.1 节。\n\n## 成员类模板 (member class template)\n一种表示一组成员类的构造结构。它是声明在另一个类或类模板内部的模板。它有自己的模板参数（与类的成员函数不同）。\n\
  \n## 成员函数模板 (member function template)\n一种表示一组成员函数的构造结构。它有自己的模板参数（与类的成员函数不同）。它与函数模板非常，但当替换所有模板参数时，结果是成员函数（而不是普通函数）。成员模板不能是虚。\n\
  \n## 成员模板 (member template)\n*成员类模板*、*成员函数模板*或*静态成员模板*。\n\n## 现代 C++ (Modern C++)\n\
  书中指 C++11 及以后标准化的语言（即 C++11、C++14 或 C++17）。\n\n## 非依赖名 (nondependent name)\n不依赖模板参数的名称。参见*依赖名*（dependent\
  \ name）和*两阶段查找*（two-phase lookup）。\n\n## ODR\n*单定义规则*（one-definition rule）的缩写。该规则对\
  \ C++ 程序中出现的定义施加了某些限制。参见第 154 页第 10.4 节以及附录 A 详情。\n\n## 单定义规则 (one-definition rule)\n\
  参见*ODR*。\n\n## 重载解析 (overload resolution)\n当存在多个候选者（通常具有相同名称）时选择调用哪个函数的过程。参见附录 C。\n\
  \n## 参数 (parameter)\n一种旨在在某点被替换为实际“值”（实参/argument）的占位符实体。对于宏参数和模板参数，*替换*在编译时发生。对于函数调用参数，它在运行时发生。在某些编程社区中，*参数*被称为形式参数（formal\
  \ parameters），而*实参*被称为实际参数）。参见*实参*和*模板参数*。\n\n## 参数化类 (parameterized class)\n\n\n\
  \n\n\n类模板或嵌套在类模板中的类。它们都是 `parameterized`（参数化的），因为在指定模板参数之前，它们并不对应于唯一的类。\n\n### 参数化函数\n\
  函数模板、成员函数模板或类模板的成员函数。它们都是 `parameterized`（参数化的），因为在指定模板参数之前，它们并不对应于唯一的函数（或成员函数）。\n\
  \n### 部分特化\n用于声明或定义模板的某些 `substitutions`（替换）的替代定义的结构。原始（通用）模板称为 `primary template`（主模板）。替代定义仍然依赖模板参数。目前，这种结构仅适用于类模板。参见\
  \ `explicit specialization`。\n\n### POD\n“plain old data (type)”（旧数据类型）的缩写。POD 类型是在不使用某些\
  \ C++ 特性（如虚成员函数、访问控制关键字等）的情况下定义的类型。例如，每个普通的 C `struct` 都是 POD。\n\n### POI\n`point\
  \ of instantiation`（实例化点）的缩写。POI 是源代码中的一个位置，通过将模板参数替换为模板参数，在概念上展开模板（或模板的成员）。在实践中，这种展开并不需要在每个\
  \ POI 处发生。参见 `explicit instantiation directive`。\n\n### point of instantiation\n\
  参见 `POI`。\n\n### 策略类\n类或类模板，其成员描述了通用组件的可配置行为。策略通常作为模板参数传递。例如，一个排序模板可能有一个排序策略。`Policy\
  \ classes` 也称为 `policy templates` 或直接称为 `policies`。参见 `traits template`。\n\n###\
  \ 多态\n操作（通过名称识别）适用于不同类型对象的能力。在 C++ 中，传统的面向对象多态概念（也称为 `run-time` 或 `dynamic` 动态态）通过在派生类中重写的虚函数实现。此外，C++\
  \ 模板实现了 `static`（静态）多态。\n\n### 预编译头文件\n经过处理的源代码形式，可以被编译器快速加载。预编译头文件的底层源代码必须是 `translation\
  \ unit`（编译单元）的第一部分（即它不能从编译单元的中间开始）。通常，一个预编译头文件对应多个头文件。使用预编译头文件可以显著缩短用 C++ 编写大型应用程序所需的时间。\n\
  \n### 主模板\n不是 `partial specialization`（部分特化）的模板。\n\n### prvalue\n执行初始化的表达式类别。prvalue\
  \ 可以被假设为指定纯数学值（如 `1` 或 `true`）和临时值（特别是按值返回的值）。在 C++11 之前的任何 `rvalue` 在 C++11 中都是\
  \ `prvalue`。参见 `value category` 和第 674 页的 B.2 节。\n\n### 限定名\n包含作用域限定符（::`）的名字。\n\
  \n### 引用计数\n一种资源管理策略，记录有多少实体引用了特定资源。当计数减到零时，就可以释放该资源。\n\n### rvalue\n不是 `lvalues`（左值）的表达式类别。rvalue\
  \ 可以是 `prvalue`（如临时值）或 `xvalue`（例如用 `std::move()` 标记的 `lvalue`）。C++11 之前称为 `rvalue`\
  \ 的值在 C++11 中被称为 `prvalue`。参见 `value category` 和第 674 页的 B.2 节。\n\n### SFINAE\n\
  `substitution failure is not an error`（替换失败不是错误）的缩写。一种机制在尝试以无效方式替换模板参数时，静地丢弃模板而不是触发编译错误。如果重载集中的其他模板的替换成功，则将有机会被选中。\n\
  \n### 源文件\n`header file`（头文件）或 `CPP file`。\n\n### 特化\n用实际值替换模板参数的结果。特化可以通过 `instantiation`（实例化）或\
  \ `explicit specialization`（显式特化）创建。这个术语有时被误认为等同于 `explicit specialization`。参见 `instance`。\n\
  \n### 静态数据成员模板\n作为类或类模板成员的变量模板。\n\n### 替换\n用实际类型、值或模板替换模板化实体中的模板参数的过程。替换的程度取决于上下文。例如，在重载解析期间，只执行为建立候选函数类型所需的最少量的替换，如果该替换导致了无效的结构，则应用\
  \ `SFINAE` 规则。参见 `instantiation`。\n\n### 模板\n表示一组类型、函数、成员函数或变量的结构。它指定了一个模式，通过将模板参数替换为特定实体，可以生成实际的类型、函数、成员函数或变量。在书中，该术语不包括由于是类模板成员而参数化的函数、类、静态数据成员和类型别名。参见\
  \ `alias template`、`variable template`、`class template`、`parameterized class`、`function\
  \ template` 和 `parameterized function`。\n\n### 模板参数\n替换 `template parameter`（模板参数）的“值”。这个值通常是一个类型，尽管某些常量和模板也可以是模板参数。参见\
  \ `argument`。\n\n### 模板参数推导\n参见 `deduction`。\n\n### 模板标识\n模板名称后跟角括号 `<>` 之间指定的 `template\
  \ arguments`（例如 `std::list<int>`）。\n\n### 模板参数\n模板中的通用占位符。最常见的模板参数是 `type parameters`（类型参数），它们代表类型。`Nontype\
  \ parameters`（非类型参数）代表特定类型的常量值，而 `template template parameters`（模板模板参数）代表类型模板。参见\
  \ `parameter`。\n\n### 模板实体\n模板或在模板中定义或创建的实体。后者包括类模板的普通成员函数或模板中 lambda 表达式的闭包类型。\n\
  \n### traits template\n具有描述模板参数特征的成员的类模板。通常 traits template 的目的是避免过多的模板参数。参见 `policy\
  \ class`。\n\n### 编译单元\n一个 `CPP file` 以及它通过 `#include` 指令包含的所有头文件标准库头文件，减去被编译指令排除的程序文本。为了简单起见，它也可以被视为\
  \ `CPP file` 预处理的结果。参见 `CPP file` 和 `header file`。\n\n### 真\n编译器可以在编译时计算其值的表达式。参见\
  \ `constant-expression`。\n\n### tuple\nC `struct` 概念的泛化，使得可以通过数字访问成员。\n\n### 两阶段查找\n\
  用于模板中名称的查找机制。两个阶段是：(1) 处理模板定义，以及 (2) 为特定的模板参数实例化模板。`Nondependent names`（非依赖名称）仅在第一阶段查找，`nondependent\
  \ base classes` 在该阶段不被考虑。带有作用域限定符（::）的 `Dependent names` 在第二阶段查找。不带作用域限定符的依赖名称可以在两个阶段都进行查找，但在第二阶段，仅执行参数相关查找。\n\
  \n### 类型别名\n使用 `typedef` 声明、别名声明或 `alias template` 实例化引入的类型的替代名称。\n\n### 类型模板\n\
  类模板、成员类模板或别名模板。\n\n### 通用引用\n\n\n\n\n\n对于形式为 `T&&` 的右值引用的两种术语之一，其中 `T` 是一个可推导的模板参数。它适用于与普通右值引用不同的特殊规则（参见第\
  \ 91 页第 6.1 节）。该术语由 Scott Meyers 创造，作为`lvalue reference`和`rvalue reference`的通用术语。由于“universal”（通用）一词确实太宽泛了，C++17\
  \ 标准引入了`forwarding reference”（转发引用）术语来代之。\n\n### 用户定义转换\n\n由程序员定义的类型转换。它可以是一个可以带有一个参数调用的`构造函数`，也可以是一个`转换函数`。除非构造函数或转换函数用\
  \ `explicit` 关键字声明，否则该类型转换可以隐式发生。\n\n### 值类别\n\n表达式的分类。传统的值类别 `lvalues` 和 `rvalues`\
  \ 继承自 C 语言。C++11 引入了替代类别：`glvalues`（广义左值），其求值结果可以识别已存储的对象；以及 `prvalues`（纯右值），其求值结果初始化对象。额外的类别将\
  \ `glvalues` 进一步细分为 `lvalues`（可定位值）和 `xvalues`（即将失效的值）。此外，在 C++11 中 `rvalues` 是\
  \ `xvalues` 和 `prvalues` 的通用类别（在 C++11 之前，`rvalues` 就是 C++11 中的 `prvalues`）。详情参见\
  \ 附录 B。\n\n### 变量模板\n\n表示一组变量或静态数据成员的构造结构。它指定了一种模式，通过用特定实体替换模板参数来生成实际的变量和静态数据成员。\n\
  \n### 空白\n\n在 C++ 中，这是指源代码中分隔标记（标识符、字面量、符号等）的空间。除了传统的空格、换行和水平制表符外，它还包括注释。其他空白字符（例如页进控制字符）有时也是有效的空白字符。\n\
  \n### xvalue\n\n一种表达式类别，产生一个存储对象的地址，且该对象可以假定不再被需要。一个典型的例子是用 `std::move()` 标记的 `lvalue`。参见\
  \ `value category` 和第 674 页第 B.2 节。\n\n## 索引\n\n`->` 249\n\n`<`\n\n解析 225\n\n`>`\n\
