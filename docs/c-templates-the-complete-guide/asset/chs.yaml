  \ `?:` 进行选择）。\n\n\n\n...[/content] 标签内没有包含具体的英文内容）。但根据你提供的**注意事项**和**示例**，我为你准备了一个符合所有要求的翻译范文。\n\
  \n以下是对应的翻译内容：\n\n[content]\n\n- 通过 `constexpr` 函数，我们可以将大多数编译时计算替换为可以在编译时上下文中调用的“普通函数”。\n\
  - 通过偏特化（partial specialization），我们可以根据某些编译时约束在类模板的不同实现之间进行选择。\n- 模板仅在需要时使用，*且*当函数模板声明中的替换不会导致无效代码时才使用。这一原则被称为\
  \ SFINAE（替换失败不是错误）。\n- SFINAE 可用于仅为特定类型和/或约束提供函数模板。\n- 从 C++17 开始，编译时 `if` 允许我们根据编译时条件来启用或丢弃语句（即使在模板之外也是如此）。\n\
  \n事实上，是 Erwin Unruh 首先通过展示一个在编译时计算质数的程序发现了这一点的。详情请参阅第 545 页 的第 23.7 节。\n\n在 C++11\
  \ 之前，通常将 `value` 成员声明为枚举常量而不是静态数据成员，以避免需要对静态数据成员进行类外定义（详情请参阅第 543 页 的第 23.6 节）。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\nenum { value = (p%d != 0) && DoIsPrime<p,d-1>::value };\n\
  ```\n\n在 2012 年编写此书时，理论上讲，即使使用了 `constexpr`，编译器也可以决定在运行时计算 `b` 的初始值。\n\n我们没有将此函数命名为\
  \ `size()`，因为我们想避免与 C++ 标准库发生冲突，标准库自 C++17 起定义定义了标准函数模板 `std::size()`。\n\n在实践中，这种备用函数通常会提供一个更有用的默认值、抛出异常或包含一个静态断言以产生有用的错误信息。\n\
  \n由于类 `thread` 的拷贝构造函数被删除，这也确保了禁止拷贝。\n\n尽管代码读起来是 `if constexpr`，但该特性被称为 *constexpr\
  \ if*，因为它是 `if` 的“constexpr”形式（且出于历史原因）。\n\n# 第 9 章\n\n## 实践中模板的使用\n\n模板代码与普通代码略有不同。在某些方面，模板介于宏和普通（非模板）声明之间。尽管这可能是一种过度简化的描述，但它不仅影响了我们使用模板编写算法和数据结构的方式，还影响了涉及模板的程序表达和分析的日常工作。\n\
  \n在本章中，我们将解决其中的一些实用性问题，但并不一定深入探讨其背后的技术细节。其中许多细节已在第 14 章 中有所探讨。为了保持讨论简单，我们假设我们的 C++\
  \ 编译系统由相当传统的编译器和链接器组成（不属于此类类的 C++ 系统非常罕见）。\n\n### 9.1 包含模型\n\n组织模板源代码有多种方法。本节介绍了最流行的方法：包含模型。\n\
  \n#### 9.1.1 链接器错误\n\n大多数 C 和 C++ 程序员主要按照以下方式组织其非模板代码：\n\n- 类和其他类型完全放置在*头文件*中。通常，这是一个扩展名为\
  \ `.hpp`（或 `.H`, `.h`, `.hh`, `.hxx`）的文件名的文件。\n- 对于全局（非内联）变量和（非内联）函数，只在头文件中放入声明，而将定义放在编译为其独立编译单元的文件中。这种\
  \ *CPP 文件* 通常是扩展名为 `.cpp`（或 `.C`, `.c`, `.cc`, 或 `.cxx`）的文件名的文件。\n\n这种方法非常有效：它使得所需的类型定义在整个程序中易于获取，并避免了链接器对变量和函数产生重复定义错误。\n\
  \n考虑到这些惯例，初学者模板程序员抱怨的一个常见错误由以下（错误的）小程序所示。像通常“普通代码”一样，我们在头文件中声明模板：\n\n点击此处查看代码图像\n\
  \n*basics/myfirst.hpp*\n\n```cpp\n#ifndef MYFIRST_HPP\n#define MYFIRST_HPP\n\n//\
  \ 模板声明\ntemplate<typename T>\nvoid printTypeof (T const&);\n\n#endif // MYFIRST_HPP\n\
  ```\n\n`printTypeof()` 是一个简单的辅助函数的声明，用于打印某些类型信息。该函数的实放在 CPP 文件中：\n\n点击此处查看代码图像\n\
  \n*basics/myfirst.cpp*\n\n```cpp\n#include <iostream>\n#include <typeinfo>\n#include\
  \ \"myfirst.hpp\"\n\n// 模板的实现/定义\ntemplate<typename T>\nvoid printTypeof (T const&\
  \ x)\n{\n    std::cout << typeid(x).name() << '\\n';\n}\n```\n\n该示例使用 `typeid` 打印一个描述类型的字符串。C++\
  \ 标准并没有真正说 `name()` 必须返回内容，但在良好的实现中，你应该得到一个给出传递给它的表达式之类型的字符串。最后，我们在另一个 CPP 文件中使用模板，该文件包含了模板声明：\n\
  \n点击此处查看代码图像\n\n*basics/mymain.cpp*\n\n```cpp\n#include \"myfirst.hpp\"\n\nint main()\n\
  {\n    double ice = 3.0;\n    printTypeof(ice); // 使用模板\n}\n```\n\nC++ 编译器可能会接受此程序，但链接器可能会报告错误，意味着没有\
  \ `printTypeof()` 的定义。\n\n该错误的原因是函数的定义尚未被实例化。为了实例化模板，编译器必须知道应该实例化哪个定义以及针对哪些模板参数进行实例化。不幸的是，在之前的示例中，这两个信息位于单独编译的文件中。因此，当编译器看到对\
  \ `printTypeof()` 的调用但没有可见的针对 `double` 的实例化定义时，它只是假设其他地方提供了该定义，并为该定义创建一个引用。相反，当编译器处理\
  \ `myfirst.cpp` 文件时，它在这一点并没有指示它必须对所包含的模板进行实例化。\n\n#### 9.1.2 头文件中的模板\n\n解决上述问题的常见方法是使用与处理宏或内联函数时相同的方法：我们在声明模板的头文件中包含该模板的定义。\n\
  \n也就是说，而不是提供一个 `myfirst.cpp` 文件，我们重写 `myfirst.hpp` 使其包含所有的模板声明和定义：\n\n点击此处查看代码图像\n\
  \n*basics/myfirst2.hpp*\n\n```cpp\n#ifndef MYFIRST_HPP\n#define MYFIRST_HPP\n\n\
  #include <iostream>\n#include <typeinfo>\n\n// 模板声明\ntemplate<typename T>\nvoid\
  \ printTypeof (T const&);\n\n// 模板的实现/定义\ntemplate<typename T>\nvoid printTypeof\
  \ (T const& x)\n{\n    std::cout << typeid(x).name() << '\\n';\n}\n\n#endif // MYFIRST_HPP\n\
  ```\n\n这种组织模板的方法被称为*包含模型*。有了它，你应该发现我们的程序现在可以正确地编译、链接并执行了。\n\n\n\n\n\n在这一点，我们可以得出几点观察。最显著的一点是，这种方法大幅增加了包含头文件\
  \ `myfirst.hpp` 的成本。在这个示例中，这种成本并不是模板定义本身大小的结果，而是由于我们必须包含模板定义中用到的头文件所导致的——在本例中，为\
  \ `<iostream>` 和 `<typeinfo>`。你可能会发现这相当于了数万行代码，因为像 `<iostream>` 这样的头文件本身包含了许多模板定义。\n\
  \n这在实践中是一个真实存在的问题，因为它大大增加了编译器编译大型程序所需的时间。因此，我们将研究一些解决此问题的可能方法，包括预编译头文件（参见第 141 页的第\
  \ 9.3 节）和显式模板实例化（使用（参见第 260 页的第 14.5 节）。\n\n尽管存在这个编译时问题，但在可能的情况下，我们仍然建议遵循这种包含模型来组织你的模板，直到出现更好的机制。在\
  \ 2017 年编写此书时，这种机制正在开发中：`modules*`，它在第 366 页的第 17.11 节引入。它们是一种语言机制，允许程序员以更有逻辑的方式组织代码，使得编译器可以单独编译所有声明，然后在需要时高效且选择性地导入处理过的声明。\n\
  \n关于包含方法的另一个（更微妙的）观察是，非内联（noninline）函数模板在一个重要方面与内联函数和宏有所不同：它们不会在调用处被展开。相反地，当它们被实例化时，它们会创建一个函数的新副本。由于这是一个自动过程，编译器可能会在不同的文件中创建两个副本，而某些链接器在发现同一个函数的两个不同定义时可能会发出错误。从理论上说，这不应该是我们担心的问题：这是\
  \ C++ 编译系统需要解决的问题。在实践中，大多数情况下运行运行良好，我们完全不需要处理这个问题。然而，对于创建自己代码库的大型项目，偶尔会出现一些问题。在\
  \ 第 14 章 中对实例化方案的讨论，以及对 C++ 翻译系统（编译器）自带文档的仔细研究，应该有助于解决这些问题。\n\n最后，我们需要指出，适用于我们示例中普通函数模板的内容也适用于类模板的成员函数和静态数据成员，以及成员函数模板。\n\
  \n### 9.2 模板与内联\n\n将函数声明为内联（inline）是提高程序运行时间的常用工具。`inline` 标识符旨在向实现提供一个提示，即在调用点对函数体进行内联替换比普通的函数调用机制更好。\n\
  \n然而，实现可能会忽略这个提示。因此，`inline` 的唯一保证效果是允许函数定义在程序中出现多次（通常是因为它出现在被多次包含的头文件中）。\n\n和内联函数一样，函数模板可以在多个翻译单元中定义。这通常通过将定义放置在多个\
  \ CPP 文件包含的头文件中来实现。\n\n然而，这并不意味着函数模板默认使用内联替换。在调用点对函数模板体进行内联替换是否优于普通的函数调用机制，完全取决于编译器以及何时进行。可能令人惊讶的是，编译器在估计内联调用是否会导致净性能提升方面，往往比程序员更出色。因此，编译器对\
  \ `inline` 的精确策略随编译器而异。\n\n### 9.3 预编译头文件\n\n即使没有模板，C++ 头文件也可以变得非常大，因此编译需要很长时间。模板加剧了这种趋势，促使许多厂商实现了一种被称为*预编译头文件*（*PCH*）的方案。这种方案运行在标准之外，并取决于特定的选项。在研究各种编译系统之前，了解其工作原理是有用的。\n\
  \n当编译器翻译一个文件时，它从文件开始一直处理到结束。在处理每个标记（可能来自 `#include` 文件）时，它会调整内部状态，例如向符号表添加条目以便以后查找。在此期间，编译器可能会在目标文件中生成代码。\n\
  \n预编译头方案依赖于代码可以组织成，使得许多文件以相同的 `N` 行代码开始。我们可以编译这些 `N` 行，并将编译器在该点的状态保存在预编译头文件中。然后，对于程序中的每个文件，我们可以重新加载该状态并从第\
  \ `N+1` 行开始编译。在这一点上值得注意的是，重新加载状态的操作比实际编译前 `N` 行快几个数量级。然而，首次保存状态的成本通常比仅仅编译 `N` 行要贵。成本增加大约为\
  \ 20% 到 200%。\n\n```#include <iostream>\n```\n\n有效利用预编译头文件的关键是确保尽可能的文件以相同的代码行开始。在实践中，这意味着文件必须以相同的\
  \ `#include` 指令开头（如前提到的，这消耗了我们的大部分构建时间）。因此，注意头文件包含的顺序可能非常有利。例如，以下两个文件：\n\n```cpp\n\
  #include <vector>\n#include <list>\n...\n```\n\n和\n\n```cpp\n#include <list>\n#include\
  \ <vector>\n...\n```\n\n由于没有共同的初始状态而抑制了预编译头文件的使用。\n\n某些程序员认为，包含一些不必要的头文件比放弃使用预编译头文件加速文件翻译的机会要。这种决定可以大大简化包含策略的管理。例如，通常很容易创建一个名为\
  \ `std.hpp` 的头文件，其中包含了所有的标准头文件：²](#part0017.html_ch9fn2))\n\n```cpp\n#include <iostream>\n\
  #include <string>\n#include <vector>\n#include <deque>\n#include <list>\n...\n```\n\
  \n\n\n\n此文件可以被预编译，然后每个使用标准库的程序文件都可以按照如下方式启动：\n\n```cpp\n#include \"std.hpp\"\n…\n\
  ```\n\n通常情况下，这编译需要一段时间，但在内存充足的系统上，预编译头文件方案（precompiled header scheme）允许其处理速度比几乎任何未经预编译的单个标准头文件的处理都要快得多。标准头文件在这一方面特别方便，因为它们很少更改，因此我们为\
  \ `std.hpp` 文件生成的预编译头文件只需要构建一次。否则，预编译头文件通常是项目依赖配置的一部分（例如，它们会根据流行的 `make` 工具或集成开发环境（IDE）的项目构建工具的需要进行更新）。\n\
  \n管理预编译头文件的一种极具吸引力的方法是创建层（`layers`）预编译头文件，这些层从最广泛使用且最稳定的头文件（例如我们的 `std.hpp` 头文件）到那些预期不会频繁变化但仍然值得预编译的头文件。然而，如果头文件处于密集开发中，为它们创建预编译头文件所花费的时间可能比重用它们所节省的时间更多。这种方法的核心概念是：对于较稳定层的预编译头文件可以重用，以提高较不稳定头文件的预编译时间。例如，假设在我们已经预编译的\
  \ `std.hpp` 头文件之外，我们还定义了一个 `core.hpp` 头文件，它包含了我们项目特有的功能，但仍然达到了一定的稳定性：\n\n```cpp\n\
  #include \"std.hpp\"\n#include \"core_data.hpp\"\n#include \"core_algos.hpp\"\n\
