  \ true\nis_swappable_v<int&&>                   // yields true\nis_swappable_v<std::string&&>\
  \          // yields true\nis_swappable_v<void>                    // yields false\n\
  is_swappable_v<void*>                   // yields true\nis_swappable_v<char[]> \
  \                 // yields false\nis_swappable_v<std::unique_ptr<int>>  // yields\
  \ true\n```\n\n\n\n\n\n表 [D.5] 列出了允许测试类型之间某些关系的类型特性。这包括检查类类型提供了哪些构造函数和赋值运算符。\n\n\
  | 类型特性 | 效果 |\n| --- | --- |\n| `is_same<T1, T2>` | `T1` 和 `T2` 是相同类型（包括 `const`/`volatile`\
  \ 修饰符） |\n| `is_base_of<T, D>` | 类型 `T` 是类型 `D` 的基类 |\n| `is_convertible<T, T2>`\
  \ | 类型 `T` 可以转换为类型 `T2` |\n\n*表 D.5. 测试类型关系的类型特性*\n\n### `std::is_same<T1, T2>::value`\n\
  \n- 如果 `T1` 和 `T2` 指向相同类型（包括 cv-修饰符 `const` 和 `volatile`），则产生 `true`。\n- 如果一个类型是另一个类型的类型别名，则产生\
  \ `true`。\n- 如果两个对象是由相同类型的对象初始化的，则产生 `true`。\n- 对于与两个不同的 lambda 表达式相关的（闭包）类型，即使它们定义了相同的行为，也会产生\
  \ `false`。\n- 例如：\n\n点击此处代码图像\n\n```cpp\nauto a = nullptr;\nauto b = nullptr;\n\
  is_same_v<decltype(a),decltype(b)>     // yields true\n\nusing A = int;\nis_same_v<A,int>\
  \                      // yields true\n\nauto x = [] (int) {};\nauto y = x;\nauto\
  \ z = [] (int) {};\nis_same_v<decltype(x),decltype(y)>  // yields true\nis_same_v<decltype(x),decltype(z)>\
  \  // yields false\n```\n\n- 实现细节请参见第 410 页的章节 19.3.3。\n\n### `std::is_base_of<B,\
  \ D>::value`\n\n- 如果 `B` 是 `D` 的基类或 `B` 与 `D` 是同一个类，则产生 `true`。\n- 无论类型是否经过 cv 修饰、是否使用私有或保护继承、`D`\
  \ 是否有多个类型为 `B` 的基类，或者 `D` 是否通过多条继承路径（通过虚继承）拥有 `B` 作为基类，都没有影响。\n- 如果至少有一个类型是 `union`，则产生\
  \ `false`。\n- 要求类型 `D` 必须是完全类型（参见第 154 页的章节 10.3.1）、与 `B`  own 相同（忽略任何 `const`/`volatile`\
  \ 修饰），或者既不是 `struct` 也不是 `class`。\n- 例如：\n\n点击此处代码图像\n\n```cpp\nclass B {\n};\n\
  class D1 : B {\n}; \nclass D2 : B {\n}; \nclass DD : private D1, private D2 {\n\
  };\n\nis_base_of_v<B, D1>       // yields true\nis_base_of_v<B, DD>       // yields\
  \ true\nis_base_of_v<B const, DD>  // yields true\nis_base_of_v<B, DD const>  //\
  \ yields true\nis_base_of_v<B, B const>   // yields true\nis_base_of_v<B&, DD&>\
  \     // yields false (no class type)\nis_base_of_v<B[3], DD[3]>  // yields false\
  \ (no class type)\nis_base_of_v<int, int>     // yields false (no class type)\n\
  ```\n\n### `std::is_convertible<FROM, TO>::value`\n\n- 如果类型 `FROM` 的表达式可以转换为类型 `TO`，则产生\
  \ `true`。因此，以下内容必须有效的：^(11)\n\n点击此处代码图像\n\n```cpp\nTO test() {\n  return std::declval<FROM>();\n\
  }\n```\n\n- `FROM` 之上的引用仅用于确定表达式的值类别；底层类型即为源表达式。\n- 注意 `is_constructible` 并不总是意味着\
  \ `is_convertible`。例如：\n\n点击此处代码图像\n\n```cpp\nclass C {\npublic:\n  explicit C(C\
  \ const); // no implicit copy\n};\nis_constructible_v<C,C> // yields true\nconvertible_v<C,C>\
  \ // yields false\n```\n\n- 要求给定的类型是完全类型（参见第 154 页的章节 10.3.1）、（cv 修饰的）`void` 或或大小的数组。\n\
  - 注意 `is_constructible`（参见第 719 页的章节 D.3.2）和 `is_assignable`（参见第 721 页的章节 D.3.2）的源类型和目标类型顺序不同。\n\
  - 实现细节请参见第 428 页的章节 19.5。\n\n### D.4 类型构造\n\n表 D.6 中列出的特性允许我们从其他类型构造新类型。\n\n| 类型特性\
  \ | 效果 |\n| --- | --- |\n| `remove_const<T>` | 移除 `const` |\n| `remove_volatile<T>`\
  \ | 移除 `volatile` |\n| `remove_cv<T>` | 移除 `const` 和 `volatile` |\n| `add_const<T>`\
  \ | 添加 `const` |\n| `add_volatile<T>` | 添加 `volatile` |\n| `add_cv<T>` | 添加 `const`\
  \ 和 `volatile` |\n| `make_signed<T>` | 生成有符号类型 |\n| `make_unsigned<T>` | 生成无符号类型\
  \ |\n| `remove_reference<T>` | 移除引用 |\n| `add_lvalue_reference<T>` | 添加左值引用 |\n\
  | `add_rvalue_reference<T>` | 添加右值引用 |\n| `remove_pointer<T>` | 移除指针 |\n| `add_pointer<T>`\
  \ | 添加指针 |\n| `remove_extent<T>` | 移除数组维度 |\n| `remove_all_extents<T>` | 移除所有数组维度\
  \ |\n| `decay<T>` | 转换为原始值类型 |\n\n*表 D.6. 用于类型构造的特性*\n\n### `std::remove_const<T>::type`\n\
  ### `std::remove_volatile<T>::type`\n### `std::remove_cv<T>::type`\n\n- 产生不带 `const`\
  \ 或/或 `volatile` 的类型 `T`。\n- 注意 `const` 指针是经过 cv 修饰的，而指向 `const` 的引用不是 `const` 类型。例如：\n\
  \n点击此处代码图像\n\n```cpp\nremove_cv_t<int>               // yields int\nremove_const_t<int\
  \ const>       // yields int\nremove_cv_t<int const volatile>     // yields int\n\
  remove_const_t<int const&>      // yields int& (only refers to int)\n```\n\n显然，构造特性的应用顺序很重要：^(12)\n\
  \n点击此处代码图像\n\n```cpp\nremove_const_t<remove_reference_t<int>> // yields int\nremove_const_t<remove_reference_t<int\
  \ const>> // yields int\n```\n\n相反，我们可能倾向于使用 `decay`，但它也会转换数组和函数类型（参见第 731 页的章节\
  \ [D.4]）：\n\n点击此处代码图像\n\n```cpp\ndecay_t<int const&> // yields int\n```\n\n### `std::add_const<T>::type`\n\
  ### `std::add_volatile<T>::type`\n### `std::add_cv<T>::type`\n\n- 产生带有顶级 `const`\
  \ 或或 `volatile` 修饰符的 `T`。\n- 将这些特性之一应用于引用类型或函数类型没有效果。例如：\n\n点击此处代码图像\n\n```cpp\n\
  add_cv_t<int>                   // yields const volatile\nadd_cv_t<int const>  \
  \            // yields const volatile\nadd_cv_t<int const volatile>     // yields\
  \ const volatile\nadd_const_t<int>                 // yields int const\nadd_const_t<int\
  \ const>            // yields int const\nadd_const_t<int&>               // yields\
  \ int&\n```\n\n\n\n\n\n`std::make_unsigned<T>::type`\n\n- 产生 `T` 对应的有符号/无符号类型。\n\
  - 要求 `T` 是一个枚举类型或除 `bool` 以外的（带有 cv 限定的）整数类型。所有其他类型都会导致未定义行为（参见第 442 页的第 19.7.1\
  \ 节，在其中讨论了如何避免这种未定义行为）。\n- 将这些属性之一应用于引用类型或函数类型没有效果，而指向 `const` 类型的非 `const` 指针或引用是不带\
  \ `const` 限定的。例如：\n\n点击此处查看代码图像\n\n```cpp\nmake_unsigned_t<char>             //\
  \ yields unsigned char\nmake_unsigned_t<int>             // yields unsigned int\n\
  make_unsigned_t<int const&>      // undefined behavior\n```\n\n`std::remove_reference<T>::type`\n\
  \n- 产生引用类型 `T` 所引用的类型（如果 `T` 本不是引用类型，则产生 `T` 本身）。\n- 例如：\n\n点击此处查看代码图像\n\n```cpp\n\
  remove_reference_t<int>          // yields int\nremove_reference_t<int const>  \
  \   // yields int const\nremove_reference_t<int const&>   // yields int const\n\
  remove_reference_t<int&&>         // yields int\n```\n\n- 注意，引用类型本身并不是 `const` 类型。出于此原因，应用类型构造属性的顺序很重要：^(13)\n\
  \n点击此处查看代码图像\n\n```cpp\nremove_const_t<remove_reference_t<int const&>>  // yields\
  \ int\nremove_reference_t<remove_const_t<int const&>>  // yields int const\n```\n\
  \n- 反地，我们可能倾向于使用 `std::decay<>`，然而它也会数组和函数类型转换为相应的指针类型（参见第 731 页的第 D.4 节）：\n\n点击此处查看代码图像\n\
  \n```cpp\ndecay_t<int const&>  // yields int\n```\n\n- 实现细节请参见第 404 页的第 19.3.2 节。\n\
  \n`std::add_lvalue_reference<T>::type`\n\n`std::add_rvalue_reference<T>::type`\n\
  \n- 如果 `T` 是可引用类型，则产生指向 `T` 的左值引用或右值引用。\n- 如果 `T` 不是可引用类型，则产生 `T`（即（带有 cv 限定的）`void`\
  \ 或带有 `const`、`volatile`、`&` 和/或 `&&` 限定的函数类型）。\n- 注意，如果 `T` 已经是引用类型，这些属性将使用引用折叠规则（参见第\
  \ 277 页的第 15.6.1 节）：只有在使用 `add_rvalue_reference` 且 `T` 是右值引用时，结果才是右值引用。\n- 例如：\n\
  \n点击此处查看代码图像\n\n```cpp\nadd_lvalue_reference_t<int>               // yields int&\n\
  add_rvalue_reference_t<int>               // yields int&&\nadd_rvalue_reference_t<int\
  \ const>          // yields int const&&\nadd_lvalue_reference_t<int const&>    \
  \    // yields int const&\nadd_rvalue_reference_t<int const&>         // yields\
  \ int const& (reference collapsing rules)\nadd_rvalue_reference_t<remove_reference_t<int\
  \ const&>>  // yields int&&\nadd_lvalue_reference_t<void>               // yields\
  \ void\nadd_rvalue_reference_t<void>               // yields void\n```\n\n- 实现细节请参见第\
  \ 405 页的第 19.3.2 节。\n\n`std::remove_pointer<T>::type`\n\n- 产生指针类型 `T` 所指向的类型（如果\
  \ `T` 不是指针类型，则产生 `T` 本身）。\n- 例如：\n\n点击此处查看代码图像\n\n```cpp\nremove_pointer_t<int>\
  \          // yields int\nremove_pointer_t<int const>     // yields int const\n\
  remove_pointer_t<int const*>   // yields int const\n```\n\n`std::add_pointer<T>::type`\n\
  \n- 产生指向 `T` 的指针类型，或者在 `T` 是引用类型的情况下，产生指向其引用类型的指针类型。\n- 如果没有这种类型（对于带有 cv 限定的 `void`），则产生\
  \ `T`。\n- 例如：\n\n点击此处查看代码图像\n\n```cpp\nadd_pointer_t<void>                     \
  \        // yields void*\nadd_pointer_t<int const>                        // yields\
  \ int*\nadd_pointer_t<int>&                             // yields int*\nadd_pointer_t<int[3]>\
  \                           // yields int (*)[3]\nadd_pointer_t<void()>        \
  \                  // yields void(*)()\nadd_pointer_t<void(int)>               \
  \        // yields void(*)()\nadd_pointer_t<void(int) const                  //\
  \ yields void(*)() const\n```\n\n`std::remove_extent<T>::type`\n\n`std::remove_all_extents<T>::type`\n\
  \n- 对于数组类型，`remove_extent` 产生其直接元素类型（可能是数组），而 `remove_all_extents` 消除所有“层”以产生元素类型。如果\
  \ `T` 不是数组类型，则产生 `T`。\n- 指针没有维度。通常情况下，函数也没有。参见第 704 页的第 D.2 节。\n- 例如：\n\n点击此处查看代码图像\n\
  \n```cpp\nremove_extent_t<int>                            // yields int\nremove_extent_t<int[10]>\
  \                       // yields int\nremove_extent_t<int[5][10]>>            \
  \         // yields int[5]\nremove_all_extents_t<int>                        //\
  \ yields int\nremove_all_extents_t<int[10]>                   // yields int\nremove_all_extents_t<int[5][10]>>\
  \                 // yields int\n```\n\n`std::decay<T>::type`\n\n- 产生 `T` 的退化类型。\n\
  - 详细而言，对于类型 `T` 执行以下转换：\n- 首先应用 `remove_reference`（参见 D.4）。\n- 如果结果是数组类型，则产生指向直接元素的指针（参见第\
  \ 107 页的第 7.1 节）。\n- 否则，如果结果是函数类型，则产生该函数的 `add_pointer` 产生的类型（参见第 159 页的第 11.1.1\
  \ 节）。\n- 否则，产生该结果但不带有任何顶层 `const`/`volatile` 限定符。\n- `decay<>` 模拟按值传递参数或初始化 `auto`\
  \ 对象时的类型转换。\n- `decay<>` 特别适用于可能被引用类型替换但用于确定返回类型或另一个函数的参数类型的模板参数。参见第 12 页的第 1.3.2\
  \ 节以及第 120 页的第 7.6 节，其中有讨论和使用 `std::decay<>` 的示例（后者带有实现 `std::make_pair<>` 的历史）。\n\
  - 例如：\n\n点击此处查看代码图像\n\n```cpp\ndecay_t<int const&>  // yields int\ndecay_t<int const[4]>\
  \  // yields int const*\nvoid foo();\ndecay_t<decltype(foo)>  // yields void(*)()\n\
  ```\n\n\n\n\n\n表 D.7 列出了所有剩余的类型性（type traits）。它们查询特殊属性或提供更复杂的类型转换。\n\n| 类型性 (Trait)\
  \ |  |\n| --- | --- |\n| `enable_if<B,T=void >` | 仅当 `bool` `B` 为 `true` 时产生类型 `T`\
  \ |\n| `conditional<B,T,F>` | 当 `bool` `B` 为 `true` 时产生类型 `T`，否则产生类型 `F` |\n| `common_type<T1,…\
  \ >` | 所有传入类型的公共类型 |\n| `aligned_storage<Len>` | 具有默认对齐的 `Len` 字节类型 |\n| `aligned_storage<Len,\
  \ Align>` | 根据 `size_t` 类型 `Align` 的除数对齐的 `Len` 字节类型 |\n| `aligned_union<Len, Types…>`\
  \ | 为 `Types…` 联合体对齐的 `Len` 字节类型 |\n\n*表 D.7. 其他类型性*\n\n#### `std::enable_if< cond\
  \ >::type`\n\n#### `std::enable_if< cond, T >::type`\n\n- 如果 `cond` 为 `true`，则在其成员\
  \ `type` 中产生 `void` 或 `T`。否则，不定义成员 `type`。\n- 因为当 `cond` 为 `false` 时未定义 `type` 成员，所以该类型性可以且通常用于根据给定条件禁用或\
  \ SFINAE 掉一个函数模板。\n- 细节和第一个示例请参阅第 98 页的 6.3 节。另一个使用参数包的示例请参阅第 735 页的 D.6 节。\n- 关于\
  \ `std::enable_if` 如何实现的细节，请参阅第 469 页的 20.3 节。\n\n#### `std::conditional< cond,\
  \ T, F >::type`\n\n- 如果 `cond` 为 `true`，则产生 `T`，否则产生 `F`。\n- 这是在第 440 页的 19.7.1\
  \ 节引入的类型性 `IfThenElseT` 的标准版本。\n- 注意，与普通的 C++ if-then-else 语句不同，“then”和“else”分支的模板参数在选择之前都会被评估，因此这两个分支都不得包含错误的代码，否则程序可能会格式错误。因此，你可能需要添加一层间接，以避免“then”和“else”分支中的表达式在分支未被使用时被评估。第\
  \ 440 页的 19.7.1 节演示了具有相同行为的类型性 `IfThenElseT`。\n- 示例请参阅第 171 页的 11.5 节。\n- 关于 `std::conditional`\
  \ 如何实现的细节，请参参阅第 440 页的 19.7.1 节。\n\n#### `std::common_type< T… >::type`\n\n- 产生给定类型\
  \ `T1`, `T2`, …, `Tn` 的“公共类型”。\n- 公共类型的计算比我们在这个附录中涵盖的要复杂。简单来说，两个类型 `U` 和 `V` 的公共类型是条件运算符\
  \ `?:` 在其第二个和第三个操作数为这些类型 `U` 和 `V` 时所产生的类型（引用类型仅用于确定两个操作数的值类别）；如果这无效，则没有公共类型。该结果随后应用了\
  \ `decay_t`（参阅第 731 页）。这种默认计算可以被用户对 `std::common_type<U, V>` 的特化所覆盖（在 C++ 标准库中，针对持续时间和时间点存在部分特化）。\n\
  - 如果没有给出类型或不存在公共类型，则没有定义 `type` 成员，因此使用它是一个错误（这可能会 SFINAE 掉使用它的函数模板）。\n 如果 如果给出一个类型类型，结果是对该类型应用\
  \ `decay_t`。\n- 对于两个以上的类型，`common_type` 递归地将前两个类型 `T1` 和 `T2` 替换为它们的公共类型。如果该过程在何时失败，则没有公共类型。\n\
  - 在处理公共类型时，传入的类型是退化的（decays），因此该类型性始终产生退化类型（参阅第 731 页的 D.4 节）。\n- 关于该类型性的应用的讨论和示例请参阅第\
  \ 12 页的 1.3.3 节。\n- 该类型性主模板的核心通常通过如下内容实现（这里仅使用两个参数）：\n\n```cpp\ntemplate<typename\
  \ T1, typename T2>\nstruct common_type<T1,T2> {\n    using type = decay_t<decltype(std::declval<T1>()\
  \ ?: std::declval<T2>())>;\n};\n```\n\n#### `std::aligned_union< Len, Types… >`\n\
  \n- 为 `Types…` 联合体对齐的 `Len` 字节类型\n\n#### `std::aligned_storage< Len >`\n\n- 具有默认对齐的\
  \ `Len` 字节类型\n\n#### `std::aligned_storage< Len, Align >`\n\n- 根据 `size_t` 类型 `Align`\
  \ 的除数对齐的 `Len` 字节类型\n\n\n\n\n\n```cpp\nstatic_assert(std::disjunction<std::is_constructible<X,\
  \ int>,\n                              std::is_constructible<Y, int>>{},\n     \
  \         \"can’t init X or Y from int\");\n```\n\n另一个应用是通过逻辑组合现有的类型特征（type traits）来定义新类型特性的简单方法。例如，你可以轻松地定义一个特征，用于检查一个类型是否“不是指针”（既不是指针，不是成员指针，也不是空指针）：\n\
  \n点击此处查看代码图片\n\n```cpp\ntemplate<typename T>\nstruct isNoPtrT : std::negation<std::disjunction<std::is_null_pointer<T>,\n\
  \                                                 std::is_member_pointer<T>,\n \
  \                                                std::is_pointer<T>>>\n{\n};\n```\n\
  \n在这里我们不能使用逻辑运算符，因为我们组合的是相应的特征类。通过这种定义，以下操作是可能的：\n\n点击此处查看代码图片\n\n```cpp\nstd::cout\
  \ << isNoPtrT<void*>::value << '\\n';              //false\nstd::cout << isNoPtrT<std::string>::value\
  \ << '\\n';      //true\nauto np = nullptr;\nstd::cout << isNoPtrT<decltype(np)>::value\
  \ << '\\n';     //false\n```\n\n配合相应的变量模板：\n\n点击此处查看代码图片\n\n```cpp\ntemplate<typename\
  \ T>\nconstexpr bool isNoPtr = isNoPtrT<T>::value;\n```\n\n我们可以这样写：\n\n点击此处查看代码图片\n\
  \n```cpp\nstd::cout << isNoPtr<void*> << '\\n';  //false\nstd::cout << isNoPtr<int>\
  \ << '\\n';   //true\n```\n\n作为最后一个例子，以下函数模板仅在当所有的模板参数既不是类也不是 union 体时才会启用：\n\n\
  点击此处查看代码图片\n\n```cpp\ntemplate<typename… Ts>\nstd::enable_if_t<std::conjunction_v<std::negation<std::is_class<Ts>>…,\n\
  \                                  std::negation<std::is_union<Ts>>…\n         \
  \                         >>\nprint(Ts...)\n{\n   …\n}\n```\n\n注意，省略号放在每个否定操作符后面，以便它作用于参数包中的每个元素。\n\
  \n- `conjunction<B...>` 针对布尔特征 `B...` 的逻辑*与*（自 C++17 起引入）\n- `disjunction<B...>`\
  \ 针对布尔特征 `B...` 的逻辑*或*（自 C++17 起引入）\n- `negation<B>` 针对布尔特征 `B` 的逻辑*非*（自 C++17 起引入）\n\
  \n| 特征 | 效果 |\n| --- | --- |\n| `conjunction<B...>` | 针对布尔特征 `B...` 的逻辑*与*（自 C++17\
  \ 起引入） |\n| `disjunction<B...>` | 针对布尔特征 `B...` 的逻辑*或*（自 C++17 起引入） |\n| `negation<B>`\
  \ | 针对布尔特征 `B` 的逻辑*非*（自 C++17 起引入） |\n\n### 表 D.8 用于组合其他特征的类型特征\n\n`std::conjunction<B...>::value`\n\
  判断所有传入的布尔特征 `B...` 是否产生 `true`。逻辑上对传入的特征分别应用运算符 `&&` 或 `||`。两种特征都具有短路特性（在遇到第一个 `false`\
  \ 或 `true` 后停止评估）。自 C++17 可用。\n\n`std::disjunction<B...>::value`\n判断传入的布尔特征 `B...`\
  \ 是否至少有一个产生 `true`。\n\n`std::negation<B>::value`\n判断传入的布尔特征 `B` 是否产生 `false`。逻辑上对传入的特征应用运算符\
  \ `!`。自 C++17 可用。\n\n### D.7 其他工具\n\nC++ 标准库提供了其他几个对于编写可移植泛型代码非常有用的工具。\n\n| 特征 |\
  \ 效果 |\n| --- | --- |\n| `declval<T>()` | 返回一个类型的“对象”（右值引用），而不对其进行构造 |\n| `addressof(r)`\
  \ | 返回对象或函数的地址，即使该类型重载了 `operator&` |\n\n`std::declval<T>()`\n定义在头文件 `<utility>`\
  \ 中。它在不调用任何构造函数或进行初始化的情况下，返回任何类型的“对象”或函数。如果 `T` 是 `void`，则返回类型为 `void`。这可以用在未求值的表达式中处理任何类型的对象或函数。它的简单定义如下：\n\
  \n```cpp\ntemplate<typename T>\nrvalue_reference_t<T> declval() noexcept;\n```\n\
  因此：\n- 如果 `T` 是基本类型或右值引用，它产生 `T&&`。\n- 如果 `T` 是左值引用，它产生 `T&`。\n- 如果 `T` 是 `void`，它产生\
  \ `void`。\n详情见第 415 页的节 19.3.4，其用法的示例见第 166 页的节 11.2.3 以及第 732 页的节 D.5 中的 `common_type<>`\
  \ 类型特征。\n\n`std::addressof(r)`\n定义在头文件 `<memory>` 中。即使该类型重载了 `operator&`，它也能返回对象或函数\
  \ `r` 的地址。详情见第 166 页的节 11.2.2。\n\n¹ 在 C++17 之前，标准并不包含别名模板 `bool_constant<>`。然而，`std::true_type`\
  \ 和 `std::false_type` 在 C++11 和 C++14 中是存在的，并且分别直接指定为 `integral_constant<bool,true>`\
  \ 和 `integral_constant<bool,false>`。\n² C++ 标准化委员会考虑过一项 C++17 提案，要求违反类型特征的前置条件将始终导致编译时错误。然而，由于某些类型特征目前的要求比严格需要的更强（例如*总是*要求完整类型），这一更改被推迟了。\n\
  ³ 感谢 Howard Hinnant 在 [`http://howardhinnant.github.io/TypeHiearchy.pdf](http://howardhinnant.github.io/TypeHiearchy.pdf)\
  \ 中提供了这种层次结构。\n⁴ 在 C++14 之前，唯一的例外是 `nullptr` 的类型 `std::nullptr_t`，其所有主类型分类工具都返回\
  \ `false`，因为 `is_null_pointer<>` 并不是 C++11 的一部分。\n⁵ 这在 C++11 发布后通过核心问题 1059 的解决得到了澄清。\n\
  ⁶ 这在 C++11 发布后通过核心问题 1059 的解决得到了澄清。\n⁷ 注意，聚合体的基类和/或数据成员并不必须是聚合体。在 C++14 之前，聚合类类型不能有默认成员初始化。在\
  \ C++17 之前，聚合体不能有公共基类。\n⁸ 在 C++17 标准化过程后期，`is_invocable` 从 `is_callable` 重命名而来。\n\
  ⁹ 关于 `std::declval` 的效果见第 166 页的节 11.2.3。\n¹⁰ 感谢 Daniel Krügler 指出这一点。\n\n\n\n\n\
  \n多年来，C++ 语言设计者一直在探索如何限制模板参数。例如，在我们原型的 `max()` 模板中，我们希望预先说明，它不应该被用于那些无法使用小于运算符进行比较的类型。其他模板可能要求在实例化时使用的类型是有效的“迭代器”类型（基于该术语的某种正式定义）或有效的“算术”类型（这可能是一个比内置算术类型集合更广泛的内涵）。\n\
  \n`concept`（概念）是对一个或多个模板参数的具名的约束集。在 C++11 开发期间，曾为其设计了一套非常丰富的概念系统，但将该功能集成到语言规范中最终消耗了太多的委员会资源，该版本的概念最终从\
  \ C++11 中被删除了。一段时间后，人们提出了该特性的不同设计，看起来它最终将以某种形式进入语言。事实上，就在本书出版前不久，标准化委员会投票将新设计集成到\
  \ C++20 的草案中。在本附录中，我们描述了该较新设计的主要元素。\n\n我们已经在本书的正文中阐述了必要性并展示了概念的一些应用：\n\n* 第 103\
  \ 页 的第 6.5 节说明了如何使用需求和概念，仅当模板参数可以转换为字符串时才启用构造函数（以避免误将构造函数当作拷贝构造函数）。\n* 第 377 页 的第\
  \ 18.4 节展示了如何使用概念对表示几何对象的类型进行指定并要求约束。\n\n## E.1 使用概念\n\n让我们首先检查如何在客户端代码中（即定义模板但并不一定定义应用于该模板参数的概念的代码）使用概念。\n\
  \n### 处理需求（Requirements）\n\n这是我们带有约束的惯用双参数 `max()` 模板：\n\n点击此处查看代码图像\n\n```cpp\n\
  template<typename T> requires LessThanComparable<T>\n\nT max(T a, T b) {\n  return\
  \ b < a ? a : b;\n}\n```\n\n唯一的新增是 `requires 子句`\n\n点击此处查看代码图像\n\n```cpp\nrequires\
  \ LessThanComparable<T>\n```\n\n这假设我们之前已经（最可能是通过包含头文件）声明了 `concept` `LessThanComparable`。\n\
  \n这种概念是一个布尔谓词（即产生 `bool` 类型值的表达式），其求值结果为常量表达式。这非常重要，因为约束是在编译时评估的，因此在生成的代码方面不会产生开销：这个受约束的模板产生的代码与我们在其他地方讨论的无约束版本一样快。\n\
  \n当我们尝试使用此模板时，在 `requires` 子句被求值并发现产生 `true` 值之前，它不会被实例化。如果它产生了 `false` 值，可能会发出一个错误，说明需求的哪个部分失败了（或者可能会选择一个不满足该要求的匹配重载模板）。\n\
  \n`requires` 子句并不`必须`以概念的形式表示（尽管这样做是良好的实践，并且倾向于产生更好的诊断信息）：任何布尔常量表达式都可以使用。例如，如第 103\
  \ 页 的第 6.5 节所述，以下代码确保了模板构造函数不能被用作拷贝构造函数：\n\n点击此处查看代码图像\n\n```cpp\nclass Person\n\
  {\n  private:\n    std::string name;\n  public:\n    template<typename STR>\n  \
  \  requires std::is_convertible_v<STR,std::string>\n    explicit Person(STR&& n)\n\
  \     : name(std::forward<STR>(n)) {\n        std::cout << \"TMPL-CONSTR for ’\"\
  \ << name << \"’\\n\";\n    }\n    ...\n};\n```\n\n在这里，不使用具名概念（参见第 742 页 的第 E.2\
  \ 节）可能是恰当的，因为使用了临时布尔表达式（在本例中使用了类型特性）——`std::is_convertible_v<STR,std::string>` 来解决模板构造函数可能被用作拷贝构造函数的问题。如何组织概念和约束的细节仍然\
  \ C++ 社区活跃的探索领域，并且可能会随着时间演变，但人们似乎有一个普遍共识：概念应该反映代码的含义，而不是它是否可以通过编译。\n\n### 处理多个需求\n\
  \n在上面的示例中，只有一个需求，但拥有多个需求并不罕见。例如，人们可能会想象一个描述元素序列的 `Sequence` 概念，以及一个在给定序列时返回第一个出现项的模板。该模板可以定义如下：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<typename T> requires Sequence<T> && EqualityComparable<typename\
  \ T::value_type>\ntypename T::iterator find(T const& seq)\n{\n  return std::find(seq.begin(),\
  \ seq.end());\n}\n```\n\n使用 `||` 表达“备选”需求也是可能的。这很少需要，且不应该太随意使用，因为在 `requires` 子句中过度使用\
  \ `||` 运算符可能会增加编译负担。然而，在某些情况下它可能非常方便。例如：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename\
  \ T> requires Integral<T> || FloatingPoint<T>\nT power(T b, T p);\n```\n\n单个需求也可以涉及多个模板参数，且单个概念可以表示针对多个模板参数的谓词。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<typename T, typename U> requires SomeConcept<T,\
  \ U>\nauto f(T x, U y) -> decltype(x+y);\n```\n\n因此，概念可以在类型参数之间施加关系。\n\n### 单个需求的简写符号\n\
  \n为了减轻 `requires` 子句的符号开销，当约束一次仅涉及一个参数时，可以使用语法快捷方式。这可能通过使用我们上面受约束 `max()` 声明的简写来说得最清楚：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<LessThanComparable T>\nT max(T a, T b) {\n  return\
  \ b < a ? a : b;\n}\n```\n\n这在功能上与之前的 `max()` 定义等价。然而，在重新声明受约束的模板时，必须使用与原始声明相同的形式（从这个意义上讲，它是功能等价的，但并不相同）。\n\
  \n我们可以在 `find()` 模板的两个需求中的一个使用相同的简写：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<Sequence\
  \ Seq>\nrequires EqualityComparable<typename Seq::value_type>\ntypename Seq::iterator\
  \ find(Seq const& seq, typename Seq::value_type const& val)\n{\n  return std::find(seq.begin(),\
  \ seq.end(), val);\n}\n```\n\n再次，这与之前针对序列类型的 `find()` 模板定义等价。\n\n\n\n\n\n### E.2\
  \ 定义概念\n\n概念（Concepts）非常类似于 `bool` 类型的 `constexpr` 变量模板，但没有显式指定类型：\n\n点击此处查看代码图像\n\
  \n```cpp\ntemplate<typename T> concept LessThanComparable = … ;\n```\n\n在这里，`…`\
  \ 或许替换为使用各种变体（traits）的表达式，用来建立类型 `T` 是否确实可以使用 `<` 运算符进行比较，但概念提议提供了一个简化此任务的工具：`requires\
  \ expression`（它与上述描述的 `requires clause` 不同）。以下是概念的完整定义可能如下：\n\n点击此处查看代码图像\n\n```cpp\n\
  template<typename T>\n\nconcept LessThanComparable = requires(T x, T y) {\n  { x\
  \ < y } -> bool;\n};\n```\n\n注意 `requires expression` 如何可以包含一个可选的参数列表：这些参数永远不会被实际参数替换，而是可以被认为一组“哑变量”，用于在\
  \ `requires expression` 的体中表达需求。在这种情况下，只有一个需求由以下短语表达：\n\n点击此处查看代码图像\n\n```cpp\n\
  { x < y } -> bool;\n```\n\n这种语法意味着 (a) 表达式 `x < y` 在 SFINAE 意义上是有效的，且 (b) 该表达式的结果必须转换为\
  \ `bool`。在这种形式的短语中，可以在 `->` 标记之前插入 `noexcept` 关键字，以表示大括号中的表达式已知不会抛出异常（即应用于该表达式的\
  \ `noexcept(`…`)` 应该为 `true`）。如果不需要此类约束，则短语的隐式转换部分（即 `->` *type*）可以完全省略；如果只需要检查表达式的有效性，则可以省略大括号，使短语简化为仅有的表达式。例如，\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<typename T>\n\nconcept Swappable = requires(T x,\
  \ T y) {\n  swap(x, y);\n};\n```\n\nRequires expressions 还可以表达对关联类型的需求。考虑我们之前假设的\
  \ `Sequence` 概念：除了要求像 `seq.begin()` 这样的表达式必须有效外，它还需要相应的序列迭代器类型。可以通过如下方式表达：\n\n点击此处查看代码图像\n\
  \n```cpp\ntemplate<typename Seq>\n\nconcept Sequence = requires(Seq seq) {\n  typename\
  \ Seq::iterator;\n  { seq.begin() } -> Seq::iterator;\n  …\n};\n```\n\n因此，短语 `typename`\
  \ *type*`;` 表达了对 *type* 存在的需求（这被称为*类型需求*）。在示例示例中，必须存在的类型是概念模板参数的成员，但情况并不总是如此。例如，我们可以要求存在一个类型\
  \ `IteratorFor<Seq>`，这可以通过以下需求短语来实现：\n\n点击此处查看代码图像\n\n```cpp\n…\n\ntypename IteratorFor<Seq>;\n\
  \n…\n```\n\n上述 `Sequence` 概念定义显示了如何通过一个接一个列出短语来组合它们。存在第三类需求短语，它仅是调用另一个概念。例如，假设我们有一个关于*迭代器*（iterator）概念的概念。我们希望我们的\
  \ `Sequence` 概念不仅要求 `Seq::iterator` 是一个类型，还要求该类型满足 `Iterator` 概念的约束。表达方式如下：\n\n\
  点击此处查看代码图像\n\n```cpp\ntemplate<typename Seq>\n\nconcept Sequence = requires(Seq\
  \ seq) {\n  typename Seq::iterator;\n  requires Iterator<typename Seq::iterator>;\n\
  \  { seq.begin() } -> Seq::iterator;\n  …\n};\n```\n\n也就是说，我们只需要在 `requires expressions`\
  \ 中添加 `requires` 子句（这种短语被称为*嵌套需求*）。\n\n### E.3 基于约束的重载\n\n让我们假设我们已经定义了概念 `IntegerLike<T>`\
  \ 和 `StringLike<T>`，并且决定编写模板来打印这两个概念任一类型的值。我们可以这样做：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<IntegerLike\
  \ T> void print(T val);  *//* #1\n\ntemplate<StringLike T> void print(T val);  \
  \  *//* #2\n```\n\n如果不是因为不同的约束，这两个声明将声明同一个模板。然而，约束是模板签名的一部分，允许模板在重载解析期间被区分开来。特别是，如果发现两个模板都是可行的候选，但只有模板\
  \ `#1` 满足了它的约束，那么重载将选择满足约束的模板。例如，假设 `int` 满足 `IntegerLike` 且 `std::string` 满足 `StringLike`，但反之则不然：\n\
  \n点击此处查看代码图像\n\n```cpp\nint main()\n{\n  printf(1);      *//选择模板* #1\n  printf(\"\
  1\"s);    *//选择模板* #2\n}\n```\n\n我们可以想象一种支持整数类计算的字符串类型。例如，如果 `\"6\"_NS` 和 `\"7\"\
  _NS` 是该类型的两个字面量，那么乘这些字面量产生的值与 `\"42\"_NS` 相同。这种类型可能同时满足 `IntegerLike` 和 `StringLike`，因此诸如\
  \ `print(\"42\"_NS)` 的调用将产生歧义。\n\n#### E.3.1 约束包含\n\n我们首次对通过约束区分的函数模板重载进行讨论，涉及的是预期通常为互斥的约束。例如，在我们的\
  \ `IntegerLike` 和 `StringLike` 示例中，我们可以想象同时满足这两个概念的类型，但我们预计这种情况足够罕见，使得我们重载的 `print`\
  \ 模板仍然有用。\n\n然而，某些概念集合绝不是互斥的，但其中一个“包含”（subsumes）另一个。这里的经典例子是标准库的迭代器类别：输入迭代器、前向迭代器、双向迭代器、随机访问迭代器，以及在\
  \ C++17 中的连续迭代器。(1)假设我们有一个 `ForwardIterator` 的定义：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename\
  \ T>\n  concept ForwardIterator = …;\n```\n\n那么，“更精细”的概念 `BidirectionalIterator`\
  \ 可能定义如下：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename T>\n  concept BidirectionIterator\
  \ =\n    ForwardIterator<T> &&\n    requires (T it) {\n      { --it } -> T&\n  \
  \  };\n```\n\n也就是说，我们在前向迭代器已经提供的能力之上增加了应用前缀 `operator--` 的能力。\n\n现在考虑 `std::advance()`\
  \ 算法（我们将将其称为 `advanceIter()`），它使用受约束模板对前向迭代器和双向迭代器进行了重载：\n\n点击此处查看代码图像\n\n```cpp\n\
  template<ForwardIterator T, typename D>\n  void advanceIter(T& it, D n)\n  {\n \
  \   assert(n >= 0);\n    for (; n != 0; --n) { ++it; }\n  }\n\ntemplate<BidirectionalIterator\
  \ T, typename D>\n  void advanceIter(T& it, D n)\n  {\n    if (n > 0) {\n      for\
  \ (; n != 0; --n) { ++it; }\n    } else if (n < 0) {\n      for (; n != 0; ++n)\
  \ { --it; }\n    }\n  }\n```\n\n\n\n当使用普通的正向迭代器（即非双向迭代器）调用 `advanceIter()` 时，只有第一个模板的约束会被满足，且重载解析是直观的：系统会选择第一个模板。然而，双向迭代器会同时满足两个模板的约束。在这种情况下，如果重载解析没有没有倾向于某一个候选者，它将倾向于那些约束\
  \ `subsume`（包含）另一个候选者约束的候选者，而反之则不然。包含的精确定义略超出了本入门附录的范围，但只需知道：如果一个约束 `C2<Ts…>` 是通过要求约束\
  \ `C1<Ts…>` 以及额外的约束（即 `&&`）来定义的，那么前者就包含后者。显然，在我们的示例中，`BidirectionalIterator<T>`\
  \ 包含了 `ForwardIterator<T>`，因此当用双向迭代器调用时，会优选第二个 `advanceIter()` 模板。\n\n### E.3.2\
  \ 约束与标签分发\n\n回第 467 页的第 20.2 节，我们讨论过使用标签分发（tag dispatching）来重载 `advanceIter()` 算法的问题。这种方法可以用一种相当优雅的方式集成到受约束模板中。例如，输入迭代器和正向迭代器在语法接口上无法区分的。因此，我们可以利用标签来根据其中一个定义另一个：\n\
  \n[点击查看代码图片]\n\n```cpp\ntemplate<typename T>\nconcept ForwardIterator =\n    InputIterator<T>\
  \ &&\n    requires {\n      typename std::iterator_traits<T>::iterator_category;\n\
  \      is_convertible_v<std::iterator_traits<T>::iterator_category,\n          \
  \            std::forward_iterator_tag>;\n    };\n```\n\n如此，`ForwardIterator<T>`\
  \ 包含了 `InputIterator<T>`，我们现在可以对针对这两个迭代器类的受约束的模板进行重载。\n\n### E.4 概念提示\n\n尽管 C++\
  \ 概念（concepts）已经研究了多年，并且实验性实现已经以某种形式可用了十多年，但人们的广泛经验才刚刚开始出现。我们希望这本书的未来版本能够就如何设计受约束的模板库提供更多实用的指导。同时，我们提供三点观察。\n\
  \n#### E.4.1 测试概念\n\n概念是有效的常量表达式布尔谓词。因此，给定一个概念 `C` 和一些符合该概念的类型 `T1, T2, …`，我们可以静态断言这一观察：\n\
  \n[点击查看代码图片]\n\n```cpp\nstatic_assert(C<T1, T2, …>, \"Model failure\");\n```\n\n\
  因此，在设计概念时，建议也设计简单的类型以这种方式测试它们。这包括挑战概念内涵边界的类型，回答如下问题：\n\n- 接口和/或算法是否需要对被建模类型的对象进行拷贝和或移动？\n\
  - 哪些转换是可以接受的？哪些是必要的？\n- 模板所假设的基础操作集是唯一的吗？例如，它可以使用 `*=` 或 `*` 和 `= ` 进行操作？\n\n在这里，原型（archetypes）的概念（见第\
  \ 655 页的第 28.3 节）也很有用。\n\n#### E.4.2 概念的粒度\n\n随着概念成为 C++ 语言的一部分，构建“概念库”是一个自然的想法，就像我们在这些功能可用后就构建了类库和模板库一样。与其他库一样，以各种方式对我们的概念进行分层也是自然的。我们简要讨论了迭代器类别的示例，想象我们可以在构建这些类的同时构建“范围类别”，可能在其之上构建“序列概念”，以此类推，并不是一个巨大的飞跃。\n\
  \n另一方面，我们可能会倾向于在“基础语法”概念之上构建所有概念。例如，我们可以想象：\n\n[点击查看代码图片]\n\n```cpp\ntemplate<typename\
  \ T, typename U>\nconcept Addable =\n    requires (T x, U y) {\n      x + y;\n \
  \   }\n```\n\n然而，不建议这样做，因为这是一个没有明确语义内涵的概念，且不同的类型都会满足它。例如，当 `T` 和 `U` 都是 `std::string`\
  \ 时，或者一个类型是指针而另一个是整数类型时（当然还包括算术类型），它都是被满足的。然而，在这三种情况下，`Addable` 的含义在根本上是不同的（分别为：拼接、迭代器偏移和算术加法的各种变体）。因此，引入这样的概念会导致库的接口模糊，并可能引发奇异的歧义。\n\
  \n相反，概念最好设计为建模问题领域中出现的真实语义概念。以严谨的方式这样做必将改进我们库的整体设计，因为它将为提供给用户的接口带来一致性和清晰性。当标准模板库（STL）加入\
  \ C++ 标准库时，情况正是如此。尽管它没有基于语言的“概念”来工作，但它在设计时充分考虑了概念的概念（例如迭代器和迭代器层次），剩下的就是历史了。\n\n\
  #### E.4.3 二进制兼容性\n\n丰富的 C++ 程序员知道，当某些实体（特别是函数和成员函数）被编译为底层机器码时，与它们关联的是结合了声明名称与实体类型和范围的名称。该名称通常被称为实体的修饰名（mangled\
  \ name），对象代码链接器用它解析对实体的引用（例如来自其他对象文件）。例如，定义如下函数的修饰名：\n\n[点击查看代码图片]\n\n```cpp\nnamespace\
  \ X {\n  void f() {}\n}\n```\n\n在 Itanium C++ ABI 中为 `_ZN1X1fEv`（该编码中的字母 `X` 和 `f`\
  \ 分别来自命名空间名和函数名）。\n\n修饰名在程序内部不会发生“冲突”。因此，如果两个函数可能在程序中并存，它们必须具有不同的修饰名。这意味着，约束必须编码在函数名中（因为除了约束和函数体外，其他方面完全相同的模板特化可能出现在不同的编译单元）。考虑以下两个编译单元：\n\
  \n[点击查看代码图片]\n\n```cpp\n#include <iostream>\n\ntemplate<typename T>\nconcept HasPlus\
  \ = requires (T x, T y) {\n  x+y;\n};\n\ntemplate<typename T> int f(T p) requires\
  \ HasPlus<T> {\n  std::cout << \"TU1\\n\";\n}\n\nvoid g();\n\nint main() {\n  f(1);\n\
  \  g();\n}\n```\n\n以及\n\n[点击查看代码图片]\n\n```cpp\n#include <iostream>\n\ntemplate<typename\
  \ T>\nconcept HasMult = requires (T x, T y) {\n  x*y;\n};\n\ntemplate<typename T>\
  \ int f(T p) requires HasMult<T> {\n  std::cout << \"TU2\\n\";\n}\n\ntemplate int\
  \ f(int);\nvoid g() {\n  f(2);\n}\n```\n\n该程序必须输出\n\n`TU1`\n`TU2`\n\n这意味着 `f()`\
  \ 的两个定义必须以不同的修饰名存在。\n\n\n\n\n## 提议标准化的规范比此要强大得多。它将约束分解为一组“原子组件”（包括 `requires` 表达式的部分），并分析这些集合以查看其中一个是否是另一个的严格子集。\n\
