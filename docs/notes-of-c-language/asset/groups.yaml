    the continue statement is encountered , the flow of control is passed back to
    the condition to be checked. The statements given continue remain unexecuted.
    It is quite natural that the statement given should be executed within the loop
    body. But there may be situation in which some of the statement are undesirable.
    To handle such situation we can use the continue statement. But it should be used
    against an if statement or case statement.


