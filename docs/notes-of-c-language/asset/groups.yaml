  - '[PAGE 26]


    # Referencing Element:-


    Since the element of a 2D array are stored row by row. Therefore to refer an element
    we need to specify both the offset of row from the base address and then from
    the offset of column i.e. it needs two subscription first the row index and the
    second column index.

    ARow[column]=Val;


    # Traversing 2D Array:-


    A matrix can be traversed in two directions-

    Row by row

    Column by column

    In any case it require two loops. The first loop moves through the direction and
    the inner loop is used to specify each element in that different.


    Format:

    Row wise:


    ```

    For(row=0;row<n;row++)

    for(column=0;column<n;column++)

    {work with A[row][column];}}

    ```


    Column wise:


    ```

    For(column=0;column<n;column++)

    {for(row=0;row<n;row++)

    Do work with A[row][column]]}

    ```


    # String handling in ''C'':-


    Every programming language provide some way to handle string. A string is anything
    enclosed within a pair of double quotes. Some languages treat string as a primitive
    data type, some handle it as an object but ''C'' handles the string in a different
    way. In ''C'' a string is stored as an array of characters terminated with \ or
    NULL. There is the big difference between array of character and string. An array
    of character is handled by element but the string can be handled as a whole values
    or by element.


    Although a string is declared as an array of characters but when we input a value
    using the %ss with scanf or the function gets, NULL character is automatically
    inserted after the last character termination.


    If we assign or array character but do not insert the NULL character by ourselves
    it will simply be an array of character and will not be handled as a string by
    ''C''. Being an array of character the string variables have some limitation as:-nThey
    cannot be assigned with any other variables or constants after definition.


    Two string cannot be concatenated using the ''+'' operator.

    Two strings cannot be compared using relational operator.

    But we don''t worry, because to manipulate the string there is a range of function
    present in the library of ''C''. All these functions are prototyped in the header
    file string.h .


