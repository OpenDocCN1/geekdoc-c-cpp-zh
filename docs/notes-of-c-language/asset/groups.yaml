- md: "\n# HISTORY OF C\n\nBy 1960 the high-level languages available for programming\
    \ were developed for specific purposes. This situation limited the programmers\
    \ to work from a particular type of problem solution. To overcome this limitation\
    \ a common programming language was needed; an international committee was set\
    \ to develop such a language. This committee came out with ALGOL-60 a general\
    \ high-level programming language.\n\nHowever, ALGOL-60 never became popular because\
    \ it was general. Due to its generality, a new language CPL (COMBINED PROGRAMMING\
    \ LANGUAGE) was developed at Cambridge university but CPL had many features that\
    \ it was hard to learn and difficult to implement.\n\nLater on another language\
    \ named BCPL was developed by Martin Richards at Bell lab of AT&T. But unfortunately\
    \ it turned out to be too powerful. Around the same time as the BELL lab AT&T,\
    \ a programmer named KEN THOM developed a language as a further simplification\
    \ of CPL named as B. But it also turned out to be very specific. After that at\
    \ the laboratory a programmer named DENNIS RITCHIE inherited the features of BCPL\
    \ and added some of his own and developed a language in 1972. This language was\
    \ named “C” as a next step of language “B”. In 1983 a committee was established\
    \ to create ANSI version of C. ANSI was finally adopted in December 1989. The\
    \ first copy was released in 1990 as C89. The standard was also adopted by ISO,\
    \ as ANSI/ISO standard C.\n\nDuring 1990 work on C continued as C99. In general,\
    \ C99 retained all the features of C89 with a little addition.\n\n# INTRODUCTION\
    \ AND FEATURES OF “C”\n\n![](img/a82bd3224fd572cdc958a29e758ad59a_0_0.png)\n\n\
    “C” is one of the most powerful and popular languages. Its popularity is due to\
    \ its many desirable features. It is a structured modular programming language\
    \ in which an application can be developed as a collection of modules; it has\
    \ a rich set of built-in functions and operators which makes the writing of compliant\
    \ programs easier; the “C” compiler is well suited to develop both system and\
    \ application softwares.\n\nC supports a vast range of data types to make the\
    \ program more space efficient. The “C” program runs much faster than the program\
    \ by using any other language of this category.\n\n“C” is very simple to learn\
    \ because it has only 32 keywords. But it is more powerful. Its power lies in\
    \ its built-in function library. In addition, C allows enhancing its library by\
    \ adding new functions.\n\nBeing a structured modular language and having certain\
    \ additional features, it allows to be used at lower level. This feature fills\
    \ the gap between assembly language and conventional high-level languages. Since\
    \ programs are partitioned in modules and functions, the programmer can concentrate\
    \ at a particular point as well as parallel programming is possible, which reduces\
    \ the production time.\n\nProvided by Anjna Chaudhary\n\n# STEP FOR EXECUTION\
    \ OF A C PROGRAMME\n\n1) The programmer writes and saves the source code by the\
    \ editor of IDE (INTEGRATED DEVELOPMENT ENVIRONMENT).\n\n2) To run the C language\
    \ we press ctrl+F9-after which the compiler compiles the program and saves the\
    \ object code.\n\n3) The linkers link the libraries modules with the object code\
    \ and make the executable code.\n\n4) The loader loads the exe code inside the\
    \ main memory.\n\n5) The processor picks the instructions one by one and executes\
    \ them.\n\n6) The results are either seen in a file or sent to output terminal.\n\
    \nDemo.c\n\n![](img/a82bd3224fd572cdc958a29e758ad59a_1_0.png)\n\n# A C PROGRAM\n\
    \n```\n# include <stdio.h>\nvoid main () {\n    int n,m, sum, diff;\n    puts(\"\
    enter two numbers\");\n    scanf(\"%d.%d\",&n,&m);\n    Sum = n+m;\n    if (n>m)\n\
    \        Diff = n-m;\n    else\n        Diff = m-n;\n    printf(\"N=%d m=%d\"\
    ,n,m);\n    printf(\"Sum=%d difference=%d\",sum, diff) \n    getchar();\n}\n```\n\
    \ndeclaration statement\noutput statement\ninput statement\narithmetical statement\n\
    logical statement\narithmetical statement\nlogical statement\narithmetical statement\n\
    output\noutput\noutput statement\n\n# COMPONENT OF A C PROGRAMME\n# (DIRECTIVE)\n\
    \nThe directive indicates the compiler that a preprocessor command such as include\
    \ or define has to come.\n\ninclude - It is a pre-processor command which brings\
    \ the content of specified header file in the object code.\n\nProvided by Anjia\
    \ Chaudhary\n\nstdio.h - It is a header file. Header file contains declaration\
    \ of function related with a particular type of work. The stdio.h contains prototyping\
    \ for standard I/O functions such as printf, scanf.\n\nmain () - Since C programs\
    \ follow top-down decomposition, there must be one user-defined function which\
    \ will be the manager function of the application; the fixed name of the manager\
    \ is main.\n\n# { } ( OPEN AND CLOSE CURLY BRACES ) :-\n\nIn C programming each\
    \ function and structure have their own block. These blocks are differentiated\
    \ by enclosing within a pair of opening and closing curly braces.\n\nStatements\n\
    Within the block there will be C statement. In C we may get five types of statements:\
    \ declaration, input/output statement, arithmetical statement, and logical statement.\n\
    \nA statement is a complete instruction selected by the processor for execution.\
    \ Every language has its own end of statement character. In C it is a semicolon\
    \ (;). A statement may consist of one or more expressions.\n\nAn expression is\
    \ the action taken by the processor at a time. An expression is made up of one\
    \ operator and one or more operands.\n\nC is very simple to learn because it has\
    \ only 32 keywords. But it is more powerful. Its power lies in its built-in function\
    \ library. In addition C allows enhancing its library by adding new functions.\n\
    \nBeing a structured modular language and having certain additional features,\
    \ it allows to be used at lower level. This feature fills the gap between assembly\
    \ language and conventional high-level languages. Since programs are partitioned\
    \ in modules and functions, the programmer can concentrate at a particular point\
    \ as well as parallel programming is possible which reduces the production time.\n\
    \n| Keywords | Constant | Identifier | Special Symbol |\n| :--- | :--- | :---\
    \ | :--- |\n| C Tokens | | | |\n\nProvided by Anjia Chaudhary\n\n![](img/a82bd3224fd572cdc958a29e758ad59a_2.png)\n"
  mdcn: "\n\n# C 语言的历史\n\n到1960年，用于编程的高级语言都是为了特定目的开发的。这种情况限制了程序员只能针对特定类型的问题的解决方案进行工作。为了克服这一局限性，需要一种通用的编程语言；设立了一个国际委员会来开发这种语言。该委员会推出了\
    \ ALGOL-60，这是一种通用的高级编程语言。\n\n然而，ALGOL-60 并没有流行起来，因为它过于通用化。由于这种通用性，剑桥大学开发了一种新语言\
    \ CPL（组合编程语言），但 CPL 具有许多难以学习且难以实现的特征。\n\n后来，AT&T 贝尔实验室的 Martin Richards 开发了另一种名为\
    \ BCPL 的语言。但不幸的是，它被证明太强大了。在 AT&T 贝尔实验室的同时，一位名为 KEN THOM 的程序员开发了一种作为 CPL 进一步简化的语言，名为\
    \ B。但它也被证明非常具有特殊性。之后，在实验室，一位名为 DENNIS RITCHIE 的程序员继承了 BCPL 的特征并加入了一些自己的特性，于 1972\
    \ 年开发了这种语言。这种语言被命名为“C”，作为语言“B”的下一步。1983年，成立了一个委员会来创建 C 的 ANSI 版本。ANSI 最终于1989年12月被采用。第一个版本于1990年作为\
    \ C89 发布。该标准也被 ISO 采用，作为 ANSI/ISO 标准 C。\n\n1990年期间，C 的工作作为 C99 继续。通常，C99 保留了 C89\
    \ 的所有特征并进行了少量补充。\n\n# “C”语言的介绍与特征\n\n![](img/a82bd3224fd572cdc958a29e758ad59a_0_0.png)\n\
    \n“C”是最强大且最流行的语言之一。它的流行归于它的许多理想的特征。它是一种结构化模块化编程语言，可以作为模块集合来开发应用程序；它拥有丰富的内置函数和运算符，这使得编写符合标准的程序变得更容易；“C”编译器非常适合开发系统软件和应用程序。\n\
    \nC 支持广泛的数据类型，使程序更具空间效率。“C”程序的运行速度比使用此类别的任何其他语言编写的程序快得多。\n\n“C”语言非常容易学习，因为它只有\
    \ 32 个关键字。但它更强大。它的力量在于它的内置函数库。此外，C 允许通过添加新函数来增强其库。\n\n作为一种结构化模块化语言并具有某些额外特征，它允许用于更底层。这一特征填补了汇编语言与传统高级语言之间的空白。由于程序被划分为模块和函数，程序员可以专注于某一点，并且可以并行编程，从而减少了生产时间。\n\
    \n由 Anjna Chaudhary 提供\n\n# C 程序的执行步骤\n\n1) 程序员通过 IDE（集成开发环境）的编辑器编写并保存源代码。\n\n\
    2) 要运行 C 语言，我们按下 ctrl+F9，之后编译器编译程序并保存目标代码。\n\n3) 链接器将库模块与目标代码链接起来并生成可执行代码。\n\n\
    4) 加载器将 exe 代码加载到主内存中。\n\n5) 处理器逐条提取指令并执行它们。\n\n6) 结果显示在文件中或发送到输出终端。\n\nDemo.c\n\
    \n![](img/a82bd3224fd572cdc958a29e758ad59a_1_0.png)\n\n# 一个 C 程序\n\n```\n# include\
    \ <stdio.h>\nvoid main () {\n    int n,m, sum, diff;\n    puts(\"enter two numbers\"\
    );\n    scanf(\"%d.%d\",&n,&m);\n    Sum = n+m;\n    if (n>m)\n        Diff =\
    \ n-m;\n    else\n        Diff = m-n;\n    printf(\"N=%d m=%d\",n,m);\n    printf(\"\
    Sum=%d difference=%d\",sum, diff) \n    getchar();\n}\n```\n\n声明语句\n输出语句\n输入语句\n\
    算术语句\n逻辑语句\n算术语句\n逻辑语句\n算术语句\n输出\n输出\n输出语句\n\n# C 程序的组件\n# (指令)\n\n指令指示编译器必须出现如\
    \ include 或 define 这样的预处理器命令。\n\ninclude - 这是一个预处理器命令，它将指定头文件的内容引入目标代码中。\n\n由\
    \ Anjia Chaudhary 提供\n\nstdio.h - 这是一个头文件。头文件包含与特定类型工作相关的函数声明。stdio.h 包含了 printf、scanf\
    \ 等标准输入/输出函数的原型。\n\nmain () - 由于 C 程序遵循自自而下的分解，必须有一个用户定义的函数作为应用程序的管理函数；该管理函数的固定名称为\
    \ main。\n\n# { } ( 左大括号和右大括号 ) :-\n\n在 C 编程中，每个函数和结构都有自己的块。这些块通过在一对左大括号和右大括号内进行区分。\n\
    \n语句\n块内部将 C 语句。在 C 中，我们可能会得到五种语句：声明、输入/输出语句、算术语句和逻辑语句。\n\n语句是处理器选择执行的完整指令。每种语言都有其自己的语句结束字符。在\
    \ C 中，它是分号 (;)。一个语句可以由一个或多个表达式组成。\n\n表达式是处理器在一次内采取的操作。一个表达式由一个运算符和一个或多个操作数组成。\n\
    \nC 语言非常容易学习，因为它只有 32 个关键字。但它更强大。它的力量在于它的内置函数库。此外，C 允许通过添加新函数来增强其库。\n\n作为一种结构化模块化语言并具有某些额外特征，它允许用于更底层。这一特征填补了汇编语言与传统高级语言之间的空白。由于程序被划分为模块和函数，程序员可以专注于某一点，并且可以并行编程，从而减少了生产时间。\n\
    \n| 关键字 | 常量 | 标识符 | 特殊符号 |\n| :--- | :--- | :--- | :--- |\n| C 标记 | | | |\n\n"
