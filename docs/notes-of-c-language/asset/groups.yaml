    ## Bitwise And (&) :-


    It is a binary operator which compares its operands by bit and returns an 1 if
    both operand

    have 1 bit at that position.


    ```

    Using short Y = 15 ;   00001111

    R = x & y         00001010

    ```


    ## Bitwise OR ( | ) :-


    As the bitwise AND operator compares bits of its operand and returns 1 bit. If
    any of them

    having 1 bit at that position.


    ## Bitwise XOR (^) :-


    By comparing bits of the values it returns 1 bit. If there are dissimilar bits
    at that position

    otherwise returns a 0 bit.


    ## Bitwise Left Shift (<<) :-


    Instead of comparing the bits of operand. This operator moves the bit pattern
    of its left operand.

    According to its right operand towards left position.


    i.e. normally as n<<p = N*2^p

    because shifting most significant bit by one doubles the values.


    - (f) Bitwise Right shift (>>) : :

    As left it also moves the bits from left to right. i.result as n>>p=n/2^p

    because moving MSB by one halves that values.


    - (7)Assignment operator :=

    Assignment mean giving a value to a variable. In general it is done by using the
    "=" operator.

    Along with equals ''='' C supports short hand assignment operators which consists
    of any other

    operators and equals. They perform some action according to the value of its left
    and right

    operand. Then assign its left operand with the resulted value. The common ones
    are =, +, -= = =

    * = , /, % = .


    ## (8)Special Operator :-


    The groups of operators includes the symbol in which each one is responsible to
    do a specific

    operation.


    Following are the operators included in this group.


    ## Parenthesis ( ) :-


    It is used for function definition and function call. it is also used to increase
    the precedence of

    any other operator to level one.


    ## Subscription :-


    This operator is used to specify size of an array or to give index of an element
    of an array.


    ## Comma ( , ) :-


    It is used to separate item of a list.


    ## Member selection ( . -> ) :-


    They are used to select an individual members of a structure variable.


    ## Address of value ( & :-


    It is a unary operator which returns the address of memory location where its
    operand is stored.


    ## Dereference or Value at address (* ) :-


    It is also an operator used to declare a pointer variable and to access value
    of a memory location through a pointer.


    ## Operator Precedence :-


    The term precedence describes the quality of an operator that is used to specify
    privilege of execution. When there are more than one operators present in a single
    statement. Each operator in C is assigned a rank. Since there are lot of operators
    the ranking is not limited as BODMAS. The operator ranking for arithmetic is also
    different than BODMAS.


    ## Operator Associativity :-


    There may be more than one operator belonging to same rank present in a single
    statement. In such situation the quality of associativity is used to decide the
    sequence of execution. The associativity may be left to right or right to left.


    | OPERATORS | SYMBOLS | RANK | ASSOCIATIVITY |

    | :--- | :--- | :--- | :--- |

    | Parenthesis | ( ) | 1 | L → R |

    | Subscription | [ ] | | |

    | Unary plus / Minus / Increment ; Decrement ; logical | +,+,+,-,,~*,& | 2 | R
    → L |

    | Not, bitwise not, Size of Multiplication Division modulus | *,|% | 3 | L → R
    |

    | Binary plus / minus | +- | 4 | L → R |

    | Bitwise left shift / right shift | <<>> | 5 | L → R |

    | Greater than less with Equality | <,,>= | 6 | L → R |

