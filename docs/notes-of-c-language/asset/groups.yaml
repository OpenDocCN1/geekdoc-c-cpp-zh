  mdcn: "\n\n# 变量 :-\n\n变量是经标识的内存位置，我们可以在程序的一次或多次执行过程中在这些位置中存储不同的值。\n\n常量和变量之间的主要区别是，常量只有读值（R），而变量既有读值（R）也具有位置值（L）。由于它们具有\
    \ L 值，我们可以引用它们并更改内存位置的值。每个变量都能持有特定类型的值。\n\n在 C 程序中，我们在函数使用的变量必须在编写程序的任何其他语句之前进行声明。\n\
    \n# 声明语法为\n\n数据类型 变量;\n\n# 数据类型\n\n为了将我们的值存储在主内存中，我们需要声明变量。变量声明需要指定该变量的字长有多长，以及该变量将存储什么类型的值。数据类型是告诉编译器关于这些规格的技术。\n\
    \nC 语言为整数和实数提供了极其广泛的范围。它甚至为整数提供了六种独立的数据类型，我们可以根据需求选择最合适的一种。\n\n# 整数型数据类型：\n\n\
    - Short :- 由关键字 `int` 或 `short` 指定。我们用它来存储非常小的数字。字长取决于机器，在最高 16 位的机器上，它是 2 字节长，即\
    \ -128 到 +127 或 -32768 到 +32767。\n\n- Int :- 如果我们使用整数变量的大小，C 提供了 `int` 数据类型。在最高\
    \ 16 位的机器上它的大小是 2 字节，但在高配置机器上是 4 字节。变量的第一位用于存储符号位（用于正数 + 和负数 -），其余位用于存储数字的二进制幅度。值的范围是\
    \ -32768 到 +32767 或 -2147483648 到 +2147483647。\n\n- Long :- 用于存储整数值。它的大小为 4 字节。在第一位中，用于存储符号，范围是\
    \ -2147483648 到 +2147483647。所有数据类型的无符号部分长度相同，但由于它们不存储符号位，因此值的范围增加了一倍。\n\n# 实数型数据类型\n\
    \n为了存储实数，C 提供了以下数据类型：\n\n- Float :- 用于通过 4 字节存储较小的浮点数，其中以小数和指数格式提供字长，我们可以在其中存储最多多少位小数。值的范围是\
    \ -3.4e-38 到 +3.4e+37。\n\n- Double :- 它具有 8 字节的精度，对于我们的问题足够了，我们可以使用 double 数据类型。范围\
    \ -1.7e-308 到 +1.7e+308。\n\n- Long double :- 有时我们可能需要比 double 更精度，C 提供了 long double\
    \ 类型，字长为 10 字节，值的范围是 -1.1e-493 到 +1.1e+493。\n\n# 字符型数据类型\n\n为了存储单个字符：\n- Char\
    \ :- 它具有一个固定的字长，字符以有符号和无符号的形式存储，有符号为 -128 到 +127，无符号的为 0 到 255。\n\n# 变量的声明\n\n\
    在 c 程序中使用的任何变量都必须在开头声明。变量声明指定了存储类和数据类型，如果省略了存储类，编译器将将其视为自动存储类（auto）。变量声明系统如下：\n\
    \n```\nauto int n;\nstatic int k;\nint p;\nchar nm, a;\n```\n\n# 变量的定义\n\n当我们在程序中声明变量时，它占据指定的字长，并用名称来标识它，初始值由编译器存储在这个空间中。编译器给出的初始值称为默认值。对于\
    \ auto 和 register 存储类，初始值是垃圾值，它是不可预测的。这个值可能会在程序的输出中产生错误。因此，我们应该定义变量。\n\n变量的定义是通过直接给出初始值来进行声明。我们可以说语句中的赋值表达式称为定义。\n\
    \n语法\n存储类 数据类型 名称 = 属性;\n\n```\nstatic int n = 5;\nfloat x=0.5, y=1.3, z=3.6;\n\
    char key = 'k';\nchar nm [20] = \"anja\";\n```\n\n# 运算符:-\n\n任何表达式都至少由一个运算符和一个操作数组成。操作数是作为常量或变量给出的值，而运算符是告诉处理器对给定的操作数执行某些动作的符号。C\
    \ 语言提供了极其广泛的运算符。\n\n根据操作数的数量，它们分为 C 一元运算符、二元运算符、三元运算符 :-\n\n- 一元运算符 :- 此类的运算符有一个操作数，一些示例有\
    \ `+`, `-`, `&`, `*`, `!`...\n\n- 二元运算符 :- 这种运算符有两个操作数，示例如 `+`, `*`, `<>` 等...\n\
    \n- 三元运算符 :- 这种运算符有三个操作数。它们由两个符号组成。有一种三元运算符，即条件运算符 (?:)；\n\n根据执行动作，运算符分为类型 :-\n\
    \n- 算术运算符 :- 这种运算符执行计算操作。包括以下运算符：\n    - +( 可作为一元和二元运算符，使值变为正数或执行加法。\n    - -(减号)\
    \ 也用于一元和二元形式，用于取负值或提供差值。\n    - *(乘号) 用于给出两个值的乘积；用于执行除法并返回商。结果的类型取决于操作数的类型。如果两个操作数都是整数，结果将是整数，否则将是实数。\n\
    \    - %(取模) 用于执行整除并返回余数。\n\n- (2) 增减运算符 :- 我们经常需要从变量中加或减一个值，例如 v = v+1/v = v-1。为了这个目的，C\
    \ 支持两种短路运算符作为增减运算符，符号分别为 `++` 和 `--`。这些被称为一元运算符，可以以前缀或后缀形式给出：++V; V++; V--;\n\n\
    如果作为单独语句给出，前缀和后缀没有区别。但如果作为另一个语句中的表达式，它们的行为就不同。如果是前缀，它们会在语句的其他部分之前执行，否则先执行语句的其他部分。\n\
    \n- (3) 关系运算符 为了执行逻辑处理，即比较和选择，可以使用此类别的运算符。它们检查两个值之间的关系——运算符如下：\n    - == (等于)\
    \ 用于检查两个操作数之间的相等性，如果两者相同则返回真。\n    - != (不等于) 如果它的两个操作数值不同，则返回真。\n    - > (大于)\
    \ 如果左操作数大于右操作，则返回真。\n    - >= (大于等于) 如果左操作数大于或等于右操作，则返回真。\n    - < (小于) 如果左操作数小于右操作，则返回真。\n\
    \    - <= (小于等于) 如果左操作数小于或等于右操作，则返回真。\n\n- (4) 逻辑运算符 :- 在许多情况下，我们需要比较多个关系。为了处理这些情况，我们使用基于布尔代数运算的逻辑运算符。以下是这类运算符。\n\
    \    - && (与) 它基于逻辑乘，只有当它的两个关系表达式都返回真(true)时才返回真(true)。\n    - || (或) 它基于布尔运算“加”。当它的操作数关系表达式中有任何一个返回真(true)时，它返回真。\n\
    \    - ! (非) 它基于布尔补码运算。它是一元运算符，当它的操作数关系表达式返回假(false)时返回真。\n\n"
