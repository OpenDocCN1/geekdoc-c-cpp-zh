- md: "\n## If (cond01 && cond2 && cmd 3.........)\n\nIn the situation where we have\
    \ to check more than one condition one after another but to do the work after\
    \ evaluating any of the condition true. In general we use the ladder of if but\
    \ it can the replace with the use of Or (||) operator. Because the OR operator\
    \ takes two input as true or false and return true if any of these are evaluated\
    \ true.\n\n## BREAK STATEMENT:-\n\nIn A C PROGRAM there may be so many blocks,\
    \ some of them are any blocks and some are related with branching and looping\
    \ structure. Some time we need to move the control of flow outside a block without\
    \ executing it completely. The break statement serves this purpose. When the break\
    \ statement is encountered, the control is passed directly outside that block.\
    \ The break statement itself is unconditional. But it is quite natural that we\
    \ want to break a block in a particular situation. So we generally use this statement\
    \ with a branching statement such as if and.\n\n## Switch case:-\n\n```c\nswitch\
    \ (value)\n{ \n    case condition 1:\n        Work to do\n        break;\n   \
    \ case condition 2:\n        Work to do\n        break;\n    default:\n      \
    \  Work\n}\n```\n\n## Switch case structure:-\n\nIt is another structure provided\
    \ by C to perform the branching technique. It is made up of using three key words:\
    \ switch, case, default.\nThe switch key followed by a variable given within parenthesis,\
    \ this variable’s value is checked against the given conditions. If there is a\
    \ block enclosed within pair of curly braces, which contains different case statement\
    \ followed by the set of statement to execute after evaluating the condition true.\
    \ Each case statement is followed by a value postfixed with colon. The variable\
    \ given with switch is checked against these values.\n\nAt the first case is compared,\
    \ if it is evaluated true, the control is passed below and executes the statement\
    \ given after; otherwise the control is passed to the next case. If all the case\
    \ are evaluated false, then the statement given after default are executed.\n\n\
    Provided by Anjina Chaudhary\n\nThe switch structure is a better alternative for\
    \ ladder if-else. Particularly when we need to executes a set of different kind\
    \ of instruction for each of the condition because there is no separated blocks\
    \ for the case statement and we do not need to keep track about the opening and\
    \ closing braces every time. It replace the if-else ladder due to its limitation\
    \ it has the following limitation:\n\n- Only the integer can be switched.\n- Only\
    \ a single value is placed against case therefore we can check only equality.\
    \ Once a case is evaluated true, the control is passed below and the other cases\
    \ are ignored. Therefore we need to add break statement after every case to get\
    \ desired result. Although we can not use any relational and logical operator\
    \ with case but the above limitations let us to make a situation as like or operator.\n\
    \n## Goto statement\n\nAlthough it is said to structure programming gets less\
    \ programming, but it is still used in C and C++ programming. Statement is used\
    \ to send the flow of control anywhere in the programmed, i.e. Labeled. A label\
    \ is any value identifier followed by colon (if the label is given at the end\
    \ of program then there must be semicolon). When we use goto, then the general\
    \ flow of control i.e. to top to bottom by instruction is overlapped and it may\
    \ be passed back or jump forward by skipping some statement. Since goto is not\
    \ conditional its may be problematic even if we make the program infinite. If\
    \ it is used against any branching statement, it is used to perform looping technique.\n\
    Syntax - `goto label;`\n\n## Looping:-\n\nFor the structure programming it is\
    \ necessary to provide a provision for the repeat of a set of instruction. looping\
    \ is the technique designed by ANSI which allows us to repeat/iterate a set of\
    \ instruction till a given condition is evaluated true.\nAccording to the ANSI\
    \ rule each structured language must support three looping structures:\n\n- While\n\
    - Do and handle\n- For\n\nAll these looping structures can be divided into two\
    \ basic type called as entry and exit. For entry loops, the condition is checked\
    \ before executing the body. If evaluated true, the body is executed and from\
    \ the end of the loop it is passed back to the control. As soon as the condition\
    \ goes false, the flow of control is moved after the loop body. For exit loops,\
    \ the body is executed first and then the condition is checked. The determinate\
    \ loop the number of repeat can be predicted before starting.\n\nProvided by Anjna\
    \ Chaudhary\n\nFor the indeterminate loop, it cannot be predicted how many time\
    \ it will repeat. Every execution of the program the way varies by assigning with\
    \ a new value.\n\n## The while loop:\n\nThe while loop is an entry control loop,\
    \ that may be both determinate and indeterminate. In 'C' language, the while keyboard\
    \ is followed by condition within parenthesis. That is followed by body of loop\
    \ enclosed within pair of curly braces (if there is the statement there is no\
    \ curly braces). The condition given while is evaluated and if resulted true the\
    \ control is passed to the loop body. From the end of the loop it is passed back\
    \ to the control. It evaluated again for the repeat of loop. As soon as the condition\
    \ goes false the flow of control is moved after the loop body.\n\n```c\n{\n  \
    \  Statement\n}\n```\n\n## For loop :-\n\nThe for looping is designed by ANSI\
    \ in such a way that it can be used as determinate entry loop. In the C language\
    \ also follows same format as designed by ANSI. But in this language some special\
    \ features are added to for structure. Therefore it can be used as intermediate\
    \ loop.\n\nThe general format of syntax in C language consists of three parts\
    \ separated by semi-colon (;). The first part is the initialization which assign\
    \ the initial value to counter. The second part is to specify the condition which\
    \ will cause the termination of loop and the third part is the expression in which\
    \ we give any type of expression to be executed before evaluating the condition\
    \ next time.\n\nWhen the control of flow comes to the statement, it first executes\
    \ the initialization block and checks the control if it evaluated true, the control\
    \ is passed to the loop body. That is executed and the control is passed to the\
    \ expression statement. After then it passed to the control statement. According\
    \ to the result of condition, the control is passed either to the loop body or\
    \ after the loop body.\n\n# Syntax\n\n```c\nFor (initialization; condition; expression)\n\
    {\n    loop body\n}\n```\n\n# Special features for loop :-\n\n- In general in\
    \ for loop only one counter can be initialized but the format for in C language\
    \ allows us to initialize more than one variable separated with comma in its initialization\
    \ block.\n- If the loop to be controlled by a variable which already has a value,\
    \ we can omit the initialization block but must give the corresponding semicolon.\n"
