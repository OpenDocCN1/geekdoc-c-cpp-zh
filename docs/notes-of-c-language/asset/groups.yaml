    ```\n\n### strcasecmp() :-\n\nThis function takes the string argument and compare\
    \ them by character by subtracting the ASCII code of string from the ASCII code\
    \ of first. The comparison is continued till the end by ignoring the cases of\
    \ the character. strncmp() case sensitive.\n\n```c\nstrncmp(str1, str2);\n```\n\
    \n### strcat() :-\n\nIt also works as strcpy but accept a third argument i.e.\
    \ an integer value and compare only the given number of character.\n\n```c\nstrcat(str1,\
    \ str2, no of character);\n```\n\n### strcat() :-\n\nAs like strcpy it also takes\
    \ target string and source string as its argument but instead assigning the target\
