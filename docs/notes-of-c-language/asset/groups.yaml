    \ :-\n\nAs we know a string variable cannot be assigned a value but often we need\
    \ to give a new value i.e. already present to a string variable. To fulfill this\
    \ need there is strcpy() it has two argument the first argument must be a string\
    \ variable which needs to has the new value. The second argument may be a string\
    \ or constant i.e. assign to the first argument.\n\n```c\nstrcpy(target string\
    \ variable, source string variable or constant);\n```\n\n### strncpy() :-\n\n\
    It works as same as strcpy() with a title modification. It accept a third argument\
