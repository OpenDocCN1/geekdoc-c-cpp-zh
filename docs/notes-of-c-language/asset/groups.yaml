    \ 结构:-\n\n这是 C 提供的另一种用于执行分支技术的结构。它由三个关键字组成：`switch`、`case` 和 `default`。\n`switch`\
    \ 关键字后紧跟括号内的一个变量，该变量的值将与给定的条件进行比较。如果在对大括号内围有一个块，其中包含不同的 `case` 语句，每个后面跟着一组在评估条件为真后要执行的语句集。每个\
    \ `case` 语句后面都跟着一个带有冒号后缀的值。`switch` 后给出的变量将与这些值进行比较。\n\n首先比较第一个 `case`，如果其求值为真，控制将传递到下方并执行给出的语句；否则，控制将传递到下一个\
    \ `case`。如果所有 `case` 都求值为假，则执行 `default` 之后给出的语句。由 Anjina Chaudhary 提供\n\n`switch`\
    \ 结构是 `if-else` 阶梯的更好替代方案。特别是当我们为每个条件执行一组不同类型的指令时，因为 `case` 语句没有独立的块，我们不需要每次都跟踪大括号的开启和关闭。由于其局限性，它在替换\
    \ `if-else` 阶梯时具有以下局限性：\n\n- 只有整数可以切换。\n- `case` 后面只放置一个单一值，因此我们只能检查相等性。一旦某个 `case`\
    \ 求值为真，控制将传递到下方并忽略其他 `case`。因此，我们需要在每个 `case` 之后添加 `break` 语句以获得想要。虽然我们不能在 `case`\
    \ 中使用任何关系和逻辑运算符，但上述局限性让我们能够实现类似于或运算符的情况。\n\n## goto 语句\n\n尽管人们说结构化编程减少了跳转，但它在\
    \ C 和 C++ 编程仍然在使用。该语句用于将控制流发送到程序的任何位置，即标签（Labeled）。标签是任何值标识符后跟冒号（如果标签位于程序末尾，则必须有分号）。当我们使用\
    \ `goto` 时，通控制流（即指令从上到下的流）会被重叠，并且可能会跳回或通过跳过某些语句向前跳转。由于 `goto` 是无条件的，即使让程序无限循环它也可能出现问题。如果它与分支语句配合使用，则用于实现循环技术。\n\
    语法 - `goto label;`\n\n## 循环:-\n\n对于结构化编程，有必要为一组指令的重复提供机制。循环是 ANSI 设计的技术，允许我们重复/迭代一组指令，直到给定的条件被求值为真。\n\
    根据 ANSI 规则，每种结构化语言必须支持三种循环结构：\n\n- While\n- Do while\n- For\n\n所有这些循环结构可以分为两个基本类型，称为入口循环（entry）和退出循环（exit）。对于入口循环，在执行循环体之前检查条件。如果求值为真，则执行循环体，并从循环结束处传回控制。一旦条件变为假，控制流就会移动到循环体之后。对于退出循环，首先执行循环体，然后检查条件。确定性循环的重复次数可以在开始之前预测。\n\
    \n由 Anjna Chaudhary 提供\n\n对于不确定性循环，无法预测它将重复多少次。程序的每次执行方式都通过分配新值而发生变化。\n\n## while\
    \ 循环：\n\n`while` 循环是一种入口控制循环，可以是确定的，也可以是不确定的。在 'C' 语言中，`while` 关键字后紧跟括号内的条件。接着是包含在大括号内的循环体（如果有语句，则没有大括号）。`while`\
    \ 给出的条件会被求值，如果结果为真，控制将传递到循环体。从循环结束处传回控制。它再次被求值以重复循环。一旦条件变为假，控制流就会移动到循环体之后。\n\n\
    ```c\n{\n    Statement\n}\n```\n\n## for 循环 :-\n\n`for` 循环由 ANSI 设计，使其可以作为确定性的入口循环使用。C\
    \ 语言也遵循与 ANSI 设计的相同格式。但在这种语言中，`for` 结构增加了一些特殊功能。因此，它可以作为中间循环使用。\n\nC 语言中语法的通用格式由三个由分号;)\
    \ 分隔的部分组成。第一部分是初始化，为计数器分配初始值。第二部分是指定将导致循环终止的条件，第三部分是表达式，我们在其中给出下一次评估条件之前执行的任何类型的表达式。\n\
    \n当控制流到达该语句时，它首先执行初始化块并检查控制，如果求值为真，控制将传递到循环体。执行循环体后，控制传递到表达式语句。之后它传递到控制语句。根据条件的结果，控制将传递到循环体或循环体之后。\n\
    \n# 语法\n\n```c\nFor (initialization; condition; expression)\n{\n    loop body\n\
    }\n```\n\n# for 循环的特殊功能 :-\n\n- 通常 `for` 循环中只能初始化一个计数器，但 C 语言的格式允许我们在初始化块中用逗号分隔来初始化多个变量。\n\
    \ 如果 如果循环由一个已经有值的变量控制，我们可以省略初始化块，但必须给出相应的分号。\n\n"
