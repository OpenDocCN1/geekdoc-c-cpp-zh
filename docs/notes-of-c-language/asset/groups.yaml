  mdcn: "\n\n通常情况下，`for` 的格式可以包含单个条件，例如等于或小于，C语言还允许我们通过使用逻辑运算符指定复杂的条件。\n- 即使条件语句也可以省略。但这样的话条件规范将始终被求值为真。因此，控制流始终传递到循环体，导致循环无限。所以，我们必须在循环体内执行某些操作来终止循环。\n\
    - 表达式语句也可以包含多个一个由逗号隔开的表达式。\n- 表达式语句可以是任意类型的算术表达式。\n- 表达式语句也可以省略。\n- 所有构成 `for`\
    \ 循环的语句也可以省略。但必须有相应的分号。\n\n### do 循环:-\n\n`do while` 结构是一种退出控制循环。在某些情况下，我们需要循环体至少执行一次。在这样的情况下，我们可以使用\
    \ `do while` 循环。\n该结构以关键字 `do` 开头，后面跟着循环体，即随后是关键字 `while`，其括号内有条件，最后后面跟有一个 `;`。控制流直接传递到循环体并执行，然后检查\
    \ `while` 内部的条件。如果条件求值为真，则控制流传回关键字处；否则，传递到 `while` 之后的下一个语句。\n\n### 格式:-\n\n```c\n\
    do\n{\n    loop body\n} while (condition);\n```\n\n### 循环的嵌套:-\n\n在某些情况下，我们需要重复一段指令，而在该指令块内部还有一些也必须重复的语句。为了处理这种情况，我们允许在另一个循环的体内嵌套一个循环结构。这种嵌套可以多达\
    \ 255 层。在外层循环的每一次重复中，内层循环都会完成所有的周期。\n因此，内层循环的总次数将内层循环次数乘以 (*) 外层循环的次数。\n任何循环都可以嵌套在任何循环中，无需忽略其类型。\n\
    \n### 格式:-*\n\n```c\nfor (----)\n{\n    while (condition)\n    {\n    }\n}\n```\n\
    \n### Continue 语句:-\n\n`continue` 是一种无条件语句，即位于循环体内。当遇到 `continue` 语句时，控制流被传回待检查的条件处。`continue`\
    \ 之后的语句将保持不执行。在循环体内执行该语句是完全自然的。但在某些情况下，某些语句是不希望执行的。为了处理这种情况，我们可以使用 `continue`\
    \ 语句。但它应该配合 `if` 语句或 `case` 语句一起使用。\n\n### 格式\n\n循环结构 ( )\n{\n    Continue:\n\
    }\n\n### 数组:-\n\n当我们需要存储一组数据项时，我们必须遵循某种方式来组织存储。创建该组的数据项通过产生它们之间的关系被收集在一起，这被称为数据结构。\n\
    \n数组是一种静态数据结构。它是存储在连续内存位置中的同类数据项集合。这意味着数组元素之间存在物理和数学上的关系。如果已知元素的地址，我们就可以很容易地出其他元素的地址。\n\
    \n当我们必须存储和处理具有相同类型信息且以相同方式操作的变量时，我们会创建一个数组。然而，创建一个大小为 $n$ 的数组并声明 $n$ 个变量会占用一些内存容量。但处理数组元素是很容易，因为构成数组元素的所有内存位置共享同一个名称，但可以通过它们的偏移量（索引）单独指定。\n\
    \n### 数组的声明 :-\n\n数组也是一种变量，因此在使用之前必须对其进行声明。数组的声明方式与其他变量相同，只是数组的维度跟在标识符后面。\n\n\
    ```c\nSyntax -\nData type identifier[dimension];\nint A[5];\nfloat x[2];\ndouble\
    \ D[25];\n```\n\n维度值必须是常量整数，然而，可以通过宏创建或使用 `const` 关键字进行符号声明。\n\n### 数组的定义 :-\n\
    \n由于我们定义了一些基本变量，我们也可以通过为其元素提供初始值来定义数组。可以通过以下方式实现：\n\n```c\nData type identifier[dimension]={x1,\
    \ x2};\nDatatype name[]={v1,v2,v3....};\n```\n\nDataType name[size]={v};\n\n####\
    \ 一维数组的内存映射：\n当我们声明一个大小为 $n$ 的数组时，会留出 $n$ 倍数据类型长度的数据，并跟踪第一个字节的地址，通过计算可以访问数组的哪个元素。\n\
    \n### 引用数组元素:-\n\n数组的任何元素都可以通过关联一个称为索引的名字来随机引用。索引通常是偏移量（以字长度计算的距离基地址的距离），元素索引从零开始到\
    \ $n-1$ 结束。如下 -\n\n| | | | | | | |\n|---|---|---|---|---|---|\n\n`Array[index]=value;`\n\
    \n### 遍历数组 :-\n\n遍历意味着接触数组的每个元素以便对元素执行某种工作。遍历可以针对整个数组，也可以针对数量个元素。正如我们所知，元素是通过索引编号引用的，因此为了遍历数组，我们可以使用一个核心循环并关联其计数器来逐个引用元素。随着计数器的增加或减少，它会引用相应的元素。\n\
    格式-\n`For(counter=0;counter<size; counter++)`\n`Do with a [counter]`\n\n### 2D\
    \ 数组或矩阵 :-\n\n除了具有特定数量元素的一维数组外，C 还支持 2D 数组。（此处省略重复的描述性文本）\n\n2D 数组也被称为矩阵。\n\n\
    ### 2D 数组的声明和定义 :-\n\n除了具有特定数量元素的一维数组外，C 还支持 2D 数组。2D 数组的声明定义也被称为矩阵：\n\n```c\n\
    Data type identifier[dimension1][dimension2];\nint A[3][3];\n```\n\n#### 2D 数组的内存映射：\n\
    当我们声明一个大小为 $n \\times m$ 的 2D 数组时，会留出 $n \\times m$ 倍数据类型长度的数据，并跟踪第一个字节的地址，通过计算可以访问数组的哪个元素。在\
    \ C 中，2D 数组通常按行优先存储。\n\n### 引用 2D 数组元素:-\n\n2D 数组的任何元素都可以通过关联一个称为索引的名字来随机引用。索引通常是偏移量（以字长度计算的距离基地址的距离），元素索引从零开始到\
    \ $n-1$ 结束。如下 -\n\n| | | | | | | |\n|---|---|---|---|---|---|---|\n\n`Array[row][column]=value;`\n\
    \n### 遍历 2D 数组 :-\n\n遍历意味着接触数组的每个元素以便对元素执行某种工作。遍历可以针对整个数组，也可以针对部分元素。正如我们所知元素是通过索引编号引用的，因此为了遍历数组，我们可以使用嵌套循环并关联其计数器来逐个引用元素。随着计数器的增加或减少，它会引用相应的元素。\n\
    格式-\n`For(row=0;row<n; row++)`\n`  For(column=0;column<m; column++)`\n`    Do\
    \ with a [row][column]`\n\n"
