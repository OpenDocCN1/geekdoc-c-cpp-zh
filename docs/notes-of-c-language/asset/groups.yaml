    ```


    ## 位位或 ( | ) :-


    与位位与运算符类似，它比较其操作数的位并返回 1 位。如果其中任意一个在相应位置上为 1，则返回 1。


    ## 位位异或 (^) :-


    通过比较数值的位来返回 1 位。如果该位置上的位不同，则返回 1 位，否则返回 0 位。


    ## 位位左移 (<<) :-


    该运算符不是比较操作数的位，而是根据其右侧操作数，将其左侧操作数的位模式向左移动。


    例如，通常情况下 n<<p = N*2^p，

    因为将最高位移动一位会使数值翻倍。


    - (f) 位位右移 (>>) : :

    与左移类似，它也将位从左向右移动。结果为 n>>p=n/2^p，

    因为将最高位移动一位会使数值减半。


