    \n为了在显示器上打印字符串，我们可以使用 `printf %s` 和 `puts` 函数。\n`printf` 函数能够打印多个值，但在打印后不会移动光标；而\
    \ `puts` 函数一次只能打印一个值，并在打印后将光标置下一行。\n\n```c\nprintf(\"%s\",variable name);\nputs(variable);\n\
    ```\n\n# 处理字符串的库函数 :-\n\n以下是我们需要经常使用的某些字符串处理函数。要使用其中任何函数，我们必须包含 `string.h` 头文件。\n\
    \n### strlen() :-\n\n在很多情况下，我们需要知道字符串变量或常量的长度，以便我们从头到 `n` 或从 `n` 到头进行处理。我们可以使用\
    \ `strlen()` 并返回字符串中存在的字符数，包括空格但不排除 Null。\n\n## 格式：\n\n```c\nl=strlen(string);\n\
    ```\n\n### strcpy() :-\n\n众所周知，字符串变量不能直接赋值，但我们经常需要给字符串变量赋予新值（即已存在的值）。为了满足这一需求，有了\
    \ `strcpy()`，它有两个参数：第一个参数必须是需要赋予新值的字符串变量；第二个参数可以是字符串或常量，即赋值给第一个参数。\n\n```c\nstrcpy(target\
    \ string variable, source string variable or constant);\n```\n\n### strncpy()\
    \ :-\n\n它的工作原理与 `strcpy()` 相同，但有一个修改。它还接受第三个参数，即从源到目标的字符数量。格式：`strncpy(target\
    \ string variable, source string variable/constant,number of character);`\n\n\
    ### strncmp() :-\n\n此函数接受两个字符串参数，通过逐个字符比较它们，用第一个字符串的 ASCII 码减去第二个。比较持续到减法结果为 '0'\
    \ 或未找到 NULL 值。它返回以下值之一：\n\n- 零表示两者相同\n- 正值表示第一个字符串更大\n- 负值表示第二个字符串更大\n\n```c\n\
    strncmp(string1, string2);\n```\n\n### strcasecmp() :-\n\n此函数接受字符串参数并通过逐个字符比较它们，用第一个字符串的\
    \ ASCII 码减去第二个。比较在忽略字符大小写的情况下持续到末尾。`strncmp()` 是大小敏感的。\n\n```c\nstrncmp(str1,\
    \ str2);\n```\n\n### strcat() :-\n\n它的工作原理与 `strcpy` 类似，但接受第三个参数即一个整数值，并且只比较给定的字符数量。\n\
    \n```c\nstrcat(str1, str2, no of character);\n```\n\n### strcat() :-\n\n像 `strcpy`\
    \ 一样，它接受目标字符串和源字符串作为参数，但不是用源赋值目标，而是将源附加到目标字符串的末尾。\n\n```c\nstrcat(targetstr,sourcestr);\n\
    ```\n\n### strncat() :-\n\n它的工作原理与 `strcat` 相同，但有一个额外的参数即字符数量，这意味着只有指定数量的字符会被附加或拼接到目标字符串的末尾。\n\
    \n```c\nstrncat(source string, target string, number of characters);\n```\n\n\
    ### strchr() :-\n\n此函数帮助我们在字符串内搜索字符。它的第一个参数是字符串，第二个是字符。它检查字符串中的字符并返回其首次出现的地址。如果未找到字符，则返回\
    \ NULL。\n\n### strrchr() :-\n\n它的工作原理与 `strchr()` 相同，但从右侧开始扫描，并返回找到的地址，否则返回 NULL。\n\
    \n```c\nstrchr(string, char);      -> 左侧\nIf (strchr(string,char)!=NULL);\n  \
    \  If(strchr(get,'I')==NULL)\n        puts(\"found\");\nelse\n```\n\n# strstr\
    \ 和 Strstr() :-\n\n这两个函数的工作方式与 `strchr` 和 `str` 相同，唯一的区别在于它们的第二个参数也是字符串，这意味着它们用于字符串内从左或从右对应的字符序列。\n\
    语法：`strstr(string, string)`\n\n### strrev() :-\n\n这是一个非常实用的函数，它接受单个字符串参数并反转字符。最后一个字符放在第一个位置，第一个字符放在最后一个位置，依此类推。\n\
    \n```c\nstrrev(str1)\n```\n\n# 字符串数组 :-\n\n在很多情况下，我们需要存储单词列表或某些行文本。为了满足这一需求，我们定义了字符串数组。字符串数组实际上是一个二维字符数组，其中行包含特定数量的字符并以\
    \ NULL 字符结束，由于字符数组可以作为一个整体值来处理，我们不需要对每个字符串数组单独操作。\n语法：`char str[row][column];`\n\
    \n# 'C'语言中的自定义函数 :-\n\n作为一种结构化语言，每个 C 应用程序都被分为一个或多个模块。每个模块都是一个或多个函数的集合。函数是一个自包含的指令集，通过标识符存储以执行与应用程序相关的特定子任务。在\
    \ 'C' 应用程序中，每项工作都由函数完成。C 应用程序中的函数可以分为两类 :-\n\n- 库函数\n- 用户定义函数\n\n库函数是那些预定义的、预编译并作为单独程序存储在语言目录层次结构中特殊目录下的函数。对于几乎所有的常见工作，C\
    \ 库中都有相应的函数。但每个程序员都有特定的工作领域。因此，库中的函数不太可能满足所有类型程序员的需求。C 语言允许程序员根据自己的需求开发一套函数。\n\
    \n由程序员定义的、带有特定名称并存储在源文件中的函数称为用户定义函数（UDF）。UDF 存储在应用程序的上下文中。每个 'C' 应用程序至少有一个 UDF，即主函数。\n\
    \n用户定义函数的优点：使用定义函数有许多优点，因为 UDF 为我们提供了可用性。使用 UDF 我们的代码比单体代码更小。\n\n它减少了存储需求和编译时间。因为代码写在一个处并在处处。因此错误数量也减少了，调试变得更容易。最后减少了程序的维护时间。\n\
    \n应用程序内的函数由其他函数调用。函数是被动实体，在被其他函数调用之前保持静止。函数存在于应用程序中，处于调用者和被调用者的关系中。虽然应用程序中的函数地位相似，但任何人可以是调用者或被调用者。主函数只有一个特殊之处，即执行始终从\
    \ main 开始，main 由操作系统内核调用。其余函数由 main 在任何层级调用。\n\n如果程序中有除 main 外的 UDF，则会有三种与 UDF\
    \ 相关的语法：\n\n### 函数原型或声明 -\n\n它包含分号的函数头。函数头由返回类型、函数名以及可能包含参数列表的括号组成。\n\n```c\n\
    Return type functions(function argument ---------------);\nvoid print();\nlong\
    \ sums(int x y);\n```\n\n### 函数定义：\n\n函数定义与函数原型相似，但函数头的括号后面跟着一对括号，这构成了函数体并将其区分开。函数原型可以在另一个函数内部，也可以在全局空间。但函数定义始终存在于全局位置，它不会出现在任何其他函数内部。\n\
    \n```c\nReturn type function (argument)\n{------\n;\n------};\n```\n\n"
