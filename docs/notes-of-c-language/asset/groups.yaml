    ## 函数调用或函数存取：


    调用语法不包含任何数据类型。它仅由函数名组成，后面跟着括号内的值；传递值是可选的。调用语法始终存在于函数的体内部。

    格式：


    `function name (value to pass):`


    如我们所知，结构化编程数据存在两个层面：

    (a) 全局数据

    (b) 局部数据。全局数据对所有函数可用，而局部数据在调用者和被调用者之间通过传递和返回参数或参数共享。根据数据共享的级别，函数可以分为以下几类。


    ## 无参数无返回的函数：


    这类函数既不接受调用者传递的值，也不向调用者返回值。

    示例- 库函数 `clrscr()`。


    ## 有参数无返回的函数：


    这一类的函数可以接受来自调用者的一个或多个值，但不会向调用者返回值。例如- 库函数 `puts()` 和 `putchar()`。


    ## 有参数有返回的函数：


    当控制权传递给被调用者时，此类函数不向函数传递任何值，但它们总是向调用者返回一个值。

    例如- 库函数 `get()`、`getch()` 和 `getche()`。


    ## 有参数有返回的函数：


    大多数函数属于这一类。这类函数从调用者进程获取某些值，处理该值并将处理后的值返回给其被调用者。库函数 `printf`、`scanf`、`isalpha`、`strlen`
    都是这一类的示例。

    当遇到调用语法时，被调用者的执行被暂停，控制流转移到被调用者处，并带有传递的值以及返回的地址。被调用者体内的指令被执行，控制权返回到调用者中的地址。调用者的执行继续。


    ## 实参和形参：


    所有函数在程序内存块中都有各自的内存区域来存储其局部变量。当被调用者向其被调用者传递值时，即称为实参数。为了接收实参，在函数头中声明了变量。这些变量被称为形参数。实参存储在调用者的栈中，而形参存储在被调用者的栈中。


    由 Anjana Chaudhary 提供


    形式参数始终是实参数的副本。因此，如果形式参数的值发生变化，则不会反映在实参数上。当控制权返回时，调用者的栈存储实参。当控制权传递给它时，函数的栈被创建。形参作为实参传递的初始值分配在栈中。当控制权返回时，函数的栈被释放。因此，在程序的程序执行过程中，形式参数会被创建和销毁。


    | HEAP | RUNTIME |

    | :--- | :--- |

    | TIMEstack | PRIME AREA |


    ## return 关键字：


    `return` 关键字用于在函数体内将控制权返回给调用者。然而，在函数大括号结束前，需要 `return` 关键字来返回控制权。如果需要向调用者返回一个值，则作为实参数的返回。在函数体内，`return`
    可以出现多次。


    ## 存储类：


    这是另一个与变量相关的术语，声明时变量被存储在特定的存储类中。存储类描述了变量的四种属性：

    - 存储位置：告诉编译器将变量存储在 RAM 位置还是 CPU 寄存器。

    - 初始值：存储类指定在分配时给变量的初始值（或零）。

    - 作用域：存储类定义变量是局限于函数还是在整个程序范围内有效。

    - 存周期：变量在程序执行期间存活多久。


    有四种存储类：


    - (a) 自动存储类 (Auto)

    - (b) 静态存储类 (Static)

    - (c) 寄存器存储类 (Register)

    - (d) 外部存储类 (Extern)


    自动存储类：自动存储类指定变量存储在 RAM 位置，初始值为零。它的作用域是局部的，在函数的每次调用中有效。声明如下：


    ```

    auto data type variable;

    int x;

    ```


    由 Anjana Chaudhary 提供


    静态存储类：它是静态的，因为静态变量在程序执行期间保持稳定。这意味着静态变量存储在主区域而不是函数的栈中。因此，它们会被分配和释放。默认初始值为零。静态变量位于
    RAM 位置，作用域是局部的。使用关键字声明：`static data type var;`。


    寄存器存储类：它与自动存储类一样，要求将变量存储在 CPU 寄存器中。但如果寄存器为空，变量将存储在 RAM 位置并转换为自动。


    外部存储类：该类的变量也被称为全局，因为它们对所有函数可用，其生命周期贯穿程序。全局空间中声明的所有变量都属于此类。为了在外部类中保留变量，我们不需要用 `extern`
    关键字声明。在某些情况下，当在函数未使用变量时，需要用 `extern` 关键字声明。


    形式参数始终是实参数的副本。因此，如果形式参数的值发生变化，当控制权返回时不会反映在实参数上。当控制权传递给它时，函数的栈被创建。形参作为实参传递的初始值分配在栈中。当控制权返回时，函数的栈被释放，因此在程序的程序执行过程中，形式参数会被创建和销毁。


    | HEAP | RUNTIME |

    | :--- | :--- |

    | TIMEstack | PRIME AREA |


    ...（根据指令合并重复内容）


    ## 寄存器类型


    - 内存缓冲寄存器

    - 内存地址寄存器

    - 程序计数寄存器

    - 法器

    - 寄存器

    - 输入输出寄存器


    ## 递归：


    递归另一种直接或间接调用函数自身的工具。递归非常有用，例如树遍历、搜索。但事实是递归可能是无限的。所以我们必须设置某些基准条件，以便递归结束。


    ```

    Format()

    void main()

    {

    puts("recursion going to infinite");

    main();

    }

    ```


    ## 指针：


    指针是常量的二级类型，实际上内存位置的地址。指针变量可以持有指向常量、另一个变量或函数的内存位置地址。一旦地址存储在指针变量中，就可以通过解引用访问内存位置。由于这些变量指向另一个位置，被称为指针。指针的使用使得
    C 语言成为中间语言。等一下，这就是为什么人们说 C 语言


    通过指针处理地址工作有许多优势，例如：

    - 如果一个应用程序包含许多变量，并且某些函数必须操作调用者声明的变量的值。

    - 通过指针获取输入可以减少处理需求。

    - 由于数组内部通过指针处理，如果我们直接通过指针处理，就可以提高执行速度。

    - 字符串也是字符数组，使用指针处理字符串提供了许多便利。如果处理指针，我们可以对字符串进行直接赋值和比较。

    - 通过指针，我们可以创建一个字符串数组，其中所有元素可以有不同的字节分配。

    - 指针帮助我们根据需求动态分配和释放内存。

    - 动态分配内存允许我们创建自动大小的列表。


    指针变量的声明和定义：

    与任何其他变量一样，指针变量之前必须先声明。然而，指针持有指向常量、另一个变量或函数的内存位置地址。一旦地址存储在指针变量中，就可以通过解引用访问内存位置。由于这些变量指向另一个位置，被称为指针。指针的使用允许
    C 语言成为中间语言。格式为：


    ```

    Data type *Identifier;

    int ptr;

    char *cpt; doit *fp;

    ```


