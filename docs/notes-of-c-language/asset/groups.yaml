    ## Type casting :-


    Type casting is the process of converting one data type to another. In C, there
    are two types of casting: implicit and explicit.


    - Implicit Casting: This is carried out automatically by the compiler when a value
    of one type is assigned to another compatible type. For example, assigning an
    integer to a float.

    - Explicit Casting: This is carried out manually by the programmer using a cast
    operator. For example, converting a float to an integer.


    Type casting is useful when you need to perform operations on variables of different
    types or when you want to change the precision of a calculation.

