    ```\n\n# Library function to manipulate string :-\n\nFollowing are some string\
    \ manipulation functions we need to use frequently. To use any of these functions\
    \ we must include string.h header file.\n\n### strlen() :-\n\nIn many situation\
    \ we need to know the length of a string variable or constant, so that we can\
    \ handle it from beginning to n or, from n to beginning. We can use the strlen()\
    \ and return the number of character present in the string including space but\
