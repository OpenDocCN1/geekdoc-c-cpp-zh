    Identifiers Operators and Special Symbols


    # Keywords :-


    Every language has their own set of keywords. A keyword is the part of statement
    which has a fixed meaning for the compiler. The compiler translates the keyword
    in to a particular bit sequence I.E then executed by the processor to do certain
    task.


    In C there are only 32 keywords 27 of them were provided by Dennis Ritchie while
    five added by ANSI. Following the C keywords.


    # Data type related keywords :-


    All these keywords are used to specify type of a variable or return type of a
    function :- int,char,short,long,float,double,signed,unsigned.


    # Secondary data type related keywords :-


    Used to declare secondary type variable or user defined data type- Struct,union,
    typedef, enum, const


    # Branching keywords :-


    Used to create branching construct :- if,else,switch ,case ,default


    # Looping keywords :-


    Used to form looping construct :- While ,do ,for.


    # Control transfer keywords :-


    Used to transfer control of flow- Break ,goto ,continue


    # Storage class related keywords :-


    Used to specify storage class of variables- auto ,static,register,extern


    # Other :-


    return,volatile,enum,sizeof,const.'
  - '[PAGE 4]


    # Constant:-


    Constants are the values written literally in a program. This kind of values cannot
    be changed during one or more execution of the program. In other words we can
    say that constants are the value which are not identified. So they cannot located
    and hence cannot be changed.


    There are two basic type of constant.


    Primary constant and Secondary constant.


    Primary constant :-


    A primary constant is an individual value used within a program. There may be
    two types of primary constant numbers and characters.


    Numbers :-


    Any number is made up of digits positive negative symbols decimal point and exponents.
    The numbers can be used as integers and for real number.


    Any integer consists of one or more digits the +ive -ive signs. It must not contain
    decimal point and any other symbol. The integer can be represented in decimal,
    octal or hexadecimal form.


    When the numeric values are increased or decreased integer are not sufficient
    to represent them in situations we need use of fraction. A number consisting of
    digits,+,- signs decimal point and exponential parts are called as real. Real
    numbers may be written in fractional and exponential format.


    Character:- anything enclosed within single quotes is character as- ''a'', ''2''
    ''> '' etc.


    # Secondary constant :-


    A secondary constant always depends on one or more primary constant. It may be
    a list or collection it may be address of some location. Secondary constant are
    found in the form of array_string,structure,union and pointer.


    An array is collection of homogeneous values. A string is a collection of zero
    or more characters enclosed within a pair of double quotes. In the other hand
    and structure is collection of heterogeneous values used to represent complete
    information about an organism.


    # Identifiers :-


    Identifiers are the names given to different components of our program such as
    variables, functions and labels. To form this identifier rules are defined by
    the designers. These are :- An identifier must consists of alphabet, digits and
    underscore.


    No space and special symbols are allowed in an identifier.


    It must not be more than 256 characters.


    # Valid Identifier


    # Invalid Identifier


    +   Roll

    F_NM

    VAL1

    _pnm


    +   1 VAL

    F-NM

    I - PER

    $ NAME


    Provided by Anjna Chaudhary'
- md: "\n# Variables :-\n\nVariables are identified memory locations in which we can\
    \ keep different values at different times during one or more execution of the\
    \ program.\n\nThe main difference between constant and variable is that constants\
    \ have only read value (R) while variables both have R value and location value\
    \ (L). Since they have L value we can refer to them and so change the value of\
    \ memory location. Each variable is able to hold a particular type of value.\n\
    \nWith a C program variables we are going to use in the function must be declared\
    \ before writing any other statement of the program.\n\n# The declaration syntax\
    \ is\n\nData type variable;\n\n# Data Types\n\nTo keep our values inside the main\
    \ memory we need to declare variables. The variable declaration requires the specification\
    \ that how long the word length of this variable will be and which kind of values\
    \ this variable will store. Data types are the technique which tells the compiler\
    \ about this specification.\n\nThe C language provides a vast range for integer\
    \ and real numbers. Even it provides six separate data type for the integers and\
    \ we can select the best one for our requirement.\n\n# The data types for integers:\n\
    \n- Short :- it is specified by the keyword `int` or `short`. we use it to store\
    \ entirely small numbers. the word length is machine dependent on the machine\
    \ up to 16-bit it is two bytes long variable i.e. -128 to +127 or -32768 to +32767\n\
    \n- Int :- if we use size of integer variables then C provides the `int` data\
    \ type. the size of it is 2 bytes on the machine up to 16-bit but it is 4 bytes\
    \ for higher configuration. The first bit of variable is used to store the sign\
    \ value that is for +ve and for -ve that the rest of the bits are used to store\
    \ the binary magnitude of the numbers. The range of value is -32768 to +32767\
    \ or -2147483648 to +2147483647\n\n- Long :- it is used to store integer value.\
    \ it has a size of 4 bytes. Among the first bit is used to store the sign the\
    \ range is -2147483648 to +2147483647. All the data types has their unsigned parts\
    \ same length but the range of value is doubled because they do not store the\
    \ sign value.\n\n# Data types for real numbers\n\nTo store real numbers C provides\
    \ following data types:\n\n- Float :- it is used to store small fractional numbers\
    \ by 4 bytes in which fractional and exponential format it provides word length\
    \ in which we can store up to decimal. The range of value is -3.4e-38 to +3.4e+37\n\
    \n- Double :- it has 8 bytes of precision are sufficient for our problem we can\
    \ use double data type. range -1.7e-308 to +1.7e+308\n\n- Long double :- sometimes\
    \ we may need higher precision than double c provides long double types with word\
    \ length of 10 bytes and the range of value is -1.1e-493 to +1.1e+493\n\n# Data\
    \ types for characters\n\nTo store single character:\n- Char :- it has a signal\
    \ word length in which character is stored in both signed and unsigned form it\
