- md: "\n## Function calling or function invocation:-\n\nThe invocation syntax does\
    \ not contain any data type. It just consist of their function name, followed\
    \ by the value within parenthesis semicolon passing the value is optional. The\
    \ invocation syntax always be present within the body of another function.\nFormat:\n\
    \nfunction name (value to pass):\n\nAs we know the structured programming data\
    \ is present at two levels:-\n(a) As global data\n(b) As local data The global\
    \ data is available to all the functions while the local data is shared between\
    \ the caller and the callee passing and returning argument or parameter. According\
    \ to level of data sharing the function can be divided into following categories.\n\
    \n## Function without argument without return:-\n\nSuch kind of functions neither\
    \ accept a value from the caller nor return a value to their caller.\nExample-\
    \ The library function `clrscr()`.\n\n## Function with argument without return:-\n\
    \nFunction of this categories may accept one or more values from their caller\
    \ but don't return a value to their caller. e.g.-The library function `puts()`\
    \ and `putchar()`.\n\n## Function with argument with return:-\n\nWhen sending\
    \ the control to the callee does not pass any value to the function of this category,\
    \ but they always return a value to their caller.\ne.g.-The library function `get()`,\
    \ `getch()` and `getche()`.\n\n## Function with argument with return:-\n\nMost\
    \ of the functions fall in this category. Such kind of function takes some value\
    \ from their caller process this value and return the processed value to their\
    \ callee. Library function-`printf`, `scanf`, `isalpha`, `strlen` are all example\
    \ of their category. \nWhen the invocation syntax is encountered the execution\
    \ of the callee is suspended and the control of flow is to the place of callee\
