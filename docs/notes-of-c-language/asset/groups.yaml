    # Array:-


    When we need to store a group of data items, we must follow some manner to organize
    the storage. The data items creating group are collected together by producing
    a relationship between them is called data structure.


    An array is a static data structure. It is a collection of homogenous data item
    stored in contiguous memory locations. That means there is a physical and mathematical
    relationship between the elements of array. If the address of an element is known
    ,we can easily calculate the address of other elements.


    We create an array when we have to store and handle a number of variable having
    same type of information and to be operated in same manner. However, creating
    an array of n size declaring n number of i takes some memory capacity. But it
    is easy to handle the elements of an array because all the memory location making
    the element of an array share the same name but can speciified individually by
    their offset. (index)


    # Declaration of array :-


    An array is also a variable therefore it must be declared before it''s use. An
    array is declared in the same way as other variables except the dimension of array
    is subscribed with the identifier.


    ```

    Syntax -

    Data type identifier[dimension];nint A[5];nfloat x[2];ndouble D[25];

    ```


    The dimension value always be constant integers however it could be macro created
    with or symbolic declare with const keyword.


    # Definition of array :-


    As have defined some primary variables to avoid, we can define an array also by
    providing initial value for its elements. It could be done in


    ```

    Data type identifier[dimension]=(x1, x2);

    Datatype name[]={v1,v2,v3....};

    ```'
