  mdcn: "\n由于任何变量分配的内存都会被赋予一个默认初始值，指针分配的内存也会赋予一个默认初始值，即在某些情况下为垃圾值。指针拥有垃圾值更为危险。它可以导致指针悬空（悬空指针指向一个内存位置，即尚未分配的内存位置）。另一方面，指针可能会被赋值另一个内存位置的地址，即被分配给另一个指针，解引用该指针可能会破坏该位置的内存。甚至会导致系统崩溃，因此指针必须被定义。在定义中，指针可以赋值为\
    \ 0；Null 或已声明变量的地址，因此说声明指针的正确方法是：\n\n```\ndata type *identifier=0; *ptr=0;\nint\
    \ n; *ptr=n;\n```\n\n有一种特殊的指针类型，它可以持有任何类型的地址，即空指针，在进行类型转换之前它们是没有区别。\n\n## 访问值的地址:-\n\
    \n`&`（取地址）运算符用于访问变量的地址。指针变量可以赋值为带有此操作符的变量以获取地址。\n```c\nprintf(\"%d\",*ptr);\n\
    ptr=&var;\n```\n\n## 通过指针获取变量的值:-\n\n`*`（地址的差值或递减）运算符用于访问存储在指针中的变量地址的值。\n```c\n\
    printf(\"%d\",*ptr);\n```\n差值运算符可以用任何类型的算术或逻辑语句中。\n\n## 指针算术与逻辑:-\n\n通过指针本身的值，我们可以执行两种算术操作——加法和减法。对指针加减\
    \ `n` 实际上是加减了 `n * 指针类型的字长`：\n```\nptr=ptr+n;\n*ptr=ptr+n*(data type);\n```\n\n\
    通过对指针进行递减，我们可以移动相邻的位置。指针可以使用任何关系运算符相互之间、与常量值或 Null 值进行比较。\n例：\nIf(ptr1==ptr2)\n\
    While (ptr<5)\nIf (ptr!=Null)\n\n## 指针与数组:-\n\n指针和数组之间存在关系。当我们声明一个数组时，编译器本身也会声明一个与数组同名的常量指针，该指针被赋值为第一个元素的地址，称为基地址。当我们在数组上使用下标来引用数组的元素时，实际上是将指定的索引乘以字长，并将结果加到该常量指针的值上。我们\n\
    \n基于这种关系，我们可以通过指针轻松处理数组。我们可以拥有一个赋值给基地址的指针；然后通过增加它来遍历数组。如下——\n\n```\nint a[10],\
    \ *ptr;\nptr=&a[0]; ptr=a;\nboth are same\na[i] means\na+i*wl(a)\n```\n\n## 指针与字符串:-\n\
    \n由于字符串也是字符数组，指针和字符串之间也存在同样的关系。这种关系允许我们以不同的方式处理字符串。我们可以将字符指针赋值为常量字符串或另一个字符指针，我们可以进行比较，并可以创建一个变长度字符串数组。\n\
    \n## 按值传递和按地址传递:-\n\n众所周知，调用者向被调用者传递参数。实际参数的副本被传递给形式参数。因此，调用者不能更改实际参数的值。如果需要调用者更改所传递变量的值，那么调用者可以发送它们的地址。这被称为按地址传递。\n\
    \n按地址调用。如果实际参数是一个地址，被调用者必须在头文件中声明一个指针来接收该地址。传递参数的默认设置是按值传递。\n\n```c\nvoid change(int\
    \ *n)\n{\n  *n=7;\n}\nvoid main()\n{\n  int x;\n  scanf(\"%d\", &x);\n  printf(\"\
    %x=%d\",x);\n  change(&x);\n  printf(\"%x=%d\",x);\n}\n```\n\n## 将数组传递给函数 :-\n\
    \n数组总是按地址传递的。要向函数传递数组，我们只需传递它的名称，即实际上持有基地址的常量指针。同时还会传递要处理的元素个数。如果在向函数传递数组时指定了任何值，则传递的是特定的元素，而不是整个数组。\n\
    \n函数可以通过下标符号或指针表示法接收数组。使用指针表示法使函数能够用于数组或单值。\n\n```c\nvoid input(int *a, int n)\n\
    {\n  int c;\n  for(c=0;c<n;c++)\n  scanf(\"%d\",a[c]);\n}\n```\n\n由 Anjia Chaudhary\
    \ 提供\n\n## 结构体:-\n\n在现实世界的编程中，我们经常需要处理记录。众所周知，记录是字段或属性的集合。其中属性描述了对象的单一特征。构成记录的值可以是不同的类型。使用结构体\
    \ 'C' 处理记录允许我们使用不同类型的值。这种组合被称为结构体。结构体是一个模板或蓝图，代表现实世界条目的特定类型的记录。要处理此类实体，我们首先需要通过收集表示实体的字段来定义结构体。\n\
    \n## 结构体的定义 :-\n\n定义结构体使用 `struct` 关键字，后面跟着结构体的名称。之后是一个声明成员的结构块。块以分号结束。然而，我们可以在\
    \ `struct` 关键字之前使用 `typedef` 语句，然后在大括号或分号之间给出名称。\n\n## 格式 :-\n\n```c\nstruct name\n\
    {\n  data type member1;\n  data type member2;\n};\n```\n\n或者使用 `typedef`：\n\n\
    ```c\ntypedef struct\n{\n  data type member1;\n  data type member2;\n} name;\n\
    ```\n\n## 声明结构体变量 :-\n\n```c\nstruct name\n{\n  data type member1;\n  data type\
    \ member2;\n} var1;\n```\n\n或者使用 `typedef`：\n\n```c\ntypedef struct\n{\n  data\
    \ type member1;\n  data type member2;\n} name;\nname var1;\n```\n\n如果使用指针：\n\n\
    ```\nstruct name *ptr;\n```\n\n```\ntypedef name *ptr;\n```\n\n## 访问结构体的成员 :-\n\
    \n当我们在处理结构体变量时，向其成员写入或读取值。因此我们需要单独引用成员。点运算符配合结构体变量，后面跟着成员名。如下——例：\n```c\nsn.roll=101;\n\
    ```\n\n## 结构体与数组:-\n\n由于结构体是异构值的集合，它可以拥有成员，即任意类型的数组。另一方面，我们可以声明一个结构体类型的数组。在这两种情况下，下标运算符都用在相应的位置。\n\
    \n作为成员的数组：\n\n```\nVar.A[index]\n```\n\n结构体数组：\n\n```\nVar[index].Member\n```\n\
    \n## 结构体中的结构体或嵌套结构体 :-\n\n很多时候可能会发生结构体需要有一个成员，即也由多个值描述。在这种情况下，结构体可能会声明属于另一个结构体的变量。表示成员的类型可以定义在全局位置或所有者结构体的块内部。\n\
    \n当一个结构体定义在另一个结构体的块内部时，被称为嵌套结构体。\n\n嵌套结构体类型的变量只能在所有者结构体的块内声明。如果结构体变量有一个结构体成员，其成员需要通过使用双运算符来访问。如下：\n\
    \n```\nVar.member.member\n```\n\n## 将结构体传递给函数 :-\n\n结构体变量的成员和变量本身都可以像其他变量一样传递给函数。这种传递再次有两种方式，即按值传递和按地址传递（引用）。\n\
    \n## 结构体与指针:-\n\n正如我们可以将变量的地址存在指针中，结构体类型变量的地址也可以存储在指针中。声明结构体指针使用 `struct` 关键字。如果没有使用\
    \ `typedef`，类型名称如下：\n\n```\nstruct name *pointer;\n```\n\n```\nStruct *pointer\
    \ ;\n```\n\n如果使用指针，通过指针访问成员。我们使用以下方法之一。\n\n使用点运算符配合差值：\n\n```c\n(*pointer).member\n\
    ```\n"
