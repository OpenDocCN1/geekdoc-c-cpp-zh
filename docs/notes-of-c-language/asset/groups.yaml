    # ### The do loop:-


    The do while construct is an exit control loop. There may be situation in which
    we need that the body of loop must be executed at least once. In such a situation
    we can use the do while loop.

    This is started with the keyboard do followed by the body of loop. ie then followed
    by the keyword while having condition after its parenthesis there must be a ;
    Control of flow is just past to the body of loop, it is executed then the condition
    within the while is checked. If the condition is evaluated true the control of
    flow is passed back to the keyboard. Otherwise it is passed to the next statement
    after while.


    # ### Format:-


    ```

    do

    {

    loop body

    } while (condition);

    ```


    # ### Nesting of loop:-


    There be situation in which we have to repeat a block of instruction and within
    that block of instruction there are some statement which has to be repeated also.
    To handle such situation we are allowed to nest a looping structure within the
    body of another loop. This nesting can be done up to 255 levels. In one repeated
    of the outer loop the inner loop completes all its cycle.

    Therefore the total number of repeat for the inner loop will be of repeat for
    inner loop multiplied (*)with number of repeat for outer loop.

    Any loop can be nested within any other loop without regarding its type.


    # ### Format:-*


    ```

    for (----)

    {

    while (condition)

    {

    }

    }

    ```


