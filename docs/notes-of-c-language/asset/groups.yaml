    \ 提供了不理想的结果，使得它们看起来像一个单一的值。\n\n为了产生理想输出，我们可以在格式化字符串中使用转义字符来产生换行或制表符。此外，通过类型说明符，我们有一些格式化特性来组织输出。这些如下：\n\
    \n- 使用 `%d`，我们可以在 `%` 和 `d` 之间添加一个整数值来指定输出宽度为 `%7d`。我们还可以添加一个点和一个整数来指定打印的数字位数，如\
    \ `%.3d`。我们可以将两者结合使用为 `%10.3d`。\n- 使用 `%c`，我们可以添加宽度指定为 `%6c`。\n- 使用 `%s`，我们可以同时指定宽度和字符数为\
    \ `%7.3s`。\n- 使用 `%f`，我们可以同时指定宽度和精度，但 `n` 是用来指定小数点后的数字位数的，如 `%9.3f`。\n\n## 数学函数和\
    \ math.h 头文件:-\n\n我们有许多需要执行的算术和三角运算工作。对于所有这些常用操作，C 库中预先并存储了一系列库函数。所有这些与数学相关的函数都在\
    \ `math.h` 头文件中声明。如果我们在程序中包含此文件，就可以使用这些函数。以下是一些常见的数学函数。\n\n- `pow()`：此函数接受两个参数，double\
    \ 类型的 `n` 和另一个整数 `p`——计算 `n` 的 `p` 次方并以 `double` 类型返回结果。\n  语法 - `pow(n,p);`\n\
    - `sqrt()`：它接受一个参数并返回传入值的平方根。\n  语法 - `sqrt (n);`\n- `abs()`：它接受一个 double 类型参数并返回参数的绝对值，即不带符号符号的值。\n\
    \  语法 - `abs(n);`\n- `round()`：此函数接收两个参数 `n` 和 `d`，其中 `n` 是 double 类型值，`d` 是整数。它返回将\
    \ `n` 向上舍入到指定的 `d` 位数后的结果。\n  语法 - `round (n, d);`\n- `ceil()`：此函数取一个小数并通过对小数部分向上取整来返回该值，但不小于当前值。因此它通过加\
    \ 1 返回其参数的整数部分。\n  语法：`ceil(n);`\n- `floor()`：它的工作原理类似于 `ceil`，但不会返回大于其参数的值。因此它返回参数的整数部分。\n\
    \  语法 - `floor(n);`\n- `sin()`：它接受一个角度作为参数，计算并返回该角度的正弦值。\n  语法 : `sin(a);`\n-\
    \ `cos()`：它接受一个角度作为参数并返回该角度的余弦值。\n  语法 - `cos(a);`\n- `tan()`：它接受一个角度作为参数，计算正切值并返回。\n\
    \  语法 - `tan(a);`\n- `acos()`：它接受一个角度作为参数，计算双曲余弦并返回。\n- `asin()`：它接受一个角度作为参数，计算该角度的双曲正弦值。\n\
    \  语法 - `asin(a);`\n- `atan()`：它接受一个角度作为参数，计算该角度的双曲正切值。\n  语法 - `atan(a);`\n\n\
    ## 字符函数和 type.h 头文件 :-\n\n`type.h` 头文件包含适用于单个字符的库函数。其中一些函数用于检查传递给它的字符状态。以下是组中一些常见的字符。\n\
    \n| 函数 | 描述 |\n| :--- | :--- |\n| isprint(char) | 检查是否可打印 |\n| isalnum(char) |\
    \ 检查是否为字母|数字|数字 |\n| isalpha(char) | 检查是否为字母 |\n| isdigit(char) | 检查是否为数字 |\n\
    | ispunct(char) | 检查是否为标点符号 |\n| isspace(char) | 检查是否为空格 |\n| isupper(char) |\
    \ 检查是否为大写 |\n| islower(char) | 检查是否为小写 |\n\n所有这些函数返回 0 或非零值。0 表示假，非零表示真。我们可以检查返回的值或根据其做出决定。\n\
    \n还有两个函数接受字符作为参数并返回其大小反转后的参数。这些函数是：\n- `tolower(char)` – 返回小写字母。\n- `toupper(char)`\
    \ – 返回大写字母。\n\n## 分支和条件语句:-\n\n通过计算条件的真假值来执行一个指令块的技术称为分支。作为一种结构化（语言），'C' 语言也支持分支技术。为了使用这种技术，'C'\
    \ 提供了两个条件语句：`if-else` 语句和 `switch-case` 语句。\n\n`if` 语句有四种形式，这些是：\n\n### 简单 if\n\
    \n在某些情况下，我们只需要当给定条件为真时执行一个语句块。在这些情况下，我们使用简单 `if`。\n\n```c\nif (condition)\n{\n\
    \    statement;\n}\n```\n\n### if-else\n\n在某些情况下，我们只需要当给定条件为真时执行一个语句块。如果条件为假，我们需要执行另一个语句块。在这种情况下，我们使用\
    \ `if-else` 。\n\n```c\nif (condition)\n{\n    statement;\n}\nelse\n{\n    statement;\n\
    }\n```\n\n### 嵌套 IF – ELSE\n\n在实际编程中，可能会出现在评估一个条件为真后我们需要检查另一个条件，或者在评估第一个条件为假后我们需要检查另一个条件的情况。为了处理这种情况，我们在另一个\
    \ `if` 或 `else` 块中给出 `if-else` 语句。这被称为嵌套 `if-else`。嵌套深度可达 255 层。\n\n```c\na) If\
    \ (condition1)\n{\n    If (condition2)\n    {\n    }\n    else\n    {\n      \
    \  inner else block;\n    }\n}\nelse\n{\n    outer else block;\n}\n```\n\n```c\n\
    b) If(condition1)\n{\n}\nelse\n{\n    If(condition2)\n    {\n    }\n}\n```\n\n\
    ```c\nc) If(condition1)\n{\n}\nelse\n{\n    If(condition3)\n    {\n    }\n   \
    \ else\n    {\n    }\n    }\n}\n```\n\n### if-else 阶梯:-\n\n在很多情况下，我们有多个执行单一任务的选择，或者我们可能需要在相互检查的各个条件下执行不同的工作。在这种情况下，`if`\
    \ 语句随语句连续出现，如果正确缩进，就形成了阶梯状结构。因此被称为 `if` 阶梯。在这种 `if` 形式中，当条件被评估为真时，控制流传递到随后的块，执行完该块后传递到最后一个\
    \ `else` 的下一个条件，依此类推。\n\n```c\nIf (condition1)\n{\n}\nelse\nIf (condition2)\n\
    {\n}\nelse\nIf (condition3)\n{\n}\nelse\n{}\n```\n\n## AND 运算符和 OR 的使用\n\n当我们需要检查多个条件是否为真以执行特定任务时，为了这个目的，我们需要嵌套\
    \ `if`。但嵌套的 `if` 可以通过 `&&` 运算符来减少。我们知道 `AND` 运算符接受两个输入并在仅当所有这些都为真时才返回真。因此我们可以使用\
    \ `AND` 运算符消除嵌套。格式为\n\n提供：Anjana Chaudhary\n\n"
