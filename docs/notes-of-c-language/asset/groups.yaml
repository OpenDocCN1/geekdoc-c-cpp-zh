  mdcn: "\n\n## 使用箭头运算符:-\n\n指针 -> 成员\n\n例如:-\n\n```\nstruct sn, *sptr;\nsptr=&sn;\n\
    (*sptr).marks=78;\n```\n\n或者\n\n```\nsptr->marks=78;\n```\n\n## 联合体 (Union):\n\
    \n它是一种节省空间的类型，就像结构体一样。它也被用于表示记录。但结构体和联合体的主要区别在于，内存中只能存储联合体变量中的一个成员。\n\n联合体变量的内存映射：存储联合体变量所需的字节数等于其最大成员的字长。成员在相同的位置的不同时间被存储。在处理过程中操作哪个成员取决于当前存储的成员类型（动态决定）。\n\
    \n## 联合体数据类型的定义:-\n\n联合体的定义方法与结构体相同，均使用关键字 `union`。\n\n```c\ntypedef union\n{\n\
    \    Data member;\n} name;\n```\n\n## 联合体变量的声明:-\n\nunion name variable;\n\n联合体变量的内存映射。联合体变量映射的内存字节等于其最大数值的大小。注意\
    \ – 其他与结构体相同，只是我们需要逐个操作成员。\n\n## ‘C’语言中的文件处理:-\n\n文件是操作系统提供的用于存储数据或程序的存储设备上的最小单元。任何想要长期保留的内容都以文件的形式存储在质质设备上。每当我们需要文件中存储的数据时，它会以主内存的形式打开，以便处理器可以进行读取。\n\
    \n当我们执行程序时，它会创建数据，即存储在主内存中。由于主内存具有易失性，程序创建的数据将会丢失，除非将其写入文件。另一方面，某些程序可能需要为了以后使用写入数据，我们在执行时必须频繁地输入大量数据。在这种情况下，从键盘输入数据非常耗时，我们希望将这些数据存储在文件中，以便从那里输入到程序内存区域。为了满足这一需求，编程提供了一些处理文件的方法，C语言也是如此。C语言中任何其他内容的处理也依赖于在头文件\
    \ \"stdio.h\" 中声明的函数。此外，该头文件中还定义了名为 `FILE` 的类型，它描述了文件的属性，如名称、大小、读/写指针、EOF 字符等。\n\
    \n要操作文件，首先需要打开它并记录其基地址以便进行访问，因此，文件处理的工作从声明一个\n\n`FILE *name;` 指针开始。\n\n示例- `FILE\
    \ * fp;`\n\n## 之后我们使用以下函数完成工作 :-\n\nfopen ();- 此函数用于打开文件，这意味着将文件加载到主内存中并返回其基地址\
    \ `FILE` 指针。有时它可能无法加载文件，此时返回空指针。文件可以用不同的模式打开，因此它接受两个字符串参数，指定文件名和模式类型。以下是我们可以传递给\
    \ `fopen()` 的模式指定符：-\n\n- (A) \"r\" - 如果文件存在，则以只读模式打开，并将读指针设置在第一个字节。如果不存在则返回 NULL。\n\
    - (B) \"r+\" - 与 \"r\" 模式类似，也允许向文件中写入。\n- (C) \"w\" - 以可写模式打开指定的文件，这意味着创建一个新文件来保存我们的数据。它将写指针设置在第一个字节。如果指定的文件已存在，则覆盖它。\n\
    - (D) \"w+\" - 与 \"w\" 模式类似，但如果指定的文件已存在则不会覆盖，允许对其进行读取和修改。\n- (E) \"a+\" - 以追加模式打开指定的文件，然后写指针被设置为文件末尾；如果不存在，则创建一个新文件。\n\
    - (F) \"a\" - 与 \"a\" 模式类似，但也允许从文件中读取并修改文件。\n\n示例- `fp = fopen (\"text\", \"a+\"\
    );`\n\n- fclose ();- 完成工作后应关闭文件，以便释放被占用的内存并用于其他工作。文件的关闭通过将持有文件地址的指针传递给 `fclose()`\
    \ 来。\n- ftell ();- 我们可以使用此函数来了解读/写指针当前所在的位置。知道这对于进行随机操作非常有用。它以字节的形式返回位置：示例 - `n\
    \ = ftell (fp);`\n\n## rewind ( ):--\n\n此函数用于将读/写指针从当前位置重置到第一个字节。\n\n## fseek(\
    \ ):--\n\n这对于随机访问文件进行读/写非常有用。向函数传递多种参数，以便将读/写指针放置在特定字节处。它可以使用以下形式：\n\n- fseek(ptr,\
    \ n, 0) - 将指针置于当前位置的第 n 个字节。\n- fseek(ptr, n, 1) - 将指针置于当前位置的第 n 个字节（注：此处示例逻辑与上相同，通常指偏移）。\n\
    - fseek(ptr, n, 2) - 将指针置于文件末尾的第 n 个字节。\n- fseek(fp, 0, 0) - 置于开头。\n- fseek(fp,\
    \ 0, 2) - 置于末尾。\n- fseek(fp, 0, 1) - 保持在当前位置。\n\n## 从文件中读取和写入:--\n\nputc( ):-\
    \ 可用于在指定文件的当前位置写入一个字符。语法如下为\n\n```c\nputc('char', file pointer)\n```\nputw( )-\
    \ 用于向文件写入一个值 `putw(int, fp);`\nputs()- 可向文件中写入一个字符串 `puts(\"string\", fp);`\n\
    fprintf( ): 可用于向文件写入不同类型的值。\nfprintf(fp, \"specifier\", var);\nfprint(fp (\"%s\"\
    , var);\n```\n\ngetc( ):- 从文件中读取一个字符如 `vn = getc(fp);`\ngetw( ): 从文件中读取一个整数如\n\
    \n```c\nVar = getw(fp);\n```\n\nfgets( ):- 类似于 gets，但用于从文件中读取字符串。它接受一个字符串文件指针和要读取的字符串长度。\n\
    `gets( string,length,filepointer );`\n\n示例. `gets( str, 20, fpn );`\nscanf( ):-\
    \ 用于从文件中读取不同类型的值。\n\n```c\nscansf( filepointer, \" format specifier \", &var)\n\
    ansf( fp, \"%f\", &val );\n```\n\neof( ):- 如果找到文件末尾，则返回真。因此，可以作为从头到尾读取文件时的循环条件。\n\
    \n"
