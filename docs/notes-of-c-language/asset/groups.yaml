    # HISTORY OF C


    By 1960 the high level languages available for programming were developed for
    specific purposes. This situation limited the programmers to work from a particular
    type of problem solution. To overcome this limitation a common programming language
    was needed an international committee was set to develop such a language. This
    committee came out with ALGOL-60 a general high level programming language.


    However ALGOL-60 never became popular because it was general. Due to its generality,
    a new language CPL (COMBINED PROGRAMMING LANGUAGE) was developed at Cambridge
    university but CPL had many features that it was hard to learn and difficult to
    implement.


    Later on another language named BCPL was developed by Martin Richards at Bell
    lab of AT&T . But unfortunately it turned out to be powerful. Around the same
    time as the BELL lab AT&T, a programmer named KEN THOM developed a language as
    a further simplification of CPL named as B. But it also turned out be very specific.
    After that at the laboratory a programmer named DENNIS RITCHIE inherited the features
    of BCPL and added some of own and developed a language in 1972. This language
    was named “C” as a next step of language “B”. In 1983 a committee was established
    to create ANSI version of C. ANSI was finally adopted in December 1989. The first
    copy was released in 1990 as C39. The standard was also adopted by ISO, as ANSI/ISO
    standard C.


    During 1990 work on C continued as C99 . In general C99 retained all the features
    of C89 with a little addition.


    # INTRODUCTION AND FEATURES OF “C”


    ![](img/a82bd3224fd572cdc958a29e758ad59a_0_0.png)


    “C” is one of the most powerful and popular language. Its popularity is due to
    its many desirable features. It is a structured modular programming language in
    which an application can be developed as a collection of module it has a rich
    set of built- in function and operators which makes the writing of complain program
    easier, the “C” compiler combines it is well suited to developed both system and
    application softwares.


    C supports a vast range of data types to make the program more space efficient.
    The “C” program run much faster than the program by using any other language of
    this category.


    “C” is very simple to learn because it has only 32 keywords. But it is more powerful.
    Its power lies in its built in function library. In addition C allows enhancing
    its library by adding new functions.


    Being a structured modular language and having certain additional features. It
    allows to be used at lower level. This feature fills the gap between assembly
    language and conventional high level languages. Since programs are partition in
    modules and functions. The programmer can concentrate at a particular point as
    well as parallel programming is possible which reduces the production time.


    Provided by Anjna Chaudhary'
