    # 2D Array or matrices :-


    In addition to single dimensional array having certain number of element, C supports
    2D array also. For a 2D array we can specify the number of row and then the number
    of column per row.

    A 2D array is also known as matrix.


    # Declaration and definition of 2D Array:-


    A 2D array is declared by subscribing its two dimensional as:

    Data array [rows][column];nFor the definition of 2D array element value can be
    provided grouped by the curly braces or within the single curly braces also the
    format:

    Data type A[R][C] = {V1, V2.......},

    {V1, V2.......},

    { };


    # Memory map of 2D array :-


    However we assume a 2D array as a group of value organized row by row. But in
    the memory the value are stored in a leaner fashioned one after another. For all
    of the elements of first row are stored then the elements of second row and so
    on. Each row has its own index and the column in their row has their own index:


    | AR1C1 | A2R0 |

    |---|---|

