- img_proc: true
  md: 'The formal arguments are always a copy of their actual argument. Therefore
    if there is a change in the value of formal argument i.e. not reflected in the
    actual argument when the control is returned back. The stack of the function is
    created when the control is passed to it. The formal argument is allocated in
    this stack with the initial values as passed by actual argument. The stack of
    the function is disposed when the control is returned back , therefore the formal
    arguments are created and disposed many times during a single execution of the
    program.


    | HEAP | RUN |

    | TIMEstack |

    | PRIME AREA |


    # Return Keyword:-


    The return keyword is used within a function body to send the control back to
    the caller. however from the closing braces of the function control automatically
    return back to the caller but we need the return keyword to send the control back
    before the closing braces in a particular situation . If the caller has to return
    a value to its caller then it is given as the argument of the return. The return
    can accept only one value. Within a function body the return can be appeared multiple
    time.


    # Storage class :-


    This is another term related with a variable we declare , variables are stored
    in a particular storage class. The storage classes describe four qualities about
    the variable. These are-

    Place of storage:- They tell the compiler where to store the variable either in
    the RAM location or in the CPU register.


    The default initial value:- It is storage class which specify what value will
    be given by the compiler to the variable at the time of allocation either garbage
    or zero.


    Scope of variable:- The storage class define that either variable will be confined
    to the function declaring it or It would be alive to all the function of a program.


    Life or longevity of the variable:- How long the variable will be alive is also
    specified by the full execution of the program or they may be alive to a single
    call of the function.

    There are four storage classes:-


    +   (a) Auto storage

    (b) Static storage

    (c) Register storage

    (d) Extern storage


    Auto storage class:- The auto storage class specifies that the variable will be
    stored in the RAM location that the initial value will be garbage if not defined.
    Its scope is local and it will be alive in a single call of the function. It is
    declared as


    ```

    auto data type variable;

    int x;

    ```


    Provided by Anjana Chaudhary'
