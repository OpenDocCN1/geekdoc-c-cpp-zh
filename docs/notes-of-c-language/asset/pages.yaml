  md: 'Static storage class:- It is static because the value of static variable remain
    stable during the complete execution of program , once they are created. That
    means the static variable are stored in the prime area not in the stack of functions.
    Therefore they do not allocated and disposed many times. The default initial value
    is zero. Static variables are placed is RAM location and scope is local for the
    static variable. It is declared with the keyword word. static data type var;


    Register storage class:- It is as as the auto storage class except that it requests
    that the variable be stored in CPU register. But it can request only. If the register
    are not vacant. The variable are stored in the RAM location and converted into
    auto.


    Extern storage class:- Variable of this class are also called global because they
    are available to all the function and their life is through of program. All variable
    declared in the global space are included in this group. To keep a variable in
    the extern class we do not need to declare them with extern keyword. There is
    a single situation in which we need to declare them with extern keyword , when
    a variable used within a function i.e define before its declaration then it is
    treated as undefined within function. If we want to take the value from a variable
    i.e defined anywhere in the program then we need to declare it within a function
    with the extern keyword. The storage class is RAM class and default-initial value
    is zero for the extern variable.


    The selections of storage class depend upon the need of the value during the program
    execution. When a variable has to change by most of the functions we use extern
    storage class. If a function is called repeatedly and it is required that the
    value of a variable remain stable than we use static class. To increase the possibility
    of fastness of the program we declared register class otherwise we use Auto class
    variable.


    # Register type -


    +   Memory buffer register

    Memory address register

    Instruction register

    Program counter register

    Accumulator register

    Sequence register

    Input/output register


    # Recursion:-


    Recursion is another tool to use that. Recursion to repeat a process function
    calls itself directly or indirectly. Recursion is very useful to reduce the complexity
    of the source code in some situation such as tree-traversal, searching, and sorting
    algorithm. But it is the fact that recursion needs extra overheads. In both of
    time and space therefore if possible we avoid recursion.


    When performing recursion there is a chance to have bad recursion that means recursion
    could be infinite. So we breaks the recursion. These conditions are called as
    base criteria. In every repeat of the call we must do something that will make
    the base criteria nearer, so that the recursion will be finished.'
