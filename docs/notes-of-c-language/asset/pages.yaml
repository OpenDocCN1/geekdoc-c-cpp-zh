  md: '# Declaration of string :-


    A variable is declared as a single dimensional character array.


    # Format


    Char variable name[size];

    A variable declare in this way can accept numbers of character up to the size.
    It will provide a full length of character, space for NULL is automatically accumulated.

    Initialization or definition of string:

    There are two way to define a string :-

    Character by character method:


    # Format


    ```

    Char variable name[size]={char1,char2........};

    Char name[30]={-, -, -, -};

    ```


    # Shortcut method:


    # Format:


    ```

    char variable name[size]="string";

    ```


    # Getting input for string variable :-


    To accept value for a string variable we can use the %s format of scanf or the
    function gets. The scanf terminates with white space therefore it is unable to
    accept a multiword string. The gets(s) terminate with the enter key only so it
    can accept space also but it is able to take input for a single variable at a
    time.


    # Format:


    ```

    scanf("%s", variable name);

    gets(var);

    ```


    # Outputting string :-


    To print the string on the monitor we can use both the printf %s and puts function.

    The printf function is able to print more than one value but does not change the
    cursor after printing, while the puts function can print only one value at a time
    and place the cursor to the next line after print.


    ```

    printf("%s",variable name);

    Puts(variable);

    ```


    # Library function to manipulate string :-


    Following are some string manipulation functions we need to use frequently. To
    use any of these functions we must include string.h header file.

    strlen() :-


    In many situation we need to know the length of a string variable or constant,
    so that we can handle it from beginning to n or, from n to beginning. We can use
    the strlen( ) and return the number of character present in the string including
    space but excluding Null.


    # Format:


    ```

    l=strlen(string);

    ```'
