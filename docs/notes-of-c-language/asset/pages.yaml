  md: '# Function calling or function invocation:-


    The invocation syntax does not contain any data type. It just consist of their
    function name, followed by the value within parenthesis semicolon passing the
    value is optional. The invocation syntax always be present within the body of
    another function.

    Format:


    function name (value to pass):


    As we know the structured programming data is present at two levels:-

    (a) As global data

    (b) As local datanThe global data is available to all the functions while the
    local data is shared between the caller and the callee passing and returning argument
    or parameter. According to level of data sharing the function can be divided into
    following categories.


    # Function without argument without return:-


    Such kind of functions neither accept a value from the caller nor return a value
    to their caller.

    Example- The library function lcrscr().


    # Function with argument without return:-


    Function of this categories may accept one or more values from their caller but
    don''t return a value to their caller. e.g.-The library function puts() and putchar()


    # Function with argument with return:-


    When sending the control to the callee does not pass any value to the function
    of this category, but they always return a value to their caller.

    e.g.-The library function get(), getch() and getche().


    # Function with argument with return:-


    Most of the functions fall in this category. Such kind of function takes some
    value from their caller process this value and return the processed value to their
    callee. Library function-printf, scanf, isalfa, strlen are all example of their
    category.

    When the invocation syntax is encountered the execution of the callee is suspended
    and the control of flow is to the place of callee along with the value if passed
    and the address of location where to comeback. The instructions given in body
    of the callee are executed and the control is returned back at the address in
    the caller. The execution of the caller is resumed.


    # Actual argument and formal argument:-


    All the function have their separate memory place within the program memory block
    to store their local variable. When a callee passes value to its callee i.e. called
    as the actual argument. To receive the actual argument there are variables declared
    in the function header. These variables are called as formal argument. The actual
    argument is stored in the stack of caller while the formal argument is stored
    in the stock of callee.


    Provided by Anjia Chaudhary'
