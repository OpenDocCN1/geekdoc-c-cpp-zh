  md: '# Structure:-


    In real world programming. We often need to work with records. As we know a record
    is a collection of fields or attributes .Where the attributes describe a single
    quality of an object. The value consisting a record may be of different type.
    To work with record ''C'' allows us to use different types of values. Such a combination
    is called structure. Structure is a template or blue print which represent a particular
    type of record of real world entry. To work with such an entity first we need
    to define the structure by collecting the fields representing the entity.


    # Definition of structure :-


    To define a structure keyword is used i.e. followed by the name of structure.
    After that there the block of structure within which the member are declared.
    The block is ended with semicolon. However we can use typedef statement before
    the struct keyboard than the name be given in between closing braces or semicolon.


    # Format :-


    ```

    Struct name

    { datatype member

    1;

    2;

    };

    tntypef struct

    { data type member

    1;

    2;

    }name;

    ```


    # Declaring structure variable :-


    Defining a structure does not permits us to work with a record. Because there
    is no memory mapping for that. It is just a data type on which variables can be
    declared. After declaring a variable the memory is mapped and then we can store
    the member of the structure. The Structure variable can be declared in the following
    ways.

    If the typedef is not used the variables can be declared at the time of definition
    of the structure by giving list of identifier before the semicolon.


    ```

    Format :struct name

    data type number

    { data type number 1;

    { data type number 2;

    =) var 1 , var 2 ...;

    After the definition of the variable of the structured type can be declared as.

    Format:

    Struct name var 1, var 2, ....

    If the typedef statement is used then we just give the name followed by the identifier
    list

    Format

    Stud , sn ,sm;

    ```


    # Memory mapping for structure variable :-


    The total number byte reserved for the structure variable is equal to the sum
    of the word length of all its member. The word length for the members are occupied
    in the sequence in declared within the block.


    Provided by Anjna Chaudhary'
