  md: 'can be entered into the program memory area. To full - fill such requirement
    programming provides some way to work with file, so that the ''C'' also. As any
    other thing handling in ''C'' also rely on the function those are prototype in
    the header file "stdio.h". In addition the function named FILE is also defined
    in this header file, which describe the qualities of the file such as name, size,
    read, write pointers EOF character c.


    To work with the file first we need to open it and to keep track of its base address,
    so that it can be accessed, therefore the work of file handling is started with
    the declaration of a


    FILE * pointer name;


    Ex- FILE * fp;


    # After then we do our work using the following function :-


    fopen ();- This function is used to open a file, that means to load a file in
    the main memory and then to return its base address FILE pointer. Some time it
    may be unable to load a file then it returns a null pointers. A file can be opened
    in different type of modes, therefore it accepts two string argument specifying
    the name of file and mode type. following are the mode type speculator we can
    pass any one to the fopen ( ):-


    +   (A)\r" - It opens the specified file if existed in read only mode and sets
    the read pointer at the first byte. It does not exist NULL


    +   (B)\r+\ - as like "r" mode also allow to write in the file.


    +   (C)\w" - it opens the specified file in writable mode that means it create
    a new file to save our data. It sets the write pointer at the first byte. If the
    specified already exist then it overwrites.


    +   (D)\w+\ - as like the "w" mode but if the specified file already exists it
    does not overwrite that allow to read from and modify it.


    +   (E)\a+\ - it open the specified file in append mode then the write pointer
    is set at the end of the file it does not exist , it creates a new file.


    +   (F)\a" - as like the "a" mode but also allow to read from the file and to
    modify the file.


    Ex- fp = fopen ("text", "a+");


    +   fclose ();- After completing the work the file should be closed so that the
    occupied memory could be released and used for some other work. The closing of
    file is done by passing the pointer holding the address of file to the fclose().


    +   ftell ();- We can use this function to know that where the read /write pointer
    is currently situated. Knowing this is very useful to do something randomly. It
    returns the position in term of byte :- Ex - n = ftell (fp);


    Provided by Anjna Chaudhary'
