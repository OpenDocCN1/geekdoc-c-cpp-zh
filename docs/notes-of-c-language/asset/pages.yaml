  md: '# > rewind ( ):--


    This function is used to set back the read/write pointer at the first byte form
    its current position.


    # > fseek( ):--


    This is very useful to random access the file for reading/writing. A variety of
    parameters specified to pass the function so that the read/write pointer can be
    placed at a particular byte . It can be used in the following forms:


    +   fseek(ptr, n, 0) - To place the pointer at nth byte from current position.

    fseek(ptr, n, 1) - To place the pointer at nth byte from current position.

    fseek(ptr, n, 2) - To place the pointer at nth byte from the end of file.

    fseek(fp, 01, 0) - to place at the beginning.

    fseek(fp, 01, 2) - to place at the end.

    fseek(fp, 01, 1) - to remain at current position.


    # > Reading to and writing from a file:-


    putc( ):- it can be used to write a character at current position in the specified
    file. The syntax is


    ```

    putc(''char'', file printer)

    putw( )- used to write an value to a file putw(int, fp);

    puts( )- it can be used to write a string to a file -puts "string", fp);

    fprintf( ): it can be used to write different kind of value to the file.

    fprintf(fp, "specifier", var);

    fprint(fp ("%s", var);

    ```


    getc( ): to read a character from a file as - vn = getc(fp);

    getw( ): to read an int from a file as


    ```

    Var = getw(fp);

    ```


    fgets( ): it is homolog to gets but used to read a string from a file. It accepts
    a string file pointer and the length of string to be read.

    gets( string,length,filepointer );


