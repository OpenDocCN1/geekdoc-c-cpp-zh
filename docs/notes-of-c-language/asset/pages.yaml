  md: '# Constant:-


    Constants are the values written literally in a program. This kind of values cannot
    be changed during one or more execution of the program. In other words we can
    say that constants are the value which are not identified. So they cannot located
    and hence cannot be changed.


    There are two basic type of constant.


    Primary constant and Secondary constant.


    Primary constant :-


    A primary constant is an individual value used within a program. There may be
    two types of primary constant numbers and characters.


    Numbers :-


    Any number is made up of digits positive negative symbols decimal point and exponents.
    The numbers can be used as integers and for real number.


    Any integer consists of one or more digits the +ive -ive signs. It must not contain
    decimal point and any other symbol. The integer can be represented in decimal,
    octal or hexadecimal form.


    When the numeric values are increased or decreased integer are not sufficient
    to represent them in situations we need use of fraction. A number consisting of
    digits,+,- signs decimal point and exponential parts are called as real. Real
    numbers may be written in fractional and exponential format.


    Character:- anything enclosed within single quotes is character as- ''a'', ''2''
    ''> '' etc.


    # Secondary constant :-


    A secondary constant always depends on one or more primary constant. It may be
    a list or collection it may be address of some location. Secondary constant are
    found in the form of array_string,structure,union and pointer.


    An array is collection of homogeneous values. A string is a collection of zero
    or more characters enclosed within a pair of double quotes. In the other hand
    and structure is collection of heterogeneous values used to represent complete
    information about an organism.


    # Identifiers :-


    Identifiers are the names given to different components of our program such as
    variables, functions and labels. To form this identifier rules are defined by
    the designers. These are :- An identifier must consists of alphabet, digits and
    underscore.


    No space and special symbols are allowed in an identifier.


    It must not be more than 256 characters.


    # Valid Identifier


    # Invalid Identifier


