    One brochure advertising FLOW-MATIC played up its English-like aspects, calling
    FLOW-MATIC “the most far-reaching development offered for automatic computer programming.”
    Automatic computer programming refers to a compiler that transforms this higher-level
    language into machine code as “the instructions allow the computer to generate
    for itself the various subroutines required to process the problem.” Note that
    in this formulation, UNIVAC is given agency, autonomy even, as though it were
    taking over the difficult task of dealing with itself. The emphasis was on ease
    of programming: “To program a new application, the user describes his systems
    flow chart in the English-language instructions of FLOW-MATIC.” The system “drastically
    reduces time, requiring “just a few days” for training users. Perhaps its most
    radical intervention, however, was not bridging the gap between humans and computers
    but breaking “the communication barrier between programming and management groups”
    because “the programming is intelligible to all who understand the application.”
    That includes not just managers but also the “clerical workers,” to whom the “method
    of pseudocode” can be easily taught (Remington Rand 1957).


    Although the FLOW-MATIC name may be obscure to contemporary programmers, its concepts
    and structures emerge in a much more recognizable language, COBOL. In 1959, a
    group of thought-leaders in the world of computers gathered at the Pentagon for
    a summit to discuss the potential for a common business language (CBL). Sammet
    spells out the goals in creating the language, quoting a report from the conference:


    +   a. Majority of group favored maximum use of simple English language; even
    though some participants suggested there might be advantage from using mathematical
    symbolism.


    +   b. A minority suggested that we steer away from problem-oriented language
    because English language is not a panacea as it cannot be manipulated as algebraic
    expressions.


    +   c. The need is for a programming language that is easier to use, even if somewhat
    less powerful.


    +   d. We need to broaden the base of those who can state programs to computers.


    +   e. The CBL should not be biased by present compiler problems. (Marcotti, Sammet,
    and Holberton 1981, 201).


