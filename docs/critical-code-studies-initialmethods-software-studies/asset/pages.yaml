    Code is never simply code. It is made up of many aspects that are worthy of and
    necessary for exploration. These include but are not limited to the programming
    paradigm of the architecture, its overall structure, and the programming language
    or languages. Code can have methods, variables, objects, data, and subroutines.
    Code has comments that, Douglass example, are a meaningful component. At an abstract
