  md: 'through my work in the Humanities and the Critical Code Studies Lab, I have
    labored in the service of higher education to foster critical thought and to facilitate
    interdisciplinary exploration, though institutions tend to inhibit the latter.
    The four actions are as follows:


    +   1. Contributing to humanities curricula


    +   2. Informing computer science curricula


    +   3. Supporting research in the digital humanities


    +   4. Inspiring new work in code


    # 1. Contributing to Humanities Curriculum


    Critical code studies was born of the humanities. Many of the original scholars
    working in this field were working on or earned their masters and doctorates in
    literature departments, clicking their teeth on code but on Shakespeare and Morrison,
    along philosophers with Cixous and Derrida. The practice of critically reading
    code arose in part from the close-reading practices on which most students are
    taught, starting in secondary school but beginning even earlier. More of these
    students should be encouraged to explore code.


    Following the liberal arts tradition, most university-level core include a science
    requirement to complement the humanities, arts, and social sciences, with an eye
    toward enriching each student''s experience. For example, students might take
    a course in programming or auditioning for nonmajors. There are many new books
    directed at such an audience, including Martin Erwig''s Code Upon an Algorithm:
    How Stories Explain Computing (2017) and Nick Montfort''s Exploratory Programming
    for Arts and Humanities (2016), to name just two. In addition to these programming
    courses, which are quite valuable for their differentiated instruction, colleges
    and universities could offer courses that tackle the disciplines, along with software
    and platform studies, would offer an opportunity for universities to give students
    science with a humanistic eye. In other words, rather than thinking of these disciplines
    in their silos, why not of the way they infect, inform, and inspire one?


    In many ways, critical code studies speaks to the so-called crisis of the humanities,
    if one even exists, by not offering majors coding skills but instead of flipping
    the script and acknowledging that our ways of knowing, or heuristics, taught in
    literature, history, art, and cultural studies courses, to name a few, teach a
    kind of critical analysis of objects that can enrich scientific inquiry—not by
    making technology that is better,'
