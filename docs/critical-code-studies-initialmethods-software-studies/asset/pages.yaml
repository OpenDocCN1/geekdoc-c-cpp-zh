    # The Drive for Natural Languages


    Although learning the tokens may only be a small part of learning to program in
    a natural language, especially one familiar to the programmer, is as old as programming
    itself, especially once compilers made possible the move from machine and assembly
    language into higher languages. If programmers could choose the symbolic registry
    for communicating with the machine, why not choose a language in which they were
    already fluent? COBOL presents merely one of the attempts to reach that goal.
    Others include BASIC and Inform 7.


    However, the initial move toward higher-level languages had its resists. Famously,
    John von Neumann, creator of the eponymous computer architecture today, called
    these programming languages a waste of time and resources. When he heard about
    the development of FORTRAN, von Neumann was reported to say, “Would you want more
    than machine language?” (quoted in Toal et al. 2017). When a student of von Neumann’s
    developed an assembler so he wouldn’t have to “hand-assemble programs into binary,”
    von Neumann allegedly remarked, “It is a waste of a valuable scientific computing
    instrument to do this clear work” (paraphrased in Lee 2009). Considering the number
    of workers who did the mathematics that would become programming (Hicks 2017),
    this remark shows how a social hierarchy exists by analogy into the world of programming.
    When stating that computation time should not be wasted on this clear work, was
    was essentially “leave it to the computers,” a group of workers largely made up
    of women.


    A hierarchy is already present in the concept of higher- and lower-level programming
    languages, drawn from an imaginary tower of babel that puts machines on the bottom-most
    level and the humans at the top. However, the status of those using the languages
    tends to fluctuate. At the original computers, the women who programmed the machines,
    had lower status than the men who gave orders.¹ At the time of Hopper, programmers
    had high status, those who had to encode instructions into the machine had low
    status (a division that still persists in the industry). However, once programming
    and coding became more deeply intertwined with higher-level languages, then programming
    became a higher status and more lucrative job, which historically coincides with
    the gender divide favoring men emerges.¹⁰ And while managers, to whom FLOW-MATIC
    was marketed, might earn more money, the status of esteem has become a currency
