  md: '# Kittler''s Code


    wrote his raytracer in C, which he preferred because it allowed him to work also
    with assembly language, or assembler, as he called it. Kittler''s preference demonstrates
    how attitudes toward programming can be expressed productively without the encoded
    chauvinism discussed in chapters 4 and 5. The majority of the raytracer''s code
    include some very necessary operations in assembler, specifically GNU assembler,
    which, continued his preference for open-source software. That assembler works
    with the 8086 Intel architecture with an 8087 floating-point microcontroller,
    which Kittler accessed through his Pentium IV machine.


    According to Feigfeld, Kittler wrote his assembler code early on, and it became
    a skeleton on which to form his later programs. He was obsessed, by Feigfeld puts
    it, with optimizing the processes of his assembler, writing the code in such way
    as to make maximum use of the CPU. By the time Kittler was polishing his raytracer,
    he was no longer working in assembler (pers. interview, January 21, 2019). Nonetheless,
    as assembler brought the media archaeologist to closest the hardware of the machine,
    reading his assembler can reveal the depths of his understanding of the machine.


    Kittler liked writing in assembly because it engaged the machine directly, with
    speed, even when he found it difficult to reread his code later on. The raytracer
    code “written by a peculiar understanding of code,” according to Feigfeld. Kittler''s
    disciple Wolfgang Ernst has, “Kittler in a ‘polemic style’ of Assembly—You have
    to know what I’m saying already” (pers. interview, September-18, 2013). Kittler
    could not explain all of his code or “retain his steps”: “it was unreconstructible”(Feigfeld,
    pers. interview, January 21, 2019). For Kittler, his assembly writing was so to
    subconscious … A kind of ‘automatic programming.’


    He described the: “Kittler always spoke about coding in assembler as a deep psychological
    and analytical process. He would enter a kind of trance. Afterward, he couldn''t
    really tell him how to write it that way. He would mostly work on it at “night”
    (ibid.).¹¹³


    Feigfeld also warns against attributing particular lines of code to Kittler because
    his method was more of a bricolage, noting Kittler would frequently draw code
