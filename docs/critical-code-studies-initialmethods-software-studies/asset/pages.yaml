  md: '# Introduction


    had approached code in a broader sense, bringing ideas from the legal world. Code
    had also been taken up by a handful of other scholars, specifically Adrian Mackenzie
    (2005, 2006), Florian Kramer (2005), Loss Pequeño Glazier (2006), Alan Liu (2004),
    and Alexander Galloway (2004). Their gestures were powerful movements into the
    realm of code, but they did not include examples of actually interpreting the
    code. if so, as critics were suggesting, a unique semiotic realm, what could one
    say about any passage of code?


    I had been trained in literary theory and cultural studies, as well as what we
    were calling new media, so I taught those. Semiotics offered tools for analyzing
    any system, and deconstruction complemented that study by poking around in the
    cracks and fissures. Cultural studies offered a way to take the text off its pedestal,
    while helping to change the object of study “text” as a set of characters to “text”
    as any cultural artifact. The critical theories aimed at underlying structures
    of oppression and possibility, from feminism to Marxism, queer theories to postcolonialism
    and theories of racial formation, also provided frameworks for critiques.


    Around the same time, Noah Wardrip-Fruin, Matthew Fuller, and Lev Manovich were
    beginning to theorize software studies, while Nick Montfort and Ian Bogost were
    launching platform studies. All these studies were in their emphasis on analyzing
    the particularities of different categories of technology. However, platform studies
    focused primarily on hardware, at least in the Atari 2600 in Racing the Beam (Montfort
    and Bogost 2009), and in Expressive Processing, the first book in the Software
    Studies series, Wardrip-Fruin (2009) essentially bracketed the code. Focusing
    on code could supplement these, simultaneous with the birth of these two branches
    of new media, I proposed code studies in an essay (updated in chapter 2), which
    presented at the Modern Language Association meeting and was published in Electronic
    Book Review (ever).


    The goal of this essay is to establish scholarship on methods of interpreting
    code. I argued (and continue to argue) rather than bracketing the code, we should
    read beginning with the tools of semiotic and cultural analysis and continuing
    with developing methods particularly suited to code. We had to get the understanding
    of code as meaningless math (also, as it turns out, a false conception) and instead
    approach it as a culturally situated system full of denotations and connotations,
    rendered meaningful by both human and diverse readers, both human and machinic.
    Daunting though it seemed, the time came to take code out of the black box and
    explore the way its complex and unique sign systems making meaning as it circulates
    through various contexts. I was discovering in the process richness that computer'
