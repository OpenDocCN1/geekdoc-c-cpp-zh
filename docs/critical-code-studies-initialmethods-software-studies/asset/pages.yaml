  md: '# 114


    # Chapter 4


    This code was developed by Tim Mitchell and updated by Ian “Harry” Harris, both
    of the CRU, whose job it was to bring disparate databases into alignment. Harris
    documents his four-year-long saga in the Harry_Read_Me.txt file, and many of his
    exasperated comments became fodder for the tempest (in a teapot or no) about the
    code. Through this expression of his struggles, far beyond the frustrations Jason
    Nararro memoirs in the Transborder Toll (see chapter 3), Harry even earned the
    sympathy of some of his detractors, one of whom refers to him as “the poor sod
    who has been landed with the responsibility of reworking the code (after I think)
    the departure of Tim Mitchell and Mark New who apparently wrote much of it.” At
    the time of the 1998 code, Braffa, Harris, and others published a paper titled
    “Trees of Past Climate: But Are They Speaking Clearly Today?” (Briffa, Schweingberger,
    Jones, Osborn, et al. 1998), which presents graphs similar to the ones produced
    by this code in which they discuss the connection between the tree data and directly
    measured temperature data. They propose to adjust the tree data’s lack of reliability
    post-1960. The code offers an attempt to adjust temperatures that includes this
    adjustment, labeling it as a correction.


    However, in the moment of bombastic blog posts reporting so-called scandal, the
    all-calls comment “VERY ARTIFICIAL CORRECTION,” a kind note-to-self, the bold-faced
    evidence of a large-scale hoax, produced by code that appeared to falsify data
    to create the illusion of a climate crisis literally of global proportions. With
    allusions the false weapons that were used to justify the invasion that began
    the Iraq War, one blog commentator, jorkgeafakazar, writes, “CRU caught with weapons
    of mass destruction” (jorkgeafakazar, comment on Greiner 2009b). Of course, the
    fact that this deception was allegedly placed in hidden (read secret, secretive)
    source made it the only jury for the internet-based forums to produce an outlier.
    Here was the black magically opened—the computational charlatans exposed with
    code, that secret and powerful mechanism of manipulation exposed for what it is,
    an elaborate shell game. Here were code studies as performed by those who distrusted
    the codes, a group of readers playing what Peter Elbow (1973,145) calls the “doub
    game,” a hunt for underestimating assignments, driven by skepticism.


    There was only one problem, one obstacle to the frenied reading: the code was
    hard a smoking gun. Rather, the “fudged” code represented in progress, a placeholder
    while the programmer was awaiting a finalized data set or settling on a more standard
