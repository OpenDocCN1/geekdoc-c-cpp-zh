    FLOW-MATIC may look like English, but the code is not exactly fluid prose. In
    Sammet’s estimation, “The language is stilted and the English is not very natural”
    (Sammet 1969, 322). FLOW-MATIC uses English-like tokens and a syntax that resembles
    English sentences in an imperative structure. In imperative structure, the code
    takes the form of instructions issued to the computer, as it would in other imperative
    languages, from BASIC, another heir of FLOW-MATIC, to C to Python. By memory limitations,
    the language uses all caps (which again will show up in BASIC and other languages)
    and cards and key punches did not support lowercase. Nonetheless, these phrases
    read like sentences that in periods or can be joined by semicolons. For example:


