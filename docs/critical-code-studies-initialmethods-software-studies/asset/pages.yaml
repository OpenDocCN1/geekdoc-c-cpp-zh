    # The Descendants


    Although Taroko Gorge would become a subject of many adaptations, the artists
    who would remake the project mostly changed the data, rather than the rules of
    the code. On the one hand, such adaptations would seem to follow the rules of
    the sonnet or haiku, in which those who take up the form supply new words to fit
    the model into its constraints and for the most part do not change the constraints.
    To write a sonnet is to change the rules of a sonnet.


    However, because Montfort is a poet of code, one who offers his code itself as
    the poetry (Marino 2010b), and because we are viewing this work in the context
    of ELIZA''s grand challenge, the adaptations seem on the surface to miss the mark
    by engaging with the data and not the rules. Such a reading misses the creative
    invention of those who followed. They were not forking and adapting the code.
    Instead their reimagines the poem, coopts its form, through a process akin to
    remix.


