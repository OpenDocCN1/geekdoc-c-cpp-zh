  md: '# Introduction


    implications, opening to interpretation and inference, as well as misinterpretation
    and reappropriation. The Climategate is forever tied to those online debates,
    and that gives it significance far beyond the designs of its creators. Code is
    a social text, the meaning of which develops and transforms as additional readers
    encounter it over time and as contexts change. That is the argument and provocation
    of this book.


    It is time to develop methods of tracing the meaning of code. Computer source
    code has become part of our political, legal, aesthetic, and popular discourse.
    Code is being read by lawyers, corporate managers, artists, pundits, reporters,
    and even literary scholars. Code is being used in political debate, in artistic
    exhibitions, in popular entertainment, and in historical accounts. As code reaches
    more and more readers and as programming languages and methods continue to evolve,
    we need to develop methods to account for the way code accrues meaning and how
    readers and shifting contexts shape that meaning. We need to learn to understand
    not only the functioning of code but the way code signifies. We need to learn
    to read code critically.


    But reading code requires a new set of methods that attend to its specific contexts,
    requirements, and relationships. As the next examples demonstrate, communication
    via code is highly straightforward.


    # A Job Interview


    Let us consider a question: What does code mean? First, it would be useful if
    I defined what I mean by code. For now, I will say, computer source code. Then
    I should probably say what I mean by mean. But such an approach is full of folly.
    So let me restate the question with another, expressed in relatively unambiguous
    words.


    The new phrasing of the problem could take the form of a job interview. For the
    sake of this argument, let''s imagine two programmers, a man and a woman, who
    are applying for the same job. Before they are interviewed in person, they are
    sequestered in a room and asked to solve a popular challenge, to write a program
    that computes an anagram of a string. An anagram contains all the characters of
    the initial string or in a different order (e.g., critical code becomes circa
    dice lot), although the code for this challenge does not have to produce recognizable
    words, just rearranged characters. At the end of their challenge, the programmers
    will submit their code electronically as the employers will not know who wrote
    which version.


    One of the candidates submits the following JavaScript code:'
