    come from the more philosophical texts on computer science instead of the more
    practical ones. Now is to argue that critical code studies intends to colonize
    computer science with Continental philosophy but to accept that the exploration
    of code is never a neutral activity, free from an epistemology or a world view,
    and instead to draw upon the interpretive force of these critical theories, to
