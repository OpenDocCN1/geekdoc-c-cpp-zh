  md: by identifying, existing social and communication conventions rather than treating
    culture and signification as neural arenas. These lenses include interpretive
    frameworks such as structuralism and formalism, and deconstruction; identity-related
    approaches such as feminism and critical race studies; globally oriented approaches
    such as postcolonialism; and many more. Although I list them individually, a scholar
    rarely just one and a strong case has been made for thinking more intersectionally
    to begin with, especially when focusing on social categories. This is not to say
