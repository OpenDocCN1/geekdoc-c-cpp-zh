    even in terms of input and output. The reviewer suggested Quicksort, an algorithm
    used for quickly ordering groups of numbers through a divide and conquer approach.
    In my early attempts I suggested Quicksort as a metaphor for social organization
    in communities, drawing out an analogy for the way the neighborhood street or
    even highway may divide and conquer a demographic, for example through redlining.
    However, my analysis said something about neighborhood hierarchies, it offered
    little insight on Quicksort itself, nor did it draw from Quicksort a lesson from
    the society with which it came. My main error was analyzing Quicksort aside its
    historical, material, and social context. For an algorithm such as Quicksort,
    the code meets the social realm at the site of its implementation and in the context
    of the application in which it is used. I was not engaging the cultural origins
    of Quicksort in a language (I was using pseudocode). Without discussing the human
    context of Quicksort in terms of authorship, use, development, circulation, or
    operations, I was left with little more than an abstract process.


