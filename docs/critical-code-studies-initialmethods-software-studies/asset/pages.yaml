    # Determine the Functioning of the Code


    Obviously, a primary step is to develop an understanding of the functioning of
    the code. However, I would not go so far as to call this the first step. Following
    the specific ins and outs of any code takes careful, patient, and methodical work
    and a serious investment in understanding the programming language, the programming
    paradigms, and sometimes, the hardware on which the code was implemented. For
    this reason, I have found that a basic understanding of the code—is enough to
    embark on the subsequent fact-finding before returning to the detailed step-by-step
    reading. I suspect someone more versed in programming or the programming language
    of the code more versed in programming or the programming language of the code
    might be able to dive right in, but most people I have spoken with, experienced
    programmers, find the prospect of reading someone else''s code to be unpleasant,
    if not daunting. Inevitably, though, the critic must determine the function of
    the code before they can begin to understand its extrafunctional significance.


    # Research the Context of Its Creation


    Behind any code is the story of its creation, the concept behind its inception,
    the context of its development, and the constraints faced by its creators. Like
    any origin story, the context can offer insight into design choices, explain method
    and variable names, and give the reason for shortcomings in the code. Following
    the habits of good science and technology studies and media archaeology, reading
    code requires uncovering these stories and understanding how they shaped the code.


    # Research the Creators


    Part of looking the context is understanding the programmer or programmers who
    worked on the code. Creator here may be too strong a word, as much of programming
    involves building out of new and preexisting code, including libraries or circulated
    code snippets or even whole programs that are being adapted. Nonetheless, one
    or'
