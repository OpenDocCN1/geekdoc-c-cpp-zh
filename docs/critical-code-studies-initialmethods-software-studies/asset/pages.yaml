  md: '# Critical Code Studies, a Manifesto


    As it turns out, programmers learning to program in LISP tend to begin with code
    to produce the Fibonacci sequence after Hello, World.¹ Printing and displaying
    “Hello, World” does not always Westially provide an introduction to the affordances
    of a language. Consider Ralph Westfall’s (2001) alternative “Hello, World” model
    that stresses the typing and object-oriented features of Java, an approach in
    turn draws other alternatives. In fact, the debate over the use of “Hello, World”
    as an introductory exercise offers a glimpse into the ways and the why and of
    even simple programs can become the object of discovery and analysis in the social
    life of source code.²


    As a new media scholar trained in literary theory, I would like to propose that
    we no longer speak of the code as a text in metaphorical terms, but that we begin
    to analyze and explicate code as text, a sign with its own rhetoric, as semiotic
    communication that possesses significance in excess of its functional utility.
    Computer scientists can theorize on the most useful approaches to code, how humanities
    can help by conjuring the meaning of code to all who encounter it—both by directly
    reading and indirectly by encountering the effects of the programs it creates.
    In fact, I am proposing that we can read and explicate the code we might explicate
    a work of literature or other texts in a new field of inquiry that I call critical
    code studies (CCS).


    Critical code studies is an approach to code studies that applies critical hermeneutics
    to the interpretation of computer code, program architecture, and documentation
    within a sociohistorical context. CCS holds that the lines of code are value-neutral
    and can be analyzed using the theoretical approaches applied to other semiotic
    systems, in addition to interpretive methods developed specifically for the discussions
    of code. Critical code studies follows the work of other critical studies, such
    as critical legal studies (Fitzpatrick and Hunt 1987; Tushnet 1991) and critical
    race studies (Delgado and Stefanc 2001; West 1995), in that it applies critical
    theory to a functional document (legal document or computer program) to explicate
    meaning in excess of its functionality and claims that this meaning analysis is
    more than an aesthetic of efficiency. Growing out of the functioning of the code
    is not limited to the literal processes enact. Through CCS, practitioners may
    critique the larger human and computer systems, from the level of the computer
    to the level of the society in which these code objects circulate and exert influence.


