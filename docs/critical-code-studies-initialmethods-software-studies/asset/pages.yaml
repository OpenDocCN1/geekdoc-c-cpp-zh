  md: '# Origins of a Tool


    One way of reading code involves simulating its operations in one mind, tracing
    the effects of changing conditions on the state of the software as it executes.
    This means that reading code can involve a simulated execution of the software.
    As a result, code can present to its reader imaginary scenarios, which carry rhetorical
    and discursive meaning because they represent real-world scenarios and modeled
    worldviews. In this chapter, I offer a reading of some code of the Transborder
    Immigrant Tool, a activist art project, the code of which restitutes the contemporary
    geopolitical debate in potential scenarios of life-or-death survival. For readers
    of the code, as opposed to those who are engaging in these imaginary scenes, the
    code conveys its perspective the way a ritual does, offering passages of narrative
    movement to convoy understanding.


    The Transborder Immigrant Tool, or TBT, presents itself as a last-chance rescue
    operation to sustain imperiled travelers, border crosses, leading them to water
    and sustaining them with poetry. Transborder could (and does) refer to any border:
    political or otherwise. The yet use of border and immigrant in a project emating
    from San Diego, just north of the US-Mexico border, unmistakably engages with
    incendiary border politics that demand the undocumented as “illegals” and “aliens,”
    as an in of dangerous, job-stealing invaders, a threat to the nation-state. This
    artwork narrates that by marshaling empathy for the border crosses who has already
    passed into the United States but who is about to die of thirst. Their tactic:
    drawing the audience to aesthesize the undocumented as avatars for first-world
    observers; instead, by reframing the journey in life-or-death terms, it helps
    define the rhetorical construction of transgressing “illegals” by recasting the
    travelers as immigrants with the human of needs: water for their bodies and poetry
    for their souls.


    The Transborder Immigrant Tool is a mobile application under development by the
    Electronic Disturbance Theater (figure 3.2), in residence at UC San Diego by the
    b.a.n.g. (bits, atoms, neurons, genes) lab. When deployed, the app will help a
    traveler crossing to the desert of the US-Mexico border, presumably on foot, to
    find water by means of a simple navigation device and aural and haptic cues. Once
    the device finds a water cache nearby, the tool begins its finding process, leading
    the traveler, likely dehydrated and dis, to the nearby cache. These caches have
    been placed in the desert by volunteer organizations—specifically Water Stations,
    Inc., a humanitarian organization that works to fill brightly painted barrels
    labeled *agua* with gallon jugs of water (Marino 2011a).'
