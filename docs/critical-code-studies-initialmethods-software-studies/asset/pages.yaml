    Before publishing his work on computer graphics, Kittler had written extensively
    on optical media in a book by title (2010). However, prior to that book (published
    in German in 2002), based on lectures he gave in 1999, he had “implemented all
    the knowledge about optical media, the physics of light and optics in code” (Feigelled,
    pers. comm, March 27, 2019). That book traces the development of visual reading
    media from the camera obscura to film and television to computers. His addresses
    computational production specifically in his essay “Computer Graphics: A Semi-Technical
    Introduction” (2001), which expresses the theorization that emerged out of coding.
    In that essay, he writes, “From the camera obscura to the television camera, all
    media have simply taken the ancient law of reflection and the modern law of refraction
    and poured them into hardware” (34–35). By contrast, computer graphics reproduce
    these processes mathematically. As he explains, “Computer graphics are to these
    optical media what the optical media are to the eye. Just as the camera lens,
    literally as hardware, simulates the eye, which is literally wetware, so does
    software, as computer graphics, simulates hardware” (35). Through such a claim,
    Kittler demonstrates the ways in which his software and code studies are so enacting
    of hardware studies and by extension media archaeology, he does not use those
    terms. He is recreating hardware in software. In creating the program, he explores
    the software that “transposes such optical laws into algebraically logic” (35).
    However, because code is a specific historically bounded implementation of an
    algorithm, full of choice, what Saussirian linguistics calls paradigms and sequences,
    or syntax, code is not “pure code” but an expression of his attempt to manifest
    it. Similarly, he writes, “Computer graphics, because it is software, consists
    of algorithms and only of algorithms” (36). However, as evident from the extensive
    code comment that begins this chapter, the source code of these algorithms contain
    more than only algorithms, including development notes, bug reports, and hints.
    More importantly, the entire implementation of this code was inevitable but shows
