    Underlying this reading of FLOW-MATIC, therefore, is a consideration of the inclusion
    and exclusion. Hopper, an innovator in programming languages, worked to make a
    computer language that was accessible to corporate managers, a language that seemed
    to be speaking their language. Corbett, Nasser, and the developers of ‘ǒlo Hawaii’s
    research on interventions to programming developers from more cultural and linguistic
    backgrounds. The legacy of Hopper, as a woman working in the field of computer
    science, has been obscured and to some extent recovered, at the start of a large
    wave of recovery, historians document a process of exclusion and direct indirect
    discouragement of women studying and working in the field of computer programming—If
    Hopper opening programming to people of nonprogramming backgrounds, this chapter
    asks. What does it mean to make programming truly inclusive, and how can that
    progress grow over more accessible languages? Also, what is the role of encoded
    chauvinism in excluding and creating a hostile work or learning environment? However,
    because programming is evolving with hardware innovations, what is accessible
    today can be unwieldy tomorrow. What is accessible to one group can be foreign
    to another. Similarly, tales of innovations can obscure or obfuscate erasures.
    Computer history is never simple science because such a notion is a fantasy. By
    reflecting on historically situated code objects, asking about not just audience
    and authorship but also accessibility and access, we trace the edges of more complex
    sociotechnical histories.


    But there is also a trap in drawing too strong a parallel between human and computer
    language, the trap of trying to fit human languages into the systematic model
    of programming languages. David Golumbia weighs on this in The Cultural Logic
    of Computation,


    Computes invite us to view languages on their terms: the terms by which computers
    use systems that we have recently decided to call languages—that is, programming
    languages. When these closed systems, subject to univocal, correct, ‘activating’
    interpretations, look little like human language practices, which seems not to
    just allow to thrive on ambiguity, context, and possibly. Inevitably, a strong
    intuition of computationalists is that human language itself must be code-like
    and polysemy, in some critical sense, imperfections. Note that it is rarely if
    linguists propose this view; there is just too much in the everyday world of language
    to let this view stand under even mild critique. But language has many code-like
    aspects, and to a greater and lesser extent research programs have focused on
    these. (2009, 84)'
