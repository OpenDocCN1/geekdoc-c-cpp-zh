  md: '# Introduction


    21


    Subsequently, several books have expanded the cultural contexts for examination
    of code. David M. Berry''s The Philosophy of Software (2011) takes up a formal
    consideration of the ontology and epistemology of code, as does Adrian Mackenzie''s
    Cutting Code (2006). Bradley Dilger and Felix Rice have collected that code center
    on HTML tokens to A <a> (2010). As I''ve mentioned, Speaking Code (2012) by Geoff
    Cox and Alex MClean offers an exploration of the way code acts as speech in the
    form of a duet, with text by Cox intertwined with code passages by McLean. D.
    Fox Harrell''s Phantommedia (2013) offers programming as a potentially culturally
    situated practice. James Brown Jr applies rhetorical theory to code in Ethical
    Programs: Hospital and the Rhetoric of Software (2015). In Coding Literacy: How
    Computer Programming Is Changing Writing (2017), Annette Vee analyzes code from
    a legal perspective and examines the framework of literacy brigades to larger
    conversations about teaching code in cultures. The most recent work, Kevin Brock''s
    Theoretical Studies (2019), offers a specific application of code studies that
    reads code as means of rhetorical discourse.


    A lot of the work has been spent trying to understand what is possible for code
    and what even code itself. Several scholars have found it useful to speak code
    as performative language, drawing upon the speech acts of J. L. Austin. Hayes,
    Cox and McLean (2013), and numerous others have found this framing to be productive
    because code seems to do what it says. However, others as Daniel Punday (2015),
    have code programming as writing. Still others, as Roger Whitson (in the 2012
    CCSWG), have suggested that actor-network theory might be well applied. In this
    formula, code becomes an entity (actor) as it networks other bodies of code, machines,
    and humans. Certainly, such a theorization speaks better to Kirschenbaum''s sense
    of the critical importance of context to interpreting code (see chapter 2). If
    the study of natural language and semantics is any indication, these initial theoretical
    frameworks are merely the beginning.


    There are quite few texts that take the ontology of code. Chun''s Visions (2011)
    and Hay''s My Mother Was a Computer (2005) offer important interventions that
    situate computation and our fascination with it. Gabriela Coleman''s Coding Freedom
    (2012) takes up the ethos of the culture of open-source programming. Jussi Parikka''s
    Digital Contagons (2007), although containing very little code, offers a robust
    media archaeology of viruses and worms. Because of their philosophical interventions
    into the study of technulture, these works provide a foundation for readings of
    code.


    Critical code has also had an effect on the production of code-based art projects.
    Artists, such as Nick Montfort and Stephanie Strickland (2013), have begun'
