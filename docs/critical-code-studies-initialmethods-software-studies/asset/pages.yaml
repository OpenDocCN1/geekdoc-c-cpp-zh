    \ meat, climate change called the comments proof that the data used to demonstrate\
    \ global warming was bunk, a conspiracy in the code. This source file purportedly\
    \ provided a glimpse behind the curtain of a mass deception, and the staging ground\
    \ for charade was the computer code itself.\n\nThe public criticism did not stop\
    \ at the code's contents, either; conspiracy hunters also dove into the workings\
