  md: 'scientists already knew, a sense of significance that grows out of yet goes
    beyond the function of the code—only I had the additional benefit of heuristic
    tools developed in the humanities for interpretation and exegesis.


    However, not everyone was so excited about this proposal. For example, some of
    the computer scientists who heard about the idea and read some of the early code
    studies writings (particularly my piece linking heteronormativity and malicious
    software worms) responded with derision and alarm (as in Marino 2016 and McPherson
    2018). From their doubters, CCS marked another invasion of the humanists into
    what is known as “science wars,” a fierce contest between physicists and the humanists
    they felt were making much ado about insufficiently understood advances in science,
    specifically quantum physics. What would happen, they asked, when these literary
    scholars haphazardly applied their high theory to something far outside their
    realm of expertise? The challenges of imperialism and imperiousness were near
    clear.


    Not wanting to alienate the community of experts whose works and whose realm I
    sought to explore, spent the next few years in conversation with computer scientists.
    We convened online forums, biannual Critical Code Studies Groups (CCSWGs), which
    included scholars of all levels and various backgrounds, especially computer scientists.⁷
    Out of these conversations came models for the interpretive practices demonstrated
    in this book, along with the basis of mutual respect born out of careful expressions
    and translations of our positions. As I say in the original essay, even the words
    interpret and meaning do not signify the same ideas in computer science as in
    the humanities. The group also included several scholars whose training bridged
    the gap between the humanities and computer science, further helping to cross
    the divide.


    Born of those working groups were articles, conference presentations, and books,
    including the first CCS manuscript, the ten-authored 10 PRINT CHR($205.5+RDI(1));:10
    (Montfort in 2013; also 10 PRINT), which analyzed the code of this. Wendy Chun
    (Marino 2010) presented what would be the first chapter of Program Visions (2011).
