  md: '# The Transborder Immigrant Tool


    # Code Becoming Poetry


    To read the poetry of TBT is to imagine a traveler in an hour of need receiving
    just-in-time guidance and sustenance. To read through the code of the Transborder
    Immigrant Tool is to stage a ritual in which mythical travelers cross the desert
    through the software. On the surface of the comparison, these traversals seem
    insonant: one involves physical movement and the other act of the imagination
    of execution. I would argue that the act of reading code requires models of materially
    tied processes—even, black-boxed models, the effects of the executed translation
    of code on software and hardware—it is not necessary for someone to be physically
    moving to enchanting this journey.


    The code of the Transborder Immigrant Tool is to function in a particular set
    of uses of a traveler lost in the desert in desperate straits. To read the code
    is to implement it, to imagine the realization of code, the software produced
    by it, consequently the desert and the desert traveler, as well as the water to
    which software loads. To read the code is to enact the ritual of code, which carries
    with communal knowledge and a communal history. Such an enactment is not meant
    to trivialize or aesthesize the lives of those who could benefit from using the
    tool but instead meditate on their political representations rather on their (potential)
    lived conditions by tracing through a procedure designed to rescue them.


    Code is routinely conceptualized as *abstract procedure*. However, I am setting
    that conventional term aside for a more culturally situated formulation. *Procedure*
    calls to mind a series of steps aimed at a goal; *ritual* is a performance at
    cultural connectivity, instilling community, of signifying allegiance, remembering.
    The code, like the text of the oral performance, is more of a transcript of a
    performance to be realized in the mind, either by the mind of the reader or by
    the processes of the computer. It bears signs of its performance, as well as its
    history. Which is not to say that code does not have an end in mind. The Transborder
    Immigrant Tool do produce the app and govern the interactive experience of the
    app. I am focusing on the human reading of the code. Thus, I would argue that
    to engage with the Transborder immigrant Tool through the code is to engage in
    a ritualistic imaginary performance of the software, a specious deployment, an
    engagement that has many parallels with folk practice of ritual, song, and tale.


    The act of reading code then involves a willful attempt to process like the computer,
    to emulate the system that will be operated by the performative, automatic triggers
    of the code. The notion of literacy, therefore, in the sense of reading literacy,
    is'
