    “a handbook of supplements to some of the key standard objects of computer science,
    programming and software culture” (2), critical code studies names a set of approaches,
    or an interpretive attitude to code. Indeed, Fuller’s sense of software relates
    well to perspectives of CCS as he argues that “software can be seen as an object
    of study and an area of practice for kinds of thinking and areas of work that
    have not historically ‘owned’ software, or indeed often had much of use to say
    about it” (2). *Software Studies* opens the door for a formalized practice of
    (and quite a few tools for engaging in) critical code studies.


    The mention of literature can be misleading: I do not want to limit critical code
