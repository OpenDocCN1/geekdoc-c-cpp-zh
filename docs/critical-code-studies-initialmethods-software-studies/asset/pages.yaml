    # Chapter 3


    insufficient for the act of reading code. As in processing textual symbols, reading
    code does require an understanding of the connotations of the instructions. However,
    connotation and electrical effects are not the same. Andrea diSessa (2001), in
    her book Changing Minds: Computers, Learning, and Literacy, offers the notion
    of material intelligence to subscribe for literacy, meaning “intelligence achieved
    cooperatively with external materials” (5). Because of the specifications of hardware
    and software, including operating systems, it is not enough to say that reading
    code requires the same kind of knowledge of the interdependent correlations and
    theorems as in the case of mathematics—though, as diSessa notes, both require
    similar skills. Annette Vee offers the term procedure for “the literacy associated
    with computer programming,” which she defines as “the ability to break down complex
    processes into smaller procedures and express them explicitly to be read by a
    computer” (Hunter 2009). Reading code requires establishing an adequate representation
    of the state of software (and at hardware) at any given time in the program. As
    I have mentioned elsewhere, this often can function as a threshold paradigm that
    conflicts with the act of interpretation, which looks to connotation rather than
    this highly material form of denotation. Nonetheless, establishing the precise
    effects of code must precede interpretation.


    The Transborder Immigrant Tool was written by undergraduate Jason Narro and UC
    San Diego instructor Bret Stallbaum in Java—specifically, Java 2 Micro Edition
    (J2ME) for the iDEN platform on the Motorola iA455, a comparatively inexpensive
    mobile phone. Java, originally developed by Sun Microsystems, has been an opensource
    programming language since 2007, undergoing development from a worldwide community
    of programmers. Like Java, the tool is offered with a GNU Free Public License,
    which makes it available for others to continue or modify. Java often is considered
    a verbose language for enterprise or corporate production of software (Flangan
    1999). From a more favorable perspective, the Java language syntax requires redundancy,
    which can increase legibility and facilitate production of software by programming
    teams. The use of language in this code, which is carefully documented, places
    the software in the company of other team-built projects, rather than more lightweight
    projects. In other words, this piece that is also wayfinding and sustenance, the
