    # The Raytracer of Heaven and Hell


    A raytracer recursively follows the path of a vector or ray from the eye of the
    imagined viewer, camera, through the screen (or image plane) to the image in order
    to determine the color of any pixel on the screen. It also traces the paths of
    rays emanating from light sources in the visual space back to the eye. Depending
    on the sophistication of the raytracer, the system may calculate for reflection,
    refraction, and diffusion. Kittler''s code uses a number of these effects. For
    some context, raytracing, albeit a very sophisticated and computationally expensive
    version of raytracing, is at the heart of the software Pixar uses for creating
    its popular animated films, such as Cars and Toy Story.


    At first, the interface of Kittler''s raytracer (figure 6.1) seems a bit stark.
    The program proceeds as a series of yes or no (de rein) and numerical questions.
    Responding in the operating system''s terminal, the user sees unformatted white
    text on a black background, the staple of pre-Windows DOS computing, offering
    parameters for configuration: objects, and surfaces. The user can edit the lamp,
    or light source, or set additional lamps. Because raytracer trace the path of
    light reflecting off objects and into the eye or screen, the choice of light sources
    and light position is critical. Kittler''s user can also select from torus, ellipsoid,
    or agnesi, also known as the witch of agnesi, the mind from which derived from
    that mathematician Marie Agnesi. (pers. interview, Feigfeld, Google Hangouts,
    January 21, 2019). Kittler was particularly proud of his mobius (moebius) object
    because the curious shape is not an illusion but the instantiation of mathematics
