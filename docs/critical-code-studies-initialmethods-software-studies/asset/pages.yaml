  md: '# Introduction


    courses because its operations are specific, even idiosyncratic, to this language.
    No doubt, programmers who read these code samples probably have already begun
    to form impressions of the two candidates in their minds: the one careful, organized,
    ordinary, perhaps tedious; the other with a tendency to show off. But every business
    is different.


    Different companies, different programming cultures, different priorities, different
    work tasks require and different abilities. One set of employers might value the
    code that is easy to read, modify, and sustain. Others might see the one-line
    solution as a sign of strong programming instincts, the ability to fully internalize
    the code structures. Interpreting further, each employer might have different
    assumptions about which code was written by and which by the woman. (Perhaps you
    have already made such assumptions.) Depending on their biases or hiring needs,
    they might favor one or the other, again depending on how they read gender out
    of into the presentation of the code. One need not look further at the recent
    exposure of the gender divide in computer culture than the recent events at Google
    to see the crisis in gender equity in Silicon Valley and beyond. This example
    and the example suggests that code conveys more than ability: it expresses equity,
    even if these challenges are used to make hiring decisions less dependent on other
    channels of identity, as résums or in-person interviews.


    The programmers, aware of these possible interpretations, are choosing their strategies
    as well, realizing that they are representing themselves to the prospective employer.
    They cannot assume their code will be interpreted in a particular way. Employers
    may see the one-liner as a sign of a tendency to obfuscate or the multiline as
    a sign of a pedestrian approach to problems. The programmers may be torn between
    conflicting ideas and aesthetics taught in programming classes or developed by
    interacting with other programmers professionally or otherwise online. They may
    also be influenced by their exposure to or immersion in various programming paradigms
    or languages that emphasize one virtue (say, usability) over another (legibility
    or optimization).


    Code in this example offers a medium for a Turing test, Alan Turing’s thought
    experiment challenges a computer to pass itself off as a human. However, rather
    than a computer and a human who is more skilled at speaking human language, this
    scenario presents two programmers attempting to prove who can speak the language
    of computation more fluently, or at least successfully in the dialect of the corporation
    from which they are seeking employment. Only the surface challenge asks whether
    or not the human can speak in a way the computer understands.'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'The deeper challenge asks the programmers to communicate who they are to other
    humans, coworkers and collaborators, through their use of code. Their code is
    not so much a litmus test, proving whether they can perform the task, as it is
    an exam, communicating character through process, values, and approaches to challenging
    questions. Simply put, code in this test proves again to be more than a functional
    tool: it is a means of expression between humans through communication with machines.


    The many trade-offs in the minds of the programmers faced with this task and the
    wide variety of reading these programs demonstrate a portion of the complexity
    in the act of communicating through code. The meaning of the code goes beyond
    the functioning of the program because both programs perform the same task—a task
    itself seems to have little significance for either party, though so much (i.e.,
    employment) is at stake. Instead, the code itself is located within a broader
    communication exchange, one that is bound to time marked by developments in programming
    paradigms, languages, hardware, and networks. Not everyone who reads code, as
    in this case with the employers, share the goal of realizing that particular software
    process. This is crucial because writing about code, from textbook to style guides,
    neglects the use of code in training exercises and artistic explorations, just
    to name two examples in which the computer program was not written to execute
    a solution to a problem. Here, the problem of the anagram was the sword in the
    stone, the evocative object. This book will explore the ways source code becomes
    meaningful through circulation in diverse contexts, how its tokens convey beyond
    their functionality, and therefore how code serves as a communication medium including
    and beyond the realms of practical application on specific machines.


    In this hiring example, source code is not merely the objective right answer to
    the straightforward mathematical question, not something that can be assessed
    empirically better or worse. In the fact, the notion of empirical truths or unquestionable
    values in computer proving to be even less stable than it is in the material world,
    the social constructions of which have been well articulated by theorists and
    philosophers. In either solution, the code is merely one version of this process
    may be implemented. Its final form is the result of mathematical certainty but
    of collected cultural knowledge and convention (cultures of code and coding languages),
    haste and insight, inspirations and observations, evolutions and adaptations,
    rhetoric and reason, paradigms of language, breakthroughs in approach, and failures
    to conceptualize.'
  merge: -1
