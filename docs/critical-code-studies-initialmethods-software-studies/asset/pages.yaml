  md: '# Kittler’s Code


    Kittler''s meditation on computers did not inflect the philosophy he drew from
    digital machines but shaped his other media theory as well. The title for Gramophone,
    Film, Typewriter, as Kittler notes in a lecture (2011b), and presumably the notion
    of this tripartite structure of the book, was chosen to parallel the three-part
    structure of the von Neumann computational architecture. This is the same architecture
    that has informed computer design for much of its development so far, containing
    the CPU, memory, and the bus that shuttles information back and forth. Kittler
    argues, in lecture, that this tripartite structure replaces the long-held Greek
    notion of “matter and form” with the media theoretical trinity of “processing,
    addressing, and storing—or, or in other words, commands, and addresses.” In doing
    so, the media determinist has performed for a subtle illustration of his theory
    as he looks back upon these technological developments and conceptualizes them
    as the inside of a computer.


    In his assembly, we can see Kittler tracing the interconnections between this
    triumvirate, as he issues commands and shuttles data to and from locations in
    the stack, following the control flow, monitoring latency, the theorist with his
    stethoscope to the heart of the machine—or perhaps more accurately, the theorist
    philosopher in his miniature ship taking a fantastic voyage through the body of
    the machine, only to emerge with deep sense of perceiving never metaphors, as
    well as with a mind more rigorously and precisely tuned to sensibilities of the
    machine, a kind of mental discipline that we can hear when he spends hours recounting
    scientific facts with occasional gestures toward brightest Heaven and darkest
    Hell.


    From Kittler, however, we can take a corrective that we can also see in the media
    theory of N. Katherine Hayes, Matthew Kirstenbaum, Jussi Purrikka, and Alexander
    Galloway. To maintain the current truce in the so-called science between scientists
    and technocultural critics who see and seek the meaning in the science, we have
    to get the science right.¹


    # Conclusion


    Friedrich Kittler may have argued that “there is no software,” but an exploration
    of his software proves not only its relation to his philosophy but the code’s
    expressive potential. Even if we follow his code to the level of the assembly,
    in which he is assigning value to registers, we can still encounter an expression
    of understanding that is valuable in reflecting on his theorization of the machine.
    Meaning does not end at the level of electronic hardware, even if it appears to
    be devoid of language.'
