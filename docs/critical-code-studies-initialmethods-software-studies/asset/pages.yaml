  md: '# Futures of Critical Code Studies


    smaller, faster in grand progress narrative, but instead by adding new dimensions
    to that inquiry, most notably questions of meaning and the implication of coding
    choices. It asks the programmer to reflect on a wider field of significance of
    the choices they are making as code. It frames the task of computer programming—as
    it already—is site of dialogue and contest, collaboration and cooperation between
    design and engineering,as well as philosophy, sociology, linguistics, history,
    art, and many more fields, each bringing rich traditions and methods of exploration.


    # Informing Computer Science Curricula


    In addition to enriching the overall liberal arts education, critical code studies
    can offer particular benefits to the study of computer science. Since its inception,
    computer science has been an interdisciplinary pursuit benefiting from scientific
    minds who are deeply invested in arts and philosophy. Alan Turing himself is one
    example, Ada Lovelace another. Not to mention the reflections of influential computer
    scientists such as Joseph Weizenbaum (1976), who warned against the dehumanization
    that can attend the race for greater technology. In harmony with the origins of
    computer science, critical code studies bring philosophical and ethical questions
    into the computer science classroom at a more concrete level.


    From a pragmatic viewpoint, most engineering and science curricula include an
    ethics component and are required by standardization organizations such as the
    Accreditation Board for Engineering Technology (ABET), which currently accredits
    over 3,500 programs (Oudshoorn al. 2018). Whether or not computer science programs
    are also accredited, ethics should be a component of their curricula. As mentioned
    earlier, there is a growing awareness of bias in algorithms and a need for algorithmic
    accountability. Courses or course content in critical code studies could help
    programs attend to the ethical dimension of their instruction in an applied fashion
    to complete the existing requirements in philosophy classes. However, ethics is
    only one dimension that critical code studies bring to the reading of code. CCS
    also takes seriously the art of code, its rhetoric, and its expressive qualities.
    CCS considers the social dimensions that attend what seems to be purely technical.
    Adding code studies to computer science courses can augment the instruction in
    this area already spreads beyond a functionalist or utilitarian approach. Here
    I am inspired by courses like Kim Knight’s “Fashioning Circuits,” which brought
    together “computational craft” with “domestic technologies” and “soft activism,”
    stitching together areas to see what new possibilities arrive. Critical code studies
    can both lead to reflection on past craft and inform future creation.'
