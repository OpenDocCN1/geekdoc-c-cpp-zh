  md: '# Introduction


    that creeps into discussions of programming, what I called enchanted chauvinism
    (see chapter 5),^26 whereby we assert a hierarchy based on an arbitrary judgment
    of what is “real” or “good” or “right” code. Surely chauvinism is driving much
    of the commentary on the Reddit boards mentioned earlier, and though it can grow
    out of rigor and integrity, it typically serves to suppress, denigrate and to
    diminish the work of others in a way that is poisonous to programming culture
    and development. To write code that runs the streets is not more important than
    the creative act of coding out into the protest sign. In fact, I read the second
    program through the lens of the first. I juxtapose these examples to model one
    kind of code-reading practice (code read by comparison to other code) and to argue
    that speaking in code does not require programmers to make code like spoken language
    or to create puns with code. A person writing what they think is ordinary, functional
    code is making meaning already. Critical reading code does not depend on the discovery
    of hidden secrets or unexpected turns, but rather examining encoded structures,
    models, and formulations; including connotations and denotations of specific coding
    choices; and exploring traces of the code’s development that are not apparent
    in the functioning of the software alone. As with texts, the discovery and creation
    of meaning grow out of the act of reading and interpretation. As the product of
    processes carried out over time by human and machine collaborations, code offers
    details and foundations for these interpretations. Every ordinary code designed
    to achieve some everyday, practical goal, to produce some output or process, carries
    with it meaning beyond what it does. I argue that computer code since its inception
    has a means of communication (and here ideological), but that we are only beginning
    to discover the methods of explaining that ideology or, more broadly, meaning.


    When reading the examples of the protest sign and the Women on GitHub project
    code, I do not and cannot approach them in ideologically neutral way. Instead,
    my reading is informed by feminist and postcolonial critical theories. These theories
    attach val to what might otherwise be framed as technology, a view which merely
    disputes its own ideological assumptions. My reading is influenced, for example,
    by the work of Risam, in her book New Digital Worlds (2018) identifies a need
    for postcolonial digital archives on a more intersectional model. Intersectional
    means drawing together multiple interconnecting aspects of identity. As Risam
    explains, “Within colonized and formerly colonized nations and for people outside
    of dominant cultures, access to the means of digital knowledge production is essential
    for reshaping the dynamics of cultural power and claiming the humanity that has
    been denied by the history of colonialism” (46). Risam and I are influenced by'
