    remains: Assuming such distinctions are useful, how high the level is FLOW-MATIC?
    On the one hand, many of the operations seem to be verbal representations of assembly
    commands, leading Nick Montfort to call the language assembly++ (Marino 2014).
    For example, the JUMP and MOVE operations. On the other hand, FLOWMATIC uses an
    architecture that is quite sophisticated in which the data is modeled separately
    from these instructions—or, as Samett (1969) puts it, there is “the realization
    that the data designs can be written completely independently of the procedures
