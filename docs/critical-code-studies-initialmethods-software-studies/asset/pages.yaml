    variations. Plotkin notes that his own code lacks a bit of the sparse simplicity
    of Montford’s, but he feels he has remained true to the aesthetic of the original.


    Plotkin documents his process in an elaborate comment at the beginning of his
    code. In a piece that displays parts of his own code on the screen, it is interesting
    to see what Plotkin does not display. First, it is quick to assure the readers
    that “Yes, this page really execute the code that’s displayed in the left column,
