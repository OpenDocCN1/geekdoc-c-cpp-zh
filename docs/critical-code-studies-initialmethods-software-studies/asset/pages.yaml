    More importantly, as he reflects on the proliferation of redundancy in languages
    due to backward compatibility, he speculates on the role discourse analysis could
    play, despite the fact that it “can neither name nor debug the proliferation of
    languages” (Kittler 1999, 218). Kittler concludes, “Codes begin to proliferate
    and approach the opacity of everyday languages, for millennia, has subjected people
    to these same languages” (218). The alphabetical man, to borrow a phrase from
    another media theorist, Marshall McLuhan, is subject to language. With irony,
    Kittler adds, “The lovely phrase source code’ names the literal truth,” that code,
    or encoded languages, is at last the technological a priori that frames our digitized
    thoughts. Nonetheless, Kittler in making his raytracer has demonstrated how these
    codes can be operationalized for a creative method of analysis that not only accesses
    the machine’s physical memory but also allows him to trace media advances of mathematics
    and physics to reflect on being itself as a philosopher programmer.


    Through this example of Kittler’s code, I have tried to demonstrate how programming,
    working with code, requires a form of thought akin to meditation. To read a person’s
    code, or at least the code they have collected and connected, is to be able to
    explore their meditations on the machine over time. Furthermore, code itself becomes
    a means of symbolic thinking and reflection—not merely an illustration of ideas,
    but an expression of them. Reading them, therefore, is a gesture of communion
    with the ones who assembled them, incomplete though that communion may be.'
