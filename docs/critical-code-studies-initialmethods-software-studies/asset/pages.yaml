  md: '# Kittler''s Code 167


    media he theorized. At the same time, his work in code, in this unambiguous realm
    of signification, reinforces a critical practice that prefers accurate technological
    and scientific description to interpretation and reflection. Though he conjures
    meaning through his wry, allusive writing style, he seems reluctant to interpret
    beyond drawing analogies and demonstrating the impact of technology in his signature
    mode of technological determinism.


    This chapter interprets the code he developed for a type of graphics software
    known as a *raytracer*. An examination of Kittler''s code reveals his engagement
    with the algorithms of raytracing and his understanding of the affordances of
    the Pentium IV. Exploring his C and assembly code in his raytracer leads to a
    more complex understanding of Kittler''s critical positions and demonstrates the
    way critical code informs his history. In this chapter, I will identify ways this
    raytracer has informed his own sense of the models, metaphors, and machinery operationalized
    in the processes he would interpret. By coding to understand, Kittler engages
    in a kind of epistemological programming, through media and its relationship to
    culture.


    More importantly, this chapter will bring together the techniques of critical
    code studies, software, and platform studies, along with, of course, media archaeology,
    of which Kittler is rightly called a father, to demonstrate the interdependence
    of all these approaches. Here is a preeminent media archaeologist writing code
    with attention to platform—creating software that combines high and low languages
    to create, through algorithms, a *medium* (on the medium of all media, the computer)
