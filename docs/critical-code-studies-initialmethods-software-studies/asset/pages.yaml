    WalkingToolsGpx API, a library of tools for use in art projects involving GPS-navigated
    walks, in rural or even dangerous areas. University of California, San Diego-
    francisco Ricardo Dominguez proposed to his EDT collaborator that they consider
    applying these tools to the US-Mexico border, and Transborder Tools for Immigrants
    (as the project was originally called) was born, though not before EDT applied
    for both purchase and to develop a poetry component of the project to be written
    by EDT member Amy Sara Carroll. As the project progressed, the collective developed,
    including the poetry and code, in conversation with one another, according to
    Carroll (pers. interview, Skype, March 12, 2012). The group began the development
    in earnest, together with the other members of EDT: Elle Mehrand and micha cárdenas,
    and a UCSD undergraduate, Jason Navarro, who over the summer of 2008 wrote the
    core code for the tool with Staibaum. While in development, the tool they created
    has caused quite a disturbance.


    TBT emerged at a time of heated and divisive debate about the US-Mexico border,
    a debate which longed this episode and which persists today. These were the days
    of Arizona’s Senate Bill 1070, the Support Our Law Enforcement and Safety Act
    gave law enforcement the authority to make “reasonable attempts to determine the
    immigration status” of any person they encountered, essentially authorizing the
    legal profiling of the undocumented. In incendiary climate, within a few months
    of the publication of articles about TBT in 2009 in Vine magazine (Dunbar 2009)
    and then the geek culture link site Boing Being, the University of California
    received a letter from Congressman Duncan Hunter and two others. Hunter “found
    the project to be a use of taxpayer money, particularly during a recession” (Miller
    2010). As Fox News gave the story national coverage, the University of California
    began an audit of the project, while several other investigations began to pursue
    Dominguez. Between op-ed pieces and a featured spot on the Glenn Beck Program,
    the project grew in infancy, as the production of the project was delayed, provoking
    violent emotions before the app had ever been used (Morlan 2010).


    The Transborder Immigrant Tool exemplifies Rita Rally''s (2009) concept of “tactical
    media, the “critical relation” of which is “disturbance” (19). She explains, “In
    its most expansive articulation, tactical media means the intervention and disruption
    of a dominant semantic regime, the temporary creation of a situation in which
    signs, messages, and narratives are set into play and critical thinking becomes
    possible” (19). Rally posits tactical media as a response to “a shift in the nature
    of power, which has removed itself from the streets and become nomadic” (1), a
    notion inspired by the Creative Art Ensemble, one of the major creative influences
    of EDT of which Dominguez was a member.'
