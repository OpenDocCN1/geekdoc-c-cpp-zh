  md: '# The Transborder Immigrant Tool


    # Functionality


    TBMIDlet, or Transborder midlet, presents the core code for the Transborder Immigrant
    Tool (TBT; 3.1). The primary function of this code is to extend the MIDlet class,
    creating, of the basic object for MIDlet applications, with the methods and other
    attributes of the TBT, creating, of course, TBMIDlet. The Main call in another
    file will start the app by creating an instance of this class. The code uses,
    among other libraries, the WalkingTools library, also created by Brett Stalbaum
    with Brazilian media scholar and artist I. da Silva, for a Global Positioning
    System (GPS). Because this project was begun before the advent of contemporary
    smartphones, Stalbaum had to create extensions to the GPS standard for associating
    media information (audio in this case) with GPS information. The TBT uses the
    GPS information to establish the walker''s proximity to various points, either
    a city or a water cache in the desert by a volunteer organization. As the person
    gets closer to the water cache, the system vibrates more frequently. In the meantime,
    the app will play randomly selected audio files of recitations of poems, which
    contain information on how to survive in the desert. The traveler using the app
    has opportunity to choose a target or destination. If the app detects that the
    traveler has stopped for too long, it will emit vibrations and audio alerts to
    try to motivate the traveler to move. The code also is designed to translate all
    messages into whatever languages are added to the system.


