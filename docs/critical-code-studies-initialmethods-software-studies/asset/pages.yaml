  md: 'more people are responsible for assembling—and here I use that word in the
    noncomputational sense—the code. For that reason, a code reading benefits from
    discovering as much relevant information about the code''s creators as the reader
    can gather.


    When possible, I prefer to interview the code authors, but scholars can read their
    writing or listen to their discussions of the code. Here code interpretation is
    a bit different than traditional literary interpretation, which scholars often
    treat the objects of study as artifacts floating in history, removed from further
    sharing by the author. Perhaps is one of the ways code reading is different from
    literary artifacts. Because literature is created to be interpreted, deferring
    to “authorial intent” tends to be the death of literary interpretation. However,
    because most code is an expression of thought in kind of shorthand, typically
    not an ends but a set of symbols that emerge from the process of making something
    else, knowing the thought process produced the code, in as much as that is available,
    can be greatly illuminating.


    # Research Its Evolution


    Programmers iterate code, releasing new versions, sometimes refactoring large
    portions. Often code is revised or extended by programmers who take the project
    later in its life. Examining the changes to programs over time is a useful strategy
    for understanding the life of the code, how it makes its current form known to
    developers.


    # Research Any Required Hardware and Software


    Most high-level code does not require particular hardware. That is the beauty
    of a highlevel language. When code does require hardware, however, knowledge about
    that system enriches the understanding of the code. Code also operates with other
    software, such as operating systems. Knowing the interplay between code and those
    systems is useful because those systems shape what code can do and, consequently,
    its significance. Code readers should also attend to any development software
    used to produce the code, in the example of NetBeans, which was used in the Transcoder
    Immigrant Tool. These tools are particularly important because they offer the
    reader glimpse into the way the developers encountered their code while creating
    it and because these tools have shaped and even produced some of the code.


    # Research the Genre of the Program


    Programs can be organized by types based on their function, structure, or purpose.
    A genre-based, or generic, understanding of the code can help the reader understand
    what aspects of the code are novel and which are conventional or acting as boilerplate.'
