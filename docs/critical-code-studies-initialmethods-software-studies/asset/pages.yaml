    26–43: Global declarations, naming the various matrix transformations.


    45: .align places the next byte at an address divisible by eight. The process
    of aligning memory access gains a kind of programming priorities.


    46: clobbers, a term for assembly, overwrites ecx; registers eax and edx are free.


    47: pushl puts the long operand (l, meaning thirty-two bits) onto the stack.


    48: movl, move the long operand from the stackpointer (esp) to esi.


    50: xorl clears ecx, changing the operand to 0.


    54–57: flds loads the product onto the stack. Fl refers to floating point.


    73: Add the contents of register st to register 5 after st.


