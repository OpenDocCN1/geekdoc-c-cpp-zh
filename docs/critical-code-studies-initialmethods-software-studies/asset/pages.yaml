    pipelined therefore can process additional instructions during the latency—that
    is, while first instruction is moving up the cycles (fetch, decode, and execute);
    Antonakos 1999, 556). If the programmer does not write some, the processor adds
    “no ops,” or dummy instructions, which buy time for the system to complete the
    previous operations.


    In his MTimes method, Kittler’s code optimizes the time the system needs to perform
    an operation, or latency, so he adds instructions to be processed during this
    latency:


    ```

    %ch

    decb

    fmfuls 3*FL(esi)

    faddp %st,$st(1)

    jjz mat

    ```


    The code at this point is performing a loop. The first instruction, decb, decrement
    the counter, indicating that a loop has been performed. The instruction jnz will
    jump up to matl so long as the counter has not reached zero. (This is JUMP TO
    instruction discussed in the previous chapter.) However, the operation of decrementing
    the counter must make its way through the instruction cycle (fetching instructions,
    decoding, reading operands, writing back) before jnz can perform its comparison—or,
    another way, it takes a few steps of the instruction cycle for decrement to check
    the jump instruction condition. Because jnz relies on decb writing back its result,
    Kittler is optimizing the code by initiating the instruction cycle of two other
    operations in the meantime (fmfuls and faddp).


    Barbara Marino, a professor of electrical engineering at Loyola Marymount University,
    who is also my spouse (pers. interview, October 1, Marino 2014), has said that
    Kittler’s code here performs the equivalent of emptying the dryer while the washing
    machine is running.¹ “Most programmers don’t think about optimizing a task at
    the level of CPU and memory,” she explains. To optimize the code in this way shows
    an uncommon understanding of the timing of the processor. “Here,” she adds, the
    sign that Kittler knew he was doing.


