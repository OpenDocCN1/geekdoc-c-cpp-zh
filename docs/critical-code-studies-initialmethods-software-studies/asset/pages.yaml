    \ ; fudge factor\nif n_elements(ylroc) ne n_elements(valadj) then message,'Oooops!'\n\
    ;\n[...]\n;\n APPLY ARTIFICIAL CORRECTION\n;\nyyearlyadj=interpol(valadj,ylroc,x)\n\
    densall=densall+yearlyadj\n```\n\nIn brief, the code takes a set of data, for\
    \ years 1400–1994, and adjusts that data by adding, or subtracting in the case\
    \ of negative numbers, another set of numbers (listed as valadj, presumably for\
    \ value adjust). The code makes these adjustments using what programmers call\
    \ magic numbers, or unnamed constants, introduced into the code with no explanation\
    \ of their reference (Farrell 2008). By adjusting the numbers in this way, the\
    \ fudge factor comment labels the created set that conforms to his expectations.\
    \ Semicolons precede that that is not to be processed—in other words, comments\
    \ in the code (and lines with only white space). The all-caps header “a artificial\
    \ correction” seems to announce unambiguously that this code is pure manipulation.\
    \ However, these labels lack a bit of context.\n\nRather manufacturing some great\
    \ deception, this code was written as an interim step in the process of consolidating\
