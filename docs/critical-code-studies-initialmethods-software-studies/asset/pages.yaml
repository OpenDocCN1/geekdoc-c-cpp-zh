    # Interoperating Systems


    Writing programs in a natural language, whether spoken or written, has been a
    dream of programmers quizás since the advent of the digital state machine, and
    yet the pursuit of that dream has revealed subtle (and not subtle) distinctions
    between the natures of programming languages and human languages. Paradoxically
    increasing accessibility with respect to one aspect, as readability to those who
    know English, can raise obstacles to others. Furthermore, as computer languages
    distance themselves from the binary of the machine and the hardware-dependent
    assembly, they develop syntax and vocabularies that resemble the language of everyday
    interaction, the sources of meaning, attending to culture and identity, and code
    reveals itself to be (always already, as the philosophers like to say) tied to
    culture and identity, and code reveals itself political.


    On its surface, the code that opens this chapter may seem the most accessible
    example in this book, seemingly written in everyday imperative English. What makes
    this program and its programming language, FLOW-MATIC, interesting is its own
    internal contradiction. On the other hand, the language was created to give business
    people, meaning nonprogramming managers and nonprogramming military officers,
    an accessible language for programming newly arrived business and tactical machines.³
    On the other hand, the very symbols that make this language (potentially) easier
    to read for some more cumbersome to others, especially those who feel more comfortable
    with mathematical symbols who would feel at home in other languages of the time,
    such as FORTRAN or MATH-MATIC. Surely the desire to make computer languages and
    computer programming seems more familiar is a deep and persistent one.


    However, because language, culture, and epistemologies are closely intertwined,
    to choose one specific natural language for a base language has significant implications
