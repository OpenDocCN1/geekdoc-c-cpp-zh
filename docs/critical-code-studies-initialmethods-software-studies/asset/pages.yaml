    3: 31.07.11: Dates appear throughout this piece. This update seems to be from
    July, 2011. Note that Kittler published Optical Media in 2010, published "Computer
    Graphics" in 2001, and gave the lectures Optical Media was based on in 1999. The
    earliest update in this code is noted as 01.04 on line 43. However, there may
    have been earlier versions.


    4: The core of this program is based on a Turbo Pascal called PRTRACE.PAS, originally
    published in c''1/993,167If, Magazin für Computertechnik (Claussen und Pösel 1993),
    which indicates when Kittler began work on this project.


    5: A second mention here of povray3, one of the sources for this code. It is a
    raytracer the first version of which appeared in 1991. POV in the name refers
    to Dali’s "Persistance of Memory" and the concept of persistence of vision in
    biology (Book 2001).


    6: Kittler shows he is wrestling with the software updates that affect his code,
    showing how code studies is also software and platform studies. While developing
    this software, Kittler was using Intel machines that had DOS installed.


    8: COMPARE precedes a line of software that Kittler drew


    9: See a further discussion of matrices.lsater in this chapter.


    19: In reflection, the software creates the illusion of reflection by applying
    an image (reflection) to the reflective surface, mapping the image onto the contours
    of the reflective object. The technique was developed in the early 1980s by two
    independent groups, Gene Miller with Ken Merlin, and Michael Chou (DeBevec 2006).


    22–23: In German, weiter means "continue" and nein, of code, means "no."


    25: Heaven, Hell, and ground originally, "Himmel, Boden," which could also be
    translated as "sky," "hell," and "ground." Plein-air refers to images painted
    outside "en plein-air," a technique that dates back to the eighteenth century
    (Malafonte 2009). Kittler seems to be referring to images created out of the program
    itself, which becomes the "inside," mapping a historical artistic diptych (inside
    the studio, outside the studio) onto the software (inside the program, outside
    the program).


    26: "Limited only by RAM": Notice Kittler’s attention to hardware in his code’s
    documentation.


    33: "Any number of lamps?" as a tracer, the software works to move the movement
    of light from light sources, or "lamps."


    38: In the foreword to Gramophone, Film, Typewriter (Winthrop-Young and Wutz 1999,
    xxi), the translator notes the irony of Kittler’s use of "simply" (einfach) for
    things that are hardly simple.


