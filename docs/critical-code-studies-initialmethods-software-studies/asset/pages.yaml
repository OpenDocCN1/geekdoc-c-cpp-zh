- img_proc: true
  md: 'to publish their source code (or even essays embedded in their source code)
    with an awareness that critical code studies scholars will be perusing their code
    later. Similarly, artists as J. R. Carpenter (2011) and Brendan Howell (Griffiths
    et al. 2010) have published book versions of procedurally generated literary texts
    that have included their source code. The creators of the Transborder Immigrant
    Toll, discussed in chapter 3, have likewise published their code along with excerpts
    of the verbal poetry of the piece. These artists forged the code in the publication
    of their works, they invite readers to include an exploration of their code in
    the interpretation of the larger work.


    This brief overview does not even begin to count the many books published in the
    field of computer science that are discussing code beyond functionality. One notable
    collection is Beautiful Code (Oram and Wilson 2007), which asked influential programmers
    to share essays on examples of code that were beautiful in their eyes. The discussion
    about aesthetics, including multiple perspectives, and acknowledging the subjectivity
    of aesthetic claims is the starting point for recognizing code as a realm of discourse
    that deserves deep discussions that go beyond functionality and efficiency.


    Over ten years after it, the movement to develop critical code studies is well
    on its way. Much of the initial pushback has dissatisfied scholars who became
