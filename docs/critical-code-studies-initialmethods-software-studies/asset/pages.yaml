  md: '# 8 Futures of Critical Code Studies


    We have reached a moment in which philosophers process, poets publish, and curators
    collect code knowing scholars will interpret it as discourse. The time is ripe
    for critical code studies, and it has played a role in the ripening.


    Critical code studies as a set of methods and a community of practice is case
    studies with some reflections is still very much in its infancy, and I am reluctant
    to limit it by pronouncing its future. However, I wanted to conclude this first
    collection of case studies with reflections on the practice and a few suggestions
    for future explores. The goal of this book was to demonstrate some initial approaches
    to reading code based on case studies drawn from hot-button science debates, provocative
    art projects, the foundational moments in the development of a programming language,
    and the critical making of a media philosopher. The readings have attempted to
    demonstrate a variety of interpretive methods, or moves, as I like to think of
    them, as exploring the metaphors raised by the names of constructs in the code,
    examining misreadings and recontextualizations of code, interrogating the cultural
    stakes of language formation, and reading code as a complement to philosophical
    tracts, for there is still so much to interpret—and in fact, the methods gestures
    offer a few but by no means all, that the methods may be endless, as every new
    innovation in programming becomes a new opportunity and challenge for interpretation.
    The work to develop new reading practices must continue and will continue in parallel
    with the development of technology. Nonetheless, the development of this field
    is reliant not only on its methods but also its ability to offer insights to.


    Here, then, are four areas to which critical code studies might be productively
    directed in the future. They apply not so much to the micropractice of individual
    interpretive moves in close readings but instead to the macrodevelopment of the
    field in relation to others. I will focus primarily on the growth and development
    of CCS in the academy—as opposed to, say, in industry or in amateur communities—because'
