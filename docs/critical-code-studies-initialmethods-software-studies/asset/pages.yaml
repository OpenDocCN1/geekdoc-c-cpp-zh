  md: 'to “drink ... rest ... seek water at twilight,” now a refrain. For those who
    encounter the art project, as opposed to those using the system to survive, the
    instructions are like the code: something we read (or hear) as intended for someone
    or something else to put into action. Like the code, the poetry alters conditions
    with instructions. The second symptoms list is repeated, but the pattern is interrupted
    by an alert: “Stop,” followed by a much stark warning. The symptoms list resumes
    with elaboration, embellished with images. Through anaphora, Carroll intensifies
    the impact of the heat. The final list marks the person will not be able to react
    or recover from, followed by a command. This alternation of the symptoms and instructions
    acts as alternating threads or subroutines, the one depicting the set of effects
    of dehydration, the other instructions on what to do next. Yet they are unrelated.
    The symptoms serve as signs to motivate the responses, a series of if-statements.
    They proceed with increasing severity on a path to dehydration while they are
    instructing how to respond to it. The instructions, through direct address, serve
    as the move-WarningEnervator, to the pushing traveler to action. Although the
    code does not list the symptoms in stark detail, the poem fills in details of
    the additional conditions of the traveler for whom the variable isMoving is set
    to false. Moreover, the parallels between the code and the poetry have made permeable
    the border between their positions in the art project.


    The rhetoric of folk wisdom, whether in rituals or prophecies, delivers its instructions
    with conditions for execution and possible scenarios for outcomes, in ways analogous
    to the code (Borovoy 2002). In cautionary stories and axioms, rhymes and legends,
    folk wisdom travels through a series of admonitions that, the code, carries when
    its conditions are not met. The code and poetry of this piece delivers the wisdom
    of those survival procedures in tones that alternate between calm, methodological
    instructions and descriptions, on the one hand, and alarming alerts and pressing
    imperatives on the other. The juxtaposition of those tones, as well as the interplay
    between the poetry and the code layers, the way they frame one another, disrupts
    any singular narrative of the transborder traveler’s experience, offering instead
    a journey that proceeds with urgency and yet inevitability, inevitability and
    yet calm, leading to death or to survival.


    At the same time, both the code and the poetry defy the political Molotov cocktail
    by situating the land not in the context of political boundaries but in a survival
    narrative. Although we have read the code as deployed by an imaginary undocumented
    immigrant, neither the poetry nor the code makes mention of the traveler’s national
    identity, using TB in the naming of files and methods throughout the code to transcribe
    transborder across the project in place of undocumented or illegal. The'
