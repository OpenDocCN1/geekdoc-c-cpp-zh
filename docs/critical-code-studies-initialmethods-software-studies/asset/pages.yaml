  md: '# Final Words


    Ultimately, as with any interpretation, the journey into code is an exploration
    that says just as much about the code as it does the mind of the person examining
    it. Unless someone wishes to embark on the task of uncritically documenting military-industrial-academic
    artifacts on behalf of those who created them to the benefit of their creators''
    self-regard, I do not recommend treating this examination as an empirical activity
    rooted in objectivity. Instead, the objective reality of the code is shaped by
    social constructions and provides an occasion for subjective reflection. Code
    itself is neither the end nor the beginning of this reflection, but as an expression
    of thought, as a trace record of labor and development history, as an artistic
    medium, and as a connection point in human-machine assemblages, code offers an
    opportunity to reflect on technoculture with symbols that are at once completely
    unambiguous and at the same time open to interpretation. What you find at the
    end of the reflection will say as much about you and your cultural history as
    it will about the code. Such reckless and indulgent humanism may not lead to smaller,
    faster, more efficient code, but it may lead to something far more valuable: understanding.'
