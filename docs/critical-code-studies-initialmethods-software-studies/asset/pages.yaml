  md: '# Introduction


    be said that all code represents only one iteration of work in progress, this
    particular file was acknowledged to provisional by its developers. Harris''s other
    writings identify this adjustment in his code as a temporary placeholder measure;
    these markers in the code identify places where he had to temporarily correct
    a discrepancy. The leaked code was apparently written while Harris was preparing
    a paper with his team about the disparity between tree records and temperatures,
    titled “Trees of Past Climates: But Are They Speaking Clearly Today?” (Briffa,
    Schweinggruber, Jones, Osborn, Harris, et al. 1998). In other words, this code
    was not the final as climate change but to label and investigate a problem observed
    in the recorded data, in which latewood density (the measured density of tree
    rings) did not correlate to changes in temperature. The programmer wrote in this
    fudge factor while trying to account for the discrepancy, only to rewrite the
    code in the same year in a way that addresses the divergence systematically.


    However, despite the meaning of the code to its programmer, the code came to signify
    something very different in the broader world. News reports and amateur bloggers
    seized upon the files, posting excerpts in their diaries. Code was literally becoming
    the means of debate, used as evidence in arguments for and against the scientific
    validity of climate change. The damning comments were featured on major networks,
    such as the BBC and CBC, as well as in news magazines and newspapers. Bloggers
    seized upon the comments of the Harris_Read.txt file and lambasted the coder for
    his fudge factor. The files were referred to as “the smoking gun” of climate change
    fabrication. As one blogger posted, “things like ‘fudge factor’ and ‘APPLIES A
    VERY ARTIFICIAL CORRECTION FOR DECLINE’ don’t require programming expertise to
    understand” (Wheeler 2009). But apparently they do. Even that blogger recommends
    that readers know how to read code before exploring their own. Regardless of the
    reader’s training or comprehension, code had become a means of public debate.


    In our digital moment, there is a growing sense of the significance of computer
    source code. It has moved beyond the realm of programmers and entered the realm
    of mainstream media and partisan blogosphere. Those discussing code may not be
    programmers or have much fluency in the languages of the code they are quoting,
    but they are using it to refute, and start arguments. There is also a growing
    sense that the code we are not reading is working against our interests. Pundits
    and academics alike are algorithms used for everything from profiling health insurance
    calculations. Scholars, such as Safiya Noble and Joy Buolamwini of the Algorithmic
    Justice League, have called public attention to evidence of bias in AI systems
    and other software. However, these discussions are limited to assessing'
