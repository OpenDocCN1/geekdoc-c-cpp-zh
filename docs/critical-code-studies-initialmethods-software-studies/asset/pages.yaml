  md: 'ELIZA is a conversational system built by Joseph Weizenbaum on the MAD-SLIP
    (Symmetric List Processor) system. SLIP is an application programming interface
    written in FORTRAN II (Weizenbaum 1963). What we generally call ELIZA is actually
    a script called DOCTOR that Weizenbaum wrote for that system, a script he published
    in 1966, and it is possible from reading through the keywords and the templates
    for the responses—or, to use the language of bots, the grammars—to develop a sense
    of how the program operated. Although we do not have the ELIZA system itself,
    between transcripts and accounts of interactions with the program and this script,
    we can get a sense of how it worked. The code begins with a greeting statement:


    ```

    (HOW DO YOU DO. PLEASE TELL ME YOUR PROBLEM)

    START

    ```


    Start begins communication exchange. If the person says the keyword "sorry," the
    system recognizes it in the following template:


    ```

    (SORRY ( ).

    ```


    It reacts by drawing from a series of responses:


    ```

    (PLEASE DON''T APOLIGIZE)

    (APOLOGIES ARE NOT NECESSARY) (WHAT FEELINGS DO YOU HAVE WHEN

    APOLOGIZE) (I''VE TOLD YOU THAT APOLOGIES ARE NOT REQUIRED))

    ```


    The system stores to value variables represented by numerals. For example, the
    keyword REMEMBER in the following statement:


    ```

    (REMEMBER 5

    ```


    That triggers the following result templates, which make use of the value stored
    in 4 and 5:


    ```

    ((0 YOU REMEMBER 0) (DO YOU OFTEN THINK OF 4)

    (DOES THINKING OF 4 BRING ANYTHING ELSE TO MIND)

    (WHAT ELSE DO YOU REMEMBER)

    (WHY DO YOU REMEMBER 4 JUST NOW)

    ```'
