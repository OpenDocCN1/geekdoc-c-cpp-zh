  md: '# 112


    # Chapter 4


    0.75. These adjustments, labeled a fudge factor, will be the source of the claims
    of evidence tampering. At first, the code makes those adjustments to the data
    every five years; then, through linear interpolation, it makes adjustments to
    the intervening years (between the five-year increments; Graham-Cumming 2009).


    In the first part of this code, ylroc creates an array, or vector in this programming
    language, that begins with 1400 and 1400 using 1904, 1909, 1914, all the way to
    1994. In other words, after the first two years, it increases the years by five.
    The next line creates an array of numbers, each of which is multiplied by 0.75,
    the so-called fudge factor, and then a comparator checks if there are the same
    number of elements in the two arrays. We have a set of years and a list of discrete
    adjustments. The yearlyadj array will become the source for the curve for the
    graph for the entire range (1400–1994), using linear interpolation, essentially
    connecting the dots. Subsequently, yearly adjusted numbers are added to the densall
    data.


    # Extreme Climate


    In 2009, this computer source code, along with other documents and a bundle of
    thousands of emails and other documents, was leaked to the public and repost on
    the internet, bringing what had previously been code developed in the context
    of a research group before an that was ignorant of its context, including a group
    of readers who were deeply suspicious of its programmers'' motives. So began an
    episode as the Climate Research Unit email controversy, or Climategate, the -gate
    suffix commonly appended to political scandals in the United States since Watergate.
    This source code began as a working document, an in-progress visualization tool
    that had been circulated among all researchers working on the same problem at
    the same institution, the Climate Research Unit (CRU) of East Anglia in the United
    Kingdom. How, its meaning changed as it was passed into the hands of a group for
    whom the code would become if not not the smoking gun of the deception of climate
    change science, at least a political football. With its significance in play,
    it was tossed around by pundits on message boards and news outlets, where mattered
    most was not its presence as a stopgap but the digital deception seemed to represent
    and even acknowledge in its very comments. The discussions that followed, though
    driven by misreading the intent of the code, gave this a new meaning that would
    shape its significance thereafter, demonstrating another way that code accrues
    meaning through its circulation.


    To understand the story of this code, it is worth remembering the political climate
    of the time. The year 2009 in the United States was an intense moment in the culture
    wars over climate change, largely due to a change in the political landscape.
    President George W. Bush, son of President George H. Bush, whose family''s fortunes
    had'
