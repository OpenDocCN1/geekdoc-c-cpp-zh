    What makes FLOW-MATIC deceptively legible to someone who knows English is the
    use of what linguists call false cognates. These are words in a second language
    that resemble in the first but mean something different. In a language instruction
    class, they are pointed out as imposters, deicely to confuse the second learner.
    Arguably, most English tokens in programming languages are false cognates because
    words in code simply do not behave the way they do in spoken or written language,
    except through the use of metaphor, as in performative language as framed by J.
    L. Austin (discussed in chapter 1). Mathematical operators may be the closest
    (plus +) to their natural language equivalents, but in a computational system
    as opposed to a system of spoken or written discourse. Confusion has led Ben Allen
    to speculate that rather than call this a “higher-level language”, a better classification
    of FLOWMATIC be “pseudocode in English” (Marino 2014). Perhaps assembly’s formulation
    of code as mnemonics captures the sense of those tokens that are built to help
    humans remember what they do.


