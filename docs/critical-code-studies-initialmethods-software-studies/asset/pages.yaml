  md: 'They could generate endless lists of beer names or tiny protests. They could
    be used to generate whole novels. It all depends on what one counts as Taroko
    Gorge. What are its specifications? Is it a generator of infinite variations of
    the ABBA-C pattern? Or is it one in a long line of text generators, the grandchildren
    of which, like Siri and Alexa to ELIZA, may be unrecognizable (and abhorrent)
    to the designer of their grandmother.


    For the purposes of this book, Taroko Gorge stands as an example of this new literary
    moment, one in which poet programmers engage with language in and through their
    code, generating poetry while producing works of art in code that invite exploration
    whether through reading, execution, or remixing. Regardless of where it stands
    in the ELIZA challenge, Taroko Gorge has succeeded in drawing poet-programmers
    to play with its code as a possibility space of its own. Critical code studies
    invites readers to reflect on this code, exploring not just what it does, but
    what it means.'
