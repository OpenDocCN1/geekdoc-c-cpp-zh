  md: '# Supporting Research in the Digital Humanities


    The question, ultimately, is not how to get English majors coding or even what
    the programming world can learn from the arts and humanities—but what would a
    university be like without this unnecessary border between two disciplinary clusters
    that have so much to offer one another?


    Although it may seem that we have been promoting methods for critical code studies
    in contrast to or distinct from other approaches, these methods are more fully
    developed, demonstrated, and established, they can serve to support other, larger
    studies in the digital humanities. In other words, a code studies approach can
    complement a reading of a digital object that includes attention to hardware,
    software, and other systems.


    Consider, for example, the supporting role CCS played in the Reading Project (Pressman,
    Marino, and Douglass 2015), in which two other scholars, Jessica Pressman and
    Jeremy Douglass, joined me for a collaborative exploration of one of digital literature.
    Rather than taking the center of that discussion, the code reading insights and
    answers, as well as new questions, in the larger investigation, contributing to
    the overall interpretation. Critical code studies is not meant to be an ends in
