  md: '# 1 Introduction


    # Code Heard ‘round the World


    ```

    if n_elements(yrloc) ne n_elements(valadj) then message, ''Oooops!''

    --briff_sep98_e.pro

    ```


    Who reads computer source code, and what does it mean to them? Pundits and poets,
    hackactivists and humanities professors, lawyers and laypeople—far more than just
    programmers are reading code for a wide range of reasons. Whether finding Easter
    eggs or getting a whiff of code smells, seeking aesthetic pleasure or searching
    for ways they have been manipulated, the curious sense code. If we are going to
    take up this communal practice of reading code, we must read critically, the way
    we read code is just as important as the fact that we are reading code. Consider
    the following example.


    In 2009, emails from the Climate Research Unit (CRU) of England’s University East
    Anglia seemed to have a smoking gun to climate change deniers, proof that climate
    change is a fabrication. These emails included code used to model climate change,
    and the comments in that code seemed to indicate a manipulation of the data. So,
    the blogosphere was buzzing with quotations from the code, particularly from a
    file called Harris_Read_Me, named for its programmer, Ian Harris, who collaborated
    with Keith Briffen on the code. As he attempts to document his progress, making
    sense of and reconciling the various data, Harris writes in the code comments,
    “What the hell is supposed to happen here? Yeah—there is no ‘supposed,’ I can
    make it up. So I have : :).


    Other comments throughout the leaked files express the frustrations of a programmer
    as he complains about the lengths to which he has to go to reconcile conflicting'
