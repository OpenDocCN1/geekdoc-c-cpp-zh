    # There Is No Software, Except ...


    Friedrich Kittler is the media theorist known for his provocative declaration
    titling his essay “There Is No Software” (1992), in which he makes the argument
    that code is a kind of illusion, for the end, everything in code is reduced to
    electronic signals. Given that position, it might be surprising to have a chapter
    of this book devoted to the analysis of his computer code, which he reportedly
    wrote over one hundred thousand lines (Parikka and Feigfeld 2015). What happens
    when the man for whom there is no software writes code? One scholar, his assistant
    Paul Feigfeld, calls Kittler a liar for making that claim—but in the sense of
    Odysseus, more of a trickster in the face of myopic, or cyclic, a provocation
    meant to help readers to see a point about the “materiality behind the code” (2013,
    1). Therefore, rather than dwelling on irony, through the exposition of Kittler’s
    code, he traces a reciprocal process through which influential media used code
    as a means to explore technology to inform his theoretical writing, and, subsequently,
    exploration in and through code shaped what he theorized. Furthermore, I will
    argue that for Kittler, programming was a kind of theorizing, an activity of philosophical
    labor, interfacing with a machine and tracing ideas by expressing them in code.


    Following in the footsteps of the philosophers he idealized, Kittler used code
    to understand the physics, mathematics, and programming of the media forms he
    was interpreting. Once, when giving a lecture on the evolution of programming
    languages (Kittler 2011a), as he explains the history of computing, Kittler stops
    of extensively on computer languages because, as he admitted, he had never developed
    one. Such was his sense that to understand a medium was to understand its most
    intricate workings. To build was to know. Although he may not have built from
    scratch a gramophone, film projector, or typewriter, the subjects of one his most
    famous works, he showed a dedication to understanding intimately the workings
    of the'
