  md: '# 110


    # Chapter 4


    # Notes


    +   1: A semicolon (;;) precedes comments in IDL. Also, John Graham-Cumming (2009)
    offers a useful gloss of this code on his blog.


    +   2: MXD is maximum leeway density, a correlate of regional temperature. Hugershoff
    refers to the Hugershoff function (Warren 1980).


    +   7: The phrase "a very artificial correction" became the smoking gun of data
    manipulation. But as one commentator noted,"Certainly if I wanted to actually
    fudge something without anyone knowing, a 15-star comment wouldn''t be my first
    thought" (Clark 2006).


    +   9: Creates the list (a.k.a. vector) [1400, 1900, 1909, 1914, 1919, 1924, 1929,
    1934, 1939, 1944, 1949, 1954, 1959, 1964, 1969, 1979, 1984, 1989, 1994]. Findgen
    creates a floating-point array of the dimensions. Note that this array is declared
    without static typing, arguably a weakness in IDL.


    +   10: Here are the adjustments: from 1929–1934, 1944, then increasingly upward
    after 1949, plateauing at a +2.6 adjustment from 1974–1994. Each number is multiplied
    by 0.75. As noted in chapter 1, these magic numbers (i.e., unnamed constants)
    are not further documented in the code, they give off an air of arbitrariness.


    +   11: The fudge factor is offset to correct the data. This phrase alone fueled
    much of the Climategate controversy.


    +   12: If the sizes of the arrays do not match, display an error message. However,
    do doubt the use of "Ooops" was also read as signaling a larger error—and perhaps,
    too, a la attitude towards the code.


    +   14: Load color table 39 ("rainbow and white") for the color palette (0, 1).


    +   17: multi_plot,nrow=4,layout=''large''.nrow is the number of rows in the graph.
    multi_plot is the method. This line extends the way IDL dictates the method from
    the arguments by position only, one of the complaints about the language. In one
    critic''s words, "It''s gross and I don''t see any reason it should be structured
    differently from function calls, which take a more typical name(arg, style)" (Elliott
    2014).


    +   21: endif if the first condition, just as elelse and else.


    +   24: See 21.


    +   28: Restores the variables from the reglists file.


    +   29: This array contains the following regions: northwest Canada, West America,
    central Canada, northwest Europe, southwest Europe, north Siberia, central Siberia,
    Tibetan plateau, east Siberia, and all sites (Briffa et al. 2001). The name harryfn
    most likely refers to Ian "Harry" Harris, one of the programmers (with fn possibly
    referring to file name).'
