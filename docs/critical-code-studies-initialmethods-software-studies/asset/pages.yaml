    # Code Is More than a Static Text


    One of the problems with analyzing code is that its written expression represents
    only its static form before it has been processed. Code is at once what it is
    and what it does. That is not necessarily the same as saying that code is performative
    language in Austin''s sense, rather to say that the code represents a form of
    its existence before it is processed by the machine, whether it is compiled or
    not. As Wendy Chun (2011) has pointed out, the source code is not the same as
    the executable file. That said, the study of code requires not only reading the
    symbols but watching changes in state to software and hardware over a duration
    of time in dynamic engagement with other systems, including humans.


    Evan Russell has been developing tools for annotating the state of a software
    system when it occurs, which gives the critic/reader/operator the ability to consider
    the code in action, which we can also call the *software*. From a software studies
    point of view, such tools allow the reader to identify the state of the software
    in action. However, I consider this a principal aspect to reading the code because
    this state has been caused by the interaction of the encoded symbols with the
    system. Such readings of code in action are necessary due to the complexity of
    the interaction between the running code and the system (or other systems)—a complexity
    that often leads to states that cannot be easily predicted.


    Consider, contrast. The individual frames of a film (on celluloid) interact with
    any projector in predictable ways. There are certain variations in projects (bulb
    brightness, motor speed due to wear); however, those variations are comparatively
    minimal. The action of the machine on the medium, shining a light through the
    celluloid, does not vary. When needed by some unpredictable outside element, code
    also produces a predictable set of effects when processed. Nevertheless, the sheer
    complexity of the system makes it difficult to predict—one reason debugging is
    such a key of programming. The operation of the machine upon the medium is not
    a straightforward activity, like the projection of film, but instead a set of
    interoperating processes enacted through and upon hardware. For this reason, analyzing
    code includes interpretation in the Saussurian sense of the signs and signifiers,
    but also analysis of this constantly shifting understanding of state.'
