  md: '# 4 Chapter 1


    the algorithms based on their effects. As Noble writes, “Knowledge of the technical
    aspects of search and retrieval, in terms of critiquing the computer programming
    code that underlies the systems, is absolutely necessary to have a profound impact
    on these systems” (2018, 26). Although the code bases for many proprietary systems
    are inaccessible to us, an analysis of algorithms can go further through an analysis
    of the code.


    Without access to the code, because it is proprietary or generated on the fly,
    in the case of some machine-learning algorithms, analysts can only comment on
    the apparent operations of the code based on its effects. The operations of the
    code are left in the hands of those who access it, usually those who have made
    or maintain it, and those who can read it. If code goes so much of our lives,
    then to understand its operations is to get some sense of the systems that operate
    on us. If we leave the hierarchies to the researchers, then we are all of unknown
    and unseen processes. That drove drove communities to pour through the leaked
    climate code—and led to misread it. This demonstrates that it is not enough to
    understand what code does fully considering what it means.


    Like other systems of signification, code does not signify in any transparent
    or reducible way. And code has so many interoperating systems, human and machine-based,
    proliferates in code. To the programmer, this fudge factor may have been a temporary
    patch in the pursuit of anomalies in the data, marking the code to bracket a question
    he wished to pursue later. However, read by a different audience and from a more
    suspicious perspective, that temporary solution becomes ought deception. An editorial
    in the magazine Nature claimed, “One lesson that must be taken from Climategate
    that scientists do not define the terms by which others them see and their place
    in society” (Closing the Climategate 2010). The same can be said for code. Its
    meaning is determined not only by the programmer’s intention or by the operations
    it triggers but also by how it is received and recirculated. The history of the
    misinterpretations of the Climategate code becomes part of its overall meaning.


    That is not to argue that code can be removed from context (though portions of
    code are frequently recontextualized) or that code means whatever people say it
    means. Rather, the meaning of code is contingent upon and subject to the rhetorical
    trial of speaker, audience (both human and machine), and message. Although even
    classical trial is a bit poor when explaining a system of communication that is
    to varying degrees tied to hardware, other software, and state. In the process
    of its circulation, the meaning of code changes beyond its functional role to
    include connotations'
