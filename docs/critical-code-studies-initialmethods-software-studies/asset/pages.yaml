  md: '18 Spivak, Chapter 1


    Giyatri, whose seminal essay "Can the Subaltern Speak?" (1994) theorized those
    without power, outside the cultural hegemony, cannot speak unless they can represent
    themselves. Women programmers would not constitute a subaltern according to Spivak''s
    definition because they have too much access to the tools of power. However, her
    theorizations of power and speech illuminate the dynamics at play in the significance
    of this code. In the global economy, female programmers born outside of first-world,
    Western countries, though part of a professional, educated class and living elsewhere,
    such as Europe or the United States, have lower status and frequently lower pay
    than their male counterparts, especially from more privileged economies, such
    as the United States. Arguably, by speaking in code, both the protest sign and
    the web page offer examples of women representing themselves. Although this is
    not the place for a full elaboration on Risam or Spivak''s theories, this example
    offers one of the ways outside heuristics—in this case—can inform our code-reading
    practices.


    I call the act of interpreting culture through computer source code *critical
    code studies*, and in this book I will characterize but not limit its methods
    primarily through a series of case studies. Critical code studies names a stance
    toward code as a unique semantic of discourse, the meaning of which requires specific
    techniques that are still being developed, as the natures of code and programming
    are rapidly evolving. In other words, code is a unique milieu that operates, but
    is still distinct from, forms of communication primarily due to its relation to
    hardware and other software systems.


    Critical code studies names the methods and the scholarship of those involved
    in the analysis of the extrafunctional significance of source code, and this book
    offers a collection of case studies to demonstrate some of its potential.


    # The Origins of Critical Code Studies


    Critical code studies grew out of a desire to read digital objects with more attention
    to their unique construction.


    In 2004, when I was analyzing conversation agents, and chatbots, such as ELIZA,
    I was trying to find a way to perform what N. Katherine Hayles (Hayles and Burdock
    (2002)) and Lev Manovich were calling *media-specific analysis*. What were the
    unique properties of conversation agents? What made analyzing them different from
    other digital or print objects? Soon it became obvious: the code. How does one
    read code? In my search for answers, I found a few who wrote about the ontology
    of computer source code. Kittler (1992) had written a bit. Lawrence Lessig (2006)'
