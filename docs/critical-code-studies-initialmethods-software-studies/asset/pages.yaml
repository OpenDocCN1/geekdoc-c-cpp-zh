  md: '# 2 Critical Code Studies: A Manifesto


    Hello, World


    “Hello, World” is one of the first programs that students customarily write in
    a programming language they are attempting to learn. The program, usually only
    a few lines of code, causes the computer to output a greeting, as if it were speaking.
    The LISP (list-processing language) version of such a program, for example, looks
    like this:


    ```

    (DEFUN HELLO-WORLD ()

    (PRINT (LIST ''HELLO ''WORLD )))

    ```


    DEFUN defines the function HELLO-WORLD (with no set arguments). As a result, the
    computer will speak its greeting to the world in our natural language. What could
    be a more appropriate language for this activity than LISP; a family of algebraic
    processing languages developed for artificial intelligence McCarthy(1978)? In
    this simple program, the computer comes to life in natural language, speaking
    to us.


    But of course, the computer does not understand what it says. Literally speaking,
    the computer does not even interpret code. When the function is called, the computer
    will print (output) the list of the two atoms (as symbolic units are called in
    LISP) Hello and World. The single quotation marks tell the computer not to interpret
    the words Hello and World (much like the italics in this sentence). With this
    distinction, language becomes divided between the operational code and data. The
    computer here merely shuffles the words as many strings of data, unconcerned about
    the contents. It does not interpret but only those strings. However, those words
    in quotation marks are significant to us, the humans who read the code. Hello
    and World have significance, just as the function name PRINT has a significance
    that goes far beyond its instructions to the computer and gestures toward a material
    culture of ink and writing'
