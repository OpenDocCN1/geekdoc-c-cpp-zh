    # FLOW-MATIC


    Grace Hopper and her team developed FLOW-MATIC (a.k.a. B-0 or B-Zero) in the mid-1950s
    as an alternative to MATH-MATIC and FORTRAN. The name is a portmanteau that combines
    the flow of flowcharts with the mathematic of automatic, a latter suffix of the
    1950s. As one brochure for the language advertised: "The English-like pseudo-code
    of Flow-Matic causes the Univac system to automatically compile and write its
    own compiler code. Thus, both flowcharts and codes are more intelligible to the
    non-programmer as well as to the programmer" (Remington 1957). The order of the
    intended audiences (i.e., nonprogrammers first) in that last sentence was primary.
    In History of Programming Languages, Richard Wexelblatt (1981) classifies MATH-MATIC
    and FORTRAN as scientific, numeric-oriented languages and FLOW-MATIC as a business,
    data-processing language. More notably as FORTRAN’s tokens emerged from the symbolic
    representation of mathematics and science, FLOWMATIC drew from English, for which
    the primary customers of Remington was the language of business (Remington 1957).
    However, the distance between the appearance of English and the processing of
    natural language offers a valuable lesson in the dangerous temptation to read
    code by merely imposing reading strategies from other semiotic systems.


    Throughout her work, Grace Hopper hammered "the dull labor of writing and checking
    programs" (1952, 243). However, harder than dealing with programs apparently was
    convincing business managers and other supervisors to learn to read programs.
    Hopper developed FLOW-MATIC out of her experience with two different potential
    users of programming languages. As she explained in interview, "One was people
    who liked using symbols—mathematicians and people like that. There was another
    bunch of people who were in data processing who hated symbols, and wanted words,
    word-oriented people very definitely. And that was the reason I thought we needed'
