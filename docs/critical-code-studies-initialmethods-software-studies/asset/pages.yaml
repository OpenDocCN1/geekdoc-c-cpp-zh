    reading) in his dissertation. Or a more granular level, code can have white space
    that is significant or insignificant. Code also has qualities: clarity versus
    obfuscation, verbosity versus concise, elegance versus sloppiness. Most recent
    explorations have turned to the ethics embedded in the code—for the potential
    for destructive bias in AI. In these cases, code can write other code, which,
    as Catherine Griffiths (2018) has argued, can be inaccessible to human readers,
    but might be more effectively rendered for examination through visualizations.


