    one another. The Critical Code Studies Working Groups are premised on the collective
    readings of code with the understanding of the multiplicity of intellectual backgrounds
    and perspectives necessary to unpack the meaning of code. Consider, for example,
    the collective annotation of the code for Adventure that was performed in the
    2010 Critical Code Studies Working Group (Jerz 2011) or 10 PRINT (Montfort et
    al. 2013), a book in which ten scholars examined one line of code. Critical code
    studies benefits not from just many eyes on the same code but from many lenses
    and many perspectives. the biannial Code Studies Working Group offers one place
    for collective code reading, and teams are working on tools for the collective
    annotation of code, such as ANVC Scalar and ACLS Workbench (see, e.g., Pressman,
    Marino, and Douglass 2015, 145), which will help collectives read code together.


    # Research Programming Language


    Like any textual study, the better scholars understand the language and its origins,
    the better they will understand the code. Those languages, rooted in intellectual
    histories, are informed by paradigms, such as imperative and declarative structure,
    aesthetics, and temporal contexts. By the time you are reading this book, no doubt
    will be there many new paradigms to explore. With any semiotic analysis, the signs
    have meaning through their relation to the full language.


    # Research Its Circulation


    As with any cultural text, interpretation does not change the object but change
    its significance. As we saw in the case of Climategate, the meaning of code changes
    as new groups encounter and interpret it. That said, because any body of code
    can be made of many diverse parts, each of its elements may have its own history,
    as in the case of the matrix operations in Kittler''s assembly. Knowing more about
    these histories can only enrich the reader''s understanding of the meaning of
    code.


    # Apply a Critical Lens


    The chief characteristic that differentiates critical code studies from other
    science and technology studies is its emphasis on theoretical approaches or hermeneutics
    from the humanities. I list this even though the use of lenses (if not the conscious
    choice of them) precedes the process of inquiry, not to mention that each stepping
    is mediated by ideology. In the world of media and literary studies, these are
    constituted by the widely varied interpretive practices that generally have their
    roots in philosophy, as well as linguistics, anthropology, and beyond. Critical
    theory generally challenges, at times'
