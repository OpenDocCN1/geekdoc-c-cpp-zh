  md: 'In a thread on the 2014 Critical Code Studies Working Group website (Marino
    2014), Evan Buswell takes up this notion, “I suppose if you get a few steps below
    that, low-level enough that you are talking about physical processes, then indeed,
    an electron zipping across a PN junction is a language only through metaphor.
    But then, it might be the kind of metaphor where the following glowing dots your
    screen are a metaphor for the number zero: 0.” Following similar lines to Kittler,
    Buswell follows the code to the level of electrical signals. However, rather than
    seeing that the end of language, Buswell sees another form of language. As he
    goes on to explain, “I’m not sure what to make of this slight retreat from code-as-language
    ... but I’ll be taking the side that it is linguistic the way down, and in fact
    that it is pretty much the entire point of code. Code as a method to control electromechanical
    systems is secondary; there could be and were previously ways to do this that
    didn’t involve code (which of would be 100 times faster than the code method implemented
    today).


    I raise this example not to argue that Kittler is somehow wrong about the nature
    of code, but to argue the linguistic or symbolic form, and hence meaning, does
    not disappear at the moment those symbols displayed to the programmer turn into
    electrical signals. Instead, I would argue alongside Buswell, that signals are
    a material of communication, no less meaningful by their lack of additional symbolic
    representation. It is not the representational symbols that qualify code as language,
    but the system allows us to use them in meaningful ways. In such a reading is
    particularly Kittler, in what he sees the structures of languages all the way
    up and down the hierarchy. I am arguing that the electronic signals have been
    placed within a system of language and in this way have been rendered meaningful.


    These layers of signification then proliferate on the level of hardware, code,
    and running software. That makes Kittler’s work not alone and on continuous with
    his larger project that traces the movement of language, particularly printed
    language, from the sole domain of the hierarchy, particularly the religious monasteries,
    to the commoners. For Kittler to develop knowledge, perhaps literacy, in the use
    of code is to transgress the walls of the abbey, to trace the lines of light like
    Descartes, in the language of the monks: programmers.


    If reading and writing are fundamental to subject formation in the age of letters,
    so is to the reading and writing of code in the age of digital machines. Fundamental
    to early programming languages, Kittler reminds us, were expressions that directed
    the machine to read and write. Notably, when making this remark Kittler performs
    a bit of code analysis himself, noting that English—unlike, that Latin—can tolerate
    “context-free verbal units” that can stand alone, unconjugated (i.e., read and
    write).'
