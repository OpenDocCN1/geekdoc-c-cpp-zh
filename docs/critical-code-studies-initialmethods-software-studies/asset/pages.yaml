    # Generic Poetry Generators


    Before exploring code that forms (and is) poetry, let us reflect on pervasive
    poetic forms, such as the sonnet. The sonnet has been around for centuries. Petrarch
    wrote sonnets. Shakespeare wrote sonnets. Different forms, of course, but sonnets
    nonetheless. By now there are probably enough sonnets to wallpaper Westminster
    Abbey several times over. Haiku is an older and (deceptively) simpler form. To
    number haiku would be to sit on James Joyce''s immortalized Fountain beach, counting
    grains of sand. These poetic forms are mostly a set of formal constraints and
    conventions, yet when animated by generations of artistic minds of varying linguistic
    and cultural backgrounds, those restrictions, these boundaries, prove to be highly
    generative.


    Of course, the quest to create new poetic forms has likewise produced its own
    beastiary. In, the challenge to create a new form has been so attractive that
    poetry collectives like the Ouvoir de Litterature (Oulipo) have made the creation
    of new forms, or Synthoulism, their primary raison d’être. As Oulian Raymond Quneau
    explained, “We call potential literature the search for new forms and structures
    that may be used by writers in any way they see fit” (quoted in Wolff 2007). Obviously
    creating a new form is one task, but convincing others to use that form is another.
    Enter onto which digital computers, engines of procedural creation, and the potential
    for the creation of new poems has increased beyond measure, for a computer program
    can create a new poetic form and then iterate that form ad infinitum.'
