  md: "# Introduction\n\nCode is a meaningful measure of a job candidate's abilities\
    \ and predilections because code communicates more than merely its functionality;\
    \ as an interdependent object circulating through culture, it amasses even more\
    \ meaning. The examples from the job interview situation were hypothetical but\
    \ typical. Once we return our attention to the real world with a history of revision\
    \ and correction, fudging, functioning or failing, we have even more to discuss-or,\
    \ as we say in the humanities, to unpack. Alan J. Perlis writes in the foreword\
    \ to Harold Abelson and Gerald Jay Sussman's foundational Structure and Interpretation\
    \ of Computer Programs, \"Every computer program is a model, hatched in the mind,\
    \ of a real process. These processes, arising from human experience and thought,\
    \ are huge in scale, intricate in detail, and at any time only partially understood\"\
    \ (1996, xi). Unpacking the meaning of these programs locked in their technosocial\
    \ context is the job of critical code studies (CCS).\n\n# Protesting in Code\n\
    \nCode holds a meaning, and growing out of, what it does. That meaning not necessarily\
    \ depend on code authors intending to communicate something to an audience beyond\
    \ themselves, as in the case of code comments. Consider two rather different examples.\n\
    \nIn the summer of 2011, at a political protest in India, a young woman appearing\
    \ in a photograph that was later shared on the online discussion board Reddit\
    \ holds a sign (figure 1.1), which reads:\n\n```\n#include <india.h>\n#include\
    \ <jan lokpal bill.h>\n#include <students.h>\nvoid main() {\n  do\n{\n    no_of_indians++;\n\
    \    printf(\"Protest continues.\");\n  } while (lokpal bill not passed);\n  printf(\"\
    Corruption free India\");\n  getch();\n}\n```"
