  md: '# Step 5.


    Finally, the data stored in the SSPBUF register is ready for use and should be
    moved to a desired register.


    # I²C MODE


    I²C mode (Inter IC Bus) is especially suitable when the microcontroller and an
    integrated circuit, which the microcontrollers should exchange data, with are
    within the same device. It is usually another microcontroller or specialized,
    cheap integrated circuits belonging to the new generation of called ''smart peripheral
    components'' (memories, temperature sensors, real-time clocks etc.).


    Similar to serial communication in SPI mode, data transfer in I²C mode is synchronous
    and bidirectional. This only two pins are used for data transmission. These are
    the SDA (Serial Data) and SCL (Serial Clock) pins. The user must configure these
    pins as inputs or outputs through TRISC bits.


    By observing particular rules (protocols), this mode enables to 122 different
    components to be simultaneously connected in a simple way by using only two valuable
    I/O pins. Let''s take a look at how it works:


    Clock, necessary to synchronize the operation of both devices, is always generated
    by a master device (a microcontroller) and its frequency directly affects the
    baud rate. Even though there is a protocol allowing 3,4 MHz clock frequency (so
    called highspeed I²C bus), this book covers the most frequently used protocol
    the clock frequency of which is limited to 100 Khz. Minimum frequency is not limited.


    When master and slave components are synchronized by the clock, when enabled,
    every data exchange is always initiated by the master. Once the MSSP module has
    been enabled, it waits for a Start condition to occur. The master device first
    sends the START bit (logic zero) through the SDA pin, then a 7-bit address of
    the selected slave device, and finally, the bit which requires data (0) or read
    (1) to the device. In other words, the bit are shifted to the SSPSR following
    the start condition. All slave devices sharing the same transmission line will
    simultaneously receive the first byte, but only one of them has the master to
    match and receive the whole data.


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_178_0.png)'
  merge: -1
  pgno: 178
- img_proc: true
  md: 'Once the first byte has been sent (only 8-bit data are transmitted), master
    goes into receive mode and waits for acknowledgment from the receive device that
    address match has occurred. If the slave device senses acknowledge bit (1), data
    transfer will be continued until the master device (microcontroller) sends the
    Stop bit.


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_179_0.png)


    The simplest explanation of how two components communicate. Such a microcontroller
    is also capable of controlling more complicated situations when 1024 different
    components (10-bit address), shared by several different master devices, are connected.
    Such devices are rarely used in practice and there is no need to discuss them
    at greater length.


