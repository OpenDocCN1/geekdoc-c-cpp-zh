    # PINOUT DESCRIPTION


    Most pins of the PIC16F887 microcontroller are multi-functional as seen in figure
    above. For example, designator RA3/AN3/Vref+/C1IN+ for the fifth pin of the microcontroller
    indicates that it has the following functions:


    +   * RA3 Port A Third digital input/output

    * AN3 Third analog input

    * Vref+ Positive voltage reference

    * C1IN+ Comparator C1 positive input


    Such functionality is very useful as it makes the microcontroller package more
    compact without affecting its operation. The various pin functions cannot be used
    simultaneously, but can be changed at any point during operation.


    The following tables refer to the PDIP 40 microcontroller.'
