    # EEPROM MEMORY


    Similar to program memory, the contents of EEPROM is permanently saved, even when
    the power goes off. However, unlike ROM, the contents of EEPROM can be changed
    during the operation of the microcontroller. This is why this memory (256 locations)
    is perfect for permanently saving some of the results created and used during
    the operation.


    # RAM MEMORY


    This is the third and the most complex part of microcontroller memory. In this
    case, it consists of two parts: general-purpose registers and special-function
    registers (SFR). All these registers are divided in four memory banks to be explained
    later in the chapter.


    Even though both groups of registers are cleared when power goes off and even
    though they are manufactured in the same manner and act in a similar way, their
    functions do not have many things in common.'
