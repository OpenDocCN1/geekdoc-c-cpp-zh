  md: "# 3.2 CORE SFRS\n\nThe following text describes the core SFRs of the PIC16F887\
    \ microcontroller. Bits of each of these registers control different circuits\
    \ within the chip, so that it is not possible to classify them in some special\
    \ groups. For this reason, they are described along with the processes they are\
    \ in control.\n\n# STATUS Register\n\n| R/W (0) | R/W (0) | R/W (0) | R (1) |\
    \ R (1) | R/W (x) | R/W (x) | R/W (x) | Features |\n| --- | --- | --- | --- |\
    \ --- | --- | --- | --- | --- |\n| STATUS | IRP | RP1 | RP0 | TO | PD | Z | DC\
    \ | C | Bit name |\n| | Bit 7 | Bit 6 | Bit 5 | Bit 4 | Bit 3 | Bit 2 | Bit 1\
    \ | Bit 0 |\n\nThe STATUS register carries: the arithmetic status of data in the\
    \ W register, the RESET status and bank select bits for data memory.\n\n+   -\
    \ IRP - Selects register bank. It is used for indirect addressing.\n  - 1 - Banks\
    \ 0 and 1 are active (memory locations 000h-FFH)\n  - 0 - Banks 2 and 3 are active\
    \ (memory locations 100h-1FFH)\n- RP1,RP0 - Bits select register bank. They are\
    \ used for direct addressing.\n\n| RP1 | RP0 | ACTIVE BANK |\n| --- | --- | ---\
    \ |\n| 0 | 0 | Bank0 |\n| 0 | 1 | Bank1 |\n| 1 | 0 | Bank2 |\n| 1 | 1 | Bank3\
    \ |\n\n+   - TO - Time-out bit.\n  - 1 - After power-on, executing the CLRWDT\
    \ instruction which resets the watchdog timer or the SLEEP instruction which sets\
    \ the microcontroller into low-consumption mode.\n  - 0 - After watch-dog time-out\
    \ has occurred.\n\n+   - PD - Power-down bit.\n  - 1 - After power-on or executing\
    \ the CLRWDT instruction which resets the watchdog timer.\n  - 0 - After executing\
    \ the SLEEP instruction which sets the microcontroller into low-consumption mode.\n\
    \n+   - Z - Zero bit\n  - 1 - The result of an arithmetic or logic operation is\
    \ zero.\n  - 0 - The result of an arithmetic or logic operation is different from\
    \ zero.\n\n+   - DC - Digit/carry/borrow bit is changed during addition and subtraction\
    \ if an 'overflow' or a 'borrow' of the result occurs.\n  - 1 - A carry-out from\
    \ the 4th low-order bit of the result has occurred.\n  - 0 - No carry-out from\
    \ the 4th low-order bit of the result has occurred."
