    # In Short


    In order to use TMR0 properly, it is necessary:


    # Step 1: To select mode:


    +   - Timer mode is selected by the TOCS bit of the OPTION_REG register, (TOCS:
    0=timer, 1=counter).

    - When used, the prescaler should be assigned to the timer/counter by clearing
    the PSA bit of the OPTION_REG register. The prescaler rate is set by using the
    PS2-PS0 bits of the same register.

    - When used with interrupt, the GIE and TMR0IE bits of the INTCON register should
    be set.


    # Step 2: Measuring and Counting


    To measure time:


    +   - Reset the TMR0 register or write some known value to it.

    - Elapsed time (in microseconds using 4MHz quartz) is measured by reading the
    TMR0 register.

    - The flag bit TMR0IF of the INTCON register is automatically set every time the
    TMR0 register overflows. If enabled, an interrupt occurs.


    # To count pulses:


    +   - The polarity of pulses is to counted on the RA4 pin is selected by the TOSE
    bit of the OPTION_REG register (TOSE: 0=positive, 1=negative pulses).

    - Number of pulses may be read from the TMR0 register. The prescaler and interrupt
    are used in the same manner as in timer mode.


    # 3.5 TIMER TMR1


    Timer TMR1 is a 16-bit timer/counter, which means that it consists of two registers
    (TMR1L and TMR1H). It can count up 65.535 pulses in a single cycle, i.e. before
    the counting starts from zero.


    # 16-bit counter register


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_127_0.png)


    www.raguvaran.pzl.com'
