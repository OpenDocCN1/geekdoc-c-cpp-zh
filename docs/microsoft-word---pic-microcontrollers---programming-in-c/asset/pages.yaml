    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_71_0.png)


    The simulator and debugger have the same function to monitor the state of registers
    during program execution. The difference is that the simulator executes the program
    on the PC, while the debugger uses a true microcontroller. Any change of a pin
    logic state is reflected on appropriate register (port). As the Watch Window allows
    you to monitor the state of all registers it is easy to check whether a pin is
    set to zero or one. In order to activate this window it is necessary to select
    View/Windows and click the Watch Values option. Then you can make a list of registers
    the state of which you want to monitor.


