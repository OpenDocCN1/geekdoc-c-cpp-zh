    # UART (UNIVERSAL ASYNCHRONOUS RECEIVER/TRANSMITTER)


    This sort of communication is asynchronous, which means that a special line for
    transferring clock signal is not used. In some applications, such as radio connection
    or infrared waves remote control, this feature is crucial. Since only one communication
    line is used, both receiver and transmitter operate at the same predefined rate
    in order to maintain necessary synchronization. This is a very simple way of transferring
    data since it basically represents the conversion of 8-bit data from parallel
    to serial format. Baud rate is not high, up to 1 Mbit/sec.


