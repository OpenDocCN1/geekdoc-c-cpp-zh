    # MARKING NUMBERS


    Hexadecimal number system is along with binary and decimal systems considered
    to be the most important number system for us. It is easy to make is easy to remember
    it. However, these conversions may cause confusion. For example, what does the
    sentence ''It is necessary to count up 110 products on the assembly line'' actually
    mean? Depending on whether it is binary, decimal or hexadecimal system, the result
    could be 6, 110 or 272 products, respectively! Accordingly, in order to avoid
    misunderstanding, definite prefixes and suffixes are directly added to the numbers.
    The prefix $ or 0x as the suffix h marks the numbers in hexadecimal system. For
    example, the hexadecimal number 10AF may be $10AF, 0x10AF or 10AFh. Similarly,
    binary numbers usually get the prefix % or 0b. If a number has neither suffix
    nor prefix it is considered decimal. Unfortunately, this way of marking numbers
    is not standardized, thus depends on concrete application.


    # BIT


    Theory says a bit is the basic unit of information...Let''s forget for a moment
    and take a look at what it is in practice. The answer is- nothing special: a bit
    is just a binary digit. Similar to decimal number system in which digits of a
    number do not have the same value (for example digits in the decimal number 444
    are the same, but have different values), the ''significance'' of bit depends
    on its position in the binary number. Since there is no point talking about units,
    etc etc. in binary numbers, their digits are referred to as the zero bit (rightmost
    bit), first bit (second from the right) etc. In addition, since the binary system
    uses two digits (0 and 1), the value of one bit can be either zero or 1.


