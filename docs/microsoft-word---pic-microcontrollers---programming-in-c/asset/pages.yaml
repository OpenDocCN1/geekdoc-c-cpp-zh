    # BUS


    A bus consists of 8, 16 or more wires. There are two types of buses: the address
    bus and the data bus. The address bus consists of as many lines as necessary for
    memory addressing. It is used to transmit address from the CPU to the memory.
    The data bus is as wide as the data, in our case it is 8 bits or more wires. It
    is used to connect all the circuits within the microcontroller.


    # SERIAL COMMUNICATION


    Parallel connection between the microcontroller and peripherals via input/output
    ports is the ideal solution on shorter distances up to several meters. However,
    in other cases when it is necessary to establish communication between two devices
    on longer distances it is not possible to use parallel connection. Instead, serial
    communication is used.


    Today, most microcontrollers have built in several different systems for serial
    communication as a standard equipment. Which of these systems will be used depends
    on many factors of which the most important are:


    +   * How many devices the microcontroller has to exchange data?

    * How fast the data exchange has to be?

    * What is the distance between devices?

    * Is it necessary to send and receive data simultaneously?'
