    # INTERNAL ARCHITECTURE


    All upgraded microcontrollers use one of two basic design models called Harvard
    and von-Neumann architecture.


    They represent two different ways of exchanging data between CPU and memory.


    # VON-NEUMANN ARCHITECTURE


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_26_1.png)


    Microcontrollers using von-Neumann architecture have only one memory block and
    one 8-bit data bus. as all data are exchanged through these 8 lines, the bus is
    overloaded and communication is very slow and inefficient. The CPU can either
    read an instruction or read/write data from/to the memory. Both cannot occur at
    the same time since instructions and data use the same bus. For example, if a
    program line reads that RAM memory register called ''SUM'' should be incremented
    by one (instruction: inc SUM), the microcontroller will do the following:


    +   1. Read the part of the program instruction specifying WHAT should be done
    (in this case it is the ''inc'' for increment).

    2. Read the other part of the same instruction specifying upon WHICH data it should
    be performed (in this case it is the ''SUM'' register).'
  merge: -1
  pgno: 26
- img_proc: true
  md: '3. After being incremented, the contents of this register should be written
    to the register from which it was read (''SUM'' register address).


    The same data bus is used for all these intermediate operations.


    # HARVARD ARCHITECTURE


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_27_0.png)


    Microcontrollers using Harvard architecture have two different data buses. One
    is 8 bits wide and connects CPU to RAM. The other consists of 12, 14 or 16 lines
    and connects CPU to ROM. Accordingly, the CPU can read an instruction and access
    data memory at the same time. Since all RAM memory registers are 8 bits wide,
    all data being exchanged are of the same width. During the process of writing
    a program, only 8-bit data are considered. In other words, all you can change
    from the program and all you can influence is cycle-instruction. The programs
    written for these microcontrollers will be stored in the microcontroller internal
    internal ROM after being compiled into machine code. However, ROM memory locations
    do not have 8, 12, 14 or 16 bits. The rest of bits 4, 6 or 8 represent instruction
    specifying for the CPU what to do with the 8 bits.


    The advantages of such design are the following:


    +   - All data in the program is one byte (8 bits) wide. As the data bus for program
    reading has 12, 14 or 16 lines, both instruction and data can be read simultaneously
    using these spare bits. For this reason, all instructions are single-cycle instructions,
    except for the jump instruction which is two-cycle.

    - Owing to the fact that the program (ROM) and temporary data (RAM) are separate,
    the CPU can execute two instructions at a time. Simply put, while RAM read or
    write is progress (the end of one instruction), the next program instruction is
    read through the other bus.

    - When using microcontrollers with Von-Neumann architecture, one never knows how
    much memory is occupied by the program. Basically, most program instructions occupy
    two memory locations (one contains information on WHAT should be, whereas the
    other contains information upon WHICH data it should be done). However, it is
    not a hard and fast rule, but the most common case. In microcontrollers with Harvard
    architecture, the program bus is wider than one byte, allows each program word
    to consist of instruction and data, i.e. one memory location - one program instruction.


