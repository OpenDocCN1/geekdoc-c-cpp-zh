    # Appendix A: It''s Time for Fun


    A microcontroller is a good-natured ''genie'' in the bottle'' and no extra knowledge
    is required to use it. In order to create a device controlled by the microcontroller,
    it is necessary to provide the simplest PC, program for compiling and simple device
    to transfer code from PC to the chip itself. Even though this process is quite
    logical, there are some queries, yet not because it is complicated, but for numerous
    variations. Let''s take a look.


    +   - A.1 LET''S BEGIN...

    - A.2 PROGRAM COMPILATION

    - A.3 IS THIS A HAPPY ENDING?

    - A.4 DEVELOPMENT SYSTEMS


    # A.1 LET''S BEGIN...


    Specialized programs in the Windows environment are used for writing a program
    for the microcontroller. This book describes one of them called microK PRO for
    PIC. The main advantage of this program is that it features many additional tools
    installed to aid in the development process.


    If you have experience with programming then you know that the point is to write
    all instructions in such an order they should be executed by the microcontroller
    and observe the rules of C language. In other words, the program you are writing
    just has to follow your idea! That''s all!


