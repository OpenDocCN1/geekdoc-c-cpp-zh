  md: '+   - 1 - A new byte is received before reading the previously received data.
    Since there is no space for new data receive, one of these two bytes must be cleared.
    In this case, data stored in the SSPSR register is retrievably lost.

    - 0 - Serial data is correctly received.


    SSEN - Synchronous Serial Port Enable bit determines the microcontroller pins
    function and initializes MSSP module.


    In SPI mode


    +   - 1 - Enables MSSP module and configures SCK, SDO, SDI and SS as the source
    of the port pins.

    - 0 - Disables MSSP module and configures these pins as I/O port pins.


    In I²C mode


    +   - 1 - Enables MSSP module and configures SDA and SCL as the source of the
    serial pins.

    - 0 - Disables MSSP module and configures these pins as I/O port pins.


    CKP - Clock Polarity Select bit is not used in I²C master mode.


    In SPI mode


    +   - 1 - Idle state for clock is a high level.

    - 0 - Idle state for clock is a low level.


    In I²C slave mode


