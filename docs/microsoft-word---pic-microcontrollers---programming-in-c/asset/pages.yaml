  md: '# RANDOM ACCESS MEMORY (RAM)


    Once the power supply is off the contents of RAM is cleared. It is used for temporary
    storing data and intermediate results created and using the operation of the microcontroller.
    For example, if the program performs any addition (of whatever), it is necessary
    to have a register representing what in everyday life is called the ''sum''. For
    this reason, one of the registers of RAM is called the ''sum'' and used for storing
    results of addition.


    # ELECTRICAL ERASABLE PROGRAMMABLE ROM (EEPROM)


    The contents of EEPROM may be changed during operation (similar to RAM), but remains
    permanently saved even after the loss of power (similar to ROM). Accordingly,
    EEPROM is often used to store values, created during operation, which must be
    permanently saved. For example, if you design an electronic lock or an alarm,
    it would be great to enable the user to create and enter the password, but it''s
    useless every time the power supply goes off. The ideal solution is a microcontroller
    with an embedded EEPROM.


    # INTERRUPT


    Most programs use interrupts in their regular execution. The purpose of the microcontroller
    is mainly to respond to changes in its surrounding. In other words, when an event
    takes place, the microcontroller does something... For example, when you push
    a button on a remote controller, the microcontroller will register it and respond
    by changing a channel, turn the volume up or down etc. If the microcontroller
    spends most of its time endlessly checking a few buttons for hours or days, it
    would not be practical at all.


    This is why the microcontroller has learnt a trick during its evolution. Instead
    of checking each pin or bit constantly, the microcontroller delegates the ''wait
    issue'' to a ''specialist'' which will respond only when attention worthy happens.


    The signal which informs the central processor unit about such an event is called
    an INTERRUPT.


    # CENTRAL PROCESSOR UNIT (CPU)


    As its name suggests, this is a unit which monitors and controls all processes
    within the microcontroller. It consists of several subunits, of which the most
    important are:


    +   **Instruction Decoder** is a part of electronics that decodes program instructions
    and runs other circuits on the basis of that. The ''instruction'' set is different
    for each microcontroller family expresses the abilities of this circuit:

    - **Arithmetic Logical Unit (ALU)** performs all mathematical and logical operations
    upon data; and

    - **Accumulator** is an SFR closely related to the operation of the ALU. It is
    a kind of working desk used for storing data upon which some operation should
    be performed (addition, shift/move etc.). It also stores results ready for further
    processing. One of the SFRs, called a Status Register (PSW), is closely related
    to the accumulator. It also gives any given time the ''status'' of a number stored
    in the accumulator (number is larger or less than zero


