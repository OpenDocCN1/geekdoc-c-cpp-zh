    # # STACK


    A part of RAM used as stack consists of 8-bit registers. Before the microcontroller
    starts to execute a subroutine (CALL) instruction or when an interrupt occurs,
    the address of the next instruction is pushed onto the stack, i.e. of its registers.
    Thanks to the microcontroller knows from where to continue regular program execution
    upon a subroutine or an interrupt execution. This address is cleared after returning
    to the program because there is no need to save it anymore, and one location of
    the stack becomes available for further use.


    It is important to keep in mind that data is always circularly pushed onto the
    stack. It means that after the stack has been pushed eight times, the ninth push
    overwrites the value that was stored with the first push. tenth push overwrites
    the second and so on. Data overwritten with


