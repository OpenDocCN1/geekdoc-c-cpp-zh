    # The zero position in the number


    # Base-2 number system


    ```

    11011010 = 1\cdot2^7 + 1\cdot2^6 + 0\cdot2^5 + 1\cdot2^4 + 1\cdot2^3 + 0\cdot2^2
    + 1\cdot2^1 + 0\cdot2^0

    ```


    ```

    11011010 = 128 + 64 + 0 + 16 + 8 + 0 + 2 + 0 = 218

    ```


    The number in binary system The same number in decimal system


    It is obviously the same number represented in two different number systems. The
    only difference between these two representations is the number of digits necessary
    for writing a number. One digit (2) is used to write the number 2 in decimal system,
    whereas digits (1 and 0) are used to write it in binary system. Do you now agree
    that there are 10 groups of people? Welcome to the world of binary arithmetic!
    Do you have any idea where it is used?


    Except for strictly controlled laboratory conditions, the most complicated electronic
    circuits cannot accurately determine the difference between two sizes (two voltage
    values, for example) if they are too small (lower than several volts). The reasons
    are electrical noises and something called the ''real working environment'' (unpredictable
    changes of power supply, temperature changes, tolerance to values of built-in
    components.). Imagine a computer which operates upon decimals by treating them
    in the following way: 0=0V, 1=5V, 2=10V, 3=15V, 4=20V...9=45V.


    Did anybody say batteries?


    A far simpler solution is a binary logic where 0 indicates there is no voltage
    and 1 indicates that there is a voltage. It is easier to write 0 or 1 instead
    of full sentences ''there is no voltage'' or ''there is voltage'', respectively.
    It is about logic zero (0) and logic one (1) which electronics perfectly code
    and easily performs all these endlessly complex mathematical operations. Obviously
    the we are talking applies mathematics in which all the numbers are represented
    by two digits only and where it is important to know there is a voltage or not.
    Of course, we are talking about digital electronics.


    # HEXADECIMAL NUMBER SYSTEM


    At the beginning of computer development it was realized that people had many
    difficulties in handling binary numbers. For this reason, a new system, using
    16 different symbols was established. It is called hexadecimal number system and
    consists of the ten digits we are to use (0, 1, 2, 3... 9) and six letters of
    alphabet A, B, C, D, E and F. You probably wonder about the purpose of this seemingly
    bizarre combination! Just look how perfectly it fits the story about binary numbers
    and you will understand.

    **ww.raguvaran.puzz'
