- img_proc: true
  md: 'The fail-safe clock monitor detects the failure by comparing internal and external
    clock sources. If it takes more than 2ms from the external oscillator to come,
    the clock source will be automatically switched. The internal oscillator will
    thereby continue the operation controlled by the bits of the OSCCEN register.
    When the OSFIE bit of the PIE2 register is set, an interrupt will be generated.
    The system clock will keep being sourced from internal clock until the device
    successfully restarts the external oscillator and switches back to external operation.


    Similarly, this module is enabled by changing configuration word directly before
    the process of programming chip starts. This time, it is done by selecting the
    Fail-Safe Clock Monitor option.


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_218_0.png)


