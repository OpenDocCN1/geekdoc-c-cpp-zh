    # WHAT IS THE BUSY FLAG?


    Compared to the microcontroller, the LCD is an extremely slow component. For this
    reason, it was necessary to provide a signal which would, upon command execution,
    indicate that the display is ready for the next piece of data. That signal, called
    the *busy flag*, can be read from the line D7. The display is ready to receive
    new data when the voltage on this line is 0V (BF=0).


    # LCD Connecting


    Depending on how many lines are used for connecting an LCD to the microcontroller,
    there are 8-bit and 4-bit LCD modes. The appropriate mode is selected at the beginning
    of the operation in the process called ''initialization''. The 8-bit LCD mode
    uses outputs D0- D7 to transfer data as explained on the previous page.


    The main purpose of the 4-bit LCD is to save valuable I/O pins of the microcontroller.
    Only 4 higher bits (D4-D7) are used for communication, while others may be left
    unconnected. Each piece of data is sent to the LCD in two steps-four higher bits
    are sent first (normally through the lines D4-D7), then four lower bits. Initialization
    enables the LCD to link and interpret received bits correctly.'
