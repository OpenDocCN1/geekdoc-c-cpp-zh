- img_proc: true
  md: 'Setting the microcontroller sleep mode is another step in the same direction.
    Still, the problem is to wake up the microcontroller and set it to normal mode?
    It is obviously necessary to have an external signal to change the logic state
    of some of the pins. This signal must be generated by additional electronics,
    which causes higher power consumption of the entire device...


    The ideal solution would be that the microcontroller wakes up periodically by
    itself, which is not impossible at all. The circuit which enables it is shown
    in figure on the left.


    The principle of operation is simple:


    A pin is configured as an output and a logic one (1) is brought to it. This causes
    the capacitor to be charged. Immediately after this, the same pin is configured
    as an input. The logic of state enables an interrupt and the microcontroller is
    set to Sleep mode. That''s left to wait for the capacitor to discharge by the
    leakage current flowing out through the input pin. When it occurs, an interrupt
    takes place and the microcontroller proceeds with the program execution in normal
    mode. The whole procedure is repeated.


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_114_0.png)


    Theoretically, this is a perfect solution. The problem is that all pins able to
    cause an interrupt in this way are digital and have relatively large leakage current
    when their voltage is not close to the limit values Vdd (1) or Vss (0). In this
    case, the condenser is discharged for a short time since the current amounts to
    several hundreds of microamperes. This is why the ULPW circuit, capable of registering
    slow voltage drops with minimum power consumption, was designed. Its output generates
    an interrupt, while its input is connected to one of the microcontroller pins.
    It is the RA0 pin. Referring to figure (R=200 ohms, C=1NF), discharge time is
    approximately 30ms, while a total consumption of the microcontroller is 1000 times
    lower (several hundreds of nanoamperes).


