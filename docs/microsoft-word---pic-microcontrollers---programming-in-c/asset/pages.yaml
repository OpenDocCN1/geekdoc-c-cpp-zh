    # ULPW UNIT


    The microcontroller is commonly used in devices which operate periodically and
    completely independently using a battery power supply. Minimum power consumption
    is one of the priorities Typical examples of such applications are: thermometers,
    fire detection sensors and the like. It is known that a reduction in clock frequency
    reduces the power consumption, thus one of the most convenient solutions to this
    problem is to slow down the clock, i.e. to use 32KHz crystal instead of 20MHz.


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_113_0.png)


    www.raguvaran.puzzl'
