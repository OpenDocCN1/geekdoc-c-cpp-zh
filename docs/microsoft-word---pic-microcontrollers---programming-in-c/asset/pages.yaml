    # 4.11 EXAMPLE 9


    # Two-digit LED counter, multiplexing


    The microcontroller operates as a two-digit counter here. The variable i is incremented
    (slow enough to be visible) and its value is displayed on a two-digit LED display
    (99-0). The challenge is to enable a binary number to be converted in decimal
    and split it into two digits (tens and ones). Since the LED display segments are
    connected in parallel, it is necessary to ensure that they change fast in order
    to make impression of simultaneous light emission (time-division multiplexing).


    In this example, timer TMR0 is in charge of the time-division multiplexing, while
    the mask function converts a binary number into decimal format.


