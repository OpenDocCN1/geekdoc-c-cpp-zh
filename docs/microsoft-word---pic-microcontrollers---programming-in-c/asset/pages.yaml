    # INTERRUPT SYSTEM


    The first thing the microcontroller does when an interrupt request arrives to
    execute the current

    instruction and stops the regular program execution. As a result, the current
    program

    memory address is automatically pushed onto the stack and the default address
    (predefined by

    t manufacturer) is written to the program counter. The location from where the
    program

    proceeds with execution is called an interrupt vector. For the PIC16F887 microcontroller,
    the

    address is 0004h. As seen in figure below, the location containing the interrupt
    vector is passed

    over regular program execution.


    A part of the program to be executed when an interrupt request arrives is an interrupt

    routine. Its first instruction is located at the interrupt vector. How long will
    it take to execute this

    subroutine and what it will depend on the skills of the programmer as well as
    on the

    interrupt itself. Some of the microcontrollers have more interrupt vectors (every
    interrupt


