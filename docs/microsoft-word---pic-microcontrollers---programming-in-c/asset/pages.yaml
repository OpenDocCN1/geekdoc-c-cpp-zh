    # INDIRECT ADDRESSING REGISTERS


    In addition to direct addressing, which is logical and clear (it is sufficient
    to specify the address of a register to read its contents), this microcontroller
    is capable of performing indirect addressing by means of the INDF and FSR registers.
    It sometimes makes the process of writing a program easier. The whole procedure
    is enabled because the INDF register is not true one (physically does not exist),
    but only specifies the address of register which is located in the FSR register.
    For this reason, write or read from the INDF register actually means write or
    read from the address of which is located in the FSR register. In other words,
    registers'' addresses are specified in the FSR register, and their content is
    stored in the INDF register. The difference between direct and indirect addressing
    is illustrated in the figure below:


    As seen, the problem with the ''missing addressing bits'' is solved by a ''borrow''
    from another register. This time, it is the seventh bit, called the IRP bit of
    the STATUS register.'
