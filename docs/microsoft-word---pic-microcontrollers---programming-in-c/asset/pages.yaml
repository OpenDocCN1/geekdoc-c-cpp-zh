  md: '# Using timers TMR0, TMR1 and TMR2. Using interrupts, declaring new function...


    If you have read the previous example, you probably have noticed a disadvantage
    of providing delays loops. In all those cases, the microcontroller is a ‘captive’
    and does nothing. Simply waits for some time to pass. Such waste of time is an
    unacceptable luxury and some other method should be applied before.


    Do you remember the story about timers? Interrupts? This example makes links between
    them in a practical way. The schematic is still the same as well the challenge.
    It is necessary to provide a long enough length to notice changes on a port. Timer
