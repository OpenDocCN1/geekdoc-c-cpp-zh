- img_proc: true
  md: '![](img/0d2d82b978afb5e58d1be89c0ad23d37_174_0.png)


    Otherwise, if the microcontroller to programmed is integrated into a more complex
    device (for example, a PC) then it should operate as a slave device. As such,
    it always has to wait for data transmission request to be sent by the master device.


    # SPI MODE


    The SPI mode allows 8 bits of data to be transmitted and received simultaneously
    using 3 input/output lines:


    +   - SDO - Serial Data Out - transmit line;

    - SDI - Serial Data In - receive line;

    - SCK - Serial Clock - synchronization line.


    Apart from these three lines, there is the forth (SS) as well which may be used
    if the microcontroller exchanges data with several peripheral devices. Refer to
    figure below.


    SS - Slave Select - is additional pin used for specific device selection. It is
    active only when the microcontroller is in slave mode, i.e. when the external
    - master device requires data exchange.


    When operating in SPI mode, MSSP module uses in of 4 registers:


    +   - SSPSTAT - status register

    - SSPCON - control register

    - SSPBUF - buffer register

    - SSPSR - shift register (not directly available)


    The first three registers are writable/readable and can be changed at any moment,
    while the forth register, since not available, is used for converting data into
    into ''serial'' format.


    www.raguvaran.puzz.com'
