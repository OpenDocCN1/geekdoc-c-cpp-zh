  md: '# 2^4 - 1 = 16 - 1 = 15


    Accordingly, by using 4 binary digits it is possible to represent decimal numbers
    from 0 to 15, which amounts to 16 different values in total.


    # HEXADIMAL TO DECIMAL NUMBER CONVERSION


    In order to make the conversion of a hexadecimal number to decimal, each hexadecimal
    digit should be multiplied by its position value. For example:


    ```

    A37E (hexadecimal number)

    -14*16^0 = 14*1 = 14

    -7*16^1 = 7*16 = 112

    -3*16^2 = 3*256 = 768

    -10*16^3 = 10*4096 = 41854 (the same number in decimal system)

    ```


    # HEXADIMAL TO BINARY NUMBER CONVERSION


    It is not necessary to perform any calculations in order to convert hexadecimal
    numbers to binary. Hexadecimal digits are simply replaced by appropriate binary
    digits. Since the maximum hexadecimal digit is equivalent to the decimal number
    15, we need to use four binary digits to represent one hexadecimal digit. For
    example:


    ```

    E4 = 11100100

    E 4

    ```


    A comparative table below contains the values of numbers 0-255 in three different
    number systems. This is probably the easiest way to understand the common logic
    applied to all the systems.'
