  md: 'This component is specifically manufactured to be used with microcontrollers,
    which means that it cannot be activated by standard IC circuits. It is used for
    displaying different messages on a miniature liquid crystal display. The model
    described here is for its low price and great capabilities most frequently used
    in practice. It is based on the HD44780 microcontroller (Hitachi) and can display
    messages in two lines with 16 characters each. It can display all of alphabet,
    Greek letters, punctuation marks, mathematical symbols etc. It is also possible
    to display symbols made up by the user. Other useful features include automatic
    message shift (left and right), cursor appearance, LED backlight etc.


