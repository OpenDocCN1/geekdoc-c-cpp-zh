    | 1 | 1 | 1:8 |


    T1OSEN - LP Oscillator Enable Control bit


    +   - 1 - LP oscillator is enabled for timer TMR1 clock (oscillator with low power
    consumption frequency 32.768 kHz).

    - 0 - LP oscillator is off.


