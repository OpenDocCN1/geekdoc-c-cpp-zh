    At first glance, it is sufficient to turn the power on to make the microcontroller
    operate. At first glance, it is sufficient to turn the power off to stop operating.
    In reality, start and end of operation are critical phases of which a special
    signal called RESET takes care.


    # 3.12 RESET! BLACK-OUT, BROWN-OUT OR NOISE?


    Reset condition causes the microcontroller to immediately stop operation and clear
    its registers. Areset signal may be generated at any moment (low logic level on
    the MCLR pin). If needed, it can also be generated by internal logic. Power-on
    always causes reset. Since there are many transitional events taking place when
    power is supplied on (switch contact flashing and sparking, slow voltage rise,
    gradual clock frequency stabilization etc.), it is necessary to provide a certain
    time delay for the microcontroller before it starts to operate. Two internal timers
    - PWRT and OST are in charge of that. The first one can be enabled or disabled
    during the process of writing a program. Let''s take a look what happens then:


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_223_0.png)


    As the power supply voltage reaches 1.2 - 1.7V, a circuit called Power-up timer
    resets the microcontroller within approximately 72ms. As soon as this time expires,
    another timer called Oscillator start-up timer generates another reset signal
    in 1024 quartz oscillator periods. When this delay (marked as T reset in figure)
    and the MCLR pin is set high, all conditions are met and the microcontroller starts
    to execute the first instruction in the program.


    www.raguvaran.puzzl.com'
  merge: -1
  pgno: 223
- img_proc: true
  md: 'Apart from this ''controlled'' reset occurs at the moment power goes on, there
    are another resets called *Black-out* and *Brown-out* which may occur during the
    operation as well as at the moment the power supply goes off.


    # BLACK-OUT RESET


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_224_0.png)


    Black-out reset takes place when the power supply normally goes off. The microcontroller
    then has no time to do anything unpredictable simply because the voltage drops
    very fast beneath its minimum value. In other words the light goes off, curtain
    falls down and the show is over!


    # BROWN-OUT RESET


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_224_1.png)


    When the power supply voltage drops slowly (typical example is battery discharge,
    although the microcontroller experiences faster voltage drops as slow processes),
    the internal electronics gradually stops to operate and the so called Brown-out
    reset occurs. Here, before the microcontroller completely stops the operation
    there is a real danger that circuits operate at higher voltages start to perform
    unpredictably. Brown-out reset can also cause fatal changes in the program because
    it is saved in on-chip flash memory.


    # NOISE'
  merge: -1
  pgno: 224
- img_proc: true
  md: '![](img/0d2d82b978afb5e58d1be89c0ad23d37_225_0.png)


    This is a special type of Brown-out reset which occurs in industrial environment
    when the supply voltage ''blinks'' for a moment and drops beneath minimum level.
    Even short, such noise in power line may considerably affect the operation of
    the device.


    # # MCLR PIN


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_225_1.png)


    A logic zero (0) on the MCLR pin causes an immediate and regular reset. It is
    recommended to connect it as figure on the right. The function of additional components
    is to sustain ''pure'' logic one (1) during normal operation. If their values
    are selected so as to provide high logic level on the pin after T reset is, the
    microcontroller will immediately start the operation. This may be very useful
    when it is necessary to synchronize the operation of the microcontroller with
    additional electronics or the operation of several microcontrollers.


    In order to avoid any error which may occur on Brown-out reset, the PIC 16F887
    has built in ''protection mechanism''. It is a simple, but effective circuit which
    responds every time the power supply voltage drops below 4V and keeps this level
    for more than 100 micro seconds. This circuit generates a reset signal and since
    that moment the whole microcontroller operates as if has just been turned on.


