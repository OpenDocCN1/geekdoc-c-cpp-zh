    # # LOGIC OPERATORS


    There are three types of logic operations in C language: logic AND, logic OR and
    negation (NOT). For the sake of clearness, logic states in tables below are represented
    as logic zero (0=false) and logic one (1=true). Logic operators return true (1)
    if the expression evaluates to non-zero, and false (logic 0) if the expression
    evaluates to zero. This is very important because logic operations are commonly
    used upon expressions, not upon single variables (numbers) in the program. Therefore
    logic refer to the truth of the whole expression.


    For example: 1 && 0 is the same as (true expression) && (false expression)


    The result is 0, i.e. - False in each case.


    | OPERATOR | LOGIC AND | | |

    |---|---|---|---|n| && | Operand1 | Operand2 | Result |

    | | 0 | 0 | 0 |

