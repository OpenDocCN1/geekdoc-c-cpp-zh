    # 1.2 NUMBERS, NUMBERS, NUMBERS...


    Mathematics is such a good science! Everything is so logical... The whole universe
    can be described with digits only. But, does it really have to be like that? Do
    we need exactly ten digits? Of course not, it is only a matter of habit. Remember
    the lessons from the school. For example, what does the number 764 mean: four
    units, six tens and seven hundreds. As''s as simple as that! Could it be described
    in a more complicated way? Of course it could: 4 + 60 + 700. Even more complicated?
    Yes: 4*1 + 6*10 + 7*100. The answer is yes again: 4*100 + 6*101 + 7*102. What
    does it actually mean? Why do we use exactly these numbers: 100, 101 and 102 ?
    Why is it to learn about the number 10? Because we use different digits (0, 1,
    2, ... 8, 9). In other words, we use base-10 number system, i.e. decimal system.


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_5_0.png)


    # BINARY NUMBER SYSTEM


    What would happen if only two digits are used-0 and 1? Or if we do not know how
    to determine whether something is 3 or 5 times greater than something else? Or
    if we are restricted when comparing two sizes, i.e. if we can only state that
    something exists (1) or does not exist (0)? The answer is ''not special'', we
    would need to keep using numbers in the same way as we do now, but they would
    look a bit different. For example: 11011010. How many pages of a book does the
    number 11011010 include? In order to learn that, you have to follow the same logic
    as in the previous example, but in reverse order. Bear in mind that all this is
    about mathematics with only two digits-0 and 1, i.e. base-2 number system (binary
    number system).


    www.raguvaran.puzzl.com'
