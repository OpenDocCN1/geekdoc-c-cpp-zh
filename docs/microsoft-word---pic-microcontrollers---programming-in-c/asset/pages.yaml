  md: '# TMR1 IN COUNTER MODE


    Timer TMR1 starts to operate as a counter by setting the TMR1CS bit. It counts
    pulses brought to the PC0/T1CKI pin and is incremented on the rising edge of the
    external clock input T1CKI. If the control bit T1SYNC of the T1CON register is
    cleared, the external clock inputs will be synchronized on their way to the TMR1
    register. In other words, the timer TMR1 is synchronized to the microcontroller
    system clock and is a synchronous counter.


    When the microcontroller, operating in this way, is in sleep mode, the TMR1H and
    TMR1L timer registers are not incremented even though clock pulses appear on the
    input pins. The microcontroller system clock does not run in this mode, there
    are no clock inputs to be used for synchronization. However, the prescaler will
    continue to run as far as there are clock pulses on the pins because it is just
    a simple frequency divider.


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_132_0.png)


    This counter registers a logic one (1) on input pins. It is important to know
    that at least one falling edge must be registered prior to starting pulse counting.
    Refer to figure on the left. The arrows in figure denote counter increments.


    T1CKI = 1


    T1CKI = 0


