    As mentioned, to enable a hex code to be loaded into the microcontroller it is
    necessary to provide a special device, called the programmer, with appropriate
    software. A large number of programs and electronic circuits used for this purpose
    can be found on the Internet. The procedure is basically the same for all of them
    and looks as:


    +   - Place the microcontroller in appropriate programmer’s socket;

    - Use an adequate cable to connect the programmer to a PC;

    - Open hex document within the programmer’s software, set a few parameters and
    click the icon to transfer the code. After a few seconds, a sequence of zeros
    and ones is to be programmed into the microcontroller.


    All that''s left is to install the programmed chip into the target device. If
    it is necessary to make changes in the program, the previous procedure may be
    repeated an unlimited number of times.


