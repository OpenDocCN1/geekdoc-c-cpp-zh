    # ### Step 2.


    The data is now moved to the SSPSR register and the SSPBUF register is not cleared.


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_177_1.png)


    # ### Step 3.


    This data is then shifted to the output pin (MSB bit first) while the register
    is simultaneously being filled with bits through the input pin. In Master mode,
    the microcontroller itself generates clock, while the Slave mode uses external
    clock (the SCK pin).


