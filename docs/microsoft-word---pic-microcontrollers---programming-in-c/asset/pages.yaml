  md: '# Direct addressing


    # Indirect addressing


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_111_0.png)


    One of the most important features of the microcontroller is the controller of
    input/output pins which enable it to be connected to peripherals. The PIC16F887
    has in total of 35 general-purpose I/O pins available, which is quite enough for
    most applications.


    # 3.3 INPUT/OUTPUT PORTS


    In order to synchronize the operation of I/O ports with the internal 8-bit organization
    of the microcontroller, they are similar to registers, grouped into five ports
    denoted by A, B, C, D and E. All of them have several features in common:


    +   * For practical reasons, many I/O pins are multifunctional. If a pin performs
    any of these functions, it may not be used as a general-purpose input/output pin.

    * Every port has its ‘satellite’, i.e. the corresponding TRIS register: TRISA,
    TRIS, TRISC etc. which determines the performance of port bits, but not their
    contents.


    By clearing any bit of the TRIS register (bit=0), the corresponding port pin is
    configured as an output. Similarly, by setting any bit of the TRIS register (bit=1),
    the corresponding port pin is configured as an input. This rule is easy to remember
    0 = Output, 1 = Input.'
  merge: -1
