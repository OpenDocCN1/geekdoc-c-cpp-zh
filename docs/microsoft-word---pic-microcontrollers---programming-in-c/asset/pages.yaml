    # ### Step 4.


    The SSPSR register is full 8 bits of data have been received. It is indicated
    by setting the BF bit of the SSPSTAT register and the SPIF bit of the PIR1 reg-ter.
    The received data (one byte) is automatically moved from the SSPSR register to
    the SSPBUF register. Since serial data transmission is performed automatically,
    the rest of the program is normally executed while the data transmission is in
    progress. In this case, the function of the SPIF bit is to generate an interrupt
