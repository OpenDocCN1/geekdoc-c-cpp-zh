    32.60. It enables the program to compare the measured temperature to the meaningful
    constant instead of numbers representing it.


    # CHARACTER CONSTANTS (ASCII CHARACTERS)


    A constant is a character enclosed within single quotation marks. In the following
    example, a constant named I_CLASS is declared as A character, while a constant
    named II_CLASS is declared as B character.


    ```

    const I_CLASS = ''A''; // Declare constant I_CLASS

    const II_CLASS = ''B''; // Declare constant II_CLASS

