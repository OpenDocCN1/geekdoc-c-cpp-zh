- img_proc: true
  md: 'R/W - Read Write bit is used in I²C mode only. This bit holds the R/W bit information
    following the last address match. This bit is only valid from the address match
    to the next Start bit, Stop or not ACK bit.


    In I²C slave mode


    +   - 1 Data read.

    - 0 Data write.


    In I²C master mode


    +   - 1 Trans is in progress.

    - 0 Trans is not in progress.


    # UA - Update Address bit is used in 10-bit I²C mode only.


    +   - 1 The SSPADD register must be updated.

    - 0 Address in the SSPADD register is correct and doesn’t need to be updated.


    # BF Buffer Full Status


    During data receive (in SPI and I²C modes)


    +   - 1 Receive complete. The SSPBUF register is full.

    - 0 Receive not complete. The SSPBUF register is empty.


    During data transmit (in I²C mode only)


    +   - 1 Data transmit in progress (doesn’t include the ACK and STOP bits).

    - 0 Data transmit complete (doesn’t include the ACK and STOP bits).


    # SSPCON Register


    | R(W) | R(W) | R(W) | R(W) | R(W) | R(W) | R(W) | R(W) | R(W) | Features |

    |---|---|---|---|---|---|---|---|---|---|

    | SSPCON | WCOL | SSPOV | SSPEN | CKP | SSP3 | SSP2 | SSP1 | SSP0 | Bit map |

    | | Bit 7 | Bit 6 | Bit 5 | Bit 4 | Bit 3 | Bit 2 | Bit 1 | Bit 0 | |


    # Legend


    | R/W | Readable/Writable bit |

    |---|---|n| (0) | After reset, bit is cleared |


    # WCOL Write Collision Detect bit


    +   - 1 Collision detected. To write the SSPBUF register was attempted while the
    I²C conditions were not met-free.

    - 0 No collision.


    # SSPOV Receive Overflow Indicator bit'
