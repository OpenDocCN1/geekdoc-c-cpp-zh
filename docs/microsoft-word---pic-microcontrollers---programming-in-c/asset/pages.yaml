  md: '# Something to Remember


    Similarly, all you need to do is to discard a current limiting resistor shown
    below. Depending on the power supply voltage, the effects might be spectacular!


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_234_0.png)


    # LED DISPLAY


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_234_1.png)


    Basically, an LED display is nothing more than several LEDs molded in the same
    plastic case. There are many types of displays and some of them are composed of
    several dozens built-in diodes which can display different symbols. Nevertheless
    the most commonly used display is the 7-segment display. It is composed of 8 LEDs.
    Seven segments of digit are arranged as a rectangle for symbol displaying, whereas
    the additional segment is used for the purpose of displaying decimal point. In
    order to simplify connection, anodes or cathodes of all diodes are connected to
    the common pin so that there are common anode displays and common cathode displays,
    respectively. Segments are marked with the letters from a a to g, plus dp, as
    shown in figure below. When connecting, each diode is treated separately, which
    means that each must have its own current limiting resistor.


    Here are a few important things that you should pay attention to when buying LED
    displays:


    +   * As mentioned, depending on whether anodes or cathodes are connected to the
    common pin, there are common anode displays and common cathode displays. As their
    appearance, there is no difference between these displays at all so it is recommended
    to check carefully prior to installing them which one is used.

    * Each microcontroller pin has a maximum current it can receive or give. Thus,
    if several displays are connected to the microcontroller it is recommended to
    use the so called Low current LEDs using only 2mA for the operation.

    * Display segments are usually marked with the letters from a to g, but there
