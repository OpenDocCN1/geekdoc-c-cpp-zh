    # LCD Screen


    An LCD screen can display two lines with 16 characters each. Every character consists
    of 5x8 or 5x11 dot matrix. This book covers a 5x8 character display which is most
    commonly used.


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_239_0.png)


    Display contrast depends on the power supply voltage and whether messages are
    displayed in one or two lines. For this reason, varying voltage 0-Vdd is applied
    to the pin marked as Vee. A trimmer potentiometer is usually used for this purpose.
    Some of the LCD displays have built-in backlight (blue or green LEDs). When used
    during operation, a current limiting resistor should be serially connected to
    one of the pins for backlight power supply (similar to LED diodes).'
