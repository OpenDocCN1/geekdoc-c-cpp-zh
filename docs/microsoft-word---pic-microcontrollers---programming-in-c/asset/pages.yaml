  md: '![](img/0d2d82b978afb5e58d1be89c0ad23d37_235_0.png)


    Displays connected to the microcontroller usually occupy a large number of valuable
    I/O pins, which can be a big problem especially when it is needed to display multi
    digit numbers. The problem is more than obvious if, for example, it is needed
    to display two 6-digit numbers (a simple calculation shows that 96 output pins
    are needed in this case). The solution to this problem is called MULTIPLEXING.


    Here is how an optical illusion based on the same operating principle as a film
    camera is made. Only one digit at a time is active, but they change their on/off
    conditions so quickly making impression that all digits of a number are simultaneously
    active.


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_235_1.png)


    4 x Low current common cathode displays


    Here is an explanation on the figure above. First a byte representing units is
    applied on a microcontroller PORT2 and the transistor T1 is activated at the same
    time. After a while, the transistor T1 is turned off, a byte representing tens
    is applied on the PORT2 and the transistor T2 is activated. This process is being
    cyclically repeated at high speed for all digits and corresponding transistors.


    A disappointing fact which indicates that the microcontroller is just a kind of
    miniature computer designed to understand only the language of zeros and ones
    is fully expressed when displaying


