  md: "# Let's do it in microC...\n\n/ If the CLRWDT command is executed, WDT will\
    \ reset the microcontroller\nevery 32.768 us (f = 4 MHz) */\n\n```\nvoid main()\
    \ {\n    OPTION_REG = 0b00001111; // Prescaler is assigned to WDT (1:128)\n  \
    \  asm CLRWDT;               // Assembly command to reset WDT\n              \
    \            // Time between these two CLRWDT commands\n    must not         \
    \        // exceed 32.768 microseconds (128x256)\n    asm CLRWDT;            \
    \   // Assembly command to reset WDT\n                          // Time between\
    \ these two CLRWDT commands\n    must not                 // exceed 32.768 microseconds\
    \ (128x256)\n    asm CLRWDT;               // Assembly command to reset WDT\n\
    ```\n\n# INTERRUPT SYSTEM REGISTERS\n\nWhen an interrupt request arrives, it doesn't\
    \ mean that an interrupt will automatically occur, because it must also be enabled\
    \ by the user (from within the program). There, are special bits used to enable\
    \ or disable interrupts. It is easy to recognize them by the letters IE contained\
    \ in their names (stands for Interrupt Enable). Besides, each interrupt is associated\
    \ with another bit called the flag indicates that an interrupt request has arrived\
    \ regardless of whether it is enabled or not. They are easily recognizable by\
    \ the last two letters contained in their names- IF (Interrupt Flag).\n\n![](img/0d2d82b978afb5e58d1be89c0ad23d37_100_0.png)\n\
    \nAs seen, everything is based on a simple and efficient idea. When an interrupt\
    \ request arrives, the flag bit is set first.\n\nIf the appropriate IE bit is\
    \ not set (0), this condition will be completely ignored. Otherwise, an interrupt\
    \ occurs! If several interrupt sources are enabled, it is necessary to detect\
    \ the active one before the interrupt routine starts execution. Source detection\
    \ is performed by checking flag bits.\n\nwww.raguvaran.pzl.com"
