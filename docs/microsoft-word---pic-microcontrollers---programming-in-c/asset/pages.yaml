    # SWITCHES AND PUSH-BUTTONS


    Switches and push-buttons are probably the simplest devices providing the simplest
    way of detecting the appearance of a voltage on a microcontroller input pin. Nevertheless,
    it is not as simple as it seems... The reason for it is a contact bounce.


    www.raguvaran.puzl.com'
  merge: -1
  pgno: 230
- img_proc: true
  md: '![](img/0d2d82b978afb5e58d1be89c0ad23d37_231_0.png)


    The contact bounce is a common problem with mechanical switches. When the contacts
    strike together, their momentum and elasticity act together to cause bounce. The
    result is a rapidly pulsed electrical current instead of a clean transition from
    zero to full current. It mostly occurs due to vibrations, slight rough spots and
    dirt between contacts. This effect is usually unnoticed when using these components
    in everyday life because the bounce happens too fast to affect most equipment.
    However, it causes problems in some analog and logic circuits that respond fast
    enough to misinterpret/off pulses as a data stream. Anyway, the whole process
    doesn''t last long (a few micro or milliseconds), but long enough to be registered
    by the microcontroller. When only a push-button is used as a counter signal source,
    errors occur in almost 100% of cases!


    This problem may be easily solved by connecting a simple RC circuit to suppress
    quick voltage changes. Since the bounce period is not defined, the values of components
    are not precisely determined. In most cases it is recommended to use the values
    as shown in figure below.


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_231_1.png)


    If complete stability is needed then radical measures should be taken. The output
    of the circuit, shown in figure below (RS flip-flop), will change its logic state
    only after detecting the first pulse triggered by a contact bounce. This solution
    is more expensive (SPDT switch), but the problem is definitely solved.'
  merge: -1
  pgno: 231
- img_proc: true
  md: '![](img/0d2d82b978afb5e58d1be89c0ad23d37_232_0.png)


    In addition to these hardware solutions, there is also a simple software solution.
    When the program tests the logic state of an input pin and detects a change, the
    check should be done one time after a certain delay. If the program confirms the
    change, it means that a switch/push button has changed its position. The advantages
    of such solution are obvious: it is free of charge, effects of contact bounce
    are eliminated and it can be applied to the poorer quality contacts as well.


    # RELAY


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_232_1.png)


    A relay is an electrical switch that opens and closes under the control of another
    electrical circuit. It is therefore connected to output pins of the microcontroller
    and used to turn on/off high-power devices such as motors, transformers, heaters,
    bulbs, etc. These devices are almost always placed away from the board''s sensitive
    components. There are various types of relays, but all of them operate in the
    same way. When current flows through the coil, the relay is operated by an electromagnet
    to open or close one or more sets of contacts. Similar to optocouplers, there
    is no galvanic coupling (electrical contact) between input and output circuits.
    Relays usually demand both higher voltage and higher current to start operation,
    but there are also miniature ones that can be activated by low current directly
    obtained from a microcontroller pin.


    This figure below shows the most commonly used solution.'
  merge: -1
  pgno: 232
- img_proc: true
  md: '![](img/0d2d82b978afb5e58d1be89c0ad23d37_233_0.png)


    In order to prevent the appearance of high voltage self-induction, caused by a
    sudden stop of the current flow through the coil, an inverted polarized diode
    is connected in parallel to the coil. The purpose of this diode is to ''cut off''
    the voltage peak.


    # LED DIODES


    You probably know all you need to know about LED diodes, but you should also think
    of the younger generations... Let''s see, how to destroy an LED?! Well...Easily.


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_233_1.png)


    # Quick Burning


    Like any other diode, LEDs have two ends-- an anode and a cathode. Connect a diode
    properly to the power supply voltage and it will happily emit light. Turn the
    diode upside down and apply the same power supply voltage (even for a moment).
    It will not emit light - NEVER AGAIN!


    # Slow Burning


    There is a nominal, i.e. maximum current limit specified for every LED which must
    not be exceeded. If it happens, the diode will emit more intensive light, but
    just for a short period of time.


    www.raguvaran.puz.com'
