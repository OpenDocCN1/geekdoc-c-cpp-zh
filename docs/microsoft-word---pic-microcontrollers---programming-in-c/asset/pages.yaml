    The largest number that can be be represented by 4 binary digits is the number
    1111. It corresponds to the number 15 in decimal system, whereas in hexadecimal
    system it is represented by only one digit F. It is the largest 1-digit number
    in hexadecimal system. Do you see how skillful it is? The largest number written
    with eight binary digits is at the same time the largest 2-digit hexadecimal number.
    Don''t forget that computers use 8-digit binary numbers. By chance?


    # BCD CODE


    BCD is a binary code for decimal numbers only (Binary-Coded Decimal). It is used
    to enable electronic circuits to communicate with peripherals using decimal system
    or within ''their own world'' using binary system. It consists of 4-digit binary
    numbers which represent the first ten digits (0, 1, 2, 3 ... 8, 9). Even though
    four digits can give in total of 16 possible combinations, the BCD code normally
    uses only the first.


    # NUMBER SYSTEM CONVERSION


    Binary system is most commonly used, decimal system is most understandable, while
    hexadecimal system is somewhere between them. Therefore, it is very important
    to learn how to convert numbers from one system to another, i.e. how to turn a
    sequence of zeros and ones into understandable values.


    # BINARY TO DECIMAL NUMBER CONVERSION


    Digits in a binary number have different values depending on the position they
    have in that number. Additionally, each position can contain either 1 or 0 its
    value may be easily determined by counting its position from the right. To make
    the conversion of a binary number to decimal it is necessary to multiply with
    the corresponding digits (0 or 1) and add the results. The magic of binary to
    decimal number conversion works...You doubt? Look at the example:


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_7_1.png)


    It should be noted in order to represent decimal numbers from 0 to 3, you need
    to use only two binary digits. For larger numbers, extra binary digits must be
    used. Thus, in order to represent decimal numbers from 0 to 7 you need three binary
    digits, for the numbers from 0 to 15 you need four digits. Simply put, the largest
    binary number consisting of n digits is obtained when the base 2 is raised by
