  md: '# VR3 - VR0 CVref Value Selection


    If VRR = 1 (low range)


    Voltage reference is calculated using the formula: CVref = ([VR3:VR0]/24)Vdd


    If VRR = 0 (high range)


    Voltage reference is calculated using the formula: CVref = Vdd/4 + ([VR3:VR0]/32)Vds


    # In Short


    In order to properly use built-in comparators, it is necessary to do the following:


    Step 1 - Module Configuration:


    +   - In order to select the appropriate mode, bits of the CM1CON0 and CM2CON0
    registers should be configured. Interrupt should be disabled on any change of
    mode.


    Step 2 - Internal voltage reference Vref source configuration (only when used).
    In the VRCON register it is necessary to:


    +   - Select one of two voltage ranges using the VRR bit.

    - Configure necessary Vref using bits VR3 - VR0.

    - Set the VBOE bit if needed.

    - Enable voltage Vref source by setting the VREN bit.


    Formula used to calculate voltage reference:


    VRR = 1 (low range)

    CVref = ([VR3:VR0]/24)VLADD


    VRR = 0 (high range)

    CVref = (VLADDER/4) + ([VR3:VR0]VLADDER/32)


    Vadder = Vdd or [Vref+] - [Vref-] + Vref+


    Step 3 - Start of operation:


    +   - Enable an interrupt by setting bits CMIE, PEIE and GIE (INTCON register).

    - Read the C1OUT and C2OUT bits of the CMCON register.

    - Read the CMIF flag bit of the PIR register. After being set, this bit must be
    cleared in software.


    In order to synchronize all the processes taking place within the microcontroller,
    a clock signal must be used, while in order to generate the clock signal, a clock
    oscillator must be used. Simple as that. This microcontroller has several oscillators
    capable of working in different modes and this is where the story becomes interesting...


    www.raguvaran.puzl.com'
  merge: -1
  pgno: 207
- img_proc: true
  md: '# 3.10 CLOCK OSCILLATOR


    As seen in figure below, the clock signal may be generated by one out of two built-in
    oscillators.


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_208_0.png)


    An external oscillator is installed within the microcontroller and connected to
    the OSC1 and OSC2 pins. It is called ''external'' because it relies on an external
    circuit for the clock signal and frequency stabilization, such as a stand-alone
    oscillator, quartz crystal, ceramic resonator or resistor-capacitor circuit. The
    oscillator mode is selected by the bits of bytes, called Config Word, sent during
    programming.


    Internal oscillator consists of two separate internal oscillators:


    The HFINTOSC is a high-frequency internal oscillator which operates at 8MHz. The
    microcontroller can use clock source generated at this frequency or after being
    divided in prescaler.


    The LFINTOSC is a low-frequency internal oscillator which operates at 31 kHz.
    Its clock source are used for watch-dog and power-up timing, but it can also be
    used as a clock source for the operation of the entire microcontroller.


    The system clock can be selected between external or internal clock source via
    the System Clock Select (SCS) bit of the OSCCON register.


    # OSCCON Register


    www.raguvaran.puzl.com'
  merge: -1
  pgno: 208
- img_proc: true
  md: 'The OSCCON register controls the system clock and frequency selection options.
    It contains the following bits: frequency selection bits (IRCF2, IRCF1, IRCF0),
    frequency status bits (HTS, LETS), system control bits (OSTA, SCS).


    | R/W (1) | R/W (1) | R/W (0) | R (1) | R (0) | R (0) | R/W (0) | Features |

    | --- | --- | --- | --- | --- | --- | --- | --- |

    | OSCCON - | IRCF2 | IRCF1 | IRCF0 | OSTS | HTS | LTS | SCS | Bit name |

    | Bit 7 | Bit 6 | Bit 5 | Bit 4 | Bit 3 | Bit 2 | Bit 1 | Bit 0 |


    | R/W | Bit is unimplemented |

    | R | Readable/Writable bit |

    | (0) | Readable bit, after reset, bit is cleared |

    | (1) | After reset, bit is set |


    IRCF2-0 - Internal Oscillator Select bits. The divider rate depends on the combination
    of these three bits. The clock frequency of internal oscillator is determined
    by the same way.


    | IRCF2 | IRCF1 | IRCF0 | FREQUENCY | OSC |

    | --- | --- | --- | --- | --- |

    | 1 | 1 | 1 | 8 MHz | HFINTOSC |

    | 1 | 1 | 0 | 4 MHz | HFINTOSC |

    | 1 | 0 | 1 | 2 MHz | HFINTOSC |

    | 1 | 0 | 0 | 1 MHz | HFINTOSC |

    | 0 | 1 | 0 | 500 kHz | HFINTOSC |

    | 0 | 1 | 0 | 250 kHz | HFINTOSC |

    | 0 | 0 | 1 | 125 kHz | HFINTOSC |

    | 0 | 0 | 0 | 31 kHz | LFINTOSC |


    OSTS - Oscillator Start-up Time-out Status bit indicates which clock source is
    currently in use. It is read-only.


    +   - 1 - External oscillator is in use.

    - 0 - One of internal clock oscillators is in use (HFINTOSC or LFINTOSC).


    HTS - HFINTOSC Status bit (8 MHz - 125 kHz) indicates whether the high-frequency
    internal oscillator operates in a stable way.


    +   - 1 - HFINTOSC is stable.

    - 0 - HFINTOSC is not stable.


    LTS - LFINTOSC Stable bit (31 kHz) indicates whether the low-frequency internal
    oscillator operates in a stable way.'
  merge: -1
  pgno: 209
- img_proc: true
  md: '+   * 1 - LFINTOSC is stable.

    * 0 - LFINTOSC is not stable.


    # SCS - System Clock Select bit determines which oscillator is to be used as a
    clock source.


    +   * 1 - Internal oscillator is used for system clock.

    * 0 - External oscillator is used for system clock.


    The oscillator mode is set by bits in *Config Word* written to the microcontroller
    memory during the process of programming.


    # EXTERNAL CLOCK MODES


    The external oscillator can be configured to operate in one of several modes,
    which enables it to operate at different speeds and use different components for
    stabilization. Mode of operation is selected during the process of writing a program
    into the microcontroller. First of all, it is necessary to activate the program
    on a PC to be used for programming. It is the PICflash program in this case. Click
    on the oscillator field and select one oscillator from the drop-down list. The
    appropriate bits will be automatically set, thus becoming a part of several bytes
    which together form a *Config Word*.


    During the process of programming the microcontroller, these bytes of Config Word
    are written to the microcontroller''s ROM memory and stored in special registers
    which are not available to the user. On the basis of these bits, the microcontroller
    ''knows'' what to do, although it is not explicitly stated in the program. Mode
    of operation is selected after the process of writing and compiling a program'
  merge: -1
