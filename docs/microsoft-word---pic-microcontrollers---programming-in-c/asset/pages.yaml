    the first part of the interrupt routine consists in interrupt source detection.


    Finally, when the interrupt source is recognized and the interrupt routine is
    executed, the microcontroller reads the RETIE instruction, pops the address from
    the stack and proceeds with program execution from where it left off.


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_96_0.png)


    microK recognizes an interrupt routine to be executed as the void interrupt()
    function. The body of that function, i.e. interrupt routine, should be written
    by the user.


    ```

    void interrupt() {   // Interrupt routine

    cnt++;                   // Interrupt causes variable cnt to be incremented

    }

    ```


    # In Short: How to Use SFRs


    You have bought the microcontroller and have a good idea how to use it... There
    is a long list of SFRs and their bits. Each of them controls some process. All
    in it, it looks like a big control table with a lot of instruments and switches.
    Now you are concerned whether you will manage to learn how to use them all? You
    will probably not, but don''t worry, you don''t have to! Such powerful microcontrollers
    are similar to supermarkets: they offer so many at low prices and it is up to
    you to choose those you need. Therefore, select the field you are interested in
    and study only what you need to know. When you understand hardware operation,
    study SFRs which are in control of it (there are usually a few of them).


    As devices have a sort of control system, the microcontroller has its ''levers''
    which you have to be familiar with in order to be able to use it properly. Of
    course, we are talking about SFRs from the process of programming begins and where
    it ends.


