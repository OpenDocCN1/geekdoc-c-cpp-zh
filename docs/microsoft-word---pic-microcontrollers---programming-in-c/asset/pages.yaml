- img_proc: true
  md: 'It is important to know that the flag bits are not automatically cleared, but
    by software while the interrupt execution is in progress. If we neglect this detail,
    another interrupt will occur immediately after returning to the main program,
    even though there are no more requests for execution. Simply put, the flag, as
    well as the IE bit, remain set.


    All interrupt sources typical of the PIC16F87 microcontroller are shown on the
    next page. Note several things:


    The GIE bit enables all unmasked interrupts and disables all interrupts simultaneously.


    The PEIE bit enables all unmasked peripheral interrupts and disables all peripheral
    interrupts. This does not concern Timer TMR0 and PORTB interrupt sources.


    To enable an interrupt caused by changing logic state on PORTB, it is necessary
    to enable it for each bit separately. In this case, bits of the IOCB register
    act as control IE bits.


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_101_0.png)


    # INTCON Register


    The INTCON register contains various enable and flag bits for TMR0 register overflow,
    PORTB change and external INT pin interrupts.


