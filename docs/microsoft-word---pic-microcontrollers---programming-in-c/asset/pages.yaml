  md: 'The execution time is the same for almost all instructions, and lasts for 4
    clock cycles. The oscillator frequency is stabilized by a quartz crystal. The
    execution time of jump and branch instructions is 2 clock cycles. It means that
    if the microcontroller''s operating speed is 20MHz, the execution time of each
    instruction will be 200nS, i.e. the program will execute 5 million instructions
    per second!


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_87_0.png)


    # MEMORY


    The PIC16F887 has three types of memory ROM, RAM and EEPROM. All of them will
    be separately discussed since each has specific functions, features and organization.


    # ROM MEMORY


    ROM memory is used to permanently save the program being executed. This is why
    it is often called ''program memory''. The PIC16F887 has 8Kb of ROM (in total
    of 8192 locations). Since the ROM memory is made with FLASH technology, its contents
    can be changed by providing a special programming voltage (13V).


    However, it is not necessary to explain it in detail as being automatically performed
    by means of a special program on the PC and a simple electronic device called
    the programmer.'
