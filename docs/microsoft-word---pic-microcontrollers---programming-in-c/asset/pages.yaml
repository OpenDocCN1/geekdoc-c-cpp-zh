- img_proc: true
  md: 'The PIC16F887 microcontroller has several independent serial communication
    modules, and each of them can be configured to operate in several different modes,
    which make them irreplaceable in many situations. Remember what we advised about
    the CCP modules as the same applies here. Don''t burden yourself with details
    of the operation of all of them, but select one and use only what you really need.


    # 3.8 SERIAL COMMUNICATION MODULES


    The USART is one of the oldest serial communication systems. The modern versions
    of this system are upgraded and called somewhat differently - EUSART.


    # EUSART


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_158_0.png)


    The Enhanced Universal Synchronous Asynchronous Receiver Transmitter (EUSART)
    module is a serial I/O communication peripheral unit. It is also known as Serial
    Communications Interface (SCI). It contains all clock generators, shift registers
    and data buffers necessary to perform an input/output serial data transfer independently
    of the device program execution. As its name states, apart from using the clock
    for synchronization, this module can also establish asynchronous connection, which
    makes it unique for some of the applications. For example, in the event that it
    is difficult or impossible to provide special channels for clock and data transfer
    (for example, radio or infrared remote control), the EUSART module is definitely
    the best possible solution.


    The EUSART system integrated into the PIC16F887 microcontroller has the following
    features:


    +   * Full-duplex asynchronous transmit and receive;

    * Programmable 8 or 9-bit width characters;

    * Address detection in 9-bit mode;

    * Input buffer overrun error detection, and

    * Half-duplex communication in synchronous mode.


    # EUSART ASYNCHRONOUS MODE


    www.raguvaran.pzl'
  merge: -1
  pgno: 158
- img_proc: true
  md: 'The EUSART transmits and receives data using a standard non-return-to-zero
    (NRZ) format. As seen in figure below, this mode doesn''t use clock signal, while
    the format of data being transferred is very simple:


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_159_0.png)


    Briefly, each data is transferred in the following way:


    +   - In idle state, data line has high logic level (1);

    - Each data transmission starts with the START bit which is always a zero (0);

    - Each data is 8 or 9-bit wide (the LSB is transferred first); and

    - Each data transmission ends with the STOP bit which is always a one (1).


    Figure below shows a common way of connecting PIC microcontroller that uses EUSART
    module. The RS-232 circuit is used as a voltage level converter.


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_159_1.png)


    # EUSART ASYNCHRONOUS TRANSMITTER'
  merge: -1
  pgno: 159
- img_proc: true
  md: '![](img/0d2d82b978afb5e58d1be89c0ad23d37_160_0.png)


    In order to enable data transmission via EUSART module, it is necessary to configure
    it to operate as a transmitter. In other words, it is necessary to define the
    state of the following bits:


    +   - **TXEN = 1** - EUSART transmitter is enabled by setting the TXEN bit of
    the TXSTA register.

    - **SYNC = 0** - EUSART is configured to operate in asynchronous mode by clearing
    the SYNC bit of the TXSTA register.

    - **SPEN = 1** - By setting the SPEN bit of the RCSTARegister, EUSART is enabled
    and the TX/CK pin is automatically configured as an output. If this bit is simultaneously
    used for some analogue function, it must be disabled by clearing the corresponding
    bit of the ANSEL register.


    The central part of the EUSART transmitter is the shift register which is not
    directly accessible by the user. In order to start data transfer, the module must
    be enabled by setting the TXEN bit of the TXSTA register. Data to be sent should
    be written to the TXREG register, which will follow the sequence of events:


    +   - Byte will be immediately transferred to the shift register TSR;

    - TXREG register remains empty, which is indicated by setting the bit TXIF of
    the PIR1 register. If the TXIF bit of the PI1 register is set, an interrupt will
    be generated. However, the flag is reset to 0 by writing new data to the TXREG.

    - Control electronics ''pushes'' data towards the TX pin in synchronization with
    internal clock: START (0) ... data ... STOP (1).

    - When the last leaves the TSR register, the TRMT bit of the TXSTA register is
    automatically set.

    - If the TXREG register has received a new character data in the meantime, the
    whole procedure will be immediately repeated after the STOP bit of the previous
    character has been transmitted.'
  merge: -1
  pgno: 160
- img_proc: true
  md: '9-bit data transfer is enabled by setting the TX9 bit of the TXSTA register.
    The TX9D bit of the TXSTA register is the ninth and most significant data bit.
    When transferring 9-bit data, the TX9D data bit must be written prior to transferring
    the 8 least significant bits into the TXREG register. All nine bits of data will
    be transferred to the TSR shift register immediately after the TXREG complete.


    # EUSART ASYNCHRONOUS RECEIVER


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_161_0.png)


    In order to enable data transmission via EUSART module, it is necessary to configure
    it to operate as a transmitter. In other words, it is necessary to define the
    state of the following bits:


    +   - CREN = 1 - EUSART receiver is enabled by setting the CREN bit of the RCSTA
    register;

    - SYNC = 0 - EUSART is configured to operate in asynchronous mode by clearing
    the SYNC bit stored in the TXSTA register;

    - SPEN = 1 - By setting the SPEN bit of the RCSTAregister, EUSART is enabled and
    the RX/DT pin is automatically configured as an input. If this bit is simultaneously
    used for some analogue function, it must be disabled by clearing the corresponding
    bit of the ANSEL register.


    When this first and necessary step is accomplished and the START bit is detected,
    data is transferred to the shift register RSR through the RX pin. When the STOP
    bit has been received, the following occurs:


    +   - Data is automatically transferred to the RCRE register (if empty);

    - The flag RCIF is set and an interrupt, it is enabled by the RCRE bit of the
    PIE1 register, Similarly. to the transmitter, the flag is cleared by software
    only, i.e. by reading the RCRE register. Bear in mind that this is a character
    FIFO memory (first-in, first-out) which allows reception of two characters simultaneously;

    - If the RCRE register is occupied (contains two bytes) and the shift register
    detects new STOP bit, the overflow bit of OERR will be set. In this case, a new
    coming data is lost, and


    *www.ravugaran.puzzl'
  merge: -1
  pgno: 161
- img_proc: true
  md: 'the OEER bit must be cleared by software. It is done by clearing and resetting
    the CREN bit;

    Note: it is not possible to receive new data as the OERR bit it is set.

    * If the STOP bit is a zero (0), the FERR bit of the RCSTA register detecting
    error will be set;

    * To enable 9-bit data reception, it is necessary to set the RX9 bit of the RCSTA
    register.


    # RECEIVE ERROR DETECTION


    There are two types of errors which the microcontroller can automatically detect.
    The first one is expected called Framing error and occurs when the receiver does
    not detect the STOP bit at expected time. Such an error is indicated by the FERR
    bit of the RCSTA register. If this bit is set, the last received data may be incorrect.
    There are several things important to know:


    +   * A Framing error does not generate an interrupt by it;

    * If this bit is set, the last received data has an error;

    * A framing error (bit set) does not prevent reception of new data;

    * The FERR bit is cleared by reading received data, which means that check must
    be prior to reading data; and

    * The FERR bit cannot be cleared by software. If needed, it can be cleared by
    clearing the SPEN bit of the RCSTA register. It will simultaneously cause the
    whole EUSART system to be reset.


    Another type of error is Overrun Error. As previously mentioned, the FIFO memory
    can receive two characters. An overrun error will be generated if the third character
    is received. Simply put, there is no space for another bit and an error is unavoidable.
    When this happens the OERR bit of the RCSTA register is set. The consequences
    are the following:


    +   * Data already stored in the FIFO registers (two bytes) can be normally read;

    * No additional data will be received until the OERR bit is cleared; and

    * This bit is not directly accessed. To clear it, it is necessary to clear the
    CREN bit of the RCSTARegister or reset the whole EUSART system by clearing the
    SPEN bit of the RCSTA register.


    # 9-BIT DATA RECEIVE


    Apart from receiving standard 8-bit data, the EUSART system supports 9-bit data
    reception. On the transmit side, the ninth bit is ''attached'' to the original
    bit directly before the STOP bit. On the receive side, when the RX9 bit of the
    RCSTA register is set, the ninth data bit will be automatically written to the
    RX9D bit of the same register. After receiving this bit, it is necessary to take
    care of how to read its bits- RX9D data bit must be read prior to reading 8 least
    significant bits of the RCRE register. Otherwise, the ninth data bit will be cleared.'
  merge: -1
  pgno: 162
- img_proc: true
  md: '![](img/0d2d82b978afb5e58d1be89c0ad23d37_163_0.png)


    # ### ADDRESS DETECTION


    When the ADDEN bit of the RCSTA register is set, the EUSART module is able to
    receive only 9-bit data, whereas all 8-bit data will be ignored. Although it seems
    like a restriction, such modes enable serial communication between several microcontrollers.
    The principle of operation is simple. Master device sends a 9-bit data representing
    the address of one slave microcontroller. However, all of them must have the ADDEN
    bit set because it enables address detection. All slave microcontrollers, sharing
    the same transmission line, receive this data (address) and automatically check
    whether it matches its own address. Software, in which match occurs, must disable
    address detection by clearing its ADDEN bit.


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_163_1.png)'
  merge: -1
  pgno: 163
- img_proc: true
  md: 'The master device keeps sending 8-bit data. All data passing through the transmission
    line will be received by the addressed EUSART module only. When the last byte
    has been received, the slave device should set the ADDEN bit in order to enable
    new address detection.


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_164_0.png)


