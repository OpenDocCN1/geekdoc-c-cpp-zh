  md: "If the program execution doesn't affect the program counter, the value of this\
    \ register is executed as automatically and constantly incremented +1, +1, +1,\
    \ +1... In this way, the program is executed as it is written- instruction by\
    \ instruction, followed by constant address increment.\n\n| Bit 12 | Bit 11 |\
    \ Bit 10 | Bit 9 | Bit 8 | Bit 7 | Bit 6 | Bit 5 | Bit 4 | Bit 3 | Bit 2 | Bit\
    \ 1 | Bit 0 |\n|---|---|---|---|---|---|---|---|---|---|---|---|---||\n| Program\
    \ Counter (PC) | | | | | | | | Bit 4 | Bit 3 | Bit 2 | Bit 1 | Bit 0 | Bit 7 |\
    \ Bit 6 | Bit 5 | Bit 4 | Bit 3 | Bit 2 | Bit 1 | Bit 0 |\n\n# # PCLATH\n\n# #\
    \ PCL\n\nIf the program counter is changed from within the software, then there\
    \ are several things that should be kept in mind in order to avoid problems:\n\
    \n+   - Eight bits (the low byte) of the PCL register which is readable and writable,\
    \ whereas five upper bits coming from the PCLATH register are write-only.\n- The\
    \ PCLATH register is cleared on any reset.\n- In assembly language, the value\
    \ of the program counter is marked with PCL and refers to 8 lower bits only. You\
    \ should take care using the ‘ADWF PCL’ instruction. This is a jump instruction\
    \ which specifies the target location by adding some number to the current address.\
    \ It is often used when jumping into a look-up table or program branch to read\
    \ them. Aproblem if the counter increases such that addition causes a change on\
    \ some bit belonging to the higher byte of the PCLATH register.\n\nExecution of\
    \ any instruction upon the PCL register simultaneously causes the Program Counter\
    \ bits to be replaced by the contents of the PCLATH register. However, the PCL\
    \ register has access to only 8 lower bits of the instruction result and the following\
    \ jump will be completely incorrect. The problem is solved by setting instructions\
    \ at addresses ending by xx00h. This enables the program to jump up to 255 locations.\
    \ If longer jumps are executed by this instruction, the PCLATH register must be\
    \ incremented by 1 for each PCL register overflow. \n\n+   - On subroutine call\
    \ or jump execution (instructions CALL and GOTO), the microcontroller is capable\
    \ of providing only 11-bit addressing. Similar to RAM which is divided in ‘bankes’,\
    \ ROM is divided in four ‘pages’ in size of 2KB each. Such instructions are executed\
    \ within these pages without any problem. Simply put, since the processor is provided\
    \ with 11-bit address from the program, it is capable of addressing any location\
    \ within 2KB. Figure below illustrates the jump to the subroutine PP1 address.\n\
    \nHowever, if a subroutine or a jump address is not within the same page as the\
    \ jump location, two ‘missing-’ higher bits should be provided by writing to the\
    \ PCLATH register. Figure below illustrates the jump to the subroutine PP2 address."
