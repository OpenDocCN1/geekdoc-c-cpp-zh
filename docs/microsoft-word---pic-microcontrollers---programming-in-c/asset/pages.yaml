- img_proc: true
  md: 'You will probably never write a program that doesn''t use ports the effort
    you make to learn all about them will definitely pay off. Anyway, they are probably
    the simplest modules within the microcontroller. This is how they are used:


    +   - When designing a device, select a port through which the microcontroller
    will communicate to peripheral environment. If you use only digital inputs/outputs,
    select any port you want. If you intend to use any of the analog inputs, select
    the appropriate port supports such a pin configuration (AN0-AN13).

    - Each port may be configured as either input or output. Bits of the TRISA, TRISB,
    TRISC, TRIS and TRISE registers determine how the appropriate port pins- PORTA,
    PORTB, PORTC, and PORTD are all. Simply...

    - If you use some of the analog inputs, it is necessary to set the appropriate
    bits of the ANSEL and ANSLH registers at the beginning of the program.

    - If you switches and push buttons as input signal, connect them to port B pins
    because they have pull-up resistors. The use of these resistors is enabled by
    the RBPU bit of the OPTION_REG register, whereas the installation of digital resistors
    is enabled by bits of the WPUB register.

    - It is usually necessary to respond as soon as input change their logic state.
    However, it is not necessary to write a program for checking pins'' logic state.
    It is far simpler to connect such inputs to the PORTB and enable an interrupt
    to occur on every voltage change. Bits of the IOCB and INTCON registers are in
    charge of that.


    The PIC16F87 microcontroller has three completely separate timers/counters marked
    as TMR0, T1 and T2. If you want to learn more about them, read carefully this
    chapter.


    # 3.4 TIMER TMR0


    The timer TMR0 has a wide range of application in practice. Very few programs
    don''t use it in some way. It is very convenient and easy to use for writing programs
    or subroutines for generating pulses of arbitrary duration, time measurement or
    counting external pulses (events) with almost no limitations.


    The timer TMR0 module is an 8-bit timer/counter with the following features:


    +   - 8-bit timer/counter;

    - 8-bit prescaler (shared with Watchdog timer);

    - Programmable internal or external clock source;

    - Interrupt on overflow; and

    - Programmable external edge selection.


    Figure below illustrates the timer TMR0 schematic with all bits which logic state
    determine its operation. These bits are stored in the OPTION_REG register.'
