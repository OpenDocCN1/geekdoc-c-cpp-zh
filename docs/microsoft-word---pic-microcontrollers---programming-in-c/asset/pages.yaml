- img_proc: true
  md: '![](img/0d2d82b978afb5e58d1be89c0ad23d37_12_0.png)


    In the program, logic OR operation is performed in the same manner as logic AND
    operation.


    # NOT GATE


    The logic gate NOT has only one input and only one output. It operates in an extremely
    simple way. When logic zero (0) appears on its input, a logic one (1) appears
    on its output and vice versa. It means that this gate inverts the signal and is
    often called inverter, therefore.


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_12_1.png)


    In the program, logic NOT operation is performed upon one byte. The result is
    a byte with inverted bits. If byte bits are considered to be a number, the inverted
    value is actually a complement thereof. The complement of a number is a value
    added to which the number makes to reach the largest 8-digit binary number. In
    other words, the sum of an 8-digit number and its complement is always 255.


    # EXCLUSIVE OR GATE


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_12_2.png)


    The EXCLUSIVE OR (XOR) gate is a bit complicated comparing to other gates. It
    represents a combination of all of them. A logic one (1) appears on its output
    only when its inputs have different logic states.'
