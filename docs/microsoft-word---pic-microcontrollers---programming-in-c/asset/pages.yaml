    # FULL-BRIDGE MODE


    All four pins are used as outputs in the full-bridge mode. In practice, this mode
    is commonly used to run motors, providing a simple and full control of speed and
    rotation direction. There are two configurations of this mode: *Full Bridge-Forward
    and Full Bridge-Reverse.*


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_153_1.png)


    # FULL BRIDGE - FORWARD CONFIGURATION


    In *Forward* mode the following occurs:


    +   - Logic one (1) appears on the P1A pin (pin is active-high);

    - Pulse sequence appears on the P1D pin;

    - Logic zero (0) appears on the P1B and P1C pins (pins are active-low).


