    # CODE EDITOR


    A Code Editor is a central part of the compiler window used for writing a program.
    A large number of options used for setting its function and layout can be found
    in the Tools/Options menu [F12].


    # SOFTWARE SIMULATOR


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_70_0.png)


    Prior to starting the simulator, select the appropriate mode in the Project Settings
    Window (Build type - release) and click the Run /Start Debugger option.


    The compiler will be automatically set in simulation mode. As such, it monitors
    the state of register bits. It also enables you to execute the program by step
    while monitoring the operation of the microcontroller on the screen (i.e. simulation
    of operation).


    A few icons, used only for the operation of the simulator, will be added to the
    toolbar when setting the compiler in this mode.


    Step Into [F7] Run To Cursor [F4]

    Step Over [F8] Step Out [Shift+F9]


    They have the following meanings:


    Step Into - Click on this icon executes one program line in which the cursor is
    positioned.


    Step Over - This command is similar to the previous one. If the cursor is positioned
    in the line which calls a program routine then it will be executed first and the
    program proceeds with execution at the next program line. It seems as if one line
    is skipped even though the whole routine is executed. As a result, the state of
    registers change. This command is commonly used when it is necessary to speed
    up the execution of long program loops.


