    # FAIL-SAFE CLOCK MONITOR


    As its name suggests, the Fail-Safe Clock Monitor (FSCM) monitors the operation
    of external oscillator and allows the microcontroller to proceed with program
    execution though the external oscillator fails for some reason. In this case,
    the internal oscillator takes over its role.


