- img_proc: true
  md: "For the purpose of making some potentially dangerous situation more obvious,\
    \ control bits are activated by assembly instructions. Simply put, when entering\
    \ or exiting the assembly instruction in the program, the compiler doesn't save\
    \ data on currently active RAM bank, which means that in this program section,\
    \ bank selection depends on the SFR registers in use. When switching back to the\
    \ program section C, the control RP0 and RP1 must return the state they had before\
    \ 'assembly language adventure'. In this program, the problem is solved by using\
    \ the saveBank auxiliary variable which saves the state of these two bits.\n\n\
    ```\n/* Header **********************************************************************************/\n\
    \nint k = 0;\n\nchar saveBank;\n\nvoid main() {\n    ANSEL = 0; // All I/O pins\
    \ are configured as digital\n    ANSELH = 0;\n    PORTB = 0; // All port B pins\
    \ are set to 0\n    TRISB = 0; // Port B pins are configured as outputs\n    do\
    \ {\n        PORTB = ~PORTB; // Invert port B logic state\n        Delay_ms(100);\
    \ // 100ms delay\n        k++; // Increment k by 1\n    } while(k<20); // Remain\
    \ in loop while k<20\n    k=0; // Reset variable k\n```"
  merge: -1
  pgno: 253
- img_proc: true
  md: "```\nsaveBank = STATUS & 0b01100000; // Save the state of bits RP0 and RP1\n\
    \n// (bits 5 and 6 of the STATUS\nregister)\n\nasm {\n    // Start of assembly\
    \ sequence\n    bsf STATUS,RP0 // Select memory bank containing\nthe OSCCON\n\
    \    bcf STATUS,RP1 // register\n    bcf OSCCCON,6 // Select internal oscillator\n\
    \    LFINTOSC\n    bcf OSCCCON,5 // of 31KHz frequency\n    bcf OSCCCON,4\n  \
    \  bsf OSCCCON,0 // Microcontroller uses internal\noscillator\n} // End of assembly\
    \ sequence\n\nSTATUS &= 0b01001111; // Bits RP0 and RP1 return their\noriginal\
    \ state\n\nSTATUS |= saveBank;\n\ndo {\n    PORTB = ~PORTB; // Invert port B logic\
    \ state\n    Delay_ms(10); // 10 mS delay\n    k++; // Increment k by 1\n} while\
    \ (k<20); // Remain in loop while k<20\n```"
