  md: '# BITWISE OPERATORS


    Unlike logic operations being performed upon variables, the bitwise operations
    are performed upon single bits within operands. Bitwise operators are used to
    modify the bits of a variable. They are listed in the table below:


    | OPERAND | MEANING | EXAMPLE | RESULT |

    | --- | --- | --- | --- |

    | ~ | Bitwise complement | a = ~b | b = 5 |

    | << | Shift left | a = b << 2 | b = 1110011 a = 1110011 |

    | >> | Shift right | a = b >> 2 | b = 1110011 a = 00111110 |

    | & | Bitwise AND | c = a & b | a = 1110011 c = 11000000 |

    | | | Bitwise OR | c = a | b | a = 1110011 c = 11111111 |

    | ^ | Bitwise EXOR | c = a ^ b | a = 1110011 c = 00101111 |


    # HOW TO USE OPERATORS?


    +   - Except for assignment operators, two operators must not be written next
    to each other.


    ```

    x%12; // such expression will generate an error

    ```


    +   - Operators are grouped together using parentheses similar to arithmetic expressions.
    The expressions (nested) parentheses are calculated first. If necessary, multiple
    can be used.

    - Each operator has its priority and associativity as shown in the table.


    | PRIORITY | OPERATORS | ASSOCIATIVITY |

    | --- | --- | --- |

    | High | () [] -> | from left to right |


