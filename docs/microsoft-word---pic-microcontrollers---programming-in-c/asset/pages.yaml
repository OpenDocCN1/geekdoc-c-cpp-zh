  md: 'bits are connected to particular circuits on the chip (A/D converter, serial
    communication module, etc.), any change of their contents directly affects the
    operation of the microcontroller or some of its circuits. For example, the ADCON0
    register controls the operation of A/D converter. By changing its bits it is determined
    which port pin is to be configured as converter input, the moment conversion is
    to start as well as the speed of conversion.


    Another feature of these memory locations is that they have their names (both
    registers and their bits), which considerably simplifies the process of writing
    a program. Since high-level programming languages can use the list of all registers
    with their exact addresses, it is enough to specify the name of a register in
    order to read or change its contents.


    # RAM MEMORY BANKS


    The RAM memory is partitioned into four banks. Prior to accessing any register
    during program writing (in order to read or change its contents), it is necessary
    to select the bank which contains that register. Two bits of the STATUS register
    are used for bank selection to be discussed later. In order to simplify the operation,
    the most commonly used SFRs have the same address in all banks, which enables
    them to be easily accessed.'
