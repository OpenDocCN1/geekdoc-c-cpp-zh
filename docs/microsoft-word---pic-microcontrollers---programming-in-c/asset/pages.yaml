    # POWER SUPPLY CIRCUIT


    There are two things worth concerning the microcontroller power supply circuit:


    +   - Brown out is a potentially dangerous condition which occurs at the moment
    the microcontroller is being turned off or when the supply voltage drops to a
    minimum due to electric noise. As the microcontroller consists of several circuits
    with different operating voltage levels, this state can cause its out-of-control
    performance. In order to prevent it, the microcontroller uses a built-in circuit
    for brown out reset which resets the whole electronics as a state of emergency.

    - Reset pin is usually marked as MCLR (Master Clear Reset). It happens for external
    reset of the microcontroller by applying a logic zero (0) or one (1) to it, which
    depends on the type of the microcontroller. In the case the brown out circuit
    is not built in, a simple external circuit for brown out reset can be connected
    to the MCLR pin.


