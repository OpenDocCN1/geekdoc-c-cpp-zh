- img_proc: true
  md: 'The enhanced mode is available on CCP1 only. The CCP1 in enhanced mode basically
    doesn''t differ from the CCP1 in normal mode and enhancement refers to transmission
    of PWM signal to the output pins. Why is it important? Because the microcontrollers
    are more frequently used in electric motor control systems. These devices are
    not described herein, but if you ever had a chance to work on development of similar
    devices, you will recognize elements, until until recently, were used as external
    ones. We may say ‘used’ because all these elements are now integrated into the
    microcontroller and can operate in several different modes.


    # SINGLE OUTPUT PWM MODE


    A single output PWM mode is enabled only in the event that the P1M1 and P1M0 bits
    of the CCP1 register are cleared. In this case, one PWM signal can be simultaneously
    available on maximum of four different output pins. Besides, the PWM signal may
    appear in basic or inverted waveform. Signal distribution depends on the bits
    of the PSTRCON register, while its polarity depends on the CCPM1 and CCP1M0 bits
    of the CCP1 register.


    When an inverted output is in use, pins are low-active and pulses having the same
    waveform always generated in pairs: on the P1A and P1C pins and P1D pins, respectively.


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_151_0.png)


    # HALF-BRIDGE MODE


    In relation to the half-bridge mode, the PWM signal is the output on the P1A pin,
    while at the same time the complementary PWM signal is the output on the P1B pin.
    Such pulses activate MOSFET drivers in Half-Bridge mode which enable/disable current
    flow through the device.'
  merge: -1
  pgno: 151
- img_proc: true
  md: '![](img/0d2d82b978afb5e58d1be89c0ad23d37_152_0.png)


    It is very dangerous to switch on MOSFET simultaneously. The short circuit caused
    in that moment will be fatal. In order to avoid this, it is necessary to provide
    a short delay between switching drivers on and off. Such delay is marked as ''td''
    in figure below. The problem is solved by using the PDC0-PDC6 bits of the PWM1CON
    register.


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_152_1.png)


    As shown in figure below, the half-bridge mode can also be used to activate MOSFET
    drivers in the Full Bridge configuration:'
