- img_proc: true
  md: '![](img/0d2d82b978afb5e58d1be89c0ad23d37_201_0.png)


    The comparator voltage reference has 2 ranges containing 16 voltage levels. Range
    selection is controlled by the VRR bit of the VRCON converter. The selected voltage
    reference CVref may be output to the RA2/AN2 pin.


    Even though the main idea was to obtain varying voltage reference for the operation
    of analog modules, a simple A/D converter is obtained thereby as well. This converter
    is very useful in many situations. Its operation is under control of the VRCON
    register.


    # COMPARATORS AND INTERRUPT


    Every change of the logic state of any comparator''s output causes the flag bit
    CMIF of the register PIR to be set. Such changes will also cause an interrupt
    if the following bits are set:


    +   - The CIE bit of the PIE register = 1;

    - The PEIE bit of the INTCON register = 1; and

    - The GIE bit of the INTCON register = 1.


    If an interrupt is enabled, any change on the comparator''s output when the microcontroller
    is in Sleep mode can cause the microcontroller to exit that mode and proceed with
    normal operation.


    # OPERATION DURING SLEEP


    The comparator, if enabled before entering the Sleep mode, remains active during
    Sleep. If the comparator is not to wake up the device, power consumption can be
    minimized in the Sleep


