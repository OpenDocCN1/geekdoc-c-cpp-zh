    # RB6 AND RB7 PINS


    The PIC1F887 does not have any special pins for programming (the process of writing
    a program to ROM). Port, normally available as general-purpose I/O pins, are used
    for this purpose. To be more precise, it is port B pins used for clock (RB6) and
    data transfer (RB7) during program loading. Besides, it is necessary to apply
    power supply voltage Vdd (5V) as appropriate voltage Vpp (12-14V) for FLASH memory
    programming. Vpp voltage is applied to the MCLR pin. You don''t have to think
    of all details concerning this process, which one of the voltages is applied first
    if the programmer''s electronics is in charge of that. What is very important
    here is that the program may be loaded to the microcontroller even after soldering
    it onto the target device. Normally, the loaded program can also be changed in
    the same way. This function is called ICSP (In-Circuit Serial Programming). In
    order to use it properly, it is necessary to plan ahead.


    A piece of cake! It is only necessary to install a miniature 5-pin connector onto
    the target device so to provide the microcontroller with programming voltages.
    In order to prevent these voltages from interfering with other device electronics
    connected to microcontroller pins, all additional peripheral devices should be
    disconnected during the process of programming resistors or jumpers.


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_118_0.png)


    As you can see, voltages applied to programmer''s socket pins are the same as
    those used for ICSP programming


