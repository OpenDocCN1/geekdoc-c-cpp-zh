    # # LCD Memory


    LCD display contains three memory blocks:


    +   * DDRAM Display Data RAM;

    * CGRAM Character Generator RAM; and

    * CGROM Character Generator ROM.


    # # DDRAM Memory


    DDRAM memory is used for storing characters to be displayed. The size of this
    memory is capable of storing 80 characters. Some memory locations are directly
    connected to the characters on display.


    Everything works quite simple; it is enough to configure the display to increment
    addresses automatically (shift right) and set the starting address for the message
    to be displayed (for example 00 hex).


    Afterwards, all characters sent through lines D0-D7 will be displayed in the message
    format we are used to- from to right. In this case, displaying starts from the
    first field of the first line because the initial address is 00 hex. If more than
    16 characters are sent, all of them will be memorized, but only the first sixteen
    characters will be visible. In order to display the rest of them, the shift command
    should be used. Virtually, everything looks as if the LCD display is a window
    which shifts left-right over memory locations containing different characters.
    In reality, this is how the effect of the message shifting over the screen has
    been created.


    www.raguvaran.puzz.com'
