  md: '# STANDARD ANSI LIBRARIES


    The functions of C language were not standardized in the beginning and software
    manufacturers modified according to their needs. But C language became very popular
    soon and it was difficult to keep everything under control. It was necessary to
    introduce a sort of standard to put things in order. The established is called
    ANSI C and contains 24 libraries with functions. These libraries are usually provided
    with every C compiler as the most frequent operations performed using them.


    ```

    <assert.h> <complex.h> <ctype.h>


    <errno.h> <fenv.h> <float.h>


    <inttypes.h> <iso646.h> <limits.h>


    <locale.h> <math.h> <setjmp.h>


    <signal.h> <stdarg.h> <stddb.h>


    <stdint.h> <stddef.h> <stdio.h>


    <stdlib.h> <string.h> <tgmath.h>


    <time.h> <wchar.h> <wctype.h>

    ```


    Everything you have read far about programming in C language is just a theory.
    It is useful to know, but don''t forget that this programming language is not
    much in connection with something concrete and tangible. You will experience many
    problems with accurate names of registers, their addresses, names of particular
    control bits and others while writing your first program in C language. The bottom
    line is that it is not sufficient to be familiar with the theory of C language
    to make the microcontroller do something useful.


