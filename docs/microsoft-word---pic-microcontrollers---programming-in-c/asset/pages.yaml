  md: 'There are two types of assignments in C language:


    +   - Simple operators assign values to variables using the common ''='' character.
    For example: a = 8

    - Compound assignments are specific to C language and consist of two characters
    as shown in the table. An expression can be written in a different way as well,
    but this one provides efficient machine code.


    | OPERATOR | Expression | Equivalent |

    |---|---|---|

    | += | a += 8 | a = a + 8 |

    | -= | a -= 8 | a = a - 8 |

    | *= | a *= 8 | a = a * 8 |

    | /= | a /= 8 | a = a / 8 |

    | %= | a %= 8 | a = a % 8 |


    # INCREMENT AND DECREMENT OPERATORS


    Increment and decrement by 1 operations are denoted by ''++'' and ''--''. These
    characters can either precede or follow a variable. In the first case (++), the
    variable will be first incremented by 1, then used in expression. Otherwise, the
    variable will be first used in expression, then incremented by 1. The same applies
    to decrement operation.


    | OPERATOR | | DESCRIPTION |

    |---|---|---|

    | ++ | ++a | Variable "a" is incremented by 1 |

    | -- | --b | Variable "b" is decremented by 1 |


    # RELATIONAL OPERATORS


    Relational operators are used in comparisons for the purpose of comparing two
    variables which can be integers (int) or floating point numbers (float). If an
    expression evaluates to true, a 1 is returned. Otherwise, a 0 is returned. This
    is used in expressions such as ''if the expression is true then...''


    | OPERATOR | MEANING | EXAMPLE | TRUTH CONDITION |

    |---|---|---|---|

    | > | is greater than | b > a | if b is greater than a |'
