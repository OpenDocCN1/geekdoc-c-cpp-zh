    # 4.17 EXAMPLE 15


    # Using touch panel...


    A touch panel is a thin, self-adhesive transparent panel placed over the screen
    of a graphic LCD. It is very sensitive to pressure so that even a soft touch causes
    some changes on output signal. There are few types of touch panel. The simplest
    one is the resistive touch panel.


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_297_0.png)


    It consists of two transparent rigid foils, forming a ''sandwich'' structure,
    that have resistive layers on their inner sides. The resistance of these layers
    usually does not exceed 1K. The opposite sides of the foils has contacts available
    for use through a flat cable.'
  merge: -1
  pgno: 297
- img_proc: true
  md: '![](img/0d2d82b978afb5e58d1be89c0ad23d37_298_0.png)


    The process of determining coordinates of the point in which the touch panel is
    pressed can be broken up into two steps. The first one is the determination of
    the X coordinate and the second one is the determination of the Y coordinate of
    the point.


    In order to determine the X coordinate, it is necessary to connect the left contact
    on the surface A to ground and the right contact to the power supply. This enables
    a voltage divider to be obtained by pressing the touch panel. The value of the
    divider is read on the bottom contact of the surface B. Voltage can be in the
    range of 0V to the power supply and depends on the X coordinate. If the point
    is closer to the left contact of the surface A, the voltage will be closer to
    0V.


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_298_1.png)


    In order to determine the Y coordinate, it is necessary to connect the bottom
    contact on the surface B to ground, and the upper contact to power supply. In
    this case, the voltage is read on the left contact of the surface A.


    In order to connect a touch panel to the microcontroller it is necessary to create
    a circuit for touch panel control. By means of this circuit, the microcontroller
    connects appropriate contacts of the touch panel to ground and the power supply
    (as described above) to determine the X and Y coordinates. The bottom contact
    of the surface B and left contact of the surface A are connected to the microcontroller''s
    A/D converter. The X and Y coordinates are determined by measuring voltage on
    these contacts, respectively. The software consists of writing a menu on graphic
    LCD, turning the circuit for touch panel on/off (driving touch panel) and reading
    the values of A/D converter which actually represent the X and Y coordinates of
    the point.


    Once the coordinates are determined, it is possible to decide what we want the
    microcontroller to do. In this example, microcontroller turns on/off two digital
    pins, connected to LED diodes and B.


