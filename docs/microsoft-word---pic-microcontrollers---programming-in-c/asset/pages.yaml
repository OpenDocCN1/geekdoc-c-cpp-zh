    In other words, the state of register bits is changed from within the program,
    registers run small circuits within the microcontroller, these circuits are via
    microcontroller pins connected to peripheral electronics which is used for...
    Well, it''s up to you.


    # INPUT / OUTPUT PORTS


    In order to make the microcontroller useful, it has to be connected to additional
    electronics, i.e. peripherals. Each microcontroller has one or more registers
    (called ports) connected to the microcontroller pins. Why input/output? Because
    you can change a pin function as wish. For example, suppose you want your device
    to turn on/off three signal LEDs and simultaneously monitor the logic state of
    five sensors or push buttons. Some of the ports need to be configured so that
    there are three outputs (connected to LEDs) and five inputs (connected to sensors).
    It is simply performed by software, which means that a pin function can be changed
    during operation.


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_14_1.png)


    One of important specifications of input/output (I/O) pins is the maximum current
    they can handle. For most microcontrollers, current obtained from one pin is sufficient
    to activate an LED or some


    www.raguvaran.puzl.com'
