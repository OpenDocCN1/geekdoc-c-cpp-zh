  md: 'This compiler provides special tools which considerably simplify the process
    of writing a program. All these tools are available from the Tools menu. In the
    following text we are going to give a brief description of all of them.


    # PICFLASH PROGRAMMER


    PICflash programmer is a stand-program which can operate independently of the
    compiler, i.e. it can be used as a separate program. However, in this case, its
    operation is closely related to the operation of the compiler so that it can be
    activated from the compiler. If installed, the PIC flash programmer is activated
    by selecting Tools/me_Programmer or pressing [F11]. A window that appears contains
    options to be used for the process of microcontrollers.


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_72_0.png)


    It''s right time to explain the operation of the programmer. As you know, the
    compiler is a software which compiles the program written in a higher programming
    language into executable code, i.e. Hex code. That''s the code the microcontroller
    understands and executes. The programmer, which loads this code into the chip,
    is comprised of software and hardware together called - PICflash. Programmer''s
    hardware provides all necessary voltage levels and socket for placing the microcontroller
    in. Programmer''s hardware is installed on the PC and is used to pass on the Hex
    code to hardware over USB cable. This book provides discussion on the software
    only.


    # USART TERMINAL'
