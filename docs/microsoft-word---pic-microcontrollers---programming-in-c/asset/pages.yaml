- img_proc: true
  md: '# EXTERNAL OSCILLATOR IN EC MODE


    The external clock (EC) mode uses external oscillator as a clock source. The maximum
    frequency of this clock is limited to 20 MHz.


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_211_0.png)


    The advantages of the external oscillator when configured to operate in EC mode:


    +   - The independent external clock source is connected to the OSC1 input and
    the OSC2 is available as a general purpose I/O;

    - It is possible to synchronize the operation of the microcontroller with the
    rest of on-board electronics;

    - In this mode microcontroller starts operation immediately after the power is
    on. No time delay is required for frequency stabilization; and


    www.raguvaran.puzl.com'
  merge: -1
  pgno: 211
- img_proc: true
  md: '+   • Temporary disabling the external clock source causes device to stop operation,
    while leaving all data intact. After restarting the external clock, the device
    proceeds with operation as if nothing has happened.


    # External Oscillator


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_212_0.png)


    # EXTERNAL OSCILLATOR IN LP, XT OR HS MODE


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_212_1.png)


    The LP, XT and HS modes use external oscillator as a clock source the frequency
    of which is determined by quartz crystal or ceramic resonators connected to the
    OSC1 and OSC2 pins. Depending on the features of the component in use, select
    one of the following modes:


    +   • LP mode - (Low Power) is used for low-frequency quartz crystal only. This
    mode is designed to drive only 32.768 kHz crystals usually embedded in quartz
    watches. It is easy to recognize by small size and specific cylindrical shape.
    The current consumption is the least of the three modes.

    • XT mode is used for intermediate-frequency quartz crystals up to 8 MHz. The
    current consumption is the medium of the three modes.

    • HS mode - (High Speed) is used for high-frequency quartz crystals over 8 MHz.
    The current consumption is the highest of the three modes.'
  merge: -1
  pgno: 212
- img_proc: true
  md: '![](img/0d2d82b978afb5e58d1be89c0ad23d37_213_0.png)


    # # CERAMIC RESONATORS IN XT OR HS MODE


    Ceramic resonators are by their features similar to quartz crystals and are connected
    in the same way, therefore, Unlike quartz crystals, they are cheaper and oscillators
    containing them have a bit poorer characteristics. They are used for clock frequencies
    ranging from 100 kHz to 20 MHz.


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_213_1.png)


    # # EXTERNAL OSCILLATOR IN RC AND RCIO MODE


    There are certainly many advantages in using elements for frequency stabilization,
    but sometimes they are really unnecessary. In most cases the oscillator may operate
    at frequencies not precisely defined so that embedding of such elements is a waste
    of money. The simplest and cheapest solution in these situations is to use one
    resistor and one capacitor for the operation of oscillator. There are two modes:


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_213_2.png)'
  merge: -1
  pgno: 213
- img_proc: true
  md: 'RC mode. When the external oscillator is configured to operate in RC mode,
    the OSC1 pin should be connected to the RC circuit as shown in figure on the right.
    The OSC2 pin outputs the RC oscillator frequency divided by 4. This signal may
    be used for calibration, synchronization or other application requirements.


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_214_0.png)


    RC mode. Likewise, the RC circuit is connected to the OSC1 pin. This time, the
    available OSC2 pin is used as an additional general-purpose I/O pin.


    In both cases, it is recommended to use components as shown in figure.

    The frequency of such an oscillator is calculated according to the formula f =
    1/T in this:


    +   - f = frequency [Hz];

    - T = R * C = time constant [s];

    - R = resistor resistance [Ω]; and

    - C = capacitor capacity [µF].


    # INTERNAL CLOCK MODES


    The internal oscillator circuit consists of two separate oscillators that can
    be selected as the system clock source.


    The HFINTOSC oscillator is factory calibrated and operates at 8 MHz. Its frequency
    can be set by the user via software using bits of the OCTUNE register.


    The LFINTOSC oscillator is not factory calibrated and operates at 31kHz.


    Similar to the external oscillator, the internal one can also operate in several
    modes. The mode of operation is selected in the same way as with external oscillator
    using bits of the Config Word register. In other words, everything is performed
    within PC software prior to writing a program into the microcontroller.'
  merge: -1
  pgno: 214
- img_proc: true
  md: '![](img/0d2d82b978afb5e58d1be89c0ad23d37_215_0.png)


    # INTERNAL OSCILLATOR IN INTOSC MODE


    In this mode, the OSC1 pin is available as a general purpose I/O, while the OSC2
    pin selected internal oscillator frequency divided by 4.


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_215_1.png)


    # INTERNAL OSCILLATOR IN INTOSCIO MODE


    In this mode, both pins are available as a general purpose I/O.


    # INTERNAL OSCILLATOR SETTINGS


    The internal oscillator consists of two separate circuits.


    +   1. The high-frequency internal oscillator HFINTOSC is connected to the postscaler
    (frequency divider). It is factory calibrated and operates at 8MHz. By using postscaler,
    this oscillator can output clock sources at one out of seven frequencies. The
    frequency selection is performed within software using the IRCF2, IRCF1 and IRCF0
    pins of the OSCCON register.


    HFINTOSC is enabled by selecting one out of seven frequencies (between 8 MHz and
    125 kHz) and setting the System Clock Source (SCS) bit of the OSCCON register.
    As seen in figure below, everything is performed by using bits of the OSCCON register.'
  merge: -1
  pgno: 215
- img_proc: true
  md: '![](img/0d2d82b978afb5e58d1be89c0ad23d37_216_0.png)


    The low-frequency oscillator LFINTOSC is uncalibrated and operates at 31 kHZ.
    It is enabled by selecting this frequency (bits of the OSCCON register) and setting
    the SCS bit of the same register.


    # TWO-SPEED CLOCK Start-UP MODE


    Two-Speed Clock Start-up mode is used to provide additional power savings when
    the microcontroller operates in sleep mode. What is this all about?


    When configured to operate in LP, XT or HS mode, the external oscillator will
    be switched off on transition to *sleep* in order to reduce the overall power
    consumption of the device.


    When the conditions for wake-up are met, the microcontroller will not immediately
    start to operate because it has to wait for the clock signal frequency to become
    stable. Such delay lasts for exactly 1024 pulses, then the microcontroller proceeds
    with program execution. It usually happens that only a few instructions are performed
    before the microcontroller is set back to *Sleep Mode*. It means that most of
    time as well as power obtained from batteries is wasted. The problem is solved
    by using an internal oscillator for program execution while the counting of 1024
    pulses is in progress. As the external oscillator frequency becomes stable, it
    will automatically take over the *leading role*. The whole process is enabled
    by setting one bit of the configuration word. In order to program the microcontroller,
    it is necessary to select the *Int-Ext Switchover* option in software.'
  merge: -1
  pgno: 216
