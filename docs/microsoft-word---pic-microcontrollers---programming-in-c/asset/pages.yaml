    # CENTRAL PROCESSOR UNIT (CPU)


    We are not going to bore you with the operation of the CPU at this stage. However,
    we will just state that the CPU is manufactured with RISC technology as it is
    an important factor when deciding which microcontroller to use.


    RISC stands for Reduced Instruction Set Computer, which gives the PIC16F877 two
    great advantages:


    +   - The CPU only recognizes 35 simple instructions. Just to mention that in
    order to program other microcontrollers in assembly language it is necessary to
    know more than 200 instructions by heart.


