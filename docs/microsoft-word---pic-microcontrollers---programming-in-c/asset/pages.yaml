    # GENERAL-PURPOSE REGISTERS


    General-purpose registers are used for storing temporary data and results created
    during operation. For example, if the program performs counting (products on the
    assembly line), it is necessary to have a register which stands for what we in
    everyday call ''sum''. Since the microcontroller is not creative at all, it is
    necessary to specify the address of some general purpose register and assign it
    that function. A simple program to increment the value of this register by 1,
    after each product passes through a sensor, should be created.


    Now the microcontroller can execute the program as it knows what and where the
    sum to be incremented. Similarly, each program variable must be preassigned some
    of the general-purpose registers.


