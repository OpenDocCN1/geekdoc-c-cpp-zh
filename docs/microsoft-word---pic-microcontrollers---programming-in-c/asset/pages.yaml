    # CONSTANTS


    A constant is a number or a character having fixed value that cannot be changed
    during program execution. Unlike variables, constants are stored in the flash
    program memory of the microcontroller for the purpose of saving valuable space
    of RAM. The compiler recognizes by their name and prefix const.


    # INTEGER CONSTANTS


    Integer constants can be decimal, hexadecimal, octal or binary. The compiler recognizes
    their format on the basis of the prefix added. If the number has no prefix, it
    is considered decimal by default. The type of a constant is automatically recognized
    by its size. In the following example, the constant MINIMUM will be automatically
    considered a signed integer and stored within two bytes of Flash memory (16 bits):


    | FORMAT | PREFIX | EXAMPLE |

    |---|---||

    | Decimal | | const MAX = 100 |

    | Hexadecimal | 0x or 0X | const MAX = 0xFF |


