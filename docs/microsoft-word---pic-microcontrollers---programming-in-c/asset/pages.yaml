    # In Short


    When using the TMR2 timer, you should know several specific details related to
    its registers:


    +   - At the moment of powering on, the PR register contains the value FH.

    - Both prescaler and postscaler are cleared by writing to the TMR2 register.

    - Both prescaler and postscaler are cleared by writing to the T2CON register.

    - On any reset - you guess, both prescaler and postscaler are cleared.


    CCP modules can operate in many different modes, which makes them the most complicated
    to deal with. Just try to analyze their operation on the basis of the tables tasks
    describing bit functions and you will understand what we are talking about. So,
    if you use some of the CCP module, first select the mode you need, analyze the
    appropriate figure and change bits of the registers. Or else...


    # 3.7 CCP MODULES


    The CCP module (Capture/Compare/PWM) is a peripheral which allows the user to
    time and control different events.


    Capture Mode provides access to the current state of a register which constantly
    changes its value. In this, it is the timer TMR1 register.


    Compare Mode constantly compares values of two registers. One of them is the timer
    TMR1 register. This circuit also allows the user to trigger an external event
    when a predetermined amount of time has expired.


    PWM (Pulse Width Modulation) can generate signals of varying frequency and duty
    cycle on one or more output pins.


    The PIC16F887 microcontroller has two CCP modules- CCP1 and CCP2.


    Both of them are identical in normal mode of operation, while the Enhanced PWM
    features are available on CCP1 only. This is why this chapter gives a detailed
    description of the CCP1 module. Concerning CCP2, only the features distinguishing
    it from CCP1 will be covered.


    www.raguvaran.puzz.com'
  merge: -1
  pgno: 136
- img_proc: true
  md: '# CCP1 MODULE


    A central part of this circuit is a 16-bit register CCP1 which consists of the
    CCPR1L and CCPR1H registers. It is used for capturing or comparing with binary
    numbers stored in the register TMR1 (TMR1H and TMR1L).


    # Module CCPR1 Registers


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_137_0.png)


    If enabled by software, the timer TMR1 reset may occur on match in Compare mode.
    Besides, the CCP1 module can generate PWM signals of varying frequency and duty
    cycle.


    Bits of the CCP1CON register are in control of the CCP1 module.


    # CCP1 IN CAPTURE MODE


    In this mode, the timer register TMR1 (consisting of TMR1H and TMR1L) is copied
    to the CCP register (consisting of CCPR1H and CCPR1L) in the following situations:


    +   * Every falling edge (1 -> 0) on the RC2/CCP1 pin;

    * Every rising edge (0 -> 1) on the RC2/CCP1 pin;

    * Every 4th rising edge (0 -> 1) on the RC2/CCP1 pin; and

    * Every 16th rising edge (0 -> 1) on the RC2/CCP1 pin.


    A combination of the four bits (CCP1M3 - CCP1M0) of the control register determines
    which of these events will cause 16-bit data to be transferred. In addition, the
    following conditions be met:


    +   * The RC2/CCP1 pin must be configured as an input; and

    * TMR1 module must operate as timer or synchronous counter.'
  merge: -1
  pgno: 137
- img_proc: true
  md: "# Flag bit CCP1IF\n\n![](img/0d2d82b978afb5e58d1be89c0ad23d37_138_0.png)\n\n\
    The flag bit CCP1IF is set when capture is made. If the CCP1IE of the PIE1 register\
    \ is set when it happens, an interrupt occurs.\n\nWhen the CCP1 module exits the\
    \ capture mode, an unwanted capture interrupt may be generated. In order to avoid\
    \ this, both a bit enabling CCP1IE interrupt and flag CCP1IF should be cleared\
    \ prior to any change occurs in the control register.\n\nUnwanted interrupts may\
    \ also be generated by switching from one capture prescaler to another. To avoid\
    \ this, the CCP1 module should be temporarily switched off before changing the\
    \ prescaler.\n\nThe following program sequence, written in assembly language,\
    \ is recommended:\n\n```\nBANKESEL CCP1CON\nCLRF CCP1CON ;CONTROL REGISTER IS\
    \ CLEARED\n            ;CCP1 MODULE IS OFF\n            ;NEW PRESCALER MODE IS\
    \ SELECTED\nMOVLW XX\nMOVF CCP1CON ;NEW VALUE IS LOADED TO THE CONTROL REGISTER\n\
    \            ;CCP1 MODULE IS SIMULTANEOUSLY SWITCHED ON\n```\n\nLet's do it in\
    \ microC...\n\n```\nASM {\n    BANKESEL CCP1CON\n    CLRF CCP1CON // CONTROL REGISTER\
    \ IS CLEARED\n        //CCP1 MODULE IS OFF\n    MOVLW XX // NEW PRESCALER MODE\
    \ IS SELECTED\n    MOVF CCP1CON // NEW VALUE IS LOADED TO THE CONTROL REGISTER\n\
    \        //CCP1 MODULE IS SIMULTANEOUSLY SWITCHED ON\n}\n```\n\nwww.raguvaran.puzzl.com"
  merge: -1
  pgno: 138
- img_proc: true
  md: '# CCP1 IN COMPARE MODE


    In this mode, the value stored in the CCP register is constantly compared to the
    value stored in the timer register TMR1. When a match occurs, the logic state
    of the RC2/CCP1 output pin may be changed, which depends on the state of bits
    in the control register (CCP1M3 - CCP1M0). The flag-bit CCP1IF will be simultaneously
    set.


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_139_0.png)


    To set the CCP1 module to operate in this mode, two conditions must be met:


    +   * The RC2/CCP1 pin must be configured as an output; and

    * Timer TMR1 must be synchronized with internal clock.


    # CCP1 IN PWM MODE


    Signals of varying frequency and duty cycle have a wide range of application in
    automation. A typical example is a power control circuit. Refer to figure below.
    If a logic zero (0) indicates the switch-off and a logic one (1) indicates the
    switch-on, the electrical power that load consumers will be directly proportional
    to the pulse duration. This ratio is often called Duty Cycle.'
  merge: -1
  pgno: 139
- img_proc: true
  md: 'Another example, common in practice, is the use of PWM signals in the circuit
    for generating signals of arbitrary waveforms such as sinusoidal waveform. See
    figure below:


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_140_0.png)


    Devices which operate in this way are often used in practice as adjustable frequency
    drivers controlling the electric motor (speed, acceleration, deceleration etc.).'
  merge: -1
