  md: 'Even the microcontroller has a built-in oscillator, it cannot operate without
    external components that stabilize its operation and determine its frequency (operating
    speed of the microcontroller). Depending on elements in use as well as their frequencies,
    the oscillator can run in four different modes:


    +   * LP - Low Power Crystal;

    * XT - Crystal / Resonator;

    * HS - High speed Crystal / Resonator; and

    * RC - Resonator / Capacitor.


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_228_0.png)


    Why are these so important? Owinging to the fact that it is almost impossible
    to make a stable oscillator that operates over a wide frequency range, the microcontroller
    must know which crystal is connected to that it can adjust the operation of its
    internal electronics to it. This is why all programs use for chip loading contain
    an option for oscillator mode selection. See figure on the left.


    # Quartz Crystal


    When the quartz crystal is used for frequency stabilization, a built-in oscillator
    operates at a precise frequency which is not affected by changes in temperature
    and power supply voltage. This frequency is usually labeled on the crystal casing.


    Apart from the crystal, capacitors C1 and C2 must also be connected as per schematic
    below. Therefore, the values provided in the table below should be considered
    as a recommendation, not as a strict rule.'
