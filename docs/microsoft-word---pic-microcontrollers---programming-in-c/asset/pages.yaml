    EEPROM is a separate memory segment, not part of program memory (ROM), nor data
    memory (RAM). Even though these memory locations are not easily and quickly accessed
    as other registers, their purpose is irreplaceable the EEPROM data is permanently
    saved after the loss of power and can be changed at any moment. These exceptional
    features make each byte of EEPROM valuable.


    # 3.11 EEPROM MEMORY


    The PIC16F887 microcontroller has 256 locations of data EEPROM controlled by the
