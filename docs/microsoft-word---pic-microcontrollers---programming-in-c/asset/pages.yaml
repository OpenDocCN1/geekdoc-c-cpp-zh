    # BYTE


    A byte consists of eight bits grouped together. If a bit is a digit, it is logical
    that bytes represent numbers. All mathematical operations can be performed upon
    them, like upon common decimal numbers. Similar to digits of any number, bits
    do not have the same significance either. The greatest value has the leftmost
    called the most significant bit (MSB). The rightmost bit has the least value and
    is therefore called the least significant bit (LSB). Since eight zeros and ones
    of one byte can be combined in 256 different ways, the largest decimal number
    which can be represented by one byte is 255 (one combination represents a zero).


    A nibble is referred to as half a bit. Depending on which half of the register
    we are talking about (left or right), there are ''high'' and ''low'' nibbles,
    respectively.


    # "High nibble"


    # "Low nibble"


    | Bit 7 | Bit 6 | Bit 5 | Bit 4 | Bit 3 | Bit 2 | Bit 1 | Bit 0 |

    | MSB - Most Significant Bit | LSB - Least Significant Bit |


    Have you ever wondered what electronics within digital integrated circuits, microcontrollers
    or processors look like? What do circuits performing complicated mathematical
    operations and making decisions look like? Do you know that their seemingly complicated
    schematic comprise only a few different elements called logic circuits or logic
    gates?


    # 1.3 MUST KNOW DETAILS


    The operation of these elements is based on principles established by a British
    mathematician George Boolean in the 19th century-even before the first bulb was
    invented. Originally, the main idea was to express logic forms through algebraic
    functions. Such thinking was soon transformed into a practical product which far
    evaluated in what today is known as AND, OR or NOT logic circuits. The principle
    of their operation is known as Boolean algebra.


    # LOGIC CIRCUITS


    Some of the program instructions give the same results as logic gates. The principle
    of their operation will be discussed in the text below.


