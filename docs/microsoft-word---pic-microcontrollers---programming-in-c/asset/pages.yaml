    in figure above the right, will appear. This is how the EEPROM memory within the
    microcontroller looks like. If you want to change its contents after loading the
    program into the microcontroller this is the right place to do it. If a new content
    is data of specific type (char, int or double), then you should select it, enter
    the value in the Edit Value field and click Edit. Then click the Save button to
    save the data as a document with .hex extension. If the Use EEPROM in Project
    option is active, the data will be automatically loaded into the chip during the
    process of programming.


