  md: "The microC PRO for PIC compiler has an sbit data type which provides access\
    \ to registers, SFRs, variables, etc. In order to declare a bit of a variable,\
    \ it is sufficient to write:\n\n```\nextern sbit Some_Bit;      // Some_Bit is\
    \ defined\nchar MyVar;\nsbit Some_Bit at MyVar.F0;  // This is where Some_Bit\
    \ is declared\n...\nvoid main() {\n  ...\n}\n```\n\nIf you declare an sbit variable\
    \ in a unit so as to point it to a specific bit of register, it is necessary to\
    \ use the keyword sfr in declaration, because you are pointing it to the variable\
    \ defined as sfr variable:\n\n```\nextern sfr sbit Abit;      // Abit is precisely\
    \ defined\n...\nsbit Abit at PORTB.F0;      // Now, Abit is declared\nvoid main()\
    \ {\n  ...\n}\n```\n\n# BIT TYPE\n\nThe mikroC PRO for PIC compiler provides a\
    \ bit data type that may be used for variable declarations. It cannot be used\
    \ for argument lists and function-return values.\n\n```\nbit bf;      // Valid\
    \ bit variable\nbit *ptr;   // Invalid bit variable. There are no pointers to\
    \ bit variables\n```"
