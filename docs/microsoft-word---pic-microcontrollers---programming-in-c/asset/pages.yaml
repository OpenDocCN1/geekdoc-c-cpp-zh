- img_proc: true
  md: 'other low-current device (10-20 mA). The more I/O pins, the lower maximum current
    of one pin. In other words, the maximum current stated in the data specifications
    sheet for the microprocessor is shared across all I/O ports.


    Another important pin function is that it can have pull-up resistors. These resistors
    connect pins to the positive power supply voltage and come into effect when the
    pin is configured as an input connected to a mechanical switch or a push button.
    Newer versions of microcontrollers have pull-up resistors configurable by software.


    Each I/O port is usually under control of the specialized SFR, which means that
    each bit of that register determines the state of the corresponding microcontroller
    pin. For example, by writing logic one (1) to a bit of the control register (SFR),
    the appropriate port pin is automatically configured as an input and voltage brought
    to it can be read as logic 0 or 1. Otherwise, by writing zero to the SFR, the
    appropriate port pin is configured as an output. Its voltage (0V or 5V) corresponds
    to the state of appropriate port register bit.


    # MEMORY UNIT


    Memory is part of the microcontroller used for data storage. The easiest way to
    explain it is to compare it with a filing cabinet with many drawers. Suppose,
    the drawers are clearly marked so that contents can be easily found out by reading
    the label on the front of the drawer.


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_15_0.png)


    Similarly, each memory address corresponds to one memory location. The contents
    of any memory location can be accessed and read by its addressing. Memory can
    either be written to or read from. There are several types of memory within the
    microcontroller:


    # READ ONLY MEMORY (ROM)'
