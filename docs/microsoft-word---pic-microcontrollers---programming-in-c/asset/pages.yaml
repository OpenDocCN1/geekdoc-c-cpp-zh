    # CCP2 MODULE


    Excluding the different names of registers and bits, this module is a very good
    copy of the CCP1 module set in normal mode. There is only one true difference
    between them when CCP2 operates in Compare mode.


    The difference refers to the timer T1 reset signal. Namely, if A/D converter is
    enabled, at the moment the values of the TMR1 and CPR2 registers match, the timer
    T1 reset signal will automatically start A/D conversion.'
