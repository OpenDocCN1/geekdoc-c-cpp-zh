    # ## DATA TYPE CONVERSION


    The main data types are put in hierarchical order as follows:


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_52_0.png)


    If two operands of different type are used in an arithmetic operation, the lower
    priority operand is automatically converted into the higher priority operand type.
    In expressions free from assignment operation, the result is obtained in the following:


    +   - If the highest priority operand is of type double, then types of all other
    operands in the expression as well as the result are automatically converted into
    type double.

    - If the highest priority operand is of type long, then types of all other operands
    in the expression as well as the result are automatically converted into type
    long.

    - If the operands of long or char type, then types of all other operands in the
    expression as well as the result are automatically converted into type int.


    Auto conversion is also performed in assignment operations. The result of the
    expression right from the assignment operator is always converted into the type
    of variable left from the operator. If the result is of higher-ranked type, it
    is truncated or rounded in order to match the type of variable. When converting
    real data into integer, numbers following the decimal point are always truncated.


