  md: '# TMR1ON - Timer1 On


    +   - 1 - Enable timer TMR1.

    - 0 - Stop timer TMR1.


    # In Short


    In order to use the timer TMR1 properly, it is necessary to perform the following:


    +   - Since it is not possible to turn off the prescaler, its rate should be adjusted
    by using bits TCKPS1 and TCKPS0 of the register T1CON (Refer to table).

    - Select the mode by the TMR1CS bit of the same register (TMR1CS: 0=clock source
    is quartz oscillator, 1=the clock source is supplied externally).

    - By setting the T1OSEN bit of the same register, the oscillator is enabled and
    the TMR1H and TMR1L registers are incremented on every clock input. Counting stops
    by clearing this bit.

    - The prescaler is cleared by clearing or writing to the counter registers.

    - By filling both registers, the flag TMR1IF is set and counting starts from zero.


    # 3.6 Timer TMR2


    Timer TMR2 module is an 8-bit timer which operates in a very specific way.


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_134_0.png)


    Pulses from the quartz oscillator pass through the prescaler of the rate of which
    may be changed by combining the TCKPS1 and TCKPS0 bits. The output is used to
    increment the TMR2 register starting from 00h. The values of TMR2 and PR2 are
    constantly compared and the TMR2 register keeps on being incremented until it
    matches the value in PR2. When the match occurs, the TMR2 register is automatically
    cleared to 00h. The timer TMR2 postscaler is incremented and its output is used
    to generate an interrupt if it is needed.


    The TMR2 and PR2 registers are fully readable and writable. Counting may be stopped
    by clearing the TMR2ON bit, which results in power saving.

    www.raghavuan.puzzl.com'
