  md: 'Thanks to these features, the port B pins are commonly used for checking push
    buttons on the keyboard because they unerringingly register any button press.
    Thus, there is no need to ''scan'' these inputs all the time.


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_117_0.png)


    When the X, Y and Z pins are configured as outputs to logic one (1), it is only
    necessary to wait for an interrupt request which arrives upon any button press.
    After that, by combining zeros and ones on these outputs it is checked which push
    button is pressed.


    Let''s do it in microC...


    ```

    * The PORTB.1 pin is configured as a digital input. Any change of its logic state
    will cause an .i.n.terupt. It also has a pull-up resistor. All other PORTB pins
    are digital outputs.

    ANSEL = ANSILH = 0; // All I/O pins are configured as digital

    PORTB = 0; // All PORTB pins are cleared

    TRISB = 0b00000010; // All PORTB pins except PORTB.1 are configured as outputs

    RBPU = 0; // Pull-up resistors are enabled

    WPU1 = 1; // Pull-up resistor is connected to PORTB.1 pin

    ICB1 = 1; // The PORTB.1 pin may cause an interrupt on logic

    RBIE = GIE = 1; // Interrupt is enabled

    ```


