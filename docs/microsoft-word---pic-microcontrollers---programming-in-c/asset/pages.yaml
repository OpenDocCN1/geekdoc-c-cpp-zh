- img_proc: true
  md: '![](img/0d2d82b978afb5e58d1be89c0ad23d37_175_0.png)


    As seen in figure below, the central part of the SPI module consists of two registers
    connected to pins for reception, transmission and synchronization.


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_175_1.png)


    The Shift register (SSPRS) is directly connected to the microcontroller pins and
    used for data transmission in serial format. The SPRS register has its input and
    output so as to shift the data in and out of device. In other words, each appearing
    on the input (receive line) simultaneously shifts another bit towards the output
    (transmit line).


    The SSPBUF register (Buffer) is part of memory used to temporarily hold the data
    prior to being sent or immediately after receiving. After all 8 bits of data have
    been received, the byte is moved from the SPRS to the SSPBUF. This double buffering
    of the received data (SSPBUF) allows the next byte to start reception before reading
    the data that has just been received. Any write to the SSPBUF register during
    data transmission/ reception will be ignored. From the programmers'' point of
    view, this register is considered the most important as being frequently accessed.
    Namely, if we neglect mode settings for a moment, data transfer via SPI actually
    comes to data write and read from this, while another ''acrobatics'' such as moving
    registers are automatically performed by hardware.


