  md: '# Book: PIC Microcontrollers - Programming in C


    # Chapter 1: World of Microcontrollers


    The situation we find ourselves today in the field of microcircuit has its beginnings
    in the development of technology of integrated circuits. It enabled us to store
    hundreds of thousands of transistors into one chip, which was a precondition for
    the manufacture of microprocessors. The first computers were made by adding external
    peripherals, such as memory, input/output lines, timers and other circuits, to
    it. Further increasing of package density resulted designing an integrated circuit
    which contained both processor and peripherals. This is how the first chip containing
    a microcomputer later known as the microcontroller was developed.


    +   * 1.1 Introduction

    * 1.2 NUMBERS, NUMBERS, NUMBERS...

    * 1.3 MUST KNOW DETAILS

    * 1.4 PIC MICROCONTROLLERS


    # 1.1 INTRODUCTION


    Novices in electronics usually think that the microcontroller is the same as the
    microprocessor. That''s not true. They differ from each other in many ways. The
    first and most important difference in favour of the microcontroller is its functionality.
    In order that the microprocessor may be used, other components, memory comes first,
    must be added to it. Even though it is considered a powerful computing machine,
    it is not adjusted to communicating with peripheral environment. In order to enable
    the microprocessor to communicate with peripheral environment, special circuits
    must be used. This is how it was in the beginning and remains the same today.'
  merge: -1
  pgno: 0
- img_proc: true
  md: '![](img/0d2d82b978afb5e58d1be89c0ad23d37_1_0.png)


    On the other hand, the microcontroller is designed to be all of that in one. No
    other specialized external components are needed for its application because all
    necessary circuits which otherwise belong to peripherals are already built in
    it. It saves time and space needed to design a device.


    # ALL THE MICROCONTROLLER CAN DO


    In order to make it easier for you to understand the reasons for such a great
    success of microcontrollers, we will call your attention for a few minutes to
    the following example.


    Ten years ago, designing of an electronic device controlling the elevator in a
    multistory building was enormously difficult, even for a team of experts. Have
    you ever thought about what requirements an ordinary elevator must have? How to
    deal with the situation when two or more people call the elevator at the same
    time? Which has priority? How to handle security question? Loss of electricity?
    Failure? Misuse?...What comes after solving these basic questions is a painstaking
    process of designing appropriate electronics using a large number of specialized.
    Designing on device complexity, this process can take weeks or months. When finished,
    its time to design a printed circuit board and assemble device. A huge device!
    It is another long-lasting and trying work. Finally, when everything is finished
    and tested for many times, the crucial moment comes when you concentrate, a deep
    breath and switch the power on.


    This is usually the point at which the party turns into a real work since electronic
    devices almost starts to operate immediately. Get ready for many sleepless nights,
    corrections, improvements... and don''t forget, we are still talking about running
    an ordinary elevator.'
