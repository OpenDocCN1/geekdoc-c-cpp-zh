    # OPCOUPLER


    An optocoupler is a device commonly used to galvanically separate microcontroller
    electronics from any potentially dangerous current or voltage in its surroundings.
    Optocouplers usually have one, two or four light sources (LED diodes) on their
    input while on their output, opposite to diodes, there is the same number of elements
    sensitive to light (phototransistors, photo-thyristors or photo-triacs). The point
    is that an optocoupler uses a short optical transmission path to transfer a signal
    between the elements of circuit, while keeping them electrically isolated. This
    isolation makes sense only if diodes and photosensitive elements are separately
    powered. In this way, the microcontroller and expensive additional electronics
    are completely protected from high voltage and noises which are the most common
    cause of destroying, damaging or unstable operation of electronic devices in practice.
    The most frequently used optocouplers are those with phototransistors on their
    outputs. When it comes to the optocouplers with internal base-to-pin 6 connection
    (there are also optocouplers without it, the base can be left unconnected.


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_237_0.png)


    The R/C network represented by a broken line in the figure above denotes an optional
    connection which lessens the effects of noises by eliminating very short pulses.


