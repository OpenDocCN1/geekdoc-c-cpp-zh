    # ANALOG COMPARATOR


    In addition to A/D converter, there is another module, which until quite recently
    has been embedded only in integrated circuits belonging to the so called analog
    electronics. Owing to the fact that it is hardly possible to find any more complex
    automatic device which in some way does not use these circuits, two high quality
    comparators, along additional electronics, are integrated into the microcontroller
    and connected to its pins.


    How does a comparator operate? Basically, the analog comparator is an amplifier
    which compares the magnitude of voltages at two inputs. It has two inputs and
    one output. Depending on which input has a higher voltage (analog value), a logic
    zero (0) or logic one (1) (digital values) will appear on its output:'
  merge: -1
  pgno: 199
- img_proc: true
  md: '![](img/0d2d82b978afb5e58d1be89c0ad23d37_200_0.png)


    +   - When the analog voltage at Vin- is higher than that at Vin+, the output
    of the comparator is a digital low level.

    - When the analog voltage at Vin+ is higher than that at Vin-, the output of the
    comparator is a digital high level.


    The PIC16F887 microcontroller has two such voltage comparators the inputs of which
    are connected to I/O pins RA0-RA3, whereas the outputs are connected to the RA4
    and RA5 pins. There is also a voltage reference internal source on the chip itself,
    which will be discussed later.


    These two circuits are under control of the bits stored in the following registers:


    +   - CM1CON0 is in control of comparator C1;

    - CM2CON0 is in control of comparator C2;

    - CM2CON1 is in control of comparator C2;


    # VOLTAGE REFERENCE INTERNAL SOURCE


    One of two analog voltages provided on the comparator inputs is usually stable
    and unchanging. It is called Vref. To generate it, both external and internal
    voltage source can be used. When the voltage source is selected, Vref is derived
    from it by means of a ladder network consisting of 16 resistors which form a voltage
    divider. The voltage source is selectable through the both ends of the divider
    by the VRSS bit of the VRCON register.


    In addition, the voltage fraction provided by the resistor ladder network may
    be selected by the bits VR0-VR3 and used as a voltage reference. See figure below.'
  merge: -1
