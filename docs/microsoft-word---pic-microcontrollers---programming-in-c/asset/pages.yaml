    # USEFUL NOTES ...


    When the microcontroller communicates with peripheral components, it may happen
    that data transmission fails for some reason. In that case, it is recommended
    to check the state of some of the bits which can clarify the problem. In practice,
    the status of these bits is checked by executing a short subroutine after each
    byte transmission and reception (just in case).


    **WCOL (SPCON,7)** - If you try to write a new data to the SSPBUF register while
    another data transmission/reception is in progress, the WCOL bit will be set and
    the contents of the SSPBUF remains unchanged. Write does not occur. After this,
    the WCOL bit must be cleared in software.


    **BF (SSPSTAT,0)** - In transmission mode, this bit is set when the CPU writes
    to the SSPBUF register and remains until the byte in serial format is shifted
    from the SSPSR register. In reception mode, this bit is set when data or address
    is loaded to the SSPBUF register. It is cleared the SSPBUF register.


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_191_0.png)


    **SSPOV (SSPCON,6)** - In reception mode, this bit is set when a new byte is received
    by the SSPSR register via serial communication, whereas the previously received
    data has not been read from the SSPBUF register.


    **SDA and SCL Pins** - When SSP module is enabled, these pins turn into *Open
    Drain* outputs. It means that they must be connected to the resistors which are
    by the other end connected to positive power supply.


