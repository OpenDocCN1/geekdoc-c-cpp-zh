- img_proc: true
  md: 'Read Only Memory (ROM) is used to permanently save the program being executed.
    The size of program that can be written depends on the size of this memory. Today''s
    microcontrollers commonly use 16-bit addressing, which means they are able to
    address up to 64 Kb of memory, i.e. 65535 locations. As a novice, your program
    will rarely exceed the limit of several hundred instructions. There are several
    types of ROM.


    # Masked ROM (MROM)


    Masked ROM is a kind of ROM the content of which is programmed by the manufacturer.
    The term ''masked'' comes from the manufacturing process, where regions of the
    chip are masked off before the process of photolithography. In case of a large-scale
    production, the price is very low. Forget it...


    # One Time Programmable ROM (OTP ROM)


    One time programmable ROM enables you to download a program into it, but, as its
    name states, one only time. If an error is detected after downloading, the only
    thing you can do is to download the correct program to another chip.


    # UV Erasable Programmable ROM (UV EPROM)


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_16_0.png)


    Both the manufacturing process and characteristics of this memory are completely
    identical to OTP ROM. However, the package of the microcontroller with this memory
    has a recognizable ''window'' on its top side. It enables data to be erased under
    strong ultraviolet light. After a few minutes it is possible to download a new
    program into it.


    Installation of this window is complicated, which normally affects the price.
    From our point of view, unfortunately-negative...


    # Flash Memory


    This type of memory was invented in the 80s in the laboratories of INTEL and was
    represented as the successor to the UV EPROM. Since the content of this memory
    can be written and cleared practically an unlimited number of times, microcontrollers
    with Flash ROM are ideal for learning, experimentation and small-scale production.
    Because of its great popularity, most microcontrollers are manufactured in flash
    technology today. So, if you are going to buy a microcontroller, the type to look
