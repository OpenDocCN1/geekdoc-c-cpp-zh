    \ combination on port B\n    TRISB = 0; // Port B pins are configured as outputs\n\
    }\n```\n\nTo make this example interesting, we will enable LEDs connected to the\
    \ port B to blink. There are several ways to do it:\n\n+   1. As soon as the microcontroller\
    \ is turned on, all LEDs will emit light for a second. The *Delay* function is\
    \ in charge of it in the program. It's only needed to set delay expressed in milliseconds.\n\
    2. After one second, the program enters the *for* loop and remains as long as\
    \ the variable k is less than 20. The variable is incremented by 1 after each\
    \ iteration. Within the loop, the *switch* operation monitors port B logic state.\
    \ If PORTB=0xFF, its state is inverted into 0x00 and vice versa. Any change of\
    \ these logic states states causes all LEDs to blink. Duty Cycle is 5:1 (500ms:100ms).\n\
    3. When the program exits the *for* loop, the port B logic state changes (0xb\
    \ 01010101) and the program enters the endless *while* loop and remains there\
    \ as long as 1=1. The port B logic state is inverted each 200ms."
