    # ENUMERATED CONSTANTS


    Enumerated constants are a special type of integer constants which make a program
    more comprehensive and easier to follow by assigning elements the ordinal numbers.
    In the following example, the first element in curly brackets is automatically
    assigned the value 0, the second one is assigned the value 1, the third one value
    2 ect.


    ```

    enum MOTORS {UP, DOWN, LEFT, RIGHT}; // Declare constant MOTORS

    ```


    On every occurrence of the words ''LEFT'', ''RIGHT'', ''UP'' and ''DOWN'' in the
    program, the compiler will replace them by the appropriate numbers (0-3). Concretely,
    if the port B pins 0, 1, 2 and 3 are connected to motors which something goes
    up, down, left and right, the command for running motor ''RIGHT'' connected to
    bit 3 of port B follows as:


    ```

    PORTB.RIGHT = 1; // set the PORTB bit 3 connected to the motor ''RIGHT''

    ```


    # OPERATORS, OPERATIONS AND EXPRESSIONS


    An operator is a symbol denoting particular arithmetic, logic or some other operation.
    There are more than 40 operations available in C language, but at most 10-15 of
    them are used in practice. Every operation is performed upon one or more operands
    which can be variables or constants. Besides, every operation features priority
    execution and associativity as well.


    # ARITHMETIC OPERATORS


    Arithmetic operators are used in arithmetic operations and always return positive
    results. Unlike unary operations being performed upon one operand, binary operations
    are performed upon two operands. In other words, two numbers are required to execute
    a binary operation. For example: a+b or a/b.


    | OPERATOR | OPERATION |

    | --- | --- |

    | + | Addition |

    | | Subtraction |

    | * | Multiplication |

    | / | Division |

    | % | Remainder |


