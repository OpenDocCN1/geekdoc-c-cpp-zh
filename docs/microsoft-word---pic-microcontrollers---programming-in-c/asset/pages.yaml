    on what is expected from it after the process of compilation:


    **Device** - When you select the microcontroller, the compiler automatically knows
    which specific definition file, containing all SFR registers for specific MCU,
    its memory addresses and similar, to. use.


    **Oscillator** - This option is used to select the operating speed of the microcontroller.
    On the basis of it, the compiler makes changes in the configuration work. The
    operating speed is set so as to enable the microcontroller''s internal oscillator
    to operate with selected quartz crystal.


    **Build type** - release After the process of compilation is complete, the compiler
    has no influence on the program execution. For the purpose of debugging, a software
    simulator can be used.


    **Build type - ICD debug**: When the process of compilation is complete and the
    microcontroller is programmed, the compiler remains connected to the microcontroller
    and still can affect its operation. The connection is established via graph programmer
    which is connected to the PC via USB cable. A software making all this work is
    called the ICD (*In Circuit Debugger*). It enables the program to be executed
    step by step and provides an access to the current content of all registers


