- img_proc: true
  md: '![](img/0d2d82b978afb5e58d1be89c0ad23d37_141_0.png)


    The figure above shows the block diagram of the CCP1 module set in PWM mode. In
    order to generate a pulse of arbitrary form on its output pin, it is necessary
    to set pulse period (frequency) and pulse duration.


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_141_1.png)


    # PWM PERIOD


    The output pulse period (T) is determined by the PR2 register of the timer TMR2.
    The PWM period can be calculated using the following equation:


    PWM Period = (PR2 + 1) * 4*Tosc * TMR2 Prescale Value


    If the PWM period (T) is known, then it is easy to determine the signal frequency
    F because these values are related by equation F=1/T.


    www.raguvaran.puzl.com'
  merge: -1
  pgno: 141
- img_proc: true
  md: '# PWM DUTY CYCLE


    The PWM duty cycle is specified by using in total of 10 bits: eight MSbs of the
    CCP1L register and two additional LSBs of the CCP1CON register (DC1B1 and DC1B0).
    The result is a 10-bit number contained in the formula:


    Pulse Width = (CCPR1L,DC1B1,DC1B0) * Tosc * TMR2 Prescale Value


    The following table shows how to generate PWM signals of varying frequency if
    the microcontroller uses 20 MHz quartz-crystal (Tosc=50ns).


    | FREQUENCY [KHZ] | 1.22 | 4.88 | 19.53 | 78.12 | 156.3 | 208.3 |

    | TMR2 Prescaler | 16 | 4 | 1 | 1 | 1 | 1 |

    | PR2 Register | FFh | FFh | FFh | 3F | 1F | 17h |


    Just two more things:


    +   - The output pin will be constantly if the pulse width is by negligence determined
    to be larger than PWM period.

    - In this application, the timer TMR2 postscaler cannot be used for generation
    of longer PWM periods.


    # PWM RESOLUTION


    A PWM signal is nothing more than a pulse sequence with varying duty cycle. For
    one specified frequency (number of pulses per second), there is a limited number
    of duty cycle combinations. This number represents a resolution measured by bits.
    For example, a 10- bit resolution will result in 1024 discrete duty cycles, whereas
    an 8-bit resolution will result in 256 discrete duty cycles etc. In relation to
    this microcontroller, the resolution is determined by the PR2 register. The maximum
    value is obtained by writing number FFh.


    PWM frequencies and resolutions (Fosc = 20MHz):


    | PWM FREQUENCY | 1.22KH | 4.88KH | 19.53KH | 78.12KH | 156.3KH | 208.3KH |

    | Timer Prescale | Z | Z | Z | Z | Z | Z |

    | PR2 Value | FFh | FFh | FFh | 3F | 1F | 17h |

    | Maximum Resolution | 10 | 10 | 10 | 8 | 7 | 6 |


    PWM frequencies and resolutions (Fosc = 8MHz):'
  merge: -1
