  md: '![](img/0d2d82b978afb5e58d1be89c0ad23d37_13_0.png)


    In the program, this operation is commonly used to compare two bytes. Subtraction
    may be used for the same purpose (if the result is 0, bytes are equal). Unlike
    subtraction, the advantage of this logic operation is that it is not possible
    to obtain negative results.


    # REGISTER


    In short, a register or a memory cell is an electronic circuit which can memorize
    the state of one byte.


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_13_1.png)


    # SFR REGISTERS


    In addition to registers which do not have any special and predetermined function,
    every microcontroller has a number of registers (SFR) whose function is predetermined
    by the manufacturer. Their bits are connected (literally) to internal circuits
    of the microcontroller such as timers, A/D converter, oscillators and others,
    which mean that they are directly in command of the operation of these circuits,
    i.e. the microcontroller- Imagine eight switches which control the operation of
    a small circuit within the microcontroller- Special Function Registers do exactly
    that.'
