  md: "In order to read data EEPROM memory, follow the procedure:\n\n+   - Step 1:\
    \ Write the address (0h - FF) to the EEAD register.\n- Step 2: Select EEPROM block\
    \ by clearing the EEPGD bit of the EECON1 register.\n- Step 3: To read, set the\
    \ RD bit of the same register.\n- Step 4: Data is stored in the EEDAT register\
    \ and is ready for use.\n\nThe following example illustrates the above procedure\
    \ when writing a program in assembly language:\n\n```\nBSF STATUS,RP1      ; Access\
    \ bank 2\nBCF STATUS,RPO      ; \nMVF ADDRESS,W      ; Move address to the W register\n\
    MOVF EEADR         ; Write address\nBSF STATUS,RPO      ; Access bank 3\nBCF EECON1,EEPGD\
    \   ; Select EEPROM\nBSF EECON1,RD       ; Read data\nBCF STATUS,RPO      ; Access\
    \ bank 2\nMOVF EEDAT,W        ; Data is stored in the W register\n```\n\nThe same\
    \ program sequence in C language looks as follows:\n\n```\nW = EEPROM_Read(ADDRESS);\n\
    ```\n\nThe advantages of C language become more obvious, don't they?\n\n# WRITE\
    \ DATA TO EEPROM MEMORY\n\nPrior to writing to EEPROM memory it is necessary to\
    \ write the address to the EEAD register and data to the EEDAT register. All that's\
    \ left is to follow a special sequence to initiate write for each byte. Interrupts\
    \ must be disabled as long as this procedure is in progress.\n\nThe example below\
    \ illustrates the above procedure when writing a program in assembly language:\n\
    \n```\nBSF STATUS,RP1\nBCF STATUS,RPO\nBTFSC EECON,WR1      ; Wait for the previous\
    \ write to complete\nGOTO -1               ; Bank 2\nBCF STATUS,RPO      \nMOVF\
    \ ADDRESS,W      ; Move address to W\nMOVF EEADR           ; Write address\nMOVF\
    \ DATA,W          ; Move data to W\nMOVF EEADR           ; Write data\nBSF STATUS,RPO\
    \      ; Bank 3\nBCF EECON1,EEPGD    ; Select EEPROM\nBCF EECON1,WREN     ; Write\
    \ to EEPROM enabled\n```\n\nwww.raguvar.puzzl.com"
