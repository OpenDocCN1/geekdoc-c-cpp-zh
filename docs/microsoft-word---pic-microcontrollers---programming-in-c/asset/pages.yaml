    # ADRESH and ADRESL Registers


    The result obtained after converting an analog value to digital is a10-bit number
    that is to be stored in the ADRESH and ADRESL registers. There are two ways of
    handling it - left and right justification which simplifies it to a great extent.
    The format of conversion result depends on the ADFM bit of the ADCON1 register.
    In the event that the A/D converter is not used, these registers may be used as
    general-purpose registers.


    | ADRESH | ADRESL |

    |---|---|

    | 0 0 0 0 0 | 1 0 7 6 5 4 3 2 1 0 |

    | | "Right justified" |

    | 10 - bit result (ADFM=1) | |

    | ADRESH | ADRESL |

    | 7 6 5 4 3 2 1 0 | 0 0 7 6 5 4 3 2 1 0 |

    | | "Left justified" |

    | 10 - bit result (ADFM=0) | |


    # AD/Q ACQUISITION REQUIREMENTS


    In order to enable the ADC to meet its specified accuracy, it is necessary to
    provide a certain time delay selecting specific analog input and measurement itself.
    This time is called ''acquisition time'' and mainly depends on the source impedance.
    There is an equation used to calculate this time accurately, which in the worst
    case amounts to approximately 20uS. So, if you want the conversion to be accurate,
    don''t forget this important detail.


    # ADC CLOCK PERIOD


    The time needed to complete a one-bit conversion is defined as TAD. It is required
    to be at least 1.6 uS. One full-10-bit A/D conversion is slightly longer than
    expected and amounts to 11 TAD. Since both frequency and source of A/D conversion
    are specified by software, it is necessary to select one of the available combinations
    of bits ADCS1 and ADCS0 before the voltage measurement on some of the analog inputs
    starts. These bits are stored in the ADCON0 register.


    | ADC CLOCK | ADCS1 | ADCS0 | DEVICE FREQUENCY |


