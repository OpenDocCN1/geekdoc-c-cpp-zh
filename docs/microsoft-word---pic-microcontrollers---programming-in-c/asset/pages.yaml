- img_proc: true
  md: 'Similar to the timer TMR0, these registers can be read or written to at any
    moment. In case an overflow occurs, an interrupt is generated if enabled.


    The timer TMR1 module may operate in one of two basic modes, that is as a timer
    or a counter. Unlike the TMR0 timer, both of these modes have additional functions.


    The TMR1 timer has following features:


    +   - 16-bit timer/counter register pair;

    - Programmable internal or external clock source;

    - 3-bit prescaler;

    - Optional LP oscillator;

    - Synchronous or asynchronous operation;

    - TMR1 gate control (count enable) via comparator or T1G pin;

    - Interrupt on overflow;

    - Wake-up on overflow (external clock); and

    - Time base for Capture/Compare function.


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_128_0.png)


    # TIMER TMR1 CLOCK SOURCE SELECTION


    The TMR1CS bit of the T1CON register is used to select the clock source for this
    timer:


    | CLOCK SOURCE | TMR1CS |

    |---|---|

    | Fosc/4 | 0 |

    | TCKI pin | 1 |'
  merge: -1
  pgno: 128
- img_proc: true
  md: 'When the internal clock source is selected, the TMR1H-TMR1L register pair will
    be incremented on multiples of Fosc pulses as determined by the prescaler.


    When the external clock source is selected, this timer may operate as a timer
    or a counter. Clock in counter mode can be synchronized with the microcontroller
    internal clock or run asynchronously. In the event that an external clock oscillator
    is needed and the PIC16F887 microcontroller is using INTOSC with CLKOUT, timer
    T1 can use the LP oscillator as a clock source.


    # TIMER TMR1 PRESCALAR


    Timer TMR1 has a completely separate prescaler which allows 1, 2, 4 or 8 division
    of the clock frequency. The prescaler is not directly readable or writable. However,
    the prescaler counter is automatically cleared after writing to the TMR1H or TMR1L
    register.


    # TIMER TMR1 OSCILLATOR


    RC0/T1OSO and RC1/T1OS pins are used to register pulses coming from peripheral
    electronics, but they also have an additional function. As seen in figure, they
    are simultaneously configured as both input (pin RC1) and output (pin RC0) of
    additional LP quartz oscillator (Low Power). The circuit is primarily designed
    for the operation at low frequencies (up to 200 kHz), more precisely, for the
    use of 32,768 kHz quartz crystal. These crystals are used in quartz watches because
    it is easy to obtain one-second-long pulses by dividing this frequency.


    Since this oscillator does not depend on internal clock, it can operate even in
    sleep mode. It is enabled by setting the TIOSC control bit of the T1CON register.
    The user must provide a software time delay (a few milliseconds) to enable the
    oscillator to start up properly.


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_129_0.png)


    Table below shows the recommended values of the capacitors to suit the quartz
    oscillator. These values do not have to be exact. However, the general rule is:
    the higher the capacity, the higher stability, which, at the same time, prolongs
    the time needed for oscillator stability.


    | | FREQUENCY | C1 | C2 |

    | LP | 32 kHz | 33 pF | 33 pF |'
  merge: -1
  pgno: 129
- img_proc: true
  md: '# TIMER TMR1 GATE


    Timer TMR1 gate source is software configurable to the T1G pin or the output of
    comparator C2. This gate allows the timer to directly time external events using
    the logic state of the T1G pin or analog events using the comparator C2 output.
    Refer to figure on the previous page. In order to measure a signal duration, it
    is sufficient to enable this gate and count pulses passing through it.


    # THE USE OF TIMER TMR1 OSCILLATOR


    The power consumption of the microcontroller is reduced to the lowest level in
    Sleep mode since the main power consumer - the oscillator -''t operate. It is
    easy to set the microcontroller in this mode- executing the SLEEP instruction.
    The problem is how to wake up the microcontroller because only an interrupt can
    make it happen. Since the microcontroller ''sleeps'', an interrupt might be triggered
    by external electronics. It gets incredibly complicated if it is necessary to
    wake up the microcontroller at regular time intervals...


    ![](img/0d2d82b978afb5e58d1be89c0ad23d37_130_0.png)


    In order to solve this problem, a completely independent Low Power quartz oscillator,
    capable of operating in sleep mode, is built into the PIC16F887 microcontroller.
    Simply put, a previously separate circuit is now built into the microcontroller
    and assigned to the timer TMR1. The oscillator is enabled by setting the T1OSC
    bit of the T1CON register. The TMR1CS bit of the same register is then used to
    enable the timer TMR1 to use pulse sequences from oscillator.


    +   - A signal generated by this quartz oscillator is synchronized with the microcontroller
    clock by clearing the T1SYNC bit. In this case, the timer cannot operate in sleep
    mode because the circuit for synchronization uses the microcontroller clock.

    - The TMR1 register overflow interrupt can be enabled. If the T1SYNC bit is set,
    interrupts will also occur in sleep mode.'
  merge: -1
  pgno: 130
- img_proc: true
  md: "# TMR1 TIMER MODE\n\nIn order to select this mode, it is necessary to clear\
    \ the TMR1CS bit. After this, the 16-bit register will be incremented on every\
    \ pulse generated by the internal oscillator. If the 4MHz quartz crystal is in\
    \ use, it will be incremented every microsecond.\n\nIn this mode, the T1SYNC bit\
    \ does not affect the timer because it counts internal clock pulses. Since the\
    \ whole electronics uses these pulses, there is no need for synchronization.\n\
    \n![](img/0d2d82b978afb5e58d1be89c0ad23d37_131_0.png)\n\nThe microcontroller's\
    \ clock oscillator does not operate during sleep mode so the timer register overflow\
    \ cannot cause any interrupt.\n\nLet's do it in microC...\n\n```\n// In this example,\
    \ TMR1 is configured as a timer with the prescaler rate 1:8. Every time\n// TMR1H\
    \ and TMR1 registers overflow occurs, an interrupt will be requested.\nvoid main()\
    \ {\n    PIR1.TMR1IF = 0; // Reset the TMR1IF flag bit\n    TMR1H = 0x22; // Set\
    \ initial value for the timer TMR1\n    TMR1L = 0x00;\n    TMR1CS = 0; // Timer1\
    \ counts pulses from internal oscillator\n    T1CKPS1 = 1; T1CKPS0 = 1; // Assigned\
    \ prescaler rate is 1:8\n    PIE1.TMR1IE = 1; // Enable interrupt on overflow\n\
    \    INTCON = 0xC0; // Enable interrupt (bits GIE and PEIE)\n    TMR1 = 1; //\
    \ Turn the timer TMR1 on\n}\n```\n\nwww.raguvaran.puzl.com"
