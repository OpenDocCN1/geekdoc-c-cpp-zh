    \n文件的处理/管理是任何计算机编程语言的一个重要方面。文件管理的主要功能包括：创建新数据文件、打开现有数据文件、从现有数据文件中读取、向文件中写入数据、向文件中追加数据、修改文件中的数据以及关闭文件。\n\
    \nC 编程语言中用于文件处理的基本函数包括：\n\n- `fopen()` 创建新文件和打开现有文件。\n- `fclose()` 关闭已打开的文件。\n\
    - `getc()` 从已打开的数据文件中读取单个字符。\n- `putc()` 向已打开的数据文件中写入单个字符。\n- `fprintf()` 向已打开的数据文件中写入内容。\n\
    - `fscanf()` 从已打开的数据文件中读取内容。\n- `getw()` 从已打开的数据文件中读取整数。\n- `putw()` 向已打开的数据文件中写入整数。\n\
    - `fseek()` 将光标移动到任意位置。\n- `ftell()` 返回光标在文件中的位置（距离文件开始的字节数）。\n- `rewind()` 将光标移动到数据文件的开头。\n\
    \n### 12.2. 定义和打开数据文件\n\n为了能够操作文件，首先应该具体说明文件名和文件数据结构（即文件的用途）。文件数据结构使用 `FILE` 关键字指定，在创建或打开任何文件之前，应将其声明为\
    \ `FILE` 数据结构。\n\n打开任何文件的通用格式为：\n\n```c\nFILE*fp;\nfp=fopen(\"filename.ext\",\"\
    mode\");\n```\n\n第一条语句 `FILE *fp;` 定义了一个变量 `fp`，它作为 `FILE` 数据类型的指针。第二条语句 `fp =\
    \ fopen(\"filename.ext\",\"mode\");` 打开一个名为 `filename.ext` 的文件，并将一个名为 `fp` 的指针指向该文件。该指针准确地通信并管理文件系统与程序之间的整体活动。\n\
    \n`mode` 部分定义了使用该文件的目的：\n\n- r → (读取模式) : 仅读。\n- w → (写入模式) : 仅写。\n- a → (追加模式)\
    \ : 仅追加/添加数据。\n\n在打开文件时，有必要指出：\n\n当提到“w (写入)”模式时，将根据语句中指定的名称创建一个文件。如果指定目录中存在同名文件，该文件将被覆盖；即之前的内容将丢失。\n\
