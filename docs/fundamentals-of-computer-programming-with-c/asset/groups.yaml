    ## 10.3. 指针操作


    考虑以下示例


    ```c

    int x=5,y=7; int *px;

    px=\&x;


    int *py; py=\&y;

    int z;

    z=*px*py; // 等于: z (*px)(*py); 或者，z=(5)*(7)=35;

    z=3**px/ *py; // 等于: z=(3((*px))/(py);

    ```


    注意，`z=3**px/ *py;` 在 `*` 之前有一个空格。如果 `/` 后面没有紧跟空格，编译器将将其视为注释的开始。


    同样，在变量、指针变量的各种操作中使用的前缀和/或后缀运算符也可以应用于前缀和/或后缀运算符，但它们执行的功能不同。


    例如，如果任何指向整数值的指针 `ptr` 的初始值包含 `1234`，那么 `ptr++` 不会使其变为 `(1234+1)` 或 `1234`，而是会给
    `ptr` 加上数据的长度。由于对于 IBM PC，字符 (char) : 1 字节，整数 (int) : 2 字节，浮点数 (float) : 4 字节，长整数
    (long): 4 字节，双精度 (double) : 8 字节（用户可以使用 `sizeof(type)` 运算符检查），某些计算机上 `ptr++` 将将
    `ptr` 的值变为 `1234+2 = 1236`。


