    # CHAPTER 3. C Data Types & Identifiers


    # 3.1. Identifiers


    Identifiers are names that are given to various program elements such as variables,

    functions and arrays. Identifiers are mainly of two categories- Variables and
    Constants.


    # Rules of Naming Programmer-defined Identifier


    Identifiers consist of letters and digits in any order, except that the first
    character must be

    letter.

    Both uppercase and lowercase letters are permitted, though common usage favors
    the

    use of lowercase letters for most types of identifiers.

    Identifiers are Case Sensitive; i.e. Uppercase and lowercase letters are not

    interchangeable, i.e. uppercase letter is not equivalent to the corresponding
    lowercase

    letter. The underscore may also be included and it is considered as a letter.

    An identifier may also begin with an underscore, though it is rarely done in practice.

    An identifier should not contain any Space or other characters/Symbol except the'
  - '[PAGE 34]


    English Alphabets and underscore.

    An identifier may be arbitrarily long.

    Some implementations of C recognize only the first eight characters, though, most
    implementations recognize typically 31 characters.


    # Example of Valid Identifiers:

    x, y12, sum_1, _temp, tax_rate, TABLE


    Example of Invalid Identifiers:

    4th First Character must be a letter. “x” Illegal Character (“)

    order-no Illegal Character (-)

    error flag Illegal Character (<space>)


    # 3.2. Key-Word


    There are certain words called keywords which have standard, predefined meaning
    in C. These keywords can be used only for their intended purpose; they can be
    used as programmer defined identifiers.


    Standard Keywords of C Programming Language are:


    +   auto

    break

    case

    char

    const continue default

    double

    else

    enum

    float

    for

    goto

    if

    int

    long

    register return short signed sizeof static struct

    switch

    typedef

    union unsigned void

    volatile

    while


    # 3.3. Variable


    A Variable is an identifier that is used to represent some specified type of information
    within a designated portion of the program. In the simplest form, A variable is
    an identifier, that is used to represent a single data item, i.e. a numerical
    quantity or a character constant.


    A variable is a named memory location in which data of a certain type can be stored.
    The data item must be assigned to the variable at some point of program. The data
    can be'
  - '[PAGE 35]


    accessed later in the program simply by referring to the variable name. A given
    variable can be assigned different data items at various places within the program.
    Thus, the information represented by the variable can change during the execution
    of the program.


    However, the data type associated with the variable name cannot change.

    For example, we may define an Integer variable name as a int; and same for character
    char b; For floating point variable float c;


    # Reasons for declaring Variables


    There are two crucial reasons that leads Variables must be declared before use.


    It makes things somewhat easier on the compiler; it knows right away what kind
    of storage to allocate and what code to emit and manipulate each variable; it
    doesn’t have to try to intuit / guess the programmer’s intentions.


    It forces a bit of useful discipline on the programmer: you cannot introduce variables
    willy-nilly (to your will); you must think about them enough to pick appropriate
    types for them.


    # Variables can be categorize


    # Local Variables


    A variable declared within the braces { } of a function is visible only within
    that function; variables declared within functions are called local variables.
    If another function elsewhere declares a local variable with the same name, it''s
    a different variable entirely, and the two do not clash with each other.


    # Global Variable


    On the other hand, a variable declared outside of any function is a global variable,
    and it is potentially visible anywhere within the program. Global variables are
    used when it is required to have communications path to be able to travel to any
    part of the program.


    # Visibility/Span of Variables


    By default, local variables (those declared within a function) have automatic
    duration: they come into existence when the function is called, and they (and
    their values) disappear when the function returns.


    Global variables, on the other hand, have static duration: they last, and the
    values stored in persist, for as long as the program does along with the functionality
    to get the data overwritten when required.


    By default, local variables had automatic duration. To give them static duration
    (so that, instead of coming and going as the function is called, they persist
    for as long as the function does), their declaration can be preceded by the static
    keyword. For example: static int;


