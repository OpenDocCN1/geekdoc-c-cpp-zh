    ISBN-10: 1533558310\n\nFundamentals of C Programming S. A. AHSAN RAJ\n\n# Dedication\n\
    \nDedicated to my Parents and my Brother for all their love and inspirations which\
    \ have made me who I am today...\n\n# PREFACE\n\nInformation and Communication\
    \ Technology (ICT) is the main driving force of 21st Century. The prime strength\
    \ of ICT resides in Computer Programming which bridges the gap between man and\
    \ machine. Standing in this age of technology thus the necessity and demand of\
    \ programming is increasing rapidly with an aim to make the life and the world\
    \ better and easier which also emphasize on learning the basic art of Computer\
    \ Programming. This book is intended to present basic concepts on the most popular\
    \ programming language C. It has been tried to present the fundamental concepts\
    \ on Computer Programming with C simply and straight. More than 155 examples (codes\
    \ with sample input-output) are included to clarify the topics.\n\nFirst of all,\
    \ I want to express my prime gratitude to almighty Allah for giving the patience,\
    \ fitness and above all intelligence and ability to complete this book. In this\
    \ long journey, the inspirations, support, love and affection of my Parents and\
    \ my Brother was the prime force to finish this task after extreme circumstance\
    \ and professional responsibilities and difficulties. My gratitude, respect, love\
    \ and thanks to them is limitless. Without the sincere guidance and kind review\
    \ of my brother Sk. Ali Zaman, publication of this book would never become possible.\
    \ I would also like to mention all my teachers of Computer Science and Engineering\
    \ Discipline of Khulna University especially, Prof. Dr. Mr. Rafiq Islam and Mr.\
    \ A.S.M. Mahfuz Rahman Kafi who were my programming mentors. I am also indebted\
    \ to Prof. Dr. Mahbubur Rahman, Prof. Dr. Kamrul Hasan Talukder, Prof. Dr. Rameswar\
    \ Debnath, Prof. Dr. Anisur Rahman, Prof. Dr. Kazi Shah Ripon, Prof. Dr. Abu Nasir\
    \ Majid, Dr.A.S.M. Arif, Mr. G.M. Atiq Rahman and all other members who helped\
    \ me to gain my knowledge during my B.Sc.Engineering and M.Sc.Engineering study\
    \ in CSE Discipline of Khulna University. I would extend my thanks and gratitude\
    \ to Dr.Hafiz Rahman Sagar, Associate Professor, Architecture Discipline, KU for\
    \ his continuous encouragement in Programming since my undergraduate study. In\
    \ this connection, I would express my thanks to my employer Khulna Public College\
    \ and Khulna University for the time and support to complete this work. Also,\
    \ thanks goes to Engr.M.S.Said Rahman, Head, Dept. of Computer Science, Khulna\
    \ Public College and all my colleagues along with my wellwishers especially Mr.Abdullah\
    \ Al-Nahid and Md.Zial Amin, Md.Rakibul Islam, Morshed Arefin Nay, Sumaiya Islam,\
