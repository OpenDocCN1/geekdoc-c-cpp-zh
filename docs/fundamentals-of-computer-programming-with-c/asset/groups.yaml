    # 2.8. Comments


    The addition of comments inside programs is desirable. Often it is necessary to
    write some text about the example or part of it, or even some statements. These
    may be added to C programs by enclosing them as follows,


    ```

    /*

    EvenOdd Problem

    This program evaluates whether a number is even or odd.

    The input of the number is taken as n.

    Then is divided by 2 to decide whether it is divisible or not. ***

    ```


    Note that the /* opens the comment field and the /* closes the comment field.
    Comments may span multiple lines.

    Comments may not be nested inside the other.


    ```

    /* this is a comment. */

    /* this comment is inside */

    nIt is wrong and will display Error in Compiler */

    ```


    In the above example, the first occurrence of /* closes the comment statement
    for the entire line, meaning that the text is interpreted as a C statement or
    variable, and in this example, generates an error.


    Single lines are mostly used that starts with // and ends up pressing return (enter)
    key. For Example


    ```

    int main() // Here goes the Main Function For the above statement, int main()is
    the part

    ```'
