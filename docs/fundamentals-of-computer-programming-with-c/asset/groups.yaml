    ## 9.3. Recursive Function


    Recursive function is an important part of user defined functions. A function
    is called recursive if the function calls itself. A recursive function normally
    contains the conditions on which it will call itself with the condition to exit.


    For example, if it is to calculate the factorial of any integer n, the problem
    may be divided into the similar problem of factorial (n-1) and multiplying with
    n. Again, calculating factorial (n-1) implies calculating factorial (n-2) and
    multiplying with (n-2). That is, in every case, calculating factorial of any number
    indicates calculating factorial of its previous number and multiplying the result
    with itself provided that, the number 1, will result 1.


    Since, calculating factorial of a number may be expressed as the problem of calling
    the same with some terminating condition, it may be solved through recursive function.
    For,


    ! = ( - 1)! = ( - 2)! . . . . . . . . . . . . . . . . . . 2! = (1)! 1! = 1

    That is,

    ! = ( - 1)×( 3).... . . . . . . . . . . . . . 1


    The following program designated to calculate factorial of an int n uses a user
    defined function long int factorial (int n) where factorial(n) calls the function
    itself for factorial(n-1) which then calls factorial(n-2) and forth. This self-calling
    by definition is repeated until the value of n is turned into 1. As the terminating
    condition of recursive function or Define value, factorial(1) has been precisely
    stated as 1.


    ## PROGRAM 137. Program to Calculate Factorial Using Recursive Function

    ************ RECURSION ***************** #include<stdio.h>


    ```c

    long int factorial (int n);

    int main() {

    int num;

    printf("\nENTER ANY INTEGER\n"); scanf("%d",&num);

    long int fact=factorial(num);

    printf("\nFactorial of %d is %ld",num,fact); return 0;

    }

    long int factorial (int n) {

    if(n<=1)

    return(1); else return(n*factorial(n-1));

    }

