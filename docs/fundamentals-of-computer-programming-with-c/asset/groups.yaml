    # ## CHAPTER 12. File Processing


    # ### 12.1. Data Files


    Handling/management of Data Files is an important aspect for any computer programming
    language. Main functions of File Management includes- creating new data files,
    opening existing data files, reading from existing data files, writing data into
    files, appending data into files, modifying data in files, and closing the files.


    Basic functions available in C programming Language for file processing include


    +   - `fopen()` Creating new file and/ Opening Existing File

    - `fclose()` Closing the opened file.

    - `getc()` Reading a single character from opened data file.

    - `putc()` Writing a single character into opened data file.

    - `fprintf()` Writing something into opened data file.

    - `fscanf()` Reading something from opened data file.

    - `getw()` Reading an integer from opened data file.

    - `putw()` Writing an integer from opened data file.

    - `fseek()` Moving the cursor to any desired location

    - `ftell()` Returns the location of cursor in the file (in byted from the starting
    of the file)

    - `rewind()` Moving the cursor to the beginning of data file.


    # ### 12.2. Defining and Opening Data Files


    In order to work with files, the first name, data structure of file, i.e. the
    use of file should be mentioned specifically. The file data structure is specified
    using `FILE` keyword and before creating or opening any file, it will be declared
    as `FILE` data structure.


    The generic format for opening any file is:


    ```

    FILE*fp;

    fp=fopen("filename.ext","mode");

    ```


    The first statement `FILE *fp;` defines a variable `fp` which works as a pointer
    to the `FILE` data type. The second statement `fp = fopen("filename.ext","mode");`
    opens a file named `filename.ext` and assigns a pointer named `fp` to that file.
    This pointer accurately communicates and manages the overall activity between
    the file system and the program. The `mode` part defines the aim to'
  - '[PAGE 207]


    use that file.


    +   r → (Read Mode) : Opened for Reaging only

    w → (Write Mode) : Opened for Writing only

    a → (Append Mode) : Opened for Appending/Adding da ot it only


    In opening the file it is necessary to point out


    When “w (Write)” mode is mentioned, then a file is created with the name specified
    in the statement. If any file with same name exists in the specified directory,
    the file will be overwritten; i.e. previous content would be lost.


    When “a (Append)” mode is mentioned, then it is expected that, already a file
    exists in the specified directory in same name; which would be opened to append
    content; i.e. write down new data at the end of file. If the file does not exist,
    then a new file with the name specified will be.


    When “r (Read)” mode is mentioned, then it is expected that, already a file exists
    in the specified directory in same name; which would be opened for reading only.
    If the file does not exist, then the system displays error.


    Recent compilers support some other modes which include


    +   r+ Supports both Reading & Writing along with all the specifications of the
    mode: r

    w+ Supports both Reading & Writing along with all the specifications of the mode:
    w

    a+ Supports both Reading & Writing along with all the specifications of the mode:
    a


    # 12.3. Closing Data Files


    After completion of the desired file processing activities, the file should be
    closed which Ensuring the data in Buffer and Closing/Disconnecting the links.
    Moreover, over performing actions on any file in specific Mode, that, if it is
    required to open the file in different mode, then the file will also be closed
    before opening new mode. If the pointer to any file is fpt, then the file can
    be closed using:


    ```

    fclose (fpt);

    ```


    If the file is not closed, then with the completion of Execution of the program,
    the file is closed automatically.


    End of any data file is marked by EOF (End of File) marker. Consequently, in order
    to determine whether any file has been completed, EOF marker may be checked. Any
    attempt to file reading instruction after EOF marker generates Error.


