    # 3.7. Constants


    Constants refer to fixed values that do not change during the execution of C program.

    Rather than separate declaration and initialization, Constants should be declared
    and

    initialized at the same time.


    Constants are declared through the keyword const and then the type is specified.
    That is,

    The following will generate Error "Error: Assigning value to read only variable
    "


    ```

    const int a;

    a=10;

    ```


    The Correct form is:


    ```

    const int a=10;

    ```


    C supports several types of constants including integer constant, floating type
    constant,

    character constant etc.'
