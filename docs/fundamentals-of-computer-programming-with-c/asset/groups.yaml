    # 2.1. C Programming


    A language is a system of communication. In the same way, a Programming Language
    consists of all the symbols, characters and usage rules (Syntax and Semantics)
    that permit people to communicate with computer. Among these languages, one of
    the most prominent language is C.


    C is a general purpose Structured / Procedural programming language evolved from
    two programming languages, BCPL and B. BCPL was developed in 1967 by Martin Richards
    as a language for writing operating systems software and compilers. Ken Thompson
    modeled many features of B in 1970 to create early version of the UNIX operating
    system at BELL LAB on a DEC PDP-7 computer. Both B and BCPL were Typeless Language
    – every data items occupied one word in memory and the task of typing variable
    on the shoulders of the programmers. C language was evolved from B by Dennis Ritchie
    at Bell Laboratories and was implemented on a DEC PDP-11 computer in 1972. It
    uses many of the important concepts of BCPL and B while adding data types and
    other powerful features. It became widely known as the development language of
    the UNIX Operating System.


    Software is a set of Program(s) that instructs the hardware to perform some specific
    job as desired by the user. Software is the bridge between man and machine.


    Software is mainly of two categories: System Software and Application Software.
    System Software means operating system which is a must to make the hardware usable
    and communicate i.e. create interface between human being and machine. Application
    Software are developed based on system software provides expected functionalities
    based on user requirements.


    Point to note that, what Computer understands is simply 0 and 1 (known as Binary
    Numbers).


    # 2.2. Reasons of getting C Polar


    Reasons of getting C popular include


    Powerful and flexible- C is a powerful language. Most of the operating systems
    are written in C. C can be used in solving any problem. A number of compilers
    are also available for C.


    Portable language – Any program written in C language can be executed into any
    computer without any changes.


    Language of few words – C programs can be organized into parts that allow easier
    manipulation and further development and re-use of codes.


    # 2.3. Structure of Ideal C Program


    Structure of ideal C Program appears


