    \ Language for file processing include:\n\n- `fopen()` Creating new file and Opening\
    \ Existing File\n- `fclose()` Closing the opened file.\n- `getc()` Reading a single\
    \ character from opened data file.\n- `putc()` Writing a single character into\
    \ opened data file.\n- `fprintf()` Writing something into opened data file.\n\
    - `fscanf()` Reading something from opened data file.\n- `getw()` Reading an integer\
    \ from opened data file.\n- `putw()` Writing an integer from opened data file.\n\
    - `fseek()` Moving the cursor to any desired location\n- `ftell()` Returns the\
    \ location of cursor in the file (in bytes from the starting of the file)\n- `rewind()`\
    \ Moving the cursor to the beginning of data file.\n\n### 12.2. Defining and Opening\
    \ Data Files\n\nIn order to work with files, the first name, data structure of\
    \ file, i.e. the use of file, should be mentioned specifically. The file data\
    \ structure is specified using `FILE` keyword and before creating or opening any\
    \ file, it will be declared as `FILE` data structure.\n\nThe generic format for\
    \ opening any file is:\n\n```c\nFILE*fp;\nfp=fopen(\"filename.ext\",\"mode\");\n\
    ```\n\nThe first statement `FILE *fp;` defines a variable `fp` which works as\
    \ a pointer to the `FILE` data type. The second statement `fp = fopen(\"filename.ext\"\
    ,\"mode\");` opens a file named `filename.ext` and assigns a pointer named `fp`\
    \ to that file. This pointer accurately communicates and manages the overall activity\
    \ between the file system and the program. The `mode` part defines the aim to\
    \ use that file.\n\n- r → (Read Mode) : Opened for Reading only\n- w → (Write\
    \ Mode) : Opened for Writing only\n- a → (Append Mode) : Opened for Appending/Adding\
    \ data to it only\n\nIn opening the file it is necessary to point out:\n\nWhen\
    \ “w (Write)” mode is mentioned, then a file is created with the name specified\
    \ in the statement. If any file with same name exists in the specified directory,\
    \ the file will be overwritten; i.e. previous content would be lost.\n\nWhen “a\
    \ (Append)” mode is mentioned, then it is expected that, already a file exists\
    \ in the specified directory with same name; which would be opened to append content;\
    \ i.e. write down new data at the end of file. If the file does not exist, then\
    \ a new file with the name specified will be created.\n\nWhen “r (Read)” mode\
    \ is mentioned, then it is expected that, already a file exists in the specified\
    \ directory with same name; which would be opened for reading only. If the file\
    \ does not exist, then the system displays error.\n\nRecent compilers support\
    \ some other modes which include:\n\n- r+ Supports both Reading & Writing along\
    \ with all the specifications of the mode: r\n- w+ Supports both Reading & Writing\
    \ along with all the specifications of the mode: w\n- a+ Supports both Reading\
    \ & Writing along with all the specifications of the mode: a\n\n### 12.3. Closing\
    \ Data Files\n\nAfter completion of the desired file processing activities, the\
    \ file should be closed which Ensuring the data in Buffer and Closing/Disconnecting\
    \ the links. Moreover, over performing actions on any file in specific Mode, that,\
    \ if it is required to open the file in different mode, then the file will also\
    \ be closed before opening new mode. If the pointer to any file is fpt, then the\
    \ file can be closed using:\n\n```c\nfclose (fpt);\n```\n\nIf the file is not\
    \ closed, then with the completion of Execution of the program, the file is closed\
    \ automatically.\n\nEnd of any data file is marked by EOF (End of File) marker.\
