    Initialized Value of a is 15 Adding five with 15 results 20 * /\n\n# 3.8. Symbolic\
    \ Constants\n\nIt is possible to define constants in a program which should be\
    \ pre-processed before actually the program gets and its occurrences would be\
    \ replaced by values it contains. This is normally achieved in the preprocessor\
    \ statements portion of the program and defined using #define keyword.\n\nNaming\
    \ of preprocessor constants should follow all the rules of naming identifiers.\
    \ Note that preprocessor statements begin with a # symbol, and are NOT terminated\
    \ by a semicolon.\n\nTraditionally, preprocessor statements are listed at the\
    \ beginning of the source file. Preprocessor statements are handled by the compiler\
    \ (or preprocessor) before the program is actually compiled.\n\nAll # statements\
    \ are processed first, and the symbols(like N) which occur in the C program are\
    \ replaced by their value (like3000). Once this substitution has taken place by\
    \ the preprocessor, the program is then compiled.\n\nIn general, preprocessor\
    \ constants are written in UPPERCASE. This acts as a form of internal documentation\
    \ to enhance program readability and reuse. In the program itself, values cannot\
    \ be assigned to symbolic constants. Names given to values that cannot be changed.\
    \ Implemented with the #define preprocessor directive."
