    # Dedication


    Dedicated to my Parents and my Brother for all their love and inspirations which
    have made me who I am today...

    PREFACE


    Information and Communication Technology (ICT) is the main driving force of 21st
    Century. The prime strength of ICT resides in Computer Programming which bridges
    the gap between man and machine. Standing in this age of technology thus the necessity
    and demand of programming is increasing rapidly with an aim to make the life and
    the world better and easier which also emphasize on learning the basic art of
    Computer Programming. This book is intended to present basic concepts on the most
    popular programming language C. It has been tried to present the fundamental concepts
    on Computer Programming with C simply and straight. More than 155 examples (codes
    with sample input-output) are included to clarify the topics.


    First of all, I want to express my prime gratitude to almighty Allah for giving
    the patience,'
