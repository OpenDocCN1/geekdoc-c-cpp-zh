    For Any File pointer FILE *fpt; the library function ftell() has the format: ftell(fpt);

    The Function ftell returns a long integer that indicates the current position
    of the cursor in the file. Position of the file indicates the relative offset
    from the starting of the file in Byte Unit. that is, if n=ftell(fpt); then it
    indicates that, n byte data has Read or Written in the file.


