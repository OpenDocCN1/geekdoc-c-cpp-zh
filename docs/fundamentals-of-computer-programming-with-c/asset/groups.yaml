    # Type Specifier Type Applications / Uses


    +   %c char Single character

    %d int Decimal integer

    %e float Floating point value (Exponent form)

    %f float Floating point value

    %g float Floating point value (Without Trailing Zeros)

    %h int Short integer

    %i int Decimal, hexadecimal or octal integer

    %o Octal integer

    %s char String (Collection of Character(s)) %u int Unsigned decimal

    %x int double Double (float with higher precision)


