    extact position.


    That is, while sorting in increasing order, it is to ensure that, the first element
    is the largest,

    then comes the second largest, the third and so on. In another word, we first
    find the\maximum among all the input numbers and place it at the first. Then we
    consider the

    remaining numbers over the largest (which has just been placed at the very first)
    and

    find the maximum among those and place that as the second number. In such a way

    by placing the maximum considered number and re-forming the array, we get the

    sorted result.


    In other words, using an iteration i, the maximum among n elements is evaluated
    and

    placed at i[]element by swapping it with the element where maximum is found.


