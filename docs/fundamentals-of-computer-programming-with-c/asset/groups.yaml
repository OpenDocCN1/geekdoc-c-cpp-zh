    # Conditions for being Leap Year


    +   1. Any year that is divisible by 400 is definitely a leap year.

    2. If it is not divisible by 400 then check if it is divisible by 100. If so,
    then it is Not a Leap year (Even is divisible by 4).

    3. If the above two conditions are not satisfied, check for divisibility by 4.
    If it is divisible by 4, then it is Leap Year.


