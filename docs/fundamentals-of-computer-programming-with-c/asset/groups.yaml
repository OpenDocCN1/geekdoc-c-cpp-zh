    \ 01911 510 286\nISBN-13: 978-1533558312\nISBN-10: 1533558310\n\nC 语言编程基础 S. A.\
    \ AHSAN RAJ\n\n# 献献\n\n献给我的父母和兄弟，感谢他们所有的爱与灵感，成就了今天的我……\n\n# 前言\n\n信息与通信技术（ICT）是21世纪世纪的主要驱动力。ICT\
    \ 的核心优势在于计算机编程，它桥起了人与机器之间的鸿沟。站在这个技术时代，编程的需求和必要日益增长，目标是让生活和世界变得更好、更方便，这也强调了学习计算机编程基础艺术的重要性。本书旨在介绍最流行的编程语言\
    \ C 的基本概念。它尝试以简单直接的方式介绍使用 C 语言计算机编程的基础概念。书中包含了 155 多个示例（带有示例输入输出的代码）以阐明相关主题。\n\
    \n首先，我要对至高主表示最大的感谢，他赋予了我耐心、健康，最重要的是智慧和能力完成这本书。在这段漫长的旅途中，父母和兄弟的灵感、支持、爱和关怀是在极端情况、专业责任和困难之后完成任务的主要动力。我对他们的感激、尊重、爱和感谢是无尽的。如果没有我兄弟\
    \ Sk. Ali Zaman 的诚心指导和耐心评审，这本书的出版将是不可能的。我还想感谢库尔纳大学计算机科学与工程学科的所有老师，特别是 Rafiq Islam\
    \ 教授/博士和 A.S.M. Mahfuz Rahman Kafi 先生，他们是我的编程导师。我还要感念 Mahbubur Rahman 教授/博士、Kamrul\
    \ Hasan Talukder 教授/博士、Rameswar Debnath 教授/博士、Anisur Rahman 教授/博士、Kazi Shah Ripon\
    \ 教授/博士、Abu Nasir Majid 教授/博士、A.S.M. Arif 博士、G.M. Atiq Rahman 先生以及其他成员，我在库尔纳大学计算机科学专业攻读学士和硕士学位期间帮助我获得了知识。我将向库尔纳大学建筑系副教授\
    \ Hafiz Rahman Sagar 博士表示感谢谢意，感谢他从我本科学习开始在编程方面给予的持续鼓励。借此，我要感谢我的雇主库尔纳公立学院和库尔纳大学为完成这项工作提供的时间和支持。此外，感谢库尔纳公立学院计算机科学系主任\
    \ M.S.Said Rahman 工程师以及所有的同事，特别感谢 Abdullah Al-Nahid 先生、Md.Zial Amin、Md.Rakibul\
    \ Islam、Morshed Arefin Nay、Sumaiya Islam、Tania Ferdoushi Rahman 和 Ayesha Akhtar\
    \ 女人，他们不断鼓励和启发我完成这本书。最后，我对所有学生表示由衷感谢，感谢他们持续鼓励和启发我完成此书。\n\n# 目录\n\n- 第1章 程序与编程语言\
