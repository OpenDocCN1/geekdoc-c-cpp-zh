    if(n%i==0) {

    is_prime=1; break;

    }

    }

    if(is_prime==0) {

    printf("%%d is PRIME",n);

    }

    if(is_prime==1) {

    printf("%%d is NOT PRIME",n);

    }

    Return 0;

    }

