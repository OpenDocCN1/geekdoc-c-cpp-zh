    # 5.5. Switch-Case


    Switch statement may be used in place of multiple statement and comprise of switchcase
    and default statement. General syntax of switch is:


    ```

    switch(integral expression) statement

    ```


    The control statement which is called switch body may comprise of one or more
    case statements. Generally, the case statement has the following format

    case constant-integral-expression : statement


    In fact, case constant is nothing but a labelled statement. Only the switch case
    containing the Label will get matched with the switch expression. It will continue
    checking i.e. flow of control until it encounters break statement or end of switch
    body. Actually, the break statement grabs the control from switch body to outer
    side of switch. If no labels matches the case expression, then the default statement
    (if any) will be executed. It normally serves as “catch-all” or else label .

    Entirely, the structure of switch may be viewed as:


    ```

    switch(integer_expression)

    ```


