    @@:

    push ebx

    mov ebx, 1 mov ecx, 1

    @@: lea eax, [ebx+ecx] cmp edx, 3

    jbe @f

    mov ebx, ecx

    mov ecx, eax

    dec edx

    jmp @b

    @@:

    pop eax ret

    ```


    For Calculating the nth Fibonacci Number, high level language code is:


    ```

    unsigned int fib(unsigned int n) {

    if (n <= 0)

    return 0;

    else if (n <= 2)

    return 1;

    else {

    int a,b,c;

    a = 1;

    b = 1;

    while (1) {

    c = a + b;

    if (n <= 3) return c; a = b;

    b = c;

    }

    }

    ```


    # Advantages of Assembly Language

    Binary Operation Codes used in machine language are replaced by mnemonics are
    easier to remember.


    Not required to keep track of memory locations as is required in the machine language.

    Memory addresses are replaced by variables/ Register Names .

    Easier to find errors.

    Easier to modify.

    Easier insertions and deletions.


    # Limitations/Disadvantages of Assembly Language'
