    # 7.9. Two-Dimensional Array


    Processing of data similar to Matrix of general arithmetic, C allows Two-Dimensional
    Array.


    As seen earlier, One Dimensional Array has an index for each element. But, in
    case of two dimensional array, number of index required is that is normally considered
    as row index and column index traditionally considering the two dimensional array
    as a table.


    Using, a[i][j] the cell of i^{row} and j^{column} is indicated.

    That, the general format of array is: arrayName[rowID][colID]


    For example, int a[3][4]; defines a two dimensional array of type integer which
    contains 3 rows and 4 columns. That is, it has a total of 3*4=12 cells where integer
    data may be stored as in the following figure:


    Col 0 1 2 3

    Row 0 a[0][0] a[0][1] a[0][2] a[0][3]

    Row 1 a[1][0] a[1][1] a[1][2] a[1][3]

    Row 2 a[2][0] a[2][1] a[2][2] a[2][3]


    A two dimensional array can be initialized in a number of ways. Though, normally
    looping is used to initialize 2D Arrays, it can also be done straight.

    For example,


    ```

    int a[3][4] = {71,22,98,13,45,76,35,31,43,12,64}; or;

    int a[][] = {{71,22,98},{13,45,76,35},{31,43,12,64}}; or;

    ```


    ```

    int a[][] = {

    {71,22,98}, {13,45,76,35}, {31,43,12,64}

    };

    ```


    Any of the three style can be used in initializing 2D Arrays which will form something
    like the following


    Col 0 1 2 3

    Row 0 71 22 98 13

    Row 1 45 76 35

    Row 2 31 43 12 64


