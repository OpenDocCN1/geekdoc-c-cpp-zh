    # ## 6.1. Loop


    In Looping, a sequence of statements are executed until some conditions for termination
    of the loop are satisfied.

    A program loop therefore consist of two segments.

    body of the loop and

    control statement or Test Condition or Checking Criteria.


    The control statement tests conditions and then directs the repeated execution
    of the statements in the body of the loop will expire when the test condition
    becomes false.


    Based on the positioning of the control statement, loop may be categorized as:
    Entry Controlled Loop

    Exit Controlled loop the control condition are tested before the start of the
    loop execution. If conditions are not satisfied, the body of loops will not be
    executed. In case of an exit controlled loop, the test is performed at the end
    of the body of the loop and therefore the body is executed unconditionally for
    the first time


