    Traditionally, Array is Defined as: “An Array is an identifier that refers to
    a collection of data items having same name and same type".


    The general format for defining an array is:


    ```

    Data_Type Array_Name[Number_of_Elements];

    ```


    For example,

    int a[10];


    The above statement defines an Array of integers named a. which can contain 10
    elements.


    Similarly, float nums[50]; Defines an array named nums which can store 50 elementsof
    type float.

