- img_proc: true
  md: 'Machine dependent since designated for specific processor and only that processor
    family understands the mnemonics.

    Requires Assembler to generate equiavalent Machine Codes

    Can be executed on small-powered computers.

    Time consuming and requires memorizations.


    # High Level Language


    The language in which symbols and words are similar to those of ordinary Arithmetic
    and English are independent of the computer of which program to be used, is known
    as High Level Language.


    Example: C, JAVA, Visual Basic (VB), C++, C#, PHP


    # Advantages of using High Level Language


    +   - Machine independent i.e. codes written for one machine can be executed in
    any machine without modification.

    - Easier to learn and memorize the instructions.

    - Less time required to write programs

    - Easy to find errors (debug) and modify the programs

    - Modification is easier

    - No internal structure/knowledge on machine architecture required.

    - Better documentation


    # Limitations/Disadvantages of High Level Language


    Since programs written in High Level Language is required to be converted into
    intermediate formats suitable for assemblers and then to binary for execution;
    it takes some time.


    Compiler, interpreter etc translators are required Compiler occupies memory

    Lack of feasibility

    Access to all features are not available.


    The following figure presents a glimpse of execution of high level language programs.


