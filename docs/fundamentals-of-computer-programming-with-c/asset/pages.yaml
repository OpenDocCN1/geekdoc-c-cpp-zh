    /*

    EvenOdd Problem

    This program evaluates whether a number is even or odd.

    The input of the number is taken as n.

    Then is divided by 2 to decide whether it is divisible or not. ***

    ```


    Note that the /* opens the comment field and the /* closes the comment field.
    Comments may span multiple lines.

    Comments may not be nested inside the other.


