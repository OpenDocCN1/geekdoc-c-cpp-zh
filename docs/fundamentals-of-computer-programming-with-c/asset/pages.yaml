    # CHAPTER 1. Program & Programming Language


    # 1.1. Program


    A computer is a programmable logic device that is capable of performing computations\and
    taking logical decisions correctly (errorless) and accurately at a speed hundreds
    and

    th times faster than human beings. In other words, the computer is an

    automatic machine made of electronic and electro-mechanical devices that processes

    data program control to generate meaningful information with speed and accuracy.

    The process of instructing computers is called Programming.


    A Program is a set of instructions to carry out some specific job. Computer Programming
    is

    the process of instructing any computer through arithmetic/logical statements
    to carry out

    some specific job.


    # 1.2. Generation of Programming Language


    Since the innovation of programming language it has undergone tremendous changes
    in

    it its pattern, functionality and uses. This changes is categorized into five
    generations.


    First Generation Language (1945): Machine Language

    Second Generation Language (1950) : Assembly Language

    Third Generation Language (1960) : High Level Language'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'Fourth Generation Language (1970) : Very High Level Language Fifth Generation
    Language (1980) : Natural Language


    The First and Second generation languages are usually termed as Low Level Language
    and Third to suquent generators are termed as High Level Language. Discussion
    on the types of programming language will be organized


    Machine Language (Known as Low Level Language)

    Assembly Language (or Symbolic Language)

    Procedure Language (or High Level Language)


    # Machine Language


    Since, Computer understands nothing but binary 0 and 1 (in fact some level of
    voltages), the most basic and most effective method to program a computer by providing
    the string of Binary coded instructions to the computer. The language in which
    binary code is used to instruct and thus write a program is known as machine language.


    # Advantages of writing programs in Machine Languages includes


    +   - Very fast execution; directly understood by computer.

    - Instructions are short.

    - No Compiler/Interpreter required

    - Make efficient use of storage-language instructions and their storage in computer
    memory can be controlled by manipulating the individual bits.


    # Limitations and Disadvantages of Machine Language


    It is extremely tough to program using Binary Stream since, it is approximately
    impossible to remember the instructions.

    Writing program in machine language is tedious, time consuming and highly erroneous.


    +   - Machine Dependent; Instructions for computers of one architecture is different
    from another; thus same stream would not work for all

    - Requires high level programming and comforting skill.

    - Difficult to correct, modify, debug,

    - One may lead to series of changes.

    - For Example, in MIPS (32 Bit) architecture, if it is required to add the values
    of register1 and register2 and store the sum in register 6, the machine instruction
    is: 00000 00010 00110 00000 100000


    Operation Codes for Machine Language may include J-type (jump), I-type (immediate),
    R-type (register) and function.

    Categories of Instructions provided in Machine Language and Assembly Language
    include:


    +   - Arithmetic Instructions) - e.g. Addition/Summation, Multiplication, Division

    - Control Instructions – e.g. Load, Store, Jump

    Input-Output Instructions – e.g. Read, Write

    - Direct Use/Instructions – e.g. Start, Halt, End


    # Assembly Language'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'Assembly language is the language in programmer we use some of name (Mnemonics)
    or label to refer to specific memory locations or operations. That is, Binary
    addresses used in Machine Language are replaced by symbolic address and instructions
    (OP-CODE) and are expressed in mnemonic codes as ADD, MOVE etc.


    Assembly software (known as Assembler) first translates the operation code (OP-Code)
    symbol/ Mnemonics and symbol address into its machine code equivalent, because
    the only language understood by the machine is language. An Assembler is a computer
    program that translates an assembly language program into machine code.


    For Assembly Language is Machine Dependent. That is, instructions for computers
    of one architecture may be different from instructions of other types of architectures.
    Some common opcodes include


    # Mnemonic ADD SUB MUL DIV


    MOV MVI


    # Functions Addition


    +   Subtraction Multiplication Division

    Move

    Move Immediate INP Input OUT Output


    STA Store Data from Accumulator CLR ClearCLC Clear the Carry JMU Unconditional
    Jump JAZ Jump if Accumulator is Zero INC Increment STP Stop


    A Sample program using Assembly Language is provided below


    # Program Explanation


    +   CLR Clear the Accumulator

    INP A Get input and store in location A

    INP B Get input and store in location B

    LDA Load the value of location A into Accumulator


    ADD B Add the data in location B with the data stored into Accumulator and store
    in Accumulator

    STA Store the Accumulator data into location C

    STP Stop the tasks


    For Calculating the nthFibonacci Number, Fibonacci Number, bit x86 Machine Code
    is:


    ```

    8B542408 83FA0077 06B80000 0000C383

    FA027706 B8010000 00C35BB 01000000

    C9010000 08D0419 83FA0376 078DB98B

    B84AEBF1 5BC3

    ```


    For Calculating the nth Fibonacci Number, x86 assembly language code is:


    ```

    fib: mov edx, [esp+8] cmp edx, 0

    ja @f

    mov eax, 0

    ret

    ```'
