    the first element is the maximum. That is, max = x[0]; Each element of the arrayx[i]
    is compared with the value of max. If the valueofmax is less than x[i], then max
    is updated with the value ofx[i].e. max=x[i]; resulting that, max always contains
    the largest among elements. Repeating these steps for the entire array ensures
    that, the largest element among the array is stored in max.


