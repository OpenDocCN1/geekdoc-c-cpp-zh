    # 10.4. Pointers and Arrays


    When an Array is declared, then the compiler first allocates a Base Address for
    that array and in order to store Array Elements, Sequential Memory Locations are
    allocated as per the type of data. That, Base Address is the starting address
    for the first element of the array. The Name of the Array is actually defined
    as a constant pointer of the first element of the array. For example, an array
    is defined as follows


    ```

    int x[5]={ 70, 12, 44, 56, 11 };

    ```


    If that system, inttype consumes two bytes of memory, and the first element of
    the array x is stored in memory address 1234, then actual, declaration of x indicates
    a constant pointer which points x[0]. That is, the value of x is 1234.'
