    A number is called prime if that number is completely divisible by any number
    except 1 and itself. In order to determine we use a loop with looping variable
    i for 2 to (n-1) that will check whether n is divisible by 1. If (n%i==0) satisfied
    at any iteration, we may decide that, the input n is not prime; and we can break
    the execution of the loop and output “is not prime”.


    However, in order to determine whether any number is prime, we need to make sure
    that for all values of i in the range 2 to n-1, n%i!=0. This is maintained by
    a flag named is_prime which is initialized as 0. If the number is divisible by
    any value of i, the value of the flag will be updated as 1. But, if for no value
    of i, (n%i==0) satisfied, the value of the is_prime remains unchanged.


    That is, reaching out of loop, if prime remains 0, we can decide that, the if(n%i==0)
    statement was not satisfied and thus print, “n is Prime”.

    This logic is implemented in the following program.


    PROGRAM 113. Program to determine whether any input number is Prime Number


    /* Prime Number Determination

    A Number n is called Prime if it is not divisible by any number ranging from 2
    to n1.

    */


    ```

