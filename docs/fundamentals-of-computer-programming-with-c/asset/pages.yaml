    p+4=&x[4]; (=1242)

    ```


    That is, if the base address of any array is known, then the address of the element
    of

    ray can be calculated from its Array Index and Scale Factor. For example,

    Address of x[3] = Base Address + (3 * Scale Factor for Integer) = 1234 + (3*2)
    = 1240

