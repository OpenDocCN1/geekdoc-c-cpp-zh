  md: '# Compiler and Interpreter


    COMPILER and INTERPRETER are translators from source program to object programs.


    The Original High Level program is called Source Program and the resulting Machine
    Language program is called Object Program.


    Compilers and Interpreters accept programs written in high level language programs
    as input and generates corresponding machine-language program as output.


    In fact, a Compiler or Interpreter is itself a computer program.


    Basic artifacts of program and compilation and execution is presented belowInput
    Output


    Compiling the Source ProgramProgram Object Compiler Program Input CPU Output


    Running the DataProgram Object Information


    Steps of compiling any program includes- Lexical Analysis, Preprocessing, Parsing,
    Semantic Analysis (Syntax-Directed Translation), Code Generation and Code Optimization.


    Source ProgramCompiler / Result Interpreter


    # Comparison between Compiler and Interpreter


    INTERPRETER COMPILER


    Translates the program line by line Translates the entire program at a time Requires
    less main memory Requires more memory


    Each time the program is executed, every line is checked for syntax and converted
    to equivalent machine code Converts the entire program to code, when all syntax
    errors are removed and executes the object code directly.


    Source program and interpreter are both required for execution. Source program
    is not required for execution. Object Program is required


    No Intermediate Object Code is generated


    Intermediate Object Code is generated Good for fast debugging and testing Slow
    for debugging and testing. Execution time is more Execution time is less


