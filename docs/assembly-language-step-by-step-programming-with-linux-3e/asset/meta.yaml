- - '##'
  - 指令集参考说明
- - '###'
  - 'JCXZ: 如果 CX = 0 则跳转'
- - '###'
  - 'JECXZ: 如果 ECX = 0 则跳转'
- - '###'
  - 'JMP: 无条件跳转'
- - '###'
  - 'LEA: 加载有效地址'
- - '###'
  - 'LOOP: 循环直到 CX/ECX = 0'
- - '###'
  - 'LOOPNZ/LOOPNE: 当 CX/ECX > 0 且 ZF = 0 时循环'
- - '###'
  - 'LOOPZ/LOOPE: 当 CX/ECX > 0 且 ZF = 1 时循环'
- - '###'
  - 'MOV: 将右操作数（复制）到左操作数'
- - '###'
  - 'MOVS: 移动字符串'
- - '###'
  - 'MOVSX: 带符号位扩展的移动（复制）'
- - '###'
  - 'MUL: 无符号整数乘法'
- - '###'
  - 'NEG: 取反（补码；即乘以 −1）'
- - '###'
  - 'NOP: 无操作'
- - '###'
  - 'NOT: 逻辑非（反码）'
- - '###'
  - 'OR: 逻辑“或”'
- - '###'
  - 'POP: 将栈顶元素弹出到操作数'
- - '###'
  - 'POPA/POPAD: 弹出所有通用寄存器'
- - '###'
  - 'POPF: 将栈顶元素弹出到 16 位标志寄存'
- - '###'
  - 'POPFD: 将栈顶元素弹出到 EFlags'
- - '###'
  - 'PUSH: 将操作数推入栈顶'
- - '###'
  - 'PUSHA: 推入所有 16 位通用寄存器'
- - '###'
  - 'PUSHAD: 推入所有 32 位通用寄存器'
- - '###'
  - 'PUSHF: 将 16 位标志位推入栈中'
- - '###'
  - 'PUSHFD: 将 32 位 EFlags 推入栈中'
- - '###'
  - 'RET: 从过程返回'
- - '###'
  - 'ROL: 左旋转'
- - '###'
  - 'ROR: 右旋转'
- - '###'
  - 'SBB: 带借位的算术减法'
- - '###'
  - 'SHL: 左移'
- - '###'
  - 'SHR: 右移'
- - '###'
  - 'STC: 设置进位标志 (CF)'
- - '###'
  - 'STD: 设置方向标志位 (DF)'
- - '###'
  - 'STOS: 存储字符串'
- - '###'
  - 'SUB: 算术减法'
- - '###'
  - 'XCHG: 交换操作数'
- - '###'
  - 'XLAT: 通过表翻译字节'
