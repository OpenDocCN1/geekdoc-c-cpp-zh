- pgno: 86
  md: '![](img/6aa0b2c29d7992041f99024e15f60a20_86_0.png)


    Success is a good hot tub


    The question is: How does a business enable innovation so that it can join the
    ‘hot-tub’ elite in success? This book isn’t a book on how to foster creativity
    in your people, but it is a book that intends to enable software that can embrace
    change and stressors that are important to your systems, and so it is natural
    to consider the stressors that occur when innovation is valued and how we can
    thrive on them.


    # Technical Innovation Stressors


    *Technology on its own cannot spark innovation, but it can be a force that supports
    or resists it.*


    As it happens, innovation is adversely affected by technology for many of the
    same reasons that change itself can be resisted. When attempting to innovate you
    want technology that encourages your ideas and attempts, and then supports taking
    those ideas that are most successful into full innovations that provide real business
    value.'
  merge: -1
