- pgno: 79
  md: 'Single-purpose, simple (i.e. disentangled), autonomous and separately deployed
    services organised according to the change stressors on the system and that share
    nothing, especially state!


    That''s it. No mention of Source Lines of Code (it''s not the 80s after all),
    and no mention of whether a service is an object or a function. No mention of
    whether the service is invoked synchronously or asynchronously using HTTP or something
    else. Those are detailed design decisions and there will be highly context-dependent
    reasons for choosing one option over another.


    A microservice-based architecture is simply a one that contains microservices,
    with the devil in the details of how those simple microservices interact with
    one another while still supporting the runtime and design-time stressors. Microservices
    provides the right level of granularity to support change, but it is in the links
    between microservices that change needs to the be accommodated.


    It is in the links between services where antifragility can be applied.


    # Embracing or even Thriving on Change in the Links between Microservices


    The various design and runtime stressors are prepared for if you build a system
    of microservices, but the challenge then shifts into the links between services.


    For example, if you are going to deal with Wild Success, then microservices allow
    you to scale at the individual services that'
  merge: -1
