- pgno: 45
  md: '# What is Philosophy?


    There’s nothing like using a broad and misunderstood term in order to explain
    another broad and misunderstood term, but that’s what “Software Architecture is
    Philosophy” can look like at first glance.


    My working definition of philosophy is:


    +   - The love of wisdom, technically as per the definition of the word. This
    is nice but hardly more helpful.

    +   - A set of *thinking tools, ideas, concepts, experience and biases* that you
    bring to bear on your solutions. *Much more helpful to our discussion here.*


    When initially considering a piece of software to construct, or a solution to
    build, or a system to bring to life¹⁰ you bring your own philosophy to bear on
    the situation. *You bring your own past, and sometimes painful, experiences and
    biases.*


    You bring your preference for the JVM, because it’s familiar. You bring the decisions
    that *"worked ok before"*, as well as the *pain of what didn’t for you*. You bring
    the *desire to use the "safe"* tools that you saw work before, plus the guilty
    desire to use new tools in order to make the project interesting to you.


    You bring your *friendship with vendors and other professionals* because you feel
    safe with them and would like to work with them on this. You bring your *beliefs,
    and occasionally evidence, that certain practices work well for organising*'
