- pgno: 37
  md: '# ...Guilt...


    You rapidly proceed to the next phase, which is dominated by the emotion of *guilt*.
    Why guilt? Because deep down you know that *the change being asked for in fact
    "should" be that small, but it''s not.*


    Time to meet the enemy...


