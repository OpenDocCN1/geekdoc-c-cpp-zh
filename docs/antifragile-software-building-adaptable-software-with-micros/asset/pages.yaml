- pgno: 123
  md: 'If you have a popular view chances are you will scale it out and, since its
    *state is simply a sum of the events it has seen similar to an aggregate*, you
    can *spin up a new view instance to handle load by playing in those events*.


    *If you need new answers to your questions, you''ll simply create a new view.*


    *Views are microservices if they need to evolve,* come-and-go at their own rates
    as new functionality is tested and accepted within the system.'
