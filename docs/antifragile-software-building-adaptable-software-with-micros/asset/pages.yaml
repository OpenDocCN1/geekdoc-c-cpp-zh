- pgno: 129
  md: 'There will be many other stressors to consider but as it happens it’s usually
    best to **consider stressors on a system as the system actually evolves.**


    This is a great thing as if we were forced to come up with all the possible stressors
    in advance we’d likely end up in a strange version of **analysis paralysis** where
    we never built anything for want of exploring all the options.


    Instead it’s now time to get started. To build some of the idea: an Open Cloud
    Index. Once we have something real, we can begin to look at the stressors that
    will affect the system in parallel and evolve our ideas as we go.


    For now, it’s time to build something. So where do we start?'
