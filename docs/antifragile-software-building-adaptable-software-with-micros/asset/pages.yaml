- pgno: 121
  md: 'An Aggregate is some **_current picture based on the events observed_** in
    one or more streams.


    Often an aggregate is the result of some **_processng, or projection, applied
    to an event stream._**


    An aggregate is **_optimised for update_**; it must consume the events in the
    streams it is interest in as quickly as possible to ensure it is as up-to-date
    as possible.


    However an aggregate is an intermediate step. **_It still doesn''t give me an
    answer._**


    **_An aggregate often simply produces another stream of more refined events!_**


    **_Microservices can be aggregates and projections,_** especially if you need
    those aggregates and projections to evolve at their own pace.


    That''s all well and good, but when am I going to be able to get a useful answer
    our of this flow of events?'
  merge: -1
  img_proc: true
