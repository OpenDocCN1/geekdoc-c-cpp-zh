- pgno: 19
  md: '# Philosophical Underpinnings


    One means of avoiding dogma is to display your reasoning ready for it to be (hopefully)
    fruitfully critiqued and mined by your happy or unhappy readership. The other
    is to only promote those things that you have done yourself, thereby having real
    skin in the game. We''ll apply both here.


    Every book that aspires to push things truly forward has a set of philosophical
    underpinnings that inform the thought and ideas that it proposes and this book
    is no different, except that I''d like to make my philosophical underpinnings
    more explicit than most by listing them out here.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Axioms


    > > “...is a premise or starting point of reasoning.”

    > > Wikipedia


    Axioms are the undisputed claims upon which I can then build up everything else
    I put forward in the rest of this book.


    I could quite easily simply dump a collection of tools, practices and processes
    in this book on you my understanding reader without some sort of shared understanding
    underpinning the whole exercise. This is what many books do, but more often than
    not I’d then spend the rest of my career explaining the ideas underlying those
    techniques, and in fact many do spend a lucrative career doing so.


    My aim is a different one here and so, in order to get a few questions out of
    the way, here are my a-priori axioms that I’d like you to consider as the basis
    for our thinking throughout the rest of the book:


    +   - Your software’s first role is to be useful

    +   - The best software is that which is not needed at all

    +   - Human comprehension is King

    +   - Mechanical Sympathy is Queen

    +   - Software is a process of research & development

    +   - Software Development is an extremely challenging Intellectual Pursuit'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# Axiom 1: Software’s first role is to be useful


    > *The effect and outcome of software, it’s contribution to desirable value that
    was not present without the software, is the primary responsibility of good software.*


    While the process and crafting techniques used to create software is certainly
    important, software at a minimum must at least exhibit some usefulness to people
    as an outcome whether they be a business or an individual.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# Axiom 2: The best software is that which is not needed at all


    This axiom is more controversial, especially given the silo that the majority
    of contemporary software developers work within.


    *A software developer should be most primarily concerned with enabling valuable
    change rather than simply focused on shipping software.*


    If this axiom is accepted, valuable change becomes a maxim of a software developers
    thinking as they approach a problem domain where software might be applicable.


    If this broadness of options is recognised, software is one possible answer to
    the problem domain but should be placed in a context of other recognised options
    for meeting the challenges of the domain.


    As other axioms here state, developing software is a challenging intellectual
    pursuit and, even with the enabling factor of adaptability, can result in a complex
    solution where an alternate solution was possible.


    Simply stated, this axiom puts to you that software is one option but by no means
    the only option when enabling valuable change, which is in our opinion, ironically
    perhaps given the name, the role of the modern software developer.'
  merge: -1
  img_proc: true
