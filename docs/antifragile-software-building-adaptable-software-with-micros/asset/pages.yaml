- pgno: 97
  md: '# On Being Critical


    > "Never complain unless you are taking risks doing it.." - Taleb, Facebook²⁰


    Honesty demands that I will share the patterns, designs and tools that facilitate
    the development of this system. However this *isn''t limited to just the ones
    that helped*. I will likely criticise tools, techniques, patterns that conflict
    with the goals of an antifragile software system and I''ll *take the risk of making
    that criticism public here.*


    As Nassim Nicholas Taleb also points out, "*If you see fraud and do not say fraud,
    you are a fraud*". Through an honest discursive on how I build a real-world, antifragile,
    commercial software product, and sharing all my dirty laundry throughout the journey
    as I go, the aim is for you my dear reader to get a better learning journey and
    for me to stay true to my antifragile ethics of maintaining *skin in the game*.


    It''s time to *get that journey started now.*'
