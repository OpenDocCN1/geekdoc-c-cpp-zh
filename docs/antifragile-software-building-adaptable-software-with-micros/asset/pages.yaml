  md: '# Suggested Further Reading


    No technique in software development is an island and Simplicity underpins many
    of the more recent development in software development techniques. No doubt the
    following list will grow as time goes by and more attention is focussed on solving
    real problems of software development.


    Included in this list for further investigation and learning are techniques such
    as:


    +   - **Domain Driven Design, CQRS and Event Sourcing** - Human Comprehensibility
    is king and nothing brings this to the fore like the work of Eric Evans and Greg
    Young who have given us [Domain Driven Design: Tackling Complexity in the Heart
    of Software] and [CQRS and Event Sourcing] respectively. Unfortunately Greg is
    still working on his book but we’re all rooting for that to be out soon as, from
    Greg’s talks and very popular courses, this will be crucially important material
    for simplifying software and increasing adaptability.

    +   - **Clean Code** - Human Comprehensibility is king but it goes hand-in-hand
    with clarity. Clean Coding techniques'
