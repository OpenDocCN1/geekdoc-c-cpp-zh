- pgno: 115
  md: '# Past, Unchangeable Facts


    Events are **things that happen in the past**.


    **Events are named as Facts.**


    For example: User **Log-in Requested**, rather than **UserLoginRequest**.


    Events are Unchangeable, **Immutable**.


    Events have an **identity, often a time/date**, and possibly a sequence number.


    Events are the minimal set of information about a datum; **events are metadata**.


    There are events that are intended to change something, these are called **Commands**.
    There are events that ask a question, these are called **Queries**.


    ![](img/6aa0b2c29d7992041f99024e15f60a20_115_0.png)


    **Events are the foundational building blocks of comprehension of a system and
    of microservices-based architectures.**'
  merge: -1
  img_proc: true
