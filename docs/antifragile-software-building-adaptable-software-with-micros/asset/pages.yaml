  md: "# # Skin in the Game\n\n*Approach to Implementation - Antifragile Ethics -*\
    \  \n*Show & Share - Rules of Honesty and Being Critical*\n\nI’m sitting on the\
    \ benches outside the Pivotal^17 offices in London enjoying the early morning\
    \ sun before presenting a course. I’m pondering how to honestly and authentically\
    \ write a book on antifragile software. Specifically how do I share my knowledge\
    \ of the different characteristics and patterns of these systems with readers\
    \ of this book without sounding like a *high-level, ivory-tower architect fraud*.\n\
    \nThis is more than just an academic moment of authorial doubt, this is a serious\
    \ concern! I’m writing a book that features an- tifragility as a key theme and\
    \ one thing that Nassim Nicholas Taleb hammers home in his essays on ethics in\
    \ the Antifragile book^18 is that I should avoid, at all times, being a fraud.\n\
    \nI should not just talk about it but *live it; walk the walk*. Most importantly,\
    \ I should have *skin in the game*.\n\n***So how the heck do I do that?***\n\n\
    ^17 https://pivotal.io\n\n^18 http://www.amazon.co.uk/Antifragile-Things-that-Gain-Disorder/dp/0141038225"
  merge: -1
  img_proc: true
