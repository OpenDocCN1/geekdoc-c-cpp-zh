- pgno: 95
  md: '**anything that I haven’t personally taken a risk on.** I don’t want others
    trying out the ideas that I’ve stated authoritatively but not actually executed
    or applied myself, using their **experiences and inherent fragility to bolster
    up my own ideas.**


    **When I recommend something, it''s for real and you can see it and I’ve risked
    my own projects and professional reputation on it.**


    That’s why I’m approaching this architecture, design and implementation section
    of the book on antifragile software differently than you might usually expect.
    I’m going to share the **successes, pains and epiphanies of building a real world,
    commercial project as I build it with you.**


    **I’m going to do this for real with my own skin in the game before you even consider
    placing yours on the line.**'
