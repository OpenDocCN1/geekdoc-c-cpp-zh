  md: 'so it is that approach that we''re going to explore fully in this book.


    This is not to say that microservices are the only way to produce simple and antifragile
    software systems. Microservices have certain characteristics that make them ideally
    simple and at the same time flexible enough to handle the different demands of
    various stressors that we may choose to optimise for. At the same time, microservices
    encourages a level of fine granularity that supports evolving parts of a system
    in relatively isolation, giving a real opportunity to beat the elephant in the
    standup.


    It is my belief that microservices is a transitory term used to differentiate
    software architectures that do not optimise for simplicity and antifragility from
    those that do, and so it''s a useful label for those qualities rather than implying
    that those qualities can only be achieved with this architectural approach.


    # Embracing Change with Microservices


    So what are microservices? Like many terms in our crazy industry, it''s a blurry
    statement and open to huge misrepresentation. I''ve worked now on what are commonly
    understood to be microservice-based software systems for around 4 years, long
    before the term moved into the common lexicon.


    It is within the framework of stressors that we can begin to define microservices.
    The key to a system that can embrace change is granularity and modularity of design,
    code and deployment.


    With that in mind, here are the properties that commonly come under the banner
    of being a microservice:'
  merge: -1
