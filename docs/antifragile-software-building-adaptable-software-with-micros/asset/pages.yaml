- pgno: 109
  md: 'implementations of the ubiquitous language and used to communicate between
    the levels of the design. All fine so far.


    All fine until ***they are used for the specific and orthogonal purposes of each
    layer.***


    The Repository layer attempts to turn the domain objects into storable entities,
    often using something like an Object-Relational Mapping system.


    The Services have their own pressures and want the domain objects to be amenable
    to those, but the Repository layer will often force a design compromise in order
    to effectively store the data in the objects with an entirely different relational
    schema in the database.


    Then top-level integration layers will then add their own pressures to the mix.


    I’ve seen domain objects shoe-horned into acting as Form Back-ing Objects (FBOs)
    for web layer forms as well as being used to represent payloads where they are
    marshalled to and from XML, JSON, PDFs ... you name it!


    Suddenly these poor ***domain objects are being used, and abused, by everything!***
    Rather than being the point of clarity and comprehension that the implementation
    of the ubiquitous language should be, the domain objects are a hideous franken-'
  merge: -1
