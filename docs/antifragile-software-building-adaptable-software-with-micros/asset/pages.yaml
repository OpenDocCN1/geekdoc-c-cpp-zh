  md: '# Stressors on Software


    *Stressors - Innovation - Wild Success & Wild Failure*


    A stressor can be thought of as *any force that pushes your* *software''s limits*,
    stressing the architecture and design in predicted and unpredictable ways.


    The best metaphor here is the one given in Nassim Nicholas Taleb''s "Antifragile"
    book¹, that a stressor is like a weight exercising a muscle. In our case, the
    muscle is the software system and the weight can come in many forms, including
    but not limited to changing needs over time.


    In Taleb''s analogy, a muscle will gain from encountering a certain degree of
    stress from a stressor as it''s designed to improve with it. This is exactly what
    we''d like from our software: to *not just embrace change as a stressor but to
    actually thrive and improve based upon it*.


    Of course a muscle will break if the weight is too high, but the cost of having
    a muscle that can handle any weight is prohibitive on your body''s resources.
    Once again, this is similar to software systems, where *there will always be stressors
    that, if they go over a certain bound, may break your system*.


    So a stressor is a force on your software system that, at a certain level, may
    improve the system or, if it goes over a certain level,'
  merge: -1
  img_proc: true
