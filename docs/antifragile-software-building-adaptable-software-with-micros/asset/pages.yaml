- pgno: 56
  md: '+   - **Innovation** Desirable functional change, for whatever reason

    +   - **System wildly successful!** System needs to be scaled up because it is
    being used a LOT. The essence of “success shouldn’t kill you”

    +   - **System hardly used** System needs to be scaled down as it’s not being
    used a lot.

    +   - **System failures** Nodes coming up or going down, hardware failure, transient
    network conditions.

    +   - **The emergent need to reuse** Can be understood when you hear the phrase:
    “Wouldn’t it be great if we could reuse functionality X from your system”


    **NOTE:** I deliberately don’t make a big deal out of *development* and *maintenance*
    here. I believe that there is very little difference in modern software development,
    where releases are expected constantly and frequently, between development and
    maintenance. It’s all development, or more accurately research and development,
    and the only difference is the amount of legacy software and decisions involved
    ,and the aim of this book is to help you build a legacy that embraces, or even
    thrives, on change as much as possible.


    Stressors are not inherently *bad* or *good*, they are just reality. That’s not
    to say that a stressor taken to an extreme shouldn’t have a damaging effect on
    your system, it most certainly will.


    A classic example of this is when Netflix hit the problem of a whole Amazon cloud
    region going down. Netflix had done a great job of architecting their system for
    certain stressors, but that was the one that broke the muscle!'
