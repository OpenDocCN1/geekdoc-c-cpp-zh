- pgno: 30
  md: '# A Nod Towards Over-Production


    Before we move on to the main challenge of this book, there’s a little context-setting
    I’d like to do on the subject of “Building the right thing” as it relates to where
    the various destinations that the rest of this book intends to take you on a journey
    to.


    Over Production is a Lean Waste, and it is on the increase in Software Development
    across the industry. For our purposes, Over Production can be defined as building
    the wrong thing.


    This includes the cases of building the right thing at the wrong time, and of
    course the wrong thing at the right time. The temporal characteristic of rendering
    a product the wrong thing is included in the general definition of building the
    wrong thing


    As software developers learn to organise and complete their work more efficiently
    using work management techniques such as Agile processes, the potential for greater
    productivity is unlocked. At least greater productivity potential is unlocked
    while the challenges of reacting quickly to change through adaption can be kept
    under control.


    The flip side of this productivity is that it is much more likely to produce the
    wrong thing. Increased efficiency does not lead to increased effectiveness of
    what is produced.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '![](img/6aa0b2c29d7992041f99024e15f60a20_31_0.png)


    You wish your software development engine was even half this sexy, or effective.


    If viewed as an engine of software production, it could be argued that current
    Agile and Craftsmanship techniques in the software development industry are having
    huge impacts in helping that engine fire on all cylinders. However taking the
    analogy a step further, the engine may be firing on all cylinders but the direction
    the engine is heading in, and its ability to change course, is an entirely different
    matter.


    Even if you apply the patterns and techniques from this book to help you build
    the right thing, right, i.e. build adaptable software, that is only an important
    *enabler* that supports the possibility of building the right thing. It does not
    guarantee that useful software will be an outcome. For more on techniques that
    work towards overcoming that problem, take a look in the **Further Reading** chapter
    at the end of this book.


    That said, *architecting and building software that enables you to build the right
    thing continuously is no mean feat*, so we begin our journey with the ***biggest
    barrier to a piece of software being adaptable...*'
  merge: -1
  img_proc: true
