- pgno: 16
  md: '# What this book is NOT about


    Rather than waxing lyrical on highfaluting thoughts, concepts and ideas in software
    development or getting tangled up in the exhausting and ultimately mostly meaningless
    discussions (see: wars) around languages and frameworks, this book is going to
    dive into the *practical tools I''ve found that really help with building software*
    and meeting the challenges of modern software development.


    That means the *following topics are rendered essentially meaningless and so have
    been completely steered clear of.*


    # Brand X Process


    Processes are merely ways of organising work with the aim of trying to ensure
    that something valuable happens.


    This book will be avoiding discussions of the form "Scrum is better than Kanban
    because... <insert biased and inane argument here>" and instead concentrate on
    practical tools that you can use to tailor your own process.


    As a wise man once said, do what works for you. I aim to help you to figure out
    what works for you, not sell you on Brand X of anything in particular.


    # Brand X methodologies


    Methodologies are colloquially used to mean processes in software development.
    Methodology is a misnomer typically used by people who wish to make something
    sound much more'
  merge: -1
  img_proc: true
