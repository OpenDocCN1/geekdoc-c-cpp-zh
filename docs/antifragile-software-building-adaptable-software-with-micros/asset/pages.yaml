  md: '# Technical Debt is for real


    Technical debt is when you are *deliberately* cutting corners in design and your
    code to be faster today, aware that you will have to round those corners off in
    the future when there is more time.


    If there is ever more time...


    There is little doubt that *technical debt does accrue as designs deviate under
    the pressure of project and product delivery*, but this is not really what is
    happening with the Elephant.


    # The Elephant in the Standup is not Technical Debt, nor Refactoring


    The Elephant is not a result of cutting corners in your design and code, knowingly
    or otherwise, it is the *inevitable result of a well-thought-out design for yesterday
    coming into contact with the reality of change today*.


    Now you’ve met the lies, it’s time to meet the real reason that you’re having
    to use them.


    *Why do we have the Elephant in the Standup? And how can we beat it?!*


    In order to beat the Elephant you’re going to *need to think differently* and
    that means examining *how software architecture and design is commonly thought
    about and how that needs to change*.'
