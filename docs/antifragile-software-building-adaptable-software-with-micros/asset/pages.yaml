- pgno: 113
  md: '# Not the ***Things***, the ***Things that happen***


    Time to turn back to the *wisdom of Gawain*.


    It turns out that when discussing a system with non-technical stakeholders there
    is often an ***entirely different emphasis to the dialogue.*** They don’t discuss
    the pieces, or things, involved in a given domain. Non-technical stakeholders
    often revert to talking about ***what has to happen.***


    > ***“This happens, then this happens, then this is the final result.”***


    Non-technical stakeholders aren’t talking about objects, or even components and
    services! They are talking about ***things that happen and their results.***


    They are talking about ***Events.***'
