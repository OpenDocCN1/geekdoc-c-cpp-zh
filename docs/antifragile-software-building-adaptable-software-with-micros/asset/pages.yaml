  md: 'Laurie Miles was a recognised expert at running successful businesses. He was
    also a care salesman, but don’t hold that against him!


    One of the keys to Laurie’s success was that he could, time and again, get the
    best out of people. He could take individuals that were, at best, performing ok
    or, at worst, grossly under performing and give them a platform to make a positive
    impact to the business.


    When asked how Laurie did this, the answer was straightforward: by enabling innovation
    through an environment that was open to it. Laurie knew that ideas and innovation
    wouldn’t come from any special ‘innovation group’, even less so the actual Directors
    of the company.


    Laurie knew that the best innovations, the ones that would have great impacts
    to the business, came from harnessing the creativity of the individuals in the
    business. By removing blocks to that creativity and giving just enough guidance
    so that they could experiment in safety with their potential innovations.


    And as you can see below, Laurie Miles enjoyed a high degree of success with this
    simple approach.'
  merge: -1
