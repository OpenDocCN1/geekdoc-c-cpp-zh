- pgno: 80
  md: 'are most challenged by the shape of that success. Depending on how you''ve
    designed the incoming and outgoing connections from those services, you may still
    find that the scaling can be a challenge.


    Currently the majority of microservice-based architectures use a simple selection
    approach to the links between services. The first-line choice is often to use
    HTTP, possibly RESTful and possibly asynchronous, as HTTP is a wonderful protocol
    for supporting many of the stressors that can be applied to those links. Second-line
    choice is usually some sort of messaging approach with a broker involved. Third-line,
    usually reserved for low-latency options, is to use something more bespoke that
    might require more effort to achieve the level of de-coupling between microservices
    to support the stressors being applied.


    Embracing change and its stressors is an excellent starting point, and is the
    aim of designing your system using microservices. Finally we have an architectural
    approach that looks to embrace change on its own terms.


    You can go even further. You could design the links between services such that
    you can embrace change and for the majority of microservice-based systems that
    is good enough. It''s certainly a lot better than where we were. However if you
    go beyond that you can end up with a system that not only embraces change but
    in fact thrives on those stressors. A system that doesn''t just adjust but *improves*
    based on the stressors it encounters. This is where microservices provide the
    foundation of *antifragile* software systems.


    Where this achieved a system provides a fertile landscape for innovation just
    not possible with a monolith. New languages'
