  md: 'Agile software development killed Waterfall and Platonic perfection at the
    same time, and good riddance I say! Agile software development came from an entirely
    different school of thinking, a school that knew that adaption was the key because
    we really don''t know what is going to happen next. We are involved in research
    and development, and that requires a completely different philosophy, the philosophy
    best characterised by the school of Stoicism.


    # Agility and Fortuna


    ![](img/6aa0b2c29d7992041f99024e15f60a20_50_0.png)


    One school bucked against this idea of perfection, embracing reality at its core.
    That school of philosophy of the Stoics. The stoics looked very differently at
    the purpose of philosophy, the principle question being “given that we don’t know
    why is going to happen next, how best should we live our life”.


    No summoning of perfection there. In fact Seneca¹³, a prominent and very successful
    Roman stoic, summoned a goddess to communicate the fickleness and unpredictability
    of reality. That goddess was Fortuna.


    Instead of a dream of perfection with enough planning in Stoicism instead we have
    an ultimately pragmatic view of how to approach life and the big decisions with
    the knowledge that we can’t really predict much at all. Seneca has earned fame
    for writing:


    ¹³ Stoicism through Seneca on Wikipedia.'
