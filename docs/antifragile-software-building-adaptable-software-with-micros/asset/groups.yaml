    What does Platonic form and perfection have to do with software and architecture,
    much less agility? The problem is perfection, and the implication of perfect knowledge.


    Waterfall Thinking was based on the belief that perfection could be achieved.
    The perfect solution to the problem. This would work out fine, but for the nature
    of our reality. That nature includes two forces against perfect knowledge, time
    and change.


    ![](img/6aa0b2c29d7992041f99024e15f60a20_49_0.png)


    This early Agile software development book nailed it with its subtitle


    The problem itself often changes with time, enter stage-left the ideas of Agile
    software development. In the early days of agility the emphasis was on embracing
    change. That might have got lost in the confusion of certification, coaching and
    other nonsense, but in essence agile software development was a big step forward
    as it dropped the idea of perfection, and more importantly the idea of perfect
    knowledge.


    Agile software development killed Waterfall and Platonic perfection at the same
    time, and good riddance I say! Agile software development came from an entirely
    different school of thinking, a school that knew that adaption was the key because
    we really don''t know what is going to happen next. We are involved in research
    and development, and that requires a completely different philosophy, the philosophy
    best characterised by the school of Stoicism.


    ## Agility and Fortuna


    ![](img/6aa0b2c29d7992041f99024e15f60a20_50_0.png)


    One school bucked against this idea of perfection, embracing reality at its core.
    That school of philosophy of the Stoics. The stoics looked very differently at
    the purpose of philosophy, the principle question being “given that we don’t know
    what is going to happen next, how best should we live our life”.


    No summoning of perfection there. In fact Seneca¹³, a prominent and very successful
    Roman stoic, summoned a goddess to communicate the fickleness and unpredictability
    of reality. That goddess was Fortuna.


    Instead of a dream of perfection with enough planning in Stoicism instead we have
    an ultimately pragmatic view of how to approach life and the big decisions with
    the knowledge that we can’t really predict much at all. Seneca has earned fame
    for writing:


    ¹³ Stoicism through Seneca on Wikipedia.


    > "The next day is not promised you ... nay, the next hour is not promised you!"
    - Seneca the Younger


    In other words:


    > "We can''t predict the future."


    Or to give things a software delivery emphasis:


    > "We don''t know what we''re doing and we don''t know what we want, but that''s
    ok and normal!"


    Admittedly this can seem rather depressing on the surface of things. At every
    step, Fortuna is there to either reward us with the cornucopia or hit us with
    the rudder; either way, we need to deal with it, there''s no use complaining!


    In Stoicism, and from Eastern philosophy to some degree in Buddhism, we learn
    to accept and adapt to inevitable change and it''s this view that is at the root
    of agile software development. Perhaps a better term for agile software development
    would have been adaptable software development but unfortunately that''s for the
    history books now.


    In agile/adaptive software development we do a lot of work to embrace change in
    our processes, attempting to deliver while being prepared for the unknown because
    that is the nature of reality and the intellectual pursuit that is software development.


    Fortuna should be the Greek god of software development to remind us that we really
    don''t know what''s going to happen next. That leads us neatly back to software
    architecture and those big decisions; what can Fortuna and stoicism offer us there?


    ## Stressors on Software


    *Stressors - Innovation - Wild Success & Wild Failure*


    A stressor can be thought of as *any force that pushes your software''s limits*,
    stressing the architecture and design in predicted and unpredictable ways.


    The best metaphor here is the one given in Nassim Nicholas Taleb''s "Antifragile"
    book¹, that a stressor is like a weight exercising a muscle. In our case, the
    muscle is the software system and the weight can come in many forms, including
    but not limited to changing needs over time.


    In Taleb''s analogy, a muscle will gain from encountering a certain degree of
    stress from a stressor as it''s designed to improve with it. This is exactly what
    we''d like from our software: to *not just embrace change as a stressor but to
    actually thrive and improve based upon it*.


    Of course a muscle will break if the weight is too high, but the cost of having
    a muscle that can handle any weight is prohibitive on your body''s resources.
    Once again, this is similar to software systems, where *there will always be stressors
    that, if they go over a certain bound, may break your system*.


    So a stressor is a force on your software system that, at a certain level, may
    improve the system or, if it goes over a certain level,


    - **Innovation** Desirable functional change, for whatever reason

    - **System wildly successful!** System needs to be scaled up because it is being
    used a LOT. The essence of “success shouldn’t kill you”

    - **System hardly used** System needs to be scaled down as it’s not being used
    a lot.

    - **System failures** Nodes coming up or going down, hardware failure, transient
    network conditions.

    - **The emergent need to reuse** Can be understood when you hear the phrase: “Wouldn’t
    it be great if we could reuse functionality X from your system”


    **NOTE:** I deliberately don’t make a big deal out of *development* and *maintenance*
    here. I believe that there is very little difference in modern software development,
    where releases are expected constantly and frequently, between development and
    maintenance. It’s all development, or more accurately research and development,
    and the only difference is the amount of legacy software and decisions involved,
    and the aim of this book is to help you build a legacy that embraces, or even
    thrives, on change as much as possible.


    Stressors are not inherently *bad* or *good*, they are just reality. That’s not
    to say that a stressor taken to an extreme shouldn’t have a damaging effect on
    your system, it most certainly will.


    A classic example of this is when Netflix hit the problem of a whole Amazon cloud
    region going down. Netflix had done a great job of architecting their system for
