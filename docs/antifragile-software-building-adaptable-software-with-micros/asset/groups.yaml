    This book captures a selection of techniques to help you build and deploy antifragile
    software for yourself.


    ## The Need for Antifragility in Software:

    Enabling Innovation


    > “40% of companies from 2000 were no longer in the Fortune 500 a decade later
    in 2010” -CNN


    As well as the intimate and personal embarrassment of finding the elephant in
    the standup places you in a difficult corner, the pace of change is increasing
    like an out-of-control steam train running down an infinitely high hill.


    Contrary to this analogy, this is not a bad thing. It is merely the natural pickup
    of pace of innovation as IT moves many of its underlying specialised concerns
    into a commodity scenario. More time is being spent on shipping software that
    is better and faster, rather than just being able to ship.


    Change is a natural and positive force if turned to the needs of real innovation,
    but only if your software can keep pace with the rapidly escalating delivery speedometer.


    ## Love is Antifragile, an interlude


    ![](img/6aa0b2c29d7992041f99024e15f60a20_70_0.png)


    Love is Antifragile; Love is a Relationship; Antifragility is in the Relationship


    Hang on, are we going to be talking about love in a technical book?! What are
    we thinking? Please stay with me, all will make more sense in a few more paragraphs...


    **_Love is antifragile._** When two people are in love, and that relationship
    comes under stress, then if it’s really love then **_the relationship will not
    just survive, it will improve._**


    That’s not to say that any stress can be coped with, **_there’ll be situations
    that will break up even the most in-love couple._**


    **_Love abides through its natural antifragility, even though the individuals
    involved may be robust, fragile or antifragile in themselves._**


    ## Relationships between Parts are the Key


    The main focus of antifragility is in the relationship between the parts of the
    system and this is where we can come back to software. Antifragility is in the
    relationships between parts of your system. *It’s a property of the connections
    and what is exchanged between them.*


    *The parts matter less than the connections.*


    So as you’ll see when we begin to evolve systems towards antifragility we’ll be
    focusing on what parts should be like and *how the relationships between those
    parts can be comprehended and codified to thrive based on the stressors the system
    may encounter.*


    Before we begin that journey however there’s one more key technology-agnostic
    property that we need to consider first.


    A property that is foundational to antifragile software.


    That property is *Simplicity.*


    those who have to read and comprehend it. That tool is simplicity and it is at
    the heart of everything from antifragile software systems to microservices.


    ## Simplicity is *Objective*


    The first thing you need to know about simplicity is that it is objective. This
    means that we can all recognise when something is simple, and that it''s not usually
    possible to argue much about it.


    At this point it is important to define what we mean by simplicity when looking
    at code and software systems. For our purposes I’m going to be using the definition
    of simplicity kindly codified by Rich Hickey, creator of the Clojure language.


    Rich explains that simplicity is defined as the number of concerns *entangled*
    within a given context. Simplex would mean “one braid”, and so one concern present.
    Complex, or complicated as Rich would phrase it, is where one or more concerns
    are entangled together and need to be considered together, effectively blowing
    open the doors to cognitive overhead.


    ## The Simplicity Continuum


    Simplicity is expressed as a continuum, going from Over-simplified, through some
    point of optimum Simplicity, before moving into the region of Over-Complex.


    ### Essential & Accidental Complexity


    Some problems are naturally complex. Either because the actual problem is complex
    and involved lots of factors, or because of constraints brought by choice of language,
    framework or paradigm, there will be a point at which no further organisation,
    reduction or hiding can be achieved. I call this the point of **essential complexity**.


    - **Essential Complexity** is the complexity inherent in the nature of the problem
    being solved and has to be accepted. This is quite different from its evil cousin,
    **accidental complexity**.

    - **Accidental Complexity** is everything we add to a given problem, that could
    be reduced if we gave the design more thought or if we valued simplicity higher.


    ### Why do we introduce accidental complexity?


    There are several theories as to why we as developers tend to increase complexity
    in the solutions that we build. Some focus on the ego of the developer, others
    focus on the need for job protection or just knowing no better.


    My favourite quote is one attributed to a little-known study by Michael A. Jackson,
    which is that we have a tendency to create complex solutions to simpler problems
    because “we are bored by the business problem”.


    ## Microservice-based Architectures for Antifragility & Simplicity


    *Thriving on Change - Peers & Pipelines - Lego*


    ![](img/6aa0b2c29d7992041f99024e15f60a20_77_0.png)


