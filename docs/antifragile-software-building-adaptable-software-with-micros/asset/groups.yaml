    those who have to read and comprehend it. That tool is simplicity

    and it is at the heart of everything from antifragile software

    systems to microservices.


    # Simplicity is *Objective*


    The first thing you need to know about simplicity is that it is

    objective. This means that we can all recognise when something

    is simple, and that its not usually possible to argue much about

    it.


    At the point is important to define what we mean by simplicity

    when looking at code and software systems. For our purposes I’m

    going to be using the definition of simplicity kindly codified by

    Rich Hickey, creator of the Clojure language.


    Rich explains that simplicity is defined as the number of concerns

    *entangled* within a given context. Simplex would mean “one

    braid”, and so one concern present. Complex, or completed as

    Rich would phrase it, is where one or more concerns are en-

    tangled together and need to be considered together, effectively

    blowing open the doors to cognitive overhead.


    # The Simplicity Continuum


    Simplicity is expressed as a continuum, going from Over-simpli-

    fied, through some point of optimum Simplicity, before moving

    into the region of Over-Complex.'
