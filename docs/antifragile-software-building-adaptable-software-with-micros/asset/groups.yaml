    \ systems with readers of this book without sounding like a *high-level, ivory-tower\
    \ architect fraud*.\n\nThis is more than just an academic moment of authorial\
    \ doubt, this is a serious concern! I’m writing a book that features antifragility\
    \ as a key theme and one thing that Nassim Nicholas Taleb hammers home in his\
    \ essays on ethics in the Antifragile book^18 is that I should avoid, at all times,\
    \ being a fraud.\n\nI should not just talk about it but *live it; walk the walk*.\
    \ Most importantly, I should have *skin in the game*.\n\n***So how the heck do\
    \ I do that?***\n\n^17 https://pivotal.io\n\n^18 http://www.amazon.co.uk/Antifragile-Things-that-Gain-Disorder/dp/0141038225\n\
    \n**anything that I haven’t personally taken a risk on.** I don’t want others\
    \ trying out the ideas that I’ve stated authoritatively but not actually executed\
    \ or applied myself, using their **experiences and inherent fragility to bolster\
    \ up my own ideas.**\n\n**When I recommend something, it's for real and you can\
    \ see it and I’ve risked my own projects and professional reputation on it.**\n\
    \nThat’s why I’m approaching this architecture, design and implementation section\
    \ of the book on antifragile software differently than you might usually expect.\
    \ I’m going to share the **successes, pains and epiphanies of building a real\
    \ world, commercial project as I build it with you.**\n\n**I’m going to do this\
