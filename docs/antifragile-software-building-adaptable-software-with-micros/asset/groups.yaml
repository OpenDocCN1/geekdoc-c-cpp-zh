    ## The Need for Antifragility in Software:

    实现创新


    > “2000 年的公司中，有 40% 在十年后的 2010 年已不再位列《财富》500 强” -CNN


    除了在站立会议中发现大象带来的亲密而个人的尴尬让你陷入困境之外，变化的步伐正像一列失控的蒸汽火车沿着无限高的山坡疾驰般加快。


    与此比喻相反，这并不是一件坏事。这仅仅是创新的步伐自然加快，因为 IT 将其许多底层专业关注点移入商品化场景。更多的时间被花费在交付更好、更快的软件上，而不仅仅是能够交付。


    如果变化被导向真正的创新需求，它就是一种自然而积极的力量，但前提是你的软件能够跟上快速攀升的交付速度表。


    ## Love is Antifragile, an interlude

    爱是反脆弱的，间奏


    ![](img/6aa0b2c29d7992041f99024e15f60a20_70_0.png)


    爱是反脆弱的；爱是一种关系；反脆弱性存在于关系之中


    等等，我们要在技术书里谈论爱情吗？！我们在想什么？请耐心跟我走下去，几段之后一切都会更清晰...


    **_爱是反脆弱的._** 当两个人相爱，而这段关系承受压力时，如果这真的是爱，那么 **_这段关系不仅会存活下来，还会变得更好。_**


    这并不是说任何压力都能应对，**_会有一些情况会让即使最相爱的情侣也分手。_**


    **_爱凭借其自然的反脆弱性得以维系，即使其中涉及的个人本身可能是稳健的、脆弱的或反脆弱的。_**


    ## Relationships between Parts are the Key

    部分之间的关系是关键


    反脆弱性的主要关注点在于系统各部分之间的关系，这也是我们可以回到软件的地方。反脆弱性存在于你系统各部分之间的关系中。*它是对连接及其之间交换内容的属性。*


    *部分的重要性不如连接。*


    因此，当我们开始将系统向反脆弱性演进时，你会看到我们将关注各部分应是什么样的，以及*如何理解和规范化这些部分之间的关系，以便基于系统可能遇到的压力源而蓬勃发展。*


    然而在开始这段旅程之前，还有一个关键的技术无关属性我们需要先考虑。


    这是反脆弱软件的基础属性。


    该属性是*简洁性*。


    那些必须阅读和理解它的人。这项工具就是简洁性，它是反脆弱软件系统到微服务的核心。


    ## Simplicity is *Objective*

    简洁性是*客观的*


    你需要知道的关于简洁性的第一件事是它具有客观性。这意味着我们都能识别出某事物是否简单，而且通常无法对此争论太多。


    此时，定义我们在查看代码和软件系统时所指的简洁性非常重要。为我们的目的，我将使用 Clojure 语言的创造者 Rich Hickey 善意规范化的简洁性定义。


    Rich 解释说，简洁性被定义为给定上下文中*纠缠*的关注点的数量。Simplex 意味着“一股辫子”，因此只有一个关注点存在。Complex，或如 Rich
    所说的 complicated，是指一个或多个关注点纠缠在一起，需要一起考虑，从而实质上打开了认知负担的大门。


    ## The Simplicity Continuum

    简洁性连续体


    简洁性表现为一个连续体，从过度简化开始，经过某个最佳简洁性点，然后进入过度复杂区域。


    ### Essential & Accidental Complexity

    必要复杂性与偶然复杂性


    一些问题天生就很复杂。无论是因为实际问题本身复杂且涉及众多因素，还是因为语言、框架或范式选择带来的限制，都将存在一个无法再进一步组织、简化或隐藏的点。我称之为**必要复杂性**的点。


    - **Essential Complexity** is the complexity inherent in the nature of the problem
    being solved and has to be accepted. This is quite different from its evil cousin,
    **accidental complexity**.

    - **必要复杂性**是被解决问题的本质所固有的复杂性，必须被接受。这与它的邪恶表亲**偶然复杂性**大不相同。

    - **Accidental Complexity** is everything we add to a given problem, that could
    be reduced if we gave the design more thought or if we valued simplicity higher.

    - **偶然复杂性**是我们添加到给定问题的所有内容，如果我们对设计多加思考或更重视简洁性，这些都可以被减少。


    ### Why do we introduce accidental complexity?

    我们为何引入偶然复杂性？


    关于我们作为开发者为何倾向于增加所构建解决方案的复杂性，有几种理论。有些关注开发者的自负，其他则关注工作保护的需求或只是不知道更好的做法。


    我最喜欢的引言归因于 Michael A. Jackson 的一项鲜为人知的研究，即我们倾向于为更简单的问题创建复杂解决方案，因为“我们对业务问题感到厌倦”。


    ## Microservice-based Architectures for Antifragility & Simplicity

    用于反脆弱性与简洁性的微服务架构


    *Thriving on Change - Peers & Pipelines - Lego*

    *在变化中茁壮成长 - 同行与管道 - 乐高*


    ![](img/6aa0b2c29d7992041f99024e15f60a20_77_0.png)


    如果一切都像这样就好了..


    随着简洁性和反脆弱性共同作用于我们的软件开发理念，如何实现这些理念的选项多种多样。其中一种因其良好原因而备受关注的架构风格是基于微服务的架构方法，因此本书将全面探讨这种方法。


    这并不是说微服务是生产简洁且反脆弱软件系统的唯一方式。微服务具有某些特性，使其理想地简洁，同时又足够灵活以应对我们可能选择优化的各种压力源的不同需求。同时，微服务鼓励一种精细的粒度，支持系统各部分相对独立地演进，真正提供了在站立会议中击败大象的机会。


    我认为微服务是一个过渡性术语，用于区分不优化简洁性和反脆弱性的软件架构与那些优化的架构，因此它是这些品质的有用标签，而非暗示这些品质只能通过这种架构方法实现。


    ## Embracing Change with Microservices

    以微服务拥抱变化


    那么微服务是什么？像我们这个疯狂行业中的许多术语一样，它是一个模糊的表述，容易被严重误解。我现在已经在通常被理解为基于微服务的软件系统上工作了大约 4 年，早在该术语进入常用词汇之前。


