    ## About The Author


    ### Russ Miles


    ![](img/6aa0b2c29d7992041f99024e15f60a20_12_0.png)


    > “An expert is someone who has succeeded in making decisions and judgements simpler;
    through knowing what to pay attention to and what to ignore” – Edward de Bono,
    “Simplicity”, 1998


    > “Complexity is the silent killer of delivering the right software, or change,
    at the right time; it is single-handedly responsible for killing many good ideas
    and companies. A focus on simplicity is the answer, but simplicity is not easy.
    Through our techniques and practices, I help software delivery organisations and
    teams ensure their solutions are as simple as possible while not missing the mark
    by over-simplifying.” – Russ Miles, 2013


    Russ Miles is CEO & Founder of Russ Miles & Associates⁴ where he works with his
    clients to help deliver simple and valuable software and change.


    Russ’ experience covers almost every facet of software delivery having worked
    across many different domains including Financial Services, Publishing, Defence,
    Insurance and Search.


    Russ helps to change all facets of the software delivery process in order to remove
    unnecessary and costly complexity in everything from developer skills and practices,
    through applying the right processes for the job at hand, to ensuring that the
    right change is delivered, be it through software or otherwise.


    ⁴ http://www.russmiles.com


    Passionate about open source software, Russ worked with SpringSource prior to
    the company’s acquisition by VMware, leading the Spring Extensions project and
    helping international clients to simplify their software by effectively applying
    the Spring portfolio of projects.


    Russ is also the Geek on a Harley⁵ and you can follow his travels online.


    ![](img/6aa0b2c29d7992041f99024e15f60a20_13_0.png)


    ## Acknowledgements


    I''d like to thank lots of people, I really would! The problem is that basically
    this was a singular work of a genius mind, constructed on a mountain-top without
    Internet access and after several decades of contemplative solitude... so who
    would I thank?


    Ok, maybe that solitude was not quite as lonely...


    First up a huge thanks to my fiancée and partner-in-crime, Siobhan Gadiot. You''re
    not only my colleague in all things, you''re also my muse.


    Thanks to my wonderful daughter Mali and son Ashton. I''m biased, I know, but
    you both really are wonderful*.


    To Mali & Ashton, I hope you never lose your love of books and your wonder with
    the world, and if you do then just remember how it felt because that''s an important
    feeling to take forth on your journey.


    ![](img/6aa0b2c29d7992041f99024e15f60a20_14_0.png)


    Russ and Mali Miles


    *...and cheeky, and naughty at times ... and going to cause me totally undue happiness
    and heartache I''m sure! but anyway...


    ## Introduction


    ![](img/6aa0b2c29d7992041f99024e15f60a20_15_0.png)


    Foyles Bookshop, my second favourite bookshop and home of many books that are
    not at all boring, but many in IT that are.


    > “We’ve spent over a decade now becoming more and more agile and adaptable in
    our ways of working. Unfortunately our software is now struggling to keep up with
    the pace of innovation that is increasingly being demanded by modern businesses.
    It’s time to sort that out.” - Russ Miles


    There are enough boring books out there on software development, enough probably
    to fill Foyles’ many times over.


    This is **not** one of those books.


    ## What this book is NOT about


    Rather than waxing lyrical on highfalutin thoughts, concepts and ideas in software
    development or getting tangled up in the exhausting and ultimately mostly meaningless
    discussions (see: wars) around languages and frameworks, this book is going to
    dive into the *practical tools I''ve found that really help with building software*
    and meeting the challenges of modern software development.


    That means the *following topics are rendered essentially meaningless and so have
    been completely steered clear of.*


    ## Brand X Process


    Processes are merely ways of organising work with the aim of trying to ensure
    that something valuable happens.


    This book will be avoiding discussions of the form “Scrum is better than Kanban
    because... <insert biased and inane argument here>” and instead concentrate on
    practical tools that you can use to tailor your own process.


    As a wise man once said, do what works for you. I aim to help you to figure out
    what works for you, not sell you on Brand X of anything in particular.


    ## Brand X methodologies


    Methodologies are colloquially used to mean processes in software development.
    Methodology is a misnomer typically used by people who wish to make something
    sound much more


    The problem with these individuals and organisations is they do not have ***skin
    in the game.*** They are ***offering unempirical advice and belief as if it was
    certainty with no direct threat from the action being taken on that advice.***
    This is dogma prevailing.


    ***When Dogma prevails, valuable outcomes are lost in the noise of opinion-driven
    accuracy to some authority.*** This has no place in this book.


    Here I shall be talking about exactly ***how I design systems, with real skin
    in the game every time I do.***


    ## Philosophical Underpinnings


    One means of avoiding dogma is to display your reasoning ready for it to be (hopefully)
    fruitfully critiqued and mined by your happy or unhappy readership. The other
    is to only promote those things that you have done yourself, thereby having real
    skin in the game. We''ll apply both here.


    Every book that aspires to push things truly forward has a set of philosophical
    underpinnings that inform the thought and ideas that it proposes and this book
    is no different, except that I''d like to make my philosophical underpinnings
    more explicit than most by listing them out here.


    ## Axioms


    > “An axiom is a premise or starting point of reasoning.” – Wikipedia


    Axioms are the undisputed claims upon which I can then build up everything else
    I put forward in the rest of this book.


    I could quite easily simply dump a collection of tools, practices and processes
    in this book on you, my understanding reader, without some sort of shared understanding
    underpinning the whole exercise. This is what many books do, but more often than
    not I’d then spend the rest of my career explaining the ideas underlying those
    techniques, and in fact many do spend a lucrative career doing so.


    My aim is a different one here and so, in order to get a few questions out of
    the way, here are my a priori axioms that I’d like you to consider as the basis
    for our thinking throughout the rest of the book:


    - Your software’s first role is to be useful

    - The best software is that which is not needed at all

    - Human comprehension is King

    - Mechanical Sympathy is Queen

    - Software is a process of research & development

    - Software Development is an extremely challenging Intellectual Pursuit


    ## Axiom 1: Software’s first role is to be useful


    > *The effect and outcome of software, its contribution to desirable value that
    was not present without the software, is the primary responsibility of good software.*


    While the process and crafting techniques used to create software are certainly
    important, software at a minimum must at least exhibit some usefulness to people
    as an outcome whether they be a business or an individual.


    ## Axiom 2: The best software is that which is not needed at all


    This axiom is more controversial, especially given the silo that the majority
    of contemporary software developers work within.


    *A software developer should be most primarily concerned with enabling valuable
    change rather than simply focused on shipping software.*


    If this axiom is accepted, valuable change becomes a maxim of a software developer’s
    thinking as they approach a problem domain where software might be applicable.


    If this broadness of options is recognised, software is one possible answer to
    the problem domain but should be placed in a context of other recognised options
    for meeting the challenges of the domain.


    As other axioms here state, developing software is a challenging intellectual
    pursuit and, even with the enabling factor of adaptability, can result in a complex
    solution where an alternate solution was possible.


    Simply stated, this axiom puts to you that software is one option but by no means
    the only option when enabling valuable change, which is in our opinion, ironically
    perhaps given the name, the role of the modern software developer.

