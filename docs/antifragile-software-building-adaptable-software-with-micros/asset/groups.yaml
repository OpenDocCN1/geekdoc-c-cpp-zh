    ## Preface


    ### Grabbing the Code


    In this book a very specific approach to providing code samples has been taken;
    one that makes it as easy as possible for you to try out the concepts being taught
    as well as give you lots of opportunities to dig deeper, take time to think, and
    challenge your understanding.


    So instead of providing a generic or plain unrealistic sample application, we’ve
    tried to use a test-driven approach that is best used as you read the book. Think
    of it as a ‘ready, try, think and learn’ approach. Each step we call a ‘Koan’,
    but more on that in the first time you experience the Koans in Book 1 in the chapter
    on Simplicity.


    The samples for this book are absolutely critical to your learning experience
    so please take the time to complete the following instructions to get the code
    set up on your own development machine.


    There are also several ways you can work through the code for this book.


    #### Option 1: Browse the code on GitHub


    First and foremost you can simply browse the code online at GitHub¹. There are
    a number of examples here that illustrate the lessons and journey in this book.


    Each of the code samples can be navigated by clicking on the appropriate GitHub
    repository for the part of the book you are currently studying.


    If you just want to browse the code then Option 1 is probably enough for you.
    If you want to actually work with the code locally while you read the book, but
    don’t want to go to the hassle of using the Git² tool itself, then Option 2 could
    be for you.


    #### Option 2: Download the Code as Zip Files


    If you want the code samples locally then the easiest way is to simply download
    the ones you want. If you navigate on GitHub³ you will then see a "Download ZIP"
    button.


    Click on that button and a Zip file of the complete source code for that Koan
    will be downloaded to your desktop and then you can unzip it to a place of your
    choosing to work from as you work through the Koans.

