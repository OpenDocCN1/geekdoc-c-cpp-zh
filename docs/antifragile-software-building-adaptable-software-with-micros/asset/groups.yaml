    [领域驱动设计：应对软件核心的复杂性] 和 [CQRS 和事件溯源]。不幸的是 Greg 仍在撰写他的书，但我们都希望它能尽快出版，因为从 Greg 的演讲和非常受欢迎的课程来看，这将是简化软件并提高适应性的至关重要材料。

