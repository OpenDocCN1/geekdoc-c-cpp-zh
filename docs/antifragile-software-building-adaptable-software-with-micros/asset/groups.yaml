  md: '

    ## *Architecture and the way we think about software.*


    ## Book I - The Philosophy of Change in Software


    The Elephant in the Standup -> Philosophy & Architecture -> Stressors & Antifragility
    - Simplicity Principles - Microservices - Natural Selection & Innovation - The
    Payback


    ## The Parable of The Elephant in the Standup


    *Fortuna - Change is Necessary - Common Lies in Software - The Enemy: The Elephant*


    It’s the 10th sprint of your project; *you’re feeling good.*


    You’re surrounded by smiling colleagues who are happy with the software they’ve
    built. Happy that they’re going to be building software of value. *Life is good.*


    It’s at those moments when we find that life is ready at all times to throw us
    a curve ball or, as Seneca would point out, *Fortuna* brings the Rudder as well
    as the Cornucopia.


    ![](img/6aa0b2c29d7992041f99024e15f60a20_34_0.png)


    The Cornucopia has been the experience of your team for the past sprints, with
    *success building on top of success* as you work your way through the product
    backlog. The Rudder symbolises the flip-side, when Fortuna *rips away your comfortable
    rug with one un-anticipatable twist of the wrist.*


    The rudder is when your product owner utters the one line you''ve been *dreading...*


    > "I''d just like one small change..."


    ### ...Guilt...


    You rapidly proceed to the next phase, which is dominated by the emotion of *guilt*.
    Why guilt? Because deep down you know that *the change being asked for in fact
    "should" be that small, but it''s not.*


    Time to meet the enemy...


    ### The Elephant in the Standup


    ![](img/6aa0b2c29d7992041f99024e15f60a20_37_0.png)


    *The Elephant in the standup is all assumptions and decisions that led to your
    code that is now in conflict with reality.*


    Carefully *designed and architected for what you knew yesterday*, the elephant
    is a silent participant in your meeting that is now woefully in conflict with
    the new change.


    And what do we do when we meet the Elephant...?


    ### Everybody Lies


    ![](img/6aa0b2c29d7992041f99024e15f60a20_38_0.png)


    The most popular three ‘lies’ are:


    > “It’s a Big Change, no honestly...”

    > “The Extended-Holiday of ‘Refactoring’” and

    > “Raising the question of ‘Technical Debt’...”


    ### Lie 2: The Extended-Holiday of ‘Refactoring’


    “Umm, we understand that you need that change but in order to accommodate it we’re
    really going to need to do some refactoring, maybe for a sprint or two.


    You’ve heard of the agile practice of refactoring right? Good.


    **We’re going to be doing refactoring for a minimum of a couple of days, but more
    likely a couple of sprints just so we’re ready for the change you’ve made us aware
    of.**


    What happens if you change your mind in the future? Well yes, we might then have
    to refactor again, but hopefully only for a couple of days.


    The other option, and I say this only as a suggestion, is to maybe make sure you
    know exactly what you want up front before we get into designing and coding, otherwise
    we might have to go round this again...”


    ### Lie 3: Sorry, you’re in Technical Debt...


    > *“I’m sorry, have you heard the term ‘Technical Debt’? Seems familiar? Well
    unfortunately that’s what you’ve accrued and, yes, it’s probably your fault for
    pushing us too hard to complete the work for the previous sprints.”*


    We’ve just *not had the time to properly consider all the ramifications* of what
    we’ve built because we were too busy trying to make you happy, and so now it’s
    time to *suck it up and pay back* some of that debt that you had no idea you were
    accruing.


    A simple payment of a couple of weeks/months of effort with *nothing new being
    delivered* should do the trick.


    No, we can’t be sure you won’t have some debt left and need to pay that back at
    an undisclosed point in the future...


    What’s that you say? It seems unfair? *Why are you crying...*


    ### Technical Debt is for real


    Technical debt is when you are *deliberately* cutting corners in design and your
    code to be faster today, aware that you will have to round those corners off in
    the future when there is more time.


    If there is ever more time...


    There is little doubt that *technical debt does accrue as designs deviate under
    the pressure of project and product delivery*, but this is not really what is
    happening with the Elephant.


    ### The Elephant in the Standup is not Technical Debt, nor Refactoring


    The Elephant is not a result of cutting corners in your design and code, knowingly
    or otherwise, it is the *inevitable result of a well-thought-out design for yesterday
    coming into contact with the reality of change today*.


    Now you’ve met the lies, it’s time to meet the real reason that you’re having
    to use them.


    *Why do we have the Elephant in the Standup? And how can we beat it?!*


    In order to beat the Elephant you’re going to *need to think differently* and
    that means examining *how software architecture and design is commonly thought
    about and how that needs to change*.


    ## Software Architecture is Philosophy


    *What is philosophy in this context - The illusion of perfection - The delusions
    of architects - (Re)introducing the unknown unknowns and how to deal with them*


    ### What is Software Architecture and Design?


    There are a lot of definitions of what software architecture and design actually
    is; almost as many definitions as there are for what a software architect or designer
    actually does.


    For this book I want to be a lot more concrete on what architecture is and how
    it affects the software you build, and so here are my working definitions:


    - Software Design is Thinking in Context

    - Software *Architecture* is Philosophy...


    Software design happens whenever you are thinking, conversing or sketching out
    a specific solution.


    Software architecture is a little more esoteric, and so needs a little more explaining...


    ### What is Philosophy?


    There’s nothing like using a broad and misunderstood term in order to explain
    another broad and misunderstood term, but that’s what “Software Architecture is
    Philosophy” can look like at first glance.


    My working definition of philosophy is:


    - The love of wisdom, technically as per the definition of the word. This is nice
    but hardly more helpful.

    - A set of *thinking tools, ideas, concepts, experience and biases* that you bring
    to bear on your solutions. *Much more helpful to our discussion here.*


    When initially considering a piece of software to construct, or a solution to
    build, or a system to bring to life¹⁰ you bring your own philosophy to bear on
    the situation. *You bring your own past, and sometimes painful, experiences and
    biases.*


    You bring your preference for the JVM, because it’s familiar. You bring the decisions
    that *"worked ok before"*, as well as the *pain of what didn’t for you*. You bring
    the *desire to use the "safe"* tools that you saw work before, plus the guilty
    desire to use new tools in order to make the project interesting to you.


    You bring your *friendship with vendors and other professionals* because you feel
    safe with them and would like to work with them on this. You bring your *beliefs,
    and occasionally evidence, that certain practices work well for organising*


    ### Software Architecture Abides


    ![](img/6aa0b2c29d7992041f99024e15f60a20_47_0.png)


    The philosophy of the modern software architect


    A wise man said "Software Architecture is the Big decisions", and promptly left
    the room for misinterpretation on exactly what those decisions are. My take is
    that that just doesn''t go far enough.


    For me, software architecture is the collation of the thoughts, ideas and biases
    of the individuals involved in decisions that have a huge impact on how the software
    evolves. It''s like setting the rules to a game, but with the danger that those
    rules are often informed by our own implicit biases. It''s those biases I''d like
    to take a look at here.


    The biases and perspectives that are collectively brought to bear on the ''big
    decisions'' are the philosophy of the individuals coming to those decisions. That
    may sound a little odd, but if you consider philosophy to be the collective ideas,
    fears, reasonings and perspectives of those people involved, then philosophy becomes
    a toolbox for making decisions (rationally or irrationally).


    Lots of people these days point the finger squarely at the problem

