    \ then supports taking those ideas that are most successful into full innovations\
    \ that provide real business value.\n\n## Skin in the Game\n\n*Approach to Implementation\
    \ - Antifragile Ethics -*  \n*Show & Share - Rules of Honesty and Being Critical*\n\
    \nI’m sitting on the benches outside the Pivotal^17 offices in London enjoying\
    \ the early morning sun before presenting a course. I’m pondering how to honestly\
    \ and authentically write a book on antifragile software. Specifically how do\
