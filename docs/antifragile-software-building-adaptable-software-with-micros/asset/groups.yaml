    implementations of the ubiquitous language and used to communicate between the
    levels of the design. All fine so far.


    All fine until ***they are used for the specific and orthogonal purposes of each
    layer.***


    The Repository layer attempts to turn the domain objects into storable entities,
    often using something like an Object-Relational Mapping system.


    The Services have their own pressures and want the domain objects to be amenable
    to those, but the Repository layer will often force a design compromise in order
    to effectively store the data in the objects with an entirely different relational
    schema in the database.


    Then top-level integration layers will then add their own pressures to the mix.


    I’ve seen domain objects shoe-horned into acting as Form Backing Objects (FBOs)
    for web layer forms as well as being used to represent payloads where they are
    marshalled to and from XML, JSON, PDFs ... you name it!


    Suddenly these poor ***domain objects are being used, and abused, by everything!***
    Rather than being the point of clarity and comprehension that the implementation
    of the ubiquitous language should be, the domain objects are a hideous franken-


    ## Not the ***Things***, the ***Things that happen***


    Time to turn back to the *wisdom of Gawain*.


    It turns out that when discussing a system with non-technical stakeholders there
    is often an ***entirely different emphasis to the dialogue.*** They don’t discuss
    the pieces, or things, involved in a given domain. Non-technical stakeholders
    often revert to talking about ***what has to happen.***


    > ***“This happens, then this happens, then this is the final result.”***


    Non-technical stakeholders aren’t talking about objects, or even components and
    services! They are talking about ***things that happen and their results.***


    They are talking about ***Events.***


    ## Past, Unchangeable Facts


    Events are **things that happen in the past**.


    **Events are named as Facts.**


    For example: User **Log-in Requested**, rather than **UserLoginRequest**.


    Events are Unchangeable, **Immutable**.


    Events have an **identity, often a time/date**, and possibly a sequence number.


    Events are the minimal set of information about a datum; **events are metadata**.


    There are events that are intended to change something, these are called **Commands**.
    There are events that ask a question, these are called **Queries**.


    ![](img/6aa0b2c29d7992041f99024e15f60a20_115_0.png)


    **Events are the foundational building blocks of comprehension of a system and
    of microservices-based architectures.**


    ## Event Streams


    I am now watching the great British summer really unfold; in other words, *it''s
    raining again.*


    As I cover up my motorbike I glance down at the puddles and small streams forming
    in the pathways to our house and another philosopher comes to mind, Thales.


    Thales believed that *water was the first principle*⁎. All things were changing


    When things happen they are passing as well as unchangeable.

    *Events need a communication medium.*


    *That medium is streams that are ordered sequences of events*, and they are just
    as important as the events themselves.


    ![](img/6aa0b2c29d7992041f99024e15f60a20_117_0.png)


    As a child³⁵ there was nothing I loved more than taking control of the forces
    of nature while on a beach. I would happily dig rivulets and streams around medieval
    castles in the sand, watching the reversing tide water run back towards the receding
    sea.


    Across those streams I would create moats, meanders, anything I wanted. I could
    do anything with the right streams.


    Once I have some events I can *create streams that start to give me the real power*
    I''m looking for.


    An Aggregate is some **_current picture based on the events observed_** in one
    or more streams.


    Often an aggregate is the result of some **_processing, or projection, applied
    to an event stream._**


    An aggregate is **_optimised for update_**; it must consume the events in the
    streams it is interested in as quickly as possible to ensure it is as up-to-date
    as possible.


    However an aggregate is an intermediate step. **_It still doesn''t give me an
    answer._**


    **_An aggregate often simply produces another stream of more refined events!_**


    **_Microservices can be aggregates and projections,_** especially if you need
    those aggregates and projections to evolve at their own pace.


    That''s all well and good, but when am I going to be able to get a useful answer
    out of this flow of events?


    If you have a popular view chances are you will scale it out and, since its *state
    is simply a sum of the events it has seen similar to an aggregate*, you can *spin
    up a new view instance to handle load by playing in those events*.


    *If you need new answers to your questions, you''ll simply create a new view.*


    *Views are microservices if they need to evolve,* come-and-go at their own rates
    as new functionality is tested and accepted within the system.


    ## Lambdas!?


    The Lambda Architecture appeared in the excellent [“Big Data: Principles and best
    practices of scalable realtime data systems”](http://www.amazon.co.uk/Big-Data-Principles-practices-scalable/dp/1617290343)
    by Nathan Marz and James Warren. It’s main aim is to provide an architecture to
    support both streams and batch data processing applications, but that’s not where
    its impact necessarily needs to stop!


    ![](img/6aa0b2c29d7992041f99024e15f60a20_125_0.png)


    Two main areas are identified, a Batch or Slow-data area with pre-computed views
    that are then used to produce a Servicing Layer with actual views for querying,
    and a Speed or Fast-Data area that provides direct flows to Views.


    When we overlay this architecture with the patterns in this chapter, we can start
    to see that there’s a lot of commonality between the two.


