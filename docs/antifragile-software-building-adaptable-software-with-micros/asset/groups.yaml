    # Phone, Or Have a Drink with, A Friend


    ![](img/6aa0b2c29d7992041f99024e15f60a20_102_0.png)


    The waning sun tries valiantly to break through the trees of Clapham Common while
    being fought off by the “British Summer” weather and the fact that it is 9pm and
    the horizon is trying to stake its claim to it being night now.


    In the garden of the Windmill pub, keeping a careful eye on my motorbike, I sit
    with an old friend, Gawain, sharing my idea and, more importantly, my worries.


    *I just don’t know where to start.* How do you get going when you don’t know what
    to build?


    One of the reasons I meet up with Gawain is that, frankly, the man is hilarious.
    Things happen in Gawain-land that don’t really happen to anyone else I know, such
    as being gamely hunted by wild dogs while in India, and so meeting up with Gawain
    is usually a great way to shirk off any worries of the day and just listen to
    him reminisce on some event or other that will leave you baffled, possibly shocked
    and, at a minimum, laughing.


    The man is also, frankly, a technical genius. He’s humble enough not to know that
    too, which helps! Which is why I’m confessing to not knowing where to start.


    Gawain’s answer is perfect. He recommends I **start with what I do know**, the
    language of the problem domain and then **explore what I’d like to possibly know
    about that domain.**


    He recommends I start with the *Events*.'
  md: "\nare most challenged by the shape of that success. Depending on how you've\
    \ designed the incoming and outgoing connections from those services, you may\
    \ still find that the scaling can be a challenge.\n\nCurrently the majority of\
    \ microservice-based architectures use a simple selection approach to the links\
    \ between services. The first-line choice is often to use HTTP, possibly RESTful\
    \ and possibly asynchronous, as HTTP is a wonderful protocol for supporting many\
    \ of the stressors that can be applied to those links. Second-line choice is usually\
    \ some sort of messaging approach with a broker involved. Third-line, usually\
    \ reserved for low-latency options, is to use something more bespoke that might\
    \ require more effort to achieve the level of de-coupling between microservices\
    \ to support the stressors being applied.\n\nEmbracing change and its stressors\
    \ is an excellent starting point, and is the aim of designing your system using\
    \ microservices. Finally we have an architectural approach that looks to embrace\
    \ change on its own terms.\n\nYou can go even further. You could design the links\
    \ between services such that you can embrace change and for the majority of microservice-based\
    \ systems that is good enough. It's certainly a lot better than where we were.\
    \ However if you go beyond that you can end up with a system that not only embraces\
    \ change but in fact thrives on those stressors. A system that doesn't just adjust\
    \ but *improves* based on the stressors it encounters. This is where microservices\
    \ provide the foundation of *antifragile* software systems.\n\nWhere this is achieved,\
    \ a system provides a fertile landscape for innovation just not possible with\
    \ a monolith. New languages\n\nLaurie Miles was a recognised expert at running\
    \ successful businesses. He was also a car salesman, but don’t hold that against\
    \ him!\n\nOne of the keys to Laurie’s success was that he could, time and again,\
    \ get the best out of people. He could take individuals that were, at best, performing\
    \ ok or, at worst, grossly under performing and give them a platform to make a\
    \ positive impact to the business.\n\nWhen asked how Laurie did this, the answer\
    \ was straightforward: by enabling innovation through an environment that was\
    \ open to it. Laurie knew that ideas and innovation wouldn’t come from any special\
    \ ‘innovation group’, even less so the actual Directors of the company.\n\nLaurie\
    \ knew that the best innovations, the ones that would have great impacts to the\
    \ business, came from harnessing the creativity of the individuals in the business.\
    \ By removing blocks to that creativity and giving just enough guidance so that\
    \ they could experiment in safety with their potential innovations.\n\nAnd as\
    \ you can see below, Laurie Miles enjoyed a high degree of success with this simple\
    \ approach.\n\n![](img/6aa0b2c29d7992041f99024e15f60a20_86_0.png)\n\nSuccess is\
    \ a good hot tub\n\nThe question is: How does a business enable innovation so\
    \ that it can join the ‘hot-tub’ elite in success? This book isn’t a book on how\
    \ to foster creativity in your people, but it is a book that intends to enable\
    \ software that can embrace change and stressors that are important to your systems,\
    \ and so it is natural to consider the stressors that occur when innovation is\
    \ valued and how we can thrive on them.\n\n## Technical Innovation Stressors\n\
    \n*Technology on its own cannot spark innovation, but it can be a force that supports\
    \ or resists it.*\n\nAs it happens, innovation is adversely affected by technology\
    \ for many of the same reasons that change itself can be resisted. When attempting\
