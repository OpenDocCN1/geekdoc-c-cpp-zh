  mdcn: "\n最让你感到棘手的是成功的形态。取决于你如何设计这些服务的入站和出站连接，你仍然可能会发现扩展是一项挑战。\n\n目前，大多数基于微服务的架构在服务之间的连接上采用简单的选择方法。首选通常是使用\
    \ HTTP，可能是 RESTful，也可能是异步的，因为 HTTP 是一种极好的协议，可以支撑施加在这些连接上的许多压力因素。次选通常是某种涉及消息代理的消息传递方法。第三选择通常为低延迟场景而保留，即使用更定制化的方案，这可能需要付出更多努力才能在微服务之间实现足够的解耦，以支撑所施加的压力因素。\n\
    \n拥抱变化及其压力因素是一个极好的起点，也是使用微服务设计系统的目标。终于，我们拥有了一种以自己的方式拥抱变化的架构方法。\n\n你甚至可以更进一步。你可以设计服务之间的连接，使其能够拥抱变化；对大多数基于微服务的系统来说，这就已经足够好了。这肯定比我们过去的情况要好得多。然而，如果你超越这一步，最终会得到一个不仅能拥抱变化，而且实际上能因这些压力因素而蓬勃发展的系统。这样的系统不只是调整，而是会根据所遭遇的压力因素*改进*。这就是微服务为*反脆弱*软件系统奠定基础的地方。\n\
    \n一旦实现这一点，系统就为创新提供了丰饶的土壤，这是单体架构不可能实现的。新的语言\n\nLaurie Miles 是经营成功企业的公认专家。他也是一名汽车销售员，但你可别因此对他有偏见！\n\
    \nLaurie 成功的关键之一在于，他能一次又一次地激发出人们最好的一面。他可以把那些表现充其量还算可以、最坏情况下严重欠佳的个体，给他们一个平台，让他们对业务产生积极影响。\n\
    \n当被问及 Laurie 是如何做到这一点时，答案很简单：通过营造一个对创新开放的环境来促成创新。Laurie 知道，想法和创新不会来自任何特殊的“创新小组”，更不会来自公司真正的董事们。\n\
    \nLaurie 知道，最优秀的创新——那些会对业务产生重大影响的创新——来自于发挥企业中每个人的创造力。方法是清除创造力所面临的障碍，并给予恰到好处的引导，让他们能在安全的环境中试验自己潜在的创新。\n\
    \n正如你在下面看到的，Laurie Miles 用这种简单的方法取得了巨大成功。\n\n![](img/6aa0b2c29d7992041f99024e15f60a20_86_0.png)\n\
    \n成功就是一个好热水浴缸\n\n问题是：一家企业如何实现创新，从而加入成功的“热水浴缸”精英行列？这本书并不是一本关于如何培养员工创造力的书，而是一本旨在使软件能够拥抱变化以及那些对你的系统至关重要的压力因素的书；因此，我们自然会思考当创新受到重视时会出现哪些压力因素，以及我们如何在这些压力因素下茁壮成长。\n\
    \n## 技术创新的压力因素\n\n*技术本身无法点燃创新，但它可以成为支持或抵制创新的力量。*\n\n事实上，创新之所以会受到技术的不利影响，其原因与变革本身可能被抵制的许多原因相同。当你尝试创新时，你希望技术能鼓励你的想法和尝试，然后支持将这些最成功的想法转化为完整的、能提供真正商业价值的创新。\n\
    \n## 利益攸关\n\n*实现方法 - 反脆弱伦理 -*  \n*展示与分享 - 诚实与批判的规则*\n\n我坐在伦敦 Pivotal^17 办公室外的长椅上，在授课前享受清晨的阳光。我正思考如何诚实而真实地写一本关于反脆弱软件的书。具体来说，我该如何向本书的读者分享我对这些系统不同特征和模式的知识，而不至于听起来像个*高高在上、象牙塔里的架构师骗子*。\n\
    \n这不仅仅是作者在学术上的自我怀疑，这是一个严肃的问题！我正在写一本以反脆弱为核心主题的书，而纳西姆·尼古拉斯·塔勒布在《反脆弱》^18 一书的伦理随笔中反复强调的一点是，我必须时刻避免成为一个骗子。\n\
    \n我不应只是谈论它，而应*活出它，说到做到*。最重要的是，我应该有*利益攸关*。\n\n***那我到底该怎么做？***\n\n^17 https://pivotal.io\n\
    \n^18 http://www.amazon.co.uk/Antifragile-Things-that-Gain-Disorder/dp/0141038225\n\
    \n**任何我自己没有亲身承担过风险的事情。** 我不希望别人去尝试那些我以权威口吻陈述、但自己并没有真正执行或应用过的想法，然后用他们的**经验和固有的脆弱性来支撑我自己的想法。**\n\
    \n**当我推荐某样东西时，它是真实的，你可以看到它，而且我已经把我自己的项目和职业声誉押在了上面。**\n\n这就是为什么我在本书关于反脆弱软件的架构、设计和实现部分，采取了一种可能不同于你通常预期的方式。我将分享**在和你一起构建一个真实世界商业项目过程中的成功、痛苦和顿悟。**\n\
    \n**在你考虑把自己押上之前，我会先真正去做，以我自己的利益攸关来实践这一切。**\n\n## 关于批判\n\n> “除非你是在冒险，否则永远不要抱怨。”——塔勒布，Facebook²⁰\n\
    \n诚实要求我分享那些有助于这个系统开发的模式、设计和工具。然而，这*并不仅限于那些有帮助的*。我可能会批评那些与反脆弱软件系统目标相冲突的工具、技术和模式，而且我会*冒险在这里公开这些批评。*\n\
    \n正如纳西姆·尼古拉斯·塔勒布也指出的那样：“*如果你看到欺诈却不说出欺诈，那你就是欺诈*”。通过诚实地阐述我如何构建一个真实世界、反脆弱的商业软件产品，并在整个过程中一路分享我的所有丑事，我的目标是让你，亲爱的读者，获得更好的学习旅程，也让我自己忠于反脆弱伦理，保持*利益攸关*。\n\
    \n现在，是时候*开始这段旅程了*。\n\n## 不确定镇中的恐惧、憎恶与*承诺*\n\n> “只要一直游下去，只要一直游下去……”——多莉，《海底总动员》\n\
    \n我不知道自己在做什么。\n\n这个想法一直困扰着我。\n\n*我真的不知道自己在做什么！*\n\n这不是游戏。我不是在某个沙盒里随便玩玩代码；我要做一个项目，而且它将会公开出去，而我完全没有计划！\n\
    \n这是一种非常真实、发自内心、可触可感的*恐慌*。\n\n## 给朋友打电话，或者和朋友喝一杯\n\n![](img/6aa0b2c29d7992041f99024e15f60a20_102_0.png)\n\
    \n夕阳奋力想要穿透克拉珀姆公地的树林，却遭到“英伦夏日”天气的阻挠，而且现在已是晚上九点，地平线正试图宣告夜晚已经降临。\n\n在风车酒吧的花园里，我一边小心照看着我的摩托车，一边和一位老朋友高文坐在一起，分享我的想法，更重要的是，分享我的担忧。\n\
    \n*我只是不知道从哪里开始。* 当你不知道该构建什么时，你该怎么开始？\n\n我之所以与高文见面，其中一个原因是，坦率地说，这家伙很搞笑。高文的世界里会发生一些我认识的其他人都不会遇到的事，比如在印度被野狗奋力追捕。因此，和高文见面通常是一种甩掉当天烦恼的好方法：只需听他回忆某件往事，这些往事会让你困惑、可能震惊，至少也会让你发笑。\n\
    \n坦率地说，这个人也是个技术天才。他谦逊到甚至不知道自己是个天才，这一点也很有帮助！所以我才向他坦承，我不知道该从哪里开始。\n\n高文的回答堪称完美。他建议我**从我所知道的地方入手**，即问题领域的语言，然后**去探索我可能想知道的关于该领域的内容。**\n\
    \n他建议我从*事件*开始。\n\n"
