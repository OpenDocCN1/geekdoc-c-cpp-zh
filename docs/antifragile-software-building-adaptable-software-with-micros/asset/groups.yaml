    ## Reducing the fear of Big Decisions


    Time is ticking away and I''m aware that I''ve written very little software, and
    even less prose for this book.


    Here are some of the options I''m considering:


    - Should I use Java?

    - Should I use Go Lang (I have a sweet spot for this little language and ecosystem)?

    - Should I use Docker?

    - Should I use Cloud Foundry?

    - What about Heroku?

    - What about Frameworks?

    - Am I accidentally endorsing a product?

    - What about .... AAAAAAARGH!


    All of these questions are valid, but I''m forgetting something. One of the benefits
    of microservices in the service of antifragile system construction is supposed
    to be adaptability; adaptability in the face change.


    Including a change of mind on technologies.


    Martin Fowler famously and pithily stated that architecture was about the *Big
    Decisions*, but in the case of microservices and antifragility we''re trying to
    make those decisions smaller and all up-side.


    Microservices can, in themselves, often be re-written in a very short amount of
    time²⁹. The reduction of big decisions into smaller, frequent decisions is a key
    factor in the adaptability, and therefore potential antifragility, of the microservice-based
    approach.


    In addition, microservice-based systems are polyglot by definition with each microservice
    loosely coupled with its collaborators and running and evolving in its own space.
    So questions of which technology that would have deserved the moniker of being
    *the big decisions* shouldn''t be any more. They are scoped to the specific service.


    ### A Tale of Three Teams


    There’s very little real scientific experimentation these days in software development.


    In the main we tend to look to other industries for inspiration and then, dangerously,
    copy those superficially-appropriate techniques that appeal to our own individual
