    # Reducing the fear of Big Decisions


    Time is ticking away and I''m aware that I''ve written very little software, and
    even less prose for this book.


    Here are some of the options I''m considering:


    +   - Should I use Java?

    +   - Should I use Go Lang (I have a sweet spot for this little language and ecosystem)?

    +   - Should I use Docker?

    +   - Should I use Cloud Foundry?

    +   - What about Heroku?

    +   - What about Frameworks?

    +   - Am I accidentally endorsing a product?

    +   - What about .... AAAAAAARGH!


    All of these questions are valid, but I''m forgetting something. One of the benefits
    of microservices in the service of antifragile system construction is supposed
    to be adaptability; adaptability in the face change.


    Including a change of mind on technologies.'
