    # An array of strings in C can be declared as a ________.


    Option 1: matrix


    Option 2: grid


    Option 3: 2D array


    Option 4: stack


    Correct Response: 3.0


    Explanation: An array of strings in C can be declared as a 2D array. Each row
    of the 2D array represents a string, and you can have multiple strings stored
    within the same data structure.


    --------------------


    # The function ________ can be unsafe to use as it does not check for buffer overflow
    while reading a string in C.


    Option 1: gets


    Option 2: scanf


    Option 3: fgets


    Option 4: getchar


    Correct Response: 3.0


    Explanation: The correct answer is fgets. gets is unsafe due to buffer overflow
    issues, scanf can be problematic when not used carefully, and getchar is used
    for character input, not strings. fgets is a safer choice for reading strings.


    --------------------


    # To split a string into tokens in C, the function ________ is used.


    Option 1: split


    Option 2: strtok


    Option 3: substring


    Option 4: splitstr


    Correct Response: 2.0


    Explanation: The correct answer is strtok. strtok is a standard C function used
    to split a string into tokens. The other options are not valid C functions for
    this purpose.


    --------------------


    # The function ________ is used to find the first occurrence of a character in
    a string in C.


    Option 1: findchar


    Option 2: locatechar


    Option 3: strchr


    Option 4: searchchar


    Correct Response: 3.0


    Explanation: The correct answer is strchr. strchr is a standard C function used
    to find the first occurrence of a character in a string. The other options are
    not valid C functions for this purpose.


    --------------------


    # Question 1: You''re developing a text editor and need to implement a search
    feature. Which function could be useful to check if a certain word exists in a
    text?


    Option 1: strstr


    Option 2: strrev


    Option 3: strlen


    Option 4: strcat


    Correct Response: 1.0


    Explanation: In this scenario, the strstr function is appropriate for searching
    for a specific word within a text. It returns a pointer to the first occurrence
    of the specified word in the text, allowing you to check if it exists. strrev
    reverses a string, strlen provides the length of a string, and strcat concatenates
    strings.


