    to read from the file.


    # In C, the ________ function is used to write a string to a file.


    - Option 1: `write()`

    - Option 2: `fputstring()`

    - Option 3: `fwrite()`

    - Option 4: `fputs()`


    Correct Response: 4.0


    Explanation: The correct option is `fputs()`. This function is used to write a
    string to a file in C, providing a convenient way to output a sequence of characters
    to the specified file.


    # You are tasked with developing a program that logs error messages to a file.
    Which file handling functions would be most appropriate to use?


    - Option 1: `fopen()` and `fprintf()`

    - Option 2: `fread()` and `fwrite()`

    - Option 3: `fclose()` and `fseek()`

    - Option 4: `fgets()` and `fputs()`


    Correct Response: 1.0


    Explanation: To log error messages to a file in C, you would typically use `fopen()`
    to open the file in write mode and `fprintf()` to write the error messages to
    the file. The other options involve reading or manipulating data, not writing
    to a file.


    # In a program that processes large datasets, you notice that reading the data
    from a file is a performance bottleneck. Which file handling functions could help
    improve the performance?


    - Option 1: `fread()` and `fwrite()`

    - Option 2: `fseek()` and `ftell()`

    - Option 3: `fprintf()` and `fscanf()`

    - Option 4: `fgetc()` and `fputc()`


    Correct Response: 1.0


    Explanation: To improve performance when dealing with large datasets, using `fread()`
    and `fwrite()` for bulk reading and writing of data would be beneficial. The other
    options involve more granular or formatted I/O operations.


    # You''re developing a program that needs to frequently update specific records
    in a large binary file. Which file handling functions would be most useful to
    efficiently locate and update records?


    - Option 1: `fseek()` and `fwrite()`

    - Option 2: `fread()` and `ftell()`

    - Option 3: `fprintf()` and `fscanf()`

    - Option 4: `fgetc()` and `fputc()`


    Correct Response: 1.0


    Explanation: To efficiently locate and update records in a binary file, you would
    use `fseek()` to move to the desired position and `fwrite()` to write the updated
    data. The other options are not suitable for this specific task.

