    选项 2: 数组具有固定大小，而指针可以动态调整大小

    选项 3: 数组始终从索引 0 开始，但指针可以从任何索引开始

    选项 4: 数组可以解引用，但指针不能


    正确答案：2.0


    解释：`Arrays` 一旦声明就具有固定大小，而 `pointers` 可以动态调整大小以指向不同的内存位置。这种灵活性使得 `pointers` 在动态数据结构中更加通用。


