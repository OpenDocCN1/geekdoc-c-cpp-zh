    # Question 1: What is a key characteristic of a union in C?


    - Option 1: Allows multiple data types in a single memory location

    - Option 2: Automatically allocates memory on the stack

    - Option 3: Provides dynamic memory allocation

    - Option 4: Only works with integers


    Correct Response: 1.0


    Explanation: A `union` in `C` allows you to store different data types in a single
    memory location, and it''s a crucial feature for creating composite data types.


    # Question 2: In C programming, why would you use an enumeration (enum)?


    - Option 1: To define a set of named integer constants

    - Option 2: To perform arithmetic operations

    - Option 3: To store floating-point numbers

    - Option 4: To create multi-dimensional arrays


    Correct Response: 1.0


    Explanation: Enumerations (`enums`) in `C` are used to define a set of named integer
    constants, making your code more readable and self-explanatory.


    # Question 3: What happens to the memory allocation when you define variables
    inside a union?


    - Option 1: Variables are allocated separate memory locations

    - Option 2: Variables share the same memory location

    - Option 3: Variables are automatically allocated on the heap

    - Option 4: Variables are stored in a separate file


    Correct Response: 2.0


    Explanation: Variables defined inside a `union` share the same memory location,
    so only one variable''s value is stored at any given time. Changing the value
    of one variable affects others in the `union`.


    # How is the size of a union determined in C?


    - Option 1: By the sum of the sizes of its members

    - Option 2: By the size of its largest member

    - Option 3: By the size of its smallest member

    - Option 4: By the number of members


    Correct Response: 2.0


    Explanation: In `C`, the size of a `union` is determined by the size of its largest
    member. If you have a `union` with multiple members, the size will be at least
    as large as the largest member''s size.


    # What is the default starting value of an enumeration in C?


    - Option 1: 0

    - Option 2: 1

    - Option 3: The value of the first enumeration constant

    - Option 4: Unspecified


    Correct Response: 1.0


    Explanation: In `C`, if no initial value is provided for the first enumeration
    constant, it starts with `0`. Subsequent constants increment by `1`.


    # What would be an appropriate use case for a union in C?


    - Option 1: Storing multiple values of different types simultaneously

    - Option 2: Defining a new data type

    - Option 3: Implementing complex data structures

    - Option 4: Ensuring data integrity


    Correct Response: 1.0


    Explanation: `Unions` are often used when you need to store multiple values of
    different types in the same memory location. Only one of the `union`''s members
    can hold a value at a given time.


    # What is the behavior of a union when different data types of different sizes
    are used?


    - Option 1: It results in a compilation error

    - Option 2: The union will have the size of the largest data type

    - Option 3: The union will have the size of the smallest data type

    - Option 4: It leads to a runtime error


    Correct Response: 2.0


    Explanation: In `C`, when different data types of different sizes are used in
    a `union`, the `union` will have the size of the largest data type. This allows
    you to store data of different types in the same memory location.


    # How can you specify the starting value of an enumeration in C?


    - Option 1: Using the `#define` directive

    - Option 2: By initializing the first element of the enumeration with a value

    - Option 3: It''s not possible to specify the starting value

    - Option 4: By using the `sizeof` operator


    Correct Response: 2.0


    Explanation: In `C`, you can specify the starting value of an enumeration by initializing
    the first element with a value. This value will be the starting point, and subsequent
    elements will increment from there.


    # Why might you choose to use an enumeration instead of a series of #define statements
    for constants?


    - Option 1: Enumerations are more memory-efficient

    - Option 2: Enumerations provide type checking

    - Option 3: #define statements are faster to evaluate

    - Option 4: Enumerations cannot be used for constants


    Correct Response: 2.0


    Explanation: You might choose to use an enumeration instead of a series of `#define`
    statements for constants because enumerations provide type checking, making your
    code more robust and error-prone. `#define` statements are simple text replacements
    and do not offer type safety.


    # In a union, all members share the same ________.


    - Option 1: Name

    - Option 2: Value

    - Option 3: Memory Address

    - Option 4: Data Type


    Correct Response: 3.0


    Explanation: In a `union`, all members share the same memory location. `Unions`
    allow different variables to occupy the same memory space, providing efficient
    storage.


    # An enumeration is a user-defined data type that consists of integral ________.


    - Option 1: Functions

    - Option 2: Values

    - Option 3: Pointers

    - Option 4: Characters


    Correct Response: 2.0


    Explanation: An enumeration is a user-defined data type that consists of integral
    values, typically used for defining a set of named integer constants.


    # A ________ allows multiple variables to share the same memory location.


    - Option 1: Pointer

    - Option 2: Structure

    - Option 3: Function

    - Option 4: Union


    Correct Response: 4.0


    Explanation: A `union` allows multiple variables to share the same memory location,
    making it useful for scenarios where different types of data need to occupy the
    same space.


    # Using a union can lead to efficient memory usage when you need to store different
    ________ at times.


    - Option 1: data types

    - Option 2: values

    - Option 3: structures

    - Option 4: members


    Correct Response: 1.0


    Explanation: Explanation: When you use a `union`, you can store different data
    types in the same memory location, depending on the specific member you access.
    This can help save memory when you need to handle various types of data.


    # Enumerations provide a way to assign ________ to a set of named constants.


    - Option 1: values

    - Option 2: data

    - Option 3: functions

    - Option 4: objects


    Correct Response: 1.0


    Explanation: Explanation: Enumerations allow you to assign integer values to a
    set of named constants, making your code more readable and maintainable by giving
    meaningful names to values.


    # When you define a union, the compiler allocates memory based on the ________
    member of the union.


    - Option 1: smallest

    - Option 2: largest

    - Option 3: first

    - Option 4: last


    Correct Response: 2.0


    Explanation: Explanation: The compiler allocates memory based on the largest member
    of the `union` to ensure that it can accommodate the largest data type within
    the `union`, which is known as the "largest member rule."


    # Question 1: You are developing an application that needs to represent a value
    that could either an integer or a floating-point number. How could you efficiently
    represent this data using C?


    - Option 1: Using a union

    - Option 2: Using an array

    - Option 3: Using a structure

    - Option 4: Using a linked list


    Correct Response: 1.0


    Explanation: In `C`, a `union` allows you to efficiently represent data that can
    be either an integer or a floating-point number, as it allows sharing the same
    memory location for different data types. Arrays, structures, and linked lists
    are not suitable for this purpose.

