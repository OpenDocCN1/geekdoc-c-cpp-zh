    选项 2：`display()`

    选项 3：`write()`

    选项 4：`printf()`


    正确答案：4.0


    解释：在 C 语言中，`printf()` 函数用于在控制台上显示输出。


    # ''continue'' 语句在循环中的作用是什么？


    选项 1：它终止循环。

    选项 2：它跳过当前迭代并继续下一次迭代。

    选项 3：它从头开始重新循环。

    选项 4：它会退出程序。


    正确答案：2.0


    解释：`continue` 语句用于循环中跳过当前迭代并移动到下次迭代。它不会终止循环，而是帮助跳过某些迭代。


    # ''while'' 和 ''do-while'' 循环在执行方面有什么区别？


    选项 1：`while` 循环至少执行一次其代码块，而 `do-while` 循环可能完全不执行。

    选项 2：`do-while` 循环在大多数编程语言中不是有效的循环结构。

    选项 3：`while` 循环执行代码块的顺序与 `do-while` 循环相反。

    选项 4：`do-while` 循环只能用于对数组进行迭代。


    正确答案：1.0


    解释：`while` 循环和 `do-while` 循环都用于代码块的重复执行，但它们的区别在于检查条件的时机。在 `while` 循环中，在执行循环体之前检查条件。如果初始初始为假，循环体可能完全不执行。在
    `do-while` 循环中，在检查条件之前至少执行一次循环体。这保证了即使条件为假，代码块也会至少执行一次。


    # ''return'' 语句如何影响循环内部的控制流？


    选项 1：在循环内部使用 `return` 语句会终止整个程序。

    选项 2：`return` 语句对循环内部的控制流没有影响。

    选项 3：`return` 语句退出循环，并将控制权返回给调用函数或方法。

    选项 4：`return` 语句跳过循环的下一次迭代。


    正确答案：3.0


    解释：`return` 语句用于提前退出函数或方法并返回。当循环内部遇到 `return` 语句时，它会立即退出循环并将控制权返回给调用函数或方法。这在某些条件下结束循环或从循环返回返回值时非常有用。


