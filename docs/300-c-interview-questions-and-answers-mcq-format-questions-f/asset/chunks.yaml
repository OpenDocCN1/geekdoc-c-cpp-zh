    # Q3: You need to create a program that dynamically allocates memory for an array
    and allows the user to specify the size of the array at runtime. What concept
    in C would be crucial to achieve this?


    Option 1: Pointers

    Option 2: Structures

    Option 3: Arrays

    Option 4: Functions


    Correct Response: 1.0


    Explanation: The concept crucial to dynamically allocate memory for an array and
    allow the user to specify the size at runtime is "Pointers." `Pointers` are used
    to manage memory dynamically in `C`. `Structures`, `Arrays`, and `Functions` are
    not directly related to this task.


    --------------------


    # What is the primary function of pointers in C?


    Option 1: To store variables

    Option 2: To manipulate strings

    Option 3: To provide dynamic memory allocation

    Option 4: To perform mathematical operations


    Correct Response: 3.0


    Explanation: `Pointers` in `C` are primarily used for dynamic memory allocation.
    They allow you to allocate and deallocate memory at runtime, which is essential
    for efficient memory usage and data structure implementation.


    --------------------


    # What is the difference between an array and a pointer in the context of C programming?


    Option 1: Arrays can store multiple data types, while pointers can''t

    Option 2: Arrays have a fixed size, while pointers can be resized dynamically

    Option 3: Arrays always start at index 0, but pointers can start at any index

    Option 4: Arrays can be dereferenced, but pointers cannot


    Correct Response: 2.0


    Explanation: `Arrays` have a fixed size once declared, whereas `pointers` can
    be resized dynamically to point to different memory locations. This flexibility
    makes `pointers` more versatile for dynamic data structures.


    --------------------


    # When declaring a string literal in C, which character is automatically appended
    at the end?


    Option 1: Null terminator ''\0''

    Option 2: Exclamation mark ''!''

    Option 3: Question mark ''?''

    Option 4: Semicolon '';''


    Correct Response: 1.0


    Explanation: In `C`, a null terminator `''\0''` is automatically appended at the
    end of a string literal. This null character indicates the end of the string,
    allowing `C` functions to determine the string''s length.


    --------------------


    # 1. Whatat happens if you try to modify a character in a string literal?


    Option 1: It is allowed and won''t cause any issues

    Option 2: It raises a compile-time error

    Option 3: It raises a run-time error

    Option 4: It converts the string to uppercase


    Correct Response: 2.0


    Explanation: Modifying a character in a string literal is not allowed because
    string literals are stored in read-only memory, and attempting to modify them
    will result in a compile-time error.


    --------------------


    # 2. How do you declare a pointer to an integer in C?


    Option 1: int* ptr;

    Option 2: pointer(int) p;

    Option 3: int ptr;

    Option 4: int_pointer ptr;


    Correct Response: 1.0


    Explanation: To declare a pointer to an integer in `C`, you use the format `int*
    ptr;`. This declares a pointer variable named `ptr` that can store the address
    of an integer.


    --------------------


    # 3. What is the significance of using pointers in function arguments?


    Option 1: It simplifies function declarations

    Option 2: It reduces code readability

    Option 3: It allows passing arguments by reference

    Option 4: It enforces strong typing


    Correct Response: 3.0


    Explanation: Using `pointers` in function arguments allows passing arguments by
    reference, meaning the function can modify the original data, not just a copy.
    This is valuable when you want a function to modify variables from the caller''s
    scope.


    --------------------


    # In C, what is the difference in memory allocation between character arrays and
    string literals?


    Option 1: Character arrays are stored in read-write memory, while string literals
    are stored in read-only memory.

    Option 2: String literals are stored in read-write memory, while character arrays
    are stored in read-only memory.

    Option 3: Character arrays are automatically null-terminated, while string literals
    are not.

    Option 4: Character arrays cannot be used as function arguments, while string
    literals can.


    Correct Response: 1.0


    Explanation: `Character arrays` in `C` are typically stored in read-write memory,
    allowing you to modify their contents. In contrast, string literals are stored
    in read-only memory, making them immutable. This difference in memory allocation
    is essential for understanding how to work with strings in `C`.


    --------------------


    # What would be the result of trying to access an array with a pointer that has
    not been initialized?


    Option 1: The program will compile but throw a runtime error.

    Option 2: It will access a random memory location, leading to undefined behavior.

    Option 3: The program will not compile.

    Option 4: The pointer will point to the beginning of the array.


    Correct Response: 2.0


    Explanation: Accessing an array with an uninitialized `pointer` in `C` leads to
    undefined behavior because the `pointer` doesn''t point to a valid memory location.
    The result is unpredictable and can lead to crashes or incorrect data manipulation.


    --------------------


    # Why would you use a pointer to an array instead of a regular array in a function?


    Option 1: Pointers are more memory-efficient than regular arrays.

    Option 2: Pointers provide a way to dynamically allocate memory for arrays.

    Option 3: Pointers allow you to modify the original array within the function.

    Option 4: Pointers allow you to pass arrays without making a copy.


    Correct Response: 4.0


    Explanation: Using a `pointer` to an array in a function allows you to pass the
    array without making a copy. This is more memory-efficient and allows you to modify
    the original array within the function.


    --------------------


    # 1. When a string is declared as a character array, the string must be terminated
    with a.


    Option 1: null character

    Option 2: semicolon

    Option 3: comma

    Option 4: space


    Correct Response: 1.0


    Explanation: In `C`, a string is a sequence of characters terminated by a null
    character `''\0''`. This null character signifies the end of the string.


    --------------------


    # 2. A pointer in C holds the. of a variable.


    Option 1: memory address

    Option 2: data value

    Option 3: size

    Option 4: variable name


    Correct Response: 1.0


    Explanation: A `pointer` in `C` holds the memory address of a variable. It points
    to the location in memory where the variable''s value is stored.


    --------------------


    # 3. In C, an array name acts as a. pointing to the first element of the array.


    Option 1: pointer

    Option 2: reference

    Option 3: label

    Option 4: variable


    Correct Response: 1.0


    Explanation: In `C`, an array name is a constant pointer that points to the address
    of the first element in the array.


    --------------------


    # 2. The use of ________ allows for dynamic memory allocation for arrays in C.


    Option 1: malloc()

    Option 2: sizeof()

    Option 3: getchar()

    Option 4: for loop


    Correct Response: 1.0


    Explanation: Dynamic memory allocation in `C` is achieved using functions like
    `malloc()`.


