    选项 3: 所有元素的地址相同

    选项 4: 地址根据元素的值分配


    正确答案: 1.0


    解释：在一维数组中，连续的元素具有连续的地址。每个元素的地址比前一个元素大一个单位（例如，一个字节）。


    ---


    # 3. C 语言如何处理越界的数组索引？


    选项 1: C 抛出运行时错误

    选项 2: C 忽略越界索引

    选项 3: C 回绕到数组开头

    选项 4: C 动态调整数组大小


    正确答案: 2.0


    解释：在 C 语言中，当数组索引越界时，行为是未定义的。C 不执行任何边界检查，程序员有责任确保索引在范围内，以避免意外结果的结果。


    ---


    # 1. 声明为 `int arr[10];` 的数组为 ________ 个整数分配了内存。


    选项 1: 5

    选项 2: 10

    选项 3: 15

    选项 4: 20


    正确答案: 2.0


    解释：当你声明像 `int arr[10]` 这样的数组时，它为 10 个整数分配内存。


    ---


    # 2. 二维数组可以被视作 ________。


    选项 1: 表格

    选项 2: 链表

    选项 3: 树

    选项 4: 一维数组


    正确答案: 1.0


    解释：二维数组可以被视作具有行和列的表格。


    ---


    # 3. 在 C 语言中，数组的第一个元素可以通过索引 ________ 访问。


    选项 1: 0

    选项 2: 1

    选项 3: 10

    选项 4: -1


    正确答案: 1.0


    解释：在 C 语言中，数组是从零开始索引的，因此第一个元素通过索引 0 访问。


    ---


    # 在声明为 `int arr[5][10];` 的二维数组中，arr[i][j]` 是内存中的 ________ 元素。


    选项 1: i 行 j 列

    选项 2: i 列 j 行

    选项 3: j 行 i 列

    选项 4: j 列 i 行


    正确答案: 1.0


    解释：在二维数组中，第一个索引对应行，第二个索引对应列。因此 `arr[i][j]` 指的是 i 行 j 列。


    ---


    # 声明为 `float arr[10][20];` 的数组消耗的内存为 ________。


    选项 1: 400 字节

    选项 2: 2000 字节

    选项 3: 800 字节

    选项 4: 80 字节


    正确答案: 2.0


    解释：二维数组消耗的内存通过行数乘以列数，再乘以数据类型的大小计算。在这种情况下，是 10（行） * 20（列） * 4 字节（float） = 800 字节。


