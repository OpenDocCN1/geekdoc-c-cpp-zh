    # Q2: In a situation where you have to sort a list of numbers in ascending order,
    and the list is almost sorted with only a few numbers out of order, which sorting
    algorithm would be the most efficient?


    Option 1: Insertion Sort

    Option 2: Merge Sort

    Option 3: Selection Sort

    Option 4: Bubble Sort


    Correct Response: 1.0


    Explanation: `Insertion Sort` is the most efficient choice for sorting an almost
    sorted list, as it has linear time complexity in such cases. `Merge Sort`, `Selection
    Sort`, and `Bubble Sort` are less efficient in this context.


