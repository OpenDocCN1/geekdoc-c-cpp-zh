    Explanation: The prototype of a function includes the function''s name, return
    type, and the types of its parameters. It provides a declaration of the function''s
    signature, allowing the compiler to check function calls for correctness.


    # In C programming, a function that calls itself and the recursive call is the
    last operation before it returns is known as ________ recursion.


    Option 1: Direct

    Option 2: Indirect

    Option 3: Tail

    Option 4: Non-tail


    Correct Response: 3.0


    Explanation: In C programming, a function that calls itself and the recursive
    call is the last operation before it returns is known as "Tail" recursion. `Tail
    recursion` is an efficient form of recursion as it allows the compiler to optimize
    the function calls and avoid unnecessary overhead.


    # You are tasked with writing a C function to calculate the factorial of a number.
    Which programming technique would be most suitable for this task?


    Option 1: Recursion

    Option 2: Iteration

    Option 3: Parallel Programming

    Option 4: Object-Oriented Programming


    Correct Response: 2.0


    Explanation: `Iteration` is the most suitable technique for calculating the factorial
    of a number. It avoids the risk of stack overflow associated with `recursion`
    and is more efficient for this specific task.


    # In optimizing a recursive algorithm for calculating Fibonacci numbers, what
    concept can be applied to avoid redundant calculations?


    Option 1: Memoization

    Option 2: Object-Oriented Programming

    Option 3: Dynamic Typing

    Option 4: Functional Programming


    Correct Response: 1.0


    Explanation: `Memoization` is the concept that can be applied to store and reuse
    intermediate results, avoiding redundant calculations and significantly improving
    the efficiency of the algorithm.


    # You are debugging a C program and notice that the program crashes after running
    for a few minutes. Upon investigation, you find that a recursive function is being
    called multiple times. What could be the most likely cause of the crash?


    Option 1: Stack Overflow

    Option 2: Memory Leak

    Option 3: Infinite Loop

    Option 4: Hardware Failure


    Correct Response: 1.0


    Explanation: The most likely cause of the crash in this scenario is a `stack overflow`.
    When a recursive function is called multiple times without a proper base case
    or termination condition, it can fill up the call stack, causing a `stack overflow`
    and program crash.


    # What is the scope of a local variable defined inside a function in C?


    Option 1: Limited to the function

    Option 2: Global scope

    Option 3: No scope

    Option 4: Limited to the block


    Correct Response: 1.0


    Explanation: In C, a local variable defined inside a function has scope limited
    to that specific function. It cannot be accessed from outside the function.


    # What happens to a local variable when the function in which it is defined finishes
    executing?


    Option 1: It remains in memory

    Option 2: It''s automatically freed

    Option 3: It becomes a global variable

    Option 4: It''s accessible from other functions


    Correct Response: 2.0


    Explanation: When a function finishes executing, the local variables defined inside
    it are automatically freed, and their memory is reclaimed. They do not persist
    after the function call.


    # When a value is passed to a function by value, what is passed to the function?


    Option 1: The memory address of the value

    Option 2: A copy of the value

    Option 3: A pointer to the value

    Option 4: A reference to the value


    Correct Response: 2.0


    Explanation: When a value is passed to a function by value, a copy of the actual
    value is passed to the function. Changes made to the parameter inside the function
    do not affect the original value.


    # What is the scope of a global variable in a C program?


    Option 1: Local to the function it''s defined in

    Option 2: Limited to the file where it''s declared

    Option 3: Accessible throughout the entire program

    Option 4: Only within the `main()` function


    Correct Response: 3.0


    Explanation: In C, global variables have a scope that spans the entire program,
    meaning they can be accessed from any part of the code.


    # In C, when an array is passed to a function, is it passed by value or by reference?


    Option 1: By value

    Option 2: By reference

    Option 3: It depends on the array size

    Option 4: Not possible to pass arrays to functions


    Correct Response: 2.0


    Explanation: In C, arrays are passed to functions by reference, which means that
    changes made to the array inside the function affect the original array in the
    caller.


    # What is the lifetime of a static variable in a C program?


    Option 1: Limited to the function it''s defined in

    Option 2: Same as the program''s runtime

    Option 3: Until the program exits

    Option 4: Until the function exits


    Correct Response: 2.0


    Explanation: The lifetime of a static variable in C is the same as the program''s
    runtime. It retains its value between function calls and persists until the program
    terminates.


    # How does the ''extern'' keyword affect the scope and lifetime of a variable
    in C?


    Option 1: It extends the scope and lifetime of a variable.

    Option 2: It reduces the scope but extends the lifetime of a variable.

    Option 3: It extends the scope but reduces the lifetime of a variable.

    Option 4: It doesn''t affect the scope or lifetime of a variable.


    Correct Response: 3.0


    Explanation: In C, the `extern` keyword extends the scope of a variable but reduces
    its lifetime. It allows a variable declared outside a function to be used within
    it.


    # In C, what is the effect of using pointers as function parameters with regards
    to pass by value and reference?


    Option 1: Pointers enable pass by value.

    Option 2: Pointers enable pass by reference.

    Option 3: Pointers have no impact on pass by value or reference.

    Option 4: Pointers can only be used in pass by value scenarios.


    Correct Response: 2.0


    Explanation: Using pointers as function parameters in C enables pass by reference.
    When a pointer to a variable is passed to a function, changes to the variable
    are reflected outside the function.


    # What is the difference between the scope and the lifetime of a variable?


    Option 1: Scope refers to the range where a variable can be accessed, while lifetime
    refers to how long it exists.

    Option 2: Scope and lifetime are the same thing in C.

    Option 3: Scope determines whether a variable is local or global, while lifetime
    indicates its data type.

    Option 4: Scope defines the data type of a variable, while lifetime indicates
    its value.


    Correct Response: 1.0


    Explanation: The primary difference between the scope and lifetime of a variable
    is that scope refers to where a variable can be accessed, while lifetime indicates
    how long it exists in memory.


    # 1. What type of variable is one that is declared outside any function and is
    available throughout the program?


    Option 1: Global variable

    Option 2: Local variable

    Option 3: Static variable

    Option 4: Constant variable


    Correct Response: 1.0


    Explanation: A global variable is declared outside any function and is accessible
    throughout the program, making it available for all functions to use.


    # 2. When a variable is passed by what, any changes made to the parameter inside
    the function do not affect the original value?


    Option 1: Reference

    Option 2: Value

    Option 3: Pointer

    Option 4: Type


    Correct Response: 2.0


    Explanation: When a variable is passed by value, a copy of the original value
    is created, and any changes made inside the function do not affect the original
    variable.

