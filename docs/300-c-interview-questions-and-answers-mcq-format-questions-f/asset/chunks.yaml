    Correct Response: 1.0


    Explanation: The `while` loop and `do-while` loop are both used for repetitive
    execution of a code block, but they differ in when the condition is checked. In
    a `while` loop, the condition is checked before the loop body is executed. If
    the condition is false initially, the loop body may not execute at all. In a `do-while`
    loop, the loop body is executed at least once before checking the condition. This
    guarantees that the code block will execute at least once, even if the condition
    is false.


