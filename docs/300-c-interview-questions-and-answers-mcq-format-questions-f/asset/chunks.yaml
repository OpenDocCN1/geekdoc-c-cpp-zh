    选项 2：复的

    选项 3：继承的

    选项 4：数组化的


    正确答案：1.0


    解释：当一个结构体内部包含另一个结构体的实例时，它被称为嵌套结构体。


    # 在 C 中定义结构体时，在创建结构体的 ________ 之前，不会分配内存。


    选项 1：实例 (instance)

    选项 2：数组 (array)

    选项 3：指针 (pointer)

    选项 4：函数 (function)


    正确答案：1.0


    解释：在 `C` 中，在创建结构体的实例之前，不会为结构体分配内存。实例代表基于结构体定义的特定对象。


    # 使用关键字 ________ 在 C 中定义结构体。


