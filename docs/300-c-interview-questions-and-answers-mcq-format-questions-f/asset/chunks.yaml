    keyword is used to create a `local variable` with a persistent value, maintaining
    its state across function calls.


    --------------------


    # A `________` variable in C is a variable that is declared within a function
    or a block and is only accessible within that function or block.


    Option 1: local

    Option 2: global

    Option 3: static

    Option 4: extern


    Correct Response: 1.0


    Explanation: A `"local"` variable in C is a variable that is declared within a
    function or a block and is only accessible within that function or block. These
    variables have limited scope, and their lifetime is limited to the duration of
    the function or block in which they are defined.


    --------------------


