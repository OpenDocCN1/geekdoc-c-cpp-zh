    What could be a likely reason for this behavior?


    Option 1: Memory Leak

    Option 2: CPU Overheating

    Option 3: Network Latency

    Option 4: Software Bug


    Correct Response: 1.0


    Explanation: A memory leak is a common reason for slowing down a long-running
    program. It occurs when memory is allocated but not released, leading to resource
    exhaustion and slow performance.


