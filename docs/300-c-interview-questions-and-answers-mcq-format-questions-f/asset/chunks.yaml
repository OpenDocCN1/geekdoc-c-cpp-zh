    ## Q2: In a large software project, certain code needs to be compiled only for
    debugging purposes. How can preprocessor directives be used to achieve this?


    Option 1: By using `ifdef` and `ifndef`

    Option 2: By using `for` loops

    Option 3: By using `switch` statements

    Option 4: By using `while` loops


    Correct Response: 1.0


    Explanation: Preprocessor directives like `ifdef` and `ifndef` can conditionally
    include or exclude sections of code based on predefined conditions. This is often
    used to include debugging code only during debugging builds. Options b, c, and
    d are not related to preprocessor directives.


    ## Q3: You''re working on a C program that must adapt to different operating systems.
    How can preprocessor directives be used to ensure that the right code is compiled
    for the right operating system?


    Option 1: By using the `if-else` statement

    Option 2: By using `while` loops

    Option 3: By using `ifdef` and `ifndef`

    Option 4: By using `for` loops


    Correct Response: 3.0


    Explanation: Preprocessor directives, such as `ifdef` and `ifndef`, can be used
    to conditionally compile code based on the target operating system. This ensures
    that the correct code is included for each OS. Options a, b, and d do not relate
