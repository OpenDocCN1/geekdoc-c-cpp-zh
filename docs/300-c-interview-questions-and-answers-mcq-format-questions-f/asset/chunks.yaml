    \n---\n\n# 在 C 语言中读取文件时，可以使用哪个函数检查是否已到达文件末尾？\n\n选项 1：`feof()`\n选项 2：`ferror()`\n\
    选项 3：`fseek()`\n选项 4：`fclose()`\n\n正确答案：1.0\n\n解释：`feof()` 函数用于在 C 语言文件读取操作期间检查是否已到达文件末尾。\n\
    \n---\n\n# 如何将 C 程序中的错误消息重定向到文件而不是显示在控制台上？\n\n 选项 1：`stdout`\n选项 2：`stderr`\n\
    选项 3：`freopen()`\n选项 4：`perror()`\n\n正确答案：3.0\n\n解释：C 语言中的 `freopen()` 函数用于重定向标准流（如\
    \ `stderr`）到指定的文件，使错误消息存储在文件中而不是控制台上。\n\n---\n\n# C 语言中哪个函数用于刷新流的输出缓冲区？\n\n选项\
    \ 1：`fflush()`\n选项 2：`fputc()`\n选项 3：`fputs()`\n\n正确答案：1.0\n\n解释：C 语言中的 `fflush()`\
    \ 函数用于刷新流的输出缓冲区，确保所有数据都写入文件。\n\n---\n\n# C 语言中的 fseek 函数的作用是什么？\n\n选项 1：将文件位置指示置于开头\n\
    选项 2：将位置指示移动到末尾\n选项 3：将文件指针置于指定位置\n选项 4：关闭文件\n\n正确答案：3.0\n\n解释：正确选项是 c。将文件指针置于指定位置。`fseek()`\
    \ 函数用于设置指定流的文件位置指示，允许对内容进行随机访问。\n\n---\n\n# 如何在 C 语言中以读写混合模式打开文件？\n\n选项 1：`fopen(\"\
    file.txt\", \"rw\")`\n选项 2：`fopen(\"file.txt\", \"r+\")`\n选项 3：`fopen(\"file.txt\"\
    , \"w+\")`\n选项 4：`open(\"file.txt\", \"rw\")`\n\n正确答案：2.0\n\n解释：正确选项是 b) `fopen(\"\
    file.txt\", \"r+\")`。这种 `fopen` 组合允许以读写模式打开文件。\n\n---\n\n# 如果 fopen 函数无法打开指定的文件会发生什么？\n\
    \n选项 1：程序崩溃\n选项 2：返回 `NULL` 指针\n选项 3：在控制台上显示错误消息\n选项 4：打开默认文件\n\n正确答案：2.0\n\n\
    解释：正确选项是 b。返回 `NULL` 指针。当 `fopen()` 函数无法打开指定的文件时，它会返回一个 `NULL` 指针，表示打开失败。\n\n\
