    选项 2：struct

    选项 3：allocate

    选项 4：typedef


    正确答案：2.0


    解释：在 `C` 中，使用 `struct` 关键字来定义结构体。结构体用于将相关数据成员分组在一个名称下。


    # 内存中结构体的大小由其成员的 ________ 决定。


