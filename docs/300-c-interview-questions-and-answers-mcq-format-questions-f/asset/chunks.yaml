    选项 3: 随机整数

    选项 4: 5


    正确答案: 1.0


    解释：在 C 语言中，当你声明一个数组而不对其初始化时，所有元素默认都会被设置为 `0`。因此，正确答案是 `0`。


    ---


    # 如何声明一个 3 行 4 列的整数二维数组？


