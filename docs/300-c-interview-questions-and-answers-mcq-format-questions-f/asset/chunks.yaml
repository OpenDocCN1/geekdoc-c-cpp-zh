    # Why might you choose to use an enumeration instead of a series of #define statements
    for constants?


    Option 1: Enumerations are more memory-efficient


    Option 2: Enumerations provide type checking


    Option 3: #define statements are faster to evaluate


    Option 4: Enumerations cannot be used for constants


    Correct Response: 2.0


    Explanation: You might choose to use an enumeration instead of a series of #define
    statements for constants because enumerations provide type checking, making your
    code more robust and error-prone. #define statements are simple text replacements
    and do not offer type safety.


    --------------------


    # In a union, all members share the same ________.


    Option 1: Name


    Option 2: Value


    Option 3: Memory Address


    Option 4: Data Type


    Correct Response: 3.0


    Explanation: In a union, all members share the same memory location. Unions allow
    different variables to occupy the same memory space, providing efficient storage.


    --------------------


    # An enumeration is a user-defined data type that consists of integral ________.


    Option 1: Functions


    Option 2: Values


    Option 3: Pointers


    Option 4: Characters


    Correct Response: 2.0


    Explanation: An enumeration is a user-defined data type that consists of integral
    values, typically used for defining a set of named integer constants.


    --------------------


    # A ________ allows multiple variables to share the same memory location.


    Option 1: Pointer


    Option 2: Structure


    Option 3: Function


    Option 4: Union


    Correct Response: 4.0


    Explanation: A union allows multiple variables to share the same memory location,
    making it useful for scenarios where different types of data need to occupy the
    same memory space.


    --------------------


    # Using a union can lead to efficient memory usage when you need to store different
    ________ at different times.


    Option 1: data types


    Option 2: values


    Option 3: structures


    Option 4: members


    Correct Response: 1.0


    Explanation: Explanation: When you use a union, you can store different data types
    in the same memory location, depending on the specific member you access. This
    can help save memory when you need to handle various types of data at different
    times.


    --------------------


    # Enumerations provide a way to assign ________ to a set of named constants.


    Option 1: values


    Option 2: data


    Option 3: functions


    Option 4: objects


    Correct Response: 1.0


    Explanation: Explanation: Enumerations allow you to assign integer values to a
    set of named constants, making your code more readable and maintainable by giving
    meaningful names to values.


    --------------------


    # When you define a union, the compiler allocates memory based on the ________
    member of the union.


    Option 1: smallest


    Option 2: largest


    Option 3: first


    Option 4: last


    Correct Response: 2.0


    Explanation: Explanation: The compiler allocates memory based on the largest member
    of the union to ensure that it can accommodate the largest data type within the
    union, which is known as the "largest member rule."


    --------------------


    # Question 1: You are developing an application that needs to represent a value
    that could either be an integer or a floating-point number. How could you efficiently
    represent this data using C?


    Option 1: Using a union


    Option 2: Using an array


    Option 3: Using a structure


    Option 4: Using a linked list


    Correct Response: 1.0


    Explanation: In C, a union allows you to efficiently represent data that can be
    either an integer or a floating-point number, as it allows sharing the same memory
    location for different data types. Arrays, structures, and linked lists are not
    suitable for this purpose.


