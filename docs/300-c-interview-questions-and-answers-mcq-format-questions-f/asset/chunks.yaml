    选项 3: `int arr[12];`

    选项 4: `int arr[][];`


    正确答案: 1.0


    解释：在 C 语言中声明一个 3 行 4 列的二维数组，使用语法：`int arr[3][4];`。第一个维度指定行数，第二个维度指定列数。


    ---


    # 当你声明数组时，方括号内的数字代表什么？


    选项 1: 数组中的元素数量

    选项 2: 最后一个元素的索引

    选项 3: 分配给数组的总内存

    选项 4: 数组名称的长度


    正确答案: 1.0


    解释：在 C 语言中声明数组时，方括号内的数字代表元素的数量或数组的大小。它指示了数组可以容纳多少元素。


    ---


    # 用于描述选择多维数组中的元素时所需的索引数量的术语是什么？


    选项 1: 维度

    选项 2: 索引复杂度

    选项 3: 数组深度

    选项 4: 选择排名


    正确答案: 1.0


    解释：用于描述选择多维数组元素时所需索引数量的术语是维度（dimensionality）。在多维数组中，每个维度都需要单独的索引来访问元素。


    ---


    # 如何在 C 语言中确定数组的大小？


    选项 1: 使用 ''length'' 关键字

    选项 2: 使用 ''size'' 函数

    选项 3: 通过计算元素数量

    选项 4: 使用 `sizeof` 运算符


    正确答案: 4.0


    解释：你可以使用 `sizeof` 运算符来确定 C 语言中数组的大小。它返回以字节为单位的大小，因此将结果除以单个元素的大小即可得到数组中的元素数量。


    ---


    # 在使用值列表初始化数组时不指定数组大小会有什么影响？


    选项 1: 编译错误

    选项 2: 数组大小根据值的数量自动设置

    选项 3: 未定义行为

    选项 4: 数组以 10 的默认大小初始化


    正确答案: 2.0


    解释：在 C 语言中，使用值列表初始化数组且未指定大小时，数组的大小将根据值的数量自动设置。这是 C 语言中一个方便的特性，被称为无指定大小的数组初始化。


    ---


    # 1. 数据在内存的二维数组中是如何存储的？


    选项 1: 顺序存储，按行存储

    选项 2: 随机存储，无任何顺序

    选项 3: 反序存储

    选项 4: 垂直存储，按列存储


    正确答案: 1.0


    解释：在二维数组中，数据是按行顺序存储的。每行在内存中都是连续的，且元素按照它们在行中出现的顺序进行存储。


    ---


    # 2. 一维数组中连续元素的地址之间存在什么关系？


    选项 1: 连续元素具有连续的地址

