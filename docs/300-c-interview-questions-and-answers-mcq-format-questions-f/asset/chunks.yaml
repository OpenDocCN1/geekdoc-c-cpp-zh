    # What is the difference between the ''while'' and ''do-while'' loops in terms
    of their execution?


    Option 1: The `while` loop always executes its code block at least once, while
    the `do-while` loop may not execute it at all.

    Option 2: The `do-while` loop is not a valid loop construct in most programming
    languages.

    Option 3: The `while` loop executes its code block in reverse order compared to
    the `do-while` loop.

