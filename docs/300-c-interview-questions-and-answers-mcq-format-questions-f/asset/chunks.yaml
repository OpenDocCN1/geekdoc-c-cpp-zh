    # What is the behavior of `malloc` when the size requested is zero?


    Option 1: It returns a null pointer (`NULL`)

    Option 2: It returns a pointer to a zero-sized memory block

    Option 3: It returns an error

    Option 4: It goes into an infinite loop


    Correct Response: 1.0


    Explanation: When you request zero bytes of memory using `malloc`, it returns
    a null pointer (`NULL`) rather than allocating a zero-sized memory block. This
    is useful for special cases when you need a pointer that doesn''t point to any
    memory.


    --------------------


    # In C, the function ________ is used to allocate memory for an array of elements
    and initialize them to zero.


    Option 1: `malloc()`

    Option 2: `calloc()`

    Option 3: `realloc()`

