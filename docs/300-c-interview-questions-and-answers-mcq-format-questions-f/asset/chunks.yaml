    ## When declaring a variable in C, what does the ''static'' keyword do to the
    variable''s lifetime?

    Option 1: Shortens it

    Option 2: Extends it

    Option 3: Doesn''t affect it

    Option 4: Initializes it


    Correct Response: 2.0


    Explanation: The `static` keyword in C extends the lifetime of a variable, allowing
    it to retain its value between function calls, making it suitable for data that
    persists.


    ---


    ## You''re developing a program to calculate the area of a circle. What data type
    would be most suitable to store the radius, considering it can be a fractional
    value?

    Option 1: int

    Option 2: float

    Option 3: double

    Option 4: char


    Correct Response: 3.0


    Explanation: To store the radius of a circle with fractional values, the most
    suitable data type in C is `double` as it offers high precision for such calculations.


    ---


    ## Consider a scenario where a program needs to store a character read from a
    file. Which data type would be appropriate for this?

    Option 1: int

    Option 2: float

    Option 3: char

    Option 4: double


    Correct Response: 3.0


    Explanation: To store a character read from a file in C, the appropriate data
    type is `char` as it can represent individual characters effectively.


    ---


    ## In the context of C programming, what is the size of an ''enum'' data type?

    Option 1: Varies

    Option 2: 2 bytes

    Option 3: 4 bytes

    Option 4: It depends


    Correct Response: 1.0


    Explanation: The size of an `enum` data type varies in C, and it depends on the
    specific implementation. Typically, it''s large enough to represent all the enumeration
    constants.


    ---


    ## How does the ''register'' keyword affect the storage of a variable in a C program?

    Option 1: It''s allocated in the stack

    Option 2: It''s allocated in a CPU register

    Option 3: It''s allocated in the heap

    Option 4: It''s allocated in the data segment


    Correct Response: 2.0


    Explanation: The `register` keyword suggests to the compiler to store the variable
    in a CPU register, which can lead to faster access. However, it''s just a hint,
    and the compiler may choose to ignore it.


    ---


    ## When dealing with large datasets, what is the advantage of using ''long long
    int'' over ''int''?

    Option 1: No advantage

    Option 2: Better precision

    Option 3: Smaller memory usage

    Option 4: Higher range


    Correct Response: 4.0


    Explanation: When dealing with large datasets, using `long long int` provides
    a higher range of values that can be represented, which is useful for large data.
    It comes at the cost of increased memory usage.


    ---


    ## In C, a ________ is used to store a sequence of characters.

    Option 1: variable

    Option 2: function

    Option 3: string

    Option 4: array


    Correct Response: 3.0


    Explanation: In C, a `string` is used to store a sequence of characters. A string
    is an array of characters, typically represented as an array of `char` data type.


    ---


    ## The keyword ________ is used in C to define a constant.

    Option 1: value

    Option 2: constant

    Option 3: define

    Option 4: identifier


    Correct Response: 2.0


    Explanation: In C, the keyword `const` is used to define a constant. It is used
    to declare variables as constant, and their values cannot be changed after declaration.


    ---


    ## The data type ________ is used in C to store a single character.

    Option 1: char

    Option 2: int

    Option 3: double

    Option 4: character


    Correct Response: 1.0


    Explanation: In C, the `char` data type is used to store a single character. It
    can hold a single character, such as a letter or a symbol, within single quotes.


    ---


    ## In C, the size of the data type ________ is platform-dependent.

    Option 1: int

    Option 2: long

    Option 3: double

    Option 4: char


    Correct Response: 3.0


    Explanation: In C, the size of the data type `double` is platform-dependent. Different
    platforms may allocate different memory sizes for `double` data type.


    ---


    ## The ________ keyword in C suggests to the compiler to use a CPU register for
    the variable to optimize access time.

    Option 1: register

    Option 2: volatile

    Option 3: static

    Option 4: const


    Correct Response: 1.0


    Explanation: The `register` keyword in C suggests to the compiler to use a CPU
    register for the variable to optimize access time, which can lead to faster access.


    ---


    ## When a floating-point number is declared using the ________ keyword, it allows
    for more precision than a float.

    Option 1: long double

    Option 2: float

    Option 3: double

    Option 4: precision


    Correct Response: 1.0


    Explanation: When a floating-point number is declared using the `long double`
    keyword in C, it allows for more precision than `float`.


    ---


    ## You are debugging a C program and notice that a variable intended to store
    large numbers is not holding the values correctly. What might be the issue with
    the data used?

    Option 1: The issue might be with using an int data type.

    Option 2: The issue might be with using a float data type.

    Option 3: The issue might be with using a double data type.

    Option 4: The issue might be with using a short data type.


    Correct Response: 3.0


    Explanation: The correct option is 3. When dealing with large numbers, it''s more
    appropriate to use a `double` data type because it provides greater precision
    compared to `int` and `float`, which may result in loss of precision. `short`
    data type is typically used for smaller integers.


    ---


    ## In a program that processes images, each pixel is represented by three values
    corresponding to the Red, Green, and Blue (RGB) intensities. What would be an
    efficient way to represent a pixel in C?

    Option 1: An efficient way to represent a pixel in C is by using a struct with
    three integer fields.

    Option 2: An efficient way to represent a pixel in C is by using a single integer
    value.

    Option 3: An efficient way to represent a pixel in C is by using three separate
    variables.

    Option 4: An efficient way to represent a pixel in C is by using a character array.


    Correct Response: 1.0


    Explanation: The correct option is 1. Using a `struct` with three integer fields
    is the most efficient way to represent a pixel in C because it encapsulates the
    RGB values as a single unit, making it easy to work with. The other options would
    be less efficient and less organized.


    ---


    ## You''re developing a program to simulate a real-world scenario where different
    objects have different attributes like color, shape, and size. Which data type
    or concept in C would you use to efficiently represent these objects?

    Option 1: To efficiently represent these objects, you can use a struct in C.

    Option 2: To efficiently represent these objects, you can use an array of integers.

    Option 3: To efficiently represent these objects, you can use a union in C.

