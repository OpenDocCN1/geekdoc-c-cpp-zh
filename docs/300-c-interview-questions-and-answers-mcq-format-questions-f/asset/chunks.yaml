    # 如果 ''while'' 循环中的条件初始为假，会发生什么？


    选项 1：它不会进入循环。

    选项 2：它将进入循环并执行一次。

    选项 3：它将导致编译错误。

    选项 4：它将进入循环并无限运行。


    正确答案：1.0


    解释：当 `while` 循环中的条件初始为假时，循环将不会执行，程序将继续执行下一个语句。


    # C 语言中用哪个函数在控制台上显示输出？


