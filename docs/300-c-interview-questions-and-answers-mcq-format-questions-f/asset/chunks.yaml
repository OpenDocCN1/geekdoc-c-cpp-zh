    - 选项 1：`Argument`（参数）

    - 选项 2：`Parameter`（参数）

    - 选项 3：`Pointer`（指针）

    - 选项 4：`Variable`（变量）


    正确答案：2.0


    解析：在 C 语言中，回调函数作为参数传递给另一个函数，允许该函数回调回提供的函数。


    # 双级指针在 C 语言中常创建指针的(n) ________。


