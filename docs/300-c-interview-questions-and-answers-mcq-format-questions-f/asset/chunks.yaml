    Option 1: Using the ''length'' keyword


    Option 2: By using the ''size'' function


    Option 3: By counting the number of elements


    Option 4: Using the ''sizeof'' operator


    Correct Response: 4.0


    Explanation: You can determine the size of an array in C by using the ''sizeof''
    operator. It returns the size in bytes, so dividing it by the size of one element
    gives you the number of elements in the array.


    --------------------


    # What is the effect of not specifying the size of the array when initializing
    it with a list of values?


    Option 1: Compilation error


    Option 2: The array size is automatically set based on the number of values


    Option 3: Undefined behavior


    Option 4: The array is initialized with a default size of 10


    Correct Response: 2.0


    Explanation: When initializing an array with a list of values in C without specifying
    the size, the array size is automatically set based on the number of values. It
    is a convenient feature in C known as array initialization without a size specification.


    --------------------


    # 1\. How is data stored in a two-dimensional array in memory?


    Option 1: Sequentially, row by row


    Option 2: Randomly, without any order


    Option 3: In reverse order


    Option 4: Vertically, column by column


    Correct Response: 1.0


    Explanation: In a two-dimensional array, data is stored sequentially, row by row.
    Each row is contiguous in memory, and elements are stored in the order they appear
    in the row.


    --------------------


    # 2\. What is the relationship between the addresses of consecutive elements in
    a one-dimensional array?


    Option 1: Consecutive elements have consecutive addresses


    Option 2: Consecutive elements have addresses in random order


    Option 3: Addresses are the same for all elements


    Option 4: Addresses are assigned based on the element''s value


    Correct Response: 1.0


    Explanation: In a one-dimensional array, consecutive elements have consecutive
    addresses. The address of each element is one unit (e.g., byte) greater than the
    previous element.


    --------------------


    # 3\. How does C handle array indices that are out of bounds?


    Option 1: C throws a runtime error


    Option 2: C ignores out-of-bounds indices


    Option 3: C wraps around to the beginning of the array


    Option 4: C dynamically resizes the array


    Correct Response: 2.0


    Explanation: In C, when array indices are out of bounds, the behavior is undefined.
    C does not perform any bounds checking, and it''s the programmer''s responsibility
    to ensure indices are within bounds to avoid unexpected results.


    --------------------


    # 1\. An array declared as int arr[10]; allocates memory for ________ integers.


    Option 1: 5


    Option 2: 10


    Option 3: 15


    Option 4: 20


    Correct Response: 2.0


    Explanation: When you declare an array like int arr[10], it allocates memory for
    10 integers.


    --------------------


    # 2\. A two-dimensional array can be visualized as a ________.


    Option 1: Table


    Option 2: Linked List


    Option 3: Tree Structure


    Option 4: One-dimensional array


    Correct Response: 1.0


    Explanation: A two-dimensional array can be visualized as a table with rows and
    columns.


    --------------------


    # 3\. In C, the first element of an array can be accessed using index ________.


    Option 1: 0


    Option 2: 1


    Option 3: 10


    Option 4: -1


    Correct Response: 1.0


    Explanation: In C, arrays are zero-indexed, so the first element can be accessed
    using index 0.


    --------------------


    # In a two-dimensional array declared as int arr[5][10];, the expression arr[i][j]
    refers to the ________ element in memory.


    Option 1: i-th row, j-th column


    Option 2: i-th column, j-th row


    Option 3: j-th row, i-th column


    Option 4: j-th column, i-th row


    Correct Response: 1.0


    Explanation: In a two-dimensional array, the first index corresponds to rows,
    and the second index corresponds to columns. So, arr[i][j] refers to the element
    at the i-th row and j-th column.


    --------------------


    # The memory consumed by an array declared as float arr[10][20]; is ________.


    Option 1: 400 bytes


    Option 2: 2000 bytes


    Option 3: 800 bytes


    Option 4: 80 bytes


    Correct Response: 2.0


    Explanation: The memory consumed by a two-dimensional array is calculated by multiplying
    the number of rows by the number of columns and then multiplying it by the size
    of the data type. In this case, it''s 10 (rows) * 20 (columns) * 4 bytes (float)
    = 800 bytes.


    --------------------


    # In C, the base address of an array arr can be accessed using ________.


    Option 1: &arr


    Option 2: arr[0]


    Option 3: &arr[0]


    Option 4: arr


    Correct Response: 1.0


    Explanation: To access the base address of an array in C, you can simply use the
    array name without an index, which is equivalent to &arr[0]. So, both &arr and
    arr[0] provide the base address.


    --------------------


    # You are working on a program that simulates a chessboard. How would you represent
    the chessboard using arrays?


    Option 1: 1D Array


    Option 2: 2D Array


    Option 3: Linked List


    Option 4: Hash Table


    Correct Response: 2.0


    Explanation: A chessboard is best represented using a 2D array because it provides
    a grid structure, allowing easy indexing for each square.


    --------------------


    # In a scientific computation program, you need to represent a matrix of real
    numbers. What kind of array would be suitable for this purpose?


    Option 1: 1D Array


    Option 2: 2D Array


    Option 3: Dynamic Array (ArrayList)


    Option 4: Binary Tree


    Correct Response: 2.0'
