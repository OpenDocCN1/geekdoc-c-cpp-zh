    # What is the main purpose of using pointers in a program?


    Option 1: To store multiple values

    Option 2: To allocate memory

    Option 3: To perform arithmetic operations

    Option 4: To create functions


    Correct Response: 2.0


    Explanation: Pointers in C are used to allocate memory, which is a crucial feature
