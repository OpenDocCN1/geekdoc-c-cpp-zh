    解释：嵌套结构体可以用于表示复杂的数据关系。在这种语境下，它们可以用于创建一个包含课程结构体的学生结构。这允许对学生课程信息进行高效存储和检索。


    # 问题 3：你正在开发一个联系人管理系统，每个联系人可能有多个地址（家庭、工作等）。如何使用结构体高效表示这种关系？


    选项 1：为每个联系人使用数组

    选项 2：为每个地址使用单独变量

    选项 3：利用在结构人结构体内部包含多个地址

    选项 4：为地址创建单独数据库


    正确答案：3.0


    解释：为了高效地表示每个联系人的多个地址，可以在联系人结构体内部包含多个地址。这种方法确保了每个联系人都有不同类型的地址（如家庭和工作），是管理联系人信息的一种实用方法。


    # 在 C 编程中使用结构体指针的目的是什么？


    选项 1：访问结构体成员

    选项 2：声明结构体

    选项 3：创建一个新结构体

    选项 4：存储整数


    正确答案：1.0


    解释：结构体指针用于访问和操作结构体的成员。


    # 在 C 中处理结构体数组时，数组的每个元素代表什么？


    选项 1：单个结构体实例

    选项 2：函数指针

    选项 3：字符数组

    选项 4：浮点数


