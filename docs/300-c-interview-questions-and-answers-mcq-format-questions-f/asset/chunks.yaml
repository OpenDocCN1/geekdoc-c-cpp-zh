    # Q1：C 语言中函数指针的声明使用的语法是 ________。


    - 选项 1：`ptr_func`

    - 选项 2：`*func_ptr`

    - 选项 3：`func()ptr`

    - 选项 4：`func_ptr()`


    正确答案：2.0


    解析：在 C 语言中，要声明函数指针，使用语法 `return_type (*pointer_name)(arguments)`。这允许你通过指针调用函数。


    # Q2：在 C 语言中，双级指针是指指向另一个 ________ 的指针。


