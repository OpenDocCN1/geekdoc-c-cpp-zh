    # In C, to ensure that there are no errors while writing to a file, you should
    check the return value of the ________ function.


    - Option 1: `fclose`

    - Option 2: `ferror`

    - Option 3: `feof`

    - Option 4: `fflush`


    **Correct Response:** 2.0


    **Explanation:** To ensure error-free file writing, you should check the return
    value of the `ferror` function, making option b) "ferror" the correct choice.


    # When a file is opened in ''w'' mode using `fopen`, if the file already exists,
    its contents are ________.


    - Option 1: Overwritten

    - Option 2: Appended

    - Option 3: Preserved

    - Option 4: Erased


    **Correct Response:** 1.0


    **Explanation:** In ''w'' mode, if the file already exists, its contents are overwritten,
    so option a) "Overwritten" is the correct answer.


    # Q1: You are developing a log monitoring tool that needs to constantly read a
    log file and process new entries. What approach would you take to efficiently
    read the file?


    - Option 1: Use a single-threaded approach to read the file sequentially.

    - Option 2: Employ multi-threading to parallelize log file reading.

    - Option 3: Use a polling mechanism to check for file changes.

    - Option 4: Periodically restart the application to clear the file buffer.


    **Correct Response:** 2.0


    **Explanation:** Efficient log reading often involves multi-threading to process
    entries concurrently, leading to better performance.


    # Q2: In an application that writes user data to a text file, what precaution
    should be taken to avoid data corruption or loss?


    - Option 1: Use a non-atomic write operation.

    - Option 2: Ensure the application flushes the buffer after each write.

    - Option 3: Delay disk writes to optimize performance.

    - Option 4: Overwrite existing data without checking for errors.


    **Correct Response:** 2.0


    **Explanation:** To avoid data corruption or loss, it''s crucial to flush the
    buffer after each write operation to ensure data is written to the file immediately.


    # Q3: You''re tasked with optimizing a program that reads large text files. What
    strategies could you employ to improve the performance of the file reading operation?


    - Option 1: Use a simple sequential read operation without any optimizations.

    - Option 2: Employ memory-mapped files to reduce I/O operations.

    - Option 3: Read the entire file into memory at once.

    - Option 4: Ignore error handling to reduce overhead.


    **Correct Response:** 2.0


    **Explanation:** Utilizing memory-mapped files can reduce I/O operations and improve
    the performance of reading large text files. Loading the entire file into memory
    can lead to resource issues.


    # What function is used to open a binary file for both reading and writing in
    C?


    - Option 1: `fopen()`

    - Option 2: `open()`

    - Option 3: `readfile()`

    - Option 4: `openfile()`


    **Correct Response:** 1.0


    **Explanation:** In C, the `fopen()` function is used to open a binary file for
    both reading and writing. It returns a file pointer, which is essential for performing
    file operations.


    # What is the primary use of the `fseek` function in file handling?


    - Option 1: Moving the cursor to the end of a file

    - Option 2: Closing a file

    - Option 3: Setting the file''s permissions

    - Option 4: Moving the file cursor to a specific position


    **Correct Response:** 4.0


    **Explanation:** The primary use of the `fseek()` function is to move the file
    cursor to a specific position within the file. This allows you to read or write
    data at a specific location in the file.


    # Which function is used to close a file that has been opened for reading or writing?


    - Option 1: `fclose()`

    - Option 2: `closefile()`

    - Option 3: `endfile()`

    - Option 4: `stopfile()`


    **Correct Response:** 1.0


    **Explanation:** In C, the `fclose()` function is used to close a file that has
    been opened for reading or writing. It is essential to close files to release
    system resources and ensure that data is properly saved.


    # When working with binary files in C, what is the significance of the ''b'' character
    in the mode string?


    - Option 1: It denotes the file is binary, and data is stored as a series of 0s
    and 1s.

    - Option 2: It indicates the file is a backup copy.

    - Option 3: It specifies the file is in compressed format.

    - Option 4: It represents the file is a text file.


    **Correct Response:** 1.0


    **Explanation:** In C, the ''b'' character in the mode string indicates that the
    file is opened in binary mode. In this mode, data is read or written in its raw
    binary form, without any character encoding or translation. This is essential
    when working with binary files like images or executable files.


    # What function can be used to find the current position of the file pointer in
    a file?


    - Option 1: `fseek()`

    - Option 2: `readPosition()`

    - Option 3: `getCurrentPointer()`

    - Option 4: `filePosition()`


    **Correct Response:** 1.0


    **Explanation:** The correct function to find the current position of the file
    pointer in a file is `fseek()`. It allows you to set the file position indicator
    to a specific location in the file and returns the current position. The other
    options are not valid functions for this purpose.


    # What is the purpose of using random access in file handling?


    - Option 1: To access files in a random order.

    - Option 2: To perform direct read/write operations at any position within the
    file.

    - Option 3: To create files with random names.

    - Option 4: To generate random numbers for file operations.


    **Correct Response:** 2.0


    **Explanation:** The purpose of using random access in file handling is to perform
    direct read and write operations at any position within the file. Random access
    allows you to jump to a specific location in a file and read or write data without
    having to sequentially process the entire file. It''s especially useful for large
    files or databases.


    # What potential problem might occur when using `fseek` and `ftell` with large
    binary files?


    - Option 1: Data corruption

    - Option 2: Performance degradation

    - Option 3: Inaccurate file positioning

    - Option 4: Memory overflow


    **Correct Response:** 3.0


    **Explanation:** When working with large binary files, using `fseek` and `ftell`
    may result in inaccurate file positioning. This is because these functions use
    a single long integer to represent the file position, which may not be sufficient
    to handle the large offsets required for large files. This can lead to errors
    in file positioning and unintended behavior in your code.


    # In the context of file handling, what is the advantage of using binary files
    over text files?


    - Option 1: Portability

    - Option 2: Human readability

    - Option 3: Data preservation

    - Option 4: Smaller file size


    **Correct Response:** 3.0


    **Explanation:** One of the advantages of using binary files over text files in
    file handling is data preservation. Binary files store data as a sequence of bytes,
    preserving the exact representation of data without any character encoding or
    formatting. This makes them suitable for storing complex data structures and preserving
    data integrity.


    # What is the significance of the `SEEK_SET`, `SEEK_CUR`, and `SEEK_END` constants
    in file handling?


    - Option 1: File permissions

    - Option 2: File attributes

    - Option 3: File positioning

    - Option 4: File type


    **Correct Response:** 3.0


    **Explanation:** In file handling, `SEEK_SET`, `SEEK_CUR`, and `SEEK_END` constants
    are used to define the reference point for file positioning. `SEEK_SET` sets the
    file position from the beginning of the file, `SEEK_CUR` sets it relative to the
    current position, and `SEEK_END` sets it relative to the end of the file. These
    constants are crucial for accurate file positioning and seeking within files.


    # The function ________ is used to write data to a binary file.


    - Option 1: `fwrite()`

    - Option 2: `fread()`

    - Option 3: `write()`

    - Option 4: `binary_write()`


    **Correct Response:** 1.0

