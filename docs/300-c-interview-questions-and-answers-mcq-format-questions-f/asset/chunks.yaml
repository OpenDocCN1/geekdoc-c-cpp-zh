    Option 3: It reduces code readability by introducing ambiguity.


    Option 4: It is not related to code maintainability.


    Correct Response: 1.0


    Explanation: Function overloading in C++ allows you to define multiple functions
    with the same name but different parameter types, making the code more readable
    and expressive. It enables you to use intuitive function names for various versions
    of a task.


    --------------------


    # Which standard library function in C is used to concatenate two strings?


    Option 1: strcat


    Option 2: strcmp


    Option 3: strcopy


    Option 4: strconcat


    Correct Response: 1.0


    Explanation: The strcat function in C is used to concatenate (append) one string
    to the end of another. It takes two strings as arguments and modifies the first
    string to include the second one at the end.


    --------------------


    # What is a potential risk when using the strcpy function in C?


    Option 1: Buffer overflow


    Option 2: Memory leak


    Option 3: Compilation error


    Option 4: Segmentation fault


    Correct Response: 1.0


    Explanation: The strcpy function in C copies a string to a destination buffer
    without checking the length, which can lead to buffer overflow if the source string
    is longer than the destination buffer. This can result in overwriting adjacent
    memory, causing potential security vulnerabilities or program crashes.


    --------------------


    # How does C++ resolve calls to overloaded functions?


    Option 1: Overloaded function resolution is based on the number and types of parameters


    Option 2: Overloaded function resolution is based on the function name


    Option 3: Overloaded function resolution is random


    Option 4: Overloaded function resolution is based on the return type


    Correct Response: 1.0


    Explanation: In C++, when there are multiple overloaded functions with the same
    name, the compiler resolves the calls based on the number and types of parameters
    provided in the function call. This process is known as function overloading,
    and it allows C++ to choose the most appropriate function to call based on the
    arguments provided.


    --------------------


    # In C++, what happens when two overloaded functions have the same number and
    types of parameters but differ in return type?


    Option 1: It''s a compilation error


    Option 2: The function with the most specific return type is called


    Option 3: The function with the least specific return type is called


    Option 4: It''s undefined behavior


    Correct Response: 1.0


    Explanation: When two overloaded functions in C++ have the same number and types
    of parameters but differ in return type, it results in a compilation error. C++
    uses the function''s signature, including the return type, to differentiate between
    overloaded functions. If two functions have the same parameters and differ only
    in return type, it becomes ambiguous, and the compiler cannot determine which
    function to call.


    --------------------


    # The C function ________ is used to compare two strings lexicographically.


    Option 1: strcmp


    Option 2: strncmp


    Option 3: strcompare


    Option 4: strcasecmp


    Correct Response: 1.0


    Explanation: The correct answer is strcmp. This function compares two strings
    character by character and returns an integer value representing their lexicographical
    order. strncmp is used for comparing a specific number of characters, and the
    other options are not valid C functions.


    --------------------


    # In C++, function overloading allows multiple functions to have the same name
    but with different ________.


    Option 1: parameters


    Option 2: return types


    Option 3: function names


    Option 4: access specifiers


    Correct Response: 2.0


    Explanation: The correct answer is return types. In C++, function overloading
    is when you have multiple functions with the same name but differing in their
    parameter types or the number of parameters. However, their return types must
    be different to distinguish them. The other options are not relevant to function
    overloading.


    --------------------


    # The strlen function returns the length of a string, excluding the ________.


    Option 1: null terminator


    Option 2: first character


    Option 3: whitespace characters


    Option 4: special characters


    Correct Response: 1.0


    Explanation: The correct answer is the null terminator. The strlen function in
    C/C++ returns the length of a string by counting characters until it encounters
    the null terminator (''\0''). It excludes the null terminator from the count.
    The other options are not what strlen excludes.


    --------------------


    # The ________ function in C is used to search for the first occurrence of a character
    in a string.


    Option 1: strstr()


    Option 2: strchr()


    Option 3: strnchr()


    Option 4: strsearch()


    Correct Response: 2.0


    Explanation: In C, the strchr() function is used to search for the first occurrence
    of a character in a string. It returns a pointer to the first occurrence or a
    null pointer if the character is not found. This function is commonly used in
    C for string manipulation.


    --------------------


    # In C++, if two overloaded functions have the same signature but differ in const
    qualification, it leads to ________.


    Option 1: Ambiguity Error


    Option 2: Compilation Error


    Option 3: Undefined Behavior


    Option 4: Linker Error


    Correct Response: 3.0


    Explanation: When two overloaded functions in C++ have the same signature but
    differ in const qualification, it leads to undefined behavior. The compiler cannot
    determine which function to call, resulting in ambiguous code. It''s essential
    to avoid such situations for code clarity and reliability.


    --------------------


    # In C, the ________ function is used to copy a specified number of characters
    from one string to another.


    Option 1: strcpy()


    Option 2: strncpy()


    Option 3: memcpy()


    Option 4: strncat()


    Correct Response: 2.0


    Explanation: In C, the strncpy() function is used to copy a specified number of
    characters from one string to another. Unlike strcpy(), it allows you to specify
    the maximum number of characters to copy, which helps prevent buffer overflows
    and enhances program security.


    --------------------


    # Q1: You are working on a software project in C++ that requires sorting a list
    of items in multiple ways. How could you leverage function overloading to achieve
    this?


    Option 1: Define multiple functions with the same name but different parameters
    for each sorting method.


    Option 2: Implement a single function with the most generic sorting algorithm
    to handle all sorting needs.


    Option 3: Use inline functions for sorting, allowing for multiple sorting methods
    within one function.


    Option 4: Utilize global variables to store sorting methods for easy access and
    reuse.


    Correct Response: 1.0


    Explanation: Explanation: Function overloading in C++ allows you to define multiple
    functions with the same name but different parameters, enabling the use of various
    sorting methods for different data types.


    --------------------


    # Q2: You are tasked with optimizing a C program that manipulates large strings.
    What standard library functions might be critical to review for potential performance
    bottlenecks?


    Option 1: strlen() and strcat()


    Option 2: printf() and scanf()


    Option 3: malloc() and free()


    Option 4: getchar() and putchar()


    Correct Response: 1.0


    Explanation: Explanation: When optimizing a C program that manipulates large strings,
    functions like strlen() and strcat() should be reviewed for potential performance
    bottlenecks as they involve string manipulation and can be resource-intensive.


    --------------------'
