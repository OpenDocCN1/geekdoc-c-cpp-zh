    ## What is the primary purpose of a function in C programming?


    Option 1: To declare variables

    Option 2: To organize code logically

    Option 3: To print text to the screen

    Option 4: To run the program


    Correct Response: 2.0


    Explanation: In C programming, a function is primarily used to organize code logically,
    making it easier to manage and understand.


    ## What term is used to describe the process of calling a function within itself?


    Option 1: Looping

    Option 2: Recursion

    Option 3: Casting

    Option 4: Structuring


    Correct Response: 2.0


    Explanation: The process of calling a function within itself is known as "recursion."
    It allows for solving problems that can be broken down into smaller, similar subproblems.


    ## What is the main difference between function declaration and function definition
    in C?


    Option 1: Declarations specify the function''s name

    Option 2: Definitions provide the function''s implementation

    Option 3: Declarations contain the function''s code

    Option 4: Definitions declare the function''s return type


    Correct Response: 2.0


    Explanation: The main difference between function declaration and function definition
    in C is that declarations specify the function''s name and data types, while definitions
    provide the actual implementation of the function.


    ## Which of the following best describes the concept of recursion in C programming?


    Option 1: A loop mechanism for repeating a set of instructions

    Option 2: A function calling itself directly or indirectly

    Option 3: A method to divide a problem into smaller subproblems

    Option 4: A way to define constant values


    Correct Response: 2.0


    Explanation: Recursion in C programming involves a function calling itself either
    directly or indirectly. It''s a technique used to solve problems by breaking them
    down into smaller instances, making it an essential concept in programming.


    ## What is the significance of the return type in a function declaration in C?


    Option 1: It specifies the number of arguments a function can take

    Option 2: It defines the scope of variables used within the function

    Option 3: It indicates the data type of the value the function returns

    Option 4: It determines the function''s execution order


    Correct Response: 3.0


    Explanation: The return type in a function declaration in C indicates the data
    type of the value that the function will return to the calling program. This information
    is vital for using the function correctly and processing its result.


    ## In the context of C programming, what is the importance of having a base case
    in a recursive function?


    Option 1: It makes the program run faster

    Option 2: It reduces the need for using pointers

    Option 3: It prevents infinite recursion and stack overflow

    Option 4: It simplifies the program''s overall structure


    Correct Response: 3.0


    Explanation: Having a base case in a recursive function is crucial to prevent
    infinite recursion, which can lead to a stack overflow and program termination.
    The base case provides a stopping condition for the recursion and ensures the
    function terminates properly.


    ## What potential issue should be considered when using recursion in C programs?


    Option 1: Stack overflow error

    Option 2: Memory leak

    Option 3: Inefficient use of CPU

    Option 4: Compiler error


    Correct Response: 1.0


    Explanation: When using recursion in C, one potential issue to consider is a stack
    overflow error. Recursion can lead to a rapidly growing stack, which may exhaust
    the available memory and cause a program to crash.


    ## How does the execution stack change when a recursive function is called in
    C?


    Option 1: Each function call adds a new stack frame

    Option 2: The stack remains unchanged

    Option 3: The stack shrinks

    Option 4: A new thread is created


    Correct Response: 1.0


    Explanation: In C, when a recursive function is called, each function call adds
    a new stack frame to the execution stack. These stack frames store the local variables
    and return addresses for each function call. This process continues until the
    base case is reached.


    ## In C programming, what is tail recursion?


    Option 1: A recursion that involves a loop

    Option 2: A recursion with a base case at the beginning

    Option 3: A recursion with a base case at the end

    Option 4: A recursion with no base case


    Correct Response: 3.0


    Explanation: Tail recursion in C is a type of recursion where the base case is
    located at the end of the recursive function. This means that the recursive call
    is the last operation in the function, making it more efficient and easier for
    the compiler to optimize.


    ## 1. A function in C returns a value to the calling function using the ________
    keyword.


    Option 1: return

    Option 2: value

    Option 3: result

    Option 4: output


    Correct Response: 1.0


    Explanation: In C, the `return` keyword is used to return a value to the calling
    function. It specifies the value that the function will return.


    ## 2. In C, the initial call to a recursive function is known as the ________.


    Option 1: base case

    Option 2: recursive case

    Option 3: initial call

    Option 4: termination case


    Correct Response: 3.0


    Explanation: The initial call to a recursive function is often referred to as
    the "initial call" because it''s where the recursion begins.


    ## 3. In a recursive function, if the base case is not properly defined, it can
    lead to a ________.


    Option 1: Stack Overflow

    Option 2: Memory Leak

    Option 3: Compilation Error

    Option 4: Infinite Loop


    Correct Response: 1.0


    Explanation: When the base case in a recursive function is not properly defined,
    it can lead to a stack overflow error. A stack overflow occurs when the function
    calls itself indefinitely, filling up the call stack. This results in a runtime
    error.


    ## 4. The ________ of a function includes the function''s name, return type, and
    the types of its parameters.


    Option 1: Declaration

    Option 2: Prototype

    Option 3: Definition

    Option 4: Implementation


    Correct Response: 2.0

