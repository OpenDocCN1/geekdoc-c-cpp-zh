    Explanation: To sort a list of names in alphabetical order, the `strcmp` function
    is useful. It compares two strings and returns a value indicating their relative
    order. `strtok` is used for tokenizing strings, `strchr` searches for a character
    in a string, and `strnlen` provides the length of a string up to a specified limit.


    # Question 3: You are working on a program that processes user input, and you
    want to ensure that the input string does not exceed a certain length to prevent
    buffer overflow. Which string handling function would be appropriate to use?


    Option 1: `strncpy`


    Option 2: `strstr`


    Option 3: `strncat`


    Option 4: `strcpy`


    Correct Response: 1.0


    Explanation: To limit the length of user input and prevent buffer overflow, the
    `strncpy` function is appropriate. It allows you to copy a specified number of
    characters from the input to the destination, ensuring the destination buffer
    does not overflow. `strstr` searches for a substring, `strncat` concatenates strings
    with a specified limit, and `strcpy` copies a string without length control.


    # Why is dynamic memory allocation used when dealing with arrays in C?


    Option 1: To improve performance


    Option 2: To reduce memory usage


    Option 3: To allow flexible array sizes


    Option 4: To simplify array manipulation


    Correct Response: 3.0


    Explanation: Dynamic memory allocation in C allows for the allocation and deallocation
    of memory during program execution, which is essential when the array size is
    not known at compile-time. It provides flexibility in memory usage.


    # What is a key advantage of using a sorted array over an unsorted array?


    Option 1: Faster searching


    Option 2: Lower memory usage


    Option 3: Easier insertion of elements


    Option 4: Random access


    Correct Response: 1.0


    Explanation: A key advantage of a sorted array is faster searching using techniques
    like binary search, which has a logarithmic time complexity.


    # Which searching algorithm is typically the most straightforward to implement?


    Option 1: Linear search


    Option 2: Binary search


    Option 3: Hash table


    Option 4: Jump search


    Correct Response: 1.0


    Explanation: Linear search is the most straightforward searching algorithm as
    it involves a simple step-by-step comparison of elements in the array.


    # What is the time complexity of the linear search algorithm in the worst case?


    Option 1: `O(1)`


    Option 2: `O(n)`


    Option 3: `O(log n)`


    Option 4: `O(n^2)`


    Correct Response: 2.0


    Explanation: The linear search algorithm has a worst-case time complexity of `O(n)`
    because in the worst scenario, it needs to iterate through the entire array to
    find the target element.


    # When using dynamic memory allocation for arrays, which standard library function
    is used to release the memory that was previously reserved?


    Option 1: `malloc`


    Option 2: `calloc`


    Option 3: `free`


    Option 4: `realloc`


    Correct Response: 3.0


    Explanation: The correct function to release dynamically allocated memory is `free`.
    It is used to deallocate the memory previously reserved using `malloc` or `calloc`.


    # What is the time complexity of the bubble sort algorithm in the best case?


    Option 1: `O(n)`


    Option 2: `O(n^2)`


    Option 3: `O(log n)`


    Option 4: `O(1)`


    Correct Response: 1.0


    Explanation: The best-case time complexity of the bubble sort algorithm is `O(n)`
    when the array is already sorted, and no swaps are required during the pass.


    # What is the primary disadvantage of using dynamic memory allocation for arrays
    in C?


    Option 1: Fragmentation


    Option 2: Inefficiency


    Option 3: Limited Size


    Option 4: Slow Access


    Correct Response: 1.0


    Explanation: Dynamic Memory Allocation can lead to memory fragmentation, which
    can waste memory and affect program performance.


    # Which sorting algorithm is most efficient when dealing with small datasets or
    partially sorted data?


    Option 1: Insertion Sort


    Option 2: Bubble Sort


    Option 3: Quick Sort


    Option 4: Merge Sort


    Correct Response: 1.0


    Explanation: Insertion Sort is efficient for small datasets and partially sorted
    data due to its simplicity and low overhead.


    # In the context of searching algorithms, why might a binary search be preferred
    over a linear search?


    Option 1: Binary search is always faster


    Option 2: Binary search works for unsorted data


    Option 3: Binary search guarantees to find the target quickly


    Option 4: Binary search requires sorted data


    Correct Response: 4.0


    Explanation: Binary search is preferred when data is sorted as it allows for efficient
    searching, while a linear search works for unsorted data.


    # 1. The function ________ is used in C to allocate memory for an array of specified
    size dynamically.


    Option 1: `malloc`


    Option 2: `free`


    Option 3: `printf`


    Option 4: `scanf`


    Correct Response: 1.0


    Explanation: In C, the function `malloc` is used to allocate memory for an array
    of specified size dynamically. `malloc` stands for memory allocation.


    # 2. The ________ sorting algorithm repeatedly steps through the list, compares
    adjacent elements and swaps them if they are in the wrong order.


    Option 1: Quick


    Option 2: Bubble


    Option 3: Merge


    Option 4: Binary


    Correct Response: 2.0


    Explanation: The `Bubble` sorting algorithm repeatedly steps through the list,
    comparing adjacent elements, and swapping them if they are in the wrong order.
    It is a simple sorting algorithm but not very efficient.


    # 3. A ________ search works by repeatedly dividing the portion of the array that
    could contain the item until you''ve narrowed down the possible locations to just
    one.


    Option 1: Linear


    Option 2: Binary


    Option 3: Hash


    Option 4: Depth-First


    Correct Response: 2.0


    Explanation: A `Binary` search works by repeatedly dividing the portion of the
    array that could contain the item until you''ve narrowed down the possible locations
    to just one. It''s an efficient search for sorted arrays.


    # The function ________ in C changes the size of the memory block pointed to by
    a given pointer.


    Option 1: `realloc`


    Option 2: `free`


    Option 3: `malloc`


    Option 4: `calloc`


    Correct Response: 1.0


    Explanation: The correct option is `realloc`. The `realloc` function is used to
    change the size of a previously allocated block, making it suitable for resizing
    dynamic arrays.


    # The ________ algorithm is known for its simplicity but is inefficient for large
    datasets.


    Option 1: Bubble Sort


    Option 2: Merge Sort


    Option 3: Quick Sort


    Option 4: Selection Sort


    Correct Response: 1.0


    Explanation: The correct option is `Bubble Sort`. While Bubble Sort is easy to
    understand, it is not efficient for large datasets due to its O(n^2) time complexity.


    # For efficient memory utilization in dynamic arrays, it is important to release
    the allocated memory using the function _________.


    Option 1: `free`


    Option 2: `malloc`


    Option 3: `realloc`


    Option 4: `calloc`


    Correct Response: 1.0


    Explanation: The correct option is `free`. It is essential to use the `free` function
    to release dynamically allocated memory to avoid memory leaks.


    # Q1: You are tasked with developing a program that must search for a specific
    item in a large dataset efficiently. What type of searching algorithm would be
    ideal for this task?


    Option 1: Linear Search


    Option 2: Binary Search


    Option 3: Bubble Sort


    Option 4: Quick Sort


    Correct Response: 2.0


    Explanation: Binary Search is the ideal choice for searching in a large dataset
    as it offers logarithmic time complexity, making it efficient for large datasets.
    Linear Search, Bubble Sort, and Quick Sort are not efficient for this task.

