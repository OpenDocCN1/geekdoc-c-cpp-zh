    - Option 1: `Function pointers`

    - Option 2: `Typecasting pointers`

    - Option 3: `Arrays of pointers`

    - Option 4: `Generic pointers`


    Correct Response: 2.0


    Explanation: Typecasting pointers would allow you to change the data type of a
    pointer to manipulate variables of different data types in a single function.


    # What function is used in C to allocate a block of memory for an array of elements,
    initialize them to zero, and then return a pointer to the memory?


    - Option 1: `malloc`

    - Option 2: `calloc`

    - Option 3: `realloc`

    - Option 4: `alloc`


    Correct Response: 2.0


    Explanation: The `calloc` function in C is used to allocate a block of memory
    for an array of elements, initializes them to zero, and returns a pointer to the
    memory. It is especially useful for dynamic memory allocation.


    # When is it appropriate to use the `free` function in C programming?


    - Option 1: When you are done using dynamically allocated memory

    - Option 2: At the beginning of your program

    - Option 3: After allocating memory using `malloc`

    - Option 4: Whenever you want


    Correct Response: 1.0


    Explanation: The `free` function in C is used to deallocate the dynamically allocated
    memory when you are done using it. It helps prevent memory leaks and frees up
    resources.


    # What is the primary purpose of the `malloc` function in C?


    - Option 1: To allocate memory for a single variable

    - Option 2: To allocate memory for an array of elements and initialize them

    - Option 3: To free memory allocated by `calloc`

    - Option 4: To reallocate memory for an array


    Correct Response: 1.0


    Explanation: The primary purpose of the `malloc` function in C is to allocate
    memory for a single variable. It returns a pointer to the allocated memory, which
    can be used to store data.


    # What is the difference between `malloc` and `calloc` in terms of initialization
    of the allocated memory?


    - Option 1: `Malloc` initializes memory to an undetermined value.

    - Option 2: `Malloc` initializes memory to zero.

    - Option 3: `Calloc` initializes memory to zero.

    - Option 4: `Calloc` initializes memory to an undetermined value.


    Correct Response: 1.0


    Explanation: `malloc` initializes memory to an undetermined value, while `calloc`
    initializes memory to zero. This difference is important when you want to ensure
    that allocated memory is initialized in a specific way.


    # What happens when `realloc` is called with a size parameter of zero?


    - Option 1: It frees the previously allocated memory.

    - Option 2: It returns a null pointer.

    - Option 3: It reallocates the memory with a size of zero.

    - Option 4: It leads to a memory leak.


    Correct Response: 1.0


    Explanation: When `realloc` is called with a size parameter of zero, it frees
    the previously allocated memory and returns a pointer to the freed memory, effectively
    deallocating it.


    # What is the primary cause of memory leaks in a C program?


    - Option 1: Failure to free dynamically allocated memory.

    - Option 2: Excessive memory fragmentation.

    - Option 3: Incorrect use of the `malloc` function.

    - Option 4: Insufficient memory allocation.


    Correct Response: 1.0


    Explanation: The primary cause of memory leaks in a C program is the failure to
    free dynamically allocated memory using functions like `free()`. When you allocate
    memory but don''t deallocate it properly, it leads to memory leaks.


    # What is a potential consequence of not freeing dynamically allocated memory
    in a long-running C program?


    - Option 1: Memory leaks

    - Option 2: Stack overflow

    - Option 3: Buffer overflow

    - Option 4: Null pointer dereference


    Correct Response: 1.0


    Explanation: When dynamically allocated memory isn''t freed, it leads to memory
    leaks. This means that the memory remains allocated and cannot be reclaimed for
    other purposes, which can result in a program consuming more and more memory over
    time.

