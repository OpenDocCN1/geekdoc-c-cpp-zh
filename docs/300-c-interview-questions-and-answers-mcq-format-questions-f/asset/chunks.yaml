    Explanation: When using nested loops, it''s important to consider the potential
    impact on performance. The number of iterations in nested loops can grow exponentially,
    especially if the outer loop iterates `N` times and the inner loop iterates `M`
    times, resulting in `N * M` iterations. This can lead to performance issues, so
    it''s essential to carefully plan and optimize nested loop usage.


