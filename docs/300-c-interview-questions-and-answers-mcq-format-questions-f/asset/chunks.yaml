    Correct Response: 2.0


    Explanation: In C, the function `calloc()` is used to allocate memory for an array
    of elements and initialize them to zero. Unlike `malloc()`, it automatically initializes
    the memory to zero, making it useful for arrays. `realloc()` is used to resize
    memory, and `free()` deallocates memory.


