    # What is the purpose of the ''switch'' statement in C?


    Option 1: To perform iterative loops


    Option 2: To handle exceptions


    Option 3: To provide multiple choices


    Option 4: To enhance code readability


    Correct Response: 3.0


    Explanation: The `switch` statement in C is used to provide multiple choices based
    on the value of an expression. It allows for a concise way to write code when
    there are multiple possible execution paths. Each `case` represents a different
    possible value of the expression, improving code readability and maintainability,
    especially when dealing with menu-driven programs or handling different options.


    # Which operator is used to check if two values are equal?


    Option 1: `==`


    Option 2: `=`


    Option 3: `===`


    Option 4: `!=`


    Correct Response: 1.0


    Explanation: In C, the `==` (double equals) operator is used to check if two values
    are equal. It is a comparison operator, while `=` is an assignment operator. Confusing
    these can lead to unintended consequences, making it crucial to understand their
    distinct purposes in programming.


