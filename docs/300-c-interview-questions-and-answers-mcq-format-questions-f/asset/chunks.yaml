    specific parts of a file during read or write operations.


    # When a file is opened in ________ mode, it is opened for both reading and writing
    in binary format.


    Option 1: `rb+`

    Option 2: `r+b`

    Option 3: `rw`

    Option 4: `binary_rw`


    Correct Response: 2.0


    Explanation: Opening a file in `r+b` mode in C allows for both reading and writing
    operations in binary format. The ''r'' stands for read, and the ''b'' indicates
    binary mode, making it suitable for combined read and write tasks.


    # When working with binary files, the ________ function can be used to read data
    in a structured manner.


    Option 1: `fread()`

    Option 2: `fgets()`

    Option 3: `fgetc()`

    Option 4: `fscanf()`


    Correct Response: 1.0


    Explanation: The correct option is `fread()`. This function is specifically designed
    for reading binary data from a file. It takes parameters like the file pointer,
    size of each element, number of elements, and the destination buffer where the
    data will be stored. This makes it suitable for structured reading of binary files.


    # Using the ________ function, the file pointer can be moved to the end of a file.


    Option 1: `fseek()`

    Option 2: `rewind()`

    Option 3: `ftell()`

    Option 4: `fsetpos()`


    Correct Response: 1.0


    Explanation: The correct option is `fseek()`. This function is used to set the
    file position indicator to a specific position within the file. When the `SEEK_END`
    constant is provided as the reference point, it moves the file pointer to the
    end of the file, allowing operations like appending data.


    # The `fseek` function allows for ________ access of data within a file.


    Option 1: random

    Option 2: direct

    Option 3: sequential

    Option 4: indexed


    Correct Response: 3.0


    Explanation: The correct option is sequential. The `fseek()` function, when used
    with `SEEK_SET`, `SEEK_CUR`, or `SEEK_END`, allows for sequential access to data
    within a file. It enables you to move the file pointer forward or backward, or
    directly to the end of the file, facilitating sequential data access.


    # 1. You are working on an application that requires fast data retrieval times.
    What method of file access would be most suitable?


    Option 1: Sequential File Access

    Option 2: Random Access

    Option 3: Indexed File Access

    Option 4: Direct File Access


    Correct Response: 2.0


    Explanation: For fast data retrieval times, Random Access is the most suitable
    method. Unlike Sequential File Access, which reads data sequentially, and Indexed
    File Access, which uses an index to locate data, Random Access allows direct access
    to any part of the file. This is crucial for applications where quick retrieval
    of specific data is essential, such as databases and real-time systems.


    # 2. In a program that processes large volumes of numerical data, which file format
    would be more efficient in terms of storage space and data retrieval speed?


    Option 1: CSV (Comma-Separated Values)

    Option 2: Binary File Format

    Option 3: XML (eXtensible Markup Language)

    Option 4: JSON (JavaScript Object Notation)


    Correct Response: 2.0


    Explanation: Binary File Format would be more efficient for large volumes of numerical
    data. Unlike plain text formats like CSV, binary formats store data in a more
    compact and direct way, reducing storage space requirements. Additionally, binary
    files allow for faster data retrieval because they can be read directly into memory
    without parsing, making them suitable for applications that prioritize speed and
    efficiency in processing numerical data.


    # 3. You''re developing a database system and need to frequently update records.
    What file handling technique would you use to efficiently update specific records
    without reading the entire file?


    Option 1: Sequential File Updating

    Option 2: Direct File Updating

    Option 3: Indexed File Updating

    Option 4: Random File Updating


    Correct Response: 3.0


    Explanation: Indexed File Updating would be the most efficient technique for frequently
    updating specific records in a database system. With an index, the system can
    quickly locate and update the desired record without the need to read the entire
    file sequentially. This reduces the time and resources required for updates, making
    it a suitable choice for scenarios where frequent record updates are a common
    operation in a database.


    # When reading a file in C, which function can be used to check if the end of
    the file has been reached?


    Option 1: `feof()`

    Option 2: `endOfFile()`

    Option 3: `file_end()`

    Option 4: `fileEOF()`


    Correct Response: 1.0


    Explanation: The correct function is `feof()`, which stands for "file end of file."
    It returns a non-zero value if the end of the file has been reached, indicating
    that there are no more characters to read.


    # How can you redirect error messages in a C program to a file instead of displaying
    them on the console?


    Option 1: `stderr_redirect()`

    Option 2: `errorToFile()`

    Option 3: `file_end()`

    Option 4: `freopen()`


    Correct Response: 4.0


    Explanation: The correct option is `freopen()`. By using `freopen("error.log",
    "w", stderr)`, error messages will be written to the file instead of the console.


    # Which function in C is used to flush the output buffer of a stream?


    Option 1: `flush()`

    Option 2: `fflush()`

    Option 3: `clear()`

    Option 4: `flushout()`


    Correct Response: 2.0


    Explanation: The correct function is `fflush()`. It is used to flush the output
    buffer of a stream, ensuring that any buffered data is written to the file or
    output device. This is particularly useful when you want to ensure that data is
    written without waiting for the buffer to fill up.


    # What is the difference between stderr and stdout in the context of buffering?


    Option 1: stderr is unbuffered, while stdout is line-buffered by default.

    Option 2: stderr is line-buffered, while stdout is unbuffered.

    Option 3: stderr is fully buffered, while stdout is line-buffered.

    Option 4: stderr is fully buffered, while stdout is unbuffered.


    Correct Response: 1.0


    Explanation: The correct option is "stderr is unbuffered, while stdout is line-buffered
    by default." stderr is typically unbuffered, meaning that data is immediately
    written to the output, while stdout is line-buffered, meaning that it is buffered
    until a newline character is encountered.


    # In C, what happens if you attempt to open a file for reading using fopen() but
    the file does not exist?


    Option 1: `fopen()` returns NULL, indicating that the file does not exist.

    Option 2: `fopen()` raises an exception.

    Option 3: `fopen()` creates a new file with the specified name.

    Option 4: `fopen()` prompts the user to enter the correct file name.


    Correct Response: 1.0


    Explanation: The correct option is "fopen() returns NULL, indicating that the
    file does not exist." If the file does not exist or cannot be opened for some
    reason, `fopen()` returns a NULL pointer, indicating an error in opening the file.


    # How can you handle an error when attempting to allocate memory using `malloc()`
    in a C program?


    Option 1: Check if the return value of `malloc()` is `NULL` and handle accordingly.

