  md: 'Another thing very well may find useful going forward is enumerators. These
    allow you to create a sort of “state” statement. Underneath it all, these are
    just integer values, but they allow you to do some easy comparisons going forward,
    which we''ll jump into in the next chapter.


    An enum would be declared like this:


    ```

    enum fruit { apple, banana, lemon, orange, melon };


    fruit fruitOne = apple;

    ```


    It essentially creates a new type that you can use and compare. There are other
    structures for doing exactly this that are for more nuanced but this is a great
    rudimentary way of accomplishing it.


    Now it''s time to talk about the most crucial part of any programming language:
    the math. See, computers were built for one purpose: computing. Anything that
    a computer ever does is resultant of a set of computations that happened somewhere
    within. When you opened this e-book, it was the result of computations within
    the system which allowed you to launch the application, click the e-book, have
    it register when you clicked the e-book, turn pages in that book, and so on.


    Thus, math is crucially important, especially in a language as low-level as C++.
    Most of what you do with C++ will involve math.


    C++ has several different mathematical operators (which, go figure, will come
    in handy for operator overloading later in the book.)'
