  md: "# Chapter 4: Conditions and Loops\n\nNow we're going to talk about a few things\
    \ that will make program far more logical: logic. Loops and conditions start to\
    \ utilize math within your program to give different outcomes.\n\nJust like last\
    \ time, we're going to start this out by creating a new project. Call it Chapter4,\
    \ and then delete the content of main.cpp.\n\nThe first thing we're going to look\
    \ at is conditions. What conditions do is read a statement or set of statements\
    \ and determine if it's true or not, and then act accordingly to the code contained\
    \ therein.\n\nThese comparisons are completed using something called comparison\
    \ operators. The comparison operators in C++ are as follows:\n\n+   - == equal\
    \ to\n- != not equal to\n- < less than\n- <= less or equal to\n- > greater than\n\
    - >= greater than or equal to\n\nTry to decipher what the following code means:\n\
    \n```\nif (card == 4) {\n  cout << \"I drew a four!\\n\";\n}\n```\n\nGot it? This\
    \ is what's called an if statement. It evaluates the statement inside the parentheses,\
    \ and then if that statement is accurate, it will execute the code within. Now,\
    \ what about this one?"
