    \ < grades[i-1]) {\n        placeholder = grades[i];\n        grades[i] = grades[i-1];\n\
    \        grades[i-1] = placeholder;\n        swap = true;\n      }\n    }\n}\n\
    ```\n\nWhat this does is create a variable which determines whether there's a\
