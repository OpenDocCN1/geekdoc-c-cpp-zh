    ```

    cout << "hello world\n" << "how are you today";

    ```


    and


    ```

    cout <<

    "hello world\n"

    <<

    "how are you today";

    ```


    in the exact same manner. That''s not to say there aren''t conventions; there
    are. But this does allow you a certain degree of personal expression.


    Along the same vein, there is no right or wrong way to name a variable (aside
    from a few very wrong ways that won''t compile.) As long as your code compiles,
