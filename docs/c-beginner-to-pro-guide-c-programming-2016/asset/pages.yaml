  md: 'Here’s how we would do such in this case.


    First, in the public section of your cube code, you would act like you were making
    a constructor by declaring the object itself.


    cube


    Then you use the operator keyword and what specify which operator you want to
    override - in this case, the addition operator, followed by parameter parentheses
    and function brackets.


    ```

    cube operator+(cube &add) {

    }

    ```


    Since we’re passing through another object, we need to actually pass in the secondary
    variable''s reference address. What’s happening in this line of code is that you’re
    overriding the addition operator, +, and specifying what happens when the object
    cube is combined with the operator and the object within the parameters. So basically,
    what happens when this instance of cube cube is added to another cube, here called
    add? Within the brackets, we need to specify what’s going on.


    In the brackets, we need to say that cube c’s length is equal to the length of
    the first cube instance (this->) plus the second cube instance defined in the
    function parameters (add).


    ```

    c.length = this->length + add.length;

    ```


    Then we do the same for the width and height.'
