  md: '# Chapter 12: Introduction to Classes


    At the heart of all object-oriented programming lies the notion of classes, objects
    that you create and utilize all throughout your code. This helps with modularity,
    with ease of use, with efficiency, and with higher-level programming that is far
    more logical and coherent.


    In the early iterations of C, there was a primitive sort of class called a struct.
    Structs still exist in C++ but are mainly deprecated and shirked in favor of using
    classes instead. Nevertheless, structs are important to cover. C++ structs are
    also different from C structs. C structs didn''t have much of the functionality
    which C++ structs do.


    Before we jump into that, let''s talk briefly about the notion of access modifiers.


    We''ve talked about things like *int, string, bool, and float*, called types.
    We created what could be considered somewhat of a type using enumerators. However,
    you can actually create an entire type that is made up of smaller pieces of data
    and innate functions. This is called an object.


    Access modifiers describe what is able to change within your code. There are three
    different access modifiers.


    Public access means that the object and/or its internal data and functions can
    be accessed and modified by any other code in the program.


    Protected means that the object and/or its internal data and functions can be
    access and modified by only its derivatives. (This will make sense when we get
    into inheritance and polymorphism.)'
