  md: 'The most basic are the ones you''ve known since grade school:


    +   + is for addition,

    - is for subtraction,

    * is for multiplication,

    / is for division.


    Great, that''s all really simple. Then there are some more complex operators that
    I''m going to describe.


    Firstly, there''s the modulo operator, %. What this operator determines the remainder
    of a given division. For example, 13 % 5 gives you a remainder of 3 because 5
    goes into 13 twice and then you''ve got 3 left. Easy-peasy.


    On top of that, there are incremental shorthand operators.


    +   i++ would mean i = i + 1,

    i-- would mean i = i - 1.


    Then there are self-referential shorthand operators:


    +   i+=5 would mean i = i + 5;

    i-=5 would mean i = i - 5;

    *=5 would mean i = i * 5;

    /=5 would mean i = i / 5.


    All relatively simple. These are the major mathematical operators in C++.


    We''re actually in a very sweet spot right now where you know what you''re doing
    enough that I can take a moment to talk about the structure of C++ programs without
    being entirely lost.


    Everything that happens within C++ takes place within various scopes. You don''t
    know too much about functions yet, but they all have their own scope. Classes
    have their own scope. The main method has its own scope. Everything takes place'
