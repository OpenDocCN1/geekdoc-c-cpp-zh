  md: 'Let me explain what’s going on here.


    This time, we declared the variable apples but didn’t give it a value. We could
    have given it a value, but for the sake of example, I chose not to.


    Then we print out a line which asks the user how many apples they have. cout is
    the standard output method and stands for `console out`.


    Then we allow the user to input data. We type cin, meaning “console in”, and used
    the input stream operator (>>) before the variable that we were reading from the
    user.


    After getting that information, we print it back to the user. The way that cout
    works is that it writes to the console whatever comes through the output stream,
    designated by the output stream operator (<<). When you write something in quotes,
    it’s actually reading it as a string of text which it simply prints to the console.
    Since cout designates an output stream, we can tie things together and print out
    any string or variable in our program.


    But what if we wanted to know about more than just apples? What if there were
    pears? Oranges?


    I’m going to show you how I’d do it if I were going to ask not only how many apples
    someone had, but also how many bananas and lemons.'
