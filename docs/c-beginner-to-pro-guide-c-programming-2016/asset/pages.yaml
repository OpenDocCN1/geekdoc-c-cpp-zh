  md: "# Chapter 8: Pointers\n\nThis was one of the more difficult concepts for me\
    \ to grasp, especially starting out. And it's not necessarily easy to grasp, so\
    \ I'm going to take it slow explaining this because this is actually a huge part\
    \ of C and C++ programming.\n\nWhen you create a variable, it's given a specific\
    \ place in memory. This place in memory is where variable's value is stored. Any\
    \ reference to that variable when it's passed to another function is just a copy\
    \ of that place in memory.\n\nThis is fine when you're just working within one\
    \ function or passing simple arguments to/from, but look at this example.\n\n\
    ```\n#include <iostream>\n\nusing namespace std;\n\nvoid goWest(int xposition,\
    \ int yposition);\n\nint main() {\n    int xposition = 3, yposition = 3;\n\n \
    \   cout << \"Your current position is: \" << xposition << \", \" << yposition\
    \ << \"\\n\";\n    cout << \"Going west!\\n\";\n    goWest(xposition, yposition);\n\
    \    cout << \"But back in the main function, your position is: \" << xposition\
    \ << \", \" << yposition << \"\\n\";\n\n    return 0;\n}\n\nvoid goWest(int xposition,\
    \ int yposition) {\n    xposition--;\n\n    cout << \"In the goWest function,\
    \ your position is: \" << xposition << \", \" << yposition << \"\\n\";\n}\n```"
