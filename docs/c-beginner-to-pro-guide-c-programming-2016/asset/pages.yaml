  md: '# Chapter 3: Variables, Input, and C++ math


    This chapter is going to set you up for the rest of your C++ adventure. Programs
    constantly are using and manipulating data. That''s the sole reason they even
    exist. Variables are pieces of data within your program that can be manipulated.


    C++ is handy at giving you different ways to interpret data. There are different
    forms of data storage, called data types.


    These data types include:


    +   - int - for whole numbers from -2147483648 to 2147483647

    - float - for floating point numbers, i.e. decimals

    - double - for double floating point numbers

    - char - for ASCII characters

    - bool - used for true/false values


    And there are variations of these, which gives you greater control over their
    ranges.


    +   - unsigned int - for unsigned integers (integers which are not negative),
    has twice the positive range of a normal int (from 0 to 4294967295)

    - short int - an int from -32768 to 32768. Takes up less bit space than a normal
    int.


    There''s one more type that doesn''t seem especially important right now will
    definitely have applications where it''s incredibly important. This is called
    a constant. To declare a constant, you put const before the data type of whatever
    variable you''re declaring.'
  merge: -1
