  md: "Just type that into a file and run it. We're going to be fixing this code anyway.\
    \ You'll see what happens is the variable changes in the goWest function, but\
    \ when we return to the main function, the variable is like it before. This is\
    \ because we don't pass the variable directly, but we pass its value, and the\
    \ secondary function makes a copy.\n\nThe way to fix this is with pointers. This\
    \ isn't at all only use, but it's the simplest way to explain them at this level.\
    \ Pointers point to a variable's specific address in memory and allow you to access\
    \ that address and value precisely.\n\nThere are two pointer operators:\n\n+ \
    \  * points to a value of an address\n\n+   - gets the address of a certain variable\n\
    \nThe way that these work is that if you had int x = 3 then &x would point to\
    \ the place in memory that the variable x is stored. Meanwhile, *(&x) would point\
    \ to the value of x, here 3, and allow you to modify that value directly.\n\n\
    This way, you can bypass the built-in variable protection of C++.\n\n```\n#include\
