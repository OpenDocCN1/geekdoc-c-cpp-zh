  md: 'A fantastic example of this kind of modularity would be a game engine. Game
    engines provide for a number of important functions such as graphics, audio, receiving
    input from both keyboard and controller, and doing things with all of that, keeping
    a loop running (called the game loop, interestingly enough,) and helping you with
    multithreading and garbage collection (automatic memory management.)


    Having to recode all of these concepts as you go from project to project would
    be painstaking and nearly impossible. Not to mention that a modular approach allows
    you to break it down when something goes wrong and fix one set of code instead
    of having to fix an entire xoo or xxxx amount of lines.


    With that lesson complete, this book is pretty much brought to a close.'
