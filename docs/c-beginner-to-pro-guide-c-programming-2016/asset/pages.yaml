    There are many preferences when it comes to C++ coding, too, because it''s not
    rigid about the way that you write code. Unlike Python for example, where a certain
    indentation scheme is forced on you, C++ just lets you go and type as you will
    with little to no problem at all. That is to say that whitespace isn''t an issue.


    The system sees:


    ```

    cout<<"hello world\n"<<"how are you today";

