  mdcn: "\n如果我们使用的不是原始数据类型而是一个对象呢？C++ 也支持这种方式，使用一种被称为迭代器（iterators）的东西。通过使用迭代器，你可以访问字符串的方法（例如\
    \ `.length()` 或 `.substr()`）。\n\n例如，如果我们有一个名为 `j` 的字符串向量（vector of strings），并且想要打印每个字符串的长度：\n\
