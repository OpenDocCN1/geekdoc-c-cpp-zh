    #define GRADEBOOK_H\n\n#endif\n```\n\nBetween the #define and #endif directives,\
    \ we're going to create our main namespace “gradebook”. Within this, we're going\
    \ to create two classes: Assignment, and Student.\n\n- The assignment class should\
    \ have a public field with:\n    - a constructor which takes a string for the\
    \ assignment name and a float for the grade point\n- It should have a private\
    \ field with:\n    - a string: assignmentName\n    - a float: grade\n\n- Student\
    \ should have a public field with:\n    - a constructor which takes a string for\
    \ the student name\n    - a function which adds an assignment to a vector of assignments,\
    \ which takes said assignment as an argument\n    - a function which returns the\
    \ student's name\n- and a private field with:\n    - a vector<Assignment> called\
    \ grades\n    - a string for the student's name\n\n## Your code should look a\
    \ bit like this:\n\n```cpp\n#include <vector>\n#include <string>\n\n#ifndef GRADEBOOK_H\n\
    #define GRADEBOOK_H\n\nusing std::vector;\nusing std::string;\n\nnamespace gradebook\
    \ {\n    class Assignment {\n    public:\n        Assignment(std::string name,\
