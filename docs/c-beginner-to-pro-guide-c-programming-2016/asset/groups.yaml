- md: "\nFor this chapter and the next, we’re going to be talking a lot [about] animals,\
    \ using them as an explanation for concepts because the hierarchy of the animal\
    \ kingdom fits the the concepts underlying classes and object-oriented programming\
    \ pretty perfectly.\n\nLet’s go ahead and replace that struct with a class, because\
    \ we’re going to be using classes going forward as they’re generally a safer and\
    \ better option than structs are.\n\nCreate a new project in CodeBlocks called\
    \ “AnimalSimulator”. Not the most creative title, but it’ll absolutely work for\
    \ what we've got to do. Redact the contents of main.cpp and import iostream and\
    \ create your main method.\n\nAbove the main method, let’s declare a class called\
    \ Animal. You would do that very similarly to how you’d declare a struct. For\
    \ the sake of illustration, make it look like this:\n\n```cpp\nclass animal {\n\
    \  string name;\n};\n```\n\nThen within your main method, declare an instance\
    \ and set its instance of name to the name of your favorite animal. Afterward,\
    \ try to build.\n\nYou should have gotten an error that said “error: string animal::name\
    \ is private”.\n\nPerfect. This is absolutely supposed to happen, because now\
    \ we have to fix this. This is where that whole notion of access description comes\
    \ in.\n\nModify your class so that it looks like this:\n\n```cpp\nclass animal\
    \ {\n  public:\n    string name;\n}\n```\n\nThen try to build. It should work\
    \ fine this time. That’s because we made the string \"name\" public, which means\
    \ other methods/functions outside of the class itself can access it.\n\nThis is\
    \ generally considered bad practice though, so we’re going to rewrite the class\
    \ like so:\n\n```cpp\nclass animal {\n    private:\n        string name;\n}\n\
    ```\n\nThe best-practice way to modify values within a class is to use get/set\
    \ methods. Here’s the way the class would look if you implemented get/set methods.\n\
    \n```cpp\nclass animal {\n    private:\n        string name;\n\n    public:\n\
    \        string getName() {\n            return this->name;\n        }\n\n   \
    \     void setName(string name) {\n            this->name = name;\n        }\n\
    }\n```\n\nNow, in your main method, after declaring whatever animal it is, instead\
    \ of directly modifying its name, you should instead use the get/set method like\
    \ so (assuming your instance animal is called \"dog\"):\n\n```cpp\ndog.setName(\"\
    dog\");\n```\n\nThen you can test this by printing out the name in your main method:\n\
    \n```cpp\ncout << \"The name of my favorite animal is: \" << dog.getName() <<\
    \ \"\\n\";\n```\n\nThe way these work is by returning or setting the value of\
    \ the variable via a method within the class. \"this->\" is called the pointer,\
    \ and it refers to the variable of a given instance of a class. Every object has\
    \ access to its own variables and can modify them directly via the 'this pointer'.\n\
    \nAnyway, your code should work stunningly. But what if you don't want to go through\
    \ get/set for every instance of every class? Well, you use what's called an initializer\
    \ function.\n\nModify your class so it looks like this:\n\n```cpp\nclass animal\
    \ {\n  private:\n    string name;\n\n  public:\n    animal(string name) {\n  \
    \      this->name = name;\n    }\n\n    string getName() {\n        return this->name;\n\
    \    }\n\n    void setName(string name) {\n        this->name = name;\n    }\n\
    }\n```\n\nNow, in your main function, take out the chunk of code that says animal\
