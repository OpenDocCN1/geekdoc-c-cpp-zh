    }\n#endif\n```\n\nWe're done with the header for right now.\n\nGo to file -> new\
    \ -> empty file and name it load.cpp.\n\nWithin this file, include iostream, vector,\
    \ and your header \"gradebook.h\".\n\nYou're going to be using std::vector, and\
