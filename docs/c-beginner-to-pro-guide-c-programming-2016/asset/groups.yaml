    \ else during compilation. For example:\n\n```cpp\n#define INCH_PER_FOOT 12\n\n\
    int main() {\n    cout << \"In 7 feet, there are \" << 7 / INCH_PER_FOOT << \"\
    \ inches.\\n\";\n}\n```\n\nIt can also be used with ternary expressions to describe\
