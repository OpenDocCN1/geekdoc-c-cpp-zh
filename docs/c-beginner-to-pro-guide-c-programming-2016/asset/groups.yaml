    # Chapter 10: STL/C++ Standard Library: Containers, Algorithms, Iterators


    A common misnomer is to refer to the C++ Standard Library as the STL. The STL,
    or Standard Template Library, was a standard developed sometime in the past. The
    C++ Standard Library is a set of templates, many of which were adopted from the
    STL. The STL is now deprecated, but some extremely useful templates remain.


    Earlier, when we were creating arrays, you may have noticed one massive issue
    with them: you can''t expand them. They have a set size and don''t grow or shrink.
    What if there were a way to fix this?


    The Standard Library offers a solution to this problem in the form of containers.
    Containers manage sets of data of the same type. They include vectors, sets, and
    lists, among others.


    Vectors are much like like arrays, except they handle their own storage and size.


    Much like with strings, you need to import the vector library in order to use
    the template:


    ```

    #include <vector>

    ```


    Now you''re able to access everything regarding vectors.


    You declare a template like so:


    ```

    template<type> variableName;

    ```


    Let''s say we wanted to go back to the earlier example of grades, creating a self-sizing
    array of grades. We''d declare it like this:'
