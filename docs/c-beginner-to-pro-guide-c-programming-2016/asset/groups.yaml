    # Chapter 2: Getting Set Up / Your First Program


    Since this is a beginner’s guide, I''m going to give you pretty straightforward
    instructions to getting up ASAP so that you can get to work. At the same time,
    though, I''m going to try to explain exactly what''s going into what you''re downloading.


    Two big components of getting started with C++ for a beginner are an IDE and a
    compiler. An IDE, or **integrated development environment**, is an environment
    in which you write code which allows you to run and debug your program as well
    as perform other functions depending on which IDE you use. A **compiler** is what
    translates what you write into code that the machine can read and understand.
    Often, the IDE will come bundled with a compiler. It''s not absolutely necessary
    that you have an IDE - you theoretically can write the code in a text editor,
    as .cpp and then compile. However, I don''t recommend this, especially not as
    a beginner to C++ and potentially programming in general.


    For this book, I recommend that you get an IDE called CodeBlocks. It can be found
    at codeblocks.org. You go to the downloads page and then click the link titled
    “download the binary release”. If you''re running Windows, download the file named
    “codeblocks-[VERSION]mingw-setup.exe”. If you''re running Linux, select the version
    appropriate for your distribution.


    Once you have CodeBlocks installed, you''re going to launch it. After launching
    it, you''re going to most likely have a first-time dialog that asks which compiler
    you''d like to use, with MinGW/GCC selected by default. Just press “ok”.'
