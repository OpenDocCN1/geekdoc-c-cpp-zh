    \ {\n    public:\n    smallDog() {\n        this->name = \"small dog\";\n    }\n\
    };\n```\n\nNow if, in our main function, we create an instance of smallDog called\
    \ sd, and try to declare bark after dog barks, we'll have two barks on the screen.\
    \ But you're right - small dogs don't bark. How do we go about fixing this?\n\n\
    This is where something called function overriding comes into play.\n\nTo override\
    \ a function, you only need to rewrite it (unless it's a virtual function, in\
    \ which case it needs the override specifier.)\n\nIn class smallDog:\n\n```\n\
    void bark() {\n    cout << \"\\nYip!\\n\";\n}\n```\n\nNow, in your code, sd.bark()\
    \ should produce \"yip\" while d.bark() produces \"bark\". This is the essential\
    \ nature of function overriding in C++.\n\nFunction overriding is an integral\
    \ part of the object-oriented concept known as \"polymorphism\". What this means\
    \ is that things can have different meanings depending upon the context. Inheritance\
    \ and polymorphism are two key concepts of object-oriented programming.\n\nAnother\
    \ important concept is the idea of abstraction. Abstraction is the idea of keeping\
    \ the user-level side of programming as error-free and easy to maintain as possible,\
    \ often by providing functions for performing certain actions upon variables that\
    \ are protected by the classes themselves from user-level access which could inadvertently\
    \ cause harm to the overall program.\n\nOne more important object-oriented concept\
    \ is the idea of encapsulation, which is a mechanism of putting data and functions\
    \ which they use together. Classes innately offer encapsulation. Encapsulation\
    \ and abstraction go hand in hand by hiding data that could potentially cause\
    \ an error, instead offering methods by which to access, utilize, and manipulate\
    \ the data.\n\nAnyway, getting off of the broader concepts, it's very important\
    \ to cover the topic of virtual functions.\n\nIt's a little difficult to explain\
    \ why virtual functions are important, but I'm going to try, because they very\
    \ much are.\n\nThe simplest way to explain it is this: let's say you've got two\
    \ classes, a base class and a derived class. We can go back to the example of\
    \ animals/dogs. Animals would eat generic food, while dogs would eat - of course\
    \ - dog food.\n\nIf they both had a function \"isEating()\" which would output\
    \ what they were eating, the animal object would output \"generic food\" while\
    \ the dog object would output \"dog food\". This is fine and all for the purpose\
    \ of a main function, but it falls apart if they have to go through an intermediate\
    \ function.\n\nFor example, if in the main function, there were a reference to\
    \ another function called \"makeAnimalsEat(animal &a)\", and the referenced animal\
    \ were to call .isEating(), then all objects derived from the animal class would\
    \ use the animal version of the function isEating and not their own overridden\
    \ versions.\n\nAt first glance, a solution appears to overload the makeAnimalsEat(animal\
    \ &a) function with another function that accepts specifically the derivative\
    \ class dog, such as makeAnimalsEat(dog &d). But think about this a little further\
    \ - there are a lot of animals in the world. A whole, whole lot. Are we really\
    \ going to overload this same exact function repeatedly in order to make it work\
    \ for every possible derivative of the animal class? Of course not, that's absurd.\n\
    \nThe answer instead is to make the base class's isEating() function a virtual\
    \ function, like so:\n\n```\nvirtual void isEating() {\n    cout << \"generic\
    \ food\";\n}\n```\n\nTo override this function in derived classes, you type the\
    \ override keyword after the function name, like this:\n\n```\nvoid isEating()\
    \ override {\n    cout << \"dog food\";\n}\n```\n\nwhich would effectively solve\
    \ the problem that had existed in the first place.\n\nThe last major concept of\
    \ classes to cover (at least for this book) is the notion of operator overloading.\
    \ There's a very simple way to describe this.\n\nThink about if you had two integers\
    \ a, 5, and b, 3. The equation:\n\n```\na + b\n```\n\nwould thus come out to 8.\
    \ Right? This is because they have explicit values.\n\nHowever, what if we had\
    \ two members of a class called cube, and this class had length, height, and width\
    \ as its properties.\n\nIf you had two cube objects named a and b and then tried\
    \ to add them, there's no innate meaning to it. The compiler doesn't know how\
    \ or in what way to add these two objects.\n\nCreate a new project called operatorOverloading\
    \ main.\n\n```cpp\nclass cube {\npublic:\n    int getV() {\n        return length\
    \ * width * height;\n    }\n\n    void setL() {\n    }\n\n    void setW() {\n\
    \    }\n\n    void setH() {\n    }\n\n    cube() {\n        length = 0;\n    \
    \    width = 0;\n        height = 0;\n    }\n\n    cube(int length, int width,\
    \ int height) {\n        this->length = length;\n        this->width = width;\n\
    \        this->height = height;\n    }\n\nprivate:\n    int length, width, height;\n\
    };\n```\n\nSo with that done, we now need to look at how we could add two cube\
    \ objects. Fortunately, you can actually overload the existing operators in C++\
    \ to give them new functions.\n\nHere’s how we would do such in this case. First,\
    \ in the public section of your cube code, you would act like you were making\
    \ a constructor by declaring the object itself.\n\ncube\n\nThen you use the operator\
    \ keyword and specify which operator you want to override - in this case, the\
    \ addition operator, followed by parameter parentheses and function brackets.\n\
    \n```\ncube operator+(cube &add) {\n}\n```\n\nSince we’re passing through another\
    \ object, we need to actually pass in the secondary variable's reference. What’s\
    \ happening in this line of code is that you’re overriding the addition operator,\
    \ +, and specifying what happens when the object cube is combined with the object\
    \ within the parameters. So basically, what happens when this instance of cube\
    \ is added to another cube, here called add? Within the brackets, we need to specify\
    \ what’s going on.\n\nIn the brackets, we need to say that cube c’s length is\
    \ equal to the length of the first cube instance (this->) plus the second cube\
    \ instance defined in the function parameters (add).\n\n```\nc.length = this->length\
    \ + add.length;\n```\n\nThen we do the same for the width and height.\n\nBy the\
    \ end, your code should ideally look something along these lines:\n\n```\ncube\
    \ operator+(cube &add) {\n    cube c;\n    c.length = this->length + add.length;\n\
    \    c.width = this->width + add.width;\n    c.height = this->height + add.height;\n\
    \    return c;\n}\n```\n\nIf you wanted your code to be extra secure, you could\
    \ actually make the variable within the parameters a constant.\n\n```cpp\ncube\
    \ operator+(const cube &add) {\n```\n\nNow we’re going to talk about splitting\
    \ your code up to make it incredibly readable and easier to use.\n"
  mdcn: "\n现在回到你的 `main` 方法并声明一个 `dog` 实例。为了 sake起见，我的实例命名为“d”。之后，创建一个 `animal` 类的实例。\n\
    \n尝试从这两个实例中调用 `bark()`。\n\n```\nint main() {\n    dog d;\n    animal a;\n\n  \
    \  d.bark();\n    a.bark();\n}\n```\n\n如果你尝试编译，你应该会得到一个错误：“'class animal’ 没有名为‘bark’的成员”。太棒了！这正是预期发生的情况。因为\
    \ `dog` 是 `animal` 的派生类，你可以在其中定义 `dog` 可以使用但泛义定义的 `animal` 无法使用的函数——例如，汪叫。\n\n\
    删除 `a.bark()`，然后编译并运行。它应该运行得完美。\n\n但等等！我知道你在想什么。“狗也有不同的类型。而且，并不是每只狗都会汪叫，小狗会吱吱叫，天才。”我很清楚。别担心——我们也可以从派生类派生派生类！\n\
    \n在你的 `dog` 类下面，添加一个名为“smallDog”的类，它继承自 `dog`。\n\n```\nclass smallDog : public\
    \ dog {\n    public:\n    smallDog() {\n        this->name = \"small dog\";\n\
    \    }\n};\n```\n\n现在，如果我们在 `main` 函数中创建一个名为 `sd` 的 `smallDog` 实例，并尝试在 `dog` 汪叫后声明\
    \ `bark`，屏幕上将出现两次汪叫。但你是对的——小狗不汪叫。我们该如何修复这个问题？\n\n这就是所谓的“函数重写”（function overriding）发挥作用的地方。\n\
    \n要重写一个函数，你只需要重写它（除非它是虚函数，在这种情况下需要 `override` 饰符）。\n\n在 `smallDog` 类中：\n\n```\n\
    void bark() {\n    cout << \"\\nYip!\\n\";\n}\n```\n\n现在，在你的代码中，`sd.bark()` 应该产生“yip”，而\
    \ `d.bark()` 产生“bark”。这就是 C++ 中函数重写的本质。\n\n函数重写是面向对象概念中被称为“多态”（polymorphism）的不可或缺的一部分。这意味着事物根据上下文具有不同的含义。继承和多态是面向对象编程的两个核心概念。\n\
    \n另一个重要的概念是“抽象”（abstraction）。抽象的思想是让编程的用户级尽可能保持无错误且易于维护，通常通过提供函数对变量执行某些操作，而这些变量受类本身的保护，免受用户级访问，这种访问可能会无意中损坏整个程序。\n\
    \n另一个重要的面向对象概念是“封装”（encapsulation），它是将数据和它们使用的函数放在一起的一种机制。类天生提供了封装。封装和抽象相辅相成，通过隐藏可能导致错误的数据，转而提供访问、利用和操作这些数据的方法。\n\
    \n总之，撇开这些宽泛的概念，涵盖“虚函数”（virtual functions）这一主题非常重要。\n\n解释为什么虚函数很重要有一点困难，但我打算尝试，因为它们确实非常重要。\n\
    \n最简单的解释方法是：假设你有两个类，一个基类和一个派生类。我们可以回到动物/狗的例子。动物吃普通食物，而狗吃——当然了——狗狗料。\n\n如果它们都有一个名为\
    \ `isEating()` 的函数来输出它们在吃什么，那么 `animal` 对象将输出“generic food”，而 `dog` 对象将输出“dog\
    \ food”。这对于 `main` 函数来说完全没问题，但如果它们必须通过一个中间函数，情况就变了。\n\n例如，如果在 `main` 函数中，有一个指向另一个名为\
    \ `makeAnimalsEat(animal &a)` 的函数的引用，而引用的动物调用了 `.isEating()`，那么所有派生自 `animal`\
    \ 类的对象都将使用 `animal` 版本的 `isEating` 函数，而不是它们自己的重写版本。\n\n乍一看，解决方案似乎是用另一个专门接受派生类\
    \ `dog` 的函数来重载 `makeAnimalsEat(animal &a)` 函数，例如 `makeAnimalsEat(dog &d)`。但进一步思考一下——世界上有很多动物。非常多。我们真的要为了让\
    \ `animal` 类的每一个可能的派生类而重复重载同一个同一个函数吗？当然不，那太荒唐了。\n\n答案是将基类的 `isEating()` 函数变为虚函数，如下所示：\n\
    \n```\nvirtual void isEating() {\n    cout << \"generic food\";\n}\n```\n\n要在派生类中重写此函数，你需要在函数名后输入\
    \ `override` 关键字，如下：\n\n```\nvoid isEating() override {\n    cout << \"dog food\"\
    ;\n}\n```\n\n这实际上有效地解决了最初存在的问题。\n\n要涵盖的关于类的最后一个主要概念（至少对于这本书而言）是“运算符重载”（operator\
    \ overloading）的概念。有一种非常简单的方法来描述它。\n\n想想如果你有两个整数 `a, 5` 和 `b, 3`。方程：\n\n```\na\
    \ + b\n```\n\n因此将得到 8。这是因为我们有一个名为 `cube` 的类，它包含了 `length`、`width` 和 `height` 属性。但是，如果我们有两个\
    \ `cube` 对象名为 `a` 和 `b`，并尝试将它们相加呢？`cube` 类包含了 `length`、`width` 和 `height`。\n\n\
    总之，在完成这些之后，我们现在需要查看如何添加两个 `cube` 对象。幸运的是，你实际上可以在 C++ 中重载现有的运算符来赋予它们新的功能。\n\n这就是我们在这种情况下这样做。首先，在\
    \ `cube` 代码的公共部分，你将像创建构造函数一样声明对象本身。\n\n然后你可以重载运算符。\n\n```cpp\nclass cube {\npublic:\n\
    \    int getV() {\n        return length * height;\n    }\n\n    void setL() {\n\
    \    }\n\n    void setW() {\n    }\n\n    void setH() {\n    }\n\n    cube() {\n\
    \        length = 0;\n        width = 0;\n        height = 0;\n    }\n\n    cube(int\
    \ length, int width, int height) {\n        this->length = length;\n        this->width\
    \ = width;\n        this->height = height;\n    }\n\nprivate:\n    int length,\
    \ width, height;\n};\n```\n\n所以，完成这些之后，我们现在需要查看如何添加两个 `cube` 对象。在花括号中，我们需要指定正在发生什么。\n\
    \n你的代码理想情况下应该如下：\n\n```\ncube operator+(cube &add) {\n    cube c;\n    c.length\
    \ = this->length + add.length;\n    c.width = this->width + add.width;\n    c.height\
    \ = this->height + add.height;\n    return c;\n}\n```\n\n如果你想让你的代码更加安全，实际上可以让参数中的变量成为常量。\n\
    \n```cpp\ncube operator+(const cube &add) {\n```\n\n现在我们将讨论如何拆分你的代码以使其极其易读且易于使用。\n"
