- md: "\n# Chapter 14: Modularity in C++ via Namespaces and Headers/Preprocessor Directives/Other\
    \ .cpp Files\n\nModularity is the property of something being broken down into\
    \ crucial parts. We're just going to jump straight into this lesson and avoid\
    \ any time-wasting here.\n\nOccasionally, in C++, you'll run into a conflict where\
    \ you have two imported modules or two classes that share a name. Namespaces help\
    \ you to avoid this problem.\n\nNamespaces are generally defined like so:\n\n\
    ```cpp\nnamespace gradebook {\n    class Student {\n        // code here\n   \
    \ public:\n        void addAssignment(const Assignment &a) {\n            // add\
    \ assignment to vector\n        }\n\n    class Assignment {\n        // code here\n\
    \    }\n\n    void listStudents() {\n        // code here\n    }\n}\n```\n\nIn\
    \ order to access these classes from elsewhere in your code, you'd have to do\
    \ something along the lines of:\n\n```cpp\nint main() {\n    gradebook::Student\
    \ student;\n    gradebook::Assignment assignment;\n\n    student.addAssignment(assignment);\n\
    \n    gradebook::listStudents();\n\n}\n```\n\nwith \"gradebook:\" being the way\
    \ to access members of the gradebook namespace. You can, however, circumvent this\
    \ by adding \"using namespace gradebook\" to your code, preferably below \"using\
    \ namespace std\". While we're at it, you don't even necessarily have to include\
    \ \"using namespace std\" in your code. Since it is a namespace, you can technically\
    \ access everything within it by using the namespace directive:\n\n```cpp\nstd::string\
    \ out= \"Hello world\";\nstd::cout << out;\n```\n\nOften, namespaces will be defined\
    \ within header files. This helps the idea of modularity by promoting the idea\
    \ of using existing modules and creating new ones that make code quicker to use\
    \ in the future.\n\nHeader files are files which contain large chunks of code\
    \ definitions that can be used in other code. For example, a header file could\
    \ technically have an add function which took two variables and returned the sum.\
    \ You could include this header file in your main.cpp and then have access to\
    \ said function.\n\nIn order to create a header file, you have to define it with\
