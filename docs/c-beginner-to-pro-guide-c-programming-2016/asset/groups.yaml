  mdcn: "\n\n# 第14章：通过命名空间和头文件/预处理器指令/其他 .cpp 文件实现C++模块化\n\n模块化是将事物拆分为关键部分的属性。我们将直接进入本节，避免在这里浪费时间。\n\
    \n在 C++ 中，你有时会遇到冲突，即有两个导入的模块或两个同名的类。命名空间（Namespaces）可以帮助你避免这个问题。\n\n命名空间通常定义如下：\n\
    \n```cpp\nnamespace gradebook {\n    class Student {\n        // 代码在此\n    public:\n\
    \        void addAssignment(const Assignment &a) {\n            // 将作业添加到 vector\
    \ 中\n        }\n\n    class Assignment {\n        // 代码在此\n    }\n\n    void listStudents()\
    \ {\n        // 代码在此\n    }\n}\n```\n\n为了从你代码的其他地方访问这些类，你需要执行类似下面的操作：\n\n```cpp\n\
    int main() {\n    gradebook::Student student;\n    gradebook::Assignment assignment;\n\
    \n    student.addAssignment(assignment);\n\n    gradebook::listStudents();\n\n\
    }\n```\n\n其中 \"gradebook:\" 是访问 gradebook 命名空间成员的方法。不过，你也可以通过代码中添加 \"using namespace\
    \ gradebook\" 来绕过这一点，最好放在 \"using namespace std\" 之下。既然提了这里，你并不非要在代码中包含 \"using\
    \ namespace std\"。由于它是命名空间，你技术上可以使用命名空间指令来访问其中的所有内容：\n\n```cpp\nstd::string out=\
    \ \"Hello world\";\nstd::cout << out;\n```\n\n通常，命名空间会定义在头文件中。这通过促进使用现有模块和创建新模块来使代码在未来更容易使用，从而了模块化的理念。\n\
    \n头文件是包含大段代码定义的文件，这些定义可以在其他代码中使用。例如，一个头文件技术上可以有一个接受两个变量并返回和的 add 函数。你可以将此头文件包含在\
    \ main.cpp 中，然后访问该函数。\n\n为了创建一个头文件，你必须使用所谓的“预处理器指令”（preprocessor directives）来定义它。\n\
    \n现在是深入了解预处理器指令究竟是什么的最佳时候了。\n\n所有的 C++ 代码都必须编译。预处理器指令告诉预处理器在编译之前查看代码，然后执行某些操作以以某种方式影响代码或程序。\n\
    \n预处理器指令有几种不同的类型。\n\n首先是宏定义，例如 #define 和 #undef。这些允许你定义文本中使用的内容并在编译期间将其替换为其他内容。例如：\n\
    \n```cpp\n#define INCH_PER_FOOT 12\n\nint main() {\n    cout << \"In 7 feet, there\
    \ are \" << 7 / INCH_PER_FOOT << \" inches.\\n\";\n}\n```\n\n它也可以与三元表达式一起使用来描述函数宏。\n\
    \n其他的是条件运算符。#ifdef、#elif 等。\n\n为了向你展示头文件和额外 CPP 文件的用途，我们实际上将开始一个新项目，我们将这个项目命名为\
    \ Gradebook。信不信由！\n\n这次我们将保留 main.cpp，你已经有足够的练习了。只需删掉 hello world 部分即可。\n\n由于这是我们第一次在一个项目中使用多个文件，我将尽量让它看起来自明易懂。这将把我们目前为止使用的许多概念结合起来，在我们的主文件中产生一些非常漂亮且易于使用的代码，同时教你关于模块化的知识。\n\
    \nC++ 项目通常分为两个部分：接口（头文件）和它们的实现（C++ 文件）。接口旨在是可重用和扩展的。为了这个项目，我们将创建一个成绩单，在头文件的命名空间内存储我们的类数据，将重要函数存储在其他\
    \ C++ 文件中，并使用\n\n无论如何，现在你去“文件 -> 新建 -> 空文件”。创建一个名为“gradebook.h”的文件。我们需要向预处理器抛出一些指令，所以这是我们要做的：\n\
    \n```cpp\n#ifndef GRADEBOOK_H\n#define GRADEBOOK_H\n\n#endif\n```\n\n在 #define\
    \ 和 #endif 指令之间，我们将创建主命名空间“gradebook”。在其中，我们将创建两个类：Assignment 和 Student。\n\n-\
    \ assignment 类应该有一个公共字段，包含：\n    - 一个构造函数，接收一个用于作业名称的字符串和一个用于分数的浮点数\n- 它应该有一个私有字段，包含：\n\
    \    - 一个字符串：assignmentName\n    - 一个浮点数：grade\n\n- Student 类应该有一个公共字段，包含：\n \
    \   - 一个接收学生名称字符串的构造函数\n    - 一个将作业添加到作业 vector 中的中的函数，该函数接受该作业作为参数\n    - 一个返回学生名称的函数\n\
    - 以及一个私有字段，包含：\n    - 一个名为 grades 的 vector<Assignment>\n    - 一个学生名称的字符串\n\n##\
    \ 你的代码看起来应该是这样的：\n\n```cpp\n#include <vector>\n#include <string>\n\n#ifndef GRADEBOOK_H\n\
    #define GRADEBOOK_H\n\nusing std::vector;\nusing std::string;\n\nnamespace gradebook\
    \ {\n    class Assignment {\n    public:\n        Assignment(std::string name,\
    \ float grade) {\n            this->assignmentName = name;\n            this->grade\
    \ = grade;\n        }\n    private:\n        std::string assignmentName;\n   \
    \     float grade;\n    };\n\n    class Student {\n    public:\n        Student(std::string\
    \ name) {\n            this->name = name;\n        }\n        void addGrade(Assignment\
    \ &assignment) {\n            this->grades.push_back(assignment);\n        }\n\
    \        string getName() {\n            return this->name;\n        }\n    private:\n\
    \        std::vector<Assignment> grades;\n        std::string name;\n    };\n\
    }\n#endif\n```\n\n头文件现在写完成了。\n\n去“文件 -> 新建 -> 空文件”并将其命名为 load.cpp。\n\n在此文件中，包含\
    \ iostream, vector 和你的头文件 \"gradebook.h\"。\n\n你将使用 std::vector 和我们创建的命名空间中的 Student\
    \ 类。通过输入 using gradebook::student 告诉编译器你正在使用。\n\n在这里，我们想创建一个返回空内容的函数。将其命名为 loadStudents，让它接受一个学生\
    \ vector 作为参数。这里的想法是我们将从 main 发送一个 vector 并用学生填充它。\n\n使用 vector<student>.push_back(Student())\
    \ 来填充它。\n\n然而，如果我们想从文件读取学生而不是硬编码呢？\n\n这就是我们的重载课程派上用场的地方。让我们创建一个名为 loadStudents\
    \ 的第二个函数，它接收学生 vector 以及名为 filename 的字符串。在文件顶部包含 fstream，并在你的 load 文件中两个变量：一个\
    \ std::ifstream 变量和一个 std::string 变量。\n\n打开文件，并将 filename 作为文件名。当还有行需要读取时，使用 vector<student>.push_back(Student())\
    \ 将学生读入 vector 中。它看起来应该是这样的：\n\n```cpp\nvoid loadStudents(vector<Student> &vec,\
    \ std::string &filename) {\n    std::ifstream file;\n    std::string input;\n\
    \    file.open(filename);\n    while(getline(file, input))\n        vec.push_back(Student(input));\n\
    \    file.close();\n}\n```\n\n搞定！我们现在有两个适用的 loadStudents 函数。\n\n但等一下，我们还没有在主函数中使用它们。\n\
    \n你看，问题在于当你使用来自源文件的函数时，必须执行某种所谓的“前向声明”。\n\n有两种方法可以实现：\n\n1. 在 main.cpp 文件的开头声明，在\
    \ using 语句之后，主函数之前。\n2. 在你的头文件中声明它。\n\n我们将采用后者，因为它整洁得多。\n\n所以我们进入头文件，在我们 gradebook\
    \ 命名空间之后就是声明这些函数的地方。\n\n```cpp\nvoid loadStudent(vector<gradebook::Student> &vec);\n\
    loadStudent(vector<gradebook::Student> &vec, std::string &filename);\n```\n\n\
    现在我们可以回到主文件，确保一切都按预期工作。\n\n首先，创建一个名为 studentList 的新学生 vector。\n\n调用 loadStudents\
    \ 函数，将你创建的 vector 作为参数传递给它。\n\n"
