    # Chapter 1: Introduction


    C++ is a monolith. It''s one of the most widely used programming languages of
    all time. Though in modernity, it has slightly fallen to the wayside in popular
    programming due to the prevalence of scripting languages such as Python, Ruby,
    and Perl, and more esoteric and more natural languages such as Java and C#, C++
    is still one of the seminal languages for low-level programming. Any time you''ve
    got to do something that requires direct access to the hardware and fast, efficient
    execution, you should consider C++ as your primary option.


    Additionally, since it''s so ubiquitous, C++ is an essential language to learn
    because, as a programmer, you very well could end up maintaining legacy code written
    in C++.


    In other words, C++ is no question a necessity for anybody wishing to seek a serious
    career in programming.


    On top of that, C++ can be a very useful language for hobbyists, too. Many open-source
    video games are written partially or completely in C++, such as OpenTTD. Arduino
    circuits are coded in C/C++, as are Raspberry Pi units.


    If for no other reason, you should learn C++ due to the simple fact that it''s
    incredibly powerful. C++ will allow you to do almost anything a language *could*
    allow you to do, while also being super functional and readable. It bridges the
    gap between lower-level more esoteric languages like C and higher level languages
    like Java and Python.'
