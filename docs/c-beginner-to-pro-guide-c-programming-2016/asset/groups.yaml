    \ 96\n\n# Introduction\n\nCongratulations on choosing C++: Beginner to Pro Guide\
    \ and thank you for doing so.\n\nThe following chapters will discuss the many\
    \ concepts of C++ and get you on the path to becoming a master of the language.\
    \ We're going to cover many, many facets of the language, and by the end, you're\
    \ going to feel very comfortable programming in it.\n\nThere are plenty of books\
    \ on this subject on the market, thanks again for choosing this one! Every effort\
    \ was made to ensure it is full of as much useful and practical information as\
    \ possible to give you an amazing learning experience, please enjoy!\n\n# Chapter\
    \ 1: Introduction\n\nC++ is a monolith. It's one of the most widely used programming\
    \ languages of all time. Though in modernity, it has slightly fallen to the wayside\
    \ in popular programming due to the prevalence of scripting languages such as\
    \ Python, Ruby, and Perl, and more esoteric and more natural languages such as\
    \ Java and C#, C++ is still one of the seminal languages for low-level programming.\
    \ Any time you've got to do something that requires direct access to the hardware\
    \ and fast, efficient execution, you should consider C++ as your primary option.\n\
    \nAdditionally, since it's so ubiquitous, C++ is an essential language to learn\
    \ because, as a programmer, you very well could end up maintaining legacy code\
    \ written in C++.\n\nIn other words, C++ is no question a necessity for anybody\
    \ wishing to seek a serious career in programming.\n\nOn top of that, C++ can\
    \ be a very useful language for hobbyists, too. Many open-source video games are\
    \ written partially or completely in C++, such as OpenTTD. Arduino circuits are\
    \ coded in C/C++, as are Raspberry Pi units.\n\nIf for no other reason, you should\
    \ learn C++ due to the simple fact that it's incredibly powerful. C++ will allow\
    \ you to do almost anything a language *could* allow you to do, while also being\
    \ super functional and readable. It bridges the gap between lower-level more esoteric\
    \ languages like C and higher level languages like Java and Python.\n\n# Chapter\
    \ 2: Getting Set Up / Your First Program\n\nSince this is a beginner’s guide,\
    \ I'm going to give you pretty straightforward instructions to getting up ASAP\
    \ so that you can get to work. At the same time, though, I'm going to try to explain\
    \ exactly what's going into what you're downloading.\n\nTwo big components of\
    \ getting started with C++ for a beginner are an IDE and a compiler. An IDE, or\
    \ **integrated development environment**, is an environment in which you write\
    \ code which allows you to run and debug your program as well as perform other\
    \ functions depending on which IDE you use. A **compiler** is what translates\
    \ what you write into code that the machine can read and understand. Often, the\
    \ IDE will come bundled with a compiler. It's not absolutely necessary that you\
    \ have an IDE - you theoretically can write the code in a text editor, as .cpp\
    \ and then compile. However, I don't recommend this, especially not as a beginner\
    \ to C++ and potentially programming in general.\n\nFor this book, I recommend\
    \ that you get an IDE called CodeBlocks. It can be found at codeblocks.org. You\
    \ go to the downloads page and then click the link titled “download the binary\
    \ release”. If you're running Windows, download the file named “codeblocks-[VERSION]mingw-setup.exe”.\
    \ If you're running Linux, select the version appropriate for your distribution.\n\
    \nOnce you have CodeBlocks installed, you're going to launch it. After launching\
    \ it, you're going to most likely have a first-time dialog that asks which compiler\
    \ you'd like to use, with MinGW/GCC selected by default. Just press “ok”.\n\n\
    Once you're on the actual software, you're going to click \"file\" on the taskbar,\
    \ then hover over \"new >\", then select \"empty file\".\n\nIn this file, type\
    \ the following. It doesn't make much sense yet, but it will.\n\n```cpp\n#include\
    \ <iostream>\n\nusing namespace std;\n\nint main() {\n    cout << \"Hello world\\\
    n\";\n    return 0;\n}\n```\n\nAfter typing this, look just below the taskbar\
    \ on the icon bar for icons. They should be a gear, a play button, and a gear\
    \ WITH a play button. These are build, run, and build + run. C++ has to be compiled\
    \ before it's ran. The build option does this. Run, of course, executes the program.\
    \ Build + run does both.\n\nClick build + run, and watch what happens.\n\nVoila!\
    \ Your very first C++ program. Now either go to Edit > Save, or press Control+S.\
    \ Save your file as “first.cpp\", and observe what happens to the text.\n\nIt\
    \ comes to life in vibrant colors! This is thanks to the IDE. It's called syntax\
    \ highlighting, which means the IDE is helping you dissect your program into its\
    \ individual parts.\n"
