  md: 'your UI wherever you want to have the custom UIView display. Next, with the
    UIView object in your interface selected, find the Class Identity property in
    the information window for the object, and set this property to your newly created
    custom view class.


    # NOTE


    Another way of adding a custom view to your view hierarchy is to do it programmatically
    by simply adding it as a sub-view of one of your views.


    However, wherever you place the instance of your view in your UI, your application
    will create an instance of your custom view and display it when your UI displays.


    At this point, you can return to Xcode and begin writing the code that actually
    implements your custom view.


    # Implementing the Custom View Code


    When inheriting from UIView, there are three core methods that you need to be
    concerned about. The first is the designated initializer, which is `initWithFrame:`.
    This method will be called to construct your custom view. A CGRect identifying
    the frame for the view, will probably initially be CGRectZero, and you should
    plan to do your layout in the method layoutSubviews, which is specifically intended
    for this purpose. Use the initializer instead to initialize data that you will
    need later for drawing your view.


    The second method to be concerned about inheriting from UIView, as alluded to
    in the previous paragraph, is the `layoutSubviews` method. This method is called
    by any super view to lay your view `layoutIfNeeded`. You should use this method
    to lay out any subviews or elements within your view. The default implementation
    of this method does nothing.


    The final method that you need to be concerned about is the `drawRect:` method.
    This is the method where all the magic happens. It is where your custom view actually
    does the drawing to display your data. It is important to note that you should
    not manually draw your subviews in your `drawRect:` method. The view will send
    a `drawRect:` call to each of your subviews in turn. They are responsible for
    drawing themselves. You do not draw them. You need only be concerned with drawing
    your content.


    Typically, you use Core Graphics to actually do the physical drawing of your view.
    However, keeping in mind what I just said about some views drawing themselves,
    you should remember that your custom view, even though it''s, is still a view
    and fits perfectly into the UIView hierarchy. This means that not only can it
    be a subview of another view, but it can also contain subviews. The importance
    of this is that, for example, rather than composing an image into your view in
    your `drawRect:` method; it may actually be more efficient to use a UIImageView
    subview.'
