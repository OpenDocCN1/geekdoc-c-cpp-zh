  md: '# Chapter 3. Exploring the Simulator in Depth


    # Turning the simulator on its side


    I originally said the accelerometer was not supported on the simulator at all.
    This is not entirely true. It is possible to turning your iPhone from portrait
    to landscape. This is available from the Hardware menu in the simulator under
    the "Rotate Left" and "Rotate Right" options. Any events that would get by rotating
    the actual device are also fired when using these menu options. It''s important
    to note, however, that this is not actually invoking the accelerometer API, and
    events associated with the accelerometer are not triggered by this interaction.
    There are, however, specialized events for transitioning from portrait to landscape,
    and vice versa, that will be triggered.


    Figure 3.2 shows the simulator rotated to its left in landscape mode.


    Figure 3.2


    The simulator in landscape mode


    ![](img/0ccd1d097de6918b1df92faf66d987b6_46_0.png)


    # Digging deeper into the simulator filesystem


    When debugging your applications, it can be extremely useful to be able to navigate
    into the actual filesystem that''s being used by the simulator to run your application.
    This is particularly useful, for example, when you want to see files that you
    are writing correctly or if your database schema is being created properly. Fortunately,
    the simulator''s filesystem is easily accessible inside your home directory of
    your computer. The location of the iPhone filesystem is /Users/<your username>/Library/Application
    Support/iPhone'
  merge: -1
