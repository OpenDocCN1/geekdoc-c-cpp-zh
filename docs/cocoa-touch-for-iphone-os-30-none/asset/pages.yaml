  md: "# Accessing the Web\n\nIn our connected world, perhaps the most frequent type\
    \ of network activity is connecting to the Web. Therefore, it's no surprise that\
    \ Apple has integrated Web connectivity into all levels of Cocoa Touch. Not only\
    \ can you connect to the Web using dedicated classes for so, such as NSURLRequest\
    \ and so forth, but there are even utility methods on several of the foundation\
    \ classes that encapsulate some of the most frequently needed methods for Web\
    \ connectivity.\n\nLet's take a look at how the Web can be accessed through Cocoa\
    \ Touch\n\n# Using URLs with foundational classes\n\nThe first and most basic\
    \ mechanism for accessing Web content through Cocoa Touch involves factory methods\
    \ on some of the foundation classes themselves, such as NSString, NSData, and\
    \ so on. Each of these has an initializer `initWithContentsOfURL:encoding:error:`\
    \ which enables you to initialize an instance of the class by automatically downloading\
    \ the content of the file located at the given URL to be used as the contents\
    \ of the object. In other words, by using this initializer, you can request that\
    \ a given URL be downloaded and decoded using the given encoding, and then that\
    \ the contents of it be used as the data for an NSString, or an NSData, and so\
    \ on. This is an incredibly convenient mechanism if you only need very basic Web\
    \ resource download capabilities. Listing 19.1 shows an example of downloading\
    \ a URL into an NSString and then using the data.\n\n+   19.1\n\n# Downloading\
    \ a URL into an NSString\n\n```\n- (void)downloadAndDisplayFile:(NSString *)inString;\n\
    \    NSURL *url = [NSURL URLWithString:inString];\nNSString *fileData = [NSString\
    \ stringWithContentsOfURL:url];\n    // do something with the fileData string\
    \ ...\n```\n\nThis works well if your needs are very simple. However, it is not\
    \ nearly as flexible as some of the other solutions that you will be looking at\
    \ shortly. In particular, this call blocks, which means your main thread is stuck\
    \ waiting for this file to be downloaded. If there is some kind of network difficulty\
    \ that causes the download to take an exceptionally long period"
