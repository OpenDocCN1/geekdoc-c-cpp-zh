  md: "# Doing Advanced UITableView Configuration\n\nThe greatest customization of\
    \ a UITableView usually be done by customizing the UITableViewCellCells that are\
    \ used within it. You'll see how to do this in the next chapter, but first, I\
    \ want to take a look at a couple of the things that can be customized on the\
    \ list. Specifically, I'm going to show you how to add an alphabetical list to\
    \ the side of your table. This makes it really handy for managing large quantities\
    \ of data, as it gives you the opportunity to jump to a particular section of\
    \ the table view having to scroll through the entire list. Secondly, you'll add\
    \ a search box to the top of your table view so that the user can search for a\
    \ particular element.\n\n# Adding an alphabetical list to the side\n\nAdding an\
    \ alphabetical index list to the side of UITableView is incredibly easy. You've\
    \ probably seen these index lists in things like the address book.\n\nTo this,\
    \ you simply implement the UITableViewDataSource method sectionTitlesForUITableView;\
    \ returning an array of strings that will be used as the header labels for each\
    \ of the sections. These will also be used as the alphabetical list on the side\
    \ of the table view. You could, for example, return an array A to Z. In this case,\
    \ you could return the first letter of each of your states, as shown in Listing\
    \ 6.19.\n\n# Listing 6.19\n\n```\n(NSArray *)sectionIndexForUITableView sectionTitlesForUITableView:(UITableView\
    \ *)tableView;\n{\n  NSMutableArray *names = [NSMutableArray array];\n  for (NSDictionary\
    \ *state in favoriteCities)\n{\n    NSString *stateName = [state objectForKey:@\"\
    NAME\\];\n    NSString *letter = [state substringToIndex:1];\n    [names addObject:letter];\n\
    }\nreturn names;}\n```\n\n> NOTE\nDon't add this to your example application,\
    \ when you implement the swipe-to-delete support, the delete button can sometimes\
    \ cause problems with the index list. So leave this out of your example code for\
    \ now. I just wanted to show you how to do it."
