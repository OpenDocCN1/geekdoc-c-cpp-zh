    Program Portal.


    I''m going to go through the process (as of early June 2009) process that''s required
    for getting a certificate. Apple and does change the iPhone developer program
    portal on a regular basis, and this process may change, be sure to check the latest
    instructions on the Apple Web site for updated information on this process before
    beginning.


    In order to acquire a certificate, the first thing you need to do is create an
    application ID for the applications that are going to use for your notifications.
    In order to load an iPhone application onto a provisioned iPhone, you have to
