  md: '# Chapter 18: Implementing a Database with Core Data


    Core Class, and then finally, an NSManagedObject class. This brings up a dialog
    that enables you to select all of the classes that you want to generate implementation
    flows for. Go ahead and do this for this project, adding your NSManagedObject
    subclasses to a new group in your project Managed Objects. This should create
    new files in your project consisting of the headers and implementation files for
    the city and state entities. Later, if you make modifications to your model, you
    can use the code generator in Xcode to generate the accessor definitions from
    the Data Model menu under.


    # NOTE


    Core Data is responsible for the life cycle of all NSManagedObjects; therefore,
    there is no need for a dealloc in these classes. If, however, you add custom member
    variables, you need to allocate and deallocate them as you would normally.


    You''ll find that if you look at your data model, it has now been updated so that
    the city and state entities have their class properties set appropriately to the
    new classes that have been generated in your project.


    At this point, you now have your data model built, your custom model classes created,
    and the application has been updated so that it can use Core Data to store and
    retrieve your cities and states. Now, you need to look at how you work with the
    managed object context to create, update, and delete objects in the persistent
    store.


    # Exploring entity properties


    Core Data is an incredibly deep and powerful framework providing many tools to
    enable you to store whatever kind of data you need to, with whatever sort of relationship
    you need. In addition to the plethora of data types that can be used as attributes,
    it also has the ability to do fetched properties, which enable a sort of loose
    relationship from one entity type to another. A fetched property on your cities
    object might represent the line of nearby cities to a given city. You won''t be
    using fetched properties in this chapter, but to find out more about them, see
    the Core Data documentation.


    # CRUD — Creating, Reading, Updating, Deleting


    Once you have Core Data, your object model, and so integrated with your application,
    actually using it to access data is reasonably straightforward. The most important
    thing to recognize is that at its heart, Core Data is really just an object persistence
    mechanism, and once you learn the API surrounding that, it is easy to reuse throughout
    your application.


    As with most data storage systems, operations essentially come down to four different
    things: creating objects, reading objects, updating objects, and deleting objects.'
