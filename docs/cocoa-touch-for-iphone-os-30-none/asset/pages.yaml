- img_proc: true
  md: '# 86 Building GUIs


    Figure 7.1

    Parts of a UITableViewCellCell


    ![](img/0ccd1d097de6918b1df92faf66d987b6_109_0.png)


    As Figure 7.1 shows, inside the UITableViewCellCell there are two primary subviews.
    On the far right is the accessory view. The accessory view is where a button is
    displayed if you configure the cell to have an accessory view. Typically this
    might be something like an indicator, which shows that there is more data to be
    displayed. When the table view is placed into editing mode, this accessory view
    is used to display the reordering control, or the delete button when row is selected
    for deletion and awaiting confirmation.


    The view to the left, which takes up the rest of the cell, is the content view.
    This is where the content of your cell goes, and where the majority of your customization
    should be done.


    > NOTE

    The content view automatically resizes when necessary to make room for the accessory
    view. When customizing, you should take this into account, meaning that you should
    also resize any custom subviews you have created.


    When you construct a UITableViewCellCell, you have the ability to pass a style
    parameter to the constructor. The possible values for this style parameter are
    listed in Table 7.1. The types of subviews contained within the content view vary,
    depending on the type of cell that you requested.


    | Table 7.1 Cell Styles |

    | Value | Description |

    |---|---||

    | UITableViewCellStyleDefault | A simple cell with just a single text field and
    an image on the left side. iPhone 05.2, this was the only style available. |

    | UITableViewCellStyleValue | This style of cell contains a label on the left
    side of the cell with normal black text, and a label on the right side of the
    cell with smaller blue text. This is similar to the types of cells used in the
    settings application. |

    | UITableViewCellStyleValue2 | This style of cell contains blue text on the left
    side and black text on the right side. The right side is small. This is similar
    to how the contacts application works. |

    | UITableViewCellSubtitle | This style of cell contains a label across the top
    and another label below it in smaller gray text. |'
