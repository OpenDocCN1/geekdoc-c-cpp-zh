  md: '# Working with UITableViewCells


    In the last chapter, you looked at how you could add a UITableView to your application
    to display a list of data. The way you used the UITableView was pretty basic.
    You didn''t do anything fancy in terms of customizing how it looks or anything
    like that. Naturally, it is possible to add a bit of customization to UITableViews,
    and in particular, the cells that make up the individual rows in the table view.
    And, it is possible to add a bit of customization to UITableView. Most of that
    customization applies to the appearance and behavior of the cells that make up
    the rows in the table. You do this by customizing the UITableViewCellCell objects
    that you return from the UITableViewDataSource when displaying the data. This
    is an incredibly powerful method for customizing your UITableView and will be
    the focus of this chapter.


    You''ll begin exploring the UITableViewCell class by looking at the parts that
    make up a UITableViewCell and how you can use those parts to make a custom appearance.
    You will then see how you can use inheritance to create a custom UITableViewCell
    that enables you to do virtually anything that you want to.


    # Understanding the Parts of a UITableViewCell


    Before you begin customizing a UITableViewCell, you need to get a feel for the
    lay of the land. That is to say, you need to know what the parts of a typical
    UITableViewCell are, how they behave, and where they are located in the cell.
    Figure 7.1 outlines the typical layout of the subviews of a UITableViewCell.


    # In this Chapter


    +   - Customizing a UITableView''s appearance

    - Exploring options for laying out UITableViewCells

    - Optimizing performance by using a reuse identifier with cells

    - Exploring UITableViewCell inheritance


    ![](img/0ccd1d097de6918b1df92faf66d987b6_108_0.png)'
