- img_proc: true
  md: "# Building a bubble level\n\nThe first thing to know when working with the\
    \ accelerometer is that there are actually three core classes involved in the\
    \ accelerometer API. The first one is the UIAccelerometer class. The UIAccelerometer\
    \ class is a singleton and it is used to access the accelerometer device. You\
    \ can also set the accelerometer so that you can set your delegate object for\
    \ the accelerometer. If you do not require constant updates, then you should set\
    \ the update interval to a longer time period than the default in order to conserve\
    \ battery life.\n\nYou can download the code for the example application on the\
    \ book's Web site. The example code includes the graphics that are used for the\
    \ view that will show your level. The application itself is very simple. Essentially,\
    \ you have a background image that contains a set of crosshairs. The crosshairs\
    \ represent \"level\". Over the top of this is a semitransparent, green circle\
    \ whose position is based on input from the accelerometer. You will use the center\
    \ position of the circle to update its position.\n\n# Accessing the UIAccelerometer\
    \ in viewDidLoad\n\nThe important sections of code that you will look at are the\
    \ view controller's viewDidLoad method, where you are initially accessing the\
    \ accelerometer, and setting the view controller as UIAccelerometerDelegate. The\
    \ UIAccelerometerDelegate is the object that actually receives the updates from\
    \ the accelerometer as they occur. By setting it to your view controller, you\
    \ can easily set the center position of your view correctly.\n\nThe viewDidLoad\
    \ method is shown in Listing 31.1. The only thing that's really significant about\
    \ it is your setting of the view controller as the delegate to the UIAccelerometer\
    \ object.\n\n# Listing 31.1\n\n# Implementation of the viewDidLoad\n\n```\n(void)viewDidLoad\n\
    {\n  origX = [circle center].x;\n  origY = [circle center].y;\n  [[UIAccelerometer\
    \ sharedAccelerometer] setDelegate:self];\n  super viewDidLoad;\n}\n```\n\nYou\
    \ should also make it point here to store the current center location of the circle.\
    \ This is simply so that you can return to the center location when the accelerometer\
    \ is zeroed out."
  merge: -1
  pgno: 387
- img_proc: true
  md: "# Chapter 31: Working with the Accelerometer\n\n# Implementing the UIAccelerometerDelegate\
    \ method\n\nThe UIAccelerometerDelegate protocol defines only one method. That\
    \ method is accelerometer:didAccelerate and is called on the update interval that\
    \ you configure the UIAccelerometer. In your case, the implementation of this\
    \ delegate method is shown in Listing 31.2.\n\n# Listing 31.2\n\n# Implementation\
    \ of the Delegate\n\n```\n(void)accelerometer: (UIAccelerometer *)accelerometer\n\
    \  didAccelerate:(UIAcceleration *)acceleration\n\n  float newX = originX + ([acceleration\
    \ x] * 100);\n  float newY = originY + ([acceleration y] * 100);\n  [circle setCenter:CGPointMake(newX,\
    \ newY)];\n```\n\nThe implementation of this method is extremely simple. All you\
    \ do is take the UIAcceleration object that you are given, normalize the value\
    \ received from it multiplying by 100, and then add or subtract that value to\
    \ or your original X and Y values to arrive at your new position values.\n\nYou\
    \ multiply the values by 100 so that you have a new location that is appropriately\
    \ far away from the center point. If you didn't multiply the values by 100, the\
    \ circle would barely move at all, as the values that you receive from the accelerometer,\
    \ just by tilting, range from approximately -1.0 to +1.0.\n\nFinally, you update\
    \ the center property on your circle object. This causes the circle to move as\
    \ the accelerometer method gives you data.\n\nGo ahead and run the example application\
    \ with this implementation of the accelerometer delegate method, and observe its\
    \ behavior.\n\nNow, you may notice that the values that the accelerometer gives\
    \ you can be slightly spiky. That is to say, if you run this code exactly as I've\
    \ shown you here, you'll notice that the circle tend to jump around a little bit\
    \ and have some jitter. When working with the accelerometer, it can be helpful\
    \ to filter out this jitter to get a smoother signal.\n\nSo let's add a low-pass\
    \ filter to your code to smooth out that jitter."
  merge: -1
  pgno: 388
- img_proc: true
  md: "# Adding a low-pass filter\n\nA low-pass filter simply takes a signal and averages\
    \ the current sample of that signal with the previous sample of that signal, assigning\
    \ weights to both the old value and the new value. Using it, you can smooth out\
    \ outliers in the signal tend to be averaged back toward the other samples in\
    \ the signal. In other words, a signal with values of 5, 5, 6, 20, 5, when passed\
    \ through a low-pass filter, reduces the filtered value of 20 to 30 something\
    \ in line with the other values.\n\nIn your case, you're going to implement a\
    \ very simple low-pass filter. The code for that filter is shown in Listing 31.3.\
    \ Essentially, it adjusts new values such that their value is equal to 60 percent\
    \ of the new sample, plus 40 percent of the old sample. In this way, new samples\
    \ can't easily jump to considerably higher or lower values.\n\n# Listing 31.3\n\
    \n# A Low-Pass Filter\n\n```\n(float)lowPassFilter:(float)inNewValueWithLastValue:(float)inLastValue:\n\
    \  float factor = 0.4;\n  return (inNewValue * factor + inLastValue * (1 - factor));\n\
    ```\n\nThis implementation requires that your delegate method also have some changes.\
    \ The changes are shown in Listing 31.4.\n\n# Listing 31.4\n\n# Updated Delegate\
    \ Method\n\n```\n(void)accelerometer:(UAccelerometer *)accelerometer\n  didAccelerate:(UAccelerometer\
    \ *)acceleration {\n  float xAccel =\n    [self lowPassFilter:[acceleration x]\
    \ withLastValue:lastX];\n  float yAccel =\n    [self lowPassFilter:[acceleration\
    \ y] withLastValue:lastY];\n  lastX = xAccel;\n  lastY = yAccel;\n  float newX\
    \ = origX - (xAccel * 100);\n  float newY = origY + (yAccel * 100);\n  circle\
    \ setCenter:CGPointMake(newX, newY)];\n```"
  merge: -1
  pgno: 389
- img_proc: true
  md: 'Most importantly, you take the accelerometer values and pass them through the
    low-pass filter, as well as passing the last measured value for each of the vectors
    you are interested in. You then store your new adjusted values in your last values
    so that you can use them the next time you receive new vectors. The rest of the
    code stays same.


    If you run the application, you should see that the signal is smoothed out somewhat.
    Feel free to tweak the factor value in the low-pass filter to see what kind of
    effect it has on the application. Another way you could smooth it out might be
    to use core animation in updating your position.


    # CROSS-REF


    See Chapter 14 for more information about using core animation.


    Now, to make this application, all you need to do is improve the graphics. You
    now have in your hand bubble level that you can use in woodworking projects.


    # Understanding the UIAcceleration object


    You saw in the previous example that the UAccelerationDelegate receives the notifications
    of events from the accelerometer via its delegate method. One of the parameters
    to delegate method is the UIAcceleration object, which contains vital information
    regarding the current acceleration event that you are receiving. This object contains
    vectors for the X, Y, and Z forces currently being experienced by the device.
    Additionally, it contains a timestamp indicating when the measurement took place.
    This timestamp could be used to filter similar to what you did with your low-pass
    filter.


    # Capturing Shake Events


    You''ve now see how to use the accelerometer directly. You can use the capabilities
    that I''ve already demonstrated in this chapter when building a game or something
    where you need to have a fine level of input from the accelerometer. In previous
    chapters, you''ve also seen how to respond to accelerometer events such as tilting
    the phone from portrait to landscape mode in your view controller.


    In iOS 3, Apple has introduced a new event implemented on the UIResponder class
    specifically for the purpose of intercepting motion events. As of this writing,
    the only motion events that are currently available to be captured by this mechanism
    are shaking events. However, the fact that this capability is UIResponder means
    that your custom view is able to intercept these events just if you were intercepting
    touch events. It''s as simple as implementing the appropriate methods on your
    custom views.'
  merge: -1
  pgno: 390
- img_proc: true
  md: "# Working with the iPhone Hardware\n\nIn, other words, any UI view that implement\
    \ can easily detect when the user begins shaking the device and they stop shaking\
    \ the device. You do this by implementing the methods motionBegan:withEvent: and\
    \ motionEnded:withEvent: on your custom UIView. These are similar to the methods\
    \ touchesBegan:withEvent: and touchesEnded:, except the event object passed to\
    \ the method is slightly simpler, because it does not contain a set of touches\
    \ or motions; it only tells you what type of motion event occurred.\n\n> NOTE\n\
    The shake event is being implemented as a standard metaphor throughout iPhone\
    \ OS as “undo,” so it’s a useful capability to utilize in your applications.\n\
    \nLet’s see how to implement these methods with an example application.\n\n# Building\
    \ a “shake to break” detector\n\nThe application that you are going to build here\
    \ basically a shake detector. It will have a small, square, custom view in the\
    \ middle of the screen. Under normal operations, the square will be turn red.\
    \ if the user shakes the phone, the square will turn red. Figure 31.3 shows the\
    \ completed application.\n\n# Implementing drawRect\n\nTo build this application,\
    \ you need to create a custom UIView, which forms the square in the middle of\
    \ the screen. This custom UIView’s drawRect: method is shown in Listing 31.5.\n\
    \nListing 31.5\nImplementation of the drawRect: Method\n\n```\n(void)drawRect:(CGRect)rect\
    \ {\n  CGContextRef ctxt = UIGraphicsGetCurrentContext();\n  CGContextSetStrokeColorWithColor(ctxt,\
    \ [[UIColor blackColor] CGColor]);\n  CGContextSetFillColorWithColor(ctxt, [currentColor\
    \ CGColor]);\n  CGContextStrokeRect(ctxt, rect);\n  CGContextFillRect(ctxt, rect);\n\
    }\n```"
  merge: -1
  pgno: 391
- img_proc: true
  md: '# Figure 31.3


    The “shake to break” application


    ![](img/0ccd1d097de6918b1df92faf66d987b6_392_0.png)


    Essentially, you are simply filling the rectangle of the view with whatever color
    is appropriate. The color is set to blue initially, and then becomes red after
    some motion events are received.


    > CAUTION


    In order to receive motion events, your view must be the first responder. Be sure
    to override canBecomeFirstResponder on your custom UIView so it returns YES and
    call becomeFirstResponder after your view loads.'
  merge: -1
  pgno: 392
- img_proc: true
  md: "# Implementing motionBegan and motionEnded\n\nThe motionBegan and motionEnded\
    \ methods are simple to implement. Essentially, you receive the former when the\
    \ shaking of the device begins, and you receive the latter after it is completed.\
    \ So, in your motionBegan method, you set the color to red, and then when the\
    \ shaking stops, you set the color back to blue. The code for these two methods\
    \ is shown in Listing 31.6.\n\n# Listing 31.6\n\n# Implementing the Motion Detection\
    \ Events on a Custom UIView\n\n```\n(void)motionBegan:(UIEventSubtype)motion initWith:(UIEvent\
    \ *)event {\n  [self setColor:[UIColor red]];\n  [self setNeedsDisplay];\n}\n\
    (void)motionEnded:(UIEventSubtype)motion initWith:(UIEvent *)event {\n  [self\
    \ setColor:[UIColor blue]];\n  [self setNeedsDisplay];\n}\n```\n\n# Cancellation\
    \ of motion events\n\nIt is possible to have your motion events cancelled in various\
    \ ways: by another UI element intercepting the events, by a phone call, or by\
    \ another action that could make your application no active. If this occurs, your\
    \ view receives a call to motionCancelled:withEvent:. Listing 31.7 shows an implementation\
    \ of this method. In your case, you're going to treat it just like motion ended:\
    \ you're going to set the color back to blue.\n\n# Listing 31.7\n\n# Implementation\
    \ of motionCancelled:withEvent:\n\n```\n(void)motionCancelled:(UIEventSubtype)motion\
    \ initWith:(UIEvent *)event {\n  [self setColor:[UIColor blue]];\n  [self setNeedsDisplay];\n\
    }\n```"
  merge: -1
  pgno: 393
- img_proc: true
  md: 'Once you''ve implemented this method, you can run the application, shake your
    phone, and see the square turn from blue to red. When you stop shaking, it returns
    to blue.


    # Summary


    Now you''ve seen how to work with the accelerometer. You''ve seen how to detect
    changes in the orientation of the device. And you''ve also seen how you can detect
    shake events in your custom views. Enabling applications to know more about their
    surroundings via things such as the accelerometer and the built-in compass leads
    to applications with better environmental and user awareness.


    If you can imagine what it would be like to not be able to see, not be able to
    touch, not be able to hear, and not to sense whether or not you were standing
    up straight, then you can imagine what it''s like being a typical computing device
    today. Most devices have none of these capabilities. You can then imagine how
    difficult it would be to work with other people if you were so constrained.


    The iPhone, on the other hand, is one of the first handheld devices to open the
    door to alternative input devices such as the accelerometer, its camera, its microphone,
    and so on. By leveraging these technologies, you can build applications that are
    more aware of their surroundings than any applications available on any other
    platform. This is a powerful concept and one to consider when you''re thinking
    of ideas for iPhone applications.'
