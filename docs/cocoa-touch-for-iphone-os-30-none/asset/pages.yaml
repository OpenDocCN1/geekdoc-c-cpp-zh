  md: 'The items you''re interested in configuring are shown in the properties window
    when the TextField is selected. They are the Input Traits values.


    # Configuring capitalization


    When you look at the text-input properties configuration items in Interface Builder,
    highlighted in Figure 13.2, you can see what you''re going to be configuring with
    regard to text input. The first thing I''m going to talk about is capitalization.


    Figure 13.2

    The text input traits properties in Interface Builder


    ![](img/0ccd1d097de6918b1df92faf66d987b6_184_0.png)


    Capitalization on text entry can be configured to capitalize words, sentences,
    none, or every. In the case of capitalizing words, the first letter of each word
    in the sentence is capitalized. In the case of capitalizing sentences, the first
    letter of each sentence is capitalized. And naturally, in the case of everything
    or none, this setting controls all of the text in the field is completely capitalized
    or if nothing is capitalized. The user can, of course, override these settings
    for the most part by pressing Shift on the keyboard.'
