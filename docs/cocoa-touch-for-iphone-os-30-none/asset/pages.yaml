  md: '# 284 Working with Data


    Once your connection is established, you can send data to your peers using the
    methods DataToAllPeers:withDataMode:error: and sendToPeers:withDataMode:error:.
    In the case of the former method, you are sending data to all peers, and in the
    case of the latter method, you are sending only to a subset. In both cases, the
    data that is sent is an NSData instance containing an arbitrary set of bytes that
    you define. Apple recommends that you keep this data relatively small, under 1KB
    in length. Large data sets may result in excessive latency.


    The mode parameter on these methods enables you to specify whether you prefer
    reliable or unreliable transmission modes. When working with games, unreliable
    transmission modes are often preferable because it is more important for the application
    to receive updated information than to receive accurate but out-of-date information.
    Unreliable transmission mode does not ensure that every packet you send is received
    by the peer. Reliable transmission mode will resend packets if they fail to arrive.
    It is up to you to determine what type of transmission your application requires.


    To receive data, you implement the method receiveData:from:object you have previously
    set to be your data handler via the method setDataReceiveHandler:withContext:
    which is available on GKSession. So, in other words, you designate an object that
    will be your data receiver, and you set it as your "data receiver handler" using
    the method setDataReceiveHandler:withContext: on GKSession. You then implement
    the method receiveData:from:object:context: on this object, and use the data in
    whatever way you want it to.


    # In-Game Voice


    The Game Kit in-game voice feature enables devices to send real-time voice communication
    from one device to another over an Internet link or using the Game Kit Bluetooth
    network by allowing you to transmit voice data over a network connection provided
    by your application. This network connection can be anything from a normal socket
    connection to an instance of GKSession that you have allocated for this purpose.


    If you utilize a GKSession instance, you can, of course, use its built-in mechanisms
    for finding peers. However, if you choose to use the Game Kit voice chat over
    the Internet, you need to provide a mechanism that enables a peer directory service
    and enables peers to translate a directory entry to a network address for establishing
    the network connection. This directory service may require a server-side service
    to be implemented by you.


    The important thing to understand is that when initiating a voice chat, you''re
    required to provide a participant ID and a mechanism for sending data to the participant.
    Who get this participant ID, and the network connection, is up to your implementation.
    If, for example, you utilize the GKSession as your low-level peer-to-peer network,
    then you could use the peer ID as the participant ID and use the method sendToPeers:withDataMode:error:'
  merge: -1
  pgno: 307
- img_proc: true
  md: "# Chapter 21: Using the Game Kit API 285\n\nBefore beginning to use the Game\
    \ Kit voice chat features, you must first initialize the audio system to allow\
    \ for recording and playback of audio. You do this by getting the AVAudioSession\
    \ singleton and setting its category to AVAudioSessionCategoryPlayAndRecord. 21.7\
    \ demonstrates how you do this.\n\n# Initializing the Audio Session\n\n```\n-\
    \ (void) setupAudio;\n{\n    NSError *error = nil;\nAVAudioSession *audioSession\
    \ = [AVAudioSession sharedInstance];\nif([audioSession setCategory:AVAudioSessionCategoryPlayAndRecord\
    \ error:error])\n    [self handleError:error];\nif(![audioSession setActive:YES\
    \ error:error])\n    [self handleError:error];\n}\n```\n\nThe GKVoiceChat utilizes\
    \ a delegate-like pattern in the form of a client property. The client is responsible\
    \ for implementing the methods necessary to actually transport the data between\
    \ the peers and must implement the GKVoiceChatClient protocol. There are two important\
    \ methods from the GKVoiceChatClient protocol that must be implemented on the\
    \ client in order for the GKVoiceChatService to do its work.\n\nThe first is the\
    \ voiceChatService:didReceiveInvitationFromParticipantID:callID:, which is called\
    \ on the client when the service receives an invitation from a peer to begin a\
    \ chat. The default implementation of this method allows all clients to connect\
    \ and initiate a chat. If you want to give the user the opportunity to accept\
    \ or decline an invitation to chat, you should implement this method accordingly.\
    \ When you implement this method, in order to indicate that the user has accepted\
    \ the request to chat, call the method acceptCallID:error on the service. Alternatively,\
    \ to decline the chat, call the method denyCallID.\n\nThe second and more important\
    \ method to implement on your client is the method voiceChatService:setDataToParticipantID:,\
    \ which must be implemented on the client in order to send data between the peers.\
    \ If you do not implement this method, no data is sent and voice does not work.\n\
    \nEssentially, when the chat service needs to send data to the peer, it can do\
    \ this with an NSData object containing the payload to be sent to the remote host.\
    \ This can be as a result of an invitation, voice, or other things. The intent\
    \ is not for you to do anything with the data other than pass it on to your transport\
    \ mechanism. For the most part, you can consider the NSData parameter to be opaque.\
    \ Your job is simply to pass it on to the peer."
  merge: -1
  pgno: 308
- img_proc: true
  md: "Listing 21.8 shows an example implementation of this method utilizing a proprietary\
    \ communication class, which theoretically would use a socket connection to send\
