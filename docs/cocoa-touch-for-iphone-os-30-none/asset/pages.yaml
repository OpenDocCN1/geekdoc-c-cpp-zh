- img_proc: true
  md: 'Simulator/User. Inside this folder, you''ll find a set of system directories
    for the iPhone simulator. Most of these are unimportant to you. The one that is
    important, however, is the Applications folder, which contains the sandbox for
    your application when it is installed in the simulator.


    # NOTE


    The application sandbox is the restricted filesystem of your application folder,
    its documents folder, and several system folders. When your application runs,
    it is restricted to this filesystem in terms of reading and writing data.


    When you navigate into this folder and take a look, the first thing that you''ll
    notice is that the folders inside the Applications folder are not named after
    the application names. They are, in fact, given a globally unique identifier,
    or GUID.


    There isn''t any way to predict or associate the GUID with your application; instead,
    you need to look inside these folders for the app folder corresponding to your
    application. So, for example, for your BasicApp, you see a file inside one of
    these folders called BasicApp.app. This is the application bundle, and the top-level
    (GUID) directory is the application sandbox for your application. Inside the application
    sandbox, there are several other folders, including Documents and Library, described
    in Table 3.1.


    Table 3.1 Directories Inside the Simulator Filesystem

    | Directory Name | Description |

    | --- | --- |

    | Documents | The Documents folder is the writable location where you should write
    any data files that your application requires. So, if you''re working with a database,
    this is where you put your writable file. If you write a file just as a raw text
    file, this is where it is written. |

    | Library | The Library folder contains your application preferences. When you
    write a preference using NSUserDefaults, this is where those preferences are written.
    |

    | <Application Name>.app | The application bundle folder (in your case, BasiciPhone.app)
    is the actual application bundle of your application binary and any resource files
    that are included in your bundle.


    When your application is actually running, you are able to write to the Documents
    directory, but you are not able to write to anything inside of your application
    bundle. This becomes important when you dealing with building and writing to a
    database.


    # CROSS-REF


    I talk more about databases in Chapter 18.'
  merge: -1
