    # Modifying the app delegate


    The first thing you need to do before you can actually begin working with the
    Core Data parts of the new application is to add support for setting up the NSManagedObjectContext
    and its associated persistent store.


    # NOTE


    You must add the Core Data framework to your application. Do this by- right-clicking
    your target, and from the General tab, under the Frameworks section, click the
    plus button and choose the Core Data framework.


    To do this, you need to modify your application delegate. You first add several
    methods for setting up the object context and then you modify the applicationDidFinishLaunching
    method and the applicationWillTerminate: to load and save the data to the persistent
    store, respectively.


    The application sandbox on the iPhone prevents you from writing data to your application
    bundle directories. Instead, you are expected to save data in your Documents directory.
    Therefore, you need to be able to find where your Documents directory is located
    so that you can place the persistent store there. Listing 18.1 shows the utility
    method that you use to get your Documents directory.


    Listing 18.1


    # Utility Method to Retrieve the Path to the Documents Directory


    ```

    (NSString *)applicationDocumentsDirectory {


    Array *paths = NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask,
    YES);

    NSString *basePath =

    ((paths count) > 0) ? [paths objectAtIndex:0] : nil;

    return basePath;

    }

    ```


    You''ll need someplace to store your context, store, and model, so add these as
    variables to your application delegate and make them properties. This is shown
    in Listing 18.2, which is the interface file for your application delegate.'
