- img_proc: true
  md: '# Preface


    My goal in writing this book was to provide a comprehensive toolkit for both new
    and experienced iPhone developers. Its focus is intended to be primarily on the
    new technologies of iPhone OS 3, but it includes enough general iPhone development
    material that even a new developer to the platform will receive a great deal of
    benefit from reading it.


    Writing a book about Cocoa Touching is an incredible challenge. It''s very difficult
    to judge the technical capability of the typical reader of a book like this. Does
    the reader already know Objective-C? Has he already been developing for Mac OS
    X? These are the first questions that I had to ask myself when I began to work
    on this project.


    In the end, I decided that with the development of iPhone OS 3, it was a unique
    opportunity where the new and experienced reader intersected and therefore, I
    thought it was an ideal time to write a book that would be useful to both of them.


    So I decided that this book would contain some introductory material, but it would
    primarily focus on the new features of iPhone OS 3. In this way, it provides an
    excellent bridge for learning the technologies of the new operating system, as
    well as an introduction to iPhone development.


    As a reader, you are expected to be somewhat familiar with Objective-C. Additionally,
    you should be somewhat familiar with either Mac OS X, or iPhone development, though
    you need not be an expert.


    If you''re completely new to the platform, simply picking up a book specifically
    on Objective-C to complement this book. There are several such books on the market,
    but I recommend one that approaches Objective-C from the point of view of the
    core language itself, rather than one that mixes an introduction to Objective-C
    with other topics. After you''ve worked through enough of it to feel comfortable
    with the syntax of the language, you can begin this book at Chapter 1.


    If you''ve already developing for Mac OS X, but haven''t done any iPhone development,
    you probably already know Objective-C and are familiar with many of the tools
    used in iPhone development. However, iPhone development is similar to Mac OS X
    development, it''s not exactly the same. I suggest that you skip Chapter 1, and
    start reading Chapter 2, where you build a basic iPhone app from scratch.


    Finally, if you''re already an experienced iPhone developer, you already know
    all the basics involved in iPhone development; you''re just here for the iPhone
    OS 3 material. I suggest you start at Chapter 5. All the chapters were written
    with the new and updated iPhone OS 3 API in mind, and even if you are already
    familiar with ViewController and friends, you will find new material there.


    In these ways, this book provides an excellent extension to your library if you
    already have books on any of these three subjects.


    With regard to conventions used within this book, I''ve tried to be reasonably
    consistent, and also tried to generally err on the side of Apple conventions when
    prudent. The only notable exception has been in my use of the term "method" to
    indicate functions on instances and'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'classes. Apple generally prefers the text message. This is part due to the
    influence of Smarttalk on Objective-C.


    Also with regard to method calling conventions, Objective-C is known for being
    particularly verbose in its method names. As a result, some abbreviation conventions
    have been adopted when writing about particular methods. I have chosen to follow
    two standards. The first, I use when the use of the method in question is in implementing
    your own, or overriding it in a subclass. This is most commonly the case when
    dealing with delegates. In these cases, because it is helpful to know the entire
    signature of the method, in order to write your implementation, I have chosen
    to include the entire method signature. So, for example, these will be written
    as - (BOOL) foo: (NSString *) withBar: (NSString *) baz. As you can see, in this
    example, we have a method called foo, which takes two parameters of type NSString
    *, one bar and returns a BOOL value.


    Alternatively, in the case where you will only be to use the method in your code,
    Xcode automatically completes the types of parameters for you, I have chosen to
    use the abbreviated form of writing the method signatures. In the cases of the
    previous method, that means it is written foo::withBar:. Notice that a parameter
    is inserted, a colon holds the place of the parameter.


    When referring to keyboard shortcuts, I opted to use the term Command key or the
    ⌃ symbol to indicate keyboard shortcuts using the key directly to the left of
    the space bar on Apple keyboards. You may also know this as the "Apple" key, as
    until a few years ago, it included a small Apple logo on it. Additionally, the
    key next to the Command key has been called the Control key and the key next to
    that, the Control key. These should be consistent with Apple documentation conventions.


    When discussing menus in Xcode, I used the technique of separating the nested
    items using arrow notation. So, to describe the New File item of the File menu,
    it will be written as File+New File.


    Finally, with regard to sample code, in chapters where I have instructed you to
    build specific projects, I have generally tried to include full lists for the
    code. In cases where I cannot download the projects, complete with artwork and
    other sharing files, from the book''s Web site, located at http://www.wiley.com/go/cocoatouchdevref.
    There are also chapters where it didn''t make sense to create a full project to
    demonstrate a technology. In these cases, the code listings are snippets that
    you can use as a base for your own code. Because these snippets dont fulfill fully
    functional projects, they will not be example projects for them on the Web site.


    I hope that you find this book as enjoyable to read as I had writing it. To me,
    the mark of a good technical book is that it doesn''t sit on my shelf. It holds
    a place of honor by my desk I keep returning to it, time and again. I hope that
    this book holds prestige in your library, and that it becomes a dog-eared, cover-torn,
    page-scribed reference that remains useful to you for years to come.


    Ja DeVoe


    book@random-ideas.net'
  merge: -1
