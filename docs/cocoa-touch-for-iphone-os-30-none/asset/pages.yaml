  md: '# Using OpenGL ES


    One of the things that excite application developers about the iPhone is that
    it ships with an excellent implementation of OpenGL ES. This is that it ships
    with an excellent implementation of OpenGL ES. This means that developers have
    available to them the full power of OpenGL ES for developing 2-D and 3-D games.
    Some of the most amazing applications developed for the iPhone have been developed
    using OpenGL.


    Unfortunately, OpenGL ES is a huge topic that I can''t cover in depth in this
    book. It would simply be impossible for me to cover it with any level of competency
    in one or two chapters.


    That said, however, I want at least some information about OpenGL ES so that you
    have a basic understanding of how it works on the iPhone, and then to tell you
    where to get more information about OpenGL ES.


    So, in order to do this, you will first take a look at the implementation of OpenGL
    ES on the iPhone and then look at its features and limitations. You will then
    take a look at the OpenGL ES template project and see what it gives you and how
    you can use it as a launching point for your own applications.


    # Understanding the Capabilities of iPhone OpenGL ES


    The first thing that you need to know about using OpenGL ES on the iPhone is that
    OpenGL ES is not OpenGL ES. While they address the same problem, the ability to
    draw two-dimensional and three-dimensional graphics on a computer screen in the
    API for OpenGL ES is different enough from the API for OpenGL that getting a book
    for OpenGL will not teach you anything about OpenGL ES. It will


    # In This Chapter


    +   - Learning about the iPhone OpenGL ES implementation

    - Exploring the default OpenGL ES-based application

    - Interfacing your OpenGL ES code with the iPhone graphics hardware'
  merge: -1
  pgno: 206
- img_proc: true
  md: 'only lead to frustration. This doesn''t mean they don''t share similarities,
    of course. They are based on the same low-level functionality in the same way
    that Cocoa and Cocoa Touch are. However, they are different enough when you look
    for resources on OpenGL ES, make sure you are looking at the ES version and not
    vanilla OpenGL.


    The next thing to understand is that the OpenGL implementation of the iPhone has
    several limitations, even beyond just an ES implementation. The first limitation
    is that the iPhone only supports triangular polygons, when building your models,
    you need to make sure that your models are using triangles. Polygons of any other
    shape do not work.


    The second limitation is that the iPhone uses a shared memory model between the
    graphics and CPU. This means that although the OpenGL ES implementation supports
    vertex objects (VBOs), you actually derive no significant performance improvement
    by using them. This also means that your application memory and your texture memory
    are the same; they come from the same memory pool. This means when developing
    for any device other than an iPhone 3GS, your application and textures must take
    up more than approximately 24MB of memory. As a result, you should also consider
    compressing your textures using the PVRTC format. This is native texture format
    for the iPhone GPU.


    Another limitation to be aware of is that the iPhone uses a technique tile-based
    deferred rendering for its rendering system. It is an optimized rendering system
    that helps to keep memory low by caching updates before uploading them to the
    GPU and only updates when it has a significant chunk of data to send.This means
    you should create and load all of your textures before rendering, and avoid operations
    that update or modify existing textures.


    While not necessarily a limitation per se, you should try to avoid mixing OpenGL
    rendering with UIKit and core graphics rendering. OpenGL is optimized for applications
    that require high-performance animated gaming graphics, while UIKit is optimized
    for on-demand updates and precision-drawing operations. Don''t mix the two.


    # Creating a Very Basic OpenGL View


    Now let''s take a look at how you create an application that uses OpenGL ES by
    looking at the template-generated code from Xcode when you want to create an OpenGL-based
    application.


    Figure 15.1 shows Xcode after you''ve created an OpenGL ES-based application.
    It contains the default files that are included as part of the project template.'
