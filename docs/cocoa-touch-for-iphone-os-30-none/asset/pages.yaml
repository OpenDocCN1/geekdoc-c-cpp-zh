  md: '# Getting Your Location Using Core Location


    One feature that makes developing for the iPhone platform unique and powerful
    is its support for location awareness. The API used for accessing this feature
    is called Core Location. With it, you can pinpoint the location of the device
    anywhere in the world.


    Core Location actually uses three methods to determine your location. If you''re
    on a first-generation iPhone, it first uses a combination of cell tower triangulation
    and then Wi-Fi access point lookup. This provides reasonable accuracy both indoors
    and outdoors but by no means exact. If you''re on a second-generation iPhone,
    which has a built-in GPS receiver, and if you''re outdoors, it instead uses a
    third method, GPS triangulation. Between these three methods, the iPhone is able
    to determine your position with reasonable accuracy and is also able to do both
    indoors and outdoors, which overcomes a limitation that many devices with GPS
    capabilities lack.


    Utilizing this ability to determine the user''s location enables a new class of
    applications and provides exciting opportunities for location-aware computing.


    The latest iPhone revision, the iPhone 3GS, also adds built-in magnetic hardware.
    The compass can be used in conjunction with the GPS capabilities to determine
    the device''s orientation.


    Once you have worked with applications that automatically know the user''s location,
    asking the user for their location in order to display nearby information begins
    to feel archaic.


    Let''s take a look at some of the APIs that enable interaction with this hardware.


    # Finding Where You Are


    As an example, I''m going to have you write an application that monitors the user''s
    location and then opens Google maps to display the user''s location on a map.
    Figure 30.1 shows what the final app looks like when running on the iPhone.


    # In This Chapter


    +   - GPS and cell tower triangulation to determine your iPhone''s location


    +   - Using the Core Location API to find where you are Narrowing the results
    of Core Location


    +   - Using Core Location coordinates to draw your location on a map


    +   - Working with the iPhone 3GS compass'
  merge: -1
