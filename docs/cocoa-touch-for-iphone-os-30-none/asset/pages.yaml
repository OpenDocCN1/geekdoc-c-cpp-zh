  md: '# Introducing ViewController


    When developing the Cocoa Touch frameworks, Apple took the opportunity to standardize
    and codify its toolset for working with views and navigating hierarchical lists
    of data. Many developers are already familiar with the Model, View, Controller
    design pattern that is in common use in Cocoa and Cocoa Touch, as well as in other
    programming languages such as Java. Cocoa has long supported this design pattern,
    particularly with regard to its views and model classes, but only recently has
    it begun to solidify its concept of how a controller fits into its framework.
    Don''t misunderstand; developers working with Cocoa have always utilized controllers
    in their code, but with the introduction of Cocoa Touch, Apple has made a set
    of classes specifically designed to be inherited from when developing views. These
    classes are UIViewController and UITabViewController.


    In addition to providing these classes, which by default, give you a certain amount
    of functionality straight out of the box, Apple has also provided an entire navigation
    framework that works with these controllers to make complex user interfaces, or
    Uls, that manipulate trees of hierarchical data incredibly easy to develop. The
    navigational classes associated with this framework are centered on the UINavigationController
    and its associates.


    # CROSS-REF


    I discuss UINavigation in Chapter 8.


    In this chapter, you''ll take a look at how to write a ViewController and how
    to use it to implement a Model, View, Controller design pattern using your view
    controller in your application. View controllers are a fundamental building block
    in Cocoa Touch and an important concept that you will need to know for future
    chapters.


    # In This Chapter


    +   Understanding how Cocoa Touch fits in the Model, View, Controller design pattern


    +   Learning the basics of UIViewController


    +   Building a basic iPhone app that uses ViewController'
  merge: -1
  pgno: 62
