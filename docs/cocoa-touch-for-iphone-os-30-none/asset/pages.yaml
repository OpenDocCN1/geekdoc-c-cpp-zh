  md: '# Chapter 13: Handling Text Input


    A picture is worth a thousand words, I don''t think there''s much to be added
    here in terms of what kinds of keyboards are available with what kinds of settings.
    However, I will say that generally speaking, the default keyboard works for most
    applications. If, you are working with, for example, URLs or e-mail addresses,
    then you may find that the keyboards specifically designed for those purposes
    result in a better user experience. They have strategically placed "@" keys and
    the behavior to bring extended text by touching and holding the "." key.


    # Setting the behavior of the Return key


    The text displayed in the Return key can be customized as well. It can be set
    to anything from "Done", and so on. You should configure this text according to
    what would appropriate for your application. The property to set this, defined
    on UITextInputTraits, is returnKeyType.


    # Looking at other settings


    Finally, let''s take a look at the few settings that are available. If you set
    a text field to be secure, then instead of displaying the text as you''re typing,
    the text field displays a circle for each of the letters as they are typed. This
    is intended for things such passwords so that you don''t compromise the user''s
    password while he is typing it.


    You have the ability to automatically enable and disable the Return key. When
    you enable this box, if the user has not typed anything into the text field, then
    he is unable to press the Return key. Once he has entered something into the text
    field, he is able to press Return. This is useful for restricting input to ensure
    that the user enters a particular value versus blank.


    You have the ability to set the general "appearance" setting, which essentially
    designates whether the keyboard is to be used on an alert message or on normal
    input. Alert messages are displayed in a different color on the iPhone from a
    normal input screen; as as a result, you may want your keyboard to take on this
    appearance when using it.


    # Working with a Keyboard through Code


    You''ve seen how you work with text input properties through Interface Builder.
    You''ve seen how simply dropping a text field onto a form is enough to get the
    keyboard to display once the user touches inside the field. Now let''s take a
    look at how you force the keyboard to display through code and also how you can
    manipulate UITextInputTraits through code.


    # Making the keyboard appear


    By now, you''ve probably seen that if you drop a UITextField onto an interface
    and allow the user to touch that UITextField, it automatically displays the keyboard.
    But what if you want to force the keyboard to display as soon as your view displays,
    or as a result of the user touching some other place in the UI? The way to do
    this is simply setting your text field to be the first responder.'
  merge: -1
  pgno: 186
- img_proc: true
  md: "# 164 Building GUIs\n\nRemember that Cocoa and Cocoa Touch incorporate a concept\
    \ of a responder chain. The responder chain is a list of user interface elements\
    \ that handle input from the user. The first responder is the UIView that currently\
    \ has focus. When a UITextView becomes the first responder, it creates and configures\
    \ a keyboard based on its UITextInputTraits and displays that keyboard. So the\
    \ way to force the UITextView's keyboard to display is to simply call the method\
    \ becomeFirstResponder on the UITextView. Listing 13.1 shows an example of how\
    \ to do this.\n\n# Listing 13.1\n\n# Showing the Keyboard\n\n```\n(void)showKeyboard\n\
    {\n    myTextField becomeFirstResponder;\n}\n```\n\nSimilarly, to dismiss the\
    \ keyboard, you simply resign the first responder using the resignFirstResponder\
    \ method, as shown in Listing 13.2.\n\n# Listing 13.2\n\n# Dismissing the Keyboard\n\
    \n```\n(void)dismissKeyboard\n{\n    myTextField resignFirstResponder;\n}\n```\n\
    \nThis works with either UITextField or UITextView.\n\n# Understanding UITextInputTraits\n\
    \nSo far, all the work you've done has been related to using UITextField and UITextView,\
    \ and all of the items you configured through Interface Builder can also be configured\
    \ using properties on those classes. The reason that these classes have these\
    \ properties is because they both adhere to the UITextInputTraits protocol and\
    \ implement the properties specified by it."
  merge: -1
  pgno: 187
- img_proc: true
  md: 'If you need to create a custom view that supports text input, you should also
    implement this protocol. Table 13.1 shows the properties defined by this protocol.


    # Table 13.1 Properties Defined on the UITextInputTraits Protocol


