  md: '# Chapter 5: Introducing ViewController


    So I''ve talked about the model and the view, but I have not yet talked about
    the controller. The controller is one of the often-misunderstood parts of the
    Model, View, Controller design pattern, but its functionality is actually very
    simple. The controller is essentially the gatekeeper between the model and the
    view. Its job is to provide the separation between the two of them and to provide
    the methods by which the model and the view manipulate each other without being
    tightly coupled to each other. What this means is that the controller has references
    to both the model and the view, and when displaying the view controller reads
    the data from the model and puts it into the view. Similarly, when the data is
    changed through the view, the controller is the one that reacts to those changes
    and sets the data in the model. Again, the here is to decouple the view from the
    model. The controller acts as that decoupling mechanism.


    # Exploring ViewController


    Before I get too far into the example for this chapter, it''s important that you
    understand why of the ViewController in depth. The core reason for the existence
    of the ViewController is to manage a view.


    In Cocoa Touch, Apple has provided you with a base class from which you inherit
    your view controllers. That base class is the ViewController. Let''s take a look
    at how you write a basic ViewController and how you connect it to your view.


    # Overriding Methods on ViewController


    ViewController provides a variety of methods that can be overridden in subclasses.
    Some of these methods are shown in Table 5.1.


    | Table 5.1 Typically Overridden Methods from ViewController |

    | Method Signature | Description |

    | - (void)load | Called to create the view that the controller manages. You must
    override this method if you intend to create your view yourself programmatically.
    Do not call this method manually yourself. |

    | - (void)viewDidLoad | Called after the view has been loaded from the nib. This
    is used for initialization activities that require the objects in the nib. |

    | - (void)viewDidUnload | Called when the view is unloaded from memory, for example,
    as a result of a low memory warning or when the view is being unloaded so it can
    be deallocated. You should use this for releasing resources allocated in viewDidLoad
    |'
