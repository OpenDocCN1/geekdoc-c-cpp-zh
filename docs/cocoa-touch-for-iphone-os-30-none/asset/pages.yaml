    ask it to actually load content. When using WebView, it requires that you use
    NSRequest, request with the URL that you want to load so that the Web view can
    use the NSRequest to load the content asynchronously. In the case where you want
    to display one page in your application, and you are loading this WebView specifically
    to display that page, a good place to set up this NSRequest is in the viewDidLoad
