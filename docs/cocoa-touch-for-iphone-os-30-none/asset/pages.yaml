  md: '# Using the Push Notification Service


    As you know, on the iPhone, resources such as memory and CPU cycles are extremely
    scarce. As a result, Apple has chosen to restrict applications that can run in
    the background to only official applications written by Apple developers. This
    means that your applications are unable to run in the background. This also means
    that if you want to produce an application that maintains a persistent connection
    to a server even when your application is not running, you will be unable to do
    so.


    Apple recognizes that this is a significant barrier for certain classes of applications.
    An example might be instant messaging applications, where you might send a message
    and wait a period of time before receiving a response to that message. It would
    be inconvenient to the user to stay in the instant messaging application all the
    time in order to receive new messages.


    To at partially solve this problem, Apple has introduced the Apple Push Notification
    Service, or APNS.


    The APNS enables application developers to send notifications to their users''
    iPhone or iPod touches directly from their server-side applications. The iPhone
    OS displays this way notifications when they are received in a similar way to
    how it displays SMS messages. If an application has been registered to receive
    notifications, when notifications for that application arrival, the iPhone gives
    the user the option to view the notification. If the user chooses to view the
    notification, the application is launched and given the notification so that it
    can take action. Figure 20.1 shows what one of these notifications might look
    like.


    +   In This Chapter

    nUsing the Apple Push Notification Service

    Understanding the intricacies of the push protocol

    Sending and receiving notifications

    Implementing a push provider in Ruby'
