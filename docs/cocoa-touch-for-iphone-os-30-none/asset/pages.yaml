    \ Controller Implementation\n\n```\n#import \"BasiciPhoneAppViewController.h\"\
    \n@implementation BasiciPhoneAppViewController\n-(IBAction)setLabelPushed:(id)sender\n\
    {\n    [myLabel setText:[myTextField text]];\n}\n-(void)didReceiveMemoryWarning\n\
