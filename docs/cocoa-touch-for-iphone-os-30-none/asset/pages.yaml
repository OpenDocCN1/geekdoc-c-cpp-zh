  md: "# Browsing for Bonjour services\n\nTo discover local services on your network,\
    \ you use the NSServiceBrowser class. It enables you to search for services of\
    \ particular types, and for services in particular domains. It provides a delegate\
    \ API that enables you to work with it asynchronously. The types of services you\
    \ can search for be anything from HTTP to FTP to your own custom protocol.\n\n\
    To begin using NSNetServiceBrowser you simply create a new one using its init\
    \ method, configure its delegate object, and tell it to begin searching for services\
    \ of an appropriate type by using the method searchForServicesOfType:inDomain:\n\
    \nWhen telling the NSNetServiceBrowser to begin searching for services of a particular\
    \ type, the service type parameter is specified as a string, which follows a specific\
    \ convention. The string must specify both the service name and the transport\
    \ layer name with an underscore character preceding both. So, for example, if\
    \ you want to browse for HTTP services, you would specify a service type of \"\
    _http._tcp\". Similarly, to specify what you want to browse for FTP services,\
    \ you might specify a service type of \"_ftp._tcp\".\n\nThe domain argument can\
    \ be specified to \"local\" for the local network domain, or you can specify an\
    \ explicit domain name. Typically, an empty string is passed for this parameter,\
    \ which indicates the default registration domain.\n\nListing 19.14 shows an example\
    \ of initializing and NSNetServiceBrowser and setting it up to browse for HTTP\
    \ services.\n\n# Creating a New NSNetServiceForHttpServices\n\n```\n(void)browseHttpServers\
    \ {\n    browser = [NSNetServiceBrowser new];\n    [browser setDelegate:self];\n\
    \    [browser searchForServicesOfType:@_http._tcp\" inDomain:@];\n}\n```\n\nThe\
    \ method searchForServicesOfType:inDomain returns immediately; the NSNetServiceBrowser\
    \ automatically adds itself to the current run loop, and begins its search asynchronously\
    \ in the background. When a service matching your requirements is found, the delegate\
    \ method netServiceBrowser:didFindService:moreComing: is called, enabling you\
    \ to take action with the service that was found. An implementation of this is\
    \ in Listing 19.15."
