  md: '# Designing your schema in Xcode


    A data model consists of entities. Entities are made up of attributes and relationships.
    In the case of your Favorite Cities application, you will have entities consisting
    of states and cities. There will be a one-to-many relationship between them, meaning
    that any given state can contain multiple cities.


    Attributes for the cities will consist of the city name and whether or not it''s
    a favorite. Attributes on the state will consist of just the name. This, in a
    nutshell, is the exact data model that you used previously in this application.
    The only difference is that you are going to define it using the data model application
    and it will be persisted into a database through Core Data.


    # Defining entities


    So, to begin, let''s add an entity of type "City". To this, click the plus under
    the entity panel in the modeling tool. Rename the added entity to City. Next,
    click the plus in the Property panel to add an attribute to the city called "name".
    Do the same again, but this time, add an attribute called "favorite". Make the
    name attribute a string type. Make the favorite attribute a Boolean type and set
    its default value to NO. Now you have your cities. Let''s add the states.


    To add the states, follow the exact procedure. Click the plus under the Entity
    panel, you name it State, and then add an attribute for "name". However, here
    you are going to do a little different: You need to define a relationship between
    the states and the cities. To do this, you are going to click the plus in the
    Property panel, but this time, you are going to add a relationship.


    > NOTE


    Entities can have a different types of properties, but even in the cases where
    the properties are basic types, they are still represented as objects when you
    access them. This means that when you access things such as floats or integers,
    you are actually receiving NSManagedObjects that you can retrieve the actual value
    from.


    # Defining relationships among entities


    When you add a relationship, you have an opportunity to select the destination
    of relationship. What you need to do is define a relationship where the State
    has a relationship with a destination of city. You''ll call this relationship
    "cities". You specify that it is a "To-Many" relationship, and you want the delete
    rule to be to "Cascade". What relationship means that a state contains many cities.
    When the state is deleted, you want the cities associated with it to be deleted.


    You also want to define the inverse relationship so that from the perspective
    of your city, you can move the city from one state to another. To do this, click
    the City entity, and add a property for the inverse relationship called "state".
    This time, be sure to specify it is the Inverse property of the relationship called
    "cities". From the perspective of the city, this is not a "To-Many" relationship.
    Furthermore, your delete rule from the perspective of the city should be the default,
    "Nullify".'
