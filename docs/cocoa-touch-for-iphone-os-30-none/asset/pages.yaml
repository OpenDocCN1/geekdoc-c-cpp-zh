    # Understanding What Core Data Makes Easier


    You''ve seen that Core Data can make working with databases and object models
    much simpler. In particular, complex object models containing multiple entities
    especially benefit from being designed using the entity designer. This makes building
    complex applications with difficult-to-visualize relationships very easy to work
    with.


    Additionally, virtually any application that manages tabular data can benefit
    using Core Data instead of storing it in a flat file or some other proprietary
    database.


    # Understanding What Core Data Is Not Good For


    It''s important to remember that Core Data has its limitations. Specifically,
    the types of files that it can use as a data store are relatively limited. On
    the iPhone, it really comes down to a binary flat file or sqlite database. The
    XML file format is not supported on the iPhone. Additionally, Core Data is not
    able to access external database servers as MySQL, PostgreSQL, Oracle, and so
    on.'
  merge: -1
  pgno: 253
- img_proc: true
  md: 'These limitations are minor, however when you consider the benefits that Core
    Data gives you for the specific problem set that it is trying to address. This
    problem set consists of any situation where you need to manage a local database
    of objects for your applications.


    # # Summary


    In this chapter, you''ve taken a look at the details of one of the most powerful
    new frameworks included in iPhone OS 3, Core Data. It''s fortunate that Apple
    has provided this excellent object persistence framework. Using it makes developing
    certain kinds of applications much easier and reduces development time.


    They say that the most bug-free code is that''s not written. By leveraging Core
    Data, you don''t have to worry about spending your time writing complicated, potentially
    buggy database abstraction layers for your applications. Instead, you can focus
    on your specific problem domain and the problems that you need to solve.'
