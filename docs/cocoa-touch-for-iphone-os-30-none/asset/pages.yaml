  md: '# Getting Started with the iPhone


    # CAUTION


    If IBOutlets or IBActions aren''t available in Interface Builder, first make sure
    you saved your changes. If they''re still not there, check for any typos. Interface
    Builder can''t read your code if it''s not syntactically correct.


    You now need to hold the Control key, click on the File Owner, and drag your mouse
    from the file owner to your label on the UI. Once you release the mouse button
    on the label, it brings up a Heads-Up-Display, or HUD-style window. In this window,
    you see an outlet for your label. Select it, and this connects the label instance
    to your label instance on the UI.


    Next, do the same thing for the text field to attach it to your text field outlet.


    Finally, you want to go in the opposite direction for your button. You hold the
    Control key, and drag-and-drop from your button to the File Owner. This again
    brings up a HUD-style window except this time, it shows the actions that you have
    defined. Because you''ve defined one action, it shows one action, which is setLabelushed::.
    Select this action, and it attaches to that action.


    At this point, you can exit Interface Builder, return to Xcode, and click the
    Build and Go button. This launches your application in the simulator.


    You can now touch inside the text field, and it brings up a keyboard. If you type
    something into the text field and then click the Push Me button, whatever you
    type into the text field is copied into the label.


    There you go! Congratulations, you''ve written a basic iPhone application.


    # Launching on the iPhone


    Now running on the iPhone simulator is great, but ultimately, you''re going to
    test your application on actual hardware. Why? Well, it''s important to realize
    that the simulator is running your application, it''s actually running the hardware
    capabilities of your computer. This means performance-wise, your application can
    behave quite differently in the simulator on your computer versus on an actual
    iPhone. These differences in hardware can even make certain bugs on an iPhone
    and not in the simulator.


    Not only running your app on an actual iPhone prudent for testing purposes, but
    there are also capabilities that are not available on the simulator that are available
    on the iPhone. These capabilities include the accelerometer, Core Location, and
    others. Conversely, there are also application programming interfaces (APIs) that
    are available only on the simulator and not on an actual iPhone. In the latter
    situation, you should obviously avoid those APIs. I mention it here because it
    is a common mistake that new developers make when coming to the platform. They'
  merge: -1
  pgno: 39
- img_proc: true
  md: '# Chapter 2: Building a Basic iPhone Application


    look at the documentation for Mac OS X on a particular API and assume that the
    API works the same on the iPhone. Because the simulator uses the desktop version
    of some libraries, when they test it on the simulator, their code appears appears
    to work. The end result, however, is that the application works on the simulator,
    but when the developer goes to compile for actual hardware, the compiler can''t
    find the requested API, resulting in an unresolved symbols compilation error.


    So the point is that you need to run your application on the iPhone or iPod Touch
    that you''re using for development. To do this, you need to obtain a development
    certificate from Apple, load the certificate into Xcode, and configure your build
    target to use it. Most of this process is related to the topic of distribution
    and uploading to the iTunes Store; therefore, I address this in the chapter that
    handles that subject.


    # CROSS-REF


    If you do not already have a development certificate, then you should probably
    visit that now and go through the process of getting one so that you can use it
    in the upcoming chapters. Once you have done this, return here and continue.


    > NOTE

    it costs $99 per year to be a registered iPhone developer.


    Have you got your certificate? Good, let''s proceed.


    Once you''ve installed your development certificate into Xcode, it''s a simple
    process to sign your application with your certificate and install it on your
    iPhone. Just pull down the target drop-down menu from the top of the window and
    choose Device for your target.


    At this point, if you click Clean and Build and Go, it builds your executable,
    downloads it onto your iPhone, and runs it.


    > NOTE

    it you''re using the Debug build, then you can actually run the debugger and debug
    on your actual device.'
  merge: -1
