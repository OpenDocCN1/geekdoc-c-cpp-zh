  md: 'The development certificate consists of an electronic document that you digitally
    sign using an encryption key on your computer. You then generate a certificate-signing
    request for that document, and send the certificate-signing request to Apple for
    them to sign. Once they have signed it, you download the signed version and install
    it in Xcode.


    The signed certificate, once installed in Xcode, is used to sign your applications.
    Only signed applications can be installed on an iPhone OS device. I will talk
    about the provisioning process that determines how an application can be distributed,
    but for now, simply understand that all applications are installed on iPhone OS
    devices must be signed.


    To generate your original certificate, you use the Keychain Access application
    in Mac OS X. Using it, you request a certificate from a certificate authority.
    Doing generates a private key and a public key. Your private key is stored on
    your computer and should be backed up. If your private key is lost, you can no
    longer sign apps.


    The iPhone portal has excellent few-by-step instructions for generating this certificate.
    I suggest that you read through the following sections so that you gain a better
    understanding of how the provisioning process works, and visit the iPhone portal
    and follow their instructions to generate your development certificate. Once you
    have your development certificate, you can return to this book and read how to
    install your development certificate in Xcode.


    # Understanding the Provisioning Process


    A provisioning profile is a collection of digital certificates and device IDs
    that specify a particular signing certificate can be used to sign an application
    and install it on a particular device.


    The provisioning process involves entering the unique device ID of devices you
    want to install your application on the iPhone developer portal. You then use
    these device IDs, and your certificates, to generate a provisioning profile. The
    provisioning profile is a file that you download from the iPhone developer portal.
    After you download the file, you install it in Xcode.


    > CAUTION


    You are limited to 100 device IDs that can be entered into the development portal.
    You cannot remove or overwrite them, but you reset your device list once a year.


    # Understanding development, distribution, and ad hoc


    In the realm of iPhone development, there are essentially three types of provisioning
    profiles.


    The first is called the development provisioning profile. This provisioning profile
    is used in conjunction with your development certificate to sign your applications
    and install them on your development devices. They''re meant to be used with only
    a few devices. When you create the'
  merge: -1
  pgno: 405
- img_proc: true
  md: '# Chapter 33: Code Signing Your Apps


    development provisioning profile, you specify the devices that are included in
    it. The generated profile can only be used in conjunction with those devices.
    Development provisioning profiles can also be used with Xcode and only on the
    machine containing the development certificate that was used to generate the profile.
    This is the provisioning profile that you use for your day-to-day development.


    The second type of provisioning profile is the distribution provisioning profile.
    The distribution provisioning profile is meant to be used for distributing your
    application on the App Store. Applications signed with a distribution provisioning
    profile cannot be installed on a test device. They can only be uploaded to the
    App Store and installed through a purchase.


    The third type of provisioning profile is an ad hoc provisioning profile. An ad
    hoc provisioning profile is like a cross between a development provisioning profile
    and a distribution provisioning profile. That is, to say, you can install it applications
    on specific test devices, but the installation process does not require Xcode.
    Ordinary users can install the application using iTunes. It requires devices that
    you want to install the application on be included in the provisioning profile.
    However, you can put as many as 100 devices on an ad hoc provisioning profile.
    Additionally, when you send the user the application, you also need to send them
    a copy of the provisioning profile itself. The user then drags and drops the provisioning
    profile and the application onto iTunes to install it.


    The ad hoc provisioning profile mechanism was originally designed for organizations
    that wanted to do their own distribution of applications and did not want to distribute
    the applications through the App Store. However, it is commonly used by iPhone
    developers for beta testing. Most testers are not developers and do not have the
    development tools installed. Using an ad hoc provisioning profile enables normal
    users to install applications using iTunes.


    # Installing provisioning profiles


    In order for an application to run on a particular device, it must contain a provisioning
    profile for that application. iPhone OS devices already contain provisioning profiles
    for applications from the App Store. In order to use your development provisioning
    profile or ad hoc provisioning with a device, you have to install it.


    There are two applications that can install provisioning profiles. The first is
    Xcode. To install a provisioning profile using Xcode, you simply drag-and-drop
    the provisioning profile file from the Finder into Xcode. Once you do this, the
    provisioning profile is available in the Xcode organizer. If you configure an
    application to build with that profile, it automatically installs the profile
    file when you build and run the application with the device connected.


    Figure 33.1 shows the Xcode window with the organizer displayed. The provisioning
    profile group on the left side allows you to manage your provisioning profiles
    that are installed within Xcode. When a device is connected, you can also see
    the provisioning profiles that are installed on that particular device. You can
    also manually add or remove provisioning profiles from that device using this
    interface.'
  merge: -1
  pgno: 406
- img_proc: true
  md: '# 384 Handling Distribution


    Figure 33.1

    The Xcode organizer window


    ![](img/0ccd1d097de6918b1df92faf66d987b6_407_0.png)


    The second application that can be used to install provisioning profiles is iTunes.
    iTunes has significantly less functionality when it comes to managing provisioning
    profiles, but it is much easier for nonprogrammers. To install a provisioning
    profile using iTunes, you simply connect your iPhone OS device to your computer,
    start iTunes, and drag-and-drop the provisioning profile to the Finder to iTunes.
    This installs the provisioning profile onto your device as well as into iTunes.


    # Exploring what happens when an app is signed


    All iPhone applications must be signed with a provisioning profile before they
    can be installed. Code signing is the last step of building an application for
    iPhone OS. When an application is signed, Xcode uses the certificate associated
    with the currently active provisioning profile to stamp the executable digitally
    with the information from the provisioning profile. This makes it so that the
    application can only be installed on devices that have the provisioning profile
    installed.'
  merge: -1
  pgno: 407
- img_proc: true
  md: '# Chapter 33: Code Signing Your Apps


    You can configure different Xcode targets for different provisioning profiles.
    A typical project contains a development target, which is used for installing
    and testing the application on the developer''s devices; a distribution target,
    which is used for distribution on the App Store; and sometimes, an ad hoc target,
    which is used for distributing the application to beta testers. In the next sections,
    I will show you the settings necessary for preparing your build to be signed with
    a provisioning profile.


    # Setting up your build to be signed


    Once you have your provisioning profile installed, you have to configure your
    build to use it. Figure 33.2 shows the Xcode build settings window. In the middle
    of the window are the settings for Code Signing.


    Figure 33.2


    Xcode build settings


    ![](img/0ccd1d097de6918b1df92faf66d987b6_408_0.png)'
  merge: -1
  pgno: 408
- img_proc: true
  md: '# 386 Handling Distribution


    The main setting that influences provisioning profile will be used the setting
    for Code Signing Identity. There are two wildcard settings for this: "iPhone Developer,"
    which matches your development provisioning profile, and "iPhone Distribution,"
    which matches your distribution provisioning profile. If you need to, you can
    also specify a specific provisioning profile by clicking this drop-down list and
    selecting a specific provisioning instance. In cases where you might have multiple
    development profiles installed, or when you want to do an ad hoc build, you need
    to explicitly set the profile. For typical use, however, the wildcard settings
    are usually adequate.


    NOTE

    Ad hoc provisioning profile is, in fact, a distribution profile.


    The only other setting you may have occasion to change would be the Code Signing
    Entitlements setting, which I will discuss shortly.


    # Doing Ad Hoc Builds


    Ad hoc builds allow you to distribute a build directly to end users without going
    through the App Store. You can provision up to 100 devices using an ad hoc provisioning
    profile.


    Doing an ad hoc requires special configuration of your build, and distributing
    the provisioning profile to your users along with the application.


    # Configuring the build in Xcode


    Configuring a build for ad hoc distribution involves several steps. First, you
    should make a copy of whatever build settings you want to use with your ad hoc
    build. This is easily done in the Configurations tab of your Project Information
    window, by clicking the Duplicate button for whatever build configuration you
    want to use. For beta testing, you will probably duplicate the Debug settings.
    Once you have your new ad hoc build configuration, you should choose it as your
    active configuration.


    Figure 33.3 shows the build configurations tab with an ad hoc build.


    Ad hoc builds require a special property list to be included with the build. This
    property list is called the Entitlements list. Typically, it''s called Entitlements.plist
    and should be added to the resources group of your project.'
  merge: -1
  pgno: 409
- img_proc: true
  md: '# Chapter 33: Code Signing Your Apps


    Figure 33.3


    The build configurations tab


    ![](img/0ccd1d097de6918b1df92faf66d987b6_410_0.png)


    The Entitlements.plist file should contain a single property called get-task-allow.
    This property should be a Boolean value and should be set to FALSE. This flag
    configures whether your application allows the debugger to be attached to it while
    it is running. Distribution profiles (and remember, ad hoc is considered distribution)
    require that this flag be set to FALSE.'
  merge: -1
