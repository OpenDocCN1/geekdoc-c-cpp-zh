  md: "In addition to updating your drawRect: method, you also need to initialize\
    \ these member variables. For this example, your custom UIView is being instantiated\
    \ from a nib file. This means that your designated initializer, initWithFrame:,\
    \ is not called. Instead, you need to override the method awakeFromNib, which\
    \ is called when your view is instantiated by the nib and is the appropriate place\
    \ to initialize member variables. The code for this method is shown in Listing\
    \ 11.4.\n\n# Listing 11.4\n\n# Implementation of the awakeFromNib Method\n\n```\n\
    (void)awakeFromNib:\n    circleRect = CGInset([self frame], 100, 165);\n    moving\
    \ = NO;\n    [super awakeFromNib];\n```\n\n> NOTE\nYou are still initializing\
    \ your member variable version by using the frame to to set your initial size.\
    \ Once it's set, though, you are free to update it at any time before you redraw\
    \ it.\n\nIn order to make it easy to set the new location of your circle, I've\
    \ added a small utility function that sets the origin on your circle at an offset\
    \ from the given point so that the center of your circle tracks your touches.\
    \ This method is called setCircleCenter: and is shown in Listing 11.5. Add this\
    \ method to your implementation as well so you can use it later.\n\n# Listing\
    \ 11.5\n\n# Implementation of the setCircleCenter: Method\n\n```\n(void)setCircleCenter:(CGPoint)centerPoint:\n\
    \    CGSize cellSize;\n    centerSize.width = circleRect.size.width/2;\n    centerSize.height\
    \ = circleRect.size.height/2;\n    circleRect.origin.x = centerPoint.x - cellSize.width;\n\
    \    circleRect.origin.y = centerPoint.y - cellSize.height;\n```"
