    # CAUTION


    It may be tempting to utilize this method with a background thread to get around
    the fact that it blocks. You should avoid doing this if possible. Writing thread-safe
    code is a tricky business, with little benefit on a single-processor machine such
    as the iPhone. You''re much better off using the asynchronous mechanisms for networking
    instead.


    # Using NSURLRequest and NSURLConnection


    Probably the best mechanism for downloading content from the Web in Cocoa Touch
    is the combination of classes NSURLRequest and NSURLConnection, which together
    form a powerful mechanism for asynchronously downloading content from the Web.


    NSURLRequest encapsulates a request for a particular resource, enabling you to
    configure certain options such as timeout, the base URL, and so on. Once you have
    an NSURLRequest, you pass it to an NSURLConnection to actually perform the request
    and the data. The NSURLConnection uses a delegate pattern to enable you to customize
    specific behavior with regard to the actual loading of the data. For example,
    the delegate of the NSURLConnection contains methods that are called as data is
    received, and another delegate method that''s called when the request has completed.


    To start the download of a resource from the Web using NSURLConnection, you first
    create an NSURLRequest, and then use it to create an NSURLConnection, using one
    of its initializers, such as initWithRequest:delegate:: Then you call the method.


    If you need to cancel a request while it is loading — for example, in response
    to a user clicking a Cancel button — you can cancel the method on the NSURLConnection.


    Table 19.1 shows the most frequently used methods for NSURLConnection. To utilize
    them, you would implement them in a class in your application, and set an instance
    of that class to be the delegate of your NSURLConnection.'
