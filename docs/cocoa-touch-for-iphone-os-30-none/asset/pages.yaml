  md: '# Accessing the iPod Library


    A new feature that was added to iPhone OS 3 was the ability to access the iPod
    media library. This is enabled through the Media Player framework. Using the Media
    Player framework, you can perform a variety of tasks with the user''s iPod media
    library. For example, you can search for items, access the user''s playlists,
    and play audio items from the library. The Media Player library includes support
    for all audio types that the iPod can play. This capability has several potential
    applications. For example, imagine a car-driving game that enables you to tune
    the radio to a radio station that plays media from your iPod library. Or imagine
    a skiing game that enables you to program a virtual iPod to play your media while
    you ski the slopes. The possibilities are endless.


    In this chapter, you''ll see how to leverage the Media Player framework to access
    and play elements from the user''s iPod library. When you''re finished, you should
    be able to use this capability in your own applications.


    # Working with the Media Player Framework


    The Media Player framework provides a variety of classes for working with the
    iPod library. At its core, songs are represented by the MPMediaItem class. When
    working with songs, the MPMediaItem class will create the objects that are returned
    from the iPod library and that you use to tell the iPod what to play.


    To query songs, use the MPMediaPredicate and its subclass MPMediaPropertyPredicate,
    in conjunction with the MPMediaQuery class, to construct queries that return lists
    of MPMediaItems. Alternatively, you can present the user with a view controller
    that they can use to select the songs directly from their library. The class that
    you use to do this is the MPMPickerController. It encapsulates an entire user
    interface that enables the user to select media from their iPod library.


    ![](img/0ccd1d097de6918b1df92faf66d987b6_342_0.png)


    +   Browsing the iPod Library using the MPMediaPicker Controller

    Searching for a song by artist, album, or playlist

    Controlling the built-in iPod application from your application

    Playing audio from the user''s iPod library within your application'
  merge: -1
