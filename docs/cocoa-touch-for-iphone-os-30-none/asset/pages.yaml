  md: '# Building GUIs


    There are also several disadvantages with this technique. The first is that because
    it launches Safari, it exits your application. This means that any state that
    the user had going at the time that she launched the URL is probably going to
    be lost. Additionally, it can be quite jarring experience for the user to be sent
    out of your application and over to Safari.


    Considering whether to use this technique for displaying Web content, be sure
    to carefully weigh these advantages and disadvantages. A good example of this
    kind of interaction might be if you have a link inside your application that takes
    the user to more of your company''s products. In this case, the user is probably
    expecting to exit your application and go to your Web site.


    To utilize Safari in this way, you first need NSURL containing the URL you want
    to access. You can create this using the NSURL initializer, initWithString: or
    the factory method initWithString:: Next, you use the UIApplication sharedApplication
    method to get the UIApplication singleton for your application. Finally, using
    the UIApplication singleton, passing the URL that you created. Listing 16.1 shows
    how this is.


    # Listing 16.1


    # Opening a URL in Safari


    ```

    - (void)loadCompanyHomepage {

    NSURL *url = [NSURL initWithString:@https://my.company.com/];

    UIApplication *app = [UIApplication sharedApplication];

    [app openURL:url];

    // here your application will terminate and

    // safari will load with your content displayed

    }

    ```


    > You can also open URLs that are handled by other applications. If an application
    is registered to handle a particular URL type, opening its URL in this way exits
    your application and launches that application. You can pass any sort of data
    you want on the URL that you open. This can provide an interesting way of doing
    inter-process communication.


    # Using UIWebView


    The next way to leverage Safari in your application provides for a much more integrated
    user experience. Specifically, I''m talking about using a UIWebView in your application.
    By using a UIWebView you can actually embed a Web browser directly into your application.
    This'
