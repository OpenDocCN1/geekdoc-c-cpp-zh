    # Handling phone calls and sleep


    Some of the more important status messages that you can receive via the UIKitDelegate
    are those that indicate the phone has been put to sleep by the lock button, or
    that an incoming phone call has temporarily interrupted the application. Games
    in particular probably want to pause the action during these events. You may also
    want to save your game application state. The notifications are sent in these
    circumstances are the applicationWillDidEnter and applicationDidBecomeActive;
    which are called when the application is interrupted, and when control returns
    to the application after the interruption, respectively.


    In the event that the interruption has been caused by an incoming phone call,
    the user is presented with a dialog giving them the option to take the phone call.
    If they do, completely returns to the application, and the application terminates
    as if the user had pressed the home button. This means that the applicationWillTerminate:
    method is called as well.


    # Changing status


    The final status messages that you receive are related to changing the size and
    orientation of the status bar. For example, when a phone call is received, the
    status bar can grow in size to indicate that the user is on a phone call. Your
    application should be aware of the possibility of these changes and be prepared
    to adjust your UI to allow them.


    The first of these notifications concerns the orientation of the status bar. These
    are received using the methods application:willChangeStatusOrientation:duration:
    and application:didChangeStatusBarOrientation; which are sent before and after
    the status bar has changed its orientation, in both cases, you receive the new
    status bar orientation as a parameter to method.


    The next of these notifications, which are probably a bit more useful, are the
    notifications surrounding changes in the frame of the status bar. These are the
    application:willChangeStatusFrame: application:didChangeStatusFrame; methods.
    Like the status bar orientation messages, you receive information about the status
    bar''s frame before and after the change, and you should use this information
    to adjust your own UI to make room for the new status bar size.'
