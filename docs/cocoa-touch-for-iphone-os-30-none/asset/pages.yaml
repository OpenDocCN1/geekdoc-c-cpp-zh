  md: '# Enabling and disabling auto correction


    The next setting to look at is auto correction. You can enable or disable auto
    correction by setting the auto correction property. When auto correction is enabled,
    words are suggested to the user as she is typing, and if she doesn''t want the
    suggested correction to occur, then she needs to touch the screen where the word
    is to remove the suggested correction. If you disable the auto correction feature,
    no words are suggested to the user as she is typing, and the input box does not
    attempt to complete the words that she is typing. This is a good idea for fields
    where you know the words are typically not going to be in the iPhone dictionary,
    terms such as URLs for Web sites and so on.


    ![](img/0ccd1d097de6918b1df92faf66d987b6_185_0.png)


    > CAUTION

    If the user has chosen to disable auto correction in settings, this will override
    what you set here. This is important to know, in the event you enable auto correction,
    but you don''t see it working. This might be why.


    # Setting the keyboard type


    The next setting is for the keyboard type. Figure 13.3 shows several of the available
    keyboard types that you can choose from.


    Figure 13.3


