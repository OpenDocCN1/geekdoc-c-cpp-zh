  md: '# Integrating Safari


    Not only is the iPhone a great phone and great multimedia device, but it also
    has superb Internet capabilities. Among those capabilities is one of the best
    Web browsers available on any mobile platform. That Web browser is Safari. When
    developing Safari for the iPhone, Apple leveraged its previous technology from
    Safari on the desktop and developed a Web browser that not renders pages excellently,
    but also provides a wonderful mobile user experience. It provides this experience
    by effectively utilizing the touch screen on the iPhone so that interactions with
    the Web browser are incredibly intuitive. An example is the Zoom feature, which
    uses a pinch gesture.


    From a developer''s point of view, Apple has also provided you with an excellent
    API for working with Safari. You can open URLs within your application that cause
    Safari to load and display Web content. You can also embed a Safari browser right
    into your applications that you can use it to display Web content by downloading
    URLs and display local content, such as files included in your application bundles.


    In this chapter, you are going to take a look at how to do of these things. The
    code is very straightforward, and so there''s not much to it. However, by leveraging
    what you learn in this chapter, you can provide a richer experience to your users.


    # Opening URLs Using the iPhone Web Browser


    The first way to integrate Safari with your application is to allow users to open
    URLs within your application and then launch the iPhone Web browser externally
    with the URL loaded.


    The advantage of this technique from a user''s point of view is that the user
    can then stay in the browser, navigate the Web site, and so on. Essentially, you
    are handing off the user to your Web site.


    ![](img/0ccd1d097de6918b1df92faf66d987b6_212_0.png)


    # In This Chapter


    +   Opening URLs in Safari

    Integrating a Web browser into your app with UIWebView

    Displaying HTML files from your application bundle'
