  md: "# Handling Startup and Shutdown\n\nThe first and foremost purpose of the UIApplicationDelegate\
    \ is to handle the startup and shutdown of your application. It does this through\
    \ the implementation of several methods, which are listed in Table 9.1.\n\n# Table\
    \ 9.1 Methods Used for Startup and Shutdown\n\n| Method Signature | Description\
    \ |\n| --- | --- |\n| - (void)applicationDidFinishLaunching:(UIApplication*) |\
    \ This is the first method in your application that is called when your application\
    \ finishes launching to the iPhone OS. This is a good place to perform operations\
    \ such as restoring state or setting up global variables. |\n| - (BOOL)application:(UIApplication*)\
    \ didFinishLaunchingWithOptions:(NSDictionary*) launchOptions | This is an alternative\
    \ to the method didFinishLaunching, and if your application delegate implements\
    \ it, then it is called in favor of that method when the iPhone OS receives a\
    \ remote notification for your application or if another application has opened\
    \ a URL request for a type that your application handles. |\n - (void)applicationWillTerminate:(UIApplication*)\
    \ application | This is the last method in your application delegate that is called\
    \ as your application is exiting.\n\n# Understanding launch methods\n\nThe methods\
    \ used in launch, applicationDidFinishLaunching; and application:didFinishLaunchingWithOptions;\
    \ are called when your application is finished-launch. The first method, applicationDidFinishLaunching;\
    \ was the only one available in iPhone OS 2.0 and is generally what you will use\
    \ in most applications. Usually this is used for application initialization and\
    \ adding your initial views to your main window.\n\nThe second method, application:didFinishLaunchingWithOptions;\
    \ is new with iPhone OS 3, and if implemented on your UIApplicationDelegate is\
    \ called in favor of the older method. It was added so that an application could\
    \ easily handle tasks such as remote notifications and opening URLs. When the\
    \ iPhone OS receives a notification, it examines the notification to determine\
    \ what application handles that type of notification. If the user chooses to view\
    \ the notification, then the application is launched and the options parameter\
    \ for this method includes a dictionary containing data from the notification.\
    \ You will look at this method in more depth in Chapter 20.\n\nAnother case where\
    \ this method is called when another application has requested the operating system\
    \ handle a URL of a type that your application has previously registered as"
  merge: -1
