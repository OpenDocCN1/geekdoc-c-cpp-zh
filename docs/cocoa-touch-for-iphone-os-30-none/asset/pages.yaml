  md: '# Working with Other Controls


    You''ve seen how to create your own custom UIViews. You''ve also seen how to work
    with some of the basic controls. In this chapter, you''ll take a look at some
    of the other controls that are available in Cocoa Touch and then see how you can
    use of those controls in your application.


    The important thing to remember is that Cocoa tends to use the same design patterns
    over and over again. This means that if you learn how to work with a few controls,
    it makes working with all of the controls easier. In particular, you''ll notice
    extensive use of the delegate pattern and the data source pattern in most of these
    controls.


    This is one of the things that Cocoa Touch great, the fact that the designers
    of these APIs used well-known design patterns to guide you and reuse these design
    patterns over and again for different types of components. If you learn these
    design patterns thoroughly, then you''ll have no whatsoever working with any of
    the components available in Cocoa Touch.


    # Finding What Other Controls Are Available in Cocoa Touch


    Cocoa Touch provides a rich library of user interface (UI) elements to use in
    your applications. The components available to you include switches, sliders,
    buttons, progress indicators, tab bars, segmented controls, and much more. I could
    fill an entire book just talking about the different types of components available
    and how to use them. The collection that I''m going to talk about here is just
    a small sampling that represents different styles of programming interfaces.


    The first component you''ll look at is the UISlider. I am using this as an example
    because it represents a basic control. You place it on your parent view, set its
    properties, and then forget it. If you need more information about it, you can
    simply access it from one of your IBlets.


    | Working with different kinds of components in your UI |

    | Using a UISider to take variable input from the user |

    | Using a UITabBar to control a set of controllers |

    | Configuring a UIPickerView |'
  merge: -1
  pgno: 170
- img_proc: true
  md: '# 148 Building UIKit


    The second component that you''re going to look at is a UITabBar. I chose this
    one because its used in conjunction with other views to control which view is
    the currently displayed. It is a pretty complex component but shares some similarities
    with features such as navigation controllers and so on.


    The third and final component that you''re going to look at is a UIPickerView.
    The interesting thing about UIPickerView is that it provides both a delegate interface
    and a data source interface to configure its components and enable you to take
    action when the component is used. This is a really common pattern in Cocoa Touch.
    You''ve already seen it with UITableView and you will see it in use elsewhere.


    Again, this is not a comprehensive list of all the components in Cocoa Touch.
    The goal here is to look at a set of representative components and allow you to
    take the knowledge that you gain from working with them and apply it to other
    components. To explore all of the different components available in Cocoa Touch,
    I suggest you look through the Interface Builder object selection palette and
    drag-and-drop components onto a test window to see how they look. Then look through
    the Apple documentation on the component''s class. The documentation will tell
    you exactly what is necessary to utilize component.


    # Working with a UISider


    The UISider is the most basic of the components that you will be looking at in
    this chapter. It''s really simple to work with.


    The purpose of the UISider is to provide the user with an interface for setting
    a variable numeric value via a sliding control. The range of values that can be
    represented by the UISider is entirely up to you and configured when you set up
    the UISider. To set the initial value of the UISider, there are some simple methods
    that you use via an IBOut from your controller or by directly accessing its instance
    variable. Figure 12.1 shows what a UISider looks like on a typical iPhone application
    screen.


    # Configuring a UISider through Interface Builder


    To add a UISider to your application, simply drag-and-drop it from the object
    selection palette onto whatever view you want to place it in. With all other GUI
    components in Cocoa Touch, UISider is a view, and so meaning that you can also
    add it programmatically by simply creating a UISider and calling addSubview: to
    the parent view.


    The most important properties to configure on a UISider is its Minimum value,
    Maximum value, and Initial value. Figure 12.2 shows the properties for a UISider
    in Interface Builder. The Continuous property determines whether or not the UISider
    sends continuous updates of its value as the user is sliding. If you set this
    property to true, then as the user is adjusting the slider, you receive continuous
    updates. If you set this property to false, then you only receive an update when
    the user lifts her finger from the slider after setting to its final position.


    ![](img/0ccd1d097de6918b1df92faf66d987b6_171_0.png)'
