    # Implementing a Ruby push notification supplier


    To implement this push notification supplier in Ruby, you''re going to use Ruby''s
    built-in support for OpenSSL, connect up and send the message, and then disconnect.
    There are certainly other ways to do this. In particular, you really should not
    connect, send, and then disconnect for every single message; in fact, if you do
    this, Apple will probably assume that you are attempting to attack their servers
    and will revoke your certificate. The APNS model is based on the idea that you
    can connect, stay connected, and just stream your messages as needed. There are
    also ways to do it in other languages, such as Perl, Python, or C.


    So, without further ado, let''s take a look at the code. Listing 20.1 shows the
    code for a push notification supplier in Ruby.


    +   20.1


    # A Push Notification Supplier Implemented in Ruby


    ```

    #!/usr/bin/ruby

    # .notify.rb ''<device token>'' ''<message text>''

    require ''socket''

    require ''openssl''

    # just checking our arguments...

    ```


