    have requested it to record already exists, it automatically overwrites that file.
    AVAudioRecorder also provides the method recordForDuration, which causes the AVAudioRecorder
    to record only for the time period requested. Pause and stop recording, there
    are methods specifically for pausing and stopping. Finally, if you decide that
    you want to remove the audio file you have recorded, the method deleteRecording
    deletes the file from disk.


    > NOTE

    To delete a recording, the audio recorder must be stopped.


    AVAudioPlayer, the AVAudioRecorder also has the ability to monitor audio meters
    for the input. Just like before, you call the updateMeters method to update the
