- img_proc: true
  md: '# Chapter 20: Using the Push Notification Service


    Figure 20.3

    Push message format


    | 1 byte | 2 bytes | 32 bytes | 2 bytes | Payload length bytes |

    | --- | --- | --- | --- | --- |

    | Command | Token length | Token | Payload length | Payload |


    This format consists of the first byte being a command byte of 0. The next two
    bytes indicate the length of the following field, which is the device token. After
    the token length is a 32-byte value giving the device token. Following the device
    token are two bytes to indicate the length of the payload. Finally, the remaining
    length of the message, based on payload length, consists of your JSON-encoded
    payload dictionaries.


    All lengths specified in the format are to be big endian.


    # Understanding the feedback message


    The feedback service uses a similar binary format to communicate to you the device
    tokens of the devices that are not receiving your notifications. Figure 20.4 shows
    the format of the message.


    Figure 20.4

    Format of a feedback message


    | 4 bytes | 2 bytes | 32 bytes |

    | --- | --- | --- |

    | time t | Token length | Token |


    Essentially, this message consists of three components. The first component, "time_t",
    indicates the timestamp at which the push notification service determined that
    the application no longer exists on the device and thus is no longer registered
    to receive the notifications. The second element is the length of the device token.
    And the third element is the device token itself.'
