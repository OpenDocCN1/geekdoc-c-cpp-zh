  md: '# # Building Cinematic UIs with Core Animation


    One of the cornerstones of the iPhone UI is its use of animation to build what
    Apple calls a “Cinematic User Experience.” A cinematic user experience is essentially
    one where the user elements don''t simply pop into view; instead, they slide,
    fade, and otherwise transition into position using animation. The judicious use
    of animation provides what can be described as a certain weight to the user interface
    elements. They feel more realistic because of the use of animation. This results
    in a UI that is more intuitive, and easier to use.


    Because of the ubiquity of animation in iPhone OS, Apple has provided you with
    several very convenient APIs for using animation within your applications.


    In this chapter, I''ll talk about each of these techniques, and see how you can
    apply them in your applications.


    # # Using the UIView Animation Methods


    The first, and simplest, method for doing animation in iPhone OS 3 is by using
    the capabilities built right into the UIView class.


    The UIView class contains several class methods that you can use to do simple
    animations of your views. Because all user interface elements inherit from UIView,
    this means this capability is already built into all of your apps; you only utilize
    it, and utilizing it is incredibly simple.


    Core Animation methods work by setting up animation blocks within your code using
    the UIView class methods begin Animations:context: and commitAnimations. Then,
    any changes you make to UIViews within that block, such as moving, resizing, or
    changing their color, are automatically animated for you. It is as simple as that!
    This is incredibly powerful and easy to use when you are animating the repositioning
    of UI elements in your applications.


    | In This Chapter |

    | Using UIView class methods to animate user interface elements |

    | Using CALayer to do more complex keyframe animation |

    | Using UIImageView animated images to display rendered animations |'
