- img_proc: true
  md: 'The developers of the simulator chose to simply ignore some of these features,
    such as the accelerometer, altogether. This makes sense, because it would be extremely
    difficult to develop a way of simulating accelerometer interaction with a desktop
    computer. Even if you were developing on a laptop, imagine having to shake your
    laptop to interact with the accelerometer in the simulator. The iPhone has a solid-state
    drive, and so it has nothing that can be damaged when it is shaken, tilted, or
    otherwise manipulated. Most computers do not have this luxury.


    When it comes to other features, such as Core Location, the simulator allows testing
    with those features, but it simulates the operation of hardware in a test mode.
    This means your code will work, but will have only test data fed to it.


    Finally, there is the ubiquitous multi-touch, which is in a lot of ways the defining
    feature of iPhone and iPad touch interactivity. The simulator allows you to simulate
    multi-touch through a variety of hotkeys.


    Let''s visit each of these subjects in turn.


    # Simulating multi-touch


    There probably isn''t a more defining feature for iPhone applications than the
    multi-touch screen. This is such a fundamental interaction with iPhone applications
    that Apple has even patented it. As a result, it is not surprising that the simulator
    provides several methods for simulating multi-touch when working with your application.


    To enable a multi-touch, hover your mouse over the interface in the simulator,
    and press and hold the Option key on your keyboard. This brings up two circles
    that indicate the locations where the multi-touch will be activated when you press
    the mouse button. To move these circles up and around around the screen together,
    hold the Shift key while continuing to hold the Option key. This enables you to
    move the multi-touch interactor around the screen.


    Once you have positioned the circles where you want them, press the mouse button,
    and get a multi-touch event for the locations you chose.'
  merge: -1
  pgno: 43
- img_proc: true
  md: '# Chapter 3. Exploring the Simulator in Depth


    CAUTION

    Multi-touch events on the simulator are always simulated with both touches coming
    at the beginning of the event in perfect synchronization with each other. In practice
    on actual hardware, the two fingers do not actually touch the screen at precisely
    the same moment; as a result, you should be prepared to transition from a single
    touch event to a multi-touch event when you have detected that this has occurred.


    CROSS-REF

    Multi-touch events are discussed in more detail in Chapter 11.


    # Simulating Core Location

    Core Location is the application programming interface, or API, that is used on
    the iPhone to determine your location using a combination of GPS, cellular triangulation,
    and Wi-Fi access point mapping.


    CROSS-REF

    I discuss Core Location in greater detail in Chapter 30.


    Core Location is a somewhat complicated feature to test in the simulator. There
    aren''t many (any?) desktop computers that have built-in GPS capabilities. As
    a result, when using Core Location in the simulator, it simulates only one location.
    That location, naturally, is Cupertino, California, the head-quarters of Apple.
    Figure 3.1 shows the Core Location demo application in the simulator, showing
    the location that Core Location returns when used on the simulator.


    Unfortunately, this is all that the simulator is capable of doing. So if you need
    to test an application that requires more detailed interaction with Core Location,
    then you need to run it on actual hardware. Still, you can probably limit this
    in your application to just testing your location awareness code. Then, once you''re
    certain that''s working, you can just run it in the simulator and pretend that
    you work at Apple.'
  merge: -1
