    \ GKVoiceChatService bundles its configuration information and its voice initiation\
    \ data into an NSData and calls the method voiceChatService:sendData:toParticipantID:\
    \ on your client. Your client then forwards that through its networking code over\
    \ the network to the remote client, which receives the data and forwards NSData\
    \ to its instance of GKVoiceChatService via the method receivedData:fromParticipantID:.\
    \ This establishes the chat connection by negotiating the type of codec to use\
    \ and so forth. Both clients then send and receive data packets by the methods\
    \ voiceChatService:sendToParticipantID: and receivedData:fromParticipantID: as\
    \ the users talk.\n\nFinally, when you're ready to discontinue voice chat and\
    \ disconnect from your peer, you can call the method stopVoiceChatWithParticipantID:\
    \ on the GKVoiceChatService. This subsequently calls the method voiceChatService:didStopWithParticipantID:error:\
    \ on your client class, giving you the opportunity to disconnect from the peer.\n\
    \nGKVoiceChatService also provides methods to enable you to monitor and adjust\
    \ audio properties using voice chat. In particular, it allows you to do things\
    \ such as mute the microphone, modify remote participant volume, and monitor levels\
    \ both on input and output. To find out more, see the GKVoiceChatService documentation."
