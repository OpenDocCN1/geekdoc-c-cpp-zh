  md: '# Create dynamic applications for the iPhone


    Join the gold rush to developing cool apps with this complete iPhone OS 3 developer''s
    guide. Professional developer Jiva DeVoe speaks your language, and he talks you
    through the entire process—from explaining Cocoa Touch and the iPhone SDK to using
    Xcode and the Game Kit API. Follow step-by-step tutorials, then apply practical
    tips on signing and selling your applications. Even if you''re new to iPhone development
    you''ll soon be cranking out great code.


    +   * Walk through Xcode, Interface Builder, and other key tools

    * Build simple or complex GUIs with navigation and custom views

    * Implement a database with Core Data, and design your schema in Xcode

    * Learn to use the iPhone''s signature multi-touch capabilities in your applications

    * Work with the Apple Push Notification Service

    * Use the Map Kit API to create apps with embedded maps

    * Record audio, play video, and access the iPod Library

    * Set up your developer certificates and code sign your apps

    * Use Store Kit to sell expanded features and content within your apps


    Access the latest information on Apple development


    Visit www.wileydreference.com for the latest on tools and techniques for Apple
    development, with all specific code snippets and examples from this book.


    Jiva DeVoe, founder of Random Ideas, LLC, a software company specializing in iPhone
    and Mac OS X applications, has been writing software for nearly 25 years. His
    iPhone apps have been featured as Apple staff picks and in Apple ads. They have
    received several awards including being chosen as among the Top 10 apps and games
    in the App Store. Contact Jiva through his blog at www.random-ideas.net.


    ![](img/0ccd1d097de6918b1df92faf66d987b6_451_0.png)'
