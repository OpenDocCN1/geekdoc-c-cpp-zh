    # Adding a WebView to your application


    To add the WebView to your application, simply create a new view and its accompanying
    view controller, drag-and-drop a WebView from the object selection palette, and
    place it as a subview of the main view for your view controller. Connect it to
    an IBOutlet on your view controller and set your view controller to be its delegate.
    You may also want to configure the options that are available, but usually the
    default settings are suitable for most applications.


    Of course, as usual, WebView is just a view and can also be added as a subview
    of view programmatically.


    # Loading a URL


