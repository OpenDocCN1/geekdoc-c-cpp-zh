  md: "Once you have created the UINavigationController, you need to add the UINavigationController’s\
    \ view as a subview of your window so that it is displayed. This can be done in\
    \ your applicationDidFinishLaunching method on your application delegate. A typical\
    \ implementation is shown in Listing 8.1.\n\n# Listing 8.1\n\n# Implementation\
    \ of the applicationDidFinishLaunching\n\n```\n(void)applicationDidFinishLaunching:(UIApplication\
    \ *)application\n  // Override point for customization after app launch\n  [window\
    \ addSubview:[navigationController view]];\n  [window makeKeyAndVisible];n\n```\n\
    \nThis code adds the navigation controller as a root view in your application.\
    \ For example, if you have a game primary interface that is a UIView, then you\
    \ probably don't want this to be the case. you probably don't want game’s main\
    \ view to be wrapped in a UINavigationController, but you might want to use a\
    \ UINavigationController somewhere deeper in the game, for example, for settings.\n\
    \nTo do this, this same pattern can be used anywhere in your application as well.\
    \ The view property of the UINavigationController is the view that is used to\
    \ display the UINavigationController itself, and can be used anywhere you would\
    \ use any other UIView. To display your UINavigationController in an arbitrary\
    \ place in the nib file where it’s going to be displayed, and add the navigation\
    \ controller as a subview of whatever you want to display over the top of it.\n\
    \nTypically, you may want to animate the display of the UINavigationController.\
    \ The navigation controller’s view is just like any other view and can be animated\
    \ using the UIView\n\nThe UINavigationController even inherits from UIViewController.\
    \ This means, theoretically, that you can use a UINavigationController anywhere\
    \ that you might use a UIViewController instead. This includes, for example, using\
    \ the UIViewController method presentModalViewController:animated: to display\
    \ the UINavigation Controller modally."
