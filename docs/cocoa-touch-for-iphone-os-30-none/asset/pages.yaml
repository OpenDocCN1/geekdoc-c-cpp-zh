    # Basic drawing operations


    Once you have a Core Graphics context, you can begin drawing in it. The first
    thing you''ll probably want to do with your new graphics context is to set your
    drawing colors. There are two functions that you can use to set these colors;
    the first is CGContextSetStrokeColorWithColor(),allows you to configure the stroke
    color for drawing, and the second is CGContextSetFillColorWithColor(),allows you
    to configure the fill path. In addition to these, there are other methods that
    enable you to configure such as patterns, shadows, glyphs, line caps, and a variety
    of other settings to help you your drawing. For these simple examples, I''ll stick
    to the basics.


    The stroke color controls the color that is used to draw lines and to draw the
    outline of paths and objects. The fill color determines the color that is used
    to fill in enclosed objects, as circles, squares, and paths. For example, if you
    draw an ellipse, the inside of the ellipse is drawn with the fill color and the
    outside edge is drawn with the stroke color.


