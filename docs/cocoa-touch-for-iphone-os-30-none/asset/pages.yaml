  md: 'Just as dealing with the catalog user interface, this area of implementation
    is completely up to you. The important thing is that it must be persisted. The
    Store Kit framework does not provide any mechanism for persistence of purchases.
    You should store, either in your UserDefaults or some other mechanism, a record
    of exactly what the user has unlocked and purchased. You should check the settings
    when your application starts up and ensure that whatever content the user is entitled
    to have access to.


    An important item to note here, however, is that when the transaction is completed,
    you should unlock the content right away. Users expect their content to be immediately
    available in the application after purchase. You should not make them wait to
    receive their new functionality.


    # Restoring purchased content


    The last component of working with in-app purchases is that restoring purchases
    when the user wipes his phone or reinstalls your application. If you choose to
    provide in-app purchase support, you should also be sure to support restoring
    the user''s purchases. To do this, you should include a Restore button somewhere
    in your user interface. When the user pushes the button, you should use the SKPaymentQueue
    instance method, restoreCompletedTransactions. This causes your SKPaymentQueue
    delegate to receive new transactions for all purchases the user has ever made
    with your application. The transactions state is SKTransactionStateRestored, and
    you are expected to process the transactions as I showed you in the previous section
    — that is, unlocking the content.


    ![](img/0ccd1d097de6918b1df92faf66d987b6_421_0.png)


    > NOTE

    Restoring purchases is also how a user can transfer purchases from one device
    to another without repurchasing the item.


    34.6 shows how this is done.


    34.6


    # Restoring the User’s Purchases


    ```

    [SKPaymentQueue defaultQueue] restoreCompletedTransactions();

    ```


    ![](img/0ccd1d097de6918b1df92faf66d987b6_421_1.png)


    > NOTE

    You might ask the question, "why can''t I simply restore completed transactions
    every time my application starts up?" The answer is that when you request to restore
    completed transactions, the user is prompted for their App Store username and
    password. This would be very annoying to have to do every time your application
    launches. Therefore, only do it in response to the user specifically requesting
    it.'
  merge: -1
