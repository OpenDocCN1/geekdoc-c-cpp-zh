  md: '# Handling Text Input


    Most applications allow some kind of textual input to be used with them. Whether
    it''s text, phone numbers, or whatever, more than likely during your career as
    an iPhone app developer you''re going to work with text input.


    Another of the unique features of the iPhone is its on-screen keyboard. Using
    it, the iPhone can be adapted to display different kinds of alphabets, symbols,
    and so forth. The text system that provides this variety of capabilities that
    can be utilized by developers, allowing them to select the kind of capitalization,
    the kind of letters displayed, and the type of auto correction to use, among other
    things.


    In this chapter, you''re going to take a look at how you can configure the keyboard,
    both through Interface Builder and through code. You''re also going to look at
    how you handle events that occur with the keyboard, such as when the text changes
    or when the user is finished editing. When you''re finished, you will have a solid
    grasp of how to work with text with your iPhone applications.


    # Configuring the Keyboard through Interface Builder


    ![](img/0ccd1d097de6918b1df92faf66d987b6_182_0.png)


    There are two UI components in Cocoa Touch that are designed specifically for
    handling text entry: UITextField and UITextView. UITextField is designed to handle
    a single-line entry of text and UITextView is designed to handle multiple lines
    of text. Both of these adhere to the UITextInputTraits protocol, which means they''re
    able to configure the type of keyboard that is used to enter text into them.


    I''ll talk more about UITextInputTraits when I talk about configuring text through
    code. For this section, you''re going to look at how you configure the keyboard
    on text fields through Interface Builder. You don''t necessarily need to know
    why it works yet; you just need to know how it works.


    | Learning how to work with text input and text fields |

    | Configuring the on-screen keyboard |

    | Understanding UITextInputTraits |

    | Handling keyboard events with a delegate |'
  merge: -1
  pgno: 182
- img_proc: true
