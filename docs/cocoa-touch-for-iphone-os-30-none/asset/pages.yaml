    # Searching for media


    Using the MediaPlayerPickerController is fine if your application uses standard
    controls. But if you''re making an immersive game, one that perhaps would not
    be well suited to de-playing a standard control? The second method for selecting
    the iPod library is designed for applications that want to present their own interface
    for selecting the songs and simply want a low-level interface for querying the
    library and retrieving the elements. It allows you to build complex queries that
    you can then use to query the iPod library and allows you to retrieve information
    about the library that you can then use to play media or allow the user to select
    the media to be played.


    The classes used for interacting with the iPod library at this level revolve around
    the MPMediaPredicate, its subclass MPMediaPropertyPredicate, and the MPMediaQuery
    class. I will review each of these in turn.


    # Understanding media property predications


    I deal with predicates briefly in Chapter 18. When working with the iPod library,
    generally speaking, you work with the MPMediaPropertyPredicate class, which is
    a subclass of MPMediaPredicate. The MPMediaPropertyPredicate allows you to define
    a filter that determines the subset of the user''s iPod library that you retrieve.
    The items that match the filter are retrieved in the query. Items that do not
    match the filter are not. Predicates can be combined so that multiple levels of
    filtering are performed. Once you have defined the set of predicates that outline
    the result set you want to retrieve, query the results using the MPMediaQuery
    class.'
