  md: 'Again, this is all done for you; you don''t have to do anything to get this
    support out-of-the-box.


    The only time that you need to do anything special with cut, copy, and paste is
    when you have custom views or other special cases where you specifically need
    to put data onto a pasteboard to send it to other applications. This is where
    you need to interact with the Main class that implements the copy-and-paste mechanism
    in iPhone OS 3. That class the UIPasteboard class, and that is class I will spend
    the remainder of this chapter discussing.


    # Understanding Pasteboard Types


    There are really two different kinds of pasteboards that an application can interact
    with. The first is the general, systemwide pasteboard. This pasteboard can be
    accessed by all applications on the system and is the default pasteboard that
    is used by UITextView, UITextField, and so on.


    The second kind of pasteboard is called a named pasteboard. These pasteboards
    are created by your application and given a name. Other applications that know
    the name of your pasteboard can also access that pasteboard and retrieve your
    data. In this way, you can share data among a set of applications if you need
    to.


    The UIPasteboard class provides the mechanism by which applications interact at
    a low level with both the general system pasteboard and named pasteboards that
    they selves create.


    To access the general system pasteboard, you call the method generalPasteboard
    on the UIPasteboard class. This returns the general pasteboard singleton.


    To access a named pasteboard, you call the method pasteboardWithName:create: on
    the UIPasteboard class. If you would like the UIPasteboard class to create a unique
    name for you, then you can pass nil as the first parameter. The second parameter
    indicates whether or not you want the UIPasteboard class to create the pasteboard
    for you if it does not exist.


    > NOTE

    When calling pasteboardWithName:create:, Apple recommends using reverse DNS notation
    when creating a name for your Company to avoid unintentional naming collisions,
    for example, com.MyCompany.exampleapp.


    Which kind of pasteboard you choose depends on your application.'
