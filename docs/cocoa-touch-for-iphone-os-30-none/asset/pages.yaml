  md: "# Moving the circle with a touch\n\nIn order to update your example code to\
    \ allow users to move the circle around the screen, the first thing you have to\
    \ do store the circle's rectangle as a member variable. Listing 11.2 shows the\
    \ updated interface for your custom view, which now includes a member variable\
    \ for this purpose.\n\n# Listing 11.2\n\n# The updated Custom UIView/UIKit.h\n\
    \n```\n#import UIKit/UIKit.h\n\n@interface MyCustomView : UIView\n    CGRect circleRect;\n\
    \    BOOL moving;\n\n@end\n```\n\nI've also added a Boolean value, which will\
    \ be using to track whether or not you currently moving the circle, based on whether\
    \ the user's initial touch is inside the circle.\n\nBecause of this change to\
    \ how you're storing circleRect, you also need to update your drawRect:method\
    \ to make it so that you are just using your member variable instead of using\
    \ a hard-coded CGRect. The updated version of this method is shown in Listing\
    \ 11.3.\n\n# Listing 11.3\n\n# The updated drawRect: Method\n\n```\n(void)drawRect:(CGRect)rect\
    \ {\n    // acquire the current context\n    CGContextRef ctx = UraphicsGetCurrentContext();\n\
    \    // set the stroke color to black\n    CGContextSetStrokeWithColor(ctx, [[UIColor\
    \ black] CGColor]);\n    // set the fill color to blue\n    CGContextSetFillColorWithColor(ctx,\
    \ [[UIColor blue] CGColor]);\n    // draw the outline of the circle\n    CGContextStrokeEllipseInRect(ctx,\
    \ circleRect);\n    // fill the circle\n    CGContextFillEllipseInRect(ctx, circleRect);\n\
    }\n```"
