  md: "# Writing a Simple UIViewController\n\nIn Chapter 5, I go into a lot more detail\
    \ on what a ViewController is and how you use it. For now, you're just going to\
    \ fill in some methods and add some code to your header that will enable you to\
    \ attach the controls that you put on your view, and allow you to take action\
    \ when the button is pressed.\n\nSo at this point, you can go into Xcode and find\
    \ the files BasiciPhoneViewController.h and BasiciPhoneViewController.m. These\
    \ are the header and implementation files, respectively, for the code that will\
    \ control your UI.\n\n> NOTE\nWhen you use the templates, you get a fair amount\
    \ of extra code that's provided for you, but commented out. Feel free to read\
    \ through the comments, as they can be instructional.\n\nIf you single-click on\
    \ BasiciPhoneViewController.h, then that file opens in the editing window of Xcode.\
    \ What you need to do here is to add some Interface Builder outlets, or IBOutlets\
    \ for the controls that are on your view. To do that, make your code look like\
    \ Listing 2.1.\n\n# Listing 2.1\n\n# View Controller.h\n\n```\n#import <UIKit/UIKit.h>\n\
    @interface BasiciPhoneViewController : UIViewController\n{\n  IBOutlet UILabel\
    \ *myLabel;\n  IBOutlet UITextField *myTextField;\n}\n-(IBAction)setLabelPushed:(id)\
    \ sender;\n@end\n```\n\n> NOTE\nIBOutlet is a hint to Interface Builder that enables\
    \ it to know what variables you are expecting to connect elements of the UI. Similarly,\
    \ IBAction tells Interface Builder about methods you intend to attach to.\n\n\
    What you're going to do is attach your label and text field to the two variables\
    \ represented here as IBOutlets. Then, you're going to attach the action from\
    \ the button to the setLabel:method so when the user presses the button, whatever\
    \ has been typed into the text field will be put into the label."
  merge: -1
  pgno: 37
- img_proc: true
  md: "# Chapter 2: Building a Basic iPhone Application\n\nTo do all this, you're\
