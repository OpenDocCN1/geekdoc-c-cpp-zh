  md: '# Chapter 20: Using the Push Notification Service


    # 271


    ```

    messageText = ARGV[1]

    # pack the token to convert the ascii representation back to binary

    tokenData = [tokenText].pack(''H*'')

    # construct the payload

    payload = "\"alert\":{\"alert\":":{\"messageText\":\"}, \"badge\":1}"

    # construct the packet

    packet = [0, 32, tokenData, 0, payload.length, payload].pack(''ccca cca**'')

    ```


    Essentially, you take your commandline argument for the message and use it to
    build the JSON serialized object that needs to go into the payload. You place
    the message dictionary with a key of "alert". You are also adding another key
    of "badge" to set the badge number to 1. Finally, you take this dictionary and
    put it into another dictionary associated with the key "aps".


    Next, you have some code related to reading your certificate from disk. This is
    shown in Listing 20.3.


    # Listing 20.3


    # Reading the Certificates


    ```

    # read our certificate and set up our SSL context

    cert = File.read("devcerts.pem")

    openSSLContext = OpenSSL::SSL::SSLContext.new

    openSSLContext.cert = OpenSSL::X509::Certificate.new(cert)

    openSSLContext.key = OpenSSL::PKey::RSA.new(cert)

    ```


    The important part here is when you receive your certificate from the iPhone Developer
    Portal, it is in a p12 format. Most OpenSSL libraries prefer to work with .pem
    certificates. Therefore, you have to convert them from the .p12 format to the
    .pem format. To do this, you run the terminal commands:


    ```

    openssl pkcs12 -in Certificates.p12 -out devcerts.pem -nodes -nclerts

    ```


    With this file extracted, you can use it to create your OpenSSL connection. On
    the context, you set the cert and key properties accordingly by extracting them
    from your certificate.


    Next, you open the connection to the APNS server. Once you have the connection
    open, you initiate a new SSLSocket using the TCP socket. You then connect on your
    SSL socket, which causes SSL to do its handshake. This is shown in Listing 20.4.'
