    # # Receiving Notifications while Your Application Is Running


    In handling startup and shutdown of your application, the application delegate
    handles messages sent to the application from the operating system while your
    application is running. Usually these kinds of messages include warnings about
    resources (memory, or time changes) and remote notifications. Some of these you
    may be safe to ignore; others, you ignore at your peril.


    Table 3.3 shows each of the methods that you can implement to receive these messages.
    I will discuss each of these in turn.


    | Methods | Description |

    | --- | --- |

    | - (void)applicationDidReceiveWarning:(UIApplication*)application | Received
    when the iPhone is running low on memory. |

    | - (void)applicationSignificantTimeChange:(UIApplication*)application | Received
    when a significant time event has occurred. |

    | (void)application:(UIApplication*)application willChangeStatusBarOrientation:(UIInterfaceOrientation)newStatusBarOrientation:(NSTimeInterval)duration,
    | Used to indicate changes to the size and orientation of the status bar. |

    | - (void)application:(UIApplication*)application didChangeStatusBarOrientation:(UIInterfaceOrientation)oldStatusBarOrientation,
    | |

    | (void)application:(UIApplication*)application willChangeStatusBarFrame:(CGRect)newStatusBarFrame
    | |'
