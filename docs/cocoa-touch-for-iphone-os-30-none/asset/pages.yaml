  md: '# Chapter 34: Expanding Your Application using the In-App Purchase Support
    395


    Like most other things, accessing the App Store is done asynchronously. Therefore,
    you initialize your product request with the product identifiers that you want
    to retrieve information about, and then you start the request. Once the request
    is started, the delegate method is called when it has completed.


    When the delegate method is called, the parameter to the delegate method is of
    type SKProductsResponse, which contains a list of your products. That list contains
    objects of type SKProduct. The SKProduct class methods you can use to get localized
    information about your products, including the correct localized price. As shown
    in this code, you should use a number format to format the actual value into the
    appropriate format for the user''s locale.


    # Making the purchase


    Actually making the purchase in code is simple. You instantiate an instance of
    SKPayment and add it to the delegate SKPaymentQueue. This is shown in Listing
    34.3.


    # 34.3


    # Sending a Payment to the Store


    ```

    SKMutablePayment *payment = [SKMutablePayment paymentWithProductIdentifier:@"com.example.product1"];

    // optionally, set the quantity if needed - default is 1.

    payment.quantity = 2;

    [SKPaymentQueue defaultPaymentQueue addPayment:payment];

    ```


    In order to actually receive a payment, your application needs to have an instance
    of a transaction-observer object observed by it. This transaction observer must
    implement the SKTransactionObserver protocol and is responsible for unlocking
    the content used by the user.


    Probably the best place to implement this observer is in your application''s initialization.
    This is a good place to do it because the Store Kit remembers transactions that
    are in process, even if the application crash or be interrupted before the transaction
    has completed. Therefore, when your application starts up and reinitializes, it
    should be prepared to handle whatever completed transactions may be in the queue.


    Listing 34.4 shows an implementation of applicationDidFinishLaunching: where the
    application delegate is being set as the transaction observer.'
  merge: -1
