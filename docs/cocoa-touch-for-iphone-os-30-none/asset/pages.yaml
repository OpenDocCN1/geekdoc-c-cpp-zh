  md: '# Developing Your Server-Side Push Notification Service


    There are so many different technologies available for creating an application
    server for push notifications using SSL that it''s impossible for me to give you
    instructions on how to configure them all. You''re going to have to look at the
    implementation of the specific technology that you choose to.


    That said, for the purposes of this example, I''m going to demonstrate implementation
    of a push notification supplier built with Ruby.


    I''m not going to be able to go into all the intricacies of how the application
    is built or there you how to read Ruby. You''re just going to have to take my
