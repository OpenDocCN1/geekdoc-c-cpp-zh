    methods on the AVAudioRecorder to access the meters.


    AVAudioRecorder also has a delegate, like the delegate for the AVAudioPlayer,
    informs you when recording has finished, or is interrupted.


    Let''s take a look now at an example application that records audio.


    # Creating a Voice Recorder


    Firstly, you need to set up a UI for your voice recorder. For the purposes of
    this example, it''s going to be very simple. Nothing fancy, no special graphics;
    it''s just going to have record, play, and stop buttons. Figure 27.1 shows the
    finished application with the UI in place. Use Interface Builder to create this
    interface, being sure to connect the UIViews as well as connecting the buttons
    to appropriate IBActions. In my case, I created actions playPushed, stopPushed,
    and recordPushed.


    Most of the action that''s going to occur in this particular application takes
    place in IBActions. However, just to have a bit of additional fancness, I added
    two UIViews, which display the metering levels when recording and playing. The
    top one displays the average, and the bottom one displays the peak. I''m going
    to show you the sample code for this to get out of the way. Listing 27.2 shows
