  md: '# Chapter 9: Understanding the UIApplicationDelegate


    being one that it can open. In this case, the launchOptions parameter contains
    an object representing the URL and the bundle ID of the application that sent
    the request.


    > NOTE

    The UIApplicationDelegate also includes the optional method application:handleOpenURL
    for handling situations where your application is simply launched by opening a
    URL.


    In the case where the application is simply launched from the iPhone OS via its
    application icon, the launchOptions parameter contains nil.


    Table 9.2 shows a list of the keys that can be used to access the elements of
    the launch options dictionary. These keys are actually used in other methods as
    well, but I present them all here for your information.


    | Value | Description |

    | --- | --- |

    | UIApplicationStatusBarOrientation InfoKey | Accesses a value used to indicate
    the current orientation of the status bar. This value is encoded as NSNumber.
    |

    | UIApplicationStatusBarFrame InfoKey | Accesses a CGRect value to indicate the
    new location and frame of the status bar. This value is encoded as NSNumber. |

    | UIApplicationLaunchOptionsURLKey | Accesses an NSURL that has been initialized
    with the URL used to launch the application. |

    | UIApplicationLaunchOptionsSource ApplicationKey | Accesses a string containing
    the bundle ID of the application that was used with a URL to launch the application.
    |

    | UIApplicationLaunchOptionsRemote NotificationKey | Accesses a dictionary representing
    the payload from the remote notification used to launch the application. |


    # Understanding the applicationWillTerminate method


    When the user presses the home button on the iPhone, they are requesting that
    your application be terminated. The application sends the willTerminate: message
    to your application delegate. You are expected to handle whatever cleanup is necessary
    for your application in a timely manner. This means persisting any objects to
    disk, freeing resources, or doing typical shutdown operations.


    > NOTE

    I talk about persisting data, I''m talking about saving it either in the application''s
    Documents folder or the user''s defaults. I talk more about saving data in Chapters
    17 and 18.'
