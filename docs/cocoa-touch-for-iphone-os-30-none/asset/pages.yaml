  md: '# Chapter 20: Using the Push Notification Service


    The second way that a notification can enter your application is if your application
    is already running. In this case, your application delegate receives a call to
    application:didReceiveRemoteNotification:didFinishLaunchingWithOptions:message,
    just like when you receive the notification, this method also receives a user
    dictionary that contains the notification. 20.8 shows an implementation of this
    method.


    # 20.8 Remote Notifications While Your Application Is Running


    ```

    (void)application:(UIApplication *)application didReceiveRemoteNotification:(NS
    Dictionary *)userInfo

    {

    NSDictionary *payload = [userInfo objectForKey:@"aps"];

    NSDictionary *alertMsg = [payload objectForKey:@"alert"];

    NSNumber *badgeCount = [payload objectForKey:@"badge"];

    // do something with this ..

    ```


    You should take this opportunity, for example, to display a message to the user
    or update your badge count.


    # Summary


    In this chapter, you have examined in detail the Apple Push Notification Service
    and how to work with it. You''ve taken an in-depth look at the architecture and
    message formats needed to communicate with the APNS servers, you''ve looked out
    how APNS handles security, and you''ve seen how you acquire the certificates necessary
    for communicating with the APNS servers. You''ve also seen a full example of a
    push notification supplier that can be deployed on Linux or Mac servers. Finally,
    you''ve seen how you handle remote notifications in your own iPhone OS applications.


    Push notification is one of the most powerful features in iPhone OS 3. By mastering
    this technology, you can enable your applications with new features to delight
    your users.'
