    \ These notifications are shown in Table 13.3.\n\n| Table 13.3 Notifications Sent\
    \ When the Keyboard Displays and Hides |\n| Notification | Purpose |\n| UIKeyboardWillShowNotification\
    \ | This notification is sent before the keyboard appears. |\n| UIKeyboardDidShowNotification\
    \ | This notification is sent after the keyboard appears. |\n| UIKeyboardWillHideNotification\
    \ | This notification is sent before the keyboard disappears. |\n| UIKeyboardDidHideNotification\
    \ | This notification is sent after the keyboard disappears. |\n\nOne of the most\
