  md: '# Adding settings to your settings bundle


    Add settings to your settings bundle, you simply add a new property to the Preference
    Items Array. The types of items that you can add are shown in Table 17.2.


    Table 17.2 Settings Value Types

    | Type | Purpose |

    |---|---|

    | Group | Displays a group title and separates elements below it into a new group
    |

    | Multi-Value | Displays a subview that allows you to select a value from a list
    of values |

    | Slider | Displays a slider that enables you to configure a numeric value |

    | Text Field | Displays a text field that enables you to configure a string |

    | Toggle Switch | Displays an on/off switch to configure a Boolean value |

    | Title | Displays a read-only value suitable for displaying a static read-only
    string |


    Each of these value types has properties that can be set. When you choose the
    type of value, the possible parameters that can be set for that value are automatically
    populated in the item that you are configuring.


    There are also some values that are shared amongst each of the value types. In
    particular, the identifier parameter specifies the key that is used to store the
    value that this setting represents in NSUserDefaults. The title parameter specifies
    the title that is shown to the left of the configurable value in the Settings
    application. The default value parameter specifies the value that is displayed
    by default if the user has not specified the setting.


    > CAUTION

    The Default Value parameter in settings must be set, even if you initialize the
    default value in code, as I described earlier. Neither default value is written
    to disk, and so should be careful to make sure you are setting the defaults to
    the same values in both places.'
