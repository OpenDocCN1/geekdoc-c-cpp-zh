  md: '# Summary


    In this chapter, you''ve seen how you can create a custom UIView and add it to
    your projects. Remember that even custom UIViews are still views and still work
    within the view hierarchy system, which means that you can insert these views
    as subviews of existing views when needed.


    You also saw some basic Core Graphics drawing code. Core Graphics is a tremendously
    powerful drawing system for 2-D graphics. For the most part, it also functions
    very similarly between the iPhone and Mac OS X, with the notable exception that
    the coordinate system origin for the two platforms differs. That is, on Cocoa
    Touch, the origin is in the upper left, and in Cocoa, it''s in the lower left.
    That said, most books about the subject covering the desktop will be applicable
    to iPhone development.


    Keep the example code from this chapter handy, because in the next chapter you''re
    going to see how you handle touch events using this custom view. You''re going
    to expand your little circle view so that the user can use his finger to move
    the circle around and resize it.'
