- img_proc: true
  md: '# Handling Distribution


    Once you have the Entitlements.plist, you should configure your ad hoc target
    and set the Code Signing Entitlements properties to be the name of the Entitlements
    property list file, or in the previous example, Entitlements.plist. You should
    also configure your Code Signing Identity to your ad hoc provisioning profile.


    If you''ve configured everything correctly (and sacrificed the requisite chicken),
    you should be able to build your app. This version of your app is signed with
    your ad hoc provisioning profile and can be installed on any of the devices listed
    within it.


    # Distributing to users


    Distributing an ad hoc build to a user involves distributing the application bundle
    and the provisioning profile to the user. The user needs to install them both,
    using iTunes.


    When installing the app and provisioning profile, the provisioning profile should
    be installed first. The user should drag the provisioning profile to iTunes and
    then drag the application bundle to iTunes. If it''s installed correctly, the
    user then sees the application in the Applications group in iTunes.


    > NOTE

    iTunes does a version check and alert the user the version they are installing
    is older than or the same version as the one that is currently installed. Because
    of this, you may want to increase the version number when distributing new ad
    hoc builds.


    # Summary


    This chapter has enlightened you bit about the code signing process and distribution
    work. Code signing is one of the most complicated parts of iPhone development.
    Fully understanding the terms used, and the process involved, can help make it
    easier to work with. After reading this chapter, you should have that additional
    understanding, which will make your builds smoother and easier.'
  merge: -1
