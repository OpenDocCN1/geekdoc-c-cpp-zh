    Configures the auto capitalization type |

    | @property (nonatomic) BOOL enablesReturnKeyAutomatically | Defines whether or
    not the Return key automatically enables and disables |

    | @property (nonatomic) UIKeyboard keyboardAppearance | Configures the keyboard
    appearance |

    | @property (nonatomic) UITextType keyboard | Configures the keyboard |

    | @property (nonatomic) UITextKeyType returnType | Configures the Return key type
    |

    | @property (nonatomic, getter=isSecureTextEntry) BOOL secureTextEntry | Defines
    whether or not the text field is secure |


    Setting these properties on any element implementing the UITextInputTraits protocol
    should enable you to configure these values as shown.


    # Handling Events for the Keyboard


    The keyboard provides a variety of events that your application can monitor to
    take action in particular conditions. For example, you can be notified when the
    keyboard displays so that you can move your view out of the way of the keyboard
    or be notified when the user has finished editing so you can find the field data
    and do something with it. UITextField supports configuring a UITextFieldDelegate,
    which enables you to customize the behavior of the input to control things such
    as whether or not the user should be able to begin editing, finish editing, or
    change particular characters in the field.


    Let''s take a look at how you work with these notifications and delegate methods.'
