  md: '# Working with Data


    | Table 19.1 NSConnection Delegate Methods |

    | Method | Description |

    | (NSURLRequest*) connection: (NSConnection*) connection willSendRequest: (NSURLRequest*)
    redirectResponse: (NSURLResponse*) redirectResponse | This method is called when
    the request has redirected to another URL. The delegate has the option to disallow
    the redirect or modify the destination by returning nil, or an alternative URL,
    respectively, if the delegate chooses to allow it, simply return the original
    request. |

    | (void) connection: NSLConnection*) connection ReceiveAuthenticationChallenge:
    (NSAuthenticationChallenge*) challenge | This method is called when the NSConnection
    has received an authentication challenge as part of the request. The delegate
    must determine the appropriate action to take, such as providing an appropriate
    credential, or cancelling the download. The challenge parameter is an instance
    of NSURLAuthenticationChallengeSender, which implements methods that allow you
    to send credentials to the challenger if needed. |

    | (void) connection: NSURLConnection*) connection CancelAuthenticationChallenge:
    (NSAuthenticationChallenge*) challenge | This method is called when an authentication
    challenge is canceled as a result of an error. |

    | (void) connection: NSURLConnection*) connection didReceiveResponse: (NSURLResponse*)
    response | This method is called when the request has completed successfully,
    but before the data has been downloaded. After receiving this message, you receive
    didReceive: messages containing the data from the resource. |

    | (void) connection: NSURLConnection*) connection didReceiveData: (NSData*) |
    This method is called as data arrives. It may be called multiple times, and you
    should plan on appending the received data to a buffer until you receive the message
    connectionID didFailWithError: |

    | (void)connectionDidFinishLoading: (NSURLConnection*) connection | This method
    is called when the resource has finished loading. It is called after you have
    received data and assume it is complete. After receiving this message, no further
    messages are received. |

    | (void) connection: NSURLConnection*) connection didFailWithError: (NSError*)
    | This method is called when the connection fails for any reason at any time during
    the loading of the data. This signals that the download has failed to the error
    provided. After receiving this message, no further messages are received. |'
