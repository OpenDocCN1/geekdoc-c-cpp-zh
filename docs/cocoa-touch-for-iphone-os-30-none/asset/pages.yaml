  md: "# 144 Building GUs\n\nLast, but not least, you implement the touchesEnded:with\
    \ method. In it, you check last time to see if you're moving and to see if it's\
    \ a single touch; if, then you update your location last time and set your moving\
    \ variable to NO. In this way, you have ended your dragging of the object. This\
    \ is shown in Listing 11.8.\n\n# Listing 11.8\n\n# Implementation of the touchesEnded:withEvent:\
    \ Method\n\n```\n(void) touchesEnded:(NSSet*)touches withEvent:(UIEvent*)event\
    \ {\n  if(moving && [touches count] == 1) {\n    UITouch *touch = [touches AnyObject];\n\
    \    CGPoint center = [touch locationInView:self];\n    [self setCircleCenter:center];\n\
    \    [self setNeedsDisplay];\n  }\n  moving = NO;\n}\n```\n\nIf you compile this\
    \ code and run the application, you should now be able to touch inside the circle\
