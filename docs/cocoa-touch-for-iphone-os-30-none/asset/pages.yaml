  md: '# Playing audio with AVAudioPlayer


    So you''ve set your audio category, you''ve configured your sample rate, and now
    you''re ready to actually play some audio. To do this, you use the class AVAudioPlayer.


    AVPlayer class is for the purposes of playing any audio that does not require
    stereo positioning, precise synchronization with UI elements, or audio captured
    from a network stream. For these purposes, you should probably use something else,
    like OpenAL. In other words, the AVAudioPlayer class is good for lightweight audio
    such as that which is used in the most basic applications. You could possibly
    use the AVAudioPlayer class even in some games applications, but OpenAL is more
    suited to things such as high-performance immersive games, where the audio positioning
    helps to enhance the game experience and must be changed dynamically and programmatically.
    The AVAudioPlayer class is suitable for other applications.


    To create an AVAudioPlayer instance, you simply call the constructors initWithURL
    or initWithData enable you to initialize the object using either a file or data
    already in memory. If you want to play multiple files simultaneously and have
    their audio mixed together, you simply instantiate multiple instances of the AVAudioPlayer
    class and use them individually.


    Once the AVAudioPlayer instance is created, to play the audio you simply call
    the play method. Similarly, to stop the audio, you call the pause or stop methods.
    You can also configure whether you want the audio to loop a certain number of
    times by setting the numberOfLoops property. To cause the audio to loop indefinitely,
    set the numberOfLoops property to any negative number. The default value of this
    property, which is zero, causes the audio to play once and then stop.


    In some cases, you may want to minimize the amount of delay between calling the
    play method and when the audio actually begins to play. To do this, you can call
    the prepareToPlay method on your AVAudioPlayer object. This tells the AVAudioPlayer
    object to preload its caches and buffers so that it is ready to play when the
    method is called. When the sound stops, either by using the stop method or by
    allowing the audio to complete, the buffers are once again empty. So if you want
    the audio to play again with a minimal amount of delay, you should call prepareToPlay
    before calling the play method.


    Listing 25.2 shows how you to load and play an audio file from your application
    bundle. In this case, you''re going to play the audio continuously until you tell
    it to stop. Therefore, you''re going to set the numberOfLoops property to a negative
    value.'
