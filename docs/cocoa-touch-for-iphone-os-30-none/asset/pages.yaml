  md: '# Deleting rows


    The last item that I want to talk about with regard to editing of rows is deleting
    rows.


    Again, like you did with the delegate, if you haven''t already done so, now is
    a good time to move the data source methods from the separate module into the
    MyViewController class. This makes simpler for you to manipulate the model when
    you go to make your deletions.


    To add deletion, you need to implement two methods in your data source. These
    methods are tableView:canEditRowAtIndexPath and tableView:commitEditingStyle:forRowAtIndexPath:.
    These methods allow you to control whether the row at the specified index is editable
    at all, and if it is, to take action when the row has been deleted.


    To perform a deletion on a UITableView you use a swipe gesture across the row
    you want to delete. When you perform this gesture, the UITableView first asks
    your data source if it is okay to edit the row that you have swiped. Then the
    tableView:canEditRowAtIndexPath returns YES, if the user then presses a delete
    button in the accessory view of the row for confirmation. If the user presses
    the delete button, the method tableView:commitEditingStyle:forRowAtIndexPath:
    is called to perform the actual deletion.


    # Summary


    In this chapter, you''ve seen how to use a UINavigationController to manipulate
    and display lists of data. In the example, you displayed the list of your favorite
    cities, and then the detailed view for each of those cities. Another way this
    could have been used was to display a list of states, and then the list of cities
    for each of the states as the detail view for the state.


    The important thing to take away from this chapter is that the UINavigationController
    is a really fundamental and powerful tool in building iPhone applications. It''s
    also surprisingly easy to use. Using it enables you to build an application that
    already follows the UI paradigms that the built-in applications follow. This means
    that your applications will be easier for your customers to learn and use.'
