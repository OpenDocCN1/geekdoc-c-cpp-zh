    # Handling memory warnings


    As you know, on the iPhone is a finite resource. In a later chapter, I will visit
    memory management in detail, but it deserves a mention here that ViewController
    provides a method that is called when your application receives a low memory warning.
    That method didReceiveMemoryWarning. By default, the implementation of this method
    causes the view controller to unload and deallocate its view if the view is not
    currently a view of another view. When it does, it calls the viewDidLoad method
    to give you an opportunity to save any data that is appropriate to release any
    objects you allocated in view. In addition to being beneficial of this, you should
    override the didReceiveMemoryWarning method and do your purging unneeded temporary
    data to free up memory. If you do this, it is particularly important that you
    also call the [super didReceiveMemoryWarning] method in your implementation. Good
    examples of data to free in did ReceiveMemoryWarning might be cached data you
    can easily recreate or lazily loaded objects that will be recreated the next time
    they are accessed.


