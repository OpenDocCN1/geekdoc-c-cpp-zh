  md: "Finally, you get to the implementation of your touches methods. The first one,\
    \ touches Began:withEvent:, checks to see if the touch event is multi-touch. If\
    \ it is, then for now ignore it. If it's not multi-touch, then you check to see\
    \ if the location of the touch is inside your circle. If it is, then you set your\
    \ member variable to YES, and begin updating the location of your circleRect.\
    \ Implementation of this method is shown in Listing 11.6.\n\n# Listing 11.6\n\n\
    # Implementation of the touchesBegan:withEvent: Method\n\n```\n(void) touchesBegan:(NSSet*)\
    \ touches withEvent:(UIEvent*)\n ([touches count] == 1)\n  UITouch *touch = [touches\
    \ anyObject];\n  CGPoint touchPoint = [touch locationInView:self];\n  if (CGRectContainsPoint(circleRect,\
    \ touchPoint))\n    moving = YES;\n    [self setCircleCenter:touchPoint];\n  \
    \  [self setNeedsDisplay];\n}\n\n```\n\nThe touchesMoved method is also simple.\
    \ In it, again, you check to see if this is a multi-touch event; if it is, then\
    \ you ignore it for now. If it isn't, and you set the moving variable to YES,\
    \ then you update the location of the circleRect so that its center is where your\
    \ new touch is located. Listing 11.7 shows how to do this.\n\n# Listing 11.7\n\
    \n# Implementation of the touchesMoved:withEvent: Method\n\n```\n(void) touchesMoved:(NSSet*)\
    \ touches withEvent:(UIEvent*)\n if(moving && [touches count] == 1)\n  UITouch\
    \ *touch = [touches anyObject];\n  CGPoint centerPoint = [touch locationInView:self];\n\
    \  [self setCircleCenter:centerPoint];\n  [self setNeedsDisplay];\n\n```"
