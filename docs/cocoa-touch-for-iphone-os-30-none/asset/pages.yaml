  md: "# Working with Player Controllers\n\nEarlier, you briefly saw how to work with\
    \ a player controller to play the media items in the user's iPod library. Now\
    \ I want to talk about that in more detail.\n\nMPMusicPlayerController essentially\
    \ operates in two different modes. The first is an application music player. In\
    \ this mode, the music plays as if it were playing within your application. It\
    \ is not affected by any settings in the built-in iPod application, nor does it\
    \ cause the iPod application to take any actions.\n\nThe second mode is an iPod\
    \ music player. In this mode, when you request that an item be played, it actually\
    \ connects the built-in iPod application and uses it to do the playback. This\
    \ means that if your application exits, the music continues to play because it's\
    \ actually playing through the iPod. Additionally, if you then go over to the\
    \ iPod application, the Now Playing window displays the item that you have selected.\n\
    \nThese two modes have important distinctions, because they drastically impact\
    \ the behavior of the playback.\n\nOnce you have allocated and initialized an\
    \ instance of MPMusicPlayerController you can determine what's played by setting\
    \ its queue. The MPMusicPlayerController queue can be set by using a query, and\
    \ MPMediaQuery, or by using a collection of MPMItems contained in an MPMediaItemCollection.\
    \ Then, to start the items, you simply call play on.\n\nPlayback can further be\
    \ controlled by use of pause (to pause playback) or stop (to stop playback), you\
    \ can seek forward or backward using the beginSeekingForward, beginSeekingBackward,\
    \ and endSeeking messages. You can also skip within the collection by using the\
    \ skipNextItem, skipToBeginning, and skipToPreviousItem messages.\n\nYou can control\
    \ whether the playback repeats or shuffles by setting those properties on the\
    \ player accordingly.\n\nFinally, the player generates notifications when playback\
    \ events occur. This is controlled by sending the message beginGeneratingPlaybackNotifications\
    \ and monitoring for the associated notifications via the NSNotificationCenter.\
    \ The notifications that are generated are shown in Table 26.4.\n\n| Table 26.4\
    \ MPMusicPlayerController Notifications |\n| Notification | Purpose |\n|---|---|\n\
    \ MPMusicPlayerControllerPlayback StateDidChangeNotification | Received when the\
    \ playback state changes either programmatically or through a user action |\n\
    | MPMusicPlayerControllerNowPlaying ItemDidChangeNotification | Received when\
    \ the currently playing item changes |\n| MPMusicPlayerControllerVolume DidChangeNotification\
    \ | Received when the volume for the music player changes |"
  merge: -1
  pgno: 350
- img_proc: true
  md: "# Accessing Media Artwork\n\nThe last item that I want to talk about with regard\
    \ to the media framework is how you access the artwork associated with a particular\
    \ media item. The properties associated with the MPMediaItem are accessible using\
    \ the standard method valueForProperty The types of property to be queried are\
    \ the ones from Table 26.2.\n\nThis means that to access the artwork for a given\
    \ media item, you would use code similar to that shown in Listing 26.4.\n\n# Listing\
    \ 26.4\nAccess the Artwork from an MPMediaItem\n\n```\n-(void)setImage:(MPMediaItem\
    \ *)item {\n  MPMediaItemArtwork *artwork =\n  [item valueForProperty:MPMediaItemPropertyArtwork];\n\
    \n  [myImageView setImage:[artwork imageWithSize:[myImageView frame.size]]];\n\
    }\n```\n\nAs you can see, the MPMediaItemArtwork object has methods that enable\
    \ you to access the image at a particular size. This means that if you want to\
    \ access the artwork and display it in your application while the music is playing,\
    \ this is how you would do it. In this particular case, I have an image view that\
    \ is being initialized to the artwork from the item.\n\n# Summary\n\nIn this chapter,\
    \ you've seen how you can access the iPod media library to control the iPod player\
    \ when playing media and to access the media from the user's iPod library to play\
    \ it within your application. Not only does this enable makers of various applications\
    \ to simply play media, but it also up new classes of applications that could\
    \ make recommendations based on the user's iPod library contents. Using the knowledge\
    \ that you've gained here, you should be able to easily work with the user's iPod\
    \ library."
