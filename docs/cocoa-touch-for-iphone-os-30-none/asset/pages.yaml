    In this chapter, you''re going to see exactly how to use the Apple Push Notification
    Service to add push notifications to your applications. You will look first at
    the architecture of the push notification service and the message formats that
    are used in sending notifications to your applications. Finally, I''ll show you
    some example code of how to make a push notification server, and you''ll build
    an example application that will receive notifications from your example server.


    # Understanding the Push Notification Service Architecture


    Before I delve deeply into actual implementation of a push notification server
    and client, I need to review the Apple Push Notification Service architecture
    and define some terms. It''s important that you understand how the architecture
    functions so that you can work with it effectively.'
