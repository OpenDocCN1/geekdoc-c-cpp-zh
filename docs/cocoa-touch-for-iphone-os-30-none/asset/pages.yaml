  md: '# Chapter 34: Expanding Your Application using the In-App Purchase Support


    # Understanding In-App Purchasing testing


    Finally, there are a few things to understand about testing applications with
    in-app purchasing.


    Obviously, during development, you don''t want to actually be accessing the real
    App Store. It would be better if you could access a sandbox, where you could test
    everything, including your transactions, without fear of accidentally charging
    a credit card. Apple has already provided for this as part of the development
    process related to the App Store. Your application, when signed with your developer
    certificate, automatically connects only to the sandbox store. When you sign your
    application with your distribution certificate, it actually connects to the real
    store. Therefore, you can test without when signing with your developer certificate.


    You need to configure a test Apple ID for working in the sandbox. Details for
    how to do this are located in iTunes Connect.


    ![](img/0ccd1d097de6918b1df92faf66d987b6_422_0.png)


    # CAUTION


    When you''re testing your device using the sandbox, you need to make sure that
    you log out of your normal account before testing your application. Otherwise,
    it attempts to use your account to verify your purchases, and it doesn''t work.


    Additionally, to test your server-side implementation, the URL for verifying receipts
    should be changed to `https://sandbox.itunes.apple.com/verifyReceipt`.


    # Summary


    In this chapter, I''ve shown you how to expand your applications with the in-app
    purchase system. This enables you to explore new business models and customize
    your applications to your users'' needs. Applications can be designed such that
    they are à la carte, with the user picking and choosing the features that she
    needs. Alternatively, you can release an application with minimal functionality
    to start, and then release updates with unlockable additional content. Finally,
    you can even make applications that work with online services to deliver digital
    content directly to the device.


    Using this capability opens a whole new world of business opportunity, one that
    I hope you will be successful in years to come.


    ![](img/0ccd1d097de6918b1df92faf66d987b6_422_1.png)'
