- img_proc: true
  md: '# Handling Touch Events


    A defining feature of the iPhone is its use of multi-touch for its primary input.
    There is nothing more unique than iPhone than this capability. When working with
    custom views, it''s important to utilize multi-touch to its greatest advantage.
    Fortunately, Cocoa Touch makes implementing a multi-touch interface on your custom
    views incredibly easy. All you have to override a few methods to handle the touch
    events to unlock the potential of this innovative capability.


    In this chapter, you''re going to take a look at how you implement multi-touch
    on a custom view. First, you will take a look at what you need to do to support
    multi-touch, and then you will implement multi-touch on your custom UIView example
    code from the last chapter.


    # Handling Touch Events in a Custom UIView


    When the user''s finger touches the iPhone screen, the view that the touch occurs
    within receives a set of messages. These messages are translated into calls to
    specific methods that are defined as part of the UIResponder class, as a subclass
    of UIView, also has the option to override these methods so it can take action
    on these events. The methods that are called `touchesBegan:withEvent:`, `touchesMoved:withEvent:`,
    and `touchesEnded:withEvent:`. These methods must be overridden in your custom
    UIView to handle the touch events. The signatures for these methods are shown
    in Table 11.1.


    > ### In This Chapter

    Handling touch events in your custom UIViews

    Implementing the methods needed to handle touch events

    Learning about the UIText class and how to use it

    Configuring a UIView to receive multi-touch events

    Extending the custom UIView sample code to handle touches and multi-touches'
  merge: -1
  pgno: 160
- img_proc: true
  md: "# Table 11.1 Touch Event Methods\n\n| Method | Purpose |\n| --- | --- |\n|\
    \ (void) touchesBegan:(NSSet*) withEvent:(UIEvent*) event | Called when the user's\
    \ finger initially touches the screen |\n| (void) touchesMoved:(NSSet*) withEvent:(UIEvent*)\
    \ event | Called as the user drags his finger across the screen |\n| (void) touchesEnded:(NSSet*)\
    \ withEvent:(UIEvent*) event | Called when the user lifts his finger from the\
    \ screen |\n\nAs you can see from the descriptions, the chain of events when a\
    \ touch event occurs essentially consists of events associated with the touch\
    \ beginning, moving, and finally ending. I'll describe each of these in detail.\n\
    \n> NOTE\nThe iPhone screen is capable of detecting up to four touches simultaneously,\
    \ and no more.\n\n# Implementing touchesBegan:withEvent:\n\nThe first of these\
    \ methods, the touchesBegan:withEvent method, is called when the user initially\
    \ touches the screen. This is a good place for you to do things such as detect\
    \ where the user is placing her finger to determine if she wants to drag an object.\
    \ Listing 11.1 shows a typical implementation of a touchesBegan:withEvent method.\n\
    \n# List 11.1\nA typical touchesBegan:withEvent:Method\n\n```\n(void) touchesBegan:(NSSet*)\
    \ touches withEvent:(UIEvent*)\n{\nUITouch *touch = [touches anyObject];\nif([touch\
    \ tapCount] == 2) {\n    // ... take some action on a double tap\n}\nelse {\n\
    \    // // do something with the touch, or store it.\n}\n}\n```"
  merge: -1
  pgno: 161
- img_proc: true
  md: 'The first parameter to the touchesBegan:withEvent method is an NSSet, which
    contains the touches triggered this event. If it is a multi-touch event (more
    than one finger touching the screen at a time), then this contains multiple touches,
    for each finger. If it is a single touch event, then this only contains one touch.


    In this example, you are checking to see if the touch has a tap count of two.
    This is to allow you to determine if the user is double tapping versus single
    tapping to drag.


    Another action you might consider taking in this method is to store the initial
    touch so that you can compare its location to the touch location in the touchesEnded:withEvent
    method to detect things as swipes.


    As the user drags his finger across the screen, touchesMoved:withEvent is called
    repeat-edly to update the position of the touch.


    When the user lifts his finger, the touchesEnded:withEvent method is called.


    # Working with the touches NSSet


    Each of these methods takes its first parameter as an NSSet containing the UITouch
    class to represent the touches that triggered the event. The UITouch class has
    several methods available on it that enable you to determine things as where the
    touch occurred, the location of this touch, how many times the user tapped the
    screen beginning this touch, and so on. These methods are shown in Table 11.2.


    | Method | Description |

    | --- | --- |

    | (CGPoint)locationInView:(UIView*) | Returns a CGPoint indicating the location
    of the touch in the provided UIView |

    | (CGPoint)previousLocationInView:(UIView*) | Returns a CGPoint indicating the
    previous location of this touch in the provided UIView |

    | @property (nonatomic, readonly) NSIntegertapCount | Returns the number of taps
    used to initiate this touch event |

    | @property (nonatomic, readonly) NSTimeInterval timestamp | Returns the time
    this touch was last updated |


    The most commonly used of these methods is the locationInView: method, which gives
    you the location of this touch in the provided UIView. This is perfect for determining
    where in your user interface the touch occurred.'
  merge: -1
  pgno: 162
- img_proc: true
  md: '# Implementing touchesMoved:withEvent:


    The next method is the touchesMoved:withEvent method. This method is called as
    the user drags her finger across the screen. It is called constantly, over and
    over, to update the location as accurately as possible. This is where you would
    typically do such things as updating the location of an object being dragged.


    # Implementing touchesEnded:withEvent:


    The final method is the touchesEnded:withEvent method, which is called when the
    user lifts her finger from the screen. It should be noted that this method is
    not called if the user simply pauses her finger but does not lift it. Typically,
    in this method you would do such things as reset any state that you have set in
    touchesBegan:withEvent..


    # Handling multi-touch events


    A multi-touch event differs from a single-touch event because the touches you
    receive on each of these methods contains more than one touch. To enable multi-touch
    view, you need to set the property multiTouchEnabled either through code or through
    Interface Builder. Once you''ve done this, to detect a multi-touch event, all
    that''s necessary is to check the count of objects in the touches Set. If it is
    more than one, then you have a multi-touch event.


    > CAUTION

    In practice, users place both fingers on the screen at the same instant; therefore,
    do not rely on touchesBegan:withEvent method to detect a two-finger touch on its
    first invocation. Instead, be prepared to handle a transition from a single touch
    to a multi-touch event as you receive additional calls to touchesBegan:withEvent
    and touchesMoved:withEvent.. The simulator can be deceiving in this case, because
    the simulator does all its multi-touch events simultaneously.


    # Updating Your Custom View

    with Touch Events


    Now that you''ve seen what you need to do implement touch events in theory, let''s
    see how you actually do it in practice by updating your custom view project with
    touch events.


    First, you will take your custom example code and update it so that if the user
    touches inside the circle with his finger, he can drag the circle around the screen.
    If the user touches outside the circle, nothing happens.


    After you''ve done this, you will update the example code one more time to add
    the ability to scale the circle, making it larger and smaller by a pinch gesture
    with multi-touch.'
