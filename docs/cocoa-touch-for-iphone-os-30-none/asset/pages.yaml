- img_proc: true
  md: 'The APNS servers, as well as the feedback servers, deal with these messages
    as asynchronous streams. This means when sending your messages to the APNS servers,
    you simply stream the messages into the socket. You do not receive any acknowledgment
    messages while streaming. Similarly, when receiving data from the feedback server,
    all you need to do is open a socket and you begin receiving the messages that
    are designated for your application. You do not need to acknowledge them. The
    push notification service servers determine your application’s identity based
    on the certificates that you use to connect to it.


    # Understanding push notification security


    The APNS secures its data using two different and complementary mechanisms.


    The first security mechanism is used to secure the connection point from the application
    developer’s application server to the APNS servers and from the APNS servers to
    the devices. This is called Connection Trust.


    The second mechanism is called Token Trust and ensures that messages are delivered
    and routed properly from the developer’s application server to the developer’s
    application on the iPhone OS.


    Between these two mechanisms, the push notification service can ensure that only
    authorized devices are connecting to its push notification network and that messages
    are being delivered to the appropriate applications.


    # Understanding connection security


    The Connection Trust provided between the APNS servers and the devices is provided
    by Apple and requires no action from a developer. However, the Connection Trust
    between the APNS server and the developer’s application server does require work
    on the part of the developer.


    Figure 20.5 shows the Connection Trust mechanism from a high-level point of view.


    When the developer’s application server connects to the APNS servers, it is required
    to use TLS. By using TLS, you can specify the use of particular certificates in
    the connection. The certificates that you use on your application server are provided
    from Apple for use with the push notification service. By using the certificates
    provided by Apple, Apple is able to authenticate and verify the connection from
    your application server to theirs.


    > NOTE

    TLS is short for Transport Layer Security and is a mechanism by which TCP connections
    encrypt their data using secure certificates.'
  merge: -1
  pgno: 287
- img_proc: true
  md: '# Chapter 20: Using the Push Notification Service


    Figure 20.5


    Connection Trust


    ![](img/0ccd1d097de6918b1df92faf66d987b6_288_0.png)


    # Understanding behind Token Trust


    The idea behind Token Trust is that an application registers to receive notifications,
    you want to be able to ensure that the message that you send is received by your
    application and your application only. You do not want your message to be able
    to be intercepted by another application on the device.


    Figure 20.6 shows a high-level view of the Token Trust mechanism.


    To do this, the iPhone OS application needs to communicate with the APNS servers
    to retrieve a unique token that can then be passed through your application server
    back to the APNS servers again for when the notifications need to be delivered.


    The token that the application receives from the APNS servers is opaque to both
    the application and the developer''s application server. Its purpose is strictly
    intended to provide for a security mechanism between the APNS servers and the
    recipient of the message, to provide a trust between those two.


    # CAUTION


    Just because the APNS communication is secured using these mechanisms, you should
    never use it to send personal information such as credit card or Social Security
    card numbers because you can''t predict who might be reading the message on the
    other end.'
