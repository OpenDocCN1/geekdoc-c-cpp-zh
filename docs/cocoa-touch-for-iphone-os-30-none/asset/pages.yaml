  md: "To do this, configure your view to listen for the UIKeyboardDidShowNotification,\
    \ and when it occurs, slide your view text is still visible over the top of the\
    \ keyboard.\n\nIn portrait mode, the keyboard is 216 pixels tall. In landscape\
    \ mode, the keyboard is 162 pixels tall. When the keyboard show and hide notifications\
    \ are posted, the user dictionary that is included with the notification includes\
    \ information about the size of the keyboard that will be displayed. You can use\
    \ this information to adjust your cursor as needed. Listing 13.4 shows an example\
    \ of how to handle this event.\n\n# Listing 13.4\n\n# Handling Moving View to\
    \ Make Room for the Keyboard\n\n```\n- (void)viewLoad;\n{\n  // other initialization\
    \ ...\nNotificationCenter *ctr = [NSNotificationCenter defaultCenter];\n [ctr\
    \ addObserver:self selector:@selector(handleShowKeyboard:)\n name:UIKeyboardDidShowNotification\
    \ object:nil];\n [ctr addObserver:self selector:@selector(handleHideKeyboard:)\n\
    \ name:UIKeyboardDidHideNotification object:nil];\n}\n\n-(void)handleShowKeyboard:(NSNotification\
    \ *)inNotification {\n  NSValue *userInfo = [inNotification userInfo];\n  NSValue\
    \ *kbBounds = [userInfo objectForKey:UIKeyboardBoundsUserForKey];\n\n  [UI beginAnimations:@MOVING\
    \ FOR KB\" context:nil];\n  CGRect currentFrame = [textField frame];\n  currentFrame.origin.y\
    \ = [kbBounds CGRectValue].size.height;\n  [textField setFrame:currentFrame];\n\
    \  [UI commitAnimations];\n}\n\n-(void)handleHideKeyboard:(NSNotification *)inNotification\
    \ {\n  NSValue *userInfo = [inNotification userInfo];\n  NSValue *kbBounds = [userInfo\
    \ objectForKey:UIKeyboardBoundsUserForKey];\n\n  [UI beginAnimations:@MOVING FOR\
    \ KB\" context:nil];\n  CGRect currentFrame = [textField frame];\n  currentFrame.origin.y\
    \ += [kbBounds CGRectValue].size.height;\n  [textField setFrame:currentFrame];\n\
    \  [UI commitAnimations];\n}\n```"
