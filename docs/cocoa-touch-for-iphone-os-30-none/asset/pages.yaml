- img_proc: true
  md: '# Chapter 20: Using the Push Notification Service


    # 259


    # Understanding the push notification communications


    Because of the nature of server-side-side technologies, the interface for working
    with APNS on the server-side is somewhat low-level. It utilizes a binary message
    format that is streamed over a socket connection to servers that Apple maintains.
    Notifications are streamed to Apple''s servers, and then Apple sends the notification
    from its servers to the designated device running your application. The iPhone
    OS on the device maintains a persistent connection to Apple''s notification servers.
    When the notification is received, the iPhone OS decodes the notification, determines
    if an application has registered for this notification, and if it, displays the
    notification.


    If no application has registered to receive the notification, the iPhone OS notifies
    Apple''s servers of this fact and does not display the notification. Developers
    are expected to occasionally query any other of servers, called the "Feedback"
    servers, to determine if notifications sent to devices are being rejected in this
    manner. If so, the developer''s application server is expected to discontinue
    sending notifications to that particular device. This sort of situation might
    occur when a user has installed an application, selected to be notified of certain
    events, and then subsequently uninstalled the application.


    # Looking at the overall architecture


    Figure 20.2 shows the APNS from a high-level point of view.


    Essentially, an application is installed on an iPhone OS device. This application
    communicates with a developer''s application server using whatever protocol or
    mechanism the developer chooses.


    The developer''s application server communicates with the APNS servers using the
    protocol specified by Apple. The iPhone OS device that is registered for the notifications
    also opens a connection to the APNS servers.


    When a push notification needs to be sent, the developer''s application server
    sends the message to the APNS servers, which then send the message to the iPhone
    OS device specified in the message.


    # NOTE


    Apple provides two sets of servers: one for production and another for sandboxed
    development during testing. Whether you are using a development versus a distribution
    certificate determines which server you connect to within your application, but
    you want to ensure that your application server is also connecting to the correct
    APNS server when testing. The production server is located at `gateway.push.apple.com`,
    port 2195. The development server is located at `sandbox.push.apple.com`, port
    2195.


    ![](img/0ccd1d097de6918b1df92faf66d987b6_282_0.png)'
  merge: -1
  pgno: 282
- img_proc: true
  md: '# Figure 20.2


    The APNS architecture


    ![](img/0ccd1d097de6918b1df92faf66d987b6_283_0.png)


    If no application on the device is currently registered to receive the specified
    notification, the device sends a message to the feedback servers to indicate that
    the message could not be delivered. The developer''s application server is expected
    to query this server occasionally to determine if messages it is sending not being
    delivered. If this happens, it should stop attempting to deliver them to the devices
    that are rejecting them.


    > NOTE


    The APNS servers cache only the last notification for the purposes of resending
    if it''s not received due to network difficulties. This means that if you send
    two messages to a device that is currently off or disconnected, only the last
    one is cached to the device when it reconnects.


    To register for notifications, the application uses the method registerForRemoteNotificationTypes:
    to register for the specified notification types. The types the application can
    ask to register for are shown in Table 20.1.'
