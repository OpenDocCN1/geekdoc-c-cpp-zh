  md: '# Building GUIs


    The Weather application doesn''t have a lot of lists of data to show you, but
    instead is meant as a brief summary of information that you can quickly look at,
    get the information that you want, and exit the application. In this case, the
    main screen contains all the data that the user is interested in. There is no
    need for any sort of complex navigation. To change the settings of the application,
    it provides a small info button in the lower-right corner that flips the user
    interface using Core Animation to allow the user to configure the cities they
    want to see in.


    ![](img/0ccd1d097de6918b1df92faf66d987b6_59_0.png)


    NOTE

    The info icon is a standard graphic provided in Interface Builder. You can use
    it in your own applications.


    This is a good model for applications where you don''t have a lot of data that
    needs to be managed. Imagine, when considering this kind of user interface, that
    your application might be used for as little as ten seconds at a time.


    # Understanding the Basics of iPhone Navigation


    In addition to understanding the big-picture issues surrounding user interface
    design on the iPhone, it''s also important to take a good look at some of the
    smaller, often overlooked interactions.


    For example, when designing custom buttons, it''s important that you provide some
    immediate feedback to the user when a button is pressed, such as highlighting
    the button or providing an alternative image that displays. You will look at this
    in more detail in a future chapter, but for now, know that you can do this easily
    through Interface Builder.


    ![](img/0ccd1d097de6918b1df92faf66d987b6_59_1.png)


    NOTE

    Interface Builder allows you to highlight a button when it is selected, or use
    a separate image that you can provide to be displayed when the button is selected.


    Another of the finer details of interaction is to look at the way that the iPhone
    OS views to navigate trees of data. Specifically, note that as you choose an item
    from a list, it highlights them, and then a detail view moves into the screen
    from the left to right, revealing information about the selected item. Similarly,
    when returning from that detail view, the current view slides out to the right,
    and the original view slides in from the left. This is an important interaction
    and one that you should mirror in your applications. It follows the way we read,
    left to right, and feels natural for us. It would be unnerving to a user to have
    it work some other way.'
  merge: -1
  pgno: 59
- img_proc: true
  md: '# Chapter 4 Understanding the Basics of an iPhone User Interface


    Finally, note that the iPhone has standardized the methods by which you edit data.
    That is to say, typically a view is in display mode by default, and when the user
    touches an edit button (typically in the upper-right corner), it changes the view
    to the editable version of that view. When the user is editing the data on screen,
    he touches the Done button and it transitions back to the display view.


    # NOTE


    Watch carefully during these transitions and you''ll see that they are usually
    animated. Judicious use of animation is one of the things that make the iPhone
    unique and cinematic.


    None of these rules are set in, but it''s useful when designing your application
    to ask yourself regularly, “What would Apple do?” and whatever the answer is,
    do that. Studies have even shown that when applications do not follow these conventions,
    users quickly become annoyed. They expect third-party apps to act like the built-in
    apps, so it can be worth your while to put forth the effort to make your apps
    fit in.


    # Summary


    Perhaps the greatest compliment I have seen given to an application is one where
    the user said, “This application makes me want to...(whatever the application
    does)...just so that I can use this application to do it.” That should be what
    you strive to do in your apps.


    In this chapter, we''ve taken a look at some of the elements that make iPhone
    user interaction unique and intuitive. The iPhone is a tremendous platform; you
    should strive to make your application worthy to run alongside the other great
    applications available for it, and worthy of your customers’ time and money.'
  merge: -1
