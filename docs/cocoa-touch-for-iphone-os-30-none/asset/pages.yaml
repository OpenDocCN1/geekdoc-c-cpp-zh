  md: '# Expanding Your Application Using the In-App Purchase Support


    One of the most exciting new features in iPhone OS 3 for developers is the addition
    of in-app purchase support. Using it, you can leverage the power of the built-in
    App Store purchase system to allow the user to purchase additional content for
    your application. This content can be in the form of additional levels, additional
    features, and so forth. This capability enables new kinds of business models to
    be developed around iPhone OS and the App Store.


    In this chapter, you''re going to take a look at how to work with the in-app purchase
    system. You''re going to see what kinds of products you can sell through your
    application, and how you build that capability into your application. You''re
    also going to see how you work with the Store Kit API for making purchases.


    When you are finished, you should be able to deploy an application that includes
    in-application purchases.


    # In This Chapter


    # Knowing the Types of Things You Can Sell


    The first thing that you need to know when working with the in-app purchase system
    is what kind of content you can sell. There are three categories of content that
    you can sell as in-app purchable content: non-consumables, consumables, and subscriptions.


    Non-consumable content is content that, once purchased, is available permanently
    to the user. Examples of this kind of content might be new levels for games, or
    new features in an application. In addition to being available to the user forever,
    non-consumable content must also be available to all of the user''s other devices.
    For example, if the user owns both an iPhone and an iPod touch, then non-consumable,
    purchased content must be available to the user on both devices at no additional
    charge.


    Learning the business models you can use with In-App purchasing


    Understanding the types of things you can sell


    Integrating a store with your app


    Making purchases using Store Kit


    Displaying prices in the localized currency'
  merge: -1
  pgno: 412
- img_proc: true
  md: '# 390 Handling Distribution


    The second category, consumables, represents items that can be used within the
    application. Consumable items need not be available on all of the user''s devices.
    Consumable items are something that the user might purchase and use within the
    application, and then when he has used them up, he would purchase more. Examples
    of items would be ammunition or poker chips.


    The third and final category is the subscription category. Subscriptions work
    just like consumables, except that they need to be available on all of the user''s
    devices. So, for example, a user might purchase a subscription to a magazine for
    a period of one month. That subscription should be available to the user in all
    of the user''s devices.


    # CAUTION


    > The term subscription may suggest to you that a repeating billing cycle is part
    of the capability built into the App Store. This is not the case; the App Store
    provides no support for repeated billing.


    The first thing to realize when considering adding support for in-app purchases
    is that the application is the content that you''re selling must fall into one
    of those three categories.


    The second thing to realize when working with in-app purchases is that, as Usual,
    Apple enforces rules with regard to the content you can sell.


    I could list different kinds of things that Apple allows and disallows. But most
    importantly, it''s important to keep one rule in the mind. The main goal that
    Apple has with regard to selling content through your application is the content
    that you''re selling must be delivered through the application to the device.
    This means that anything that is not delivered through the device is not appropriate
    to be using in the in-app purchase system.


    For example, Apple has specifically said that they will not allow applications
    to sell real-world goods. For example, you cannot make an application that allows
    you to sell a book that is then delivered via UPS to someone''s house. On the
    other hand, you can make an application that sells a book that is then delivered
    electronically, directly to the user''s device. Again, the goal is that anything
    that you sell should be deliverable to, and usable on, the device.


    # Working with Unlockable Content


    Once the purchase is made on the device, it is up to you to unlock the content
    that the user has purchased. Where that content comes from is up to you. It''s
    important to remember, however, that the old rules still apply; you cannot modify
    your existing executable. Therefore, whatever new content you are delivering must
    be either non-executable or unlockable through configuration.'
  merge: -1
  pgno: 413
- img_proc: true
  md: '# Chapter 34: Expanding Your Application Using the In-App Purchase Support
    391


    The unlocked content can already be compiled into your application or bundled
    in your application bundle. Alternatively, it can be content that you download
    from the Internet. If you download it, however, realize that you cannot download
    executable content to the device.


    Let''s take a look at a few examples so that you get a feel for how it works.


    Let''s say that you have a racing game that ships with five tracks. You can sell
    additional tracks using the in-app purchase system. The additional tracks might
    already be bundled as part of your application. In this model, the application
    might not even contact your server to complete the purchase. The Store Kit can
    perform the entire purchase on the device and unlock the levels that are already
    there.


    As a second example, let''s say you have an e-book reader. Perhaps you sell the
    e-book reader with one book unlocked, but you want to give the user the ability
    to purchase additional books inside the app. In this case, your catalog of books
    actually exists on your server. When the user purchases a book, Store Kit performs
    the purchase and then sends the receipt to your server, and your server gives
    the ability to download the content that the user has purchased.


    As a third and final example, consider the case where the user uses the ability
    to save a document to your server for a period of time. In this model, the user
    makes the purchase using the Store Kit on the device and then sends the receipt
    to your server; your server enables that functionality within the application.


    Although the Store Kit does maintain a record of the user''s purchases that can
    be retrieved at any time, it is up to you to maintain whatever mechanism is necessary
    to show that the user has unlocked a particular purchase. In order to download
    the list of the user''s purchases, the application has to prompt the user for
    their App Store username and password. Therefore, you cannot use this as a mechanism
    for determining what has and has not been purchased on that device. Instead, it
    is better to use something like NSUserDefaults to store this information. In the
    event that the user causes NSUserDefaults to reset, either through restoring iPhone
    to factory settings or reinstalling your application, the Store Kit provides a
    mechanism for retrieving all of the user''s prior purchases, and you should use
    this mechanism to update your settings and re-unlock whatever content the user
    has purchased.


    # Setting up Purchasable Content in iTunes Connect


    Now that you understand the types of things that you can sell, the final stage
    before you actually implementing code is to set up your products in iTunes Connect.
    However, before you do that, you need to gather some specific information about
    the products that you''re going to sell.'
  merge: -1
  pgno: 414
- img_proc: true
  md: '# 392 Handling Distribution


    Firstly, you obviously need a name for what you''re going to sell. The name is
    simply for your reference. The user does not necessarily see it, but you need
    it for setting up your product and iTunes Connect.


    Secondly, you need a description for your product. Again, this is something that
    the user may not necessarily see it, but it is needed to set up the product in
    iTunes Connect. The price tiers used in iTunes Connect are the same as those used
    for applications. You should already be familiar with these and how they work.


    Finally, the last item that you need is a unique ID. In order to ensure that these
    IDs are unique, Apple recommends you use reverse DNS notation, for example, "com.example-product-name.content-name".
    This unique ID appears on your sales reports and allows Apple to track purchases
    of this particular item.


    Once you have all of this, log into iTunes Connect and visit the "Manage Your
    Applications" link. Within this area, each application has a button for Managing
    in App Purchases. Using this, you can configure each of your products that you
    want to have available for in-app purchase. Once you have configured your products,
    it''s time to begin building support for your purchases into your application.
    To do this, you work with the Store Kit API, and it is this framework that I will
    focus on the remainder of this chapter.


    # Working with Store Kit


    Now that you''ve figured out what you''re going to sell, and set it up in iTunes
    Connect, you can begin integrating the Store Kit framework with your application.
    Remember that, in order to begin the Store Kit, you have to first add it as a
    linked framework to your application.


    The Store Kit framework consists of a group of classes that enable you to interact
    with the App Store. The classes primarily center on interacting with payments,
    products, and the record of transactions the user has already completed. I will
    discuss each of these in the following sections.


    The process for actually accepting payments consists of five distinct parts: verification
    of the ability to purchase items; displaying the items that can be purchased;
    requesting payment; verifying the transaction; and finally, unlocking the content.
    Additionally, you should provide a mechanism within the application to restore
    purchases, as I have previously mentioned.


    Let''s step through each one of these parts now.'
  merge: -1
