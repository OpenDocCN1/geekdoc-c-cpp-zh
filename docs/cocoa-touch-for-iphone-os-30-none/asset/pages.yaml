  md: '# Chapter 12: Working with Other Controls


    Once fully configured, the UITabController displays a UITabBar at the bottom of
    your user interface. When the user touches individual items on the UITabBar, it
    displays the root view from the controller associated with that particular UITabBar
    item.


    # Doing advanced configuration of UITabBars


    You can further customize the behavior of the UITabBarController by utilizing
    a UITabControllerDelegate. The UITabControllerDelegate protocol defines methods
    that enable you to determine whether or not a user should select a particular
    tab bar item or to take action when a tab item has been selected. There are also
    events defined by the UITabControllerDelegate protocol that are triggered when
    the user begins customizing the UITabBarItems via the "More" UITabBarItem.


    See the class documentation on UITabControllerDelegate for more information on
    this behavior.


    # Using UIPickerView


    The last component that you are going to look at in this chapter is the UIPickerView.
    The UIPickerView is an instructive component to examine because it has both a
    delegate interface and a data source interface. This is a very common pattern
    that’s used in Cocoa and Touch. The UIPickerView component enables the user to
    make a single selection from a list of possible choices.


    # CAUTION


    The UIPDatePicker class looks very similar to UIPickerView, but it is not a subclass,
    nor does it allow for the same kind of customization that a UIPickerView does.
    The UIPDatePicker does a great job selecting dates, but the UIPickerView is designed
    to be a more generic and customizable component.


    # Configuring UIPickerView through Interface Builder


    Just like the other components I’ve talked about, you can drag-and-drop a UIPickerView
    component onto your UI wherever you want to display it. Typically you want to
    connect an IBOutlet to the UIPicker, and connect the UIPicker’s delegate and data
    source outlets to objects that handle those responsibilities.


    The only real customizable property in Interface Builder is to determine whether
    or not the UIPickerView shows a selection indicator. Instead, the majority of
    customization for UIPickerView comes from the delegate and the data source.'
