  md: '# Chapter 23: Using the Maps API

    303


    # # Thinking about performance with annotations


    An important thing to remember when working with annotations is that when the
    user zooms to a particular region, you may want to add more detail and more annotations
    to that region. Additionally, when the user zooms out, you may want to reduce
    the amount of detail that the user sees. To do this, you should implement the
    MKMapViewDelegate method mapView:regionDidChangeAnimated; and from it, you should
    examine the span of the map after each region change and use the MKMapView methods
    addAnnotations: and remove Annotations: as appropriate.


    The point here is that if you imagine your map view is annotating city names,
    for example, as your map is zoomed, you probably only want to display annotations
    for the larger cities. Therefore, you need to remove annotations for cities below
    a particular population. Similarly, when the user zooms in, you probably want
    to display more detail, and thus cities with smaller populations. You should therefore
    add back in the smaller cities annotations at this point.


    # # Converting Coordinates


    The final aspect of the Map Kit framework can be useful for your applications
    is the Map Kit reverse geocoder, which is provided via the class MKReverseGeocoder.
    The process of reverse geocoding enables your application to take a set of coordinates
    and find out real-world information about those coordinates. For example, you
    can find out what a particular set of coordinates is, or even all the way down
    to finding the street address for a particular location. This has tremendous potential
    in iPhone software because it enables you to take information about someone''s
    location and turn it into something that is human-readable, and not just coordinates.


    The process of reverse geocoding involves contacting a service on the Internet
    to do the reverse geocoding for you. Therefore, its implementation is asynchronous.
    That is to say, you instantiate an MKReverseGeocoder, and ask it for a reverse
    geocode lookup on the set of coordinates, and then tell it to begin the lookup.
    When the lookup is complete, the reverse geocoder contacts your MKReverseGeocoderDelegate
    to inform you that the lookup has completed either successfully or unsuccessfully.


    Listing 23.4 shows how to instantiate an MKReverseGeocoder and display some human-readable
    text for the annotation for the user''s current location. In this case, you''re
    updating your annotation from your previous example.'
