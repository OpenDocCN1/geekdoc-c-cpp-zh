  md: '# Figure 8.1


    How a UINavigationController works


    | Root View Controller | Root View Controller |

    | :--- | :--- |

    | New York | State Name: |

    | Illinois | New York |

    | Chicago | City Name: |

    | California | New York |

    | San Francisco |

    | Los Angeles |

    | Arizona | Phoenix |


    To navigate between the view controllers displaying the data, you push and pop
    the view controllers onto and off of the UINavigationController. When you push
    a UINavigationController onto a UINavigationController, the UINavigationController
    then displays ViewController as its primary view. Similarly, when you pop a ViewController
    off of the UINavigationController, it removes the top ViewController and brings
    in whatever ViewController was pushed off that ViewController was pushed on originally.


    It may seem complicated, but in fact it''s actually a reasonably simple and intuitive
    interface to use.


    # Creating a UINavigationController


    Xcode provides a template for creating an application with a top-level UINavigationController.
    This is a perfectly acceptable way to create an application with the UINavigationController.
    However, when you create your application for the first time, you don''t know
    exactly what it is that you want your UI to do. So it''s helpful you learn how
    to manually create the UINavigationController and add it to an existing project.
    Fortunately, this is extremely useful.'
