    Now you''ve seen how to store and retrieve data in NSUserDefaults, but how do
    you store the default values for those to use before the user has actually set
    any of the default values? These are the values that are used when the application
    is first launched, before the preferences file for this application has even created.


    If you imagine that your objects and classes can be initialized at any place in
    your application startup, and that you want to avoid avoiding having whether or
    not your defaults are set when you go to access them initially, then it makes
    sense that you should look for a class to initialize your defaults as early as
    possible on the application startup process as possible. Preferably, this would
    occur before any of your classes have even been initialized.


    Fortunately, Objective-C has a convenient method doing exactly this. When the
    runtime loads a class definition, it calls a special static class method initialize.
    This method is called before any methods on your class are called, including your
    designated initializer. It is also called only once per application run. By leveraging
    the special properties of this particular method, you can place your initialization
    of your defaults into this special static class method and be certain that your
    instance methods are ultimately called, your defaults have already been initialized.


    # NOTE


    > You can use the initialize method on the class that actually requires the default
    if you prefer, but typically you find the best location to do NSUserDefaults initialization
    is in the initialize method of your AppDelegate. This is the first class loaded
    by your application and ensures that your defaults are available.


    So, you you have a location where you can initialize your defaults, and that is
    called before any of your class methods or object methods are called. This means
    that your defaults are initialized for when you need them in your classes. So
    the next question is, how do you initialize those defaults?


    NSUserDefaults provides a mechanism for doing this too. The method that you use
    is called registerDefaults:; and it is called with a single parameter that is
    an NSDictionary containing the default values for your defaults. This may seem
    confusing, but just remember that these are the values you receive when you ask
    for a value that has not been set by the user. It uses an NSDictionary as its
    parameter so that if you prefer, you can include a property list in your application
    bundle that you can simply read from disk at startup.


    ![](img/0ccd1d097de6918b1df92faf66d987b6_224_0.png)'
