  md: '# Chapter 14: Building Cinematic UIs with Core Animation


    Core animation is relatively complex subject. It provides a lot of power to the
    application developer to build complex animations for animating user interface
    elements. As a result, you could probably fill a book this size completely with
    core animation tips and tricks.


    What I''ve shown you is really just a taste of the capabilities that you can unleash
    just a bit deeper into core animation. For more information, I recommend looking
    at the core animation documentation, which also includes a cookbook for developers
    who want to work with core animation.


    Now before you finish this chapter, I''d like to talk about one more aspect of
    animation in Cocoa Touch: using UIImageView.


    # Animating UIImageView


    So now you''ve seen how to do basic animations using properties directly on UIView,
    and when you don''t get what you''re looking for, you''ve seen that you can dig
    deeper into the API to use the core animation classes to do more complicated animation.
    But what if the animation you want to do involves something that would be easier
    to render ahead of time and play in your user interface? For example, you may
    want to have a rendered animation of a mailbox shut and its mail-waiting flag
    popping up. An animation such as this would be relatively complex to do using
    animation and transforms. It would be much easier to have an artist render an
    animation as this and then simply display it as a little movie on your UI. It''s
    not possible to use the media playing capabilities of the iPhone to display a
    movie on a button. So how do you do this?


    The answer is relatively simple. UIImageView has the capability of animating itself
    using cells that are provided for that purpose. The UIImageView instance method
    allows you to set an array of images that may animate. The method startAnimating
    then causes the UIImageView to display the cells provided in animation, one after
    another, as if it were displaying a movie. You can set the duration of the animation,
    as well as whether or not it loops. When you want the animation to stop, you can
    simply call stopAnimating.


    # NOTE


    You can configure both the main image of the image view and the animationImages
    property. The main image displays when it''s not animating. In most cases, the
    animated images can be a much lower quality and resolution than the main image
    of the image view. Because it''s animating, the user''s eye compensates for the
    difference in quality. This can help you conserve resources.


    Listing 14.8 shows an image view being loaded with cells for an animation and
    then animating. In this case, the animation will loop each second, showing 15
    frames per second.


    ![](img/0ccd1d097de6918b1df92faf66d987b6_204_0.png)'
