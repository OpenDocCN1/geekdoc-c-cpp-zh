  md: '# Summary


    In this chapter, you''ve been able to build a very simple iPhone application,
    and you also learned to run it in the simulator as well as on your actual testing
    hardware. This was by no means a complicated application, but it did show the
    basics of the entire development cycle, from designing your GUI to writing your
    controllers and launching the application.


    In the next chapter, you''re going to take a closer look at how the simulator
    works because it''s important to be familiar with the intricacies of it when you''re
    doing debugging. Later, you will spend a lot more time looking at how to build
    more complicated applications than this one.'
  merge: -1
