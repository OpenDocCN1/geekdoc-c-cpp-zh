  md: '# Working with Media


    > NOTE

    The hardware may not be able to support the sample rate you request. You should
    therefore check to verify that the sample rate you requested was available.


    # Using AAudioSessionDelegate


    The AAudioSessionDelegate protocol allows the object that you have configured
    as a delegate to respond to specific events related to the AAudioSession. Specifically,
    it enables you to be notified when your application audio has been interrupted,
    for example, during a phone call, or when certain audio parameters have been changed.
    For example, you can be notified if the sample rate has been changed or if the
    availability of an audio input device has changed. Thus, if you can imagine an
    application that records audio (which requires audio input), that application
    might want to be notified if the user unplugs its microphone.


    The kinds of methods defined on the AAudioSessionDelegate are shown in Table 25.2.


    | Table 25.2 AAudioSessionDelegate Methods |

    | Method | Purpose |

    | - (void) beginInterruption | This method is called when your audio is interrupted,
    such as during a phone call |

    | - (void) endInterruption | This method is called when your audio is resumed
    after being interrupted, such when a phone call ends |

    | - (void) categoryChanged:(NSString*) category | This method is received when
    the AAudioSession category is changed |

    | - (void) isAvailableChanged:(BOOL)inputAvailable | This method is received when
    the available input device has changed |

    | (void) currentHardwareSampleRate Changed:(double) sampleRate | This method is
    received when the hardware sample rate has changed |

    | (void) currentHardwareInputNumberChannelsChanged:(NSInteger)numberOfChannels
    | This method is received when the hardware input number of channels has changed
    |

    | (void) currentHardwareOutputNumberChannelsChanged:(NSInteger)numberOfChannels
    | This method is received when the hardware output number of channels has changed
    |'
