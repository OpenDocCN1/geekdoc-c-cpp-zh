    \ server, you need a mechanism for your server to verify that the transaction\
    \ is valid. In other words, the user has purchased the product on your application.\
    \ They then send the receipt to your server to retrieve the unlocked data. You\
    \ need a way to verify that the receipt is valid. Fortunately, Apple provides\
    \ you with a mechanism to do this exactly.\n\nTo verify a receipt from your application,\
    \ you can send a request to the Apple App Store. This request should be a JSON\
    \ object containing the data retrieved from the SKPayment object transactionReceipt\
    \ property. This data should be encoded in the JSON object and associated with\
    \ a key of \"receipt-data.\" Using this JSON object, you post an HTTP POST request\
    \ to the URL https://buy.itunes.apple.com/verifyReceipt. The response from the\
    \ server is also a JSON object containing a key \"status.\" If the status is 0,\
    \ then the receipt is valid. If it is anything else, the receipt is invalid. The\
    \ resulting JSON object also contains details of the actual transaction receipt\
    \ encoded in the \"receipt\" key.\n\nBy using this mechanism, you can ensure that\
    \ a transaction is valid before providing content from your server to the user.\n\
    \n# Unlocking the content\n\nFinally, once you have processed the transaction,\
    \ and verified that the receipt is valid at your server (if needed), it’s time\
    \ to unlock the content."
