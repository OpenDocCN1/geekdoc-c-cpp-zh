- img_proc: true
  md: '# Working with the Accelerometer


    In November 2006, Nintendo introduced the Nintendo Wii. The Nintendo Wii contained
    a variety of innovative controller mechanisms, but one in particular was especially
    revolutionary. The controllers that shipped with the Nintendo Wii contained accelerometers,
    small electronic components inside the controllers that could detect the orientation
    and motion of the controllers themselves. Using the accelerometers, the Nintendo
    Wii launched a completely new gaming experience, unlocking the ability for the
    players to use their bodies as game controllers.


    Nearly a year later, when Apple introduced the first iPhone, it also contained
    an accelerometer, and the accelerometer built into the iPhone was as probably
    revolutionary for mobile application development as it was for the Nintendo Wii.


    Make no mistake, accelerometers are nothing new in the world of electronics. By
    making accelerometers available to application developers as part of the standard
    hardware on the device opens up a completely new user experience. It opens up
    new ways of interacting with applications that were not available before.


    In this chapter, you''ll learn how to harness the accelerometer so that you can
    use it in your application.


    # Determining Which Way Is Up


    The accelerometer built into the iPhone is capable of measuring G-force in any
    of the X, Y, or Z directions. Figure 31.1 shows the direction of these forces
    as they relate to the orientation of the device.


    As you can see, the X- and Y-axes correspond to the flat-level axis of the iPhone,
    whereas the Z-axis corresponds to the perpendicular angle to those axes.


    > 31 In Chapter


    +   Using the accelerometer to determine the orientation of the device\Using a
    low-pass filter to smooth the input from the accelerometer\Implementing shake
    motion detection in a custom UIView'
  merge: -1
  pgno: 384
- img_proc: true
  md: '# 362 Working with the iPhone Hardware


    Figure 31.1

    X, Y, and Z coordinates as related to iPhone orientation


    ![](img/0ccd1d097de6918b1df92faf66d987b6_385_0.png)


    Therefore, when holding your phone flat and level, your X and Y accelerometer
    values should be zero, and your Z value should be somewhere around -1. This corresponds
    to no force being exerted in the X and Y directions, but gravity being exerted
    in the Z direction. The unit of measurement for these values is G-force, with
    1 corresponding roughly to 1g.


    > NOTE

    The accelerometer is not exact, and you''ll probably never see exactly 0.0.'
  merge: -1
