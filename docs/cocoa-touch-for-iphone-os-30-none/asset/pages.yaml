  md: 'Once you have a selection of MPMediaItems, to play them you utilize the MPMPlayerController
    class. It has the ability to control the iPod functionality of the device and
    play music inside your application. I''ll talk more about this distinction shortly.


    # Accessing the Media Library


    I''ll talk about the specifics of how you actually play the media shortly. Before
    you can play the media, however, you need the user to be able to select media.
    There are really two ways of doing this: The first is to present a view controller
    that allows the user to browse their media library and select individual items.
    The second is to construct queries for items and query the media directly. I will
    talk about each of these options in turn.


    # Using the MPMediaPickerController


    MPMediaPickerController is the most "hands-off" method for selecting items from
    the user''s iPod library. It is an entire user interface, accessed through the
    UIViewController standard model, which means that you can use it anywhere you
    would use a UIViewController. For example, you can push it onto a navigation controller,
    or as recommended by the documentation, you can present it modally, using the
    method `presentModalViewController:animated:` on its parent view controller.


    Figure 26.1 shows the MPMediaPickerController browsing some songs. In this case,
    the picker is allowing multiple selection and has a prompt of "Choose Some Tunes."


    As you can see, the user can select by artist, podcast, individual songs, or from
    their playlists.


    Initializing the MPMediaPickerController is as simple as calling its standard
    initializers: `init`, which returns all the media types in the library, or `initWithMediaTypes:`,
    which returns specific media types. The media types that are supported are shown
    in Table 26.1.


    | Table 26.1 Media Types Supported by the MPMediaPickerController |

    | Type | Description |

    | MPMediaTypeMusic | Music only |

    | MPMediaTypePodcast | Podcasts only |

    | MPMediaTypeAudioBook | Audio books only |

    | MPMediaTypeAnyAudio | Any type of audio item |

    | MPMediaTypeAny | Any type of item |'
