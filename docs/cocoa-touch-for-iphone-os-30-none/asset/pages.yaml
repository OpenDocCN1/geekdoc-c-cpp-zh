  md: '# Getting Started with the iPhone


    NOTE

    To download Xcode, you need to sign up for a free developer account on the Apple
    Web site. You can do this at

    http://developer.apple.com/iphone.


    Figure 1.1 shows the Xcode window. In it, you can drag and drop files into your
    projects or organize them by groups. It provides the ability to organize your
    files by Smart groups, which are built using searching queries and can be useful
    for looking for particular files in your projects.


    Figure 1.1

    The Xcode interface


    ![](img/0ccd1d097de6918b1df92faf66d987b6_27_0.png)


    On the right side, you can see the main editing window. It is in this window that
    you will do the majority of your programming work. At the top of the text-editing
    window, you can see some'
  merge: -1
  pgno: 27
- img_proc: true
  md: 'drop-down menus that enable you to quickly jump to any recently opened files.
    The second drop-down menu from the left enables you to quickly jump to any method
    in the current file. Holding down the # key and using the right and left arrow
    keys enables you to quickly navigate backwards and forwards through the file history.
    Additionally, holding down the Option and # together and pressing the up arrow
    key enables you to quickly swap between the implementation and header files for
    the currently active compilation unit.


    The Xcode editor is quite sophisticated and can be configured with a variety of
    shortcuts and hot-keys that make your editing easier and faster. For example,
    using the Option key and the right and left arrow keys enables you to quickly
    jump from word to word in your code. Holding down the # key and using the left
    and right arrow keys enables you to quickly jump to the front or beginning of
    the current line.


    It''s a good idea to learn the intricacies of the Xcode editor inside and out,
    because it is such a fundamental tool to everything you will be doing as an iPhone
    OS developer.


    # Introducing Interface Builder


    The second major component of the Xcode programming environment is the graphical
    interface (GUI) builder called Interface Builder, shown in Figure 1.2. It is this
    application that you will use to draw your GUI for your application and connect
    your buttons to actions in your code.


    Many developers coming to iPhone development from other environments are sometimes
    confused by Interface Builder because it doesn''t generate any code. However,
    this is an asset and not a liability. IDEs that simply generate code tend to be
    more difficult to work with over time, Interface Builder uses more of a metadata
    style approach. This means you tell it that you want to instantiate an object
    of a given type, and when your nib is loaded, it goes and finds the class for
    that type, instantiates it, and attaches the outlets and actions that you have
    configured to the appropriate places. It does not serialize actual instances of
    your objects, nor does it generate code that is


    > NOTE The files that Interface Builder saves are referred to as nib files. This
    stands for NEXT Interface Builder. The file extension of the nib files used by
    the iPhone is .nib. This is to differentiate them from using XML versus the older,
    original format.


    I will talk about Interface Builder in a bit more detail in Part II. However,
    the important thing to know is that you can start Interface Builder either separately
    by simply launching it or by double-clicking any of the .nib files in your project.'
  merge: -1
