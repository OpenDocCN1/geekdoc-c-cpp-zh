    # Handling remote notifications


    iPhone OS 3 added the ability to handle remote notifications. I will discuss notifications
    in much greater depth in Chapter 20. However, it is instructive to at least be
    familiar with the methods that are called on the application delegate when a notification
    for your application has been received.


    Firstly, when your application registers to receive a remote notification of a
    particular type, the method application:didRegisterForRemoteNotificationsWithDeviceToken
    is called, indicating that registration for the remote notification was successful.
    If an error during registration occurs, the method application:didFailToRegisterForRemoteNotificationsWithError:
    is called.


    Finally, when your application receives a notification, the method application:didReceiveRemoteNotification:
    is called. When this method is called, it is passed a dictionary containing the
    payload from the remote notification. You can use this payload to take some action
    in your application based on that notification. It contains components such as
    an alert message, badge quantity, and a sound to play as the alert is displayed.
    Additionally, this dictionary can also have custom data defined by you when you
    set up your notification supplier.


