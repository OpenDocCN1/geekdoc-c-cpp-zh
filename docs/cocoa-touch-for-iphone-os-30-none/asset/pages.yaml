  md: 'Chapter 23: Using the Maps API


    MKMapViewDelegate defines several methods that are useful to application developers,
    who that the most useful methods that it defines, however, are the ones related
    to when the map location is updated. The methods that are called during this time
    are mapView:regionWillChangeAnimated and mapView:didDidChangeAnimated; they are
    called before and after the map center location has been changed, respectively,
    when the user scrolls the map with your finger, your delegate receives calls to
    this method. Therefore, it''s important that your implementation of these methods
    avoids any kind of complex calculation or drawing of views.


    Another useful MKMapViewDelegate call is mapView:annotationView:callout AccessoryControlTapped;
    which is called whenever any of the annotation views are currently displayed on
    your map tapped. Using it, you can trigger actions to occur based on when the
    user has selected a particular annotation. You can then do such as bring in an
    additional view that shows detailed information about that particular annotation.


    # # Annotating Maps


    Annotating an MKMapView is a very simple procedure, but it involves implementation
    from two different perspectives.


    The first is implementation of the model data for your annotations. The Map Kit
    framework provides a protocol that defines the interface that an annotation object
    must implement. This protocol is called the MKAnnotation protocol. Your model
    object should implement this protocol and, at a minimum, must implement the coordinate
    method. The protocol also defines a title and subtitle method that you may want
    to implement to provide a title and subtitle label, but these are optional.


    The second part of the implementation is that your MKMapViewDelegate must implement
    the method mapView:forAnnotation: which returns the view associated with a given
    annotation. When you add your annotations to the view, this method is called for
    each annotation. It is expected that this will return an instance of MKAnnotationView
    customized with the pertinent details for the annotation in question. This method
    should be implemented to the UITableView method cellForRowAtIndexPath: in, rather
    than instantiating a new MKAnnotationView for each annotation, you should instead
    utilize the MKMapView method dequeueReusableAnnotationViewWithIdentifier:, which
    returns an unused annotation view if one is available. If this method returns
    nil you should actually instantiate an instance of MKAnnotationView. Listing 23.3
    shows an implementation of this method.'
