  md: '# Storing User Defaults


    Some of the most common types of data you''ll need to store are defaults. These
    usually include user preferences, minor data, and so on. Cocoa has always had
    an excellent user defaults system available for developers on the desktop. With
    the introduction of the iPhone, Apple brought the user defaults API to Cocoa Touch
    as well.


    The class used to store user defaults is NSUserDefaults. Using this class, you
    can not only read and virtually any value to the user defaults system, but you
    can also store "default defaults," which are the defaults if the user hasn''t
    set a value.


    When you store values to NSUserDefaults, the values are serialized and stored
    in your application sandbox under the directory Library/Preferences, similar to
    OS X for the desktop.


    # Acquiring the NSUserDefaults Object


    NSUserDefaults is a singleton. This means that an application contains a single
    instance of NSUserDefaults that is used by the entire application, no matter where
    it''s accessed. The class provides a static accessor to initialize and retrieve
    the singleton object. The accessor for this is standardUserDefaults. Listing 17.1
    shows how you access the user defaults singleton.


    This is all you need to read the user defaults singleton. There is no need to
    read anything, or when you''re done with the object, to save anything. The NSUserDefaults
    object handles all of it for you, storing your data in a file specific to your
    application, and automatically loading that file when it is invoked for the first
    time. The NSUserDefaults object also caches all the values in the file in memory,
    and so it is perfectly acceptable to access values directly from the NSUserDefaults
    object when needed without concerned about incurring the cost of reading from
    the disk.


    # In This Chapter


    +   Storing and retrieving user preferences in NSUserDefaults


    +   Adding and configuring a settings bundle for your iPhone app'
  merge: -1
  pgno: 220
- img_proc: true
  md: '# 198 Working with Data


    The NSUserDefaults object periodically synchronizes the contents of the in-memory
    cache with the disk file to ensure it is kept up-to-date. If you feel the need
    to force this synchronization, the NSUserDefaults object provides the synchronize
    method for this purpose. However, in my years of Cocoa and Cocoa Touch programming,
    I have rarely felt the need to call the synchronize method. More than likely,
    the periodic synchronization that NSDefaults does on its own is more than sufficient
    for your needs.


    # Listing 17.1

    Accessing the User Defaults Singleton


    ```

    NSUserDefaults *defaults = [NSUserDefaults standardDefaults];


    // ... read or write defaults here


    ```


    # Reading and Writing Values to NSUserDefaults


    Reading and writing values to NSUserDefaults is trivial. At its simplest level,
    NSDefaults behaves a bit like an NSDictionary in that it provides methods for
    setting and retrieving objects that are associated with keys using the methods
    objectForKey: and setObject:forKey:. In addition to this low-level method, it
    also provides a set of methods for storing specific kinds of values as scalars,
    arrays, and dictionaries.


    For a value to be stored in NSUserDefaults, it must either be a scalar value or
    one of these specialized setters or getters or it must be a value that can be
    serialized to a property list. Most of the commonly used objects in Cocoa and
    Cocoa Touch meet this criterion. For other objects that do not, they can be serialized
    by archiving them into an NSData and then storing the NSData in NSUserDefaults.


    Table 17.1 shows the setters and getters available for storing and retrieving
    objects to and from NSUserDefaults.'
