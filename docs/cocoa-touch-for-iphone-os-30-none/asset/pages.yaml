  md: '# Playing Video in Your Application


    You''ve seen how to play audio in your applications. You''ve also seen how to
    play items from a user''s iPod library, and how to control control the iPod application
    from your application. The Media Player framework has one more goodie for you
    investigate, and this is the MPMPlayerController, which enables you to play movies
    within your applications.


    The MPMPlayerController is capable of playing H.264 video at 640x480 resolution
    at 30 frames per second. It can play media contained within your application bundle,
    or it can stream video over the Internet from a URL. When the player begins playing,
    it fades out your user interface (UI) and fades in the media player. When the
    video has finished, it fades out the media player and brings back your UI. It
    is only capable of displaying video full screen; or not to display it in a portion
    of screen.


    Let''s take a look at how to utilize this class to play video within your application.


    # Playing Video Files Contained in the App Bundle


    Playing video bundled in your application

    Learning how to play cut scenes using MPEG video

    Streaming video from the Internet


    Playing videos from inside your application bundle using the MPMPlayerController
    is a snap. Naturally, you have to be sure that the media is included in your application,
    so it has to be bundled as a resource. Then you simply use the NSBundle pathForResource:ofType
    to get the path to the video within your application''s main bundle. You can then
    create an NSURL that you can use to initialize the MPMPlayerController.


    > NOTE

    Remember, MPMPlayerController is part of the MediaPlayer framework. To use it,
    you must include it as a linked framework and be sure to import the headers needed
    for it.'
  merge: -1
