  md: '# Narrowing the Accuracy of the Coordinates


    As I''ve said before, when working with a mobile device with limited battery power,
    it''s important to conserve that power whenever possible. Determining the user''s
    location at high accuracy requires more time and power than determining it with
    lower accuracy. Because of this, CLLocation provides the ability to set the accuracy
    of the data that it returns. This is done using the desiredAccuracy property.
    The values that can be set for this property are listed in Table 30.1. They are
    relatively self-explanatory as what they represent.


    | Table 30.1 Possible Values for the DesiredAccuracy Method |

    | Value | Description |

    |---|--|

    | kLocationAccuracyBest | Gives the best possible accuracy |

    | CLLocationAccuracyNearestTenMeters | Accurate to 10 meters |

    | CLLocationAccuracyHundredMeters | Accurate to 100 meters |

    | CLLocationAccuracyKilometer | Accurate to 1 kilometer |

    | CLLocationAccuracyThreeKilometers | Accurate to 3 kilometers |


    just because you request a particular level of accuracy does not necessarily mean
    that you will receive data at that level of accuracy. The device does its best
    to meet your request, but it may not necessarily be able to accomplish it.


    The CLLocationManager tries to return at least some kind of data as quickly as
    possible, so it may return data at a lower level of accuracy to begin with and
    then return data at a higher level of accuracy. You should be prepared for this
    in your application and take appropriate action, such as narrowing your display
    to the more accurate point after you have received it.


    # Filtering Location Updates


    Finally, again because you''re working with a device with limited power, you want
    to minimize the updates that you get and not necessarily receive an update of
    the user''s location if the user has not moved. The CLLocationManager also provides
    an API for this: the distance Filter property.


    When you set this property, you only receive updates to the user''s location when
    they pass beyond a certain threshold of distance from the last location received.
    The value of this property can be set to a number that indicates the distance
    in meters from the original location, or it'
  merge: -1
  pgno: 379
- img_proc: true
