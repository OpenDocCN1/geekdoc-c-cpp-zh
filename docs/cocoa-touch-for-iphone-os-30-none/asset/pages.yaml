  md: '# Exploring the Supported Media Types


    At its heart, the iPhone is a sophicated media device. It is, at the end of the
    day, an iPod as well as a phone. It can play a variety of audio and video formats
    and contains ample storage for this media. In the upcoming chapters, I''m going
    to discuss how you play audio and video files, but before that I''ll discuss the
    types of formats the iPhone is capable of playing and the limitations involved.


    # Supported Audio Formats


    The first iPod shipped in 2001 and had a 5GB hard disk, which enabled it to store
    1,000 songs. Today, over 175 million iPods have been shipped, with the largest
    among them storing 160GB of data. The iPhone is more than just an iPod, but it
    can thank its predecessors for its amazing support formats.


    # Compressed audio


    When it comes to compressed audio, the iPhone OS utilizes a hardware codec for
    playback. This means that it is only capable of playing one such sound at a time.
    This makes these formats suitable for "Long play" types of applications, where
    your audio is playing for a lengthy period of time, perhaps the duration of your
    application runtime. It does not, however, make it possible to mix sounds together.
    To do this, you must use an audio format that is played using a software codec.


    The audio formats that are played with a hardware codec are AAC, ALAC (Apple Lossless),
    and MP3. You can only play one of these audio files at a time. That said, it is
    possible to play one of the formats that require the software codec concurrently
    with an audio file requiring a hardware codec.


    ![](img/0ccd1d097de6918b1df92faf66d987b6_332_0.png)


    > In This Chapter

    Audio and video formats that the iPhone OS supports

    Limitations in audio playback of compressed versus uncompressed audio'
  merge: -1
  pgno: 332
- img_proc: true
  md: '# Uncompressed audio


    You''d never be able to make much of a game if you couldn''t play more than one
    audio file at a time. iPhone OS does provide the ability to play multiple sounds
    at a time and even mix them together at different volumes. To do this, iPhone
    OS uses a software codec, which utilizes the CPU of the iPhone to play the audio,
    as opposed to the hardware decoder.


    The formats that use this software codec are Linear PCM, IMA4, iBC, μ-law, and
    a-law.


    Using sorts of this type, you can play many of them simultaneously, as well as
    a compressed audio file is playing. Unfortunately, their file sizes tend to be
    much larger, which means that they quickly inflate the size of your application
    bundle. As a result, you should probably limit them to use short sounds.


    # Supported Video Formats


    With audio, the iPhone is also an amazingly capable video-playing device. The
    video format supported is H.264 MPEG-4. You can bundle these files in your application,
    and play them.


    When a video is played back, the video playback takes over the entire screen.
    You can choose to display playback controls as part of the video playback. If
    you choose not to display playback controls, the video plays to completion without
    the ability to be interrupted or paused. This is useful in cases where you want
    to display a cut scene in a game.


    # Summary


    In this chapter I''ve introduced you to some of the multimedia capabilities of
    iPhone OS and shown you the types of video and audio files that the iPhone OS,
    and thus your applications, can play. By leveraging the iPhone''s powerful audio
    and video capabilities, you can bring an incredibly rich user experience to your
    games and applications. You should never underestimate the value of using high-quality
    ambient sounds and dramatic video to enhance the immersive qualities of your product.'
  merge: -1
  pgno: 333
- img_proc: true
  md: '# Playing Audio


    The iPhone isn''t just a phone. It''s a media player. Thanks to this capability,
    it sports some of the best audio hardware in the business, and fortunately that
    hardware is ripe to be manipulated using code.


    In the old days of iPhone OS 2.x, playing audio was a black art, limited to code
    that used the foundational framework, Core Audio. In today''s world of iPhone
    OS 3, however, playing and recording audio has become infinitely easier, and you
    now have access to a set of shiny, new Objective-C classes that make playing audio
    a snap.


    # Using the AV Foundation Framework


    The AV Foundation Framework consists of three primary classes — AVAudioPlayer,
    AVAudioRecorder, and AVAudioSession — which correspond to playing, recording,
    and configuration, respectively. Each of them has a delegate protocol that’s used
    to respond to events related to each of the classes.


    ![](img/0ccd1d097de6918b1df92faf66d987b6_334_0.png)


    > NOTEnTo use the AV Foundation Framework in your application, be sure to add
    it as a framework to your target’s linked frameworks. The framework name is AVFoundation.
    Remember also to import the correct header files in code you want to use it in.
    The header file is AVFoundation/Foundation.h.


    # Setting your audio configuration with AVAudioSession


    The AVAudioSession class provides the mechanism that enables you to configure
    the behavior of your audio with regard to things such as the mute switch and whether
    the audio causes iPod playback to pause. Additionally, its delegate enables your
    application to take action when the audio is interrupted for phone calls and the
    like.'
  merge: -1
  pgno: 334
- img_proc: true
  md: "AVAudioSession is a singleton and therefore is accessed by the singleton method\
    \ sharedInstance. Once you have the AVAudioSession shared instance, you can use\
    \ it to configure your sample rate, your IO buffer sizes, and perhaps the most\
    \ important configuration item, the audio session category.\n\nThe audio session\
    \ category defines the behavior of your audio by categorizing it as a particular\
    \ type.\n\nA common, misguided question from first-time iPhone developers when\
    \ they begin working with audio is \"How do I monitor for the mute switch so that\
    \ I can stop my audio?\" The answer is that you don't. You handle the mute switch\
    \ by switching your audio session category to one that handles it for.\n\nYou\
    \ can set the audio session category by calling the method on the AVAudioSession\
    \ setCategory:error:. The possible categories, and how they work, are shown in\
    \ Table 25.1.\n\n# ### Table 25.1 Audio Session Categories\n\n| Category | Purpose\
    \ |\n| AVAudioCategoryAmbient | This category is intended for long-duration background\
    \ sounds and audio that should be mixed with iPod audio. Audio from other applications\
    \ is mixed with the audio from your application when played. This category silences\
    \ audio when the mute switch is enabled or the phone is locked |\n AVAudioCategorySoloAmbient\
    \ | Like the previous category, this category is intended for long-duration background\
    \ sounds. However, this category causes the audio from other applications to be\
    \ silenced when your application is playing. The audio is not mixed. This is the\
    \ default category if you do not set one. This category silences audio when the\
    \ mute switch is enabled or the phone is locked |\n AVAudioCategoryPlayback |\
    \ This category is for audio that is intended to play regardless of whether or\
    \ not the mute switch is set. It continues to play when the screen is locked.\
    \ Typically, this is used in an application that features audio playback as part\
    \ of its central functionality |\n AVAudioCategoryRecord | This category is intended\
    \ strictly for recording audio. It silences all audio playback |\n AVAudioCategoryPlayAndRecord\
    \ | This category is intended for playback and recording of audio. It does not\
    \ silence audio playback while recording.\n\nListing 25.1 shows how an application\
    \ can utilize the category. This is typically what that you would do in your application\
    \ delegate when your application launches."
