  md: '# Understanding the Basics of Model,

    View, Controller


    Regarding UIControllers, the first thing you need to do is review the Model, View,

    Controller design pattern and see where the classes that you will be working with
    fit into it.


    Figure 5.1 shows how the Model, View, Controller design pattern is typically described.
    As you

    see, there are there three major components to an application designed with this
    pat-

    mind. On the far left, you see the model part of the diagram. This typically consists
    of

    data storage and manipulation classes such as arrays, dictionaries, or database/file
    storage

    classes. These are classes whose purpose is to handle the actual housekeeping
    of the storage of

    data. This means that the model part is what actually handles the reading and
    writing of the

    data to the disk or the caching of that data in memory. It also contains methods
    for operating

