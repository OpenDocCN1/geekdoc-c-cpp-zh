  md: '# CAUTION


    You can play multiple uncompressed audio files simultaneously on the iPhone, but
    you can only play one compressed audio file at a time. This means that if you
    want to mix your audio at runtime, you need to use uncompressed audio files. These
    include even audio from the iPod application, regardless of the category you have
    set.


    # Using AVAudioPlayerDelegate


    The AVAudioPlayer also has a delegate protocol called AVAudioPlayerDelegate. The
    most useful method that your delegate will likely receive is the audioPlayerDidFinishPlaying:successfully;
    method which calls your delegate that the audio player completed the requested
    sound. If there is an error during audio decoding, the delegate method audioPlayerDecodeErrorOccur:error
    is also called. The error parameter is passed to this method indicates the error
    that occurred during decoding.


    Again, just like AVAudioSession class, the AVAudioPlayer can respond to interruption
    events by implementing the methods audioPlayerBeginInterruption: and audioPlayerEndInterruption:.
    When the AVAudioPlayer receives an interruption, it is automatically paused, and
    your audio session is deactivated. When the interruption is ended, the AVAudioSession
    is automatically reactivated, but you must resume play by calling the play message
    again on your AVAudioPlayer. When you call, playback should resume where it left
    off.


    # Playing Audio with OpenAL


    The Foundation Framework is excellent for lightweight audio requirements. However,
    when it comes to developing a highly immersive game application, you may find
    that you want a bit more control over the way that the audio is played back. For
    example, you might want to have the audio for an explosion appear to come from
    a particular side of the screen, or you may want to have an environmental sound
    move when the user changes their perspective. To support this, the iPhone includes
    full support for the standard API OpenAL.


    OpenAL, like its cousin OpenGL, is a platform-independent API. OpenAL handles
    designed to enable three-dimensional audio and effects. To support this, OpenAL
    provides an environment mapping system that includes both a listener object and
    sound sources, all of which can be positioned within an environment. Thus, rather
    than individually mixing the sound channels in order to imitate stereo sound that
    is appropriately positioned for your application, you tell the OpenAL engines
    that you want a particular sound to play at a particular volume inside the environment
    and that your listener is located at a particular location inside the environment.
    The OpenAL engine handles the mixing of the sound so that it appears that the
    audio is coming from the location you specified.'
  merge: -1
