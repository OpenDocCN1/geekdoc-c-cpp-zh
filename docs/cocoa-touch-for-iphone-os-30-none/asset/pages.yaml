    # # Summary


    In this chapter, I covered a lot of ground with regard to accessing the Internet
    and local hosts. You''ve seen how you can use the high-level Objective-C classes
    such as NSURLRequest and NSURLConnection to access data from the Web. Additionally,
    you''ve seen how to use the new Message UI framework to send e-mail from within
    your application. If these high-level APIs aren''t powerful enough for you, you''ve
    also seen how to drop down into the core foundation API to do more low-level socket
    coding when needed. Finally, you''ve seen how you can use Bonjour to both publish
    and discover services on the local network.


    Using the knowledge you''ve gained in this chapter, you can implement any different
    types of network services in your application. It''s important to remember that
