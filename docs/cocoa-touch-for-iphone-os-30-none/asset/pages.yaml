  md: 'The first, demonstrated by use of the UISlider, is the most basic. Things such
    as buttons, labels, switches, and so on all follow the same model. You place them
    on your view, you configure them, you might attach them to an IBAction, or you
    might have an IBOutlet that enables you to set their value or read their value
    later.


    The second, demonstrated by the use of UITabBar, demonstrates a view and its accompanying
    view controller that control a set of child view controllers and provide a consistent
    navigational model to view each of these child view controllers.


    And finally, the UIPickerView utilizes a delegate and data source to allow you
    to configure the appearance and behavior of the component.


    Between these three different types of components, you should be able to take
    the knowledge that you''ve learned here and apply it to other components that
    you can find in Interface Builder.'
