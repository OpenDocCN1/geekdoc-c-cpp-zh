  md: '# Creating


    Managed objects is very simple. You use the NSEntityDescription class method insertNewObjectForEntityName:inManagedObjectContext,
    passing the name of the entity type that you want to create and the managed object
    context within which you want to create it. For example, to create a new state,
    you might do something like Listing 18.6.


    Listing 18.6


    # Creating a New State Object


    ```

    *state = [NSEntityDescription

    insertNewObjectForEntityName:@State

    inManagedObjectContext:context];

    [state setName:@Arizona];

    NSError *error;

    [context save:&error];

    ```


    You ensure that the object is written to disk by calling off of the managed context.
    Of course, it''s possible that an error might occur, so if one does, you should
    probably deal with that error in some manner appropriate for your application.
    The save method returns a BOOL value indicating success. If it returns NO, you
    should check the error object for the cause of the error.


    # Reading


    When I talk about reading objects, I''m really talking about using an NSFetchRequest.
    An NSFetchRequest enables you to query the database for objects of a particular
    kind. Using the NSManagedObjectContext instance method executeFetchRequest:; you
    can execute one of these queries, using parameters to filter the results, and
    even sort descriptors that enable you to sort the array that is returned. The
    array contains instances of the type of entity that you have requested. So, for
    example, to retrieve all of the cities for a particular state, you might do something
    like the code shown in Listing 18.7.


    Listing 18.7


    # Fetching Cities for a Particular State


    ```

    (NSArray *)citiesForState: (State *)inState;

    (

    NSFetchRequest *req = [NSFetchRequest new];

    NSEntityDescription *descr =

    ```'
