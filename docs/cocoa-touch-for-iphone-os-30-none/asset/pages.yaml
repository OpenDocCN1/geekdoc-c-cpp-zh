  md: "# Understanding the Differences between\nThe Simulator and the Real Thing\n\
    \nI've mentioned several times now that the simulator is not a perfect replica\
    \ of iPhone hardware\n that the hardware does not necessarily support everything\
    \ that the simulator does. As a\ndeveloper of iPhone applications, it's important\
    \ to be able to discern between what is available\nto simulator and what is available\
    \ on the hardware, and to know the differences in terms of\nperformance between\
    \ the two.\n\n# Avoiding APIs that don't work on a real device\n\nThe Cocoa and\
    \ Cocoa Touch development environments can be defined in terms of layers. At\n\
    the topmost layer, the layer that comes direct interaction with the user, is the\
    \ UIKit frame-\nwork on Cocoa Touch, and the AppKit framework on Cocoa. These\
    \ contain components such as\nbuttons, views, list controls, and so forth. Originally,\
    \ all of the Objective-C classes\ndescended from NSObject and were provided by\
    \ Apple were all prefixed with \"NS\". This\nst for NeXTStep, and was a legacy\
    \ holder from the original platform used on the NeXT\ncomputers. Gradually, as\
    \ Apple has been adding more and more\nclasses do not follow this convention.\
    \ Cocoa Touch is one of these.\n\nInasmuch as they serve the same purpose and\
    \ contain similar graphical elements (both of them\nhave buttons, for example),\
    \ many of the class names in AppKit and UIKit are similar if not\nexactly the\
    \ same. Because of this, differentiate the UIKit classes from the AppKit classes,\n\
    Apple chose to prefix the classes with \"UI\" prefixes rather than the \"NS\"\
    \ prefix used\nin AppKit. As a result, differentiating between AppKit documentation\
    \ and classes and\nUIKit documentation is relatively simple. Additionally, when\
    \ compiling for the simula-\ntor it is linked with a special version of UIKit\
    \ made specifically for the\nor with AppKit. So, when you're working with UIKit\
    \ classes, you can be rea-\nsonably certain that anything you call on the simulator\
    \ will be available on the hardware as\nI'm going through a lot of effort to fix\
    \ this because you are looking at Foundation,\nit it's not quite so.\n\nFoundation\
    \ is the next layer of API benefit AppKit and UIKit. It includes NSString,\nNSArray,\
    \ NSDictionary, and many other low-level classes.\n\nWhen it comes to these classes,\
    \ generally speaking, most things are supported on both Cocoa\nand Cocoa Touch.\
    \ However, there are some notable exceptions, in particular with regard to\ndrawing\
    \ things. On Cocoa, for example, NSString has a category that gives it the ability\
    \ to\ndraw NSStrings within a view. Cocoa Touch does not include this capability.\n\
    \nThe best way to avoid using APIs that are not included in Cocoa Touch is to\
    \ be\nwhen you're browsing the documentation on the API, that you are looking\
    \ at the iPhone doc-\nmentation as opposed to Mac OS X documentation."
  merge: -1
