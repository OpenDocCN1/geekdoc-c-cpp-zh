  md: 'Similarly, to remove a view controller from the UINavigationController, you
    use the method popViewControllerAnimated: which removes the top view controller
    from the stack and slides in whatever view controller was pushed off in order
    to display that view.


    If you have multiple levels of view controllers being displayed, the method popToViewController:animated:
    continues popping view controllers off the stack until it finds the view controller
    you have passed in.


    Finally, if you want to remove all of the view controllers except for the root
    view controller and return to the top level of your stack, method popToRootViewControllerAnimated:
    exactly that.


    # Adding a UIToolbar


    With the introduction of iPhone OS 3, Apple added the ability to easily manage
    a toolbar displayed at the bottom of a UINavigationController. By default, the
    toolbar is hidden, so to display it, all you need to do is call the method setToolbarHidden:animated:
    on the navigationController object. The items displayed in the toolbar are retrieved
    from the currently active viewController by accessing the toolbarItems property.
    The bar items property should contain an array of UIButtonItem objects and can
    be set using the method setToolbarItems:animated:


    # Editing of the Rows


    Now that you''ve seen the basics of how to work with a UINavigationController,
    let''s extend the cities application to add the ability to edit your model. In
    doing so, you will use the UINavigationController as your top-level view, enabling
    you to select items from your list of cities, and edit them in a subview that
    you will push onto the UINavigationController.


    # Moving MyView into a UINavigationController


    The first thing you do is in order to add a UINavigationController to your project
    is to remove your viewController from your MainWindow nib and replace it with
    a UINavigationController.


    To do this, open the MainWindow nib in Interface Builder, find your viewController
    that you added for My object, and delete it. Drag-and-drop a UINavigationController
    from the palette to the object browser window. Configure the UINavigationController
    so that the root viewController is now your MyView. You also have to configure
    the Class type on the root view after you have set the root view controller under
    the UINavigationController. By using the Class property under the Class Identity
    settings in the properties window after you have selected the root view controller.'
