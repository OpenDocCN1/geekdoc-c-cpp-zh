    loading data from disk or (in cases of unloading and disappearing) saving data
    to disk or setting values on the model.


    # Handling view rotations


    The ViewController can also provide basic handling of view rotations. To declare
    that you support orientations other than portrait, you must override shouldRotateToInterfaceOrientation
    method to return YES. In this method, you should look at the orientation that
    is being requested and return YES for the orientations that your subclass supports.
    If your view needs more complex support for rotation, the additional methods willRotateToInterfaceOrientation
    and rotateFromInterfaceOrientation are provided as hooks for you to do more complex
    operations. These are called at the beginning and end, respectively, of the orientation
    event. When the device is being rotated from portrait to landscape, you receive
    a rotateToInterfaceOrientation call at the beginning of process, telling you that
    the device is about to rotate to landscape mode. At the end of rotation, you receive
    a rotateFromInterfaceOrientation call, telling you that the device just rotated
    from portrait mode.


    Typically, these methods would be overridden during processing during rotation,
    which might adversely impact the rotation animation itself. If you can imagine
    a view that needs to do some calculation to display, you might want to disable
    processing during the actual animating from one orientation to the other. That''s
    where you would use these kinds of methods.


    Finally, if you want to provide custom animations for the rotation transition,
