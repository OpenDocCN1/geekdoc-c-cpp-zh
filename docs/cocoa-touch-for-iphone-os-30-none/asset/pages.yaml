  md: '# Getting Started with the iPhone


    > NOTE

    The traditional example application is one that displays "Hello World." Yours
    will do slightly more than that, but not much.


    When you have your interface loaded into Interface Builder, browse through the
    Object Library and find an instance of a Label. Drag and drop this instance onto
    your view. Next, find an instance of a text field, and drag and drop this instance
    beneath your label. Finally, find an instance of a Round Rect Button, and drag
    and drop this instance onto your view. When positioning each of these controls,
    try to position them in the upper third of the view. This enables the keyboard
    to pop up from the bottom when you touch the text field. Later, you will learn
    how to move your view when the keyboard comes into play, but for now you will
    just position it out of the way.


    When finished, your user interface looks something like Figure 2.5.


    Now, you''re going to take the text that is typed into the text field, and when
    the button is pushed, you''re going to copy that text into the label field. This
    is a bit more complicated than your basic "hello world," but it shows you all
    of the basic components needed to build a very simple graphical user interface,
    or GUI.


    Right now, save your work in Interface Builder, and close the application. You''re
    going to return to Xcode, where you will add some code to your view controller.'
