    ![](img/0ccd1d097de6918b1df92faf66d987b6_383_0.png)


    > NOTE

    Sometimes the compass may need calibration. When it does, your delegate is notified
    via the method ManagerShouldDisplayHeadingCalibration: If your delegate implements
    this method, it can return NO to suppress display, or YES to allow it.


    I won''t describe in detail how to update this application with this capability,
    but if you need to add it to your application, see the Apple documentation for
    more details.


    # Summary


    In this chapter, you looked at how to use the Core Location API to add location
    awareness to your applications. The ability of the device to know its location
    is one of the unique defining features of iPhone development. As a result, leveraging
    this technology can enable many new and interesting applications.'
  merge: -1
