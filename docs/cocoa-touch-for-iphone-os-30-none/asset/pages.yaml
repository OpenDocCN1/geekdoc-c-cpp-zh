  md: '# Chapter 17: Storing User Defaults


    # Using the Settings App


    Everything I''ve talked about so far with regard to defaults applies equally to
    both Cocoa and Cocoa Touch. There is, however, one of the default system that
    is specific to Cocoa Touch in the iPhone. That is the use of settings bundles.


    A settings bundle enables you to display application settings inside the Settings
    application on the iPhone home screen. Generally speaking, in order to maintain
    a consistent user experience, Apple has stated that applications need to store
    settings that are typically set once and not changed again during the lifetime
    of the application should allow the user to configure these settings through the
    Settings application. This enables you as the developer not to clutter your user
    interface with settings tab that is rarely used and allows the user to have a
    single location where she can configure the settings for all of her applications.


    Think about it this: if you have an application setting where the default value
    is usual for most users but some advanced users may want the option to change
    it, this is an ideal candidate for storing in the Settings application.


    This is not to say that all applications should always store all of their settings
    in the Settings application. In fact, in practice, many users are not aware that
    there are settings in the Settings application at all. Instead, if you find a
    setting that either needs to be changed frequently or that you expect most of
    your users will want to customize, then you may want to provide a mechanism in
    the application to configure that setting.


    # Adding a settings bundle


    To add a settings bundle to your application, simply choose New File from the
    File menu, and then from the Resource category, choose Settings Bundle. This adds
    a new bundle to your project with some property lists that you can use to configure
    your settings.


    Inside the settings bundle, you find the Root.plist file, which is the one that
    you use to configure your settings. If you click this file, it opens the property
    editor in Xcode. To find your property list as an iPhone settings bundle, choose
    Property List Type→iPhone Settings plist


    > NOTE

    Many developers don''t like the default property list editor in Xcode. Property
    lists are nothing but plain text, and if you would prefer to use the text editor
    built in Xcode to edit your property lists, then you can change the default association
    for the file type "text.plist," in Xcode preferences under the File Types settings,
    to Plain Text. This will not work, however, with binary plists, so beware.'
  merge: -1
