  md: '# # Looking at the Built-in Applications


    ### Figure 4.2


    The iPod application UI


    ![](img/0ccd1d097de6918b1df92faf66d987b6_57_0.png)


    The iPod application, you''ll see that the basic zones that I just described are
    contained inside this application, as shown in Figure 4.2. Specifically, you still
    have the status bar at the top. Next you have the navigation controller. You then
    have the list of songs and artists in the main interaction area. Finally, at the
    bottom of the screen, you have a tab controller that enables you to switch between
    the major functions of the iPod, and that generally stays active through most
    interactions. As you can see, this is somewhat similar to how the main iPhone
    interface works.


    The iPod application is an excellent example of an application that has to manage
    and navigate trees and lists of hierarchical data. There are other types of user
    interfaces that you can look at here, as well, such as the Weather application,
    shown in Figure 4.3.'
