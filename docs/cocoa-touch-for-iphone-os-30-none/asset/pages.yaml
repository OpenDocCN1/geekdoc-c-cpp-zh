- img_proc: true
  md: '# Chapter 31: Working with the Accelerometer


    Now I''m going to show you how to make an example application using the accelerometer.
    The example application will be essentially a bubble level. When it''s finished,
    it will look something like Figure 31.2.


    Figure 31.2


    The completed bubble-level application


    ![](img/0ccd1d097de6918b1df92faf66d987b6_386_0.png)


    In this application, you will be ignoring the Z values of the acceleration object.
    Rest assured, however, that you want to work with the Z values, they are there
    as well.'
