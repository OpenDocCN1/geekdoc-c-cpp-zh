    Another task that''s often required when working with animations is related to
    knowing when an animation completes. The animations themselves take place in the
    run loop of the application asynchronously. This means you don''t simply tell
    it to animate and then wait for the animation to complete. The animation is running
    while your application is doing other things. This means that you need to know
    when the animation has completed so that you can do any finishing tasks, such
    as launching another animation or removing a view that was faded out.


    To this, you configure the delegate for the animation block to be the object that
    reacts to these events. Then you configure a selector on that delegate to be called
    when the animation has completed. You do this using the calls `setAnimationDelegate:`
    and `setAnimationDidStopSelector:`


    Let''s take a look at an example where you want the button to fly off the screen,
