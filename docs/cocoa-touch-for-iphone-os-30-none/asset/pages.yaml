  md: "# Creating the UIPickerViewDataSource\n\nUIPickerView appears in your UI to\
    \ be a barrel-shaped dial that you can spin to select a particular value. The\
    \ barrel is broken up into parts called components. In this way, you can allow\
    \ the user to configure several different values at once using the different components.\
    \ For example, you can have a component to represent each of the hundreds, tens,\
    \ and ones places in number selection. This is much easier than the user, for\
    \ example, displaying a single component with the numbers 1 through 1000.\n\n\
    The UIPickerDataSource works a little differently from data sources that you've\
    \ seen so far in it doesn't actually present the data displayed in the UIPickerView\
    \ per se, but instead configures only the components and row counts for the UIPickerView.\
    \ The actual data displayed in the UIPickerView is retrieved from the delegate.\n\
    \nTo configure the number of components on your UIPickerView, implement the method\
    \ numberOfComponentsInPickerView: on your UIPickerViewDelegate. Again, this method\
    \ should return the number of components that you wanted displayed. So, following\
    \ your example earlier you wanted to display a component for each of the 100s,\
    \ 10s, and 1 places in a number, the number of components would be three.\n\n\
    To configure the number of rows in your given component, implement the method\
    \ pickerView:numberOfRowsInComponent:. Still following the previous example, to\
    \ display ten digits, (0-9) as the number of rows in each of the components.\n\
    \nListing 12.1 shows implementations of both of these methods.\n\n# 12.1\n\n#\
    \ Implementation of a UIPickerViewDataSource\n\n```\n(NSInteger)numberOfComponentsInPickerView:(UIPickerView\
    \ *)pickerView\n    return 3;\n```\n\n```\n(NSInteger)pickerView:(UIPickerView\
    \ *)pickerView\nnumberOfRowsInComponent:(NSInteger)component\n    return 10;\n\
    ```\n\nThese are incredibly simple examples, but I include them here so that you\
    \ can see the complete method signatures."
  merge: -1
  pgno: 179
- img_proc: true
  md: "# Creating a UIPickerView delegate\n\nIn a UIPickerView, the delegate is the\
    \ one that provides the actual data's that is displayed in the rows. You can implement\
    \ the method tableView:titleForRow:forComponent or the method tableView:viewForRow:forComponent:reusingView::\
    \ these return the text to display in a given row for a given component, or an\
    \ actual complete view to display that row for that component, respectively.\n\
    \nFollowing my earlier example, you may implement the method tableView:titleForRow:forComponent:\
    \ such that it returns the numbers zero through nine, depending on the row that's\
    \ being requested. This is shown in Listing 12.2.\n\nListing 12.2\nUIPickerViewDelegate\
    \ titleRow code\n\n```\n- (NSString *)picker:(UIPickerView *)picker\n    titleForRow:(NSInteger)\
    \ row\n    forComponent:(NSInteger) component\n   {\n        return [NSString\
    \ stringWithFormat:@\"%ld\", row];\n   }\n```\n\nAn important thing to take away\
    \ here is that the UIPickerView asks the data source for the number of rows in\
    \ the number of components. It then asks the delegate what title to display in\
    \ each one of those rows.\n\nFurther customization, such as the width and height\
    \ of components and rows, can also be done by implementing the methods tableView:widthForComponent:\
    \ and tableView:titleForRow:forComponent: on the delegate.\n\nFinally, when the\
    \ user selects an item from the UIPickerView, the method tableView:didSelectRow:in\
    \ is on your delegate, giving you the opportunity to take the selected row and\
    \ set it in your model or take some other action.\n\n# Summary\n\nBy looking at\
    \ these three different types of components that can be used in your iPhone application\
    \ interfaces, you've seen three different models of UI component design."
