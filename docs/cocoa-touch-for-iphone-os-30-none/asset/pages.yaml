    # Using Core Foundation Sockets


    If working with the higher-level network classes isn''t enough for you, iPhone
    provides a set of low-level network wrappers that act as a thin veneer over the
    lowest-level socket API, BSD sockets. Though I use the *thin veneer* here, don''t
    be confused into thinking that these wrappers are not powerful; they are quite
    powerful, and they provide functionality that makes writing networking code much
    easier. This API is called Core Foundation Network, or CFNetwork.


    BSD sockets are certainly ubiquitous in terms of their implementation platforms.
    However, they were developed 20 years ago and have not changed much in the intervening
    years. As a result, using them directly can be a bit of a chore. Typically, developers
    use BSD sockets and threads to do asynchronous networking, as many of the BSD
    calls block the CFNetwork API provides a mechanism for you to work with BSD sockets
    without having to resort to threads. The standard run loop mechanism provided
    by the runtime means that you don''t have to spawn a thread to see if data is
    waiting on your sockets or if it''s okay to send data on your sockets. You simply
    register a callback on the run loop for either of these events occurs, and then
    do whatever processing you need to do in those callback functions.


    CFNetwork is not only limited to low-level capabilities, however; it also provides
    wrappers for popular protocols including HTTP, FTP, and SSL. In fact, the higher-level
    Objective-C classes actually utilize the low-level CFNetwork API to implement
    their functionality.


    For the purposes of these examples, you are going to mainly focus on the low-level
    API encapsulated primarily in CFS and CFStream. This is because if you learn to
    use the lowerlevel API, using the higher-level API is relatively simple to pick
    up.'
