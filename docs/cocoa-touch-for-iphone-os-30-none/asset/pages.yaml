  md: '# Configuring a UITabBar through Interface Builder


    Like UINavigation, you would actually interact with the UITabBar primarily through
    a UITabBarController. To add a UITabBarController to your interface, Interface
    Builder, you can drag-and-drop a new UITabBarController (shown in Figure 12.4)
    into includes a view containing a UITabBar that you can use to add to your main
    view as a subview. UITabBarController is a subclass of UI, and alternatively,
    you can also instantiate a UITabBarController programmatically in the same way
    that you would a UIView.


    > NOTE

    UITabBarController is intended to be used as-is and not subclassed.


    # Configuring UITabBarItems to a UITabBar


    As UINavigationController does with its UINavigationItems, UITabBar Controllers
    have UITabBarItems that are added to the UITabBarController by adding new UIControllers
    via the UITabBarController''s viewControllers property. There is also a method
    available on the UITabBarController called setControllers:animated; which enables
    you to set the controllers property while passing a parameter to determine whether
    or not the addition of the new view controllers will be animated.


    > NOTE

    If you set more Controllers on your UITabBarController than can be displayed,
    the UITabBarController displays the standard "More" UITabBarItem, allowing the
    user to customize which UITabBarItems to display. This behavior can be customized
    using the customizableControllers properties on the UITabBarController.


    By default, the UITabBarController creates a UITabBarItem for each UIView Controller
    that is added to a title based the UITabBarController. This default UITabBar item
    doesn''t contain an image but shows the title property of the UIView being managed.


    In order to configure images for the UITabBarController, your ViewController should
    create a custom UITabBarItem with your desired image, and store it in its tabBar
    Item property.


    > NOTE

    The image displayed on a UITabBar should be approximately 30x30 pixels. The image
    is displayed without color, using the image''s alpha channel to create a silhouette
    effect on the UITabBar.'
