    tableView:moveRowAtIndexPath:toIndexPath is called with the index of the row originally
    and the index of where the user wants to put it as arguments. If you want to moving
    this row to the new location, the method tableView:targetIndexPathForMoveRowAtIndexPath:toProposedIndexPath
    is called as the user is moving the row up and down in the table, and you can
    choose to return NO from this method to prevent the user from dropping the rows
    in locations where you don''t want them. I''ll talk about this when I talk about
    editing your data.


