  md: '# Using the Maps API


    highly anticipated feature in iPhone OS 3 from a developer standpoint is the addition
    of the Map Kit API.

    The Map Kit API gives developers the ability to finally embed maps within their
    application. It comes with everything needed to display a map in your application,
    including maps from Google maps as well as the ability to annotate the maps with
    notes for points of interest. You can even reverse geocode map coordinates, which
    allows you to set a set of coordinates and acquire a street address from it. This
    is an incredibly powerful API and one that will surely be used extensively by
    applications for iPhone OS 3.


    # Showing an Embedded Map with MKMapView


    The core of the Map Kit API centers on the MKMap class, which encapsulates, in
    its entirety, a view that contains a map. The map itself is centered on a given
    coordinate, and is scaled by a region value. In addition to the ability to set
    these properties programmatically, the view also provides the capability for the
    user to position and zoom the map by using a combination of touch and pinch gestures.
    This capability can be enabled or disabled, depending on whether you want to give
    the user ability to do this.


    MKMapView can also be annotated to display notes about locations that are displayed
    on the map. The annotation itself is an instance of MKAnnotation, and the view
    associated with the annotation is an instance of MKannotation. Using these classes,
    you can gain quite a bit of customization when annotating your maps.


    # Creating an MKMapView


    To add an MKMapView to your project, you can simply open one of your view nibs
    in Interface Builder, and drag-and-drop map view object from the palette onto
    your view. This gives you an instance of MKMapView in your nib. You can then connect
    this up to IBlets, for configuration purposes. Figure 23.1 shows a nib containing
    a map.


    > In this Chapter

    Working with

    MKMapView to display a map in your applications

    Narrowing the map to particular regions

    Annotating maps

    Understanding

    performance with regard to map annotations

    Using reverse geocoding to convert coordinates into addresses'
