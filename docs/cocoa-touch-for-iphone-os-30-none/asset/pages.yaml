    # Working with Data


    # NOTE


    In this section, you are working with a Core Foundation API again, which means
    that it obeys the Core Foundation retain-and-release rules. To review them, see
    Chapter 10.


    The two most basic APIs that you will work with are the CFSocket and CFStream
    API. They provide the interface for creating sockets of all kinds, both TCP and
    UDP, and an API for treating these sockets as streams, so that you can simply
    write data into or read data from them. The third API that you will look at in
    this section is the CFHost API, which provides an API for doing DNS resolution.


    # NOTE


    Technically, CFStream is not strictly part of CFNetwork and can be used with any
    communications channel, not just sockets. For the purposes of this example, though,
    you use it for sockets.


    # Exploring CFSocket


    CFSocket API is the lowest-level API in CFNetwork, and it is the basis for the
    rest of the framework. It provides a mechanism to create a socket from scratch
    or by using an existing BSD socket, and for adding that socket to the application''s
    run loop.


    To create a CFSocket, you call one of the CFSocket create methods. The method
    CFSocket Create has a method signature of CFSocketRef CFSocketCreate(CFAllocator
    allocator, SInt32 protocolFamily, SInt32 sqlType, SInt32 protocol, CFOptionFlags
    callBackTypes, CFSocketCallback callback, const CFSocketContext *context). It
    takes several parameters, and looks imposing, but it''s really straightforward.
    The parameters to the method are shown in Table 19.4.


    | Table 19.4 Parameters to the CFSocketCreate Method |

    | Parameter | Purpose |

    |---|---|n| CFAllocator allocator | This parameter enables you to specify a custom
    memory allocator for allocating the memory for the socket object that will be
    returned. If you pass NULL, it uses the default allocator. |

    | SInt32 protocolFamily | This parameter specifies the protocol family of the
    socket. The default value, if you pass 0, is PF_INET. |

    | SInt32 sqlType | This parameter specifies the socket type to create. The default
    value, if protocolFamily is specified to be PF_INET, it is SOCK_STREAM. Possible
    other values might be SOCK_DGRAM for a UDP socket. |'
  merge: -1
  pgno: 267
- img_proc: true
  md: '# Chapter 19: Connecting to the World with Networking


    | Parameter | Purpose |

    | --- | --- |

    | SInt32 protocol | This parameter specifies the protocol for the socket. Possible
    values include IPPROTO_TCP or IPPROTO_UDP. If protocolFamily is PF_INET, and socketType
    is SOCK_STREAM, this defaults to IPPROTO_TCP, and if protocolFamily is PF_INET
    and socketType is SOCK_DGRAM, then this defaults to IPPROTO_UDP. |

    | CFOptionFlags callbackTypes | This parameter specifies a bitwise-OR of expected
    events that might trigger a callback to call. |

    | CFSSocketCallBack callout | This is a function to call when one of the expected
    events specified in callbackTypes occurs. |

    | const CFSocketContext *context | This is a user-contextual data object; it can
    be NULL. |


    Interestingly, most of these parameters allow you to simply accept null or zero
    to receive their default values. This means that you get a TCP stream socket,
    which is perhaps the most common-use case. You only need to specify the parameters
    differently from the defaults if you use a UDP socket or something a little more
    exotic, such as a UNIX domain socket.


    The callback types that you use are listed in Table 19.5.


    # Table 19.5 Possible Callback Types


    | Value | Description |

    | --- | --- |

    | kCFSocketNoCallBack | No callbacks are received for any events. |

    | kCFSocketReadCallBack | Receive a callback when data is available to be read
    or when a new connection is ready to accept. This is called when the data is ready
    to read but has not yet been read. Your code needs to read the data or accept
    the connection when this callback is called. |

    | kCFSocketAcceptCallBack | This is with listening sockets; receive this callback
    when a connection has been requested. The new connection is automatically accepted,
    the callback is called, and the data argument is a handle for the new child socket.
    |

    | kCFSocketDataCallBack | When data is received on the socket, it is automatically
    read in chunks in the background and your callback function is called. The data
    argument is a CFData object containing the data that was received. |

    | kCFSocketConnectCallBack | When attempting to connect to a port, this callback
    is called when the connection has completed either successfully or not. If the
    connection fails, the data pointer is an error code. If the connection succeeds,
    the data pointer is null. |

    | kCFSocketWriteCallBack | When writing large amounts of data to a socket, this
    callback is called when the socket is ready for more data. |'
