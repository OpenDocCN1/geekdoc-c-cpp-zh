    elements are displayed in the navigation bar, depending upon the UIViewController
    that is currently being displayed. The UINavigationController will interrogate
    the UINavigationItem to find out things like the title, navigation buttons, and
    prompt. If these properties have been set, they will override any settings on
    the UINavigationController. Table 8.1 shows the properties on the UINavigationItem
    used to configure these settings.


    | Property Name | Purpose |

    | --- | --- |

    | Title | Used to specify the title in the center of the UINavigationController
    navigation bar when this is displayed |

    | Prompt | Specifies a subtitle over the title in the UINavigationController navigation
    bar |

    | leftBarButtonItemItem | Specifies the UIBarButtonItem displayed on the left
    side of the UINavigation navigation bar |

    | rightBarButtonItemItem | Specifies the UIBarButtonItem displayed on the right
    side of the UINavigation navigation bar |


    The buttons displayed on the UINavigationBar are of type UIBarButtonItem and are
    created like normal buttons, with a target, an action, and so on. UINavigation
    Controller automatically provides the "back" button that displayed on the left
    side of the UINavigationBar when the stack of UIControllers that are being managed
    by this UINavigationController contains more than one ViewController. This enables
    the user to have a consistent user experience wherein they navigate a list of
    data, select an item from that list, view the detailed information for that, and
    then have a "back" button to take back to the list.


    Finally, you can also choose to show or hide the navigation bar, if you need to.


    # Pushing and Popping UIControllers


    Now that you have configured the UINavigationController, come to its raison d''être,
    which is managing UIControllers.


    To cause a UINavigationController to display a UIViewController, you use the method
    pushViewController:animated: passing your UIViewController as the first argument.
    This causes the UINavigationController to slide the current view controller off
    to the left and bring in the new view controller from the right to display it
    as the primary'
