  md: '# NOTE


    The ability to choose different styles of UITableViewCellCell is new in iPhone
    OS 3. Prior to this release, only the default cell style was supported.


    Each of the subviews shown in the cells in Table 7.1 can be fully customized to
    change various parameters, including their background color, their text color,
    and their font. This provides you with a fair amount of configurability without
    doing any inheritance whatsoever.


    In addition to simply changing the properties of the existing views that are already
    part of the UITableViewCellCell, you can add your own custom subviews directly
    to the content view. This is handy for when you want to do things such as a progress
    bar to a UITableViewCellCell. To do this, you simply create your additional custom
    view and add it as a subview to the content view.


    # CAUTION


    When adding custom subviews, be very careful where you construct your subviews.
    You don''t want to be re-creating the subview for every cell. Try to reuse your
    subviews as much as possible. Object creation can be surprisingly hard on performance
    on the iPhone.


    As you may have noticed in Table 7.1, in a default UITableViewCellCell there is
    an optional UIImageView. This is enabled by setting the image property on the
    UITableViewCellCell. In the next section, you will use this UIImageView to set
    a star next to cities that are your favorite cities.


    # Adding Images to a UITableViewCellCell


    Up to now, in your cities application, to indicate a favorite city you''ve added
    the word favorite next to the city in your name. It wouldn''t be great if instead,
    you could just add a graphical element to each row that displayed a star. When
    you''ve marked a favorite city, perhaps the star is filled with color. When a
    city is not a favorite, the star can be an outline. Let''s take a look at how
    you would implement this behavior.


    # CROSS-REF


    The images you will be using in this example can be found on the book''s Web site
    in the code for this chapter. In order to use these images in your project, be
    sure to add them to your Xcode project. A good place for them is under the Resources
    group.


    In the previous section, when you looked at the default style of UITableViewCell,
    there was an optional UIImageView, which displays on the left side of the cell
    if the image property has been set. This is what you will use to display your
    star. Listing 7.1 shows your previous implementation of the method tableView:cellForRowAtIndexPath,
    which simply returns each row with a text value listing the city name and whether
    or not it''s a favorite.'
