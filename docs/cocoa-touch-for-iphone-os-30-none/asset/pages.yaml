  md: '# Chapter 20. Using the Push Notification Service


    | Value | Description |

    | --- | --- |

    | UIRemoteNotificationTypeNone | The application ignores all notifications. |

    | UIRemoteNotificationTypeBadge | The application receives notifications that
    badge the application icon. |

    | UIRemoteNotificationTypeSound | The application receives notifications that
    play a sound. |

    | UIRemoteNotificationTypeAlert | The application receives notifications that
    display an alert message. |


    These different notification types can be combined so that you can indicate that
    you receive any combination of notification, including all of them.


    Once the application has registered to receive notifications, its application
    delegate receives the message registerForRemoteNotificationsWithDeviceToken:.
    This method takes as a parameter an NSData object containing the device token
    for this. This token must be sent to the developer''s application server, which
    then uses it to communicate with the APNS server when it needs to send the notification
    to that particular device.


    The device token received here is unique to that particular device and what enables
    the developer''s application server to send the notification through the push
    notification service to that device. Applications are expected to register and
    send their device token to the developer''s application server every time the
    application is launched.


    # Examining the push notification message formats


    A push notification consists of a JSON dictionary object with another dictionary
    contained within it associated with the dictionary key "aps". This internal dictionary
    contains a set of properties that specify the components of the notification itself.
    This JSON object is encoded as a string, and put into a binary message, which
    is then sent to the APNS servers.


    > CAUTION

    The maximum allowed size on a payload is 256 bytes.


    The JSON dictionary components consist of an alert message, a number for displaying
    the badge on the application icon, and a sound to play.


    > NOTE

    The sound included in notifications must be contained within the application bundle
    of the application that handles the notification.'
  merge: -1
