  md: '# Getting to Know Your Tools


    They say that when a craftsman finds a tool that he loves, over time it becomes
    an extension of him. He learns its idiosyncrasies inside and out, backwards and
    forwards, and this leads to a relationship that transcends simple use of the tool
    and instead becomes more involved. The tool becomes an extension of his hand,
    an extension that he can guide with an almost extrasensory vision.


    You are fortunate that, Apple provides you with an excellent set of free tools
    for developing software for the iPhone. They are tools that have evolved over
    the last 15 years of Objective-C development, first on NeXT computers, then on
    Mac X, and now for iPhone.


    In this chapter, you will take a look at these tools and where you can find more
    information about them. They are incredibly powerful tools that seem to be unique
    in software development, both for their ability to provide enough power to enable
    incredibly complex software systems to be developed, and also because they seem
    to know when to stay out of your way and simply provide a great-editing environment
    for you to write code.


    Unfortunately, a comprehensive description of every last feature of these applications
    is beyond the scope of this book, and I won''t be delving into them in great detail.
    My main goal here is simply to introduce you to the tools so that you''re familiar
    with them.


    # In This Chapter


    Becoming familiar with Xcode and Interface Builder


    # Introducing Xcode


    The cornerstone of iPhone software development is the Xcode integrated development
    environment, or IDE. Xcode originated on NeXT steps as Project Builder. Over the
    years, it has gone through many revisions to finally arrive at the version that
    is available to you today. It uses GCC as its underlying technology and provides
    many sophisticated features found in modern IDEs today, such as code completion,
    re-factoring, and sophisticated code navigation. Interestingly, it also has one
    of the best cross-platform compiling capabilities of any modern IDE. With it,
    you can compile for Intel, PowerPC, iPhone OS, or even (with thirdparty tools)
    Microsoft Windows. You can do all of this simply by configuring targets in the
    IDE.'
  merge: -1
  pgno: 26
