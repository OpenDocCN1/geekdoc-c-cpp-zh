    method, which allows you to update the model as well as update the UITableView
    using the methods insertRowsAtPaths:withAnimation: deleteRowsAtPaths:withRowAnimation:
    as.


    # NOTE


    By default, all table views implement the "Swipe to delete" feature unless you
    explicitly disable editing of rows by returning NO from tableView:canEditRowAtIndexPath.


