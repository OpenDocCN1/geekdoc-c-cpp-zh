  md: '# Understanding the Basics of an iPhone User Interface


    The iPhone is known for its beautiful user interface and ease of use. Studies
    have shown that while the users of other smart phones perhaps one or two features
    of their daily basis, iPhone users use over ten. Making your application be one
    of those features requires a great user interface that delights and inspires the
    user.


    As a mobile device developer, you also have to assume that for the majority of
    cases, when a user wants to work with your application, the window of interaction
    is usually no more than about 45 seconds. That is to say, the user wants to pull
    out the iPhone, open your application, navigate to the information that they want,
    get the information or perform some action, and then exit the application and
    put the iPhone back to sleep — all of this in about 45 seconds or less. This making
    a good user interface a tremendous challenge.


    You''ll begin your exploration of building iPhone UIs by looking at the UIs of
    the applications that ship with the iPhone. Apple has some of the best user interface
    designers in the world, and I think there is a great deal to be learned by studying
    what they have done in their applications and applying the same concepts to yours.
    Additionally, it is as important as an iPhone developer to be sure that you are
    adhering to the Apple iPhone human interface design guidelines, as Apple has been
    known to reject applications that ignore these guidelines.


    Obviously, if you''re designing an application like a game that lies on a unique
    cinematic UI in order to better immerse the user in the game experience, then
    you are probably justified in deviating from these standards. However, most basic
    applications follow these standards, and it is useful to know them well.


    First, I''ll discuss the iPhone home screen.


    # In This Chapter


    +   - Exploring the UIs of various built-in applications

    - Understanding the basic components that make up an iPhone UI

    - Knowing the standards required for building an app that fits into the iPhone
    model'
  merge: -1
  pgno: 54
- img_proc: true
  md: '# Looking at the iPhone Screen


    Figure 4.1


    The main iPhone screen


    ![](img/0ccd1d097de6918b1df92faf66d987b6_55_0.png)


    Status bar


    Main content


    Dock/Tab bar


    The iPhone home screen; here you begin your exploration of how iPhone user interaction
    works.


    The first thing that you should recognize when looking at the iPhone screen is
    that, generally speaking, it is divided into three, or sometimes four, sections.
    Starting from the top, the first section is the status bar. This provides information
    about the iPhone, including the wireless carrier, the clock, the Wi-Fi indicator,
    whether or not the iPod is playing, and so forth.


    > NOTE

    The status bar can be hidden in your application by setting the StatusBarHidden
    property in your application''s Info.plist file.'
  merge: -1
  pgno: 55
- img_proc: true
  md: '# Chapter 4: Understanding the Basics of an iPhone User Interface


    Between the status bar and the bottom "favorite applications" dock is the main
    interaction area of the iPhone. This is where the majority of the application
    interaction occurs, and is also where the majority of information is displayed.
    On the home screen, this is where the application icons are located.


    Some applications, including some of the ones that you will work with this book,
    also display a navigation controller at the top of this application interaction
    area.


    # CROSS-REF


    I will talk about the navigation controller a lot more in Chapter 8, because this
    is one of the fundamental iPhone interface metaphors that you absolutely have
    to master in order to develop a good iPhone application.


    Finally, at the bottom of the screen is the "favorite applications" dock. On the
    iPhone screen, this is where you can put your most-used applications. They are
    available whenever you''re on the home screen, even if you swipe to another set
    of applications. This is an important dialog that I will revisit shortly when
    you are looking at an actual application, because this interaction is used again
    in the form of the Tab Control.


    # Creating a Cinematic User Experience


    One of the concepts that Apple engineers like to talk about when they''re talking
    about beautiful user interfaces is the concept "cinematic user experience." A
    cinematic user experience is essentially a user interface that looks like something
    from a Hollywood movie. It looks futuristic and smooth, and it uses animation
    to enhance the feeling of working with physical objects.


    Apple user interface designers have specifically given you a set of tools to build
    these types of cinematic user interfaces. Tools like Core Animation give you the
    power to build interfaces that utilize elements that slide in from off-screen
    rather than just appearing, and elements that scroll with an almost physical weight
    to them.


    Most of these capabilities are simply built into the UI components that you use
    in designing your interfaces. However, in cases you might be designing a UI yourself
    (for a game, for example), you should strive to maintain this cinematic quality.


    This means that you should use smooth transitions from one view to next, rather
    than jarring, sudden ones. You should use only high-quality graphics for your
    buttons and backgrounds, and when possible, leverage the unique capabilities of
    the iPhone hardware such as multi-touch, the accelerometer, and Core Location.
    By doing this, you will build an application that not only fits well within the
    iPhone UI framework but also makes the user excited to use your application.'
  merge: -1
