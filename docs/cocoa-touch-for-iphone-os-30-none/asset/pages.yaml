  md: '# # Interacting with UIPasteboard


    Once you have the pasteboard, you can put any kind of data that you want on it.
    To place data on the pasteboard, you call the method `setData:forPasteboardType:`
    or `setValue:forPasteboardType:`. This enables you to place raw data onto the
    pasteboard in the case of `setData:forPasteboardType:`; in the case of the method
    `setValue:forPasteboardType:`, you''re placing data that can be serialized into
    a pasteboard list.


    Examples of data like this are `NSString`, `NSArray`, `NSDate`, and `NSNumber`.
    For both of these methods, the pasteboard type parameter should specify a UTI
    value for the type of data that is being placed on the pasteboard. In this way,
    the pasteboard acts like a dictionary, allowing you to associate different data
    representations with different types that can subsequently be accessed by other
    applications according to the pasteboard type. An application can, for example,
    first ask for a rich text representation, and then, if that''s not available,
    ask for a plain text version. In this way, you can provide your data in different
    formats to increase your interoperability opportunities with other applications.


    The `UIPasteboard` class also provides a set of specific properties for adding
    particular kinds of data to the pasteboard or getting particular kinds of data
    from the pasteboard. These properties are shown in Table 22.1.


    | Table 22.1 Properties for Setting and Getting Data of Standard Types from the
    UIPasteboard |

    | Property Name | Purpose |

    | --- | --- |

    | string | Accesses the first pasteboard item as a string |

    | strings | Accesses all pasteboard items as an array of strings |

    | image | Accesses the first pasteboard item as a UIImage |

    | images | Accesses all pasteboard items as an array of UIImages |

    | URL | Accesses the first pasteboard item as an NSURL |

    | URLs | Accesses all pasteboard items as an array of NSURs |

    | color | Accesses the first pasteboard item as a UIColor |

    | colors | Accesses all pasteboard items as an array of UIColors |


    > > CAUTION

    > When accessing the standard type properties, if the type requested is not available
    on the pasteboard, the property returns nil.'
