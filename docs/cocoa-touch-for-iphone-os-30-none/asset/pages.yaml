    # Understanding the core frameworks memory management model


    Because Core Graphics is a core framework, it utilizes the Core Foundation memory
    management system. The Core Foundation memory management system consists of a
    combination of reference counting, method naming conventions, and specialized
    allocator functions. For the purposes of this Core Graphics discussion, you only
    need to be concerned with the reference counting and naming conventions. You will
    not look at allocator functions, as they are not needed for anything you will
    be working.


    It should be noted that although the Core Foundation memory management system
    may seem similar to the Cocoa memory management system (Cocoa also utilizes reference
    counting for its memory management), they are not compatible and cannot be used
    interchangeably. Whenever you work with Core Foundation objects, you must always
    use the Core Foundation system, and when using Cocoa Touch objects, you must always
    use the Cocoa system.


    Like Cocoa, Core Foundation utilizes reference counting for its primary memory
    management architecture. Because it''s a C-based API, however, it would have been
    onerous to force developers to use additional calls on every object created to
    increment the reference count. Instead, Core Foundation utilizes a naming convention
    and a set of rules to govern the ownership of memory allocated.


    There are three rules governing the ownership of memory allocated. The first rule
    is that if you create an object (from a Create or Copy function), you own it.


    The second rule is that if you get an object (from a Get function), you do not
    own the memory, and if you want to keep it around, you must retain it using a
    call to CFRetain. You own memory that you have called CFRetain on.


    The third and final rule is that you own the memory, either through creation or
    CFRetain, when you finish using it you release it using CFRelease.


    Core Foundation and Core Graphics contain several basic types that are defined
    as C structures. These types, such as CGRect and CGPoint, which you have already
    seen, do not need to be retained or released. As a naming convention, objects
    that need to be retained or released are named with a type containing the word
    *Ref*, for example, CGImageRef. The only types of this nature that you will work
    with in this chapter are CGImageRef for images and CGPathRef for paths.


    # Using CFRetain and CFRelease


    The functions used to increment and decrement the retain count on blocks of memory
    are CFRetain and CFRelease. CFRetain increments the retain count, and CFRelease'
