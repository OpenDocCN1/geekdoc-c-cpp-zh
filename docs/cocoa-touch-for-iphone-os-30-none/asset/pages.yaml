  md: '# Connecting to the World with Networking


    One of the incredible things about the iPhone is that underneath it all, it is
    really running Mac OS X. This means that down deep, underneath everything else,
    it lies the heart of UNIX. It''s true. If you dig deep enough into the iPhone
    OS, you eventually find there is a full UNIX file system and many of the libraries
    and capabilities you''ve come to expect from a UNIX computer.


    Normally, even as a developer, you are sufficiently isolated from UNIX that it
    doesn''t matter to you that UNIX is underneath the covers. But there''s one area
    where UNIX available to you becomes a definite asset. That area is in the realm
    of networking.


    UNIX was built with networking from the ground up, and so it''s no surprise that
    its networking stack is one of the best available. As a result, the iPhone, because
    of its heritage, shares this excellent working capability. The iPhone not only
    has built-in BSD sockets, but also has an excellent set of Cocoa Touch classes
    that enable you to work with sockets with little effort. The beauty of this design
    is that when you need to simple things, you have the higher-level abstractions
    available to you. Things such as accessing Web pages, sending e-mail, and so forth
    are trivial on iPhone OS. In addition to this, when you need to go lower, when
    you need to do things that are different or more difficult, these are also possible
    through the use of Core Foundation sockets and BSD sockets.


    In this chapter, you are going to see how to use some of the high-level classes
    for basic networking. You are going to take a look at using Bonjour to discover
    services on the local network. You''re going to take a look at how to send e-mail
    using the new messaging API. Finally, you''re going to take a brief look at core
    foundation sockets to introduce them to. By the time you''re finished, you should
    be able to connect just any networking task on the iPhone.


    # In this Chapter


    +   - Learning to use the Objective-C classes

    NSURLRequest and NSConnection

    Sending e-mail from within your app using the MessageUI framework

    Using Core Foundation networking to do low-level networking tasks

    Using Bonjour to discover services on the local network'
