    \ user to be able to control the playback of the movie. To hide the movie controls\
    \ so that the user is unable to change the playback, you use the property movieControlMode.Setting\
    \ this to MPMovieControlModeHidden causes the movie controls to be hidden. Other\
    \ possible values for this property are MPMovieControlModeDefault, and MPMovieControlModeVolumeOnly,\
    \ which displays only the volume control. Figure 28.1 shows the playback controls\
    \ if you use the default setting.\n\nThere are several other properties like this\
    \ that allow you to control the overall experience of the movie is playing. In\
    \ particular interest the backgroundColor property, which allows you to change\
    \ the background color of the player, and the scalingMode, which allows you to\
    \ specify whether the movie should be scaled to fit within the aspect ratio of\
    \ the iPhone screen.\n\nIt may take while to load the movie and start playing.\
    \ As a result, the movie player begins loading when the initializer is called.\
    \ When it finishes loading, it sends the MPMoviePlayerContentPreloadDidFinishNotification\
    \ using the NSNotificationCenter. If you need to receive this notification in\
    \ your application. Once you call the play method, your user interface fades to\
    \ the background color of the movie player and the movie playback begins. If the\
    \ video has not completed loading, the background color of the video player is\
    \ shown. It may also display a progress indicator. When playback has completed,\
    \ your user interface is brought back."
