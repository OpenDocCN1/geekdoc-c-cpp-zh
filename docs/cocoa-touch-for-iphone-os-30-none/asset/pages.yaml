- img_proc: true
  md: '# Chapter 26. Accessing the iPod Library


    # 325


    # Listing 26.3


    # Searching for All Songs by Daft Punk That Are Not Part of a Compilation


    ```

    - (NSArray *)browseForDaftPunk;

    {

    MPediaPropertyPredicate *artist =

    [MPediaPropertyPredicate predicateWithValue:@@"Daft Punk"

    forProperty:MPMediaItemProperty];

    MPediaPropertyPredicate *notComplication =

    [MPediaPropertyPredicate predicateWithValue:[NSNumber numberWithBool:NO]

    forProperty:MPMediaItemPropertyIsComplication];

    NSSet *predicates = [NSSet setWithObjects:artist, notComplication, nil];

    MPMediaQuery *query =

    [MPMediaQuery alloc] initWithFilterPredicates:predicates];

    [query groupingType:MPMediaGroupingAlbum];

    return [query items];

    }

    ```


    So this code, you are creating two predicates: one for the artist name and one
    for whether or not it''s in a compilation. You combine those two predicates into
    a set. I will talk more about the MPMediaQuery shortly, but here you use the MPMediaQuery
    to create a query using the set of predicates. The items property contains the
    individual items from the iPod library that matched the predicates. The types
    of objects in this array are MPMItem objects. You can use them to access metadata
    about the item, such as the song, artist, and artwork, you can use them to play
    the item.


    If you want the list of items to be grouped, for example, by album name, you can
    use the property grouping to set the grouping type. Subsequently, the collections
    contains the items as a list of collections, by your selected group type. The
    types of objects returned from this property are MPMItemCollection objects. This
    class is actually a collection of MPMediaItems, but it has the useful property
    of being able to find a representative item for the collection, which contains
    data that is shared among the items. This is more efficient than iterating over
    the collection yourself and building such a representative item.'
