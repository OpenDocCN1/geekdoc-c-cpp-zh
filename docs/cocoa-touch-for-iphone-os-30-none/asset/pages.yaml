- img_proc: true
  md: 'The Minimum and Maximum values indicate the minimum and maximum values that
    the slider can represent. The Initial value property in Interface Builder maps
    to the value property on the class and represents the initial value that the slider
    is set to. To set this programmatically, you would simply use the value property.


    When customizing the appearance of UISlider, there are several properties that
    you can use to alter its appearance. Perhaps the most commonly used are the minimum
    and maximum value images. These images are placed underneath the slider at the
    minimum and maximum locations of the slider and can be used to display icons representing
    the values at either of those locations. For example, if it''s a volume slider,
    you might have a smaller speaker at one end and a larger speaker at the other.
    You can also customize the appearance of the knob that''s used to actually adjust
    the value. This knob is called the thumb, and it can be customized using the thumbImageForState
    property.


    > NOTE

    nYou can set the thumb and track images for various states on the control. These
    states represent things such as selected state, highlighted state, and normal
    state.


    Finally, you can also customize the appearance of the track itself by setting
    the property trackImageState. When customizing the track image, you can customize
    either the track image or the maximum track image, which correspond to the portion
    of track on the lower value side of the thumb versus the higher value side of
    the thumb. Remember that the track image must be able to stretch to fill the region
    between the endpoints of the track and the current location of the thumb, so be
    sure your image will stretch appropriately.


    # Updating the status of your UISlider


    When the user adjusts the UISlider it sends a message to an IBAction that you
    define. It sends these messages constantly when the user is sliding the control
    if you have selected continuous updates, or when the user is finished updating
    the control and lifts his finger in the case of noncontinuous updates. You can
    use this IBAction to read the value of the slider and set whatever property you
    have assigned that.


    # Using UITabBar


    The UITabBar component is interesting to look at because it is similar in functionality
    to the UINavigationBar. That is to say, it is more than just a graphical component
    that you put out on your UI. It also manages a navigation metaphor for you by
    abstracting a navigational UI for your view controllers, which are subsequently
    controlling views that the UITabBar displays. Figure 12.3 shows a typical UITabBar
    in a UI.'
