  md: '# CAUTION


    If you query''t find anything matching your predicate, it times out and logs an
    error message to the console. This can be confusing, but don''t read too much
    into it. The point is that you got nothing back, and so therefore you have a null
    result instead of an array.


    As you can see, you can build reasonably complex queries by combining different
    predicates that search for different properties and different values.


    Now let''s take a closer look at the MPMediaQuery class, which is the class that
    actually does the querying.


    # Building queries


    Now you''ve seen how to use the MPMediaPropertyPredicate class to build predicates
    that you can then use with the MPMediaQuery class to query items from the iPod
    library. I also briefly discussed how the items property contains the MPMediaItems
    that matched that query, and how the collections property collections of MPMediaItems
    are grouped according to a grouping type if you specify one.


    The MPMediaQuery class also contains a collection of factory methods that have
    canned queries already available. Using them, you can quickly and easily define
    queries that group by artist, playlist, or genre.


    Table 26.3 shows the MPMediaQuery factory methods that are available.


    | Method | Purpose |

    | --- | --- |

    | albumsQuery | Returns items from the iPod library grouped by album name |

    | artistsQuery | Returns items from the iPod library grouped by artist name |

    | songsQuery | Returns items from the iPod library grouped by song name |

    | playlistsQuery | Returns items from the iPod library grouped by playlist name
    |

    | podcastsQuery | Returns items from the iPod library grouped by podcast name
    |

    | audiobooksQuery | Returns items from the iPod library grouped by book name |

    | compilationsQuery | Returns items from the iPod library grouped by compilation
    name |

    | composersQuery | Returns items from the iPod library grouped by composer |

    | genresQuery | Returns items from the iPod library grouped by genre |


    Each of these methods returns an MPMediaQuery object that groups its results accordingly.
    If you want to add additional filtering to one of these objects, you can simply
    use the instance method addFilterPredicate: to the returned object. Then, when
    you call the associated items or collections methods, you get the items, filtered
    as you have requested, in the selected collections.'
