  md: '# # Take the Book with You,

    Everywhere


    Want tips for developing and working on Apple platforms on your iPhone? Wiley''s
    Developer Reference puts you in touch with the new Wiley Developer Reference series.
    Through the app you can purchase any title in the series and then read, highlight,
    search, and bookmark the text and code you need. To get started, Wiley''s Developer
    Reference app includes Chapter 21 from Cocoa Touch for iPhone OS 3, which offers
    fantastic tips for developing for the iPhone and iPod touch. If you buy a Wiley
    Developer Reference book through the app, you''ll get all the text of that book
    including a searchable index and live table of contents linked to each chapter
    and section of the book.


    ![](img/0ccd1d097de6918b1df92faf66d987b6_449_0.png)


    # ## Here''s what you can do


    +   - Jump to the section or chapter you need by tapping a link in the Table of
    Contents

    - Click on a keyword in the Index to go directly to a particular section in the
    book

    - Highlight text as you read that you can mark what''s most important to you

    - Copy and paste, or email code samples, out of the book you can use them here
    and when needed

    - Keep track of additional ideas or results by selecting passages of text and
    then creating notes and annotations for them

    - Save your place effortlessly with automatic bookmarking, which holds your place
    if you exit or receive a phone call

    - Zoom into paragraphs with a "pinch" gesture


    # ## How to purchase


    Go to www.wileydevreference.com and follow the link to purchase the app in iTunes.


    Wiley''s Developer Reference app is just $99 and includes Chapter 21,"Using the
    Game Kit API" from Cocoa Touch for iPhone OS 3. When you''re ready for a full
    Developer Reference book, you can purchase any title from the series directly
    in the app for $19.99.


    ![](img/0ccd1d097de6918b1df92faf66d987b6_449_1.png)'
