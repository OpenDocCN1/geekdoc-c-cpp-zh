- img_proc: true
  md: '# 318 Working with Media


    Also like OpenGL, a truly comprehensive coverage of this API is beyond the scope
    of this book. If you really want to fully understand OpenAL, the OpenAL site,
    located at www.openal.org, provides you with more than enough information. That
    said, however, I will give you a brief overview.


    Essentially, to work with OpenGL, you have to go through several steps. First,
    you have to open the system''s default output. To do this, you call the method
    `alOpenDevice` passing a parameter of NULL. Next, you have to create an OpenAL
    context: to do this, you call the method `alCreateContext`, passing as parameters
    the device that you get back from the prior call and zero. Whenever you work with
    OpenGL you need to have a context, and that context needs to be set as the default
    for your particular source. To set the current context, you use the function `alMakeCurrentContext`.
    Finally, you create your sources, and configure your listener''s location. To
    create an audio source, you use the function `alGenSources`, which configures
    the location of the listener using an array of floats. To configure a listener
    location, you use the function `alListenerfv`, which configures the location of
    your source, you similarly use the function `alSourcefv`.


    Once your environment, source, and listener are all configured, you can trigger
    individual sources to begin playing by using the `alSourcePlay` function. Similarly,
    to stop the source, you use the `alSourceStop` function.


    # Summary


    In this chapter, you''ve seen how to play basic audio in your applications, and
    you''ve seen the AV Foundation Framework, the new API that iPhone OS 3 gives you
    for playing audio. Additionally, you''ve seen the basics of how you use OpenAL
    to play audio, and where you''d use OpenAL instead of the AV Foundation Framework.'
  merge: -1
