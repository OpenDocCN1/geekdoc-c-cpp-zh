  md: "# 96 Building UIKit\n\ndraw the cell significantly faster. If you can imagine\
    \ a complex cell with a lot of subviews, being drawn with a lot of transparency,\
    \ the cost of drawing those cells can become very high. You can set your custom\
    \ views to opaque using the opaque property.\n\n# Reusing UITableViewCellCells\n\
    \nOne of the important concepts that I touched on in the previous chapter but\
    \ I didn't really go into a lot of detail was the concept of UITableViewCell reuse.\n\
    \nI'll say it here and I'll say it again later: allocation on the iPhone is expensive.\
    \ Particularly, object allocation in tight loops, when scrolling a table view.\
    \ Additionally, when you have a table view with a lot of elements in it, if you\
    \ allocate a cell for every one of elements in the entire data set, your memory\
    \ use will balloon significantly and quickly. This is why Apple introduced the\
    \ idea of cell reuse.\n\nThe idea behind cell reuse is relatively simple. Essentially,\
    \ when a cell is in the UITableViewCell scrolls off of the screen, it's placed\
    \ in a queue. When you need another cell to display on the screen, you can ask\
    \ the queue for a cell. If one is available, that same cell was placed in the\
    \ queue when it scrolled off the screen. This means that you only need to allocate\
    \ enough cells to actually display the current content on the screen. You don't\
    \ need to have additional cells that aren't being displayed taking up memory for\
    \ all of the elements in your data set.\n\nThis is a powerful concept, and best\
    \ of all, it is incredibly easy to use in your applications. In fact, all of the\
    \ examples that I've shown you so far already utilize this capability. You can\
    \ see it in Listing 7.8 where you first attempt to dequeue a cell from the queue.\
    \ If you don't get one, then you allocate one, but if you do, you simply reuse\
    \ the one that you got.\n\n+   Listing 7.8\nCell Reuse\n\n```\n(UITableView *)tableView:\
