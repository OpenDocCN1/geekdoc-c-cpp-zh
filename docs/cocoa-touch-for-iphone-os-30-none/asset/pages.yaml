    # Thinking about Performance

    Custom Cells


    The last thing I want to talk about with regards to customizing UITableViewCellCells
    is performance. The default UITableViewCell implementation is highly optimized
    for performance in scrolling of UITableView. It’s very important, when making
    custom UITableViewCellCells, that you take similar precautions to make sure that
    your cells can be drawn quickly. If you don’t, the scrolling performance of your
    UITableView can be drastically impacted. There’s nothing that kills a great user
    interface more than having a table view, when you flick it, stutters and staggers
    and doesn’t feel smooth in its scrolling.


    When talking about performance of UITableViewCellCells, there are really three
    concepts that need to keep in mind: reuse, efficiency, and opacity.


    The first concept, reuse, means that object allocation can be very expensive on
    the iPhone, particularly when done repeatedly in a tight loop, such as scrolling
    a UITableView. This means that the first rule that you need to keep in mind when
    customizing your UITableViewCellCells is to utilize the queuing mechanism and
    reuse your cells whenever possible. This also spills over into how you handle
    updating those reused cells. Specifically, you should not remove and add new subviews
    to your cells whenever you update one of the properties of that. For example if
    you have a custom cell with an image, don’t remove the image and add it back in
    reusing that cell. Instead, simply reset the value of that property. Listing 7.7
    shows the proper way to handle this.


    Listing 7.7


    # Proper Handling of a Custom Cell


    ```

    - (UITableViewCell *)tableView:(UITableView*)tableView

    cellForRowAtIndexPath:(NSIndexPath *)indexPath


    ```'
