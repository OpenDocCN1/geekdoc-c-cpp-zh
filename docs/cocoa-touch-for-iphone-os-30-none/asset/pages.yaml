  md: '# Discovering Information about the Device


    Cocoa Touch provides a rich API for working with the iPhone hardware. The most
    basic capabilities of that API are around the UIDevice class.


    UIDevice is a singleton that allows basic interaction with some of the core elements
    of the iPhone hardware. It enables you to find out information about the device
    orientation, the battery level, and the proximity sensor. It can also tell you
    things such as what type of device it is, as well as the unique identifier of
    the device. It''s an incredibly powerful little gem in Cocoa Touch, one that can
    be exploited easily in your applications.


    # Accessing the Battery State


    The first item that I am going to discuss with regard to device hardware knowledge
    is information about the battery level. Using the UIDevice singleton, you can
    monitor both the battery level and the current battery state. For example, you
    can find out whether or not the battery is currently being charged from a power
    adapter.


    To utilize this capability, you simply instantiate the UI device singleton, enable
    battery monitoring, and retrieve the battery level using the batteryLevel property.
    The return value from this property ranges from 0.0, indicating a fully charged
    battery. Additionally, the State property can tell you information about whether
    the battery is charging, full, unplugged, and so on. The possible states for the
    batteryState property are shown in Table 29.1.


    There are applications that might behave differently, depending on whether or
    not the device is plugged into a power adapter. For example, when not plugged
    into a power adapter, your application may want to reduce its power consumption
    by turning off certain features, such as GPS.


    > In This Chapter


    +   How to tell if the device is connected to a power adapter


    +   Working with the proximity sensor


    +   Getting basic information and metadata about the device'
  merge: -1
  pgno: 368
- img_proc: true
  md: '# Table 29.1 Battery State Values


    | State | Meaning |

    | --- | --- |

    | UIDeviceBatteryStateUnknown | The battery state is unable to be determined.
    |

    | UIDeviceBatteryStateUnplugged | The device is not plugged in, and the battery
    is currently discharging. |

    | UIDeviceBatteryStateCharging | The device is plugged into a power adapter, and
    the battery is currently charging. |

    | UIDeviceBatteryStateFull | The device is plugged into a power adapter, and the
    battery is currently fully charged.


    # # Accessing the Proximity Sensor


    The next hardware element that I''m going to describe is the use of the proximity
    sensor. This was newly added in iPhone OS 3. The proximity sensor tells the iPhone
    when you bring the phone close to your face - for example, when you are listening
    to the headset or speaking into the microphone. The Google application uses this
    capability cleverly. It records audio when the device is held up to your face.
    Thus, it reduces the amount of background noise that might confuse your speech
    recognition system.


    Like the battery level information, accessing the proximity sensor is as simple
    as retrieving the `UIDevice` singleton, then enabling proximity sensor monitoring
    using the `proximityMonitoringEnabled` property. Once you have enabled proximity
    monitoring, you can access the current proximity state utilizing the `proximityState`
    property. The `proximityState` property is a Boolean value that indicates whether
    or not the device is held close to the user''s face.


    You should only enable proximity monitoring if your application actually needs
    it. Keeping it disabled when you don''t need it helps to conserve battery life.


    # # Working with Device Metadata


    The next set of UIDevice methods are assigned to retrieving information about
    the operating system, the model, and the device. This is more or less metadata
    about the device, as opposed to hardware information.


    As you know, every iPhone has a unique identifier assigned to it. Accessing the
    unique identifier is as easy as calling the UI instance method `uniqueIdentifier`.
    This identifier can be used in cases where you want to uniquely identify a device
    or, for example, storing data on a server. If you give the user access to that
    data on your server, displaying their unique identifier can be confusing, and
    so you may want to use the name property as well.'
  merge: -1
  pgno: 369
- img_proc: true
  md: 'property UIDevice gives you the user-assigned name of the device. This is the
    user assigned to the device when they initially set it up and activated it.


    Table 29.2 shows the "informational" properties on UIDevice.


    | Method | Purpose |

    |---|--|

    | uniqueIdentifier | The device''s unique identifier |

    | name | The user-defined name of the device |

    | systemName | The name of the operating system on the device |

    | systemVersion | The version number of the operating system on the device |

    | model | The model name of the device |

    | localizedModel | The model name of the device as a localized device |


    > NOTE

    If want to use the model to detect certain hardware requirements in your app,
    you should use the non-localized model name.


    Properties like model and localizedModel, you can even determine what type of
    device it is, whether it''s an iPhone or iPod touch. You can use this information
    to display dialogs that are tailored specifically for that user and that device.
    This helps to make your application "feel" more tailor-made to the user''s actual
    environment.


    # Summary


    In this chapter, you''ve had an introduction to working with the iPhone hardware.
    The UIDevice API provides a simple interface for accessing some of the information
    about the device that you''re running. By using it, you can build applications
    that know more about their environment than they would without it. In example,
    you can know whether or not the user has connected the device to their device
    up to their power adapter. Additionally, you can find out what the user has named
    their device so that you can customize your display specifically to that user.


    Its details like these that make the difference between a good application and
    a great application. Use them when possible to enhance your applications.


    This has just been a taste of what''s to come. In the following chapters, you''ll
    take a closer look at some of the other hardware features, and how to interface
    with them effectively.'
  merge: -1
