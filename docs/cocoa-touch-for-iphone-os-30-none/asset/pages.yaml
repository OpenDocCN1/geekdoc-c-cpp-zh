  md: '# Understanding performance differences


    I have mentioned it before, but an important concept to understand when interacting
    with the simulator is that the simulator is actually running on the processor
    and hardware of your computer, and it does not emulate the slower processor and
    graphics capabilities of the actual iPhone hardware. The end result is that it
    has very different performance capabilities in comparison to actual hardware.
    What this means is that you can''t trust running in the simulator as a valid gauge
    of how your app will perform when running on an actual device.


    While Apple has been rather tight-lipped about its hardware specifications, there
    are certain things you probably know about the hardware. Specifically, you probably
    know that the processor on the generation 1 and 2 iPhones is a 620 MHz ARM processor
    underclocked to 412 MHz. You also probably know that it has a PowerVR MBX Lite
    3-D graphics processor. You should know that it has 128MB of memory, and as a
    solid-state flash disk.


    Table 3.2 shows the specifications of the iPhone compared to a typical desktop
    computer in more detail.


    | Table 3.2 Comparison of iPhone Hardware to Desktop Machines |

    | Specification | iPhone (iPhone 3GS) | Desktop |

    | --- | --- | --- |

    | Processor | 620 MHz ARM (833 MHz ARM) | 3.0 Gt Xeon |

    | Memory | 128MB (256MB) | 2.0GB+ |

    | Disk Space | 8, 16, 32GB | 300GB+ |

    | Screen Resolution | 480x320 | 1920x1200 |


    When you are testing, the impact of this difference in hardware is pervasive.


    > NOTE Though the iPhone 3GS adds significant new capabilities in terms of processor
    speed and memory, it''s important to remember that the 36GS still represents a
    small percentage of overall iPhone OS users. If you truly want widespread adoption,
    you should try to target the lesser hardware specifications when possible.


    Using only 128MB of memory means that you are very constrained in memory when
    working on the device. The 128MB that is included is not just with your app, but
    also with the operating system, and with the built-in apps that run in the background
    even when they are shut down. This means that you can only count on having about
    15 to 22MB of memory available for your application. After this, you start to
    see memory warnings. The simulator never generates a warning unless you ask it
    to, and furthermore, apps running in the simulator utilize your system RAM, which
    includes and usually multiple gigabytes of available storage.'
  merge: -1
  pgno: 49
- img_proc: true
  md: "# Chapter 3: Exploring the Simulator in Depth\n\n> NOTE\n the iPhone 36S, the\
    \ available memory for an application can be as high as 150MB as opposed to 15\
    \ or 22 on the older phones.\n\nThe slower processor and graphics processor on\
    \ the iPhone mean that algorithms and graphics operations that run very fast on\
    \ the simulator can be much slower when running on actual hardware. For example,\
    \ operations that involve transparency are known to be particularly expensive\
    \ on the iPhone hardware and should be avoided. These are typically not problem\
    \ when running on the simulator. Additionally, some operations that may seem trivial,\
    \ for example, object allocation, can be very expensive when done on actual hardware.\
    \ The simulator does not suffer from these issues.\n\nWhat all this means is that\
    \ there is simply no substitute for testing your app on actual hardware. Test,\
    \ and test often. Don't wait until the last minute and test it as an afterthought.\
    \ Do it daily.\n\n# Summary\n\nIn this chapter, you've looked at the simulator\
    \ in all its glory. You've dug into its filesystem and looked at how to interact\
    \ with it. You've seen what capabilities are supported on the simulator and what\
    \ are not. You've looked at the performance differences between the simulator\
    \ and actual iPhone hardware. During your career as an iPhone developer, you're\
    \ going to find-yourself returning to the simulator over and over again; this\
    \ background information should make you feel comfortable doing further exploration\
    \ and help you understand where to look when things go wrong in your application\
    \ and you need to track the problem down."
