  md: '# Implementing a Database with Core Data


    When the iPhone SDK originally became available, one of the features that developers
    most frequently requested was to have a framework that had been available on Mac
    OS X for several years. That framework was Core Data.


    Core Data is a database abstraction layer developed by Apple to help make applications
    with a database-backed model easier to write. It provides a set of classes that
    enable the user to perform complex queries on a tabular data set without needing
    to know the details of the low-level implementation of that data set. It can be
    used in conjunction with a SQL database, an XML database, or a binary flat file.
    The format of the underlying implementation is abstracted from the developer.
    Additionally, it provides a set of GUI tools that allow the developer to define
    his schema. Finally, it provides a mechanism for doing migrations from one schema
    to the next, thus allowing the database and schema to grow and change as the developer''s
    application changes.


    > NOTE

    XML Data stores are not supported on the iPhone, only on Mac OS X.


    In this chapter, you are going to take a detailed look at how to work with Core
    Data in conjunction with the iPhone for developing database-applications and you
    will implement your Favorite Cities application, using Core Data to model your
    data.


    # In This Chapter


    +   - Adding a database to your application using Core Data

    - Exploring the object modeling tool in Xcode to make your application schema

    - Understanding the different types of properties and relationships available
    in Core Data entities

    - Creating, reading, updating, and deleting Core Data objects

    - Updating the sample Favorite Cities application to use Core Data'
  merge: -1
  pgno: 232
