  md: "# Chapter 13: Handling Text Input\n\n# Taking action when the user has finished\
    \ editing\n\nAgain, perhaps the most important of these methods are the textFieldDidEndEditing\
    \ method, which allows you to be notified when the user has finished editing the\
    \ text field and thus take the value in the text field and set it on one of your\
    \ model objects.\n\nListing 13.3 shows how to handle a text field that has resigned\
    \ the first responder and how to take its value and put it into a model.\n\n#\
    \ 13.3\n\n# Handling the User Finishing Editing\n\n```\n(void)textFieldDidEndEditing:(UITextField\
