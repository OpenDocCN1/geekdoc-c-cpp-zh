  md: '# Using the Game Kit API


    As part of iPhone OS 3, Apple introduced the Game Kit API. Game Kit is a new framework
    that aims to solve two main problems facing application and game developers.


    The first problem is the ability to create ad hoc peer-to-peer networks among
    devices within close proximity to each other. To satisfy this need, Game Kit provides
    a sophisticated, yet simple-to-use mechanism for designing exactly this over the
    Bluetooth networking capability built into iPhone and the second-generation iPod
    Touch.


    The second problem is the ability to add in-game voice to applications. This is
    a common requirement among applications that enable multi-user play, and including
    this capability is generally beyond the abilities or resources of most developers.
    To solve this, Game Kit provides an easy-to-use in-game voice capability that
    leverages Apple''s prior experience in adding voice to iChat, and brings power
    to the realm of developers. Developers don''t need to know about codecs, or protocols;
    they just use the API, and everything is handled for them.


    In this chapter, we will examine these two frameworks and how you can leverage
    them in your games and applications. In particular, it should be pointed out that
    the features in this API are only applicable to games. The peer-to-peer networking
    capability, in particular, could be leveraged by applications to exchange data
    amongst multiple users of a particular application when they are in close proximity.


    # In this Chapter


    +   Adding peer-to-peer ad hoc networking to your iPhone applications


    +   Adding voice chat to your iPhone applications


    # Providing Peer-to-Peer Connectivity


    The first feature of Game Kit that I''m going to discuss is its ability to provide
    an ad hoc peer-to-peer network to devices within close proximity to each other.
    This functionality is provided primarily by the GKPickerController and GKSession
    classes.


    Before using the Game Kit API, you must first add the Game Kit framework to your
    project. Do this this by right-clicking your target, choosing Get Info, and then
    choosing the General tab. Click the button at the bottom of the window under Linked
    Libraries, and then choose the Game Kit framework. You must also include the GameKit.h
    file in your source file.'
  merge: -1
  pgno: 300
- img_proc: true
  md: "# Finding peers\n\nThe GKPeerPicker class provides the mechanism by which you\
    \ find other peers on your local bluetooth ad network. Using it, you can retrieve\
    \ a list of all the other devices in the vicinity that are currently available\
    \ for networking with your application. It also allows you to find peers over\
    \ the Internet, but when you choose to use the Internet instead of Bluetooth,\
    \ you must dismiss the GKPeerController and present your user interface to complete\
    \ the connection. GKPeerPickerController does not handle making peer connections\
    \ over the Internet.\n\nTo allocate and display a GKPeerPickerController, you\
    \ simply need to initialize it, configure the allowed network types, and then\
    \ set your delegate. Finally, to actually display it on-screen, you can call the\
    \ show method. Listing 21.1 shows a typical implementation of setting up and displaying\
    \ a GKPeerPickerController.\n\n+   21.1\nInitialization and Display of the GKPeerPickerController\n\
    \n```\n#import <GameKit/GameKit.h>\n\n-(void)showPeerPicker:\n(\n  controller\
    \ = [[GKPeerPickerController alloc] init];\n  [controller delegate:self];\n  [controller\
    \ show];\n)\n```\n\n> NOTE\nYour delegate must conform to the GKPeerPickerControllerDelegate\
    \ protocol to be able to be the delegate for the GKPeerPickerController.\n\nWhen\
    \ you can show, your application displays a dialog showing that it is looking\
    \ for other Game Kit–enabled devices nearby.\n\nAs you can see, displaying the\
    \ peer picker controller is reasonably trivial. The actual lifting is going to\
    \ be handled by your GKPeerPickerControllerDelegate, which is going to take action\
    \ when a peer has been selected. In this particular code, I've set your delegate\
    \ to self, and so this class needs to implement the appropriate delegate messages\
    \ to handle the events that it is interested in."
  merge: -1
