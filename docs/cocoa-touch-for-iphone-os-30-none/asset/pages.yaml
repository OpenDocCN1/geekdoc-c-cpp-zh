    # Handling resource alerts


    The first category of messages that you might receive while your application is
    running are resource alerts. The most important of these are the didReceiveMemoryWarning:
    message, which you receive if the iPhone''s memory is running low.


    Remember that even only one user is allowed to run at a time, and there are still
    system applications running in the background on the iPhone all the time, and
    the memory used may not necessarily be strictly to your application. Nonetheless,
    you are expected to reduce your memory footprint when you have received this warning.
    Furthermore, if you do not reduce your memory footprint, the operating system
    sends another low-memory warning, your application can be force-terminated in
    order to free up memory for the operating system.


    Your view controllers also receive this message when there is a low-memory warning,
    and you typically free memory in those objects. However, this method is provided
    on the application delegate itself for any other data that you can purge. The
    ways that you can find to free up data include purging caches or deleting temporary
    data. You may also flush data to disk, persisting in a way that enables you to
    retrieve it later when you need it.


    Another resource message that you may receive is the applicationSignificantTimeChange:.
    This message is received when a significant time event occurs. Examples of a significant
    time event are the changing of daylight savings time and the arrival of midnight.'
