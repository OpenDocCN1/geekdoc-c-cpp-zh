  md: '# Interfacing with Peripherals


    A new feature in iPhone OS 3 is support for interfacing with third-party accessories
    through the dock connector or over Bluetooth. The framework responsible for this
    is called the External Accessory framework, and it is this framework that this
    chapter will discuss.


    # Creating Accessories That Interface with iPhone


    In order for an accessory to interface with iPhone OS, it has to support some
    form of communication protocol. iPhone OS does not specify the types of protocols
    that are required to be implemented in order to communicate. When interfacing
    with an accessory, the API internal to the application is a stream API. The data
    that is streamed (the protocol itself) is entirely to the developer of the accessory
    and the developer of the application. The accessory needs to declare what protocols
    it supports, and the application, when looking for accessories to communicate
    with, should look at the accessory information to be certain that the accessory
    supports the protocol it wants to communicate with.


    Your application must declare the types of protocols that it supports. To do this,
    you need to add to your Info.plist a key called UISupportExternalAccessProtocols,
    which should be an array of strings indicating the protocols your application
    supports. The protocol identifier strings should be in reverse DNS notation to
    avoid naming conflicts. If your application declares that it supports a particular
    protocol, when an accessory requesting that protocol is connected, iPhone OS attempts
    to launch your application in response. If no application is found supporting
    the protocol that the accessory has requested, iPhone OS may launch the App Store
    to recommend applications that do support that protocol.


    +   In This Chapter

    Listing accessories connected to the dock connector

    Connecting to devices using the External Accessories framework

    Talking to accessories using streams'
  merge: -1
  pgno: 396
- img_proc: true
  md: "# Finding Accessories That Are Connected Using EAAccessoryManager\n\nOnce your\
    \ application is running, to find connected accessories you use the EAAccessoryManager.\
    \ This class provides a list of connected accessories that your application can\
    \ communicate with. The expectation is that you retrieve the list of connected\
    \ accessories and then check each one's supported protocol list for a protocol\
    \ that you can use to communicate with. Once you have found a device that you\
    \ can communicate with, you can then communicate with it using the EASession class.\n\
    \n![](img/0ccd1d097de6918b1df92faf66d987b6_397_0.png)\n\n> NOTE\nTo use the External\
    \ Accessory framework, remember that you must link it with your project and import\
    \ its headers.\n\n32.1 shows how you use the EAAccessoryManager to find a device\
    \ that you can communicate with based on a particular protocol.\n\n# 32.1\nFinding\
    \ a Device That Supports Your Protocol\n\n```\nNSMutableArray *accessoriesToTalk\
    \ = [NSMutableArray array];\nEAAccessoryManager *manager =\n[EAAccessoryManager\
    \ sharedAccessoryManager];\nfor (EAAccessory *accessory in [manager connectedAccessories])\
    \ {\n    if ([accessory protocolStrings] containsObject:myProtocol) {\n      \
    \  [accessoriesToTalk addObject:accessory];\n    }\n}\n// display the list to\
    \ the user to choose.\n```\n\niPhone OS allows you to talk to only one accessory\
    \ per protocol. If multiple accessories are connected that support the same protocol,\
    \ your application needs to decide which one to talk to. In this example code,\
    \ you are simply making a list of the devices that support your protocol. When\
    \ finished, it displays the list to the user and allows them to select.\n\nNote\
    \ that the EAAccessoryManager is a singleton and therefore should be accessed\
    \ using the singleton accessor method."
  merge: -1
  pgno: 397
- img_proc: true
  md: '# Understanding the EAAccessory Class


    The EAAccessory class essentially contains metadata about the connected accessory.
    It also allows you to find out information about the accessory, such as the accessory
    name, the manufacturer, model number, serial number, and so on. Additionally,
    the EAAccessory also has a delegate protocol that can tell you if and when the
    accessory is disconnected. It contains only one method: accessoryDidDisconnect:


    Once you have the accessory object, however, it enables you to create an EASession
    object.


    # Working with EASession


    The EASession object is the primary means with which you establish communication
    with the device. To create an EASession object, you must previously have acquired
    an EAAccessory object, typically from the EAAccessoryManager.


    Once you have an EASession object, it provides you with a read stream and a write
    stream, which you can use to communicate with the device. Again, the External
    Accessory framework does not provide you with support for the protocol that must
    be used to communicate with the accessory. Your application has to provide the
    implementation of that protocol. The External Accessory framework only provides
    the communication channel.


    Listing 32.2 how to get the read and write streams from an EASession object.


    +   32.2

    Accessing the Read and Write Streams on an EASession Object


    ```

    EASession *session = [[EASession alloc] initWithWithAccessory:accessory

    forProtocol:myProtocol];


    InputStream *inputStream = [session inputStream];

    NSOutputStream *outputStream = [session outputStream];

    [inputStream setDelegate:self];

    [outputStream setDelegate:self];

    [inputStream scheduleInRunLoop:[NSRLoop currentLoop]

    for:NSDefaultRunLoopMode];

    [outputStream scheduleInRunLoop:[NSRLoop currentLoop]

    for:NSDefaultRunLoopMode];


    [inputStream open];

    [outputStream open];


    [session release];

    ```'
  merge: -1
  pgno: 398
- img_proc: true
  md: "In this particular case, you are acquiring both an input and an output stream\
    \ and setting your-self as the delegate for them. You schedule the streams to\
    \ run in the default run loop, and then you open them. Once they're over, you\
    \ are able to receive data on the input stream and send data on the output stream.\n\
    \nSubsequently, you don't actually have to keep the EASession object around. Once\
    \ the NSStream objects have been acquired, it's perfectly acceptable to release\
    \ the EASession.\n\n# Talking to Your Device Using NSStreams\n\nOnce you have\
    \ acquired your NSStream and set yourself as the delegate, it is a simple matter\
    \ of implementing the NSStream delegate protocol so that you can receive events\
    \ from the streams.\n\nListing 32.3 shows the implementation of one of the NSStream\
    \ delegate methods. This method is triggered when an event is received for the\
    \ NSStream. In this particular case, this method is receiving an event indicating\
    \ there is data to be read on the stream.\n\n# Listing 32.3\n\n# Implementing\
    \ the NSStream Delegate Method\n\n```\n(void)streamEvent: (NSStream *)theStream\
    \ handleEvent:(NSStreamEvent)streamEvent\n  if(streamEvent == NSStreamHasBytesAvailable)\n\
    {\n    char buf[1024];\n    [inputStream read:buf maxLength:1024];\n    // do\
    \ something with the data...\n  }\n```\n\nObviously, there may be better ways\
    \ to handle this input. However, this shows you the basic mechanism that is used\
    \ to read data from the accessory.\n\nIt is also simple to write data to the accessory.\
    \ Listing 32.4 shows an example of how to do this."
  merge: -1
  pgno: 399
- img_proc: true
  md: '# Listing 32.4


    # Writing Data to the Accessory


    If all the data cannot be written, then the write method returns the number of
    bytes that could actually be written. It is up to your application to adjust your
    buffer accordingly and finish sending the remaining data when you receive an event
    from the output stream indicating that it can now accept more bytes.


    # Summary


    It''s beyond the scope of this book to go into a lot of detail about the various
    hardware protocols that you might need in order to implement communication with
    accessories. However, in order to get to the point where you can implement those
    protocols, you first have to understand how to connect two devices using the iPhone
    OS API. It is this API that I have introduced to you here.


    By using the External Accessory framework, you can communicate with a variety
    of accessories both through the dock connector and over Bluetooth. For more information,
    visit the iPhone developer portal.'
  merge: -1
