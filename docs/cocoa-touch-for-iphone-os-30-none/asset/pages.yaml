  md: '# Using UITableView


    The application example in the previous chapter got the job done, it was certainly
    not an example of an elegant user interface. It was useful to demonstrate some
    of the intricacies of UITableViewController, but if you consider the type of data
    that you were working with (a list of cities), then it''s easy to recognize that
    a different kind of user interface might be more effective at navigating this
    data. Fortunately for you, there is another type of view that is uniquely suited
    to lists. That view is a UITableView, and this is the view you will focus on.


    Table views are not new in the realm of GUI toolkits. On the iPhone, however,
    because of its small screen size, there are a variety of constraints that make
    it impossible to implement a traditional table view with rows and columns. Instead,
    Apple provides the UITableView, which can be used to display a variety of list-oriented
    data. One way to think of the UITableView is in terms of representing a single-column
    subset of your data, but it can also be used to represent hierarchical data. In
    this chapter, you''ll see how to display your favorite cities as a list in a UITableView.


    # Understanding UITableView Data Sources and Delegates


    The first thing that you need to do before you add a UITableView is to create
    a data source for your model so that you can feed the data from your model to
    the view. To do this, you need to understand the role of two key protocols: the
    UITableViewDataSource protocol and the UITableViewDelegate protocol. They are
    used to provide data and customization, respectively, to your UITableView instances.


    The UITableViewDataSource is used to provide data from your model class to the
    UITableView. It has methods that you are expected to implement that are called
    by the UITableView when it needs to load its data. These methods allow you to
    feed your data to the UITableView without coupling the UITableView directly to
    your model.


    # In this Chapter


    +   Exploring the methods of a UITableView


    +   Learning how UITableView accesses data from your model without being coupled
    to it


    +   Implementing a data source for a UITableView


    +   Expanding the sample application to use a UITableView'
  merge: -1
  pgno: 82
- img_proc: true
  md: '# Building GUIs


    The UITableViewDelegate protocol is used to provide customization for how the
    UITableView behaves. For example, there are methods on the UITableViewDelegate
    protocol that allow you to customize whether or not particular rows can be edited.
    In this way, imagine that the UITableView, whenever it needs to know how you want
    it to behave, asks the UITableViewDelegate what to do.


    Let''s take a look at what each of these protocols looks like.


    # Understanding IndexPath and how it works with UITableViewViews


    Before I talk about the data source and the delegate, I need to talk about IndexPath.
    The reason that this is important is because of the methods that are in these
    protocols take an IndexPath as an argument, and so you need to know how to work
    with them.


    In its simplest form, an IndexPath represents the path required to access a specific
    node in a tree of nested arrays. By default, an IndexPath can be used to represent
    a path of virtually limitless depth, but for working with UITableView you are
    really only interested in using it to represent the location (row) of an item
    within a section. Because they are used extensively in UITableView, there is a
    set of extensions that have been added to IndexPath specifically for UITableView.
    These are the section method and the row method, and they represent the section
    index and the row index, respectively. Therefore, to determine what item a particular
    IndexPath represents, you can ask it for its section, and then you can use this
    information to look within your table view.


    6.1 shows an example of how an IndexPath can be used to represent a particular
    row within a section.


    Now that you understand about IndexPath, let''s take a look at the UITableViewDataSource
    protocol.


    # Exploring UITableViewDataSource


    The UITableViewDataSource is probably the most important component of working
    with a UITableView. Because of this, it''s very important for you to fully understand
    exactly how it works and what you need to use in your code.


    The key element to understand is that when the UITableView needs to load its data,
    it asks the UITableViewDataSource for that data. This includes the following:
    how many groups you want in your table; what kind the headers for those groups
    are; what data to show in a particular cell; and what kind of custom cell to use
    for a particular row. As you can see, this is really the core of your data and
    thus also your table.'
