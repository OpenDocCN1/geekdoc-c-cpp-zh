    # NSNetServices


    Finally, to publish your services to Bonjour, use the NSNetService class again.


    Essentially, to advertise that you are providing a service on a particular port
    at a particular host, you instantiate an instance of NSNetService, initializing
    it with the type, name, and port of your service. You then call the publish method.
    This causes your service to be advertised to NSNetServiceBrowsers that are looking
    for services of the type that you are providing.


    List 19.16 shows an example of advertising a Web service using the NSNetService
    class.


    +   List 19.16


    # Advertising a Web Service


    ```

    -(void)advertiseWebService;

    // set up your web server here...

    // ...

    // advertise the web server

    NSNetService *svc = [[NSNetService alloc]

    initWithDomain:@:@".local"

    type:@"Joe''s Web Service"];

    [svc setDelegate:self];

    [svc publish];

    ```


    Again, just like before, the publish method returns immediately and events associated
    with publishing are handled by the delegate. In this case, probably the most important
    event that you want to handle on the delegate is the event signifying that your
    service was published successfully. When this occurs, the delegate sends the message
    netServiceDidPublish:. Your application should take appropriate action is necessary
    in response to this event. Additionally, you should probably also implement the
    delegate method netService:didNotPublish:, which is called in the event that your
    service could not be published, for example, if there is some kind of network
    error.


    The signatures for these delegate methods are shown in Table 19.7.'
