  md: '# 324 Working with Media


    MPMediaPropertyPredicate can be constructed using one of its two factory methods:
    predicateWithValue:forProperty:, which does a simple "equal" comparison, predicateWithValue:forProperty:comparisonType:,
    which allows you to define the type of comparison performed. In each case, you
    pass a value and a property name. The value is the value you want to match, and
    the property name is the name of the property you want to search. Possible property
    names are shown in Table 26.2.


    | Property | Description |

    | --- | --- |

    | MPMediaItemPropertyPersistentID | Each item in the library has a unique ID.
    This property can be used to select a specific item with that ID |

    | MPMediaItemPropertyMediaType | This property allows filtering for particular
    types of media, such as podcasts, audio books, and so on |

    | MPMediaItemPropertyTitle | The item''s title |

    | MPMediaItemPropertyAlbumTitle | The item''s album title |

    | MPMediaItemPropertyArtist | The item''s artist |

    | MPMediaItemPropertyAlbumArtist | The item''s artist |

    | MPMediaItemPropertyGenre | The genre of the item |

    | MPMediaItemPropertyComposer | The composer of the item |

    | MPMediaItemPropertyPlaybackDuration | The duration of playback of the item |

    | MPMediaItemPropertyAlbumTrackNumber | The track number of the item from the
    album |

    | MPMediaItemPropertyAlbumTrackCount | The count of the album item is from |

    | MPMediaItemPropertyDiscNumber | The disc number of the item |

    | MPMediaItemPropertyDiscCount | The count of discs from the item |

    | MPMediaItemPropertyArtwork | The item''s artwork |

    | MPMediaItemPropertyLyrics | The lyrics for them |

    | MPMediaItemPropertyIsCompilation | A boolean value indicating if the item is
    part of a compilation |


    Table 26.2

    nSo, for example, to search for all songs by the artist Daft Punk that are not
    part of a compilation,

    y you could build an MPMediaPropertyPredicate using the code shown in Listing
    26.3.'
