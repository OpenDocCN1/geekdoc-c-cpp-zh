  md: '# Using Advanced Core Animation

    with CALayer


    As I said before, the UIView animation code makes working with simple animations
    trivial. But what if you want something with a little bit more control? For example,
    what if you want to animate a graphic over a particular path? You see this done
    in the mail application when you send messages to folders: you see a small icon
    that moves in an arc and plugs into the folder. Doing this when using the UIView
    animation blocks would be onerous. Ideally, you want to be able to do is simply
    define a path along which your image moves. Fortunately for you, there is a low-level
    API that allows you to do exactly this.


    Core animation consists of a collection of classes that work together to enable
    you to complex animations. The most central of these classes is the CALayer class,
    which provides an abstraction for a view-like hierarchy of layers that can be
    animated. All UIViews on iPhone OS have an associated CALayer property that can
    be accessed and operated on using the other core classes. In the following example,
    you will use this capability to animate an image over a particular path.


    To view a CALayer, simply call the method layer on a UIView instance. The path
    that the image will travel is simply a graphics path. You create using core graphics
    calls, and then you create a CAframeAnimation using the path. You then add this
    to your layer.


    Listing 14.5 shows the creation of your animation path. In it, you want to move
    from a location in the upper-left corner to the lower-right corner. You''re going
    to do it in an arc, so that it''s dropping it into a bucket.


    # 14.5


    # Creation of the Animation Path


    ```

    CGPoint startPoint = CGPointMake(20, 20);

    CGPoint controlPoint1 = CGPointMake(280, 100);

    CGPoint controlPoint2 = CGPointMake(280, 100);

    CGPoint endPoint = CGPointMake(300, 440);

    ```


    ```

    CGMutablePathRef path = CGPathCreateMutable();

    CGPathMoveToPoint(path, NULL, startPoint.x, startPoint.y);

    CGPathAddCurveToPoint(path, NULL,

    controlPoint1.x, controlPoint1.y,

    controlPoint2.x, controlPoint2.y,

    endPoint.x, endPoint.y);

    ```


