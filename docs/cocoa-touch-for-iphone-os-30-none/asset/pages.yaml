  md: '# Adding search


    Adding search to UITableView is slightly less straightforward but still not particularly
    complicated. Essentially, what you need to do is to add a UISearchBar to your
    nib file, and assign that to be the custom view for your header using the UITableView
    tableHeaderView. This special view displayed by the UITableView, such that it
    appears at the top of the list when you scroll to the top. Then configure your
    data source to be UISearchBarDelegate. As you receive events from the UI search
    bar, you filter your data model accordingly. The UI search bar delegate method
    that you need to implement is the searchBar:DidChange: method, which is called
    as the user is editing the text.


    The Standard apple also uses an overlay over the list view when search begins
    to prevent the user from touching the list while search is active. You can easily
    do this by adding an overlay into your nib and displaying it over of your UITableView.
    The method to implement in the UI search bar delegate to do this is the searchBarTextDidBeginEditing:


    If you choose to, be hide this overlay view when the user actually begins typing
    search string so that he can choose an item from the filtered list. In addition
    to this, you may want to implement on your overlay view a handler for touch events
    such as if the user touches on the overlay view without having typed any search
    criteria, it clears the search and returns to the main list. For more information
    about handling touch events, see Chapter 11.


    # Summary


    In this chapter, you''ve taken an in-depth look at the UITableView class and its
    sister classes UITableViewDataSource and UITableViewDelegate. Using these classes,
    you can display lists of data in your applications efficiently and easily. In
    the next few chapters, you will see how to add further customization to your UITableView
    using UITableViewCells, and then you''ll see how you can use your UITableView
    in conjunction with UINavigationController to display and navigate large trees
    of hierarchical data. This chapter, however, has given you a solid foundation
    in how to utilize UITableView in your application.'
