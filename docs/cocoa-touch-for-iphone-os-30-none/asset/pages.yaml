  md: '# Understanding Core Data’s Building Blocks


    The Core Data framework, at its most basic level, consists of four primary components.

    nThe first component is the schema that defines the data that will be stored and
    manipulated in the application. This schema is known as the Managed Object Model.
    Through code, this component is accessed via the classes NSManagedObjectModel
    and NSEntityDescription, respectively. To design the schema, Xcdodel provide an
    object modeling tool that allows direct manipulation of the Managed Object Model
    when you are designing your application. Figure 18.1 shows the managed object
    modeling tool in Xcode.


    18.1


    # The object modeling tool in Xcode


    The object modeling tool in Xcode


    ![](img/0ccd1d097de6918b1df92faf66d987b6_233_0.png)'
  merge: -1
  pgno: 233
- img_proc: true
  md: 'Essentially, the Managed Object Model defines the schema for entities. Entities
    form the blue-print for the objects stored in the database. The objects themselves
    are the second component of the core data framework.


    Any object that is stored and managed by Core Data is known as a Managed Object
    and is a subclass of NSManagedObject. If the definitions for the attributes of
    the entities are defined by NSntityDescription and the NSManagedObjectModel, then
    the entities are represented by NSManagedObjects. When working with objects stored
    in Core Data, you will work with NSManagedObjects.


    NSManagedObjects are stored in one of three different types of files. Those files
    can be a SQL database, an XML database, or a binary flat file. The SQL database
    is managed through the Persistent Coordinator, the Persistent Store Coordinator
    represents the third component of the Core Data framework. The different persistent
    object stores give you the ability to configure the type of actual physical storage
    for storing your data. The persistent object store is accessed through the PersistentStore
    class. Typically, as a developer, you''ll rarely interact with the persistent
    store and its coordinator directly. Most Core Data work is done through managed
    objects, the object model, and so on.


    The final component of Core Data consists of the NSManagedObjectContext. The NSManagedObject
    provides the in-application scratchpad when NSManagedObjects are manipulated.
    All operations in Core Data are within the scope of an NSManagedContext.


    # Adding Core Data Support to Favorite Cities


    To demonstrate the use of Core Data in an application, you''re going to bring
    up your Favorite Cities application, and you are going to modify it to add Core
    Data to it. You could as easily use the Core Data template in Xcode to create
    a new Core data application and then modify it to be the Favorite Cities application;
    but again, I felt that would be more instructive to modify your existing application
    so that you don''t come rely on the templates as a crutch. This is also a more
    practical example in terms of most applications and how they are written. Most
    applications are fairly orthogonal in the way they grow, meaning that you might
    develop the application initially storing things in a flat file, and then realize
    that you want to utilize Core Data instead.


    So, to do this, get the example code from Chapter 8, which it is, and open it
    in Xcode. When you were working with this code in Chapter 8, you actually had
    not made it save your data to disk. Everything was being done in memory. This
    makes it very easy for you to transition to Core Data, because you don''t have
    an existing file of data that you have to convert. If, however, you were updating
    an existing application to Core Data, you would need to read your custom file
    into memory and then store it in the Core Data store the first time that you run
    it after the upgrade.'
