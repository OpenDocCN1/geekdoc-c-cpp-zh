- img_proc: true
  md: '# Exploring the payload


    The alert component of the notification can be either a string or a dictionary
    containing several specific subelements. If the alert is simply a string, the
    text given is the message for the alert window that is displayed on the device.
    With it, two buttons are also displayed, Close and View. If the user touches View,
    then the application has registered for notification is launched, and given the
    notification.


    If the alert component is a dictionary, it may contain several subelements. These
    include body, action-loc-key, loc-key, and loc-args.


    The body key specifies the alert message when using this message format.


    The action-loc-key, if specified, specifies the text to display in view of the
    View button on the display. If its value is null, the system displays the alert
    with only a single button that says OK. This dismisses the alert when touched.
    There is no button that launches the application.


    The loc-key, if specified, provides a key to an alert message in your localization
    strings file for the current localization. This key is used to get a localized
    message string to display the text of the alert message. This value can be formatted
    using printf-style format strings in conjunction with the loc-args key.


    Finally, the loc-args provides an array of strings for use in conjunction with
    the print-format specifiers used in the loc-key property.


    # NOTE


    The JSON dictionary must adhere to RFC 4627.


    A typical payload, when fully constructed, should look something like this:

    "aps":{"alert":"<messageText>", "badge":1},


    # Wrapping the payload in the APNS message


    Once you have encoded your payload as specified here, you need to deal with actual
    sending it to the APNS servers. The interface for doing this is a plain TCP socket.
    You''ll see more about how to connect to the socket and send your message shortly,
    but I want to address the message format that''s used to send the message here
    while I am discussing the payload.


    The actual message that your application server sends to the APNS servers consists
    of a binary format, as shown in Figure 20.3.


    ![](img/0ccd1d097de6918b1df92faf66d987b6_285_0.png)'
  merge: -1
