  md: '# Applying Custom UIViews


    In this chapter, we''re going to return to the Model, View, Controller design
    pattern, and focus on one particular component of this pattern, views. Every graphical
    component that you use in building your applications inherits from UIView, the
    Cocoa Touch class that represents the View part of the Model, View, Controller
    pattern. This means that understanding this fundamental component is vital to
    your success on the platform.


    Doing custom drawing is one of the most common requirements when creating custom
    UIViews. One of the most powerful things that Cocoa Touch inherits from its UIKit
    lineage is its drawing API. When it was originally developed, this drawing API,
    known as Core Graphics, was unparalleled for its ease of use and capabilities.
    Even now, with its acceleration with OpenGL, it provides an excellent way to draw
    custom 2-D graphics on the screen.


    In addition to its outstanding abilities when it comes to drawing graphics, UIView
    also provides some simplified mechanisms for doing basic animation using Core
    Animation.


    In this chapter, you are going to take a look at how to add custom UIViews to
    your projects and then how to draw graphics in those views.


    # In This Chapter


    +   - Working within the Cocoa Touch view geometry

    - Adding a custom view to an interface

    - Exploring Core Graphics

    - Using basic drawing commands


    The first thing to understand about using UIViews is how the Cocoa Touch view
    works. Figure 10.1 shows a typical iPhone screen and the coordinate system that
    is used on that. Note that the coordinate system has its origin in the upper-left
    corner, which is different from the default coordinate system used by Cocoa on
    Mac OS X. On Mac OS X, the origin of the coordinate system is in the lower-left
    corner. This means that when drawing graphics on the iPhone screen, your points
    and lines must work within this coordinate system.


    # Understanding Cocoa Touch View Geometry'
