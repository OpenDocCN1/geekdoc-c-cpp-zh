    This does not contain the actual address; it is simply the street name area. |

    | subThroughfare | This specifies additional information at the street level of
    the location. For example, this might contain the actual street name for the location.
    |

    | locality | This specifies the city name associated with the location. |

    | subLocation | This specifies a sublocation within the city for a particular
    location, such as a neighborhood name or landmark. |

    | administrativeArea | This specifies the state associated with the location.
    |

    | subAdministrativeArea | This specifies a government-defined region within an
    administrative area such as a county, parish, and so on. |

    | postalCode | This specifies the postal code associated with the location. |

    | country | This specifies the country associated with the location. |

    | countryCode | This specifies the country abbreviation associated with the location.
    |


    # Summary


    It''s amazing to think that today we have handheld devices such as the iPhone
    that contain the powerful geolocation-sensing capabilities that they do. It''s
    incredible to think about the kinds of applications that can be developed when
    you combine the capabilities of the GPS with the ability to draw maps, and reverse
    geocode those coordinates to human-readable information such as addresses and
    landmarks. It''s fortunate that Apple has made the API for dealing with these
    capabilities incredibly easy to use. This chapter introduced you to the MKMapView
    and its associated APIs. Using them, you can develop all kinds of new and exciting
    applications that harness the power of GPS.'
