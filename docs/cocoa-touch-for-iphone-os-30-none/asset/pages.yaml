  md: '# Creating a UITextFieldDelegate


    Because most applications want to be notified when the user has finished editing
    the text, you probably want to implement a UITextFieldDelegate or UITextDelegate
    in your application. The implementation between the two of them varies slightly,
    for demonstration purposes, I''ll be focusing on the UITextFieldDelegate.


    # Knowing when the text changes


    Typically, you set your view controller to be the UITextFieldDelegate for fields
    on your view. The most important methods that you''ll be interested in implementing
    are textFieldShouldEditing and textFieldDidEndEditing. These methods are called
    just before and after the text field is asked to resign the first responder. The
    method textFieldShouldEditing: provides an excellent hook for your application
    to do input validation, to determine whether or not you want to allow the user
    to dismiss the keyboard and continue working. The textFieldDidEndEditing method
    provides an excellent location for you to take the data from the text field and
    update your model.


    Table 13.2 Some of the other methods defined on the UITextFieldDelegate protocol


    | Method Signature | Purpose |

    | --- | --- |

    | (BOOL) textField:(UITField*) textFieldChangeCharactersInRange:(NSRange) range
    replacementString:(NSString*) | This method is called when the user introduces
    a new character into the text field and gives you the opportunity to prevent that
    character from being typed. |

    | (void) textFieldDidBeginEditing:(UITField*) | This method is called after the
    text field has become the first responder. |

    | (void) textFieldDidEndEditing:(UITField*) | This method is called after the
    text field has resigned the first responder. |

    | (BOOL) textFieldShouldBeginEditing:(UITField*) | This method is called before
    the text field becomes the first responder. |

    | (BOOL) textFieldShouldClear:(UITField*) | This method is called in response
    to the built-in clear button on the UITextField |

    | (BOOL) textFieldShouldEndEditing:(UITField*) | This method is called before
    the text field resigns the first responder. |

    | (BOOL) textFieldShouldReturn:(UITField*) | This method is called when the user
    has pressed the Return key and gives you the opportunity to disallow her from
    doing so. |'
