  md: '# Understanding the UIApplicationDelegate


    Thus far, every application that you''ve written has contained an application
    delegate class. Typically, these are generated by the template you use to create
    the project in the first place. Therefore, it is logical that I should take a
    moment to discuss the application delegate and what it does for you.


    I won''t go into tremendous amounts of detail in this chapter; the goal here is
    to become familiar with the architecture and some of the messages that the UIApplicationDelegate
    can receive.


    # Exploring the Purpose of the UIApplicationDelegate


    Every application written for the iPhone has an application delegate. In some
    ways, you can think of the application delegate as your main class for your application.
    It''s the first place that your application is handled control from the operating
    system when it''s launched, and it is also the last place that the application
    executes from as it is exiting. This makes it the perfect place to handle tasks
    such as loading and saving of persistent state. In addition to this, it also handles
    certain operating system messages that are sent to the application as it is running.
    These include handling memory warnings, or changes in the size of the status bar.


    The way that you use UIApplicationDelegate is by creating a class that implements
    the UIApplicationDelegate protocol and then creating an instance of that class
    in your MainWindow nib file. Usually there is no reason for you to think about
    any of this because the project templates do all this work for you. You really
    need to know is to look in your project for the class''s called <YourProjectNameAppDelegate.
    This is the application delegate that is provided by your template. All you need
    to do is implement the methods that you want to utilize in this, and everything
    else will fall into place.


    Let''s take a look at some of the methods that you may want to use in your applications.


    > In This Chapter


    +   - Receiving the ins and outs of the UIApplicationDelegate

    - Handling startup and shutdown of your application

    - Receiving memory warnings and status information

    - Receiving network notifications and handled URLs'
  merge: -1
