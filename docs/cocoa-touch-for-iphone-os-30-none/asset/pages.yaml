  md: '# Chapter 27. Recording Audio


    So, to allocate and initialize an instance of AVAudioRecorder, you call the initializer
    `initWithURL:settings:`, which takes as arguments a URL designating the place
    to store the recorded data, and a settings dictionary, containing the properties
    for the audio recording itself. The settings dictionary contains keys and values
    for a variety of properties relating to the audio recording. The available keys
    and their purposes are shown in Table 27.1.


    | Table 27.1 Keys Used for the AVAudioRecorder Settings Dictionary

    | Key | Purpose |

    | AVFormatIDKey | This specifies the audio data format identifier. |

    | AVSampleRateKey | This specifies the sample rate in hertz as a floating-point
    value wrapped in an NSNumber. |

    | AVNumberOfChannelsKey | This specifies the number of channels as an integer
    value wrapped in an NSNumber. |

    | AVLinearPCMDepthKey | This specifies the bit depth for a linear PCM audio format
    recording. The value is an integer wrapped in NSNumber. Possible values are 8,
    24, or 32. This is only relevant for the linear PCM audio format. |

    | AVPCMIsBigEndian | This specifies whether the audio format is big or little
    endian. It is only relevant for the linear PCM audio format. |

    | AVPCMIsFloat | This specifies whether the audio format is floating point. It
    is only relevant for the linear PCM audio format. |

    | AVEncoderAudioQualityKey | This specifies the recording audio quality. It can
    be one of AVAudioQualityMin, AVAudioQualityLow, AVAudioQualityMedium, AVAudioQualityHigh,
    or AVAudioQualityMax. |

    | AVEncoderBitRateKey | This specifies the bit rate of the recording. |

    | AVEncoderDepthHintKey | This specifies the bit depth hint of the recording.
    Possible values range from 8 to 32. |

    | AVSampleRateConverterAudioQualityKey | This specifies the sample rate conversion
    quality. It can be one of AVAudioQualityMin, AVAudioQualityLow, AVAudioQualityMedium,
    AVAudioQualityHigh, or AVAudioQualityMax. |


    Once you''ve initialized an AVAudioRecorder, to begin recording, all you need
    to do is call the method record. Like AVAudioPlayer, AVAudioRecorder provides
    an instance method of `prepareToRecord`. This method creates the file and prepares
    buffers for recording so that there is minimal delay when you actually want to
    begin recording. If the file that you'
