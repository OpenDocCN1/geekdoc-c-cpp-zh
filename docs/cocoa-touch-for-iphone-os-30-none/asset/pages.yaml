  md: '# Chapter 8: Working within the UINavigationController Model


    Probably the easiest way to do this is to open your MainWindow.xib file and drag-drop
    a UINavigationController object from the palette to the objects browser window.
    This creates an instance of a UINavigationController in your view. You then create
    an IBOutlet in your application delegate to connect this navigation controller.


    The UINavigationController will include a default root ViewController that is
    prebuilt into it. To make it your ViewController, you need to configure it to
    pull your UIViewController from its nib.


    To do this, you create a separate nib for your ViewController. Typically, this
    ViewController is stored in a separate nib, not in your main window nib. To add
    this UIViewController to the UINavigationController, edit the NIB Name property
    on the default root view controller object and set it to the name of the nib containing
    your ViewController. You also need to edit the Class of the root view controller
    and set it to the class of your view. The root view controller is a subobject
    of the navigation controller, as shown in Figure 8.2. it’s called "MyViewController."
    With this object selected in the object browser, the NIB name property can be
    found on the first tab of the info panel, and the Class property can be found
    on the last tab.


