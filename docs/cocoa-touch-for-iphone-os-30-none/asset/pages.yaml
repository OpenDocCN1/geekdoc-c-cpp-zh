    \ Allowing You to Update Your Favorites\n\n```\n(void) tableView:(UITableView*)tableView\n\
    didSelectRowAtAtIndexPath:(NSIndexPath*)indexPath\n{\n  MutableDictionary *cityData\
    \ = \n    [cityData objectForKey:@\"cityDataIndex\" objectAtIndex:(integer)indexPath.row]\
