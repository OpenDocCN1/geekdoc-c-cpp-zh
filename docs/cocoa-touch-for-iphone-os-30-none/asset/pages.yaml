  md: '# Working with sessions


    The class used to provide actual network connectivity between peers is the GKSession
    class. This class provides an easy-to-use mechanism for sending arbitrary data
    to one or multiple peers over an ad hoc Bluetooth network. Additionally, the GKSession
    class allows you to configure client-server connections instead of strict peer-to-peer
    connections when your application requires it. In this case, you bypass the GKPeerPickerController
    entirely and configure your connections using the GKSession class directly.


    To allocate a GKSession object, you call the initWithWithSessionID:display Name:sessionMode:,
    which takes as parameters a session ID, a display name, and the session mode.


    Your GKSession instance can act as client, server, or peer, depending on the sessionMode
    configured on initialization. As a server, you have connects to you, but the application
    does not search for servers. As a client, your application searches for servers,
    but does not advertise itself as server. As a peer, your application searches
    both for servers and advertises itself as server.


    When needing to create a server instance of a GKSession, you simply allocate and
    initialize the GKSession object with a sessionMode parameter of GKSessionModeServer.
    To create a client instance of GKSession, pass a parameter of GKSessionModeClient.
    To create a GKSession as a peer, pass a parameter of GKSessionModePeer.


    Servvers become visible on the local network by setting the available property
    of the GKSessionDelegate to YES.


    The GKSession provides methods that can be implemented to handle reception of
    data from other peers. As usual, the heavy lifting is handled by the delegate
    of the GKSession class.


    Each session on a network is uniquely identified by its sessionID. This can be
    provided by the algorithm, or if you choose to pass nil, it creates one for you
    using the application bundle ID. In this way, the user for your application is
    unique.


    When working with GKSession directly, you are expected to present whatever user
    interface you feel is required to allow the user ability to choose the server
    they wish to connect to. The displayName property is used to provide a human-readable
    name for your UI when displaying this.


    Once you have created the GKSession, you set its isAvailable property to YES in
    order to begin searching for servers and advertising as a server. If you are handling
    the connection self(that is, you are not using a GKPeerPickerController), then
    you can later connect ToPeer:withTimeout: to actually initiate a connection to
    a server, for example, in response to the user selecting a server to connect.'
