  md: 'able to implement, depending upon your needs. Most of the methods are optional.
    Of these methods, the ones that you''ll most utilize manage selections and allow
    for editing of table rows.


    # Customizing selection behavior


    To allow or disallow a user from selecting an item in the UITableView, you implement
    the method tableView:willSelectRowAtIndexPath:: This is passed the index Path
    of the row that you would like to choose. If you want to allow the user to select
    the row, then you return that index path. Alternatively, if you want to redirect
    their selection to another row, you can return a different index path that points
    to the row you want them to select. Finally, if you want to disallow the selection,
    simply return nil.


    Once the user has made their selection, the method tableView:didSelectRowAtIndexPath
    Path: is called. From this method that you should allocate view controller for
    the new view that the user will be navigating to the selection, and push it on
    to the navigation controller.


    # NOTE


    When you have finished creating the new view, and have pushed it on to the navigation
    controller, you need to explicitly deselect the selected row in the table using
    the method deselectRowAtIndexPath:animated: on the UITableView.


    # Customizing editing behavior


    When it comes to handling editing of rows in the UITableView, the methods provided
    by the UITableViewDelegate cell primarily on handling the behavior surrounding
    deletion and reordering of the rows. Perhaps the most important of these methods
    is tableView:editingStyleForRowAtIndexPath:: which allows for the customization
    of the editing style for a particular cell. When overiding this method, you are
    expected to return an appropriate UITableViewCellEditingStyle value. The possible
    values for this are listed in Table 6.2.


    # Table 6.2 Possible Return Values for Editing Style


    | Setting | Description |

    |---|---|

    | UITableViewCellEditingStyleNone | No editing control is displayed. |

    | UITableViewCellEditingStyleDelete | A minus sign within a red circle is displayed
    next to the row. |

    | UITableViewCellEditingStyleInsert | A plus sign within a green circle is displayed
    next to the row. |'
