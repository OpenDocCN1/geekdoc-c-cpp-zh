  md: '# Working with Data


    Listing 20.4


    # Connecting to the Server and Sending Your Packet


    ```

    # Connect to port 2195 on the server.

    sock = TCSocket.new(''gateway.sandbox.push.apple.com'', 2195)

    # do our SSL handshaking

    sslSocket = OpenSSL::SSL::SSSocket.new(sock, openSSLContext)

    sslSocket.connect

    # write our packet to the stream

    sslSocket.write(packet)

    ```


    Finally, you send the packet to the server.


    # Pushing notifications


    Now that you have an implementation of a notification supplier, to use it, you
    simply run the command:


    ./notify.rb ''<token>'' ''<message>''


    The token is received from your client application. For the purposes of testing
    and experimentation, you could make the application simply log its token to the
    console. You could then copy and paste that into your command line. In your actual
    implementation, however, you will need to work out some mechanism to send the
    token to your server using sockets and auto-matic process.


    Once the message is received on the device, it will be displayed on the screen.


    # Checking delivery using feedback


    If you remove your application from her device, obviously it makes no sense to
    continue sending the notifications. Notifications received for applications that
    are no longer installed are not displayed. The device also sends a notice back
    to the APNS server to indicate that the message was unable to be delivered. The
    APNS server then subsequently adds to a list that it keeps on the APNS feedback
    servers. You should occasionally connect to the feedback servers and download
    the list of tokens that have not received the notifications you''ve sent. You
    should then cease cending messages to those tokens.'
  merge: -1
