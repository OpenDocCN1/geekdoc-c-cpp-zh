  md: '# Chapter 19: Connecting to the World with Networking


    When a service is no longer available, the delegate method removeService: called.
    Just like the services are being discovered, this method is called for each service
    as it is removed. Additionally, the more parameter signals whether there are multiple
    services that are going to be removed. You should again continue reading the services
