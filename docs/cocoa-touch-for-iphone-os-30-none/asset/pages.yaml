  md: '# Building GUIs


    | Table 6.1 Required Methods on a UITableViewDataSource |

    | Method | Description |

    | --- | --- |

    | (NSInteger) tableView: (UIView*) numberOfRowsRowsInSection: (NSInteger) section
    | Returns the number of rows for the given section |

    | (UITableViewCell*) tableView: (UIView*) tableViewCellForRowIndexPath: (NSIndexPath*)
    indexPath | Returns the cell to display your data |

    | (NSInteger) numberOfSectionsInTableView: (UIView*) tableView | Returns the number
    of sections in your table view |


    When asking the data source for your data, the first method that the UITableView
    calls is the numberOfSectionsInTableView: Method. This method should return one
    section in the case where there is only one section in your table view.


    > **NOTE** All table views have at least one section. In the case where you have
    multiple sections in your table view, you would return more than one.


    Related to this method are the tableView:titleForHeaderInSection and table View:titleForFooterInSection:
    methods, which allow you to customize the header and footer, respectively, for
    each of the sections. Figure 6.2 shows where these headers and footers appear
    in a typical UITableView.


    After the UITableView has asked for the information about the sections, it then
    asks for a count of the rows in each of the sections. The method that you implement
    to give the table view information is the tableView:numberOfRowsInSection: method.
    This method should return the number of rows in your model for the given section.


    Finally, perhaps the most important of these methods is the tableView:cellForRowAtIndexPath:
    method, which provides the actual data from your model to the table view. It does
    this by creating a UITableViewCellCell and placing the data into that cell, which
    is then returned.'
