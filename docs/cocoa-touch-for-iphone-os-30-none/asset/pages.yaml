- img_proc: true
  md: '# Integrating Push Notifications with Your iPhone Client


    Building an application that registers for push notifications is incredibly simple.
    You first need to register for the notifications, and then when you get your token,
    you send it to your application server. Finally, when notifications are received,
    your application is launched with the notification information as a parameter.
    If a notification occurs while your application is running, your application receives
    a message that you can also use to take action based on the notification.


    > NOTE


    If a notification is received for your application while your application is running,
    then no message displays. You are expected to take whatever action is necessary
    for it, including displaying a message yourself if appropriate.


    # Registering for notifications


    To register for notifications, you simply call the method registerForRemoteNotificationTypes
    on your UIApplication singleton. This is shown in Listing 20.5.


    # Listing 20.5


    # Registering for Remote Notification Types


    ```

    (void)applicationDidFinishLaunching: (UIApplication *)application {

    [[UIApplication sharedApplication] registerForRemoteNotificationTypes:

    (UIRemoteNotificationTypeAlert|UIRemoteNotificationTypeSound|UIemoteNotificationTypeBadge)];

    // Override point for customization after app launch

    [window addSubview:self.controller.view];

    [window makeKeyAndVisible];

    }

    ```


    After the application has contacted the APNS and registered for the notifications,
    your application delegate receives a call to didRegisterForRemoteNotificationsWithDeviceToken:.
    You should use this opportunity to send your token to your push supplier. In the
    example shown in Listing 20.6, you use the fictional method sendToServers: for
    this purpose.'
  merge: -1
  pgno: 296
- img_proc: true
  md: "Listing 20.6\n\n# Sending the Device Token to the Server\n\n```\n(void)application:(UIApplication\
    \ *)application didRegisterForRemoteNotification\nWithDeviceToken:(NSData *)deviceToken\n\
    {\n    [self sendToServers:deviceToken];\n}\n```\n\n# Receiving notifications\
    \ in your application\n\nFinally, when you actually receive a notification, there\
    \ are two paths by which it can enter your application.\n\nThe first occurs when\
    \ your application is not running, but the user chooses the View button on the\
