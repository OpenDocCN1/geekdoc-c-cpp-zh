  md: "# Allocating a CLLocationManager\n\nThe first thing you need to do with the\
    \ Core Location API is to allocate a CLLocationManager. The CLLocationManager\
    \ provides the primary entry point to the Core Location system. There's really\
    \ nothing special about this: simply allocate an instance using new alloc and\
    \ init. Once you have an instance of the CLLocationManager, you can either get\
    \ the position for the user at this particular moment or you can register a delegate\
    \ with the CLLocationManager to be updated by the user's position changes over\
    \ time. In both of these cases, however, you must also call the startUpdatingLocation\
    \ method, which causes the CLLocationManager to begin gathering location data\
    \ and updating your delegate. If you don't call this method, your delegate will\
    \ not receive notifications, and if you try to access the location directly from\
    \ the CLLocationManager then you will receive a nil instead.\n\nIn the example\
    \ application, you're going to allocate the CLLocationManager in your viewDidLoad\
    \ method and then you're going to have buttons on your UI that allow you to start\
    \ and stop the updating of the location. Finally, you'll have a button that sends\
    \ the data to Google Maps to display your location.\n\n# TIP\n\nThe viewDidLoad\
    \ method gets called automatically after the view is loaded from the nib file.\
    \ When it's called, all the objects that your IOutlets have been connected to\
    \ are loaded and initialized, so it's a good place to set your initial values.\n\
    \n30.1 shows your viewDidLoad method.\n\n# 30.1\n\n# An example viewDidLoad Implementation\n\
    \n```\n(void) viewDidLoad {\n  locMgr = [[CLLocationManager alloc] init];\n\n\
    \  if(![locMgr locationServicesEnabled]) {\n    [status setText:@Status: Location\
    \ Services Disabled];\n  } else {\n    [status setText:@Status: CLLocation Services\
    \ Enabled];\n  }\n\n  [locMgr setDesiredAccuracy:kLLocationAccuracyNearestTenMeters];\n\
    \  [locMgr setDistanceFilter:kDistanceFilterNone];\n  [locMgr setDelegate:self];\n\
    }\n```"
  merge: -1
  pgno: 374
- img_proc: true
  md: 'So, to create the CLLocationManager, you simply call [[CLLocationManager alloc
    init], assigning it to your member variable.


    Once you have an instance of CLLocationManager, you should check to determine
    if the user has location services enabled before requesting a location. The user
    has the option to disable location services in the settings of the iPhone if they
    prefer not to allow applications to know their location. Calling the method locationServicesEnabled
    returns a Boolean value to tell whether or not the user has this set. If they
    have disabled location services, then you should probably alert them that they
    want to utilize this feature they should change this on their device. There is
    no way for an application to change this setting programmatically.


    Next, you set the desired accuracy and the distance filter. I''ll talk more about
    this later, but for now, you can just ignore it.


    # Setting yourself as the delegate


    Finally, you set yourself as the delegate. You''ve already declared that this
    object adheres to the CLLocationManagerDelegate protocol in the header, as shown
    in Listing 30.2.


    Listing 30.2


    # The Header File for the CoreLocationDemoViewController


    ```

    @interface CoreLocationDemoViewController :

    UIViewController <CLLocationManagerDelegate>

    CLLocationManager *locMgr;

    IBOutlet *status;

    @property (retain) CLLocationManager * locMgr;

    - (IBAction) startTouched:(id) sender;

    - (IBAction) stopTouched:(id) sender;

    - (IBAction) didGoTouches:(id) sender;

    -(void) locationManager:(CLLocationManager *) manager

    didUpdateLocation:(CLLocation *)newLocationnfromLocation:(CLLocation *)oldLocation;

    @end

    ```


    # Implementing the CLLocationManagerDelegate protocol


    To implement this protocol, you implement the methods locationManager:did UpdateToLocation:fromLocation
    and locationManager:didFailWithError:, as shown in Listing 30.3.'
