    \ proprietary protocol or something of that nature.\n\n# Exploring Bonjour\n\n\
    You've seen how to retrieve data from the Internet and from other hosts on your\
    \ network using the high-level Objective-C classes and the low-level core foundation\
    \ API. How do you discover services available on your local network? The answer\
    \ is Bonjour.\n\nBonjour is the name for the API that Apple provides for interfacing\
    \ with its multicast DNS resolution service. Multicast DNS is an Internet standard\
    \ that allows for resolution of hostnames, services, and even IP addresses, with\
    \ no preconfiguration necessary. It's used in a variety of applications on Mac\
    \ OS X, such as iTunes for sharing, iPhone, and even file sharing. and it is also\
    \ available on the iPhone via Cocoa Touch.\n\nBonjour allows you to advertise\
    \ services that you provide, as well as to discover services that are provided.\
    \ This capability is limited to your local network, but within that context, it\
    \ works very effectively.\n\nAn important distinction should be made here. Bonjour\
    \ does not in any way handle transport-level network activity. This means that\
    \ it does not actually handle sending application data from one host to another.\
    \ Bonjour is strictly for the purposes of service publishing and discovery."
