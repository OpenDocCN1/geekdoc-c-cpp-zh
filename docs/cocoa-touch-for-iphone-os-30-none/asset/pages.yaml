  md: "The UIView animation blocks can be used when you want to animate the flipping\
    \ of the user interface from one UIView to another; you can use the method AnimationTransition:forView:cache:\
    \ to configure the view transition from one to another. This was a very common\
    \ requirement under iPhone OS 2.0, in cases where you wanted to display the flip\
    \ side of the user interface for configuring settings. iPhone OS 3 introduces\
    \ the ViewController property modalStyle, which makes this less necessary, but\
    \ it's still a valuable technique to know, both with older devices and for doing\
    \ flip transitions on views that don't have a view controller associated with\
    \ them.\n\nTo use an animation transition to toggle between two UIViews involves\
    \ several steps. First, you have to create a container view that will actually\
    \ do the transition. You add your current displaying UIView to the container view,\
    \ and display it. When you want to transition the views, you begin your animation\
    \ block using the beginAnimations:context: class method. Within this block is\
    \ where the real action happens. You set the animation transition using the method\
    \ setAnimationTransition:forView: to the type of transition you want (flip left,\
    \ flip right, and so on). Then you remove the subview from the container view\
    \ and add your new subview. When you commit the animations, your transition takes\
    \ place. Listing 14.4 shows this in action.\n\n# Listing 14.4\n\n# Animating a\
    \ Flip Transition from One View to Another\n\n```\n- (void)flipTransition;\n{\n\
    \  [UIView beginAnimations:@FLIP context:nil];\n  [UIView setAnimationTransition:UIViewAnimationTransitionFlipFromRight\
    \ forKey:containerView cache:YES];\n\n  [currentSubview removeFromSuperview];\n\
    \  [containerView addSubview:newSubview];\n  [UIView commitAnimations];\n}\n```\n\
    \nYou can see, this making basic UI transitions very simple. Now, what if you\
    \ want something a little bit more complex? The animations I've shown you here\
    \ are all very basic. However, the kinds of animation that you might want to use\
    \ involve things like keyframes, complex motion, and so forth. The class methods\
    \ on UIView are not well suited to this. To do this, you need to go a little bit\
    \ deeper and at a slightly lower level and work with the core animation API itself."
