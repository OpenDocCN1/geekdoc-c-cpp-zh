  md: '# 6.2.4 The Curse of the Burst: Economic Thinking behind Burst Buffers


    HPC I/O currently is dominated by extreme bursts of data, not only in the checkpoint
    workload but also in analysis workloads. Since I/O time is unproductive time in
    general, the goal is to make I/O minimal. As machine memory sizes get bigger,
    from 1 PB of memory to exascale-class machines with 50-100 PB of memory, the size
    of bursts is becoming enormous. Further, given the shrinking job mean time to
    interrupt (JMTTI), for the checkpoint use case, the time for I/O is shrinking.
    Figure 6.2 shows the effect of the ratio of JMTTI over checkpoint. As JMTTI goes
    down, checkpoint time must also go down non-linearly in order to keep machine
    utilization high.


    To add to this dilemma of JMTTI and checkpoint times, disk drives (which are currently
    used for checkpoint I/O) typically get denser, nearly to the square of increases
    in streaming bandwidth. This means that the number of


