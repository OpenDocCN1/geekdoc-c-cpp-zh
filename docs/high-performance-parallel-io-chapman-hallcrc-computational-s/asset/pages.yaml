  md: '# High Performance Parallel I/O


    the processing elements, data-centric models provide facilities to describe how
    the data is laid out on the system and apply the computation to the data where
    it resides (in situ). There are numerous software-based approaches pursued that
    enable data to be operated upon where it was produced, or in transit. Even more
    aggressive technological tries to embed capability into the storage devices. This
    includes everything from embedding intelligence directly into disk systems such
    as the Nietzsche, to the re-emergence of processor-in-memory and processor-near-memory
    technologies. Chapter 30 explores that all of these innovative solutions are fundamentally
    orthogonal to the standard POSIX view of I/O consistency, and open the door to
    new-storage approaches that obey a more transactional or “functional language”
    semantics to preserve consistency and correctness.


    **Data Movement:** The data movement challenges may accelerate development of
    nanoscale optic/photonic solutions. Although much of our data transmission used
    by “wires” (electrical connections of some form) the intrinsic resistance of the
    material used limits any involving electrons. The principal problem is that the
    energy consumed to transmit a bit is proportional to the distance it must travel
    (due to the resistance of the metal used to conduct the electricity). Copper is
    as good a conductor as can be for a common material at room temperature. For communications
    (wire replacement), photonics have the benefit of having energy costs that are
    nearly independent of the distance data travels, whereas the standard electrical
    wires have a strong distance-dependent energy cost. Therefore, photonic technology
    has enormous potential to overcome the fundamental limitation of wire resistance,
    if they can overcome the challenge of improving the efficiency of laser light
    sources.


    Photonics offers huge bandwidth improvements. When an electronic communication
    channel can only carry one signal, multiple wavelengths of light can share the
    same optical conduit without interference using Wave Multiplexing (WDM). Photonics
    will play an essential role in overcoming limits of wires and break the boundary
    of on-chip and off-chip communications costs, and cost/distance relationships
    [3]. The implications for dense wave multiplexing (DWDM) using photonic device
    technology for interconnects is explored in more detail in Chapter 32.


    **Resilience:** Lastly, nanoscale components with aggressive scaling in voltages,
    currents, photons, etc. can raise efficiency, but the probability of failures,
    and more critically soft errors, will also rise. Creating systems that are inherently
    resilient to both hard and soft failures is the most challenge for exascale computing.
    Worse yet, we depend on our storage systems as the “safe location” to recover
    application state for the most commonly used application resilience methods, so
    the requirements for the resilience of storage systems are far higher than that
    of the compute devices to which they are connected.'
