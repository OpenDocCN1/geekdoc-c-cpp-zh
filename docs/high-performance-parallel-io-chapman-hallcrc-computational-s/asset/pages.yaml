    NERSC is able to provide both external and internal users with high-bandwidth
    access to data because of their security stance. In general, NERSC''s network
    infrastructure eliminates up-front barriers when users or collaborators want to
    gain access to NERSC data and computational systems that are guided by each science
    team''s desires. Instead of using firewalls as their main security policy, which
    impedes all data transfer performance, NERSC sponsors a unique network analysis-based
    security program Bro [1] that actively monitors and enables or disables real-time
