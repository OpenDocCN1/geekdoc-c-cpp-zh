  md: '# MPI-IO


    Using explicit offsets is also a thread-safe way of accessing the file, since
    there are no separate check and read/write functions.

    MPI-IO also supports a third way that involves using a shared file pointer. The
    shared file pointer is a common file pointer shared by all processes in the communicator
    passed to the file open. This file pointer can be moved by calling MPI_File_seek_shared.
    The corresponding read/write functions are MPI_File_read_shared and MPI_File_write_shared.
    This method is useful for writing log files, for example. However, maintaining
    a shared file pointer involves some overhead for the implementation. Hence, for
    performance reasons, the use of these functions is generally discouraged.


    # 13.2.2 Blocking and Nonblocking I/O


    MPI-IO supports both blocking and nonblocking I/O functions. The read/write functions
    mentioned above are all blocking until the specified operation is completed. Each
    of these functions also has non-blocking variants: MPI_File_read, MPI_File_iwrite,
    MPI_File_read_at, MPI_File_iwrite_at, MPI_File_read_shared, and MPI_File_iwrite_shared.
    They return an MPI_Request object immediately after the call, similar to MPI nonblocking
    communication functions. The user must call MPI_Test, MPI_Wait, or variants to
    wait for completion of these operations. The nonblocking I/O functions offer the
    potential for overlapping I/O and computation in the program.


