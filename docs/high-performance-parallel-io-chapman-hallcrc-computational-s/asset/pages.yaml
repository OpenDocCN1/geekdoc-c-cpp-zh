    established file format precluded parallel I/O, so Parallel-NetCDF used that file
    format as the foundation. By maintaining file compatibility, scientists could
    introduce Parallel-NetCDF to their workflows with minimal disruption. Parallel-NetCDF
    could not implement some of its ideas for optimized parallel I/O without altering
    the programming API, but alterations were done in the spirit of serial-NetCDF,
    and retain much of the same feel and semantics.


    Both libraries support the "classic" netCDF file format, depicted in Figure 15.2.
    The first bytes of the file contain a header. This header describes the name and
    size of the dimensions used by the variables; the name, type, shape, and starting
    location in the file of variables; and annotations or "attributes" associated
    with dimensions, variables, or the entire dataset.


    Serial NetCDF introduced the idea of a bi-modal API: to write a dataset, a program
    enters "define mode." In define mode, the programmer defines the dimensions being
    used, associates those with variables, possibly annotates the components of the
    dataset, and switches to "data mode." The program can only transfer data after
    it has described how the data will be stored. This pre-declaration of the file
    structure benefits parallel I/O greatly—a process can compute where every element
    of array will go, and need not coordinate with any other process. The listing
    in Figure 15.3 provides a brief example of how define mode and data mode work
    together. Readers can find entire code samples in the on-line Parallel-Netcdf
    Tutorial [1].


