    # 4.1.2 Mira


    The Blue Gene/Q system is an evolution of Blue Gene/P and is similar in architecture.
    Mira, a 10 PFLOP Blue Gene/Q system, consists of 48 ranks, each containing 1024
    system on chip 1.6 GHz core nodes. The “A2” cores are based on the 64-bit Power
    ISA2.06 specification [2], with quad floating points per core and 16 GB of RAM
    for a total of 49,152 nodes, 786,433 cores, and 76 TB of RAM. There are several
    unique features on the processor. Sixteen of the cores are available for computation,
    one is used for operating system services, and the eighteenth is a spare core
    in case one of the other fails in production, but it is shut down during normal
    operations. This core also supports transactional and speculative execution in
    hardware. In the Blue Gene/Q, IBM called the collective and barrier network 5D
    torus network, which has 4x4x4x2 in a 512 node half (midplane) that has 4 GB/s
    bi-directional bandwidth in each torus dimension with 80ns nearest-neighbor latency
    and 1.5µs maximum latency. There is an eleventh 4 GB/s link for I/O communication,
    which is covered in detail in the Section 4.2, Parker [7].


    Additionally, ALCF runs two node visualization clusters, Eureka and Tukey. Eureka
    supports users on Intrepid and uses older precision NVIDIA GPUs. Tukey supports
    users on Mira, which uses newer double precision GPUs.


    # 4.2 Overview of I/O at ALCF


    There are many classes of I/O in HPC. The one that is most common and the one
    most systems are designed around, defensive I/O, usually called a checkpoint.
    The primary purpose of defensive I/O is to write information to the disk so that
    the application can restart from that point in the event the program fails before
    it completes. Sometimes restart is the only for this file, and the next checkpoint
    is written, or the program completes, this file can be deleted, but sometimes
    the file provides useful output. However, there are many other types of I/O that
    occur in the typical scientific workflow. These include post processing or analysis,
    file transfers in and out of the facility, file transfers from the scratch file
    system to a more permanent location, and transfer to tape.


    The common storage system design for HPC systems has a scratch file system where
    checkpoint files are written. This file system is fast in order to minimize the
    I/O time. However, because these systems are designed to be fast and therefore
    expensive, the file systems are generally too small to hold all the data, so facilities
    implement purge policies. A typical purge policy states that if a file has not
    been accessed after a small number of weeks, six or'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# High Performance Parallel I/O


    less, the data will be deleted. Purges may also occur based on the file system
    free space below a given threshold. This forces the users of the system to transfer
    their data off of the scratch file system to some other longer term storage location.
    This could be another file system (typically larger, but slower, and therefore
    less expensive), tape, or transferred out to another institution. This does not
    directly contribute to the problem.


    When designing the I/O system at ALCF, the typical HPC I/O system criteria were
    considered: integrity (the data read back is the data that was written), bandwidth
    (how fast can the data be written to the storage system), stability (how often
    do they break), and resiliency (how does the system respond when things do). ALCF
    also added the user''s experience to their list of requirements. Their goal is
    to create better, user-friendly systems by not having the typical scratch design,
    and not requiring users to move data around. As noted, each supercomputer (Intrepid
    and Mira) has its own ecosystem of storage, network, analysis cluster, infrastructure,
    etc. In order to meet the goal of avoiding unnecessary data movement, each supercomputer
    has a single storage system that is mounted on all-facing nodes. This results
    in peak bandwidths that tend to be lower than other comparable sites, but the
    storage system is large enough that users can generally keep all their data in
    a single place until they are finished with. Then users can transfer the data
    to tape, or out of the facility for long-term archival storage.


    # 4.3 I/O Hardware


    The ALCF essentially runs two independent facilities centered around the Blue
    Gene supercomputers. The systems are running independent instances of all the
    required services such as authentication, domain name servers, etc.


    At a high level, the I/O system design is the same on each of the machines. As
    on the largest supercomputers, the Blue Gene family uses dedicated I/O nodes each
    of which the I/O needs of a subset of the compute nodes. It is simply not practical
    to build a storage fabric with tens of endpoints on it. User''s jobs make file
    calls on the compute nodes. These file systems calls are intercepted and forwarded
    by the operating system to the I/O nodes. The I/O nodes optionally do aggregation
    and optimization of the calls coming in and then replay the system calls on behalf
    of the compute nodes. The configuration of each system is covered in detail below.'
