    # 4.4 I/O Software


    # 4.4.1 GPFS


    ALCF deployed similar configurations for GPFS on their main systems, Intrepid
    and Mira. On Intrepid, they ran the GPFS versions 3.2 and 3.3 for the lifetime
    of the system. On Mira, they are running GPFS version 3.5. On Intrepid, they only
    upgraded GPFS when they needed to fix a problem rather updating system proactively.
    This problem when issuing a file system check and upgrading GPFS multiple times
    there were several fixes for the fix feature. In Mira, ALCF plans to track GPFS
    software more closely and always get new updates on their test and development
    system.


    # 4.4.1.1 Configuration


    For both Intrepid and Mira, ALCF configured the system into an NSD cluster, which
    contains only file server and dedicated manager nodes; and several remote clusters,
    which are client clusters. The core configuration parameters of the file systems
    are the block size: 4 MiB on Intrepid and 8 MiB on Mira. Both file systems use
    scatter allocation. On Intrepid, there is no replication for data or metadata,
    making data protection completely reliant on RAID hardware. On Mira, metadata
    is replicated. From experiences on Intrepid, it was extremely disruptive for the
    file system to be offline for any reason. Even if a single LUN was down (1 out
    of a possible 1152) and there was no metadata replication, there is the risk key
    top-level directories will become unavailable and the majority of the file system
    can no longer be navigated.


    Another key learned on Intrepid was poor performance related to the compiler linking.
    Extrepid mixed both data and metadata on the same SATA storage. Later, the GPFS
    file system was upgraded on Intrepid to use FusionIO Flash storage cards for metadata,
    and this greatly improved the user experience. On Mira, ALCF expanded on this
    performance improvement and designed all DDN SFA systems to have SSD LUNs, which
    are dedicated to metadata. This generally improves the user experience for operations
    like ls and directory navigation.'
