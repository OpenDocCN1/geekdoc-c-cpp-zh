    # 8.3 Deployment and Usage


    Since Lustre is an open-source file system, it can run on a huge variety of different
    platforms. There is no vendor lock-in and storage purchases can be made to best
    suit the buyer’s requirements and budget. Lustre provides the foundation for a
    healthy ecosystem of key storage vendors including others, DataDirect Networks,
    EMC, Hitachi Data Systems, NetApp and Xyrarate. Such variety makes it hard to
    collect precise data about the number of deployments in production, but a conservative
    estimate would be in the thousands worldwide.


    Many sites use Lustre as global storage, shared-site across multiple computing
    resources used for visualization and analysis clusters down to individual workstations.
    Lustre routers provide the bridge between the HPC fabrics used within computing
    clusters and the storage network—often Infiniband or high performance Ethernet—used
    site-wide. It enables the "islands of data" associated with private HPC file systems
    and enables workflows to span seamlessly all computing resources at a site without
    copying data unnecessarily [2].


    Lustre’s origins from research funded by US government labs have meant widespread
    use was first established in research and academic sectors. They used Lustre primarily
    for checkpointing and to simulation and modeling datasets. However, as the product
    has matured, a growing number of organizations in the private sector have adopted
    Lustre, particularly in genomics and the oil and gas industry.


    The oil and gas industry relies heavily on seismic data for the exploration and
    appraisal of new oil and gas reserves. Single datasets can stretch to terabytes
    in size and require dedicated high computing resources for processing and interpretation.
    Lustre is attractive in this field since it is significantly speeding up the processing
    times, it presents a single global file system namespace, and additional storage
    can be added without needing to take the system out of service.


    Large volumes of data are also a factor in genomics. New improvements in laboratory
    technologies and processes continue to increase the demand at an astonishing rate.
    For example, the Sanger Institute reports that they produce ten thousand times
    the amount of sequencing data compared to five years ago, therefore the ability
    by Lustre to expand seamlessly, both in performance and capacity, to meet evolving
    capacity demands is crucial.'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'The majority of Lustre deployments are single-site, however a number of prominent
    Lustre users have deployed Lustre over wide-area networks (WAN) in order to share
    data between geographically distant locations. The Naval Research Laboratory [8]
    pioneered the deployment of Lustre using RDMA over WAN to create a globally accessible
    storage and compute cloud. Indiana University, founded by the National Science
    Foundation, created the “Data Capacitor”—a 535-TB file system connected to wide-area
    networks, first across 10 Gigabit connections [13], and most recently across 100
    Gigabit [7]. The latest Capacitor (DC II) is 10 times larger and roughly 3 times
    faster than its predecessor and continues to run Lustre because of its speed and
    scalability.


    # ## 8.4 Conclusion


    The Lustre file system has grown from a DOE research initiative to become the
    extreme-scale HPC file system of choice. Large Lustre deployments have reported
    tens of thousands of clients, tens of petabytes of capacity, and sustained write/read
    speeds measured in terabytes per second. For example, the “Spider” file system
    deployed at ORNL has 26,000 clients [2]; the Sequoia system at LLNL has 55 PB
    of storage capacity [15]; and the Fujitsu K system has reported 1.2 TB/s sustained
    write and over 2.0 TB/s sustained read performance [16].


    In response to the increasing momentum behind “big data” and especially a growing
    interest in MapReduce as a tool for analysis in the HPC community, a corresponding
    interest has developed in providing Hadoop runtime that can exploit Lustre storage
    effectively. In recent developments, a storage abstraction that allows Hadoop
    to use Lustre in HDFS has been shown to double I/O performance [9] while maintaining
    the benefits of full POSIX so that datasets can be analyzed in-site.


    Lustre is also used in the DOE Fast Forward Storage and I/O project to leverage
    research in Exascale storage systems [1]. These systems push scaling to the absolute
    extreme and require a drastic re-think of POSIX semantics. From a surface appearance,
    they have very little in common with Lustre. However, shared-nothing object storage
    will continue, as it is in Lustre today, to be a foundational system component.
    As the Fast Forward prototype evolves into tomorrow’s production Exascale storage
    systems, this underlying architecture, including some of the actual source code,
    will be able to trace its roots back to Lustre.'
