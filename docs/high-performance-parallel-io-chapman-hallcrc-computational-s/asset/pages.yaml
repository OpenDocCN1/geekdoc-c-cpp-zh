- pgno: 420
  md: '# 34.3.1 Introducing More Asynchrony in the File System


    Asynchronous I/O (AIO) is a method of allowing computation and I/O to be performed
    simultaneously, potentially improving the utilization of a system''s resources
    and reducing the execution time of a task. AIO is most effective when provided
    with hardware support, application design, and operating system support. This
    is often the case in stand-alone workstations, but many HPC applications running
    at large scales are coupled, which causes resource contention to affect the efficiency
    of the application. AIO directly reduces network traffic while the application
    is executing, which can introduce delays in completing synchronizing actions like
    halo exchanges, collectives, etc.


    Another, perhaps more significant, issue when using AIO in HPC applications is
    memory pressure. A synchronous checkpoint is typically going to write a significant
    proportion of the application''s memory to disk. Applications run more efficiently
    when using more memory, but AIO requires holding the checkpoint''s buffers until
    they have been moved off-node. This extra memory usage has the potential to reduce
    the overall effectiveness to the point that AIO would cause the application to
    run slower.


    One possible solution to these problems is to add asynchrony to the portions of
    the parallel file system running outside of the compute node, in the form of off-node
    buffer caches. There are at least two major projects that aim to implement this
    concept: the Burst Buffer project, and the Sirocco system.


    # 34.3.1.1 The Burst Buffer


    The burst buffer (see Chapter 23) may be the most widely discussed hardware I/O
    accelerator within the storage system research community. The burst buffer is
    a high-bandwidth, flash-based storage server that is placed between the compute
    nodes and disk-based storage servers, acting as an initial destination for data
    being written to disk. Because flash has a much higher bandwidth than disk, an
    application can checkpoint quickly to the burst buffer, then continue computing.
    The burst buffer can then orchestrate a slow data migration to disk-based storage
    before the next checkpoint interval, creating a storage system that can satisfy
    bursty workloads like synchronous checkpointing. Previous estimates, by anticipated
    capacities and bandwidth, show that an exascale system that supports checkpoint
    restart would only consume approximately 6.6% of an anticipated exascale power
    budget [13].


    # 34.3.1.2 Sirocco: A File System for Heterogeneous Media


    Sirocco [12] is a file system that is inspired by peer-to-peer systems. It is
    intended for pre-exascale machines and beyond. The core of its design is based
    on a small number of fundamental ideas about how a client and a server should
    behave in a scalable system. These include:'
  merge: -1
  img_proc: true
- pgno: 421
  md: '# Power Consumption 379


    +   - Clients that may autonomously choose which servers receive writes based
    on quality of service.


    +   - Servers that may move and replicate data autonomously to improve fault tolerance.


    +   - Servers that may come and go quickly, due to failure or temporary instantiation.


    +   - Clients that should be cooperative to help enforce consistency.


    In short, Sirocco provides a self-organizing system that allows local decision
    making in clients and servers to yield a self-tuning, reliable file system.


    Sirocco enables self-organization by exposing the characteristics of each server''s
    storage to the storage system. Heterogeneous media is quickly becoming the norm
    in HPC systems, so tiered solutions (including the Burst Buffer) are proposed
    to manage it. Sirocco is implemented as a large virtual cache, with ejections
    targeted from less reliable storage to more reliable storage automatically, without
    global knowledge of tiering. This is enabled by resource discovery, where a storage
    node will seek more reliable nodes as targets for injections. It is adaptive because
    targets are not fixed, and can be eschewed for targets that provide better service
    (if the original target ceases to operate).


    The implication is that Sirocco clients can automatically use faster targets as
    buffers for checkpoints, or even use temporary servers running on compute nodes
    as RAM-backed stores. These ephemeral RAM-backed nodes can be started on demand,
    and relinquished when they finish checkingpoints.


    Sirocco is currently under active development, and is being used as a vehicle
    to investigate several research areas like data location [32] and fault-aware
    message passing [15]. Sirocco is an effort of the Advanced Storage Group (ASG),
    which includes Argonne National Laboratory, Clemson University, the University
    of Alabama at Birmingham, and Texas A&M University.


    # 34.3.2 Guarding against Single-Node Failures and Soft Errors


    In some circumstances, checkpoint I/O consumes a significant proportion of an
    application''s runtime. Oldfield et al. measured compute jobs on HPC platforms
    at 131.072, found that each spent about half of their time checkpointing, with
    optimal checkpoint frequency being about twenty minutes [26]. This is an artifact
    of applications experiencing total failure upon a single node failure, whether
    permanent or transient. If a job can continue after a single node failure, then
    checkpointing can be done less frequently.'
  merge: -1
  img_proc: true
- pgno: 422
  md: '# High Performance Parallel I/O


    Checkpoints, in part, guard against unexpected application failure, which can
    be caused by non-permanent faults (i.e., soft errors). Cosmic-ray-induced neutrons
    are a well-known source of soft errors in memory, having been studied in at least
    one large supercomputer [23]. There are several hardware-based strategies for
    mitigating soft errors in memory, but each has its own trade-offs in terms of
    efficiency, power consumption, and speed [25]. Exascale systems are equipped to
    demonstrate that soft errors will become common, and that designers should help
    mitigate soft errors in software.


    Soft errors do not discriminate, and can manifest in application software or system
    software. Application researchers are actively seeking modifications to their
    algorithms and data structures that allow applications to successfully continue
    in the face of soft errors [8]. System software researchers are surveying operating
    systems for important data structures that require hardening, such that soft errors
    will not cause a node to crash [9].


    Library-based fault tolerance is also an option. Scalablepoint Restart (SCR) is
    an I/O library that provides a range of local checkpoint strategies to applications
    [24]. Its main goal is to enable a node in a job to checkpoint to one or more
    nodes, allowing an recovery from failure of individual nodes in a job. It is designed
    to work with on-node storage, which could be a RAM disk, spinning disk, NVRAM,
    etc.


    Another library-based approach includes rMPI [16]. rMPI uses replicated computations,
    a method of ensuring operation of mission-critical systems. By implementing MPI
    calls to ensure message ordering and state maintenance between replicas, it allows
    an application to transparently benefit from redundant computations. Although
    using rMPI uses twice as many cores as compute ranks, the overhead can be reasonable.
    For very large jobs, the decreased checkpoint and restart activity can yield appreciable
    speed-ups over a non-replicated job running an equal number of nodes, while simultaneously
    reducing potential load on an I/O system.


    # 34.4 Conclusion


    It is widely known that the projected power envelope for an exascale computer
    is extremely limiting. All subsystems are being investigated for potential inefficiencies,
    including storage. This chapter presents the widest survey of storage power use
    in HPC systems, which shows that today''s storage systems are not generally significant
    users of power. However, extrapolating potential disk sizes and storage requirements
    to exascale shows that today''s methods of constructing and using storage will
    be completely inadequate from a power perspective.


    Fortunately, there are several technologies under development that serve to reduce
    the demands on I/O systems for bulk synchronous checkpoints. These'
  merge: -1
  img_proc: true
- pgno: 423
  md: '# Power Consumption 381


    include methods of using fast, off-node storage as temporary buffers that make
    data to disk-based storage, like the Burst Buffer; and reconceptualization of
    storage as a swarm of storage nodes and clients that work in a self-organized
    manner to ensure data safety and performance, embodied by Sirocco. These technologies
    can enable legacy applications to attain high-bandwidth periodic checkpointing
    to the file system with power proportional to today''s systems.


    Other techniques that emphasize client behavior are also available that can reduce
    overall demands on the I/O system. These methods reduce the frequency of checkpointing,
    allowing longer running checkpoints to take proportionally similar amounts of
    time to complete. By making jobs more reliable, and guarding against the most
    common types of faults, defensive I/O load on the system can be dramatically reduced.


    These solutions, applied individually and together, significantly increase the
    capabilities of limited disk-based I/O systems. Bringing these technologies to
    effective use will allow HPC platforms to generate impactful research results
    well within the exascale.


