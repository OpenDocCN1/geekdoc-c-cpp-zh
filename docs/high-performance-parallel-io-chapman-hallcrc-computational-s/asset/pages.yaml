  md: '# High Performance Parallel I/O


    # 4.4.1.2 Tuning


    The initial configuration and tuning of these systems took a significant effort
    to achieve good performance levels. Once the basic hardware was validated to achieve
    its performance, then the system was tested as a whole with GPFS. One of the complications
    was the differing needs of the hardware for best performance. For example, the
    Myrinet or Infiniband networks achieve maximum throughput easily using smaller
    message sizes, such as 64-256 KiB; however the storage arrays deliver better performance
    using larger request sizes such as 4096 or 8192 KiB. On the Blue Gen systems specifically,
    the I/O forwarder must transfer messages in certain sizes, which needs to be tuned
    as well since the I/O forwarder needs to reserve for data transfer. On both systems
