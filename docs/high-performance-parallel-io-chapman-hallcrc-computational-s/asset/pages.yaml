    # 3.1 The Blue Waters Computational and Analysis Subsystems


    The key feature of Blue Waters is the very balanced strategy for the system beginning
    with the 22,640 XE6 compute nodes, 4,224 XK7 compute nodes, 582 Lustre Network
    (or Lnet) I/O routers, and 202 other service nodes [2]. Each XE6 node has two
    AMD Interlag processors,2 fast access to 4 GB of memory per core, and the high-3D
    torus interconnect. The configuration is based upon the tightly coupled Cray XE6/XK7
    system34 system complete with powerful parallel storage and file system capabilities.
    The Cray XE6/XK is a hybrid system featuring AMD G34 Interlag7 processors for
    x86 compute performance and NVIDIA Kepler K20 GPUs balanced by the decision of
    Blue Waters in consultation with the major science teams and an in-depth analysis
    of the known SETs assessing their current and planned experimental and production
    of accelerated computing.5 Of the nodes, 84% are XE6 all-CPU AMD Interlag processors
    nodes, and 16% are the XK7 nodes with one AMD Interlag processor module and one
    NVIDIA Kepler GPU in a single node using the Cray-Designed Gemini router.


    The XE6/XK system uses the AMD Operon Series 6000 model 6276 “Interlagos” in both
    the XE6 compute node and the XK7 accelerator nodes. The Interlagos is a dual-die
    multi-chip node. The Interlagos processor has a peak performance of 156.8 GFLOPS
    per socket at 2.45 GHz. The Interlagos processor can be used as two 4-core modules
    with each core supporting two threads yielding a total of eight results per fused
    multiply-add. Each processor socket has TM HyperTransport links,


