  md: '# PLFS: Software-Defined Storage for HPC


    ![](img/e2df60633eace5d7f248335c7c97063d_213_0.png)


    FIGURE 14.1 (See insert): PLFS shared file mode transforms multiple writes to
    a shared file into streams of data sent to multiple subtiles on the underlying
    storage system(s). Not shown is the internal PLFS metadata used to reconstruct
    the file. [Image courtesy of Jon Bent (EMC)].


    many applications naturally have partitions of a large distributed structure which
    are poorly matched to the block alignment of many storage systems and lose performance
    to various locks and serialization bottlenecks inherent in parallel file systems.


    By decoupling the concurrent writes, PLFS sends data streams to the underlying
    storage systems, which avoids these locks and bottlenecks. The basic mechanism
    is that PLFS first creates a container and then stores all the individual files
    in this container as well as the metadata necessary to reconstruct the local file.
    Functionally, the container is very similar to how inodes are used in almost all
    file systems like the Berkeley Fast File System [7]. When the user requests data
    from the file, PLFS collects the metadata within the container to resolve which
    subtile(s) contain the requested data and then reads from the subtile(s) to return
    the data to the reading application.


    Note that at no point is the application aware of this transformation: all operations
    on the shared file work functionally, exactly the same as if PLFS was not present.
    One concern in PLFS, however, is that the amount of PLFS metadata can grow to
    challenging sizes; this concern is addressed by discovering hidden structure within
    seemingly unstructured I/O [6].'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# 14.2.2 PLFS Flat File Mode


    PLFS flat file mode was added to reduce metadata contention when many processes
    concurrently create files within a single directory. The basic motivation is that
    when multiple processes modify a shared object concurrently, they often incur
    locks and serialization bottlenecks in many storage systems. In the PLFS shared
    file mode, the shared object is a file and the concurrent modifications are writes,
    whereas the PLFS flat file mode is for the case in which the shared object is
    a directory and the concurrent modifications are file creations. As PLFS shared
    file mode creates a virtual container from the set of subdirectories on the underlying
    storage system(s). When a user creates a file, PLFS hashes the filename to determine
    in which subdirectory to store that file. Reads and queries of files share the
    hash function so that they can quickly requested files from the set of subdirectories.
    The PLFS flat file mode will achieve maximum performance improvements when it
    is configured to use multiple storage systems, and therefore metadata servers
    to create its subdirectories.


    In this way, when multiple files are concurrently created with a PLFS directory,
    PLFS spreads the workload across multiple metadata servers. This is an important
    feature of the software-defined storage approach. It is easy for a administrator
    to build multiple storage systems but difficult to allow unmodified applications
    to spread their workload across them. With PLFS, it is simple matter of modifying
    the PLFS configuration file to include all of the available storage systems. PLFS
    flat file mode is described in more detail in Bent et al. [4].


    # 14.2.3 PLFS Small File Mode


    The third mode of PLFS is the small file mode, the architecture of which is shown
    in Figure 14.2. This mode is designed for the workload in which individual processes
    want to create a large number of small files in a short period of time. This workload
    is challenging for storage systems, which must allocate some amount of resource
    for each file. For a stream of many small files, like the PLFS shared file mode,
    creates a PLFS container. However, PLFS small file mode creates a PLFS file container
    for each PLFS directory, whereas the PLFS shared file mode creates a PLFS shared
    file container for each PLFS file.


    When an application creates a set of small files, PLFS small file mode will aggregate
    all of the data for each small file into a single large file stored on the underlying
    storage system. It will also create a metadata file to store the necessary information
    to allow finding small files and their data within the single aggregated file.'
