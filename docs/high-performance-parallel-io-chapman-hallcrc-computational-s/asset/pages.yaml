    that is managed in conjunction with the lock servers. For as long as the locks
    are held by the client, it can cache data, attributes, ACLs, and directory contents.
    In the common case of a single client performing uncorrelated reads or writes
    of a file, only a single-lock RPC is needed for all data access, since the server
    will return a full-object lock on the first enqueue. Similarly, when a client
    holds a directory-update lock, it can cache all of the directory entries locally
    for lookup, also as negative entries for names that do not exist, until the directory
    is revoked.


    Clients aggregate I/O in their local caches to ensure bulk data is strided to
    or from the servers efficiently. On read, the client can detect strided read patterns
    and use this to readahead. Similarly on write, dirty pages are aggregated whenever
    possible. In both cases, many aggregated data RPCs can be kept "on the wire" to
    hide latency and ensure full bandwidth utilization of the underlying network and
    storage hardware and the number of outstanding RPCs can be tuned e.g., to support
    remote mount over wide-area networks. The Lustre also allows them to align their
    aggregated writes to maximize consistency between allocating writes and subsequent
    reads and reduce seeks, and also to align the disk I/O operations with the underlying
    RAID storage chunks.


    In order to manage unwritten data in the clients'' write-back cache, each client
    is given a grant of space from each OST. The grant space is consumed with each
    write request, and refilled with each write subject to availability of space on
    the OST. This ensures that the cached client cannot exceed the available space
    in the file system.'
