    # 13.4 MPI-IO Hints


    MPI-IO hints are a mechanism for users to pass information, such as patterns,
    to the implementation so that it can help optimize file access. This is done by
    setting an MPI_Info object and passing it to the functions MPI_File_open, MPI_File_set_view,
    or MPI_File_set_info. An MPI-IO implementation may choose to ignore all hints,
    and the program will be functionally correct. Some MPI predefined I/O hints are
    cb_buffer_size (size of allowable buffer to be used by collective I/O), cb_nodes
    (maximum number of aggregators), striped_factor (number of file stripes), and
    striped_unit (file stripe size). An implementation may define hints to make use
    of file system specific features. Readers are referred to the ROMIO user guide
    for the full list of available hints [10].


    # 13.5 Conclusions


    This chapter describes several important MPI-IO features to allow users to describe
    the data patterns and the intent of their applications. The MPI-IO functions convey
    such to the implementation so that better I/O strategies can be used to achieve
    high performance for parallel applications. MPI-IO has a building block for several
    high-level I/O libraries, such as Parallel NetCDF (Chapter 15) and HDF5 (Chapter
    16), which are widely used in various scientific communities. There are other
    MPI- features not covered in this chapter, including data consistency control,
    portable data representation, and split collective I/O. For their detailed information
    and learning materials, readers are referred to the MPI-2 Standard [6] and MPI
    tutorial books, such as Using MPI-2 [3].'
