    # 11.5 Data Protection


    # 11.5.1 Power Loss


    A file journal, which stores information about changes to the file system, is
    designed to enable fast, consistent recoveries after system failures or crashes,
    such as power loss. The file system replays the journal entries after a node or
    cluster recovers from a power loss or other outage. Without a journal, a file
    system would need to examine and review every potential change individually after
    a failure (fsck or ckdisk operation); in a large file system, this operation can
    take a long time.


    OneFS is a journaled file system in which each node contains a battery-backed
    NVRAM card used for journaling. The NVRAM battery charge lasts many days without
    requiring a recharge. When a node boots up, it checks its journal and selectively
    replays transactions to disk where the journal system deems it necessary. OneFS
    will mount only if it can guarantee that all transactions not already in the system
    have been recorded. For example, if proper shutdown procedures were not been followed,
    and the NVRAM battery discharged, transactions might have been lost; to prevent
    any potential problems, the node will not mount the file system.


    # 11.5.2 Scalable Rebuild


    OneFS does not rely on hardware RAID for data allocation, or for reconstruction
    of data after failures. Instead OneFS manages of file data directly, and when
    a failure occurs, it rebuilds data in a parallelized fashion. OneFS is able to
    determine which files are affected by a failure in constant time, by reading inode
    linearly, directly off disk. The set of affected files are assigned to a set of
    worker threads that are distributed among the cluster nodes by the job engine.
    The worker nodes repair the files in parallel. This implies that as cluster size
    increases, the time to rebuild from'
