    mapping has made it possible to create new implementations of the mapping. As
    the representation to and from the CGNS data model to its corresponding HDF5 form
    was public, some alternative implementations [8] arise.


    # 16.4.3.2 Applications


    CGNS/HDF5 is used for archival and interoperability in multi-physics simulations
    [9] involving fluid dynamics solvers. A CFD solver is a very compute-intensive
    application. For example, current applications in aerodynamics require a large
    number of points and parameters with a large number of iterations on these sets
    of data. The usual parallel splits the configuration into sets of points, distributes
    these sets onto the processors and exchanges the required information at interfaces.
    The overall simulation is quite synchronous, with many barriers required to coordinate
    sending data from pre-processing stages to the solvers.


    The file-per-processor mapping is usually split into two strategies, shown in
    Figure 16.6. The first strategy is for structured meshes, where the CGNS data
    model defines sets of groups, the application uses one file per processor, and
    there is no concurrent write access between processors. The second strategy is
    for unstructured meshes where a CGNS group is shared by several processors and
    write access can be performed in parallel. Both strategies use more than one CGNS/HDF5
    file, which are gathered into one or more top-level files by means of HDF5 symbolic
    links. With HDF5, the whole simulation file layout can be defined in advance,
    as the symbolic links do not need to have an actual target. This link-based approach
    is preferred for very large results, such as unsteady dynamics that could produce
    hundreds of gigabytes per processor.


    By now, HDF5 is widely used by CGNS pre- and post-processing tools. Most preprocessing
    are running on standalone workstations, where the simulation is submitted to the
    HPC cluster. The generation, modifications, and distribution of the files is performed
    by FORTRAN, C, or Python scripts, all manipulating HDF5 files. The post-processing
    is performed on dedicated workstations using HDF5 as in combination with third-party
    software from various well-established companies.


    The CGNS standard was first designed for archival. Now we see multiphics applications
    using the CGNS standard to define a common interface and data model at the conceptual
    level and HDF5 as the common storage mechanism. Using Hdf5 as the standard storage
    for simulations has helped the CFD community achieve true interoperability in
    the complete simulation workflow, and at the same time opens applications up to
    a wide range of HDF5-based tools, such as shown in Figure 16.7.'
  merge: -1
