  md: '# Integrated Performance Monitoring


    practice the primary source of I/O performance loss. Root causes for this imbalance
    include many-to-few I/O strategies, file system striping, and congestion of I/O
    due to overlapping I/O operations. I/O performance losses, balanced or not, are
    sometimes due to the transfer (buffers) of I/Os being so small that transactional
    overhead are, or due to synchronous locking I/O operations.


    When the I/O load is balanced across tasks, the next question is whether the sustained
    rates are achieving the I/O rates that the storage system is expected to deliver.
    If not, what is the underlying cause of the loss? In some cases the loss is due
    to the strategy, and in other cases is due to resource scheduling or contention
    that lies outside the application''s control. Defensive I/O strategies are thus
    sought thought as absolutely optimal strategies. I/O hangs are a notorious source
    of vexation among HPC enthusiasts and the notions of defense extends to the lower
    ends of performance. Most HPC I/O goes unmonitored and this is a rich area for
    investigation to guide future data science architectures [5].


    There is much to be gained from continued research in this area. As scale architectures
    emerge, the pathways from compute to disk will become more complex as their performance.
    It is interesting to consider architectural simulation in the design and provisioning
    of such systems. A body of existing I/O profiles, one can map these into a performance
    estimate as to what would be proposed on a proposed architecture. To what degree
    can we construct useful models for the design of future I/O systems [3]?


    To make actionable decisions about I/O it is important to build models from profiles
    that are tightly integrated with application performance as it happens. The following
    sections draw from HPC application I/O scenarios observed at NERC IPM.


    # 26.2 Success Stories


