    In addition the processor core is capable of running in a mode that shares the
    floating point between two integer units, which we call integer cores. In this
    mode, the AMD processors include an L1 cache for each integer and an L2 cache
    for each builder core as well as 2 MB L3 caches shared by all the cores of the
    two. The processors also share the DDR3 internal memory controllers, and on HT3
    HyperTransport interface that increases-the injection bandwidth between the interconnect
    network and the compute processor. The XE6 compute nodes consist of two sockets
    with each associated memory and HyperTransport.


    The XK7 compute nodes have an Interlagos socket with the associated memory and
    one NVIDIA Kepler K20X GPU. The Cray XK7 accelerator blade is similar to the Cray
    XE6 compute blade in form factor and pattern of the Gemini network. It differs
    in each of the four compute nodes on the blades of an AMD processor socket and
    a connection for a Kepler chip (NVIDIA K20X). These GPU cards contain the accelerator
    chip and 6 GB of DDR5 memory and connect to the motherboard with a high-reliability
    connector. These cards sit off the motherboard to allow the necessary cooling
    on both sides of the card. The blade will be managed, monitored, powered, and
    cooled within the Cray XE6/XK7 infrastructure. The Blue Waters system consists
    of 288 computational cabinets arranged in 12 rows, with 24 cabinets.


    The Gemini High Speed Network is based on a custom Gemini router that connects
    to XE or XK nodes with the rest of the system. The HSN interconnect topology is
    a 3D torus of dimension $X = 24, Y = 24$, and $Z = 24$ with a total injection
    bandwidth of over 276 TB/s. All torus links run at a minimum bit toggle rate of
    3.125 GHz. Figure 3.1 shows the configuration of the XE6 and XK7 nodes. The resulting
    bi-directional bandwidth in each dimension is listed in the Table 3.1. The peak
    global bandwidth is twice large due to the fact that in all-to-all communication
    patterns, only half of the total traffic crosses the bi-section in a 3D torus
    topology. All I/O requests and traffic go across the interconnect from the compute
    nodes to the Lnet nodes. Key system performance and configuration information
