    # 22.2.4 Aggregation and Subfiling


    There are two levels of data aggregation underneath ADIOS write calls. This is
    intended to make the final data as large as possible when being flushed to disk,
    and as a result, expensive disks can be reduced. At the first level, data are
    aggregated in memory within a single MPI processor among all variables output
    by the adios_write statement, i.e., a write-behind strategy. For the example,
    variable NX, NY and temperature in the adios_write-statement internal buffer,
    the maximum size of which can be configured through the ADIOS XML file, instead
    of being flushed out to disk. This is a well-known technique used by other I/O
    libraries, such as IOBUF and the FUSE file system. Meanwhile, the second level
    of aggregation occurs between a sub-set of processors. This is to further deal
    with the situation that each processor has a relatively small amount of data to
    output (after the first-level aggregation). An good example is combustion S3D
    code [2, 3]. In a typical 96,000-core S3D run on JaguarPF, each processor outputs
    under 2 MB. Clearly, in this case, many small writes to disk hurt I/O performance.
    One can argue that, to make data further larger, using MPI collectives to exchange
    data between processors can be costly. We postulate four reasons in favor of aggregation
    techniques. (1) Interconnect'
  merge: -1
  img_proc: true
- pgno: 306
  md: '# High Performance Parallel I/O


    in the high-end computing systems are becoming faster and faster. For example,
    the latest Cray Gemini interconnect can sustain up to 20 GB/s [1]. (2) The issue
    with doing the MPI collective operation in MPI-IO is not the sheer volume of data
    to exchange. Instead, the dominating factor that slows application performance
    is the frequency of collective operations and possibility of lock contention.
    Earlier work [4] shows that MPLBC is called 314,800 times in the Chimera run,
    which take 25% of the wall clock. (3) The collective operation in ADIOS is done
    in a fully controlled manner. All MPI processors are split into sub-groups and
    aggregation is done within a sub-communicator. Therefore, the interference between
    groups is minimized. Meanwhile, indices are also generated first within a group
    and then sent by all the aggregators to a root processor (e.g., rank 0) to avoid
    global collectives. (4) Most of today''s computing resources such as Jaguar X5
    use multicore CPU, and aggregation among the cores within a single cycle is inexpensive
    as the cost is close to that of the memcpy operation.


    Listing 22.1: Example ADIOS code.


    ```

    adios_open (&adios_handle, "analysis", filename, "w", &

    );

    adadios_write (adios_handle, "NX", &NX);

    adios_write (adios_handle, "NY", &NY);

    adios_write (adios_handle, "temperature", t);

    adios_close (adios_handle);

    ```


    Within a group, an aggregator gathers the buffered PGMs from all its members,
    provided there is sufficient memory on the aggregator processors. Depending on
    the communication pattern, an aggregator can either perform-to-all communication
    (i.e., MPI_Gather()) or brigade-like communication (see Figure 22.1). For the
    former case, all members send data addressed directly to the aggregator processor.
    For the latter case, a member sends data to its upstream processor. As a result,
    when an aggregator writes data from one member, data from another member will
    be closer. Therefore, the communication cost can be minimized. The idea of brigade
    aggregation is to overlap MPI communication with disk I/O and achieve streaming-like
    I/O. Next, each aggregator writes out all data that it receives to a subfile.
    The subfile is striped on a single OST (Object Storage Target) to minimize the
    potential lock contention between aggregators. A global metadata file is also
    written out from $P_0$ to make reading data subfiles possible.


    One challenge of one per file (N-N) is the overwhelming data pressure resulting
    from the simultaneous creation of thousands of files. And one file (N-1) pattern
    often results in unaligned access across file system boundaries, which in turn
    causes lock contention among processors. The aggregation scheme offers a flexible
    N-M pattern that overcomes the drawbacks from both N-N and N-1 by a reduced number
    of files and larger writes.'
  merge: -1
  img_proc: true
