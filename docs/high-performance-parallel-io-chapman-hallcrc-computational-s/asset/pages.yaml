    # 11.2.1 Isilon Node


    OneFS works exclusively with the Isilon scale-out NAS nodes, referred to as a
    "cluster". A single Isilon cluster consists of multiple "nodes", which are constructed
    as rack-mountable enterprise appliances containing memory: CPU, networking, non-volatile
    random-access memory (NVRAM), low-latency Infiniband interconnects, disk controllers,
    and storage media. Each node in the distributed cluster thus has compute or processing
    capabilities, as well as storage or capacity capabilities.


    An Isilon cluster starts with as few as three nodes and can scale to 144 nodes.
    There are many types of nodes, all of which can be incorporated into a single
    cluster where different nodes provide different ratios of capacity to throughput
    and I/O operations per second (IOPS).


    OneFS has no built-in limit in terms of the number of nodes that can be included
    in a single system. Each node added to a cluster increases aggregate data, cache,
    CPU, and network capacity. OneFS leverages each of the hardware building blocks,
    so that the whole becomes greater than the sum of the parts. The RAM is grouped
    together into a single coherent cache, allowing I/O on any part of the cluster
    to fetch from data cached anywhere. NVRAM is grouped together for high-throughput
    writes that are safe across power failures. Spindles and CPU are combined to increase
    throughput, capacity, and IOPS as the cluster grows, for access to one file or
    for multiple files. A cluster''s storage capacity can range from a minimum of
