- pgno: 377
  md: '# Storage Models: Past, Present, and Future


    # 30.2 The Current HPC Storage Model


    Considering the high cost (during development as well as at runtime) of implementing
    full POSIX I/O compliance in a distributed environment, it should not come as
    a surprise that some file systems intend instead be mostly compliant. For example,
    the NFS client emulate the common unlink-after-open approach of creating temporary
    files by renaming the file with the goal of later removing those files (something
    which not always succeeds). Attribute consistency is another area where NFS is
    not fully compliant. In the default mode, client-side caching is used to improve
    performance and reduce server load. However, this means that full POSIX attribute
    consistency is not provided. In addition, there is no guaranteed, portable method
    to enforce consistency. Some of these issues are being addressed in newer versions
    (v4) of the NFS protocol.


    In many cases, the POSIX semantics are unnecessarily strict, and consequently
    most applications continue to functioning correctly on these mostly POSIX-compliant
    file systems. Thus the current HPC storage model aims to work around the POSIX
    shortcomings by adjusting or breaking POSIX where necessary and leveraging new
    software to optimize I/O before it hits the POSIX interface. Simultaneouslyaneously,
    new concepts are being deployed below the POSIX API that provide for larger benefits
    to HPC storage.


    # 30.2.1 The Current HPC I/O Extensions


    POSIX HPC I/O extensions [9] were designed to improve performance of POSIX I/O
    in large-scale HPC environments. Software running on these systems differs from
    most other software that on HPC systems, many processes, distributed over many
    nodes, work collectively on a problem. Specifically, focusing on I/O operations,
    this means many processes on many nodes are opening the same file(s) concurrently.
    Since HPC applications tend to be more synchronized as well, often of all the
    operations performed on these files (such as open) are issued within a short time
    interval, leading to very high and bursty metadata workloads on the file system.


    Since POSIX file handles are only valid on the local node, in a distributed environment—despite
    accessing the same file—node is required to open the file. This causes each individual
    node to traverse the directory hierarchy to locate the requested file, causing
    high overhead at the (remote) file system. The POSIX HPC extensions seek to reduce
    this load by allowing a single node to open the file and then export some representation
    of the resulting file handle (for example, containing a direct pointer to the
    enclosing directory) to other nodes (open function), which then convert the exported
    handle directly to a file handle (sut function) without performing a full open
    call.'
  merge: -1
  img_proc: true
- pgno: 378
  md: '336


    High Performance Parallel I/O


    Increasing file offset


    ![](img/e2df60633eace5d7f248335c7c97063d_378_0.png)


    (a) Decomposed mesh


    (b) File mapping


    # FIGURE 30.1 (See color insert): Domain decomposition resulting in highly non-contiguous
    access pattern. Color indicates node access.


    HPC applications also tend to differ in how files are accessed. Often, a computational
    problem is partitioned between a set of nodes working on a single problem. For
    example, in the case of a weather simulation application, the three-dimensional
    region for which the weather is computed is sliced into multiple pieces and distributed
    among the nodes. When a part of a higher-dimensional region maps to a single-dimensional
    file (when each node writes its portion of the simulated region to disk) a highly
    non-contiguous access pattern emerges. This is demonstrated in Figure 30.1, which
    shows a detailed 3D mesh (a), where color indicates the partitioning across nodes,
    and the resulting mapping to a one-dimensional file (b).


    Unfortunately, the standard POSIX functions do not offer a way of expressing an
    I/O operation that is non-contiguous (the non-contiguous in memory is supported
    through the reread family of functions), forcing the application programmer to
    issue many small contiguous I/O requests instead, leading to severely reduced
    I/O performance. The read and write functions, proposed by the POSIX HPC extensions,
    aim resolve this by offering functionality to describe an I/O transfer that can
    be non-contiguous in memory as well in the file.


    The POSIX HPC I/O extensions also enable relaxing the strict POSIX I/O consistency
    semantics. For example, a new flag is proposed, 0.LAZY. The effect of this flag
    is to reduce the consistency scope of data and metadata to the scope of the process
    or local node, as opposed to all nodes mounting the same file system. When system-wide
    consistency is required, an application can call lazyio.propagate to propagate
    modifications to other processes or node, and lazyio.synchronize to invalidate
    any locally cached data or metadata.'
  merge: -1
  img_proc: true
- pgno: 379
  md: '# Storage Models: Past, Present, and Future


    Other extensions include functionality to retrieve both directory contents and
    associated file metadata, as well as the ability to retrieve only a subset of
    the file metadata. The latter avoids forcing the file system to compute updated
    values for all file attributes, some of which (e.g., file size) can be costly
    to obtain.


    Adoption and support for the POSIX HPC extensions has been minimal. However, a
    number of calls to the open and sutoc functions proposed in the POSIX I/O extensions
    have made it into the Linux kernel: name.to.handle.at and open.by.handle.at. These
    functions were added in May 2001 in Linux kernel 2.6.39.


    # 30.2.2 MPI-IO


    The MPI standard is widely used to program HPC systems. In version 2 of this standard,
    support for I/O was added. Being designed for distributed computing environments,
    MPI-IO provides a more suitable API for HPC applications. For example, non-contiguous
    accesses are directly supported (through the use of MPI datatypes), and default
    data consistency is more relaxed, and formally defined. MPI-IO operations, enabling
    many optimizations such as group open, offers similar functionality to the open
    POSIX HPC extension call.


    However, since MPI-IO is frequently built on top of POSIX I/O functionality, many
    of the issues described in Section 30.1 arise. Whenever possible, MPI-IO uses
    file system calls (for example, the use of ioctl) to work around some of the POSIX
    limitations, but these calls are non-standard and often vary between versions
    of the same file system. Widespread adoption of the POSIX HPC extensions would
    provide MPI-IO with a portable method to obtain the same effect. When specialized
    support is not available for the underlying file system, MPI-IO is limited to
    POSIX functionality, including the inability to communicate relaxed data consistency
    requirements. Consequently, MPI-IO performance is highly variable from system
    to system, causing some application and library developers to avoid MPI-IO all
    together.


    # 30.2.3 Object Storage Model


    In 1998, Gibson et al. [10] proposed a new storage interface, called Network Attached
    Secure Disk (NASD), to replace the low-level sector access by an object-based
    API allowing a client to access an object (typically by numerical identifier)
    and offset within that object, while the device itself controls the mapping of
    the object data to the disk platters. The NASD work influenced the design of the
    ANSI T10 Object-based Storage Device (OSD) standard. This work does not aim to
    replace the POSIX-I/O functionality; instead it is intended to offer a basic building
    block on which other, high-level I/O functionality can be built. In a sense, these
    form a replacement for'
