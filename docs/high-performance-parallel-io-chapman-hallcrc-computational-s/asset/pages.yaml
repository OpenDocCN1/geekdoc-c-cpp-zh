    of OneFS is also completely transparent to the end user and can be adjusted to
    minimize impact on high performance workloads. This capability allows OneFS to
    scale transparently, on-the-fly, from 18 TB to 20.7 PB with no added management
    time for the administrator, nor increased complexity within the storage system.


    A large-scale storage system must provide the performance required for a variety
    of workflows, whether they are sequential, concurrent, or random. Different workflows
    will exist between applications and individual applications. OneFS provides for
