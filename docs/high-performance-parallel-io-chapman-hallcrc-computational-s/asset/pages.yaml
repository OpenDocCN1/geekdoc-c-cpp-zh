- pgno: 162
  md: '# 10.1 Motivation


    OrangeFS is the next evolution of the Parallel Virtual File System (PVFS), an
    open-source high performance cluster file system. OrangeFS delivers high performance
    access for a wide array of applications ranging from engineering/scientific to
    advanced computing and emerging “big data” applications. The goals of OrangeFS
    are:


    +   - Run at user level


    +   - Allow parallel access to data and metadata


    +   - Minimize bottlenecks that limit parallelism


    +   - Provide a diverse set of client interfaces


    OrangeFS can run entirely at user level, or a small kernel module can be used
    to mount it like any other file system under Linux, Windows, and OSX for the use
    of standard programs and utilities. Data and metadata are transparent distributed
    across multiple servers and can be accessed in parallel by multiple clients. OrangeFS
    relaxes POSIX consistency semantics when necessary to eliminate bottlenecks while
    offering a global POSIX namespace. Client interfaces include mounting via the
    OS kernel, MPI-IO, Hadoop JNI Client, and WebDav support.


    A large community contributes to ongoing OrangeFS development, including a staff
    of professional developers who support OrangeFS, improve stability and functionality
    for the base system, and develop new features and interfaces. Professional support,
    development, and documentation make OrangeFS a superior performing open-source
    file system for a growing range of scientific, advanced computing, and “big data”
    applications.


    # 10.1.1 PVFS


    PVFS was developed in 1993 for Parallel Virtual Machine (PVM) as part of a NASA
    grant. In 1994, the software was rewritten to use TCP/IP, targeted for a cluster
    of Digital Equipment Corp. Alpha workstations networked using switched FDDI, PVFS
    striped data across multiple servers and allowed I/O requests on a file view that
    described a strided access pattern. Striping and file view were independent of
    common record size.


    PVFS [4] was ported to Linux and featured on the first Beow computer at Goddard
    Space Flight Center [3]. In 1997 at a cluster meeting in Pasadena, California,
    the developing group agreed that PVFS should be released as an open-source package
    [5].'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# OrangeFS


    # 10.1.2 PVFS2


    Development of PVFS2 began in 1999 and was completed by a team from Clemson University,
    ANL, and Ohio Supercomputer Center in 2003. The new design featured object servers,
    distributed metadata, views based on MPI, support for multiple network types,
    and a software architecture designed for easy experimentation and extensibility.


    # 10.1.3 OrangeFS


    OrangeFS builds on the solid PVFS2 modular foundation and includes advanced features
    like distributed directories and encryption-based security. Enhancements such
    as self-healing, fault acceptance, and redundancy capabilities will be part of
    v3. In 2011, Omnibond began offering commercial-grade support for OrangeFS and
    collaborates continuously with the community on work toward v3.


    # 10.2 Design and Architecture


    # 10.2.1 Overview


    OrangeFS is designed around an object-server. The server responds to requests
    that operate on objects known as “data-spaces.” Collections of these objects are
    used to implement files, directories, and other file system structures by storing
    the data and metadata and provide access to these components. A client interface
    library works with the server to translate file system operations into the corresponding
    object manipulations. User interfaces further map file system operations into
    familiar program APIs. A central design principle of OrangeFS is its management
    of asynchronous operations. The major internal interfaces are all non-blocking.
    For example, network interaction, rather than blocking `send` and `receive` operations,
    has non-blocking `post_send` and `post_receive` operations and `test` or `wait`
    to complete the posted operations. This structure is reflected throughout the
    code, particularly in the lower I/O layers (BMI and Trove). OrangeFS servers do
    not share any state with other or if a server crashes, another can be easily restarted
    in its place. Updates are performed without using locks. The common interface
    for all file system access is the system interface, which is designed around the
    Linux virtual file system (VFS) and other Unix-based operating systems and resembles
    the request protocol of NFS. Figure 10.1 shows the architecture of the OrangeFS
    server and client library (libpvfs2), mapping the system interface to the low-level
    storage cells (Trove layer). The various layers, their function, responsibility,
    and interaction are described below.'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# High Performance Parallel I/O


    # Client Server


    ![](img/e2df60633eace5d7f248335c7c97063d_164_0.png)


    Figure 10.1: OrangeFS architecture. The client on the left translates I/O calls
    into requests sent on the network to the server, which carries out the requests
    using Trove and sends a response back to the client.


    # 10.2.2 OrangeFS Request Protocol


    Everything in OrangeFS is based on a set of requests and responses between the
    OrangeFS client and server. These are grouped into strict-response pairs, and
    the servers do not maintain state from one request to another. The requests are
    based on the system interface. Example requests include:


    +   - create and remove

    - lookup

    - getattr and setattr

    - io and smallio


    These calls allow the client to manage and access objects on the server to implement
    file structures. Most of the code in the implementation is organized around the
    requests and responses for these operations.


    # 10.2.3 File Structure Representation


    Files in OrangeFS are represented by two or more objects stored on the servers.
    One object is known as the *myfile*, where most of the file''s-data is stored.
    (Although this sounds like a distinct file, it is just a type of object.) This
    includes traditional metadata such as owner, permissions, and user attributes,
    as well as OrangeFS specific metadata, such as the distribution method and list
    of data objects. In addition, one or more *dataFile* objects'
  merge: -1
  img_proc: true
- pgno: 165
  md: '# OrangeFS


    contain the actual content. For small files, this may be a single datafile, and
    for larger files this may be as many as desired, up to the number of file servers
    in the system. The metadata contains a list of the datafiles for the file and
    a distribution method used to map logical file data to the datafiles. Directories
    have a similar structure with one detafile, and one or more dirdatafiles contain
    directory entries (drents) with references to the metadata of each file in the
    directory. An extensible hashing scheme is used to locate dataments among the
    datafiles. OrangeFS uses a database to hold attributes, leaving the management
    of byystreams (the storage component of a datafile) to each node''s local file
    system. After accessing the metadata server once for a file''s location, OrangeFS
    client can thereafter interface directly with the data servers, eliminating a
    bottleneck.


    # 10.2.3.1 Trove


    Servers in the file system operate on objects through Trove. Trove is a software
    abstraction layer that implements datafiles (objects), provides a non-blocking
    interface to these objects, and serves as a means to manage multiple implementations
    of itself (optimized for different environments). Each Trove object has its unique
    handle, a byystream, and a set of key-value pairs. Every object within a file
    system can be located using its handle store file data. Byystreams are sequences
    of bytes with an arbitrary length that generally store file data. Key-value pairs
    allow data to be stored and retrieved using other metadata. Objects serve different
    purposes in the file system and may utilize the byystream, key-value pairs, or
    both, as needed. Trove has a range of methods for accessing the different parts
    of an object. methods, but currently, all of them implement byystreams in a local
    file system (ext3 [9], xfs [10], zfs [8], etc.) and key-value pairs in a key value
    store (i.e., Berkeley DB [2]). Different implementations vary in how they manage
    concurrency and how they interact with storage. For example, the DirectIO method
    is optimized for servers that have large commercial RAID backends.


    # 10.2.4 Bulk Messaging Interface


    Both client and server communicate with each other over a local-area network.
    OrangeFS provides a bulk messaging interface (BMI) as a layer that provides a
    common interface for many different network fabrics and uses the post/test non-blocking
    model to allow the server to manage concurrency. Like Trove, BMI defines a common
    interface and an internal set of methods that can be implemented by many different
    network subscribers. To date there are BMI methods for TCP/IP, MX (Myinet), IB
    (Infiniband), portals, and others. For those networks that provide a zero-copy
    interface, BMI allows OrangeFS to bypass kernel interaction where possible.'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# High Performance Parallel I/O


    # 10.2.5 Flows


    Flow is an important I/O mechanism that combines Trove and BMI for transporting
    large amounts of data from disk (via Trove) across the network (via BMI) to the
    client''s memory (via versa). Flows work like Direct Memory Access (DMA), so client
    and server can start a complex transfer and then allow it to complete. The alternative
    is to repeatedly interact with higher-layer code to start and complete each part
    of the transfer, which involves considerably more latency. Flows also use a protocol
    based on MPI''s datatypes to implement non-contiguous data access on the server
    without constructing a distinct request for each part of the transfer. This involves
    using the file''s distribution as well as the request description to manage data
    flows from each server to the client efficiently.


    # 10.2.6 Job Layer


    Each invocation of BMI, Trove, or the flow subsystem is considered a job. The
    job layer manages concurrent tasks and interfaces to the high-level code implemented
    in the state machines. The basic workflow involves a state machine running until
    it issues a job (asynchronously), at which point other state machines can run
    until the job completes and restarts the state machine. The code that implements
    facilitates this interaction is the job layer.


    # 10.2.7 Request State Machines


    Both the server and the client library utilize state machines to implement the
    complex set of steps needed to start, complete, and finish a request/response
    between the client and server. On the server, whenever a request is received,
    its opcode is used to map the receiving state to the correct state machine for
    that. Thus there is generally one state machine per request on the server. On
    the client, when an application calls a system interface function, it creates
    a state machine, which in its course will create one or more requests and then
    wait for the responses. Thus there is one state machine per system interface call.
    On each end there be a few additional state management functions. A state machine
    is a collection of C-language functions, tied together by a set of data structures,
    that allows a program to execute one function at a time and move on to the next
    depending on the return value of the function. A simple language is used to implement
    the state transition code. Multiple state machines can be executing concurrently,
    and the program can move back and forth between them in a manner similar to coroutines.
    Each state potentially issues an asynchronous operation via the job layer, and
    it will not execute until that task has returned. In this way, the code cleanly
    handles large amounts'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# OrangeFS 125


    of without manual intervention. This feature makes it very easy for users to modify
    the file system, even when adding new requests and developing new optimizations
    and interfaces, without needing to understand all of the operational details.
    Many features in the current code were developed for this level of usability.
    For example, large data transfers involve setting up flow—a fairly complex process.
    Very small reads and writes could be performed without a flow—simply including
    them in the request or response. Thus, a new request, SMALLIO, was developed to
    take advantage of this optimization. State machines are also important for maintenance
    and debugging. In many cases, problems can be found and fixed without debugging
    more than a small fraction of the code.


    # 10.2.8 Distributed File Metadata


    OrangeFS differs from many file systems in it can distribute file metadata among
    multiple servers. Metadata for each file will be stored on a single server (often
    referred to as "the" metadata server, only with respect to a given file). The
    metadata for all files and directories is distributed among a designated set of
    servers using a random variable to select the metadata each time a file is created.
    The configuration file allows as few as one server to be used for metadata, or
    as many as all of the servers. Metadata servers can also be data servers, or on
    the other hand, be used to store only metadata. The best configuration depends
    on the situation. When there are large numbers of users accessing a large number
    of servers, more metadata servers provide more parallelism. On the other hand,
    when servers are doing both data and metadata service, there is the potential
    for interference. In a situation where a few users are working with very large
    files, a single dedicated metadata server may be better. The cost of implementing
    the file server will also affect how they are configured. OrangeFS provides as
    many options as possible.


    # 10.2.9 Distributed Directory Entry Metadata


    One of the most recent additions in OrangeFS v2.9 is distributed directories.
    In earlier versions, each directory is implemented as a single object that holds
    all entries on the same server as the metadata server. Newer applications involve
    large numbers of processes that access an extremely large number of files. In
    this case, providing parallelism at the directory level allows more tasks to look
    up files at the same time. This is implemented by having multiple objects on different
    servers hold the directory entries. The various entries are assigned to one dirdatafile
    or another. This is further optimized by using extensible hashing based on Giga+
    [6], which allows small directories to have just one dirdatafile and add more
    dirdatafiles (and more parallelism) as the number of items in the directory grows.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# 10.2.10 Capability-Based Security


    OrangeFS 2.9 and later provide three modes of system-wide security: default, key-based,
    and certificate-based. All modes use standard file ownership and permissions to
    control access to OrangeFS server and directories.


    +   - Default Security. This was the sole security mode used in OrangeFS prior
    to v2.9. While it enforces standard file ownership and permissions, it was unable
    to prevent a number of simple attacks as it relied on the client library to provide
    the correct uid. It was also unable to prevent processes from snooping the network
    to acquire object handles which could be used to access data, circumventing the
    permission checks. The two following security modes were developed to provide
    much more robust protection.


    +   - Key-based Security. In key-based security mode, OrangeFS uses public cryptography
    to authenticate client systems. Each OrangeFS server and client has a key pair
    (a public and a private key that are cryptographically related). A file used by
    the servers contains keys for all servers and clients. Each server has its own
    private key which is kept secret. All keys and the keystore must be created together,
    and then copied to their appropriate locations. The keys and keystore are created
    in a temporary folder on the build system during the OrangeFS installation. When
    a client sends a request to the server, it submits a credential object signed
    by its private key. The server verifies the signature using the client''s known
    public key.


    +   - Certificate-Based Security with LDAP. In certificate-based security mode,
    all servers share a common CA (certificate authority) certificate with which all
    other certificates are associated. Figure 10.2 outlines the basic function of
    certificate-based security mode. Each OrangeFS user is assigned a unique certificate
    with an associated private key. The certificate is signed by the CA certificate
    and stored in the user''s home directory. The subject of the user certificate
    is mapped to a Linux uid or gid by the server, using an LDAP (Lightweight Directory
