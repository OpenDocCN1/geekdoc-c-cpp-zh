    At NERSC, IOR benchmark is used for procuring and testing new systems, as well
    as measuring the performance of the file system over the lifetime of a system.
    A number of different IOR tests are used to gauge the performance and health of
    the file system. Tests include block I/O, where I/O transaction size (the amount
    of data transferred to disk at a given time) is significantly less than the lock
    size on the file system. This measures the file system''s capabilities aggregating
    small transactions, as well as measuring lock contention overhead. The small I/O
    tests are performed with different I/O APIs, namely POSIX file-per-processor I/O,
    in addition to MPI-IO. Running the same test, but only altering the I/O API allows
    overhead over MPI-IO. These same tests are performed using large block I/O where
    the I/O transaction size is equal to or greater than the lock size of the file
    system, typically 1–4 MB.


