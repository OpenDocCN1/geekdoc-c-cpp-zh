    # 9.2.4 Advanced Data Management


    GPFS supports a wide range of standard and advanced file system features; three
    of these are described in more detail below. Other notable features include control
    lists; extended attributes; immutability and append-only restrictions; quotas;
    snapshots of all or part of the file system, including individual files (clones);
    defragmentation; rebalancing; and online reconfiguration.


    # 9.2.4.1 GPFS Native RAID


    In addition to support traditional RAID controllers, GPFS offers an advanced RAID
    implementation integrated into the NSD server called GPFS Native RAID (GNR) [7,
    8]. Using a conventional, dual-ported disk enclosure with disks in a JBOD (or
    "just a bunch of disks") configuration, GNR implements sophisticated data placement
    and error correction algorithms to deliver high levels of storage reliability,
    availability, and performance. GNR offers a variety of data protection techniques
    ranging from simple replication to three fault-tolerant Reed-Solomon codes. It
    clusters data, parity and space across many numbers of disks to speed rebuild
    times and minimize impact on the foreground workload during rebuild. Write version
    number tracking and end-to-end checksums allow it to detect and recover from silent
    disk errors, such as dropped writes or off-track writes, as well as network transport
    errors. A background scrubbing process verifies data consistency and checksums
    to detect and fix disk corruption or latent sector errors before additional errors
    render them uncorrectable. GNR can also exploit NVRAM and twin-tailed SSD as a
    multi-level fast cache for its internal metadata updates and to speed up small
    writes.


    # 9.2.4.2 Information Lifecycle Management


    Applications have diverse reliability and performance demands of the datasets
    they access, and the storage requirements for a particular piece of data frequently
    changes over the lifetime of the data. To accommodate such applications efficiently
    and economically, GPFS supports policy-driven automated storage management through
    storage pools, filesets and user-defined policies that match data to its most
    appropriate and cost-effective type of storage [8].


    Storage pools allow partitioning a file system into collections of storage devices
    with similar properties that are managed together as a group. In addition to the
    system pool, which contains all metadata and possibly some of its data, a file
    system may have one or more data pools, which store file data'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# GPFS 115


    as specified by user-defined policy rules. External pools allow the policy-driven
    migration of rarely accessed data to archival storage.


    Filesets provide a way to partition the file system namespace to allow administrative
    operations at a finer granularity than that of the entire file system. For example,
    GPFS allows defining user and group quotas separately for each fileset; it creates
    snapshots of individual filesets instead of a whole system, and it also places
    limits on the amount of disk space occupied by files in each fileset. Filesets
    also provide a convenient way to refer to a collection of files in policy rules.


    The Information Lifecycle Management (ILM) policy language supports SQL-like syntax
    for files based on file attributes, such as its name, owner, size, and time stamps,
    as well as custom attributes set by the user. GPFS distinguishes between placement
    policies, which are evaluated at file creation time and determine initial file
    placement and replication attributes of a file; and management policies, which
    are evaluated periodically or during their lifecycle. A policy may change file
    replication; moves files to another storage pool; delete files; or invoke an arbitrary,
    user-specified command on the selected list of files. Data migrated to external
    storage either via policy or a traditional external storage manager is recalled
    on demand using the standard Data Management API (DMAPI) [9].


    # 9.2.4.3 Wide-Area Caching and Replication


    Although it is possible to configure a GPFS cluster to span data center boundaries
    or use cross-cluster to share data between clusters in different data centers,
    GPFS configurations work best over dedicated, highbandwidth, low-latency connections,
    typically within a data center. Active file management (AFM) is a scalable, high
    performance caching integrated into GPFS that makes it possible to share data
    effectively across geographically distributed sites using networks with fluctuating
    latencies and occasional outages [8, 4].


    Data that reside in one cluster are cached on disk in one or more local clusters.
    Once cached, data from a remote cluster can be accessed with the same parallel
    I/O performance as local data and remain available during network operations (disconnected
    operation). Changes are written to the local disk first then Customizable propagation
    delays and rules for resolving conflicting updates in different clusters provide
    an eventual consistency model across clusters. Thus, AFM trades POSIX consistency
    across clusters for high performance access to remote data over unreliable networks.


    To make optimum use of available network bandwidth, data may be transferred in
    parallel between multiple nodes and over multiple connections between clusters.
    For its data transport protocol, AFM can use the NSD and NFS protocols, allowing
    access to data that resides in both GPFS and non-GPFS file systems.'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# High Performance Parallel I/O


    AFM has several data management features, such as pre-population of cache datasets
    prior to application execution. Further, consistency points across clusters can
    be taken through a feature called peer snapshots, which makes it possible to use
    AFM as an asynchronous replication engine for disaster recovery purposes.


    # 9.3 Deployment and Usage


    GPFS is deployed in thousands of data centers on hundreds of thousands of nodes.
    The largest installations contain thousands of nodes in up to sixty GPFS clients
    and store petabytes of data, with many connected to an online tape system with
    even greater capacity. Some of these systems transfer data at more than 400 GB/s
    and contain close to a billion files. Further, GPFS is the key storage technology
    in several IBM products, including IBM Scale Out Network Attached Storage (SONAS),
    DB2 Pulse, and IBM Linear Tape File System Enterprise (LTFS-EE).


    A typical HPC GPFS installation uses the NSD server, which allows GPFS to scale
    beyond direct storage limitations and offer greater flexibility in architecture.
    Existing clusters use 1 or 10 GigE networks between GPFS clients and NSD servers,
    but most clusters are deploying InfiniBand for reduced latency and higher throughput.
    With InfiniBand, GPFS clients utilize direct memory access (RDMA) to communicate
    with the NSD servers and the native InfiniBand protocol for inter-cluster communication.
    In large deployments, which typically have many more GPFS clients than NSD servers,
    it is common to create a separate cluster of the NSD servers and one or more GPFS
    client clusters that use cross-cluster mounts to access data in the storage cluster.
    This configuration simplifies cluster management by allowing for the separate
    administration of storage and compute clusters and fine-grained access control
    across datasets.


    While GPFS AFM was originally designed to facilitate wide-area caching, users
    have found new and unexpected use cases. These include scale-out application access
    to legacy NAS devices, asynchronous replication of data for business continuity
    in case of a site failure, and construction of a global namespace among GPFS clusters
    in one or more data centers, providing global access to data at local network
    speeds.


    GNR was first deployed on the IBM Power 775 server. Increasingly, more GNR deployments
    are appearing with IBM System x GPFS Storage Server (GSS), which is the first
    appliance that is designed specifically for GPFS [3].'
  merge: -1
  img_proc: true
- pgno: 159
  md: '# 9.3.1 Usage Examples


    Two iconic examples of the many scientific and commercial application domains
    in which GPFS is used include weather modeling and digital media.


    GPFS has a long history of working with the weather forecasting community around
    the world. Currently their performance requirements are typically not as extreme
    as some HPC workloads, but their availability requirements are much higher—some
    systems are designed to not miss a forecast for decades. To ensure applications
    can always retrieve and store data, this requirement demands not just a stable
    file system code base, but the ability to seamlessly recover from failures and
    the ability to incrementally compute power and storage capacity over time.


    Media workloads have a lot in common with HPC workloads. High bandwidth requirements
    are combined with a rich, real-time, and heterogeneous workflow. One single such
    as commercial or film post-processing, consists of numerous teams, each working
    on different platforms and with different data requirements, to generate and share
    data. Furthermore, digital media is pushing the boundaries of modern data management
    as frame resolution, depth and frame rate continue to increase.


    In many GPFS deployments, a single file system is enabled by applications running
    on Linux, Windows, and Mac OSX platforms from both Fibre Channel and Ethernet
    networks. Linux and Windows clients use the native GPFS client for high-bandwidth
    applications, and NFS/SMB for lower bandwidth applications. OS clients use NFS
    to access file data through GPFS CNFS servers. Users make extensive use of filesets
    and ILM policies to scope projects and dynamically manage data placement in a
    tiered storage system.


    # 9.4 Conclusion


    For 15 years, GPFS has continued to grow and adapt to new application domains
    and cluster architectures. For most applications, the scale-out and distributed
    design allows GPFS to offer POSIX semantics with minimal, if any overhead. Further,
    GPFS has proven its ability to adapt to emerging new features such as policy-based
    management, disaster recovery support, data tiering, global data caching, and
    much more.


    There are many ongoing challenges—adapting to new workloads, meeting ever-increasing
    performance requirements, and keeping up with emerging network and storage technologies
    remains a continuous challenge with every new GPFS release. Simplifying the manifold
    complexity of GPFS''s rich set of features, many of which are targeted at a specific
    application domain, represents an opportunity for improvement. One goal is for
    GPFS to become a more dynamic, self-configuring, and self-tuning system'
  merge: -1
  img_proc: true
