    fttruncate optimization removed a POSIX ftruncate call from the HDF code, which
    caused negligible problems at smaller concurrencies but quickly became a bottleneck
    in the neighborhood of 1024 tasks. In general, the nature of the optimizations
    is to re-organize the I/O into forms that match the file system''s optimal block
    size and to align file offsets along those blocks.


    # 26.2.2 MADBENCH and File System Health


    I/O performance is a characteristic of applications and on which the applications
    run. In some cases, “out” performance is not a specific concern of the application
    performance but instead at the file system of the HPC system level. In March of
    2009 reports of file system performance on Franklin (a Cray XT4 at NERSC) were
    investigated using IPM. This was not a controlled experiment but I/O performance
    were measured as steps taken to improve the I/O rates by adaptation of the file
    system layout (our OSS I/O nodes) and upgrades to the file software versions.
    Figure 26.6 looks inside the I/O performance before and after changes and shows
    the improvement in particular in I/O read rates in the out-of-core MADBENCH solver
    code. In this, monitoring I/O does not fully explain the cause of performance
    loss but does point to the source of performance loss in application (the read
    step) and also improves confidence in understanding the impact of steps to improve
    it.


    There is a great deal to learn from the statistical properties of I/O transaction
    times. Viewing the file system as a black box, one can develop strategies around
    concurrency and I/O middleware solely on the basis of the shifts in performance.
    A detailed mechanistic understanding of the file system is also a useful approach
    to engineering better I/O performance, but we'
