    # 11.3 Network


    There are two types of networks associated with a cluster: internal and external.


    # 11.3.1 Back-End Network


    All intra-node communication in a cluster is performed using a propriety, unicast
    (node-to-node) protocol. Communication occurs using an extremely fast low-latency,
    Infiniband network. This back-end network, which is configured with redundant
    switches for high availability, acts as the backplane for the cluster, enabling
    each node to act as a contributor in the cluster and isolating node-to-node communication
    to a private, high-speed, low-latency network. This back-end network utilizes
    IP over Infiniband (also called IPolB or IP over IB) for node-to-node communication.


    # 11.3.2 Front-End Network


    Clients connect to the cluster using Ethernet connections (1 GigE or 10 GigE)
    that are available on all nodes. Because each node provides its Ethernet ports,
    the amount of network bandwidth available to the cluster scales linearly with
    performance and capacity. The Isilon cluster supports standard network communication
    protocols to a customer network, including NFS, CIFS, HTTP, iSCSI, and FTP.'
