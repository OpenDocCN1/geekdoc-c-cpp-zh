    \ 236\n\n# 19.1 Abstract\n\nAs magnetic field lines break apart and reconnect,\
    \ collisionless magnetic\nreconnection releases an explosive amount of energy.\
    \ Such a reconnection plays\nan important role in a variety of astrophysical applications\
