    Glimpse (trylock) requests and associated lock callbacks were added to provide
    a means of taking a transient snapshot of the object state (i.e., fetching the
    LV) if it is currently locked by another client without forcing lock revocation.
    If the lock has not been used by the holder it will be scheduled for cancellation,
    and if the resource has no users, the lock is granted and returned immediately.


    Inode Bit (IBITS) locks were added to allow a single resource to have multiple
    attributes for the same lock. This allows finer-grained locking without increasing
    DLM RPC traffic. The attribute bits may be enqueued together or separately, though
    typically they are granted in a single lock for efficiency. Only in the face of
    contention are the lock bits granted separately.


    The DL is also used for locking the file system configuration data, block and
    inode quotas, as well as POSIX locking of files applications.


    # 8.2.4 Back-end Storage


    The Lustre OSD is a Lustre-specific abstraction that provides object storage using
    different types of persistent storage. The OSD has exclusive control over its
    underlying storage and handles all allocation and block data for it. This aids
    scalability by containing and distributing this overhead across the Lustre servers
    and provides a layer of security against malicious or badly behaving clients connecting
    a shared-disk file system. Current Lustre OSDs are based on ldiskfs, a modified
    version of ext4 [10, 11] and ZFS [3].


    The OSD implements a transactional data store for two types of objects. Objects
    store byte-range extents and allows object access to key-value pairs. Objects
    are accessed by a file system-unique 128-bit Identifier (FID) that is composed
    of a 64-bit sequence number to locate the storage target, a 32-bit Object ID within
    the sequence, and a 32-bit version.


    Both types of objects also have efficient storage for typical file attributes
    such as timestamps, ownership, size, and blocks, as well as named extended attributes
    for storage of more complex fields, though management of most of these attributes
    is done by layers above the OSD. Only block usage is managed directly by the OSD,
    since it allocates the space to store object data and attributes.


    The OSD is responsible for the transactional consistency of its local storage,
    but it is free to cache object updates and aggregate these they are'
