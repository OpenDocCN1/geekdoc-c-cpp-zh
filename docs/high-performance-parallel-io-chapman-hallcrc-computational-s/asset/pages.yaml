- pgno: 228
  md: '# 16.1 Motivation


    HDF5 [13], short for "Hierarchical Data Format, version 5" is a data model, library,
    and file format for storing and managing data. It is designed to meet the needs
    of applications that push the limits of what can be addressed by traditional database
    systems, XML documents, or in-house data formats. HDF5 adopters have very large
    datasets, very fast access requirements, or very complex data relationships. Others
    turn to HDF5 because it allows them to easily share data across a variety of computational
    platforms using applications written in different programming languages. Some
    use HDF5 to take advantage of the many open-source and commercial tools that understand
    HDF5.


    Similar to XML documents, HDF5 files are self-describing and allow users to specify
    complex data relationships and dependencies. In contrast to XML documents, HDF5
    files contain binary data (in many representations) and allow direct access to
    parts of the file without first parsing the entire contents.


    HDF5


    In-house data formats are often developed by individuals or teams to meet specific
    needs of a project. While the initial time to develop and deploy a solution may
    be quite low, the results are not portable, not extensible, and not high performance.
    In many cases, the time devoted to extending and maintaining custom data management
    code takes an increasingly large percentage of the project''s total development
    effort—in effect reducing the time available for the primary objectives of the
    project. HDF5 offers a flexible format and powerful API built over 25 years of
    development history. Developers can leverage HDF5''s capabilities and tailor them
    to their needs by building a thin project- or domain-specific API on top of the
    HDF5 API, creating the best of both worlds.


    # 16.2 History and Background


    In 1987, the Graphics Foundations Task Force (GFTF) at the National Center for
    Supercomputing Applications (NCSA) at the University of Illinois'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# HDF5 187


    at Urbana-Champaign set to create an architecture-independent software library
    and file format to address the need for more scientific data among the many different
    computing platforms at NCSA. Additional goals for the project included the ability
    to store and access large objects efficiently, the ability to store many objects
    of different types together in one container, the ability to grow to accommodate
    new types of objects and object metadata, and the ability to access the stored
    data from both C and Fortran applications.


    Originally AEHOO (All Encompassing Hierarchical Object Oriented format), the new
    software and file format was ultimately Hierarchical Data Format (HDF), and was
    developed as an open-source product and distributed free of charge by University
    of Illinois license. The design of HDF combined ideas from a number of different
    formats like TIFF, CGM, FITS, and the Micros PLCT format.


    In 1996 the HDF group began a successful collaboration with the Department of
    Energy (DOE) Advanced Simulation and Computing (ASC) program. The goal was to
    increase the computing power of DOE systems at Livermore, Los Alamos, and Sandia
    National Laboratories by several orders of magnitude. This boost in computational
    power was clearly requiring an associated scale-up in data management capabilities—data
    files would be very large, written in parallel on massively parallel systems,
    and the data itself would be more complex than ever.


    A Data Models and Formats (DMF) group, drawn from the three DOE laboratories and
    NCSA, set about to create a format that would address ASC’s needs. HDF had many
    of the required features, but it didn''t scale to sufficiently large files, and
    could not easily support parallel I/O. Like the GTF before it, DMF borrowed ideas
    and lessons from other formats, in particular from HDF and a format from Livermore
    called Array I/O (AIO), to define a new format for the project. Initially called
    “Big HDF”, the resulting format was finally named “HDF5” because the latest release
    of the original HDF was version 4.0.


    The DOE laboratories and NCSA, with additional support from NASA, jointly developed
    and released the first version of HDF5 in 1998. HDF5 continues to enjoy a distinguished
    status as a scientific data format and library, with successful collaborations
    with NASA and DOE continuing to the present day.


    # 16.3 Design and Architecture


    HDF5 is designed at three levels: a data model, a software library, and a file
    format. The HDF5 data model consists of abstract classes, such as files, datasets,
    groups, datatypes, and datatypes, that application developers use'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'construct a model of their higher-level concepts. As a software library, HDF5
    is designed to provide applications with an object-oriented programming interface
    that is powerful, flexible and high performance. HDF5''s format provides a portable,
    backward- and forward-compatible, and extensible instantiation of the HDF5 data
    model.


    # 16.3.1 The HDF5 Data Model


    At the highest level, the HDF5 data model provides classes that application developers
    use to construct models of their domain-specific objects. The primary classes
    in HDF5 data model are:


    **File:** A container which holds HDF5 dataset and group objects. Files always
    contain at least one group object, the "root"


    **Dataset:** A multi-dimensional array of elements.


    **Group:** A set of links to HDF5 dataset and group objects.


    **Link:** A named reference to an HDF5 dataset or group object.


    **Attribute:** User-level metadata associated with an HDF5 dataset or group object.


    Figure 16.1 shows an HDF5 container (typically stored as a file), with examples
    of the primary HDF5 object classes. HDF5 objects in a container do not have explicit
    names because they can be referenced from multiple locations in the container''s
    group hierarchy, the objects discussed here are labeled numerically. Object 1
    is the root group for the file, referenced with the name "/" and shown with a
    set of user-defined attributes attached to it. Object 2 is a dataset, referenced
    with the name "/A/C" and has a single attribute attached to it. Object 3 shows
    a dataset object that can be reached from two different groups in the container,
    and can be referenced as "A/E" or "B/F."


    Figure 16.1 shows a sample of the power of HDF5 groups and links for structuring
    information in ways that best match the application''s needs. HDF5 groups can
    be nested to arbitrary depth and HDF5 links allow dataset or group objects to
    be referenced from multiple groups. This flexibility allows the creation of directed
    graphs, not just hierarchical structures. Although shown in Figure 16.1, links
    can also "dangle" (referring to objects not placed in the container) or refer
    to objects in another container.


    Groups and links provide the structure for the objects in an HDF5 container, but
    datasets are where an application''s bulk data is stored. HDF5 datasets are multidimensional
    array objects that are stored in the container and referred to by one or more
    groups. Each dataset has metadata that describes the array dimensions, the array
    element type and the storage layout in the container. Figure 16.2 shows a three-dimensional
    dataset with 32-bit floating-point elements, stored contiguously in the container.'
  merge: -1
  img_proc: true
