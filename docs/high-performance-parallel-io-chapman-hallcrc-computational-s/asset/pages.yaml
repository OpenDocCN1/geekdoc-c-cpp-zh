    # 20.4.5 Fragmentation


    In cases where the files are no created for warehousing, the same file will be
    used to run simulations multiple times. This results in data being deleted and
    rewritten. HDF5 does not provide the means to efficiently recover the free space
    in the file, often leading to excessive fragmentation and increased TCDO.


    # 20.4.6 Process and Thread Synchronization


    HDF5 does not provide any means to synchronize processes. Processes are free to
    access a file and the results are undefined. Furthermore, opening a file from
    synchronized processes using file locking on open handles does not ensure that
    a process has written additional data to the file, the file view of other processes
    can still access all the data before the thread. Thread synchronization is an
    issue with HDF5 and it is not trivial to ensure that it always works. Further,
    there are cases where static symbol in the library cause anything from memory
    leaks to crashes.


