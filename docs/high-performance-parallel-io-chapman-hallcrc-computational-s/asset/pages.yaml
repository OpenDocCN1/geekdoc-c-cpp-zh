- pgno: 270
  md: "# High Performance Parallel I/O\n\nA full-resolution magnetosphere simulation\
    \ is an exascale problem. As an inherently multi-scale problem, reconnection is\
    \ initiated as a small-scale problem around individual electrons that eventually\
    \ leads to a large-scale reconfiguration of a magnetic field. Recent simulations\
    \ have revealed that kinetic physics is not only important in triggering reconnection\
    \ [6, 5, 7, 10, 14, 11, 15], but also in its subsequent evolution. This finding\
    \ suggests a need for modeling details of electron motion, which poses severe\
    \ computational challenges for 3D simulations of reconnection.\n\nThe advent of\
