    GPFS NSD protocol, a block-I/O protocol that is built into GPFS and runs over
    the same network that is used for general inter-node communication, access disks
    attached to a set of NSD servers. To avoid the loss of data access upon NSD server
    failure, each disk attaches to multiple NSD servers to provide redundant paths
    to the data.


    The Shared-Nothing Cluster (SNC) model employs internal disks in each cluster
    application node. Data or metadata that not available on the local GPFS nodes
    are accessed using the GPFS NSD protocol. Unlike the NSD server model, data and
    metadata are replicated across local disks on multiple nodes to guarantee availability
    in case of node failures.


    It is common to combine these different models within or across clusters. For
    example, an SNC configuration can use internal disks to store data and then use
    a set of dedicated NSD servers that include latency storage devices such as SSDs
    for faster and more reliable metadata access. As another example, a SAN may be
    used for data access within a cluster, while sharing with the other clusters (within
    or across data centers) over the NSD protocol through GPFS cross-cluster nodes
    [7, 8].


    Nodes that are not part of a cluster can use the Network File System (NFS) protocol
    to access GPFS. In this configuration, some GPFS nodes are designated as Cluster
    NFS (CNFS) server nodes that export a file system to NFS clients. GPFS monitors
