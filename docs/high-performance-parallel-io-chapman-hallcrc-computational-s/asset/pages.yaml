    leave HPC system monitoring questions largely aside here. By profiling the application''s
    POSIX layer alone, a great deal of file system health data can be gathered.


    # 26.2.3 Buffer Size


    The choice of transaction (buffer) size for I/O in many codes is a complicated
    function of concurrency, input/problem specifics, and file system tunables. In
    general, larger I/Os (such as netCDF and HDF5), show better performance but collective
    I/O (MPI-IO collectives), I/O middleware (such as netCDF) and other application
    specifies can obscure the actual transaction sizes behind higher-level I/O operations.
    Obtaining a transaction size profile from IPM is straightforward and in many cases
    reveals the general I/O picture. A standard performance engineering practice is
    to aggregate I/O where possible to increase the granularity of the larger block
    sizes that HPC file systems are often tuned.


    IPM produces inventory of buffer sizes during execution for I/O calls along with
    their minimum, maximum, and average times to completion, along with the number
    of transactions. These buffer sizes may easily be compared with the file system
    block size to determine if the I/O is latency-limited or making full use of file
    system bandwidth.


    While we state the importance of buffer size in modern HPC workloads, this is
    difficult in the context of single application runs. For this reason we suggest
    that the IPM approach be applied in the broader context of HPC workloads.'
