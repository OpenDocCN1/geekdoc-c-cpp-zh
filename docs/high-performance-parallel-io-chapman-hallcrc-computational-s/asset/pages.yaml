    # 20.7 Conclusion


    The aim of this section was to show that HDF5 can be used in industrial HPC applications
    effectively, respecting the requirements that force implementations not to use
    special arrangements and custom-made solutions based on a particular computational
    site. Despite the shortcomings, the HDF5 format and library have the potential
    to improve their market position in the area of black box, low-risk, and conservative
    software applications. The optimistic bottom line is that in the end, it works.
    HDF5 format is possible to use in such industrial use cases effectively and efficiently.
    The HDF5 library offers the knobs and open ends to adjust it for the different
