    \ 223\n\n#  18.1 Motivation\n\nWhile the computational power of supercomputers\
    \ continues to increase with every generation, the I/O systems have not kept pace,\
    \ resulting in a significant bottleneck. Further impeding progress, one often\
    \ finds that existing I/O solutions only achieve a fraction of quoted capabilities.\
    \ On the Argonne Leadership Computing Facility (ALCF) Blue Gene/P resource, FLASH,\
    \ an astrophysics simulation with a highly tuned I/O subsystem, achieves only\
    \ 10% of the total throughput. As the HPC community pushes towards larger-scale\
    \ systems and the anticipated increase in the size of datasets, this situation\
    \ will only become even more critical. I/O infrastructures at extreme scales face\
    \ several system challenges. At the node level, one expects a deep and complex\
    \ memory hierarchy, including non-volatile memory, as well as higher levels of\
    \ concurrency. At the system level, leadership computing systems are being architected\
    \ with higher radix interconnect"
  merge: -1
  img_proc: true
- pgno: 258
  md: 'topologies including the 5D torus (IBM BG/Q), dragonfly (Cray Cascade), and
    6D torus (K-machine). Additionally, our community is witnessing systems deployed
    to include burst buffer and dedicated analysis nodes. Parallel file systems deployed
    at supercomputing centers tend to have diverse performance characteristics for
    I/O patterns including a single shared file versus a per process, due to the design
    and implementation of their underlying metadata and lock management mechanism.
    Applications need to deal with these factors, in order to scale their I/O performance.
    To overcome these bottlenecks and help the scientific output of leadership facilities,
    GLEAN provides a topology-aware mechanism for data movement, compression, subfiling,
    and staging for accelerating I/O, interfacing to running simulations for co-analysis,
    and/or an interface for in situ analysis requiring little or no modification to
    the existing application code base.


    # 18.2  Design and Architecture


    has been explicitly designed to improve application performance and productivity.
    GLEAN users can move out of the simulation with minimal overhead using a clean
    interface. The GLEAN design aims to:


    +   * exploit the underlying network topology to speed data motion off of the
    supercomputer;


    +   * provide asynchronous data I/O via staging nodes;


    +   * develop scalable mechanisms for collective I/O by reducing synchronization
    requirements;


    +   * mitigate variability in I/O performance of shared file systems using staging;


    +   * leverage data semantics of applications;


    +   * enable simulation-time data analysis, transformation, and reduction;


    +   * provide non-intrusive integration with existing applications; and


    +   * provide transparent integration with native application data formats.


    Figure 18.1 provides an overview of the GLEAN infrastructure and compares the
    traditional mechanism used for I/O with GLEAN. The simulation running on the compute
    nodes may invoke GLEAN directly or transparently through a standard I/O library
    such as ParallelnetCDF [8] and HDF5 [6]. The data is moved either directly to
    storage or to dedicated analysis/staging'
  merge: -1
  img_proc: true
- pgno: 259
  md: '# Traditional Mode


    # Mode with GLEAN


    ![](img/e2df60633eace5d7f248335c7c97063d_259_0.png)


    nodes. Using GLEAN, one can apply custom analyses to the data on the compute resource
    or on the staging nodes. This can reduce the amount of data written out to storage.
    On the staging nodes, GLEAN uses MPI-IO or higher-level I/O libraries to write
    the data asynchronously to storage.


    GLEAN is implemented in C++ leveraging MPI and threads, and C-based parallel applications.
    It offers a flexible and extensible API that can be customized to meet the needs
    of the application. The following subsections describe GLEAN''s design in terms
    of four principal features: network topology and reduced synchronization, data
    semantics, asynchronous data staging, compression, and cubbling.


    # 18.2. Exploiting Network Topology and Reduced Synchronization for I/O


    As systems design to evolve towards heterogeneous and complex network topologies,
    effective ways to fully exploit their heterogeneity is becoming more critical.
    For example, in B/P, the system has different networks with varying throughputs
    and topologies. The 3D torus interconnects a node with its six neighbors at 425
    MB/s over each link. In contrast, the collective network is a shared network with
    a maximum throughput of 850 MB/s to the I/O network. The collective network is
    the only way to get to the I/O network in order to perform I/O. Recent supercomputing
    systems have a higher radix interconnect—B/Q has a 5D torus and the K-machine'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# High Performance Parallel I/O


    ![](img/e2df60633eace5d7f248335c7c97063d_260_0.png)


    FIGURE 18.2 (See color insert): Aggregation groups formed within a set of nodes
    by GLEAN with aggregator nodes highlighted, and (b) aggregator node configuration
    using MPI I/O.


    has a 6D torus. An important goal in GLEAN is to leverage such topologies to move
    the data out of the machine as soon as possible, thereby enabling the simulation
    to continue on its computation.


    MPI collective I/O uses AllToAll wherein, depending on an aggregator''s rank,
    the aggregation traffic can cross the partition boundaries of the aggregator group.
    This leads to global communication and network contention. However, GLEAN restricts
    the aggregation traffic to just the processes involved in an aggregator group,
    typically 64 nodes for BG/P and 128 nodes for BG/Q, instead of all the nodes in
    the MPI collective I/O case. This significantly improves performance with larger
    core counts by reducing the global communication. Figure 18.2(a) shows GLEAN''s
    selection of 8 aggregator groups formed for 64 nodes. Each group is depicted by
    a distinct color (or shade of gray) and the aggregator node for each group is
    highlighted. For comparison, Figure 18.2(b) shows the 8 aggregator nodes used
    in MPI-IO collective operations. In this case, the first 8 nodes are selected
    as aggregators and highlighted. Note that the aggregation traffic in the MPI collection
    I/O is global and not restricted to an aggregator group.


    # 18.2.2 Leveraging Application Semantics


    A key in designing GLEAN is to make application data semantics a top priority.
    This enables GLEAN developers to apply various analytics to the simulation data
    at runtime to reduce the data volume written to storage, transform data on-the-fly
    to meet the needs of analysis, and enable various I/O optimizations leveraging
    the application''s data models. This effort has worked closely with FLASH (see
    Section 18.3.2) [3], an astrophysics application used to capture FLASH''s adaptive
    mesh refinement (AMR) data model,'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# GLEAN 219


    and HACC (see Section 18.3.1), a cosmology application, to capture its particle
    data model. The GLEAN project has worked with PHASTA [9], an adaptive unstructured
    mesh data model, to support unstructured grids in GLEAN. Additionally, pNetCDF
    and HDF5 APIs have been mapped to relevant GLEAN APIs, enabling the developers
    to interface with simulations using pNetCDF and HDF5. These represent the common
    HPC simulation data models from AMR grids to particles, and to unstructured adaptive
    meshes.


    # 18.2.3 Asynchronous Data Staging


    Asynchronous data staging refers to moving the application''s I/O data to dedicated
    nodes, and next writing this data out to the file system asynchronously while
    the application proceeds ahead with its computation. A key distinguishing characteristic
    of GLEAN''s data staging is that it leverages the data models and semantics of
    applications instead of viewing data simply as files and/or buffers. On staging
    nodes, GLEAN runs as an MPI job and communicates with the GLEAN aggregator nodes
    using a network abstraction layer customized to exploit the underlying interconnects.
    Asynchronous data staging blocks the computation for the duration of copy to the
    staging nodes. Data staging serves as a buffer for the simulation I/O that can
    be written out asynchronously to the file system while the computation proceeds.
    Data staging also significantly reduces the number of clients seen by the parallel
    file system, and thus mitigates the contention including overheads for the file
    system. The data semantics enables GLEAN to transform the data-on-fly to various
    I/O formats. On staging nodes, GLEAN aims to be deployed as an "always ON" service,
    run on dedicated-aside nodes of a simulation, or co-scheduled along with the simulation.
    If there is insufficient memory on the staging nodes (receivers), the transfer
    is blocked until sufficient buffer/memory space is made available. Staging can
    leverage local node storage to mitigate this issue.


    # 18.2.4 Compression and Subfiling


    To reduce the amount of data written to storage and improve the I/O performance,
    GLEAN incorporates compression for I/O. The current implementation layers Blosc
    [1], a blocking, shuffling, and lossless-compression library, for data compression
    and decompression; however, the API enables programmers to invoke their user-defined
    compression libraries to achieve the best speed/compression ratio. To mitigate
    the overhead of the locks and metadata of parallel file systems, GLEAN''s I/O
    mechanism incorporates subfiling [4] where a few large files are written out to
    overcome the parallel file system overheads of a single shared file and a file-per-process
    I/O. The number of files written out is tunable. On the ALCF Blue Gene systems,
    files are written out per I/O node.'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# 18.3 Deployment, Usage, and Applications


    GLEAN has been deployed on leadership computing systems at Argonne for I/O acceleration,
    asynchronous data staging, and in situ visualization of a number of diverse applications.


    # 18.3.1 Checkpoint, Restart, and Analysis I/O for HACC Cosmology


    Next-generation sky surveys will map billions of galaxies to explore the physics
    of the "Dark Universe." Science requirements for these surveys demand simulations
    at extreme scales; these will be delivered by the HACC (Hybrid/Hardware Accelerated
    Cosmology Code) framework [5]. GLEAN''s I/O performance was integrated and executed
    with the HACC simulation. A weak scaling study was performed using a number of
    cores from 16,384 to 262,144 on the Mira BG/Q system with a total number of particles
    ranging from 2048 to 5012. The total data ranges between 38 MB and 57 MB—i.e.,
    1 to 1.5 million particles per rank. Thou, 400 GB were written at 16,000 cores
    and 4 TB of data at 256,000 cores. The performance of I/O for HACC was compared
    using four configurations: (1) MPI collective I/O to a single shared file; (2)
    subfiling with a file I/O network; (3) using both topology-aware aggregation and
    subfiling; and (4) using all three components of the framework; i.e., compression,
    aggregation, and subfiling. The simulation was performed for 10 steps with each
    I/O configuration and the maximum performance was reported for each configuration.


    Various I/O configurations show different performance rates, depicted in Figure
    18.3. Subfiling yielded a 5× improvement at 16,000 cores and a 10× improvement
    at 256,000 cores over a single shared file. Thus, subfiling is of critical importance
    as it mitigates the impact of file system metadata overhead at scale. Topology-aware
    aggregation yields a 20% improvement over subfiling at 16K cores and up to 80%
    improvement over subfiling at 256,000 cores. Thus, leveraging system topology
    plays an important role when scaling to larger core counts. Using compression,
    and using all three components of the I/O framework, an additional 40% increase
    in performance was observed over using aggregation. This is primarily due to the
    ability to achieve 50% compression for the HACC datasets, and thus writing less
    to the storage system. Overall, by subfiling, aggregation, and compression, a
    10× improvement was observed over MPI I/O at 16,000 cores and a 14× improvement
    at 256,000 cores, achieving 130 GB/s. All three are critical to achieving scalable
    parallel I/O performance. The combination of compression, topology-aware data
    aggregation, and the subfiling mechanism improved I/O performance on the HACC
    application multifunctional. Thus, achieving optimal I/O system performance required'
  merge: -1
  img_proc: true
