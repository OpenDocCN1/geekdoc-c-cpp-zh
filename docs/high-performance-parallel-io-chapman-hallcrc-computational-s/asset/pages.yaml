    the same time.


    # 2.2.3 The NERSC Global File Systems


    NERSC pioneered the concept of providing a long-term centerwide file system with
    its /project file system in the early 2000s. By 2006, the main goals of the /project
    file system were realized when users could access the file system from all computational
    systems at the facility. Users contended aggregate bandwidth in favor of having
    a storage resource accessible to all computational systems at the facility. The
    centerwide file system enabled users to focus more on their computational capabilities
    across several systems and less on moving data between various storage or compute
    systems. NERC also saw a direct result of having less data move across its internal
    network between systems.³ Today, the /project file system is a primary storage
    for enabling science projects to share data between multiple users or systems.
    This file system is used for data transfers on the center''s data transfer nodes
    (DTNs), sharing with collaborators through portals on the Science Gateway Nodes
    (SGNs), and for data analysis on the mid-range systems. The file system is a global
    parallel file system and has high-bandwidth capacity oriented with regular increases
    to sustain demand and growth.


    Most recently the centerwide file systems demonstrated that they are also positioned
    to scale out in support of individual science team needs nearly. An evident example
    was the working of the Daya project that had an unexpected delay in their efforts
    to determine the mixing angle in neutrino-oscillation experiment². They had recently
    migrated from a model of local storage that was struggling at scale, to the centerwide
    file system. The move provided for easy scale-out (doubling their allocation)
    within less a week’s response and ultimately enabled rapid scientific results
    directly leading to a scientific discovery.


    The centerwide file systems are also suited for meeting the evolving needs of
    data-intensive science communities. NERSC initiated a Data Intensive Computing
    Pilot⁸ with a number of science teams providing 1 PB of high-bandwidth storage
    capacity and a compute allocation to enable analysis of large datasets.


    NERSC provides two other centerwide file systems: global scratch and global homes.
