    Application performance is usually tested as part of a benchmark or controlled
    characterization study. Conducted by tools experts, the applications are assessed
    in an "off-line" or non-production environment. In practice [6], the performance
    delivered by an application over the duration of many executions can vary in uncontrolled
    and significant ways. A properly load-balanced code and input deck can be easily,
    bottle-necked by minor changes in input, concurrency, and execution environment.
    Many of these "minor" changes are too easy to arrive at through natural adjustments
    of scientific need or resource availability, which is the motivation behind the
    Integrated Performance Monitoring (IPM) framework to measure and improve in-vivo
    HPC application performance as it happens in a production computing setting.


    # 26.1 Design and Features


    The IPM framework tests application performance in a production-like environment
    to assess application performance realistically and accurately. IPM has been used
    in the context of individual work on codes [1], for HPC system procurements [9],
    and metering workloads: sustained performance at'
