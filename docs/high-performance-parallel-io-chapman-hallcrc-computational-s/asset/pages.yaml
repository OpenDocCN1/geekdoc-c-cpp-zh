  md: '# MPI-IO


    one-file-process I/O method. This method is easy to program and requires no MPI
    communication. However, it results in a large number of files that are hard to
    manage. Another drawback is that the same number of processes must be used to
    read the files as the parallel program that created the files. Otherwise, additional
    effort is required, as determining the mapping of files to processes and the logical
    layout from files to memory (most likely noncontiguous in file space). Due to
    these concerns, it is desirable to store data in a canonical order if that the
    mapping of the number of processes. The second method of performing I/O addresses
    this limitation, and it involves funneling I/O through one process of the program.
    All I/O requests are forwarded to that process and carried out. Obviously, this
    approach performs well in performance for large jobs due to communication congestion
    and limited memory space available in one process.

    The third method, parallel I/O to a shared file, overcomes the limitations of
    both approaches. In this method, all processes open a common file and write different
    parts of the same file simultaneously. This approach maintains the logical view
    of a single file and can also result in high performance given sufficient I/O
    hardware, a parallel file system, and an efficient MPI-IO implementation. The
    following sections describe how MPI-IO can be used to perform this task of parallel
    I/O efficiently.


    # 13.2 Using MPI for Simple I/O


    Based on the third method described in Section 13.1.2, high performance parallel
    I/O can be achieved by enabling all processes to read or write to parts of a single
    shared file. Figure 13.2 shows a simple example of such a program. Overall, the
    code is not much different from how one would do it using regular POSIX I/O. It
    simply uses the MPI-IO equivalents of POSIX open, seek, and close functions.


    MPI_File_open takes an MPI communicator as the first argument, which represents
    the group of processes that will access the file. The second argument is the file
    name. MPI does not specify the format of the file name; implementations are to
