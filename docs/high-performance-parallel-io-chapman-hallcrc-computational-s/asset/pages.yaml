    LNDs may also be tuned to support "long fat pipes" efficiently by increasing message
    queue depth and RDMA concurrency, and by optionally mapping RDMA buffers on demand
    to reduce RDMA fragmentation on the wire. These optimizations enable Lustre to
    operate efficiently over wide-area networks.


