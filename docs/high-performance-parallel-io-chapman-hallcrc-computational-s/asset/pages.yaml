    read approach, i.e., reading the minimum metadata that is required and the rest
    only when necessary. The downside is that accessing a single dataset in a file
    is "two-pass" operation with suboptimal performance. Another option is to make
    only a subset of processors load in metadata so that for systems multi-core cluster
    where memory is shared among several cores, it reduces total memory consumption
    for metadata. More importantly, by calling open/-close at aggregators, it also
    reduces the number of metadata operations, which is very beneficial to both users
    and file system.


    # 22.2.8 Chunking


    To avoid excessive small read requests, chunking is used to achieve bulk reads.
    This is done by merging read requests into larger ones at the aggregator side.
    For a non-contiguous file format, chunking is particularly useful to speed up
    reading as data is not continuously stored on disk and disks are otherwise needed
    to jump from one position to another. An aggregator first collects all read requests
    issued from its group members. The read request message includes information such
    as data address and size. Namely, for a non-aggregator processor, the adios_read_var()
    call simply save read parameters as the adios handler, start, count, and buffer
    address, without doing any actual I/O access. In the adios_fclose() call, the
    processor then packs all parameters into a read request and sends to its aggregator'
  merge: -1
  img_proc: true
