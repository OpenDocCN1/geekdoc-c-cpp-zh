- pgno: 352
  md: '# High Performance Parallel I/O


    Previous system-wide workload studies [9] were very influential in HPC I/O research
    but not reflected the scale, architecture, and scientific diversity of present-day
    systems. Collecting data on large-scale present-day systems required the development
    of efficient, non-intrusive instrumentation methods. This led directly to the
    following core design goals for Darshan: transparent integration with the user
    environment and negligible impact on application performance, and reliability.


    Darshan operates in the user-space as an interposition layer in order to collect-operation-statistics
    without source code modifications. As with many HPC profiling tools, Darshan leverages
    the MPI profiling interface in conjunction with either link-wrappers for statically
    linked executables or preloaded libraries for dynamically linked executables.
    Static instrumentation can be enabled system-using MPI compiler script functionality,
    while dynamic instrumentation can be enabled system-using using environment variables.
    Users do not need to change their work flow in either


    Darshan call wrappers intercept POSIX and MPI-IO functions, as well as HDF5 and
    NetCDF functions. The wrappers are used to gather information, as operation counters
    (such as `open`, `read`, `write`, `stat`, and `map`); datatypes and hit patterns
    in alignment; sequential size; and timing information including I/O time and intervals
    of I/O activity.(A full description of counters can be found in the Darshan documentation
    [5].) Darshan does not have any communication or storage operations to manage
    characterization data while the application is running. Each process is instrumented
    independently using a bounded amount of memory. When the application shuts down,
    the results are aggregated, compressed, and stored persistently. Darshan uses
    a combination of MPI reduction operations, collective I/O, and parallel Zlib compression
    to reduce overhead and minimize log file.


    The command line utility of Darshan includes tools to parse and analyze log files
    produced by the runtime library. Figure 27.1 shows an example of output produced
    by darshan-job-summary, a utility that summarizes the I/O behavior of a job. This
    example was chosen from production logs captured on the IBM Blue Gene/Q system
    operated by the Argonne Leadership Computing Facility (ALCF). The “I/O Operation
    Counts” graph of MPI-IO collective buffering [10] there is a large discrepancy
    between the number of MPI-IO write calls and the number of POSIX write calls.
    The “Most Common Access Sizes” table confirms that the majority of the POSIX write
    operations were 16 MB in size, which corresponds to the collective buffer size
    used by MPI-IO. The bottom graph indicates that the application was divided into
    subsets of processes that wrote data in different time intervals.


    The Darshan command line utilities also include tools to anonymize identifying
    information, such as file names and executable names, in log files. This capability
    makes it possible to release Darshan characterization data to'
