    # 32.5 Conclusion


    As the number of cores increases in modern multicore servers, several issues arise
    for the I/O path. In this chapter, three such issues were briefly examined: NUMA
    effects, I/O cache efficiency, and I/O scheduler selection. Early investigation
    shows that these areas will require a significantly better understanding of the
    problems ahead and new mechanisms in the I/O path to ensure the scalability of
    I/O performance.


