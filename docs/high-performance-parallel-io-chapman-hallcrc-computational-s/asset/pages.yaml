    business and data models. Another danger is that these solutions are tightly linked
    to the client code. The lack of appropriate interfaces makes it even more difficult
    to exchange parts of the code. In other cases, vendors use systems that are not
    well suited for the purpose. Database management or other general-purpose data
    management systems have failed in the past to deliver. There is a compromise between
    I/O performance and access granularity which deteriorates as datasets increase


    HDF5 is a potentially strong contender in this arena. It is one of the few libraries
    to advertise its ability to handle large datasets and its highindustrial and academic
    provenance makes it appealing, or at least to some extent that it can be useful
    for resolving simulation data management problems. Indeed, HDF5 is versatile and
    simple to be used for storing simulation data. The in-file data model, and the
    ability to arrange data and fine tune the access granularity and layout on disk,
    makes it possible for different clients to access data without sharing data models,
    providing adequate I/O performance. However, a parallel I/O implementation fulfilling
    the requirements of industrial customers face some significant challenges. In
    the following, some areas where HDF5 shines or fails are outlined.'
