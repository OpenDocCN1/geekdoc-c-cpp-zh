    POWERparallel Systems. In May 1998, IBM''s Systems and Technology Group

    STG introduced the IBM GPFS software product.


    Since then, GPFS has evolved to support heterogeneous clusters includ-

    ingAI, Linux, and Windows systems, and serves an expanding and diverse

    range of applications. Over the years, GPFS has added advanced features and

    data management functions, as snapshots and backup, informa-

    lifecycle management, and data sharing across wide-area networks [7, 8].

    GPFS continues to push the boundaries of reliable, efficient, and scalable par-

    allel I/O performance.


    # 9.2 Design and Architecture


    # 9.2.1 Shared Storage Model


    GPFS is a parallel file system based on a shared storage model. GPFS

    automatically distributes and manages files while providing a single consistent

    view of the file system to every node in the cluster. Processes running

    different nodes in the cluster see the same directory structure and share access

    to the same set of files with the same semantics as the processes were running

    in a single node.


    A GPFS cluster consists of a set of file system nodes, on which appli-

    run, connected to a shared storage system. All data, metadata, and

    recovery information is therefore accessible by every node in the cluster.

    By convention, each device in the shared storage system is referred to as a

    "disk." In reality, a "disk" may refer to a convolutional disk,

    more commonly is a storage controller volume, such as a small computer

    system interface logical unit (SCSI LUN), SSD, or a leading-

    e-volatile random-access memory (NVRAM). The same GPFS

    code is installed on all nodes in the cluster, consisting of an administrative

    system, to manage the cluster, a kernel module that implements the operating

    system-specific file interface and handles most file system operations,

    to to coordinate access to shared data and metadata and implements advanced

    data management functions.


    A GPFS cluster can be configured in one of three typical models as illus-

    trated in Figure 9.1.


    The Storage Area Network (SAN) model uses two networks: a SCSI-based

    storage network for access to the shared storage system and a TCP/IP-based

    network for communication between nodes.


    The Network Shared Disk (NSD) server model is more common in large

    clusters since it avoids the cost and administrative overhead of maintaining

    two separate networks. In this configuration, GPFS application use the'
