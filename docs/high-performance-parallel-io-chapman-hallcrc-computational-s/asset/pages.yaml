    # 28.1 Features


    Iota is a lightweight tracing tool for diagnosing poorly performing I/O operations
    to parallel file systems, especially Lustre. It collects complete traces of POSIX
    I/O calls with minimal overhead, and has been tested to scale to 110,052 MPI tasks
    and 15 TB of data. Iota is freely available under a non-commercial license from:


    ```

    https://bitbucket.org/mhowison/iota

    ```


    As the storage systems and the parallel file systems that service supercomputers
    become more complex, it is increasingly important to finely tuned tracing tools
    for investigating poor I/O performance. The POSIX I/O layer is informative because
    it is the interface between user-space code (either the application itself or
    a middleware-ware library like MPI-IO or HDF5) and a kernel-space system.


    Iota similar aims to Darshan (Chapter 27, [3]), but adds two missing features:
    recording of complete traces, rather than aggregates, that allows more flexibility
    in post-processed analyses; and integration with the Lustre API to capture stripe
    parameters and OST assignment of files opened on Lustre file systems.


    Like Darshan, Iota traces are buffered in memory to avoid any small writes to
    the trace file (in ASCII for human readability). Darshan limits the buffer’s footprint
    by storing only aggregate values instead of a complete traces of all I/O activity.'
  merge: -1
  img_proc: true
- pgno: 360
  md: 'Iota offers two alternative methods for limiting the footprint during tracing,
    while still collecting completes:


    +   - *subsetting*, which restricts tracing to a subset of files specified by
    a wildcard pattern in an environment variable;


    +   - *flushing*, which flushes the trace buffer to file at 1 MB intervals, requires
    writing one file per MPI task. On Lustre file systems, the trace file is opened
    with stripe count 1 and stripe 1 MB. Flushing has added the benefit that some
    tracing information may be available even if the program aborts in the middle
    of a run.


    Unlike Darshan, Iota is not intended for use as an automated, center-wide collection
    tool (c.f. Carns et al. [2]). Runs with pathological I/O could create significant
    buffering overhead and cause the run to fail; for instance, an I/O pattern with
    one billion 1 KB writes from a single MPI task would create about 32 GB of buffered
    string data for that task. However, even this pathological case could be handled
    by Iota if the *flushing* mechanism is used. Thus, Iota is best used for profiling
    tasks with careful selection of tracing parameters (examples of targeted I/O profiling,
    see Uselon et al. [5]).


    Iota supports both runtime and interlink time interpolation of POSIX I/O functions
    in the GNU library. For runtime interpolation of dynamically linked executables,
    Iota defines each function and calls the dylib with the next (e.g., system) symbol
    for that function name. For linktime interpolation of dynamically or statically
    linked executables, Iota uses the GNU linker''s --wrap feature and defines a _wrap_
    for each function call.


    Iota supports both MPI and non-MPI executables. In MPI mode, initialization and
    finalization are accomplished by redefining the MPI_Init and MPI_Finalize functions
    and calling into the standard MPI profiling interface (**PMPI_Init and **PMPI_Finalize**).
    In non-MPI mode, the GNU linker''s **constructor** and **destructor** function
    attributes provide similar hooks. In both modes, Iota measures the elapsed time
    of POSIX I/O calls with the high-precision **gettimeofday** timer.


    # 28.2 Success Stories


    We have tested Iota at scale with standalone I/O kernels from three scientific
    applications: a climate simulation, the Global Cloud Resolving Model (GCRM), and
    a plasma simulation, VPORPAL, described previously by Howison et al. [4]; and
    a second plasma simulation, VPIC, described by Byna et al. [1]. File sizes ranged
    from 15 GB to 1.5 TB.'
  merge: -1
  img_proc: true
- pgno: 361
  md: 'All results were collected on NERSC Cray XE6 system, Hopper, which has 6,384
    twenty-four nodes with 32 GB of memory each. It features a Gemini interconnect
    with a 3D torus topology, and a Lustre parallel file system with 156 Object Storage
    Targets (OSTs) and an advertised bandwidth of 35 GB/s. The OSTs are backed by
    26 Object Storage Servers (OSSs), which share 123 LSI 7900 disk controllers. Luster
    nodes in the Gemini interconnect forward I/O requests from the Hopper compute
    nodes to the OSSs through a Q InfiniBand interconnect.


    Iota''s overhead, as a percentage of overall runtime, remained low even as the
    scales ran up to 110,052 MPI tasks (see Figure 28.1). We expect that tracing of
    real applications should incur even less overhead, since our test applications
    are all I/O benchmarks that do nothing but I/O calls.


    We ran Iota gather (instead of flushing) to validate the feasibility of gathering
    the entire trace to the root task for output to a single file. The results showed
    that gathering accounted for very little of the overhead (see Figure 28.1). After
    further investigation, we found considerable variation in the overhead for calls
    into the Lustre API to striping information. This is likely due to the design
    of the Lustre file system, with centralized metadata server.


    In no cases, MPI tasks used more than the initial 2 MB allocated to buffer the
    string data for the trace entries. In MPI_Finalize, the root task allocated a
    larger buffer as the final trace output, which ranged from 1.8 MB to 139 MB over
    the test runs. In practice, we expect that the application has freed its allocated
    before finalizing, so that additional memory is available for Iota at this point.


    Figures 28.2 and 28.3 show examples of the plots we can generate when complete
    traces are available for post-processing.


