    # 3.4 Blue Waters Applications


    The allocation of resources on the Blue Waters system is handled by several allocation
    bodies; the National Science Foundation (NSF) allocates 80% of available resources
    with the remaining 20% allocated by the University of Illinois at Urbana-Champaign
    (UIUC), the Great Lakes Consortium for Petascale Computation (GLCPC), and by the
    Blue Waters Project for Industrial, Education and Innovation opportunities. During
    the first year of operation or production, there were 30 NSF projects, 29 GLCPC
    projects, and a handful of Industry and Education projects. Collectively, the
    projects are all sets. An up-to-date list of allocated projects is available from
    the Blue Waters portal. The 70 SET projects from the first year of production
    utilized a wide variety of applications with a comparable range of I/O requirements.


    The SETs typically have more than one primary application. A partial list of applications
    used by the SETs contains over 42 applications during the first year of operations.
    The areas of research range from astrophysics (ENZO, pGADGET, PPM, MAESTRO, CASTRO),
    biochemistry (AMBER, Gromacs, NAMD), climate science (CCEM, CESM), to geophysics
    (Cybershape, AWD-ODC), helophysics (H3D, VPIC, OSIRIS), lattice quantum chromodynamics
    (MILC, Chrona), and turbulence (PSDSN, DISTUF).


    The NSF SETs account for the largest part of the time available on Blue Waters;
    many of which were involved with Blue Waters project during the co-design deployment
    phase. An understanding of the SETs I/O methodology and requirements comes from
    analysis of their proposals, responses to questionnaires, and from interviews
    with project team members. The information provided by the teams was used to evaluate
    the effectiveness of the Blue Waters file system design, its configuration, and
    policies and practices to manage the file system.


    Blue Waters'' focus is to investigations not possible elsewhere and to turn petascale
    computation and analysis at very large scales from a heroic event to an everyday
