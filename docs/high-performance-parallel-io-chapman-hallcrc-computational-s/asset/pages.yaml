  md: '# High Performance Parallel I/O


    The interconnect between the controllers and the drive drawers is a pair of redundant
    3-Gbps Serial Attached SCSI (SAS) links. ALCF uses DDNs 8+2P protection scheme
    which implements RAID 3 (byte striping) with 2 parity bytes.¹ The parity groups
    are distributed vertically through the drawers. If you consider this as a 3D matrix
    of hard drives, with the x and y dimensions inside the drawer, and the z dimension
    going up and down, the 10 drives in the same x and y coordinates in each drawer
    form a parity group. This arrangement means that two drawers can be lost without
    the loss of data. Another useful data protection feature of these arrays is parity
    verification on read, which DDN refers to as "SATAure." Since the ASIC can generate
    the parity at line rates on read, the parity is read from the parity, but it is
    also recalculated in the controller and compared. If the reads do not match, the
    data will be either corrected if possible or flagged if not, preventing what is
    referred to as "silent data corruption." In the ALCF configuration, the controller
    is the primary for all the LUNs (a group of drives treated as a single storage
    resource), but it can serve data from the non-primary LUNs (with a small performance
    penalty) should the other controller fail. Each controller also has four external
    Double Data Rate (DDR or 20 Gbps) Infiniband ports for connection to the servers.
    These ports are directly connected to the servers (not via a switch). Any traffic
    between servers is handled by the converged Myrinet and Ethernet network.


    The initial Intrepid design for 2U IBM x3650s, each with dual quad core processors,
    couple, with each server driving two Infiniband ports. However, the reality of
    motherboard blocks along with speeds and feeds leads to question if the servers
    would be able to sustain the required I/O throughput. For this reason, the design
    was modified to use 1U IBM x350s, each with a single quad core processor and 8
    GB of RAM, driving a single Infiniband port. This change doubled the effective
    bandwidth and had the aggregate RAM available for file server cache, without changing
    the rack space, though it did double the number of hosts to manage and the number
    of Gigabit Ethernet signed in three rack storage cells. Each cell consisted of
    two DDN storage arrays, with a server rack in holding the 16 servers, Gigabit
    Ethernet switches for management, and in most cases, a 512-port Myrinet switch.


    Because Blue Gene/P came with 10 GigE built on board, there was a requirement
    for at least 640 ports of 10 GigE. Given that requirement, a converged solution
    was chosen. However, 10G Ethernet was relatively new in 2007 and the cost was
    extremely high. Therefore, a hybrid solution


