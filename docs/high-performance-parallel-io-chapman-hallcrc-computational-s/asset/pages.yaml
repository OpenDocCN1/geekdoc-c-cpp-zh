    # 33.2 Future Directions


    The scale of future clusters at the DOE National Laboratories will force a change
    in interconnect technology. As clusters scale for a scientific workload, communications
    quickly become the bottleneck. On very large-scale clusters, the cost of interconnects
    and cost of power will drive technology requirements. The PCIe interface performance
    is not increasing as fast as processors or networks. PCIe Gen 3 is widely used
    today with no clear date of release for PCIe Gen 4 on horizon.


    Many of the future interconnects for large-scale machines in the 2017 or later
    major processor vendor is expected to be looking at how to implement this type
    of network by then. The development of this technology is primarily driven by
    lower power and higher bandwidth requirements. The 2008 DARPA Exascale report
    speculates 1.5 -2.0 PJ/bit for an exascale interconnect [4]. Extrapolated to the
    expected size of an exascale machine, the projected energy requirements would
    be of the order of 2-4 MW. The current target for exascale machine is 20 MW of
    power, so is unlikely that the interconnect will consume 20% of the total allocated
    power budget. There are several technologies to mitigate this problem. Some examples
    of these technologies include 3D chip stacking as well as on-package and on-die
    solutions, which require significantly less power. The Fast Forward and Design
    DOE programs have a minimum of 400 GB/s node interface performance requirements
    [3]. This requires technology advances in several areas. With current technology
    evolution, the speed of the basic has to increase to reach these higher speeds.
    An alternative to a fast single pipe is to do what telecommunications companies
    have for years, which is to use wavelength multiplexing (WDM), as shown in Figure
    33.2. WDM allows for parallel communications over a single physical fiber links
    utilizing discrete ranges of light wavelengths. WDM can be implemented as CWDM
    (coarse WDM), which is up to 8 wavelengths, or DWDM (dense WDM), which can be
    up to 64-80 wavelengths. With this type of technology, data movement costs can
    be reduced. Networking for exascale systems will be moving to mostly optical connections
    in network interface cards (NIC), switches, and routers. There has been a recent
    emergence of vendors selling


