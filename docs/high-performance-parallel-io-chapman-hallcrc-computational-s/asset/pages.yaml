  md: '# 9.2.2 Design Overview


    to handle component failures by automatically redirecting NFS clients to another
    CNFS node. In all, these functions provide a scalable, highly available NFS solution.


    This section provides a high-level overview of the methods GPFS uses to achieve
    scalable performance and high availability while supporting standard POSIX file
    system.


    The GPFS approach to scalability is to distribute everything—data and metadata—as
    evenly as possible across all available resources. This is called wide stripping.
    Large files are divided into large, equal-sized blocks, and consecutive blocks
    are placed on different disks in round-robin fashion. The block size is configurable
    and can be as large as 16 MB in order to take advantage of high sequential data
    rates of individual disks or storage controller LUNs. Different nodes may read
    and write different parts of a large file concurrently. This allows an application
    to make full use of the I/O bandwidth of the underlying subsystem and interconnect,
    even when accessing only a single file. Aggregating large numbers of physical
    disks into a single file system allows performance and I/O bandwidth to scale
    with the cluster size.


    GPFS optimizes the organization of data within and across blocks. For space efficiency,
    GPFS stores small files, as well as the data at the end of a large file, as fragments;
    which are allocated by dividing a full block into smaller subclasses. With the
    GPFS file placement optimizer (FPO), the blocks are laid out to take advantage
    of storage and network topology [8]. For example when FPO is deployed using the
    SNC model, data blocks are grouped into larger chunks, and each chunk is stored
    on disks attached to the same node. Analytic applications can distribute their
    computation across the cluster so most data is read from local disks, thereby
    minimizing data transfer over the network [2].


    GPFS uses distributed locking to synchronize access to data and metadata on a
    shared disk. This protects the consistency of file structures in the presence
    of concurrent updates from multiple nodes and provides single system images without
    a centralized server handling all metadata updates. It also allows each node to
    cache the data and metadata being accessed on node while maintaining cache consistency
    between nodes. Non-shared workloads can run with near-local file system performance
    because each node can independently read and write metadata of the files it accesses,
    cache data, and write updates back to disk. For shared workloads, GPFS optimizes
    locking granularity and metadata update algorithms to minimize interactions between
    nodes, so shared data can be read and written at maximum I/O bandwidth speeds.


    For high availability, GPFS must allow uninterrupted file system access in the
    presence of node failures, disk failures, and system maintenance operations. Similar
    to other journaling file systems, GPFS records all metadata'
