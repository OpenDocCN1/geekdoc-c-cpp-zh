    for fast access, an opportunity becomes available to perform reductions, data
    analysis, and/or scientific visualization. Analyzing data in the burst buffer
    while it is in flight to the parallel file system is known as “in-transit” analysis.
    This is in contrast to both traditional post-processing and in situ analysis.
    A post-processing workflow requires the user to reload the requisite data from
    the parallel file system to perform the analysis functions desired, independent
    of the simulation application itself. In situ situ analysis is another emerging
    option to perform analysis that integrates the analytics routines directly into
    the simulation, and processes the data while it is still resident in the simulation’s
    memory space. Each technique has its own set of benefits and drawbacks, as shown
    in Table 23.1, which ultimately implies that a combination of these techniques
    will be employed forward.'
