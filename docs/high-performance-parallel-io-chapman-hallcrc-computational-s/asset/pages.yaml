    360


    # 32.1 Introduction


    With current trends moving toward large multicore servers as building blocks for
    HPC and data centers, storage I/O is becoming an increasing concern for scaling
    and performance. The main contributing factors that lead to this landscape are:
    (a) technology that allows and dictates building large multicore servers; (b)
    servers that are built as shared memory systems that run a single instance of
    the operating system for convenience and market purposes; (c) with the advent
    of “big data” problems, applications that tend to become more data intensive;
    and (d) fast storage devices that allow such systems to operate at high input/output
    operations per second (IOPS). Therefore, a major trend for both HPC and data centers
    is toward using large shared servers as infrastructure components for computation.


    Large, shared servers and data-intensive applications pose significant challenges
    for the storage I/O path. I/O requests need to traverse multiple layers in the
    operating system, storage controllers, and the devices themselves. The operating
    system in general and the Linux kernel in particular have not been designed to
    handle large amounts of concurrency in the I/O path, nor'
  merge: -1
  img_proc: true
- pgno: 396
  md: '# High Performance Parallel I/O


    handle large numbers of IOPS. Moreover, memory management and synchronization
    become more difficult to handle due to the more complex memory hierarchies, NUMA
    levels, and system interconnects. In addition, mixing I/O streams due to the high
    levels of concurrency patterns that lead to traditional magnetic hard disks (HDDs)
    and modern solid-state disks (SSDs) to operate inefficiently. Overall, modern
    server platforms are becoming larger, more heterogeneous, with a wider range of
    memory access and synchronization costs, and they are required to support higher
    degrees of concurrency at the I/O level.


    This chapter will focus briefly on three I/O problems on multicore servers:


    +   * NUMA effects. Buffer placement and affinity of processes and memory buffers
    can result in large variations in performance and limit scalability.


    +   * Efficiency of I/O caching. I/O caching is an important function of the I/O
    path in the operating system kernel. Modern multicore servers can improve the
    efficiency of the I/O cache by trading CPU via deduplication.


    +   * I/O scheduling. A single scheduler will not well for diverse workloads in
    modern systems, and systems can dynamically choose a scheduler from the current
    existing choices in the operating system kernel, considering all I/O requests.


    Some of these problems are illustrated on real systems, with general mitigating
    approaches, using a custom-designed kernel I/O stack that provides new mechanisms
    for managing affinity, buffer management, synchronization, and scheduling in the
    I/O path.


    The rest of this chapter is organized as follows: Section 32.2 discusses challenges
    in the storage I/O, Section 32.3 presents about the future, Section 32.4 provides
    solutions to improve the I/O stack, and finally, Section 32.5 summarizes observations
    and predictions with concluding remarks.


    # 32.2 Storage I/O at Present


    Currently, storage I/O faces new challenges. Until recently, storage I/O was primarily
    limited by the storage devices themselves, as HDDs were the main limiting factor
    for the number of IOPS and the I/O throughput a server could sustain. As, the
    main-level I/O path has been to reduce the number of I/O operations, e.g., by
    properly managing metadata.


    However, with the advent of new storage device technologies, such as SSDs, modern
    multicore servers can operate at a performance regime that is two'
  merge: -1
  img_proc: true
- pgno: 397
  md: '# Multi/Many Core 355


    orders of magnitude higher in terms of IOPS and one order of magnitude higher
    in terms of throughput. At this regime, bottlenecks shift from the devices to
    the host I/O path and reveal many of the shortcomings of today''s I/O path design
    in the operating kernel.


    Modern systems introduce significant complexity due to the non-uniform memory
    architectures they employ. The I/O path and all the buffers and structures it
    uses are shared across all contexts that perform I/O. Therefore, access to memory
    poor locality. NUMA effects result in both high overheads and poor scalability
    as well.


    Multicore systems present additional opportunities for improved I/O performance
    by trading CPU for memory efficiency. The dynamic random access memory (DRAM)
    I/O cache is most important for reducing the number of I/O operations, by absorbing
    metadata I/O operations and allowing devices to mostly serve I/O requests. However,
    large numbers of the I/O cache can significantly improve I/O performance.


    In addition, modern servers and applications typically use a large number of contexts,
    threads, issue I/O requests. However, large numbers of outstanding requests typically
    result in mixed patterns that degrade device performance. Jung et al. [7], explain
    that with modern SSDs, small and non-sequential I/Os result in significantly lower
    than nominal device performance. Therefore, the scheduler will play an increasingly
    important role, as workloads become more diverse.


    #  32.2 Storage I/O in the Near Future


    Current technology trends stipulate that the number of cores will be increasing
    and the persistent I/O hierarchy will include additional types of non-volatile
    devices besides SSDs and HDDs. In this landscape, all discussed will intensify
    and multiple aspects of today''s I/O path in the operating system kernel need
    to be redesigned to satisfy future I/O requirements as Shoaib Akram et al. show
    [1]. At a high level, some solutions will be introduced for the following:


    +   - Dealing with NUMA servers


    +   - Improving the efficiency of DRAM caching


    +   - Dealing with mixed I/O patterns


    Generally, the I/O path is designed as a shared resource. This approach, although
    it is flexible and provides a convenient single-system image, it does not scale
    as the number of cores and the required levels of I/O performance increase. Therefore,
    in the future, the I/O path is expected to be redesigned'
  merge: -1
  img_proc: true
- pgno: 398
  md: '# 32.4 Challenges and Solutions


    This section discusses an initial approach to improve the current I/O path with
    respect to each problem listed in Section 32.3.


    # 32.4.1 NUMA Effects


    At present, a typical server implements a non-uniform memory architecture with
    at least 2 NUMA nodes. The results of running a flexible I/O (FIO) tester [3]
    on a standard 8-core Intel machine with two sockets and relatively uniform memory
    architecture is shown in Figure 32.1. The workload consists of 4-KB random read
    requests with one to eight application threads. The two curves correspond to two
    runs: one that takes into account the affinity and a base execution that does
    not. After four application threads, where both sockets are occupied with threads,
    the performance of the base execution deteriorates to 21% compared to the one
    that takes affinity into account.


    Figures 32.2 and 32.3 display results for both FIO and interleaved-random benchmarking
    (IOR) [8], an MPI-based benchmark that emulates checkpoint patterns on a 64-core
    AMD server with eight NUMA nodes organized in four sockets. This system exhibits
    pronounced non-uniformity in


