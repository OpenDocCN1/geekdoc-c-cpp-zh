- pgno: 383
  md: '# Storage Models: Past, Present, and Future


    the augmented HDF5 library takes advantage of these to ensure consistent transitions
    of a given dataset.


    Another interesting feature of the Intel Fast Forward is the manner in which burst
    buffers are integrated into the overall system. I/O nodes that manage local NVRAM
    export three distinct data models for use by libraries: a blob object (i.e., a
    byte stream), a key-value object, and an array object. All are used within HDF5,
    and the I/O node is responsible for mapping transactions on these constructs into
    operations on DAOS objects. This issue of translations between abstractions at
    various levels of the I/O stack is critical, and often overlooked.


    # 30.3.3 Namespaces


    Despite hierarchical file systems being declared as dead [17], this model of data
    organization still dominates in HPC. While both the EOF and Intel Fast Forward
    projects provide alternative organizations for data, neither radical changes to
    how we organize and reference named entities.


    What seems most likely is that the role of providing namespaces for HPC applications
    will be taken over upper layers of the HPC storage stack, layers as HDF5, PnetCDF,
    and others, with storage systems instead providing a richer building-block abstraction
    on which these namespaces are constructed.


    What is even less clear how search-capabilities will be integrated into the HPC
    storage stack. Activities such as hDAD [17] and Spyglas [14] provide some insight,
    but ultimately HPC search is about application data structures—not something that
    the low-level storage system is necessarily aware of. Perhaps active storage advances
    will be what ultimately enables application-oriented searches to be executed local
    to storage where they can be performed efficiently.


    # 30.4 Conclusion


    The POSIX storage model has been a cornerstone of HPC systems for decades. As
    a result of its success, HPC system providers have been slow to adopt alternatives
    to the well-understood POSIX file model, but the increasing use of I/O libraries
    such as HDF5 and PnetCDF by scientific codes have eliminated many long-standing
    dependencies on the antiquated POSIX model and provided new ways for science teams
    to interact with storage.


    Research has identified a number of promising alternative models, and the community
    seems ready to embrace a new model. New additions to the storage hierarchy, such
    as the inclusion of volatile memory in the storage system, have further disrupted
    the status quo. With current storage systems struggling to keep pace, the timing
    could not be better.'
