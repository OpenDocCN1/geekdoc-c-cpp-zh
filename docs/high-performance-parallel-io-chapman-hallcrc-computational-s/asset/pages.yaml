- pgno: 246
  md: 'applications with a simple I/O programming interface. Using ADIOS takes away
    the burden of implementing the I/O strategy at the application level, and chooses
    the best-performing I/O strategy depending on the parameters of an actual run
    and the target storage system. Each process in an application needs only to declare
    what data should be moved and when, but the “how,” i.e., the I/O strategy (e.g.,
    aggregation and output file organization), is not implemented at this level. ADIOS
    takes care of the data movement using an I/O strategy chosen separately.


    # 17.2 Design and Architecture


    ADIOS [9] is a user-level I/O library located on the top of the I/O stack. ADIOS''s
    write API is designed to be as close to the POSIX I/O calls as possible, but without
    specifying what happens in the “write” call. Datasets are “opened” and “closed”
    and variables are “written” to them. In general, write calls only buffer the data
    content, and in the close call, ADIOS performs burst to the file system. However,
    the actual I/O method used in a run determines how the data is processed and transferred
    to the target, and if the target is a file system or something else.


    The API lets express I/O in terms of variables in the code using HDF5 or netCDF.
    An ADIOS dataset consists of multidimensional arrays or simple scalars, with global
    dimensions by scalar variables (similar to netCDF dimensions) or by integer values.
    A writing process also has to declare where its array fits in a global array using
    offsets and local dimensions.


    ADIOS methods implement different I/O strategies, like writing onefile-process,
    or a single-shared-file, or aggregating data into a number of files; to push data
    into the memory of another application using memorytransfers, or pull data from
    another application, and so on. The actual method for performing I/O can be selected
    at runtime in the application.


    The ADIOS-BP file format, which is used by file-based I/O methods, provides a
    self-describing data format, a log-based data organization, and redundant metadata
    for resiliency and performance. The log-based data organization allows for writing
    each process''s output data into a separate chunk of the file concurrently. ADIOS
    contrasts contiguous file formats where the data in the (distributed) memory of
    the processes has to be reorganized to be stored on disk according to the global
    logical organization. ADIOS-BP however eliminates (i) communication among processes
    when writing to data and (ii) seeking to multiply offsets in the file by a process
    to write data interleaved with written by other processes. While local buffering
    exploits the best available I/O bandwidth by streaming large, contiguous chunks
    of data to disk, the destination format itself avoids'
  merge: -1
  img_proc: true
- pgno: 247
  md: '# ADIOS 205


    common bottlenecks that would hamper performance. The many processes writing to
    different offsets in a file or to different files avoid each other on a parallel
    file system as much as possible. In most cases, each process attempts to write
    to a single stripe target to avoid the metadata overhead of spanning storage targets.
    The read performance of this file format was shown to be generally advantageous
    by Lofstead et al. [10].


    # 17.3 Deployment, Usage, and Applications


    # 17.3.1 Checkpoint/Restart


    Most applications face the I/O bottleneck when they are running at scale and need
    to perform checkpointing. Writing checkpoint data represents two classes of I/O:
    write (1) large or (2) small amount of data, stored in many variables, from every
    process of the application. In both cases, buffering helps decrease the amount
    of individual write operations, avoiding I/O latency and utilizing the available
    I/O bandwidth. In both cases, aggregation is required to decrease the number of
    entities hitting the file system at the same time. ADIOS has consistently improved
    all large-scale applications'' checkpoint writing (and reading) performance by
    10-100x and also allows for writing checkpoint data of size of multiple terabytes
    at a time with acceptable I/O overhead, as reported in Lofstead et al. [10, 11].


    An application, however, does not need to run on tens of thousands of cores to
    experience I/O bottlenecks. For example, one application is Fine/Turbo, a Computational
    Fluid Dynamics (CFD) code from Numeca International, which is used in industrial
    engineering. This CFD simulation simulates billions of cells to get new insights
    in turbulent behaviors. The irregular topology of a specific simulation is partitioned
    into small 3D blocks. Its load-balancing algorithm divides the blocks and the
    variables on each block so different variables in a block have different processes
    assigned. The original sequential I/O could not scale up to thousands of cores.
    Collecting all data on a single core led to high communication overhead. Attempts
    to write in parallel, while retaining each variable of block organized on the
    disk as a contiguous block of data, led again to too much communication between
    processes.


    ADIOS provided the optimal solution to the writing problem. Each process dealt
    with its own I/O, thus completely avoiding cross-communication among the processes.
    The data on each process was buffered locally. Then, because of the ADIOS-BP format,
    data was written into a separate segment of the output file, that is, with one
    write request with a single seek in the output. The original sequential I/O took
    2000 seconds to complete writing (a smallish) 18 GB of output of a 500-million-cell
    simulation running on 1280 cores. ADIOS,'
  merge: -1
