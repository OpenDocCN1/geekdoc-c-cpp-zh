    nodes with 1,331 nodes for I/O. Compute processes sense dataset to be written
    to disk the I/O using standard MPI calls. The compute processes continue their
    workload without waiting for the I/O complete. This concurrency ensures that the
    code is not I/O bound and maintains the overall job performance at optimal levels.
    A process blocks only when it is ready to send the next dataset to the I/O process
    but the I/O process has not yet completed writing the previous dataset. It is
    imperative for the I/O processes to complete writing the dataset before the compute
    process is ready with the next dataset. This minimum throughput, which is required
    to be maintained to guarantee that processes never wait on a write operation,
    is referred to as "Required I/O." If the Required I/O cannot be maintained, the
    performance of the code measured in GFLOPS drops from its optimal value and the
    code becomes I/O bound. Any decrease in GFLOPS indicates a possible I/O problem
    encountered during the job''s runtime.


