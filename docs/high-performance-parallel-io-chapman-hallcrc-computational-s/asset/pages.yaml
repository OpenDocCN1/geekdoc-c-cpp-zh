    the metanone. On the other hand, the common cases of reader-only readers, writer-only
    writers, or reads and updates within an existing file with no size changes, can
    run concurrently without any node lock conflicts. For applications that do not
    require accurate mtime, GPFS offers a “stat-lite” option that propagates mtime
    changes asynchronously and handles stat calls for access time (atime). Furthermore,
    in the common case of a single file, the node writing to the file becomes the
    metoda for the file, and therefore incurs no additional overhead for sending metadata
    updates over the network.


    When writing a file or extending an existing file, each node independently allocates
    disk space for the blocks it writes. For this purpose, byte-ranges are rounded
    up to block boundaries, so only one node allocates storage for particular data
    block. The block allocation map, which records the allocation status (or in-use)
    of all blocks in the file system, is divided into a large, fixed number of separable
    regions; and each region contains the allocation status of a fraction of the blocks
    on every disk in the file system. Hence, access to a single region with enough
    space is sufficient for a node to properly stripe the file it writes across all
    disks. One of the nodes in the cluster acts as the allocation manager, which collects
    free statistics about all allocation regions and provides hints about which to
    try whenever a node runs out of disk space in the region it is currently using.
    To the extent possible, the allocation manager prevents lock conflicts between
    nodes by directing different nodes to different regions.


    # 9.2.3.3 Concurrent Directory Updates


    To support efficient lookups in very large directories, GPFS uses extensible hashing
    to organize entries within a directory. The directory block that contains the
    entry for a particular file name can be found by hashing the name and using the
    n-order bits of the hash value as the block number, where n depends on the size
    of the directory.


    Handling directory updates in a cluster efficiently poses a challenge, because
    write sharing for directories is more common and much finer than regular files.
    Each file can create or delete updates a single entry in a directory block that
    can hold thousands of entries, and there is little locality because hashing randomizes
    the placement of directory entries. Hence, when concurrent directory updates are
    detected, GPFS switches to a finer-grained locking mode, where a directory operation
    locks the hash value of the file name being inserted or deleted instead of the
    directory block being updated. This allows creates and deletes of different files
    to proceed concurrently, even if the associated directory entries fall in the
    same directory block, while properly synchronizing concurrent operations on the
    same file name. The metoda collects the directory updates from multiple nodes
    and writes the modified directory blocks to disk.


