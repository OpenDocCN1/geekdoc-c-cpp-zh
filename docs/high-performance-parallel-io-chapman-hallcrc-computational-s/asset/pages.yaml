    # 2.2.2 Storage Network


    Starting more than a decade ago, NERC established one of the largest HPC fiber
    channels (FCs)-based storage area networks (SANs). Although fiber channel technology
    was highly priced, it was the only truly lossless and full-bandwidth medium offered
    for storage systems. The FC SAN provided full bandwidth access to storage in the
    NGF file systems from every computational system at the facility, however, the
    FC increase from 8 Gigabit (Gb) to 16 Gb took a long time to be generally available.
    In the meantime, 40 Gb IB lacks significant features that would make it an obvious
    choice for next-generation storage area networks, many HPC facilities, NERC included,
    are building next-generation storage networks using IB technology.


    Many facilities Ethernet as their storage protocol for providing bandwidth, but
    spent significant effort tuning it to approach streaming performance over a lossy
    network technology. Storage systems require lossless network technology for achieving
    their full bandwidth capacity. The NGF file systems have a secondary, 10 Gigabit
    Ethernet (GigE) network interface. Having the capability to use distinct failover
    networks is a significant feature of the General Parallel File System (GPFS),
    discussed in Chapter 9.


    For the centwide file systems, many of the computational systems at the facility
    have I/O nodes that help route traffic between the computational system interconnect
    (a mix of proprietary and IB connections) and the SAN, which is a mix between
    FC and IB. The centwide file system is redundantly'
