  md: 'Parallel Computing Trends for the Coming Decade 331


    Much current computer architecture research is focused on dealing with soft errors
    in the datapath (logic soft errors) as well as the traditional challenges faced
    in memories. Many nanoscale memory devices rely on different physical mechanisms
    than charge storage and provide opportunities to “harden” critical parts of a
    datapath or memory to upset events. Furthermore, they are non-volatile and can
    enable processors to become tolerant of sudden power supply interruptions. This
    can be exploited to reduce the power-down and power-up transients of processors,
    allowing them to be idle with their supplies turned off at short intervals. The
    challenges to reliability for future device technologies are discussed in detail
    in Chapter 31.


    # 29.3 Conclusion


    The changes to underlying technology characteristics result in fundamental re-evaluation
    of computer architecture where decisions have been largely based on previous component
    technology limitations. The new technology offers new features that would fundamentally
    change architectural choices that are deeply ingrained in the current computer
    industry. Fundamental computer architecture decisions are based on physical constraints
    of the underlying components used to implement the architecture. Our challenge
    is to reconceptual computer architecture and storage models for technology that
    will need to be developed for the next 10+ years.


