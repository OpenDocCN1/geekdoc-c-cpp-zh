  md: '# Integrated Performance Monitoring


    diverge from their sketches as benchmarks. That is observed in the few systemwide
    profiling studies conducted on production HPC is an indication that the performance
    tools community may do well to shift its perspective to one of sustained performance
    in a production setting.


    In order to target workload-level improvements in I/O, it is useful to prioritize
    the opportunities for analysis by their contribution to the overall core hours
    expended by the workload. One such prioritization is given in Figure 26.7 where
    a treemap organized by core hours vs. user and concurrency clarifies that some
    profiles are worth more attention than others. Both function-level profiles and
    user-concurrency pairs do not conclusively segment the workload by distinct applications.
    In practice on production machines, such as those at NERSC, one can find clear
    I/O performance patterns using such filters. Performance profile classes that
    are sufficiently similar and persist across many points to I/O strategies that
    need to be improved at the application level or in user environment settings.
    Figure 26.4 shows such a single code run on 128 tasks by a single user. The I/O
    strategy shows persistent load imbalance between MPI ranks with some transacting
    substantially more I/O than others. In other IPM case studies, several many-few
    and many-to-one I/O strategies are identified with less optimal I/O rates.


    # 26.3 Conclusion


    Profiling I/O through the interception of POSIX-I/O calls provides a scalable
    and generalizable path to understanding application I/O performance. Examples
    of using IPM for this purpose demonstrate some commonly countered aspects of I/O
    consideration to improve performance. This technique is shared by other tools
    like TAU (Chapter 25). Darshan (Chapter 27), among others; and the performance
    analysis is generalizable to other tools that provide trace or profile of POSIX
    calls. Root causing I/O performance with a single tool can be complex. Some approaches
    involving [10, 8] simultaneous profiling of application and file system have been
    explored to allow more conclusive determination of I/O in relation to file capabilities.
    I/O bottlenecks that have their origin within an application or arise from persistent
    contention for I/O can be addressed without a specific root cause. POSIX-I/O calls,
    as demonstrated in the above examples, provide sufficient visibility into I/O
    performance to improve performance. By addressing sources of load imbalance and
    scalable I/O, better strategies can be implemented for applications and workloads.
    IPM focuses on achieving such I/O gains in the context of production HPC applications
    and workloads, because computers should be fast for a reason.'
