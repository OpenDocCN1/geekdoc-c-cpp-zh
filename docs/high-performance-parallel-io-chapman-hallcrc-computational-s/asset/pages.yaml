    # 24.6 Conclusion


    In summary, in order to do optimal performance from a complex I/O subsystem, it
    is useful to do I/O benchmarking and I/O application profiling. Benchmarking allows
    an HPC analyst to understand the performance of an I/O subsystem, while I/O profiling
    shows an application developer details about an application''s I/O patterns that
    can illuminate how to improve performance.


