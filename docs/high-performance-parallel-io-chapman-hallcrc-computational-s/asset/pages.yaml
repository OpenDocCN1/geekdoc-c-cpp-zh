    # 5.7 Sequoia I/O in Practice


    # 5.7.1 General Remarks


    The Blue Green series of systems from IBM is a departure from previous systems
    and the cost-effective Linux systems (peloton, TLCC1, TLCC2) in that I/O calls
    are shipped from the large set of compute nodes to a smaller set of I/O nodes
    performing I/O and other system services. This organization leads to an I/O subsystem
    which is relatively low in comparison to the TLCC2 systems where every compute
    node can perform I/O operations. This is a likely view of future HPC systems,
    including possible future generations of TLCC systems, for example. For those
    systems, configuring I/O nodes which are more capable in memory, processors, and
    even connectivity, rather than sticking so closely to the IBM scaling architecture,
    might be more worthwhile..


    On Sequoia, overall balance between Lustre client capability, network, and disk
    system performance is good. Generally, the Lustre client software is LC''s'
