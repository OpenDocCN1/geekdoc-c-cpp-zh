    Intent requests were added to avoid lock ping-pong on highly contended resources.
    The initial lock request for a resource will also contain sufficient information
    (i.e., the client''s request for enrolling the lock) to execute the request on
    the server if the lock is contended. If the server chooses to execute the client''s
