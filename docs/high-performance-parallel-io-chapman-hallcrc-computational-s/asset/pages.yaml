- pgno: 174
  md: '# High Performance Parallel I/O


    OrangeFS builds and runs directly on a Linux installation and requires no kernel
    patches or specific kernel versions. It operates on a wide variety of systems,
    including IA32, IA64, Opteron, PowerPC, Alpha and MIPS. It is easily integrated
    into local or shared storage configurations and provides support for high-end
    networking fabrics, such as Infiniband and Myrinet. OrangeFS is scalable, allowing
    the addition of storage servers to provide both additional disk space and improved
    I/O performance [7]. Hardware failover provides services for large storage systems.
    Some installations allow additional redundancy, and smaller installations want
    without the high cost of hardware solutions. OrangeFS is developing configurable
    redundancy and failover mechanisms as part of the file system. These allow different
    files to have different levels of redundancy as required by the application and
    also allow file system redundancy to be turned off for maximum performance. Currently,
    files marked immutable can be replicated.


    # 10.3.1 Cluster Shared Scratch


    OrangeFS is a highly efficient file system for scratch space, where it essentially
    provides a working directory for computations to read or write files that are
    too large for local storage. It is a temporary file system for actively running
    jobs. When used as shared scratch space, OrangeFS provides access to the same
    input files and a location to store intermediate and output files for all nodes
    involved in a computation job. Job workflow involves staging data into and out
    of the scratch file system to another location for permanent storage. For the
    many jobs that create a large amount of temporary or intermediate data, a scratch
    file system can provide higher capacity than archived production file systems.
    OrangeFS supports Global Namespace, which provides a consistent file system view
    to all compute nodes, allowing multiple compute nodes to read and write to the
    same input and output files.


    # 10.3.2 Cluster Node Scratch


    Cross-node scratch space is similar to shared scratch space, only no persistent
    is required. Instead, an OrangeFS file system is created only for the duration
    of a job. Part of the scripting for a cross-node scratch job includes setting
    up the file system. After nodes are allocated to the job, one or more is identified
    to run OrangeFS servers, where the server software is installed. Storage areas
    reside on local disks on the server nodes. Client software is installed on nodes
    used to access the file system. Typically, scripts perform cleanup functions at
    the end of a cross-node scratch space job. This would include steps to copy results
    from the temporary file system to permanent storage and tear down the temporary
    file system.'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# 10.3.3 Amazon Web Services


    OrangeFS now provides a scalable storage solution for cloud cluster computing
    on Amazon Web Services. Amazon Marketplace provides easy access to two options:
    OrangeFS High Performance Cloud Storage—Community and OrangeFS High Performance
    Cloud Storage—Advanced (provisioned IOPS). Both configurations are in 4-, 8- and
    16-instance OrangeFS storage clusters that can be leveraged for various big data
    and HPC applications.


    # 10.4 Conclusion


    OrangeFS is an open-source high performance cluster file system. As the next evolution
    of PVFS, it continues the tradition of community development, user-level coding
    to make it easy to integrate and maintain, and high levels of parallelism in both
    data and metadata access. OrangeFS has worked to extend this to new application
    areas with a rich collection of user interfaces for operating systems and development
    environments, improved security, professional documentation, better metadata parallelism,
    and the availability of commercial support. One of the most cited features is
    how easy it is to obtain, build, and install OrangeFS. The design focuses on performance
    in some cases relaxing POS consistency semantics, but above all it is driven by
    users'' needs. OrangeFS is maintained by a dedicated development team, and continues
    to be used extensively for research in universities due to its clean design and
    modular structure. The latest developments, Version 3, will extend OrangeFS into
    exascale with built-in replication, dynamic server management, support for remote
    sites, and policy-based distribution of data and metadata. OrangeFS remains one
    of the earliest community developed parallel file systems and a leader in bringing
    the latest technologies to bear.


