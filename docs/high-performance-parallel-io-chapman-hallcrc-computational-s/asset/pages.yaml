    allow repeated requests to be identified and the server retains a copy of the
    RPC buffer until it has positive confirmation that the reply was received by the
    client.


    The server also includes both the OSD transaction number in the request was executed
    and the OSD''s last_committed transaction number in RPC replies. Clients retain
    the RPC request and buffers until the OSD transaction associated with the request
    has been committed to persistent storage so that the request can be replayed in
    the event of server failure.


    # 8.2.3 Distributed Lock Manager


    The Lustre Distributed Lock Manager (DLM) enables Lustre clients and servers to
    serialize conflicting file system operations and ensure cache coherence. Every
    Large storage target provides this service so that locks are co-located with the
    objects they protect and total concurrency scales with the number of storage targets.
    Lustre clients hold locks on behalf of the entire kernel—effectively aggregating
    lock requests by all client processes which are serialized in the VFS.


    The design of the DLM was based on the VAX/VMS Distributed Lock Manager [14] in
    which named abstract resources can be locked in a variety of controls to how corresponding
    physical resources may be accessed. For example, protected locks are mutually
    compatible and are used to permit read-only access to a shared resource, while
    protected write locks are used by clients to cache dirty data, and exclusive locks
    are incompatible with all locks other than null and are therefore used by servers
    to modify a resource and invalidate the caches of all other locks.


    The VAX/VMS DLM also provides so-called Asynchronous System Traps (ASTs) for notification
    when locks are granted if the lock could not be granted immediately upon request
    or when granted block other lock requests. The DLM implements these using a callback
    locking scheme that minimizes unnecessary communication by allowing Lustre clients
    to continue to hold locks protecting their caches until a lock actually occurs.


    Each lock may also have a Lock Value Block (LVB) that contains information about
    the resource being locked (e.g., size, blocks, and timestamps) that is passed
    along with the granted lock to avoid an extra RPC to fetch commonly used state.


    The DLM added some new features to the original VAX/VMS functionality to further
    increase efficiency. Extent locks enable Lustre clients to lock byte ranges within
    OST objects to support shared file I/O by allowing different clients to cache
    different extents of the same object. In the case of an uncontended or highly
    contended resource, the extent locking'
