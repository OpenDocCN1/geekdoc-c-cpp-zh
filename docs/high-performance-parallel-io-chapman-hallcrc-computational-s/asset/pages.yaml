  md: '# High Performance Parallel I/O


    # 29.1 Technology Scaling


    # 29.1.1 Classical Scaling Period (1965–2004)


    In 1965, Gordon Moore famously observed that the number of components on an integrated
    circuit had been doubling every year since the introduction of this technology
    in 1969.¹ Shrinking the dimensions on an integrated structure also made it possible
    to operate the structure at higher speed for the same power per unit area, so
    that maintaining functionality would improve exponentially with time at nearly
    constant cost generation. This latter observation commonly referred to as Dennard
    Scaling because it was formalized and extended in Robert H. Dennard of IBM.² From
    1965 to approximately 2004, Dennard Scaling enabled exponential increases in performance
    over a period of three decades. This offered a compelling benefit in that software
    could remain relatively stable and execute substantially faster with every new
    technology generation. As a result, commercial software infrastructure is designed
    for serial computation. Throughout this period, parallel computing remained a
    fringe activity, conducted in the national laboratories, universities, and a few
    leading companies.


    These scaling are primarily associated with computing technology, but also relate
    to improvements in storage technology as we move forward. Disk storage densities
    are primarily limited by the supermagnetic limit, but with vertical recording
    methods, the size of the magnetic head for a disk unit is closely related to Moore’s
    improvements in fabricating these devices at smaller scale. As the industry moves
    away from magnetic disk technologies, FLASH and other solid-state technologies
    also depend upon the same lithographic advances used to improve logic density
    that they can improve storage density. The improvements in lithographic density
    underpin storage density and cost improvements for the past two decades.


    # 29.1.2 End of Classical Scaling (2004)


    Although Moore’s Law has continued to enable us to increase logic and storage
    densities at historical rates (as shown in Figure 29.1), by 2004 it was no longer
    feasible to scale voltage down with lithographic feature size to physical limits
    relating to the underlying materials'' characteristics. As a


