  md: '# High Performance Parallel I/O


    The HPSS data movers are dedicated Dell R720 servers with dual Intel Sandybridge
    processors and 256 GB of memory. Each processor has 16 cores per. The data movers
    manage the movement of the data from one storage to another network, disk, and
    tape. Each mover is connected to eight tape drives, the disk cache fabric, and
    has two 40 GigE network cards. The Dell U720 system was chosen on the number of
    PCIe cards that could be placed within the system while maintaining performance
    to all attached devices and networks. The usable 1.2-PB disk is used for the archival
    data movement and data transfers. The environment has two large core servers to
    manage the DB2 database with all the metadata.


    The near-line storage subsystem provides over 300 usable petabytes to science
    and engineering teams with an aggregate bandwidth of about 100 GB/s. The physical
    robotic units have a capacity of over 500 PB if needed. The Waters Project has
    an operating budget at current costs to provide 380 petabytes of tape cartridges
    for the course of full service operations. The implementation of will will use
    about 22% of the raw capacity to provide protection from simple points of tape
    failure.


    RAIT technology, developed by NCSA and the HPSS consortium as part of the Waters
    Project, is a new feature that provides data integrity and protection through
    striped parity technologies. RAID avoids the traditional method of protection
    from tape errors that duplicates all data on two or more tapes (also known as
    RAID-1). With media costs in the $16M range for 500 PB of data, an additional
    $16M cost for protection was not feasible for most of the scientific data. RAIT
    provides a variety of data and parity combinations from two data blocks plus one
    parity block written to three tapes, up to eight data plus eight parity 16 tapes,
    depending on the data size and degree of redundancy for multiple failure. Data
    is written in a RAID-5-like form with data and parity blocks across all tapes
    ensuring that the tapes are generally the same length and amount of data written
    to.


    NCSA utilizes two service classes utilizing RAIT. Large files are written in a
    4+1 RAIT configuration and the large-scale storage for files greater than 8 TB
    are written directly to tape in a 7+2 RAIT configuration. The 7+2 utilizes the
    media cartridge holder capacity of the SpectralLogic library which holds nine
    TS110 tapes. A single mount request brings all nine tapes to the tape drives in
    one robotic motion, which provides less latency for mounting nine tapes before
    a write can begin.


    Blue Waters intends to integrate the on-line and near-line storage subsystems
    into a transparent hierarchy using new features in Lustre 2.5. This will enable
    users to see a single storage repository namespace that transparently moves the
    data they need between online and near-line subsystems so the data is “in the
    right place at the right time.” These features will enable more efficient use
    of the storage resources and more science productivity.'
