- pgno: 96
  md: '# 5.3 Lustre® 2.0, and ZFS


    Historically, Lustre supported ext4/1diskfs servers, but as early as 2007, the
    Livermore Lustre began to question its viability for the Sequoia era (and beyond)
    due to variety of scalability and performance issues. ZFS was identified as technically
    the best solution and work proceeded with much of the effort of the initial port
    of ZFS from Solaris to Linux being done at Livermore [15, 14].


    Some of the logic for porting ZFS is as follows: previous Lustre servers used
    ext4 (ldisks), where the performance of the random writes were bounded by disk
    IOPS rate, not by disk bandwidth; OST sizes were limited; fick time was unacceptable;
    expensive hardware was required to make disks reliable, but with the new technology,
    expensive RAID controllers were unnecessary. In 2011, new systems were being deployed
    that required 50 PB of high performance storage. LC had new requirements for throughput:
    51 GB/s to 1 TB/s. LC also needed implement copy-write to serialize random writes
    so that performance would no longer be bound by drive IOPS. In addition, the center
    needed single volume size of 16 EB, and zero fick time including data integrity
    and error handling.


    Extending Lustre to use a next-generation file system like ZFS allows the file
    system to achieve greater levels of scalability and introduces new functionality.
    With the new ZFS Lustre server features include data integrity, pooled storage,
    snapshots, compression, and copy-on-write. With the data integrity features in
    ZFS, data is always checksumed and self-repairing to avoid silent corruption.
    Pooled storage allows easy aggregation of multiple devices into a single OST.
    (The capacity features gave a 256 TB--OST size enabling larger servers.) Snapshots
    of the Lustre file system are stored prior to maintenance and updates. In addition,
    transparent compression increases the total usable capacity. Finally, copy-on-write
    improves performance by transforming random I/O into sequential I/O.


    Using ZFS with Lustre was a major undertaking. Kernel support for ZFS on Linux
    was not available, so LLNL undertook the significant effort required to make that
    a reality. The Lustre code itself had grown tightly coupled to ldiskfs, and another
    significant programming effort was funded by LLNL to create for an abstracted
    OSD in Lustre. This allowed Lustre to interact with any file system for which
    an OST layer is created, and allowed Lustre to initially support both ldiskfs
    and ZFS. Lustre support for ZFS first appeared in Lustre version 2.4.0, released
    in May of 2013 [5].'
  merge: -1
  img_proc: true
