  md: '# High Performance Parallel I/O


    put() operator, and the visualization processes can asynchronously fetch relevant
    portions of the data using the corresponding get() operator. Note that these operators
    are independent of the scale and the distribution of these interacting applications.
    The internal data management mechanisms in DataSpaces ensure the scalability of
    the distributed data storage and lookup mechanisms. DataSpaces runtime builds
    on DART [5], which enables direct low-overhead, high-throughput memory-to-memory
    communication between the interacting nodes using Remote Data Memory Access (RDMA).


    DataSpaces implements a distributed query engine with simple and flexible queries
    to facilitate access to the data. An application component can query any data
    region from the global application domain, e.g., individual, or a range of data
    points. Extending the query builds higher-level data sharing and coupling abstractions
    to support complex and dynamic interaction and coupling patterns. Applications
    can query data on-demand, register to obtain continuous notifications of data
    availability, implement the publisher-subscriber programming paradigm, and share
    and redistribute data in a decoupled manner, and move analytics to the code.


    DataSpaces consists of two main components: a client module using the ADIOS/DataSpaces
    method, and a DataSpaces server module. The client is light weight and provides
    an asynchronous I/O (AIO) API. It is integrated with ADIOS and the functionality
    is exposed through the ADIOS read/write semantics, which bundles the variables
    of the same output together, so that reading applications can access a set of
    variables of an output step consistently just like when reading from files.


    ADIOS/DataSpaces is currently used in production in coupled scientific simulation
    workflows on large-scale supercomputers. For example, as part of the fusion simulation
    framework described by Docan et al. [7] (see Figure 17.1), DataSpaces enables
    memory-to-memory coupling between the kinetic particle-in-cell edge code XGC0,
    and the MHD code M3D-OMP. Similarly, as part of the turbulent workflow by Bennett
    et al. [1], DataSpaces enables data coupling between the direct numerical simulations
    (DNS) code S3D and the data analytics pipeline.


