    # 13.2.1 Three Ways of File Access


    MPI supports three ways of specifying the location from which data is accessed
    in a file. The first method is by using individual file pointers, as in the example
    above. In this case, each process maintains its own file pointer, independent
    of other processes. The file pointer can be moved to a specific offset in the
    file by calling MPI_File_seek. The following call to MPI_File_read or MPI_File_write
    will data starting from the current location of the individual file pointer. The
    file pointer will be incremented by the amount of data read or written by the
    read/write call.


    An alternate is by using explicit offsets. No seunction is needed in this case.
    Instead, the user calls the functions MPI_File_read_at or MPI_File_write_at. These
    functions take the file offset as an argument. The individual file pointer is
    not affected by reads or writes using these functions.'
