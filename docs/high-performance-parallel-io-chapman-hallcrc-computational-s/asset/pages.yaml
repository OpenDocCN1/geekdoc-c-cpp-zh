    # 9.2.3 Distributed Locking and Metadata Management


    # 9.2.3.1 The Distributed Lock Manager


    The GPFS distributed lock manager uses a collection of global lock managers running
    on a designated subset of nodes in the cluster, in conjunction with local lock
    managers in each file system. For each file, directory, or other file system object,
    a hash of the ID is used to select the global lock manager nodes to coordinate
    distributed locks for that object by handing out lock tokens. Once a node has
    obtained a token from the global lock manager responsible for the object, subsequent
    operations accessing the object on that node can lock the object locally, without
    requiring additional network communication. Additional network communication is
    only necessary when an operation on another node requires a conflicting lock on
    the same object.


    Locks token also serve as the mechanism for maintaining cache consistency between
    nodes. A "read-only" token may be shared among nodes and each token holder to
    cache objects it has read from disk. An "exclusive-write" token may only be held
    by one node at a time and allows the node to modify the object in its cache. When
    a write token is revoked or downgraded to read-only mode, GPFS waits for local
    locks to be released and commits local changes to disk before allowing the token
    to be granted to another node. This serializes reads and writes to support the
    POSIX semantic that ensures'
