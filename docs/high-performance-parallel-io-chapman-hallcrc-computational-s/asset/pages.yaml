    a system over 217 TB of memory. It employs the Gemini interconnect with a 3D torus
    topology.


    Hopper has two identical Lustre parallel file systems: /scratch and /scratch2:
    each has a peak performance of 35 GB/s and a capacity of 1 PB. The Lustre file
    system is made up of an underlying set of I/O servers and disks called Object
    Storage Servers (OSSs) and Object Storage Targets (OSTs), respectively. Each /scratch
    file system has 26 OSSs and 156 OSTs. When a file is created in /scratch it is
    “striped” or split across a specified number of OSTs. The default stripe count
    on Hopper is 2 and the default stripe size is 1 MB.


    # 19.4.2 Software Setup


    The study used Cray''s MPI2 library (xt-mt 5.1.2) for running VPIC. The I/O module
    used HDF5 version 1.8.8 and the particle data is written with H5Part version 1.6.5,
    along with Cray''s MPI-I/O implementation. H5Part is a veneer API built on top
    of HDF5 improving the ease of use for writing particle data.


    # 19.5 Parallel I/O in VPIC


    VPIC uses 20,000 MPI processes, where each MPI process spawns 6 OpenMP threads
    to perform computations.¹ An overview of the VPIC simulation setup on Hopper is
    shown in Figure 19.1. Each OpenMP thread runs on a CPU core and the total amount
    of CPU cores in this simulation is 120,000. The figure also shows MPI-I/O aggregators
    to collect data from multiple MPI domains before writing to the Lustre file system.


    To write the particle data, the study uses an extension of HDF5 H5Part [8]. Parallel
    HDF5 has demonstrated competitive I/O rates on modern computational platforms².
    The H5Part improves the ease of use in managing large particle counts. H5Part
    is a veneer API for HDF5: H5Part files are valid HDF5 files and are compatible
    with other HDF5-based interfaces and tools. By constraining the use case to particle-based
    simulations, H5Part is able to encapsulate much of the complexity of implementing
    effective parallel I/O in HDF5. That is, it trades off HDF5’s


