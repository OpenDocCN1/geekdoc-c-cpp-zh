    # 8.2.5 Metadata Server


    Metadata Server (MDS) nodes export one or more Metadata Targets, each of which
    is stored on a single underlying OSD. The MDTs are typically stored on RAID 1+0
    storage arrays that provide good I/O performance, such as high-RPM disks or solid-state
    storage. The MDTs contain the application-visible file system metadata (filenames,
    directories), as well as file access (ownership, permissions, ACLs), file layout,
    and other attributes.


    The MDS controls object selection and assignment for load balancing, unless specified
    by the client/application. In order to reduce latency at open/create time, the
    MDS pre-allocates objects of the available OSTs and chooses objects from this
    pool when a new file is created. This also ensures that the file''s layout can
    be created in a single atomic transaction, which avoids a complex distributed
    operation for each file.


    To allow tuning of a file layout optimally for I/O patterns, it is possible to
    specify a different file layout (number of OST stripes, stripe size, OST storage
    pool) independently for each file. However, for simplicity it is possible to specify
    a default file layout for parent directories that is inherited by new files created.


    After a file is opened, the MDS does not participate in client I/O operations
    until the file is closed. To avoid repeatedly modifying the OST objects during
    read operations, a file''s access is cached in memory on the client and OST objects.
    It is only written to the MDS node at close time.


    When a file is unlinked from the MDS namespace, its node and MDT objects may be
    destroyed only after the last process holding the file opens or closes it. Lustre
    therefore keeps a persistent reference on the MDT node until the last close in
    case the MDS restarts with unlinked files. The destroy RPCs are logged in the
    same transaction that removes the MDT node, but only when sent that transaction
    commits to ensure that a rollback of the pending MDT unlink does not resurrect
    references to now-destroyed objects.


