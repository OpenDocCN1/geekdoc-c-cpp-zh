- pgno: 45
  md: '# # Chapter 1


    # ## Parallel I/O at HPC Facilities


    Galen Shipman


    Oak Ridge National Laboratory


    Modern high performance computing facilities deliver computational and data resources
    to an ever broadening set of scientific and engineering domains. What was once
    a cottage industry just two decades ago, HPC is now integral to studies ranging
    from biology to materials science and everything in between. These domains are
    using simulation at ever increasing scales by increasingly higher resolution models
    with more accurate representation of physical processes. This confluence has resulted
    in the build-out of extreme-scale HPC facilities with platforms composed of hundreds
    of thousands of cores, high performance networking infrastructures, and parallel
    I/O environments capable of scaling to terabytes/second of I/O bandwidth while
    providing petabytes of capacity.


    To meet the required performance and capacity levels of modern HPC facilities,
    these large-scale parallel I/O environments may comprise thousands or tens of
    thousands of hard disk nodes, thousands of networking ports, and several hundred
    storage servers. These components are then integrated into usable systems using
    complex software stacks beginning with parallel file system technologies such
    as IBM''s General Parallel File System (GPFS); Lustre, Panasas, and the Parallel
    Virtual File System (PVFS). These parallel file systems have to be relied upon
    as both reliable and high persistent storage infrastructure. To maintain compatibility
    with the broadest base of applications while enabling high performance, each of
    these systems provides a POSIX interface while supporting concurrent access to
    one or more files from one or more compute nodes in the HPC environment. This
    ability to provide parallel access while retaining POSIX semantics has fueled
    the adoption of parallel file systems across HPC.


    While POSIX provides a ubiquitous interface for applications, the application
    developer is burdened with the increasingly complex task of mapping complex data
    structures that may span hundreds or even thousands of distributed memory compute
    nodes into one or more files. Many applications therefore make use of higher-level
    I/O libraries such as the Hierarchical Data Form (HDF), the Network Common Data
    Format (NetCDF), or the'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# High Performance Parallel I/O


    Adaptable I/O System (ADIOS) to bridge this gap between complex distributed-in-memory
    data structures to the underlying parallel file system. These libraries provide
    both a higher-level semantic than a simple byte stream while also optimizing parallel
    I/O operations to the underlying parallel file system environment.


    Complementing these high performance parallel I/O environments are large-scale
    archival storage systems like the High Performance Storage System (HPSS). These
    systems provide HPC facilities with the ability to manage hundreds of petabytes
    of tape and/or disk for long-term data storage. These systems balance performance
    and capacity by supporting automated tiering of data between tape and disk while
    providing high performance reading and writing to and from archive via parallel
    data movement nodes. In some cases, these large-scale archives are closely integrated
    within the parallel I/O environment through hierarchical storage management capabilities
    of the parallel file system and the archival system allowing datasets to automatically
    transition between these two distinct environments.


    Part I of this book details the parallel I/O environments of a number of representative
    high performance computing facilities. While the technologies employed may differ
    from facility, a great degree of commonality exists across these environments.
    In Chapter 2 the National Energy Research Scientific Computing Center (NERSC)
    facility is detailed including their use of multiple parallel file system environments
    for large-scale compute and a more general-purpose center-wide storage environment.
    Chapter 3 provides an overview of the National Center for Supercomputing Applications
    (NCSA), the first site in the United States to achieve over 1 Terabyte/sec of
    sustained parallel I/O bandwidth. The Argonne Leadership Computing Facility (ALCF)
    is detailed in Chapter 4, unique in its use of PVFS at such a significant scale.
    The Livermore Computing Center notable for their work to integrate the ZFS file
    system with the Lustre parallel file system. The Los Alamos National Laboratory
    HPC facility is highlighted in Chapter 6, an early proponent of center-wide accessible
    parallel file systems and the incorporation of burst buffers within the parallel
    I/O environment. Finally, we conclude Part I on HPC facilities with an overview
    of the Texas Advanced Computing Center, an early adopter of commodity storage
    systems and software-based RAID within the parallel I/O environment.'
  merge: -1
  img_proc: true
