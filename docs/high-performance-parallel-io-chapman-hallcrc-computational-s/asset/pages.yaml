  md: '# High Performance Parallel I/O


    storage subsystem integrates Scalable Storage Units (SSU) that each has two industry-standard
    x86 Embedded Server Modules (ESMs) based on the Intel Sandybridge processors.
    The ESMs connect directly through a common midplane to all drives in the SSU and
    share a redundant high-speed interconnect across the midplane for failover services.
    The ESMs run an industry-standard Linux distribution and each module has its own
    dedicated CPU, memory, network, and storage connectivity.


    Each SSU contains eighty-two, 2-TB, 7200-RPM NL-SAS drives housed in two trays.
    Eighty drives are configured in RAID 6 (8+2) arrays resulting in 64 usable data
    drives. The other two drives in the SSU are hot spots. Each SSU has two 100-GB
    SSDs for OS metadata and two OSS servers. Together, the metadata and object servers
    present file systems to clients.


    The Xeon CS-1600 Management Server (MGS) stores configuration for all Lustre servers
    in Blue Waters. Each Lustre client rely on the MGS to provide information. Metadata
    Servers (MDS) make metadata available to Lustre clients from the Metadata Target
    (MDT). The MDT stores file system metadata (filenames, directories, permissions,
    and layouts) on disk and manages the metadata. The MDS provides request handling
    for the file system. The OSS enable file I/O service and network request handling
    for one or more local OSTs. The OST store data (files or chunks of files) on a
    single LUN (disk drive or array of drives). Cray XE6/XK7 Lustre clients, called
    LNETs, interface users to the Lustre file system. The client presents a POSIX
    file system interface to user-level applications running on compute/analysis nodes
    and is responsible for routing I/O requests, data, and metadata through the Cray
    XE6/XK7 LNETs implement the Lustre protocol between the Lustre servers in the
    CS-1600 cluster. Lustre networking between the Lustre client and the Lustre server.
    The LNET layer allows clients and servers to be executed on the same system (i.e.,
    direct attached Lustre) or for compute clients to communicate with external Lustre
    servers or Lustre appliances.


