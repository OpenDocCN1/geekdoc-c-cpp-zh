    # 6.4 Conclusion


    LANL is innovative in its implementation of an HPC infrastructure, as they are
    early adopters of parallel file systems, globally shared parallel file systems,
    and burst buffers; but this also may lead to future challenges. They pushed users
    to N-to-1 with a lot of self-describing information in their I/O, and the users
    have suffered poor performance, but middleware is now available that makes N-to-1
    perform well.


    One important part of LANL''s I/O strategy is to be involved in the national community.
    Some examples include:


    +   - Helping to coordinate the Path Forward activity to bring products, like
    Lustre and Pananas, to fruition;


    +   - Helping to coordinate the High End Computing Inter-Agency Working File Systems
    [1] and I/O effort that helped to form a large community around HPC I/O and storage
    issues;


    +   - Helping to coordinate the DOE Fast Forward Storage project [5], which targets
    prototypes for future I/O and storage solutions toward exascaleclass computing.'
