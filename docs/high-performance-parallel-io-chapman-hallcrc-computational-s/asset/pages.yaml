- pgno: 435
  md: '# Computer Science & Engineering


    # Chapman & Hall/CRC / Computational Science ecosystem.


    > While I/O has become a major performance bottleneck in high performance computing
    (HPC), no single reference allows practitioners to understand the complex interactions
    between applications, libraries, and file systems. This book fills this major
    gap; written by the best experts in the field, it is likely to become a necessary
    reference for anybody who wants to understand I/O on HPC platforms.

    —Marc Snr, University of Illinois at Urbana-Champaign


    Revealing the state of the art in this field, High Performance Parallel I/O draws
    on insights from leading practitioners, researchers, software architects, developers,
    and scientists who shed light on the parallel I/O ecosystem.


    The first part of the book explains how large-scale HPC facilities scope, configure,
    and operate systems. The second part covers the file system layer and the third
    part discusses middleware and user-facing libraries. Delving into real-world scientific
    applications that use the parallel I/O infrastructure, the fourth part presents
    case studies from particle-in-cell, stochastic, finite volume, and direct numerical
    simulations. The fifth part gives an overview of profiling and benchmarking tools
    used by practitioners. The final part of the book addresses the implications of
    current trends in HPC on parallel I/O in the exascale world.


    # Features


    +   - Shares the perspectives of leading HPC experts from Argonne, Berkeley, Livermore,
    and Oak Ridge National Laboratories, as well as many other prestigious institutions

    - Examines the design, architecture, and application of today''s most prominent
    file systems: Lustre, GPFS, OrangeFS, and OneFS

    - Provides insight into the design decisions made by library and application developers

    - Shows how careful profiling and optimization are essential for obtaining peak
    and sustained parallel I/O performance

    - Explores potential solutions to I/O challenges in exascale computing


    ![](img/e2df60633eace5d7f248335c7c97063d_435_0.png)'
  merge: -1
  img_proc: true
