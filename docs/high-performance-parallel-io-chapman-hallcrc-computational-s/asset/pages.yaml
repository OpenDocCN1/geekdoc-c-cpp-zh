  md: '# 7.2.2 Parallel File Systems—A Shared Resource


    Often, ideal measurements, under ideal conditions, are the type that used to quote
    file system performance for a given system. However, from a user perspective,
    it is important to understand that these peak numbers may not be indicative of
    the level of performance they can expect to achieve in a multi-user, production
    system environment. Indeed, on most HPC systems, the file system is truly a shared
    resource; one which the instantaneous performance is influenced by how many users
    are accessing the file system and what type of workloads they are performing.
    Consequently, when estimating application requirements, users are recommended
    to pad the I/O portion of their code to account for variability introduced by
    using a shared I/O resource. To quantify the level of variability on a system
    with thousands of users, daily performance rates were sampled across two intervals
    during the first 8 months of Stampede''s production. The first sampling interval
    corresponds to measurements taken immediately after the system went into production
    in January 2013 (and includes approximately two months worth of data). These were
    submitted daily as normal user jobs into the Simple Linux Utility for Resource
    Management (SLURM) queuing system [3]. Although they were submitted at the same
    time each day, they ran at different times depending on the availability of resources
    to schedule the job. Each job wrote 4 TB of data from 512 hosts to individuals,
    and two types of runtime performance were monitored: aggregate and throughput.
    The aggregate performance number corresponds to the total time required to complete
    all 4 TB of data. Since it is aggregated across all, the value can be reduced
    in the case where one or more others are slower than others due to usage by the
    other users. In contrast, the throughput number is based on the time required
    for each client to write only its portion of the 4-TB total. This value is generally
    higher than the aggregate performance number as the measured timings are not synchronized
    across all writes.


    7.5(a) presents a time history of the I/O results beginning in January 2013 and
    extending through mid-March. From these results, the level of variability on a
    shared I/O resource can be seen, particularly in the aggregate performance results
    where the difference can vary by more than a factor of two. The average performance
    over the 65 measurements during this period was 110 GB/s, but a general decline
    is observed over this initial period after the system entered production. Although
    system utilization was ramping up during this frame, which explains some of the
    decline as more users accessed the shared I/O resource, another contributing factor
    was the fragmentation associated with the file system filling up. Figure 7 shows
    the WORK and SCRATCH file systems during the first three months of operation and
    illustrates a rapid increase in usage to over 1 PB in approximately two months
    for SCRATCH. This fragmentation is another common contributor to the difference
    typical'
