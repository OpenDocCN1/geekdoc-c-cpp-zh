    # 25.4 Conclusion


    Understanding the performance of software packages in combination with the applications
    in which they are used requires an ability to capture important events and performance
    data at the library interfaces. This is particularly true for I/O. Here, several
    techniques for creating wrapper libraries were presented with the TAU performance
    system. These techniques were then demonstrated for tracking I/O that was performed
    by the GCRM application on a Cray XE6 system. This work has been instrumental
    in improving I/O performance in the GCRM application.


